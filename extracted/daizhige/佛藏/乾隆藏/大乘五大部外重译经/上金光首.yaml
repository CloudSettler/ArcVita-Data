  dilemmas:
  - 沉溺游逸爱欲与寻求清净解脱之间的抉择
  - 执着色身庄严与体认五阴如幻本净之间的迷悟
  lesson: 尘欲本净色空平等，觉了五阴如幻即是道场，不坏欲而证菩提
  summary_first_person: 我本王舍城逸女，姿容端正人皆悦慕，游逸自纵而心系爱欲，幸于游观园道逢文殊师利，蒙其开示五阴如幻、道即汝身之理，方知欲性本空，遂舍染着发无上正真道意，愿以清净慧照破颠倒
