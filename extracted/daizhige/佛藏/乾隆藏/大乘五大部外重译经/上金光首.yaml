endeavors:
- id: guji-上金光首-endeavor-1
  title_zh: 王舍城游逸扬名与爱欲炫耀
  summary_zh: 以紫磨金色之身游行王舍城园观里巷，受国王太子大臣长者敬慕追逐，与畏间长者子共载游观，盛饰车马伎乐自娱，为欲尘所覆
  phases:
  - key: brewing
    name: 逸女扬名
    labels:
      zh: 煎熬期
    start_date: '-0535'
    highlight_event_id: guji-上金光首-event-1
  - key: climax
    name: 游观园盛游
    labels:
      zh: 高光期
    start_date: '-0520'
    highlight_event_id: guji-上金光首-event-2
  decisions:
  - date: '-0520'
    title_zh: 驾驷马车赴游观园
    rationale: 欲显色相庄严与众乐共娱，遂与畏间长者子修治美食载伎乐而行，引无数人追观，欲心转盛为后逢文殊化度张本
- id: guji-上金光首-endeavor-2
  title_zh: 逢文殊师利闻法开悟发菩提心
  summary_zh: 于游观园道逢文殊师利化现少年，贪其光曜被服欲求施衣，蒙文殊以汝则为道开示五阴如梦如幻本净平等之理，遂破颠倒发无上正真道意，净修梵行
  phases:
  - key: breakthrough
    name: 息意天王点化
    labels:
      zh: 突破期
    start_date: '-0520'
    highlight_event_id: guji-上金光首-event-2
  - key: climax
    name: 闻法即悟
    labels:
      zh: 高光期
    start_date: '-0520'
    highlight_event_id: guji-上金光首-event-3
  - key: closure
    name: 发心归依
    labels:
      zh: 收束期
    start_date: '-0520'
    highlight_event_id: guji-上金光首-event-4
  decisions:
  - date: '-0520'
    title_zh: 下车求衣愿发道意
    rationale: 见文殊光曜蔽己不以为奇，贪其妙服，闻若发道意即施衣之约，遂愿闻道谊弃长者子而前问法，舍爱欲心转求菩提
  - date: '-0520'
    title_zh: 五体投地发无上正真道意
    rationale: 了知五阴本净尘欲即道如幻如梦，非离五阴别有佛道，遂归命佛法圣众奉持五戒，立愿以平等慧开化群生
events:
- id: guji-上金光首-event-birth
  title_zh: 生于王舍大城
  date: '-0550'
  year_of: '-0550'
  location_zh: 王舍城
  description_zh: 宿植德本，形体自然紫磨金色，所居卧起之地皆现光色，端正殊妙见者无厌，为王舍城著名逸女
- id: guji-上金光首-event-1
  title_zh: 城中扬名众所追慕
  date: '-0535'
  year_of: '-0535'
  location_zh: 王舍城里巷园观
  description_zh: 国王太子大臣长者居士诸子兴贪爱心，随其所游园观河侧里巷树间追逐观察，名为上金光首
- id: guji-上金光首-event-2
  title_zh: 与畏间长者子共诣游观园逢文殊化现
  date: '-0520'
  year_of: '-0520'
  location_zh: 王舍城东门中街路至游观园道上
  description_zh: 与畏间长者子驾驷马宝车载幢盖明珠伎乐赴游观园，文殊师利化为少年端正绝妙蔽其车服光曜，息意天王化作男子告以菩萨义，女心贪其被服而往求衣
- id: guji-上金光首-event-3
  title_zh: 游观园中闻文殊说法了五阴本净
  date: '-0520'
  year_of: '-0520'
  location_zh: 游观园
  description_zh: 文殊为说色痛想行识无念无分别、五阴如幻如梦如野马镜像无造无我本净即道之理，开示汝则为道、一切众生皆处在道，虚空中五百天子及随从二百人发大道意，六十人得法眼净
- id: guji-上金光首-event-4
  title_zh: 欢喜作礼发菩提心广说欲净
  date: '-0520'
  year_of: '-0520'
  location_zh: 游观园大众中
  description_zh: 欢喜五体投地稽首文殊足下归命三宝净修梵行发无上正真道意，复于大众前广说欲如沫如焰如影本悉清净，佛于灵鹫山遥赞善哉震动三千世界，引天龙阿阇世王等赍花往诣
- id: guji-上金光首-event-death
  title_zh: 卒于王舍城修道中
  date: '-0500'
  year_of: '-0500'
  location_zh: 王舍城
  description_zh: 发心已后奉行施戒忍辱精进诸度，观空无相无愿而不退转，以善权方便化度群生，传为王舍城由欲入道之典范
