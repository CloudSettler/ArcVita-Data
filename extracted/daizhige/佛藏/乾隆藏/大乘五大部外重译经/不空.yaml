  - 密法速证悉地与戒行次第如何不相违
  lesson: 以净戒为基、以仪轨为绳，存梵音而明译义，使行者如法持明，即可灭重罪、满众愿、速证菩提
  summary_first_person: 吾南天竺人，幼随金刚智三藏航海入唐，承胎藏金刚两部大法。尝奉玄宗、肃宗、代宗三朝诏译密典，虑准提为七俱胝佛母所说能灭十恶五无间罪，故详译其陀罗尼、坛场、印契与念诵仪轨，不徒存咒句，更授行法次第，令在家出家皆得依法持诵，护国利生，同趣无上正等菩提。
