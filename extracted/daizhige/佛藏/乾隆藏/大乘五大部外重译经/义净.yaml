endeavors:
- id: guji-义净-endeavor-1
  title_zh: 海路西行那烂陀求法
  summary: 咸亨中决意浮海西行，经南海诸国抵印度那烂陀寺，师事戒师学律与梵典十馀年，兼游中天竺圣迹，复留室利佛逝整理见闻，为归国译业奠定梵本与学养
