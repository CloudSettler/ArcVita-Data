person:
  qid: guji-义净
  name_zh: 义净
  names:
    zh: 义净
    en: Yijing
  lifespan:
    birth:
      date: '0635'
      precision: year
      is_circa: false
      raw: 唐贞观九年
    death:
      date: '0713'
      precision: year
      is_circa: false
      raw: 唐开元元年
  birth_date: '0635'
  death_date: '0713'
  era: 唐
  reign_ref: 武周
  archetype: 求法译师
  dilemmas:
  - 航海求法九死一生与安居传习之间的抉择
  - 严持律藏与方便弘化之间的张力
  lesson: 以戒为师以译为业，远行求法而归来报国，方能令正法久住
  summary_first_person: 吾名义净，齐州人也。少出家，慕法显玄奘西行之志。咸亨二年浮海而西，历南海诸国，至那烂陀广学三藏，尤精毗奈耶。经二十余载，赍梵本归国，蒙武后及中宗礼重，奉制于长安洛阳诸道场译经。所译律典与密部甚多，亦译浴像功德经，宣说浴佛供养之殊胜，劝人以清净心澡浴尊仪，回向菩提。愿此功德遍熏法界，助众生速证净法身。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%B5%B4%E5%83%8F%E5%8A%9F%E5%BE%B7%E7%BB%8F.md
