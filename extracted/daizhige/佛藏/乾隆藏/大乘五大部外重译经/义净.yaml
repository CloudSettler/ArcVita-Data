endeavors:
- id: guji-义净-endeavor-1
  title_zh: 泛海西行求法
  description: 自长安经广州泛南海至印度那烂陀及南海诸国求律学与梵本，历二十余年
  phases:
  - key: brewing
    name: 发愿西行
    labels:
      zh: 萌发
    start_date: 441
    highlight_event_id: guji-义净-event-departure
  - key: breakthrough
    name: 入那烂陀
    labels:
      zh: 突破
    start_date: 445
    highlight_event_id: guji-义净-event-nalanda
  - key: climax
    name: 遍学搜集
    labels:
      zh: 高峰
    start_date: 0685
    highlight_event_id: guji-义净-event-study
  - key: closure
    name: 载经归国
    labels:
      zh: 收束
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: 441
    title_zh: 决意泛海南道而非陆路
    rationale: 吐蕃阻隔陆路，取海道虽险而可直达印度，效法求法前贤
  - date: 0685
    title_zh: 留室利佛逝考校梵本
    rationale: 于南海驻留数年整理律典梵本，确保归国所译底本精审
- id: guji-义净-endeavor-2
  title_zh: 奉诏译经弘律
  description: 归国后奉武后中宗玄宗诏为译主，于长安洛阳译出有部律藏及大乘重译经
  phases:
  - key: brewing
    name: 入宫受诏开译场
    labels:
      zh: 萌发
    start_date: 0699
    highlight_event_id: guji-义净-event-translation-start
  - key: breakthrough
    name: 重译药师七佛广本
    labels:
      zh: 突破
    start_date: 448
    highlight_event_id: guji-义净-event-yaoshi
  - key: climax
    name: 大译有部律藏
    labels:
      zh: 高峰
    start_date: 451
    highlight_event_id: guji-义净-event-vinaya
  - key: closure
    name: 述作付法
    labels:
      zh: 收束
    start_date: 458
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: 448
    title_zh: 以七佛广本重译药师经
    rationale: 旧译仅一佛十二愿，今据梵本具译七佛四十四愿以显药师法门全貌
  - date: 451
    title_zh: 先律后经之译序
    rationale: 以戒为基整顿唐律学，使显密修学有所依止，故先译根本说一切有部毗奈耶
events:
