  decisions:
  - date: 0671-08
    title_zh: 舍陆取海自广州浮舟西行
    rationale: 陆路艰阻且多战乱，海路虽险而可直达南海再入天竺，欲效法显玄奘而辟新航，以速求律藏梵本
  - date: '0675'
    title_zh: 留学那烂陀十年专攻律学
    rationale: 见中土律学阙梵本依据，欲穷根本说一切有部律，非久住师门难以得其精微
  - date: 0685
    title_zh: 滞留室利佛逝撰南海寄归内法传与大唐西域求法高僧传
    rationale: 记忆易湮，欲先整理亲历见闻与所携梵本目录，为后人求法与朝廷译场提供实录
- id: guji-义净-endeavor-2
  title_zh: 归国主持译场重译尊胜陀罗尼
  summary: 久视元年赍梵本归洛，为武后及中宗所重，入内外译场主持译事，一生译出有部律及大乘经律论五十馀部，并奉制重勘梵本再译佛顶尊胜陀罗尼经，校正咒语音字，广布幢刹与持诵之法
  phases:
  - key: brewing
    name: 奉迎入译场
    labels:
      zh: 入局
    start_date: 0695-07
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 重勘梵本译尊胜
    labels:
      zh: 重译
    start_date: '0702'
    highlight_event_id: guji-义净-event-translate-zunsheng
  - key: climax
    name: 主持大译广出律典
    labels:
      zh: 鼎盛
    start_date: '0705'
    highlight_event_id: guji-义净-event-translate-vinaya
  - key: closure
    name: 付嘱流通圆寂
    labels:
      zh: 付嘱
    start_date: 0713-01
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0702'
    title_zh: 奉制重译佛顶尊胜陀罗尼并详定咒语音字
    rationale: 旧译传诵虽广而声韵字体未尽善，须重勘梵本一一详定，使持诵者一经于耳即能获吉祥净障之益
  - date: '0705'
    title_zh: 以有部律为中心兼译大乘经论
    rationale: 中土律学多依南山而缺梵本根源，当先译根本说一切有部律藏以正轨仪，再以显密经咒饶益短命恶趣众生
  - date: 0708
    title_zh: 倡书写幢刹安置陀罗尼广令瞻触得净
    rationale: 依经所言，书写安于高幢窣堵波，令影覆尘触皆得不退，正合大唐崇塔造幡之俗，易于流通
