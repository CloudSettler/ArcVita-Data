endeavors:
- id: guji-义净-endeavor-1
  title_zh: 南海西行求法
  description: 自长安经广州泛海至室利佛逝及天竺那烂陀，历二十余年搜求律典与大乘梵本
  phases:
  - key: brewing
    name: 发愿泛海
    labels:
      zh: 发愿
    start_date: '0671'
    highlight_event_id: guji-义净-event-departure
  - key: breakthrough
    name: 抵那烂陀参学
    labels:
      zh: 参学
    start_date: '0673'
    highlight_event_id: guji-义净-event-study
  - key: climax
    name: 广集梵本
    labels:
      zh: 集藏
    start_date: 0685
    highlight_event_id: guji-义净-event-collect
  - key: closure
    name: 载经归唐
    labels:
      zh: 归国
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: '0671'
    title_zh: 决意效玄奘泛海西行
    rationale: 见中土律藏阙略，欲亲往天竺求根本说一切有部律梵本以正轨范
  - date: 0685
    title_zh: 久留室利佛逝抄集经典
    rationale: 海路险远梵本难得，须系统缮写律典及药师等大乘经本备归国翻译
- id: guji-义净-endeavor-2
  title_zh: 归国译经弘律
  description: 奉武后中宗诏于洛阳长安翻经院译出根本说一切有部律及药师七佛等经五十余部
  phases:
  - key: brewing
    name: 奉诏入洛
    labels:
      zh: 奉诏
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 主译律藏
    labels:
      zh: 译律
    start_date: '0700'
    highlight_event_id: guji-义净-event-translation-lv
  - key: climax
    name: 重译药师七佛
    labels:
      zh: 译经
    start_date: '0707'
    highlight_event_id: guji-义净-event-translation-yaoshi
  - key: closure
    name: 译业圆成示寂
    labels:
      zh: 圆寂
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0700'
    title_zh: 奏请设翻经院专译南海梵本
    rationale: 所携梵本多为旧译未备之典，当依梵文直译存其本义兼补中土阙略
  - date: '0707'
    title_zh: 以番字本重译药师七佛本愿功德经
    rationale: 旧译仅有单佛药师经，七佛名号与十二大愿未全，依新得梵本具译七佛愿海令法流通
events:
- id: guji-义净-event-birth
  title_zh: 诞生齐州
  date: '0635'
  year_of: '0635'
  description: 唐贞观九年生于齐州历城，后出家慕西行求法
