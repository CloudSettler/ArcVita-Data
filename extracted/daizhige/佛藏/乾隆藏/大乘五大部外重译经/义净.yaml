    start_date: 0695
    highlight_event_id: guji-义净-event-695-return-luoyang
  - key: breakthrough
    name: 系统传译有部广律
    labels:
      zh: 译律
    start_date: '0700'
    highlight_event_id: guji-义净-event-700-vinaya-translation
  - key: climax
    name: 密咒藏一字咒王等奉制翻译
    labels:
      zh: 译咒
    start_date: '0705'
    highlight_event_id: guji-义净-event-705-manjushri-dharani-translation
  - key: closure
    name: 长安译事圆成示寂
    labels:
      zh: 圆寂
    start_date: '0710'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0700'
    title_zh: 优先译出根本说一切有部律全帙
    rationale: 时唐僧团戒律弛废，欲以广律大部重建律制根本，再以咒法为护持方便
  - date: '0705'
    title_zh: 奉制译曼殊室利一字咒王等密咒经典
    rationale: 朝野需禳疾护国护身法门，一字咒王总摄一切咒王易持验速，能随俗化导广利群生
