person:
  qid: guji-义净
  name_zh: 义净
  names:
    zh: 义净
    en: Yijing
  lifespan:
    birth:
      date: 413
      precision: year
      is_circa: false
      raw: 唐贞观九年
    death:
      date: 459
      precision: year
      is_circa: false
      raw: 唐开元元年
  birth_date: 413
  death_date: 459
  era: 唐
  reign_ref: 唐高宗至唐玄宗
  archetype: 高僧译师
  dilemmas:
  - 航海泛南海西行与陆路北道之抉择
  - 广译律藏奠基与急译大乘显密满众愿之权衡
  lesson: 亲历万里以求真本，重译广本以证信，持戒为本方能弘法利世
  summary_first_person: 吾义净，齐州历城人，髫年出家，慕法显玄奘西行求法，贞观末发愿泛南海至印度那烂陀遍学有部律及大乘显密，二十余载搜集梵本五百余部，归国奉武后中宗诏为译主，于长安洛阳译出根本说一切有部律及药师七佛等经，愿以律范与药师愿力饶益病恼众生
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E8%8D%AF%E5%B8%88%E7%90%89%E7%92%83%E5%85%89%E4%B8%83%E4%BD%9B%E6%9C%AC%E6%84%BF%E5%8A%9F%E5%BE%B7%E7%BB%8F.html
