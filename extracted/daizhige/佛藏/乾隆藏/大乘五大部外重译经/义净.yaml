  title_zh: 生于齐州历城
  date: 413
  year_of: 413
  place: 齐州历城
  description: 唐贞观九年生于齐州历城，十四岁出家
- id: guji-义净-event-departure
  title_zh: 广州泛海西行
  date: 441
  year_of: 441
  place: 广州
  description: 自长安至广州搭舶，经室利佛逝泛南海往印度
- id: guji-义净-event-nalanda
  title_zh: 入那烂陀寺学律
  date: 445
  year_of: 445
  place: 那烂陀寺
  description: 抵印度入那烂陀，从师研习根本说一切有部律及大乘典籍十一年
- id: guji-义净-event-study
  title_zh: 游学印度南海搜集梵本
  date: 0685
  year_of: 0685
  place: 印度及室利佛逝
  description: 遍礼圣迹，于南海搜集梵本五百余部、舍利三百粒
- id: guji-义净-event-return
  title_zh: 载经归洛阳获礼迎
  date: 0695
  year_of: 0695
  place: 洛阳
  description: 携梵本归国，武则天亲迎于洛阳东郊，诏入译场
- id: guji-义净-event-translation-start
  title_zh: 奉诏入大福先寺译场
  date: 0699
  year_of: 0699
  place: 长安大福先寺
  description: 奉诏为译主，开译场译经，著南海寄归内法传记录见闻
- id: guji-义净-event-yaoshi
  title_zh: 译药师琉璃光七佛本愿功德经二卷
  date: 448
  year_of: 448
  place: 长安
  description: 奉诏重译药师经为七佛广本二卷，于此经中具述七佛国土庄严与四十四大愿及神咒
- id: guji-义净-event-vinaya
  title_zh: 译根本说一切有部毗奈耶
  date: 451
  year_of: 451
  place: 洛阳长安
  description: 陆续译出有部律藏数十部五十余卷，奠定唐代律学基础
- id: guji-义净-event-death
  title_zh: 示寂长安
  date: 459
  year_of: 459
  place: 长安
  description: 唐开元元年正月寂于长安，年七十九，敕谥鸿胪卿，葬于洛阳龙门
