endeavors:
- id: guji-义净-endeavor-1
  title_zh: 浮海西行广求律藏
  description: 自广州浮海经室利佛逝至天竺那烂陀，学毗奈耶及声明，往返南海二十五年
  phases:
  - key: brewing
    name: 齐州出家立志西游
    labels:
      zh: 萌志
    start_date: 0648
    highlight_event_id: guji-义净-event-birth
  - key: breakthrough
    name: 广州解缆南海留住
    labels:
      zh: 启程
    start_date: '0671'
    highlight_event_id: guji-义净-event-671-departure
  - key: climax
    name: 那烂陀习律学咒
    labels:
      zh: 深造
    start_date: '0675'
    highlight_event_id: guji-义净-event-680-nalanda
  - key: closure
    name: 室利佛逝撰述归思
    labels:
      zh: 归途
    start_date: 0685
    highlight_event_id: guji-义净-event-695-return
  decisions:
  - date: '0671'
    title_zh: 决意浮海不循陆路
    rationale: 陆路阻隔，选择海路经南海诸国往天竺，以求速达并考察南海佛法
  - date: 0680
    title_zh: 久住室利佛逝译集见闻
    rationale: 归途留住室利佛逝，整理所获梵本并撰南海寄归内法传，为后人示海道与律制
- id: guji-义净-endeavor-2
  title_zh: 奉制译场重译孔雀咒王
  description: 返洛后奉武周敕于东都立译场，综校诸部梵本，重译大孔雀咒王经三卷并定坛场仪轨
  phases:
  - key: brewing
    name: 洛京入朝献梵本
    labels:
      zh: 献典
    start_date: 0695
    highlight_event_id: guji-义净-event-695-return
  - key: breakthrough
    name: 综校梵本勘补阙文
    labels:
      zh: 校勘
    start_date: '0700'
    highlight_event_id: guji-义净-event-704-translation
  - key: climax
    name: 奉制译成孔雀咒王三卷
    labels:
      zh: 成译
    start_date: '0704'
    highlight_event_id: guji-义净-event-704-translation
  - key: closure
    name: 制坛场画像广布流通
    labels:
      zh: 流通
    start_date: '0707'
    highlight_event_id: guji-义净-event-707-circulation
  decisions:
  - date: '0704'
    title_zh: 增补旧译阙略重译全经
    rationale: 以南海及天竺多本对校，补旧译脱略，详注弹舌音读与坛仪，使咒法可依行
  - date: '0707'
    title_zh: 并出坛场轨式与画像法
    rationale: 咒经须依坛场持诵方验，故兼译图像坛仪，使护国禳灾有法可循
