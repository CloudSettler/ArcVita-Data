  birth_date: '0635'
  death_date: '0713'
  era: 唐
  reign_ref: 唐高宗至玄宗
  archetype: 译经高僧
  dilemmas:
  - 安居习禅与冒死泛海西行求法之间的抉择
  - 循旧译与躬通梵汉重译定理之间的抉择
  lesson: 兼通梵汉躬亲缀文方得真义，历艰不辍、持戒为本方能广利含生
  summary_first_person: 余范阳张氏子，幼挺明晤，甫踰辩李之岁乐出家，志寻西国。咸亨二年年三十有七，自广府泛舶南溟，历三十余国二十余载，巡礼鹫峰菩提树、金刚座、祇园宝陛八大灵塔，于那烂陀究五天竺语及二谛幽宗。携梵本四百部五十万颂、真容舍利东归，蒙则天迎于上东门置授记大福二寺，与实叉难陀、复礼、法藏、宝思惟等共译华严、根本律，躬为译主义定新文，重出此金光明最胜王经十卷，愿洗众生饥馑苦患、护国护世。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E9%87%91%E5%85%89%E6%98%8E%E6%9C%80%E8%83%9C%E7%8E%8B%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E9%87%91%E5%85%89%E6%98%8E%E6%9C%80%E8%83%9C%E7%8E%8B%E7%BB%8F.html
  - https://tripitaka.cbeta.org/T0665
endeavors:
- id: guji-义净-endeavor-1
  title_zh: 西行求法巡礼
  description_zh: 自咸亨二年广府泛舶，历南海、室利佛逝至中天竺，巡礼佛迹，于那烂陀从师研习有部律及大乘
  phases:
