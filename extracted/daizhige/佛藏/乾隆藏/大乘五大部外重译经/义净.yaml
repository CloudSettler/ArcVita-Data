  title_zh: 自长安泛海西行
  date: '0671'
  year_of: '0671'
  description: 唐咸亨二年自长安出发，经广州乘舶泛海南行往天竺求法
- id: guji-义净-event-study
  title_zh: 止那烂陀寺参学
  date: '0673'
  year_of: '0673'
  description: 抵中天竺那烂陀寺，从师研习有部律典及大乘经论凡十余年
- id: guji-义净-event-collect
  title_zh: 于南海室利佛逝集梵本
  date: 0685
  year_of: 0685
  description: 归途中留止室利佛逝抄集梵本四百余部，为归国译经奠基
- id: guji-义净-event-return
  title_zh: 载经归洛阳
  date: 0695
  year_of: 0695
  description: 武后证圣元年携梵本归抵洛阳，敕迎于翻经院
- id: guji-义净-event-translation-lv
  title_zh: 译根本说一切有部律
  date: '0700'
  year_of: '0700'
  description: 于长安洛阳主持译出根本说一切有部毗奈耶等律典，弘传戒律
- id: guji-义净-event-translation-yaoshi
  title_zh: 译番字药师七佛本愿功德经一卷
  date: '0707'
  year_of: '0707'
  description: 依南海所得梵本重译药师七佛本愿功德经，具列七佛名号与本愿功德，列入大乘五大部外重译经
- id: guji-义净-event-death
  title_zh: 圆寂长安
  date: '0713'
  year_of: '0713'
  description: 唐开元元年圆寂于长安，世寿七十九，谥号鸿胪卿
