endeavors:
- id: guji-义净-endeavor-1
  title_zh: 浮海西行求法学律
  description: 感玄奘求法之伟业，发愿西游，浮南海至天竺那烂陀，于十年间广学大小乘经律论，重在毗奈耶，兼收集梵本
  phases:
  - key: brewing
    name: 齐州出家立志求法
    labels:
      zh: 立志
    start_date: '0650'
    highlight_event_id: guji-义净-event-birth
  - key: breakthrough
    name: 咸亨西航
    labels:
      zh: 启航
    start_date: '0671'
    highlight_event_id: guji-义净-event-departure
  - key: climax
    name: 那烂陀学律
    labels:
      zh: 精研
    start_date: '0675'
    highlight_event_id: guji-义净-event-nalanda
  - key: closure
    name: 赍经东归
    labels:
      zh: 归国
    start_date: 0685
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: '0671'
    title_zh: 决意浮海不循陆路
    rationale: 避西域战乱阻隔，欲探南海新航路求法，虽海难可畏而愿为法捐躯
  - date: '0675'
    title_zh: 久留那烂陀专攻律学
    rationale: 见唐土律藏多阙，欲以毗奈耶为归国弘传之本，故专精有部律
- id: guji-义净-endeavor-2
  title_zh: 奉制译经弘传浴像功德
  description: 归国后受武则天及唐中宗礼遇，于长安洛阳主持译场，译出根本说一切有部诸律及大乘经咒，宣扬浴像供养法门
  phases:
  - key: brewing
    name: 洛阳立译场
    labels:
      zh: 筹建
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 奉制开译
    labels:
      zh: 开译
    start_date: 0699
    highlight_event_id: guji-义净-event-translation-start
  - key: climax
    name: 译传浴像功德经
    labels:
      zh: 弘法
    start_date: '0703'
    highlight_event_id: guji-义净-event-bath-sutra
  - key: closure
    name: 译业圆满示寂
    labels:
      zh: 圆满
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: 0699
    title_zh: 奉制专译律藏与供养法门
    rationale: 以戒律为佛法住世之寿，以浴像等事供养摄受广大信心者，使末世众生易植福田速成菩提
  - date: '0703'
    title_zh: 以浅显仪轨译浴像法
    rationale: 浴像功德经仪轨详明易行，能令国王大臣及庶民日日澡沐尊仪获大利益，故详译香水坛场仪则与发愿回向
events:
- id: guji-义净-event-birth
  title_zh: 诞生于齐州
  date: '0635'
  year_of: 635
  description: 唐贞观九年生于齐州，俗姓张，少孤出家
  location: 齐州
- id: guji-义净-event-departure
  title_zh: 咸亨二年浮海西行
  date: '0671-08-01'
  year_of: 671
  description: 自广州搭舶浮海，经室利佛逝等地前往天竺求法
  location: 广州
- id: guji-义净-event-nalanda
  title_zh: 那烂陀寺学法
  date: '0675-01-01'
  year_of: 675
  description: 到那烂陀寺从师研习有部律及大乘经论凡十年，兼游中天竺诸圣迹
  location: 那烂陀
- id: guji-义净-event-return
  title_zh: 赍梵本归国受礼
  date: '0695-06-01'
  year_of: 695
  description: 携梵本四百余部经律论至洛阳，武则天亲迎礼为三藏法师，敕住洛阳佛授记寺译经
  location: 洛阳
- id: guji-义净-event-translation-start
  title_zh: 主持译场开译群经
  date: '0699-01-01'
  year_of: 699
  description: 于长安西明寺及洛阳大福先寺等地主持译场，译根本说一切有部毗奈耶等律典
  location: 长安西明寺
- id: guji-义净-event-bath-sutra
  title_zh: 译出浴像功德经
  date: '0703-05-01'
  year_of: 703
  description: 奉制译浴像功德经一卷，宣说以牛头栴檀等香水澡浴佛像、安坛灌沐、发愿回向之法及十五殊胜功德
  location: 洛阳大福先寺
- id: guji-义净-event-death
  title_zh: 圆寂于长安
  date: '0713-02-15'
  year_of: 713
  description: 唐开元元年正月圆寂于长安，春秋七十九，谥号鸿胪卿
  location: 长安
