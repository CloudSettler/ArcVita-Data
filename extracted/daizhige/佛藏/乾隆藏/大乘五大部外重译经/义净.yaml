  decisions:
  - date: '0671'
    title_zh: 舍陆取海自广州泛舶西行
    rationale: 西北陆路阻隔战乱频仍，海路虽险可直通南海诸国与印度，且能考察南海佛法传布实况
  - date: 0685
    title_zh: 留驻室利佛逝著述待风
    rationale: 风汛未至兼梵本繁重需整理，遂撰南海寄归内法传入西国求法高僧传，为后世求法者留航路与学制指南
- id: guji-义净-endeavor-2
  title_zh: 归国奉诏译场弘律传咒
  description: 携经归洛奉武后礼敬入译场，十四年间系统译出根本说一切有部律藏及大乘密咒诸经，奠定唐律学与持明法门
  phases:
  - key: brewing
