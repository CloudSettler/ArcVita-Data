  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E7%A7%B0%E8%B5%9E%E5%A6%82%E6%9D%A5%E5%8A%9F%E5%BE%B7%E7%A5%9E%E5%92%92%E7%BB%8F.html
endeavors:
- id: guji-义净-endeavor-1
  title_zh: 泛海西行南海求法
  goal_zh: 远赴天竺那烂陀求取律藏梵本并考察南海佛法
  phases:
  - key: brewing
    name: 萌发西行志
    labels:
      zh: 萌发
    start_date: '0667'
    highlight_event_id: guji-义净-event-671-depart
  - key: breakthrough
    name: 泛海抵南海
    labels:
      zh: 突破
    start_date: '0671'
    highlight_event_id: guji-义净-event-673-srivijaya
  - key: climax
    name: 那烂陀广学
    labels:
      zh: 高峰
    start_date: '0675'
    highlight_event_id: guji-义净-event-675-nalanda
  - key: closure
    name: 携经归国
    labels:
      zh: 收束
    start_date: 0685
    highlight_event_id: guji-义净-event-695-return
  decisions:
  - date: '0671'
    title_zh: 辞别长安泛海西行
    rationale: 不满足于中土旧译阙略，欲亲证梵本以正律制，故效法玄奘冒海而往
  - date: '0673'
    title_zh: 留师利佛逝研习南海律仪
    rationale: 见南海诸国佛法盛行而律行有异，需先考察南海道场再入天竺，以备比较
- id: guji-义净-endeavor-2
  title_zh: 奉诏译经正定律藏
  goal_zh: 主持译场翻译梵本校正旧译弘传根本说一切有部律
  phases:
  - key: brewing
    name: 得诏入译场
    labels:
      zh: 萌发
    start_date: 0695
    highlight_event_id: guji-义净-event-695-return
  - key: breakthrough
    name: 洛阳立译场
    labels:
      zh: 突破
    start_date: '0700'
    highlight_event_id: guji-义净-event-700-translate
  - key: climax
    name: 律藏大译
    labels:
      zh: 高峰
    start_date: '0703'
    highlight_event_id: guji-义净-event-703-vinaya
  - key: closure
    name: 称赞如来经译成
    labels:
      zh: 收束
    start_date: '0705'
    highlight_event_id: guji-义净-event-705-chengzan
  decisions:
  - date: '0700'
    title_zh: 奏请设立译场广召笔受证义
    rationale: 梵本浩繁一人难成，需集众参校方保信实，故仿玄奘例建制译场
  - date: '0705'
    title_zh: 重译称赞如来功德神咒经等显密诸经
    rationale: 见旧译不显陀罗尼功德与十方佛名号持诵利益，故依新得梵本重译以利持诵灭障
