    highlight_event_id: guji-义净-event-return
  decisions:
  - date: '0671'
    title_zh: 咸亨二年决意泛海西行
    rationale: 慨中土律藏未备、旧译未周，虽海道万里、十人结契仅存一己，仍欲亲证圣迹求得梵本
  - date: 0680
    title_zh: 久住那烂陀精研根本律
    rationale: 那烂陀为五天学府，为穷二谛幽宗及有部律本，宁淹留二十余载不急东归
- id: guji-义净-endeavor-2
  title_zh: 奉制译经弘律
  description_zh: 证圣元年还洛后奉则天诏，于授记、大福等寺主持译场，重译旧经、广出律藏
  phases:
  - key: brewing
    name: 迎置授记
    labels:
      zh: 迎置
    start_date: '0695-05-01'
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 共译华严
    labels:
      zh: 华严
    start_date: '0695-06-01'
    highlight_event_id: guji-义净-event-huayan
  - key: climax
    name: 重译金光明最胜王经
    labels:
      zh: 重译
    start_date: '0703'
    highlight_event_id: guji-义净-event-jinguangming
  - key: closure
    name: 进内传律
    labels:
      zh: 传律
    start_date: '0704'
    highlight_event_id: guji-义净-event-vinaya
  decisions:
  - date: '0695-06-01'
    title_zh: 躬兼译义缀文不假旁求
    rationale: 既闲五天竺语又详二谛，译义缀文咸由于己、指词定理匪假旁求，超摩腾罗什之旧式以保精审
  - date: '0703'
    title_zh: 奉制重译金光明为最胜王经十卷
    rationale: 旧译文义未周，为显四方四佛加护、吉祥忏灭罪及护世四王拥护之要，故依梵本新译十卷以济饥馑苦患
events:
- id: guji-义净-event-birth
  title_zh: 生于范阳张氏
  date: '0635'
  description_zh: 唐贞观九年生范阳，俗姓张氏，五代相韩三台仕晋之后，高祖为东齐郡守，祖父皆厌俗隐居丘壑
- id: guji-义净-event-departure
  title_zh: 咸亨二年广府扬帆西行
  date: '0671'
  description_zh: 年三十有七遂雅怀，至广府与十人结契鼓棹升航，仅一己存，巡南溟指西域，凌波涛万里
- id: guji-义净-event-india
  title_zh: 巡礼天竺圣迹究学那烂陀
  date: '0673'
  description_zh: 渐届天竺王城，睹灵鹫山、菩提树金刚座、祇园布金地、三道宝陛八大灵塔，所经三十余国历二十余载，菩提树下淹留阿耨池边濯缨
- id: guji-义净-event-return
  title_zh: 证圣元年夏五月载梵本还都
  date: '0695-05-01'
  description_zh: 携梵本四百部合五十万颂、金刚座真容一铺、舍利三百粒至洛阳，则天遣百寮四众虹幡凤吹迎于上东门置授记寺
- id: guji-义净-event-huayan
  title_zh: 于授记寺共译华严经
  date: '0695-06-01'
  description_zh: 与于阗三藏实叉难陀及大福先寺主复礼、西崇福寺主法藏等同译大方广佛华严经
- id: guji-义净-event-vinaya
  title_zh: 于大福先寺译根本说一切有部律
  date: 0699
  description_zh: 与天竺三藏宝思惟及授记寺主慧表、胜庄、慈训等译根本部律，阐五篇八法、鹅珠虫命不伤之义
- id: guji-义净-event-jinguangming
  title_zh: 奉制译金光明最胜王经十卷
  date: '0703'
  description_zh: 依梵本重译金光明经为十卷最胜王经，宣四方阿閦宝相无量寿天鼓音四佛加护、寿量无边及忏悔灭罪法门，已翻杂经律二百余卷缮写进内
- id: guji-义净-event-death
  title_zh: 卒于长安
  date: '0713'
  description_zh: 唐开元元年卒，年七十九，一生所翻经律论逾二百卷，撰南海寄归内法传，成中印求法译经之宗
