  reign_ref: 唐高宗至唐玄宗
  archetype: 译经求法僧
  dilemmas:
  - 安居中土弘律与冒死海行求法的抉择
  - 梵本直译存真与华言重刊便诵的权衡
  - 帝王奉制译场与佛法本怀独立的张力
  lesson: 海路历艰而求得真法，归国以重勘梵本为信，译业当以精严存真、便俗流通并重，方能净除迷误、饶益有情
  summary_first_person: 吾齐州历城人也，俗姓张，少出家慕西域求法。咸亨二年自广州浮海，历室利佛逝、末罗瑜，至那烂陀从学十年，复留南海室利佛逝撰述。久视元年赍梵本数百归洛，武后迎为译主，后居长安荐福、洛阳福先诸译场，一生译经律论五十馀部二百馀卷。尝奉制重勘梵本，再译佛顶尊胜陀罗尼，校正音字，冀使持诵获益、恶趣得净。愿以所译流通，报佛恩而利群生。
