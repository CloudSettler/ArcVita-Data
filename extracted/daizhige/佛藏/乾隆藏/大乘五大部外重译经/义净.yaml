  birth_date: '0635'
  death_date: '0713'
  era: 唐
  reign_ref: 唐高宗至唐玄宗武周
  archetype: 求法译经高僧
  dilemmas:
  - 海路西行九死一生与安居中土讲学的抉择
  - 专弘律藏以奠戒基与兼译密咒以应时需的平衡
  lesson: 以亲证为信，以译述为业，律为体咒为用，方能令正法久住利济群生
  summary_first_person: 吾义净，齐州历城张氏子，幼慕玄奘西行之志，弱冠泛海赴天竺，就那烂陀究学有部律及大乘十余载，历南海室利佛逝等国，携梵本四百余部归唐，奉武后、中宗诏入洛阳长安译场，译根本说一切有部律及显密经咒五十余部，此曼殊室利咒藏中一字咒王亦奉制所译，愿以戒行为本、咒法为护，疗病护国、成就众愿。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/曼殊室利菩萨咒藏中一字咒王经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/曼殊室利菩萨咒藏中一字咒王经.html
  - https://cbetaonline.dila.edu.tw/zh/X0194
