person:
  qid: guji-义净
  name_zh: 义净
  names:
    zh: 义净
    en: Yijing
  lifespan:
    birth:
      date: '0635'
      precision: year
      is_circa: false
      raw: 贞观九年
    death:
      date: '0713'
      precision: year
      is_circa: false
      raw: 先天二年
  birth_date: '0635'
  death_date: '0713'
  era: 唐代
  reign_ref: 唐高宗至唐玄宗
  archetype: 求法译师
  dilemmas:
  - 安居中土依托旧译弘化与冒死泛海亲往天竺求取原本的抉择
  - 译场中忠实梵本保存律制本意与润饰华文以便中土易读的权衡
  - 依附帝王护持以广译业与坚持僧律清净不染世务的张力
  lesson: 求法必亲证典籍，译经贵在信实不饰，持戒为本方能令法久住
  summary_first_person: 吾齐州张氏子，字义净，少依出家，仰慕玄奘法师西行求法，遂决意泛海而往。历南海诸国，驻那烂陀十余年，广学三藏尤精律部，携梵本数百部归国，奉武后及中宗之诏主持译场，校正旧译，重传根本说一切有部律，庶几正俗误而显正法。
