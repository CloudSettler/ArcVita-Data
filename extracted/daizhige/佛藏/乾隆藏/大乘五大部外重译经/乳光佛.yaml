person:
  qid: guji-乳光佛
  name_zh: 乳光佛
  names:
    zh: 乳光佛
    en: Ruguang Buddha
  lifespan:
    birth:
      date: -0550-01-01
      precision: century
      is_circa: true
      raw: 约前六世纪维耶离为犊子生于梵志家
    death:
      date: '3540-01-01'
      precision: century
      is_circa: true
      raw: 未来幢幡光明国般泥洹
  birth_date: -0550-01-01
  death_date: '3540-01-01'
  era: 春秋
  reign_ref: 释迦牟尼佛在维耶离说法时
  archetype: 忏悔愿行者
  dilemmas:
  - 悭贪抵突已堕畜生十六劫，如何以微善转重业
  - 身为犊子无自在，如何以一分乳供养而发无上大愿
  lesson: 悭贪谩抵必堕恶道，一念平等布施与发愿即开解脱成佛之门
  summary_first_person: 我本为豪富长者，悭贪不施、举息谩抵，随恶友不信经戒，故堕牛马中十六劫。今为维耶离梵志摩耶利家犊子，幸闻世尊之名，欢喜以所饮之分尽奉如来，发愿智慧得道如佛，蒙授记二十劫后当作佛号乳光，于幢幡光明国度恒沙众生。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B9%B3%E5%85%89%E4%BD%9B%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B9%B3%E5%85%89%E4%BD%9B%E7%BB%8F.html
endeavors:
- id: guji-乳光佛-endeavor-1
  title_zh: 宿债沉沦与畜生偿业
  summary: 前世为豪富长者悭贪不施、举息谩抵，堕畜生道十六劫，今世为梵志摩耶利家弊恶牸牛之犊子，罪将毕而慈心生
  phases:
  - key: brewing
    name: 悭贪积业
    labels:
      zh: 长者悭贪谩抵
    start_date: -0600-01-01
    highlight_event_id: guji-乳光佛-event-past-life
  - key: breakthrough
    name: 堕畜偿业
    labels:
      zh: 十六劫为牛马
    start_date: -0580-01-01
    highlight_event_id: guji-乳光佛-event-fall
  - key: climax
    name: 犊子闻佛名
    labels:
      zh: 维耶离为犊闻佛
    start_date: -0550-01-01
    highlight_event_id: guji-乳光佛-event-birth
  - key: closure
    name: 业将毕生意慈
    labels:
      zh: 慈心渐生
    start_date: -0550-01-02
    highlight_event_id: guji-乳光佛-event-offer
  decisions:
  - date: -0600-01-01
    title_zh: 随恶友不信经戒而悭贪举息
    rationale: 贪利谩抵自谓得计，不知因果，遂种堕畜生之因
  - date: -0550-01-02
    title_zh: 闻佛声生欢喜欲改业
    rationale: 畜生罪将毕，宿善萌动，因佛名号发慈，欲以善行转重业
- id: guji-乳光佛-endeavor-2
  title_zh: 献乳发愿与授记成佛
  summary: 与母牛平等议乳，自愿尽分奉佛，以此福因蒙佛授记，七返天人间后值弥勒得度，二十劫后自成乳光如来度恒沙众生
  phases:
  - key: brewing
    name: 母子平等议乳
    labels:
      zh: 母留半乳与子
    start_date: -0550-01-02
    highlight_event_id: guji-乳光佛-event-offer
  - key: breakthrough
    name: 尽分献佛
    labels:
      zh: 持我所饮尽奉如来
    start_date: -0550-01-02
    highlight_event_id: guji-乳光佛-event-offer
  - key: climax
    name: 蒙佛授记
    labels:
      zh: 佛笑授记乳光
    start_date: -0550-01-02
    highlight_event_id: guji-乳光佛-event-prophecy
  - key: closure
    name: 愿行成就
    labels:
      zh: 幢幡光明成佛
    start_date: '3500-01-01'
    highlight_event_id: guji-乳光佛-event-buddhahood
  decisions:
  - date: -0550-01-02
    title_zh: 决定尽乳奉佛不留自资
    rationale: 自念无数劫饮乳未曾值佛，今难逢世尊，愿舍一日草水之资换未来智慧
  - date: -0550-01-02
    title_zh: 发愿得道如佛度蠕动
    rationale: 不求人天小福，愿后智慧得道如佛，以平等慈心度蜎飞蠕动万类
  - date: '3500-01-01'
    title_zh: 建立幢幡光明净土
    rationale: 以昔平等献乳因，成就光明国土，寿七千岁教授四万岁，令众生皆得法眼
events:
- id: guji-乳光佛-event-birth
  title_zh: 犊子生于摩耶利家
  date: -0550-01-01
  year_of: '-0550'
  kind: birth
  description: 宿业所感，生为维耶离梵志摩耶利家弊恶牸牛之犊，大而好胜余犊百千倍
- id: guji-乳光佛-event-past-life
  title_zh: 前世为悭贪长者
  date: -0600-01-01
  year_of: '-0600'
  kind: past
  description: 昔为豪富长者，悭贪不布施，不信佛经戒，喜举息钱谩抵偿者，故堕畜生
- id: guji-乳光佛-event-fall
  title_zh: 堕牛马十六劫
  date: -0580-01-01
  year_of: -0580
  kind: crisis
  description: 以悭贪抵突之罪堕畜生中作牛马凡十六劫，辗转偿业
- id: guji-乳光佛-event-offer
  title_zh: 母子以乳献佛
  date: -0550-01-02
  year_of: '-0550'
  kind: offering
  description: 帝释化年少梵志为阿难取乳，母牛说偈留半与子，犊子欢喜言持我分尽奉世尊愿得智慧如佛，乳满钵献佛感动万人得法眼
- id: guji-乳光佛-event-prophecy
  title_zh: 佛笑授记乳光
  date: -0550-01-02
  year_of: '-0550'
  kind: prophecy
  description: 世尊笑五色光绕身三匝，授记犊子母子七返兜率梵天及人间豪富家终供养诸佛，后值弥勒得罗汉，犊子二十劫后当作佛号乳光
- id: guji-乳光佛-event-buddhahood
  title_zh: 成佛号乳光于幢幡光明国
  date: '3500-01-01'
  year_of: '3500'
  kind: enlightenment
  description: 上下二十劫竟得作佛，号乳光如来，国名幢幡光明，寿七千岁教授四万岁，度天上天下万民及蜎飞蠕动如恒沙数
- id: guji-乳光佛-event-death
  title_zh: 般泥洹于光明国
  date: '3540-01-01'
  year_of: '3540'
  kind: death
  description: 住世四万岁化度已毕入般泥洹，经法住万岁乃尽
