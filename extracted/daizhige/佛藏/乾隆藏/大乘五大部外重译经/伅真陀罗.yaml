  - date: '0168-06-16'
    title_zh: 于大众前请问三昧
    rationale: 闻提无离菩萨问菩萨四事等法，欲因乐神因缘为当来众生显宝如来三昧所入所证
  - date: '0168-06-17'
    title_zh: 以诸法如幻如梦如响为所证
    rationale: 了知一切人声刹土声皆等而空，知名色无所有，心等持故无所生，即入法门
