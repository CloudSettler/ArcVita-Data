  archetype: 乐神护法
  dilemmas:
  - 以八万四千妓乐娱佛与以无所得空法度人之张力
  - 以妙音震动三千刹土显神通与以无相无愿令众入寂之平衡
  - 为乐神之王受众天敬仰与为求法者自居下座请问之谦抑
  lesson: 以音声为佛事，于琉璃琴声中显诸法如幻如梦如响，令闻者离执而入宝如来三昧
  summary_first_person: 吾乃名香山伅真陀罗王，领八万四千伎人与犍陀罗诸天，持琉璃琴诣罗阅只耆阇崛山供养释尊。吾一鼓琴声遍三千大千，山海树木低昂如舞，声闻亦不能自制，唯于摩诃衍不动。吾以此因缘请问如来宝三昧，愿以音声作佛事，度一切闻者。
