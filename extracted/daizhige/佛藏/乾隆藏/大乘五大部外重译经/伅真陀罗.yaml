  - date: '0168-05-10'
    title_zh: 率八万四千伎人同行
    rationale: 以本愿福力及佛威神所接，集大乐部欲以最胜音声供养正觉，令一切闻者生欢喜
  - date: '0168-06-10'
    title_zh: 面面四万二千伎乐围绕鼓琴
    rationale: 处中央同时鼓琉璃琴，使音声遍三千大千，覆蔽诸欲天色天伎乐，显法音无碍
  - date: '0168-06-15'
    title_zh: 以音声说法显空幻
    rationale: 令诸音皆言诸法等脱空无所有，使大众于乐音中闻法而悟无生
- id: guji-伅真陀罗-endeavor-2
  title_zh: 请问宝如来三昧证空入道
  description: 于佛前请问宝如来三昧法门，欲知菩萨如何以音声三昧入法身、化众生而不离本际
