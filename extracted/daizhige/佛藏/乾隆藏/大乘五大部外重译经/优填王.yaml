events:
- id: guji-优填王-event-birth
  title_zh: 生于跋蹉王室
  date: -0584
  year_of: -0584
  description: 约公元前6世纪生于拘睒弥城跋蹉国王室，后嗣王位
  location: 拘睒弥
- id: guji-优填王-event-welcome
  title_zh: 严驾迎佛
  date: '-0570'
  year_of: '-0570'
  description: 闻佛至拘盐惟国，敕傍臣左右皆悉严驾，遥见佛心踊跃欢喜，下车步进趋迎佛前头面礼足绕三匝长跪叉手
  location: 拘盐惟国
- id: guji-优填王-event-ask
  title_zh: 问造像功德
  date: '-0570'
  year_of: '-0570'
  description: 白佛言天上天下无能及佛者，愿问人作善得福当何趣向，佛去后恐不复见，欲作佛形像恭敬承事后当得何等福
  location: 拘盐惟国
- id: guji-优填王-event-teaching
  title_zh: 蒙佛广说造像得福
  date: '-0570'
  year_of: '-0570'
  description: 佛告王作佛形像后世生处眼目净洁身体完好，生天梵天豪贵富家帝王遮迦越王，寿一劫智慧无及，不堕恶道，常敬佛持华香灯宝上舍利，无数劫当得泥洹，福过于四天下江海水十倍
  location: 拘盐惟国
- id: guji-优填王-event-farewell
  title_zh: 欢喜礼退
  date: '-0570'
  year_of: '-0570'
  description: 王闻福欢喜前为佛作礼以头面着佛足，群臣皆为佛作礼而去
  location: 拘盐惟国
- id: guji-优填王-event-create
  title_zh: 首创佛像供养
  date: '-0570'
  year_of: '-0570'
  description: 依佛教发心作佛形像恭敬承事，为世间造立佛像之始，开以像显法之门
  location: 拘睒弥
- id: guji-优填王-event-offering
  title_zh: 以华香灯宝上佛舍利
  date: -0569
  year_of: -0569
  description: 常持杂缯彩华好香然灯及天下珍宝奇物持上佛舍利，慈心于经
  location: 拘睒弥
- id: guji-优填王-event-propagate
  title_zh: 率臣民共崇形像
  date: -0568
  year_of: -0568
  description: 劝化国内见佛形像以慈心叉手自归佛塔舍利者，死后百劫不入泥犁禽兽薜荔，生天复生富家终得泥洹
  location: 拘睒弥
- id: guji-优填王-event-death
  title_zh: 寿终往生阿弥陀佛国
  date: '-0520'
  year_of: '-0520'
  description: 王与群臣寿终皆生阿弥陀佛国，成就造像往生之验
  location: 阿弥陀佛国
