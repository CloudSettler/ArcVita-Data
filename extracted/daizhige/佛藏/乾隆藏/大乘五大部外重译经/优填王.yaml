  dilemmas:
  - 如何在佛入灭后令百姓仍得见佛生信
  - 如何以有形之像彰显无相之法而广植福田
  - 如何以造像功德令国人免堕恶道终得泥洹
  lesson: 以恭敬慈心造佛形像即是承事诸佛，所得福祐过于四海之水，终不堕恶道而得泥洹
  summary_first_person: 吾年十四嗣立为拘睒弥王，闻佛至拘盐惟国，严驾趋迎，头面礼足，问佛灭后作佛形像当得何福，蒙佛慈悲广说造像得端正在贵富乐乃至梵天帝王往生之福，吾闻已欢喜信受，率群臣礼退，誓造形像供养舍利，愿以此福回向往生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说作佛形像经.md
