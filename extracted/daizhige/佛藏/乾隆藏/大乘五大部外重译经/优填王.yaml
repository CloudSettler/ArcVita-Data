  name_zh: 优填王
  names:
    zh: 优填王
    en: Udayana
  lifespan:
    birth:
      date: -0584
      precision: year
      is_circa: true
      raw: 约前五八四年
    death:
      date: -336
      precision: year
      is_circa: true
      raw: 约前五二〇年
  birth_date: -0584
  death_date: -336
  era: 春秋
  reign_ref: 跋蹉国
  archetype: 慕法护教之王
  dilemmas:
  - 佛住世不久将去，欲瞻仰无由，当以何方便系念续缘
  - 为王当以威势治国，抑当以敬信导民，二者何以抉择
  - 恐造像失仪反成亵慢，欲求的证以安心兴作
  lesson: 以恭敬心造立形像即是摄心归佛，福以敬生，敬以福显，能令见闻者离恶向善，终入涅槃
  summary_first_person: 吾年十四嗣立跋蹉，闻世尊至拘罗瞿国拘深瞿师园，踊跃严驾，下步罢从，三礼绕佛，恐佛去后无所瞻事，稽首请问作佛形像得何福报。世尊广说自眼目端政、身如紫磨金色、常生尊贵富乐之家，乃至作帝王、转轮圣王、梵天王，终不堕恶道，终得涅槃。吾闻已大欢喜，信受奉行，即得须陀洹道，方知王道在以像教系念群生。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说造立形像福报经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/佛说造立形像福报经.html
endeavors:
