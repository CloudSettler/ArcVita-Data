  title_zh: 迎佛请法问造像福
  summary_zh: 年十四闻佛至拘罗瞿国，严驾迎拜，罢却侍从，徒步礼佛，请问佛去后造立形像所得福报，遂得广说胜因
  phases:
  - key: brewing
    name: 闻讯严驾
    labels:
      zh: 闻佛当来敕令严驾
    start_date: -368
    highlight_event_id: guji-优填王-event-meeting
  - key: breakthrough
    name: 下步礼迎
    labels:
      zh: 罢从徒步三礼三绕
    start_date: -368
    highlight_event_id: guji-优填王-event-meeting
  - key: climax
    name: 稽首请问
    labels:
      zh: 长跪叉手问造像福报
    start_date: -368
    highlight_event_id: guji-优填王-event-asking
  - key: closure
    name: 闻法证入
    labels:
      zh: 欢喜信受得须陀洹道
    start_date: -368
    highlight_event_id: guji-优填王-event-attaining
  decisions:
  - date: -368
    title_zh: 罢却左右持盖者徒步迎佛
    rationale: 欲以至诚破除王威隔碍，示国人以佛为天人大师
  - date: -368
    title_zh: 直陈忧虑请问造像功德
    rationale: 恐佛去后不复得见，思以形像存圣容、续善缘，须得佛亲证方敢兴作
- id: guji-优填王-endeavor-2
  title_zh: 造像兴福导众归敬
  summary_zh: 依佛所说广宣造像无量福报，劝令刻画供养，以香华缯彩灯明奉塔，使见像者生恭敬心，远离恶道
  phases:
  - key: brewing
    name: 筹议造像
    labels:
      zh: 思佛去后无所瞻事情计刻画
    start_date: -0559
    highlight_event_id: guji-优填王-event-asking
  - key: breakthrough
    name: 依教刻画
    labels:
      zh: 恭敬承事初立形像
    start_date: -0559
    highlight_event_id: guji-优填王-event-image
  - key: climax
    name: 广宣福报
    labels:
      zh: 为傍臣百姓说像福无量
    start_date: -0558
    highlight_event_id: guji-优填王-event-image
  - key: closure
    name: 众生同缘
    labels:
      zh: 比丘尼优婆塞等皆欢喜礼佛后生净土
    start_date: -0558
    highlight_event_id: guji-优填王-event-image
  decisions:
  - date: -0559
    title_zh: 定议依佛语刻画形像香华供养
    rationale: 信佛言造像福多于四海之水，能令生处常护佛道，故当躬先表率
  - date: -0558
    title_zh: 令傍臣左右咸起作礼广传播扬
    rationale: 欲使一国见闻同植善根，共结来世往生净土之缘
events:
