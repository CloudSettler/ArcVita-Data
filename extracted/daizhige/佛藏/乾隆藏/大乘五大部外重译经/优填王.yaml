  title_zh: 诞生于跋蹉王室
  date: -0584
  year_of: -0584
  description: 约春秋时生于古印度跋蹉国王家，嗣为优填王
  location_zh: 跋蹉国
- id: guji-优填王-event-meeting
  title_zh: 年十四严驾迎佛于拘罗瞿国
  date: -368
  year_of: -368
  description: 闻世尊至拘罗瞿国拘深瞿师园，敕左右严驾，遥见踊跃，下步罢从，以头面礼足，三绕长跪
  location_zh: 拘罗瞿国拘深瞿师园
- id: guji-优填王-event-asking
  title_zh: 长跪请问造立形像福报
  date: -368
  year_of: -368
  description: 白佛言人作善得何福祐，佛去后欲作形像恭敬承事，愿说其福，佛遂广说作像生处端政、富贵、为帝王转轮王乃至梵天王、终得涅槃之福
  location_zh: 拘深瞿师园
- id: guji-优填王-event-attaining
  title_zh: 闻经欢喜得须陀洹道
  date: -368
  year_of: -368
  description: 闻佛说偈答造像胜福，以偈赞佛，欢喜信解，即得须陀洹道
  location_zh: 拘深瞿师园
- id: guji-优填王-event-image
  title_zh: 倡造佛像劝众供养
  date: -0559
  year_of: -0559
  description: 依佛教敕刻画造立形像，以杂香华缯彩灯明珍宝奉上佛塔，劝五百傍臣及四众同生恭敬，广宣像福不可称量
  location_zh: 跋蹉国
- id: guji-优填王-event-death
  title_zh: 寿终往生净土行菩萨道
  date: -336
  year_of: -336
  description: 传与比丘比丘尼优婆塞优婆夷及傍臣同缘，后皆往生阿弥陀佛国，作大菩萨
  location_zh: 跋蹉国
