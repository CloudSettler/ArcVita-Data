  reign_ref: 跋蹉国
  archetype: 虔信护法之君
  dilemmas:
  - 思慕如来成疾与恐造像不似获罪之两难
  - 恃人间工巧无能与感天匠化现之抉择
  - 忧悲自丧与开轨则利后世之抉择
  lesson: 以至诚随分造像，虽不能尽相好而功德广大，为后世立造像供养之初轨
  summary_first_person: 吾为跋蹉国主优陀延，值佛升忉利为母说法三月，阎浮如暗夜无月、如国无君，思慕成疾几欲舍命。欲造佛像礼敬而惧不似获罪，终悟随分赞叹亦获无量福，遂召工巧择紫栴檀，感毗首羯磨天化为匠者，于弗沙宿合之日斫木成七尺加趺坐像。后躬荷宝像往僧伽尸城迎佛自天而降，蒙佛称赞授记，知此为后世造像功德之始。
  source_urls:
