  decisions:
  - date: -0531-09-27
    title_zh: 躬荷宝像往僧伽尸城
    rationale: 以身荷负表至诚，令四众知是佛像，成迎佛之殊胜供养
  - date: -0531-09-28
    title_zh: 集诸王共以香花音乐供养
    rationale: 拔诸王愁忧毒箭，令共生喜庆，同植造像功德因缘
  - date: -0531-09-28
    title_zh: 承佛教立后世轨则
    rationale: 领受佛言初为轨则令无量众生得信利之授记，承担弘宣造像功德之任
events:
- id: guji-优陀延王-event-birth
  title_zh: 诞生于跋蹉王室
  date: -0580
  year_of: -0580
  place_zh: 跋蹉国拘睒弥城
  description_zh: 生于跋蹉王家，为拘睒弥城主，后为佛世时与频婆娑罗、波斯匿并称之大国王
- id: guji-优陀延王-event-gather-craftsmen
  title_zh: 召集工巧议造佛像
  date: '-0532'
  year_of: '-0532'
  place_zh: 跋蹉王宫
  description_zh: 佛升忉利三月，人间无佛如暗夜无月，王忧悲思慕，与夫人婇女不乐，召国内工巧欲造佛像，众匠以佛相好世间无匹不敢承命
- id: guji-优陀延王-event-tianjiang
  title_zh: 天匠化现斫檀
  date: -0531-08-08
  year_of: '-0531'
  place_zh: 跋蹉王宫
  description_zh: 毗首羯磨天化为匠者持利器至王门，自言工巧世中无匹，王以紫栴檀付之，于月初八日弗沙宿合之时斫木，其声上彻忉利，佛为微笑授记
- id: guji-优陀延王-event-image-complete
  title_zh: 七尺紫金坐像告成
  date: -0531-09-01
  year_of: '-0531'
  place_zh: 跋蹉王宫
  description_zh: 天匠专精不日而成，加趺坐高七尺，面及手足紫金色，惟螺髻玉毫少似于佛，王见像生净信获柔顺忍，业障忧恼并除
- id: guji-优陀延王-event-welcome-buddha
  title_zh: 率兵荷像赴僧伽尸迎佛
  date: -0531-09-27
  year_of: '-0531'
  place_zh: 僧伽尸城道场
  description_zh: 佛告目连七日后下阎浮提，王严整四兵乘白象躬荷所造之像，花幡音乐随逐供养，与波斯匿、阿阇世等诸王并四众俱集僧伽尸城
- id: guji-优陀延王-event-offer-image
  title_zh: 于宝阶下献像蒙佛称叹
  date: -0531-09-28
  year_of: '-0531'
  place_zh: 僧伽尸城宝阶之下
  description_zh: 佛与梵释诸天自三道宝阶而下，王顶戴佛像奉献，佛言非为过咎，已作无量利益初为轨则，帝释亦劝王欢喜自庆，未来有信者皆因王造像获福
- id: guji-优陀延王-event-death
  title_zh: 逝世
  date: '-0510'
  year_of: '-0510'
  place_zh: 跋蹉国
  description_zh: 于弘宣造像功德、为后世立则后终其世，史传或云为政变所弑，约终于公元前六世纪末
