  decisions:
  - date: '-0532'
    title_zh: 决意随分造像不以不似为惧
    rationale: 思以渴饮河水岂以不能尽饮而不饮为喻，破恐获罪之疑，确立随分造像亦获无量福之正见
  - date: -0531-08-08
    title_zh: 择紫栴檀作坐师子座加趺像
    rationale: 纳智臣议，鉴诸佛成道转法轮皆坐，定坐像之式以表法
  - date: -0531-08-08
    title_zh: 委任化现天匠专作
    rationale: 知人间工巧不能肖佛相好，信天匠化现为最胜因缘，授以香木即日起作
- id: guji-优陀延王-endeavor-2
  title_zh: 荷像迎佛弘宣功德
  summary_zh: 佛将自忉利下阎浮提于僧伽尸城，躬荷宝像率四兵迎供，令诸王共瞻礼，蒙佛及帝释称叹授记，立后世造像轨则
  phases:
