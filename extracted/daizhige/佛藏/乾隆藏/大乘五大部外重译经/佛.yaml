  lesson: 见缘起即见法，见法即见我；诸法缘生缘灭，无命非命，无我无主，当观五事非常不断不步
  summary_first_person: 吾为迦毗罗卫释种，睹生老病死而出家，六年勤苦而后知非道，于菩提树下观十二因缘之宛转，悟缘起性空，遂鹿野初转法轮，复于舍卫说本生死经，告舍利弗等见外缘起五事与内缘起四缚，使众生离忧悲苦恼得解脱
