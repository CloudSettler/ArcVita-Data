endeavors:
- id: guji-佛-endeavor-1
  title_zh: 证悟缘起与宣说四谛法门
  goal_zh: 观十二因缘生灭，开示见缘起即见法以断生死苦本
  phases:
  - key: brewing
    name: 出家访道
    labels:
      zh: 王宫出家
    start_date: '-0534'
    highlight_event_id: guji-佛-event-awakening
  - key: breakthrough
    name: 菩提证悟
    labels:
      zh: 觉悟缘起
    start_date: -0528
    highlight_event_id: guji-佛-event-awakening
  - key: climax
    name: 初转法轮
    labels:
      zh: 鹿野说法
    start_date: -0528
    highlight_event_id: guji-佛-event-first-turning
  - key: closure
    name: 重说生死缘起
    labels:
      zh: 说本生死经
    start_date: '-0500'
    highlight_event_id: guji-佛-event-benshengsi
  decisions:
  - date: '-0534'
    title_zh: 舍王位出家
    rationale: 睹生老病死忧悲苦恼，知王位五欲不能免苦，决意出家寻求解脱
  - date: -0528
    title_zh: 舍苦行行中道
    rationale: 知极端苦行非觉悟因，犹如琴弦过紧则断，遂受乳糜以中道证道
  - date: -0528
    title_zh: 定中观十二因缘
    rationale: 悟不明缘行至老死宛转相缚，非自作非他作，为断苦本须逆顺观缘起
- id: guji-佛-endeavor-2
  title_zh: 建立僧团与摄化弟子
  goal_zh: 以舍利弗等为上首，令法住世流传后世
  phases:
  - key: brewing
    name: 摄受五比丘
    labels:
      zh: 初度弟子
    start_date: -0528
    highlight_event_id: guji-佛-event-first-turning
  - key: breakthrough
    name: 舍利弗归依
    labels:
      zh: 智慧第一归佛
    start_date: '-0520'
    highlight_event_id: guji-佛-event-shariputra
  - key: climax
    name: 祇园弘化
    labels:
      zh: 舍卫说法
    start_date: '-0500'
    highlight_event_id: guji-佛-event-benshengsi
  - key: closure
    name: 涅槃付嘱
    labels:
      zh: 拘尸涅槃
    start_date: -0483-02-15
    highlight_event_id: guji-佛-event-death
  decisions:
  - date: '-0520'
    title_zh: 授舍利弗缘起深义
    rationale: 舍利弗聪慧能传法，说本生死经令其转告诸比丘，使见缘起者见四谛
  - date: '-0500'
    title_zh: 以譬喻明不步
    rationale: 用镜像月影火炎为喻，明识不躇步而缘生，破常见断见便于众生领解
