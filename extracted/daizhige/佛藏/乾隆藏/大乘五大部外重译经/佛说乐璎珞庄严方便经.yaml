person:
  qid: guji-佛说乐璎珞庄严方便经
  name_zh: 佛说乐璎珞庄严方便经
  names:
    zh: 乐璎珞女菩萨
    en: Leyingluo Bodhisattva
  lifespan:
    birth:
      date: -0500-01-01
      precision: year
      is_circa: true
      raw: 约公元前五世纪佛住王舍城时期示现
    death:
      date: -0450-01-01
      precision: year
      is_circa: true
      raw: 约佛涅槃前后示现无生无灭
  birth_date: 约公元前500年
  death_date: 约公元前450年
  era: 东周·释迦牟尼佛世
  reign_ref: 佛住王舍城耆阇崛山时期
  archetype: 璎珞庄严·方便度生的辩才菩萨
  dilemmas:
  - 以五欲乐摄众生与声闻视五欲为道障之间的张力
  - 以假名言说无诤与究竟无言无诤不可说之间的抉择
  - 以如化示现女身与如如平等无化无不化之间的安立
  lesson: 先以众生所乐满其所愿为方便，后令入佛智；真无诤非以言说立无诤，乃离文字、离颠倒、离取著，于如如中如化度生
  summary_first_person: 我以璎珞庄严示现女身，于王舍城长者家中门与须菩提论食想、灭定与无诤，显一切法如化、如如一如；我随众生所乐施以禅乐、天乐、国位、财宝、歌舞乃至色声香味，令先满愿后劝发无上正真道心，并演大乘广大无尽及如来乞食二十无过患，证知大乘无一无异、慈悲无碍
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B9%90%E7%92%8E%E7%8F%9E%E5%BA%84%E4%B8%A5%E6%96%B9%E4%BE%BF%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B9%90%E7%92%8E%E7%8F%9E%E5%BA%84%E4%B8%A5%E6%96%B9%E4%BE%BF%E7%BB%8F.md
endeavors:
- id: guji-佛说乐璎珞庄严方便经-endeavor-1
  title_zh: 乐璎珞庄严以欲为方便摄生
  description: 随众生所乐所求，施与禅定乐、天王乐、转轮王乐、长者居士乐、色声香味触及华香幢盖金宝歌舞等一切所乐，先令满足后劝发无上菩提心
  phases:
  - key: brewing
    name: 观机知乐
    labels:
      zh: 观机
    start_date: -0500-01-01
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-1
  - key: breakthrough
    name: 随乐遍施
    labels:
      zh: 与乐
    start_date: -0500-02-01
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-2
  - key: climax
    name: 劝发无上道心
    labels:
      zh: 发心
    start_date: -0500-03-01
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-3
  - key: closure
    name: 三千界调伏无边
    labels:
      zh: 圆成
    start_date: -0499-01-01
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-4
  decisions:
  - date: -0500-02-01
    title_zh: 决计先与欲后令入法
    rationale: 众生未满所愿不生信受，故先施所乐为钩，后以佛法度之
  - date: -0500-03-01
    title_zh: 决计以如化观行施而无著
    rationale: 知一切欲乐如化如如，无染无缚，菩萨于无所得中行方便故施而不著
- id: guji-佛说乐璎珞庄严方便经-endeavor-2
  title_zh: 般若空性无诤大乘显发
  description: 于中门与须菩提论灭定、无诤、假名、沙门法及如化如如，演大乘无一异、广大无尽相貌及如来乞食二十无过患，令天人得法眼净并发大心
  phases:
  - key: brewing
    name: 中门诘难食与灭
    labels:
      zh: 诘难
    start_date: -0500-02-10
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-1
  - key: breakthrough
    name: 显如化如如破假名诤
    labels:
      zh: 显如
    start_date: -0500-02-15
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-2
  - key: climax
    name: 广说大乘及佛乞食方便
    labels:
      zh: 演大乘
    start_date: -0500-02-20
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-3
  - key: closure
    name: 天人得悟发菩提心
    labels:
      zh: 得悟
    start_date: -0500-02-25
    highlight_event_id: guji-佛说乐璎珞庄严方便经-event-4
  decisions:
  - date: -0500-02-15
    title_zh: 决计以如如平等显化
    rationale: 若见我与如来及一切法一如无异，则知化与不化皆无所得，能破执名取相之诤
  - date: -0500-02-20
    title_zh: 决计具说大乘无尽相貌
    rationale: 为令声闻知大乘广大无量、难解难入，故说大智、无尽、摄持、慈悲等无量行相令生信向
events:
- id: guji-佛说乐璎珞庄严方便经-event-birth
  title_zh: 示现生于王舍城长者家
  date: -0500-01-01
  year_of: -320
  description: 示现为长者家女，端正第一盛色美妙，有大威德，以诸璎珞珍宝庄严，振触有妙音
  location: 王舍城
- id: guji-佛说乐璎珞庄严方便经-event-1
  title_zh: 中门与须菩提问答乞食无诤
  date: -0500-02-15
  year_of: -320
  description: 须菩提次第乞食至中门，女诘食想、灭定养身、无诤行非行、假名诤讼与沙门法，广说离文字、离着、离阴魔等为沙门法，三十天子得法眼净、五天子发无上道心
  location: 王舍城长者家中门
- id: guji-佛说乐璎珞庄严方便经-event-2
  title_zh: 自显如化如如破须菩提疑
  date: -0500-02-18
  year_of: -320
  description: 知须菩提疑为佛化，广说如来如、我如、众生如、一切法如皆一如无异无生无灭，空中声印须菩提非凡夫非学非罗汉但持假名
  location: 王舍城长者家中门
- id: guji-佛说乐璎珞庄严方便经-event-3
  title_zh: 演说大乘相貌及如来乞食二十无过患
  date: -0500-02-20
  year_of: -320
  description: 说大乘如日月宫无碍行六度、如轮王平等慈心，具无尽不断广博摄持等智；次说如来为示色身、令盲聋得益、破憍慢、满施愿、显神力等二十方便而行乞食，二百八十人发无上道心
  location: 王舍城长者家
- id: guji-佛说乐璎珞庄严方便经-event-4
  title_zh: 示乐欲庄严方便遍摄众生
  date: -0500-03-01
  year_of: -320
  description: 自说夫主即一切乐欲可调伏众生，随其所乐施禅定、帝释、护世、天龙、转轮王、小王、长者婆罗门、色声香味、华香幢盖、金宝歌舞等乐，然后劝发无上道心，已调众生数超三千大千世界色相之量
  location: 王舍城及三千大千世界
- id: guji-佛说乐璎珞庄严方便经-event-death
  title_zh: 示现入于法性无生究竟
  date: -0450-01-01
  year_of: -296
  description: 示现如如常真不变、无生无灭、中无所盛、住一切法，于法界中无去无来，令众生知化相本空、如如常住
  location: 法界
