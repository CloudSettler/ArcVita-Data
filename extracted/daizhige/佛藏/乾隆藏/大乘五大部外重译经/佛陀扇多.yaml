  - date: '0531'
    title_zh: 明示不敬果报与报恩难量
    rationale: 令学人知虽肩荷供养难报师恩，以破懈怠轻慢，说过之咎
events:
- id: guji-佛陀扇多-event-birth
  title_zh: 出生于天竺
  date: 0480
  year_of: 0480
  description: 约北魏前期生于天竺，出家习三藏，通梵汉
- id: guji-佛陀扇多-event-arrive-luoyang
  title_zh: 至洛阳入魏
  date: '0525'
  year_of: '0525'
  description: 自天竺西来，至北魏洛阳，入译场，时在元魏
- id: guji-佛陀扇多-event-observe
  title_zh: 观察末世比丘轻慢相
  date: '0526'
  year_of: '0526'
  description: 见有比丘但求衣食不乐求法轻慢师长，遂发心宣演恭敬法门
- id: guji-佛陀扇多-event-translate-start
  title_zh: 开译正恭敬经
  date: '0530-01-01'
  year_of: '0530'
  description: 于洛阳开译佛说正恭敬经，阐明敬法敬师之仪
- id: guji-佛陀扇多-event-translate-finish
