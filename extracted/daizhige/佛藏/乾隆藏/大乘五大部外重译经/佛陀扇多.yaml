    start_date: '0510'
    highlight_event_id: guji-佛陀扇多-event-arrival
  - key: climax
    name: 洛阳立足
    labels:
      zh: 入译场
    start_date: '0516'
    highlight_event_id: guji-佛陀扇多-event-arrival
  - key: closure
    name: 译业初启
    labels:
      zh: 初译经论
    start_date: 0518
    highlight_event_id: guji-佛陀扇多-event-translation
  decisions:
  - date: '0510'
    title_zh: 决意东行入魏
    rationale: 不以梵本自秘，欲使大乘空义遍行东土，故冒艰险东度
  - date: '0516'
    title_zh: 择洛阳为译场
    rationale: 魏都崇佛多藏经僧，便于得助译证义
- id: guji-佛陀扇多-endeavor-2
  title_zh: 译传金刚上味陀罗尼
  description: 于金窟庄严聚落法会因缘下，宣译金刚上味陀罗尼，阐明诸法皆空、烦恼即菩提的不二法门
  phases:
  - key: brewing
    name: 梵本勘校
    labels:
      zh: 对校梵汉
    start_date: 0518
    highlight_event_id: guji-佛陀扇多-event-translation
  - key: breakthrough
    name: 定译空义
    labels:
      zh: 立无得宗
    start_date: '0520'
    highlight_event_id: guji-佛陀扇多-event-translation
  - key: climax
    name: 宣演法门
    labels:
      zh: 授不二门
    start_date: '0521'
    highlight_event_id: guji-佛陀扇多-event-preaching
  - key: closure
    name: 流通付嘱
    labels:
      zh: 付嘱护持
    start_date: '0522'
    highlight_event_id: guji-佛陀扇多-event-preaching
  decisions:
  - date: '0520'
    title_zh: 以顺一切法立陀罗尼句
    rationale: 为破部执分别，顺贪嗔顺天龙顺地狱皆入陀罗尼句，显诸法平等无碍
  - date: '0521'
    title_zh: 重显梦喻地狱观
    rationale: 以睡梦堕狱为喻，明凡夫颠倒自缚实无所有，使闻者得无生法忍
events:
- id: guji-佛陀扇多-event-birth
  title_zh: 生于北天竺
  date: 0480
  year_of: 480
  place_zh: 北天竺
  description: 佛陀扇多生于北天竺，少习声明因明，通大乘三藏，为三藏法师
- id: guji-佛陀扇多-event-arrival
  title_zh: 抵达洛阳
  date: '0516'
  year_of: 516
  place_zh: 洛阳
  description: 承元魏崇佛之风入洛阳，得王室及僧众护持，入译场备译
- id: guji-佛陀扇多-event-translation
  title_zh: 译出金刚上味陀罗尼经一卷
  date: '0520'
  year_of: 520
  place_zh: 洛阳金窟译场
  description: 译出金刚上味陀罗尼经一卷，宣说金刚上味中无菩提无佛法、无此彼岸、触受爱取皆菩提等不二义，于虚空中为众菩萨说
- id: guji-佛陀扇多-event-preaching
  title_zh: 宣演不二法门令众得忍
  date: '0521'
  year_of: 521
  place_zh: 庄严聚落金窟
  description: 讲无明即菩提、行识名色六入皆菩提及梦喻地狱，众中九万二千菩萨得无生法忍，三万二千初发心菩萨得忍
- id: guji-佛陀扇多-event-death
  title_zh: 示寂
  date: '0540'
  year_of: 540
  place_zh: 洛阳
  description: 译事既成示寂于魏地，后人列其所译入乾隆藏大乘五大部外重译经
