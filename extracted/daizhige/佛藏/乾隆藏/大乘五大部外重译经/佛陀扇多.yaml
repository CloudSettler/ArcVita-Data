    rationale: 不辞远涉，欲使中土僧众得闻师弟正礼，使正法久住
  - date: '0530'
    title_zh: 择正恭敬经先译
    rationale: 见末世轻慢和上阿阇梨，故以恭敬为急务，先示依止威仪
