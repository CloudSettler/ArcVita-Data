  - 戒律恭敬细行与大乘方便化导之间何以平衡
  - 远来客僧身份与魏室译场规制之间何以自处
  lesson: 敬法在敬师，敬师在细行；法得久住，惟凭恭敬
  summary_first_person: 吾自天竺来入魏土，惟愿正法久住中土；译正恭敬一经，欲使学人知师弟之礼不可缺，敬法之心见于洒扫进退之间，虽肩荷顶戴难报师恩一偈之德
