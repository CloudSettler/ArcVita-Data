  era: 北魏
  reign_ref: 元魏孝明帝时
  archetype: 译经三藏
  dilemmas:
  - 梵典玄微与华言浅近如何会通而不失真
  - 空性离相与度生弘愿如何并行而不堕断常
  lesson: 诸法本空无染无得，于无得中兴大悲译传，使一字含万法
  summary_first_person: 吾北天竺人也，号佛陀扇多，荷三藏之学，涉流沙而东入元魏，于洛阳译金刚上味陀罗尼，欲以无相法门破众生系缚，令知贪嗔即陀罗尼句，地狱如梦本无所得
  source_urls:
