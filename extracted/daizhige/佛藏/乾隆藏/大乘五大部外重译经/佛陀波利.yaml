    labels:
      zh: 突破
    start_date: '0676'
    highlight_event_id: guji-佛陀波利-event-obtain-dharani
  decisions:
  - date: '0665'
    title_zh: 决意东行求文殊
    rationale: 笃信文殊现住震旦五台，非亲履中土不能得真教，遂辞亲远涉
  - date: 0676-06
    title_zh: 于五台获梵本即返京请译
    rationale: 既得尊胜梵本，当速归长安奏请译传，使阎浮众生同获离恶趣之益
- id: guji-佛陀波利-endeavor-2
  title_zh: 奉诏合译佛顶尊胜陀罗尼经
  description: 仪凤年间奉唐高宗诏，与散郎杜行顗等同译梵本为汉文一卷，具宣陀罗尼、坛场印契、持诵斋戒及安幢咒土等行法
  phases:
  - key: climax
    name: 奉诏翻译
    labels:
      zh: 高潮
    start_date: 0682
    highlight_event_id: guji-佛陀波利-event-translation
  - key: closure
    name: 弘传收束
    labels:
      zh: 收束
    start_date: 0683
    highlight_event_id: guji-佛陀波利-event-propagation
  decisions:
  - date: 0682
    title_zh: 奏请杜行顗笔受奉制译
    rationale: 梵汉悬隔需中土文吏润色，奉制得正可取信四众广宣流布
  - date: 0682-08
    title_zh: 详定坛法与持诵轨仪
    rationale: 恐徒持咒无行法，故并宣白月十五斋戒、方坛合掌印契、咒土散骸等法，使冥阳两利
