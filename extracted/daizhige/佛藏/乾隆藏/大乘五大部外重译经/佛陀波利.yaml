endeavors:
- id: guji-佛陀波利-endeavor-1
  title_zh: 罽宾求法与五台巡礼
  description: 自罽宾西来，慕文殊菩萨现住五台，履涉葱岭河西，至五台山礼觐祈见，感得佛顶尊胜陀罗尼梵本
  phases:
  - key: brewing
    name: 萌发求法
    labels:
      zh: 萌发
    start_date: '0665'
    highlight_event_id: guji-佛陀波利-event-arrival-wutai
  - key: breakthrough
