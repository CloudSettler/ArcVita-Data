  dilemmas:
  - 梵汉悬隔与真伪取信，如何使密咒梵本得中土信受
  - 持咒功德与戒行实修，孰为转恶趣延寿之正因
  lesson: 以至诚求法不辞葱岭之险，以慈悲译传令清净诸趣陀罗尼普济幽显，信行合一方能净障延生
  summary_first_person: 吾罽宾沙门，慕文殊住中国五台，涉险东来礼觐，获佛顶尊胜陀罗尼梵本，蒙唐高宗诏与杜行顗奉制译为一卷，详定斋戒坛法与持诵轨仪，愿此尊胜真言净除一切恶趣业障，令闻持者长寿安乐
