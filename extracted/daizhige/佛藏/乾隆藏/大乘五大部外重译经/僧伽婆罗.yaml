    start_date: '0506'
    highlight_event_id: guji-僧伽婆罗-event-2
  - key: closure
    name: 获梁武帝礼遇入京
    labels:
      zh: 收束
    start_date: '0507'
    highlight_event_id: guji-僧伽婆罗-event-3
  decisions:
  - date: '0505'
    title_zh: 决意舍扶南基业泛海赴梁
    rationale: 见梁武帝崇佛、海路渐通，欲使孔雀明王等护世密法广利华夏，故不惮风涛之险
  - date: '0506'
    title_zh: 选择建康为弘法根本道场
    rationale: 建康为梁都，译经资供具足，王臣护法，便于聚集译众成就大藏
- id: guji-僧伽婆罗-endeavor-2
  title_zh: 建康译场译孔雀王咒经弘护
  description: 于梁天监年间主持译场，译出佛说孔雀王咒经二卷等，以咒力结界护国、除毒疗病
  phases:
  - key: brewing
    name: 设场集众
    labels:
      zh: 萌芽
    start_date: 0508
    highlight_event_id: guji-僧伽婆罗-event-3
  - key: breakthrough
    name: 译孔雀王咒经
    labels:
      zh: 突破
    start_date: '0510'
    highlight_event_id: guji-僧伽婆罗-event-4
  - key: climax
    name: 咒法敷行
    labels:
      zh: 高潮
    start_date: '0512'
    highlight_event_id: guji-僧伽婆罗-event-4
  - key: closure
    name: 诸经译竟流通
    labels:
      zh: 收束
    start_date: '0520'
    highlight_event_id: guji-僧伽婆罗-event-5
  decisions:
  - date: '0510'
    title_zh: 梵咒存音兼加梁言注释
    rationale: 孔雀王咒以音声为用，若全译为义则失神验，故保留梵音真言并以梁言注食乳饮血等义类
  - date: '0512'
    title_zh: 广说结界结地与四百四病对治
    rationale: 中土蛇毒疫疠、寒热风痰为患，须详载天龙八部守护、结界护持之仪轨以应众生急需
