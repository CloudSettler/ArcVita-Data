  - 扶南安逸住持与航海入梁弘法之抉择
  - 梵咒音韵存真与华言训释达意之权衡
  lesson: 以慈悲护世之心作舟楫，以音义兼存之法作津梁，方能令密咒流通、消灾护国
  summary_first_person: 吾乃扶南僧伽婆罗，少出家而通三藏，泛海入梁蒙武帝礼遇，于建康设译场译孔雀王咒经等，存梵音而注梁言，愿以孔雀明王慈护之力，结界守护，令众生离毒怖而得安隐。
