- id: guji-六字咒王经-event-5
  title_zh: 说无尽藏陀罗尼利益
  date: '0320-06-15'
  type: career
  description: 说此咒能除闇为诸天梵释护世所敬得三十三无畏降魔伏论悦众降怨
  year_of: '0320'
- id: guji-六字咒王经-event-6
  title_zh: 晨起礼诵广利流通
  date: '0320-07-01'
  type: career
  description: 教晨起澡手漱口烧香礼拜三遍读诵所向常胜众人贵敬见者欢喜守护法藏利益三宝
  year_of: '0320'
- id: guji-六字咒王经-event-death
  title_zh: 法本长存永作护持
  date: ''
  type: death
