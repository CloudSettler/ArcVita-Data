  lesson: 以断五辛持戒清净为基仗佛真实语及三宝威德持六字咒王则诸邪咒毒皆悉灭除昼夜常安
  summary_first_person: 我即六字咒王经先佛所说今佛亦说因阿难为栴陀罗女厌惑而演说于祇陀林愿众持此真实章句破诸咒道护身护他得寿百岁昼安夜安
