    highlight_event_id: guji-六字咒王经-event-4
  - key: climax
    name: 慈护同伴
    labels:
      zh: 缚贼护行
    start_date: '0320-06-01'
    highlight_event_id: guji-六字咒王经-event-5
  - key: closure
    name: 无尽藏流通
    labels:
      zh: 晨礼三遍流通
    start_date: '0320-07-01'
    highlight_event_id: guji-六字咒王经-event-6
  decisions:
  - date: '0320-05-01'
    title_zh: 制净行以行咒
    rationale: 非鲜洁无垢不能感验故禁五辛淫酒肉洗浴礼观音而后说咒
  - date: '0320-05-15'
    title_zh: 授白叠綖结咒法
    rationale: 以有形之綖表无形之护令官事斗诤咒诅皆灭便于众生奉持
