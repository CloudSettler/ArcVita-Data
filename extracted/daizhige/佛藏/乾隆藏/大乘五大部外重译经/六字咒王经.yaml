    highlight_event_id: guji-六字咒王经-event-3
  decisions:
  - date: '0320-02-01'
    title_zh: 称先佛所说以增信
    rationale: 显此咒王非一佛独创乃诸佛同宣令众敬信受持
  - date: '0320-03-01'
    title_zh: 广举作处即处灭除
    rationale: 令知无论上向下向壁柱城门水中火中皆可对治不令众生畏惧
- id: guji-六字咒王经-endeavor-2
  title_zh: 制行授法护身利他
  description: 明持诵仪轨须断五辛酒肉淫欲洁净礼敬观音及三世诸佛以白叠綖七遍结綖护身并得悦众降怨无畏之利
  phases:
