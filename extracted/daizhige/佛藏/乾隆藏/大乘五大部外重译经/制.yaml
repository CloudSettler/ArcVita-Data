  date: '-544'
  year_of: -544
  summary: 第二忉利天王释谓制以小施求佛不能得历十百千万亿劫亦未得制答常持善心精进不懈会当作佛
  location: 佛前
- id: guji-长者子制-event-indra-test2
  title_zh: 再试须弥四宝慈念
  date: '-544'
  year_of: -544
  summary: 帝释言虽持四宝须弥山慈念人民千万亿劫亦未得佛制以匠师择直木为喻明会当可意
  location: 佛前
- id: guji-长者子制-event-indra-test3
  title_zh: 以火坑难诘转付弥勒
  date: '-544'
  year_of: -544
  summary: 帝释劝求第七梵第二释易得又以满阎浮大火投身杀生堕地狱诘之制言满火亦投众生皆付弥勒自求佛不止并言梵释亦当衰死
  location: 佛前
- id: guji-长者子制-event-prophecy
  title_zh: 佛授记当来作佛须弥迦罗
  date: '-544'
  year_of: -544
  summary: 佛告制已事六万佛常愿作佛却后二百亿万劫不堕恶趣当为遮迦越王上下梵天百亿万劫后作佛号须弥迦罗身长二百丈度六千亿四千亿阿罗汉国土平正人民安乐
  location: 耆阇崛山中
- id: guji-长者子制-event-death
  title_zh: 授记后礼佛而去入菩萨行
  date: '-480'
  year_of: -480
  summary: 佛说经已制及诸比丘皆头面礼足而去入长劫菩萨行趣向授记
  location: 耆阇崛山
