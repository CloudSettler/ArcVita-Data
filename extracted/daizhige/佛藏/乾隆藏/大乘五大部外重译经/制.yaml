  location: 罗阅只城檀尼迦柰宅
- id: guji-长者子制-event-meet-buddha
  title_zh: 七重门内遥见佛光
  date: '-544'
  year_of: -544
  summary: 年十六佛与五百阿罗汉入城乞食至其家门外佛放威神彻照七重门制见光明心大欢喜
  location: 罗阅只城檀尼迦柰家第三门内
