    title_zh: 定受持仪轨广示众
    rationale: 依经所说沐浴净衣、图绘八夜叉、八菩萨护念之法，令行者如法行持得验
  - date: 0985
    title_zh: 劝随喜书写广为人说
    rationale: 经言随喜书写功德胜恒沙布施，故劝不能受持者亦生随喜以种菩提因
events:
- id: guji-gongdezhi-event-birth
  title_zh: 生于西域
  date: 0930
  year_of: 930
  place: 西域
  description: 约宋初生于西域，少习梵典，精通陀罗尼梵音与大乘经论。
  endeavor_ref: guji-gongdezhi-endeavor-1
- id: guji-gongdezhi-event-arrival
  title_zh: 入宋抵汴京
  date: 0975
  year_of: 975
  place: 汴京
  description: 自西域携梵本东来，入宋抵汴京译场，得朝廷支持列入译经行列。
  endeavor_ref: guji-gongdezhi-endeavor-1
- id: guji-gongdezhi-event-translation
  title_zh: 共玄畅译无量门破魔陀罗尼经
  date: '0980-06-01'
  year_of: 980
  place: 汴京译场
  description: 与沙门玄畅合作，将梵本译为一卷，详载五十八句陀罗尼、菩萨四净行、四正念及修持法要，会于大林重阁法会宣说之缘起。
  endeavor_ref: guji-gongdezhi-endeavor-1
- id: guji-gongdezhi-event-circulation
  title_zh: 宣演受持法与护法仪轨
  date: '0982-03-15'
  year_of: 982
  place: 汴京
  description: 依经宣说受持读诵、半月诵念、思惟八字、图绘八夜叉与祈请八菩萨护念之仪，劝众昼夜修善、行阿兰若、舍利养，令得陀罗尼不退。
  endeavor_ref: guji-gongdezhi-endeavor-2
- id: guji-gongdezhi-event-death
  title_zh: 示寂
  date: '1000'
  year_of: 1000
  place: 汴京
  description: 译弘既竟，示寂于宋，译本入藏，列于乾隆藏大乘五大部外重译经，流通后世。
  endeavor_ref: guji-gongdezhi-endeavor-2
