person:
  qid: guji-善住天子
  name_zh: 善住天子
  names:
    zh: 善住天子
    en: Shan Zhu Tianzi
  lifespan:
    birth:
      date: '-1200'
      precision: year
      is_circa: true
      raw: 毗婆尸佛像法时波罗奈国婆罗门家
    death:
      date: '-0500'
      precision: year
      is_circa: true
      raw: 释迦佛世忉利天增寿授记后
  birth_date: '-1200'
  death_date: '-0500'
  era: 毗婆尸佛像法至释迦佛世
  reign_ref: 释迦牟尼佛在室罗筏誓多林给孤独园时
  archetype: 宿业受报与持咒转业型天人
  dilemmas:
  - 天报将尽必堕七畜地狱备受诸苦，与求佛救护忏悔转业之间的抉择
  - 宿世一言恚母一语骂僧已成定业，与现前闻持最胜佛顶陀罗尼可净障增寿之间的信疑
  lesson: 恶口尤重于猛火，一言恨母一骂众僧即能烧尽天福牵入畜狱；然至诚忏悔受持最胜佛顶陀罗尼则能净除十恶五逆宿障、增寿得记、永离恶趣
  summary_first_person: 我本波罗奈婆罗门独子，昔因母送食稍晚饥恚，将母比作猪狗野干等畜；又尝供养飞空独觉获闻法而出家，作维那时悭惜酥油恶骂客僧令啖屎尿、讥为盲瞎；由恚母故当作七返畜身常食不净，由悭骂故当堕地狱、七百生无目贫贱；幸供养辟支功德得生忉利享乐数劫，今在善法堂闻空声预告七日后死堕，随帝释诣祇园请佛，蒙佛放光说宿因、授最胜佛顶陀罗尼，我举身投地忏悔依教持诵七日罪灭寿增，得佛摩顶授菩萨记
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%9C%80%E8%83%9C%E4%BD%9B%E9%A1%B6%E9%99%80%E7%BD%97%E5%B0%BC%E5%87%80%E9%99%A4%E4%B8%9A%E9%9A%9C%E5%92%92%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%9C%80%E8%83%9C%E4%BD%9B%E9%A1%B6%E9%99%80%E7%BD%97%E5%B0%BC%E5%87%80%E9%99%A4%E4%B8%9A%E9%9A%9C%E5%92%92%E7%BB%8F.md
endeavors:
- id: guji-善住天子-endeavor-1
  title_zh: 宿世业因造作与天福恶报交感
  description: 毗婆尸佛像法中为波罗奈婆罗门子，恚母比畜种七畜因，供养独觉种生天因，出家作维那悭僧恶骂种不净无目地狱因，善恶夹杂感生忉利享乐而福尽将堕
  phases:
  - key: brewing
    name: 田间恚母恶口比畜
    labels:
      zh: 恚母比畜初因
    start_date: '-1200'
    highlight_event_id: guji-善住天子-event-past-anger-mother
  - key: breakthrough
    name: 供养辟支佛闻法出家
    labels:
      zh: 施食献花得天福
    start_date: '-1200'
    highlight_event_id: guji-善住天子-event-offering-pratyekabuddha
  - key: climax
    name: 维那悭僧恶骂招不净无目
    labels:
      zh: 悭油骂盲感报
    start_date: '-1195'
    highlight_event_id: guji-善住天子-event-vinaya-slander
  - key: closure
    name: 业感生天福尽将堕
    labels:
      zh: 天乐数劫后报将尽
    start_date: '-0550'
    highlight_event_id: guji-善住天子-event-heaven-warning
  decisions:
  - date: '-1200'
    title_zh: 饥渴嗔恚以猪狗野干等畜比母
    rationale: 一时嗔心轻发恶口，未知恶口猛火能烧七圣财，遂成七返畜身常食秽恶之远因
  - date: '-1200'
    title_zh: 见飞空独觉生敬邀请施食献花
    rationale: 仰其威仪倾心致敬，以茅座净花及减食供养闻法，种下生天胜乐经劫之善因
  - date: '-1195'
    title_zh: 作维那悭留酥油恶骂客僧啖屎盲瞎
    rationale: 嫌客烦乱悭贪不与僧食，口出秽恶诅骂，由此感常食不净、堕地狱、七百生无目之报
- id: guji-善住天子-endeavor-2
  title_zh: 闻佛忏悔受持最胜佛顶陀罗尼转业
  description: 于忉利善法堂闻空声预告七日死堕，随帝释诣祇园请佛，佛放光说宿缘授咒，依教忏悔持诵七日罪灭增寿得菩萨授记
  phases:
  - key: brewing
    name: 善法堂闻空声惊怖求救
    labels:
      zh: 空声预告七日堕畜
    start_date: -0550-01-01
    highlight_event_id: guji-善住天子-event-heaven-warning
  - key: breakthrough
    name: 随帝释诣祇园请法
    labels:
      zh: 帝释将众供佛问因
    start_date: -0550-01-02
    highlight_event_id: guji-善住天子-event-audience-buddha
  - key: climax
    name: 佛说宿缘授最胜佛顶咒
    labels:
      zh: 放光微笑说咒功德
    start_date: -0550-01-03
    highlight_event_id: guji-善住天子-event-receive-dharani
  - key: closure
    name: 七日持诵罪灭增寿授记
    labels:
      zh: 忏悔持咒得五眼净寿增无量
    start_date: -0550-01-10
    highlight_event_id: guji-善住天子-event-seven-day-recitation
  decisions:
  - date: -0550-01-01
    title_zh: 闻堕畜地狱预告即诣天帝求救
    rationale: 自知天眼天力不能测深远因缘，唯如来正遍知能知救护，故不自弃而求援
  - date: -0550-01-02
    title_zh: 于佛前举身投地血瘀忏悔
    rationale: 闻佛说一言恨母一骂众僧即烧天报尽，知罪自作，深自咎责发露忏除
  - date: -0550-01-03
    title_zh: 受持最胜佛顶陀罗尼依教奉行
    rationale: 信此咒为百千万亿佛所说能净十恶五逆拔三恶趣，愿依斋戒持诵令宿障消灭
events:
- id: guji-善住天子-event-birth
  title_zh: 生于波罗奈婆罗门家为独子
  date: '-1200'
  year_of: '-1200'
  location: 波罗奈国
  description: 毗婆尸佛涅槃像法中，波罗奈婆罗门唯有一子，父早丧母孤养，长大向田营种
- id: guji-善住天子-event-past-anger-mother
  title_zh: 田间饥渴恚母以畜类比母
  date: '-1200'
  year_of: '-1200'
  location: 波罗奈田间
  description: 母求食稍晚，子饥渴嗔恚出恶言谓母不如猪狗野干猕猴乌鹫等畜养子，种七返畜身之因
- id: guji-善住天子-event-offering-pratyekabuddha
  title_zh: 供养飞空独觉辟支佛
  date: '-1200'
  year_of: '-1200'
  location: 波罗奈田间茅座
  description: 见独觉作沙门形飞空过，起敬合掌邀请，敷白茅座献花减食供养，闻法示教后复得出家
- id: guji-善住天子-event-vinaya-slander
  title_zh: 为维那悭酥油恶骂客僧
  date: '-1195'
  year_of: '-1195'
  location: 僧坊
  description: 施主送多酥油供现前僧，维那嫌客烦乱悭不与食，骂言何不啖屎尿、儞眼盲耶，感常食不净及无目报、地狱苦
- id: guji-善住天子-event-heaven-warning
  title_zh: 忉利善法堂闻空声预告七日堕落
  date: -0550-01-01
  year_of: '-0550'
  location: 忉利天善法堂
  description: 与诸天女游戏时忽闻空中声告七日后舍报堕阎浮作猪狗野干猕猴蟒蛇乌鹫七畜常食不净、次入地狱、后为人无目贫贱
- id: guji-善住天子-event-audience-buddha
  title_zh: 随帝释诣誓多林祇园请佛
  date: -0550-01-02
  year_of: '-0550'
  location: 室罗筏誓多林给孤独园
  description: 帝释率诸天严香花璎珞诣佛，具白善住将堕之事，请说宿世因缘及救护法
- id: guji-善住天子-event-receive-dharani
  title_zh: 佛顶放光说宿因并授最胜佛顶陀罗尼咒
  date: -0550-01-03
  year_of: '-0550'
  location: 祇园
  description: 佛从顶放五色光说昔婆罗门子即今善住，由恚母悭骂招畜狱无目、由供养辟支得生天，守殿神为预报者，并说三十六句咒及净障功德
- id: guji-善住天子-event-seven-day-recitation
  title_zh: 七日忏悔持咒罪灭增寿得授记
  date: -0550-01-10
  year_of: '-0550'
  location: 祇园及忉利天宫
  description: 善住于佛前投地忏悔，依教持诵最胜佛顶陀罗尼满七日，自见罪报悉灭天命增寿无量，与帝释将众再诣佛所供养旋绕，佛摩顶授菩萨记
- id: guji-善住天子-event-death
  title_zh: 天报增寿后授记圆满示现长住
  date: '-0500'
  year_of: '-0500'
  location: 忉利天
  description: 依咒力增寿无量得五眼净，常随菩萨佛所修行，获无上菩提之记，此期天寿圆满为后世示现持咒转业之证
