  lesson: 诸法本净无所有以无所得为得住无际之际乃能以大悲方便摄化众生而不畏
  summary_first_person: 吾为维摩诘子名曰善思于奈氏树园楼阁上遥见世尊入城分卫以华散佛承空而住问本际何谓佛告无际不可得乃曰真本际虚空无相吾遂以莲华奉佛发愿逮无上正真之道为众生班宣无所得法
