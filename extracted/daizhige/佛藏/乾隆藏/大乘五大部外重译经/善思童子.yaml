endeavors:
- id: guji-佛说大方等顶王经-endeavor-1
  title_zh: 楼阁观佛以偈叹德初发道心
  description: 维耶离奈氏园中沐浴涂香执莲华登楼观妓乐遥见佛与圣众入城分卫现大瑞变作偈歌佛功德发无上正真道愿
  phases:
  - key: brewing
    name: 楼上遥观
    labels:
      zh: 沐浴登楼
    start_date: '0290-01-01'
    highlight_event_id: guji-佛说大方等顶王经-event-1
  - key: breakthrough
    name: 以偈叹佛
    labels:
      zh: 散华奉献
    start_date: '0290-01-02'
    highlight_event_id: guji-佛说大方等顶王经-event-2
  - key: climax
    name: 投楼承空
    labels:
      zh: 住空问法
    start_date: '0290-01-03'
    highlight_event_id: guji-佛说大方等顶王经-event-2
  - key: closure
    name: 奉华发愿
    labels:
      zh: 成最正觉愿
    start_date: '0290-01-04'
    highlight_event_id: guji-佛说大方等顶王经-event-2
  decisions:
  - date: '0290-01-02'
    title_zh: 执莲华奉佛而非自娱
    rationale: 见佛威光蔽日鸟兽和鸣知必为导利众生之大雄故舍妓乐散华发愿以功德趣无上正真
  - date: '0290-01-03'
    title_zh: 投身楼下承佛旨住虚空
    rationale: 心喜不能自胜信佛圣旨能持故敢舍身下投以表无畏求法之志
- id: guji-佛说大方等顶王经-endeavor-2
  title_zh: 论本际空义畅演不畏法门
  description: 与佛往复问答本际无际虚空无相诸法如幻梦野马芭蕉水泡于舍利弗邠耨文陀尼子阿难众前广宣无所得忍示现菩萨无畏行
  phases:
  - key: brewing
    name: 请问本际
    labels:
      zh: 三问本际
    start_date: '0290-01-05'
    highlight_event_id: guji-佛说大方等顶王经-event-3
  - key: breakthrough
    name: 解无际相
    labels:
      zh: 虚空无相
    start_date: '0290-01-06'
    highlight_event_id: guji-佛说大方等顶王经-event-3
  - key: climax
    name: 对辩声闻
    labels:
      zh: 广破有想
    start_date: '0290-01-07'
    highlight_event_id: guji-佛说大方等顶王经-event-4
  - key: closure
    name: 受记无畏
    labels:
      zh: 佛印无畏
    start_date: '0290-01-08'
    highlight_event_id: guji-佛说大方等顶王经-event-4
  decisions:
  - date: '0290-01-06'
    title_zh: 直问无际何际不堕言诠
    rationale: 了知本际非俗所达须以无际破际相故连以偈问逼显虚空无相之理
  - date: '0290-01-07'
    title_zh: 于声闻众前宣无所得正觉
    rationale: 邠耨疑法深难明者迷惑故以本清净无生无起答之显童真智慧能破颠倒
events:
- id: guji-佛说大方等顶王经-event-birth
  date: '0290-01-01'
  title_zh: 示生维耶离为维摩诘子
  description: 西晋译本载维摩诘有子名曰善思宿命德本所感生于维耶离大城居士家
  year_of: 0290
- id: guji-佛说大方等顶王经-event-1
  date: '0290-01-02'
  title_zh: 楼阁遥见佛入城分卫作偈叹德
  description: 明旦沐浴香涂新衣执莲华与妻室上楼观妓遥见佛与八百比丘一万菩萨入维耶离分卫以偈颂佛必以右足指蹈城门阃等瑞相
  year_of: 0290
- id: guji-佛说大方等顶王经-event-2
  date: '0290-01-03'
  title_zh: 投楼住空奉华发无上道心
  description: 佛至舍边立门前善思投楼下承佛旨住虚空中以偈叹佛求受水浆奉莲华发愿以此功德成最正觉为众生班宣不至凡夫不至道法之经典
  year_of: 0290
- id: guji-佛说大方等顶王经-event-3
  date: '0290-01-05'
  title_zh: 三问本际佛示真本际如虚空
  description: 先问云何住本际次问无际际何际佛答无际不可待乃曰真本际其际相虚空虚空亦无相令了真本际即如来际
  year_of: 0290
- id: guji-佛说大方等顶王经-event-4
  date: '0290-01-07'
  title_zh: 对邠耨阿难广宣空行无畏
  description: 答邠耨文陀尼子所问生无所生诸法本清净及对阿难叹深法难信示现弃身命被无挂碍铠虚空佛身无处所之忍佛印为无畏近佛道
  year_of: 0290
- id: guji-佛说大方等顶王经-event-death
  date: '0310-12-31'
  title_zh: 示寂趣入本际
  description: 经未载终没依菩萨行终归本净无所得示现色痛想行识空地水火风散坏如梦觉无所归趣
  year_of: '0310'
