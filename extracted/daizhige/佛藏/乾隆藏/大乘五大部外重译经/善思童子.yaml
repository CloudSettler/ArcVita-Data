  title_zh: 虚空住献一茎莲华
  date: -0500-01-02
  year_of: -320
  description: 遥见世尊至家门前遂从高楼投身向佛以佛神力嶷然住空献莲华问住何实际
- id: guji-善思童子-event-debate
  title_zh: 往复偈辩折伏声闻
  date: -0500-01-02
  year_of: -320
  description: 与佛论际实际如虚空无相复以偈答舍利弗及富楼那弥多罗尼子显诸法无生本性皆空
- id: guji-善思童子-event-fearless
  title_zh: 佛印无畏无恐不怖
  date: -0500-01-03
  year_of: -320
  description: 自陈已誓舍身着无为铠知身及虚空皆无故无恐怖佛赞善哉许其近菩提
- id: guji-善思童子-event-vow
  title_zh: 欢喜发阿耨多罗三藐三菩提愿
  date: -0500-01-03
  year_of: -320
  description: 藉献华善根发愿当来证菩提如世尊于无法中为众生说法令入无余寂灭
- id: guji-善思童子-event-armor
  title_zh: 蒙授着铠法门住不惊畏地
  date: -0500-01-05
  year_of: -320
  description: 佛为说菩萨行甚深着铠相于断不断有无聚散等一切法中不惊不畏不怖即名菩萨
- id: guji-善思童子-event-death
  title_zh: 示寂无考
  date: -272
  year_of: -272
