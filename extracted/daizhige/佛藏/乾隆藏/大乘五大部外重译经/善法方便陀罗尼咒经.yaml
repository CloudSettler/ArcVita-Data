events:
- id: guji-善法方便陀罗尼咒经-event-birth
  title_zh: 附录东晋失译成经
  date: '0350-01-01'
  year_of: '0350'
  place_zh: 建康译场
  description_zh: 失译人名附东晋录，一卷成经，列入大乘五大部外重译经
- id: guji-善法方便陀罗尼咒经-event-1
  title_zh: 执金刚劝请说咒
  date: '0380-01-01'
  year_of: 0380
  place_zh: 摩竭提寂灭道场菩提树下
  description_zh: 执金刚神白佛，此陀罗尼能摧诸恶覆护无依，于四威仪不舍众生，劝请如来说法
- id: guji-善法方便陀罗尼咒经-event-2
  title_zh: 佛说优鸠等庄严大顶胜王陀罗尼
  date: '0380-02-01'
  year_of: 0380
  place_zh: 寂灭道场
  description_zh: 佛说庄严大顶胜王陀罗尼优鸠茂鸠等六句及跋逝唻等四十八句，并长寿咒呵啰等
- id: guji-善法方便陀罗尼咒经-event-3
  title_zh: 放眉间光诸佛云集印可
  date: '0380-03-01'
  year_of: 0380
  place_zh: 忍土
  description_zh: 佛放大人眉间相光遍照诸佛刹土，彼方诸佛寻光至此同赞释迦能为众生说此善法陀罗尼
- id: guji-善法方便陀罗尼咒经-event-4
  title_zh: 示二十善利
  date: '0380-04-01'
  year_of: 0380
  place_zh: 寂灭道场
  description_zh: 佛言晨朝受持读诵得长寿安隐尊贵等二十善利，此咒即诸佛微密藏为诸佛护念
- id: guji-善法方便陀罗尼咒经-event-5
  title_zh: 执金刚自说尸弃等护咒
  date: '0380-05-01'
  year_of: 0380
  place_zh: 道场
  description_zh: 执金刚随喜演说尸弃尸弃等二十七句咒，令行者晨朝受持得拥护永离苦恼
- id: guji-善法方便陀罗尼咒经-event-6
  title_zh: 大梵帝释各说拥护咒
  date: '0380-06-01'
  year_of: 0380
  place_zh: 道场
  description_zh: 大梵天王说嘘利等七句咒，帝释说毗尼婆啰泥等十句咒，皆令晨朝如法诵持增益寿命
- id: guji-善法方便陀罗尼咒经-event-7
  title_zh: 四大天王说护世咒
  date: '0380-07-01'
  year_of: 0380
  place_zh: 道场
  description_zh: 毗沙门提头赖吒毗楼勒叉毗楼博叉四王说弗巴等九句咒，护乐修善方便陀罗尼者
- id: guji-善法方便陀罗尼咒经-event-8
  title_zh: 佛嘱常善受持晨朝净诵
  date: '0380-08-01'
  year_of: 0380
  place_zh: 寂灭道场
  description_zh: 佛举右手赞诸天随喜，敕此三咒为十方诸佛护念，令自净身口意于晨朝殷重受持则诸恶不加
- id: guji-善法方便陀罗尼咒经-event-death
  title_zh: 流通欢喜受持
  date: '0410-12-31'
  year_of: '0410'
  place_zh: 东晋境内
  description_zh: 菩萨声闻执金刚诸天鬼神龙王人非人等咸共恭敬欢喜奉行，经法流通后世
