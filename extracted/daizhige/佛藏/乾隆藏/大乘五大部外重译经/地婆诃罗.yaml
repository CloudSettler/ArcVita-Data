  date: 0685
  year_of: 0685
  location: 洛阳
  description: 于经末付嘱此大准提陀罗尼为过去现在未来诸佛同说，忆持诵念者无量善根成就，速证阿耨多罗三藐三菩提，流通远广
- id: guji-地婆诃罗-event-death
  title_zh: 示寂于洛阳
  date: 0687
  year_of: 0687
  location: 洛阳
  description: 武周天授年间示寂于洛阳，世寿约七十四，译籍凡十八部三十四卷，为武周四大译师之一
