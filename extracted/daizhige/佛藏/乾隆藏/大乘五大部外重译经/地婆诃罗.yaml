  date: 0682
  year_of: 0682
  location: 洛阳
  description: 于舍卫国祇树给孤独园缘起下译出准提陀罗尼一卷，具载七句根本咒、八十万遍灭五无间罪、十万二十万遍梦验吐黑饭白饭等持验，以及结坛、镜坛、治病、解缚、禳灾等诸法
- id: guji-地婆诃罗-event-fuzhu
