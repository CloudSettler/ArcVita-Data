  dilemmas:
  - title_zh: 梵典精义与华言信达
    description: 持梵本密咒音义俱严，如何在华言中兼顾音译准确与义理通达，使准提法门易持易信
  - title_zh: 密法普传与戒律护持
    description: 准提陀罗尼许在家出家皆得受持，如何令薄福众生速得摄受而仍不废菩萨律仪与出家净戒
  lesson: 咒以信心为本，译以悲愿为桥，令无根器者亦得闻持而渐入菩提
  summary_first_person: 吾名地婆诃罗，中天竺人，唐高宗仪凤年初入长安，武周时居洛阳广译大乘密典。愍未来众生薄福少善根，故译出七俱胝佛母心大准提陀罗尼，具说持咒功德与坛法除障、满愿、见圣之行，愿一切闻者速证无上菩提。
