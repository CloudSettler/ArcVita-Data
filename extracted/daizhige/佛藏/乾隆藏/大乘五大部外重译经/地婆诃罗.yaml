    title_zh: 以音义兼译定准提咒
    rationale: 咒句南无飒哆喃三藐三勃陀俱胝喃等七句，依梵音直译并加长引标注，保存陀罗尼神力与持诵口传
  - date: 0682
    title_zh: 具载坛法与世间悉地
    rationale: 详录涂坛结界、镜坛现像、治鬼病、除系缚、禳灾疫、求财敬爱等诸法，令薄福众生亦得现世安稳而渐入出世菩提
