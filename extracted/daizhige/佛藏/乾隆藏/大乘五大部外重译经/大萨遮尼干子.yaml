    rationale: 闻佛说十二发心法及甚深空性，知外道法非究竟，愿以大悲荷众生担
  - date: -0538-01-01
    title_zh: 受持檀尸等波罗蜜回向菩提
    rationale: 依佛所说十二布施十二持戒得大利益，修行回向无上菩提以满授记之因
events:
- id: guji-大萨遮尼干子-event-birth
  title_zh: 诞生于尼干外道家
  date: -0600-01-01
  year_of: '-0600'
  location_zh: 古印度郁阇延
  description_zh: 生于尼干学派家族，自幼习外道戒律与论议，为后称大萨遮尼干子之始
- id: guji-大萨遮尼干子-event-debate
  title_zh: 游行论议扬名列国
  date: -0545-01-01
  year_of: '-0545'
  location_zh: 古印度王舍城至郁阇延诸国
  description_zh: 以大辩才游行摧伏诸论，于列国王臣间声名大振，众推为大萨遮尼干子
- id: guji-大萨遮尼干子-event-meet-buddha
  title_zh: 郁阇延王园值佛闻一乘法
  date: -0540-01-01
  year_of: '-0540'
  location_zh: 郁阇延城严炽王园
  description_zh: 世尊与七十二百千万比丘菩萨大众会于王园，文殊请问菩萨行方便境界奋迅法门，萨遮尼干子在会闻说发心十二法及菩萨行
- id: guji-大萨遮尼干子-event-bodhicitta
  title_zh: 闻十二发心法发无上菩提心
  date: -0540-06-01
  year_of: '-0540'
  location_zh: 郁阇延王园
  description_zh: 闻佛说自性信大乘、大悲、直心等十二发心妙法及布施持戒等波罗蜜，舍狭劣心发阿耨多罗三藐三菩提心
- id: guji-大萨遮尼干子-event-prophecy
  title_zh: 蒙佛授未来作佛记
  date: -0538-01-01
  year_of: -0538
  location_zh: 郁阇延王园
  description_zh: 以清净信解及大乘愿行蒙释迦如来授记，记其当来成就无上正觉，经典因之名大萨遮尼干子受记经
- id: guji-大萨遮尼干子-event-death
  title_zh: 示寂入灭
  date: -0520-01-01
  year_of: '-0520'
  location_zh: 古印度
  description_zh: 行菩萨道化众生毕，示寂入灭，依所受记当来成佛度无量众生
