  dilemmas:
  - 尼干苦行执见与佛法空性实相如何取舍
  - 世间论议胜负与出世菩提大道何者为归
  - 小乘狭劣心与大乘普度心如何抉择发心
  lesson: 虽处外道不碍菩提，直心信解、舍邪入正、行檀戒等波罗蜜，终得如来授记
  summary_first_person: 我本尼干子外道，少习苦行论议，游行诸国以辩才见称。幸于郁阇延王园值遇世尊，闻菩萨行方便境界奋迅法门，知诸法空无相无所有，遂舍邪见发无上菩提心，蒙佛授记当来作佛，方知外道不碍大乘，直心即是道场。
