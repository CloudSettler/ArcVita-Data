person:
  qid: guji-威灯光
  name_zh: 威灯光
  names:
    zh: 威灯光
    en: Great Mighty Light Rishi
  lifespan:
    birth:
      date: '-0600'
      precision: century
      is_circa: true
      raw: 约公元前六世纪
    death:
      date: '-0500'
      precision: century
      is_circa: true
      raw: 约公元前五世纪示寂，未来贤劫当作毗婆尸佛
  birth_date: '-0600'
  death_date: '-0500'
  era: 古印度列国时代
  reign_ref: 释迦牟尼佛住世伽耶城说法时
  archetype: 质疑求真的苦行仙人
  dilemmas:
  - 外道常见执我与佛说缘起无我之冲突
  - 神通幻化与真实智慧如何辨别
  - 苦行自苦能否得自在解脱
  lesson: 离我执、观因缘、于平等法中见众生本无所有方得自在
  summary_first_person: 吾本外道五通仙众之首，执我见而苦行求道，于伽耶城亲见世尊大威神通，心生疑网而发问众生体性、劫火因缘与聚集之相，蒙佛以缘起、业风、法界无作破我执见，遂发弘誓虽经劫火炙身不舍求一切智，蒙授记未来贤劫月主刹为毗婆尸如来，方知真自在不在苦身而在无所得中。
