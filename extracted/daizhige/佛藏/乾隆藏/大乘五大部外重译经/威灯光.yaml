    rationale: 以幻术咒咀亦能现通为难，欲验佛智真伪故直问众生从来与体量微细
  - date: -0528
    title_zh: 发大弘誓经劫火不退
    rationale: 了知法界无作众生无我，遂愿以劫火炙身须弥坠身等大苦换求一切智不舍精进
events:
- id: guji-威灯光-event-birth
  date: '-0600'
  year_of: '-0600'
  title_zh: 降生梵行仙族具六万劫寿
  description: 经云六万劫寿命者，威灯光仙人宿修梵行，生于婆罗门仙族，具五通为仙众之首
  location: 古印度
- id: guji-威灯光-event-assembly
  date: -0528
  year_of: -0528
  title_zh: 率八万四千仙众赴伽耶佛会
  description: 释迦在伽耶城成道未久入宝舍三昧现无量化身，威灯光与五百涂灰外道八万四千五通仙人共赴大会观佛威德
  location: 伽耶城
- id: guji-威灯光-event-question
  date: -0528
  year_of: -0528
  title_zh: 问众生体从何生及微细量
  description: 诘佛众生体从何处生、为一搩一尺乃至芥子许耶，引佛开示无明缘起父母和合五阴十八界假名无实
  location: 伽耶城佛会
- id: guji-威灯光-event-awakening
  date: -0528
  year_of: -0528
  title_zh: 闻劫火与聚集法门生信解
  description: 佛说劫火实为如来方便调伏慈悲手救众生无苦，又说众生无方所可聚唯平等一味中得聚，天地狱畜生饿鬼人天各有相可验，仙众闻已惊叹佛为真一切智
  location: 伽耶城佛会
- id: guji-威灯光-event-vow
  date: -0528
  year_of: -0528
  title_zh: 发弘誓愿经劫火炙身不舍一切智
  description: 自誓设经大火坑堕须弥顶五热炙身经劫不退，终不暂舍精进而求萨婆若，八万四千仙人亦同发无上菩提心
  location: 伽耶城佛会
- id: guji-威灯光-event-prophecy
  date: -0528
  year_of: -0528
  title_zh: 蒙佛授记未来贤劫为毗婆尸如来
  description: 佛放无能降伏光明现瑞，告须菩提威灯光过贤劫千佛后当于月主刹成佛号毗婆尸闻名获利如意珠，会中八万四千仙人得不退转当于弥勒时满十地愿
  location: 伽耶城佛会
- id: guji-威灯光-event-death
  date: '-0500'
  year_of: '-0500'
  title_zh: 示寂入灭待未来成佛
  description: 现身寿终示寂，依本愿趣菩萨道，待贤劫月主世界作毗婆尸如来应供正遍知
  location: 古印度
