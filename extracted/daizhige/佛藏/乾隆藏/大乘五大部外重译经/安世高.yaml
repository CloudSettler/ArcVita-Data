endeavors:
- id: guji-安世高-endeavor-1
  title_zh: 佛经汉译草创
  summary: 后汉桓灵之际入洛，精研汉语，以质朴直译之风首开汉地译经，译出安般守意、阴持入等禅数经及宝积三昧文殊问法身等大乘经，奠定汉译佛典范式。
  phases:
  - key: brewing
    name: 抵洛研华
    labels:
      zh: 潜译
    start_date: 0148
    highlight_event_id: guji-安世高-event-arrival
  - key: breakthrough
    name: 首译禅经
    labels:
      zh: 初译
    start_date: 0148
    highlight_event_id: guji-安世高-event-first-translation
  - key: climax
    name: 重译宝积
    labels:
      zh: 高峰
    start_date: '0150'
    highlight_event_id: guji-安世高-event-baoji
  - key: closure
    name: 译业南传
    labels:
      zh: 南弘
    start_date: 0168
    highlight_event_id: guji-安世高-event-south
  decisions:
  - date: 0148
    title_zh: 舍安息王位东行入汉
    rationale: 志在弘法而非王权，以译经利华夏为大业
  - date: 0148
    title_zh: 采用质直汉译体例
    rationale: 宁存梵义之实不求文藻之华，使禅数与空义可为汉人所解
  - date: '0150'
    title_zh: 兼译大小乘不偏废
    rationale: 以禅观为阶、以法身空义为极，显大小相摄同归一法身
- id: guji-安世高-endeavor-2
  title_zh: 禅法与法身空义弘宣
  summary: 不仅译文，更以讲说化导，依宝积三昧阐明法身无生灭、无垢净、离念即道，破众生于五道生死之执，示本际无际、空无所依之金刚慧。
  phases:
  - key: brewing
    name: 示三昧法门
    labels:
      zh: 开示
    start_date: '0150'
    highlight_event_id: guji-安世高-event-baoji
  - key: breakthrough
    name: 对问文殊法身
    labels:
      zh: 问答
    start_date: '0150'
    highlight_event_id: guji-安世高-event-baoji
  - key: climax
    name: 会众广说无得
    labels:
      zh: 广说
    start_date: '0160'
    highlight_event_id: guji-安世高-event-preaching
  - key: closure
    name: 付嘱流通
    labels:
      zh: 流通
    start_date: 0168
    highlight_event_id: guji-安世高-event-south
  decisions:
  - date: '0150'
    title_zh: 以文殊问答显法身义
    rationale: 借文殊师利与佛问答，显法身等同虚空、不可分别，使新学离文字执
  - date: '0160'
    title_zh: 强调离念为道无念为教
    rationale: 淫怒痴无根、本际不可坏，以无所得法教化方能使闻者得印
  - date: 0168
    title_zh: 南游会稽避乱续化
    rationale: 洛阳将乱，移锡江东，使译经与禅法得以存续不绝
