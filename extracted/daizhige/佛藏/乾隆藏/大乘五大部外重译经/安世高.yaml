  archetype: 译经宗师
  dilemmas:
  - 胡梵与华言隔阂，何以精准传译空义而不失本旨
  - 小乘禅数与大乘法身空性并弘，何以会通不相违背
  - 身为安息王子，当安居王位抑舍国弘法利众生
  lesson: 诸法本际无得无依，借名教化而实无所住，信解法身空性方为宝积
  summary_first_person: 吾本安息国太子名清，字世高，少习梵典明于禅数，舍王位而东游，汉桓帝时抵洛阳，研华言、译众经，以宝积三昧等法明法身不生不灭、离念即道之旨，愿后学持本际而无所著。
