  decisions:
  - date: 0292
    title_zh: 以空性摄六度教授
    rationale: 知众生滞于有相功德，故以一切法如虚空为宗，令学者于布施持戒等行中不著我所而增上
  - date: '0300'
    title_zh: 令弟子抄经传化
    rationale: 晋室渐乱，虑法本散佚，故敕弟子分抄诸译，远寄凉并江左以存法藏
