  - date: 0289
    title_zh: 择译道神足无极变化经
    rationale: 此经具说菩萨大神通智持、四善权及甚深戒行，能破相显空，契合当时清谈尚玄之风，故优先译出以广化
- id: guji-安法钦-endeavor-2
  title_zh: 弘法化导与僧团教授
  summary: 以译经为基，转法轮于天众与人众，教授菩萨道之布施持戒忍辱精进禅慧六度及甚深空观
  phases:
  - key: brewing
