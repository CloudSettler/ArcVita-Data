  birth_date: '0230'
  death_date: '0310'
  era: 西晋
  reign_ref: 晋武帝太康至惠帝永嘉年间
  archetype: 译经高僧
  dilemmas:
  - 梵汉文义悬隔，如何以中土语言传达大乘空性与神通善巧而不失本旨
  - 战乱频仍佛法初传，如何在中原立足使深奥经典被士俗信受流通
  lesson: 以信解空性为体，以善权方便为用，译经弘法当求义旨贯通而非文字执著
  summary_first_person: 吾本安息人，归化中夏，逢晋室一统，于洛阳弘译。深愧才薄，惟以空寂为归，冀借华言显梵义，使众生得闻神足无极、善权度脱之道，不滞于相而直趋菩提。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/道神足无极变化经.md
