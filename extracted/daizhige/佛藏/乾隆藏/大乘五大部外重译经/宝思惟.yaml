  decisions:
  - date: '0693-06-01'
    title_zh: 定三咒次第译出
    rationale: 以根本咒为体、心咒为用、随心咒为方便，令不同根器众生皆得受持，避免繁琐作法之障
  - date: '0693-07-01'
    title_zh: 省略持斋洗浴别衣等苛制
    rationale: 依观音大悲本愿，强调不须作法、不求宿日、不须持斋洗浴，但读即成，使贵贱僧俗皆得成就
- id: guji-宝思惟-endeavor-2
  title_zh: 弘传观音如意宝法与密坛修法
  summary: 于长安弘传莲花峰金刚加持秘密坛法及转轮香、眼药、护摩、求雨等事相成就法，开示诵数阶级与感应证相，奠定唐代观音密法基础
  phases:
