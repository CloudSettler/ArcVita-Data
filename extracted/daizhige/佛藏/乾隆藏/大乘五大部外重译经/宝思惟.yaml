      is_circa: false
      raw: 开元九年卒于长安
  birth_date: '0650'
  death_date: '0721'
  era: 唐
  reign_ref: 武周长寿至唐开元
  archetype: 译经高僧
  dilemmas:
  - 梵本密咒深广难译，如何以汉文准确传持观音心咒而不失秘密加持之力
  - 密法重师承与灌顶，如何在显教盛行之唐廷令如意摩尼法门普被众生而免妄传之弊
  lesson: 以慈悲为本，不执净秽形式，令一切众生但诵即成，所愿满足，方为如意摩尼真实义
  summary_first_person: 吾北天竺人，慕大唐佛法之盛，远涉而来。蒙武后礼遇，于洛阳译出观世音莲华如意摩尼转轮心陀罗尼。所传根本咒、心咒、随心咒，皆观音大悲所化，能令诵者销罪除障、满诸愿求、生极乐净土。吾惟愿此秘密心印流转阎浮提，令有情离苦得如意，不以持斋洗浴为碍，但至心诵念，即获观音现前护念。
