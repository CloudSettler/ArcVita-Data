      raw: 唐开元九年左右
  birth_date: '0650'
  death_date: '0721'
  era: 唐
  reign_ref: 武周至开元
  archetype: 译经三藏
  dilemmas:
  - 梵本阙略与中土仪轨如何会通，使浴像法既合梵意又可行于唐俗
  - 显密教法并弘之际，如何以浴像供养之易行法门接引末法众生而不失正见
  lesson: 以清净心不执空有，香水浴像如浴自心，五浊既除乃证如来清净法身
  summary_first_person: 吾本天竺迦湿弥罗人，慕大唐佛法之盛，航海东来。承武后、中宗之诏，于洛邑长安译经。尝以梵本《浴像功德经》重译一卷，广说浴像仪轨与十五种功德，愿末世众生藉香水浴佛之缘，洗除烦恼垢，成就五分法身。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%B5%B4%E5%83%8F%E5%8A%9F%E5%BE%B7%E7%BB%8F.html
