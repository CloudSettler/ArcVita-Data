  - key: closure
    name: 嘱累弟子护持流通
    labels:
      zh: 嘱付
    start_date: '0720'
    highlight_event_id: guji-宝思惟-event-death
  decisions:
  - date: '0695-01-01'
    title_zh: 细述等级念诵遍数
    rationale: 依婆罗门、刹利、毗舍、首陀、比丘、男女童子等分别定八百至千八遍等，使法有次第而普摄诸众
  - date: '0700-03-01'
    title_zh: 公开护摩与求雨密方
    rationale: 以白檀香、稻谷花、酥蜜等护摩，及酥芥子求雨之法，令密法兼济世间饥疫水旱，显观音利他大悲
events:
- id: guji-宝思惟-event-birth
  title_zh: 诞生北天竺
  date: '0650'
  year_of: '0650'
  summary: 约贞观年间生于北天竺婆罗门或刹帝利之家，自幼出家，精通显密经论，尤精观世音菩萨密咒法门
- id: guji-宝思惟-event-arrival
  title_zh: 长寿二年抵达洛阳
  date: 0693
  year_of: 0693
  summary: 武周长寿二年，自北天竺远涉葱岭至东都洛阳，奉武后诏入译经道场，以三藏法师号预译事
- id: guji-宝思惟-event-translation
  title_zh: 译出观世音如意摩尼陀罗尼经
  date: '0693-06-01'
  year_of: 0693
  summary: 于洛阳译出观世音菩萨如意摩尼陀罗尼经一卷，宣说那谟喝啰怛曩等根本咒、乌唵钵特摩等心咒及随心咒，并述大地六种震动等证相
- id: guji-宝思惟-event-circulation
  title_zh: 授转轮香与眼药成就法
  date: 0695
  year_of: 0695
  summary: 传授以牛黄、白檀、郁金、龙脑等合和转轮香及以雄黄、海浮石、青红莲花等合和眼药之法，诵咒薰涂，渐次获伏藏、通五眼、见观音等成就
- id: guji-宝思惟-event-homa
  title_zh: 弘护摩增寿与求雨法
  date: '0705'
  year_of: '0705'
  summary: 于长安弘传以白檀香稻谷花白芥子酪蜜酥护摩增寿千岁之法及以酥和芥子三夜烧请龙王降雨、以灰止雨之法，广利众生
- id: guji-宝思惟-event-death
  title_zh: 开元九年圆寂
  date: '0721'
  year_of: '0721'
  summary: 开元九年卒于长安，译经弘法近三十年，遗留如意摩尼法门，为后世不空、金刚智等开密教先声
