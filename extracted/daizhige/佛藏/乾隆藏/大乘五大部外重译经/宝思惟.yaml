  decisions:
  - date: '0701'
    title_zh: 择定以香水浴像为殊胜供养
    rationale: 经中佛言诸供养中浴像最胜，欲令末世众生以易行小供获无边福故
  - date: '0703'
    title_zh: 增广浴像仪轨与二偈
    rationale: 梵本略而唐俗重仪轨，增列牛头栴檀等诸香配方及我今灌沐诸如来等偈，使行者得依文而行
- id: guji-宝思惟-endeavor-2
  title_zh: 译传密教陀罗尼与弘化
  summary: 除浴像经外，译出随求即得大自在陀罗尼等密部经典，并于两京弘传持明法门，开唐密先声
