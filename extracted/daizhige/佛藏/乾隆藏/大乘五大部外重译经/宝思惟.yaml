endeavors:
- id: guji-宝思惟-endeavor-1
  title_zh: 梵汉译经事业
  description: 自罽宾远来长安洛阳，于武周至开元年间从事大乘密教经典之汉译，以大方广菩萨藏文殊一字咒为代表，令秘密藏教广行东夏
  phases:
  - key: brewing
    name: 罽宾习学远志东来
    labels:
      zh: 罽宾习学
    start_date: '0650'
    highlight_event_id: guji-宝思惟-event-birth
  - key: breakthrough
    name: 抵洛入唐获朝廷护持
    labels:
      zh: 入唐
    start_date: 0693
    highlight_event_id: guji-宝思惟-event-arrival
  - key: climax
    name: 长安译场开译一字咒王
    labels:
      zh: 译咒
    start_date: 0708
    highlight_event_id: guji-宝思惟-event-translate-wenshu
  - key: closure
    name: 译本流传编入藏经
    labels:
      zh: 入藏
    start_date: '0712'
    highlight_event_id: guji-宝思惟-event-translate-wenshu
  decisions:
  - date: 0693
    title_zh: 应请东来入洛
    rationale: 闻东夏大乘兴盛、君主崇佛，欲以梵本密咒报佛恩，遂决远游长安洛阳以弘传
  - date: 0708
    title_zh: 拣译菩萨藏中文殊一字陀罗尼
    rationale: 观此咒为诸佛心、诸咒王，能摄文殊、消灾满愿，最契唐人祈福护国之需，故先译此经
  - date: '0710'
    title_zh: 以浅近汉言详述咒用法
    rationale: 为令持诵者得用，于经中广记咒索、咒水、咒酥、画印等行法，使秘密法门可依行得验
- id: guji-宝思惟-endeavor-2
  title_zh: 密咒弘护事业
  description: 依译出之一字陀罗尼，传授持诵轨仪、护身结索、治病禳灾诸法，示现文殊童子拥护之验，奠定唐密早期基础
  phases:
  - key: brewing
    name: 净居天会领受咒王
    labels:
      zh: 领受
    start_date: 0708
    highlight_event_id: guji-宝思惟-event-preach-mantra
  - key: breakthrough
    name: 传授七遍护国护家之法
    labels:
      zh: 传授
    start_date: '0710'
    highlight_event_id: guji-宝思惟-event-preach-mantra
  - key: climax
    name: 以咒治病除障显验
    labels:
      zh: 显验
    start_date: '0715'
    highlight_event_id: guji-宝思惟-event-preach-mantra
  - key: closure
    name: 付嘱后学勿生轻慢
    labels:
      zh: 付嘱
    start_date: '0720'
    highlight_event_id: guji-宝思惟-event-death
  decisions:
  - date: '0710'
    title_zh: 开示一遍至七遍分级守护
    rationale: 为显咒力次第，立一遍护己至七遍护四天下之说，令信心渐增、普劝持诵
  - date: '0715'
    title_zh: 兼传世间医护方术
    rationale: 以咒水洗面、咒酥治箭疮、咒羽止头痛等方便摄化，使士庶于现世安稳中生信向
  - date: '0720'
    title_zh: 殷勤诫勿轻慢疑惑
    rationale: 恐众生以咒近浅而轻慢，故于经末反复诫令生难遇想，护持法脉清净
events:
- id: guji-宝思惟-event-birth
  title_zh: 生于罽宾国
  date: '0650'
  year_of: '0650'
  is_circa: true
  location: 罽宾国
  description: 生于北天竺罽宾国，梵名宝思惟，自幼习大乘及陀罗尼藏，后立志东传
- id: guji-宝思惟-event-arrival
  title_zh: 至洛阳长安入唐译场
  date: 0693
  year_of: 0693
  location: 洛阳长安
  description: 武周长寿二年左右抵达洛阳，后居长安，获朝廷礼为天竺三藏，参预译经
- id: guji-宝思惟-event-translate-wenshu
  title_zh: 译大方广菩萨藏经中文殊师利根本一字陀罗尼经
  date: '0710'
  year_of: '0710'
  location: 长安
  description: 于长安译出此经一卷，具载佛于净居天宝庄严道场说唵齿臨一字心咒王及结索、咒水、治病等行法，为唐密早期重要译本，对应今大正藏T1181
- id: guji-宝思惟-event-preach-mantra
  title_zh: 开示一字咒王护世法门
  date: '0715'
  year_of: '0715'
  location: 长安
  description: 依所译经传授持诵仪轨，宣说诵一遍护己至七遍护四天下，及以五色綖结索、牛黄画印、安息香熏等禳灾护身之法，众生多得欢喜拥护
- id: guji-宝思惟-event-death
  title_zh: 示寂于长安
  date: '0721'
  year_of: '0721'
  location: 长安
  description: 开元九年卒于长安，译经弘咒之业遂终，所译一字陀罗尼经编入大乘五大部外重译经，广行于世
