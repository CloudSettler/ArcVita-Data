    title_zh: 兼译陀罗尼以显密并举
    rationale: 浴像重事相供养，陀罗尼重持明加护，二者相资可摄化不同根器
  - date: '0710'
    title_zh: 随俗设坛以便行持
    rationale: 依方坛敷妙床座之制，令唐人易于营建道场，广布浴像与持咒法会
