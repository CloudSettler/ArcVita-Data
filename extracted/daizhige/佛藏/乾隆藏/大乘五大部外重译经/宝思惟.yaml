  dilemmas:
  - 梵本幽微与汉语隔阂，如何忠实不失地传译秘密心咒
  - 密咒神用显赫与显教正理之间，如何令众生不执方术而归菩提心
  lesson: 以至诚传译、以慈悲护世，令秘密咒王普被群生、皆得安稳
  summary_first_person: 吾本罽宾梵僧，远涉流沙而来东夏，蒙圣朝护持，于长安译场开示文殊一字陀罗尼之秘。愿凡诵持此咒王者，皆得文殊拥护，众障消灭，所愿圆满，同归无上菩提。
