    highlight_event_id: guji-宝贵-event-597-translate
  - key: closure
    name: 合二十四品写为八卷笔受校练流通
    labels:
      zh: 合部告成
    start_date: '0597-10-01'
    highlight_event_id: guji-宝贵-event-597-compile
  decisions:
  - date: 0590
    title_zh: 定计依承合经体例不作单译单行
    rationale: 见支敏度合首楞严五本为八卷、僧就合大集四本为六十卷文义宛具，遂立收涓添海之志以合部为规矩
  - date: 0597
    title_zh: 劝请志德重寻后本补阙
    rationale: 昙无谶称篇品阙漏，真谛所补犹未周，闻志德慧性冲明博通内外，果获嘱累品与银主陀罗尼品遂得全经
  - date: '0597-10-01'
    title_zh: 以费长房笔受彦琮校练署名成书
    rationale: 欲使译文明白源流可考，请学士笔受、通梵沙门校练，题为隋沙门宝贵对志德合入以示信史
- id: guji-宝贵-endeavor-2
  title_zh: 周隋之际广阅群经与译场弘传
  goal_zh: 师承道安博览群经，襄助隋代官译译场成就法席
  phases:
