      precision: year
      is_circa: true
      raw: 约隋末
  birth_date: '0540'
  death_date: '0615'
  era: 隋
  reign_ref: 隋开皇
  archetype: 合部汇校型译经高僧
  dilemmas:
  - 三译分流各有阙漏欲求全本与惧涉僭改妄合之难
  - 梵本久散承注末流难全与新逢志德携后分至之机择
  - 依承支敏度僧就先哲合经成规与自立二十四品新部体例之衡
  lesson: 收涓添海聚芥培山，会通异译补阙成部以显法灯全义
  summary_first_person: 吾大兴善寺沙门宝贵，近周世师事道安，遍阅群经未尝释手；尝叹金光明三译阙漏——凉世昙无谶四卷十八品、周世阇那崛多五卷二十品、梁世真谛补四品犹未周备，每永怀寤寐愿逢梵本；幸大隋开皇十七年北天竺揵陀罗志德携后分至京，于大兴善寺译出嘱累品及银主陀罗尼品，吾遂合以旧译共二十四品为八卷，托费长房笔受彦琮校练，愿此经王传之永劫。
  source_urls:
