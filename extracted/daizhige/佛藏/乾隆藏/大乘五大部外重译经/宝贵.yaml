  - key: climax
    name: 开皇十七年法席小间倡请新译
    labels:
      zh: 倡请新译
    start_date: 0597
    highlight_event_id: guji-宝贵-event-597-invite
  - key: closure
    name: 以合部流通示现经王护世之功
    labels:
      zh: 流通护世
    start_date: 0598
    highlight_event_id: guji-宝贵-event-597-compile
  decisions:
  - date: '0570'
    title_zh: 立志不释手玩阅群经
    rationale: 以道安为神足明匠，效瞿昙身子孔氏颜渊之学，欲穷满字真空之理
  - date: 0581
    title_zh: 随隋代兴佛驭寓入京译场
    rationale: 大隋驭寓新经相续而至，帝敕翻译不绝，遂依大兴善寺法席以待梵本
  - date: 0598
    title_zh: 以序显经王十地三身之义劝持
    rationale: 经称金鼓宝塔三身果备十地因圆，四佛护持灭苦与乐，欲令护世四王天众拥护持经者故广流通
