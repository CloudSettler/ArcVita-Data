  title_zh: 无胜来诣请问陀罗尼
  description: 自东方无胜世界承善胜力如来教，一念没彼现娑婆虚空，雨供动界，顶礼世尊，请问一切诸法入无量法门陀罗尼
  phases:
  - key: brewing
    name: 无胜集会
    labels:
      zh: 无胜示现
    start_date: '0550-01-01'
    highlight_event_id: guji-尊胜菩萨-event-come
  - key: breakthrough
    name: 虚空雨供
    labels:
      zh: 雨供遍满
    start_date: '0550-02-01'
    highlight_event_id: guji-尊胜菩萨-event-offering
  - key: climax
    name: 请问法门
    labels:
      zh: 合掌问佛
    start_date: '0550-03-01'
    highlight_event_id: guji-尊胜菩萨-event-question
  - key: closure
    name: 承受正说
    labels:
