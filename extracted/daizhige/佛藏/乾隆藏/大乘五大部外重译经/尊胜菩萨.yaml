  - key: climax
    name: 诵持除障
    labels:
      zh: 除病解怖
    start_date: '0550-06-01'
    highlight_event_id: guji-尊胜菩萨-event-cure
  - key: closure
    name: 天众拥护
    labels:
      zh: 感得护持
    start_date: '0550-07-01'
    highlight_event_id: guji-尊胜菩萨-event-protect
  decisions:
  - date: '0550-05-01'
    title_zh: 举要宣说持明利益
    rationale: 若得此陀罗尼能知众生心、动佛世界、得宿命莲花生等，令闻者发心受持
  - date: '0550-06-10'
    title_zh: 教授手摩诵持除病法
    rationale: 为除头痛疟病风冷等苦，教以净行香华供养诵一百九十八遍手摩则愈
events:
- id: guji-尊胜菩萨-event-birth
  title_zh: 示现无胜世界
  date: '0550-01-01'
  year_of: '0550'
  description: 东方过九十二佛世界微尘数佛刹有世界名无胜，佛号善胜力，尊胜菩萨于彼示现为上首菩萨
- id: guji-尊胜菩萨-event-come
  title_zh: 一念来现娑婆虚空
  date: '0550-01-20'
  year_of: '0550'
  description: 与菩萨大众前后围绕，于一念顷于彼界没忽现此娑婆世界住虚空中，地狱安乐众生慈心相向
- id: guji-尊胜菩萨-event-offering
  title_zh: 雨供供养释迦如来
  date: '0550-02-01'
  year_of: '0550'
  description: 一一菩萨放琉璃云雨阎浮檀金华香鬘宝幢幡天衣等遍覆三千大千，乃至阿迦腻吒天住空雨供，上至天宫龙宫夜叉等处
- id: guji-尊胜菩萨-event-question
  title_zh: 佛前合掌请问陀罗尼
  date: '0550-03-01'
  year_of: '0550'
  description: 见佛入一真谛法具无量辩，从坐起整衣右膝着地合掌白佛，有陀罗尼名一切法无量如实所说法门，愿为怜愍说此门
- id: guji-尊胜菩萨-event-teaching
  title_zh: 世尊正说无量门陀罗尼
  date: '0550-04-01'
  year_of: '0550'
  description: 佛赞善哉令谛听，即说写犾汦昙等长咒句，句句目呿波利簸梨为结，此即一切诸法入无量门陀罗尼，高齐河南居士万天懿译为一卷
- id: guji-尊胜菩萨-event-receive
  title_zh: 得陀罗尼能持诸说
  date: '0550-04-10'
  year_of: '0550'
  description: 若得此陀罗尼能持一切诸佛声闻缘觉所说及世间经书医方咒术，能知众生心善不善以一音普辩
- id: guji-尊胜菩萨-event-benefit
  title_zh: 宣说受持广大功德
  date: '0550-05-01'
  year_of: '0550'
  description: 得此陀罗尼者得无断辩、能以一指动一切佛刹、一念知三世、常化生坐莲花、得无尽宝手庄严佛国及百千三昧门
- id: guji-尊胜菩萨-event-cure
  title_zh: 教令诵持除病怖畏
  date: '0550-06-01'
  year_of: '0550'
  description: 在家出家净行着净衣香华供养诵此陀罗尼一百九十八遍手摩病人，则头痛疟风热冷眼齿腹背等病及鬼着失念悉除，过去未来现在诸佛皆以此护众生
- id: guji-尊胜菩萨-event-protect
  title_zh: 夜叉天王发愿拥护
  date: '0550-07-01'
  year_of: '0550'
  description: 夜叉王奢腊娑率千眷属愿常拥护诵持者，以大雪山药草益精气洒散令无病安隐无恶梦，四大天王乃至他化自在诸天亦未成佛顷常拥护不舍
- id: guji-尊胜菩萨-event-death
  title_zh: 无示涅槃常住法界
  date: '0590-12-01'
  year_of: 0590
  description: 菩萨得法界虚空界不忘陀罗尼，阴界诸入实不可得，无生无灭无作，示现随众生心往来诸佛刹无有生灭处所
