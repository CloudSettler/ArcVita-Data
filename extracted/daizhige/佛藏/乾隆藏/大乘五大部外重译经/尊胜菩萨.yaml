  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%B0%8A%E8%83%9C%E8%8F%A9%E8%90%A8%E6%89%80%E9%97%AE%E4%B8%80%E5%88%87%E8%AF%B8%E6%B3%95%E5%85%A5%E6%97%A0%E9%87%8F%E6%B3%95%E9%97%A8%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%B0%8A%E8%83%9C%E8%8F%A9%E8%90%A8%E6%89%80%E9%97%AE%E4%B8%80%E5%88%87%E8%AF%B8%E6%B3%95%E5%85%A5%E6%97%A0%E9%87%8F%E6%B3%95%E9%97%A8%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.html
endeavors:
