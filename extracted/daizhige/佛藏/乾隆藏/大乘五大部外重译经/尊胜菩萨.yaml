  name_zh: 尊胜菩萨
  names:
    zh: 尊胜菩萨
    en: Zunsheng Bodhisattva
  lifespan:
    birth:
      date: '0550-01-01'
      precision: year
      is_circa: true
      raw: 无胜世界示现，约佛世时
    death:
      date: '0590-01-01'
      precision: year
      is_circa: true
      raw: 菩萨不生不灭无示涅槃
  birth_date: '0550-01-01'
  death_date: '0590-01-01'
  era: 佛世
  reign_ref: 释迦牟尼佛在舍卫国祇树给孤独园时
  archetype: 菩萨问法者
  dilemmas:
  - 如何以一陀罗尼总持一切诸法入无量法门
  - 如何令末世众生得无碍辩持诸佛所说而不忘失
  lesson: 一真法界无得而得，持陀罗尼即持一切法，得念坚固则能遍入诸佛世界教化众生
  summary_first_person: 吾乃无胜世界善胜力如来所善胜菩萨，闻娑婆教主说法，一念来诣，雨供供养，见佛入一真谛法，能发一切辩，请问一切诸法入无量门陀罗尼，愿持此门拥护众生，令得不忘安乐解脱。
