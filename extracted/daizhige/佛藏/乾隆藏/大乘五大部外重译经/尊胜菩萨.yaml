    highlight_event_id: guji-尊胜菩萨-event-teaching
  decisions:
  - date: '0550-01-15'
    title_zh: 承佛威神一念来此
    rationale: 为令娑婆众生得无量辩持，不以远近为碍示现神足而来
  - date: '0550-03-01'
    title_zh: 见佛入一真谛法即请问
    rationale: 见佛具无量辩解脱辩，知时机成熟请说总持法门以利众生
- id: guji-尊胜菩萨-endeavor-2
  title_zh: 弘护无量门陀罗尼
  description: 得佛所说陀罗尼后，宣示受持功德，令众生诵持除病怖畏，感夜叉天王发愿拥护，广行教化
  phases:
  - key: brewing
    name: 受持总持
    labels:
      zh: 能持所说
    start_date: '0550-04-10'
    highlight_event_id: guji-尊胜菩萨-event-receive
  - key: breakthrough
