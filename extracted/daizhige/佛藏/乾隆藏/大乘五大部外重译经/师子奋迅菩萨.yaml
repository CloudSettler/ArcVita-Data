  dilemmas:
  - 以有量供养如何显无量福聚令众生起净信
  - 陀罗尼甚深难持如何令众生得总持不忘不堕恶道
  lesson: 以清净信心供养如来及舍利塔庙福聚无量无边，受持花聚陀罗尼可得宿命辩才常见诸佛不离三宝
  summary_first_person: 我名师子奋迅，于阿耨大池龙王宫千位大菩萨众会中，起座偏袒合掌请问世尊供养之福，蒙佛开示现前供养与灭后供养舍利如芥子福等无异，及在家出家以菩提心布施功德胜劣，并闻授花聚陀罗尼修持之法，愿众生起真实心供养受持得不堕恶道
