events:
- id: guji-帛尸梨蜜多罗-event-birth
  title_zh: 生于西域
  date: '0300'
  year_of: '0300'
  location: 西域龟兹一带
  description: 帛姓西域梵僧，少出家精律学及咒术，闻江左佛法方兴遂志东传。
- id: guji-帛尸梨蜜多罗-event-arrival-jiankang
  title_zh: 咸和初到建康
  date: '0326'
  year_of: '0326'
  location: 建康
  description: 东晋咸和年间抵建康，受王公士庶崇敬，以神咒禳疫护众，名振江左。
- id: guji-帛尸梨蜜多罗-event-translate-first
  title_zh: 译灌顶三归五戒带佩护身咒经卷第一
  date: 0328
  year_of: 0328
  location: 建康译场
  description: 于祇树给孤独园会中鹿头梵志请戒缘起，译出三十六善神王及二十五护戒神王名号与带佩法，立此经卷一之本。
- id: guji-帛尸梨蜜多罗-event-preach-refuge
  title_zh: 为执持长者授归戒说罪福报应
  date: 0329
  year_of: 0329
  location: 建康
  description: 为迦罗柰长者执持授三归五戒，演其破戒为鬼神所罚、忏悔改修而得道之缘，以劝坚戒持斋。
- id: guji-帛尸梨蜜多罗-event-translate-complete
  title_zh: 竟译佛说大灌顶神咒经十二卷
  date: '0331'
  year_of: '0331'
  location: 建康
  description: 毕译十二卷，含灌顶七万二千神王护比丘咒等诸品，备载百七十二及百九十等诸大神王章句，付嘱讽诵护世。
- id: guji-帛尸梨蜜多罗-event-death
  title_zh: 示寂建康
  date: '0343'
  year_of: '0343'
  location: 建康
  description: 咸康末示寂，译业既成，灌顶神咒法自此广行于江南。
