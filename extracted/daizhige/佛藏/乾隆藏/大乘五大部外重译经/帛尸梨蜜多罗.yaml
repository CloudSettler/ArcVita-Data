  dilemmas:
  - 密咒护世之应机与显教正理如何兼弘不偏
  - 西域梵本音义难译与中土信众持诵易行如何两全
  lesson: 以慈悲为本、以神咒为方便，昼夜护持，令正法得安、国土得护
  summary_first_person: 吾本西域沙门，负梵本咒典东来建康，承佛敕阿难所说孔雀王护咒，昼说护昼、暮说护夜，集诸佛菩萨、梵释天王、大仙鬼神王之拥护咒句，译为晋文，愿令受持者得寿百岁、见百秋、众恶降伏、怨家不侵。
