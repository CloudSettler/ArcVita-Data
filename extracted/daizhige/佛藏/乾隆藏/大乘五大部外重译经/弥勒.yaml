  location: 舍卫国祇树给孤独园
- id: guji-弥勒-event-death
  title_zh: 阎浮提灭度二月十五日结跏趺坐舍身
  date: -0478-02-15
  year_of: -478
  description: 却后十二年二月十五日还本生处结跏趺坐如入灭定，身紫金色如百千日，舍利如铸金像，人天起众宝妙塔供养
  location: 波罗捺劫波利村本生处
- id: guji-弥勒-event-tusita-birth
  title_zh: 化生兜率陀天摩尼殿莲华上
  date: -0478-02-15
  year_of: -478
  description: 阎浮灭度同时于兜率七宝台内摩尼殿师子座莲华上化生，身如阎浮檀金色长十六由旬具三十二相八十种好，天冠中化佛菩萨侍绕
  location: 兜率陀天摩尼殿
- id: guji-弥勒-event-tusita-teach
  title_zh: 兜率天宫昼夜说不退转法轮度五百亿天子
  date: -0478-02-17
  year_of: -478
  description: 与诸天子各坐花座昼夜六时常说不退转地法轮之行，经一时中成就五百亿天子不退无上菩提
  location: 兜率陀天
- id: guji-弥勒-event-future-descent
  title_zh: 示现阎浮五十六亿万岁后下生阎浮提
  date: -0478-03-01
  year_of: -478
  description: 经中授记阎浮提岁数五十六亿万岁尔乃下生阎浮提龙华树下成佛，如弥勒下生经所说，今为众生作大归依处
  location: 兜率陀天
