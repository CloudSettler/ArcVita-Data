  dilemmas:
  - 具凡夫身未断诸漏不修禅定而受记当来成佛，如何令众生信受愿行即得上生
  - 欲示现兜率天宫十善胜报与人间苦空无常之观，如何以慈悲接引不厌生死者同归菩提
  lesson: 以大慈为体以十善愿行为用，不必待断尽烦恼，系念佛名系念弥勒发弘誓愿即能超越生死，清净持戒读诵供养回向兜率即为生天正观
  summary_first_person: 我是弥勒，字阿逸多，生于波罗捺劫波利村婆罗门家，于舍卫祇园闻佛说甚深陀罗尼即得百万亿门，蒙佛授记十二年后舍阎浮身往生兜率，于莲华上结跏趺坐为诸天昼夜说不退转法，待阎浮五十六亿万岁后下生龙华树下成佛，愿归依我者皆得上生兜率值遇我而得不退
