    title_zh: 闻佛说百亿陀罗尼即得百万亿门而住立佛前
    rationale: 以信受甚深法门示现虽未断漏亦能以菩提心趣入补处位
  - date: -0478-02-15
    title_zh: 还本生处结跏趺坐如入灭定舍紫金色身
    rationale: 示现身如铸金像不动不摇，令舍利起塔为众生作归依福田，神识上至兜率
- id: guji-弥勒-endeavor-2
  title_zh: 兜率说法接引众生下生龙华
  description: 居兜率陀天为五百万亿天子昼夜说不退转法轮，令值遇者不退无上道，复以慈氏愿力接引持戒念佛称名者往生，待时下生阎浮提成佛
  phases:
  - key: brewing
