  - key: climax
    name: 成就五百亿天子不退菩提
    labels:
      zh: 度众不退
    start_date: -0478-03-01
    highlight_event_id: guji-弥勒-event-tusita-teach
  - key: closure
    name: 示现未来下生龙华成佛之期
    labels:
      zh: 下生授记
    start_date: -0478-03-01
    highlight_event_id: guji-弥勒-event-future-descent
  decisions:
  - date: -0478-02-17
    title_zh: 于摩尼殿师子座上常说十善四弘六度法门
    rationale: 以天宫胜妙乐事为喻导众生爱敬菩提心，令正观兜率而发愿往生
  - date: -0478-03-01
    title_zh: 许接引称名归依忏悔者放白毫光来迎
    rationale: 开方便门令犯戒造恶者一念忏悔称名亦得除罪往生，于龙华树下复得值佛闻法
events:
- id: guji-弥勒-event-birth
  title_zh: 生于波罗捺劫波利村波婆利婆罗门家
