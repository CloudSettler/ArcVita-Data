  date: '4000-01-01'
  year_of: 4000
  description: 兜率诸天唱令弥勒已降神于大臣修梵摩妻梵摩越右胁而生身黄金色具三十二相八十种好
  location: 翅头城修梵摩家
- id: guji-弥勒菩萨-event-death
  title_zh: 住世八万四千岁后般涅槃
  date: 12400-01-01
  year_of: 12400
  description: 说法千岁无瑕秽后渐有犯戒乃制戒住世八万四千岁般涅槃遗法亦留八万四千岁
  location: 翅头城
- id: guji-弥勒菩萨-event-tusita
