  date: '3999-06-01'
  year_of: 3999
  description: 于兜率天观察阎浮父母不老不少简择修梵摩梵摩越为亲
  location: 兜率天
- id: guji-弥勒菩萨-event-naming
  title_zh: 天众唱令立字弥勒
  date: '4000-01-02'
  year_of: 4000
  description: 降生之日兜率诸天各各唱令修梵摩即与子立字名曰弥勒
  location: 翅头城
- id: guji-弥勒菩萨-event-home
  title_zh: 在家未久将欲出家
  date: '4000-02-01'
  year_of: 4000
  description: 人寿八万四千岁时弥勒在家未经几时便发心出家学道
  location: 翅头城
- id: guji-弥勒菩萨-event-renunciation
  title_zh: 夜半出家
  date: '4020-01-01'
  year_of: 4020
  description: 当夜出家即赴城外龙华道树
  location: 翅头城外龙华树
- id: guji-弥勒菩萨-event-enlightenment
  title_zh: 龙华树下成无上道
  date: '4020-01-02'
  year_of: 4020
  description: 坐一由旬高五百步广之龙华树下即夜成佛三千大千六返震动诸天展转唱言弥勒已成佛道大将魔王率欲界天人往礼
  location: 龙华树下
- id: guji-弥勒菩萨-event-first-assembly
  title_zh: 初会九十六亿得阿罗汉
  date: '4020-01-03'
  year_of: 4020
  description: 往毗提村山中开迦叶禅窟取僧伽梨示众令九十六亿释迦遗教弟子得阿罗汉为最初之会
  location: 毗提村迦叶禅窟
- id: guji-弥勒菩萨-event-second-assembly
  title_zh: 第二会九十四亿得道
  date: '4020-02-01'
  year_of: 4020
  description: 第二会九十四亿人皆得阿罗汉亦由行四事供养释迦所致
  location: 翅头城龙华树下
- id: guji-弥勒菩萨-event-third-assembly
  title_zh: 第三会九十二亿及授十想
  date: '4020-03-01'
  year_of: 4020
  description: 第三会九十二亿皆得阿罗汉复为众说无常乐有苦想无我空想等十想令十一垓人得法眼净众僧千岁无瑕秽以一偈为禁戒
  location: 翅头城龙华树下
