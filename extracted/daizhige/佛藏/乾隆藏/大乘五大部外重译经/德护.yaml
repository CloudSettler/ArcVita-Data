events:
- id: guji-德护-event-birth
  title_zh: 生于王舍城长者家
  date: '-0550'
  year_of: '-0550'
  description: 德护梵名尸利崛多生王舍城豪族为大长者富贵自在为国王大臣所敬
  location: 王舍城
- id: guji-德护-event-plot
  title_zh: 六师教作火坑毒食
  date: -0495
  year_of: -0495
  description: 六师外道失供养嫉佛于论议堂共谋教德护于七重门下各作深七人之火坑满置佉陀罗炭以铜为梁覆以草土洒水散华并置毒药于食中欲害如来
  location: 王舍城德护宅
- id: guji-德护-event-invite
  title_zh: 诣耆阇崛山请佛赴供
  date: -0495
  year_of: -0495
  description: 德护遣使又自往耆阇崛山礼佛以软语请佛及千二百五十比丘五百菩萨明日就宅受供佛知其受化时至默然受请
  location: 耆阇崛山
- id: guji-德护-event-miracle
  title_zh: 佛入城现大神变火坑成清凉池
  date: -0495
  year_of: -0495
  description: 佛与比丘着衣持钵从山入城身放百千万光照东方阎浮幢光等诸佛刹诸方菩萨云集佛足蹈火坑坑皆变清凉池莲华敷荣毒食自然消灭
  location: 王舍城七重门
- id: guji-德护-event-convert
  title_zh: 见神变悔过归依生净信
  date: -0495
  year_of: -0495
  description: 德护亲见佛力不可沮坏子月光先所谏言皆验遂于佛前悔过发露弃外道恶见与妻月云千婇女同发菩提心生清净信
  location: 王舍城德护宅
- id: guji-德护-event-offering
  title_zh: 设大供养护持正法
  date: -0495
  year_of: -0495
  description: 德护阖家以上妙衣服饮食卧具汤药供养佛及大比丘大菩萨众洗除前恶护持正法为王舍城显信之外护
  location: 王舍城德护宅
- id: guji-德护-event-death
  title_zh: 逝世
  date: -0480
  year_of: -0480
