  dilemmas:
  - 缄默避祸与开口救父王免造生埋恶业之间何择
  - 慈仁不忍杀生与国政治理需严刑禁暴之间何衡
  lesson: 微阙亦堕地狱，慈悲须以持戒智慧为持，缄默非愚乃厌离尘累求道之基
  summary_first_person: 吾为波罗奈太子慕魄，自生识宿命，忆前身为王须念因小过堕地狱六万余岁，故十三载结舌不语欲避尘劳，几为婆罗门诳言所陷将见生埋，遂开口显圣，辞位出家，舍国荣而求大道，累功成佛
