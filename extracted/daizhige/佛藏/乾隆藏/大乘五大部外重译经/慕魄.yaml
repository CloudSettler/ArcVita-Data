    title_zh: 辞位不复还国
    rationale: 既见恩爱乖离骨肉已离，不愿复为天下大患，欲反流索源自济济人
  - date: -0787-07-01
    title_zh: 受王放行专精念道
    rationale: 明言人居世间恍惚若梦，富贵珍宝皆为累尘，唯大道可恃
events:
- id: guji-慕魄-event-birth
  title_zh: 诞为波罗奈太子慕魄
  date: -0800-01-01
  year_of: -0800
  location: 波罗奈国王宫
  description: 始生颜貌端正绝无双比，自识宿命无数劫善恶罪福受报，举国爱重当继王位
- id: guji-慕魄-event-silence
  title_zh: 年十三缄默如枯木
  date: -0787-01-01
  year_of: -0787
  location: 波罗奈国王宫
  description: 追忆亿载存亡祸福，质不语至十三岁，恬淡如盲聋，不畏污辱无憎爱，父王忧虑问婆罗门
- id: guji-慕魄-event-burial-crisis
  title_zh: 婆罗门诬陷将生埋车上显圣开言
  date: -0787-06-15
  year_of: -0787
  location: 王城郊外深坑旁水边
  description: 王信婆罗门言欲生埋太子，太子于车上自思劫难，取衣宝至坑边开言自陈，光景如月，仆众惊悚驰白王
- id: guji-慕魄-event-renunciation
  title_zh: 王与夫人迎请辞位出家
  date: -0787-07-01
  year_of: -0787
  location: 天帝化成园观浴池边树下
  description: 王与夫人国民驰往迎太子，太子发心学道天化园观，脱珠宝衣被服俨然，向王说前身须念王微阙堕狱六万岁因缘，坚辞王位得放行学道
- id: guji-慕魄-event-death
  title_zh: 弃国精修遂至成佛度众
  date: -0700-01-01
  year_of: -448
  location: 阎浮提道场
  description: 一心专精念道修德，功勋累积遂至成佛，复度十方诸天人民无央数劫，佛言尔时太子即我身是
