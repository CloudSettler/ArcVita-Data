events:
- id: guji-持人菩萨-event-birth
  title_zh: 示现生
  date: '-0550'
  location: 王舍城
  description: 传说佛世示现为菩萨常随佛会为众请法之主
- id: guji-持人菩萨-event-ask
  title_zh: 竹园请问
  date: -0520-01-01
  location: 王舍城加邻竹园
  description: 与大比丘千二百五十菩萨无央数俱时会中从坐起正服长跪问佛菩萨何行建立誓愿晓了诸法分别度无极
  year_of: 佛说法时
- id: guji-持人菩萨-event-teaching
  title_zh: 佛授四事五力法
  date: -0520-02-01
  location: 王舍城加邻竹园
  description: 佛广说菩萨四事观言教乃至五力清净慧力六度无形道行三界如幻令持人等谛听受持
  year_of: 佛说法时
- id: guji-持人菩萨-event-past-buddha
  title_zh: 得闻妙慧超王本事
  date: -0520-03-01
  location: 王舍城加邻竹园
  description: 佛说过去妙慧超王如来寿八十亿垓劫五百菩萨一心精进值二万佛同劫成佛以显精进无放逸为成道本
  year_of: 妙慧超王佛时
- id: guji-持人菩萨-event-five-turbidities
  title_zh: 开示五浊难信
  date: -0519-01-01
  location: 王舍城加邻竹园
  description: 佛现神足遍照三千世界告持人于五浊世能信乐此深法者甚难希有皆宿世被训所致
  year_of: 佛说法时
- id: guji-持人菩萨-event-dharmakaya
  title_zh: 宣说见法即见佛
  date: -0519-06-01
  location: 王舍城加邻竹园
  description: 佛言佛者法身若见法者则睹如来如筏喻当除法非法以无门法门入一切法本净本无
  year_of: 佛说法时
- id: guji-持人菩萨-event-vow
  title_zh: 受持无放逸誓
  date: -0520-04-01
  location: 王舍城加邻竹园
  description: 持人菩萨受教勤学清净慧力经典夙夜精进以期疾得无极正觉转大法轮
  year_of: 佛说法时
- id: guji-持人菩萨-event-relic
  title_zh: 嘱建舍利塔寺
  date: -0518-01-01
  location: 阎浮提
  description: 佛嘱取芥子舍利建塔面见供养即同见佛以本愿大哀令舍利遍流济末世
  year_of: 佛灭度后
- id: guji-持人菩萨-event-exhort
  title_zh: 劝末世弘经
  date: -0518-06-01
  location: 郡国县邑
  description: 劝诸族姓子所在流布受持讽诵此持人所问经典广为人说则佛正道永存如来不灭
  year_of: 末世流布时
- id: guji-持人菩萨-event-death
  title_zh: 示现灭
  date: '-0400'
  location: 他方佛土
  description: 功行圆满示现入灭而以愿力常游三界将护众生
