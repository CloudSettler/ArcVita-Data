person:
  qid: guji-支谦
  name_zh: 支谦
  names:
    zh: 支谦
    en: Zhi Qian
  lifespan:
    birth:
      date: 0195-01-01
      precision: year
      is_circa: true
      raw: 东汉末约熹平年间，月支后裔家于吴地
    death:
      date: 0255-01-01
      precision: year
      is_circa: true
      raw: 吴建兴年后卒，年寿不详
  birth_date: 0195-01-01
  death_date: 0255-01-01
  era: 三国吴
  reign_ref: 吴大帝孙权黄武至建兴年间
  archetype: 居士译师
  dilemmas:
  - 梵本深幽而汉语佛词未备，如何取舍文质令吴地士人信解而不失本旨
  - 以在家居士优婆塞身份主持译场，如何调和僧团戒律与吴廷士大夫之期待
  - 咒语陀罗尼重在音声总持，直译意译皆难，如何令持诵者得安隐护佑之实效
  lesson: 译经当以哀念众生令安为本，文辞丽雅为舟，音义兼顾为楫，方能令佛法深入人心
  summary_first_person: 吾本月支，祖世避乱徙居中国，少受业于支亮，博览梵汉。黄武初游吴都，见吴人初信佛法而未通大乘，遂发愿以汉文传梵义。历三十余年译经四十九卷，务以文雅达旨，或直或音，唯愿众生持句得护、百病消除。居士之身虽无僧服，亦愿为法桥梁耳。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%8C%81%E5%8F%A5%E7%A5%9E%E5%92%92%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%8C%81%E5%8F%A5%E7%A5%9E%E5%92%92%E7%BB%8F.md
endeavors:
- id: guji-支谦-endeavor-1
  title_zh: 大乘经典汉译事业
  title_en: Translation of Mahayana Sutras
  summary: 黄武初至建业，三十年间译出维摩诘经、大明度经、持句神咒经等三十六部四十八卷，开创文丽雅达之支谦体，奠定吴地大乘译经规范
  phases:
  - key: brewing
    name: 师承习学
    labels:
      zh: 博览梵汉
    start_date: 0210-01-01
