  date: '0226'
  year_of: 226
  place_zh: 建业译场
  description_zh: 译出八吉祥神咒经，宣说东方八佛名号与国土，劝受持讽诵以得护持除愈疾病怖畏
- id: guji-zhiqian-event-translate-damingdu
  title_zh: 译大明度经等大乘经
  date: '0233'
  year_of: 233
  place_zh: 建业
