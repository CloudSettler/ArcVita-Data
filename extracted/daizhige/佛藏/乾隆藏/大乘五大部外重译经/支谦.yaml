  - date: '0225'
    title_zh: 择雅驯文体译咒经
    rationale: 恐质朴难行吴俗，故以文丽雅驯出之，使八佛名号易诵易持而广布
  - date: '0230'
    title_zh: 以意译为主兼存梵音咒句
    rationale: 欲存陀罗尼神力而令义理可解，故咒语存音经文意译以兼顾持验与解义
