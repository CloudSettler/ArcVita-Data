  birth_date: '0200'
  death_date: '0253'
  era: 三国·东吴
  reign_ref: 吴大帝孙权黄武至建兴年间
  archetype: 译经居士
  dilemmas:
  - 梵本佶屈与汉文雅丽之间如何会通，使吴地士人信解
  - 以优婆塞居士之身担负译场重任，身份与弘法权威之限
  - 吴地佛法初兴，经典阙略，众生疑信参半如何摄化
  lesson: 虽以居士之身，若怀深信弘心与善巧方便，亦能译宣大法，令陀罗尼流布，助众生离诸险难得闻持不忘
  summary_first_person: 吾月支人也，号支谦，居吴为优婆塞。少习梵汉，立志译经，欲以文雅之笔显佛深理。于建业译出华积陀罗尼等经，教人以香华供养、一心持咒，冀众生常见诸佛、不堕恶道，吾愿足矣
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%8D%8E%E7%A7%AF%E9%99%80%E7%BD%97%E5%B0%BC%E7%A5%9E%E5%92%92%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%8D%8E%E7%A7%AF%E9%99%80%E7%BD%97%E5%B0%BC%E7%A5%9E%E5%92%92%E7%BB%8F.md
endeavors:
- id: guji-支谦-endeavor-1
  title_zh: 梵汉译经事业
  summary: 以月支优婆塞身份在东吴建业主持译场，译出大明度经、华积陀罗尼神咒经等四十余部，开创文丽雅驯译风，奠定江南佛典基础
  phases:
  - key: brewing
    name: 少习梵汉
    labels:
      zh: 习梵学汉
    start_date: '0220'
    highlight_event_id: guji-支谦-event-translation-start
  - key: breakthrough
    name: 初译立风
    labels:
      zh: 初露译才
    start_date: '0223'
    highlight_event_id: guji-支谦-event-translation-start
  - key: climax
    name: 盛译华积
    labels:
      zh: 译出华积陀罗尼
    start_date: '0235'
    highlight_event_id: guji-支谦-event-huaji
  - key: closure
    name: 译业垂范
    labels:
      zh: 垂范江南
    start_date: '0250'
    highlight_event_id: guji-支谦-event-teaching
  decisions:
  - date: '0223'
    title_zh: 改质直为文雅体
    rationale: 吴地士人崇尚文采，若直译梵文则鄙俚难行，故以雅丽文笔译经以摄化士族
  - date: '0235'
    title_zh: 译出华积陀罗尼神咒经
    rationale: 见师子威请问供养功德因缘，欲令末世众生以持咒闻持得不退转，故选译此陀罗尼以利天人
- id: guji-支谦-endeavor-2
  title_zh: 居士弘化与建业教化
  summary: 不受出家戒而以优婆塞弘法，在吴都设馆授徒，讲解般若，教授弟子竺法护之前辈学人，开启建业佛教化
  phases:
  - key: brewing
    name: 入吴寄居
    labels:
      zh: 客居建业
    start_date: '0223'
    highlight_event_id: guji-支谦-event-translation-start
  - key: breakthrough
    name: 开馆授学
    labels:
      zh: 设馆讲经
    start_date: '0230'
    highlight_event_id: guji-支谦-event-teaching
  - key: climax
    name: 弘阐般若陀罗尼
    labels:
      zh: 广弘持咒法门
    start_date: '0235'
    highlight_event_id: guji-支谦-event-huaji
  - key: closure
    name: 门徒传灯
    labels:
      zh: 传灯后学
    start_date: '0250'
    highlight_event_id: guji-支谦-event-teaching
  decisions:
  - date: '0230'
    title_zh: 以居士身份开坛讲授
    rationale: 欲破僧俗界限，示现菩萨在家弘法可行，使在家人亦得发菩提心行菩萨道
  - date: '0245'
    title_zh: 教授持咒仪轨
    rationale: 依经中三月四月九月八日至十五日持咒供养之仪，教授在家信众如法修持，令得梦见如来、强记不忘
events:
- id: guji-支谦-event-birth
  title_zh: 出生月支之家
  date: '0200'
  year_of: 200
  is_circa: true
  kind: birth
  description: 约汉末生于月支后裔之家，世居中原，后徙居吴地，少聪慧，博览经籍，兼通梵汉
  location: 中原
- id: guji-支谦-event-translation-start
  title_zh: 建业初译大明度经
  date: '0223'
  year_of: 223
  kind: career
  description: 吴黄武二年始在建业设译场，译出大明度无极经等，确立文雅译风，名重吴中
  location: 建业
- id: guji-支谦-event-huaji
  title_zh: 译出华积陀罗尼神咒经
  date: '0235'
  year_of: 235
  kind: career
  description: 于阿耨达池龙王宫会说华积陀罗尼神咒因缘，译为一卷，详载供养舍利、持咒功德及陀罗尼咒本，并授持咒仪轨
  location: 建业译场
- id: guji-支谦-event-teaching
  title_zh: 设馆弘法授徒
  date: '0245'
  year_of: 245
  kind: career
  description: 以优婆塞身份开馆讲经，授徒数百，讲解般若及陀罗尼法门，江南佛学自此渐兴，为后来竺法护等译经僧之先导
  location: 建业
- id: guji-支谦-event-death
  title_zh: 圆寂吴中
  date: '0253'
  year_of: 253
  is_circa: true
  kind: death
  description: 约吴建兴二年前后圆寂于建业，一生译经四十余部，吴地传为居士译经之宗
  location: 建业
