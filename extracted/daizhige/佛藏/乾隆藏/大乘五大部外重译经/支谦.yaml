    title_zh: 广说受持八佛名号功德
    rationale: 欲令未得度者以简易持名获四天王拥护，免堕恶道速得菩提
  - date: 0238
    title_zh: 不出家而主持译场
    rationale: 守优婆塞戒而以译经为弘法正行，示在家亦可荷担如来家业以应吴地机宜
events:
