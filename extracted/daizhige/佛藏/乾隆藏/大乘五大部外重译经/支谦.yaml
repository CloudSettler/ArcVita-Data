  date: 0235-01-01
  year_of: 157
  location: 建业
  description: 译出佛说持句神咒经亦名陀罗尼句经，载无量华世界邓尊王如来遣二菩萨传持句咒，及弥勒等八十菩萨与释迦所说三咒，宣其七世十四世无数世宿命及辟毒蛇刀王梵害之威神
  is_circa: true
  precision: year
