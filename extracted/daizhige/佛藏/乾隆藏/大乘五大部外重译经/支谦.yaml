person:
  qid: guji-支谦
  name_zh: 支谦
  names:
    zh: 支谦
    en: Zhi Qian
  lifespan:
    birth:
      date: 0190
      precision: year
      is_circa: true
      raw: 约190年
    death:
      date: '0252'
      precision: year
      is_circa: true
      raw: 约252年
  birth_date: 约0190
  death_date: 约0252
  era: 三国吴
  reign_ref: 孙权黄武至神凤年间
  archetype: 译经居士
  dilemmas:
  - 忠于梵本与汉文雅俗之间的抉择
  - 白衣居士弘法与出家僧团规范的张力
  lesson: 守慈悲本怀而践信义，译经当以信达雅化导人心，方能使佛法广被
  summary_first_person: 吾本月支后裔，字恭明，寄籍吴地。少好学，博通梵汉六国之语。入吴见旧译质朴难通，士庶难解，遂立志以雅正流丽之笔重译众经，使佛理明畅。虽为优婆塞不敢自专，唯愿以笔墨为法施，如九色鹿以身济溺，令慈悲信义之教流行东土。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说九色鹿经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/佛说九色鹿经.html
  - https://cbetaonline.dila.edu.tw/zh/T0181b
endeavors:
- id: guji-支谦-endeavor-1
  title_zh: 吴地佛经翻译事业
  title_en: Translation of Buddhist Scriptures in Eastern Wu
  description: 自黄武初至神凤年间于建业译出《大明度经》《了本生死经》《佛说九色鹿经》等四十九部，创文丽雅正之译风，奠定江东佛教经典基础
  phases:
  - key: brewing
    name: 博通梵汉
    labels:
      zh: 积学
    start_date: '0220'
    highlight_event_id: guji-支谦-event-study
  - key: breakthrough
    name: 始译大部
    labels:
      zh: 首译
    start_date: '0223'
    highlight_event_id: guji-支谦-event-first-translation
  - key: climax
    name: 译经鼎盛
    labels:
      zh: 鼎盛
    start_date: '0235'
    highlight_event_id: guji-支谦-event-jiuselu
  - key: closure
    name: 垂范后学
    labels:
      zh: 垂范
    start_date: '0250'
    highlight_event_id: guji-支谦-event-legacy
  decisions:
  - date: '0223'
    title_zh: 决意以雅译代质译
    rationale: 见前译文质义晦，士大夫难入，遂改以汉地雅正流丽之文出经，使义不失真而辞达易晓
  - date: '0235'
    title_zh: 择本生故事译九色鹿经
    rationale: 取鹿王救溺而遭背恩之事，彰显菩萨慈悲与背信恶报，契吴地教化人心之需
- id: guji-支谦-endeavor-2
  title_zh: 居士弘法与义理本土化
  title_en: Lay Propagation and Sinicization of Doctrine
  description: 以优婆塞身份居吴弘法，辅导太子，讲学授徒，融通玄学与般若，引导士人信仰，影响支亮竺法护等后世译场
  phases:
  - key: brewing
    name: 定居建业
    labels:
      zh: 立足
    start_date: '0223'
    highlight_event_id: guji-支谦-event-settle
  - key: breakthrough
    name: 士人讲学
    labels:
      zh: 讲学
    start_date: '0230'
    highlight_event_id: guji-支谦-event-teaching
  - key: climax
    name: 融译与释义
    labels:
      zh: 融通
    start_date: '0240'
    highlight_event_id: guji-支谦-event-commentary
  - key: closure
    name: 法脉东传
    labels:
      zh: 传承
    start_date: '0252'
    highlight_event_id: guji-支谦-event-influence
  decisions:
  - date: '0230'
    title_zh: 坚持白衣身份不入僧籍
    rationale: 以居士身亲近朝野，便于在吴地士大夫间弘通，避免僧团与政权隔阂，扩大佛法影响
  - date: '0240'
    title_zh: 以汉儒信义诠释因果
    rationale: 借九色鹿报恩背恩之缘起，强调信义与慈悲，契合汉儒仁义观以促佛法本土化
events:
- id: guji-支谦-event-birth
  title_zh: 生于月支侨民之家
  date: 0190
  year_of: 0190
  description: 约汉末约190年生于月支后裔之家，祖辈归化汉地，自幼通汉语与梵语，博览经籍
  is_circa: true
- id: guji-支谦-event-death
  title_zh: 示寂于建业
  date: '0252'
  year_of: '0252'
  description: 约吴神凤年间卒于建业，一生译经四十九部，奠定吴地译经典范，后学尊为江东译祖
  is_circa: true
- id: guji-支谦-event-study
  title_zh: 博览梵汉六国语言
  date: '0220'
  year_of: '0220'
  description: 少年博览经籍，精通梵语及六国语言，随家南渡，为日后雅译奠定根基
- id: guji-支谦-event-settle
  title_zh: 定居建业受孙权礼遇
  date: '0223'
  year_of: '0223'
  description: 吴黄武二年至建业，孙权闻其才学，拜为博士，令辅导太子孙登，获安稳译场
- id: guji-支谦-event-first-translation
  title_zh: 初译了本生死经
  date: '0223'
  year_of: '0223'
  description: 始从事佛典汉译，译出《了本生死经》等，开创文雅译风，士人争传诵
- id: guji-支谦-event-teaching
  title_zh: 建业讲学融通玄佛
  date: '0230'
  year_of: '0230'
  description: 于建业为士人讲经，融通老庄玄理与般若空义，使佛理易为江东士族接受
- id: guji-支谦-event-jiuselu
  title_zh: 译出佛说九色鹿经
  date: '0235'
  year_of: '0235'
  description: 译出本生故事《佛说九色鹿经》一卷，述九色鹿救溺人而遭背恩、终得王护、风雨以时之慈悲因果，弘菩萨本怀
- id: guji-支谦-event-commentary
  title_zh: 注释经义推行雅译
  date: '0240'
  year_of: '0240'
  description: 对所译般若类经典加以注解阐发，推行信达雅译法，影响江东译经规范
- id: guji-支谦-event-legacy
  title_zh: 译业垂范影响后世
  date: '0250'
  year_of: '0250'
  description: 晚年译业大成，所译四十九部广行于世，为支亮、康僧会、竺法护等后世译家所宗
- id: guji-支谦-event-influence
  title_zh: 法脉东传奠定吴地佛学
  date: '0252'
  year_of: '0252'
  description: 示寂后其译本与译风在建业长久流传，江东佛教遂兴，成三国佛教中心之一
