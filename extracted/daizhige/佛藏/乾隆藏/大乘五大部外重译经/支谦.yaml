    name: 初译立名
    labels:
      zh: 建业初译
    start_date: 0223-01-01
    highlight_event_id: guji-支谦-event-translation-start
  - key: climax
    name: 盛译陀罗尼
    labels:
      zh: 持句神咒
    start_date: 0235-01-01
    highlight_event_id: guji-支谦-event-chiju-shenzhou
  - key: closure
    name: 译业集成
    labels:
      zh: 卷轴流布
    start_date: 0250-01-01
    highlight_event_id: guji-支谦-event-collection
  decisions:
  - date: 0223-01-01
    title_zh: 确立文雅译风
    rationale: 吴地士人崇尚文采，若直译质朴难入人心，故兼顾信达雅以雅驯之笔传深幽之旨
  - date: 0235-01-01
    title_zh: 音译陀罗尼兼存梵音
    rationale: 持句神咒以音声为总持，义译则失威神，故保留阇梨摩诃等梵音咒句令持诵得力
- id: guji-支谦-endeavor-2
  title_zh: 居士译场与吴地弘化
  title_en: Lay Translation Atelier and Propagation in Wu
  summary: 以优婆塞身份主持译场，聚众讲译，沟通吴廷与僧团，使佛教在江南士族中取得合法地位，并启后世康僧会等南土弘法
  phases:
  - key: brewing
    name: 入吴结缘
    labels:
      zh: 优婆塞立场
    start_date: 0221-01-01
    highlight_event_id: guji-支谦-event-translation-start
  - key: breakthrough
    name: 译场聚众
    labels:
      zh: 招徒合译
    start_date: 0228-01-01
    highlight_event_id: guji-支谦-event-atelier
  - key: climax
    name: 王廷信重
    labels:
      zh: 吴廷护法
    start_date: 0238-01-01
    highlight_event_id: guji-支谦-event-chiju-shenzhou
  - key: closure
    name: 南土法脉
    labels:
      zh: 启迪后学
    start_date: 0252-01-01
    highlight_event_id: guji-支谦-event-collection
  decisions:
  - date: 0228-01-01
    title_zh: 以居士主持译场协作译经
    rationale: 居士不受僧律拘束更易与吴地名士往来，合众人之力校梵证义可提升译文准确与流布
  - date: 0245-01-01
    title_zh: 宣说持咒护国安民之用
    rationale: 吴境多虎狼疾疫与巫蛊之惧，宣扬持句咒辟除凶害、百病消除之功，易获官民共信以广佛化
