endeavors:
- id: guji-文殊师利-endeavor-1
  title_zh: 耆阇崛山巡行破执显真
  summary: 于王舍城耆阇崛山巡行五百比丘行住之处，诘问舍利弗所入之禅，破过去未来现在内外身心之依执，显真如无念无相无住不可得
  phases:
  - key: brewing
    name: 巡行发问
    labels:
      zh: 起疑
    start_date: -0480-05-01
    highlight_event_id: guji-文殊师利-event-dialogue
  - key: breakthrough
    name: 真如无依之辩
    labels:
      zh: 破执
    start_date: -0480-05-01
    highlight_event_id: guji-文殊师利-event-dialogue
  - key: climax
    name: 深法惊众离席
    labels:
      zh: 惊疑
    start_date: -0480-05-02
    highlight_event_id: guji-文殊师利-event-monks-leaving
  - key: closure
    name: 回面受教转悟
    labels:
      zh: 转悟
    start_date: -0480-05-02
    highlight_event_id: guji-文殊师利-event-monks-return
  decisions:
  - date: -0480-05-01
    title_zh: 直问禅依何在
    rationale: 不作慰语而直指依处，问依过去未来现在内外身心何禅，以显诸法皆无依、过去未来现在如来无住
  - date: -0480-05-02
    title_zh: 说无文殊不可得
    rationale: 面对诽谤舍离之语，反显文殊无得不可见闻，住处亦无无可舍离，以空破名相执
- id: guji-文殊师利-endeavor-2
  title_zh: 助佛宣化令众授记
  summary: 助世尊印可真如不增不减法界不染不净，以重颂显分别即缚不分别即脱，令闻法者得法眼净并发菩提心得授记
  phases:
  - key: brewing
    name: 世尊印可
    labels:
      zh: 印证
    start_date: -0480-05-03
    highlight_event_id: guji-文殊师利-event-buddha-praise
  - key: breakthrough
    name: 显福胜于禅定
    labels:
      zh: 显胜
    start_date: -0480-05-03
    highlight_event_id: guji-文殊师利-event-buddha-praise
  - key: climax
    name: 四百比丘解脱
    labels:
      zh: 解脱
    start_date: -0480-05-02
    highlight_event_id: guji-文殊师利-event-monks-return
  - key: closure
    name: 星喻劫授记成佛
    labels:
      zh: 授记
    start_date: -0480-05-03
    highlight_event_id: guji-文殊师利-event-prophecy
  decisions:
  - date: -0480-05-03
    title_zh: 以一触堕天显闻法功德
    rationale: 明百比丘虽起恶心堕叫唤地狱但以闻法少受即生兜率、弥勒初会得阿罗汉，显此法门超四禅四无量三摩跋提
  - date: -0480-05-03
    title_zh: 承佛说偈摄众发心
    rationale: 承佛重说分别则取不分别则脱等偈，令十千众生得法眼净、五百比丘发阿耨多罗三藐三菩提心
events:
- id: guji-文殊师利-event-birth
  title_zh: 示现诞生
  date: -0500-01-01
  year_of: -500
  place: 天竺
  description: 大乘传说中文殊师利童子示现诞生，号妙吉祥，常为诸佛之师，助佛教化
- id: guji-文殊师利-event-dialogue
  title_zh: 耆阇崛山诘问舍利弗禅义
  date: -0480-05-01
  year_of: -480
  place: 王舍城耆阇崛山
  description: 世尊与五百比丘说法时，文殊师利巡行至舍利弗独坐禅处，问为未寂静欲令寂静而入禅耶，问依过去未来现在内外身心何禅，破离欲依执显真如无念无相不可得
- id: guji-文殊师利-event-monks-leaving
  title_zh: 五百比丘离席诽谤
  date: -0480-05-02
  year_of: -480
  place: 王舍城耆阇崛山
  description: 说无得无住之法后，五百比丘从坐而起舍离而去，言不用见闻文殊，有文殊住处亦应舍离，谓其异梵行
- id: guji-文殊师利-event-monks-return
  title_zh: 回面受教四百得解脱
  date: -0480-05-02
  year_of: -480
  place: 王舍城耆阇崛山
  description: 文殊说无文殊不可见闻不可舍离后，五百比丘回面言非我能解，文殊示法界无念无退非识智所知，四百比丘不受诸法尽结漏心得解脱，一百起恶心暂堕地狱后得生兜率
- id: guji-文殊师利-event-buddha-praise
  title_zh: 世尊印可真如不增减
  date: -0480-05-03
  year_of: -480
  place: 王舍城耆阇崛山
  description: 世尊告舍利弗如文殊所说真如不增不减法界不增不减众生界不增不减不染不净，并说堕地狱者以闻法故少受即脱，非修四禅等可及
- id: guji-文殊师利-event-prophecy
  title_zh: 重颂授记星喻劫成佛
  date: -0480-05-03
  year_of: -480
  place: 王舍城耆阇崛山
  description: 世尊重说偈言分别则缚不分别则脱等义，时十千众生得法眼净，五百比丘发菩提心，世尊授记五百比丘于星喻劫同号法华如来
- id: guji-文殊师利-event-death
  title_zh: 示现无灭常住
  date: '0999-12-31'
  year_of: 999
  place: 常住法界
  description: 大乘说文殊为大菩萨不示入灭，无生无灭住真如法界，常巡行十方助佛教化，故无入灭年代
