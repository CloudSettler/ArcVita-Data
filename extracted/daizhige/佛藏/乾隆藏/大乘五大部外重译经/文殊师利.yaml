      raw: 大乘说不生不灭无入灭，示现常住
  birth_date: -0500-01-01
  death_date: '0999-12-31'
  era: 大乘佛教传说时代
  reign_ref: 释迦牟尼佛世
  archetype: 智辩菩萨
  dilemmas:
  - 深法难信与护念众生的张力，于甚深空义与众生根器之间如何权衡
  - 破相显真与不谤如来的分寸，既破依执又不落断灭谤佛
  - 令疑者离席与令悟者得度的取舍，宁使一时惊疑以成久远得度
  lesson: 不执名相不落断常，于无依无住中显真如，离分别取舍方得解脱
  summary_first_person: 吾为文殊师利童子，巡行耆阇崛山大众之中，以问禅破执，显真如无念无相无依无得非识智所知，虽令五百比丘一时惊疑离席，然为令众离名色分别、知法界如空而得究竟解脱
