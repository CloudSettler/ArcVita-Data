  archetype: 宿智谏父少年
  dilemmas:
  - 父亲申日欲听外道之计以毒饭火坑试佛，是否逆亲直谏以止恶
  - 明知佛具他心通神通无碍，如何劝阻父亲免造逆罪自投汤火
  - 身为十六岁少年宿学佛道，如何在父辈外道群议中坚守正信不被众惑
  lesson: 宿善不昧当信正法不信恶友，以智孝匡救亲过方为真孝，贪嗔痴三毒为害唯正道能消
  summary_first_person: 我是王舍城四姓长者申日之子旃罗法人称申日儿，年方十六宿世习佛能知去来现在之事。见父为诸异道所惑欲掘地为火坑置毒饭以试佛陀，我再三谏言佛已知议莫自投汤火而父不听，及见佛放光化火坑为莲池浴池咒毒皆消父得须陀洹，我亦深信正法不疑。
