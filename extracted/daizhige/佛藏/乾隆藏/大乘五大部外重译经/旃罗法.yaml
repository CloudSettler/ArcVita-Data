  description: 四姓长者申日之子字旃罗法即申日儿，宿命学佛道年十六能知去来现在之事
- id: guji-旃罗法-event-admonish
  title_zh: 谏父莫以毒饭火坑试佛
  date: -320
  year_of: -500
  place: 王舍城申日舍中
  description: 诸异道教申日掘门里地深五丈置火薄覆以毒置饭试佛，旃罗法谏言佛已知议不须试莫用恶人言自投汤火父不信仍掘坑具毒饭
- id: guji-旃罗法-event-miracle
  title_zh: 见证佛化火坑为莲池毒饭成甘
  date: -320
  year_of: -500
  place: 申日舍门前火坑及食座
  description: 佛与阿难及众比丘诸天王鬼神化地为金放光至城，蹈火坑化浴池生千叶莲华，咒言三毒不存毒皆消去众比丘得食申日怖惧悔过佛为说法得须陀洹受五戒为优婆塞
- id: guji-旃罗法-event-death
