    rationale: 见众生著我见堕一乘不解无明爱缚四颠倒五盖六入七识住八邪九恼十恶故愿开悟摄导令发大心非为自身
- id: guji-无垢光女-endeavor-2
  name_zh: 莲华化生论庄严并开转女身道
  desc: 自母右胁化生莲华台拒帝释天衣璎珞广论菩萨十种庄严受本佛遣衣具五通诣佛请问摄菩提四法与舍利弗辨法如化并为四众开示离女身速成男子一至十法及厌离观
  phases:
