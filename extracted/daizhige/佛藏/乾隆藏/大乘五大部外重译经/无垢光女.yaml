  decisions:
  - date: -0500-01-06
    title_zh: 拒受憍尸迦天衣以菩提心为庄严
    rationale: 帝释乐小智怖生死求速涅槃非净福田菩萨当以不失菩提心大慈悲精进忍辱等十种为衣以相好福慧为胜严故不受
  - date: -0500-01-07
    title_zh: 受本师无垢称王佛遣衣具通诣佛
    rationale: 彼国无女人欲示菩萨不以男女相来去且得五通便于众中广行教化故受而着放光震地
  - date: -0500-01-08
    title_zh: 请佛说摄菩提增长四法并为女人说转女身行
    rationale: 为令比丘尼优婆夷等离女身苦离慢谄清净三业具足信施厌离不净速成男子回向无上菩提故广请开示
events:
- id: guji-无垢光女-event-birth
  title_zh: 右胁化生莲台出现
  date: -0500-01-05
  year_of: -500
  location: 王舍城耆阇崛山
  description: 以佛神力及自身福慧犹如后边身菩萨从净日右胁忽然化生母身无恼平复如故地动雨华陆地生大莲黄金茎白银叶马瑙须真珠台女立其上如二三岁儿
- id: guji-无垢光女-event-fetal-hearing
  title_zh: 胎中合掌一心听法欲问
  date: -0500-01-01
  year_of: -500
  location: 王舍城耆阇崛山佛会中净日胎内
  description: 婆罗门须达多妻净日怀女胎诸根具足不杂垢秽合掌向佛听法欲问尊者阿泥卢豆以天眼见之白佛佛放光令众会皆见
- id: guji-无垢光女-event-light
  title_zh: 佛放光明普照三千令众见胎女
  date: -0500-01-02
  year_of: -500
  location: 耆阇崛山
  description: 世尊放大光明遍照三千以神力令四众皆见净日所怀女在胎合掌欲问并出微妙和雅音声诘问来意
- id: guji-无垢光女-event-question
  title_zh: 胎中陈十类众生因缘向佛发问
  date: -0500-01-03
  year_of: -500
  location: 耆阇崛山
  description: 女承佛威神于胎中答为贪我见不解一乘无明爱缚三解脱四颠倒五盖六通七觉八道九定十善等众生欲开示正法令成就善根故来听法
- id: guji-无垢光女-event-praise
  title_zh: 众叹希有佛赐名无垢光
  date: -0500-01-04
  year_of: -500
  location: 耆阇崛山
  description: 一切众会叹菩提萨埵处胎不废饶益佛告舍利弗此女着衣时放大光明故名无垢光当忆持之
- id: guji-无垢光女-event-lotus-birth
  title_zh: 化生后现莲华台地动
  date: -0500-01-05
  year_of: -500
  location: 耆阇崛山莲台上
  description: 化生未久地大震动雨天华乐器不鼓自鸣陆地生大莲庄严女立其上释提桓因持天衣璎珞劝着被拒
- id: guji-无垢光女-event-reject-indra
  title_zh: 拒帝释衣说菩萨十种庄严
  date: -0500-01-06
  year_of: -500
  location: 耆阇崛山
  description: 告憍尸迦菩萨不以世衣为严当以不失菩提心深心慈悲惭愧施戒忍辱精进禅定等十种为衣以相好福慧布施无恚为严惊怖退屈则非庄严万二千人发心
- id: guji-无垢光女-event-receive-robe
  title_zh: 受净住世界无垢称王佛遣衣具五通
  date: -0500-01-07
  year_of: -500
  location: 耆阇崛山虚空中
  description: 东南方过三十六那由他佛土净住世界无垢称王如来以神力送菩萨衣璎珞悬空中女取着之放妙光蔽梵释日月即具五神通下莲台诣佛请问摄菩提增长四法佛广说数十种四法令不退转过魔速成菩提三万二千人发心
- id: guji-无垢光女-event-debate-sariputra
  title_zh: 与舍利弗辩法如化及调伏解脱
  date: -0500-01-08
  year_of: -500
  location: 耆阇崛山
  description: 舍利弗问名问所从来问成就众生问三乘调伏女答诸法本无名随行立名彼国无女人法皆如化无差别则能成就观邪道即正道无我见则调伏二百比丘漏尽解脱自称是罗汉为应以声闻身得度者现声闻身
- id: guji-无垢光女-event-teach-transform
  title_zh: 请问开示女人转女身速成男子一至十法
  date: -0500-01-09
  year_of: -500
  location: 耆阇崛山
  description: 为四部众问修何行离女身速成男子发菩提佛次第说一法深心二法除慢离诳三法三业十善四法忍辱五法乐法六念七信八不偏爱九息九恼十不自大等并观女身百虫不净属他苦役当厌离回向出家先奉佛菩萨
- id: guji-无垢光女-event-death
  title_zh: 示现成就未入涅槃留惑度生
  date: -0500-12-31
  year_of: -500
  location: 王舍城
  description: 经末未记涅槃依菩萨不证非时解脱愿留生死以大悲度脱为本示现转女身法门后当还净住或随愿往来成就众生故记为示现圆满
