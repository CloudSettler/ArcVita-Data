  reign_ref: 释迦牟尼佛住王舍城说法时
  archetype: 智辩菩萨
  dilemmas:
  - 女身系缚与欲行菩萨广大庄严之冲突
  - 小智速求涅槃与大悲留惑度生之抉择
  - 男女色相分别与诸法如化无差别之见
  lesson: 不以衣服璎珞为严当以菩提心大慈悲精进忍辱为严观诸法如化无男女相以深心回向菩提自能转女身为法器普度众生
  summary_first_person: 吾自净住世界无垢称王佛所来为见释迦礼供听法虽处母胎合掌欲问非为己身为诸贪我见覆障堕颠倒五盖十恶者开一乘三解脱四谛等法后于莲华化生不受小璎珞惟以菩提心为衣与舍利弗论法如化以证无缚无解并请佛说转女身一至十法令诸女人厌离不净速成男子发无上心
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说转女身经.md
