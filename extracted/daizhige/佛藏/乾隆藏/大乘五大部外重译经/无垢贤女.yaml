  title_zh: 示现不退后化去
  date: '-0500'
  is_circa: true
  description_zh: 经末言皆大欢喜稽首而退女得阿惟越致与诸眷属同行菩萨道示现化去后世传为无垢贤女菩萨
  year_of: '-0500'
