  date: -0600-01-01
  is_circa: true
  description_zh: 在母胎中形体具足叉手听佛说经阿那律以彻视见之佛放光明令十方飞鸟走兽虫蛇胎卵皆舒翼屈足槃身同听女等以八音答言为度迷五处多淫怒痴不孝不供佛僧者故听经
  year_of: '-0600'
- id: guji-无垢贤女-event-clothing
  title_zh: 自然法衣空来得五通
  date: -0600-02-02
  is_circa: true
  description_zh: 天帝欲施天衣女言未脱欲泥洹不受其施自称大乘无男女相佛言菩萨相好为庄严时东方阎浮檀国自然法衣从空肃萧而来着已即得五通本国众亦皆得五通
  year_of: '-0600'
- id: guji-无垢贤女-event-transformation
  title_zh: 诣佛闻法化女成男得不退转
  date: -0600-02-04
  is_circa: true
