  dilemmas:
  - 如何在梵华语际与义理深浅之间准确传达不生不灭镜像法身之甚深义
  - 如何在王朝崇佛与译场人力物力有限中完成大部大乘经典的持续翻译
  - 如何以方便譬喻令初发心菩萨与凡夫众生同得开解而不生惊怖
  lesson: 诸法如镜像不实不生不灭，依清净心与本愿力方见如来法身，翻译弘法当以平等舍心随众生信力而现法音
  summary_first_person: 吾天竺沙门昙摩流支，西来入魏，栖止洛阳译场。承佛神力与众生善根，愿以华言转梵，译此庄严智慧光明法门，喻如镜海与日光，令众生知如来法身不生不灭、不可见而普现，依此发菩提心，远离障恼，趣入佛境。
