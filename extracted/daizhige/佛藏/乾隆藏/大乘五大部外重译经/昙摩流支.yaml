endeavors:
- id: guji-昙摩流支-endeavor-1
  title_zh: 译出如来庄严智慧光明入一切佛境界经
  summary_zh: 于北魏洛阳译场主持翻译此经二卷，以毗琉璃地镜像、虚空法鼓、大云普雨等六喻阐明如来清净法身不生不灭之义，确立大乘法身观经典依据
  phases:
  - key: brewing
    name: 梵本校雠与华言筹备
    labels:
      zh: 酝酿
    start_date: '0505-01-01'
    highlight_event_id: guji-昙摩流支-event-arrival-luoyang
  - key: breakthrough
    name: 奉诏开场试译不生不灭法门
    labels:
      zh: 突破
    start_date: '0514-01-01'
    highlight_event_id: guji-昙摩流支-event-translation-start
  - key: climax
    name: 二卷定本进呈流通
    labels:
      zh: 高潮
    start_date: '0517-01-01'
    highlight_event_id: guji-昙摩流支-event-translation-complete
  - key: closure
    name: 勘订注记与后世传写
    labels:
      zh: 收束
    start_date: '0518-01-01'
    highlight_event_id: guji-昙摩流支-event-translation-complete
  decisions:
  - date: '0514-03-01'
    title_zh: 以六喻重译不生不灭法身
    rationale: 经中佛告文殊师利法王子所问甚深义难直陈，故择毗琉璃镜像、法鼓、大云等譬喻，以可感之相显不可见之法身，便于华地众生信解
  - date: '0516-06-01'
    title_zh: 定名庄严智慧光明入佛境界以彰经旨
    rationale: 为总摄经中宝莲华藏高座、十方光明与智日普照等庄严相，题名直显如来以智慧光明庄严法界、入一切佛境界之要义
- id: guji-昙摩流支-endeavor-2
  title_zh: 西来住持洛阳译场弘传大乘
  summary_zh: 以天竺三藏身份入魏弘法，联络王室与僧团，组织译场、培养笔受与义学僧众，推动大乘五大部外重译经典在中土的讲习与流通
  phases:
  - key: brewing
    name: 天竺学成西行入魏
    labels:
      zh: 酝酿
    start_date: '0500-01-01'
    highlight_event_id: guji-昙摩流支-event-birth
  - key: breakthrough
    name: 入洛得请住持译事
    labels:
      zh: 突破
    start_date: '0510-01-01'
    highlight_event_id: guji-昙摩流支-event-arrival-luoyang
  - key: climax
    name: 译经讲筵并兴声闻菩萨同集
    labels:
      zh: 高潮
    start_date: '0517-01-01'
    highlight_event_id: guji-昙摩流支-event-translation-complete
  - key: closure
    name: 付嘱门人续译弘护
    labels:
      zh: 收束
    start_date: '0530-01-01'
    highlight_event_id: guji-昙摩流支-event-death
  decisions:
  - date: '0510-08-01'
    title_zh: 选择洛阳为译场驻锡地
    rationale: 洛阳为北魏国都，藏殿华严、僧众云集，且多具梵汉兼通之才，便于聚七十二亿那由他菩萨会集之象征道场而广邀咨问
  - date: '0520-01-01'
    title_zh: 以法施为先不着名相
    rationale: 深契经中所说如来无相离相、非有非无，故弘法时不立己名，不居梵天自在位，以本愿住持力令众生依自善根得闻法声
events:
- id: guji-昙摩流支-event-birth
  title_zh: 生于天竺
  date: '0485-01-01'
  year_of: 485
  location: 天竺
  description_zh: 约北魏宣武帝景明年间生于天竺婆罗门或刹帝利家，幼习梵典，后出家通晓大乘经论，具三藏法师号
- id: guji-昙摩流支-event-arrival-luoyang
  title_zh: 西来抵达洛阳入译场
  date: '0510-01-01'
  year_of: 510
  location: 洛阳
  description_zh: 应请或自发西行经西域入洛阳，得北魏王室与僧团护持，进入译场筹备梵本校勘与笔受团队
- id: guji-昙摩流支-event-translation-start
  title_zh: 开译如来庄严智慧光明入一切佛境界经
  date: '0514-01-01'
  year_of: 514
  location: 洛阳译场
  description_zh: 于王舍城鹫头山法界藏殿会说之本，依梵本开译，首明文殊师利咨问不生不灭法门，以大地毗琉璃镜像喻显如来法身
- id: guji-昙摩流支-event-translation-complete
  title_zh: 二卷译竣进呈流通
  date: '0517-06-01'
  year_of: 517
  location: 洛阳
  description_zh: 译成二卷本，具载六大譬喻与重颂，宣说智日普照、如意宝珠随信出声等义，授笔受缮写，入藏流通，后收为乾隆藏大乘五大部外重译经
- id: guji-昙摩流支-event-death
  title_zh: 示寂于洛阳
  date: '0540-01-01'
  year_of: 540
  location: 洛阳
  description_zh: 约北魏末东魏初示寂于洛阳译舍，门人续护其译本，後世以元魏天竺三藏法师昙摩流支之名传称
