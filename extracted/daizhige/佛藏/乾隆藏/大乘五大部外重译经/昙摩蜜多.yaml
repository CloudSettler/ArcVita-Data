    start_date: '0435'
    highlight_event_id: guji-昙摩蜜多-event-translate
  - key: climax
    name: 讲演空相与无生忍
    labels:
      zh: 讲法度众
    start_date: 0438
    highlight_event_id: guji-昙摩蜜多-event-preach
  - key: closure
    name: 示寂建康法化留世
    labels:
      zh: 示寂留法
    start_date: '0442'
    highlight_event_id: guji-昙摩蜜多-event-death
  decisions:
  - date: '0435'
    title_zh: 择象腋经为先译显菩萨大行
    rationale: 此经具说六度六通及文殊深问，能破增上慢令入虚空平等法性，契当世好玄风
  - date: 0439
    title_zh: 以禅释经不立文字戏论
    rationale: 示一切法如幻如影非修非证，令学人离分别而入寂静三昧，免堕有无二见
events:
- id: guji-昙摩蜜多-event-birth
  title_zh: 诞生于罽宾
  date: '0356'
  year_of: '0356'
  description: 约356年生于罽宾国，少而颖悟乐于禅思
- id: guji-昙摩蜜多-event-study
  title_zh: 出家习禅得陀罗尼
  date: '0375'
  year_of: '0375'
  description: 少年出家，师从罽宾禅师，习大小乘禅法及陀罗尼，成就不可思议神通乐说无碍
- id: guji-昙摩蜜多-event-travel
  title_zh: 游化西域诸国
  date: '0400'
  year_of: '0400'
  description: 于罽宾龟兹等地游行教化，以寂静三昧示现度众，名闻西域
- id: guji-昙摩蜜多-event-vow
  title_zh: 发愿东行入华
  date: '0424'
  year_of: '0424'
  description: 感汉地求法之诚，决计东行弘化，浮海南渡往刘宋
- id: guji-昙摩蜜多-event-arrive
  title_zh: 抵建康住祇洹寺
  date: '0432'
  year_of: '0432'
  description: 元嘉年间抵达建康，宋文帝礼遇，敕住祇洹寺，众僧归仰
- id: guji-昙摩蜜多-event-translate
  title_zh: 译佛说象腋经一卷
  date: '0435'
  year_of: '0435'
  description: 于建康译出佛说象腋经一卷，具载佛在耆阇崛山与文殊舍利弗问答，广明菩萨六法住功德及虚空无相之理
- id: guji-昙摩蜜多-event-preach
  title_zh: 讲授虚空法性与无生法忍
  date: 0438
  year_of: 0438
  description: 依象腋经讲演诸法如虚空非闇非明非修非证，令六十增上慢比丘得解脱、四万二千人得无生忍
- id: guji-昙摩蜜多-event-death
  title_zh: 圆寂于建康
  date: '0442'
  year_of: '0442'
  description: 442年示寂于建康，世寿约八十余，其所译象腋经等后入藏传为大乘要典
