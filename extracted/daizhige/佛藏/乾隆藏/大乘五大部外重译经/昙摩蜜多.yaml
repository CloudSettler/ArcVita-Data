  dilemmas:
  - 禅观实修与文字般若何者更能利他
  - 梵本义理精微与华言通俗之间如何取舍以不失真
  - 隐居山林自了与入世弘化广度众生如何抉择
  lesson: 以菩提心为根本则一切信施皆得清净报，译经与修禅皆是四摄度生之方便
  summary_first_person: 吾本罽宾人，少出家而习禅诵，长途东来入于宋境。见中土渴仰大法，故以梵文译为华言，演诸法勇王深义，欲令人知菩萨不入僧数而实为无上福田。愿诸学者发无上心，胜过百年供养成报。
