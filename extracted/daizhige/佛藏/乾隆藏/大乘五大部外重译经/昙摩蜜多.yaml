    title_zh: 择诸法勇王经先译
    rationale: 经中广辨菩萨不入僧数而能毕报施恩，正可破时人执声闻果为至极之惑
  - date: '0431'
    title_zh: 以质直华言译梵义
    rationale: 宁存经旨令可诵习，不事文饰而失佛意，使信心出家者得解僧业僧利之别
events:
- id: guji-昙摩蜜多-event-birth
  date: '0356'
  title_zh: 生于罽宾
  description: 约晋穆帝永和年间生于罽宾国，少而颖悟出家习禅，精通三藏尤善禅观
  location: 罽宾
  year_of: '0356'
- id: guji-昙摩蜜多-event-arrival
  date: '0424'
  title_zh: 抵达建康
  description: 刘宋元嘉初年，携梵经自西域经流沙东至建康，宋文帝礼为三藏法师，敕住祇洹等寺弘禅
  location: 建康
  year_of: '0424'
- id: guji-昙摩蜜多-event-translation
  date: '0430'
  title_zh: 译佛说诸法勇王经
  description: 于扬州建康译出一卷本诸法勇王经，阐明菩萨发心行四摄法为一切善法之源，虽不入声闻僧数而为世间无上福田
  location: 建康
  year_of: '0430'
- id: guji-昙摩蜜多-event-temple
  date: '0435'
  title_zh: 荆州建寺弘化
  description: 晚年移化荆州，于江陵等地建寺安众，授禅导俗，学众数百，为南朝禅法开先
  location: 荆州江陵
  year_of: '0435'
- id: guji-昙摩蜜多-event-death
  date: '0442'
  title_zh: 圆寂于荆州
  description: 元嘉十九年示寂于荆州，世寿约八十六，葬后门人分建塔庙，舍利流布
  location: 荆州
  year_of: '0442'
