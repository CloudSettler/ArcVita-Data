    labels:
      zh: 禅观成就
    start_date: 0390
    highlight_event_id: guji-昙摩蜜多-event-travel
  - key: closure
    name: 发愿东行弘法
    labels:
      zh: 东行发愿
    start_date: '0420'
    highlight_event_id: guji-昙摩蜜多-event-vow
  decisions:
  - date: 0380
    title_zh: 捨俗入道专修禅法
    rationale: 见世间烦恼炽盛，欲以寂静三昧度众，故弃世荣而从师学定
  - date: '0424'
    title_zh: 决计浮海东入刘宋
    rationale: 闻江南帝王崇佛众生慕法，愿以所学禅法梵典广利汉地
- id: guji-昙摩蜜多-endeavor-2
  title_zh: 建康译经与象腋经弘传
  description: 元嘉年间抵达建康，住祇洹寺等处，译出佛说象腋经等凡数部，以文殊问答显空有不二、无生法忍之旨，开南朝般若禅观风气
  phases:
  - key: brewing
    name: 初至建康观察风化
    labels:
      zh: 抵宋观察
    start_date: '0432'
    highlight_event_id: guji-昙摩蜜多-event-arrive
  - key: breakthrough
    name: 译出象腋经
    labels:
