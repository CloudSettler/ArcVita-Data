    title_zh: 应请东行入宋
    rationale: 见中土禅法未广，愿以己所证禅法度彼方众生，虽远涉流沙亦不辞
  - date: '0430'
    title_zh: 开众授禅不立门户
    rationale: 欲令四念处等僧业普被士庶，不以师资自限而广接学人
