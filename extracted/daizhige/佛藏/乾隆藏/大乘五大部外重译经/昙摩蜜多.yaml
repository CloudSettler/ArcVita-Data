  birth_date: '0356'
  death_date: '0442'
  era: 刘宋
  reign_ref: 宋文帝元嘉
  archetype: 译经禅师
  dilemmas:
  - 禅观静修与译经利他何以兼顾
  - 异域梵典如何以华言显发空性实相而不落文字戏论
  lesson: 如虚空遍一切而不可捉，诸法非修非证，当以无分别智行于世
  summary_first_person: 吾本罽宾人氏，少习禅定三昧，深究虚空无相之旨。元嘉南渡来至建康，常念正法当以华言广布，遂译象腋经等典，欲令众生知一切法如幻如梦，入无生忍而得安乐。
