  decisions:
  - date: '0412'
    title_zh: 应请入姑臧
    rationale: 沮渠蒙逊诚邀弘法，为使大乘广布河西，决意入凉州建立译场
  - date: '0417'
    title_zh: 先译涅槃后译金光明
    rationale: 以涅槃佛性论奠基，再以金光明护国忏悔法门契合王臣安邦之需
- id: guji-昙无谶-endeavor-2
  title_zh: 弘宣金光明忏悔护国法
  description: 依金光明经四卷宣说四佛护持、金鼓忏悔、流水济鱼等法门，令王臣百姓受持读诵以除罪障、护国安民。
  phases:
  - key: brewing
    name: 宣讲酝酿
    labels:
      zh: 筹备
    start_date: 0419
    highlight_event_id: guji-昙无谶-event-preach-jinguang
  - key: breakthrough
