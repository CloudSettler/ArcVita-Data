  era: 十六国·北凉
  reign_ref: 沮渠蒙逊
  archetype: 译经弘法者
  dilemmas:
  - 持律精严与王权逼迫之间的张力
  - 梵本广博与中土文辞信达之间的权衡
  lesson: 以清净心为本，以忏悔灭障，以译传续慧命
  summary_first_person: 吾本中印度人，少习大乘游学罽宾，承白头禅师习禅法，后至敦煌、姑臧，沮渠蒙逊待以国师之礼，于河西立译场译大般涅槃经及金光明经四卷，演四佛护持、金鼓忏悔之旨，愿众生闻经思惟、灭罪生福、护国安民。
  source_urls:
