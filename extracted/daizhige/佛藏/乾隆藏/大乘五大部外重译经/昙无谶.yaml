person:
  qid: guji-昙无谶
  name_zh: 昙无谶
  names:
    zh: 昙无谶
    en: Dharmakshema
  lifespan:
    birth:
      date: 0385
      precision: year
      is_circa: true
      raw: 约385年中天竺
    death:
      date: '0433'
      precision: year
      is_circa: false
      raw: 433年河西道中遇害
  birth_date: 0385
  death_date: '0433'
  era: 十六国北凉
  reign_ref: 北凉玄始年间沮渠蒙逊在位
  archetype: 译经高僧
  dilemmas:
  - 咒术外道速效与大乘空义究竟之间的抉择
  - 依附王权以广弘法与保持僧格清净自立的张力
  - 西行求法续译与留驻姑臧安稳译事的取舍
  lesson: 舍小术而求大道，以译经为续佛慧命之正业，虽身殉而法藏长存
  summary_first_person: 吾本中天竺婆罗门子，少习咒术，遇白头师而悟大乘空观，遂弃外道入佛门，游罽宾龟兹而穷方等，入河西姑臧蒙沮渠氏护，竭十余年译涅槃、大云、悲华诸经，欲以常住佛性破无常邪见，虽终被害于西道，愿法雨长润群生。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%A4%A7%E6%96%B9%E7%AD%89%E5%A4%A7%E4%BA%91%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%A4%A7%E6%96%B9%E7%AD%89%E5%A4%A7%E4%BA%91%E7%BB%8F.html
endeavors:
- id: guji-昙无谶-endeavor-1
  title_zh: 天竺转依与西域游学求法
  description: 出身婆罗门精咒术，后受大乘师开示归佛，遍学大小乘于天竺罽宾，奠定方等涅槃思想根基并西行弘化
  phases:
  - key: brewing
    name: 婆罗门咒术修学期
    labels:
      zh: 习咒婆罗门
    start_date: 0395
    highlight_event_id: guji-昙无谶-event-study-spell
  - key: breakthrough
    name: 白头师点化转依大乘
    labels:
      zh: 转依大乘
    start_date: '0405'
    highlight_event_id: guji-昙无谶-event-convert-mahayana
  - key: climax
    name: 罽宾龟兹广参大乘
    labels:
      zh: 罽宾参学
    start_date: '0410'
    highlight_event_id: guji-昙无谶-event-kashmir-study
  - key: closure
    name: 中亚鄯善初弘方等
    labels:
      zh: 西域初弘
    start_date: '0415'
    highlight_event_id: guji-昙无谶-event-preach-shanshan
  decisions:
  - date: '0405'
    title_zh: 舍咒术皈依佛门
    rationale: 见咒术不出生死，受白头婆罗门授树皮大乘空观遂弃外道，决意求无上菩提
  - date: '0410'
    title_zh: 西赴罽宾质辩大小乘
    rationale: 为穷究经义，往罽宾师子论场广读方等，坚定弘传大乘常住佛性之志
- id: guji-昙无谶-endeavor-2
  title_zh: 姑臧译场主持大乘要典汉译
  description: 应河西沮渠蒙逊迎请入姑臧，设译场率众译出大般涅槃经、大方等大云经、大方等无想经、悲华经等十余部，奠定北朝涅槃佛性学
  phases:
  - key: brewing
    name: 入河西获王护
    labels:
      zh: 入姑臧
    start_date: '0420'
    highlight_event_id: guji-昙无谶-event-arrive-guzang
  - key: breakthrough
    name: 首译大般涅槃经
    labels:
      zh: 译涅槃经
    start_date: '0421'
    highlight_event_id: guji-昙无谶-event-translate-nirvana
  - key: climax
    name: 译大方等大云经阐常住
    labels:
      zh: 译大云经
    start_date: 0428
    highlight_event_id: guji-昙无谶-event-translate-dayun
  - key: closure
    name: 西行求经遇害
    labels:
      zh: 西行遇害
    start_date: '0433'
    highlight_event_id: guji-昙无谶-event-death
  decisions:
  - date: '0420'
    title_zh: 应请入姑臧译场
    rationale: 为使大乘方等广行汉地，依沮渠蒙逊护法之请定居姑臧，聚徒立译以续慧命
  - date: '0421'
    title_zh: 先译涅槃后译大云
    rationale: 以涅槃佛性常住为纲，继以大云经广显如来常乐我净，破无常无我邪执
  - date: '0433'
    title_zh: 再度西行求遗典
    rationale: 以汉地所传未备，欲赴西域求大涅槃后分等梵本，虽知王忌犹行
events:
- id: guji-昙无谶-event-birth
  title_zh: 中天竺婆罗门家出生
  date: 0385
  year_of: 0385
  description: 约385年生于中天竺婆罗门族，少聪慧精婆罗门咒术及医方
  location_zh: 中天竺
- id: guji-昙无谶-event-study-spell
  title_zh: 少习咒术名动天竺
  date: 0395
  year_of: 0395
  description: 少年师事咒术师，善大自在天咒，能役使鬼神，渐生憍慢
  location_zh: 中天竺
- id: guji-昙无谶-event-convert-mahayana
  title_zh: 遇白头师转依大乘
  date: '0405'
  year_of: '0405'
  description: 因咒术失灵受白头婆罗门诃斥，授以树皮写大乘空经，遂皈佛门受具足戒
  location_zh: 中天竺
- id: guji-昙无谶-event-kashmir-study
  title_zh: 游罽宾广学方等
  date: '0410'
  year_of: '0410'
  description: 赴罽宾从达摩耶舍等学大小乘经论，尤精大般涅槃及方等般若
  location_zh: 罽宾
- id: guji-昙无谶-event-preach-shanshan
  title_zh: 鄯善龟兹弘化
  date: '0415'
  year_of: '0415'
  description: 西出葱岭至鄯善、龟兹、敦煌一带弘传大乘，为河西僧众所重
  location_zh: 鄯善
- id: guji-昙无谶-event-arrive-guzang
  title_zh: 入姑臧受沮渠蒙逊迎供
  date: '0420'
  year_of: '0420'
  description: 北凉王沮渠蒙逊遣使迎入都城姑臧，尊为国师，置译场于内苑
  location_zh: 姑臧
- id: guji-昙无谶-event-translate-nirvana
  title_zh: 译出大般涅槃经
  date: '0421'
  year_of: '0421'
  description: 于姑臧译出大般涅槃经四十卷，首倡一切众生悉有佛性、如来常住之旨
  location_zh: 姑臧
- id: guji-昙无谶-event-translate-dayun
  title_zh: 译大方等大云经
  date: 0428
  year_of: 0428
  description: 于姑臧译出大方等大云经四卷、大方等无想经等，题署北凉天竺三藏昙无谶译，会中具六万菩萨八部大众问答常住义
  location_zh: 姑臧
- id: guji-昙无谶-event-death
  title_zh: 西行求法途中遇害
  date: '0433'
  year_of: '0433'
  description: 沮渠蒙逊惧其西入魏，遣刺客于路杀之于姑臧西郊，年四十九，时人惜为译经殉法
  location_zh: 河西姑臧西道
