  - key: climax
    name: 王臣信受
    labels:
      zh: 高潮
    start_date: '0422'
    highlight_event_id: guji-昙无谶-event-preach-jinguang
  - key: closure
    name: 法本长传
    labels:
      zh: 收束
    start_date: '0430'
    highlight_event_id: guji-昙无谶-event-preach-jinguang
  decisions:
  - date: '0420'
    title_zh: 以金鼓忏悔为方便
    rationale: 众生业重怖畏，须以至心忏悔、赞佛功德令罪灭福生，易行易持
  - date: '0422'
    title_zh: 劝王臣受持护国
    rationale: 经言四天王护持持经者，劝王以正法治国、以法护国
events:
- id: guji-昙无谶-event-birth
  title_zh: 生于中印度
  date: 0385
  year_of: 0385
  description: 约385年生于中印度，少习小乘后转学大乘，师事白头禅师等，精通咒术医方
  location: 中印度
- id: guji-昙无谶-event-arrive-guzang
  title_zh: 至敦煌姑臧建译场
  date: '0412'
  year_of: '0412'
  description: 经理罽宾、鄯善至敦煌，复应沮渠蒙逊之请入姑臧，尊为国师，始立译场聚梵本
  location: 姑臧
- id: guji-昙无谶-event-translate-niepan
  title_zh: 译大般涅槃经
  date: '0417'
  year_of: '0417'
  description: 在姑臧译出大般涅槃经四十卷，阐佛性常住，为河西大乘奠基
  location: 姑臧译场
- id: guji-昙无谶-event-translate-jinguang
  title_zh: 译金光明经四卷
  date: 0419
  year_of: 0419
  description: 译金光明经四卷，序品、寿量、忏悔、赞叹等品具足，宣四佛护持、金鼓忏悔法门
  location: 姑臧译场
- id: guji-昙无谶-event-preach-jinguang
  title_zh: 宣讲金光明护国忏法
  date: '0422'
  year_of: '0422'
  description: 为沮渠蒙逊及王臣宣讲金光明经，劝受持读诵、忏除业障，以护国息灾
  location: 姑臧王宫
- id: guji-昙无谶-event-death
  title_zh: 示寂于姑臧
  date: '0433'
  year_of: '0433'
  description: 北凉承和七年因谶记见忌，为沮渠蒙逊所害，春秋四十九，一说被毒害而终，译业遂憾
  location: 姑臧
