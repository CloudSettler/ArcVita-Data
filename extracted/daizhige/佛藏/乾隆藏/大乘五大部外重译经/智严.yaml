person:
  qid: guji-智严
  name_zh: 智严
  names:
    zh: 智严
    en: Zhiyan
  lifespan:
    birth:
      date: '0355-01-01'
      precision: year
      is_circa: true
      raw: 约晋穆帝永和末年生于凉州
    death:
      date: '0427-01-01'
      precision: year
      is_circa: true
      raw: 约宋文帝元嘉四年卒
  birth_date: '0355-01-01'
  death_date: '0427-01-01'
  era: 刘宋
  reign_ref: 元嘉
  archetype: 译经高僧
  dilemmas:
  - 西行求法路远艰险与中土弘法机缘难得之间的取舍
  - 梵本义理深广与华言简质之间如何不失真义的权衡
  lesson: 不以夷夏为隔，不以艰远为惧，广博严净之法本为不退转故，当以信行载负而东
  summary_first_person: 吾凉州沙门智严也，少慕大乘，慨然西行求法，历罽宾于阗得梵本，归与宝云共译广博严净不退转轮经，冀以一乘广博之旨开五浊众生之怯劣，使知三乘方便本归不退转轮。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%B9%BF%E5%8D%9A%E4%B8%A5%E5%87%80%E4%B8%8D%E9%80%80%E8%BD%AC%E8%BD%AE%E7%BB%8F.md
endeavors:
- id: guji-智严-endeavor-1
  title_zh: 西域求法取经行
  summary_zh: 东晋末发心西行，遍历河西、西域、罽宾，寻访大乘梵本，历十余年携经东归，为后译广博严净诸经奠基。
  phases:
  - key: brewing
    name: 发心西迈
    labels:
      zh: 酝酿
    start_date: '0395-01-01'
    highlight_event_id: guji-智严-event-westward
  - key: breakthrough
    name: 罽宾得法
    labels:
      zh: 突破
    start_date: '0402-01-01'
    highlight_event_id: guji-智严-event-kashmir
  - key: climax
    name: 于阗获本
    labels:
      zh: 高潮
    start_date: '0408-01-01'
    highlight_event_id: guji-智严-event-khotan
  - key: closure
    name: 负经东归
    labels:
      zh: 收束
    start_date: '0420-01-01'
    highlight_event_id: guji-智严-event-return
  decisions:
  - date: '0397-01-01'
    title_zh: 决意出关西行
    rationale: 见中土经本多阙，欲亲往天竺求广博大乘完本，虽河西纷乱亦不改志
  - date: '0408-06-01'
    title_zh: 择取广博严净等不退转系梵本
    rationale: 此系经明一乘平等、三乘方便，能破小乘怯弱，最契五浊时众之机
- id: guji-智严-endeavor-2
  title_zh: 共译广博严净不退转轮经
  summary_zh: 刘宋元嘉初与宝云同在扬州、建康译场，共译广博严净不退转轮经四卷，宣明诸佛皆说不退转轮、三乘同归一乘之旨。
  phases:
  - key: brewing
    name: 建康筹译
    labels:
      zh: 酝酿
    start_date: '0425-01-01'
    highlight_event_id: guji-智严-event-prepare
  - key: breakthrough
    name: 对梵正义
    labels:
      zh: 突破
    start_date: '0426-03-01'
    highlight_event_id: guji-智严-event-translate
  - key: climax
    name: 四卷勘成
    labels:
      zh: 高潮
    start_date: '0426-10-01'
    highlight_event_id: guji-智严-event-complete
  - key: closure
    name: 流通授学
    labels:
      zh: 收束
    start_date: '0427-01-01'
    highlight_event_id: guji-智严-event-circulate
  decisions:
  - date: '0426-04-01'
    title_zh: 以宝云共译互参华梵
    rationale: 宝云亦西行得梵语精通，二人共证可免讹舛，使广博严净深义不失
  - date: '0426-08-01'
    title_zh: 存三乘名相而显一乘实义
    rationale: 随顺五浊众生乐小之宜，不废声闻辟支佛名，终归平等不退转轮，以方便引真实
events:
- id: guji-智严-event-birth
  date: '0355-01-01'
  precision: year
  is_circa: true
  title_zh: 生于凉州
  description_zh: 智严生于凉州，地近西域，自幼出家，慕大乘广博之风。
  year_of: '0355'
- id: guji-智严-event-westward
  date: '0397-01-01'
  precision: year
  is_circa: true
  title_zh: 发足西行
  description_zh: 自凉州发心西行，越流沙，经鄯善、焉耆，往罽宾求法。
  year_of: 0397
- id: guji-智严-event-kashmir
  date: '0402-01-01'
  precision: year
  is_circa: true
  title_zh: 留学罽宾
  description_zh: 止罽宾数年，师事大乘论师，习广博严净等不退转系经典梵本及宣说因缘。
  year_of: '0402'
- id: guji-智严-event-khotan
  date: '0408-01-01'
  precision: year
  is_circa: true
  title_zh: 于阗得梵本
  description_zh: 至于阗获广博严净不退转轮经梵夹及他大乘经论，誓负归中土。
  year_of: 0408
- id: guji-智严-event-return
  date: '0420-01-01'
  precision: year
  is_circa: true
  title_zh: 携经东归建康
  description_zh: 经西域南道东还，至建康，蒙宋文帝敬重，入译场筹译。
  year_of: '0420'
- id: guji-智严-event-prepare
  date: '0425-01-01'
  precision: year
  is_circa: true
  title_zh: 筹设译场
  description_zh: 与宝云议定译事，于扬州、建康设场，召义学沙门参译校勘。
  year_of: '0425'
- id: guji-智严-event-translate
  date: '0426-04-15'
  precision: day
  is_circa: false
  title_zh: 开译广博严净不退转轮经
  description_zh: 刘宋元嘉三年，智严共宝云执梵本口宣，众笔受，译广博严净不退转轮经，初卷明文殊师利游十方佛土请法之瑞。
  year_of: '0426'
- id: guji-智严-event-complete
  date: '0426-12-01'
  precision: month
  is_circa: true
  title_zh: 四卷译成
  description_zh: 经凡四卷译讫，备载华光开敷遍身如来等十方佛皆说广博严净不退转轮、三乘平等归一乘之义。
  year_of: '0426'
- id: guji-智严-event-circulate
  date: '0427-01-01'
  precision: year
  is_circa: true
  title_zh: 流通讲授
  description_zh: 经本流通，智严于建康为众讲宣不退转轮法，破坚信坚法等小果执着，劝发一乘。
  year_of: '0427'
- id: guji-智严-event-death
  date: '0427-06-01'
  precision: year
  is_circa: true
  title_zh: 示寂
  description_zh: 译事甫竟，智严示寂，时年约七十余，后人列其名于经首智严共宝云译。
  year_of: '0427'
