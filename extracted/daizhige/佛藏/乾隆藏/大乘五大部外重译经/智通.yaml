  - key: climax
    name: 教授坛场护摩
    labels:
      zh: 授坛法
    start_date: 0690
    highlight_event_id: guji-智通-event-homa
  - key: closure
    name: 示现持验
    labels:
      zh: 示持验
    start_date: 0695
    highlight_event_id: guji-智通-event-homa
  decisions:
  - date: 0686
    title_zh: 明千转印同心印别身足威仪
    rationale: 印相虽同而丁字立身弩跨向左别行，令学人易辨正用，每月十五净室作法增胜
  - date: 0690
    title_zh: 定十六肘四重八重五色开门坛制
    rationale: 依梵本立规院五方色与灯箭水罐，具庄严以摄心，助诵满十万遍面见观音之验
