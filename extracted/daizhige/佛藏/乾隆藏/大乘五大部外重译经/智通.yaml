  - key: closure
    name: 进呈流通
    labels:
      zh: 进呈
    start_date: 0685
    highlight_event_id: guji-智通-event-translate-complete
  decisions:
  - date: 0683
    title_zh: 逐句加注反切与声调以存梵音
    rationale: 陀罗尼重音韵，注上声平声及反切可免讹误，令后人如法持诵速得感应
  - date: 0684
    title_zh: 并载坛场灯箭供养仪轨
    rationale: 非唯译咒，更详四重坛法香花饮食等缘起，令行者具足资粮如法修持灭障
- id: guji-智通-endeavor-2
  title_zh: 会通弘传千转印与观音法要
  summary_zh: 会合阿地多崛多所传心印与总持寺坛法，教授净室斋戒诵持及护摩火供之行
  phases:
  - key: brewing
    name: 会通二师印法
    labels:
      zh: 会印法
    start_date: 0685
