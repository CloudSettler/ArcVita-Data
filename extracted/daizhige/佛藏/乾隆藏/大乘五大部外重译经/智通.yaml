  - key: breakthrough
    name: 发心翻译随心王咒
    labels:
      zh: 发译
    start_date: '0660'
    highlight_event_id: guji-智通-event-translate
  - key: climax
    name: 译成一卷阐明持验
    labels:
      zh: 译成
    start_date: '0665'
    highlight_event_id: guji-智通-event-translate
  - key: closure
    name: 定三十万遍行法流通
    labels:
      zh: 流通
    start_date: '0670'
    highlight_event_id: guji-智通-event-ritual
  decisions:
  - date: '0660'
    title_zh: 以律仪慈心为持咒本
    rationale: 依经洗浴着净衣受律仪住慈心除贪吝之教，立行者先净身口意方堪持明
  - date: '0665'
    title_zh: 详译咒句并注音切
    rationale: 为令汉地四众得正确梵音持诵，于咒句下标上声二合引等切注保留梵汉对音
- id: guji-智通-endeavor-2
  title_zh: 四十八印契坛法集整
  summary_zh: 集总摄身印至总摄印等四十八印契及疗病坛法、祈愿水坛法，兼明灌顶保密传承之规
  phases:
  - key: brewing
    name: 承玄奘总摄印法
    labels:
      zh: 承受
    start_date: '0650'
    highlight_event_id: guji-智通-event-xuanzang
  - key: breakthrough
    name: 编次四十八印真言
    labels:
      zh: 编印
    start_date: '0665'
    highlight_event_id: guji-智通-event-ritual
  - key: climax
    name: 制疗病坛与随心水坛仪
    labels:
      zh: 制坛
    start_date: '0670'
    highlight_event_id: guji-智通-event-ritual
  - key: closure
    name: 立非灌顶不传之制
    labels:
      zh: 立制
    start_date: '0675'
    highlight_event_id: guji-智通-event-ritual
  decisions:
  - date: '0670'
    title_zh: 以印契配本咒分阶教授
    rationale: 将护身召请结界等世间事业印与见佛生净土等出世印次第编列，使行者随愿次第修学
  - date: '0675'
    title_zh: 严定同心善知识方传
    rationale: 以破法印降魔印等威力甚大，非心行同大善知识及未入灌顶曼荼罗者不传，防非人殃身谤法
