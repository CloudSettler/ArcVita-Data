endeavors:
- id: guji-智通-endeavor-1
  title_zh: 奉诏译千转陀罗尼经
  summary_zh: 奉敕于总持寺据梵本译出千转陀罗尼观世音菩萨咒经一卷，校定三十二句咒语并记录持验功德
