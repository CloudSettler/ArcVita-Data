    highlight_event_id: guji-月光童子-event-praise
  decisions:
  - date: -0500-01-13
    title_zh: 随父出迎归命世尊
    rationale: 见佛顶现香云莲华、地成金色、火坑化池之威神，知佛豫知申日无数劫前事而慈愍不舍，遂与眷属俱出迎佛稽首忏悔
  - date: -0500-01-14
    title_zh: 叹佛金刚助显正法
    rationale: 于申日得不退转、升空赞佛之会，随喜宣说佛如金山破冥、降伏邪道之德，令大会无量众生得福得度
events:
- id: guji-月光童子-event-birth
  title_zh: 诞生王舍城申日长者家
  date: '-0516'
  year_of: '-0516'
  place: 王舍城申日长者宅
  description: 申日长者之子，天姿挺特，十六岁时博通群籍贯综神摸，天文地理靡不照焉，高名动世群儒师仰
- id: guji-月光童子-event-advise-1
  title_zh: 初谏父陈魔王攻佛自伏
  date: -0500-01-11
  year_of: '-0500'
  place: 王舍城申日宅
  description: 闻父与六师谋掘火坑置毒饭害佛，月光谏言佛为大圣三界之尊，昔坐元吉树下魔王率亿万鬼兵变化攻伐，以慈心力一指皆伏，须弥之毒大千刹火不能动佛一毛，蚊虻撼山徒自毁碎
- id: guji-月光童子-event-advise-2
  title_zh: 再谏不悟佛默然受请
  date: -0500-01-12
  year_of: '-0500'
  place: 王舍城申日宅至灵鹫山
  description: 申日执迷以佛受请为无远虑，遣使请佛，世尊愍其狂愚默然受请，放大光明照彻三十三天至十八地狱，令月光坚信佛有三达六通豫知火坑之事
- id: guji-月光童子-event-miracle
  title_zh: 亲睹火坑化七宝浴池
  date: -0500-01-13
  year_of: '-0500'
  place: 王舍城申日宅中门外
  description: 佛与菩萨罗汉梵释天众俱至，佛以神德化五丈六尺火坑为七宝紫绀浴池、八味水金沙莲华、池边宝树璎珞风鸣说法，毒饭化为甘露，申日见之衣毛起竖怖悔，六师惭窜
- id: guji-月光童子-event-praise
  title_zh: 随父归佛赞叹金刚
  date: -0500-01-14
  year_of: '-0500'
  place: 王舍城申日宅正殿
  description: 申日率子月光夫人眷属稽首忏悔，佛说定光授记及申日当来作佛因缘，开演八解四谛六度，申日于座得不退转踊身升空百四十丈赞佛金刚勇猛，月光同喜护法，会上无量众生得度，天地震动华乐自鸣
- id: guji-月光童子-event-death
  title_zh: 随佛修行功圆示寂
  date: '-0436'
  year_of: '-0436'
  place: 王舍城
  description: 经未载卒年，后世传其随佛修行护持正法，于佛涅槃前后示寂，归于法性
