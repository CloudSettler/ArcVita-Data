    title_zh: 引魔王败亡喻谏父
    rationale: 以第六天魔率亿万鬼兵变形吐火攻道场反被慈力伏化为弟子之事，证佛金刚不坏，火坑毒饭如蚊虻撼山必自毁
  - date: -0500-01-12
    title_zh: 劝父归命三尊早悔
    rationale: 陈佛具三达六通四等慈悲过慈母，刀剑大火不能伤一毛，逆害唯增地狱长夜之苦，唯首过归佛可令重罪轻受
- id: guji-月光童子-endeavor-2
  title_zh: 护法显正化导群邪
  description: 随佛受请亲睹火坑化为七宝浴池之神变，佐助世尊感动十方、降伏六师及九十六种外道，令王舍城众生同归正法
  phases:
