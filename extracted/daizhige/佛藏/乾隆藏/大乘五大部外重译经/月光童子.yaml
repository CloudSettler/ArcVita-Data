person:
  qid: guji-月光童子
  name_zh: 月光童子
  names:
    zh: 月光童子
    en: Moonlight Prince
  lifespan:
    birth:
      date: '-0516'
      precision: year
      is_circa: true
      raw: 约公元前516年，王舍城申日长者之子，年十六见于经
    death:
      date: '-0436'
      precision: year
      is_circa: true
      raw: 卒年不详，约佛涅槃前后，随佛修行而终
  birth_date: '-0516'
  death_date: '-0436'
  era: 古印度摩揭陀国列国时代
  reign_ref: 释迦牟尼佛住王舍城灵鹫山说法时
  archetype: 慈智谏亲的菩萨童子
  dilemmas:
  - 父受不兰迦叶等六师蛊惑欲以火坑毒饭谋害世尊，尽孝与护法如何两全
  - 六师谤佛势盛国人信邪，以十六岁童子孤言如何挽回正信破邪显正
  lesson: 以慈悲智慧诚谏化亲，不以忿争对抗；深信佛身金刚不坏、因果不虚，早悔归命则重罪可轻
  summary_first_person: 我乃王舍城申日长者之子月光，年方十六，博通群籍天文地理。见父受六师煽动于门中掘五丈六尺火坑、置毒于饭欲害世尊，我引昔日第六天魔率亿万鬼兵攻元吉树下菩萨反被慈力降伏为喻，涕泣苦谏父当改悔归命三尊；父迷不悟，世尊以神力化火坑为七宝浴池、毒饭为甘露，父遂怖悔得度，我亦亲睹如来不可思议之威神与慈愍。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%9C%88%E5%85%89%E7%AB%A5%E5%AD%90%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%9C%88%E5%85%89%E7%AB%A5%E5%AD%90%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0534
