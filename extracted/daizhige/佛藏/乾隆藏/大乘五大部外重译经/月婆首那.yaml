    title_zh: 舍国位出家求法
    rationale: 了知王位乐如幻，唯有求无上菩提能度众生，故弃国从师
  - date: '0520'
    title_zh: 择梁为弘法译经之地
    rationale: 梁武帝崇佛、建康译场鼎盛，得王室护持可使深经久住
