  birth_date: 0485
  death_date: '0555'
  era: 梁
  reign_ref: 梁武帝
  archetype: 译经僧
  dilemmas:
  - 忠于梵本实际无得深义与令中土学者易晓不惊怖之间的取舍
  - 优禅尼王子尊荣与沙门译场清苦无名之间的取舍
  lesson: 实际无际无得无证，译经弘法当以无所得为方便，令众生于惊怖处不惊怖
  summary_first_person: 吾本优禅尼国王子，舍王位而求法，入梁译出大乘顶王经，欲以善思惟童子与佛问答所显实际无际之旨，令众生于无法可得中见菩提
  source_urls:
