  decisions:
  - date: '0530'
    title_zh: 采用偈颂直译兼义解的译法
    rationale: 经中多以偈颂论实际无际，若纯直译则晦涩，须兼顾汉地诵持与义理显明
  - date: '0535'
    title_zh: 完整保留实际法门问答结构
    rationale: 善思惟童子与佛层层问答方显无际无得，删略则失甚深缘起，故全存论辩脉络
- id: guji-月婆首那-endeavor-2
  title_zh: 王子出家与大乘弘传
  description: 舍优禅尼国王子位，西行求法，东来梁地弘传般若空宗，令大乘深经在中土生根
  phases:
