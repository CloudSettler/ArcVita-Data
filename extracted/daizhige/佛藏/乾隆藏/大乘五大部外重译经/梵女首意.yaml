person:
  qid: guji-梵女首意
  name_zh: 梵女首意
  names:
    zh: 梵女首意
    en: Shouyi Brahmana Girl
  lifespan:
    birth:
      date: -0590-01-01
      precision: year
      is_circa: true
      raw: 波罗奈梵志女，释迦游鹿苑转法轮时
    death:
      date: 3000-01-01
      precision: year
      is_circa: true
      raw: 授记未来宝明劫成宝光如来，寿一劫后入无余涅槃
  birth_date: -0590-01-01
  death_date: 3000-01-01
  era: 古印度列国时代
  reign_ref: 释迦牟尼佛住世波罗奈鹿苑转法轮时
  archetype: 辩智求法女菩萨
  dilemmas:
  - 法为有内外住灭形相可得，还是本净如幻无所得
  - 即身以女身直了空义，还是历劫广植德本渐成正觉
  lesson: 诸法本净如幻无内无外，虽无生无得仍当以广大德本发愿转空法轮而度众生
  summary_first_person: 吾本波罗奈梵志之女，见佛身相端严寂定，迎请入舍问十二因缘法轮何谓。蒙佛教以痴灭则行识名色皆灭，复以幻士化人之喻示无明无内无外无起无灭，吾乃了达空轮不可思议，散栴檀华香发愿转无量无获无生灭度之轮，蒙佛授记当来宝明劫成宝光如来。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%A2%B5%E5%A5%B3%E9%A6%96%E6%84%8F%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%A2%B5%E5%A5%B3%E9%A6%96%E6%84%8F%E7%BB%8F.html
endeavors:
- id: guji-梵女首意-endeavor-1
  title_zh: 波罗奈舍中问法证空轮
  description: 于波罗奈鹿苑佛入城乞食时迎佛入梵志舍，逐层请问十二因缘法轮与明无明空义，以幻化为喻证法本净无所得，并散香发愿转空无法轮。
  phases:
  - key: brewing
    name: 见佛生信设座请入
    labels:
      zh: 遥见佛身相好清净设座稽首请屈
    start_date: -0535-06-01
    highlight_event_id: guji-梵女首意-event-meet
  - key: breakthrough
    name: 请问十二因缘法轮
    labels:
      zh: 从有我终始问痴缘行至老死集灭
    start_date: -0535-06-15
    highlight_event_id: guji-梵女首意-event-dialog
  - key: climax
    name: 以幻喻了达无明空性
    labels:
      zh: 七问幻化内外去来起灭形相皆答不也
    start_date: -0535-06-15
    highlight_event_id: guji-梵女首意-event-illusion
  - key: closure
    name: 散香发愿转空无轮
    labels:
      zh: 栴檀华香供佛誓转不可思议灭度之轮
    start_date: -0535-06-15
    highlight_event_id: guji-梵女首意-event-vow
  decisions:
  - date: -0535-06-01
    title_zh: 迎佛入舍决心闻法
    rationale: 见佛威神寂定如宝山月日，心踊跃不以女身为碍，主动设座稽首请入以求法轮义趣
  - date: -0535-06-15
    title_zh: 直认幻化无所得而发大愿
    rationale: 了达幻士所化无内无外无起灭，遂不执明暗形相，转以此空慧发愿拥护众生转空无之轮
- id: guji-梵女首意-endeavor-2
  title_zh: 历事七佛广植德本授记宝光
  description: 自惟卫佛初发道意历事式佛随叶拘楼拘那含牟尼迦叶至释迦，累劫供养出家梵行护持正法，今蒙授记寿终转女身供养六万佛后于宝明劫成宝光如来。
  phases:
  - key: brewing
    name: 惟卫佛初发道意
    labels:
      zh: 以女人身散宝珠璎初愿无上正真道
    start_date: -0900-01-01
    highlight_event_id: guji-梵女首意-event-past1
  - key: breakthrough
    name: 历事五佛净修梵行
    labels:
      zh: 式佛脱衣出家千岁随叶十五日供养拘楼珠香拘那含香涂塔
    start_date: -0800-01-01
    highlight_event_id: guji-梵女首意-event-past2
  - key: climax
    name: 今世供养释迦蒙五色光授记
    labels:
      zh: 散栴檀华香佛口五色光绕三匝授记成佛
    start_date: -0535-06-15
    highlight_event_id: guji-梵女首意-event-prophecy
  - key: closure
    name: 未来宝明劫成宝光如来
    labels:
      zh: 八十四亿劫不堕恶趣供养六万佛后成最正觉寿一劫度无量众
    start_date: 3000-01-01
    highlight_event_id: guji-梵女首意-event-buddhahood
  decisions:
  - date: -0800-01-01
    title_zh: 式佛时离家为沙门满千岁
    rationale: 怀笃信舍家之信，具满千岁净修梵行数数讲问深奥妙法不舍道意
  - date: -0535-06-15
    title_zh: 今世以小香散佛誓成正觉度生
    rationale: 不求现乐，以此微小德本回向拥护众生降伏爱欲转空法轮，感得授记
events:
- id: guji-梵女首意-event-birth
  title_zh: 生于波罗奈梵志家名首意
  date: -0590-01-01
  year_of: -0590
  precision: year
  is_circa: true
  raw: 梵志有女名曰首意
  description: 生于波罗奈大城梵志家中，为婆罗门女，释迦游鹿苑时在世。
- id: guji-梵女首意-event-meet
  title_zh: 鹿苑期佛入城遥见迎请入舍
  date: -0535-06-01
  year_of: -349
  precision: day
  is_circa: true
  raw: 遥见佛身端正殊妙威神巍巍，住于门外，心怀踊跃回入设座稽首请屈
  description: 佛与五百比丘无数菩萨游波罗奈鹿苑，晨持钵入城次至梵志门，首意见三十二相八十好如宝山日月，设座请佛入馆就座。
- id: guji-梵女首意-event-dialog
  title_zh: 请问何谓所转法轮十二因缘
  date: -0535-06-15
  year_of: -349
  precision: day
  is_circa: true
  raw: 何谓如来所转法轮，以十二事缘起之法而转法轮
  description: 首意问法轮所归，佛教从痴缘行、行缘识乃至生缘老死忧苦集，痴灭则一切灭，为沙门梵志天龙转此法轮。
- id: guji-梵女首意-event-illusion
  title_zh: 七问幻化喻显无明无所得
  date: -0535-06-15
  year_of: -349
  precision: day
  is_circa: true
  raw: 譬如幻士化作所化，岂有内外名住起灭形相见闻
  description: 首意连问法有内外、有住无明、有起灭、有形貌，佛以幻士化人七喻反问皆答不也，显无明无内无外不至后世无起灭无形像，因缘虽致众行而法本清净不知法。
- id: guji-梵女首意-event-vow
  title_zh: 散栴檀华香发愿转空无法轮
  date: -0535-06-15
  year_of: -349
  precision: day
  is_circa: true
  raw: 则以栴檀捣香及诸华香供养散佛，誓致拥护转空无轮无思议轮
  description: 了达所转为空轮不可思议不可称限无量无获无形无生灭度之轮，欢喜踊跃散香供佛发愿降伏诸根御制爱欲逮转此轮。
- id: guji-梵女首意-event-prophecy
  title_zh: 佛口五色光授记成佛
  date: -0535-06-15
  year_of: -349
  precision: day
  is_circa: true
  raw: 五色青黄赤白绿光从口而出绕身三匝从顶上入，授记当来成宝光如来
  description: 佛欣悦放光，阿难问故，佛言此女以德本寿终转女身，八十四亿劫不堕恶趣，供养六万佛出家讽诵护持正法供养舍利劝化无量众生。
- id: guji-梵女首意-event-past1
  title_zh: 惟卫佛时散宝珠璎初发道意
  date: -0900-01-01
  year_of: -0900
  precision: year
  is_circa: true
  raw: 斯女往昔惟卫佛时以女人身初发道意取宝珠璎用散佛上
  description: 首意过去于惟卫佛世以女身初发无上菩提心，以宝璎供佛为后世历劫行之始。
- id: guji-梵女首意-event-past2
  title_zh: 历事式随叶拘楼拘那含迦叶五佛
  date: -0800-01-01
  year_of: -0800
  precision: year
  is_circa: true
  raw: 式佛脱衣出家千岁随叶十五日供养拘楼珠香拘那含香涂塔二日供养见迦叶供养不舍道意
  description: 于式佛脱衣为沙门千岁讲问深法，随叶佛十五日备供，拘楼佛珠香供散，拘那含牟尼佛香涂塔终身四事供养二日大会，迦叶佛时奉事不舍道意至今世会释迦。
- id: guji-梵女首意-event-buddhahood
  title_zh: 授记宝明劫成宝光如来
  date: 3000-01-01
  year_of: 3000
  precision: year
  is_circa: true
  raw: 劫名宝明佛号宝光如来至真等正觉寿具足一劫后入无余泥洹
  description: 佛授记最于后世穷竟劫已于三千大千成最正觉，号宝光如来十号具足，寿一劫教化无量众生后入无余涅槃。
- id: guji-梵女首意-event-death
  title_zh: 寿终转女身后经劫入灭
  date: 3000-12-31
  year_of: 3000
  precision: year
  is_circa: true
  raw: 寿终之后当转女身至八十四亿劫不归恶趣，后成佛寿一劫于无余泥洹界取灭度
  description: 示现寿终转女身，历劫行菩萨道，成佛度生后方示现入无余涅槃，为此生传记之终。
