  location: 楞伽大城虚空
- id: guji-毗毗沙那-event-offering
  title_zh: 率众御空供养绕佛
  date: -0528-03-03
  year_of: -0528
  description: 应念出生妙华涂香幡盖音乐与眷属如鹅王行至佛所五体投地如斫树倒作长偈赞佛宿世施戒忍辱精进禅慧功德
  location: 大摩罗耶山顶摩诃园林
- id: guji-毗毗沙那-event-vow
  title_zh: 发无上菩提大愿得不退转
  date: -0528-03-04
  year_of: -0528
  description: 于佛法中明了无疑着菩提铠誓未来具无碍智三十二相度无量众生于阿耨多罗三藐三菩提得不退转
  location: 大摩罗耶山
- id: guji-毗毗沙那-event-question-karma
  title_zh: 问众生义及业因
  date: -0528-03-05
  year_of: -0528
  description: 问何名众生以何为本依何而住佛答众缘和合地水火风空识名色六入无明为本爱为住业为因业有身口意及净不净等三相
  location: 大摩罗耶山
- id: guji-毗毗沙那-event-question-bardo
  title_zh: 问舍身受身及神识相
  date: -0528-03-06
  year_of: -0528
  description: 问云何舍此身受彼身识停何处佛以种子生牙步屈虫喻明识无间相续及卵生中阴化生等并以香气喻明识无色无相无碍不可说非断
  location: 大摩罗耶山
- id: guji-毗毗沙那-event-metaphor-sea
  title_zh: 以海船喻问佛法诸要
  date: -0528-03-07
  year_of: -0528
  description: 问众生有为行海佛法比丘戒善知识八圣道禅定七菩提分破戒还俗等皆以大海船舶船师宝国喻之并问三十七道品三解脱及对治等法
  location: 大摩罗耶山
- id: guji-毗毗沙那-event-samadhi
  title_zh: 得无等等法光明三昧觉世谛如幻
  date: -0528-03-08
  year_of: -0528
  description: 佛说菩提无根无住无相等及世谛如幻如梦如水中月即得菩萨三昧名无等等法光明及一切巧音陀罗尼佛放顶光遍照无量刹土为目连说其供养功德后当供养百千亿佛于莲华城世界成佛
  location: 大摩罗耶山
- id: guji-毗毗沙那-event-death
  title_zh: 楞伽王示寂
  date: -0500-01-01
  year_of: -320
  description: 传为于楞伽示现终化后世以求法大愿受记未来莲华城世界成佛
  location: 楞伽
