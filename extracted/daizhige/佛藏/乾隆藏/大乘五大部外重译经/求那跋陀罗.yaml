  decisions:
  - date: '0435'
    title_zh: 应宋文帝请留建康译经
    rationale: 不贪安逸于南海，愿借京师檀越护持使梵本得广译
  - date: '0436'
    title_zh: 以直译存义定译例
    rationale: 恐华饰失真，故宁朴实存本义，令后学得见法性无著之旨
  - date: '0443'
    title_zh: 择祇洹寺立译场聚众参译
    rationale: 集义学沙门共同斟酌，以众智校梵汉，减少讹漏
