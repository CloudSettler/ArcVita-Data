    start_date: '0450'
    highlight_event_id: guji-求那跋陀罗-event-precepts-zen
  - key: closure
    name: 住持安众
    labels:
      zh: 安众
    start_date: '0460'
    highlight_event_id: guji-求那跋陀罗-event-abiding
  decisions:
  - date: '0437'
    title_zh: 不立门户广接声闻与菩萨众
    rationale: 欲破大小乘隔阂，示一切法皆是佛法，器虽有异法性一如
  - date: '0440'
    title_zh: 受请为宋文帝及太子授菩萨戒
    rationale: 以戒摄化令在位者以慈悲治国，护法久住
  - date: '0460'
    title_zh: 辞名利住丹阳建寺安众
    rationale: 世乱不移悲愿，愿以静处摄众修行，使法种不断
