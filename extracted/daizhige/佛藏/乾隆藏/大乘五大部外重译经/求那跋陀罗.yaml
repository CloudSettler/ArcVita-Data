person:
  qid: guji-求那跋陀罗
  name_zh: 求那跋陀罗
  names:
    zh: 求那跋陀罗
    en: Gunabhadra
  lifespan:
    birth:
      date: 0394
      precision: year
      is_circa: false
      raw: 394年中天竺生
    death:
      date: 0468
      precision: year
      is_circa: false
      raw: 468年建康示寂
  birth_date: 0394
  death_date: 0468
  era: 南北朝
  reign_ref: 刘宋元嘉
  archetype: 译经弘法高僧
  dilemmas:
  - 梵本精严与华言简易之间的取舍，如何令了义法不失真而可解
  - 隐山禅定自度与入世译场利他之间的进退，如何以译经为修行
  - 迎合帝王供养以广弘法与持戒离欲以守法体之间的持衡
  lesson: 翻译非直译文字，乃转续佛心了义，当以无作无人无取之智，离虚伪行而显法身
  summary_first_person: 吾本天竺婆罗门种，少学声明韦陀，后归佛法，泛海东来止于刘宋。蒙文帝礼遇，于祇洹瓦官译出楞伽、胜鬘、相续解脱等经，欲以如来法身化身之别、了义不了义之辨，开华土大乘正见。唯愿后学不着言相，了达无作之法，得无为常住身。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/相续解脱如来所作随顺处了义经.md
  - https://cbetaonline.dila.edu.tw/zh/T0679
endeavors:
- id: guji-求那跋陀罗-endeavor-1
  title_zh: 南朝译场开创与了义经群译传
  goal_zh: 于刘宋建康建立译场，系统译出大乘了义经论，奠定中土如来藏与唯识学译传基础
  phases:
  - key: brewing
    name: 天竺学成与发心东弘
    labels:
      zh: 婆罗门学与大乘兼通
    start_date: 0394
    highlight_event_id: guji-求那跋陀罗-event-birth
  - key: breakthrough
    name: 航海东来抵达岭南
    labels:
      zh: 元嘉十二年至广州
    start_date: '0435'
    highlight_event_id: guji-求那跋陀罗-event-arrival
  - key: climax
    name: 祇洹寺开译楞伽为先
    labels:
      zh: 建康译经高峰
    start_date: '0436'
    highlight_event_id: guji-求那跋陀罗-event-translation-start
  - key: closure
    name: 胜鬘了义诸经译竟流布
    labels:
      zh: 相续解脱等经成
    start_date: '0443'
    highlight_event_id: guji-求那跋陀罗-event-liaoyi
  decisions:
  - date: '0435'
    title_zh: 决计泛海东行而非留天竺弘化
    rationale: 见中土大乘根熟而无善本，愿以译经报佛恩，航海虽险而利他为大
  - date: '0436'
    title_zh: 选定建康祇洹寺为固定译场
    rationale: 依帝都檀越护持与僧众助译之便，立规制审定梵汉，免私译讹误
  - date: '0443'
    title_zh: 先译了义经以正视听
    rationale: 华土多执名相虚伪行，需以如来法身化身、修多罗毗尼摩德勒伽三分判教，明了义随顺处
- id: guji-求那跋陀罗-endeavor-2
  title_zh: 楞伽禅观与如来藏思想弘传
  goal_zh: 以楞伽阿跋多罗宝经为核心，传禅观法门，接引南朝士僧会通玄学与佛学
  phases:
  - key: brewing
    name: 师承禅数与楞伽深观
    labels:
      zh: 天竺习摩诃衍禅法
    start_date: '0410'
    highlight_event_id: guji-求那跋陀罗-event-study
  - key: breakthrough
    name: 华土初传楞伽四卷
    labels:
      zh: 楞伽宗之始
    start_date: '0436'
    highlight_event_id: guji-求那跋陀罗-event-translation-start
  - key: climax
    name: 授禅示观化导士庶
    labels:
      zh: 以楞伽印心
    start_date: '0445'
    highlight_event_id: guji-求那跋陀罗-event-zen-teaching
  - key: closure
    name: 遗风启达摩禅脉
    labels:
      zh: 后世称楞伽师
    start_date: 0468
    highlight_event_id: guji-求那跋陀罗-event-death
  decisions:
  - date: '0436'
    title_zh: 以楞伽经配禅观并弘
    rationale: 经中如来藏自性清净与渐修顿见相应，最契南朝贵禅风，便于摄众归真
  - date: '0455'
    title_zh: 辞让高官供养坚住律仪
    rationale: 恐名利染污译业与禅德，故以毗尼自持，安住下劣亦不违道迹，示法身无行而化不息
events:
- id: guji-求那跋陀罗-event-birth
  date: 0394
  title_zh: 中天竺婆罗门家生
  description_zh: 生于中天竺婆罗门家，少习韦陀声明，后出家学小乘三藏复通大乘，兼善禅法
  location_zh: 天竺中天竺
  year_of: 0394
- id: guji-求那跋陀罗-event-study
  date: '0415'
  title_zh: 天竺精研大小乘与禅观
  description_zh: 遍学阿毗昙、般若、华严及楞伽等经，修摩诃衍禅，深解法身离行而化身示现之理
  location_zh: 天竺
  year_of: '0415'
- id: guji-求那跋陀罗-event-arrival
  date: '0435'
  title_zh: 泛海抵广州谒宋文帝
  description_zh: 元嘉十二年乘舶至广州，刘宋文帝闻名遣使迎至建康，礼为国师，敕住祇洹寺
  location_zh: 广州及建康
  year_of: '0435'
- id: guji-求那跋陀罗-event-translation-start
  date: '0436'
  title_zh: 建康祇洹寺译楞伽阿跋多罗宝经四卷
  description_zh: 开译场于祇洹、瓦官等寺，首译楞伽，后续共译经五十余部七十余卷，华梵对校，僧众笔受
  location_zh: 建康祇洹寺
  year_of: '0436'
- id: guji-求那跋陀罗-event-liaoyi
  date: '0443'
  title_zh: 译相续解脱如来所作随顺处了义经一卷
  description_zh: 译出本经，即解深密经胜义谛相品等异译，明如来法身化身、修多罗毗尼摩德勒伽三藏判释，显了义随顺处，大振南朝了义学
  location_zh: 建康
  year_of: '0443'
- id: guji-求那跋陀罗-event-zen-teaching
  date: '0450'
  title_zh: 弘楞伽禅法并译胜鬘央掘魔罗等经
  description_zh: 续译胜鬘经、央掘魔罗经、杂阿含经等，以楞伽印禅，授学徒禅观，士大夫多从其学
  location_zh: 建康
  year_of: '0450'
- id: guji-求那跋陀罗-event-death
  date: 0468
  title_zh: 建康示寂
  description_zh: 年七十五示寂于建康，葬毕后学尊为南朝四大译师之一，楞伽禅脉由是东传
  location_zh: 建康
  year_of: 0468
