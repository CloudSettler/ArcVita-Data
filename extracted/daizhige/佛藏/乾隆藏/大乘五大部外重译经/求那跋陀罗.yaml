  lesson: 密咒非徒音声仗信愿行相应方能拔业往生译经非徒文字贵在以正法安众心
  summary_first_person: 吾求那跋陀罗中天竺人也少习韦陀博通三藏泛海东来越南海至广州蒙宋文帝迎礼建康奉诏译经凡数十部及元嘉末年重译拔一切业障根本得生净土神咒五十九字十五句传六时胡跪诵持之仪愿众生常得佛顶拥护现世安隐临终任运往生
