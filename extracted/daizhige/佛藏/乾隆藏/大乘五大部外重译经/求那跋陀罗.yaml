  name_zh: 求那跋陀罗
  names:
    zh: 求那跋陀罗
    en: Gunabhadra
  lifespan:
    birth:
      date: 0394
      precision: year
      is_circa: false
      raw: 中天竺 394年
    death:
      date: 0468
      precision: year
