      is_circa: true
      raw: 约晋义熙十年生于中天竺
    death:
      date: 0468
      precision: year
      is_circa: false
      raw: 刘宋泰始四年寂于建康
  birth_date: 0394
  death_date: 0468
  era: 刘宋
  reign_ref: 宋文帝元嘉
  archetype: 译经三藏
  dilemmas:
  - 梵汉悬隔文义难契而当存真义还是饰华文
  - 世乱译场难安而当远隐自保还是荷担译业住持法种
  lesson: 不著文字不舍文字，依筏喻而渡，令一味解脱普润众生
  summary_first_person: 吾自中天竺浮海东来至宋土，唯以译经为务，虽梵汉阻隔、世事扰攘，不敢辞劳，但愿宝箧法味流布中土，令众生同入无著无诤一味解脱
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/大方广宝箧经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/大方广宝箧经.html
  - https://tripitaka.cbeta.org/T0462
