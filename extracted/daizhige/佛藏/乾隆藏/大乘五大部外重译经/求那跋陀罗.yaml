  decisions:
  - date: '0436'
    title_zh: 择建康道场而居
    rationale: 京师学者众多，依朝廷护持可令译事不辍、禅学广被
  - date: '0445'
    title_zh: 兼译兼授不专一经
    rationale: 知眾生根器各异，故以胜鬘明佛性、楞伽明唯心、杂心明毘昙，令大小兼通
events:
- id: guji-求那跋陀罗-event-birth
  title_zh: 生于中天竺
  date: 0394
  year_of: 0394
  description: 求那跋陀罗生于中天竺婆罗门家，少通五明，初学小乘杂阿毘昙，后转大乘，精通楞伽、华严等了义经
- id: guji-求那跋陀罗-event-arrival
  title_zh: 泛海至广州
  date: '0435'
  year_of: '0435'
  description: 刘宋元嘉十二年，乘舶泛海南下抵广州，刺史与僧众遣使迎请，后被诏入建康祇洹寺
- id: guji-求那跋陀罗-event-translate-start
  title_zh: 于建康创开译场
  date: '0436'
  year_of: '0436'
  description: 居祇洹寺、瓦官寺开译场，先后译出杂阿毘昙心论、胜鬘狮子吼经等，名重京师
- id: guji-求那跋陀罗-event-lengqie
  title_zh: 译楞伽阿跋多罗宝经四卷
  date: '0443'
  year_of: '0443'
  description: 于建康译出楞伽阿跋多罗宝经四卷，以一切佛语心品为首，广明五法三自性八识二无我如来自觉境界，为后世禅宗所重
- id: guji-求那跋陀罗-event-teach
  title_zh: 弘禅授徒
  date: '0455'
  year_of: '0455'
  description: 于建康及荆州等地讲译兼弘禅观，士大夫与僧众问道者众，楞伽心要遂盛于南朝
- id: guji-求那跋陀罗-event-death
  title_zh: 示寂于建康
  date: 0468
  year_of: 0468
  description: 刘宋泰始四年示寂于建康，世寿七十五，译经凡百余卷，其楞伽译本与胜鬘等同为中土如来藏学要典
