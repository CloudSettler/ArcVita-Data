  birth_date: 0394
  death_date: 0468
  era: 南北朝
  reign_ref: 刘宋 元嘉
  archetype: 译经高僧
  dilemmas:
  - 梵本精严与华言通俗之间何以取舍以免失真
  - 乱世朝替与译场安定之间何以自处以全法业
  - 禅观实证与文字传译之间何以兼顾以不偏废
  lesson: 离文字分别而直观自心所现，借言说而显无言之宗，不著有无断常以入如来自觉圣智
  summary_first_person: 吾本中天竺人，少习杂阿含及大乘，承师命泛海东来，止于刘宋建康。见此土学人执名相而迷自心，遂以译经为方便，令眾得聞楞伽心法、了唯心所现、不生不灭之旨。虽华梵殊音、世事多艰，唯愿正法得住、学者自见其心。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/楞伽阿跋多罗宝经.md
  - https://cbetaonline.dila.edu.tw/zh/T0670
