    title_zh: 应请东渡
    rationale: 不惮海路艰险，承中土请法之诚，欲以大乘了义广布东土
  - date: '0443'
    title_zh: 定名楞伽阿跋多罗宝
    rationale: 依梵本 Lankaavatara 突出佛语心与自觉圣智，拣别小乘名相，令学人直入唯心现量
  - date: '0450'
    title_zh: 以口授笔受广开译场
    rationale: 恐梵义失真，故令弟子共参义笔，宁拙于文而求旨不谬
- id: guji-求那跋陀罗-endeavor-2
  title_zh: 译场与禅观并行
  summary: 兼译杂阿毘昙心论、胜鬘经等数十部，并以禅法教授南朝士庶，开刘宋译经与禅学之风
