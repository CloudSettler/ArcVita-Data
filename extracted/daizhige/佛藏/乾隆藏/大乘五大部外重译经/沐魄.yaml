person:
  qid: guji-沐魄
  name_zh: 沐魄
  names:
    zh: 沐魄
    en: Mupo
  lifespan:
    birth:
      date: '-1000'
      precision: year
      is_circa: true
      raw: 婆罗奈王太子，生有无穷之明，端正妙洁
    death:
      date: -0940
      precision: year
      is_circa: true
      raw: 入山求道思惟禅定，寿终生兜率天
  birth_date: '-1000'
  death_date: -0940
  era: 古印度列国时代
  reign_ref: 婆罗奈国
  archetype: 畏苦求道者
  dilemmas:
  - 缄默避恶与顺亲尽孝的两难
  - 安享王位与堕狱受苦的抉择
  - 随顺诳诈生埋与开口明志自救的抉择
  lesson: 畏地狱苦而摄口摄意，舍荣华而高翔远逝，守道不移方能自济度人
  summary_first_person: 吾昔为婆罗奈太子沐魄，前世为王行有缺漏堕地狱六万余岁，蒸煮剥裂痛不可言，故此生结舌不语十有三岁，目不视色耳不听音，虽被婆罗门诬为荧惑将危国灭宗，父王欲生埋于深坑，吾终于藏前举手开口明志，辞位入山禅定，寿终生兜率天，后下生为迦维罗卫太子而得成佛。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%A4%AA%E5%AD%90%E6%B2%90%E9%AD%84%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%A4%AA%E5%AD%90%E6%B2%90%E9%AD%84%E7%BB%8F.html
endeavors:
- id: guji-沐魄-endeavor-1
  title_zh: 缄默摄心以避恶业
  description: 以前世堕狱之记忆为鉴，十三年结舌不语，状如喑哑聋盲，虽遭厌弃与生埋之议亦不动摇，以守口摄意远离罪垢
  phases:
  - key: brewing
    name: 忆狱畏苦
    labels:
      zh: 前世堕狱
    start_date: '-1000'
    highlight_event_id: guji-沐魄-event-birth
  - key: breakthrough
    name: 立志缄默
    labels:
      zh: 结舌不语
    start_date: -0999
    highlight_event_id: guji-沐魄-event-silence
  - key: climax
    name: 被诬生埋
    labels:
      zh: 婆罗门诬陷
    start_date: -0988
    highlight_event_id: guji-沐魄-event-burial-plot
  - key: closure
    name: 藏前明志
    labels:
      zh: 开口自明
    start_date: -0987
    highlight_event_id: guji-沐魄-event-preach-at-pit
  decisions:
  - date: -0999
    title_zh: 决意结舌十三年
    rationale: 恐一语招祸复堕地狱，欲安身避害济神离苦，故目不视色耳不听音以摄心守道
  - date: -0988
    title_zh: 不辨荧惑之诬
    rationale: 知诳诈之言不可与争，若开口辩解则破戒招罪，宁守缄默以全道志
  - date: -0987
    title_zh: 藏前举手发言
    rationale: 见数千万人与飞鸟走兽皆塞藏户，因缘已至，若仍不语则枉被生埋且失度众机，故举手住众而说畏狱厌世之意
- id: guji-沐魄-endeavor-2
  title_zh: 舍国入山累劫成佛
  description: 得父王迎归后坚辞王位，弃国捐王入山求道思惟禅定，以此功德生兜率天，毕天寿后续作迦维罗卫太子终至成佛
  phases:
  - key: brewing
    name: 辞位固志
    labels:
      zh: 父王让国
    start_date: -0987
    highlight_event_id: guji-沐魄-event-preach-at-pit
  - key: breakthrough
    name: 弃国入山
    labels:
      zh: 入山求道
    start_date: -0987
    highlight_event_id: guji-沐魄-event-renounce
  - key: climax
    name: 禅定终寿
    labels:
      zh: 思惟禅定
    start_date: -0986
    highlight_event_id: guji-沐魄-event-meditation
  - key: closure
    name: 天上转生
    labels:
      zh: 生兜率天
    start_date: -0940
    highlight_event_id: guji-沐魄-event-death
  decisions:
  - date: -0987
    title_zh: 拒受王位让国
    rationale: 世间无常如梦，室家欢娱须臾，忧苦延长，若复为王必再造业堕狱，故愿高翔远逝自济于世
  - date: -0987
    title_zh: 入山禅定求道
    rationale: 欲除垢秽出尘埃之外不与罪会，唯有离俗入山思惟禅定方能究竟解脱
  - date: -0940
    title_zh: 以定力趣兜率
    rationale: 一生持戒摄心功成，寿终不求人间福报，愿生兜率天毕天寿再下生成佛度众
events:
- id: guji-沐魄-event-birth
  title_zh: 诞生于婆罗奈王宫
  date: '-1000'
  year_of: '-1000'
  description: 婆罗奈王得太子名沐魄，生有无穷之明，端正妙洁无有双比，父母奇而供养
  location_zh: 婆罗奈国王宫
- id: guji-沐魄-event-silence
  title_zh: 结舌不语十三年
  date: -0999
  year_of: -0999
  description: 太子恬惔质朴志若死灰意如枯木，目不视色耳不听音，状类喑哑聋盲，凡十有三岁不出一语
  location_zh: 婆罗奈国王宫
- id: guji-沐魄-event-burial-plot
  title_zh: 婆罗门议欲生埋
  date: -0988
  year_of: -0988
  description: 王召婆罗门相师，诬太子为荧惑内怀不祥将危国灭宗，群臣或议远徙深山或没深水，王从掘坑生埋之议，召兵三千掘藏备资粮五仆，夫人与五百夫人婇女大臣皆哀请留之不果
  location_zh: 婆罗奈国
- id: guji-沐魄-event-preach-at-pit
  title_zh: 藏前举手开口说法
  date: -0987
  year_of: -0987
  description: 太子乘四望象车赴藏，耆旧大臣宛转车前，数千万人与飞鸟走兽绕藏三匝塞户，太子举右手言所以不语者为厌畏地狱六万岁蒸煮剥裂之苦，音绝妙世所希闻，众皆叩头悔过，仆驰报王，王与夫人驾象车迎之，太子陈无常如梦辞让王位
  location_zh: 郊外深坑藏所
- id: guji-沐魄-event-renounce
  title_zh: 弃国入山求道
  date: -0987
  year_of: -0987
  description: 王知太子意坚志固遂听学道，太子弃国捐王入山求道思惟禅定，不复恋世荣华
  location_zh: 深山
- id: guji-沐魄-event-meditation
  title_zh: 山中禅定修行
  date: -0986
  year_of: -0986
  description: 入山之后专心禅定，念生若寄除忧去累，以期出于尘埃之外不与罪会
  location_zh: 深山
- id: guji-沐魄-event-death
  title_zh: 寿终生兜率天
  date: -0940
  year_of: -0940
  description: 太子于山中寿终，以持戒禅定功德即生兜率天上，毕天之寿后下生世间为迦维罗卫王太子而成佛，即今释迦牟尼，前身父为阅头檀，母为摩耶，五仆为阿若拘邻等，婆罗门为调达
  location_zh: 兜率天
