    start_date: -0509
    highlight_event_id: guji-犊子-event-buddhahood
  decisions:
  - date: -0530-06-01
    title_zh: 自食水草尽让乳分
    rationale: 己可食草饮水活命，佛值难遇，当舍己食以求无量福报与智慧
  - date: -0529
    title_zh: 死后供养持戒发愿
    rationale: 以悬缯幡盖散华烧香受持经戒延续愿力趣向无上道
events:
- id: guji-犊子-event-birth
  title_zh: 生为犊子
  date: '-0530'
  year_of: '-0530'
  location: 舍卫国城外婆罗门牛群
  description: 宿业未尽，生于富婆罗门家牛群中为犊子，与母牸牛同栏
- id: guji-犊子-event-karma
  title_zh: 宿因堕牛马十六劫
  date: '-0700'
  year_of: '-0700'
  location: 阎浮提
  description: 佛说其母子先世不信佛经随恶知识教，故堕牛马中经十六劫
- id: guji-犊子-event-hear-buddha
  title_zh: 犊闻佛名生信
  date: -0530-06-01
  year_of: '-0530'
  location: 舍卫国婆罗门牛群
  description: 阿难奉佛命乞乳，帝释化婆罗门取乳，犊在边立闻有佛名即生敬信
- id: guji-犊子-event-offer
  title_zh: 劝母尽乳供佛
  date: -0530-06-01
  year_of: '-0530'
  location: 舍卫国牛群
  description: 母言前两乳取去后两乳遗子，犊劝持己乳分尽与佛，自食草饮水足活，令阿难满器持还祇洹精舍
- id: guji-犊子-event-prophecy
  title_zh: 蒙佛授记乳光
  date: -0530-06-02
  year_of: '-0530'
  location: 舍卫国祇洹阿那邠迟阿蓝精舍
  description: 佛告阿难牛母子后世当为弥勒佛沙门弟子得大罗汉，犊子死后当为佛悬缯幡盖散华烧香受持经戒，二十劫后作佛名乳光如来
- id: guji-犊子-event-buddhahood
  title_zh: 未来成乳光如来
  date: -0509
  year_of: -0509
  location: 未来佛土
  description: 依佛授记经二十劫修行后当作佛号乳光如来度脱一切
- id: guji-犊子-event-death
  title_zh: 犊身命终
  date: -0529
  year_of: -0529
  location: 舍卫国
  description: 此期犊报命终，后世转生修供养持戒趣向解脱
