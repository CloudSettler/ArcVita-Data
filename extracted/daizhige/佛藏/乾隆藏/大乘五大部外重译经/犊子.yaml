    title_zh: 闻佛名即劝母尽施
    rationale: 自念十六劫畜身皆由不信，今难值大师，当舍己乳分供养以种菩提因
- id: guji-犊子-endeavor-2
  title_zh: 布施乳供与授记成佛
  description: 以己所食乳分满器供养释迦，获授记死后供养幡盖持戒，二十劫后作乳光如来
  phases:
  - key: brewing
