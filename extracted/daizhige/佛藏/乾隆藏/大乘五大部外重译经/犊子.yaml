  dilemmas:
  - title_zh: 惜身食抑或尽施供佛
    description: 母欲留后二乳养我，我当自食草水而尽以己分供养如来
  - title_zh: 安于畜命抑或闻名发愿
    description: 堕牛马十六劫，今闻佛名当发菩提求智慧成佛抑或随业流转
  lesson: 愚痴不信堕畜多劫，闻名生信布施得福，畜生亦可发愿成佛
  summary_first_person: 吾先世随恶知识不信佛经，堕牛马中经十六劫，今生为犊子于舍卫城外。闻阿难为佛乞乳，帝释化婆罗门取乳，吾在边闻佛名便生慈心，劝母尽以吾分乳供养如来，自食水草足活，愿后世得智慧如佛，蒙佛授记二十劫后当作乳光如来
