    rationale: 旧译咒体俱存梵语浑肴莫晰，为使受持者悟夷险殊径，于大慈恩寺弘法苑重敷译笔
  - date: '0645-03-01'
    title_zh: 辞官不受但求译经
    rationale: 太宗欲授官职固辞，奏请专心翻译以报佛恩国恩
