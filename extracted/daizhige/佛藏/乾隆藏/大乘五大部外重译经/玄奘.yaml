person:
  qid: guji-玄奘
  name_zh: 玄奘
  names:
    zh: 玄奘
    en: Xuanzang
  lifespan:
    birth:
      date: '0602'
      precision: year
      is_circa: true
      raw: 陈隋之际约仁寿二年生于洛州缑氏
    death:
      date: '0664-02-05'
      precision: day
      is_circa: false
      raw: 麟德元年二月五日寂于长安玉华宫
  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐
  reign_ref: 贞观
  archetype: 译师
  dilemmas:
  - 佛典传译多歧，众说纷纭，当依梵本正译显了义还是顺旧译以求流通
  - 西行求法九死一生，当安居讲习旧章还是冒艰越险以求真义
  - 奉诏译经事务繁重，当博译众经还是精译瑜伽唯识以立宗
  lesson: 离言胜义非寻思比度可得，唯依清净所缘一味真如，勤修止观方可断相缚粗重缚而证得
  summary_first_person: 吾本缑氏陈氏子，幼慕佛乘，睹诸师所传经论异说纷然，遂决意西行。越葱岭，历那烂陀，亲承戒贤，穷研瑜伽深密诸经。归奉太宗诏，居弘福慈恩玉华译场，一译此解深密经，显胜义谛离一异相、离言无二、遍一切一味之义，以正后学依有所得之增上慢。愿以此清净所缘，令有情息诤论而入圣智。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E8%A7%A3%E6%B7%B1%E5%AF%86%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E8%A7%A3%E6%B7%B1%E5%AF%86%E7%BB%8F.html
endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法穷研唯识
  description: 因疑旧译义乖，决意西逾雪岭，求瑜伽师地等真梵本，以证胜义谛离言之旨
  phases:
  - key: brewing
    name: 洛阳出家究学
    labels:
      zh: 览经疑义
    start_date: '0620'
    highlight_event_id: guji-玄奘-event-study
  - key: breakthrough
    name: 贞观西行
    labels:
      zh: 西逾葱岭
    start_date: '0629-08-01'
    highlight_event_id: guji-玄奘-event-departure
  - key: climax
    name: 那烂陀师事戒贤
    labels:
      zh: 亲承瑜伽
    start_date: '0631'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: closure
    name: 负笈东归
    labels:
      zh: 载经而还
    start_date: '0645-01-24'
    highlight_event_id: guji-玄奘-event-return
  decisions:
  - date: '0629-08-01'
    title_zh: 私度关西行求法
    rationale: 诸师章疏各执一端，胜义谛相不可依寻思决，需直证梵本，故不顾禁令西行
  - date: '0631'
    title_zh: 师事戒贤专攻瑜伽解深密
    rationale: 欲通一切法无我真如一味相，必先穷三时教相，解深密为明了了义之钥
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译场弘阐深密
  description: 归长安奉太宗高宗诏，设译场译解深密等经，以无相无分别之胜义重正中土经义
  phases:
  - key: brewing
    name: 弘福筹译
    labels:
      zh: 制译场例
    start_date: '0645-02-01'
    highlight_event_id: guji-玄奘-event-hongfu
  - key: breakthrough
    name: 初译解深密经
    labels:
      zh: 五卷成译
    start_date: '0646-09-01'
    highlight_event_id: guji-玄奘-event-translate-jieshenmi
  - key: climax
    name: 慈恩玉华广译
    labels:
      zh: 瑜伽大成
    start_date: 0648
    highlight_event_id: guji-玄奘-event-cien
  - key: closure
    name: 译业圆寂
    labels:
      zh: 付嘱门人
    start_date: '0664-01-01'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0646-09-01'
    title_zh: 首译解深密经五卷
    rationale: 此经具说胜义谛超寻思、遍一切一味及心意识阿赖耶缘起，能息诸行一异妄执，为后译瑜伽成唯识之基
  - date: 0648
    title_zh: 定新译名义与五不翻例
    rationale: 为令离言法性不堕遍计言辞，须正名相，存梵音义于真如阿陀那等，以示圣智内证
events:
- id: guji-玄奘-event-birth
  title_zh: 诞生洛州缑氏
  date: '0602'
  year_of: '0602'
  description: 陈慧之后，隋仁寿二年左右生于洛州缑氏，后出家洛阳净土寺
  place_zh: 洛州缑氏
- id: guji-玄奘-event-study
  title_zh: 入长安学摄论俱舍疑义
  date: '0620'
  year_of: '0620'
  description: 游历长安成都，咨质诸师，见摄论地论义舛，遂萌西行求决之志
  place_zh: 长安
- id: guji-玄奘-event-departure
  title_zh: 贞观三年私度玉门关西行
  date: '0629-08-01'
  year_of: 0629
  description: 贞观三年秋，冒禁西出凉州，经瓜州玉门，历大碛至伊吾高昌
  place_zh: 凉州玉门关
- id: guji-玄奘-event-nalanda
  title_zh: 抵那烂陀师事戒贤
  date: '0631'
  year_of: '0631'
  description: 至中印度那烂陀，礼百岁戒贤，学瑜伽师地论、解深密等，尽得唯识奥旨
  place_zh: 那烂陀寺
- id: guji-玄奘-event-return
  title_zh: 负经东归至长安
  date: '0645-01-24'
  year_of: '0645'
  description: 贞观十九年正月携梵本六百余部至长安，太宗遣房玄龄等郊劳，勅住弘福寺
  place_zh: 长安
- id: guji-玄奘-event-hongfu
  title_zh: 勅住弘福寺设译场
  date: '0645-02-01'
  year_of: '0645'
  description: 太宗勅以玄奘为译主，于弘福寺开译，经太宗作序，是为大唐三藏之始
  place_zh: 弘福寺
- id: guji-玄奘-event-translate-jieshenmi
  title_zh: 奉诏译解深密经五卷
  date: '0646-09-01'
  year_of: '0646'
  description: 于弘福寺译解深密经五卷，序品至心意识相品，具显胜义谛离一异、遍一味及阿赖耶瀑流等义
  place_zh: 弘福寺
- id: guji-玄奘-event-cien
  title_zh: 慈恩玉华续译瑜伽成唯识
  date: 0648
  year_of: 0648
  description: 迁慈恩寺、玉华宫，广译瑜伽师地论、大般若等，奠定法相唯识宗
  place_zh: 慈恩寺
- id: guji-玄奘-event-death
  title_zh: 寂于玉华宫
  date: '0664-02-05'
  year_of: '0664'
  description: 麟德元年二月五日于玉华宫嘉寿殿寂，年六十三，瘗白鹿原，高宗罢朝三日
  place_zh: 玉华宫
