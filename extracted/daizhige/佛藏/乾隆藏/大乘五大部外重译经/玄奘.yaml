  reign_ref: 唐太宗贞观至高宗麟德
  archetype: 译经高僧
  dilemmas:
  - 西行求法违禁出关与舍身求法之抉择
  - 旧译咒本梵语浑肴难晓与重译厘正利生之抉择
  - 帝王礼遇与专心译场不慕荣利之抉择
  lesson: 法不孤行必假翻译流通，愿行不空如罥索摄受有情
  summary_first_person: 吾幼慕法显，观诸师所论多乖梵本，遂冒禁西行遍历五印，于那烂陀受学十年方归。归唐蒙太宗、高宗资助，设译场于弘福、大慈恩、玉华，译出经论七十五部，显庆四年重译不空罥索神咒心经，正旧译阇那崛多译本之讹，令持咒者得二十胜利与八种临终善相，此生所愿惟在使正法流通不空。
