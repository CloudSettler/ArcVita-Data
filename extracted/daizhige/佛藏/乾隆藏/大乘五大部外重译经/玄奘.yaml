  birth_date: '0602-04-06'
  death_date: '0664-03-07'
  era: 唐朝
  reign_ref: 唐太宗贞观至高宗麟德
  archetype: 译经求法高僧
  dilemmas:
  - 坚守中土章疏旧译与远赴天竺求取梵本真经之抉择
  - 译场中直译梵义保真与意译汉文易解之平衡
  lesson: 西行求法不在猎奇而在参验真义，译经弘法当以信达雅正本清源，令三归五戒功德易知易行
  summary_first_person: 余姓陈名祎，洛州缑氏人也。少出家究穷经论，慨叹中土译义参差，故冒越葱岭远赴天竺，十七年遍历五印求法。归蒙太宗高宗诏住长安大慈恩寺，设译场译出大般若等经七十余部。此佛说最无比经者，显三归依福德最胜无比，乃至菩萨三聚净戒无量无边，余奉诏译出，冀众生得正智觉。
  source_urls:
