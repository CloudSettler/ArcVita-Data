endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法负经东归
  description: 为究法相唯识等义，冒禁偷渡玉门，西游五印师事戒贤，遍历那烂陀求得梵本，携经归唐开译经之源
  phases:
  - key: brewing
    name: 少学多疑发西行愿
    labels:
      zh: 萌愿
    start_date: 0618
    highlight_event_id: guji-玄奘-event-departure
  - key: breakthrough
    name: 偷渡玉门横穿大漠
    labels:
      zh: 突破
    start_date: '0629-08-01'
    highlight_event_id: guji-玄奘-event-departure
  - key: climax
    name: 那烂陀留学受瑜伽师地论
    labels:
      zh: 高峰
    start_date: '0631-01-01'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: closure
    name: 负梵本六百部东归长安
    labels:
      zh: 回归
    start_date: '0643-01-01'
    highlight_event_id: guji-玄奘-event-return
  decisions:
  - date: '0629-08-01'
    title_zh: 违禁私行出玉门关
    rationale: 诸师章疏各执一词，欲得真义非亲诣梵土不可，虽触唐禁亦以求法为先
  - date: '0631-06-01'
    title_zh: 决意留那烂陀师事戒贤
    rationale: 戒贤年高德邃独得弥勒无著真传，留住精研瑜伽唯识方能穷源返唐正本清源
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘扬显密
  description: 贞观十九年奉太宗诏入弘福慈恩玉华诸寺设译场，审梵校唐创译例，译出大般若等显密经论，令胜幢臂印陀罗尼等拔苦法门流通中土
  phases:
  - key: brewing
    name: 奉诏入弘福寺筹建译场
    labels:
      zh: 筹备
    start_date: '0645-02-01'
    highlight_event_id: guji-玄奘-event-return
  - key: breakthrough
    name: 定五不翻与译场仪轨
    labels:
      zh: 立制
    start_date: '0646-01-01'
    highlight_event_id: guji-玄奘-event-translate-shengchuang
  - key: climax
    name: 译胜幢臂印陀罗尼济拔恶趣
    labels:
      zh: 显扬
    start_date: '0648-01-01'
    highlight_event_id: guji-玄奘-event-translate-shengchuang
  - key: closure
    name: 大般若经译毕示寂玉华
    labels:
      zh: 圆成
    start_date: '0663-10-01'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645-03-01'
    title_zh: 奏请置译场广召硕德助译
    rationale: 梵本繁浩义理幽微，非集证义润文度语诸才难成信达雅译，故建制度化译场
  - date: '0648-01-01'
    title_zh: 奉诏译胜幢臂印陀罗尼经
    rationale: 此咒为殑伽沙诸佛同说能灭五逆十恶不堕恶趣，愍念有情堕苦无依故优先译出劝持流通
