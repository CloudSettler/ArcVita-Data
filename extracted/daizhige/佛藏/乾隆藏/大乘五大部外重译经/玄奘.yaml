    en: Xuanzang
  lifespan:
    birth:
      date: '0602'
      precision: year
      is_circa: false
      raw: 隋仁寿二年
    death:
      date: '0664-02-05'
      precision: day
      is_circa: false
      raw: 唐麟德元年二月五日
  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐
  reign_ref: 贞观
  archetype: 译经高僧
  dilemmas:
  - 求法与犯禁之间：西行无诏而行，违律与求法孰重
  - 空宗与有宗之间：如何会通中观与瑜伽以正译旨
  - 密咒与显教之间：持咒灭罪与依教修证如何并弘
  lesson: 宁向西天一步死，不向东土一步生；译经当以信达为本，利众为怀
  summary_first_person: 吾俗姓陈，名祎，洛州缑氏人。少出家，感诸师异说，疑无所归，乃誓往西域求真经。贞观初私度玉门，历碛涉险，至那烂陀从戒贤学瑜伽唯识，遍游五印十七载而归。蒙太宗、高宗礼敬，居弘福、慈恩、玉华译经十九载，译出大般若等七十五部，兼译咒五首等陀罗尼，愿灭众生重罪，弘宣法利而终。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%92%92%E4%BA%94%E9%A6%96%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%92%92%E4%BA%94%E9%A6%96%E7%BB%8F.html
endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法
  summary: 为求瑜伽正法与戒律本源，冒禁西行十七载，遍学五印
  phases:
  - key: brewing
    name: 京洛生疑
    labels:
      zh: 发愿
    start_date: '0626'
    highlight_event_id: guji-玄奘-event-departure
  - key: breakthrough
    name: 偷渡玉门
    labels:
      zh: 出关
    start_date: '0629-08-01'
    highlight_event_id: guji-玄奘-event-departure
  - key: climax
    name: 那烂陀问道
    labels:
      zh: 求学
    start_date: '0631'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: closure
    name: 负经东归
    labels:
      zh: 归唐
    start_date: '0643'
    highlight_event_id: guji-玄奘-event-return
  decisions:
  - date: '0629-08-01'
    title_zh: 违诏私行出玉门
    rationale: 诸师章疏各执一词，若不亲往印度求梵本，则疑终不决，虽犯禁亦往
  - date: '0631'
    title_zh: 留学那烂陀从戒贤
    rationale: 欲穷瑜伽师地论奥义，必依具传承之师，故止学五载尽得其传
  - date: '0643'
    title_zh: 辞戒日王归国弘法
    rationale: 梵本已得，真法当济东土众生，不可久留异域
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经
  summary: 归唐后奉太宗高宗诏，立译场于弘福慈恩玉华，译经弘咒
  phases:
  - key: brewing
    name: 弘福创译
    labels:
      zh: 建场
    start_date: '0645-02-01'
    highlight_event_id: guji-玄奘-event-return
  - key: breakthrough
    name: 瑜伽般若奠基
    labels:
      zh: 首译
    start_date: '0646'
    highlight_event_id: guji-玄奘-event-translate-yujia
  - key: climax
    name: 咒五首等陀罗尼译弘
    labels:
      zh: 密咒
    start_date: '0650'
    highlight_event_id: guji-玄奘-event-translate-zhouwushou
  - key: closure
    name: 玉华示寂
    labels:
      zh: 圆寂
    start_date: '0663'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645-02-01'
    title_zh: 受诏不仕专事翻译
    rationale: 太宗劝仕不就，愿以译经报国，更利含灵
  - date: '0650'
    title_zh: 译咒五首经五咒并弘
    rationale: 此五咒能灭众罪千转，六字七俱胝等应机广被，故虽繁难亦当译出令众受持
  - date: '0660'
    title_zh: 居玉华宫译大般若
    rationale: 大般若为众经之纲，必毕其功而后无憾，故移译场于玉华专精卒业
