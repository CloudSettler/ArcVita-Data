  - 梵本浩繁与中土根器之间的译弘权衡
  lesson: 以悲愿为舟筏，以精诚为绳墨，法虽远必求，苦虽深必济，方能令正法久住有情离苦
  summary_first_person: 吾玄奘，洛州缑氏人，少出家遍究摄论涅槃而疑滞难通，遂冒禁西行遍历五天竺，于那烂陀师事戒贤得瑜伽唯识真传，负梵本六百余部东归，长安奉诏译经十九载，译出胜幢臂印陀罗尼等，愿以神咒善巧拔诸有情地狱饿鬼人天极苦
