  summary_first_person: 吾姓陈名祎洛州缑氏人也幼慕释典贞观初杖锡西行历百三十国师事戒贤于那烂陀归而奉诏译经一千三百余卷尝重译阿弥陀经为称赞净土佛摄受经欲令群生系念往生极乐今观此土五浊难信唯佛摄受不可思议故劝一切信受发愿
