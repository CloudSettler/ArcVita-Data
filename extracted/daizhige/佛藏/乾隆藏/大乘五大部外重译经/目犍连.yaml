  reign_ref: 释迦牟尼佛在世
  archetype: 孝亲报恩与神通第一
  dilemmas:
  - 以一人神通之力欲解母亲深结重罪而不能
  - 独力救亲与依众僧和合威神之力的抉择
  - 眼见至亲受饿鬼苦而饮食化火炭的无力与悲哀
  lesson: 独力难解深重业结，孝道报恩当依清净和合众力，广设供养，以无私济度令七世父母共离三涂
  summary_first_person: 吾名目犍连，随佛出家始得六通，欲报父母乳哺之恩，以道眼观见亡母生饿鬼中皮骨相连不得饮食，即以钵盛饭往饷，母以左手障饭右手搏食，食未入口化成火炭，吾悲哀驰还白佛，世尊告以母罪根深结非一人之力所奈何，当以七月十五日具麨饭五果盆器香油床具供养十方清净圣众，藉众僧威神乃得解脱，吾与众欢喜奉行，方知报恩在众力不在独力
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说报恩奉盆经.md
