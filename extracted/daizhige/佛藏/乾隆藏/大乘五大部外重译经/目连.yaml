events:
- id: guji-目连-event-birth
  title_zh: 生于王舍城婆罗门家
  date: '-0544'
  year_of: -544
  description: 生于古印度摩揭陀国王舍城婆罗门望族与舍利弗为友后同皈佛陀
  location: 古印度摩揭陀国王舍城
- id: guji-目连-event-six-powers
  title_zh: 始得六通号神通第一
  date: '-0505'
  year_of: -505
  description: 随佛修行精进禅定得六神通具天眼道眼观视世间号称神通第一欲度父母报乳哺之恩
  location: 舍卫国祇树给孤独园
- id: guji-目连-event-see-mother
  title_zh: 道眼观见亡母堕饿鬼
  date: -0490
  year_of: -490
  description: 以道眼观视世间见其亡母生饿鬼中不见饮食皮骨连立悲哀欲救
  location: 舍卫国祇树给孤独园
- id: guji-目连-event-offer-fails
  title_zh: 钵饭化火炭驰还白佛
  date: -0490
  year_of: -490
  description: 即钵盛饭往饷其母母得钵饭便以左手障饭右手抟饭食未入口化成火炭遂不得食目连大叫悲号啼泣驰还白佛具陈如此
  location: 饿鬼道
- id: guji-目连-event-ask-buddha
  title_zh: 佛示众僧自恣救济之法
  date: -0490
  year_of: -490
  description: 佛言汝母罪根深结非汝一人力所奈何当须十方众僧威神之力于七月十五僧自恣时当为七世父母具饭百味五果盆器供养十方大德众僧
  location: 舍卫国祇树给孤独园
- id: guji-目连-event-ullan
  title_zh: 七月十五盂兰盆供母得脱
  date: -0490-07-15
  year_of: -490
  description: 依佛敕于七月十五具饭百味五果汲灌盆器香油锭烛床敷卧具安盂兰盆中供养众僧众僧咒愿竟受食是日其母即得脱一劫饿鬼之苦
  location: 舍卫国祇树给孤独园
- id: guji-目连-event-promote
  title_zh: 请佛许未来弟子皆行盂兰盆孝
  date: -0490-07-15
  year_of: -490
  description: 复白佛言若未来世一切佛弟子行孝顺者亦应奉此盂兰盆救度现在乃至七世父母佛言大善皆应于七月十五佛欢喜日僧自恣日以百味饮食安盂兰盆施十方自恣僧四辈弟子闻佛所说欢喜奉行
  location: 舍卫国祇树给孤独园
- id: guji-目连-event-death
  title_zh: 示现入灭
  date: -0484
  year_of: -484
  description: 后于佛世先佛入灭为外道所害以神通示现无常然其孝行与盂兰盆法流传后世为佛门孝道典范
  location: 古印度王舍城
