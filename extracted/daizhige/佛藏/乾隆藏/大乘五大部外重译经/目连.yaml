  dilemmas:
  - 神通自度与业力深结难敌之间何以取舍
  - 独力救亲与仰仗十方众僧和合之力何者为解脱正途
  lesson: 罪根深结非一人之力所能奈何当以清净众僧和合咒愿之力广作盂兰盆供方能度亲出苦并推孝至七世父母
  summary_first_person: 吾乃目连佛陀十大弟子中神通第一者昔欲度父母报乳哺之恩始得六通即以道眼观世见亡母堕饿鬼中皮骨连立虽钵盛饭往饷辄化火炭悲号驰还白佛始知母罪根深结非我一人可解蒙佛开示于七月十五僧自恣日以百味五果安盂兰盆供养十方大德众僧赖众僧威神之力母即日得脱一劫饿鬼之苦自此深信孝道当推至七世父母愿未来弟子年年奉行以报长养慈爱之恩
  source_urls:
