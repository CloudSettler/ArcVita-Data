  name_zh: 真谛
  names:
    zh: 真谛
    en: Paramartha
  lifespan:
    birth:
      date: 0499
      precision: year
      is_circa: false
      raw: 天监十八年生于天竺优禅尼国
    death:
      date: 0569
      precision: year
      is_circa: false
      raw: 陈太建元年寂于广州
  birth_date: 0499
  death_date: 0569
  era: 南北朝
  reign_ref: 梁武帝至陈宣帝
  archetype: 译师
  dilemmas:
  - 乱世弘法与安身之难：梁末侯景之乱，陈初流离岭南，译场屡迁而道心不改
  - 译文信实与中土理解之难：唯识中观深义难译，欲立言传心又恐失真
  lesson: 客尘虽覆而自性清净，如宝在泥，洗净即显；弘法惟以实修实证为依
  summary_first_person: 吾本天竺优禅尼人，远涉重洋入梁，值乱世流转而译经不辍；深信众生界即如来界，客尘可除，法身常住，愿以译事令中土得闻如来藏真义
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%97%A0%E4%B8%8A%E4%BE%9D%E7%BB%8F.md
endeavors:
