    start_date: '0552'
    highlight_event_id: guji-真谛-event-shedasheng
  - key: climax
    name: 广说转依与阿赖耶
    labels:
      zh: 阐微
    start_date: '0557'
    highlight_event_id: guji-真谛-event-translate-wushangyi
  - key: closure
    name: 付法弟子慧恺等
    labels:
      zh: 授记
    start_date: 0568
    highlight_event_id: guji-真谛-event-teach
  decisions:
  - date: '0552'
    title_zh: 首译摄大乘论创地论新义
    rationale: 见中土空有之诤，欲以阿赖耶识、转依义通显如来藏与唯识之会通
  - date: '0560'
    title_zh: 于广州制止还梵之议
    rationale: 弟子劝其归国，念中土众生未得法利，决意留驻岭南终其身以弘法
events:
- id: guji-真谛-event-birth
  title_zh: 诞生于优禅尼国
  date: 0499
  year_of: 0499
  description: 生于西天竺优禅尼国婆罗门家，幼通外典，后出家学三藏
  location: 优禅尼国
- id: guji-真谛-event-study
  title_zh: 游学中天竺精通大乘
  date: 0519
  year_of: 0519
  description: 遍学阿毗达磨、般若、唯识，得阿闍梨位，通大小乘论
  location: 中天竺
- id: guji-真谛-event-arrive
  title_zh: 航海至广州为梁武帝迎请
  date: '0546'
  year_of: '0546'
  description: 梁大同十二年乘舶至广州，梁武帝遣使迎至建康，敕住宝云殿从事翻译
  location: 广州
- id: guji-真谛-event-shedasheng
  title_zh: 译摄大乘论
  date: '0552'
  year_of: '0552'
  description: 于富春、豫章等地译出摄大乘论等，开中土摄论学派之端
  location: 豫章
- id: guji-真谛-event-translate-wushangyi
  title_zh: 译无上依经二卷
  date: '0557'
  year_of: '0557'
  description: 于岭南译出无上依经，宣说如来界、菩提、法身常乐我净及转依之义，以梁天竺三藏法师真谛译名行世
  location: 广州
- id: guji-真谛-event-teach
  title_zh: 岭南讲授付嘱门人
  date: 0568
  year_of: 0568
  description: 晚年居广州寂处，常为慧恺、法泰等讲摄论、俱舍，授以译本与口诀
  location: 广州
- id: guji-真谛-event-death
  title_zh: 示寂于广州
  date: 0569
  year_of: 0569
  description: 陈太建元年正月于广州示寂，世寿七十一，弟子奉舍利建塔
  location: 广州
