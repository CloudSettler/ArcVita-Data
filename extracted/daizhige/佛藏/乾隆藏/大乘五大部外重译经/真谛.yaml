  decisions:
  - date: '0546'
    title_zh: 应梁武帝请入建康
    rationale: 为弘大乘正法，不辞海路艰险西来，抉择以译经为报佛恩之行
  - date: '0550'
    title_zh: 避侯景乱南行译经
    rationale: 建康陷落后不归天竺，转往岭南保全经本，坚持乱中不绝译业
  - date: '0557'
    title_zh: 择译无上依经显如来藏
    rationale: 以如来界自性清净之义破执见，欲令中土明了众生界即法身
- id: guji-真谛-endeavor-2
  title_zh: 开唯识宗学于中土
  description: 译传摄大乘论、显识论、十八空论等，奠定中土唯识学基础，为后世玄奘新译之先导
  phases:
  - key: brewing
