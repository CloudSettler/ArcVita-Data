events:
- id: guji-睒子-event-birth
  title_zh: 兜率菩萨下生盲家为睒子
  date: -1000-01-01
  year_of: -1000
  location: 迦夷国盲长者家
  description: 兜率天上菩萨见盲夫妇欲入山求道而目盲恐遭危害寿尽下生为其子年十岁号睒子至孝仁慈奉行十善
- id: guji-睒子-event-enter-mountain
  title_zh: 尽施家财偕父母入山结庐
  date: -0990-06-01
  year_of: -990
  location: 深山蒲庐
  description: 睒子年过十岁白父母不违本誓以家中所有施诸贫穷与父母入山以蒲草作屋置床褥风雨以时果甘泉凉莲华杂香
- id: guji-睒子-event-serve-parents
  title_zh: 日取百果泉水兽鸟和鸣娱亲
  date: -0990-07-01
  year_of: -990
  location: 山中泉池边
  description: 入山一年睒着鹿皮衣提瓶取水麋鹿飞鸟共饮师子熊罴无害心睒蹈地恐地痛天神山神化人慰劳一心定意
- id: guji-睒子-event-shot
  title_zh: 迦夷国王射猎误中睒胸
  date: -0990-06-15
  year_of: -990
  location: 山中水边
  description: 王见水边麋鹿群集引弓射之箭误中睒子毒箭甚痛山中大风折木日无光泉竭花萎盲父母惊变
- id: guji-睒子-event-entrust
  title_zh: 忍痛托亲累王誓供养
  date: -0990-06-15
  year_of: -990
  location: 山中睒子卧处
  description: 睒告王非王之过乃宿罪所致不惜身但怜盲亲老无依请王往草屋善慰父母指示步径自忏悔无数劫恶王誓入泥犁百劫愿睒得活住山供养二老
- id: guji-睒子-event-resurrection
  title_zh: 天帝释灌神药睒活父母复明
  date: -0990-06-15
  year_of: -990
  location: 山中尸侧
  description: 盲父母抱尸扪箭仰天誓言若睒至孝天地所知当箭拔毒除更生第二忉利天帝座动与兜率释梵四王来灌神妙药箭拔毒出睒更生如故父母两目皆开风息日重光泉涌华开
- id: guji-睒子-event-teach-king
  title_zh: 教王止猎持戒兴福
  date: -0990-06-16
  year_of: -990
  location: 山中蒲庐前
  description: 王欲以一国财宝上养道人睒劝王还国安民奉戒勿射猎横杀无辜随王猎者见神变皆奉五戒修十善佛言睒即吾前身盲父为阅头檀王盲母为摩耶王为阿难帝释为弥勒
- id: guji-睒子-event-death
  title_zh: 山中功圆示寂后世成佛
  date: -0990-12-31
  year_of: -990
  location: 山林精舍
  description: 睒子孝行圆满教化迦夷一国父母终保年寿后寿终示寂以累世功德后身成三界尊佛为大众说宿命本事
