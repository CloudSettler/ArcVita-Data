    title_zh: 兜术天上愿为盲者作子
    rationale: 见盲夫妻欲入山求慧而两目不见恐堕沟坑毒虫故愿寿终下生供养终其年寿
  - date: -0975
    title_zh: 中箭不怨托王养亲
    rationale: 自惟宿罪不惜身命但怜盲亲年老目盲一旦无依故托王如我在时供养以此忏悔灭罪
events:
- id: guji-睒子-event-birth
  title_zh: 兜术菩萨下生盲家
  date: '-1000'
  year_of: '-1000'
  description: 过去无数世菩萨名一切妙于兜术天教授天人以天眼见迦夷国盲长者无子欲入山遂寿尽下生为其子父母欢喜
  location_zh: 迦夷国
- id: guji-睒子-event-enter-mountain
  title_zh: 散财入山筑庐供养
  date: -0990
  year_of: -0990
  description: 睒年十岁白父母如本愿入山以家中所有施贫与父母入山以蒲草作屋施床蓐采百种果蓏饮泉水一年众果丰茂莲华五色鸟兽和集无相害意
  location_zh: 深山蒲庐
- id: guji-睒子-event-shot
  title_zh: 鹿皮汲水误中王箭
  date: -0975
  year_of: -0975
  description: 盲父母渴睒着鹿皮提瓶汲水麋鹿同饮迦夷王入山射猎遥见鹿群引弓误中睒胸毒箭举身皆痛睒呼谁射杀三道人王怖悔自责欲以国宝救命
  location_zh: 山泉水边
- id: guji-睒子-event-revival
  title_zh: 盲亲号哭天帝救活
  date: -0975
  year_of: -0975
  description: 王告盲父母父母扑尸号天母舐疮愿代死言若有至孝天地当知第二忉利天释座为动第四兜术诸天皆动帝释持神药灌口箭自拔出睒活如故二亲两目皆开风息日光泉华倍荣
  location_zh: 山中草屋尸前
- id: guji-睒子-event-admonish-king
  title_zh: 劝王持戒化国行善
  date: -0974
  year_of: -0974
  description: 睒既活劝王还国安慰国人奉持五戒勿复射猎夭伤虫兽王还宣令供养鳏盲犯者重罪国人见神迹皆奉五戒行十善死得升天
  location_zh: 迦夷国
- id: guji-睒子-event-death
  title_zh: 寿终示寂后身成佛
  date: -0920
  year_of: -0920
  description: 睒终养父母寿终于山后世即释迦牟尼佛盲父为阅头檀王盲母为摩耶夫人迦夷王为阿难天帝释为弥勒以孝行感动天龙证成无上正真
  location_zh: 山中
