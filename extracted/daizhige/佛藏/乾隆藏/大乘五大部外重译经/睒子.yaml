  summary_first_person: 我本兜率菩萨见迦夷国盲夫妇发道意而无目视恐堕险难便寿尽下生为其子名曰睒子奉行十善以蒲草结庐百果泉水养亲鹿鸟亲近虎狼不害王射误中我胸我不恨王但怜父母无依以至诚孝心得帝释天以神药复活父母复明遂教王止杀奉戒
