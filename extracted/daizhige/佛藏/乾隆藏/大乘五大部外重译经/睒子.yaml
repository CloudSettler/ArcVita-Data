  dilemmas:
  - 本愿入深山求无上正真与为盲父母留世尽孝之两难
  - 身中剧毒将死之际自惜性命与唯念二亲年老盲无依之抉择
  lesson: 孝养父母为成佛根本慈心不杀能感通天地龙神现世罪灭福生
  summary_first_person: 我前身名一切妙于兜术天上见迦夷国盲夫妻愿入山而无目遂寿终下生为其子名睒年七岁奉十善孝养如事天十岁与父母入山以蒲草为屋采果汲泉鸟兽驯集师子毒兽皆慈相向后着鹿皮汲水为王误射中胸我不恨王唯忧盲亲无依忏悔宿罪愿世世相值天帝释持神药救我箭出复活二亲复明我劝王还国持五戒不猎杀一国遂奉善
  source_urls:
