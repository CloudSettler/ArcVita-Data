  decisions:
  - date: '0525'
    title_zh: 判二种无上供养
    rationale: 明漏尽阿罗汉与发菩提心菩萨同为供养如来之无上福田而发心供养更胜资生供养
  - date: '0535'
    title_zh: 广引栴檀全用喻菩萨始终利益
    rationale: 以栴檀芽叶华果材舍皆有用喻菩萨初发心至舍利住持皆利益众生令生不退
events:
- id: guji-瞿昙般若流支-event-birth
  title_zh: 生于中天竺婆罗门家
  date: 0480
  year_of: 0480
  location: 中天竺
  description: 瞿昙氏婆罗门种生于世家通梵典后归佛法出家学大乘
- id: guji-瞿昙般若流支-event-arrive
  title_zh: 抵洛阳入元魏译场
  date: 0508
  year_of: 0508
  location: 洛阳
  description: 宣武帝永平中自天竺来至洛阳与菩提流支等同参译事
- id: guji-瞿昙般若流支-event-translate
  title_zh: 译出一切法高王经一卷
  date: 0528
  year_of: 0528
  location: 洛阳
  description: 以梵本重译一切法高王经明僧为四双八辈福田而菩萨摩诃萨为天人世间无上福田能毕竟消施
- id: guji-瞿昙般若流支-event-vow
  title_zh: 立愿弘大乘菩萨行
  date: '0515'
  year_of: '0515'
  location: 洛阳
  description: 自誓以四摄法摄众生显菩萨离三恶道畏如阿那婆达多龙王离三畏
- id: guji-瞿昙般若流支-event-preach
  title_zh: 宣讲菩萨无上福田与一切法所依
  date: '0530'
  year_of: '0530'
  location: 邺都
  description: 依经言一切刹利婆罗门长者转轮王乃至四果辟支佛皆从菩萨生依菩萨有劝众发心
- id: guji-瞿昙般若流支-event-sandalwood
  title_zh: 演栴檀树喻明菩萨始终全用
  date: '0535'
  year_of: '0535'
  location: 邺都
  description: 说阎浮栴檀自牙至果材舍皆能除病安乐喻菩萨自初发心至入无余涅槃舍利分身皆利益众生
- id: guji-瞿昙般若流支-event-circulation
  title_zh: 付嘱流通发心报恩
  date: '0540'
  year_of: '0540'
  location: 邺都
  description: 劝欲报过去未来现在十方诸佛恩者唯应发阿耨多罗三藐三菩提心是为无上供养无上报恩
- id: guji-瞿昙般若流支-event-exhort
  title_zh: 劝二种富伽罗供养如来
  date: '0542'
  year_of: '0542'
  location: 邺都
  description: 明漏尽阿罗汉与发菩提心菩萨为二种无上供养者劝众舍资生供养而取发心供养
- id: guji-瞿昙般若流支-event-death
  title_zh: 示寂于邺
  date: '0543'
  year_of: '0543'
  location: 邺都
  description: 译经弘法三十余年示寂后所译诸经盛行于世一切法高王经入大乘五大部外重译经流传至今
