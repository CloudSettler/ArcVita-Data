      raw: 约五四三年
  birth_date: 0480
  death_date: '0543'
  era: 南北朝
  reign_ref: 东魏兴和
  archetype: 译经高僧
  dilemmas:
  - 梵本精微与汉语文约如何两全而不失第一义
  - 依仗高门护法与保持译场清净独立如何平衡
  - 以幻化譬喻破执与令众生不堕断常如何权衡
  lesson: 以四功质义存真，借方便劫烧喻显实相，译事当以敬慎校雠为本、以善巧破执为用
  summary_first_person: 吾本中天竺波罗奈婆罗门瞿昙氏，少习梵典，渡流沙而至魏都洛邑。蒙高公笃敬佛法，博采梵文，命吾与沙门昙林同场翻译。兴和四年壬戌秋九月甲子，始换梵为汉，凡四功雠校，得五千五百七十六字，定名第一义法胜经。愿此髓中之法，令见闻者离分别戏论，趣无余涅槃。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E7%AC%AC%E4%B8%80%E4%B9%89%E6%B3%95%E8%83%9C%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E7%AC%AC%E4%B8%80%E4%B9%89%E6%B3%95%E8%83%9C%E7%BB%8F.html
endeavors:
- id: guji-瞿昙般若流支-endeavor-1
  title_zh: 东魏译场重译第一义法胜经
  desc_zh: 应魏尚书令仪同高公之请，主持梵汉对译，以昙林笔受，四功雠校，成五千余字，显第一义无字无说而假名众生之旨
  phases:
  - key: brewing
    name: 入华习汉与博采梵本
    labels:
      zh: 酝酿
    start_date: '0516'
    highlight_event_id: guji-瞿昙般若流支-event-arrival
  - key: breakthrough
    name: 高公感题立场
    labels:
      zh: 突破
    start_date: '0541'
    highlight_event_id: guji-瞿昙般若流支-event-prepare
  - key: climax
    name: 兴和四年换文定本
    labels:
      zh: 高潮
    start_date: '0542-09-01'
    highlight_event_id: guji-瞿昙般若流支-event-translate
  - key: closure
    name: 五千余字流通
    labels:
      zh: 收束
    start_date: '0542-10-01'
    highlight_event_id: guji-瞿昙般若流支-event-circulate
  decisions:
  - date: '0542-09-01'
    title_zh: 四功质义乃定不急就章
    rationale: 梵本髓义易失，宁经四度雠校而后定本，以存无字之实
  - date: '0542-09-01'
    title_zh: 直译无我无字兼存譬喻方便
    rationale: 为破外道微细我执，保留劫烧、蟒呼、金火等喻，使中土易解第一义
- id: guji-瞿昙般若流支-endeavor-2
  title_zh: 辨外道见与显众生无实
  desc_zh: 于经中假光明炬大仙六十劫行之问难，次第破自在天作、微细我量、劫烧实有等执，立缘起、空、无常正见
  phases:
  - key: brewing
    name: 访诸仙林行积疑
    labels:
      zh: 酝酿
    start_date: '0535'
    highlight_event_id: guji-瞿昙般若流支-event-prepare
  - key: breakthrough
    name: 以缘起答众生所从来
    labels:
      zh: 突破
    start_date: '0542-09-01'
    highlight_event_id: guji-瞿昙般若流支-event-translate
  - key: climax
    name: 劫烧方便大辩
    labels:
      zh: 高潮
    start_date: '0542-09-15'
    highlight_event_id: guji-瞿昙般若流支-event-translate
  - key: closure
    name: 授记光明炬为毗婆尸佛
    labels:
      zh: 收束
    start_date: '0542-09-30'
    highlight_event_id: guji-瞿昙般若流支-event-circulate
  decisions:
  - date: '0542-09-01'
    title_zh: 不说微细我量以盲喻止戏论
    rationale: 眼等念念不住、阴界无常皆无我可得，强说则增执，故以生盲不识白色为喻
  - date: '0542-09-15'
    title_zh: 立劫烧为如来摄化方便
    rationale: 若不示无常劫烧则众生不识时节、不畏生死，故权现大火实无一众生被烧，以怖畏摄福
