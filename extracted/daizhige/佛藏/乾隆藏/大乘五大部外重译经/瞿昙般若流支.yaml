    title_zh: 定译以菩萨为无上福田
    rationale: 经中佛言初发心菩萨即为声闻缘觉福田虽日食须弥抟食亦毕竟消施当如实译出以坚大乘信
  - date: '0530'
    title_zh: 以四河入海喻显菩萨出生一切法
    rationale: 恐众生迷没故用阿那婆达多池出四河入四海为喻令知三有安乐皆依萨婆若智而生
