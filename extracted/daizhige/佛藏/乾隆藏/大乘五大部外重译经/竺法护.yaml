  dilemmas:
  - 梵本义深文奥当直译存真抑或意译达言以利中土流通
  - 西域求法艰险与中土乱离当西行搜经抑或留驻安译
  lesson: 译梵为汉贵在得义忘筌随方达言方能令大乘广被群生
  summary_first_person: 吾本月氏裔家于敦煌八岁出家师事竺高座志在弘传方等西行遍历西域搜求梵本得百六十余部还归长安洛阳随处翻译凡一百五十余部冀使大乘正法光显中夏度脱群萌如佛升忉利为母说法之本怀
  source_urls:
