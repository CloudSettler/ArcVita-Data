  lesson: 译经当以信为本贯通梵汉勿以文害义方能令正法久住
  summary_first_person: 吾本月氏遗裔生于敦煌八岁出家师事竺高座游历西域三十六国携梵本百六十余部归于长安洛阳前后译经百五十余部冀以汉文显佛本怀虽逢永嘉之乱译事不辍唯愿众生得闻正法
