    title_zh: 决意西游求梵本
    rationale: 中土梵本稀缺大乘未广，遂发愿深入西域不惜身命以取真经，通三十六胡语广访名师
  - date: '0273'
    title_zh: 定居长安设译场
    rationale: 为使梵本广传择天下之中长安立场，招集笔受度语，变游方为定译以利弘化
- id: guji-竺法护-endeavor-2
  title_zh: 译场弘化广演大乘
  description: 在敦煌长安洛阳三地主持译事三十余年，译出正法华光赞般若等一百五十余部，首倡以虚空无希望为宗的译风
