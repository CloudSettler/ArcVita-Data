person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksha
  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 约魏景元二年
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约西晋永嘉二年
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 西晋武帝泰始至怀帝永嘉
  archetype: 译经宗匠
  dilemmas:
  - 梵本质朴与中土文雅之间何以取舍，文质失衡则失真或难通
  - 顺权方便与守真实义之间何以平衡，不堕执方便而失正理
  - 胡语重译与孤身求法之间何以兼顾，广得佛典与精译之间难两全
  lesson: 顺权方便，观机设教，假名非实而慈悲摄化；译事当以不增不减、令众得入为要
  summary_first_person: 吾本月氏，世居敦煌，八岁出家，诵经万言，志在流通。携梵夹往来西域三十六国，广求大乘方等诸经；归处长安洛阳，设译场，口宣胡晋，笔受成文。惟愿以权方便，令中土众生得闻未曾有法，不以文饰害义，不以质朴废道，虽非佛化之女辩才，然亦欲以译事为师子吼耳。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/顺权方便经.md
  - https://cbeta.online/T0565
endeavors:
- id: guji-竺法护-endeavor-1
  title_zh: 西域求梵与大乘译经
  description: 自敦煌出发遍访西域诸国搜求梵本，归洛阳长安译出正法华、光赞般若等一百五十余部，开中土大乘译经之先河
  phases:
  - key: brewing
    name: 敦煌出家诵习
    labels:
      zh: 酝酿
    start_date: 0239
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 西行求梵得本
    labels:
      zh: 突破
    start_date: '0260'
    highlight_event_id: guji-竺法护-event-qiuxi
  - key: climax
    name: 洛阳长安开译正法华
    labels:
      zh: 高潮
    start_date: 0286
    highlight_event_id: guji-竺法护-event-zhengfahua
  - key: closure
    name: 译业垂成授徒承传
    labels:
      zh: 收束
    start_date: '0300'
    highlight_event_id: guji-竺法护-event-guangzan
  decisions:
  - date: '0260'
    title_zh: 决计西行三十六国求梵本
    rationale: 中土梵本稀少，欲广弘大乘必亲往西域访求原本，不畏道远，以得真典为先
  - date: 0286
    title_zh: 定译风为文质并重不加饰
    rationale: 胡语质朴，晋文尚雅，若过饰则失圣意，过质则众难入，故存胡音而畅汉义，令信者得真
- id: guji-竺法护-endeavor-2
  title_zh: 随方弘化开示权方便
  description: 依顺权方便之义，随方毗尼示现分卫、讲说，以随俗方便摄化士庶，立译场聚众讲诵，使佛法入郡国州邑
  phases:
  - key: brewing
    name: 随师游历观风知俗
    labels:
      zh: 酝酿
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-kaishi
  - key: breakthrough
    name: 长安设场聚徒共译
    labels:
      zh: 突破
    start_date: '0273'
    highlight_event_id: guji-竺法护-event-kaishi
  - key: climax
    name: 讲演空法顺权度众
    labels:
      zh: 高潮
    start_date: 0286
    highlight_event_id: guji-竺法护-event-zhengfahua
  - key: closure
    name: 晚年避乱弘传不辍
    labels:
      zh: 收束
    start_date: '0304'
    highlight_event_id: guji-竺法护-event-guangzan
  decisions:
  - date: '0273'
    title_zh: 于长安洛阳立译场广收笔受
    rationale: 一人之力难成众经，聚博达梵汉之士分工口译笔受校勘，可速广流布
  - date: '0304'
    title_zh: 永嘉乱起不辍讲译西归
    rationale: 世乱道艰更需安众以法，权宜避乱而仍携经传译，使法脉不断
events:
- id: guji-竺法护-event-birth
  title_zh: 生于敦煌月氏家
  date: '0231'
  year_of: '0231'
  description: 月氏后裔家世居敦煌，八岁出家为沙弥，随师诵经日记万言，博览西域胡汉典籍
- id: guji-竺法护-event-qiuxi
  title_zh: 西行求法历三十六国
  date: '0260'
  year_of: '0260'
  description: 携带梵夹遍行西域，搜访大乘方等诸经梵本，通三十六国胡语，归来携经甚富
- id: guji-竺法护-event-kaishi
  title_zh: 泰始二年始译于长安洛阳
  date: '0266'
  year_of: '0266'
  description: 于西晋泰始二年起在长安、洛阳设译，所译《顺权方便经》等为早期大乘重译，宣说随宜方便化导之义
- id: guji-竺法护-event-zhengfahua
  title_zh: 译出正法华经
  date: '0286-09-15'
  year_of: 0286
  description: 太康七年译《正法华经》十卷，首次完整汉译法华，为后世鸠摩罗什译本之先导，奠定大乘弘传基础
- id: guji-竺法护-event-guangzan
  title_zh: 译出光赞般若经
  date: '0286-12-01'
  year_of: 0286
  description: 同年译《光赞般若经》十卷，传般若空观，与《正法华》并为晋世大乘要典，门徒受学甚众
- id: guji-竺法护-event-death
  title_zh: 示寂于洛阳
  date: 0308
  year_of: 0308
  description: 永嘉之乱前后期示寂，一生译经一百五十余部，二百余卷，门人竺法首等承其译业，中土大乘藉此大兴
