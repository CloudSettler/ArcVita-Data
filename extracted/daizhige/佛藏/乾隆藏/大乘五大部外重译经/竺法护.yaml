  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksha
  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 约曹魏正始二年敦煌
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约西晋永嘉二年
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉
  archetype: 译经高僧
  dilemmas:
  - 西域求法道路艰险与中土众生待法急切之间如何权衡
  - 梵本义理深广与华言信达雅之间如何取舍以利刚强难化之众
  lesson: 浊世弘法当以不退转之愿为铠，随顺众生根器开三乘方便，终归一乘清净
  summary_first_person: 吾本月支后裔家世居敦煌，八岁出家事高座沙门竺高座，日诵万言，尝随师游西域三十六国，广求梵本得百余部，还归洛阳长安立译场，虽值五浊乱世不敢懈怠，所译阿惟越致遮等经皆欲令众生入不退转法轮
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/阿惟越致遮经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/阿惟越致遮经.html
