  title_zh: 译出佛说济诸方等学经一卷
  date: 0290
  year_of: 0290
  description: 译此经明济诸方等平等之旨，诫勿分别声闻菩萨二品而谤佛法僧，强调护法师即护三宝
  location: 长安
- id: guji-竺法护-event-death
  title_zh: 示寂于关中
  date: 0308
  year_of: 0308
  description: 永嘉之乱中仍坚持译讲，约七十八岁示寂，一生译经一百五十四部
  location: 长安
