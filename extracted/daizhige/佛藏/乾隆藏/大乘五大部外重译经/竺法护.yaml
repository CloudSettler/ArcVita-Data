    labels:
      zh: 译正法华经
    start_date: 0286
    highlight_event_id: guji-竺法护-event-huayan
  - key: climax
    name: 忉利说法经译成
    labels:
      zh: 译佛升忉利天为母说法经
    start_date: 0290
    highlight_event_id: guji-竺法护-event-daoli
  - key: closure
    name: 永嘉避乱犹译不辍
    labels:
      zh: 乱世不废译
    start_date: '0303'
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0286
    title_zh: 以胡汉对校创译法
    rationale: 梵文一词多义汉文未备当酌义旨兼顾文辞使幽玄之理可晓于中士
  - date: 0290
    title_zh: 译佛升忉利天为母说法经显孝道与大乘菩萨行
    rationale: 佛为母升忉利三月说法正显报恩与菩萨不舍众生欲令中土知佛孝慈及菩萨深戒神通之行
