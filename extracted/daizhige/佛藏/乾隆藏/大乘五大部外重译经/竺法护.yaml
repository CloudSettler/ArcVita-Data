    labels:
      zh: 高潮
    start_date: 0290
    highlight_event_id: guji-竺法护-event-peak
  - key: closure
    name: 乱世护法授徒
    labels:
      zh: 延续
    start_date: '0304'
    highlight_event_id: guji-竺法护-event-final
  decisions:
  - date: 0284
    title_zh: 择译阿惟越致遮经四卷
    rationale: 此经明不退转法轮能破持信奉法声闻缘觉之执，契浊世众生渐入大乘之机
  - date: 0290
    title_zh: 采用胡汉对译众徒参校
    rationale: 梵义幽微一人难兼，集聂承远等共译以信达为本令经义流通无碍
