  summary_first_person: 吾竺法护本名昙摩罗刹，月氏裔家于敦煌，八岁出家师事竺高座，通三十六胡语，西游三十六国携梵本百六十五部归，三十余年译大乘经百五十余部，愿以象步从容开示虚空无希望法门，令众生不着吾我而安隐得度
