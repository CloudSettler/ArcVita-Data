  decisions:
  - date: '0286-09-15'
    title_zh: 以质直重译法华
    rationale: 旧译晦涩难以晓会，宁存胡本质朴不饰文藻，使中土初闻一乘真实义
  - date: '0303'
    title_zh: 译无希望经显无得宗
    rationale: 为破众生希望执着，特显虚空无为法门，令学者知一切法如幻如梦不生希望而得安隐
