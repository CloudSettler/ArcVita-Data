  decisions:
  - date: '0260'
    title_zh: 决意西行三十六国求法
    rationale: 中土梵本稀少义理不全，欲得不退转等深法须亲往西域访求原本
  - date: '0266'
    title_zh: 携梵本归洛阳设译场
    rationale: 西域虽多梵本而中土众生刚强难化，宜归汉地以华言弘传方便度脱
- id: guji-竺法护-endeavor-2
  title_zh: 译弘不退转法轮
  summary: 于长安洛阳两京组织译场译出光赞般若等一百五十余部，首译阿惟越致遮经阐明不退转义
  phases:
  - key: brewing
    name: 译场初创
    labels:
      zh: 酝酿
    start_date: '0267'
    highlight_event_id: guji-竺法护-event-translate-begin
