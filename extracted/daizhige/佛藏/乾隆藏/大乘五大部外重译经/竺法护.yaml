  date: '0260'
  year_of: '0260'
  description: 携带弟子西行至西域诸国，搜集大乘方等梵本数十部
  location: 西域
- id: guji-竺法护-event-assembly
  title_zh: 携经归洛阳聚徒立译场
  date: '0266'
  year_of: '0266'
  description: 自西域归来定居长安洛阳，广集通梵汉之士筹建译场
  location: 洛阳
- id: guji-竺法护-event-first-translation
