  decisions:
  - date: '0266'
    title_zh: 决意西行求法
    rationale: 中土梵本稀少方等阙如不入虎穴无以得真经欲弘大乘必亲往西域访求
  - date: '0270'
    title_zh: 携梵本东还而非留居西域
    rationale: 思中土众生未闻大乘思以所得广利汉地虽道路艰危愿负经东归
- id: guji-竺法护-endeavor-2
  title_zh: 洛阳长安广译大乘
  description: 自泰始至永嘉居长安洛阳敦煌译出正法华光赞般若等一百五十余部创月氏译场规模使大乘经教大行中土此经即其所译之一
  phases:
  - key: brewing
    name: 初开译场
    labels:
