person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksha
  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 西晋初约231年敦煌
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约308年
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉年间
  archetype: 译经僧
  dilemmas:
  - 梵本广求与汉地战乱流徙，藏经与传经孰先
  - 直译存真与意译达义，信实与通俗如何平衡
  - 隐居精译与随缘广讲，闭关与弘化何重
  lesson: 护法在译，译经在真，随机善权不离平等，不以一经废众经，不以一门谤他门
  summary_first_person: 吾竺法护，本月氏裔家于敦煌，八岁出家事竺高座，遍游西域携梵本归中原，于长安洛阳译经一百五十余部，尝译此济诸方等学经，诫末世勿以分别二品而谤法毁僧，惟以平等慈心护持正法。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%B5%8E%E8%AF%B8%E6%96%B9%E7%AD%89%E5%AD%A6%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%B5%8E%E8%AF%B8%E6%96%B9%E7%AD%89%E5%AD%A6%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0274
endeavors:
- id: guji-竺法护-endeavor-1
  title_zh: 西域求法广集梵本
  description: 自敦煌西行遍历西域诸国，搜求方等大乘梵本，携归中原为后世译业奠基
  phases:
  - key: brewing
    name: 少小出家游学
    labels:
      zh: 敦煌受学
    start_date: 0239
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 西行求梵本
    labels:
      zh: 携经东归
    start_date: '0260'
    highlight_event_id: guji-竺法护-event-west-travel
  - key: climax
    name: 梵本荟萃洛阳
    labels:
      zh: 集本备译
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-assembly
  - key: closure
    name: 译场初立
    labels:
      zh: 师资授受
    start_date: '0270'
    highlight_event_id: guji-竺法护-event-assembly
  decisions:
  - date: '0260'
    title_zh: 决计西行不畏艰险
    rationale: 汉地梵本稀缺，欲得方等全本非亲往西域不可，虽乱世道阻亦当求法
  - date: '0266'
    title_zh: 携百余梵夹归洛阳长安
    rationale: 择中原都会立译场，以通西域语与汉文之士共译，使大乘经广布
- id: guji-竺法护-endeavor-2
  title_zh: 长安洛阳译经弘化
  description: 于长安青门洛阳白马寺等地设馆译经，一生译出一百五十四部三百余卷，奠定西晋译经高峰
  phases:
  - key: brewing
    name: 初译立信
    labels:
      zh: 草创译场
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-first-translation
  - key: breakthrough
    name: 正法华等大经出世
    labels:
      zh: 方等大乘
    start_date: 0286
    highlight_event_id: guji-竺法护-event-lotus
  - key: climax
    name: 译济诸方等学经
    labels:
      zh: 诫谤护法
    start_date: 0290
    highlight_event_id: guji-竺法护-event-jizhu
  - key: closure
    name: 兵乱中护经不辍
    labels:
      zh: 永嘉护法
    start_date: '0304'
    highlight_event_id: guji-竺法护-event-jizhu
  decisions:
  - date: 0286
    title_zh: 以五校正译正法华经
    rationale: 梵本异本并存，召聂承远等笔受对校，宁繁不苟以存经旨
  - date: 0290
    title_zh: 专译济诸方等学经明平等护法
    rationale: 末世易生分别诽谤，需以此经破二品执着，示一切法平等皆佛威神
  - date: '0304'
    title_zh: 永嘉乱中留守关中续译
    rationale: 不避战祸，护经卷人，以译事续佛慧命，使法目久存
events:
