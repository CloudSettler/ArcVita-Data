person:
  qid: guji-维摩诘
  name_zh: 维摩诘
  names:
    zh: 维摩诘
    en: Vimalakirti
  lifespan:
    birth:
      date: -0490
      precision: year
      is_circa: true
      raw: 约公元前490年
    death:
      date: '-0410'
      precision: year
      is_circa: true
      raw: 约公元前410年
  birth_date: -0490
  death_date: '-0410'
  era: 古印度十六大国时期
  reign_ref: 释迦牟尼佛住世时期
  archetype: 居士菩萨
  dilemmas:
  - 在家白衣形迹与出世菩萨证量如何不二而行
  - 以方便示现有疾摄众与显法身常住真实如何统一
  - 呵斥声闻小乘执相与常怀慈悲不舍众生如何兼顾
  lesson: 直心是道场，随其心净则佛土净，不必离世别求解脱，于世间法中以方便现身即能演真实，默然无言即是不二
  summary_first_person: 吾乃毗耶离长者维摩诘，已曾供养无量诸佛，得无生忍、辩才无碍，虽为白衣而奉持沙门清净律行，虽处居家不著三界，资财摄贫、戒忍摄恚、禅慧摄乱，入诸淫舍酒肆博弈戏处皆以度人，今以方便现身有疾，欲令国王大臣及声闻众来问疾，因说身如聚沫浮云、无常无主，当乐佛身即法身，呵小乘执著以显大乘不二
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/维摩诘所说经.md
  - https://zh.wikisource.org/wiki/維摩詰所說經
  - https://cbetaonline.dila.edu.tw/zh/T0475
endeavors:
- id: guji-维摩诘-endeavor-1
  title_zh: 居家方便摄化众生
  goal_zh: 以白衣长者身深入世俗诸地示现佛法不离世间
  summary: 已曾供养无量诸佛、深植善本得无生忍后，以善方便居毗耶离，资财无量摄贫民，奉戒摄毁禁，忍行摄恚怒，精进摄懈怠，禅寂摄乱意，虽服宝饰以相好严身，入治正法、讲论、学堂、淫舍、酒肆、四衢，皆饶益众生而不染著
  phases:
  - key: brewing
    name: 深植善本
    labels:
      zh: 供养无量诸佛
    start_date: '-0470'
    highlight_event_id: guji-维摩诘-event-endeavor1-brewing
  - key: breakthrough
    name: 得忍通达方便
    labels:
      zh: 得无生忍游戏神通
    start_date: '-0460'
    highlight_event_id: guji-维摩诘-event-endeavor1-breakthrough
  - key: climax
    name: 方便居毗耶离
    labels:
      zh: 白衣摄众不著三界
    start_date: '-0450'
    highlight_event_id: guji-维摩诘-event-endeavor1-climax
  - key: closure
    name: 威仪圆成众所尊敬
    labels:
      zh: 诸佛咨嗟天人所敬
    start_date: -0448
    highlight_event_id: guji-维摩诘-event-endeavor1-closure
  decisions:
  - date: '-0450'
    title_zh: 示现白衣而持沙门律行
    rationale: 欲度在家众故不现出家相，却以居家身严持净戒，使世人知佛法不离世间而生信向
  - date: -0449
    title_zh: 入诸异道及世俗戏处不毁正信
    rationale: 若不入其舍则无由化导，故受诸异道、明世典、至博弈淫舍酒肆，皆为示欲过、立正志而摄化
- id: guji-维摩诘-endeavor-2
  title_zh: 示疾说法显不二法门
  goal_zh: 以身疾为缘召集问疾众，广说身无常与佛身功德，弹诃声闻执相以显入不二法门
  summary: 以方便现身有疾，致国王大臣长者居士及佛遣声闻来问疾，因说身如聚沫泡炎芭蕉幻梦影声、电光浮云无主无我不净虚伪，劝乐佛身即法身，并呵舍利弗宴坐、目连说法、迦叶乞食、须菩提乞食等滞于小乘相，令无数千人发阿耨多罗三藐三菩提心
  phases:
  - key: brewing
    name: 方便示疾
    labels:
      zh: 自念寝疾待佛垂愍
    start_date: '-0446'
    highlight_event_id: guji-维摩诘-event-endeavor2-brewing
  - key: breakthrough
    name: 声闻辞遣
    labels:
      zh: 四大声闻皆自言不堪任
    start_date: '-0446'
    highlight_event_id: guji-维摩诘-event-endeavor2-breakthrough
  - key: climax
    name: 广为说法呵小显大
    labels:
      zh: 说身无常呵宴坐乞食等执
    start_date: '-0445'
    highlight_event_id: guji-维摩诘-event-endeavor2-climax
  - key: closure
    name: 令众发心
    labels:
      zh: 无数千人发大菩提心
    start_date: '-0445'
    highlight_event_id: guji-维摩诘-event-endeavor2-closure
  decisions:
  - date: '-0446'
    title_zh: 以疾为方便召感问疾
    rationale: 若无疾则贵贱不集，借身疾广聚国王大臣及佛弟子，一时说法度众最便
  - date: '-0445'
    title_zh: 直呵声闻小乘法相以显大乘空观
    rationale: 舍利弗著宴坐相、目连著说法相、迦叶著乞贫相、须菩提著福田相，皆未达诸法如幻、法无戏论，故须破相令入不二
