  date: '-0446'
  year_of: '-0446'
  place_zh: 庵罗树园
  description: 佛次遣舍利弗、大目揵连、大迦叶、须菩提、富楼那等往问疾，皆自述昔被维摩诘呵宴坐、说法、乞食等事而辞不堪任
- id: guji-维摩诘-event-endeavor2-climax
  title_zh: 因疾广说身无常及呵小乘
  date: '-0445'
  year_of: '-0445'
  place_zh: 毗耶离方丈室
  description: 为诸问疾者说法：是身无常无强无力速朽，不可信，为苦众病所集，如聚沫泡炎芭蕉幻梦影声浮云电光，四大为家阴界诸入合成，当乐佛身即法身从无量功德智慧生，呵声闻著相令发大心
- id: guji-维摩诘-event-endeavor2-closure
