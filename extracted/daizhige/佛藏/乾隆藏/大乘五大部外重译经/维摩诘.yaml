  date: '-0445'
  year_of: '-0445'
  place_zh: 毗耶离
  description: 如应说法令无数千人皆发阿耨多罗三藐三菩提心，后文殊问疾演不二法门默然无言显真实义
- id: guji-维摩诘-event-death
  title_zh: 示现无常入涅槃
  date: '-0410'
  year_of: '-0410'
  place_zh: 毗耶离
  description: 住世化缘已毕，示现身疾无常而入涅槃，留方丈之教为后世在家菩萨典范
