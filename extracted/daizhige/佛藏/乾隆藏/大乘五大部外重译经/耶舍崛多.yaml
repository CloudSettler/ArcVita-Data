endeavors:
- id: guji-耶舍崛多-endeavor-1
  title_zh: 奉诏译出十一面观世音神咒经
  summary_zh: 于北周长安与众译梵为汉，译出十一面观世音神咒经一卷，备载根本咒及咒水咒衣等诸支咒与功德利益
  phases:
  - key: brewing
    name: 天竺习咒
    labels:
      zh: 积学
    start_date: '0540-01-01'
    highlight_event_id: guji-耶舍崛多-event-birth
  - key: breakthrough
    name: 西行入周
    labels:
      zh: 入华
    start_date: '0565-01-01'
    highlight_event_id: guji-耶舍崛多-event-into-zhou
  - key: climax
    name: 长安译经
    labels:
      zh: 译经
    start_date: '0570-01-01'
    highlight_event_id: guji-耶舍崛多-event-translate
  - key: closure
    name: 经本流通
    labels:
      zh: 流布
    start_date: '0572-01-01'
    highlight_event_id: guji-耶舍崛多-event-circulate
  decisions:
  - date: '0570-03-01'
    title_zh: 决以音译存咒体
    rationale: 陀罗尼以音声为用，强译其义则失神力，故存梵音以汉字转写，兼加归命偈首
  - date: '0570-06-01'
    title_zh: 增译支咒与仪轨
    rationale: 恐学人但得根本咒不知用法，故并译咒水咒衣咒香等七种支咒及结界护身之法
- id: guji-耶舍崛多-endeavor-2
  title_zh: 开示观音密法道场仪轨
  summary_zh: 依经详述造十一面像法、斋戒道场、献供护摩、结界治病等行法，使持咒者现世得十种果报临终见佛
  phases:
  - key: brewing
    name: 参究仪轨
    labels:
      zh: 研仪
    start_date: '0568-01-01'
    highlight_event_id: guji-耶舍崛多-event-into-zhou
  - key: breakthrough
    name: 宣说功德
    labels:
      zh: 显德
    start_date: '0570-01-01'
    highlight_event_id: guji-耶舍崛多-event-translate
  - key: climax
    name: 建立道场法
    labels:
      zh: 立法
    start_date: '0571-01-01'
    highlight_event_id: guji-耶舍崛多-event-ritual
  - key: closure
    name: 随方救护
    labels:
      zh: 济众
    start_date: '0573-01-01'
    highlight_event_id: guji-耶舍崛多-event-circulate
  decisions:
  - date: '0571-02-01'
    title_zh: 详定十一面像制
    rationale: 依经具刻十一面三面菩萨三面嗔面等相，顶戴弥陀以显大悲本源，使观者生信
  - date: '0571-08-01'
    title_zh: 制十五日斋戒护摩仪
    rationale: 约束身口意以净为本，定一日至十五日三时持诵、香华供养、沉水护摩一千八段以感圣应
events:
- id: guji-耶舍崛多-event-birth
  title_zh: 天竺出生
  date: '0520-01-01'
  year_of: '0520'
  precision: century
  is_circa: true
  location_zh: 天竺
  description_zh: 耶舍崛多生于天竺，少出家习大乘密教，为持咒仙人中研习陀罗尼者
- id: guji-耶舍崛多-event-into-zhou
  title_zh: 入宇文周至长安
  date: '0565-01-01'
  year_of: '0565'
  precision: year
  is_circa: true
  location_zh: 长安
  description_zh: 以三藏法师身份西行入华，至北周都城长安，获朝廷礼敬预译场
- id: guji-耶舍崛多-event-translate
  title_zh: 译佛说十一面观世音神咒经一卷
  date: '0570-01-01'
  year_of: '0570'
  precision: year
  is_circa: true
  location_zh: 长安译场
  description_zh: 于王舍城耆阇崛山会上观世音陈说十一面心咒之缘起，奉诏译为汉文，具载根本咒、咒水咒衣等咒及昼夜百八遍持验得十种现报四种后报
- id: guji-耶舍崛多-event-ritual
  title_zh: 宣演道场治病结界诸法
  date: '0571-06-01'
  year_of: '0571'
  precision: year
  is_circa: true
  location_zh: 长安道场
  description_zh: 依经开示造一尺三寸十一面像、七肘道场、香汤净衣、月蚀酥治、芥子护摩、白綖系颈等除病禳疫息敌之法
- id: guji-耶舍崛多-event-circulate
  title_zh: 经法流通众共受持
  date: '0572-01-01'
  year_of: '0572'
  precision: year
  is_circa: true
  location_zh: 长安
  description_zh: 经译既成，大众绕佛赞叹受持，十一面观世音法门遂广行于北周，行者依教立坛持咒救诸苦恼
- id: guji-耶舍崛多-event-death
  title_zh: 示寂
  date: '0585-01-01'
  year_of: 0585
  precision: century
  is_circa: true
  location_zh: 长安
  description_zh: 译事既毕，耶舍崛多于北周末后示寂，后世以其所译神咒经为观音密法要典
