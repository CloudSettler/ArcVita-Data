  archetype: 译经三藏
  dilemmas:
  - 梵咒汉译当以音译存真抑或义译便解，二者难兼恐失神力
  - 密咒广宣易生轻慢，秘传显说之间当如何择机契理
  - 蕃僧入华度越语言关山，欲令正法得弘又恐译失本旨
  lesson: 咒以音为体译以信为本，依经立仪轨使众生昼夜受持即得离诸障难
  summary_first_person: 吾天竺三藏耶舍崛多，负笈入宇文周至长安，承诏译十一面观世音神咒一卷，具显持咒功德与道场仪轨，愿一切持诵者无病无横见佛往生
