  archetype: 护法仁王
  dilemmas:
  - 以王法治世当行刑戮威慑还是以慈恕四摄安民
  - 于无常王位与五欲胜乐中如何求现世安稳与来世善趣
  - 护国当恃武力财货还是当恭敬三宝转正法轮
  lesson: 为王者当以布施爱语利行同事四摄摄民，薄敛省役赏贤黜恶，恭敬三宝护持正法，观身国财位皆无常灭坏而常修善法持陀罗尼
  summary_first_person: 吾乃憍萨罗胜光天子，严驾出室罗伐诣逝多林礼问世尊为国主法，蒙佛开示舍恶修善、四摄育民、敬护三宝、观无常及授胜幡陀罗尼，自此愿以正法化世，不行非法，令国内风调雨顺率土太平
