events:
- id: guji-胜光天子-event-birth
  title_zh: 胜光降生憍萨罗王族
  date: -376
  year_of: -376
  place_zh: 憍萨罗国室罗伐城
  description_zh: 憍萨罗国王子胜光生于王族，后绍王位为胜光天子，与释迦如来并世
- id: guji-胜光天子-event-enthroned
  title_zh: 绍位为憍萨罗国王
  date: -352
  year_of: -352
  place_zh: 憍萨罗国
  description_zh: 绍继王位掌军国之务，统象马车步，居五盛事髻珠白盖白拂宝履宝剑
- id: guji-胜光天子-event-audience
  title_zh: 严驾诣逝多林礼佛问王法
  date: -320
  year_of: -320
  place_zh: 室罗伐城逝多林给孤独园
  description_zh: 遥见如来坐树下说法如师子王，下车整衣弃五盛事着常人服，偏露右肩合掌礼足右绕三匝，请问为国主法令现受安乐后生天上乃至菩提相续
- id: guji-胜光天子-event-impermanence
  title_zh: 闻佛说无常四山偈喻
  date: -320
  year_of: -320
  place_zh: 逝多林
  description_zh: 佛以梦苑、大树落果、日月磨灭、四山压众、师子搏鹿喻老病死失势及死苦逼迫，令观王位寿命象马妃后库藏皆无常灭坏无我主宰勿为放逸
- id: guji-胜光天子-event-governance
  title_zh: 奉教授国以四摄薄赋护三宝
  date: -0498
  year_of: -0498
  place_zh: 憍萨罗国
  description_zh: 归国后以四摄恩育臣民，薄为赋敛省徭役，设官不繁赏贤罚恶远不忠，恭敬三宝拥护正法，遂得龙王欢喜风雨顺时诸天庆悦
- id: guji-胜光天子-event-dharani
  title_zh: 受持胜幡陀罗尼
  date: -320
  year_of: -320
  place_zh: 逝多林
  description_zh: 佛授胜幡陀罗尼咒曰南谟释迦牟奈曳等，敕令日日清净澡漱诵七遍能消罪障长福因于生死中为善伴救济
- id: guji-胜光天子-event-propagate
  title_zh: 顶戴流通教国人诵习
  date: -0495
  year_of: -0495
  place_zh: 憍萨罗国
  description_zh: 闻法欢喜合掌白佛愿常流通举国诵习，佛印可善哉令如说行勿放逸，由是王法经广行国中名闻遍满十方外国咸称仁让忠孝第一
- id: guji-胜光天子-event-prosperity
  title_zh: 国土太平称大法王
  date: -0492
  year_of: -0492
  place_zh: 憍萨罗国
  description_zh: 依教行故国内丰乐安隐灾横皆除，王身快乐永保胜位福力延长，外国诸王赞叹归伏舍身后得生天上受胜妙乐
- id: guji-胜光天子-event-death
  title_zh: 胜光王命终
  date: -0490
  year_of: -0490
  place_zh: 憍萨罗国
  description_zh: 观身如空树被烧终归离散，虽具宫殿象马婇女终入寒林为狐狼雕鹫所食，然以正法善业及陀罗尼护念随业受报趣向善趣
