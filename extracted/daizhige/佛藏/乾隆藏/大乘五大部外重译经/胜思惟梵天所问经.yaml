  - date: '-0600'
    title_zh: 决意以十种清净坚固心游娑婆
    rationale: 虽闻娑婆多垢多斗诤，然知于秽土须臾行慈忍辱胜净土百千劫梵行，故不畏轻毁供养、善恶愚智，坚持平等大悲而往
  - date: '-0600'
    title_zh: 率万二千菩萨俱行
    rationale: 欲令大众同见释迦牟尼、同闻一味法、同修不退行，故与同愿菩萨共发一心定意而行，广集法侣
- id: guji-胜思惟梵天所问经-endeavor-2
  title_zh: 辨正问演正性
  summary_zh: 应网明童子所问，破我他生灭染净等邪问相，开示无得无取无法见的正问及离自性离欲际的诸法正性，显如来不度生死不入涅槃的平等实相
  phases:
  - key: brewing
