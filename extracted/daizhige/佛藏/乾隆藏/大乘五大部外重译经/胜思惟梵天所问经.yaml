  reign_ref: 释迦牟尼佛住王舍城迦兰陀竹林说法时
  archetype: 叩法梵天
  dilemmas:
  - 净土安逸与秽土历练之辨：留于无三恶道的清洁国土安稳修行，还是以十种清净坚固心游行多垢多难的娑婆世界亲近释迦牟尼佛
  - 正问与邪问之辨：以我见他见分别法而问，还是以无我无他无法的平等法位而问
  - 生死与涅槃之执：是否实有众生可出离生死而入涅槃，还是本无往来染净皆属妄想分别
  lesson: 于毁誉善恶愚智中以平等慈悲而行，不见他人过失，不执二相，知诸法离自性离欲际即是正性，于秽土忍难护法胜过净土亿劫梵行
  summary_first_person: 我本是东方清洁国土月光明佛所的梵天菩萨，名胜思惟，住不退轮。蒙释迦牟尼佛光明照身，奉月光明佛敕，以十种清净坚固心与万二千菩萨俱来娑婆世界王舍城竹林，顶礼释迦牟尼佛。佛赞我为一切正问菩萨中最为第一，我遂以云何心坚固不疲惓等二十问请法，复与网明童子辩正问与法性平等，演说诸法离自性、无得无分别即所作已办，于秽土示现求法不畏难行的本愿。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E8%83%9C%E6%80%9D%E6%83%9F%E6%A2%B5%E5%A4%A9%E6%89%80%E9%97%AE%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E8%83%9C%E6%80%9D%E6%83%9F%E6%A2%B5%E5%A4%A9%E6%89%80%E9%97%AE%E7%BB%8F.html
