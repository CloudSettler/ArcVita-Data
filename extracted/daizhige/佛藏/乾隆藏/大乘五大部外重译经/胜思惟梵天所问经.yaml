  location: 娑婆世界王舍城迦兰陀竹林
  year_of: 释迦牟尼佛住王舍城竹林时
  summary_zh: 礼拜月光明佛后，与万二千同愿菩萨忽然不现，譬如壮士屈伸臂顷至娑婆，头面礼足右绕三匝却住一面
- id: guji-胜思惟梵天所问经-event-praise
  title_zh: 获佛印为正问第一
  date: '-0600'
  precision: century
  is_circa: true
  raw: 佛告网明此梵天于一切正问善巧说法等为最第一
  location: 王舍城迦兰陀竹林
  year_of: 释迦牟尼佛住王舍城竹林时
  summary_zh: 释迦牟尼佛当众赞叹我于一切正问、善巧说法、美妙音声、先意问讯、无障碍密语、慈悲喜舍善问疑心等皆为第一
- id: guji-胜思惟梵天所问经-event-twentyquestions
  title_zh: 偈赞并陈二十种四法要问
  date: '-0600'
  precision: century
  is_circa: true
  raw: 云何心坚固不疲惓等二十问
  location: 王舍城迦兰陀竹林
  year_of: 释迦牟尼佛住王舍城竹林时
  summary_zh: 以偈赞佛舍净土处秽土之大悲后，次第请问云何心不疲惓、言不中悔、增长善根白法、知地地相、善知方便教化等二十事，佛各以四法答之，时二万二千天人发菩提心、五千菩萨得无生忍
- id: guji-胜思惟梵天所问经-event-rightquestion
  title_zh: 与网明童子辩正问与邪问
  date: '-0600'
  precision: century
  is_circa: true
  raw: 网明问云何为正问
  location: 王舍城迦兰陀竹林
  year_of: 释迦牟尼佛住王舍城竹林时
  summary_zh: 应网明问，广破以我他法、生灭是处非处、染净生死涅槃、得取证等分别而问为邪，正问乃无我无他无法、无生无灭无染净无得无依止处而问
- id: guji-胜思惟梵天所问经-event-truenature
  title_zh: 开示诸法正性离自性
  date: '-0600'
  precision: century
  is_circa: true
  raw: 诸法离自性离欲际是名正性
  location: 王舍城迦兰陀竹林
  year_of: 释迦牟尼佛住王舍城竹林时
  summary_zh: 明一切法正即不可思议寂静，邪即思议分别；诸法正性不一不多，无已得今得当得，勤行此则不戏诸法、不住世间不住涅槃
- id: guji-胜思惟梵天所问经-event-assent
  title_zh: 佛印可正性说大众得益
  date: '-0600'
  precision: century
  is_circa: true
  raw: 佛赞善哉二千比丘漏尽解脱
  location: 王舍城迦兰陀竹林
  year_of: 释迦牟尼佛住王舍城竹林时
  summary_zh: 佛赞我所说即诸法正性，说时二千比丘不受诸法漏尽解脱，五百比丘闻无世间无涅槃而起疑，显平等法门甚深难信
- id: guji-胜思惟梵天所问经-event-death
  title_zh: 无示现灭度常住法性
  date: ''
  precision: unknown
  is_circa: true
  raw: 住不退轮不断佛种
  location: 法界
  year_of: 释迦牟尼佛住王舍城竹林后
  summary_zh: 以毕竟成就四法不断佛种、得无生忍、不由他教行六度、于佛法不退转故，无有实灭，示现常住随缘教化
