  summary_zh: 白月光明佛欲诣娑婆，佛敕应以毁誉无增减、善恶等慈、愚智等悲、众生平等、轻毁供养无二等十心游彼秽土，我默然领受
- id: guji-胜思惟梵天所问经-event-arrival
  title_zh: 与万二千菩萨瞬至娑婆竹林
  date: '-0600'
