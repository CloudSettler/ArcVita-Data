    highlight_event_id: guji-胜思惟梵天所问经-event-rightquestion
  - key: climax
    name: 说法正性
    labels:
      zh: 离自性正性
    start_date: '-0600'
    highlight_event_id: guji-胜思惟梵天所问经-event-truenature
  - key: closure
    name: 印可化众
    labels:
      zh: 佛印二千得解脱
    start_date: '-0600'
    highlight_event_id: guji-胜思惟梵天所问经-event-assent
  decisions:
  - date: '-0600'
    title_zh: 以无见而答正问
    rationale: 若以我见他见法见、生灭染净分别而问则成邪问，唯有无我无他无法、无生无灭无染净处而问，方契法位平等故如是开示
  - date: '-0600'
    title_zh: 不立生死涅槃二相而说法
    rationale: 为化度妄想分别生死涅槃二相者，非实有往来出入；诸法平等无染无净，故不令众生离世间亦不令得涅槃，直示无得无分别即所作已办
