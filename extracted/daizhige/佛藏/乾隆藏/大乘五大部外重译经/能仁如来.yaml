endeavors:
- id: guji-如来独证自誓三昧经-endeavor-1
  title_zh: 独证自誓三昧成就萨云若
  summary_zh: 于兜术天毕寿下降，观国邑众生，示现宫中、出四门、入山坐贝多树，以法为师、净居为证，自落须发、被天缯袈裟，立千八百戒证，现裂金刚座，降魔具三达六通而成正觉
  phases:
  - key: brewing
    name: 兜术观机与降神观刹
    labels:
      zh: 观机择地
    start_date: -0624-01-01
    highlight_event_id: guji-如来独证自誓三昧经-event-conceive
  - key: breakthrough
    name: 贝多树下自誓出家
    labels:
      zh: 自誓出家
    start_date: -0594-02-08
    highlight_event_id: guji-如来独证自誓三昧经-event-renunciation
  - key: climax
    name: 戒证现前金刚座裂降魔成道
    labels:
      zh: 降魔成道
    start_date: -0588-12-08
    highlight_event_id: guji-如来独证自誓三昧经-event-enlightenment
  - key: closure
    name: 灵瑞莲华普现恒沙佛遣菩萨赠华供养
    labels:
      zh: 诸佛赠华
    start_date: -0588-12-08
    highlight_event_id: guji-如来独证自誓三昧经-event-lotus
  decisions:
  - date: -0594-02-08
    title_zh: 不待师剃以净居为证自誓出家
    rationale: 信根内固、宿习六度，以先佛出家法为师、梵天为证，自执剃刀去发，证去家坚固不退转之志
  - date: -0588-12-08
    title_zh: 立千八百戒证以空净为体
    rationale: 持禁戒无形无著、齐等万物不求利养，观诸想不起、中外俱寂，以戒证启金刚座，制魔宫动而显正觉
- id: guji-如来独证自誓三昧经-endeavor-2
  title_zh: 句潭弥转大乘法轮授决普度
  summary_zh: 游句潭弥大丛树交露精舍独证自誓道场，放光普照恒沙刹土，说佛三笑因缘，授决童真、了生、阿惟颜无数众生，复为末世比丘立五证出家法及持戒要义
  phases:
  - key: brewing
    name: 放光普照恒沙相见
    labels:
      zh: 光明普照
    start_date: -0588-12-09
    highlight_event_id: guji-如来独证自誓三昧经-event-light
  - key: breakthrough
    name: 说三笑因缘授决诸菩萨
    labels:
      zh: 说笑授决
    start_date: -0587-01-01
    highlight_event_id: guji-如来独证自誓三昧经-event-smile
  - key: climax
    name: 开示自誓出家戒证与萨披袈裟
    labels:
      zh: 开示戒证
    start_date: -0587-02-01
    highlight_event_id: guji-如来独证自誓三昧经-event-precept
  - key: closure
    name: 立摩诃迦叶五证为末世师范
    labels:
      zh: 立五证法
    start_date: -0587-03-01
    highlight_event_id: guji-如来独证自誓三昧经-event-kasyapa
  decisions:
  - date: -0587-01-01
    title_zh: 以三笑因缘明示授决之时
    rationale: 明佛不妄笑，一为菩萨向不退转、二为向阿惟颜具圣慧、三为兜术菩萨下降成佛遍告恒沙，令众生知时节因缘而发大乘心
  - date: -0587-03-01
    title_zh: 为末世制五证出家法以净居天子为证
    rationale: 鉴比丘分散诤讼，敕以远欲、远俗、远名誉、远形法、远内外求五舍为证，若无僧众则慕迦叶法以天为证，若有僧则必求僧为证以尊三宝
events:
- id: guji-如来独证自誓三昧经-event-birth
  title_zh: 迦毗罗卫降神诞生
  date: -0623-04-08
  year_of: -403
  place_zh: 迦毗罗卫国
  description_zh: 刹利太子降神五浊，转轮圣王种，具三十二相，为后成独证自誓之本生
- id: guji-如来独证自誓三昧经-event-conceive
  title_zh: 兜术天宫观三千刹土择机降神
  date: -0624-01-01
  year_of: -404
  place_zh: 兜术天宫
  description_zh: 毕天寿入究竟广现三昧，观国邑宽狭、众生软和，择天竺清净仁和之处议集降神
- id: guji-如来独证自誓三昧经-event-renunciation
  title_zh: 感四非常自誓出家去发被衣
  date: -0594-02-08
  year_of: -0594
  place_zh: 贝多树下
  description_zh: 净居天子劝进，帝释化老病死，诣贝多树忆先佛法，帝释授剃刀自落肉髻，净居授天缯袈裟，恒沙诸佛共送袈裟合成萨披佛头震越之服
- id: guji-如来独证自誓三昧经-event-enlightenment
  title_zh: 树下戒证金刚座现降魔成等正觉
  date: -0588-12-08
  year_of: -0588
  place_zh: 贝多树金刚座
  description_zh: 立净本千八百戒，不动诸想，座从地裂出，魔宫倾动，三千世界六反震动，具三达六通三十七品十力四无畏
- id: guji-如来独证自誓三昧经-event-lotus
  title_zh: 宝莲华座清香彻十方诸佛遣使赠华
  date: -0588-12-08
  year_of: -0588
  place_zh: 贝多树道场
  description_zh: 初得佛光景甚明，宝莲千叶叶有化菩萨，恒沙如来各执莲华遣菩萨致敬赞言超次在弥勒前，能仁手受分华散恒沙诸佛
- id: guji-如来独证自誓三昧经-event-light
  title_zh: 口光普照恒沙众生蒙光得度
  date: -0588-12-09
  year_of: -0588
  place_zh: 忍界及恒沙世界
  description_zh: 光从口出绕身三匝，照彻地狱天人，众生得慧观宿命，百千众生同发无上道心
- id: guji-如来独证自誓三昧经-event-smile
  title_zh: 句潭弥说佛笑三因缘广授决
  date: -0587-01-01
  year_of: -0587
  place_zh: 句潭弥国大丛树交露精舍独证自誓道场
  description_zh: 告贤儒菩萨佛笑三缘，七十亿那术得童真、六十亿那术得了生、三十亿那术得阿惟颜，比丘得阿罗汉，天人得法眼
- id: guji-如来独证自誓三昧经-event-precept
  title_zh: 开示禁戒空净无著之真戒
  date: -0587-02-01
  year_of: -0587
  place_zh: 句潭弥道场
  description_zh: 示禁戒无形无我无人无作无住，守空行寂、慈悲四等、不从他人法，于佛法中得泥洹为真持戒
- id: guji-如来独证自誓三昧经-event-kasyapa
  title_zh: 立摩诃迦叶五证为末世出家轨范
  date: -0587-03-01
  year_of: -0587
  place_zh: 贝多树下
  description_zh: 说昔受岁以净居为证之缘，立远欲、远俗、远名誉、远形法、远求五证，迦叶依此具五通后见佛具六通，为末世无师者师范
- id: guji-如来独证自誓三昧经-event-death
  title_zh: 拘尸那揭罗娑罗林入般泥洹
  date: -0543-02-15
  year_of: -355
  place_zh: 拘尸那揭罗
  description_zh: 自句潭弥说法讫，分布舍利，示现灭度，然法身空净不空，独证三昧常住化度
