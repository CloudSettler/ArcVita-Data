person:
  qid: guji-如来独证自誓三昧经
  name_zh: 能仁如来
  names:
    zh: 能仁如来
    en: Shakyamuni Tathagata
  lifespan:
    birth:
      date: -0623-04-08
      precision: year
      is_circa: true
      raw: 约公元前623年迦毗罗卫降生
    death:
      date: -0543-02-15
      precision: year
      is_circa: true
      raw: 约公元前543年拘尸那揭罗入泥洹
  birth_date: -0623-04-08
  death_date: -0543-02-15
  era: 古印度列国时代
  reign_ref: 迦毗罗卫刹利种
  archetype: 圣者与自觉者
  dilemmas:
  - dilemma: 独证自誓无需师证与以法为师、以天为证之张力
    choice: 以舍离欲染、净戒、空寂为自誓，以先佛法为师、净居天为证，示现独证而非法外自创
  - dilemma: 住世教化与独处证真之抉择
    choice: 于贝多树下成等正觉后，不住独证三昧而转大乘法轮，普令恒沙世界众生蒙光得度
  lesson: 自誓不离法，自证不离师；独证非孤证，以戒定慧为证、以空净为体，方能总持度无极而普济群生
  summary_first_person: 吾为忍界能仁，降神五浊，独证自誓三昧于句潭弥大丛树间。六年研精，裂坐金刚座，降魔成道，普现灵瑞莲华，遣化遍恒沙。吾笑非妄，授决童真、了生、阿惟颜者，示戒证空净、不著三界，令比丘以法为师、以舍为证，普度天人同会道场。
