    en: Womb Girl Bodhisattva
  lifespan:
    birth:
      date: -0500-01-01
      precision: century
      is_circa: true
      raw: 佛在罗阅只说法时于千叶宝莲上化生
    death:
      date: -0450-01-01
      precision: century
      is_circa: true
      raw: 经典未载涅槃，菩萨示现无生灭
  birth_date: -0500-01-01
  death_date: -0450-01-01
  era: 古印度列国时代
  reign_ref: 释迦牟尼佛住世时期
  archetype: 胎中闻法·菩萨示现
  dilemmas:
  - 女身苦厄与菩提大愿之冲突，如何以女身示现说法度众
  - 天衣小果与法衣功德之别，如何显明菩萨位次超胜罗汉
  - 男女形相执着与本无定相之破，如何令众妇离女身执念
  lesson: 男女本无定相，唯在一念菩提心，发心为菩萨即为大丈夫，不以形相限道业
  summary_first_person: 我自东南方清净佛刹来，寄迦罗妇胎中，叉手听佛说十善十恶及离贪嗔痴之要，地动莲生，本刹法衣自至，愿令一切女众皆发无上正真道意，知一切法无男女相。
