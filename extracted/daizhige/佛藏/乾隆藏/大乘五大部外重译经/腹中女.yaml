  decisions:
  - date: -0500-01-02
    title_zh: 拒释提桓因天衣
    rationale: 明菩萨功德自感三十二相八十种好之装严，不假罗汉天趣小果之服
  - date: -0500-01-02
    title_zh: 劝母及众妇发菩萨心
    rationale: 告以女身如机关骨节、畏人恶露，唯发菩提心为疾得男子身之正因，非佛能强与
  - date: -0500-01-03
    title_zh: 化作八岁沙弥身
    rationale: 破一切人谓我是女之执，显男女无定、当作至诚行
events:
- id: guji-腹中女-event-birth
  title_zh: 胎中答佛后莲华化生
  date: -0500-01-01
  year_of: '-0500'
  precision: century
  is_circa: true
  raw: 佛在罗阅只说法时答佛竟便生
  location: 罗阅只王舍城
  description: 迦罗妇腹中女叉手答佛十善十恶之问竟，如太子从右胁生，地六反震动，虚空音乐雨华，现千叶宝莲大如车轮以琉璃为茎，女坐其上
- id: guji-腹中女-event-womb-qa
  title_zh: 胎中叉手对佛宣法
  date: -0500-01-01
  year_of: '-0500'
  precision: century
  is_circa: true
  raw: 佛以八种声问腹中女
  location: 罗阅只法会
  description: 佛现大光明照迦罗妇令众见腹中女叉手，以八音问其何故，女承佛威神答以世人行十恶当行十善、贪淫嗔痴生死不绝、不孝父母不供沙门故叉手听经
- id: guji-腹中女-event-heaven-robe
  title_zh: 拒天衣感本刹法衣获五通
  date: -0500-01-02
  year_of: '-0500'
  precision: century
  is_circa: true
  raw: 莲华化生后事
  location: 罗阅只法会
  description: 忉利天王释持天衣来与，女拒言汝为罗汉我为菩萨非同类不着此衣，佛证菩萨发心至三十二相乃为庄严，顷刻本刹清净国法衣自然飞来着身即得五通，一举足地复六震
- id: guji-腹中女-event-convert-75
  title_zh: 度化七十五迦罗妇转女成男出家
  date: -0500-01-02
  year_of: '-0500'
  precision: century
  is_circa: true
  raw: 化生后绕佛请法时
  location: 罗阅只法会
  description: 女绕佛三匝请为诸迦罗妇说得男身法，佛说发菩提心及观女身如机关恶露，七十五妇闻法发菩萨心，脱珠璎散佛化作交露宝帐，飞空雨华即得男子身，佛令弥勒授戒为比丘，七十五夫亦来俱出家
- id: guji-腹中女-event-mother-offering
  title_zh: 劝母发心以化华盖供佛
  date: -0500-01-02
  year_of: '-0500'
  precision: century
  is_circa: true
  raw: 度众妇后
  location: 罗阅只法会
  description: 女以自然七重化华盖与母，言佛为天上天下度人师令母供养，母自述怀妊时梦见佛法僧离贪嗔痴并发心，持盖上佛地复六震
- id: guji-腹中女-event-transform-sramana
  title_zh: 化现八岁沙弥破男女相
  date: -0500-01-03
  year_of: '-0500'
  precision: century
  is_circa: true
  raw: 说法度众竟
  location: 罗阅只法会
  description: 女言一切人谓我是女当作至诚行，便化作八岁沙弥身，显男女无定相，时无央数人皆发无上正真道意，佛说经竟大众欢喜
- id: guji-腹中女-event-death
  title_zh: 示现无终菩萨无灭
  date: -0450-01-01
  year_of: '-0450'
  precision: century
  is_circa: true
  raw: 经典未载涅槃
  location: 清净佛刹
  description: 本为清净刹菩萨示现，度缘既毕还归本刹，未示现涅槃，经典但云前后所度父母不可称数
