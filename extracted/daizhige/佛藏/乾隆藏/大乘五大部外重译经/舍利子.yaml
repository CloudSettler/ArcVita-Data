  title_zh: 生于王舍城婆罗门村
  description_zh: 舍利之子，八岁通四韦陀，十六论胜诸师，后与目连共师删阇耶，怀出离心
  year_of: '-0550'
- id: guji-舍利子-event-ordination
  date: -0528
  precision: year
  is_circa: true
  raw: 约公元前528年
  title_zh: 闻因缘偈归依世尊
  description_zh: 于王舍城逢马胜比丘闻诸法因缘生偈，豁然得法眼，与目连将众二百五十人同诣耆阇崛山皈佛出家，七日证阿罗汉
  year_of: -0528
- id: guji-舍利子-event-daogan-question
  date: -0486
  precision: year
  is_circa: true
  raw: 约公元前486年
  title_zh: 耆阇崛山稻芋会上问弥勒
  description_zh: 世尊观稻芋告比丘若见因缘即见法若见法即见佛而默然，吾往弥勒经行处盘陀石上共坐，作四问请说因缘法佛之义
  year_of: -0486
- id: guji-舍利子-event-understand-pratitya
  date: -0486
  precision: year
  is_circa: true
  raw: 约公元前486年
  title_zh: 获弥勒广说内外因缘及五观
  description_zh: 蒙弥勒答以十二支顺逆、八圣道涅槃为法、一切智法身为佛，广陈外种芽六界和合、内六界十二支、业为田爱为润无明为粪识为种子及镜月火喻，明不常不断不移小因大果相似五义，顿了缘生无寿离寿寂静无畏
  year_of: -0486
- id: guji-舍利子-event-death
  date: -0485
  precision: year
  is_circa: true
