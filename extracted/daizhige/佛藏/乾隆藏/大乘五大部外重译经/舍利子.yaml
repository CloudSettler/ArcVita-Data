    title_zh: 弃外道而归佛
    rationale: 闻诸法因缘生诸法因缘灭之偈，知师有真法，遂与目连将二百五十弟子同皈薄伽梵
  - date: '-0525'
    title_zh: 专以决疑请法为任
    rationale: 自以智慧利根，不以神通为先，愿为众决法义疑网，助佛转法轮
- id: guji-舍利子-endeavor-2
  title_zh: 稻秆会上请问因缘决疑
  summary_zh: 于王舍城耆阇崛山值佛观稻芋而说见缘见法见佛，默然而止，遂往弥勒经行处盘陀石上发问，因缘法佛云何，引发弥勒广说内外因缘十二支与五观
  phases:
