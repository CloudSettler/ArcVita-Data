  decisions:
  - date: -0486
    title_zh: 以四问诣弥勒
    rationale: 世尊略说见缘见法见佛而默然，必有深义，乃分何者因缘何者法何者佛云何见缘见法以问当来慈氏
  - date: -0486
    title_zh: 引内外缘起证无我业报
    rationale: 欲会外种芽六界和合与内识支业田爱润无明粪壤之喻，明虽无作者我所而因缘具足果现，破断常二见
events:
- id: guji-舍利子-event-birth
  date: '-0550'
  precision: year
