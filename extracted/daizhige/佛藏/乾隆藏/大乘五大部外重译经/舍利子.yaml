  reign_ref: 周景王至周敬王
  archetype: 智慧第一的声闻上首 · 请法决疑者
  dilemmas:
  - 世尊言见因缘即见法见法即见佛，三者云何次第安立而不堕常见断见
  - 外缘如种生芽无作无念而果现，内缘十二支相续无我我所，当何以破执而不坏因果业报
  lesson: 见缘起即见法，法性常住无作无为，离一合常寿之想，以正智观不常不断不移小因大果相似五义，方得无生法忍见法身佛
  summary_first_person: 吾于耆阇崛山闻世尊指稻芋而示见缘即见法，窃怀疑惑，乃诣盘陀石上问慈氏，何者因缘何者法何者佛，蒙慈氏广说内外二种因缘相应、五观缘生、镜月火喻，方知此有故彼有此灭故彼灭，无少法往来而业果不虚
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说稻秆经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/佛说稻秆经.html
