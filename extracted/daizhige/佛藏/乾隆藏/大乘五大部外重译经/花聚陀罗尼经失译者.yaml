    start_date: '0386-01-01'
    highlight_event_id: guji-huaju-shiyi-event-teaching-result
  - key: closure
    name: 付嘱后学欢喜奉行
    labels:
      zh: 付嘱奉行
    start_date: '0390-01-01'
    highlight_event_id: guji-huaju-shiyi-event-teaching-result
  decisions:
  - date: '0385-02-08'
    title_zh: 择二月三月八月白月期设道场
    rationale: 顺经中所说时节因缘，令四众易于共修，昼夜六时不令心乱以求见佛说法
  - date: '0386-01-01'
    title_zh: 以小善大福劝进初发心者
    rationale: 引经中一华一灯一钱一水皆不堕恶道之语，令卑微供养者生大信心，进而受持陀罗尼得无碍辩才
