  decisions:
  - date: '0380-01-01'
    title_zh: 采用音译为主保留陀罗尼神力
    rationale: 陀罗尼以音声为用，义译易失持验，故存梵音如多狄他等，兼以汉文释功德仪轨
  - date: '0382-01-01'
    title_zh: 详载白月八日至十五日七日行法
    rationale: 为令在家出家皆得持验，具载澡浴净衣、悬幡供养、六时诵持及二七三七不见佛更诵之次第
- id: guji-huaju-shiyi-endeavor-2
  title_zh: 持咒弘传与道场教化
  title_en: Propagating Dharani Practice and Teaching
  description: 依经中佛在阿耨达多龙王宫告师子奋迅菩萨之说，劝众以华香灯泥水洒塔、一称南无佛及持花聚咒，积福远超布施声闻缘觉所得
  phases:
  - key: brewing
