      raw: 常住东方净琉璃世界未示涅槃
  birth_date: -3000-01-01
  death_date: '9999-12-31'
  era: 过去庄严劫
  reign_ref: 净琉璃世界
  archetype: 大医王如来
  dilemmas:
  - 众生多病贫寒无救无归王法系缚魔网缠缚当以何方便先令安乐后令入菩提
  - 破戒毁见诸根不具堕恶趣者何以令其还得清净具足智慧不退转
  lesson: 先以无量方便令众生衣食丰足众病除愈身心安乐后以法味毕竟安乐而建立之悲智愿行一体方能拔除业障
  summary_first_person: 吾于因地行菩萨道时见幽冥众生病苦逼切王法饥寒所困故发十二微妙上愿愿得菩提时身如琉璃光明照曜无边世界令诸有情如我无异诸根完具戒行清净资具丰足解脱一切忧苦今住东方过十殑伽沙佛土净琉璃世界与日光月光二菩萨持我正法宝藏若闻我名至心受持恭敬供养燃灯造幡放生修福皆得解脱横死安乐往生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/药师琉璃光如来本愿功德经.md
