person:
  qid: guji-莲华上如来
  name_zh: 莲华上如来
  names:
    zh: 莲华上如来
    en: Lianhuashang Tathagata
  lifespan:
    birth:
      date: -3000-01-01
      precision: dynasty
      is_circa: true
      raw: 栴檀世界月上如来住世时本名虚空印菩萨
    death:
      date: -2900-01-01
      precision: dynasty
      is_circa: true
      raw: 莲华世界住世三十小劫后入涅槃
  birth_date: -3000-01-01
  death_date: -2900-01-01
  era: 栴檀世界至莲华世界
  reign_ref: 月上如来
  archetype: 悲愿菩萨
  dilemmas:
  - 以本愿久住秽土济度众生与速求自证涅槃之间的取舍
  - 受持甚深陀罗尼广见十方诸佛与安住灭心三昧十小劫不动之间的行持
  - 现大神通摄化无量菩萨与默然说法令众自证之间的方便
  lesson: 大悲为本，入一切悲陀罗尼门，不舍一众生，方能转不退法轮证一切种智
  summary_first_person: 吾本名虚空印，于栴檀世界蒙月上如来授记，受入一切悲及一切种智行陀罗尼，十小劫安住而后于莲华世界夜证菩提，现舌覆大众毛孔放光之神通，转不退法轮，住世三十小劫度无量菩萨，方入涅槃
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%A4%A7%E4%B9%98%E5%A4%A7%E6%82%B2%E5%88%86%E9%99%80%E5%88%A9%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%A4%A7%E4%B9%98%E5%A4%A7%E6%82%B2%E5%88%86%E9%99%80%E5%88%A9%E7%BB%8F.md
endeavors:
- id: guji-莲华上如来-endeavor-1
  title_zh: 栴檀世界受记受持甚深陀罗尼
  phases:
  - key: brewing
    name: 亲近月上如来修菩萨行
    labels:
      zh: 亲近正法
    start_date: -3000-01-01
    highlight_event_id: guji-莲华上如来-event-授记
  - key: breakthrough
    name: 蒙月上如来授阿耨多罗三藐三菩提记
    labels:
      zh: 得授记
    start_date: -3000-06-01
    highlight_event_id: guji-莲华上如来-event-授记
  - key: climax
    name: 受入一切悲陀罗尼门并入一切种智行陀罗尼门
    labels:
      zh: 受持陀罗尼
    start_date: -3000-07-01
    highlight_event_id: guji-莲华上如来-event-受陀罗尼
  - key: closure
    name: 十小劫入灭心无诤三昧持法待时
    labels:
      zh: 持法待成
    start_date: -3000-08-01
    highlight_event_id: guji-莲华上如来-event-受陀罗尼
  decisions:
  - date: -3000-06-01
    title_zh: 立誓十小劫持正法不即入涅槃
    rationale: 为令正法住世饶益无量菩萨善根成就，故受月上如来付嘱入灭心三昧
  - date: -3000-07-01
    title_zh: 受持入一切悲陀罗尼门咒句
    rationale: 此陀罗尼摄四念处四圣种四无畏等诸法门，得此则能见十方诸佛现大神通广度众生
- id: guji-莲华上如来-endeavor-2
  title_zh: 莲华世界成佛转不退正法轮
  phases:
  - key: brewing
    name: 栴檀世界转名莲华世界庄严成就
    labels:
      zh: 世界庄严
    start_date: -2995-01-01
    highlight_event_id: guji-莲华上如来-event-成佛
  - key: breakthrough
    name: 昨夜于菩提问陀罗树下莲华座上成正觉
    labels:
      zh: 夜证菩提
    start_date: -2990-01-01
    highlight_event_id: guji-莲华上如来-event-成佛
  - key: climax
    name: 现广长舌及毛孔放光摄十方菩萨来集转不退轮
    labels:
      zh: 现通转轮
    start_date: -2990-01-02
    highlight_event_id: guji-莲华上如来-event-转法轮
  - key: closure
    name: 住世三十小劫说法正法住世十小劫后入涅槃
    labels:
      zh: 住世涅槃
    start_date: -2990-02-01
    highlight_event_id: guji-莲华上如来-event-涅槃
  decisions:
  - date: -2990-01-02
    title_zh: 先现神通摄众后还摄神通说法
    rationale: 欲令十方得三昧得授记菩萨皆见佛土庄严生欢喜心，然后闻不退转法得一生补处
  - date: -2990-02-01
    title_zh: 住世三十小劫不速入涅槃
    rationale: 为饶益安乐诸天世人成就大乘，令莲华世界菩萨皆寿四十小劫得闻佛声法声僧声
events:
- id: guji-莲华上如来-event-birth
  title_zh: 诞生为虚空印菩萨
  date: -3000-01-01
  year_of: -3000
  description: 栴檀世界月上如来住世时，已为菩萨摩诃萨，具慈润调静等心，发本愿欲于他方佛国度生
- id: guji-莲华上如来-event-授记
  title_zh: 月上如来授成佛记
  date: -3000-06-01
  year_of: -3000
  description: 月上如来欲般涅槃时告众，虚空印菩萨于正法灭尽后夜当成阿耨多罗三藐三菩提，号莲华上如来
- id: guji-莲华上如来-event-受陀罗尼
  title_zh: 受入一切悲陀罗尼门及入一切种智行陀罗尼门
  date: -3000-07-01
  year_of: -3000
  description: 月上如来说咒阇梨尼等句，令受金刚身那罗延三昧，十小劫为众说菩萨法藏，感大地震动妙光遍照十方
- id: guji-莲华上如来-event-成佛
  title_zh: 莲华世界昨夜成阿耨多罗三藐三菩提
  date: -2990-01-01
  year_of: -2990
  description: 于因陀罗菩提树下五百由旬莲华台上成佛，世界名莲华，琉璃为地宝树七宝台遍满，佛寿三十小劫
- id: guji-莲华上如来-event-转法轮
  title_zh: 现大神通转不退转正法轮
  date: -2990-01-02
  year_of: -2990
  description: 成佛夜即现广长舌覆大众及四天下，毛孔放六十亿那由他光明照十方微尘数国，摄无数菩萨来集，转最上轮令无数亿菩萨住不退转
- id: guji-莲华上如来-event-涅槃
  title_zh: 住世三十小劫后入涅槃正法住世十小劫
  date: -2900-01-01
  year_of: -2900
  description: 莲华上如来住世三十小劫教化已般涅槃，正法住世十小劫，莲华世界菩萨皆寿四十小劫禅悦法喜为食
