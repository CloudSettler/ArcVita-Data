person:
  qid: guji-菩提流志
  name_zh: 菩提流志
  names:
    zh: 菩提流志
    en: Bodhiruci
  lifespan:
    birth:
      date: '0571'
      precision: year
      is_circa: true
      raw: 约开皇十一年生，南天竺婆罗门种，传云寿一百五十六岁逆推
    death:
      date: '0727'
      precision: year
      is_circa: false
      raw: 唐开元十五年卒于长安
  birth_date: '0571'
  death_date: '0727'
  era: 唐
  reign_ref: 武周至开元
  archetype: 译经三藏
  dilemmas:
  - 年逾六十始入震旦为异域僧，如何在武周崇佛与政治更迭中取信朝廷、立译场以传梵本
  - 兼弘显教与陀罗尼密法，如何以咒印方便摄众而不令众生执神通炫惑、失菩提正因
  lesson: 梵本东来非徒文字，须以戒行清净、慈悲摄护为本，方能使陀罗尼三昧得成就而不断佛种
  summary_first_person: 吾南天竺婆罗门种，十五出家遍游五印，闻震旦为文殊所护，年六十余航海东来。武周证圣中抵洛阳、长安，蒙则天及中宗、睿宗、玄宗四朝礼敬，于崇福寺等置译场，与义净等共译大宝积经及千手千眼姥陀罗尼等五十余部。吾所传千手千眼姥陀罗尼身经及曼荼罗印法，本为末世薄福众生令离怖畏、速成三昧，非为炫异；故诫后学持斋戒、秘咒印、离谄诳，方为诸佛护念，吾虽老耄犹不敢懈也。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%8D%83%E6%89%8B%E5%8D%83%E7%9C%BC%E8%A7%82%E4%B8%96%E9%9F%B3%E8%8F%A9%E8%90%A8%E5%A7%A5%E9%99%80%E7%BD%97%E5%B0%BC%E8%BA%AB%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%8D%83%E6%89%8B%E5%8D%83%E7%9C%BC%E8%A7%82%E4%B8%96%E9%9F%B3%E8%8F%A9%E8%90%A8%E5%A7%A5%E9%99%80%E7%BD%97%E5%B0%BC%E8%BA%AB%E7%BB%8F.html
endeavors:
- id: guji-菩提流志-endeavor-1
  title_zh: 入华译经与大宝积经集成
  description: 自南天竺携梵本东来，于武周至开元译场主持译事，译出大宝积经等五十三部一百一十余卷，奠定中土大乘显教经藏
  phases:
  - key: brewing
    name: 婆罗门出家遍学五明
    labels:
      zh: 酿造
    start_date: 0586
    highlight_event_id: guji-菩提流志-event-birth
