    title_zh: 应武则天诏赴洛阳
    rationale: 欲以梵本大乘广行东土，不辞远涉，于异域弘法胜于独居修定
  - date: '0706-03-01'
    title_zh: 于长安崇福寺重译伽耶山顶经
    rationale: 旧译文义未畅，依梵本第四译，补足方便般若二道及十智十行等品，以正译义
  - date: '0710-01-01'
    title_zh: 协同般若流支等分工校勘
    rationale: 众译共证可免谄诳，以平等心与如理思惟持净戒，令译文信达
