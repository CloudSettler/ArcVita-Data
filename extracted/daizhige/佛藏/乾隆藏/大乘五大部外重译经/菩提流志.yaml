  archetype: 译经三藏
  dilemmas:
  - 梵华转译之难与义理不失之求
  - 密咒方便与显教般若如何圆融
  - 应诏久住中土与归隐南天之抉择
  lesson: 以总持方便摄众，显密一如，依净行净坛令咒力成就，广利众生
  summary_first_person: 吾南天竺婆罗门种，本名达摩流支，慕震旦佛法，承诏东来长安。于崇福诸寺广译大乘，兼传文殊六字神咒仪轨，欲令众生以简易咒行得聪明、除众患、临终见圣。平生所愿，唯在译梵为华，使法流不绝。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/六字神咒经.md
