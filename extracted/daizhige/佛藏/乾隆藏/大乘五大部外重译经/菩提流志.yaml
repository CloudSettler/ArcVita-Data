    title_zh: 以世间自在王如来授记为经首立信
    rationale: 显此法门久远传承非一时权说，增行者净信
  - date: '0709-01-01'
    title_zh: 陀罗尼全作音译并附反切注音
    rationale: 真言以音声为体，失音则失验，宁繁不省以存密意
