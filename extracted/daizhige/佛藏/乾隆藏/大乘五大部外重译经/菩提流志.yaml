  dilemmas:
  - 梵本奥义与汉地言说如何不落文字而兼达信解
  - 方便与般若二道如何和合以速疾趣入菩提
  - 译场群议纷纭时如何持戒如理思惟以决择取舍
  lesson: 菩提无所得无所证，然不舍文字筏与大悲行，于无相中广设方便，方能令众生入于无证之证
  summary_first_person: 吾自南天竺婆罗门种来，承诏入唐居洛阳长安译场，虽知法界无相离言说，犹勤转梵为汉，译宝积伽耶山顶等经，愿以言说显无言，以和合智导无和合义
