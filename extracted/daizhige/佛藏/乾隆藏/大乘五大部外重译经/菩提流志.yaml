  dilemmas:
  - title_zh: 梵义存真与华言达雅之衡
    description: 持咒宜音译存梵响，义理宜意译显义，二者如何兼顾令众生信受奉行
  - title_zh: 密教弘传与显教统摄之度
    description: 不空罥索观音密咒现世利益显著，如何置于大乘菩提道中不偏离正观
  lesson: 翻译贵在信实通达，持咒法门更须以菩提心为本，令众生得现世安稳与究竟解脱
  summary_first_person: 吾南天竺婆罗门种，慕大唐佛法之盛，仪凤年间奉诏入长安，习华言、校梵本，数十年间与众译事五十余部，尝译此不空罥索咒心，愿众生受持此不空妙智，离怖除障，速趣菩提
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/不空罥索咒心经.md
