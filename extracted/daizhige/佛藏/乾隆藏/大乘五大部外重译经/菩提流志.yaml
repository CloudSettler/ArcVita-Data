endeavors:
- id: guji-菩提流志-endeavor-1
  title_zh: 筹建译场与大宝积经等显教重译
  summary_zh: 应武周诏入长安主持译场，组织义学沙门对校梵本，系统重译大宝积经等大部，使南印度法藏转成华言，奠定新译规模
  phases:
  - key: brewing
    name: 南天竺学养
    labels:
      zh: 婆罗门学养
    start_date: 0590
    highlight_event_id: guji-菩提流志-event-birth
  - key: breakthrough
    name: 应诏入唐
    labels:
      zh: 初入长安
    start_date: 0693
    highlight_event_id: guji-菩提流志-event-arrival
  - key: climax
    name: 主持宝积译场
    labels:
      zh: 译场鼎盛
    start_date: '0706'
    highlight_event_id: guji-菩提流志-event-dabaoji
  - key: closure
    name: 显教译业告成
    labels:
      zh: 功成名立
    start_date: '0713'
    highlight_event_id: guji-菩提流志-event-dabaoji
  decisions:
  - date: 0693
    title_zh: 决意应武后之请东来长安
    rationale: 以法施报国不辞远涉，欲令大法久住中土，故舍南土学苑而赴唐土译场
  - date: '0706'
    title_zh: 奏请广集义学沙门校译大宝积经
    rationale: 梵本浩繁义理精深，必集众长反复勘校方能信达不谬，成就百二十卷宏篇
- id: guji-菩提流志-endeavor-2
  title_zh: 重译护命法门与密咒护世弘传
  summary_zh: 于诸大部之外复译护命法门神咒经等陀罗尼法门，宣说拥护寿命息灾免难之二十功德及诸天药叉守护神咒，令持诵者得现生安乐
  phases:
  - key: brewing
    name: 精研陀罗尼藏
    labels:
      zh: 密咒积学
    start_date: '0600'
    highlight_event_id: guji-菩提流志-event-birth
  - key: breakthrough
    name: 初译护命神咒
    labels:
      zh: 护命初传
    start_date: '0707'
    highlight_event_id: guji-菩提流志-event-translate-huming
  - key: climax
    name: 诸天劝请广宣
    labels:
      zh: 诸天护持
    start_date: 0708
    highlight_event_id: guji-菩提流志-event-translate-huming
  - key: closure
    name: 晨诵法门定型
    labels:
      zh: 流通天下
    start_date: '0715'
    highlight_event_id: guji-菩提流志-event-translate-huming
  decisions:
  - date: '0707'
    title_zh: 择护命法门为密教入门而重译
    rationale: 世人多惧夭横病恼，宜以易行神咒令得现生安乐而趣菩提，故于显教外别弘此护命善门
  - date: 0708
    title_zh: 存梵音而加反切注音以便持诵
    rationale: 咒力在音宁存其真，辅以汉字反切直音，使华人讽诵不失梵响而得神验
events:
- id: guji-菩提流志-event-birth
  title_zh: 生于南天竺婆罗门家
  date: '0572'
  year_of: '0572'
  location_zh: 南天竺
  description_zh: 约五七二年生于南印度婆罗门望族，少通外典，后出家学大小乘及陀罗尼，遍游天竺
- id: guji-菩提流志-event-arrival
  title_zh: 应武周诏至长安入译场
  date: 0693
  year_of: 0693
  location_zh: 长安
  description_zh: 长寿二年奉武则天遣使迎请，东来长安入内道场主持翻译，时年约六十余，受到礼重
- id: guji-菩提流志-event-dabaoji
  title_zh: 主译大宝积经成一百二十卷
  date: '0706'
  year_of: '0706'
  location_zh: 长安崇福寺译场
  description_zh: 率义学沙门对校梵本，重译大宝积经及宝雨经等，确立唐朝新译规模，为一生显教译业高峰
- id: guji-菩提流志-event-translate-huming
  title_zh: 重译护命法门神咒经一卷
  date: '0707'
  year_of: '0707'
  location_zh: 长安
  description_zh: 译出护命法门神咒经，宣说佛为金刚手等说护命善门陀罗尼，载晨朝持诵二十功德及梵天帝释等诸守护神咒
- id: guji-菩提流志-event-death
  title_zh: 示寂于长安
  date: '0727'
  year_of: '0727'
  location_zh: 长安
  description_zh: 开元十五年示寂于长安，世寿一百五十六，玄宗赐谥号，茶毗收舍利建塔供养，译业遂终
