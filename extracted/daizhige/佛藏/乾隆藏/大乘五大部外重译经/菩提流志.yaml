    title_zh: 留住京师译场不作游方讲说
    rationale: 中土正阙系统梵本，译经利众胜于一师一会之说
  - date: '0712-01-01'
    title_zh: 晚年辞谢荣宠专务译事
    rationale: 避朝局更迭以全法脉清净，使译业不因政治而中断
