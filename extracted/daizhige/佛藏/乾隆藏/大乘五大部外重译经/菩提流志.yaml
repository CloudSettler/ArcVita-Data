    title_zh: 立不放逸及三种净行为学基
    rationale: 欲令学者由十善业道持戒生定，从忆持不忘起观察，次第入于平等法性
  - date: '0712-08-01'
    title_zh: 以如实行摄道断二门授徒
    rationale: 空谈无益，必令如说而行，由自调伏及教化众生二行圆满，方得速疾菩提
