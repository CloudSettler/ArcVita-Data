  dilemmas:
  - 梵本精严与华言达意之间如何取舍而不失本义
  - 密咒护世神用与显教理观化导之间如何会通
  lesson: 存诚译经以续佛命，持咒护生以全众命，令正法久住
  summary_first_person: 吾本南天竺婆罗门种，少出家遍学三藏及陀罗尼，蒙武后遣使迎请入长安，愿竭余生以翻译为业，使梵典成华言，令诸有情晨起持诵得护，离诸怖畏，寿命安稳，速趣菩提。
