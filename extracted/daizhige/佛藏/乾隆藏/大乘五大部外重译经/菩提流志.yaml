  decisions:
  - date: '0707-01-01'
    title_zh: 咒句全音译并加反切注音
    rationale: 密咒以音声为用，义译则失神验，故尽存梵音并以反切标注华音，便于持诵无误
  - date: '0710-01-01'
    title_zh: 详陈二十利益与八临终功德
    rationale: 具述受持、书写、供养、结界、治病等现世利益及临终往生功德，以起众生信乐受持之心
