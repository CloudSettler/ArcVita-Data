  decisions:
  - date: 0695
    title_zh: 应武周征召入京不归天竺
    rationale: 震旦具大乘根器且帝后护法，留华方能广传梵本，遂定居洛阳长安译场
  - date: '0706'
    title_zh: 以汇编方式合译宝积诸会为一部
    rationale: 诸会分散难窥全旨，汇为大宝积经百二十卷便于学人次第修习
- id: guji-菩提流志-endeavor-2
  title_zh: 陀罗尼曼荼罗密法传持
  description: 传译千手千眼观世音姥陀罗尼等密咒、十二印契及八肘曼荼罗画坛法，立显密兼弘之陀罗尼三昧门，为后世观音信仰与密教仪轨所本
  phases:
  - key: brewing
    name: 天竺亲受姥陀罗尼三昧耶门
    labels:
      zh: 酿造
    start_date: '0630'
    highlight_event_id: guji-菩提流志-event-birth
  - key: breakthrough
    name: 佛前宣说千手千眼大身咒降伏魔众
    labels:
      zh: 突破
    start_date: '0707'
    highlight_event_id: guji-菩提流志-event-dharani
  - key: climax
    name: 授十二印契与四院曼荼罗坛法
    labels:
      zh: 高潮
    start_date: '0710'
    highlight_event_id: guji-菩提流志-event-mandala
  - key: closure
    name: 诫密传持戒清净不妄演神通
    labels:
      zh: 收束
    start_date: '0720'
    highlight_event_id: guji-菩提流志-event-mandala
  decisions:
  - date: '0707'
    title_zh: 译出姥陀罗尼身经广显咒印功用
    rationale: 末世众生垢重薄福多为鬼神侵娆，须以大悲咒印为护，令得消障速成
  - date: '0710'
    title_zh: 详示曼荼罗坛式与持戒仪轨
    rationale: 咒印非徒口诵，必依白檀坛场、斋戒香花、师承清净方得相应，杜绝炫惑求利之弊
events:
- id: guji-菩提流志-event-birth
  date: '0571'
  year_of: '0571'
  title_zh: 生于南天竺婆罗门家
  description: 南天竺婆罗门种姓，十五岁出家，遍游天竺习显密经论，精五明与陀罗尼
  location: 南天竺
- id: guji-菩提流志-event-arrival
  date: 0695
  year_of: 0695
  title_zh: 证圣元年抵洛阳入译场
  description: 年六十余闻震旦佛法隆盛，携梵本至东都洛阳，为武则天礼为国宾，入崇福寺译场始译
  location: 洛阳崇福寺
- id: guji-菩提流志-event-baoyi
  date: '0706'
  year_of: '0706'
  title_zh: 汇译大宝积经
  description: 奉中宗、睿宗诏，与诸大德合译大宝积经一百二十卷，统摄宝积诸会，为平生译业之冠
  location: 长安
- id: guji-菩提流志-event-dharani
  date: '0707'
  year_of: '0707'
  title_zh: 译出千手千眼观世音菩萨姥陀罗尼身经一卷
  description: 于长安译出此经，宣说观世音菩萨于佛前所说姥陀罗尼大身咒及总持功德，谓能摧破诸山、竭大海、护国邑、灭重障
  location: 长安
- id: guji-菩提流志-event-mandala
  date: '0710'
  year_of: '0710'
  title_zh: 授千手千眼曼荼罗与十二印法
  description: 详付总持身印、陀罗尼印、千眼印、千臂总摄印等十二印契及八肘四院曼荼罗画坛、结界、雨谷、除病诸法，诫须持戒斋洁密传
  location: 长安
- id: guji-菩提流志-event-death
  date: '0727'
  year_of: '0727'
  title_zh: 卒于长安崇福寺
  description: 开元十五年示寂，世寿一百五十六岁，玄宗悼惜，译经事业后由一行等继承
  location: 长安崇福寺
