    rationale: 以身口意清净为咒力根本，故立日三浴、三衣别着、六十万遍为初阶
  - date: '0707'
    title_zh: 制定白毡香汁画坛与酥灯护摩
    rationale: 不用胶彩而以香汁，设池水山峰坛场，配合沉香护摩，令行者感通文殊现身
events:
