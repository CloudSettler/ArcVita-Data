  date: '0706'
  location_zh: 长安崇福寺
  description_zh: 率义学沙门译大宝积经百二十卷，为一生最大译业
- id: guji-菩提流志-event-baoji-done
  title_zh: 宝积经译成进呈
  date: '0713'
  location_zh: 长安
