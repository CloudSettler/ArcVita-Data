  date: '0705'
  location_zh: 长安
  description_zh: 修文殊六字咒，持乳糜果菜素食，日三时澡浴为净行
- id: guji-菩提流志-event-liuzi-trans
  title_zh: 奉诏译六字神咒经一卷
  date: '0707'
  location_zh: 长安
  description_zh: 译出文殊师利六字神咒唵婆髻驮那莫及坛场画法、供养、护摩仪轨
- id: guji-菩提流志-event-liuzi-ritual
