    title_zh: 参预译场先作证义
    rationale: 初至华言未精，先以证梵义、校梵本入手，积累信誉与协作根基，再主译以保译文信实
  - date: '0706-01-01'
    title_zh: 承诏重译大宝积经一百二十卷
    rationale: 旧译散佚且不全，奉诏会合众本、广征梵夹，以信达雅为则，建立唐室大乘译经新规模
- id: guji-菩提流志-endeavor-2
  title_zh: 弘译不空罥索观音法门
  description: 译出不空罥索咒心经等观音密咒经典，阐扬观自在菩萨不空罥索神咒现世消障与往生净土之殊胜
