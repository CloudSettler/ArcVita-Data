  title_zh: 洛阳译场主持大乘经论翻译
  summary: 永平初年入魏，于洛阳宫廷译场主持翻译十地经论等三十余部，奠定地论宗与大乘弘传基础
  phases:
  - key: brewing
    name: 初至魏境
    labels:
