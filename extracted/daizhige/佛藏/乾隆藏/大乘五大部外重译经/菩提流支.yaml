person:
  qid: guji-菩提流支
  name_zh: 菩提流支
  names:
    zh: 菩提流支
    en: Bodhiruci
  lifespan:
    birth:
      date: '0470'
      precision: year
      is_circa: true
      raw: 约470年 北天竺
    death:
      date: '0535'
      precision: year
      is_circa: true
      raw: 约535年 洛阳
  birth_date: '0470'
  death_date: '0535'
  era: 北魏
  reign_ref: 北魏永熙二年
  archetype: 译经高僧
  dilemmas:
  - 梵汉音殊义隔，如何在不失深密了义的前提下令华言双显文义
  - 帝王亲执翰墨与译场众议并存，如何守译主之正而兼顾众证之审
  lesson: 深义无言而假言显，不一不异间以善巧名言接引众生入第一义
  summary_first_person: 吾本北天竺人，魏音道晞，永熙奉诏于显阳殿口自翻译，复与慧光昙宁等续成深密解脱，深惟译事非翻非译则文义壅塞，愿令此深密秘藏光宣景运，永流遐劫。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/深密解脱经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/深密解脱经.html
endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 重译深密解脱经弘阐了义中道
  title_en: Retranslation of Samdhinirmocana Sutra
  summary: 奉北魏孝武诏于洛阳显阳殿及永宁寺重译深密解脱经五卷，依梵本正名词句，抉择有为无为不一不异、胜义一味等深密义，为唯识了义教奠定汉译基础。
  phases:
  - key: brewing
    name: 入洛应诏访求梵本
    labels:
      zh: 赴洛
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrive-luoyang
  - key: breakthrough
    name: 显阳殿御前口译
    labels:
      zh: 御译
    start_date: '0533'
    highlight_event_id: guji-菩提流支-event-samdhi-start
  - key: climax
    name: 永宁寺众证审定
    labels:
      zh: 众证
    start_date: 0533-06
    highlight_event_id: guji-菩提流支-event-samdhi-collate
  - key: closure
    name: 五卷定本流通
    labels:
      zh: 成帙
    start_date: '0534'
    highlight_event_id: guji-菩提流支-event-samdhi-complete
  decisions:
  - date: '0533'
    title_zh: 口自翻译义语无滞
    rationale: 帝执翰亲记，若不直出梵义、双显文义，则久蕴深密不显，故当殿披匣挥尘以正本为据
  - date: 0533-06
    title_zh: 转授慧光昙宁僧辩李廓等遵承上轨续译
    rationale: 万机渊旷无容终讫，藉众证十余僧缁俗三覆，令一言穷微、理教兼备而后永流遐劫
- id: guji-菩提流支-endeavor-2
  title_zh: 系统译传大乘经论建构译场
  title_en: Systematic Translation of Mahayana Sastras
  summary: 自永平以降译出十地经论、入楞伽经、金刚般若等三十余部，立阿梨耶识等译语，于洛阳组织译场，奠定地论学派与后世唯识译业规模。
  phases:
  - key: brewing
    name: 初住洛阳译场奠基
    labels:
      zh: 立场
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrive-luoyang
  - key: breakthrough
    name: 十地经论译出
    labels:
      zh: 地论
    start_date: 0508-12
    highlight_event_id: guji-菩提流支-event-ten-stage
  - key: climax
    name: 诸论并译津悟恒沙
    labels:
      zh: 弘传
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-ten-stage
  - key: closure
    name: 译业垂范后学
    labels:
      zh: 垂范
    start_date: '0535'
    highlight_event_id: guji-菩提流支-event-samdhi-complete
  decisions:
  - date: 0508-12
    title_zh: 先译十地经论立地论宗本
    rationale: 华地初昧唯识次第，须以十地行相为阶梯，方能领会深密所说阿陀那阿梨耶心意识深密法
  - date: '0515'
    title_zh: 坚持梵汉对勘三覆审义
    rationale: 东西音殊理凭翻译，非翻非译则文义斯壅，故立众证制度使文义双显不堕偏执
events:
- id: guji-菩提流支-event-birth
  date: '0470'
  year_of: '0470'
  title_zh: 生于北天竺
  description: 约470年左右生于北天竺婆罗门家，少通梵典内外，深解大乘，北魏史称北天竺三藏法师。
- id: guji-菩提流支-event-arrive-luoyang
  date: 0508
  year_of: 0508
  title_zh: 抵洛阳入魏译场
  description: 北魏永平年间抵达洛阳，为当时沙门都统，识性内融、冲文玄藏罔不该洞，遂受朝廷礼请主持译事。
- id: guji-菩提流支-event-ten-stage
  date: 0508-12
  year_of: 0508
  title_zh: 译出十地经论
  description: 与佛陀扇多等共译十地经论十二卷，首立地论学派，确立阿梨耶识等核心译语，奠定后世唯识学基础。
- id: guji-菩提流支-event-samdhi-start
  date: '0533'
  year_of: '0533'
  title_zh: 永熙二年显阳殿奉诏译深密解脱经
  description: 永熙二年龙次星纪月吕蕤宾，诏命于显阳殿高升法座口自翻译，孝武帝执翰轮首下笔成句，开深密五卷之译。
- id: guji-菩提流支-event-samdhi-collate
  date: 0533-06
  year_of: '0533'
  title_zh: 永宁寺众证审定经义
  description: 舍笔后转授沙门都法师慧光、昙宁及律师僧辩、居士李廓等，复招僧令僧泽慧颙等十余僧缁俗诜诜，一言三覆审定文义。
- id: guji-菩提流支-event-samdhi-complete
  date: '0534'
  year_of: '0534'
  title_zh: 深密解脱经五卷定本
  description: 五卷定本告成，沙门昙宁作序称其旨包群籍秘理含众典奥，遂使深密秘藏光宣景运，祇园之风再显。
- id: guji-菩提流支-event-death
  date: '0535'
  year_of: '0535'
  title_zh: 示寂于洛阳
  description: 约535年前后示寂于洛阳，一生译经三十余部，为北魏四大译师之一，译风以文义双显、义理精审著称。
