person:
  qid: guji-菩提流支
  name_zh: 菩提流支
  names:
    zh: 菩提流支
    en: Bodhiruci
  lifespan:
    birth:
      date: '0470'
      precision: year
      is_circa: true
      raw: 约五世纪末南天竺
    death:
      date: '0535'
      precision: year
      is_circa: true
      raw: 约北魏末年洛阳
  birth_date: '0470'
  death_date: '0535'
  era: 北魏
  reign_ref: 魏宣武帝永平至孝庄帝永安时期
  archetype: 译场法师
  dilemmas:
  - 梵本义理幽深与华言简质如何两全而不失实相
  - 王朝动荡迁都兵乱中如何持戒不放逸以续译业
  lesson: 菩提无相假名言说，当以直心平等、方便慧与不放逸为本，如实修行方证无得之得
  summary_first_person: 余本南天竺人，少习大乘三藏，永平初年远涉至魏都洛阳，蒙宣武孝明二帝礼敬，于永宁等译场三十余年再校梵本重译伽耶山顶经等三十余部；余深观菩提过三界离言说、无发是发，愿以译笔令华夏众生得闻如实修行之道。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/伽耶山顶经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/伽耶山顶经.html
  - https://tripitaka.cbeta.org/T0465
endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 重译伽耶山顶经弘阐无相菩提
  description: 于洛阳再校梵本第二译伽耶山顶经一卷，阐明菩提无相无得假名言说、发心住行次第及方便慧二道
  phases:
  - key: brewing
    name: 酝酿校勘
    labels:
      zh: 梵本搜校
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 初译突破
    labels:
      zh: 初译伽耶
    start_date: '0513'
    highlight_event_id: guji-菩提流支-event-gaya-first
  - key: climax
    name: 重译定本
    labels:
      zh: 第二译定本
    start_date: '0520'
    highlight_event_id: guji-菩提流支-event-gaya-second
  - key: closure
    name: 讲演流通
    labels:
      zh: 宣畅十智十行
    start_date: '0522'
    highlight_event_id: guji-菩提流支-event-lecture
  decisions:
  - date: '0520'
    title_zh: 抉择以无发是发为纲重译定名
    rationale: 前译义有未周，再依梵本校定，突出菩提过三界离言说、无发是发心住之核心以正华人知见
  - date: '0521'
    title_zh: 保留佛与文殊及天子问答体例
    rationale: 经以文殊广答诸天子问层层追本至持戒正念，为显大悲以直心平等为本、六度以方便慧为本之次第故不作删改
- id: guji-菩提流支-endeavor-2
  title_zh: 译传十地经论开地论北道
  description: 译出十地经论等瑜伽行派论典，引世亲释 light 十地法门，融合般若与唯识，奠定北地地论学派
  phases:
  - key: brewing
    name: 资粮积聚
    labels:
      zh: 广求梵夹
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-collect
  - key: breakthrough
    name: 核心译成
    labels:
      zh: 十地论译出
    start_date: 0528
    highlight_event_id: guji-菩提流支-event-dilun
  - key: climax
    name: 宗派确立
    labels:
      zh: 北道地论
    start_date: '0530'
    highlight_event_id: guji-菩提流支-event-school
  - key: closure
    name: 付嘱传承
    labels:
      zh: 授徒弘传
    start_date: '0533'
    highlight_event_id: guji-菩提流支-event-disciples
  decisions:
  - date: 0528
    title_zh: 择译世亲十地经论而非单译经
    rationale: 论能释经辨十地差别与无差别方便，令学者得二种如实修行之智断次第
  - date: '0530'
    title_zh: 时乱中坚留洛阳译场不辍
    rationale: 虽尔朱荣兵乱以持戒正忆念正观为本，守译场以法为船不断法流
events:
- id: guji-菩提流支-event-birth
  title_zh: 生于南天竺
  date: '0470'
  year_of: '0470'
  location: 南天竺
  description: 约五世纪末生于南天竺婆罗门家，少通三藏，精大乘般若瑜伽
- id: guji-菩提流支-event-arrival
  title_zh: 抵洛阳入译场
  date: 0508
  year_of: 0508
  location: 洛阳
  description: 北魏永平元年抵达洛阳，受宣武帝敬礼，入永宁寺译场开启译经事业
- id: guji-菩提流支-event-gaya-first
  title_zh: 初译伽耶山顶经
  date: '0513'
  year_of: '0513'
  location: 洛阳
  description: 初次汉译伽耶山顶经，演佛初成道于伽耶山顶入诸佛甚深三昧观察法界之说
- id: guji-菩提流支-event-gaya-second
  title_zh: 第二译伽耶山顶经定本
  date: '0520'
  year_of: '0520'
  location: 洛阳永宁寺
  description: 再校梵本第二译今传一卷本，详明菩提无相、十种智十种发十种行及四种发心喻
- id: guji-菩提流支-event-lecture
  title_zh: 宣讲菩提相与略道如实修行
  date: '0522'
  year_of: '0522'
  location: 洛阳
  description: 依经宣讲方便慧二道、助断二道及二种如实修行，获众信受
- id: guji-菩提流支-event-collect
  title_zh: 广求大乘梵本
  date: '0515'
  year_of: '0515'
  location: 洛阳
  description: 于洛阳搜集十地经等梵夹，为后续译论积资粮
- id: guji-菩提流支-event-dilun
  title_zh: 译出十地经论十二卷
  date: 0528
  year_of: 0528
  location: 洛阳
  description: 与勒那摩提等共译世亲十地经论，阐发十地行相与地地转方便
- id: guji-菩提流支-event-school
  title_zh: 地论北道形成
  date: '0530'
  year_of: '0530'
  location: 洛阳相州一带
  description: 弟子慧光等弘传十地法门，形成北道地论师一系
- id: guji-菩提流支-event-disciples
  title_zh: 付法弟子慧光道宠等
  date: '0533'
  year_of: '0533'
  location: 洛阳
  description: 以所译经论付嘱弟子，嘱以持戒正念不放逸化导众生
- id: guji-菩提流支-event-death
  title_zh: 示寂于洛阳
  date: '0535'
  year_of: '0535'
  location: 洛阳
  description: 约北魏末年示寂，一生译经三十九部百余卷，伽耶山顶经为其重译代表作
