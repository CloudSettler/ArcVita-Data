  era: 北魏
  reign_ref: 北魏宣武帝至孝明帝永平至永安年间
  archetype: 译经僧
  dilemmas:
  - 梵本幽深无字法门难可以汉语文句显发
  - 侨寓异域朝局动荡欲广译弘传而处境险难
  lesson: 离文字相证不生不灭以无字藏显广博严净之法性
  summary_first_person: 吾自南天竺来游洛邑，承魏室崇敬入译场，惟以毕生译弘大乘，愿令无字宝箧光严法门流通无绝，令众生离贪嗔痴而证无生。
  source_urls:
