- id: guji-菩提流支-endeavor-1
  title_zh: 北魏洛阳佛经翻译事业
  description: 自永平年间入洛，主持译场，译出十地经论、法集经、无字宝箧经等三十余部，奠定地论学派与华严学译传基础
  phases:
  - key: brewing
    name: 入洛筹译
    labels:
      zh: 抵洛
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrive
  - key: breakthrough
    name: 初译立宗
    labels:
      zh: 初译
    start_date: '0511'
    highlight_event_id: guji-菩提流支-event-translate-shidi
  - key: climax
    name: 盛译无字宝箧
    labels:
      zh: 盛译
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-translate-wuzi
  - key: closure
    name: 译业授受
    labels:
      zh: 授受
    start_date: '0525'
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: 0508
    title_zh: 应北魏请入洛阳译场
    rationale: 闻魏崇佛译业得官方护持，遂舍南土远来，以遂弘传大乘本愿
  - date: '0511'
    title_zh: 先译十地经论奠基
    rationale: 欲令利根菩萨得入地行，先明十地法相与修证次第，再显无相法门方不堕空
  - date: '0515'
    title_zh: 选译无字宝箧经显无字法门
    rationale: 众生执文字相，须以无字辩才破一法执，显一切法不生不灭离二边之实相
- id: guji-菩提流支-endeavor-2
  title_zh: 无字法门与念佛净土弘阐
  description: 依无字宝箧经广博严藏之旨，弘宣离垢无字、因缘如幻及命终见佛之教，兼弘弥陀愿海接引群生
  phases:
  - key: brewing
    name: 示无字宗趣
    labels:
      zh: 示宗
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-translate-wuzi
  - key: breakthrough
    name: 对众开演
    labels:
      zh: 开演
    start_date: '0516'
    highlight_event_id: guji-菩提流支-event-preach-wuzi
  - key: climax
    name: 广劝受持流通
    labels:
      zh: 流通
    start_date: '0520'
    highlight_event_id: guji-菩提流支-event-preach-wuzi
  - key: closure
    name: 以行付嘱
    labels:
      zh: 付嘱
    start_date: '0526'
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: '0516'
    title_zh: 明说无有一法如来所觉
    rationale: 为破增减见，直显法性离二边，令学人不堕有无，以无觉为觉
  - date: '0520'
    title_zh: 劝自书读诵劝人持诵
    rationale: 经言自书劝书自持劝持即不见恶道得五眼具足，故以流通为报佛恩
events:
- id: guji-菩提流支-event-birth
  title_zh: 生于南天竺
  date: 0480
  year_of: 0480
  place: 南天竺
  description: 生于南印度婆罗门种姓，后出家通晓三藏与大乘经论
- id: guji-菩提流支-event-arrive
  title_zh: 抵达北魏洛阳入译场
  date: 0508
  year_of: 0508
  place: 洛阳
  description: 永平元年应请至洛阳，宣武帝礼遇，敕置译场从此主持大乘经典汉译
- id: guji-菩提流支-event-translate-shidi
  title_zh: 译出十地经论
  date: '0511'
  year_of: '0511'
  place: 洛阳嵩山
  description: 与勒那摩提等共译世亲十地经论十二卷，成地论学派之所依
- id: guji-菩提流支-event-translate-wuzi
  title_zh: 译出无字宝箧经
  date: '0515'
  year_of: '0515'
  place: 洛阳
  description: 译无字宝箧经一卷，宣说贪嗔痴等一法应灭、己所不欲勿劝他人及无字法性广博严藏法门
- id: guji-菩提流支-event-preach-wuzi
  title_zh: 宣讲流通无字宝箧法门
  date: '0520'
  year_of: '0520'
  place: 洛阳
  description: 对胜思惟等菩萨众开演无字宝箧法门，劝受持读诵书写流通，言持此法门临终得见阿弥陀佛及耆阇崛山众会
- id: guji-菩提流支-event-death
  title_zh: 卒于洛阳
  date: '0527'
  year_of: '0527'
  place: 洛阳
  description: 译事既成示寂于洛阳，世寿约四十余载，后世尊为北魏三大译师之一
