    start_date: '0509-06-01'
    highlight_event_id: guji-菩提流支-event-translate-start
  - key: climax
    name: 群经竞译
    labels:
      zh: 高潮
    start_date: '0520-01-01'
    highlight_event_id: guji-菩提流支-event-translate-bangfo
  - key: closure
    name: 译业圆成
    labels:
      zh: 收束
    start_date: '0527-01-01'
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: '0508-01-01'
    title_zh: 应请入魏赴洛
    rationale: 为使大乘正法广布中土，顺应北魏崇佛之请，远涉入洛开译
  - date: '0509-06-01'
    title_zh: 确立以义为主译风
    rationale: 梵本奥赜，务存义理不失，兼顾华言通晓，令学者得解行
- id: guji-菩提流支-endeavor-2
  title_zh: 弘宣护法不谤法师法门
  summary: 借译佛说谤佛经阐明谤法师即谤佛、供养法师即供养佛及四种净法，匡正时弊树立正行
  phases:
  - key: brewing
    name: 观察谤法过患
    labels:
      zh: 酝酿
    start_date: '0520-01-01'
    highlight_event_id: guji-菩提流支-event-translate-bangfo
  - key: breakthrough
    name: 宣讲护法正见
    labels:
      zh: 突破
    start_date: '0521-01-01'
    highlight_event_id: guji-菩提流支-event-preach
  - key: climax
    name: 大众发心感化
    labels:
      zh: 高潮
    start_date: '0521-06-01'
    highlight_event_id: guji-菩提流支-event-preach
  - key: closure
    name: 付嘱护持流通
    labels:
      zh: 收束
    start_date: '0525-01-01'
    highlight_event_id: guji-菩提流支-event-entrust
  decisions:
  - date: '0520-01-01'
    title_zh: 重译谤佛因缘与陀罗尼忏法
    rationale: 见时人轻慢法师，特详译十长者谤辩积法师堕落及七日持陀罗尼忏净之缘，令生敬畏
  - date: '0525-01-01'
    title_zh: 付嘱四净法与不求资生说法
    rationale: 劝后学修空、不坏众生、利益菩萨、说法不求利，以此清净菩提，护念法门乃至失命不舍
events:
- id: guji-菩提流支-event-birth
  title_zh: 诞生于南天竺
  date: '0470-01-01'
  year_of: '0470'
  location: 南天竺
  description: 约四七〇年生于南天竺婆罗门家，自幼习梵典，通大乘三藏
- id: guji-菩提流支-event-arrive-luoyang
  title_zh: 抵达洛阳入译场
  date: '0508-01-01'
  year_of: 0508
  location: 洛阳
  description: 北魏永平元年应请至洛阳，入宫廷译场，始开大规模翻译事业
- id: guji-菩提流支-event-translate-start
  title_zh: 始译十地经论
  date: '0509-06-01'
  year_of: 0509
  location: 洛阳
  description: 与勒那摩提等共译十地经论，弘阐华严十地法门，开地论宗先声
- id: guji-菩提流支-event-translate-bangfo
  title_zh: 译出佛说谤佛经一卷
  date: '0520-01-01'
  year_of: '0520'
  location: 洛阳
  description: 奉诏译出佛说谤佛经，明十菩萨往昔谤辩积法师致七年不得陀罗尼及忏净法门
- id: guji-菩提流支-event-preach
  title_zh: 宣说供养法师即供养佛
  date: '0521-01-01'
  year_of: '0521'
  location: 洛阳
  description: 依经宣讲若欲供养礼拜佛当供养礼拜法师、四种净法及不谤法师功德，化导缁素
- id: guji-菩提流支-event-entrust
  title_zh: 付嘱护念法门
  date: '0525-01-01'
  year_of: '0525'
  location: 洛阳
  description: 将所译护法法门付嘱不畏行等菩萨及大众，嘱令受持读诵解说乃至失命不舍
- id: guji-菩提流支-event-death
  title_zh: 示寂于洛阳
  date: '0527-01-01'
  year_of: '0527'
  location: 洛阳
  description: 约五二七年示寂于洛阳，一生译经三十余部一百余卷，大乘典籍广行中土
