person:
  qid: guji-菩提流支
  name_zh: 菩提流支
  names:
    zh: 菩提流支
    en: Bodhiruci
  lifespan:
    birth:
      date: '0472'
      precision: year
      is_circa: true
      raw: 约北魏太和十六年
    death:
      date: '0535'
      precision: year
      is_circa: true
      raw: 约北魏永熙或东魏天平年间
  birth_date: '0472'
  death_date: '0535'
  era: 北魏
  reign_ref: 北魏宣武帝永平至孝庄帝永安
  archetype: 译场宗师
  dilemmas:
  - 梵汉悬隔，忠于梵本密义与顺应中土文理通达之间如何取舍
  - 大乘空有宗趣纷争，楞伽如来藏与唯识境相如何不堕外道二见而善巧安立
  - 身为异域三藏，依傍帝室译场以广弘法与保持沙门超然独立之间如何自处
  lesson: 离心意识分别方见如来藏，译经当以自内证智为本，不执名言而善用名言
  summary_first_person: 吾乃南天竺人菩提流支，承佛嘱负笈北来，止洛阳永宁寺译场，奉宣武帝诏译出十卷入楞伽经及地持等数十部，深愧梵汉难齐，唯愿令中土学者远离言说分别，内证如来藏一心之境
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%85%A5%E6%A5%9E%E4%BC%BD%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E5%85%A5%E6%A5%9E%E4%BC%BD%E7%BB%8F.html
endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 重译入楞伽经弘宣如来藏一心法门
  summary: 应北魏朝请于洛阳译场，以梵本为据重译四卷楞伽为十卷本，详阐五法三自性八识二无我及如来藏自内证智，奠定地论与禅宗心要
  phases:
  - key: brewing
    name: 酝酿受请
    labels:
      zh: 入洛受诏
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 梵汉雠校
    labels:
      zh: 雠校梵本
    start_date: '0510'
    highlight_event_id: guji-菩提流支-event-lankavatara-start
  - key: climax
    name: 十卷定本
    labels:
      zh: 译场定本
    start_date: '0513'
    highlight_event_id: guji-菩提流支-event-lankavatara-complete
  - key: closure
    name: 流通讲授
    labels:
      zh: 流通弘阐
    start_date: '0514'
    highlight_event_id: guji-菩提流支-event-lankavatara-circulation
  decisions:
  - date: '0510'
    title_zh: 择十卷广本而非四卷略本重译
    rationale: 以详本具说楞伽城请佛及大慧百八问等缘起，方能尽显离名言自证境，避免中土旧译文略义阙
  - date: '0511'
    title_zh: 存梵语音译兼加汉义训释
    rationale: 如阿梨耶识如来藏等要义词宁存梵音不妄译，复以汉文解五法自性，令学人不堕外道声闻分别而直趣一心
- id: guji-菩提流支-endeavor-2
  title_zh: 主持北魏译场广译大乘经论开地论宗
  summary: 在洛阳永宁寺等译场与勒那摩提佛陀扇多等共译经论三十余部五十余卷，含十地经论金刚般若等，培育道宠等弟子形成地论学派南道北道之源
  phases:
  - key: brewing
    name: 结缘译众
    labels:
      zh: 结众立场
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 地持先行
    labels:
      zh: 地持开宗
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-dilun
  - key: climax
    name: 群经并译
    labels:
      zh: 群经并译
    start_date: '0520'
    highlight_event_id: guji-菩提流支-event-multiple-translations
  - key: closure
    name: 付嘱弟子
    labels:
      zh: 付法传学
    start_date: '0530'
    highlight_event_id: guji-菩提流支-event-disciples
  decisions:
  - date: '0515'
    title_zh: 先译十地经论立菩萨地行阶次
    rationale: 以十地经论详释修行次第，可为入楞伽顿证法门作阶梯，令初学有地可依不躐等
  - date: '0525'
    title_zh: 与勒那摩提分途各传
    rationale: 见译义诤论起，道宠等执己方义生南北分流，遂各弘其说而不强合，存异求是待后贤抉择
events:
- id: guji-菩提流支-event-birth
  title_zh: 诞生南天竺婆罗门家
  date: '0472'
  year_of: '0472'
  location: 南天竺
  description: 约北魏太和年间生于南印度婆罗门族，聪慧博学通声明因明，遍习大小乘经论，后出家为僧号菩提流支
- id: guji-菩提流支-event-arrival
  title_zh: 奉请入魏抵达洛阳
  date: 0508
  year_of: 0508
  location: 洛阳
  description: 北魏永平元年应宣武帝延请自天竺西行至洛阳，敕住永宁寺崇真寺等译场，诏集沙门僧辩笔受
- id: guji-菩提流支-event-lankavatara-start
  title_zh: 开译入楞伽经梵本
  date: '0510'
  year_of: '0510'
  location: 洛阳永宁寺
  description: 取梵本楞伽阿跋多罗宝经与旧译雠校，召集译众立章程，决意依广本重译为十卷
- id: guji-菩提流支-event-lankavatara-complete
  title_zh: 十卷入楞伽经译毕
  date: '0513'
  year_of: '0513'
  location: 洛阳
  description: 译出入楞伽经十卷，首品请佛品详叙佛住楞伽城为罗婆那王及大慧菩萨说自内证智离言法门，卷帙既成奏进宫廷
- id: guji-菩提流支-event-lankavatara-circulation
  title_zh: 楞伽法门讲授流通
  date: '0514'
  year_of: '0514'
  location: 洛阳
  description: 于译场及僧众中讲授新译楞伽，阐明阿梨耶识如来藏一心及寂灭境界，学者竞抄流通为后世禅宗所重
- id: guji-菩提流支-event-dilun
  title_zh: 译出十地经论启地论宗
  date: '0515'
  year_of: '0515'
  location: 洛阳
  description: 与勒那摩提等共译世亲十地经论十二卷，详释华严十地法门，弟子道宠等研习遂成地论学派
- id: guji-菩提流支-event-multiple-translations
  title_zh: 广译大乘经论三十余部
  date: '0525'
  year_of: '0525'
  location: 洛阳
  description: 先后译金刚般若波罗蜜经弥勒菩萨所问本愿经法集经等，前后共计约三十九部一百余卷，蔚为北魏译经之盛
- id: guji-菩提流支-event-disciples
  title_zh: 授徒分流南北道兴
  date: '0530'
  year_of: '0530'
  location: 洛阳
  description: 晚年以经义授道宠道昰等，形成地论南道北道异解，学徒各阐相州南北弘传，奠定北地大乘学脉
- id: guji-菩提流支-event-death
  title_zh: 示寂于洛阳
  date: '0535'
  year_of: '0535'
  location: 洛阳
  description: 约魏永熙或东魏初年圆寂于洛阳译邸，世寿约六十余，遗诸梵本及译稿由弟子续理，塔铭称天竺三藏法师
