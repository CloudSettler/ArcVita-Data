    title_zh: 为防护七佛神咒复更说咒
    rationale: 恐未来众生虽得神咒而障重缘薄故以护咒护持令法久住人得受持
  - date: -0500-01-06
    title_zh: 详示结索结界洒水然火等行法
    rationale: 使咒力有所依事相与法相应令病者鬼著者皆得除愈事业皆成
events:
- id: guji-虚空藏菩萨-event-birth
  title_zh: 示现出生
  date: -1500-01-01
  year_of: -1500
  location: 传说无量佛刹
  description: 虚空藏菩萨过去无量劫前已成大士虚空为藏容受无量功德随缘示现
- id: guji-虚空藏菩萨-event-death
  title_zh: 示现无灭菩萨不般涅槃
  date: '2999-12-31'
  year_of: 2999
  location: 十方佛刹
  description: 菩萨一生补处不住生死不入涅槃恒以神咒护持众生无究竟灭度之期
- id: guji-虚空藏菩萨-event-qingfa
  title_zh: 鸡罗莎山见二比丘启请说咒
  date: -0500-01-01
  year_of: -500
  location: 鸡罗莎山顶诸天住处
  description: 佛与五百比丘五百补处菩萨俱住鸡罗莎山虚空藏见林中二比丘一为恶鬼所持一为恶病所持而启请世尊为一切众生说陀罗尼
- id: guji-虚空藏菩萨-event-qifo-xianshen
  title_zh: 七佛现空依次而坐
  date: -0500-01-02
  year_of: -500
  location: 鸡罗莎山虚空
  description: 世尊现威神力于虚空中现六佛释迦牟尼腾空依次而坐大众皆见七佛
- id: guji-虚空藏菩萨-event-qifo-shuozhou
  title_zh: 七佛次第说大威德陀罗尼
  date: -0500-01-03
  year_of: -500
  location: 鸡罗莎山虚空
  description: 毗婆尸尸弃毗舍浮拘楼孙拘那含牟尼迦叶释迦牟尼七佛各说陀罗尼具明受持读诵供养行法能除病疮鬼著水火刀毒横死等难
- id: guji-虚空藏菩萨-event-hufa-shuozhou
  title_zh: 虚空藏自说护持神咒
  date: -0500-01-06
  year_of: -500
  location: 鸡罗莎山佛前
  description: 虚空藏白佛为防护七佛所说神咒复说护咒南无佛陀耶等广显能破一切罪障
- id: guji-虚空藏菩萨-event-hufa-gongneng
  title_zh: 宣说护咒种种行法功能
  date: -0500-01-07
  year_of: -500
  location: 鸡罗莎山
  description: 说结咒索咒酥芥子掷火咒水洒方咒油涂身等法治鬼打恐怖毒药风病耳腹齿痛惊啼头痛厌诅雷电等
- id: guji-虚空藏菩萨-event-liuchuan
  title_zh: 失译附梁录后世流通
  date: '0520-01-01'
  year_of: 520
  location: 梁代建康
  description: 此经失译人名今附梁录为大乘五大部外重译经之一经一卷载七佛陀罗尼及虚空藏护咒辗转流通
