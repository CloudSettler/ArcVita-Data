  archetype: 悲愿护持型求法菩萨
  dilemmas:
  - 见二比丘为恶鬼恶病所持当以何方便救拔众生现前苦厄
  - 七佛神咒威德广大当如何护持令未来众生得闻受持而不为障难所侵
  lesson: 以大悲为本请法护法并行咒语法门可除病障鬼障结界护身所作皆成
  summary_first_person: 吾于鸡罗莎山见二比丘为鬼病所持心生悲悯承佛神力启请说咒蒙七佛次第现空各说陀罗尼以除一切病苦鬼难横死恶梦吾亦说护咒以防护七佛神咒愿后世众生受持读诵皆得安稳
