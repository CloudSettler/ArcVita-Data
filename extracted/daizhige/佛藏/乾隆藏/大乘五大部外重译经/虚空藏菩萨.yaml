    title_zh: 为治众生一切病为除恶鬼障难启请说陀罗尼
    rationale: 目睹林中二比丘一为恶病所持一为恶鬼所持露形狂言知众生多为此苦故代众生请法
  - date: -0500-01-02
    title_zh: 整理衣服右膝着地合掌向佛陈请
    rationale: 承佛神力以敬信威仪启请令大众生起尊重法门之心
- id: guji-虚空藏菩萨-endeavor-2
  title_zh: 加说护咒护持七佛神咒流通
  description: 七佛说咒已自为防护七佛所说神咒故复说护持咒广明结界结索洒水涂身等行法令受持者免刀仗水溺毒药蛊道等难
