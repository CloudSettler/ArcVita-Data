    rationale: 彼佛怜念我及未来恶世众生说此咒令修六度未满足者速满足未发菩提心者速发心故亲受持未曾废忘
  - date: -1499-06-01
    title_zh: 发大誓愿身生千手千眼
    rationale: 若当来堪能利益安乐一切众生令我即时千手千眼具足以此身相更好地照见护持无边世界
- id: guji-观世音菩萨-endeavor-2
