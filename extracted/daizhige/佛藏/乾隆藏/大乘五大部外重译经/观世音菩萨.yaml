  description: 过去无量亿劫前始住初地逢千光王静住如来发大慈悲心欲安乐一切众生
  location: 千光王静住如来佛所
- id: guji-观世音菩萨-event-qianGuangMoDing
  title_zh: 千光王如来金色手摩顶授大悲陀罗尼
  date: -1499-03-01
  year_of: '-1499'
  description: 千光王静住如来怜念我及未来恶世众生以金色手摩我顶说广大圆满无碍大悲心陀罗尼令普为未来众生作大利乐
  location: 千光王佛所
- id: guji-观世音菩萨-event-chaoBadi
  title_zh: 一闻此咒超第八地
  date: -1499-03-15
  year_of: '-1499'
  description: 我时始住初地一闻此咒故即超第八地心生欢喜踊跃无量
- id: guji-观世音菩萨-event-qianShouQianYan
  title_zh: 发愿即时身生千手千眼具足
  date: -1499-06-01
  year_of: '-1499'
  description: 发誓言若当来堪能利益安乐一切众生令我即时身生千手千眼具足应时身上千手千眼悉皆具足十方大地六种震动十方千佛悉放光明照触我身及十方无边世界
- id: guji-观世音菩萨-event-changChi
  title_zh: 复于无量佛所重闻受持常诵不忘
  date: -1498-01-01
  year_of: '-1498'
  description: 从是已后复于无量佛所无量会中重更得闻亲承受持便得超越无数亿劫微细生死常所诵持未曾废忘所生之处恒在佛前莲华化生不受胎藏
- id: guji-观世音菩萨-event-miFangShenTong
  title_zh: 补陀落迦会中密放神通光明照曜十方
  date: -0600-01-01
  year_of: '-600'
  description: 于释迦牟尼佛补陀落迦山观世音宫殿宝庄严道场密放神通光明照曜十方刹土及三千大千世界皆作金色天宫龙宫皆震动日月珠火之光皆不现
  location: 补陀落迦山观世音宫殿
- id: guji-观世音菩萨-event-qingFoXuShuo
  title_zh: 白佛欲说大悲心陀罗尼为安乐众生
  date: -0600-02-01
  year_of: '-600'
  description: 从座而起整理衣服向佛合掌白佛我有大悲心陀罗尼咒今当欲说为诸众生得安乐除一切病得寿命等唯愿世尊慈哀听许佛言今正是时宜应速说
  location: 补陀落迦山道场
- id: guji-观世音菩萨-event-xuanShuoZhou
  title_zh: 宣说广大圆满无碍大悲心大陀罗尼八十二句
  date: -0600-03-01
  year_of: '-600'
  description: 于众会前合掌正住于诸众生起大悲心开颜含笑说陀罗尼曰南无喝啰怛那哆啰夜耶乃至唵悉殿都曼哆啰钵陀耶娑婆诃说已大地六变震动天雨宝华十方诸佛欢喜天魔外道恐怖众会或得须陀洹乃至十地无量众生发菩提心
  location: 补陀落迦山道场
- id: guji-观世音菩萨-event-kaiShiXiangMao
  title_zh: 为大梵天王开示陀罗尼相貌及如法受持
  date: -0600-04-01
  year_of: '-600'
  description: 告梵王大慈悲心是平等心无为心无染着心空观心恭敬心卑下心无杂乱无见取无上菩提心即是陀罗尼相貌又说受持法住净室澡浴着净衣悬旛然灯制心一处诵持则日光月光菩萨来证千眼照见千手护持能治八万四千种病缚诸鬼神敕密迹金刚等常随拥护并说十五善生不更十五恶死
  location: 补陀落迦山道场
- id: guji-观世音菩萨-event-death
  title_zh: 誓不成正觉常住利生未示涅槃
  date: '9999-12-31'
  year_of: '9999'
  description: 发誓若诵持大悲神咒者堕三恶道不生诸佛国不得无量三昧辩才我誓不成正觉以此大悲愿力常住世间不入涅槃随处应现救度众生
  location: 十方微尘国土
