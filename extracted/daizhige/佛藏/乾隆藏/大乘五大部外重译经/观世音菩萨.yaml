  date: -0500-05-04
  year_of: -500
  kind: career
  place: 灵鹫山法华会上
  summary: 无尽意以偈重问佛偈答观音弘誓历劫不思议火坑成池波浪不没须弥不堕刀段段坏枷锁解脱具足神通十方无刹不现身八万四千众生发无上菩提心持地菩萨赞功德不少
- id: guji-观世音菩萨-event-death
