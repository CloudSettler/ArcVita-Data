endeavors:
- id: guji-观世音菩萨-endeavor-1
  person_qid: guji-观世音菩萨
  title_zh: 寻声救苦施无畏业
  title_en: Vow to Hear Cries and Grant Fearlessness
  description: 以弘誓深如海为本愿闻众生音声即时观照于火水罗刹刀杖枷锁怨贼及淫欲嗔恚愚痴三毒与求男女等二求中令一心称名者皆得解脱成就施无畏名
  phases:
