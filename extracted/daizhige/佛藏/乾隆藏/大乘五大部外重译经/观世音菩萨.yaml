    title_zh: 请佛慈哀听许说咒
    rationale: 为诸众生得安乐除一切病得寿命富饶灭恶业离障难增长白法成就善根远离怖畏满足希求故于大众中合掌白佛愿说此咒
  - date: -0600-04-01
    title_zh: 为梵王开示陀罗尼相貌并敕善神护持
    rationale: 欲令众生依大慈悲平等无为无染着等心修行得效故说相貌并遣密迹金刚乌刍君荼等八部龙天常随卫护受持者如护眼睛
