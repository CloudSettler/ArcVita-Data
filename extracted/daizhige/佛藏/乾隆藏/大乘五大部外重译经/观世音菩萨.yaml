  decisions:
  - date: -3000-01-01
    title_zh: 侍多千亿佛发大清净愿
    rationale: 历劫亲近诸佛不为自求解脱专为成就观音行愿使闻名见身心念不空过
  - date: -0500-05-01
    title_zh: 立一心称名皆得解脱之方便
    rationale: 若有无量众生受诸苦恼但一心称名即观其音声施救以最简易门摄最广大机
  - date: -0500-05-02
    title_zh: 以离三毒示心法救济
    rationale: 淫欲嗔恚愚痴为生死根本故教常念恭敬观世音便得离欲离嗔离痴直指心源
- id: guji-观世音菩萨-endeavor-2
  person_qid: guji-观世音菩萨
  title_zh: 普门示现三十三身应化业
  title_en: Universal Gate Manifestation in Thirty-Three Forms
  description: 成就自在神力以种种形游诸国土应以何身得度即现何身而为说法从佛身至执金刚神及童男女天龙八部无刹不现身令众生皆发菩提心
  phases:
  - key: brewing
    name: 证真观清净观广大智慧观
    labels:
      zh: 证观
    start_date: -3000-01-01
    highlight_event_id: guji-观世音菩萨-event-birth
  - key: breakthrough
    name: 得自在神力
    labels:
      zh: 自在
    start_date: -0500-05-02
    highlight_event_id: guji-观世音菩萨-event-manifestation
  - key: climax
    name: 三十三身普门示现
    labels:
      zh: 普门
    start_date: -0500-05-02
    highlight_event_id: guji-观世音菩萨-event-manifestation
  - key: closure
    name: 分璎珞奉二佛证不二
    labels:
      zh: 归真
    start_date: -0500-05-03
    highlight_event_id: guji-观世音菩萨-event-jewel-offering
  decisions:
  - date: -0500-05-02
    title_zh: 应以何身得度即现何身
    rationale: 为破众生执一相故不固定一形随国土根器现佛辟支佛声闻梵王帝释以至妇女童男女等平等说法
  - date: -0500-05-03
    title_zh: 不受而受璎珞分作二分奉佛
    rationale: 初辞无尽意璎珞示无贪受佛敕而受示大悲分奉释迦多宝二佛显自他不二福田普回向
  - date: -0500-05-04
    title_zh: 于十方无刹不现身救恶趣
    rationale: 地狱饿鬼畜生生老病死渐令消灭以慈眼视众生令普门示现不局娑婆
