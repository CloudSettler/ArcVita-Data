  lesson: 大悲心即平等无为无染着之空观菩提心依此修持则无碍圆满能超生死满众愿
  summary_first_person: 我是观世音自在昔于千光王静住如来所亲承广大圆满无碍大悲心陀罗尼以金色手摩顶授我我时始住初地一闻此咒超第八地心生欢喜发愿若堪利益安乐一切众生令我即时身生千手千眼具足应愿千眼照见千手护持十方大地六种震动十方千佛光明照触自是以来自无量佛所重闻受持未曾废忘常诵此咒故所生处恒在佛前莲华化生后于补陀落迦山观世音宫殿释迦如来会中密放神通光明照曜三千世界蒙佛听许为安乐众生除病延寿灭恶离怖故宣说八十二句神妙章句大地复震天雨宝华天魔恐怖众会获证我又为梵王开示陀罗尼相貌即大慈悲平等无为无染着空观恭敬卑下无杂乱无见取无上菩提心并敕日光月光善神龙王金刚密迹常随卫护受持者令得十五善生离十五恶死世间八万四千种病悉皆治之
  source_urls:
