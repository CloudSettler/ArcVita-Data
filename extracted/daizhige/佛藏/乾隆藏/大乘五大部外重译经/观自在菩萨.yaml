  birth_date: '-0777'
  death_date: '9999'
  era: 佛教传说时代
  reign_ref: 伽栗斯山佛会
  archetype: 大悲菩萨
  dilemmas:
  - 如何以无碍大悲满众生所求又不令增生贪著
  - 如何以秘密咒印普门救苦而仍显甚深空性
  - 如何令持明者得现世果验又导归极乐菩提
  lesson: 以大悲为体以方便为门持如意心轮秘密咒能除障满愿导众生离苦得乐
  summary_first_person: 我是观自在菩萨，于伽栗斯山佛前禀白如意心陀罗尼，蒙佛加护宣说无障碍莲华如意宝轮王心咒，愿一切持诵者随心饶益、所求成就、常得护持。
