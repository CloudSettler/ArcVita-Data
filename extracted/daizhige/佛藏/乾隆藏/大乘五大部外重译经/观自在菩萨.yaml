endeavors:
- id: guji-观自在菩萨-endeavor-1
  title_zh: 佛前请说并宣扬如意心轮陀罗尼
  description: 于伽栗斯山佛会中请佛加护，宣说青莲华顶栴檀摩尼心金刚秘密无障碍观自在莲华如意宝轮王陀罗尼及大心咒随心咒，感得大地六种震动、天雨宝华。
  phases:
  - key: brewing
    name: 悲愿酝酿
    labels:
      zh: 悲愿
    start_date: '0700-01-01'
    highlight_event_id: guji-观自在菩萨-event-preach-request
  - key: breakthrough
    name: 佛前请法
    labels:
      zh: 请法
    start_date: '0700-01-02'
    highlight_event_id: guji-观自在菩萨-event-preach-request
  - key: climax
    name: 宣说根本咒王
    labels:
      zh: 宣咒
    start_date: '0700-01-03'
    highlight_event_id: guji-观自在菩萨-event-dharani-proclaim
  - key: closure
    name: 瑞相印证
    labels:
      zh: 证信
    start_date: '0700-01-04'
    highlight_event_id: guji-观自在菩萨-event-dharani-proclaim
  decisions:
  - date: '0700-01-02'
    title_zh: 顶礼佛足陈白大坛场法
    rationale: 以大悲拥护受苦众生故，欲以如意轮陀罗尼施与一切众生，须承佛威力加护方得普施无碍
  - date: '0700-01-03'
    title_zh: 承佛许可以大悲心宣说三咒
    rationale: 佛赞许悲愍有情并加护满足所愿，遂依次宣说根本咒、大心咒、随心咒令众生随心饶益皆得成就
- id: guji-观自在菩萨-endeavor-2
  title_zh: 开示持诵功德与度众事业
  description: 对众开示受持此咒不择日星、不假斋浴、摄心口诵即能除罪障、愈病苦、辟诸障难、满诸所愿乃至见佛生净土，并嘱咐令众生至诚深信不得生疑。
  phases:
  - key: brewing
    name: 法式酝酿
    labels:
      zh: 法式
    start_date: '0700-01-05'
    highlight_event_id: guji-观自在菩萨-event-merit-teaching
  - key: breakthrough
    name: 广说现报利益
    labels:
      zh: 利益
    start_date: '0700-01-06'
    highlight_event_id: guji-观自在菩萨-event-merit-teaching
  - key: climax
    name: 授记见佛往生
    labels:
      zh: 授记
    start_date: '0700-01-07'
    highlight_event_id: guji-观自在菩萨-event-merit-teaching
  - key: closure
    name: 嘱众信受奉行
    labels:
      zh: 弘护
    start_date: '0700-01-08'
    highlight_event_id: guji-观自在菩萨-event-entrust
  decisions:
  - date: '0700-01-05'
    title_zh: 简易持法立不择时日之轨
    rationale: 为令一切善男子女人苾刍苾刍尼等易于受持，不问日月星辰吉凶亦不假洗浴净衣，惟摄心口诵不懈即得成就
  - date: '0700-01-07'
    title_zh: 宣说至诚深信方得成就
    rationale: 此咒有大神力大方便门，惟须深信不得生疑，若至诚忆念受持必得成就，故劝众策励示诲令得证验
events:
- id: guji-观自在菩萨-event-birth
  title_zh: 无量劫前示现菩萨身
  date: '-0777'
  year_of: '-0777'
  description: 观自在菩萨于无量劫来以慈悲心常作拥护受苦众生之行，示现菩萨身行大悲愿。
  location: 补怛罗山
- id: guji-观自在菩萨-event-preach-request
  title_zh: 伽栗斯山佛前请说如意心陀罗尼
  date: '0700-01-02'
  year_of: '0700'
  description: 一时薄伽梵在伽栗斯山与大菩萨众俱，观自在菩萨来诣佛所顶礼右绕合掌白佛，称有大陀罗尼名青莲华顶栴檀摩尼心金刚秘密及无障碍莲华如意宝轮王心咒能随心饶益，请求佛慈加护宣说。
  location: 伽栗斯山
- id: guji-观自在菩萨-event-dharani-proclaim
  title_zh: 宣说根本咒大心咒随心咒感得震动雨华
  date: '0700-01-03'
  year_of: '0700'
  description: 蒙佛赞许后以大悲心说咒曰南谟佛驮耶等根本咒，次说大心咒庵钵踏摩等及随心咒庵跋剌陀等，即时大地六种震动、诸宫殿旋转、恶魔惊怖、地狱众生离苦生天，天雨宝华奏天伎乐广陈供养，世尊赞为难逢咒王。
  location: 伽栗斯山佛前
- id: guji-观自在菩萨-event-merit-teaching
  title_zh: 开示持诵法式及现世果报
  date: '0700-01-05'
  year_of: '0700'
  description: 世尊与菩萨共说持法：不问日辰斋戒净衣，但摄心口诵即成百千所愿，能除五逆无间重罪、灭诸病苦热病疟疾、愈痈瘿疮癣支节疼痛、辟药叉罗刹恶龙蛊毒刀兵水火怨贼横死，诵一遍遂意、日诵百八见观自在及阿弥陀佛现身、见极乐庄严及十方诸佛、常生佛前莲华化生不堕恶道。
  location: 伽栗斯山
- id: guji-观自在菩萨-event-entrust
  title_zh: 受佛敕令勤加策励令众证验
  date: '0700-01-08'
  year_of: '0700'
  description: 观自在菩萨白佛言于无量劫来以慈悲常护众生，愿承佛威力救苦；世尊赞其大慈无量，敕令于赡部洲数数策励示诲令持诵者亲验现身，莫违敕命，一切大众欢喜信受奉行。
  location: 伽栗斯山
- id: guji-观自在菩萨-event-death
  title_zh: 不般涅槃常住救度
  date: '9999'
  year_of: '9999'
  description: 观自在菩萨不住涅槃，以大悲愿常住世间，随众生所求现身加护，令持如意心陀罗尼者应时果遂。
  location: 补怛罗山
