  - title_zh: 梵华会通之难
    description: 梵本义理深广，如何以华言显其不退转深义而不失真如法味
  - title_zh: 王法与法施之衡
    description: 身居武周宫廷译场，依帝王护持而广译大乘，如何不依王势而守清净施
  lesson: 摄受正法唯以无所依无希求心而行法施，方能令闻名皆作不退因缘
  summary_first_person: 吾南天竺人也，奉梵本入震旦，值武周崇佛，于洛阳译场重译大乘，经十卷名宝雨，又名显授不退转记。吾所愿唯令正法住持，众生闻佛名号皆植不退因，虽处王朝更迭，唯以译笔为供养。
