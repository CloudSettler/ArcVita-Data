  lesson: 一言出口必三覆乃书宁迟毋误方能上弘佛旨下利群生
  summary_first_person: 吾南天竺罗阅城人本婆罗门种少好梵学遍览叶典隋开皇中西行入华止于洛阳承诏入译见旧出药师经文辞杂糅疑误甚多开皇十七年仅得一本未敢遽翻至大业十一年复得二本更相仇比乃与法行明则等於上林园重译一卷唯愿此经深义人人共解彼佛名号处处遍闻
