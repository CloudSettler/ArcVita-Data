    title_zh: 得一本而未即翻
    rationale: 恐有脱误贻误众生宁缓译以待善本不欲以疑文传世
  - date: '0615-11-01'
    title_zh: 立三覆乃书之例
    rationale: 鉴前非惩后失一言出口必三覆乃书务使幽旨信实无大过
