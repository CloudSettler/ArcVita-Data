  birth_date: '0565-01-01'
  death_date: '0619-01-01'
  era: 隋
  reign_ref: 隋炀帝大业
  archetype: 译经三藏
  dilemmas:
  - 梵本义隐辞约，如何以简质隋言传其允正而不失甚深缘生之旨
  - 三乘异执与一部之筌并存，如何遍取不偏、令经论互显而化导中土
  lesson: 缘生无作无众生，因果相续念念空，洞观十二分依他起，方能转染成净
  summary_first_person: 吾本南贤豆国人，出家通三藏，慕中土弘法，涉海而东。于大业二年在东都上林园与彦琮共对梵本，译出缘生初胜分经论，具演十二分缘生及十一种胜异，愿为法灯，穷后际以益世间。
