  decisions:
  - date: '0606-10-01'
    title_zh: 择上林园与彦琮共译
    rationale: 彦琮博通经论兼善梵文，共对叶本更相控击，可保一言靡遗、三覆逾审
  - date: '0607-01-01'
    title_zh: 存简质去华饰
    rationale: 辞颇简质意存允正，比之昔人差无尤失，利中土学人直窥缘生实相
- id: guji-达磨笈多-endeavor-2
  title_zh: 阐扬十二分缘生甚深法门
  description: 依佛说十一问别为百二十问之纲目，演攀缘至对治十一胜异，兼附郁楞迦三十偈论，遍取三乘以显缘生初胜分
  phases:
  - key: brewing
