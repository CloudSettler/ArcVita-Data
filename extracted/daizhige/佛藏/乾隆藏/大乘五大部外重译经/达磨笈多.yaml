  decisions:
  - date: '0607-03-01'
    title_zh: 以十一胜异摄十二缘生
    rationale: 攀缘种相由绪等起乃至对治，胜异中胜异故安立无明为初缘，总摄五因七果之网
  - date: '0607-06-01'
    title_zh: 并译郁楞迦三十论附经
    rationale: 经辞约而隐，先立偈章后兴论释，遍取三乘不执一部，使幽旨得显
