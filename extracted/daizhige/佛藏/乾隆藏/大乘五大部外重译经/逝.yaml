endeavors:
- id: guji-逝-endeavor-1
  title_zh: 竭诚布施供佛
  description: 年十六于七重门内见佛托钵数请悭母不获许遂自取己分细衣饭食奉佛求佛智
  phases:
  - key: brewing
    name: 遥见生信
    labels:
      zh: 见佛欢喜
    start_date: -0520-03-01
    highlight_event_id: guji-逝-event-alms
  - key: breakthrough
    name: 劝母开施
    labels:
      zh: 三请不许
    start_date: -0520-03-01
    highlight_event_id: guji-逝-event-alms
  - key: climax
    name: 自取奉佛
    labels:
      zh: 头面礼足
    start_date: -0520-03-02
    highlight_event_id: guji-逝-event-alms
  - key: closure
    name: 蒙佛纳受
    labels:
      zh: 心愿得遂
    start_date: -0520-03-02
    highlight_event_id: guji-逝-event-alms
  decisions:
  - date: -0520-03-01
    title_zh: 不顾母嗔自取衣饭施佛
    rationale: 知悭贪堕地狱畜生鬼神恶道布施生福不以母吝而废供佛遂以己分衣食奉上
  - date: -0520-03-02
    title_zh: 三请佛受以显至诚
    rationale: 视佛为天下父母能度脱众生唯至诚三白愿哀受衣饭令得无量福
- id: guji-逝-endeavor-2
  title_zh: 立誓求佛不移
  description: 天帝释试以劫数艰难及梵释天乐相诱令舍佛道坚执慈心精进誓虽蹈火不止终得授记
  phases:
  - key: brewing
    name: 发愿如佛
    labels:
      zh: 不愿天王
    start_date: -0520-03-03
    highlight_event_id: guji-逝-event-debate
  - key: breakthrough
    name: 释帝试难
    labels:
      zh: 劫数相沮
    start_date: -0520-03-03
    highlight_event_id: guji-逝-event-debate
  - key: climax
    name: 誓投火海
    labels:
      zh: 慈付弥勒
    start_date: -0520-03-04
    highlight_event_id: guji-逝-event-debate
  - key: closure
    name: 佛授记莂
    labels:
      zh: 当作金轮王后成须弥加罗佛
    start_date: -0520-03-05
    highlight_event_id: guji-逝-event-prophecy
  decisions:
  - date: -0520-03-03
    title_zh: 拒释劝求梵释天
    rationale: 知梵释虽尊会归无常无有脱死者唯佛道究竟故不改求佛之心
  - date: -0520-03-04
    title_zh: 誓以慈心付众生于弥勒而蹈火求佛
    rationale: 恐蹈火杀生反堕地狱故以慈付弥勒令度脱而己一心求佛终不止息
