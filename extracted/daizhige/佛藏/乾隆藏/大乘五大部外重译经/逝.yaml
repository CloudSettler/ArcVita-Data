  lesson: 持慈心精进不懈虽历劫勤苦终得成佛度众
  summary_first_person: 我年十六居七重门内遥见佛来光明如日月心即欢喜开解虽母悭贪三请不与我自取己分细衣饭食头面礼足三请奉佛不求忉利梵天及世豪贵唯愿光明智慧如佛帝释虽以劫数艰难相难我誓虽满阎浮火中投身不止终蒙佛授记二百万亿劫后当作佛号须弥加罗
