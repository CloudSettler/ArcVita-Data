  description: 遥见佛来端正如明月光明如日月感佛威神彻照三请母不与遂自取细衣及己分饭食头面礼足奉佛蒙受
- id: guji-逝-event-debate
  title_zh: 与天帝释辩求佛道
  date: -0520-03-04
  year_of: '-0520'
  type: career
  location: 檀尼加柰门外佛前
  description: 帝释在佛后言求佛难得十劫百劫亿劫未得劝求梵释天逝以工师斫木及虽阎浮满火投身不止为喻坚誓求佛并以众生付弥勒
- id: guji-逝-event-prophecy
  title_zh: 蒙佛授记当作须弥加罗佛
  date: -0520-03-05
  year_of: '-0520'
  type: career
  location: 鹞山佛前
  description: 佛言其已供养六万佛后二百万亿劫不堕恶道常作金轮王领四天下后生梵天兜术天上下往来竟当作佛号须弥加罗光明照三千世界再会说法度六千亿四千亿阿罗汉
- id: guji-逝-event-death
  title_zh: 示现涅槃前授记圆满
  date: -0500-12-31
  year_of: '-0500'
  type: death
  location: 阎浮提
  description: 经未载实卒据授记寿终上下天人间二百万亿劫竟成佛度众后入涅槃
