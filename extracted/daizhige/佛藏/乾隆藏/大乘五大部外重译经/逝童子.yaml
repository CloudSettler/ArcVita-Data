person:
  qid: guji-逝童子
  name_zh: 逝童子
  names:
    zh: 逝童子
    en: Shi Tongzi
  lifespan:
    birth:
      date: -0580
      precision: century
      is_circa: true
      raw: 佛世时年十六见佛
    death:
      date: '-0500'
      precision: century
      is_circa: true
      raw: 史阙载授记后转生修行而终
  birth_date: -0580
  death_date: '-0500'
  era: 古印度佛世
  reign_ref: 释迦牟尼在罗阅祇耆阇崛山时
  archetype: 初发心菩萨
  dilemmas:
  - 一饭小施可否直发无上菩提心与帝释所谓须千亿劫积施乃得成佛之争
  - 求易得而脆坏之释梵天位还是求难得而究竟之无上佛智
  lesson: 信与精进不退则一施虽微亦如渐斫大树终断须弥，愿大不嫌行小
  summary_first_person: 我是富迦罗越之子逝，年十六，于第三门内遥见世尊入城分卫，身有奇相光明彻照，心中欢喜求母分食奉佛，不愿富贵亦不望释梵但愿得如佛无上智慧，帝释劝我求易得天位，我誓虽满天下火洞然以身遍投亦不舍佛意，终蒙佛授记后当作佛号须弥劫
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E9%80%9D%E7%AB%A5%E5%AD%90%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E9%80%9D%E7%AB%A5%E5%AD%90%E7%BB%8F.md
endeavors:
- id: guji-逝童子-endeavor-1
  title_zh: 奉食供佛发无上愿
  description: 于罗阅祇门内见佛光明生敬，求母分食衣物奉施并于佛前发愿不求人天富贵直求无上佛智
  phases:
  - key: brewing
    name: 门内见光生信
    labels:
      zh: 见佛
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-meet
  - key: breakthrough
    name: 乞分奉施
    labels:
      zh: 布施
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-offer
  - key: climax
    name: 佛前发大愿
    labels:
      zh: 发愿
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-vow
  - key: closure
    name: 得佛印可
    labels:
      zh: 印可
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-prophecy
  decisions:
  - date: '-0544'
    title_zh: 趋堂白母求分食衣以施佛
    rationale: 见佛威仪光耀殊绝知是最可供养田，欲以现有食分奉上得大利
  - date: '-0544'
    title_zh: 于佛前发愿不求释梵但求佛智
    rationale: 了知释梵亦为死法，唯无上正觉能安群生，故弃小果趣大道
- id: guji-逝童子-endeavor-2
  title_zh: 辩斥帝释立不退誓
  description: 面对天帝释以久劫积施方成佛难劝退，喻以斧渐断大树明剥业从微得，复立虽火满天下以身投之亦不舍道之誓
  phases:
  - key: brewing
    name: 帝释试难
    labels:
      zh: 试难
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-debate-start
  - key: breakthrough
    name: 渐斫喻对
    labels:
      zh: 喻答
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-debate-middle
  - key: climax
    name: 投火不舍誓
    labels:
      zh: 立誓
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-vow-fire
  - key: closure
    name: 帝释默然授记
    labels:
      zh: 授记
    start_date: '-0544'
    highlight_event_id: guji-逝童子-event-prophecy
  decisions:
  - date: '-0544'
    title_zh: 以工匠斫木为喻破一施不成佛之难
    rationale: 明大道由微积渐成，非一施即得亦非一施无益，以信精进为本必为世间将
  - date: '-0544'
    title_zh: 立火劫不舍道之重誓
    rationale: 显归一切智勇如师子之决心，虽一切人共贼害亦常慈心向终不废大道
events:
- id: guji-逝童子-event-birth
  title_zh: 诞生于富迦罗越家
  date: -0580
  year_of: -0580
  is_circa: true
  location: 罗阅祇城富迦罗越家
  description: 富迦罗越之子名逝，生于罗阅祇，至佛入城分卫时年十六
- id: guji-逝童子-event-meet
  title_zh: 第三门内遥见佛光
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 罗阅祇富迦罗越第三门内
  description: 平旦佛被袈裟持应器向富迦罗越门分卫，身有奇相项中光出彻照七重门，逝遥见欢喜肃敬趋上堂白母欲施
- id: guji-逝童子-event-offer
  title_zh: 持食衣诣佛所奉施
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 富迦罗越门外
  description: 母以所有好衣及食具与逝，逝持出诣佛所头面作礼叉手白佛愿受所施，佛即受之为说施福
- id: guji-逝童子-event-vow
  title_zh: 佛前发愿求无上智慧
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 富迦罗越门外佛前
  description: 逝闻佛语自说偈言不愿富贵亦弗望释梵但愿最智慧如佛而无上
- id: guji-逝童子-event-debate-start
  title_zh: 天帝释现前劝求释梵
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 逝前
  description: 天帝释下立逝前说偈谓才用一布施欲求佛者难当世世积若须弥历千亿劫，不如求尊天释梵易可得
- id: guji-逝童子-event-debate-middle
  title_zh: 以渐斫大树为喻答帝释
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 逝前
  description: 逝答帝释譬如工匠欲伐巨木不一下斧便断，斧斫稍渐可尽太山剥业从微得求道亦如是，明有信精进必为世间将
- id: guji-逝童子-event-vow-fire
  title_zh: 立身投火不舍佛意之誓
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 逝前
  description: 逝复答帝释设使一天下满中火洞然吾以身遍投终不舍佛意，假令一切人皆共贼害我愿常慈心向，脆哉释梵皆为死法愿归一切智勇若师子雄
- id: guji-逝童子-event-prophecy
  title_zh: 蒙佛授记当作佛号须弥劫
  date: '-0544'
  year_of: '-0544'
  is_circa: true
  location: 富迦罗越门外
  description: 佛为逝说偈言其已于往世敬事八千佛，后十二亿劫不堕恶趣百亿返作转轮王及帝释梵王，后生兜术天道德成，当居千国界中央作佛号须弥劫，初会度六十千亿阿罗汉等刹中无乱恶众
- id: guji-逝童子-event-death
  title_zh: 授记后转生修行究竟
  date: '-0500'
  year_of: '-0500'
  is_circa: true
  location: 阎浮提
  description: 经未载逝寿终，依授记当于后十二亿劫中多修德善不堕恶趣，历作转轮王帝释梵王兜术天等位，终成须弥劫佛入无余涅槃
