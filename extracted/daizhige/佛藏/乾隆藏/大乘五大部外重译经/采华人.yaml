  summary_first_person: 我本罗阅祇王家采华贱役，日日为宫人采花以进。忽于城外途中遥见世尊威光巍巍，知佛世难遇，遂不惜身命以众华散佛及圣众，归命受法。虽知违时会遭王戮仍至心求道，蒙佛授记未来当得作佛号妙华如来，并以空箧生华感化王心令王悔悟解缚。
