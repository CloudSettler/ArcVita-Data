events:
- id: guji-采华人-event-birth
  title_zh: 生为罗阅祇王家采华仆役
  date: -0600-01-01
  year_of: '-0600'
  description: 生于摩揭陀罗阅祇城，世为贱役属县官受王命常采好花以给王家后宫贵人婇女
  place_zh: 罗阅祇
- id: guji-采华人-event-offering
  title_zh: 城外道逢世尊散华供养
  date: -0600-01-01
  year_of: '-0600'
  description: 与采华人数十人出城采华归途遥见世尊相好威光巍巍与圣众俱，自念佛世难值遂以所采诸华尽散佛及圣众上稽首归命一心重礼
  place_zh: 罗阅祇城外
- id: guji-采华人-event-prediction
  title_zh: 佛为说大乘授妙华记
  date: -0600-01-01
  year_of: '-0600'
  description: 佛知其发大道意甚慈愍之为讲大乘六度无极四等四恩三脱之法，采华人皆发无上正真道意至不退转无所从生，佛即授记后当得佛号妙华如来至真等正觉
  place_zh: 罗阅祇城外佛所
- id: guji-采华人-event-basket-miracle
  title_zh: 归家辞亲华箧续满现瑞
  date: -0600-01-02
  year_of: '-0600'
  description: 供养受记后还归家中与父母妻子辞别言必为王所杀，启箧视之满中好华须曼杂香薰郁远彻四面皆闻
  place_zh: 罗阅祇家中
- id: guji-采华人-event-arrest
  title_zh: 违时被缚面色不变
  date: -0600-01-02
  year_of: '-0600'
  description: 王以失时不进花大嗔遣大臣多将人兵收取反缚入宫罪当弃市，采华人等不恐面色不变自陈为法不惜身命
  place_zh: 罗阅祇王宫
- id: guji-采华人-event-king-conversion
  title_zh: 王诣佛证实悔过解缚
  date: -0600-01-03
  year_of: '-0600'
  description: 王不信其言往诣佛所叉手问佛，佛言此人至心欲度十方以华散佛意无想报已得受记将来成妙华如来，王大欢喜疾解众缚悔过自责佛言能自改者与无过同王及臣民莫不悦豫作礼而去
  place_zh: 罗阅祇佛所
- id: guji-采华人-event-death
  title_zh: 示寂入灭待来成佛
  date: -0550-12-31
  year_of: '-0550'
  description: 经未载俗寿所终，依授记当于来世成佛号妙华如来，此处以示寂标记菩萨本生之终而待未来圆满佛果
  place_zh: 未详
