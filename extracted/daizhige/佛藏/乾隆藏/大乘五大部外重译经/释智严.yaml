    rationale: 旧译未显大乘不退之义，恐学者谤法堕苦，故决于至相寺重译以明佛意
  - date: '0682-01-01'
    title_zh: 定名妙法决定业障并存大乘巨拏胜之名
    rationale: 依经末佛说二名并举，既显妙法威力又明业障决定，令受持者生信
