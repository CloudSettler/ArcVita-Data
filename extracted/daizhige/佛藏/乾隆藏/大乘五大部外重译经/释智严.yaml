  - 大乘独尊与小乘方便如何抉择而不谤法
  - 亲近善知识与远离退缘如何持守初心
  - 直译梵义与顺应汉土如何兼顾流通
  lesson: 宁舍身命不退菩提摄诸众生入大乘方为报佛恩
  summary_first_person: 吾为至相寺沙门智严，幸逢大乘法会，承梵本重译妙法决定业障一经。经中佛告功德庄严开敷花夫人，明初发心菩萨当远声闻退缘、坚大乘愿，宁受诸苦不入小乘涅槃，又说大乘二十四名显其威力。吾愿此译令闻者不谤大乘、发无上心，虽入地狱饿鬼而曾闻一偈亦终得成佛。
