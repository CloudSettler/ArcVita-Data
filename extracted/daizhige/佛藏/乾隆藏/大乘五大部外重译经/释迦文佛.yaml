  dilemmas:
  - title_zh: 舍王位珍宝以身求法
    description: 为求萨昙分陀利一偈，是否弃国、妻子、七宝与身命，挝鼓自炫愿为奴仆，历千岁汲水扫地而不懈
  - title_zh: 授记怨敌与下劣成佛
    description: 是否为曾役己为奴后世诽己之调达授天王佛记，并为八岁龙女即身授佛记，开显一乘平等而破声闻疑执
  lesson: 妙法平等无有下劣，一切众生皆可成佛；求法当不惜身命，供养当在行愿，化导当以授记开其本心
  summary_first_person: 我为求萨昙分陀利，曾为国王立太子而舍国，挝鼓摇铃自卖为奴，千岁汲水扫地采果以供婆罗门。今于罗阅只耆阇崛山涌现七宝浮图与大宝如来共证，开演妙法，更为调达授天王佛记、为八岁龙女证即身成佛，欲令一切入一佛乘。
  source_urls:
