  date: -484-10-01
  year_of: -484
  location: 罗阅只耆阇崛山
  description: 说萨昙分陀利时七宝浮图从地涌出上至梵天，中有大宝佛抱休罗兰叹善哉，邀释迦文佛同坐金床重说妙法，四众天龙咸见证信
- id: guji-释迦文佛-event-dragon
  title_zh: 文殊现龙宫龙女献珠成佛
  date: -484-10-15
  year_of: -484
  location: 耆阇崛山会及沙曷龙王池
  description: 文殊入龙宫说萨昙分陀利度无量众，八岁龙女涌出献价直大国摩尼珠与佛，佛疾受已，女即转身为菩萨复为佛身，具相好国土弟子，三千世界震动
- id: guji-释迦文佛-event-prophecy
  title_zh: 授调达天王佛记
  date: -484-11-01
  year_of: -484
