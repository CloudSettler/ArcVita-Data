  decisions:
  - date: -484-10-01
    title_zh: 上多宝金床重说萨昙分陀利
    rationale: 多宝佛远来证信，愿坐其床更说妙法，使大众生信法华即是佛真意，三世诸佛共护一乘
  - date: -484-10-15
    title_zh: 遣文殊演龙宫并为龙女授记
    rationale: 欲破下劣不堪成佛之疑，示现龙宫八岁女闻法即证，献珠受记当下转女成佛，以显妙法速疾平等
  - date: -484-11-01
    title_zh: 为调达授天王佛记
    rationale: 念调达为昔授法恩师，虽今生逆害，实令我满六度相好，当以大悲授其未来天地国成佛度恒沙众生，令众知怨亲平等
