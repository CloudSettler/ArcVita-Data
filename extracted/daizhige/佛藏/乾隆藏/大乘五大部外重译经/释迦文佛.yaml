  description: 自陈调达为过去授法婆罗门，恩令己满六度相好，当来阿僧祇劫后调达作佛号提和罗耶天王佛，国名天地国，寿二十劫度恒沙人证罗汉辟支佛道
- id: guji-释迦文佛-event-death
  title_zh: 拘尸那罗入般泥洹
  date: -483-02-15
  year_of: -483
  location: 拘尸那罗娑罗林
  description: 住世说法度众已竟，于二月十五日入般泥洹，后法住流传，示现萨昙分陀利为最后付嘱
