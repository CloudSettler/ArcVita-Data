  - date: -1500-01-01
    title_zh: 舍国立太子挝鼓求法
    rationale: 知萨昙分陀利为成佛要轨，国位七宝皆为无常，唯法可度生死，故以鼓铃自售求为法奴
  - date: -1499-06-01
    title_zh: 愿为婆罗门奴千岁供养
    rationale: 婆罗门自称有妙法，若不以身代劳、汲水扫地采果饮食，则不得闻受，故一心作奴以显求法至诚
- id: guji-释迦文佛-endeavor-2
  title_zh: 灵山共证广演法华授记成佛
  description: 于耆阇崛山四众八部会中说萨昙分陀利无央数偈，感多宝浮图踊现共证，就金床重说妙法，并广度龙宫、为调达及八岁龙女授记，显示一乘普被
