  date: -0624-02-01
  year_of: -624
  description: 菩萨升演施法讲堂师子座，为诸天及三万二千菩萨宣说至诚慈悲等八百法曜法门，八万四千天子发无上道心
  place_zh: 兜率天高幢宫
- id: guji-释迦牟尼-event-select
  title_zh: 普观拣择定白净王妙后为父母
  date: -0624-04-01
  year_of: -624
  description: 与幢英等诸天共议，列六十德拣诸大国皆不可意，唯迦毗罗卫释种炽盛，白净王仁贤妙后清净具德应往降神
  place_zh: 兜率天演施法讲堂
- id: guji-释迦牟尼-event-descend
  title_zh: 降神处妙后胎中
  date: -0623-04-08
  year_of: -623
  description: 菩萨从兜率降神，于妙后胎中娱乐开化，示现殊特令天龙鬼神皆悦
  place_zh: 迦毗罗卫王宫
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 示现成佛降伏魔场转法轮
  date: -0588-12-08
  year_of: -588
  description: 示现出家诣佛树下，降伏魔场，具足如来十力无畏，颁宣诸佛无量经典，如普曜所显
  place_zh: 菩提树下
- id: guji-释迦牟尼-event-death
  title_zh: 般涅槃
  date: -0543-02-15
  year_of: -543
  description: 化缘既毕，于拘尸那城娑罗双树间示现般涅槃，令正法住世
  place_zh: 拘尸那城
