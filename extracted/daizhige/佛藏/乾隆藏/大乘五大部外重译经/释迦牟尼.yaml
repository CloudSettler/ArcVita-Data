  decisions:
  - date: -1200-01-01
    title_zh: 割双乳救饥母子
    rationale: 见母欲啖子不忍母子俱亡遂自割乳令得饱活不计毁伤以全慈悲
  - date: -1200-02-01
    title_zh: 现至诚转女为男
    rationale: 应帝释化婆罗门试探以至诚感得转女身为男子以证布施无异心
  - date: -1190-03-01
    title_zh: 立为王开四门布施
    rationale: 被众臣立为优波罗越王以正法治国不施鞭杖广设布施教民持八关斋
  - date: -1180-04-01
    title_zh: 涂香入山舍身饲虎
    rationale: 念我昔布施人与禽兽更难遂入山以身饲妊娠饿虎令虎子得活
- id: guji-释迦牟尼-endeavor-2
  title_zh: 六十劫精进超越成佛说法
  description: 露地禅思得五通精进逾二道人降伏六十亿魔超越弥勒九劫于舍卫祇园放光演说本生度无量众
