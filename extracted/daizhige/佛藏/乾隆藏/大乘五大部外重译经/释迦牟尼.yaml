  decisions:
  - date: -0528-04-08
    title_zh: 定四月八日为佛生出家成道涅槃之日
    rationale: 春夏之际殃罪悉毕万物普生毒气未行不寒不热时气和适正是佛生之日故以此日示现令众生易忆
  - date: -0483-04-08
    title_zh: 教灭后浴佛形像如佛在时
    rationale: 令善男女至心念佛功德以香花杂汤浴像所愿皆得诸天龙神常随拥护福报清净以至成佛
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 四月八日夜半诞生行七步
  date: -0563-04-08
  year_of: -563
  location: 迦毗罗卫国蓝毗尼园
  description: 太子以四月八日夜半明星出时生堕地行七步举右手言天上天下唯吾为尊地为大动第一四天王乃至梵天忉利天王各持十二种香汤杂种名花以浴太子
- id: guji-释迦牟尼-event-renunciation
  title_zh: 四月八日夜半出家入山学道
  date: -0534-04-08
  year_of: -534
  location: 迦毗罗卫国外伽耶山
  description: 十方诸佛皆用四月八日夜半时出家入山学道太子舍王宫富乐入山精进求无为道
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 四月八日夜半成佛开法
  date: -0528-04-08
  year_of: -528
  location: 伽耶菩提树下
  description: 十方诸佛皆用四月八日夜半时成佛太子得成佛道开现圣法济度群氓
- id: guji-释迦牟尼-event-bathing-teaching
  title_zh: 开示浴佛形像功德
  date: -0520-04-08
  year_of: -520
  location: 舍卫国祇园精舍
  description: 告摩诃刹头诸天人民灭后当至心念佛功德浴佛形像如佛在时得福无量善以香花杂物浴像所愿皆得诸天龙神常随拥护证明
- id: guji-释迦牟尼-event-death
  title_zh: 四月八日夜半般涅槃
  date: -0483-04-08
  year_of: -483
  location: 拘尸那伽娑罗双树间
  description: 十方诸佛皆用四月八日夜半时而般涅槃佛示现涅槃遗教弟子以浴佛功德生死相随无有断期从是因缘得成佛道
