  - https://cbetaonline.dila.edu.tw/zh/T0186
endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 兜率天广演法曜与拣择降生处
  description: 在兜率天高幢宫升师子座，为诸菩萨天子宣说八百法曜法门，普观十方世界一生补处降神因缘，拣择具六十德之种姓国土
  phases:
  - key: brewing
    name: 高幢升座眷属云集
    labels:
      zh: 升座
    start_date: -0624-01-01
    highlight_event_id: guji-释迦牟尼-event-fayao
  - key: breakthrough
    name: 宣说八百法曜法门
    labels:
      zh: 说法
    start_date: -0624-02-01
    highlight_event_id: guji-释迦牟尼-event-fayao
  - key: climax
    name: 普议天下拣择种姓
    labels:
      zh: 拣择
    start_date: -0624-03-01
    highlight_event_id: guji-释迦牟尼-event-select
  - key: closure
    name: 定迦毗罗卫释种白净王家
    labels:
      zh: 定处
    start_date: -0624-04-01
    highlight_event_id: guji-释迦牟尼-event-select
  decisions:
  - date: -0624-02-01
    title_zh: 决定广开法曜八百法门以摄天人
    rationale: 为令诸天了知至诚慈悲诸度无极等道品，须略说要义令发无上正真道心
  - date: -0624-03-15
    title_zh: 驳诸国土皆不具德不堪降神
    rationale: 维提拘萨和沙维耶离鏺树等国或父母不真或福薄边鄙或好诤刚强，皆不合一生补处六十德
  - date: -0624-04-01
    title_zh: 拣定白净王妙后为父母
    rationale: 迦毗罗卫种姓真正眷属和穆，白净王仁贤妙后清净具三十二相德，前五百世为菩萨母，堪任受持大圣
- id: guji-释迦牟尼-endeavor-2
  title_zh: 降神母胎示现菩萨行化
  description: 依六十德既定降生处，从兜率降神处妙后胎中，示现入胎住胎之殊胜，开化天龙鬼神，为后成佛转法轮作本
  phases:
  - key: brewing
    name: 宿德成就相好庄严
    labels:
      zh: 宿德
    start_date: -0623-04-01
    highlight_event_id: guji-释迦牟尼-event-descend
  - key: breakthrough
    name: 降神妙后胎中娱乐开化
    labels:
      zh: 降神
    start_date: -0623-04-08
    highlight_event_id: guji-释迦牟尼-event-descend
  - key: climax
    name: 示现出生学艺降魔之前相
    labels:
      zh: 示现
    start_date: -0623-05-08
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: closure
    name: 具足十力无畏颁宣诸佛经典
    labels:
      zh: 具足
    start_date: -0593-01-01
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  decisions:
  - date: -0623-04-08
    title_zh: 以神通自娱总持示现处胎不染
    rationale: 欲令众生知菩萨虽在尘劳如莲处污不著，见莫不欢而生渴仰
  - date: -0593-12-08
    title_zh: 决定菩提树下降伏魔场示现正觉
    rationale: 非降魔怨不能显佛十力无畏，亦不能为大乘分别众德之本
events:
