  birth_date: -0623-05-08
  death_date: -0543-02-15
  era: 春秋
  reign_ref: 迦毗罗卫净饭王
  archetype: sage_founder
  dilemmas:
  - 兜率天宫安乐自在与人间五浊苦难之间，何以舍天乐而降神母胎以践大悲
  - 王位富贵与出家求道之间，何以弃轮王尊豪而示现修行以求正觉
  lesson: 诸法如幻如化如梦如影，当以大慈大悲与智慧善权普济众生，不著八风，具足十力无畏以转正法轮
  summary_first_person: 吾昔为兜率天一生补处菩萨，居高幢天宫二千五百六十里讲堂，为诸天说八百法曜法门，普观天下拣择六十德具足之释种迦毗罗卫白净王与妙后为父母，欲降神母胎，示现在宫学诸算艺、降伏魔场、成就佛道，令天人获安。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E6%99%AE%E6%9B%9C%E7%BB%8F.html
