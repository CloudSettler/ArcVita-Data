events:
- id: guji-释迦牟尼-event-birth
  title_zh: 诞生于迦毗罗卫蓝毗尼园
  date: -0563-04-08
  location_zh: 迦毗罗卫蓝毗尼园
  description_zh: 净饭王太子诞生后出家成道为释迦牟尼佛后于王舍城说如来智印经
- id: guji-释迦牟尼-event-samadhi-light
  title_zh: 竹园入佛境界三昧放大光明
  date: -0486-04-15
  location_zh: 王舍城迦兰陀竹园
  description_zh: 入无色无执无示无形三昧放大光明遍照三千大千世界覆七宝罗网生千叶华通竹园与耆阇崛山为一会
- id: guji-释迦牟尼-event-gathering
  title_zh: 十方菩萨声闻天众云集
  date: -0486-04-16
  location_zh: 王舍城迦兰陀竹园
  description_zh: 东方恒沙诸佛遣万阿僧祇一生补处菩萨及南西北方上下菩萨声闻缘觉天龙八部皆来集会文殊与舍利弗等试观佛身不见
- id: guji-释迦牟尼-event-preach-seal
  title_zh: 宣说如来智印三昧及佛身偈
  date: -0486-04-16
  location_zh: 王舍城迦兰陀竹园
  description_zh: 从定起为舍利弗说佛身非身非作非起非灭本性清净并说如身非身身解脱等偈广显智印功德胜百千劫六波罗蜜
- id: guji-释迦牟尼-event-entrust-maitreya
  title_zh: 嘱累文殊弥勒守护正法
  date: -0486-04-17
  location_zh: 王舍城迦兰陀竹园
  description_zh: 告文殊不住不戏论守护无上道告弥勒后五十岁当护此经明三十亿菩萨中八千能护余不能护
- id: guji-释迦牟尼-event-prophecy-xianshou
  title_zh: 为贤首金光等授记往生极乐
  date: -0486-04-18
  location_zh: 王舍城迦兰陀竹园
  description_zh: 贤首金光二夫人散华奉衣发愿护经佛微笑放光授记彼等及八千女人六万优婆夷当生无量极乐国千叶华中
- id: guji-释迦牟尼-event-death
  title_zh: 入无余涅槃于拘尸那迦
  date: -0483-02-15
  location_zh: 拘尸那迦娑罗林
  description_zh: 住世说法四十九年后示现灭度令弟子结集正法智印三昧由弥勒等护持流传末世
