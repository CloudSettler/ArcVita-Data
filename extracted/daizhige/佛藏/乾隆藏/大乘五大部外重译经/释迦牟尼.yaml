    highlight_event_id: guji-释迦牟尼-event-firstsermon
  decisions:
  - date: -0528-04-01
    title_zh: 受牧女乳糜舍苦行
    rationale: 知苦行非道形枯心昏不能得觉，譬如琴弦过紧则断，故受食养身以修中道
  - date: -0528-04-15
    title_zh: 金刚座上誓不成正觉终不起
    rationale: 以菩提心为根金刚慧为剑，以大悲军破烦恼魔军，必证一切智智方起度生
events:
- id: guji-释迦牟尼-event-tushita
