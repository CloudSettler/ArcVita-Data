  - date: -528-12-08
    title_zh: 菩提树下降魔成正觉
    rationale: 以六十劫布施精进之力降伏六十亿魔得无挂碍慧超越九劫出弥勒前
  - date: -528-12-15
    title_zh: 于舍卫祇园说前世三转
    rationale: 放光微笑现授决之相为阿难及大众宣说割乳为王饲虎三转本生令知布施福
