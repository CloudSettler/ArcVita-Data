  dilemmas:
  - 如何以无相无得之法显示佛身令著相众生得入不思议境
  - 如何于末世法将灭时令菩萨不惜身命守护正法不退转
  - 如何调和声闻以慧眼不见与菩萨以信解能入之根机差异
  lesson: 佛身真实非身非作离一切相而遍现一切当以无所得平等心修六度护持智印正法即是护持自心成佛之本
  summary_first_person: 吾于王舍城迦兰陀竹园入佛境界三昧无色无执放大光明遍照三千集十方菩萨与声闻天众为舍利弗及文殊等广说如来身相离相显智印三昧功德复付嘱弥勒文殊守护此经授记贤首等护法者往生极乐愿令正法久住不断
