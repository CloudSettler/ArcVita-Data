  date: -0564-01-01
  year_of: -564
  location_zh: 兜率天宫
  description_zh: 为补处菩萨名净幢，为诸天说法，观察劫减时至、阎浮提有智慧、中国释种具六十四德、摩耶具三十二德，方决定降生
- id: guji-释迦牟尼-event-birth
  title_zh: 白象入胎降生迦毗罗卫
  date: -0563-04-08
  year_of: -563
  location_zh: 迦毗罗卫蓝毗尼园
  description_zh: 以白月弗沙星合时，菩萨现白象形入摩耶夫人胎，逾十月于蓝毗尼园诞生，具三十二大人相
- id: guji-释迦牟尼-event-arts
  title_zh: 示现童子伎艺最胜
  date: -0547-01-01
  year_of: -547
  location_zh: 迦毗罗卫王宫
  description_zh: 示现书算工巧、捔力骋武、五明伎艺，于世间皆悉最胜，无能及者
- id: guji-释迦牟尼-event-renunciation
  title_zh: 四门出游逾城出家
  date: -0534-02-08
  year_of: -534
  location_zh: 迦毗罗卫四门及城外
  description_zh: 出四门见老病死及沙门，深生厌离，于夜半逾城出家，舍转轮王位求无上道
- id: guji-释迦牟尼-event-ascetic
  title_zh: 雪山六年苦行
  date: -0534-03-01
  year_of: -534
  location_zh: 尼连禅河边苦行林
  description_zh: 往伽耶苦行林六年，日食一麻一麦，修无益苦行，形体枯羸犹不證道
- id: guji-释迦牟尼-event-middleway
  title_zh: 受乳糜舍苦行悟中道
  date: -0528-04-01
  year_of: -528
  location_zh: 尼连禅河苏迦多村
  description_zh: 受牧女苏阇多乳糜，浴尼连禅河，知离苦乐二边行中道方能成觉
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 菩提树下降魔成正觉
  date: -0528-04-15
  year_of: -528
  location_zh: 伽耶菩提树下金刚座
  description_zh: 敷草为座结跏趺坐，以慈悲及金刚慧降伏魔军，夜睹明星证阿耨多罗三藐三菩提，具十力四无畏
- id: guji-释迦牟尼-event-firstsermon
  title_zh: 鹿野苑初转法轮
  date: -0528-06-01
  year_of: -528
  location_zh: 波罗奈仙人鹿苑
  description_zh: 为憍陈如等五比丘说四圣谛、八正道、三转十二行法轮，度五人出家，僧宝始成
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那揭罗娑罗双树涅槃
  date: -0483-02-15
  year_of: -483
  location_zh: 拘尸那揭罗娑罗林
  description_zh: 说法四十九年化缘已毕，于娑罗双树间入大般涅槃，示现无常以警众生
