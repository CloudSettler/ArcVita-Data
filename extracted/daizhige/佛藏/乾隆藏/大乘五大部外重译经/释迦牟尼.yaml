  dilemmas:
  - 以自毁割乳救饥母欲啖子的母子存亡抉择
  - 转身为王后开藏大施与国政延续的权衡
  - 以血肉舍饲妊娠饿虎的生死求道抉择
  lesson: 若知布施之福如我所知则当舍己济众至诚无悔慈悲方为成佛捷径超越九劫在精进布施
  summary_first_person: 吾昔为优波罗越淫女见饥母欲啖子不忍割双乳救之感天试探转女为男立为王以正法治国大施五百岁复为婆罗门子入山见饿虎将啖子遂刺臂出血舍身饲之精行六十劫超越弥勒九劫而成佛今于舍卫祇园放光微笑为众说此三转因缘
