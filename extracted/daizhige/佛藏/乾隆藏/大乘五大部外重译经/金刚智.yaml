  archetype: 密教译师
  dilemmas:
  - 显教广学与密教专精之抉择
  - 久住锡兰弘化与航海东渡震旦之抉择
  lesson: 以陀罗尼为方便摄薄福众生，显密不二，令无根器者亦得顿生菩提分
  summary_first_person: 吾南天竺摩赖耶国婆罗门种，少出家师事龙智，遍游中天竺那烂陀及锡兰得真言灌顶，航海东来至大唐长安洛阳，蒙玄宗礼敬，于荐福资圣译准提等密典，立灌顶道场授不空，愿令一切薄福众生由持明速证菩提
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说七俱胝佛母准提大明陀罗尼经.md
  - https://cbetaonline.dila.edu.tw/zh/T1075
endeavors:
- id: guji-金刚智-endeavor-1
  title_zh: 南天竺出家与西行求密
  summary: 生于婆罗门家，十余岁出家师事龙智十年，通显教及声明因明，后历游中印度那烂陀、南印度、锡兰礼佛牙求密藏，得七俱胝准提等陀罗尼观行次第
  phases:
  - key: brewing
    name: 婆罗门家学与初慕佛法
    labels:
      zh: 家世薰习
    start_date: '0671'
    highlight_event_id: guji-金刚智-event-birth
  - key: breakthrough
    name: 师事龙智习显密教典
    labels:
      zh: 出家学法
    start_date: 0687
    highlight_event_id: guji-金刚智-event-ordination
  - key: climax
    name: 历游那烂陀锡兰得灌顶
    labels:
      zh: 参学得法
    start_date: '0710'
    highlight_event_id: guji-金刚智-event-pilgrimage
  - key: closure
    name: 决意航海东行求法缘
    labels:
      zh: 东行发愿
    start_date: 0718
    highlight_event_id: guji-金刚智-event-voyage-east
  decisions:
  - date: 0687
    title_zh: 弃毗陀学而出家受菩萨戒
    rationale: 见佛法能了生死，密咒能即身成佛，遂舍婆罗门学从龙智阿阇梨受三摩耶灌顶
  - date: '0710'
    title_zh: 南下锡兰礼佛牙求密藏
    rationale: 闻锡兰藏有龙树开南天铁塔所传真言，亲往求得准提等陀罗尼及曼荼罗观行
  - date: 0718
    title_zh: 决意航海东渡大唐
    rationale: 欲令密教广行震旦，度无根器薄福众生，遂随商舶东行虽经风涛不退
- id: guji-金刚智-endeavor-2
  title_zh: 东入大唐译经授法
  summary: 开元七年至广州，八年至长安，玄宗迎于荐福寺，奉诏于资圣寺慈恩寺译出七俱胝佛母准提大明陀罗尼经、金刚顶瑜伽诸经，建灌顶道场授不空三藏为嗣，奠定开元三大士之一地位
  phases:
  - key: brewing
    name: 航海至广州初入长安
    labels:
      zh: 初入唐土
    start_date: 0719
    highlight_event_id: guji-金刚智-event-arrival-changan
  - key: breakthrough
    name: 奉诏译准提等陀罗尼
    labels:
      zh: 奉诏翻译
    start_date: '0723'
    highlight_event_id: guji-金刚智-event-translation
  - key: climax
    name: 建曼荼罗授不空灌顶
    labels:
      zh: 授法传嗣
    start_date: '0730'
    highlight_event_id: guji-金刚智-event-transmit-bukong
  - key: closure
    name: 示寂洛阳舍利建塔
    labels:
      zh: 圆寂荼毗
    start_date: '0741'
    highlight_event_id: guji-金刚智-event-death
  decisions:
  - date: '0720'
    title_zh: 应玄宗请住资圣寺译场
    rationale: 欲以陀罗尼方便令薄福众生速得菩提分，不滞显教长劫阶次，故开密坛译事
  - date: '0730'
    title_zh: 择不空为法嗣授两部大法
    rationale: 见不空根器猛利堪能荷担胎藏金刚两界，付以灌顶可令法脉不绝于中土
  - date: '0735'
    title_zh: 制曼荼罗观行次第详示念诵法
    rationale: 恐后学不知三摩耶与布字观，故于译本附观行法具载手契坛法与心月布字义
