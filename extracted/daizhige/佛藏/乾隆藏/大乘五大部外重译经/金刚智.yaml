- id: guji-金刚智-event-death
  title_zh: 圆寂于洛阳广福寺
  date: '0741'
  year_of: '0741'
  location_zh: 洛阳广福寺
  description: 开元二十九年示寂，年七十一，敕谥国师，荼毗得舍利建塔供养，不空继其法席
