person:
  qid: guji-银色女
  name_zh: 银色女
  names:
    zh: 银色女
    en: Silver Lady
  lifespan:
    birth:
      date: -3000-01-01
      precision: century
      is_circa: true
      raw: 过去无量劫莲华王都托生时
    death:
      date: -2900-01-01
      precision: century
      is_circa: true
      raw: 银色王治世无量百千岁后命终
  birth_date: -3000-01-01
  death_date: -2900-01-01
  era: 过去无量劫
  reign_ref: 莲华王都
  archetype: 悲心菩萨行者
  dilemmas:
  - 产妇饥困欲食亲子，若带子去则母亡，不带则子被食，当如何两全
  - 自割二乳剧痛流血，亲族诘问悔与不悔，是否真檀波罗蜜
  - 帝释化婆罗门试探诘问，若心存疑悔则堕为有相之施，如何以誓愿证无悔
  - 得转男身继大位，当以王法治世行十善，还是舍国入山行苦行饲虎济生
  lesson: 真檀在无悔，誓由悲心发；不计身苦、不求果报，以一切智心行施，乃能感天、转身、化世而趣无上菩提
  summary_first_person: 我本莲华王都银色女，端正殊妙，见他舍产妇饥馁欲食新子，哀其困苦，遂自取利刀割二乳与之，令母得饱、子得活，流血曳地而归，亲族问悔，我立誓无异想二乳复如本；帝释疑我化作婆罗门来试，我以求一切智、救一切众生心再立誓，即转女身为男子，后为银色王劝国人行十善；后世更转生为童子教五百学童发菩提心，为禽兽施身饲鸟，又为摩那婆入山见饿虎将食自子，遂舍身饲虎，以此悲施因缘趣求阿耨多罗三藐三菩提，今我即是昔日银色女。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E9%93%B6%E8%89%B2%E5%A5%B3%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E9%93%B6%E8%89%B2%E5%A5%B3%E7%BB%8F.md
endeavors:
- id: guji-银色女-endeavor-1
  title_zh: 割乳赎子证檀波罗蜜
  summary_zh: 于莲华王都见产妇饥极欲食亲子，以自割二乳布施救母子二命，誓愿无悔感乳复生，为初发大悲、修檀波罗蜜之始
  phases:
  - key: brewing
    name: 见苦生悲
    labels:
      zh: 入他舍见产妇欲食子
    start_date: -3000-02-01
    highlight_event_id: guji-银色女-event-cut-breast
  - key: breakthrough
    name: 割乳救急
    labels:
      zh: 自割二乳与饥母
    start_date: -3000-02-01
    highlight_event_id: guji-银色女-event-cut-breast
  - key: climax
    name: 誓愿复乳
    labels:
      zh: 立誓无悔乳还复如本
    start_date: -3000-02-02
    highlight_event_id: guji-银色女-event-vow-recover
  - key: closure
    name: 天人传唱
    labels:
      zh: 夜叉地天乃至梵天传声称叹
    start_date: -3000-02-03
    highlight_event_id: guji-银色女-event-vow-recover
  decisions:
  - date: -3000-02-01
    title_zh: 借刀自割二乳救二命
    rationale: 若将子去母亡，不去子被食，唯有舍自身肉方可两全，起大悲心求无上菩提故行此难施
  - date: -3000-02-02
    title_zh: 对亲族立誓无悔心无异想
    rationale: 亲族谓悔则非波罗蜜，遂以不悔誓愿令二乳复生，显真檀在心不在苦乐
- id: guji-银色女-endeavor-2
  title_zh: 转女成男以十善化国
  summary_zh: 受帝释试探立誓转女为男，继莲华王位劝令大臣人民受持十善业道，治世无量岁，以王法治化众生
  phases:
  - key: brewing
    name: 帝释生疑来试
    labels:
      zh: 变婆罗门执金器乞问割乳虚实
    start_date: -3000-03-01
    highlight_event_id: guji-银色女-event-test-transform
  - key: breakthrough
    name: 誓化男身
    labels:
      zh: 以求一切智心立誓转女成男
    start_date: -3000-03-01
    highlight_event_id: guji-银色女-event-test-transform
  - key: climax
    name: 树荫不移选为王
    labels:
      zh: 大臣见树影不舍奇相迎立
    start_date: -3000-03-15
    highlight_event_id: guji-银色女-event-enthroned
  - key: closure
    name: 十善治国
    labels:
      zh: 约众受十善而后即位教化
    start_date: -3000-03-16
    highlight_event_id: guji-银色女-event-enthroned
  decisions:
  - date: -3000-03-01
    title_zh: 以求一切世间胜心立誓转身
    rationale: 欲破疑网、显悲愿真实，不为女身所碍而广利众生，故以无悔割乳之诚求转男身
  - date: -3000-03-15
    title_zh: 约十善而后受王位
    rationale: 非贪王位，欲藉国法治化令民寿命延长、止恶行善，若众不受十善则不为王
- id: guji-银色女-endeavor-3
  title_zh: 多生舍身饲众生
  summary_zh: 后世复生为童子劝发菩提心，为禽兽施眼肉于尸陀林，后为摩那婆舍身饲产后饿虎，历劫以身命行檀，累积成佛资粮
  phases:
  - key: brewing
    name: 劝学发心
    labels:
      zh: 于学堂令五百童子发无上菩提心说六波罗蜜
    start_date: -2980-04-01
    highlight_event_id: guji-银色女-event-teach-bodhi
  - key: breakthrough
    name: 尸林施身饲鸟
    labels:
      zh: 刺血涂身卧林施禽鸟啖二眼尽食其肉
    start_date: -2980-05-01
    highlight_event_id: guji-银色女-event-bird-offering
  - key: climax
    name: 入山见虎
    labels:
      zh: 得天眼见母虎怀妊将产恐食自子
    start_date: -2970-05-15
    highlight_event_id: guji-银色女-event-tiger-offering
  - key: closure
    name: 舍身饲虎
    labels:
      zh: 二仙惜命飞去自坏身施饿虎誓成正觉
    start_date: -2970-06-01
    highlight_event_id: guji-银色女-event-tiger-offering
  decisions:
  - date: -2980-05-01
    title_zh: 以血油涂身卧尸陀林施鸟兽
    rationale: 欲以微少物施二足四足众生，自轻身命引鸟啄眼而不生嫌恨，习忍辱与檀行
  - date: -2970-06-01
    title_zh: 自取利刀坏身施饿虎
    rationale: 二仙不能割身，母虎产后饥困将害其子，正是行苦行利生之时，遂舍身以济虎命并愿得无上菩提
