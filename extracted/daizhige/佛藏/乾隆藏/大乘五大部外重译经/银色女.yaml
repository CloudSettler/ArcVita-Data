  type: endeavor
  summary_zh: 银色王命终再生为长者子，八岁入堂，劝五百旧学童勿徒学书，当发阿耨多罗三藐三菩提心修六波罗蜜，众皆发心
- id: guji-银色女-event-bird-offering
  title_zh: 尸陀林舍眼肉饲众鸟
  date: -2980-05-01
  year_of: -2980
  is_circa: true
  location_zh: 莲华王都尸陀林
  type: endeavor
  summary_zh: 以利刀刺身出血油涂遍身卧林中，召二足四足禽兽来食，鸟名有手挽其右眼复放，问答后鸟啖二眼，众鸟集至食肉尽唯白骨在
- id: guji-银色女-event-tiger-offering
  title_zh: 摩那婆舍身饲产后饿虎
  date: -2970-06-01
  year_of: -2970
  is_circa: true
  location_zh: 深山林母虎处
  type: endeavor
  summary_zh: 再生婆罗门家名摩那婆，入山见二仙，遥见母虎怀妊将产，产后衔子困饿，二仙惜命飞去，摩那婆取利刀自坏身施虎，誓以此因缘必得无上菩提
- id: guji-银色女-event-death
  title_zh: 银色王命终
  date: -2900-01-01
  year_of: -2900
  is_circa: true
  location_zh: 莲华王都
  type: death
  summary_zh: 银色王治世无量百千岁，临终说偈一切皆无常合会必有离有命皆必死，随所作善恶而去，命终后还生莲华王都长者家等，展转舍身相续
