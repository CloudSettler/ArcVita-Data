    start_date: 0590
    highlight_event_id: guji-阇那崛多-event-translation-jingangchang
  decisions:
  - date: 0559
    title_zh: 应请东行入中土
    rationale: 不恋故乡安乐，欲以三藏法宝报中土求法之切，遂随商旅东度葱岭
  - date: 0582
    title_zh: 受隋文帝诏入大兴善寺译场
    rationale: 见隋一统弘护佛法，愿以梵汉语学长才，正译文以定群疑，不以异域自外
  - date: 0585
    title_zh: 于金刚场法门中显非二译法
    rationale: 经旨言无明即菩提无二无别，当以平等句译之，使华人不堕断常二边
- id: guji-阇那崛多-endeavor-2
  name_zh: 般若空宗弘传与异域文化融通
  summary_zh: 以金刚场等大乘经为据，开示一切法平等、烦恼即菩提之理，调和天竺与华夏义学，广结道俗护持。
  phases:
  - key: brewing
    name: 观华夏法俗根机
    labels:
      zh: 酝酿
    start_date: '0560'
    highlight_event_id: guji-阇那崛多-event-arrival
  - key: breakthrough
    name: 以陀罗尼法门摄众
    labels:
      zh: 突破
    start_date: 0582
    highlight_event_id: guji-阇那崛多-event-translation-kaihuang
  - key: climax
    name: 雪山金庄严窟法会宣演
    labels:
      zh: 高峰
    start_date: 0585
    highlight_event_id: guji-阇那崛多-event-translation-jingangchang
  - key: closure
    name: 付嘱流通示现无著
    labels:
      zh: 收束
    start_date: 0595
    highlight_event_id: guji-阇那崛多-event-death
  decisions:
  - date: 0585
    title_zh: 以一字法门总摄万法
    rationale: 众生根钝难持广文，示无有一切诸法之一字陀罗尼，令一闻即入平等
  - date: 0590
    title_zh: 不舍凡夫不执佛法而说法
    rationale: 金刚场中无缚无解，若执佛法为净凡夫为染则复成二见，故双遣以显中道
events:
- id: guji-阇那崛多-event-birth
  title_zh: 生于北天竺犍陀罗
  date: '0523'
  year_of: 339
  place_zh: 北天竺犍陀罗
  description_zh: 阇那崛多生于犍陀罗国，婆罗门种，少出家精通三藏，尤善梵呗与陀罗尼。
- id: guji-阇那崛多-event-arrival
  title_zh: 随师东来历北齐北周入长安
  date: 0559
  year_of: 0559
  place_zh: 邺城及长安
  description_zh: 天统年间与师阇那耶舍等东来中土，历北齐北周两朝，隋受禅后以梵学见重于朝。
- id: guji-阇那崛多-event-translation-kaihuang
  title_zh: 奉隋文帝诏在大兴善寺开译场
  date: 0582
  year_of: 0582
  place_zh: 隋大兴善寺
  description_zh: 开皇初年奉诏与达摩笈多等同居译场，主持翻译，前后译出佛本行集经等三十余部，为隋代四大译师之一。
- id: guji-阇那崛多-event-translation-jingangchang
  title_zh: 译出金刚场陀罗尼经一卷
  date: 0585
  year_of: 0585
  place_zh: 长安
  description_zh: 于妙色聚落金庄严窟法会缘起下，译出金刚场陀罗尼经，宣说诸法平等、无明即菩提、一字陀罗尼总持等甚深法门，文殊等菩萨同会印可。
- id: guji-阇那崛多-event-death
  title_zh: 卒于长安
  date: '0600'
  year_of: 384
  place_zh: 隋长安
  description_zh: 在长安译场示寂，世寿约七十八，隋廷惜之，所译经典后入乾隆藏大乘五大部外重译经部流传至今。
