  dilemmas:
  - 梵本精义与华言通畅之间何以取舍以不失真而利信解
  - 异域僧旅居隋都面对朝政更迭与译场进退当如何自处
  lesson: 以淳净心归依三宝其功德胜满世界有为供养百千万亿不可校量，译传当以启信为要
  summary_first_person: 吾本北天竺犍陀罗人，少习梵典，慕中土弘法因缘，西来入隋，居长安译场，重译此希有校量功德经，愿令众生知三归依功德希有难量，发淳净心
