    title_zh: 周武灭法时秘藏梵本
    rationale: 遭周武毁佛，冒死留护梵夹，不使西来经本散佚，为后日复兴存法脉
  - date: 0582
    title_zh: 应隋文帝诏入大兴善寺译场
    rationale: 顺应开皇兴佛之运，任译主与证义，定译法以信达雅为衡，广译大乘经典
- id: guji-阇那崛多-endeavor-2
  title_zh: 译弘大云请雨法门
  description: 译出佛说大方等大云请雨经一卷，宣说慈行、安乐陀罗尼及诸云如来名号与请雨神咒，令诸龙调雨、息灾厉
