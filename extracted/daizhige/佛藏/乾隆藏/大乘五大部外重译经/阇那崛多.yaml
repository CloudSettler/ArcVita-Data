  decisions:
  - date: 0585
    title_zh: 以杂咒合编而非单经单译
    rationale: 众生根机各异，集药王、勇施、毗沙门等诸咒于一卷，便于随病随用
  - date: 0585
    title_zh: 详注反切与声调以存梵音
    rationale: 咒以音为体，增丁可反、奴帝反等切音，宁繁不略以保持咒灵验
  - date: 0590
    title_zh: 附载绕塔礼拜坐禅等行法
    rationale: 不独译咒，更译行法，使诵咒与礼绕、忏悔、坐禅相摄，令信者得实践之门
events:
- id: guji-阇那崛多-event-birth
  title_zh: 生于北天竺犍陀罗
  date: '0523'
  year_of: 339
  kind: birth
  description: 约523年生于北天竺犍陀罗国，婆罗门种，少出家习大小乘三藏及陀罗尼
- id: guji-阇那崛多-event-arrival
  title_zh: 至长安入北周
  date: 0559
  year_of: 0559
  kind: career
  description: 与耶舍崛多等同行，逾葱岭经龟兹至长安，北周朝廷礼为宾客，始启译事
- id: guji-阇那崛多-event-sui-translation
  title_zh: 应隋诏于大兴善寺开译
  date: 0581
  year_of: 0581
  kind: career
  description: 隋文帝开皇初诏入大兴善寺，与达摩笈多等共掌译场，译佛本行集经等数十部
- id: guji-阇那崛多-event-zhongzhong
  title_zh: 译出种种杂咒经一卷
  date: 0585
  year_of: 0585
  kind: career
  description: 会译妙法莲华经内六咒、旋塔灭罪、礼拜灭罪、供养三宝、观音忏悔、千转陀罗尼等凡二十余咒，详加反切注音，成种种杂咒经一卷
- id: guji-阇那崛多-event-death
  title_zh: 卒于长安译场
  date: '0600'
  year_of: 384
  kind: death
  description: 约开皇末至大业初卒于长安，年约七十八，一生译经三十余部，咒藏尤为后世所重
