  decisions:
  - date: 0588
    title_zh: 择译大云请雨以应时需
    rationale: 见阎浮旱疫妖星灾厉相续，择此能令诸龙时雨、除五种雨障之法门，契机利生
  - date: 0590
    title_zh: 存留咒句梵音兼以华释
    rationale: 为令请雨坛法有效验，陀罗尼依梵音直译并加反切注音，兼译诸佛名号使称念灭苦
