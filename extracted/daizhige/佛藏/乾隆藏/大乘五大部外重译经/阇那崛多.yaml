  era: 北周至隋
  reign_ref: 北周武帝至隋文帝开皇
  archetype: 异域译经三藏
  dilemmas:
  - 梵呗咒音以声摄心与华言义理以文传法何重何轻
  - 乱世王朝更迭中坚守译场抑或避祸归印如何抉择
  - 密咒重验效与显教重义解如何会通而不惑众
  lesson: 以音声为佛事，以精译为弘传，虽隔山海不辞，虽逢丧乱不辍，方能使咒印流通
  summary_first_person: 吾本北天竺犍陀罗人，少习三藏，慕震旦为文宣圣化之地，遂越葱岭而东。历北齐北周，遭法难而守志，逢隋兴而复开译席。所译多为陀罗尼杂咒，不尚玄谈，唯愿众生得持一咒即能灭罪除障、安禅却病，令佛种以声续也。
