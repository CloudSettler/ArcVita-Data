    title_zh: 以十二方佛摄一切重障
    rationale: 以东方无障碍王如来为首配十方诸佛，令犯四重五逆者称一佛名礼一拜即灭微尘劫罪
  - date: '0589-06-01'
    title_zh: 附三十七句神咒以助行持
