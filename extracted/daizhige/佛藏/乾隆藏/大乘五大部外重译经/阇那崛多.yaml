  reign_ref: 隋文帝开皇至隋炀帝大业
  archetype: 译师
  dilemmas:
  - 梵本音咒直译存真与中土文辞通顺之间的权衡
  - 密咒护世神验之说与中土重义理轻咒术传统间的融通
  - 依隋廷官译体制而行与保持出世沙门本怀的进退
  lesson: 以咒护世不离悲智，以译传法当存信实，令正法久住即是护国
  summary_first_person: 吾本犍陀罗婆罗门种，少出家习三藏，携梵本东入震旦。北周天和中至长安，后蒙隋文帝敬重，召入大兴善寺掌译。吾所译东方最胜灯王如来助护持世间神咒经，乃东方无边华世界最胜灯如来遣大光甘露光二菩萨所传陀罗尼，为利益安乐众生令得拥护不为诸魔毒厉所害。吾但愿此咒章句流布中土，令持诵者得脱诸怖，令此法本久住世间。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/东方最胜灯王如来助护持世间神咒经.md
