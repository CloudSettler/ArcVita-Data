  dilemmas:
  - 梵汉悬隔义理微妙，如何直存神咒音韵又令华人得解佛名功德
  - 众生犯四重五逆谤三宝罪重如微尘劫，如何立称名礼拜易行之门令即得除障
  lesson: 称一名礼一拜尚能灭微尘劫罪，况昼夜受持忆念不忘加持神咒，则必得十方诸佛忆念护持
  summary_first_person: 吾本天竺健驮罗人，携梵夹而来华土，蒙隋诏住长安译场。见末世众生为重罪所覆，故译此十二佛名神咒，劝人十日忏悔、随喜回向、昼夜称名持咒，使重障得除、净土可期，速趣菩提。
