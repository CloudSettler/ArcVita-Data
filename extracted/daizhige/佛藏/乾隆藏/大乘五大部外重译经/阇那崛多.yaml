    rationale: 此经以校量显三归依功德希有，能破以财供为胜之执，利初学坚信，故优先重译
  - date: 0595
    title_zh: 详译四洲四果校量段
    rationale: 须陀洹至辟支佛乃至三千大千诸佛供养校量皆不及淳净归依，以层递譬喻令信众易解，故保留繁复校量文句不省
