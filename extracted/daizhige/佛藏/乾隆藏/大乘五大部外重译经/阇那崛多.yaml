      raw: 约600年卒于隋长安
  birth_date: '0523'
  death_date: '0600'
  era: 隋
  reign_ref: 隋文帝开皇
  archetype: 译经弘法者
  dilemmas:
  - 远离故土深入中夏弘法与安居本国修习之间的抉择
  - 持守梵本义理精准与随顺华言易解之间的权衡
  lesson: 诸法本空无二，译弘当以平等无著之心沟通异域，令凡夫佛法不相舍离
  summary_first_person: 吾本北天竺犍陀罗人，少习三藏，承师命而东游震旦，历北齐北周至于大隋，奉诏译经三十余载，愿以金刚场平等法门，令众生于烦恼中即见菩提，不取不舍不断不常。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/金刚场陀罗尼经.md
