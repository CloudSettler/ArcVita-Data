  date: 0590
  year_of: 0590
  location: 长安
  description: 演说大慈所生云声震吼奋迅健相陀罗尼，敕诸龙于阎浮提时降甘雨，破除五种雨障，令药草苗稼生长
- id: guji-阇那崛多-event-late-years
