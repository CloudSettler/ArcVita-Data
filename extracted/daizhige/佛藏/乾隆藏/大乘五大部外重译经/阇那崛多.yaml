  - 梵本义理深广而华言简略如何以方便善巧令咒义两全而不失本旨
  - 密咒重在受持验效而显教重在义解如何平衡神咒护世与正法住持之道
  lesson: 方便即究竟持咒与译经皆为利生以善巧护众生病苦鬼障方显如来大悲
  summary_first_person: 吾北天竺犍陀罗人也幼出家遍学三藏闻支那弘法因缘遂航海东来值隋开皇盛世奉诏译经于长安大兴善寺等处共译经三十余部一卷曰如来方便善巧咒经乃集过去六佛及释迦所说神咒为除众生鬼魅病苦横死而说吾但愿以此方便善巧令汉土众生得闻持护身护世而已
