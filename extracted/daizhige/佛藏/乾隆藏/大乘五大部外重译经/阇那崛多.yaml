  archetype: 译经三藏
  dilemmas:
  - 梵本浩繁而华言未备，如何取舍信达以全经义
  - 周隋鼎革战乱频仍，如何护持梵夹安住译场
  lesson: 以大慈为体，以陀罗尼为用，令法雨随时普洽，有情离苦得乐
  summary_first_person: 吾本犍陀罗沙门阇那崛多，少习三藏，慕支那弘法之盛，冒涉流沙而来。值周武法难而守志不移，逢隋兴复法而开译大云请雨等经，愿以慈云法雨遍洒阎浮，息旱疫而利万生。
