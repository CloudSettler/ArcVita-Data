    highlight_event_id: guji-阇那崛多-event-arrival
  - key: climax
    name: 隋开皇译场主持译经
    labels:
      zh: 高峰
    start_date: 0582
    highlight_event_id: guji-阇那崛多-event-translation-kaihuang
  - key: closure
    name: 金刚场等经译成流通
