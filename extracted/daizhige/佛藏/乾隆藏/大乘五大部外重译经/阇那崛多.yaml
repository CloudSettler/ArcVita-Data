    title_zh: 决计东行入华
    rationale: 闻震旦崇佛文宣之地，欲以梵本利东方，不惮远涉流沙
  - date: '0574'
    title_zh: 周武法难中韬晦守经
    rationale: 北周武帝灭佛，不抗不叛，守护梵夹待时而动以存法脉
  - date: 0581
    title_zh: 应隋文帝诏入大兴善寺译场
    rationale: 隋兴崇佛，乘新朝开译之机，聚梵本、集笔受，重开译业
