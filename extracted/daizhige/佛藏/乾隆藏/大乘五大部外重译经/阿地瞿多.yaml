  - date: '0651-03-01'
    title_zh: 三请方许普集会坛法
    rationale: 此法门众经心髓秘密深玄非轻易可传故丁宁三请审众根机方许建坛以重其法
  - date: '0653-03-14'
    title_zh: 于慧日寺宣译梵本先翻要钞
    rationale: 恐幻质迁谢失于大利屡值事闹无暇广翻故先择要抄十二卷以竖兴国洪基存隆民秘宝
  - date: '0654-04-15'
    title_zh: 略抄勘定奏请流通
    rationale: 此经出金刚大道场经大明咒藏之少分宜拟勘详定奏请流通使天下普闻同沾大益
