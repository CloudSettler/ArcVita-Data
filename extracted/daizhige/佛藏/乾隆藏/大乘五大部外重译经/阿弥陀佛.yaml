person:
  qid: guji-阿弥陀佛
  name_zh: 阿弥陀佛
  names:
    zh: 阿弥陀佛
    en: Amitabha
  lifespan:
    birth:
      date: -5000-01-01
      precision: millennium
      is_circa: true
      raw: 久远劫前为大国王，世自在王如来在世教化四十二劫时
    death:
      date: '9999-12-31'
      precision: millennium
      is_circa: true
      raw: 无生无灭，来无所来去无所去，现住西方极乐世界成佛迄今十劫
  birth_date: -5000-01-01
  death_date: '9999-12-31'
  era: 远古劫
  reign_ref: 世自在王如来
  archetype: 弘愿度生者
  dilemmas:
  - 舍王位富乐与出家求无上菩提之抉择
  - 自求涅槃与普摄十方众生同生净土之抉择
  lesson: 至心求道精进不止，何愿不遂；以弘誓摄土，令众生皆得度脱
  summary_first_person: 吾本大国王，闻世自在王佛说法喜悦开悟，弃国作沙门号法藏，于佛所观二千一百万佛刹，静处思惟发四十八大愿，历大阿僧祇劫修菩萨行，今成佛号阿弥陀，现居西方极乐世界，光明照千万世界，接引十方众生。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/大阿弥陀佛经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/大阿弥陀佛经.html
endeavors:
- id: guji-阿弥陀佛-endeavor-1
  title_zh: 观察佛刹发四十八弘愿
  summary: 为法藏比丘时，于世自在王佛所，愿作佛时为十方佛中最，摄取二千一百万佛刹清净之行，发四十八愿庄严国土，令无地狱饿鬼、无妇女、衣食自然、众生皆作菩萨声闻。
  phases:
  - key: brewing
    name: 弃国出家
    labels:
      zh: 弃位为僧
    start_date: -5000-01-01
    highlight_event_id: guji-阿弥陀佛-event-birth
  - key: breakthrough
    name: 观刹显现
    labels:
      zh: 睹二千一百万刹
    start_date: -4999-06-01
    highlight_event_id: guji-阿弥陀佛-event-vow-prep
  - key: climax
    name: 静处发愿
    labels:
      zh: 四十八愿成
    start_date: -4999-01-01
    highlight_event_id: guji-阿弥陀佛-event-vow
  - key: closure
    name: 愿成感应
    labels:
      zh: 大地震动雨华
    start_date: -4998-12-01
    highlight_event_id: guji-阿弥陀佛-event-vow
  decisions:
  - date: -5000-01-01
    title_zh: 弃王位作沙门
    rationale: 闻佛说法喜悦开悟，知世间荣位无常，愿求无上菩提以度众生
  - date: -4999-01-01
    title_zh: 摄取佛刹立四十八愿
    rationale: 见诸佛刹善恶粗妙，随心愿显现，择其优去其劣，以清净行庄严自刹，使众生闻名即生
- id: guji-阿弥陀佛-endeavor-2
  title_zh: 历劫修行成就极乐世界
  summary: 住真实慧勇猛精进，入三摩地历大阿僧祇劫修菩萨行，不生欲嗔痴想，行六度万行，亲近诸佛植众德本，功德圆满威神炽盛，成就西方极乐世界，光明独胜照千万世界。
  phases:
  - key: brewing
    name: 真实慧修
    labels:
      zh: 入三摩地行六度
    start_date: -4998-01-01
    highlight_event_id: guji-阿弥陀佛-event-practice
  - key: breakthrough
    name: 亲近诸佛
    labels:
      zh: 承事供养无间
    start_date: -4500-01-01
    highlight_event_id: guji-阿弥陀佛-event-practice
  - key: climax
    name: 功德圆满成佛
    labels:
      zh: 入佛位号阿弥陀
    start_date: -4000-01-01
    highlight_event_id: guji-阿弥陀佛-event-attainment
  - key: closure
    name: 常住西方教化
    labels:
      zh: 十劫接引蜎蠕
    start_date: -3990-01-01
    highlight_event_id: guji-阿弥陀佛-event-teaching
  decisions:
  - date: -4998-01-01
    title_zh: 历劫不计众苦常行和颜爱语
    rationale: 但乐忆念过去佛善根，远离虚妄坚守诚正，以布施持戒忍辱精进禅定智慧利乐众生
  - date: -4000-01-01
    title_zh: 不取灭度常住西方
    rationale: 为酬本愿度一切众生，故来无所来去无所去，示现西方去此百万世界之极乐，令十方天人蜎飞蠕动皆得往生
events:
- id: guji-阿弥陀佛-event-birth
  title_zh: 大国王出世为法藏本因
  date: -5000-01-01
  year_of: -5000
  description: 过去久远劫有大国王，闻世自在王如来说法喜悦开悟，即弃王位往作沙门号法藏比丘，高才智慧勇猛无能及者
  location: 大国王宫
- id: guji-阿弥陀佛-event-vow-prep
  title_zh: 佛为显现二千一百万佛刹
  date: -4999-06-01
  year_of: -4999
  description: 世自在王佛知法藏智识高明心愿广大，选择二千一百万佛刹诸天人民善恶国土粗妙，随其心愿悉令显现，法藏得天眼莫不彻见
  location: 世自在王佛所
- id: guji-阿弥陀佛-event-vow
  title_zh: 静处思惟发四十八大愿
  date: -4999-01-01
  year_of: -4999
  description: 法藏往一静处默坐思惟摄取彼佛刹清净之行，诣佛所具陈四十八愿，愿无地狱饿鬼、无妇女、衣食自然、光明照十方、十念必生、不更恶道等，愿不成终不作佛
  location: 静处及佛前
- id: guji-阿弥陀佛-event-practice
  title_zh: 入三摩地历劫修菩萨行
  date: -4998-01-01
  year_of: -4998
  description: 发愿已应时大地震动天雨妙华空中赞决定成佛，法藏住真实慧勇猛精进，不着色声香味，善护身口意，行六度了空无相无愿，亲近供养无量诸佛植众德本
  location: 三摩地中及诸佛所
- id: guji-阿弥陀佛-event-attainment
  title_zh: 功德圆满成就阿弥陀佛
  date: -4000-01-01
  year_of: -4000
  description: 积功累德无量无数百千万亿劫，容体端严三十二相八十种好，手中恒出衣食幢盖音乐，威神炽盛方得成就所愿而入佛位，号阿弥陀佛
  location: 极乐世界
- id: guji-阿弥陀佛-event-teaching
  title_zh: 现住西方光明独胜教化
  date: -3990-01-01
  year_of: -3990
  description: 成佛以来于今十劫，现住西方去此百万世界之极乐，光明最为远着照千万世界无穷极，十方无央数天人乃至蜎飞蠕动皆得过度解脱，诸佛称其功德国土之胜
  location: 西方极乐世界
- id: guji-阿弥陀佛-event-death
  title_zh: 无生无灭常住度生
  date: '9999-12-31'
  year_of: 9999
  description: 彼佛如来来无所来去无所去无生无灭非过去现在未来，不取灭度，常住西方以酬志愿度一切众生
  location: 西方极乐世界
