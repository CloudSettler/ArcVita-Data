  decisions:
  - date: -0486
    title_zh: 敕具百斛麻油自宫门至祇洹然灯
    rationale: 请佛饭讫欲增功德，纳只婆多然灯之议，以王权威仪广作光明供养
  - date: -0485-03-10
    title_zh: 纳只婆谏减膳脱宝亲手作七宝华
    rationale: 屡以国藏民力设福而心含贡高嗔恚未得决，改以割损身中供具、夫人太子合掌亲勤，一心上佛以显至诚
  - date: -0484-06-01
    title_zh: 闻佛般泥洹仍赍华往耆阇崛山
    rationale: 信只婆所言佛无身无灭惟至心可见，不以佛灭而废至诚，往佛坐处展驰本意
- id: guji-阿阇世王-endeavor-2
  title_zh: 悔过护法与太子传愿之业
  description: 以忏悔心护持正法，化育太子旃陀和利同发大愿，成父子相继授决之局
  phases:
  - key: brewing
