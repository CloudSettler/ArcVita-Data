  era: 春秋末期
  reign_ref: 摩揭陀国
  archetype: 忏悔求法之君王
  dilemmas:
  - 以国藏民力广设百斛油灯，功德巍巍而心不专一，反不及贫贱一灯，何以破贡高嗔恚而入至诚
  - 屡请佛设福皆他人得决而己无获，当继续以王威厚供抑或减损身供亲手作华以求至心见佛
  - 闻佛已般泥洹于鸠夷那竭，华已作成当废置还是赍华往耆阇崛山以至心求见无去来之佛
  lesson: 厚财广供不如一念至诚，贡高嗔恚为得决之障，惟减损身供、亲力至心，方得见佛受决
  summary_first_person: 吾为摩揭陀阿阇世王，尝请佛饭讫，敕百斛麻油自宫门至祇洹然灯，自谓巍巍无量。时贫母以乞得两钱买膏一灯，通夕不灭，目连三扇不灭、蓝风不熄，佛言此当来须弥灯光如来，吾始惭心不专。复见园监以道逢佛散华授决觉华如来，益知至心为本。乃纳只婆之谏，减彻厨膳，脱七宝璎珞，与夫人太子亲手作七宝华九十日成。闻佛般泥洹，不废至诚，赍华往耆阇崛山，散华化为宝盖覆佛，遂得授决却后八万劫当为净其所部如来，太子旃陀和利亦发金轮圣王及栴檀佛愿，吾方信佛无身无灭，惟至心乃见。
  source_urls:
