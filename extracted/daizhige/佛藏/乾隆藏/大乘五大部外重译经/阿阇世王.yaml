  - key: breakthrough
    name: 太子随喜发愿
    labels:
      zh: 太子发愿
    start_date: -0484-06-15
    highlight_event_id: guji-阿阇世王-event-prince-vow
  - key: closure
    name: 父子相继授决
    labels:
      zh: 相继授记
    start_date: -0484-06-15
    highlight_event_id: guji-阿阇世王-event-jewel-flower
  decisions:
  - date: -0485-03-15
    title_zh: 闻园监得决生惭怖长跪忏悔
    rationale: 见卑贱园监以至心散华即得决，自省严急拘制、贡高未除，遂起肃然忏悔以化嗔恚为敬法
  - date: -0484-06-15
    title_zh: 携太子同往散华令太子发金轮与佛愿
    rationale: 欲令国嗣以至心续法，示现君臣父子同以散华供养成往生兜率下生成佛之愿
events:
- id: guji-阿阇世王-event-birth
  title_zh: 生于王舍城摩揭陀王室
  date: -0492
  year_of: guji-阿阇世王
  location: 王舍城
  description: 摩揭陀国太子生，为频婆娑罗王之子，后嗣王位，是为阿阇世王
- id: guji-阿阇世王-event-lamp
  title_zh: 百斛油灯供佛观贫母一灯长明
  date: -0485
  year_of: guji-阿阇世王
  location: 罗阅只耆阇崛山至祇洹精舍道
  description: 王敕百斛麻油自宫门至祇洹然灯，贫母乞两钱买膏五合然一灯，通夕不灭，目连以袈裟扇及蓝风吹之益明上照梵天下照三千世界，佛言此母已供养百八十亿佛却后三十劫当为须弥灯光如来，王问只婆何以己不获决而母得决，知心不专一之失
- id: guji-阿阇世王-event-garden
  title_zh: 园监道逢散华得决王生惭悔
  date: -0485-03-01
  year_of: guji-阿阇世王
  location: 罗阅只大道之衢
  description: 佛晨出祇洹赴王宫，园监持华逢佛欢喜尽散佛上，花住空中，佛授决却后百四十劫当为觉华如来；园监归家空箱复满天华，王见华希有欲罪之，闻其已得决遂生惭怖毛竖长跪忏悔，复问只婆当作何功德
- id: guji-阿阇世王-event-jewel-flower
  title_zh: 亲手作七宝华赴耆阇崛山得授净其所部佛记
  date: -0484-06-15
  year_of: guji-阿阇世王
  location: 耆阇崛山
  description: 王纳只婆言减厨斋戒脱七宝与夫人太子亲手作宝华九十日成，闻佛已般泥洹于鸠夷那竭仍赍华往山，见佛悲喜散华化为宝盖覆佛，佛授决却后八万劫劫名喜观当为佛号净其所部如来刹名华王人民寿四十小劫，礼讫佛忽不见
- id: guji-阿阇世王-event-prince-vow
  title_zh: 太子旃陀和利散宝发愿得记
  date: -0484-06-15
  year_of: guji-阿阇世王
  location: 耆阇崛山
  description: 太子年八岁见父得决欢喜脱身众宝散佛上化为交露帐发愿王作佛时己为金轮圣王供养佛及般泥洹后承续为栴檀佛，佛言必如愿寿终上生兜率寿尽下作佛于药王刹土，寿命国土皆如净其所部
- id: guji-阿阇世王-event-death
  title_zh: 终于摩揭陀
  date: '-0460'
  year_of: guji-阿阇世王
  location: 王舍城
  description: 在位护法度余年后终于王舍城，依佛所授决当于喜观劫成净其所部如来
