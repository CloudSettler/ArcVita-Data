  reign_ref: 约当中国东周春秋末至战国初
  archetype: 多闻第一侍者型
  dilemmas:
  - 见新造重阁高显精舍严丽无尘，疑布施精舍与佛灭后芥子舍利小塔小像何者功德为多，恐误导众生福田取舍
  - 身为佛侍多闻第一，如何承当佛陀殷勤付嘱，令未曾有清净妙法普遍天人而不失传
  lesson: 功德大小不在形量而在所缘福田，佛具无量戒定慧解脱及六度神通，纵以小塔小像缘佛，其福远胜布施四天下及天帝释庄严殿
  summary_first_person: 我是阿难，侍佛住王舍城耆阇崛山，晨朝着衣持钵入城乞食，见新作大舍重阁庄严，生念若以此舍施僧与佛灭后以芥子舍利起庵摩勒塔及麸麦小像二者何胜，遂饭讫诣佛陈问。佛为我广喻四天下圣众供养及百千天帝殿施僧皆不及造塔造像缘佛之功德，并付嘱我受持此未曾有法，广为天龙八部宣说，令众生入佛善根终成佛果。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%9C%AA%E6%9B%BE%E6%9C%89%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E4%BA%94%E5%A4%A7%E9%83%A8%E5%A4%96%E9%87%8D%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%9C%AA%E6%9B%BE%E6%9C%89%E7%BB%8F.html
