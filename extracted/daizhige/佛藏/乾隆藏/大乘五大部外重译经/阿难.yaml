    title_zh: 请问法名受持
    rationale: 白佛此名何法当云何受持，欲令正法久住便于弘宣，故求佛定名嘱累
  - date: '-0425'
    title_zh: 数数为四众广说
    rationale: 依佛殷勤嘱托，以此功德校量与佛无量功德为方便，令诸天人阿修罗等闻者入佛善根离恼成佛
events:
- id: guji-阿难-event-birth
  title_zh: 生于迦毗罗卫释氏
  date: '-0454'
  year_of: -454
  description: 约公元前五世纪中叶生于迦毗罗卫，为佛堂弟，后出家为佛常随侍者
  labels:
    zh: 出生
- id: guji-阿难-event-alms
  title_zh: 晨入王舍城乞食见新造重阁
  date: '-0426'
  year_of: -426
  description: 佛住耆阇崛山时，阿难晨朝着衣持钵入王舍城正念乞食，见一处新作大舍重阁高显户牖雕饰墙壁严整可障风尘寒暑，遂起布施此舍与造塔造像功德孰多之念
  labels:
    zh: 乞食观舍
- id: guji-阿难-event-question
  title_zh: 饭讫诣佛问二功德胜劣
  date: '-0426'
  year_of: -426
  description: 乞食讫还本处饭食竟举衣钵洗足已，一心恭敬诣佛所头面作礼，于一面坐白佛所见所念，请问作妙舍施四方僧与佛般涅槃后以芥子舍利起庵摩勒塔及造小佛像二者何者功德多
  labels:
    zh: 请问功德
- id: guji-阿难-event-sermon
  title_zh: 佛以四天下及帝释殿喻校量功德
  date: '-0426'
  year_of: -426
  description: 佛告阿难，即令阎浮提等四天下满中人皆得四果辟支佛并尽寿供养起塔供养，及令造百千亿帝释大庄严殿施僧，其功德百千万亿倍不及芥子舍利小塔小像缘佛之功德，以佛具戒定慧解脱及六度神通无量功德故
  labels:
    zh: 佛说校量
- id: guji-阿难-event-entrust
  title_zh: 蒙嘱受持未曾有法
  date: '-0426'
  year_of: -426
  description: 佛告阿难当谛受持此经，阿难问名，佛名此为未曾有法一切清净妙法方便，殷勤嘱令数数为天人阿修罗龙夜叉等分别说之，作如来善根功德种子
  labels:
    zh: 受嘱持法
- id: guji-阿难-event-propagate
  title_zh: 广为四众演说流通
  date: '-0425'
  year_of: -425
  description: 奉佛教数数广为人天八部宣说未曾有法，令闻者得入如来善根离诸烦恼悉皆成佛，诸比丘闻已欢喜作礼奉行
  labels:
    zh: 弘法流通
- id: guji-阿难-event-death
  title_zh: 入灭
  date: '-0374'
  year_of: -374
  description: 传于佛灭后住持多闻藏二十余年，约八十至百余岁入灭，多闻法藏由其结集传世
  labels:
    zh: 逝世
