  summary_first_person: 我是阿难陀，佛之堂弟，常随侍佛，多闻第一。昔在舍卫国祇陀林中，我为外道旃陀罗女以符书厌祷所惑，恍惚失念，蒙世尊怜愍宣说六字神咒王经而得解脱。自此我一心受持此陀罗尼，昼夜忆念，亦以此咒护持众生，令众恶灭而众善生。
