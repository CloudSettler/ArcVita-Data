person:
  qid: guji-须大拏
  name_zh: 须大拏
  names:
    zh: 须大拏
    en: Sudana
  lifespan:
    birth:
      date: -1000-01-01
      precision: century
      is_circa: true
      raw: 叶波国王湿波之子，满十月而生，字须大拏
    death:
      date: -0920-01-01
      precision: century
      is_circa: true
      raw: 传说未详，檀行圆满后终成无上正觉
  birth_date: -1000-01-01
  death_date: -0920-01-01
  era: 传说过去劫
  reign_ref: 叶波国湿波王时
  archetype: 檀波罗蜜菩萨
  dilemmas:
  - 孝亲守国与檀愿无逆之冲突：父王以白象为却敌国宝，众臣共议刑逐，而违檀心则失无上平等度意
  - 骨肉恩爱与布施无执之两难：乞者索儿索妻，若不与则违本愿，若与则妻子离散入奴婢
  lesson: 恩爱无常皆当别离，唯以无执无悔之檀施能成大道，布施之德为诸佛所共称誉
  summary_first_person: 吾为叶波太子须大拏，自十六岁通书射礼乐即乐檀施，立愿有求不逆；尝以中藏珍宝置四门广施，复以行莲华白象须檀延施与怨家，遂被逐往檀特山十二年；携妃曼坻与子耶利女罽拏延入山，次第舍车马衣服乃至儿女妻子，了无悔心，以成檀波罗蜜
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/太子须大拏经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘五大部外重译经/太子须大拏经.html
endeavors:
- id: guji-须大拏-endeavor-1
  name_zh: 四门广施与白象檀行
  description: 于叶波国四城门及市中置珍宝恣人所欲，闻名十方，终以却敌白象布施敌国道士
  phases:
  - key: brewing
    name: 见苦立愿
    labels:
      zh: 萌芽
    start_date: -0985-01-01
    highlight_event_id: guji-须大拏-event-vow
  - key: breakthrough
    name: 四门大施
    labels:
      zh: 突破
    start_date: -0984-06-01
    highlight_event_id: guji-须大拏-event-alms
  - key: climax
    name: 白象施敌
    labels:
      zh: 高潮
    start_date: -0983-03-01
    highlight_event_id: guji-须大拏-event-elephant
  - key: closure
    name: 七日倾财被逐
    labels:
      zh: 收束
    start_date: -0983-04-01
    highlight_event_id: guji-须大拏-event-exile
  decisions:
  - date: -0985-01-01
    title_zh: 白王请于四门置宝广施
    rationale: 出游见贫穷聋盲喑哑生悲，思智者以布施为德，愿令众生常得其福，故请王不逆人意
  - date: -0983-03-01
    title_zh: 以须檀延白象施与八道士
    rationale: 已立有求不逆之要，若吝国宝则违本心，唯以舍所重方成无上平等度意，故澡手授象
  - date: -0983-04-01
    title_zh: 请七日倾私财大施乃去国
    rationale: 虽被徙檀特十二年，不敢违王命，犹欲展微心，将私财罄施贫者令得富乐
- id: guji-须大拏-endeavor-2
  name_zh: 檀特山苦行与妻子儿女檀
  description: 携妃曼坻及二子入檀特山结草屋，食果蓏泉水，次第舍车马衣服，乃至以儿女妻子施与婆罗门及释提桓因之试
  phases:
  - key: brewing
    name: 入山结庵
    labels:
      zh: 萌芽
    start_date: -0983-05-01
    highlight_event_id: guji-须大拏-event-enter-mountain
  - key: breakthrough
    name: 途中尽舍
    labels:
      zh: 突破
    start_date: -0983-05-10
    highlight_event_id: guji-须大拏-event-give-carriage
  - key: climax
    name: 儿女妻子檀
    labels:
      zh: 高潮
    start_date: -0982-08-01
    highlight_event_id: guji-须大拏-event-give-children
  - key: closure
    name: 释试还愿
    labels:
      zh: 收束
    start_date: -0982-09-01
    highlight_event_id: guji-须大拏-event-give-wife
  decisions:
  - date: -0983-05-10
    title_zh: 途中舍马车衣服无吝
    rationale: 财物不可常保会当坏散，遇乞马乞车乞衣者即卸解与之，初无悔心如毛发
  - date: -0982-08-01
    title_zh: 以二子耶利罽拏延施婆罗门
    rationale: 从生已来布施未尝有悔，远来乞儿不可不与，欲以割爱成就檀波罗蜜度二子
  - date: -0982-09-01
    title_zh: 以妃曼坻施释化婆罗门
    rationale: 不以妻子施则何从得成无上平等度意，虽妃自投汤火供养勤苦亦当舍以全檀心
events:
- id: guji-须大拏-event-birth
  type: birth
  date: -1000-01-01
  year_of: -1000
  precision: century
  is_circa: true
  title_zh: 叶波国太子诞生
  description: 叶波王湿波祷祠诸神，夫人生太子，二万夫人乳湩自然而出，四乳母养护，字曰须大拏
  location_zh: 叶波国王宫
- id: guji-须大拏-event-vow
  type: vow
  date: -0985-01-15
  year_of: -985
  precision: day
  is_circa: true
  title_zh: 出游见苦立檀愿
  description: 年十六通书计射御礼乐，见道边贫穷聋盲喑哑而悲，白王欲以中藏珍宝置四门广施不逆人意，王听之
  location_zh: 叶波国城中
- id: guji-须大拏-event-alms
  type: endeavor
  date: -0984-06-01
  year_of: -984
  precision: month
  is_circa: true
  title_zh: 四门广施名闻八方
  description: 辇珍宝着四城门及市中，百里千里万里来者求食与食求衣与衣求宝恣与，四远歌颂
  location_zh: 叶波国四城门
- id: guji-须大拏-event-elephant
  type: endeavor
  date: -0983-03-01
  year_of: -983
  precision: month
  is_circa: true
  title_zh: 以白象须檀延施敌国八道士
  description: 敌国闻好施遣八道士乞却敌白象，太子以父王所重踌躇后为成檀波罗蜜左手澡手右手牵象授之
  location_zh: 叶波国象厩
- id: guji-须大拏-event-exile
  type: exile
  date: -0983-04-15
  year_of: -983
  precision: day
  is_circa: true
  title_zh: 被徙檀特山十二年七日大施
  description: 诸臣以失却敌宝惊怖议刑，大臣谏止改为逐往檀特山十二年，太子请以私财再施七日罄尽乃与妃二子辞别出北门
  location_zh: 叶波国
- id: guji-须大拏-event-give-carriage
  type: endeavor
  date: -0983-05-10
  year_of: -983
  precision: day
  is_circa: true
  title_zh: 途中舍车马衣服
  description: 载妃二子自御而去，逢婆罗门次第乞马予马乞车予车乞衣予衣，负儿步行入山
  location_zh: 叶波至檀特山道中
- id: guji-须大拏-event-enter-mountain
  type: endeavor
  date: -0983-06-01
  year_of: -983
  precision: month
  is_circa: true
  title_zh: 入檀特山慈心渡水结庵
  description: 去国六千余里，入慈心三昧断水而渡，见山嵚崟拜五百岁道人阿州陀，结三草屋以果蓏泉水为食，禽兽来附枯木生华
  location_zh: 檀特山
- id: guji-须大拏-event-give-children
  type: endeavor
  date: -0982-08-01
  year_of: -982
  precision: month
  is_circa: true
  title_zh: 以二子施鸠留婆罗门
  description: 鸠留丑婆罗门为妇迫来乞奴婢，太子澡手以七岁耶利六岁罽拏延授之，缚鞭血流地沸，妃采果还不见号哭
  location_zh: 檀特山草屋
- id: guji-须大拏-event-give-wife
  type: endeavor
  date: -0982-09-01
  year_of: -982
  precision: month
  is_circa: true
  title_zh: 以妃曼坻施释提桓因试
  description: 释知太子布施恐妃败善心化师子阻妃，又化十二丑婆罗门乞妃，太子澡手牵与了无悔心，释还妃寄太子并许三愿，太子愿众生度脱
  location_zh: 檀特山
- id: guji-须大拏-event-death
  type: death
  date: -0920-01-01
  year_of: -920
  precision: century
  is_circa: true
  title_zh: 檀行圆满终成正觉
  description: 传云檀特苦行十二年后还国，檀德巍巍，后世成佛，为过去檀波罗蜜之本生
  location_zh: 檀特山
