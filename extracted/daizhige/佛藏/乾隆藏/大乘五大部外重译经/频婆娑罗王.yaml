  summary_first_person: 吾为摩揭陀国王频婆娑罗，居王舍城。尝诣迦兰陀竹园礼世尊，闻以梦中众人婇女为喻，开示行识相续、名字皆空、业空而果不失之理，方知眼见美色生爱起业皆如梦无实。自此献竹园为僧舍，护持正法，观识性离而修解脱
