    title_zh: 应姚兴诏入长安
    rationale: 为使大乘正法广布华夏，不以凉州安逸为念，愿以译事为报佛恩
  - date: '0402'
    title_zh: 重译思益梵天所问经
    rationale: 旧译义隐辞质，今以秦言雅正重出四卷，发明正问分别诸法实相之旨
