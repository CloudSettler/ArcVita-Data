  lesson: 译经当存实相不失文义以信达雅为要方能令众生昼夜安隐得护
  summary_first_person: 吾本龟兹种七岁随母出家游学罽宾改习大乘后为吕光所留滞于凉州十七载弘始三年蒙姚兴迎至长安主持逍遥园译场与僧肇僧叡等译般若法华中论等三百余卷亦译此大金色孔雀王咒经令五方龙王八部护持结界禳毒愿所译不谬舌根不坏以证信于后世
  source_urls:
