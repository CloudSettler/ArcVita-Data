  decisions:
  - date: '0363'
    title_zh: 舍小乘转学大乘
    rationale: 诵习方等深悟诸法皆空，知毗婆沙滞相，遂改宗般若中观
  - date: '0367'
    title_zh: 留镇龟兹广演大乘
    rationale: 应国王请不复西游，以大乘正问法门折伏小乘学徒及外道
- id: guji-鸠摩罗什-endeavor-2
  title_zh: 长安译场重译思益弘传
  summary: 吕光破龟兹羁留凉州十七年，姚兴破后秦迎至长安，领逍遥园译场八百人，与僧肇僧睿等重译思益梵天所问经四卷及大品维摩法华等三十五部
