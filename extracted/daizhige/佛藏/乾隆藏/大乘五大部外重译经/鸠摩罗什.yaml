  summary_first_person: 吾鸠摩罗什，龟兹人也，幼随母出家，西游罽宾遍学三藏，后遇须耶苏摩悟大乘空义，为龟兹国师；吕光破龟兹留吾凉州十七载，姚兴迎吾入长安主逍遥园译场，重译思益梵天所问经等，愿华人得闻不二法门
