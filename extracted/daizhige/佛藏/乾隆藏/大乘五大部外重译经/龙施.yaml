  decisions:
  - date: -0550-03-02
    title_zh: 斥魔小道坚持大乘
    rationale: 佛智譬虚空罗汉如芥子佛德如巨海宁受勤苦无期不取易得小果
  - date: -0550-03-03
    title_zh: 为一切众生从楼投身
    rationale: 以至诚为众生故愿佛知诚舍身破身见以证无生法忍显精进无著
events:
- id: guji-龙施-event-birth
  title_zh: 诞生于须福长者家为女名龙施
  date: -0550-01-01
  year_of: -360
  is_circa: true
  description: 兜率天寿终后来生世间于长者须福家作女意甚明端正名曰龙施除去诸欲情
- id: guji-龙施-event-snake-hearing
  title_zh: 毒蛇听经供养般遮旬
  date: -0600-06-01
  year_of: -384
  is_circa: true
  description: 在丛树山中为毒蛇见般遮旬精进行道诵习经义心大欢悦取草扫地含水洒地供事不懈常在左侧听经辄悉讽诵
- id: guji-龙施-event-snake-farewell
  title_zh: 般遮旬欲去毒蛇悲泣请留
  date: -0600-10-01
  year_of: -384
  is_circa: true
  description: 数月后冬寒果尽般遮旬欲还人间毒蛇悲泣请留愿从后奉侍道人以毒蛇为人所憎虎狼所害不许遂悲泣而别
- id: guji-龙施-event-snake-sacrifice
  title_zh: 攀树遥望舍身投地
  date: -0600-11-01
  year_of: -384
  is_circa: true
  description: 毒蛇上树遥望道人不现转上树头遂远不现益悲自责宿世愚痴受毒身便从树上自投堕树岐间身绝两分命过
- id: guji-龙施-event-reborn-tusita
  title_zh: 生兜率天持华报恩诣弥勒闻法
  date: -0600-11-02
  year_of: -384
  is_circa: true
  description: 命终生兜术天得见光明识宿命与诸天子玉女持香华下至般遮旬所稽首供养嗟叹功德后俱诣弥勒前闻法皆得无生法忍
- id: guji-龙施-event-see-buddha
  title_zh: 楼观见佛发菩提心
  date: -0550-03-01
  year_of: -360
  is_circa: true
  description: 佛游维耶离奈女树园来诣龙施舍眉间放光明时女在浴室愕惊上楼观见佛三十二相诸根寂定心即欢喜发无上菩提心
- id: guji-龙施-event-mara-debate
  title_zh: 魔化为父劝取罗汉
  date: -0550-03-02
  year_of: -360
  is_circa: true
  description: 魔闻女发道意化为其父具说菩萨勤苦得道无期罗汉疾易得女对曰佛智如虚空罗汉如芥子佛德如巨海度人无极小道无高士
- id: guji-龙施-event-tower-jump
  title_zh: 从楼投身证无生忍变男子
  date: -0550-03-03
  year_of: -360
  is_circa: true
  description: 魔激令从楼自投乃验精进女住栏边向佛叉手为一切故愿佛知诚便自投楼下逮得无生法忍变为男子形阿难怖惊请问
- id: guji-龙施-event-lion-roar
  title_zh: 佛前师子吼五百侍从得度授记龙上
  date: -0550-03-04
  year_of: -360
  is_circa: true
  description: 佛告阿难此女前世亦曾舍身已更事万佛精进不懈却后供养恒沙佛当得作佛号龙上龙施得请父母听作沙门将五百侍从八百天神皆发无上心佛说十二因缘法皆得法忍菩萨说本起无数天人皆发无上真
- id: guji-龙施-event-death
  title_zh: 未来作佛号龙上后入涅槃
  date: '3000-01-01'
  year_of: 3000
  is_circa: true
  description: 如佛所记却后当来世供养如恒沙诸佛便当得作佛号曰龙上第一大会度脱天人其数如浮云世快乐饮食自然如忉利天教化已竟入于涅槃
