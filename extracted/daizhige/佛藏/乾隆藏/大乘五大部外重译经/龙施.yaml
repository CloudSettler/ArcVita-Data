    rationale: 虽受毒蛇身为人所憎然以欢喜心亲近善知识昼夜听经以熏习正法
  - date: -0600-11-01
    title_zh: 自投树下舍身殉道
    rationale: 知危脆之身不足贪惜不忍远离善知识愿以舍命表精进求无上法
- id: guji-龙施-endeavor-2
  title_zh: 龙施女发心投楼证忍
  summary: 兜率寿终生于须福长者家为女名龙施见佛发无上菩提心破魔辨道从楼投身证无生法忍变女为男得佛授记
