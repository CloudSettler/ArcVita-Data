  archetype: 舍身求法精进菩萨
  dilemmas:
  - 魔化为父劝取罗汉小道速证与坚持大乘无上菩提之抉择
  - 爱惜危脆身命与为一切众生舍身证法之抉择
  lesson: 为求无上正觉不惜躯命以大慈悲精进不懈舍身殉法方能证无生忍广度一切
  summary_first_person: 吾昔为毒蛇在丛树下侍奉般遮旬道人扫地洒水听经讽诵及道人以冬寒果尽欲还人间吾攀树遥望悲恋不舍自责宿罪遂从树上投身舍命而生兜率天后生须福家为女名龙施见佛光明发菩提心破魔劝进从楼投身证无生忍变为男子今于佛前作师子吼说本起愿度一切
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘五大部外重译经/佛说龙施菩萨本起经.md
