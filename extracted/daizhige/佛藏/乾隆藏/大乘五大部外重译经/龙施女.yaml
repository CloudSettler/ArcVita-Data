    labels:
      zh: 授记
    start_date: -382
    highlight_event_id: guji-龙施女-event-prophecy
  - key: closure
    name: 请舍出家感众发心
    labels:
      zh: 出家
    start_date: -382
    highlight_event_id: guji-龙施女-event-ordination
  decisions:
  - date: -382
    title_zh: 纵身投楼以证精进
    rationale: 魔言不惜寿命从楼自投乃可得佛，我念危脆之命何惜，遂散华归佛以身布施
  - date: -382
    title_zh: 化形后即请出家
    rationale: 得男子身住佛前，知宿缘曾事万佛，欲全菩萨行故求父母放舍为沙门，令亲属天神同发道意
events:
- id: guji-龙施女-event-birth
  title_zh: 出生维耶离长者家
  date: -0590
  year_of: -0590
  location: 维耶离
  description: 须福长者女名龙施，传年十四时事，后世记其为宿事万佛之菩萨再来
- id: guji-龙施女-event-vow
  title_zh: 浴室见佛光发菩提心
  date: -382
  year_of: -382
  location: 维耶离七重楼上
  description: 晨旦佛入城分卫至须福门外，眉间毫相光照七重楼，龙施东向见佛容貌端正如星中月，大欢喜发意愿作菩萨行得道如佛
- id: guji-龙施女-event-temptation
  title_zh: 魔化父形三劝求罗汉
  date: -382
  year_of: -382
  location: 维耶离七重楼上
  description: 魔见发大意化作父形象，劝言佛道亿劫难成不如求罗汉易得泥洹，又言女人不得作佛转轮王帝释梵王，龙施辩言罗汉智少佛智如空，愿精进转女为男终得作佛，不为所动
- id: guji-龙施女-event-transformation
  title_zh: 楼栏舍身空中化男
  date: -382
  year_of: -382
  location: 维耶离须福宅七重楼栏边
  description: 魔复教言不贪世间不惜寿命能投楼乃得佛，龙施叉手向佛自归散华纵身自投，未至地间化女身为男子身，众见希有
- id: guji-龙施女-event-prophecy
  title_zh: 佛笑授记当作佛号龙盛
  date: -382
  year_of: -382
  location: 维耶离奈氏树园
  description: 佛见化男而笑口出五色光照一佛刹还入顶，阿难问故，佛言此女前世已事万佛，后当供养恒沙如来却至七亿六千万劫当得作佛号龙盛寿一劫度九十七亿万人
- id: guji-龙施女-event-ordination
  title_zh: 请父母放舍出家感众发心
  date: -382
  year_of: -382
  location: 维耶离佛前
  description: 龙施化形后住佛前报父母愿得作沙门，父母即听，亲属五百人及八百天神见转女成男皆发无上正真道意，魔惭愧而归
- id: guji-龙施女-event-death
  title_zh: 授记般泥洹
  date: -328
  year_of: -328
  location: 维耶离
  description: 史阙实卒年，依经授记未来成佛号龙盛住世一劫，般泥洹后经道兴盛半劫乃灭，今依传记例以示终
