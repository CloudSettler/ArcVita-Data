    en: Longshi Maiden
  lifespan:
    birth:
      date: -0590
      precision: century
      is_circa: true
      raw: 约前六世纪，维耶离长者须福女，年十四见佛
    death:
      date: -328
      precision: century
      is_circa: true
      raw: 史阙未载卒年，佛授记七亿六千万劫后成佛号龙盛寿一劫乃般泥洹
  birth_date: -0590
  death_date: -328
  era: 古印度佛世
  reign_ref: 释迦牟尼佛游维耶离时
  archetype: 发心菩萨
  dilemmas:
  - 罗汉易证泥洹与菩萨久劫成佛何择
  - 贪惜危脆女身与舍身求道何从
  - 女身五障局限与转身为男勇猛精进何成
  lesson: 不以形相限弘愿，于魔扰中持初心，以舍身精进转女为男，印证发菩提心即能超越性别与生死之障
  summary_first_person: 吾本维耶离长者须福之女名龙施，年十四浴讫见佛眉间毫光照七重楼，见佛在门端严如月中心大欢喜即发无上正真道意愿如佛度人无极，魔化父形劝但求罗汉勿贪佛道，吾不为动，遂叉手向佛投身空中舍命求道，蒙佛威神化女为男得授记当作佛号龙盛，遂请父母放舍出家为沙门，愿一切众生皆发此心
  source_urls:
