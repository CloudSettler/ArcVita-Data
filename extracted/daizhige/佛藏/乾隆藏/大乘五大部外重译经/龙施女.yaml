    title_zh: 发无上正真道意愿如佛
    rationale: 见佛端严诸根寂定，知佛智如空度人无极，罗汉智少如一时，故不乐小果而乐大乘
  - date: -382
    title_zh: 拒魔劝求罗汉
    rationale: 魔言女人不得作佛且佛道久远，不如早取泥洹，我答当精进转女为男，亿劫不懈必得作佛
- id: guji-龙施女-endeavor-2
  title_zh: 舍身转形化女为男求出家
  summary: 以行证愿，于楼栏叉手归佛投身空中，以舍身精进感得化女为男，现身授记并请父母放舍出家
  phases:
