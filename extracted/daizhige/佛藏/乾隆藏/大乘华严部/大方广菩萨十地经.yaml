  - 昙曜
- id: guji-大方广菩萨十地经-event-translation
  title_zh: 梵汉对勘定名为大方广
  date: '0510-02-15'
  year_of: '0510'
  description: 依梵本定名大方广，标举菩萨十地法门，以王舍城耆阇崛山为说处
  location: 王舍城耆阇崛山
- id: guji-大方广菩萨十地经-event-asking
  title_zh: 无尽智菩萨请问菩提心
  date: '0510-03-10'
  year_of: '0510'
  description: 无尽智菩萨偏袒右肩散华请问菩提心云何当知，佛答菩提非言说施设、于一切法无所得是名得菩提心，并演十种心喻大地师子等
  participants:
  - 无尽智菩萨
  - 释迦牟尼佛
- id: guji-大方广菩萨十地经-event-ten-grounds
  title_zh: 宣说十地嘉瑞三摩提陀罗尼
  date: '0510-05-01'
  year_of: '0510'
  description: 次第宣说初地至十地先睹嘉瑞、所摄三摩提、最胜陀罗尼及所具檀至智波罗蜜，建十地行相纲目
- id: guji-大方广菩萨十地经-event-paramita
  title_zh: 广辨十种波罗蜜各开十门义
  date: '0510-08-20'
  year_of: '0510'
  description: 别释檀尸羼毗禅慧方便等各十种为首之相，复总释波罗蜜义为增进满足、无碍解脱、成熟众生、严净佛土等
- id: guji-大方广菩萨十地经-event-circulation
  title_zh: 师子幢天子印可三千证忍流通
  date: '0510-10-15'
  year_of: '0510'
  description: 师子幢无碍光耀天子赞叹究竟佛法功德，佛印可闻持此经为阿惟越致，三千菩萨得无生法忍，无量众生发菩提心，欢喜奉行
  participants:
  - 师子幢无碍光耀天子
  - 无尽智菩萨
- id: guji-大方广菩萨十地经-event-death
  title_zh: 入藏定型后世传持
  date: '0534-12-31'
  year_of: '0534'
  description: 北魏末经录编次入藏，以一卷本传于华严诸疏家，历隋唐至乾隆藏收录流传至今
  location: 洛阳至长安藏经
