  summary_first_person: 吾本无生无灭，假名大方广十地，元魏译场因无尽智请问而现世，演菩提心即无所得、十心十地十忍十陀罗尼，以一卷摄华严要旨，愿闻持者不离真实观、不离诸佛，得无生忍而度旷野。
