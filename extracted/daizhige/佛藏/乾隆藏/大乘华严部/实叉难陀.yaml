  birth_date: 0652-01-01
  death_date: 0710-01-01
  era: 唐
  reign_ref: 武周则天朝
  archetype: 译经弘法者
  dilemmas:
  - 奉制译经当忠于梵本直译还是顺唐土文义以利弘通
  - 华严大经卷帙浩繁与朝廷求速成之间的持衡
  - 显教圆融与密观不思议境界三昧如何以译语令众生信入
  lesson: 译场非独文字事业，实以信解行证摄众入不思议解脱，一念一尘皆可现无量佛事，贵在以无功用心成有功用行
  summary_first_person: 吾本于阗沙门，幼慕大乘，遍学华严及诸三昧。武后遣使迎来，奉制入洛，领译八十华严及此不思议境界经。惟愿众生于一毛端一微尘中见无量刹、于一念中摄无量劫，了心自现，不着凡圣，速入毗卢遮那如来不思议境界。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%8E%E4%B8%A5%E9%83%A8/%E5%A4%A7%E6%96%B9%E5%B9%BF%E5%A6%82%E6%9D%A5%E4%B8%8D%E6%80%9D%E8%AE%AE%E5%A2%83%E7%95%8C%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%8E%E4%B8%A5%E9%83%A8/%E5%A4%A7%E6%96%B9%E5%B9%BF%E5%A6%82%E6%9D%A5%E4%B8%8D%E6%80%9D%E8%AE%AE%E5%A2%83%E7%95%8C%E7%BB%8F.md
  - https://cbetaonline.dila.edu.tw/zh/T0301
