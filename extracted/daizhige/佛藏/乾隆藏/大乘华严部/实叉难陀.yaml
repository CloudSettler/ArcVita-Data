  - key: climax
    name: 译传不思议境界经
    labels:
      zh: 高潮期
    start_date: 0700-01-01
    highlight_event_id: guji-实叉难陀-event-translate-busiyi
  - key: closure
    name: 示寂前付嘱流通
    labels:
      zh: 收束期
    start_date: 0708-01-01
    highlight_event_id: guji-实叉难陀-event-death
  decisions:
  - date: 0695-10-01
    title_zh: 奏请广延义学沙门参译润文
    rationale: 华严梵本浩繁义深，独译易讹，广集法藏、义净等硕学同证梵汉，可令文义双美取信朝野
  - date: 0700-03-01
    title_zh: 择要别译不思议境界经明观行
    rationale: 八十华严明理，此经直示入三昧方便——观佛形像系念现前，供养布施持戒发愿为资粮，以观像念佛速证三昧，补大经行持之要
  - date: 0705-01-01
    title_zh: 成译后不滞洛阳请归于阗终返
    rationale: 知进退以全译业声誉，既成使命则不恋宠，归国复被迎回，示无住处而处处作佛事
