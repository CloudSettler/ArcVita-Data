  decisions:
  - date: 0670-01-01
    title_zh: 决意专攻大方广华严
    rationale: 见西域诸师多执小乘，随华严圆融无碍最能显如来不思议境界，故专研梵本华严为终身事业
  - date: 0692-01-01
    title_zh: 接受武周征召东行
    rationale: 以译经度生为报佛恩，不恋故土利养，愿以梵典光大唐土
- id: guji-实叉难陀-endeavor-2
  title_zh: 奉制入唐重译华严及宣演不思议境界
  description: 武则天遣使迎至洛阳，于佛授记寺等译场主持新译八十卷华严，复译大方广如来不思议境界经，阐明如来不思议境界三昧之一念摄劫、一尘纳刹法门
  phases:
  - key: brewing
    name: 入洛建译场
    labels:
