    en: Lokaksema
  lifespan:
    birth:
      date: '0120'
      precision: year
      is_circa: true
      raw: 后汉月氏国人，生年不详，约汉顺帝永建前后
    death:
      date: 0192
      precision: year
      is_circa: true
      raw: 约汉灵帝中平末，卒年不详
  birth_date: '0120'
  death_date: 0192
  era: 后汉
  reign_ref: 汉桓帝至汉灵帝
  archetype: 译经僧
  dilemmas:
  - 梵本玄奥而汉文初成，如何以质朴古语传达大乘空与菩萨署法
  - 华夏经学与方俗信仰并立，如何令深法取信于洛阳朝野
  lesson: 译法贵质直通意，不以华藻害义，使无所得之署可学可入
  summary_first_person: 吾本月氏沙门，学于天竺，后游至洛阳。值后汉佛法初启，愍汉土未闻菩萨署，故勤译大乘诸经，尤以文殊所问署法为要，愿学者无所得而学，不以得失计署
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘华严部/文殊师利问菩萨署经.md
