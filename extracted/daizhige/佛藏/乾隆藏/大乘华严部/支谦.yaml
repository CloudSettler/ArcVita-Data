  decisions:
  - date: '0224'
    title_zh: 择建业为译场而非归中原
    rationale: 吴地王化方兴而中原扰乱建业士族好文可藉汉文雅驯令佛法速得流通
  - date: '0230'
    title_zh: 创文丽译风舍质直
    rationale: 前译多拙朴士人不喜当以汉文雅饰传梵义虽或稍失直译终能使大乘深入人心
- id: guji-支谦-endeavor-2
