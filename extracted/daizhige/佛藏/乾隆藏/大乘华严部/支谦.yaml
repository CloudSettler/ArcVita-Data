  archetype: 译经居士
  dilemmas:
  - 文质之辨：如何在梵义忠实与汉文典雅之间取舍以令吴人信受
  - 居士身份之限：以优婆塞非比丘而欲弘大乘十地法门如何取信于众
  lesson: 以信达雅译经弘法方能使深法入汉土而根植人心
  summary_first_person: 吾本月支人，祖亮世善梵汉，随来入吴，见吴地初染佛法而苦于文拙难通，遂以白衣设译场于建业，愿以雅汉传梵义，译本业等经，明菩萨十住次第及日用百愿，令后学知发意有阶、行愿有凭，不堕空谈而趣无上菩提。
