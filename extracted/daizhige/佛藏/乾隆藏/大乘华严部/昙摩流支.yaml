  dilemmas:
  - 梵本玄义以无差别智为宗如何以汉文显发魔业即佛业邪见即正见而不令学人堕断常
  - 初地欢喜地法门广大如何立五法方便令菩萨得无畏安稳又不滞名相取舍
  lesson: 信为大力能入法印法印者诸法平等无差别以无取无着之智观一切法即入如来住持境界
  summary_first_person: 吾昙摩流支本西域沙门寄迹元魏承译事于洛阳普光法殿译信力入印法门经五卷为文殊师利广说初欢喜地清净之法愿以平等信力令众生于一味直心正信中入于佛印得大无畏
