events:
- id: guji-普贤菩萨-event-birth
  title_zh: 示现诞生
  date: '-3000'
  year_of: '-3000'
  description: 过去不可说劫前从普贤行愿所生示现菩萨身为华严海会之上首
- id: guji-普贤菩萨-event-death
  title_zh: 无有入灭行愿无尽
  date: '9999'
  year_of: '9999'
  description: 普贤愿海无有穷尽不舍众生故无入灭常遍法界行菩萨行
- id: guji-普贤菩萨-event-1
  title_zh: 逝多林华严海会集
  date: -0590
  year_of: -0590
  description: 毗卢遮那佛在室罗筏城逝多林给孤独园大庄严重阁与五千菩萨五百声闻无量世主俱普贤文殊为上首大众请问如来境界
- id: guji-普贤菩萨-event-2
  title_zh: 宣说普贤十大愿王
  date: -0590
  year_of: -0590
  description: 于大众请问后承佛加被宣说一者礼敬诸佛二者称赞如来三者广修供养四者忏悔业障五者随喜功德六者请转法轮七者请佛住世八者常随佛学九者恒顺众生十者普皆回向并导归极乐
- id: guji-普贤菩萨-event-3
  title_zh: 师子频申三昧庄严法界
  date: -0590
  year_of: -0590
  description: 佛入师子频申三昧逝多林高广严丽金刚为地宝网覆上一时十方过不可说佛刹极微尘数世界海菩萨云集各现供养云及楼阁师子座证普贤行愿遍周法界
