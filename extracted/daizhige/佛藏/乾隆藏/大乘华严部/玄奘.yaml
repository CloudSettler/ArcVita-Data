  - title_zh: 安住讲经与冒死求法
    description: 留长安受供养安稳讲经，抑或冒禁穿绝域西行求真经以决众疑
  - title_zh: 隐修自了与译经利世
    description: 归国后可入山隐修自了，抑或奉诏主持译场以毕生译经利他
  lesson: 真求法当以不畏生死为勇，以译经利世为归，方显无边佛土庄严功德
  summary_first_person: 吾少慕佛法，见中土经论阙疑，遂冒禁西行十七载遍历天竺亲承戒贤，归来奉诏译经一千三百余卷，此显无边佛土功德经亦为劝令众生信向净土而译。
