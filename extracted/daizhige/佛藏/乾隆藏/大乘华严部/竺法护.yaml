    start_date: '0241-01-01'
    highlight_event_id: guji-zhu-fahu-event-birth
  - key: breakthrough
    name: 西域求经
    labels:
      zh: 突破
    start_date: '0265-01-01'
    highlight_event_id: guji-zhu-fahu-event-west
  - key: climax
    name: 携经东归
    labels:
      zh: 高峰
    start_date: '0266-01-01'
