  title_zh: 西行求法搜集梵本
  summary_zh: 自敦煌出发遍历于阗龟兹等西域诸国，搜求大乘梵本凡一百五十余部，为后世译经奠定本源
  phases:
  - key: brewing
    name: 敦煌出家博览
    labels:
