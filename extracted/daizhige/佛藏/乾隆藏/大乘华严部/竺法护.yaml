  - key: breakthrough
    name: 归洛始译正法华
    labels:
      zh: 初译
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-translate-lotus
  - key: climax
    name: 长安译度世品经
    labels:
      zh: 高峰
    start_date: 0286
    highlight_event_id: guji-竺法护-event-dushi
