    labels:
      zh: 显名
    start_date: '0286-01-01'
    highlight_event_id: guji-zhu-fahu-event-zhengfahua
  - key: climax
    name: 渐备一切智德经译成
    labels:
      zh: 极盛
    start_date: '0290-01-01'
    highlight_event_id: guji-zhu-fahu-event-jianbei
  - key: closure
    name: 永嘉避乱犹勤译事
    labels:
      zh: 坚守
    start_date: '0304-01-01'
    highlight_event_id: guji-zhu-fahu-event-avoidchaos
  decisions:
  - date: '0286-10-01'
    title_zh: 采用质朴古译体
    rationale: 宁存梵义本色不饰华藻，使学人得窥原典深义
  - date: '0290-06-01'
    title_zh: 先译华严系渐备经
    rationale: 十地渐修乃大乘阶次，欲令中土知菩萨次第故优先颁宣
