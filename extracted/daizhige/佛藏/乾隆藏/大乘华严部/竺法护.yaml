      zh: 建制
    start_date: 0280
    highlight_event_id: guji-竺法护-event-dushi
  - key: climax
    name: 四方学徒云集讲译
    labels:
      zh: 盛化
    start_date: 0290
    highlight_event_id: guji-竺法护-event-dushi
  - key: closure
    name: 避永嘉乱隐渑池
    labels:
      zh: 隐传
    start_date: '0311'
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0280
    title_zh: 施行胡梵对译兼义理解说
    rationale: 梵胡文义与汉语悬隔，兼存音义与训释方能既保经真又令汉地通晓
  - date: '0311'
    title_zh: 永嘉乱中坚持存护经本
    rationale: 干戈离散当以法施安众，护持已译经典使后世不绝
