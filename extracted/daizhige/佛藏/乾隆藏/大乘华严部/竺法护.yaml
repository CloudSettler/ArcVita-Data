      raw: 约西晋末三一六年卒于长安
  birth_date: '0233'
  death_date: '0316'
  era: 西晋
  reign_ref: 西晋武帝泰始至愍帝建兴年间
  archetype: 译经僧
  dilemmas:
  - 梵本零散西域路险，当如何遍历诸国广求大乘典籍
  - 译文当质朴存真还是文饰易晓，胡汉之间如何取舍
  - 永嘉乱离道场不宁，当坚留中原还是随缘化导以存法脉
  lesson: 博求精译不畏艰险，方能使深法自西而东渐备众德
  summary_first_person: 吾本月氏后裔家世居敦煌，八岁出家师事高僧，游历西域三十六国携梵本百五十部而还，于长安洛阳译正法华等经百余部，此渐备一切智德经亦吾所译，虽遭乱世犹以弘传为任
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%8E%E4%B8%A5%E9%83%A8/%E6%B8%90%E5%A4%87%E4%B8%80%E5%88%87%E6%99%BA%E5%BE%B7%E7%BB%8F.md
