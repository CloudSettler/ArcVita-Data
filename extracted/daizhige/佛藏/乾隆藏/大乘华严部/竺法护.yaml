person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksha
  lifespan:
    birth:
      date: '0233'
      precision: year
      is_circa: true
      raw: 西晋约233年敦煌
    death:
      date: '0310'
      precision: year
      is_circa: true
      raw: 西晋约310年
  birth_date: '0233'
  death_date: '0310'
  era: 西晋
  reign_ref: 西晋武帝至愍帝
  archetype: 译经弘法者
  dilemmas:
  - 西域求法艰危远涉与中土学众渴仰急需之衡
  - 梵本微言精奥与华言显畅通俗之衡
  - 乱世滞留凉雍与坚守洛阳弘化之衡
  lesson: 法雨无来去，唯因弘誓与勤行而周遍；不惮远求，精译广演，则能令如来兴显不断
  summary_first_person: 吾本月氏后裔，居敦煌，少出家游学，志在广求梵本。尝携徒西行三十六国，得胡本百余，归居洛阳长安，旦夕翻译，凡一百五十九部，使大乘深典显于中夏，唯愿法泽普润群生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘华严部/佛说如来兴显经.md
  - https://cbetaonline.dila.edu.tw/zh/T0291
  - https://daizhige.org/佛藏/乾隆藏/大乘华严部/佛说如来兴显经.html
endeavors:
- id: guji-竺法护-endeavor-1
  title_zh: 西域求法广集梵本
  summary: 自敦煌出家后西游诸国，历三十六国搜求大乘胡本，为后半生译业奠基
  phases:
  - key: brewing
    name: 敦煌出家诵习
    labels:
      zh: 萌芽
    start_date: '0250'
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 发愿西行求经
    labels:
      zh: 突破
    start_date: '0260'
    highlight_event_id: guji-竺法护-event-west
  - key: climax
    name: 遍历西域得百余梵本
    labels:
      zh: 高峰
    start_date: '0265'
    highlight_event_id: guji-竺法护-event-return
  - key: closure
    name: 携经东归定居洛阳
    labels:
      zh: 收束
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-return
  decisions:
  - date: '0260'
    title_zh: 决计西游不辞艰阻
    rationale: 中土梵本寡少，深法未显，须亲往西域访求原本，虽道远险阻亦当弘誓前往
  - date: '0265'
    title_zh: 择要携归百余胡本
    rationale: 所获经典浩繁难尽载，择大乘要典尤以华严方等为先，以便归汉翻译流通
- id: guji-竺法护-endeavor-2
  title_zh: 洛阳长安译经弘化
  summary: 居洛阳及长安前后四十余年，译出正法华经等一百五十九部，其中包括佛说如来兴显经，广宣如来兴显与华严深义
  phases:
  - key: brewing
    name: 白马寺初译小经
    labels:
      zh: 萌芽
    start_date: '0267'
    highlight_event_id: guji-竺法护-event-translate-start
  - key: breakthrough
    name: 译正法华经开大乘译风
    labels:
      zh: 突破
    start_date: 0286
    highlight_event_id: guji-竺法护-event-translate-lotus
  - key: climax
    name: 译佛说如来兴显经弘华严
    labels:
      zh: 高峰
    start_date: 0290
    highlight_event_id: guji-竺法护-event-translate-xingxian
  - key: closure
    name: 讲译循环化众不辍
    labels:
      zh: 收束
    start_date: '0305'
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0286
    title_zh: 首译正法华经以华言显实相
    rationale: 以质直华言存梵本要义，虽文朴而义显，使中土初识一乘妙旨，开启后世鸠摩罗什重译之基
  - date: 0290
    title_zh: 译佛说如来兴显经显如来境界
    rationale: 华严部深广，为显如来兴显无量法门，令菩萨知佛兴本怀，虽辞句繁复亦当尽力传译
events:
- id: guji-竺法护-event-birth
  title_zh: 诞生于敦煌
  date: '0233'
  year_of: '0233'
  place: 敦煌
  description: 月氏后裔，世居敦煌，八岁出家，师事高僧竺高座
- id: guji-竺法护-event-west
  title_zh: 西行求法遍历诸国
  date: '0260'
  year_of: '0260'
  place: 西域三十六国
  description: 携带弟子西游龟兹于阗等国，搜访梵本胡经，历时数年
- id: guji-竺法护-event-return
  title_zh: 携百余梵本东归洛阳
  date: '0266'
  year_of: '0266'
  place: 洛阳
  description: 携得大乘梵本一百六十五部归洛，定居白马寺准备翻译
- id: guji-竺法护-event-translate-start
  title_zh: 始译众经于洛阳
  date: '0267'
  year_of: '0267'
  place: 洛阳白马寺
  description: 在洛阳译出修行道地经等，开西晋大规模译经之端
- id: guji-竺法护-event-translate-lotus
  title_zh: 译出正法华经十卷
  date: '0286-09-15'
  year_of: 0286
  place: 长安
  description: 于长安译出正法华经，为法华经最早完整汉译，奠定大乘译业声名
- id: guji-竺法护-event-translate-xingxian
  title_zh: 译佛说如来兴显经四卷
  date: 0290
  year_of: 0290
  place: 洛阳
  description: 译出华严部要典佛说如来兴显经，详演如来兴显十事及法雨六喻，为华严思想早期传播
- id: guji-竺法护-event-death
  title_zh: 示寂于洛阳
  date: '0310'
  year_of: '0310'
  place: 洛阳
  description: 译经四十余年，译籍一百五十九部三百余卷，八十余岁示寂，门人支法度等传其学
