    highlight_event_id: guji-zhu-fahu-event-zhengfahua
  decisions:
  - date: '0265-03-01'
    title_zh: 决意西行于阗求法
    rationale: 中土梵本阙少，欲得深经必亲往西域访求，虽路险不辞
  - date: '0266-09-01'
    title_zh: 舍安就危携经归国
    rationale: 所得梵本若留西域则中土无缘，宁冒艰辛东归以广流布
- id: guji-zhu-fahu-endeavor-2
  title_zh: 译经弘传渐备华严
  summary_zh: 定居长安洛阳组织译场，译出正法华光赞般若渐备一切智德等大乘要经，开华严大乘译传之先河
  phases:
  - key: brewing
    name: 长安立场初译
    labels:
      zh: 筹备
    start_date: '0268-01-01'
    highlight_event_id: guji-zhu-fahu-event-return
  - key: breakthrough
