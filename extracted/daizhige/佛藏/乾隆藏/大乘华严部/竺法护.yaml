  decisions:
  - date: '0266'
    title_zh: 定居长安设译场首译正法华经
    rationale: 华严般若义广，先以正法华立大乘信基，再次第译华严诸品以广度世之教
  - date: 0286
    title_zh: 分品别译度世品经六卷
    rationale: 度世品即华严世间品，广明普贤十事行愿，别译成部便于学人渐入普贤行海
- id: guji-竺法护-endeavor-2
  title_zh: 建译场授徒与译体制范
  description: 招聚竺法首等笔受沙门，创胡汉对译、口授笔受、义理训释之译场制度，广授门徒使佛学自河西达中原
  phases:
  - key: brewing
    name: 招徒立众习梵汉
    labels:
      zh: 立众
