  lesson: 以译经为度世之筏，广设方便令正法久住
  summary_first_person: 吾本月氏裔家于敦煌，八岁出家师事竺高座，遍通西域三十六胡语，携大乘梵本归于长安洛阳，值西晋之世立译场度弟子，一生译正法华、度世品等百五十余部，愿以文字般若普济群生入普贤行海
