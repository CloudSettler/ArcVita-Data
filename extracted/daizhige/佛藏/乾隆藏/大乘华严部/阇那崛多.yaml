  place_zh: 长安大兴善寺译场
  description_zh: 隋开皇年间译出二卷本入如来德智不思议境界经，以普光堂法会为缘起，广说如来无功用普现、随众生下中上业现异色异说之不共法
- id: guji-she-na-jue-duo-event-death
  title_zh: 示寂于大兴善寺
  date: '0605'
  year_of: 605
  place_zh: 长安大兴善寺
  description_zh: 约隋大业初年示寂，世寿八十余，后世列为隋代四大译师之一，译本入乾隆藏大乘华严部
