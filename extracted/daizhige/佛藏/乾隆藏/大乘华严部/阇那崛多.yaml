  decisions:
  - date: 0559
    title_zh: 应请入华
    rationale: 闻东土渴仰大乘，不惮远涉，欲以华严法界思想广植汉地
  - date: '0574'
    title_zh: 法难中留关中不西归
    rationale: 若西归则梵本隔绝，留此护经藏待明主再兴
  - date: 0581
    title_zh: 就隋文帝诏开译场
    rationale: 新朝崇佛国力方盛，当乘时广译，使正法久住
- id: guji-she-na-jue-duo-endeavor-2
  title_zh: 华严不思议境界弘化
  summary_zh: 以佛华严入如来德智不思议境界经等宣说佛身无碍普现、譬如明月与摩尼随器现色之旨，摄化天龙人非人
  phases:
  - key: brewing
    name: 宣阐法界
    labels:
      zh: 华严讲演
    start_date: 0582
    highlight_event_id: guji-she-na-jue-duo-event-lecture
  - key: breakthrough
    name: 择译不思议境经
    labels:
      zh: 选译一卷
    start_date: 0585
    highlight_event_id: guji-she-na-jue-duo-event-huayan
  - key: climax
    name: 普现譬喻摄众
    labels:
      zh: 月喻宝喻
    start_date: 0590
    highlight_event_id: guji-she-na-jue-duo-event-huayan
  - key: closure
    name: 付嘱流通
    labels:
      zh: 流通后世
    start_date: '0600'
    highlight_event_id: guji-she-na-jue-duo-event-huayan
  decisions:
  - date: 0585
    title_zh: 选译入如来德智不思议境界经
    rationale: 此经具显如来不动而普现、说法随根异见之不共法，最契当时华严学兴起之机
  - date: 0590
    title_zh: 以譬喻而非论辩化度
    rationale: 众生下中上业异，如颇胝迦宝随衣现色，直以月轮、大青宝光为喻，令自见佛身
  - date: 0595
    title_zh: 令经本入藏流通
    rationale: 不立宗派私藏，愿使十方世界悉得闻不思议智海
