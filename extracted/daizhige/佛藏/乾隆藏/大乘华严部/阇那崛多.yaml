      is_circa: true
      raw: 约523年生于北天竺犍陀罗
    death:
      date: '0605'
      precision: year
      is_circa: true
      raw: 约605年卒于隋长安大兴善寺
  birth_date: '0523'
  death_date: '0605'
  era: 隋
  reign_ref: 北周至隋开皇大业
  archetype: 译经高僧
  dilemmas:
  - 梵本义深汉语浅，如何译不失真而令下中上根皆得化度
  - 周武法难毁佛，外来沙门当卷经西归抑或潜藏待时护法
  - 依王权开译场易成国师，云何持无功用无分别心不染荣利
  lesson: 如月无分别普现众水，如宝随衣现色，弘法贵在无功用无分别，随器施化则不思议境界自转
  summary_first_person: 吾本犍陀罗沙门阇那崛多，负梵夹东来入华，历周隋鼎革，遭法难而不舍译业，逢开皇而广开译场，译华严入如来德智不思议境界等经，愿显如来普现无碍、随众生业见异身之不共法，令一切众生入不思议解脱
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘华严部/佛华严入如来德智不思议境界经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘华严部/佛华严入如来德智不思议境界经.html
  - https://cbetaonline.dila.edu.tw/zh/T0303
