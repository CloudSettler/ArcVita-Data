    rationale: 为破初学执心执得，须峻辨菩提即心、心即众生而实无所得，方能导归般若无生忍
  - date: '0407'
    title_zh: 以十波罗蜜各十法配十地行相
    rationale: 借譬喻与三昧陀罗尼摄持，使阶次分明、观行可依，令学者有次第可入无所得
events:
- id: guji-鸠摩罗什-event-birth
  title_zh: 生于龟兹
  date: '0344'
  year_of: '0344'
  place_zh: 龟兹
  description: 鸠摩罗炎与耆婆之子，生于龟兹，七岁随母出家，聪敏日诵千偈
- id: guji-鸠摩罗什-event-study-kucha
  title_zh: 龟兹讲学遍习大小乘
  date: '0363'
  year_of: '0363'
  place_zh: 龟兹
  description: 少年遍学阿毗昙、杂藏，遇莎车王子苏利耶苏摩授以大乘，改学中观，转弘大乘
- id: guji-鸠摩罗什-event-liangzhou
  title_zh: 滞留凉州为吕光所留
  date: 0385
  year_of: 0385
  place_zh: 凉州
  description: 苻坚遣吕光迎什，军还逢乱，留凉州十七年，讲说大乘，名震河西
- id: guji-鸠摩罗什-event-changan-translation
  title_zh: 入长安主持逍遥园译场
  date: 0401-12
  year_of: '0401'
  place_zh: 长安逍遥园
  description: 姚兴迎入长安，集义学沙门八百余人，译出大品般若、法华、维摩等三百余卷
- id: guji-鸠摩罗什-event-madhyamaka
  title_zh: 弘阐龙树中观破有无边
  date: '0403'
  year_of: '0403'
  place_zh: 长安
  description: 译中论、百论、十二门论，开示诸法缘起性空，为华夏般若学正轨
- id: guji-鸠摩罗什-event-zhuangyan-translation
  title_zh: 译出庄严菩提心经
  date: '0405'
  year_of: '0405'
  place_zh: 长安
  description: 据梵本译一卷，假思无量义菩萨问答，立菩提心不可得、十心十地、十波罗蜜各十法及诸三昧陀罗尼护持之说，王舍城法会为背景
- id: guji-鸠摩罗什-event-preach
  title_zh: 长安讲席说菩提心无所得而得
  date: 0408
  year_of: 0408
  place_zh: 长安大寺
  description: 升座解说菩提非过去未来现在、无所得是得，广引十喻十三昧以示阶次，众得发心
- id: guji-鸠摩罗什-event-death
  title_zh: 圆寂于长安
  date: '0413-04-13'
  year_of: '0413'
  place_zh: 长安
  description: 弘始十五年示疾而寂，遗言若所译无谬当舌根不坏，阇维后果舌不坏，时年约七十
