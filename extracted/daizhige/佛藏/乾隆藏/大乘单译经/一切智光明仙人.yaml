  raw: 闻佛说慈三昧光大悲海云经以义论难诘尽辞不能屈即便信伏
  description: 彼佛说经名慈三昧光大悲海云闻者超百亿万劫生死必得成佛
- id: guji-一切智光明仙人-event-vow
  title_zh: 发愿未来成佛号弥勒
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 以诵持功德愿过算数劫必得成佛而号弥勒
  description: 于佛法中诵持大慈三昧光大悲海云经以此功德为成佛因
- id: guji-一切智光明仙人-event-ascetic
  title_zh: 入深山修梵行八千岁诵持
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 舍家入深山长发为相修梵行八千岁乞食自活一心除乱
  description: 少欲无事专诵是经为未来龙华成佛积行
- id: guji-一切智光明仙人-event-famine
  title_zh: 雨星现洪水暴涨七日不得乞食
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 雨星现国王淫荒彗星横流连雨不止洪水暴涨端坐七日不食
  description: 仙人饥困命不云远林中五百白兔见之欲以身供养令法久住
- id: guji-一切智光明仙人-event-rabbit
  title_zh: 兔王母子投火以身供养
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 兔王为群兔说偈积薪燃火母子绕仙人七匝投身火中
  description: 天地大动色界诸天雨华供养肉熟山树神白仙人可食
- id: guji-一切智光明仙人-event-verse
  title_zh: 说偈明不食肉志
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 宁当然身破眼目不忍行杀食众生如佛所说食肉行慈不满足
  description: 以所诵经书置树叶示慈者常受短命多病迷没生死不成佛
- id: guji-一切智光明仙人-event-vow-meat
  title_zh: 立誓世世不杀不啖肉入慈三昧
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 愿世世不起杀想恒不啖肉入白光明慈三昧乃至成佛制断肉戒
  description: 后身弥勒成佛所制波罗提木叉以不行慈食肉为重禁
- id: guji-一切智光明仙人-event-death
  title_zh: 投火舍身与兔并命生梵世
  date: -3000-01-01
  year_of: '-3000'
  precision: century
  is_circa: true
  raw: 自投火坑与兔并命天地六震树放金光照千国土
  description: 国人寻光见偈得经持还上王王令宣流闻者皆发无上道心仙人后生梵世广说梵法乃至成佛转大梵轮
