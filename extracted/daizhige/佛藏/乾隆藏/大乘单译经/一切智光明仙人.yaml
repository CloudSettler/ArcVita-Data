  name_zh: 一切智光明仙人
  names:
    zh: 一切智光明仙人
    en: Sarvajnana-Prabha Rishi
  lifespan:
    birth:
      date: -3000-01-01
      precision: century
      is_circa: true
      raw: 过去无量阿僧祇劫胜花敷国婆罗门家生
    death:
      date: -3000-01-01
      precision: century
      is_circa: true
      raw: 投火舍身后生于梵世
  birth_date: -3000-01-01
  death_date: -3000-01-01
  era: 上古胜花敷国
  reign_ref: 胜花敷国弥勒佛时
  archetype: 慈心求法苦行者
  dilemmas:
  - 以世间六十四艺义论难诘佛说尽辞辩不能屈当信伏与否
  - 入山八千岁乞食自活值洪水七日不得食当持戒饥死与犯慈食肉之择
  - 见兔王母子投火供养是受肉活命抑或同舍身以明慈心令法久住
  lesson: 宁破身命不啖众生肉以白光明慈三昧为戒本方为成佛正因
  summary_first_person: 吾本胜花敷国婆罗门一切智光明博通众经六十四艺闻弥勒佛说慈三昧光大悲海云经以义论难诘而辞穷信伏发无上菩提心愿未来过算数劫成佛号弥勒舍家入深山长发修梵行八千岁乞食自活一心诵持值国王淫荒洪水暴涨七日不得食林中兔王母子为法投火以身供养山树神劝食肉已熟吾不忍行杀悲不能言以经置树叶说偈宁破骨髓不食众生并发誓世世不起杀想恒不啖肉入白光明慈三昧乃至成佛制断肉戒遂投火与兔并命生梵世广说梵法
  source_urls:
