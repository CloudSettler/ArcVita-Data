  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B8%80%E5%88%87%E6%99%BA%E5%85%89%E6%98%8E%E4%BB%99%E4%BA%BA%E6%85%88%E5%BF%83%E5%9B%A0%E7%BC%98%E4%B8%8D%E9%A3%9F%E8%82%89%E7%BB%8F.html
endeavors:
- id: guji-一切智光明仙人-endeavor-1
  title_zh: 诵持慈三昧光大悲海云经求无上菩提
  phases:
  - key: brewing
    name: 闻法难诘
    labels:
      zh: 胜花敷国难诘弥勒佛
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-faith
  - key: breakthrough
    name: 信伏发心
    labels:
      zh: 发愿未来作弥勒
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-vow
  - key: climax
    name: 深山苦行
    labels:
      zh: 入山八千岁诵持一心除乱
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-ascetic
  - key: closure
    name: 饥馑证信
    labels:
      zh: 七日不食不移梵行
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-famine
  decisions:
  - date: -3000-01-01
    title_zh: 以世间一切义论难诘彼佛
    rationale: 恃聪慧广博欲较量佛智尽辞辩而不能屈方知佛法超世可信
  - date: -3000-01-01
    title_zh: 信伏发阿耨多罗三藐三菩提心愿作弥勒
    rationale: 得闻慈三昧光经能超百亿万劫生死遂以诵持功德愿过算数劫成佛号弥勒
  - date: -3000-01-01
    title_zh: 舍家入深山长发修梵行八千岁乞食诵经
    rationale: 少欲无事一心除乱令正法相续不为世务所扰
- id: guji-一切智光明仙人-endeavor-2
  title_zh: 立慈心不食肉戒以身殉法
  phases:
  - key: brewing
    name: 兔王示现
    labels:
      zh: 五百白兔王欲以身供养
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-rabbit
  - key: breakthrough
    name: 慈经明志
    labels:
      zh: 说偈宁破身不食众生肉
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-verse
  - key: climax
    name: 立誓制戒
    labels:
      zh: 誓世世不杀不啖肉入白光明慈三昧
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-vow-meat
  - key: closure
    name: 投火舍身
    labels:
      zh: 与兔并命法经流布千国
    start_date: -3000-01-01
    highlight_event_id: guji-一切智光明仙人-event-death
  decisions:
  - date: -3000-01-01
    title_zh: 拒食兔肉以经置叶说慈悲偈
    rationale: 诸佛慈悲经言食肉行慈不满足当宁破骨髓出头脑不忍啖肉
  - date: -3000-01-01
    title_zh: 发誓世世不起杀想恒不啖肉制断肉戒
    rationale: 为令无上大法久住众生得益至成佛当制食肉犯重禁
  - date: -3000-01-01
    title_zh: 自投火坑与兔并命
    rationale: 不惜身命为法作桥梁使见闻者发心正法得传王化
events:
- id: guji-一切智光明仙人-event-birth
  title_zh: 胜花敷国婆罗门家生为一切智光明
  date: -3000-01-01
  year_of: '-3000'
