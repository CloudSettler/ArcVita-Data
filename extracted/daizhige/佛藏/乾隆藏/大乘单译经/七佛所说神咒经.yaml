endeavors:
- id: guji-七佛所说神咒经-endeavor-1
  title_zh: 七佛神咒集译与持验法式
  description: 集惟越佛至释迦牟尼七佛所说陀罗尼，定一万八千病对治、黄缕结法及穰灾却敌等持验仪轨，成卷一主体
  phases:
  - key: brewing
    name: 搜集七佛咒句
    labels:
