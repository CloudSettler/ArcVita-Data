    start_date: '0350-01-01'
    highlight_event_id: guji-七佛所说神咒经-event-qifo-zhou
  - key: climax
    name: 持验法成
    labels:
      zh: 高潮
    start_date: '0360-06-01'
    highlight_event_id: guji-七佛所说神咒经-event-qifo-zhou
  - key: closure
    name: 四卷初定
    labels:
      zh: 收束
    start_date: '0380-01-01'
    highlight_event_id: guji-七佛所说神咒经-event-rulu
  decisions:
  - date: '0350-03-15'
    title_zh: 以黄缕结为验法枢纽
    rationale: 七佛咒皆敕黄缕结系，或十四结或三结，以色应土德、以结摄心，便于护身穰灾
  - date: '0360-06-01'
    title_zh: 立戒忏行道为验前行
    rationale: 非唯诵咒，必净浴新衣、不食酒肉五辛、绕塔燃灯忏悔，方得佛菩萨光明摩顶授记
- id: guji-七佛所说神咒经-endeavor-2
  title_zh: 菩萨神咒弘宣与护国济世
  description: 续宣文殊、虚空藏、观世音、救脱、跋陀和、大势至等八大菩萨神咒，扩展消障、除热恼、得四果、退邻敌、水旱丰穰之用
  phases:
  - key: brewing
    name: 菩萨法门酝酿
    labels:
      zh: 筹备
    start_date: '0355-01-01'
    highlight_event_id: guji-七佛所说神咒经-event-pusa-zhou
  - key: breakthrough
    name: 八咒次第宣说
    labels:
      zh: 突破
    start_date: '0365-01-01'
    highlight_event_id: guji-七佛所说神咒经-event-pusa-zhou
  - key: climax
    name: 护国摧敌验广布
    labels:
      zh: 高潮
    start_date: '0375-01-01'
    highlight_event_id: guji-七佛所说神咒经-event-pusa-zhou
  - key: closure
    name: 经教合编入藏
    labels:
      zh: 收束
    start_date: '0410-01-01'
    highlight_event_id: guji-七佛所说神咒经-event-rulu
  decisions:
  - date: '0365-02-10'
    title_zh: 增列菩萨咒显大乘普济
    rationale: 七佛之后续以文殊解缚、虚空藏拔苦、观音大拯济等，使凡夫声闻菩萨皆得阶次增进
  - date: '0375-08-01'
    title_zh: 以咒力应护国水旱疫兵
    rationale: 邻国侵境、水旱不调、疫鬼刀兵皆可依坛场高楼、礼佛称名、诵咒召感梵释龙天而退散
events:
- id: guji-七佛所说神咒经-event-birth
  title_zh: 东晋译出成经
  date: '0350-01-01'
  year_of: '0350'
  precision: year
  is_circa: true
  raw: 失译人名开元附东晋录，约东晋中叶译出
  location: 建康
  description: 七佛所说神咒经四卷于东晋译出，列大乘单译经，佚名而附东晋录
- id: guji-七佛所说神咒经-event-qifo-zhou
  title_zh: 七佛神咒宣说
  date: '0355-06-01'
  year_of: '0355'
  precision: year
  is_circa: true
  raw: 卷一七佛次第说咒
  location: 王舍城塔庙
  description: 惟越佛说稣卢都呵治万八千病、式佛说胡稣多除热恼、随叶佛说蜜耆兜金鼓、拘留秦说金刚幢、拘那含说毕者阿兔、迦叶说初摩梨帝、释迦说乌稣耆昼腻多，皆敕黄缕结系、绕塔燃灯持斋行道
- id: guji-七佛所说神咒经-event-pusa-zhou
  title_zh: 八大菩萨神咒附说
  date: '0365-06-01'
  year_of: '0365'
  precision: year
  is_circa: true
  raw: 卷二至卷四菩萨说咒
  location: 清净塔中
  description: 文殊说阎浮摩兜解缚、虚空藏说阿那耆昼宁、观世音说阿那耆不智究梨智那、救脱说阿那耆知罗、跋陀和说阿那耆置卢、大势至说阿那耆置卢、得大势说乌稣波置楼、坚勇说阿那耆置楼，各立五色三色缕结及忏悔授记之法
- id: guji-七佛所说神咒经-event-rulu
  title_zh: 开元附录入藏
  date: '0730-01-01'
  year_of: '0730'
  precision: year
  is_circa: true
  raw: 开元释教录附东晋录
  location: 长安
  description: 开元释教录定为失译附东晋录，后入乾隆藏大乘单译经，凡四卷流传至今
- id: guji-七佛所说神咒经-event-death
  title_zh: 经本定型流传
  date: '0420-12-31'
  year_of: '0420'
  precision: year
  is_circa: true
  raw: 东晋末归藏
  location: 建康
  description: 经以持戒生定定生慧为要，完整四卷在南北朝经藏中传抄，持验穰灾之法遂广行
