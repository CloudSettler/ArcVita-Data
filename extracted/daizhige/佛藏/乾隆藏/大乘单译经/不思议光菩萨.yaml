person:
  qid: guji-不思议光菩萨
  name_zh: 不思议光菩萨
  names:
    zh: 不思议光菩萨
    en: Acintyaprabhasa Bodhisattva
  lifespan:
    birth:
      date: '-0500'
      precision: century
      is_circa: true
      raw: 舍卫大城空处弃儿，与释迦牟尼同时
    death:
      date: '3000'
      precision: century
      is_circa: true
      raw: 未来劫名无咎净洁世界成佛后入涅槃，寿二十中劫
  birth_date: '-0500'
  death_date: '3000'
  era: 古印度舍卫国
  reign_ref: 释迦牟尼佛住世
  archetype: 忏悔重生型辩证菩萨
  dilemmas:
  - 空性寂灭与大悲教化是否相违
  - 宿世嗔骂圣者重业如何得净
  - 无法可得中如何起庄严修行
  lesson: 黑白之业终不败亡，空不碍悲，亲近善知识闻法修善方能疾得无生忍与菩提
  summary_first_person: 我本于毗婆尸佛世名饶财，因嗔恚骂贤天菩萨为淫女所生，九十一劫常生淫女胎被弃空处为狐狼所食，今逢释尊于舍卫空处以空悲不二之偈开解，承佛神力忆宿善根现光照三千，得无生忍蒙授记未来于无咎劫净洁世界当成不思议光佛，方知空寂不碍悲愿，业果不亡当慎护身口意
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%B8%8D%E6%80%9D%E8%AE%AE%E5%85%89%E8%8F%A9%E8%90%A8%E6%89%80%E8%AF%B4%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%B8%8D%E6%80%9D%E8%AE%AE%E5%85%89%E8%8F%A9%E8%90%A8%E6%89%80%E8%AF%B4%E7%BB%8F.html
