  - date: '-0500'
    title_zh: 不以衣服为妙当被法服
    rationale: 向帝释开示菩提心乃至大舍等为菩萨法服，成满相好戒定慧万行
  - date: '-0500'
    title_zh: 劝母以天华妙香供佛并发菩提心
    rationale: 报父母恩唯有引导向正法，供二足尊并发无上道心功德胜饮食财宝
  - date: '-0500'
    title_zh: 广说四四法疾得菩提及净法忍
    rationale: 应佛问成就因缘忍空忍三世平等四净四寂等十六法，勤修波罗蜜四摄方便大悲
events:
- id: guji-不思议光菩萨-event-past-slander
  title_zh: 毗婆尸佛世为饶财嗔骂贤天
  date: '-10000'
  year_of: '-10000'
  is_circa: true
  precision: century
  location_zh: 毗婆尸佛法中
  description: 过去九十一劫毗婆尸如来时为饶财菩萨，作贤天菩萨给使多往聚落事务，被呵不断生嗔骂言轻贱淫女私通所生不识父母况有戒定慧，不悔过结使缠缚成重口业
- id: guji-不思议光菩萨-event-birth
  title_zh: 舍卫空处诞为弃儿吮指自活
  date: '-0500'
  year_of: '-500'
  is_circa: true
  precision: century
  location_zh: 舍卫大城中路空处
  description: 生于淫女胎即被捐弃空处，容貌端严鲜白自嗽右指，狐狼狗舐而不逼恼，多人围观生希有心，佛与阿难乞食时于此空处相遇
- id: guji-不思议光菩萨-event-debate
  title_zh: 空处与佛往复以偈论空悲
  date: '-0500'
  year_of: '-500'
  is_circa: true
  precision: century
  location_zh: 舍卫空处
  description: 佛起悲愍以偈问本造恶业，婴儿承佛神力以偈反诘无众生可得云何起悲，往复论空想众生想世谛第一义心性本净客尘所染如空中云，显空不碍悲悲不着物
- id: guji-不思议光菩萨-event-light
  title_zh: 执佛手指起立现光照三千
  date: '-0500'
  year_of: '-500'
  is_circa: true
  precision: century
  location_zh: 舍卫空处至给孤穷精舍途中
  description: 佛出金色臂起婴儿执指而起，升虚空过七多罗树身放光明遍照三千大千，释梵护世天龙八部见光来集散华供佛，咸请名曰不思议光，佛即可之，复化为八岁童子受帝释天衣并说菩萨法服
- id: guji-不思议光菩萨-event-enlightenment
  title_zh: 闻四四法得无生法忍震动雨华
  date: '-0500'
  year_of: '-500'
  is_circa: true
  precision: century
  location_zh: 只陀林给孤穷精舍
  description: 于精舍中佛为说菩萨成就四法疾得菩提及净法忍，谓因缘忍空忍三世平等四净四寂等十六法，不思议光闻已得无生法忍踊跃升空七多罗树，三千六种震动天雨众华伎乐不鼓自鸣，波斯匿王闻已率四兵往观
- id: guji-不思议光菩萨-event-prophecy
  title_zh: 佛微笑授记未来成不思议光佛
  date: '-0500'
  year_of: '-500'
  is_circa: true
  precision: century
  location_zh: 只陀林给孤穷精舍
  description: 佛微笑放百千色光绕三匝入顶，告阿难此菩萨过百千阿僧祇劫当得作佛亦号不思议光，国名净洁劫名无咎以最初成佛令无佛劫得无咎，寿二十中劫声闻八万菩萨三万二千，时三万二千众生发菩提心六万菩萨得无生忍五百比丘成阿罗汉
- id: guji-不思议光菩萨-event-death
  title_zh: 未来净洁世界入涅槃
  date: '3000'
  year_of: '3000'
  is_circa: true
  precision: century
  location_zh: 净洁佛土
  description: 授记中预言未来于无咎劫净洁世界成佛，寿命二十中劫化众生已入涅槃，此为菩萨究竟归处
