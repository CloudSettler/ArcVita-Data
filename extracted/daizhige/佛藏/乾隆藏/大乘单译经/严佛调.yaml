  title_zh: 译传菩萨内习六波罗蜜经一卷
  summary: 以安般数息配内六度译出佛说数随止观还净之法
  phases:
  - key: brewing
    name: 随师习安般守意
    labels:
      zh: 习禅
    start_date: '0165'
    highlight_event_id: guji-严佛调-event-1
  - key: breakthrough
    name: 以内修会通六波罗蜜
    labels:
      zh: 会通
    start_date: '0170'
    highlight_event_id: guji-严佛调-event-1
  - key: climax
    name: 译定内习六度经文
    labels:
      zh: 译经
    start_date: '0175'
    highlight_event_id: guji-严佛调-event-1
  - key: closure
    name: 流通开示十地菩萨位次
    labels:
      zh: 流通
    start_date: 0178
    highlight_event_id: guji-严佛调-event-2
  decisions:
  - date: '0175'
    title_zh: 以数息为内檀立译经纲领
    rationale: 欲使初学易入故以数随止观还净摄檀尸羼惟逮禅般若令人从守息而得度
  - date: 0178
    title_zh: 以身眼耳鼻口意配六度
    rationale: 欲制六匿贼断淫怒嗔痴故令身应檀眼应尸耳应羼鼻应惟逮口应禅意应般若
- id: guji-严佛调-endeavor-2
  title_zh: 开示守一守净弘化度众
  summary: 教人断六入还五阴发平等广度立本无清净之教
  phases:
  - key: brewing
    name: 观身内外皆坏败无常
    labels:
      zh: 观法
    start_date: '0172'
    highlight_event_id: guji-严佛调-event-2
  - key: breakthrough
    name: 断六衰守净断求念空
    labels:
      zh: 守净
    start_date: '0176'
    highlight_event_id: guji-严佛调-event-2
  - key: climax
    name: 广作唱导施立法桥
    labels:
      zh: 弘化
    start_date: 0180
    highlight_event_id: guji-严佛调-event-2
  - key: closure
    name: 付嘱本无泥洹之道
    labels:
      zh: 付嘱
    start_date: 0185
    highlight_event_id: guji-严佛调-event-death
  decisions:
  - date: 0180
    title_zh: 立平等广度不舍一生
    rationale: 为道当发平等心广度一切施立法桥令入法门故不取独善而取兼济
  - date: 0185
    title_zh: 示本无空净为道本
    rationale: 见诸根垢浊当晓了定慧内外清净空空之空乃为泥洹故教人立行于本无之中
events:
- id: guji-严佛调-event-birth
  title_zh: 后汉中叶诞生
  date: '0150'
  year_of: 150
  description: 严佛调生于后汉中叶后出家为沙门习安般禅法
- id: guji-严佛调-event-1
  title_zh: 译菩萨内习六波罗蜜经
  date: '0175'
  year_of: 175
  description: 于洛阳译出佛说一数二随三止四观五还六净以内六度摄六波罗蜜明布施持戒忍辱精进弃恶黠慧之义
- id: guji-严佛调-event-2
  title_zh: 开示六根配六度对治六事
  date: 0180
  year_of: 180
  description: 说人有淫怒嗔恚愚痴懈怠乱意故立六度以除之又以身眼耳鼻口意制六匿贼广作唱导
- id: guji-严佛调-event-death
  title_zh: 后汉末示寂
  date: 0190
  year_of: 190
  description: 弘化既毕以空净本无付嘱后学于后汉末示寂所译一卷流通于世
