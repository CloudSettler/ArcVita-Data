  - key: breakthrough
    name: 译有部律成规模
    labels:
      zh: 律藏突破
    start_date: '0700'
    highlight_event_id: guji-义净-event-translation-vinaya
  - key: climax
    name: 译咒经与大乘经
    labels:
      zh: 显密并弘
    start_date: '0703'
    highlight_event_id: guji-义净-event-translation-curse
  - key: closure
    name: 译业圆满示寂
    labels:
      zh: 功成示寂
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0700'
    title_zh: 先译有部律以正僧制
    rationale: 律为佛法住世之寿先整毗奈耶可肃清时弊使僧团如法住持
  - date: '0703'
    title_zh: 译拔除罪障咒王经以济末世
    rationale: 悯五浊众生多谤咒法堕恶趣故译此咒王令至心受持者灭障往生善处
