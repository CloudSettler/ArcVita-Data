endeavors:
- id: guji-义净-endeavor-1
  title_zh: 泛海南行求法取律
  summary: 咸亨中自广州泛海，经室利佛逝至印度，留学那烂陀，专攻律部，历二十余年携梵本归国。
  phases:
  - key: brewing
    name: 齐州出家立志西游
    labels:
      zh: 立志
    start_date: 424
    highlight_event_id: guji-义净-event-birth
  - key: breakthrough
    name: 广州泛海至室利佛逝
    labels:
      zh: 启程
    start_date: 441
    highlight_event_id: guji-义净-event-voyage
  - key: climax
    name: 那烂陀留学研律
    labels:
      zh: 留学
    start_date: 445
    highlight_event_id: guji-义净-event-study
  - key: closure
    name: 携梵本归国
    labels:
      zh: 归国
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: 441
    title_zh: 舍陆取海西行
    rationale: 慕法显玄奘之志，避陆路阻隔，乘商舶泛南海以求速达求法
  - date: 0685
    title_zh: 留学那烂陀专攻律学
    rationale: 见僧团律弛，立志取律归国以正轨范，故久住研习有部律典
- id: guji-义净-endeavor-2
  title_zh: 奉制译经弘传庄严法门
  summary: 归国后奉武后及中宗之命，于洛阳长安译经五十余部，译出庄严王陀罗尼咒经，弘传持经功德与神咒利生法。
  phases:
  - key: brewing
    name: 洛阳受诏入译场
    labels:
      zh: 受诏
    start_date: 0699
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 译出庄严王陀罗尼咒经
    labels:
      zh: 译经
    start_date: 453
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 弘传持经神咒功德
    labels:
      zh: 弘传
    start_date: 0708
    highlight_event_id: guji-义净-event-translate
  - key: closure
    name: 示寂长安功成身退
    labels:
      zh: 圆寂
    start_date: 459
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: 453
    title_zh: 先译庄严王陀罗尼以护国佑民
    rationale: 见众生病苦业障深重，欲以陀罗尼神咒令得安乐往生极乐，故先译此经
  - date: 456
    title_zh: 以律摄僧以咒利俗
    rationale: 以律正僧团之轨，以显密兼弘摄化士俗，使佛法僧不坏信得以坚固
events:
- id: guji-义净-event-birth
  title_zh: 生于齐州张氏
  date: 413
  year_of: 635
  kind: birth
  location_zh: 齐州
  description: 唐贞观九年生于齐州，俗姓张，幼聪慧慕佛，早年出家受具。
- id: guji-义净-event-voyage
  title_zh: 广州泛海西行
  date: 0671-08-01
  year_of: 671
  kind: voyage
  location_zh: 广州至室利佛逝
  description: 唐咸亨二年自广州乘商舶泛南海，经室利佛逝留数年学梵语，后赴印度。
- id: guji-义净-event-study
  title_zh: 那烂陀留学研律
  date: 445
  year_of: 675
  kind: study
  location_zh: 中印度那烂陀寺
  description: 至中印度那烂陀寺从师研习三藏，尤精根本说一切有部律，居印十余年。
- id: guji-义净-event-return
  title_zh: 携梵本归国至洛阳
  date: 0695-05-01
  year_of: 695
  kind: return
  location_zh: 洛阳
  description: 携梵本四百余部经律论归国，武后亲迎于洛阳，奉制入译场主持译经。
- id: guji-义净-event-translate
  title_zh: 奉制译庄严王陀罗尼咒经
  date: 453
  year_of: 705
  kind: translate
  location_zh: 长安大荐福寺
  description: 于两京诸大寺译经，译出庄严王陀罗尼咒经一卷，宣说布怛洛迦山会上如来所护神咒及持经功德。
- id: guji-义净-event-death
  title_zh: 示寂于长安
  date: 459
  year_of: 713
  kind: death
  location_zh: 长安
  description: 唐开元元年示寂于长安，世寿七十九，谥号鸿胪卿，译经五十余部百余卷传世。
