  dilemmas:
  - 北陆阻绝当安住中土讲习抑或冒险泛海西行求法
  - 梵本浩繁当专精有部律藏以肃僧制抑或兼译咒经以济时俗
  - 译文当直译存真抑或顺华言以便诵持流通
  lesson: 求法在践行不畏险远译经在信实持法在不谤唯至心信受方得咒王除障之实益
  summary_first_person: 吾齐州张氏子也七岁出家慕法显玄奘之迹贞观末即立志西行咸亨二年自广州浮海经室利佛逝抵天竺那烂陀从学十一年游历五天竺得梵本数百夹证圣元年携归洛阳奉武后诏主持译场译出有部律及金光明诸经凡五十六部此拔除罪障咒王经亦吾所译但愿众生至心受持勿生诽谤必得除障安乐
