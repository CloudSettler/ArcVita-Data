    start_date: 0689
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: '0671'
    title_zh: 舍陆取海决计南行
    rationale: 北路为吐蕃所阻旧途难通海路虽险而可达天竺为求正法不惜身命故自广州登舶南行
  - date: '0675'
    title_zh: 留学那烂陀专攻有部律
    rationale: 见中土律制淆乱非精研根本说一切有部无以正僧伽故留寺十一年专攻毗奈耶
- id: guji-义净-endeavor-2
  title_zh: 奉诏译经弘化
  description: 证圣元年归洛后受武则天礼遇主持内外译场译出根本说一切有部毗奈耶金光明最胜王经及拔除罪障咒王经等五十六部
  phases:
  - key: brewing
    name: 入译场奉诏筹备
    labels:
