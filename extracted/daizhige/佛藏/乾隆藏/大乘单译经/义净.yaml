  archetype: 求法译师
  dilemmas:
  - 陆路阻隔欲效玄奘西游当冒险浮南海抑或安守中土
  - 梵本浩繁归国后当先译律藏以正僧制抑或先译大乘要经以广流通
  lesson: 弘法当以戒为基以译为舟虽历海难二十余载而不改其志则微言可传而少法能获多福
  summary_first_person: 吾义净齐州历城人也少出家慕玄奘西游之志咸亨二年自广州浮海历室利佛逝抵那烂陀穷研有部律藏二十余年携梵本四百余部归洛阳蒙武后礼遇奉制译经于洛阳长安所译五十六部此佛为海龙王说法印经即其一以诸行无常一切皆苦诸法无我寂灭为乐四句法印示人虽用功少而获福多愿与众生同证
  source_urls:
