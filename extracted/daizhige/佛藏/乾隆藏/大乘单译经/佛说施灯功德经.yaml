  dilemmas:
  - 少灯微施何以获无量福聚与凡夫执着果报计量之难信
  - 众生业报心性不可思量与声闻欲以思惟测度之矛盾
  - 即灭之灯与不灭之光明果报如何贯通现在净心与临终安乐
  lesson: 少修善根获无量报唯佛能知当以清净深乐不求果报之心相续供养方得净心光明乃至菩提
  summary_first_person: 吾于舍卫祇园告舍利弗佛有四种胜妙善法为众生作无量光以少炷苏油施于塔庙形像照道一阶福尚非声闻缘觉所知况全阶多级幡盖供养临终得三净心三明四光生三十三天乃至人天菩提皆由灯明所摄那连提耶舍译传此义于中土
  source_urls:
