  date: '0570-01-01'
  year_of: 570
  description_zh: 高齐天统年间北天竺三藏那连提耶舍于邺都天平寺译出一卷列为大乘单译经
- id: guji-佛说施灯功德经-event-death
  title_zh: 译场圆寂入藏流传
  date: '0589-01-01'
  year_of: 589
  description_zh: 那连提耶舍于隋开皇年间示寂此经随诸译入藏后世乾隆藏收为大乘单译经流传不绝
- id: guji-佛说施灯功德经-event-preach
  title_zh: 舍卫祇园告舍利弗说四种胜妙善法
  date: -0450-01-01
  year_of: -450
  description_zh: 佛在舍卫国祇树给孤独园告舍利弗佛具戒定慧解脱四种胜妙善法能令众生得无量光福藏
- id: guji-佛说施灯功德经-event-lamp-merit
  title_zh: 说少灯照道一阶福非声闻所知
  date: -0450-01-02
  year_of: -450
  description_zh: 佛言若以少炷苏油灯照道一阶乃至塔身形像其福聚唯佛能知求世报尚尔况清净深乐不求果报者
- id: guji-佛说施灯功德经-event-death-light
  title_zh: 开示施灯临终三净心三明四光明
  date: -0450-01-03
  year_of: -450
  description_zh: 施灯者临终得三净心见福现前忆念善法及见日月天众菩提树如来得念佛念法心无死苦
- id: guji-佛说施灯功德经-event-rebirth-heaven
  title_zh: 明施灯生三十三天得五种清净
  date: -0450-01-04
  year_of: -450
  description_zh: 施灯已生三十三天得清净身威德念慧妙声眷属知住寿量说法劝化后生人间信佛法家得宿命通
- id: guji-佛说施灯功德经-event-translation
  title_zh: 那连提耶舍自乌苌至邺
  date: '0558-01-01'
  year_of: 558
  description_zh: 北天竺乌苌国三藏那连提耶舍于高齐天保年来至邺都住天平寺从事译经
- id: guji-佛说施灯功德经-event-doctrine
  title_zh: 广明八种可乐胜法与八种资粮
  date: -0450-01-05
  year_of: -450
  description_zh: 经中广说于佛塔庙施灯得四可乐四清净八种胜法八种资粮及随喜施灯得八增上法
- id: guji-佛说施灯功德经-event-canon
  title_zh: 入乾隆藏大乘单译经
