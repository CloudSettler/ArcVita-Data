  decisions:
  - date: '0412'
    title_zh: 择建康道场寺立译场
    rationale: 京师众集利于招延义学沙门与笔受润色，使梵汉对勘译文明白
  - date: 0418
    title_zh: 先译如来藏后译华严以显理行一致
    rationale: 以如来藏明众生本具佛性，以华严明佛果境界，理事相摄便于信行
- id: guji-佛陀跋陀罗-endeavor-2
  title_zh: 禅律并弘与僧团教化
  summary_zh: 以善律持身以禅观教众，住庐山及京邑化导士庶，立规训徒，令译经与修证并进，护持如来藏法门之实修。
