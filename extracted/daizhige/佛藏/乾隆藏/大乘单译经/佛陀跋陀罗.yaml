  decisions:
  - date: '0410'
    title_zh: 依慧远结社不滞一处
    rationale: 借庐山清社观机说如来藏易得士大夫信乐而不染世务
  - date: '0422'
    title_zh: 严净律仪以摄众
    rationale: 译经弘法必以戒定为本，方能令如来藏清净之理见于行持
events:
- id: guji-佛陀跋陀罗-event-birth
  title_zh: 生于北天竺
  date: 0359
  year_of: 0359
  description: 北天竺婆罗门种，少颖悟出家，精律学与禅观，具天眼通誉。
  place_zh: 北天竺
- id: guji-佛陀跋陀罗-event-arrival
  title_zh: 至长安入关
  date: 0408
  year_of: 0408
  description: 自西域东来，经西域诸国至长安，后南下庐山与慧远相见，为译经因缘之始。
  place_zh: 长安
- id: guji-佛陀跋陀罗-event-lushan
  title_zh: 居庐山道场结缘
  date: '0410'
  year_of: '0410'
  description: 驻庐山弘禅授法，与江南义学相参，得众僧护持为后入建康译场奠基。
  place_zh: 庐山
- id: guji-佛陀跋陀罗-event-translate-ru-laizang
  title_zh: 译出大方等如来藏经一卷
  date: '0412'
  year_of: '0412'
  description: 于建康道场寺与笔受法业等共译大方等如来藏经，以九喻明一切众生烦恼身中有如来藏常无染污。
  place_zh: 建康道场寺
- id: guji-佛陀跋陀罗-event-teach-meditation
  title_zh: 建康弘禅授观
  date: '0414'
  year_of: '0414'
  description: 开禅法门，教授念佛观与安般，以如来藏为体令学者于烦恼中见清净佛性。
  place_zh: 建康
- id: guji-佛陀跋陀罗-event-translate-huayan
  title_zh: 译出六十卷华严经
  date: 0418
  year_of: 0418
  description: 主译六十华严，广明佛果功德海，与如来藏经相成，成东晋佛典翻译高峰。
  place_zh: 建康道场寺
- id: guji-佛陀跋陀罗-event-circulation
  title_zh: 如来藏经写供流通
  date: '0420'
  year_of: '0420'
  description: 劝令受持读诵书写供养广为人说，举持经功德胜恒沙七宝供养，法流南北。
  place_zh: 建康
- id: guji-佛陀跋陀罗-event-discipline
  title_zh: 整肃僧团立规
  date: '0422'
  year_of: '0422'
  description: 以律范众，简择译场僧众，令梵汉校雠、义理审定有度。
  place_zh: 建康
- id: guji-佛陀跋陀罗-event-death
  title_zh: 示寂建康
  date: 0429
  year_of: 0429
  description: 年七十一示寂，译业与禅律并传，后世以其为华严初译与如来藏弘传之祖。
  place_zh: 建康
