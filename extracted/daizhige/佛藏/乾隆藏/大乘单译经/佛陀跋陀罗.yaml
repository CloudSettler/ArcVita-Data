  archetype: 译师
  dilemmas:
  - 梵本精义与汉语达意之间何以取舍而不失佛旨
  - 持律严净与入世随缘之间何以安身而广化众生
  - 神异感通与平实教化之间何以令人信解如来藏
  lesson: 烦恼淤泥不能坏佛性如金在秽中，须以方便除覆令开显
  summary_first_person: 吾北天竺人也，少出家持律精禅观，东来汉土历长安庐山建康，于道场寺译出大方等如来藏及华严等经，欲令众生知身内有佛藏，烦恼虽缠而性常清净，唯愿开敷显现速成正觉。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E5%A4%A7%E6%96%B9%E7%AD%89%E5%A6%82%E6%9D%A5%E8%97%8F%E7%BB%8F.md
