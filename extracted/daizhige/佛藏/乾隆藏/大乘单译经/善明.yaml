  date: -320
  year_of: -500
  place_zh: 迦维罗卫国福安聚
  description: 前世为尊伏欲王佛时北方净耀天归处长者子敏见今生为福安聚贵姓子名善明好学问习世威仪古王之制及神仙圣人之法
- id: guji-善明-event-offering
  person_qid: guji-善明
  type: career
  title_zh: 率众诣佛设馔蒙神助办
  date: -0480
  year_of: -480
  place_zh: 迦维罗卫国精舍及福安聚舍
  description: 从同辈五百人各有侍者执盖诣佛稽首发心设饭自计仅办二千人食蒙佛敕力办众有及十二天神王往助屋室广如天殿具千亿万座及百千亿人饭具佛与大众往赴咒愿饱足器满如故
- id: guji-善明-event-six-virtues
  person_qid: guji-善明
  type: career
  title_zh: 问相好神变得闻六广之行
  date: -0480
  year_of: -480
  place_zh: 迦维罗卫国精舍
  description: 食讫盥毕叹佛变改卓荦问行则庠序足不履地三十二相所由佛说先行广施广戒广忍广精进广一心广智慧世世不废故得具佛事四无畏十力十八神妙
- id: guji-善明-event-samadhi
  person_qid: guji-善明
  type: career
  title_zh: 闻成具光明定意百三十五事
  date: -0480
  year_of: -480
  place_zh: 迦维罗卫国精舍
  description: 更问行何定意致无央数妙德佛说成具光明定意行一日至七日功德不可喻当净行百三十五事远身离口除意乃至寂如灭度时会三十万明士得是定立第十地四十万立不退转
- id: guji-善明-event-prophecy
  person_qid: guji-善明
  type: career
  title_zh: 得无生法忍蒙记导世王
  date: -0480
  year_of: -480
  place_zh: 迦维罗卫国精舍
  description: 善明得无所从生法忍及眼身口意四净佛记其即昔敏见以散宝发愿功德二百劫后具成佛号导世王天上天下独尊心得十憺然法誓广宣是法五百同辈亦受记后于慈仁佛时得定转后成佛
- id: guji-善明-event-death
  person_qid: guji-善明
  type: death
  title_zh: 寿终趣向佛道不堕恶道
  date: -272
  year_of: -420
  place_zh: 迦维罗卫国
  description: 以闻行光明定意功德长离三恶道常遇值尊定渐满疾逮至佛趣向二百劫后导世王之记入于灭度之流
