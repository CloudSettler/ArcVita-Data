    title_zh: 不取此身阿罗汉果
    rationale: 若此身取阿罗汉则智慧颠倒，不取小果方得当来无上菩提，故智慧不名颠倒
  - date: -0600-01-01
    title_zh: 以按地动证当来转法轮
    rationale: 为令舍利弗知当来得菩提转法轮声遍三千大千世界，以右足大指按地令大地六种震动
events:
- id: guji-坚固女-event-birth
  title_zh: 生为都娑罗国舍卫优婆夷
  date: -0600-01-01
  year_of: '-0600'
  location: 都娑罗国舍婆提城
  description: 生于佛世舍卫城中，为优婆夷，名曰坚固，得人身、得寿命、遇善知识
- id: guji-坚固女-event-vow
  title_zh: 祇园佛前合掌发无上菩提心
  date: -0600-01-01
  year_of: '-0600'
  location: 祇树给孤独园
  description: 闻佛言女人发菩提心未来更不复生诸恶，即从坐起整理衣服合掌白佛，为利益一切众生、怜愍世界、度脱天人、不断佛种而发阿耨多罗三藐三菩提心
- id: guji-坚固女-event-debate
  title_zh: 与舍利弗论如说修行
  date: -0600-01-01
  year_of: '-0600'
  location: 祇树给孤独园大众中
  description: 舍利弗谓发心当见声闻辟支佛，坚固女答昔未曾一念发小乘心，今唯乐如来地一切智地，布施乃至智慧皆不求小果；复辩菩提心相如幻、不可得法非得非不得而欲觉无上菩提
- id: guji-坚固女-event-miracle
  title_zh: 足按大地三千震动
  date: -0600-01-01
  year_of: '-0600'
  location: 祇树给孤独园
  description: 为证当来转法轮声遍三千大千，以右足大指按地令三千大千世界地大震动唯舍利弗坐处不动；佛言此地过去有千同名坚固女、未来弥勒时亦有千同名女于此发心受记
- id: guji-坚固女-event-prophecy
  title_zh: 佛微笑授记星宿劫成普见如来
  date: -0600-01-01
  year_of: '-0600'
  location: 祇树给孤独园
  description: 天帝释以曼陀罗花令散佛上住虚空，佛微笑放五色光绕佛三匝入顶，告阿难此女命终舍女身得男子身，于星宿劫得菩提号普见如来，三会说法各度二十、十五、十百千万亿人得阿罗汉，国中无三恶道悉行十善
- id: guji-坚固女-event-death
  title_zh: 命终舍女身转男身
  date: -0520-01-01
  year_of: '-0520'
  location: 舍婆提城
  description: 于此命终舍女人身得成男子，依佛授记于星宿劫当得作佛，刹土功德无量，佛诫不应于发菩提心者生轻慢
