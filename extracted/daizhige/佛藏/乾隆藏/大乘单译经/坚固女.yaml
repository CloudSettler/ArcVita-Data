    title_zh: 为利一切众生发菩提心
    rationale: 不为自求小果，但为不断佛种、令无救护者得救护、无归依者得归依
  - date: -0600-01-01
    title_zh: 誓不乐声闻辟支佛地
    rationale: 布施持戒忍辱精进禅定智慧皆愿求无上菩提，不求小乘地
- id: guji-坚固女-endeavor-2
  title_zh: 与声闻论辩显菩萨胜行
  summary: 与舍利弗、富楼那等声闻论辩，破小智狭劣，显不可得法中发心、以大神通证信，令众知菩萨智慧自知自觉
  phases:
