person:
  qid: guji-大意
  name_zh: 大意
  names:
    zh: 大意
    en: Dayi
  lifespan:
    birth:
      date: -0700-01-01
      precision: century
      is_circa: true
      raw: 欢乐无忧国广慈哀王世，居士摩诃檀妻栴陀所生，堕地能言发愿布施天下
    death:
      date: -0620-01-01
      precision: century
      is_circa: true
      raw: 归国大布施后寿终，上为帝释或飞行皇帝，累积功德后成佛
  birth_date: -0700-01-01
  death_date: -0620-01-01
  era: 传说上古
  reign_ref: 惟卫佛世至释迦牟尼佛本生
  archetype: 悲愿菩萨
  dilemmas:
  - 安处富家坐享财宝与冒崄入海采宝济世之抉择
  - 受七宝重赂与唯求明月珠不贪众宝之取舍
  - 珠堕海中姑息退让与誓抒竭海水以明志之坚决
  lesson: 福以利他为本，志行勇决则能移山竭海，布施持戒累功自致成佛
  summary_first_person: 我堕地即发愿救济贫穷，十七岁辞亲入海，遍历银金水精琉璃四城以定力伏毒蛇得四明月珠，海神夺珠我誓抒尽海水感得四天王相助，夺回明珠归国大施，令境内无饥寒，终累功成佛
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘单译经/佛说大意经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘单译经/佛说大意经.html
endeavors:
- id: guji-大意-endeavor-1
  title_zh: 入海采宝遍历四城
  summary: 为济天下穷厄辞家入海，历银城金城水精城琉璃城，以定意伏毒蛇得四明月珠
  phases:
  - key: brewing
    name: 发愿请行
    labels:
      zh: 萌愿
    start_date: -0685-01-01
    highlight_event_id: guji-大意-event-birth
  - key: breakthrough
    name: 初航得宝再探异境
    labels:
      zh: 远航
    start_date: -0684-01-01
    highlight_event_id: guji-大意-event-silver-city
  - key: climax
    name: 连登三城获珠
    labels:
      zh: 得珠
    start_date: -0683-04-01
    highlight_event_id: guji-大意-event-gold-city
  - key: closure
    name: 四珠在手思归
    labels:
      zh: 志满
    start_date: -0683-06-15
    highlight_event_id: guji-大意-event-lapis-city
  decisions:
  - date: -0685-01-15
    title_zh: 拒婆罗门留婿坚决入海
    rationale: 以天下穷厄为念，不以安逸婚姻废济世本愿，必采七宝以给施
  - date: -0683-05-01
    title_zh: 不受七宝唯求明珠
    rationale: 众宝不足济世，明月珠能随宝四十至八十里，取珠则利济更广
- id: guji-大意-endeavor-2
  title_zh: 抒海夺珠归国大施
  summary: 海神化人夺珠堕水，誓抒竭海水感四天王相助，怖海神归珠，迎娶婆罗门女归国广施终证佛果
  phases:
  - key: brewing
    name: 珠堕不取余宝
    labels:
      zh: 失珠
    start_date: -0683-07-01
    highlight_event_id: guji-大意-event-sea
  - key: breakthrough
    name: 誓抒海水感天
    labels:
      zh: 誓抒
    start_date: -0683-07-02
    highlight_event_id: guji-大意-event-sea
  - key: climax
    name: 海神怖惧归珠
    labels:
      zh: 复得
    start_date: -0683-07-05
    highlight_event_id: guji-大意-event-sea
  - key: closure
    name: 还国布施成就
    labels:
      zh: 广施
    start_date: -0683-08-01
    highlight_event_id: guji-大意-event-philanthropy
  decisions:
  - date: -0683-07-02
    title_zh: 誓抒尽海水不与海神妥协
    rationale: 忆宿世供佛誓愿移山竭海，且自念生死积骨过须弥山，小海何足不抒，显勇决以成道基
  - date: -0683-08-10
    title_zh: 迎娶婆罗门女并倾财大施
    rationale: 信守前约不负人，归国以四珠所随珍宝恣意布施，令四方归仁以完济世本愿
events:
- id: guji-大意-event-birth
  title_zh: 欢乐无忧国诞生发愿
  date: -0700-01-01
  precision: century
  is_circa: true
  location: 欢乐无忧国居士摩诃檀家
  description: 姿容端正堕地便言誓布施天下救济孤贫，父母名曰大意，恐为天龙鬼神卜问，自言为人但念穷厄欲护视之
- id: guji-大意-event-silver-city
  title_zh: 登银城伏毒蛇得二十里珠
  date: -0683-03-01
  precision: year
  is_circa: true
  location: 海中银城
  description: 见高广八十由延大树及银城，三匝毒蛇举头，入定令蛇睡卧，王出迎留供九十日，辞去不受七宝唯求明月珠，得随宝二十里之珠
- id: guji-大意-event-gold-city
  title_zh: 登金城得四十里珠
  date: -0683-04-01
  precision: year
  is_circa: true
  location: 海中金城
  description: 金城七宝树自然音乐天女倍前，六匝毒蛇亦以定伏之，王留供六十日，不受众宝求明月珠得随宝四十里之珠
- id: guji-大意-event-crystal-city
  title_zh: 登水精城得六十里珠
  date: -0683-05-01
  precision: year
  is_circa: true
  location: 海中水精城
  description: 水精宫阙九匝毒蛇以定伏之，王留供四十日，仍不受七宝唯求明月珠得随宝六十里之珠
- id: guji-大意-event-lapis-city
  title_zh: 登琉璃城得八十里珠
  date: -0683-06-01
  precision: year
  is_circa: true
  location: 海中琉璃城
  description: 琉璃城十二匝毒蛇以定伏之，王留供二十日，不受珍宝求明月珠得随宝八十里之珠，四珠既具思归本国
- id: guji-大意-event-sea
  title_zh: 海神夺珠誓抒海水复得
  date: -0683-07-02
  precision: year
  is_circa: true
  location: 大海中
  description: 海神化人借观四珠摇堕水中，自誓抒尽海水，海深三百三十六万由延不为所惧，精诚感第四天王相助已抒三分之二，诸神怖惧归还四珠不受余宝
- id: guji-大意-event-philanthropy
  title_zh: 还国娶女大布施
  date: -0683-08-10
  precision: year
  is_circa: true
  location: 欢乐无忧国
  description: 取婆罗门女为妻还国，恣意布施境内无饥寒穷乏，四方士民襁负归仁，恩逮蜎飞蠕动
- id: guji-大意-event-death
  title_zh: 寿终累功成佛
  date: -0620-01-01
  precision: century
  is_circa: true
  location: 欢乐无忧国
  description: 布施历年后寿终，或上为帝释或下为飞行皇帝，积累功德自致成佛，佛言即我身是，前四城王即阿难目犍连舍利弗等，夺珠者即调达
