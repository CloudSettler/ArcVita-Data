  era: 传说上古
  reign_ref: 婆罗痆斯
  archetype: 求法殉道君王
  dilemmas:
  - 为求一偈而舍爱子爱妻与自身是否合于菩萨大悲
  - 国君以身殉法如何兼顾利乐兆人与渴仰胜法
  - 面对药叉索食人热血肉之怖畏当以何信念不动如山
  lesson: 为法忘躯舍所重爱方能令正法久住，慕法情深不动如山则必证菩提
  summary_first_person: 吾昔为婆罗痆斯妙色王，以法化世令国土丰乐人民炽盛如观一子，后渴仰胜法悬金箱于幢上诏求，逢帝释化药叉索妻子与身，吾先立要闻伽他由爱故生忧怖既受持已愿舍身命，天帝还亲赞我必成无上正觉
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%A6%99%E8%89%B2%E7%8E%8B%E5%9B%A0%E7%BC%98%E7%BB%8F.md
