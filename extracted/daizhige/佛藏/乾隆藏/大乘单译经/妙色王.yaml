endeavors:
- id: guji-妙色王-endeavor-1
  title_zh: 以法化世治国安民
  description: 于婆罗痆斯以正法化世，令无斗战诈伪怨贼亦无病苦灾横，稻蔗牛羊充满，恩育兆人如观一子
  phases:
  - key: brewing
    name: 秉法立国
    labels:
      zh: 发愿化世
    start_date: '-1500'
    highlight_event_id: guji-妙色王-event-reign
  - key: breakthrough
    name: 国土丰乐
    labels:
      zh: 丰乐无灾
    start_date: '-1490'
    highlight_event_id: guji-妙色王-event-reign
  - key: climax
    name: 恩育如子
    labels:
      zh: 慈治
    start_date: '-1480'
    highlight_event_id: guji-妙色王-event-reign
  - key: closure
    name: 转向求法
    labels:
      zh: 渴仰胜法
    start_date: '-1470'
    highlight_event_id: guji-妙色王-event-seek-dharma
  decisions:
  - date: '-1495'
    title_zh: 决定以法化世不以威刑治国
    rationale: 敬信贤善自利利人发坚固愿，欲令国无瓦砾荒梗棘刺斗战怨贼
  - date: '-1485'
    title_zh: 决定恩育兆人如观一子常行大舍
    rationale: 除去悭贪慈愍群官，以爱民如子令人民炽盛
- id: guji-妙色王-endeavor-2
  title_zh: 悬金求法舍身闻偈
  description: 心悕胜法悬妙金宝于幢上鸣鼓诏求，遇帝释化药叉试以人血肉，舍爱子妙容及自身以求胜妙伽他
  phases:
  - key: brewing
    name: 渴仰询访
    labels:
      zh: 召集群僚
    start_date: '-1470'
    highlight_event_id: guji-妙色王-event-seek-dharma
  - key: breakthrough
    name: 悬箱鸣鼓
    labels:
      zh: 悬金诏求
    start_date: '-1465'
    highlight_event_id: guji-妙色王-event-seek-dharma
  - key: climax
    name: 舍亲供养
    labels:
      zh: 舍妻子身
    start_date: '-1460'
    highlight_event_id: guji-妙色王-event-sacrifice
  - key: closure
    name: 闻偈证信
    labels:
      zh: 天帝还亲
    start_date: '-1460'
    highlight_event_id: guji-妙色王-event-preach-gatha
  decisions:
  - date: '-1465'
    title_zh: 决定悬金箱于幢上鸣鼓普告四方
    rationale: 今虽无佛亦当求胜法，若有宣说以金箱报恩广设音乐庆赞
  - date: '-1460'
    title_zh: 决定立要先闻法后舍身
    rationale: 身死则无法受持，令药叉先说伽他如说奉持后即随意当食无退转心
