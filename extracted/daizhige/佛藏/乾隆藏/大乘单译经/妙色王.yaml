  date: '-1460'
  location: 婆罗痆斯大众中
  description: 帝释观下界化大药叉索人热血肉，王先舍端正子次舍妙容夫人皆分裂啖食，王慕法情深了无惊惧
  year_of: -1460
- id: guji-妙色王-event-preach-gatha
  title_zh: 立要闻伽他天帝还亲显应
  date: '-1460'
  location: 婆罗痆斯大众中
  description: 与药叉立要先说胜妙伽他由爱故生忧由爱故生怖若离于爱者无忧亦无怖，王闻法欢喜奉持愿舍身，帝释复天形携子持妻付王赞必成无上正等菩提忽然不现
  year_of: -1460
- id: guji-妙色王-event-death
  title_zh: 示现舍报后事不详
  date: '-1400'
  location: 婆罗痆斯
  description: 本生示现后无明确终年，世尊自指彼时妙色王者即我身是为后世求法忘劳之缘
  year_of: -1400
