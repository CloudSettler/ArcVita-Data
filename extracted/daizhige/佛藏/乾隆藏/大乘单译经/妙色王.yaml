  title_zh: 悬金箱鸣鼓诏求胜法
  date: '-1465'
  location: 婆罗痆斯宫中
  description: 心悕胜法召集群僚告以渴仰，以箱盛妙金宝悬于幢上鸣鼓宣令普告四方求宣胜法者
  year_of: -1465
- id: guji-妙色王-event-sacrifice
