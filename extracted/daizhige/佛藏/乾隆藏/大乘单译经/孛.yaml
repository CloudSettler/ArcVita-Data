    title_zh: 受蓝达王请共治国事
    rationale: 愍念四臣贪浊民被其毒，王不觉知，愿以清净无欲之政济民救国
  - date: -0568-01-01
    title_zh: 见犬吠礼薄即持钵欲去
    rationale: 犬宾只啀喍、夫人擎卷、木床瓦器恶米为谋兆，小怨成大不可轻，当慎避全身，持钵水瓶入山修志
events:
- id: guji-孛-event-birth
  title_zh: 生于蒲邻奈瞿昙家
  date: -0600-01-01
  year_of: '-0600'
  location: 蒲邻奈国
  description: 梵志瞿昙氏国中第一，幼子端正无比，为设大会众师相为国师，名曰孛，幼好学通众经及九十六种道术
- id: guji-孛-event-renunciation
  title_zh: 舍家从师得道
  date: -0582-01-01
  year_of: -0582
  location: 山中
  description: 因二兄数求分异贪分，母怜不止，孛自请行学道，近明师作沙门，自得四意止慈悲喜护及四誉行绝五欲，能役鬼神化众行十善
- id: guji-孛-event-advising-landa
  title_zh: 受请辅政蓝达国
  date: -0580-07-01
  year_of: -0580
  location: 蓝达国王宫及城外精舍
  description: 从沙陀寄止七日入城乞食，为蓝达王所敬，请与四臣共治，革除淫盗诤斗，教民孝顺布施，国界安宁风雨时节五谷丰熟，十二年为国宝
- id: guji-孛-event-slander-retreat
  title_zh: 遭四臣夫人谗陷见机而退
  date: -0568-01-01
  year_of: -0568
  location: 蓝达国王宫
  description: 四臣畏忌合财一亿贿夫人，诬孛图国导夫人恶教，王听夫人言以木床瓦器恶米待孛，犬宾只啀吠示兆，孛知有谋，历陈四自坏四自危友如花称山地等四十五事之要，持钵欲入深山，王泣留不止
- id: guji-孛-event-death
  title_zh: 入山修志圆寂
  date: -0520-01-01
  year_of: '-0520'
  location: 深山
  description: 辞王后入山修其志，守清虚无为之道，以譬喻自解如蜜涂刀狗舐伤舌，告王常念除畏，后遂隐寂，传说为佛宿世菩萨行
