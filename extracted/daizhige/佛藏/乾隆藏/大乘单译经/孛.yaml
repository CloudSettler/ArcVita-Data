  summary_first_person: 吾本蒲邻奈国瞿昙氏幼子，少好学通九十六种道术，见二兄贪分不息，乃舍家从明师作沙门，得四意止四誉行；后辅蓝达王十二载，以仁和清净之政化民行十善，使国安丰熟；及四臣夫人阴谋见犬吠礼薄，吾知机而退，入山修志，以譬喻明道，欲令人远恶亲贤，不贪小甜而忘长痛。
