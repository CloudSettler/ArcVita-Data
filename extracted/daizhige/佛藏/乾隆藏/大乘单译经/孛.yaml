    title_zh: 主动舍产求道
    rationale: 见二兄贪分不止，自念人生皆为贪苦，若不去则争不息，遂报母求行学道以全亲全道
  - date: -0581-01-01
    title_zh: 得法后广行化导
    rationale: 以慈悲喜护役鬼神医众疾，令行十善孝顺师长，疑者信道，灾异自平
