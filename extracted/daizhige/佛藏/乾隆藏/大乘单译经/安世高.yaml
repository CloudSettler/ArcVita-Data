    start_date: '0152'
    highlight_event_id: guji-安世高-event-translate-mingdu
  - key: climax
    name: 破欲堕爱栽
    labels:
      zh: 校计欲爱堕栽度众
    start_date: '0155'
    highlight_event_id: guji-安世高-event-teach-anban
  - key: closure
    name: 南土禅风初布
    labels:
      zh: 会稽弘禅示灭
    start_date: '0165'
    highlight_event_id: guji-安世高-event-south
  decisions:
  - date: 0149
    title_zh: 以守六情归灭尽为厚行标准
    rationale: 菩萨厚薄不在名位而在能否常守心意识眼耳鼻口身令好恶不动，归灭尽种道栽，故立此为实修纲领
  - date: '0155'
    title_zh: 直指欲念即是欲欲不讳弘法利他之欲
    rationale: 学人自谓无欲而仍欲度人欲听经欲布施，须点破微细欲欲，使知堕栽爱着所在，方能真舍
events:
