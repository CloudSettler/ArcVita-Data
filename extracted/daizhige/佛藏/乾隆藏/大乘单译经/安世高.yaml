  birth_date: '0100'
  death_date: 0168
  era: 后汉
  reign_ref: 汉桓帝至汉灵帝
  archetype: 译经僧
  dilemmas:
  - title_zh: 胡汉隔阂如何使深奥禅法见信于汉地士人
    description: 安息本为王太子，舍弃王位东来，于语言文字皆异的洛阳，需以可信的小乘禅数取信汉人，再渐次引入大乘空义
  - title_zh: 名相繁琐与心性直观如何兼顾
    description: 五十校计等法门条目繁至百八，若徒列名相则徒增痴疑，需以安般守意数息为实修总持，令校计归于灭尽
  lesson: 守六情归灭尽，校计百八以破痴疑颠倒，方能转薄为厚，由闻思入实证
  summary_first_person: 吾本安息国太子，号清，字世高，游学西域精通经律。汉桓帝初东游洛阳，见汉地未有禅法，遂舍王位而为译师。吾以安般守意为本，译出五十校计等经，示人以心意识眼耳鼻口身皆可校计，五十校计各摄百八，令学人知痴知着知灭，断爱栽堕，守意不失。愿后学不徒说着说灭，而能数息观净，实证灭尽。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%98%8E%E5%BA%A6%E4%BA%94%E5%8D%81%E6%A0%A1%E8%AE%A1%E7%BB%8F.md
