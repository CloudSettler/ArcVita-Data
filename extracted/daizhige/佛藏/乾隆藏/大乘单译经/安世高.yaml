  year_of: '0165'
  location: 会稽
  description: 洛阳译事告一段落，南游江淮会稽，避汉末党锢之乱，继续传译弘禅，声化江南
- id: guji-安世高-event-death
  title_zh: 示寂于会稽
  date: 0168
  year_of: 0168
  location: 会稽
  description: 相传卒于会稽，春秋约六十余，一生译经三十余部，奠定汉地小乘禅学与般若校计之基
