  decisions:
  - date: 0148
    title_zh: 定居洛阳以汉语文译胡经
    rationale: 欲使佛法见信于汉廷士人，须弃梵本直译为质朴汉文，以安般数息等可验之法先立信
  - date: '0152'
    title_zh: 以五十校计摄百八烦恼系统化
    rationale: 学人惑于痴疑颠倒欲堕爱栽等散乱烦恼，须以十组五十校计各统百八，令校计有次第可修可检
- id: guji-安世高-endeavor-2
  title_zh: 弘传禅观实修
  goal_zh: 示人数息守意、止观还净之行，令薄行菩萨转为厚深随道者
  phases:
  - key: brewing
    name: 示数息法要
