  title_zh: 诞生于于阗
  date: '0652'
  year_of: 652
  place_zh: 于阗
  description_zh: 实叉难陀生于于阗，梵名悉叉难陀，意为学喜，后出家通晓大乘梵典
- id: guji-实叉难陀-event-1
  title_zh: 奉诏入洛至大遍空寺
  date: 0695
  year_of: 695
  place_zh: 洛阳大遍空寺
  description_zh: 武周证圣元年，武后遣使迎于阗三藏实叉难陀入洛，于大遍空寺等处设译场
- id: guji-实叉难陀-event-2
  title_zh: 主译大方广佛华严经八十卷
  date: 0698
  year_of: 698
  place_zh: 洛阳佛授记寺
  description_zh: 与义净、复礼等同译梵本华严，于佛授记寺译成八十卷华严，为后世华严宗根本
- id: guji-实叉难陀-event-3
  title_zh: 译佛说救面然饿鬼陀罗尼神咒经
  date: '0700'
  year_of: 700
  place_zh: 洛阳
  description_zh: 译出救面然饿鬼陀罗尼神咒经一卷，宣说阿难遇面然饿鬼、佛授一切德光无量威力陀罗尼及施食仪轨，广传施饿鬼法
- id: guji-实叉难陀-event-4
  title_zh: 请归于阗道中圆寂
  date: '0710'
  year_of: 710
  place_zh: 长安至三原
  description_zh: 久视后请归于阗，景龙四年于归途至长安附近圆寂，世寿五十九，荼毗后舍利分塔供养
- id: guji-实叉难陀-event-death
  title_zh: 圆寂
  date: '0710'
  year_of: 710
  place_zh: 长安
  description_zh: 景龙四年示寂，朝廷追谥，译业与德行传于后世
