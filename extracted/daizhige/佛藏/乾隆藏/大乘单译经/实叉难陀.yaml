  dilemmas:
  - title_zh: 梵本阙略与汉义通达如何取舍
    description: 重译华严时梵本与旧译出入甚多，若一依梵文则汉地难解，若过度顺汉则失梵旨
  - title_zh: 朝廷崇重与山林潜修如何抉择
    description: 武后礼遇供养甚厚，名位日隆，然译场繁务易荒戒定，宜以何为本
  lesson: 以信解为舟，以翻译为业，令梵典得入汉土，使右绕佛塔一行亦成众生福田
  summary_first_person: 吾本于阗人，幼习梵典，后奉诏入洛，于武周朝参译华严及诸大乘单译经。尝谓佛法不分华梵，唯在显其义味；右绕佛塔虽微行，亦具无量功德，愿以舌笔为灯，令见闻者咸生净信。
