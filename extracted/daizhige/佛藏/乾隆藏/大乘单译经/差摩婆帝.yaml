person:
  qid: guji-差摩婆帝
  name_zh: 差摩婆帝
  names:
    zh: 差摩婆帝
    en: Shamavati
  lifespan:
    birth:
      date: -0558
      precision: century
      is_circa: true
      raw: 约前558年
    death:
      date: -0485
      precision: century
      is_circa: true
      raw: 约前485年
  birth_date: -0558
  death_date: -0485
  era: 古印度摩揭陀国
  reign_ref: 频婆娑罗王
  archetype: 发愿菩萨
  dilemmas:
  - 女身劣报与丈夫身成佛大愿之冲突
  - 现世端严福果与后世无上菩提果何者为究竟
  - 自求解脱与利益安乐一切众生之抉择
  lesson: 福德如树须以施戒为水、忍进为养、禅慧为花，方能结无上菩提之果
  summary_first_person: 我为频婆娑罗王夫人差摩婆帝，于重楼上见世尊入城，心净下楼以波都拏衣请佛敷座，论福德树之因果，发愿舍妇女身得丈夫身、转无上法轮，蒙世尊授记未来当作功德宝胜如来
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%B7%AE%E6%91%A9%E5%A9%86%E5%B8%9D%E6%8E%88%E8%AE%B0%E7%BB%8F.html
endeavors:
- id: guji-差摩婆帝-endeavor-1
  title_zh: 修行六度培育福德大树
  description: 以布施持戒为水、忍辱精进为养、禅定般若为花，往世于佛声闻菩提道中种福德树，今生得端严无垢之果，仍以利益众生为本继续滋养
  phases:
  - key: brewing
    name: 往世种树
    labels:
      zh: 发心种树
    start_date: -368
    highlight_event_id: guji-差摩婆帝-event-birth
  - key: breakthrough
    name: 六度滋养
    labels:
      zh: 六度润长
    start_date: -349
    highlight_event_id: guji-差摩婆帝-event-vow
  - key: climax
    name: 端严果现
    labels:
      zh: 庄严示现
    start_date: -0528
    highlight_event_id: guji-差摩婆帝-event-meet-buddha
  - key: closure
    name: 回向菩提
    labels:
      zh: 回向正觉
    start_date: -0528
    highlight_event_id: guji-差摩婆帝-event-prophecy
  decisions:
  - date: -349
    title_zh: 决定以施戒水湿润福树
    rationale: 知福德树非一时得，需以布施持戒持续润泽，令枝叶增长上下不动
  - date: -0528
    title_zh: 于佛前明言此果唯花果在后
    rationale: 显现今生端严只是花报，志在第一无上佛菩提果，不以现福为足
- id: guji-差摩婆帝-endeavor-2
  title_zh: 重楼请佛发愿授记
  description: 于王舍城重楼见佛入城，心净请座，以偈论福德树，问佛三十二相等诸佛法从何而生，起胜上心发愿舍女身得佛身度脱苦众，蒙佛授记为功德宝胜如来
  phases:
  - key: brewing
    name: 见佛生信
    labels:
      zh: 见佛净心
    start_date: -0528
    highlight_event_id: guji-差摩婆帝-event-meet-buddha
  - key: breakthrough
    name: 请法问答
    labels:
      zh: 偈问佛法
    start_date: -0528
    highlight_event_id: guji-差摩婆帝-event-vow
  - key: climax
    name: 发大誓愿
    labels:
      zh: 舍女求佛
    start_date: -0528
    highlight_event_id: guji-差摩婆帝-event-vow
  - key: closure
    name: 蒙佛授记
    labels:
      zh: 授记欢喜
    start_date: -0528
    highlight_event_id: guji-差摩婆帝-event-prophecy
  decisions:
  - date: -0528
    title_zh: 下楼敷波都拏衣请佛就座
    rationale: 见世尊与弥勒菩萨入城乞食，即以最上价衣为座，示最大敬重以求说法
  - date: -0528
    title_zh: 发愿舍妇女身转无上法轮
    rationale: 不恋端严女身，愿得丈夫身次第得佛身，为缚生死狱众生作解脱
  - date: -0528
    title_zh: 奉丰足饮食供养佛及弥勒
    rationale: 既蒙授记欢喜决定，以佉陀尼等四食殷勤供养，增益授记功德
events:
- id: guji-差摩婆帝-event-birth
  title_zh: 出生为摩揭陀王妃
  date: -0558
  year_of: -0558
  description: 约前六世纪生于摩揭陀国，后为频婆娑罗大王夫人，宿世已种福德树
- id: guji-差摩婆帝-event-meet-buddha
  title_zh: 重楼见佛敷座恭请
  date: -0528
  year_of: -0528
  description: 佛住耆阇崛山与弥勒入王舍城乞食，至王宫前，差摩婆帝于重楼见佛心净，下楼敷波都拏大价衣请如来坐，弥勒坐尼师坛，敛容欲闻法
- id: guji-差摩婆帝-event-vow
  title_zh: 说福德树偈发菩提大愿
  date: -0528
  year_of: -0528
  description: 应佛知而故问何树何果，以偈答福德为树施戒为水忍进为养禅慧为花，言今果唯花、后必得无上菩提果，愿舍女身得丈夫身度一切苦众
- id: guji-差摩婆帝-event-prophecy
  title_zh: 蒙授记当作功德宝胜如来
  date: -0528
  year_of: -0528
  description: 世尊赞其善哉，食已洗手更为说法，授记未来过无量劫当得作佛号功德宝胜如来，世界清净无恶道、菩萨庄严，多千优婆塞发菩提心
- id: guji-差摩婆帝-event-death
  title_zh: 示寂
  date: -0485
  year_of: -0485
  description: 于摩揭陀示寂，依授记后世当转女成男，次第成就佛身
