    en: Simhacandra
  lifespan:
    birth:
      date: -1200-01-01
      precision: dynasty
      is_circa: true
      raw: 过去无量劫前为金色猕猴，然灯佛灭后遇阿练若罗汉
    death:
      date: '3500-01-01'
      precision: dynasty
      is_circa: true
      raw: 未来大光劫于宝光国成佛后入涅槃
  birth_date: -1200-01-01
  death_date: '3500-01-01'
  era: 传说古印度
  reign_ref: 未来宝光国
  archetype: 持戒转化者
  dilemmas:
  - 畜生障道与发无上菩提心的张力
  - 现身猕猴戏耍遭讥谤与以神变度化的抉择
  lesson: 戒为甘露药，持戒能破畜生业为生天梯，破戒则堕泥犁，当勤持净戒布施修净命
  summary_first_person: 我本为金色猕猴，一见罗汉欢喜受三归五戒，虽坠高山而死却得生兜率值遇补处菩萨，历无数劫修六度住不退地，今于王舍城现婆须蜜多比丘身与八万四千金色猕猴同作金色神变，令王与大众知持戒破戒之报，未来当于宝光国成师子月佛
  source_urls:
