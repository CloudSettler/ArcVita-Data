  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%B8%88%E5%AD%90%E6%9C%88%E4%BD%9B%E6%9C%AC%E7%94%9F%E7%BB%8F.html
endeavors:
- id: guji-师子月-endeavor-1
  title_zh: 猕猴受戒转生天道发菩提心
  description: 为猕猴时遇头陀罗汉，效学袈裟绕行供养，受三归五戒发愿成佛，虽堕山死而破畜生业生兜率天，值遇一生补处菩萨闻无上道
  phases:
  - key: brewing
    name: 泽中遇圣初心萌动
    labels:
      zh: 遇罗汉
    start_date: -1200-01-01
    highlight_event_id: guji-师子月-event-precept
  - key: breakthrough
    name: 受戒忏悔得清净
    labels:
      zh: 受五戒
    start_date: -1200-01-02
    highlight_event_id: guji-师子月-event-precept
  - key: climax
    name: 堕死生天值弥勒
    labels:
      zh: 生兜率
    start_date: -1200-01-03
    highlight_event_id: guji-师子月-event-heaven
  - key: closure
    name: 持天花供养证业果
    labels:
      zh: 证因果
    start_date: -1200-01-04
    highlight_event_id: guji-师子月-event-heaven
  decisions:
  - date: -1200-01-02
    title_zh: 誓受三归五戒终身不杀
    rationale: 罗汉开示畜生障道唯精进求菩提可破，发愿从今日乃至成佛终不杀生以结清净因
  - date: -1200-01-03
    title_zh: 发无上道心求阿耨多罗三藐三菩提
    rationale: 虽知现身为畜生，愿以持戒功德超越千劫重业为未来成佛资粮
- id: guji-师子月-endeavor-2
  title_zh: 王舍城现婆须蜜多神变授记成佛
  description: 于释迦时现婆须蜜多比丘身，于迦兰陀竹园与八万四千金色猕猴同作金色示现，度化频婆娑罗王及大众，获释迦授记未来宝光国成师子月佛
  phases:
  - key: brewing
    name: 竹园猿戏引讥谤
    labels:
      zh: 示猿戏
    start_date: -0600-01-01
    highlight_event_id: guji-师子月-event-variation
  - key: breakthrough
    name: 金色神变令王众惊
    labels:
      zh: 现金色
    start_date: -0600-02-01
    highlight_event_id: guji-师子月-event-variation
  - key: climax
    name: 释迦说本生授未来记
    labels:
      zh: 得授记
    start_date: -0600-02-02
    highlight_event_id: guji-师子月-event-prophecy
  - key: closure
    name: 众猕猴发心王证阿那含
    labels:
      zh: 众发心
    start_date: -0600-02-03
    highlight_event_id: guji-师子月-event-prophecy
  decisions:
  - date: -0600-01-01
    title_zh: 以猕猴戏作度化方便
    rationale: 随宿习与猕猴为伴作那罗戏，非放逸而是令八万四千昔日犯戒比丘尼所化猕猴欢喜结缘
  - date: -0600-02-02
    title_zh: 领受师子月佛授记
    rationale: 释迦印证持戒功德不虚，愿于弥勒后宝光国成佛度十善众生
events:
- id: guji-师子月-event-birth
  title_zh: 生为金色猕猴
  date: -1200-01-01
  year_of: '-1200'
  description: 过去无量劫然灯佛灭后堕猕猴身游空泽，见阿练若罗汉坐禅，效披坐具作袈裟擎香炉绕行
- id: guji-师子月-event-precept
  title_zh: 遇罗汉受三归五戒
  date: -1200-01-02
  year_of: '-1200'
  description: 罗汉为说三归依及忏悔，授不杀不盗不邪淫不妄语不饮酒五戒，猕猴发愿乃至成佛终不杀生
- id: guji-师子月-event-heaven
  title_zh: 堕山命终生兜率天
  date: -1200-01-03
  year_of: '-1200'
  description: 受戒后踊跃上高山缘树舞戏坠地而死，破畜生业生兜率天值遇一生补处菩萨闻无上道，持天花供养罗汉证业如影随形
- id: guji-师子月-event-variation
  title_zh: 王舍城作金色神变
  date: -0600-02-01
  year_of: '-600'
  description: 现婆须蜜多比丘身于迦兰陀竹园与八万四千金色猕猴同作金色，或歌或舞击鼓吹贝采花奉频婆娑罗王，诸天雨花供养
- id: guji-师子月-event-prophecy
  title_zh: 释迦授记当成师子月佛
  date: -0600-02-02
  year_of: '-600'
  description: 释迦为频婆娑罗王说本生，印证此婆须蜜多即未来宝光国师子月如来，闻名能除畜生身及无量生死罪，众猕猴亦得授记大光劫成八万四千普金光明王佛
- id: guji-师子月-event-death
  title_zh: 未来宝光国入涅槃
  date: '3500-01-01'
  year_of: '3500'
  description: 传说未来于宝光国成阿耨多罗三藐三菩提号师子月如来，国土清净如忉利众生行十善具戒，化竟入般涅槃
