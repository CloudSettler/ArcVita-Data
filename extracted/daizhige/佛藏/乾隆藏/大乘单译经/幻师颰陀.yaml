    title_zh: 说大神妙咒护四辈
    rationale: 念后世国相攻伐贼鬼毒害相劫，山林露坐比丘及四辈多病多娆，故说咒令无能娆害皆得安隐
  - date: '-485'
    title_zh: 但覆蔽不伤害
    rationale: 承佛教止止之义，咒但令怨家不知处障蔽乱眼两不相见，系缚消灭，归命于佛
