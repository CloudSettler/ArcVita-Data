  archetype: 持咒护生幻术师
  dilemmas:
  - 欲以大神妙术咒护病比丘，又蒙佛教止止勿使伤害，当如何自处
  - 后世国相攻伐贼鬼毒害交作，欲护山林树下露坐四辈令安隐无病，当如何立愿
  lesson: 以慈护为本，咒术但作覆蔽救济，不为伤害，归命于佛乃得解脱
  summary_first_person: 我是幻师颰陀，常随佛游罗阅只竹园鹦鹉树间，见异比丘于道中为毒蛇所啮鬼神所娆贼所劫掠，便随佛往视，白佛欲说大神妙咒，蒙佛教止止勿伤物，遂说咒愿护后世山间树下及露坐四辈，令毒病鬼贼不得便，覆蔽怨家令两不相见，众系缚皆灭，归命于佛而得解脱
  source_urls:
