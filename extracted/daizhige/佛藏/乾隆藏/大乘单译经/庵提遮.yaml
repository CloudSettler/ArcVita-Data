  decisions:
  - date: '-0565'
    title_zh: 夫不在时坚守内室不轻出见大众
    rationale: 以敬顺夫约不负丝毫为自在非以身自由为自在是以净心感佛摄受
  - date: '-0565'
    title_zh: 以净心受佛余食并念夫同闻法
    rationale: 知大圣非色不离色身以心净力召夫同诣佛所令小戒让位于大菩提
- id: guji-庵提遮-endeavor-2
  title_zh: 师子吼了义辩法度众
  summary: 于祇园大众前与文殊师利论生死常无常空义与舍利弗论男女色心不二佛印为师子吼了义利益千众令得忍得眼得解脱
  phases:
  - key: brewing
    name: 内室遥观佛如目前现
    labels:
      zh: 酝酿
    start_date: '-0565'
    highlight_event_id: guji-庵提遮-event-audience-buddha
  - key: breakthrough
    name: 与文殊论生死常空显不生生不死死等义
    labels:
      zh: 突破
    start_date: '-0565'
    highlight_event_id: guji-庵提遮-event-debate-manjushri
  - key: climax
    name: 与舍利弗论男女色心破相显平等
    labels:
      zh: 高潮
    start_date: '-0565'
    highlight_event_id: guji-庵提遮-event-debate-shariputra
  - key: closure
    name: 佛印授记久值诸佛不久当成正觉付嘱受持
    labels:
      zh: 收束
    start_date: '-0565'
    highlight_event_id: guji-庵提遮-event-buddha-praise
  decisions:
  - date: '-0565'
    title_zh: 对文殊广说不生生不死死常无常空了义
    rationale: 明地水火风不自合散诸法不自生灭空不自空随宜说有以破倒见显实相
  - date: '-0565'
    title_zh: 对舍利弗破男女二见示心非男女
    rationale: 以心与色不二即女相而明心平等令声闻惭耻发菩提心显师子吼无畏
events:
- id: guji-庵提遮-event-birth
  title_zh: 生于长提婆罗门家名庵提遮
  date: -0595
  location: 舍卫城西二十余里长提村
  description: 婆罗门婆私腻迦广学深信内典其长女生而容貌端正度量高远柔下豁然以莫测所由名庵提遮
- id: guji-庵提遮-event-return-home
  title_zh: 适人后暂还家侍省父母
  date: '-0575'
  location: 长提村婆罗门舍
  description: 已适人与人暂来还家侍省父母和合夫妻侍养亲族事夫如禁未尝越分
- id: guji-庵提遮-event-receive-food
  title_zh: 佛遣化女赐钵余食内室受供
  date: '-0565'
  location: 长提村婆罗门舍内室
  description: 佛知其在室内若出利益无量故留钵残食遣化女以偈授之庵提遮以偈答叹并以净心力念夫令至
- id: guji-庵提遮-event-audience-buddha
  title_zh: 随夫诣祇园礼佛陈偈请法
  date: '-0565'
  location: 婆罗门舍及祇树给孤独园会场
  description: 夫随念即至偕诣佛所礼佛及大众以偈叹佛欲设秘密藏求发众菩提基
- id: guji-庵提遮-event-debate-manjushri
  title_zh: 与文殊师利论生死常空了义
  date: '-0565'
  location: 祇园大会众前
  description: 答文殊所问明生以不生生死以不死死常以不自得生灭为常无常以变易无定为空以不自空为空佛印言真实不异
- id: guji-庵提遮-event-debate-shariputra
  title_zh: 与舍利弗论男女色心不二
  date: '-0565'
  location: 祇园大会众前
  description: 舍利弗问何不能离女身庵提遮诘男心非男破夫执色相以偈显若心得离谁为男女令惭耻者无量千众发菩提心五千得无生法忍
- id: guji-庵提遮-event-buddha-praise
  title_zh: 佛印为师子吼授记付嘱阿难受持
  date: '-0565'
  location: 祇园大会
  description: 佛告舍利弗此女非凡已值无量诸佛不久当成正觉告阿难受持此师子吼了义经章句大众欢喜如说修行
- id: guji-庵提遮-event-death
  title_zh: 示灭授记后入灭
  date: '-0510'
  location: 未详
  description: 经未载灭度事佛言不久当成正觉后世传其示灭年代无考以授记究竟为终
