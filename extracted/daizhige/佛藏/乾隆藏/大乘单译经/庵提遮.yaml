  - key: breakthrough
    name: 适人而暂归省亲持戒不越
    labels:
      zh: 突破
    start_date: '-0575'
    highlight_event_id: guji-庵提遮-event-return-home
  - key: climax
    name: 夫不在而守约不出蒙佛赐食
    labels:
      zh: 高潮
    start_date: '-0565'
    highlight_event_id: guji-庵提遮-event-receive-food
