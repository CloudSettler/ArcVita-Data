person:
  qid: guji-德光太子
  name_zh: 德光太子
  names:
    zh: 德光太子
    en: Prince Deguang
  lifespan:
    birth:
      date: '-10000'
      precision: dynasty
      is_circa: true
      raw: 吉义如来时宝照明城生
    death:
      date: '-9000'
      precision: dynasty
      is_circa: true
      raw: 未详
  birth_date: '-10000'
  death_date: '-9000'
  era: 上古
  reign_ref: 吉义如来
  archetype: 厌世求道菩萨太子
  dilemmas:
  - 王宫七宝富贵与山林寂静解脱之抉择
  - 亲恩国土与无量众生苦厄度脱之抉择
  - 五欲伎乐欢娱与厌离无常出离之抉择
  lesson: 视一切爱欲如怨家幻垢，以平等无着之心舍富贵而求无上菩提，方能自度度人
  summary_first_person: 吾为頞真无王之子，虽生而具千藏七宝、八重宫殿、采女伎乐围绕，然蒙净居天诲，不敢放逸。于千岁中独处经行坐禅，视色声香味如毒花罗网，虽父王悲泣劝以王位欲乐，吾决然拒之，誓舍国城而求吉义如来之大道，愿以慈悲雨润三千，令盲者得视、迷者得度。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E8%B5%96%E5%90%92%E5%92%8C%E7%BD%97%E6%89%80%E9%97%AE%E5%BE%B7%E5%85%89%E5%A4%AA%E5%AD%90%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E8%B5%96%E5%90%92%E5%92%8C%E7%BD%97%E6%89%80%E9%97%AE%E5%BE%B7%E5%85%89%E5%A4%AA%E5%AD%90%E7%BB%8F.md
endeavors:
- id: guji-德光太子-endeavor-1
  title_zh: 厌离五欲舍宫出离
  description: 生于阎浮最胜王家，具足七宝宫殿与采女伎乐，然受净居天劝，于万岁中不眠不戏，观欲如怨，誓离王宫富贵而求寂静解脱
  phases:
  - key: brewing
    name: 天劝厌离
    labels:
      zh: 酝酿
    start_date: '-10000'
    highlight_event_id: guji-德光太子-event-birth
  - key: breakthrough
    name: 千岁独处观欲为怨
    labels:
      zh: 突破
    start_date: '-9980'
    highlight_event_id: guji-德光太子-event-1
  - key: climax
    name: 拒王劝请决意舍国
    labels:
      zh: 高潮
    start_date: '-9970'
    highlight_event_id: guji-德光太子-event-2
  - key: closure
    name: 弃众会入山求道
    labels:
      zh: 收束
    start_date: '-9965'
    highlight_event_id: guji-德光太子-event-2
  decisions:
  - date: '-9980'
    title_zh: 却采女伎乐不生贪着
    rationale: 视采女身如画瓶盛秽、皮革裹连，伎乐音声如幻无受，若习想念即失一心，故千岁中不爱色声香味
  - date: '-9970'
    title_zh: 面对父王悲泣拒承王位
    rationale: 知父母兄弟恩爱会当别离、一切所有如草上露，制意不放逸胜得亿郡国，故不贪积慢法而求度无极
- id: guji-德光太子-endeavor-2
  title_zh: 希求佛道誓度众生
  description: 夜闻虚空中诸天叹吉义如来功德，遂发无上菩提心，愿得一切智、辩才光明，度脱三千沉溺恶道之人
  phases:
  - key: brewing
    name: 夜闻佛名
    labels:
      zh: 酝酿
    start_date: '-9960'
    highlight_event_id: guji-德光太子-event-3
  - key: breakthrough
    name: 渴仰吉义如来
    labels:
      zh: 突破
    start_date: '-9960'
    highlight_event_id: guji-德光太子-event-3
  - key: climax
    name: 发大菩提愿
    labels:
      zh: 高潮
    start_date: '-9955'
    highlight_event_id: guji-德光太子-event-4
  - key: closure
    name: 行菩萨清净行
    labels:
      zh: 收束
    start_date: '-9950'
    highlight_event_id: guji-德光太子-event-4
  decisions:
  - date: '-9960'
    title_zh: 闻天叹佛即问佛所在
    rationale: 于讲堂上行立坐禅得八住，夜半闻天叹佛法僧功德，衣毛为竖堕泪，请问虚空诸天所叹何佛
  - date: '-9955'
    title_zh: 发愿逆流度脱众生
    rationale: 见众生随水流堕恶道、为诤空无句起诸邪见，誓不以淫欲贪利求道，当作大悲雨、智慧灯，令三界得三忍平等
events:
- id: guji-德光太子-event-birth
  title_zh: 宝照明城诞生
  date: '-10000'
  year_of: -10000
  place: 阎浮利宝照明大城
  description: 頞真无王典主阎浮时，其子德光太子生，生时自然有千藏七宝出，阎浮人皆欢喜，狱囚得脱，七日内具足博智
- id: guji-德光太子-event-1
  title_zh: 净居天劝不放逸
  date: '-9980'
  year_of: -9980
  place: 宝照明宫殿
  description: 净居诸天中夜来诲太子不当为放逸行，自是万岁中不睡眠不调戏歌舞，独处闲居远离爱欲，常念身命无常恩爱别离
- id: guji-德光太子-event-2
  title_zh: 却王宫欲乐拒承国祚
  date: '-9970'
  year_of: -9970
  place: 乐施财七宝城
  description: 頞真无王为太子造南北八重七宝城、八百宝柱、五百味供具、八十亿童女围绕，太子视如怨家，以偈答父王历陈五欲如毒花幻聚，誓不乐歌舞而求佛道
- id: guji-德光太子-event-3
  title_zh: 夜半闻天叹吉义如来
  date: '-9960'
  year_of: -9960
  place: 七宝讲堂
  description: 太子于讲堂上作立行坐三品行得八住，夜半闻虚空中净居天叹吉义如来无所著等正觉及法众功德，遂叉手以偈问天所叹何佛
- id: guji-德光太子-event-4
  title_zh: 闻佛名发无上菩提愿
  date: '-9955'
  year_of: -9955
  place: 讲堂
  description: 诸天告以今世有佛号吉义在世教授，太子闻已悲喜交并，发愿舍一切所有不惜身命，逆流而上求一切智以度脱沉溺生死之人
- id: guji-德光太子-event-death
  title_zh: 传说入菩萨行未详终时
  date: '-9000'
  year_of: -9000
  place: 未详
  description: 经未载其寿终，唯述其厌离舍国求道，行菩萨清净行，后世以其为求道太子之典范，寿终阙载以传说系年
