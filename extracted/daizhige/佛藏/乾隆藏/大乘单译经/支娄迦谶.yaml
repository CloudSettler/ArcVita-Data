  date: '0182-01-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 为众讲说诸佛无来无去无著而现饥渴病老等，皆为哀十方人随喜示现，非实有染
- id: guji-支娄迦谶-event-teach-disciples
  title_zh: 授徒竺朔佛等续译
  date: '0186-01-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 授受弟子支亮、竺朔佛等传习译法，共译阿閦佛国等经，使译业不绝
- id: guji-支娄迦谶-event-circulate
  title_zh: 内藏百宝经传写流行
  date: '0186-06-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 经成后传写流行，后世收入大藏，列为大乘单译，经云闻者无不得安隐
- id: guji-支娄迦谶-event-death
  title_zh: 示寂于洛
  date: '0190-01-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 灵帝末后事迹不显，或谓归月氏或示寂中土，译业已开，后人追称大乘译经之祖
