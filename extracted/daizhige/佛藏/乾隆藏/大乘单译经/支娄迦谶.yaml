  year_of: guji-支娄迦谶
  location: 洛阳
  description: 后汉桓帝末抵洛阳，设译场，招集笔受度弟子，从此开中土大乘译经之始
- id: guji-支娄迦谶-event-translate-daoxing
  title_zh: 译出道行般若经
  date: '0179-01-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 译出道行般若经十卷，为中土首部般若大经，奠定般若空学译语
- id: guji-支娄迦谶-event-select-sutra
  title_zh: 拣择内藏百宝梵本
  date: '0178-01-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 于所得梵箧中拣得说佛随俗示现之经，拟译以破相显真
- id: guji-支娄迦谶-event-translate-neizang
  title_zh: 译成佛说内藏百宝经
  date: '0180-01-01'
  year_of: guji-支娄迦谶
  location: 洛阳
  description: 译成一卷本内藏百宝经，文殊问佛，由佛具说菩萨内外分别及佛随世间习俗示现百事，明佛智不可量而方便无碍
- id: guji-支娄迦谶-event-preach-convenience
