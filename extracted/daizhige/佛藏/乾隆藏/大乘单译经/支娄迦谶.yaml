  name_zh: 支娄迦谶
  names:
    zh: 支娄迦谶
    en: Lokaksema
  lifespan:
    birth:
      date: '0130-01-01'
      precision: year
      is_circa: true
      raw: 月氏约后汉顺桓间
    death:
      date: '0190-01-01'
      precision: year
      is_circa: true
      raw: 后汉灵帝末后不详，年寿不详
  birth_date: '0130-01-01'
  death_date: '0190-01-01'
  era: 后汉
  reign_ref: 桓帝至灵帝
  archetype: 译师
  dilemmas:
  - 梵本深广而汉文未备，如何取信达雅不失般若空义
  - 大乘初传中土多疑，如何随世间习俗而入使群生信受
  - 月支远来寄居洛邑，如何立译场度弟子以续译业
  lesson: 随世间习俗而示现，方便为门究竟为归，译经贵在不著文饰而直显佛智
  summary_first_person: 吾本月支国人，名支娄迦谶，东来洛阳值桓灵之世。见汉地未闻大乘空慧，乃立译场，口授梵本，令弟子笔受，将般若、宝积诸经译为汉言。吾尝译内藏百宝经，具说诸佛菩萨随俗示现之相，欲令世人知佛智无著而哀物现形，不以形迹求佛。愿后学因方便入真实，莫著文字，直了本空。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%86%85%E8%97%8F%E7%99%BE%E5%AE%9D%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%86%85%E8%97%8F%E7%99%BE%E5%AE%9D%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0807
