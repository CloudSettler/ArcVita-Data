  location: 舍卫国祇树给孤独园
- id: guji-明天菩萨-event-death
  title_zh: 示现无住入法性
  date: -320
  year_of: -320
  summary: 了法性无缘不生不灭无所住无有凡夫圣者信行法行须陀洹乃至佛及向佛者示现无生法忍无有灭度
  location: 法性无住
