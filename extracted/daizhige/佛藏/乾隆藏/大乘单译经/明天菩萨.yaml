    highlight_event_id: guji-明天菩萨-event-practice
  - key: climax
    name: 三空回向
    labels:
      zh: 过去当来现在空无回向者
    start_date: -384
    highlight_event_id: guji-明天菩萨-event-vow
  - key: closure
    name: 愿见诸佛广度众生
    labels:
      zh: 愿常遇佛得甚深三昧
    start_date: -384
    highlight_event_id: guji-明天菩萨-event-vow
  decisions:
  - date: -384
    title_zh: 决意以慈三业摄一切功德
    rationale: 以身礼敬口赞叹心至诚三业清净为回向根本通于佛与众生二境
  - date: -384
    title_zh: 以三空遣相作清净回向
    rationale: 了知回向者回向法回向处皆空法性无缘不生不灭方成无量智慧无边功德
