    rationale: 不存疑难直陈所惑为乐福众生发甚深问令植众德本者得闻胜义
  - date: -384
    title_zh: 谛听善思受佛开示
    rationale: 依佛敕谛听善思以清净心领受回向法门为后修慈等念作本
- id: guji-明天菩萨-endeavor-2
  title_zh: 修慈三业等念众生并作大回向
  summary: 依佛所说于三世诸佛及三世众生所修慈身口意并以所得功德共回向阿耨多罗三藐三菩提行三空清净回向
