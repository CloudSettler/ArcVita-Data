  - key: breakthrough
    name: 发心翻译观音普贤咒
    labels:
      zh: 发愿译经
    start_date: '0695-01-01'
    highlight_event_id: guji-智通-event-translate
  - key: climax
    name: 译竟宣演咒力功德
    labels:
      zh: 译经圆成
    start_date: '0705-01-01'
    highlight_event_id: guji-智通-event-translate
  - key: closure
    name: 流通一卷以利末世
    labels:
      zh: 流通付嘱
    start_date: '0710-01-01'
    highlight_event_id: guji-智通-event-preach
  decisions:
  - date: '0695-01-01'
    title_zh: 存梵音直译五十一段根本咒
    rationale: 为令持诵不失咒力，宁存拙直，不加文饰，故逐字对音以存真
  - date: '0705-01-01'
    title_zh: 具录结界奉请及坛像之法
    rationale: 恐后学徒持咒而无轨则，故兼译结界洒水画坛造像之制，令修学有所依
- id: guji-智通-endeavor-2
  person_id: guji-智通
  title_zh: 传授结界持诵坛法教化四众
  summary: 教导白月八日至十五日结坛香汤洗浴诵咒感见观音普贤
  phases:
  - key: brewing
    name: 观察末世病苦障重
    labels:
      zh: 悲心缘起
    start_date: '0706-01-01'
    highlight_event_id: guji-智通-event-preach
  - key: breakthrough
    name: 开示白月道场行法
    labels:
      zh: 制定行法
    start_date: '0708-01-01'
    highlight_event_id: guji-智通-event-altar
  - key: climax
    name: 引导感见观音普贤现身
    labels:
      zh: 现身授记
    start_date: '0712-01-01'
    highlight_event_id: guji-智通-event-altar
  - key: closure
    name: 付嘱恒持不忘常诵三时
    labels:
      zh: 付嘱恒持
    start_date: '0720-01-01'
    highlight_event_id: guji-智通-event-preach
  decisions:
  - date: '0708-01-01'
    title_zh: 立白月八日至十五日入坛之制
    rationale: 顺月光清净增长之义，令行者专精七日，三时洗浴诵满百八，以期感通
  - date: '0712-01-01'
    title_zh: 严立独处禁语烧谷供养之规
    rationale: 为摄心成就三昧，令入道场唯见一人使令，不与余人言语，日烧谷穗二十一遍，至得见满愿为限
