  - date: '-0500'
    title_zh: 以虚空举足涅槃无灭义答舍利弗三乘问
    rationale: 显一切法向涅槃无分别无可灭以证大乘忍通达法界实际
events:
- id: guji-月上女-event-birth
  title_zh: 生于毗耶离离车家命名月上
  date: '-0500'
  year_of: -500
  place_zh: 毗耶离城毗摩罗诘离车宅
  description_zh: 无垢妻怀妊九月生女，光明照室地动鼓鸣树出酥油伏藏自开，生即合掌说宿世迦叶佛前发菩提心偈，身着天服光明如月故名月上，未几长如八岁毛孔出栴檀香口气如青莲。
- id: guji-月上女-event-preach-desire
  title_zh: 七日之期街衢腾空说离欲偈
  date: '-0500'
  year_of: -500
  place_zh: 毗耶离城四衢街巷虚空一多罗上
  description_zh: 众男各云此是我妻拥来，月上飞空执华说身由舍欲梵行布施得非欲熏，观众生如父母示欲堕恶道梵行得轮王天主乃至佛身，大地震动天雨华，大众舍欲恼生亲想散华成半由旬盖。
- id: guji-月上女-event-lotus-buddha
  title_zh: 月圆斋夜右手生莲见化佛说佛功德
  date: '-0500'
  year_of: -500
  place_zh: 自宅楼上
  description_zh: 十五受八关斋经行，佛神力故右手生百千叶金茎银叶琉璃蕊莲，内有金色具相如来像，问答知是释种佛使，闻说佛者自觉觉他十力无畏诸功德，心生渴仰誓不见佛不饮不食不眠。
- id: guji-月上女-event-debate-sariputra
  title_zh: 出城道上对扬舍利弗辩涅槃无灭
  date: '-0500'
  year_of: -500
  place_zh: 毗耶离城外往大林道上
  description_zh: 舍利弗与五百比丘乞食相逢逆问试忍，答举足依虚空如尊者行，答一切法向涅槃而涅槃无生灭不可得见，答三乘无法分别一相无住，问实际法界如无明爱众生界无有异，辩才无碍令声闻叹希有。
- id: guji-月上女-event-lead-assembly
  title_zh: 率八万四千人足步虚空往诣佛所
  date: '-0500'
  year_of: -500
  place_zh: 毗耶离城至大树林草茅精舍道上
  description_zh: 还空下去地四指经行，安足处地动，与父母亲眷赍香华幡盖，八万四千人随从次第而去，欲向释迦如来听微妙法。
- id: guji-月上女-event-meet-buddha
  title_zh: 持莲华诣大林供养世尊听法发愿
  date: '-0500'
  year_of: -500
  place_zh: 毗耶离大树林草茅精舍佛前
  description_zh: 执莲华及化佛与父母眷属同至五百阿罗汉八千菩萨会中，供养发不动菩提心，述宿世三十三天供养释迦及八十九生福德，劝众修福供佛，发尘数劫不获菩提誓不退愿。
- id: guji-月上女-event-death
  title_zh: 示寂未详传付后世
  date: '-0400'
  year_of: -400
  place_zh: 未详
  description_zh: 经后卷未记终寿，依愿行尘数劫度生，其化缘功德付隋阇那崛多所译二卷流传，以女身智辩为末世示不退菩提之证。
