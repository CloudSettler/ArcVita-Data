  title_zh: 对扬声闻面见世尊问法证发菩提
  summary_zh: 手执化佛莲华路逢舍利弗等五百比丘，辩虚空无分别及涅槃不生灭三乘无分别，忆宿世迦叶佛前坠楼发心事，诣大林供养听法增进大乘忍。
