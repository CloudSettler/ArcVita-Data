    start_date: -0520-04-08
    highlight_event_id: guji-月明-event-jataka
  - key: climax
    name: 明鉴三世
    labels:
      zh: 三世印证
    start_date: -0520-04-08
    highlight_event_id: guji-月明-event-jataka
  - key: closure
    name: 弘宣流通
    labels:
      zh: 诵习三昧
    start_date: -0520-04-15
    highlight_event_id: guji-月明-event-preach
  decisions:
  - date: -0520-04-08
    title_zh: 信受无疑布施为菩萨要行
    rationale: 见智止太子不惜髀肉血以愈至诚意比丘，知布施终不中疑乃积劫成佛之本
  - date: -0520-04-15
    title_zh: 发愿诵习护持深经三昧
    rationale: 鉴末法五十岁中比丘喜浅不信深经，欲常持常护常诵三昧，具慈哀悲护等心
events:
- id: guji-月明-event-birth
  title_zh: 生于罗阅只申日家
  date: '-0550'
  year_of: -550
  description: 罗阅只大姓豪富申日得子，名栴罗法，汉言月明，有清洁之行，佛譬为童男
  location: 罗阅只
- id: guji-月明-event-audience
  title_zh: 耆阇崛山礼佛请法
  date: -0520-04-08
  year_of: -520
  description: 佛在罗阅只耆阇崛山与大比丘千二百五十人菩萨万人俱，月明童男到佛所作礼却坐一面请问菩萨行
  location: 耆阇崛山
- id: guji-月明-event-four-vows
  title_zh: 得闻菩萨四愿与法施要义
  date: -0520-04-08
  year_of: -520
  description: 佛告月明当发四愿愿一切人得善权、世世与善知识会、财宝与众共、常行法施饭食施，并示护戒、疗病比丘当不惜肌肉
  location: 耆阇崛山
- id: guji-月明-event-jataka
  title_zh: 闻智止太子割肉疗师本生
  date: -0520-04-08
  year_of: -520
  description: 佛说过去谛念愿无上王佛般泥洹后末世，智力王太子智止割髀取血肉愈至诚意比丘恶疮，佛言至诚意即提和竭罗佛、智力王即弥勒、智止即我身
  location: 耆阇崛山
- id: guji-月明-event-preach
  title_zh: 信受诵习发无上道意
  date: -0520-04-15
  year_of: -520
  description: 佛说经已，月明与大众莫不欢喜，发无上正真道意，愿诵习是三昧以度世苦
  location: 耆阇崛山
- id: guji-月明-event-death
  title_zh: 示寂
  date: '-0470'
  year_of: -470
  description: 传为得法后长行菩萨道，功圆示寂，后世尊为月明菩萨
  location: 罗阅只
