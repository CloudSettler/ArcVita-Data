  decisions:
  - date: -0520-04-08
    title_zh: 舍豪富乐亲至耆阇崛山礼佛
    rationale: 虽生大姓豪富家，慕佛清净行，愿以童真身亲近正觉，求菩萨大行
  - date: -0520-04-08
    title_zh: 决意受持四愿以法施为本
    rationale: 佛示四愿为疾逮无上正真道要门，遂发愿令一切人得善权、常遇善知识、财法与众共
- id: guji-月明-endeavor-2
  title_zh: 弘传无疑布施与护持深法
  description: 承佛所说过去谛念愿无上王佛时智止太子割髀疗至诚意比丘之本生，演说无疑布施与护持深经三昧之功德
  phases:
