    start_date: -0520-04-01
    highlight_event_id: guji-树提伽-event-meet-buddha
  decisions:
  - date: -0520-02-01
    title_zh: 邀王共观家宅不作人役调度
    rationale: 言家中自然床褥饮食擎来擎去不须呼唤，欲令王亲见福报不可夺取，当以善因求之
  - date: -0520-03-01
    title_zh: 以神杖起倒地兵马而不加杀害
    rationale: 力士已拟倒四十万众，若加害则结怨，举杖令起还国，示福德之威亦示慈心，令王知不可伐而可化
  - date: -0520-04-01
    title_zh: 与王同车诣佛问宿世功德
    rationale: 王惑我妇女宅舍过甚欲伐之，唯佛能说宿因，遂同王往问，以佛语解王嫉贪，令发道心
events:
- id: guji-树提伽-event-alms-past
  title_zh: 前世为商主布施病道人发愿
  date: '-0560'
  year_of: '-0560'
  place: 深山险路庵中
  description: 五百商主将诸商人赍持重宝经过险路，于深山中见一病道人，树提伽前身给其庵屋、厚敷床褥、水浆钨錥米粮、灯烛，乞愿愿得天堂之供
  is_circa: true
- id: guji-树提伽-event-birth
  title_zh: 出生为古印度巨富长者
  date: '-0550'
  year_of: '-0550'
  place: 古印度
  description: 感前世布施之福，生为长者树提伽，仓库盈溢金银具足，奴婢成行无所乏少
  is_circa: true
- id: guji-树提伽-event-white-cloth
  title_zh: 白氎手巾吹至王殿前王问群臣
  date: '-0520'
  year_of: '-0520'
  place: 王殿前
  description: 家中白氎手巾挂着池边，遇天风起吹王殿前，诸臣皆言国将兴天赐白氎，唯树提伽默然，直言不敢欺王是臣家拭涕之巾
  is_circa: true
- id: guji-树提伽-event-golden-flower
  title_zh: 九色大华吹至王殿前再对王
  date: -0520-01-15
  year_of: '-0520'
  place: 王殿前
  description: 后数日九色之华大如车轮吹王殿前，诸臣复言天赐金华，树提伽复直言是臣家后园萎落之华
  is_circa: true
- id: guji-树提伽-event-host-king
  title_zh: 延王及二十万众入宅示天供宝楼
  date: -0520-02-01
  year_of: '-0520'
  place: 树提伽宅第
  description: 王欲将二十万众至其家看，树提伽言家中自然床褥饮食不须人作，擎来擎去不须呼唤。王入南门见守门童男女皆端正可爱，堂前白银为壁水精为地，明月神珠不须火光，十二重高楼四望，流泉浴池皆可爱，王及大臣黯然留连经月
  is_circa: true
- id: guji-树提伽-event-repel-army
  title_zh: 力士金杵拟倒四十万围兵复以神杖起之
  date: -0520-03-01
  year_of: '-0520'
  place: 树提伽门前
  description: 王大会群臣欲伐树提伽，将领四十万众围舍数百重，门中一力士手捉金杵一拟，人马俱倒腰髋妸婆状似醉容不复得起，树提伽乘云车在虚空中举一神杖令四十万众人马俱起还国
  is_circa: true
- id: guji-树提伽-event-meet-buddha
  title_zh: 与王共诣佛所佛说前世因缘
  date: -0520-04-01
  year_of: '-0520'
  place: 佛所
  description: 王遣使唤树提伽共同车而载往诣佛所，问前身何功德致此，佛言五百商主布施病道人者树提伽是，病道人即我身，五百商人皆得阿罗汉，王及诸臣闻已发阿耨多罗三藐三菩提心
  is_circa: true
- id: guji-树提伽-event-death
  title_zh: 寿终
  date: -0480
  year_of: -0480
  place: 古印度
  description: 显福化王、证得宿因后，于佛世末期寿终，其福报事迹为后世布施感果之典范
  is_circa: true
