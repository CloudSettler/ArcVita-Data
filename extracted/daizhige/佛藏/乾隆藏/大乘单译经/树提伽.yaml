    title_zh: 深山供养病道人
    rationale: 见病僧困厄，施庵屋床褥水浆米粮灯烛，愿求天堂之供，种后世大福之因
  - date: '-0520'
    title_zh: 王前自认白氎金华出自家宅
    rationale: 诸臣皆言天赐国兴，我若附和可得宠，我宁不欺王，直言为家中所弃之物，以全诚信
- id: guji-树提伽-endeavor-2
  title_zh: 以神宅天供化导王心并证宿因
  summary: 延王及二十万众入宅示现自然饮食、明月宝珠、宝楼园池，继以力士神杖退四十万围兵，终与王共诣佛所证得前世因缘，令王发菩提心
