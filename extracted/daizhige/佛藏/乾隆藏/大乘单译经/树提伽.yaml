      raw: 佛世末期
  birth_date: '-0550'
  death_date: -0480
  era: 古印度
  reign_ref: 释迦牟尼佛时代
  archetype: 巨富布施长者
  dilemmas:
  - 财福远过王室，当以诚直自处抑或隐匿以避嫉
  - 显现天供神变，当以威伏人抑或以柔化导王心向佛
  lesson: 前世于险路深山以庵屋饮食灯烛布施病道人，发愿得天供，今生即得仓库盈溢天堂之报，知财福皆由善因所感，当以诚不欺王、以福引众归佛
  summary_first_person: 吾名树提伽，前身为五百商主之一，尝于险路深山见一病道人，即施庵屋、床褥、饮食、灯烛，发愿愿得天堂之供。今生得报，仓库盈溢，金银具足。王殿前所吹白氎乃吾家拭涕之巾，九色大华乃后园萎落之华，吾皆不敢欺王。王将二十万众至吾家，吾以自然天供、明月珠、宝楼园池待之，后王欲以四十万众取吾宅舍，吾门力士以金杵一拟令众人缭戾倒地，复以神杖令起。遂与王共诣佛所，方知昔日病道人即今世尊，五百商主皆已得阿罗汉道。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%A0%91%E6%8F%90%E4%BC%BD%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%A0%91%E6%8F%90%E4%BC%BD%E7%BB%8F.html
  - https://www.cbeta.org/result/T0540a.htm
