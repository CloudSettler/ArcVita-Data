  decisions:
  - date: -7990
    title_zh: 尽私藏及身饰施贫
    rationale: 见贫老百疾夹道求索，为满求不得苦，先罄私财
  - date: -7988
    title_zh: 默出宫城自卖他国
    rationale: 国藏不许私用，为救人苦自卖所爱之身得千金施众
  - date: -7987
    title_zh: 以国还主求施中藏
    rationale: 得半国而不受，唯求开藏五十日普施，以成度生誓愿
- id: guji-栴檀摩提-endeavor-2
  title_zh: 舍家学道投身饲虎
  summary_zh: 上山供养勇猛仙人，披鹿皮留住学道，见雪困饿虎母子，发愿舍身，得无生忍，舍利起塔
  phases:
