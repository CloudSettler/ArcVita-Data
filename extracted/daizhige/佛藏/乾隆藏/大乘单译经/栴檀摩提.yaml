  decisions:
  - date: -7974
    title_zh: 不还国留山学道
    rationale: 观宫室如地狱五欲如杻械，为求无为度众苦立志不移
  - date: -7970
    title_zh: 投身崖下饲饿虎
    rationale: 前愿舍千身已满九百九十九，今正是时，以肉血救母子活命，以骨起塔愈众病
events:
- id: guji-栴檀摩提-event-birth
  title_zh: 生于乾陀摩提国为太子
  date: -8000
  year_of: -8000
  place_zh: 乾陀摩提国
  description_zh: 父乾陀尸利王，母差摩目佉，人寿千五百岁，太子慈仁智慧，通群籍道术，常好布施
- id: guji-栴檀摩提-event-alms
  title_zh: 自卖裴提舍布施天下五十日
  date: -7988
  year_of: -7988
  place_zh: 裴提舍国及乾陀摩提国
  description_zh: 自卖与婆罗门得千金施贫，因牛头栴檀愈王癞病得分半国财，开藏于平地布施五十日，还国复路施一年
- id: guji-栴檀摩提-event-practice
  title_zh: 上山从勇猛仙人学道
  date: -7974
  year_of: -7974
  place_zh: 城北山岩大窟
  description_zh: 赍百味供养五百仙众，解璎珞车马遣还，披鹿皮留住，攒寻道术，多年往来问讯父母
- id: guji-栴檀摩提-event-sacrifice
  title_zh: 投身崖下饲饿虎母子
  date: -7970
  year_of: -7970
  place_zh: 山下绝崖深谷
  description_zh: 天雪虎母抱七子饥困欲啖子，于众人前发菩提誓愿，缠头投身，虎得食母子俱活，天雨华地震，仙众发心
- id: guji-栴檀摩提-event-death
  title_zh: 阇维收舍利起七宝塔
  date: -7970
  year_of: -7970
  place_zh: 山谷口平坦地
  description_zh: 王与夫人臣民上山收骸骨，积栴檀香薪阇维，以宝器盛舍利，起七宝塔纵广十里，四部伎昼夜供养，病者礼塔皆愈
