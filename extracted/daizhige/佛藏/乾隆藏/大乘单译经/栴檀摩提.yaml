  dilemmas:
  - 国藏有限而贫者无量，守国制与满布施愿相冲突
  - 孝养父母眷属与舍家求道度众生相冲突
  - 爱惜身命与舍身救虎母子相冲突
  lesson: 以身命财无所遗惜行檀波罗蜜，舍千身满愿，超越九劫而速成菩提
  summary_first_person: 吾为乾陀摩提国太子，少好布施，散中藏以济贫乏，自卖他国得财施众，还国复施一年，后舍国上山从勇猛仙人学道，见饿虎欲啖子，投身崖下以肉血救之，满千身之愿
  source_urls:
