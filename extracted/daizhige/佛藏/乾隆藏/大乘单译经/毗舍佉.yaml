events:
- id: guji-毗舍佉-event-birth
  title_zh: 出生舍卫大长者家为毗舍佉
  date: '-0510'
  location_zh: 舍卫国
  description: 生于舍卫大长者家后称弥伽罗母以乐闻多智净行著称领千五百优婆夷为佛世著名女居士
- id: guji-毗舍佉-event-past-hearing
  title_zh: 前世为莲华王女闻雪山那罗驮梵志五通说法
  date: '-0555'
  location_zh: 波罗奈
  description: 过去波罗奈梵与王女莲华端正儒贤乐多闻自善友闻雪山梵志那罗驮得五神通广说诸法名闻四方心生欢喜欲往礼拜
- id: guji-毗舍佉-event-past-pilgrimage
  title_zh: 奏请父母率千五百婇女赍香华诣雪山听法
  date: '-0554'
  location_zh: 雪山
  description: 父母忧其年幼路险劝请国中耆旧梵志入宫说法王女坚持得许乃敕四臣婇女庄严供养遂与眷属赍香华往诣梵志听受法味
- id: guji-毗舍佉-event-present-buddha-recognition
  title_zh: 佛记宿因莲华即毗舍佉梵志即我
  date: '-0475'
  location_zh: 舍卫祇园弥伽罗母欢喜殿
  description: 佛告毗舍佉尔时王女者汝身是也雪山梵志者即我身是汝昔曾求广说今亦如是当为分别净行法门
- id: guji-毗舍佉-event-present-assembly
  title_zh: 晨朝率千五百优婆夷诣佛请广演净行法门
  date: '-0475'
  location_zh: 舍卫祇园
  description: 佛住舍卫弥伽罗母园欢喜殿毗舍佉母与千五百优婆夷稽首佛足白言已闻略说甚深难解愿哀愍广演令长夜安隐乃至菩提
- id: guji-毗舍佉-event-dharma-expounding
  title_zh: 得闻十行五十八法三大行四行三十二观不净观等
  date: '-0475'
  location_zh: 舍卫祇园
  description: 佛广说净行法门谓亲近善友供养父母夫主乃至见悭贪等过修十行离不净亲净五十八法大信大进大慧四翘勤智慧逝定慈悲三十二观与三十二不净观七缚三善行满等
- id: guji-毗舍佉-event-practice
  title_zh: 闻法欢喜增问修学五十学六光三十二相
  date: '-0474'
  location_zh: 舍卫
  description: 毗舍佉母闻说欢喜踊跃更问光明大人相等佛说五十修学六种光明三十二大人相二十行业感相千辐轮等令依学深入不退
- id: guji-毗舍佉-event-death
  title_zh: 示寂
  date: '-0430'
  location_zh: 舍卫
  description: 护持僧团以净行化导眷属寿终示寂为后世优婆夷修净行之典范
