  summary_first_person: 吾本中天竺婆罗门种，少习大乘，泛海东来至刘宋建康。承文帝礼敬，于祇洹寺等处传译楞伽胜鬘十二头陀等经，深以阿兰若头陀十二法为入道要门，愿后世行人离贪着、住空闲、系心一处而证实智。
