  - date: '0435'
    title_zh: 以婆萸本生劝发菩提
    rationale: 举婆萸仙人以身陷地狱化度六百二十万商人之缘明一念慈悲能破定受果报
events:
- id: guji-法众-event-birth
  date: 0390
  year_of: 0390
  title_zh: 生于河西
  description: 约北凉初年生于河西之地少出家习大小乘兼通梵汉
  location_zh: 河西
- id: guji-法众-event-translation-start
  date: 0428
  year_of: 0428
  title_zh: 于姑臧开译大方等陀罗尼经
  description: 于北凉都姑臧设译场开译梵本首译初分第一敷演摩诃袒持等诸陀罗尼名号及华聚菩萨降伏袒荼罗魔王缘起
  location_zh: 姑臧
- id: guji-法众-event-translation-complete
  date: '0430'
  year_of: '0430'
  title_zh: 译成四卷
  description: 译竣大方等陀罗尼经四卷具载文殊师利请问雷音比丘入定遇魔华聚菩萨以陀罗尼救护及婆萸仙人地狱化度等事
  location_zh: 姑臧
- id: guji-法众-event-preaching
  date: '0432'
  year_of: '0432'
  title_zh: 为四众宣说陀罗尼法
  description: 会合比丘比丘尼优婆塞优婆夷演说持此陀罗尼者十二神王常随拥护令坚固三菩提心
  location_zh: 姑臧
- id: guji-法众-event-vow-protection
  date: '0435'
  year_of: '0435'
  title_zh: 宣十二神王誓愿护持行者
  description: 宣说袒荼罗等十二大王各发誓愿受持读诵陀罗尼经摄救行者令离苦厄
  location_zh: 姑臧
- id: guji-法众-event-death
  date: '0450'
  year_of: '0450'
  title_zh: 示寂于河西
  description: 译事既讫弘法数载后示寂于河西译本入藏后世列为大乘单译经
  location_zh: 河西
