    labels:
      zh: 睹光悔过
    start_date: -0490
    highlight_event_id: guji-法志妻-event-encounter
  - key: climax
    name: 闻法受教
    labels:
      zh: 受持十善
    start_date: -0490
    highlight_event_id: guji-法志妻-event-awakening
  - key: closure
    name: 以义代杖
    labels:
      zh: 慈育下使
    start_date: -0490
    highlight_event_id: guji-法志妻-event-teaching
  decisions:
  - date: -0490
    title_zh: 弃杖不用改以罪福道禁诫示奴婢
    rationale: 佛言庄严在信戒定慧不在璎珞挝捶以辛苦生死三涂之患示之胜于苦毒故当息杖从法
  - date: -0490
    title_zh: 躬行十善六度四等为家内法则
    rationale: 身不杀盗淫口不妄语两舌绮语恶口意不嫉恚痴并行布施持戒忍辱精进禅定智慧及慈悲喜护方能庄严得相好
- id: guji-法志妻-endeavor-2
  title_zh: 发无上心转女成男获授记
  goal: 了五阴如幻无男女相发不退转菩提直至成佛
  phases:
  - key: brewing
    name: 惑于男女形相
    labels:
      zh: 女身障想
    start_date: -0490
    highlight_event_id: guji-法志妻-event-awakening
  - key: breakthrough
    name: 闻空慧发道意
    labels:
      zh: 发菩提心
    start_date: -0490
    highlight_event_id: guji-法志妻-event-awakening
  - key: climax
    name: 辩破天帝劝转男之请
    labels:
      zh: 破相明道
    start_date: -0490
    highlight_event_id: guji-法志妻-event-transform
  - key: closure
    name: 变男踊空得授记
    labels:
      zh: 授记无垢王
    start_date: -0490
    highlight_event_id: guji-法志妻-event-transform
  decisions:
  - date: -0490
    title_zh: 不求日月天帝转轮王乐直发无上正真道意
    rationale: 天帝日月转轮之威如朝露梦觉即灭五阴如幻三界由心作道心无等当求究竟解脱不当贪暂乐
  - date: -0490
    title_zh: 以偈明无男女平等空慧示现转男
    rationale: 谛解五阴幻化三世平等无男无女如画师所作本净故能即心得解变女为男踊空礼佛
events:
- id: guji-法志妻-event-birth
