  location: 舍卫国
  is_circa: true
- id: guji-法志妻-event-encounter
  title_zh: 佛至法志门外放光睹佛悔过
  date: -0490
  year_of: -0490
  description: 世尊着衣持钵入城分卫至法志门外放大光明照十方妻遥见佛明清凉安隐自念不饥不渴即舍杖趣合稽首佛足悔过嗔暴
  location: 舍卫国祇树给孤独园至法志宅
- id: guji-法志妻-event-awakening
  title_zh: 闻佛说十善六度四等发不退转意
  date: -0490
  year_of: -0490
  description: 佛为说女人堕身之因及十善六度四等四庄严法门妻心开踊跃即发无上正真道意立不退转地
  location: 法志宅中合
- id: guji-法志妻-event-transform
  title_zh: 以偈拒天帝变男踊空获授记无垢王佛
  date: -0490
  year_of: -0490
  description: 天帝释劝求转女为男及日月转轮王乐妻以偈答五阴如幻三世平等无男女相佛赞善哉心即解变为男子踊在虚空礼佛佛授记恒沙劫后当得作佛号无垢王如来世曰光净
  location: 法志宅虚空中
- id: guji-法志妻-event-teaching
  title_zh: 化导奴婢同发道意转男得忍
  date: -0490
  year_of: -0490
  description: 诸下使闻佛言一切本无随心所存踊跃发大道意变为男子得不起忍佛为阿难说五阴无处六情无根十二因缘无端四大寄因之法众皆欢喜
  location: 法志宅
- id: guji-法志妻-event-death
  title_zh: 示寂趣后世成佛之行
  date: -0480
  year_of: -0480
  description: 闻法得忍后舍女身之报随业示寂依授记历恒沙劫修行趣无垢王佛果经文未载俗寿故以约年系之
  location: 舍卫国
  is_circa: true
