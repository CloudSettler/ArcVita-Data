  summary_first_person: 我本舍卫长者法志之妻恃财富容色严妆璎珞苛暴奴婢遥见世尊光明清凉照我身心惭惧礼足闻佛说十善六度四等及五阴如幻之慧我即悔过发无上道意蒙佛授记日后当得作佛号无垢王遂与家中奴婢同转男身得无生忍
