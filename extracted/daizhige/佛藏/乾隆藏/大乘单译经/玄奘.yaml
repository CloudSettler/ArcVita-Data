  reign_ref: 隋末至唐高宗麟德
  archetype: 西行求法译经高僧
  dilemmas:
  - 中土众说纷纭而无所折衷，欲求真解则须冒死西行
  - 戒律禁出而求法心切，于国法与佛法之间抉择偷渡出关
  - 归国盛誉加身而译场浩繁，于名位供养与寂照译业之间持心不染
  lesson: 以寂照为体，以神变为用，安住三摩地则能通达颠倒与不颠倒，成就无碍智以利群生
  summary_first_person: 吾玄奘，洛州缑氏人，幼慕释门，贞观西行，历十七载求法印度，归国奉诏译经，传寂照神变三摩地等大乘正法，愿以此智光饶益一切有情
  source_urls:
