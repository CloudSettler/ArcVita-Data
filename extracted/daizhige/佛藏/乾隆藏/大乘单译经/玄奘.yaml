  dilemmas:
  - 贞观禁边西行犯律与求法济众之抉择
  - 梵本直译忠实与中土易解通顺之权衡
  lesson: 西行求法以利安众生为本，译场传灯当以戒定慧并弘，方能令正法久住
  summary_first_person: 吾俗姓陈，洛州缑氏人，幼出家，痛中土经义多阙，乃冒禁西行，历碛逾雪，参学那烂陀，承戒贤亲授瑜伽诸论，十七年负梵本六百余部东归，蒙太宗敕住弘福、慈恩、大慈恩寺主持译场，毕生译经七十五部，六门陀罗尼亦奉诏所译，愿以所积世出世善根，令众生同证无上智果，速得解脱
  source_urls:
