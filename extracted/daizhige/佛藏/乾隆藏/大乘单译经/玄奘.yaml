    title_zh: 辞官不受但受译主
    rationale: 不涉政务以保译事纯粹，藉朝廷资助广延人才速成译业
  - date: '0650-01-01'
    title_zh: 拣译七佛名号功德经
    rationale: 此经明闻持七佛名号即超劫苦、速证菩提，简易普摄，宜先译出以广接信众
events:
- id: guji-玄奘-event-birth
  title_zh: 诞生于洛州缑氏
  date: '0602-04-06'
  place_zh: 隋洛州缑氏
  description: 出缑氏陈氏望族，少聪慧，十三岁于洛阳净土寺出家，习《涅槃》《摄大乘》等论
- id: guji-玄奘-event-westward
  title_zh: 贞观元年西行出关
  date: '0627-08-01'
  place_zh: 凉州玉门关
  description: 贞观元年秋，乘禁令稍弛，昼伏夜行，度莫贺延碛，偷渡玉门关，始十七年西域天竺之行
- id: guji-玄奘-event-nalanda
  title_zh: 就学那烂陀寺
  date: '0631-01-01'
  place_zh: 天竺摩揭陀那烂陀寺
  description: 抵那烂陀，礼百岁高僧戒贤为师，尽学《瑜伽师地论》《顺正理论》《因明》等，并游学五天竺辩难折服外道
- id: guji-玄奘-event-return
  title_zh: 贞观十九年携经归长安
  date: '0645-02-01'
  place_zh: 唐长安弘福寺
  description: 携梵本六百五十七部、佛舍利等归抵长安，太宗亲迎于朱雀门，敕住弘福寺、大慈恩寺组织译场
- id: guji-玄奘-event-translation-yuqie
  title_zh: 译出瑜伽师地论
  date: '0648-06-01'
  place_zh: 长安大慈恩寺译场
  description: 率弟子窥基、神昉等译《瑜伽师地论》百卷，奠定法相唯识宗译传基础
- id: guji-玄奘-event-translation-seven-buddhas
  title_zh: 奉诏译受持七佛名号所生功德经
  date: '0650-01-01'
  place_zh: 长安大慈恩寺
  description: 唐三藏法师玄奘奉诏译《受持七佛名号所生功德经》一卷，于经中宣说东方离垢众德庄严等七佛名号功德，令众生闻持获殊胜利益
- id: guji-玄奘-event-translation-bore
  title_zh: 玉华宫译大般若经终
  date: '0663-10-01'
  place_zh: 坊州玉华宫
  description: 于玉华宫译《大般若波罗蜜多经》六百卷毕，为玄奘译经事业之巅，译业至此臻于圆满
- id: guji-玄奘-event-death
  title_zh: 圆寂于玉华宫
  date: '0664-02-05'
  place_zh: 坊州玉华宫嘉寿殿
  description: 麟德元年二月五日示寂，寿六十二，世寿六十四，高宗罢朝三日，敕葬于长安樊川
