  era: 唐
  reign_ref: 唐太宗贞观至高宗麟德
  archetype: 西行求法译经弘法者
  dilemmas:
  - 中土经义多阙而出境禁严，冒禁西行还是安守本分
  - 印度异域留学期长而亲老国远，久学求解还是早归报国
  - 帝王崇宠供养优厚而译场劳瘁，独修证果还是译经利世
  lesson: 立志求真不避艰险，得法归来利济众生，方不负此生
  summary_first_person: 吾姓陈名祎，洛州缑氏人也，少出家，感中土经阙，贞观初冒禁西行，历西域至印度那烂陀，从戒贤学瑜伽，游学十九年而归，蒙太宗高宗礼敬，于慈恩玉华专心译经，奉诏译出诸佛心陀罗尼等大乘经律，愿以真经饶益怖畏众生
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E8%AF%B8%E4%BD%9B%E5%BF%83%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.html
