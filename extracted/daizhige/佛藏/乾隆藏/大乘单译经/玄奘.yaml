  decisions:
  - date: 0645-03-01
    title_zh: 受诏专心译经不受官爵
    rationale: 以流通法宝为报国恩，不贪荣禄，愿毕生于贝叶
  - date: 0660-01-01
    title_zh: 译出寂照神变三摩地经
    rationale: 贤护所问甚深，菩萨住寂照能得无碍智，宜译传中土令退转者增进
