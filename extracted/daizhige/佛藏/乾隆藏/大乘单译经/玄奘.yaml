  decisions:
  - date: 0627-08-27
    title_zh: 违禁偷渡西行
    rationale: 宁赴五天死，不居中土生，为求正法了生死，故冒禁西进
  - date: 0630-01-01
    title_zh: 留学那烂陀
    rationale: 戒贤正法久住，欲穷瑜伽唯识根本，故止学五年通达三藏
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘传寂照
  summary_zh: 归国后居弘福大慈恩玉华诸寺，设译场译出大般若等七十五部，宣说寂照神变三摩地，立无障碍智以化群生
  phases:
