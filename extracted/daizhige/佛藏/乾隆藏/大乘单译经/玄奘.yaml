  dilemmas:
  - 西行求法违唐初出关禁令，留则经义残缺难解，行则九死一生，何去何从
  - 归国已获帝王礼敬，当安享荣供还是殚精竭虑广译群经以利万世
  lesson: 唯以不惜身命之精进求法与至诚不辍之翻译，方能转贫乏为丰饶、化危惧为安乐而利乐无量有情
  summary_first_person: 吾玄奘，陈氏子，少出家而叹经论阙如，遂冒禁西行万里至天竺求法，十七年归来奉诏译经，一生但愿持世正法周给众生，令贫者得富、病者得愈、罪者得灭、惧者得安
