      raw: 唐麟德元年二月五日
  birth_date: '0602-04-06'
  death_date: '0664-02-05'
  era: 唐
  reign_ref: 隋末至唐高宗麟德
  archetype: 求法译师
  dilemmas:
  - 困于诸师异说与译本阙略，欲亲往天竺求得瑜伽行唯识正法，然隋唐禁边令严，去则为犯禁之罪
  - 归国后受帝王礼遇而欲专心译场，如何在奉诏译经兼弘唯识与保全佛法不依附权势之间取舍
  lesson: 弘法在求真证真，不惮远行与艰苦；得法在精译广传，使众生皆得受持。
  summary_first_person: 吾幼慕法门，感中夏经论分歧，窃欲西行求法。冒禁出关，遍历五天竺，就戒贤于那烂陀，尽得瑜伽唯识宗旨。负笈东归，蒙太宗、高宗礼遇，于长安大慈恩、玉华宫设译场，毕生译经七十余部，冀以正译利乐有情。此《受持七佛名号所生功德经》亦吾奉诏所译，欲令众生闻七佛名号，种清净因，获殊胜安乐。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E5%8F%97%E6%8C%81%E4%B8%83%E4%BD%9B%E5%90%8D%E5%8F%B7%E6%89%80%E7%94%9F%E5%8A%9F%E5%BE%B7%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E5%8F%97%E6%8C%81%E4%B8%83%E4%BD%9B%E5%90%8D%E5%8F%B7%E6%89%80%E7%94%9F%E5%8A%9F%E5%BE%B7%E7%BB%8F.md
  - https://cbetaonline.dila.edu.tw/zh/T0436
