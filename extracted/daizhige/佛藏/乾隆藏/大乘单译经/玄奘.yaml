    title_zh: 违禁偷渡玉门关
    rationale: 若依法禁不西行，则唯识大义终难决了，宁冒死求法以利后学
  - date: '0631-01-01'
    title_zh: 留学那烂陀五年
    rationale: 戒贤为瑜伽行正统，欲穷《瑜伽师地论》《唯识》等奥义，须长期亲炙
