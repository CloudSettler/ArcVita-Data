  title_zh: 生于河内
  date: '0230'
  year_of: 230
  description: 西晋初年生于河内郡，自幼聪慧，后出家为沙门，研习胡汉典籍
  location: 河内
- id: guji-白法祖-event-study
  title_zh: 精通梵汉游学
  date: '0265'
  year_of: 265
  description: 遍学梵语汉文，尤精胡经，为后世译经奠定语言根基
  location: 洛阳
- id: guji-白法祖-event-first-translation
  title_zh: 洛阳初开译席
  date: 0290
  year_of: 290
  description: 于洛阳设译场，招集笔受，开始译出大乘单译诸经
  location: 洛阳
- id: guji-白法祖-event-translate-xiuxingjing
  title_zh: 译出佛说菩萨修行经
  date: 0295
  year_of: 295
  description: 西晋时译出佛说菩萨修行经一卷，详说菩萨观身四十二事及六度行法，记威施等五百长者发无上道意得柔顺法忍之缘
  location: 洛阳
- id: guji-白法祖-event-circulation
  title_zh: 流通讲说观身法
  date: '0300'
  year_of: 300
  description: 于洛阳讲授流通所译经义，开示在家出家众以观身不净离我执贪著
  location: 洛阳
- id: guji-白法祖-event-preach-intent
  title_zh: 立志弘传大乘
  date: 0292
  year_of: 292
  description: 感佛世难值人身难得，立志以大乘普智为归，不取声闻缘觉小果
  location: 洛阳
- id: guji-白法祖-event-stay-luoyang
  title_zh: 永嘉之乱坚守洛阳
  date: '0304'
  year_of: 304
  description: 八王之乱永嘉将至，众劝南避不从，留守洛阳护持经卷法物
  location: 洛阳
- id: guji-白法祖-event-death
  title_zh: 遇害于洛阳
  date: '0306'
  year_of: 306
  description: 永兴二年洛阳兵乱中遇害殉教，世寿约七十余，译经事业遂终
  location: 洛阳
