    title_zh: 永嘉乱中不避世
    rationale: 法赖人弘，若皆逃散则经卷湮没，宁以身殉道以全法种
  - date: '0300'
    title_zh: 以长者威施为当机广说在家菩萨行
    rationale: 在家长者多财多眷易生贪著，故借威施之问普示出离与布施之要
events:
