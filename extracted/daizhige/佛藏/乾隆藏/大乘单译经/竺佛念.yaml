  dilemmas:
  - 梵汉悬隔而经义深广，如何令华人得闻璎珞法门
  - 战乱流移而群经未备，如何坚守译场以全弘法之志
  lesson: 以通译为弘誓，化言语之碍为度众之桥，令深法流行华夏
  summary_first_person: 吾本凉州沙门，少出家而慕大法，习梵言而从西域三藏，避乱入关，依姚秦译场，竭诚笔受，译菩萨璎珞二十卷，愿以璎珞庄严道树，令众生皆发菩提心。
  source_urls:
  - https://daizhige.org/BFOJING/QIANLONGZANG/DA-CHENG-DAN-YI-JING.html
