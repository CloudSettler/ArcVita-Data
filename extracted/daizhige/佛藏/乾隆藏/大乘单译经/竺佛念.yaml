endeavors:
- id: guji-竺佛念-endeavor-1
  title_zh: 凉州问道与梵汉兼通
  summary_zh: 生于凉州，少习梵汉，游学关陇，精通经论律学，为后入关译经奠定语言与义理根基
  phases:
  - key: brewing
