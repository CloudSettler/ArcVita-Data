  lesson: 以质直信解为本，广译深经而不染名相，令众生于无得中得度
  summary_first_person: 余本凉州沙门，值世乱离，蒙姚秦护法，得与众贤共译十住断结诸经，惟愿以无住之慧断众生结缚，不以文饰求名，不以得失自居。
