    labels:
      zh: 声闻凉土
    start_date: '0365'
    highlight_event_id: guji-竺佛念-event-1
  - key: climax
    name: 应请入关
    labels:
      zh: 赴长安
    start_date: 0384
    highlight_event_id: guji-竺佛念-event-2
  - key: closure
    name: 立足译场
    labels:
      zh: 参佐大译
    start_date: 0386
    highlight_event_id: guji-竺佛念-event-2
  decisions:
  - date: '0365'
    title_zh: 兼学梵汉不专一宗
    rationale: 以边地众经多出西域，若不通梵汉则难辨讹正，故广习三藏以备译业
  - date: 0384
    title_zh: 离凉入关应姚秦之召
    rationale: 凉土虽安而译缘未广，长安为天下枢纽，得与群贤共弘大乘故西行
- id: guji-竺佛念-endeavor-2
  title_zh: 姚秦译场译弘十住断结经
  summary_zh: 在长安与鸠摩罗什等协作，译出十住断结经十四卷，演说十地净行与五十五无等法，确立菩萨次第修学之典据
  phases:
  - key: brewing
    name: 缉集梵本
    labels:
      zh: 访求梵本
    start_date: 0390
    highlight_event_id: guji-竺佛念-event-2
  - key: breakthrough
    name: 开译十住
    labels:
      zh: 首译道引品
    start_date: 0394
    highlight_event_id: guji-竺佛念-event-3
  - key: climax
    name: 十四卷成
    labels:
      zh: 十地具显
    start_date: 0398
    highlight_event_id: guji-竺佛念-event-3
  - key: closure
    name: 流通训导
    labels:
      zh: 训示五十五事
    start_date: '0402'
    highlight_event_id: guji-竺佛念-event-4
  decisions:
  - date: 0394
    title_zh: 以五十五事为入忍土之要
    rationale: 依盛妙世界执志菩萨所受教诫，显忍土修行须离高下毁誉，方合十地净行
  - date: 0398
    title_zh: 存质直译风不加藻饰
    rationale: 十地法门贵在离相，若以华饰乱真则失空观本旨，故守朴实以全经义
