  - title_zh: 梵汉异语如何传信达意
    description: 梵本义幽微汉土语境迥别直译则晦意译则失当如何兼顾信达雅令微细法义晓然可解
  - title_zh: 乱世中依止与译场存续
    description: 五胡乱华凉州长安屡易其主依附何方政权方能保译事不辍又不违沙门清净本怀
  lesson: 译事即佛事必以精通梵汉洞达义理为本以信达为用方能令中阴等微妙之法普被汉地
  summary_first_person: 吾本凉州人少嗜学问好解方言博涉梵汉值前秦后秦崇佛之会遂以舌笔为业助昙摩难提鸠摩罗什诸师会译群经其中中阴经二卷亦系吾所传译愿以此译功令处中阴微形之众生咸得闻法脱苦此生以译经弘法为报佛恩足矣
  source_urls:
