  birth_date: '0340-01-01'
  death_date: '0410-12-31'
  era: 东晋
  reign_ref: 孝武帝太元年间
  archetype: 高僧译师
  dilemmas:
  - 梵汉转译之难：咒语鬼神名号繁多，如何在存其神秘威力与令中土众生可诵可解之间取舍
  - 显密兼弘之择：身为西域三藏，于中土大乘方兴之时，当以密咒护国禳灾为先，抑或以义理开导为要
  lesson: 借佛名咒力以安人心，译经不在文丽而在应病与药，令怖畏者得护念即是方便
  summary_first_person: 吾本西域沙门，负梵笈而来入晋，于舍卫祇园之会，承释迦所说摩尼罗亶之咒，举七佛名号及诸鬼神名，译为晋言，令人持诵则众邪破碎、苦痛得除，愿此经流布中土，护持万民不安与疾病。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘单译经/佛说摩尼罗亶经.md
  - https://cbetaonline.dila.edu.tw/zh/T1393
