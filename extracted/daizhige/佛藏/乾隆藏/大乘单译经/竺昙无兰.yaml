  decisions:
  - date: '0389-01-01'
    title_zh: 许白衣亦得受持咒经
    rationale: 经云比丘尼优婆塞优婆夷皆当说是经，不限僧众，欲令市井山野病人皆得护佑故开白衣持诵
  - date: '0390-01-01'
    title_zh: 以举鬼神名号为对治
    rationale: 诸如深沙浮丘金曼薛荔等鬼各有所主，举名咒之则头破七分，直指病源令持诵者心安而愈
