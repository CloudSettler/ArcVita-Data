  dilemmas:
  - title_zh: 梵音存真与华言易诵之衡
    description: 陀罗尼以音声为功，若全译为华言则失神验，若全存梵音则信众难持，需在音译与意译间求平衡
  - title_zh: 密咒护生与显教正信之辨
    description: 以咒术护持小儿易被目为方术，当如何显明此为佛慈悲护生之方便，而非外道祝祷
  lesson: 以慈悲为本，善巧为用，虽一句真言亦能安众生身心，译经不在文饰繁富而在应机得益
  summary_first_person: 吾本西域沙门，少习三藏，尤精陀罗尼。东来建康，见华地小儿多为惊风痛厄所扰，父母忧惶无措。遂以梵本佛说咒小儿经译为华言，存其咒音曰罗那多罗摩罗提离等，劝令称念七遍，并归命过去七佛与三宝，愿藉佛力令头痛腹痛即愈。唯愿此微言小咒，得护幼弱，安父母心，亦显佛法慈护众生之本怀。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%92%92%E5%B0%8F%E5%84%BF%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%92%92%E5%B0%8F%E5%84%BF%E7%BB%8F.md
