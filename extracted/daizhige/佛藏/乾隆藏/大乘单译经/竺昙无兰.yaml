    title_zh: 应请赴建康译场
    rationale: 见中土扰攘疫疠鬼神之说盛行，欲以咒经为方便安抚万民，故舍西域旧居东来
  - date: '0388-01-01'
    title_zh: 择译摩尼罗亶护国咒经
    rationale: 此经具七佛名号及摄服诸鬼神咒法，最切时弊能治头痛寒热惊怖，故优先译出令人受持
- id: guji-竺昙无兰-endeavor-2
  title_zh: 密咒教法弘传与持诵仪轨奠基
  summary_zh: 阐明持诵摩尼罗亶经可破诸鬼神娆害，确立比丘比丘尼优婆塞优婆夷日常持咒仪轨
