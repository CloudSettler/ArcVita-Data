- id: guji-竺法护-endeavor-1
  title_zh: 西游求法广得梵本
  summary_zh: 八岁出家后精通汉胡经论，为广求大乘方等梵本，遍历西域诸国，携归大量梵夹为后世汉译奠基
  phases:
