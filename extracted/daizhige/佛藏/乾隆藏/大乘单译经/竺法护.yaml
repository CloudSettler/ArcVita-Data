    title_zh: 坚持质朴直译
    rationale: 宁存梵义之真不饰华藻虽文朴而义显令学者得窥本旨后人易于校正
  - date: 0290
    title_zh: 择译四不可得示无常
    rationale: 众生恋常不悟老病死别遂译此经以四不可得破常执劝发解脱道心
