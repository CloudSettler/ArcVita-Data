    start_date: 0269
    highlight_event_id: guji-竺法护-event-return
  decisions:
  - date: '0266'
    title_zh: 辞别敦煌西行求法
    rationale: 慨汉地梵本稀少，深经不广，欲亲往西域访求大乘要典，不辞艰险以续法脉
  - date: 0269
    title_zh: 择长安洛阳为译场
    rationale: 中原为文化辐辏之地，利于招集通梵汉之士，广布翻译，使深法化行四方
- id: guji-竺法护-endeavor-2
  title_zh: 设馆译经弘宣大乘
  summary_zh: 于敦煌长安洛阳设译场三十余年，译出正法华经光赞般若及当来变经等一百五十余部，以深经正句破斥末法五事之乱
  phases:
  - key: brewing
    name: 初立译场
    labels:
      zh: 酿造
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-return
  - key: breakthrough
    name: 译正法华声震洛都
    labels:
      zh: 突破
    start_date: 0286
    highlight_event_id: guji-竺法护-event-lotus
  - key: climax
    name: 译当来变经示末法之变
    labels:
      zh: 高潮
    start_date: 0290
    highlight_event_id: guji-竺法护-event-danglaibian
  - key: closure
    name: 译业圆满化风垂后
    labels:
      zh: 收束
    start_date: 0308
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0286
    title_zh: 先译方等深经而后浅末
    rationale: 深经十二因缘三十七品智度善权为度世纪本，若先弘浅经则令大众陷于名闻浅解，故必以正法华等深典为先
  - date: 0290
    title_zh: 译佛说当来变经以警当来
    rationale: 目睹比丘不护禁戒放逸求名之渐，欲以佛悬记十五乱令法毁灭之诚言，策励学人质朴守真粗衣趣食
