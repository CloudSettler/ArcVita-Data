  decisions:
  - date: '0266'
    title_zh: 决意西行越玉门
    rationale: 中土梵本稀少，欲译大乘必亲往西域求原本，不畏流沙险阻
  - date: 0269
    title_zh: 择洛阳长安为译场
    rationale: 依都会檀越护持，便于聚众出译，令梵汉互证流通
- id: guji-竺法护-endeavor-2
  name_zh: 大规模汉译大乘经典
  description: 在长安敦煌洛阳等地设译场，口出梵言，笔受华言，译出正法华等百五十余部，奠定西晋大乘译业
  phases:
  - key: brewing
    name: 初译小品般若
    labels:
