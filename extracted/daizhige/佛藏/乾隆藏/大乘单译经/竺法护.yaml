person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksha
  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 约231年
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约308年
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 晋武帝至晋怀帝
  archetype: 译经宗师
  dilemmas:
  - 坚守方等深经空无相愿之慧与迎合世俗浅末小经以求名闻供养之诱惑
  - 栖居空闲勤修道业与游走人间愦闹求好衣服五色绮饰之安逸
  - 广求梵本艰辛西行的劳顿与安居敦煌洛邑的安稳之间的取舍
  lesson: 弃绮饰而守质朴，舍杂句而弘深经，护戒摄心修慧，方能令正法久住不灭
  summary_first_person: 吾本月支后裔，家世居敦煌，八岁出家，师事竺高座。少时诵经万言，慨叹梵本未广，遂携徒西行遍历西域诸国，求得方等深经梵夹归来。往来敦煌长安洛阳，立译场度弟子，竭三十余年译正法华光赞等一百五十余部，冀以智度无极善权方便化导当来，虽知末世五事令法毁灭，犹欲以粗衣趣食希言屡中之志，令雅典不坠。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%BD%93%E6%9D%A5%E5%8F%98%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E5%BD%93%E6%9D%A5%E5%8F%98%E7%BB%8F.md
