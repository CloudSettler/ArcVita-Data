person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksa
  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 西晋初约太康前生于敦煌
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约永嘉二年示寂
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 晋武帝至晋惠帝
  archetype: 译经高僧
  dilemmas:
  - 西域安居精修与冒艰东归广利众生之抉择
  - 梵本直译存真与随俗易解利学之权衡
  - 隐遁自保乱世与坚持留洛译场弘法之取舍
  lesson: 通晓众语而后能传法，立志在久远弘化不在一时安逸，译经当以信达济众为本
  summary_first_person: 吾姓竺讳法护，本名昙摩罗刹，月氏之后家于敦煌，八岁出家从师游历西域，遍学三十六国语言文字，携大乘梵本数万偈东归，于长安洛阳设译场，口授笔受译出一百五十余部，冀以汉文显大乘定意，使众生得普智心，虽逢八王之乱不辍译事，愿法轮常转
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%B8%89%E6%98%A7%E5%BC%98%E9%81%93%E5%B9%BF%E6%98%BE%E5%AE%9A%E6%84%8F%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%B8%89%E6%98%A7%E5%BC%98%E9%81%93%E5%B9%BF%E6%98%BE%E5%AE%9A%E6%84%8F%E7%BB%8F.html
endeavors:
- id: guji-竺法护-endeavor-1
  name_zh: 西域求法携归梵本
  description: 自敦煌西行遍历西域三十六国，师事高僧学习胡汉梵语，求得大乘方等梵本携归中土，为后译经奠定文本之基
  phases:
  - key: brewing
    name: 少年出家初学胡语
    labels:
      zh: 敦煌诵习
    start_date: 0239
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 西行遍游得遇梵本
    labels:
      zh: 西域得本
    start_date: '0265'
    highlight_event_id: guji-竺法护-event-western-search
  - key: climax
    name: 携经东归历经艰阻
    labels:
      zh: 负经东归
    start_date: 0269
    highlight_event_id: guji-竺法护-event-return-dunhuang
  - key: closure
    name: 归洛整理梵本目录
    labels:
      zh: 归洛整理
    start_date: '0272'
    highlight_event_id: guji-竺法护-event-return-dunhuang
  decisions:
  - date: '0265'
    title_zh: 决意辞师远游西域三十六国
    rationale: 中土梵本稀少义多讹略，欲得正法必须亲赴西域求原本以广见闻
  - date: 0269
    title_zh: 决定不留居西域而负梵本东归
    rationale: 念中土众生未闻大乘深法，虽西域安稳亦当冒艰东返使法流东土
- id: guji-竺法护-endeavor-2
  name_zh: 长安洛阳译场弘法
  description: 于长安洛阳敦煌设译场，组织口授笔受团队，译出三昧弘道广显定意经等一百五十余部，奠定西晋大乘译经规模
  phases:
  - key: brewing
    name: 初设译场试译小品
    labels:
      zh: 初开译场
    start_date: '0273'
    highlight_event_id: guji-竺法护-event-changan-start
  - key: breakthrough
    name: 太康年间译三昧弘道广显定意经
    labels:
      zh: 译三昧经
    start_date: 0286
    highlight_event_id: guji-竺法护-event-translate-sanmei
  - key: climax
    name: 广译大乘高峰
    labels:
      zh: 广译大乘
    start_date: 0290
    highlight_event_id: guji-竺法护-event-peak
  - key: closure
    name: 乱世授徒付法
    labels:
      zh: 授徒传灯
    start_date: '0304'
    highlight_event_id: guji-竺法护-event-peak
  decisions:
  - date: 0286
    title_zh: 采用胡汉对译口授笔受协作译三昧弘道广显定意经
    rationale: 梵汉悬隔一人难兼，集聂承远等执笔助译以存梵义而便汉诵
  - date: 0290
    title_zh: 坚持在大乘经中直显定意普智而不过度简化
    rationale: 欲使菩萨得入金刚定意，需具载三十五事广普智树等要行，不可为俗易而失深旨
