    rationale: 长安为西晋都会众僧辐辏梵本可广流通遂以敦煌长安为往来译场便于弘化
- id: guji-竺法护-endeavor-2
  title_zh: 朴译大乘广弘正法
  summary: 开西晋译场译出正法华光赞般若等一百五十余部以质朴直译存梵义弘大乘于中土四不可得经即其单译之一
