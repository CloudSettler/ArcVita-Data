  - 梵本艰深当直译存真抑或义译便中土初学
  - 西域道远战乱当安居敦煌译旧经抑或涉险西行求新梵本
  lesson: 以诚信忍辱为本广译大乘令深法遍行中土则功德自然庄严
  summary_first_person: 吾家本月氏世居敦煌八岁出家随师诵习西域梵典后遍历西域诸国得大乘梵本百余部归而译于长安洛阳敦煌之间三十余年译经百五十余部但愿以此令中土众生得闻菩萨行愿世世积德终成佛道
  source_urls:
