    title_zh: 以胡汉兼通知训译正法华
    rationale: 直译难晓义译易失真乃与义学沙门共参校以质直通俗之言传般若深旨
  - date: 0290
    title_zh: 译佛说菩萨行五十缘身经明因果庄严
    rationale: 中土但见佛相好庄严不知菩萨世世施予忍辱然灯治道等五十行所感故当译出以劝发菩提心
