person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksha
  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 约魏景元二年敦煌
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 西晋永嘉二年
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 西晋武帝太始至惠帝永嘉
  archetype: 译经弘法者
  dilemmas:
  - 西域梵本携来艰难与中土渴求大乘深法之间的供需之困
  - 直译存梵语真质与意译令中土易解之间的取舍之难
  - 战乱流离中坚持译场不辍与保存经本法脉之间的存亡之择
  lesson: 负笈西行求法不辞险远，归而精勤译述以智灯破冥，知弘法在精进不懈与善巧权便并行
  summary_first_person: 吾竺法护本月氏裔家于敦煌，八岁出家事竺高座为师，诵经日万言。慨中土大乘典缺，遂誓西行历三十六国广得梵本，归于长安洛阳设馆译经百五十四部，此《佛说海龙王经》亦吾于西晋时所译，愿以法施普润众生，令皆发无上道意而入法海
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘单译经/佛说海龙王经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘单译经/佛说海龙王经.html
  - https://cbetaonline.dila.edu.tw/zh/T0598
