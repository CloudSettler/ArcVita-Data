    rationale: 中土梵本阙如不入虎穴不得真经宁冒艰险以求大乘全本
  - date: '0266'
    title_zh: 定居长安洛阳为译场
    rationale: 长安为西域孔道众胡商旅辐辏便于校梵证义亦便于经教广布
- id: guji-竺法护-endeavor-2
  title_zh: 译传大乘经典五十余载
  summary_zh: 于长安敦煌洛阳等地设译场译出正法华经等一百五十余部含佛说菩萨行五十缘身经弘阐菩萨世世行善感佛相好之因缘
  phases:
