  - 梵本阙少欲求真义须远涉西域与安居汉地广利众生之衡
  - 直译存梵义致文朴质与润色易读以广流通之抉择
  - 潜隐山林专修与立译场入世弘化之进退
  lesson: 负经西来朴译不饰以信为本令大乘广布中土
  summary_first_person: 吾本月支后裔家于敦煌八岁出家师事竺高座诵经日万言慨中土梵本未广遂杖策西行遍历西域得大乘梵夹百余挟归长安洛阳设译场一生译经百五十余部不求荣达唯以弘法为务所译四不可得等经直陈老病死别之不可得劝人解脱无常
