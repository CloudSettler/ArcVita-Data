  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉
  archetype: 译经僧
  dilemmas:
  - 西行求法艰险与中土弘化迫切间的取舍
  - 执相精进易堕魔事与平等无所得精进间的抉择
  lesson: 诸见皆空，不坏假名；以无所得平等精进摄众，魔事即是佛事
  summary_first_person: 余本敦煌竺氏，八岁出家，志在游方求梵本以广译大乘。携胡本往来西域三十六国，得百余部，归而敷译于长安洛阳。一生所译百五十余部，不敢计身精进，但以无所得平等为进；若有所得即堕魔网，无所得乃见如来。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E9%AD%94%E9%80%86%E7%BB%8F.md
