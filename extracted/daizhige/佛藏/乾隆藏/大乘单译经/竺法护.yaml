    labels:
      zh: 魔逆 climax
    start_date: '0303'
    highlight_event_id: guji-竺法护-event-moni
  - key: closure
    name: 授徒立教泽被后学
    labels:
      zh: 授徒流通
    start_date: '0305'
    highlight_event_id: guji-竺法护-event-disciples
  decisions:
  - date: 0286
    title_zh: 定以质直译风为主
    rationale: 宁存梵质不尚华藻，使中土初闻大乘深义不失本旨
  - date: '0303'
    title_zh: 译出魔逆经破魔相
    rationale: 借文殊与魔波旬对辩，显平等精进无所得，破著相精进之魔事
events:
- id: guji-竺法护-event-birth
  title_zh: 生于敦煌竺氏
  date: '0231'
  year_of: '0231'
  description: 月支后裔家世居敦煌，八岁出家从师竺高座，诵经日万言
- id: guji-竺法护-event-study
  title_zh: 师事竺高座通梵汉
  date: 0239
  year_of: 0239
  description: 八岁出家，事外国沙门竺高座为师，博通梵汉经典
- id: guji-竺法护-event-westward
  title_zh: 西行历西域三十六国求梵本
  date: '0266'
  year_of: '0266'
  description: 晋泰始二年起携徒西行，遍历西域诸国，搜得大乘梵本百余部
- id: guji-竺法护-event-return
  title_zh: 负梵本归洛阳
  date: 0269
  year_of: 0269
  description: 负大乘梵本东归，驻锡洛阳长安，募集檀越立译场
- id: guji-竺法护-event-lotus
  title_zh: 于长安译正法华经
  date: 0286
  year_of: 0286
  description: 太康七年于长安译出正法华经十卷，首译完整法华，名震中土
- id: guji-竺法护-event-moni
  title_zh: 译佛说魔逆经
  date: '0303'
  year_of: '0303'
  description: 于洛阳译出佛说魔逆经一卷，文殊与天子大光论平等精进及二十魔事，魔波旬化作佛形说平等三昧
- id: guji-竺法护-event-disciples
  title_zh: 授徒竺法友等广传译业
  date: '0305'
  year_of: '0305'
  description: 门下竺法友竺法乘等从学，分掌传译抄校，使译业不绝
- id: guji-竺法护-event-death
  title_zh: 示寂于渑池
  date: 0308
  year_of: 0308
  description: 永嘉二年值永嘉之乱避难东行，示寂于渑池，年七十八，世称敦煌菩萨
