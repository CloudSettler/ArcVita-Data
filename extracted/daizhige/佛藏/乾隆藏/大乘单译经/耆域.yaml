  lesson: 医身不忘医心，以七物供养洗浴众僧除七病得七福，布施即是自净，福报如影响随行
  summary_first_person: 吾乃王舍城奈女之子名曰耆域，少小好学才艺过通智达五经天文地理，以医治众病莫不除愈而为医王八国宗仰，夜念请佛及众僧菩萨入温室澡浴愿众生长夜清净，晨诣因沙崛山精舍蒙佛说七物七病七福之法，遂严办洗具供养闻法欢喜得须陀洹道
