  title_zh: 生于中天竺婆罗门族
  description_zh: 约唐显庆年间生于中天竺，少出家习大乘兼通声明密咒
  year_of: '0660'
- id: guji-般刺蜜帝-event-arrive-guangzhou
  date: '0701'
  precision: year
  is_circa: true
  title_zh: 负梵本抵广州
  description_zh: 剖膊藏大佛顶首楞严梵本，航海至广州，受请住制止寺
  year_of: '0701'
- id: guji-般刺蜜帝-event-translation-start
  date: '0704-08-01'
  precision: day
  is_circa: true
  title_zh: 制止寺开译楞严
  description_zh: 唐中宗神龙元年，请乌长国沙门弥伽释迦译语，前宰相房融笔授，开译十卷
  year_of: '0704'
- id: guji-般刺蜜帝-event-translation-complete
  date: '0705-05-01'
  precision: month
  is_circa: true
  title_zh: 十卷译毕进呈
  description_zh: 译成大佛顶如来密因修证了义诸菩萨万行首楞严经十卷，陈于译场，后录入乾隆藏大乘单译经
  year_of: '0705'
- id: guji-般刺蜜帝-event-return-india
