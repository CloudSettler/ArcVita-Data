endeavors:
- id: guji-般刺蜜帝-endeavor-1
  title_zh: 首楞严密因十卷译传事业
  goal_zh: 于广州制止寺译出大佛顶首楞严经，立奢摩他、三摩、禅那渐次以显如来密因
  phases:
