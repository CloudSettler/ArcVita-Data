  dilemmas:
  - 梵本密藏禁传与汉地渴求正法之两难
  - 密咒仪轨的不可译性与显教义理可说性之衡平
  - 王朝政局更迭中译场存续与人身安全之抉择
  lesson: 以直心为道场，不以文字执密义，借译传令迷者返照自性
  summary_first_person: 吾乃天竺沙门般刺蜜帝，怀首楞严密因而来支那。见此土众生多闻未证、认影为心，不忍密藏久滞西土，遂于广州制止寺举译十卷。愿以佛顶光明破客尘之惑，令见性不假外求。
