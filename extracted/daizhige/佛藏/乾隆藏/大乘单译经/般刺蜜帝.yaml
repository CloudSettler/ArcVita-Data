    start_date: '0704'
    highlight_event_id: guji-般刺蜜帝-event-translation-start
  - key: climax
    name: 十卷告成献阙
    labels:
      zh: 进呈朝廷
    start_date: '0705-05-01'
    highlight_event_id: guji-般刺蜜帝-event-translation-complete
  - key: closure
    name: 校勘流通
    labels:
      zh: 笔授分流
    start_date: '0706'
    highlight_event_id: guji-般刺蜜帝-event-translation-complete
  decisions:
  - date: '0701'
    title_zh: 剖臂藏经潜渡南海
    rationale: 天竺视楞严为国宝禁外传，为令汉土得闻了义，割体藏梵本以避边检
  - date: '0704-08-01'
    title_zh: 邀乌长国弥伽释迦译语、房融笔授
    rationale: 梵汉悬隔，以译语通音义、以宰相笔授润汉文，确保密咒不讹而义理畅达
  - date: '0705-05-01'
    title_zh: 译毕即遣归天竺以谢国禁
    rationale: 既成译事，愿自承担禁传之责，护译本留支那而身归受谴
- id: guji-般刺蜜帝-endeavor-2
  title_zh: 密显会通与禅观弘传
  goal_zh: 以大佛顶咒心破淫术、以七处征心显真心，令多闻者转入实修
  phases:
  - key: brewing
    name: 观机立教
    labels:
      zh: 审机
    start_date: '0704'
    highlight_event_id: guji-般刺蜜帝-event-translation-start
  - key: breakthrough
    name: 咒心摄护示现
    labels:
      zh: 显密并举
    start_date: '0705'
    highlight_event_id: guji-般刺蜜帝-event-translation-complete
  - key: climax
    name: 七处征心开示
    labels:
      zh: 破妄显真
    start_date: '0705-06-01'
    highlight_event_id: guji-般刺蜜帝-event-translation-complete
  - key: closure
    name: 嘱累流通
    labels:
      zh: 付法后世
    start_date: '0707'
    highlight_event_id: guji-般刺蜜帝-event-return-india
  decisions:
  - date: '0705'
    title_zh: 以神咒卷首破阿难摩登伽难为经眼
    rationale: 借阿难堕术现众生攀缘之危，显佛顶咒力与自性定力本一，摄信显密不二
  - date: '0705-06-01'
    title_zh: 立二种根本与客尘譬喻次第
    rationale: 直指攀缘心非真、识精元明为菩提根，令学者舍煮沙之功、归直心之道
events:
