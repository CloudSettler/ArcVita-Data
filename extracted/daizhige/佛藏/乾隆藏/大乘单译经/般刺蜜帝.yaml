  precision: year
  is_circa: true
  title_zh: 辞众归天竺
  description_zh: 译事既竣，为全国禁，自请归国以当其责，梵本与译本留支那流通
  year_of: '0706'
- id: guji-般刺蜜帝-event-death
  date: '0715'
  precision: year
  is_circa: true
  title_zh: 示寂于天竺
  description_zh: 归国后于天竺示寂，后世以首楞严译主奉祀，唐宋诸师赖其译本开如来密因之教
  year_of: '0715'
