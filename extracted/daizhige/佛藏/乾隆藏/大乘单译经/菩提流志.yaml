  title_zh: 生于南天竺婆罗门家
  date: '0562'
  year_of: 562
  description: 南印度婆罗门种，少通外典及声明悉昙，后出家通三藏，为西行求法译师
  location_zh: 南天竺
- id: guji-菩提流志-event-arrival
  title_zh: 证圣元年抵洛阳奉诏入译
  date: 0693
  year_of: 693
  description: 武则天闻其高行，诏迎至洛阳佛授记寺，参与译经，与实叉难陀等同场
  location_zh: 洛阳佛授记寺
- id: guji-菩提流志-event-dabaoji
  title_zh: 神龙二年起主译大宝积经
  date: '0706'
  year_of: 706
  description: 唐中宗诏令菩提流志为译主，合旧新译共一百二十卷，历时数载为其一生最大译业
  location_zh: 长安崇福寺及洛阳
- id: guji-菩提流志-event-yizi
  title_zh: 奉诏译一字佛顶轮王经六卷
