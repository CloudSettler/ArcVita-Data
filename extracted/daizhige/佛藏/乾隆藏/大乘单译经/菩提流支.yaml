person:
  qid: guji-菩提流支
  name_zh: 菩提流支
  names:
    zh: 菩提流支
    en: Bodhiruci
  lifespan:
    birth:
      date: '0470-01-01'
      precision: year
      is_circa: true
      raw: 约公元470年前后，北天竺
    death:
      date: '0535-12-31'
      precision: year
      is_circa: true
      raw: 约北魏末年卒于洛阳，约535年
  birth_date: '0470'
  death_date: '0535'
  era: 北魏
  reign_ref: 北魏宣武帝至孝明帝
  archetype: 译经弘法者
  dilemmas:
  - 梵本义蕴深广，汉文如何既存真义又令中土易解易持
  - 众经并陈，先译何典才能契合中土忏悔行与地论熏习之需
  - 朝廷护持与部派诤论之间，如何守译场清净不涉党争
  lesson: 译经即弘法，以名号摄受众生，以论释开通地行，不求自宗而法流自远
  summary_first_person: 吾本北天竺僧，涉流沙而东入洛阳，依宣武、孝明二帝译场，于永宁、华林间译十地、般若、佛名等凡三十余部，一愿众生称佛名而灭诸罪，二愿学者依地论而入华严行愿，纵老死洛邑，此愿不移。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%BD%9B%E5%90%8D%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%BD%9B%E5%90%8D%E7%BB%8F.html
endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 北魏洛阳大乘经论翻译
  title_en: Translation of Mahayana Sutras in Luoyang
  description: 于北魏洛阳译场主持翻译，转梵为汉，译出佛说佛名经十二卷、十地经论、金刚般若经等三十余部，为中土礼忏、般若、地论诸学提供根本典籍
  phases:
  - key: brewing
    name: 初至洛阳立译场
