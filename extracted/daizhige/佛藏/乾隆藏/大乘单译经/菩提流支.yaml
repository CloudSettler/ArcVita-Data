person:
  qid: guji-菩提流支
  name_zh: 菩提流支
  names:
    zh: 菩提流支
    en: Bodhiruci
  lifespan:
    birth:
      date: 0480
      precision: year
      is_circa: true
      raw: 约480年
    death:
      date: '0535'
      precision: year
      is_circa: true
      raw: 约535年
  birth_date: 0480
  death_date: '0535'
  era: 北魏
  reign_ref: 北魏宣武帝永平至孝明帝正光年间
  archetype: 译经师
  dilemmas:
  - 如何在中土空宗盛行之时，如实传译如来藏不增不减之甚深义而不落增减二见
  - 如何跨越梵汉语言与文化隔阂，使不思议法身常恒不变之教义被中土僧众准确理解
  lesson: 众生界即如来藏即法身，不增不减，离增减二见方能安住正道
  summary_first_person: 我是天竺菩提流支，自南印度而来，永平初年入洛阳译经。我深知一法界即众生界即如来藏即法身，不离不脱，于恒沙烦恼缠中说清净自性。我译出不增不减经等论典，欲令众生离断常增减诸邪执，信如来藏本际清净、未来平等恒有之实相，归于常恒清凉不变之法身。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B8%8D%E5%A2%9E%E4%B8%8D%E5%87%8F%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E4%B8%8D%E5%A2%9E%E4%B8%8D%E5%87%8F%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0668
endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 译传如来藏系经典阐明不增不减法身义
  description: 于北魏洛阳译场系统译出佛说不增不减经等经论，以法身即众生界的同界异名义破除增减二见，确立如来藏本际清净与未来平等恒有之教理
  phases:
  - key: brewing
    name: 入洛筹备
    labels:
      zh: 初入译场
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 首译破难
    labels:
      zh: 梵汉对勘
    start_date: '0511'
    highlight_event_id: guji-菩提流支-event-translate-buzengbujiao
  - key: climax
    name: 法身正说
    labels:
      zh: 定译定旨
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-translate-buzengbujiao
  - key: closure
    name: 流通付嘱
    labels:
      zh: 付嘱奉行
    start_date: '0520'
    highlight_event_id: guji-菩提流支-event-teaching
  decisions:
  - date: '0511'
    title_zh: 择译不增不减经以破增减邪见
    rationale: 见中土多起众生界增减之执，依甚深第一义谛抉择此经为先，欲以众生界即如来藏即法身之正说息断灭与常见
  - date: '0515'
    title_zh: 以灯与摩尼宝珠为喻定译法身不离不脱义
    rationale: 为令中土学者直观不离不脱不断不异之法身，保留经中灯明色触不离、宝珠明色不离之喻，显过于恒沙佛法不离法身
- id: guji-菩提流支-endeavor-2
  title_zh: 洛阳译场弘法与地论宗学统奠基
  description: 依托北魏皇室与菩提流支译场，译出十地经论、入楞伽经等，广开地论法席，培养人才，奠定北地大乘如来藏与唯识兼弘之风
  phases:
  - key: brewing
    name: 栖止洛阳
    labels:
      zh: 安住嵩洛
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 译场规模化
    labels:
      zh: 召集译众
    start_date: '0512'
    highlight_event_id: guji-菩提流支-event-founding-translation
  - key: climax
    name: 地论讲传
    labels:
      zh: 开席授徒
    start_date: '0525'
    highlight_event_id: guji-菩提流支-event-teaching
  - key: closure
    name: 学派分流
    labels:
      zh: 南北分宗
    start_date: '0532'
    highlight_event_id: guji-菩提流支-event-teaching
  decisions:
  - date: '0512'
    title_zh: 采用梵汉对译口授笔受制度
    rationale: 为保证大乘经论义理不失，设立译主、证义、笔受、缀文分工，确保不增不减等甚深经义准确可信
  - date: '0525'
    title_zh: 以十地经论会通如来藏与修行阶位
    rationale: 恐学者执如来藏为自然外道，遂以菩萨十波罗蜜八万四千法门之行显即此法身修菩提行名为菩萨，打通理与行
events:
- id: guji-菩提流支-event-birth
  title_zh: 出生于南天竺婆罗门家
  date: 0480
  year_of: 0480
  location_zh: 天竺南印度
  description: 约480年生于南天竺婆罗门种姓，精通三藏与声明因明，后出家学大乘
- id: guji-菩提流支-event-arrival
  title_zh: 永平初年至北魏洛阳
  date: 0508
  year_of: 0508
  location_zh: 洛阳
  description: 北魏宣武帝永平元年抵达洛阳，得帝室敬礼，入宫廷译场，开始大规模梵汉翻译事业
- id: guji-菩提流支-event-translate-buzengbujiao
  title_zh: 译出佛说不增不减经
  date: '0515'
  year_of: 333
  location_zh: 洛阳嵩山译场
  description: 译出佛说不增不减经一卷，宣说甚深义即第一义谛即众生界即如来藏即法身，破众生界增减二种大邪见，明法身常恒清凉不变、过于恒沙功德不离不脱
- id: guji-菩提流支-event-founding-translation
  title_zh: 译出入楞伽经及十地经论
  date: '0520'
  year_of: 336
  location_zh: 洛阳
  description: 相继译出入楞伽经、十地经论、金刚般若等三十余部，奠定地论宗与如来藏学在中土的经典依据
- id: guji-菩提流支-event-teaching
  title_zh: 于洛阳开讲如来藏法身义
  date: 0528
  year_of: 0528
  location_zh: 洛阳永宁寺
  description: 依不增不减经所显即此法身缠为众生、修行为菩萨、离垢为如来之理，开众讲席，教化学人离增减二见住正道中
- id: guji-菩提流支-event-death
  title_zh: 示寂于洛阳
  date: '0535'
  year_of: 349
  location_zh: 洛阳
  description: 约535年示寂于洛阳，译业与讲席由弟子相承，其所译如来藏经典于北地广为流通
