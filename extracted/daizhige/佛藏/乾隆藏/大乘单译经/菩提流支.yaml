    start_date: '0508-01-01'
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 译十地经论奠基
    labels:
      zh: 突破
    start_date: '0508-06-01'
    highlight_event_id: guji-菩提流支-event-shidi
  - key: climax
    name: 译佛说佛名经广弘佛名忏法
    labels:
      zh: 高峰
    start_date: '0520-01-01'
    highlight_event_id: guji-菩提流支-event-foming
  - key: closure
    name: 译业圆满付嘱流通
    labels:
      zh: 收束
    start_date: '0530-01-01'
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: '0508-01-01'
    title_zh: 应北魏宣武帝请入洛主持译场
    rationale: 不辞远涉以应中土求法之请，藉朝廷护持建立稳定译场，聚梵汉才俊共成译事
  - date: '0520-01-01'
    title_zh: 择译佛说佛名经十二卷以助忏悔行
    rationale: 见中土重忏悔灭罪，佛名具现世安隐、灭障证菩提之功，故择此经令众生受持读诵易得利益
- id: guji-菩提流支-endeavor-2
  title_zh: 地论义学与禅观传弘
  title_en: Propagation of Dashabhumi Exegesis and Meditation
  description: 以世亲十地经论为核心讲传华严地行次第，兼授禅法，培养勒那摩提等地论学人，开启中土华严与地论南北道之先声
  phases:
  - key: brewing
    name: 授受地论发端
    labels:
      zh: 酝酿
    start_date: '0508-06-01'
    highlight_event_id: guji-菩提流支-event-shidi
  - key: breakthrough
    name: 讲传十地开地论宗风
    labels:
      zh: 突破
    start_date: '0512-01-01'
    highlight_event_id: guji-菩提流支-event-teach
  - key: climax
    name: 融通禅教广度学众
    labels:
      zh: 高峰
    start_date: '0522-01-01'
    highlight_event_id: guji-菩提流支-event-teach
  - key: closure
    name: 付法学人延续宗绪
    labels:
      zh: 收束
    start_date: '0534-01-01'
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: '0512-01-01'
    title_zh: 以十地经论为纲开讲地行次第
    rationale: 华严广大难入，以十地分阶示菩萨行位，使学者循地渐进，易于修证
  - date: '0522-01-01'
    title_zh: 兼弘禅观不立门户之见
    rationale: 论解需行证，教以禅观相济，破部派门户，令解行并进
