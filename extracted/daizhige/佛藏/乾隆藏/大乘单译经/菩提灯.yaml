  archetype: 译经弘法僧
  dilemmas:
  - 如何在忠于梵本与契合末世钝根之间立方便而不失甚深法义
  - 木轮相法易被误作世间卜筮吉凶当如何善加拣别以护圣道
  - 面对众生疑悔障重当先以事相忏法令得清净抑或直示无生实观
  lesson: 末世众生福薄障重当以善巧方便先令离疑得净信再入实相无生之观方便即是慈悲
  summary_first_person: 吾本外国沙门来游隋土承坚净信菩萨之请与地藏菩萨本愿相应遂译出占察善恶业报经二卷立木轮三相令末世未得决定信者可自占宿世善恶集业久近及三世受报又示至心忏悔令三业清净方堪修禅定智慧愿一切众生藉此轮相破邪见网入坚固信
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E5%8D%A0%E5%AF%9F%E5%96%84%E6%81%B6%E4%B8%9A%E6%8A%A5%E7%BB%8F.html
