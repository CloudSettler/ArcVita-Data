  decisions:
  - date: '0594-03-15'
    title_zh: 应坚净信请以地藏菩萨为说主
    rationale: 佛意令地藏菩萨开方便以其久化五浊偏厚能速满众生所求灭重罪除障碍故不自说而请地藏演说
  - date: '0594-08-10'
    title_zh: 立木轮三相为占察方便
    rationale: 为令未得决定信不能勤观无常无我四谛十二因缘者得以事相决疑不堕世间卜筮邪见故刻木为轮分十轮三轮六轮三类
  - date: '0595-04-20'
    title_zh: 定二卷结构分事理二门
    rationale: 上卷广明事相占察与礼忏供养下卷直显一实境界唯心实观使钝根由事入理利根直了心源
- id: guji-菩提灯-endeavor-2
  title_zh: 弘扬忏悔清净与一实境界观行
  description: 示至心二种与三品差别劝令住静处礼过去七佛五十三佛称地藏名号修忏千日以第二轮相验清净后方入禅定智慧
  phases:
  - key: brewing
    name: 开示末世障碍与出要因缘
    labels:
      zh: 酝酿
    start_date: '0595-01-01'
    highlight_event_id: guji-菩提灯-event-translate-complete
  - key: breakthrough
    name: 制礼忏仪轨与至心甄别
    labels:
      zh: 突破
    start_date: '0596-01-01'
    highlight_event_id: guji-菩提灯-event-preach-repentance
  - key: climax
    name: 三业清净相与授戒得戒
    labels:
      zh: 高潮
    start_date: '0597-03-01'
    highlight_event_id: guji-菩提灯-event-preach-repentance
  - key: closure
    name: 示一实境界二种观道
    labels:
      zh: 收束
    start_date: '0598-06-01'
    highlight_event_id: guji-菩提灯-event-preach-one-reality
  decisions:
  - date: '0596-02-10'
    title_zh: 先观宿世恶业轻重方许修禅慧
    rationale: 若宿习猛利犯重禁者不先忏悔而修禅定智慧多生障碍或失心错乱或受邪法故必令以轮相自验
  - date: '0596-09-15'
    title_zh: 制定七日至千日忏期与三掷验相
    rationale: 随根利钝业厚薄分七日二七乃至千日以第二轮三掷皆纯善为清净标志并防见光闻香等虚妄相
  - date: '0597-05-01'
    title_zh: 开无师自誓受戒方便
    rationale: 末世难得善好戒师与清净僧众故许至心得三业善相者于佛像前自誓受菩萨三聚净戒及比丘戒以续僧命
