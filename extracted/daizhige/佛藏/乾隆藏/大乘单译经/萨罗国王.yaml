  - 耽乐盛饰贪浊色欲与无常生死苦的觉醒之间如何抉择
  - 积敛财宝恣心无厌与布施无吝少欲离嗔的清净行之间如何取舍
  - 沉迷声色自谓天下无双与信受经戒敬事善知识求解脱之间如何转向
