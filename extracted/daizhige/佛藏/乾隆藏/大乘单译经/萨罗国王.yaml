  summary_first_person: 吾昔治萨罗大国土地广博楼阁浴池莲华凫雁妓乐自娱自谓天下无双不解无常生死之苦世尊自舍卫祇园现神光感动天地持地神告王我等乃率后宫臣民出城礼佛闻佛教以布施少欲信戒敬师四事离罪即于宫中设百味供养散千万价衣化成七宝华盖闻不退转法喜发道意蒙授记当来作慧光如来愿与万众俱成正觉
  source_urls:
