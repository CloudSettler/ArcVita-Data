  date: -0545-06-01
  year_of: -0545-06-01
  location: 萨罗国王殿前及城外
  description: 世尊于舍卫祇园放光明感动八方帝释梵天献盖随从地生莲华枯树更生王与大臣中宫太子国民见瑞持地神叹佛功德遂皆出城礼佛绕三匝陈说沉迷声色之过
- id: guji-萨罗国王-event-preach
  title_zh: 佛说贪欲苦及四事清净法
  date: -0545-06-02
  year_of: -0545-06-02
  location: 萨罗国城外佛所
  description: 佛诫王贪浊色欲恣心无厌致泥犁畜生饥渴烧炙皆坐无厌如梦已寤王长跪问方便佛授四事一施与无惜二少欲割嗔三信受经戒不犯四敬慎法师善知识
- id: guji-萨罗国王-event-offering
  title_zh: 迎佛入宫设供散衣化华盖闻不退转
  date: -0545-06-03
  year_of: -0545-06-03
  location: 萨罗王宫师子座前
  description: 王敕庄严宫室扫洒街里作百味食迎佛入城佛踏门阃盲聋完具乐器自鸣宫室化琉璃王手自斟酌澡水讫佛转不退转法轮王以千万价衣奉佛衣悬空化七宝华盖垂珠光明照十方万余人发无上道意八百天神得法忍五千菩萨不退转
- id: guji-萨罗国王-event-prophecy
  title_zh: 蒙授记当来为慧光如来
  date: -0545-06-03
  year_of: -0545-06-03
  location: 萨罗王宫
  description: 佛告阿难王已供事五百余佛等行慈哀惠施财宝当来劫当得作佛号慧光如来至真平等正觉国中人民及夫人承福悉当得佛王闻授决踊身空中百四十丈叹佛功德八千国人发菩萨心
- id: guji-萨罗国王-event-death
  title_zh: 寿终生天趣向佛果
  date: -0520-01-01
  year_of: -0520-01-01
  location: 萨罗国
  description: 如经所言兴立德本寿终已后皆生天上承授记福趣向慧光佛果
