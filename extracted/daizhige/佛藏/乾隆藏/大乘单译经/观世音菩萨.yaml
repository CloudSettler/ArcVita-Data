  - key: closure
    name: 七宝树下继成正觉
    labels:
      zh: 继成正觉
    start_date: '9999-01-01'
    highlight_event_id: guji-观世音菩萨-event-succession
  decisions:
  - date: -0499-01-01
    title_zh: 请往娑婆礼释迦听珍宝三昧
    rationale: 闻释迦放光将说菩萨珍宝处经欲令善根众生得三昧发愿生安乐故
  - date: '9999-01-01'
    title_zh: 阿弥陀涅槃后中夜成佛摄众
    rationale: 承正法住世度众本愿令宝物行树常演法音与佛无异故
events:
- id: guji-观世音菩萨-event-birth
  title_zh: 宝意童子莲华化生
  date: -5000-01-01
  year_of: -5000
  description: 威德王入三昧时左右有莲华踊出宝意童子跏趺其中与王同诣金光师子游戏佛所
- id: guji-观世音菩萨-event-vow
  title_zh: 金光佛前弘誓初发菩提心
  date: -5000-01-01
  year_of: -5000
  description: 与宝上童子同声说偈誓为一众生历无量劫行道愿得超胜清净佛土时大千震动天雨末香
- id: guji-观世音菩萨-event-come
  title_zh: 化宝台至娑婆供养释迦
  date: -0499-01-01
  year_of: -499
  description: 与得大势及八千亿众化四十亿宝台屈伸臂顷至鹿苑问讯释迦分身遍东方恒河沙等佛前庄严供养
- id: guji-观世音菩萨-event-succession
  title_zh: 未来树下成普光功德山王佛
  date: '9999-01-01'
  year_of: 9999
  description: 阿弥陀涅槃正法灭后过中夜分于七宝菩提树下成等正觉国号众宝普集庄严纯菩萨无声闻缘觉名
- id: guji-观世音菩萨-event-death
  title_zh: 普光功德山王示现涅槃
  date: '9999-12-31'
  year_of: 9999
  description: 随寿命住世亲近供养得大势后般涅槃奉持正法乃至灭尽即由得大势继成善住功德宝王如来
