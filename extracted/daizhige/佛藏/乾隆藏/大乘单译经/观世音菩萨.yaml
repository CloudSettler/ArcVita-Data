    title_zh: 舍华香供养以菩提心为供
    rationale: 闻佛说慈心回向菩提福最胜故发广济群生愿不求声闻缘觉
  - date: -5000-01-01
    title_zh: 立为一众生历无量劫行道誓
    rationale: 怜愍度脱一切众生愿得超胜清净佛土纯菩萨众故
- id: guji-观世音菩萨-endeavor-2
  title_zh: 辅阿弥陀游娑婆继成普光佛
  description: 住安乐世界辅阿弥陀佛以神通化宝台诣娑婆供养释迦分身遍恒沙佛刹未来中夜于七宝树下成普光功德山王如来
  phases:
