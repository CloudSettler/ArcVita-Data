  summary_first_person: 吾名跋陀师利，本为洴沙国王夫人，于摩竭提清净法坐都大会中叉手白佛，愿闻十方佛名菩萨及刹土，复问何行离母人身，蒙佛开示一至十事之行，踊跃欢喜头面礼佛，愿奉行不懈与六万优婆夷同发无上菩提心
