    rationale: 欲以正信为本，如语如作，离谀谄而契菩提正道
  - date: '-0545'
    title_zh: 净护身口意持戒施斋
    rationale: 奉行身三口四意三清净，月六斋不贪华香伎乐，及慈悲不妄等十事为转身资粮
  - date: '-0545'
    title_zh: 常念佛法僧戒施天人发菩提心
    rationale: 以七念摄心，为一切度故，离十二因缘无我无人之见以速证菩提
events:
- id: guji-batuoshili-event-birth
  title_zh: 出生洴沙国为王夫人
  date: '-0600'
  place_zh: 摩竭提国洴沙国
  description_zh: 约公元前六世纪生于摩竭提属国洴沙，后为洴沙王夫人，受优婆夷戒
- id: guji-batuoshili-event-ask
  title_zh: 清净法坐都大会叉手问法
  date: '-0545'
  place_zh: 摩竭提国清净法坐处
  description_zh: 佛在摩竭提与弥勒等菩萨比丘尼优婆塞夷天龙共会，跋陀师利叉手白佛愿闻十方佛名菩萨及刹土名
- id: guji-batuoshili-event-ten-names
  title_zh: 得闻十方佛菩萨刹土名号
  date: '-0545'
  place_zh: 摩竭提清净法坐
  description_zh: 佛说东方入精进持计树敬首乃至下方梵精进水精树智慧首等十方佛刹菩萨名，闻已踊跃欢喜头面作礼
- id: guji-batuoshili-event-vow
  title_zh: 复问何行离母人身
  date: '-0545'
  place_zh: 摩竭提清净法坐
  description_zh: 自陈虽发无上菩提心当用何行离母人身，佛赞善哉许说一至十事
- id: guji-batuoshili-event-ten-practices
  title_zh: 领受一至十事离女身之行
  date: '-0545'
  place_zh: 摩竭提清净法坐
  description_zh: 佛次第说一事发菩提心不忘乃至十事慈悲不贪不绮语等，皆可疾得男子自致无上菩提
- id: guji-batuoshili-event-arise
  title_zh: 与六万优婆夷同发菩提心
  date: '-0545'
  place_zh: 摩竭提国
  description_zh: 佛说经竟，跋陀师利及摩竭提六万优婆夷闻是法行皆发无上菩提心，菩萨比丘等欢喜作礼而去
- id: guji-batuoshili-event-death
  title_zh: 卒于摩竭提
  date: '-0520'
  place_zh: 摩竭提国
  description_zh: 约公元前六世纪末卒，传以奉行十事转女身发菩提心之愿行见称
