  dilemmas:
  - 女身为碍与誓证无上菩提之困，欲求何行以速离母人身
  - 事天信邪与自归诸佛之择，欲持正信不谀谄而直行
  - 享乐华香伎乐与持斋净戒之争，欲舍世欲以成就净行
