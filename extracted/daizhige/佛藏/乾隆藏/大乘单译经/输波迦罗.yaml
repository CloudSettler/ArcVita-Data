  - date: 424
    title_zh: 舍王位让弟出家
    rationale: 志求无上菩提不恋世荣，故让国修道以全法身慧命
  - date: 462
    title_zh: 应请东来大唐
    rationale: 为令密法流布东土，满未来有情速成之愿，故冒海陆艰险入唐
