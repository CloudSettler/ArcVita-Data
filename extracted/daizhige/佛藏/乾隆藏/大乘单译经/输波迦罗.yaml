    title_zh: 以苏悉地总摄三部
    rationale: 为令持诵余真言不成就者兼持速成，故立此经为三部主通成一切事
  - date: 469
    title_zh: 详定阿阇梨戒相次第
    rationale: 以一切真言由师而得，故先明师德戒行处所同伴以固根本
events:
