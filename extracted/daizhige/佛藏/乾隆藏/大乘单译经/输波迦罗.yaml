  - 王位继承与舍国出家求法之抉择
  - 显教弘传与密教持明速成之权衡
  lesson: 舍尊位而求密法，以严净译场利乐有情，弘法当以菩提大悲为本
  summary_first_person: 吾本中天竺国王子，舍王位而出家，遍学三藏兼通密部，承佛敕东来大唐，译苏悉地羯啰等经，愿未来有情依三部次第速得悉地
