    rationale: 恐自解生增上慢，欲得调御师正说，知莲华伞盖月轮佛形为得胜法相
  - date: '-0525'
    title_zh: 具说梦境顶礼具陈
    rationale: 以诚敬心陈白所见，方能获佛以偈重宣大利之因
- id: guji-迦叶婆罗门-endeavor-2
  title_zh: 听受菩提心教行三乘分别
  goal_zh: 明发心功德与三菩提差别，学四摄天梵圣行至摩诃衍
  description: 闻佛说一切智为大利、须发菩提心方能作转轮王梵王乃至破诸盖障无明慢垢，复问发心福聚与退转，聆三乘乘别、譬如王路象马驴舆及恒河草筏皮船大船，后请菩萨天行梵行圣行及六度彼岸、破魔众会陀罗尼
  roles:
  - 菩提道请法者
  - 未来持经众生代表
  phases:
