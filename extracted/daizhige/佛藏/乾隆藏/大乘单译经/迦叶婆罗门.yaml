  decisions:
  - date: '-0525'
    title_zh: 追问发心福聚与退转
    rationale: 欲量菩提心十六分胜福，知解脱无别而乘有别，抉择最胜最上乘
  - date: '-0525'
    title_zh: 请问菩萨行与所依愿受陀罗尼
    rationale: 欲至摩诃衍须以布施爱语利益同事四摄摄众，兼修慈悲喜舍与空无相无愿，持破魔众会咒令魔宫震动而正法得护
events:
- id: guji-迦叶婆罗门-event-birth
  title_zh: 生于王舍城婆罗门家
  date: '-0550'
  year_of: '-0550'
  is_circa: true
  location_zh: 王舍城
  description: 姓大迦叶，生于摩揭陀王舍城婆罗门种姓，世习梵典
- id: guji-迦叶婆罗门-event-dream
  title_zh: 睡眠梦见千叶莲华月轮放光
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 王舍城舍宅
  description: 梦阎浮提内大莲华千叶七宝所成光明遍照三千大千世界，华内有月轮，月轮内丈夫放大光明普照四天下众生皆受快乐
- id: guji-迦叶婆罗门-event-visit-buddha
  title_zh: 往迦兰陀竹园礼佛陈梦
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 王舍城迦兰陀竹园
  description: 夜过往诣佛所顶礼佛足却住一面，具说所梦，佛告四种善梦得胜法并以偈颂莲华伞盖月轮佛形
- id: guji-迦叶婆罗门-event-hear-four-dreams
  title_zh: 闻四梦大利之说
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 迦兰陀竹园
  description: 闻佛说大利即一切智，若欲作转轮王梵王三界自在乃至灭诸颠倒盖障无明慢垢皆须发菩提心
- id: guji-迦叶婆罗门-event-ask-bodhicitta
  title_zh: 问发心福聚
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 迦兰陀竹园
  description: 问发菩提心摄几许福聚，佛以偈言令住信心持戒、造寺塔、施七宝乃至担戴等福皆不及道心十六分
- id: guji-迦叶婆罗门-event-hear-three-vehicles
  title_zh: 闻三菩提与乘喻
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 迦兰陀竹园
  description: 闻声闻辟支佛无上菩提三别，解脱道无差别而乘有差别，如王路象舆马舆驴舆及恒河草筏皮囊皮船大船载百千人喻
- id: guji-迦叶婆罗门-event-hear-conducts
  title_zh: 闻天行梵行圣行及六度
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 迦兰陀竹园
  description: 闻四摄摄众、慈身口意遍满十方为天行、四无量为梵行、空无相无愿为圣行，及闻此经能至檀戒忍进禅智彼岸
- id: guji-迦叶婆罗门-event-receive-dharani
  title_zh: 受破魔众会陀罗尼
  date: '-0525'
  year_of: '-0525'
  is_circa: true
  location_zh: 迦兰陀竹园
  description: 闻佛说三千大千世界百俱致魔欲灭此经，授破魔众会陀罗尼多致他阿谟大那等，说时魔宫震动诸魔堕落，持此经者水火刀杖恶兽逼恼不能害
- id: guji-迦叶婆罗门-event-death
  title_zh: 卒于摩揭陀
  date: '-0470'
  year_of: '-0470'
  is_circa: true
  location_zh: 摩揭陀
  description: 于佛灭前后示寂，后世以其问法因缘流通《出生菩提心经》令发心功德广显
