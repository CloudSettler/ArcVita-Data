  dilemmas:
  - 见希有瑞梦当自决吉凶抑或诣觉者求解
  - 世间转轮王梵天王大利与出世无上菩提大利何所择
  lesson: 梦兆虽吉须亲近善知识决疑，发无上菩提心方为一切大利根本
  summary_first_person: 吾本王舍城大迦叶姓婆罗门，睡梦中见阎浮提千叶莲华放光、月轮中丈夫普照四天下，觉已欢喜生疑，往迦兰陀竹园顶礼瞿昙而问梦相，蒙佛说四种善梦与发菩提心功德，遂知三乘差别与四摄天梵圣行，愿受持破魔陀罗尼护持正法
