  - 梵本深义与汉文达意之间如何不失真而又令众生得解
  - 历经北齐北周隋三朝更迭依附王权护法与保持僧格独立之平衡
  lesson: 以戒定为本以诚敬为桥，穷研梵汉方能令力庄严等深法不谬而广传
  summary_first_person: 吾乃北天竺乌场国那连提耶舍，少通声明究大小乘三藏，承命游化东土，历齐周入隋，蒙文帝礼请于大兴善寺译经，译出力庄严三昧等凡十五部，愿以文字般若庄严众生心地。
