events:
- id: guji-shijiamouni-event-birth
  title_zh: 降生蓝毗尼园
  date: '-0563'
  year_of: '-0563'
  description: 摩耶夫人诞悉达多于蓝毗尼园为净饭王太子具三十二相
- id: guji-shijiamouni-event-enlightenment
  title_zh: 道场菩提树证无上正觉
  date: -0528
  year_of: -0528
  description: 坐摩伽陀道场菩提树下破八千万亿魔军得阿耨多罗三藐三菩提
- id: guji-shijiamouni-event-first-sermon
  title_zh: 波罗奈鹿野苑三转法轮
  date: -0528
  year_of: -0528
  description: 于波罗奈鹿野苑为憍陈如等三转十二行法轮示教利喜
- id: guji-shijiamouni-event-announce-nirvana
  title_zh: 毗舍离跋提河告阿难三月当入涅槃
  date: -0483
  year_of: -0483
  description: 住毗舍离猕猴池大重阁与阿难往波波城于跋提河脱郁多罗僧澡洗告观如来三十二相如优昙花日月师子须弥难见三月后当般涅槃
- id: guji-shijiamouni-event-entrust
  title_zh: 历忉利龙宫夜叉国付嘱正法
  date: -0483
  year_of: -0483
  description: 自阎浮提没出忉利天嘱帝释次至娑伽罗德叉迦黑色龙宫及毗沙门毗留勒叉毗留博叉提头赖吒四天王夜叉将所三嘱护持佛法令制恶龙恶夜叉
- id: guji-shijiamouni-event-prophecy
  title_zh: 预示末世破戒比丘如师子虫
  date: -0483
  year_of: -0483
  description: 以神通令阿难见未来破戒比丘畜妻妾产男女贮金银卜筮咒起死尸杀盗毁塔等喻师子死唯身虫自食其肉宝船沉没十二部经为绮饰文章所灭
- id: guji-shijiamouni-event-last-journey
  title_zh: 至波波城度讫绕菩提树六匝
  date: -0483
  year_of: -0483
  description: 与阿难往诸国教化无量百亿那由他众生讫至摩伽陀道场绕菩提树六匝结加趺坐告十五日后当般涅槃地六种震动诸天悲泣
- id: guji-shijiamouni-event-death
  title_zh: 示现般涅槃碎身舍利
  date: -0483
  year_of: -0483
  description: 入金刚三昧碎肉身如芥子一分向诸天为帝释雨曼陀罗花供养一分向龙夜叉一分在阎浮提为阿输迦王造八万四千塔供养令众发无上菩提声闻辟支佛愿
