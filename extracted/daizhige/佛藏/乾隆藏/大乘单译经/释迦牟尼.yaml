endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 舍卫祇园弘法与广度众生
  summary: 自成道后游行恒河流域，于舍卫国祇树给孤独园长住说法，摄受国王长者与四众弟子，奠定僧团与正法住世之基
  phases:
  - key: brewing
    name: 出家求道
    labels:
      zh: 逾城出家
    start_date: -0534-02-08
    highlight_event_id: guji-释迦牟尼-event-renunciation
  - key: breakthrough
    name: 菩提证道
    labels:
      zh: 降魔成道
    start_date: -0528-12-08
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: climax
    name: 祇园长住说法
    labels:
      zh: 祇园说法
    start_date: -0495-05-01
    highlight_event_id: guji-释迦牟尼-event-jetavana
  - key: closure
    name: 法脉付嘱阿难
    labels:
      zh: 付嘱受持
    start_date: -0490-03-15
    highlight_event_id: guji-释迦牟尼-event-dharani
  decisions:
  - date: -0528-12-08
    title_zh: 决定说法而非独证涅槃
    rationale: 观众生根性可度，以大悲故转法轮而非入无余寂灭
  - date: -0495-05-01
    title_zh: 纳受祇园精舍长住舍卫
    rationale: 依给孤独长者与波斯匿王护持，使僧团得安居、闻法、结集之所
- id: guji-释迦牟尼-endeavor-2
  title_zh: 宣说大普贤陀罗尼护世法门
  summary: 为除众生兵刃怨仇、夜叉罗刹、鬼神病苦及水火咒毒等畏，于祇园告阿难说大普贤咒及诸支分咒，授以咒水、结缕、杨枝、三噀等对治仪轨，令善男女行道急难时忆念受持即得守护
  phases:
  - key: brewing
    name: 观察众生诸畏
    labels:
      zh: 观机施护
    start_date: -0492-01-10
    highlight_event_id: guji-释迦牟尼-event-jetavana
  - key: breakthrough
    name: 初说普贤总咒
    labels:
      zh: 总咒遮恶
    start_date: -0490-03-15
    highlight_event_id: guji-释迦牟尼-event-dharani
  - key: climax
    name: 广开支分对治
    labels:
      zh: 分咒治病
    start_date: -0490-03-16
    highlight_event_id: guji-释迦牟尼-event-dharani-branch
  - key: closure
    name: 嘱令流通守护
    labels:
      zh: 受持流通
    start_date: -0490-03-17
    highlight_event_id: guji-释迦牟尼-event-dharani-entrust
  decisions:
  - date: -0490-03-15
    title_zh: 以陀罗尼为方便授阿难
    rationale: 众生多怖畏病苦，显教义理难即除障，故以密咒音声为护，使信心浅者亦得即时离畏
  - date: -0490-03-16
    title_zh: 分别说腰脚痛等六类鬼名及治法
    rationale: 应病与药，使咒水、结缕、杨枝、方位水噀各有仪轨，对机施治，易于受持验效
events:
- id: guji-释迦牟尼-event-birth
  date: -0563-04-08
  year_of: -371
  title_zh: 诞生于蓝毗尼园
  description: 净饭王之子悉达多诞生于蓝毗尼园，古印度列国时代，传为四月初八
  location: 蓝毗尼园
- id: guji-释迦牟尼-event-renunciation
  date: -0534-02-08
  year_of: -348
  title_zh: 逾城出家
  description: 感生老病死，夜半逾城出家修道，遍访诸师寻求解脱
  location: 迦毗罗卫国
- id: guji-释迦牟尼-event-enlightenment
  date: -0528-12-08
  year_of: -0528
  title_zh: 菩提伽耶证无上觉
  description: 于菩提树下降魔证道，觉悟缘起中道，号释迦牟尼佛
  location: 菩提伽耶
- id: guji-释迦牟尼-event-jetavana
  date: -0495-05-01
  year_of: -0495
  title_zh: 住舍卫祇树给孤独园说法
  description: 受给孤独长者施祇园精舍，长住舍卫说法，僧团兴盛
  location: 舍卫国祇树给孤独园
- id: guji-释迦牟尼-event-dharani
  date: -0490-03-15
  year_of: -0490
  title_zh: 于祇园说大普贤陀罗尼授阿难
  description: 告阿难说大普贤咒多掷多阿咤那咤等，言此咒能遮灭兵刃、除怨仇、除夜叉罗刹复多等畏
  location: 舍卫国祇树给孤独园
- id: guji-释迦牟尼-event-dharani-branch
  date: -0490-03-16
  year_of: -0490
  title_zh: 广说支分咒治诸病苦
  description: 次第说腰脚痛、头痛、闇钝、耳痛、淋病等鬼名及咒水七遍、结三色缕、杨枝二七下、三七遍、日三遍、方位水噀等仪轨
  location: 舍卫国祇树给孤独园
- id: guji-释迦牟尼-event-dharani-entrust
  date: -0490-03-17
  year_of: -0490
  title_zh: 付嘱受持流通护世
  description: 言若行道水道急难处念此咒则无夜叉毗舍遮等畏，天龙二十八部不能越犯，铁轮金刚轮为作守护，嘱善男女善读诵执持奉行
  location: 舍卫国祇树给孤独园
- id: guji-释迦牟尼-event-death
  date: -0483-02-15
  year_of: -0483
  title_zh: 拘尸那罗娑罗林入涅槃
  description: 于拘尸那罗娑罗双树间入般涅槃，众弟子结集正法
  location: 拘尸那罗
