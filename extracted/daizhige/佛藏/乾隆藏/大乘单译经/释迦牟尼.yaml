  birth_date: -0563-04-08
  death_date: -0483-02-15
  era: 古印度列国时代
  archetype: 出世觉者
  dilemmas:
  - 宫廷安乐与生老病死大苦如何面对
  - 王位继承与出家求道度众如何取舍
  - 独善山林与兼济万民如何抉择
  lesson: 见苦而求解脱，立愿而历长劫，觉悟而普度众生
  summary_first_person: '我前世为摩纳，居山衣鹿皮，闻题和竭罗佛至，以五百钱购优钵华五枚散佛，华住虚空而不堕，布发令佛蹈之，发愿后世成佛如佛。

    历三十六为帝释、八万四千世为飞行皇帝、上生兜率，而后降生迦维罗卫为悉达太子。

    见病瘦老死四相，深感无常，夜半逾城出家，树下禅定成佛，而后度五人及千众，弘化无数天人。

    '
