  - title_zh: 亲情牵系与解脱大道
    description: 母子恩爱欢乐须臾，死堕恶道永相离别，唯令亲族出家得道方为真慈
  - title_zh: 国嗣传承与出家求道
    description: 既承王种当继宗嗣，又见生老病死无常，须舍五欲腾越宫城以求正觉
  lesson: 恩爱离别终归无常，唯闻法修行能出生死，教化功德胜于财施
  summary_first_person: 吾本迦毗罗卫太子，见世无常舍国出家，苦行六年得成正觉，复遣目连度罗睺为沙弥，于祇园为王说法，说野干本生以明法施无量
