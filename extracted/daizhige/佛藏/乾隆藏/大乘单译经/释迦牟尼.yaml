    rationale: 僧具发心离俗毁形应法割爱舍命度人之五德供之可成佛故须令众生归敬
  - date: -0483-01-03
    title_zh: 以七施开世间福
    rationale: 佛图园果医药桥船井厕皆利众生昼夜如五河流得生梵天故并宣说以塞祸元
