    name: 菩提树下成佛
    labels:
      zh: 降魔证道
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  decisions:
  - date: '-534'
    title_zh: 决意逾城出家学道
    rationale: 见老病死苦及众生烦恼，深知宫廷欲乐不能免苦，故舍位求无上道
  - date: '-528'
    title_zh: 菩提树下誓不成起
    rationale: 历苦行知非究竟，惟依正觉降伏群魔，方能转大法雨利众
- id: guji-释迦牟尼-endeavor-2
  title_zh: 住世说法开示观佛
  summary: 成道后转法轮，升忉利为母说法，晚年还迦毗罗为父王说观佛三昧海，付嘱后世系念法门
  phases:
  - key: brewing
    name: 鹿野转法摄众
    labels:
      zh: 初转法轮
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: breakthrough
    name: 游化十方现光明
    labels:
      zh: 行住坐卧放光
    start_date: '-500'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: climax
    name: 尼拘楼陀说观佛海
    labels:
      zh: 为父王说观法
    start_date: '-484'
    highlight_event_id: guji-释迦牟尼-event-teach-guanfo
  - key: closure
    name: 拘尸那示现灭度
    labels:
      zh: 涅槃付嘱
    start_date: '-483'
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: '-484'
    title_zh: 为父王及四众广说观佛
    rationale: 愍父王但见外身不见内心，及念末世众生不见佛身，故以色身三昧开系念次第
  - date: '-483'
    title_zh: 以观佛三昧付嘱后世
    rationale: 佛身常行尺度可观可念，令读诵持戒兼修系念者心如佛心不为恶覆
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 迦毗罗卫诞生现白毫
  date: '-563'
  year_of: -563
  location_zh: 迦毗罗卫蓝毗尼园
  description: 太子初生，眉间白毫旋生，量长五尺如琉璃筒，放已右旋，阿私陀仙相见叹奇
- id: guji-释迦牟尼-event-marriage
  title_zh: 纳耶输陀罗妃验相
  date: '-548'
  year_of: -548
  location_zh: 迦毗罗卫王宫
  description: 纳妃时相师申看白毫，如颇梨幢节节相当，中现梵王帝释宫殿，耶输陀罗父见已以女妻之
- id: guji-释迦牟尼-event-renunciation
  title_zh: 夜半逾城出家
  date: '-534'
  year_of: -534
  location_zh: 迦毗罗卫宫至城外
  description: 欲出家时申白毫至四天王所，敕车匿于后厩被揵陟宝马，诸天龙神同时得入卫护启行
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 降魔成无上菩提
  date: '-528'
  year_of: -528
  location_zh: 菩提伽耶菩提树下
  description: 苦行降魔已得阿耨多罗三藐三菩提，具三十二相八十随好，光明遍照，转大法轮
- id: guji-释迦牟尼-event-teach-guanfo
  title_zh: 尼拘楼陀说观佛三昧海
  date: '-484'
  year_of: -484
  location_zh: 迦毗罗城尼拘楼陀精舍
  description: 应父王阅头檀请，入遍净色身三昧，演六譬观地观相等品，开示后世系念观佛顶发毫相次第
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那城入涅槃
  date: '-483'
  year_of: -483
  location_zh: 拘尸那城娑罗林
  description: 化缘既毕，于拘尸那降度力士已示现灭度，付嘱四部众以诵经持戒系念三法修观佛三昧
