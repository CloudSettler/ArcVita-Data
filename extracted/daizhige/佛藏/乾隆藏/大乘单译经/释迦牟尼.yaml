events:
- id: guji-释迦牟尼-event-birth
  title_zh: 迦维罗卫太子降生
  date: -0563-04-08
  year_of: -563
  place_zh: 迦维罗卫国
  description: 四月八日夜半自母右胁生，堕地行七步，举手言天上天下尊无过我者，天地大明振动
- id: guji-释迦牟尼-event-vow
  title_zh: 摩纳散花供题和竭罗佛得授记
  date: -2000-01-01
  year_of: -2000
  place_zh: 钵摩诃城
  description: 摩纳以五优钵华散佛，华住空成行不堕，复以俱夷二华散之住两肩，布发承足，得九十劫后成释迦文佛授记
- id: guji-释迦牟尼-event-tour
  title_zh: 四门出游见病老死
  date: -0545-01-01
  year_of: -545
  place_zh: 迦维罗卫国东西南北四城门
  description: 十岁后四出游，帝释化作病瘦老人丧车，太子问驭者知人皆当病老死，回车忧思不乐饮食
- id: guji-释迦牟尼-event-renunciation
  title_zh: 夜半逾城出家
  date: -0534-01-01
  year_of: -534
  place_zh: 迦维罗卫宫中庭至王家佃上
  description: 四天王令宫人昏睡，鬼神持马足逾屋出城，太子至佃上易鹿皮，遣车匿与白马还宫，入山求道
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 树下禅定夜半成佛
  date: -0528-01-01
  year_of: -528
  place_zh: 文邻龙水边树下
  description: 树下正坐誓不得佛不起，得四禅及宿命天眼，一夜成佛，文邻龙覆护七日不动，欢喜七日不食
- id: guji-释迦牟尼-event-teaching
  title_zh: 还度五沙门摄千众弘化
  date: -0528-06-01
  year_of: -528
  place_zh: 水上及诸国城门
  description: 先教水上五人摩头为沙门，后携至三道人所摄千弟子，所至钟鼓自鸣病愈盲视，教授数千万亿人得度
- id: guji-释迦牟尼-event-death
  title_zh: 弘化圆满般涅槃
  date: -0483-02-15
  year_of: -483
  place_zh: 拘尸那竭娑罗林
  description: 住世说法度众圆满，入无余涅槃，舍利流布人天供养
