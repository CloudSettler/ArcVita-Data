    rationale: 我人所不污处能忍秽利人可除贡高解生死缘所生净洁尘水不著故力行之
  - date: -0528-06-01
    title_zh: 发无恋布施大愿
    rationale: 欲为众生作依怙须舍悭爱广修布施以众善普备方能成佛照达三世故立誓不退
