    title_zh: 决定说一乘不说小乘
    rationale: 广度众生故，皆以一味道终不以小乘，令闻者皆入佛智地
  - date: -486-05-02
    title_zh: 结跏入于金刚三昧
    rationale: 以身心不动证无相无生，为众示决定实际本觉利行之体
