  decisions:
  - date: -485-08-15
    title_zh: 以一觉转诸识不住涅槃
    rationale: 觉本无生离众生垢，觉本无寂离涅槃动，故不住取证而常住本利
  - date: -485-08-16
    title_zh: 令安坐心神住金刚地
    rationale: 一念心动则五阴俱生具五十恶，静念无起则心常安泰即无一念而入庵摩罗
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼园降生
  date: -563-04-08
  year_of: -563
  place_zh: 迦毗罗卫蓝毗尼园
  summary_zh: 周昭王时诞生于蓝毗尼，为净饭王子，具大人相，立志求解脱之因
- id: guji-释迦牟尼-event-preach
  title_zh: 王舍耆阇崛山说一味真实经
  date: -486-05-01
  year_of: -486
  place_zh: 王舍大城耆阇崛山
  summary_zh: 与大比丘万人菩萨二千长者八万天龙等俱，说名一味真实无相无生决定实际本觉利行经
- id: guji-释迦牟尼-event-benjue
  title_zh: 答无住菩萨说本觉利入庵摩罗
  date: -485-08-15
  year_of: -485
  place_zh: 耆阇崛山法会
  summary_zh: 说一觉转八识入庵摩罗，以迷子执金钱喻明本有觉利，众得本觉利般若波罗蜜
- id: guji-释迦牟尼-event-samadhi
  title_zh: 结跏入金刚三昧示无生行
  date: -486-05-02
  year_of: -486
  place_zh: 耆阇崛山中
  summary_zh: 说经已结加趺坐入金刚三昧身心不动，令心王菩萨等得无生忍无生般若，大众入空无相得决定
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那娑罗林入涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那揭罗娑罗林
  summary_zh: 化缘既毕，于娑罗林入般涅槃，示涅槃本觉不异，觉性不生不灭，留法化后世
