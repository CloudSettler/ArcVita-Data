  - date: -0528-12-08
    title_zh: 坚持苦行终得正觉
    rationale: 信因缘业报不虚，勤修不懈方能自觉觉他，不负出家本愿
- id: guji-释迦牟尼-endeavor-2
  title_zh: 度化罗睺与祇园说法
  summary: 住祇树给孤独园时遣目连往迦毗罗迎取罗睺出家，为波斯匿王说般若四喻及野干堕井本生，开示法施功德
