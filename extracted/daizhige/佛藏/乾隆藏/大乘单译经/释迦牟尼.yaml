  decisions:
  - date: -563-06-01
    title_zh: 以神足现胎舍为清净道场
    rationale: 为破众生计身秽污之想示胎即净土令生信解勇猛求法
  - date: -563-07-01
    title_zh: 入琉璃定说空无相法
    rationale: 为令菩萨了达身观皆空根尘清净直入无根义住不退转
- id: guji-释迦牟尼-endeavor-2
  title_zh: 双树示灭付嘱阿难
  summary: 于伽毗罗婆兜双树间出金色臂三问阿难付嘱大乘方等旧法
  phases:
  - key: brewing
    name: 襞衣敷棺示将舍寿
