  - key: climax
    name: 三问阿难所得法藏
    labels:
      zh:
      - 勘验付嘱
    start_date: -483-02-08
    highlight_event_id: guji-释迦牟尼-event-nirvana
  - key: closure
    name: 分别胎法令谛听受持
    labels:
