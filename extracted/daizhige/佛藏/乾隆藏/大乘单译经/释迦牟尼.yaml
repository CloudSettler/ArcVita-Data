    death:
      date: -0543-02-15
      precision: day
      is_circa: true
      raw: 约前543年二月十五拘尸那揭罗入灭
  birth_date: -0623-04-08
  death_date: -0543-02-15
  era: 春秋
  reign_ref: 周襄王至周景王时
  archetype: 觉者导师
  dilemmas:
  - 慈悲救护现前贼害与令众生自修因果解脱之间的张力
  - 方便咒术护身与正法戒定慧究竟修持之间的权衡
  lesson: 以方便咒愿护念众生现世安隐，然究竟辟除贼害在于调伏自心贪嗔痴，方得内外俱安
  summary_first_person: 吾本迦毗罗卫释迦族人，见众生行旅怖畏贼寇之害，故说归敬三宝及过去七佛、并北方健陀摩诃术山默利薛利鬼神王拥护之咒，示安檀尼等四姊弟令贼盲住坐痴噤之法，教以月晦佛前然七灯烧香散花持诵七过，为鬼神王及鬼子母回向福德，愿令持者皆得拥护安隐。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E8%BE%9F%E9%99%A4%E8%B4%BC%E5%AE%B3%E5%92%92%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E8%BE%9F%E9%99%A4%E8%B4%BC%E5%AE%B3%E5%92%92%E7%BB%8F.html
