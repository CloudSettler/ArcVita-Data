  era: 春秋战国
  reign_ref: 古印度拘萨罗国波斯匿王时期
  archetype: 教主
  dilemmas:
  - 以密咒方便救护现世苦厄与以正观智慧解脱根本无明的权实之辨
  - 以慈悲普度一切众生与以戒律严护正法住世的张力
  - 随顺世间鬼神信仰而摄化与破除迷信直显缘起的平衡
  lesson: 方便即是究竟，护念众生现世安稳方能趣入出世解脱；一切陀罗尼皆从慈悲与正念而生
  summary_first_person: 吾本释种出家，于舍卫祇园告阿难说大普贤陀罗尼，愿以此咒遮诸兵刃、除诸怨怖、疗众病苦，令一切受持者无畏无恼，安隐行道
  source_urls:
