  dilemmas:
  - 生死无常与众生不悟的悲愿如何示现可厌以令厌离
  - 三阿僧祇劫所集正法欲令久住而末世破戒比丘自坏自法
  - 慈悲普度与恶龙恶夜叉恶比丘破坏佛法的守护抉择
  lesson: 诸行无常有为会归坏灭当以戒定慧自庄严护持法身舍利令见闻者发菩提心
  summary_first_person: 吾为释迦牟尼于毗舍离猕猴池重阁预告阿难三月当入涅槃于跋提河畔示观三十二相如优昙花难见复以金刚三昧碎身如芥子分舍利向天龙夜叉人间令阿育王起八万四千塔供养复历忉利龙宫夜叉国三嘱帝释娑伽罗龙王四天王守护吾三阿僧祇劫所集之法又示未来破戒比丘如师子身虫自食其肉令众知身可厌法可依绕菩提树六匝而示十五日后当般涅槃
  source_urls:
