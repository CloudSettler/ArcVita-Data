  death_date: -483-02-08
  era: 春秋末期
  reign_ref: 周敬王世
  archetype: 觉者导师
  dilemmas:
  - 以无胎分而现十月处胎云何令众生信解空性而不著身相
  - 以将入涅槃而大法未尽付嘱云何令阿难承持方等大乘不令阙漏
  - 以清净法身而示秽污色身云何令五浊众生厌离生死而趣菩提
  lesson: 处胎即是道场生死即是说法以空慧照身以慈悲应世不舍众生不著诸相
  summary_first_person: 吾经无数劫成佛今复入胎舍敷大高座集十方菩萨入琉璃定演方等不思议法于双树间三问阿难付嘱胎藏旧法令后世众生得闻不退转道
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E8%8F%A9%E8%90%A8%E5%A4%84%E8%83%8E%E7%BB%8F.html
