  summary_first_person: 吾为释迦族太子悉达多睹生老病死苦而舍王位出家于菩提树下证悟无上正觉周游恒河说法四十五年临入般涅槃于拘夷那竭为阿难及大众宣说将来五逆浊世魔作沙门坏乱吾道袈裟变白首楞严般舟先灭十二部经次第灭尽之相并付嘱阿难名为法灭尽令分别宣告使闻者悲惕而发无上道意待后弥勒下生重兴泰平
