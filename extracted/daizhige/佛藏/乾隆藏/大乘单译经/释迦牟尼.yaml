  - title_zh: 生老病死苦何解
    description_zh: 睹四门老病死苦，于继位治国与出家求道之间抉择，终舍宫廷而求解脱
  - title_zh: 一乘一味与三乘方便何择
    description_zh: 欲令五浊众生速入决定实际，故说一味真实无相无生，而舍小乘杂味方便
  lesson: 离心我执，住无生空寂，以本觉利行化众，方入决定解脱
  summary_first_person: 吾在王舍大城耆阇崛山中，与万人众俱，为说一味真实无相无生决定实际之法，既说已，即结跏趺坐，入金刚三昧，身心不动，开示后世众生本觉常在，令离心我，入庵摩罗，得大解脱。
  source_urls:
