  summary_first_person: 我于舍卫祇园为天帝释说僧有五净德为最胜福田复说七施得生梵天忆我宿世于波罗奈施厕利人累劫舍国财妻子头目乃成金身具足相好故付嘱阿难持此诸德福田之教
