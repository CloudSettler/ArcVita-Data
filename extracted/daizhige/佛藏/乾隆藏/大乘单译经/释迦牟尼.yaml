  - 执著极端苦行与守中道证悟之抉择
  - 于秽恶娑婆成佛度逆恶众生与于净土成佛之愿择
  lesson: 一切众生皆曾为父母，当修平等大慈孝养报恩，以大方便度众越苦海
  summary_first_person: 吾本迦毗罗卫净饭王子，睹生老病死而舍宫逾城出家，历难行苦行悟中道成无上觉，于王舍城耆阇崛山放光集十方菩萨，为阿难及大众说宿世孝养报恩因缘，令众生知恩报恩断邪疑而趣一乘
