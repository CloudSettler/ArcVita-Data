    start_date: -483-02-08
    highlight_event_id: guji-释迦牟尼-event-nirvana
  decisions:
  - date: -483-02-08
    title_zh: 三出金臂复入金棺寂然不语
    rationale: 欲显金刚三昧碎身舍利不可思议令四众天龙生渴仰心
  - date: -483-02-08
    title_zh: 命阿难谛听胎中旧法一一分别
    rationale: 阿难未闻忉利龙宫胎中之说故补说思乐世界香焰如来等缘起令法无阙
