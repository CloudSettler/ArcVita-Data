  title_zh: 舍宫出家降魔成道
  summary: 生具三十二相，长于王宫，纳妃后夜半出家，苦行降魔，证无上菩提
  phases:
  - key: brewing
    name: 王宫诞育具相
    labels:
      zh: 初生白毫现瑞
    start_date: '-563'
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: breakthrough
    name: 纳妃相验白毫
    labels:
      zh: 纳耶输陀罗为妃
    start_date: '-548'
    highlight_event_id: guji-释迦牟尼-event-marriage
  - key: climax
    name: 夜逾城郭出家
    labels:
      zh: 申毛敕车匿被马
    start_date: '-534'
    highlight_event_id: guji-释迦牟尼-event-renunciation
