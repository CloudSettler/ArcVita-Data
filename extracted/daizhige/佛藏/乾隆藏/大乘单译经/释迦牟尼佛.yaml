- id: guji-释迦牟尼佛-event-past-offering
  title_zh: 九龙浴华盖现佛供饭发心
  date: -1556-03-15
  year_of: -1556
  place_zh: 过去世佛所
  description: 母洗儿手感九龙吐水残水化宝帐师子座坐佛佛笑光入儿顶母饭饱十方佛僧儿发无上道意刹土震动得不退转并蒙授记十四劫后作佛
- id: guji-释迦牟尼佛-event-birth
  title_zh: 蓝毗尼降生
  date: -563-04-08
  year_of: -563
  place_zh: 蓝毗尼园
  description: 释迦族悉达多太子降生即后之释迦牟尼佛
- id: guji-释迦牟尼佛-event-preaching
  title_zh: 说过去分卫本缘授记
  date: -483-01-01
  year_of: -483
  place_zh: 舍卫国祇园
  description: 自述过去小儿即我身是分别三怪为九龙浴座华盖宝帐光入顶之应并记母人当为转轮圣王七百世后得不退转众闻皆得不退转
