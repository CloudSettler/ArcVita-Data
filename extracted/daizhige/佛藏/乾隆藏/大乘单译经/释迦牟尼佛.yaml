    title_zh: 母不违本心送子出家
    rationale: 既见子异凡人安隐无恶露不可因恩爱违愿故具饭衣携子诣佛
  - date: -1556-03-15
    title_zh: 童子发无上平等道意
    rationale: 以母饭上佛并食感十亿刹震动诸佛现前故立志求无上道
