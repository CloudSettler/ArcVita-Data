  - date: -483-01-01
    title_zh: 自述小儿即我身
    rationale: 为解母人三怪之问并令众信宿因故直言是时小儿即我身是
  - date: -483-01-01
    title_zh: 以本生功德普令得不退
    rationale: 欲令天龙人民闻过去供养发心功德皆发道意故说此经
events:
