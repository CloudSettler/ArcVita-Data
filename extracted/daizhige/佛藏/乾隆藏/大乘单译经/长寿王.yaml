  summary_first_person: 吾为长寿王时以仁政治国，不忍以干戈伤民，宁委国而去，隐于山林；值婆罗门远来求乞，遂以头布施成其所愿；临死嘱太子长生慎莫报怨，愿以慈悲止息怨憎。
