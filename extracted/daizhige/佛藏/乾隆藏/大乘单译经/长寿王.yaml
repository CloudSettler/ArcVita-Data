    title_zh: 决不与贪王交兵以免伤民
    rationale: 诤国杀民非贤者所为，胜亦有死伤，不忍爱我害彼
  - date: -1001-07-01
    title_zh: 委国与太子长生共踰城亡去
    rationale: 贪者在利不在民，留则必战，避位可全两国生灵
