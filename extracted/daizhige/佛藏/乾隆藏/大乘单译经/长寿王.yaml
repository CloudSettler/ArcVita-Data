  date: -1010-01-01
  year_of: -1010
  place_zh: 长寿王国
  description_zh: 刀杖不加吏民，风雨时节五谷丰熟，国富民安无兵革之备
- id: guji-长寿王-event-invasion
  title_zh: 贪王闻丰乐兴兵来侵
  date: -1002-03-01
  year_of: -1002
  place_zh: 长寿王国边境
  description_zh: 邻国暴虐之王闻长寿国炽饶而无备，遂与傍臣议发兵攻夺
- id: guji-长寿王-event-refuse-war
  title_zh: 拒群臣请战议
  date: -1001-06-15
  year_of: -1001
  place_zh: 王宫
  description_zh: 界吏报贪王来侵，群臣请逆距，长寿王以胜亦伤民为由不许交战
- id: guji-长寿王-event-exile
  title_zh: 父子逾城隐山
  date: -1001-07-01
  year_of: -1001
  place_zh: 山间幽隐
  description_zh: 长寿王与太子长生共踰城而出，委国亡去，贪王遂入国募求长寿王赏
- id: guji-长寿王-event-meet-brahmin
  title_zh: 道边树下遇远来婆罗门
  date: -1001-08-10
  year_of: -1001
  place_zh: 道边树下
  description_zh: 失国后与贫鄙婆罗门同息树下，闻其远来欲乞布施周救贫羸
- id: guji-长寿王-event-dana
  title_zh: 以头布施婆罗门
  date: -1001-09-01
  year_of: -1001
  place_zh: 城门外
  description_zh: 自念无以相副，令婆罗门缚己以白贪王，使其得金千斤钱千万之赏
- id: guji-长寿王-event-admonish
  title_zh: 市前临死诫子不报怨
  date: -1001-09-10
  year_of: -1001
  place_zh: 四街道头刑场
  description_zh: 太子长生佯担樵至市前观父，父仰天太息嘱慎莫为父报怨
- id: guji-长寿王-event-death
  title_zh: 就烧而终
  date: -1000-01-01
  year_of: -1000
  place_zh: 四街道头
  description_zh: 贪王使人于四街道头烧杀长寿王，群臣具馔临之，人民莫不呼天，菩萨以无怨恚心成就佛道因缘
