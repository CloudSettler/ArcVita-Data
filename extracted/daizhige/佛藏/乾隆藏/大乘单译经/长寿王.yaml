    start_date: -1001-09-10
    highlight_event_id: guji-长寿王-event-admonish
  - key: closure
    name: 就烧成道
    labels:
      zh: 殉道
    start_date: -1001-09-15
    highlight_event_id: guji-长寿王-event-death
  decisions:
  - date: -1001-09-01
    title_zh: 以头惠施婆罗门令得重赏
    rationale: 人生皆当趣死，愿以身相惠满其远来乞愿，不令空归
  - date: -1001-09-10
    title_zh: 临死仰天诫太子莫报怨
    rationale: 为至孝当使父死无恨，若违父言行杀即令父死有余恨，当以不怨成仁
events:
- id: guji-长寿王-event-birth
  title_zh: 长寿王诞生
  date: -1020-01-01
