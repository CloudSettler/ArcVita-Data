  dilemmas:
  - 梵本严谨与华言通达之间的取舍，宁失文采不失经义
  - 异域沙门身份与隋王朝译场体制依附之间的平衡
  - 大乘广博诸佛名号的繁复记诵与中土众生信受之间的张力
  lesson: 译经在信与达之间，护念在自利与利他之间，唯以至诚为桥梁，方能令不思议功德流布中土
  summary_first_person: 吾本犍陀罗国沙门，少出家，习三藏，慕支那弘法之盛，冒流沙而东来。蒙隋文帝礼遇，入大兴善寺译场，虽梵汉悬隔、音义难齐，犹竭愚诚，冀以诸佛所护念之不思议功德，普润有情
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘单译经/佛说不思议功德诸佛所护念经.md
