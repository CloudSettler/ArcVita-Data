    title_zh: 应北周至隋禅代之邀留居长安
    rationale: 见隋文帝崇佛立国，译场制度完备，决意留中土而非西归，以官译之力广布经法
  - date: 0585
    title_zh: 创译场对译参校之法
    rationale: 为保梵本不失义理，立梵汉对校、笔受润文分工，宁繁不简以存诸佛名号功德
  - date: 0589
    title_zh: 择大乘显教为先译
    rationale: 顺应中土大乘根器，先译护念、功德类经典以坚众生信心，再及律论
- id: guji-阇那崛多-endeavor-2
  title_zh: 西域求法与中土弘化之志
  summary: 以异域行脚僧身份沟通犍陀罗与长安，弘扬诸佛护念思想，培育中土译才
