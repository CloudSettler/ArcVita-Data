    title_zh: 决计东行不畏艰险
    rationale: 以法布施为第一功德，不以身命为念，愿令东方众生得闻诸佛名号
  - date: 0585
    title_zh: 以音译保留诸佛世界名号
    rationale: 诸佛名号功德不思议，不可随意意译，故多存梵音以全其护念力
