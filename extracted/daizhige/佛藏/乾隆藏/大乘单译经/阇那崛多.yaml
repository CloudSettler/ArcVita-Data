  summary_first_person: 吾乃北天竺犍陀罗人本婆罗门种少而出家遍学大小乘及明咒陀罗尼后应隋文帝之召越葱岭入长安住大兴善寺与达摩笈多等共译大威德陀罗尼等三十余部二十卷毕此一生愿以翻经令华土众生得闻总持安乐
