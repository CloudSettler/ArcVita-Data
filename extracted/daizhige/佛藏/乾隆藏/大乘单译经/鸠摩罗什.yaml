  date: '0406'
  year_of: 406
  place: 长安大寺
  description: 姚秦弘始年间译出佛说华手经亦名摄诸善根经十卷，显摄一切法断疑令入法海之义，与会菩萨比丘叹为希有
- id: guji-鸠摩罗什-event-death
  title_zh: 圆寂长安舌根不坏
  date: '0413'
  year_of: 413
  place: 长安
  description: 弘始十五年示疾圆寂，荼毗之日舌根不烂以证所译不谬，时年约七十，塔于逍遥园
