  date: '0401'
  year_of: 401
  place: 长安逍遥园西明阁
  description: 姚兴灭后凉迎什入长安，集义学沙门八百余人，僧肇僧叡等执笔，始大译经
- id: guji-鸠摩罗什-event-huashou
