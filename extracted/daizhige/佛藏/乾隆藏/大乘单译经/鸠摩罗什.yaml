events:
- id: guji-鸠摩罗什-event-birth
  date: '0344'
  title_zh: 诞生龟兹
  description: 生于龟兹国，父鸠摩罗炎为天竺婆罗门，母耆婆为龟兹王妹，自幼聪慧七岁出家
  year_of: '0344'
- id: guji-鸠摩罗什-event-study
  date: 0359
  title_zh: 游学罽宾研习大乘
  description: 年少游罽宾从槃头达多习小乘，后遇须耶利耶苏摩改学大乘，通三藏十二部
  year_of: 0359
- id: guji-鸠摩罗什-event-enter-changan
  date: 0401-12
  title_zh: 入长安居逍遥园
  description: 姚秦弘始三年姚兴遣使迎至长安，礼为国师，居逍遥园，敕集义学沙门千人设译场
  year_of: '0401'
- id: guji-鸠摩罗什-event-teach-start
  date: '0402'
  title_zh: 开讲弘法
  description: 于逍遥园及大寺讲说中观般若，听众常千人以上，僧肇僧叡道融等执笔参译兼受学
  year_of: '0402'
- id: guji-鸠摩罗什-event-translate-shoulengyan
  date: 0409
  title_zh: 译佛说首楞严三昧经三卷
  description: 译出首楞严三昧经，具载坚意菩萨所问及佛说首楞严三昧百种功德与六度本事果报
  year_of: 0409
- id: guji-鸠摩罗什-event-teach-peak
  date: '0410'
  title_zh: 门徒三千学风鼎盛
  description: 讲译并行，门下三千，四哲八俊成形，华夏空宗以此大兴
  year_of: '0410'
- id: guji-鸠摩罗什-event-death
  date: '0413'
  title_zh: 示寂长安
  description: 弘始十五年示寂于长安，临终发誓所译无谬则舌根不坏，后火化舌不焦烂
  year_of: '0413'
