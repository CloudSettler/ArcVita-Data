  place: 西域龟兹国
  description: 父鸠摩罗炎天竺婆罗门，母耆婆龟兹王女，什生于龟兹，七岁随母出家
- id: guji-鸠摩罗什-event-study
  title_zh: 随母出家转学大乘
  date: '0353'
  year_of: 353
  place: 罽宾及沙勒
  description: 九岁至罽宾从槃头达多学小乘，十二岁至沙勒遇须耶苏摩，改学大乘中观，日诵千偈名振西域
- id: guji-鸠摩罗什-event-capture
  title_zh: 为吕光所俘滞留凉州
  date: 0384
  year_of: 384
  place: 凉州姑臧
  description: 苻坚遣吕光伐龟兹得什，闻苻坚败遂留凉州十七年，虽处戎旅仍讲经授徒
- id: guji-鸠摩罗什-event-changan
