    labels:
      zh: 教以活道
    start_date: -0999-06-16
    highlight_event_id: guji-鹿母-event-teach
  - key: climax
    name: 携子赴信
    labels:
      zh: 母子同还
    start_date: -0999-06-16
    highlight_event_id: guji-鹿母-event-return
  - key: closure
    name: 感猎化国
    labels:
      zh: 举国归正
    start_date: -0999-06-16
    highlight_event_id: guji-鹿母-event-release
  decisions:
  - date: -0999-06-16
    title_zh: 决计还赴猎所不留虚伪偷生
    rationale: 宁就至诚死终不欺殆生制意离贪然后大安毕故不造新
  - date: -0999-06-16
    title_zh: 携二子同还以明母子一心
    rationale: 二子慕母情痛欲并就死与其独生不如同证至诚令猎者睹信益深
events:
- id: guji-鹿母-event-birth
  date: -1000-01-01
  year_of: '-1000'
  title_zh: 林薮受身为鹿母
  description_zh: 以宿世贪残不信罪福之业受鹿身怀妊随群逐水草
  location_zh: 林薮山泽
- id: guji-鹿母-event-trapped
  date: -0999-06-15
  year_of: -0999
  title_zh: 误堕猎弶叩头求哀
  description_zh: 国王出猎群鹿分迸母鹿怀妊独逝饥疲堕弶被执悲鸣乞假暂还视二子
  location_zh: 猎者弶边
- id: guji-鹿母-event-vow
  date: -0999-06-15
  year_of: -0999
  title_zh: 低头涕泪立重誓
  description_zh: 自陈非鬼魅以宿罪受畜形设不来还罪过斗乱僧破塔害父母愿以剖肝露诚取信猎者初不肯听再三悲偈自誓
  location_zh: 猎者弶边
- id: guji-鹿母-event-farewell
  date: -0999-06-16
  year_of: -0999
  title_zh: 蒙放还林悲别二子
  description_zh: 猎者解弶放遣鹿母顾驰至子所嗅舐悲吟说一切恩爱皆因缘合会有别离之偈
  location_zh: 深林巢处
- id: guji-鹿母-event-teach
  date: -0999-06-16
  year_of: -0999
  title_zh: 示水草诫生活之道
  description_zh: 将二子入林示好水草诫以依群随侣慎勿独游食走道边并说前世欺诈残生今当毕对赴期之偈
  location_zh: 林薮水草处
- id: guji-鹿母-event-return
  date: -0999-06-16
  year_of: -0999
  title_zh: 携子还弶践信就死
  description_zh: 与子死别后径还猎者卧树下低头大声说还就刀几之偈二子追寻亦至猎者惊起慈心遂发
  location_zh: 猎者树下弶所
- id: guji-鹿母-event-release
  date: -0999-06-16
  year_of: -0999
  title_zh: 猎者感化放鹿归山
  description_zh: 猎者叹鹿信过人稽首辞谢以慈心遣鹿猎者遂坏弶放弩诣寺归戒白王王令举国废邪归正奉三尊五戒
  location_zh: 猎场及王宫
- id: guji-鹿母-event-death
  date: -0999-12-31
  year_of: -0999
  title_zh: 归深林寿终示本生因
  description_zh: 母子相得鸣群啸侣安于峻山草泽后佛记尔时鹿母即我身二子即罗云朱离母国王即舍利弗猎者即阿难调达为白王之人以显宿因
  location_zh: 峻山深林
