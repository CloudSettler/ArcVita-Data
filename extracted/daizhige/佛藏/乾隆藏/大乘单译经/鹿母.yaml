  dilemmas:
  - 怜子求生与践信赴死难以两全
  - 以贱畜之身取信于猎者难以见信
  - 母子俱亡与以一身代死保全幼子之抉择
  lesson: 以至诚守信虽死不负以慈悲济孤化暴为仁信可感天地虽畜类亦能弘道
  summary_first_person: 吾昔以宿世贪残之业受鹿母之身怀妊游于林薮误堕猎者弶中叩头乞哀愿暂还视二子示以水草复还就死立重誓虽破僧坏寺害父母之罪不逾违信猎者初疑后感听吾暂去吾还林悲别二子教以无常群居自全之道遂携子还赴信期猎者为诚所感愧而放遣举国由是舍邪归正
  source_urls:
