    title_zh: 叩头乞假愿见二子后还就死
    rationale: 去则子存留则子亡分死全子虽贱畜甘死不恨以信全慈
  - date: -0999-06-15
    title_zh: 发破僧坏寺害亲之重誓以明不违
    rationale: 人畜相疑非重誓无以取信宁受分裂痛无为虚伪存以至诚证心
- id: guji-鹿母-endeavor-2
  title_zh: 慈育双子化猎化国
  summary_zh: 假得须臾还视双犊示以水草群居自全之道说无常因缘离别之法携子同还感猎者归仁遂令国王废邪归正举国奉持三尊五戒
  phases:
  - key: brewing
    name: 顾复嗅舐
