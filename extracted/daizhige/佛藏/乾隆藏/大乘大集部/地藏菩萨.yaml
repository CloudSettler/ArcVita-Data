  decisions:
  - date: -2000
    title_zh: 发坚固誓如大地
    rationale: 令一切众生皆得受用善根芽茎华果润泽成熟故
  - date: -0480
    title_zh: 现种种身随应说法
    rationale: 或现梵天帝释声闻罗刹地狱等身显示三乘令住不退故
- id: guji-地藏菩萨-endeavor-2
  title_zh: 赴佉罗堤耶山大会供养护法
  description: 与八十频婆那由他菩萨自南方来，现瑞雨华，以供养散华说咒增长四众福慧护持正法。
  phases:
  - key: brewing
