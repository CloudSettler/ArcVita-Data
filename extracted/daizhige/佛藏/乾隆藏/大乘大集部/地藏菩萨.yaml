  dilemmas:
  - title_zh: 住胜菩提与不舍众生之两难
    description: 欲速得无上道又誓不舍一众生故留五浊成熟有情
  - title_zh: 现神通庄严与现沙门质朴之权衡
    description: 既以神通雨香华宝光令生信又以沙门像慈悲摄受令亲近
  lesson: 以坚固大愿如大地成熟众生称名归依皆得救度安置涅槃
  summary_first_person: 我久于无量佛所发愿如大地，于五浊恶世成熟众生，赴佉罗堤耶山供养世尊，以三昧神通令病愈缚解饥饱怖除，更说增长利益咒护持四众，誓不舍一众生皆住不退转。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘大集部/佛说大方广十轮经.md
  - https://daizhige.org/佛藏/乾隆藏/大乘大集部/佛说大方广十轮经.html
