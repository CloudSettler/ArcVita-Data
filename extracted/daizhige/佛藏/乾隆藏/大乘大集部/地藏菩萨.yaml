    start_date: -0480
    highlight_event_id: guji-地藏菩萨-event-offering
  - key: closure
    name: 付嘱护法
    labels:
      zh: 济度四天
    start_date: -0480
    highlight_event_id: guji-地藏菩萨-event-offering
  decisions:
  - date: -0480
    title_zh: 率大菩萨众赴会听法
    rationale: 为礼拜供养恭敬世尊欲见大众集会欲听经法起随喜故
  - date: -0480
    title_zh: 说增长利益咒济度四天下
    rationale: 为增长比丘等寿命色力信戒多闻慈悲智慧涅槃威德除苦系缚故
events:
- id: guji-地藏菩萨-event-birth
  title_zh: 久远劫前发愿诞生
  date: -2000
  year_of: -2000
  description: 于过去无量恒河沙佛所久发大悲坚固誓愿如大地成熟一切众生
- id: guji-地藏菩萨-event-samadhi
  title_zh: 修入无量三昧成熟国土
  date: -320
  year_of: -500
  description: 游戏师子光智明电光等三昧，所至佛土变宝地除疾疫刀兵饥馑令众生入定离怖
- id: guji-地藏菩萨-event-arrival
  title_zh: 自南方来赴佉罗堤耶山大会
  date: -0480
  year_of: -480
  description: 与八十频婆那由他菩萨俱作声闻像，雨香华衣服璎珞宝光，两手出如意珠光明见十方佛
- id: guji-地藏菩萨-event-rescue
  title_zh: 称名救苦成熟众生
  date: -0480
  year_of: -480
  description: 众生饥渴乏衣系狱水火毒蛇罗刹等怖称名归依悉得解脱安住涅槃得第一乐
- id: guji-地藏菩萨-event-offering
  title_zh: 散华供佛说增长利益咒
  date: -0480
  year_of: -480
  description: 以天华香华璎珞散佛成宝盖，发愿增长四众寿命色力眷属信戒施忍智慧涅槃并说咒护世
- id: guji-地藏菩萨-event-death
  title_zh: 不取涅槃常住度生
  date: 9999-12-31
  year_of: 9999
  description: 誓不舍一众生常现种种身说法，关闭地狱鬼畜饥馑刀兵劫度脱无量众住不退转
