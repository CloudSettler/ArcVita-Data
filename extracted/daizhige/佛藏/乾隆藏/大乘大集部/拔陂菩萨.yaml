  dilemmas:
  - title_zh: 在家白衣云何得海藏定
    description_zh: 身为白衣受五戒而欲得菩萨甚深定意不忘不退当以何行见十方佛
  - title_zh: 不往彼国云何面见阿弥陀
    description_zh: 未得天眼天耳神足不生彼国而住此世云何见西方阿弥陀佛闻法奉行
  lesson: 常念在前精进不懈戒净独处一日至七日即得现前见佛闻法如梦如影皆从意作
  summary_first_person: 吾为拔陂与五百白衣菩萨俱会罗悦只竹园整服叉手请问如来菩萨定海藏蒙佛教以现在佛面住定专念西方阿弥陀即得见佛弘此念佛见佛之道
  source_urls:
