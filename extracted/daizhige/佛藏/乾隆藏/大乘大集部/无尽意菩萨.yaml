  lesson: 发菩提心清净坚固行六度四摄化众生即入无尽智海
  summary_first_person: 我是无尽意菩萨，本住东方不眴世界亲近普贤如来，得念佛三昧无生忍，率六十亿菩萨至王舍城谒释迦佛，现瑞赞叹，与舍利弗问答来去，宣说发心净心行持无尽法门，愿一切众生同证无尽
