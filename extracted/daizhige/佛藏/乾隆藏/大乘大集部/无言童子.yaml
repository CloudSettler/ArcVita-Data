    title_zh: 受天教而结舌无言
    rationale: 顺虚空大音抱道思经，舍方俗美辞，守柔顺以养道胎
  - date: -0492
    title_zh: 随父母知识诣佛求证
    rationale: 虽无言而心怀大愿，欲于佛前显发本愿以决众疑
- id: guji-无言童子-endeavor-2
  person_qid: guji-无言童子
  title_zh: 以偈赞佛广说正见化众
  summary_zh: 于耆阇崛大会中踊身虚空以偈赞佛，对舍利弗及大众广说六度无极与承他音思惟正见，令千二百人发无上道意六万菩萨得无生法忍
  phases:
