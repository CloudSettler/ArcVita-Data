    start_date: -0492
    highlight_event_id: guji-无言童子-event-teach
  decisions:
  - date: -0492
    title_zh: 以无言而兴大哀问法
    rationale: 了众生本空而起众生想，故不住言辞以哀心咨问如来不断佛种
  - date: -0492
    title_zh: 以音声说无所说之法
    rationale: 知言辞托空但假名，为报师恩孝顺反复，开不二法门令法久住
events:
- id: guji-无言童子-event-birth
  person_qid: guji-无言童子
  type: birth
  title_zh: 生于王舍城师子将军家号无言
  date: -320
  year_of: -500
  location_zh: 王舍城师子将军府
  description_zh: 第一夫人怀孕，天于虚空唱大音嘱童子抱道思经莫说世谈，儿生七日颜貌悦豫未曾啼泣不出婴儿之相，父母知识因号无言
- id: guji-无言童子-event-meet
  person_qid: guji-无言童子
  type: career
  title_zh: 八岁随父母诣耆阇崛山见佛
  date: -0492
  year_of: -492
  location_zh: 王舍城耆阇崛山
  description_zh: 八岁渐长，四方来观无厌，遂与父母五亲知识诣佛所稽首绕佛，舍利弗问其前世余殃无声之故，佛证其为供养无数佛得不退转当成正觉之大士
- id: guji-无言童子-event-praise
  person_qid: guji-无言童子
  type: career
  title_zh: 化莲现瑞踊空以偈赞佛
  date: -0492
  year_of: -492
  location_zh: 耆阇崛山佛前大会
  description_zh: 入三昧现瑞令众会右掌化生车轮大莲华上有化菩萨，口宣归命时六反震动天雨众华，承佛威神踊在空中去地四丈九尺，与众异口同音以偈赞佛道空无相
- id: guji-无言童子-event-teach
  person_qid: guji-无言童子
  type: career
  title_zh: 广说六度贤圣正见开化大会
  date: -0492
  year_of: -492
  location_zh: 耆阇崛山大会
  description_zh: 对舍利弗及众会说布施持戒忍辱精进禅定智慧皆假名无像如虚空，又问答承他音思惟正见及不二入法门，令千二百人发无上道意一万菩萨得正见六万菩萨得无生法忍
- id: guji-无言童子-event-death
  person_qid: guji-无言童子
  type: death
  title_zh: 示寂未详功圆道后
  date: -272
  year_of: -420
  location_zh: 未详
  description_zh: 本经但记其八岁说法化众得佛授记不退转当成无上正真之道，未载示寂时地，系传其菩萨行圆满之终
