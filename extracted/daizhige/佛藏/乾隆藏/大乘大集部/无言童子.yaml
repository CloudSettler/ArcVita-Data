  - 当执言教名相还是证无相空义以显六度
  lesson: 慎言守道不著言相，以无言之智行有言之慈，方为孝顺报恩与大精进
  summary_first_person: 吾生于王舍城师子将军家，初生即闻空中天音教吾抱道思经莫尚世谈，故八岁未尝发言，人号无言，后诣耆阇崛山见佛，蒙佛印证为得不退转大士，踊身虚空以偈赞佛，广说布施持戒忍辱精进禅定智慧及贤圣正见，开化无量众会
