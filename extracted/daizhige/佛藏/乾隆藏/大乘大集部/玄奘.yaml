  decisions:
  - date: 0629
    title_zh: 轻生西涉
    rationale: 东土旧疏纷执难解，不亲梵文无以决疑，故宁蹈艰难而访道西域
  - date: '0645'
    title_zh: 奉表归国弘传
    rationale: 已集如来所说菩萨所传，愿还转觉道以济群迷，故负经归朝待诏翻译
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译大乘大集地藏十轮经
  goal_zh: 詳明旧本，明末法十轮教义，令三宝种性久住
  role_zh: 奉诏译主
  phases:
  - key: brewing
    name: 杜绝外虚详至释
    labels:
      zh: 染翰筹译
    start_date: 0648
    highlight_event_id: guji-玄奘-event-return
  - key: breakthrough
    name: 永徽二年重启梵文
    labels:
      zh: 重启梵夹
    start_date: '0651-01-27'
    highlight_event_id: guji-玄奘-event-translate-shilun
  - key: climax
    name: 八品十卷毕功处座抗谈
    labels:
      zh: 十卷毕功
    start_date: '0651-12-31'
    highlight_event_id: guji-玄奘-event-translate-shilun
  - key: closure
    name: 弘末法十轮永济来者
    labels:
      zh: 永济来者
    start_date: '0652'
    highlight_event_id: guji-玄奘-event-translate-shilun
  decisions:
  - date: '0651-01-27'
    title_zh: 咨请重译十轮
    rationale: 旧经谱第遗目傅人失记，旧本已有者更详明，旧本所无者具载，故请重启梵文以正末法药性
  - date: '0651-12-31'
    title_zh: 以十轮显护国三宝
    rationale: 末法败根类石田臭身，当以十轮濯秽陶器，示声闻形化无惭，成三乘道果令正法久住
