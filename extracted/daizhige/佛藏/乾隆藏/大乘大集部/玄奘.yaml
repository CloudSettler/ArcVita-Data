      raw: 唐麟德元年二月五日长安玉华宫
  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐
  reign_ref: 唐太宗贞观至高宗麟德
  archetype: 西行求法译经师
  dilemmas:
  - 生死轻置与求法重任之抉择
  - 旧译纷执与梵本重校之辨正
  - 声闻形与菩萨愿之权实会通
  lesson: 轻一身性命以穷秘藏，竭诚译演以济末法，权实同归而不舍本愿。
  summary_first_person: 我是玄奘，幼学东朝，疑经义纷执，冒禁西行，历数万艰难，穷龙宫秘藏，归蒙恩诏翻译，于永徽二年译出大乘大集地藏十轮经十卷，愿此末法之教久住成熟有情。
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/大乘大集部/大乘大集地藏十轮经.html
  - https://zh.wikisource.org/wiki/大乘大集地藏十轮经
