- id: guji-玄奘-event-translate-shilun
  title_zh: 永徽二年译大乘大集地藏十轮经
  date: '0651-01-27'
  year_of: 651
  place_zh: 长安
  description_zh: 自正月乙未至十二月甲寅译毕，凡八品十卷，详明旧本以化末法，演地藏无量定力成熟有情
- id: guji-玄奘-event-death
  title_zh: 麟德元年寂于玉华宫
  date: '0664-02-05'
  year_of: 664
  place_zh: 长安玉华宫
  description_zh: 译经毕功后示寂，后贤传灯永济来者
