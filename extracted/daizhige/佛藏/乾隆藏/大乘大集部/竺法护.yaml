  era: 西晋
  reign_ref: 西晋武帝至惠帝
  archetype: 译经弘法高僧
  dilemmas:
  - 梵本浩繁而华俗好简当直译存真或润文易晓
  - 西域道远戎乱迭起当安居敦煌或冒难西行求法
  - 大乘深法世难信受当独善自守或以大哀普化开演
  lesson: 以大哀为怀不避艰险广求梵本精勤翻译则能续佛慧命普济群生
  summary_first_person: 吾月氏后裔幼居敦煌八岁出家诵经日万言游西域三十六国得梵本东归于长安洛阳译大哀等百余部不辞劳苦唯愿众生离尘劳苦同入佛境
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%A4%A7%E9%9B%86%E9%83%A8/%E5%A4%A7%E5%93%80%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20
