    start_date: 0590-07-10
    highlight_event_id: guji-虚空孕菩萨-event-dharani
  - key: climax
    name: 随形现身除病满愿
    labels:
      zh: 满愿除苦
    start_date: 0590-08-01
    highlight_event_id: guji-虚空孕菩萨-event-dharani
  - key: closure
    name: 令入大乘不退菩提
    labels:
      zh: 授记入地
    start_date: 0590-09-01
    highlight_event_id: guji-虚空孕菩萨-event-dharani
  decisions:
  - date: 0590-07-10
    title_zh: 教烧沉水香顶礼诵持神咒
    rationale: 摄无慈少福众生借香洁身口及咒力感应随福业深浅示现化导
  - date: 0590-08-01
    title_zh: 于梦 daylight 现多身救治
    rationale: 随病者求财求法求官求子等愿示现婆罗门天帝医师父母童男女等身令速愈发菩提心
events:
- id: guji-虚空孕菩萨-event-birth
  date: 0300-01-01
  year_of: 300
  title_zh: 西方示现诞生得无生忍
  description: 经谓得无生法忍已过无数劫具无碍辩才及首楞严三昧知众生心心所趣生年无考系传说示现
  place_zh: 西方
- id: guji-虚空孕菩萨-event-west
  date: 0590-05-01
  year_of: 590
  title_zh: 现摩尼应珠赴佉罗坻迦山会
  description: 佛住佉罗坻迦山时西方摩尼应珠忽现百千帝释宝围绕众色光明隐蔽唯佛光存唯十住及得首楞严者不惊怖
  place_zh: 佉罗坻迦山
- id: guji-虚空孕菩萨-event-pureland
  date: 0590-06-01
  year_of: 590
  title_zh: 变大千为七宝雨宝化莲座
  description: 以神通变三千大千平正七宝合成除秽雨宝幡璎珞香花化宝廊玉女天乐佛顶宝盖及白银茎紫金叶莲座安住其上
  place_zh: 娑婆大千世界
- id: guji-虚空孕菩萨-event-dharani
  date: 0590-07-10
  year_of: 590
  title_zh: 授持咒法救病苦满众愿
  description: 教于空闲烧沉水多伽罗栴檀香澡浴顶礼十方佛诵多地他阿蜜利舍等咒随应现人兽鸟形或隐身出声授一乘方便令人住声闻缘觉乃至十地并治病满财智官位子嗣等愿
  place_zh: 佉罗坻迦山会中
- id: guji-虚空孕菩萨-event-death
  date: 0399-12-31
  year_of: 399
  title_zh: 不取涅槃常住化导
  description: 经谓常化众生无休息为罪苦众生作医师日光拄杖大车闭恶道开天路示现边地沙门婆罗门等身教化不入灭度
  place_zh: 十方示现无定处
