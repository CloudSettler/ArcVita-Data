  decisions:
  - date: 0590-05-01
    title_zh: 先现三昧境界隐众光明
    rationale: 令杂教众生生厌离想破二见执著方堪受世谛庄严教化
  - date: 0590-06-01
    title_zh: 不径示真如而现庄严
    rationale: 若径示无生庄严则天人扰乱乃至八地犹迷故以方便现七宝雨宝化座摄机
- id: guji-虚空孕菩萨-endeavor-2
  title_zh: 授咒开方便普度厄难
  summary_zh: 为堕邪见犯重病苦求愿众生开示顶礼烧香持咒之方便随应现身授一乘道令人住不退乃至十地
  phases:
