  lesson: 以空性为体以方便为用不舍众生随应示现即是真化
  summary_first_person: 我是虚空孕于西方现摩尼应珠赴佉罗坻迦山会心得无生忍具首楞严三昧变秽为净雨宝施安授咒示道愿拔众生厄难令入菩提不退
