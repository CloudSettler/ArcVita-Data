  death_date: '9999-12-31'
  era: 大乘佛教传说时代
  reign_ref: 胜华敷藏如来及释迦牟尼佛住世之时
  archetype: 虚空藏持悲愿救度者
  dilemmas:
  - 以第一义无生庄严示现则八地以下迷闷当如何以俗谛庄严成熟众生
  - 五浊恶世众生犯根本罪善根烧然当如何以方便拔济令住人天解脱
  - 安住实际不依妄想与现神通方便度生之间如何不违中道
  lesson: 以如虚空般无尽悲智包容众生于梦寤之间随应说法拔根本重罪令回向菩提
  summary_first_person: 我是虚空藏顶戴如意宝珠周匝释迦毗楞伽宝于一切香集依闻法已承胜华敷藏佛敕赴娑婆佉罗底翅山觐礼释迦牟尼为五浊众生说破恶业障陀罗尼愿一切犯重罪者皆得救拔
  source_urls:
