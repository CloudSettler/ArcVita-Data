endeavors:
- id: guji-虚空藏菩萨-endeavor-1
  title_zh: 承敕赴娑婆觐礼释迦现瑞庄严
  description: 于一切香集依胜华敷藏佛所受敕与八十亿菩萨乘虚赴娑婆佉罗底翅山以宝珠光明及净土变现为前导
  phases:
  - key: brewing
    name: 闻光启请
    labels:
      zh: 于香集依见东方光明启白胜华敷藏佛
    start_date: -0600-01-01
    highlight_event_id: guji-虚空藏菩萨-event-journey
  - key: breakthrough
    name: 承敕凌虚
    labels:
      zh: 蒙佛许可与八十亿菩萨身升虚空
    start_date: -0500-01-01
    highlight_event_id: guji-虚空藏菩萨-event-journey
  - key: climax
    name: 放光蔽色
    labels:
      zh: 以如意宝珠光蔽日月人天众色唯见虚空
    start_date: -0500-01-15
    highlight_event_id: guji-虚空藏菩萨-event-manifest
  - key: closure
    name: 莲华安坐
    labels:
      zh: 于佛前宝莲华结跏趺坐受众奉迎
    start_date: -0500-02-01
    highlight_event_id: guji-虚空藏菩萨-event-manifest
  decisions:
  - date: -0600-01-01
    title_zh: 启请赴娑婆
    rationale: 见东方光明及众菩萨凌虚而往渴仰彼佛愿往礼觐听法并度恶世众生
  - date: -0500-01-01
    title_zh: 以俗谛庄严摄众
    rationale: 若现第一义无生庄严八地以下皆迷闷故现大庄严变净秽土令众心安
- id: guji-虚空藏菩萨-endeavor-2
  title_zh: 说破恶业障陀罗尼拔济重罪
  description: 为娑婆五浊众生于梦寤现种种形说病说药说陀罗尼拔根本罪令住声闻缘觉大乘乃至十地
  phases:
  - key: brewing
    name: 观察根机
    labels:
      zh: 观众生善根及布施持戒等行业随应示现
    start_date: -0500-03-01
    highlight_event_id: guji-虚空藏菩萨-event-dharani
  - key: breakthrough
    name: 梦寤说法
    labels:
      zh: 于梦寤现梵释天王乃至父母亲属形说正直道
    start_date: -0500-03-15
    highlight_event_id: guji-虚空藏菩萨-event-dharani
  - key: climax
    name: 授持总持
    labels:
      zh: 授破恶业障陀罗尼并教烧香归命之仪
    start_date: -0500-04-01
    highlight_event_id: guji-虚空藏菩萨-event-dharani
  - key: closure
    name: 安置菩提
    labels:
      zh: 令众舍邪见发菩提心住四梵行至不退转
    start_date: -0500-05-01
    highlight_event_id: guji-虚空藏菩萨-event-dharani
  decisions:
  - date: -0500-03-01
    title_zh: 随病与药不断善根
    rationale: 众生身病心狂及贫乏求富等各随所愿现形授药令离苦趣向解脱
  - date: -0500-04-01
    title_zh: 为犯波罗夷者开真路
    rationale: 灌顶王犯五根本罪善根烧然以大慈现生边地示种种形破疑洒秽令升人天
