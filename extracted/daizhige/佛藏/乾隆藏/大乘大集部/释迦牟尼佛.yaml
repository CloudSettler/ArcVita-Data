  dilemmas:
  - 五浊极秽众生福慧减少，以何方便成熟而不舍大悲
  - 声闻禅定易堕决定聚，如何开示不共声闻之菩萨禅本业
  lesson: 以出入息观为本，具禅波罗蜜即具六度，干竭业道烦恼道苦道而化众生
  summary_first_person: 我于佉罗帝山牟尼仙住处集大声闻大菩萨众，为功德天说禅波罗蜜本业，分别共声闻与不共声闻之差别，令五万众生得无生法忍，九万九千菩萨满足禅波罗蜜，无量众生发无上菩提心住不退转
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%A4%A7%E9%9B%86%E9%83%A8/%E5%A4%A7%E9%9B%86%E9%A1%BB%E5%BC%A5%E8%97%8F%E7%BB%8F.html
