    name: 右方宝莲忽然出生
    labels:
      zh: 瑞现 breakthrough
    start_date: -4979-01-01
    highlight_event_id: guji-金刚髻珠-event-garden
  - key: climax
    name: 莲台化生悉陀太子就膝而坐
    labels:
      zh: 化生 climax
    start_date: -4979-06-01
    highlight_event_id: guji-金刚髻珠-event-lotus-birth
  - key: closure
