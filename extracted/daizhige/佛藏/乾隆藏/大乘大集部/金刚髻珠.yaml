  archetype: 转轮圣王式求法者
  dilemmas:
  - 王位统领千世界与正念思惟求解脱如何兼顾
  - 见莲华化生太子之瑞相如何决断往诣佛所
  - 得闻甚深三摩地后如何以神通护持佛法与众生
  lesson: 以王位为舟筏，以正念为津梁，闻法即率众同往，终成护法金刚手
  summary_first_person: 我曾为金刚髻珠大王，于寂静园林正念端坐，见右方宝莲化生悉陀太子，心生欢喜，即率八万四千王子往诣法界摩尼山日光明王如来所，听闻法界缯髻与金刚如来心品三摩地，得五神通，曾作千世界转轮圣王，今愿护持正法不忘此三昧
