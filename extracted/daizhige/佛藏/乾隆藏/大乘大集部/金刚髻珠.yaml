    start_date: -4978-01-01
    highlight_event_id: guji-金刚髻珠-event-audience
  decisions:
  - date: -4980-01-01
    title_zh: 舍宫廷喧闹入寂静园林思惟
    rationale: 欲以正念观悟入三摩地，故离喧闹而端坐思惟
  - date: -4978-01-01
    title_zh: 见瑞相即携太子王子诣佛听法
    rationale: 知莲华化生非偶然，须往法界摩尼山日光明王如来所决疑受法
- id: guji-金刚髻珠-endeavor-2
  title_zh: 诣佛听受三摩地得神通作转轮圣王
  summary_zh: 率八万四千王子及百亿子听受法界缯髻与金刚如来心品三摩地，得五神通，统领千世界护持正法
  phases:
  - key: brewing
    name: 俱诣佛所听受正法
    labels:
      zh: 参诣 brewing
    start_date: -4978-03-01
    highlight_event_id: guji-金刚髻珠-event-audience
  - key: breakthrough
    name: 得闻法界缯髻金刚心品三摩地
    labels:
      zh: 闻法 breakthrough
    start_date: -4978-06-01
    highlight_event_id: guji-金刚髻珠-event-audience
  - key: climax
    name: 得五神通证入三昧
    labels:
      zh: 证得 climax
    start_date: -4977-01-01
    highlight_event_id: guji-金刚髻珠-event-reign
  - key: closure
    name: 作千世界转轮圣王化育
    labels:
      zh: 转轮 closure
    start_date: -4975-01-01
    highlight_event_id: guji-金刚髻珠-event-reign
  decisions:
  - date: -4978-06-01
    title_zh: 一心受持法界缯髻金刚心品
    rationale: 此三摩地能系缚众魔摄取苦恼众生，故愿求受持不忘失
  - date: -4975-01-01
    title_zh: 以转轮王位护持佛刹教化王子
    rationale: 有大自在力当统领千界，以王威德令百亿子同闻正法同发菩提
events:
- id: guji-金刚髻珠-event-birth
  title_zh: 金刚髻珠诞生于摩尼宝金银所成世界
  date: -5000-01-01
  year_of: -5000
  place_zh: 摩尼宝金银所成世界
  description_zh: 过去世生于清净宝土，后为转轮圣王，号金刚髻珠
- id: guji-金刚髻珠-event-garden
  title_zh: 寂静园林端坐右方现众宝莲华
  date: -4980-01-01
  year_of: -4980
  place_zh: 微妙音声园苑寂静园林
  description_zh: 结加趺坐正念思惟，座右忽然出生大莲华，以栴檀为茎阎浮檀金为叶摩尼为须甄叔迦宝为台
- id: guji-金刚髻珠-event-lotus-birth
  title_zh: 莲台化生悉陀太子膝上而坐
  date: -4979-06-01
  year_of: -4979
  place_zh: 寂静园林莲华台上
  description_zh: 众宝莲台上化生悉陀太子，具二十八大丈夫相，下台于王右膝上坐，王生欢喜爱念
- id: guji-金刚髻珠-event-audience
  title_zh: 率八万四千王子诣日光明王如来听法
  date: -4978-06-01
  year_of: -4978
  place_zh: 法界摩尼山日光明王如来佛刹
  description_zh: 将悉陀太子及八万四千王子俱诣佛所，听受法界缯髻与金刚如来心品三摩地，得五神通
- id: guji-金刚髻珠-event-reign
  title_zh: 作千世界转轮圣王有百亿子
  date: -4975-01-01
  year_of: -4975
  place_zh: 摩尼宝金银所成世界
  description_zh: 统领千世界乃至十千界，具千子百亿子能破怨敌，皆为今十方来会菩萨，皆为听闻此三摩地故
- id: guji-金刚髻珠-event-death
  title_zh: 示现转轮王业毕今即金刚手菩萨
  date: -4900-01-01
  year_of: -4900
  place_zh: 摩尼宝金银所成世界
  description_zh: 经中所说岂异人乎即金刚手菩萨是，以护法愿力相续不断，忆念三摩地未曾忘失
