    start_date: 0248
    highlight_event_id: guji-康僧会-event-jiansi
  decisions:
  - date: '0241'
    title_zh: 应吴主征召入宫陈法
    rationale: 以正见折服朝议不以神异自炫而以戒定慧为本取信君臣
  - date: '0247'
    title_zh: 请立建初寺度僧弘化
    rationale: 借舍利因缘立僧伽依止使江南始有佛寺僧团正法有托
- id: guji-康僧会-endeavor-2
  title_zh: 译经作序传持法镜
  summary: 译出六度集经等弘扬大乘兼为安玄严调所译法镜经作序阐发居家出家菩萨行
  phases:
  - key: brewing
