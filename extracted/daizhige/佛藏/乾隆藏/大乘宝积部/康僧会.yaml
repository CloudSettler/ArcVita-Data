  era: 三国吴
  reign_ref: 吴大帝赤乌至吴末帝天纪
  archetype: 弘法译师
  dilemmas:
  - 夷夏之辨下以胡僧身份立信于吴地朝野
  - 舍利感应之验与义理弘传之间如何兼顾神异与正法
  - 战乱失师无从质疑之时如何阙疑待后而不妄断
  lesson: 以心为镜以法为鉴化导群生久住三宝
  summary_first_person: 吾先世康居流寓天竺因商徙居交趾少年出家励志弘道赤乌四年浮海南来至于建业孙权召见求验舍利蒙感得应遂建建初寺译经弘法后为法镜作序阐明心为万法之原居家出家皆可修学愿以此镜照破昏惑令正法久住
  source_urls:
