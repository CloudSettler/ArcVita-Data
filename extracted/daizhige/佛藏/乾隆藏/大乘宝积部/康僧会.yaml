    labels:
      zh:
      - 作序明镜
    start_date: '0255'
    highlight_event_id: guji-康僧会-event-preface
  - key: closure
    name: 阙疑待后
    labels:
      zh:
      - 俟后明哲
    start_date: 0280
    highlight_event_id: guji-康僧会-event-death
  decisions:
  - date: '0255'
    title_zh: 为法镜经作序解义
    rationale: 愍时戈未戢义拥不达故缘经立论明心为众法之原居家亦可修菩萨行
  - date: '0252'
    title_zh: 坚持直译质朴不尚文饰
    rationale: 存梵义之真使后学可依纵遭讥为质朴不改其度以显三宝
