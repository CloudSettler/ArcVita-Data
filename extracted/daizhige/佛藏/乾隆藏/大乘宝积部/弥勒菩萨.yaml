    title_zh: 伏地愿佛过身得佛身光
    rationale: 见炎光具向作王如来经行光明无央数变愿后世得身具足如是光色威神故身伏地求证
  - date: -0519-01-01
    title_zh: 不行头目苦施但行悔过劝助
    rationale: 以善权方便安乐之行净国土护一切愿人民奉行十善淫怒痴薄时乃取无上觉故昼夜三时说悔过偈
events:
- id: guji-弥勒菩萨-event-birth
  date: -5000-01-01
  year_of: -5000
  title_zh: 贤行梵志生
  description_zh: 过去十无央数劫前生为梵志长者子名贤行即今弥勒菩萨前身
  place_zh: 阎浮提
- id: guji-弥勒菩萨-event-vow
  date: -5000-01-02
  year_of: -5000
  title_zh: 炎光佛前发愿得忍
  description_zh: 从园观出见炎光具向作王如来身光发愿未来得身如佛伏地请佛过身即得不起法忍眼能洞视耳能彻听身能飞行五通具足并以偈赞佛
  place_zh: 炎光佛经行处
- id: guji-弥勒菩萨-event-ask
  date: -0520-01-01
  year_of: -520
  title_zh: 妙华山问离恶知识法
  description_zh: 于披祇国妙华山恐惧树间问佛菩萨有几法行弃恶道不随恶知识佛次第说一寂静平等道意乃至十金刚等三昧
  place_zh: 披祇国妙华山恐惧树间鹿所聚处
- id: guji-弥勒菩萨-event-vowpractice
  date: -0519-01-01
  year_of: -519
  title_zh: 昼夜三时悔过劝助
  description_zh: 昼夜各三正衣束体叉手下膝著地向十方说我悔一切过劝助众道德归命礼诸佛令得无上慧以此善权得无上道发愿国中人民无垢秽奉行十善乃取正觉
  place_zh: 阎浮提
- id: guji-弥勒菩萨-event-praise
  date: -0520-02-01
  year_of: -520
  title_zh: 以偈赞佛六度降魔
  description_zh: 赞世尊本布施妻子饮食头目护戒如鹖爱毛忍等苦乐精进断恶慧自在降魔转法轮色妙戒德智慧具足光明导御众阿难叹其辩才具足说法无缺减
  place_zh: 披祇国妙华山会中
- id: guji-弥勒菩萨-event-death
  date: 5000-01-01
  year_of: 5000
  title_zh: 未来龙华成佛示灭
  description_zh: 后当来世人民无垢秽奉行十善淫怒痴薄时弥勒当得无上正真道成最正觉依本愿于净国中度众后示现入灭
  place_zh: 未来净国土龙华树下
