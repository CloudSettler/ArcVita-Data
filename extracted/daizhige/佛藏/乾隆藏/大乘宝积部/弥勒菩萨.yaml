  lesson: 以悔过劝助归命诸佛及净国安乐善权成就本愿不随恶知识
  summary_first_person: 我本为贤行梵志见炎光具向作王如来身光巍巍发愿未来得身如佛伏地请佛越身即得不起法忍五通具足我又于披祇妙华山问佛菩萨离恶知识一至十法行昼夜三时束体叉手悔过劝助归命诸佛愿我国人民无垢秽奉行十善淫怒痴薄时乃成佛
