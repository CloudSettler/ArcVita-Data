  date: -0508-02-08
  year_of: -508
  location_zh: 舍婆提城路中
  description_zh: 年十二二月八日弗沙星日出游，遇声闻菩萨，破梵天婆罗门不吉之说，广说三宝，以偈答父王，五百婆罗门闻已发无上菩提心
- id: guji-得无垢女-event-debate-sravaka
