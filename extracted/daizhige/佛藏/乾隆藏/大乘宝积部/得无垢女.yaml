  date: -0508-02-08
  year_of: -508
  location_zh: 舍婆提城路中
  description_zh: 次第难舍利弗智慧常无常，目连神通住众生想法想，富楼那受持说法，迦叶施净，阿兰若，坐禅，天眼，多闻，皆指归不生实际，尊者默然
- id: guji-得无垢女-event-debate-bodhisattva
