  era: 后汉
  reign_ref: 汉桓帝至汉灵帝
  archetype: 译经师
  dilemmas:
  - 梵胡之语幽深微妙，如何以汉文直达其义而不失本旨
  - 大乘初传汉土毁谤多，如何坚持译弘而令众生信乐
  - 独居异域无侣同修，如何忍艰苦而终不废道业
  lesson: 离乡弘法，以译经为度脱，忍谤精进则大义可传于后世
  summary_first_person: 吾本月氏人，汉桓建和中来至洛阳，见汉土未闻大乘深法，便发愿译梵为汉，虽文质朴拙而志在通经，先后译出无量清净平等觉等经，愿后人因文解义，念无量清净佛愿生其国
  source_urls:
