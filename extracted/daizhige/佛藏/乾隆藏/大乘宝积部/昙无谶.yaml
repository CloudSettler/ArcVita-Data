  reign_ref: 北凉沮渠蒙逊玄始承和年间
  archetype: 西域译经持戒弘法者
  dilemmas:
  - 末世破戒亲近染缘当以何三戒摄护求佛智者令不退转
  - 依国王檀越弘译大法与离利养远尘欲持粪扫乞食之衡
  lesson: 一切法空无所得，唯勤修学净持三戒方趣无上菩提
  summary_first_person: 吾本中天竺人，幼丧父而学韦陀，后遇禅师而发菩提，西行罽宾龟兹敦煌而入姑臧，应沮渠蒙逊之请译大涅槃大集三戒诸经，于耆阇崛山会上为迦叶分别三戒，劝离想缚我执，净持戒行，远离末世二十非法，专修慈忍乞食山林，以护佛种
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%AE%9D%E7%A7%AF%E9%83%A8/%E5%A4%A7%E4%B9%98%E5%AE%9D%E7%A7%AF%E9%83%A8%E5%A4%A7%E6%96%B9%E5%B9%BF%E4%B8%89%E6%88%92%E7%BB%8F.html
endeavors:
- id: guji-昙无谶-endeavor-1
  title_zh: 西域学禅持戒成器
  summary: 幼学四韦陀，后师白头禅师学禅，西行罽宾龟兹精研戒定慧，为后译经弘法成其器量
  phases:
  - key: brewing
    name: 幼学韦陀初发心
    labels:
      zh:
      - 幼学求法
    start_date: 0391
    highlight_event_id: guji-昙无谶-event-birth
  - key: breakthrough
    name: 罽宾学禅通戒定
    labels:
      zh:
      - 学戒习禅
    start_date: 261
    highlight_event_id: guji-昙无谶-event-study
  - key: climax
    name: 龟兹敦煌流播声名
    labels:
      zh:
      - 弘化西域
    start_date: 269
    highlight_event_id: guji-昙无谶-event-study
  decisions:
  - date: 261
    title_zh: 不著韦陀往罽宾学禅
    rationale: 知世俗咒术非解脱因，欲求佛智无所得故亲近禅师修空无相
  - date: 269
    title_zh: 东行龟兹姑臧弘化
    rationale: 见西域缘薄中土渴仰，欲以戒定慧利乐东土众生故不辞远行
- id: guji-昙无谶-endeavor-2
  title_zh: 姑臧译传涅槃三戒
  summary: 应北凉沮渠蒙逊迎请居姑臧，译大般涅槃大方广三戒等大乘要典，以三戒正末世破戒之风
  phases:
  - key: brewing
    name: 入姑臧被敬信受
    labels:
      zh:
      - 入凉弘译
    start_date: 273
    highlight_event_id: guji-昙无谶-event-guzang
  - key: breakthrough
    name: 译涅槃三戒敷演
    labels:
      zh:
      - 译经敷教
    start_date: 274
    highlight_event_id: guji-昙无谶-event-sanjie
  - key: closure
    name: 戒行示警遭害圆寂
    labels:
      zh:
      - 以戒殉法
    start_date: 283
    highlight_event_id: guji-昙无谶-event-death
  decisions:
  - date: 273
    title_zh: 居姑臧应请译经
    rationale: 王渴大法众愿弘传，欲令菩提种遍中土故忍谤留凉专事翻译
  - date: 0428
    title_zh: 重译敷演大方广三戒
    rationale: 愍末世比丘亲近比丘尼破戒失菩提，欲以三戒净持摄护正法故详说禁制
events:
- id: guji-昙无谶-event-birth
  date: 0385
  year_of: 385
  title_zh: 诞生于中天竺
  description: 约三八五年诞生中天竺婆罗门家，六岁丧父，十岁随舅学四韦陀，聪慧夙成
- id: guji-昙无谶-event-study
  date: 261
  year_of: 405
  title_zh: 师事白头禅师西行罽宾学法
  description: 遇白头禅师授以禅法，遂往罽宾精研禅定戒律，兼学大乘，后游龟兹敦煌声名大振
- id: guji-昙无谶-event-guzang
  date: 273
  year_of: 421
  title_zh: 至姑臧为沮渠蒙逊敬奉译经
  description: 北凉玄始年间至敦煌姑臧，为沮渠蒙逊迎入国中，始译大般涅槃经等，门徒云集
- id: guji-昙无谶-event-sanjie
  date: 0428
  year_of: 428
  title_zh: 译出大方广三戒经敷演三戒
  description: 于姑臧译出大方广三戒经三卷，演耆阇崛山会上佛为迦叶说三戒，诫离想缚我所，远亲近染缘，净持戒行
- id: guji-昙无谶-event-death
  date: 283
  year_of: 433
  title_zh: 被害圆寂于姑臧
  description: 北凉承和三年以王权猜忌被害于姑臧，年四十九，所译涅槃三戒诸经盛行中土
