    - 法藏
    - 法藏比丘
    - 法藏菩萨
    - 阿弥陀佛
    - 无量寿佛
    en:
    - Dharmakara
    - Amitabha
  lifespan:
    birth:
      date: -10000-01-01
      precision: year
      is_circa: true
      raw: 过去久远劫前为国王
    death:
      date: -09980-01-01
      precision: year
      is_circa: true
      raw: 今已成佛现在西方安乐成佛已来凡历十劫法身常住
  birth_date: -10000-01-01
  death_date: -09980-01-01
  era: 过去久远上古世
  reign_ref: 世自在王如来时
  archetype: 大愿成就者
  dilemmas:
  - 如何摄取二百一十亿诸佛妙土清净之行而建超世独妙之国
  - 如何以兆载永劫修行不虚设我得佛不取正觉之弘誓普济十方
  lesson: 弃国出家五劫思惟发超世四十八愿以无量德行成就安乐净土惠以真实之利
  summary_first_person: 吾本为国王，闻世自在王如来说法，心怀悦豫，发无上正真道意，弃国捐王，行作沙门，号曰法藏，睹二百一十亿刹土，五劫思惟，摄取庄严清净之行，发四十八愿，兆载永劫积植德行，今成佛于西方，去此十万亿刹，世界名曰安乐，号无量寿，普度十方众生。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E5%AE%9D%E7%A7%AF%E9%83%A8/%E4%BD%9B%E8%AF%B4%E6%97%A0%E9%87%8F%E5%AF%BF%E7%BB%8F.html
  - https://zh.wikisource.org/wiki/%E4%BD%9B%E8%AA%AA%E7%84%A1%E9%87%8F%E5%A3%BD%E7%B6%93
endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 弃国出家睹刹取土
  description: 闻世自在王佛说法发心，弃国捐王为沙门，求佛现土，五劫思惟摄取庄严佛国清净之行
  phases:
  - key: brewing
    name: 闻法发心
    labels:
      zh:
      - 闻法悦豫
      - 发无上心
    start_date: -10000-01-01
    highlight_event_id: guji-法藏-event-renunciation
  - key: breakthrough
    name: 诣佛求法现土
    labels:
      zh:
      - 稽首请法
      - 睹见刹土
    start_date: -09999-06-01
    highlight_event_id: guji-法藏-event-vision
  - key: closure
    name: 五劫思惟摄取
    labels:
      zh:
      - 寂静无著
      - 摄取妙行
    start_date: -09998-01-01
    highlight_event_id: guji-法藏-event-vision
  decisions:
  - date: -10000-01-01
    title_zh: 弃国捐王行作沙门
    rationale: 闻佛说法悦豫发无上正真道意故舍位修道号曰法藏
  - date: -09999-06-01
    title_zh: 请佛广宣净土之行
    rationale: 斯义弘深非我境界故愿睹二百一十亿佛刹善恶粗妙而如说修行
- id: guji-法藏-endeavor-2
  title_zh: 发弘誓愿成就安乐
  description: 摄行已竟诣佛陈说四十八愿得地动华雨证信兆载修行而成佛于西方安乐
  phases:
  - key: brewing
    name: 摄行诣佛陈愿
    labels:
      zh:
      - 稽首礼足
      - 愿成净土
    start_date: -09995-01-01
    highlight_event_id: guji-法藏-event-vow
  - key: climax
    name: 发四十八愿感动
    labels:
      zh:
      - 超世弘愿
      - 天雨妙华
    start_date: -09995-06-01
    highlight_event_id: guji-法藏-event-vow
  - key: closure
    name: 兆载修行成佛
    labels:
      zh:
      - 积植德行
      - 安乐现成
    start_date: -09994-01-01
    highlight_event_id: guji-法藏-event-buddhahood
  decisions:
  - date: -09995-06-01
    title_zh: 发设我得佛不取正觉之誓
    rationale: 令国无恶道众生具神通相好十念必生故以大愿摄受十方
  - date: -09994-01-01
    title_zh: 一向专志庄严妙土
    rationale: 具足大愿诚谛不虚故于不可思议兆载永劫积植菩萨无量德行而不生欲觉恚痴
events:
- id: guji-法藏-event-birth
  title_zh: 降生为国王
  date: -10000-01-01
  year_of: -10000
  description: 过去久远劫时为国王，闻世自在王如来说法前世
- id: guji-法藏-event-renunciation
  title_zh: 闻法弃国出家
  date: -10000-06-01
  year_of: -10000
  description: 闻佛说法心怀悦豫寻发无上正真道意弃国捐王行作沙门号曰法藏
- id: guji-法藏-event-vision
  title_zh: 睹刹五劫思惟
  date: -09999-06-01
  year_of: -9999
  description: 蒙世自在王佛广说二百一十亿诸佛刹土悉现与之具足五劫思惟摄取庄严佛国清净之行
- id: guji-法藏-event-vow
  title_zh: 发四十八愿
  date: -09995-06-01
  year_of: -9995
  description: 诣世自在王佛所说设我得佛国无地狱饿鬼畜生乃至十念必生等四十八愿应时普地六种震动天雨妙华
- id: guji-法藏-event-buddhahood
  title_zh: 成佛于西方安乐
  date: -09990-01-01
  year_of: -9990
  description: 兆载永劫积植德行今已成佛现在西方去此十万亿刹世界名曰安乐成佛已来凡历十劫国土七宝清净庄严
- id: guji-法藏-event-death
  title_zh: 法身常住无量寿
  date: -09980-01-01
  year_of: -9980
  description: 光明寿命无有限量除本愿修短自在法身常住安乐接引十方来生快乐安隐未取灭度
