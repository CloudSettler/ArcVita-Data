    rationale: 见众执小乘戒相而疑菩萨权行，故先译善权以显大哀随俗化导之义
  - date: '0305'
    title_zh: 乱中坚持传法
    rationale: 永嘉扰攘而道俗离散，誓不舍众独去，留镇讲译以安人心
