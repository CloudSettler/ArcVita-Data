  dilemmas:
  - 胡汉言语隔阂而梵本难通，当守直译还是以善权会通华俗
  - 西陲战乱流离而求法艰险，当避世自保还是冒难弘化利众
  lesson: 以善权方便随俗入尘，不舍五欲尘劳而导众趣向通慧，终以大哀超度生死
  summary_first_person: 吾本月支裔家于燉煌，八岁出家事师诵习，遍游西域得梵本万轴，归镇长安洛阳，译出慧上菩萨问大善权等经，愿以善权方便随病授药，令众生皆趣无上道
