  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉
  archetype: 译经弘法者
  dilemmas:
  - 身为月氏裔而化于华夏当以胡语梵本为本还是以华言达义为要
  - 天下扰攘干戈将起当栖隐自安还是负经东下广施法护
  lesson: 不辞西行之劳以求梵本不惮翻译之难以信达为宗方能令大乘久住中土
  summary_first_person: 吾家世月氏居于敦煌八岁出家从师诵经慨华夏未备大乘梵本遂携徒西行遍历西域得经携归长安洛阳前后译经百五十余部其郁迦罗越问菩萨行经即明在家出家菩萨戒德者愿后世居家者不染秽垢出家者不舍慈悲共趣无上正真之道
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/大乘宝积部/郁迦罗越问菩萨行经.html
  - https://cbeta.org/result/T0323
