  date: '-520'
  year_of: -520
  place_zh: 舍卫国王宫
  description: 波斯匿王与末利夫人女聪慧利根后适阿踰阇国为胜鬘夫人
- id: guji-胜鬘夫人-event-meet-buddha
  title_zh: 得书向佛感佛现空受记普光如来
  date: '-505'
  year_of: -505
  place_zh: 阿踰阇国宫中
  description: 得父母书赞佛功德说偈仰请佛空中现身叹德礼敬佛记过二万阿僧祇劫当作佛号普光如来
- id: guji-胜鬘夫人-event-ten-vows
  title_zh: 佛前受十大受发三大愿雨花证信
  date: '-505'
  year_of: -505
  place_zh: 阿踰阇宫中对空中佛
  description: 立不犯戒不起慢恚嫉悭为成熟众生不受畜财修四摄救苦折摄犯戒及不忘正法并发正法智说法舍身命护法三愿感天雨花妙音印可
- id: guji-胜鬘夫人-event-lion-roar
  title_zh: 师子吼说摄受正法一乘大方便义
  date: '-504'
  year_of: -504
  place_zh: 佛前大众中
  description: 承佛威神说摄受正法雨福出生大乘能荷四担喻大地四宝藏即六波罗蜜舍身命财得法身及法灭时入法朋大义
- id: guji-胜鬘夫人-event-teach
  title_zh: 广辨一乘法身涅槃究竟归依
  date: '-503'
  year_of: -503
  place_zh: 舍卫祇树给孤独园法会
  description: 说摩诃衍出生二乘阿罗汉有怖畏无究竟乐唯如来得般涅槃三乘入一乘涅槃即法身二归依非究竟究竟在如来
- id: guji-胜鬘夫人-event-death
  title_zh: 示现舍寿归于法界
  date: '-450'
  year_of: -450
  place_zh: 阿踰阇国
  description: 久以摄受正法成熟众生功圆示寂后当往生普光佛国究竟一乘
