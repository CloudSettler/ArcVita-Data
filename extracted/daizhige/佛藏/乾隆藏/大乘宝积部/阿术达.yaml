    title_zh: 以空破三乘执取证
    rationale: 诸法空一无异无所行故无声闻辟支佛摩诃衍之别以显无所住止方为狮子吼
  - date: '-483'
    title_zh: 立愿请他方佛放光为证
    rationale: 欲证初发意菩萨过声闻辟支佛上令大众现见揵陀刹香洁佛说经故入三昧发至诚愿
