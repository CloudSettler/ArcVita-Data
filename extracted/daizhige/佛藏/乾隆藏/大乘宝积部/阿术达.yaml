    title_zh: 不起迎比丘而作狮子吼
    rationale: 若礼畏生死之小乘则习小法故以不起迎显发意菩萨被大铠持大悲胜过声闻辟支佛
  - date: '-483'
    title_zh: 引众喻说菩萨如恒水大船
    rationale: 欲令父王及大众舍牛迹缚筏之小乘转向能饱满大千之菩萨法故说树医船月等喻
- id: guji-阿术达-endeavor-2
  title_zh: 空性辩才折伏大声闻感他方佛现
  summary: 次第与舍利弗目连迦叶须菩提罗云论内外空法身见智感香洁放光明佛放光现刹证初发心过声闻辟支佛上
