    labels:
      zh:
      - 说空
      - 劝发心
    start_date: 0448-01-01
    highlight_event_id: guji-法海-event-preach
  - key: climax
    name: 广说三乘调伏差别
    labels:
      zh:
      - 判三乘
      - 显大乘
    start_date: 0450-01-01
    highlight_event_id: guji-法海-event-preach
  - key: closure
    name: 劝发菩提付法后学
    labels:
      zh:
      - 劝发心
      - 付后学
    start_date: 0460-01-01
    highlight_event_id: guji-法海-event-death
  decisions:
  - date: 0450-03-15
    title_zh: 以大海喻劝学菩萨调伏
    rationale: 声闻调伏少分独处远离，菩萨调伏遍世间行摄无量生死，故举牛迹大海二水之喻劝众学大调伏
  - date: 0455-08-01
    title_zh: 以平等无间劝速得菩提
    rationale: 法界平等无分齐，菩萨住五无间不堕二乘不舍众生，故说此方便令学者不退直趣一切智
events:
- id: guji-法海-event-birth
  title_zh: 刘宋初年诞生出家
  date: 0415-01-01
  year_of: 415
  place: 建康
  description: 生于刘宋初年，少出家为沙门，习梵汉经典，志在译经弘律
- id: guji-法海-event-translate
  title_zh: 第四译出寂调音所问经一卷
  date: 0442-06-01
  year_of: 442
  place: 建康
  description: 译出寂调音所问经，载耆阇崛山会上寂调音问文殊第一义正精进声闻德行及三乘调伏，世尊以牛迹大海为喻叹菩萨调伏
- id: guji-法海-event-preach
  title_zh: 弘说平等法界菩萨调伏
  date: 0450-03-15
  year_of: 450
  place: 建康
  description: 弘说空无相无愿为最，法界平等以众生界为界，劝众发无上菩提心，不以声闻心得生宝住，当以大悲调伏无量众生
- id: guji-法海-event-death
  title_zh: 刘宋末年示寂
  date: 0479-12-31
  year_of: 479
  place: 建康
  description: 化缘既毕示寂，留一卷译经令后世知宝相世界说法及娑婆文殊应辩，正法得以久住
