  dilemmas:
  - 梵本深广华言难尽，如何在文质之间存清净调伏本义
  - 第一义不可言说，如何以言说接引众生而不落戏论取著
  lesson: 离相平等勤行精进，以调伏烦恼为要，不取声闻小果，直趣无上菩提
  summary_first_person: 吾是刘宋沙门法海，第四译出寂调音所问经一名如来所说清净调伏，传王舍城耆阇崛山会上寂调音天子请问文殊师利之缘，明第一义平等与菩萨调伏，愿众生发无上心令正法久住
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
  - https://cbetaonline.dila.edu.tw/zh/T1490
endeavors:
- id: guji-法海-endeavor-1
  title_zh: 第四译出寂调音所问经
  summary: 依梵本译为一卷系于大乘律，具载王舍城八百比丘万二千菩萨会上，寂调音请佛放光迎请宝住世界文殊师利来会问答
