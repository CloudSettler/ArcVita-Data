      - 付嘱
    start_date: 0443-01-01
    highlight_event_id: guji-法海-event-preach
  decisions:
  - date: 0440-06-01
    title_zh: 以调伏为纲定名清净调伏
    rationale: 经明声闻调伏如牛迹水少，菩萨调伏如大海无量，故别题如来所说清净调伏以显大乘律义
  - date: 0442-06-01
    title_zh: 存第一义无言之说直译不饰
    rationale: 第一义不可言说不可喻不可名，若加文饰则落戏论，故存其朴直令空无相无愿之义不失
- id: guji-法海-endeavor-2
  title_zh: 弘宣菩萨调伏与平等精进
  summary: 依经弘说正精进平等法界五无间等义，劝众不堕声闻辟支佛地，发阿耨多罗三藐三菩提心
  phases:
  - key: brewing
    name: 讲演王舍城放光因缘
    labels:
