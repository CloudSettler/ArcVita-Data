  date: -324
  year_of: -504
  place_zh: 罗阅只耆阇崛山
  description: 舍利弗复问欲求佛道当何愿得之佛令昼夜稽首十方佛随喜过去当来现在佛菩萨布施六波罗蜜劝勉说法莫般泥洹集聚福德施与十方人民父母蜎飞蠕动令得佛福自愿度脱未度令得泥洹并说持悔过经昼夜读诵福胜供养天下阿罗汉辟支佛千岁
