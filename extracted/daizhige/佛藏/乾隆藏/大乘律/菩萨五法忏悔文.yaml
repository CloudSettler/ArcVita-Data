endeavors:
- id: guji-菩萨五法忏悔文-endeavor-1
  title_zh: 弘传五法首明忏悔请佛随喜
  summary: 依十方三世佛前首陈破戒重罪至诚忏悔，次请始成正觉及现住诸佛久住说法兼劝菩萨速成正觉，随喜三世福慧以除妒慢愚暗
  phases:
  - key: brewing
    name: 观罪缘起
    labels:
      zh:
      - 忏悔
    start_date: '0520-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-1
  - key: breakthrough
    name: 头面忏除
    labels:
      zh:
      - 灭障
    start_date: '0521-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-1
  - key: climax
    name: 请佛住世
    labels:
      zh:
      - 请法
    start_date: '0522-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-2
  - key: closure
    name: 随喜圆满
    labels:
      zh:
      - 随喜
    start_date: '0523-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-2
  decisions:
  - date: '0520-05-01'
    title_zh: 五体投地陈罪忏悔
    rationale: 明见罪福唯佛能除，不忏则堕恶道不见佛，故先礼十方佛发露四重八重谤法等罪求恶云消
  - date: '0522-03-01'
    title_zh: 诚请道场初成及现住佛久住
    rationale: 众生懈怠无明老死可悲，佛若泥洹法药不布，故请未转法轮者设法，劝已度者方便久住，兼请菩萨于无佛世现觉度生
- id: guji-菩萨五法忏悔文-endeavor-2
  title_zh: 和合福业回向发大誓愿
  summary: 以所修布施持戒定慧解脱一切福业和合回施众生共成无上道，立誓定慧慈悲精进，愿命终睹慈氏悟不退周游供养化度无尽
  phases:
  - key: brewing
    name: 法身立志
    labels:
      zh:
      - 回向
    start_date: '0530-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-3
  - key: breakthrough
    name: 和合施众
    labels:
      zh:
      - 利他
    start_date: '0531-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-3
  - key: climax
    name: 猛风金刚立誓
    labels:
      zh:
      - 誓愿
    start_date: '0532-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-4
  - key: closure
    name: 化度无尽
    labels:
      zh:
      - 成佛不舍
    start_date: '0533-01-01'
    highlight_event_id: guji-菩萨五法忏悔文-event-4
  decisions:
  - date: '0530-08-15'
    title_zh: 一切福业尽回众生
    rationale: 独求泥洹仍滞贵贱生死，法身清净般若解脱须共证，故以虚空真智为量回施成就金刚空慧神通
  - date: '0532-04-01'
    title_zh: 洗心发愿尽未来际度生
    rationale: 回向之后念念慈悲方能保任，愿佛光明灭难化生兜率悟无生忍，虽得佛道转轮泥洹而众生不尽成佛不舍
events:
- id: guji-菩萨五法忏悔文-event-birth
  date: '0502-01-01'
  year_of: 502
  title_zh: 梁代託生传持缘起
  description: 开元附梁录失译之经梁代中土传持，託此秽土值遇如来经法贤圣众为说五法之始
- id: guji-菩萨五法忏悔文-event-1
  date: '0520-05-01'
  year_of: 520
  title_zh: 礼佛陈罪五体忏悔
  description: 对十方三世五眼如来自陈无数劫破戒犯四重六重八重谤法阐提之罪，头面作礼愿恶云消发无上慧
- id: guji-菩萨五法忏悔文-event-2
  date: '0522-03-01'
  year_of: 522
  title_zh: 请佛久住随喜功德
  description: 请初登道场未转法轮诸佛设法药雨润枯槁，请现在佛及菩萨久住速觉，历世妒慢一心悟解随喜三世布施戒定慧解脱功德满十方
- id: guji-菩萨五法忏悔文-event-3
  date: '0530-08-15'
  year_of: 530
  title_zh: 和合福业回施众生
  description: 求法身般若解脱胜利于生死往返中，将一切福业和合回施众生共成无上道，广大如虚空究竟尽法界金刚空慧现前
- id: guji-菩萨五法忏悔文-event-4
  date: '0532-04-01'
  year_of: 532
  title_zh: 洗心发愿化度无尽
  description: 发慧如猛风定如金刚之誓，念念慈悲舍爱著度一切，愿命终佛光除障生兜率睹慈氏悟无生住不退游十方供佛如日照世众生不尽成佛不舍
- id: guji-菩萨五法忏悔文-event-death
  date: '0557-12-31'
  year_of: 557
  title_zh: 梁末示寂经付后世
  description: 五法忏悔文说竟流通，一卷付大乘律藏，后世乾隆藏收录流布为菩萨行者日用忏法
