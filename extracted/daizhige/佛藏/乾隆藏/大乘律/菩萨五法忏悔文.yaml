  archetype: 持戒忏悔弘愿者
  dilemmas:
  - title_zh: 破戒阐提可还净否
    description: 已犯四重六重八重复谤法断善根具足阐提堕三恶道，如何依佛经法贤圣忏除重障令恶云消发无上慧
  - title_zh: 生死往返何以得脱
    description: 生死贵贱往返未得泥洹，如何和合福业回施众生共成无上道而不滞爱著人我
  lesson: 至诚忏悔请佛随喜回向发愿五法相摄罪云可消福慧可兴生死可出终至不退
  summary_first_person: 我自无数劫来不遇善知识造罪破戒堕障，幸遇如来经法贤圣，今以忏悔请佛随喜回向发愿五法洗心，愿恶云消散慧心明朗共成无上道，舍命化生兜率面睹慈氏悟无生忍周游十方度脱群生不舍
