    title_zh: 受雨舍供而咒愿守官五戒
    rationale: 以咒愿结天人护国之缘，又诫去贪侈憍虐快五心以全官德
  - date: -483-12-01
    title_zh: 以四谛因缘四喜摄众向泥洹
    rationale: 鉴疫疠死丧扰心，直示苦集灭道及因缘流转，立念佛法众戒四喜以断恶趣
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 迦毗罗卫诞生
  date: -563-04-08
  year_of: -563
  place: 蓝毗尼
  description: 净饭王之子悉达多诞生，长而出家成等正觉
- id: guji-释迦牟尼-event-yao-shan
  title_zh: 鹞山说七法止阿阇世伐越祇
  date: -483-10-05
  year_of: -483
  place: 王舍鹞山
  description: 对雨舍说越祇七法不危，又敕阿难集众说比丘七教七守等，雨舍罢兵而还
- id: guji-释迦牟尼-event-balianfu
  title_zh: 巴连弗授记建城受供东渡
  date: -483-11-10
  year_of: -483
  place: 巴连弗邑阿卫聚
  description: 说摄心五丰德，见天神护地，授记城以后三事乃坏，受雨舍食咒愿而从瞿昙门津东去说渡河颂
- id: guji-释迦牟尼-event-xiyu
  title_zh: 喜豫邑说四谛十二因缘
  date: -483-12-01
  year_of: -483
  place: 喜豫邑揵祇树下
  description: 答十清信士等生处，广说四谛八行及十二因缘顺逆，劝念佛法众戒四喜得沟港
- id: guji-释迦牟尼-event-weiyeli
  title_zh: 维耶离奈园化女众及离车
  date: -483-12-15
  year_of: -483
  place: 维耶离奈氏园
  description: 诫苾刍观女如画瓶，教健制志惟分别，为奈女说邪淫五妨持戒五福，为离车说如来出世五难自然法
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那揭罗泥洹
  date: -482-02-15
  year_of: -482
  place: 拘尸那揭罗娑罗林
  description: 说方等泥洹经竟，唱入灭度，度岸升仙，令弟子缚解致泥洹
