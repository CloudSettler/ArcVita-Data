    title_zh: 以越祇七法谏止伐国
    rationale: 不直言可伐不可伐，而陈奉法和合则不可危，令自悟退兵
  - date: -483-10-10
    title_zh: 以国法转训苾刍持法
    rationale: 借世间治国之喻，立出世七教七守，令僧团和合正法久住
