  title_zh: 祇园门外正观如来问答
  date: -0480-01-01
  year_of: -480
  location_zh: 舍卫国祇树给孤独园
  description_zh: 明相现时先至佛所门外立，答佛问正观如来如如不动无生灭相，与舍利弗论众生界如佛界不增不减，不住法住般若。
- id: guji-文殊师利-event-2
  person_qid: guji-文殊师利
  type: career
  title_zh: 说不思议三昧福田感地动
  date: -0480-06-01
  year_of: -480
  location_zh: 舍卫国祇树给孤独园
  description_zh: 答佛不住佛乘不坐道场实际平等义，说不思议定一切众生成就，说福田无差别相，大地六种震动，万人得无生法忍得法眼净。
