    highlight_event_id: guji-文殊师利-event-1
  - key: breakthrough
    name: 般若无住开显
    labels:
      zh:
      - 无住
      - 空性
    start_date: -0480-01-01
    highlight_event_id: guji-文殊师利-event-1
  - key: climax
    name: 众生界不增不减辨析
    labels:
      zh:
      - 众生界
      - 度生
    start_date: -0480-01-01
    highlight_event_id: guji-文殊师利-event-1
  decisions:
  - date: -0480-01-01
    title_zh: 以不住法住般若
    rationale: 不见法可取舍，不见生死涅槃差别，故不住而住，无住相即住般若
  - date: -0480-01-01
    title_zh: 说众生界不增不减
    rationale: 众生定相不可得，虽度恒沙众生入涅槃而界无增减，破增减执著
- id: guji-文殊师利-endeavor-2
  person_qid: guji-文殊师利
  title_zh: 说不思议定与福田无差别
  summary_zh: 答佛问住般若善根增减，开示无增无减，论不思议三昧人人成就，说福田无差别相感地动得忍。
  phases:
  - key: brewing
    name: 答住般若无增减
    labels:
      zh:
      - 无增减
      - 法界
    start_date: -0480-06-01
    highlight_event_id: guji-文殊师利-event-2
  - key: breakthrough
    name: 不思议定开示
    labels:
      zh:
      - 不思议定
      - 心相
    start_date: -0480-06-01
    highlight_event_id: guji-文殊师利-event-2
  - key: closure
    name: 福田无差别现瑞
    labels:
      zh:
      - 福田
      - 现瑞
    start_date: -0480-06-01
    highlight_event_id: guji-文殊师利-event-2
  decisions:
  - date: -0480-06-01
    title_zh: 不入定而恒与定俱
    rationale: 一切心相即非心，久习成就后无心想，恒与不思议定俱，不见入定之相
  - date: -0480-06-01
    title_zh: 说福田无尽无差别
    rationale: 福田无尽相非明暗生灭，于中修善无增减，令众植善而离取著
