  title_zh: 示现无灭不入涅槃
  date: 0520-01-01
  year_of: 520
  location_zh: 法界实际
  description_zh: 诸佛一相不思议，无生无灭无出世灭度，文殊示现无灭，梁时曼陀罗仙译此经显其不灭之教。
