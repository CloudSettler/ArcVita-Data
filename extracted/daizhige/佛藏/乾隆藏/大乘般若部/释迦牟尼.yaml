  dilemmas:
  - 度尽一切有情而实无有情可度之空有两难
  - 演说甚深般若而实无法可说之言默两难
  - 住世摄受付嘱而须令菩萨无住生心之住脱两难
  lesson: 应无所住而行布施生心，离一切相方见如来，忍辱般若皆从无我中显
  summary_first_person: 吾在室罗筏誓多林，与千二百五十苾刍俱，因善现启问应云何住修行摄心，为发趣菩萨乘者宣说能断金刚般若，令度一切有情而不取有情想，以无住布施成就不可量福聚
