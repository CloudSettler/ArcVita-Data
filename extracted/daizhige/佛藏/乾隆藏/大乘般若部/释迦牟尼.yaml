endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 室罗筏誓多林宣说能断金刚般若
  summary_zh: 于给孤独园答善现三问，以筏喻无住布施非相见如来付嘱末世受持
  phases:
  - key: brewing
    name: 乞食敷座现威仪
    labels:
      zh:
      - 日初乞食
      - 敷座趺坐
    start_date: -498-04-01
    highlight_event_id: guji-释迦牟尼-event-sermon
  - key: breakthrough
    name: 善现三问启般若
    labels:
      zh:
      - 云何住
      - 云何修行摄心
    start_date: -498-04-02
    highlight_event_id: guji-释迦牟尼-event-sermon
  - key: climax
    name: 无住布施非相观佛
    labels:
      zh:
      - 度生无度
      - 福聚无量
      - 相即非相
    start_date: -498-04-03
    highlight_event_id: guji-释迦牟尼-event-sermon
  - key: closure
    name: 立名付嘱流通末世
    labels:
      zh:
      - 名能断金刚
      - 后五百岁受持
    start_date: -498-04-04
    highlight_event_id: guji-释迦牟尼-event-sermon
  decisions:
  - date: -498-04-02
    title_zh: 以度尽有情而无度者答住心
    rationale: 破我等人想，令菩萨发心即离执，方名真发趣菩萨乘
  - date: -498-04-03
    title_zh: 以筏喻说取舍俱遣
    rationale: 法尚应舍何况非法，令末世具戒慧者得一净信生实想
- id: guji-释迦牟尼-endeavor-2
  title_zh: 过去世忍辱修行得燃灯授记
  summary_zh: 昔为忍辱仙人遭羯利王割截无恚，昔于燃灯所无所得故得授记释迦牟尼
  phases:
  - key: brewing
    name: 五百生作忍辱仙人
    labels:
      zh:
      - 远离诸想
      - 修忍辱波罗蜜
    start_date: -2000-01-01
    highlight_event_id: guji-释迦牟尼-event-renru
  - key: breakthrough
    name: 羯利王割截无恚恨
    labels:
      zh:
      - 支节被断
      - 无我想转
    start_date: -1500-01-01
    highlight_event_id: guji-释迦牟尼-event-renru
  - key: climax
    name: 燃灯所无取无证
    labels:
      zh:
      - 无少法可取
      - 无少法可证菩提
    start_date: -1200-01-01
    highlight_event_id: guji-释迦牟尼-event-shouji
  - key: closure
    name: 得授记释迦牟尼
    labels:
      zh:
      - 真实真如
      - 无生法性
    start_date: -1200-01-02
    highlight_event_id: guji-释迦牟尼-event-shouji
  decisions:
  - date: -1500-01-01
    title_zh: 被割截时不生我想有情想
    rationale: 若有我想即应有恚，故以无想无非想守忍辱，证忍辱即非忍辱
  - date: -1200-01-01
    title_zh: 直陈于燃灯所无所得
    rationale: 若有少法可证则授记不实，以无所得故显如来即真如无生，成一切法皆是佛法
events:
- id: guji-释迦牟尼-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 蓝毗尼园诞生
  description: 约公元前五六三年生于迦毗罗卫蓝毗尼园，为净饭王太子，名悉达多
  place_zh: 蓝毗尼园
- id: guji-释迦牟尼-event-sermon
  date: -498-05-01
  year_of: -498
  title_zh: 室罗筏誓多林答善现说般若
  description: 在室罗筏誓多林给孤独园敷座，答具寿善现云何住修行摄心，宣说无住布施非相见佛四句伽陀福胜七宝布施，立名能断金刚般若波罗蜜多
  place_zh: 室罗筏誓多林给孤独园
- id: guji-释迦牟尼-event-renru
  date: -1500-06-01
  year_of: -1500
  title_zh: 为忍辱仙人遭羯利王割截
  description: 过去五百生中为忍辱仙人，被羯利王断支节肉时都无我想有情命者等想，亦非无想，故无恚想
  place_zh: 过去世仙人住处
- id: guji-释迦牟尼-event-shouji
  date: -1200-07-01
  year_of: -1200
  title_zh: 于燃灯佛所得授记释迦牟尼
  description: 昔于燃灯如来所都无少法可取可证，以无所得故燃灯授记汝摩纳婆当来世名释迦牟尼如来应正等觉
  place_zh: 燃灯佛所
- id: guji-释迦牟尼-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 拘尸那揭罗般涅槃
  description: 约公元前四八三年于拘尸那揭罗娑罗双树间入无余依妙涅槃，示一切有为法如梦幻泡影
  place_zh: 拘尸那揭罗
