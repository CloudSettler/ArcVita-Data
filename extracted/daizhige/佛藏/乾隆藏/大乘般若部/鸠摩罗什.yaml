  birth_date: '0344'
  death_date: '0413'
  era: 东晋十六国
  reign_ref: 姚秦弘始
  archetype: 弘译宗师
  dilemmas:
  - title_zh: 小乘精熟而转趣大乘
    description_zh: 罽宾学小乘已负盛名，闻沙勒大乘般若空义而回心，深恐背师别宗，终以实相无碍抉择而弘大乘
  - title_zh: 留凉羁旅与入秦弘译
    description_zh: 吕光留凉十七年，译事不行，若安于西土则名全而法不广，若入关则违旧恩而就弘业，终以利众生故应姚兴之请
  lesson: 以空性不著为宗，重译校定，令般若弘轨可依可学
  summary_first_person: 我生龟兹，七岁出家，遍学小乘而转悟大乘般若，长安逍遥园中重出小品，愿以胡文雅质朴正之译，令学者忘趣要终，不离般若而行
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E8%88%AC%E8%8B%A5%E9%83%A8/%E5%B0%8F%E5%93%81%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BD%97%E8%9C%9C%E7%BB%8F.html
