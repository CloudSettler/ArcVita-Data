    start_date: 0380
    highlight_event_id: guji-鸠摩罗什-event-changan
  decisions:
  - date: '0356'
    title_zh: 舍小趣大
    rationale: 于沙勒遇须利耶苏摩，闻般若诸法实相，知小乘偏空未尽，决意弘大乘空慧
  - date: 0384
    title_zh: 安住凉州不绝讲学
    rationale: 为吕光所留，不得东行，则随缘说法藏器待时，以存法种
- id: guji-鸠摩罗什-endeavor-2
  title_zh: 长安重译小品般若
  summary_zh: 应秦太子之请，于弘始十年重出小品般若，校旧译之失，以朴正之文显空慧弘轨
  phases:
  - key: brewing
    name: 迎入关中
    labels:
      zh:
      - 姚兴敦请
      - 逍遥园译场
    start_date: '0401-12-20'
    highlight_event_id: guji-鸠摩罗什-event-changan
  - key: breakthrough
    name: 太子请重译
    labels:
      zh:
      - 玩味旧译
      - 知失求真
    start_date: '0408-02-06'
    highlight_event_id: guji-鸠摩罗什-event-xiaopin
  - key: climax
    name: 案本重出
    labels:
      zh:
      - 神授真文
      - 芸除荒稼
    start_date: '0408-02-06'
    highlight_event_id: guji-鸠摩罗什-event-xiaopin
  - key: closure
    name: 校都讫定
    labels:
      zh:
      - 四月校讫
      - 十卷流通
    start_date: '0408-04-30'
    highlight_event_id: guji-鸠摩罗什-event-xiaopin
  decisions:
  - date: '0408-02-06'
    title_zh: 应请重出小品
    rationale: 旧译失旨如荒田之稼，太子准悟大品而请，真本犹存，不忍宝典晦昧，故令重译
  - date: '0408-04-30'
    title_zh: 案本直译存朴
    rationale: 胡文雅质，宁存朴正不取丽巧，使般若穷理尽性之言不失，幸后贤略华取实
events:
- id: guji-鸠摩罗什-event-birth
  title_zh: 生于龟兹国
  date: '0344'
  year_of: 344
  place_zh: 龟兹国
  description_zh: 父天竺人鸠摩罗炎，母龟兹公主耆婆，七岁随母出家，奠定译经因缘
- id: guji-鸠摩罗什-event-shache
  title_zh: 沙勒悟大乘般若
  date: '0356'
  year_of: 356
  place_zh: 沙勒国
  description_zh: 十二岁随母返沙勒，从须利耶苏摩学大乘，闻诸法实相，遂回心大乘，精通般若中观
- id: guji-鸠摩罗什-event-changan
  title_zh: 入长安居逍遥园译经
  date: '0401-12-20'
  year_of: 401
  place_zh: 长安逍遥园
  description_zh: 姚兴弘始三年迎入长安，国师礼遇，开译场，众聚三千，般若大品诸经次第重光
- id: guji-鸠摩罗什-event-xiaopin
  title_zh: 弘始十年重出小品般若
  date: '0408-02-06'
  year_of: 408
  place_zh: 长安
  description_zh: 秦太子请令重出，僧叡序云以弘始十年二月六日请令出之至四月三十日校都讫，考旧译如荒田芸稼，正文十卷流通
- id: guji-鸠摩罗什-event-death
  title_zh: 卒于长安
  date: '0413'
  year_of: 413
  place_zh: 长安
  description_zh: 弘始十五年示寂，舌根不坏之瑞传世，所译大小乘经律论三百余卷永弘中土
