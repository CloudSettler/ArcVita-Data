    en: Yijing
  lifespan:
    birth:
      date: '0635'
      precision: year
      is_circa: false
      raw: 贞观九年
    death:
      date: '0713'
      precision: year
      is_circa: false
      raw: 先天二年
  birth_date: '0635'
  death_date: '0713'
  era: 唐
  reign_ref: 高宗至玄宗时
  archetype: 西行译经高僧
  dilemmas:
  - title_zh: 空有判释之争
    description: 西方义隔有空，东夏道分南北，真有俗无与真无俗有各执圣旨，如何会通而不杂滥
  - title_zh: 文隐义阙之忧
    description: 世亲释虽已东传而义有阙如，末后一颂释文既隐，恐寻者尚昧，如何令后学朝览遂闲
  lesson: 以九喻观九事，不住生死不居圆寂，悲智双运方契无住涅槃
  summary_first_person: 吾因译无著菩萨般若颂释既毕，详其九喻文致幽深，重核谈筵，更译本经，又因末后一颂释文既隐，聊以二九事喻题十八之作，冀使后学了星翳灯幻等喻而务真常
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E8%AE%BA/%E7%95%A5%E6%98%8E%E8%88%AC%E8%8B%A5%E6%9C%AB%E5%90%8E%E4%B8%80%E9%A2%82%E8%B5%9E%E8%BF%B0.md
