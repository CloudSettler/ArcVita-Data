  summary_first_person: 我是义净俗姓张自幼慕法显玄奘之志发愿西行咸亨二年浮海赴印度在那烂陀研律十余年携梵本归国奉制译经五十六部以律为宗兼弘因明愿以假说之教令人远离邪执如理作意
