endeavors:
- id: guji-义净-endeavor-1
  title_zh: 海路西行求法取经
  summary: 自咸亨二年由海路经南海至印度，居那烂陀研学瑜伽唯识，历二十余年携梵本东归
  phases:
  - key: brewing
    name: 发愿西行
    labels:
      zh: 酝酿
    start_date: '0671'
    highlight_event_id: guji-义净-event-westward
  - key: breakthrough
    name: 那烂陀研学
    labels:
      zh: 突破
    start_date: '0673'
    highlight_event_id: guji-义净-event-nalanda
  - key: climax
    name: 携经东归
    labels:
      zh: 高潮
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: closure
    name: 入译场奠基
    labels:
      zh: 收束
    start_date: '0700'
    highlight_event_id: guji-义净-event-translate
  decisions:
  - date: '0671'
    title_zh: 决意由南海海路西行
    rationale: 陆路艰阻兵扰不断，欲效法前贤经南海广访诸国佛法，直达印度求亲承瑜伽宗义
  - date: 0695
    title_zh: 携四百部梵本归国
    rationale: 西土所学已成，教流印度如日之升，当使义阐神州，不滞一己之解
- id: guji-义净-endeavor-2
  title_zh: 重译般若颂释并赞述末后一颂
  summary: 核谈筵重译无著般若颂释与世亲七门义释本经，明三性三身真俗般若，又以十八赞述解末后一颂九喻
  phases:
  - key: brewing
    name: 详勘旧译阙如
    labels:
      zh: 酝酿
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 重译颂释本经
    labels:
      zh: 突破
    start_date: '0703'
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 撰略明末后一颂赞述
    labels:
      zh: 高潮
    start_date: '0710'
    highlight_event_id: guji-义净-event-praise
  - key: closure
    name: 以三性会通空有
    labels:
      zh: 收束
    start_date: '0711'
    highlight_event_id: guji-义净-event-praise
  decisions:
  - date: '0703'
    title_zh: 亲核谈筵更译本经
    rationale: 神州虽已译世亲释而义有阙如，雅符释意者当重详其妙，故更译本经以全其义
  - date: '0710'
    title_zh: 因二九事喻作十八赞述
    rationale: 末后一颂一切有为法如星翳灯幻等释文既隐，恐寻者尚昧，故撮要义为述，令朝览夜思无按剑之惑
events:
- id: guji-义净-event-birth
  title_zh: 生于齐州
  date: '0635'
  year_of: 635
  description: 唐贞观九年生于齐州，俗姓张氏，少出家，慕西行求法之志
- id: guji-义净-event-westward
  title_zh: 由广州泛海西行
  date: '0671'
  year_of: 671
  description: 咸亨二年自广州浮海经室利佛逝等南海诸国，赴印度求法
- id: guji-义净-event-nalanda
  title_zh: 居那烂陀寺研学
  date: '0673'
  year_of: 673
  description: 抵印度那烂陀寺，亲承瑜伽唯识宗义，研习声明梵典，传闻月官等多家义释
- id: guji-义净-event-return
  title_zh: 携梵本还抵洛阳
  date: 0695
  year_of: 695
  description: 证圣元年携梵本四百余部东归洛阳，敕住翻经馆主持译场
- id: guji-义净-event-translate
  title_zh: 译无著般若颂释及本经
  date: '0703'
  year_of: 703
  description: 详夫无著于睹史多天亲受八十颂开般若要门，复核谈筵重译颂释与世亲般若七门义释所依本经
- id: guji-义净-event-praise
  title_zh: 撰略明般若末后一颂赞述
  date: '0710'
  year_of: 710
  description: 因末后一颂一切有为法如星翳等释文既隐，以见境识界身用过现未配九喻，作十八赞述明三性三身真俗般若
- id: guji-义净-event-death
  title_zh: 卒于长安
  date: '0713'
  year_of: 713
  description: 唐先天二年卒于长安，谥号鸿胪卿，译经五十余部，赞述传于乾隆藏大乘论部
