  birth_date: '0170'
  death_date: '0270'
  era: 汉末三国至西晋
  reign_ref: 贵霜后期对应中土汉末三国
  archetype: 破邪显正型中观论师
  dilemmas:
  - 以百字少文破一异有无因果诸见而不立自宗云何令人信受实相
  - 遮遣有为无为常无常而世谛取瓶取叠宛然云何安立如梦中道
  lesson: 不立一异有无自性以遮遣除邪见即显平等实相断我我所得证寂灭
  summary_first_person: 我是提婆，归依聪睿师承龙树中观，以百字演实法，破僧佉一相胜论异相有无因果有为三相诸执，示世谛如梦名假无实，舍有舍无断我见证涅槃
