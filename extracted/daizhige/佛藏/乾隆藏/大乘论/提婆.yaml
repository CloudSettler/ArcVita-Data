  place_zh: 南天竺
  summary_zh: 归依聪睿师依止龙树学般若中观得破邪显正要道发愿以少文破多见
- id: guji-提婆-event-debate-poxie
  type: career
  title_zh: 论破一异有无因果
  date: '0215'
  year_of: 215
  place_zh: 中天竺论场
  summary_zh: 破僧佉一切法一相毗舍异相及有相无相有因无因生住灭三相虚空常等执示要誓因法不俱成
- id: guji-提婆-event-compose-baizilun
  type: career
  title_zh: 造百字论演实法
  date: '0240'
  year_of: 240
  place_zh: 中天竺
  summary_zh: 以百字演实法除邪见向实相作偈大人平等相心无染着及一切法无一无异等后为菩提流支于元魏译出一卷
- id: guji-提婆-event-teach-dream
  type: career
  title_zh: 示如梦世谛化众生
  date: '0250'
  year_of: 250
  place_zh: 天竺僧团
  summary_zh: 说世间假名如热时炎音声如响世间如梦教弟子舍有舍无不取无有得证寂灭道勤行修正道
- id: guji-提婆-event-death
  type: death
  title_zh: 示寂
  date: '0270'
  year_of: 270
  place_zh: 天竺
  summary_zh: 约西晋初示寂后百字论流传中土由菩提流支译弘蠲除邪见网众秽灭尽之教不坠
