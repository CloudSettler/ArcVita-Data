  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E8%AE%BA/%E7%99%BE%E5%AD%97%E8%AE%BA.html
endeavors:
- id: guji-提婆-endeavor-1
  title_zh: 承龙树学破一异有无因果诸见
  summary_zh: 承中观要誓因喻反诘破僧佉立一毗舍立异及有无因果自性见
  phases:
  - key: brewing
    name: 归依闻思立破邪宗旨
    labels:
      zh:
      - 归依
      - 闻思
    start_date: 0185
    highlight_event_id: guji-提婆-event-follow-longshu
  - key: breakthrough
    name: 破一破异显要誓自坏
    labels:
      zh:
      - 破一
      - 破异
    start_date: '0210'
    highlight_event_id: guji-提婆-event-debate-poxie
  - key: climax
    name: 破有无因果三相无体
    labels:
      zh:
      - 破有无
      - 破因果
    start_date: '0220'
    highlight_event_id: guji-提婆-event-debate-poxie
  - key: closure
    name: 结归舍有舍无断我见
    labels:
      zh:
      - 遮遣
      - 证入
    start_date: '0230'
    highlight_event_id: guji-提婆-event-compose-baizilun
  decisions:
  - date: '0210'
    title_zh: 离因不立宗以彼过还破彼
    rationale: 若离因立异我亦离因立一若有因则要誓自坏故以反诘破自性要誓
  - date: '0220'
    title_zh: 破因果有为三相不生
    rationale: 因中先有不须作先无不可生次第一一时俱坏故立一切法无生以显无为非相形
- id: guji-提婆-endeavor-2
  title_zh: 以百字演实法示如梦世谛
  summary_zh: 以百字偈论演平等实相示名假如梦如响如炎不断不取证寂灭道
  phases:
  - key: brewing
    name: 集百字立论体式
    labels:
      zh:
      - 立论
      - 集要
    start_date: '0235'
    highlight_event_id: guji-提婆-event-compose-baizilun
  - key: breakthrough
    name: 示名非体色瓶多过
    labels:
      zh:
      - 名假
      - 破实
    start_date: '0240'
    highlight_event_id: guji-提婆-event-compose-baizilun
  - key: climax
    name: 明世谛如梦非有非无非无因
    labels:
      zh:
      - 如梦
      - 中道
    start_date: '0245'
    highlight_event_id: guji-提婆-event-teach-dream
  - key: closure
    name: 付嘱信心求实不趣三有
    labels:
      zh:
      - 付嘱
      - 弘护
    start_date: '0255'
    highlight_event_id: guji-提婆-event-teach-dream
  decisions:
  - date: '0240'
    title_zh: 以名体异显假名无实
    rationale: 若名是体唤瓶即应有用三名不相摄多色多名即多瓶故知名字虚假无实
  - date: '0245'
    title_zh: 立如梦观不断世谛应用
    rationale: 夢非实有亦非是无亦非无因故安立取瓶不取叠而体相空以破取无有证寂灭
events:
