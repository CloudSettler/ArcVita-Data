  reign_ref: 唐太宗贞观至唐高宗麟德
  archetype: 西行求法译经高僧
  dilemmas:
  - 众说纷纭而正义难明，是安于中土旧疏还是冒死西行求本
  - 外境实有还是唯识所现，是执极微和合为实还是立内色为所缘缘
  lesson: 破外执以显唯识，立内境为所缘缘，令学人不逐外尘而返观识变
  summary_first_person: 吾姓陈名祎，洛州人也。少出家，慨然有慕西法。贞观之初，杖锡西行，历流沙，越葱岭，至那烂陀，师事戒贤，尽穷瑜伽唯识之旨。归国之后，奉诏译经。此观所缘缘论者，陈那菩萨所造，破外色极微和合之执，立内色似外而现为五识所缘缘者也。吾敬承诏命，译而传之，愿学者不滞外境，了达识缘而已。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/大乘论/观所缘缘论.md
  - https://daizhige.org/佛藏/乾隆藏/大乘论/观所缘缘论.html
