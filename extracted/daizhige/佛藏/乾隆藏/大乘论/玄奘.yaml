  summary_first_person: 吾姓陈名祎洛州缑氏人也幼慕释典慨中土经阙遂偷渡玉门远赴天竺问道那烂陀负梵本东归奉诏译经十九年译出广百论本等七十五部以破常我时边之邪执弘如来真空妙理愿后学依经求真不堕空有二边
