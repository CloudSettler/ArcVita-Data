    rationale: 陈那破外色极微和合之失，立内色为所缘缘，最契唯识正义，当先译以正学人视听
  - date: '0650'
    title_zh: 存梵本义不徇旧说
    rationale: 极微无相如眼根，和合无体如第二月，宁守梵文实义，不附会旧来外境实有之说
