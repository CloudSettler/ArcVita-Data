  decisions:
  - date: 0629-08
    title_zh: 决意违禁西行
    rationale: 为欲简持经义真实，不顾禁令生死，效法古人西行求法以决所疑。
  - date: '0633'
    title_zh: 留学那烂陀从戒贤
    rationale: 以戒贤通达三藏因明，欲穷源极委，故久住习瑜伽因明诸论。
- id: guji-玄奘-endeavor-2
  title_zh: 归国译经弘传因明
  summary_zh: 奉诏主持译场译出大般若等经及因明正理门论本以正名理
  phases:
  - key: brewing
    name: 慈恩大慈恩立译场
