    start_date: '0647'
    highlight_event_id: guji-玄奘-event-647-yinming
  - key: climax
    name: 弘传唯识因明开悟后学
    labels:
      zh:
      - 弘法
      - 论辩
    start_date: 0648
    highlight_event_id: guji-玄奘-event-647-yinming
  - key: closure
    name: 玉华宫译经示寂
    labels:
      zh:
      - 圆寂
      - 遗教
    start_date: '0663'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0647'
    title_zh: 先译因明正理论式
    rationale: 为欲简持能立能破义中真实，先明宗因喻量式，令后学不谬立破，故译龙树造本论。
  - date: 0648
    title_zh: 专主义理不附权贵
    rationale: 以译经弘法为己任，不以荣利移志，唯以正理为依，教导窥基等门人。
events:
- id: guji-玄奘-event-birth
  date: '0602'
  year_of: 602
  title_zh: 诞生洛州缑氏陈氏家
  description_zh: 隋仁寿二年生于洛州，幼颖悟出家习经，博览众经而生疑。
- id: guji-玄奘-event-629-xixing
  date: '0629-08-01'
  year_of: 629
  title_zh: 自长安西行出玉门
  description_zh: 唐贞观三年乘夜西行，历凉州瓜州偷渡玉门，遍历西域诸国向天竺。
- id: guji-玄奘-event-633-nalanda
  date: '0633'
  year_of: 633
  title_zh: 至那烂陀从戒贤学法
  description_zh: 抵中印度那烂陀寺，师事戒贤，学瑜伽师地论因明声明诸学，声誉大振。
- id: guji-玄奘-event-645-huiguo
  date: '0645-01-25'
  year_of: 645
  title_zh: 负经归国抵长安
  description_zh: 唐贞观十九年携六百余部梵本归长安，太宗亲迎，敕住弘福寺翻译。
- id: guji-玄奘-event-647-yinming
  date: '0647'
  year_of: 647
  title_zh: 译因明正理门论本一卷
  description_zh: 于大慈恩寺译出大域龙树造因明正理门论本，明宗因喻能立能破及现比二量，为因明正理之门。
- id: guji-玄奘-event-death
  date: '0664-02-05'
  year_of: 664
  title_zh: 示寂玉华宫嘉寿殿
  description_zh: 唐麟德元年正月译经功毕示寂，敕葬白鹿原，高宗哀恸罢朝。
