endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行印度求法
  summary_zh: 自长安违禁出关，历西域至印度那烂陀，从戒贤学唯识，十七年而归
  phases:
  - key: brewing
    name: 长安研学立愿
    labels:
      zh: 萌发西行愿
    start_date: '0615'
    highlight_event_id: guji-玄奘-event-xixing
  - key: breakthrough
    name: 偷渡出关西进
    labels:
      zh: 突破禁关远行
    start_date: 0629
    highlight_event_id: guji-玄奘-event-xixing
  - key: climax
    name: 那烂陀深造唯识
    labels:
      zh: 印度问道登峰
    start_date: '0637'
    highlight_event_id: guji-玄奘-event-qiuxue
  - key: closure
    name: 载经归国长安
    labels:
      zh: 学成东归圆满
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-guiguo
  decisions:
  - date: 0629
    title_zh: 违禁偷渡出关
    rationale: 中土众说纷纭无从质正，宁冒禁令西行求亲证，不愿苟安迷误
  - date: '0637'
    title_zh: 师事戒贤专学瑜伽
    rationale: 欲会通大乘正义，须依唯识嫡传深究心识差别，故留那烂陀尽学其奥
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘唯识
  summary_zh: 归国后奉唐太宗高宗诏，领译场译出大般若等众经，并译天亲百法明门以立唯识纲要
  phases:
  - key: brewing
    name: 弘福开馆筹译
    labels:
      zh: 奉诏筹组译场
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-guiguo
  - key: breakthrough
    name: 译出百法明门
    labels:
      zh: 以百法摄一切法
    start_date: 0648
    highlight_event_id: guji-玄奘-event-yijing
  - key: climax
    name: 大般若等巨译弘传
    labels:
      zh: 译经讲学鼎盛
    start_date: 0659
    highlight_event_id: guji-玄奘-event-yijing
  - key: closure
    name: 玉华示寂译业圆满
    labels:
      zh: 示寂玉华遗教后世
    start_date: '0664'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: 0648
    title_zh: 先译百法明门立宗纲
    rationale: 一切法无我难解，先以五位百法摄尽心色等法，令初学得其门径，再弘大部深经
  - date: 0659
    title_zh: 专力大般若不辍译事
    rationale: 纵年迈病侵，愿以残生毕译大经，使中土具足法宝，不负君国与众生之望
