    title_zh: 乱中坚守岭南译场
    rationale: 梁陈鼎革战乱频仍，若还西则法种中断，故留广州专心翻译
- id: guji-真谛-endeavor-2
  person_id: guji-真谛
  title_zh: 译传无相思尘论破外尘执
  summary_zh: 依陈那造论译出无相思尘论，阐明邻虚聚非境，内尘为缘缘，立唯识无境之宗
  phases:
  - key: brewing
