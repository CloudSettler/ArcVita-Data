    rationale: 为摄持正法以无穷之因得无穷之果不惮海途艰险
  - date: 0558-01-01
    title_zh: 居广州制旨寺专事翻译
    rationale: 中原丧乱岭南稍安且海路通梵本可续当安住译经以成熟学人
- id: guji-真谛-endeavor-2
  title_zh: 阐涅槃佛性常住正义
  summary: 依天亲偈论破三世执立本有今有过三世以明如来藏清净常住
  phases:
  - key: brewing
    name: 解纯陀疑
    labels:
      zh:
      - 三世义发端
    start_date: 0560-01-01
    highlight_event_id: guji-真谛-event-2
  - key: breakthrough
    name: 破本有今无等三执
    labels:
      zh:
      - 破邪显正
    start_date: 0562-01-01
    highlight_event_id: guji-真谛-event-2
  - key: climax
    name: 立五常无变义
    labels:
      zh:
      - 无穷无起恒在湛然无变
    start_date: 0563-01-01
    highlight_event_id: guji-真谛-event-2
  - key: closure
    name: 付嘱受用大涅槃
    labels:
      zh:
      - 一切众生归依处
    start_date: 0569-01-01
    highlight_event_id: guji-真谛-event-death
  decisions:
  - date: 0562-01-01
    title_zh: 依义不依语判三世无有是处
    rationale: 若执本有今无则无解脱若执本无今有则坏因缘若执三世实有则碍常住故须破邪
  - date: 0563-01-01
    title_zh: 立本有今有过三世为中道
    rationale: 从发心至金刚后心一味无异离断常二边即见如来现在于世故立正义
events:
