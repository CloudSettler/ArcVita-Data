endeavors:
- id: guji-真谛-endeavor-1
  title_zh: 远航东来梁陈译经弘法
  summary: 自西天竺经扶南至建康，梁末侯景之乱流离岭南，入陈后居建康正观寺译经讲学，译出摄大乘论俱舍论等五十余部
  phases:
  - key: brewing
    name: 西国习学发愿东行
    labels:
      zh: 习学发愿
    start_date: 0499
    highlight_event_id: guji-真谛-event-birth
  - key: breakthrough
    name: 泛海至梁入建康
    labels:
      zh: 初至建康
    start_date: '0546'
    highlight_event_id: guji-真谛-event-arrival
  - key: closure
    name: 遭乱流寓坚持译述
    labels:
      zh: 流离译述
    start_date: 0548
    highlight_event_id: guji-真谛-event-exile
  decisions:
  - date: '0546'
    title_zh: 应梁武帝请泛海东来
    rationale: 为使大乘深义流行东土，不惮海路艰险，承请入华弘法
  - date: '0555'
    title_zh: 乱中南越讲摄大乘论
    rationale: 虽值侯景丧乱道路阻绝，仍就机讲译不断法脉，以摄论开唯识宗风
- id: guji-真谛-endeavor-2
  title_zh: 译传三无性论明法空
  summary: 依世亲无相论出三无性论二卷，以三性说三无性，破分别执显依他如幻，立真实如如为法空正理
  phases:
  - key: brewing
    name: 依无相论抉择三性
    labels:
      zh: 抉择宗要
    start_date: '0557'
    highlight_event_id: guji-真谛-event-exile
  - key: breakthrough
    name: 译出三无性论上下卷
    labels:
      zh: 译出论典
    start_date: '0562'
    highlight_event_id: guji-真谛-event-translate
  - key: climax
    name: 以三无性会通二空
    labels:
      zh: 会通二空
    start_date: '0562'
    highlight_event_id: guji-真谛-event-translate
  - key: closure
    name: 示寂建康付嘱后学
    labels:
      zh: 示寂付嘱
    start_date: 0569
    highlight_event_id: guji-真谛-event-death
  decisions:
  - date: '0562'
    title_zh: 先明人空次显法空
    rationale: 为除斗诤多闻正行三虚妄论，先以空品破烦恼障，次以无性品通除智障
  - date: '0562'
    title_zh: 以相无生无性释三性
    rationale: 为使分别依他真实三性同一无性正理，以无相无生无性为性，离有无两执显非安立谛
