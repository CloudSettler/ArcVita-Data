  decisions:
  - date: '0557'
    title_zh: 首译无相思尘论明无外境
    rationale: 外人执邻虚聚为实境，故译此论，明外尘非境，内相为尘，以正视听
  - date: '0560'
    title_zh: 以胜能为根互为因释经
    rationale: 为会通经说依根缘色生识，故立功能为根，内尘为境，更互为因
