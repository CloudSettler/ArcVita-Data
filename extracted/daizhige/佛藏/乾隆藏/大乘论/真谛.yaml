  date: 0546-01-01
  year_of: 546
  description: 应梁武帝请由扶南浮海至广州建业值侯景之乱转徙岭南
- id: guji-真谛-event-2
  title_zh: 广州译涅槃经本有今无偈论
  date: 0563-01-01
  year_of: 563
  description: 于广州制旨寺译天亲所造涅槃经本有今无偈论阐三世义解纯陀疑问立常乐我净
- id: guji-真谛-event-death
  title_zh: 示寂于广州
  date: 0569-01-01
  year_of: 569
  description: 太建元年示寂于广州世寿七十一荼毗得舍利弟子慧恺等传其学开摄论宗
