  birth_date: 0499-01-01
  death_date: 0569-01-01
  era: 南北朝梁陈
  reign_ref: 梁武帝大同至陈宣帝太建初
  archetype: 译经弘法者
  dilemmas:
  - 梵本赜隐难晓而中土学人亟求佛性常住正义
  - 依语言立三世有无则谤大乘依义立本有今有则难契小机
  - 梁末丧乱流寓岭南译场难立而弘法之志不舍
  lesson: 不依语言依于义以本有今有过三世显中道常住
  summary_first_person: 吾本西天竺优禅尼人梁大同中浮海至南海流寓广州毕生译经述义于涅槃经本有今无偈论中破本有今无本无今有三世有之邪执立本有今有过三世之正义以显佛性清净常乐我净
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/大乘论/涅槃经本有今无偈论.html
  - https://cbetaonline.dila.edu.tw/zh/T1528
