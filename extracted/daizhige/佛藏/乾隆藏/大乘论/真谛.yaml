  reign_ref: 梁武帝至陈宣帝
  archetype: 西来译经弘法者
  dilemmas:
  - title_zh: 梵义精微华言难达
    description_zh: 唯识因明义理幽深，如何以华言显其本义而不失真
  - title_zh: 世乱道艰弘传维艰
    description_zh: 侯景之乱梁末动荡，寄寓岭南，如何坚守译业不断
  lesson: 远绍西土正义，近启华土唯识，不以世乱废传法之志
  summary_first_person: 吾本西天竺人，泛海东来，逢梁陈丧乱，栖身岭南，毕力译经，唯愿以无相之智破执尘之迷，令众生识转智生
  source_urls:
  - https://tripitaka.cbeta.org/T1619
  - https://kanripo.org/text/KR6n0111/
