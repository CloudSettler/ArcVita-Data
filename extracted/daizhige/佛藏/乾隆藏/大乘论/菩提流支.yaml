  decisions:
  - date: '0520'
    title_zh: 以九分科判摄尽经义
    rationale: 经义深广恐学者迷乱，故以序分乃至行差别分统摄令易持故
  - date: '0522'
    title_zh: 以四种发心喻说摄取十地
    rationale: 初发至补处由浅至深，以种芽茎果等喻令学者心求满足而不退故
events:
- id: guji-菩提流支-event-birth
  title_zh: 诞生于北天竺婆罗门家
  date: 0480
  year_of: 480
  place: 北天竺
  description: 生于北印度，少出家通三藏，善大乘论义，后发愿东行弘化
- id: guji-菩提流支-event-arrive
  title_zh: 永平元年至洛阳立译场
  date: 0508
  year_of: 508
  place: 洛阳
  description: 与沙门僧朗等迎入洛阳，宣武帝敬礼供养，敕居永宁寺译经
- id: guji-菩提流支-event-translate
  title_zh: 译出文殊师利问菩提经论二卷
  date: '0520'
  year_of: 520
  place: 洛阳
  description: 译天亲所造伽耶山顶经论，明序分至行差别分九分，及非身心证与二十三种菩提名义
- id: guji-菩提流支-event-teach
  title_zh: 开演大悲为本十四本法
  date: '0522'
  year_of: 522
  place: 洛阳
  description: 答月净光德所问，示菩萨行以大悲为本，转展至坚念不忘，开四种发心十二种差别
- id: guji-菩提流支-event-death
  title_zh: 孝昌三年示寂于洛阳
  date: '0527'
  year_of: 527
  place: 洛阳
  description: 译经三十余部凡百余卷后示寂，门人传其地论与弥勒净土之学，塔于邙山
