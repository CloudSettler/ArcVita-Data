endeavors:
- id: guji-马鸣-endeavor-1
  title_zh: 造大庄严经论破外道显正
  summary_zh: 集佛本生因缘以庄严文辞分别可归不可归摧僧佉卫世师等邪论
  phases:
  - key: brewing
    name: 习外典睹佛经
    labels:
      zh:
      - 访学
    start_date: '0100'
    highlight_event_id: guji-马鸣-event-convert
  - key: breakthrough
    name: 悟十二因缘无我
    labels:
      zh:
      - 悟道
    start_date: '0110'
    highlight_event_id: guji-马鸣-event-convert
  - key: climax
    name: 造论显示庄严
    labels:
      zh:
      - 造论
    start_date: '0120'
    highlight_event_id: guji-马鸣-event-compose
  - key: closure
    name: 流通十方塔庙
    labels:
      zh:
      - 流通
    start_date: '0130'
    highlight_event_id: guji-马鸣-event-compose
  decisions:
  - date: '0110'
    title_zh: 舍外道论归依佛法
    rationale: 外论着我见边见无出生死法唯佛十二缘有因果解脱故决意弘显
  - date: '0120'
    title_zh: 以本生譬喻造庄严论
    rationale: 为令闻者满足生善故集佛功德以美文破邪如醉象践小儿土城
- id: guji-马鸣-endeavor-2
  title_zh: 以诗乐歌呗弘化四众
  summary_zh: 作佛所行赞等以音乐梵呗摄化商贾婆罗门令生信出家得道
  phases:
  - key: brewing
    name: 观察群机乐闻
    labels:
      zh:
      - 观察
    start_date: '0115'
    highlight_event_id: guji-马鸣-event-preach
  - key: breakthrough
    name: 制梵呗度优婆塞
    labels:
      zh:
      - 摄化
    start_date: '0125'
    highlight_event_id: guji-马鸣-event-preach
  - key: climax
    name: 婆罗门闻法生信
    labels:
      zh:
      - 弘法
    start_date: '0135'
    highlight_event_id: guji-马鸣-event-preach
  - key: closure
    name: 付嘱后学护持
    labels:
      zh:
      - 付嘱
    start_date: '0145'
    highlight_event_id: guji-马鸣-event-death
  decisions:
  - date: '0125'
    title_zh: 不作恶咒唯以慈悲摄众
    rationale: 佛断贪嗔痴永除恼害唯以清凉法息热恼故以哀雅音声化导
  - date: '0135'
    title_zh: 劝檀越敬僧福田不择老少
    rationale: 众僧功德海不可测量沙弥亦具圣道故教平等供养种少获大
events:
- id: guji-马鸣-event-birth
  title_zh: 诞生于中印度
  date: 0080
  year_of: 80
  description_zh: 约东汉初生于中印度婆罗门家博通四韦陀及僧佉等论
- id: guji-马鸣-event-convert
  title_zh: 睹十二缘经舍外道归佛
  date: '0110'
  year_of: 110
  description_zh: 披读十二因缘经悟无我生死相续之理深知外论虚妄归依三宝
- id: guji-马鸣-event-compose
  title_zh: 造大庄严经论十五卷
  date: '0120'
  year_of: 120
  description_zh: 集说商贾优婆塞难婆罗门憍尸迦破卫世师等事庄严佛功德摧诸异论
- id: guji-马鸣-event-preach
  title_zh: 以歌呗譬喻化导四众
  date: '0130'
  year_of: 130
  description_zh: 于华氏城摩突罗等地说法令婆罗门檀越生信有出家得阿罗汉者
- id: guji-马鸣-event-death
  title_zh: 示寂于印度
  date: '0150'
  year_of: 150
  description_zh: 弘法既毕示寂后其论由鸠摩罗什于姚秦时译出流通震旦
