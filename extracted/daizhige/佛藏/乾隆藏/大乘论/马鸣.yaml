  phases:
  - key: brewing
    name: 观察末世根欲兴造论八因
    labels:
      zh: 作因
    start_date: '0110'
    highlight_event_id: guji-马鸣-event-cause
  - key: breakthrough
    name: 立摩诃衍有法及法三义
    labels:
      zh: 立义
    start_date: '0120'
    highlight_event_id: guji-马鸣-event-compose
  - key: climax
    name: 释真如熏习生灭因缘破邪
    labels:
      zh: 解释
    start_date: '0125'
    highlight_event_id: guji-马鸣-event-compose
  - key: closure
    name: 示修信五分流通利益归信
    labels:
      zh: 修信流通
    start_date: '0130'
    highlight_event_id: guji-马鸣-event-spread
  decisions:
  - date: '0120'
    title_zh: 为最后钝根略摄广义造论
    rationale: 佛灭后众生有怖广说乐略论者故为彼摄无边义味令得正修
  - date: '0125'
    title_zh: 依一心开真如生灭二门
    rationale: 欲摄世出世一切法示大乘体相用故令从生灭门入真如门
- id: guji-马鸣-endeavor-2
  title_zh: 对治邪执弘大乘正道
  description: 依人我法我二见起一切邪执故示无我句义分别修行正道令佛种不断
  phases:
  - key: brewing
    name: 悯凡愚闻法身虚空喻起常见
    labels:
      zh: 悯邪
    start_date: '0125'
    highlight_event_id: guji-马鸣-event-compose
  - key: breakthrough
    name: 析色心至微尘刹那皆不成
    labels:
      zh: 破执
    start_date: '0126'
    highlight_event_id: guji-马鸣-event-compose
  - key: climax
    name: 示染净熏习不断成佛乃断
    labels:
      zh: 显正
    start_date: 0128
    highlight_event_id: guji-马鸣-event-spread
  - key: closure
    name: 劝厌生死求涅槃入不退信
    labels:
      zh: 劝修
    start_date: '0130'
    highlight_event_id: guji-马鸣-event-spread
  decisions:
  - date: '0126'
    title_zh: 以离我见为除邪执之本
    rationale: 一切邪执皆依我见而起若离我见则无邪执故先破人法二我
  - date: 0128
    title_zh: 以真如用随应现化报二身
    rationale: 欲令善根成熟及微少者皆发信心至不退故示现胜妙境界利益
