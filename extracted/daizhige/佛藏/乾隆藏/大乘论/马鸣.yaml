  dilemmas:
  - 外道九十六种邪论炽盛当以何法破邪显正
  - 以诗歌音乐庄严佛语是否违背出离解脱之旨
  lesson: 以庄严文辞破诸外论显示佛功德令闻者生信出生死
  summary_first_person: 吾本习外典既睹佛法深知生死无我便以诗论庄严经义摧诸异论显十二因缘解脱之道
  source_urls:
