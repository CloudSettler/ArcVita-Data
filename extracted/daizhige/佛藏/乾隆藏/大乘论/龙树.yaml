  - date: 0200-01-01
    title_zh: 灯不自照喻破自生
    rationale: 未生不能自生已生何用更生故生不自生亦不生彼
events:
- id: guji-龙树-event-birth
  date: 0150-01-01
  year_of: 150
  title_zh: 龙树诞生南天竺
  description: 约汉桓帝时生南印度后出家弘大乘
- id: guji-龙树-event-vow
  date: 0180-01-01
  year_of: 180
  title_zh: 发愿略解摩诃衍
  description: 愍末世薄福钝根不达法藏欲光阐如来无上大法故略解空义
- id: guji-龙树-event-cause
  date: 0190-01-01
  year_of: 190
  title_zh: 说众缘所生无自性
  description: 立因缘门以内外众缘和合推内外诸法皆从众缘生故即无自性
- id: guji-龙树-event-twelve
  date: 0195-01-01
  year_of: 195
  title_zh: 开十二门品目
  description: 立观因缘乃至观生十二门以正有无总众枝大数开通实相
- id: guji-龙树-event-complete
  date: 0200-01-01
  year_of: 200
  title_zh: 会归实相道场
  description: 有无兼畅忘功造化丧我二际整归驾于道场毕趣心于佛地
- id: guji-龙树-event-fruit
  date: 0192-01-01
  year_of: 192
  title_zh: 观有果无果破生
  description: 推先有先无有无亦不生故果毕竟不生一切有为法皆空
- id: guji-龙树-event-condition
  date: 0196-01-01
  year_of: 196
  title_zh: 观四缘无果
  description: 推因缘次第缘缘缘增上缘中皆无果和合亦无故从缘生空
- id: guji-龙树-event-marks
  date: 0201-01-01
  year_of: 201
  title_zh: 破生住灭三相
  description: 以生生无穷灯不自照喻破自生故有为无为皆空
- id: guji-龙树-event-nirvana
  date: 0210-01-01
  year_of: 210
  title_zh: 明涅槃亦空
  description: 五阴本空无所灭无生不成故有为无为及我皆空
- id: guji-龙树-event-death
  date: 0250-01-01
  year_of: 250
  title_zh: 龙树示寂
  description: 约魏晋间示寂后姚秦罗什译十二门论僧叡作序弘传中土
