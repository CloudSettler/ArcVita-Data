  archetype: 破邪显空的中观祖师
  dilemmas:
  - 有所得执常断与自体空无常之辨
  - 广论懈倦与一偈摄尽法海之衡
  lesson: 离有为无为对立法，自体本空故无常义成，常断二见俱破方得出离
  summary_first_person: 我本南印度人，见学人于广大论生懈倦，于无常空义生异疑，故造一偈等论，明一切法自体空不离无常，破离行说常及有所得三世实有之见，令入佛经空无常义而得解脱
