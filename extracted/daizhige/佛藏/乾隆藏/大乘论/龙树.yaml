endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 造中观一偈论明空无常
  summary_zh: 为断读诵广大部懈倦及空即无常异相疑，造壹输卢迦等一偈论，立自体性无体故空无常
  phases:
  - key: brewing
    name: 南天研习酝酿空义
    labels:
      zh: 酝酿
    start_date: 0165-01-01
    highlight_event_id: guji-龙树-event-birth
  - key: breakthrough
    name: 立体自体无常一偈
    labels:
      zh: 突破
    start_date: 0190-01-01
    highlight_event_id: guji-龙树-event-1
  - key: climax
    name: 破常断合离诸难
    labels:
      zh: 高潮
    start_date: 0210-01-01
    highlight_event_id: guji-龙树-event-2
  - key: closure
    name: 会归修多罗三蜜提经
    labels:
      zh: 收束
    start_date: 0220-01-01
    highlight_event_id: guji-龙树-event-2
  decisions:
  - date: 0190-01-01
    title_zh: 以一偈摄广论造壹输卢迦论
    rationale: 悯学人于广部生懈倦，故以体自体无常等四句摄尽空无常义
  - date: 0210-01-01
    title_zh: 直破离行说无常及三世实有
    rationale: 若离有为别有无常则堕常，若未来无因自性成则三世俱坏，故须破有所得见
- id: guji-龙树-endeavor-2
  title_zh: 摧外道部派弘大乘出离道
  summary_zh: 对迦毗罗等外道及有所得佛弟子，示佛缘觉声闻皆于空得出离，非于断常行中得解脱
  phases:
  - key: brewing
    name: 观察有所得偏执
    labels:
      zh: 酝酿
    start_date: 0180-01-01
    highlight_event_id: guji-龙树-event-1
  - key: breakthrough
    name: 拈瓶坏涅槃坏难破不异执
    labels:
      zh: 突破
    start_date: 0200-01-01
    highlight_event_id: guji-龙树-event-2
  - key: climax
    name: 广破因缘不相应三世有体论
    labels:
      zh: 高潮
    start_date: 0210-01-01
    highlight_event_id: guji-龙树-event-2
  - key: closure
    name: 付嘱后学依经取证
    labels:
      zh: 收束
    start_date: 0240-01-01
    highlight_event_id: guji-龙树-event-death
  decisions:
  - date: 0200-01-01
    title_zh: 以有为无为相合过难破执
    rationale: 若不异则瓶不可破涅槃可坏，故有为无为体须以空无自性会通
  - date: 0240-01-01
    title_zh: 令学人依修多罗验义不依空言
    rationale: 非经说则不应信，唯入眼空无常等经义者其义方成
events:
- id: guji-龙树-event-birth
  title_zh: 诞生于南印度婆罗门家
  date: 0150-01-01
  year_of: 150
  description_zh: 相传生于南印度，幼聪睿，广习诸论，后入佛法深观缘起性空
- id: guji-龙树-event-1
  title_zh: 造壹输卢迦论立空无常
  date: 0190-01-01
  year_of: 190
  description_zh: 造一偈论言体自体无常如是体无体自体性无体故说空无常，为断广习懈倦及异相疑
- id: guji-龙树-event-2
  title_zh: 破有所得常断诸见弘空出离
  date: 0210-01-01
  year_of: 210
  description_zh: 破离行说无常及过去未来现在自体成说，明诸佛缘觉声闻皆于空法中得出离
- id: guji-龙树-event-death
  title_zh: 示寂于南印度
  date: 0250-01-01
  year_of: 250
  description_zh: 住世弘法后示寂，后世尊为大乘中观祖师，其论由瞿昙般若流支等译传洛阳
