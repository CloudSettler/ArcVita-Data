endeavors:
- id: guji-龙树-endeavor-1
  person_qid: guji-龙树
  title_zh: 开立中观缘起性空破一异执
  summary: 以十二因缘苦集灭道破计一计异及有无断常，立八不中道，为大乘空宗之本。
  phases:
  - key: brewing
    name: 南印度习学大小乘见外道纷然
    labels:
      zh:
      - 访学
      - 观机
    start_date: '0168-01-01'
    highlight_event_id: guji-龙树-event-xuefa
  - key: breakthrough
    name: 悟缘起性空立八不中道
    labels:
      zh:
      - 立宗
      - 破邪
    start_date: '0185-01-01'
    highlight_event_id: guji-龙树-event-zhongguan
  - key: climax
    name: 广造中论等破计一计异断常二边
    labels:
      zh:
      - 造论
      - 护法
    start_date: '0195-01-01'
    highlight_event_id: guji-龙树-event-zhongguan
  - key: closure
    name: 空有不堕二边付嘱后学
    labels:
      zh:
      - 付嘱
      - 弘传
    start_date: '0230-01-01'
    highlight_event_id: guji-龙树-event-death
  decisions:
  - date: '0185-01-01'
    title_zh: 以缘起破自性有无
    rationale: 若言一则堕苦边，若言异则堕乐边，故立不一不异以显中道，避免堕边。
  - date: '0195-01-01'
    title_zh: 不为胜负而破外道我神常住
    rationale: 外道执神我常住及祠火医方六谛等，若不破则众生失真实利，故以现比喻教四因正破。
- id: guji-龙树-endeavor-2
  person_qid: guji-龙树
  title_zh: 造方便心论明八种论法护正法
  summary: 为令正法流布如护庵婆罗果外植荆棘，造方便心论分别譬喻随执语善言失知因应时似因随难八义，开诸论门断戏论。
  phases:
  - key: brewing
    name: 愍世无论迷惑为邪智所惑
    labels:
      zh:
      - 愍世
      - 发心
    start_date: '0198-01-01'
    highlight_event_id: guji-龙树-event-xuefa
  - key: breakthrough
    name: 定造论宗旨不为名闻利养
    labels:
      zh:
      - 明宗
      - 护法
    start_date: '0200-01-01'
    highlight_event_id: guji-龙树-event-fangbian
  - key: climax
    name: 广明八义及负处正论相应
    labels:
      zh:
      - 明论法
      - 辩负处
    start_date: '0202-01-01'
    highlight_event_id: guji-龙树-event-fangbian
  - key: closure
    name: 付嘱后魏传译流布中土
    labels:
      zh:
      - 结集
      - 传译
    start_date: '0520-01-01'
    highlight_event_id: guji-龙树-event-chuan译
  decisions:
  - date: '0200-01-01'
    title_zh: 决意造论以护正法
    rationale: 世若无论迷惑者众为邪智所诳起不善业，若达论者则魔外不能恼坏，故为利益众生造此正论。
  - date: '0202-01-01'
    title_zh: 以凡圣同解为喻以应时语化众
    rationale: 深义如诸法空寂非愚者能受，若为愚说深则迷没堕落，故先说业报缚解随其浅智令信受。
