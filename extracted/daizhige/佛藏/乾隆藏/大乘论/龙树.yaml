  archetype: 中观开宗护法论师
  dilemmas:
  - 造论多起恚恨憍逸自叹毁他，与离诤寂静之间如何抉择
  - 言一则堕苦边言异则堕乐边，如何不堕二边而显中道实义
  lesson: 不为胜负利养名闻而造论，但为显示善恶护持正法令众生离邪智诳惑
  summary_first_person: 吾为龙树，生南印度，见世间邪智巧辩诳惑众生轮回恶趣，故不求名闻，造论以明善恶空相，立譬喻随执语善言失知因应时似因随难八种论法，开缘起性空之门，护正法如护庵婆罗果。
