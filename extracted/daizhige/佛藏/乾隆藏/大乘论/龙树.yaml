person:
  qid: guji-龙树
  name_zh: 龙树
  names:
    zh: 龙树
    en: Nagarjuna
  lifespan:
    birth:
      date: '0150'
      precision: year
      is_circa: true
      raw: 约150年
    death:
      date: '0250'
      precision: year
      is_circa: true
      raw: 约250年
  birth_date: '0150'
  death_date: '0250'
  era: 东汉末至曹魏
  reign_ref: 灵帝至明帝间
  archetype: 破邪显正的中观祖师
  dilemmas:
  - 世人执大自在天生韦纽生和合生时生自然生微尘生堕无因邪因断常，我当如何以中道破之而不增戏论
  - 像法中人根转钝深著十二因缘五阴十二入十八界决定相，闻大乘毕竟空便生疑怖取空相而起贪著，我当如何令其不坏世谛而悟第一义
  lesson: 不落有无断常一异来出两边，以缘起性空显八不中道，方能灭诸戏论令众生离执悟实
  summary_first_person: 吾龙树生于南天竺，见世人谬言万物从天生从时生从自然生从微尘生，不知正法，又见像法学者著文字求决定相，闻空生怖，故观十二因缘如虚空不可尽，以不生不灭不常不断不一不异不来不出总破一切法，又以四缘三时广破去来六情，造中论五百偈以赞佛显实，愿惑趣之徒望玄指而一变，玄悟之宾丧咨询于朝彻
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E8%AE%BA/%E4%B8%AD%E8%AE%BA.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%A4%A7%E4%B9%98%E8%AE%BA/%E4%B8%AD%E8%AE%BA.html
endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 造中论以八不缘起破邪显空
  summary: 为断无因邪因断常邪见及著文字取空相之过，以八不总破生灭断常一异来出，以四句广破自生他生共生无因生，造中论五百偈显毕竟空
  phases:
  - key: brewing
    name: 观邪见酝酿
    labels:
      zh:
      - 观机酝酿
    start_date: 0180
    highlight_event_id: guji-龙树-event-birth
  - key: breakthrough
    name: 立八不突破
    labels:
      zh:
      - 八不立宗
    start_date: 0190
    highlight_event_id: guji-龙树-event-compose
  - key: climax
    name: 破四缘高峰
    labels:
      zh:
      - 破缘显空
    start_date: 0195
    highlight_event_id: guji-龙树-event-compose
  - key: closure
    name: 赞佛成论
    labels:
      zh:
      - 归敬收束
    start_date: '0200'
    highlight_event_id: guji-龙树-event-compose
  decisions:
  - date: 0190
    title_zh: 以八不总摄破一切法
    rationale: 法虽无量略说不生不灭不常不断不一不异不来不出八事，则为总破一切法故立八不为宗
  - date: 0195
    title_zh: 以四句破生显无生
    rationale: 诸法不自生不从他生不共不无因，四句中求生不可得故知无生，缘尚不生何况非缘故破四缘
- id: guji-龙树-endeavor-2
  title_zh: 弘传大乘般若空观教化四众
  summary: 承声闻十二因缘之后，为已习行有大心堪受深法者，以大乘法说因缘相，破去来六情，令知世谛第一义不相违，扇慧风流甘露
  phases:
  - key: brewing
    name: 弘法蓄势
    labels:
      zh:
      - 弘法蓄势
    start_date: '0200'
    highlight_event_id: guji-龙树-event-compose
  - key: breakthrough
    name: 破去来显动
    labels:
      zh:
      - 破去来
    start_date: '0210'
    highlight_event_id: guji-龙树-event-teach
  - key: climax
    name: 破六情显观
    labels:
      zh:
      - 破六情
    start_date: '0220'
    highlight_event_id: guji-龙树-event-teach
  - key: closure
    name: 流传中观
    labels:
      zh:
      - 传灯收束
    start_date: '0240'
    highlight_event_id: guji-龙树-event-death
  decisions:
  - date: '0210'
    title_zh: 以三时破去住以显假名
    rationale: 已去无去未去无去去时亦无去，去者住者皆相待虚妄，但有假名如幻如化故不堕 commonly 见
  - date: '0220'
    title_zh: 以眼不见自体破六情实有
    rationale: 眼不能自见己体云何见余物，内外六情六尘皆无决定性故说毕竟空而不坏缘起
events:
- id: guji-龙树-event-birth
  kind: birth
  title_zh: 龙树诞生于南天竺
  date: '0150'
  year_of: 150
  description: 约汉末生于南天竺婆罗门家，幼聪慧通晓四韦陀，后皈佛出家习深法，为大乘中观之所依
- id: guji-龙树-event-compose
  kind: career
  title_zh: 造中论五百偈显八不中道
  date: 0190
  year_of: 190
  description: 佛灭后像法中人为断邪见令知佛法，先说不生不灭不常不断不一不异不来不出二偈赞佛略说第一义，次以诸法不自生亦不从他生不共不无因破生，以果为从缘生为从非缘生破四缘，遂成中论四卷
- id: guji-龙树-event-teach
  kind: career
  title_zh: 广破去来六情弘般若空观
  date: '0220'
  year_of: 220
  description: 以已去无去未去亦无去离已去未去去时亦无去破三时去住，又以眼不能自见破六情能见所见，令知去法去者所去处皆相因待虚妄，菩萨坐道场观十二因缘如虚空不可尽
- id: guji-龙树-event-death
  kind: death
  title_zh: 龙树示寂中观流传天竺震旦
  date: '0250'
  year_of: 250
  description: 示寂后青目释中论，姚秦鸠摩罗什译出，僧叡作序，天竺学者玩味以为喉衿，震旦得移灵鹫作镇，谈道之贤始可与论实
