  decisions:
  - date: '0200'
    title_zh: 判苦等非实以不生为实谛
    rationale: 若苦实有则牛猪亦有实谛故须以知法不生为实圣谛
  - date: '0210'
    title_zh: 呵取空见示无二际对治
    rationale: 见空得出而取空生见则无对治故须示空自体空离爱着
