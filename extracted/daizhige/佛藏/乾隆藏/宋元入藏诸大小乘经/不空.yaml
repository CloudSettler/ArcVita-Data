    start_date: '0720'
    highlight_event_id: guji-不空-event-meet-teacher
  - key: climax
    name: 狮子国求经得法
    labels:
      zh: 求法
    start_date: '0741'
    highlight_event_id: guji-不空-event-seek-dharma
  - key: closure
    name: 携经归唐发愿流通
    labels:
      zh: 归国
    start_date: '0746'
    highlight_event_id: guji-不空-event-return-changan
  decisions:
  - date: 0719
    title_zh: 弃俗从师事金刚智
    rationale: 见金刚智威仪特异，知密教可即身成佛，故决心执侍受学
  - date: '0741'
    title_zh: 冒险泛海赴狮子国
    rationale: 师授未竟，疑义未决，须亲往南天取原本广求传承以续慧命
- id: guji-不空-endeavor-2
  title_zh: 长安译经造塔弘宝箧印
  summary_zh: 归长安后历玄宗肃宗代宗三朝，译出宝箧印陀罗尼等百余部密典，劝造塔藏经，以七宝塔摄全身舍利，令末法众生礼塔即遇诸佛。
  phases:
  - key: brewing
    name: 奉诏入宫初译经
    labels:
      zh: 译经
    start_date: '0746'
    highlight_event_id: guji-不空-event-return-changan
