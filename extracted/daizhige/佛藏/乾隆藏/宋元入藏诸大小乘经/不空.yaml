  - title_zh: 梵音存真与华言易晓之衡
    description_zh: 既欲存陀罗尼梵音功德，又欲令王臣庶民受持得益，故以消灾吉祥为方便显说
  - title_zh: 奉诏护国与持律离俗之衡
    description_zh: 既受诏建道场禳星护国，又守沙门清净本怀，故立结界供养仪轨以护生为护国
  lesson: 至心依仪持诵则众灾消灭变灾为福，护国护家不离清净一心
  summary_first_person: 我是不空，幼年来华，师事金刚智，奉三朝诏译密典，传炽盛光消灾法门，立坛结界，教人诵持百八遍乃至千遍，愿国安民吉，皆得吉祥
