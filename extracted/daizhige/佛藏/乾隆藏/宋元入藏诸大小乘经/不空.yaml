  - key: climax
    name: 劝造塔藏经普流通
    labels:
      zh: 弘传
    start_date: '0765'
    highlight_event_id: guji-不空-event-translate-baoqieyin
  - key: closure
    name: 付嘱护塔示寂
    labels:
      zh: 圆寂
    start_date: '0774'
    highlight_event_id: guji-不空-event-death
  decisions:
  - date: '0747'
    title_zh: 以译经为弘法正业
    rationale: 密法凭坛仪轨，非文字难广传，故以翻译摄机，令汉地有据可依
  - date: '0760'
    title_zh: 译弘宝箧印造塔藏经
    rationale: 见丰财园朽塔即七宝塔之义，知塔藏此经功德同九十九俱胝佛身，故力劝书写安置
events:
- id: guji-不空-event-birth
  title_zh: 诞生西域
  date: '0705'
  year_of: 705
  place_zh: 北天竺马尔康
  summary_zh: 唐神龙元年生于西域商族之家，幼颖悟，十五岁至长安。
- id: guji-不空-event-meet-teacher
  title_zh: 长安遇金刚智执弟子礼
  date: 0719
  year_of: 719
  place_zh: 长安慈恩寺
  summary_zh: 年十五遇南天密宗大师金刚智，遂出家受具，尽学瑜伽五部法要。
- id: guji-不空-event-seek-dharma
  title_zh: 泛海赴狮子国求法
  date: '0741'
  year_of: 741
  place_zh: 狮子国
  summary_zh: 奉师命与弟子含光等泛南海，历三年至狮子国，广求十八会金刚顶等密典五百余部。
- id: guji-不空-event-return-changan
  title_zh: 携经归长安奉诏译经
  date: '0746'
  year_of: 746
  place_zh: 长安大兴善寺
  summary_zh: 携梵本归京，玄宗迎礼，敕住大兴善寺开坛灌顶，始大译密部经典。
- id: guji-不空-event-translate-baoqieyin
  title_zh: 译一切如来心秘密全身舍利宝箧印陀罗尼经
  date: '0760'
  year_of: 760
  place_zh: 长安
  summary_zh: 译出宝箧印陀罗尼一卷，明朽塔即七宝全身舍利塔，劝书写安置塔像之中，功德同供养十方诸佛。
- id: guji-不空-event-death
  title_zh: 示寂长安大兴善寺
  date: '0774'
  year_of: 774
  place_zh: 长安大兴善寺
  summary_zh: 唐大历九年六月示寂，寿七十，代宗辍朝三日，赠司空，谥大辨正广智三藏和上。
