  death_date: -4900-01-01
  era: 劫初上古
  reign_ref: 劫初刹帝利第一王三摩达多
  archetype: 众许开国圣王
  dilemmas:
  - 香稻隐没田种须勤力耕种方得成熟人心生苦恼当何以安之
  - 贪占田野偷盗他米纷起无法可止当立何人以断争
  - 受位为王当以何道均分田土调伏非法垂统后世
  lesson: 众许而王，均分守戒，依法决断，方能安慰世间
  summary_first_person: 我本众人所推之田主，因见盗起无法、田土不均，便受众请，均分田土，依法决断，调伏非法，受号三摩达多，为劫初刹帝利之首，愿以戒行安世，垂统万代。
