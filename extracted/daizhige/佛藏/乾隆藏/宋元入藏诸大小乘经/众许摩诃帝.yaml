    rationale: 以正法代非法以律仪正非律仪使合调伏者得调伏
  - date: -4997-01-01
    title_zh: 立子爱王继绍帝位
    rationale: 为使王位相继世间有主不复纷争故传位子孙
events:
- id: guji-众许摩诃帝-event-birth
  date: -5000-01-01
  year_of: -5000
  title_zh: 降生劫初人间之世
  description: 遍静天众福尽下生人间，地味林藤香稻渐隐，田种勤力之世降生，具福德相
- id: guji-众许摩诃帝-event-1
  date: -5000-02-01
  year_of: -5000
  title_zh: 众人推举为田主
  description: 他田偷盗纷起，前人诫而不改，乃集多人拣具福德者立为田主，均分田土各令平等
- id: guji-众许摩诃帝-event-2
  date: -5000-03-01
  year_of: -5000
  title_zh: 立号三摩达多开刹帝利
  description: 田主受行戒行安慰世间依法决断调伏非法，世间立刹帝利姓名三摩达多，是为众许摩诃帝
- id: guji-众许摩诃帝-event-3
  date: -4997-01-01
  year_of: -4997
  title_zh: 生子传位开万代王统
  description: 三摩达多王生子爱王，爱王生善友，最上戒行顶生尼噜等相继，子孙相继都诸大城王位不绝
- id: guji-众许摩诃帝-event-death
  date: -4900-01-01
  year_of: -4900
  title_zh: 命终传位王统相续
  description: 众许摩诃帝命终之后，王子爱王继绍，甘蔗日种王系绵远，乃至瞿昙出家化二卵生日种
