  reign_ref: 婆蹉国拘睒弥城在位之王
  archetype: 求法改过之圣王
  dilemmas:
  - 云何洞察诸王真实过失与真实功德而能舍失修德
  - 云何远离衰损之门成就可爱之法以令国界安宁众生归仰
  lesson: 舍十种王过修十种王德，远离五衰损门，勤行五发起法以成可爱法，即可转凡王为圣王法王而感国泰民安
  summary_first_person: 吾为优填独坐空闲静室，深惧王位多过少德，不知舍失修德之要，故亲诣世尊请问王法，既闻十过十德五衰五爱之秘密王教，愿朝暮读诵依教奉行，修恩惠善法，断暴恶放逸，以正法养民护国，誓作圣王法王
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%AE%8B%E5%85%83%E5%85%A5%E8%97%8F%E8%AF%B8%E5%A4%A7%E5%B0%8F%E4%B9%98%E7%BB%8F/%E4%BD%9B%E4%B8%BA%E4%BC%98%E5%A1%AB%E7%8E%8B%E8%AF%B4%E7%8E%8B%E6%B3%95%E6%94%BF%E8%AE%BA%E7%BB%8F.html
endeavors:
- id: guji-优填王-endeavor-1
  title_zh: 静室自省诣佛请问王法
  summary: 独处静室思惟王之过失功德衰损可爱之不明，决意不问余人专诣具一切智之世尊以求开示
  phases:
  - key: brewing
    name: 空闲静室起念自省
    labels:
      zh: 思惟过失功德不明
    start_date: -0533-01-01
    highlight_event_id: guji-优填王-event-quest
  - key: breakthrough
    name: 思定唯佛能解决意亲往
    labels:
      zh: 拣择诣佛请问
    start_date: -0533-02-01
    highlight_event_id: guji-优填王-event-quest
  - key: climax
    name: 佛前陈情启请开示
    labels:
      zh: 问真实过失功德
    start_date: -0533-03-01
    highlight_event_id: guji-优填王-event-sermon
  - key: closure
    name: 初闻王教纲要生信
    labels:
      zh: 了知王过王德等五门
    start_date: -0533-03-02
    highlight_event_id: guji-优填王-event-sermon
  decisions:
  - date: -0533-01-01
    title_zh: 不问群臣沙门专问世尊
    rationale: 唯三界大师具一切智定知王真实过失功德，故舍旁求而专诣佛所请问
  - date: -0533-03-01
    title_zh: 面启王过王德之问以求广说
    rationale: 若自知过失功德则当舍失修德，为利国利民故须得佛广开示秘密王教
- id: guji-优填王-endeavor-2
  title_zh: 依秘密王教修圣王法王行
  summary: 得闻十过十德五衰损门五可爱法及发起法后，发愿朝暮读诵依教修行以安国宁邦
  phases:
  - key: brewing
    name: 谛听十过十德生惭愧
    labels:
      zh: 对照种姓自性过德
    start_date: -0533-03-01
    highlight_event_id: guji-优填王-event-sermon
  - key: breakthrough
    name: 了知衰损可爱及发起方便
    labels:
      zh: 明五衰五爱五发起法
    start_date: -0533-03-02
    highlight_event_id: guji-优填王-event-sermon
  - key: climax
    name: 踊跃欢喜立愿为圣王
    labels:
      zh: 晨朝读诵依教修行
    start_date: -0533-03-03
    highlight_event_id: guji-优填王-event-sermon
  - key: closure
    name: 信受奉行以求国土安宁
    labels:
      zh: 感风调雨顺兵甲休息
    start_date: -0532-01-01
    highlight_event_id: guji-优填王-event-practice
  decisions:
  - date: -0533-03-03
    title_zh: 每日晨朝读诵秘密王教
    rationale: 依之修行即名圣王法王，得诸佛菩萨天龙护念，故须恒持不辍以自策励
  - date: -0532-01-01
    title_zh: 以正化恩养苍生勤修善法
    rationale: 恩养英勇善权正受勤善方能发起可爱法，令世间敬爱国界丰饶，故以此为国政纲维
events:
- id: guji-优填王-event-birth
  title_zh: 降生婆蹉王族嗣位拘睒弥
  date: -0580-01-01
  year_of: -580
  description: 生于婆蹉国王族，以宿善愿力绍继国位，恩养万姓而为拘睒弥之王
- id: guji-优填王-event-quest
  title_zh: 独处静室思惟决意诣佛请问
  date: -0533-01-01
  year_of: -533
  description: 独处空闲静室而坐，自念云何知王真实过失功德而舍失修德，思已决意往诣世尊请问斯义
- id: guji-优填王-event-sermon
  title_zh: 佛说王法政论十过十德五衰五爱
  date: -0533-03-01
  year_of: -533
  description: 世尊为说王十过失十功德五衰损门五可爱法及五发起法，谓初一属种姓余属自性，晨朝读诵依行即名圣王法王
- id: guji-优填王-event-practice
  title_zh: 闻法踊跃欢喜信受奉行
  date: -0533-03-03
  year_of: -533
  description: 闻佛所说踊跃欢喜，发愿朝暮读诵秘密王教，修恩惠善法正受境界，以正化恩养苍生而求国土安宁
- id: guji-优填王-event-death
  title_zh: 薨逝于拘睒弥
  date: -0500-01-01
  year_of: -500
  description: 在位弘修善法护国已毕，寿终而薨于拘睒弥，遗教存于王法政论经为后王轨范
