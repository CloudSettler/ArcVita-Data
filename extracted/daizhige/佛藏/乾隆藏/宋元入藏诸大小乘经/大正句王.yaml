    rationale: 以亲属病终无来报及官法杀戮剖身不见化生为据，欲守旧见以示坚定
  - date: -288
    title_zh: 亲往鹿野园诘难迦叶
    rationale: 闻城中婆罗门长者往觐童子迦叶，恐其以邪法引导众人，故欲亲往辩难兼护旧说
- id: guji-大正句王-endeavor-2
  title_zh: 与童子迦叶论辩舍邪归正
  description: 于尸利沙林鹿野园中与迦叶往复问答，历受多重譬喻破斥，渐舍断见信有三世因果
