  dilemmas:
  - 坚持断见以维护君威旧论，抑或虚心听受沙门正法
  - 顾惜国人议论耻笑，抑或舍弃邪见以求长夜安乐
  lesson: 莫以不见便执为无，愚执断见长夜受苦，当信因果三世及化生
  summary_first_person: 我是大正句，都尸利沙城，先不信因果，常言无来世无人无化生，后在鹿野园中与童子迦叶往复问难，蒙以日月身喻地狱不放喻天乐不还喻盲人喻螺声喻铁丸喻梦园喻灰中求火喻险路商主喻担麻易金喻被甲斗狮等种种譬喻开晓，方知实有人世后世及化生
  source_urls:
