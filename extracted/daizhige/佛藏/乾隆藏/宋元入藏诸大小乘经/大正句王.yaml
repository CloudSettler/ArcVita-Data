  title_zh: 率众往鹿野园问难迦叶
  date: -288
  year_of: -288
  place_zh: 尸利沙林鹿野园
  description: 见婆罗门长者出城诣童子迦叶住处，即严驾同往，初未恭肃，互伸问讯后连以亲属堕狱不还生天不报死尸不言及秤肉轻重等喻诘难有无后世
- id: guji-大正句王-event-convert
