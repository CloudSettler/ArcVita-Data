  date: -0439
  year_of: -0439
  place_zh: 尸利沙林鹿野园
  description: 迦叶以监守不放喻天寿悬隔喻螺无情不答喻四大软硬喻梦境非实喻童子灰中求火喻二商主险路喻担麻易金喻群猪秽污退狮子喻层层破其断见，王渐信有人世后世及化生与具天眼者所见
