  decisions:
  - date: -288
    title_zh: 屡执不回以避国人讥耻
    rationale: 恐都人讥言昔云无人无后世今翻为迦叶所化，故初虽闻善喻犹言我心不回
  - date: -0439
    title_zh: 舍断见信有后世化生
    rationale: 蒙迦叶以罪人不放喻秽坑不还喻商主险路喻担麻失金喻猪涂秽污退狮子喻反复开晓，知愚执如灰中求火，遂受三世正见
