  name_zh: 天息灾
  names:
    zh: 天息灾
    en: Devasanti
  lifespan:
    birth:
      date: 0950
      precision: year
      is_circa: true
      raw: 生年不详，约十世纪中叶生于北天竺罽宾
    death:
      date: '1000'
      precision: year
      is_circa: false
      raw: 宋真宗咸平三年卒于汴京
  birth_date: 0950
  death_date: '1000'
  era: 北宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 西天译经三藏
  dilemmas:
  - 梵汉悬隔密义难传，宁守直译存其本意，不敢以华言文饰失真
  - 身寄异国毁誉交加，唯以精持三密实修实证，验所译曼拏罗行法不虚
  lesson: 以翻译续佛慧命，令秘密曼拏罗行法东流，利乐华夏一切有情
  summary_first_person: 我是天息灾，罽宾婆罗门种出家，精通三藏显密教法，宋太宗太平兴国中航海东来，入译经院拜受朝散大夫明教大师，奉诏与施护法贤共译经律，凡译一切如来大秘密王未曾有最上微妙大曼拏罗经等数十部，愿以此译业回向无上智果
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0889
  - https://daizhige.org/佛藏/乾隆藏/宋元入藏诸大小乘经/一切如来大秘密王未曾有最上微妙大曼拏罗经.html
