  - date: 0990
    title_zh: 首译相应行曼拏罗仪则
    rationale: 先明择地净地作橛结界门位内外中义，使后学得入坛之次第不紊
  - date: 0995
    title_zh: 具译灌顶护摩出生供养法
    rationale: 密行以灌顶摄弟子以护摩息障，以三白饮食香花奉献，令行人即身成就利他
