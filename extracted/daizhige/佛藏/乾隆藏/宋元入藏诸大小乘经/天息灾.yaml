endeavors:
- id: guji-天息灾-endeavor-1
  title_zh: 西天入宋奉诏参译群经
  summary: 太平兴国五年随表入贡，留住汴京译经院，与施护法贤等同参传译，授朝散大夫明教大师，译出大小乘经律论数十部。
  phases:
  - key: brewing
    name: 西来发轫
    labels:
      zh: 西域学法
    start_date: 0950
    highlight_event_id: guji-天息灾-event-birth
  - key: breakthrough
    name: 奉诏入院
    labels:
      zh: 抵宋入译经院
    start_date: 0980
    highlight_event_id: guji-天息灾-event-arrival
  - key: climax
    name: 群经并译
    labels:
      zh: 显密兼译
    start_date: 0981
    highlight_event_id: guji-天息灾-event-collectrans
  - key: closure
    name: 授官护法
    labels:
      zh: 朝散大夫明教大师
    start_date: 0990
    highlight_event_id: guji-天息灾-event-collectrans
  decisions:
  - date: 0980
    title_zh: 应诏留宋不归
    rationale: 为使梵本流通中土，舍归国之念，就译经院笔受润文之职，以利多人。
  - date: 0981
    title_zh: 与施护法贤分工共译
    rationale: 梵汉音义悬隔，集众智而参详，笔受证义各有专司，方得文义周圆。
- id: guji-天息灾-endeavor-2
  title_zh: 别译文殊根本仪轨二十卷
  summary: 奉诏别译大方广菩萨藏文殊师利根本仪轨经，演净光天集会因缘，具载妙吉祥根本真言、结坛灌顶、护摩息灾增益等仪轨，成密教文殊法之总汇。
  phases:
  - key: brewing
    name: 请得梵本
    labels:
      zh: 携文殊仪轨梵夹入华
    start_date: 0980
    highlight_event_id: guji-天息灾-event-arrival
  - key: breakthrough
    name: 开译序品
    labels:
      zh: 译净光天妙吉祥来会缘起
    start_date: 0984
    highlight_event_id: guji-天息灾-event-manjusri
  - key: climax
    name: 具译仪轨
    labels:
      zh: 真言坛法灌顶印相并译
    start_date: 0985
    highlight_event_id: guji-天息灾-event-manjusri
  - key: closure
    name: 进呈流通
    labels:
      zh: 二十卷进呈入藏
    start_date: 0988
    highlight_event_id: guji-天息灾-event-manjusri
  decisions:
  - date: 0984
    title_zh: 以序品会通显密
    rationale: 先明开华王如来付嘱及释迦许可，使真言行不离菩萨藏，令三乘学者皆生信受。
  - date: 0985
    title_zh: 音义并存直译真言
    rationale: 真言句义不翻而存梵音，仪轨法则详译成华言，使持诵结坛皆有所据，护国利民有所施行。
events:
- id: guji-天息灾-event-birth
  date: 0950
  year_of: 950
  title_zh: 生于迦湿弥罗
  description: 约十世纪中叶生于西天迦湿弥罗，幼习三藏，尤精陀罗尼及仪轨法，後发愿东来弘化。
- id: guji-天息灾-event-arrival
  date: 0980
  year_of: 980
  title_zh: 太平兴国五年抵汴京入译经院
  description: 随贡使抵开封，宋太宗诏入太平兴国寺译经院，赐紫衣，参与传译，与天竺施护等齐名三藏。
- id: guji-天息灾-event-collectrans
  date: 0981
  year_of: 981
  title_zh: 参译群经授明教大师
  description: 自太平兴国雍熙以来共译经律论数十部，授朝散大夫试鸿胪少卿明教大师，主持笔受润文，声名著于译场。
- id: guji-天息灾-event-manjusri
  date: 0985
  year_of: 985
  title_zh: 奉诏译出文殊根本仪轨经二十卷
  description: 奉诏译大方广菩萨藏文殊师利根本仪轨经，首译序品净光天集会、妙吉祥从开华世界来会因缘，次第译出根本真言、一字心咒、结坛灌顶、护摩息灾增益降伏等品，凡二十卷。
- id: guji-天息灾-event-death
  date: '1000'
  year_of: 1000
  title_zh: 咸平三年卒于汴京
  description: 宋真宗咸平三年示寂于汴京译经院，所译文殊仪轨等经入藏流通，後世密教文殊法多宗此本。
