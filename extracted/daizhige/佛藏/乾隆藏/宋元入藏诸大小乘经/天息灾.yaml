person:
  qid: guji-天息灾
  name_zh: 天息灾
  names:
    zh: 天息灾
    en: Devasanti
  lifespan:
    birth:
      date: 0950
      precision: decade
      is_circa: true
      raw: 约十世纪中叶生于迦湿弥罗
    death:
      date: '1000'
      precision: year
      is_circa: false
      raw: 宋咸平三年卒于汴京
  birth_date: 0950
  death_date: '1000'
  era: 北宋
  reign_ref: 宋太宗太平兴国至真宗咸平
  archetype: 译经三藏
  dilemmas:
  - 梵本玄奥与华言达意之间如何取舍以令多人得解
  - 密教仪轨繁密与中土众生根器之间如何会通以普利群生
  lesson: 以译经为佛事，不惮繁难，使真言仪轨流通中土，令众生所愿圆满。
  summary_first_person: 吾本西天来僧，蒙宋帝诏入译经院，授朝散大夫明教大师，与施护法贤等共译显密经论，尤以大方广菩萨藏文殊师利根本仪轨经二十卷为要，愿以真言句利益一切众生，无病长寿，富贵圆满。
