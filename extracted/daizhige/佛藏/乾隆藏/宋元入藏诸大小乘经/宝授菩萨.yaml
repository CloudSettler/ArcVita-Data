    title_zh: 以离三业不住果报而施
    rationale: 不以身心施离三业不住有为无为及声闻缘觉佛菩提方名净施
events:
- id: guji-宝授菩萨-event-birth
  title_zh: 广严城王家生为宝授年始三岁蒙佛光明
  date: -320
  year_of: -500
  place_zh: 广严城王宫殿上
  description: 佛入城乞食放大光明变城琉璃宝授见瑞问母速下于地端立说偈
- id: guji-宝授菩萨-event-xianlian
  title_zh: 殿上投身虚空献千叶金莲成华盖
  date: -320
  year_of: -500
  place_zh: 广严城宫殿上虚空佛前
  description: 佛至宫门现身宝授投身佛力持住空中捧莲献佛莲成宝饰华盖说不为断烦恼唯为佛菩提偈
- id: guji-宝授菩萨-event-lunkong
  title_zh: 与目连舍利弗妙吉祥论无相菩提
  date: -320
  year_of: -500
  place_zh: 广严城佛会中
  description: 破取相妄想明法性无为无住不住佛法声闻缘觉贪嗔痴等佛言其燃灯佛时已证无生经三百千劫
- id: guji-宝授菩萨-event-yiboshibao
  title_zh: 一钵无尽遍飨苾刍及城中人民
  date: -320
  year_of: -500
  place_zh: 广严城佛会前
  description: 取百味一器誓愿真实令众钵皆满余施人民犹不尽佛说五种四种宝净施法
- id: guji-宝授菩萨-event-death
  title_zh: 蒙记三十劫后成不空力称如来未示入灭
  date: -256
  year_of: -400
  place_zh: 广严城佛会中
  description: 佛记过三十劫出世众会菩萨皆不退转威力寿量无边经名菩提行众皆欢喜奉行
