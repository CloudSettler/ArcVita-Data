  decisions:
  - date: 0985
    title_zh: 先灌顶后说秘要法门
    rationale: 三昧耶法如影像，未受灌顶者难信难解，先净障染方堪闻法
  - date: 0986
    title_zh: 并传十大明王忿怒护持法
    rationale: 以慈悲摄善，以威怒伏障，令行者所办事业成就而天魔不恼
