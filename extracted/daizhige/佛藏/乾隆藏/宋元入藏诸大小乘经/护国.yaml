endeavors:
- id: guji-护国-endeavor-1
  title_zh: 闻法起信绝食求许佛前出家
  summary: 于睹罗聚落闻佛说法发大道心，求佛出家因父母未听不得即度，还家再三求请绝食立誓，得知识劝请父母听许，佛前落发为苾刍，依佛十夏得漏尽
  phases:
  - key: brewing
    name: 法会闻法起信
    labels:
      zh:
      - 闻法
      - 起信
    start_date: '-0500'
    highlight_event_id: guji-护国-event-hear
  - key: breakthrough
    name: 绝食求请得许
    labels:
      zh:
      - 求请
      - 得许
    start_date: '-0500'
    highlight_event_id: guji-护国-event-renunciation
  - key: climax
    name: 佛前落发出家
    labels:
      zh:
      - 出家
      - 受具
    start_date: '-0500'
    highlight_event_id: guji-护国-event-renunciation
  - key: closure
    name: 依佛十夏证果
    labels:
      zh:
      - 依止
      - 漏尽
    start_date: '-0500'
    highlight_event_id: guji-护国-event-renunciation
  decisions:
  - date: '-0500'
    title_zh: 恋慕法会求佛出家
    rationale: 闻法堪可依凭必成正觉，厌在家轮回，愿离放逸净修梵行
  - date: '-0500'
    title_zh: 誓绝饮食坚请父母听许
    rationale: 父母二三以财福富乐诱劝不许，唯以舍命立誓令起爱别离怖，借知识劝请而得听许
- id: guji-护国-endeavor-2
  title_zh: 还乡乞食化亲开示俱卢王
  summary: 满十夏请旨还本生处，次第乞食至本舍，拒母财宝留恋，弃金银于河，拒庄严妻室，饭讫说法显神通说偈，复为俱卢王广说老病爱死四法，令王归依受戒
  phases:
  - key: brewing
    name: 请旨还乡乞食
    labels:
      zh:
      - 还乡
      - 乞食
    start_date: '-0500'
    highlight_event_id: guji-护国-event-return
  - key: breakthrough
    name: 本舍弃宝拒惑
    labels:
      zh:
      - 弃财
      - 离欲
    start_date: '-0500'
    highlight_event_id: guji-护国-event-return
  - key: climax
    name: 说法显通化亲
    labels:
      zh:
      - 说法
      - 神通
    start_date: '-0500'
    highlight_event_id: guji-护国-event-return
  - key: closure
    name: 王前广说四法令受戒
    labels:
      zh:
      - 化王
      - 归依
    start_date: '-0500'
    highlight_event_id: guji-护国-event-king
  decisions:
  - date: '-0500'
    title_zh: 十夏满后请还本处利亲
    rationale: 思念本生眷属，心志坚固欲广利益，观昔在家常离诸欲，时机已至
  - date: '-0500'
    title_zh: 车载财宝弃河拒母妻留恋
    rationale: 了知金银财宝为诸过之本，能生水火王贼等难及贪爱坏苦，不从其留
  - date: '-0500'
    title_zh: 为俱卢王说老病爱死令归依三宝
    rationale: 王以亲属富贵病老四难诘出家因缘，直指变坏无疗无厌舍境四相，破贪爱幻法
events:
- id: guji-护国-event-birth
  title_zh: 生于睹罗聚落长者家
  date: '-0500'
  year_of: -500
  place: 睹罗聚落
  description: 生为婆罗门大长者子，眷属广多，财宝无量，少病少恼，盛年少壮
- id: guji-护国-event-hear
  title_zh: 俱卢城外法会闻佛说法发心
  date: '-0500'
  year_of: -500
  place: 睹罗聚落佛会
  description: 世尊与大苾刍众安止聚落，为婆罗门长者众说法，护国恋慕不离法会，起信乐欲求佛出家，佛以父母未听不得度，令求请听许
- id: guji-护国-event-renunciation
  title_zh: 绝食得父母听许佛前落发出家
  date: '-0500'
  year_of: -500
  place: 睹罗聚落至佛所
  description: 还家白父母再三求请不许，誓绝饮食乃至命终，知识共劝父母听许，辞亲诣佛，须发自落被袈裟成苾刍相，十夏依佛得漏尽不受后有
- id: guji-护国-event-return
  title_zh: 还本舍乞食弃宝说法显通
  date: '-0500'
  year_of: -500
  place: 本生聚落本舍及大树下
  description: 请旨还乡次第乞食至本舍，受母上味供养，拒金银珍宝车载弃河，呼妻为姊拒庄严悦诱，饭讫说法住虚空说观画色贪欲绳索偈，还大树下安住
- id: guji-护国-event-king
  title_zh: 大树下为俱卢王说老病爱死四法
  date: '-0500'
  year_of: -500
  place: 睹罗聚落侧大树下
  description: 俱卢王驾幸闻护国弃亲出家，诣树下问何见闻出家，尊者以老变坏非久病无代无救爱无厌足死舍诸境为答，重说贪爱积聚无常幻法偈，王欢喜归依佛法僧受优婆塞戒还宫
- id: guji-护国-event-death
  title_zh: 示寂
  date: '-0400'
  year_of: -400
  place: 未详
  description: 经中未载灭度事迹，系化王之后示寂，年代不详，姑系佛灭前后
