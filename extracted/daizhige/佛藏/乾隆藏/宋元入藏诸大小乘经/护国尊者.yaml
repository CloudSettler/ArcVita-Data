endeavors:
- id: guji-护国尊者-endeavor-1
  title_zh: 舍卫安居毕诣鹫峰礼佛
  description: 于舍卫大城安居三月夏竟与苾刍初出家初发心众出舍卫诣王舍城鹫峰山礼佛绕匝赞叹光明
  phases:
  - key: brewing
    name: 舍卫安居持律
    labels:
      zh: 安居圆满
    start_date: -0520-05-01
    highlight_event_id: guji-护国尊者-event-anju
  - key: breakthrough
    name: 远行诣鹫峰谒佛
    labels:
      zh: 参谒世尊
    start_date: -0520-07-15
    highlight_event_id: guji-护国尊者-event-chaoye
  decisions:
  - date: -0520-07-15
    title_zh: 决意率众诣鹫峰
    rationale: 夏竟因缘具足为面见世尊求最上义故不惮远行率众前往
  - date: -0520-08-01
    title_zh: 决意礼赞后请法
    rationale: 睹佛光明威仪先以颂赞表敬然后偏袒合掌请问以显恭敬求法之心
- id: guji-护国尊者-endeavor-2
  title_zh: 鹫峰请问菩萨大乘行法
  description: 合掌白佛请问菩萨行法具足功德之要佛为说内外心意清净四法总持善友忍戒舍施等菩萨行及损减缚苦报诸过
  phases:
  - key: climax
    name: 正式请问菩萨行
    labels:
      zh: 请问大乘
    start_date: -0520-08-01
    highlight_event_id: guji-护国尊者-event-qingfa
  - key: closure
    name: 谛听受持四种法门
    labels:
      zh: 谛听受持
    start_date: -0520-08-02
    highlight_event_id: guji-护国尊者-event-qingfa
  decisions:
  - date: -0520-08-01
    title_zh: 决定请问最上乘不乐小乘
    rationale: 自知菩提性乐闻第一法为令多人安乐摄受未来菩萨故发大愿请益
  - date: -0520-08-02
    title_zh: 决定谛听善思念之
    rationale: 佛命谛听即承教受持于总持善友无生忍持戒等四法愿依言修行
events:
