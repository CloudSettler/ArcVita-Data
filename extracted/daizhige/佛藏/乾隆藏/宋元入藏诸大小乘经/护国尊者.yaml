  description: 与苾刍众出舍卫至王舍鹫峰头面礼足右绕三匝以颂赞佛身光明相好智慧功德
- id: guji-护国尊者-event-qingfa
  title_zh: 鹫峰请问菩萨行法
  date: -0520-08-01
  year_of: -520
  description: 偏袒右肩右膝著地合掌请问何等法为菩萨行法具足佛为说四种清净安慰爱乐远离损减等菩萨法门
- id: guji-护国尊者-event-death
  title_zh: 佛灭前后入灭
  date: '-0450'
  year_of: -450
  description: 于佛灭前后入灭具体年代不详后人结集其所问为护国尊者所问大乘经
