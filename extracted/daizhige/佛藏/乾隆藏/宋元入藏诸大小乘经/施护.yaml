    highlight_event_id: guji-施护-event-3
  decisions:
  - date: 0995
    title_zh: 详译八陀罗尼并存梵音
    rationale: 持明以音声为体若但取义不存音则神验不生故须音义兼传令行人持诵易成
  - date: 0998
    title_zh: 明示四时修法与先行法
    rationale: 念众生根器各异时节因缘不同故分别中秋十月冬春夏等时及尸林河岸等处使各得其宜速获悉地
