endeavors:
- id: guji-施护-endeavor-1
  title_zh: 奉诏译金刚场庄严般若波罗蜜多教
  summary_zh: 奉宋廷诏命，于译场别行传译大部般若支流，宣说毗卢遮那金刚瑜伽秘密句，摄四念处乃至十八不共法归平等法门。
  phases:
  - key: brewing
    name: 西域来华待诏
    labels:
      zh: 西域来华待诏
    start_date: 0980-01-01
    highlight_event_id: guji-施护-event-ruhua
  - key: breakthrough
    name: 授官参译显密
    labels:
      zh: 授官参译显密
    start_date: 0983-01-01
    highlight_event_id: guji-施护-event-ruhua
  - key: climax
    name: 别行宣说金刚场庄严
    labels:
      zh: 别行宣说金刚场庄严
    start_date: 0995-01-01
    highlight_event_id: guji-施护-event-yijingangchang
  - key: closure
    name: 刊定进呈入藏
    labels:
      zh: 刊定进呈入藏
    start_date: 1000-01-01
    highlight_event_id: guji-施护-event-yijingangchang
  decisions:
  - date: 0983-01-01
    title_zh: 应诏留阙受传法大师号
    rationale: 为得译场护持与正名，使梵本得以流传，故受朝散大夫试鸿胪少卿之职而专心译事
  - date: 0995-01-01
    title_zh: 于大部支流别行一分
    rationale: 金刚场庄严义广文繁，若全译难周，故先别人出此一分，使瑜伽秘密与般若平等速得流通
- id: guji-施护-endeavor-2
  title_zh: 主持译场传法弘化成熟有情
  summary_zh: 久住宋译场，与法天等共译显密经律，护念正法，以增上事业成熟有情，安住金刚萨埵三摩地。
  phases:
  - key: brewing
    name: 习梵通华兼学瑜伽
    labels:
      zh: 习梵通华兼学瑜伽
    start_date: 0970-01-01
    highlight_event_id: guji-施护-event-ruhua
  - key: breakthrough
    name: 入译场协同创制新译
    labels:
      zh: 入译场协同创制新译
    start_date: 0984-01-01
    highlight_event_id: guji-施护-event-ruhua
  - key: climax
    name: 宣演三十七道品等平等观
    labels:
      zh: 宣演道品平等观
    start_date: 0995-01-01
    highlight_event_id: guji-施护-event-yijingangchang
  - key: closure
    name: 以法供养归命诸佛
    labels:
      zh: 以法供养归命诸佛
    start_date: 1010-01-01
    highlight_event_id: guji-施护-event-death
  decisions:
  - date: 0984-01-01
    title_zh: 坚持音义兼顾存密语大明
    rationale: 秘密大明句义不可意译，存梵音则加持不失，故以汉字转音存真言而以义释显教理
  - date: 1010-01-01
    title_zh: 以所说正法普遍供养
    rationale: 译经非为名位，乃为报佛恩与成熟有情，故发愿以一分一偈普供十方如来
events:
- id: guji-施护-event-birth
  title_zh: 生于北印度乌仗那
  date: 0950-01-01
  year_of: 0950
  place_zh: 北印度乌仗那国
  description_zh: 施护生于乌仗那，少习梵典兼通瑜伽密法，后发心东来传法。
- id: guji-施护-event-ruhua
  title_zh: 太平兴国中至阙授传法大师
  date: 0983-01-01
  year_of: 9983
  place_zh: 开封译经院
  description_zh: 太平兴国中来华至阙，太宗赐名施护，授朝散大夫试鸿胪少卿传法大师，入译场奉诏译经。
- id: guji-施护-event-yijingangchang
  title_zh: 译出金刚场庄严般若波罗蜜多教中一分
  date: 0995-01-01
  year_of: 9995
  place_zh: 开封译场
  description_zh: 自大部般若支流别行译此一分，述大毗卢遮那入智金刚三摩地，妙吉祥请问，宣说四念处四正断乃至十八不共法诸大明句。
- id: guji-施护-event-death
  title_zh: 示寂于宋真宗朝
  date: 1017-01-01
  year_of: 1017
  place_zh: 开封
  description_zh: 久住译场译经弘化后示寂，所译显密典籍入藏流通，后世列为宋代入藏诸大小乘经之一。
