  dilemmas:
  - 梵本密义幽深与奉诏速译进呈之间的张力
  - 金刚瑜伽秘密持验与般若显教普化之间的分寸
  lesson: 以正慧为因安住平等法门于秘密句中显第一义
  summary_first_person: 我是施护，本西域乌仗那人，入宋待诏译场，蒙授朝散大夫试鸿胪少卿传法大师，奉诏译金刚场庄严般若波罗蜜多教中一分，宣说四念处乃至十八不共法平等清净之旨，愿以此秘密正法句成熟一切有情。
