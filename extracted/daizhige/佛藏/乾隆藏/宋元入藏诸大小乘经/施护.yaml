    start_date: 0985
    highlight_event_id: guji-施护-event-985
  - key: climax
    name: 独掌译场广出经论
    labels:
      zh: 主持译场
    start_date: '1000'
    highlight_event_id: guji-施护-event-1000
  - key: closure
    name: 晚年校定论功归寂
    labels:
      zh: 圆满归寂
    start_date: '1014'
    highlight_event_id: guji-施护-event-death
  decisions:
  - date: 0982
    title_zh: 随法天东来入宋译场
    rationale: 不辞远涉山海，欲以梵本利乐中土，依朝廷译经制度共弘佛法
  - date: '1000'
    title_zh: 天息灾寂后独任传译
    rationale: 法席不可空，奉敕继续校译显密经律，以全译业始终
- id: guji-施护-endeavor-2
  title_zh: 密部陀罗尼汉译弘传
  summary: 专译金刚部陀罗尼，译出佛说大金刚香陀罗尼经，宣说降伏宿曜护持佛法作大吉祥
  phases:
  - key: brewing
    name: 研习金刚部密轨仪范
    labels:
      zh: 研习密部
    start_date: 0990
    highlight_event_id: guji-施护-event-1000
  - key: breakthrough
