  reign_ref: 宋太宗太平兴国至宋真宗天禧
  archetype: 译经三藏
  dilemmas:
  - title_zh: 梵汉悬隔而奉诏传译
    description: 梵文精微汉文广大，既须忠实不失密语威力，又须晓畅以利中土持诵
  - title_zh: 密教护国与显教弘传之间
    description: 既弘般若显教以立正见，又译陀罗尼密轨以禳星曜护国，不偏废一方
  lesson: 以信以勤跨越语言山海，令金刚香遍熏中土，护法护国即是修行
  summary_first_person: 吾乃西天乌荼国人施护，奉宋圣诏入译经院为传法大师，三十余年译显密经百余卷，复出大金刚香陀罗尼以伏星曜护佛法，愿此大明作大吉祥
  source_urls:
  - https://daizhige.org/fo-zang/qian-long-zang/song-yuan-ru-zang-zhu-da-xiao-cheng-jing/fo-shuo-da-jin-gang-xiang-tuo-luo-ni-jing.html
  - https://tripitaka.cbeta.org/T1401
