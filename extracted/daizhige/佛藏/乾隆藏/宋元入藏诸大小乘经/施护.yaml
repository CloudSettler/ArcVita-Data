  date: 0991
  year_of: 991
  place_zh: 开封
  summary_zh: 以译功懋著授西天北印度三藏传法大师，赐朝奉大夫试鸿胪少卿
  endeavor_ref: guji-施护-endeavor-1
- id: guji-施护-event-1000-baosheng
  person_id: guji-施护
  title_zh: 译出佛说宝生陀罗尼经
  date: '1000'
  year_of: 1000
  place_zh: 开封译经院
  summary_zh: 奉诏译宝生陀罗尼经一卷，宣说受持宝生如来名号陀罗尼得转轮位具梵行神通，持诵七日得天眼清净，流通灭无间罪
  endeavor_ref: guji-施护-endeavor-2
- id: guji-施护-event-1001-circulation
  person_id: guji-施护
  title_zh: 宝生陀罗尼劝流通四方
  date: '1001'
  year_of: 1001
  place_zh: 开封
  summary_zh: 劝众受持供养宝生陀罗尼，传一人即除无间业障，闻已礼拜赞叹者生生口出妙香身光照曜如阿难陀胜利
  endeavor_ref: guji-施护-endeavor-2
- id: guji-施护-event-death
  person_id: guji-施护
  title_zh: 天禧元年卒于译场
  date: '1017'
  year_of: 1017
  place_zh: 开封
  summary_zh: 真宗天禧元年示寂于开封，毕生译籍编入宋元入藏，宝生陀罗尼至今流通
