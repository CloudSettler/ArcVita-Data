  era: 北宋
  reign_ref: 宋太宗太平兴国至宋真宗天禧
  archetype: 西天译经三藏
  dilemmas:
  - 梵汉悬隔，如何既存梵音密义又令华人可持可诵
  - 身寄朝廷译场，如何在奉诏体制中不失出家梵行本怀
  lesson: 一卷虽简，受持流通即种菩提，以至诚持名利他为报佛恩
  summary_first_person: 我是施护，北印度人，宋初携梵本来华，隶译经院奉诏传译，译出宝生陀罗尼等经二百余卷，愿闻者受持供养永不失菩提心
  source_urls:
  - https://daizhige.org/fozang/qianlongzang/songyuanrucang/baoshengtuoluonijing.html
  - https://tripitaka.cbeta.org/T1412
endeavors:
- id: guji-施护-endeavor-1
  person_id: guji-施护
  title_zh: 西土东来入宋译场
  summary_zh: 自乌填曩国远涉中土，于太平兴国五年抵阙，习华言，入译经院，授传法大师试鸿胪少卿，主持译事三十余年
  phases:
  - key: brewing
    name: 西土学法
    labels:
      zh: 北印度习显密
    start_date: 0950
    highlight_event_id: guji-施护-event-birth
  - key: breakthrough
    name: 远涉东来
    labels:
      zh: 太平兴国抵宋
    start_date: 0980
    highlight_event_id: guji-施护-event-980-arrival
  - key: climax
    name: 隶籍译经院
    labels:
      zh: 与法天共参译务
    start_date: 0982
    highlight_event_id: guji-施护-event-982-translation-begin
  - key: closure
    name: 授号传法
    labels:
      zh: 赐传法大师
    start_date: 0991
    highlight_event_id: guji-施护-event-991-honor
  decisions:
  - date: 0980
    title_zh: 决意携梵本东行
    rationale: 西土法宝丰富而东土渴仰，借宋廷护法广布显密以续佛慧命
  - date: 0982
    title_zh: 先习华言再主笔译事
    rationale: 不通华言则梵义难显，唯有精通两土语言方能传信达雅
- id: guji-施护-endeavor-2
  person_id: guji-施护
  title_zh: 奉诏译弘宝生陀罗尼
  summary_zh: 奉诏译出宝生陀罗尼经一卷，具载宝生如来陀罗尼名号及受持供养得转轮位具神通等十种功德，劝流通广远
  phases:
  - key: brewing
    name: 抉择法门
    labels:
      zh: 拣宝生梵本
    start_date: 0999
    highlight_event_id: guji-施护-event-982-translation-begin
  - key: breakthrough
    name: 音译真言
    labels:
      zh: 定陀罗尼梵音
    start_date: '1000'
    highlight_event_id: guji-施护-event-1000-baosheng
  - key: climax
    name: 宣说功德
    labels:
      zh: 明持诵现证利益
    start_date: '1000'
    highlight_event_id: guji-施护-event-1000-baosheng
  - key: closure
    name: 入藏流通
    labels:
      zh: 宋元入藏传远
    start_date: '1001'
    highlight_event_id: guji-施护-event-1001-circulation
  decisions:
  - date: '1000'
    title_zh: 真言全存梵音不翻
    rationale: 陀罗尼以声音为体，存音方能摄持神效，意译则失密义
  - date: '1000'
    title_zh: 以小经劝大行流通
    rationale: 经文虽简而摄生生转轮不入轮回不断菩提种诸胜，流通一人即灭无间罪故力劝传持
events:
