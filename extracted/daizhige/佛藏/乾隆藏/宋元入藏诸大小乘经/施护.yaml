  date: '1010'
  year_of: 1010
  description: 奉诏译出佛说大金刚香陀罗尼经，宣说金刚香大力最胜能破诸山降伏宿曜，令护持佛法作大吉祥
- id: guji-施护-event-death
  title_zh: 宋真宗天禧元年示寂
  date: '1017'
  year_of: 1017
  description: 在译经院示寂，朝廷念其传法之功，译业终始三十余年，梵本汉译并行于世
