  title_zh: 至汴京入译经院
  date: 0982
  year_of: 982
  description: 宋太宗太平兴国七年随天息灾法贤至京师，入译经院习汉文参译，始奉诏传法
- id: guji-施护-event-985
  title_zh: 授朝散大夫试鸿胪卿传法大师
  date: 0985
  year_of: 985
  description: 宋太宗雍熙中授朝散大夫试鸿胪卿传法大师，赐紫方袍，专职译经润文
- id: guji-施护-event-1000
  title_zh: 接掌译场广译显密
  date: '1000'
  year_of: 1000
  description: 天息灾示寂后与法贤等共掌译事，先后译出大乘庄严经论等百余卷，兼弘密部
- id: guji-施护-event-1010
