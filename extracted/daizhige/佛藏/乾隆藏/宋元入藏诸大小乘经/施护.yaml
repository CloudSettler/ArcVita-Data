  lesson: 以简要心经摄甚深般若以忠实翻译续佛慧命令人天同得欢喜受持
  summary_first_person: 我是施护生于北印度乌填曩国少习三藏奉法东来入宋蒙诏入太平兴国寺译场与法天等共译显密诸经我奉诏译此帝释般若波罗蜜多心经述世尊在王舍城鹫峰山为帝释憍尸迦说般若平等寂静不生不灭及十八空并诸真言愿大众闻已欢喜信受奉行
