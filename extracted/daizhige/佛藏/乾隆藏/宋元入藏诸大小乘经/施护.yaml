  decisions:
  - date: 0980
    title_zh: 应诏入太平兴国译经院
    rationale: 感宋廷崇法置院之诚愿以梵学长才助群译使正法东传不负西来本怀
  - date: 0985
    title_zh: 与天息灾分工参详梵汉
    rationale: 以彼精梵吾习华言互证互参方能义无乖谬咒无舛误成就信达之译
- id: guji-施护-endeavor-2
  title_zh: 奉诏译出持明藏八大总持王经
  summary_zh: 为末世众生奉诏译出持明藏八大总持王经宣说八大总持息灾增益拥护之法嘱阿难流传不断
  phases:
