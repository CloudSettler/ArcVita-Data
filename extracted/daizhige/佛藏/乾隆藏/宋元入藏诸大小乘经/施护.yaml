      zh: 译出金刚香
    start_date: '1010'
    highlight_event_id: guji-施护-event-1010
  - key: climax
    name: 宣说降伏诸天星曜
    labels:
      zh: 降伏星曜
    start_date: '1010'
    highlight_event_id: guji-施护-event-1010
  - key: closure
    name: 付嘱流通护持正法
    labels:
      zh: 付嘱流通
    start_date: '1017'
    highlight_event_id: guji-施护-event-death
  decisions:
  - date: '1010'
    title_zh: 以密语直 transliteration 存真言威力
    rationale: 陀罗尼功在音声，宁存梵音不顺汉易，使持诵者得降伏星曜之用
  - date: '1010'
    title_zh: 明言此经能护佛法作大吉祥
    rationale: 令如来族降伏三界，使人天知持明功德，生信受持流通不断
events:
