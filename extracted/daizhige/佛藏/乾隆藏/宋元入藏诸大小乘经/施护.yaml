  dilemmas:
  - title_zh: 胡汉文字隔阂与义理忠实之难
    description: 梵本精微译成华言既须信达又须契合般若空性深义稍有增损即失佛意
  - title_zh: 奉诏译经与专修证悟之衡
    description: 日居译场校雠笔受不辍而自修观行时稀如何在利他译业与自利修持间不偏废
  lesson: 以信达传灯不增不减弘般若空慧当以平等摄受一切善法为怀
  summary_first_person: 我是施护本出西域于阗慕华法盛入宋应诏居译经院试鸿胪少卿传法大师奉诏译出五十颂圣般若波罗蜜等经愿以般若方便平等摄受一切善法令学者速获正觉
  source_urls:
