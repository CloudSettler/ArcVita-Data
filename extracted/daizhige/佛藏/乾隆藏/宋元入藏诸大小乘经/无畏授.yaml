person:
  qid: guji-无畏授
  name_zh: 无畏授
  names:
    zh: 无畏授
    en: Abhayadatta
  lifespan:
    birth:
      date: -360
      precision: year
      is_circa: true
      raw: 舍卫城长者生年不详约佛世之中叶
    death:
      date: -0480
      precision: year
      is_circa: true
      raw: 没年不详约佛灭前后
  birth_date: -360
  death_date: -0480
  era: 东周春秋末古印度憍萨罗国时
  reign_ref: 释迦牟尼在舍卫祇园弘化时
  archetype: 舍财求法之居士长者
  dilemmas:
  - 声闻缘觉速得涅槃与大乘久修利他之间当何从
  - 身命财亲深生爱著与欲证菩提须尽舍离之间如何断著
  - 现世富乐眷属围绕与轮回苦空无常之间如何抉择
  lesson: 不著身命财亲方能广利有情观身不净无常即是趣入大乘之门
  summary_first_person: 吾为舍卫长者无畏授与五百长者共议不乐小乘唯求无上菩提诣佛请问云何住学修行蒙佛开示观身不净及四十四相遂得无生法忍并蒙授记当来同名莲华吉祥藏如来
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/宋元入藏诸大小乘经/佛说无畏授所问大乘经.html
  - https://cbetaonline.dila.edu.tw/zh/T0331
endeavors:
- id: guji-无畏授-endeavor-1
  title_zh: 率五百长者发大乘心诣佛请法
  summary: 在舍卫城与五百长者集会共议感佛出世难值立志不求小乘唯趣无上大乘出城诣祇园请问菩萨云何住学修行
  phases:
  - key: brewing
    name: 舍卫集会共论难值
    labels:
      zh: 集会共议
    start_date: -320
    highlight_event_id: guji-无畏授-event-gather
  - key: breakthrough
    name: 同舍小乘共趣大乘
    labels:
      zh: 立志大乘
    start_date: -320
    highlight_event_id: guji-无畏授-event-vow
  - key: climax
    name: 出城诣祇园请问住学
    labels:
      zh: 诣佛请问
    start_date: -320
    highlight_event_id: guji-无畏授-event-visit
  - key: closure
    name: 蒙佛赞许受教而听
    labels:
      zh: 蒙佛许可
    start_date: -320
    highlight_event_id: guji-无畏授-event-visit
  decisions:
  - date: -320
    title_zh: 不于声闻缘觉中求涅槃
    rationale: 念佛出世难人身难得净信难修行难故舍小乘而于无上大乘中求涅槃以利一切有情
  - date: -320
    title_zh: 率众诣世尊问云何住学修行
    rationale: 欲安住阿耨多罗三藐三菩提须亲承佛教故与五百长者同诣祇树给孤独园顶礼请法
- id: guji-无畏授-endeavor-2
  title_zh: 闻观身不净法门得忍蒙授记
  summary: 蒙佛开示于一切有情起大悲于身命财亲不生爱著观身不净无常苦空四十四相闻已得无生法忍蒙记当来成佛
  phases:
  - key: brewing
    name: 咨问云何离身命爱著
    labels:
      zh: 请问离著
    start_date: -320
    highlight_event_id: guji-无畏授-event-visit
  - key: breakthrough
    name: 闻观身不净无常苦空
    labels:
      zh: 闻观身法
    start_date: -320
    highlight_event_id: guji-无畏授-event-enlighten
  - key: climax
    name: 闻法得无生法忍踊跃说颂
    labels:
      zh: 得忍欢喜
    start_date: -320
    highlight_event_id: guji-无畏授-event-enlighten
  - key: closure
    name: 蒙记贤劫后成莲华吉祥藏如来
    labels:
      zh: 蒙佛授记
    start_date: -320
    highlight_event_id: guji-无畏授-event-prophecy
  decisions:
  - date: -320
    title_zh: 以四十四相观身断一切系著
    rationale: 了知身如聚沫幻化不净无主终归破坏故断于身命舍宅妻子财宝一切乐欲顾惜执著以圆满六波罗蜜
  - date: -320
    title_zh: 誓于深经生最上爱乐广施安乐
    rationale: 得大利无生法忍已发起广大菩提心愿为一切有情施安乐于当来世见者欢喜同发菩提心
events:
- id: guji-无畏授-event-birth
  title_zh: 生于舍卫城长者家积财巨富
  date: -360
  year_of: -550
  location_zh: 舍卫城
  summary: 生于舍卫大长者家大富自在金银琉璃象马奴婢库藏充满为五百长者之上首
- id: guji-无畏授-event-gather
  title_zh: 与五百长者集会共议求大乘
  date: -320
  year_of: -500
  location_zh: 舍卫城
  summary: 与五百长者集会论佛出世难人身难得净信难修行难议定不趣声闻缘觉唯于无上大乘中求涅槃
- id: guji-无畏授-event-vow
  title_zh: 发广大胜心誓趣无上菩提
  date: -320
  year_of: -500
  location_zh: 舍卫城
  summary: 众会咸发广大胜心皆言悉于无上大乘法中趣求涅槃不乐声闻缘觉之乘
- id: guji-无畏授-event-visit
  title_zh: 围绕出城诣祇园问菩萨行
  date: -320
  year_of: -500
  location_zh: 舍卫国祇树给孤独园
  summary: 与五百长者围绕出舍卫城诣世尊所头面礼足右绕七匝退坐一面请问菩萨欲证菩提当云何住云何学云何修行
- id: guji-无畏授-event-enlighten
  title_zh: 闻观身四十四相得无生法忍
  date: -320
  year_of: -500
  location_zh: 舍卫国祇树给孤独园
  summary: 闻佛说身不净聚沫幻化及四十四相观门断身命财亲一切爱著即得无生法忍生最上踊跃欢喜而说颂言
- id: guji-无畏授-event-prophecy
  title_zh: 蒙佛授记当来同名莲华吉祥藏
  date: -320
  year_of: -500
  location_zh: 舍卫国祇树给孤独园
  summary: 世尊放光告阿难五百长者曾供过去佛不堕恶趣当值慈氏及贤劫诸佛最后过二十五劫同名莲华吉祥藏如来出世并名此经为菩萨瑜伽师地法门亦名无畏授所问
- id: guji-无畏授-event-death
  title_zh: 舍卫示灭归于无常
  date: -0480
  year_of: -480
  location_zh: 舍卫城
  summary: 生人天中受胜妙乐后示现老死归于弃尸林以显身无常不净如佛所说终归破坏之义
