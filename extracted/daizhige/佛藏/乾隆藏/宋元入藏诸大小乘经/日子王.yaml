  - 耽着女色淫欲造业当堕地狱不知丈夫四过与孝亲之道
  lesson: 离淫欲远女色亲善友孝父母持戒念佛忏悔受持以免恶趣得安乐解脱
  summary_first_person: 我是憍闪弥的日子王听信嫉女谗言举箭射舍摩嚩底夫人蒙其慈心定护持箭出火焰回住不伤我惊怖倒地归命忏悔随夫人诣瞿尸罗林见佛发露闻男女诸过受持三归永舍淫欲愿利众生
