endeavors:
- id: guji-月光-endeavor-1
  title_zh: 治贤石城普施四洲
  description: 统领四洲六万八千国，建楼阁园林，于四门堆聚财物击鼓大施，令南赡部洲无一贫乏
  phases:
  - key: brewing
    name: 营建贤石丰熟安隐
    labels:
      zh: 筑基
    start_date: -1490-01-01
    highlight_event_id: guji-月光-event-birth
  - key: breakthrough
    name: 四门开施普给所需
    labels:
      zh: 大施
    start_date: -1480-01-01
    highlight_event_id: guji-月光-event-giving
  - key: climax
    name: 众生富贵庄严如王身
    labels:
      zh: 丰足
    start_date: -1475-01-01
    highlight_event_id: guji-月光-event-giving
  - key: closure
    name: 以十善化众城如忉利
    labels:
      zh: 教化
    start_date: -1470-01-01
    highlight_event_id: guji-月光-event-giving
  decisions:
  - date: -1480-01-01
    title_zh: 于市肆街巷及城四门大开施会
    rationale: 虽众生无贫乏，犹未与己齐等，欲以细妙衣宝令皆如己身
  - date: -1470-01-01
    title_zh: 尽寿命施众生不得间断
    rationale: 以慈愍利乐群生为本愿，告谕大臣恒行施化不绝
- id: guji-月光-endeavor-2
  title_zh: 摩尼苑舍头圆满檀度
  description: 恶眼婆罗门来乞王头，不顾天人大臣劝阻，于摩尼宝藏苑自断其头，发愿求无上正觉建塔利生
  phases:
  - key: brewing
    name: 二相恶梦示舍头缘
    labels:
      zh: 预兆
    start_date: -1465-01-01
    highlight_event_id: guji-月光-event-omen
  - key: breakthrough
    name: 恶眼远来直乞王头
    labels:
      zh: 乞头
    start_date: -1460-06-01
    highlight_event_id: guji-月光-event-omen
  - key: climax
    name: 瞻卜树下自断其头
    labels:
      zh: 舍身
    start_date: -1460-01-01
    highlight_event_id: guji-月光-event-beheading
  - key: closure
    name: 收舍利建塔供养利生
    labels:
      zh: 建塔
    start_date: -1460-01-01
    highlight_event_id: guji-月光-event-stupa
  decisions:
  - date: -1460-06-01
    title_zh: 拒七宝代头欢喜许舍真头
    rationale: 为圆满檀波罗蜜，满乞者本愿，不惜脓血不净身以求菩提果
  - date: -1460-01-01
    title_zh: 选摩尼宝藏苑为舍头净处
    rationale: 苑中花果流泉最为第一，宜于净处舍内财，令舍利建塔普利见闻者生天发心
events:
- id: guji-月光-event-birth
  title_zh: 贤石城月光天子诞生
  type: birth
  date: -1500-01-01
  year_of: -1500
  place_zh: 北印度贤石大城
  description: 具天眼宿命通，身色端严光明照耀如天满月，故号月光，统领四洲
- id: guji-月光-event-giving
  title_zh: 四门击鼓普施一切
  type: career
  date: -1480-01-01
  year_of: -1480
  place_zh: 贤石城市肆街巷及城四门
  description: 堆聚金银珍宝饮食衣服医药，告令众人随意求给，南赡部洲皆至王城得大富贵
- id: guji-月光-event-omen
  title_zh: 大月持地恶梦与恶眼来乞
  type: career
  date: -1460-06-01
  year_of: -1460
  place_zh: 贤石城王宫及香醉山
  description: 二辅相梦王冠黑烟四体分散，恶眼婆罗门自香醉山来乞王头，天地昏黑大地震动
- id: guji-月光-event-beheading
  title_zh: 摩尼苑发系无忧树舍头
  type: career
  date: -1460-01-01
  year_of: -1460
  place_zh: 摩尼宝藏苑瞻卜树下
  description: 以发系树执剑自断其头，三千大千六种振动，天雨妙花赞当得成佛，发愿不求王位但求无上正觉
- id: guji-月光-event-stupa
  title_zh: 焚身收舍利建塔供养
  type: career
  date: -1459-01-01
  year_of: -1459
  place_zh: 摩尼苑及四衢路
  description: 以旃檀焚烧遗体，舍利如白芥子，于苑及衢路各起一塔，众生瞻礼者命终生天发菩提心
- id: guji-月光-event-death
  title_zh: 月光天子舍头命终
  type: death
  date: -1460-01-01
  year_of: -1460
  place_zh: 摩尼宝藏苑
  description: 舍头圆满檀波罗蜜而命终，佛记即今我身，二辅相即舍利弗目连，恶眼即提婆达多
