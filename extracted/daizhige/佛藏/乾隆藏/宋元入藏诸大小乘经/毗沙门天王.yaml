endeavors:
- id: guji-毗沙门天王-endeavor-1
  person_qid: guji-毗沙门天王
  title_zh: 统领药叉守护北方与四大洲
  summary: 居北方阿拏迦嚩帝大城，统领药叉眷属，协同东西南三方天王护持四大洲，守护国界安隐众生
  phases:
  - key: brewing
    name: 居北方大城统领药叉
    labels:
      zh:
      - 统领
      - 护世
    start_date: -1000
    highlight_event_id: guji-毗沙门天王-event-birth
    description: 住北方阿拏迦嚩帝大城，身光炽盛如大火焰，眷属围绕歌舞受乐
  - key: climax
    name: 协同四王护持四大洲
    labels:
      zh:
      - 护国
      - 护洲
    start_date: -384
    highlight_event_id: guji-毗沙门天王-event-1
    description: 与持国尾噜茶迦尾噜博叉各以威德护四大洲，守护人寿千岁北方及余洲
  decisions:
  - date: -384
    title_zh: 以威德护世而非法行化
    rationale: 非人刚暴难化，故以天王威力摄伏守护，令如佛行行如是护世
  - date: -320
    title_zh: 率眷属夜诣佛所归依
    rationale: 见恶药叉恼乱林间修行四众，故亲诣祇园请说能护明护之经
- id: guji-毗沙门天王-endeavor-2
  person_qid: guji-毗沙门天王
  title_zh: 佛前宣说阿吒曩胝护持四众
  summary: 初夜诣舍卫祇园礼佛，以偈赞佛，承佛威神宣说护世经典及诸真言，令持经四众得天人密护
  phases:
  - key: breakthrough
    name: 夜诣祇园礼佛请法
    labels:
      zh:
      - 礼佛
      - 请法
    start_date: -320
    highlight_event_id: guji-毗沙门天王-event-1
    description: 与百千药叉初夜分俱来佛所，放大光明照祇陀园，五体投地以偈赞正觉
  - key: closure
    name: 宣说真言流通护经
    labels:
      zh:
      - 说咒
      - 流通
    start_date: -320
    highlight_event_id: guji-毗沙门天王-event-2
    description: 次第宣说乾闼婆闭舍左鸠盘拏龙药叉罗刹等真言，敕令亲近卫护持经者
  decisions:
  - date: -320
    title_zh: 为正信药叉请说经典
    rationale: 会中有正信药叉乐闻，故默然受请向佛礼足宣说，除众生一切烦恼
  - date: -320
    title_zh: 以头破七分诃止恼乱
    rationale: 恶性非人不信佛言恼乱有情，故立誓闻此真言不舍离者头破如阿梨树枝
