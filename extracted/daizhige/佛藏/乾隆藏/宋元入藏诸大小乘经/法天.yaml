    death:
      date: '1001'
      precision: year
      is_circa: false
      raw: 宋咸平四年卒于东京开封
  birth_date: 0950
  death_date: '1001'
  era: 北宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 译经传教三藏师
  dilemmas:
  - 梵汉悬隔圣义难显，直存梵本真辞还是顺俗意译以便中土信受
  - 外道执我疑身有啼笑憎爱，破执说空又恐堕于有无二边当如何善说
  lesson: 观身与本性体本空无我，诸事如梦幻化影，远离世间庄严戏论，发菩提心相应般若以趣解脱
  summary_first_person: 我本西天中印度摩伽陀国人，奉宋诏来华传教译经，于大众中为外道决疑，说身无我本性空寂，啼笑憎爱皆如梦幻阳焰，劝观菩提心清净无住以证涅槃
