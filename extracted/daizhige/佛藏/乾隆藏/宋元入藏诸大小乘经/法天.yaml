    rationale: 七佛功德各异唯存原音讽诵方能感应道交故逐佛立赞
  - date: 0985-01-01
    title_zh: 附慈氏及回向结赞
    rationale: 过去七佛已竟当次扬未来化主并以回向摄众归于解脱故增二赞
