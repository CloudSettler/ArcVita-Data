  description_zh: 生年不详约十世纪前叶生于摩伽陀幼习梵文悉昙显密经论本名达摩提婆
- id: guji-法天-event-1
  title_zh: 抵汴入太平兴国寺译经院蒙赐名法天
  date: 0985
  year_of: 985
