endeavors:
- id: guji-法天-endeavor-1
  title_zh: 奉诏赴宋译经传教
  summary: 自摩伽陀国西来入宋，蒙诏入译经院，与施护等共译大小乘经，绍隆梵汉译业
  phases:
  - key: brewing
    name: 西土习学蕴志东传
    labels:
      zh: 摩伽陀习法
    start_date: 0950
    highlight_event_id: guji-法天-event-birth
  - key: breakthrough
    name: 太平兴国抵阙授命
    labels:
      zh: 奉诏入院
    start_date: 0976
    highlight_event_id: guji-法天-event-arrive-song
  - key: climax
    name: 开封译场广出经教
    labels:
      zh: 译场正盛
    start_date: 0982
    highlight_event_id: guji-法天-event-translate-wuwo
  - key: closure
    name: 咸平示寂译业垂范
    labels:
      zh: 示寂存法
    start_date: '1001'
    highlight_event_id: guji-法天-event-death
  decisions:
  - date: 0976
    title_zh: 应诏入华不归西土
    rationale: 为使大乘正法东被中土，舍乡土安乐就译场艰辛
  - date: 0982
    title_zh: 采取梵汉对校直译存真
    rationale: 恐失无我空义故宁存质朴，不以华饰损圣旨
- id: guji-法天-endeavor-2
  title_zh: 宣说大乘无我空义决疑
  summary: 译传外道问圣大乘无我义经，破身见我执，示二种庄严与菩提心相，导外道住于大乘
  phases:
  - key: brewing
    name: 外道怀执我疑来问
    labels:
      zh: 疑生请决
    start_date: 0982
    highlight_event_id: guji-法天-event-translate-wuwo
  - key: breakthrough
    name: 示身空如梦幻化影
    labels:
      zh: 破执显空
    start_date: 0982
    highlight_event_id: guji-法天-event-translate-wuwo
  - key: climax
    name: 明真如庄严与菩提心
    labels:
      zh: 显真发心
    start_date: 0983
    highlight_event_id: guji-法天-event-translate-wuwo
  - key: closure
    name: 外道疑断住大乘退
    labels:
      zh: 得住大乘
    start_date: 0984
    highlight_event_id: guji-法天-event-translate-wuwo
  decisions:
  - date: 0982
    title_zh: 以有无二法遮遣立破
    rationale: 外道执有啼笑为我故先观身内外不见本性，再明空非所如以离二边
  - date: 0983
    title_zh: 示菩提心离相劝观般若
    rationale: 为令久轮回者远离天乐戏论，故示心性虚空清净劝恒观解脱
