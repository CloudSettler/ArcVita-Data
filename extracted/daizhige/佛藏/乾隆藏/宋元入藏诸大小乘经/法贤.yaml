  - title_zh: 梵汉悬隔而义须确诂
    description: 梵音咒句繁难而华言难肖，既存梵音又令华人可持是为两难
  - title_zh: 逆罪深重而愿力弘大
    description: 五逆重罪难灭而陀罗尼威力广大，令罪人起至诚心是为两难
  lesson: 至诚受持则重罪可灭，译场之业在信解行持
  summary_first_person: 我是法贤，本名天息灾，生于迦湿弥罗，随兄入宋，蒙太宗赐名，授明教大师，奉诏译经，宣说灭除五逆罪大陀罗尼，愿众生至诚受持皆得灭罪
