    rationale: 见众生五逆罪重沉沦难出，唯大陀罗尼具大威力可救，故当机宣说
  - date: 0991
    title_zh: 以音译存梵以意显功德
    rationale: 陀罗尼以音声为体，存其梵音方具加持，直陈受持功德以劝至诚
