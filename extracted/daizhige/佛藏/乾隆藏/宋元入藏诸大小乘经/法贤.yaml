    en: Dharmabhadra Faxian
  lifespan:
    birth:
      date: 0950-01-01
      precision: year
      is_circa: true
      raw: 约十世纪中叶生于印度摩揭陀
    death:
      date: 1001-01-01
      precision: year
      is_circa: true
      raw: 宋咸平四年卒于开封
  birth_date: 0950-01-01
  death_date: 1001-01-01
  era: 北宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 奉诏译经大师
  dilemmas:
  - 梵汉悬隔而圣旨难违，如何既忠于梵本又使华人信解受持
  - 密咒功德难思，如何劝贫苦起信而不增迷执贪求
  lesson: 以精严译笔化异域真言为中土正信，令离贫苦得安乐即是大吉祥
  summary_first_person: 吾法贤本生天竺，随兄远来中夏，蒙宋帝授以明教之号，终身栖身译场，谨将梵夹陀罗尼译为华言，惟愿见闻随喜者离贫苦得富贵，部多爱敬，吉祥圆满
  source_urls:
