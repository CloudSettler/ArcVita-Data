endeavors:
- id: guji-法贤-endeavor-1
  title_zh: 奉诏译出佛母宝德藏般若波罗蜜经
  summary_zh: 入宋后奉诏参译以偈颂重译般若深义成三卷以显五蕴皆空离相修行
  phases:
  - key: brewing
    name: 初入译场对勘梵汉
    labels:
      zh:
      - 译场参学
    start_date: '980'
    highlight_event_id: guji-法贤-event-arrive
  - key: breakthrough
    name: 奉诏独译般若母典
    labels:
      zh:
      - 奉诏译经
    start_date: '998'
    highlight_event_id: guji-法贤-event-baodezang
  - key: climax
    name: 三卷成帙流通四众
    labels:
      zh:
      - 般若流通
    start_date: '999'
    highlight_event_id: guji-法贤-event-baodezang
  decisions:
  - date: '998'
    title_zh: 以伽陀摄长行广明空性
    rationale: 为令四众易持易诵以偈颂摄般若要义显离相无住之行
  - date: '999'
    title_zh: 立受持书写胜造塔功德
    rationale: 劝勉后世书写受持读诵般若示佛母能生诸佛功德无量
- id: guji-法贤-endeavor-2
  title_zh: 主持译场护持正法化导四众
  summary_zh: 久住译经院襄助传译宣说忍辱精进禅定等行对治魔事护持初心菩萨不退
  phases:
  - key: brewing
    name: 随众习仪通晓华言
    labels:
      zh:
      - 习语化导
    start_date: '981'
    highlight_event_id: guji-法贤-event-arrive
  - key: climax
    name: 宣说魔事策励不退
    labels:
      zh:
      - 降魔护法
    start_date: '999'
    highlight_event_id: guji-法贤-event-baodezang
  - key: closure
    name: 示寂付嘱译业后学
    labels:
      zh:
      - 付嘱圆寂
    start_date: '1001'
    highlight_event_id: guji-法贤-event-death
  decisions:
  - date: '999'
    title_zh: 詳說魔事令众识魔护心
    rationale: 恐初心菩萨著利养名闻弃般若求小果故预示种种魔变令深信法师
  - date: '1000'
    title_zh: 以不退行劝发菩提心
    rationale: 示三业清净为法舍命之相令学人行般若而不求二乘速趣佛智
