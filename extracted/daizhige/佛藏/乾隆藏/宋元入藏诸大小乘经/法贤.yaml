  dilemmas:
  - title_zh: 梵汉音义如何两全
    description: 陀罗尼以音声为体直译存音则难解其义意译取义则失其神当如何权衡
  - title_zh: 奉诏译经与修道本怀如何兼顾
    description: 久居汴京译经院膺朝散大夫试光禄卿之职世务羁身与出世弘法之初心相违
  lesson: 以音声为方便以慈悲为归趣令异域密语化作中土吉祥护佑众生除病续命
  summary_first_person: 我是法贤本名法天自中天竺那烂陀而来奉宋太宗诏入汴京译经院与天息灾施护等共译显密经论百余卷后改名法贤授明教大师朝散大夫试光禄卿我奉诏译佛说俱枳罗陀罗尼经宣说俱枳罗大威力能破部多恶曜能除众病能续将断之命愿闻者坚固受持获无量善利
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/宋元入藏诸大小乘经/佛说俱枳罗陀罗尼经.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/宋元入藏诸大小乘经/佛说俱枳罗陀罗尼经.md
  - https://tripitaka.cbeta.org/T1385
