endeavors:
- id: guji-法贤-endeavor-1
  title_zh: 西来入华奉诏入译场
  summary_zh: 随兄天息灾东来，太平兴国中至京师，入译经院习华言，授朝散大夫试光禄卿，赐明教大师号，终身从事梵汉对译
  phases:
  - key: brewing
    name: 天竺学法东行之志
    labels:
      zh:
      - 求法立志
    start_date: 0950-01-01
    highlight_event_id: guji-法贤-event-birth
  - key: breakthrough
    name: 至京师入译经院
    labels:
      zh:
      - 入华应诏
    start_date: 0980-01-01
    highlight_event_id: guji-法贤-event-arrival
  - key: climax
    name: 授官赐号明教大师
    labels:
      zh:
      - 荣命译主
    start_date: 0985-01-01
    highlight_event_id: guji-法贤-event-honor
  - key: closure
    name: 久住译场以译终身
    labels:
      zh:
      - 安住译业
    start_date: 0991-01-01
    highlight_event_id: guji-法贤-event-death
  decisions:
  - date: 0980-01-01
    title_zh: 随兄东来应宋聘
    rationale: 慕中土护法之盛，愿以梵本利乐东方，故不辞海道艰辛而来
  - date: 0985-01-01
    title_zh: 受明教号而不舍沙门本怀
    rationale: 以国恩之荣为弘法之便，虽居官品仍守译业，专心梵汉对翻以报佛恩
- id: guji-法贤-endeavor-2
  title_zh: 译宣大吉祥陀罗尼密法
  summary_zh: 奉诏译出佛说大吉祥陀罗尼经，宣说观自在与大吉祥菩萨因缘，传持贫苦得富贵部多爱敬之密法，劝比丘比丘尼优婆塞优婆夷受持读诵
  phases:
  - key: brewing
    name: 参详梵夹审定咒句
    labels:
      zh:
      - 校梵
    start_date: 0988-01-01
    highlight_event_id: guji-法贤-event-honor
  - key: breakthrough
    name: 奉诏开译吉祥法门
    labels:
      zh:
      - 开译
    start_date: 0990-01-01
    highlight_event_id: guji-法贤-event-translation
  - key: climax
    name: 译成流通劝持受
    labels:
      zh:
      - 流通
    start_date: 0991-01-01
    highlight_event_id: guji-法贤-event-translation
  - key: closure
    name: 付嘱信受奉行
    labels:
      zh:
      - 付嘱
    start_date: 1001-01-01
    highlight_event_id: guji-法贤-event-death
  decisions:
  - date: 0990-01-01
    title_zh: 以显说助密咒流通
    rationale: 经中先明因缘功德后出咒本，使信解思惟记念者易生正信，故详译缘起不略
  - date: 0991-01-01
    title_zh: 存梵音兼顾华义
    rationale: 陀罗尼贵在声义相应，故以切身二合引声细注其音，宁繁不失真，令人读诵获益
events:
- id: guji-法贤-event-birth
  title_zh: 生于天竺摩揭陀
  date: 0950-01-01
  year_of: 950
  place_zh: 印度摩揭陀
  summary_zh: 约十世纪中叶生于印度，与兄天息灾同学梵典，精通显密，后立志东行弘法
- id: guji-法贤-event-arrival
  title_zh: 随兄至宋入译经院
  date: 0980-06-01
  year_of: 980
  place_zh: 开封
  summary_zh: 太平兴国中随兄天息灾至京师，入译经院，习华言，参与施护等主持之译场，共襄梵汉大业
- id: guji-法贤-event-honor
  title_zh: 赐紫衣授明教大师号
  date: 0985-03-01
  year_of: 985
  place_zh: 开封
  summary_zh: 以译业精勤授朝散大夫试光禄卿，雍熙中赐明教大师号，得奉诏独立开译众经
- id: guji-法贤-event-translation
  title_zh: 奉诏译佛说大吉祥陀罗尼经
  date: 0991-01-01
  year_of: 991
  place_zh: 开封译经院
  summary_zh: 奉诏译出一卷，详叙佛在苏珂嚩帝佛刹说大吉祥陀罗尼因缘，录观自在请法及二十余句神咒，劝贫苦受持得大富贵
- id: guji-法贤-event-death
  title_zh: 咸平四年卒于京师
  date: 1001-01-01
  year_of: 1001
  place_zh: 开封
  summary_zh: 宋真宗咸平四年示寂，一生所译数十部百余卷，与施护天息灾并称宋初三大译师，塔于京郊
