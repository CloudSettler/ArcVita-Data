  title_zh: 译传俱枳罗陀罗尼护世利民
  description: 奉诏译出佛说俱枳罗陀罗尼经一卷宣说俱枳罗明王心咒能作吉祥破部多恶曜除众病续寿命劝阿难受持为人演说
  phases:
