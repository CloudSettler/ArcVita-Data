  description_zh: 奉诏译出佛母宝德藏般若分行品帝释品以至魔事现世等品广明五蕴空寂菩萨离相修行
- id: guji-法贤-event-death
  date: '1001'
  year_of: 1001
  title_zh: 咸平四年圆寂
  description_zh: 示寂于汴京译场一生所译般若等经付嘱后学流通
