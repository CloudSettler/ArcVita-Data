    title_zh: 以音译为主兼存梵汉对音译出陀罗尼
    rationale: 密语以音为体存其音则存其威力兼以汉文释其功用令信众能持能解
  - date: '1000'
    title_zh: 嘱付阿难受持为他人说
    rationale: 独得不如普传令此陀罗尼所在之处皆得吉祥多人获大利益
