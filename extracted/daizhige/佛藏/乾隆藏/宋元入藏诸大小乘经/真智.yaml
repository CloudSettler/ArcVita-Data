person:
  qid: guji-真智
  name_zh: 真智
  names:
    zh: 真智
    en: Zhenzhi
  lifespan:
    birth:
      date: '1250'
      precision: year
      is_circa: true
      raw: 元初约生
    death:
      date: '1320'
      precision: year
      is_circa: true
      raw: 元中后期约卒
  birth_date: 1250
  death_date: 1320
  era: 元
  reign_ref: 元世祖至成宗时
  archetype: 译经传持僧
  dilemmas:
  - 梵汉音义难齐，如何存密咒真言神效又令汉土行人可诵可持
  - 显密兼弘之际，如何立白伞盖佛母观想仪轨使在家出家皆得受持
  lesson: 以诚敬译持为方便，令白盖覆护众生，护国安民即是修行。
  summary_first_person: 我是真智，元时译场僧，与天竺上师共译大白伞盖总持陀罗尼，立观想持诵施食仪轨，愿以白盖覆护一切有情，离诸灾厄，同得安乐。
  source_urls:
  - https://daizhige.org/fozang/qianlongzang/songyuanruzang/dafobaisangaizongchituoluonijing.html
  - https://tripitaka.cbeta.org/T09n0977
endeavors:
- id: guji-真智-endeavor-1
  title_zh: 合译大白伞盖总持陀罗尼经
  summary_zh: 与唧捺铭得哩连得啰磨宁等共参梵本，斟定咒语汉音，译成一卷本，备载佛母形相与总持功德。
  phases:
  - key: brewing
    name: 筹备译场参合梵本
    labels:
      zh: 酝酿筹备
    start_date: '1295'
    highlight_event_id: guji-真智-event-translate
  - key: breakthrough
    name: 斟定密咒汉字音写
    labels:
      zh: 攻坚定音
    start_date: '1298'
    highlight_event_id: guji-真智-event-translate
  - key: climax
    name: 译成一卷进呈流通
    labels:
      zh: 高潮成经
    start_date: '1302'
    highlight_event_id: guji-真智-event-translate
  - key: closure
    name: 校刊入藏付嘱受持
    labels:
      zh: 收束入藏
    start_date: '1305'
    highlight_event_id: guji-真智-event-translate
  decisions:
  - date: '1298'
    title_zh: 存梵音以汉字转写密咒
    rationale: 为存总持不测之效，宁存其音不妄改其义，令行人依字可诵。
  - date: '1302'
    title_zh: 详载观想施食次第附于经首
    rationale: 恐空持文句不得其门，故先示寂静室观想白伞盖佛母及施食回向之法。
- id: guji-真智-endeavor-2
  title_zh: 开示白伞盖佛母修持护国法
  summary_zh: 教授一面二臂白伞盖佛母观想、恒常持心咒、桦皮书写佩戴及置幢供养之法，祈禳疫病刀兵水火诸难。
  phases:
  - key: brewing
    name: 示寂静室发愿归依
    labels:
      zh: 酝酿发心
    start_date: '1305'
    highlight_event_id: guji-真智-event-transmit
  - key: breakthrough
    name: 传观想持咒遣除罪障
    labels:
      zh: 突破传持
    start_date: '1308'
    highlight_event_id: guji-真智-event-transmit
  - key: climax
    name: 广示佩戴经咒置幢禳灾
    labels:
      zh: 高潮护国
    start_date: '1310'
    highlight_event_id: guji-真智-event-transmit
  - key: closure
    name: 付嘱回向善根安邦
    labels:
      zh: 收束回向
    start_date: '1312'
    highlight_event_id: guji-真智-event-transmit
  decisions:
  - date: '1308'
    title_zh: 许白衣书写佩戴经咒护身
    rationale: 为利不能常诵者，令书于桦皮白氎戴于身上项颈，得毒火刀水不侵。
  - date: '1310'
    title_zh: 教置幢大城门上作广大供养
    rationale: 为息人病牛病疫病斗战，令安置经咒于幢顶供养，速得国界安宁。
events:
- id: guji-真智-event-birth
  title_zh: 诞生
  date: '1250'
  year_of: 1250
  description_zh: 约生于元初，自幼出家，习梵汉文字，渐入译场参预密教经典传译。
- id: guji-真智-event-translate
  title_zh: 共译佛说大白伞盖总持陀罗尼经一卷
  date: '1302'
  year_of: 1302
  description_zh: 与天竺唧捺铭得哩连得啰磨宁等合译，载三十三天善法堂上佛自顶髻出白伞盖佛母，具一面二臂三目，左执白伞右作无畏印，宣说回遮诸魔疫病刀风水火之总持。
- id: guji-真智-event-transmit
  title_zh: 传授观想持诵及置幢护国法
  date: '1310'
  year_of: 1310
  description_zh: 教行人于寂静室观华月轮上唵字变成白伞盖佛母，诵心咒施食回向，又教书经戴身及置幢城门村落川原作供养，祈国安疫息。
- id: guji-真智-event-death
  title_zh: 示寂
  date: '1320'
  year_of: 1320
  description_zh: 约卒于元中后期，译本已流布，行人依白伞盖佛母仪轨持诵不绝，功德归于护国利生。
