    rationale: 大师宴卧未久宜护安隐自以集法对治诽谤不兴烦扰
  - date: -0485
    title_zh: 以一法二法三法四法次第宣说
    rationale: 先标众生依食住次辨名色三业乃至四谛四果令众易持如说修习
