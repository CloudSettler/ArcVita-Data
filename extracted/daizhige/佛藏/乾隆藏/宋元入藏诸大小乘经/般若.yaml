  archetype: 西域译经弘法型
  dilemmas:
  - 梵本幽深华言难达，直存梵义还是顺俗意译以便群机
  - 显密并弘易生惑著，广演神咒还是专弘心地孝亲以正本源
  lesson: 观心为本地孝为基，译经当以利生为归，不逐神异不失本真
  summary_first_person: 吾罽宾沙门般若，远涉流沙入大唐，蒙两朝护持，于醴泉寺与义学大德共译心地观经八卷，愿世人观自心地，孝养父母，报四恩而趣菩提
  source_urls:
