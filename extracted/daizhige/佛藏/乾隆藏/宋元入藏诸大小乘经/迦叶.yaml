  reign_ref: 摩揭陀国频婆娑罗王至阿阇世王时
  archetype: 头陀第一持律清净者
  dilemmas:
  - 入白衣舍受利养时如何不著不缚不取
  - 为他说法时如何离利养心保清净
  lesson: 以无著无缚无执取心入俗利生，以慈悲心清净说法，方令正法久住
  summary_first_person: 我是迦叶，常如初腊，不破威仪，以无著心入白衣舍，以清净心为他说法，但愿正法久住
