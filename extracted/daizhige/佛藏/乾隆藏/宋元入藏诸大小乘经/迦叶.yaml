endeavors:
- id: guji-迦叶-endeavor-1
  title_zh: 月喻入俗持律清净行
  summary: 学月行空清净无碍，以无著无缚心入白衣舍堪受利养
  phases:
  - key: brewing
    name: 初腊持律
    labels:
      zh: 不破威仪具足惭愧
    start_date: '-523'
    highlight_event_id: guji-迦叶-event-moon
  - key: climax
    name: 月喻受记
    labels:
      zh: 佛叹如月行空清净
    start_date: '-503'
    highlight_event_id: guji-迦叶-event-moon
  decisions:
  - date: '-503'
    title_zh: 以无著心入白衣舍
    rationale: 依律仪相入舍，于自不高於他不下，离著缚取方堪受供
  - date: '-503'
    title_zh: 常如初腊不破威仪
    rationale: 身心无散乱具惭愧，如明眼人涉险离惧
- id: guji-迦叶-endeavor-2
  title_zh: 清净说法令正法久住
  summary: 离利养心安住正见说法，起慈悲心令众得利乐正法久住
  phases:
  - key: breakthrough
    name: 辨说法净秽
    labels:
      zh: 离利说法炼金除秽
    start_date: '-503'
    highlight_event_id: guji-迦叶-event-preach
  - key: closure
    name: 正法久住
    labels:
      zh: 慈悲说法利乐长夜
    start_date: '-502'
    highlight_event_id: guji-迦叶-event-preach
  decisions:
  - date: '-503'
    title_zh: 不为衣服饮食说法
    rationale: 为信施利故说法不清净，当离染污为离生老病死说法
  - date: '-502'
    title_zh: 以慈悲心令法久住
    rationale: 令他闻法随顺修行得大利乐，由是正法得久住世为最上清净
events:
