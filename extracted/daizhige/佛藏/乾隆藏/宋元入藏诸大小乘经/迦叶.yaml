  title_zh: 迦叶诞生于摩揭陀
  date: '-543'
  year_of: -543
  location_zh: 古印度摩揭陀国
  description: 婆罗门种生，具头陀性，后遇佛出家
- id: guji-迦叶-event-moon
  title_zh: 王舍城蒙佛月喻称叹
  date: '-503'
  year_of: -503
  location_zh: 王舍城迦兰陀竹林精舍
  description: 佛以皎月行空明眼涉险为喻，叹迦叶不破威仪入白衣舍清净无染
- id: guji-迦叶-event-preach
  title_zh: 领受清净说法之教
  date: '-503'
  year_of: -503
  location_zh: 王舍城迦兰陀竹林精舍
  description: 佛分别说法清净不清净，许迦叶能起清净心说法令正法久住
- id: guji-迦叶-event-death
  title_zh: 鸡足山入定待弥勒
  date: '-443'
  year_of: -443
  location_zh: 鸡足山
  description: 持佛衣钵入山入灭尽定，待弥勒下生传付
