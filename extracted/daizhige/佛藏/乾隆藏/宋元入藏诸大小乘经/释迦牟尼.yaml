  description: 教善男女书写受持读诵斋戒净室香泥涂地七日七夜满百八遍则阵贼息刃随身佩带诸恶退散病者供养诵二百遍得差官难诵五百遍厄难灭除
- id: guji-释迦牟尼-event-death
