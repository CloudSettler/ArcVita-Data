    highlight_event_id: guji-释迦牟尼-event-1
  decisions:
  - date: -483-07-16
    title_zh: 不许无智辄与外道斗诤
    rationale: 斗诤起则多人乃至天人悉无利益咸生苦恼故令尊那不得与诤
  - date: -483-07-16
    title_zh: 以道品自证明示一切智见
    rationale: 外道非一切智见不清净常乐斗诤唯佛悉知悉见故须以正法摄众塞诤源
- id: guji-释迦牟尼-endeavor-2
  title_zh: 制七灭诤六和敬息诤安众
  summary_zh: 说忿恨覆诳等为斗诤根本制现前乃至草覆地七灭诤法又说身语意利戒见六和敬法令涅槃后众亦安乐
  phases:
