    start_date: -522-05-03
    highlight_event_id: guji-释迦牟尼-event-preach-east
  - key: closure
    name: 结叹背生死近证菩提
    labels:
      zh:
      - 背生死劫数
      - 摄无量福蕴
    start_date: -522-05-04
    highlight_event_id: guji-释迦牟尼-event-preach-east
  decisions:
  - date: -522-05-01
    title_zh: 为令初发心菩萨成熟善根而宣说
    rationale: 愍初发心善根未熟，故告迦叶谛听极善作意，开示闻名受持法门
  - date: -522-05-03
    title_zh: 示现称名即得三摩地辩才
    rationale: 令闻定最上吉祥及宝轮光明王名者得出家证三摩地，得随转陀罗尼及无断辩才，堪为天人说法
- id: guji-释迦牟尼-endeavor-2
  title_zh: 说南方西方北方诸佛及嘱累流通
  summary: 继说南方无边步迹等三佛、西方大光明照佛、北方宝开花普耀等及东方宝藏宝胜佛，叹月轮日轮宝月三摩地转女成男等功德，说伽陀劝归命受持广宣说
  phases:
  - key: brewing
    name: 说南方悦意声等佛刹
    labels:
      zh:
      - 南方佛土
      - 月轮三摩地见十方佛
    start_date: -522-06-01
    highlight_event_id: guji-释迦牟尼-event-preach-southwest
  - key: breakthrough
    name: 说西方大光明照转女身
    labels:
      zh:
      - 西方佛土
      - 日轮三摩地转女成男
    start_date: -522-06-02
    highlight_event_id: guji-释迦牟尼-event-preach-southwest
  - key: climax
    name: 说北方宝开花及宝藏宝胜
    labels:
      zh:
      - 北方东方佛土
      - 知众生语言七觉支福蕴
    start_date: -522-06-03
    highlight_event_id: guji-释迦牟尼-event-preach-southwest
  - key: closure
    name: 说伽陀劝受持广宣说欢喜奉行
    labels:
      zh:
      - 归命受持
      - 回向佛智流通
    start_date: -522-06-04
    highlight_event_id: guji-释迦牟尼-event-conclusion
  decisions:
  - date: -522-06-02
    title_zh: 开示胎中闻名转女成男
    rationale: 显大神通大威德名号力，令女人胎中闻名即转身得智，证无上菩提利众生
  - date: -522-06-04
    title_zh: 以伽陀嘱累闻名广宣说
    rationale: 欲令俱胝众生出离二有得解脱，故劝闻名者昼夜恭敬合掌，为他人广说，回向不思议佛智
