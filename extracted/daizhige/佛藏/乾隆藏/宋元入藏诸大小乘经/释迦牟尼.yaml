endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 鹫峰山说东方六佛名号受持功德
  summary: 在王舍城鹫峰山告大迦叶，次第宣说东方定手最上吉祥等六佛及离尘步等菩萨名号，叹称念受持得宿命智莲华化生辩才无断等功德
