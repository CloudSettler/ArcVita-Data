  - date: -563-01-01
    title_zh: 于妙华等佛前发大誓愿
    rationale: 见诸佛住世利生随缘入灭，发起上求正觉下化众生之愿。
  - date: -523-01-01
    title_zh: 为转轮王时以七宝建塔供养舍利
    rationale: 佛灭后以塔存法身舍利，令福田相续，培植成佛资粮。
- id: guji-释迦牟尼-endeavor-2
  title_zh: 鹫峰开示诸佛世系破疑
  summary_zh: 于王舍城鹫峰为大目犍连开示，纠色究竟天百千劫一佛之少见，具说过去无量诸佛名号次第。
  phases:
  - key: brewing
