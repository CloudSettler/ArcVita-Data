  description: 说东方南方西方北方现住诸佛光照利益伽陀，劝昼夜尊重合掌归命闻名受持广为多人说，回向佛智，苾刍菩萨迦叶天人阿修罗等皆大欢喜信受奉行
- id: guji-释迦牟尼-event-death
  title_zh: 涅槃于拘尸那城
  date: -483-02-15
  year_of: -483
  type: death
  place_zh: 拘尸那城娑罗林
  description: 化缘既毕，于拘尸那城示现入涅槃，后世结集所说佛冠等经由法护等译传
