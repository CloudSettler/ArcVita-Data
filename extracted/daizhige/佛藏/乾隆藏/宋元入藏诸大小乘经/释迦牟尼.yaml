endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 舍卫弘法利乐人天
  summary: 游化摩揭陀诸国住舍卫受供养，为人天降甘露令脱轮回苦难。
  phases:
  - key: brewing
    name: 游化诸国观察未来
    labels:
      zh: 蓄势观察
    start_date: -528-12-08
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: breakthrough
    name: 住舍卫受人天恭敬供养
    labels:
      zh: 利乐开化
    start_date: -486-05-01
    highlight_event_id: guji-释迦牟尼-event-five-laws
  - key: climax
    name: 降伏诸王广宣圣行
    labels:
      zh: 化导极盛
    start_date: -486-05-01
    highlight_event_id: guji-释迦牟尼-event-five-laws
  - key: closure
    name: 付嘱奉行旋绕作礼而退
    labels:
      zh: 付嘱流通
    start_date: -483-02-15
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -486-05-01
    title_zh: 为未来观察而住舍卫说法
    rationale: 令人天获胜福果得妙庄严，久久依住而得甘露安乐
  - date: -486-05-01
    title_zh: 受用利养而无染着如莲在水
    rationale: 但为利乐有情使离地狱险难怖畏而趣涅槃寂静
- id: guji-释迦牟尼-endeavor-2
  title_zh: 制立五法轨范僧团
  summary: 宣说住劝事离依止正念等五法，令新学知戒依师五年得清净。
  phases:
  - key: brewing
    name: 分别阿钵帝轻重根基
    labels:
      zh: 分判戒相
    start_date: -486-05-01
    highlight_event_id: guji-释迦牟尼-event-five-laws
  - key: breakthrough
    name: 宣说住劝事离依止五法
    labels:
      zh: 立制轨范
    start_date: -486-05-01
    highlight_event_id: guji-释迦牟尼-event-five-laws
  - key: climax
    name: 广说波罗提木叉结界宝沙他
    labels:
      zh: 详明仪轨
    start_date: -486-05-01
    highlight_event_id: guji-释迦牟尼-event-five-laws
  - key: closure
    name: 令具足五法者依行得清净
    labels:
      zh: 持守成就
    start_date: -483-02-15
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -486-05-01
    title_zh: 简别合住劝事与不得住者
    rationale: 新戒减五年不知戒相者不合住，具足知解满五年者得住劝事
  - date: -486-05-01
    title_zh: 制定五年依师不离依止
    rationale: 使新学饮食礼事不过师界同师忏悔，日日增进而无阿钵帝
