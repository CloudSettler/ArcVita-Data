    highlight_event_id: guji-释迦牟尼-event-2
  decisions:
  - date: -483-07-16
    title_zh: 制七灭诤法息已起未起诤
    rationale: 现前忆念不痴自言多人语知所作草覆地各对治犯缘故能令诤事悉得息灭
  - date: -483-07-17
    title_zh: 制六和敬法令和合共住
    rationale: 身语意慈和利同均戒同修见同解则东西南北所往离诤得安乐
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼园降生
  date: -563-04-08
  year_of: -563
  place_zh: 蓝毗尼园
  description_zh: 迦毗罗卫释迦族悉达多太子降生后出家成正觉号如来应供正等正觉
- id: guji-释迦牟尼-event-1
  title_zh: 舍摩迦子聚落受尊那阿难请问诤缘
  date: -483-07-15
  year_of: -483
  place_zh: 舍摩迦子聚落
  description_zh: 尊那在惹卢迦林安居见尼乾陀惹提子命终其子欲与沙门斗诤讥佛非正觉满夏后来白阿难同诣佛所具陈上事佛诃阿难不知诤缘说外道见戒威仪增减即起斗诤
- id: guji-释迦牟尼-event-2
  title_zh: 宣说七灭诤法六和敬法
  date: -483-07-16
  year_of: -483
  place_zh: 舍摩迦子聚落
  description_zh: 佛说忿恨覆诳悭嫉等为斗诤根本广说现前毗尼忆念不痴自言治多人语知所作草覆地七法又说身语意利戒见六和敬令苾刍忆持断过息诤安乐乃至涅槃后亦然
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那罗娑罗林涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那罗
  description_zh: 世尊化缘既周入般涅槃付嘱弟子依七灭诤六和敬和合共住如佛住世等无有异
