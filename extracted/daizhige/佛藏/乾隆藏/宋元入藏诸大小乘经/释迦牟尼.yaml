  lesson: 称念受持诸佛名号摄集福蕴，昼夜恭敬归命，发愿回向佛智，则能背生死证菩提
  summary_first_person: 我在王舍城鹫峰山中，与千二百五十苾刍及慈氏妙吉祥等菩萨同会，告大迦叶，为令初发心菩萨成熟善根，宣说东方南方西方北方现在诸佛及次补菩萨名号，叹闻名受持得宿命智、不退转、摄无量福、近证菩提之功德，嘱昼夜恭敬归命，广为他人宣说
