  - title_zh: 隐显护持之抉择
    description: 众生怖畏王难贼难水火疫病当以显教持戒摄心为本抑以密咒隐形护身为方便如何兼济而不失正道
  - title_zh: 普传密法之权衡
    description: 摩利支天威德广大若广宣则众生得护若滥传则轻慢生愆如何择机授受令比丘国王人民皆得利益
  lesson: 以慈悲为本以方便护生显密相资方能令众生远离怖畏安住正道
  summary_first_person: 吾在舍卫祇园与千二百五十比丘俱见众生多怖畏于怨家王难贼水火疫病故宣说摩利支天隐形护持功德及陀罗尼仪轨令善男女持诵受持者无人能见无人能捉一切诸恶不能加害
