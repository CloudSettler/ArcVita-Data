  - 外道尼乾陀子欲兴斗诤坏清白法当如何止诤而不损多人利益
  - 苾刍戒律威仪有增有减失常法见讥嫌当以何法摄众令和合
  lesson: 诤起于忿恨不敬以七灭诤息事以六和敬和心则已起未起皆灭
  summary_first_person: 我在舍摩迦子聚落安居闻尊那与阿难来白尼乾陀子兴诤之事便为说诤根本在忿恨覆诳不敬师长不见正法授七种灭诤法与六种和敬法令众东西南北所往皆得安乐乃至我涅槃后亦然
