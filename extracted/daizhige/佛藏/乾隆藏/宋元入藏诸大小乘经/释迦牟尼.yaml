  title_zh: 祇园告众摩利支天功德
  description: 在舍卫国祇树给孤独园与大比丘众千二百五十人俱告言摩利支天常行日月前不可见不可捉不被欺缚不被人债财物不为怨家得便
- id: guji-释迦牟尼-event-2
  date: -500-05-15
  year_of: -500
  title_zh: 宣说摩利支天陀罗尼咒
  description: 告诸比丘是天有陀罗尼能守护人即说多侄他遏迦摩私等咒愿于行路非行路昼夜怨家王贼水火疫病中护持弟子一切处一切时得护
- id: guji-释迦牟尼-event-3
