    highlight_event_id: guji-释迦牟尼-event-preach
  decisions:
  - date: -483-05-02
    title_zh: 直指色究竟天非正言
    rationale: 恐众生执少见为量，断久远善根，故先破后显。
  - date: -483-05-03
    title_zh: 广说无数佛名号劫数不可计
    rationale: 以自经历证久远难量，令目连及后世了知成佛须经无数劫愿行。
