  description: 对大迦叶及千二百五十苾刍菩萨众，说东方定严等世界定手最上吉祥莲华最上日轮光明一宝盖定最上宝轮光明高胜王六佛及离尘步等菩萨，叹闻名受持得宿命智不退转背生死功德
- id: guji-释迦牟尼-event-preach-southwest
  title_zh: 续说南方西方北方及宝胜佛名号
  date: -522-06-02
  year_of: -522
  type: 事业
  place_zh: 王舍城鹫峰山中
  description: 说南方无边步迹无边香最上王宝上佛、西方大光明照佛、北方宝开花普耀吉祥佛及东方宝藏宝胜佛，叹月轮日轮宝月三摩地、胎中见佛、转女成男、胜须弥布施福等功德
- id: guji-释迦牟尼-event-conclusion
  title_zh: 说伽陀劝归命流通大众欢喜奉行
