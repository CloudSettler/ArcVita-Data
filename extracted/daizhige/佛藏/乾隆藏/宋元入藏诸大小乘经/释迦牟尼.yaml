  archetype: 觉者师范型
  dilemmas:
  - 王位安乐与出家求道之间当如何舍取
  - 慈悲利乐人天与自在寂静涅槃之间当如何兼顾
  - 僧团久住清净与未来懈怠犯戒之间当如何预设轨范
  lesson: 以正念依止持戒轨范，令僧团久住而众生得安乐涅槃。
  summary_first_person: 吾住舍卫观察未来，为苾刍说五法，令知阿钵帝轻重、知波罗提木叉结界宝沙他、依师五年不离依止，以此轨范护持僧团，普令天人远离生老病死而得安乐。
  source_urls:
