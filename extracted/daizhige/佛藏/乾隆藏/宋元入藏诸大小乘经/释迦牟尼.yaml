  dilemmas:
  - 以神通摄伏外道令生信心与以正法令得解脱之间如何兼顾先后
  - 面对事火耆旧根深俗执如何以慈悲忍耐渐次折伏而不起对立
  lesson: 先以神变摄信后以无常不受正法令得解脱是化度刚强之要道
  summary_first_person: 我本迦毗罗卫太子悉达多，出家成道后往优楼频螺迦叶处寄宿火舍，以火界三昧降伏毒龙，又现分水渡河天王来礼种种神变，令迦叶师徒生信出家，复于象头山说眼耳鼻舌身意无常不受之法，令众解脱，后入王舍城受迦兰陀竹林，广利人天
  source_urls:
