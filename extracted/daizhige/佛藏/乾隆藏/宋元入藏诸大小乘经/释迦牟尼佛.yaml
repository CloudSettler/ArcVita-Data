    title_zh: 愍众化现不坏金刚
    rationale: 咒仙金刚七日无取得，大众倍复悲哀，故以遍知神力化现大力士往取
  - date: -543-02-14
    title_zh: 宣说秽迹真言付嘱
    rationale: 令灭后众生持咒离魔恼贫病，召金刚为给使，护持佛法久住于世
