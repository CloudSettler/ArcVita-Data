    title_zh: 先礼世尊后见国王
    rationale: 波斯匿王遣使迎请，答以候先到祇树礼拜世尊，尊法为先不以王命易道
  - date: -0485
    title_zh: 设供发无上菩提心
    rationale: 以宿因所感瞻卜华金盘供佛及众已心大欢喜，不求独享富贵，愿救度未度安乐未安寂静未静者方成佛
events:
- id: guji-金耀童子-event-birth
  person_qid: guji-金耀童子
  title_zh: 舍卫婆罗门家诞生现金色瑞
  date: '-0500'
  year_of: -500
  location: 舍卫国婆罗门舍
  description: 初生心意安泰诸识明利，庭生莲华满室天香，瞻卜华树处处出生执天紫金色华，诸天金盘盛天食无尽，口出佛及罗汉音声常所思念
- id: guji-金耀童子-event-past-offering
  person_qid: guji-金耀童子
  title_zh: 前世贫人供养缘觉吉祥密发愿
  date: '-0550'
  year_of: -550
  location: 波罗奈国山谷庵没罗树下
  description: 前世为贫人见闻军王太子吉祥密证缘觉，以满钵庵没罗果及净地莲华树枝伞盖瓦器饮食供养，礼足发愿世世得莲华瞻卜金华金盘天食并值佛
- id: guji-金耀童子-event-offering
  person_qid: guji-金耀童子
  title_zh: 祇园以瞻卜华金盘大供世尊
  date: -0485
  year_of: -485
  location: 舍卫祇树给孤独园
  description: 诣佛礼足听法，天妙莲华生祇园，随发心现瞻卜华散佛身上成华鬘衣，又随念现本生金盘天食，亲供世尊苾刍国王侍从皆饱满，王众惊怪神力
- id: guji-金耀童子-event-vow
  person_qid: guji-金耀童子
  title_zh: 发无上菩提心蒙授记金曜如来
  date: -0485
  year_of: -485
  location: 祇树给孤独园佛前
  description: 供已欢喜礼足发阿耨多罗三藐三菩提心，愿广行法施救度有情，未度与度未安施安未静令静，佛放光明照地狱诸天说苦空无常，告阿难经三大阿僧祇劫修六度成金曜如来
- id: guji-金耀童子-event-death
  person_qid: guji-金耀童子
  title_zh: 功圆示寂归于无为
  date: '-0420'
  year_of: -420
  location: 未详约印度
  description: 经未载终时，依授记当经三大阿僧祇劫行菩提归于圆寂，此处系其一世示现之终，善根增长谛发心愿相续不灭
