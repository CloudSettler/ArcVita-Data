  - title_zh: 富贵福报与发心出离
    description: 生具金色莲华瞻卜宝树金盘天食等大福，仍发阿耨多罗三藐三菩提心愿救度未度者不耽著现乐
  - title_zh: 他人呵责与亲近世尊
    description: 诣祇园途中遇婆罗门呵责云何见沙门，坚持礼觐世尊听法以神力供养明志
  lesson: 昔以净心供养缘觉种莲华宝盖金盘之因今得殊报，更以供佛发心回向一切，善恶业经百劫不亡，当福慧双修广行法施
  summary_first_person: 我是金耀童子，生于舍卫婆罗门家，初生即现金色莲华瞻卜华树金盘天食等瑞，诣祇园以华供佛以金盘奉斋，发无上菩提心愿度一切未安未静者，蒙佛授记未来成金曜如来，我知前世贫人供养缘觉之因今日方熟
