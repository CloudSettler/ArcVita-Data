    title_zh: 以钵盛庵没罗果供养缘觉
    rationale: 见缘觉巍巍寂静众圣围绕，自念无物可供唯近有果树，即取上果满钵奉献求福
  - date: -0549
    title_zh: 拒王移日坚持设斋发愿
    rationale: 虽得铁瓮金宝仍不以财骄，知斋期至功德难遇，不让闻军王而严地散华设盖发世世莲华宝树金盘值佛之愿
