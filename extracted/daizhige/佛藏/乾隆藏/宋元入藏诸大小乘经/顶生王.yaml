events:
- id: guji-顶生王-event-birth
  kind: birth
  title_zh: 布沙陀王顶上化生
  date: -5000-01-01
  year_of: -5000
  place_zh: 赡部洲广严城王宫
  summary_zh: 布沙陀王顶上肉生如疱软绵，成熟开裂生童子具三十二相，六万宫女乳盈争养，名我养亦名顶生
- id: guji-顶生王-event-succession
  kind: career
  title_zh: 天授缯帛即转轮位
  date: -4980-01-01
  year_of: -4980
  place_zh: 赡部洲行宫道中
  summary_zh: 父王寝疾谢世，不奔丧待法，夜叉运师子座缯盖宝冠自至，天降妙缯系顶，七宝千子具足统赡部洲
- id: guji-顶生王-event-unify
  kind: career
  title_zh: 次第统治东西北三洲
  date: -4970-01-01
  year_of: -4970
  place_zh: 东胜身洲西牛货洲北俱卢洲
  summary_zh: 与兵众千子刹那至三洲，治化多百千岁，感香稻衣树自然供食衣，宫雨金钱七日显福力
- id: guji-顶生王-event-ascend
  kind: career
  title_zh: 历七金山上升忉利
  date: -4942-01-01
  year_of: -4942
  place_zh: 须弥七重金山四天王宫至三十三天
  summary_zh: 举身空中率兵众千子，遍历尼民达罗等七山四王宫化导，复至忉利天观高广楼阁衣食乐树
- id: guji-顶生王-event-greed
  kind: career
  title_zh: 与帝释分座起夺位贪
  date: -4940-01-01
  year_of: -4940
  place_zh: 忉利天善法堂帝释座侧
  summary_zh: 久与帝释分座受天福乐，福慢转盛欲尽夺帝释位，贪心一起天福即衰相现衰退
- id: guji-顶生王-event-death
  kind: death
  title_zh: 堕落命终说贪无厌偈
  date: -4930-01-01
  year_of: -4930
  place_zh: 忉利天堕赡部洲命终处
  summary_zh: 因贪夺位堕落天上，命终之际说偈证贪欲无厌，虽雨金钱穑谷妙衣终不知足，佛为胜军大王说其即过去求菩提行施因缘
