  date: -0528
  year_of: -528
  place_zh: 杖林山佛会
  description_zh: 闻说色受想行识生灭无我法，远尘离垢法眼清净，与八万天人同得见道，即起座合掌归依佛法僧受近事戒誓不杀不饮酒，虔请佛及苾刍众还王舍城尽生承事供养，佛默然受请
