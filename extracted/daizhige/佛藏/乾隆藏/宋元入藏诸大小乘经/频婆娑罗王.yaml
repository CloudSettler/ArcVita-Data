  title_zh: 率众往杖林山礼佛听法
  date: -0528
  year_of: -528
  place_zh: 王舍城杖林山灵塔处
  description_zh: 闻佛与千阿罗汉住杖林山，率从车万二千乘眷属臣佐及婆罗门长者出城，到佛会除王者相，偏袒右肩合掌赞佛，三自称摩揭陀国频婆娑罗王，退坐一面听法，见迦叶现神通证师徒分际
- id: guji-频婆娑罗王-event-refuge
