events:
- id: guji-频婆娑罗王-event-birth
  title_zh: 降生摩揭陀王族
  date: '-0543'
  year_of: -543
  place_zh: 古印度摩揭陀国王舍城
  description_zh: 生于摩揭陀王族，后绍王位为哈良卡王朝君主，主成佛胜地。
- id: guji-频婆娑罗王-event-convert
  title_zh: 王舍城归佛证须陀洹
  date: -0528
  year_of: -528
  place_zh: 摩揭陀国王舍城
  description_zh: 一心向佛知于正法及奉僧伽，深信微妙最胜奉行不懈，断三障证须陀洹果逆生死流。
- id: guji-频婆娑罗王-event-dharma-king
  title_zh: 尽寿护法国人赞为法王
  date: '-0500'
  year_of: -500
  place_zh: 摩揭陀国
  description_zh: 尽于寿命常念三宝不忘，护持正觉之地，国中人民咸赞王德称为法王愿其生善世获最胜乐。
- id: guji-频婆娑罗王-event-death
  title_zh: 人间命终展转生毗沙门宫
  date: -0491
  year_of: -491
  place_zh: 摩揭陀国王舍城
  description_zh: 人间寿命终后摩揭陀空廓无人，自身第七生生毗沙门天宫为天王子亦名人仙，善知佛说微妙寂静安乐句当来证斯陀含果。
- id: guji-频婆娑罗王-event-janasabha
  title_zh: 那提迦空中现身说人仙经
  date: -0491
  year_of: -491
  place_zh: 那提迦城昆左迦精舍虚空
  description_zh: 受持国天王命往南方增长天王处，知佛观察摩揭陀王及诸优婆塞去处，空中自称人仙善逝即频婆娑罗王，对佛广述大梵天王于三十三天胜会所说四神足四念处八正道及摩揭陀八万优婆塞生他化自在天乃至人间刹帝利婆罗门长者家等果报，阿难及会众欢喜信受。
