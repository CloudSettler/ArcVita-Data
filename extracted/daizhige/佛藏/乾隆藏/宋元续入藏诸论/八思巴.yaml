  date: 1273
  year_of: 1273
  place_zh: 大都
  description_zh: 造彰所知论，首礼金刚上师诸佛菩萨，次明器世界情世界道法果法无为法，文理皎如日月，后由沙罗巴译汉。
- id: guji-八思巴-event-death
