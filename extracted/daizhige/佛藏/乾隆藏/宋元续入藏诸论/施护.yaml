  decisions:
  - date: '1005-02-01'
    title_zh: 略释行相利小智者
    rationale: 为令小智者思念是义，以简要颂释摄三十二品要旨，令略知深义
  - date: '1006-05-01'
    title_zh: 依八千颂说十六空
    rationale: 遣遍计执，止有相无相分别，显无二智如来，离能取所取
events:
- id: guji-施护-event-birth
  date: '0950-01-01'
  year_of: 950
  title_zh: 生于北印度乌填曩国
  description_zh: 约十世纪中叶生于乌填曩，少出家，通梵本三藏，尤精般若波罗蜜多。
- id: guji-施护-event-arrive
  date: '0980-01-01'
  year_of: 980
  title_zh: 携梵本至宋入译经院
  description_zh: 宋太平兴国年间抵开封，入译经院，与法天法贤等共译显密经论，开启官译生涯。
- id: guji-施护-event-prajna
  date: '1005-01-01'
  year_of: 1005
  title_zh: 奉诏译佛母般若圆集要义释论
  description_zh: 奉诏译出四卷本，释大域龙所集要义，明无二智如来，分别十六空，对治十种心散乱，集三十二品归一味。
- id: guji-施护-event-death
  date: '1017-01-01'
  year_of: 1017
  title_zh: 卒于开封天禧元年
  description_zh: 宋天禧元年圆寂于开封，一生译经律论逾百余卷，般若译业为后学所宗。
