  death_date: '1017-01-01'
  era: 北宋
  reign_ref: 宋太宗至宋真宗
  archetype: 译经大师
  dilemmas:
  - 梵汉悬隔而般若义深，如何令中土小智者亦得思念要义
  - 奉诏译业浩繁而教道兼举，如何持守信解互证不违实相
  lesson: 以信为体，以无二智到彼岸，摄散乱归空性，令学者略知深义
  summary_first_person: 我是施护，西天乌填曩僧，携梵本入宋，奉诏入译经院，译佛母般若圆集要义释论四卷，略释行相，遣十种分别，显十六空，愿小智者亦安住无二智。
  source_urls:
  - https://daizhige.org/佛母般若波罗蜜多圆集要义释论.html
  - https://tripitaka.cbeta.org/T1517
  - https://github.com/daizhige-org/daizhigev20
