    rationale: 为令正法东传，不辞远涉，依朝廷译制共译梵本，以信为体
  - date: '0991-03-01'
    title_zh: 坚持音义兼顾译风
    rationale: 梵汉悬隔，须师资互证，使教道二义和合，令义相应不违
