  date: 0996-01-01
  year_of: 996
  place_zh: 东京
  description: 七卷译毕，具对法世间因果施设，编入宋元续入藏诸论流通后世
- id: guji-法护-event-death
  title_zh: 示寂
  date: 1001-01-01
  year_of: 1001
  place_zh: 东京
  description: 约宋真宗初年示寂，一生以传译施设劝善为业
