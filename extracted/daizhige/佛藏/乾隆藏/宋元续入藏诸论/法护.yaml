  era: 宋
  reign_ref: 宋太宗真宗朝
  archetype: 西天译经弘法僧
  dilemmas:
  - 梵汉悬隔而圣言须达，守梵本阙文与奉诏成译之间求信达
  - 因果幽微难见，欲以轮王七宝菩萨瑞相施设劝善之间求权实兼顾
  lesson: 以清净无恼害之心行布施持戒感胜报，更以传译施设利世为究竟布施
  summary_first_person: 我自西天来入宋地，奉诏与众共译施设论七卷，具说世间因果施设，轮王七宝即同佛法，菩萨降胎光明振动，愿众生知业果不虚修善离恼共趣菩提
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/宋元续入藏诸论/施设论.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/宋元续入藏诸论/施设论.md
endeavors:
- id: guji-法护-endeavor-1
  title_zh: 奉诏传译施设论七卷
  summary_zh: 自西天传梵入宋译场，与众共译对法大论世间因果施设门，成七卷定本
  phases:
  - key: brewing
    name: 西来传梵入译场
    labels:
      zh: 积淀筹备
    start_date: 0980-01-01
    highlight_event_id: guji-法护-event-arrive
  - key: breakthrough
    name: 初译世间因施设门
    labels:
      zh: 初译突破
    start_date: 0983-01-01
    highlight_event_id: guji-法护-event-translate-start
  - key: climax
    name: 具译轮王七宝配佛法
    labels:
      zh: 高潮会通
    start_date: 0990-01-01
    highlight_event_id: guji-法护-event-translate-climax
  - key: closure
    name: 七卷定本编入续藏
    labels:
      zh: 流通收束
    start_date: 0996-01-01
    highlight_event_id: guji-法护-event-translate-done
  decisions:
  - date: 0983-01-01
    title_zh: 存阙梵本阙世间施设门而直译因门
    rationale: 梵本元阙则不增益臆造，存阙以存信，据现有因门发挥业果，守译场诚信
  - date: 0990-01-01
    title_zh: 以轮王七宝配八正道神足等法
    rationale: 借王法易解显佛法难见，使世俗欣乐转向出世修行，以施设摄化群生
- id: guji-法护-endeavor-2
  title_zh: 阐扬菩萨降胎成道施设
  summary_zh: 详说菩萨兜率降胎七步光明诸瑞相，开示往昔清净布施持戒之同分因
  phases:
  - key: brewing
    name: 咨问菩萨瑞相何因
    labels:
      zh: 发问酝酿
    start_date: 0991-01-01
    highlight_event_id: guji-法护-event-translate-climax
  - key: breakthrough
    name: 说胎藏清净无染之因
    labels:
      zh: 显因突破
    start_date: 0992-01-01
    highlight_event_id: guji-法护-event-preach-cause
  - key: climax
    name: 说七步四方二龙灌沐
    labels:
      zh: 瑞相高潮
    start_date: 0994-01-01
    highlight_event_id: guji-法护-event-preach-cause
  - key: closure
    name: 以本生因果劝修十善
    labels:
      zh: 劝善收束
    start_date: 0996-01-01
    highlight_event_id: guji-法护-event-translate-done
  decisions:
  - date: 0992-01-01
    title_zh: 以同分善业释胎中清净持戒
    rationale: 将不可见宿因系于可见布施持戒梵行，令信众有下手处，起慈心行不恼害
  - date: 0994-01-01
    title_zh: 以龙天欢喜显菩萨威德而不归神异
    rationale: 归瑞相于利生誓愿与成佛决定心，破神怪执，导归菩提行愿
