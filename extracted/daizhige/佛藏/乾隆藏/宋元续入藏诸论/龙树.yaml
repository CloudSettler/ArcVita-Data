endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 开显缘生性空破有无二边
  summary_zh: 以甚深缘生义破自性见，立离有无之中道
  phases:
  - key: brewing
    name: 观察缘生蕴处界法
