person:
  qid: guji-龙树
  name_zh: 龙树
  names:
    zh: 龙树菩萨
    en: Nagarjuna
  lifespan:
    birth:
      date: '0150'
      precision: year
      is_circa: true
      raw: 约汉永平末年生于南天竺
    death:
      date: '0250'
      precision: year
      is_circa: true
      raw: 约魏正始年间示寂
  birth_date: '0150'
  death_date: '0250'
  era: 东汉至曹魏
  reign_ref: 东汉桓帝至曹魏
  archetype: 破执显空型论师
  dilemmas:
  - 有无二执难离，若言有生则堕常，若言都无则昧缘起，如何立无二中道
  - 假名世俗与胜义空性难兼顾，如何以慧安住实际而以悲广度众生
  lesson: 诸法如虚空无实，皆从分别所生，离分别即见实际，慧解与悲行不可偏废。
  summary_first_person: 我归命一切佛，如实了知诸法，观一切性从无性生，诸法与虚空等，无因无果无业可得，唯假名分别所现，我依经略说破有，示眼不见色乃至意不知法，令人通达第一义，以慧安住实际，以悲广度众生。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%AE%8B%E5%85%83%E7%BB%AD%E5%85%A5%E8%97%8F%E8%AF%B8%E8%AE%BA/%E5%A4%A7%E4%B9%98%E7%A0%B4%E6%9C%89%E8%AE%BA.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%AE%8B%E5%85%83%E7%BB%AD%E5%85%A5%E8%97%8F%E8%AF%B8%E8%AE%BA/%E5%A4%A7%E4%B9%98%E7%A0%B4%E6%9C%89%E8%AE%BA.md
endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 中观破有立空
  summary_zh: 以缘起无性破有无邪执，立诸法如虚空之义，显无二道第一义谛。
  phases:
  - key: brewing
    name: 南天竺研学蕴酿
    labels:
      zh: 蕴酿研学
    start_date: '0165'
    highlight_event_id: guji-龙树-event-study
  - key: breakthrough
    name: 悟缘起性空突破
    labels:
      zh: 突破立论
    start_date: 0185
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: climax
    name: 造破有论显宗高峰
    labels:
      zh: 高峰造论
    start_date: '0200'
    highlight_event_id: guji-龙树-event-pohyou
  - key: closure
    name: 中道正见传承收束
    labels:
      zh: 收束传承
    start_date: '0230'
    highlight_event_id: guji-龙树-event-teach
  decisions:
  - date: 0185
    title_zh: 抉择以空破有显中道
    rationale: 若执有生则性是常，有违缘起，唯说无性无生方能离有无二边而见真实。
  - date: '0200'
    title_zh: 抉择依经略说破有
    rationale: 为令有智者如实了知诸法如空，故依经造论，直示眼不见色意不知法以破邪执。
- id: guji-龙树-endeavor-2
  title_zh: 悲智双运度众
  summary_zh: 以慧方便安住实际，行布施持戒等六度，起悲愍行广度众生速证菩提。
  phases:
  - key: brewing
    name: 悲愿发起蕴酿
    labels:
      zh: 蕴酿发心
    start_date: '0200'
    highlight_event_id: guji-龙树-event-pohyou
  - key: breakthrough
    name: 慧悲并行突破
    labels:
      zh: 突破践行
    start_date: '0210'
    highlight_event_id: guji-龙树-event-teach
  - key: climax
    name: 广度众生高峰
    labels:
      zh: 高峰度众
    start_date: '0220'
    highlight_event_id: guji-龙树-event-teach
  - key: closure
    name: 付嘱后学收束
    labels:
      zh: 收束付嘱
    start_date: '0240'
    highlight_event_id: guji-龙树-event-death
  decisions:
  - date: '0210'
    title_zh: 抉择不行独觉而行大乘
    rationale: 虽知一切智性不可说得，然为度众须常行六度，以悲愍摄受世间亲爱眷属令离分别。
  - date: '0230'
    title_zh: 抉择以假名说法度众
    rationale: 诸法本无名唯假名表了，故须借名字言说令人离所缘而证无上菩提。
events:
- id: guji-龙树-event-birth
  title_zh: 南天竺诞生
  date: '0150'
  year_of: 150
  place_zh: 南天竺
  description_zh: 约汉永平末年生于南天竺婆罗门家，天资颖悟，博通世典。
- id: guji-龙树-event-study
  title_zh: 研习佛典通达
  date: 0168
  year_of: 168
  place_zh: 南天竺
  description_zh: 研习吠陀及三藏，了知世间出世间法，见世间无实从分别起。
- id: guji-龙树-event-madhyamaka
  title_zh: 立缘起性空破邪执
  date: 0185
  year_of: 185
  place_zh: 南印度
  description_zh: 倡缘起无自性，破有生常见，立蕴皆空无心无身之义，通达第一义谛。
- id: guji-龙树-event-pohyou
  title_zh: 宣说大乘破有之义
  date: '0200'
  year_of: 200
  place_zh: 南印度
  description_zh: 依经略说破有，示一切性从无性生，诸法与虚空等，眼不见色乃至意不知法，是为无二道真实说。
- id: guji-龙树-event-teach
  title_zh: 弘法度众行六度
  date: '0220'
  year_of: 220
  place_zh: 南印度
  description_zh: 以慧方便安住实际，行布施持戒忍辱精进禅定智慧，起悲愍行广度众生。
- id: guji-龙树-event-death
  title_zh: 示寂
  date: '0250'
  year_of: 250
  place_zh: 南天竺
  description_zh: 化缘既毕示寂，付嘱中观无二正见于后学，大乘破有之旨经后代传译不绝。
