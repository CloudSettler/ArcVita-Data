      - 性空
      - 中道
    start_date: 0190
    highlight_event_id: guji-龙树-event-awaken
  - key: climax
    name: 破生灭断常广宣正法
    labels:
      zh:
      - 破邪
      - 显正
    start_date: '0200'
    highlight_event_id: guji-龙树-event-compose
  decisions:
  - date: 0190
    title_zh: 抉择离有无二边而无所依
    rationale: 若执有性则堕常见，若执无性则堕断灭，故立不可说有无而了性无性
  - date: '0200'
    title_zh: 抉择生死涅槃无别
    rationale: 生死涅槃二俱无所有，了知生死即是涅槃，故不别观异性
- id: guji-龙树-endeavor-2
  title_zh: 造六十颂如理弘传大悲甘露
  summary_zh: 依佛言教造颂六十，以大悲开善趣解脱门
  phases:
  - key: brewing
    name: 依经集意思惟无明缘起
    labels:
      zh:
      - 无明缘起
      - 烦恼观
    start_date: 0195
    highlight_event_id: guji-龙树-event-awaken
  - key: closure
    name: 造颂流通利益后学
    labels:
      zh:
      - 造论
      - 弘传
    start_date: '0210'
    highlight_event_id: guji-龙树-event-compose
  decisions:
  - date: '0210'
    title_zh: 决定以颂赞说甚深广大义
    rationale: 此义甚深难说，为胜利故赞说，能破自他痴暗而开解脱门
  - date: '0215'
    title_zh: 决定以持戒正见并弘
    rationale: 持净戒得生天，住正心不坏见，故以大悲劝发法欲广施作
