    start_date: '0671'
    highlight_event_id: guji-义净-event-departure
  - key: climax
    name: 那烂陀学律兼通声明
    labels:
      zh: 取律精研
    start_date: 0680
    highlight_event_id: guji-义净-event-study
  - key: closure
    name: 携梵本归国至洛阳
    labels:
      zh: 载誉东归
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: '0671'
    title_zh: 决意自广州泛海西行
    rationale: 欲亲证戒律本源，非海路无以至南海诸国，故不避死王催伺之险
  - date: 0680
    title_zh: 留学那烂陀十年研律
    rationale: 律为佛法寿量，须久住亲承，兼习梵语因明以备译业
- id: guji-义净-endeavor-2
  title_zh: 洛阳长安译经弘无常
  description_zh: 奉武后中宗之诏主持译场，译出佛说无常经及临终方诀，劝化僧俗观无常修福智迎生佛土
  phases:
  - key: brewing
    name: 洛阳受诏入译场
    labels:
