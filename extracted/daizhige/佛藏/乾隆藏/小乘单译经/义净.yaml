  title_zh: 泛海西行求法取律
  description_zh: 自广州浮海历室利佛逝至中天那烂陀，研习说一切有部律及声明因明，著南海寄归内法传报中土
  phases:
  - key: brewing
    name: 齐州出家慕奘立志
    labels:
      zh: 立志求法
    start_date: '0650'
