  description_zh: 唐咸亨二年自广州乘舶南行，历室利佛逝诸国，备尝众苦与死俱之险
  place_zh: 广州
- id: guji-义净-event-study
  date: 0680
  year_of: 680
  title_zh: 那烂陀研习有部律
  description_zh: 至中天那烂陀从师研习律藏及声明，兼学三界难居唯佛可归之旨
  place_zh: 那烂陀
- id: guji-义净-event-return
  date: 0695
  year_of: 695
  title_zh: 携梵本归至洛阳
