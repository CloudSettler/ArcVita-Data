  dilemmas:
  - title_zh: 安席讲律还是蹈海求源
    description_zh: 在长安已通三藏，若安居讲席可得名利，若泛海西行则生死未卜，终择西行以求律本
  - title_zh: 深文直译还是浅喻普化
    description_zh: 奉诏译经时，面对老病死无常深义，择以妙高山大海枯竭等喻令僧俗同晓，普劝修福智
  lesson: 观生皆归死则不贪暂住，持戒译经皆为济渡生死流
  summary_first_person: 我是义净，齐州人，幼慕玄奘西游，咸亨二年自广州泛海至南海及那烂陀求法，研习有部律学二十余年，归国后于洛阳长安主持译场，译出佛说无常经，劝诸人谛听真实法，共舍无常处，当行不死门
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E5%8D%95%E8%AF%91%E7%BB%8F/%E4%BD%9B%E8%AF%B4%E6%97%A0%E5%B8%B8%E7%BB%8F.md
