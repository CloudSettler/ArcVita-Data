    start_date: '0703'
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 附临终方诀教念佛迎生
    labels:
      zh: 普劝临终
    start_date: '0705'
    highlight_event_id: guji-义净-event-translate
  - key: closure
    name: 长安寂灭付嘱流通
    labels:
      zh: 灰身弘化
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0703'
    title_zh: 先译无常经示不可爱事
    rationale: 老病死为世间所共嫌，举妙高坏散大海枯竭为喻，最能令众生厌离发心
  - date: '0705'
    title_zh: 广说临终澡浴观佛仪轨
    rationale: 眷属财货皆舍去，唯善根可为粮食，故详定请佛十念受戒北首西向之法
events:
