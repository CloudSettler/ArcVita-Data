events:
- id: guji-佛-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 降生迦毗罗卫
  description: 怀胎十月临生母危既生推燥卧湿血化为乳所述生育之始
- id: guji-佛-event-1
  date: -500-01-01
  year_of: -500
  title_zh: 问孝诘供养
  description: 问诸沙门何以报亲恩闻尽礼供养及甘露肩负之对告未为孝矣
- id: guji-佛-event-2
  date: -499-01-01
  year_of: -499
  title_zh: 开示极谏化亲法
  description: 教于顽闇作恶之亲当极谏牵譬牢狱太山汤火乃至啼泣绝食令迁志奉五戒三归
- id: guji-佛-event-3
  date: -498-01-01
  year_of: -498
  title_zh: 诫远女色守道
  description: 诫无以薜妻远贤女色惑志杀身灭宗劝沙门独而不双清洁其志奉戒修道
- id: guji-佛-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 涅槃示终
  description: 说孝子经已弟子欢喜奉行示有为无常寿终所往之教竟
