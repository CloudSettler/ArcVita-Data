  date: '-0650'
  year_of: -650
  location_zh: 迦毗罗卫
  description: 生于释迦瞿昙种王室，长而继位为舍夷国净饭王，以正法礼义治国
- id: guji-净饭王-event-reign
  title_zh: 以正法慈心护养人民
  date: '-0600'
  year_of: -600
  location_zh: 迦毗罗卫
  description: 治以正法礼德仁义常行慈心，护养人民莫不得安，名闻十方
- id: guji-净饭王-event-parting
  title_zh: 太子逾城出家父王思慕
  date: '-0565'
  year_of: -565
  location_zh: 迦毗罗卫蓝毗园宫城
  description: 长子悉达逾出宫城诣蓝毗树下思惟求道，父王稽首敬礼后长夜渴仰难见
- id: guji-净饭王-event-illness
  title_zh: 四大不调重病渴见四子
  date: '-0551'
  year_of: -551
  location_zh: 迦毗罗卫宫中
  description: 身中四大同时俱作支节欲解喘息不定，众医疗治无能愈者，自陈不以命逝为苦唯恨不见悉达难陀阿难罗云
- id: guji-净饭王-event-invite
  title_zh: 佛以天眼天耳遥鉴父病
  date: '-0550'
  year_of: -550
  location_zh: 王舍城耆阇崛山至迦毗罗卫
  description: 世尊在灵鹫山以天耳遥闻天眼遥见父王羸困命欲终，告难陀阿难罗云速发往见令王愿满
- id: guji-净饭王-event-meeting
  title_zh: 世尊乘空而来放光说法
  date: '-0550'
  year_of: -550
  location_zh: 迦毗罗卫王宫
  description: 佛与难陀阿难罗云乘空而至放大光明触王身令患苦得安，以三十二相说法开解，大称王赞四子功德，王捉佛手着心上瞻视无厌
- id: guji-净饭王-event-death
  title_zh: 宫中合掌命终生净居天火化起塔
  date: '-0550'
  year_of: -550
  location_zh: 迦毗罗卫葬所灵鹫山取香薪处
  description: 王合掌心礼佛足，佛手在王心上命尽气绝，佛与难陀在丧头阿难罗云在丧足，四天王担棺，佛执香炉前行，香薪火化收骨置金函起塔，佛记生净居天
