    title_zh: 病中一心渴仰见佛不恋世乐
    rationale: 自知瑞应将终无常对至，唯愿见四子满愿，以念佛信心除愁毒怖畏
  - date: '-0550'
    title_zh: 合掌闻法欢喜舍寿生净居
    rationale: 蒙佛金臂触额说法开解，谛思诸经法义，于不牢固得坚固志，以清净戒行生净居天
events:
