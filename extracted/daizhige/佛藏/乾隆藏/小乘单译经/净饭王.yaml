    rationale: 护养人民令莫不得安，以积德护国成就名闻十方之圣王基业
  - date: '-0565'
    title_zh: 容许悉达出家不强留宫
    rationale: 虽痛惜太子逾城，然知其为利世间成佛之圣业，故含悲成就其求道
