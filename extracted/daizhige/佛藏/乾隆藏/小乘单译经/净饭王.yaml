  - title_zh: 正法护国与太子出家之失
    description: 以正法礼义护养人民名闻十方，却痛失悉达太子逾城求道，长夜思念难释
  - title_zh: 病笃将终与渴仰见子之愿
    description: 四大俱作众医无效命欲终时，不以身苦为苦，唯恨不见悉达难陀阿难罗云四子以满本愿
  lesson: 清净持戒一心向佛，临终欢喜闻法即得安乐生净居天，垂示孝亲报恩与念佛功德
  summary_first_person: 吾是迦毗罗卫净饭王，以正法慈心治国护民，晚年四大不调重病卧床，渴仰见佛与诸子，蒙世尊自灵鹫乘空而来放光说法手触吾额，吾合掌瞻佛无厌，含笑而终。
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/小乘单译经/佛说净饭王般涅槃经.html
