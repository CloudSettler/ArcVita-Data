  decisions:
  - date: -0490-01-01
    title_zh: 集亲里证诣王求断
    rationale: 家人以孝顺亲爱为据不识真我，密藏瘢记皆被化同，唯归王法可决
  - date: -0490-01-01
    title_zh: 随王至祇洹请佛决疑
    rationale: 王穷神思不能分别，知非人事必是非人所为，唯佛慧眼能断真伪
  - date: -0490-01-01
    title_zh: 信佛语舍悭得须陀洹
    rationale: 闻悭贪堕饿鬼受饥渴火苦，畏怖因缘施心即生，故信受放舍
