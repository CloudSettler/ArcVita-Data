    title_zh: 取五钱买麨酒葱城外独食
    rationale: 不欲家中母妻眷属分食，又畏他家主人乞者来索，故避至空静处
  - date: -0490-01-01
    title_zh: 醉歌自比胜帝释毗沙门
    rationale: 先不饮酒即大醉，节庆纵酒大欢乐自以为足，慢心骤起
