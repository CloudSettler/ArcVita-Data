  location_zh: 舍卫卢至宅
  description: 释提桓因化作卢至，诳母言悭鬼已除，大开库藏以璎珞衣食施母妻眷属宾客，作伎乐欢饮，真卢至醉醒归家被倒曳打出
- id: guji-卢至-event-king-trial
  type: career
