  location_zh: 波斯匿王宫
  description: 亲里证为卢至，挟二氎献王化为草束惭愧，王问密事书疏左胁小豆瘢皆同，又唤母辨以孝顺为子，不能分别
- id: guji-卢至-event-buddha-proof
  type: career
  date: -0490-01-01
  year_of: -490
  title_zh: 佛前显真舍悭证须陀洹
  location_zh: 祇洹精舍
  description: 王与群臣奉二卢至至佛所，佛呼帝释还复本形，佛敕放舍，卢至信佛语舍悭即得须陀洹果，天龙四众亦得道果
- id: guji-卢至-event-death
  type: death
  date: -0450-01-01
  year_of: -450
  title_zh: 舍悭信法后终
  location_zh: 舍卫城
  description: 证须陀洹后归家守信修善，寿终舍报，事载卢至长者因缘经
