  - 身浴可除身垢而心垢当以何水洗之
  - 守父旧教日三浴与舍苦行从佛正道当何从
  lesson: 道从心出，心端志净乃得道，不在外形苦浴
  summary_first_person: 吾本梵志名孙多耶致，承父教日三浴啖果饮水，不受人施，自谓胜于沙门。望见佛于舍卫祇园，拄杖吐舌而轻之。佛说二十一恶秽乱其心，又诘千浴可除身垢奈心垢何，吾始醒寤如冥中有灯。遂长跪忏悔前狂愚，乞为沙门，无亲可报，即得听许。于树下惟二十一事，去欲无想，遂得应仪道，方知众道皆邪唯佛道正。
