  lesson: 舍荣求道以译经化俗，明善恶因果使人迁善远罪
  summary_first_person: 我本安息国太子，舍王位而出家，博晓经论，汉桓帝时来至洛阳，译出禅数因果诸经，宣说十八泥犁苦报，劝人知佛道而行善，后南游会稽以终。
