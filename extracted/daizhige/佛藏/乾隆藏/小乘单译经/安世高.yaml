    highlight_event_id: guji-安世高-event-death
  decisions:
  - date: 0148-01-01
    title_zh: 舍安息王位东行汉土
    rationale: 让国与叔，出家修道，为弘法故不惮远涉，选择汉地为教化之土
  - date: 0150-01-01
    title_zh: 定口授笔受译经体例
    rationale: 胡语未通汉义难晓，故立译场分工，使义理不失而文辞可晓
- id: guji-安世高-endeavor-2
  title_zh: 译说十八泥犁明善恶报
  summary_zh: 译出佛说十八泥犁经，详陈八火犁十寒犁之名状寿量苦毒，发明善多上天恶多入犁之理。
  phases:
  - key: brewing
    name: 观汉俗淫杀不明因果
    labels:
      zh:
      - 观察机缘
    start_date: 0148-01-01
    highlight_event_id: guji-安世高-event-arrive-luoyang
  - key: breakthrough
    name: 取泥犁本而敷陈业报
    labels:
      zh:
      - 发起译述
    start_date: 0152-01-01
    highlight_event_id: guji-安世高-event-translate-shiba-nili
  - key: climax
    name: 备述十八犁苦寿倍增
    labels:
      zh:
      - 详示苦报
    start_date: 0153-01-01
    highlight_event_id: guji-安世高-event-translate-shiba-nili
  - key: closure
    name: 劝知佛道迁善上天
    labels:
      zh:
      - 劝善流通
    start_date: 0155-01-01
    highlight_event_id: guji-安世高-event-death
  decisions:
  - date: 0152-01-01
    title_zh: 先译泥犁小经警世
    rationale: 世人见日少不见日多，故先示地狱深浅迟速之报，使畏苦而修善
  - date: 0153-01-01
    title_zh: 存质直文示寿量倍数
    rationale: 保留二十倍增苦、芥种量寿之说，令因果轻重可计量而易信受
events:
- id: guji-安世高-event-birth
  title_zh: 出生于安息国王室
  date: 0100-01-01
  year_of: 100
  place_zh: 安息国
  description: 安息国太子，清字世高，幼以孝行闻，博学群经，通晓三藏。
- id: guji-安世高-event-arrive-luoyang
  title_zh: 建和年间抵达洛阳
  date: 0148-01-01
  year_of: 148
  place_zh: 洛阳
  description: 汉桓帝建和二年左右至洛阳，敷演佛法，开始译经，二十余年译出数十部。
- id: guji-安世高-event-translate-shiba-nili
  title_zh: 译出佛说十八泥犁经
  date: 0152-01-01
  year_of: 152
  place_zh: 洛阳
  description: 译说八火泥犁先就至不卢都般呼，十寒泥犁乌竟都至沈莫，明善恶轻重入犁迟速之报。
- id: guji-安世高-event-death
  title_zh: 南游会稽示寂
  date: 0170-01-01
  year_of: 170
  place_zh: 会稽
  description: 译业既竟，南游吴会，宣化江东，终卒于会稽，灵异多传于世。
