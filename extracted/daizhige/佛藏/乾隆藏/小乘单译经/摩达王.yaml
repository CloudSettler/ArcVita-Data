- id: guji-摩达王-event-2
  title_zh: 见比丘飞空现神足恐怖悔过
  date: '-0505'
  year_of: -505
  location: 摩达国军阵前
  description: 比丘于王前轻举飞翔上住空中现威神王恐怖叩头自称愚痴不别真伪欲推问治杀比丘告以宿命供养师澡手起念受殃养马善恶如影随形王意解欢喜乞归命
- id: guji-摩达王-event-3
