  description: 王及国人民随比丘到佛所稽首作礼受五戒作优婆塞佛现相好威神光曜天地说无常苦空王得须陀洹道人民受五戒十善归命三尊月日斋戒为常法阿难问缘佛说昔摩父佛时供养因缘天龙鬼神闻经欢喜作礼而去
