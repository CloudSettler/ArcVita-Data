  dilemmas:
  - 婆罗门言娠妻生子必为国患，杀与不杀两难而误从谗言
  - 见须陀神变之后，治罪与归命两途而选择悔过自归于佛
  lesson: 罪福响应如影随形，为善得福行恶受殃，当远谗佞自归三尊
  summary_first_person: 我是旃陀越王，昔奉婆罗门道而治国，误信谗言杀兼娠小夫人，后遇须陀比丘现神变，率众往祇洹见佛，闻宿世施酪酥得福及杀犊结怨之因果，悔过受五戒而得须陀洹道
