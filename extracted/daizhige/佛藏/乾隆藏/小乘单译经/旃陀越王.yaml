  decisions:
  - date: -344
    title_zh: 从婆罗门言杀娠妻
    rationale: 忧亡国丧身而轻信谗言，以人命至重之犹豫终从其说
  - date: -344
    title_zh: 葬埋母尸于冢
    rationale: 既行抂杀而依俗葬埋，不知儿于冢中生而母半身不朽
