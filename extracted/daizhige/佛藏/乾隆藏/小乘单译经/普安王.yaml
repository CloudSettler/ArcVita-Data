  archetype: 习菩萨行之仁王
  dilemmas:
  - 四王习邪行耽世乐，如何以方便化导而不以威权相加
  - 四王各执久乐，如何破其无常而不伤其向道欢喜
  - 身为大国之王，如何舍尊位而与四王同为佛弟子
  lesson: 世间诸乐皆归无常磨灭，唯不生不死不苦不恼自在为久乐，当以慈悲方便引众闻苦谛而得解脱
  summary_first_person: 吾为五王之长普安，习菩萨行，见四邻小王耽着世乐，召以上殿七日伎乐相待，送至半道问其所乐，示其无常非久，再引诣祇桓请佛说八苦，闻已心开意悟，得须陀洹
