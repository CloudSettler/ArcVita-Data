    highlight_event_id: guji-普安王-event-audience
  - key: closure
    name: 五王群臣心开得须陀洹
    labels:
      zh:
      - 证道
      - 欢喜作礼而去
    start_date: -0500-03-11
    highlight_event_id: guji-普安王-event-audience
  decisions:
  - date: -0500-03-10
    title_zh: 率四王及群臣诣祇桓稽首请法
    rationale: 既发向道心，须亲近明师，故不独往而率众同行，共闻正法
  - date: -0500-03-10
    title_zh: 胡跪叉手自陈深著世乐不知罪福
    rationale: 以我等今得为人钝闇无智为发起，请佛说其苦谛，令四王同得警悟
  - date: -0500-03-11
    title_zh: 闻八苦已欢喜作礼而去不复留恋王宫之乐
    rationale: 已见宫殿如秽厕无可爱者，当以得道迹为归，不复以世乐为乐
