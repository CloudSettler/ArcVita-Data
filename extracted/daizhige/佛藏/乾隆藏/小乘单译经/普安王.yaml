  decisions:
  - date: -0500-03-01
    title_zh: 召四王上殿终日竟夜作倡伎乐七日
    rationale: 先以欲钩牵令生欢喜亲近，然后可进道言，故终日竟夜而不厌
  - date: -0500-03-08
    title_zh: 群臣吏民共送至半道乃问所乐
    rationale: 就分别之际发其本心，以怜愍意欲度之，故先问彼乐后说我乐
  - date: -0500-03-09
    title_zh: 直示师号为佛在祇桓精舍
    rationale: 四王已问此乐何处有明师，即指佛为师，引其亲诣听法而不自专
