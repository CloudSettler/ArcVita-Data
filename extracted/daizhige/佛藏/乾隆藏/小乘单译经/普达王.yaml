events:
- id: guji-普达王-event-birth
  title_zh: 王家诞生嗣位夫延
  date: '-0550'
  year_of: -550
  type: birth
  description: 本为先王时执盖小儿以一日斋戒清净守意之福命终神生王家为子后嗣位典领诸国号普达
- id: guji-普达王-event-1
  title_zh: 道旁礼僧市头设喻
  date: '-0505'
  year_of: -505
  type: endeavor
  description: 出宫见道人即下车头面作礼群臣进谏王敕取死人头及牛马猪羊头于市卖之畜头皆售人头丐人无取以破头贵之执
- id: guji-普达王-event-2
  title_zh: 旷泽示衣说执盖本变
  date: '-0504'
  year_of: -504
  type: endeavor
  description: 导从至城外旷泽出示先朝执盖小儿旧衣道人现前为众说其由斋戒福生王家之本末群臣欢喜愿为弟子
- id: guji-普达王-event-3
  title_zh: 遣使启佛率众出迎
  date: '-0504'
  year_of: -504
  type: endeavor
  description: 道人飞往舍卫启佛佛与千二百五十比丘俱来王及群臣持华香出城数十里迎佛上殿手自供设饭食澡水咒愿
- id: guji-普达王-event-4
  title_zh: 闻本生得道举国持戒
  date: '-0504'
  year_of: -504
  type: endeavor
  description: 佛笑放光说摩诃文佛时大姓家子传香及侍使誓度本末王意解得须陀洹国人皆受五戒十善为常法
- id: guji-普达王-event-death
  title_zh: 夫延国中寿终而逝
  date: -0480
  year_of: -480
  type: death
  description: 行正法化国民后于夫延国宫中寿终国民追念其护法兴善之德
