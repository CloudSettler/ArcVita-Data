  archetype: 劳民徙石终遇佛得度之护法国王
  dilemmas:
  - 王道方石周旋数十里徙之则发九亿人历年疲极不徙则国道不通当如何决断
  - 人力穷极石不动佛以神通足指挑石当信人力还是信因果佛法
  - 得闻四力与生老病死之法已解愚痴当如何报恩护持三宝化导士民
  lesson: 人力有限徒劳无功唯精进忍辱布施孝养父母及观生老病死无常方能离苦归敬三宝即得解脱
  summary_first_person: 吾为末罗国王土地丰沃士民壮勇昔以方石当于王道料选国内九亿人掘徙历年士民疲极不能动石佛自舍卫祇园弹指而来现神通说法示精进忍辱布施父母四力及生老病死吾与九亿人同受五戒十善归命三尊垢除结解得须陀洹道此皆昔俱留秦佛时同发善愿之福也
