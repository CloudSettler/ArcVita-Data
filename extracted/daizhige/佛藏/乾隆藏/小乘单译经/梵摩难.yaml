  - 以国中珍宝甘肴富贵与出家粗蔬勤苦之间何为真乐
  lesson: 放下恩爱分别以平等心护法供养方能因法得度
  summary_first_person: 吾为梵摩难王，每逢斋日率众诣祇园供养世尊及比丘僧，恭听经法，宫中奉事三尊持斋。后允太子均邻儒随佛出家，初以恩爱劝其还俗，及见其空中神变乃悲喜作礼，听其说苦空非常四谛，遂得须陀洹道。
