  summary_zh: 译出佛在尼拘类树下所说轮转五道经，明豪贵富寿端正聪睿皆从礼宝布施持戒忍辱精进禅定智慧而来，杀盗淫妄饮酒悭贪皆堕三涂，劝人精进植福
