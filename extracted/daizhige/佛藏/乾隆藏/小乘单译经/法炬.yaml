    highlight_event_id: guji-法炬-event-preach-weiyi
  - key: breakthrough
    name: 举伪滥以示众
    labels:
      zh: 举喻示众
    start_date: '0303-01-01'
    highlight_event_id: guji-法炬-event-preach-weiyi
  - key: climax
    name: 劝摈恶行弘善行
    labels:
      zh: 劝舍恶行
    start_date: '0305-06-01'
    highlight_event_id: guji-法炬-event-preach-weiyi
  - key: closure
    name: 令众讽诵持学
    labels:
      zh: 讽诵持学
    start_date: '0306-01-01'
    highlight_event_id: guji-法炬-event-preach-weiyi
  decisions:
  - date: '0303-01-01'
    title_zh: 以群牛抵驴喻立摈众之制
    rationale: 效群牛以角抵杀舍驴而去，立摈出界外之式，使清净众得安
  - date: '0305-06-01'
    title_zh: 劝学沙门婆罗门善行
    rationale: 令舍非沙门非婆罗门行，善讽诵持沙门善行，使行步着衣持钵皆备具
