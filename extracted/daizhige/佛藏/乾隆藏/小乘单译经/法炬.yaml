endeavors:
- id: guji-法炬-endeavor-1
  title_zh: 翻译小乘单译经群牛譬经
  summary: 于舍卫祇园所说群牛喻法门译为汉文，明调良牛择软草饮凉水与伪驴混群被抵杀之喻
  phases:
  - key: brewing
    name: 受持梵本研义
    labels:
      zh: 研读梵本
    start_date: '0290-01-01'
    highlight_event_id: guji-法炬-event-translate-qunniu
  - key: breakthrough
    name: 草创汉译定喻
    labels:
      zh: 初译群牛喻
    start_date: '0295-01-01'
    highlight_event_id: guji-法炬-event-translate-qunniu
  - key: climax
    name: 群牛驴喻译成
    labels:
      zh: 译成流通
    start_date: '0295-06-01'
    highlight_event_id: guji-法炬-event-translate-qunniu
  - key: closure
    name: 单译入藏传持
    labels:
      zh: 入藏传持
    start_date: '0296-01-01'
    highlight_event_id: guji-法炬-event-translate-qunniu
  decisions:
  - date: '0295-01-01'
    title_zh: 以牛驴直喻存经质朴
    rationale: 为存舍卫说法本意，不加文饰，直译调良择食与驴效鸣吼之对，使喻义分明
  - date: '0295-06-01'
    title_zh: 系为小乘单译以正名
    rationale: 明此为小乘劝众经，系于单译，使后学知其劝诫伪滥之旨
- id: guji-法炬-endeavor-2
  title_zh: 以威仪法整肃僧团劝学
  summary: 依群牛譬经所说精进众威仪具足与恶行比丘威仪不具之别，弘传戒律威仪，劝舍非沙门行
  phases:
  - key: brewing
    name: 观察众僧威仪
    labels:
      zh: 观察僧行
