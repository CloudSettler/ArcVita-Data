person:
  qid: guji-灯指
  name_zh: 灯指
  names:
    zh: 灯指
    en: Dengzhi
  lifespan:
    birth:
      date: -0490-01-01
      precision: year
      is_circa: true
      raw: 王舍城长者家诞生，手一指放大光明照十里
    death:
      date: -0410-01-01
      precision: year
      is_circa: true
      raw: 于佛法中出家得阿罗汉后果报尽入灭
  birth_date: -0490-01-01
  death_date: -0410-01-01
  era: 古印度释迦牟尼住世时
  reign_ref: 摩揭陀国阿阇世王治时
  archetype: 大起大落因果证道者
  dilemmas:
  - 贫穷困厄欲舍身求死与忍辱担尸乞食求活之间抉择
  - 尸宝还富贪著五欲与施舍珍宝出家求道之间抉择
  lesson: 少善种于胜福田终得大果，恶口招地狱贫苦，富贵无常不足贪，当远恶口勤修善业求涅槃
  summary_first_person: 我生王舍城长者家，生时一指放光故名灯指，少长富逸父母亡后荡尽家财，贫病乞食担尸得黄金头足还富，后厌五欲施宝出家精勤得阿罗汉，前世补佛像指得光宝，前世骂母招贫堕地狱，盛衰皆因果示人
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/小乘单译经/佛说灯指因缘经.md
  - https://daizhige.org/佛藏/乾隆藏/小乘单译经/佛说灯指因缘经.html
endeavors:
- id: guji-灯指-endeavor-1
  title_zh: 富贵破败贫困担尸得宝
  summary_zh: 父母双亡后不习家业交恶友荡产，盗劫一空指光灭妻子逃散，乞食受辱担尸被黏得黄金头足还富
  phases:
  - key: brewing
    name: 长者溺爱富逸不习业
    labels:
      zh: 富家子生长
    start_date: -0475-01-01
    highlight_event_id: guji-灯指-event-wealth
  - key: breakthrough
    name: 父母丧亡家业破败
    labels:
      zh: 荡产贫困
    start_date: -0465-01-01
    highlight_event_id: guji-灯指-event-ruin
  - key: climax
    name: 乞食担尸黏背受苦
    labels:
      zh: 极贫担尸
    start_date: -0462-01-01
    highlight_event_id: guji-灯指-event-corpse
  - key: closure
    name: 割金得宝还富受誉
    labels:
      zh: 尸宝还富
    start_date: -0461-01-01
    highlight_event_id: guji-灯指-event-treasure
  decisions:
  - date: -0462-01-01
    title_zh: 贫无所济决担尸求食
    rationale: 自念世人所鄙不过担尸，此事虽恶无杀生后世苦业，可贸直存活故从雇担负死人
  - date: -0461-01-01
    title_zh: 见尸指足皆金决取用还家
    rationale: 怖畏中见指纯金试割是真，剪头足复生积过人，可还库藏威德故取宝还富
- id: guji-灯指-endeavor-2
  title_zh: 厌离五欲出家证阿罗汉
  summary_zh: 还富后思五欲轻动厌患，以珍宝施众于佛法出家精勤修习得阿罗汉，尸宝常随以示宿因
  phases:
  - key: brewing
    name: 还富思惟五欲无常
    labels:
      zh: 厌患五欲
    start_date: -0460-01-01
    highlight_event_id: guji-灯指-event-treasure
  - key: breakthrough
    name: 施宝众人出家求道
    labels:
      zh: 施舍出家
    start_date: -0459-01-01
    highlight_event_id: guji-灯指-event-renounce
  - key: climax
    name: 精勤修习得阿罗汉
    labels:
      zh: 勤修证果
    start_date: -0458-01-01
    highlight_event_id: guji-灯指-event-arhat
  - key: closure
    name: 佛说宿缘示众因果
    labels:
      zh: 说灯指因缘
    start_date: -0457-01-01
    highlight_event_id: guji-灯指-event-sermon
  decisions:
  - date: -0459-01-01
    title_zh: 以珍宝施众出家求道
    rationale: 观五欲如电毒蛇荣乐不久，富贵不足贪贫苦应断，故舍财佛法中出家求涅槃乐
  - date: -0458-01-01
    title_zh: 精勤修习不恋尸宝随逐
    rationale: 虽获道果尸宝常随，知是治像福报恶口余报，当勤修断漏以因果示众故不恋著
events:
- id: guji-灯指-event-birth
  title_zh: 王舍城长者家诞生指放光明
  date: -0490-01-01
  year_of: -490
  place_zh: 王舍城长者家
  description_zh: 满十月生男儿，手一指放大光明照十里，父母集亲族相师立字名灯指，阿阇世王召见验夜光叹佛语不虚
- id: guji-灯指-event-wealth
  title_zh: 少长富逸娶妇资产转盛
  date: -0475-01-01
  year_of: -475
  place_zh: 王舍城本家
  description_zh: 灯指渐长大，父求高门娉妇，礼教光备闺门雍穆，资产转盛服饰奢靡拟于王者
- id: guji-灯指-event-ruin
  title_zh: 父母俱丧荡产沦为乞食
  date: -0465-01-01
  year_of: -465
  place_zh: 王舍城巷里粪堆
  description_zh: 父母俱丧生计渐损，不闲家业交恶友耽酒色，群贼劫掠一空指光灭，妻走仆逃亲断，拾粪秽弊衣乞食受辱
- id: guji-灯指-event-corpse
  title_zh: 受雇担尸黏背求脱不得
  date: -0462-01-01
  year_of: -462
  place_zh: 冢间旃陀罗村城门
  description_zh: 为食担负死人到冢间，死人急抱不放如胡胶，旃陀罗挽不去，村人杖石打掷，守门遮打大哭怜愍放还
- id: guji-灯指-event-treasure
  title_zh: 尸堕地指足纯金还富
  date: -0461-01-01
  year_of: -461
  place_zh: 自家空室
  description_zh: 到空室尸自堕地，见手指纯金试割是真，剪头项手足寻复还生积过人，库藏倍胜亲里妻子皆还，王取金头足还掷屋中见真金
- id: guji-灯指-event-renounce
  title_zh: 厌五欲施宝出家求道
  date: -0459-01-01
  year_of: -459
  place_zh: 佛法僧中
  description_zh: 思惟五欲极轻动如电毒蛇，即以珍宝施与众人，于佛法中出家求道发愿生人天富贵出家得道
- id: guji-灯指-event-arhat
  title_zh: 精勤修习得阿罗汉果
  date: -0458-01-01
  year_of: -458
  place_zh: 精舍修道处
  description_zh: 精勤修习得阿罗汉，虽获道果尸宝常随逐，比丘问佛光指贫困尸宝因缘
- id: guji-灯指-event-sermon
  title_zh: 佛说灯指宿世因缘示众
  date: -0457-01-01
  year_of: -457
  place_zh: 佛说法会
  description_zh: 佛说小儿时骂母举家担死人去堕地狱余报贫困，过去九十一劫毗婆尸佛后补泥像一指施金薄发愿得尊豪富贵出家得道，故得光宝，众天散花供养
- id: guji-灯指-event-death
  title_zh: 灯指比丘果报尽入灭
  date: -0410-01-01
  year_of: -410
  place_zh: 僧团中
  description_zh: 灯指证果后住持梵行示现因果，寿尽入灭，留灯指因缘经诫众远恶口勤修福田
