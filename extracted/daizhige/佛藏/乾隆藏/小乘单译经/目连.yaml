endeavors:
- id: guji-目连-endeavor-1
  title_zh: 奉佛敕往边国降伏五百梵志
  summary_zh: 承佛威神赴去舍卫八千里之边国以虚空定山显神变折伏具五通之梵志令去瞑就明
  phases:
  - key: brewing
    name: 祇园受命
    labels:
      zh: 受命远行
    start_date: -0500-01-01
    highlight_event_id: guji-目连-event-1
  - key: breakthrough
    name: 虚空镇山
    labels:
      zh: 显化定山
    start_date: -0500-03-01
    highlight_event_id: guji-目连-event-1
  - key: climax
    name: 山陷平地折服众心
    labels:
      zh: 折伏外道
    start_date: -0500-03-15
    highlight_event_id: guji-目连-event-1
  - key: closure
    name: 梵志稽首愿为弟子
    labels:
      zh: 归心受化
    start_date: -0500-04-01
    highlight_event_id: guji-目连-event-1
  decisions:
  - date: -0500-01-01
    title_zh: 承佛敕赴边国
    rationale: 边国不见三尊习于颠倒唯以神化长度方能济其君民远离三涂
  - date: -0500-03-01
    title_zh: 悬处虚空不动制山
    rationale: 不与梵志争斗法但以定力回山令其自知道德深浅而生敬仰
- id: guji-目连-endeavor-2
  title_zh: 接引梵志归佛助宣中心法要
  summary_zh: 叹佛功德摄众须臾至舍卫请佛荡除微垢助成五百沙门闻法得阿罗汉
  phases:
  - key: brewing
    name: 叹佛导化
    labels:
      zh: 开示佛德
    start_date: -0500-04-10
    highlight_event_id: guji-目连-event-2
  - key: breakthrough
    name: 屈伸臂顷摄众至佛前
    labels:
      zh: 接引归佛
    start_date: -0500-04-20
    highlight_event_id: guji-目连-event-2
  - key: climax
    name: 陈情请佛说法
    labels:
      zh: 请法度众
    start_date: -0500-05-01
    highlight_event_id: guji-目连-event-2
  - key: closure
    name: 五百沙门得道护持正法
    labels:
      zh: 助成圣果
    start_date: -0500-06-01
    highlight_event_id: guji-目连-event-2
  decisions:
  - date: -0500-04-10
    title_zh: 示尊师无上令众归佛
    rationale: 自言以芥子为须弥佛以须弥为芥子显佛为一切智不可自代师位
  - date: -0500-05-01
    title_zh: 陈众心已净请佛说经
    rationale: 众内外已净犹如新氎易可为色唯佛能荡微垢令成真净故不自说而请佛说中心经
events:
- id: guji-目连-event-birth
  date: '-0546'
  year_of: -546
  title_zh: 诞生于古印度
  description_zh: 约公元前六世纪中叶生于古印度摩揭陀国附近后从佛出家得神通第一之称
  place_zh: 古印度摩揭陀国
- id: guji-目连-event-1
  date: -0500-03-15
  year_of: -500
  title_zh: 边国虚空镇山降伏五百梵志
  description_zh: 在舍卫国祇树给孤独园承佛敕往边国悬处虚空当其山巅令山不动复令山陷三下成平地梵志惊伏稽首愿为弟子
  place_zh: 去舍卫八千里边国大山
- id: guji-目连-event-2
  date: -0500-05-01
  year_of: -500
  title_zh: 接引五百梵志至祇园见佛闻法
  description_zh: 以神力于屈伸臂顷接诸梵志至佛前具陈其情请佛说法佛说人身五贼十二因缘端心之道五百人皆作沙门得阿罗汉
  place_zh: 舍卫国祇树给孤独园
- id: guji-目连-event-death
  date: -0486
  year_of: -486
  title_zh: 灭度于古印度
  description_zh: 助佛宣化之后先佛灭度以神通济众之功为后世所传仰
  place_zh: 古印度王舍城附近
