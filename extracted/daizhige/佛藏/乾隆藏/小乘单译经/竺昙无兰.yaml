endeavors:
- id: guji-竺昙无兰-endeavor-1
  title_zh: 译出佛说新岁经
  summary: 承西域梵本译为汉文一卷，具载舍卫祇园受岁大会，目连遍告三千世界，阿难击楗椎，佛与众忏谢和合之仪
  phases:
  - key: brewing
    name: 幼学出家
    labels:
      zh: 出家学经
    start_date: '0355'
    highlight_event_id: guji-竺昙无兰-event-birth
  - key: breakthrough
    name: 得本立愿
    labels:
      zh: 得梵本发心
    start_date: '0375'
    highlight_event_id: guji-竺昙无兰-event-obtain-text
  - key: climax
    name: 太元译经
    labels:
      zh: 译出新岁经
    start_date: 0381
    highlight_event_id: guji-竺昙无兰-event-translate-xinsui
  - key: closure
    name: 流通付嘱
    labels:
      zh: 流通受持
    start_date: 0385
    highlight_event_id: guji-竺昙无兰-event-preach-confession
  decisions:
  - date: 0378
    title_zh: 决意取新岁自恣法为译主
    rationale: 夏竟受岁为僧团清净根本，华土未备此仪，故先译此经以立轨范
  - date: 0381
    title_zh: 直译存梵义兼畅华言
    rationale: 梵偈幽深而华俗乐简，须两全忠信晓畅，方能使八十万众同晓受岁之义
- id: guji-竺昙无兰-endeavor-2
  title_zh: 弘宣受岁忏悔和合法
  summary: 依新岁经敷演行舍罗筹，相谢忏悔，净身口意，奉行十善四等六度，劝众和同立最大戒
  phases:
  - key: brewing
    name: 观察众心
    labels:
      zh: 观察机缘
    start_date: 0381
    highlight_event_id: guji-竺昙无兰-event-translate-xinsui
  - key: breakthrough
    name: 祇园仪范东传
    labels:
      zh: 演说仪轨
    start_date: 0386
    highlight_event_id: guji-竺昙无兰-event-translate-xinsui
  - key: climax
    name: 大会忏谢
    labels:
      zh: 忏谢和同
    start_date: 0390
    highlight_event_id: guji-竺昙无兰-event-preach-confession
  - key: closure
    name: 守戒安隐
    labels:
      zh: 持戒化俗
    start_date: 0398
    highlight_event_id: guji-竺昙无兰-event-death
  decisions:
  - date: 0390
    title_zh: 以佛自叉手忏谢为化本
    rationale: 佛为无上尊尚向众忏谢，以折慢幢，故举此以劝比丘相忍和同除谀谄嗔恚
  - date: 0395
    title_zh: 严持戒禁以拣非器
    rationale: 毁戒如死尸不可疗，虽入众经年不能自救，故须明戒净秽以护新岁大会清净
