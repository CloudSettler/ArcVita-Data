endeavors:
- id: guji-贫穷老公-endeavor-1
  title_zh: 明慧王太子憍贵悭贪造业救生延寿
  summary: 前世为明慧王太子恃贵轻人悭吝不施，困逼静志沙门七日，后救其免于饿贼，由悭贪种贫穷长苦之因，由救命得长寿之缘。
  phases:
  - key: brewing
    name: 太子憍贵聚敛不施
    labels:
      zh: 憍贵悭贪
    start_date: -0680
    highlight_event_id: guji-贫穷老公-event-karma
  - key: climax
    name: 救沙门脱饿贼得寿缘
    labels:
      zh: 救生延寿
    start_date: -0680
    highlight_event_id: guji-贫穷老公-event-rescue
  decisions:
  - date: -0680
    title_zh: 拒施法衣困留沙门七日
    rationale: 恃为大国太子不信罪福试困道德以取乐聚人观之
  - date: -0680
    title_zh: 亲往救沙门出饿贼驱逐出国
    rationale: 自知不能乞其衣食不忍复令贼杀以赎前愆遂救其命
- id: guji-贫穷老公-endeavor-2
  title_zh: 二百年贫苦值佛出家得慧
  summary: 今生贫穷裸露饥寒二百年，发心十年愿见佛，蒙佛说宿世本源，乞出家入道即得法衣入三昧以偈赞佛。
  phases:
  - key: brewing
    name: 贫穷辛苦扶杖求见
    labels:
      zh: 久苦求法
    start_date: '-0500'
    highlight_event_id: guji-贫穷老公-event-meet
  - key: breakthrough
    name: 闻说本源出家得慧
    labels:
      zh: 忏悔入道
    start_date: '-0500'
    highlight_event_id: guji-贫穷老公-event-ordination
  decisions:
  - date: '-0500'
    title_zh: 冒释梵阻拦大唤求通
    rationale: 千载有幸得值佛闻佛仁慈普逮不忍还去恐命绝秽污圣门
  - date: '-0500'
    title_zh: 舍残命乞作沙门侍佛
    rationale: 愿毕今生贫穷之罪永离悭贪长受智慧后世世世侍佛
