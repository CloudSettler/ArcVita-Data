    labels:
      zh:
      - 阿难长跪请问
      - 从师受戒而嫉师之缘
    start_date: -484-05-15
    highlight_event_id: guji-释迦牟尼-event-rajagriha-precepts
  - key: climax
    name: 说猘狗啮主宿因
    labels:
      zh:
      - 过去佛咒愿猘狗
      - 泥犁罪毕复啮故主
    start_date: -484-05-15
    highlight_event_id: guji-释迦牟尼-event-mad-dog-cause
  - key: closure
    name: 结示谤师即宿狗
    labels:
      zh:
      - 谤说师恶如狗啮主
      - 贪利谤师堕五逆
    start_date: -484-05-16
    highlight_event_id: guji-释迦牟尼-event-mad-dog-cause
  decisions:
  - date: -484-05-15
    title_zh: 慈哀咒愿猘狗令见威神欢喜
    rationale: 愍过去猘狗还啮其主之恶业，以威神令其欢喜，植后世入人道受戒之远因
  - date: -484-05-15
    title_zh: 以狗喻明谤师之罪
    rationale: 使众知从师受戒还嫉谤者如狗啮主，宿命本是狗类，以止谤心而护师道
- id: guji-释迦牟尼-endeavor-2
  title_zh: 诫末世卖戒开悔洗重受
  summary_zh: 具说末世惰懒无智贪供之师卖戒教人入泥犁之相，答阿难初心误从恶师当如何，许其旷大悔改湔洗重受戒始入法，令护法神不短而不为恶鬼所病
  phases:
  - key: brewing
    name: 阿难惊问教人入泥犁
    labels:
      zh:
      - 教人事佛反入泥犁
      - �绕佛三匝请解人根
    start_date: -484-05-15
    highlight_event_id: guji-释迦牟尼-event-mad-dog-cause
  - key: breakthrough
    name: 斥末世卖戒之师
    labels:
      zh:
      - 惰懒贪秽求供养
      - 不断杀酒随人阿谀
    start_date: -484-05-15
    highlight_event_id: guji-释迦牟尼-event-mad-dog-cause
  - key: climax
    name: 明负教护法得短之祸
    labels:
      zh:
      - 卖戒令人慢不精戒犯粗杀生
      - 负明教致鬼病乃至入泥犁
    start_date: -484-05-16
    highlight_event_id: guji-释迦牟尼-event-mad-dog-cause
  - key: closure
    name: 许误从者更受戒
    labels:
      zh:
      - 初心曚冥非真弟子
      - 悔洗重受始为入法
    start_date: -484-05-16
    highlight_event_id: guji-释迦牟尼-event-parinirvana
  decisions:
  - date: -484-05-16
    title_zh: 具说卖戒之过不断杀酒之失
    rationale: 破末世师为钱物授戒不精佛法之弊，令众识教人入泥犁之由而不负明教
  - date: -484-05-16
    title_zh: 开许初心误从恶师者湔洗重受
    rationale: 愍新发意者偶值恶师不知不晓，许其于旷大法中悔改，更行受戒以成世间小善进至大功德
