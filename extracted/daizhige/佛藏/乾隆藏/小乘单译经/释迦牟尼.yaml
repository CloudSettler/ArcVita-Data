      - 苦行求道
    start_date: -0534-01-01
    highlight_event_id: guji-释迦牟尼-event-ascetic
  - key: climax
    name: 现世受谤受痛
    labels:
      zh:
      - 现偿余殃
    start_date: -0484-01-01
    highlight_event_id: guji-释迦牟尼-event-remaining
  - key: closure
    name: 涅槃前说缘令众护戒
    labels:
      zh:
      - 示现究竟
    start_date: -0483-02-15
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -0534-01-01
    title_zh: 郁秘地断息禅羸瘦六年
    rationale: 为偿宿缘示现勤苦，令众知成道非侥幸，断外道邪见
  - date: -0484-01-01
    title_zh: 毗兰邑甘受马麦三月
    rationale: 宿命当受，坦然受之，以明天人供养亦随缘，不怨国师梵志之请之失
events:
- id: guji-释迦牟尼-event-birth
  date: -0563-04-08
  year_of: -563
  title_zh: 迦毗罗卫诞生
  place_zh: 迦毗罗卫蓝毗尼园
  description_zh: 释迦种姓悉达多太子诞生，为后成佛之本生
- id: guji-释迦牟尼-event-ascetic
  date: -0534-01-01
  year_of: -534
  title_zh: 郁秘地苦行六年
  place_zh: 郁秘地雪山苦行林
  description_zh: 断息禅羸瘦六年，谓呼当得佛，为兴起行所说宿缘之一
- id: guji-释迦牟尼-event-anou
  date: -0484-07-15
  year_of: -484
  title_zh: 阿耨大泉说戒说宿缘
  place_zh: 昆仑阿耨大泉金莲华上
  description_zh: 将五百罗汉赴泉，应舍利弗问孙陀利奢弥跋头痛骨节脊痛木枪等多事，自说先世因缘并说偈
- id: guji-释迦牟尼-event-sundari
  date: -0484-06-01
  year_of: -484
  title_zh: 孙陀利谤及净眼杀鹿相缘显
  place_zh: 舍卫国及往昔波罗奈树园
  description_zh: 往昔为博戏人净眼杀淫女鹿相埋尸乐无为辟支佛庐中，抂困圣者，今故被孙陀利诽谤，地狱余殃现前
- id: guji-释迦牟尼-event-remaining
  date: -0484-01-01
  year_of: -484
  title_zh: 毗兰邑食马麦木枪刺脚示余殃
  place_zh: 毗兰邑及罗阅只竹园
  description_zh: 国师梵志请而毗兰邑三月食马麦，罗阅只乞食见刚木迸片现偿宿缘，又头痛脊痛骨节烦疼并现，示因果不昧
- id: guji-释迦牟尼-event-death
  date: -0483-02-15
  year_of: -483
  title_zh: 拘尸那城入般涅槃
  place_zh: 拘尸那城娑罗林
  description_zh: 断后生尽于是世，说兴起行缘已，示现色身无常而法身常存
