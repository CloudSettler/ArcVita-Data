  dilemmas:
  - 从师受戒而心怀嫉谤如猘狗还啮其主当如何化其宿识令不堕五逆
  - 末世懒师贪供卖戒教人反令入泥犁当如何显其过并开初心误从者悔洗之路
  lesson: 从师当敬不谤，为师当精律不贪，误从恶师可悔洗重受，正法方久住
  summary_first_person: 吾住罗阅只耆阇崛山，月十五日说戒，阿难问受戒而嫉谤师者何缘，吾为说过去猘狗啮主蒙前佛咒愿欢喜后堕泥犁罪毕得人身复啮故主之缘，又诫末世惰师贪财卖戒不断杀酒令人入泥犁之过，并开许初心为恶师所误者可湔洗重受戒，令众护持经戒不负明教
