    title_zh: 见杀盗之殃而不敢复为
    rationale: 见杀生者受地狱饿鬼畜生之苦见盗窃者受拷掠偿债之苦故立誓不杀不盗以慈伏魔
  - date: -528-01-01
    title_zh: 见老病死之变而行求道
    rationale: 见衰老病瘦死亡之坏灭知三界无常福尽命终皆归于土故弃家学道愿得不生不灭之泥洹
