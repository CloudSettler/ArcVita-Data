endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 罗阅耆阇崛山说戒示猘狗宿缘
  summary_zh: 住罗阅只耆阇崛山十五说戒，应阿难之请，宣说谤师如猘狗啮主之喻，追述过去佛时猘狗蒙咒愿欢喜堕泥犁后得人身复啮故主受戒之因果，以诫嫉妒诽谤道师之罪
  phases:
