  era: 东周春秋战国之际
  reign_ref: 周敬王前后印度列国时代
  archetype: 圣哲教主
  dilemmas:
  - 已成正觉众恶灭尽，犹有孙陀利诽谤头痛脊痛木枪马麦等余殃，是隐而不宣还是自说以化众
  - 往昔曾为净眼延如达吱越小儿医子力士造杀害诽谤业，今当以身偿还示现因果，还是以神通避之
  lesson: 因缘终不灭亦不著虚空，虽成三界将犹不免宿缘，当护身三口四意三
  summary_first_person: 吾为释迦种姓悉达多，成佛于阎浮提，愍众生不信因果，故于阿耨大泉集五百罗汉自说十种宿缘，示现诽谤病痛偿还余殃，令天龙人众护身口意，知善恶终归自受
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/小乘单译经/佛说兴起行经.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/小乘单译经/佛说兴起行经.md
