    highlight_event_id: guji-释迦牟尼-event-anou
  decisions:
  - date: -0484-07-15
    title_zh: 不以神通避谤而自说宿恶
    rationale: 欲示人宿缘不可逃避，化阿耨龙王及天龙八部，宁损名而全因果教化
  - date: -0484-07-15
    title_zh: 留木枪一对现偿人间
    rationale: 使众人亲见余殃现前，令未得道者谨慎防护三业
- id: guji-释迦牟尼-endeavor-2
  title_zh: 历劫造业成佛示现偿还余殃
  description: 往昔为净眼杀鹿相抂辟支佛，为延如达谤爱学，为小儿敲鱼头，为医子与非药，为力士折脊，今虽成佛犹受诽谤病痛
  phases:
  - key: brewing
    name: 往昔贪嗔造业
    labels:
