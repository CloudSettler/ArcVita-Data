  - key: breakthrough
    name: 劝布施为粮
    labels:
      zh: 施福随身
    start_date: -483-02-05
    highlight_event_id: guji-释迦牟尼佛-event-bushi
  - key: climax
    name: 明泥洹安隐
    labels:
      zh: 道合长寿
    start_date: -483-02-10
    highlight_event_id: guji-释迦牟尼佛-event-bushi
  - key: closure
    name: 化众离俗
    labels:
      zh: 一心精进
    start_date: -483-02-12
    highlight_event_id: guji-释迦牟尼佛-event-lisu
  decisions:
  - date: -483-02-05
    title_zh: 以布施为生死粮
    rationale: 未得道者守财不施临病亲属不能代痛故教能施者今世后世长得安隐福随身报如影随形
  - date: -483-02-10
    title_zh: 指归泥洹无为
    rationale: 世人但愿百千岁安乐自恣会当归死故说行道一日胜寿百年无阴盖者谓之泥洹常得安隐
