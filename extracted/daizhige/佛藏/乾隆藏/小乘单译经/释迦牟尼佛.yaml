    highlight_event_id: guji-释迦牟尼佛-event-sizi
  - key: climax
    name: 喻身不净
    labels:
      zh: 观身画瓶
    start_date: -483-01-15
    highlight_event_id: guji-释迦牟尼佛-event-sizi
  - key: closure
    name: 劝离俗精进
    labels:
      zh: 闻法作礼
    start_date: -483-01-20
    highlight_event_id: guji-释迦牟尼佛-event-lisu
  decisions:
  - date: -483-01-10
    title_zh: 直指四事自侵
    rationale: 世人不觉饥渴不惟九孔不净故先说夙夜不学淫财不施不受言四种过还害自身
  - date: -483-01-15
    title_zh: 广喻身空无常
    rationale: 众人迷于端正彩色庄严故以画瓶革囊幻化军征为喻令自省身如梦如电
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 开示布施持戒出生死入泥洹
  summary: 教人舍贪布施伏心修法奉道顺戒以出生死牢狱得泥洹长寿安隐
  phases:
  - key: brewing
    name: 破贪着亲
    labels:
      zh: 破亲族执
    start_date: -483-02-01
