events:
- id: guji-阿鸠留-event-birth
  title_zh: 生为富豪贾客执断见
  date: -0200-01-01
  year_of: -200
  place_zh: 本乡
  description_zh: 阿鸠留居处甚富金银珍宝奴婢众多而不信有后世谓人死地水火风各归本终不复生善恶心口身行皆弃捐
- id: guji-阿鸠留-event-desert
  title_zh: 荒泽遇薜荔得水食珍宝济众
  date: -0170-07-01
  year_of: -170
  place_zh: 无水草荒泽神树下
  description_zh: 与五百贾客行经剧道粮食水草尽三四日不得食遣骑求水见树叶青果繁树下人举手出香水美食饱五百人畜复出手出金银琉璃等珍宝各取如重并嘱归乡布施贫穷道人咒愿其早脱荒泽自说前世贫穷随喜人施指示乞食复手著迦叶佛塔言得福未曾斋饮酒故作豪薜荔手出众物
- id: guji-阿鸠留-event-generosity
  title_zh: 归乡恣人求索大设布施
  date: -0168-03-01
  year_of: -168
  place_zh: 本乡国中
  description_zh: 自念眼见后世善恶果报改邪归正告一国人欲得金银珍宝衣被饮食者皆来取之布施无央数日日饭八万四千道人澜汗流出门人用擿船而行作善极意
- id: guji-阿鸠留-event-death
  title_zh: 寿终上生第二忉利天
  date: -0150-01-01
  year_of: -150
  place_zh: 忉利天上
  description_zh: 以大布施功德死后上第二忉利天作天人去离天帝座四百八十里
- id: guji-阿鸠留-event-audience
  title_zh: 天上觐佛悟施田胜劣
  date: -0149-06-01
  year_of: -149
  place_zh: 忉利天佛为母说法处
  description_zh: 佛天上为母说经母及无数天得须陀洹道佛遥呼布施善人阿鸠留前礼白言我施大众不得圣道今见乞女以米粥施摩诃迦叶在帝释边第三座胜余天长寿端正安乐智慧威神五事小施圣田福乃尔自致豪贵作礼而去
