    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 戒经重宣布萨
    labels:
      zh:
      - 宣戒布萨
    start_date: '0703'
    highlight_event_id: guji-义净-event-translate
  - key: closure
    name: 示寂长安余范长存
    labels:
      zh:
      - 示寂存范
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0700'
    title_zh: 先译律藏以正僧制
    rationale: 感中土律学纷歧，欲以有部广律统一持犯轨范，故先译戒经及诸律
  - date: '0703'
    title_zh: 以直译存梵制原貌
    rationale: 律关持犯不可意饰，故守梵文次第直译，务令布萨诵戒如法可依
events:
- id: guji-义净-event-birth
  title_zh: 贞观九年诞生齐州
  type: birth
  date: '0635'
  year_of: 635
  description: 生于齐州，俗姓张，幼而聪慧，早岁出家
- id: guji-义净-event-departure
  title_zh: 咸亨二年广州泛海西行
  type: career
  date: '0671'
  year_of: 671
  description: 自广州乘舶南行，经室利佛逝停留学梵，继往印度求法
- id: guji-义净-event-study
  title_zh: 那烂陀寺研习有部律论
  type: career
  date: 0680
  year_of: 680
  description: 止那烂陀十余年，从胜光等师研习有部律毗奈耶及诸论
- id: guji-义净-event-return
  title_zh: 证圣元年负经归洛
  type: career
  date: 0695
  year_of: 695
  description: 携梵本四百余部东归，武后亲迎于洛阳，诏住翻经馆
- id: guji-义净-event-translate
  title_zh: 奉制译根本说一切有部戒经
  type: career
  date: '0700'
  year_of: 700
  description: 奉诏译出戒经一卷，明布萨仪轨四他胜十三僧残等，为有部律纲要
- id: guji-义净-event-death
  title_zh: 开元元年示寂长安
  type: death
  date: '0713'
  year_of: 713
  description: 示寂于长安，寿七十九，谥号鸿胪卿，所译律典百余卷行于世
