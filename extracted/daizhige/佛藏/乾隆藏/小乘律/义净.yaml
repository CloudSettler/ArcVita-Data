  - key: closure
    name: 携梵本踏归途
    labels:
      zh: 载典而还
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: 441
    title_zh: 决意浮海西行不循陆路
    rationale: 慕法显玄奘西行之志兼南海商舶便易故择海道以求速达天竺
  - date: 0680
    title_zh: 留驻那烂陀专攻有部律
    rationale: 见有部律范完备最能匡正僧团故专精研习兼采梵本以备归译
- id: guji-义净-endeavor-2
  title_zh: 奉制回国译律弘传
  summary: 归洛后奉诏于两京译出有部律典及经论五十余部以杂事四十卷为律丛要籍
  phases:
  - key: brewing
    name: 携梵本归洛受礼
    labels:
      zh: 载誉归国
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 洛阳长安开场译律
    labels:
      zh: 奉制开译
    start_date: 0699
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 杂事四十卷告成
    labels:
      zh: 律典大成
    start_date: 456
    highlight_event_id: guji-义净-event-translate
  - key: closure
    name: 弘律护僧示寂
    labels:
      zh: 功成示寂
    start_date: 458
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: 0699
    title_zh: 专译有部律典以正僧制
    rationale: 见中土律学未备有部广律未传故以全帙译出立清净规范
  - date: 456
    title_zh: 先成杂事以摄律余义
    rationale: 有部广律卷帙浩大杂事摄尽八门要义故先译以利持律受学
