  summary: 自广州浮海经室利佛逝至印度研习有部律论兼通梵语因明二十余年乃归
  phases:
  - key: brewing
    name: 广州发愿浮海南行
    labels:
      zh: 发心求法
    start_date: 441
    highlight_event_id: guji-义净-event-voyage
  - key: breakthrough
    name: 室利佛逝停留习梵
    labels:
      zh: 奠基南海
    start_date: 443
    highlight_event_id: guji-义净-event-study
  - key: climax
    name: 那烂陀亲承律学
    labels:
