    name: 负经东归洛阳
    labels:
      zh:
      - 负经东归
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: '0671'
    title_zh: 舍陆取海西行
    rationale: 慕玄奘西行之志，避陆路阻隔，乘商舶经南海直趋印度，以速求律本
  - date: 0680
    title_zh: 久住那烂陀专学有部
    rationale: 见有部律制完备，欲得全本以正中土律学，故专攻根本说一切有部律
- id: guji-义净-endeavor-2
  title_zh: 奉制译经弘有部律
  description: 武后中宗朝奉诏于洛阳长安译出根本说一切有部律典数十部，含此部戒经
  phases:
  - key: brewing
    name: 武后礼迎请译
    labels:
      zh:
      - 朝廷请译
    start_date: 0695
    highlight_event_id: guji-义净-event-return
