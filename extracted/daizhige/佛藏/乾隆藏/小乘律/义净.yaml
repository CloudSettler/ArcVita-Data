  archetype: 求法译经弘律僧
  dilemmas:
  - 西行海道险远而求法志坚何以抉择
  - 久客异域研习广律而乡国悬隔何以取舍
  - 奉制译经卷帙浩繁而晚年精力有限何以成业
  lesson: 以戒律为住持之本，以亲历见闻证信，以译述弘通利后世
  summary_first_person: 吾范阳义净，贞观九年生，咸亨二年自广州浮海西行，历室利佛逝末罗瑜至天竺那烂陀研习有部律学二十余年，证圣元年携梵本归洛，后奉制于两京译经律论五十余部，尤以根本说一切有部毗奈耶杂事四十卷为要，愿以律范匡正僧团，以译业报佛恩也
