events:
- id: guji-乔答摩仙-event-birth
  title_zh: 出生于补多罗城王家为耳生王长子
  date: -2500-01-01
  year_of: -2500
  description_zh: 耳生王有二子一名乔答摩一名波罗堕阇乔答摩为兄童子时即意乐修道常修梵行
- id: guji-乔答摩仙-event-renounce
  title_zh: 辞父王就黑色仙出家
  date: -2479-01-01
  year_of: -2479
  description_zh: 见父王非法为法惧堕地狱请得听许辞别眷属诣黑色仙所如法胡跪求出家以果子樹叶资养世号乔答摩仙
- id: guji-乔答摩仙-event-begging
  title_zh: 入补多罗城草舍乞食自活
  date: -2477-01-01
  year_of: -2477
  description_zh: 因恒食果子得病欲入聚落乞饮食奉师教守护六根往补多罗城闲林造草舍乞食自活
- id: guji-乔答摩仙-event-falsely-accused
  title_zh: 被诬杀淫女巡城掷尖木
  date: -2429-01-01
  year_of: -2429
  description_zh: 蜜捺罗杀淫女招贤以血刀置草屋前众人见刀捉仙缚至波罗堕阇王所不审即令坐尖木巡城自南门出掷之
- id: guji-乔答摩仙-event-leaving-seed
  title_zh: 实语感师变金色精血化卵生双子
  date: -2428-01-01
  year_of: -2428
  description_zh: 被伤告师心无损害发实语愿师黑颜变金色遂验身中两渧精血落地成卵得日暖生二童子游甘蔗园仙人收养立名暖生日种甘蔗种
- id: guji-乔答摩仙-event-death
  title_zh: 被日光炙舍命于草屋前
  date: -2420-01-01
  year_of: -2420
  description_zh: 乔答摩被日光炙遂命终变金色仙人明旦来看见其命过寻卵迹至甘蔗园得二童子知是体胤将还抚养长大
