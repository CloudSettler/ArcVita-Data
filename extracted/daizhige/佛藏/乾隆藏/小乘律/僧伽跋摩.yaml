  decisions:
  - date: '0434'
    title_zh: 应请开译摩得勒伽
    rationale: 见宋地律藏未备，欲以毗尼堤防水，遂依三藏例开译众事分
  - date: '0435'
    title_zh: 以问答体决罪相轻重
    rationale: 罪有作无作可见不可见差别幽微，非问答莫能决，故存优波离问佛答之体
- id: guji-僧伽跋摩-endeavor-2
  title_zh: 建康弘传毗尼教化僧团
  summary: 以所译律教授新学，决布萨羯磨出罪之式，令圣众和合
  phases:
