  decisions:
  - date: '0440'
    title_zh: 以百一羯磨摄一切羯磨教授
    rationale: 羯磨名相繁多，初学难持，故以白白二白四三法摄之，令作法成就不犯
  - date: '0442'
    title_zh: 严不共住种种不共住之防
    rationale: 破僧犯边等事关和合根本，须明受法与摈治之别，故勤为众说
