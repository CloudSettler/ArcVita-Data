endeavors:
- id: guji-大爱道比丘尼-endeavor-1
  title_zh: 三请出家创立比丘尼僧团
  summary_zh: 于迦维罗卫及那和河上三番求度，经阿难代请，顶受八敬法，得许为沙门，开女众出家之门。
  phases:
  - key: brewing
    name: 迦维罗卫初请被止
    labels:
      zh:
      - 出家请愿
    start_date: -0528
    highlight_event_id: guji-大爱道比丘尼-event-seek
  - key: breakthrough
    name: 追佛至那和再请
    labels:
      zh:
      - 追随不舍
    start_date: -0528
    highlight_event_id: guji-大爱道比丘尼-event-seek
  - key: climax
    name: 阿难代请佛制八敬
    labels:
      zh:
      - 八敬受持
    start_date: -0528
    highlight_event_id: guji-大爱道比丘尼-event-eight
  - key: closure
    name: 顶受八敬许入法律
    labels:
      zh:
      - 女众得度
    start_date: -0528
    highlight_event_id: guji-大爱道比丘尼-event-eight
  decisions:
  - date: -0528
    title_zh: 被拒后追佛至那和不舍求度
    rationale: 自念女人情态罪患，发大愿尽形寿求佛不懈，率诸老母弊衣跣足追随。
  - date: -0528
    title_zh: 以头顶受八敬法换取出家
    rationale: 譬如女得华香步瑶欢喜顶受，愿尽寿持八敬不踰越，以全佛法堤塘。
- id: guji-大爱道比丘尼-endeavor-2
  title_zh: 奉持十戒修证应真果
  summary_zh: 受十戒为沙弥尼三年无缺，复行十事具足，终受大具足戒，得天眼天耳神通，证阿罗汉，化导长老尼众。
  phases:
  - key: brewing
    name: 受十戒为沙弥尼
    labels:
      zh:
      - 持戒修学
    start_date: -0528
    highlight_event_id: guji-大爱道比丘尼-event-eight
  - key: breakthrough
    name: 三年奉持聪慧博览
    labels:
      zh:
      - 精进无缺
    start_date: '-0527'
    highlight_event_id: guji-大爱道比丘尼-event-practice
  - key: climax
    name: 受大具足戒证应真
    labels:
      zh:
      - 证果解脱
    start_date: '-0525'
    highlight_event_id: guji-大爱道比丘尼-event-full
  - key: closure
    name: 率长老尼众闻法弘化
    labels:
      zh:
      - 化导尼众
    start_date: '-0525'
    highlight_event_id: guji-大爱道比丘尼-event-full
  decisions:
  - date: '-0527'
    title_zh: 三年一心奉持十行无缺
    rationale: 常在佛左右检校奉持，心端如山，慈及蠕动，终无差特退转。
  - date: '-0525'
    title_zh: 更求大具足戒趣无上觉
    rationale: 自念人命无常恐不及佛时，愿受大戒令一切蒙度，遂更整衣绕佛求授。
events:
- id: guji-大爱道比丘尼-event-birth
  date: '-0600'
  year_of: -600
  title_zh: 生于释种为佛姨母
  description_zh: 为迦维罗卫释氏女，佛生七日生母亡，自育佛至于长大，有大恩德。
- id: guji-大爱道比丘尼-event-seek
  date: -0528
  year_of: -528
  title_zh: 迦维罗卫及途中三请出家
  description_zh: 闻女人精进可得沙门四道，于释氏精卢及国中三请被止，复追佛至那和河上，弊衣跣足泪下求度。
- id: guji-大爱道比丘尼-event-eight
  date: -0528
  year_of: -528
  title_zh: 受八敬法许为沙门
  description_zh: 阿难代请言养育之恩，佛制八敬防水如堤塘，大爱道以头顶受，佛授十戒为沙弥尼。
- id: guji-大爱道比丘尼-event-practice
  date: '-0527'
  year_of: -527
  title_zh: 行沙弥尼十事三年无缺
  description_zh: 奉持十戒及敬佛法僧事师十事，聪明智慧博览众经，瑞应百鸟侍之。
- id: guji-大爱道比丘尼-event-full
  date: '-0525'
  year_of: -525
  title_zh: 受大具足戒证阿罗汉
  description_zh: 绕佛十匝受大具足为比丘尼，眼彻视耳通听身能飞行，睹生死本际得应真道，与长老尼众同闻女人现世化男授决义。
- id: guji-大爱道比丘尼-event-death
  date: -0480
  year_of: -480
  title_zh: 入灭
  description_zh: 于佛世化导尼众后入灭，终全比丘尼开山之业。
