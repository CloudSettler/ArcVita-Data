  death_date: '-0470'
  era: 东周春秋末期
  reign_ref: 佛在舍卫国给孤独园时
  archetype: 弃邪归正的求道者
  dilemmas:
  - 久事三鬼神而财尽家病，是否舍弃旧祠改奉佛戒
  - 初闻五戒功德心生厌离，是否即受三归五戒十善
  - 赴舍卫途中亭宿见骸骨恐怖，是否退还安居还是坚持前行
  lesson: 宁守净戒得天神护佑，悔过从善得遇本师，终能消灾证道
  summary_first_person: 吾本为客舍主，久事三鬼神而家耗病多，遇舍卫持戒客见鬼神畏戒走避，遂诚心受三归五戒十善，立志往舍卫见佛，途中亭宿度啖人鬼妇，同还见佛，闻法出家得阿罗汉
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/小乘律/佛说戒消灾经.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/小乘律/佛说戒消灾经.md
