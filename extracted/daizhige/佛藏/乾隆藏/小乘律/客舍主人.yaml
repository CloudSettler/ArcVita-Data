  - date: '-0500'
    title_zh: 再宿亭舍不去
    rationale: 初见骸骨生恶意退还，淫意迷惑失护，然妇藏护得闻戒复信
  - date: -0499
    title_zh: 偕妇及众还见世尊
    rationale: 既蒙戒护得离啖人鬼，当以本师善友共解脱，故同行听经出家
