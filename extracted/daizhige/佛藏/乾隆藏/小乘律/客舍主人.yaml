      zh: 藏瓮闻鬼说五戒随受
    start_date: '-0500'
    highlight_event_id: guji-客舍主人-event-pavilion
  - key: closure
    name: 携众还佛出家证果
    labels:
      zh: 与妇及四百九十八人见佛得阿罗汉
    start_date: -0499
