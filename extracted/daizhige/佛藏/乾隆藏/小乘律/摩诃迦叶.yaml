  decisions:
  - date: -482
    title_zh: 集众结集经律论
    rationale: 恐都犯戒于法无得，须会众覆诵禁戒，安定度世道，令正法久住
  - date: -482
    title_zh: 以头陀行化众不求供养
    rationale: 鉴言是我所求供养者堕地狱，故捐弃身体不索万物，守空观净令众得度
events:
- id: guji-摩诃迦叶-event-birth
  title_zh: 降生摩揭陀国
  date: -552
  year_of: -552
  place_zh: 古印度摩揭陀国
  description_zh: 生于婆罗门家，少厌世荣，后出家从佛修头陀行，为十大弟子头陀第一
- id: guji-摩诃迦叶-event-1
  title_zh: 舍卫祇园闻佛说禁戒
  date: -500
  year_of: -500
  place_zh: 舍卫国祇树给孤独园
  description_zh: 佛告迦叶比丘有二事堕地狱镬汤泥犁，多欲积衣与白衣厚善见善生嫉等皆当远离，时千二百五十比丘菩萨万二千人同闻
- id: guji-摩诃迦叶-event-2
  title_zh: 悟四相沙门受无相戒
  date: -499
  year_of: -499
  place_zh: 舍卫国祇树给孤独园
  description_zh: 佛说四事为沙门，唯持戒行道不惜寿命者为真沙门，禁戒无形不著三界无常无我，闻者三万三千天人得须陀洹，八百沙门意解得度
- id: guji-摩诃迦叶-event-3
  title_zh: 王舍城主持第一次结集
  date: -482
  year_of: -482
  place_zh: 摩揭陀国王舍城
  description_zh: 佛灭后召集大比丘结集经律，覆诵禁戒无瑕秽法，以定心无著传持正法，安定度世道
- id: guji-摩诃迦叶-event-death
  title_zh: 鸡足山入灭
  date: -463
  year_of: -463
  place_zh: 摩揭陀国鸡足山
  description_zh: 以定心无所著嘱累正法，持衣钵待弥勒，不爱身形寿命，入灭于山中，传为持戒清净之表
