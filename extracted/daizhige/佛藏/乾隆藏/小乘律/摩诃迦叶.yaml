    labels:
      zh:
      - 选贤
      - 安居
    start_date: -0483-07-01
    highlight_event_id: guji-摩诃迦叶-event-jieji
  - key: climax
    name: 问律问经
    labels:
      zh:
      - 结集
      - 问难
    start_date: -0483-08-01
    highlight_event_id: guji-摩诃迦叶-event-jieji
  - key: closure
    name: 不舍微细
    labels:
      zh:
      - 守戒
      - 忏悔
    start_date: -0483-09-01
    highlight_event_id: guji-摩诃迦叶-event-weixijie
  decisions:
  - date: -0483-07-01
    title_zh: 简选五百阿罗汉共住安居集法
    rationale: 以集法事大非时日可竟须精持三藏共解脱者同住方能问难审定防无知杂说
  - date: -0483-09-01
    title_zh: 决议不舍微细戒令阿难忏六过
    rationale: 以防外道讥嫌法灭不久且微细难定易致渐舍故一心守持全受不放令众忏悔清净集法
events:
