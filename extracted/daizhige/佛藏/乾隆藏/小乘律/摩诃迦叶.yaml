  description: 八军围绕欲夺舍利因姓烟婆罗门唱忍法遂分舍利作八分并瓶炭为十塔流布供养
- id: guji-摩诃迦叶-event-jieji
  title_zh: 王舍城集五百结三藏
  date: -0483-08-01
  year_of: -483
  place_zh: 王舍城精舍
  description: 睹老比丘放逸语遂集五百阿罗汉问毗尼于优波离问修多罗阿毗昙于阿难一一展转印可唱言是法是律是佛教
- id: guji-摩诃迦叶-event-weixijie
