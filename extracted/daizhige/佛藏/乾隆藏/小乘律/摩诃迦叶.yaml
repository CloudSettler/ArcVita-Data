    highlight_event_id: guji-摩诃迦叶-event-fensheli
  decisions:
  - date: -0483-05-15
    title_zh: 止燃棺待礼全身
    rationale: 以报师恩示四众敬法故先礼后焚显正信威仪令众瞻礼得福
  - date: -0483-06-01
    title_zh: 赞成分舍利为八分
    rationale: 以佛修忍闻忍法不可为舍利兴兵当分作八分普令供养息诤长善
- id: guji-摩诃迦叶-endeavor-2
  title_zh: 王舍城集三藏定毗尼经法
  summary: 因老比丘放逸语及法非法倒说遂选五百阿罗汉安居王舍城问毗尼于优波离问修多罗阿毗昙于阿难结集三藏并诃阿难六过不舍微细戒
  phases:
  - key: brewing
