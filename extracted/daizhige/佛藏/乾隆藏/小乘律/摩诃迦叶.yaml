  - date: -500
    title_zh: 不效承名谄谀沙门
    rationale: 佛喻贫人称富，知有沙门名而不行沙门法者不应学，当求真沙门守空行道
  - date: -499
    title_zh: 直守无瑕禁戒不著三界
    rationale: 禁戒无形无吾我无人命，不爱身形寿命，不乐五道，晓入佛道方为持戒
