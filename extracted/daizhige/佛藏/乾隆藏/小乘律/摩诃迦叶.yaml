  date: -0483-09-01
  year_of: -483
  place_zh: 王舍城
  description: 以阿难不问微细不请久住等六事令僧中悔过并集议不放舍微细戒防外道讥嫌守持全戒
- id: guji-摩诃迦叶-event-death
  title_zh: 鸡足山入灭付嘱未来
  date: '-0463'
  year_of: -463
  place_zh: 鸡足山
  description: 集法已竟住持正法年高持衣钵入鸡足山禅定待弥勒以续慧命
