  dilemmas:
  - 持小乘十戒为本而常志大乘之两全
  - 厌离秽身不贪女身而慈愍群生如父母念子之平衡
  - 依止和上依众共住而不违经戒独修空义之节度
  lesson: 十戒为本则五百戒自然具足慈悲空慧并行可趣解脱度脱八难
  summary_first_person: 吾初为沙弥尼依和上受十戒不杀不盗不淫不妄语不饮酒不饰香华不卧高床不习歌舞不积珍宝过午不食尊三宝敬和上过于父母依众共住不独行常思禅定空无相愿志于大乘愿以戒为香以慧为饰度脱众生
