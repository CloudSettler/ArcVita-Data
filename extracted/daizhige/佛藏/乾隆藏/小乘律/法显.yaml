  summary_first_person: 吾平阳法显也以中土律藏阙略与慧景等西行求戒历流沙葱岭天竺三十余国得摩诃僧祇律梵本海路东归建康与觉贤共译僧祇律及比丘尼波罗提木叉但愿老死至近佛法不灭僧一心精进
