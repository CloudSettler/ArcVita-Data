  dilemmas:
  - 梵本阙略而中土律议纷纭时如何立明了决判
  - 侯景丧乱流寓岭南时是全身归国还是冒险存法传译
  lesson: 以护戒摄心为本，以决判明了为用，方能令毗尼久住而不看他面
  summary_first_person: 我本西天竺优禅尼国人，泛海入梁值侯景之乱，流寓南海虽颠沛不废传译，译律二十二明了论以明护戒罪聚布萨之義，愿以福河法水洗除破戒之垢
  source_urls:
