  decisions:
  - date: '-485'
    title_zh: 当众发问行法与不行法
    rationale: 令天人八部辨僧俗邪正，知持法传法皆名僧，行非法即非弟子故
  - date: '-485'
    title_zh: 请问戒律开闭随时之义
    rationale: 开闭似异实为利行随时而制，须明此时行此彼时行彼以免后世迷惑故
