  lesson: 善问方能发扬正法，多闻择善方名智慧，依法行正不随邪谄方得解脱
  summary_first_person: 我是舍利弗，生于摩揭陀那罗陀村婆罗门家，早年游学求解脱不得要领，后遇马胜比丘闻诸法因缘生偈即得法眼净，便与目连携众归投世尊，精进证阿罗汉果，忝居声闻智慧第一，常以问法决疑饶益天人，愿后学守正念远邪师
