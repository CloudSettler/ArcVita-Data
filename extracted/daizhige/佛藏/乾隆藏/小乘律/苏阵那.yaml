endeavors:
- id: guji-苏阵那-endeavor-1
  title_zh: 舍家出家游行劝供
  summary: 归依受五戒后舍亲出家，离亲游行，劝亲族供养僧田，住阿兰若修杜多行。
  phases:
  - key: brewing
    name: 归信受戒出家
    labels:
      zh:
      - 归依三宝
      - 舍家出家
    start_date: -334
    highlight_event_id: guji-苏阵那-event-ordination
  - key: breakthrough
    name: 离亲游行劝化
    labels:
      zh:
      - 头陀行
      - 劝供修福
    start_date: -333
    highlight_event_id: guji-苏阵那-event-ordination
  decisions:
  - date: -334
    title_zh: 舍亲属游行他方
    rationale: 不欲与亲族杂住而障道，愿证未证得未得故离亲游行。
  - date: -333
    title_zh: 归故村劝设众供
    rationale: 逢饥馑乞食难得，念亲族富足可设常施粥食以兴福业。
- id: guji-苏阵那-endeavor-2
  title_zh: 留种犯戒发露成制
  summary: 因母劝留种见少年妇生染着行不净，子种子后证罗汉，自闻法追悔发露，佛制不净行波罗市迦。
  phases:
  - key: climax
    name: 屏处犯不净行
    labels:
      zh:
      - 染着破戒
      - 留种得子
    start_date: -333
    highlight_event_id: guji-苏阵那-event-offense
  - key: closure
    name: 闻法追悔发露
    labels:
      zh:
      - 发露忏悔
      - 制戒缘起
    start_date: -333
    highlight_event_id: guji-苏阵那-event-confession
  decisions:
  - date: -333
    title_zh: 从母言留种行淫
    rationale: 未制戒不见欲过，兼为不断家嗣官没财物故随顺母劝。
  - date: -333
    title_zh: 于众中发露不覆藏
    rationale: 闻佛说离贪解脱法心怀愁恼，问即具实陈说不隐瞒。
events:
- id: guji-苏阵那-event-birth
  date: -344
  year_of: -530
  title_zh: 生于羯阑铎迦村长者家
  description: 佛栗氏国羯阑铎迦村长者子，家资巨富如毗沙门，同类娶妻欢乐而住。
- id: guji-苏阵那-event-ordination
  date: -334
  year_of: -516
  title_zh: 归信出家游行乞食
  description: 归依三宝受五学处，正信舍家剃发披法服，舍亲游行，值饥馑还故村住阿兰若修杜多行。
- id: guji-苏阵那-event-offense
  date: -333
  year_of: -515
  title_zh: 母劝留种行不净行
  description: 母携新妇至房劝留种子，睹少年妇染着，屏处再三行不净，妇怀娠生子名种子，后出家证阿罗汉。
- id: guji-苏阵那-event-confession
  date: -333
  year_of: -515
  title_zh: 闻法追悔发露制戒
  description: 于大众中闻离贪慧解脱法追悔伏面，告诸苾刍发露，佛呵责集众以十利制不净行波罗市迦不应共住。
- id: guji-苏阵那-event-death
  date: -312
  year_of: -470
  title_zh: 卒年月无考
  description: 犯波罗市迦后行迹无别载，卒年无考附系同时代苾刍寿终。
