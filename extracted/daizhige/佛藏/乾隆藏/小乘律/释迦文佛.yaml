  dilemmas:
  - 一切智说与众生不能尽受，如何普说又能契机
  - 共法与不共法之分，二乘知说不尽如何显佛殊胜
  - 制戒轻重开遮之难，如何摄僧续法又不违慈悲
  lesson: 以无边智知无边法，以慈悲力乐为他说，制戒摄僧，说法化世，令三乘道果相续不断
  summary_first_person: 我自觉觉他，觉了一切法相，随物适时而说，或制戒以摄僧，或说法以化世，愿长眠三界者皆得觉悟安稳
