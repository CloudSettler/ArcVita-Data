  decisions:
  - date: '-523'
    title_zh: 毗耶离随事制戒
    rationale: 屋中聚落白衣边有事皆须出外在众结，独佛能制故以佛在初
  - date: '-520'
    title_zh: 先授三归后说戒相
    rationale: 三归不满不救如提婆达多，受三归竟即得五戒，具戒则须白四羯磨方得
- id: guji-释迦文佛-endeavor-2
  title_zh: 随机说法分判四藏
  summary: 随物适时说一切法，后弟子以类撰之，分律藏阿毗昙增一中杂长阿含及八万法藏，普被天人利钝
  phases:
  - key: brewing
