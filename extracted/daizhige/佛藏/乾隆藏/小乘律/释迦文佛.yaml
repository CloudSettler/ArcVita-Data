      - 禅定
    start_date: '-515'
    highlight_event_id: guji-释迦文佛-event-sermon
  - key: closure
    name: 阿难结集我闻
    labels:
      zh:
      - 结集
      - 传持
    start_date: '-483'
    highlight_event_id: guji-释迦文佛-event-death
  decisions:
  - date: '-527'
    title_zh: 以类撰集分别五藏
    rationale: 利根说深义为中阿含，坐禅说随禅为杂阿含，破外道为长阿含，劝化为增一
  - date: '-515'
    title_zh: 说八万法藏对八万尘劳
    rationale: 一坐为一藏，半月说戒为一藏，法药对治众生烦恼故开无量门
