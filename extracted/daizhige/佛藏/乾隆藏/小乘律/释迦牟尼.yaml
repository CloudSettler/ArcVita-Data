  dilemmas:
  - 见众生执色受想行识为我当以无常无我破常见我执
  - 外道事火贪味与解脱相违当先以神通决疑再以法义摄心
  - 初化王舍当先度国王大臣还是摄受外道徒众以广僧团
  lesson: 见十二因缘生灭即见法见法即见佛离我执方得解脱
  summary_first_person: 吾为释种瞿昙舍有为而出家得正觉住摩竭陀灵刹山竹林以十二因缘四圣谛教化频婆娑罗及优波底沙古利多等令得法眼净入解脱道
