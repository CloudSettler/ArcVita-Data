  goal: 以十二因缘无我法破计我之病令王及婆罗门居士得法眼净
  phases:
  - key: brewing
    name: 安住灵刹摄迦叶众
    labels:
      zh: 蓄势安住
    start_date: '-0535'
    highlight_event_id: guji-释迦牟尼-event-1
  - key: breakthrough
    name: 迦叶现通决众疑网
    labels:
      zh: 决疑立信
    start_date: '-0534'
    highlight_event_id: guji-释迦牟尼-event-1
  - key: climax
    name: 开示五蕴皆非常无我
    labels:
      zh: 法义高潮
    start_date: '-0534'
    highlight_event_id: guji-释迦牟尼-event-2
  - key: closure
    name: 受频婆娑罗请入竹林
    labels:
      zh: 安居受请
    start_date: '-0534'
    highlight_event_id: guji-释迦牟尼-event-2
  decisions:
  - date: '-0534'
    title_zh: 令迦叶现神通自明师弟之分
    rationale: 婆罗门疑谁师谁弟先以神变决疑后说法方能入心
  - date: '-0534'
    title_zh: 为王众说色受想行识无常无我
    rationale: 直指计我之病以生灭相应观破我所方开解脱
- id: guji-释迦牟尼-endeavor-2
  title_zh: 王舍城传偈摄受优波底沙古利多
  goal: 以因缘生灭要偈辗转度化外道徒众令五百弟子归佛修梵行
  phases:
  - key: brewing
    name: 命阿说耆入城乞食现威仪
    labels:
      zh: 威仪摄化
    start_date: '-0533'
    highlight_event_id: guji-释迦牟尼-event-3
  - key: breakthrough
    name: 说因缘偈令优波底沙得法眼
    labels:
      zh: 一偈破惑
    start_date: '-0533'
    highlight_event_id: guji-释迦牟尼-event-3
  - key: climax
    name: 转授古利多并率五百众归依
    labels:
      zh: 辗转度脱
    start_date: '-0533'
    highlight_event_id: guji-释迦牟尼-event-3
  - key: closure
    name: 竹林纳受新众修梵行
    labels:
      zh: 僧团增广
    start_date: '-0533'
    highlight_event_id: guji-释迦牟尼-event-3
  decisions:
  - date: '-0533'
    title_zh: 令幼学阿说耆略说少义不尚文字
    rationale: 唯须义味一偈足证缘起避免广说失机
  - date: '-0533'
    title_zh: 许优波底沙古利多携眷属同出家
    rationale: 师徒相依一门同化则僧团速增正法久住
