  dilemmas:
  - 立假名补特伽罗而破常见断见之两难
  - 以依说度说灭说会通轮转受生与涅槃不动之两难
  lesson: 假名立我不断因果不堕邪见方能显发中道正见
  summary_first_person: 吾观诸部于无我有我互诤生疑，乃依经立依说度说灭说三种假名补特伽罗，以五蕴和合非即非离不断三宝四谛因果，欲令众生离断常二见得入中道。
