endeavors:
- id: guji-三弥底部论-endeavor-1
  title_zh: 集正量部义立补特伽罗正见
  summary: 会通诸部无我有我不可说等诤论，立五蕴假名补特伽罗非即非离非断非常
  phases:
  - key: brewing
    name: 酝酿观诤
    labels:
      zh: 无我有我互相违
    start_date: '0300-01-01'
    highlight_event_id: guji-三弥底部论-event-debate
  - key: breakthrough
    name: 突破立宗
    labels:
      zh: 假名有我依蕴而立
    start_date: '0320-01-01'
    highlight_event_id: guji-三弥底部论-event-compose
  - key: climax
    name: 高潮破立
    labels:
      zh: 破斥即蕴离蕴常见断见
    start_date: '0330-01-01'
    highlight_event_id: guji-三弥底部论-event-compose
  - key: closure
    name: 收束成论
    labels:
      zh: 三卷论义次第成立
    start_date: '0340-01-01'
    highlight_event_id: guji-三弥底部论-event-compose
  decisions:
  - date: '0320-01-01'
    title_zh: 判三种假名以答舍此受彼之问
    rationale: 若言都无我则堕邪见坏三宝四谛业果，故依经立依说度说灭说以显假名有人
  - date: '0330-01-01'
    title_zh: 遣即蕴离蕴常无常诸执
    rationale: 即蕴则堕无常断灭，离蕴则堕常见神我，故说非即非离不可定执常无常
- id: guji-三弥底部论-endeavor-2
  title_zh: 弘传中土附载三秦录
  summary: 三卷论本西来中土传译，失译人名今附后秦录而得流传大藏
  phases:
  - key: brewing
    name: 酝酿西来
    labels:
      zh: 正量部义传入河西
    start_date: '0385-01-01'
    highlight_event_id: guji-三弥底部论-event-translate
  - key: breakthrough
    name: 突破译成
    labels:
      zh: 三卷译定小乘论部
    start_date: '0395-01-01'
    highlight_event_id: guji-三弥底部论-event-translate
  - key: climax
    name: 高潮附录
    labels:
      zh: 失译附于三秦录
    start_date: '0405-01-01'
    highlight_event_id: guji-三弥底部论-event-translate
  - key: closure
    name: 收束入藏
    labels:
      zh: 乾隆藏收为小乘论
    start_date: '0412-01-01'
    highlight_event_id: guji-三弥底部论-event-translate
  decisions:
  - date: '0395-01-01'
    title_zh: 以三卷体例分上下中传译
    rationale: 卷上明中有受生及我诤本源，卷中广破立，卷下明三说人，故依此次第译传不乱宗旨
  - date: '0405-01-01'
    title_zh: 存失译本不没其说
    rationale: 虽译人名氏佚而不敢弃其正义，故附三秦录以传后学存其假名我义
