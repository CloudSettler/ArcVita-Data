  date: -0080-01-01
  year_of: -80
  place_zh: 罽宾论场
  description_zh: 顶礼三宝为首，立一切有漏行离我乐常净，说取荫界入十八界善恶有对分别，立自性摄一切法
- id: guji-法胜-event-xingpin
  person_id: guji-法胜
  title_zh: 造行品第二明心心数法
  date: -0075-01-01
  year_of: -75
  place_zh: 罽宾论场
  description_zh: 明心与十大地常相应，善大地十法，不善二十一聚，无记十二，及初禅至有顶觉观分别，兼说色微尘四根十种
- id: guji-法胜-event-complete
  person_id: guji-法胜
  title_zh: 六卷阿毗昙心论成就
  date: -0070-01-01
  year_of: -70
  place_zh: 罽宾
  description_zh: 界行智业等品具足，离广略而成心要，后为优波扇多释解，高齐那连提耶舍译为汉文六卷流通
- id: guji-法胜-event-death
  person_id: guji-法胜
  title_zh: 示寂
  date: -0020-01-01
  year_of: -20
  place_zh: 罽宾
  description_zh: 法胜示寂，心论付嘱弟子，后世奉为阿毗昙心宗要，注疏传译不绝
