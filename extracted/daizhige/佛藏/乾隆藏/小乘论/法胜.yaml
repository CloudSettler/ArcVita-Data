  death_date: -0020-01-01
  era: 西汉中晚期
  reign_ref: 汉宣帝汉元帝之际
  archetype: 摄经造论型论师
  dilemmas:
  - title_zh: 广略之难
    description_zh: 古昔论师释阿毗昙心或太广或太略，未学者迷惑烦劳无由能取，当离广略以光显修多罗自性
  - title_zh: 颠倒与不颠倒
    description_zh: 一切有漏行离我乐常净而世间颠倒见我乐常净，当先说颠倒方能令弟子觉悟不颠倒真实法相
  lesson: 离广略二边，摄法归心，先破颠倒方显真实，令学者离过生德得第一义利
  summary_first_person: 吾法胜，见古释或广或略学者难取，故造阿毗昙心六卷，先明界品有漏无漏取荫诸相，次明行品心心数生灭相应，破四颠倒，显无我苦空无常，愿弟子觉悟真实
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E8%AE%BA/%E6%B3%95%E8%83%9C%E9%98%BF%E6%AF%97%E6%98%99%E5%BF%83%E8%AE%BA.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E8%AE%BA/%E6%B3%95%E8%83%9C%E9%98%BF%E6%AF%97%E6%98%99%E5%BF%83%E8%AE%BA.html
endeavors:
- id: guji-法胜-endeavor-1
  person_id: guji-法胜
  title_zh: 造阿毗昙心摄拢界品法相
  summary_zh: 立三宝吉首，辨有漏无漏取荫界入，以自性摄一切法，开后五品之纲
  phases:
  - key: brewing
    name: 观察广略之弊
    labels:
      zh: 发心离广略
    start_date: -0085-01-01
    highlight_event_id: guji-法胜-event-jiepin
  - key: breakthrough
    name: 界品立宗
    labels:
      zh: 有漏无漏分别
    start_date: -0080-01-01
    highlight_event_id: guji-法胜-event-jiepin
  - key: climax
    name: 荫界入分别成就
    labels:
      zh: 自性摄法
    start_date: -0078-01-01
    highlight_event_id: guji-法胜-event-jiepin
  - key: closure
    name: 界品竟传授弟子
    labels:
      zh: 界品授学
    start_date: -0076-01-01
    highlight_event_id: guji-法胜-event-complete
  decisions:
  - date: -0080-01-01
    title_zh: 以三宝功德为吉首
    rationale: 诸师造论以吉为初，三宝最胜，故先顶礼最胜离热饶益言及罗汉见实等以显自利利他满足
  - date: -0079-01-01
    title_zh: 先说颠倒后显不颠倒
    rationale: 欲令弟子解真实，以不颠倒心安隐易解，故论初先说一切有漏行离我乐常净及四颠倒缘由
  - date: -0078-01-01
    title_zh: 立自性摄一切法
    rationale: 诸法离他性各自住己性，若他性摄则一生灭一切生灭不合道理，故立自性摄以定生及分齐
- id: guji-法胜-endeavor-2
  person_id: guji-法胜
  title_zh: 说行品心心数及弘传心要
  summary_zh: 明色心心数不相应行四种生缘，开智业品断惑方便，遗法远被后世释译
  phases:
  - key: brewing
    name: 分别伴侣生缘
    labels:
      zh: 心俱生观察
    start_date: -0075-01-01
    highlight_event_id: guji-法胜-event-xingpin
  - key: breakthrough
    name: 大地善恶聚分别
    labels:
      zh: 心数法次第
    start_date: -0073-01-01
    highlight_event_id: guji-法胜-event-xingpin
  - key: climax
    name: 色微尘及四相分别
    labels:
      zh: 色与不相应行
    start_date: -0071-01-01
    highlight_event_id: guji-法胜-event-complete
  - key: closure
    name: 六卷成就遗法后世
    labels:
      zh: 心论流通
    start_date: -0070-01-01
    highlight_event_id: guji-法胜-event-complete
  decisions:
  - date: -0074-01-01
    title_zh: 立彼此力生破自力生
    rationale: 有为诸行自性羸劣初无一能生，离伴侣故不自生，故立作取作依作增上作伴四种生以明心心数俱生
  - date: -0072-01-01
    title_zh: 开五聚心数以摄善恶无记
    rationale: 欲界具不善不共善隐没无记等五聚，色无色除不善，故细分数十二至二十三心数令学者识相应不相应
  - date: -0070-01-01
    title_zh: 以略摄广付嘱流通
    rationale: 已 광显修多罗自性不复广演，留六卷心要令后人优波扇多释解及汉地那连提耶舍传译，利益弟子无尽
