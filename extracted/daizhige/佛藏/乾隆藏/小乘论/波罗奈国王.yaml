endeavors:
- id: guji-波罗奈国王-endeavor-1
  title_zh: 嗣位理政与厌离王务付国
  summary: 幼龄承位体性贤善，厌王务刑戮如栴陀罗业，以国付言说辅相嘱以正法治民
  phases:
  - key: brewing
    name: 王宫厌患修禅思
    labels:
      zh: 厌离华堂如冢间
    start_date: -0592
    highlight_event_id: guji-波罗奈国王-event-enthronement
  - key: climax
    name: 付国辅相弃王务
    labels:
      zh: 畏刑戮付国守戒
    start_date: -0585
    highlight_event_id: guji-波罗奈国王-event-entrust
  decisions:
  - date: -0585
    title_zh: 付国大臣不亲刑戮
    rationale: 食衣卧具少欲知足，王位唯教令可行，刑戮挝罚必堕恶业，故付国令以正法抚育不违常限
- id: guji-波罗奈国王-endeavor-2
  title_zh: 见非法杀生厌证辟支佛
  summary: 辅相宽纵无度夺财侵妃，旧臣擒斩之，王见杀生厌即忆宿因证辟支佛飞空雪山
  phases:
  - key: breakthrough
    name: 见斩辅相生厌恶
    labels:
      zh: 睹杀悟无常生死
    start_date: -0583
    highlight_event_id: guji-波罗奈国王-event-enlightenment
  - key: closure
    name: 飞空雪山示独行
    labels:
      zh: 须发自落受天衣
    start_date: -0583
    highlight_event_id: guji-波罗奈国王-event-nirvana
  decisions:
  - date: -0583
    title_zh: 赦罪不杀生慈矜
    rationale: 一切爱寿不见害命得安乐，虽罪重当生哀矜，自守不杀法以全持戒果报
events:
- id: guji-波罗奈国王-event-birth
  title_zh: 降生波罗奈梵摩达王宫
  date: '-0600'
  year_of: -600
  place_zh: 迦尸国波罗奈城王宫
  description: 前身迦叶佛时比丘发犀一角独行愿，天乐享尽入第一夫人胎，母娠赦天下开库赈贫，生太子端正如满月
- id: guji-波罗奈国王-event-enthronement
  title_zh: 八岁嗣位为正法王
  date: -0592
  year_of: -592
  place_zh: 波罗奈城
  description: 父王崩国人爱乐如满月，辅相言说立太子为王，本愿力故不作众恶，深悲愍众生处宫求闲静
- id: guji-波罗奈国王-event-entrust
  title_zh: 以国付辅相专行道行
  date: -0585
  year_of: -585
  place_zh: 波罗奈王宫
  description: 拒大臣理民之谏，言治国尘心须刑戮即是栴陀罗，嘱辅相畏后世正法治国而弃王务
- id: guji-波罗奈国王-event-enlightenment
  title_zh: 见杀辅相悟辟支佛道
  date: -0583
  year_of: -583
  place_zh: 波罗奈王宫前
  description: 辅相夺财妻掠王妃叛逃被擒，旧臣王前拔剑斩之，王说愚痴为小乐受惭耻偈，见境忆过去修忍心开解踊身虚空说璎珞梵行偈
- id: guji-波罗奈国王-event-nirvana
  title_zh: 飞至雪山共集入涅槃
  date: '-0530'
  year_of: -530
  place_zh: 雪山辟支佛众中
  description: 须发自落净居天奉袈裟，飞空诣雪山答众问以示忍辱不亲近因缘，佛于三十三天善法堂说其因缘令天生厌
