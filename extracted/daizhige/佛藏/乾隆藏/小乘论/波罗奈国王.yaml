  lesson: 宁舍王位秽身终不舍戒法身，远离愦闹如犀一角独行乃证觉
  summary_first_person: 我于迦叶佛时出家十千岁持戒修忍，因亲近徒众愦闹未得道果，发愿如犀一角独行，天上受乐后生波罗奈为太子，八岁嗣位，厌刑戮付国辅相，见杀生厌恶悟辟支佛道，飞升雪山。
