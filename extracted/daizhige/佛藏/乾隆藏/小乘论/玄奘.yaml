endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法取经
  summary: 贞观三年私出长安，经西域入印度那烂陀就戒贤学瑜伽唯识，游学五印十七年携经归国。
  phases:
  - key: brewing
    name: 长安究学起疑
    labels:
      zh:
      - 究学起疑
    start_date: '0615'
    highlight_event_id: guji-玄奘-event-study
  - key: breakthrough
    name: 决意偷出西行
    labels:
      zh:
      - 西行发愿
    start_date: 0629
    highlight_event_id: guji-玄奘-event-west-departure
  - key: climax
    name: 那烂陀受学问道
    labels:
      zh:
      - 取经受学
    start_date: '0633'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: closure
    name: 负经东归长安
    labels:
      zh:
      - 归国弘法
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-return
  decisions:
  - date: 0629
    title_zh: 贞观三年私行西域
    rationale: 为决诸师异执求取正本，宁违禁令就死，不退求法本愿
  - date: '0633'
    title_zh: 就戒贤学瑜伽师地论
    rationale: 印度唯戒贤得正传，为穷唯识对法根本，留那烂陀五年精究
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经传灯
  summary: 归国后奉太宗高宗诏住弘福慈恩玉华，组织译场译出大小乘经论七十五部，晚年译入阿毗达磨论等对法要籍。
  phases:
  - key: brewing
    name: 弘福开馆立制
    labels:
      zh:
      - 译场肇始
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-return
  - key: breakthrough
    name: 慈恩系统译述
    labels:
      zh:
      - 大乘译述
    start_date: 0648
    highlight_event_id: guji-玄奘-event-translation
  - key: climax
    name: 奉诏译入阿毗达磨
    labels:
      zh:
      - 对法译弘
    start_date: 0659
    highlight_event_id: guji-玄奘-event-translate-ruabhidharma
  - key: closure
    name: 玉华示寂遗嘱
    labels:
      zh:
      - 示寂流通
    start_date: '0664'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645'
    title_zh: 受诏专心翻译不就宰相
    rationale: 以译经为报国利生正业，不以荣禄易传灯大义
  - date: 0659
    title_zh: 译塞建陀罗入阿毗达磨论
    rationale: 悯劣慧畏名义稠林，欲令易入法相海，故译此二卷摄八句义
events:
- id: guji-玄奘-event-birth
  type: birth
  date: '0602'
  year_of: 602
  title_zh: 出生洛州缑氏陈氏
  description: 隋仁寿二年生于洛州缑氏，幼聪慧慕佛法，后从兄长捷法师出家洛阳净土寺。
- id: guji-玄奘-event-study
  type: career
  date: '0615'
  year_of: 615
  title_zh: 长安蜀地究摄论地持
  description: 大业末避乱蜀成都，受具听摄论涅槃，后至长安究俱舍毗昙，见诸师异说，疑不能决。
- id: guji-玄奘-event-west-departure
  type: career
  date: '0629-08-04'
  precision: day
  year_of: 629
  title_zh: 贞观三年私出长安西行
  description: 唐太宗贞观三年秋，结侣私出玉门，经高昌龟兹凌山，独行大漠往印度求法。
- id: guji-玄奘-event-nalanda
  type: career
  date: '0633'
  year_of: 633
  title_zh: 至那烂陀就戒贤受学
  description: 到中印度那烂陀寺，礼百岁戒贤为师，学瑜伽师地论及诸对法，兼通五明，声誉五印。
- id: guji-玄奘-event-return
  type: career
  date: '0645-01-24'
  precision: day
  year_of: 645
  title_zh: 贞观十九年携经还长安
  description: 贞观十九年正月还至长安，携梵本六百余部，太宗亲迎弘福寺，诏住弘福组织译经。
- id: guji-玄奘-event-translation
  type: career
  date: 0648
  year_of: 648
  title_zh: 慈恩弘福系统译经
  description: 住弘福慈恩大慈恩寺立译场，译瑜伽师地论大般若等，兼撰大唐西域记十二卷进上。
- id: guji-玄奘-event-translate-ruabhidharma
  type: career
  date: 0659
  year_of: 659
  title_zh: 奉诏译塞建陀罗入阿毗达磨论
  description: 显庆年间奉诏译塞建陀罗阿罗汉所造入阿毗达磨论二卷，摄色受想行等八句义，令初学易入法相海。
- id: guji-玄奘-event-death
  type: death
  date: '0664-02-05'
  precision: day
  year_of: 664
  title_zh: 麟德元年示寂玉华宫
  description: 唐高宗麟德元年正月五日，译经力疾，趺坐而终於长安玉华宫，葬白鹿原，谥大遍觉。
