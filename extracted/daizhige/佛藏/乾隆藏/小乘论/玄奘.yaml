endeavors:
- id: guji-玄奘-endeavor-1
  person_qid: guji-玄奘
  title_zh: 西域求法取经
  summary_zh: 贞观初年偷渡玉门，遍历西域诸国，至那烂陀从戒贤学瑜伽，游历五天竺，得经论六百余部而归
  phases:
  - key: brewing
    name: 长安发愿讲习积因
    labels:
      zh: 发愿
    start_date: 0620-01-01
    highlight_event_id: guji-玄奘-event-1
  - key: breakthrough
    name: 偷渡流沙抵达天竺
    labels:
      zh: 突破
    start_date: 0629-08-01
    highlight_event_id: guji-玄奘-event-1
  - key: climax
    name: 那烂陀受学问道
    labels:
      zh: 高峰
    start_date: 0631-01-01
    highlight_event_id: guji-玄奘-event-2
  - key: closure
    name: 负经东归抵达长安
    labels:
      zh: 收束
    start_date: 0645-01-01
    highlight_event_id: guji-玄奘-event-2
  decisions:
  - date: 0629-08-01
    title_zh: 冒禁偷渡出关
    rationale: 为求真义了生死，不顾禁令与性命，效法者当以法重于身
  - date: 0631-02-01
    title_zh: 师事戒贤专学瑜伽
    rationale: 唯识大义非亲师难解，遂留那烂陀五年，穷究瑜伽师地诸论
- id: guji-玄奘-endeavor-2
  person_qid: guji-玄奘
  title_zh: 归国译经弘化
  summary_zh: 归长安奉诏住弘福大慈恩寺，设译场译出大般若瑜伽师地法蕴足论等七十余部，以五戒学处化导在家出家
  phases:
  - key: brewing
    name: 弘福开场订立规程
    labels:
      zh: 筹备
    start_date: 0645-02-01
    highlight_event_id: guji-玄奘-event-2
  - key: breakthrough
    name: 大慈恩专译大论
    labels:
      zh: 展开
    start_date: 0648-01-01
    highlight_event_id: guji-玄奘-event-3
  - key: climax
    name: 奉诏译法蕴足论明学处
    labels:
      zh: 高峰
    start_date: 0660-01-01
    highlight_event_id: guji-玄奘-event-3
  - key: closure
    name: 玉华示寂译业告成
    labels:
      zh: 圆寂
    start_date: 0664-01-01
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: 0645-02-15
    title_zh: 受诏专任翻译不赴讲席
    rationale: 翻译为慧命所系，一字之讹误后学，宁舍名闻专心译述
  - date: 0660-06-01
    title_zh: 译出法蕴足论学处品
    rationale: 在家持戒为解脱之基，须明五戒十善自利利他之分，以正邬波索迦之行
