  era: 唐
  reign_ref: 唐太宗贞观至高宗麟德
  archetype: 西行求法译经高僧
  dilemmas:
  - title_zh: 守缺疑义或犯险西行
    description: 中土经论传译多阙义理分歧，安坐讲习可保安稳，西行万里九死一生，抉择守成还是求真
  - title_zh: 山林自了或奉诏利生
    description: 取经归来名震四方，可入山修定自求解脱，然帝命译经众生意切，抉择独善还是兼济
  lesson: 发心贵诚，见地贵真，译经贵信，利他方能自立
  summary_first_person: 吾幼丧亲，依兄出家，慨然伤传译之讹，誓西行以求真，历十七载寒暑，五事毗婆沙等六百余卷皆吾奉诏所译，愿后学依略文而悟自共相，离恶见而登觉岸
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E8%AE%BA/%E4%BA%94%E4%BA%8B%E6%AF%97%E5%A9%86%E6%B2%99%E8%AE%BA.html
endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法十七年
  summary: 贞观初年偷出玉门，历西域天竺，就戒贤学瑜伽，游学辩经而归
  phases:
  - key: brewing
    name: 立志偷西出关
    labels:
      zh: 启程
    start_date: 0629
    highlight_event_id: guji-玄奘-event-xixing
  - key: breakthrough
    name: 那烂陀师事戒贤
    labels:
      zh: 学成
    start_date: '0636'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: climax
    name: 曲女城大论折服群论
    labels:
      zh: 扬名
    start_date: '0643'
    highlight_event_id: guji-玄奘-event-lunyi
  - key: closure
    name: 负经东归长安
    labels:
      zh: 归国
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-guiguo
  decisions:
  - date: 0629
    title_zh: 违禁偷出玉门关
    rationale: 宁就西行一步死，不住东土苟且生，为求真义不惜身命国法
  - date: '0636'
    title_zh: 留学那烂陀五年
    rationale: 戒贤正传瑜伽深义，非久学难得精髓，故止游方专心听受
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经十九载
  summary: 归国后居弘福大慈恩玉华宫，主持译场，译出大般若等，兼译小乘五事毗婆沙论
  phases:
  - key: brewing
    name: 太宗敕住弘福建译场
    labels:
      zh: 建场
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-guiguo
  - key: breakthrough
    name: 慈恩创制新译体例
    labels:
      zh: 新译
    start_date: 0648
    highlight_event_id: guji-玄奘-event-yijing
  - key: climax
    name: 玉华译出大般若及五事论
    labels:
      zh: 译成
    start_date: '0660'
    highlight_event_id: guji-玄奘-event-yijing
  - key: closure
    name: 笔受既终寂于玉华
    labels:
      zh: 圆寂
    start_date: '0664-02-05'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645'
    title_zh: 受诏专事翻译不受宰相
    rationale: 以法利生胜于俗荣，译经一人可济万世，故辞相位而就译席
  - date: '0660'
    title_zh: 先大乘后兼译小乘五事论
    rationale: 五事论略摄色心等法自共相，能为入法要门，故亦译以全教备学
