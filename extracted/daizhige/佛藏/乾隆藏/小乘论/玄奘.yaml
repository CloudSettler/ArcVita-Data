  death_date: '0664-02-05'
  era: 唐
  reign_ref: 唐太宗贞观至高宗麟德
  archetype: 西行求法译经师
  dilemmas:
  - 诸师异说纷纭无处决疑欲求正法而关禁难出
  - 西行万里九死一生欲退则违本愿欲进则舍身命
  lesson: 为求正法不惜身命，以译经传灯利世报本
  summary_first_person: 吾姓陈名袆洛州缑氏人，幼年出家究摄论地持，见诸说不一，誓西行求法，十七年往返万里，归国奉诏译经，愿对法明灯照彻东土，令学者易入法相大海。
