  dilemmas:
  - title_zh: 冒禁西行与安守旧译
    description_zh: 旧译纷歧难决，欲得真义须往西域，身犯禁令前途莫测，安坐讲习则稳妥无险
  - title_zh: 奉诏译经与专修证果
    description_zh: 归国后众望所归，译场繁重昼夜不息，欲专修止观则负圣恩国命，欲广译则劳身损命
  lesson: 持戒为本，闻思为梯，不惮远险求真，终以利他为归
  summary_first_person: 吾姓陈名祎，洛州缑氏人，幼出家，慨旧译之乖，贞观初冒禁西行，遍历西域天竺，得瑜伽唯识真传，归而奉诏译经，兼译法蕴足论等，弘五戒十善之学处，以报佛恩
