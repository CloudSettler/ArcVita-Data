  year_of: 499
  title_zh: 真谛生于西天竺优禅尼国
  description_zh: 名俱罗那他聪敏强记才辩无竭硕学多闻该通内外后造论弘法名盖当世
- id: guji-真谛-event-arrive
  date: 358
  year_of: 546
  title_zh: 为弘法远游梁土
  description_zh: 三藏法师俱罗那他为弘法故远游此国值梁室将倾时事纷梗
- id: guji-真谛-event-panyu
  date: 365
  year_of: 555
  title_zh: 避地东西垂二十载至番禺
  description_zh: 法师避地东西垂二十载欲还天竺来至番禺刺史欧阳纥尚仁贵道久申敬事
- id: guji-真谛-event-shedasheng
  date: 369
  year_of: 561
  title_zh: 翻讲摄大乘等论经涉二年毕
  description_zh: 慧恺请翻讲摄大乘等论经涉二年文义方毕法师犹欲旋归复被请留
- id: guji-真谛-event-preach
