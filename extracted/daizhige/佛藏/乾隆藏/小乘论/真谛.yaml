  description_zh: 以天嘉四年正月二十五日于制旨寺始就开阐惑品未毕徙居南海续敷说凡不须度语直通音义
- id: guji-真谛-event-first-done
  date: 0563-10-10
  year_of: 563
  title_zh: 闰十月十日初译究竟
  description_zh: 慧恺随定随书日夜无懈至闰十月十日文义究竟论文二十二卷论偈一卷义疏五十三卷
- id: guji-真谛-event-retranslate
  date: 0564-02-02
  year_of: 564
  title_zh: 天嘉五年重译论文再解义意
  description_zh: 恐所翻不免谬失多有疑滞与僧忍等更请重译论文再解义意刺史请城内讲说温故识宗
