    title_zh: 略说三结以诱进易行扶佐
    rationale: 若具说八十八见所断无量苦学者生厌故略说三结尽如渐学三戒终摄一切戒海
  - date: -96
    title_zh: 立杂毒苦系缚义明结过患
    rationale: 极妙生处正受杂结毒如妙食杂毒故须说缚义苦系义杂毒义令知身见六十二见根戒盗疑过患而断
