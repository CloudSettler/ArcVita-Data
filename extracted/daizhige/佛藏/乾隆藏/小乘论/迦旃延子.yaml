    description_zh: 世尊于处处方邑种种演说不相似义若不立章门制品名作犍度则学者难得总相别相
  - title_zh: 三藏同出智海如何独显慧学
    description_zh: 修多罗多说心毗尼多说戒若不明阿毗昙多说慧以相求则疑网不断我人难破
  lesson: 会归散说以立章门分别总别以显无我破闇为明渡河为船
  summary_first_person: 吾迦旃延子于五百佛所立愿愿于释迦遗法中造阿毗昙吾遍学三藏通达总别于佛种种说中立章门造偈颂制品名作犍度成分杂使智业四大根定见八犍度四十四品唯说无我无人欲令受持读诵者破无明闇得智慧明观察善不善无记安住戒地不动
  source_urls:
