    rationale: 若说种种不相似义则难摄故立杂以总摄若使智业等相各别则各立犍度以明别相
  - date: -0190-01-01
    title_zh: 以名归己令广流布
    rationale: 常好受持读诵为他解说故称其造以劝学者受持读诵通利
- id: guji-迦旃延子-endeavor-2
  title_zh: 以无我慧破闇开觉
  description_zh: 明阿毗昙体即无漏慧根以闻思修慧断自性愚缘中愚显无我断我人出生智慧到涅槃岸
