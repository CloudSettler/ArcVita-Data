  decisions:
  - date: -0185-01-01
    title_zh: 以相求不以次第求
    rationale: 修多罗应次第求毗尼应因缘求阿毗昙应以相求若求次第则于文烦乱不明总别
  - date: -0175-01-01
    title_zh: 常说无我不说有我人
    rationale: 为增益智开觉意断我人故若说我人则堕外典若说无我则随顺解脱显明无我
