  date: -96
  year_of: -140
  place_zh: 印度西北
  description: 诵习转教他人广施设谓之造勤者闻受持思量观无量结恶行须臾除依此度法性如暗处燃明开意增智离计人渡生死河后僧伽跋澄于符秦译为鞞婆沙论十八卷
