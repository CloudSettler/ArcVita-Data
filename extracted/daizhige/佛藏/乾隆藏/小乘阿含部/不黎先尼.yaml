endeavors:
- id: guji-不黎先尼-endeavor-1
  title_zh: 十梦惊怖问佛得安
  summary_zh: 夜梦三瓶马食等十事大恐，拒婆罗门杀亲祠天之议，从夫人言往祇园问佛，得解为后世之事而心安
  phases:
  - key: brewing
    name: 夜卧梦见十事
    labels:
      zh: 惊怖
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-ten-dreams
  - key: breakthrough
    name: 婆罗门妄解劝杀祠
    labels:
      zh: 抉择
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-ten-dreams
  - key: climax
    name: 从夫人言往问世尊
    labels:
      zh: 求法
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-visit-buddha
  - key: closure
    name: 闻佛解梦心得安隐
    labels:
      zh: 安心
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-visit-buddha
  decisions:
  - date: -0485
    title_zh: 不从婆罗门杀亲祠天
    rationale: 不忍杀所爱夫人太子及奴婢象马，又疑妄解，故从夫人言往问佛以验真伪
  - date: -0485
    title_zh: 严驾往祇树给孤独园问梦
    rationale: 信佛为大智能见后世，故具述十梦求解，不隐讳恐怖之情
- id: guji-不黎先尼-endeavor-2
  title_zh: 弃异道信正法安国
  summary_zh: 得佛开示十梦皆主后世浇薄非今世咎，归宫重赐正夫人，夺诸臣禄，永不信异道婆罗门言
  phases:
  - key: brewing
    name: 朝中群臣惑于异道
    labels:
      zh: 惑乱
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-visit-buddha
  - key: breakthrough
    name: 佛言后世非今世咎
    labels:
      zh: 明辨
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-visit-buddha
  - key: climax
    name: 长跪受教心获欢喜
    labels:
      zh: 归依
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-reject-heresy
  - key: closure
    name: 还宫赏罚永弃异言
    labels:
      zh: 清正
    start_date: -0485
    highlight_event_id: guji-不黎先尼-event-reject-heresy
  decisions:
  - date: -0485
    title_zh: 还宫重赐正夫人摩尼
    rationale: 感其劝问佛免大杀业，是为国之善助，故加恩以彰正言
  - date: -0485
    title_zh: 永不信异道婆罗门所语
    rationale: 既知妄解导人杀生祠天为恶，佛言令人安隐不恐，故断然舍邪从正
events:
- id: guji-不黎先尼-event-birth
  date: -360
  year_of: -550
  title_zh: 诞生为憍萨罗王子
  description: 约前六世纪中叶生于舍卫城王族，后嗣位为憍萨罗国王，世称波斯匿不黎先尼
- id: guji-不黎先尼-event-ten-dreams
  date: -0485
  year_of: -485
  title_zh: 夜梦十事恐怖召臣解梦
  description: 夜卧梦见三瓶并立马口食尻小树生华果索绳羊食狐坐金床牛饮犊乳四牛欲斗陂水浊清溪水赤等十事，寤即大恐召公卿道人问解，婆罗门劝杀爱亲祠天
- id: guji-不黎先尼-event-visit-buddha
  date: -0485
  year_of: -485
  title_zh: 往祇园问佛得解十梦
  description: 从正夫人摩尼言严驾至祇树给孤独园具述十梦，佛言皆为后世豪贵相随贪利少义贵贱颠倒兵争雨旱之相，于王国亲皆无他
- id: guji-不黎先尼-event-reject-heresy
  date: -0485
  year_of: -485
  title_zh: 还宫行赏罚弃异道言
  description: 闻法欢喜如小器得大器贮膏作礼还宫，重赐正夫人，夺诸大臣俸，自言从今不信异道婆罗门所语
- id: guji-不黎先尼-event-death
  date: -0479
  year_of: -479
  title_zh: 舍卫宫中寿终
  description: 在位护国信奉正法后，于舍卫城宫中寿终，国祚付后嗣
