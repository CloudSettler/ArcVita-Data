    title_zh: 先舍寿命辞佛取灭
    rationale: 不忍见佛般涅槃并阿难舍利弗目犍连等灭去故愿先灭以全护法敬佛之心
  - date: -0480
    title_zh: 还王园布座现化取灭
    rationale: 于大众前现经行坐卧水火神变令惟舍利国人天生信欢喜供养舍利
events:
- id: guji-大爱道-event-birth
  type: birth
  date: '-0560'
  year_of: -560
  title_zh: 生于释种瞿昙家
  description: 生于迦毘罗卫释种为佛姨母后为佛养母经载乳养长大佛于佛有阜恩
- id: guji-大爱道-event-nurture
  type: career
  date: '-0563'
  year_of: -563
  title_zh: 佛母寿终乳养太子
  description: 摩耶夫人寿终后以姨母代母乳养悉达多太子长大佛自言于我有阜恩无量
- id: guji-大爱道-event-ordination
  type: career
  date: '-0530'
  year_of: -530
  title_zh: 从佛自归出家领尼众
  description: 从佛因缘自归佛法僧及习道尽不复疑法为比丘尼大弟子领五百比丘尼皆阿罗汉
- id: guji-大爱道-event-arhat
  type: career
  date: '-0520'
  year_of: -520
  title_zh: 住堕舍利精舍化众
  description: 行在堕舍利国比丘尼精舍教诫沙弥利行分卫入惟舍利国四徼道头里巷化众
- id: guji-大爱道-event-farewell
  type: career
  date: -0480
  year_of: -480
  title_zh: 猕猴讲堂辞佛先灭
  description: 至堕舍利国猕猴水拘罗曷讲堂头面礼佛足叉手白欲先舍寿取涅槃佛默然受最后见世间依明无上者
- id: guji-大爱道-event-death
  type: death
  date: -0480
  year_of: -480
  title_zh: 王园布座神足般涅槃
  description: 还王园比丘尼精舍布五百座从座没身虚空上至七树间现经行坐卧水火神足后灭神足取涅槃五百尼亦如是
- id: guji-大爱道-event-stupa
  type: career
  date: -0480
  year_of: -480
  title_zh: 佛持舍利令起塔供养
  description: 佛令阿难劝耶陀及五百婆罗门迦罗越备舆床麻油香薪花乐召千阿罗汉亲以两手受舍利赞已舍母人聚身得男子所应得共起塔受天人供养
