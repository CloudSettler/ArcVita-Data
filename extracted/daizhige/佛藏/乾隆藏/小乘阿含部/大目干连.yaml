- id: guji-大目干连-event-1
  title_zh: 经行昏睡蒙佛开示离睡
  date: '-485'
  year_of: -485
  place_zh: 摩竭国善知识村静处
  summary: 独在静处经行而睡，世尊自鹿野苑以三昧力现前，次第说离睡九法及远离白衣利养、乞食不恚、说法不诤之法
- id: guji-大目干连-event-2
  title_zh: 请问究竟梵行得观受法门
  date: '-485'
  year_of: -485
  place_zh: 摩竭国善知识村世尊前
  summary: 从座起叉手请问云何至竟尽无垢行梵行，佛教观苦乐不苦不乐诸痛皆无常尽止，不著不怖即生尽梵行成名色如真知
- id: guji-大目干连-event-death
  title_zh: 先于世尊入般涅槃
  date: '-484'
  year_of: -484
  place_zh: 古印度摩竭陀国
  summary: 以精进离睡观受无常成就解脱，于世尊般涅槃之前先般涅槃，为后世示精进对治昏睡之典范
