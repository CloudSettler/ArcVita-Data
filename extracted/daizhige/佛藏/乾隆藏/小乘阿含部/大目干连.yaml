    labels:
      zh: 破计显正
    start_date: '-0500'
    highlight_event_id: guji-大目干连-event-sermon
  - key: climax
    name: 说魔击毗楼堕大泥犁受锁百年之报
    labels:
      zh: 因果示警
    start_date: '-0500'
    highlight_event_id: guji-大目干连-event-sermon
  - key: closure
    name: 说偈劝魔莫厌佛莫娆比丘
    labels:
      zh: 偈颂收摄
    start_date: '-0500'
    highlight_event_id: guji-大目干连-event-sermon
  decisions:
  - date: '-0500'
    title_zh: 举拘楼孙佛时旧事以缘亲止恶
    rationale: 魔今复来须令知我即彼时触娆魔知果报不虚而生怖畏
  - date: '-0500'
    title_zh: 以慈悲喜舍与无常观教众令魔无便
    rationale: 昔圣众以四无量及观行无常令魔求便不得此为胜对治当传后世
events:
