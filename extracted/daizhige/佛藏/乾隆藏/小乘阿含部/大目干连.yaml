  title_zh: 跋只园中魔化小入腹
  date: '-0500'
  year_of: -500
  place_zh: 跋只尸牧摩鼻量鹿野园
  description_zh: 为世尊作窟露地彷徉教授时波旬化身微小入腹腹重如食豆即敷尼师坛结跏趺坐入像三昧观见魔在腹中
- id: guji-大目干连-event-mara-expel
  title_zh: 三昧起呵魔从口出立
  date: '-0500'
  year_of: -500
