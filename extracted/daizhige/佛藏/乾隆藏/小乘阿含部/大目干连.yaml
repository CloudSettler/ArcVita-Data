person:
  qid: guji-大目干连
  name_zh: 大目干连
  names:
    zh: 大目干连
    en: Mahamaudgalyayana
  lifespan:
    birth:
      date: '-568'
      precision: year
      is_circa: true
      raw: 约生于古印度摩竭陀国婆罗门家
    death:
      date: '-484'
      precision: year
      is_circa: true
      raw: 于世尊般涅槃前先入般涅槃
  birth_date: '-568'
  death_date: '-484'
  era: 古印度列国时代当值中土春秋之末
  archetype: 神通第一的精进修行者
  dilemmas:
  - 独在静处经行而生昏睡，懈怠睡眠与精进办道相争
  - 亲近白衣贪求利养恭敬则多论贡高嫉妒远离三昧，远离众会安住静处则亲近解脱
  lesson: 莫乐床卧右胁睡眠与世间恭敬，当以九法离睡并观诸受无常败坏无染尽止，乃得不著不怖证究竟梵行
  summary_first_person: 我是大目干连，独在摩竭善知识村静处经行而睡，蒙世尊以神足现前开示离睡九法，又教我不亲近白衣不求利养、入村乞食不生恚心、说法不诤胜负当作师子吼，最后观苦乐不苦不乐诸受皆无常尽止，便不著世间不恐怖而趣般涅槃
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E7%A6%BB%E7%9D%A1%E7%BB%8F.html
endeavors:
- id: guji-大目干连-endeavor-1
  title_zh: 静处经行受持离睡九法
  summary: 在摩竭善知识村独处经行昏睡，蒙世尊现身开示，以莫行想广诵说法意念冷水洗眼挑耳出观星宿空处经行及右胁吉祥卧等九法对治睡眠，并受持远离白衣利养之教
  phases:
  - key: brewing
    name: 独处经行生睡
    labels:
      zh: 静处昏睡
    start_date: '-486'
    highlight_event_id: guji-大目干连-event-1
  - key: breakthrough
    name: 世尊神足现前
    labels:
      zh: 佛亲开示
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-1
  - key: climax
    name: 九法次第对治
    labels:
      zh: 离睡精进
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-1
  - key: closure
    name: 安住护根正念
    labels:
      zh: 不乐睡眠
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-1
  decisions:
  - date: '-485'
    title_zh: 不乐床卧即起受教
    rationale: 世尊诃责乐床乐卧乐睡，当舍懈怠以九法次第遣睡
  - date: '-485'
    title_zh: 远离白衣利养恭敬
    rationale: 亲近白衣多论生谀谄憍慢嫉妒不息则远离三昧，故当至静处草蓐默然思惟
- id: guji-大目干连-endeavor-2
  title_zh: 观受无常趣竟究竟梵行
  summary: 请问云何比丘至竟尽至竟无垢至竟行梵行，蒙佛教观一切病痛苦乐不苦不乐皆无常败坏无染尽止，由是不著不怖舍有余依而证般涅槃
  phases:
  - key: brewing
    name: 请问究竟梵行
    labels:
      zh: 问竟尽无垢
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-2
  - key: breakthrough
    name: 受念无常败坏
    labels:
      zh: 观痛无常
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-2
  - key: climax
    name: 不著不怖解脱
    labels:
      zh: 离著证真
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-2
  - key: closure
    name: 欢喜奉行所说
    labels:
      zh: 生尽梵行成
    start_date: '-485'
    highlight_event_id: guji-大目干连-event-2
  decisions:
  - date: '-485'
    title_zh: 说法不作胜负但作有益决定说
    rationale: 作胜意便有多论贡高嫉妒不息而远离三昧，故当如师子吼论而不谤他
  - date: '-485'
    title_zh: 观诸受为无常尽止住处
    rationale: 若见痛住常则生著怖，观其无常败坏无染尽止则不著世间而得涅槃
events:
