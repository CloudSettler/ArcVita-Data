  description_zh: 从三昧起告言波旬还出莫触娆如来及弟子魔初谓不见后知被识即从口出立于前具言我知汝心念
- id: guji-大目干连-event-sermon
  title_zh: 说拘楼孙佛时魔堕阿鼻
  date: '-0500'
  year_of: -500
  place_zh: 跋只尸牧摩鼻量鹿野园
  description_zh: 自言过去拘楼孙佛时亦为触娆魔妹迦罗之子说魔令婆罗门打骂供养比丘皆不得便又化小儿击毗楼首破血流佛遥见呵言弊魔无厌即堕大泥犁锁解则百年并说偈劝莫娆佛及比丘
- id: guji-大目干连-event-death
  title_zh: 佛前先般涅槃示寂
  date: '-0444'
  year_of: -444
  place_zh: 摩揭陀国
  description_zh: 以神通第一化导既久于释尊涅槃前先入灭留降魔护法之范
