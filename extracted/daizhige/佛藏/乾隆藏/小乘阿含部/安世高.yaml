    highlight_event_id: guji-安世高-event-death
  decisions:
  - date: '0150'
    title_zh: 以七处为知三处为观立修行次第
    rationale: 五阴各有七事，合六衰成三观，令学者疾得道法脱结
  - date: '0152'
    title_zh: 兼说九横二难得警世
    rationale: 人命多横夭，示不应饭不持戒近恶知识等九因，劝避横死以长寿闻道
