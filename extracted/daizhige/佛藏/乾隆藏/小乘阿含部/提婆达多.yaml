endeavors:
- id: guji-提婆达多-endeavor-1
  title_zh: 贪求利养破和合僧
  summary_zh: 随佛出家后贪名利，嫉妒世尊，另图领导破和合僧，善法灭恶法生。
  phases:
  - key: brewing
    name: 释种出家怀利养心
    labels:
      zh: 起贪嫉
    start_date: '-580'
    highlight_event_id: guji-提婆达多-event-birth
  - key: breakthrough
    name: 求权破僧显邪伪行
    labels:
      zh: 破和合
    start_date: '-535'
    highlight_event_id: guji-提婆达多-event-break
  - key: climax
    name: 池上被记堕泥犁一劫
    labels:
      zh: 被悬记
    start_date: '-528'
    highlight_event_id: guji-提婆达多-event-judged
  - key: closure
    name: 善根断绝无白法可拔
    labels:
      zh: 无可救
    start_date: '-520'
    highlight_event_id: guji-提婆达多-event-judged
  decisions:
  - date: '-535'
    title_zh: 舍和合而自立僧团
    rationale: 为贪供养名闻，不顾和合，以破僧为得权之径，遂善灭恶生。
  - date: '-528'
    title_zh: 不改悔而一向行恶
    rationale: 闻一向堕狱之记仍不生惭愧，坚执邪伪，故无一毛白法可拔济。
- id: guji-提婆达多-endeavor-2
  title_zh: 一向恶业堕狱示警
  summary_zh: 以满恶不善结缚，感苦热生老病死报，身坏生泥犁，为放逸者作警示。
  phases:
  - key: brewing
    name: 与不善俱善根渐灭
    labels:
      zh: 善灭恶生
    start_date: '-535'
    highlight_event_id: guji-提婆达多-event-break
  - key: breakthrough
    name: 如来观根知无白法
    labels:
      zh: 观根相
    start_date: '-528'
    highlight_event_id: guji-提婆达多-event-judged
  - key: climax
    name: 譬如堕粪厕没身不现
    labels:
      zh: 喻无救
    start_date: '-528'
    highlight_event_id: guji-提婆达多-event-judged
  - key: closure
    name: 身坏死生泥犁住一劫
    labels:
      zh: 堕恶趣
    start_date: '-490'
    highlight_event_id: guji-提婆达多-event-death
  decisions:
  - date: '-528'
    title_zh: 闻大人根相而不修善
    rationale: 世尊说六种人根相清净灭断之理，仍不发善心，故趣断绝法。
  - date: '-490'
    title_zh: 以身果证放逸之过
    rationale: 一向满恶着结，必受泥犁苦报，为后世示放逸堕落之鉴。
events:
- id: guji-提婆达多-event-birth
  title_zh: 释种诞生出家随佛
  type: birth
  date: '-600'
  year_of: -600
  place_zh: 迦毗罗卫释种地
  summary_zh: 生于释种，后随世尊出家，为佛弟子及随从比丘之一。
- id: guji-提婆达多-event-break
  title_zh: 放逸破僧贪求领导
  type: career
  date: '-535'
  year_of: -535
  place_zh: 王舍城及僧团中
  summary_zh: 起放逸嫉妒，行邪伪方便，欲夺领导破和合僧，失其本处。
- id: guji-提婆达多-event-judged
  title_zh: 阿夷陀婆池上被一向记
  type: career
  date: '-528'
  year_of: -528
  place_zh: 跋耆城阿夷陀婆池水岸上
  summary_zh: 世尊告阿难，不见其有一毛白法，一向记禘婆达兜当堕泥犁住一劫难救，并说大人根相六种人。
- id: guji-提婆达多-event-death
  title_zh: 身坏死生泥犁受报
  type: death
  date: '-490'
  year_of: -490
  place_zh: 泥犁恶趣
  summary_zh: 以一向满恶不善着结，身坏之后生泥犁中，住一劫受苦热生老病死报。
