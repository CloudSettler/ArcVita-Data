  birth_date: '-600'
  death_date: '-490'
  era: 古印度列国时代当中土东周春秋末
  reign_ref: 摩揭陀影胜王至阿阇世王时
  archetype: 嫉慢放逸堕落型
  dilemmas:
  - 贪求利养名闻而欲夺僧团领导之困
  - 无一毛白法而欲免一劫泥犁之不可能
  lesson: 放逸嫉慢则善根断绝一向堕恶，当护清净心勤修白法守和合
  summary_first_person: 我为禘婆达兜，本随佛出家，贪利养而行邪伪破和合僧，不见一毫白法，故世尊于阿夷陀婆池上，一向记我当堕泥犁住一劫难救，以警后世放逸者。
