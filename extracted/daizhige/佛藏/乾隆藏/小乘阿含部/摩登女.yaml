  summary_first_person: 我本舍卫水边持水女子，一见阿难乞水便倾心相随，誓言非他不嫁，母以蛊道逼留终被佛力所救，我追随不舍求佛成全，蒙佛开示眼泪鼻涕屎尿恶露皆臭，夫妻子嗣皆有死别哭泪，遂自思惟厌离形爱，得阿罗汉道，方知五百世夫妻恩爱今成兄弟般清净道缘
