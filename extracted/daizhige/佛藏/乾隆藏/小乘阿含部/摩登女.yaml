events:
- id: guji-摩登女-event-birth
  title_zh: 舍卫出生为摩登之女
  date: '-0520'
  year_of: -520
  description_zh: 生于舍卫国，母名摩登，家居取水为业，生年不详系佛世时人
- id: guji-摩登女-event-meet
  title_zh: 水边施水遇阿难
  date: '-0500'
  year_of: -500
  description_zh: 阿难持钵乞食随水行，从女乞水，女施水后随问名知为阿难，归告母誓言得阿难乃嫁
- id: guji-摩登女-event-trap
  title_zh: 母施蛊术逼婚佛救阿难
  date: '-0500'
  year_of: -500
  description_zh: 母请阿难以斋，闭门以蛊道缚留，布席燃火胁迫为夫，阿难呼佛，佛以神力脱之还至佛所
- id: guji-摩登女-event-pursue
  title_zh: 追随阿难守门相索
  date: '-0500'
  year_of: -500
  description_zh: 女于家啼哭续念阿难，明日自往随阿难乞食之后视足视面，阿难羞避还归佛所，女守门不去
- id: guji-摩登女-event-plea
  title_zh: 诣佛求为阿难作妻
  date: '-0500'
  year_of: -500
  description_zh: 佛召见问所索，女言闻阿难无妇己亦无夫愿为妻，佛言阿难沙门无发汝能剃发则许之
- id: guji-摩登女-event-shave
  title_zh: 剃发诣佛闻解形法
  date: '-0500'
  year_of: -500
  description_zh: 归报母不顾富豪种姓之劝，垂泪断发还至佛所，佛问所爱眼鼻口声行步，示以泪涕唾垢屎尿臭处及夫妻生子死别哭泪之苦
- id: guji-摩登女-event-arhat
  title_zh: 思惟恶露证阿罗汉
  date: '-0500'
  year_of: -500
  description_zh: 自思惟恶露形中发正心即得阿罗汉道，惭愧长跪自陈昔愚痴逐阿难今心开如冥中灯火盲得扶持，佛说五百世为阿难作妇相敬贪爱今于戒道得道如兄弟
- id: guji-摩登女-event-death
  title_zh: 证果后入灭
  date: '-0440'
  year_of: -440
  description_zh: 证阿罗汉后果化事迹不载，依常理示寂于佛世之后，年月不详
