  dilemmas:
  - 为得阿难为夫以死相逼母亲行蛊术，情爱与持戒相违
  - 愿剃发舍俗随佛以换婚约，爱执与解脱相择
  lesson: 爱欲源于不见身之不净，观泪涕唾垢屎尿恶露则贪爱自息，转痴情为道心即得解脱
  summary_first_person: 我本舍卫水边担水女，因阿难乞水生爱，归家啼求为妇，逼母以蛊留之，佛救阿难后我追随不舍，佛许剃发即与婚，我剃发往见，闻说眼泪鼻涕口唾耳垢身臭及夫妻恶露生死哭泣之理，自念恶露心开，遂证阿罗汉，前忏愚痴逐阿难事
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/小乘阿含部/摩邓女经.html
