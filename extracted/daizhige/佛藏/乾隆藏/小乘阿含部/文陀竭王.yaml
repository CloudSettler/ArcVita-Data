  summary_first_person: 我是文陀竭，生从母顶，后为遮迦越王，具七宝千子，统阎浮提俱耶尼弗于逮郁单曰，天为我雨金银七日夜，我犹上忉利欲代释位，一念贪起即堕病床，方悔人无厌足，嘱后人当思知足求道
