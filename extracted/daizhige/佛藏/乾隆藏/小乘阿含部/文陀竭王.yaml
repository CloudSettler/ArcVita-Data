    title_zh: 病中立遗诫示无厌足
    rationale: 因贪天位堕而被病，自悔人至死无厌足，令群臣传诫后世当求道乃足
events:
- id: guji-文陀竭王-event-birth
  title_zh: 母顶而生名文陀竭
  date: '-2000'
  year_of: -2000
  place_zh: 传说王舍
  description_zh: 生从母顶出，故字文陀竭，后作遮迦越王，东西南北皆属之
- id: guji-文陀竭王-event-wheel
  title_zh: 得七宝千子为转轮王
  date: '-1990'
  year_of: -1990
  place_zh: 四天下
  description_zh: 得金轮白象绀马明月珠玉女圣辅臣导道主兵七宝，有千子端正健猛，仁贤修正法，天雨钱金银七日七夜
- id: guji-文陀竭王-event-unify
  title_zh: 飞行降伏四天下
  date: '-1980'
  year_of: -1980
  place_zh: 阎浮提俱耶尼弗于逮郁单曰
  description_zh: 适生意便举七宝四种兵飞到南方阎浮提二十八万里西方俱耶尼三十二万里东方弗于逮三十六万里北方郁单曰四十万里，皆降伏，以正法治数千岁
- id: guji-文陀竭王-event-ascend
  title_zh: 上须弥入忉利得半座
  date: '-1960'
  year_of: -1960
  place_zh: 须弥山忉利天释宫
  description_zh: 举七宝百官飞到须弥，释起迎牵与共坐半座，顾视天宫玉女七宝心生贪念
- id: guji-文陀竭王-event-repent
  title_zh: 欲代释位堕下病困自悔
  date: '-1950'
  year_of: -1950
  place_zh: 天下病床
  description_zh: 自念使释死去欲代治天，适生意神便去还在天下，被病困劣，悔言人至死无厌足，天雨宝尚不足，唯得须陀洹至佛道乃足
- id: guji-文陀竭王-event-death
  title_zh: 病终遗诫佛证前身
  date: '-1950'
  year_of: -1950
  place_zh: 王宫床边
  description_zh: 群臣问遗言，嘱传治四天雨宝升天堕病之事以诲厌足，命终后佛告阿难时文陀竭王者即我身也
