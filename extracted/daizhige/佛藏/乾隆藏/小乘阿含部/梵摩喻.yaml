  - title_zh: 年迈守旧还是遣使求证
    description: 耆艾百二十闻瞿昙得佛号，先遣弟子摩纳随佛六月以验三十二相神化
  - title_zh: 师尊之体还是屈礼佛足
    description: 身为一国之师众儒所宗，亲见佛相具足即五体投地口鸣足下率徒归命
  lesson: 博学不碍虚心，耆艾犹能改辙，亲证而后深信，归依而后得度
  summary_first_person: 吾弥夷逝心梵摩喻，年百二十博通众经星宿图书，为一国师，闻佛在随提国，遣摩纳往观六月，及亲觐具见相好，问逝心通达净寂佛义，心解归依，设供七日愿为清信士
