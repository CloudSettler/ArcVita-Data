events:
- id: guji-梵摩喻-event-birth
  title_zh: 降生弥夷博习群经
  date: '-0620'
  year_of: -620
  description: 弥夷国人生，博通众经星宿图书，豫知吉凶，为一国之师
  place_zh: 弥夷国
- id: guji-梵摩喻-event-teacher
  title_zh: 为国师授徒摩纳
  date: '-0550'
  year_of: -550
  description: 以耆艾之德教授门徒，弟子摩纳亦博经典明齐于师，具睹秘谶知佛相
  place_zh: 弥夷国
- id: guji-梵摩喻-event-dispatch
  title_zh: 遣摩纳随佛六月
  date: '-0500'
  year_of: -500
  description: 遥闻佛在随提国与五百沙门俱，遣摩纳往验广长舌阴马藏，摩纳随佛六月具睹行住坐卧威仪还报三十二相
  place_zh: 随提国
- id: guji-梵摩喻-event-audience
  title_zh: 林下亲觐问偈验相
  date: '-0500'
  year_of: -500
  description: 佛至弥夷坐一树下，国人毕会，梵摩喻率徒诣见，以偈问净王太子三十二相，佛现阴马藏出广长舌覆面舐耳光明绕身
  place_zh: 弥夷国林下
- id: guji-梵摩喻-event-refuge
  title_zh: 问逝心等义归命三宝
  date: '-0500'
  year_of: -500
  description: 问何谓逝心通达清净寂然为佛，闻佛说三神足六通四等十力及苦空真谛，心解如白氎受染，五体投地口鸣佛足归命佛法僧
  place_zh: 弥夷国林下
- id: guji-梵摩喻-event-offering
  title_zh: 设供七日受清信士戒
  date: '-0500'
  year_of: -500
  description: 请佛与圣众就舍设百味食七日，自手行盥肃心供养，守仁不杀等戒，佛说神化讫还随提国
  place_zh: 弥夷国舍宅
- id: guji-梵摩喻-event-death
  title_zh: 寿终得不还果
  date: '-0500'
  year_of: -500
  description: 供佛未久寿终，比丘问所趣，佛记圣心博解五盖已尽得不还，于清净得应真无为而去
  place_zh: 弥夷国
