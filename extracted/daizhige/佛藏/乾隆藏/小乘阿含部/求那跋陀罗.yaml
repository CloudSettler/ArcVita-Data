    title_zh: 择机授禅不滥传
    rationale: 禅要深妙须观根授法，持戒精进者乃授，以防狂解不修
events:
- id: guji-求那跋陀罗-event-birth
  title_zh: 诞生中天竺婆罗门家
  date: 0394
  year_of: 394
  kind: birth
  location_zh: 中天竺
  description_zh: 生于婆罗门家，少聪慧，博通五明，精学三藏，兼通大乘。
- id: guji-求那跋陀罗-event-arrive
  title_zh: 泛海至刘宋建康
  date: 285
  year_of: 435
  kind: career
  location_zh: 建康
  description_zh: 元嘉十二年泛海东来至建康，宋文帝迎请住祇洹寺，诏令翻译。
- id: guji-求那跋陀罗-event-translate
  title_zh: 译出杂阿含经五十卷
  date: 288
  year_of: 440
  kind: career
  location_zh: 建康祇洹寺
  description_zh: 与宝云慧观等共译杂阿含经，宣说五蕴六处缘起四谛四念处安般守意之法，即今所传小乘阿含部根本。
- id: guji-求那跋陀罗-event-teach
  title_zh: 译楞伽经授禅法化众
  date: 291
  year_of: 443
  kind: career
  location_zh: 建康
  description_zh: 译楞伽阿跋多罗宝经四卷及法鼓等经，敷演禅要，道俗归学，后世禅宗遥承其绪。
- id: guji-求那跋陀罗-event-death
  title_zh: 示寂于建康
  date: 0468
  year_of: 468
  kind: death
  location_zh: 建康
  description_zh: 大明十二年示寂，寿七十五，遗教以戒定慧为本，后人奉其所译杂阿含为修学要典。
