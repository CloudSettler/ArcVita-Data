      raw: 刘宋大明十二年示寂于建康
  birth_date: 0394
  death_date: 0468
  era: 南北朝刘宋
  reign_ref: 宋文帝元嘉
  archetype: 译经弘法者
  dilemmas:
  - 梵本精深而华言未备，如何传信达雅而不失本义
  - 禅观要妙而众根有利钝，如何契机授法而不致滥传
  lesson: 以信为种以慧为耕，译经贵实，弘法贵正，精进不舍方至甘露。
  summary_first_person: 吾本中天竺人，少学三藏，泛海东来至宋都建康，译杂阿含楞伽等经，敷演四意止安般禅要，唯愿眾生离苦得度，正法久住中土。
  source_urls:
