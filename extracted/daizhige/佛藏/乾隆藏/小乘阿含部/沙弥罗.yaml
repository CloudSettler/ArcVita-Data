  - 一身展转五母腹中作子，五母昼夜啼哭念子，恩爱牵缠与离欲解脱难以两全
  - 洞见地狱饿鬼畜生苦痛恐怖，独求泥洹永离生死与怜伤济度众生如何抉择
  lesson: 畏生死苦而精进禅定，断欲网因缘，方能永离轮回，自度亦明度人之本
  summary_first_person: 吾名沙弥罗，七岁好道辞母随师入山，八岁得阿罗汉，洞见宿命曾为五母作子，怜其悲哭发狂，畏世间生死罪福轮转，精进求泥洹，永断身根，飞腾虚空而去
