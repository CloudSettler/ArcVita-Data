  - title_zh: 胡汉文义如何两得
    description_zh: 梵本义理深广，华言未备，既欲存本旨，又欲使时人易解，当直译还是意译
  - title_zh: 乱世因缘如何住持法席
    description_zh: 洛阳屡经动荡，衣食难给，是避乱保身还是坚持译经讲说以摄众心
  lesson: 物以类聚人以群分，亲近善友持戒知足则道业日进，亲近恶友贪嗔愚痴则沉沦不已
  summary_first_person: 吾法炬西晋译经沙门，居洛阳译场，承舍卫说法之旨，译传相应相可经，劝人分别是非因缘，可行者行，不可行者莫行，但愿众生亲善远恶，相类相聚，同趣解脱
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E7%9B%B8%E5%BA%94%E7%9B%B8%E5%8F%AF%E7%BB%8F.html
