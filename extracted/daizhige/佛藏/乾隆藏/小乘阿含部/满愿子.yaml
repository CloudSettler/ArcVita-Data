  - title_zh: 粗恶之地去留抉择
    description: 首那和兰凶恶好斗喜骂辱人，往则身命可虞，不往则弘愿难遂
  - title_zh: 六根贪住与解脱
    description: 眼耳鼻舌身意贪着可爱境则乐迷惑而致忧恼，离欢乐贪住则恼患得除
  lesson: 以调顺寂然忍辱行处粗恶之地，一夏精勤广度有情，唯讲法典漏尽无垢
  summary_first_person: 我是邠耨文陀尼子，世称满愿子，摩鸠罗山中亲承佛授六根要法，立忍辱誓赴首那和兰，一夏教化立寺度众，证三达六通而入灭
