    title_zh: 一夏专精教化
    rationale: 即夜藏床安眠明晨即行，不滞摩鸠罗，务在一岁成就弘化
  - date: -325
    title_zh: 兴寺舍窟室利众
    rationale: 建寺舍五百窟室床榻五百及法坐被枕各五百，安立四众修学之所
  - date: -325
    title_zh: 度五百人出家唯讲法典
    rationale: 化五百人为沙门，不与余事唯讲法典，谛观顺法证六通罗汉
