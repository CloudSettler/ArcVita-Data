    title_zh: 求要法令长夜安隐
    rationale: 偏袒右肩叉手白佛，愿奉行要法得长夜安隐无极
  - date: -326
    title_zh: 抉择游首那和兰
    rationale: 明言欲游所闻欲胜之国，不避凶恶粗犷
  - date: -326
    title_zh: 立五重忍辱誓
    rationale: 从骂辱至利刀害命皆作爱敬柔和想，乃至以刀为食入于寂然，故堪任弘化
- id: guji-满愿子-endeavor-2
  title_zh: 首那和兰一夏弘化
  summary: 着衣持钵往诣彼国，一夏劝立清信士女各五百，兴寺舍窟室床榻法坐各五百，度五百人为沙门，证三达而灭度
