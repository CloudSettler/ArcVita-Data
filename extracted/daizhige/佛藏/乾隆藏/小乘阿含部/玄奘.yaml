  summary_first_person: 吾玄奘洛州缑氏人也幼慕释氏贞观初冒禁西行遍历五印就学那烂陀归而奉诏译经译出缘起经等大小乘经论以明无明缘行乃至老死之次第愿众生知此有故彼有而断苦集也
