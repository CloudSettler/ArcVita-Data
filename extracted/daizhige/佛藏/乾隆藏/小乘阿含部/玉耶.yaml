  - title_zh: 骄慢失礼与妇道本分之冲突
    description: 出身长者家端正殊特，嫁入给孤独家后轻慢公姑夫婿，不以妇礼自持
  - title_zh: 严罚非法与纵容增罪之两难
    description: 公姑欲教而惧杖捶非法，设不教诃则其罪日增，唯求佛陀化导开解
  lesson: 去骄慢心，修五善离三恶，甘如婢妇谦敬奉事，持戒护家，善恶报应分明
  summary_first_person: 我本长者之女，名曰玉耶，嫁入给孤独家，恃端正而骄慢，不顺公姑夫婿，蒙世尊至舍现神力摄受，为说女人十恶五善三恶七辈妇之法，我心惶怖开解，誓如婢妇尽命奉事，受三自归十戒，不敢复慢
