  title_zh: 与琉璃宝俱生为太子
  description_zh: 舍卫王波斯匿太子诞育之初与琉璃宝俱因以为号名维楼黎
- id: guji-琉璃王-event-humiliation
  date: '-0460'
  year_of: -460
  title_zh: 讲堂受释种骂辱
  description_zh: 领卫士省外氏入迦维罗卫登新建讲堂息凉被五百舍夷贵姓面骂驱逐刬去足迹更易宝阶遂敕太史无信记恨于带中
- id: guji-琉璃王-event-usurpation
  date: '-0445'
  year_of: -445
  title_zh: 夺父国称制为王
  description_zh: 趁父王波斯匿与末利后诣祇树园听佛说法率众夷灭五百近臣夺衣冠乘饰父王出奔萝卜胀薨太子即殿上称制为王
- id: guji-琉璃王-event-invasion
  date: '-0444'
  year_of: -444
  title_zh: 四征灭迦维罗卫
  description_zh: 以带中旧书为证起四种兵伐释三遇世尊坐荄枯树哀愍亲属而退第四破城缚三万人象蹈犁耕释摩男投池自沉七万余生被系婴儿被射
- id: guji-琉璃王-event-death
  date: '-0444'
  year_of: -444
  title_zh: 海中七日期尽火焚
  description_zh: 灭释还舍卫佛记七日地狱火至王乘船入海冀免期尽水中自然火出烧船及王一时灰灭
