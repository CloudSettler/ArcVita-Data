    rationale: 腹中异响如饥人负重必有因缘当以三昧观身穷其根本
  - date: '-485'
    title_zh: 直斥弊魔莫娆圣众
    rationale: 若纵魔娆佛及弟子必长夜获苦堕于恶趣故须先破其隐形再警其后果
