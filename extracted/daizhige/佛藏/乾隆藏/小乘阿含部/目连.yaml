person:
  qid: guji-目连
  name_zh: 目连
  names:
    zh: 目连
    en: Mahamaudgalyayana
  lifespan:
    birth:
      date: -568-01-01
      precision: year
      is_circa: true
      raw: 约公元前五六八年摩揭陀国
    death:
      date: -484-01-01
      precision: year
      is_circa: true
      raw: 约公元前四八四年王舍城
  birth_date: -568-01-01
  death_date: -484-01-01
  era: 古印度佛陀住世时代
  reign_ref: 摩揭陀国频婆娑罗王时期
  archetype: 神通第一济度答疑者
  dilemmas:
  - 以神通见苦而不能代受业报，只能示因劝修
  - 面对众鬼同问异报，须分别宿因而不滥说
  lesson: 善恶有报毫发不爽，当以布施持戒慈心护生，远离悭贪杀生邪祠
  summary_first_person: 我是目连，晡时从禅定起，游行至恒水边，见诸饿鬼受罪各异。他们生起敬心前来问我何罪所致，我为说往昔因缘，分别花报与地狱果，说竟还归耆阇崛山大众，闻佛所说，稽首奉行。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E9%AC%BC%E9%97%AE%E7%9B%AE%E8%BF%9E%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E9%AC%BC%E9%97%AE%E7%9B%AE%E8%BF%9E%E7%BB%8F.md
endeavors:
- id: guji-目连-endeavor-1
  title_zh: 恒水边答饿鬼问因缘
  summary: 于王舍城迦兰陀竹园住时，晡时出定游恒水边，答十七鬼问，分别宿世杖打众生等因，示花报与地狱果。
  phases:
  - key: brewing
    name: 出定游行见众鬼受苦
    labels:
      zh:
      - 禅定
      - 游化恒水
    start_date: -500-05-01
    highlight_event_id: guji-目连-event-hengshui
  - key: breakthrough
    name: 众鬼起敬心次第发问
    labels:
      zh:
      - 问罪
      - 敬信
    start_date: -500-05-02
    highlight_event_id: guji-目连-event-hengshui
  - key: climax
    name: 分别宿因示花报地狱
    labels:
      zh:
      - 说因缘
      - 示果报
    start_date: -500-05-03
    highlight_event_id: guji-目连-event-shuoyuan
  - key: closure
    name: 说经竟还归大众奉行
    labels:
      zh:
      - 还山
      - 奉行
    start_date: -500-05-04
    highlight_event_id: guji-目连-event-guilshan
  decisions:
  - date: -500-05-02
    title_zh: 以宿命智直答不隐
    rationale: 鬼既至诚问因，若隐而不说则失度机，故分别十七种宿罪令自省
  - date: -500-05-03
    title_zh: 明辨花报与正报地狱
    rationale: 使知今苦仅为花报，果在地狱，以生怖畏而劝止恶修善
- id: guji-目连-endeavor-2
  title_zh: 随佛修证神通第一济众
  summary: 早随佛出家，精进禅定得六神通，居弟子中神通第一，常以天眼宿命观众生苦，游化救拔并记录奉行。
  phases:
  - key: brewing
    name: 王舍城随佛出家修定
    labels:
      zh:
      - 出家
      - 修定
    start_date: -533-01-01
    highlight_event_id: guji-目连-event-chujia
  - key: breakthrough
    name: 证得六通居神通第一
    labels:
      zh:
      - 证果
      - 神通
    start_date: -530-01-01
    highlight_event_id: guji-目连-event-chujia
  - key: climax
    name: 以天眼宿命济度苦趣
    labels:
      zh:
      - 济度
      - 说法
    start_date: -500-05-01
    highlight_event_id: guji-目连-event-shuoyuan
  - key: closure
    name: 还耆阇崛山稽首奉行
    labels:
      zh:
      - 奉行
      - 结集
    start_date: -500-05-04
    highlight_event_id: guji-目连-event-guilshan
  decisions:
  - date: -533-01-01
    title_zh: 舍俗从佛精进禅定
    rationale: 见生老病死轮回不息，唯佛法能出生死，故决志出家求解脱
  - date: -500-05-04
    title_zh: 还归大众稽首奉行佛说
    rationale: 所见所说皆须印可佛法，不立己见，故还山与大会同闻同行
events:
- id: guji-目连-event-birth
  title_zh: 目连诞生于摩揭陀国
  date: -568-01-01
  year_of: -568
  event_type: birth
  description: 约公元前五六八年生于古印度摩揭陀国婆罗门家，与舍利弗为友，后同皈佛。
- id: guji-目连-event-chujia
  title_zh: 随佛出家证神通第一
  date: -533-01-01
  year_of: -533
  event_type: career
  description: 与舍利弗同至王舍城迦兰陀竹园皈依佛陀，精进修定，得六神通，被称神通第一。
- id: guji-目连-event-hengshui
  title_zh: 晡时游恒水边见饿鬼
  date: -500-05-02
  year_of: -500
  event_type: career
  description: 晡时从禅定起，游恒水边，见诸饿鬼受罪不同，诸鬼见尊者皆起敬心前来问因缘。
- id: guji-目连-event-shuoyuan
  title_zh: 为十七鬼说往昔因缘
  date: -500-05-03
  year_of: -500
  event_type: career
  description: 次第答头痛着弊衣等十七鬼问，分别杖打众生悭贪悔施等宿罪，明花报在身果入地狱。
- id: guji-目连-event-guilshan
  title_zh: 还耆阇崛山大众奉行
  date: -500-05-04
  year_of: -500
  event_type: career
  description: 与诸饿鬼说往昔因缘经竟，还来在耆阇崛山，一切大会闻佛所说，稽首奉行。
- id: guji-目连-event-death
  title_zh: 目连入灭于王舍城
  date: -484-01-01
  year_of: -484
  event_type: death
  description: 约公元前四八四年先佛入灭于王舍城一带，传说为外道所害，示现业报难逃而慈悲不改。
