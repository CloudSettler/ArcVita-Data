  - date: -0523-01-01
    title_zh: 为老宿尼众请平等礼敬
    rationale: 惜长老尼修行久而新学比丘少，欲令依戒腊长老受礼以显修行之德
  - date: -0523-02-01
    title_zh: 闻佛诫后护言不再请
    rationale: 知女人出家则正法减半，唯当护持八敬不犯，以持戒功德令正法多住
events:
- id: guji-瞿昙弥-event-birth
  date: -0600-01-01
  year_of: -600
  title_zh: 生于释迦族为佛姨母
  description: 瞿昙弥为摩耶夫人妹，佛母命终后以乳哺长养太子，多有所益
  location_zh: 迦维罗卫
- id: guji-瞿昙弥-event-first-request
  date: -0526-01-01
  year_of: -526
  title_zh: 迦维罗卫尼拘卢园初请再请被制
  description: 于世尊受岁作衣前后两度礼足请女人出家得四沙门果，世尊皆制止令剃头被袈裟行清净梵行
  location_zh: 迦维罗卫尼拘卢园
- id: guji-瞿昙弥-event-follow-buddha
  date: -0525-01-01
  year_of: -525
  title_zh: 追随世尊至那婆提三请
  description: 闻世尊游人间，与诸老女人随其后至那婆提耆尼舍，三度请出家仍被制，不洗足尘土啼泣立门前，阿难见而往白世尊
  location_zh: 那婆提耆尼舍
- id: guji-瞿昙弥-event-eight-rules
  date: -0524-01-01
  year_of: -524
  title_zh: 阿难代请佛制八敬法得度
  description: 阿难以乳哺之恩及归佛法僧具足信戒闻施慧请命，佛说八重法令尽命不犯，瞿昙弥如戴花鬘顶受，于法律学道受具足为比丘尼
  location_zh: 那婆提
- id: guji-瞿昙弥-event-seniority-dispute
  date: -0523-01-01
  year_of: -523
  title_zh: 领尼众请长幼礼敬受佛诫
  description: 与上尊长老尼众至阿难所，请令新学比丘向老宿尼作礼承事，阿难白佛，佛令护言莫作是言，并说无女出家正法住千岁今减五百岁及男子得五事之教
  location_zh: 那婆提
- id: guji-瞿昙弥-event-death
  date: -0484-01-01
  year_of: -484
  title_zh: 入灭于佛涅槃之前
  description: 尽命奉持八敬不犯，共行梵行成就比丘尼僧团，先于世尊入灭，成就记果之愿
  location_zh: 古印度
