  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E6%84%8F%E7%BB%8F.html
endeavors:
- id: guji-竺法护-endeavor-1
  person_qid: guji-竺法护
  title_zh: 西游求法携梵本东归
  summary_zh: 幼通胡汉之语，立志求法，西游西域诸国，历时数载，求得梵本一百六十五部，携归敦煌洛阳，为译经奠基。
  phases:
  - key: brewing
    name: 敦煌少习胡汉之学
    labels:
      zh: 少年立志
    start_date: 0239-01-01
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 发足西游访求梵本
    labels:
      zh: 西行求法
    start_date: 0266-01-01
    highlight_event_id: guji-竺法护-event-xiyu
  - key: climax
    name: 得梵本百余部东归
    labels:
      zh: 负经东归
    start_date: 0269-01-01
    highlight_event_id: guji-竺法护-event-xiyu
  - key: closure
    name: 安住洛阳筹备传译
    labels:
      zh: 安住待译
    start_date: 0272-01-01
    highlight_event_id: guji-竺法护-event-luoyang
  decisions:
  - date: 0266-01-01
    title_zh: 决意西游求真本
    rationale: 中土旧译多谬，欲得正本，非亲往西域访求不可，故冒艰险西行。
  - date: 0269-01-01
    title_zh: 决意携经归华广传
    rationale: 所获梵本渐丰，独得无益，不如归洛传译，令汉地得闻正法。
- id: guji-竺法护-endeavor-2
  person_qid: guji-竺法护
  title_zh: 洛阳长安译经弘法
  summary_zh: 安住洛阳长安三十余年，延请笔受，译出放光般若正法华等百余部，并译佛说意经，阐明御意之要，广利天人。
  phases:
  - key: brewing
    name: 初至洛阳整理梵本
    labels:
      zh: 整理梵本
    start_date: 0272-01-01
    highlight_event_id: guji-竺法护-event-luoyang
  - key: breakthrough
    name: 开译放光般若正法华
    labels:
      zh: 大译开启
    start_date: 0286-01-01
    highlight_event_id: guji-竺法护-event-luoyang
  - key: climax
    name: 译佛说意经明御意旨
    labels:
      zh: 译说明意
    start_date: 0290-01-01
    highlight_event_id: guji-竺法护-event-yijing-yijing
  - key: closure
    name: 乱中护经终老洛阳
    labels:
      zh: 护法终老
    start_date: 0304-01-01
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0286-01-01
    title_zh: 决意长年开译不辍
    rationale: 梵本既备，时不可失，虽艰难亦当广译，令正法久住。
  - date: 0290-01-01
    title_zh: 决意译出意经示心要
    rationale: 世间为意所牵，众生受苦无知，故译此经，明多闻捷疾聪明之行，教人自御其意。
