    en: Dharmaraksha
  lifespan:
    birth:
      date: 0231-01-01
      precision: year
      is_circa: true
      raw: 约泰始年间生于敦煌
    death:
      date: 0308-01-01
      precision: year
      is_circa: true
      raw: 约永嘉二年卒于洛阳
  birth_date: 0231-01-01
  death_date: 0308-01-01
  era: 西晋
  reign_ref: 晋武帝至晋怀帝之世
  archetype: 弘法译经者
  dilemmas:
  - 胡汉语隔而梵本深奥，如何做到信达不失本义
  - 世乱流离而经卷散亡，如何守护法本令久住中土
  lesson: 以意御心而不随境牵，以译传法而利多人
  summary_first_person: 吾本月氏后裔，生于敦煌，幼通胡汉之语，立志弘法，西游三十六国求得梵本一百六十五部，携归洛阳，长安译经三十余年，共译百余部，愿以汉语传佛心要，令众生自御其意，不为世牵。
