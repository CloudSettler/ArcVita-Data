    rationale: 彼与非沙门俱而诈称沙门上座有定有净若亲近供养则同堕恶趣故须远离
  - date: -0495
    title_zh: 断定真智梵行者长夜饶益安乐应当亲近承事
    rationale: 彼无求欲无恚所行皆善能除他不善立于善中故须恭敬承事常随修学
