  - key: climax
    name: 列无求欲生忍让无恚诸善行
    labels:
      zh: 显扬善行
    start_date: -0495
    highlight_event_id: guji-舍利弗-event-mulian
  - key: closure
    name: 示覆钵美食喻真沙门应承事兼受目连印可
    labels:
