    title_zh: 以知如真为判善恶不以有无求欲为判
    rationale: 同有求欲或同无求欲而善恶相反故须观是否自知精进护根方能断着善终
  - date: -0495
    title_zh: 连用四铜钵喻劝乐行精进
    rationale: 垢钵勤拭则净净钵不拭则垢借日常器用令众直观放逸与护念之果报
- id: guji-舍利弗-endeavor-2
  title_zh: 拣别真伪沙门示亲近取舍立众于善
  summary: 广说求欲所生无量恶法与无求欲所生无量善法教众远离谄幻伪行亲近净行梵行者
  phases:
