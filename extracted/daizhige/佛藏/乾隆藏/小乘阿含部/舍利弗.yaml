  decisions:
  - date: -0485
    title_zh: 闻阿难传命即速退
    rationale: 佛以大众喧闹如捕鱼师为喻而呵止，为全僧威仪护新学初心，故速去衣钵退住树下以示承教
  - date: -0485
    title_zh: 默然受释种请坐
    rationale: 释种优婆塞具足施座然灯相请，昼日露住比丘疲倦，故默然可之，暂安众僧以待佛命，不违居士善心
- id: guji-舍利弗-endeavor-2
  title_zh: 辅佛担荷调伏僧众
  summary: 对佛自陈宿世供僧之念，蒙印可与目连共去重担，亲闻渡流之偈，护持新学令得解脱
  phases:
  - key: brewing
    name: 自念宿世供僧质朴少求
    labels:
      zh:
      - 追念
      - 观机
    start_date: -0485
    highlight_event_id: guji-舍利弗-event-audience
  - key: breakthrough
    name: 蒙佛印可共去重担
    labels:
      zh:
      - 印可
      - 荷担
    start_date: -0485
    highlight_event_id: guji-舍利弗-event-audience
  - key: climax
    name: 亲闻渡流偈众得解脱
    labels:
      zh:
      - 闻法
      - 证果
    start_date: -0485
    highlight_event_id: guji-舍利弗-event-liberation
  - key: closure
    name: 立愿共担护新学不退
    labels:
      zh:
      - 立愿
      - 护众
    start_date: -0485
    highlight_event_id: guji-舍利弗-event-liberation
  decisions:
  - date: -0485
    title_zh: 以知足精进为念蠲除恶念
    rationale: 念比丘质朴少求知足精进，佛为法王调御应机，故正念观察以除轻飘散乱，令众堪受调伏
  - date: -0485
    title_zh: 承佛教止更立共担之愿
    rationale: 佛言去重担唯如来及舍利弗目连，故止息独任之念，转为共助如来敬制僧众，护幼小新学不改志行
events:
- id: guji-舍利弗-event-birth
  title_zh: 生于那罗陀婆罗门家
  date: -0568
  year_of: -568
  description: 生于摩揭陀国那罗陀村婆罗门家，少好智慧，后遇佛出家，成智慧第一上首弟子
- id: guji-舍利弗-event-tour
  title_zh: 游行诸国一年还至药树
  date: -0485
  year_of: -485
  description: 与大目连将五百大比丘游行诸国经历一年，还至释氏舍夷阿摩勒药树园，欲见世尊，着衣持钵声高响逸
- id: guji-舍利弗-event-retreat
  title_zh: 奉佛命退住受释种供养
  date: -0485
  year_of: -485
  description: 佛命阿难勿令喧闹比丘来至，舍利弗目连闻命即退至树下，释种优婆塞设座然灯请住，默然受之以安众
- id: guji-舍利弗-event-audience
  title_zh: 梵天请佛天眼召众复觐
  date: -0485
  year_of: -485
  description: 释种及梵天请佛安住信受比丘众以护新学，佛然可之，目连天眼遥见，率舍利弗及五百比丘复诣佛所稽首退坐
- id: guji-舍利弗-event-liberation
  title_zh: 闻信渡流偈六十比丘漏尽
  date: -0485
  year_of: -485
  description: 佛为舍利弗目连分别去重担之义，说以信渡流无放逸为船圣谛济苦患智慧究竟渡，时六十比丘漏尽意解，无数比丘远尘离垢法眼得生
- id: guji-舍利弗-event-death
  title_zh: 先佛涅槃而入灭
  date: -0484
  year_of: -484
  description: 于佛涅槃之前先入灭，世传还乡度亲报恩后安然示寂，为众弟子作无常示现，僧众追慕其智慧功德
