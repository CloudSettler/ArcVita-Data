person:
  qid: guji-舍利弗
  name_zh: 舍利弗
  names:
    zh: 舍利弗
    en: Sariputra
  lifespan:
    birth:
      date: -0568
      precision: year
      is_circa: true
      raw: 约公元前568年生于摩揭陀那罗陀村婆罗门家
    death:
      date: -0484
      precision: year
      is_circa: true
      raw: 约公元前484年先于佛而入灭
  birth_date: -0568
  death_date: -0484
  era: 古印度十六大国时代
  reign_ref: 摩揭陀国频婆娑罗王至阿阇世王之世
  archetype: 智慧第一的辅教尊者
  dilemmas:
  - 领五百比丘远游归来喧闹失仪与摄众威仪之间如何抉择
  - 佛命勿来退避自省与渴仰觐见不舍初心之间如何承教
  - 自任荷担众生重担与唯推如来及己与目连共担之间如何立位
  lesson: 以信渡流以无放逸为船，以圣谛济苦以智慧究竟，知足少求精进不懈，方能共担僧众重担而护新学不退
  summary_first_person: 我与目连领五百比丘游行一年还至药树，虽因喧闹蒙佛呵止而退住树下，然蒙释种设座相待，梵天请佛安住，目连天眼相召复诣世尊，亲闻以信渡流之偈，见六十比丘漏尽解脱，愿与目连共助如来担荷大众，令新学不改志行
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/小乘阿含部/佛说舍利弗摩诃目连游四衢经.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/小乘阿含部/佛说舍利弗摩诃目连游四衢经.md
