  dilemmas:
  - 独子当续门户与舍家求解脱相违
  - 财宝美色系缚与远离爱欲求泥洹相抉
  lesson: 人生不免老病死贪无厌足唯远离爱欲舍财修道可得解脱
  summary_first_person: 我本黈罗欧吒长者独子，闻佛说法知居家不能自净，绝食五日得父母听许，往舍卫从佛出家，随佛十年证阿罗汉，还乡乞食不为财色所留，为父母及拘猎王说老病死财贪之法
