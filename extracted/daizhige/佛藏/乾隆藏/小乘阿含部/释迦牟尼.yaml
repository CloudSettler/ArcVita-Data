endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 儒童供养锭光佛布发受记
  summary_zh: 为无垢光儒童时论道说法求花供养散花成盖布发掩泥得锭光佛授记后百劫当作佛名释迦文
  phases:
  - key: brewing
    name: 隐居守禅
    labels:
      zh: 隐居山林守玄行禅博通图书秘谶
    start_date: -1000-01-01
    highlight_event_id: guji-释迦牟尼-event-dingguan-shouji
  - key: breakthrough
    name: 祠中论道
    labels:
      zh: 入不楼陀祠七日七夜论道说义众皆欣踊
    start_date: -1000-03-01
    highlight_event_id: guji-释迦牟尼-event-dingguan-shouji
  - key: climax
    name: 散花布发
    labels:
      zh: 以五百银钱买五茎花散佛成盖布发请蹈
    start_date: -1000-04-01
    highlight_event_id: guji-释迦牟尼-event-dingguan-shouji
  - key: closure
    name: 得记作佛
    labels:
      zh: 得锭光授记劫名波陀当作释迦文度脱十方
    start_date: -1000-04-08
    highlight_event_id: guji-释迦牟尼-event-dingguan-shouji
  decisions:
  - date: -1000-04-01
    title_zh: 不求释梵转轮唯求作佛
    rationale: 不慕天王圣主富贵唯愿得成佛度脱十方故倾财买花供养
  - date: -1000-04-01
    title_zh: 布发掩泥请佛蹈之
    rationale: 见地泥泞众难得前愿以身为桥令尊蹈之表舍身求道之诚
- id: guji-释迦牟尼-endeavor-2
  title_zh: 兜术观察降神迦维罗卫示生
  summary_zh: 在一生补处兴四种观化乘白象就母胎摩耶夫人梦象怀妊流民树下右胁而生行七步称天上天下唯我为尊现三十二瑞
  phases:
  - key: brewing
    name: 兜术兴观
    labels:
      zh: 于兜术天上观土地父母国土教化之宜
    start_date: -0564-01-01
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: breakthrough
    name: 乘象入胎
    labels:
      zh: 化乘白象光明照世而来就母胎夫人梦感
    start_date: -0564-04-08
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: climax
    name: 树下滑生
    labels:
      zh: 四月七日游过流民树攀枝右胁生堕地行七步
    start_date: -0563-04-08
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: closure
    name: 现瑞归宫
    labels:
      zh: 龙王浴身释梵侍卫地动花雨三十二瑞还宫立号悉达
    start_date: -0563-04-09
    highlight_event_id: guji-释迦牟尼-event-birth-ruigong
  decisions:
  - date: -0564-01-01
    title_zh: 拣择迦维罗卫白净摩耶为父母
    rationale: 观过去来今诸佛皆生此地中央父母福德堪受大人故往就生
  - date: -0563-04-08
    title_zh: 示现太子而非常人降生
    rationale: 为令众会断疑显宿愿度生之相故现行七步发弘誓安三界苦
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 摩耶夫人流民树下滑生太子
  date: -0563-04-08
  year_of: -563
  place_zh: 迦维罗卫流民树下
  description_zh: 十月已满四月七日夫人出游攀树枝从右胁生堕地行七步举手言天上天下唯我为尊三界皆苦吾当安之天地大动龙王浴身释梵侍卫
- id: guji-释迦牟尼-event-dingguan-shouji
  title_zh: 儒童散花布发得锭光佛授记
  date: -1000-04-01
  year_of: -1000
  place_zh: 提和卫国迎佛道次
  description_zh: 以五茎花散佛止空成盖面七十里布发掩泥请蹈佛笑授记却后百劫当得作佛名释迦文劫名波陀度脱十方如我无异
- id: guji-释迦牟尼-event-birth-ruigong
  title_zh: 抱太子还宫现三十二瑞
  date: -0563-04-09
  year_of: -563
  place_zh: 迦维罗卫宫城
  description_zh: 天降瑞应地动道净枯树生花伏藏发出风霁香雨日月星住地狱休毒孕妇生男百疾除愈十六大国叹未曾有立号悉达为天中天
- id: guji-释迦牟尼-event-ayi-xiang
  title_zh: 道士阿夷飞来相太子涕泣
  date: -0563-04-10
  year_of: -563
  place_zh: 迦维罗卫宫门内
  description_zh: 香山道士见光瑞飞来抱视三十二相八十种好必当成佛自悲七日当终不见说法故泪下说偈太子举手誓度一切
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那城娑罗林中般涅槃
  date: -0483-02-15
  year_of: -483
  place_zh: 拘尸那揭罗娑罗林
  description_zh: 教化五浊功成化毕于娑罗林入般涅槃度脱十方之愿究竟众生瞻仰舍利流布
