events:
- id: guji-释迦牟尼-event-birth
  date: -0563-04-08
  year_of: -563
  title_zh: 迦维罗卫右胁降生
  description: 四月八日夜明星出时摩耶夫人梦白象从右胁入化从右胁生堕地行七步举手言天上天下唯我为尊瑞应三十二种光明彻照阿夷相具三十二大人相
- id: guji-释迦牟尼-event-shouji
  date: -0630-04-01
  year_of: -630
  title_zh: 儒童散华定光授记
  description: 为儒童时以五百银钱从瞿夷得五茎华散佛止空中不堕复以二华寄献住佛肩上布发掩泥定光记九十一劫后贤劫中当作佛名释迦文即得不起法忍升空礼佛
- id: guji-释迦牟尼-event-simen
  date: -0546-01-01
  year_of: -546
  title_zh: 四门分见病老死及沙门
  description: 十四岁后分出东西南门见病人老人死人悲念人生俱有此患回车忧食十七岁纳瞿夷后出北门见沙门法服持钵守戒清净遂念道不宜在家
- id: guji-释迦牟尼-event-chujia
  date: -0544-04-08
  year_of: -544
  title_zh: 夜半逾城阎浮树下别王
  description: 十九岁四月八夜天神厌众睡呼车匿被揵陟鬼神捧足逾城至王田阎浮树下王追至知志固还宫太子见耕出虫乌啄感伤遂贸鹿皮衣遣车匿还以宝冠衣付归
- id: guji-释迦牟尼-event-kuxing
  date: -0544-06-01
  year_of: -544
  title_zh: 渡尼连河贝多树下六年禅定
  description: 逾摩竭界答瓶沙王老病死无人代受之问过三梵志舍水火日月之道起慈悲喜护四心至贝多树处剃发拾槀端坐日食一麻一米修安般出入得一禅行玄清寂默
- id: guji-释迦牟尼-event-death
  date: -0483-02-15
  year_of: -483
  title_zh: 般涅槃
  description: 八十岁化缘既周入般涅槃济度功成
