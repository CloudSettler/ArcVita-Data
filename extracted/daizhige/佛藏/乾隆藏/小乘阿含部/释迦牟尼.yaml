  - title_zh: 世人执色受想行识为坚固常住
    description: 众生恋身心为我见苦集难离当以空观破执
  - title_zh: 直说空性难信须假譬晓悟
    description: 空义深远须借聚沫水泡野马芭蕉幻术令目士谛观得解
  lesson: 观五蕴皆空无来无往不坚固无可依怙则离执取得解脱
  summary_first_person: 我于阿迎阇恒水侧与五百比丘俱见大聚沫为水所漂即告比丘谛观分别色如聚沫痛如水泡想如野马行如芭蕉识如幻术皆空无所有无来无往不坚固汝等若能作是观则能舍色断三法得大智解脱
