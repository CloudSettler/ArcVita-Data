  dilemmas:
  - title_zh: 恃力与归道之抉择
    description: 五百力士恃膂力欲移山立功，我当以神通折伏还是以无常开晓
  - title_zh: 显异与显常之分寸
    description: 既示乳哺神足智慧意行十力威神，复须示现坏败无常以断常执
  lesson: 法起必归尽，万物皆无常，唯道可依，不计吾我
  summary_first_person: 吾于拘夷那竭力士生地临灭度时，见五百力士移山不动惭耻疲竭，即以足指挑石至梵天示乳哺神足智慧意行及十力，令其除慢发无上道意，复说无常付嘱供养舍利建塔
