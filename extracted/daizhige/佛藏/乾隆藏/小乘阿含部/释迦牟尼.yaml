  decisions:
  - date: -528-12-08
    title_zh: 因梵志至即为比丘说结
    rationale: 借外道水净执显心垢未除纵洗无益故先明二十一结过患以破邪见
  - date: -528-12-08
    title_zh: 以慈悲喜舍定义婆罗门内外洗净
    rationale: 不以外水为净而以无恚广大慈悲喜舍遍满十方为净转世俗净观为心地法门
- id: guji-释迦牟尼-endeavor-2
  person_id: guji-释迦牟尼
  title_zh: 折伏计水净梵志令舍水洗归依三宝
  description_zh: 直问沙门瞿昙诣水浴意破一切世间水洗应戒应福应度之说教以持戒清净行不杀盗妄语得等度令梵志归依为优婆塞
  phases:
  - key: brewing
