  lesson: 善解法性知过去因缘，以平等信行讲法默然二业，度众生出生老病死
  summary_first_person: 我是瞿昙，出刹利种，父净饭，母大化，生于迦毗罗卫，坐钵多树下成最正觉，一会说法度千二百五十人，以舍利弗目连为第一弟子，以阿难为侍者，于舍卫华林堂说过去七佛本缘，令闻者欢喜起爱乐心
