  reign_ref: 周景王至周敬王时摩竭陀国郁鞞罗一带
  archetype: 觉者导师型
  dilemmas:
  - 世人执水洗可除恶业而心怀二十一结当如何破外净迷信立内净正见
  - 以慈悲喜舍遍满十方为内洗而又须持戒清净行摄受刚强梵志之难
  lesson: 舍水洗外净执着离二十一结以慈悲喜舍遍满十方并持戒清净行方得真净安隐
  summary_first_person: 吾初成等觉独坐郁鞞罗水岸树下见计水净梵志过中食后彷徉而来执水浴可除恶乃为诸比丘说二十一结喻垢衣与净衣之别示以慈悲喜舍满十方为内外洗净教以不杀不盗不妄语持戒清净行令彼舍邪见归依佛法僧为优婆塞
