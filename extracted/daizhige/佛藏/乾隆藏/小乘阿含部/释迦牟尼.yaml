  dilemmas:
  - 四婆罗门具五通精进修善仍畏死求逃，我当如何令众知神通不敌业果无常
  - 众生欲住空海山地以求不死，我当如何以天眼实证与偈言开示无逃之处
  lesson: 非空非海非山石，无有地方可脱死，唯观无常正法可得解脱
  summary_first_person: 我为婆伽婆，一时在舍卫城祇树给孤独园，我以清净天眼见四婆罗门仙人精进具五通而畏死，一入空一入海一入山腹一入地皆于彼命终，遂告诸比丘说偈言无有地方可脱不受死，令众知无常不可逃而欢喜奉行
