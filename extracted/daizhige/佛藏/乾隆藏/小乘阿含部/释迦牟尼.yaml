  name_zh: 释迦牟尼
  names:
    zh: 释迦牟尼
    en: Shakyamuni Buddha
  lifespan:
    birth:
      date: -0563-04-08
      precision: day
      is_circa: true
      raw: 周昭王二十四年甲寅四月初八蓝毗尼园诞生
    death:
      date: -0483-02-15
      precision: day
      is_circa: true
      raw: 周敬王年间二月十五拘尸那罗娑罗林般涅槃
  birth_date: -0563-04-08
  death_date: -0483-02-15
  era: 春秋末战国初
  reign_ref: 东周周景王至周敬王之际
  archetype: 次第化导的觉者导师
  dilemmas:
  - 有涅槃有道而受教者得失不同，师当如何自处
  - 次第教授不躐等与众生欲速成之间的张力
  lesson: 道虽同而行在各人，师但指路，次第修学，不舍教授而听其自择
  summary_first_person: 我是瞿昙释迦，一时在舍卫城东园鹿母讲堂，数婆罗门问我法律以何次第教授，我告以戒定慧次第学，又以罗阅祇道路为喻，明涅槃虽在、道虽存，得与不得在受教行与不行，彼闻已欢喜归依，我但尽教授之责
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E6%95%B0%E7%BB%8F.html
endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 舍卫东园次第教授比丘戒定慧
  summary_zh: 对初学比丘先净身口意行，次观身受心法，守护根门，正知而行，静处离盖，住于四禅，次第学成
  phases:
  - key: brewing
    name: 净行奠基
    labels:
      zh: 净身口意
    start_date: -0528-01-01
    highlight_event_id: guji-释迦牟尼-event-sravasti-cidi
  - key: breakthrough
    name: 守护根门
    labels:
      zh: 护眼耳鼻舌身意
    start_date: -0525-01-01
    highlight_event_id: guji-释迦牟尼-event-sravasti-cidi
  - key: climax
    name: 正知离盖住禅
    labels:
      zh: 四念处四禅
    start_date: -0525-06-01
    highlight_event_id: guji-释迦牟尼-event-sravasti-cidi
  - key: closure
    name: 摄受上尊无懈行道
    labels:
      zh: 尽漏近涅槃
    start_date: -0524-01-01
    highlight_event_id: guji-释迦牟尼-event-sravasti-cidi
  decisions:
  - date: -0525-01-01
    title_zh: 定次第而不顿授
    rationale: 如讲堂层层而上，御象羁马皆次第学，故先教净行后教禅观
  - date: -0525-06-01
    title_zh: 以无上御者自任而听其行
    rationale: 师但教授指路，行与不行在弟子，不以得失废教
- id: guji-释迦牟尼-endeavor-2
  title_zh: 以罗阅祇道路喻开示涅槃道摄受数婆罗门
  summary_zh: 反问数婆罗门善知罗阅祇道而行者有至有不至，以喻涅槃与涅槃道虽存而得失在人，令其伏信归依为优婆塞
  phases:
  - key: brewing
    name: 酬数问发端
    labels:
      zh: 鹿母讲堂问答
    start_date: -0525-01-01
    highlight_event_id: guji-释迦牟尼-event-rajagriha-metu
  - key: breakthrough
    name: 反问道路喻
    labels:
      zh: 罗阅祇之喻
    start_date: -0525-03-01
    highlight_event_id: guji-释迦牟尼-event-rajagriha-metu
  - key: climax
    name: 明涅槃道存而得失在行
    labels:
      zh: 一向一不一向
    start_date: -0525-04-01
    highlight_event_id: guji-释迦牟尼-event-rajagriha-metu
  - key: closure
    name: 婆罗门叹法归依
    labels:
      zh: 自归受优婆塞戒
    start_date: -0525-05-01
    highlight_event_id: guji-释迦牟尼-event-conversion
  decisions:
  - date: -0525-03-01
    title_zh: 以彼所知数与道路反诘
    rationale: 彼善知算数与罗阅祇道，即以其业喻我法，令其自悟师同而行异
  - date: -0525-05-01
    title_zh: 纳其归依而不强其出家
    rationale: 知其根堪为清信，令持优婆塞戒离杀自归，护其梵行清净
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼园诞生
  date: -0563-04-08
  year_of: -563
  place_zh: 迦毗罗卫蓝毗尼园
  description: 周昭王之世，摩耶夫人产太子悉达多，后出家成佛，号瞿昙世尊
- id: guji-释迦牟尼-event-sravasti-cidi
  title_zh: 舍卫东园说次第教授法
  date: -0525-01-01
  year_of: -525
  place_zh: 舍卫城东园鹿母讲堂
  description: 对数婆罗门及目犍连说讲堂层层、御象学钩之喻，开示比丘净行、守护根门、正知、离五盖住四禅之次第
- id: guji-释迦牟尼-event-rajagriha-metu
  title_zh: 说罗阅祇道路喻明涅槃道
  date: -0525-03-01
  year_of: -525
  place_zh: 舍卫城东园鹿母讲堂
  description: 以善知罗阅祇道者教授而行者有至有迷为喻，明有涅槃有道而我住教授，得失在受教与否
- id: guji-释迦牟尼-event-conversion
  title_zh: 数婆罗门叹法自归为优婆塞
  date: -0525-05-01
  year_of: -525
  place_zh: 舍卫城东园鹿母讲堂
  description: 数目犍连婆罗门闻娑罗林、根香栴檀等喻，叹沙门瞿昙论摄一切论，自归佛法僧，受优婆塞戒离杀生
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那罗娑罗林般涅槃
  date: -0483-02-15
  year_of: -483
  place_zh: 拘尸那罗娑罗林
  description: 化缘既毕，于娑罗双树间入般涅槃，众弟子依次第教授相续修行
