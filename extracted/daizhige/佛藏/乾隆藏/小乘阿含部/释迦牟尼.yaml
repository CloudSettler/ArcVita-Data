- id: guji-释迦牟尼-event-chanpo-guanxin
  title_zh: 瞻婆池上观心默然
  date: '-490'
  year_of: -490
  location_zh: 瞻婆恒伽上法赖池水上
  summary_zh: 十五日说戒夜坐僧前观诸比丘意念，异比丘三请说戒皆默然住以待显秽
- id: guji-释迦牟尼-event-zhishoujie
  title_zh: 告众有不净制僧自说戒
  date: '-490'
  year_of: -490
  location_zh: 瞻婆恒伽上法赖池水上
  summary_zh: 明告众中有不净，目干连以三昧观牵秽者臂出门外反闭门，世尊敕自今汝等当共说戒如来不复说
- id: guji-释迦牟尼-event-sanyu-jie
  title_zh: 三喻说偈摈秽护净
  date: '-490'
  year_of: -490
  location_zh: 瞻婆恒伽上法赖池水上
  summary_zh: 说麦田拔恶草谷场扬糠秕利斧斫枯树通水三喻，又说偈共止恶求嗔恚幻谀者当摈弃不共止，诸比丘闻说欢喜而乐
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那罗涅槃
  date: '-483'
  year_of: -483
  location_zh: 拘尸那罗娑罗林
  summary_zh: 化缘既毕入无余涅槃，法付僧众共持共说
