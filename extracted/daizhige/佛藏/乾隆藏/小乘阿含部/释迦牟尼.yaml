    start_date: -528-12-15
    highlight_event_id: guji-释迦牟尼-event-shuijing
  - key: breakthrough
    name: 诘水何能净恶行指坚牢净在持戒
    labels:
      zh: 诘水显戒
    start_date: -528-12-15
    highlight_event_id: guji-释迦牟尼-event-shuijing
  - key: climax
    name: 教住善法得安隐不须弊恶水
    labels:
      zh: 舍水住善
    start_date: -528-12-15
    highlight_event_id: guji-释迦牟尼-event-shuijing
  - key: closure
    name: 梵志欢喜归依佛法僧受优婆塞戒
    labels:
      zh: 归依受戒
    start_date: -528-12-15
    highlight_event_id: guji-释迦牟尼-event-shuijing
  decisions:
  - date: -528-12-15
    title_zh: 不许水能除黑黑行
    rationale: 人作诸恶行水无能净唯持戒清净行常得应戒故须破水净增上慢
  - date: -528-12-15
    title_zh: 授优婆塞归依离杀
    rationale: 梵志已竟已知净善法不在水当摄受令尽命归佛受持善法得安隐
