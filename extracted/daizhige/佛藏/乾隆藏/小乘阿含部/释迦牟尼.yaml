events:
- id: guji-释迦牟尼-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 诞生于迦毗罗卫
  description: 释迦族净饭王子诞生后出家成道为天人师
- id: guji-释迦牟尼-event-preach
  date: -522-03-01
  year_of: -522
  title_zh: 舍卫祇洹说天眼善恶业报
  description: 于舍卫祇洹阿难邠坻诫诸沙门以天眼见天下人死有上天入泥犁者如瞑夜观火高楼望家清水见鱼
- id: guji-释迦牟尼-event-hell
  date: -522-03-15
  year_of: -522
  title_zh: 说铁城八泥犁及阎罗审罪
  description: 说不孝父母不事沙门者见阎罗五问后入阿鼻摩等八铁城历火釜热地铁虫利山热风刺树食身沸水消铜之苦久乃得出劝令改过生善
- id: guji-释迦牟尼-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 涅槃于拘尸那
  description: 化缘既毕于拘尸那娑罗林中入涅槃遗教以戒为师
