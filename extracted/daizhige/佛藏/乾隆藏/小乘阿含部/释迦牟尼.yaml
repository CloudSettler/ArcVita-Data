  archetype: 开教立制护净之圣哲
  dilemmas:
  - 众中藏秽而布萨时至，说戒则污法，默然则稽众，当如何抉择
  - 秽者自称梵行滥厕清流，慈悲摄受与严摈护净，当如何权衡
  lesson: 众有不净则法不得不宣，护净在敢摈，立制在舍亲宣而归众共持，喻如去稗扬糠斫枯，方能全清净僧
  summary_first_person: 吾是释迦牟尼，一时在瞻婆恒伽上法赖池水上会众说戒，观众心有不净故三时默然，令目干连摈出秽者，自今令僧自共说戒，更以三喻及偈教授令护净众弃恶会善
