events:
- id: guji-释迦牟尼-event-birth
  title_zh: 诞生迦毗罗卫
  date: -563
  year_of: -563
  location_zh: 迦毗罗卫蓝毗尼园
  description: 释种悉达多诞生，后出家成等正觉号释迦牟尼
- id: guji-释迦牟尼-event-move-rock
  title_zh: 拘夷那竭足指移山
  date: -483
  year_of: -483
  location_zh: 拘夷那竭力士生地大丛树间
  description: 五百力士移方六十丈高百二十丈大石一月不动，佛以右足大指挑至梵天抟置虚空，三千大千世界六返震动
- id: guji-释迦牟尼-event-teach-powers
  title_zh: 开示乳哺神足智慧意行十力
  date: -483
  year_of: -483
  location_zh: 拘夷那竭大丛树间
  description: 依次说牛力至如来乳哺力，目连神足不及如来，舍利弗智慧不及如来，雨渧归海意行无碍及十种力处处明审
- id: guji-释迦牟尼-event-vow-bodhi
  title_zh: 力士除慢发无上道意
  date: -483
  year_of: -483
  location_zh: 拘夷那竭力士生地
  description: 五百力士知世无常贡高即除皆发无上正真道意立不退转，天人远尘离垢得法眼净
- id: guji-释迦牟尼-event-death
  title_zh: 力士生地夜半灭度
  date: -483
  year_of: -483
  location_zh: 拘夷那竭力士生地四衢路
  description: 开示无常力最胜金刚身亦归坏败，当夜半取灭度付嘱供养舍利兴建塔寺
