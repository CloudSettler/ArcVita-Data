  - 独求寂静解脱与愍伤世间长流爱欲海之张力
  lesson: 虚心乐静损己布施累劫勤苦终成正觉以安三界
  summary_first_person: 我本凡人初求佛道以来精神受形周遍五道勤苦累劫承事诸佛于锭光佛所得授记当为释迦文今自兜术降神迦维罗卫为白净王太子天上天下唯我为尊誓安三界一切众生
