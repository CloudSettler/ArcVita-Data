  era: 春秋末期
  reign_ref: 拘萨罗国波斯匿王时期
  archetype: 觉者导师
  dilemmas:
  - 生死以何为本以何为习如何断苦集
  - 痛色身见执我为身如何破执得离著
  lesson: 生死皆从因缘起，观其习没苦乐出要，不计痛色为我，离著即得慧解脱
  summary_first_person: 吾在拘类国法治处，为阿难说生死本习，从老死逆溯生有受爱，乃至识与名字相依而住，复破痛色为身之见，开示七识住二受行八解脱，令观习没出要而不复执著
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E4%BA%BA%E6%9C%AC%E6%AC%B2%E7%94%9F%E7%BB%8F.html
endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 拘类国宣说十二因缘开示人本欲生
  summary: 在拘类国应阿难所问，逆顺观察老死生有受爱求利乃至守斗诤之流转，及眼耳鼻舌身心触受名色识相依，开示生死甚深微妙本习
  phases:
  - key: brewing
    name: 阿难独念生死微妙
    labels:
      zh: 缘起发问
    start_date: -0485-01-01
    highlight_event_id: guji-释迦牟尼-event-teach-paticca
  - key: breakthrough
    name: 逆溯老死至爱求
    labels:
      zh: 十二因缘
    start_date: -0485-01-01
    highlight_event_id: guji-释迦牟尼-event-teach-paticca
  - key: climax
    name: 更触名字识相依
    labels:
      zh: 触受名色
    start_date: -0485-01-01
    highlight_event_id: guji-释迦牟尼-event-teach-paticca
  - key: closure
    name: 止诤以慧莫受
    labels:
      zh: 缘起正见
    start_date: -0485-01-02
    highlight_event_id: guji-释迦牟尼-event-teach-paticca
  decisions:
  - date: -0485-01-01
    title_zh: 斥易见说示甚深
    rationale: 阿难谓分明易现，故直示从有本生死深微妙，令不轻心慢法
  - date: -0485-01-01
    title_zh: 以无有设难显缘生
    rationale: 以无生则无老死无有则无生等反显，令知此有故彼有此无故彼无
- id: guji-释迦牟尼-endeavor-2
  title_zh: 开示痛色身见七识住八解脱得离著
  summary: 破以痛色为身及不觉为身诸见，开示七识止处二受行及八解脱处，令知习没乐苦出要，得无所著慧解脱两行解脱
  phases:
  - key: brewing
    name: 析三痛破痛即身
    labels:
      zh: 破身见
    start_date: -0485-01-02
    highlight_event_id: guji-释迦牟尼-event-teach-vimokkha
  - key: breakthrough
    name: 析四色相破色即身
    labels:
      zh: 色身观
    start_date: -0485-01-02
    highlight_event_id: guji-释迦牟尼-event-teach-vimokkha
  - key: climax
    name: 示七识住二受行
    labels:
      zh: 识住解脱
    start_date: -0485-01-03
    highlight_event_id: guji-释迦牟尼-event-teach-vimokkha
  - key: closure
    name: 示八解脱得两行解脱
    labels:
      zh: 慧解脱
    start_date: -0485-01-03
    highlight_event_id: guji-释迦牟尼-event-teach-vimokkha
  decisions:
  - date: -0485-01-02
    title_zh: 以三痛非常破身见
    rationale: 乐苦不苦不乐互为生灭离身，故不应计痛为身或身更痛
  - date: -0485-01-03
    title_zh: 令观识住没出要而不住
    rationale: 七识住二受行皆当知习没乐苦出要，故不可求望住处，当以谛慧得无著解脱
