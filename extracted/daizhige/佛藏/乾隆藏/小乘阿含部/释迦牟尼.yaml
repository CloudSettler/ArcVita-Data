    title_zh: 以天眼观证示现业果
    rationale: 不凭空论断，以实见四人分处四境皆死，破神通可避死之念
  - date: -491-06-02
    title_zh: 以偈总持说无逃处
    rationale: 以简要偈言总摄无常，使比丘易持易传，断畏死外求之心
