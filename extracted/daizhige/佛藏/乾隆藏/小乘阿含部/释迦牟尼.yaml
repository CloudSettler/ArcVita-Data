endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 瞻婆布萨观心止戒
  summary_zh: 在瞻婆法赖池上十五日说戒，观知众有不净，三请默然不宣，敕示秽在众中，遂制如来不复亲说戒而令僧自共说戒
  phases:
  - key: brewing
    name: 临池会众观心
    labels:
      zh: 观心待机
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-chanpo-guanxin
  - key: breakthrough
    name: 三时默然显秽
    labels:
      zh: 默然拒宣
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-chanpo-guanxin
  - key: climax
    name: 明告众有不净
    labels:
      zh: 当众揭秽
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-zhishoujie
  - key: closure
    name: 制令僧自说戒
    labels:
      zh: 立制授僧
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-zhishoujie
  decisions:
  - date: '-490'
    title_zh: 夜三请而三默然
    rationale: 以默止显法之清净性，不与秽共宣，令众自省待摈
  - date: '-490'
    title_zh: 制自今僧自共说戒
    rationale: 秽者触娆世尊及僧，若强说则其头破七分，故舍亲说以护众并全制体
- id: guji-释迦牟尼-endeavor-2
  title_zh: 护净三喻摈秽教授
  summary_zh: 赞目干连摈出秽苾刍，反闭门户，复以麦田去恶草谷场扬糠秕利斧斫枯树三喻，明自称梵行之伪当弃于外，终说偈令不与恶共止数数集会弃苦际
  phases:
  - key: brewing
    name: 呵伪称梵行之过
    labels:
      zh: 呵伪立界
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-sanyu-jie
  - key: breakthrough
    name: 稻麦田去恶草喻
    labels:
      zh: 去稗护苗
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-sanyu-jie
  - key: climax
    name: 谷积扬风斧斫枯木喻
    labels:
      zh: 扬糠斫枯
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-sanyu-jie
  - key: closure
    name: 说偈令摈弃共住
    labels:
      zh: 说偈摈恶
    start_date: '-490'
    highlight_event_id: guji-释迦牟尼-event-sanyu-jie
  decisions:
  - date: '-490'
    title_zh: 以三喻立摈出之理
    rationale: 恐坏余净比丘如恶草坏麦，故未子当弃成子更拔，扬去糠叶斫去枯朽以通法水
  - date: '-490'
    title_zh: 说偈明不与恶会
    rationale: 恶求嗔恚幻谀诈称沙门者知时具净行者当分别摈弃，日日集会清众以弃苦际
