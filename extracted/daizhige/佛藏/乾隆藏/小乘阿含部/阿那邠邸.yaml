endeavors:
- id: guji-阿那邠邸-endeavor-1
  title_zh: 赐金劝化七子皈戒
  summary_zh: 七子无笃信不归三宝不改五恶，劝诫不从，乃各悬千两金令受三皈五戒，复诣佛问功德获四宝藏喻。
  phases:
  - key: brewing
    name: 七子无信
