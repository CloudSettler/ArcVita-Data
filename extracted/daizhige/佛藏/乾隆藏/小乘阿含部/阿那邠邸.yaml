    start_date: -0496
    highlight_event_id: guji-阿那邠邸-event-urge
  - key: breakthrough
    name: 悬赏受戒
    labels:
      zh: 以财摄机
    start_date: -0495
    highlight_event_id: guji-阿那邠邸-event-urge
  - key: climax
    name: 诣佛问报
    labels:
      zh: 取证功德
    start_date: -0495
    highlight_event_id: guji-阿那邠邸-event-ask
  - key: closure
    name: 皈戒成就
    labels:
      zh: 为闻法作本
    start_date: -0495
    highlight_event_id: guji-阿那邠邸-event-ask
  decisions:
  - date: -0495
    title_zh: 各赐千两金令皈戒
    rationale: 子不堪任空劝无益，先以欲钩牵令受三皈五戒，后可渐令入法。
  - date: -0495
    title_zh: 携七子诣祇园问佛
    rationale: 既受皈戒须证信功德，以佛四藏喻明福不可量，为后设斋闻法张本。
- id: guji-阿那邠邸-endeavor-2
  title_zh: 设斋请佛说法证果
  summary_zh: 于舍卫宅设甘露饮食供佛及僧，为七子请法，闻苦习尽道得法眼，自归佛法僧受五戒欢喜奉行。
  phases:
  - key: brewing
    name: 默然受请
    labels:
      zh: 设供发心
    start_date: -0494
    highlight_event_id: guji-阿那邠邸-event-feast
  - key: breakthrough
    name: 入城就座
    labels:
      zh: 斋僧供养
    start_date: -0494
    highlight_event_id: guji-阿那邠邸-event-feast
  - key: climax
    name: 坐上见法
    labels:
      zh: 闻法得眼
    start_date: -0494
    highlight_event_id: guji-阿那邠邸-event-feast
  - key: closure
    name: 重说奉行
    labels:
      zh: 欢喜而去
    start_date: -0494
    highlight_event_id: guji-阿那邠邸-event-feast
  decisions:
  - date: -0494
    title_zh: 为七子设斋请佛及僧
    rationale: 财摄已竟须法摄，设供为缘请佛说法使逮等见。
  - date: -0494
    title_zh: 食竟请法令至心听
    rationale: 知子堪受苦习尽道之说，趁供养心软令其尘垢尽无狐疑自归受戒。
events:
- id: guji-阿那邠邸-event-birth
  title_zh: 舍卫富室诞生须达多
  date: '-0545'
  year_of: -545
  place_zh: 拘萨罗国舍卫城
  summary_zh: 生于舍卫巨富之家，后以周济孤独得名给孤独，归佛为优婆塞建祇树给孤独园。
- id: guji-阿那邠邸-event-urge
  title_zh: 赐千金劝七子皈戒
  date: -0495
  year_of: -495
  place_zh: 舍卫城宅
  summary_zh: 七子不归佛法僧不改五恶，父告以皈戒不从，乃各赐千两金使归命佛法僧受持五戒。
- id: guji-阿那邠邸-event-ask
  title_zh: 诣祇园问七子功德
  date: -0495
  year_of: -495
  place_zh: 舍卫祇树给孤独园
  summary_zh: 诣世尊所问七子受皈戒有何福，佛以伊罗钵多罗般筹宾伽罗蠰伽四大宝藏喻明功德不可称计并说偈。
- id: guji-阿那邠邸-event-feast
  title_zh: 设斋闻法七子得法眼
  date: -0494
  year_of: -494
  place_zh: 舍卫城阿那邠邸宅
  summary_zh: 设甘露饮食供佛及僧，为七子供养请法，佛说苦习尽道，七子各于坐上尘垢尽得法眼自归受戒欢喜奉行。
- id: guji-阿那邠邸-event-death
  title_zh: 舍卫示寂
  date: '-0475'
  year_of: -475
  place_zh: 舍卫城
  summary_zh: 护持佛法布施终身后示寂，舍卫居士化家之行载于阿那邠邸化七子经。
