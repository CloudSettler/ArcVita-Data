person:
  qid: guji-阿难
  name_zh: 阿难
  names:
    zh: 阿难
    en: Ananda
  lifespan:
    birth:
      date: '-544'
      precision: year
      is_circa: true
      raw: 约公元前五四四年
    death:
      date: '-463'
      precision: year
      is_circa: true
      raw: 约公元前四六三年
  birth_date: '-544'
  death_date: '-463'
  era: 古印度列国时代
  reign_ref: 释迦牟尼在世时期
  archetype: 多闻侍者型圣弟子
  dilemmas:
  - 善恶追人如影逐形，如何令狐疑犹豫众生谛信不迷所在常安
  - 师弟之义义感自然，如何恭敬道德之人不生嫉妒不以小过证人大罪
  - 末世弟子理家涉世，如何持五戒行世间事而不行世间意卜问祠祀
  lesson: 谛信持戒敬师敬法，善恶由心祸福自召，守信奉行则天龙拥护常安，违犯狐疑则衰耗堕落
  summary_first_person: 我是阿难，常侍佛侧，见人事佛吉凶不等，故启问世尊分别善恶教杀向师理家之义，闻佛言善恶如影逐形罪福有证，受教奉行普为宣示，愿众生报佛恩而得脱苦
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E5%B0%8F%E4%B9%98%E9%98%BF%E5%90%AB%E9%83%A8/%E9%98%BF%E9%9A%BE%E5%88%86%E5%88%AB%E7%BB%8F.html
endeavors:
- id: guji-阿难-endeavor-1
  title_zh: 侍佛请问分别善恶业报
  summary: 侍奉世尊，多番启问事佛吉凶、教人杀生、恶意向师之罪，记录分别以警迷谬
  phases:
  - key: brewing
    name: 观察事佛吉凶不等而启问
    labels:
      zh:
      - 侍佛
      - 启问
    start_date: '-520'
    highlight_event_id: guji-阿难-event-ask-fortune
  - key: breakthrough
    name: 得闻真伪弟子分别而谛信
    labels:
      zh:
      - 持戒
      - 谛信
    start_date: '-510'
    highlight_event_id: guji-阿难-event-ask-fortune
  - key: climax
    name: 再问教杀与谤师重罪
    labels:
      zh:
      - 问杀
      - 敬师
    start_date: '-505'
    highlight_event_id: guji-阿难-event-ask-killing
  - key: closure
    name: 请问末世理家世事世意
    labels:
      zh:
      - 理家
      - 持戒
    start_date: '-500'
    highlight_event_id: guji-阿难-event-ask-household
  decisions:
  - date: '-510'
    title_zh: 直问事佛富贵衰耗不等之由
    rationale: 不达之人谓事佛致衰，故须明辨真伪弟子持犯之异以断狐疑
  - date: '-505'
    title_zh: 追问不自手杀而教人杀是否有罪
    rationale: 世人以不自手为无罪，故须明教杀重于自杀阴怀逆害之理
  - date: '-500'
    title_zh: 请问末世弟子理家便宜
    rationale: 为令受戒弟子养亲处世而不卜问祠祀，故分别世间事与世间意
- id: guji-阿难-endeavor-2
  title_zh: 班宣法教作福田传持
  summary: 受佛教诲班宣法教示现人民，为作福田令信者得值后生无忧
  phases:
  - key: brewing
    name: 受命报恩示现人民
    labels:
      zh:
      - 受教
      - 报恩
    start_date: '-500'
    highlight_event_id: guji-阿难-event-ask-household
  - key: breakthrough
    name: 闻法整衣礼佛发愿普闻
    labels:
      zh:
      - 奉行
      - 普闻
    start_date: '-499'
    highlight_event_id: guji-阿难-event-preach-verse
  - key: climax
    name: 因事说偈明罪福证验
    labels:
      zh:
      - 说偈
      - 明报
    start_date: '-499'
    highlight_event_id: guji-阿难-event-preach-verse
  - key: closure
    name: 大众信解受教而去
    labels:
      zh:
      - 信解
      - 得度
    start_date: '-498'
    highlight_event_id: guji-阿难-event-preach-verse
  decisions:
  - date: '-499'
    title_zh: 受教奉行普闻法音
    rationale: 佛言经法难闻侍佛当报恩，故发心为作桥梁宣示道地
  - date: '-499'
    title_zh: 堕泪说偈陈三界护恩与罪福流转
    rationale: 悯末世多恶不信，故以偈颂明五福超升与三涂巨劫之证劝众向善
events:
- id: guji-阿难-event-birth
  date: '-544'
  year_of: -544
  title_zh: 阿难诞生
  description: 释种出身，佛之堂弟，后出家为佛侍者，多闻第一
- id: guji-阿难-event-ask-fortune
  date: '-510'
  year_of: -510
  title_zh: 启问事佛吉凶不等
  description: 阿难白佛有人事佛得富贵谐利有人衰耗不偶，佛分别真伪弟子持犯恭慢之异，明善恶如影逐形
- id: guji-阿难-event-ask-killing
  date: '-505'
  year_of: -505
  title_zh: 启问教杀与恶向师罪
  description: 阿难问不自手杀而教人杀及恶意向师道德人之罪，佛言教杀重于自杀犯五逆，恶意向道德人痛剧弩射身，师弟当相许如己
- id: guji-阿难-event-ask-household
  date: '-500'
  year_of: -500
  title_zh: 启问末世理家世事世意
  description: 阿难问末世弟子理家因缘，佛许贩利平斗直尺葬送姻娶为世间事，禁卜问祠祀择日为世间意，令启三尊持五戒
- id: guji-阿难-event-preach-verse
  date: '-499'
  year_of: -499
  title_zh: 闻法说偈普令得度
  description: 阿难闻说整袈裟礼佛，堕泪说偈陈佛恩广大罪福分明，国王臣民天龙鬼神且悲且喜稽首受教而去
- id: guji-阿难-event-death
  date: '-463'
  year_of: -463
  title_zh: 阿难示寂
  description: 佛灭后结集经藏传持法眼，住世度众后入灭，舍利传供后世
