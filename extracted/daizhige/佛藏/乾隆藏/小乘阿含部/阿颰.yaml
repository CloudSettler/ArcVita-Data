      - 心服
    start_date: '-0550'
    highlight_event_id: guji-阿颰-event-debate
  decisions:
  - date: '-0550'
    title_zh: 独自彷徨观相不遽礼
    rationale: 欲以三十二相验佛真伪故先观后问
  - date: '-0550'
    title_zh: 直陈师教八戒请较佛戒
    rationale: 欲明梵志法与佛法优劣故发问求决
- id: guji-阿颰-endeavor-2
  title_zh: 归陈佛语引师归依
  summary_zh: 还舍具说佛语不增减，引费迦沙设供请佛重说，举家五百弟子同受三自归持五戒，师后得不还果。
  phases:
  - key: brewing
