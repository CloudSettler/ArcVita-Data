  title_zh: 率众观佛论辩种姓
  summary_zh: 奉师命率五百弟子往鼓车城外树下观佛三十二相，问难袈裟持钵、杀生仁义、继嗣亲疏及四姓贵贱，三诘祖母婢子默然理屈。
  phases:
  - key: brewing
    name: 闻佛名起疑请行
    labels:
