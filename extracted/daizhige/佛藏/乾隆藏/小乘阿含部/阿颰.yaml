  decisions:
  - date: '-0550'
    title_zh: 不受留饭即归报师
    rationale: 佛坐树下了无所有知可饭时故遣还会合时宜
  - date: '-0550'
    title_zh: 如实转述不增减迎师自往
    rationale: 信佛语胜梵志法恐种姓慢障故劝师亲验
events:
- id: guji-阿颰-event-birth
  title_zh: 生于梵志家为费迦沙首弟子
  date: '-0600'
  year_of: -600
  place_zh: 越只国鼓车城
  description_zh: 生于梵志族，通晓经书，列费迦沙五百弟子之首，才智见称于众。
- id: guji-阿颰-event-meet
  title_zh: 率五百弟子往观佛相
  date: '-0550'
  year_of: -550
  place_zh: 越只国鼓车城外树下
  description_zh: 闻佛与五百沙门俱游至此，与五百弟子俱往，下车揖让就座，独自左右观佛三十二相，佛起并行以知其意，遂问出家持钵之义。
- id: guji-阿颰-event-debate
  title_zh: 三问种姓默然折服
  date: '-0550'
  year_of: -550
  place_zh: 鼓车城外佛座前
  description_zh: 问杀生仁义、继嗣亲疏、四姓贵贱，佛以婢子为后、父母贵贱学谁家、上坐下坐、捕盗问罪为喻，三问其祖默然无对，金刚力士举杵诘问乃服，众叹佛圣智。
- id: guji-阿颰-event-return
  title_zh: 还舍具说引师设供重请
  date: '-0550'
  year_of: -550
  place_zh: 鼓车城费迦沙舍
  description_zh: 接佛足而还，向师具说昨日所语无一失，师初怒后施床席办供，遣阿颰迎佛与五百沙门俱就舍施饭行水，重闻佛说心喜稽首。
- id: guji-阿颰-event-refuge
  title_zh: 举众受三归持五戒
  date: '-0550'
  year_of: -550
  place_zh: 费迦沙舍佛座前
  description_zh: 与师及昆弟妻子诸家同礼佛足，受三自归，与五百人俱持五戒，意志已固，师后命终得第三不还生阿那含天。
- id: guji-阿颰-event-death
  title_zh: 持戒终老趣善道
  date: '-0500'
  year_of: -500
  place_zh: 越只国鼓车城
  description_zh: 一生持佛清信士五戒，去恶就善，寿终归于善处，事迹载于梵志阿颰经。
