  lesson: 舍种姓憍慢以戒慧求无为解脱
  summary_first_person: 我是梵志阿颰，为越只国豪贤费迦沙五百弟子之首，昔奉命率众往鼓车城外观佛相好，三问种姓杀生继嗣皆被折服，方知贵在戒行不在血统，还舍具陈佛语，引师同设供请法，举众归依三宝受持五戒，愿断贪嗔痴而趣无为。
