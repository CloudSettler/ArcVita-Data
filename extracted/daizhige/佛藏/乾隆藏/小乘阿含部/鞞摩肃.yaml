  lesson: 莫执色光为最胜，当观缘尽法生，离疑见法乃得解脱
  summary_first_person: 我本异学鞞摩肃，姓迦旃延，曾于舍卫祇园以色妙光明问难世尊，蒙佛次第开示萤火油灯积火星月日光，转闻五欲假合与灯尽薪尽之喻，远尘离垢得法眼净，遂出家受具足，行梵行而成阿罗汉，欢喜奉行。
