    labels:
      zh: 突破
    start_date: '-500'
    highlight_event_id: guji-頞波罗延-event-meet-buddha
  decisions:
  - date: '-500'
    title_zh: 许代五百人问佛
    rationale: 不忍违师礼众请，且欲验佛所说天下一种之正否，故决意同诣祇树给孤独园
- id: guji-頞波罗延-endeavor-2
  title_zh: 祇园论难折伏归依
  summary_zh: 入园问佛四种异同，佛以通婚生子骡駏驉为喻，以十恶生天堕狱浴垢渡船怀胎日月国王征才等难破口生之说，我自念前后被遮，遂与众人悟业行为本头面礼足归依
  phases:
  - key: climax
    name: 与佛往复论种
    labels:
      zh: 高潮
    start_date: '-500'
    highlight_event_id: guji-頞波罗延-event-doctrinal-debate
  - key: closure
    name: 礼足归依检敛
    labels:
      zh: 收束
    start_date: '-500'
    highlight_event_id: guji-頞波罗延-event-refuge
  decisions:
  - date: '-500'
    title_zh: 舍种姓说从业行义
    rationale: 见佛喻证种类从心意识出善恶定升堕，自知旧说无据，故舍贡高归正道请哀护检敛
events:
- id: guji-頞波罗延-event-birth
  title_zh: 生于舍卫婆罗门家
  date: '-515'
  year_of: -515
  place_zh: 舍卫城
  description_zh: 生于婆罗门家，具奇相，年十五六已明工书知经晓天下事，为五百婆罗门所师事
- id: guji-頞波罗延-event-debate-invite
  title_zh: 田庐被推为论主
  date: '-500'
  year_of: -500
  place_zh: 舍卫城外田庐
  description_zh: 五百婆罗门田庐议初起地上人种尊，独推我能与佛共谈，再三请我自屈俱往祇树论四种事
- id: guji-頞波罗延-event-meet-buddha
  title_zh: 偕众诣祇树见佛
  date: '-500'
  year_of: -500
  place_zh: 舍卫国祇树给孤独园
  description_zh: 与五百长老俱到佛所，阿难引入，我等住而不礼，自言有小事欲问，佛命坐而问疑
- id: guji-頞波罗延-event-doctrinal-debate
  title_zh: 与佛论种被折伏
  date: '-500'
  year_of: -500
  place_zh: 祇树给孤独园
  description_zh: 以梵天子孙口生独尊发问，佛以四姓通婚生子难分，善恶同生天堕狱，浴垢不分，渡船不别，怀胎十月皆同，日月并照，骡駏驉为喻，并说阿洫道人化七梵志事，我自思前后被遮无可复诤
- id: guji-頞波罗延-event-refuge
  title_zh: 悟一为百归依而去
  date: '-500'
  year_of: -500
  place_zh: 祇树给孤独园
  description_zh: 与五百人共思惟悟种类从心意识出，俱前头面礼佛足，问一为百百为千义，闻无为一道说，长跪请哀护归依检敛，朝来未食礼去
- id: guji-頞波罗延-event-death
  title_zh: 卒年未详
  date: '-435'
  year_of: -435
  place_zh: 未详
  description_zh: 经后事迹未载，约计寿终
