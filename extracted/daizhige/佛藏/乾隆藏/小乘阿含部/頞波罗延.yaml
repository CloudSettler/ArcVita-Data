endeavors:
- id: guji-頞波罗延-endeavor-1
  title_zh: 田庐受推代众议种
  summary_zh: 五百婆罗门田庐共坐，自称梵天子孙口生最尊，推年十五六具奇相明经之我往与佛辩，我初谓佛持正道难诘，经再三固请乃许偕往祇树
  phases:
  - key: brewing
    name: 田庐共议种尊
    labels:
