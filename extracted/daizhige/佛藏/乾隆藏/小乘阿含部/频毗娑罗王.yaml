endeavors:
- id: guji-频毗娑罗王-endeavor-1
  title_zh: 远诣舍卫谒佛闻法归依
  summary: 闻佛在舍卫祇园名德远闻，严驾羽葆车率群臣人民自罗阅城往诣，下车步入舍五威仪礼佛，闻微妙法得三欢喜归依佛法僧。
  phases:
  - key: brewing
    name: 闻名发心严驾
    labels:
      zh: 闻佛出世如优昙钵华
    start_date: -528
    highlight_event_id: guji-频毗娑罗王-event-meet
  - key: breakthrough
    name: 舍卫礼谒问讯
    labels:
      zh: 舍五威仪头面礼足
    start_date: -528
    highlight_event_id: guji-频毗娑罗王-event-meet
  - key: climax
    name: 闻法得三欢喜
    labels:
      zh: 见佛身德闻法知时众行清白
    start_date: -528
    highlight_event_id: guji-频毗娑罗王-event-meet
  - key: closure
    name: 归命请佛三月
    labels:
      zh: 归依三宝发三月请
    start_date: -528
    highlight_event_id: guji-频毗娑罗王-event-invite
  decisions:
  - date: -528
    title_zh: 严驾远诣舍卫问讯世尊
    rationale: 以佛时时出世甚难值遇，宁屈王威往礼承事以求正法
  - date: -528
    title_zh: 舍论义心归命三宝
    rationale: 既闻说法不再问难以论胜，但以身有功德法微妙众清白故归依
  - date: -528
    title_zh: 请佛三月游罗阅城
    rationale: 欲以衣被饮食卧具医药尽心供养佛及比丘僧
- id: guji-频毗娑罗王-endeavor-2
  title_zh: 罗阅设供劝众共植福田
  summary: 独处思惟欲尽形寿供养如来，劝率大臣人民随种类请佛，迎佛住竹林迦兰陀，宫中设斋手自供养，闻苦集灭道令婇女得法眼净。
  phases:
  - key: brewing
    name: 独处誓愿尽寿供养
    labels:
      zh: 思惟国资能办发弘誓意
    start_date: -528
    highlight_event_id: guji-频毗娑罗王-event-invite
  - key: breakthrough
    name: 劝率臣民共请
    labels:
      zh: 敕群臣人民各相劝率长夜离苦
    start_date: -528
    highlight_event_id: guji-频毗娑罗王-event-invite
  - key: climax
    name: 竹园迎佛宫中设斋
    labels:
      zh: 迎佛住迦兰陀设甘馔手自供养
    start_date: -527
    highlight_event_id: guji-频毗娑罗王-event-offering
  - key: closure
    name: 闻道偈众得法眼
    labels:
      zh: 闻施戒生天苦习尽道偈
    start_date: -527
    highlight_event_id: guji-频毗娑罗王-event-offering
  decisions:
  - date: -528
    title_zh: 发尽形供养并劝臣民
    rationale: 为安隐众生使离三涂永处安隐，以己资财率众同修布施
  - date: -527
    title_zh: 迎佛住竹园宫中设供
    rationale: 知时已到便敷坐具办甘馔，亲执香炉请佛入城应供说法
  - date: -527
    title_zh: 请法使婇女受持五戒
    rationale: 见王闻法欢喜复令眷属得法，以佛为天上世间无上故求三佛种德
events:
- id: guji-频毗娑罗王-event-birth
  title_zh: 摩竭王子生于王舍
  date: -543
  year_of: -543
  place_zh: 摩竭国罗阅城
  description: 约前六世纪中叶生于摩竭王族，后嗣位为王中之王，典罗阅城国界。
- id: guji-频毗娑罗王-event-meet
  title_zh: 舍卫祇园谒佛闻法
  date: -528
  year_of: -528
  place_zh: 舍卫城祇树给孤独园
  description: 率群臣人民自罗阅城往诣迦尸拘萨罗，舍剑屣盖冠拂五威仪，头面礼佛自称姓名，闻说法得等三欢喜归命佛法僧。
- id: guji-频毗娑罗王-event-invite
  title_zh: 发三月请劝众供养
  date: -528
  year_of: -528
  place_zh: 舍卫祇园及罗阅城宫殿
  description: 世尊默然受请后欢喜礼退，敕大臣人民随种类请佛及僧，独处誓愿尽形寿供养衣被饮食卧具医药。
- id: guji-频毗娑罗王-event-offering
  title_zh: 竹园宫斋闻道说偈
  date: -527
  year_of: -527
  place_zh: 罗阅城竹林迦兰陀园及王宫
  description: 迎佛与千二百五十比丘入宫，手自进甘馔饮食，闻施戒生天出家要道及苦习尽道，二百五十婇女得法眼净受持五戒，佛说祠火王海星日佛无上偈而去。
- id: guji-频毗娑罗王-event-death
  title_zh: 摩竭国王终
  date: -491
  year_of: -491
  place_zh: 摩竭国罗阅城
  description: 在位护持佛法供养僧团，晚年国政变故而终，约前491年去世，为后世护法国王之典范。
