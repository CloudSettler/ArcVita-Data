  lesson: 闻法生信以国力护法并劝众同蒙安隐
  summary_first_person: 我是摩竭国王频毗娑罗，闻世尊名德远闻，严驾自罗阅城远诣舍卫祇园礼佛闻法，得三欢喜归依三宝，请佛三月游罗阅城，尽心供养衣食卧具医药，并劝臣民共植福田。
