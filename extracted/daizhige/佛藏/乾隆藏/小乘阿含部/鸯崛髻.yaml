  place_zh: 舍卫城街巷产妇家
  description: 乞食见怀妊欲产不得奉佛教于街巷唱护五事往语女人我从圣生未曾忆杀以是真诚语令安隐得产即得产
- id: guji-鸯崛髻-event-endure
  title_zh: 出城被人石杖刀斫忍报说偈
  date: -0549
  year_of: -0549
  place_zh: 舍卫城中及城外至佛所
  description: 食后出城被人掷石杖刀斫头破血流污僧伽梨佛令忍勿发恶意此是地狱余报说忍坚固及明照世间偈佛赞为声闻捷疾智第一
- id: guji-鸯崛髻-event-death
