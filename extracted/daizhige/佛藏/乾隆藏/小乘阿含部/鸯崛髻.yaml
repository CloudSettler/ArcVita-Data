- id: guji-鸯崛髻-event-convert
  title_zh: 佛独往迎追逐不及其闻偈归命
  date: -360
  year_of: -360
  place_zh: 舍卫祇树给孤独园外道中
  description: 世尊独行赴其所居众人劝莫行不退逐不能及闻我久自住然汝不住偈即舍腰剑五体归命求作沙门
