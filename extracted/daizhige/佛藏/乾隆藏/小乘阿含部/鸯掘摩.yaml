    en: Angulimala
  lifespan:
    birth:
      date: '-0600'
      precision: year
      is_circa: true
      raw: 生年未详，约佛住世时生舍卫国奇角氏梵志家
    death:
      date: '-0520'
      precision: year
      is_circa: true
      raw: 证阿罗汉后果上入灭，年月未详
  birth_date: '-0600'
  death_date: '-0520'
  era: 古印度列国时代
  reign_ref: 拘萨罗国波斯匿王时
  archetype: 极恶悔改证圣者
  dilemmas:
  - 师命杀百人取指为鬘与不杀生梵行相违，顺师则陷大恶，违师则失孝弟之名
  - 已杀九十九人罪重难返，复欲害母凑数，是从恶到底还是当下止恶
  - 自言从生以来未尝杀生以救产难，似涉妄语，实是前生异世今生已改之至诚
  lesson: 止恶即善，恶行可止，圣道可成，至诚悔改精修梵行则前恶如云翳消散
  summary_first_person: 我本舍卫梵志上首弟子，名指鬘，奇角氏子，聪慧有力，为师妇所谗，师令我杀百人各取一指为鬘，我迷而守四衢杀害至九十九人，欲害母凑数，蒙佛亲临度化，闻已止未止之教，开悟弃剑出家，修无上梵行得阿罗汉，后以忍辱偿报，以至诚祝愿救产难，方知无害为真道。
  source_urls:
