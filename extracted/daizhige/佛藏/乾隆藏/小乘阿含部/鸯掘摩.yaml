  decisions:
  - date: -0535-01-01
    title_zh: 弃剑稽首求哀出家
    rationale: 闻佛安住三脱乐法修梵行，自知驱痴怀害未止，愿恕迷谬受成就戒
  - date: -0534-01-01
    title_zh: 以今生不杀至诚救产妇
    rationale: 奉佛教以前生异世今生不同为至诚，不计前罪众难，以慈心救彼女厄
events:
- id: guji-鸯掘摩-event-birth
  title_zh: 生于舍卫奇角氏梵志家
  date: '-0600'
  year_of: -600
  place_zh: 舍卫国
  description: 梵志子，聪慧才辩志性和雅，色像第一，为师所嘉异，门徒上首，名鸯掘摩，晋言指鬘
- id: guji-鸯掘摩-event-killing
  title_zh: 守四衢杀人取指断道
  date: '-0536'
  year_of: -536
  place_zh: 舍卫城外四衢道
  description: 受师倒教执剑守四衢，晨杀百人各取一指为鬘，杀害狼藉至九十九人，行人断绝，国人告王，比丘分卫见怖
- id: guji-鸯掘摩-event-conversion
  title_zh: 佛于四衢度化出家
  date: '-0535'
  year_of: -535
  place_zh: 舍卫城外四衢道至祇树给孤独园
  description: 母赍饷出城，欲害母凑数，佛住其前，奔走不及，闻吾止久矣汝未止及三脱梵行之偈，开悟弃剑稽首，蒙授出家，得六通阿罗汉，王出征见之归信供养
- id: guji-鸯掘摩-event-rescue
  title_zh: 分卫救产难忍辱说偈
  date: '-0534'
  year_of: -534
  place_zh: 舍卫城中
  description: 持钵分卫见临产女人求救，奉佛旨以从生以来未尝杀生至诚祝愿令安产，又受童稚瓦石刀杖捶击破头伤体，忍辱说昔暴今无害明昭如日出云之偈
- id: guji-鸯掘摩-event-death
  title_zh: 证阿罗汉后果上入灭
  date: '-0520'
  year_of: -520
  place_zh: 舍卫国
  description: 以家之信舍家为道，究竟无上梵行，生死已断，所作已办，解名色本得应真，后入灭，众闻经欢喜奉行
