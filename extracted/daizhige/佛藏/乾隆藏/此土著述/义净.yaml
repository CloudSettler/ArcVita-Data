  - title_zh: 陆行艰阻与浮海求法之抉择
    description: 陆路断绝而慕法显奘西行之迹遂决意自广州浮海赴南海印度历险求律
  - title_zh: 博通三藏与护生小仪之轻重
    description: 世人重禅教而轻滤水护虫小事而律以杀生为性罪之首故委曲详陈放生器仪以救微命
  lesson: 慈悲为本律为绳墨大法由护微命而始西行得法贵在归国利生
  summary_first_person: 吾义净齐州张氏子也少出家慕法显玄奘之迹自广州浮海历室利佛逝而至印度于那烂陀究学二十余年归蒙武后迎礼奉敕译经复念神州僧众不知滤水放生之器乃撰护命放生轨仪法详示铜铁瓦木之制以全含识以弘圣教愿与末法众生共结慈念之因
