events:
- id: guji-义净-event-birth
  title_zh: 范阳出生辞亲落发
  date: '0635'
  year_of: 635
  place_zh: 范阳
  description: 姓张氏范阳人，髫龀辞亲落发，遍询名匠广探群籍，内外闲习，十五便萌西游之志
- id: guji-义净-event-depart
  title_zh: 咸亨二年自番禺浮海西行
  date: '0671'
  year_of: 671
  place_zh: 番禺
  description: 年三十七方遂发足，初至番禺得同志数十人，临登舶余皆退罢，孤行备历艰险，所至洞晓言音，历三十余国经二十五年
- id: guji-义净-event-return
  title_zh: 证圣元年携梵本还至河洛
  date: '0695-06-01'
  year_of: 695
  place_zh: 河洛上东门外
  description: 得梵本经律论近四百部合五十万颂及金刚座真容舍利三百粒，天后亲迎于上东门外，敕于佛授记寺安置，初助实叉难陀翻华严经
- id: guji-义净-event-translate
  title_zh: 久视至景云两京广译经律
  date: '0701-01-01'
  year_of: 701
  place_zh: 福先寺西明寺大荐福寺
  description: 起庚子至景云都翻五十六部二百三十卷，出金光明最胜王能断金刚孔雀王药师本愿等经及有部毗奈耶百一羯磨等，天后睿宗制序监护，学侣遍于京洛
- id: guji-义净-event-death
  title_zh: 先天二年示寂葬龙门北冈
  date: '0713'
  year_of: 713
  place_zh: 洛京龙门北高冈
  description: 卒年七十九法腊五十九，葬事官供，所出跋窣堵唯存真本未暇覆疏，其传度经律与玄奘抗衡，塔在洛京龙门北高冈
