  date: '1030'
  year_of: 1030
  kind: endeavor
  description: 叹隋祖智者四种三昧读者众修者寡十观五悔仅存空言，故于讲习暇倡如意轮晨昏持诵观想供养
- id: guji-仁岳-event-death
