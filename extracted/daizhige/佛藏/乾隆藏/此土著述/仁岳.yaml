    labels:
      zh: 突破
    start_date: '1023'
    highlight_event_id: guji-仁岳-event-teach
  - key: climax
    name: 示心口双运速成
    labels:
      zh: 高潮
    start_date: '1030'
    highlight_event_id: guji-仁岳-event-teach
  - key: closure
    name: 俟来哲正源流
    labels:
      zh: 收束
    start_date: '1035'
    highlight_event_id: guji-仁岳-event-teach
  decisions:
  - date: '1023'
    title_zh: 补观想以三谛圆融会通
    rationale: 圣相从心想生，空假中非一非异，莲华如意宝轮各具法身般若解脱三德，故称轮王陀罗尼
  - date: '1030'
    title_zh: 先世间乐次如来性
    rationale: 假隐密语诠微妙法如蜾蠃祝螟蛉，口诵加心观则感应道交遮恶持善具足二严
