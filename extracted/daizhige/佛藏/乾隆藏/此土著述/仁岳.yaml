  dilemmas:
  - 读者虽众修者无几，空谈名相与切实施修之两难
  - 梵本传流有异译本详略不同，取舍折衷之两难
  lesson: 摄心口诵兼以观想，藉简约密语成就世出世愿，讲习之余不废课念
  summary_first_person: 我是宋沙门仁岳，讲习之暇务求课念之益，发经藏得如意轮咒四译，以义净本为正定百八遍为准，采诸文补助为七科，原始洎末以利四辈受持
