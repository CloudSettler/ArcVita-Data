  decisions:
  - date: '1022'
    title_zh: 以义净本一百八遍为准
    rationale: 章句简方轨约，表破百八烦恼成就百八三昧，通一遍亦遂意，随数减之亦无咎
  - date: '1023'
    title_zh: 不作坛仪随分供养
    rationale: 净译但云摄心口诵，不假洗浴净衣，静室面东敷置三级或唯存菩萨像，七日别修则用澡浴净衣为善
- id: guji-仁岳-endeavor-2
  title_zh: 讲习止观倡导课念资熏
  summary_zh: 承智者四种三昧经行之意，矫治从师劳名相事佛懈资熏之弊，以观想三谛三德释咒义令心口相应
  phases:
  - key: brewing
    name: 切于讲习思课念益
