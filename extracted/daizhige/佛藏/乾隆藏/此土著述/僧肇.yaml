endeavors:
- id: guji-僧肇-endeavor-1
  title_zh: 师事罗什助译般若
  summary: 少年出家，喜览老庄，读维摩经而悟道，姚秦弘始三年投鸠摩罗什门下，随入长安逍遥园助译大品维摩法华诸经，声名冠于时流
  phases:
  - key: brewing
    name: 少习老庄初披维摩
    labels:
      zh: 博览转机
    start_date: 0395
    highlight_event_id: guji-僧肇-event-birth
  - key: breakthrough
    name: 仗剑远投罗什之门
    labels:
      zh: 师资相契
    start_date: '0401'
    highlight_event_id: guji-僧肇-event-meet-luoshi
  - key: climax
    name: 长安助译声著关中
    labels:
      zh: 译场扬名
    start_date: '0404'
    highlight_event_id: guji-僧肇-event-assist-translate
  - key: closure
    name: 三藏兼通老庄俱会
    labels:
      zh: 学贯华梵
    start_date: 0408
    highlight_event_id: guji-僧肇-event-assist-translate
  decisions:
  - date: '0401'
    title_zh: 弃故师投罗什
    rationale: 以维摩一卷见性空之理，知旧学不契真一，故不顾道远，入关事什为师，求正般若
  - date: '0404'
    title_zh: 留译场助定经义
    rationale: 以华梵兼通，为什门四杰之首，助详定文义，令般若空义明晓中土，不急自立门户
- id: guji-僧肇-endeavor-2
  title_zh: 造肇论宝藏弘明空有
  summary: 融会有无，会通名教自然，造般若无知不真空物不迁涅槃无名四论，又述宝藏论广照空有离微体净二品，立中土般若学宗纲
  phases:
  - key: brewing
    name: 答难析疑初著无知
    labels:
      zh: 破执显空
    start_date: '0405'
    highlight_event_id: guji-僧肇-event-assist-translate
  - key: breakthrough
    name: 物不迁不真空成篇
    labels:
      zh: 立宗肇论
    start_date: '0410'
    highlight_event_id: guji-僧肇-event-compose-zhaolun
  - key: climax
    name: 宝藏二品明离微宗
    labels:
      zh: 宝藏独耀
    start_date: '0412'
    highlight_event_id: guji-僧肇-event-compose-zhaolun
  - key: closure
    name: 表论于秦王流布江左
    labels:
      zh: 道行弘远
    start_date: '0413'
    highlight_event_id: guji-僧肇-event-compose-zhaolun
  decisions:
  - date: '0410'
    title_zh: 以四论通般若不滞言象
    rationale: 以会道亡言见月亡指，破有无二见及生死存亡之惑，故立不迁不真无知无名之目，直显真一
  - date: '0412'
    title_zh: 更述宝藏明体用一如
    rationale: 以离明体不与物合，微明用含藏万德，空有不乖，理事双通，补四论未尽之玄要，拯学者久功中止之失
events:
- id: guji-僧肇-event-birth
  date: 0384
  year_of: 384
  title_zh: 诞生于京兆
  description: 晋孝武帝太元九年前后生于京兆，家贫力学，初好老庄，为书生，兼善属文
- id: guji-僧肇-event-meet-luoshi
  date: '0401'
  year_of: 401
  title_zh: 投鸠摩罗什门下
  description: 姚秦弘始三年，罗什入长安，僧肇往投为弟子，年十八九即声誉卓著，为什门四圣之一
- id: guji-僧肇-event-assist-translate
  date: '0404'
  year_of: 404
  title_zh: 助译大品维摩诸经
  description: 于逍遥园大寺助什译大品般若维摩法华诸经，参详义理，兼作注疏，刘遗民等江左名士皆遥相咨问
- id: guji-僧肇-event-compose-zhaolun
  date: '0413'
  year_of: 413
  title_zh: 肇论宝藏论成篇流布
  description: 先后撰般若无知论不真空论物不迁论涅槃无名论，又作宝藏论分广照空有离微体净二品，表上秦王姚兴，远传庐山慧远，天下宗之
- id: guji-僧肇-event-death
  date: '0414'
  year_of: 414
  title_zh: 长安示寂
  description: 晋安帝义熙十年人寂于长安，年三十一，传为姚兴所害，又传蚤夭，著述遂止而般若之风大行于世
