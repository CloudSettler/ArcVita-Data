  name_zh: 僧肇
  names:
    zh: 僧肇
    en: Sengzhao
  lifespan:
    birth:
      date: 0384
      precision: year
      is_circa: true
      raw: 晋孝武帝太元九年京兆人
    death:
      date: '0414'
      precision: year
      is_circa: false
      raw: 晋安帝义熙十年长安示寂
  birth_date: 0384
  death_date: '0414'
  era: 东晋
  reign_ref: 晋孝武帝至晋安帝义熙年间
  archetype: 般若空宗论师
  dilemmas:
  - 有无两见如何双遣而不堕断常
  - 名教自然如何会通而不乖真俗
  - 西来般若如何寄中土之言而显离微真一
  lesson: 守真抱一，不取不舍，离染照微，空有双通，方契如如不動之道
  summary_first_person: 吾僧肇京兆人也，少好老庄，披维摩而发悟，师事鸠摩罗什于长安，助译众经，造四论以通般若，又述宝藏广照空有离微体净，欲使学者息妄想，见真一，虽年三十而灭，此志無悔矣
  source_urls:
