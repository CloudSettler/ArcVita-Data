events:
- id: guji-允若-event-birth
  date: 1280
  year_of: 1280
  title_zh: 生于越州相里
  description: 会稽相里人九岁能通春秋大义稍长翛然有绝尘之趣
- id: guji-允若-event-study
  date: 1294
  year_of: 1294
  title_zh: 依云门出家遍参台宗
  description: 十五岁依云门元和尚祝发渡江谒大山恢授四教仪金錍等书复依湛堂澄于南竺精究阴观别理六即性具诸文
- id: guji-允若-event-abbot
  date: 1324
  year_of: 1324
  title_zh: 出住净圣兴化弘化
  description: 泰定初锡号慈光圆照出住昌源净圣兴废起敝后摄众南竺复主兴化与天岸济我庵无等并称钱塘四依
- id: guji-允若-event-retreat
  date: 1350
  year_of: 1350
  title_zh: 退居云门感泉修忏
  description: 退隐云门筑精舍专修法华三昧持锡叩岩感缨络泉再涌尚书名曰再来泉又与断江恩等称云门三高
- id: guji-允若-event-death
  date: 1359
  year_of: 1359
  title_zh: 兵乱中端坐遇害
  description: 至正十九年二月二十九日贼入其舍毅然不屈挥刃中之白乳溢地荼毗舍利如菽无算世寿八十僧腊六十五
