    rationale: 不定声闻及凡夫亦得往生即入不退，故不取圆满一向纯净三门
  - date: '0670'
    title_zh: 以发菩提心为正因执持名号为助因
    rationale: 大心能摄多善根为上首，名号具不可思议功德，一日至七日一心不乱必生
