  title_zh: 生于彭城仲氏
  description: 本姓仲名令仪彭城人父为武威太守少好学早寡家贫为贵游子女教授琴书
- id: guji-净检-event-1
  date: 0318
  year_of: 318
  title_zh: 从法始受十戒立竹林寺
  description: 晋建兴中于宫城西门遇沙门法始闻法大悟剃落受十戒与同志二十四人共立竹林寺共咨净检为师范
- id: guji-净检-event-2
  date: '0357-02-08'
  year_of: 357
  title_zh: 洛阳戒坛受具足戒
  description: 升平元年二月八日洛阳请外国沙门昙摩羯多立戒坛四人同坛从大僧受具戒羯磨之日殊香芬馥阖众同闻为晋土比丘尼之始
- id: guji-净检-event-death
  date: '0361'
  year_of: 361
  title_zh: 虹霓腾空而化
  description: 至升平末复闻前香并见赤气有女人持五色花自空而下遂辞别众执手腾空所行之路如虹霓直属于天时年七十
