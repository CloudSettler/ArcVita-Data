  archetype: 考据卫道明宗护法的沙门
  dilemmas:
  - 禅宗世系遭义学执付法藏传发难当曲从旧阙还是考据实证
  - 儒者排佛日盛当杜门自修还是上书辅教明辨护国
  lesson: 护法须以考据正传信以诚敬辅教显宗方能息诤传远
  summary_first_person: 吾藤州东山沙门契嵩也少出家游方问道病义学疑达磨正传遂探支疆耶舍旧译及僧祐三藏记与禅经慧观序考定二十八祖勒成传法正宗记复著辅教以上书仁宗愿以佛法辅王化而正人心
