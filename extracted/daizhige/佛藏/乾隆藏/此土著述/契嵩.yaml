  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E4%BC%A0%E6%B3%95%E6%AD%A3%E5%AE%97%E8%AE%BA.html
endeavors:
- id: guji-契嵩-endeavor-1
  title_zh: 考辨正统著传法正宗记论
  summary: 以付法藏传阙师子以下相承为病博采旧译禅经律藏正定自迦叶至六祖三十四圣世系以息禅教之诤
  phases:
  - key: brewing
    name: 病付法藏传阙谬发愿考正
    labels:
      zh:
      - 酝酿病源
    start_date: 1038
    highlight_event_id: guji-契嵩-event-ordination
  - key: breakthrough
    name: 得僧祐出三藏记及禅经为据
    labels:
      zh:
      - 突破得证
    start_date: 1054
    highlight_event_id: guji-契嵩-event-zhengzong
  - key: climax
    name: 勒成十二卷并祖图奏上
    labels:
      zh:
      - 高潮奏进
    start_date: 1061
    highlight_event_id: guji-契嵩-event-zhengzong
  - key: closure
    name: 诏入藏赐明教大师号
    labels:
      zh:
      - 收束旌显
    start_date: 1061
    highlight_event_id: guji-契嵩-event-zhengzong
  decisions:
  - date: 1054
    title_zh: 弃付法藏便绝之说别据旧译立论
    rationale: 付法藏单录残阙师资无本末不足示信当以支疆耶舍先译及祐公目录验之
  - date: 1061
    title_zh: 断自释迦至大鉴立表传旁出宗证
    rationale: 欲使祖祢分明事有本末削冗伪广遗阙廓大圣之道于无穷
- id: guji-契嵩-endeavor-2
  title_zh: 辅教护法融通儒释
  summary: 针对韩愈欧阳修排佛上万言书明孝论原教诸篇论佛法辅王化合世善以护教存续
  phases:
  - key: brewing
    name: 见排佛论盛忧教道陵夷
    labels:
      zh:
      - 酝酿忧教
    start_date: 1042
    highlight_event_id: guji-契嵩-event-fujiao
  - key: breakthrough
    name: 作原教广原教定祖图明孝论
    labels:
      zh:
      - 突破立言
    start_date: 1056
    highlight_event_id: guji-契嵩-event-fujiao
  - key: climax
    name: 上仁宗皇帝万言书与辅教编
    labels:
      zh:
      - 高潮上书
    start_date: 1061
    highlight_event_id: guji-契嵩-event-fujiao
  - key: closure
    name: 退居永安兰若终老传灯
    labels:
      zh:
      - 收束退居
    start_date: 1063
    highlight_event_id: guji-契嵩-event-death
  decisions:
  - date: 1056
    title_zh: 不与排佛者空诤而以儒证佛
    rationale: 欲息诤当引孝义仁善示佛儒同归王化使人主信而外护成
  - date: 1061
    title_zh: 万言上奏请入藏以朝命定是非
    rationale: 私著易被党同伐异须借朝廷公议颁行天下方能正宗护教久远
events:
- id: guji-契嵩-event-birth
  date: 1007
  year_of: 1007
  title_zh: 生于藤州镡津李氏
  description: 宋真宗景德四年生于藤州镡津俗姓李七岁即慕出家
- id: guji-契嵩-event-ordination
  date: 1020
  year_of: 1020
  title_zh: 十三祝发后游方问道
  description: 十三岁落发十九岁游方南谒云门洞山晓聪等精禅律而兼通儒典
- id: guji-契嵩-event-zhengzong
  date: 1061
  year_of: 1061
  title_zh: 传法正宗记成奏上赐号入藏
  description: 嘉祐六年考支疆耶舍旧译及僧祐录禅经慧观序勒成传法正宗记十二卷并祖图奏进仁宗诏入大藏赐号明教大师
- id: guji-契嵩-event-fujiao
  date: 1062
  year_of: 1062
  title_zh: 著辅教编上书明护法大义
  description: 作原教明孝论辅教编等上仁宗万言书辨佛法辅王化合儒道以对韩欧排佛之论退居杭州永安兰若
- id: guji-契嵩-event-death
  date: 1072
  year_of: 1072
  title_zh: 示寂于杭州永安兰若
  description: 宋神宗熙宁五年夏示寂于杭州寿六十六塔全身于灵隐之后世称明教大师著作并入藏流行
