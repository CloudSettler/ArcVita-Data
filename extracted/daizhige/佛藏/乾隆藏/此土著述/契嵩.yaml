  dilemmas:
  - title_zh: 禅教相诤祖统不明
    description_zh: 传灯旧录差讹束教者不信言外语禅者不谅教内纷然是非欲推一宗祖以息诤
  - title_zh: 岩穴著述无人成就
    description_zh: 身在草莽抱书千里趋阙惟赖圣明垂察方得与大藏偕传不计毁誉冒犯进言
  lesson: 正统一明则学有所归诤竞自息扶持教法必考经论校长历斥谬存详方能补圣教于万一
  summary_first_person: 我藤州东山沙门契嵩字仲灵少习儒业游方入吴著书西湖见禅门祖宗未明教门各执传记多有诤竞遂力探大藏校经传长历删繁撮要成传法正宗记定祖图传法正宗论与辅教编嘉祐六年冬抱书趋阙上皇帝书明年春蒙仁宗诏付传法院收入大藏赐号明教但愿教法不微不昧流播无穷人资之而务道为善我虽死犹生
  source_urls:
