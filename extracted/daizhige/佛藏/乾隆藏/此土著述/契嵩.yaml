person:
  qid: guji-契嵩
  name_zh: 契嵩
  names:
    zh: 契嵩
    en: Qisong
  lifespan:
    birth:
      date: 1007-01-01
      precision: year
      is_circa: false
      raw: 北宋大中祥符元年生于藤州镡津
    death:
      date: 1072-07-01
      precision: year
      is_circa: false
      raw: 北宋熙宁五年示寂于杭州
  birth_date: 1007-01-01
  death_date: 1072-07-01
  era: 北宋
  reign_ref: 宋仁宗嘉祐
  archetype: 护法卫道者
  dilemmas:
  - title_zh: 排佛思潮下是否著书抗辩
    description: 面对韩愈欧阳修以来排佛论盛行，若沉默则正法受诬，若抗辩则恐激化儒释对立
  - title_zh: 直指单传与文字弘传如何抉择
    description: 宗门贵扫空文字，若立言著述恐违宗旨，若不立言则中下之机无所依凭
  lesson: 以文弘道以戒立身，融儒明孝而守佛本怀，护法不谤法，立言为接引中下之权宜
  summary_first_person: 我是契嵩，字仲灵，藤州人，七岁出家，遍览儒释，见排佛论盛行，遂著原教孝论以明孝、以尊僧篇以正僧位，嘉祐入京奏书得赐明教之号，晚住杭越，唯以戒定慧接引后学，愿文字皆为见月之指
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E7%BC%81%E9%97%A8%E8%AD%A6%E8%AE%AD.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E7%BC%81%E9%97%A8%E8%AD%A6%E8%AE%AD.md
endeavors:
- id: guji-契嵩-endeavor-1
  title_zh: 融儒弘孝护法著述
  description: 著原教孝论尊僧篇诸文，会通儒释，明出家即是大孝，以文字护正法
  phases:
  - key: brewing
    name: 幼岁出家博览儒释
    labels:
      zh:
      - 蓄势博学
    start_date: 1014-01-01
    highlight_event_id: guji-契嵩-event-ordination
  - key: breakthrough
    name: 著原教孝论破排佛论
    labels:
      zh:
      - 立言护法
    start_date: 1043-01-01
    highlight_event_id: guji-契嵩-event-writing
  - key: climax
    name: 嘉祐入京奏书赐号明教
    labels:
      zh:
      - 朝野表彰
    start_date: 1061-05-01
    highlight_event_id: guji-契嵩-event-capital
  - key: closure
    name: 晚住灵隐付嘱文字流通
    labels:
      zh:
      - 收束流通
    start_date: 1069-01-01
    highlight_event_id: guji-契嵩-event-retreat
  decisions:
  - date: 1043-01-01
    title_zh: 作原教孝论明孝
    rationale: 以孝会通儒佛，解世人以弃亲事佛为不孝之谤，护出家正名
  - date: 1061-05-01
    title_zh: 持传法正宗记等入京奏御
    rationale: 藉公论定是非，求朝廷正视僧教，使护法由空谈转为制度保障
- id: guji-契嵩-endeavor-2
  title_zh: 尊僧振宗兴教化众
  description: 作尊僧篇传法正宗记等，正僧伦、定宗统，以戒定慧摄僧俗
  phases:
  - key: brewing
    name: 南方参学洞明云门宗旨
    labels:
      zh:
      - 参究宗乘
    start_date: 1025-01-01
    highlight_event_id: guji-契嵩-event-ordination
  - key: breakthrough
    name: 作尊僧篇立僧之德位
    labels:
      zh:
      - 正名尊僧
    start_date: 1045-01-01
    highlight_event_id: guji-契嵩-event-writing
  - key: climax
    name: 得赐明教大师住持名刹
    labels:
      zh:
      - 领众化方
    start_date: 1062-01-01
    highlight_event_id: guji-契嵩-event-capital
  - key: closure
    name: 示寂前以警策诫后学
    labels:
      zh:
      - 以身垂诫
    start_date: 1072-01-01
    highlight_event_id: guji-契嵩-event-death
  decisions:
  - date: 1045-01-01
    title_zh: 作尊僧篇明僧四德
    rationale: 僧以佛为性以法为身，须先自尊戒定慧而后人尊之，以此革猥弊振僧纲
  - date: 1062-01-01
    title_zh: 受请住持而不废著述
    rationale: 以住持摄众行，以文字接中下，使宗教并举而不断传承
events:
- id: guji-契嵩-event-birth
  date: 1007-01-01
  year_of: 1007
  title_zh: 生于藤州镡津李氏
  description: 北宋大中祥符元年生，俗姓李，年七岁即愿出家
- id: guji-契嵩-event-ordination
  date: 1014-01-01
  year_of: 1014
  title_zh: 幼岁出家受具博通经律
  description: 七岁出家，十三岁受具，遍习三藏及儒家百氏，洞明云门宗旨
- id: guji-契嵩-event-writing
  date: 1043-01-01
  year_of: 1043
  title_zh: 著原教孝论尊僧篇
  description: 皇祐庆历间连著原教论孝论尊僧篇传法正宗记，以儒明佛，以孝护法，收入缁门警训尊僧篇
- id: guji-契嵩-event-capital
  date: 1061-05-01
  year_of: 1061
  title_zh: 嘉祐入京奏书赐号明教
  description: 嘉祐间携著述入京，欧阳修韩琦等赏其文，仁宗赐号明教大师，赐服驰驿
- id: guji-契嵩-event-retreat
  date: 1069-01-01
  year_of: 1069
  title_zh: 晚住杭州灵隐永安弘禅护律
  description: 晚年住杭州灵隐永安诸刹，弘云门宗风，严戒律，劝参禅兼重看经礼忏
- id: guji-契嵩-event-death
  date: 1072-07-01
  year_of: 1072
  title_zh: 熙宁五年示寂
  description: 熙宁五年六月示寂于杭州，世寿六十六，塔全身于灵隐，谥号明教，文集合为镡津集
