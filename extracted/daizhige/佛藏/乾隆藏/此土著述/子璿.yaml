  dilemmas:
  - 石壁章句蔓衍而讲者难畅，如何取舍而不忘本母之体
  - 真如生灭二门迢然而理归一揆，如何令后学不虚劳神智而照无昧
  lesson: 笔则笔，削则削，取要当者存之，繁缓者去之，方得中道以利后学
  summary_first_person: 吾长水沙门子璿，览石壁之疏蔓於章句，讲者未至稳畅，遂就其文取要当者笔而存之，繁缓者削而去之，仍加添改，取其得中，录成笔削记十五卷，愿后学者披释而得一心真如之旨
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/此土著述/起信论疏笔削记.md
  - https://daizhige.org/佛藏/乾隆藏/此土著述/起信论疏笔削记.html
endeavors:
- id: guji-子璿-endeavor-1
  title_zh: 笔削起信论疏成十五卷笔削记
  summary: 以石壁疏先问发次举答而太过不及为病，取要笔存，繁缓削去，加以添改，会论疏科文，成笔削记以便讲授
  phases:
  - key: brewing
    name: 览石壁繁蔓萌笔削之志
    labels:
      zh: 酝酿
    start_date: 1005-01-01
    highlight_event_id: guji-子璿-event-birth
  - key: breakthrough
    name: 列疏就论立科判三分
    labels:
      zh: 突破
    start_date: 1015-01-01
    highlight_event_id: guji-子璿-event-bixue
  - key: climax
    name: 笔削添改定十五卷之文
    labels:
      zh: 高潮
    start_date: 1020-01-01
    highlight_event_id: guji-子璿-event-bixue
  - key: closure
    name: 录成流通付后学披释
    labels:
      zh: 收束
    start_date: 1025-01-01
    highlight_event_id: guji-子璿-event-bixue
  decisions:
  - date: 1015-01-01
    title_zh: 定笔削体例取要去繁
    rationale: 石壁凡伸一义皆先问发而未稳畅，故取要当者存之，繁缓者削之，以求得中
  - date: 1020-01-01
    title_zh: 列疏文就论立科
    rationale: 先以论疏二本别行致学者不能周览，故列疏文以就於论，论上有科，文义昭然
- id: guji-子璿-endeavor-2
  title_zh: 弘传一心二门圆实教法
  summary: 依马鸣大乘起信一心法，阐真如生灭不二，破疑执起正信，会华严性起，令众生信根成熟入不退
  phases:
  - key: brewing
    name: 研一心总别体相用三义
    labels:
      zh: 酝酿
    start_date: 1010-01-01
    highlight_event_id: guji-子璿-event-hongchuan
  - key: breakthrough
    name: 判五分三节明立义解释信心
    labels:
      zh: 突破
    start_date: 1022-01-01
    highlight_event_id: guji-子璿-event-hongchuan
  - key: climax
    name: 示波水交彻动静一如
    labels:
      zh: 高潮
    start_date: 1030-01-01
    highlight_event_id: guji-子璿-event-hongchuan
  - key: closure
    name: 劝信修行令佛种不断
    labels:
      zh: 收束
    start_date: 1035-01-01
    highlight_event_id: guji-子璿-event-death
  decisions:
  - date: 1022-01-01
    title_zh: 以五重玄义释大乘起信论题
    rationale: 以题为一部大纲，不得不预知悉，故以体宗用教名对五字，括尽一论以立名
  - date: 1030-01-01
    title_zh: 明生灭即入真如劝起厌苦信乐
    rationale: 众生根劣迷悟交杂，须因缘具足内熏外缘和合，方能除疑舍邪，起大乘正信
events:
- id: guji-子璿-event-birth
  title_zh: 降生嘉禾出家为沙门
  date: 0965-01-01
  year_of: 965
  summary: 宋初生於嘉禾陆氏，字仲微，少出家，研内外典，後居长水，称长水沙门
- id: guji-子璿-event-bixue
  title_zh: 笔削论疏成笔削记十五卷
  date: 1020-06-01
  year_of: 1020
  summary: 就石壁疏取要笔存，繁缓削去，加以添改，列疏就论，录成起信论疏笔削记十五卷，以笔削命题
- id: guji-子璿-event-hongchuan
  title_zh: 讲演一心二门劝起信心
  date: 1030-03-01
  year_of: 1030
  summary: 依众生心摄世出世法，辨真如门非生灭不迁，生灭门随缘逐迷从悟，显二门不二如波即水，劝四信五行
- id: guji-子璿-event-death
  title_zh: 示寂长水道业流传
  date: 1038-10-01
  year_of: 1038
  summary: 景祐年中示寂於长水，所录笔削记与华严诸疏并行於世，学者披释荷其优赐
