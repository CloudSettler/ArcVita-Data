  lesson: 以简注为枢钥直指观门，解行相资，方能由门入观，由观通经，因经证性
  summary_first_person: 我是圭峰兰若沙门宗密，亲承澄观华严法乳，痛惜学者迷于法界观文，故直以精义注于文下，使人寻注见门，得门入观，由观通经，因经证性，复会通禅教以导无住之行
