  dilemmas:
  - 早年丧亲终身坟垄蒸尝虽展孝思不资神道当如何追荐神识
  - 儒以慎护发肤扬名居丧祭祀为孝释以祝发出家盆供度脱为孝当如何会通同异而不背本
  - 乡里耆艾请制新疏心在松柏守道与俯从乡情之间当如何抉择
  lesson: 以孝为儒释宗本以悲敬孝为种福种子以盆供胜田拔苦报恩会通权实不杀生而放生施戒
  summary_first_person: 我宗密罪衅早年丧亲每履雪霜之悲永怀风树之恨搜求圣贤追荐之方得盂兰盆法门年年僧自恣日四事供养三尊已历多载今因归乡开设道俗遵行应请制疏发挥孝顺设供拔苦报恩之要道愿自他存殁亲离苦常安乐
  source_urls:
