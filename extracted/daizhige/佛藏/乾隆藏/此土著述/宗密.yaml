endeavors:
- id: guji-宗密-endeavor-1
  title_zh: 注解华严法界观门阐明三重观法
  summary: 集杜顺三重观法之大成，以简备之注直指真空与理事无碍及周遍含容，立解行相资之轨
  phases:
  - key: brewing
    name: 亲近澄观研习华严
    labels:
      zh: 酝酿研习
    start_date: 0812
    highlight_event_id: guji-宗密-event-study
  - key: breakthrough
    name: 发愿直注观文为枢钥
    labels:
      zh: 立志注疏
    start_date: 0823
    highlight_event_id: guji-宗密-event-commentary
  - key: climax
    name: 三重法界注流通于世
    labels:
      zh: 注成流通
    start_date: 0828
    highlight_event_id: guji-宗密-event-teaching
  - key: closure
    name: 付嘱观法以观修为要
    labels:
      zh: 收束付嘱
    start_date: 0841
    highlight_event_id: guji-宗密-event-death
  decisions:
  - date: 0823
    title_zh: 不立广疏但作简注
    rationale: 恐繁文芜没真法，故于关要之下随本义直注，使学者专于妙观而不滞文义
  - date: 0828
    title_zh: 以三重竖穷统摄四法界
    rationale: 事不独立故除事法界，立真空与理事无碍与周遍含容三重，使一道竖穷展转玄妙
- id: guji-宗密-endeavor-2
  title_zh: 住持圭峰会通禅教会归一心
  summary: 居终南圭峰兰若，融荷泽禅与华严教，示理事无碍与事事无碍之妙用，导学者悲智无住
  phases:
  - key: brewing
    name: 从道圆出家受具
    labels:
      zh: 出家立基
    start_date: 0807
    highlight_event_id: guji-宗密-event-ordination
  - key: breakthrough
    name: 禅教相遇决疑入道
    labels:
      zh: 禅教相契
    start_date: 0812
    highlight_event_id: guji-宗密-event-study
  - key: climax
    name: 住圭峰草堂弘法化众
    labels:
      zh: 住山弘化
    start_date: 0828
    highlight_event_id: guji-宗密-event-teaching
  - key: closure
    name: 会昌示寂塔号定慧
    labels:
      zh: 圆寂归真
    start_date: 0841
    highlight_event_id: guji-宗密-event-death
  decisions:
  - date: 0812
    title_zh: 依澄观学华严兼修禅观
    rationale: 见华严法界总该万有即是一心，非禅教合一不能彻见自心灵通，故双弘以利钝根
  - date: 0828
    title_zh: 以理事无碍导无住之行
    rationale: 真空既显须明妙用，令观无碍成中道第一义观，自然悲智相导成无住行
events:
- id: guji-宗密-event-birth
  date: 0780
  year_of: 780
  title_zh: 生于果州西充何氏
  description: 唐建中元年生于果州西充，少习儒典，后慕佛法，奠定禅教兼通之基
- id: guji-宗密-event-ordination
  date: 0807
  year_of: 807
  title_zh: 遇道圆出家受具足戒
  description: 遇遂州道圆禅师，倾心禅法，遂出家受戒，研习大乘经论
- id: guji-宗密-event-study
  date: 0812
  year_of: 812
  title_zh: 参学澄观深悟华严法界
  description: 从长安大华严长者澄观咨受华严，洞明理事无碍与事事无碍之旨，被付法印
- id: guji-宗密-event-commentary
  date: 0823
  year_of: 823
  title_zh: 注华严法界观门成一卷
  description: 叹法界之门非知枢钥不能入，遂直以精义注杜顺法界观文下，分真空与理事无碍与周遍含容三重，裴休为之作序
- id: guji-宗密-event-teaching
  date: 0828
  year_of: 828
  title_zh: 住终南圭峰兰若弘禅教
  description: 居圭峰草堂及兰若，大弘华严兼扬荷泽禅，著述禅源诸诠及圆觉疏，士俗归仰，裴休宗仰为师
- id: guji-宗密-event-death
  date: 0841
  year_of: 841
  title_zh: 会昌元年正月坐化于圭峰
  description: 唐武宗会昌元年正月六日端坐示寂，塔于圭峰，谥大智禅师，塔号定慧
