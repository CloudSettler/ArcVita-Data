    start_date: '1391'
    highlight_event_id: guji-宗泐-event-death
  decisions:
  - date: '1387'
    title_zh: 取论意而不用其深语
    rationale: 以其语深难便初学故用浅近言显实相无住之义
  - date: '1388'
    title_zh: 不取昭明三十二分破碎科节
    rationale: 以其与本论科节不同破碎经意故直释降伏安住不断疑执
