    rationale: 欲令大众折己慢幢生彼福德以发起无住之教
- id: guji-宗泐-endeavor-2
  title_zh: 奉诏同注金刚般若波罗蜜经
  summary_zh: 与演福讲寺如己奉诏同注依天亲等论取意不用深语以便初学
