    title_zh: 许裴休出录授大舟归广唐证同异
    rationale: 恐入神精义不闻未来故出十得一二之纪付门下归山参验流通
events:
- id: guji-希运-event-birth
  date: '0770'
  year_of: 770
  title_zh: 生于唐世
  description_zh: 希运生于唐中期后嗣曹溪六祖百丈一脉具体生年不详约开元末
- id: guji-希运-event-baizhang
  date: 0800
  year_of: 800
  title_zh: 承嗣百丈得最上乘印
  description_zh: 亲承百丈怀海印可独佩离文字印唯传一心为曹溪嫡孙西堂法侄
- id: guji-希运-event-huangbo
  date: 0840
  year_of: 840
  title_zh: 住洪州高安黄檗山鹫峰
  description_zh: 住持黄檗四方学徒望山而趋往来海众常千余人言简理直道峻行孤
- id: guji-希运-event-peixiu
  date: 0842
  year_of: 842
  title_zh: 裴休会昌二年迎至钟陵龙兴问道
  description_zh: 裴休廉于钟陵自山迎至州憩龙兴寺旦夕问道后大中二年复迎至宛陵安居开元受法
- id: guji-希运-event-jilu
  date: '0848-09-01'
  year_of: 848
  title_zh: 九月十月示传心法要
  description_zh: 示唯是一心不曾生灭不青不黄动念即乖示化城宝所阐提声闻缘觉皆须契本心
- id: guji-希运-event-liutong
  date: '0857-11-08'
  year_of: 857
  title_zh: 裴休序录授大舟归广唐流通
  description_zh: 裴休退纪十得一二佩为心印大中十一年序出授门下大舟法建归旧山广唐寺问众同异
- id: guji-希运-event-death
  date: 0850
  year_of: 850
  title_zh: 寂于黄檗
  description_zh: 弘传一心后寂灭后裴休集其语为黄檗山际禅师传心法要一卷行于世
