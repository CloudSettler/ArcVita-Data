events:
- id: guji-康僧会-event-birth
  title_zh: 生于交趾出家学道
  date: '0200'
  year_of: 200
  place_zh: 交趾
  description: 先世康居父商贾移交趾年十余岁二亲并终孝服毕出家励行明解三藏博览六经
- id: guji-康僧会-event-jiangye
  title_zh: 赤乌十年初达建邺
  date: '0247'
  year_of: 247
  place_zh: 建邺
  description: 杖锡东游营立茅茨设像行道有司疑为矫异孙权召诘有何灵验对以舍利神曜请期求瑞
- id: guji-康僧会-event-sarira
  title_zh: 三七祈请获舍利建塔
  date: '0247'
  year_of: 247
  place_zh: 吴宫建初寺
  description: 洁斋静室铜瓶烧香礼请前二七寂然三七五更瓶中枪然获舍利五色光炎泻盘盘碎置铁砧击之砧陷舍利无损遂建塔号建初寺
- id: guji-康僧会-event-translation
  title_zh: 建初寺译经注经制呗
  date: '0260'
  year_of: 260
  place_zh: 建初寺
  description: 译出阿难念弥镜面王察微王梵皇小品六度集杂譬喻等注安般守意法镜道树传泥洹呗声清靡哀亮
- id: guji-康僧会-event-huh皓化导
  title_zh: 酬答张昱化导孙皓受戒
  date: '0275'
  year_of: 275
  place_zh: 建初寺吴宫
  description: 孙皓欲毁佛寺遣张昱诘难自旦至夕不能屈复问善恶报应以孝慈赤乌醴泉嘉苗为对取本业百三十五愿为戒皓受五戒疾瘳护法
- id: guji-康僧会-event-death
  title_zh: 天纪四年遘疾而终
  date: 0280-09
  year_of: 280
  place_zh: 建康建初寺
  description: 吴天纪四年四月皓降晋九月遘疾而终是岁晋武太康元年后苏峻焚塔何充重修赵诱见光信敬图写遗像传世
