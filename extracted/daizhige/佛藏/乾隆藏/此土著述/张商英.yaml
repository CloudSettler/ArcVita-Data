    title_zh: 欲排其教先尽读其书
    rationale: 摭其不合吾儒者折疑辨惑而后排之，不为斥鷃笑鲲鹏之论
  - date: 1100
    title_zh: 以流通佛法为报佛恩
    rationale: 非藉其徒不足以守法，作论明儒释不二，释天下之疑，息天下之谤
events:
