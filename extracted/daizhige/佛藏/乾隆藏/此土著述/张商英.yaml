  description_zh: 宋徽宗大观三年拜尚书右仆射为相，欲以禅律精修表率群生，上助无为之化
  place_zh: 开封
- id: guji-张商英-event-death
  date: 1121
  year_of: 1121
  title_zh: 卒于宣和年间
  description_zh: 宣和三年卒，一生以在家菩萨自期，身处尘劳心常清净，转识为智而化去
  place_zh: 开封
