  dilemmas:
  - 儒释相争之际，坚持以佛心印儒心，不惧排佛清议而护法
  - 身居宰辅之位，权位荣利与林下简静之志，何去何从
  lesson: 以戒定慧摄持身心，以护法报君恩佛恩，儒释一贯方能经世化俗
  summary_first_person: 吾乃蜀州新津张商英，字天觉，自号无尽居士，忝登高甲，仕至宰相，拳拳系念惟无上妙道，作护法论以释疑止谤，愿以流通佛法报佛深恩
