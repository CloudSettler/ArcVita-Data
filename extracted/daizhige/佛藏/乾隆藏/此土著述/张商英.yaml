  date: 1068
  year_of: 1068
  title_zh: 登进士第入仕
  description_zh: 登第入仕，历州县台谏，以高才博学峥嵘于朝，然已究心佛祖遗风
  place_zh: 开封
- id: guji-张商英-event-hufa
  date: 1099
  year_of: 1099
  title_zh: 撰护法论以扶宗教
  description_zh: 痛俗儒未读百十卷书先以排佛为急，援孔孟老庄及韩欧之说，引戒定慧会通儒释，成书一卷以护法
  place_zh: 京师
- id: guji-张商英-event-zaixiang
  date: 1109
  year_of: 1109
