  dilemmas:
  - title_zh: 拜与不拜之争
    description_zh: 朝廷以忠孝为由欲令僧尼跪拜君亲，沙门以方外出家为由守不拜之制，护法与顺俗两难
  - title_zh: 曲学适俗之虑
    description_zh: 恐浅学以一时适俗之权为会真之实，故发心集录晋至唐旧文以正视听
  lesson: 守道不拜非为傲慢，集文存信方能护法久远
  summary_first_person: 吾弘福沙门彦悰，采晋咸康至圣唐议拜旧牍，合三篇分六卷，以明沙门不应拜俗之义，愿后学不以权为实
