  - key: climax
    name: 厕译场笺传述作
    labels:
      zh: 述作
    start_date: 0658
    highlight_event_id: guji-彦悰-event-translate
  - key: closure
    name: 以著述护持法统
    labels:
      zh: 护法
    start_date: '0670'
    highlight_event_id: guji-彦悰-event-translate
  decisions:
  - date: '0650'
    title_zh: 安住弘福专修二藏
    rationale: 身城浪谧意树纷披，欲以九儒之要通二藏之微，为缁素楷式
  - date: 0658
    title_zh: 以述作助道不以拜屈求容
    rationale: 谓道在则贵不以人为轻重，宁以笔墨明教，不以形屈徇俗
