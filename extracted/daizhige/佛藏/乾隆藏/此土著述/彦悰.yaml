    name: 请王隐客作序传世
    labels:
      zh: 传布
    start_date: '0666'
    highlight_event_id: guji-彦悰-event-compile
  decisions:
  - date: '0660'
    title_zh: 断以不拜为正，广集旧文
    rationale: 恐迷生曲学以适俗为真，故自晋何充庾冰至桓玄王谧慧远等往返并录，以存公论
  - date: '0665'
    title_zh: 分故事与议论，加赞论格正
    rationale: 故事明隋以上致敬之迹，议论存是非之理，赞论折衷，以激昂幽致刷荡冥津
- id: guji-彦悰-endeavor-2
  title_zh: 弘福寺习学二藏助宣译业
  summary_zh: 居弘福寺，洽九儒探二藏，作风僧领袖，助益译场并笺述传记
