    title_zh: 以甲子横历纪佛祖世主
    rationale: 欲便初学使佛道世道污隆盛衰并见去繁杂谬妄存证信
  - date: 1341-06-11
    title_zh: 请虞集序冠篇首
    rationale: 既成二十二卷以彰所知论冠首更得名儒序引以尊韪而传远
events:
- id: guji-念常-event-birth
  date: 1282-03-12
  year_of: 1282
  title_zh: 诞生于华亭黄氏
  description_zh: 至元壬午三月十二日夜生神光烛室异香逾日不散母杨氏祈嗣观音梦长老托宿而娠
- id: guji-念常-event-ordination
  date: 1295-01-01
  year_of: 1295
  title_zh: 依圆明体志薙发受具
  description_zh: 年十二恳父母出家依平江圆明院体志习经栖心律典元贞乙未受具弱冠游江浙大丛林
- id: guji-念常-event-enlightenment
  date: 1308-01-01
  year_of: 1308
  title_zh: 参佛智晦机得悟掌记
  description_zh: 至大戊申往杭净慈参晦机值上堂举太原孚闻角因缘有省投丈室蒙颔俾掌记室服勤七年
- id: guji-念常-event-abbot
  date: 1315-01-01
  year_of: 1315
  title_zh: 迁径山后版住嘉兴祥符
  description_zh: 延祐乙卯佛智迁径山职后版朝廷差官理治教门承遴选住瑞世嘉兴祥符禅寺
- id: guji-念常-event-capital
  date: 1323-01-01
  year_of: 1323
  title_zh: 赴京缮黄金佛经礼五台
  description_zh: 至治癸亥夏乘驿赴京缮写黄金佛经观光三都礼五台曼殊出入翰相讨论坟典动撰书志
- id: guji-念常-event-compiling
  date: 1330-01-01
  year_of: 1330
  title_zh: 博采传记考订编纂
  description_zh: 禅悦外博及群书取佛祖住世本末译经弘教师衣法嫡裔王臣护持论驳异同参考讹正历二十余年
- id: guji-念常-event-complete
  date: 1341-06-11
  year_of: 1341
  title_zh: 通载成编虞集作序
  description_zh: 成佛祖历代通载二十二卷首卷言彰所知论次以天元甲子纪世主教门至正元年六月十一日虞集序于微笑庵
- id: guji-念常-event-death
  date: 1345-01-01
  year_of: 1345
  title_zh: 至正后示寂
  description_zh: 至正四年觉岸序本传后行迹未详推为示寂于松江一带住持弘化之余以通载传后
