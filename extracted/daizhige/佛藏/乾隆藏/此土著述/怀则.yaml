  dilemmas:
  - title_zh: 性具善恶与诸宗偏真之辨
    description: 诸宗但知性具善不知性具恶如何以当体全是之即显圆顿心印
  - title_zh: 妄心观佛与直观真心之抉择
    description: 初心行者应约妄心观弥陀应身还是直指真心方为顿同佛体
  lesson: 以性恶融通三千方成绝待妙观见闻相照即是传付不从他得
  summary_first_person: 吾为虎溪沙门怀则兴教传持天台宗教撰传佛心印记明性具善恶三千即空假中附净土境观要门示约心观佛之旨愿见闻者玄领默契不谬佛祖正传
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E5%A4%A9%E5%8F%B0%E4%BC%A0%E4%BD%9B%E5%BF%83%E5%8D%B0%E8%AE%B0.html
