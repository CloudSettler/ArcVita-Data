endeavors:
- id: guji-怀则-endeavor-1
  title_zh: 撰述天台传佛心印记阐明性具
  description: 溯金口祖承至天台章安荆溪四明之传辨性恶法门立三千绝待妙观为佛祖正传心印
  phases:
  - key: brewing
    name: 研习法华止观
    labels:
      zh:
      - 研习性具
    start_date: 1300
    highlight_event_id: guji-怀则-event-study
  - key: breakthrough
    name: 悟性恶即佛性
    labels:
      zh:
      - 悟入性恶
    start_date: 1310
    highlight_event_id: guji-怀则-event-write
  - key: climax
    name: 撰成心印记正文
    labels:
      zh:
      - 撰述完成
    start_date: 1315
    highlight_event_id: guji-怀则-event-write
  - key: closure
    name: 示见闻相照为传
    labels:
      zh:
      - 传付流通
    start_date: 1320
    highlight_event_id: guji-怀则-event-write
  decisions:
  - date: 1312
    title_zh: 以性恶为宗立三千妙观
    rationale: 若无性恶须破九界修恶显佛界性善非圆顿故直须当体全是方名为即
  - date: 1315
    title_zh: 判诸师偏指真心为别教
    rationale: 诸宗不知性具恶但云真心即佛翻恶证善仍属缘理断九故须拣别显圆
- id: guji-怀则-endeavor-2
  title_zh: 弘宣净土境观要门
  description: 引观经唯心观佛立约心观佛之旨以白毫为境具三谛三观导末世行人横出生死
  phases:
  - key: brewing
    name: 厌苦求乐发心念佛
    labels:
      zh:
      - 发心念佛
    start_date: 1318
    highlight_event_id: guji-怀则-event-pureland
  - key: breakthrough
    name: 立约心观佛义
    labels:
      zh:
      - 约心观佛
    start_date: 1320
    highlight_event_id: guji-怀则-event-pureland
  - key: climax
    name: 示白毫三观一心
    labels:
      zh:
      - 白毫入观
    start_date: 1322
    highlight_event_id: guji-怀则-event-pureland
  - key: closure
    name: 附要门流通末世
    labels:
      zh:
      - 流通净土
    start_date: 1325
    highlight_event_id: guji-怀则-event-pureland
  decisions:
  - date: 1320
    title_zh: 不取摄佛归心亦不摄心归佛
    rationale: 弥陀净土是我心本具托彼果佛相好熏我自心性体方名约心观佛
  - date: 1322
    title_zh: 以妄境为所观在了妄即真
    rationale: 直观真心须破妄显真属别教初心须约妄心观应身以三观体之真佛方显
