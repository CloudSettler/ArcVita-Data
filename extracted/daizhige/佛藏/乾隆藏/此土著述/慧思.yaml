  death_date: '0577'
  era: 南北朝陈
  reign_ref: 陈武帝至宣帝
  archetype: 苦修弘法的高僧
  dilemmas:
  - 末法恶世寿命短促当以何行疾超众圣速成佛道
  - 护持正法当行慈忍软语还是当摧伏恶人行大方便忍
  lesson: 观一切众生皆如佛想勤修禅定正直舍方便直入一乘
  summary_first_person: 吾是南岳慧思，专修法华三昧，说明安乐行义，教新学菩萨持戒忍辱勤修禅定，观六根清净众生即佛，不行次第不断烦恼，一心具足众果。
