endeavors:
- id: guji-慧思-endeavor-1
  title_zh: 修证法华三昧立无相安乐行
  description: 持戒忍辱勤修禅定，观眼等六根性空清净，证法华三昧，分别无相四安乐与有相文字行，会一乘如来藏义。
  phases:
  - key: brewing
    name: 少小出家持戒修禅
    labels:
      zh: 持戒忍辱勤学法华
    start_date: 0529
    highlight_event_id: guji-慧思-event-practice
  - key: breakthrough
    name: 悟入法华三昧得六根清净
    labels:
      zh: 深妙禅定观法性空
    start_date: 0548
    highlight_event_id: guji-慧思-event-realize
  - key: climax
    name: 说法华经安乐行义判一乘
    labels:
      zh: 无相四安乐正慧离著
    start_date: '0555'
    highlight_event_id: guji-慧思-event-nanyue
  decisions:
  - date: 0548
    title_zh: 专修法华三昧观众生如佛
    rationale: 一切众生具足法身藏与佛无异，乱心惑障故法身不现，唯勤修禅定净惑方显，故观众生皆如佛想合掌礼拜。
  - date: '0550'
    title_zh: 正直舍方便不行次第
    rationale: 法华菩萨不作次第行亦不断烦恼，一心一学众果普备如莲一华成众果，故舍二乘对治但说无上道。
- id: guji-慧思-endeavor-2
  title_zh: 居止南岳护法授学传天台
  description: 止南岳衡山弘法华安乐行，护持正法调伏刚恶，授智顗法华三昧，开普贤劝发有相行与无相行双轨。
  phases:
  - key: brewing
    name: 入南岳结庵弘经
    labels:
      zh: 南岳安止演说大乘
    start_date: '0553'
    highlight_event_id: guji-慧思-event-nanyue
  - key: climax
    name: 护法大忍教化四众
    labels:
      zh: 三忍具足慈悲接引
    start_date: 0558
    highlight_event_id: guji-慧思-event-teach
  - key: closure
    name: 付嘱弟子般若寺示寂
    labels:
      zh: 传灯智者示现涅槃
    start_date: '0577'
    highlight_event_id: guji-慧思-event-death
  decisions:
  - date: 0558
    title_zh: 以大方便忍护持正法
    rationale: 将护恶人令长恶败坏正法即是行魔业，故或慈悲软语或粗言打拍皆为调众生护大乘，非初学世俗忍所能为。
  - date: '0560'
    title_zh: 授智顗法华三昧传安乐行
    rationale: 新学菩萨欲超诸菩萨疾成佛道须得善知识引导，故以法华安乐行付嘱智者令转诸声闻得佛智续佛慧命。
events:
- id: guji-慧思-event-birth
  title_zh: 生于武津
  date: '0515'
  year_of: 515
  location_zh: 武津
  description: 梁天监十四年生于武津，少小慕道，性好大乘。
- id: guji-慧思-event-practice
  title_zh: 出家从慧文习禅
  date: 0529
  year_of: 529
  location_zh: 河南许昌
  description: 年十五出家，从北齐慧文禅师受禅法，昼夜勤修，持戒忍辱精进学法华经。
- id: guji-慧思-event-realize
  title_zh: 夏州山中证法华三昧
  date: 0548
  year_of: 548
  location_zh: 夏州
  description: 于山中专修法华三昧，观眼色性空无生无灭，得六根清净具神通，始判无相有相二种安乐行。
- id: guji-慧思-event-nanyue
  title_zh: 入南岳衡山说安乐行义
  date: '0553'
  year_of: 553
  location_zh: 南岳衡山
  description: 止南岳普应峰说大乘顿觉法门，著法华经安乐行义一卷，明四安乐行三忍正慧离著之义。
- id: guji-慧思-event-teach
  title_zh: 授智顗法华三昧
  date: '0560'
  year_of: 560
  location_zh: 衡州
  description: 智顗北来师事，授以法华三昧及安乐行，智者豁然开悟，遂成天台一脉，后世尊为南岳大禅师。
- id: guji-慧思-event-death
  title_zh: 般若寺示寂
  date: '0577'
  year_of: 577
  location_zh: 南岳般若寺
  description: 陈太建九年六月于南岳般若寺合掌而逝，世寿六十有三，遗教以法华安乐行为末世津梁。
