  archetype: 顿悟传心宗师
  dilemmas:
  - 求法为獦獠轻贱而佛性无南北之辩
  - 得衣反为争端藏遁弘化时机之择
  lesson: 菩提自性本来清净，但用此心直了成佛，不假文字，顿见真如。
  summary_first_person: 吾岭南新州卖柴鄙夫，父早亡，养母艰贫，一闻金刚经应无所住而生其心即悟，往黄梅谒忍大师，踏碓八月，三更得法传衣，南遁猎队十五载，后于曹溪开东山法门，只论见性，不论禅定解脱。
