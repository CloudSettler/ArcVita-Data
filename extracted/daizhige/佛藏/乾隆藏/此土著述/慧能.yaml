endeavors:
- id: guji-慧能-endeavor-1
  title_zh: 黄梅求法得衣为六祖
  summary_zh: 卖柴闻经往黄梅，破柴踏碓八月，对偈显本心，三更受衣钵南行。
  phases:
  - key: brewing
    name: 卖柴闻经启行
    labels:
      zh: 闻经开悟
    start_date: 0658
    highlight_event_id: guji-慧能-event-wenjing
  - key: breakthrough
    name: 对机明佛性无南北
    labels:
      zh: 明心见性
    start_date: 0659
    highlight_event_id: guji-慧能-event-huangmei
  - key: climax
    name: 三更传衣付嘱南行
    labels:
      zh: 传衣得法
    start_date: 432
    highlight_event_id: guji-慧能-event-chuanyi
  - key: closure
    name: 大庾岭度慧明避难
    labels:
      zh: 南遁护法
    start_date: 432
    highlight_event_id: guji-慧能-event-dayuling
  decisions:
  - date: 0659
    title_zh: 安母往黄梅惟求作佛
    rationale: 宿昔有缘闻金刚经即悟，取银安母，远礼五祖不求余物。
  - date: 432
    title_zh: 三鼓入室受法即行
    rationale: 衣为争端命如悬丝，逢怀则止遇会则藏，悟了自度速往南方。
- id: guji-慧能-endeavor-2
  title_zh: 曹溪开法立顿教
  summary_zh: 猎队藏身十五载，出至法性寺论心动，剃度开东山法门，宝林示众传无相戒定慧。
  phases:
  - key: brewing
    name: 四会猎队守网放生
    labels:
      zh: 隐遁养道
    start_date: 433
    highlight_event_id: guji-慧能-event-dayuling
  - key: breakthrough
    name: 法性寺论风幡心动
    labels:
      zh: 心动示法
    start_date: 446
    highlight_event_id: guji-慧能-event-faxing
  - key: climax
    name: 菩提树下开东山法门
    labels:
      zh: 开法度众
    start_date: 446
    highlight_event_id: guji-慧能-event-caoxi
  - key: closure
    name: 宝林大梵寺说法传坛经
    labels:
      zh: 顿教流通
    start_date: 447
    highlight_event_id: guji-慧能-event-caoxi
  decisions:
  - date: 446
    title_zh: 时当弘法不可终遁而出
    rationale: 思惟因缘已熟，不论禅定解脱，惟论见性，以不二之法出世救世。
  - date: 446
    title_zh: 示衣钵受印宗剃度
    rationale: 黄梅衣法南来已验，愿事为师开法，不滞文字，直指人心。
events:
- id: guji-慧能-event-birth
  date: 0638
  year_of: 638
  title_zh: 南海诞生
  description_zh: 严父本贯范阳左降岭南为新州百姓，父早亡，母子移居南海卖柴养亲。
- id: guji-慧能-event-wenjing
  date: 0658
  year_of: 658
  title_zh: 送柴闻金刚经开悟
  description_zh: 送柴至客店闻客诵应无所住而生其心即悟，问得黄梅东禅忍大师劝持金刚经见性，蒙客与银安母往参。
- id: guji-慧能-event-huangmei
  date: 0659
  year_of: 659
  title_zh: 黄梅谒祖破柴踏碓
  description_zh: 自言惟求作佛，对言佛性无南北，退至后院破柴踏碓八余月，祖默识其见可用。
- id: guji-慧能-event-chuanyi
  date: 432
  year_of: 660
  title_zh: 南廊书偈三更传衣
  description_zh: 神秀偈未见性，慧能偈菩提本无树本来无一物，祖擦偈护之，夜以杖击碓三下，三鼓入室大彻，传衣钵付嘱逢怀则止遇会则藏，送至九江自度南行。
- id: guji-慧能-event-dayuling
  date: 432
  year_of: 660
  title_zh: 大庾岭度慧明四会避难
  description_zh: 掷衣石上为法说不思善恶本来面目，慧明悟，改名道明，慧能至曹溪复避难猎人队十五载，吃肉边菜随宜说法。
- id: guji-慧能-event-faxing
  date: 446
  year_of: 676
  title_zh: 法性寺论心动得剃度
  description_zh: 值印宗讲涅槃经，二僧论风幡动，进言不是风动幡动仁者心动，征诘合佛性不二，出示衣钵，为其剃度事师。
- id: guji-慧能-event-caoxi
  date: 447
  year_of: 677
  title_zh: 曹溪宝林开法说法
  description_zh: 于菩提树下开东山法门，至宝林韶州大梵寺升座，说摩诃般若定慧为本无相为体无念为宗无住为本，传无相戒四弘愿。
- id: guji-慧能-event-death
  date: 0713-08-03
  year_of: 713
  title_zh: 曹溪示寂
  description_zh: 东山得法弘化三十余年，法流四海，至先天二年八月初三示寂，门人法海等集为坛经。
