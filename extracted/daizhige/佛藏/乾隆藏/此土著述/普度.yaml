    highlight_event_id: guji-普度-event-praise
  decisions:
  - date: 1308-11-15
    title_zh: 捧宝鉴上奏求刊行
    rationale: 恐微旨暧昧正道湮微，须借朝廷护持洗佛日重光，令见闻同成佛道祝延圣寿皇图永固
  - date: 1312-02-01
    title_zh: 忘躯为法续佛慧命
    rationale: 融真混俗示火中莲，欲起祖风载振虎溪，策精进发阐提同归极乐无为之化
events:
- id: guji-普度-event-birth
  date: 1241
  year_of: 1241
  title_zh: 诞生于浙之丹阳蒋氏
  description: 家世事佛，积善生而敏锐，弱冠厌俗缘投簪薙发
  location: 丹阳
- id: guji-普度-event-study
  date: 1261
  year_of: 1261
  title_zh: 初参龙华宝山慧禅师
  description: 一见器之，诫历叩诸老之门，琢磨淘汰达心净土见性弥陀
  location: 龙华
- id: guji-普度-event-compile
  date: 1305-12-12
  year_of: 1305
  title_zh: 大德九年弥陀示相日题叙宝鉴
  description: 翘心净土探赜先宗，编集要言为十篇，江州庐山东林白莲宗善法堂主优昙普度斋沐谨题
  location: 庐山东林禅寺
- id: guji-普度-event-canon
  date: 1308-11-15
  year_of: 1308
  title_zh: 至大元年奉旨大都刊板印行
  description: 亲捧莲宗宝鉴启奉令旨，于明理不花丞相施建无量寿法王寺内镂板毕工，祝延皇帝圣寿皇图永固
  location: 大都无量寿法王寺
- id: guji-普度-event-praise
  date: 1314-05-01
  year_of: 1314
  title_zh: 延祐甲寅诸师叙赞印证
  description: 天童东岩圆应日禅师证为善哉，大仰大圆佛鉴传法沙门希陵与明智崇胜德合叙其振复东林祖风之功
  location: 大仰山
- id: guji-普度-event-death
  date: 1315
  year_of: 1315
  title_zh: 延祐后示寂留鉴垂无穷
  description: 开导人天续佛慧命，统众归宗不舍悲愿，后之修净业者披阅是集洞明佛祖旨趣
  location: 庐山
