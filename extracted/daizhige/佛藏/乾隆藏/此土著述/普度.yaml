    title_zh: 立十门以鉴真伪
    rationale: 见称莲宗者弃本逐末着相修行，故分正因正教正宗正派正信正行正愿往生正诀正报正论井井有条
  - date: 1305-12-12
    title_zh: 以念佛三昧开示人天
    rationale: 逢佛心天子正法治世，欲以祖师念佛三昧作将来眼目，令枉者直邪者正疑者决迷者悟
- id: guji-普度-endeavor-2
  title_zh: 住持东林请旨刊行振祖风
  summary: 主庐山东林白莲宗善法堂，赴大都请灌顶国师证盟，蒙旨刊板颁行各省
