    highlight_event_id: guji-智广-event-collate
  - key: climax
    name: 定持诵轨则
    labels:
      zh: 依师依经晓梵音专志持诵
    start_date: '1200-08-15'
    highlight_event_id: guji-智广-event-compile
  - key: closure
    name: 劝往生净土
    labels:
      zh: 以持明功德回向往生安乐刹
    start_date: '1200-08-15'
    highlight_event_id: guji-智广-event-print
  decisions:
  - date: '1198'
    title_zh: 立四念二持以为常轨
    rationale: 为令行住坐卧皆得持念不断，故分无数有数以摄众机
  - date: '1200-08-15'
    title_zh: 示依师正音不断持诵
    rationale: 恐字句讹转功德难成，故须求晓梵音者指决而专志持诵
