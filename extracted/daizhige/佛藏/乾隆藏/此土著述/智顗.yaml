  - title_zh: 隐修与弘化之择
    description_zh: 慕安隐修以自证，复念众生未悟，须出山演教广利末俗
  - title_zh: 空有与中道之会
    description_zh: 须会通假入空与空入假，不滞二边以显一心三观实相
  lesson: 以心观为宗实相为体，会通教行理三者，借十六妙观安心净土，灭恶生善以化末世
  summary_first_person: 我智顗生于荆州，少丧怙恃而慕出尘，从南岳慧思得法华三昧，入天台阐止观，立一心三观之旨，后疏观无量寿佛经，明心净则土净，愿从行者共生安养，同证实相
