  - 言则伤实而默则致失，言默两俱不可时如何申说甚深法性
  - 广则令智退而略则义不周时如何处中立五重玄义令义易明了
  lesson: 以法性无量甚深统摄横竖一切法门，依通别体宗用教五章开显经王之义，令教观双运理事圆融
  summary_first_person: 吾客寄此土，托金光明甚深无量之义，立通别体宗用教五章，总别相资，遍譬横广竖高，冀涓露入海，禽鸟向山，与众生同均法性之味
