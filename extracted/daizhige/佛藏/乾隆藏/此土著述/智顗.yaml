endeavors:
- id: guji-智顗-endeavor-1
  title_zh: 天台宗教观开立与止观弘化
  description_zh: 承南岳慧思法华禅慧，入金陵天台荆襄弘法，立次第三观与一心三观，安止观双运以开天台一宗
  phases:
  - key: brewing
    name: 荆州出家南岳从学
    labels:
      zh: 从师学法
    start_date: '0556'
    highlight_event_id: guji-智顗-event-study
  - key: breakthrough
    name: 金陵弘法得智者号
    labels:
      zh: 弘法立名
    start_date: '0567'
    highlight_event_id: guji-智顗-event-jinling
  - key: climax
    name: 入天台建寺制止观
    labels:
      zh: 开宗弘禅
    start_date: '0575'
    highlight_event_id: guji-智顗-event-tiantai
  - key: closure
    name: 荆襄再弘付嘱后学
    labels:
      zh: 传法付嘱
    start_date: 0585
    highlight_event_id: guji-智顗-event-jingxiang
  decisions:
  - date: '0575'
    title_zh: 入天台山华顶栖隐弘禅
    rationale: 厌金陵名利喧扰，欲依山水修禅制观，以实修摄众开一宗之基
  - date: 0585
    title_zh: 出山赴荆襄应请弘经
    rationale: 为续佛慧命广化四众，不滞一山，借讲说注疏普摄顿渐之机
- id: guji-智顗-endeavor-2
  title_zh: 观无量寿佛经疏注与净土观门阐释
  description_zh: 以心观为宗实相为体，释十六妙观三种净业，会通四种净土，以观慧导归安养极乐
  phases:
  - key: brewing
    name: 阇王杀逆缘起深究
    labels:
      zh: 解序发起
    start_date: 0590
    highlight_event_id: guji-智顗-event-jingxiang
  - key: breakthrough
    name: 立心观净土净为宗
    labels:
      zh: 立宗明体
    start_date: 0594
    highlight_event_id: guji-智顗-event-commentary
  - key: climax
    name: 释十六观四土往生
    labels:
      zh: 广释观门
    start_date: 0595
    highlight_event_id: guji-智顗-event-commentary
  - key: closure
    name: 流通付嘱末俗有缘
    labels:
      zh: 流通结劝
    start_date: 0596
    highlight_event_id: guji-智顗-event-death
  decisions:
  - date: 0594
    title_zh: 以实相为体心观为宗判经
    rationale: 欲破执事昧理之偏，会事观归理性，使落日大水等观即入中道
  - date: 0595
    title_zh: 判属大乘方等顿教摄凡夫机
    rationale: 正为韦提希凡夫未证小果开示，使五逆罪灭横截三辈，不从渐次而入
events:
- id: guji-智顗-event-birth
  type: birth
  title_zh: 生于荆州华容陈氏
  date: 0538
  year_of: 538
  description_zh: 梁大同四年，生荆州华容，父陈起祖，母徐氏，少而聪慧好佛典
- id: guji-智顗-event-study
  type: career
  title_zh: 出家从慧思受法华安乐行
  date: '0556'
  year_of: 556
  description_zh: 十八岁从慧旷出家，旋往南岳从慧思学法华，得法华三昧，悟一心三观
- id: guji-智顗-event-jinling
  type: career
  title_zh: 入金陵弘法获智者大师号
  date: '0567'
  year_of: 567
  description_zh: 入建康弘讲禅慧，陈宣帝请讲法华大智度论，敕号智者，名振江表
- id: guji-智顗-event-tiantai
  type: career
  title_zh: 入天台山建修禅寺弘止观
  date: '0575'
  year_of: 575
  description_zh: 入天台华顶，建修禅寺，修法华三昧，撰次第禅门等，为天台开宗之基
- id: guji-智顗-event-jingxiang
  type: career
  title_zh: 出山荆襄弘化讲经授徒
  date: 0585
  year_of: 585
  description_zh: 应请出山，往荆襄玉泉弘法，授菩萨戒，讲法华，门下灌顶等传承益众
- id: guji-智顗-event-commentary
  type: career
  title_zh: 撰佛说观无量寿佛经疏一卷
  date: 0595
  year_of: 595
  description_zh: 疏解观经，以心观净则佛土净为宗，实相为体，详释五义六即三观四土，导凡夫往生安养
- id: guji-智顗-event-death
  type: death
  title_zh: 圆寂于石城寺
  date: '0597-11-24'
  year_of: 597
  description_zh: 隋开皇十七年十一月二十四日，示寂于石城寺，遗嘱依法不依人，世寿六十僧腊四十
