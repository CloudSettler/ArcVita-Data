  name_zh: 法显
  names:
    zh: 法显
    en: Faxian
  lifespan:
    birth:
      date: '0337'
      precision: year
      is_circa: true
      raw: 约晋成帝咸和十二年
    death:
      date: '0422'
      precision: year
      is_circa: true
      raw: 约晋恭帝元熙二年
  birth_date: '0337'
  death_date: '0422'
  era: 东晋
  reign_ref: 后秦弘始二年
  archetype: 求法者
  dilemmas:
  - 律藏残缺欲求全戒而沙河雪山生死莫测
  - 同行或返或亡独进独归坚守求法本愿
  lesson: 为求全戒不惜身命西行东归以传持正法补阙为任
  summary_first_person: 吾昔在长安慨律藏残缺遂与同志西行越葱岭历天竺求得戒律归而传译以补此土阙典
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E6%B3%95%E6%98%BE%E4%BC%A0.html
endeavors:
- id: guji-法显-endeavor-1
  title_zh: 西行天竺寻求戒律
  summary: 以弘始二年自长安出发度沙河越葱岭历三十余国至中天竺求得摩诃僧祇律等
  phases:
  - key: brewing
    name: 长安结契发愿西行
    labels:
      zh:
      - 发愿
    start_date: 0399
    highlight_event_id: guji-法显-event-depart
  - key: breakthrough
    name: 度沙河越葱岭入北天竺
    labels:
      zh:
      - 跋涉
    start_date: 0399
    highlight_event_id: guji-法显-event-cross
  - key: climax
    name: 历中天竺访圣迹求戒律
    labels:
      zh:
      - 求法
    start_date: '0402'
    highlight_event_id: guji-法显-event-india
  - key: closure
    name: 南至师子国泛海东归
    labels:
      zh:
      - 归程
    start_date: '0411'
    highlight_event_id: guji-法显-event-return
  decisions:
  - date: 0399
    title_zh: 与慧景等同契至天竺寻求戒律
    rationale: 感律藏残缺不全故不顾沙河雪山之难以求全戒
  - date: '0400'
    title_zh: 于于阗观行像留三月复进子合竭叉
    rationale: 欲遍观圣迹广访律典故缓行咨询不急趋前
  - date: '0401'
    title_zh: 独进那竭供养顶骨佛影而南度雪山
    rationale: 同行分散病亡而求法未竟故独进不退
- id: guji-法显-endeavor-2
  title_zh: 东归译经著传补阙
  summary: 义熙中归建康于道场寺译出摩诃僧祇律等并自记游天竺事为法显传
  phases:
  - key: brewing
    name: 泛南海附商船东向
    labels:
      zh:
      - 东归
    start_date: '0411'
    highlight_event_id: guji-法显-event-return
  - key: breakthrough
    name: 抵青州长广转赴建康
    labels:
      zh:
      - 抵达
    start_date: '0412'
    highlight_event_id: guji-法显-event-return
  - key: climax
    name: 共佛陀跋陀罗译摩诃僧祇律
    labels:
      zh:
      - 译经
    start_date: '0413'
    highlight_event_id: guji-法显-event-translate
  - key: closure
    name: 自记游历成法显传
    labels:
      zh:
      - 著述
    start_date: '0414'
    highlight_event_id: guji-法显-event-translate
  decisions:
  - date: '0411'
    title_zh: 自师子国泛海东归载经律西来
    rationale: 所求已得当归补此土阙典故冒险泛海
  - date: '0413'
    title_zh: 于建康道场寺出摩诃僧祇律等
    rationale: 以所携梵本传译流通使戒律完备僧制有依
  - date: '0414'
    title_zh: 自记游天竺事作法显传一卷
    rationale: 记山川圣迹风土戒法以示后人求法轨范
