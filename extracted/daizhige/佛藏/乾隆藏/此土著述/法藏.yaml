  dilemmas:
  - 如何会通三乘差别而不坏一乘圆极
  - 如何以言教开显不可说之果海普贤境界
  lesson: 以别摄同会权归实，立五教十宗令机教相契，显法界缘起无尽
  summary_first_person: 吾少慕华严，承学于智俨，幸逢圣后崇译大经，亲预笔受，开演法界缘起，复分五教开十宗，著分齐章建别教一乘同教一乘，明三乘悉从一乘所流，愿后学因教悟宗入普贤行海
