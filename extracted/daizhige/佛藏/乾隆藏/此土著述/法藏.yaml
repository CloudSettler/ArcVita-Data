    start_date: '0700'
    highlight_event_id: guji-法藏-event-teach
  decisions:
  - date: 0690
    title_zh: 以根机定不定会通三时
    rationale: 分此世根定者各见始终不同与不定者渐次增微，以解显密顿渐之难
  - date: '0700'
    title_zh: 判起信归如来藏缘起宗
    rationale: 许如来藏随缘成阿赖耶以彻事，许依他无性同如以彻理，故理事无碍为究竟
