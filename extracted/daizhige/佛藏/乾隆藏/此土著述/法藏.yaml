endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 笔受华严弘传法界缘起
  summary: 承智俨遗绪，预武周译场，弘讲新旧华严，奠定圆教弘传之基
  phases:
  - key: brewing
    name: 师事智俨受华严法
    labels:
      zh: 师承受学
    start_date: 0660-01-01
    highlight_event_id: guji-法藏-event-study
  - key: breakthrough
    name: 预译八十华严敷演圆教
    labels:
      zh: 译经弘化
    start_date: 0699-01-01
    highlight_event_id: guji-法藏-event-translation
  - key: climax
    name: 讲授华严摄益群机
    labels:
      zh: 开筵敷教
    start_date: 0700-01-01
    highlight_event_id: guji-法藏-event-composition
  decisions:
  - date: 0699-01-01
    title_zh: 应诏入实叉难陀译场笔受刊定
    rationale: 旧经文阙义隐，藉具足法界主伴无尽之文方能立宗弘化
  - date: 0700-01-01
    title_zh: 依新经开讲华严普摄朝野
    rationale: 以讲说摄益令圆教深入人心，为后立教分宗培植机缘
- id: guji-法藏-endeavor-2
  title_zh: 著分齐章立五教十宗建一乘
  summary: 会通古今立教，开别教同教二门，分小始终顿圆五教，开十宗以定一乘分齐
  phases:
  - key: brewing
    name: 叙古今十家立教以作龟镜
    labels:
      zh: 会通判教
    start_date: 0699-01-01
    highlight_event_id: guji-法藏-event-translation
  - key: breakthrough
    name: 建别教同教摄三乘归一乘
    labels:
      zh: 建立一乘
    start_date: 0700-01-01
    highlight_event_id: guji-法藏-event-composition
  - key: closure
    name: 成四卷分齐章垂范后学
    labels:
      zh: 述作垂范
    start_date: 0705-01-01
    highlight_event_id: guji-法藏-event-composition
  decisions:
  - date: 0700-01-01
    title_zh: 立别教一乘异于三乘同教一乘摄于三乘
    rationale: 若不分相则圆极混于权便，若不该摄则权法无所归宿，故以分相该摄双明不一不异
  - date: 0705-01-01
    title_zh: 判小大始终顿圆五教开我法等十宗
    rationale: 圣教万差机缘不等，须以教摄机以理开宗，方使华严无尽法界纲举目张
events:
- id: guji-法藏-event-birth
  type: birth
  title_zh: 降生于长安
  date: 0643-01-01
  year_of: 643
  description: 唐贞观十七年生于长安康氏，少年慕道，舍俗志求华严圆旨
- id: guji-法藏-event-study
  type: career
  title_zh: 师事智俨承华严正绪
  date: 0660-01-01
  year_of: 660
  description: 年少从智俨法师受学华严，传法界缘起之旨，承为华严三祖之业
- id: guji-法藏-event-translation
  type: career
  title_zh: 笔受八十华严参与译场
  date: 0699-01-01
  year_of: 699
  description: 武周证圣年间奉诏入实叉难陀译场，笔受刊定八十卷华严，兼弘讲旧经，大振圆教宗风
- id: guji-法藏-event-composition
  type: career
  title_zh: 撰华严一乘教义分齐章四卷
  date: 0700-01-01
  year_of: 700
  description: 于大荐福寺述作分齐章，立十门分判，开建立一乘摄益分齐，叙古今立教，分五教开十宗，以定别教同教一乘分齐
- id: guji-法藏-event-death
  type: death
  title_zh: 圆寂于长安
  date: 0712-01-01
  year_of: 712
  description: 唐先天元年示寂于长安，世寿七十，一生弘传华严，宗风被于朝野
