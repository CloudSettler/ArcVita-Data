  decisions:
  - date: '0742'
    title_zh: 以法华圆顿判摄诸教
    rationale: 法华前诸教未合五重皆粗，唯法华名等俱妙，故须简偏从圆
  - date: '0760'
    title_zh: 以五科方便十乘轨行摄众行
    rationale: 若无胜行胜果难阶，故用四种三昧遍摄众行，同用十乘之法
- id: guji-湛然-endeavor-2
  title_zh: 应李华请述止观大意
  summary: 因员外李华欲知止观大意，略报纲要，示发圆心修圆行感圆果起八教归三德之次第
  phases:
