  lesson: 教观相资解行并进方绍天台正脉不堕空谈
  summary_first_person: 吾天台沙门湛然，承南岳天台之后，愧禀承无功，唯以法华圆顿为宗，略述教观门户大概，示五重十义与十乘轨行，愿后人依之修行必不空过
