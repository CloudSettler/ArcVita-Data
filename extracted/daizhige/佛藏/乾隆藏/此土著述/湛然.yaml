    highlight_event_id: guji-湛然-event-death
  decisions:
  - date: '0756'
    title_zh: 以六即简偏圆发心
    rationale: 誓若无境名为狂愿，境不辨位凡圣不分，故约四弘四谛六即发圆心
  - date: '0756'
    title_zh: 示宿习禅境观法调伏
    rationale: 用观未入必发烦恼病患业魔禅见等境，当以寂照止观令等法界
