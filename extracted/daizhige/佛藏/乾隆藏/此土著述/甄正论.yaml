  description: 约唐初生后出家为佛授记寺沙门名玄嶷
- id: guji-甄正论-event-1
  date: '0730'
  year_of: 730
  title_zh: 撰甄正论卷上破天尊说
  description: 设滞俗公子与甄正先生问答引五运三才及史籍考无天尊辨三十二天玄都玉京结空成字之伪
- id: guji-甄正论-event-2
  date: '0740'
  year_of: 740
  title_zh: 撰甄正论卷中破度人经说
  description: 破始青碧落停轮聋盲得瘥及三世因果乐静信证天尊之说证为近代伪造
- id: guji-甄正论-event-death
  date: '0750'
  year_of: 750
  title_zh: 示寂
  description: 唐中约卒留甄正论三卷以甄正邪传于后世
