endeavors:
- id: guji-甄正论-endeavor-1
  title_zh: 设问答破斥天尊创世说
  summary_zh: 以五运三才史籍考辨天尊在天地先之妄立三十二天大罗玄都之伪
  phases:
  - key: brewing
    name: 少好坟籍甄明是非
    labels:
      zh:
      - 搜览史籍
    start_date: '0700'
    highlight_event_id: guji-甄正论-event-birth
  - key: breakthrough
    name: 据易纬破天尊先天地
    labels:
      zh:
      - 考辨五运
    start_date: '0720'
    highlight_event_id: guji-甄正论-event-1
  - key: climax
    name: 考三十二天大罗伪立
    labels:
      zh:
      - 辨伪灵宝
    start_date: '0725'
    highlight_event_id: guji-甄正论-event-1
  - key: closure
    name: 成甄正论卷上
    labels:
      zh:
      - 著论立言
    start_date: '0730'
    highlight_event_id: guji-甄正论-event-1
  decisions:
  - date: '0720'
    title_zh: 以史籍无载断天尊为虚
    rationale: 自无怀至汉魏史策祥瑞毕载独无天尊故定为虚妄
  - date: '0725'
    title_zh: 以昙梵字源证灵宝晚出
    rationale: 昙梵本出佛经翻译此前此土无此字故天名系窃佛经后造
- id: guji-甄正论-endeavor-2
  title_zh: 考辨三洞度人因果之伪
  summary_zh: 辨三十六部三洞玉字度人经神变因果皆盗佛经晚出伪造
  phases:
  - key: brewing
    name: 披览道经比校佛典
    labels:
      zh:
      - 校勘经论
    start_date: 0728
    highlight_event_id: guji-甄正论-event-1
  - key: breakthrough
    name: 破度人经日月停轮说
    labels:
      zh:
      - 破神变说
    start_date: '0732'
    highlight_event_id: guji-甄正论-event-2
  - key: climax
    name: 辨因果六道非道家旧义
    labels:
      zh:
      - 正名教源
    start_date: '0735'
    highlight_event_id: guji-甄正论-event-2
  - key: closure
    name: 成甄正论卷中
    labels:
      zh:
      - 护法弘教
    start_date: '0740'
    highlight_event_id: guji-甄正论-event-2
  decisions:
  - date: '0732'
    title_zh: 以天文历数破七日停轮
    rationale: 璇玑昼夜百刻不息史必书大瑞而典载不纪故知虚造
  - date: '0735'
    title_zh: 断三世因果为窃佛经
    rationale: 老庄本无因果六道之文陆修静等盗佛经安置故不立为道宗
events:
