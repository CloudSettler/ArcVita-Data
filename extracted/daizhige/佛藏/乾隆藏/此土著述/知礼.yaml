endeavors:
- id: guji-知礼-endeavor-1
  title_zh: 消释观经疏撰妙宗钞
  summary: 上顺妙宗教下愍物适时以一心三观释能观以一体三身释所观成六卷妙宗钞令慕学圆乘者得旨修证
  phases:
  - key: brewing
    name: 禀学宝云宗奉智者
    labels:
      zh: 酝酿承学
    start_date: 0978
    highlight_event_id: guji-知礼-event-chengxue
  - key: breakthrough
    name: 悯物立志钞疏显观
    labels:
      zh: 立志破局
    start_date: 1020
    highlight_event_id: guji-知礼-event-miaozong
  - key: climax
    name: 天禧五年重阳下笔
    labels:
      zh: 著述高峰
    start_date: 1021
    highlight_event_id: guji-知礼-event-miaozong
  - key: closure
    name: 示即心念佛利物
    labels:
      zh: 收束流通
    start_date: 1021
    highlight_event_id: guji-知礼-event-miaozong
  decisions:
  - date: 1021
    title_zh: 竭鄙思钞数千言略消此疏
    rationale: 前人多谈事相少示观门慕学者欲得旨修证故上顺妙宗以圆三观释观以妙三身释佛
  - date: 1021
    title_zh: 立心观为宗实相为体
    rationale: 约唯心观佛依正当处显发中实之体方能感四净土不异秘藏不垢不净故成前序乐邦金宝等义
- id: guji-知礼-endeavor-2
  title_zh: 弘扬圆顿念佛教观复兴天台
  summary: 对垢立净示二因感报以十六妙观为正三种净业为助正助双行加愿要制必生宝刹速证无生
  phases:
  - key: brewing
    name: 对秽显净明二报苦乐
    labels:
      zh: 奠基化导
    start_date: 0990
    highlight_event_id: guji-知礼-event-chengxue
  - key: breakthrough
    name: 明净心善行感四净土
    labels:
      zh: 宗义确立
    start_date: 1005
    highlight_event_id: guji-知礼-event-miaozong
  - key: climax
    name: 盛演十六观三辈往生
    labels:
      zh: 弘化广被
    start_date: 1021
    highlight_event_id: guji-知礼-event-miaozong
  - key: closure
    name: 劝正助双行求生安养
    labels:
      zh: 归宿劝修
    start_date: 1027
    highlight_event_id: guji-知礼-event-death
  decisions:
  - date: 1021
    title_zh: 以胜摄劣摄十六境归佛境
    rationale: 佛是所观胜境举正收依述主包徒言佛便周故十五境一一皆是圆妙三谛三观
  - date: 1021
    title_zh: 判教属顿劝初心进功
    rationale: 观虽深妙本被初心纵未入品为因亦强生彼预大会速入圣阶故令外加事忏内勤理观
