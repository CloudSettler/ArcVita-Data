  title_zh: 立顿悟渐修宗撰修心诀
  summary_zh: 依善知识指路一念回光，判顿悟渐修如车二轮，破石压草邪修，示定慧等持
  phases:
  - key: brewing
    name: 迷心外觅波浪走
    labels:
      zh:
      - 外觅
      - 迷倒
    start_date: '1165'
    highlight_event_id: guji-普照知讷-event-ordain
  - key: breakthrough
    name: 回光顿悟见本性
    labels:
      zh:
      - 顿悟
      - 见性
    start_date: '1182'
    highlight_event_id: guji-普照知讷-event-awaken
  - key: climax
    name: 撰修心诀示定慧
    labels:
