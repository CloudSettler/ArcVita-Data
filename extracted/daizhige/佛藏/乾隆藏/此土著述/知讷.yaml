    title_zh: 不惜眉毛书数章发明真心
    rationale: 大道玄旷不得其门者虽检五千藏教不为多故于第二峰头略垂方便
  - date: 1203-01-01
    title_zh: 以无心为正众善为助
    rationale: 恐学者恃天真不习众善翻成懈怠故说正助双行以显性功德
