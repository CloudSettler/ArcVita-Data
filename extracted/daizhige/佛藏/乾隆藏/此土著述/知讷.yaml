      - 曹溪
    start_date: '1200'
    highlight_event_id: guji-普照知讷-event-caoqi
  - key: climax
    name: 悟后牧牛任运双修
    labels:
      zh:
      - 牧牛
      - 任运
    start_date: '1205'
    highlight_event_id: guji-普照知讷-event-xiuxin
  - key: closure
    name: 示寂付法曹溪
    labels:
      zh:
      - 示寂
      - 付法
    start_date: '1210'
    highlight_event_id: guji-普照知讷-event-death
  decisions:
  - date: '1190'
    title_zh: 结定慧社共住熏修
    rationale: 独修易退，故集合志同，依悟修习，渐得百千三昧
  - date: '1200'
    title_zh: 入曹溪山守寂知
    rationale: 烦恼浓厚者须托静境，以称理摄散择法观空，均调昏乱以入无为
events:
- id: guji-普照知讷-event-birth
  title_zh: 诞生高丽
  date: '1158'
  year_of: 1158
  description_zh: 高丽毅宗十二年生于黄海道，俗姓郑
  location_zh: 高丽黄海道
- id: guji-普照知讷-event-ordain
  title_zh: 幼岁出家求佛
  date: '1165'
  year_of: 1165
  description_zh: 八岁出家，厌轮回热恼，矢志求自心真佛
  location_zh: 高丽俱轮寺
- id: guji-普照知讷-event-awaken
  title_zh: 读坛经顿悟本性
  date: '1182'
  year_of: 1182
  description_zh: 读六祖坛经至大惊，悟空寂虚知本心，与佛无殊，遂立先悟后修志
  location_zh: 高丽普门寺
- id: guji-普照知讷-event-society
  title_zh: 结定慧社
  date: '1190'
  year_of: 1190
  description_zh: 与同志结定慧社于公山居祖寺，共修定慧等持，长养圣胎
  location_zh: 高丽公山居祖寺
- id: guji-普照知讷-event-caoqi
  title_zh: 居曹溪松广山
  date: '1200'
  year_of: 1200
  description_zh: 移居曹溪山吉祥寺，改名修禅寺，倡顿悟渐修，禅教一致
  location_zh: 高丽曹溪山修禅寺
- id: guji-普照知讷-event-xiuxin
  title_zh: 撰修心诀示众
  date: '1205'
  year_of: 1205
  description_zh: 撰修心诀一卷，问答开示，辨自性随相二种定慧，斥石压草邪修，劝返闻自性
  location_zh: 高丽曹溪山
- id: guji-普照知讷-event-death
  title_zh: 示寂曹溪
  date: '1210'
  year_of: 1210
  description_zh: 高丽熙宗六年示寂，世寿五十三，谥普照，塔号甘露，法付曹溪
  location_zh: 高丽曹溪山
