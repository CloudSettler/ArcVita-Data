      - 守心
    start_date: '1210'
    highlight_event_id: guji-普照知讷-event-death
  decisions:
  - date: '1182'
    title_zh: 依悟而修不拨置后修
    rationale: 顿悟虽同佛而习气深，故长须照察，损之又损以至无为
  - date: '1205'
    title_zh: 直示空寂虚知为入路
    rationale: 欲令中下之机返闻闻性，识得本来面目，不堕外求苦行
- id: guji-普照知讷-endeavor-2
  title_zh: 结定慧社居曹溪弘化
  summary_zh: 结社牧牛，借随相对治均调昏乱，成就自然之理，化度有缘
  phases:
  - key: brewing
    name: 发愿结社同修
    labels:
