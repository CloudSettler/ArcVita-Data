person:
  qid: guji-普照知讷
  name_zh: 知讷
  names:
    zh: 普照禅师知讷
    en: Jinul
  lifespan:
    birth:
      date: '1158'
      precision: year
      is_circa: false
      raw: 高丽毅宗十二年
    death:
      date: '1210'
      precision: year
      is_circa: false
      raw: 高丽熙宗六年
  birth_date: '1158'
  death_date: '1210'
  era: 高丽中期
  reign_ref: 高丽明宗至熙宗朝
  archetype: 顿悟渐修中兴禅师
  dilemmas:
  - 顿悟已同诸佛何故仍须渐修长养圣胎
  - 自性定慧任运无为与随相定慧对治劳功如何并行不悖
  - 空寂虚知不昧与顽空无情如何辨别不堕邪见
  lesson: 离妄缘即如如佛，先悟后修，定慧等持，念起即觉
  summary_first_person: 我是高丽曹溪普照知讷，三界火宅中直指自心是佛，立顿悟渐修两门，以空寂虚知为法印，劝人返闻闻性，悟后牧牛，定慧双修，直至生死永绝
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/此土著述/高丽国普照禅师修心诀.md
