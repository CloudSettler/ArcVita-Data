  decisions:
  - date: 1265-11-01
    title_zh: 引经据典条分缕析立论
    rationale: 以秦汉以来史志经籍不见天尊年号三清为据，证伪说为空枝引蔓偷窃佛语
  - date: 1291-02-01
    title_zh: 应诏进呈不避忌讳
    rationale: 承蒙哥世祖两朝辩伪焚经之旨，顺圣朝护法之心，直斥伪妄以堤备后世
- id: guji-祥迈-endeavor-2
  title_zh: 住持云峰弘禅著述护持梵刹
  description_zh: 住道者山云峰禅寺，弘五派禅学，著文赋性海赋韩文别传四经序注等，佐江南恢复佛寺护持正化
  phases:
  - key: brewing
