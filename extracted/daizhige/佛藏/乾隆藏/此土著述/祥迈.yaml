    start_date: 1291-02-01
    highlight_event_id: guji-祥迈-event-present
  decisions:
  - date: 1255-01-01
    title_zh: 禅教兼弘旁阅群书
    rationale: 以禅参五派为本，兼通儒道百家，方能雄才巨笔挫邪扶正
  - date: 1285-01-01
    title_zh: 佐助恢复佛寺化导归正
    rationale: 顺至元焚伪后大势，助杨琏真迦等复寺化道为僧，显正以摄邪
events:
- id: guji-祥迈-event-birth
  title_zh: 降生太原延氏寄籍代郡
  date: 1225-01-01
  year_of: 1225
  location_zh: 太原后迁代郡
  description_zh: 俗姓延氏，系延赞之裔，世传缨冕，后为家于代郡
- id: guji-祥迈-event-ordination
  title_zh: 九岁落发随师请业
  date: 1234-01-01
  year_of: 1234
  location_zh: 代郡
  description_zh: 九岁落绀，内穷三藏外核九流，兼参五派，渐以雄文见称
- id: guji-祥迈-event-fame
  title_zh: 以才学名冠中华
  date: 1255-01-01
  year_of: 1255
  location_zh: 中原
  description_zh: 运谈天之口施不世之才，著文赋注解四经序韩文别传性海赋等，在世流传
- id: guji-祥迈-event-draft
  title_zh: 至元二年绝笔辩伪录于万寿兰若
  date: 1265-11-01
  year_of: 1265
  location_zh: 万寿兰若
  description_zh: 感少林奏辩化胡真伪焚伪经复佛寺之事，凭正典斥破狂谈，条举妄立天尊劫运三界帝师等伪
- id: guji-祥迈-event-burn
  title_zh: 至元十八年诏焚伪经
  date: 1281-10-20
  year_of: 1281
  location_zh: 天下
  description_zh: 先皇帝敕令除道德经外说谎经文尽行烧毁，佛日重晖，辩伪之说得伸
- id: guji-祥迈-event-present
  title_zh: 至元辛卯孟春奉敕进至元辩伪录
  date: 1291-02-01
  year_of: 1291
  location_zh: 大都大云峰
  description_zh: 大云峰长老迈吉祥奉皇帝明命撰述至元辩伪录五卷，奏对天颜，睿览颁行入藏流通
- id: guji-祥迈-event-death
  title_zh: 示寂
  date: 1300-01-01
  year_of: 1300
  location_zh: 云峰禅寺
  description_zh: 进录流通后不久示寂，后人以辩伪录列此土著述传世
