  death_date: 1300-01-01
  era: 元
  reign_ref: 元世祖至元
  archetype: 护教辩伪型高僧
  dilemmas:
  - title_zh: 好辩与护正之辨
    description_zh: 有伪则辩无伪则无辩，不好辩而不得不辩以正名教
  - title_zh: 出世清净与入世匡正之衡
    description_zh: 既弘禅宗正法，又奉敕斥伪介入佛道之争
  lesson: 考镜经史以别真伪，扶正不忘慈悲，辩伪旨在息诤安众
  summary_first_person: 吾俗姓延氏，太原人，系延赞之后，寄籍代郡，九岁落发，穷三藏而兼核九流，谙释老渊源，见全真诸道士窃佛语作老子八十一化图，毁塔占寺惑乱朝野，遂奉圣敕撰至元辩伪录五卷，穷邪正之优劣，佐朝廷焚伪经而复梵刹，愿佛日重晖法云广布耳
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/乾隆藏/此土著述/辩伪录.md
  - https://daizhige.org/佛藏/乾隆藏/此土著述/辩伪录.html
