    title_zh: 决意从义寂学天台
    rationale: 欲以教观正知见非一家之学不足以弘大乘故远参专修
  - date: 0989
    title_zh: 定居天竺弘化
    rationale: 天竺灵地可建道场聚众讲忏便于久住化俗护国安民
