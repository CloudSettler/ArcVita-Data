    name: 开十科集补助仪广示能请所求离过
    labels:
      zh: 高峰
    start_date: '1010'
    highlight_event_id: guji-遵式-event-jinguangming
  - key: closure
    name: 流通付嘱诫全写传持勿削观慧
    labels:
      zh: 收束
    start_date: '1020'
    highlight_event_id: guji-遵式-event-jinguangming
  decisions:
  - date: '1005'
    title_zh: 以新经补旧式散洒召请
    rationale: 旧文于奉供分洒处所时节皆阙新译分晓故据以定铨次
  - date: '1010'
    title_zh: 别安五悔依灭业障品
    rationale: 百录不出五悔后人滥用故依经补安忏悔劝请随喜回向发愿以成行相
