  dilemmas:
  - 天台圆教深妙与世人执事昧理疑谤净土如何以一理决尽群疑
  - 王臣宰官公务少暇与广论文繁难究如何举大纲立省要易修之行
  - 通途戒定久修难成与末世凡夫业重垢深如何别开系缘十念速生之直路
