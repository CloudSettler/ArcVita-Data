endeavors:
- id: guji-遵式-endeavor-1
  title_zh: 重振天台创制慈云忏法
  summary: 少年出家参学天台止观继踵知礼弘圆教于江浙住持天竺制金光明等忏法以礼忏净障领众修持
  phases:
  - key: brewing
    name: 宁海出家东掖受戒
    labels:
      zh: 出家参学
    start_date: 0980
    highlight_event_id: guji-遵式-event-ordination
  - key: breakthrough
    name: 从学四明深悟止观
    labels:
      zh: 禀教悟圆
    start_date: 0990
    highlight_event_id: guji-遵式-event-tiantai
  - key: climax
    name: 住持天竺制忏领众
    labels:
      zh: 住山制法
    start_date: 0998
    highlight_event_id: guji-遵式-event-tianzhu
  - key: closure
    name: 忏法流行缁素归仰
    labels:
      zh: 化行已成
    start_date: '1020'
    highlight_event_id: guji-遵式-event-tianzhu
  decisions:
  - date: 0990
    title_zh: 弃律学而专攻天台圆教
    rationale: 见律疏繁而止观直指心具实相能统万法故决意从知礼问道以圆顿为宗本
  - date: 0998
    title_zh: 住天竺制礼忏仪轨领众共修
    rationale: 见时人业障深重身心昏暗非礼佛忏悔不足以净良田故先立礼忏为众行之基
- id: guji-遵式-endeavor-2
  title_zh: 决疑立愿倡导往生净土
  summary: 针对排斥净土为小教权乘之谬立疑师疑法疑自三门以圆教心具决之又立礼忏十念系缘众福四门以践行愿著书流通普劝王臣士庶回向安养
  phases:
  - key: brewing
    name: 目睹排谤净土滥吹问津
    labels:
      zh: 痛念乖谬
    start_date: '1005'
    highlight_event_id: guji-遵式-event-writing
  - key: breakthrough
    name: 统百家以三疑收尽立圆宗
    labels:
      zh: 著论决疑
    start_date: '1010'
    highlight_event_id: guji-遵式-event-writing
  - key: climax
    name: 开四门以行愿摄机普劝系念
    labels:
      zh: 制行劝修
    start_date: '1012'
    highlight_event_id: guji-遵式-event-writing
  - key: closure
    name: 决疑行愿二门流通遐迩
    labels:
      zh: 著述流通
    start_date: '1025'
    highlight_event_id: guji-遵式-event-death
  decisions:
  - date: '1010'
    title_zh: 简小取大明净土为大乘了义中了义
    rationale: 见小乘贝书无一字劝生他方唯圆教一念心尘互周方能收五逆十念即登宝土故须甄简教部以绝混滥
  - date: '1012'
    title_zh: 略广文为四门要切俾少暇者易修
    rationale: 念王臣宰官几务少暇难寻安乐集等盈编帙故举礼忏如下种十念为正因系缘如膏雨众福如肥腻任修一门皆得往生
events:
- id: guji-遵式-event-birth
  title_zh: 生于宁海叶氏
  date: 0964
  year_of: 964
  type: birth
  description: 宋太祖乾德二年生于台州宁海叶氏幼颖悟笃信佛法为出家弘法之始
- id: guji-遵式-event-ordination
  title_zh: 投东掖山义全出家受具
  date: 0981
  year_of: 981
  type: career
  description: 年十七投东掖山义全出家受具戒精持律范后厌名相转志天台圆观
- id: guji-遵式-event-tiantai
  title_zh: 从四明知礼学天台住天竺弘化
  date: 0990
  year_of: 990
  type: career
  description: 往四明从知礼受天台教观深悟一念三千心具之旨后住杭州天竺创金光明忏法领众礼忏名播江浙
- id: guji-遵式-event-tianzhu
  title_zh: 领众修忏倡导念佛声振朝野
  date: '1007'
  year_of: 1007
  type: career
  description: 真宗朝屡召不赴以天竺为道场日率众礼忏念佛王臣士庶归仰者甚众奠定慈云宗风
- id: guji-遵式-event-writing
  title_zh: 撰往生净土决疑行愿二门
  date: '1015'
  year_of: 1015
  type: career
  description: 统道安怀感道绰慈敏等百家之说以疑师疑法疑自三疑决群惑以礼忏十念系缘众福四门立正行文成流通为净土要典
- id: guji-遵式-event-death
  title_zh: 示寂于杭州天竺山
  date: '1032'
  year_of: 1032
  type: death
  description: 宋仁宗明道元年十月示寂于天竺世寿六十九僧腊五十二众见佛来迎端坐而化后人尊为慈云尊者天竺宗风永传
