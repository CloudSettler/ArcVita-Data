endeavors:
- id: guji-遵式-endeavor-1
  title_zh: 天台教觀弘傳與懺法行道
  summary: 傳天台教觀於天竺，弘四種三昧，著法華懺等行法，以止觀統攝事修。
  phases:
  - key: brewing
    name: 天台學法
    labels:
      zh: 天台受學
    start_date: 0981
    highlight_event_id: guji-遵式-event-xuetaishan
  - key: breakthrough
    name: 住持天竺
    labels:
      zh: 天竺弘化
    start_date: 1000
    highlight_event_id: guji-遵式-event-zhutianzhu
  - key: climax
    name: 懺法大興
    labels:
      zh: 行法遠播
    start_date: 1010
    highlight_event_id: guji-遵式-event-zhutianzhu
  decisions:
  - date: 0991
    title_zh: 歸天台弘教
    rationale: 為續天台慧命，專弘止觀教觀，不滯空談。
  - date: 1000
    title_zh: 居錢塘天竺道場
    rationale: 以天竺為根本道場，示滅於此，廣開懺儀接引四眾。
- id: guji-遵式-endeavor-2
  title_zh: 熾盛光道場念誦儀編撰與消災法弘傳
  summary: 依娑羅王佛所說熾盛光大威德陀羅尼，立設壇供養示方法揀眾誦咒三業供養七科，禳五星陵逼除八萬不吉祥。
  phases:
  - key: brewing
    name: 考經立壇
    labels:
      zh: 經教考據
    start_date: 1005
    highlight_event_id: guji-遵式-event-zhishengguang
  - key: breakthrough
    name: 儀軌初成
    labels:
      zh: 五章儀成
    start_date: 1015
    highlight_event_id: guji-遵式-event-zhishengguang
  - key: closure
    name: 拾遺廣布
    labels:
      zh: 後人增廣
    start_date: 1035
    highlight_event_id: guji-遵式-event-zhishengguang
  decisions:
  - date: 1015
    title_zh: 撰熾盛光道場念誦儀五章
    rationale: 以持咒為主，定設壇場供養揀眾誦咒禮懺行道之制，使禳災有據。
  - date: 1018
    title_zh: 會通華梵持誦之諍
    rationale: 主張華梵兩存適時之變，依法持誦功力不殊，不墮偏執。
events:
- id: guji-遵式-event-birth
  title_zh: 誕生於天台
  date: 0964
  year_of: 964
  description: 宋乾德二年生於台州，後出家學天台教觀。
- id: guji-遵式-event-xuetaishan
  title_zh: 從學天台義寂
  date: 0981
  year_of: 981
  description: 往學於天台國清寺義寂，精研止觀教觀，深得法要。
- id: guji-遵式-event-zhutianzhu
  title_zh: 住持杭州天竺寺弘化
  date: 1000
  year_of: 1000
  description: 住錢塘天竺，弘四種三昧行法，化行當世，世稱慈雲尊者天竺法師。
- id: guji-遵式-event-zhishengguang
  title_zh: 撰熾盛光道場念誦儀
  date: 1015
  year_of: 1015
  description: 撰一卷五章儀軌，詳設壇場供養方法揀眾誦咒禮請持咒禮佛懺悔行道釋疑，以陀羅尼除國界災難星曜陵逼。
- id: guji-遵式-event-death
  title_zh: 示寂於天竺道場
  date: 1032-10-08
  year_of: 1032
  description: 宋明道元年十月八日示滅於錢塘天竺道場，門人靈鑑等拾遺編弘其懺法。
