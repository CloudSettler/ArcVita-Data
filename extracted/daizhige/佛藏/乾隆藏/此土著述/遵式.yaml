  name_zh: 遵式
  names:
    zh: 遵式
    en: Zunshi
  lifespan:
    birth:
      date: 0964
      precision: year
      is_circa: false
      raw: 宋太祖乾德二年
    death:
      date: 1032-10-08
      precision: day
      is_circa: false
      raw: 宋仁宗明道元年十月八日
  birth_date: 0964
  death_date: 1032-10-08
  era: 北宋
  reign_ref: 宋太祖至宋仁宗明道
  archetype: 天台弘法高僧
  dilemmas:
  - 華梵持誦之諍如何會通而不失陀羅尼功用
  - 消災禳星祈福與出世觀心修行如何兼顧不偏
  - 貧富國野道場條件懸殊如何皆令得作除災法
  lesson: 以三業規矩表三德妙義，借事儀顯理觀，令消災與修道不二。
  summary_first_person: 吾乃宋天竺傳天台教觀沙門遵式，號慈雲，弘天台止觀，倡四種三昧行法，撰熾盛光道場念誦儀，立壇場請召讚歎持咒禮懺行道之轨，願以威德神咒轉三障為三德，護國護家，成就吉祥。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E7%82%BD%E7%9B%9B%E5%85%89%E9%81%93%E5%9C%BA%E5%BF%B5%E8%AF%B5%E4%BB%AA.md
