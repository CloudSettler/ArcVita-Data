  summary_first_person: 吾乃宋耆山沙门遵式俗姓叶字彖号慈云幼出家而志天台从知礼而悟圆乘住天竺而制忏法悯世人疑师疑法疑自故作决疑门以理性具足统百家悯行者废驰故开行愿四门以礼忏十念系缘众福为往生正因愿共众生同生安养
