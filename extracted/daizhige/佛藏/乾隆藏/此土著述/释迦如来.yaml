  - key: climax
    name: 双林入般涅槃
    labels:
      zh: 示现灭度
    start_date: -0483-02-15
    highlight_event_id: guji-释迦如来-event-death
  - key: closure
    name: 香楼荼毗分塔供养
    labels:
      zh: 荼毗分塔
    start_date: -0483-02-16
    highlight_event_id: guji-释迦如来-event-death
  decisions:
  - date: -0483-02-14
    title_zh: 受纯陀粳粮施食
    rationale: 久证法身，为结最后福缘故权现应供，令施者得无疆福
  - date: -0483-02-15
    title_zh: 北首而卧入涅槃以戒为师
    rationale: 机缘已尽，为令众知无常故示现灭度，嘱令未来弟子依戒依法而住
