  decisions:
  - date: -0534-02-08
    title_zh: 逾城出家
    rationale: 睹生老病死苦，慕沙门寂静，为求解脱故舍王位眷属而出家
  - date: -0528-12-08
    title_zh: 舍苦行取中道证果
    rationale: 知苦行非道，调身调心坐菩提树，誓不成正觉不起此座
- id: guji-释迦如来-endeavor-2
  title_zh: 鹤林示疾般涅槃遗教
  summary_zh: 化缘既毕，受最后供养，于娑罗双树入般涅槃，以戒为师嘱累未来
