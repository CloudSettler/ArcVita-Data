      raw: 二月十五日入般涅槃于拘尸那迦娑罗双树间
  birth_date: -0563-04-08
  death_date: -0483-02-15
  era: 周代
  reign_ref: 周昭王至周敬王
  archetype: 开教教主
  dilemmas:
  - 睹生老病死众苦如何求解脱
  - 舍王位出家与孝亲济世如何两全
  - 如何令一切众生皆得灭度而不令一人独得灭度
  lesson: 示现无常以显真常，劝令像法众生敬奉经像，依戒依法而住
  summary_first_person: 吾本迦毗罗卫太子悉达多，因见生老病死而逾城出家，菩提树下证真，鹿野苑中初转法轮，四十九年随机制教，今于鹤林双树北首而卧入般涅槃，汝等当以戒为师，精设供养，唱叹遗德以续慧命
  source_urls:
