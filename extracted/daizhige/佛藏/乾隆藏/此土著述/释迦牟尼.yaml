    rationale: 观众生堪受清净妙法，为报本愿不入独觉涅槃，往鹿野苑先度憍陈如五人开甘露门
  - date: -0527-10-01
    title_zh: 受频婆娑罗请住竹园
    rationale: 为安众弘道须依止处，使圣言有宗，僧团有制，故受园建最初精舍摄化四众
