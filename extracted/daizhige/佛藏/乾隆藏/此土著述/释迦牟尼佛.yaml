  decisions:
  - date: -1009-02-08
    title_zh: 逾城出家
    rationale: 见老病死可厌，欲求解脱，乘净居天人劝请之机，夜逾城往檀特山修道
  - date: -1000-01-01
    title_zh: 舍无用处定与苦行
    rationale: 三年学不用处定及非非想定皆知非正因，日食麻麦六年亦非解脱，故舍邪法以趣菩提
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 鹿野转轮付法涅槃
  summary_zh: 成道后于鹿野苑为五比丘转四谛法轮，说法四十九年，临灭以法眼衣钵付摩诃迦叶
