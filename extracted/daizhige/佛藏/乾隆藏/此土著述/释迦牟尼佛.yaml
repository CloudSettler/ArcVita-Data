    title_zh: 为憍陈如等转四谛法轮
    rationale: 既证菩提，当先度鹿野五人，论道果令正法住世
  - date: -0925-02-15
    title_zh: 以妙心衣钵付摩诃迦叶
    rationale: 背痛欲入涅槃，恐正法断绝，故以清净法眼及金缕僧伽梨付嘱护持转授补处
