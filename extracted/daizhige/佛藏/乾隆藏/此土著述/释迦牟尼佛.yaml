  reign_ref: 昭王穆王之世
  archetype: 立教传法者
  dilemmas:
  - 王宫安乐与老病死苦之间当如何取舍
  - 外道苦行与中道正觉之间何者为真解脱
  - 入灭寂静与付嘱流布之间如何令正法不断
  lesson: 见老病死而厌离，出家求道而证觉，以清净法眼涅槃妙心付嘱相传，方能度诸有情不断佛种
  summary_first_person: 吾本迦毗罗卫刹利太子，见四门老病死而悲厌，于子夜逾城出家，历阿蓝郁头及六年苦行，皆知非正因，遂于菩提树下明星出时成正觉，鹿野苑中转四谛法轮，住世说法四十九年，临入涅槃以正法眼藏付摩诃迦叶，令转授流布无令断绝
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E6%AD%A4%E5%9C%9F%E8%91%97%E8%BF%B0/%E6%99%AF%E5%BE%B7%E4%BC%A0%E7%81%AF%E5%BD%95.html
