  summary_first_person: 吾生逢梁武崇佛之世，见七佛八菩萨神咒及诸家咒法散行，乃取其咒句、结缕、坛法、行道忏悔之仪，会为陀罗尼杂集十卷，今附梁录，愿后人依法持诵，消业除病，护国护身，直至菩提
