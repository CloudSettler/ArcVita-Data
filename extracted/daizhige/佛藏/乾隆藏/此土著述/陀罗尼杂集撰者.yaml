endeavors:
- id: guji-陀罗尼杂集-endeavor-1
  title_zh: 会集七佛八菩萨大陀罗尼
  summary: 取惟越至释迦七佛所说神咒并文殊虚空藏观音等八菩萨所说神咒，录咒句译义结缕法，成卷第一
  phases:
  - key: brewing
    name: 搜访咒本
    labels:
      zh: 搜集
    start_date: '0505'
    highlight_event_id: guji-陀罗尼杂集-event-collect
  - key: breakthrough
    name: 定七佛咒次
    labels:
      zh: 编次
    start_date: '0510'
    highlight_event_id: guji-陀罗尼杂集-event-seven
  - key: climax
    name: 合八菩萨咒
    labels:
      zh: 合编
    start_date: '0515'
    highlight_event_id: guji-陀罗尼杂集-event-eight
  - key: closure
    name: 成卷第一
    labels:
      zh: 成帙
    start_date: 0518
    highlight_event_id: guji-陀罗尼杂集-event-eight
  decisions:
  - date: '0510'
    title_zh: 以七佛为首立十五首之序
    rationale: 七佛乃过去世尊，先立其苏卢都呵等七咒，次附八菩萨咒，使体例分明
  - date: '0515'
    title_zh: 并录晋言译义与结缕法
    rationale: 咒须解义生信，行须结缕系项痛处系，故每咒具录诵遍结色结数
- id: guji-陀罗尼杂集-endeavor-2
  title_zh: 詳錄持誦壇儀令得現驗
  summary: 录塔下绕塔胡麻油灯洗浴持戒六时行道忏悔三七日等仪轨，并护国攘灾之法，成余卷流通
  phases:
  - key: brewing
    name: 考行法儀
    labels:
      zh: 考儀
    start_date: 0518
    highlight_event_id: guji-陀罗尼杂集-event-rite
  - key: breakthrough
    name: 定三七行道法
    labels:
      zh: 定法
    start_date: '0520'
    highlight_event_id: guji-陀罗尼杂集-event-rite
  - key: climax
    name: 著護國攘災法
    labels:
      zh: 護國
    start_date: '0522'
    highlight_event_id: guji-陀罗尼杂集-event-protect
  - key: closure
    name: 十卷雜集流通
    labels:
      zh: 流通
    start_date: '0525'
    highlight_event_id: guji-陀罗尼杂集-event-protect
  decisions:
  - date: '0520'
    title_zh: 具載戒行燈華懺悔之節
    rationale: 欲令鈍根障重者三七日持戒六时行道得四沙門果，故詳載淨衣不食五辛酒肉燒香散華之法
  - date: '0522'
    title_zh: 存鄰敵疫病刀兵救護之文
    rationale: 國王群臣可依咒樓上禮佛稱名誦持，感梵釋四王八部救護，故特存以利護國
events:
- id: guji-陀罗尼杂集-event-birth
  type: birth
  title_zh: 生於梁時
  date: '0500'
  year_of: 500
  description: 此土人，生於南北朝梁武崇佛之世，生年籍貫未詳
- id: guji-陀罗尼杂集-event-collect
  type: endeavor
  title_zh: 搜訪諸家陀羅尼本
  date: '0505-01-01'
  year_of: 505
  description: 訪求此土所傳陀羅尼，始有會集之志
- id: guji-陀罗尼杂集-event-seven
  type: endeavor
  title_zh: 編成七佛所說大陀羅尼
  date: '0510-04-16'
  year_of: 510
  description: 錄惟越式隨葉拘留秦拘那含迦葉釋迦七佛神咒，具黃縷結十四結三結等法，及移山斷流攘災豐熟之力
- id: guji-陀罗尼杂集-event-eight
  type: endeavor
  title_zh: 合編八菩薩所說神咒
  date: '0515-08-08'
  year_of: 515
  description: 續錄文殊虛空藏觀音救脫跋陀和大勢至得大勢堅勇等神咒，具五色縷結持戒斷食三七日行道之儀
- id: guji-陀罗尼杂集-event-rite
  type: endeavor
  title_zh: 詳定塔下行道懺悔儀
  date: '0520-03-01'
  year_of: 520
  description: 定東向塔內繞塔八十匝胡麻油燈七枚六时懺悔誦咒八十遍等法，記現光摩頂授記之驗
- id: guji-陀罗尼杂集-event-protect
  type: endeavor
  title_zh: 著護國卻敵除疫之法成十卷
  date: '0525-06-01'
  year_of: 525
  description: 著高樓禮佛稱拘那含救脫等名誦咒雨刀劍黑風退散之法，及水旱疫病召龍給水療治之法，雜集十卷成，今附梁錄
- id: guji-陀罗尼杂集-event-death
  type: death
  title_zh: 示寂年月未詳
  date: '0550'
  year_of: 550
  description: 撰集流通後示寂，卒年未詳，十卷行於世
