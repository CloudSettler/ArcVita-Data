    title_zh: 以自受用他受用智立顿证道
    rationale: 显教三无数劫十进九退，故依毗卢遮那自受用身及普贤金刚萨埵他受用智，令现生遇阿阇梨即得灌顶受职。
  - date: '0746-06-01'
    title_zh: 制五秘密念诵次第
    rationale: 为令行者舍有漏三业，结印持明入三摩地，故次第制发菩提心印契真言百字明及四眷属仪轨。
