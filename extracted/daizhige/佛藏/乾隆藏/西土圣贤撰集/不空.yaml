  - title_zh: 秘密口传与普化之衡
    description: 五字秘密法本由金刚大师口传，最为秘密，如何既护髻中珠般守护灌顶次第，又令狭劣众生得闻胜路
  - title_zh: 依法不依人与净信抉择
    description: 如来法无二，净信者所得，如何劝行者被精进铠，依法不依人，直心精进而不求供具时日
  lesson: 被精进铠依法不依人，以五字观行即凡夫身见成就佛身，愿以功德普觉群有
  summary_first_person: 吾不空奉诏译五字陀罗尼颂，传圣曼殊童子五字秘密法，教人结印持明观字入月轮，于一坐中成本尊身，愿离世网普觉群有
