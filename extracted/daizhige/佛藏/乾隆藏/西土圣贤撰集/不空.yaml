  decisions:
  - date: '0765-01-01'
    title_zh: 以五藏性劝发大愿
    rationale: 一切有情具如来藏金刚法羯磨藏性，故发五愿令速证金刚萨埵虚空藏观自在等位，不趣二乘。
  - date: '0765-06-01'
    title_zh: 以大智大悲不住两边
    rationale: 由大智不染生死，由大悲不住涅槃，故令菩萨尽生死恒作众生利，以般若方便加持令诸法清净。
