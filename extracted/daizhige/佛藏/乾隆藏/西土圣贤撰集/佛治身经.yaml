endeavors:
- id: guji-佛治身经-endeavor-1
  title_zh: 宣说自胜治身法
  summary: 以工语法行独处正意，明一人才胜千军不如自胜，制断恶念分别身中事
  phases:
  - key: brewing
    name: 独处正意酿法
    labels:
      zh:
      - 独处
      - 正意
    start_date: '0280-01-01'
    highlight_event_id: guji-佛治身经-event-1
  - key: breakthrough
    name: 明辨工语法行
    labels:
      zh:
      - 工语
      - 法行
    start_date: '0285-01-01'
    highlight_event_id: guji-佛治身经-event-1
  - key: climax
    name: 自胜胜军极致
    labels:
      zh:
      - 自胜
      - 治身
    start_date: '0290-01-01'
    highlight_event_id: guji-佛治身经-event-1
  - key: closure
    name: 身受七戒意受三戒
    labels:
      zh:
      - 持戒
      - 晓身
    start_date: '0295-01-01'
    highlight_event_id: guji-佛治身经-event-2
  decisions:
  - date: '0285-01-01'
    title_zh: 定工语为三十七品不乱人意
    rationale: 说三十七品为工语，使所说不乱人意，以正语治身
  - date: '0290-01-01'
    title_zh: 立不离二百五十戒为法行
    rationale: 不离戒律即是法行，分别身中事而自制断恶，是为胜身
- id: guji-佛治身经-endeavor-2
  title_zh: 先自教而后教余脱苦道
  summary: 先为自身定正教后教余，自身得教意不复难教余，等心不犯令一切从苦得脱
  phases:
  - key: brewing
    name: 自身定正酝酿
    labels:
      zh:
      - 自教
      - 自归
    start_date: '0295-01-01'
    highlight_event_id: guji-佛治身经-event-2
  - key: breakthrough
    name: 得黠得法得戒
    labels:
      zh:
      - 得黠
      - 得法
    start_date: '0300-01-01'
    highlight_event_id: guji-佛治身经-event-2
  - key: climax
    name: 教余易教普度
    labels:
      zh:
      - 教余
      - 脱苦
    start_date: '0305-01-01'
    highlight_event_id: guji-佛治身经-event-2
  - key: closure
    name: 等心不犯归乐无忧
    labels:
      zh:
      - 等心
      - 得乐
    start_date: '0310-01-01'
    highlight_event_id: guji-佛治身经-event-2
  decisions:
  - date: '0300-01-01'
    title_zh: 决先自教后教余
    rationale: 欲教余先自教，自身上头随法行便教余人，如是易教不复难教
  - date: '0305-01-01'
    title_zh: 立自归谛等心不犯
    rationale: 自归无有过身，自归不如自归谛，等心使人不堕结，多人亦莫犯
events:
- id: guji-佛治身经-event-birth
  type: birth
  title_zh: 失译经附西晋录流传之始
  date: '0280-01-01'
  year_of: 280
  description: 西土圣贤撰集佛治身经一卷，失译人名今附西晋录，佛言治身之教始传
- id: guji-佛治身经-event-1
  type: career
  title_zh: 说工语法行自胜胜军
  date: '0290-01-01'
  year_of: 290
  description: 佛言当学工语不离法行独处正意，千人一人胜千军不如一人能胜身，意念恶能自制断是为胜身
- id: guji-佛治身经-event-2
  type: career
  title_zh: 示先自教后教余得黠脱苦
  date: '0300-01-01'
  year_of: 300
  description: 先为自身定正教后教余，教身已黠得归得法得戒，昆弟中不复忧，教一切从苦得脱，明三十七品二百五十戒七戒三戒之义
- id: guji-佛治身经-event-death
  type: death
  title_zh: 西晋录附载定型
  date: '0316-12-31'
  year_of: 316
  description: 佛治身经以失译附西晋录定型，收入乾隆藏西土圣贤撰集，治身自胜之说存焉
