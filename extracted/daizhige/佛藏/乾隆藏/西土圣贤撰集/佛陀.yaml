- id: guji-佛吉祥德赞-event-dharmachakra
  title_zh: 鹿野苑初转法轮
  date: -0528-06-15
  year_of: -528
  event_type: career
  description: 为五比丘说四谛八正道，建立法幢，普施甘露法药，利乐天人
