    title_zh: 应请转法轮
    rationale: 愍众生愚痴暗冥，为令得智慧眼故，不住寂静而宣说苦集灭道
  - date: -0483-02-15
    title_zh: 以法为师嘱累弟子
    rationale: 色身无常，正法常住，令弟子以戒为师以法为依而不依人
events:
