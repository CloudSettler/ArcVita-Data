  description: 从精沫转凝四体头五，数髑髅齿根臂肋脊膂髀骨凡三百二十，以筋缠肉涂生革隐蔽，示九孔大疮腐臭苦器老死之法
- id: guji-内身观章句经-event-eleven
  title_zh: 宣说十一因缘灭道
  date: '0151-01-01'
  year_of: 151
  description: 佛言行者断大会多食多行多语多眠会聚多事爱身轻慢贪欲恶处十一缘，即得道疾不堕恶道
