endeavors:
- id: guji-内身观章句经-endeavor-1
  title_zh: 敷演内身空无常不净观
  description: 以五字句颂演身非人命无常苦空，溯痴爱缘起，析精沫凝结与三百二十骨，示九孔毒虺苦器以劝离著
  phases:
  - key: brewing
    name: 存本起观
    labels:
      zh: 存本积法
    start_date: '0150-01-01'
    highlight_event_id: guji-内身观章句经-event-birth
  - key: breakthrough
    name: 剖析骨体
    labels:
      zh: 三百二十骨
    start_date: '0150-06-01'
    highlight_event_id: guji-内身观章句经-event-bone
  - key: climax
    name: 显患离著
    labels:
      zh: 九孔毒虺苦器
    start_date: '0150-08-01'
    highlight_event_id: guji-内身观章句经-event-bone
  - key: closure
    name: 结示无我
    labels:
      zh: 非身非我
    start_date: '0150-10-01'
    highlight_event_id: guji-内身观章句经-event-bone
  decisions:
  - date: '0150-06-01'
    title_zh: 以因缘破神造自生之计
    rationale: 身有所由以痴爱为本，非天造神化，亦非无因自有，故当观缘起以除我执
  - date: '0150-08-01'
    title_zh: 以不净苦空劝智者不著
    rationale: 骨缝肉涂九孔渗漏，老病死逼如毒虺虎泽，愚者著之智者离之，故示厌离
- id: guji-内身观章句经-endeavor-2
  title_zh: 教授十一因缘灭道不堕恶道
  description: 承佛言开示行者十一堕缘，劝断大会多食多行多语多眠等，居善处以疾得道
  phases:
  - key: brewing
    name: 一心听训
    labels:
      zh: 一心美训
    start_date: '0151-01-01'
    highlight_event_id: guji-内身观章句经-event-eleven
  - key: breakthrough
    name: 列示堕缘
    labels:
      zh: 十一因缘
    start_date: '0151-02-01'
    highlight_event_id: guji-内身观章句经-event-eleven
  - key: climax
    name: 断缘疾得道
    labels:
      zh: 灭道不堕
    start_date: '0151-03-01'
    highlight_event_id: guji-内身观章句经-event-eleven
  - key: closure
    name: 居善劝勉
    labels:
      zh: 好善处居
    start_date: '0151-04-01'
    highlight_event_id: guji-内身观章句经-event-death
  decisions:
  - date: '0151-02-01'
    title_zh: 具列十一缘使行者自检
    rationale: 大会多食多行多语多眠会聚多事爱身轻慢贪欲恶处皆障道，故须明示以便断除
  - date: '0151-03-01'
    title_zh: 劝断缘居善处以速得道
    rationale: 不识万物则堕恶道，断十一缘居善人中则得道疾，故以灭道制人
