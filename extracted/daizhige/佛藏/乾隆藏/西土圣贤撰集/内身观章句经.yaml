  - 贪著多事多欲与断十一缘速得道之抉择
  lesson: 观内身无常苦空不净无我，断十一堕缘，居善处一心，即不堕恶道而速得道
  summary_first_person: 我以经题为名，系汉失译之西土撰集，昔一心听佛美训，观内身三百二十骨筋肉涂饰九孔渗漏，知身为毒虺苦器老死之法，复承十一因缘灭道之教，愿断多食多语多眠多欲，离恶众居善处，以求不堕恶道
