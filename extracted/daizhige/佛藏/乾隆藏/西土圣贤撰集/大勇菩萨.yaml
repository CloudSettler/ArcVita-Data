    rationale: 为令知财智皆由因得故劝施慧双修恭敬福田应时欢喜施故
  - date: '-0275'
    title_zh: 以梵行禅定观门配生天宫位
    rationale: 为示离欲离觉观离喜舍念等次第升进不堕常见故终归出离
