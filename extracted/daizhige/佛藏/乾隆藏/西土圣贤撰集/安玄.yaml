    start_date: '0170'
    highlight_event_id: guji-安玄-event-translation
  - key: closure
    name: 流布十二因缘断惑之教
    labels:
      zh: 流布化世
    start_date: '0172'
    highlight_event_id: guji-安玄-event-translation
  decisions:
  - date: '0170'
    title_zh: 与严佛调合作分任口解笔受
    rationale: 吾长于西土义理而汉文未精，借其笔受可使义达辞顺
  - date: '0171'
    title_zh: 以十二因缘配内外断十恶为纲
    rationale: 欲使学者易持，当先断身口意十恶，便五阴灭而十二因缘灭
