  decisions:
  - date: 0168
    title_zh: 决意东行至洛阳
    rationale: 不忍正法独在西土，愿以白衣身入汉地助弘大道
  - date: 0169
    title_zh: 安居洛阳学汉俗言
    rationale: 欲使经义通于汉人，必先通其语言礼俗方能取信
