  dilemmas:
  - title_zh: 以白衣居士身译经弘法之分际
    description: 既居白衣不当僭师，又不忍正法不传，故以口解传译助道
  - title_zh: 守安息本俗与从汉地道俗之衡
    description: 远来洛阳语言风俗皆异，当随顺时俗以通经义又不失本义
  lesson: 以白衣之身远来传法，知十二因缘断生死根，当先断身口意十恶以还灭五阴
  summary_first_person: 吾本安息优婆塞，远来洛阳，与严佛调共译阿含口解，备说十二因缘内外流转与还灭，愿世人念苦舍习知尽行道以断生死
  source_urls:
  - https://daizhige.org/佛藏/乾隆藏/西土圣贤撰集/阿含口解十二因缘经.html
  - https://tripitaka.cbeta.org/T15n1508_001
endeavors:
- id: guji-安玄-endeavor-1
  title_zh: 远来洛阳以居士身助弘佛法
  summary: 自安息来至洛阳，习汉言风俗，以优婆塞身份亲近道俗，奠定译经弘法之基
