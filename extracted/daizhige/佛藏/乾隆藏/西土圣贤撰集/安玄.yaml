  title_zh: 口解阿含共译十二因缘经
  summary: 与沙门严佛调合作，以口解说义笔受成文，译出阿含口解十二因缘经，明内外十二因缘与断十恶还灭之道
  phases:
  - key: brewing
    name: 集阿含义理口授解说
