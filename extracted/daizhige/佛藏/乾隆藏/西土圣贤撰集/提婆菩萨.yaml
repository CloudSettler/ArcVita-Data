- id: guji-提婆菩萨-event-lisanlun
  title_zh: 王都建高座立三论伏八方
  date: '0212'
  year_of: 212
  place_zh: 王都
  description_zh: 立佛圣第一佛法正第一佛僧救世第一之三论屈者剃发为弟子三月度百余万人
- id: guji-提婆菩萨-event-death
  title_zh: 闲林遇害说法蝉蜕而去
  date: '0270'
  year_of: 270
  place_zh: 闲林树下
  description_zh: 造百论二十品及四百论破邪经行时为邪弟子刀决五藏愍贼说法教解着无依而脱然去时号迦那提婆
