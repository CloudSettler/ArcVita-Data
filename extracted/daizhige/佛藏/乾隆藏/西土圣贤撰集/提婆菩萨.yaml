      - 传承
    start_date: 0198
    highlight_event_id: guji-提婆菩萨-event-sheyan
  decisions:
  - date: 0195
    title_zh: 必欲见像不为求愿
    rationale: 以威灵感人智德伏物不假黄金自多故须面质以试神心
  - date: 0197
    title_zh: 出左眼供天至数万
    rationale: 唯恨童蒙不知信受我言故以心供求言不虚设以利弘化
- id: guji-提婆菩萨-endeavor-2
  title_zh: 化王立论造论殉法
  goal_zh: 化王化国显佛法僧最第一破邪见
  summary_zh: 应募为将验天战化王立三论伏八方度百余万人造论林中遇害说法而去
  phases:
  - key: brewing
    name: 应募为将亲近国王
    labels:
      zh:
      - 潜行
      - 近主
    start_date: '0210'
    highlight_event_id: guji-提婆菩萨-event-huawang
  - key: breakthrough
    name: 言天与修罗战空中验之
    labels:
      zh:
      - 权智
      - 折伏
    start_date: '0211'
    highlight_event_id: guji-提婆菩萨-event-huawang
  - key: climax
    name: 建高座立三论伏八方
    labels:
      zh:
      - 立宗
      - 摄众
    start_date: '0212'
    highlight_event_id: guji-提婆菩萨-event-lisanlun
  - key: closure
    name: 造百论四百论闲林殉法
    labels:
      zh:
      - 造论
      - 殉道
    start_date: '0250'
    highlight_event_id: guji-提婆菩萨-event-death
  decisions:
  - date: '0210'
    title_zh: 不食廪不取钱而为前驱
    rationale: 树不伐本则条不倾人主不化则道不行故先化王以行道
  - date: '0212'
    title_zh: 立三论不斩首但剃发为弟子
    rationale: 所修法仁活万物故以摄受代杀罚令屈者得度以显佛慈
events:
