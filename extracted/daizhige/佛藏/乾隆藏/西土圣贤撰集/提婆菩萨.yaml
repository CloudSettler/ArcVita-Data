endeavors:
- id: guji-提婆菩萨-endeavor-1
  title_zh: 明神舍眼求言不虚
  goal_zh: 明神不托形求言信受以便弘法
  summary_zh: 入庙凿像眼晓众祠天舍眼数万得愿诣龙树受出家法
  phases:
  - key: brewing
    name: 入庙求见大自在天
    labels:
      zh:
      - 求真
      - 明正
    start_date: 0195
    highlight_event_id: guji-提婆菩萨-event-tianmiao
  - key: breakthrough
    name: 登梯凿眼明神不托形
    labels:
      zh:
      - 破执
      - 显理
    start_date: 0196
    highlight_event_id: guji-提婆菩萨-event-tianmiao
  - key: climax
    name: 敬祠舍眼得言不虚愿
    labels:
      zh:
      - 上施
      - 立愿
    start_date: 0197
    highlight_event_id: guji-提婆菩萨-event-sheyan
  - key: closure
    name: 诣龙树受法出家扬化
    labels:
      zh:
