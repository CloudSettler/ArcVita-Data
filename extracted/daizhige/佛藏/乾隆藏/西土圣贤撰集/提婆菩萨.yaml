  date: 0196
  year_of: 196
  place_zh: 南天竺大自在天庙
  description_zh: 入庙见像动颇梨荧惑登梯凿出其眼晓众神不假质精不托形
- id: guji-提婆菩萨-event-sheyan
  title_zh: 祠天舍眼得言不虚愿
  date: 0197
  year_of: 197
  place_zh: 南天竺天祠
  description_zh: 一夜备精馔贯肉形而来舍左眼出而随生至数万得愿诣龙树出家
