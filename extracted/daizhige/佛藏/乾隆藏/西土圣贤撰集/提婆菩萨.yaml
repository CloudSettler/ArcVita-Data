      precision: year
      is_circa: true
      raw: 约公元二百七十年于闲林遇害蝉蜕而去
  birth_date: '0170'
  death_date: '0270'
  era: 约东汉末至西晋初之南天竺
  archetype: 辩才护法型论师
  dilemmas:
  - 凿金像之眼以明神不托形恐世人讥为慢神抑或缄默避谤
  - 以论议折服八方外道恐招怨害抑或隐林自修以全身
  lesson: 以智破邪以慈全物破立不为胜负只为令众离妄得实
  summary_first_person: 我本南天竺婆罗门子博识善辩师事龙树而出家曾入大自在天庙凿像眼以明精不托形又舍眼供天得言不虚之愿乃近南天竺王以天战为验而化之立三论伏八方造百论四百论破邪终于闲林遇害愍贼说法蝉蜕而去
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E4%B9%BE%E9%9A%86%E8%97%8F/%E8%A5%BF%E5%9C%9F%E5%9C%A3%E8%B4%A4%E6%92%B0%E9%9B%86/%E6%8F%90%E5%A9%86%E8%8F%A9%E8%90%A8%E4%BC%A0.html
