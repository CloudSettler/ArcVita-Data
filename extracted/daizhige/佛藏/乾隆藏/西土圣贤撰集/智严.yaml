  lesson: 会群经之要示行门之径守菩提心不退方能成熟众生速成佛道
  summary_first_person: 我是唐至相寺沙门智严，集大乘诸经要为修行菩萨行门三卷，会四十二部经成六十六条，愿初学菩萨不习声闻退路，直住六度空行，入生死而度众生，终不退转无上菩提。
