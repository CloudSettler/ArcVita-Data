  lesson: 安般守意具行如法，立身立意坐卧常守，时时法观六入，中夜念佛法僧戒施禅定，便蚤得度生死老病苦尽
  summary_first_person: 我本西土学人，具行安般守意如法已，次第教授立身立意坐卧之法，令前后会有所益，不复见怪意，止意守六衰莫中止，教人先自守意自守，时时法观，中夜常念佛法僧，以求甘露灭苦得度
