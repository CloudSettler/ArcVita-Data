    rationale: 觀彼全屍骨鎖膿爛，知皮囊盛屎尿九孔流血，智者所棄遠，守心如虛空無所著
  - date: -0485
    title_zh: 勸行者晝夜觀苦無常
    rationale: 命速如電老病死至，富貴恩愛皆是苦本，唯精進禪定可度生死
events:
