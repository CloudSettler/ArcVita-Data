- id: guji-目連-event-death
  person_qid: guji-目連
  title_zh: 先佛入滅
  date: -0483
  year_of: -483
  place: 古印度摩揭陀國
  description: 住世弘化已畢，遭執杖外道害，先於佛陀取般涅槃，留神通訶欲之典範
