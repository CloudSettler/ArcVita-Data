    description_zh: 西域诸国语言各异，梵本难得，译义恐失本旨，当广求善本博访胡师
  - title_zh: 世乱弘法维艰
    description_zh: 永嘉丧乱衣食不继，或隐或显，当守道不舍以经法安众
  lesson: 广求博译不惮艰远，持戒精进方能寂观入道
  summary_first_person: 我家世月氏居于敦煌，八岁出家从师受经，览诸经典欲广其义，遂西行诸国求得梵本，归于长安洛阳敦煌译出一百五十余部，愿后学奉戒修定以至无为
