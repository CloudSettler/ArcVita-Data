  - date: 0284
    title_zh: 译出修行道地经
    rationale: 愍念后学力劣不能遍览众经，故总其大较立易进径路以禅数解空为宗
  - date: '0304'
    title_zh: 避乱隐居不废讲诵
    rationale: 世道播乱饥疫并至，唯当精进奉戒以法自守终不舍道
