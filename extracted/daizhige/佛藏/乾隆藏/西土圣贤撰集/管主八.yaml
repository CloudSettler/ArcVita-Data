  - key: climax
    name: 遐迩受持福报无穷
    labels:
      zh: 高潮
    start_date: 1336-01-01
    highlight_event_id: guji-管主八-event-printing
  - key: closure
    name: 祝圣护国法轮常转
    labels:
      zh: 收束
    start_date: 1340-01-01
    highlight_event_id: guji-管主八-event-printing
  decisions:
  - date: 1335-01-01
    title_zh: 决意锓梓施经广布
    rationale: 欲令后有持咒行法者了明经旨不入邪曲，故刊刻流通以普利含生
  - date: 1336-01-01
    title_zh: 决意以护教护君为归
    rationale: 末法万年当护教护君主，转浊世为净土，故以流通功勋上答佛恩祝圣人寿
