endeavors:
- id: guji-管主八-endeavor-1
  title_zh: 集成偈颂补阙流通
  summary: 依北天竺二藏同译二经阙流通之弊，集成偈颂，详述大权神王降伏螺髻梵王缘起，添入本咒阙九字句，不重述前说而总摄其义
  phases:
