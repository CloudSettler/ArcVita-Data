  - key: climax
    name: 添补九字咒句详经意
    labels:
      zh: 高潮
    start_date: 1332-01-01
    highlight_event_id: guji-管主八-event-compilation
  - key: closure
    name: 补阙流通名大权神王经
    labels:
      zh: 收束
    start_date: 1334-01-01
    highlight_event_id: guji-管主八-event-compilation
  decisions:
  - date: 1330-01-01
    title_zh: 决意以偈颂体总摄经义
    rationale: 咒符印契繁密难持，以偈颂普摄僧俗，令了明前后经旨而信受奉行
  - date: 1332-01-01
    title_zh: 决意添入本咒阙九字句
    rationale: 前伊字函二经本咒阙略，续次添入以全神通道力，利末法行者持念相应
- id: guji-管主八-endeavor-2
  title_zh: 锓梓印施广行护教
  summary: 锓梓刊刻梵书颁布遐迩八方，劝持咒行法者详而行持，自利利他，护教护君主，广行于正像末法之世
  phases:
  - key: brewing
    name: 发愿印经施诸方
    labels:
      zh: 酝酿
    start_date: 1334-01-01
    highlight_event_id: guji-管主八-event-compilation
  - key: breakthrough
