  - 密法甚深秘密难传，当以显浅方便接引，还是以严格仪轨持守传承
  - 身为西域梵僧客居大唐，当坚守梵行本色，还是顺应诏命入世译经利生
  lesson: 持戒精进为本，密法方得感验，妄求非分则招慢损
  summary_first_person: 吾乃金刚智，南天竺人，少出家习三藏兼通密部，开元中泛海至唐，奉诏于洛阳长安译毗卢遮那等经轨，传不动使者持诵结界画像之法，愿众生以四种精进行持根本陀罗尼，心得护念，速满所愿。
