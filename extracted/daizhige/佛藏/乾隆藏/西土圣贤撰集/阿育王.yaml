events:
- id: guji-阿育王-event-birth
  type: birth
  title_zh: 生于波吒利弗多城
  date: '-0304'
  year_of: -304
  location_zh: 波吒利弗多城王宫
  description: 频头娑罗王纳婆罗门女为夫人，王念无忧生子名阿输柯即阿育，体粗涩父不爱念
- id: guji-阿育王-event-conquest
  type: career
  title_zh: 征罚德叉尸罗
  date: '-0273'
  year_of: -273
  location_zh: 德叉尸罗国
  description: 奉频头娑罗命集四兵无器仗而往，自言有功德器仗自出，地开得资具，人民香水洒地迎之不战而服
- id: guji-阿育王-event-coronation
  type: career
  title_zh: 天冠自至登王位
  date: -0268
  year_of: -268
  location_zh: 波吒利弗多城
  description: 频头娑罗病笃群臣诈病隐阿育，庄严至王前发愿若如法得王天当授冠，诸天即授天冠，王嗔吐血崩，阿育即位拜成护为第一臣，机关杀修私摩
- id: guji-阿育王-event-conversion
  type: career
  title_zh: 遇海比丘毁狱归佛
  date: '-0260'
  year_of: -260
  location_zh: 波吒利弗多城地狱
  description: 旃陀耆利柯造狱杀无数，海比丘入狱七日得罗汉坐火镬莲华升空，比丘说佛百年后阿育兴塔之记，王忏悔归依焚狱主施一切无畏
- id: guji-阿育王-event-stupa
  type: career
  title_zh: 广起八万四千舍利塔
  date: -0259
  year_of: -259
  location_zh: 阎浮提四海之内
  description: 往阿阇世七塔取舍利留罗摩龙塔，作宝函宝瓶幡盖付夜叉，依国出金多寡分函，往耶舍所愿一日一念俱成，起塔已号法阿育王
- id: guji-阿育王-event-death
  type: death
  title_zh: 崩于波吒利弗多
  date: '-0232'
  year_of: -232
  location_zh: 波吒利弗多城
  description: 护法终世以塔印世间舍旃陀恶名得法王善名后命终
