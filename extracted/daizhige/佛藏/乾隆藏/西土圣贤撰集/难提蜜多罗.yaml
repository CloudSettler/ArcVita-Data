    start_date: '0350-01-01'
    highlight_event_id: guji-难提蜜多罗-event-fazhuji
  - key: climax
    name: 广说住处受供及法灭复兴
    labels:
      zh: 说住处护法
    start_date: '0350-03-01'
    highlight_event_id: guji-难提蜜多罗-event-fazhuji
  - key: closure
    name: 说三事善根感弥勒三会得度
    labels:
      zh: 说来世果
    start_date: '0350-05-01'
    highlight_event_id: guji-难提蜜多罗-event-fazhuji
  decisions:
  - date: '0350-01-01'
    title_zh: 不允久住请决意说记归灭
    rationale: 世间法尔有生必灭，诸佛尚示涅槃，留寿无益，不如说记令众修福
  - date: '0350-03-01'
    title_zh: 详说十六罗汉分赴应供
    rationale: 令国王施主了达因果，密受供具得胜果报，护持正法久住
- id: guji-难提蜜多罗-endeavor-2
  title_zh: 空中现双神变舍寿入无余涅槃
  summary_zh: 说记毕升虚空高七多罗树现神变，结跏舍寿入灭，雨骨起塔，令众增进胜道
