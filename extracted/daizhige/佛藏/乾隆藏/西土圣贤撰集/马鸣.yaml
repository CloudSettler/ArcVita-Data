  - key: breakthrough
    name: 分判身语意十恶体性
    labels:
      zh: 突破
    start_date: 0118
    highlight_event_id: guji-马鸣-event-collection
  - key: climax
    name: 详说五缘罪相达高潮
    labels:
      zh: 高潮
    start_date: '0120'
    highlight_event_id: guji-马鸣-event-collection
  - key: closure
    name: 劝修十善永不堕恶趣
    labels:
      zh: 收束
    start_date: '0121'
    highlight_event_id: guji-马鸣-event-collection
  decisions:
  - date: 0118
    title_zh: 决定以身三语四意三统摄众恶
    rationale: 为令学者易持易犯省察，故以杀生不与取欲邪行等摄尽不善业道体性是罪
  - date: '0120'
    title_zh: 决定以五缘次第明成罪感果
    rationale: 为令乐求佛道者如实了知轻重，故须将先见审名决欲动身断命等具足乃成定业说得分明
- id: guji-马鸣-endeavor-2
  person_ref: guji-马鸣
  title_zh: 造论弘扬大乘佛法
  summary: 破外道邪见，造佛所行赞等论典，辅佐王室兴隆三宝，引导众生舍贪瞋邪见趣向正法
  phases:
  - key: brewing
    name: 博通声明酝酿归佛
