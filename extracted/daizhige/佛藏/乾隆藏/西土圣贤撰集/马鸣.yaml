  - key: breakthrough
    name: 折服外道归依三宝
    labels:
      zh: 突破
    start_date: '0110'
    highlight_event_id: guji-马鸣-event-writing
  - key: climax
    name: 造论度众声名大振
    labels:
      zh: 高潮
    start_date: '0130'
    highlight_event_id: guji-马鸣-event-writing
  - key: closure
    name: 付嘱后学住持正法
    labels:
      zh: 收束
    start_date: '0145'
    highlight_event_id: guji-马鸣-event-death
  decisions:
  - date: '0110'
    title_zh: 舍外道执见归依佛法
    rationale: 深知无施无后世等为邪见颠倒，唯佛世尊声闻缘觉所说因果业报为真实可依
  - date: '0130'
    title_zh: 以文辞音乐造论弘法
    rationale: 为化导王臣士庶乐闻美辞者，故作佛所行赞等以善巧方便引入正法念处
