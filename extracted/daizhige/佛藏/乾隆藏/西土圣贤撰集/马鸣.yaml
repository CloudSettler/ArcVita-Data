  description: 集说十不善业道体性是罪，谓身三为杀生不与取欲邪行，语四为妄言绮语两舌恶语，意三为贪瞋邪见，并以五缘次第明杀生妄语等成罪定感彼果，更说非处非时非分非往四类以诫欲邪行，劝于十善业道应当修学
