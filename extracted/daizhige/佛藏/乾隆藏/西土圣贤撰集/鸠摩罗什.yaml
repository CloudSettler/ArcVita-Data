  - title_zh: 色欲系缚与慧命抉择
    description: 女色如枷锁重患，当远离秽斥以全慧明
  - title_zh: 西土弘传与信译抉择
    description: 西土圣贤之言当弘译不失本义，普令行者得出牢狱
  lesson: 远离女色枷锁，破锁脱狱，永得安吉
  summary_first_person: 吾自龟兹入长安，主持译场，译西土圣贤诃色欲之法，劝行者弃女色枷锁毒害，守慧明而得安吉
