      raw: 约公元二百五十年示寂
  birth_date: '0150'
  death_date: '0250'
  era: 东汉至曹魏
  reign_ref: 禅陀迦王世
  archetype: 菩萨论师
  dilemmas:
  - 在家富贵五欲与出世解脱涅槃之间应当如何取舍修行
  - 慈悲化导国王百姓与深观空无我断除烦恼之间应当如何兼顾
  lesson: 调伏其心为本，持戒知足布施，厌离生死，勤修禅智觉道，求证涅槃普度众生
  summary_first_person: 吾乃龙树，见生死苦恼多过，为无明所覆，故为禅陀迦王略说要法，劝修六念十善布施净戒忍辱精进禅智，观身不净无常苦空无我，断贪欲瞋嫉懈怠邪命，修七觉八正道十二因缘，厌离三界，回向正觉，普令一切成佛
  source_urls:
