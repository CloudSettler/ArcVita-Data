endeavors:
- id: guji-龙树菩萨-endeavor-1
  title_zh: 开显空性弘扬中观正法
  description: 破除常见断见及二十种身见颠倒，开示十二因缘四圣谛八正道，令众生见法断疑，渐近涅槃
  phases:
  - key: brewing
    name: 南天竺出家学道
    labels:
      zh:
      - 出家闻法
      - 深观缘起
    start_date: '0150'
    highlight_event_id: guji-龙树菩萨-event-birth
  - key: breakthrough
    name: 抉择空性破除邪见
    labels:
      zh:
      - 破除身见
      - 开示空性
    start_date: 0180
    highlight_event_id: guji-龙树菩萨-event-1
  - key: climax
    name: 造论弘法广利众生
    labels:
      zh:
      - 造论立宗
      - 化导四众
    start_date: 0190
    highlight_event_id: guji-龙树菩萨-event-1
  - key: closure
    name: 以法摄善回向菩提
    labels:
      zh:
      - 摄善归道
      - 回向正觉
    start_date: '0200'
    highlight_event_id: guji-龙树菩萨-event-2
  decisions:
  - date: 0180
    title_zh: 依佛说正法破二十种颠倒
    rationale: 色受想行识中计我我所能障无漏道，故须观色非我我非色以断身见戒取疑结
  - date: 0190
    title_zh: 燃慧灯破痴闇开示缘起
    rationale: 法皆从无明爱业起，若尽生死因缘则灭，故教人正观十二缘以见圣道
- id: guji-龙树菩萨-endeavor-2
  title_zh: 为禅陀迦王说在家出世要法
  description: 为国王略说布施持戒忍辱精进禅智，孝养父母，远离杀盗淫酒博弈恶友，观身不净无常，厌离六道轮回，求证涅槃并以此教化人民
  phases:
  - key: brewing
    name: 观察王机堪为法器
    labels:
      zh:
      - 观察根机
      - 起慈悲心
    start_date: 0195
    highlight_event_id: guji-龙树菩萨-event-1
  - key: breakthrough
    name: 略说王法劝修众善
    labels:
      zh:
      - 劝修六念
      - 劝行十善
    start_date: '0200'
    highlight_event_id: guji-龙树菩萨-event-2
  - key: climax
    name: 广说生死过患令生厌离
    labels:
      zh:
      - 说三界苦
      - 观无常不净
    start_date: '0205'
    highlight_event_id: guji-龙树菩萨-event-2
  - key: closure
    name: 劝发大愿回向成佛
    labels:
      zh:
      - 随喜回向
      - 教化人民
    start_date: '0210'
    highlight_event_id: guji-龙树菩萨-event-death
  decisions:
  - date: '0200'
    title_zh: 先说布施持戒人天善本
    rationale: 王处尊荣具五欲，先令修六念十善七圣财，离酒邪命恶友，培植福田方能趣入解脱
  - date: '0205'
    title_zh: 次说无常苦空对治贪欲
    rationale: 端正尊豪五欲危朽如沫，欲如怨毒，须观身九孔不净命如水泡，修不净观空无我观及四无量四禅以调心求涅槃
events:
- id: guji-龙树菩萨-event-birth
  title_zh: 诞生于南印度
  date: '0150'
  year_of: 150
  description: 约公元一百五十年生于南印度婆罗门家，后出家学佛，深究缘起性空
- id: guji-龙树菩萨-event-1
  title_zh: 弘扬空宗破除邪见
  date: 0185
  year_of: 185
  description: 开示无明缘行乃至生缘老死，正观十二因缘，明四谛八正道七觉法，断身见戒取疑结及二十种颠倒
- id: guji-龙树菩萨-event-2
  title_zh: 为禅陀迦王说要偈
  date: '0200'
  year_of: 200
  description: 应王请略说要法，以偈劝修布施持戒忍辱精进禅智，孝养父母，远离杀盗淫欺酒色博弈，观身无常不净，厌离天人地狱饿鬼畜生修罗生死轮回，勤求涅槃，回向正觉
- id: guji-龙树菩萨-event-death
  title_zh: 示寂入灭
  date: '0250'
  year_of: 250
  description: 化缘既毕，约公元二百五十年示寂，后人尊为菩萨，宋求那跋摩译传其为王说法要偈一卷
