  dilemmas:
  - 宗风繁盛而超宗越格者少，如何承续断桥车溪嫡脉不愧古人
  - 随缘住持弘化与养病放憨保任之间，如何以慧命为重不论盛衰
  lesson: 以慧命为重直指当阳，全机大用而慈悲唱导，近承先师远光祖脉
  summary_first_person: 吾桐月庵中遭痛棒，普明寺里吃钳锤，得鸳湖先师法乳，忝列临济三十世，顺治戊子住濮溪永正，后驻竺隐复归永正，随缘升座拈提，惟愿大地众生迥超情解同证菩提
  source_urls:
