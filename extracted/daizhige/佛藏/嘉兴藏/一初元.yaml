  title_zh: 住持濮溪永正弘扬临济宗风
  summary_zh: 顺治戊子受嘉禾绅衿恭请住永正，菊月九日进院升座，四众辐辏，上堂小参机缘拈颂并重
  phases:
  - key: brewing
    name: 参寻得法
    labels:
      zh: 参学受法
    start_date: 1640-01-01
    highlight_event_id: guji-一初元-event-yongzheng
  - key: breakthrough
    name: 受请住永正
    labels:
      zh: 住持弘化
    start_date: 1648-01-01
    highlight_event_id: guji-一初元-event-yongzheng
  - key: climax
    name: 永正升座说法
    labels:
      zh: 当阳举唱
    start_date: 1648-10-14
    highlight_event_id: guji-一初元-event-yongzheng
  - key: closure
    name: 甲午归永正四旬说法
    labels:
      zh: 守本还归
    start_date: 1654-08-01
    highlight_event_id: guji-一初元-event-guiyongzheng
  decisions:
  - date: 1648-01-01
    title_zh: 应请住濮溪永正禅院
    rationale: 为酬普明先师法乳之恩，随缘赴感振济上宗风
  - date: 1648-10-14
    title_zh: 进院升座祝圣拈香举唱第一义
    rationale: 以皇恩佛恩并酬，示三世诸佛迥超十地之机，令大众信入
- id: guji-一初元-endeavor-2
  title_zh: 驻锡竺隐兼理佛事编成语录
  summary_zh: 壬辰仲春住当湖竺隐，西林说法，建山门造像建弥勒殿，门人真开真智编语录上下卷
  phases:
  - key: brewing
    name: 当湖檀越迎请
    labels:
      zh: 驻锡竺隐
    start_date: 1652-03-01
    highlight_event_id: guji-一初元-event-zhuyin
  - key: breakthrough
    name: 竺隐西林说法
    labels:
      zh: 拈提公案
    start_date: 1652-03-01
    highlight_event_id: guji-一初元-event-zhuyin
  - key: climax
    name: 兴建开光佛事
    labels:
      zh: 庄严伽蓝
    start_date: 1654-08-01
    highlight_event_id: guji-一初元-event-guiyongzheng
  - key: closure
    name: 五旬诞日嘱付语录
    labels:
      zh: 法乳长流
    start_date: 1664-01-01
    highlight_event_id: guji-一初元-event-wuxun
  decisions:
  - date: 1652-03-01
    title_zh: 应完初羽等请住竺隐禅院
    rationale: 花笑春风消息全彰，欲令通人唱和达者商量
  - date: 1654-08-01
    title_zh: 建山门装佛像建弥勒殿行佛事
    rationale: 集檀那福胜显佛祖真宗，凭覆荫利人天三界
events:
- id: guji-一初元-event-birth
  title_zh: 诞生
  date: 1615-01-01
  description_zh: 约明万历末年生，据甲午年四旬推算，母难之晨，后出家参学
- id: guji-一初元-event-yongzheng
  title_zh: 顺治戊子菊月九日进院住永正首座说法
  date: 1648-10-14
  description_zh: 受兴善嘉禾护法恭请住濮溪永正禅院，拈香祝圣酬普明先师法乳，震威一喝举第一义
- id: guji-一初元-event-zhuyin
  title_zh: 壬辰仲春请住当湖竺隐禅院
  date: 1652-03-01
  description_zh: 应完初羽生民开屠诸居士及耿惟上座请住竺隐，升座示相识满天下知心能几人
- id: guji-一初元-event-guiyongzheng
  title_zh: 甲午七月归永正四旬诞日上堂
  date: 1654-08-01
  description_zh: 首座冲默监院无能同众檀护请归永正，值四旬母难晨升座，示遇茶吃茶遇饭吃饭
- id: guji-一初元-event-wuxun
  title_zh: 五旬诞日披新法衣升座
  date: 1664-01-01
  description_zh: 法侄主峰文学罗子先等并护法居士庆五旬初度，拈法衣示须弥纳芥，拈颂祝延
- id: guji-一初元-event-death
  title_zh: 示寂
  date: 1670-01-01
  description_zh: 约康熙初年示寂，嗣法门人真开真智等编一初元禅师语录上下卷并永正碑记行世
