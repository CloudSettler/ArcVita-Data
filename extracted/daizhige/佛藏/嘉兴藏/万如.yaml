  decisions:
  - date: 1641-11-20
    title_zh: 应乡绅请开法如如禅院
    rationale: 缁素合词坚请因缘稔会随宜摄受广度含灵
  - date: 1642-01-01
    title_zh: 应闽宪请赴兴化曹山
    rationale: 曹山法席久虚钟鼓声沉受请南指勉应一期以行教化
  - date: 1643-03-01
    title_zh: 应众请继席龙池祖庭
    rationale: 龙池为幻祖选佛场塔系重地本际契合宜久远守护不辞劳瘁
  - date: 1645-01-01
    title_zh: 鼎革烽烟中束手守塔不去
    rationale: 行教化临患难自古不免为祖拥护为道持身宁俟命而不委去
events:
