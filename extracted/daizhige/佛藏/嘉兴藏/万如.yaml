  place_zh: 浙江嘉兴府秀水
  description_zh: 浙之禾郡秀水张氏子婴龄丧父随母金氏育于外家
- id: guji-万如-event-ordination
  title_zh: 十九岁投兴善脱白受具
  date: 1613-01-01
  year_of: 1613
  place_zh: 嘉兴南兴善寺
  description_zh: 从世父习业遽有出尘志礼涵初公脱白后参方受具阅禅关提撕无字公案
- id: guji-万如-event-awakening
  title_zh: 参湛然澄闻声释然
  date: 1620-01-01
  year_of: 1620
  place_zh: 华严桥西净明庵
  description_zh: 参无梦无想话归养母卜居净明庵一日入城闻打小厮看你藏在那里去释然作偈没处藏
- id: guji-万如-event-dharma
  title_zh: 金粟得密云付嘱大法
  date: 1637-01-01
  year_of: 1637
  place_zh: 盐官金粟寺
  description_zh: 母逝再之金粟闻僧问佛法大意洞彻玄旨深蒙器重丁丑受大法之嘱改桐月为如如庵
- id: guji-万如-event-dongta
