  date: 1635-01-01
  year_of: 1635
  place_zh: 嘉兴东塔
  description_zh: 禾士大夫推德请主东塔结拈花社策励同志居三载辞院依天童座下典客侍巾缶
- id: guji-万如-event-hermit
  title_zh: 居桐月如如学不杂习
  date: 1638-01-01
  year_of: 1638
  place_zh: 桐月庵
  description_zh: 与黄清伯道契鸠资买屋易名桐月庵寒暑一衲经史传纪一目知源纵夺随方交接冲和
- id: guji-万如-event-ruru
  title_zh: 崇祯辛巳开法如如
  date: 1641-11-20
  year_of: 1641
  place_zh: 浙江嘉兴府如如禅院
  description_zh: 乡绅孝廉请开堂拈香祝圣为密云酬法乳恩升座拈保寿开堂公案四众骈集千指悦依
- id: guji-万如-event-caoshan
  title_zh: 住福建兴化曹山
  date: 1642-06-01
  year_of: 1642
  place_zh: 福建兴化府曹山上生禅寺
  description_zh: 闽宪履素公驰书请住持欣然赴之进院公亲临请法参叩盈室风行闽粤是岁天童翁示寂奔往迎全身入塔
- id: guji-万如-event-longchi
  title_zh: 继席荆溪龙池禹门
  date: 1643-03-01
  year_of: 1643
  place_zh: 荆溪龙池山禹门禅寺
  description_zh: 同门毕集推主龙池慨然应诺踵幻祖绳规一住十六载初入薪不继炊鼎革守塔安众樵牧沾德
- id: guji-万如-event-death
  title_zh: 顺治丁酉示寂入塔
  date: 1657-10-29
  year_of: 1657
  place_zh: 龙池山门前塔
  description_zh: 世寿六十四法腊四十五丁酉元夜梦大雪飘身口齿俱堕十月二十九日示寂次年八月十九日全身入塔娑罗荣枯为异
