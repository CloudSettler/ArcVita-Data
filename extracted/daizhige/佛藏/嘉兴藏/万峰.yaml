    start_date: 1320-01-01
    highlight_event_id: guji-万峰-event-hupao
  - key: breakthrough
    name: 伏龙得髓彻骨清凉
    labels:
      zh: 伏龙室中深悟
    start_date: 1332-01-01
    highlight_event_id: guji-万峰-event-fulong
  - key: climax
    name: 通身庆快无障无碍
    labels:
      zh: 得法受记
    start_date: 1335-01-01
    highlight_event_id: guji-万峰-event-fulong
  - key: closure
    name: 禁笔杜田单提话头
    labels:
      zh: 至正禁笔涵养
    start_date: 1355-01-01
    highlight_event_id: guji-万峰-event-songshan
  decisions:
  - date: 1332-06-01
    title_zh: 投伏龙千岩深造心髓
    rationale: 虎跑得肉未彻须再参伏龙以了大事不受言句系缚直究本心
  - date: 1355-01-01
    title_zh: 至正十五年禁笔不书顶相法语
    rationale: 违背少林直旨故杜绝文字单提无滋味话令学者直下承当不咬嚼穿凿
- id: guji-万峰-endeavor-2
  title_zh: 蔚峤嵩山住山弘化语录流通
  summary_zh: 张铺席于蔚峤开饭店于嵩山庵居中吴垂三十年嵩山开堂祝圣报恩四方如归嗣法列布化缘既终门人集录刊行
  phases:
  - key: brewing
    name: 庵居中吴履真践实
    labels:
      zh: 中吴庵居化吴人
    start_date: 1340-01-01
    highlight_event_id: guji-万峰-event-songshan
  - key: breakthrough
    name: 兰溪嵩山开堂祝圣
    labels:
      zh: 嵩山开堂演法
    start_date: 1358-01-01
    highlight_event_id: guji-万峰-event-songshan
  - key: climax
    name: 四方来归嗣法列布
    labels:
      zh: 接众立宗
    start_date: 1368-01-01
    highlight_event_id: guji-万峰-event-songshan
  - key: closure
    name: 化缘既终语录刊行
    labels:
      zh: 龄山普寿集录付梓
    start_date: 1383-09-01
    highlight_event_id: guji-万峰-event-yulu
  decisions:
  - date: 1358-03-01
    title_zh: 住嵩山开堂以本分草料接人
    rationale: 不作奇特玄妙商量直以现成公案令当人承当不舍昼夜接引四方
  - date: 1380-01-01
    title_zh: 许门人私录语以言显道
    rationale: 道本无言因言显道令读者筑着磕着洞见心肝不负先圣垂慈
