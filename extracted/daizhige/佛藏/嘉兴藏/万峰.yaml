  summary_zh: 蚤岁入虎跑壮岁入伏龙得天目正宗伏龙心髓通身庆快彻骨清凉至正十五年禁笔不书专提无滋味话接引方来
  phases:
  - key: brewing
    name: 虎跑参学得肉
    labels:
