  - date: 1670
    title_zh: 违母抛家投敏树得度
    rationale: 因看牧牛颂闻孟子性说得个入路，立志出家求向上事
  - date: 1672
    title_zh: 复参华岩圣可入室请益
    rationale: 敏树圆寂建塔已毕，欲求宗纲不避痛棒头破血流
- id: guji-不厌乐-endeavor-2
  title_zh: 三处住持集录流通
  summary: 历住龙山玉泉华岩三寺，开堂小参拈颂接众，集成语录三卷刻板入藏
  phases:
  - key: brewing
    name: 龙山开堂接众
    labels:
      zh:
