  summary_first_person: 我是贵州思南印江杨氏子，讳道乐，字不厌，幼读孟子牧牛颂得入路，三十抛家投敏树得度，后参华岩圣可吃棒知痛痒，历住龙山玉泉华岩三处，集语录三卷流行于世
