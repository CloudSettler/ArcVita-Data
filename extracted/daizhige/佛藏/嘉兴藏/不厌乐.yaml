    name: 三卷语录刻板入藏
    labels:
      zh:
      - 著述
    start_date: 1693
    highlight_event_id: guji-不厌乐-event-yulu
  decisions:
  - date: 1676
    title_zh: 受觉之坚请住龙山寺
    rationale: 归黔祝母寿毕，众缘已熟不辞劳苦开堂示众
  - date: 1689
    title_zh: 受还初等请住华岩祖院
    rationale: 感华岩法乳之恩及死句活句印可，直下承当不解推脱
events:
- id: guji-不厌乐-event-birth
  date: 1640
  year_of: 1640
  title_zh: 出生于黔中印江
  description: 黔之思南印江杨氏子，父杨母卢，生于庚辰八月廿三子时
  place_zh: 贵州思南印江
- id: guji-不厌乐-event-ordination
  date: 1670
  year_of: 1670
  title_zh: 抛家投敏树得度受具
  description: 二十九斋戒越二年违母抛家投敏树和尚得度受具，一载敏和尚圆寂同众建塔
  place_zh: 贵州
- id: guji-不厌乐-event-sanxue
  date: 1672
  year_of: 1672
  title_zh: 参华岩圣可吃棒得入
  description: 复参华岩圣可和尚入室问大通智胜佛因缘吃顿痛棒头破血流稍知痛痒
  place_zh: 重庆华岩寺
- id: guji-不厌乐-event-longshan
  date: 1676-09
  year_of: 1676
  title_zh: 住贵州龙山寺开堂
  description: 丙辰春辞归省母，丙辰九月觉之率众请住兴隆卫龙山寺三载，后烽烟退居高坉山
  place_zh: 贵州兴隆卫龙山寺
- id: guji-不厌乐-event-yuquan
  date: 1684-02
  year_of: 1684
  title_zh: 住遵义玉泉寺弘化
  description: 甲子春出蜀至遵义众善留住玉泉禅寺，乙丑春赴泸州方山省觐印证得偈
  place_zh: 四川遵义府玉泉寺
- id: guji-不厌乐-event-huayan
  date: 1689-08-02
  year_of: 1689
  title_zh: 住重庆华岩祖院
  description: 己巳八月二日受还初等请住华岩祖院，住二冬一夏开炉结制接众
  place_zh: 重庆府华岩寺
- id: guji-不厌乐-event-yulu
  date: 1693
  year_of: 1693
  title_zh: 三处语录集成刻行
  description: 龙山玉泉华岩三处共集语录三卷万五千言已刻流行板入嘉兴楞严藏房
  place_zh: 重庆华岩寺
- id: guji-不厌乐-event-death
  title_zh: 示寂
  description: 卒年失载，语录止于庚午结制及癸酉序时仍在世，后事不详
