  title_zh: 住持路南兜率开堂弘法
  summary_zh: 康熙六年应澄江府路南州陈刺史吴别驾及僧俗请，住弥勒兜率禅院，开堂拈香，全提临济正令
  phases:
  - key: brewing
    name: 蕲阳奋迹嵩山得法
    labels:
      zh:
      - 参学得法
    start_date: '1650'
