    highlight_event_id: guji-不磷坚-event-2
  decisions:
  - date: '1671'
    title_zh: 继席嵩山不负付托
    rationale: 嵩山父子物共相正盟，甘心领受从前做就业缘，光大先悟祖勋猷
  - date: '1673'
    title_zh: 付门人记录刊行语录
    rationale: 头头上明物物上显，甘蔗苦李总扬般若，以疗伪禅死禅知解之病，令六诏两蜀人空五蕴
