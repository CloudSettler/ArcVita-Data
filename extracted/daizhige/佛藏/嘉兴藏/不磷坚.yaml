    start_date: '1670'
    highlight_event_id: guji-不磷坚-event-2
  decisions:
  - date: '1667'
    title_zh: 应请出世住持兜率
    rationale: 业缘无避处，拍板出人前，为报檀信举扬此道，永为济世雄藩
  - date: '1668'
    title_zh: 开炉选佛立规矩
    rationale: 现成炉韝恶辣钳锤，不假添煤，直截锻炼群英，扫伪禅死禅知解之病
- id: guji-不磷坚-endeavor-2
  title_zh: 继席嵩山化行南诏
  summary_zh: 继席云南府嵩山禅寺，嗣野竹慧禅师法，全提正令，语录由妙圣妙德等记录，化行滇南
  phases:
