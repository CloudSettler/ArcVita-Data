    start_date: '1667'
    highlight_event_id: guji-不磷坚-event-1
  - key: climax
    name: 上堂普说锻圣炼凡
    labels:
      zh:
      - 机锋弘法
    start_date: '1668'
    highlight_event_id: guji-不磷坚-event-1
