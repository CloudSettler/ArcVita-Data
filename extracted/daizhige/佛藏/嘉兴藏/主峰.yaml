  summary_first_person: 余本野逸慵僧薄福鲜德承临济正宗介庵法乳承阖郡绅衿护法公请于癸卯春入主嘉兴龙渊三塔废席灰头垢面抱贫守拙七年开炉作灶修理寮舍开垦园林祷井得泉随缘接众付法后学只贵各各自肯打彻
