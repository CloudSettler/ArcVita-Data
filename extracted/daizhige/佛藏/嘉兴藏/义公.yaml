  decisions:
  - date: 1648
    title_zh: 三十四岁发奋参皋亭石雨
    rationale: 胸中碍膺未脱若不大彻如何亲近老和尚故往参父母未生前话
  - date: 1649
    title_zh: 请侍者结急七立誓不出堂
    rationale: 几被善知识称赞而自己放不过必欲绝后再苏故发弘誓昼夜无间
  - date: 1650
    title_zh: 立志丛林苦行参学伏狮
    rationale: 从来无意承当法门但恐未历丛林福薄故三十有六进伏狮充维那受敲击
- id: guji-义公-endeavor-2
  title_zh: 继席伏狮弘法授徒
  summary: 甲午出关奉遗命继席建塔院举丧葬集语录颂古六载付嘱而化
  phases:
  - key: brewing
    name: 出关侍疾
