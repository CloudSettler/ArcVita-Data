    start_date: 1649
    highlight_event_id: guji-义公-event-wudao
  - key: climax
    name: 方丈逼拶透关
    labels:
      zh: 揭帘公案不假思惟
    start_date: 1650
    highlight_event_id: guji-义公-event-wudao
  - key: closure
    name: 闭关寻溪
    labels:
