  - key: breakthrough
    name: 奉衣继席
    labels:
      zh: 受祖衣嘱继伏狮一刹
    start_date: 1654-09-27
    highlight_event_id: guji-义公-event-jixi
  - key: climax
    name: 建塔举丧集录
    labels:
      zh: 主塔院丧事集颂古语录
    start_date: 1655
    highlight_event_id: guji-义公-event-jixi
  - key: closure
    name: 付嘱示寂
    labels:
      zh: 请参同主席书遗嘱而化
    start_date: 1661-01-10
    highlight_event_id: guji-义公-event-death
  decisions:
  - date: 1654-07-16
    title_zh: 出关回伏狮料理后事
    rationale: 老和尚病重遗书召归塔院付托义川与我故出关承命
  - date: 1654-09-27
    title_zh: 继席伏狮忍受委曲
    rationale: 师寂后人情皆变而祖庭不可冷落故继席六载撑持法门
  - date: 1661-01-10
    title_zh: 速请参同和尚主席
    rationale: 门庭已广职事人少身后事全赖兄主张故遗嘱董檀越速请继席
events:
- id: guji-义公-event-birth
  date: 1615
  year_of: 1615
  title_zh: 生于梅里
  description: 梅里董氏女早依祗园行刚得法为一揆同参号义公住伏狮庵
- id: guji-义公-event-wudao
  date: 1649-10-15
  year_of: 1649
  title_zh: 南浔般若庵打七彻悟
  description: 与川师请灵隐侍者结七至第九日长跪佛前于竹篦子话豁然桶底脱落通身轻快后历伏狮方丈逼拶透过公案
- id: guji-义公-event-jixi
  date: 1654-09-27
  year_of: 1654
  title_zh: 甲午继席伏狮
  description: 甲午七月十六回伏狮九月廿七祗园示寂年四十奉祖衣继席主持塔院建于西园历受委曲经营丧葬
- id: guji-义公-event-death
  date: 1661-02-28
  year_of: 1661
  title_zh: 正月三十示寂
  description: 带病自云栖归南浔养病腊底归伏狮新正立春后请参同接席亲书遗嘱集语录颂古二卷付明元三十辰刻西丈室坐化
