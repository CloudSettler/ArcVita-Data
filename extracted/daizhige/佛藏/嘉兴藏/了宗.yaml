  date: 1620-01-01
  year_of: 1620
  title_zh: 诞生
  description_zh: 明末生人，出家参禅，嗣盘山大博曹溪正脉
  place_zh: 华北
- id: guji-了宗-event-1661-longtui
  date: 1661-10-01
  year_of: 1661
  title_zh: 住滦州隆阭寺结制上堂
  description_zh: 顺治辛丑十月望日应监院普光及高良富等请结制，拈香祝圣，棒喝接机，阐第一义
  place_zh: 滦州隆阭寺
- id: guji-了宗-event-1662-nantai
  date: 1662-03-01
  year_of: 1662
  title_zh: 住南台圣岩弘化
  description_zh: 应郭自有等请住南台寺及圣岩寺，示秋深气爽水澄月现之旨，随机利物
  place_zh: 永平南台寺
- id: guji-了宗-event-1663-wanshan
  date: 1663-10-15
