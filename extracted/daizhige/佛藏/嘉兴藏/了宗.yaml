  title_zh: 语录四卷成书序行
  description_zh: 侍者微凡心月等记录，杨雍魏乔介作序，析三教大原而悟一贯，传达磨宗旨演曹溪正脉
  place_zh: 盘山
- id: guji-了宗-event-death
  date: 1685-01-01
  year_of: 1685
  title_zh: 示寂
  description_zh: 康熙中后期示寂于盘山系寺院，当与此山共为不朽
  place_zh: 盘山
