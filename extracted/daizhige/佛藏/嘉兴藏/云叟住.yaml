  name_zh: 云叟住
  names:
    zh: 云叟住
    en: Yunsou Zhu
  lifespan:
    birth:
      date: 1620
      precision: year
      is_circa: true
      raw: 明万历末年生于武州
    death:
      date: 1676-08-14
      precision: day
      is_circa: false
      raw: 清康熙十五年丙辰八月十四日示寂于龙牙
  birth_date: 1620
  death_date: 1676-08-14
  era: 明末清初
  reign_ref: 清顺治至康熙
  archetype: 孤硬中兴禅师
  dilemmas:
  - 孤硬寡合与续灯化众之间如何自处
  - 全不为人与接引后学之间如何施设
  - 清苦自守与再造祖庭之间如何担当
  lesson: 铁脊梁担荷正法，清苦自守而再造祖庭，默说俱从胸襟流出
  summary_first_person: 吾产武州，不言氏族，戒于沩山，询于鹤林，而后执侍平阳于青州。顺治戊戌入院龙牙，缚荆编草，虎卧檐下，十三年清苦莅众。吾胸次不存元字脚，十分不为人，只煮无米饭与人。全不为人处，正是为人处。丙辰八月嘱后事而去，顶齿不坏，复归此土而已。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E4%BA%91%E5%8F%9F%E4%BD%8F%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
