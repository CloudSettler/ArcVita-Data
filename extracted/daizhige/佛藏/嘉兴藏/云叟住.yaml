  - key: breakthrough
    name: 入院开堂
    labels:
      zh:
      - 戊戌三月初八入院
      - 无祖佛处示祖佛
    start_date: 1658-03-08
    highlight_event_id: guji-云叟住-event-longya
  - key: climax
    name: 清苦化众
    labels:
      zh:
      - 十三年胼胝
      - 示众垂语颂古
    start_date: 1659
    highlight_event_id: guji-云叟住-event-zhushu
  - key: closure
    name: 嘱后示寂
    labels:
      zh:
      - 书单嘱后事
      - 顶齿不坏入塔
    start_date: 1676-08-03
    highlight_event_id: guji-云叟住-event-death
  decisions:
  - date: 1658-03-08
    title_zh: 缚荆编草居龙牙
    rationale: 故场把茅不完，虎卧檐下鹿眠床前亦不去，甘以清苦再造圆畅居遁道场
  - date: 1676-08-03
    title_zh: 书单嘱后事付托
    rationale: 病脾已亟，不以寺事自私，留偈问病，以幻住之风付雪照诸人
events:
- id: guji-云叟住-event-birth
  date: 1620
  year_of: 1620
  title_zh: 生于武州
  description_zh: 产于武州，不言氏族，自号无姓之儿，眉棱疏浅眼方深
- id: guji-云叟住-event-shipin
  date: 1648
  year_of: 1648
  title_zh: 侍先平阳于青州
  description_zh: 禀戒沩山后参询鹤林，继执侍平阳，迎机酬对，一众竦然，得真能杀活之许
- id: guji-云叟住-event-longya
  date: 1658-03-08
  year_of: 1658
  title_zh: 入院潭州龙牙
  description_zh: 顺治十五年二月受请，三月初八入院，开堂示众，竖拂明时节因缘佛性义
- id: guji-云叟住-event-zhushu
  date: 1670
  year_of: 1670
  title_zh: 龙牙示众著语录
  description_zh: 居龙牙十余载，示众晚参小参机缘垂语颂古，谓诸方十分为人龙牙全不为人，直将火种扑灭火炉
- id: guji-云叟住-event-death
  date: 1676-08-14
  year_of: 1676
  title_zh: 示寂于龙牙
  description_zh: 八月初三书单嘱后事，望前一日垂问四大五蕴病从何受，十四日唱灭，春秋五十七，火浴顶齿不坏合灵骨入塔
