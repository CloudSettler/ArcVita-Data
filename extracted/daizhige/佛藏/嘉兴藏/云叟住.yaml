  - key: breakthrough
    name: 青州执侍
    labels:
      zh:
      - 连床共被十年
      - 执侍平阳
    start_date: 1648
    highlight_event_id: guji-云叟住-event-shipin
  - key: climax
    name: 秉拂酬机
    labels:
      zh:
      - 阐化秉拂
      - 一众竦然
    start_date: 1655
    highlight_event_id: guji-云叟住-event-shipin
  - key: closure
    name: 蒙印南行
    labels:
      zh:
      - 杀活相许
      - 孤硬得法
    start_date: 1657
    highlight_event_id: guji-云叟住-event-longya
  decisions:
  - date: 1648
    title_zh: 执侍平阳不去
    rationale: 为人孤硬寡合，独信平阳机锋，愿连床共被十年以究大事
  - date: 1655
    title_zh: 应命秉拂酬众
    rationale: 阐化日被命，不避同学故尼，直下迎机，以验杀活本分
- id: guji-云叟住-endeavor-2
  title_zh: 住持龙牙十三年中兴
  summary_zh: 顺治戊戌入院龙牙，缚荆编草，清苦莅众，再焕祖席，示众垂语，嘱后付托而化
  phases:
  - key: brewing
    name: 应请南来
    labels:
      zh:
