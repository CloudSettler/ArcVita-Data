  decisions:
  - date: 1680
    title_zh: 受崇福请住益阳西峰荒凉院子
    rationale: 回避无门未免特地剪荆除蔓使法王大宝不求自至
  - date: 1680
    title_zh: 付法嗣我净闻赍语录赴槜李授梓附楞严藏流通
    rationale: 虽不以文字新天下耳目亦不以无言秘大法真传
events:
- id: guji-云腹智-event-birth
  title_zh: 诞生蜀地
  date: 1625
  year_of: 1625
  kind: birth
  description: 蜀人生于明末为破山之裔象崖之子后振曹源之宗
- id: guji-云腹智-event-1
  title_zh: 住重庆大足悟灯禅寺开堂
  date: 1670
  year_of: 1670
  kind: 事业
  description: 在三圣庵受请入院据室呈拄杖开炉上堂以恶辣钳锤接引学人
- id: guji-云腹智-event-2
  title_zh: 住贵州安顺清凉禅寺长寿院开法
  date: 1675
  year_of: 1675
  kind: 事业
  description: 在云归山受请住清凉住长寿结制开炉举赵州七斤衫等公案点铁成金
- id: guji-云腹智-event-3
  title_zh: 住永宁中和禅寺辞院
  date: 1679
  year_of: 1679
  kind: 事业
  description: 受陶公请住灵应山中和结制说法后拄杖横肩辞院遁迹幽居向南方
- id: guji-云腹智-event-4
  title_zh: 住潭州益阳西峰禅寺弘化
  date: 1680
  year_of: 1680
  kind: 事业
  description: 在崇福受请入院西峰升座说法竖大悲殿康熙庚申语录付梓流通
- id: guji-云腹智-event-death
  title_zh: 示寂
  date: 1685
  year_of: 1685
  kind: death
  description: 南游湘楚弘化后示寂语录一卷由侍者狱贤联升纪录曹溶作序
