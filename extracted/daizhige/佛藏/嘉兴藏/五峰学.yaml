events:
- id: guji-五峰学-event-birth
  date: 1585-04-08
  year_of: 1585
  title_zh: 生于长安临潼任氏
  description: 万历乙酉四月八日生白光满室性不茹荤稍长乐静坐
  place_zh: 长安临潼
- id: guji-五峰学-event-ordination
  date: 1605-01-01
  year_of: 1605
  title_zh: 投五台大岭寺剃发圆戒
  description: 二十离俗投天齐师剃发法名如学后从澄方律主圆戒入楚访诸方
  place_zh: 五台大岭寺
- id: guji-五峰学-event-awakening
  date: 1623-03-01
  year_of: 1623
  title_zh: 常州复遇性空抚桌有省
  description: 问万法归一归何处性空抚桌一下从前庐陵米价石头语一时透得
  place_zh: 常州途中
- id: guji-五峰学-event-dharma
  date: 1628-04-01
  year_of: 1628
  title_zh: 龙池通玄契密云得付
  description: 参密云悟和尚于龙池深契法旨又于通玄呈三偈连跳转身而去蒙付承受列临济三十五世
  place_zh: 龙池通玄
- id: guji-五峰学-event-abbacy
  date: 1631-01-01
  year_of: 1631
  title_zh: 主大沩同庆大振宗风
  description: 崇祯辛未来主大沩同庆斩石诛茅从学如云座下养拙明公脱颖
  place_zh: 大沩同庆寺
- id: guji-五峰学-event-death
  date: 1633-07-22
  year_of: 1633
  title_zh: 示寂金陵祇陀归塔沩山
  description: 癸酉六月预知时至不饮不食七月二十二日正午浴毕书偈掷笔敛目而逝世寿四十九僧腊二十九弟子奉骨归沩建塔陶汝鼐撰铭
  place_zh: 金陵祇陀林
