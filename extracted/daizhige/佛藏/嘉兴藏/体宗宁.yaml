    en: Yunfeng Tizongning
  lifespan:
    birth:
      date: '1599'
      precision: year
      is_circa: true
      raw: 戊戌六帙大年推算约万历二十七年
    death:
      date: '1673'
      precision: year
      is_circa: true
      raw: 康熙乙丑前十余年入寂
  birth_date: '1599'
  death_date: '1673'
  era: 明末清初
  reign_ref: 顺治至康熙
  archetype: 禅林宗师
  dilemmas:
  - 隐逸不出与应请住持弘化之间如何抉择
  - 恶辣钳锤剿绝纤情与慈悲摄受之间如何兼顾
  lesson: 悟真履实，脚跟踏地，生蛇脱壳，青凫化凤
  summary_first_person: 吾体宗宁，得戒于万峰破山翁，隐逸多年，顺治间应请住泸州方山云峰，恶辣接众二十年，复住蟠龙开元，只教当人脚下明了，不喜记录，赤心片片付后人
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/嘉兴藏/云峰体宗宁禅师语录.md
  - https://daizhige.org/佛藏/嘉兴藏/云峰体宗宁禅师语录.html
endeavors:
- id: guji-体宗宁-endeavor-1
  title_zh: 嗣法破山隐逸悟真
  description: 三十五岁始见破山，十年执侍克苦经行，脱皮换骨悟山河大地即心垢，隐逸不出人前
  phases:
  - key: brewing
    name: 年晚入道执侍十年
    labels:
      zh: 参学事师
    start_date: '1634'
    highlight_event_id: guji-体宗宁-event-meet-master
  - key: breakthrough
    name: 脱皮换骨另具只眼
    labels:
      zh: 彻悟本心
    start_date: '1640'
    highlight_event_id: guji-体宗宁-event-awakening
  - key: climax
    name: 隐逸不欲出人前
    labels:
      zh: 守道韬晦
    start_date: '1646'
    highlight_event_id: guji-体宗宁-event-reclusion
  - key: closure
    name: 负钵袋承曹溪正脉
    labels:
      zh: 嗣法传灯
    start_date: '1650'
    highlight_event_id: guji-体宗宁-event-dharma-transmission
  decisions:
  - date: '1634'
    title_zh: 三十五岁投破山出家参学
    rationale: 痛念生死深怀惭愧，夜夜经行撞柱靠壁克苦数年求相应
  - date: '1646'
    title_zh: 隐逸多年不出人前
    rationale: 悟真履实不喜名闻，堤岸甚牢不许记录刻行
- id: guji-体宗宁-endeavor-2
  title_zh: 住持云峰二十载弘化
  description: 顺治九年应泸州请住方山云峰禅院，结制解制升堂小参恶辣钳锤，复住江安蟠龙南溪开元，激扬宗风起坠绪
  phases:
  - key: brewing
    name: 顺治九年应请出山
    labels:
      zh: 开法云峰
    start_date: '1652'
    highlight_event_id: guji-体宗宁-event-abbot-yunfeng
  - key: breakthrough
    name: 结制安禅激扬宗风
    labels:
      zh: 选佛场开
    start_date: '1653'
    highlight_event_id: guji-体宗宁-event-abbot-yunfeng
  - key: climax
    name: 住蟠龙开元重开优昙
    labels:
      zh: 转院弘化
    start_date: '1660'
    highlight_event_id: guji-体宗宁-event-abbot-panlong
  - key: closure
    name: 入寂语录刊刻流通
    labels:
      zh: 法乳留芳
    start_date: '1673'
    highlight_event_id: guji-体宗宁-event-death
  decisions:
  - date: '1652'
    title_zh: 拽杖应请住持云峰
    rationale: 迫不得已不忍圣教衰微，拽杖而应接纳四来起已坠之风
  - date: '1660'
    title_zh: 转锡蟠龙开元随缘弘化
    rationale: 逢缘且住不触张王，灵瑞优昙重开普天匝地示人
events:
- id: guji-体宗宁-event-birth
  title_zh: 降生
  date: '1599'
  year_of: 1599
  precision: year
  is_circa: true
  description: 约万历二十七年降生，入道年晚三十五岁方见本师
- id: guji-体宗宁-event-meet-master
  title_zh: 三十五岁见破山
  date: '1634'
  year_of: 1634
  precision: year
  is_circa: true
  location_zh: 夔州万峰山太平禅寺
  description: 三十五岁始见本师破山海明，依师十载无行不行无事不执
- id: guji-体宗宁-event-awakening
  title_zh: 脱皮换骨悟道
  date: '1640'
  year_of: 1640
  precision: year
  is_circa: true
  description: 克苦经行数年才得相应，始知山河大地草木丛林尽属吾人心垢
- id: guji-体宗宁-event-reclusion
  title_zh: 隐逸不出人前
  date: '1646'
  year_of: 1646
  precision: year
  is_circa: true
  description: 自负钵袋隐逸多年，有不出人前之语，不喜人记录其语
- id: guji-体宗宁-event-dharma-transmission
  title_zh: 嗣法破山承正脉
  date: '1650'
  year_of: 1650
  precision: year
  is_circa: true
  description: 承万峰破山付嘱，传曹溪正脉三十五世，火炉头边亲蒙付嘱
- id: guji-体宗宁-event-abbot-yunfeng
  title_zh: 顺治九年住持云峰
  date: '1652'
  year_of: 1652
  precision: year
  is_circa: false
  location_zh: 泸州方山云峰禅寺
  description: 顺治九年三月十三日应川南道吴登启等请，住泸州方山云峰，开法将二十年
- id: guji-体宗宁-event-abbot-panlong
  title_zh: 住蟠龙开元弘化
  date: '1660'
  year_of: 1660
  precision: year
  is_circa: true
  location_zh: 江安蟠龙寺南溪开元寺
  description: 复住江安蟠龙寺南溪开元寺，结制解制上堂小参，重开优昙示众
- id: guji-体宗宁-event-death
  title_zh: 入寂灭定
  date: '1673'
  year_of: 1673
  precision: year
  is_circa: true
  location_zh: 方山云峰
  description: 开法云峰近二十年后入寂，至康熙乙丑已十余年，语录方得刊行
