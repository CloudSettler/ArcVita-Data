  decisions:
  - date: 1655-01-01
    title_zh: 不以许可自信复遍参
    rationale: 契证最早而不自肯，苦心危行以求实证实参
  - date: 1668-01-01
    title_zh: 于福城横机受一击而契初心
    rationale: 烈焰红炉难凑泊，蓦头一拶迸破顶门方知鼻孔下事
- id: guji-佛冤纲-endeavor-2
  title_zh: 连住大刹中兴昭觉
  summary: 奉丈雪命迭主古字昭觉潮音般若凡四坐道场，为昭觉第二世，上堂小参拈古颂古，杀活擒拏重兴唐宋祖席
