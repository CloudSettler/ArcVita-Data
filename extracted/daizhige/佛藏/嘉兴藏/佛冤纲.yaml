  - date: 1670-11-18
    title_zh: 应请住古字山举扬根源
    rationale: 昭觉落成先开法古字，以拄杖揭第一义酬法乳恩
  - date: 1673-10-15
    title_zh: 奉老人命回昭觉为第二世
    rationale: 老人腊高倦接物，须负荷中兴滹沱大用以无坠破山遗烈
