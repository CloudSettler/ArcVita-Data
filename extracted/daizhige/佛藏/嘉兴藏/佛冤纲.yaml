  - key: climax
    name: 潮音般若迭住
    labels:
      zh: 双流潮音天池般若
    start_date: 1680-01-01
    highlight_event_id: guji-佛冤纲-event-zhaojue
  - key: closure
    name: 广录付梓传灯
    labels:
