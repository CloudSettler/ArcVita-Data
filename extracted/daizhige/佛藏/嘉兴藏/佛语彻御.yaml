    title_zh: 温和涵养中下钳锤
    rationale: 说法为人处言温气和不用恶辣外相直从性海源头点出行人归家之路
  - date: 1671-08-01
    title_zh: 以火佛事示生死去来
    rationale: 借成住坏空生老病死示不断烦恼而明佛性不舍生死而证涅槃
events:
- id: guji-佛语御-event-birth
  title_zh: 降生嘉阳范氏
  date: 1642-01-01
  year_of: 1642
  description: 嘉阳范氏子即后之佛语彻御早出娘胎三十余年而钻研劫运
  endeavor_ref: guji-佛语御-endeavor-1
- id: guji-佛语御-event-1
  title_zh: 得法慧觉御侍终身
  date: 1662-06-01
  year_of: 1662
  description: 得法于慧觉法兄和尚御侍师终身虽寒暑顺逆百折摧而无堕容苦侍十余秋
  endeavor_ref: guji-佛语御-endeavor-1
- id: guji-佛语御-event-2
  title_zh: 室中机缘法语示众
  date: 1670-05-01
  year_of: 1670
  description: 室中答西来大意楞严四十四心开炉锄圃示白拈可心万庥等直指归家稳坐穿泉汲水性海源头
  endeavor_ref: guji-佛语御-endeavor-2
- id: guji-佛语御-event-3
  title_zh: 佛事拈火众偈付嘱
  date: 1671-08-01
  year_of: 1671
  description: 为妙善良宪恒一寂寿举火竖炬打圆相喝撺示生死去来与舆若乘憨之秀等付嘱渡人之舟并作访道寿别吊答众偈
  endeavor_ref: guji-佛语御-endeavor-2
- id: guji-佛语御-event-death
  title_zh: 示微疾端然长往
  date: 1672-12-01
  year_of: 1672
  description: 未示寂前书自感偈早出娘胎三十年一日示微疾唤门人云翻过去翻过来咳唾掉背皆是我到我无我所言罢端然长往甲寅叙时已早夭康熙壬戌附藏流通
  endeavor_ref: guji-佛语御-endeavor-2
