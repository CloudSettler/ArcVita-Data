  dilemmas:
  - 福不逮慧而早夭未展双桂之道与涵养酝藉说法为人之志
  - 存日不喜人记录其语与嗣法门人窃记机缘法语成编传世之需
  lesson: 温气和中自有钳锤早夭之身亦可借门人一编留涵养流出之法音
  summary_first_person: 我嘉阳范氏子得法于慧觉侍师终身历寒暑顺逆而不堕存日不喜人记录说法唯从涵养中温和流出早出娘胎三十年而心倦神疲翻覆咳唾皆是我无我所而去
