    - Rujiu Ruibai
  lifespan:
    birth:
      date: 1580
      precision: year
      is_circa: true
      raw: 明末约生，本迹未详
    death:
      date: 1640
      precision: year
      is_circa: true
      raw: 崇祯末退隐崆峒归寂，塔葬龙华
  birth_date: 1580
  death_date: 1640
  era: 明末
  reign_ref: 崇祯
  archetype: 弘宗演教的曹洞宗师
  dilemmas:
  - 潜栖岩壑养拙与出世了却先师不了公案之间如何抉择
  - 峻烈拈提勘验学人与老婆心切为人说法之间如何兼顾
  lesson: 扼住要津直指人心，以严律持众，以无渗漏善回互补偏救弊振兴宗风
  summary_first_person: 吾入就，号瑞白，嗣云门湛然，为洞山下三十二世，达磨下四十二世，九坐道场，嗣法三十余人，继住云门延庆白雀龙华，退隐崆峒归寂，一片老婆心尽付语录十八卷以示后学
