endeavors:
- id: guji-入就-endeavor-1
  title_zh: 继席云门延庆弘扬曹洞宗风
  summary_zh: 受越中缙绅居士请，继住云门显圣寺，继住绍兴延庆寺，开堂上堂拈提宗要
  phases:
  - key: brewing
    name: 受请酝酿
    labels:
      zh:
      - 潜栖
      - 出世
    start_date: 1628-11-27
    highlight_event_id: guji-入就-event-yunmen
  - key: breakthrough
    name: 云门开堂
    labels:
      zh:
      - 了却公案
      - 法乳深恩
    start_date: 1629-09-10
    highlight_event_id: guji-入就-event-yunmen
  - key: climax
    name: 延庆敷化
    labels:
      zh:
      - 显圣
      - 延庆
    start_date: 1630-09-27
    highlight_event_id: guji-入就-event-yanqing
  - key: closure
    name: 浙东化洽
    labels:
      zh:
      - 问答机缘
      - 四众归仰
    start_date: 1630-10-15
    highlight_event_id: guji-入就-event-yanqing
  decisions:
  - date: 1628-11-27
    title_zh: 应请出世继住云门
    rationale: 本欲潜栖养拙，为云门先师不了公案特为了却，不忍法席久虚
  - date: 1630-09-27
    title_zh: 移锡绍兴延庆开堂
    rationale: 随顺越州护法请邀，扩大曹洞法化，报本酬恩普利人天
- id: guji-入就-endeavor-2
  title_zh: 住持白雀龙华付法退隐
  summary_zh: 应湖州缙绅请住白雀寺，嘱付天台护国龙华法席，退隐崆峒归寂，门人集刻十八卷语录
  phases:
  - key: brewing
    name: 西赴吴兴
    labels:
      zh:
      - 白雀
      - 湖州请法
    start_date: 1631-09-01
    highlight_event_id: guji-入就-event-baique
  - key: breakthrough
    name: 白雀开炉
    labels:
      zh:
      - 结制解制
      - 炉韝选佛
    start_date: 1631-10-01
    highlight_event_id: guji-入就-event-baique
  - key: climax
    name: 嘱付法席
    labels:
      zh:
      - 付法三十余人
      - 天台龙华
    start_date: 1636-06-01
    highlight_event_id: guji-入就-event-tuiyin
  - key: closure
    name: 退隐集录
    labels:
      zh:
      - 崆峒归寂
      - 语录大传
    start_date: 1643-09-15
    highlight_event_id: guji-入就-event-yulu
  decisions:
  - date: 1631-09-01
    title_zh: 应请住持湖州白雀寺
    rationale: 道化条达因缘在浙西，为弘洞上玄风广接士庶故赴请
  - date: 1636-06-01
    title_zh: 嘱啸云久默分座退隐
    rationale: 法系已繁嗣法有人，功成身退歸寂崆峒，以全始终付嘱慧命
events:
- id: guji-入就-event-birth
  title_zh: 出生
  date: 1580
  year_of: 1580
  description: 明末约生，早年参礼尊宿，十三载寝食不安，七参不肯而有省
- id: guji-入就-event-yunmen
  title_zh: 继住云门显圣寺开堂
  date: 1629-09-10
  year_of: 1629
  description: 崇祯二年九月初十，绍兴缙绅居士请继云门显圣寺，登座拈香酬湛然法乳之恩，举法灯了却公案话接众
- id: guji-入就-event-yanqing
  title_zh: 住持绍兴延庆寺开堂
  date: 1630-09-27
  year_of: 1630
  description: 崇祯三年九月廿七受请住延庆寺，开堂竖拂示第一义，士民辐辏问答机缘甚盛
- id: guji-入就-event-baique
  title_zh: 住持湖州白雀寺开堂
  date: 1631-09-01
  year_of: 1631
  description: 崇祯四年九月受唐司马沈司寇等请住白雀寺，开堂结制，阐大圆觉伽蓝平等性智
- id: guji-入就-event-tuiyin
  title_zh: 付法天台龙华退隐崆峒
  date: 1636-06-01
  year_of: 1636
  description: 崇祯乙亥嘱啸云主天台护国，丙子夏嘱久默主弁山龙华，退隐崆峒，九坐道场嗣法三十余人
- id: guji-入就-event-yulu
  title_zh: 门人编刻语录十八卷
  date: 1643-09-15
  year_of: 1643
  description: 崇祯十六年癸未秋，啸云收先后刻未刻总编十八卷，陈函辉作序，黄端伯张时化等旧序并存，大传于世
- id: guji-入就-event-death
  title_zh: 归寂塔葬龙华
  date: 1640
  year_of: 1640
  description: 退隐后归寂于崆峒，百丈塔葬龙华，啸云为嫡嗣谓之得髓，洞山父子遗风再振
