person:
  qid: guji-其白富
  name_zh: 其白富
  names:
    zh: 其白富
    en: Qibai Fu
  lifespan:
    birth:
      date: 1630
      precision: year
      is_circa: true
      raw: 明末约崇祯年间生而颖异
    death:
      date: 1696
      precision: year
      is_circa: true
      raw: 康熙末年溽暑示灭于鹤林
  birth_date: 1630
  death_date: 1696
  era: 明末清初
  reign_ref: 康熙
  archetype: 高僧
  dilemmas:
  - 教律禅三学俱炼如何阶升次第而不滞于文字纸墨
  - 不许门人录上堂小参法语而私记成帙刊行如何 preserved 家风又不违不立文字本怀
  lesson: 三慧齐修三学俱炼，弃教习律再入禅室，身体力行而后提唱宗乘，阶升次第方能纵夺自在
  summary_first_person: 吾幼而知归，早通般若法华，依慈航老人，继入大如律师之堂，后投昭觉本师丈雪老人之室得法，分座蟠龙玉泉三十余秋，横拈倒用只为穿却衲僧鼻孔，鹤林示灭全躯未散皆是平常事耳
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E7%8E%89%E6%B3%89%E5%85%B6%E7%99%BD%E5%AF%8C%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E7%8E%89%E6%B3%89%E5%85%B6%E7%99%BD%E5%AF%8C%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.md
endeavors:
- id: guji-其白富-endeavor-1
  person_qid: guji-其白富
  title_zh: 三学阶升昭觉得法
  description: 早通般若法华诸经依慈航老人，弃教就大如律师习毗尼，再入昭觉丈雪通醉之室发明大事，得临济正传，为破山下昭觉旁出嫡嗣
  phases:
  - key: brewing
    name: 通教习经
    labels:
      zh: 般若法华慈航门下
    start_date: 1645
    highlight_event_id: guji-其白富-event-study
  - key: breakthrough
    name: 弃教习律
    labels:
      zh: 升大如律主之堂
    start_date: 1655
    highlight_event_id: guji-其白富-event-study
  - key: climax
    name: 投昭觉得法
    labels:
      zh: 入丈雪之室副二全彰
    start_date: 1665
    highlight_event_id: guji-其白富-event-dharma
  - key: closure
    name: 付嘱分座
    labels:
      zh: 再来人阶升次第成
    start_date: 1668
    highlight_event_id: guji-其白富-event-dharma
  decisions:
  - date: 1655
    title_zh: 弃教升律堂
    rationale: 教明权实之后须以戒体为基，故舍讲肆就律主精研开遮持犯
  - date: 1665
    title_zh: 舍律投昭觉参禅
    rationale: 律达开遮已备，须知纵夺向上事，故入昭觉丈雪室中直指本分得法印可
- id: guji-其白富-endeavor-2
  person_qid: guji-其白富
  title_zh: 住持蟠龙玉泉弘化
  description: 龙天四众推上宝华王座，主蟠龙山玉泉寺三十余秋，上堂小参晚参示众拈古颂古，门人私记三卷刊入嘉兴藏，鹤林示灭定力愈深
  phases:
  - key: brewing
    name: 初住玉泉
    labels:
      zh: 建立法化整顿时机
    start_date: 1668
    highlight_event_id: guji-其白富-event-yuquan
  - key: breakthrough
    name: 宝华开堂
    labels:
      zh: 横抛栗棘布袋钳锤峻烈
    start_date: 1685
    highlight_event_id: guji-其白富-event-shangtang
  - key: climax
    name: 语录成帙
    labels:
      zh: 门人圆顶等私记三卷东下嘉禾剞劂
    start_date: 1695
    highlight_event_id: guji-其白富-event-shangtang
  - key: closure
    name: 鹤林示灭
    labels:
      zh: 溽暑流金全躯未散
    start_date: 1696
    highlight_event_id: guji-其白富-event-death
  decisions:
  - date: 1668
    title_zh: 就请住持玉泉
    rationale: 时至理彰四众推戴，须高悬赤辙和光同尘大展毗尼以续破山昭觉一脉
  - date: 1685
    title_zh: 禁录而容私记刊行
    rationale: 本禁上堂小参等语录恐滞纸墨，念门人私窃成帙有利后学，故许玟睿琳睿等编次流通而不亲操翰
events:
- id: guji-其白富-event-birth
  person_qid: guji-其白富
  kind: birth
  title_zh: 生而颖异龆龀知归
  date: 1630
  year_of: 1630
  location: 蜀中
  description: 河岳之钟生而颖异，幼即知归，性成非习，早通般若法华等经
- id: guji-其白富-event-study
  person_qid: guji-其白富
  kind: 修学
  title_zh: 依慈航习教再入律堂
  date: 1655
  year_of: 1655
  location: 大如律师堂
  description: 为慈航老人之徒通教后，弃教升大如律主之堂，精研毗尼达开遮之旨
- id: guji-其白富-event-dharma
  person_qid: guji-其白富
  kind: 得法
  title_zh: 入昭觉丈雪之室得法
  date: 1665
  year_of: 1665
  location: 成都昭觉寺
  description: 投昭觉堂上丈雪醉老人之室，副二全彰阶升次第，得临济三十四叶下破山昭觉法脉
- id: guji-其白富-event-yuquan
  person_qid: guji-其白富
  kind: 住持
  title_zh: 分座蟠龙山玉泉寺
  date: 1668
  year_of: 1668
  location: 蟠龙山玉泉寺
  description: 本师再分一叶于蟠龙山，推上宝华王座建立法化，三慧齐修十字街头教演三乘孤峰绝顶拈提向上
- id: guji-其白富-event-shangtang
  person_qid: guji-其白富
  kind: 弘法
  title_zh: 康熙乙丑冬结制上堂
  date: 1685-12-01
  year_of: 1685
  location: 玉泉寺法堂
  description: 结制九旬期满开炉上堂，拈香祝圣酬法乳恩，棒喝交驰勘验衲子，门人圆顶等编次上堂小参法语机缘成三卷
- id: guji-其白富-event-death
  person_qid: guji-其白富
  kind: death
  title_zh: 鹤林示灭全躯未散
  date: 1696-07-01
  year_of: 1696
  location: 鹤林
  description: 道唱玉泉锦水三十余秋后，于溽暑流金之际示灭鹤林，全躯未散定力愈深，塔铭行实附于语录卷末
