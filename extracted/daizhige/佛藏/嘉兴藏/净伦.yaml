  birth_date: 1427
  death_date: 1496
  era: 明代
  reign_ref: 明宣德至弘治
  archetype: 禅林宗匠
  dilemmas:
  - 都城开刹宗风大著而本好寂静，酬应繁多与退隐自怡之抉择
  - 宗门参究与净业兼修并弘，禅净一味与专宗之权衡
  lesson: 得大自在者必由真参实悟，不滞言筌，因言会意方能横竖受用
  summary_first_person: 我名净伦，号大巍，滇南昆明康氏子，宣德丁未生，正统庚申礼太华无极泰和尚出家，天顺癸未得法于浮山古庭，忝为临济二十四世孙，成化乙酉卓锡京师开创万福，晚厌酬应退居西轩种竹自怡，屡游五台助修净业，旁通儒学，拈古示众遗有竹室集
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E5%A4%A7%E5%B7%8D%E7%A6%85%E5%B8%88%E7%AB%B9%E5%AE%A4%E9%9B%86.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E5%A4%A7%E5%B7%8D%E7%A6%85%E5%B8%88%E7%AB%B9%E5%AE%A4%E9%9B%86.html
endeavors:
- id: guji-大巍-endeavor-1
  title_zh: 京师开创万福禅刹大振宗风
  summary_zh: 自滇入京卓锡都城东隅，开创万福，接引缁白，宗风大著，为临济正脉延命
  phases:
  - key: brewing
    name: 滇南出家参学
    labels:
      zh: 出家受禅学
    start_date: 1440
    highlight_event_id: guji-大巍-event-ordain
  - key: breakthrough
    name: 浮山得法传灯
    labels:
      zh: 得法入室
    start_date: 1463
    highlight_event_id: guji-大巍-event-inherit
  - key: climax
    name: 京师卓锡开堂
    labels:
      zh: 开创万福
    start_date: 1465
    highlight_event_id: guji-大巍-event-found
  - key: closure
    name: 谢事退居西轩
    labels:
      zh: 退居竹室
    start_date: 1478
    highlight_event_id: guji-大巍-event-retreat
  decisions:
  - date: 1465
    title_zh: 卓锡都城开创万福
    rationale: 为继往开来提撕警觉，不辞弘化之任，就京畿要地立丛林以续禅命
  - date: 1478
    title_zh: 谢事退居种竹自怡
    rationale: 本好寂静，久厌酬应，故敛锋韬晦，号竹室以养高致全道体
- id: guji-大巍-endeavor-2
  title_zh: 巡礼五台助修净业兼弘禅净
  summary_zh: 三登五台访文殊圣迹，应显通妙应之请住持净业道场，拈示念佛三昧，会禅净于一源
  phases:
  - key: brewing
    name: 初登五台访圣
    labels:
      zh: 访文殊圣迹
    start_date: 1483
    highlight_event_id: guji-大巍-event-wutai-first
  - key: breakthrough
    name: 归山阅藏著述
    labels:
      zh: 阅藏示众
    start_date: 1486
    highlight_event_id: guji-大巍-event-return
  - key: climax
    name: 再住显通提督净业
    labels:
      zh: 显通圆满示众
    start_date: 1490
    highlight_event_id: guji-大巍-event-wutai-second
  - key: closure
    name: 妙应示众集文成帙
    labels:
      zh: 竹室集成帙
    start_date: 1496
    highlight_event_id: guji-大巍-event-collection
  decisions:
  - date: 1483
    title_zh: 登五台访文殊
    rationale: 为亲承圣境策励己躬，亦为众作得大受用之榜样，故不惮远涉
  - date: 1490
    title_zh: 应请抚众修净业
    rationale: 以念佛三昧普摄含灵，助宣佛化丕赞宗猷，故以禅师而登净业座阐如是思惟之旨
