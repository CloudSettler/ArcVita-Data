  name_zh: 净伦
  names:
    zh: 净伦
    en: Dawei Jinglun
  lifespan:
    birth:
      date: 1427
      precision: year
      is_circa: false
      raw: 宣德丁未诞生
    death:
      date: 1496
      precision: year
      is_circa: true
