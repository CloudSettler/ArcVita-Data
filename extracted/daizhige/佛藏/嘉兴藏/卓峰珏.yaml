  - date: 1642-01
    title_zh: 舍教参禅皈衡老人
    rationale: 闻衡老人道风扬溢，欲究个事了生死，故晨昏不辍专参话头
  - date: 1684-03
    title_zh: 甲子走高峰托幻孙
    rationale: 自忝承大任诿责无人，见幻孙颇具灵机，愿祈别兄提诲使沿流有托
