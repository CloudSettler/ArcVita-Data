  decisions:
  - date: 1680-07-23
    title_zh: 应四众请庆云开法
    rationale: 值先老人四九难越众情，且酬檀信护法之恩，故升座拈香竖拂说法
  - date: 1685-07
    title_zh: 极力奔趋先师之丧
    rationale: 先师化去法谊昭然，不顾己恙奔趋尽哀，以全师徒之义
