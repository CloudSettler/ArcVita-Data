  - 像季运衰学侣懈怠而函丈提撕甚急，继志守成何以振宗风
  - 先师脱化重任独承而法门乏人，沿流付托何以不负法乳
  lesson: 晨昏不辍苦参二十余载方得印可，兢兢继席以身弘道方不负师恩
  summary_first_person: 吾忠州成氏子，十五祝发，久习教典，闻衡山老人道风而皈礼之，晨昏究个事二十余载，蒙付拄杖拂子更号卓峰，继席庆云，恢弘祖道，甲子托幻孙于高峰，乙丑秋随先师而化去
