endeavors:
- id: guji-古林智-endeavor-1
  title_zh: 蜀中参学峨嵋自了
  description: 少弃家参学，顿悟第一义，得法语嵩系下，藏迹峨嵋，不欲诸方知
  phases:
  - key: brewing
    name: 弃家参学
    labels:
      zh: 参访悟道
    start_date: '1650'
    highlight_event_id: guji-古林智-event-1
  - key: breakthrough
    name: 得法双桂
    labels:
      zh: 承嗣破山
    start_date: '1660'
    highlight_event_id: guji-古林智-event-1
  - key: closure
    name: 藏迹峨嵋
    labels:
      zh: 自了潜修
    start_date: '1665'
    highlight_event_id: guji-古林智-event-1
  decisions:
  - date: '1660'
    title_zh: 承嗣语嵩破山正脉
    rationale: 为续曹溪正脉，甘啮冰雪，执牧竖事，以报法乳
  - date: '1665'
    title_zh: 藏峨嵋不求闻达
    rationale: 志在自了，不欲诸方知，混迹麋鹿以养道
- id: guji-古林智-endeavor-2
  title_zh: 辽左弘法般若建丛林
  description: 应请入盛京般若，阐破山旨，三期成就大丛林，饭贫衣寒恤病，机锋接众
  phases:
  - key: brewing
    name: 初入辽左
    labels:
      zh: 关东结缘
    start_date: '1670'
    highlight_event_id: guji-古林智-event-2
  - key: breakthrough
    name: 般若进院
    labels:
      zh: 升座开法
    start_date: '1672-12-01'
    highlight_event_id: guji-古林智-event-2
  - key: climax
    name: 三期般若成丛林
    labels:
      zh: 建制济众
    start_date: '1675-09-09'
    highlight_event_id: guji-古林智-event-3
  - key: closure
    name: 示寂荼毗现瑞
    labels:
      zh: 生死自主
    start_date: '1695-12-30'
    highlight_event_id: guji-古林智-event-death
  decisions:
  - date: '1672-12-01'
    title_zh: 受请住持般若
    rationale: 感护法缙绅恳请，为润泽关东，登座阐破山旨
  - date: '1675-09-09'
    title_zh: 付梓语录以示学人
    rationale: 嘱通判季浑作序，使关东学者知宗门正眼，不堕见闻
events:
- id: guji-古林智-event-birth
  date: '1630'
  year_of: 1630
  title_zh: 出生
  description: 生于川中乡里，少弃家参学，志仿佛出尘
- id: guji-古林智-event-1
  date: '1660'
  year_of: 1660
  title_zh: 得法语嵩藏峨嵋
  description: 得法语嵩裔和尚，嗣破山海明正脉，藏峨嵋山中成自了汉
- id: guji-古林智-event-2
  date: '1672-12-01'
  year_of: 1672
  title_zh: 盛京般若进院升座
  description: 康熙壬子冬十月受请，于腊月朔日进盛京般若院，拈香祝圣，升座开法
- id: guji-古林智-event-3
  date: '1675-09-09'
  year_of: 1675
  title_zh: 语录序成辽阳弘化
  description: 康熙乙卯菊月九日季浑序语录，兼化辽阳如来建宁及大悲诸寺，丛林大成
- id: guji-古林智-event-death
  date: '1695-12-30'
  year_of: 1695
  title_zh: 乙亥冬示寂现瑞
  description: 乙亥仲冬既望跏趺坐逝，复起指示塔所，晦日书偈而逝，举火烟焰五色，现金色毗卢像，舍利无数一齿不坏
