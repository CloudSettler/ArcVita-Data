  - key: climax
    name: 升座说法高峰
    labels:
      zh: 弘化
    start_date: 1669-09-21
    highlight_event_id: guji-古梅洌-event-1669-kaitang
  - key: closure
    name: 当晚谢众收束
    labels:
      zh: 收束
    start_date: 1669-09-21
    highlight_event_id: guji-古梅洌-event-1669-kaitang
  decisions:
  - date: 1669-09-21
    title_zh: 勉从四郡檀越诸山之请开堂
    rationale: 堂上老人刳心沩岭四十年年将暮景为子理宜奉巾瓶兼念法门倡百千人请故退己让人不得而顺从
  - date: 1669-09-21
    title_zh: 拈香三瓣祝圣报恩
    rationale: 上祝今上万岁中愿文武绅官护法下酬临济三十三世慧山老人法乳之恩以明国运法运齐隆
- id: guji-古梅洌-endeavor-2
  title_zh: 芙蓉往返与丛林岁时教化
  description: 往返芙蓉与沩山之间因开炉冬至除夕元旦解制万人灯会等机缘上堂小参晚参接化学人由侍者真谦记录成录
  phases:
  - key: brewing
    name: 芙蓉早参往返
    labels:
      zh: 往返
    start_date: 1670-01-01
    highlight_event_id: guji-古梅洌-event-furong
  - key: breakthrough
    name: 灯会开炉说法
    labels:
      zh: 化导
    start_date: 1670-01-01
    highlight_event_id: guji-古梅洌-event-furong
  - key: climax
    name: 岁时解制普说
    labels:
      zh: 普说
    start_date: 1670-06-01
    highlight_event_id: guji-古梅洌-event-jiezhi
  - key: closure
    name: 侍者记录成语录
    labels:
      zh: 成录
    start_date: 1670-06-01
    highlight_event_id: guji-古梅洌-event-jiezhi
  decisions:
  - date: 1670-01-01
    title_zh: 和泥合水逐浪随波接众
    rationale: 既到沩山秪得折箸搅沧溟使鱼龙知性命同声相应同气相求故不惜口业道破虚妄名相
  - date: 1670-06-01
    title_zh: 解制示收中有放
    rationale: 法无定相道不虚行有时捏聚有时放开故示收中有放全归我在当人以全千圣同居共行
