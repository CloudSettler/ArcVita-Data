endeavors:
- id: guji-古梅洌-endeavor-1
  title_zh: 住持沩山密印禅寺开堂演法
  description: 康熙己酉因堂上老人退休养高奉四郡檀越同门诸山之请诣芙蓉敦请就沩山开堂升座拈香祝圣接众
