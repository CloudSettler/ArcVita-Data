  - date: '1641-09-01'
    title_zh: 登座全提祖印
    rationale: 以石钟石鼓无时消歇之声扫除死句，光阐大猷
events:
- id: guji-古雪哲-event-birth
  date: '1595'
  year_of: 1595
  title_zh: 诞生
  description: 明万历间生，夙秉智炬照彻人天
- id: guji-古雪哲-event-awaken
  date: '1630'
  year_of: 1630
  title_zh: 天童开悟嗣法
  description: 入门即被痛棒，复经钳锤数番豁尔开悟，得密云印可为曹溪三十四世
- id: guji-古雪哲-event-retreat
  date: '1631'
  year_of: 1631
  title_zh: 遁迹旧隐耕云种月
  description: 别天童而遁迹亮公旧隐，一钁十霜昼鞭夜策涵养已彻之本领
- id: guji-古雪哲-event-cuiyan
  date: '1641-09-01'
  year_of: 1641
  title_zh: 辛巳出主翠岩开堂
  description: 辛巳秋诛茅白法院，应香城翠岩之请登座开堂，石钟石磬一齐鸣续临济慧命
- id: guji-古雪哲-event-record
  date: '1644'
  year_of: 1644
  title_zh: 提唱结集为语录
  description: 朝暮提唱问答机缘颂古法语书启偈颂佛事，由门人传我等编成二十卷
- id: guji-古雪哲-event-death
  date: '1665'
  year_of: 1665
  title_zh: 示寂
  description: 清康熙初示寂，翠岩宗风远播为中兴第一代祖道
