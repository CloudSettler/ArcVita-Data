events:
- id: guji-古音王-event-birth
  title_zh: 太和元年即位诞圣
  date: '0001-01-01'
  year_of: 1
  place_zh: 古音王国宫内
  description_zh: 天地未判时圆满清虚皇帝即位，分天地曜日月，宫内现慈悲法相，潜心默告虚空而感梦立国
- id: guji-古音王-event-1
  title_zh: 即位建极产二子
  date: '0001-06-01'
  year_of: 1
  place_zh: 古音王国
  description_zh: 夜感神梦产下震皇太子喻性天理，庚极太子喻情人欲，颁敕天下晓谕军民
- id: guji-古音王-event-2
  title_zh: 庚极越西城投我慢山
  date: '0014-08-03'
  year_of: 14
  place_zh: 西城我慢山
  description_zh: 太和十四年八月初三庚极自将经籍付火，驾白虎倒拖银枪越西城结寨，自称西山大白虎神王，含藏识六耳猕猴五路魔党来投
- id: guji-古音王-event-3
  title_zh: 差觉照善能探西山五营
  date: '0014-08-15'
  year_of: 14
  place_zh: 太极殿西山寨
  description_zh: 帝梦泰山崩四海泛，纳般若之言，遣觉照将军与善能分别对治官妆作军人潜入左右前后中五营，探贪瞋痴爱等奸细回奏
- id: guji-古音王-event-death
  title_zh: 功成身化归虚无
  date: '0099-12-31'
  year_of: 99
  place_zh: 古音王国
  description_zh: 传中帝者为虚无之体，性命复后民安国富，主君得定，归于不雕不损无声无臭之本然
