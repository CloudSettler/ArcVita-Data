events:
- id: guji-吹万-event-birth
  title_zh: 降生
  date: 1570
  year_of: 1570
  description: 生于明穆宗神宗之际，生年失载，早年阅大慧语录心醉，入朝阳和尚洞参究得旨
- id: guji-吹万-event-1618-kaifa
  title_zh: 万历戊午开法潇湘湖东禅院
  date: 1618
  year_of: 1618
  description: 万历戊午上元日应霜轮上座檀越四众请，开法湖广衡州潇湘湖东禅院，连喝升座祝圣酬法乳
- id: guji-吹万-event-1631-jiezhi
  title_zh: 崇祯辛未结制忠州聚云禅院
  date: 1631
  year_of: 1631
  description: 崇祯辛未腊八日应田侍御子素庵等请，结制忠州聚云禅院，拈拂道破日用承当，开豁五宗
- id: guji-吹万-event-1635-hanyue
  title_zh: 复玄墓汉月禅师书论禅病
  date: 1635
  year_of: 1635
  description: 接汉月自玄墓来书论大慧禅病及四问，三喝展拜，誓洗衲僧正眼以起坠绪
- id: guji-吹万-event-death
  title_zh: 圆寂于聚云
  date: 1639
  year_of: 1639
  description: 圆寂于忠州聚云寺，数年后崇祯壬午同门谋刻语录二十卷及别录近百卷以行世
