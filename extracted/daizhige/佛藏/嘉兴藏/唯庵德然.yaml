  decisions:
  - date: '1360'
    title_zh: 谒千岩不他往
    rationale: 未有所契唯千岩提唱能豁然悟入日月星辰皆演妙法故决意亲炙入室
  - date: '1370'
    title_zh: 补千岩故处据龙峰
    rationale: 师恩当报丛林请益数百人故不辞劳据室升座祝圣报本
- id: guji-唯庵德然-endeavor-2
  title_zh: 退归松隐弘化示众成录
  summary: 退归华亭松隐安贫弘道，被衲糗饭信向益众，上堂小参法语颂古接引学人，由慧省编次成语录二卷宋濂序行世
