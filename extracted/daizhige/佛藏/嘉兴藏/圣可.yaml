endeavors:
- id: guji-圣可-endeavor-1
  title_zh: 华岩禅院开炉弘法
  summary: 康熙庚戌应双山里蒋弘道等请新建华岩禅院开炉升座其后屡结制解制弘扬临济正法眼藏
  phases:
  - key: brewing
    name: 新建华岩应请开炉
    labels:
      zh:
      - 开山
      - 开炉
    start_date: 1670-10-15
    highlight_event_id: guji-圣可-event-huayan-kailu
  - key: breakthrough
    name: 冬夏结制接化学人
    labels:
      zh:
      - 结制
      - 接机
    start_date: 1673-11-01
    highlight_event_id: guji-圣可-event-huayan-jiezhi
  - key: climax
    name: 拈古颂古勘验宗徒
    labels:
      zh:
      - 宗乘
      - 勘验
    start_date: 1674-01-01
    highlight_event_id: guji-圣可-event-huayan-jiezhi
  - key: closure
    name: 解制普请耘秧归农
    labels:
      zh:
      - 解制
      - 归朴
    start_date: 1675-02-01
    highlight_event_id: guji-圣可-event-huayan-jiezhi
  decisions:
  - date: 1670-10-15
    title_zh: 应请出山开炉升座
    rationale: 以不惑乱人天不钝置诸友为怀酬檀信建庄弘道之诚
  - date: 1673-11-01
    title_zh: 长期短限立规造就
    rationale: 因眼随色变耳逐声移故借炉鞴陶炼令学人瞥然省得不受人欺
- id: guji-圣可-endeavor-2
  title_zh: 报恩禅寺住持中兴
  summary: 康熙壬子应渝城乡绅耆庶及旧住持超沦三请入院报恩披毛戴角兴扬双桂老人宗旨化荆棘为梵宫
  phases:
  - key: brewing
