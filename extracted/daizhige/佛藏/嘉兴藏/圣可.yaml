    highlight_event_id: guji-圣可-event-baoen-ruyuan
  - key: breakthrough
    name: 结制演教化瓦砾为梵宫
    labels:
      zh:
      - 建寺
      - 演教
    start_date: 1672-03-01
    highlight_event_id: guji-圣可-event-baoen-ruyuan
  - key: climax
    name: 浴佛解制八字打开
    labels:
      zh:
      - 弘法
      - 利生
    start_date: 1672-04-08
    highlight_event_id: guji-圣可-event-baoen-ruyuan
  - key: closure
    name: 再归华岩续举宗风
    labels:
      zh:
      - 归山
      - 传灯
    start_date: 1672-10-15
    highlight_event_id: guji-圣可-event-huayan-jiezhi
  decisions:
  - date: 1672-02-06
    title_zh: 辞不获而入院报恩
    rationale: 为建立双桂老人宗旨令百劫千生之计在乎最初一句
  - date: 1672-04-08
    title_zh: 为悉达作主拈杖示生
    rationale: 欲使云门有捧无下手处令大众会取摩耶即今所在
events:
- id: guji-圣可-event-birth
  date: 1610
  year_of: 1610
  title_zh: 诞生
  description: 明末诞生父母恩爱念念迁流后遇朗公推出头参究云门普事
- id: guji-圣可-event-huayan-kailu
  date: 1670-10-15
  year_of: 1670
  title_zh: 华岩开炉升座
  description: 康熙庚戌十月十五双山里蒋弘道等新建华岩禅院请师开炉拈香祝圣升座举南泉住山公案
- id: guji-圣可-event-baoen-ruyuan
  date: 1672-02-06
  year_of: 1672
  title_zh: 入院报恩禅寺
  description: 康熙壬子孟春望六日应渝城众绅及超沦请入院报恩三门佛殿方丈依次拈提升座举朱行军南际机缘
- id: guji-圣可-event-huayan-jiezhi
  date: 1673-11-01
  year_of: 1673
  title_zh: 华岩再住结制解制
  description: 癸丑甲寅乙卯连年华岩结制解制上堂勘验新戒居士拈赵州婆子药山升座等公案门人光佛等编成语录五卷
- id: guji-圣可-event-death
  date: 1682
  year_of: 1682
  title_zh: 示寂
  description: 再住华岩后示寂语录由门人光佛等编行于世分上堂晚参机缘拈古颂古杂录等
