    title_zh: 为宋元戎示修心法要
    rationale: 以参究现前一念与系念弥陀名号并举令尘劳中人步跻堂奥不受妄想迁流
  - date: 1671-02-01
    title_zh: 许侍者录要语成帙
    rationale: 字字津梁发古人所未发如良医应病与药须刊剩稿以利群蒙
events:
- id: guji-在犙-event-birth
  title_zh: 诞生
  date: 1612
  year_of: 1612
  description: 约壬子年生逢晚明末劫根钝福薄自伤母难益加愧切后出家参博山下禅师
- id: guji-在犙-event-anju-yisi
  title_zh: 乙巳结夏安居示众
  date: 1665-06-01
  year_of: 1665
  description: 鼎湖结制以事理示安居大乘以大圆觉为境小乘以四念处为境参禅以话头念佛以洪名为境离境即名破夏
- id: guji-在犙-event-anju-dingwei
  title_zh: 丁未夏安居及除夕示三毒十恶
  date: 1667-06-01
  year_of: 1667
  description: 示护生须杀三毒六根魔贼复于除夕拈出身口意三毒十恶八万四千尘劳令自检现业流识渐除以了生死
- id: guji-在犙-event-shixin-song
  title_zh: 示宋元戎修心法要
  date: 1670-08-01
  year_of: 1670
  description: 为初入法门者示参禅看现前妄想所从来与念佛系心六字洪名二门吃紧做去以证三昧灭重罪
- id: guji-在犙-event-zhoujia-xinhai
  title_zh: 辛亥周甲设供坚辞
  date: 1671-01-01
  year_of: 1671
  description: 缁素设供张锦申祝斋讫示知恩报恩拈天上天下惟吾独尊与云门一棒话惭薄德不居祖位
- id: guji-在犙-event-death
  title_zh: 圆寂
  date: 1682
  year_of: 1682
  description: 辛亥后仍卧麻溪象林归岩壑伴清风明月年份失载约推圆寂塔铭举火行实附剩稿卷五
