    description_zh: 本欲岩栖窦处遁迹过时不意受香气勾引及众请不得不拖犁拽耙出世住持
  - title_zh: 把住乾坤与放行利生之施设
    description_zh: 如何运无尽藏顶王三昧在把住与放行之间令众识取第一义而不落窠臼
  lesson: 大道廓然不分缁素圣凡惟待时节因缘直指人心把住放行皆为续临济断桥正脉
  summary_first_person: 我是坦庵峻嗣法瓶山次庵上承临济断桥之绪遍历诸方后受记康熙庚戌受嘉兴绅衿耆宿之请住持普光开炉鞴施毒鼓愿断桥一支大振儿孙匝地
