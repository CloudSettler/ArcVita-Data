      - 出家受戒
    start_date: 1104-09-01
    highlight_event_id: guji-大慧普觉禅师-event-ordination
  - key: breakthrough
    name: 游方参扣
    labels:
      zh:
      - 遍参知识
    start_date: 1106-08-01
    highlight_event_id: guji-大慧普觉禅师-event-canxue
  - key: climax
    name: 荆南求铭
    labels:
      zh:
      - 见无尽居士
    start_date: 1116-03-01
    highlight_event_id: guji-大慧普觉禅师-event-qi铭
  - key: closure
    name: 入京待机
    labels:
      zh:
      - 依普融待圆悟
    start_date: 1124-02-17
    highlight_event_id: guji-大慧普觉禅师-event-rujing
  decisions:
  - date: 1104-09-01
    title_zh: 礼慧齐出家不就槽厂
    rationale: 鄙所闻见不甘村院，立志遍礼善知识明此一大事
  - date: 1116-03-01
    title_zh: 远行荆南求无尽作塔铭
    rationale: 感湛堂恩义担荷遗嘱，不辞数千里行乞以显师德
- id: guji-大慧普觉禅师-endeavor-2
  title_zh: 天宁嗣法荷担宗乘
  summary_zh: 宣和抵天宁依圆悟克勤，参有句无句如藤倚树得大彻，分座训徒掌记室，声誉著丛林。
  phases:
  - key: brewing
    name: 投天宁挂搭
    labels:
      zh:
      - 初见圆悟
    start_date: 1125-04-01
    highlight_event_id: guji-大慧普觉禅师-event-tianning
  - key: breakthrough
    name: 藤倚树得旨
    labels:
      zh:
      - 有句无句悟入
    start_date: 1125-05-13
    highlight_event_id: guji-大慧普觉禅师-event-tianning
  - key: climax
    name: 分座训徒
    labels:
      zh:
      - 掌记室传法
    start_date: 1125-11-01
    highlight_event_id: guji-大慧普觉禅师-event-fenzuo
  - key: closure
    name: 正宗付嘱
    labels:
      zh:
      - 著临济正宗记
    start_date: 1126-01-01
    highlight_event_id: guji-大慧普觉禅师-event-fenzuo
  decisions:
  - date: 1124-09-01
    title_zh: 密往天宁候圆悟
    rationale: 追绎湛堂无尽委寄，以九夏为期验其禅是否异诸方
  - date: 1125-11-01
    title_zh: 炷香立誓掌记室
    rationale: 宁以此身代众生受地狱苦，终不以佛法当人情，故握竹篦应机
events:
- id: guji-大慧普觉禅师-event-birth
  date: 1089-12-04
  year_of: 1089
  title_zh: 诞生宣州宁国
  description_zh: 元祐四年己巳十一月初十日巳时生，姓奚氏，母梦神人卫僧而娠，诞时白光透室。
- id: guji-大慧普觉禅师-event-ordination
  date: 1104-09-01
  year_of: 1104
  title_zh: 东山出家受戒
  description_zh: 崇宁三年九月诣东山慧云院礼慧齐为师名宗杲，四年九月纳僧服十月于景德寺受具足戒，日亲禅学喜看语录。
- id: guji-大慧普觉禅师-event-canxue
  date: 1110-04-08
  year_of: 1110
  title_zh: 行脚参湛堂诸老
  description_zh: 游方至舒州郢州，参洞山微芙蓉楷宝峰湛堂照，作净头侍者，究曹洞临济旨，忆持湛堂语录谒洪觉范。
- id: guji-大慧普觉禅师-event-qi铭
  date: 1116-04-01
  year_of: 1116
  title_zh: 荆南谒无尽求塔铭
  description_zh: 政和六年为湛堂迁化，往兜率求书谒丞相张无尽于荆南，对金刚眼睛一问契机，得字妙喜号昙晦。
- id: guji-大慧普觉禅师-event-rujing
  date: 1124-02-17
  year_of: 1124
  title_zh: 经襄沔入京师依普融
  description_zh: 自渚宫经襄沔南阳冒雪至京，依咸平普融平禅师，居王太宰庵，候圆悟出世天宁。
- id: guji-大慧普觉禅师-event-tianning
  date: 1125-06-20
  year_of: 1125
  title_zh: 天宁参圆悟悟藤倚树
  description_zh: 宣和七年四月抵天宁挂搭，五月十三日闻举诸佛出身处有省，参有句无句如藤倚树，闻树倒藤枯相随来也遂大彻。
- id: guji-大慧普觉禅师-event-fenzuo
  date: 1125-11-01
  year_of: 1125
  title_zh: 分座训徒付正宗记
  description_zh: 圆悟命居择木堂掌记室分座训徒，著临济正宗记付之，丛林归重，声誉蔼著。
- id: guji-大慧普觉禅师-event-death
  date: 1163-08-10
  year_of: 1163
  title_zh: 示寂于径山
  description_zh: 隆兴元年八月十日示寂，世寿七十五，僧腊五十八，塔于径山，谥普觉，语录大慧普觉禅师语录盛行天下。
