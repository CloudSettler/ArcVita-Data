endeavors:
- id: guji-大慧普觉禅师-endeavor-1
  title_zh: 少年出家行脚参学
  summary_zh: 崇宁出家受戒，历参芙蓉楷洞山微宝峰湛堂兜率诸老，谒无尽居士求塔铭，磨砺见地。
  phases:
  - key: brewing
    name: 弃俗出家
    labels:
