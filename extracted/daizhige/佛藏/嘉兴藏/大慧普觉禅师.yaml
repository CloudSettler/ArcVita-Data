  summary_first_person: 我宣州宁国奚氏子，十三入乡校，十六弃俗，十九游方，遍参湛堂无尽诸老，后于天宁圆悟处得有句无句之旨，方知正法眼藏别有实地，愿以此身代众生受苦，不以佛法当人情。
