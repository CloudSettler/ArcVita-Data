  - 辞法堂印证不受而甘结茅晦迹，守高节与续慧命之两难
  - 不立文字直指顶门正眼，又须拈颂说法普接群机之两难
  lesson: 尊师敬僧归信自性常住三宝，回光返照直透本来面目
