  summary_first_person: 吾讳大悦号天一楚南吕氏子也幼值兵燹被掳入黔后脱颖投安南龙潭披剃参善权和尚于龙场万寿复随迁松岿二十余载因侍论楞严世尊举金色臂处豁然有省蒙印可甲子权寂众请继席松岿普光竭力鼎建苦守弘化十余年丁丑孟冬嘱生葬而逝世寿六十有七僧腊四十
  source_urls:
