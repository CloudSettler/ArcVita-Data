events:
- id: guji-天一悦-event-birth
  date: 1631
  year_of: 1631
  title_zh: 生于楚南吕氏值离乱
  description_zh: 楚南吕氏子生值明末离乱被掳入黔在营备尝艰辛而心慕出家
- id: guji-天一悦-event-ordination
  date: 1655
  year_of: 1655
  title_zh: 龙潭披剃谒善权受具参究
  description_zh: 脱颖奔安南龙潭寺礼上无下霞披剃半载闻善权开法龙场万寿往亲觐乞受具足得教参父母未生前面目刻无间断后随迁松岿
- id: guji-天一悦-event-awakening
  date: 1662
  year_of: 1662
  title_zh: 论楞严举臂处豁然有醒蒙印可
  description_zh: 住松岿两载侍权与官人持论楞严至世尊举金色臂屈五轮指问阿难处豁然有醒夜上方丈呈解不受瞒深蒙印可随住二十余载
- id: guji-天一悦-event-succession
  date: 1688-02
  year_of: 1688
  title_zh: 戊辰孟春继席松岿普光
  description_zh: 甲子善权示寂后本境檀越合山大众勉请继席戊辰孟春受镇台龙檀越木境众信请升座拈香祝圣拈拄杖展临济家风
- id: guji-天一悦-event-teaching
  date: 1690
  year_of: 1690
  title_zh: 鼎建松岿上堂示众弘化
  description_zh: 竭力鼎建松岿前后廊庑苦守十余年上堂小参机缘颂古示偈佛事接引僧俗付法化月等传其法者甚众
- id: guji-天一悦-event-death
  date: 1697-11
  year_of: 1697
  title_zh: 丁丑孟冬示寂生葬塔西山
  description_zh: 丁丑孟冬偶示微恙嘱徒化月灭后不劳茶毗生葬言讫而逝化月备棺收殓全身建塔寺西老塔山世寿六十有七僧腊四十后康熙丁亥寿塔铭刊语录于嘉兴楞严寺
