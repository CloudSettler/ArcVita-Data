  - key: breakthrough
    name: 乙巳秋参华桂投契
    labels:
      zh:
      - 水乳之合
    start_date: 1665
    highlight_event_id: guji-天则能-event-defa
  - key: climax
    name: 金明室中三喝得法
    labels:
      zh:
      - 豁然契证
    start_date: 1665
    highlight_event_id: guji-天则能-event-defa
  - key: closure
    name: 付嘱源流为入室真子
    labels:
      zh:
      - 付法
    start_date: 1665
    highlight_event_id: guji-天则能-event-defa
  decisions:
  - date: 1665
    title_zh: 舍诸方折节金明华桂
    rationale: 鲜可其意独于华桂有水乳之合故荷衣松食折节参究
  - date: 1665
    title_zh: 直下承当连喝不退
    rationale: 要打便打三喝四喝后连喝两喝以显真参实悟不堕言诠
- id: guji-天则能-endeavor-2
  title_zh: 语崎结茆三十载弘化
  goal_zh: 孤高壁立住持正法兼行利济行解相应
  phases:
  - key: brewing
    name: 结茆语崎孤坐
    labels:
      zh:
      - 孤高壁立
    start_date: 1666
    highlight_event_id: guji-天则能-event-yuqi
  - key: breakthrough
    name: 宜林死功夫接众
    labels:
      zh:
      - 死功夫
    start_date: 1670
    highlight_event_id: guji-天则能-event-yuqi
  - key: climax
    name: 丁巳六十黄荆祝寿升座
    labels:
      zh:
      - 杀活纵横
    start_date: 1677
    highlight_event_id: guji-天则能-event-huangjing
  - key: closure
    name: 茶亭漏泽垂代利济
    labels:
      zh:
      - 行解相应
    start_date: 1678
    highlight_event_id: guji-天则能-event-huangjing
  decisions:
  - date: 1666
    title_zh: 结茆语崎一坐三十余载
    rationale: 不向佛祖喉下取气须假炉陶镕静定发慧故壁立华顶遗风
  - date: 1677
    title_zh: 不废利济建茶亭创漏泽
    rationale: 提持最上乘而不废利济囊无长物必尽力而行故润鸟道蚕丛掩荒丘遗骸
