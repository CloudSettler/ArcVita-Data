  archetype: 孤高壁立禅师
  dilemmas:
  - 学者浮泛华巧与敦厚死功夫之间如何抉择
  - 最上乘孤峻与茶亭漏泽利济之间如何兼顾
  lesson: 放下透底死心提撕行解相应方能光明照人克世宗风
  summary_first_person: 我是天则能临济下断桥嫡骨金明法孙遍参龙池天童云门道场不契独契华桂山铎得法结茆语崎一坐三十余载孤高壁立不向佛祖喉下取气兼以茶亭漏泽利济行解相应
