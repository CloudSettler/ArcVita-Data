  title_zh: 遍参抉择华桂得法
  goal_zh: 遍参诸宿求真参实悟承临济正宗
  phases:
  - key: brewing
    name: 遍参龙池天童云门
    labels:
      zh:
      - 遍参不契
    start_date: 1645
