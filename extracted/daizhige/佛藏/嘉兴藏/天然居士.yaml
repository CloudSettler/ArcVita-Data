  - 身处尘劳如何超诸有而普劝四众
  lesson: 禅净不二儒释一贯以诗为舟普劝往生
  summary_first_person: 吾系出紫阳寄居双径双溪，少年谈玄，半老皈依念佛，日诵弥陀至十万，参诸善知识而契合，证道于敔山放生社，契机于璜塘古院，亲承福胜机下，重整双溪宗雷社，月朔放生领众，禅课之暇作怀净土诗一百四十九首，终以禅净兼修劝天下人同生极乐
