    title_zh: 就慧灯禅院开堂升座
    rationale: 众檀护恭请为法幢初立借给孤祗园弘扬临济宗风接四众云臻
  - date: 1656-09-01
    title_zh: 出慧灯语录付梓流通
    rationale: 严大参及同门劝请使有目共睹昙华不于言句咬嚼而向己躬追究
