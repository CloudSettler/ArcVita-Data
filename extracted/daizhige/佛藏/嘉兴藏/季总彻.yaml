    title_zh: 腰包蹑屩入室龙池求印可
    rationale: 慕两浙三吴道望参讫到龙池入室无虚日遂得复印可为金粟亲孙
- id: guji-季总彻-endeavor-2
  title_zh: 江南开堂弘法付梓
  description: 顺治甲午开堂苏州慧灯历盛泽圆明嘉兴如如国福普度等处棒喝交驰语录付梓广流通
