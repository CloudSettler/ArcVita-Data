  - date: 1670
    title_zh: 举三圣兴化公案曲引旁通
    rationale: 为断生死根株，以古人公案应时节，不说糟粕而令自透金刚眼
  - date: 1672-12-31
    title_zh: 允门人编集语录并付梨枣
    rationale: 恐朱紫混淆冒滥丛生，留本分照用以开人天正眼破魔外稠林
