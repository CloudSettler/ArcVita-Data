endeavors:
- id: guji-密云圆悟-endeavor-1
  title_zh: 禹门开堂首振宗风
  summary_zh: 万历丁巳住常州龙池禹门，结制解制上堂勘辨，高峰四句饥餐渴饮接机，全提临济正令
  phases:
  - key: brewing
    name: 禹门结制养众
    labels:
      zh: 蕴酿
    start_date: '1617'
    highlight_event_id: guji-密云圆悟-event-yumen
  - key: breakthrough
    name: 拈香酬恩上堂示众
    labels:
      zh: 突破
    start_date: '1617-05-01'
    highlight_event_id: guji-密云圆悟-event-yumen
  - key: climax
    name: 棒喝交驰望风而靡
    labels:
      zh: 高潮
    start_date: '1618'
    highlight_event_id: guji-密云圆悟-event-yumen
  decisions:
  - date: '1617-05-01'
    title_zh: 万历丁巳四月望日升座拈三瓣香
    rationale: 竖穷三际横遍十方以报佛祖，以祝延圣寿酬幻有法乳，明承嗣正脉不负付托
  - date: '1617-07-01'
    title_zh: 百日解制不立结解
    rationale: 结本非结解亦非解，欲令学人知分晓不以期限取证，直下归家稳坐
- id: guji-密云圆悟-endeavor-2
  title_zh: 历主六大刹付法中兴
  summary_zh: 自通玄金粟黄檗育王再住金粟至天童，八十余员说法，极慈悲极恶辣，付法费隐藏使宗门薪传
  phases:
  - key: brewing
    name: 通玄金粟普施法雨
    labels:
      zh: 蕴酿
    start_date: '1625'
    highlight_event_id: guji-密云圆悟-event-jinsu
  - key: climax
    name: 金粟最盛放出猛虎
    labels:
      zh: 高潮
    start_date: '1630'
    highlight_event_id: guji-密云圆悟-event-jinsu
  - key: closure
    name: 天童踞座付法费隐
    labels:
      zh: 收束
    start_date: '1641'
    highlight_event_id: guji-密云圆悟-event-tiantong
  decisions:
  - date: '1630'
    title_zh: 金粟七载冬制放出猛虎不改父道
    rationale: 以恶辣锻造宗门龙象，使法裔如林振济者皆出自金粟，以续临济慧命
  - date: '1641'
    title_zh: 天童景德全提坐断付嘱费隐
    rationale: 临济再来之望付嫡子，以语录勘辨问答机缘垂后，使圆悟勤下二十世薪传不绝
events:
- id: guji-密云圆悟-event-birth
  title_zh: 诞生
  date: '1566'
  year_of: 1566
  place_zh: 浙江湖州
  description_zh: 明嘉靖四十五年生，俗姓蒋，后参幻有正传得法为其嫡子，号密云圆悟亦称悟上座
- id: guji-密云圆悟-event-yumen
  title_zh: 住常州龙池禹门开堂
  date: '1617-05-01'
  year_of: 1617
  place_zh: 直隶常州龙池山禹门禅院
  description_zh: 万历丁巳四月望日众请上堂，拈香供佛祝圣酬幻有恩，举高峰盘山话头勘辨，饥餐渴饮闲坐困眠中简点纵夺
- id: guji-密云圆悟-event-jinsu
  title_zh: 住嘉兴金粟山广慧极盛
  date: '1630'
  year_of: 1630
  place_zh: 浙江嘉兴金粟山广慧禅寺
  description_zh: 历通玄后主金粟称最盛，侍者七春秋放出一群猛虎，蔡联璧等归敬，黄端伯庚午见语录请说法太白
- id: guji-密云圆悟-event-tiantong
  title_zh: 踞天童景德说法付法
  date: '1641'
  year_of: 1641
  place_zh: 浙江宁波天童山景德禅寺
  description_zh: 居大海之东说法，八十余员多临济裔，棒喝交驰学者无开口处，黄端伯撰序称中兴临济，付法费隐通容
- id: guji-密云圆悟-event-death
  title_zh: 示寂天童语录流通
  date: '1642'
  year_of: 1642
  place_zh: 浙江宁波天童山
  description_zh: 崇祯十五年示寂，全身塔衣钵塔道行碑年谱附语录卷末，弘光乙酉费隐重加考定命较仇刊行
