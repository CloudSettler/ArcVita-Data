  era: 明末清初
  reign_ref: 明神宗万历至明毅宗崇祯
  archetype: 临济中兴之祖
  dilemmas:
  - 棒喝直指与语录文字之辨，既立语录垂后又恐人滞句迷言
  - 操履严峻与六大刹广接之辨，既全提正令坐断十方又须慈悲普施法雨
  lesson: 直下担当不从人得，纵夺杀活全在自家脚跟，棒喝交驰即是慈悲
  summary_first_person: 吾幻有嫡子密云圆悟也，承曹溪正脉三十三世，自禹门开堂历通玄金粟黄檗育王至天童，棒喝交驰重振临济宗风，付法费隐以续慧命，愿后人向自己脚跟下承当莫向言句求
  source_urls:
