endeavors:
- id: guji-密印-endeavor-1
  title_zh: 嗣法破山弘禅楚南
  description: 籍出西蜀嗣传临济正宗三十二世上灵下隐飞锡楚南住洪江回龙禅院及绥宁云栖寺白云山观音庵等处结制上堂棒喝勘验
  phases:
  - key: brewing
    name: 西蜀得法飞锡楚南
    labels:
      zh:
      - 参学
      - 嗣法
    start_date: 1645-01-01
    highlight_event_id: guji-密印-event-hongjiang
  - key: breakthrough
    name: 楚南开堂四众归仰
    labels:
      zh:
      - 开堂
      - 弘化
    start_date: 1661-12-01
    highlight_event_id: guji-密印-event-yunqi
  decisions:
  - date: 1661-12-01
    title_zh: 受请洪江回龙禅院结制上堂
    rationale: 应合山耆旧善长之请结制说法祝圣酬恩树立临济家风
  - date: 1662-01-01
    title_zh: 应请住靖州绥宁波罗山云栖寺
    rationale: 不住一处随缘赴请使漂舟到岸远客还乡绵绵种草不绝
- id: guji-密印-endeavor-2
  title_zh: 寓居广福山集录语录
  description: 寓广福山胜觉寺三十余年上堂小参开示法语颂古山居诗偈门人如暐等编成十二卷不坠破山衣钵
  phases:
  - key: climax
    name: 广福久住说法示后
    labels:
      zh:
      - 住持
      - 说法
    start_date: 1665-01-01
    highlight_event_id: guji-密印-event-guangfu
  - key: closure
    name: 汇编语录垂示将来
    labels:
      zh:
      - 著述
      - 付嘱
    start_date: 1675-01-01
    highlight_event_id: guji-密印-event-guangfu
  decisions:
  - date: 1665-01-01
    title_zh: 久寓广福山胜觉寺不去
    rationale: 安家落业饥餐困眠处处不随风雨转以一山接十方来者
  - date: 1675-01-01
    title_zh: 嘱门人汇集语录赞偈
    rationale: 以语言文字为现前说法示后津梁令后人得其渊源
events:
- id: guji-密印-event-birth
  title_zh: 出生西蜀
  date: 1610-01-01
  year_of: 1610
  description: 籍出西蜀生于明末万历末年左右后参破山得法
- id: guji-密印-event-hongjiang
  title_zh: 顺治十八年住洪江回龙禅院结制上堂
  date: 1661-12-01
  year_of: 1661
  description: 顺治十八年辛丑冬住湖广会同县洪江回龙禅院受合山耆旧请结制升座拈香祝圣说法
- id: guji-密印-event-yunqi
  title_zh: 受请住绥宁波罗山云栖寺
  date: 1662-06-01
  year_of: 1662
  description: 受阔然大德请住湖广靖州绥宁县波罗山云栖寺升座说法示华王狮子座旨
- id: guji-密印-event-guangfu
  title_zh: 寓居广福山胜觉寺三十余年说法
  date: 1665-01-01
  year_of: 1665
  description: 飞锡楚南后寓广福山胜觉寺三十余年上堂小参开示不断语录赞偈汇成一集
- id: guji-密印-event-death
  title_zh: 示寂
  date: 1685-01-01
  year_of: 1685
  description: 于广福山胜觉寺示寂后门人编语录十二卷并塔铭流传
