  - date: '1586-04-01'
    title_zh: 以一身任募刻率土沾恩
    rationale: 慈圣欲发帑金宜令率土沾恩愿以身任事广募立规亲较仇
events:
- id: guji-密藏开-event-birth
  title_zh: 出生
  date: '1563'
  year_of: 1563
  description_zh: 明嘉靖末生颖悟绝人博览群书后剃染为佛子
- id: guji-密藏开-event-vow
  title_zh: 绍兴道中见碑发愿刻藏
  date: '1582'
  year_of: 1582
  description_zh: 万历壬午自补怛天台诣武林绍兴见胜国会稽七副藏板残碑感泣矢志募刻方册流通
- id: guji-密藏开-event-alliance
  title_zh: 槜李得侍达观共盟刻藏
  date: '1585'
  year_of: 1585
  description_zh: 入槜李觐达观老师兼晤冯开之诸公夙愿再来不谋而合共订盟从事
- id: guji-密藏开-event-carving
  title_zh: 五台清凉开刻移板双径寂照
  date: '1586'
  year_of: 1586
  description_zh: 万历丙戌同入京师筹议慈圣知之始于五台清凉亲较仇后议迁双径楞严寂照
- id: guji-密藏开-event-follow
  title_zh: 追随紫柏几二十年
  date: '1590'
  year_of: 1590
  description_zh: 初见对坐三昼夜机锋尽始伏地叩头追随杖履为上首扶正法以刻藏为任
- id: guji-密藏开-event-retreat
  title_zh: 刺血上书遁去
  date: '1603'
  year_of: 1603
  description_zh: 预知紫柏将了圆中自在之偈必及于祸刺血上书一夕隐去让功同门使板有终
- id: guji-密藏开-event-death
  title_zh: 示寂遗稿传世
  date: '1626'
  year_of: 1626
  description_zh: 萧然绝尘蝉蜕世羁遗编多与群公书问刻藏因缘五世孙按指搜辑付梓
