  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E5%AF%86%E8%A1%8C%E5%BF%8D%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.md
endeavors:
- id: guji-密行忍-endeavor-1
  title_zh: 滇蜀行化授戒弘法
  summary_zh: 自梁山得法后行脚滇南蜀地于叙州喜狱及曲靖澄江妙应华藏等地升座授戒以棒喝勘验学人
  phases:
  - key: brewing
    name: 梁山亲近破山得法
    labels:
      zh:
      - 得法亲证
    start_date: 1645-01-01
    highlight_event_id: guji-密行忍-event-dharma
  - key: breakthrough
    name: 初入滇南开堂说法
    labels:
      zh:
      - 入滇开法
    start_date: 1650-01-01
    highlight_event_id: guji-密行忍-event-dian
  - key: climax
    name: 丁酉叙州喜狱升座授戒
    labels:
      zh:
      - 授戒度众
    start_date: 1657-01-01
    highlight_event_id: guji-密行忍-event-xuyu
  - key: closure
    name: 重返滇黔应供作略
    labels:
      zh:
      - 应供收机
    start_date: 1658-01-01
    highlight_event_id: guji-密行忍-event-dian
  decisions:
  - date: 1657-01-01
    title_zh: 应请入叙州喜狱禅院升座授戒
    rationale: 以心为戒摄受四众于火宅尘劳中开解脱路不立一法而普摄文武绅衿
  - date: 1658-01-01
    title_zh: 复入滇南随缘开示不滞一处
    rationale: 以三十年前后见山是山之旨破学人见闻觉知之执令于日用中荐取
- id: guji-密行忍-endeavor-2
  title_zh: 住持衡州开峰传灯续嗣
  summary_zh: 住持衡州开峰南云禅寺及宝庆大悲林建殿上梁结制解制转藏酬恩接引缁素并付嘱法孙编录语录
  phases:
  - key: brewing
    name: 至衡州开峰受请住持
    labels:
      zh:
      - 开峰受请
    start_date: 1659-01-01
    highlight_event_id: guji-密行忍-event-kaifeng
  - key: breakthrough
    name: 大殿上梁开炉建宗
    labels:
      zh:
      - 建殿立宗
    start_date: 1660-01-01
    highlight_event_id: guji-密行忍-event-kaifeng
  - key: climax
    name: 四众请益转藏酬恩
    labels:
      zh:
      - 接机利生
    start_date: 1661-01-01
    highlight_event_id: guji-密行忍-event-kaifeng
  - key: closure
    name: 付嘱法孙编录语录
    labels:
      zh:
      - 传灯付嘱
    start_date: 1665-01-01
    highlight_event_id: guji-密行忍-event-death
  decisions:
  - date: 1660-01-01
    title_zh: 住持开峰拈草建殿立宗旨
    rationale: 于实际理地建琼楼玉殿须是其人方能控佛祖大机活人天正眼
  - date: 1662-01-01
    title_zh: 命法孙明广明珍编录并命石宫代座
    rationale: 使棒喝机用有传续佛慧命不断绝抽衣代座以验后人担当
events:
- id: guji-密行忍-event-birth
  kind: birth
  title_zh: 降生
  date: 1610-01-01
  year_of: 1610
  place_zh: 未详
  summary_zh: 明末降生后出家参学于梁山双桂堂亲近破山海明得法自称寂忍
- id: guji-密行忍-event-dharma
  kind: career
  title_zh: 梁山双桂堂得法
  date: 1645-06-01
  year_of: 1645
  place_zh: 梁山双桂堂
  summary_zh: 亲近破山老和尚当头击碎合不得离不得得传曹溪三十五世临济正宗
- id: guji-密行忍-event-xuyu
  kind: career
  title_zh: 丁酉叙州喜狱升座授戒
  date: 1657-03-01
  year_of: 1657
  place_zh: 四川叙州喜狱禅院
  summary_zh: 丁酉年行化至叙州应文武绅衿请升座拈香祝延拈拄杖示第一义谛传心戒
- id: guji-密行忍-event-dian
  kind: career
  title_zh: 重入滇南曲靖澄江说法
  date: 1658-08-01
  year_of: 1658
  place_zh: 曲靖东山澄江华藏昆明妙应
  summary_zh: 至曲靖东山澄江华藏及妙应寺应陶居士陈居士等请上堂示见山是山三重消息以棒喝勘主宾
- id: guji-密行忍-event-kaifeng
  kind: career
  title_zh: 住持衡州开峰南云禅寺
  date: 1660-02-01
  year_of: 1660
  place_zh: 衡州开峰南云禅寺
  summary_zh: 住持开峰大殿上梁开炉结制解制为杜居士道梁道宁王居士等转藏酬恩传戒说法
- id: guji-密行忍-event-death
  kind: death
  title_zh: 示寂
  date: 1680-01-01
  year_of: 1680
  place_zh: 衡州开峰
  summary_zh: 住山晚年付嘱法孙明广明珍等编录语录四卷示寂后嗣灯续法灯不绝
