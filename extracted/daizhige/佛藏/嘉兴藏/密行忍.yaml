  birth_date: 1610-01-01
  death_date: 1680-01-01
  era: 明末清初
  reign_ref: 清世祖顺治朝
  archetype: 临济正宗禅师
  dilemmas:
  - 以语言文字接引与离语言文字直指之矛盾
  - 以戒律摄众与本无一法可与之两难
  - 行脚四方随缘说法与住山传灯续慧命之抉择
  lesson: 直指心源不在语言而亦不舍语言棒喝杀活皆为令人当阳荐取本来面目
  summary_first_person: 吾密行忍自称寂忍远传临济正宗近嗣双桂破山为曹溪三十五世行化滇蜀湘间住持衡州开峰以棒喝接机以心为戒一生横施逆用只为断学人见闻觉知之执
  source_urls:
