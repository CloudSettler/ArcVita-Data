  decisions:
  - date: 0700-01-01
    title_zh: 居寒岩而不入城
    rationale: 寄语钟鼎虚名无益唯寒山可长保安身修心故绝嚣尘而守幽寂
  - date: 0710-01-01
    title_zh: 以白话偈诗题壁示人
    rationale: 不在词工而在冷提热弄使愚者闻而憬悟故书于石壁厅壁普示村墅僧俗
- id: guji-寒山-endeavor-2
  title_zh: 国清应缘示现文殊
  description: 与拾得丰干相呼应或走或立喃喃独语或咄哉三界轮回闾丘胤礼拜而呵呵走出终不返寺以显菩萨遁迹同类化物
  phases:
  - key: brewing
    name: 厨中取食结缘
    labels:
      zh:
      - 结缘
    start_date: 0712-01-01
    highlight_event_id: guji-寒山-event-temple
  - key: breakthrough
    name: 与拾得丰干相认
    labels:
      zh:
      - 示现
    start_date: 0716-01-01
    highlight_event_id: guji-寒山-event-meet
  - key: climax
    name: 闾丘礼拜呵喝而走
    labels:
      zh:
      - 显圣
    start_date: 0717-01-01
    highlight_event_id: guji-寒山-event-meet
  - key: closure
    name: 后人图写供养流传
    labels:
      zh:
      - 流传
    start_date: 0730-01-01
    highlight_event_id: guji-寒山-event-poem
  decisions:
  - date: 0717-01-01
    title_zh: 拒受净衣香药供养退入岩穴
    rationale: 本托迹贫士不求人知既被物色即隐身不见以全遁迹本怀不使圣迹滞于名相
  - date: 0715-01-01
    title_zh: 以咄哉轮回逆顺示人
    rationale: 有以某身得度即现某身说法或逆或顺自乐其性只为破执不乐以文自见
events:
- id: guji-寒山-event-birth
  title_zh: 寒山诞生
  date: 0680-01-01
  year_of: 680
  description: 不知何许人自古老见之皆谓贫人风狂之士后隐天台寒岩
- id: guji-寒山-event-live
  title_zh: 卜居寒岩
  date: 0700-01-01
  year_of: 700
  description: 隐居唐兴县西七十里寒岩每还国清寺形貌枯悴桦皮为冠布裘破敝木屐履地
- id: guji-寒山-event-temple
  title_zh: 国清长廊唱咏取残食
  date: 0712-01-01
  year_of: 712
  description: 时还国清于食堂取拾得所贮残菜滓长廊徐行叫噪或言咄哉三界轮回僧捉骂打趁而抚掌大笑去
- id: guji-寒山-event-poem
  title_zh: 题诗三百余首于竹木石壁
  date: 0720-01-01
  year_of: 720
  description: 凡所启言洞该玄默出言成章于竹木石壁村墅人家厅壁书文句三百余首后由闾丘胤集为卷
- id: guji-寒山-event-meet
  title_zh: 闾丘胤礼拜灶前大笑走出
  date: 0717-01-01
  year_of: 717
  description: 闾丘胤受丰干指引入厨灶前礼拜寒山拾得把手呵呵大笑云丰干饶舌走出寺归寒岩呼贼而入穴穴自合
- id: guji-寒山-event-hide
  title_zh: 入穴而去迹沈无所
  date: 0735-01-01
  year_of: 735
  description: 使持净衣香药就岩送上高声喝贼退入岩穴报诸人各各努力其穴自合莫可追之
- id: guji-寒山-event-death
  title_zh: 寒山示寂
  date: 0740-01-01
  year_of: 740
  description: 遁迹寒山后人不复见唯诗偈流传国清图写仪轨永劫供养尊为文殊示现
