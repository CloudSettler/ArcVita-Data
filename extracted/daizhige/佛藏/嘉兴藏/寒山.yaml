person:
  qid: guji-寒山
  name_zh: 寒山
  names:
    zh: 寒山
    en: Hanshan
  lifespan:
    birth:
      date: 0680-01-01
      precision: year
      is_circa: true
      raw: 唐初约生传为寒岩贫士
    death:
      date: 0740-01-01
      precision: year
      is_circa: true
      raw: 唐开元末约隐入寒岩穴中去
  birth_date: 0680-01-01
  death_date: 0740-01-01
  era: 唐
  reign_ref: 唐高宗至唐玄宗
  archetype: 隐逸诗僧
  dilemmas:
  - 遁迹寒岩自乐与入寺度世之两难
  - 诗偈工巧与直指开悟之取舍
  - 贫病讥诃与菩萨示现之不辨
  lesson: 以贫狂示人以诗偈醒世不求人知而以悲心度愚
  summary_first_person: 我卜居寒岩绝人往来或入国清厨中取残食长廊叫噪抚掌大笑人谓我风狂我以三百余首题于竹木石壁只为使闻者憬悟生死轮回之苦
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/嘉兴藏/天台三聖詩集和韻.md
  - https://daizhige.org/佛藏/嘉興藏/天台三聖詩集和韻.html
