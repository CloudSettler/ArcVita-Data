    start_date: 0796
    highlight_event_id: guji-寒山子-event-collection
  decisions:
  - date: '0770'
    title_zh: 以贫狂姿入世化物
    rationale: 示同贫士或歌或笑使凡愚不测方能直指三界轮回
  - date: 0795
    title_zh: 喝退闾丘入穴不返
    rationale: 报诸人各各努力不以礼养为念但留诗句令人自悟
events:
- id: guji-寒山子-event-birth
  title_zh: 出生家世不详
  date: '0730'
  year_of: 730
  description: 不知何许人也或云从军豪宕不得志而逃于禅早年游千万里后归寒山
- id: guji-寒山子-event-hanyan
  title_zh: 卜居天台寒岩
  date: '0750'
  year_of: 750
  description: 唐兴县西七十里寒岩卜居桦皮为冠布裘木屐屡见春冬易已三十年
- id: guji-寒山子-event-guoqing
  title_zh: 往来国清契合拾得丰干
  date: '0770'
  year_of: 770
  description: 时还国清寺取拾得竹筒残食长廊唱咏或与牧牛子歌笑僧逐骂打而不动
- id: guji-寒山子-event-poems
  title_zh: 石壁村墅题诗三百余首
  date: 0785
  year_of: 785
  description: 于竹木石壁及村墅人家厅壁书诗言洞玄默清幽冷淡劝善讽世
- id: guji-寒山子-event-collection
  title_zh: 闾丘胤礼访收诗成集
  date: 0795
  year_of: 795
  description: 台州刺史闾丘胤承丰干语亲往礼拜二人喝退归岩乃命道翘收诗集成卷并作赞
- id: guji-寒山子-event-death
  title_zh: 入岩穴隐去莫知所终
  date: 0820
  year_of: 820
  description: 使就岩送衣药高声喝贼退入岩穴云各各努力穴自合拾得迹沉无所
