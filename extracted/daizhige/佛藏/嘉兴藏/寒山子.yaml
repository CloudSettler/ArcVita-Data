person:
  qid: guji-寒山子
  name_zh: 寒山子
  names:
    zh: 寒山子
    en: Hanshan
  lifespan:
    birth:
      date: '0730'
      precision: year
      is_circa: true
      raw: 生年不详唐贞元间已居寒岩约盛中唐之际
    death:
      date: 0820
      precision: year
      is_circa: true
      raw: 入寒岩穴而隐去时莫知所终约中唐以后
  birth_date: '0730'
  death_date: 0820
  era: 唐代
  reign_ref: 唐德宗贞元
  archetype: 隐逸诗僧
  dilemmas:
  - 圣狂之辨遁迹贫士而人谓风狂如何坚守本性
  - 出隐之择超世独坐与入寺化物如何兼行
  - 言默之抉题壁长吟与廓然无言如何会通
  lesson: 居寒守志不逐虚名以诗直指心性劝人向善即是修行
  summary_first_person: 吾不知何许人也卜居天台寒岩往来国清以残饭菜滓为食以竹木石壁为纸题诗三百余篇或歌或笑世谓风狂而吾自乐其志也
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E5%AF%92%E5%B1%B1%E5%AD%90%E8%AF%97%E9%9B%86.html
