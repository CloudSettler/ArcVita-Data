    title_zh: 决计卜居寒岩
    rationale: 寄语钟鼎虚名无益不如寒山可长保故绝人迹而住
  - date: 0780
    title_zh: 守岩不就寺养
    rationale: 时来国清而不久住独回寒岩无人话合同方得自在
