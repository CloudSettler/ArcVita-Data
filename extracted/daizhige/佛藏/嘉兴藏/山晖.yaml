person:
  qid: guji-山晖
  name_zh: 山晖
  names:
    zh: 山晖禅师
    en: Shanhui Chanshi
  lifespan:
    birth:
      date: 1600
      precision: year
      is_circa: true
      raw: 明万历末年约生于灵岩
    death:
      date: 1670
      precision: year
      is_circa: true
      raw: 清康熙初年约寂
  birth_date: 1600
  death_date: 1670
  era: 明末清初
  reign_ref: 明崇祯辛卯至清康熙初
  archetype: 禅宗弘法者
  dilemmas:
  - 绝噬欲究根宗与博极经史淹贯百家之间如何兼顾
  - 孤峻峭拔自守与和光同尘开化黔南俦人之间如何抉择
  - 棒喝直指向上与借老庄孔孟再三开示之间如何施设
  lesson: 以本来各具之圣心开黔南愚陋，接临济正脉而儒释道兼善开圣
  summary_first_person: 我生灵岩，髫年颖悟，绝意世味而穷性命，游学三吴楚蜀，宗天童报恩诸大师，嗣浮石而承临济，辛卯挂锡峨眉，三辟法坛于黔南，住护国兴庆川云长松诸刹，终住荆南开圣，愿众人不失赤子之良，各复本来圣心。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/嘉兴藏/山晖禅师语录.md
  - https://daizhige.org/佛藏/嘉兴藏/山晖禅师语录.html
endeavors:
- id: guji-山晖-endeavor-1
  title_zh: 少年颖悟参学嗣法
  summary: 髫年颖悟薄经生而穷性命，遨游三吴楚蜀，参天童报恩梁山卧龙诸大师，手飞绛雪腹饱玄霜而嗣浮石禅师临济衣钵
  phases:
  - key: brewing
    name: 髫年究宗
    labels:
      zh: 灵岩颖悟
    start_date: 1610
    highlight_event_id: guji-山晖-event-birth
  - key: breakthrough
    name: 游学三吴楚蜀
    labels:
      zh: 遍参诸大师
    start_date: 1622
    highlight_event_id: guji-山晖-event-study
  - key: climax
    name: 嗣法临济
    labels:
      zh: 承浮石报恩衣钵
    start_date: 1628
    highlight_event_id: guji-山晖-event-study
  - key: closure
    name: 辛卯挂锡
    labels:
      zh: 锡挂峨眉声著远迩
    start_date: 1631
    highlight_event_id: guji-山晖-event-emount
  decisions:
  - date: 1622
    title_zh: 绝噬欲游学参方
    rationale: 为究根宗明性命，不滞经生章句，故遍游三吴楚蜀遍参天童报恩诸师
  - date: 1628
    title_zh: 接临济踞席弘宗
    rationale: 万虑皆空一镫独朗已，欲续佛祖慧命，故嗣浮石而任临济纲宗
- id: guji-山晖-endeavor-2
  title_zh: 黔南开圣弘化
  summary: 应王公勋府三辟法坛，住平越护国兴庆瓮安川云黄平长松及荆南开圣，广以老庄孔孟开示俦人，使黔南复见本来圣心
  phases:
  - key: brewing
    name: 入黔初住护国
    labels:
      zh: 平越开堂演法
    start_date: 1631
    highlight_event_id: guji-山晖-event-emount
  - key: breakthrough
    name: 历住诸刹显扬
    labels:
      zh: 兴庆川云长松弘法
    start_date: 1640
    highlight_event_id: guji-山晖-event-abbacy
  - key: climax
    name: 荆南开圣振铎
    labels:
      zh: 开圣禅院三辟法坛
    start_date: 1650
    highlight_event_id: guji-山晖-event-kaisheng
  - key: closure
    name: 门人辑录付梓
    labels:
      zh: 语录十二卷传镫
    start_date: 1660
    highlight_event_id: guji-山晖-event-kaisheng
  decisions:
  - date: 1640
    title_zh: 久住黔南不去
    rationale: 黔南地愚俗陋罕有留期年兴化者，欲如达磨来嵩少般普被群机，故留平越黄瓮久住化众
  - date: 1650
    title_zh: 释而道道而儒开示
    rationale: 俦人蔽锢日深难骤喻宗乘，故广以老庄觉之以孔孟再三开示以指归要道
events:
- id: guji-山晖-event-birth
  type: birth
  title_zh: 降生灵岩髫年颖悟
  date: 1600
  year_of: 1600
  place_zh: 灵岩
  summary: 生于灵岩，髫年颖寤志趣不凡，绝噬欲究根宗，薄经生穷性命，博极经史诗文兼妙
- id: guji-山晖-event-study
  type: career
  title_zh: 游学嗣法承临济宗
  date: 1625
  year_of: 1625
  place_zh: 三吴楚蜀报恩寺
  summary: 遨游三吴楚蜀，宗天童报恩旁及梁山卧龙诸大师之教，供养浮石禅师而接临济衣钵
- id: guji-山晖-event-emount
  type: career
  title_zh: 辛卯挂锡峨眉开堂护国
  date: 1631
  year_of: 1631
  place_zh: 峨眉及平越护国禅院
  summary: 岁辛卯锡挂峨眉远迩欣慕，后应请住平越护国禅院开堂，拈香祝圣棒喝交驰，王公宰官护法毕集
- id: guji-山晖-event-abbacy
  type: career
  title_zh: 历住兴庆川云长松诸刹
  date: 1645
  year_of: 1645
  place_zh: 平越兴庆瓮安川云黄平长松
  summary: 历住兴庆万寿川云圣恩高蓝长松诸禅院，上堂小参晚参机缘法语并施，显扬临济宗旨于黔南
- id: guji-山晖-event-kaisheng
  type: career
  title_zh: 住荆南开圣辑录传镫
  date: 1655
  year_of: 1655
  place_zh: 荆南开圣禅院
  summary: 住荆南开圣禅院振铎，三辟法坛廷师说法，门人如崇龙光等辑上堂小参晚参机缘法语杂偈尺牍十二卷付梓
- id: guji-山晖-event-death
  type: death
  title_zh: 示寂后语录流通黔南
  date: 1670
  year_of: 1670
  place_zh: 荆南开圣禅院
  summary: 示寂后门人福慧等裒集语录，遣龙光走吴越觅善梓登木以公同好，普说拈颂佛事并传于世
