    title_zh: 次劝戒杀放生为津筏
    rationale: 众生递相啖杀生招业冤，莫谓畜生微与人同气血，慈心为生西方之筏
  - date: 1636-01-01
    title_zh: 守安分乐山居终念佛
    rationale: 富贵在天枯荣有命，清闲是真福，物外寄闲身唯念一声佛以待往生
