    rationale: 正法像法已过末法万年念佛坚固，但多提唱宗乘罕及净土，故约以劝往生为要
  - date: 1640-01-01
    title_zh: 以是编付副墨公同志
    rationale: 浊世不可庄语，曼衍浅言以见意，使后学得梯航，捕教翼圣功不可泯
