  dilemmas:
  - 全录法苑珠林则卷帙浩繁难醒世，删繁就简则恐失本意，如何去肉存髓
  - 大劫小劫三灾苦海深重，说者易生怖畏，听者易生怠慢，如何使人知惧而避并发心修行
  lesson: 人生举足皆畏途，三界无安犹如火宅，失今不勉悔遂莫及，唯修行是大利益，以此脱死以此了生
  summary_first_person: 我是武原居士徐昌治，字觐周，备阅玄恽法师法苑珠林，深慨阴阳祸福皆由心造，故删繁就简编辑醒世录，备陈劫量三界六道苦乐果报，愿人见苦知惧，敬佛敬法敬僧，精进行善以自适
  source_urls:
