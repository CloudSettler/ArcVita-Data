  dilemmas:
  - 禅贵直指而文尚藻饰如何使文字即禅而不碍本心
  - 党争牵连屡遭流放如何保全道业不失宗纲
  - 住山领众与云游赋诗交友如何兼顾两全
  lesson: 以禅摄文以文显禅花即是春言下见心则文字皆是禅
  summary_first_person: 吾是筠溪石门沙门德洪字觉范晚号寂音少依真净出家长以诗偈文字演畅禅机虽屡经迁谪而不改其度付门人觉慈编定文字禅三十卷愿后学于语言文字中直见本心
