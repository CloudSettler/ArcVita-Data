  era: 清初
  reign_ref: 清顺治康熙年间
  archetype: 弘法者
  dilemmas:
  - 不立文字与累累语录之间的弘化两难
  - 祝圣报恩与直指人心的宗门家风之间的权衡
  lesson: 去伪存真，去虚存实，直指本地风光，不向闻见卜度
  summary_first_person: 我幼年为僧，少读书，得法于天童费隐容，嗣临济正宗，南来住昆山选佛场，顺治辛丑开堂，后建殿弘化，复渡江北来，以钵付何一，惟愿当人自悟，不落言诠。
