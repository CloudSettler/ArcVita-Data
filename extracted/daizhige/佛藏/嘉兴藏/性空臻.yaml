events:
- id: guji-性空臻-event-birth
  title_zh: 降生
  date: 1612-01-01
  year_of: 1612
  description: 明末降生，自幼为僧，少读书，后嗣天童费隐容为临济三十一世
- id: guji-性空臻-event-1661-kaitang
  title_zh: 顺治辛丑昆山选佛场开堂
  date: 1661-01-01
  year_of: 1661
  description: 钦命正黄旗将军李公等请就昆山选佛场开堂，拈香祝圣，为费隐容酬法乳恩，棒喝交驰立宗旨
- id: guji-性空臻-event-1662-yuandan
  title_zh: 康熙元年元旦祝圣建殿说法
  date: 1662-02-01
  year_of: 1662
  description: 元旦升座祝当今圣躬万岁，建大佛殿韦驮殿落成说法，佛成道浴佛开炉小参机缘拈颂不绝
- id: guji-性空臻-event-beidu-chuanfa
  title_zh: 渡江北来付法何一
  date: 1680-01-01
  year_of: 1680
  description: 一瓶一钵数千里渡江北来，于大梁诸刹中独契何一，解钵授法，何一大阐宗风梓行语录六卷
- id: guji-性空臻-event-death
  title_zh: 示寂
  date: 1700-01-01
  year_of: 1700
  description: 康熙中晚期示寂，门人超晓超自等编语录，毛鹃张发辰作叙，嘉兴藏收录流通
