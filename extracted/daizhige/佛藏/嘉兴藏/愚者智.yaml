  era: 明末清初
  reign_ref: 清圣祖康熙
  archetype: 拈花直指的禅门宗师
  dilemmas:
  - 隐遁岩窦幽栖与出世领众住持之间何去何从
  - 语默言诠俱是葛藤如何以语录传不传之旨而不烧道火
  lesson: 一无所有方能容众有百不缘乃能涉众缘
  summary_first_person: 吾是青原愚者智杖人门下儿孙曾避喧匡庐后应缘住持青原寿昌东苑诸刹以拄杖葛藤接引后学而以语录鼎薪留示丛林
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E9%9D%92%E5%8E%9F%E6%84%9A%E8%80%85%E6%99%BA%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-愚者智-endeavor-1
  title_zh: 住持青原七祖道场
  summary: 甲辰冬应吉州护法之请入主青原祖关拈香升座以家风重振七祖灯焰
  phases:
  - key: brewing
    name: 应请赴青原
    labels:
      zh:
      - 蓄势待发
    start_date: '1664-12-01'
    highlight_event_id: guji-愚者智-event-1
  - key: breakthrough
    name: 祖关拈香升座
    labels:
      zh:
      - 破局立宗
    start_date: '1664-12-15'
    highlight_event_id: guji-愚者智-event-1
  - key: climax
    name: 元旦岁朝举扬纲宗
    labels:
      zh:
      - 高峰弘化
    start_date: '1668-01-01'
    highlight_event_id: guji-愚者智-event-2
  - key: closure
    name: 让院辞众付嘱后来
    labels:
      zh:
      - 功成身退
    start_date: '1670-12-01'
    highlight_event_id: guji-愚者智-event-3
  decisions:
  - date: '1664-12-01'
    title_zh: 受请入主青原
    rationale: 七祖道场久待主人檀护三请不容固辞故以病夫之身直入祖关点破苦心
  - date: '1670-12-01'
    title_zh: 让净居院辞众而退
    rationale: 住持缘尽不如归守本分以拄杖如虫御木随缘而行不与人争住处行处
- id: guji-愚者智-endeavor-2
  title_zh: 巡讲寿昌东苑与语录流通
  summary: 应寿昌廪山东苑诸方之请巡回举扬五位君臣兼中妙旨并付门人编次语录流通
  phases:
  - key: brewing
    name: 寿昌廪山结缘
    labels:
      zh:
      - 行化蓄缘
    start_date: '1668-01-01'
    highlight_event_id: guji-愚者智-event-2
  - key: breakthrough
    name: 寿昌升座宣五位
    labels:
      zh:
      - 机锋破的
    start_date: '1669-06-01'
    highlight_event_id: guji-愚者智-event-2
  - key: climax
    name: 东苑扫塔举扬薪火
    labels:
      zh:
      - 传灯鼎盛
    start_date: '1670-06-01'
    highlight_event_id: guji-愚者智-event-3
  - key: closure
    name: 门人编次语录鼎薪
    labels:
      zh:
      - 著述流通
    start_date: '1670-12-01'
    highlight_event_id: guji-愚者智-event-3
  decisions:
  - date: '1669-06-01'
    title_zh: 赴寿昌廪山东苑巡讲
    rationale: 念老祖磨剑之地不可湮没故随缘拈出柱杖上北斗扫塔举扬以续薪火
  - date: '1670-12-01'
    title_zh: 付门人兴斧编次语录
    rationale: 言默不载之道须借言显故任门人采上堂小参法语汇成一编以示后学
events:
- id: guji-愚者智-event-birth
  date: '1615-01-01'
  year_of: 1615
  type: birth
  title_zh: 诞生
  description: 明末左右诞生后出家参学嗣杖人法脉得青原宗旨
- id: guji-愚者智-event-1
  date: '1664-12-01'
  year_of: 1664
  type: career
  title_zh: 甲辰冬住青原七祖道场
  description: 应吉州护法请入主青原经祖关三门弥勒殿拈香升座拈杖人木行者机缘举扬家风
- id: guji-愚者智-event-2
  date: '1668-01-01'
  year_of: 1668
  type: career
  title_zh: 戊申元旦及寿昌上堂弘化
  description: 于青原元旦上堂示君臣五位复应寿昌楚云东苑诸众请升座宣正中偏兼中到之旨
- id: guji-愚者智-event-3
  date: '1670-12-01'
  year_of: 1670
  type: career
  title_zh: 庚戌让净居院辞众
  description: 十一月初一让净居院举白云端大慧杲语示不住不行之旨拂衣辞众付门人编录
- id: guji-愚者智-event-death
  date: '1682-01-01'
  year_of: 1682
  type: death
  title_zh: 示寂
  description: 晚年退隐后示寂语录与鼎薪一编由门人流通于世黄山正志为之作序
