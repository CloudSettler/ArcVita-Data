    start_date: 1620-11-27
    highlight_event_id: guji-南明慧广-event-death
  decisions:
  - date: 1616-01-01
    title_zh: 立三愿终身退托
    rationale: 自谓德薄福悭不肯轻展枪旗故不出世不作缘事不纳徒众
  - date: 1619-01-01
    title_zh: 焚去门人所录偈颂法语
    rationale: 恐语言文字滋世葛藤不足流传故火之仅存妙用记持万一
events:
- id: guji-南明慧广-event-birth
  date: 1576-10-13
  year_of: 1576
  title_zh: 生于盐官韩氏
  description: 万历丙子十月十三日生父早期亡母姚姓早故依继母吴氏抚养赋性质直龆龀志出家
- id: guji-南明慧广-event-tonsure
  date: 1584-01-01
  year_of: 1584
  title_zh: 兴善礼芹泉剃发
  description: 槜李兴善寺礼芹泉师剃发与朋旧谢绝不茹荤饮历游讲肆后还本寺禅堂掩关
- id: guji-南明慧广-event-awakening
  date: 1608-01-01
  year_of: 1608
  title_zh: 拾纸有省得车溪印可
  description: 听车溪老人下堂开示必垂泪于地上拾片纸见观方知彼去去者不至方句有省呈老人得印可举为首众
- id: guji-南明慧广-event-transmission
  date: 1615-01-01
  year_of: 1615
  title_zh: 径山服勤八载付衣法
  description: 于径山车溪服勤八载老人付衣法偈云得本无所得傅亦无可传今付无传法东西共一天
- id: guji-南明慧广-event-seclusion
  date: 1616-01-01
  year_of: 1616
  title_zh: 掩死关皋亭永庆四载
  description: 掩死关于皋亭永庆寺四载双径皋亭莲居诸处护法请主持皆不允劝闻谷等赴自处孤洁袜不解带二十余年
- id: guji-南明慧广-event-death
  date: 1620-11-27
  year_of: 1620
  title_zh: 泰昌改元坐逝双径
  description: 泰昌改元仲冬示疾嘱后事毕二十七日辰时奄然坐逝茶毗灵骨瘗于双径白云山
