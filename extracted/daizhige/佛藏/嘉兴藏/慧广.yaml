  - date: 1584-01-01
    title_zh: 谢绝朋旧不茹荤饮矢志参学
    rationale: 视世如幻推应院非正行故断俗缘专究禅宗
  - date: 1605-01-01
    title_zh: 启关独谒车溪请益禅要
    rationale: 自疑前关中虚豁落空且信车溪为真师故一见契合求示参究
- id: guji-南明慧广-endeavor-2
  title_zh: 孤洁退藏守道皋亭
  summary: 得法后立三愿不出世不缘事不纳徒掩死关皋亭永庆诲人不倦焚去法语仅存万一
