  dilemmas:
  - 得法最先而了无矜习，鱼鱼然似不能言
  - 乱世继席静明宝林，棒喝峻捷与慈悲接引如何兼顾
  lesson: 渊源有自而不作小小影响，须向无下手处一会虚空消息
  summary_first_person: 我本破山嫡孙丈雪之子，英年荷别传之任，继席汉中静明宝林及云南商山，以棒喝机缘接人，不喜记录，惟愿学者电光中垂手石火里藏身
