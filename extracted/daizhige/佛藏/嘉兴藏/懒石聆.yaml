endeavors:
- id: guji-懒石聆-endeavor-1
  title_zh: 继席汉中静明绍破山丈雪家风
  description: 以丈雪嫡子继开法汉中静明，升座棒喝，四众归仰如归丈雪
  phases:
  - key: brewing
    name: 英年得法韬晦待机
    labels:
      zh:
      - 潜修得法
    start_date: 1645-01-01
    highlight_event_id: guji-懒石聆-event-dharma
  - key: breakthrough
    name: 顺治丙申初住静明
    labels:
      zh:
      - 初住静明
    start_date: 1656-10-15
    highlight_event_id: guji-懒石聆-event-jingming
  - key: climax
    name: 升座峻机宗风鼎盛
    labels:
      zh:
      - 棒喝接机
    start_date: 1657-01-01
    highlight_event_id: guji-懒石聆-event-preach
  - key: closure
    name: 功成转席宝林
    labels:
      zh:
      - 转席交替
    start_date: 1663-01-01
    highlight_event_id: guji-懒石聆-event-baolin
  decisions:
  - date: 1656-10-15
    title_zh: 应请住持静明不辞劳
    rationale: 丈雪开法汉中后扫塔天童须人继席以续破山一条棒故承当
  - date: 1657-01-15
    title_zh: 升座峻机不放丝毫
    rationale: 电光石火中垂手须截断知解令学人直下荐取故用棒喝
- id: guji-懒石聆-endeavor-2
  title_zh: 住持宝林商山结录流通
  description: 转住宝林再住云南商山，语句不喜记录而门人海瑞录存语录四卷
  phases:
  - key: brewing
    name: 癸卯元旦应请宝林
    labels:
      zh:
      - 再转法席
    start_date: 1663-01-01
    highlight_event_id: guji-懒石聆-event-baolin
  - key: breakthrough
    name: 宝林拈香祝圣开堂
    labels:
      zh:
      - 开堂展化
    start_date: 1663-02-01
    highlight_event_id: guji-懒石聆-event-baolin
  - key: climax
    name: 南滇商山弘化
    labels:
      zh:
      - 南滇弘化
    start_date: 1665-01-01
    highlight_event_id: guji-懒石聆-event-shangshan
  - key: closure
    name: 门人录语序文流通
    labels:
      zh:
      - 语录流通
    start_date: 1659-06-01
    highlight_event_id: guji-懒石聆-event-yulu
  decisions:
  - date: 1663-01-01
    title_zh: 转住宝林禅院
    rationale: 静明化缘已毕宝林请席因缘熟故拖犁拽耙再开炉韝
  - date: 1659-06-01
    title_zh: 许门人录语示后
    rationale: 平生不喜记录恐学人认定盘星，今为存渊源正脉令向无下手处会取故付刊
events:
- id: guji-懒石聆-event-birth
  type: birth
  title_zh: 明末降生
  date: 1615-01-01
  year_of: 1615
  place_zh: 中国
  description: 明末万历末天启间生，英睿少年出家参破山下丈雪得法最先
- id: guji-懒石聆-event-dharma
  type: career
  title_zh: 嗣法丈雪为破山嫡孙
  date: 1648-01-01
  year_of: 1648
  place_zh: 汉中
  description: 荷别传之任为丈雪真子，鱼鱼然似不能言，望而知为滹沱正派马驹裔苗
- id: guji-懒石聆-event-jingming
  type: career
  title_zh: 顺治丙申住持汉中静明寺
  date: 1656-10-15
  year_of: 1656
  place_zh: 汉中府静明寺
  description: 十月十五日佛殿祖堂拈香祝圣升座，四众归师与其归丈雪无异，机语峻捷快便
- id: guji-懒石聆-event-preach
  type: career
  title_zh: 静明腊八元宵上堂祝圣
  date: 1657-02-01
  year_of: 1657
  place_zh: 汉中府静明寺
  description: 腊八举世尊睹明星，元宵举般若无相，为平西王吴福晋等建盂兰会说法报恩
- id: guji-懒石聆-event-yulu
  type: career
  title_zh: 顺治己亥语录序成
  date: 1659-06-01
  year_of: 1659
  place_zh: 汉中
  description: 了庵刘道开及约庵施博作叙，推为格外提持酷类五祖演丈雪，门人海瑞录四卷
- id: guji-懒石聆-event-baolin
  type: career
  title_zh: 癸卯元旦请住宝林禅院
  date: 1663-01-01
  year_of: 1663
  place_zh: 汉中府宝林禅院
  description: 自静明转席宝林，三门佛殿方丈拈香上堂，举普眼见普贤公案示静中一念
- id: guji-懒石聆-event-shangshan
  type: career
  title_zh: 住云南府商山寺
  date: 1665-01-01
  year_of: 1665
  place_zh: 云南府商山寺
  description: 转化南滇住商山寺说法，后语录合刻静明宝林商山三处上堂小参机缘颂古
- id: guji-懒石聆-event-death
  type: death
  title_zh: 康熙初示寂
  date: 1680-01-01
  year_of: 1680
  place_zh: 中国
  description: 化缘毕后示寂，语录四卷流通，学者须向虚空无下手处会其为人
