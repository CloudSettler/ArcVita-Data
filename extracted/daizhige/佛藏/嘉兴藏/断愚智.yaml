  decisions:
  - date: 1664-12-15
    title_zh: 当阳露一斑拈拂直指
    rationale: 借夺人不夺境等四料简全提灵山拈花之意，不立文字直指人心
  - date: 1670-08-15
    title_zh: 付门人编录语录
    rationale: 以颂古颂偈自赞行实示后昆，令抽钉拔楔转凡成圣
events:
- id: guji-断愚智-event-birth
  title_zh: 诞生
  date: 1630
  year_of: 1630
  description: 明末生，家世生卒不详，诞日后受众檀庆诞设斋
- id: guji-断愚智-event-inherit
  title_zh: 亲炙永正得法嗣承
  date: 1660
  year_of: 1660
  description: 座下亲炙磨光一二十秋，得骨得髓为永正堕地狮儿，承断桥伦至普明用临济正传
- id: guji-断愚智-event-preach
  title_zh: 康熙甲辰腊月望日升座
  date: 1664-12-15
  year_of: 1664
  description: 众檀护请升座，拈四宾主四夺人境等公案，拈拂卓杖杀活纵横接众
- id: guji-断愚智-event-teach
  title_zh: 退庵示众小参机缘
  date: 1665-06-15
  year_of: 1665
  description: 端阳除夕佛诞示众，举世尊拈花达磨付法六祖无头尾物等，转山河国土归自己
- id: guji-断愚智-event-record
  title_zh: 语录编成真本作序
  date: 1670-08-15
  year_of: 1670
  description: 嗣法门人机轮等编为上下卷，瓶山法弟真本项谦于康熙庚戌仲秋作序刊行
- id: guji-断愚智-event-death
  title_zh: 示寂
  date: 1685
  year_of: 1685
  description: 清康熙年间示寂，行实付震泽普茶行脚因缘，塔铭不详
