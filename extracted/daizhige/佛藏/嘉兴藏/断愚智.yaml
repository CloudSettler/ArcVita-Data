  dilemmas:
  - 严持戒律若冰霜与杀活纵横超脱自在如何并行
  - 竭忠辅佐祖纲与不蹈袭旧径自出机杼如何兼顾
  lesson: 直指人心见性成佛，杀活纵横而不离戒律本源
  summary_first_person: 我是退庵断愚智，永正老人座下亲炙一二十秋，得骨得髓，蒙嘱以严持戒律辅祖纲，退居接众，升座示众，抽钉拔楔，夺食驱耕，门人集为语录以续临济正传
