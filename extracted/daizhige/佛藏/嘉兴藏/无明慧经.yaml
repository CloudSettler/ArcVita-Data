person:
  qid: guji-无明慧经
  name_zh: 无明慧经
  names:
    zh: 无明慧经
    en: Wuming Huijing
  lifespan:
    birth:
      date: 1548
      precision: year
      is_circa: false
      raw: 明嘉靖二十七年
    death:
      date: 1618
      precision: year
      is_circa: false
      raw: 明万历四十六年
  birth_date: 1548
  death_date: 1618
  era: 明代
  reign_ref: 明神宗万历
  archetype: 宗门中兴者
  dilemmas:
  - 见处圆明与行处孤硬如何兼全
  - 宗风寥绝时草草传授与辣手钳锤如何取舍
  lesson: 行解相应方能担荷佛祖大事孤硬践履始可中兴宗风
  summary_first_person: 我是无明慧经，号无明，住寿昌，人称寿昌古佛，正嘉以后禅道中绝，我从庐山发悟，于五台印法，住山三十年，戴笠披蓑，与黄牛白牯同事，单提向上一路，全提正令，不许学人转身通气，只贵直下承当，以悟为期。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E5%AF%BF%E6%98%8C%E6%97%A0%E6%98%8E%E5%92%8C%E5%B0%9A%E8%AF%AD%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E5%AF%BF%E6%98%8C%E6%97%A0%E6%98%8E%E5%92%8C%E5%B0%9A%E8%AF%AD%E5%BD%95.md
endeavors:
- id: guji-无明慧经-endeavor-1
  person_id: guji-无明慧经
  title_zh: 庐山发悟五台印法重立江西宗旨
  summary_zh: 正嘉以来禅道中绝之际，从庐山发悟，于五台印法，确立寿昌宗旨，为曹洞中兴之始。
  phases:
  - key: brewing
    name: 正嘉末流参访求道
    labels:
      zh:
      - 求道
      - 参访
    start_date: 1565
    highlight_event_id: guji-无明慧经-event-birth
  - key: breakthrough
    name: 庐山发悟见地圆明
    labels:
      zh:
      - 开悟
      - 见地
    start_date: 1585
    highlight_event_id: guji-无明慧经-event-wu
  - key: climax
    name: 五台印法全提正令
    labels:
      zh:
      - 印法
      - 立宗
    start_date: 1590
    highlight_event_id: guji-无明慧经-event-wu
  - key: closure
    name: 江西宗旨始立四方归仰
    labels:
      zh:
      - 立宗
      - 化众
    start_date: 1595
    highlight_event_id: guji-无明慧经-event-zhushan
  decisions:
  - date: 1585
    title_zh: 不取偏枯孤硬践履以证圆明
    rationale: 眼足偏枯不能担荷大事，须见处圆明行处剿截，住山苦行以验真参
  - date: 1590
    title_zh: 末后印法于五台单提向上一路
    rationale: 初悟须得真师印可，全提正令，方能建立宗旨，续德山临济之堂奥
- id: guji-无明慧经-endeavor-2
  person_id: guji-无明慧经
  title_zh: 住山三十年峨峰升堂说法育人
  summary_zh: 悟后住山三十年，戴笠披蓑，牵犁拽钯，初住峨峰升堂说法，把住咽喉，辣手接引云门黄檗径山天童诸老。
  phases:
  - key: brewing
    name: 住山苦行与牛牯同事
    labels:
      zh:
      - 苦行
      - 操履
    start_date: 1590
    highlight_event_id: guji-无明慧经-event-zhushan
  - key: breakthrough
    name: 初住峨峰升堂拈香说法
    labels:
      zh:
      - 住持
      - 上堂
    start_date: 1600
    highlight_event_id: guji-无明慧经-event-efeng
  - key: climax
    name: 把住咽喉钳锤饱参弟子
    labels:
      zh:
      - 接引
      - 锤炼
    start_date: 1605
    highlight_event_id: guji-无明慧经-event-efeng
  - key: closure
    name: 语录流通寿昌之风大播
    labels:
      zh:
      - 著述
      - 传法
    start_date: 1615
    highlight_event_id: guji-无明慧经-event-death
  decisions:
  - date: 1600
    title_zh: 以悟为期拼三生大事不许草草传授
    rationale: 近代宗师草草传授末流交识，须拼身命尽力匡扶，自他兼利，饱参方许出世
  - date: 1605
    title_zh: 拈提教外别传不函盖截断众流
    rationale: 大道离微疏久，须大用现前，金刚宝剑据实举论，定丛林是非，验学者得失
