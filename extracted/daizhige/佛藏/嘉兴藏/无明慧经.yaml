  date: 1595
  year_of: 1595
  place_zh: 寿昌
  summary_zh: 悟道之后住山三十年，戴笠披蓑，与黄牛白牯同事，示徒凡行处不孤硬者必见处带廉纤。
- id: guji-无明慧经-event-efeng
  person_id: guji-无明慧经
  type: career
