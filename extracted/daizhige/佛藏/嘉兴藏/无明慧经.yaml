  date: 1602
  year_of: 1602
  place_zh: 峨峰
  summary_zh: 初住峨峰升堂，拈香祝圣，论教外别传经中玄旨，首座拈问同别，示以庭下虚空说法，门人元来集为语录卷上。
- id: guji-无明慧经-event-death
  person_id: guji-无明慧经
  type: death
  title_zh: 万历四十六年圆寂
  date: 1618
  year_of: 1618
  place_zh: 寿昌
  summary_zh: 明万历四十六年圆寂，诸方尊为寿昌古佛，云门黄檗径山天童诸大老皆闻风而起，门人集语录流通。
