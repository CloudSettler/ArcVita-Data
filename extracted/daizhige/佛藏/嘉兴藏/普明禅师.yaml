endeavors:
- id: guji-普明禅师-endeavor-1
  title_zh: 设牧牛十图颂明调心次第
  summary: 自未牧至双泯立十节以牛喻心以牧童喻行人示渐调渐伏直至人牛不见之旨
  phases:
  - key: brewing
    name: 睹劣性未牧
    labels:
      zh: 未牧生狞咆哮
    start_date: '1085-01-01'
    highlight_event_id: guji-普明禅师-event-song1
  - key: breakthrough
    name: 初调受制回首
    labels:
      zh: 穿鼻加鞭步步随
    start_date: '1092-01-01'
    highlight_event_id: guji-普明禅师-event-song1
  - key: climax
    name: 驯伏无碍任运
    labels:
      zh: 放去收来得自然
    start_date: '1098-01-01'
    highlight_event_id: guji-普明禅师-event-song1
  - key: closure
    name: 相忘独照双泯
    labels:
      zh: 人牛不见万象空
    start_date: '1102-01-01'
    highlight_event_id: guji-普明禅师-event-song1
  decisions:
  - date: '1095-01-01'
    title_zh: 以牛喻心立十颂
    rationale: 初机不见心牛故假黑云谷口犯苗等象使人寻踪调伏有階可践
  - date: '1102-01-01'
    title_zh: 终以双泯收束不立胜境
    rationale: 恐学者滞留独照重关故示明月光寒野花芳草自丛丛以显端的
- id: guji-普明禅师-endeavor-2
  title_zh: 唱大地一牛普明宗旨
  summary: 直指尽大地是一头牛何处更有佛与众生本是如如破一体分别之见
  phases:
  - key: brewing
    name: 拈普明一牛
    labels:
      zh: 大地是牛本如如
    start_date: '1100-01-01'
    highlight_event_id: guji-普明禅师-event-song2
  - key: breakthrough
    name: 破黑白雄雌分别
    labels:
      zh: 若道有异即成二
    start_date: '1105-01-01'
    highlight_event_id: guji-普明禅师-event-song2
  - key: climax
    name: 施鞭喝脱皮毛
    labels:
      zh: 拈椎竖拂行棒喝
    start_date: '1108-01-01'
    highlight_event_id: guji-普明禅师-event-song2
  - key: closure
    name: 示火里木牛耕白雪
    labels:
      zh: 重关已破问向上
    start_date: '1112-01-01'
    highlight_event_id: guji-普明禅师-event-song2
  decisions:
  - date: '1105-01-01'
    title_zh: 直指人心不留佛与众生之隔
    rationale: 承祖师西来见性成佛之意使人不向外觅佛即此牛全体是道
  - date: '1112-01-01'
    title_zh: 以圆相拂子勘向上事
    rationale: 地重关破后更须透向上故打圆相云火里木牛耕白雪以绝余执
events:
- id: guji-普明禅师-event-birth
  date: '1050-01-01'
  year_of: 1050
  title_zh: 诞生
  description: 生年籍贯未详云栖付梓序云未详何许人亦不知道场之所
- id: guji-普明禅师-event-song1
  date: '1100-01-01'
  year_of: 1100
  title_zh: 作牧牛图颂十首
  description: 自未牧生狞头角至双泯人牛不见立十颂每颂四句示调心全程后世诸师递相和附
- id: guji-普明禅师-event-song2
  date: '1108-01-01'
  year_of: 1108
  title_zh: 开示普明一头牛
  description: 咄尽大地是普明一头牛毫厘不隔本是如如吃他水草良多历三玄五位九十六圆相以显机用
- id: guji-普明禅师-event-death
  date: '1120-01-01'
  year_of: 1120
  title_zh: 示寂
  description: 卒年行状未详图颂并序流传于世明清间莲池严居士等合刻诸家和颂流通
