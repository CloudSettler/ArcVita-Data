endeavors:
- id: guji-普门显-endeavor-1
  title_zh: 继席振宗禅寺举扬宗风
  summary_zh: 康熙壬子应忠南缙绅四众请住振宗，祝圣拈香，棒喝接众，因斋庆祝
  phases:
  - key: brewing
    name: 侍铁壁得法
    labels:
      zh:
      - 侍立白岩
      - 监院宝圣
    start_date: 1665-01-01
    highlight_event_id: guji-普门显-event-birth
  - key: breakthrough
    name: 奉记莂入院振宗
    labels:
      zh:
      - 入院上堂
      - 据令而行
    start_date: 1672-05-08
    highlight_event_id: guji-普门显-event-zhenzong
  - key: climax
    name: 佛诞浴佛普施甘霖
    labels:
      zh:
      - 浴佛庆祝
      - 龙象云集
    start_date: 1672-05-08
    highlight_event_id: guji-普门显-event-zhenzong
  - key: closure
    name: 解制腊八说戒示众
    labels:
      zh:
      - 解制说戒
      - 尽大地禅床
    start_date: 1673-12-01
    highlight_event_id: guji-普门显-event-zhenzong
  decisions:
  - date: 1672-05-08
    title_zh: 不负先师记莂住持治平继兹院事
    rationale: 郡侯缙绅不忘先师托付，特迎山野，光辉法门，因斋庆祝
  - date: 1673-12-01
    title_zh: 以拂杖卓地直指变迁中不属变迁者
    rationale: 恐后学厌膏粱啖糠秕，故举明星悟道和泥合土之旨以警发
- id: guji-普门显-endeavor-2
  title_zh: 住昙华聚云接众编录语录
  summary_zh: 住桐柏昙华及聚云，问答机缘，普说小参法语，书记性胤编录上下卷
  phases:
  - key: brewing
    name: 住聚云应机
    labels:
      zh:
      - 县尹问三宝
