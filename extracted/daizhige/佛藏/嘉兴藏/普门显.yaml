person:
  qid: guji-普门显
  name_zh: 普门显
  names:
    zh: 普门显
    en: Pumen Xian
  lifespan:
    birth:
      date: 1640
      precision: circa
      is_circa: true
      raw: 生年未详，康熙年间已住持，约推明末清初
    death:
      date: 1712
      precision: circa
      is_circa: true
      raw: 卒年未详，康熙戊子序时尚在世
  birth_date: 1640
  death_date: 1712
  era: 清
  reign_ref: 康熙
  archetype: 禅宗住持
  dilemmas:
  - 禅定幽深难窥，语言文字既不可执又不可废
  - 弢光晦焰不求闻达与婆心饶舌接引后学之两难
  lesson: 借语言警发性灵，于有言处悟无言，还归灵明不昧本原
  summary_first_person: 吾普门显，嗣庆忠铁壁之法，为临济下世，住振宗及昙华，举拂竖杖，示无位真人，愿众生于无言中求有言，于有言处悟无言
