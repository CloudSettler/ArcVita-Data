    highlight_event_id: guji-普门显-event-juyun
  - key: breakthrough
    name: 昙华开堂佐国祈丰
    labels:
      zh:
      - 拈香祝圣
      - 保境祈丰
    start_date: 1675-11-01
    highlight_event_id: guji-普门显-event-tanhua
  - key: climax
    name: 华严千佛法筵大集
    labels:
      zh:
      - 华严期会
      - 千佛道场
    start_date: 1676-06-01
    highlight_event_id: guji-普门显-event-tanhua
  - key: closure
    name: 示众付嘱成录
    labels:
      zh:
      - 普说小参
      - 示唯字法语
    start_date: 1708-01-15
    highlight_event_id: guji-普门显-event-tanhua
  decisions:
  - date: 1675-11-01
    title_zh: 国运重新之际举扬法化愿戎马息
    rationale: 感圣恩安期护众保境祈丰，只得因斋庆祝以祝主圣臣良
  - date: 1708-01-15
    title_zh: 偶尔饶舌逗漏圆通景象以示后学
    rationale: 虑后学舍精髓饰皮毛，望龙象于无言中求有言，故不惮婆心
events:
- id: guji-普门显-event-birth
  date: 1640
  year_of: 1640
  title_zh: 诞生
  description_zh: 生年未详，世胄出身，龆龄出家，慧焰发桐山，嗣铁壁
  is_circa: true
- id: guji-普门显-event-death
  date: 1712
  year_of: 1712
  title_zh: 示寂
  description_zh: 卒年未详，康熙戊子后示寂，塔铭未见，语录上下卷行世
  is_circa: true
- id: guji-普门显-event-zhenzong
  date: 1672-05-08
  year_of: 1672
  title_zh: 康熙壬子佛诞住振宗禅寺入院上堂
  description_zh: 忠南缙绅四众请住振宗，拈香酬铁壁法乳，竖拄杖棒喝，浴佛日祝景运升平
- id: guji-普门显-event-juyun
  date: 1674-03-01
  year_of: 1674
  title_zh: 住聚云答汤县尹三宝棒用之问
  description_zh: 竖指据实答三宝，辨家师有时用棒有时不用，或乘狮子或驾象王
- id: guji-普门显-event-tanhua
  date: 1675-11-01
  year_of: 1675
  title_zh: 康熙乙卯仲冬住桐柏昙华禅院上堂
  description_zh: 众净信请住昙华，拈香祝当今万岁太子千秋，掷拄杖愿四方戎马息普天贺升平
