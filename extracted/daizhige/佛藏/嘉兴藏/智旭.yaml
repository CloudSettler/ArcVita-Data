  title_zh: 撰成华严经颂及入法界颂
  description: 作大方广佛华严经颂并序自世主妙严至入法界及普贤行愿并述文殊德云海云善财五十三参以颂显法界全体
- id: guji-蕅益智旭-event-death
  date: 1655-01-28
