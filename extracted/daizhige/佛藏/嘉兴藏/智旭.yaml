  title_zh: 生于古吴钟氏家
  description: 明万历二十七年四月初八生于吴县后出家名智旭号蕅益菩萨沙弥
- id: guji-蕅益智旭-event-1
  date: 1633-09-15
  year_of: 1633
  title_zh: 癸酉秋菰城论禅教
  description: 过菰城季清程居士家遇雪庭禅师论教家不信禅如取纲无纲因应以禅教互为纲领根本枝叶花果之说
