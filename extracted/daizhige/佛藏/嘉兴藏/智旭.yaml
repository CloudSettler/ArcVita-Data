  year_of: 1636
  location_zh: 九华山
  description_zh: 持大悲咒二百七十堂疗恶疟渐愈后然臂三炷愿阅藏无障字字明解开顿悟门摧邪幢
- id: guji-智旭-event-fanwang
  title_zh: 完梵网合注然香回向
  date: 1637-03-07
  year_of: 1637
  location_zh: 九华山
  description_zh: 丁丑三月初七合注梵网心地品成然臂二十一炷上供卢舍那弥陀地藏下为父母师友檀越法界众生回向同证菩提
- id: guji-智旭-event-miedingye
