  date: 1637-09-08
  year_of: 1637
  location_zh: 九华山道场
  description_zh: 自丁丑五月十七至九月初八结坛百日专持灭定业真言圆满然臂忏十恶求三业清净回向铜殿占察及山中助缘众友
- id: guji-智旭-event-death
  title_zh: 示寂
  date: 1655
  year_of: 1655
  location_zh: 灵峰
  description_zh: 清顺治十二年示寂世寿五十七僧腊三十二后尊为净土宗第九祖著述成绝余编灵峰宗论等
