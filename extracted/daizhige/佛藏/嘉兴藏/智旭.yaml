    title_zh: 应雪庭立禅教互为纲领
    rationale: 教家不信有禅固惑禅士弃教亦惑故立禅是教之纲教是禅之纲以救末世分两途之弊
  - date: 1651-02-04
    title_zh: 捏糍团作胡饼广设问答
    rationale: 人罕知荐取昧者谓尚是教意故更作胡饼疗呱呱之泣直指毕竟是宗是教不容拟议
