  lesson: 守得破院淡泊耐得六年冰雪方能荷担大法曲尽逶迤而直达家园
  summary_first_person: 我是上饶傅氏子智訚号雪关八岁丧父母依景德寺传公为童子梦观音摩顶而泛览群书见坛经火烧海底句而疑乃参博山来公究船子藏身公案见磨鼻有省掩关六载彻源底而得雪关之名初住瀛山破院继席博山又结制鼓山弘法虎跑重建妙行三十一夏后微笑而逝
  source_urls:
