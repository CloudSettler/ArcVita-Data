events:
- id: guji-智訚-event-birth
  date: 1585-09-01
  year_of: 1585
  title_zh: 示生上饶
  description: 万历乙酉年九月初一日生上饶傅氏八岁丧父母依景德寺传公
- id: guji-智訚-event-yingshan
  date: 1629-01-01
  year_of: 1629
  title_zh: 初住瀛山开法
  description: 崇祯己巳初住瀛山古刹作破院歌以自乐郑方水相国请开法
- id: guji-智訚-event-boshan
  date: 1632-04-01
  year_of: 1632
  title_zh: 继席博山开堂
  description: 崇祯壬申四月朔旦住博山开堂明第一义酬法乳之恩往来瀛博提示
- id: guji-智訚-event-gushan
  date: 1632-06-03
  year_of: 1632
  title_zh: 鼓山涌泉结制
  description: 六月初三日入院福州鼓山涌泉寺结制演法玉莹珠回玄风遐播
- id: guji-智訚-event-hupao
  date: 1636-03-01
  year_of: 1636
  title_zh: 虎跑妙行弘化
  description: 丙子春应杭虎跑之请大弘祖道继而妙行请重建经营二载大殿落成
- id: guji-智訚-event-death
  date: 1637-10-11
  year_of: 1637
  title_zh: 示寂瀛山归塔博山
  description: 崇祯丁丑秋示微恙谢院事鼓舟南迈孟冬朔抵瀛山作遗书弹指微笑而逝弟子迎归博山建塔莲花峰西坐三十一夏享年五十有三
