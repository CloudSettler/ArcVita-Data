  location_zh: 京师芦沟广慈寺
  description_zh: 受沈藩及慈圣请北上仅受紫伽黎水晶珠为镇为紫柏解难于京师弘华严楞严念佛三昧士大夫北面者甚众
- id: guji-朗目-event-death
  type: death
  title_zh: 乙巳腊月二十四日端坐示寂
  date: 1605-12-24
  year_of: 1605
  location_zh: 芦沟广慈禅室
  description_zh: 讲楞严至别业同分二妄见罢讲归室以水灌掌跏趺而逝僧腊四十赐金塔于浮渡妙高峰南麓
