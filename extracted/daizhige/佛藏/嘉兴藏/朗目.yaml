- id: guji-朗目-event-tianmu
  type: career
  title_zh: 登天目嗣法兰风
  date: 1590
  year_of: 1590
  location_zh: 天目山
  description_zh: 历参不二大方无尽大庵遍融诸老后登天目以肩柴承当见佛了生死深契兰风得临济金刚王印可
- id: guji-朗目-event-fushan
  type: career
  title_zh: 归浮山五夏建护国大华严寺
  date: 1594-03-15
  year_of: 1594
  location_zh: 浮渡山金谷岩
  description_zh: 万历甲午从六安至合肥由吴应宾迎归金谷戊戌至壬寅赖刘东星奏复金地首尾五夏屹然成护国大华严道场
- id: guji-朗目-event-guangci
