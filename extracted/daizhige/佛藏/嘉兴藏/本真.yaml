  - date: '1661'
    title_zh: 以直截钳锤御众建大殿
    rationale: 宽以御众严以律身施以慈惠接以诚信不容苟且顿脱者众
events:
- id: guji-本真-event-birth
  date: '1620'
  year_of: 1620
  title_zh: 生于楚随州丘姚氏家
  description: 父丘母姚积诚祈嗣感异怀十一月而生
- id: guji-本真-event-ordination
  date: '1638'
  year_of: 1638
  title_zh: 十八投寂光剃发出家
  description: 痛念生死投寂光老宿剃发专好念佛后往三昧律师处圆具
- id: guji-本真-event-awakening
  date: '1649'
  year_of: 1649
  title_zh: 闻高峰真赞脱然出堂跌悟
  description: 闻百年三万六千朝脱然工夫绵密出堂遭跌如半空脱下作偈踏破太虚空
- id: guji-本真-event-transmission
  date: '1652'
  year_of: 1652
  title_zh: 得芙蓉铁关印可嗣法
  description: 问觌体现前叉手顿足描不成对喝蒙嘱当阳显露分付珍重建吾宗
- id: guji-本真-event-abbacy
  date: '1654'
  year_of: 1654
  title_zh: 顺治甲午仲冬初九入院白云
  description: 住蕲州紫云山白云禅寺山门佛殿拈香升座祝圣开堂付祝圣开堂疏
- id: guji-本真-event-building
  date: '1661'
  year_of: 1661
  title_zh: 建大殿成宝坊四众皈向
  description: 仅七载金容殿宇方丈廊庑百废俱兴荆棘丛中成大宝坊直截钳锤化众
- id: guji-本真-event-death
  date: '1691'
  year_of: 1691
  title_zh: 康熙辛未夏跏趺坐逝
  description: 弘法四座道场世寿七十二僧腊五十四塔于本山前麓全录二十卷行世
