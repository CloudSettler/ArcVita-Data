  archetype: 禅宗高僧
  dilemmas:
  - 亲族阻留还俗守产与矢志出家求善知识之间抉择
  - 连不受请甘居苦行与乘时住持中兴古刹之间抉择
  lesson: 守道韫椟不急住持，得法后躬耕淡泊，以行门为佛事，方能格龙天信檀那
  summary_first_person: 吾松江上海潘氏裔，崇祯壬申五月初三生，少好念佛恶腥，年冠父母继丧，散赀出家，参唯一二隐，受具后得法于娄东藕庵，丁未更名机如号古林，不受华藏金明之请，庚戌住吴门莲华，躬耕建殿，编刻师录以报法乳。
  source_urls:
