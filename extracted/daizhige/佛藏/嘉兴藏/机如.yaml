    highlight_event_id: guji-古林如-event-ruyuan
  - key: climax
    name: 躬耕建殿
    labels:
      zh:
      - 以行门为佛事
      - 重光古迹
    start_date: 1671-01-01
    highlight_event_id: guji-古林如-event-ruyuan
  - key: closure
    name: 编录酬恩
    labels:
      zh:
      - 编刻师录
      - 语录流通
    start_date: 1680-02-01
    highlight_event_id: guji-古林如-event-bianlu
  decisions:
  - date: 1670-11-01
    title_zh: 就请唐朝敕建莲华禅院
    rationale: 栽藕多时始见莲，时不可缓义弗敢辞，扶起旧案振颓纲
  - date: 1680-02-01
    title_zh: 编刻藕庵语录及自语四卷同梓
    rationale: 酬嗣法志愿，为学者模范，雨露寰区甄陶后学
events:
- id: guji-古林如-event-birth
  date: 1632-05-03
  year_of: 1632
  title_zh: 诞生于松江上海潘氏
  description: 崇祯壬申午月三日生，母梦摘莲华结实清香，幼好念佛恶腥食，颖悟超群
  place_zh: 松江上海
- id: guji-古林如-event-chujia
  date: 1650-05-08
  year_of: 1650
  title_zh: 顺治庚寅大士诞日投唯一禅师出家
  description: 奉柩合葬祖茔后散赀，投唯一取字道雄，晨夕苦行参究
  place_zh: 玉峰
- id: guji-古林如-event-piti
  date: 1651-01-01
  year_of: 1651
  title_zh: 至流庆庵参二隐披剃名机灵
  description: 越一载自玉峰至流庆庵参二隐和尚披剃，亲炙久之，继往浙中遍叩诸方
  place_zh: 玉峰流庆庵
- id: guji-古林如-event-defa
  date: 1667-01-01
  year_of: 1667
  title_zh: 丁未参娄东藕庵水乳相合付衣拂得法
  description: 乙巳法轮受具后参藕庵，丁未付衣拂更名机如号古林，为临济三十二世
  place_zh: 娄东藕庵
- id: guji-古林如-event-ruyuan
  date: 1670-11-01
  year_of: 1670
  title_zh: 康熙庚戌仲冬入住苏州莲华禅寺
  description: 金墅镇莲华席虚应绅衿公请，山门佛殿据室升座祝圣，躬耕刈草磨麸，十年鼎新大殿
  place_zh: 苏州金墅镇莲华禅寺
- id: guji-古林如-event-bianlu
  date: 1680-02-01
  year_of: 1680
  title_zh: 康熙庚申编刻藕庵语录及自语录四卷
  description: 春编刻本师语录以酬嗣法愿，门人集其上堂小参拈古机缘为四卷同梓，弟子全素等撰传
  place_zh: 苏州莲华禅寺
- id: guji-古林如-event-death
  date: 1690
  year_of: 1690
  title_zh: 康熙后圆寂
  description: 住持莲华后道风播寰区，具体圆寂年月传状未载，附金明介庵供及诸山像赞行实
  place_zh: 苏州莲华禅寺
