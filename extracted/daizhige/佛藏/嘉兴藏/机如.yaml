  decisions:
  - date: 1650-05-08
    title_zh: 散父遗赀飘然出家
    rationale: 不得踪迹源头为善知识不复寓形宇宙，拒亲族阻留
  - date: 1667-01-01
    title_zh: 承藕庵记莂更名古林
    rationale: 问答水乳相合，担荷断桥车溪法脉，拒躐等住持
- id: guji-古林如-endeavor-2
  title_zh: 住持莲华中兴古刹
  summary_zh: 庚戌应请入莲华，躬耕陇亩十年鼎新大殿，举扬宗旨编录流通
  phases:
  - key: brewing
    name: 退隐嘉禾
    labels:
      zh:
      - 辞请
      - 隐修
