  - 深入一门与众善归一如何兼顾
  - 沧桑陵谷入泥入水与澹然虚游如何并行
  - 不立标帜而永绍临济孤峻门庭如何担当
  lesson: 以一身担荷大法深入一门而众善归一廓然平等时行时止纵夺自现
  summary_first_person: 吾十九岁出蜀南游阅讲肆十四载一知西来直指即皈密云老人丁卯至己卯十三载三登九上天童趋侍痛棒热喝得当阳付嘱继通玄弘法五载应禾东塔栖真苕溪终主天童五会说法入泥入水只贵截断函盖一著
  source_urls:
  - https://daizhige.org/佛藏/嘉兴藏/林野奇禅师语录.html
