  dilemmas:
  - 在家奉养老母与出家了生死之间进退两难
  - 广参印可易得与透彻五家宗旨难安之间如何抉择
  lesson: 放下意识强记死透疑情方能彻悟，弘道报恩不忘本源
  summary_first_person: 吾维扬泰兴庄氏子，法名德楷，字柏山。幼奉三宝，壮参觉华竹浪，历彬隐尘仙锤炼，于灵谷彻悟玄要，嗣曹洞三十一世。后住持山西普通华严，弘化汾晋，不负法乳。
