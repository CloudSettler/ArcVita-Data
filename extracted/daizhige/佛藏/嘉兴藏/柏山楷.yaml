    rationale: 护法绅衿两序敦请，当仁不让烹佛镕祖转凡成圣
  - date: 1675
    title_zh: 交龙山为十方禅院
    rationale: 爱山水幽邃可终身，旧住欣然相付，募修禅堂阁藏广度衲子
events:
- id: guji-柏山楷-event-birth
  title_zh: 出生维扬泰兴庄氏
  date: 1629
  year_of: 1629
  location_zh: 扬州泰兴
  description_zh: 父承智母马氏世奉三宝，襁褓见佛像合掌，闻酒鲜即哕，喜趺坐爱念佛声
- id: guji-柏山楷-event-juehua-wudao
  title_zh: 觉华参禅初悟
  date: 1658
  year_of: 1658
  location_zh: 泰兴觉华庵
  description_zh: 谒竹浪和尚参生从何来死从何去，十日棒喝疑团现前，呈偈得印可，三十二岁剃染天宁受具
- id: guji-柏山楷-event-linggu-chewu
  title_zh: 灵谷彻悟嗣曹洞
  date: 1665
  year_of: 1665
  location_zh: 金陵灵谷寺
  description_zh: 依尘仙和尚参藤枯句归何处，闻举五祖语释然，见饭杓落地大悟玄要，嗣觉华竹浪为曹洞三十一世
- id: guji-柏山楷-event-shanxi-hongfa
  title_zh: 住持山西普通华严
  date: 1672-10-15
  year_of: 1672
  location_zh: 山西汾阳普通寺龙山华严院
  description_zh: 康熙壬子秋进院普通，后重兴龙山华严，募修禅堂阁藏，挺身独任解郡牧之难，士庶称古佛
- id: guji-柏山楷-event-death
  title_zh: 跏趺示寂塔本山
  date: 1702-04-18
  year_of: 1702
  location_zh: 汾阳龙山华严
  description_zh: 享年七十四僧腊四十二，饮食如常开示无倦，坦然入室跏趺瞑目，供奉三日颜色如生，塔于本山之右
