  decisions:
  - date: '1662-10-01'
    title_zh: 应请进鹿门院据室升座
    rationale: 鹿门祖地元来养道，须真参实悟，全提直下，使凡圣同餐
  - date: '1664-09-01'
    title_zh: 应柯宋诸护法请住檀溪开荒
    rationale: 檀溪胜景久废，性地本具，须同上善人开荒铲草，重建梵刹，接引四众
events:
- id: guji-梓舟船-event-birth
  title_zh: 蜀地诞生
  date: '1620'
  year_of: 1620
  location_zh: 蜀地
  description_zh: 蜀地生来，后出家参方，自述蜀地生来二十年前参见十余众尊宿
- id: guji-梓舟船-event-canxue
  title_zh: 遍参悟道承法把茅屺山
  date: '1650'
  year_of: 1650
  location_zh: 荆溪保安堂至屺山
  description_zh: 参见十余尊宿皮穿骨髓，末后船子一棒淹杀，承二隐大和尚临济正宗法乳，屺山把茅度岁十余载
- id: guji-梓舟船-event-lumen
  title_zh: 康熙壬寅进鹿门院
  date: '1662-10-01'
  year_of: 1662
  location_zh: 襄阳鹿门山
  description_zh: 壬寅菊月进院，至山门佛殿据室升座，挂云板，举六祖自心是佛，更莫狐疑
- id: guji-梓舟船-event-tanxi
  title_zh: 甲辰秋住檀溪铲棘重兴
  date: '1664-09-01'
  year_of: 1664
  location_zh: 襄阳府檀溪禅寺
  description_zh: 应护法柯元甫宋等请住檀溪，至山门佛殿升座，开荒铲草，建祖师堂禅堂钟楼韦驮殿，上堂小参结制打七，语录由明法等编
- id: guji-梓舟船-event-death
  title_zh: 清初示寂
  date: '1685'
  year_of: 1685
  location_zh: 檀溪
  description_zh: 弘法后圆寂，生死亦不生死亦不死，语录分上堂拈颂行实法语佛事流通
