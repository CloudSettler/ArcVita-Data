  dilemmas:
  - 遍参十余宿未契，如何末后一棒透出生死关
  - 鹿门檀溪荒废已久，如何铲棘开荒重兴祖庭
  - 南北宗分流，如何合一接引凡圣同归性地
  lesson: 自心是佛，直下翻身，荒地即是性地，触目皆真
  summary_first_person: 我蜀地生来，二十年前遍参十余尊宿，末后得船子一棒，屺山把茅十余载，后承二隐大和尚临济正宗法乳，康熙初住鹿门檀溪，铲棘开荒，升座说法，只指自心是佛，愿与大地众生同登般若船。
