    title_zh: 末后向船子请益直下承当
    rationale: 皮穿骨髓不契，须一棒翻身，截断葛藤，方出把茅度岁
  - date: '1652'
    title_zh: 奉二隐大和尚为先师酬法乳
    rationale: 荆溪保安堂上传临济正宗第三十二代，恩毒难忘，对人天前报恩
