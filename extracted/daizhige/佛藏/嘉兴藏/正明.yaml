  - key: climax
    name: 丁丑入院住持密印
    labels:
      zh: 住持中兴
    start_date: 1637
    highlight_event_id: guji-正明-event-abbott
  - key: closure
    name: 接众弘法值际鼎革
    labels:
      zh: 接众弘法
    start_date: 1640
    highlight_event_id: guji-正明-event-death
  decisions:
  - date: 1632
    title_zh: 承师命留守沩山监院
    rationale: 本师决志入燕指付养拙照管不得已承顺师命不敢断绝源流
  - date: 1637
    title_zh: 受大圆请住持密印
    rationale: 再三敦请辞不获已本欲敛迹穷岩为存纳四方来学遂出世接众
events:
- id: guji-正明-event-birth
  date: 1600
  year_of: 1600
  title_zh: 生于山西蒲州
  description: 河东蒲版常禄山仲子母张氏梦异人生贵子不业儒不茹荤作出世想
- id: guji-正明-event-ordination
  date: 1620
  year_of: 1620
  title_zh: 潜别父母普陀剃发
  description: 二十岁梦头陀接引潜别父母至南普陀投天衣如绣师剃发誓明生死日作众务夜礼观音
- id: guji-正明-event-awakening
  date: 1628-12-04
  year_of: 1628
  title_zh: 金粟入室棒下悟道
  description: 崇祯元年十月三十日入室问水桶在何处被密云劈头一棒打破水桶识得根源世出世法合一体
- id: guji-正明-event-weishan
  date: 1631-11-20
  year_of: 1631
  title_zh: 随五峰至沩山结茅
  description: 崇祯四年十月十六日至沩山祖塔同庆寺缚茅栖止对粟而食挥尘论道宗风渐开
- id: guji-正明-event-abbott
  date: 1637-02-02
  year_of: 1637
  title_zh: 丁丑住持密印寺
  description: 崇祯十年正月八日受大圆老宿请入院住大沩密印禅寺升座拈香传曹溪正脉接学人
- id: guji-正明-event-death
  date: 1645
  year_of: 1645
  title_zh: 鼎革前后圆寂
  description: 时当鼎革物力凋残付法后圆寂塔铭称曹溪再来灵祐之统赖以不坠
