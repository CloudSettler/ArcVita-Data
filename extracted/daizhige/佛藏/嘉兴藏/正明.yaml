endeavors:
- id: guji-正明-endeavor-1
  title_zh: 金粟苦参棒下悟道
  description: 二十岁普陀出家苦行二十五谒金粟密云参万法归一挑水入室棒下识根源
  phases:
  - key: brewing
    name: 普陀剃发出家苦行
    labels:
      zh: 出家苦行
    start_date: 1620
    highlight_event_id: guji-正明-event-ordination
  - key: breakthrough
    name: 金粟参究一归何处
    labels:
      zh: 参究话头
    start_date: 1625
    highlight_event_id: guji-正明-event-awakening
  - key: climax
    name: 挑水入室棒下识源
    labels:
      zh: 棒下大悟
    start_date: 1628
    highlight_event_id: guji-正明-event-awakening
  - key: closure
    name: 随侍五峰机锋印可
    labels:
      zh: 印可付嘱
    start_date: 1631
    highlight_event_id: guji-正明-event-weishan
  decisions:
  - date: 1620
    title_zh: 潜别父母普陀出家
    rationale: 动无常想生死念切只要发明本分大事不入讲席经期
  - date: 1625
    title_zh: 扫入学解专看一归何处
    rationale: 见万峰录示语将学得记得扫入东洋大海专看话头放下心境
- id: guji-正明-endeavor-2
  title_zh: 结茅沩山中兴密印
  description: 随五峰西来至沩山祖塔结茅受拂子付嘱丁丑住持密印接学人宗风渐开值鼎革凋残
  phases:
  - key: brewing
    name: 随师西来结茅沩山
    labels:
      zh: 结茅栖止
    start_date: 1631
    highlight_event_id: guji-正明-event-weishan
  - key: breakthrough
    name: 受命监院照管沩山
    labels:
      zh: 受付监院
