  decisions:
  - date: '1443'
    title_zh: 追随无际自贵州至四川复随入京印证
    rationale: 自有主宰不随时流是处则信非处则执务要工夫入手到京印证
  - date: '1444'
    title_zh: 当阳求关房立誓以悟为期
    rationale: 呈似功夫到湛不摇犹是识阴静想要透大解脱门故去坐凳不近墙壁昼夜经行倚立炼磨睡魔
  - date: '1450'
    title_zh: 三间茅屋追慕百丈付无字念佛话头
    rationale: 不立门户不学今时体态只贵真参实究证到古人田地诫得入头切忌弄虚头为人师须保养圣胎待龙天推出
