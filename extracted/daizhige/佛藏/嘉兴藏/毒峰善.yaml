  decisions:
  - date: '1436'
    title_zh: 初谒源明便领无字公案精进参究
    rationale: 禀诚信决烈之资闻即信解不堕知解当夜回光返照疑狗子因何无佛性
  - date: '1437'
    title_zh: 发大愿以护道心扫却知解
    rationale: 蒙源明诫扫却知解恐卒便开口无受用故发愿若退失道心远离话头生害脱皮癞死堕无间以自策励
  - date: '1440'
    title_zh: 不看经教专做拍盲钝工夫
    rationale: 信无际老师少年拍盲做钝后大悟之说只要做个出世好人不以闲学解埋没祖师心
- id: guji-毒峰善-endeavor-2
  person_qid: guji-毒峰善
  title_zh: 入川行脚荆门悟境关房苦行弘化
  description_zh: 正统八年二十五岁自贵州入川参无际正统九年随诏入京荆门道中行路如飞浑然无字一片当阳清溪寺入关不设卧床礼佛千二百拜立誓不坐不近墙壁辽空经行后住茅屋以头陀家风普说示众付念佛无字话头诫保养圣胎
