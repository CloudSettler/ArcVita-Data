- id: guji-毒峰善-endeavor-1
  person_qid: guji-毒峰善
  title_zh: 少年出家专参无字公案立誓不退
  description_zh: 十七岁出家谒源明和尚得赵州无字公案当夜提撕反覆生疑发大誓愿若退道心远离话头当堕无间断尽世缘五阴执着得胸次空荡静相现前专以坐禅持戒为本不慕经教知解
