    highlight_event_id: guji-沈士荣-event-juanshang
  decisions:
  - date: 1375-04-01
    title_zh: 就职翰林不废内学
    rationale: 以为穷心性之原即是至善之地居馆阁亦当体佛理以观孔道方能益加详慎于性理之学
  - date: 1385-07-01
    title_zh: 明大忠大孝以解逃亲之谤
    rationale: 以大船救父为喻明出家乃方便救度群生出离生死之大孝故当为执迹者详辩其本怀
events:
- id: guji-沈士荣-event-birth
  title_zh: 生于建安
  date: 1335-01-01
  year_of: 1335
  description_zh: 约元末生于福建建安少力学于儒而留心内典为后日会通之基
- id: guji-沈士荣-event-hanlin
  title_zh: 任翰林院待诏
  date: 1375-04-01
  year_of: 1375
  description_zh: 明初入翰林为待诏以文翰供奉而究心性之学睹士流惑于排佛旧闻遂发辩护之愿
- id: guji-沈士荣-event-preface
  title_zh: 洪武乙丑季夏作原教论序
  date: 1385-07-01
  year_of: 1385
  description_zh: 于建安自序言二教相违久矣智者默然故著论三篇解五篇辩六篇通十四篇以决择去取
- id: guji-沈士荣-event-juanshang
  title_zh: 续原教论卷上卷下成
  date: 1385-07-15
  year_of: 1385
  description_zh: 卷上明原教观心内教外教执迹参禅近理诸义卷下明名儒好佛自私庄老三教人物诸义指归一心
- id: guji-沈士荣-event-death
  title_zh: 明初卒
  date: 1402-01-01
  year_of: 1402
  description_zh: 明初约卒于建安其书收入嘉兴藏流传后世为儒佛会通之证
