  decisions:
  - date: 1384-03-01
    title_zh: 具录非斥之言
    rationale: 不隐恶言方能逐条解惑使读者了然不疑故全录程朱及唐宋诸儒排佛之语于前
  - date: 1385-07-01
    title_zh: 以得本忘末立宗
    rationale: 以人心道心未发之中为宗本会易庸与禅观之理故能破执迹迷真之失而显殊途同归之义
- id: guji-沈士荣-endeavor-2
  title_zh: 任翰林待诏守名教
  summary_zh: 居翰林以文儒自任而护内学劝善戒恶以助名教不使学者循习旧闻丧家珍而伤根本
  phases:
  - key: brewing
    name: 建安力学养望
