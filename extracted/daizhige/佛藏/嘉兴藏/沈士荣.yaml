  lesson: 得本忘末不为迹惑研穷心性之原则殊途同归无彼此之间
  summary_first_person: 我是建安沈士荣忝任翰林待诏伏念儒佛相违数百年毁赞不常至道不明遂不自揆度录其所非斥之言而辩解于后著原教论及解辩通诸篇欲使学者不惑于权迹而直悟一心以全忠孝大义
