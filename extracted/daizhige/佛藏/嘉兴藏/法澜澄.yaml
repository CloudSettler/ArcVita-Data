person:
  qid: guji-法澜澄
  name_zh: 法澜澄
  names:
    zh: 法澜澄
    en: Falan Cheng
  lifespan:
    birth:
      date: 1630-01-01
      precision: year
      is_circa: true
      raw: 明末约生，生年未详
    death:
      date: 1685-01-01
      precision: year
      is_circa: true
      raw: 清初示寂，卒年未详
  birth_date: 1630-01-01
  death_date: 1685-01-01
  era: 清
  reign_ref: 康熙
  archetype: 中兴禅门宗师
  dilemmas:
  - 宗风废坠而机锋易流于口辩，如何以拈香上堂直指第一义而重振六祖五宗心传
  - 儒释易生毁訾，如何以诚正致知与明心见性合观而内外一贯以化世导俗
  lesson: 蹋着最初一步而受用不尽，以金刀破竹之机锋直截根源，令颓废千年之道场焕然中兴
  summary_first_person: 吾嗣天王海公之法，蒙慈命住持荆州天王，复开堂度门与菩提场，以拄杖拂子直指人心，愿六祖五宗几坠之绪于荆南再振，儒释一贯而众生同入水月光中。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E6%B3%95%E6%BE%9C%E6%BE%84%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E6%B3%95%E6%BE%9C%E6%BE%84%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-法澜澄-endeavor-1
  title_zh: 中兴荆州天王禅寺
  summary_zh: 嗣海公法而于康熙九年进住天王，结制解制，开炉除夕，庆诞浴佛，以上堂拈香机锋接引四众，重建千年颓废丛林。
  phases:
  - key: brewing
    name: 嗣法天王
    labels:
      zh: 天王海公嫡嗣
    start_date: 1665-01-01
    highlight_event_id: guji-法澜澄-event-birth
  - key: breakthrough
    name: 进住天王
    labels:
      zh: 康熙九年进寺升座
    start_date: 1670-02-01
    highlight_event_id: guji-法澜澄-event-tianwang
  - key: climax
    name: 结制弘化
    labels:
      zh: 结制解制佛诞成道
    start_date: 1671-01-01
    highlight_event_id: guji-法澜澄-event-tianwang
  - key: closure
    name: 付嘱辑录
    labels:
      zh: 门人清杲编次语录
    start_date: 1673-08-01
    highlight_event_id: guji-法澜澄-event-yulu
  decisions:
  - date: 1670-02-01
    title_zh: 勉承慈命住持天王
    rationale: 本师竭力中兴之道场不可坠地，虽自谓不肖而藏身无地，犹鞠躬包荒以续法乳之恩
  - date: 1671-06-01
    title_zh: 以一喝三玄接引学人
    rationale: 不落说有说无色空常语，以拄杖夺人夺境截断众流，令人直下知归而见清净法身
- id: guji-法澜澄-endeavor-2
  title_zh: 度门菩提场荆南巡化
  summary_zh: 住当阳度门为住山翁，复于康熙十四年受阖郡护法之请就荆州菩提场开堂，兼化报恩，弘六祖心传于荆南。
  phases:
  - key: brewing
    name: 度门住山
    labels:
      zh: 当阳度门孤峰弘道
    start_date: 1672-01-01
    highlight_event_id: guji-法澜澄-event-dumen
  - key: breakthrough
    name: 语录刊传
    labels:
      zh: 康熙十二年钟山序文
    start_date: 1673-08-01
    highlight_event_id: guji-法澜澄-event-yulu
  - key: climax
    name: 菩提场开堂
    labels:
      zh: 康熙十四年拈衣升座
    start_date: 1675-12-01
    highlight_event_id: guji-法澜澄-event-puti
  - key: closure
    name: 报恩遗化
    labels:
      zh: 荆州报恩机缘偈颂
    start_date: 1676-06-01
    highlight_event_id: guji-法澜澄-event-puti
  decisions:
  - date: 1672-01-01
    title_zh: 入度门示住山本色
    rationale: 秀公北宗是非已绝，不与百城烟水争胜，但以寻常动用明明耀古腾今之真机接人
  - date: 1675-12-01
    title_zh: 应请就菩提场开堂
    rationale: 阖郡护法诸山耆宿送衣请法，为续菩提正脉而拈黄梅夜半之衣，登崚嶒之座而全提宾主句
events:
- id: guji-法澜澄-event-birth
  title_zh: 诞生
  date: 1630-01-01
  year_of: 1630
  precision: year
  is_circa: true
  raw: 明末约生，生年未详
  description_zh: 明末约生，后嗣荆州天王海公之法为嫡嗣，具向上爪牙。
- id: guji-法澜澄-event-tianwang
  title_zh: 进住荆州天王禅寺
  date: 1670-02-01
  year_of: 1670
  precision: month
  is_circa: false
  raw: 康熙九年庚戌二月初一日进寺
  description_zh: 进住天王，拈三瓣香祝圣酬法，上堂以第一义机锋酬唱，示中兴本寺之缘起。
- id: guji-法澜澄-event-yulu
  title_zh: 钟山王才鼎作语录序
  date: 1673-08-01
  year_of: 1673
  precision: month
  is_circa: true
  raw: 康熙十二年岁枉癸丑七月既望
  description_zh: 王才鼎游江陵谒师，读语录如月印万川金刀破竹，叹六祖五宗心传焕然若新而为之序。
- id: guji-法澜澄-event-dumen
  title_zh: 住持当阳度门禅寺
  date: 1672-01-01
  year_of: 1672
  precision: year
  is_circa: true
  raw: 当阳度门禅寺上堂，未系确年
  description_zh: 住山度门，示孤峰万仞鸟道虚玄，令人不须骷髅穿却而目见耳闻皇风圣德。
- id: guji-法澜澄-event-puti
  title_zh: 就荆州菩提场开堂
  date: 1675-12-01
  year_of: 1675
  precision: month
  is_circa: false
  raw: 康熙十四年十二月阖郡送衣请开堂
  description_zh: 拈法衣示黄梅夜半相逢，登菩提座拈拄杖示主中主人，重朗祖灯而证菩提本无树之端的。
- id: guji-法澜澄-event-death
  title_zh: 示寂
  date: 1685-01-01
  year_of: 1685
  precision: year
  is_circa: true
  raw: 清初示寂，卒年未详，附塔记
  description_zh: 行满功圆而后示寂，门人辑机缘入室偈颂佛事塔记以传，语录分上下卷藏于嘉兴藏。
