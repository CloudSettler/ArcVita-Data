endeavors:
- id: guji-法舟济-endeavor-1
  title_zh: 天宁开法提唱本来佛性
  description: 自金陵回止天宁首座寮应众请开法就僧堂设座拈香提唱世尊拈花迦叶微笑及异见王论佛性作用直指眼耳手足处全体现成破斥作贱作贵
  phases:
  - key: brewing
    name: 金陵回止众请开法
    labels:
      zh: 回止天宁
    start_date: 1588-01-01
    highlight_event_id: guji-法舟济-event-tianing-kaifa
  - key: breakthrough
    name: 僧堂设座拈香提唱
    labels:
      zh: 升座提唱
    start_date: 1590-01-01
    highlight_event_id: guji-法舟济-event-tianing-kaifa
  - key: climax
    name: 节腊普说勘验学人
    labels:
      zh: 普说勘验
    start_date: 1592-01-01
    highlight_event_id: guji-法舟济-event-pushuo-chouwen
  - key: closure
    name: 剩语编次流通嘉兴藏
    labels:
      zh: 编次流通
    start_date: 1600-01-01
    highlight_event_id: guji-法舟济-event-songyu
  decisions:
  - date: 1590-01-01
    title_zh: 就僧堂中设座直指佛性
    rationale: 方丈久虚不居方丈而就僧堂设座为显法平等无有高下直截指示本来佛性离名离相
  - date: 1592-01-01
    title_zh: 节腊随缘普说破执
    rationale: 借岁朝涅槃清明浴佛结制解制等机直破涅槃去住光明显现等知见令踏本地风光
- id: guji-法舟济-endeavor-2
  title_zh: 酬问士夫兼开参究念佛方便
  description: 与鹿泉桃村龙溪五台雁湖等士大夫官绅酬问心性用功易理知行梦觉为政之要痛斥认缘影认鬼窟认文字等病兼开一句阿弥陀佛追看念的是谁金刚宝剑斩断妄习
  phases:
  - key: brewing
    name: 士夫参问心性日用
    labels:
      zh: 酬问接引
    start_date: 1593-01-01
    highlight_event_id: guji-法舟济-event-pushuo-chouwen
  - key: breakthrough
    name: 普说四尊宿悟缘证据
    labels:
      zh: 引古证据
    start_date: 1595-01-01
    highlight_event_id: guji-法舟济-event-pushuo-chouwen
  - key: climax
    name: 开示念佛看谁火聚
    labels:
      zh: 念佛看谁
    start_date: 1596-01-01
    highlight_event_id: guji-法舟济-event-pushuo-chouwen
  - key: closure
    name: 颂古剩语门人编次
    labels:
      zh: 颂古剩语
    start_date: 1600-01-01
    highlight_event_id: guji-法舟济-event-songyu
  decisions:
  - date: 1595-01-01
    title_zh: 引道明百丈大珠水潦悟缘为证
    rationale: 为救末流意根领会禾莠不分举古人见道因缘证据拄杖喝下令见本地风光不堕恶知见
  - date: 1596-01-01
    title_zh: 十人而九兼提念佛看谁
    rationale: 真师隐遁宗社寂寥唯念佛直截简易以一句大事人人能下手绵密逼拶悬崖失脚净秽不二
events:
- id: guji-法舟济-event-birth
  date: 1550-01-01
  year_of: 1550
  type: birth
  title_zh: 降生
  description: 明代降生生年不详少长出家参学宗门后承临济香严吉庵一系
- id: guji-法舟济-event-tianing-kaifa
  date: 1590-01-01
  year_of: 1590
  type: endeavor
  title_zh: 金陵回止天宁升座提唱
  description: 自金陵回止天宁首座寮应众请就僧堂设座拈香祝圣说世尊为开示本来佛性出现于世拈花付迦叶及异见王八处出现直指见闻运拄杖处
- id: guji-法舟济-event-pushuo-chouwen
  date: 1595-01-01
  year_of: 1595
  type: endeavor
  title_zh: 结制解制普说并酬问士夫
  description: 三月安居结制解制普说痛斥认缘影认鬼窟渔猎文字附会儒典等病举四尊宿悟处并与王龙溪陆五台周桃村等论心性易理知行开念佛看谁方便
- id: guji-法舟济-event-songyu
  date: 1600-01-01
  year_of: 1600
  type: endeavor
  title_zh: 颂古剩语编次流通
  description: 参学比丘如渊大芹编次提唱酬问普说颂古为剩语颂世尊初生升座外道问法梁武问初祖赵州狗子等入嘉兴藏流通
- id: guji-法舟济-event-death
  date: 1610-01-01
  year_of: 1610
  type: death
  title_zh: 示寂
  description: 明末示寂具体年月不详剩语由门人编次存世列嘉兴藏佛藏之部
