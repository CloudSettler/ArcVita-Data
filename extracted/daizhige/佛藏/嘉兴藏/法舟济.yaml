      raw: 明代生年不详约嘉靖末前后
    death:
      date: 1610-01-01
      precision: year
      is_circa: true
      raw: 明末示寂年月不详
  birth_date: 1550-01-01
  death_date: 1610-01-01
  era: 明代
  reign_ref: 明万历前后
  archetype: 禅师
  dilemmas:
  - 本来佛性平等直指与众生无明颠倒深厚埋没如何令人悟入
  - 祖师门庭高峻难仰与念佛简易直截如何兼顾不堕知见窠臼
  lesson: 离名离相直指本来平等佛性痛斥意根卜度黑山闭目与文字渔猎单提参究看谁并开念佛金刚宝剑以入本地风光
  summary_first_person: 吾自金陵回止天宁应众请就僧堂设座拈香祝圣直示本来佛性人人平等更于岁朝涅槃清明浴佛结解诸节普说痛斥末流更与士夫酬问心性开念佛看谁方便只为踏着本地风光不被贤圣热瞒
  source_urls:
