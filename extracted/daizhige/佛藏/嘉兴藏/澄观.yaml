- id: guji-澄观-event-fajie
  title_zh: 答帝问法界统冠缁徒
  date: 0800
  year_of: 800
  description: 奏法界为众生身心本体世尊初成正觉所称性说帝听而自得敕铸印号僧统清凉国师为七帝门师
- id: guji-澄观-event-death
  title_zh: 开成示寂塔于终南
  date: '0838-03-06'
  year_of: 838
  description: 开成三年三月六日诫徒取信于佛对境无心而逝春秋一百有二文宗辍朝塔全身于终南敕谥清凉国师妙觉之塔裴休撰碑
