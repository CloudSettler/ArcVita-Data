  dilemmas:
  - 不立文字与门人潜钞语录广传之间的持守
  - 株守翔凤补衲余生与承父业出山继席之间的抉择
  - 呵斥泥于文字与藉言教辨龙蛇之间的分寸
  lesson: 行解相应方为真祖，空却所有而教泽藉尊信师说以不坠
  summary_first_person: 我幼升天童，参金粟费老人得其室中真传，后诛茅翔凤开资福，住山三十载不开文字，门人潜钞语录行世，晚年继席石门福严，惟以棒喝拂子直指本来具足
  source_urls:
