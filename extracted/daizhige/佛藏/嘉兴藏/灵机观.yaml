      - 辨龙蛇于叱吒
    start_date: 1654-11-01
    highlight_event_id: guji-灵机观-event-jiezhi
  - key: closure
    name: 法席大盛垂范四方
    labels:
      zh:
      - 万指铿锵
      - 丛席粗成
    start_date: 1660-01-01
    highlight_event_id: guji-灵机观-event-jiezhi
  decisions:
  - date: 1644-03-01
    title_zh: 诛茅翔凤不起于座
    rationale: 不逾阃株守以化荆棘为宝坊，立纲纪以存先德遗风
  - date: 1654-11-01
    title_zh: 应众求结制升座
    rationale: 藉升座机缘勘辨学人，令心境一如物我双忘
- id: guji-灵机观-endeavor-2
  title_zh: 继席福严弘扬正宗
  summary: 以心丧株守十年后，受请进院嘉兴石门福严，酬恩报德，维持先师疆界
  phases:
  - key: brewing
    name: 心丧株守十载
    labels:
      zh:
      - 钝镢锄云
      - 无心希求
    start_date: 1661-01-01
    highlight_event_id: guji-灵机观-event-jiezhi
  - key: breakthrough
    name: 辛亥进院福严
    labels:
      zh:
      - 饮水知源
      - 父业子承
    start_date: 1671-09-12
    highlight_event_id: guji-灵机观-event-fuyan
  - key: climax
    name: 据室升堂说法度众
    labels:
      zh:
      - 升座机缘
      - 寿藏荐亲
    start_date: 1671-10-01
    highlight_event_id: guji-灵机观-event-fuyan
  - key: closure
    name: 语录编成示寂归真
    labels:
      zh:
      - 潜钞密记
      - 眼目垂世
    start_date: 1680-01-01
    highlight_event_id: guji-灵机观-event-death
  decisions:
  - date: 1671-09-12
    title_zh: 受请渡语水继席福严
    rationale: 先师开辟之处英贤代起，为报恩酬德勉力维持彻底翻覆
  - date: 1672-01-01
    title_zh: 禁止誊录而听门人潜钞
    rationale: 呵别传泥文字之弊而存师说源流，令后世因言知人
events:
