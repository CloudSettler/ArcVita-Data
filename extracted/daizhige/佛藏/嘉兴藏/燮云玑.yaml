  summary_first_person: 我是燮云玑临济儿孙侍万峰三年有省依国清和尚祥符台山十四年深入阃奥密受印记后闭关国清无畏堂终身不出每闻钟鼓即焚香礼拜事关丛林大体必预白和尚戊子八月示疾诀别中夜吉祥而逝遗语由玄杲录为无畏堂语录
