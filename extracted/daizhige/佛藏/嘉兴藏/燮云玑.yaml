  year_of: 1648
  title_zh: 戊子八月十七日中夜入寂
  description_zh: 戊子八月示疾请和尚入关礼辞偈别有明日欲归之语问古有子夜入寂否次第请同参诀别各赠以偈翼日十七日神气湛定中夜吉祥而逝天下咨嗟称玑禅师法弟张有誉题序
