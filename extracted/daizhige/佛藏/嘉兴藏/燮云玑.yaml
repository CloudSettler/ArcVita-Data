endeavors:
- id: guji-燮云玑-endeavor-1
  title_zh: 依止万峰国清参究悟道
  description_zh: 根性初不甚利而心虚志笃侍万峰三年有省后依国清和尚十四年深入阃奥箭锋相拄得密印而不急出世
  phases:
  - key: brewing
    name: 侍万峰有省
    labels:
      zh:
      - 侍万峰三年
      - 忘寝食必彻
    start_date: 1631
    highlight_event_id: guji-燮云玑-event-shifeng
  - key: breakthrough
    name: 依国清深入
    labels:
      zh:
      - 祥符台山十四年
      - 无一字不自鞴中来
    start_date: 1634
    highlight_event_id: guji-燮云玑-event-yiguo
  - key: climax
    name: 机迅眼明相拄
    labels:
      zh:
      - 箭锋相拄
      - 佛祖秘要无逃掌握
    start_date: 1644
    highlight_event_id: guji-燮云玑-event-yiguo
  - key: closure
    name: 可以出世不妨忘世
    labels:
      zh:
      - 陶镕气质保固根本
      - 陆沉众中承事善知识
    start_date: 1646
    highlight_event_id: guji-燮云玑-event-biguan
  decisions:
  - date: 1634
    title_zh: 决依国清十四年不离左右
    rationale: 自谓无一言一字不自和尚鞴中来须温研积稔远追云门沩仰以彻尽底蕴
  - date: 1646
    title_zh: 决以忘世保任不急出世为人
    rationale: 有志未逮愿陶镕气质光大心志世世承事善知识不作一场逗漏末路收拾不来
- id: guji-燮云玑-endeavor-2
  title_zh: 闭关无畏堂辅翼丛林传遗编
  description_zh: 闭关国清无畏堂终身未尝出世无刻不以尊师为众为念熟思审处补益丛林示疾入寂后遗编梓行称玑禅师
  phases:
  - key: brewing
    name: 闭关无畏堂
    labels:
      zh:
      - 终身未尝出世
      - 闭关一室
    start_date: 1646
    highlight_event_id: guji-燮云玑-event-biguan
  - key: breakthrough
    name: 尊师为众补益
    labels:
      zh:
      - 闻钟鼓焚香礼拜
      - 法应如是预白商量
    start_date: 1647
    highlight_event_id: guji-燮云玑-event-biguan
  - key: climax
    name: 上书潜神养拙
    labels:
      zh:
      - 大火聚外笔舌潜神
      - 上堂风励学者
    start_date: 1648
    highlight_event_id: guji-燮云玑-event-biguan
  - key: closure
    name: 示疾诀别入寂
    labels:
      zh:
      - 戊子八月礼辞赠偈
      - 十七日中夜吉祥而逝
    start_date: 1648-08-16
    highlight_event_id: guji-燮云玑-event-death
  decisions:
  - date: 1647
    title_zh: 决事无小大必就关相商
    rationale: 视大众痾痒如在己身必悉心区画婉言相质远合古辙近赴来机以全丛林大体
  - date: 1648-08-16
    title_zh: 决示疾请入关礼辞次第诀别
    rationale: 行解相应去来自在以偈别同参问子夜入寂效世尊中夜泊然而示无畏
