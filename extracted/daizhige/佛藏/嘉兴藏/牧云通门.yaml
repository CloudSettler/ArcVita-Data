  - key: climax
    name: 栖真长夏海滨吟成
    labels:
      zh: 栖真著述
    start_date: 1652
    highlight_event_id: guji-牧云通门-event-qizhen
  - key: closure
    name: 别集十四卷告成
    labels:
      zh: 别集告成
    start_date: 1659
    highlight_event_id: guji-牧云通门-event-death
  decisions:
  - date: 1643
    title_zh: 作池上来折芦诸咏
    rationale: 形上形下恃源而往，有触必应，不有意为诗文而至者自至，故以诗明禅
  - date: 1655
    title_zh: 汇刻文七卷偈一卷诗六卷
    rationale: 恐语录孤行难摄文士，故以论序书启传志铭祭及铜井古南栖真天童诸诗，别为一集以广流通
events:
- id: guji-牧云通门-event-birth
  date: 1603
  year_of: 1603
  title_zh: 常熟诞生
  description: 明万历三十一年生于常熟庄氏，俗姓庄，后出家，法名通门，号牧云，别号懒斋
- id: guji-牧云通门-event-tongjing
  date: 1638
  year_of: 1638
  title_zh: 戊寅初住铜井山
  description: 初住铜井山，吴门伯明以四偈贻之，次韵山中吟十首，设关禁足，冒暑访道者至
- id: guji-牧云通门-event-gunan
  date: 1640
  year_of: 1640
  title_zh: 庚辰冬开法古南
  description: 开法古南折芦庵，入春偶成八首，与王言远唐琪圆等往还，除夕开炉，领众参究
- id: guji-牧云通门-event-qizhen
  date: 1652
  year_of: 1652
  title_zh: 赴栖真雪窦天童弘化
  description: 登雪窦寻显禅师塔迹，游隐潭妙高台千丈崖，赴栖真，作海滨春来长夏吟九十四首，后转兴福兴化鹤林天童
- id: guji-牧云通门-event-death
  date: 1659
  year_of: 1659
  title_zh: 示寂留懒斋别集
  description: 清顺治十六年示寂，门人汇其文部七卷偈部一卷诗部六卷共十四卷，朱一是王庭言等为序，嘉兴藏收录流传
