  archetype: 临济宗工兼诗文大家
  dilemmas:
  - 宗工棒喝与诗文著述如何两全，不堕文字禅又不废文章教化
  - 法席屡迁游方弘化与安住一处坚守道业之间如何抉择
  lesson: 天道文章未始有分，触绪成篇皆自然流出，禅与诗文不二
  summary_first_person: 吾号牧云，别号懒斋，临济家风，以棒喝天下，然有触必应，忽诗忽文，若山出云水遭风，层起叠生，近体追王孟，古诗法陶韦，无韵之文追白苏，惟愿后人由所可闻而悟所不可闻者
  source_urls:
