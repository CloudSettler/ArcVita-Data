    title_zh: 庚辰冬开法古南
    rationale: 单提拈颂从上相沿，须别开堂奥接引后学，故不辞劳住持古南折芦庵
  - date: 1652
    title_zh: 赴栖真登雪窦弘法
    rationale: 为访古德塔迹并应四众之请，转席浙东，登雪窦妙高台千丈崖，随缘开示
- id: guji-牧云通门-endeavor-2
  title_zh: 以诗文弘禅结集懒斋别集
  summary: 语录之外，论序记铭书启颂赞偈诗凡十四卷，以文章接引士大夫，以诗歌写山居怀抱
  phases:
