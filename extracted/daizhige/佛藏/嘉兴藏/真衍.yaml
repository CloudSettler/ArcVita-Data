events:
- id: guji-真衍-event-birth
  date: 1621-02-03
  year_of: 1621
  title_zh: 姑苏诞生
  place_zh: 姑苏高阳氏家
  description: 明泰昌辛酉正月十三日母陈氏感异梦生，儿时敏慧喜独坐好持佛母准提神咒
- id: guji-真衍-event-renounce
  date: 1639
  year_of: 1639
  title_zh: 十九散财遣室为苦行人
  place_zh: 姑苏
  description: 连遭父母丧葬服讫，尽散所有于宗人厚贻其室而遣之，制头陀服代僧募饭祁寒暑雨弗恤
- id: guji-真衍-event-awaken
  date: 1641
  year_of: 1641
  title_zh: 万峰受戒遍参闻板有会
  place_zh: 万峰诸方丛林
  description: 期满往万峰受具足戒，阅圆觉经叹徒为僧相，遍参尊宿一日闻板声忽然有会为诸方印可
- id: guji-真衍-event-transmit
  date: 1655
  year_of: 1655
  title_zh: 鸳水嗣法金明为临济三十二世
  place_zh: 鸳水金明
  description: 过金明介禅师机缘相合有水乳之契，遂以法付之为嫡骨亲子，断桥十四传至金明后得以不坠
- id: guji-真衍-event-retreat
  date: 1656
  year_of: 1656
  title_zh: 归隐太仓藕花庵精进持经
  place_zh: 太仓藕花庵
  description: 随侍逾年因痰疾辞介归隐，每日钟鸣危坐默持妙法莲华经一卷香再炷而毕数十年如一日，手书法华付刻复九月书成华严全部
- id: guji-真衍-event-preach
  date: 1673
  year_of: 1673
  title_zh: 寓双树主福城住藕花升座弘法
  place_zh: 双树福城藕花莲华禅寺
  description: 初寓双树继主福城今住藕花经营殿宇装塑法像，升座小参拈古颂古随机示现，缁素景从座下多堕地狮儿，康熙癸丑语录成门人机如编次
- id: guji-真衍-event-death
  date: 1680
  year_of: 1680
  title_zh: 康熙中后期圆寂
  place_zh: 太仓藕花庵
  description: 僧腊将四十年后归老是庵圆寂，卒年月未详附传行状语录流通
