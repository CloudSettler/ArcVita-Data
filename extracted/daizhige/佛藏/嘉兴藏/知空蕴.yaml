  - https://daizhige.org/佛藏/嘉兴藏/知空蕴禅师语录.html
endeavors:
- id: guji-知空蕴-endeavor-1
  title_zh: 水目参戒得法与开峰付法
  summary: 十二岁闻命有感，三十六岁破家参水目得戒承印可，晚年承开峰密行付法，于福城开堂报恩，续临济三十二世正脉
  phases:
  - key: brewing
    name: 洱海僻壤少识大方
    labels:
      zh: 出生洱海
    start_date: 1613-10-06
    highlight_event_id: guji-知空蕴-event-birth
  - key: breakthrough
    name: 破家参水目得戒承印
    labels:
      zh: 水目得法
    start_date: 1649-01-01
    highlight_event_id: guji-知空蕴-event-shuimu-jie
  - key: climax
    name: 开峰付法福城开堂
    labels:
      zh: 福城开堂
    start_date: 1671-04-23
    highlight_event_id: guji-知空蕴-event-fucheng-kaitang
  - key: closure
    name: 炷香报乳阐临济宗
    labels:
      zh: 报恩弘宗
    start_date: 1671-04-24
    highlight_event_id: guji-知空蕴-event-fucheng-kaitang
  decisions:
  - date: 1649-01-01
    title_zh: 三十六岁破家散宅参水目
    rationale: 自愧福薄无依，欲究自心大事，故散宅离乡求戒于水目，承印可以明本分
  - date: 1671-04-23
    title_zh: 承开峰付嘱就福城开堂
    rationale: 开峰两番婆心远命法物，嘱累之重不啻黄檗禅板，不敢终退，故就福城大塔庙开堂以报法乳
- id: guji-知空蕴-endeavor-2
  title_zh: 九台开山与滇楚结制弘化
  summary: 退隐九台开建佛刹，掩关虎山，结制仙羊净乐蒙阳等地，上堂小参接引学人，灯续滇南
  phases:
  - key: brewing
    name: 退隐九台煨折脚铛
    labels:
      zh: 九台自养
    start_date: 1660-01-01
    highlight_event_id: guji-知空蕴-event-shuimu-jie
  - key: breakthrough
    name: 虎山掩关自唱自酬
    labels:
      zh: 虎山掩关
    start_date: 1678-11-19
    highlight_event_id: guji-知空蕴-event-hushan-biguan
  - key: climax
    name: 仙羊净乐结制领众
    labels:
      zh: 结制弘化
    start_date: 1686-02-01
    highlight_event_id: guji-知空蕴-event-xianyang-jiezhi
  - key: closure
    name: 垂示学人灯续滇南
    labels:
      zh: 晚年垂示
    start_date: 1690-01-01
    highlight_event_id: guji-知空蕴-event-death
  decisions:
  - date: 1678-11-19
    title_zh: 戊午十月掩关虎山
    rationale: 有意气时添意气，打破有为无为二关，直入千峰万峰，以验学人并自养道心
  - date: 1686-02-01
    title_zh: 应请住仙羊禅院结制
    rationale: 邑侯率众设斋敦请，为一大事因缘出现于世，故升座举扬第一义，安居五十三日以接初机后学
events:
- id: guji-知空蕴-event-birth
  type: birth
  title_zh: 万历癸丑九月初一生于洱海
  date: 1613-10-06
  year_of: 1613
  place_zh: 云南洱海
  summary: 王姓，母朵氏，家居僻壤，少识大方仪则，性顽愚，十二岁闻父母言命相有感
- id: guji-知空蕴-event-shuimu-jie
  type: 事业
  title_zh: 康熙九年三月水目大寺为众援戒升座
  date: 1670-04-01
  year_of: 1670
  place_zh: 云南水目大寺
  summary: 挥尺举古今一道，为求戒者说即心是戒即戒是心，拈香说戒，述水目为出佛产祖之地
- id: guji-知空蕴-event-fucheng-kaitang
  type: 事业
  title_zh: 辛亥三月十五福城寺开堂嗣开峰
  date: 1671-04-23
  year_of: 1671
  place_zh: 楚雄府福城寺
  summary: 接衡州开峰密行老和尚书并法拂，宰官居士设斋请开堂，祝圣报恩，竖拂明临济机用，自述三十六岁参水目因缘
- id: guji-知空蕴-event-hushan-biguan
  type: 事业
  title_zh: 戊午十月初六掩关虎山升座
  date: 1678-11-19
  year_of: 1678
  place_zh: 虎山关房
  summary: 李居士办斋，自唱自酬论有为无为关，与通味问答关内外事，肩拄杖入关度锁，付嘱首座
- id: guji-知空蕴-event-xianyang-jiezhi
  type: 事业
  title_zh: 丙寅正月初九住仙羊禅院结制上堂
  date: 1686-02-01
  year_of: 1686
  place_zh: 威楚广通县仙羊禅院
  summary: 邑侯胡公率众设斋，升须弥灯王座，祝圣酬开峰法乳，举拄杖拂子示文殊入理观音圆通之旨，勉众安禅
- id: guji-知空蕴-event-death
  type: death
  title_zh: 康熙年间示寂于滇中
  date: 1690
  year_of: 1690
  place_zh: 云南九台山
  summary: 开山九台弘化滇楚之后，遗语录由嗣法门人编集，灯续临济正宗
