  dilemmas:
  - 退隐九台自养残喘与承开峰付嘱出世为人的两难
  - 守水目退委初心与报法乳深恩住持弘化的两难
  lesson: 破家散宅参究得戒，感恩报乳，随机拈提，令临济正宗不坠滇楚
  summary_first_person: 吾乃洱海王姓，母朵氏，万历癸丑九月初一所生，性顽愚，三十六岁上破家散宅参水目得戒，承印可而不敢出世，退隐九台煨折脚铛以待残喘，幸承开峰密行老和尚两番婆心远付法物，遂于楚雄福城开堂，嗣后开山九台，结制仙羊净乐，弘阐临济宗风于滇楚之间
  source_urls:
