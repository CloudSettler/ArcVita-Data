events:
- id: guji-石关禅师-event-birth
  date: 1615-01-01
  year_of: 1615
  title_zh: 诞生
  description_zh: 明末生于凌氏幼具宿慧后出家参学得法于临济三十一世费隐容老和尚
- id: guji-石关禅师-event-defa
  date: 1655-01-01
  year_of: 1655
  title_zh: 嗣法费隐容
  description_zh: 前住黄檗金粟次住天童径山于费隐容会下彻悟嗣其法为临济嫡派后流寓白洋山
- id: guji-石关禅师-event-puming
  date: 1667-07-07
  year_of: 1667
  title_zh: 入主嘉兴普明禅寺
  description_zh: 康熙丁未七月初七受嘉秀护法请住普明卓拄杖入山门升座祝圣开堂自称凌上座转鸳湖第一法席
- id: guji-石关禅师-event-dizang
  date: 1668-07-30
  year_of: 1668
  title_zh: 地藏诞辰上堂明禅净不二
  description_zh: 应月湖朱居士请上堂举拂子明地藏光明谓明岩别开净土乃临济后裔接三根倡禅净总归向上家风
- id: guji-石关禅师-event-jiezhi
  date: 1667-10-15
  year_of: 1667
  title_zh: 结制解制煅炼衲子
  description_zh: 冬夏结制开大炉韝以棒喝钳锤勘验学人示向上一着千圣不传勉铜头铁额扶起古丛林
- id: guji-石关禅师-event-wanfo
  date: 1669-01-01
  year_of: 1669
  title_zh: 主持万佛期普利存亡
  description_zh: 开万佛道场演毗卢正印融根尘为三昧令一称一礼罪灭福臻功圆果满示桑麻桃李化日长
- id: guji-石关禅师-event-yulu
  date: 1680-08-01
  year_of: 1680
  title_zh: 门人编录语录陆光旭作序
  description_zh: 康熙庚申秋嗣法门人芳桂等编普明语录鹦湖陆光旭拜撰序推其开大机发大用显扬佛祖拯济群生
- id: guji-石关禅师-event-death
  date: 1685-12-31
  year_of: 1685
  title_zh: 示寂
  description_zh: 住持普明多年化缘既毕示寂于普明法席付嘱后学以禅净不二续慧命于无穷
