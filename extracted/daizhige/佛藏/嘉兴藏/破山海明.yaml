    title_zh: 于乱中坚持开堂不避锋刃
    rationale: 以将头临刃七难不渝之愿显大用大机令凶威自戢贼众信奉
  - date: 1652
    title_zh: 折伏权贵为众请命
    rationale: 不啻宋悦公于无尽以道力化导吕督诸家令止杀全活一方慧命
