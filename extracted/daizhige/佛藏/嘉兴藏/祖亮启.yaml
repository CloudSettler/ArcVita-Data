  - key: climax
    name: 当湖升座
    labels:
      zh: 当湖说法
    start_date: 1694-06-01
    highlight_event_id: guji-祖亮启-event-danghu
  - key: closure
    name: 遗稿付梓
    labels:
      zh: 语录流通
    start_date: 1701-04-04
    highlight_event_id: guji-祖亮启-event-death
  decisions:
  - date: 1693-03-08
    title_zh: 拈一句坐断千差于净明
    rationale: 本是山中人偶入市廛，不谙人事而缁素并集，故显一机于钱塘，使红尘闹市皆成古佛道场。
  - date: 1694-06-01
    title_zh: 持钵赴当湖德藏升座
    rationale: 佛身充满法界随缘赴感，庆赞斋请则倾盖相逢，明月清风共一家，直指目前现成。
events:
- id: guji-祖亮启-event-birth
  title_zh: 出生
  date: 1635
  year_of: 1635
  precision: year
  is_circa: true
  description: 明末清初生，英年悟证，亲入扬坟灵机老人之室得法。
- id: guji-祖亮启-event-zifu
  title_zh: 进院翔凤资福
  date: 1690-02-15
  year_of: 1690
  description: 康熙庚午二月十五日进院湖州翔凤资福禅寺升座，谓列祖名蓝先师勋业，拈真实心悬拄杖头示众。
- id: guji-祖亮启-event-retire-zifu
  title_zh: 退院资福辞塔
  date: 1693-01-01
  year_of: 1693
  precision: year
  is_circa: true
  description: 三年嗣席告退上堂，辞塔设供拈香，谓公案喜完成，化作孤云出岫行。
- id: guji-祖亮启-event-jingming
  title_zh: 进院杭州净明
  date: 1693-03-08
  year_of: 1693
  description: 康熙三十二年三月初八进院净明禅寺升座，谓山中人入市廛，孤峰顶上十字街头打成一片。
- id: guji-祖亮启-event-danghu
  title_zh: 当湖德藏报本升座
  date: 1694-06-01
  year_of: 1694
  precision: year
  is_circa: true
  description: 出队至当湖，应众居士及德藏寺耆德设斋之请升座，论海底泥牛岩前石虎，示佛身充满法界。
- id: guji-祖亮启-event-death
  title_zh: 示寂遗稿刊行
  date: 1700
  year_of: 1700
  precision: year
  is_circa: true
  description: 示寂于康熙四十年之前，嗣法涧石予揆以遗稿属同参素严，请普明超屿作序，门人广和记录付梓。
