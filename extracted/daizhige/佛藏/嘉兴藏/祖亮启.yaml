    labels:
      zh: 进院资福
    start_date: 1690-02-15
    highlight_event_id: guji-祖亮启-event-zifu
  - key: climax
    name: 结制炼磨
    labels:
      zh: 结冬炼磨
    start_date: 1691-10-15
    highlight_event_id: guji-祖亮启-event-zifu
  - key: closure
    name: 三年告退
    labels:
