  - 四坐道场弘化繁兴而宗风冷淡须别立生涯
  lesson: 以一真实心为栋梁，透脱见闻，行住坐卧皆须踏实地。
  summary_first_person: 吾英年悟证，亲入扬坟灵机老人之室，后四坐道场，住翔凤资福三年，复住杭州净明，以真实心提持向上，钳锤峻拔，惟愿衲子步步踏实，识得根源。
