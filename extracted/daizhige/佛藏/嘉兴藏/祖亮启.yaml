    start_date: 1693-01-01
    highlight_event_id: guji-祖亮启-event-retire-zifu
  decisions:
  - date: 1690-02-15
    title_zh: 以真实心住持资福
    rationale: 承先师恩力，以真实心为栋梁，透脱一机，纪纲勿坠，权衡佛祖。
  - date: 1693-01-01
    title_zh: 三年嗣席告退辞塔
    rationale: 德薄惭无补，贵踏祖父田地稳，进则气象雄，退则身轻如叶，故九拜辞塔而行。
- id: guji-祖亮启-endeavor-2
  title_zh: 住持杭州净明及当湖弘化
  summary: 康熙三十二年进院净明，山中人入市廛，应当湖德藏报本之请，孤峰顶上打成一片，随缘赴感。
  phases:
  - key: brewing
    name: 应请入市
    labels:
      zh: 市廛弘化
    start_date: 1693-03-01
