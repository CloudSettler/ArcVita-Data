events:
- id: guji-笑堂-event-birth
  title_zh: 诞生名家
  date: 1620
  year_of: 1620
  description: 名家子具夙慧根向父母未生前先形兆异猛脱爱河死灰参契
- id: guji-笑堂-event-follow
  title_zh: 随侍林野得印可
  date: 1640
  year_of: 1640
  description: 随侍天童林野老人多阅年所疑关交攻巾瓶罔怠钳锤独辣印可最先为通圆真子天童嫡孙
- id: guji-笑堂-event-beidu
  title_zh: 应请住杯渡三聚
  date: 1655
  year_of: 1655
  description: 应当湖杯渡庵三聚庵之请升座拈拄杖拈拂示水月家风借水溉花弘扬祖道
- id: guji-笑堂-event-guanghua
  title_zh: 丙申冬开堂广化
  date: 1656-12-01
  year_of: 1656
  description: 就浙江余杭卧龙山广化禅寺请开堂升座拈香祝圣拈疏升座三玄三要四喝四宾示杀人刀活人剑
- id: guji-笑堂-event-xiaocan
  title_zh: 结制解制小参普说
  date: 1657-01-01
  year_of: 1657
  description: 结制解制元旦天童忌日上堂为檀越荐亡小参示无生忍指归莲界主伴重重
- id: guji-笑堂-event-yulu
  title_zh: 语录成帙康熙乙巳序
  date: 1665-08-01
  year_of: 1665
  description: 侍者超源记录超晙等编包山灵泉刊卧龙语录陈之伸曹林韵于康熙乙巳作序寿梓流通
- id: guji-笑堂-event-death
  title_zh: 示寂
  date: 1680
  year_of: 1680
  description: 主禹航广化后化缘既毕示寂年月未详法嗣霞起等传持家风
