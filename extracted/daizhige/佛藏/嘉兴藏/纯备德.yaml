    start_date: 1666-01-01
    highlight_event_id: guji-纯备德-event-yuexia
  - key: climax
    name: 升座弘化
    labels:
      zh: 开堂说法
    start_date: 1666-06-01
    highlight_event_id: guji-纯备德-event-yuexia
  - key: closure
    name: 结制解制
    labels:
      zh: 结解安居
    start_date: 1667-01-01
    highlight_event_id: guji-纯备德-event-jiezhi
  decisions:
  - date: 1666-01-01
    title_zh: 应请住黄陵月峡
    rationale: 不辜傅魏二公复修伽蓝之诚，借此大展华严法席，指入毗卢性海
  - date: 1666-06-01
    title_zh: 据室升座三拈香祝延
    rationale: 以祝圣报恩酬法乳为先，再挥拄杖直指第一义，显宗门家风
- id: guji-纯备德-endeavor-2
  title_zh: 创建秭归佛兴山大悲禅寺
  description: 康熙壬子受本州文武绅衿之请创建大悲禅院，上梁安僧传戒浴佛
  phases:
  - key: brewing
    name: 发心鼎建
    labels:
      zh: 筹建道场
    start_date: 1672-01-01
    highlight_event_id: guji-纯备德-event-dabei
  - key: breakthrough
    name: 上梁安众
    labels:
      zh: 上梁开堂
    start_date: 1672-06-01
    highlight_event_id: guji-纯备德-event-dabei
  - key: climax
    name: 传戒接众
    labels:
      zh: 传戒剃度
    start_date: 1673-01-01
    highlight_event_id: guji-纯备德-event-chuanjie
  decisions:
  - date: 1672-01-01
    title_zh: 应请创建大悲禅院
    rationale: 于佛兴山建千古名蓝作万世规模，以大悲愿力随缘赴感接引群品
  - date: 1673-01-01
    title_zh: 佛成道日传戒剃度
    rationale: 以戒月禅天函盖一切，令僧尼居士返本还源归根得旨
