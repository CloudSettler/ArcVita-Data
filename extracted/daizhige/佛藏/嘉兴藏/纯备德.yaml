endeavors:
- id: guji-纯备德-endeavor-1
  title_zh: 住彝陵黄陵月峡禅院弘法
  description: 康熙丙午受参府傅公游府魏公之请住月峡，开堂祝圣阐扬微笑宗风
  phases:
  - key: brewing
    name: 受请入院
    labels:
