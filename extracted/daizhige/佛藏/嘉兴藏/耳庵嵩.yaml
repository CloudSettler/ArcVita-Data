  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E8%80%B3%E5%BA%B5%E5%B5%A9%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-耳庵嵩禅师-endeavor-1
  title_zh: 参学嗣法，承巴掌衣钵
  summary_zh: 自三姓庵祝发，习教参聚云吹万，依铁大师，终入巴掌记室，临终授衣拂承子印
  phases:
  - key: brewing
    name: 祝发习教遍参
    labels:
      zh: 酆都祝发
    start_date: 1620
    highlight_event_id: guji-耳庵嵩禅师-event-ordination
  - key: breakthrough
    name: 撞入聚云得示
    labels:
      zh: 参吹万老人
    start_date: 1635
    highlight_event_id: guji-耳庵嵩禅师-event-ordination
  - key: climax
    name: 记室随掌嗣法
    labels:
      zh: 嗣三巴掌衣钵
    start_date: 1645
    highlight_event_id: guji-耳庵嵩禅师-event-sifa
  - key: closure
    name: 子印在身待机出世
    labels:
      zh: 承嘱待出
    start_date: 1648
    highlight_event_id: guji-耳庵嵩禅师-event-sifa
  decisions:
  - date: 1635
    title_zh: 弃教参禅依吹万
    rationale: 闻忠州聚云树帜，欲明向上，故参随多载求透彻
  - date: 1645
    title_zh: 独依掌和尚居记室
    rationale: 掌师三遭痛掌彻心源，师资相契出语言文字外，故到处相随不别往
- id: guji-耳庵嵩禅师-endeavor-2
  title_zh: 历住四刹开堂接众
  summary_zh: 出世后住伏虎熊耳回龙天宁，顺治六年住熊耳，七年住回龙，后住天宁，设颂古征别诫众而化
  phases:
  - key: brewing
    name: 熊耳庵首座开堂
    labels:
      zh: 熊耳上堂
    start_date: 1649-10-15
    highlight_event_id: guji-耳庵嵩禅师-event-xionger
  - key: breakthrough
    name: 回龙禅院接云水
    labels:
      zh: 回龙入院
    start_date: 1650-09-15
    highlight_event_id: guji-耳庵嵩禅师-event-huilong
  - key: climax
    name: 天宁五峰弘化设教
    labels:
      zh: 天宁住持
    start_date: 1651
    highlight_event_id: guji-耳庵嵩禅师-event-tianning
  - key: closure
    name: 祗园证盟嘱后而逝
    labels:
      zh: 示寂茶毗
    start_date: 1653
    highlight_event_id: guji-耳庵嵩禅师-event-death
  decisions:
  - date: 1649-10-15
    title_zh: 受巴掌遗命住熊耳
    rationale: 秉本堂遗命酬法乳恩，以拄杖拂子直指第一义，为先师出气
  - date: 1650-09-15
    title_zh: 应请住金福山回龙
    rationale: 宣慰期主迎请开堂，透开法门显鼻孔，随方接众不辞拈出
  - date: 1651
    title_zh: 受请住天宁并付嘱后事
    rationale: 施主设会证盟事毕即行，预以衣法送三山求人，令众往参莫自辜负
events:
- id: guji-耳庵嵩禅师-event-birth
  date: 1608
  year_of: 1608
  title_zh: 生于四川重庆府酆都县毛氏
  place_zh: 四川酆都
  description: 附记云四川重庆府酆都县毛氏子，赋性冲澹寡言笑多慈忍，生年失载以寿推约
- id: guji-耳庵嵩禅师-event-ordination
  date: 1620
  year_of: 1620
  title_zh: 幼于本县三姓庵祝发习教
  place_zh: 酆都三姓庵
  description: 幼祝发，初习教乘，后参忠州聚云吹万老人多载，又依铁大师有年
- id: guji-耳庵嵩禅师-event-sifa
  date: 1648
  year_of: 1648
  title_zh: 入巴掌记室临终授衣拂嗣法
  place_zh: 上板
  description: 独依掌和尚居记室，到处相随，临终授以衣拂，遂承子印，为径山大慧十六世孙
- id: guji-耳庵嵩禅师-event-xionger
  date: 1649-10-15
  year_of: 1649
  title_zh: 顺治六年十月十五日住熊耳庵上堂
  place_zh: 湖广施州卫三渡屯观音山熊耳庵
  description: 祗园檀越陈化宇等秉巴掌遗命请师上堂，竖拂明第一义，棒喝接众
- id: guji-耳庵嵩禅师-event-huilong
  date: 1650-09-15
  year_of: 1650
  title_zh: 顺治七年九月十五日住金福山回龙禅院
  place_zh: 忠路金福山回龙禅院
  description: 宣慰司期主冉斯荣请住，卓杖入山门佛殿方丈，升座拈香酬临济二十六代巴掌先师法乳
- id: guji-耳庵嵩禅师-event-tianning
  date: 1651
  year_of: 1651
  title_zh: 受请住天宁五峰山说法诫众
  place_zh: 天宁寺五峰山
  description: 入院以明月昙花示消息，举五宗颂棒喝，作坐禅箴陋室铭诫众，语录多成于此
- id: guji-耳庵嵩禅师-event-death
  date: 1653
  year_of: 1653
  title_zh: 祗园设会示微疾集众而逝茶毗天宁
  place_zh: 天宁五峰山之阳
  description: 偶示微疾谈笑自若，留数日为施主证盟，嘱以衣法送三山并令众往参，言讫而逝，塔于五峰山阳，寿四十六，语录一卷行世
