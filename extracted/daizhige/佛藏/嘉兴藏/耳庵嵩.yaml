person:
  qid: guji-耳庵嵩禅师
  name_zh: 耳庵嵩
  names:
    zh: 耳庵嵩
    en: Eran Song
  lifespan:
    birth:
      date: 1608
      precision: year
      is_circa: true
      raw: 附记未载生年，以寿四十六逆推，约明万历末四川酆都毛氏子
    death:
      date: 1653
      precision: year
      is_circa: true
      raw: 住天宁示寂，附记未载卒年，约顺治初，寿四十六
  birth_date: 1608
  death_date: 1653
  era: 清初
  reign_ref: 顺治
  archetype: 禅门宗匠
  dilemmas:
  - 不立文字与撰述传世之辨，既呵意识抟量，又以颂古征别接机
  - 乱离住持与孤行自在之辨，历住四刹随缘开堂，仍守赤骨露裸
  lesson: 佛法不从他得，须如金翅擘海直取，乱中亦得潇洒无碍
  summary_first_person: 吾乃蜀中酆都毛氏子，幼于三姓庵祝发，参吹万老人与铁大师多年，终嗣三巴掌和尚衣拂，历住伏虎熊耳回龙天宁，以直指接人，留语录一卷而去
  source_urls:
