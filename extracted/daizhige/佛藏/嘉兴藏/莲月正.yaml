    rationale: 渡三峡为荆南士夫所留住江陵福昌以待玉泉缘熟奠定荆楚信众基础
- id: guji-莲月正-endeavor-2
  title_zh: 住持玉泉中兴祖庭
  description: 康熙十五年入院当阳玉泉山景德禅寺住持五六载开炉结制升座说法赖蔡总制俞邑侯等护持重修佛殿毗卢殿再振隋唐智者神秀道场
