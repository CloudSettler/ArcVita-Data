events:
- id: guji-蕅益智旭-event-birth
  date: 1599-05-03
  year_of: 1599
  title_zh: 生于古吴木渎
  description: 母金氏持白衣大悲咒十年梦大士送子而生时为万历己亥五月三日亥时
- id: guji-蕅益智旭-event-chujia
  date: 1622-01-01
  year_of: 1622
  title_zh: 从雪岭剃度名智旭
  description: 二十四岁梦礼憨山决意出家体究大事从雪岭师剃度夏秋作务云栖听唯识而疑性相矛盾
- id: guji-蕅益智旭-event-jingshan
  date: 1623-06-01
  year_of: 1623
  title_zh: 径山逼拶大悟性相一齐透彻
  description: 往径山坐禅次年夏功极身心世界忽皆消殒知此身当处出生随处灭尽性相二宗本无矛盾
- id: guji-蕅益智旭-event-honglu
  date: 1630-01-01
  year_of: 1630
  title_zh: 四阄问佛决意宏律究心台部
  description: 三十二岁拟注梵网频拈得台宗阄于是究心台部而不肯为台家子孙以救门庭执诤
- id: guji-蕅益智旭-event-lingfeng
  date: 1646-01-01
  year_of: 1646
  title_zh: 再住灵峰广述经论
  description: 四十六岁住灵峰述四十二章遗教八大人觉后述周易禅解唯识心要弥陀要解法华会义等
- id: guji-蕅益智旭-event-jingtu
  date: 1654-07-01
  year_of: 1654
  title_zh: 还灵峰卧病定净土十要成阅藏知津
  description: 甲午夏卧病选西斋净土诗补入净土九要为十要八月续阅大藏竟成阅藏知津法海观澜
- id: guji-蕅益智旭-event-death
  date: 1655-01-21
  year_of: 1655
  title_zh: 趺坐向西而逝塔于灵峰
  description: 乙未正月二十一日午刻趺坐绳床向西举手而逝寿五十七法腊三十四门人奉骨塔于灵峰大殿右
