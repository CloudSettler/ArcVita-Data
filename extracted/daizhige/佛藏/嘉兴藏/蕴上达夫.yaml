endeavors:
- id: guji-蕴上达夫-endeavor-1
  title_zh: 国破晦迹入释云游悟道
  description: 明亡后晦迹缁侣，历滇黔吴越蛮烟瘴雨之乡，面壁参究，证无上三昧，归隐鄂州筑室住山
  phases:
  - key: brewing
    name: 帝胄少颖国变晦迹
    labels:
      zh: 国破家亡晦迹缁侣
    start_date: 1644-01-01
    highlight_event_id: guji-蕴上达夫-event-ordination
  - key: breakthrough
    name: 历游滇黔吴越学道
    labels:
      zh: 托迹龙湖历游参学
    start_date: 1650-01-01
    highlight_event_id: guji-蕴上达夫-event-ordination
  - key: climax
    name: 面壁有得传法眼藏
    labels:
      zh: 面壁证悟传正法眼
    start_date: 1670-01-01
    highlight_event_id: guji-蕴上达夫-event-return
  - key: closure
    name: 归筑城东住山弹咏
    labels:
      zh: 筑室城东莳花种竹
    start_date: 1680-01-01
    highlight_event_id: guji-蕴上达夫-event-return
  decisions:
  - date: 1644-01-01
    title_zh: 国破后晦迹为僧
    rationale: 系出帝胄，不仕新朝，以缁侣全身，借禅老其才
  - date: 1680-01-01
    title_zh: 归隐筑室不复远游
    rationale: 阅历艰险已老，欲以定居养道，与兄宽夫弹琴吟咏
- id: guji-蕴上达夫-endeavor-2
  title_zh: 集石门文字禅为一帙
  description: 烂熟宋僧惠洪觉范石门文字禅，遇境会心，信手拈集唐律绝体，浑然一手，成集文字禅刊行
  phases:
  - key: brewing
    name: 烂熟石门腹笥充盈
    labels:
      zh: 取诸腹笥不待检阅
    start_date: 1683-01-01
    highlight_event_id: guji-蕴上达夫-event-compilation
  - key: breakthrough
    name: 乙丑元日看梅拈韵试集
    labels:
      zh: 煮茶看梅拈韵纪事
    start_date: 1685-02-01
    highlight_event_id: guji-蕴上达夫-event-compilation
  - key: climax
    name: 诸体兼备集句成帙
    labels:
      zh: 春日间居看竹诸集浑然天成
    start_date: 1685-06-01
    highlight_event_id: guji-蕴上达夫-event-compilation
  - key: closure
    name: 乙丑丁卯序跋刊行
    labels:
      zh: 杜舒题序付梓流布
    start_date: 1687-08-01
    highlight_event_id: guji-蕴上达夫-event-publish
  decisions:
  - date: 1685-02-01
    title_zh: 以集代作述而不作
    rationale: 己所欲言皆石门已言，何必当作者之名，借古人之精华抒己之至性
  - date: 1687-08-01
    title_zh: 付梓并请友人校阅题序
    rationale: 请舒峻极校，杜国柱杨璇阅，以见草蛇灰线之巧，证非离文字亦非即文字
events:
- id: guji-蕴上达夫-event-birth
  title_zh: 出生于明宗室之家
  date: 1635-01-01
  year_of: 1635
  description: 系出明高皇帝裔，少负颖异，生于明末崇祯年间
- id: guji-蕴上达夫-event-ordination
  title_zh: 国破家亡晦迹为僧云游
  date: 1645-01-01
  year_of: 1645
  description: 明亡后晦迹缁侣，法名蕰上字达夫，历滇黔吴越蛮烟瘴雨天风海涛之乡学道有年
- id: guji-蕴上达夫-event-return
  title_zh: 归筑城东与兄吟咏
  date: 1680-01-01
  year_of: 1680
  description: 归筑室城东，莳花种竹，与兄宽夫弹琴吟咏，往来徐方瑶等山人
- id: guji-蕴上达夫-event-compilation
  title_zh: 集石门文字禅诗成帙
  date: 1685-02-01
  year_of: 1685
  description: 乙丑元日同参同和尚方瑶煮茶看梅拈韵，集惠洪石门文字禅句为春日间居看竹诸篇，不见针线之痕
- id: guji-蕴上达夫-event-publish
  title_zh: 集文字禅题序刊行
  date: 1687-08-01
  year_of: 1687
  description: 康熙乙丑杜国柱题序，丁卯孟秋舒峻极题序，舒峻极校杜国柱杨璇阅，鄂州僧蕰上达夫著刊行
- id: guji-蕴上达夫-event-death
  title_zh: 示寂
  date: 1695-01-01
  year_of: 1695
  description: 住山讲禅集句后示寂于鄂州一带，年约六十前后
