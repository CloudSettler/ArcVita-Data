  dilemmas:
  - 文字即是禅还是离文字求禅
  - 故国之思难忘与身世两忘之愿难两全
  lesson: 以石门之情为己之情，述而不作亦可自成一家
  summary_first_person: 吾系出明高皇帝裔，国破家亡后晦迹缁侣，托迹龙湖，历滇黔吴越，面壁有得，归筑城东，与兄弹琴吟咏，凡吾所欲言皆石门所已言，遂集文字禅为一帙，不复自命作者
