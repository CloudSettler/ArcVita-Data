endeavors:
- id: guji-虚舟-endeavor-1
  title_zh: 注解唐奘八识规矩颂
  summary_zh: 宗嗣福严而研精教典取八识规矩颂特为之注备述鲁庵补注憨山通说而主以相归性以悟转识
  phases:
  - key: brewing
    name: 研精教典博览相宗
    labels:
      zh: 参学唯识
    start_date: 1650
    highlight_event_id: guji-虚舟-event-dushu
  - key: breakthrough
    name: 会通鲁庵憨山诸说
    labels:
      zh: 会通诸家
    start_date: 1665
    highlight_event_id: guji-虚舟-event-dushu
  - key: climax
    name: 草成颂注以相归性
    labels:
      zh: 注疏功成
    start_date: 1672
    highlight_event_id: guji-虚舟-event-zhushu
  - key: closure
    name: 自叙浅说付梓流传
    labels:
      zh: 梓行流通
    start_date: 1672-06-10
    highlight_event_id: guji-虚舟-event-kanke
  decisions:
  - date: 1665
    title_zh: 离心意识参绝凡圣路
    rationale: 不欲其深而欲其浅由浅而深是悟者之事故以浅说说之不拘训诂
  - date: 1672
    title_zh: 以相归性立宗
    rationale: 注所言相非能与人殊引而发之终归于性使览者知悟转八识为四智
- id: guji-虚舟-endeavor-2
  title_zh: 西湖退居弘化利生
  summary_zh: 留锡西湖退居弘扬唯识性使学人即用悟体圆觉自性化五识为成所作智度生息轮
  phases:
  - key: brewing
    name: 西湖留锡退居省心
    labels:
      zh: 退居西湖
    start_date: 1670
    highlight_event_id: guji-虚舟-event-zhushu
  - key: breakthrough
    name: 示人即用悟体总即一识
    labels:
      zh: 开示悟入
    start_date: 1671
    highlight_event_id: guji-虚舟-event-zhushu
  - key: climax
    name: 详辨三境三量三性
    labels:
      zh: 法义开演
    start_date: 1672
    highlight_event_id: guji-虚舟-event-zhushu
  - key: closure
    name: 化身分身息苦轮
    labels:
      zh: 利生流通
    start_date: 1672-06-10
    highlight_event_id: guji-虚舟-event-kanke
  decisions:
  - date: 1670
    title_zh: 退居西湖不立门庭
    rationale: 能以相归性以悟转识者少故退居省道不自是门庭只示转名言无实性
  - date: 1672
    title_zh: 劝人圆明初发成无漏
    rationale: 五识初发忽尔圆明即为成所作智直下承当度生息轮故详说五六七八转智次第
events:
- id: guji-虚舟-event-birth
  title_zh: 出生
  date: 1615
  year_of: 1615
  description: 生年未详清初僧人后嗣法福严约推生于明末清初之际
- id: guji-虚舟-event-dushu
  title_zh: 遍览鲁庵补注憨山通说
  date: 1665
  year_of: 1665
  description: 初读鲁庵补注后观憨山通说服其见高乃南行参学欲离心意识参绝凡圣路
- id: guji-虚舟-event-zhushu
  title_zh: 注成八识规矩颂作自叙浅说
  date: 1672
  year_of: 1672
  description: 取唐奘师八识规矩颂特为之注作自叙及八识规矩浅说明总即一识体同用别三境三量三性转识成智之旨退居西湖留锡省道人识
- id: guji-虚舟-event-kanke
  title_zh: 王庭作序梓行刊刻
  date: 1672-06-10
  year_of: 1672
  description: 康熙十一年端阳后十日槜李王庭题小序称其引而发之终归于性徐子敬可读而美之梓之以传入嘉兴大藏
- id: guji-虚舟-event-death
  title_zh: 示寂
  date: 1680
  year_of: 1680
  description: 卒年未详康熙间注书梓行后退居西湖示寂潇洒坐去以著作翻译示人
