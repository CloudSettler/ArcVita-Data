  summary_first_person: 吾閩仙游陳氏子童年禮蓮山東林剃染壯參朝宗示以萬法歸一不契遂參費隱於金粟聞鐘有省後參萬如於龍池秋水澄潭中契入得為龍池血胤師逝回閩養親住通天五十四年了無一物末後翻身西方日出
