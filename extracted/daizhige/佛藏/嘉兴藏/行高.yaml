endeavors:
- id: guji-行高-endeavor-1
  title_zh: 參學悟道嗣法龍池
  summary: 不滿萬法歸一跋涉參費隱於金粟聞鐘省悟再參萬如於龍池契入得法
  phases:
  - key: brewing
    name: 童年剃染初參
    labels:
      zh: 蓮山剃染參究萬法歸一
    start_date: 1630
    highlight_event_id: guji-行高-event-birth
  - key: breakthrough
    name: 金粟聞鐘有省
    labels:
      zh: 金粟聞鐘鼻孔向下
    start_date: 1650
    highlight_event_id: guji-行高-event-jinsu
  - key: climax
    name: 龍池契悟嗣法
    labels:
      zh: 秋水澄潭一光相涵為龍池血胤
    start_date: 1655
    highlight_event_id: guji-行高-event-longchi
  - key: closure
    name: 侍師至返真
    labels:
      zh: 囑法後侍左右至萬如返真
    start_date: 1658
    highlight_event_id: guji-行高-event-longchi
  decisions:
  - date: 1650
    title_zh: 腰包跋涉別參費隱
    rationale: 不自滿假於朝宗所示欲窮究鼻孔下落故投金粟
  - date: 1655
    title_zh: 別參萬如歸龍池
    rationale: 金粟得省後仍求印證見秋水澄潭境界遂承龍池宗旨
- id: guji-行高-endeavor-2
  title_zh: 歸閩養親住持通天
  summary: 龍池返真後回閩九座蟒岩養親應莆縉紳請住通天祝聖開堂弘揚臨濟正宗
  phases:
  - key: brewing
    name: 回閩養親隱蟒岩
    labels:
      zh: 九座蟒岩下養親
    start_date: 1660
    highlight_event_id: guji-行高-event-longchi
  - key: breakthrough
    name: 敦請住通天
    labels:
      zh: 緇素聯名敦請住通天禪寺
    start_date: 1662
    highlight_event_id: guji-行高-event-tongtian
  - key: climax
    name: 祝聖開堂說法
    labels:
      zh: 拈香祝聖建立龍池宗旨上堂小參機緣垂示
    start_date: 1663
    highlight_event_id: guji-行高-event-tongtian
  - key: closure
    name: 付囑示寂建塔
    labels:
      zh: 以衣拂偈語付原後堂塔於蓮山東麓
    start_date: 1669
    highlight_event_id: guji-行高-event-death
  decisions:
  - date: 1660
    title_zh: 返閩養親不即出世
    rationale: 師恩已報親恩未報先盡孝養於蟒岩之下待緣而動
  - date: 1669
    title_zh: 正月付囑三月示寂
    rationale: 以衣拂源流付原後堂繼席書遺囑辭眾偈以明了無一物
events:
- id: guji-行高-event-birth
  date: 1616
  year_of: 1616
  type: birth
  title_zh: 誕生於閩興化仙游陳氏
  description: 童年禮蓮山東林和尚剃染
- id: guji-行高-event-jinsu
  date: 1650
  year_of: 1650
  type: practice
  title_zh: 參費隱於金粟聞鐘有省
  description: 一夜聞鐘聲有省方知鼻端原來向下作偈生前面目強安排得費隱印可
- id: guji-行高-event-longchi
  date: 1655
  year_of: 1655
  type: dharma
  title_zh: 參萬如於龍池得法
  description: 見秋水澄潭碧天皓月相涵於一光之內遂為龍池血胤臨濟正宗三十一世下囑法後侍左右
- id: guji-行高-event-tongtian
  date: 1663
  year_of: 1663
  type: abbot
  title_zh: 住通天禪寺祝聖開堂
  description: 應莆餘賡銓部縉紳緇素請住通天拈香祝延建立龍池宗旨上堂垂示十智同真等公案
- id: guji-行高-event-death
  date: 1669
  year_of: 1669
  type: death
  title_zh: 示寂於通天塔於蓮山東麓
  description: 康熙己酉正月元日付衣拂於原後堂三月十二申時沐浴趺坐書辭眾偈五十四年了無一物掷筆而逝坐夏四十塔國歡寺側蓮山東麓語錄上下卷行世
