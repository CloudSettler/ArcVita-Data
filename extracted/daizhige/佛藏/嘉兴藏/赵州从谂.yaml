endeavors:
- id: guji-赵州从谂-endeavor-1
  title_zh: 南泉契悟与行脚遍参
  summary: 幼年出家后投南泉普愿，以如何是道之问顿悟平常心，后历参马祖下诸大善知识，行脚四十年而成大机用
  phases:
  - key: brewing
    name: 曹州出家初参
    labels:
      zh:
      - 出家求道
    start_date: 0796-01-01
    highlight_event_id: guji-赵州从谂-event-chujia
  - key: breakthrough
    name: 南泉问答顿悟
    labels:
      zh:
      - 平常心是道
    start_date: 0832-01-01
    highlight_event_id: guji-赵州从谂-event-nanquan
  - key: climax
    name: 遍参诸方砥砺机锋
    labels:
      zh:
      - 行脚参学
    start_date: 0835-01-01
    highlight_event_id: guji-赵州从谂-event-xingjiao
  - key: closure
    name: 机用圆成
    labels:
      zh:
      - 大机大用
    start_date: 0857-01-01
    highlight_event_id: guji-赵州从谂-event-xingjiao
  decisions:
  - date: 0832-01-01
    title_zh: 执问南泉如何是道
    rationale: 不安文字知解，欲直求不疑之道，故以擬即乖之诘逼出本心，遂悟道不属知不知如太虚廓然
  - date: 0835-01-01
    title_zh: 不住一处狂参善知识
    rationale: 既悟仍需历境炼磨，故发愿游方遍扣马祖下八十余员作家，不作一处住持以全道眼
- id: guji-赵州从谂-endeavor-2
  title_zh: 住持赵州以本分事接人
  summary: 八十岁应请住赵州城东观音院，三十余年不立高格，以吃茶去庭前柏树子狗子无佛性等话接引四海学者及赵王供养
  phases:
  - key: brewing
    name: 应请入赵州
    labels:
      zh:
      - 住持弘化
    start_date: 0858-01-01
    highlight_event_id: guji-赵州从谂-event-zhuxi
  - key: breakthrough
    name: 拈出吃茶庭柏话头
    labels:
      zh:
      - 机锋接众
    start_date: 0860-01-01
    highlight_event_id: guji-赵州从谂-event-honghua
  - key: climax
    name: 四海云集王侯归敬
    labels:
      zh:
      - 天下赵州
    start_date: 0880-01-01
    highlight_event_id: guji-赵州从谂-event-honghua
  - key: closure
    name: 百二十岁示寂
    labels:
      zh:
      - 圆寂付嘱
    start_date: 0897-11-01
    highlight_event_id: guji-赵州从谂-event-death
  decisions:
  - date: 0858-01-01
    title_zh: 八十始住赵州观音院
    rationale: 年高方肯为人，欲以软暖平常处养育后学，不与诸方争高下，故安住小院随缘接众三十余年
  - date: 0860-01-01
    title_zh: 坚持以本分事接人
    rationale: 见末法枝蔓葛藤多，故不随根机立三乘方便，但道寒即言寒热即言热与吃茶去庭前柏树子，令学人自断拣择
events:
- id: guji-赵州从谂-event-birth
  date: 0778-01-01
  year_of: 778
  title_zh: 诞生于郝乡
  description: 唐大历十三年生，俗姓郝，幼而颖异，天赋宿慧
  location_zh: 郝乡
- id: guji-赵州从谂-event-chujia
  date: 0796-01-01
  year_of: 796
  title_zh: 扈通院出家受戒
  description: 十八岁落发于曹州扈通院，未纳戒便首参南泉，开启参学生涯
  location_zh: 曹州扈通院
- id: guji-赵州从谂-event-nanquan
  date: 0832-01-01
  year_of: 832
  title_zh: 南泉下问答顿悟玄旨
  description: 问南泉如何是道，得平常心是道之示，于擬即乖言下顿悟，心如朗月，又亲证斩猫戴鞋托地等机用
  location_zh: 池州南泉山
- id: guji-赵州从谂-event-xingjiao
  date: 0835-01-01
  year_of: 835
  title_zh: 行脚遍参马祖下尊宿
  description: 南泉圆寂后行脚四十年，参沩山黄檗等八十余员善知识，砥砺吃茶庭柏等本分机锋
  location_zh: 江南北诸方丛林
- id: guji-赵州从谂-event-zhuxi
  date: 0858-01-01
  year_of: 858
  title_zh: 住持赵州观音院
  description: 年八十应请住赵州城东观音院，即今柏林禅寺，三十余年一宿一食迎送学者，赵王敬奉如师
  location_zh: 赵州观音院
- id: guji-赵州从谂-event-honghua
  date: 0870-01-01
  year_of: 870
  title_zh: 唱吃茶去与庭前柏树子
  description: 上堂接众拈出吃茶去与庭前柏树子与狗子无佛性等话头，天下学人云集，号为赵州古佛，语录流传一帙
  location_zh: 赵州观音院
- id: guji-赵州从谂-event-death
  date: 0897-11-01
  year_of: 897
  title_zh: 示寂于赵州
  description: 唐乾宁四年十月跏趺示寂，世寿一百二十岁，僧腊一百岁，赵王为作真赞，门人文远集上堂语录流传
  location_zh: 赵州观音院
