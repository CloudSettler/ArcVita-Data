  - 拟心即乖与不拟何知之间如何直指平常心是道
  - 接引三乘根机与坚守本分事接人之间如何不辜来学又不落言筌
  lesson: 放下玄妙拣择，于吃茶穿衣庭前柏树子等平常事中见道，以本分事接人则纵横自在
  summary_first_person: 吾赵州从谂，十八岁出家，参南泉普愿得平常心是道之旨，行脚遍参八十余员善知识，八十岁住赵州观音院三十余年，但以吃茶去与庭前柏树子等本分话接人，不立玄妙，愿学者莫久立葛藤，直于日用中自见主人公
