    title_zh: 就本寺开堂全提正令
    rationale: 为扶竖纲宗流通正脉须当阳展坐具斩钉截铁印机圆证
  - date: '1657'
    title_zh: 开炉鞴煆凡圣接众
    rationale: 以般若大火聚销烁顽铜钝铁使学人直下知归透向上关
