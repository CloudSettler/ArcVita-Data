      - 初转法轮
    start_date: -0537-01-01
    highlight_event_id: guji-释迦牟尼-event-first-sermon
  - key: closure
    name: 弘化一生付嘱流通入灭
    labels:
      zh:
      - 慈悲流通
    start_date: -0484-01-01
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -0538-12-08
    title_zh: 誓坐草座不成道不起
    rationale: 过去诸佛皆坐草座观树思惟而破不吉成吉祥故坚坐观缘起以证无上道
  - date: -0537-01-01
    title_zh: 先度憍陈如等五人
    rationale: 彼等追侍日久堪受法益先转四谛法轮令正法住世普利群生
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼园诞生
  date: -0563-04-08
  year_of: -563
  place_zh: 蓝毗尼园无忧树下
  description: 夫人游园攀无忧树太子自右胁生行七步称天上天下唯我独尊九龙吐水灌沐天龙欢喜
- id: guji-释迦牟尼-event-renunciation
  title_zh: 二月八夜逾城出家
  date: -0544-02-08
  year_of: -544
  place_zh: 迦毗罗卫北门外跋伽仙林
  description: 年十九感老病死苦诸天赞劝令天捧马足北门自开至仙林剃发贸袈裟而求圣道
- id: guji-释迦牟尼-event-austerity
  title_zh: 尼连河侧六年苦行
  date: -0543-01-01
  year_of: -543
  place_zh: 苦行林尼连河侧
  description: 日食一麻一米瘦若枯木访阿罗逻迦兰得四禅八定知非究竟遂舍苦行而求中道
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 菩提树下夜睹明星成道
  date: -0538-12-08
  year_of: -538
  place_zh: 菩提树下金刚座上
  description: 受吉祥草为座观缘起法本破魔军夜睹明星豁然大悟成等正觉放大光明普照大千
- id: guji-释迦牟尼-event-first-sermon
  title_zh: 鹿野苑初转法轮
  date: -0537-06-01
  year_of: -537
  place_zh: 波罗奈鹿野苑中
  description: 为憍陈如等五比丘说四谛八正道度生莫计开启弘化四十余年之端
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那城双林入灭
  date: -0483-02-15
  year_of: -483
  place_zh: 拘尸那城外双林树间
  description: 化缘既毕年八十示现入灭付嘱弟子护持正法令流通世间普利未来
