  era: 东周春秋晚期
  reign_ref: 迦毗罗卫净饭王之世
  archetype: 舍王求道之觉者
  dilemmas:
  - 王宫富贵安乐与老病死苦逼迫之间何去何从
  - 自饿苦行与受食修定何者为解脱真因
  - 独自安住涅槃与住世度脱众生如何抉择
  lesson: 见无常而舍欲乐以中道而成正觉以因果报应唤醒迷梦以慈悲度生为报恩
  summary_first_person: 我本迦毗罗卫太子名悉达多游四门见老病死僧而警悟中夜逾城出家遍访仙人修定六年苦行知非受乳糜坐菩提树观缘起悟明星而成佛说法度生只愿众生离苦得乐
  source_urls:
  - https://daizhige.org/佛藏/嘉兴藏/大藏一览.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/嘉兴藏/大藏一览.md
