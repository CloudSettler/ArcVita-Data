  decisions:
  - date: -0544-02-08
    title_zh: 中夜逾城出家
    rationale: 见老病死人人难免五欲乐皆无常唯求圣道可超彼岸故舍国出家
  - date: -0538-01-01
    title_zh: 舍苦行受牧女乳糜
    rationale: 以羸身取道则外道谓自饿为涅槃因终非解脱故受食全色力而取菩提
- id: guji-释迦牟尼-endeavor-2
  title_zh: 菩提成道转法度生
  summary: 坐菩提座观十二缘起降魔成等正觉说法四十余年普度天人
  phases:
  - key: brewing
    name: 受吉祥草坐菩提树
    labels:
