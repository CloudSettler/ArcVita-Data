  dilemmas:
  - 年十二三以千古学脉为己任而足不窥户不交公卿何以补世道
  - 天主教阳排佛阴窃秕糠伪尊儒实乱道脉当峻拒还是会通
  - 妖徒聪明能辩必有解辞当止于初征还是再征穷其根底
  lesson: 守太极本性之正以继天立极修身为本不以外来主宰乱华夏道脉
  summary_first_person: 吾年十二三便以千古学脉为己任辟释老闲圣道三十余载杜门震泽不求闻达客以天主教示我初欣其袒儒终察其阳辟佛而阴窃之伪尊儒而实坏之遂作初征再征列数十不通逐其人毁其书愿禁天下不存其像以卫吾道
