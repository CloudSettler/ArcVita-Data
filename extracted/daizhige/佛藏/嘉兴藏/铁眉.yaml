  date: 1642
  year_of: 1642
  is_circa: true
  summary_zh: 住万县宝峰云来寺大佛寺上堂紧水滩头抛绣球办己事勿论他非以巴掌打在须弥应机
- id: guji-铁眉三巴掌-event-jiashen
