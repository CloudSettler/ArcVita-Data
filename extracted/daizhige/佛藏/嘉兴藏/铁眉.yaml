  date: 1644-08-01
  year_of: 1644
  is_circa: true
  summary_zh: 甲申秋同工部熊月崖入施卫主梦净扫殿堂迎赵州祖次日师至与梦像符
- id: guji-铁眉三巴掌-event-death
  title_zh: 转锡南滨付衣钵寂于熊耳庵
  date: 1645
  year_of: 1645
  is_circa: true
  summary_zh: 世乱转锡南滨凤卫侯牟公请至示微疾以衣钵付门人耳庵圆寂建塔都会观音山熊耳庵住世六十五载
