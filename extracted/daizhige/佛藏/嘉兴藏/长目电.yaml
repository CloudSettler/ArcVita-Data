person:
  qid: guji-长目电禅师
  name_zh: 长目电
  names:
    zh: 长目电
    en: Changmu Dian
  era: 清初
  reign_ref: 康熙
  archetype: 孤硬宗匠
  dilemmas:
  - 孤硬不与时人同类与受绅衿护法迎请住持之间如何自处
  - 草衣木食独栖破寺与升座说法接引群迷之间如何兼顾
  lesson: 孤硬守本地家风一纵一夺方能于末流中挽回正眼
  summary_first_person: 我是梓邦宝郡邓氏子年少剃发单瓢只杖泛吴楚过洞庭涉滇云访道得遇恒秀老人随侍一载复于白云山圆明寺坐静多年后受请住弥陀涌金圆明宝觉等处以拄杖拂子直指人心不作声色佛法商量
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E9%95%BF%E7%9B%AE%E7%94%B5%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%98%89%E5%85%B4%E8%97%8F/%E9%95%BF%E7%9B%AE%E7%94%B5%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-长目电禅师-endeavor-1
  title_zh: 单瓢参访坐静悟道
  summary: 年少剃发射访名山遇恒秀而得法乳于白云圆明坐静多年养成孤硬家风
  phases:
  - key: brewing
    name: 年少剃发遍参江海
    labels:
      zh:
      - 傲骨名山
      - 泛吴楚涉滇云
    start_date: 1671
    highlight_event_id: guji-长目电禅师-event-meet-hengxiu
  - key: breakthrough
    name: 弥阳遇恒秀夺下腰包
    labels:
      zh:
      - 撞着冤家路头
      - 随侍一载授手归山
    start_date: 1671
    highlight_event_id: guji-长目电禅师-event-meet-hengxiu
  - key: climax
    name: 蒙自白云山坐静三载
    labels:
      zh:
      - 坐断善恶两头
      - 日持大悲千遍
    start_date: 1671
    highlight_event_id: guji-长目电禅师-event-mituo-1671
  - key: closure
    name: 策杖河西普应山圆明寺坐静
    labels:
      zh:
      - 独栖破寺做务
      - 为邑侯张象贲所敬谒
    start_date: 1671
    highlight_event_id: guji-长目电禅师-event-yuanming
  decisions:
  - date: 1671
    title_zh: 夺包随侍恒秀一载
    rationale: 撞着本分冤家须放下行脚包袱亲近取印以酬法乳
  - date: 1671
    title_zh: 入白云圆明长坐不卧
    rationale: 万法本闲为人自闹唯长坐穷玄方能透脱尘劳先起之病
- id: guji-长目电禅师-endeavor-2
  title_zh: 受请住持升座弘法
  summary: 受蒙自通海河西临安绅衿耆旧迎请连住弥陀涌金圆明宝觉以棒喝颂古接机
  phases:
  - key: brewing
    name: 受请住蒙自弥陀寺
    labels:
      zh:
      - 康熙辛亥春升座
      - 焚扫不劳他力
    start_date: 1671
    highlight_event_id: guji-长目电禅师-event-mituo-1671
  - key: breakthrough
    name: 通海涌金寺开法
    labels:
      zh:
      - 康熙癸丑绅士迎请
      - 至道莫测左右逢源
    start_date: 1673
    highlight_event_id: guji-长目电禅师-event-yongjin-1673
  - key: climax
    name: 河西圆明寺严护威德
    labels:
      zh:
      - 邑侯张象贲延请
      - 烧木佛别真伪
    start_date: 1673
    highlight_event_id: guji-长目电禅师-event-yuanming
  - key: closure
    name: 临安宝觉禅院示众
    labels:
      zh:
      - 慧月禅人迎请
      - 不落不昧因果截流
    start_date: 1673
    highlight_event_id: guji-长目电禅师-event-baojue
  decisions:
  - date: 1671
    title_zh: 应个旧众绅衿请住弥陀
    rationale: 信手拈来皆是佛事借住持因缘增檀那福果兼显无漏涅槃之道
  - date: 1673
    title_zh: 应通海耆旧请住涌金
    rationale: 道无名字形状须随缘赴感以淫房酒肆屠儿魁脍气象接物群迷
events:
- id: guji-长目电禅师-event-birth
  type: birth
  title_zh: 降生梓邦宝郡邓氏
  description: 同条梓邦宝郡邓氏之子在尘得智十七八九而后剃发傲骨遍参名山
- id: guji-长目电禅师-event-death
  type: death
  title_zh: 示寂事阙仅存语录行状
  description: 生卒年月阙载仅门人悟本编次语录卷上下及行状传其孤硬家风
- id: guji-长目电禅师-event-meet-hengxiu
  type: career
  title_zh: 弥阳大隐寺遇恒秀
  description: 寻访至弥阳大隐寺撞着恒秀大和尚夺下腰包随侍一载授手归山自称西蜀破山派幻翁孙恒公子
- id: guji-长目电禅师-event-mituo-1671
  type: career
  title_zh: 康熙辛亥春住蒙自弥陀寺
  date: 1671
  year_of: 1671
  description: 受蒙自县个旧众绅衿耆旧请住弥陀寺升座拈香祝圣拈拄杖论铁牛过窗棂及无漏因涅槃道
- id: guji-长目电禅师-event-yongjin-1673
  type: career
  title_zh: 康熙癸丑住通海涌金寺
  date: 1673
  year_of: 1673
  description: 通海县诸山耆旧领众绅士请住涌金寺升座论至道莫测推之不去瞻之在前兼示不用寻真遣妄之旨
- id: guji-长目电禅师-event-yuanming
  type: career
  title_zh: 住河西圆明寺受张象贲请
  description: 邑侯张象贲请住河西县圆明寺升座论已入未入圆明文殊境界举丹霞烧木佛院主眉须堕地之公案
- id: guji-长目电禅师-event-baojue
  type: career
  title_zh: 住临安宝觉禅院
  description: 慧月禅人请住临安府宝觉禅院升座论灵云桃花玄沙不肯及百丈野狐不落不昧因果之旨
