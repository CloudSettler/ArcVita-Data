events:
- id: guji-项谦-event-birth
  date: 1618-01-17
  year_of: 1618
  title_zh: 生于嘉兴秀水项家
  description: 明万历四十五年丁巳腊月廿一日午时生母梦星殒怀腰有紫黑子七如北斗襁褓见僧合掌微笑
- id: guji-项谦-event-office-jinwu
  date: 1640
  year_of: 1640
  title_zh: 庚辰承荫金吾
  description: 遵父命承荫金吾寅畏小心冤滥昭雪年十八已持准提参生死话二十余年
- id: guji-项谦-event-canxue
  date: 1635
  year_of: 1635
  title_zh: 首谒博山余集生遍参尊宿
  description: 礼崇国洪慈览心经华严合论叹成佛真实谒博山集生等三十余员得其皮骨孜孜参究
- id: guji-项谦-event-nanben
  date: 1644
  year_of: 1644
  title_zh: 甲申陷京南奔全活
  description: 甲申闯陷京率家丁巷战衣不受损徒步奔南屡遇暴不能害从张完真陈天章幕下克全万万生命
- id: guji-项谦-event-zhangzhou
  date: 1647
  year_of: 1647
  title_zh: 题授漳州别驾
  description: 两公交章题授漳州别驾以慈禁暴备荒申救冤抑保护甚众望隆丹屿泽被清漳
- id: guji-项谦-event-wudao
  date: 1652
  year_of: 1652
  title_zh: 福州见空隐礼忏脱落
  description: 壬辰至福州见华首空隐蒙授准提忏像礼忏至佛身充满法界处身心脱落述一手拈磬偈
- id: guji-项谦-event-sifa
  date: 1659
  year_of: 1659
  title_zh: 金明介庵嗣法为临济三十二世
  description: 己亥春参金明介庵以拳示涅槃心以坠示无情说法以扶桑偈契蜜蜂颂得印可受源流衣拂名真本号次庵时年四十三
- id: guji-项谦-event-death
  date: 1680
  year_of: 1680
  title_zh: 瓶山示寂后究心录行世
  description: 开堂示众拈古颂古付坦庵峻等衣拂嘱固守法道门人机峻等编究心录康熙壬寅谭贞默作序木陈玉林等赞塔未详示寂确年附存
