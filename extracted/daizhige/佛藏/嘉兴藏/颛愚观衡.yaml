  dilemmas:
  - 宗门衰微之时如何以一灯续慧命而不随波逐浪
  - 禅讲律相诤之际如何融通三学而不落空见与执着
  lesson: 信向一师直下承当，禅净律并进，方能续佛慧命利己利人
  summary_first_person: 吾颛愚观衡，久病潜修于邵陵澬江，后嗣法憨山老人，住持云居同安与紫竹林，日以念佛三百声摄持身心，融禅讲律为一体，示人以回光返照念佛成佛之旨，愿尽大地众生同入弥陀愿海
