endeavors:
- id: guji-颛愚衡-endeavor-1
  title_zh: 嗣法憨山开堂弘禅
  summary: 由邵陵结茅潜修而嗣法憨山，历住云居同安紫竹林，开堂示众，勘验学人，直指见性
  phases:
  - key: brewing
    name: 邵陵结茅潜修
    labels:
      zh: 卧疾澬江潜心参究
    start_date: 1600
    highlight_event_id: guji-颛愚衡-event-brew
  - key: breakthrough
    name: 嗣法憨山老人
    labels:
      zh: 问答契合得法嗣
    start_date: 1618
    highlight_event_id: guji-颛愚衡-event-dharma
  - key: climax
    name: 住持云居同安开堂
    labels:
      zh: 拈提棒喝接引四方
    start_date: 1630
    highlight_event_id: guji-颛愚衡-event-abbot
  - key: closure
    name: 紫竹林付嘱嗣法
    labels:
      zh: 付法法玺灯续不绝
    start_date: 1643
    highlight_event_id: guji-颛愚衡-event-death
  decisions:
  - date: 1618
    title_zh: 始终信向憨山老人
    rationale: 不随南宗风驰涛涌，独信一来处分明之师，故能顶骨莲花声光赫奕
  - date: 1630
    title_zh: 不立棒喝专务直承
    rationale: 自言根性下劣不敢妄拟棒喝，只要学人各自直下承当随方接引，不负来机
- id: guji-颛愚衡-endeavor-2
  title_zh: 融通禅净著述流通
  summary: 以念佛为总相法门，融禅讲律为一体，日课弥陀三百声，著语录二十卷普劝同入愿海
  phases:
  - key: brewing
    name: 辨禅律性相之诤
    labels:
      zh: 禅律性相本是一体
    start_date: 1625
    highlight_event_id: guji-颛愚衡-event-dharma
  - key: breakthrough
    name: 倡念佛成佛总持
    labels:
      zh: 回光返照念佛即佛
    start_date: 1635
    highlight_event_id: guji-颛愚衡-event-abbot
  - key: climax
    name: 紫竹林普劝念佛
    labels:
      zh: 劝百千万亿人同念
    start_date: 1640
    highlight_event_id: guji-颛愚衡-event-teach
  - key: closure
    name: 语录删定入藏流通
    labels:
      zh: 法玺重编二十卷行世
    start_date: 1646
    highlight_event_id: guji-颛愚衡-event-death
  decisions:
  - date: 1635
    title_zh: 日课念佛三百声不增减
    rationale: 以此为摄持身心决定胜行，为佛法住持成佛根本，不被寒热闲忙转移
  - date: 1640
    title_zh: 以念佛二字总摄三藏
    rationale: 诸佛出世唯说成佛一事，成佛无别作用唯只念佛，因果万行皆其差别之相
events:
- id: guji-颛愚衡-event-birth
  title_zh: 降生
  date: 1579
  year_of: 1579
  place_zh: 湖广衡州
  summary: 明万历七年左右降生，幼怀道骨，好书好山水，唯佛是期
- id: guji-颛愚衡-event-brew
  title_zh: 邵陵结茅卧病潜修
  date: 1600
  year_of: 1600
  place_zh: 邵陵双清矶五台庵
  summary: 为旧识接过邵陵结茅，调理病躯卧疾澬江一十五年，潜心参究透过差别法相
- id: guji-颛愚衡-event-dharma
  title_zh: 问答契合嗣法憨山
  date: 1618
  year_of: 1618
  place_zh: 都中柳巷一系
  summary: 以数言问答如函合盖，得憨山老人印可，为柳巷真子，续临济一脉，与龙池天童共出只手
- id: guji-颛愚衡-event-abbot
  title_zh: 住持云居同安开堂示众
  date: 1630
  year_of: 1630
  place_zh: 南康府同安寺云居
  summary: 开堂清化，示众晚参，呵口头三昧我慢邪解之弊，劝勇猛精进参究向上大事
- id: guji-颛愚衡-event-teach
  title_zh: 紫竹林倡念佛法门
  date: 1640
  year_of: 1640
  place_zh: 紫竹林
  summary: 应贯之毕居士请，举扬念佛二字为十方三世总相法门，普劝高贤名士同入弥陀愿海
- id: guji-颛愚衡-event-death
  title_zh: 示寂荼毘
  date: 1646
  year_of: 1646
  place_zh: 紫竹林
  summary: 示寂于明末清初之际，嗣法弟子法玺删定语录二十卷，康熙年间锓梓入大藏流通
