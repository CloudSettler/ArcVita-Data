events:
- id: guji-鲍宗肇-event-birth
  title_zh: 生于山阴天乐乡
  date: 1570
  year_of: 1570
  description: 万历间生山阴县天乐乡，父国祺母韩氏俱善信，第三子，弱冠具殊慧斥荤酒
  place_zh: 山阴天乐乡
- id: guji-鲍宗肇-event-youth-recite
  title_zh: 纸铺默背楞严十卷
  date: 1590
  year_of: 1590
  description: 尊人命开纸铺于郡东郭，以折阅罚跪，起已默背讫首楞严十卷，熟背法华如涌波泻水日每一周
  place_zh: 嘉兴东郭
- id: guji-鲍宗肇-event-study-chan
  title_zh: 从紫柏湛然参学晚皈云栖
  date: 1605
  year_of: 1605
  description: 中年亲没离室家参访，乐从紫柏大师散木老汉及湛然禅师往还，后北面皈依云栖莲池大师
  place_zh: 云栖
- id: guji-鲍宗肇-event-book
  title_zh: 无碍阁自序天乐鸣空集
  date: 1610-02-06
  year_of: 1610
  description: 万历庚戌上元前二日自序于无碍阁，以行解合一为宗，以悟后修行为正，兼悟宗镜，陶石梁订正
  place_zh: 无碍阁
- id: guji-鲍宗肇-event-death
  title_zh: 邀众念佛合掌坐化
  date: 1625
  year_of: 1625
  description: 临终预知时至，命子治斋邀王季常戴升之徐春门缁素十余众同声念佛竟日，日西合掌谢众不起于坐而化，所著胜方便金刚略解涂毒鼓声天乐鸣空集手授钱永明
  place_zh: 山阴家中
