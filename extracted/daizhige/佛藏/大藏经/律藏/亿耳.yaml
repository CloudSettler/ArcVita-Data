  decisions:
  - date: '-0575'
    title_zh: 父母殁后依圣出家
    rationale: 已见生死过患，恋亲故暂住，在家证预流化父母，亲亡即行出家以断淫怒痴
  - date: '-0560'
    title_zh: 代师问佛边地五事
    rationale: 怜边地十众难得地硬须皮革等，代迦多演那请制，以利后学安住修行
events:
- id: guji-亿耳-event-birth
  title_zh: 闻星下生名闻俱胝耳
  type: birth
  date: '-0600'
  year_of: -600
  place_zh: 婆索迦聚落力军长者家高楼
  description_zh: 长者力军久无子，祈诸天得娠，妻知五事，十月满足闻星下生，耳有宝珰珠直俱胝，因名闻俱胝耳，八乳母养之，学八种别艺
- id: guji-亿耳-event-sea
  title_zh: 与五百商人入海采宝安还
  type: career
  date: -0581
  year_of: -581
  place_zh: 大海宝所及海岸沙滩
  description_zh: 乘驴与五百商人雇五船师入海，多取宝物安稳而回，宿沙滩计算用度，遣奴视商人
- id: guji-亿耳-event-lost
  title_zh: 睡失商队独行至饿鬼城
  type: career
  date: -0581
  year_of: -581
  place_zh: 海畔旷野铁城饿鬼城
  description_zh: 日照风吹沙失路，驴困步行，入铁城求水不得，见五百饿鬼说悭骂业，方知是饿鬼城，仗福德得出
- id: guji-亿耳-event-vision
  title_zh: 历昼夜受报天宫及妇人座下饿鬼
  type: career
  date: -0581
  year_of: -581
  place_zh: 化天宫园苑师子座处
  description_zh: 见屠儿白日受苦夜受乐，见淫者夜受蛇绕昼受乐，见梵志女坐座四饿鬼为夫子妇奴，受托以屠羊处一瓶金事火炉下二瓶金卧床下四瓶金杖罐为信，夜宿被鬼送至婆索婆村灵床上
- id: guji-亿耳-event-message
  title_zh: 传信获验父母复明全家证预流
  type: career
  date: -0580
  year_of: -580
  place_zh: 婆索婆村杀羊处淫子家淫女家父母家
  description_zh: 穿地得金方得人信，以金齿被识为婆罗仙子，父母抱哭盲愈，暂住在家学诵证预流，为父母说四谛俱证预流
- id: guji-亿耳-event-ordination
  title_zh: 依迦多演那出家次第证阿罗汉
  type: career
  date: '-0575'
  year_of: -575
  place_zh: 阿湿婆兰德伽国婆索婆村
  description_zh: 父母殁后诣迦多演那求出家受近圆，边地十众乃满，先证一来不还，既近圆断诸烦恼证无学果堪受人天供养
- id: guji-亿耳-event-audience
  title_zh: 诣逝多林见佛诵经问边地五事
  type: career
  date: '-0560'
  year_of: -560
  place_zh: 室罗筏城逝多林给孤独园佛房内
  description_zh: 辞师渐游至逝多林，佛令阿难敷床同房右胁卧，夜过结跏诵佛成道所说经律蒙赞，代师问讯并问边地近圆浴净地硬皮革卧具送衣过十日事，请佛开制
- id: guji-亿耳-event-death
  title_zh: 般涅槃入灭
  type: death
  date: '-0520'
  year_of: -520
  place_zh: 西方边地婆索婆村一带
  description_zh: 已证无学广化边方，寿终般涅槃，皮革开制永利边地苾刍
