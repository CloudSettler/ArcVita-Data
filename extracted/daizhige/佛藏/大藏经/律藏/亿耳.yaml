    title_zh: 固请入海采宝
    rationale: 不甘坐食父财，欲自立代劳，虽父以险阻劝止，三请不移而行
  - date: -0581
    title_zh: 渴城中施食饿鬼并受三天托付
    rationale: 见苦生慈，虽妇嘱勿施而仍施之，闻业处苦乐，慨然领受传信以警生者
