  - 见恶趣苦报传信无人信与以金为验之困境
  - 恋亲孝养与出家断惑证圣之牵系
  lesson: 亲见生死过患则厌离自生，持戒布施虽小必感果，信金不信法乃世人常病
  summary_first_person: 我本力军长者子，名闻俱胝耳，因入海失伴，独历饿鬼城及昼夜受报天宫，传信归乡，以金为验，方得人信，后依圣者迦多演那出家，证预流一来不还乃至阿罗汉，复奉师命诣佛请问边地五事，蒙开皮革卧具等制
