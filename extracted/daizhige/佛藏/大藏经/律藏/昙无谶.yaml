  summary: 幼通經律，從白頭禪師學，遊龜茲鄯善，觀生死過患發菩提心，立志西來弘化
  phases:
  - key: brewing
    name: 中印少年習法
    labels:
      zh: 習學
    start_date: 0390
    highlight_event_id: guji-昙无谶-event-birth
  - key: breakthrough
    name: 從師參學悟緣起
    labels:
      zh: 參學
    start_date: '0400'
    highlight_event_id: guji-昙无谶-event-study
  - key: climax
    name: 遊歷西域觀苦發悲
    labels:
      zh: 遊方
    start_date: '0405'
    highlight_event_id: guji-昙无谶-event-west
  - key: closure
    name: 決意東入河西
    labels:
      zh: 發願
    start_date: '0410'
    highlight_event_id: guji-昙无谶-event-guzang
  decisions:
  - date: '0400'
    title_zh: 捨小趣大改習大乘
    rationale: 見聲聞厭多聞思惟有限，願求無師獨悟之佛菩提，故轉學大乘涅槃般若
  - date: '0410'
    title_zh: 不住天竺東入涼土
    rationale: 見西域眾生迷正路無示導，願以悲心拔濟，故冒險東行以法施中土
- id: guji-昙无谶-endeavor-2
  title_zh: 北涼姑臧譯經弘律
  summary: 應沮渠蒙遜之請居姑臧，譯大般涅槃經大集經優婆塞戒經等，開在家菩薩戒法，以悲戒為本教化善生等眾
  phases:
  - key: brewing
    name: 初至姑臧見機
    labels:
      zh: 駐錫
    start_date: '0412'
    highlight_event_id: guji-昙无谶-event-guzang
  - key: breakthrough
    name: 譯涅槃大集奠基
    labels:
      zh: 譯經
    start_date: '0414'
    highlight_event_id: guji-昙无谶-event-nirvana
  - key: climax
    name: 宣說優婆塞戒經
    labels:
      zh: 制戒
    start_date: '0421'
    highlight_event_id: guji-昙无谶-event-youposai
  - key: closure
    name: 法成遭忌殉法
    labels:
      zh: 圓寂
    start_date: '0433'
    highlight_event_id: guji-昙无谶-event-death
  decisions:
  - date: '0414'
    title_zh: 先譯涅槃以立佛性正見
    rationale: 為破外道定性無因果之邪見，先明一切眾生以善業因緣發心非定性，故首譯大般涅槃
  - date: '0421'
    title_zh: 為在家善生制優婆塞戒
    rationale: 見在家多惡因緣難修悲難得戒，若修悲即具戒忍進定慧，故說六方即六度以化長者子善生
events:
- id: guji-昙无谶-event-birth
  date: 0385
  year_of: 385
  title_zh: 生於中印度
  description: 曇無讖生於中天竺婆羅門家，幼聰慧通經律，為求大乘發菩提心之始
  location: 中印度
- id: guji-昙无谶-event-study
  date: '0400'
  year_of: 400
  title_zh: 從白頭禪師學定慧
  description: 遇白頭禪師，習禪定咒術，轉而厭小乘徑路，改學大乘般若涅槃之學
  location: 罽賓一帶
- id: guji-昙无谶-event-west
  date: '0405'
  year_of: 405
  title_zh: 遊歷龜茲鄯善觀苦
  description: 西域遊化，見眾生為五欲財物纏縛沉沒生死，修悲心為生因而堅固菩提願
  location: 龜茲鄯善
- id: guji-昙无谶-event-guzang
  date: '0412'
  year_of: 412
  title_zh: 至姑臧為沮渠蒙遜迎請
  description: 攜經入河西，沮渠蒙遜迎請居姑臧，開啟大規模譯場之業
  location: 涼州姑臧
- id: guji-昙无谶-event-nirvana
  date: '0414'
  year_of: 414
  title_zh: 譯大般涅槃經
  description: 在姑臧譯出大般涅槃經前分等，奠定北涼佛學基礎，名震關西
  location: 姑臧
- id: guji-昙无谶-event-youposai
  date: '0421'
  year_of: 421
  title_zh: 譯講優婆塞戒經授善生
  description: 以問答體為長者子善生說六波羅蜜為真六方，制在家六重戒，明悲為一切善法根本
  location: 姑臧
- id: guji-昙无谶-event-death
  date: '0433'
  year_of: 433
  title_zh: 被害於姑臧西郊
  description: 北魏忌其才，沮渠蒙遜遣刺客李衝殺之於道，譯業中輟而戒法已傳
  location: 姑臧
