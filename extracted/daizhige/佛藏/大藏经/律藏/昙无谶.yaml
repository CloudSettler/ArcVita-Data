    en: Dharmakshema
  lifespan:
    birth:
      date: 0385
      precision: year
      is_circa: true
      raw: 生年失載約四世紀末中印度人
    death:
      date: '0433'
      precision: year
      is_circa: false
      raw: 北涼承和元年被害於姑臧
  birth_date: 0385
  death_date: '0433'
  era: 南北朝
  reign_ref: 北涼沮渠蒙遜時
  archetype: 譯經弘法者
  dilemmas:
  - 在家弘法多惡因緣纏繞而堅持持戒修悲之難
  - 外道執定性無因果與佛法緣起發心之間的抉擇之難
  - 依止異國君王以護法譯經與保全法節之間的兩難
  lesson: 以悲為本發菩提心，在家亦能具足檀戒忍進定慧，少施少戒以厭離生死即獲無量果
  summary_first_person: 吾本中印度人，幼習大小乘經律，遊學西域，感眾生沉沒生死大海故發悲願，後入河西姑臧，為沮渠氏迎請譯大般涅槃及優婆塞戒等經，願以六波羅蜜示在家善生之正路，令一切善法以悲為根本
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E5%BE%8B%E8%97%8F/%E4%BC%98%E5%A9%86%E5%A1%9E%E6%88%92%E7%BB%8F.html
