  lesson: 以十戒离秽恶，以威仪摄身口，以布萨守清净，以慎度全慧命，终身奉行训导后生
  summary_first_person: 我以秽恶之身充弊人流，克己自悔，愿为弟子，归命佛法比丘僧，剃头被袈裟，受持十戒尽形寿不杀不盗不淫不嫁不妄语不歌舞不著香华不卧高床不饮酒过午不食，更习威仪七十事，受经省师夜卧檀越浴室烧香朝起浣衣行道皆有节度，除觐布萨共相警策，慎度守戒以报释迦文佛大恩
