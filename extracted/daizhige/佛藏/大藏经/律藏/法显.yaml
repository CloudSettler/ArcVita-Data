      - 艰难跋涉
      - 遍礼圣迹
    start_date: '0402'
    highlight_event_id: guji-法显-event-enter-india
  - key: climax
    name: 华氏城得律梵本
    labels:
      zh:
      - 求得律本
      - 留学研律
    start_date: '0406'
    highlight_event_id: guji-法显-event-obtain-vinaya
  - key: closure
    name: 海路东归建康
    labels:
      zh:
      - 泛海东归
      - 携经而返
    start_date: '0411'
    highlight_event_id: guji-法显-event-return
  decisions:
  - date: 0399
    title_zh: 结伴西行求律
    rationale: 中土律藏残缺受戒仪式难全故宁冒九死以求全本
  - date: '0410'
    title_zh: 泛海南归不留天竺
    rationale: 誓以所得律本弘传故土虽海难险阻亦携梵本东归
- id: guji-法显-endeavor-2
  title_zh: 建康译律集出戒本
  summary_zh: 归后住建康道场寺长干寺与佛驮跋陀罗等共译大般泥洹摩诃僧祇律等集出十诵比丘尼波罗提木叉戒本并著佛国记
  phases:
  - key: brewing
    name: 道场寺共译大经
    labels:
