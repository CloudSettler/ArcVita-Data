      - 规范僧制
    start_date: '0414'
    highlight_event_id: guji-法显-event-translate-vinaya
  - key: climax
    name: 长干寺集出尼戒本
    labels:
      zh:
      - 集出戒本
      - 弘范尼众
    start_date: '0415'
    highlight_event_id: guji-法显-event-compile-bhikkhuni
  - key: closure
    name: 著佛国记示后
    labels:
      zh:
      - 记述行迹
      - 圆寂荆州
    start_date: '0416'
    highlight_event_id: guji-法显-event-death
  decisions:
  - date: '0414'
    title_zh: 与佛驮跋陀罗共译律藏
    rationale: 独译力薄梵汉悬隔故须众智共成以传全律
  - date: '0415'
    title_zh: 集出十诵比丘尼戒本
    rationale: 尼众受持无依布萨难行故别集戒本以便半月诵持弘护
events:
- id: guji-法显-event-birth
  title_zh: 平阳出生出家
  date: '0337'
  year_of: 337
  description_zh: 约晋成帝咸康前后生平阳武阳幼年出家二十受具足常慨律藏不全
- id: guji-法显-event-departure
  title_zh: 自长安结侣西行
  date: 0399
  year_of: 399
  description_zh: 晋安帝隆安三年与慧景道整等自长安出发西度流沙赴西域天竺求律
- id: guji-法显-event-enter-india
  title_zh: 越葱岭遍礼天竺
  date: '0402'
  year_of: 402
  description_zh: 越葱岭入北天竺辗转中天竺遍礼佛陀圣迹研习梵语律仪
- id: guji-法显-event-obtain-vinaya
  title_zh: 华氏城求得律梵本
  date: '0406'
  year_of: 406
  description_zh: 于中天竺巴连弗邑得萨婆多部律等梵本留止研习抄写立志东归弘传
- id: guji-法显-event-return
  title_zh: 海路归达建康
  date: '0412'
  year_of: 412
  description_zh: 义熙八年自海路历尽艰险归达建康住道场寺青龙寺出所得梵本
- id: guji-法显-event-translate-vinaya
  title_zh: 道场寺共译经律
  date: '0414'
  year_of: 414
  description_zh: 于建康道场寺与佛驮跋陀罗共译摩诃僧祇律大般泥洹经等弘传中土
- id: guji-法显-event-compile-bhikkhuni
  title_zh: 长干寺集出尼戒本
  date: '0415'
  year_of: 415
  description_zh: 于宋长干寺集出十诵比丘尼波罗提木叉戒本详列八波罗夷十七僧残等以便尼众布萨诵持
- id: guji-法显-event-death
  title_zh: 荆州辛寺圆寂
  date: '0422'
  year_of: 422
  description_zh: 刘宋武帝永初三年寂于荆州辛寺寿八十余所著佛国记传于后世
