  title_zh: 西行天竺求取律本
  summary_zh: 隆安三年自长安结侣西行越流沙葱岭遍历西域北天竺中天竺于华氏城求得律梵本义熙八年海路东归建康
  phases:
  - key: brewing
    name: 长安结侣发愿
    labels:
