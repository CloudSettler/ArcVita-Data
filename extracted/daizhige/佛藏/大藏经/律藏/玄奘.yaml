endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法遍历五印
  summary: 贞观初年冒禁西行，经西域入印度那烂陀学法，求得瑜伽唯识真传而归
  phases:
  - key: brewing
    name: 长安问道疑团难解
    labels:
      zh: 求法初愿
    start_date: 0618
    highlight_event_id: guji-玄奘-event-study
  - key: breakthrough
    name: 冒禁出关西逾流沙
    labels:
      zh: 西行决意
    start_date: 0629
    highlight_event_id: guji-玄奘-event-departure
  - key: climax
    name: 那烂陀受学戒贤
    labels:
      zh: 穷源得法
    start_date: '0633'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: closure
    name: 负经东归长安迎接
    labels:
      zh: 载誉而归
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-return
  decisions:
  - date: 0629
    title_zh: 私出玉门冒禁西行
    rationale: 诸师章疏异说纷纭，欲证圆满正法，非亲往印度求瑜伽本典不可，宁就刑戮不违初愿
  - date: '0633'
    title_zh: 留学那烂陀师事戒贤
    rationale: 戒贤年高德劭深达瑜伽，欲穷唯识大义，须久住听受会通众说，不急游历以竟全功
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘传菩萨戒
  summary: 归国后居弘福大慈恩玉华等寺主持译场，译出大般若瑜伽师地菩萨戒本等大乘经论
  phases:
  - key: brewing
    name: 太宗诏住弘福筹建译场
    labels:
      zh: 译场肇始
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-return
  - key: breakthrough
    name: 大慈恩寺创制译经程式
    labels:
      zh: 译经鼎盛
    start_date: 0648
    highlight_event_id: guji-玄奘-event-translation
  - key: climax
    name: 译出瑜伽菩萨戒本颁行
    labels:
      zh: 戒律弘传
    start_date: 0649
    highlight_event_id: guji-玄奘-event-translation
  - key: closure
    name: 玉华宫译大般若示寂
    labels:
      zh: 灯传后学
    start_date: '0663'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645'
    title_zh: 受诏译经不居官爵
    rationale: 西行本为弘法利生，不为名利，谢绝朝命而愿以译经报国，使菩萨学处流行中土
  - date: 0649
    title_zh: 先译瑜伽菩萨地戒本
    rationale: 中土戒律偏重声闻别解脱，菩萨广大戒行未明，须先出菩萨戒本以立大乘正行纲宗
events:
- id: guji-玄奘-event-birth
  title_zh: 出生洛州缑氏
  date: '0602'
  year_of: 602
  description: 隋仁寿二年生于洛州缑氏陈氏，少聪慧好读书，隋末入洛阳净土寺出家
- id: guji-玄奘-event-study
  title_zh: 长安蜀地从师问道
  date: 0618
  year_of: 618
  description: 唐初遍访长安成都诸大德，学摄论俱舍涅槃等，而众说不一，遂发西行求法之愿
- id: guji-玄奘-event-departure
  title_zh: 贞观初年西出玉门
  date: 0629
  year_of: 629
  description: 贞观三年冒禁夜出玉门关，度莫贺延碛，经高昌龟兹凌山而往印度
- id: guji-玄奘-event-nalanda
  title_zh: 那烂陀师事戒贤学瑜伽
  date: '0633'
  year_of: 633
  description: 至中印度那烂陀寺，师事百岁戒贤，受学瑜伽师地论唯识等，兼通五明诸论
- id: guji-玄奘-event-return
  title_zh: 负经东归长安
  date: '0645-01-24'
  year_of: 645
  description: 贞观十九年正月归抵长安，携回梵本六百余部，太宗亲迎，诏住弘福寺从事翻译
- id: guji-玄奘-event-translation
  title_zh: 译出瑜伽菩萨戒本
  date: 0649
  year_of: 649
  description: 于大慈恩寺译出瑜伽论本地分中菩萨地所出菩萨戒本，弥勒菩萨说，奉诏译，明菩萨四重他胜及诸轻戒，开权显实弘传大乘戒行
- id: guji-玄奘-event-death
  title_zh: 示寂玉华宫
  date: '0664-02-05'
  year_of: 664
  description: 麟德元年正月初九寂于京兆玉华宫，高宗罢朝举哀，葬白鹿原，后迁樊川兴教寺塔
