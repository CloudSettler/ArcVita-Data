    death:
      date: '0664-02-05'
      precision: day
      is_circa: false
      raw: 唐麟德元年正月初九玉华宫
  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐代
  reign_ref: 唐太宗贞观至唐高宗麟德
  archetype: 西行求法高僧
  dilemmas:
  - 身居大唐而佛典阙略不全，欲求圆满瑜伽正法，当冒禁西行还是安守本分
  - 弘传大乘菩萨戒律，欲利他普度，当严守声闻旧制还是开权显实善巧饶益
  lesson: 为求圆满正法不惜生死远行，为利有情善权开合，持戒在心不在迹，译经传灯即是修行
  summary_first_person: 吾俗姓陈名袆，洛州人也。隋末出家，感诸师异说难解，贞观初年私出玉门，西逾流沙，遍历五印求法十七年。归国蒙诏译经，译出瑜伽师地论及此菩萨戒本等七十余部，但愿正法久住，菩萨学处流行世间，利乐一切有情。
  source_urls:
