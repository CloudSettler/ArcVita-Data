  dilemmas:
  - title_zh: 居士译经与持戒表率之难
    description_zh: 以白衣居士身译律藏斋法，需以自身持戒取信于众，又要使梵文斋法合于中土奉持。
  - title_zh: 梵汉会通与菩萨大愿之难
    description_zh: 菩萨受斋兼摄六波罗蜜与念佛往生，既要存梵本义，又要令中土信众能受能持。
  lesson: 以居士身护法译经，受斋持戒不在形迹而在利生大愿。
  summary_first_person: 吾乃西晋居士聂道真，随家学通梵汉，译菩萨受斋经，传菩萨斋日十戒十念及解斋之法，愿众生以斋戒资粮趣无上道，归命西方阿弥陀。
