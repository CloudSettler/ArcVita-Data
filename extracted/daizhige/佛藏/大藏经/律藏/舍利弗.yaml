  - key: breakthrough
    name: 备问戒律开闭随时之宜
    labels:
      zh: 律义抉择
    start_date: '-0500'
    highlight_event_id: guji-舍利弗-event-ask-vinaya
  - key: climax
    name: 深问酒肉威仪等难
    labels:
      zh: 疑难决择
    start_date: -0499
    highlight_event_id: guji-舍利弗-event-ask-precepts
  decisions:
  - date: '-0500'
    title_zh: 为天人众生问行法与不行法
    rationale: 令闻持传闻持者得名僧行法断邪见稠林
  - date: '-0500'
    title_zh: 追问戒律或开或闭后世云何奉持
    rationale: 恐后世四众无所依从故求佛说随时之义令迦叶等作大依止
- id: guji-舍利弗-endeavor-2
  title_zh: 请问鬼神业缘护持正法
  summary: 请问八部鬼神地神因缘像教护持及恩田福田令正法久住
  phases:
  - key: brewing
    name: 请问八部鬼神生恶道而闻法之缘
    labels:
      zh: 业缘请问
    start_date: -0498
    highlight_event_id: guji-舍利弗-event-ask-ghosts
  - key: climax
    name: 明辨邪师谄惑建立正法依止
    labels:
      zh: 邪正分别
    start_date: -0498
    highlight_event_id: guji-舍利弗-event-ask-ghosts
  - key: closure
    name: 请问经名流通欢喜奉行
    labels:
      zh: 结经流通
    start_date: -0497
    highlight_event_id: guji-舍利弗-event-conclusion
  decisions:
  - date: -0498
    title_zh: 问鬼神善恶同体护法之义
    rationale: 令众知布施善业与悭嫉嗔邪所感天龙等别发菩提正信
  - date: -0497
    title_zh: 问父母师僧恩谁为最及经名
    rationale: 令在家出家知报恩次第并立菩萨问喻舍利弗问之名以广流通
events:
- id: guji-舍利弗-event-birth
  title_zh: 生于摩揭陀那罗陀村
  date: -0568
  year_of: -568
  location: 古印度摩揭陀国那罗陀村
  description: 生婆罗门家少聪睿后从佛出家称声闻中智慧第一
- id: guji-舍利弗-event-ask-dharma
  title_zh: 罗阅只音乐树下问行法者
  date: '-0500'
  year_of: -500
  location: 罗阅只音乐树下
  description: 从座而起问云何名行法者不行法者佛答闻而持传闻而持皆名僧行我法者是行法者行非法者入邪见稠林
- id: guji-舍利弗-event-ask-vinaya
  title_zh: 问戒律或开或闭随时奉持
  date: '-0500'
  year_of: -500
  location: 罗阅只音乐树下
  description: 问朝食鱼肉薄粥饱食数数食等开闭不同后世云何奉持佛言此时行此语彼时行彼语迦叶等当分别作大依止
- id: guji-舍利弗-event-ask-precepts
  title_zh: 问酒病开遮道威仪等律
  date: -0499
  year_of: -499
  location: 罗阅只音乐树下
  description: 问寒国俗服擎钵受食饮酒病开腊月浴洗偏袒覆肩等佛随事决断酒为病开余守遮制
- id: guji-舍利弗-event-ask-ghosts
  title_zh: 问八部鬼神地神业缘
  date: -0498
  year_of: -498
  location: 罗阅只音乐树下
  description: 问八部以何业生恶道而闻正法佛说布施悭嗔邪师等二业感人非人教依正法远离谄惑邪导师
- id: guji-舍利弗-event-conclusion
  title_zh: 问恩田最胜及经名流通
  date: -0497
  year_of: -497
  location: 罗阅只音乐树下
  description: 问父母师僧恩谁最佛言在家孝父母出家师恩大问经名佛言当名菩萨问喻亦名舍利弗问众皆欢喜作礼而去
- id: guji-舍利弗-event-death
  title_zh: 先佛入般涅槃
  date: -0484
  year_of: -484
  location: 故乡那罗陀村
  description: 以智慧助化多年于佛灭前先入涅槃令众恋慕
