  decisions:
  - date: '0516'
    title_zh: 应请入华不顾道险
    rationale: 见中土法泽未周，愿以梵本补阙，遂冒越葱岭流沙而东
  - date: '0520'
    title_zh: 专攻方等毗尼并举
    rationale: 知中土重禅慧而轻律学，欲以戒幢为定慧之基，故兼译律部以全僧制
- id: guji-般若流支-endeavor-2
  title_zh: 邺都译出解脱戒经弘律
  summary: 武定癸亥年在邺都应侍中尚书令高澄之请，与僧昉合作译出迦叶毗部解脱戒经，补五部阙文以正布萨
  phases:
  - key: brewing
    name: 追访迦叶毗部戒本
    labels:
      zh: 访求戒本
    start_date: '0540'
    highlight_event_id: guji-般若流支-event-translate-luoyang
  - key: breakthrough
    name: 高澄延请开译场于邺
    labels:
      zh: 缔缘邺都
    start_date: '0543'
    highlight_event_id: guji-般若流支-event-translate-jietuo
  - key: climax
    name: 半月诵戒定四夷等篇
    labels:
      zh: 弘律高峰
    start_date: '0543'
    highlight_event_id: guji-般若流支-event-translate-jietuo
  - key: closure
    name: 僧昉述缘流通后世
    labels:
      zh: 述记流通
    start_date: '0545'
    highlight_event_id: guji-般若流支-event-death
  decisions:
  - date: '0543'
    title_zh: 剪世浮辞直存戒相
    rationale: 律文贵在简要持守，削除华饰，存波罗夷僧残不定舍堕波逸提之实相，令布萨可依
  - date: '0543'
    title_zh: 依迦叶毗部不杂他部
    rationale: 五部广律已多异说，此经独出迦叶毗部，当存其别义以备一家之言，不以他部混淆
