  reign_ref: 北魏熙平至东魏武定
  archetype: 西来译经弘律高僧
  dilemmas:
  - title_zh: 梵汉悬隔律义难传
    description: 迦叶毗部戒本精微，胡汉音义参差，若直译则难晓，若意译则恐失律制，如何两全
  - title_zh: 正法垂灭众论竞兴
    description: 大圣泯晖千纪之后，文学之徒异论竞兴，薄俗之士讪议满世，坚守戒律根本以续慧命抑或随俗方便以化时人
  lesson: 戒为定慧之基，译律即是护法，虽亿劫难闻亦当洗心敬受，和合持戒则正法久住
  summary_first_person: 我本中天竺波罗柰婆罗门，慕大魏佛法东流，熙平入洛，栖心译场，晚岁在邺都应高澄之请译出解脱戒经，愿摄受正修，令和合众生同护毗尼，共入涅槃
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E5%BE%8B%E8%97%8F/%E8%A7%A3%E8%84%B1%E6%88%92%E7%BB%8F.html
