  reign_ref: 周景王至周贞定王间佛在世时
  archetype: 头陀守律传持型
  dilemmas:
  - 巨富爱妻与出家求解脱之间如何割舍
  - 外道苦行十二年与逢佛闻正法之间如何抉择
  - 受谤不受具与依善根上受具自证之间如何持心
  lesson: 割爱守贫行头陀以无染乞食住四圣种能令毗尼久住
  summary_first_person: 我本毕波罗延生于王舍城婆罗门家舍金聚妻荣而出家林中十二年苦行后于多子塔逢佛闻四念处至八圣道树下七日夜尽漏证阿罗汉蒙佛立善根上受具受持粪扫衣行十二头陀不讥彼不自恃
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E5%BE%8B%E8%97%8F/%E6%AF%97%E5%B0%BC%E6%AF%8D%E7%BB%8F.html
endeavors:
- id: guji-迦叶-endeavor-1
  title_zh: 舍家苦行逢佛证果
  summary: 舍碎金巨富与跋陀妻出家林中十二年得五通后于多子塔见佛得须陀洹七日夜证阿罗汉
  phases:
  - key: brewing
    name: 舍家出家
    labels:
      zh: 割爱断贪
    start_date: -532
    highlight_event_id: guji-迦叶-event-renunciation
  - key: breakthrough
    name: 林中苦行
    labels:
      zh: 十二年茹菜得禅
    start_date: -531
    highlight_event_id: guji-迦叶-event-renunciation
  - key: climax
    name: 多子塔见佛
    labels:
      zh: 闻法得须陀洹
    start_date: -519
    highlight_event_id: guji-迦叶-event-meet-buddha
  - key: closure
    name: 七日证圣
    labels:
      zh: 立善根上受具
    start_date: -519
    highlight_event_id: guji-迦叶-event-arhat
  decisions:
  - date: -532
    title_zh: 割爱出家求真罗汉
    rationale: 思若世有应真罗汉即就之出家故舍金钱奴婢与妻往苦行林
  - date: -519
    title_zh: 寻光诣佛自归为弟子
    rationale: 见林光异寻千辐轮足迹见佛相好即信本期在此故三称姓字礼足受四念处教
- id: guji-迦叶-endeavor-2
  title_zh: 受持头陀证受具断谤
  summary: 受四圣种行十二头陀易迦尸衣取粪扫衣于王舍城僧坊自述本末断六群比丘谤
  phases:
  - key: brewing
    name: 住四圣种
    labels:
      zh: 粪扫衣饮食知足
    start_date: -519
    highlight_event_id: guji-迦叶-event-arhat
  - key: breakthrough
    name: 易衣持头陀
    labels:
      zh: 十二头陀常行
    start_date: -519
    highlight_event_id: guji-迦叶-event-head-dhutanga
  - key: climax
    name: 六群生谤
    labels:
      zh: 不与善来三语羯磨同
    start_date: -518
    highlight_event_id: guji-迦叶-event-vindication
  - key: closure
    name: 僧坊自证
    labels:
      zh: 佛证善法上受具
    start_date: -518
    highlight_event_id: guji-迦叶-event-vindication
  decisions:
  - date: -519
    title_zh: 献迦尸衣受粪扫衣
    rationale: 以初出家贵衣奉佛取最下粪扫衣受持以利益安隐多众故
  - date: -518
    title_zh: 对众述本末受佛证
    rationale: 为断未来比丘谤毁故于大僧坊陈舍家证果因缘从佛受决
events:
- id: guji-迦叶-event-birth
  date: -552
  year_of: -552
  title_zh: 王舍城婆罗门家生
  description: 父尼驹陀巨富生子毕波罗延种姓清净达婆罗门经书及大人相
- id: guji-迦叶-event-renunciation
  date: -532
  year_of: -532
  title_zh: 舍妻财出家苦行
  description: 父终后舍碎金九十六斛钱八十亿及跋陀妻诣苦行仙人林十二年茹菜饮泉得禅五通
- id: guji-迦叶-event-meet-buddha
  date: -519
  year_of: -519
  title_zh: 多子塔见佛闻法
  description: 佛与千二百五十比丘至摩竭提多子塔放光童子寻迹见佛礼足受四念处乃至八圣道及入聚落如蜂如月之教得须陀洹
- id: guji-迦叶-event-arhat
  date: -519
  year_of: -519
  title_zh: 树下七日证阿罗汉立上受具
  description: 一树下系念佛说七日七夜至八日朝漏尽得三明六通八解脱佛立善根上受具
- id: guji-迦叶-event-head-dhutanga
  date: -519
  year_of: -519
  title_zh: 住四圣种行十二头陀
  description: 对佛说粪扫衣饮食汤药知足不自恃讥彼行空闲乞食一坐树下冢间等十二头陀佛赞随行按行林薮并易衣
- id: guji-迦叶-event-vindication
  date: -518
  year_of: -518
  title_zh: 王舍城大僧坊断谤证具
  description: 六群比丘言非善来三语羯磨不受具不得共布萨佛集众令迦叶自陈本末证为多子塔善法上受具
- id: guji-迦叶-event-death
  date: -452
  year_of: -452
  title_zh: 入灭
  description: 佛灭后传持头陀苦行令正法久住年老入灭
