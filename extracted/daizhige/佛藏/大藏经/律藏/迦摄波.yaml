  description: 婆罗门尼拘律氏祷毕钵罗树而得子，名毕钵罗亦名迦摄波
- id: guji-迦摄波-event-study
  date: '-0535'
  year_of: -535
  title_zh: 明四薜陀为众师导
  description: 习四明及世间技艺，能显自宗善破他论，教五百婆罗门子
- id: guji-迦摄波-event-marriage
  date: '-0530'
  year_of: -530
  title_zh: 娶妙贤立誓同居守净
  description: 自往劫比罗城观妙贤，共立盟誓，同居一柱观十二年修清净行
- id: guji-迦摄波-event-trial
  date: -0528
  year_of: -528
  title_zh: 帝释化蛇试行不動
  description: 帝释化毒蛇欲啮妙贤，夫妇各守誓不相触，蛇毒不胜染毒之喻
- id: guji-迦摄波-event-renunciation
