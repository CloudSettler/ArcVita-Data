      - 罪中更作罪
      - 再白佛
    start_date: -0529
    highlight_event_id: guji-迦留陀比丘-event-benzhi
  - key: climax
    name: 僧中乞行如本治
    labels:
      zh:
      - 如本治
      - 白四羯磨
      - 重行苦行
    start_date: -0529
    highlight_event_id: guji-迦留陀比丘-event-benzhi
  - key: closure
    name: 本治竟乞出罪还净
    labels:
      zh:
      - 出罪羯磨
      - 二十人众
      - 还净
    start_date: -0529
    highlight_event_id: guji-迦留陀比丘-event-chuzui
  decisions:
  - date: -0529
    title_zh: 直乞六夜摩那埵苦行
    rationale: 一罪不覆藏故，不须波利婆沙，直于僧中乞六夜摩那埵以除罪
  - date: -0529
    title_zh: 再犯后乞如本治出罪
    rationale: 行法未竟更作一罪，依佛制如本治重行，行竟于僧中三乞出罪以求清净
  outcome_zh: 行本治竟得僧与出罪羯磨，还复清净比丘位
