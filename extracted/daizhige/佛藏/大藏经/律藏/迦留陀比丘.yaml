    title_zh: 发露覆藏罪白佛请治
    rationale: 不自知如何除罪，故语诸比丘转白世尊，依佛敕于僧中乞法
  - date: '-0530'
    title_zh: 僧中三乞波利婆沙
    rationale: 除覆藏罪故，偏袒入僧礼足胡跪，三说乞如覆藏日行法，依怜愍得与
  outcome_zh: 蒙僧与波利婆沙，依法行别住竟，得进乞六夜摩那埵
- id: guji-迦留陀比丘-endeavor-2
  title_zh: 行摩那埵本治求出罪
  role_zh: 行摩那埵比丘
  goal_zh: 六夜苦行还净，若罪中更作罪则行本治终得出罪
  summary_zh: 不覆藏例直乞六夜摩那埵，行未竟再犯则乞本治，本治行竟僧中乞出罪，二十众前得净。
