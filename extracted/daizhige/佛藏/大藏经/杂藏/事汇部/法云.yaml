- id: guji-法云-event-compilation
  date: '1143'
  year_of: 1143
  title_zh: 绍兴十三年编成翻译名义集
  description_zh: 居弥陀院扶病前后添削将二纪编成七卷六十四篇十号三身四洲七趣灿然在掌
- id: guji-法云-event-lotus
  date: '1144'
  year_of: 1144
  title_zh: 绍兴甲子归寺兴莲社
  description_zh: 寺僧请归作众依止迎像入寺大兴莲社集千人结课观经建八关金光明法华等会士夫善信多生净土
- id: guji-法云-event-death
  date: '1158-09-21'
  year_of: 1158
  title_zh: 绍兴二十八年九月二十一日示寂
  description_zh: 索浴更衣端坐西向书偈琼树矗云霄默然而蜕异香满室众闻称佛名住世七十一年为僧六十一腊火余舍利灿如圆珠现莲华迹二茎
