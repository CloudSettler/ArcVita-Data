    name: 龟兹学梵初习华梵对音
    labels:
      zh: 习梵
    start_date: 0760-01-01
    highlight_event_id: guji-礼言-event-birth
  - key: breakthrough
    name: 入长安充翻经大德
    labels:
      zh: 入京
    start_date: 0775-01-01
    highlight_event_id: guji-礼言-event-1
  - key: climax
    name: 兼翰林待诏参预诏译
    labels:
      zh: 待诏
    start_date: 0780-01-01
    highlight_event_id: guji-礼言-event-1
  - key: closure
    name: 以译场经验转向字书编纂
    labels:
      zh: 转向
    start_date: 0785-01-01
    highlight_event_id: guji-礼言-event-2
  decisions:
  - date: 0780-01-01
    title_zh: 应诏兼翰林待诏
    rationale: 借朝廷译场之力，广校梵本华本，积累音义对勘经验
  - date: 0785-01-01
    title_zh: 由口译转向笔录编次
    rationale: 译语散在难检，宜分类编录名物音训以利初学
- id: guji-礼言-endeavor-2
  title_zh: 编集梵语杂名
  summary_zh: 分类汇集天人身体色相饮食亲族数度等常用梵语，以汉字标音成杂名一卷。
  phases:
  - key: brewing
    name: 搜集译场散存梵汉对音
    labels:
      zh: 搜集
    start_date: 0782-01-01
    highlight_event_id: guji-礼言-event-1
  - key: breakthrough
    name: 立类编次身体色相名数
    labels:
      zh: 立类
    start_date: 0788-01-01
    highlight_event_id: guji-礼言-event-2
  - key: climax
    name: 梵语杂名一卷撰成
    labels:
      zh: 成书
    start_date: 0790-01-01
    highlight_event_id: guji-礼言-event-2
  - key: closure
    name: 流传译场后学传校
    labels:
      zh: 流传
    start_date: 0795-01-01
    highlight_event_id: guji-礼言-event-2
  decisions:
  - date: 0788-01-01
    title_zh: 以类相从不依经卷次第
    rationale: 有情身分色相饮食衣服亲族等各从其类，便于检寻记诵
  - date: 0790-01-01
    title_zh: 用汉字二合三合注梵连声
    rationale: 梵有连声华无此音，非合字难存本音，故创二合三合之例
