  death_date: 0820-01-01
  era: 唐
  reign_ref: 唐代宗至德宗朝
  archetype: 译师
  dilemmas:
  - 梵音繁多而华音有限，如何以汉字转写存其本音又便初学诵持
  - 译经重义理而杂名重名物音训，如何兼顾义学与小学使后人有据可依
  lesson: 以华文系联梵音，集杂名以便观览，令后学有门可入。
  summary_first_person: 吾龟兹沙门礼言，蒙命为翻经大德兼翰林待诏，久参梵汉音义，遂集有情身分乃至亲族名数等梵语杂名，以汉字注其音声，冀初学易晓而传译有征。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/杂藏/事汇部/梵语杂名.md
  - https://daizhige.org/佛藏/大藏经/杂藏/事汇部/梵语杂名.html
  - https://cbetaonline.dila.edu.tw/zh/T2135
