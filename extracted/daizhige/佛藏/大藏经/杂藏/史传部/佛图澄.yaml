person:
  qid: guji-佛图澄
  name_zh: 佛图澄
  names:
    zh: 佛图澄
    en: Fotucheng
  lifespan:
    birth:
      date: '0232-01-01'
      precision: year
      is_circa: true
      raw: 约魏太和六年生于西域
    death:
      date: '0348-01-01'
      precision: year
      is_circa: false
      raw: 后赵建武十四年卒于邺
  birth_date: '0232-01-01'
  death_date: '0348-01-01'
  era: 两晋十六国
  reign_ref: 后赵建平至建武石勒石虎朝
  archetype: 神异护生国师
  dilemmas:
  - 以道术近事摄化暴君与以正法深理化导之衡
  - 救活当诛残众以护生与不预国政杀罚之界
  - 显神通取信以弘法与恐人唯信神异不信佛法之虑
  lesson: 以慈护生，以神摄暴，以谏止杀，乱世神僧亦能转杀伐为护法之缘。
  summary_first_person: 我本西域白氏，少出家诵经，永嘉四年至洛阳。值中原扰攘，潜身葛陂，以水生青莲取信石勒，劝以德化止杀活人十之八九。后镇襄国邺都，祈水擒敌，预谶吉凶，事必见咨，人不敢起恶心向我。虽处暴君之朝，常以护生谏杀为任，终老于赵。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/杂藏/史传部/御制神僧传.md
  - https://daizhige.org/佛藏/大藏经/杂藏/史传部/御制神僧传.html
endeavors:
- id: guji-佛图澄-endeavor-1
  title_zh: 葛陂投勒以神化暴君护生
  summary: 自洛阳潜身草野，投郭黑略见石勒，以咒水生莲取信，谏以德化休咎，护全诛残，祈水济城，预言擒获，遂为大和尚。
  phases:
  - key: brewing
    name: 适洛潜身观变
    labels:
      zh:
      - 西来弘法
      - 观世待机
    start_date: '0310-01-01'
    highlight_event_id: guji-佛图澄-event-luoyang
  - key: breakthrough
    name: 青莲取信谏杀
    labels:
      zh:
      - 神咒摄化
      - 谏杀护生
    start_date: '0319-01-01'
    highlight_event_id: guji-佛图澄-event-huahu
  - key: climax
    name: 祈水擒敌显验
    labels:
      zh:
      - 敕龙致水
      - 预言擒曜
    start_date: '0328-01-01'
    highlight_event_id: guji-佛图澄-event-qinyao
  - key: closure
    name: 铃鸣预丧勒终
    labels:
      zh:
      - 铃音预谶
      - 国丧应验
    start_date: '0333-04-01'
    highlight_event_id: guji-佛图澄-event-lingshi
  decisions:
  - date: '0319-01-01'
    title_zh: 杖策投勒以近事为证
    rationale: 知勒不达深理，止可以道术为教，故取器咒水生莲，使暴君信伏而听谏。
  - date: '0324-01-01'
    title_zh: 敕龙取水释嘲护城
    rationale: 襄国堑水暴竭，勒以龙字相嘲，不避嫌隙，诣泉咒愿三日致水，以实效解谤全城。
- id: guji-佛图澄-endeavor-2
  title_zh: 邺都辅虎镇俗显圣
  summary: 石虎迁都于邺，倾心事澄过于勒，澄止中寺，察幽独，救稚子，谏亲杀，诃怨谤，化外寇危疑为信悟。
  phases:
  - key: brewing
    name: 随迁止邺中寺
    labels:
      zh:
      - 镇国止住
      - 事必见咨
    start_date: '0334-01-01'
    highlight_event_id: guji-佛图澄-event-lingshi
  - key: breakthrough
    name: 杨枝起死灌佛发愿
    labels:
      zh:
      - 医疾起死
      - 佛诞祈福
    start_date: '0335-01-01'
    highlight_event_id: guji-佛图澄-event-qinyao
  - key: climax
    name: 直谏纵心亲杀怨谤
    labels:
      zh:
      - 谏止亲杀
      - 示宿世因
    start_date: '0340-01-01'
    highlight_event_id: guji-佛图澄-event-huahu
  - key: closure
    name: 示寂邺都化缘终竟
    labels:
      zh:
      - 护法终老
      - 神化流传
    start_date: '0348-01-01'
    highlight_event_id: guji-佛图澄-event-death
  decisions:
  - date: '0336-01-01'
    title_zh: 察邃谋难言而曲护
    rationale: 知太子荒酒图逆，欲言难言欲忍难忍，故托天神语止过邃门，不预废立而全僧节。
  - date: '0341-01-01'
    title_zh: 面诃虎怨谤三宝
    rationale: 虎以三方告急而怨佛无神，夜兴毒念，故明言过去罽宾供会宿因，令跪谢信悟，护法不畏王威。
events:
- id: guji-佛图澄-event-birth
  title_zh: 生于西域白氏出家诵经
  date: '0232-01-01'
  year_of: 232
  place_zh: 西域
  description: 本姓白氏，少出家清真务学，诵经数百万言，善念神咒，能役使鬼物，油涂掌见千里外事。
- id: guji-佛图澄-event-luoyang
  title_zh: 永嘉四年适洛阳潜身草野
  date: '0310-01-01'
  year_of: 310
  place_zh: 洛阳葛陂
  description: 志弘大法欲立寺，值刘曜寇洛京师扰乱，潜身草野观变，投大将郭黑略家受戒，预言征伐胜负，为石勒所知。
- id: guji-佛图澄-event-huahu
  title_zh: 咒水生青莲谏勒护生
  date: '0319-01-01'
  year_of: 319
  place_zh: 葛陂军门襄国
  description: 取器盛水烧香咒之，须臾生青莲华光色耀目，勒信伏，澄谏以德化则四灵表瑞，政弊则彗孛见，应被诛残蒙益十有八九，又咒杨枝起石斌暴亡稚子。
- id: guji-佛图澄-event-qinyao
  title_zh: 祈水擒波执曜预验如神
  date: '0328-08-01'
  year_of: 328
  place_zh: 襄国洛阳
  description: 坐绳床咒愿三日致水，龙随水出隍堑皆满，预言明旦食时擒段波，又以羯语秀支替戾冈仆谷拘秃当预言出军捉得刘曜，涂掌见缚人朱丝约肘，果生擒曜。
- id: guji-佛图澄-event-lingshi
  title_zh: 塔铃独鸣预言勒丧虎立
  date: '0333-04-01'
  year_of: 333
  place_zh: 襄国邺城
  description: 建平四年四月天静无风塔上一铃独鸣，言国有大丧不出今年，是岁七月勒死，太子弘袭位，虎废弘自立迁都于邺，倾心事澄号大和尚。
- id: guji-佛图澄-event-death
  title_zh: 建武末示寂于邺中寺
  date: '0348-01-01'
  year_of: 348
  place_zh: 邺城中寺
  description: 久镇邺都，弟子交车夜谈亦逆知，诫收马谏亲杀，诃虎怨谤令信悟，化缘既毕端坐而化，胡汉奉法由之大兴。
