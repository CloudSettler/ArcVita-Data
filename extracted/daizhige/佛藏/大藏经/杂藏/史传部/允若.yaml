    rationale: 察思清兼业昭圆异说之非，欲得法智正传，故遍参究阴观别理六即等文
  - date: 1323
    title_zh: 受请出住昌源净圣
    rationale: 虽院宇颓弊田芜室圮，欲以经度葺治复兴讲席，故力为经营三年成巨刹
- id: guji-允若-endeavor-2
  title_zh: 住持名山守节殉道
  summary_zh: 历主兴化圆通上竺，感泉重荣，晚隐云门修法华三昧，兵至不避以身殉法
