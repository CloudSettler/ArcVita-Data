  decisions:
  - date: 1350
    title_zh: 退隐云门修法华三昧
    rationale: 世缘将尽，欲以暮年专修净业，故筑精舍不复出应请
  - date: 1359
    title_zh: 拒众劝避危坐待贼
    rationale: 难不可苟免，对期将至当以身酬法，故斥众独坐辞色俱厉不屈
events:
- id: guji-允若-event-birth
  date: 1280
  year_of: 1280
  title_zh: 生于越之相里
  description: 郡之相里人，九岁能通春秋大义，稍长有绝尘之趣，依云门元和尚，十五祝发出家
- id: guji-允若-event-study
  date: 1294
  year_of: 1294
  title_zh: 师事大山恢湛堂究天台
  description: 首谒大山恢于杭之兴福授四教仪金錍等书，往依湛堂澄于南竺，精究阴观别理六即等文，察兼业异说之非，司宾客受器重，奉诏锡慈光圆照之号
- id: guji-允若-event-abbacy
  date: 1323
  year_of: 1323
  title_zh: 出住净圣兴化名重钱塘
  description: 元至治初出住昌源净圣院，经度田室成巨刹，摄众南竺居第一座，泰定中主杭之兴化，与天岸济我庵无等并称钱塘四依
- id: guji-允若-event-reclusion
  date: 1350
  year_of: 1350
  title_zh: 住圆通上竺退隐云门
  description: 至正住越之圆通迁上天竺，叩岩祷泉得缨络泉涌称再来泉，复退隐云门筑精舍专修法华三昧，与断江恩等称云门三高
- id: guji-允若-event-death
  date: 1359
  year_of: 1359
  title_zh: 兵乱守寺遇害荼毗获舍利
  description: 元至正十九年二月二十九日天下大乱，众欲拥避不从独危坐，贼入辞色俱厉挥刃中之白乳溢地，世寿八十僧腊六十五，荼毗舍利如菽无算，著内外集弟子友奎良谨等传法
