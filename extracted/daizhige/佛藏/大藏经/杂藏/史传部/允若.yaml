  lesson: 解行并重以弘天台，临难不屈以全僧格
  summary_first_person: 吾允若，号浮休，又号若耶，越之相里人，九岁通春秋，十五祝发，遍历大山恢湛堂之门，精究天台止观，四住名山，晚修法华三昧，至正兵乱中守寺不去，厉辞殉法
