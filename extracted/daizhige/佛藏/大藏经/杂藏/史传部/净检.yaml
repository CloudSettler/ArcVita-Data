  dilemmas:
  - 西域有尼众而此土法未具无师可依何以自立
  - 大僧传戒是非未定谤议交加何以抉择进退
  - 蓄徒养众清规未立何以摄化贵游与大众
  lesson: 立志求法则能开一方法源守戒摄众则能垂范千载
  summary_first_person: 我本彭城仲氏早寡家贫以教授琴书自给闻法始说法而悟但愿济度遂受十戒立竹林寺复登坛受具足戒为晋土尼众之始香花异瑞非我所求唯愿后人持戒不怠
