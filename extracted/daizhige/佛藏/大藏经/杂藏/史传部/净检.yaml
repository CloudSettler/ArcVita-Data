endeavors:
- id: guji-净检-endeavor-1
  title_zh: 宫城西门受十戒立竹林寺
  summary: 建兴中从法始受十戒集志同道二十四人共立竹林寺为晋土尼众之始
  phases:
  - key: brewing
    name: 教授琴书闻法信乐
    labels:
      zh: 求法萌志
    start_date: '0310'
    highlight_event_id: guji-净检-event-birth
    description: 少好学早寡家贫为贵游教授琴书闻法而乐莫由咨禀
  - key: breakthrough
    name: 造法始借经大悟
    labels:
      zh: 悟道求度
    start_date: '0315'
    highlight_event_id: guji-净检-event-shijie
    description: 遇沙门法始于宫城西门听法借经达旨愿见济度
  - key: climax
    name: 剃落受十戒立寺
    labels:
      zh: 开尼之始
    start_date: '0316'
    highlight_event_id: guji-净检-event-shijie
    description: 从和上受十戒同志二十四人共立竹林寺共咨净检如师
  - key: closure
    name: 蓄徒养众教化如风
    labels:
      zh: 摄众垂范
    start_date: '0320'
    highlight_event_id: guji-净检-event-shijie
    description: 蓄徒养众清雅有则说法教化信施随散先人后己
  decisions:
  - date: '0316'
    title_zh: 决意剃落受十戒
    rationale: 经云有比丘比丘尼则无异法虽无尼师可依亦当先受十戒开度
  - date: '0316'
    title_zh: 共立竹林寺摄同志
    rationale: 未有尼师则共推有德以成众无所依止则立寺以安众弘法
- id: guji-净检-endeavor-2
  title_zh: 升平登坛受具足戒成尼戒正源
  summary: 升平元年请昙摩羯多立戒坛登坛从大僧受具足戒羯磨日香气芬馥为晋土受戒之始
  phases:
  - key: brewing
    name: 僧建得尼羯磨戒本
    labels:
      zh: 法本东来
    start_date: '0350'
    highlight_event_id: guji-净检-event-juzu
    description: 咸康中僧建于月支国得僧祇尼羯磨及戒本尼法渐备
  - key: breakthrough
    name: 请立戒坛议法成否
    labels:
      zh: 决疑立坛
    start_date: 0357-02-08
    highlight_event_id: guji-净检-event-juzu
    description: 洛阳请昙摩羯多立戒坛道场以戒因缘经为难浮舟而去
  - key: climax
    name: 同坛受具足戒天香
    labels:
      zh: 戒体成就
    start_date: 0357-02-08
    highlight_event_id: guji-净检-event-juzu
    description: 净检等四人同坛从大僧受具戒羯磨日殊香芬馥阖众敬仰
  - key: closure
    name: 善修戒行虹化而去
    labels:
      zh: 功圆虹化
    start_date: '0361'
    highlight_event_id: guji-净检-event-death
    description: 善修戒行志学不休升平末闻香见赤气执手辞众腾空如虹而上
  decisions:
  - date: 0357-02-08
    title_zh: 坚持登坛从大僧受具戒
    rationale: 尼戒大同细异虽无法可承而十戒已受当续受具足以成正统
  - date: 0357-02-08
    title_zh: 不因难缘退却羯磨
    rationale: 道场难其法不成而爱道有高例边地十僧亦得授当依羯磨成就
