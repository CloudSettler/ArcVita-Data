  summary_first_person: 吾为大迦叶佛灭未久睹无数罗汉欲般泥洹痛金刚山坏而非常闇蔽乃召五百罗汉会于王舍城集经律法藏呵责阿难以成其道誓护父教令冥中复燃大灯
