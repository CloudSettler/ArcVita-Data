  lesson: 以文辅教以理证道是非分明方能舍利不坏清净自得不负平生
  summary_first_person: 吾姓李名契嵩字仲灵自号潜子藤州镡津人七岁出家十九游方得法于筠州洞山聪公庆历入吴乐钱塘湖山而税驾见士人宗韩退之排佛独作原教孝论明儒释一贯又著定祖图传法正宗记进于仁宗赐号明教晚居佛日示化灵隐愿以不坏之身明吾辩说不虚
