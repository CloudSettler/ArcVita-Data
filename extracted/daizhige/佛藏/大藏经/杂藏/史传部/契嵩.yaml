  description_zh: 宋真宗景德四年生于藤州七岁出家十三得度受具游方四方学禅律
- id: guji-契嵩-event-study
  title_zh: 南北游学究禅教律
  date: 1037
  year_of: 1037
  place_zh: 湖南筠州杭州
  description_zh: 遍参知识究云门之禅探经律之学病当时疑达磨正统遂发心考诸祖传授本末
- id: guji-契嵩-event-compile
  title_zh: 撰传法正宗记论成
  date: 1060
  year_of: 1060
  place_zh: 杭州南屏
  description_zh: 于南屏藏中得梁僧祐出三藏记及禅经不净观经序证自迦叶至大鉴三十四圣相承作论四十余篇勒十二卷并祖图
- id: guji-契嵩-event-memorial
  title_zh: 进辅教编正宗记赐明教
  date: 1061
  year_of: 1061
  place_zh: 开封
  description_zh: 与传法正宗记辅教编同进仁宗嘉纳赐号明教大师赐紫衣褒宠其护法之功敕入大藏
- id: guji-契嵩-event-death
  title_zh: 圆寂杭州六和塔
  date: 1072
  year_of: 1072
  place_zh: 杭州
  description_zh: 神宗熙宁五年六月示寂于杭州塔于西湖南屏寿六十六世寿亦云百岁者系碑传之误法嗣传其正宗之学
