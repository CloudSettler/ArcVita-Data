endeavors:
- id: guji-契嵩-endeavor-1
  title_zh: 考订世次撰传法正宗记论
  summary_zh: 辩付法藏传止二十四祖之阙引出三藏记禅经不净观经序证婆舍斯多以下四祖相承备二十八祖勒十二卷并祖图
  phases:
  - key: brewing
    name: 病付法藏传阙略
    labels:
      zh: 疑古探源
    start_date: 1037
    highlight_event_id: guji-契嵩-event-study
  - key: breakthrough
    name: 得出三藏记证四祖
    labels:
      zh: 据典立证
    start_date: 1053
    highlight_event_id: guji-契嵩-event-compile
  - key: climax
    name: 禅经续证二十八祖
    labels:
      zh: 续作补正
    start_date: 1060
    highlight_event_id: guji-契嵩-event-compile
  - key: closure
    name: 勒记十二卷并进朝廷
    labels:
      zh: 成书进御
    start_date: 1061
    highlight_event_id: guji-契嵩-event-memorial
  decisions:
  - date: 1053
    title_zh: 舍付法藏取萨婆多部相承录
    rationale: 付法藏师资国土无本末师子后便绝不合圣人预知传付之理故据僧祐所录以正之
  - date: 1060
    title_zh: 引禅经慧观序再证
    rationale: 跋陀远公所译在先付法藏出于毁教之后以后出补亡抗先见全本不可故以先译经序断苟诤
- id: guji-契嵩-endeavor-2
  title_zh: 会儒辅教会通护法
  summary_zh: 著辅教编崇教论谕蒙原教诸篇明儒佛一致上万言书以息排佛之论赐明教大师
  phases:
  - key: brewing
    name: 游方问道睹排佛论
    labels:
      zh: 游学省察
    start_date: 1027
    highlight_event_id: guji-契嵩-event-study
  - key: breakthrough
    name: 作原教辅教明一致
    labels:
      zh: 立论会通
    start_date: 1055
    highlight_event_id: guji-契嵩-event-memorial
  - key: climax
    name: 进书仁宗赐号明教
    labels:
      zh: 进书得护
    start_date: 1061
    highlight_event_id: guji-契嵩-event-memorial
  - key: closure
    name: 退居永安灵隐终杭州
    labels:
      zh: 安道终老
    start_date: 1067
    highlight_event_id: guji-契嵩-event-death
  decisions:
  - date: 1061
    title_zh: 进辅教编传法正宗记于阙下
    rationale: 欲假朝廷表章使正宗有定论异道不惑后学有归故不避讥谤上书
  - date: 1067
    title_zh: 退隐不居荣宠
    rationale: 道已明则身可晦守东山林下以全禅律之素不以名位累心
events:
