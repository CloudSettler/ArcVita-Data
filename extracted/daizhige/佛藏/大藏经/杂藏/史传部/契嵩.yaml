  title_zh: 示化灵隐茶毗舍利不坏
  date: '1072-07-11'
  year_of: 1072
  description: 熙宁五年六月初四日示化于灵隐世寿六十有六僧腊五十有三茶毗得六根不坏者三顶骨舍利数珠不坏葬永安院左陈舜俞作行业记
  person_id: guji-契嵩
