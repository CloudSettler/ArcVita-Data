  summary_first_person: 吾北天竺丈夫国富娄沙富罗国婆罗门子于萨婆多部出家先通毗婆沙义师辱于频阇诃外道吾造七十真实论以破僧佉又造俱舍六百偈以集众义后受兄无著劝发悟大乘遂解说华严涅槃法华般若维摩等经造唯识摄大乘等论终年八十舍命于阿緰阇国
