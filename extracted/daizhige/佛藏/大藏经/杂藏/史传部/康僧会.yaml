person:
  qid: guji-康僧会
  name_zh: 康僧会
  names:
    zh: 康僧会
    en: Kang Senghui
  lifespan:
    birth:
      date: '0200'
      precision: year
      is_circa: true
      raw: 汉末生于交趾生年不详约当汉末
    death:
      date: '0280-09-01'
      precision: month
      is_circa: false
      raw: 吴天纪四年九月遘疾而终当晋武太康元年
  birth_date: '0200'
  death_date: '0280-09-01'
  era: 三国吴
  reign_ref: 吴大帝孙权至乌程侯孙皓
  archetype: 感通兴教译经弘法者
  dilemmas:
  - 以舍利神异取信王权与守正不妄显之间如何权衡
  - 逢孙皓苛虐欲毁佛寺时以何义理折辩存教化主
  lesson: 至诚可感圣迹弘道须兼通儒玄以慈愿普被方能化导强王大兴江左之教
  summary_first_person: 吾本康居之后流寓交趾少年丧亲出家励行博通三藏东游建业三七祈得舍利感悟吴主创建初寺译经说法虽逢孙皓暴虐亦以报应之理护教存法江左佛法由是遂兴
  source_urls:
  - https://zh.wikisource.org/wiki/梁高僧傳/卷01
  - https://daizhige.org/佛藏/大藏经/杂藏/史传部/高僧傳.html
endeavors:
- id: guji-康僧会-endeavor-1
  title_zh: 建业感舍利立建初寺兴江左之教
  summary_zh: 自交趾杖锡东游于赤乌十年初达建邺以三七祈请感得舍利经历盘碎砧陷之验使孙权叹服建塔立寺号为建初遂开江左佛法之盛
  phases:
  - key: brewing
    name: 交趾出家博学蓄德
    labels:
      zh: 出家励行博通三藏
    start_date: '0220-01-01'
    highlight_event_id: guji-康僧会-event-birth
  - key: breakthrough
    name: 赤乌十年初达建邺
    labels:
      zh: 茅茨设像初被检察
    start_date: '0247-01-01'
    highlight_event_id: guji-康僧会-event-jianye
  - key: climax
    name: 三七祈请舍利烜赫
    labels:
      zh: 铜瓶感瑞盘碎砧陷
    start_date: '0248-01-01'
    highlight_event_id: guji-康僧会-event-sarira
  - key: closure
    name: 建塔立寺江左大兴
    labels:
      zh: 建初立名佛陀里成
    start_date: '0248-06-01'
    highlight_event_id: guji-康僧会-event-sarira
  decisions:
  - date: '0247-01-01'
    title_zh: 请期感舍利以表遗化
    rationale: 初见疑为矫异若空言教义难取信王权故以阿育王起塔之故事请期求舍利用神曜表佛遗化存亡在此一举
  - date: '0248-01-01'
    title_zh: 誓死为期三七不辍
    rationale: 七日二七寂然无应将加刑宪法属震惧故以文王既没文不在兹自励至诚尽命祈请终感瓶鸣获瑞
- id: guji-康僧会-endeavor-2
  title_zh: 折辩护教译经弘化化导孙皓
  summary_zh: 孙皓废淫祀并及佛寺遣张昱诘难既以妙辩折之复以善恶报应幽微之理开导其心因金像感疾授戒说法译出小品六度集诸经并传泥洹呗声守法以终
  phases:
  - key: brewing
    name: 建初译经行道说法
    labels:
      zh: 译经制呗注疏并行
    start_date: '0249-01-01'
    highlight_event_id: guji-康僧会-event-translate
  - key: breakthrough
    name: 张昱诘难折辩存寺
    labels:
      zh: 朝堂问对雷霆聋喻
    start_date: '0265-01-01'
    highlight_event_id: guji-康僧会-event-defend
  - key: climax
    name: 报应开悟金像忏悔授戒
    labels:
      zh: 地狱天宫劝沮慈愿普被
    start_date: '0270-01-01'
    highlight_event_id: guji-康僧会-event-defend
  - key: closure
    name: 译注功成示寂天纪
    labels:
      zh: 皓降于晋九月而终
    start_date: '0280-04-01'
    highlight_event_id: guji-康僧会-event-death
  decisions:
  - date: '0265-01-01'
    title_zh: 以近事报应开凶粗之心
    rationale: 皓性凶粗不及妙义若直陈空理难入故举赤乌醴泉积善余庆及地狱长苦天宫永乐以明劝沮因机施教
  - date: '0270-01-01'
    title_zh: 取本业愿代秘戒授皓
    rationale: 沙门戒文禁秘不可轻宣而皓求看法病亟忏悔故取本业百三十五愿分为二百五十事皆愿众生以慈广普感其善意全戒体而护正法
events:
- id: guji-康僧会-event-birth
  title_zh: 生于交趾少年丧亲出家
  date: '0200'
  year_of: 200
  location_zh: 交趾
  description_zh: 先为康居人世居天竺父因商贾移于交趾年十余岁二亲并终至孝服毕出家励行峻洁弘雅有识量明解三藏博览六经兼涉天文图纬
- id: guji-康僧会-event-jianye
  title_zh: 赤乌十年杖锡东游初达建邺
  date: '0247-01-01'
  year_of: 247
  location_zh: 建邺
  description_zh: 欲振道江左营立茅茨设像行道吴人初见沙门疑为矫异有司奏检察孙权召诘有何灵验遂陈舍利神曜及阿育王起塔八万四千之事
- id: guji-康僧会-event-sarira
  title_zh: 三七祈得舍利建建初寺
  date: '0248-01-01'
  year_of: 248
  location_zh: 吴宫建初寺佛陀里
  description_zh: 七日二七寂然无应三七五更瓶中枪然有声果获舍利五色光炎泻盘盘碎置铁砧击之砧陷舍利无损权大叹服即造塔立寺号建初江左大法遂兴
- id: guji-康僧会-event-defend
  title_zh: 孙皓欲毁佛寺折辩说法授戒
  date: '0268-01-01'
  year_of: 268
  location_zh: 建业吴宫建初寺
  description_zh: 皓废淫祀并欲毁佛寺遣张昱诘难自旦至夕不能屈后迎会问善恶报应对以孝慈则赤乌翔醴泉涌为恶则鬼诛人诛周孔示近迹佛教备幽微后因秽金像举身肿痛忏悔迎像授五戒旬日疾瘳
- id: guji-康僧会-event-translate
  title_zh: 译小品六度集注安般法镜传呗
  date: '0255-01-01'
  year_of: 255
  location_zh: 建初寺
  description_zh: 译出阿难念弥镜面王察微王梵皇小品六度集杂譬喻等妙得经体文义允正又传泥洹呗声清靡哀亮为一代模式并注安般守意法镜道树三经制序行世
- id: guji-康僧会-event-death
  title_zh: 吴亡之岁九月遘疾而终
  date: '0280-09-01'
  year_of: 280
  location_zh: 建业
  description_zh: 至吴天纪四年四月皓降晋九月遘疾而终是岁为晋武太康元年后至成帝咸和中苏峻焚塔司空何充重修平西赵诱见塔放光而生信敬图写遗像传于今
