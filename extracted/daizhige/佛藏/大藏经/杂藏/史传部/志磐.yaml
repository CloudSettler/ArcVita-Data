  lesson: 薪尽火传全在纪述，统正纪明则道不散乱，后学有所依归
  summary_first_person: 吾四明福泉沙门志磐，久从师学，寓东湖月波山，自宝祐戊午发心笔削，十载五稿，删补宗源释门二家，会归大藏教典儒史传录，断自释迦迄于法智，成佛祖统纪五十四卷，愿家藏人观，开性灵资治化，以报佛恩酬帝力
  source_urls:
