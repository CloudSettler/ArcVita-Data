    title_zh: 断自释迦迄于法智系正统
    rationale: 以一佛二十九祖为本纪，明化事系道统，如帝王正宝位传大业
  - date: 1265
    title_zh: 并用法运通塞志与历代会要
    rationale: 大法东流兴废无常，兼录儒释道禅教律开宗，令后人考通塞而知劝戒
  - date: 1269
    title_zh: 负笈诣白云堂求佛光考校
    rationale: 恐义乖文薉名位颠错，仰求耆宿审定，同志谋锓版以期流布
