    rationale: 得以观光三都礼五台曼殊披览燕金遗墟遂动撰书之志
  - date: 1324-01-01
    title_zh: 取佛祖住世本末论驳考订
    rationale: 欲去繁杂谬妄存证信不诬使佛道世道污隆并见以补名教
events:
- id: guji-念常-event-birth
  title_zh: 诞生于华亭黄氏
  date: 1282-03-12
  year_of: 1282
  place_zh: 华亭
  description_zh: 父文祐母杨氏祈嗣观音梦庞眉雪发长老托宿而娠是夜神光烛室异香逾日不散
- id: guji-念常-event-ordination
  title_zh: 依圆明院出家受具
  date: 1295-01-01
  year_of: 1295
  place_zh: 平江圆明院
  description_zh: 年十二恳父母求出家依体志习经书尚倜傥疏财慕义元贞乙未得江淮总统所文凭剃发受具
- id: guji-念常-event-awakening
  title_zh: 参佛智晦机得省掌记
  date: 1308-01-01
  year_of: 1308
  place_zh: 杭州净慈寺
  description_zh: 至大戊申往参自江西百丈迁净慈之佛智闻举角声因缘言下有省呈解得颔许俾掌记室服勤七年
- id: guji-念常-event-abbot
  title_zh: 迁径山后版住祥符说法
  date: 1315-01-01
  year_of: 1315
  place_zh: 嘉兴祥符寺
  description_zh: 延祐乙卯随佛智迁径山职后版表率后承遴选瑞世祥符姑苏万寿分半座延请说法众服有德
- id: guji-念常-event-capital
  title_zh: 乘驿赴京缮写黄金佛经
  date: 1323-05-01
  year_of: 1323
  place_zh: 大都及五台
  description_zh: 至治癸亥夏五乘驿赴京缮经暇日观光三都游览胜概礼五台出入翰相讨论坟典得帝师命坐授食
- id: guji-念常-event-compilation
  title_zh: 编成佛祖历代通载二十二卷
  date: 1341-06-11
  year_of: 1341
  place_zh: 嘉兴祥符寺
  description_zh: 历二十余年论驳异同参考讹正以天元甲子纪世主之年纪教门之事虞集作序冠首觉岸再序于至正四年
- id: guji-念常-event-death
  title_zh: 至正后示寂
  date: 1345-01-01
  year_of: 1345
  place_zh: 松江余山昭庆一带
  description_zh: 通载成后行世年寿未详附传止于至正四年系约以至正中示寂以全始终
