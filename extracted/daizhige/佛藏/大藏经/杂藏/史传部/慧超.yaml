  decisions:
  - date: '0724'
    title_zh: 取道北天入中天
    rationale: 不避雪山险道足贼，为先睹鹿野苑菩提伽耶等四大灵塔故
  - date: '0727'
    title_zh: 以简直之笔撰记
    rationale: 山川道里国王象马衣食佛法兴废，但记实见不加粉饰，使后人可据而行
