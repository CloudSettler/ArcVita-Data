  dilemmas:
  - title_zh: 安住传密与远游证真
    description: 留长安从金刚智译经传密则安稳显名，远赴五天则山海险远生死难测，终以亲证圣迹为先而决意西行
  - title_zh: 简直实录与粉饰奇观
    description: 西域五天风俗殊异见闻纷繁，若粉饰奇观则失真，若直书简略又恐人不信，故守耳目实录以存信史
  lesson: 不惮险远亲履其地，直书见闻以补史阙，方为求法实学
  summary_first_person: 吾新罗僧慧超，渡海入唐从金刚智受密法，发愿遍礼五天竺圣迹，历安西吐火罗罽宾建驮迦湿弥罗五天波斯大食诸地，归而直记山川国俗佛法兴废，愿后人因吾简记而知西行实境
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E6%9D%82%E8%97%8F/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E6%B8%B8%E6%96%B9%E8%AE%B0%E6%8A%84.html
