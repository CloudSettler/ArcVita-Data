  - date: '0723'
    title_zh: 不住京师决意远游
    rationale: 安住译场虽稳，然不见圣迹真境不能断疑，故以行证补闻思
- id: guji-慧超-endeavor-2
  title_zh: 遍历五天竺归撰行记
  description: 自安西出葱岭历小勃律吐火罗罽宾建驮乌长诸国，遍礼中西北南东五天竺及波斯大食，凡四年而归唐撰往五天竺国传
  phases:
