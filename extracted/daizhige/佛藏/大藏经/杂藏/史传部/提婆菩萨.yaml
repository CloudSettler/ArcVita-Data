person:
  qid: guji-提婆菩萨
  name_zh: 提婆菩萨
  names:
    zh: 提婆菩萨
    en: Aryadeva
  lifespan:
    birth:
      date: 0170-01-01
      precision: year
      is_circa: true
      raw: 约170年南天竺生
    death:
      date: 0270-01-01
      precision: year
      is_circa: true
      raw: 约270年闲林遇害蝉蜕去
  birth_date: 0170-01-01
  death_date: 0270-01-01
  era: 印度古代贵霜后期
  archetype: 破邪显正型论师
  dilemmas:
  - 以智辩破俗神执既要摧破偶像又不谤正神故先凿眼后设供以明神不托形
  - 以出家沙门化邪王既不得见又须伐本故应募为卫士以天战实验证一切智
  - 以慈悲对仇害既自命垂绝又愍愚贼未来苦故先嘱逃生后说无我无受者
  lesson: 不以质碍心不以辩求胜以破执显正以无我全慈方能令言不虚设化行于世
  summary_first_person: 我本南天竺婆罗门种少博识才辩独擅天竺我先诣大自在天庙破黄金像之惑凿出颇梨眼复以心供施左眼数万得神许我言不虚设遂诣龙树菩萨受出家法后见南天竺王信邪道沙门不通我应募宿卫以天与阿修罗战争取验王乃伏化万婆罗门同受戒我于王都建高座立三论屈八方论士三月度百余万人后入闲林造百论及四百论破诸邪见终为怀怨者以刀破腹我临终说苦乐依触无我无人嘱其速去勿追遂脱然而去时人号我为迦那提婆
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E6%9D%82%E8%97%8F/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E6%8F%90%E5%A9%86%E8%8F%A9%E8%90%A8%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E6%9D%82%E8%97%8F/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E6%8F%90%E5%A9%86%E8%8F%A9%E8%90%A8%E4%BC%A0.md
endeavors:
- id: guji-提婆菩萨-endeavor-1
  title_zh: 破大自在天像执施眼立信
  summary: 诣庙破像明神不假质复设供施眼求言不虚设为弘法立本
  phases:
  - key: brewing
    name: 赜探胸怀忧言不信
    labels:
      zh: 立志求信
    start_date: 0190-01-01
    highlight_event_id: guji-提婆菩萨-event-birth
  - key: breakthrough
    name: 入庙登梯凿出颇梨眼
    labels:
      zh: 破像显理
    start_date: 0200-01-01
    highlight_event_id: guji-提婆菩萨-event-poshen
  - key: climax
    name: 一夜备供施左眼数万
    labels:
      zh: 以心上施
    start_date: 0200-02-01
    highlight_event_id: guji-提婆菩萨-event-shiyan
  - key: closure
    name: 得神许愿诣龙树出家
    labels:
      zh: 归依受法
    start_date: 0205-01-01
    highlight_event_id: guji-提婆菩萨-event-chujia
  decisions:
  - date: 0200-01-01
    title_zh: 坚持入庙见像破质执
    rationale: 若神果灵见之无害正可验其威灵若假质荧惑当显精不托形故不惧百日失守而直入
  - date: 0200-02-01
    title_zh: 以左眼随出生施供神
    rationale: 神既以心相契所乏者眼以真上施酬其知敬且明身名本空施而不著故出眼数万不惜
- id: guji-提婆菩萨-endeavor-2
  title_zh: 化邪王立三论造论殉法
  summary: 应募化王建高座伏外道造百论四百论终遇害说无我而去
  phases:
  - key: brewing
    name: 应募宿卫伺机化王
    labels:
      zh: 伐本化主
    start_date: 0210-01-01
    highlight_event_id: guji-提婆菩萨-event-huawang
  - key: breakthrough
    name: 天战现验王伏万众受戒
    labels:
      zh: 取信王都
    start_date: 0215-01-01
    highlight_event_id: guji-提婆菩萨-event-huawang
  - key: climax
    name: 建高座立三论三月度百万
    labels:
      zh: 广破群邪
    start_date: 0220-01-01
    highlight_event_id: guji-提婆菩萨-event-sanlun
  - key: closure
    name: 闲林造论遇刺说法蝉蜕
    labels:
      zh: 以身殉法
    start_date: 0265-01-01
    highlight_event_id: guji-提婆菩萨-event-yuhai
  decisions:
  - date: 0210-01-01
    title_zh: 自称一切智人不食廪钱应募前驱
    rationale: 树不伐本条不倾主不化道不行王不见沙门故隐形宿卫以奇行感召问对
  - date: 0220-01-01
    title_zh: 立不斩首但剃发为弟子之要
    rationale: 所修法仁活万物立理不明乃愚痴非罪恶当以摄受代诛戮故屈者下发为弟子广度百余万人
  - date: 0270-01-01
    title_zh: 临危嘱贼上山勿下平道并说无受者
    rationale: 弟子未得法忍必追执送官王必困之贼未得法利徒增罪报故以衣钵资其逃生以无我法息众人之狂追
events:
- id: guji-提婆菩萨-event-birth
  title_zh: 南天竺婆罗门家生
  date: 0170-01-01
  year_of: 170
  place: 南天竺
  description: 提婆生于南天竺婆罗门种博识渊览才辩绝伦擅名天竺为诸国所推后为龙树菩萨弟子
- id: guji-提婆菩萨-event-poshen
  title_zh: 大自在天庙破像明理
  date: 0200-01-01
  year_of: 200
  place: 大自在天庙
  description: 众惧视像退后失守百日提婆直入见像怒目登梯凿出颇梨眼晓众神明远大不假质形吾既不慢神亦不辱
- id: guji-提婆菩萨-event-shiyan
  title_zh: 设供施左眼得愿
  date: 0200-02-01
  year_of: 200
  place: 大自在天庙
  description: 一夜备精馔供神神现肉形左眼枯涸叹未曾有索左眼提婆随出随生终朝出眼数万神许其言不虚设
- id: guji-提婆菩萨-event-chujia
  title_zh: 诣龙树受出家法
  date: 0205-01-01
  year_of: 205
  place: 龙树菩萨所
  description: 得神愿已诣龙树菩萨受出家法剃头法服周游扬化立志化南天竺信邪之王
- id: guji-提婆菩萨-event-huawang
  title_zh: 应募宿卫以天战化王
  date: 0215-01-01
  year_of: 215
  place: 南天竺王宫
  description: 王总御诸国信用邪道提婆应募为将荷戟前驱自称一切智人言天今与阿修罗战空中落干戈及手足耳鼻王稽首伏化殿上万婆罗门弃束发受成就戒
- id: guji-提婆菩萨-event-sanlun
  title_zh: 王都建高座立三论伏八方
  date: 0220-01-01
  year_of: 220
  place: 南天竺王都
  description: 立言佛圣最第一佛法正第一佛僧为第一与八方论士建无方论智浅者一言便屈深者二日辞匮皆剃发为弟子日送十车衣钵三月度百余万人又造百论二十品四百论破邪见
- id: guji-提婆菩萨-event-yuhai
  title_zh: 闲林被刺说法蝉蜕号迦那提婆
  date: 0270-01-01
  year_of: 270
  place: 闲林树下
  description: 邪弟子啮刀自誓以实刀困口辩趁经行以刀决其腹五藏委地提婆愍之授衣钵令上山说无人无主苦乐依触解著则息弟子集号啕追贼提婆诲无冤酷亲怨遂放身蝉蜕初出眼与神故无一眼时号迦那提婆
- id: guji-提婆菩萨-event-death
  title_zh: 蝉蜕示寂
  date: 0270-01-01
  year_of: 270
  place: 闲林
  description: 提婆为破腹后说无我法已脱然而去即其示寂时人以独眼故称为迦那提婆
