person:
  qid: guji-杨炫之
  name_zh: 杨炫之
  names:
    zh: 杨炫之
    en: Yang Xuanzhi
  lifespan:
    birth:
      date: 0499
      precision: year
      is_circa: true
      raw: 约北魏宣武帝时
    death:
      date: '0550'
      precision: year
      is_circa: true
      raw: 约东魏武定后
  birth_date: 0499
  death_date: '0550'
  era: 北魏至东魏
  reign_ref: 武定
  archetype: 秉笔存史之文吏
  dilemmas:
  - 目睹洛阳由极盛而丘墟欲存其真而自愧才非著述
  - 身经永熙迁邺之散欲记旧都而寺数最多不可遍写
  lesson: 城阙会倾而文字可传见盛衰而记之则不负目睹
  summary_first_person: 我本魏抚军府司马久居洛阳见伽蓝栉比宝塔骈罗暨永熙多难皇舆迁邺武定五年因行役重览洛阳见城郭崩毁寺观灰烬野兽穴阶农夫艺黍恐后世无传故先城内次城外表列门名以远近为五篇撰此记以存其盛衰
  source_urls:
  - https://zh.wikisource.org/wiki/洛阳伽蓝记
  - https://ctext.org/library.pl?if=gb&file=79168
