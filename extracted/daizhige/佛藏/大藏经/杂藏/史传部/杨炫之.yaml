- id: guji-杨炫之-event-chaos
  title_zh: 经永熙之难随迁离洛
  date: '0532'
  year_of: 532
  place: 洛阳至邺
  description: 永熙多难皇舆迁邺诸寺僧尼亦与时徙洛阳自此倾覆之渐
- id: guji-杨炫之-event-revisit
  title_zh: 武定五年重览洛阳
  date: '0547'
  year_of: 547
  place: 洛阳
  description: 因行役重至洛阳见城郭崩毁寺观灰烬墙被蒿艾巷罗荆棘游儿牧竖踯躅九逵农夫艺黍双阙遂发撰记之愿
- id: guji-杨炫之-event-book
  title_zh: 撰成洛阳伽蓝记
  date: '0547'
  year_of: 547
  place: 邺下洛阳
  description: 以城内为始次及城外表列建春诸门名以远近为五篇记永宁建中瑶光诸寺兼载灵太后尔朱荣庄帝等兴亡事自愧才非著述以待后君子
- id: guji-杨炫之-event-death
  title_zh: 逝世
  date: '0550'
  year_of: 550
  place: 北方
  description: 撰记之后事迹不显约卒于东魏武定末年所撰伽蓝记独传洛阳旧制为后世所重
