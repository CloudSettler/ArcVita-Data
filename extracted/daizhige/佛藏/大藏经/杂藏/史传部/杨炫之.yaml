    start_date: '0547'
    highlight_event_id: guji-杨炫之-event-revisit
  decisions:
  - date: '0547'
    title_zh: 决意遍览城内外伽蓝
    rationale: 城郭崩毁钟声罕闻若不及时记录则千余寺湮没故先城内为始次及城外
  - date: '0547'
    title_zh: 定以门名为纲远近为篇
    rationale: 寺数最多不可遍写须取上大伽蓝详叙世谛事因故表列门名分五篇以统之
- id: guji-杨炫之-endeavor-2
  title_zh: 撰述洛阳伽蓝记五卷
  goal: 记伽蓝之制兼存人物史事使后有考
  role: 撰述者
  phases:
  - key: brewing
    name: 采集碑文见闻与旧典
    labels:
      zh: 采集资料
    start_date: '0547'
    highlight_event_id: guji-杨炫之-event-revisit
  - key: breakthrough
    name: 以永宁瑶光等大寺为纲
    labels:
      zh: 立纲记盛
    start_date: '0547'
    highlight_event_id: guji-杨炫之-event-book
  - key: climax
    name: 备载庄帝尔朱荣兴亡之事
    labels:
      zh: 兼载兴亡
    start_date: '0547'
    highlight_event_id: guji-杨炫之-event-book
  - key: closure
    name: 成书传世以待后君子
    labels:
      zh: 成书付后
    start_date: '0547'
    highlight_event_id: guji-杨炫之-event-book
  decisions:
  - date: '0547'
    title_zh: 以大伽蓝为主小者取详
    rationale: 恐繁芜难尽又虑遗珠故大者必录小者择其事关世谛者出之以求详略得中
  - date: '0547'
    title_zh: 兼记朝政人物不专写寺
    rationale: 寺之兴废系于时政人物若不载尔朱荣庄帝诸事则伽蓝盛衰无本故以史法入寺记
events:
