  date: 0844
  year_of: 844
  type: career
  description: 游及慈恩见官将并寺僧众草草泛问塔下画迹此后访寺遂绝
- id: guji-段成式-event-govern
  title_zh: 历职京洛出刺安成
  date: 0846
  year_of: 846
  type: career
