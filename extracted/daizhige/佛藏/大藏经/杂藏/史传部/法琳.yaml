  decisions:
  - date: 0617-01-01
    title_zh: 假衣黄巾从馆习道
    rationale: 素闲庄老而欲得葛妄张虚之旨与李氏奉释之谟故深入其门以备破邪之据
  - date: 0625-01-01
    title_zh: 致书杜公借阅内外文籍
    rationale: 以经书罕备史籍靡充而辩正未克就故仗杜公阿衡之力广采诸子晋宋释典相涉之书
  - date: 0626-01-01
    title_zh: 捃道寻儒卒成辩正
    rationale: 伤刘李贬量佛圣昏冒生灵故不以病废而文彪理炳以改群邪异辙革众迷惑心
events:
- id: guji-法琳-event-birth
  title_zh: 生于襄阳陈氏仲弓之后
  date: 0572-01-01
  year_of: 572
  place_zh: 襄阳
  description_zh: 俗姓陈氏颖川人远祖随宦徙寓襄阳幼齿抽簪情敦博物负帙金陵楚郢横经孔肆释筵
- id: guji-法琳-event-qingxi
  title_zh: 隐青溪鬼谷洞撰山记
  date: 0594-05-01
  year_of: 594
  place_zh: 青溪山鬼谷洞
  description_zh: 以隋开皇十四年夏五月隐于青溪阅览玄儒迥构岩庐撰青溪山记八千余言理趣铿锵
- id: guji-法琳-event-huangjin
  title_zh: 假衣黄巾穷三清秘典
  date: 0617-01-01
  year_of: 617
  place_zh: 关中
  description_zh: 以义宁初岁假衣黄巾从馆道士竞契金兰遂洞鉴三清秘典九府幽微得其虚妄之旨
- id: guji-法琳-event-duidafu
  title_zh: 应高祖诏问陈对出家利益
  date: 0619-01-01
  year_of: 619
  place_zh: 长安阙庭
  description_zh: 傅奕上废佛十一條高祖问弃发去服利在何门法琳伏槛陈对以四恩三有释其大顺高祖览而无辞
- id: guji-法琳-event-poxie
  title_zh: 上破邪论于皇储秦王
  date: 0623-05-02
  year_of: 623
  place_zh: 济法寺
  description_zh: 以武德五年春正月启储后武德六年五月二日启秦王著破邪论一卷斥傅奕谤黩皇储奏之高祖异焉其议遂寝
- id: guji-法琳-event-bianzheng
  title_zh: 借书杜如晦成辩正论
  date: 0626-01-01
  year_of: 626
  place_zh: 长安弘福寺
  description_zh: 伤李仲卿刘进喜十异九迷之谬致书杜如晦借内外文籍论成八轴十二篇陈子良为训诰传咏九州
- id: guji-法琳-event-death
  title_zh: 贞观中护法而卒
  date: 0640-01-01
  year_of: 640
  place_zh: 长安
  description_zh: 冒严刑而不改其节为季叶忠臣文言博雅理海宏深作大夜灯炬卒后彦琮勒为别传上下卷李怀琳为序
