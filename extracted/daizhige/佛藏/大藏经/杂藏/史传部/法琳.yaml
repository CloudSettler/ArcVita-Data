  name_zh: 法琳
  names:
    zh: 法琳
    en: Falin
  lifespan:
    birth:
      date: 0572-01-01
      precision: year
      is_circa: true
      raw: 约隋前生于襄阳陈氏
    death:
      date: 0640-01-01
      precision: year
      is_circa: true
      raw: 唐贞观十四年卒
  birth_date: 0572-01-01
  death_date: 0640-01-01
  era: 隋唐
  reign_ref: 唐高祖武德
  archetype: 护法沙门
  dilemmas:
  - 以出世沙门而犯颜阙庭直摧邪议舍身护法与全身远祸之间如何抉择
  - 以佛理折服黄巾而又须深入三清九府习其典籍尊道与斥道之间如何持正
  - 以笔墨破邪而恐激怒人主招致废毁并坐僧众立言与忍默之间如何权衡
  lesson: 维纲绝纽则匹夫亦须仗笔为堤以正见燃灯不避龙鳞严刑方为护法
  summary_first_person: 吾俗姓陈颖川之后寓居襄阳，少负帙问道于金陵楚郢，洞九部百家而叹大丈夫当立正摧邪，遂隐青溪鬼谷而味经观道，入关游秦假衣黄巾而穷三清之虚，及见傅奕上废佛之议而冒阙陈对著破邪论以折之，复借书杜公而成辩正八轴，虽触严刑而不移其节，但愿佛日再明而法流无壅
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E6%9D%82%E8%97%8F/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E5%94%90%E6%8A%A4%E6%B3%95%E6%B2%99%E9%97%A8%E6%B3%95%E7%90%B3%E5%88%AB%E4%BC%A0.html
