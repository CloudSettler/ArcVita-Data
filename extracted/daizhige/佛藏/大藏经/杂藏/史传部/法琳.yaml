  description_zh: 穷释老教源极品藻名理分三教治道十代奉佛佛道先后释李师资十喻九箴气为道本信毁交报品藻众书出道伪谬历世相承归心有地凡十二篇二百余纸修述多年弟子陈子良为之注解
