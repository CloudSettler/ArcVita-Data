  decisions:
  - date: 0618-01-01
    title_zh: 应诏陈对利益损益
    rationale: 假至道法身以明出家报恩之利引本行偈以示无常求解脱之志冀解高祖之疑
  - date: 0622-01-01
    title_zh: 启上储后广露破邪论
    rationale: 见傅奕公然流布秃丁胡鬼之谣恐秽华俗损福田故借储后雷响以折邪见幢
  - date: 0623-05-02
    title_zh: 再启秦王斥傅奕罔冒
    rationale: 以孔老师敬佛之文证斥其虚谬以三皇五帝非圣之问推佛为大圣冀寝废毁之议
- id: guji-法琳-endeavor-2
  title_zh: 穷道籍撰辩正论以革群迷
  goal_zh: 穷究三清九府之典纠刘李十异九迷之谬成一家护教之史
