  lesson: 以文证理折邪显正卫教护国
  summary_first_person: 吾俗姓陈颖川人也，晋司空群之后，少学三论长该众典，隋末隐青溪鬼谷十余载，见傅奕谤佛废僧，愤而撰破邪论以引儒道经史证佛为大圣，武德五年冒死上秦王与殿下，愿折邪见幢然正法炬而已。
