endeavors:
- id: guji-法琳-endeavor-1
  title_zh: 青溪潜修博通三教
  summary_zh: 隋开皇末隐青溪山鬼谷洞，经行恬静十余年，遍览儒释道，撰青溪山记及三教系谱释老宗源等，为后卫教立论奠基。
  phases:
  - key: brewing
    name: 少学三论名闻朝野
    labels:
      zh:
      - 博学
      - 三论
    start_date: 0585
    highlight_event_id: guji-法琳-event-birth
  - key: breakthrough
    name: 隐栖青溪潜修著述
    labels:
      zh:
      - 隐遁
      - 著述
    start_date: '0600'
    highlight_event_id: guji-法琳-event-seclusion
  - key: closure
    name: 勒成三十卷行于世
    labels:
      zh:
      - 集结
      - 传布
    start_date: '0620'
    highlight_event_id: guji-法琳-event-memorial-qin
  decisions:
  - date: '0600'
    title_zh: 隋末隐青溪鬼谷洞
    rationale: 避乱山林以全戒行，采芝饵术游八禅，观山川古迹以证道养望
  - date: '0610'
    title_zh: 广采诗赋碑志三教谱录成三十卷
    rationale: 以文翰会通儒释道，存师敬佛之证，为破邪预设文据
- id: guji-法琳-endeavor-2
  title_zh: 破邪卫教抗衡傅奕
  summary_zh: 针对太史令傅奕减省寺塔废僧尼十一條，逐条弹箴并引孔老经史及汉魏史籍，武德五年连上秦王与殿下破邪论二卷，力陈废佛损国福田。
  phases:
  - key: brewing
    name: 览傅奕奏五内分崩
    labels:
      zh:
      - 愤懑
      - 发愿
    start_date: '0621-06-20'
    highlight_event_id: guji-法琳-event-fuyi-memorial
  - key: climax
    name: 连启秦王与殿下上破邪论
    labels:
      zh:
      - 直谏
      - 卫教
    start_date: '0622-01-12'
    highlight_event_id: guji-法琳-event-memorial-qin
  - key: closure
    name: 破邪论流布长世
    labels:
      zh:
      - 流布
      - 护法
    start_date: '0622-01-27'
    highlight_event_id: guji-法琳-event-memorial-crown
  decisions:
  - date: '0622-01-12'
    title_zh: 上秦王启陈傅奕惑弄朝野
    rationale: 情切声哀理正言直，恐蕃国谓华夏无识，冒死录奕害事逐条件答
  - date: '0622-01-27'
    title_zh: 上殿下破邪论二卷请折邪幢
    rationale: 赖大唐中兴释门，愿殿下然正法炬津梁众生，不忍邪见损国福田
events:
- id: guji-法琳-event-birth
  date: '0572'
  year_of: 572
  title_zh: 诞生颖川陈氏
  description_zh: 俗姓陈颖川人，晋司空陈群之后，自梁及陈世传缨冕，祖及伯累叶儒宗，少学三论名闻朝野。
- id: guji-法琳-event-seclusion
  date: '0600'
  year_of: 600
  title_zh: 隋开皇末隐青溪鬼谷洞
  description_zh: 迥构岩崖蔽亏日月，饵松术披薜荔，经行恬静十有余年，撰青溪山记一卷见行于世。
- id: guji-法琳-event-fuyi-memorial
  date: '0621-06-20'
  year_of: 621
  title_zh: 傅奕上废僧尼事十一條
  description_zh: 武德四年六月二十日太史令傅奕请胡佛退还天竺沙门放归桑梓，道俗览之五内分崩，法琳发愿逐条弹箴。
- id: guji-法琳-event-memorial-qin
  date: '0622-01-12'
  year_of: 622
  title_zh: 武德五年上秦王启陈破邪
  description_zh: 济法寺沙门法琳冒死启秦王，引周书异记孔子列子及老子化胡等证佛为大圣，斥傅奕狂悖无识。
- id: guji-法琳-event-memorial-crown
  date: '0622-01-27'
  year_of: 622
  title_zh: 上殿下破邪论二卷
  description_zh: 缅寻三元五运陈像教东流六百年，伏愿殿下折邪见幢然正法炬，尘黩威严以护国福田。
- id: guji-法琳-event-death
  date: '0640'
  year_of: 640
  title_zh: 贞观十四年圆寂
  description_zh: 终身卫教著述三十卷，诗赋碑志赞颂箴诫记传启论及三教系谱并行，释种梁栋人伦羽仪。
