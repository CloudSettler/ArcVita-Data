  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐初
  reign_ref: 唐太宗贞观
  archetype: 西行求法译经高僧
  dilemmas:
  - 正觉遗文未备，冒禁远险西行与安居东夏之间的抉择
  - 学非沈秘而奉诏翻译弘宣，惧乖玄旨又恐蠹大猷的战栗
  lesson: 凭恃国威以弘宣，竭诚上表以感圣，方使龙宫秘旨东被中洲，慧云遐布，法雨中外同沾
  summary_first_person: 我是沙门玄奘，早预玄门，每恨正觉遗文未备，遂誓弘宣，远寻灵迹，历西域百三十八国，习梵言，览毗尼奥旨，窥多罗密藏，获梵本六百五十七部还献阙下，奉诏翻译，进大菩萨藏经等五十八卷及大唐西域记十二卷，屡表请圣制经序题经，蒙太宗制三藏圣教序，复请经论冠序流行，使迷生超尘，法无留滞
  source_urls:
