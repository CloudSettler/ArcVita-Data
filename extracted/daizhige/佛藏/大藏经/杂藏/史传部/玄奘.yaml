  dilemmas:
  - 众师异说明显有别而莫知适从是否当冒死西行以问所惑
  - 莫贺延碛失道绝水东归可生西进必死是否当违背先誓而东还
  - 高昌王厚留欲令终身供养讲授是否当屈从富贵而废止西游本愿
  lesson: 为求无阙正法不惜身命以诚感通终使东土得沾甘露
  summary_first_person: 吾姓陈名玄奘幼慕圣哲十三出家遍谒吴蜀京洛众师而义有隐显遂誓游西方贞观三年孤涉流沙历十七年穷百三十国取经六百五十七部归国蒙恩译于慈恩终身不懈以报佛恩
  source_urls:
