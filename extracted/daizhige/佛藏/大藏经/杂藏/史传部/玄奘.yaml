      - 览毗尼奥旨
      - 得经论像舍利
    start_date: '0641'
    highlight_event_id: guji-玄奘-event-huiguo
  - key: closure
    name: 旋轫玉门返帝京
    labels:
      zh:
      - 治装金地
      - 忽将二纪还献
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-huiguo
  decisions:
  - date: 0629
    title_zh: 冒禁西行问道遐方
    rationale: 正觉遗文未详备，慕异怀荒，上假皇灵，下资螾命，飘身迈迹，求遐自迩
  - date: '0645-02-15'
    title_zh: 携梵本归国奉进
    rationale: 所获梵本经论一千帙六百五十七部及佛像舍利，祗奉纶言，载合翻译，故诣阙奉进
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏翻译进表弘宣
  summary: 奉诏翻译，进经论西域记，屡请御制经序题经，并请流行天下
  phases:
  - key: brewing
    name: 开馆共证慧义
    labels:
      zh:
      - 爰召开士
      - 研思翻译
    start_date: '0645'
    highlight_event_id: guji-玄奘-event-jinjing
  - key: breakthrough
    name: 进经论及西域记
    labels:
      zh:
      - 进五十八卷
      - 进十二卷记
    start_date: '0646-07-13'
    highlight_event_id: guji-玄奘-event-jinjing
  - key: climax
    name: 屡表请制经序
    labels:
      zh:
      - 请作经序题经
      - 谢敕重祈
    start_date: 0648
    highlight_event_id: guji-玄奘-event-qingxu
  - key: closure
    name: 请经论冠序流行
    labels:
      zh:
      - 冠圣教序述圣记
      - 大郡名州各施一本
    start_date: 0649
    highlight_event_id: guji-玄奘-event-liuxing
  decisions:
  - date: '0646-07-13'
    title_zh: 进新翻经论奉阙
    rationale: 见绝笔者凡五十八卷，勒成八帙，及舍利像梵本，谨诣阙奉进，以副圣期重译之化
  - date: 0648
    title_zh: 请帝制序题经并请流行
    rationale: 神力无方非神思不足诠其理，圣教玄远非圣藻何以序其源，愿冠御制宣布远近，使慧云布遐迩，法雨澍中外
events:
- id: guji-玄奘-event-birth
  date: '0602'
  year_of: 602
  title_zh: 诞生洛州缑氏陈氏
  description: 隋末生于洛州缑氏，早预玄门，业尚空疏而誓弘宣，终成西行求法之缘起
- id: guji-玄奘-event-xixing
  date: 0629
  year_of: 629
  title_zh: 誓愿西行出玉门
  description: 贞观初凭恃国威远寻灵迹，出玉门，展转膜拜之乡，流离重译之外，往西域躬习梵言
- id: guji-玄奘-event-qiufa
  date: '0631'
  year_of: 631
  title_zh: 历百三十八国访圣迹
  description: 下雪岫泛提河，援鹤林栖鹫岭，览毗尼奥旨，窥多罗密藏，考条支罽宾之实，时移岁积言返帝京忽将二纪
- id: guji-玄奘-event-huiguo
  date: '0645-02-15'
  year_of: 645
  title_zh: 归国携梵本六百五十七部
  description: 贞观十九年归长安，所获梵本经论总一千帙六百五十七部，佛像七躯，舍利一函，旋轫玉门还献紫宸
- id: guji-玄奘-event-jinjing
  date: '0646-07-13'
  year_of: 646
  title_zh: 进经论五十八卷及西域记十二卷
  description: 贞观二十年七月十三日上进经论表，进大菩萨藏经等五部五十八卷，又缀大唐西域记十二卷，所闻所履百三十八国，缮写奉进
- id: guji-玄奘-event-qingxu
  date: 0648
  year_of: 648
  title_zh: 请太宗作经序谢敕重祈
  description: 上表请大宗文皇帝作经序并题经，奉墨敕奖喻未许，复谢敕重祈，终蒙制三藏圣教序，复谢述圣记，感圣藻照宣
- id: guji-玄奘-event-liuxing
  date: 0649
  year_of: 649
  title_zh: 请经论冠序流行天下
  description: 上请经论流行表及请经出流行启，请以御制圣教序及皇太子述圣记冠于译经之首，大郡名州各施一本，宣布远近咸使闻知
- id: guji-玄奘-event-death
  date: '0664-02-05'
  year_of: 664
  title_zh: 圆寂长安玉华宫
  description: 麟德元年圆寂于玉华宫，译经论七十余部千余卷，建大慈恩寺塔藏经，蒙帝制碑文，慧日增晖，迷生悟道
