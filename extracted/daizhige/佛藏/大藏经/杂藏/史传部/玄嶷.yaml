    title_zh: 立公子先生问答以衡断道教
    rationale: 滞俗触涂多懵习俗移人须假指南之辩以循循开晓故托二人之论以甄正邪
  - date: 0668
    title_zh: 据经史不载断天尊本虚
    rationale: 自无怀炎黄至汉魏晋宋史官备载祥瑞神祇而独无天尊故拔本塞源不劳繁述
- id: guji-玄嶷-endeavor-2
  title_zh: 住持大白马寺弘护佛法兼通道儒
  description_zh: 以诗礼坟籍为根基兼明儒史识辩幽微辨老庄本旨无三世因果之说揭陆修静等盗窃佛经增立三十六部三洞地狱天堂之伪以护正法
