    title_zh: 揭三十六部拟佛十二部之迹
    rationale: 道经本无因果业缘其名发自佛经每根开六法门凑成三十六故须指明趋日避影之伪
  - date: '0672'
    title_zh: 以乐氏得姓考破静信天尊
    rationale: 乐氏出自乐正子春殷末周初商周之书无载又无所化之域故据史验其虚妄
events:
- id: guji-玄嶷-event-birth
  title_zh: 诞生于唐初
  date: '0630'
  year_of: 630
  place_zh: 中土
  description_zh: 生于唐贞观前后长自聋俗之外而少闻诗礼长好坟籍
- id: guji-玄嶷-event-study
  title_zh: 入大白马寺博览群书
  date: '0650'
  year_of: 650
  place_zh: 大白马寺
  description_zh: 住大白马寺为僧披览书史简牍翰墨帝王政化凡圣教门莫不甄明是非久蓄灵台之鉴
- id: guji-玄嶷-event-shang
  title_zh: 撰成甄正论卷上破天尊三十二天
  date: 0668
  year_of: 668
  place_zh: 大白马寺
  description_zh: 设滞俗公子问甄正先生答援周易钩命决通卦序卦及历代史传破天尊在天地先之说辨灵宝伪经三十二天无大罗之号昙梵二字出自佛经玉字金书银函瑶格紫笔朱韬皆近代伪造
- id: guji-玄嶷-event-zhong
  title_zh: 撰成甄正论卷中破因果报应假托
  date: '0670'
  year_of: 670
  place_zh: 大白马寺
  description_zh: 论始青碧落度人十遍之益皆不委上天善恶又明天尊说经在上皇淳朴之代不应先说地狱天堂而老子当浇醨之代反说清虚兼破乐静信修道证天尊拟释迦出家之迹
- id: guji-玄嶷-event-death
  title_zh: 示寂
  date: '0700'
  year_of: 700
  place_zh: 大白马寺
  description_zh: 弘护既毕甄正之论流布以史证理之功终老于寺武周前后示寂
