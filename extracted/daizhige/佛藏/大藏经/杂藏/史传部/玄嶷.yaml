  - title_zh: 俗情滞惑与史证明伪
    description_zh: 滞俗公子久迷天尊灵宝之说当据书史典记权衡虚实以祛其惑
  - title_zh: 兼通道儒与专护佛法
    description_zh: 少闻诗礼长好坟籍既该儒史又辩幽微当甄明是非以显正法独步之旨
  lesson: 据史籍以权衡是非凭典记以拔本塞源则虚诞自彰而正法可显
  summary_first_person: 余住大白马寺少闻诗礼长好坟籍耽玩搜览甄明是非见道经推天尊为宗匠立三十二天三洞三十六部之说皆无史籍可征故设滞俗公子与甄正先生问答撰甄正论上下卷以穷其伪而指南迷津
