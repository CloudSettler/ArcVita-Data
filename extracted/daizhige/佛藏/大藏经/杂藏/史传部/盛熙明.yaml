  - 圣迹昭著而图志脱漏言辞庸谬，何以考信传远
  - 感应幽微而众生疑真伪去留，何以显非同非异以祛惑
  lesson: 旁搜经籍以考其实，推恻隐以躬行日用，方使灵迹可考而悲心可践
  summary_first_person: 吾乃大元丘兹盛熙明，号玄一道人，谢病居于海滨，恭叩补陀灵躅，旁搜经籍旧闻，首集自在功德，继考洞宇胜概应感兴建，附以天竺雾灵，集成此传，愿与善财同乘般若慈舟共达性境
