  decisions:
  - date: 1350-01-01
    title_zh: 存番本行程记之大略
    rationale: 考西竺至葛剌拶迦罗历魔碍见圣境之说，知圣地决非造次可至
  - date: 1361-04-15
    title_zh: 附天竺雾灵显非同非异
    rationale: 明常寂光遍周沙界，掘井见泉随处皆是，以断来者之疑
events:
- id: guji-盛熙明-event-birth
  date: 1320-01-01
  year_of: 1320
  title_zh: 盛熙明生于元代
  description: 丘兹人，生年不详，约十四世纪初，长而好游博涉经籍
- id: guji-盛熙明-event-1
  date: 1350-01-01
  year_of: 1350
  title_zh: 游五台闻番本补陀行程记
  description: 从五台密嘚哩室利师获聆番本补陀洛迦山行程，自西竺历罗刹鬼国宝池马首金刚圣多罗尊至紫竹栴檀之境
- id: guji-盛熙明-event-2
  date: 1358-01-01
  year_of: 1358
  title_zh: 谢病海滨叩灵躅搜经籍
  description: 偶在海滨恭叩补陀灵躅，旁搜经籍，首集观音功德，继考潮音善财盘陀三摩地诸胜及历代应感兴建
- id: guji-盛熙明-event-3
  date: 1361-04-15
  year_of: 1361
  title_zh: 寓四明盘谷集成补陀洛迦山传
  description: 至正辛丑四月望寓四明盘谷，成自在功德洞宇封域应感祥瑞兴建沿革附录大士赞名贤诗咏七品之传并自记其缘起
- id: guji-盛熙明-event-death
  date: 1380-01-01
  year_of: 1380
  title_zh: 盛熙明卒于元末明初
  description: 卒年不详，传成之后事迹无考，约终于元末明初之际
