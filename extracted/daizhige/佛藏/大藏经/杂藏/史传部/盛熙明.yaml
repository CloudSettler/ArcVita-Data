    title_zh: 首集自在功德继考洞宇
    rationale: 图志脱漏言辞庸谬，故先明菩萨行愿，后举胜概，以正其源
  - date: 1361-04-15
    title_zh: 分七品附赞咏以成传
    rationale: 使游目者不起于坐而飞神大方，推恻隐躬行日用，非徒空言
- id: guji-盛熙明-endeavor-2
  title_zh: 考辨显密道场以通感应之理
  summary: 尝游五台闻番本行程记，又疑补陀去留，梦悟信心所向即应身所在，附天竺雾灵以明无别无断
  phases:
  - key: brewing
