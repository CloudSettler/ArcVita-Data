  era: 古印度孔雀王朝阿育王时期（约公元前3世纪）
  reign_ref: 阿恕伽王（阿育王）在位期间
  archetype: 暴吏酷狱
  dilemmas:
  - 奉王命治罪人与滥杀无辜之间的冲突
  - 弑逆父母以求恶名的极端恶行
  - 狱约「入者不听出」最终反杀自身
  lesson: 作恶成狱、自陷其中；「我在前入，应前受罪」，恶法终归于作恶者
  summary_first_person: 我名耆梨，生于边陲山下织师之家，骂父骂母、毒涂草叶，举国号为恶耆梨。阿恕伽王遣使召我治罪，我辞父母而父母不听，即便杀之。我为王作爱乐狱，立约凡入此狱者不听出，并效比丘所诵地狱之刑以碓捣镬煮残害罪人。后比丘海入狱被掷沸镬，结跏趺坐千叶莲上，火不能热，我得见神变而惧。王因此归依佛法，欲出狱时我重申旧约欲杀之，王问谁先入狱，实我先入，王遂置我于胡胶舍中火烧而死，爱乐狱隳坏，众生得施无畏。
  source_urls:
  - 阿育王传/阿育王本缘传（西晋安法钦译）
