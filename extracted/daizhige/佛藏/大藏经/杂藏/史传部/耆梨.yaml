    rationale: 王先与我有要，入此狱者尽不听出
events:
- id: guji-耆梨-event-birth
  date: -144
  year_of: -220
  type: birth
  name_zh: 耆梨生于国边陲山下织师之家
  description: 织师生育一子名耆梨，为人极恶，骂父骂母，手则挈网脚则顿机，毒涂草叶虫兽，触者即死，举国号之为恶耆梨。
- id: guji-耆梨-event-summons
  date: -136
  year_of: -210
  type: summons
  name_zh: 阿恕伽王遣使召耆梨
  description: 王募恶人治罪，使语耆梨能为王治罪人不，耆梨答天下恶人使我治者犹故能为。耆梨辞父母，父母不听即便杀之，遂随使见王。
- id: guji-耆梨-event-prison
  date: -136
  year_of: -210
  type: achievement
  name_zh: 作爱乐狱
  description: 耆梨为王作狱极令严峻，名爱乐狱，立约若有入者不听出。闻比丘诵恶婴愚经地狱之刑，遂以碓捣镬煮治罪人。
- id: guji-耆梨-event-burning
  date: -128
  year_of: -200
  type: miracle
  name_zh: 比丘海于沸镬中结跏趺坐
  description: 耆梨掷比丘于大镬，下燃大火不能令热，见比丘结跏趺坐千叶莲花上，甚为惊怪，往白于王。王坏墙而入观此神变，深生信悟归依佛法。
- id: guji-耆梨-event-death
  date: -128
  year_of: -200
  type: death
  name_zh: 耆梨被置胡胶舍火烧而死
  description: 王欲出狱，耆梨引狱约欲杀王。王问为先入在前入，耆梨自言我在前入，王言汝在前入应前受罪，遂遣人捉耆梨置胡胶舍中以火烧杀，坏爱乐狱，施众生无畏。
