  desc_zh: 于南天竺师事般若多罗出家纳戒，证果得传大法眼藏，继为第二十八祖，游化西土绍隆正法四十余载
  phases:
  - key: brewing
    name: 王子求师出家
    labels:
      zh: 求法出家
    start_date: '0490-01-01'
    highlight_event_id: guji-菩提达磨-event-birth
  - key: breakthrough
    name: 得付心印绍祖位
    labels:
      zh: 付法绍祖
    start_date: '0500-01-01'
    highlight_event_id: guji-菩提达磨-event-transmission
  - key: climax
    name: 游化西土隆佛事
    labels:
      zh: 游化传法
    start_date: '0505-01-01'
    highlight_event_id: guji-菩提达磨-event-transmission
  - key: closure
    name: 立志东来救迷情
    labels:
      zh: 东行发愿
    start_date: '0520-01-01'
    highlight_event_id: guji-菩提达磨-event-east
  decisions:
  - date: '0500-01-01'
    title_zh: 禀受般若多罗付嘱继作祖
    rationale: 既证心性且符佛记，当绍持如来大法眼藏不断慧灯
  - date: '0520-01-01'
    title_zh: 决意以法东来震旦
    rationale: 西土化缘已周而东土迷情待救，当传直指人心之法于震旦
- id: guji-菩提达磨-endeavor-2
  title_zh: 东来震旦为初祖传禅
  desc_zh: 泛海东来初至梁地机缘不契，转往北魏止嵩少九年，付法慧可以及衣钵，为此土传法之初祖
  phases:
  - key: brewing
    name: 初至梁地不契
    labels:
      zh: 梁地观机
    start_date: '0527-01-01'
    highlight_event_id: guji-菩提达磨-event-east
  - key: breakthrough
    name: 止嵩少九年壁观
    labels:
      zh: 少林安心
    start_date: '0528-01-01'
    highlight_event_id: guji-菩提达磨-event-east
  - key: climax
    name: 立雪断臂付慧可
    labels:
      zh: 付法传衣
    start_date: '0532-01-01'
    highlight_event_id: guji-菩提达磨-event-huike
  - key: closure
    name: 去少林示灭留偈
    labels:
      zh: 示灭传偈
    start_date: '0536-01-01'
    highlight_event_id: guji-菩提达磨-event-death
  decisions:
  - date: '0527-06-01'
    title_zh: 舍梁往魏止于嵩少
    rationale: 梁地言教不契直指之旨，宜往北土待上根求道者至
  - date: '0532-01-01'
    title_zh: 以大法衣钵付慧可
    rationale: 慧可立雪断臂恳求法印堪荷心宗，当以衣钵为信开东土禅门
events:
