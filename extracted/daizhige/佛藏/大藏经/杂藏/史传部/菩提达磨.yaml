  date: '0532-01-01'
  year_of: 532
  desc_zh: 慧可立雪断臂求道，遂为易名付以大法并衣钵为信，为此土传法初祖，传偈吾本来兹土传法救迷情一花开五叶结果自然成
  endeavor_ref: guji-菩提达磨-endeavor-2
- id: guji-菩提达磨-event-death
  title_zh: 去少林示灭
  date: '0536-12-31'
  year_of: 536
  desc_zh: 付法既竟去少林而示灭度，正法眼藏藉慧可续传东土
  endeavor_ref: guji-菩提达磨-endeavor-2
