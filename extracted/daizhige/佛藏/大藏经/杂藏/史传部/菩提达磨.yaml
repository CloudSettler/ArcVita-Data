  endeavor_ref: guji-菩提达磨-endeavor-1
- id: guji-菩提达磨-event-transmission
  title_zh: 师事般若多罗得付大法
  date: '0500-01-01'
  year_of: 500
  desc_zh: 从般若多罗出家得传佛心印，为第二十八祖，得偈心地生诸种因事复生理果满菩提圆花开世界起
  endeavor_ref: guji-菩提达磨-endeavor-1
- id: guji-菩提达磨-event-east
  title_zh: 以法东来至梁入魏止嵩少
  date: '0527-01-01'
  year_of: 527
  desc_zh: 承师付后六十七年以法东来震旦，初至梁机缘不契乃往北魏止嵩少九年，不资文字直指人心见性成佛
  endeavor_ref: guji-菩提达磨-endeavor-2
