    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -0533-05-01
    title_zh: 遣弟子各往化物为人天福田
    rationale: 已度五人得道果，欲令正法广被，故命各行化而不独住
  - date: -0484-02-01
    title_zh: 以法与金缕衣付摩诃迦叶
    rationale: 化缘将毕，为令正法眼不断绝，故嘱迦叶护持并转授补处慈氏
events:
- id: guji-释迦牟尼-event-birth
  kind: birth
  title_zh: 无忧树下诞生
  date: -0563-04-08
  year_of: -563
  place_zh: 迦毗罗国蓝毗尼园无忧树下
  description: 摩耶夫人往园苑，于无忧树下自右胁诞圣子，神龙澍水，地发金莲，蹈七步称天上天下唯我独尊
- id: guji-释迦牟尼-event-renunciation
  kind: career
  title_zh: 逾城出家易服受戒
  date: -0544-02-08
  year_of: -544
  place_zh: 迦毗罗城北门至旃特山弥楼宝山
  description: 夜半天人厌守者昏睡，命车匿控犍陟自北门凌虚而去，绝须发，易鹿布僧伽黎，遣还车匿，留憍陈如等五人侍卫
- id: guji-释迦牟尼-event-enlightenment
  kind: career
  title_zh: 毕钵树下降魔成道
  date: -0533-02-08
  year_of: -533
  place_zh: 泥连河侧毕钵树下金刚座
  description: 受乳糜后诣树下，天帝撷瑞草为座，二月七日入定，八日明星出时廓然大悟，成等正觉，地动天花以应之
- id: guji-释迦牟尼-event-first-sermon
  kind: career
  title_zh: 鹿野苑中初度五人
  date: -0533-05-01
  year_of: -533
  place_zh: 波罗奈国鹿野苑
  description: 升座应天帝请转法轮，首度憍陈如等五人，谈四谛法，因是得道果者亿计
- id: guji-释迦牟尼-event-bamboo
  kind: career
  title_zh: 止竹林精舍摄众弘化
  date: -0532-01-01
  year_of: -532
  place_zh: 摩竭提国王舍城竹林园
  description: 度优楼迦叶兄弟千众，受瓶沙王施竹林为精舍，度舍利弗目犍连为上足，分座命迦叶坐，说其夙缘
- id: guji-释迦牟尼-event-transmission
  kind: career
  title_zh: 以法眼付摩诃迦叶
  date: -0484-02-01
  year_of: -484
  place_zh: 拘尸那城娑罗双树间
  description: 告众以清净法眼涅槃妙心付嘱迦叶，令阿难副贰传化，说偈法本法无法，并授金缕僧伽梨转付弥勒
- id: guji-释迦牟尼-event-death
  kind: death
  title_zh: 双林右胁般大涅槃
  date: -0484-02-15
  year_of: -484
  place_zh: 拘尸那城娑罗双树间
  description: 度须跋陀罗已，历诸三昧，褰僧伽梨示紫金光体，右胁而卧泊然大寂，金棺待迦叶至而足出慰慕，三昧火自焚，舍利分塔供养
