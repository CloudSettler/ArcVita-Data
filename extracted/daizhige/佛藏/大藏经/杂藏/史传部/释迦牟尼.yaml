  - date: -0544-02-08
    title_zh: 乘夜逾北门而出家
    rationale: 见老病死不可避免，欲断八苦转法轮，故舍国宝眷属而求解脱
  - date: -0533-01-01
    title_zh: 舍苦行受牧女乳糜
    rationale: 思惟苦行非正解脱，当受食而后成佛，故沐浴泥连河而诣道场
- id: guji-释迦牟尼-endeavor-2
  title_zh: 住世说法付法传灯
  summary_zh: 成道后鹿野初转法轮，止竹林精舍，度迦叶舍利弗目犍连等，化期将近付法迦叶而般涅槃
  phases:
  - key: brewing
