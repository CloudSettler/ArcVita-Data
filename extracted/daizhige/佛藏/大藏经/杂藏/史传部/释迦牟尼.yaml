  dilemmas:
  - 宫廷安乐与生老病死大苦之间如何抉择
  - 苦行压抑与中道解脱之间何者为正因
  - 正法付嘱心得其人方能慧命不断
  lesson: 以出世精神行入世教化，中道而悟，付嘱得人则慧命不绝
  summary_first_person: 吾本迦毗罗卫太子萨婆悉达，见老病死与沙门而厌离宫阙，逾城出家，参访群师，苦行六年而知非道，受乳糜，坐毕钵树下，降魔成等正觉，住世四十九年，随机制教，付清净法眼于摩诃迦叶，嘱转授弥勒，而般涅槃于拘尸那城
  source_urls:
  - https://daizhige.org/chuan-fa-zheng-zong-ji.html
