  archetype: 由旃陀罗王转法王之护法转轮王
  dilemmas:
  - 以严刑峻法立威与以慈悲 Schen 恕安民之间如何取舍
  - 夺嫡杀兄之宿罪如何借皈依建塔以忏除
  lesson: 幼年以沙施佛发愿为伞地王，知小善遇胜田必得大果，舍暴恶皈三宝，广起舍利塔以利人天
  summary_first_person: 我本阇耶小儿，以沙捧供世尊发愿为王，父为频头娑罗，母为婆罗门女，名阿输柯意为无忧。初征德叉尸罗得天助，夺嫡登位，严刑号旃陀阿输柯。后于狱中睹海比丘坐火不烧升空现变，方生信悔，皈依三宝，毁狱施无畏，取七塔舍利分八万四千函遍起宝塔，守护佛法，人称法阿育。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/杂藏/史传部/阿育王经.md
