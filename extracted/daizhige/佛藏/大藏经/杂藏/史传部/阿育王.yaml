  - date: -176
    title_zh: 信比丘语毁地狱施无畏
    rationale: 见镬汤不烂莲坐升空，知杀业如地狱因，遂焚狱主坏狱，满世尊广利之意
  - date: -168
    title_zh: 取七塔舍利分函遍起塔
    rationale: 留罗摩村龙护一塔，其余取分八万四千宝函瓶盖，付夜叉遍大地大海起塔，一日俱成以印阎浮提
events:
- id: guji-阿育王-event-birth
  title_zh: 生于波吒利弗多城
  date: -196
  year_of: -304
  place_zh: 波吒利弗多城王宫
  description_zh: 频头娑罗王与婆罗门女所生，因生时王无忧故名阿输柯即阿育，体粗涩父不爱，次弟名毗多输柯
- id: guji-阿育王-event-taksasila
  title_zh: 征罚德叉尸罗显转轮相
  date: -187
  year_of: -273
  place_zh: 德叉尸罗国
  description_zh: 奉命无器仗资物而往，自言当王自出，果地开得仗，人民香水洒地迎之，佉师国闻天唱阿育当为四分转轮王不敢逆
- id: guji-阿育王-event-accession
  title_zh: 频头娑罗崩阿育登位诛修私摩
  date: -0268
  year_of: -268
  place_zh: 波吒利弗多城东门
  description_zh: 父病敕还修私摩，大臣涂黄姜示病拥阿育，天冠自至父见嗔崩，阿育登位，成护设东门火坑机关，修私摩攻之堕火死，斩五百轻慢大臣，复烧折花婇女号旃陀阿育
- id: guji-阿育王-event-conversion
  title_zh: 狱中睹海比丘神变忏悔皈依
  date: -176
  year_of: -260
  place_zh: 波吒利弗多城地狱门
  description_zh: 旃陀耆利柯造狱杀无量，商主子海比丘误入，七日精进得阿罗汉，置镬汤中坐莲不烧升空现十八变说佛记百年后阿育起八万四千塔，王合掌忏悔皈依佛法僧
- id: guji-阿育王-event-stupa
  title_zh: 取七塔舍利起八万四千塔
  date: -168
  year_of: -250
  place_zh: 头楼那至阎浮提诸国
  description_zh: 往阿阇世所起头楼那等七塔取舍利，罗摩村龙护留之，分八万四千宝函瓶盖付夜叉，德叉尸罗出金三十六千万两听除输金，一日一念俱成，人称法王
- id: guji-阿育王-event-death
  title_zh: 护法后崩于本国
  date: -154
  year_of: -232
  place_zh: 波吒利弗多城
  description_zh: 起塔已守护佛法，往见优波笈多受教化，法名流布，寿终崩逝
