  description_zh: 以佛说宿缘罗汉说天梵外道偈颂问十二缘等各异随众意行别为杂藏合四箧流通
- id: guji-阿难-event-death
  title_zh: 持法流通后入灭
  date: -414
  year_of: -414
  place_zh: 摩竭国界恒河中
  description_zh: 传云住世久为众人眼付法护持后于恒河中现神变入灭令正法久住天人蒙益
