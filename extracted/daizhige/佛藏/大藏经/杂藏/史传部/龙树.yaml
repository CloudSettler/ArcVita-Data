      raw: 生于南天竺梵志家母于树下生之
    death:
      date: 168
      precision: year
      is_circa: true
      raw: 蝉蜕而去世已来始过百岁
  birth_date: 104
  death_date: 168
  era: 东汉末至曹魏
  reign_ref: 南天竺贵霜前后
  archetype: 弘法论师
  dilemmas:
  - 世智多闻而生憍慢与佛智无边的张力
  - 极欲自娱与欲为苦本的抉择
  - 别立新戒新衣与依止大乘正法的抉择
  lesson: 以世智入佛智以论议显实相破邪显正而不离大慈方便
  summary_first_person: 我生于南天竺梵志家幼而聪悟博通韦陀天文地理图谶道术少时以隐身术入王宫纵欲遭难始悟欲为苦本即发心出家九十日通三藏遍游求经不得后入龙宫得方等深经深入无生忍还弘摩诃衍于南天竺化王伏外道著中论等以显正法
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E6%9D%82%E8%97%8F/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E9%BE%99%E6%A0%91%E8%8F%A9%E8%90%A8%E4%BC%A0%E4%B9%8B%E4%BA%8C.html
endeavors:
