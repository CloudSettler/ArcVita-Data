      zh: 厌欲出家
    start_date: 120
    highlight_event_id: guji-龙树-event-renounce
  - key: breakthrough
    name: 遍游求经雪山得授
    labels:
      zh: 遍求大乘
    start_date: 125
    highlight_event_id: guji-龙树-event-seek
  - key: climax
    name: 入海龙宫授方等经
    labels:
      zh: 龙宫取经
    start_date: 0180
    highlight_event_id: guji-龙树-event-dragonpalace
  - key: closure
    name: 通练得忍持经而还
    labels:
      zh: 证入无生
    start_date: 0181
    highlight_event_id: guji-龙树-event-dragonpalace
  decisions:
  - date: 120
    title_zh: 难中立愿出家
    rationale: 依王头侧敛息得脱悟欲为苦本立愿诣沙门求出家法以求解脱
  - date: 0178
    title_zh: 止造新戒新衣
    rationale: 欲以推义立师别行幸蒙龙菩萨接入海中得闻方等乃知佛智无边舍憍慢而依实法
- id: guji-龙树-endeavor-2
  title_zh: 南天竺化王伏外道著述弘法
  summary_zh: 持赤幡化南天竺邪见王示天战证一切智化万婆罗门摧外道咒术广造论典大行摩诃衍
  phases:
  - key: brewing
    name: 持幡化王经历七年
    labels:
      zh: 化导国王
    start_date: 0185
    highlight_event_id: guji-龙树-event-convertking
  - key: breakthrough
    name: 示天阿修罗战验智
    labels:
      zh: 验证一切智
    start_date: 0192
    highlight_event_id: guji-龙树-event-convertking
  - key: climax
    name: 摧伏咒术婆罗门
    labels:
      zh: 摧伏外道
    start_date: 0195
    highlight_event_id: guji-龙树-event-subdue
  - key: closure
    name: 造论十万偈大行其道
    labels:
      zh: 著述立宗
    start_date: 128
    highlight_event_id: guji-龙树-event-subdue
  decisions:
  - date: 0185
    title_zh: 躬持赤幡行王前
    rationale: 王甚邪见毁谤正法故以忍行感化不以力争待机而化
  - date: 0195
    title_zh: 以咒化象破莲池咒
    rationale: 外道以神通慢辱佛法故亦以神通折伏使其归命受化不专以言争
events:
- id: guji-龙树-event-birth
  title_zh: 南天竺树下诞生
  date: 104
  year_of: 150
  location_zh: 南天竺梵志家树下
  summary_zh: 出南天竺梵志种母于树下生之因字阿周陀那阿周陀那即树名以龙成道故号龙树
- id: guji-龙树-event-renounce
  title_zh: 王宫隐身遇难悟道出家
  date: 120
  year_of: 170
  location_zh: 王宫复入山佛塔
  summary_zh: 与三友得隐身术入王宫百余日事发三友被杀我依王头侧得免始悟欲为苦本发出家愿得出入山诣塔出家受戒九十日诵三藏尽通深义
- id: guji-龙树-event-seek
  title_zh: 周游遍求大乘复生憍慢
  date: 125
  year_of: 175
  location_zh: 阎浮提雪山佛塔
  summary_zh: 雪山塔中得老比丘授摩诃衍经未得通利周游遍求不得摧伏论师遂起憍慢欲推义立新戒新衣以表一切智
- id: guji-龙树-event-dragonpalace
  title_zh: 大龙接入海宫授经得忍
  date: 0180
  year_of: 180
  location_zh: 海中龙宫
  summary_zh: 静室中大龙菩萨接入海开七宝藏授方等深奥经典九十日通练甚多深入无生三忍具足所读已十倍阎浮提携一箱还出
- id: guji-龙树-event-convertking
  title_zh: 化南天竺王示天战
  date: 0192
  year_of: 192
  location_zh: 南天竺王宫
  summary_zh: 王邪见事外道我持赤幡行王前七年自称一切智人王问天今何为答天今与阿修罗战须臾兵器自空落手足耳鼻下坠两阵现空王伏法化万婆罗门受戒大弘佛教
- id: guji-龙树-event-subdue
  title_zh: 化象伏咒术婆罗门广造论典
  date: 0198
  year_of: 198
  location_zh: 南天竺政德殿
  summary_zh: 婆罗门咒作大池千叶莲华坐而慢我我咒化六牙白象行水上拔华掷地彼伤腰归命又造优波提舍十万偈庄严佛道论大慈方便论无畏论出中论令摩诃衍大行
- id: guji-龙树-event-death
  title_zh: 蝉蜕而去立庙如佛
  date: 168
  year_of: 250
  location_zh: 南天竺
  summary_zh: 小乘法师怀嫉不愿我久住我退入闲室经日不出弟子破户视之已蝉蜕去去世百岁南天竺诸国立庙敬奉如佛依付法藏经为第十三祖
