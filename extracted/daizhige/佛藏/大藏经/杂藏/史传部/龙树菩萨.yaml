events:
- id: guji-龙树菩萨-event-birth
  kind: birth
  title_zh: 母树下生名阿周陀那
  date: '0150'
  year_of: 150
  place_zh: 南天竺
  description_zh: 出南天竺梵志种母于树下生之因以树名阿周陀那后以龙成道号曰龙树天聪奇悟乳哺中即领四围陀义
- id: guji-龙树菩萨-event-palace-peril
  kind: career
  title_zh: 隐身入宫三友被杀悟道出家
  date: '0170'
  year_of: 170
  place_zh: 南天竺王宫及佛塔
  description_zh: 与契友三人得隐身药纵意入宫百余日发觉三人被杀独依王头侧得脱遂悟欲为苦本入山诣佛塔出家受戒九十日诵三藏尽
- id: guji-龙树菩萨-event-dragon-palace
  kind: career
  title_zh: 入龙宫得方等深经造中论等
  date: 0185
  year_of: 185
  place_zh: 龙宫及南天竺
  description_zh: 周游求经不得起欲自演教心大龙愍之接入海中开七宝函授方等深经九十日通解深入无生二忍还出南天竺作优波提舍十万偈中论五百偈等大行摩诃衍
- id: guji-龙树菩萨-event-convert-king
  kind: career
  title_zh: 伏婆罗门化南天竺王广弘法
  date: '0200'
  year_of: 200
  place_zh: 南天竺政听殿
  description_zh: 化六牙白象拔千叶莲华座伏善咒婆罗门又应募为将以天与阿修罗战兵器手足自空而下为证化王及万婆罗门受成就戒摧伏外道
- id: guji-龙树菩萨-event-death
  kind: death
  title_zh: 蝉蜕而去立庙奉如佛
  date: '0250'
  year_of: 250
  place_zh: 南天竺
  description_zh: 将去世时小乘法师不愿其久住遂退入闲室经日不出弟子破户视之已蝉蜕而去去世至今始过百岁诸国立庙敬奉如佛依付法藏为第十三祖
