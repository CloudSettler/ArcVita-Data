  - 残写经前半缺佚又无后题，难见全经面貌
  - 景教与大祆摩尼皆自波斯来，教义相似难分
  - 敦煌莫高窟藏本初归京师，亟需题名存目
  lesson: 存残守缺，姑题波斯以俟后考，不以臆断掩本真
  summary_first_person: 我是上虞罗振玉，见敦煌莫高窟残写经今藏京师图书馆，前半已缺而后半完好，友人临川李翊灼以明暗之旨证景教三威蒙度赞而定为景教，我考大祆摩尼与景教颇类似且皆由波斯入中土，未易分别，故姑颜曰波斯教经以俟宗教学者考证
