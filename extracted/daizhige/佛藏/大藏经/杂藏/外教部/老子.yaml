person:
  qid: guji-老子
  name_zh: 老子
  names:
    zh: 老子
    en: Laozi
  lifespan:
    birth:
      date: -571-02-15
      precision: day
      is_circa: true
      raw: 庚辰二月十五日誕生於毫九龍吐水化為九井
    death:
      date: -471
      precision: year
      is_circa: true
      raw: 上登崑崙飛升紫微布氣三界莫知所終
  birth_date: -571-02-15
  death_date: -471
  era: 周春秋
  reign_ref: 周昭王癸丑西邁出函谷
  archetype: 太上開教西升化胡之聖
  dilemmas:
  - 王道將衰殺戮賢良忠諫被誅是留朝匡扶還是西邁存道
  - 胡人好殺食肉貪淫不識親疏是峻法繩之還是漸教誘之
  - 道佛同源三教混齊是顯道形還是化佛形以攝群機
  lesson: 出身著死地火中生蓮花守真不爭漸進化物方能總攝一切法門
  summary_first_person: 吾寄胎於玄妙降生於毫混迹周室為柱下史見王道將衰殺戮賢良遂西邁函谷授喜道德五千章句並以西升妙真太清靈寶之法付之令教授不絕吾經流沙至於闐毗摩召八十餘國胡王說夜叉經令斷屠殺剔除鬚髮持戒懺悔又化佛形立浮屠教號清淨佛復令尹喜乘月精托生天竺為悉達成佛陀又授孔丘仁義後登崑崙飛升紫微化度未艾
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E6%9D%82%E8%97%8F/%E5%A4%96%E6%95%99%E9%83%A8/%E8%80%81%E5%AD%90%E5%8C%96%E8%83%A1%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T2139
endeavors:
- id: guji-老子-endeavor-1
  title_zh: 柱下藏名著書西升授喜
  summary_zh: 晦迹周室為柱下史凝神混迹教化天人兼說治身中外法值王道衰微遂西邁函谷授尹喜道德五千言及西升妙真太清三洞靈寶之法令羽化傳授不絕
  phases:
  - key: brewing
    name: 寄胎降誕混迹教化
    labels:
      zh: 晦迹藏名師輔王者
    start_date: -571-02-15
    highlight_event_id: guji-老子-event-birth
  - key: breakthrough
    name: 看衰西邁過函谷關
    labels:
      zh: 運終數盡向西度
    start_date: -516
    highlight_event_id: guji-老子-event-hangu
  - key: climax
    name: 授喜五千並授真文
    labels:
      zh: 教授不絕羽化神仙
    start_date: -516
    highlight_event_id: guji-老子-event-hangu
  - key: closure
    name: 付囑教授令無斷絕
    labels:
      zh: 道統西傳整飭天文
    start_date: -515
    highlight_event_id: guji-老子-event-hangu
  decisions:
  - date: -516
    title_zh: 辭周西邁不戀朝榮
    rationale: 王道將衰忠臣被誅天降洪災曾無覺悟留之無益不如西度以全大道
  - date: -516
    title_zh: 函谷授喜五千章句
    rationale: 喜候天見紫雲精誠齋戒三日不言心至可傳故遺以道德並授妙真西升太清靈寶符圖使其教授仁者羽化不絕
- id: guji-老子-endeavor-2
  title_zh: 西度流沙化胡成佛設教
  summary_zh: 經歷流沙至於闐毗摩召八十餘國胡王說法令斷肉持戒剔髮易服化佛形立浮屠教歷五天竺摩竭烏場復化悉達為佛陀及授孔丘仁義後還中夏登崑崙升紫微
  phases:
  - key: brewing
    name: 流沙西度召集神眾
    labels:
      zh: 乘雲駕龍浮空而至
    start_date: -515
    highlight_event_id: guji-老子-event-huahu
  - key: breakthrough
    name: 毗摩說法斷殺易俗
    labels:
      zh: 說夜叉經剔髮持戒
    start_date: -514
    highlight_event_id: guji-老子-event-huahu
  - key: climax
    name: 化佛形立浮屠歷五天
    labels:
      zh: 化胡成佛丈六金身
    start_date: -510
    highlight_event_id: guji-老子-event-huahu
  - key: closure
    name: 化悉達授孔丘還升崑崙
    labels:
      zh: 同歸於我總攝法門
    start_date: -500
    highlight_event_id: guji-老子-event-huasi
  decisions:
  - date: -514
    title_zh: 說夜叉經令斷血食
    rationale: 胡王心毒好行殺害唯食血肉故令斷肉專食麥麨不能斷者以自死肉稍習慈悲漸可修道
  - date: -514
    title_zh: 普令剔除鬚髮易服
    rationale: 胡人鬚髮拳鞠難洗性膻體穢煩惱行人故令剔除隨俗衣氈裘教以小道禁戒懺悔漸進大法
  - date: -510
    title_zh: 化佛形面東示不忘本
    rationale: 以神力化丈六金色東向之形令見者發慈善心知我東來朝拜東向政事以攝胡機歸於大道
  - date: -500
    title_zh: 令尹喜托生為悉達授孔丘
    rationale: 桓王甲子令喜乘月精入白淨夫人口中號悉達成佛陀破九十六種邪道襄王乙酉還授孔丘仁義以分流三教同歸於我
events:
- id: guji-老子-event-birth
  type: birth
  title_zh: 亳地誕生步生蓮花
  date: -571-02-15
  year_of: -571
  place_zh: 亳
  description_zh: 太上乘日精入玄妙口中寄胎庚辰二月十五日誕於亳九龍吐水灌洗化為九井生即能行步生蓮花指天指地言唯我獨尊眾以為聖人因老容號老子
- id: guji-老子-event-hangu
  type: career
  title_zh: 過函谷授尹喜道德五千言
  date: -516
  year_of: -516
  place_zh: 函谷關
  description_zh: 照王癸丑西邁過函谷關喜候紫雲沐浴齋戒延入叩請三日不言乃授道德五千章句並說妙真西升太清上法三洞真文靈寶符圖使其教授羽化不絕便即西度
- id: guji-老子-event-huahu
  type: career
  title_zh: 於闐毗摩化胡說法化佛
  date: -514
  year_of: -514
  place_zh: 於闐毗摩城
  description_zh: 經流沙至於闐毗摩處玉帳坐七寶座召十萬神眾及八十餘國胡王說夜叉經令斷屠殺持戒懺悔剔髮衣氈裘化丈六金身佛形東向立浮屠教過蔥嶺降毒龍歷烏場五天入摩竭衣素服執空壺號清淨佛
- id: guji-老子-event-huasi
  type: career
  title_zh: 化悉達為佛授孔丘仁義
  date: -500
  year_of: -500
  place_zh: 中天竺及中夏
  description_zh: 桓王甲子令尹喜乘月精降中天竺入白淨夫人腹托生為悉達捨太子位入山成佛陀號佛陀建悉曇文字說經破九十六邪道示涅槃襄王乙酉還授孔丘仁義之法後上崑崙飛升紫微
- id: guji-老子-event-death
  type: death
  title_zh: 登崑崙飛升紫微
  date: -471
  year_of: -471
  place_zh: 崑崙紫微
  description_zh: 分國從都王者無德即上登崑崙飛升紫微布氣三界含養一切後四百五十餘年復乘光明道氣降西那蘇鄰示為太子號末摩尼轉輪說法總攝一切法門
