endeavors:
- id: guji-法经-endeavor-1
  title_zh: 奉敕编撰众经目录
  summary: 奉开皇敕搜访古今经目，立例分部，成五卷目录以定藏经去取
  phases:
  - key: brewing
    name: 承诏搜访群经
    labels:
      zh: 搜访酝酿
    start_date: 0581-03-01
    highlight_event_id: guji-法经-event-581
  - key: breakthrough
    name: 创立五分体例
    labels:
      zh: 体例突破
    start_date: 0592-01-01
    highlight_event_id: guji-法经-event-592
  - key: climax
    name: 开皇十四年目录告成
    labels:
      zh: 编录高峰
    start_date: 0594-01-01
    highlight_event_id: guji-法经-event-594
  - key: closure
    name: 目录颁行藏经为准
    labels:
      zh: 颁行收束
    start_date: 0595-01-01
    highlight_event_id: guji-法经-event-595
  decisions:
  - date: 0592-06-01
    title_zh: 折衷安录上例别立七别
    rationale: 晋道安旧录与齐法上条例虽同而未备，故别立单本重翻圣集别生疑伪阙本以总持繁杂
  - date: 0594-03-01
    title_zh: 疑伪不录入藏阙本请访
    rationale: 恐鱼目混珠乱真，故疑伪存目不抄，阙本有目无文者随访随补，以保藏经纯一无杂
- id: guji-法经-endeavor-2
  title_zh: 参预开皇译场弘护正法
  summary: 居大兴善寺译场助译审文，匡正邪伪，助成隋代佛经翻译弘传之业
  phases:
  - key: brewing
    name: 入选翻经沙门
    labels:
      zh: 翻经酝酿
    start_date: 0582-01-01
    highlight_event_id: guji-法经-event-582
  - key: breakthrough
    name: 共耶舍崛多等译大经
    labels:
      zh: 助译突破
    start_date: 0585-01-01
    highlight_event_id: guji-法经-event-585
  - key: climax
    name: 以目录统摄新旧译经
    labels:
      zh: 统摄高峰
    start_date: 0594-01-01
    highlight_event_id: guji-法经-event-594
  - key: closure
    name: 隋代译业垂范后世
    labels:
      zh: 垂范收束
    start_date: 0597-01-01
    highlight_event_id: guji-法经-event-597
  decisions:
  - date: 0585-05-01
    title_zh: 随译随勘审定文义
    rationale: 西域梵本与旧译异同甚多，须参覆文义首尾详审，方能不失佛意而便中土流行
  - date: 0594-08-01
    title_zh: 以录促译补阙访遗
    rationale: 有目无本者尚三百八十二部，故请访求抄补，令新旧经论具足入藏，法流皎镜深浅
events:
- id: guji-法经-event-birth
  date: 0540-01-01
  year_of: 540
  title_zh: 出生
  description: 约梁陈之际生于中土，自幼出家，博通经论，尤精毗尼
- id: guji-法经-event-581
  date: 0581-03-01
  year_of: 581
  title_zh: 隋兴奉诏搜经
  description: 隋文帝受禅崇隆佛法，诏搜访经籍，法经以解律习经入选翻经沙门
- id: guji-法经-event-582
  date: 0582-06-01
  year_of: 582
  title_zh: 居大兴善寺参译
  description: 居长安大兴善寺，与阇那崛多耶舍等共译大方等日藏等经，审文定义
- id: guji-法经-event-585
  date: 0585-09-01
  year_of: 585
  title_zh: 助译大经渐知名
  description: 助译护国菩萨经无上依经等，皇朝奏行，声名渐著于译场
- id: guji-法经-event-592
  date: 0592-01-01
  year_of: 592
  title_zh: 拟定目录体例
  description: 会通晋道安齐法上旧例，拟定单本重翻圣集别生疑伪阙本七别之体
- id: guji-法经-event-594
  date: 0594-06-01
  year_of: 594
  title_zh: 众经目录告成
  description: 开皇十四年奉敕撰成众经目录五卷，都合二千二百一十九部六千九百九十四卷，颁行天下
- id: guji-法经-event-595
  date: 0595-02-01
  year_of: 595
  title_zh: 目录为准绳藏经
  description: 以目录为抄写入藏准绳，单本重翻入藏，别生疑伪不抄，阙本随访随补
- id: guji-法经-event-597
  date: 0597-04-01
  year_of: 597
  title_zh: 晚年弘律护教
  description: 晚年仍居长安弘律校经，以目录垂范后世费长房历代三宝纪等继作
- id: guji-法经-event-death
  date: 0598-01-01
  year_of: 598
  title_zh: 示寂
  description: 约开皇末示寂于长安，译业经录并传，后世敬为隋代经录之祖
