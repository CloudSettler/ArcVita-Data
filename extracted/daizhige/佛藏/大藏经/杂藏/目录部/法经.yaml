  era: 隋
  reign_ref: 隋文帝开皇
  archetype: 持律辨伪的经录高僧
  dilemmas:
  - 真伪经论杂糅并行，弘护正法与包容异说之间如何取舍
  - 单本重翻别生阙本繁杂，经录体例当如何简要而能总持
  lesson: 考镜源流，辨别真伪，立例以总群经，则法宝可久住而不淆
  summary_first_person: 吾乃隋翻经沙门法经，奉文帝敕与众僧搜访校定，于开皇十四年成众经目录五卷，都合二千二百一十九部，立单本重翻圣集别生疑伪阙本之目，欲令真伪有分，源流可考，弘持正法而已
