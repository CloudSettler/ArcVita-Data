  date: 277
  year_of: 425
  type: career
  summary: 离建康西上江陵，住辛寺传禅授戒，门徒数百，荆楚翕然向风。
- id: guji-佛驮跋陀罗-event-death
  title_zh: 示寂于荆州辛寺
  date: 0429
  year_of: 429
  type: death
  summary: 宋文帝元嘉六年示寂于江陵辛寺，春秋七十有一，塔于荆州。
