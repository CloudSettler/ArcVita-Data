  date: 0359
  year_of: 359
  type: birth
  summary: 生于北印度释迦族故地，少出家习诵禅观，精通律藏。
- id: guji-佛驮跋陀罗-event-arrive
  title_zh: 越葱岭抵长安会法显
  date: 0408
  year_of: 408
  type: career
  summary: 自天竺经西域入华抵长安，与法显共论佛典，声名始著。
- id: guji-佛驮跋陀罗-event-huayan-begin
  title_zh: 建康道场寺创译华严
  date: 0418
  year_of: 418
  type: career
  summary: 应吴郡内史孟顗等请，于建康道场寺开译大方广佛华严经，法业等参译润文。
- id: guji-佛驮跋陀罗-event-huayan-done
  title_zh: 六十卷华严译毕
  date: 274
  year_of: 422
