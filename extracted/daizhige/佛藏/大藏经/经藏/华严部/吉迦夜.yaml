endeavors:
- id: guji-吉迦夜-endeavor-1
  title_zh: 入魏译出大方广菩萨十地经
  summary_zh: 于元魏洛阳译场译出十地经一卷，具传菩提心十地前相陀罗尼波罗蜜法门。
  phases:
  - key: brewing
    name: 西域受学蕴蓄梵本
    labels:
      zh: 蕴蓄译缘
    start_date: 0490
    highlight_event_id: guji-吉迦夜-event-birth
  - key: breakthrough
    name: 东来入华得译机
    labels:
      zh: 得机入译
    start_date: '0505'
    highlight_event_id: guji-吉迦夜-event-translate
  - key: climax
    name: 译出十地正文告成
    labels:
      zh: 译弘正文
    start_date: 0508
    highlight_event_id: guji-吉迦夜-event-translate
  - key: closure
    name: 校定付授流通华严部
    labels:
      zh: 校定流通
    start_date: '0510'
    highlight_event_id: guji-吉迦夜-event-teach
  decisions:
  - date: '0505'
    title_zh: 应请入译场译十地经
    rationale: 见中土渴仰华严十地而梵本未广，故不辞艰阻发心翻译以利后学
  - date: 0508
    title_zh: 以俗数言说显第一义空
    rationale: 依经义菩提不可说而假言说显，故详译十心十地陀罗尼波罗蜜令易解行
- id: guji-吉迦夜-endeavor-2
  title_zh: 开显菩提心十地修证次第
  summary_zh: 依无尽智菩萨所问，开示十种发心十地嘉瑞陀罗尼及十波罗蜜差别，令初业菩萨入不退地。
  phases:
  - key: brewing
    name: 咨问菩提心云何当知
    labels:
      zh: 发问缘起
    start_date: 0508
    highlight_event_id: guji-吉迦夜-event-translate
  - key: breakthrough
    name: 宣说十心十地前相
    labels:
      zh: 开示次第
    start_date: 0508
    highlight_event_id: guji-吉迦夜-event-translate
  - key: climax
    name: 敷演陀罗尼波罗蜜功德
    labels:
      zh: 显胜功德
    start_date: 0509
    highlight_event_id: guji-吉迦夜-event-teach
  - key: closure
    name: 付嘱受持得无生忍
    labels:
      zh: 付嘱受持
    start_date: 0509
    highlight_event_id: guji-吉迦夜-event-teach
  decisions:
  - date: 0508
    title_zh: 以十喻分别十种菩提心
    rationale: 为令初机易入，故以大地师子那罗延等喻配檀尸羼提诸度次第开示
  - date: 0509
    title_zh: 劝读诵受持明不离佛果
    rationale: 欲令善根成熟众生得阿惟越致，故说闻持是经不离真实观与诸陀罗尼
events:
- id: guji-吉迦夜-event-birth
  title_zh: 生于西域
  date: 0480
  year_of: 480
  place_zh: 西域
  description_zh: 约元魏前生于西域，少出家习大乘方等，精梵本华严十地义理，兼通汉言音训。
- id: guji-吉迦夜-event-translate
  title_zh: 于元魏译出大方广菩萨十地经
  date: 0508
  year_of: 508
  place_zh: 洛阳
  description_zh: 于元魏译场译出无尽智菩萨问菩提心之经，具说十心所因波罗蜜十地三摩提嘉瑞陀罗尼，成一卷传世。
- id: guji-吉迦夜-event-teach
  title_zh: 宣说十地前相与受持功德
  date: 0509
  year_of: 509
  place_zh: 洛阳
  description_zh: 敷演初地乃至十地嘉瑞与最胜难伏等陀罗尼，兼明闻持读诵得无生忍，三千菩萨得忍，众发菩提心。
- id: guji-吉迦夜-event-death
  title_zh: 示寂于魏地
  date: '0530'
  year_of: 530
  place_zh: 洛阳
  description_zh: 译弘之业既竟，安然示寂，所译十地经收入华严部流通后世。
