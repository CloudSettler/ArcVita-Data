  dilemmas:
  - 梵本深广难译与中土渴仰十地正法之间如何取舍
  - 第一义皆不可说与依言说施设弘宣十地之间如何贯通
  lesson: 以无所得见立译弘之业，不著文字而善设文字，令闻者因言说入无言，终不离佛不退菩提。
  summary_first_person: 吾为西域来华沙门吉迦夜，于元魏译出佛说大方广菩萨十地经，具说十种菩提心十地前相陀罗尼波罗蜜，愿闻是法者皆得无生忍，不离诸佛，究竟佛慧。
