  dilemmas:
  - 身为西域梵僧而志在东土弘传于梵汉悬隔之间如何取信
  - 逢周武废法北齐播迁之乱而译业屡废屡兴如何坚守不退
  - 华严深旨不思议境难说难示而众生根器下中上别如何随器现身说法
  lesson: 以无分别无功用之心随器译弘令异域深经得入华土 mature 众生
  summary_first_person: 吾本北天竺犍陀罗人，少年出家游学中天竺，承律论而慕大乘，冒越葱岭而来东土，经齐周之乱入隋，止大兴善寺奉诏译经，译佛本行集起世华严入如来德智等凡三十九部，愿以梵音化汉语令众生入不思议解脱
  source_urls:
