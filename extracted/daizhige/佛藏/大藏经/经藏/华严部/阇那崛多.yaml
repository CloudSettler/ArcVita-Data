    title_zh: 拣译入如来德智不思议境界经以显普现
    rationale: 见此经明如来如月轮如摩尼随众生色而现色随说法而闻法，最契华土初机，故先译此以立华严普门正信
  - date: 0592
    title_zh: 存隋言质朴不饰文以存梵义
    rationale: 恐失不共法无分别之旨，宁存质直令义不乖，务使下中上根各得化度而不滞于文藻
