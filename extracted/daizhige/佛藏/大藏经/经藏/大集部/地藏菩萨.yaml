    rationale: 欲证佛身当须久远度脱一切受苦众生故先令众生解脱而后自身成佛
  - date: -0480-01-01
    title_zh: 承释迦付嘱度娑婆至弥勒出世
    rationale: 刚强众生习恶未尽若堕恶趣受大苦时当忆念付嘱悉使解脱永离诸苦
