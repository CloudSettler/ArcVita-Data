    highlight_event_id: guji-地藏菩萨-event-fuzhu
  decisions:
  - date: -3998-01-01
    title_zh: 尽未来劫设方便令罪苦众生解脱
    rationale: 见母受无间剧苦及众生业海沉沦故愿代苦救拔令离地狱恶趣而后成正觉
  - date: -3990-01-01
    title_zh: 对清净莲华目如来前再发救拔三恶道愿
    rationale: 母以杀害毁骂受报短命更落恶道故誓令是等罪报众生尽成佛竟而后成佛
events:
- id: guji-地藏菩萨-event-birth
  title_zh: 久远劫前生为大长者子
  date: -5000-01-01
  year_of: -5000
  description: 久远劫前师子奋迅具足万行如来世生为大长者子见佛千福庄严
- id: guji-地藏菩萨-event-vow-changzhe
  title_zh: 长者子于佛前立度生大愿
  date: -4999-01-01
  year_of: -4999
  description: 问佛作何行愿而得此相闻当久远度脱受苦众生即发愿尽未来际广设方便尽令解脱而后成佛
- id: guji-地藏菩萨-event-polomen
  title_zh: 为婆罗门女救母见业海地狱
  date: -3999-01-01
  year_of: -3999
  description: 觉华定自在王如来像法中为婆罗门女供养塔寺念佛名号见业海无间之苦母承孝子供福三日生天
- id: guji-地藏菩萨-event-guangmu
  title_zh: 为光目女于佛像前发地狱救拔愿
  date: -3990-01-01
  year_of: -3990
  description: 清净莲华目如来时为光目女设食供养画佛供养为母发愿百千万亿劫中救拔地狱三恶道罪苦众生令离恶趣尽成佛竟而后成正觉
- id: guji-地藏菩萨-event-fuzhu
  title_zh: 忉利天宫承佛付嘱分身集会
  date: -0480-01-01
  year_of: -480
  description: 释迦在忉利为母说法分身地藏俱来集会摩顶付嘱令娑婆至弥勒出世众生悉使解脱三白受嘱不以恶业众生为虑
- id: guji-地藏菩萨-event-death
  title_zh: 广度将毕方证菩提今尚为菩萨
  date: '9999-12-31'
  year_of: 9999
  description: 久远证十地已来千倍喻数于今百千万亿那由他劫尚为菩萨广度未毕即未入灭取涅槃
