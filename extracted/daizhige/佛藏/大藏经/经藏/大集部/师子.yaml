      - 高潮
    start_date: -2990-06-01
    highlight_event_id: guji-师子-event-death
  - key: closure
    name: 命终生梵还供舍利
    labels:
      zh:
      - 收束
    start_date: -2989-01-01
    highlight_event_id: guji-师子-event-death
  decisions:
  - date: -2990-05-01
    title_zh: 立誓随佛入涅槃焚身
    rationale: 世间眼灭无明道苦，愿舍毒身求不思议续佛相续
  - date: -2990-05-15
    title_zh: 说偈发弘愿普施功德
    rationale: 愿见闻我烧身者除邪谤证位外皆得成佛，以此烧身缘证诸佛不断
events:
- id: guji-师子-event-birth
  title_zh: 出生为善建城无量力王长子
  type: birth
  date: -3000-01-01
  year_of: -3000
  place_zh: 善建城
  summary: 为无量力王长子，与弟师子意久发无上菩提之愿，名称远闻具大威德
- id: guji-师子-event-offering
  title_zh: 楼上迎佛尽寿供养
  type: career
  date: -3000-03-01
  year_of: -3000
  place_zh: 善建城宫门及精舍
  summary: 与父弟赍牛头栴檀末香珍异幢幡伎乐迎宝肩如来及七百千万亿罗汉，右绕礼足请尽寿供养
- id: guji-师子-event-immolation
  title_zh: 阇维盛火投身发愿
  type: career
  date: -2990-06-01
  year_of: -2990
  place_zh: 宝肩如来阇维处
  summary: 佛灭度后以香汤洗浴香涂散花宝棺栴檀積起火，白氎缠身执炬投火说偈发愿，感佛焰中奋神通光明说法化众还入涅槃
- id: guji-师子-event-death
  title_zh: 命终生梵天还供舍利
  type: death
  date: -2990-06-01
  year_of: -2990
  place_zh: 梵天及阇维处空中
  summary: 投火命终即生梵天有大神力，自念本缘还至阇维处雨天香花供养宝肩舍利，向父王说本缘劝勿慈念
