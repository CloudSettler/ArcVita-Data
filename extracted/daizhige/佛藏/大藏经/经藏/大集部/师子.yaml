  era: 过去宝肩如来世
  reign_ref: 宝肩如来住世教化时
  archetype: 殉法供养者
  dilemmas:
  - 世尊涅槃我生何为是否随佛速取灭度
  - 以何供养能令见闻者皆得成佛续佛相续不断
  lesson: 舍毒身以供养立弘愿以度生，感佛焰中现身，明诸佛戒定智慧解脱不可思议
  summary_first_person: 我是善建城无量力王长子师子，与父弟侍奉宝肩如来尽寿供养，佛涅槃后我白氎缠身投火供养发愿令见闻者皆得佛道，蒙佛焰中现身说法，我心坦然安乐，后生梵天犹还供养舍利，愿以烧身微善施于一切
  source_urls:
