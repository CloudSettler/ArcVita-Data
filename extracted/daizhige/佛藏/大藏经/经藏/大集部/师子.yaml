    rationale: 睹佛相好欣跃无极，欲以恭敬供养种菩提因
  - date: -3000-03-01
    title_zh: 请佛尽寿施安
    rationale: 知佛住世不久，欲与父弟臣民共植福田安乐人天
- id: guji-师子-endeavor-2
  title_zh: 佛涅槃后焚身供养发愿生梵
  summary: 宝肩如来灭度阇维之际，白氎缠身投火供养，说偈发愿令见闻食肉骂詈慈观者皆得佛道，感佛焰中现身，命终生梵天还供舍利
  phases:
  - key: brewing
