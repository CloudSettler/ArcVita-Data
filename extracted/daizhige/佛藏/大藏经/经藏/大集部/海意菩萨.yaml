events:
- id: guji-海意菩萨-event-birth
  title_zh: 示现出生于功德严世界
  date: '0100-01-01'
  year_of: 100
  place_zh: 无量功德宝无垢殊妙庄严世界
  summary_zh: 海意菩萨于下方功德严世界海胜持慧如来所示现出生久植善根住无所得忍
- id: guji-海意菩萨-event-arrival
  title_zh: 一念至娑婆道场涌现虚空
  date: '0100-03-02'
  year_of: 100
  place_zh: 娑婆世界大宝庄严最胜道场虚空
  summary_zh: 承彼佛神力于一念瞬目之顷隐彼世界现此娑婆高广莲台师子座上大众围绕
- id: guji-海意菩萨-event-offering
  title_zh: 以无忧适悦花雨供养释迦
  date: '0100-03-03'
  year_of: 100
  place_zh: 大宝庄严最胜道场佛前
  summary_zh: 以量广俱卢舍无忧适悦花及遍布花雨微妙鼓音供养世尊右绕七匝礼足而立
- id: guji-海意菩萨-event-question
  title_zh: 合掌请问净印三摩地法门
  date: '0100-04-01'
  year_of: 100
  place_zh: 大宝庄严最胜道场
  summary_zh: 白佛先闻菩萨自说净印三摩地能速证菩提问云何获得何名自说何为净印云何得入
- id: guji-海意菩萨-event-sermon
  title_zh: 蒙佛以摩尼宝喻开示磨治心宝
  date: '0100-04-03'
  year_of: 100
  place_zh: 大宝庄严最胜道场
  summary_zh: 佛说发一切智心宝如摩尼当具三戒十善慈悲喜舍离九宝性成大悲宝性照明众生
- id: guji-海意菩萨-event-death
  title_zh: 法身示现无灭
  date: '0200-01-01'
  year_of: 200
  place_zh: 无量功德宝无垢殊妙庄严世界
  summary_zh: 菩萨得无尽陀罗尼游戏神通住无加行位法身平等无生无灭于十方示现饶益
