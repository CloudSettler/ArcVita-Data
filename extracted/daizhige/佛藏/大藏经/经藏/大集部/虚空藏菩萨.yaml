    title_zh: 宣说破恶业障陀罗尼咒
    rationale: 为令犯根本罪善根烧然者及求富求慧求解脱者，烧香归命即得方便摄受，舍邪见恶业趣正直道故
  - date: -0480-02-05
    title_zh: 随应现梵释天王乃至鸟兽等形
    rationale: 为应梦者寤者 aten 不同根性，分别说病相药治及一切种智大乘法，令住声闻缘觉大乘，乃至满足十地故
events:
- id: guji-虚空藏菩萨-event-birth
  person_qid: guji-虚空藏菩萨
  title_zh: 示现于一切香集依世界闻法得定
  date: -0800-01-01
  year_of: -800
  place_zh: 西方一切香集依世界胜华敷藏佛所
  description_zh: 于胜华敷藏如来所闻深妙法得诸禅定，具无生忍无碍辩，究竟首楞严定，住最上地，为一切众生生天般涅槃导主
  endeavor_ref: guji-虚空藏菩萨-endeavor-1
- id: guji-虚空藏菩萨-event-coming
  person_qid: guji-虚空藏菩萨
  title_zh: 与八十亿菩萨至娑婆宝莲华上结跏趺坐
  date: -0480-01-03
  year_of: -480
  place_zh: 娑婆世界佉罗底翅山释迦牟尼佛前
  description_zh: 顶上如意宝珠以无量释迦毗楞伽宝围绕，光明蔽众色，变娑婆七宝为地平坦如掌，雨宝奏乐，佛前踊出白银茎黄金叶金刚台宝莲华，忽然坐其上，八十亿菩萨各坐余莲华
  endeavor_ref: guji-虚空藏菩萨-endeavor-1
- id: guji-虚空藏菩萨-event-dharani
  person_qid: guji-虚空藏菩萨
  title_zh: 说破恶业障陀罗尼拔济恶众生
  date: -0480-02-10
  year_of: -480
  place_zh: 佉罗底翅山大会及众生梦寤前
  description_zh: 说阿蜜栗舍等陀罗尼咒，现梵天帝释乃至童男女金刚等像，为众生说病授药满愿，教忏悔五根本罪波罗夷，令犯者发露不更作，安住施戒忍进禅慧，速舍三涂八难得人天乐般涅槃乐
  endeavor_ref: guji-虚空藏菩萨-endeavor-2
- id: guji-虚空藏菩萨-event-death
  person_qid: guji-虚空藏菩萨
  title_zh: 常住首楞严无示现灭度
  date: '9999-12-31'
  year_of: 9999
  place_zh: 遍虚空法界无所不在
  description_zh: 究竟满足首楞严定决定坚固终无倾动，智慧如虚空慈悲如恒沙，具十八不共诸佛秘藏，为三世诸佛第一辅臣，常护法城成熟众生无边际
  endeavor_ref: guji-虚空藏菩萨-endeavor-2
