person:
  qid: guji-虚空藏菩萨
  name_zh: 虚空藏菩萨
  names:
    zh: 虚空藏菩萨
    en: Akasagarbha Bodhisattva
  lifespan:
    birth:
      date: -0800-01-01
      precision: millennium
      is_circa: true
      raw: 无量劫前得无生忍示现于一切香集依世界
    death:
      date: '9999-12-31'
      precision: millennium
      is_circa: true
      raw: 住首楞严定常住不灭无示现般涅槃
  birth_date: -0800-01-01
  death_date: '9999-12-31'
  era: 释迦牟尼住世时
  reign_ref: 释迦牟尼在佉罗底翅山说法时
  archetype: 大悲救度菩萨
  dilemmas:
  - 以第一义无生空性为本 yet 须现俗谛庄严神变以成熟凡夫
  - 以虚空平等容一切 yet 须于五浊恶世分别现形治病满愿拔根本重罪
  lesson: 以虚空般智慧容一切法，以慈悲方便入秽土度众，虽犯根本重罪至心忏悔归命亦可重开人天解脱之路
  summary_first_person: 我是虚空藏，常住虚空般三昧中。我本在西方一切香集依世界胜华敷藏佛所闻法得定，见东方大光，奉佛教命与八十亿菩萨乘虚赴娑婆觐释迦。我顶戴如意宝珠，以释迦毗楞伽宝围绕，变秽土为七宝净地，坐宝莲华上。我为五浊恶众生说破恶业障陀罗尼，于梦寤中现种种形，说法，治病，满愿，拔根本罪，令发菩提心住不退转。
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0405
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%A4%A7%E9%9B%86%E9%83%A8/%E8%99%9A%E7%A9%BA%E8%97%8F%E8%8F%A9%E8%90%A8%E7%BB%8F.html
