    start_date: -0500-02-02
    highlight_event_id: guji-虚空藏菩萨-event-dharani
  - key: climax
    name: 梦寤现身除罪愈疾
    labels:
      zh:
      - 高潮
    start_date: -0500-02-03
    highlight_event_id: guji-虚空藏菩萨-event-rescue
  - key: closure
    name: 令住不退速满六度
    labels:
      zh:
      - 收束
    start_date: -0500-02-04
    highlight_event_id: guji-虚空藏菩萨-event-rescue
  decisions:
  - date: -0500-02-02
    title_zh: 教称名烧香诵持神咒归向十方
    rationale: 以大方便接引求财求智求寿求乘诸愿皆令趣向菩提
  - date: -0500-02-03
    title_zh: 随染心烦恼现梵释父母男女等身示正道方药
    rationale: 令犯戒病乱众生梦寤得见忏悔除罪离恶道畏
events:
- id: guji-虚空藏菩萨-event-birth
  type: birth
  title_zh: 无量劫前成就无生法忍首楞严三昧
  date: -2500-01-01
  year_of: -2500
  location_zh: 过去无量佛土
  description: 已过无量无边劫得无生法忍诸无碍智首楞严三昧通达第一义顶现如意宝珠
- id: guji-虚空藏菩萨-event-west
  type: achievement
  title_zh: 西方现如意宝珠赴佉罗帝耶山会
  date: -0500-01-01
  year_of: -500
  location_zh: 佉罗帝耶山仙圣住处西方来路
  description: 西方如意宝珠自然而现光明瞙彻会众四大光明皆灭唯见如来色相光明宝珠
- id: guji-虚空藏菩萨-event-adornment
  type: achievement
  title_zh: 变现娑婆七宝庄严坐大莲华
  date: -0500-01-02
  year_of: -500
  location_zh: 娑婆世界佉罗帝耶山会前
  description: 除山陵臭秽化七宝树衣食满足天乐演法佛前大莲华出结跏趺坐顶有宝珠眷属围绕
- id: guji-虚空藏菩萨-event-dharani
  type: achievement
  title_zh: 说虚空藏神咒授忏悔满愿法
  date: -0500-02-02
  year_of: -500
  location_zh: 佉罗帝耶山会中
  description: 为除病满愿忏根本罪说神咒教烧阿伽楼多伽楼香称名礼拜合掌归向十方
- id: guji-虚空藏菩萨-event-rescue
  type: achievement
  title_zh: 现种种身令犯戒病苦者除罪愈疾
  date: -0500-02-03
  year_of: -500
  location_zh: 诸方土梦寤空处园林
  description: 随应现人形鸟兽梵释男女身示方药正道说八根本罪忏法令不退阿耨多罗三藐三菩提
- id: guji-虚空藏菩萨-event-death
  type: death
  title_zh: 不取涅槃常住化世守法城门
  date: '9999-12-31'
  year_of: 9999
  location_zh: 十方世界
  description: 为辅佐三世诸佛庄严十八法具一切智常现身救护众生不受涅槃之灭
