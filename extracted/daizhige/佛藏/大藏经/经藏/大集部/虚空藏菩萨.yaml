  decisions:
  - date: -0500-01-01
    title_zh: 以三昧力隐没会众色相独显佛宝珠光明
    rationale: 令知诸法真如宝相第一义空离断常见
  - date: -0500-01-02
    title_zh: 变娑婆为七宝庄严除病苦雨天衣天乐
    rationale: 以世谛庄严摄凡愚生厌离欣乐成就三昧
- id: guji-虚空藏菩萨-endeavor-2
  title_zh: 说咒除罪愈病满愿度生
  description: 为犯根本罪病苦求愿众生说神咒忏悔法门随应现身示药示道令住六度不退无上菩提
  phases:
  - key: brewing
    name: 宣说罪相
    labels:
