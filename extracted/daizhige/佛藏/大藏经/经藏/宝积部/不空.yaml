    rationale: 安史扰攘人心须安，唯正法住世可镇国安民，故立译场广出密典。
  - date: '0770'
    title_zh: 决意译弘文殊净刹功德
    rationale: 悯念末世众生愿求净土，欲令知菩萨大悲本愿庄严，故详译佛刹功德流通十方。
events:
