  title_zh: 生于北天竺豪族之家
  place_zh: 北天竺
  description_zh: 唐神龙元年约生，幼失父，随叔父至华，宿缘深厚志在求法。
- id: guji-不空-event-0719
  date: 0719
  year_of: 719
  type: career
  title_zh: 洛阳遇金刚智执弟子礼
  place_zh: 洛阳
  description_zh: 金刚智携弟子东来，十五岁即随侍左右，执役洒扫，始闻金刚乘教法。
- id: guji-不空-event-0741
  date: '0741'
  year_of: 741
  type: career
  title_zh: 泛海赴狮子国求受灌顶
  place_zh: 狮子国
  description_zh: 师命南行取经，历南海诸国，亲近普贤阿阇梨，受一切如来大悲胎藏法，尽得密藏。
- id: guji-不空-event-0746
  date: '0746'
  year_of: 746
  type: career
  title_zh: 归国奉玄宗诏弘化长安
  place_zh: 长安
  description_zh: 携经论至长安，奉诏止大兴善寺，设灌顶道场，为帝后臣民授法，唐密大兴。
- id: guji-不空-event-0756
  date: '0756'
  year_of: 756
  type: career
  title_zh: 肃宗朝开译场广译密经
  place_zh: 长安大兴善寺
  description_zh: 加号开府仪同三司，奉诏译经不辍，兼行息灾护国之法，安抚时艰。
- id: guji-不空-event-0770
  date: '0770'
  year_of: 770
  type: career
  title_zh: 译出大圣文殊师利菩萨佛刹功德庄严经
  place_zh: 长安
  description_zh: 奉代宗诏译出此经，明文殊本愿与寂静调伏音声如来净刹庄严，流通宝积部中。
- id: guji-不空-event-death
  date: '0774'
  year_of: 774
  type: death
  title_zh: 示寂于大兴善寺
  place_zh: 长安大兴善寺
  description_zh: 大历九年六月示寂，年七十，赠司空，谥大辩正广智，门人惠果等继弘密教。
