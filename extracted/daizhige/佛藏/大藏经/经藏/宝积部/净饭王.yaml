  lesson: 去我慢立信幢则父子之亲可转法亲王威可成护法
  summary_first_person: 吾为迦毗罗卫释种之主，悉达太子之父，初以太子舍宫入山为错谬而禁众亲近，既闻优陀夷乘空演法以偈相答，忆太子初生七步瑞相，方发净信设供迎佛，愿以余生护法。
