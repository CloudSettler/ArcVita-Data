  era: 古印度列国时代佛世
  reign_ref: 摩揭陀国频婆娑罗王及阿阇世王世
  archetype: 头陀第一护法请益者
  dilemmas:
  - 忘失菩提心与长养菩提心之间如何抉择
  - 依空见起慢与依中道真实观之间如何持平
  - 亲近恶知识与亲近善知识之间如何取舍
  lesson: 常以至诚清净心尊法敬师，远离憍慢悭嫉，修中道真实观以长养一切善根
  summary_first_person: 我是大迦叶，生于摩揭陀，常行头陀，于王舍城耆阇崛山从佛闻摩诃衍宝严之教，受四法分别与中道真实观，愿以慈覆育众生，堪任重担而不厌倦
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0351
  - https://daizhige.org/佛藏/大藏经/经藏/宝积部/佛说摩诃衍宝严经.html
