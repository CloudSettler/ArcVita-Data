    title_zh: 尊法敬师广说般若
    rationale: 为得般若波罗蜜故舍悭吝，尊法敬师，广为他说而不求报
  - date: -0499
    title_zh: 远恶亲善常念道心
    rationale: 为令菩提心常现在前故远离欺诳谄伪，亲近善知识，不乐小乘
- id: guji-大迦叶-endeavor-2
  title_zh: 修中道真实观弘摩诃衍
  summary_zh: 观诸法空无我无起，离空见病，随病施药化众生
  phases:
  - key: brewing
