  - key: climax
    name: 离空见病
    labels:
      zh: 空断诸见
    start_date: -0498
    highlight_event_id: guji-大迦叶-event-zhongdao
  - key: closure
    name: 随病施药
    labels:
      zh: 众智治病
    start_date: -0498
    highlight_event_id: guji-大迦叶-event-shiyao
  decisions:
  - date: -0499
    title_zh: 不猗空见但观自空
    rationale: 因诸法自空故不用空观空，恐药存成病，宁不以慢猗空
  - date: -0498
    title_zh: 内观制心求出世药
    rationale: 因心如幻不可得故不逐外色声香味，当内观制散求出世智药以治众生病
events:
- id: guji-大迦叶-event-birth
  date: '-0550'
  year_of: -550
  title_zh: 生于摩揭陀婆罗门家
  description_zh: 约公元前六世纪生于王舍城附近，姓迦叶，少多闻，后出家学道
- id: guji-大迦叶-event-baoyan
  date: '-0500'
  year_of: -500
  title_zh: 王舍城耆阇崛山闻佛说宝严
  description_zh: 与八千比丘万六千菩萨俱会，佛告大迦叶说失得般若四法及忘失不忘菩提心四法
- id: guji-大迦叶-event-sifa
  date: '-0500'
  year_of: -500
  title_zh: 受三十二菩萨法及善恶知识分别
  description_zh: 受持四顺四智四道四善知识及三十二法得称菩萨，分别四恶四差违四像以摄善越魔
- id: guji-大迦叶-event-zhongdao
  date: -0499
  year_of: -499
  title_zh: 受中道真实观
  description_zh: 以地水火风日月等喻显功德，观色识地界等无常无我，离有无二边，了十二因缘灭苦
- id: guji-大迦叶-event-shiyao
  date: -0498
  year_of: -498
  title_zh: 受众智治病出世药法
  description_zh: 观心如幻如风如电不可得，以恶露治欲慈治恚缘起治痴空治诸见，随病施治化众生
- id: guji-大迦叶-event-death
  date: '-0450'
  year_of: -450
  title_zh: 佛灭后持头陀护法入灭
  description_zh: 传承宝严正观，护持摩诃衍，后于鸡足山入定持衣待弥勒，示无尽护法之志
