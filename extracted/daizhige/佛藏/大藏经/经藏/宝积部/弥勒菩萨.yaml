  - key: closure
    name: 当来国净时成佛
    labels:
      zh: 待时
    start_date: 3000-01-01
    highlight_event_id: guji-弥勒菩萨-event-future
  decisions:
  - date: -5000-01-01
    title_zh: 伏地发愿得身如炎光佛
    rationale: 见佛经行光明无量不可思议愿后世具足如是威神吉祥故
  - date: -0486-01-01
    title_zh: 立四事不速取正觉
    rationale: 为净国土护国土净一切护一切令当来人民离垢奉行十善故留
  - date: -0486-01-01
    title_zh: 行昼夜三时善权偈
    rationale: 不以头目身命苦施以悔过劝德归命安乐行速致佛道故
events:
- id: guji-弥勒菩萨-event-birth
  type: birth
  title_zh: 贤行梵志生于炎光佛世
  date: -5000-01-01
  year_of: -5000
  location_zh: 炎光具向作王如来国土
  description_zh: 长者子梵志名贤行端正具德后从园观出见佛经行而发大愿
- id: guji-弥勒菩萨-event-vow
  type: career
  title_zh: 见炎光佛发愿蒙践得不起法忍
  date: -5000-01-01
  year_of: -5000
  location_zh: 炎光具向作王如来经行处
  description_zh: 伏地愿后得法身如佛佛过其身上即得不起忍具五通眼洞视耳彻听知他心自识宿命身能飞行以偈稽首觉导师
- id: guji-弥勒菩萨-event-ask
  type: career
  title_zh: 披只妙华山请问菩萨一至十法行
  date: -0486-01-01
  year_of: -486
  location_zh: 披只国妙华山恐惧树间鹿聚处
  description_zh: 与五百比丘五百菩萨俱长跪问菩萨弃恶道不随恶知识之行佛答寂静平等定慧大哀空净戒定等一至十法及金刚宝月等十三昧
- id: guji-弥勒菩萨-event-praise
  type: career
  title_zh: 以偈赞佛六度降魔转轮之德
  date: -0486-01-01
  year_of: -486
  location_zh: 披只国妙华山会中
  description_zh: 赞佛本布施妻子头目护戒如鹖爱毛忍等苦乐精进断恶慧寂树下降魔师子吼转轮阿难叹其愿具足说法无缺佛证其辩才具足
- id: guji-弥勒菩萨-event-repent
  type: career
  title_zh: 发昼夜善权忏悔劝请本愿
  date: -0486-01-01
  year_of: -486
  location_zh: 披只国会上
  description_zh: 佛说其不以耳鼻头目布施但昼夜各三正衣叉手下膝向十方诵悔过劝德归命偈愿国中人民无垢奉行十善淫怒痴薄时乃取正觉
- id: guji-弥勒菩萨-event-future
  type: career
  title_zh: 当来人民奉行十善时龙华成佛
  date: 3000-01-01
  year_of: 3000
  location_zh: 当来人间净土
  description_zh: 本愿所致后世人民无垢秽奉行十善不以淫怒痴经心时弥勒当得无上正真道先释迦四十二劫发而以四事留后
- id: guji-弥勒菩萨-event-death
  type: death
  title_zh: 当来成佛度众后般涅槃
  date: 3000-01-01
  year_of: 3000
  location_zh: 当来净土
  description_zh: 依本愿于国净时取正觉说法导御众生功圆示现般涅槃经名本愿慈氏本行弥勒所问众喜奉行
