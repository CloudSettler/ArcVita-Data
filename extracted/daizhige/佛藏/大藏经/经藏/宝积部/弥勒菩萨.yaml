    start_date: -5000-01-01
    highlight_event_id: guji-弥勒菩萨-event-vow
  - key: breakthrough
    name: 蒙践得忍具通
    labels:
      zh: 得忍
    start_date: -5000-01-01
    highlight_event_id: guji-弥勒菩萨-event-vow
  - key: climax
    name: 昼夜忏悔劝助归命
