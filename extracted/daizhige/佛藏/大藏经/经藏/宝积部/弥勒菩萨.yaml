  reign_ref: 炎光具向作王如来世及释迦牟尼披只国说法时
  archetype: 慈氏本愿者
  dilemmas:
  - title_zh: 速取正觉与留世待时
    description_zh: 以净国土护国土净一切护一切四事故暂不取佛待人民奉行十善时乃成道
  - title_zh: 苦行施身与善权安乐
    description_zh: 不持头目身命妻子国土布施但以昼夜忏悔劝助归命方便得无上道
  lesson: 不争先成忍时待机以忏悔劝请慈愿净土安乐一切为成佛正路
  summary_first_person: 我本贤行梵志于园观见炎光具向作王如来身光巍巍发愿当来得身如佛伏地请践蒙佛过身得不起法忍具五通以偈赞佛后于披只妙华山从释迦问菩萨弃恶道行得闻一至十法复以偈赞昼夜忏悔劝助归命发愿当来国土无垢人民奉行十善淫怒痴薄时乃取正觉
