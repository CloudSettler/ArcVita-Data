    rationale: 为哀念安隐天人令菩萨不堕恶道故问如来
  - date: -0486-01-01
    title_zh: 以偈赞叹佛本布施戒忍进定慧
    rationale: 感佛具说菩萨行欲显佛德度无极导御众生故赞
- id: guji-弥勒菩萨-endeavor-2
  title_zh: 修善权本愿待当来净土成佛
  summary_zh: 昔为贤行梵志见炎光佛发愿得身如其光色蒙践得不起法忍具天眼天耳他心宿命神足后发四事先他之愿昼夜三时忏悔劝助归命待人民无垢奉行十善时乃取正觉超越释迦之前发而后成
  phases:
