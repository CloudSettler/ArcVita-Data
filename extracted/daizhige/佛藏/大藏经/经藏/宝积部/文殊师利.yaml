  year_of: -599
  location_zh: 舍卫国祇树给孤独园
  description_zh: 善胜天子说兜率诸天耽著境界善根将退请文殊暂往天宫弘宣法要
- id: guji-文殊师利-event-manifest-palace
  type: career
  title_zh: 三昧化现兜率天宫
