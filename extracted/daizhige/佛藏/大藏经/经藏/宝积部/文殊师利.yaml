  year_of: -599
  location_zh: 舍卫国祇树给孤独园
  description_zh: 入一切法心自在三昧现恒沙国土纳於毛孔芥子等神变魔见欢喜说陀罗尼誓护持是经擁护法师
- id: guji-文殊师利-event-tusita-preach
  type: career
  title_zh: 建道场赴兜率天说法
  date: -0599-04-01
  year_of: -599
  location_zh: 兜率陀天宫道场
  description_zh: 善胜天子先往天宫建广博道场置师子座文殊与万二千菩萨千五百声闻天龙等没於佛前赴天弘法
- id: guji-文殊师利-event-death
  type: death
  title_zh: 不示入灭常住化度
  date: 9999-12-31
  year_of: 9999
  location_zh: 法界平等无所住处
  description_zh: 菩萨住无所住正位不证实际不舍大悲所作未尝休息无有入灭之期权立远未来以全始终
