  title_zh: 说空无相无愿烦恼即菩提
  date: -0600-02-01
  year_of: -600
  location_zh: 舍卫国祇树给孤独园
  description_zh: 说佛於空无相无愿无作无生无为得菩提烦恼自性即佛境界自性凡夫起贪嗔痴处即如来平等所住
- id: guji-文殊师利-event-three-vehicles
