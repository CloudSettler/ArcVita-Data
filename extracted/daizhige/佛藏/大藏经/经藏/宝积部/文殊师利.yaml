  year_of: -600
  location_zh: 舍卫国祇树给孤独园
  description_zh: 答须菩提说身为声闻为众生说未闻法身为辟支佛了知缘起身为正觉恒觉体相平等决定住一切地而不住
- id: guji-文殊师利-event-awakening
  type: career
