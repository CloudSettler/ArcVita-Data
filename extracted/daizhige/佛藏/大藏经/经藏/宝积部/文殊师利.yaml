  date: -0600-04-01
  year_of: -600
  location_zh: 舍卫国祇树给孤独园
  description_zh: 说法时五百比丘漏尽解脱八百天子得法眼净七百天子发无上菩提心二百比丘奉衣信受
- id: guji-文殊师利-event-tusita-invite
