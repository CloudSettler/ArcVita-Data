  summary_first_person: 我本憍闪弥日子王因信无比摩建你迦谗言谓舍摩嚩底与沙门行淫怒而放箭杀之夫人入慈心定箭出火焰回住我前我惊怖归命惭谢偕夫人诣瞿尸罗林见佛发露忏悔闻佛说丈夫淫欲四过及孝养功德遂归佛法僧永舍淫欲刀杖愿利众生
