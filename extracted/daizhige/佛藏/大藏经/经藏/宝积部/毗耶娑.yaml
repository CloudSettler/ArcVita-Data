events:
- id: guji-毗耶娑-event-birth
  title_zh: 降生為揵陀迦離婦人之子具五通
  date: '-1500'
  year_of: -1500
  description: 傳為婆羅門仙人造四毗陀善知聲論種種書論悉皆通達
- id: guji-毗耶娑-event-ascetic
  title_zh: 率五百仙住西方苦行不食而齋
  date: '-1450'
  year_of: -1450
  description: 與阿斯仙等眷屬相隨繫縛手足懸樹臥塵讀誦不輟自謂正行
- id: guji-毗耶娑-event-see-buddha
  title_zh: 見佛在阿逾闍林相好寂靜
  date: '-1450'
  year_of: -1450
  description: 見世尊捨王欲樂具諸相好諸根調柔即與仙眾合掌欲往佛所
- id: guji-毗耶娑-event-ask-dana
  title_zh: 詣佛問布施施主福報塔供
  date: '-1450'
  year_of: -1450
  description: 問何義布施何義施主死後施福隨行供養涅槃塔廟云何得福聞三十三垢染施及五種淨施無上大施
- id: guji-毗耶娑-event-ask-consciousness
  title_zh: 復問識轉身城善惡趣報
  date: '-1450'
  year_of: -1450
  description: 問識云何身中轉云何見貪樂眾生本性云何生天鬼畜獄聞王城筏喻及胎藏善惡之相
- id: guji-毗耶娑-event-refuge
  title_zh: 離疑歸依佛法僧受三歸
  date: '-1450'
  year_of: -1450
  description: 自念老弊不能荷負菩提重擔遂禮佛足與弟子眾盡形歸命願聞正法
- id: guji-毗耶娑-event-death
  title_zh: 示寂於上古傳說之世
  date: '-1400'
  year_of: -1400
  description: 世傳仙壽既盡而終其所問布施識神之義結為毗耶娑問經流傳後世
