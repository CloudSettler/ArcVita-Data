events:
- id: guji-法宝藏-event-birth
  title_zh: 过去劫中诞生为世饶王国人
  date: -1200-01-01
  year_of: -1200
  place_zh: 世饶王佛世阎浮利地
  detail: 过去久远不可计劫前值世饶王佛在世说法时生于其国后为国王名世饶王
- id: guji-法宝藏-event-renunciation
  title_zh: 闻经开解弃国作比丘
  date: -1200-06-01
  year_of: -1200
  place_zh: 世饶王佛所
  detail: 闻佛说经讲道欢喜开解便弃国位行作比丘名昙摩迦留号法宝藏为人高才智慧勇猛
- id: guji-法宝藏-event-vow24
  title_zh: 赞佛发愿结得二十四愿
  date: -1199-06-01
  year_of: -1199
  place_zh: 世饶王佛前
  detail: 以偈赞佛光明威神而发无上正真道意蒙佛授以二百一十亿佛国善恶而壹心选择结得二十四愿精进奉行
- id: guji-法宝藏-event-buddhahood
  title_zh: 功成自致作无量清净佛
  date: -1100-01-01
  year_of: -1100
  place_zh: 西方须摩提国
  detail: 师事供养无央数佛积功累德无央数劫而自致作佛号无量清净觉光明最尊第一国在西方去阎浮利千亿万须弥山佛国七宝平正教授八方
- id: guji-法宝藏-event-death
  title_zh: 寿长无央今现在说法未入灭
  date: 9999-12-31
  year_of: 9999
  place_zh: 西方须摩提国
  detail: 作佛已来凡历十八劫寿命极寿无央数劫国中皆菩萨阿罗汉无有恶道今现在说法度脱天上天下蜎飞蠕动之类莫不得解脱
