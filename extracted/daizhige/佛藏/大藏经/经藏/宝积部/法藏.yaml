  decisions:
  - date: -4999-06-01
    title_zh: 弃国捐王行作沙门
    rationale: 闻佛说法悟世非常，愿求无上正觉拔生死勤苦之本，故舍财位入道
  - date: -4999-08-01
    title_zh: 摄取佛国发超世愿
    rationale: 见二百一十亿佛土善恶粗妙，应心愿悉现，遂寂静思惟发国无恶道众生皆金色具宿命天眼等四十八愿
- id: guji-法藏-endeavor-2
  person_id: guji-法藏
  title_zh: 长劫修行成就西方安乐国
  summary_zh: 五劫思惟摄取庄严佛国清净之行，兆载永劫积功累德行六度教化众生，成佛号无量寿世界名安乐
  phases:
  - key: brewing
    name: 五劫思惟摄取净行
    labels:
