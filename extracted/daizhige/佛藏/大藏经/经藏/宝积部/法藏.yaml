    start_date: -4900-01-01
    highlight_event_id: guji-法藏-event-buddhahood
  decisions:
  - date: -4998-01-01
    title_zh: 一向专志庄严妙土
    rationale: 愿已发起悦大众，当如所闻修行成满，故具足五劫思惟摄取清净之行
  - date: -4950-01-01
    title_zh: 不生欲觉恚害觉长劫利生
    rationale: 为令众生功德成就住无上正真道，故不行欲想嗔想，行六波罗蜜教人令行，随生处教化安立无数众生
events:
- id: guji-法藏-event-birth
  person_id: guji-法藏
  date: -5000-01-01
  year_of: -5000
  type: birth
  title_zh: 过去久远劫为国王
  description_zh: 乃往过去久远无量不可思议无央数劫，世自在王如来出世时，有国王闻佛说法心怀悦豫
- id: guji-法藏-event-hear
  person_id: guji-法藏
  date: -4999-05-01
  year_of: -4999
  type: career
  title_zh: 闻法发无上正真道意
  description_zh: 国王闻世自在王佛说法，寻发无上正真道意，愿修行摄取佛国清净庄严无量妙土
- id: guji-法藏-event-renounce
  person_id: guji-法藏
  date: -4999-06-01
  year_of: -4999
  type: career
  title_zh: 弃国捐王诣佛赞颂
  description_zh: 弃国捐王行作沙门号曰法藏，高才勇哲诣佛所稽首绕佛三匝，以颂赞光颜巍巍威神无极，愿作佛齐圣法王国土第一
- id: guji-法藏-event-vow
  person_id: guji-法藏
  date: -4999-08-01
  year_of: -4999
  type: career
  title_zh: 睹二百一十亿佛土发四十八愿
  description_zh: 世自在王佛广说二百一十亿诸佛刹土悉现与之，法藏睹见超发殊胜愿，说设我得佛国有地狱饿鬼畜生者不取正觉乃至闻名得忍至不退转等四十八愿，应时普地六种震动天雨妙华
- id: guji-法藏-event-practice
  person_id: guji-法藏
  date: -4998-01-01
  year_of: -4998
  type: career
  title_zh: 五劫思惟兆载永劫修行
  description_zh: 具足五劫思惟摄取庄严佛国清净之行，于不可思议兆载永劫积殖菩萨无量德行，不著色声香味触，行六波罗蜜，或为长者居士国君天主，常供养恭敬一切诸佛，教化安立无数众生住无上道
- id: guji-法藏-event-buddhahood
  person_id: guji-法藏
  date: -4900-01-01
  year_of: -4900
  type: career
  title_zh: 成佛西方安乐国号无量寿
  description_zh: 法藏今已成佛现在西方去此十万亿刹，世界名曰安乐，成佛以来凡历十劫，国土自然七宝为地无须弥山无恶道，威神光明最尊第一号无量光等，十方众生至心信乐十念欲生皆得往生
- id: guji-法藏-event-death
  person_id: guji-法藏
  date: 9999-12-31
  year_of: 9999
  type: death
  title_zh: 无量寿现在说法未入灭度
  description_zh: 无量寿佛寿命无能限量，除本愿修短自在，常现在西方说法，光明普照无量佛土，接引十方众生，未取灭度
