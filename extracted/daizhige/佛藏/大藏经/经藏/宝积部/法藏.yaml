  summary_first_person: 我本为国王，闻世自在王如来说法心怀悦豫，发无上正真道意，弃国捐王行作沙门号曰法藏，睹见二百一十亿诸佛刹土，发四十八超世大愿，经五劫思惟兆载永劫修行，今已成佛现在西方去此十万亿刹，世界名曰安乐，号无量寿，光明威神最尊第一，普度十方来生者皆得快乐安隐
