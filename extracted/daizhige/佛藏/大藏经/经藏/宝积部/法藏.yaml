  person_id: guji-法藏
  title_zh: 诣世自在王佛发四十八超世大愿
  summary_zh: 闻法悦豫弃国出家，赞佛功德，求净土行，睹二百一十亿佛土，发无地狱恶道乃至十念必生等四十八愿
