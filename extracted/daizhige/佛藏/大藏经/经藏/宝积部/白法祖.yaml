    rationale: 令学者备观身污秽危脆无常，以离吾我贪命之缚，速具六度
- id: guji-白法祖-endeavor-2
  title_zh: 河雒弘化以慈悲普济
  summary: 弘演舍卫祇树之化，劝五百长者发无上道意，守大慈大悲戒忍进定智。
