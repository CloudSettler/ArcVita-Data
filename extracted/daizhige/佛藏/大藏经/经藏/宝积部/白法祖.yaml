    title_zh: 以观身破贪兼弘大慈普济
    rationale: 众生堕狱多由身口意恶，故先观身离著，再兴无极大慈利他
  - date: '0300'
    title_zh: 劝书持讽诵广示于众
    rationale: 此观要法为三世诸佛致道所由，当令流通不断
