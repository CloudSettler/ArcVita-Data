  lesson: 以空无相无愿观生死危脆，以无起无得破言说戏论，直发无上正真道意
  summary_first_person: 吾为舍卫波斯匿王女，名维摩罗达，年十二，初生即于空中闻天众叹佛功德，自是不识睡眠淫怒，不贪父母亲属璎珞国城，昼夜观佛听法无厌，于城门以颂止梵志邪见，礼敬八弟子八菩萨，連以空义问难，皆默然无报，复为父王说生死毒蛇之畏，唯愿众生离垢同证菩提
