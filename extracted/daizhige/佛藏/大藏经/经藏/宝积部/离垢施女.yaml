  description: 波斯匿王生女，名维摩罗达，晋言离垢施，端正殊妙，色如妙华
- id: guji-离垢施女-event-1
  title_zh: 初生空中闻天叹佛
  date: '-0520'
  year_of: -520
  place_zh: 舍卫国王宫金宝床上
  description: 初生时母置金宝床上，虚空五百天子飞行叹佛三十二相功德，自是昼夜见佛听法，不生淫怒愚痴，不贪世乐
- id: guji-离垢施女-event-2
  title_zh: 城门颂德却梵志邪论
  date: -0508
  year_of: -508
  place_zh: 舍卫城门祠坛道上
  description: 年十二月八日与五百侍女出游，梵志见比丘言不祥劝还，女以颂赞圣众为上良医上福田，梵天等闻之皆发无上道意，女下车礼足八弟子八菩萨
- id: guji-离垢施女-event-3
  title_zh: 连问群贤及对王说无常
  date: -0508
  year_of: -508
  place_zh: 舍卫城门
  description: 次第问舍利弗智慧有为无为，目连神足人想法想，迦叶身心了食，须菩提空说，乃至文殊缘起本际，及八菩萨誓愿，皆令默然，复为父王说阴患危脆四蛇之喻发菩提心
- id: guji-离垢施女-event-death
  title_zh: 离垢施女示寂无考
  date: '-0450'
  year_of: -450
  place_zh: 舍卫国
  description: 经后行迹无载，约终于佛灭前后，功德在辩才显空劝发道意
