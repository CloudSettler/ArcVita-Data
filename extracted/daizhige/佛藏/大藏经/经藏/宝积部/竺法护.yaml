  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉
  archetype: 译经弘法者
  dilemmas:
  - 西行求经艰险与中土护持正法如何两全
  - 声闻持戒与菩萨开通摄生如何抉择
  lesson: 以不舍众生弘愿持开通之戒译经度生
  summary_first_person: 我生于炖煌，本名昙摩罗刹，八岁出家，从师诵习，慨然西行求经三十六国，携梵本东归，于长安洛阳译经弘化百五十余部，愿以方便护持正法，成就无量众生，不舍生死，不入涅槃。
