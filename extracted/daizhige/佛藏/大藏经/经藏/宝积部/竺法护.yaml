    rationale: 末世众生堪忍护持正法，须以大乘方便摄化令住佛法不断菩提心
  - date: 0290
    title_zh: 译决定毗尼显开通戒
    rationale: 声闻持尽护戒，菩萨持开通不尽护戒，为不断生死度生故分别演说
events:
- id: guji-竺法护-event-birth
  date: '0231'
  year_of: 231
  title_zh: 诞生于炖煌竺氏
  summary: 约太始七年生于炖煌，八岁出家，从师诵习，天性颖悟，博览群经
- id: guji-竺法护-event-qiujing
  date: '0266'
  year_of: 266
  title_zh: 西行三十六国求经
  summary: 携弟子西逾流沙，遍历三十六国，求得梵本百六十五部，通三十六国语言，七年东归
- id: guji-竺法护-event-yijing
  date: 0290
  year_of: 290
  title_zh: 译佛说决定毗尼经
  summary: 于洛阳长安译出决定毗尼经，明菩萨不尽护开通深入之戒，及三十五佛忏悔法门，列入宝积部
- id: guji-竺法护-event-death
  date: 0308
  year_of: 308
  title_zh: 圆寂于洛阳
  summary: 永嘉之乱避地东归，春秋七十有八圆寂，译经百五十四部，门徒千人，法化大行
