    title_zh: 决意西行求梵本
    rationale: 中土经阙未备，欲弘大乘须亲往西域求取原本以正翻译之源
  - date: 0269
    title_zh: 携经东归不留西土
    rationale: 愍念中土众生无依，愿以所得梵本归化洛阳长安成就众生
