person:
  qid: guji-观世音菩萨
  name_zh: 观世音菩萨
  names:
    zh: 观世音菩萨
    en: Avalokitesvara
  lifespan:
    birth:
      date: -50000-01-01
      precision: circa
      is_circa: true
      raw: 过去无量劫无量德聚安乐示现国金光师子游戏佛时化生莲花为宝意童子
    death:
      date: '9999-12-31'
      precision: circa
      is_circa: true
      raw: 未来众宝普集庄严国成佛号普光功德山王后般涅槃未至以表无量寿
  birth_date: -50000-01-01
  death_date: '9999-12-31'
  era: 佛经传说过去无量劫至未来劫
  reign_ref: 金光师子游戏如来时至阿弥陀佛时至未来普光功德山王时
  archetype: 大悲救度菩萨
  dilemmas:
  - 云何供养无上两足尊为最胜，花香伎乐与发菩提心何者为上
  - 生死无量劫本际不可知，为一众生久行道而不生疲厌云何坚持
  lesson: 以发菩提心广济群生为最胜供养，以无量誓愿慈悲度众终得授记成佛
  summary_first_person: 我本是威德王园观莲花所化宝意童子，于金光师子游戏佛前初发菩提弘誓度众，后辅佐安乐世界阿弥陀佛得如幻三昧，化宝台赴娑婆礼拜释迦牟尼听法，蒙记阿弥陀般涅槃后继成正觉号普光功德山王
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AE%9D%E7%A7%AF%E9%83%A8/%E8%A7%82%E4%B8%96%E9%9F%B3%E8%8F%A9%E8%90%A8%E6%8E%88%E8%AE%B0%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0371
