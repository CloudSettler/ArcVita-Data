    start_date: -49997-01-01
    highlight_event_id: guji-观世音菩萨-event-vow
  decisions:
  - date: -49999-01-01
    title_zh: 以发菩提心为供养
    rationale: 佛说满恒沙刹珍妙奉献不如以慈心回向菩提，故舍事供取心供
  - date: -49998-01-01
    title_zh: 立生死无量劫度众不求声闻缘觉
    rationale: 为令一切众生得无生证以佛涅槃而般涅槃，故愿为一众生尔数劫行道不生疲厌
- id: guji-观世音菩萨-endeavor-2
  title_zh: 辅佐安乐赴娑婆受记当成佛
  summary_zh: 得如幻三昧辅佐阿弥陀佛，化宝台率四十亿菩萨赴娑婆礼释迦听珍宝处三昧，蒙记继阿弥陀后成普光功德山王如来
  phases:
  - key: brewing
    name: 安乐修证如幻三昧
    labels:
      zh: 定慧神通
    start_date: -0501-01-01
    highlight_event_id: guji-观世音菩萨-event-manifest
  - key: breakthrough
    name: 化宝台赴娑婆世界
    labels:
      zh: 神通赴会
    start_date: -0500-01-01
    highlight_event_id: guji-观世音菩萨-event-manifest
  - key: climax
    name: 鹿苑听法见十方佛
    labels:
      zh: 闻法见佛
    start_date: -0499-06-01
    highlight_event_id: guji-观世音菩萨-event-manifest
  - key: closure
    name: 蒙记未来成佛作祖
    labels:
      zh: 授记成佛
    start_date: -0498-01-01
    highlight_event_id: guji-观世音菩萨-event-succession
  decisions:
  - date: -0500-01-01
    title_zh: 往诣娑婆礼拜释迦听法
    rationale: 释迦于浊恶世以本愿兴大悲成道说法难行能行，往礼供养可令善根众生得三昧发愿生安乐
  - date: -0498-01-01
    title_zh: 承继阿弥陀正法后方成正觉
    rationale: 阿弥陀寿命无量终有终极，正法灭后中夜明相出时于菩提树下成佛，令国无声闻纯诸菩萨故安住继位
events:
- id: guji-观世音菩萨-event-birth
  title_zh: 威德王园观莲花化生为宝意童子
  type: birth
  date: -50000-01-01
  year_of: -50000
  place_zh: 无量德聚安乐示现国威德王园观
  summary_zh: 威德王入三昧时左右有二莲花从地踊出，右面童子化生加趺而坐名宝意，后证为观世音前身
- id: guji-观世音菩萨-event-vow
  title_zh: 金光师子游戏佛前初发菩提弘誓
  type: career
  date: -49998-01-01
  year_of: -49998
  place_zh: 无量德聚安乐示现国金光师子游戏佛所
  summary_zh: 与宝上童子同声偈问最胜供养，闻发菩提心为上遂师子吼誓生死无量劫度脱众生令己国超逾亿百千清净庄严，说已大千震动天雨末香
- id: guji-观世音菩萨-event-manifest
  title_zh: 化宝台率众赴娑婆礼释迦
  type: career
  date: -0500-01-01
  year_of: -500
  place_zh: 西方安乐世界至娑婆世界波罗奈鹿苑
  summary_zh: 与得大势受阿弥陀教，各化四十亿庄严宝台纵广十二由旬，屈伸臂顷至娑婆问讯释迦少病少恼，令娑婆地平如水光明遍照
- id: guji-观世音菩萨-event-succession
  title_zh: 蒙记继阿弥陀后成普光功德山王佛
  type: career
  date: -0498-01-01
  year_of: -498
  place_zh: 娑婆世界鹿苑释迦法会中受记未来事
  summary_zh: 释迦记阿弥陀般涅槃正法灭后过中夜分，观世音于七宝菩提树下成等正觉号普光功德山王，国名众宝普集庄严纯诸菩萨无声闻名
- id: guji-观世音菩萨-event-death
  title_zh: 未来普光功德山王如来般涅槃
  type: death
  date: '9999-12-31'
  year_of: 9999
  place_zh: 未来众宝普集庄严国
  summary_zh: 随寿命住世度众后般涅槃付法得大势，奉持正法乃至灭尽得大势继成善住功德宝王如来，表菩萨继佛无尽
