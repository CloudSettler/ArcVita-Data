    title_zh: 见十种娆乱决意出家
    rationale: 见生老病死忧悲苦恼愁叹轮回合集苦大不堪安住宫廷富乐当求不老不死安乐门
  - date: -0528-12-08
    title_zh: 拔除十种大病箭誓成正觉
    rationale: 为普令众生拔除爱无明欲贪嗔痴慢见成坏诸箭非证菩提不能救护
- id: guji-释迦牟尼-endeavor-2
  title_zh: 鹫峰化导贤护等长者
  summary_zh: 夏安居满自舍卫至摩伽陀王舍鹫峰乞食说法以十害十见十爱本等法化导贤护等五百长者令发菩提心
