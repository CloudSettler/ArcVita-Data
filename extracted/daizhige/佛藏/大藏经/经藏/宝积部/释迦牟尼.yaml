  dilemmas:
  - 安享王宫富乐与直面生老病死轮回众苦当如何抉择
  - 自求解脱安乐与普令众生出离嗔害邪见病箭缠缚当如何兼顾
  lesson: 见苦发心因悲出家以智照破邪见以慈拔除病箭普令众生安住无染
  summary_first_person: 我见生老病死忧悲苦恼愁叹轮回十种娆乱合集世间复见嗔害十事险恶十见大病十箭爱本十法邪聚十法不善十业杂染十法生死怖畏深苦甚大为令众生超越邪法出离恶道拔除病箭是故净信出家趣证无上菩提复于摩伽陀国王舍鹫峰为贤护等五百长者宣说菩萨藏正法
