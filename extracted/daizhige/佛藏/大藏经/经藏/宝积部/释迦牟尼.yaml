    highlight_event_id: guji-释迦牟尼-event-vulture-teach
  - key: closure
    name: 长者发心转白衣舍
    labels:
      zh:
      - 五百发心
      - 白衣转出家相
    start_date: -0526-08-03
    highlight_event_id: guji-释迦牟尼-event-vulture-teach
  decisions:
  - date: -0526-08-01
    title_zh: 随宜为成熟善根者说法
    rationale: 见五百长者善根成熟深生净信当应机说娆乱损害险见病箭等法令求解脱
  - date: -0526-08-02
    title_zh: 以问答重宣出家本怀
    rationale: 借长者问舍家因缘具说十损害十邪聚十恶业十杂染十怖畏令知出家为救护世间非为自安
