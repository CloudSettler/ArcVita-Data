    title_zh: 被骂詈刀杖不嗔不杀
    rationale: 种善生善道种恶堕恶道不以恶报恶坚行慈心
  - date: -0475-03-01
    title_zh: 见七宝不动不取
    rationale: 前恶致贫今若犯不与取则失明智当知足少欲观无常苦空不净
  - date: -0475-05-01
    title_zh: 拒重宝不为妄语作证
    rationale: 妄言自欺欺圣断善本趣恶道虽满天下金珠不为发言
  - date: -0475-08-01
    title_zh: 视天女如幻沫不净地狱行
    rationale: 贪欲亲苦亲恶亲鬼畜离戒闻施损无上道故当离色求普安一切成佛
