    title_zh: 得宝不自取求施极贫
    rationale: 财虽丰而不知饱者为贫家无储而有舍心者为富故以宝惠极贫
  - date: -0470-02-01
    title_zh: 指王为极贫不惧王法
    rationale: 王侵克他有贪财宝娆下贫着色欲以法自校则王贫我富
  - date: -0470-03-01
    title_zh: 至诚叉手请佛证明
    rationale: 师行不违愍一切故至心立誓佛必乘空而来决贫富疑
  - date: -0470-05-01
    title_zh: 劝王立普施诣佛闻法
    rationale: 菩萨不独为己为安一切故以衣施贫穷以道意报恩令众见佛不忘
