endeavors:
- id: guji-一行-endeavor-1
  title_zh: 承善无畏学密并述记大毗卢遮那佛眼仪轨
  summary: 依善无畏金刚智受胎金两部灌顶，助译大日经，述记佛眼修行仪轨，明五方佛色相漫荼罗与诸明王护身结界之次第
  phases:
  - key: brewing
    name: 嵩山出家博览显教
    labels:
      zh:
      - 出家
      - 律禅
      - 博学
    start_date: '0705'
    highlight_event_id: guji-一行-event-tonsure
  - key: breakthrough
    name: 京洛从善无畏受密法
    labels:
      zh:
      - 灌顶
      - 译经
      - 胎藏密教
    start_date: '0716'
    highlight_event_id: guji-一行-event-initiation
  - key: climax
    name: 述记佛眼仪轨判摄五色漫荼罗
    labels:
      zh:
      - 述记
      - 佛眼明妃
      - 漫荼罗
    start_date: '0722'
    highlight_event_id: guji-一行-event-yigui
  - key: closure
    name: 金刚手印可流通护国
    labels:
      zh:
      - 印可
      - 护国
      - 流通
    start_date: '0725'
    highlight_event_id: guji-一行-event-yigui
  decisions:
  - date: '0716'
    title_zh: 决意亲承善无畏而助译大日经
    rationale: 以如来种性统摄三密，非依具德阿阇梨灌顶教授不能得真密意，故舍旧学而专事密藏
  - date: '0722'
    title_zh: 以述记显密意而不立私说
    rationale: 引先佛所说与金刚手印可为证，令黄色赤色等各有所表，行者随寂灾增益等事业安住本位，免堕文执与灰断
- id: guji-一行-endeavor-2
  title_zh: 奉诏治历测晷成大衍历以济时用
  summary: 受玄宗诏与梁令瓒等造黄道游仪测晷，考三统旧历得失，撰大衍历，兼通天文地理以定国用
  phases:
  - key: brewing
    name: 少习历算隐遁不仕
    labels:
      zh:
      - 历算
      - 隐逸
      - 儒史
    start_date: 0698
    highlight_event_id: guji-一行-event-birth
  - key: breakthrough
    name: 奉诏入局考验晷漏
    labels:
      zh:
      - 奉诏
      - 测晷
      - 游仪
    start_date: '0721'
    highlight_event_id: guji-一行-event-calendar-start
  - key: climax
    name: 撰成大衍历颁行天下
    labels:
      zh:
      - 大衍历
      - 推步
      - 颁行
    start_date: '0727'
    highlight_event_id: guji-一行-event-calendar-done
  - key: closure
    name: 示寂后历法通行护持国土
    labels:
      zh:
      - 示寂
      - 国师礼葬
      - 惠民
    start_date: '0727'
    highlight_event_id: guji-一行-event-death
  decisions:
  - date: '0721'
    title_zh: 受诏以历法济世而不辞劳怨
    rationale: 日月交食晷漏失度则农时国政皆乱，以出家人慈悲不舍世间，故以天文历数成办护国事业
  - date: '0725'
    title_zh: 会通儒释历算而不执一家
    rationale: 以法界缘起观历数，兼采旧历之长而正其谬，令推步合天以显佛法圆融无碍
events:
- id: guji-一行-event-birth
  date: 0683
  year_of: 683
  title_zh: 钜鹿张遂生
  description: 俗姓张名遂生于钜鹿，少聪慧博览经史历算
  location_zh: 钜鹿
- id: guji-一行-event-tonsure
  date: '0705'
  year_of: 705
  title_zh: 依嵩山大照出家
  description: 遁入嵩山依大照禅师出家受具，名一行，精律禅兼究天文
  location_zh: 嵩山
- id: guji-一行-event-initiation
  date: '0716'
  year_of: 716
  title_zh: 从善无畏金刚智受灌顶助译大日经
  description: 于洛阳大福先寺从善无畏受胎藏灌顶，与无行等助译毗卢遮那成道经并作疏记
  location_zh: 洛阳大福先寺
- id: guji-一行-event-yigui
  date: '0722'
  year_of: 722
  title_zh: 述记大毗卢遮那佛眼修行仪轨
  description: 述金刚手所说不动降三世军荼利等明王护身结界及佛眼明妃加持五处次第，判五色漫荼罗摄诸事业
  location_zh: 长安
- id: guji-一行-event-calendar-start
  date: '0721'
  year_of: 721
  title_zh: 奉诏与梁令瓒测晷造仪
  description: 奉玄宗诏率官吏测晷于天下十三处，造黄道游仪以考日行
  location_zh: 长安
- id: guji-一行-event-calendar-done
  date: '0727'
  year_of: 727
  title_zh: 大衍历成
  description: 撰成大衍历五十二卷，纠正旧历谬误，颁用惠及农时国政
  location_zh: 长安
- id: guji-一行-event-death
  date: '0727'
  year_of: 727
  title_zh: 示寂于新丰葬以国师礼
  description: 开元十五年十月示寂于新丰，玄宗辍朝三日，谥大慧禅师，塔于铜人原
  location_zh: 新丰
