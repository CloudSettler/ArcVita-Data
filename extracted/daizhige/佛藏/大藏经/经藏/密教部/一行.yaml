  dilemmas:
  - title_zh: 出世持戒与入世经世之抉择
    description: 少通儒史历算而屡辞征辟，终依嵩山出家，以密法护国与历法惠民调和出离与济世
  - title_zh: 显密会通与深密不妄传之戒
    description: 既欲令行者依法得验同于本尊，又须遵金刚手深密付嘱不向无器轻泄，故述记详明仪轨而诫忘勿传授
  lesson: 以菩提悲心为体，以无垢慧火断三毒障，以如来种性统摄一切事业，方得理事圆融
  summary_first_person: 吾俗姓张名遂钜鹿人，少览经史兼明历算，后依嵩山大照出家号一行，亲承善无畏金刚智灌顶，译大日经而述记佛眼仪轨，又奉诏改历成大衍历，愿安住本尊漫荼罗位而作寂灾增益降伏事业
