endeavors:
- id: guji-一行-endeavor-1
  title_zh: 修述梵天火罗九曜九执法
  summary_zh: 会通印度九曜二十八宿与中土分野行年之说，定吉凶祭禳仪轨
  phases:
  - key: brewing
    name: 博览天文密教
    labels:
      zh: 博学积累
    start_date: 459
    highlight_event_id: guji-一行-event-jiuyao
  - key: breakthrough
    name: 定九曜行年次第
    labels:
      zh: 体系初成
    start_date: 464
    highlight_event_id: guji-一行-event-jiuyao
  - key: climax
    name: 修述九曜真言供养法
    labels:
      zh: 著述弘传
    start_date: 468
    highlight_event_id: guji-一行-event-jiuyao
  - key: closure
    name: 付嘱后学传写
    labels:
      zh: 传持流布
    start_date: 470
    highlight_event_id: guji-一行-event-beidou
  decisions:
  - date: 468
    title_zh: 以真言陀罗尼配九曜禳灾
    rationale: 摄密教咒力入星占，使遇恶星者可画形供养转祸为福
  - date: 469
    title_zh: 定行年吉凶与祭方祭物
    rationale: 明方位时月祭品，使王侯士庶皆可依行年回避灾厄
- id: guji-一行-endeavor-2
  title_zh: 弘传北斗本命延寿法
  summary_zh: 宣说人命系属北斗七星，立本命日祭拜禳解仪，劝人敬星修善
  phases:
  - key: brewing
    name: 考订北斗七星主命
    labels:
      zh: 考据溯源
    start_date: 461
    highlight_event_id: guji-一行-event-beidou
  - key: breakthrough
    name: 会通葛仙公礼斗法
    labels:
      zh: 融会旧法
    start_date: 465
    highlight_event_id: guji-一行-event-beidou
  - key: climax
    name: 宣说本命元神供养仪
    labels:
      zh: 仪轨大成
    start_date: 469
    highlight_event_id: guji-一行-event-beidou
  - key: closure
    name: 普劝敬星延年
    labels:
      zh: 普化流传
    start_date: 470
    highlight_event_id: guji-一行-event-beidou
  decisions:
  - date: 469
    title_zh: 立一年六日本命祭日
    rationale: 使人得依本命日剪纸钱茶果祭北斗，护元神延算
  - date: 470
    title_zh: 戒秽渎劝善修福
    rationale: 申明敬天因果，若不敬星像则灾难自至，攘之即吉
