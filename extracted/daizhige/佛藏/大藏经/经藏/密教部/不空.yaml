  decisions:
  - date: '0763'
    title_zh: 以慈悲摄降伏法
    rationale: 为破佛法害善之恶心而不断其善根堕恶趣，故以忿怒方便令发善心而加娑嚩贺息灾
  - date: '0772'
    title_zh: 诫不受灌顶不敬师者勿修
    rationale: 恐无智少悲多口过散乱者招狂夭寿，故立灌顶护身菩提心远离世谈之制
