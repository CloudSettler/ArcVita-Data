    start_date: 508
    highlight_event_id: guji-不空-event-death
  decisions:
  - date: 0769
    title_zh: 先授灌顶后结印诵明
    rationale: 非师教不以己智妄传，令行者入佛境界受三昧耶戒不犯威仪方堪修秘密悉地
  - date: 504
    title_zh: 开示决定成佛真言与护摩方便
    rationale: 以一诵度生死海，以护摩息灾增益降伏，令现生悉地与往生极乐双全
