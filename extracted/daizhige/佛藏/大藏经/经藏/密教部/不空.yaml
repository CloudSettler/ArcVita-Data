    rationale: 见显教理趣难摄钝根，密教三密相应速证悉地，故尽舍余学而受灌顶
  - date: 0760-01-01
    title_zh: 抉择以设利配陀罗尼普摄群机
    rationale: 悯末法众生福薄难入曼荼罗，故说一粒设利配持咒即同佛身，令愚老妇女亦得成就
