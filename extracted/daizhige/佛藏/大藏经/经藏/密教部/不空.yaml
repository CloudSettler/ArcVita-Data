    title_zh: 抉择于舍利塔前立先行法
    rationale: 依经文非塔前不成就，故定六十万遍先行与乳菜乞食之制以摄末法众生
  - date: '0762'
    title_zh: 具录根本印契与真言次第
    rationale: 为令持诵者得其轨则不增减错乱，故详录护身甲胄界缚请供奉送诸印明
- id: guji-不空-endeavor-2
  title_zh: 弘扬息灾增益降伏方便
  summary: 为国王治国邻国侵扰外道谤法贫匮斗诤等难，开示息灾增益爱敬降伏诸验法，令知佛法威德。
