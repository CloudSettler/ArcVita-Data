    description_zh: 一字顶轮王光聚高胜威猛难堪，必以佛眼三昧耶安布调柔，方能摧魔而不伤生
  lesson: 以戒为基显密圆通，以真言护国利生，威猛方便皆归大悲
  summary_first_person: 吾幼失怙，随金刚智入唐，复泛海至狮子国受灌顶，携梵本东归，历玄肃代三朝，奉诏译传一字顶轮王等密典，于大兴善寺开坛传法，愿以佛顶威光息灾护国，令众生速得悉地安乐
