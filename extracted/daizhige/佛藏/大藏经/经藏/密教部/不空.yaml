  - date: 486
    title_zh: 以十一种珍宝合法造人间如意宝珠
    rationale: 不取龙宫水德宝珠而取人间火德戒行宝珠，纳舍利三十二粒，令末世有情即身可修福智双成
  - date: 494
    title_zh: 建立坛场曼荼罗及画像曼荼罗双轨
    rationale: 以坛场摄持三部诸尊，令持诵行者观像结印诵明皆得悉地，贫苦速除
