  title_zh: 奉诏译普贤金刚萨埵略瑜伽念诵仪轨
  description: 奉诏为开府仪同三司大广智三藏，于长安译此仪轨，详说金刚掌缚拳等印、月轮五钴杵观及百八名赞，立一月四时念诵成就之法。
