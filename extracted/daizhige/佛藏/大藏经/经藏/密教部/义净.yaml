  - key: closure
    name: 弘护流通
    labels:
      zh: 流通受持
    start_date: 710
    highlight_event_id: guji-义净-event-shanye
  decisions:
  - date: 705
    title_zh: 译出佛说善夜经一卷
    rationale: 令众生长夜安隐离障，于现在如法观察不造恶业
  - date: 710
    title_zh: 劝众受持供养演说
    rationale: 明受持此经能离灾厄横夭，增长善根不堕恶趣
