endeavors:
- id: guji-义净-endeavor-1
  title_zh: 泛海南行求法习律
  summary_zh: 自长安至广州泛海，经室利佛逝至印度那烂陀，习律学经十余年，复经南海归国，撰南海寄归内法传以传戒制
  phases:
  - key: brewing
    name: 发愿西行
    labels:
      zh: 立志求法
    start_date: 439
    highlight_event_id: guji-义净-event-west
  - key: breakthrough
    name: 抵印习学
    labels:
      zh: 那烂陀受学
    start_date: 0680
    highlight_event_id: guji-义净-event-study
  - key: climax
    name: 南海集撰
    labels:
      zh: 寄归传法
    start_date: 0689
    highlight_event_id: guji-义净-event-return
  - key: closure
    name: 持典东归
    labels:
      zh: 携经归唐
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: 441
    title_zh: 自广州泛海西行
    rationale: 慕玄奘西行之风，欲亲证印度律制原本，故舍安就险由海道往天竺
  - date: 0689
    title_zh: 留室利佛逝著述寄归
    rationale: 见南海道俗失律，欲以亲见传归中土，使后学知印度正制
- id: guji-义净-endeavor-2
  title_zh: 奉制译经宣说疗痔病咒
  summary_zh: 归洛阳长安后奉制主持译场，译出根本说一切有部律及密部诸经，于王舍城竹林因缘下宣说疗痔病经，以咒法疗风热等诸痔令众干燥除差
  phases:
  - key: brewing
    name: 入译场受诏
    labels:
      zh: 奉制翻译
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 译律传戒
    labels:
      zh: 根本说部
    start_date: 448
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 说疗痔病经
    labels:
      zh: 咒法疗疾
    start_date: 453
    highlight_event_id: guji-义净-event-translate
  - key: closure
    name: 流通受持
    labels:
      zh: 劝诵受持
    start_date: 456
    highlight_event_id: guji-义净-event-translate
  decisions:
  - date: 0695
    title_zh: 应诏入京主持译事
    rationale: 以所携梵本甚多，欲报国恩弘律，故就洛阳长安译场专心传译
  - date: 453
    title_zh: 译出疗痔病经广宣神咒
    rationale: 念王舍城多苾刍患痔羸瘦忧恼，承阿难请问因缘，说咒令风痔热痔等悉皆干燥堕落，兼得宿住智忆过去七生
