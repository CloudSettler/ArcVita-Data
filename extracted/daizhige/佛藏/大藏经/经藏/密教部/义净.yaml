events:
- id: guji-义净-event-birth
  title_zh: 齐州降生出家
  date: 0635-01-01
  year_of: 635
  summary: 贞观九年生于齐州张氏，七岁出家，博览律论，发西行大愿
- id: guji-义净-event-xixing
  title_zh: 泛海西行求法
  date: 0671-01-01
  year_of: 671
  summary: 咸亨二年自广州泛海，经室利佛逝留数年学梵语，后赴印度
- id: guji-义净-event-qiufa
  title_zh: 那烂陀学律取经
  date: 0675-01-01
  year_of: 675
  summary: 抵中印度那烂陀寺，师从宝思惟等学律十年，抄梵本四百余部
- id: guji-义净-event-huiguo
  title_zh: 归国奉制入译场
  date: 0695-01-01
  year_of: 695
  summary: 证圣元年归抵洛阳，武后亲迎，敕住佛授记寺主持译经
- id: guji-义净-event-foding
  title_zh: 译佛说佛顶尊胜陀罗尼经
  date: 0710-01-01
  year_of: 710
  summary: 于长安大荐福寺重勘梵本译出此经，详定咒语音字，广宣流布
- id: guji-义净-event-death
  title_zh: 长安圆寂
  date: 0713-01-01
  year_of: 713
  summary: 先天二年卒于长安，谥鸿胪卿，著南海寄归内法传大唐西域求法高僧传等行于世
