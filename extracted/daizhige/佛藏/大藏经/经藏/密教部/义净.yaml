endeavors:
- id: guji-义净-endeavor-1
  title_zh: 浮海西行南海求法
  summary: 咸亨二年自广州浮海，经室利佛逝至印度那烂陀，研习律学及梵典二十余年而归。
  phases:
  - key: brewing
    name: 发愿西行
    labels:
      zh:
      - 发心求法
      - 长安受具
    start_date: '0667'
    highlight_event_id: guji-义净-event-xihang
  - key: breakthrough
    name: 浮海抵印
    labels:
      zh:
      - 海路艰险
      - 南海淹留
    start_date: '0671'
    highlight_event_id: guji-义净-event-xihang
  - key: climax
    name: 那烂陀研学
    labels:
      zh:
      - 学律习梵
      - 抄集经论
    start_date: 0680
    highlight_event_id: guji-义净-event-xihang
  - key: closure
    name: 携经归国
    labels:
      zh:
      - 负笈东归
      - 武后亲迎
    start_date: 0695
    highlight_event_id: guji-义净-event-huigui
  decisions:
  - date: '0671'
    title_zh: 舍陆取海浮舶南行
    rationale: 慕法显玄奘之志，避西域阻隔，乘商舶经南海求法以速达印度。
  - date: 0695
    title_zh: 携梵本经像东归译传
    rationale: 所学已成，念中土未闻南海律制与密典，故冒风涛归国弘传。
- id: guji-义净-endeavor-2
  title_zh: 奉诏译说如意轮陀罗尼
  summary: 归国后居洛阳长安大福先寺等，奉武后中宗之制译经，主译律部及密部，译出观自在如意心陀罗尼咒经。
  phases:
  - key: brewing
    name: 奉制入译场
    labels:
      zh:
      - 奉诏翻译
      - 整比梵汉
    start_date: 0695
    highlight_event_id: guji-义净-event-huigui
  - key: breakthrough
    name: 宣说青莲华顶法
    labels:
      zh:
      - 观自在悲愿
      - 佛前许说
    start_date: '0704'
    highlight_event_id: guji-义净-event-yijing
  - key: climax
    name: 授持明现报法式
    labels:
      zh:
      - 持诵仪轨
      - 满愿除障
    start_date: '0704'
    highlight_event_id: guji-义净-event-yijing
  - key: closure
    name: 付嘱流通
    labels:
      zh:
      - 策励示诲
      - 信受奉行
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: '0704'
    title_zh: 简易持诵不择日月斋戒
    rationale: 悯末世众生障重缘杂，承观自在慈力，开方便门令一心口诵即得成就。
  - date: '0704'
    title_zh: 详陈除罪除病满愿功德
    rationale: 以如意宝轮王咒王之现验，劝苾刍俗众深信受持，销重业治众病满百千愿。
events:
- id: guji-义净-event-birth
  date: '0635'
  year_of: 635
  title_zh: 生于齐州张氏
  description: 唐贞观九年生于齐州，俗姓张，幼出家慕西行求法。
- id: guji-义净-event-xihang
  date: '0671'
  year_of: 671
  title_zh: 自广州浮海赴南海印度
  description: 咸亨二年自广州乘舶南行，经室利佛逝淹留学梵，后达印度那烂陀研习三藏。
- id: guji-义净-event-huigui
  date: 0695
  year_of: 695
  title_zh: 携梵本归洛奉诏译经
  description: 证圣元年归抵洛阳，武后亲迎于上东门外，敕住大福先寺主持译场。
- id: guji-义净-event-yijing
  date: '0704'
  year_of: 704
  title_zh: 译佛说观自在如意心陀罗尼咒经
  description: 奉制译出此经，述观自在佛前说青莲华顶无障碍莲华如意宝轮王陀罗尼及持诵法式功德。
- id: guji-义净-event-death
  date: '0713'
  year_of: 713
  title_zh: 圆寂于长安
  description: 唐先天二年正月圆寂于长安，谥号鸿胪卿，归葬洛阳龙门。
