  dilemmas:
  - title_zh: 远涉南海求戒律全身与安住本土弘化的两难
    description_zh: 欲亲证佛国律制须冒海路艰险离乡二十余年，欲安众济俗又须归国译经，未能两全
  - title_zh: 显教戒行与密咒济疾的方便抉择
    description_zh: 既持律范又以神咒疗痔病等身苦，于戒律清净与咒法救急之间立方便道
  lesson: 以亲行求法为本，以翻译宣说为用，令远方圣教近济众生身心苦患
  summary_first_person: 吾义净，齐州人，少慕西行，泛海至那烂陀求法习律，历南海诸国二十余年而归，奉制译经，宣说疗痔病经等咒法，愿众生离疾苦得安乐
  source_urls:
