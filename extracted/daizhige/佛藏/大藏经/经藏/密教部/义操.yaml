endeavors:
- id: guji-义操-endeavor-1
  title_zh: 集录胎藏金刚教法名号
  summary_zh: 依青龙寺本汇集胎藏界诸尊与金刚界贤劫十六尊等金刚名号成一卷以便持诵
  phases:
  - key: brewing
    name: 搜集青龙寺本与两部曼荼罗仪轨
    labels:
      zh: 酝酿搜集
    start_date: 约0795
    highlight_event_id: guji-义操-event-1
  - key: breakthrough
    name: 编定胎藏诸尊金刚名号
    labels:
      zh: 编定突破
    start_date: 约0805
    highlight_event_id: guji-义操-event-1
  - key: climax
    name: 增料金刚界名号及贤劫十六位
    labels:
      zh: 增广成书
    start_date: 约0810
    highlight_event_id: guji-义操-event-2
  decisions:
  - date: 约0805
    title_zh: 以金刚名号系于每尊之下
    rationale: 令行者由显号即入金刚密义观名契德不失胎藏慈悲与金刚智断
  - date: 约0810
    title_zh: 勘定青龙寺本以为定本
    rationale: 寺传为惠果一系正嫡以寺本为据可免异传讹杂保教法清净
- id: guji-义操-endeavor-2
  title_zh: 住持东塔院弘持密教
  summary_zh: 住青龙寺东塔院守持胎藏金刚两部仪轨教授后学维系唐密法统
  phases:
  - key: brewing
    name: 依止青龙寺受学两部大法
    labels:
      zh: 受学熏修
    start_date: 约0790
    highlight_event_id: guji-义操-event-birth
  - key: climax
    name: 住东塔院教授流通名号法本
    labels:
      zh: 住持流通
    start_date: 约0815
    highlight_event_id: guji-义操-event-2
  - key: closure
    name: 付嘱后学并留本于寺藏
    labels:
      zh: 付嘱收束
    start_date: 约0830
    highlight_event_id: guji-义操-event-death
  decisions:
  - date: 约0815
    title_zh: 以名号小品普示初机而不轻示深密仪轨
    rationale: 名号可广传而灌顶仪轨须择器传授如此契合密教显密兼顾之制
  - date: 约0830
    title_zh: 留本于青龙寺以待勘校
    rationale: 恐传写脱误故标明已上勘青龙寺本以昭来源便后人覆校
events:
- id: guji-义操-event-birth
  type: birth
  date: 约0790
  year_of: 790
  title_zh: 生于唐代
  description: 生年未详约当唐代中期出身未载后为青龙寺东塔院沙门
- id: guji-义操-event-1
  type: career
  date: 约0805
  year_of: 805
  title_zh: 集胎藏界诸尊金刚名号
  description: 自大毗卢遮那遍照金刚至东西南北诸门圣众一一系以金刚密号初成胎藏部分
- id: guji-义操-event-2
  type: career
  date: 约0810
  year_of: 810
  title_zh: 续料金刚界及贤劫十六位名号成书
  description: 续料金刚界五佛四波罗蜜十六贤劫菩萨及不动降三世等明王名号勘定青龙寺本成胎藏金刚教法名号一卷
- id: guji-义操-event-death
  type: death
  date: 约0835
  year_of: 835
  title_zh: 示寂于唐代
  description: 卒年未详约当唐文宗前后所集名号经后世传写流传于日本报恩院观心院等
