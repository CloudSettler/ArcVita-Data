  dilemmas:
  - title_zh: 小儿头痛腹痛苦恼无救
    description_zh: 世间小儿多罹头痛腹痛之苦，父母忧恼无措，我当以何方便令其即得安愈
  - title_zh: 咒愿效力与归敬信心之衡
    description_zh: 既欲令所咒如愿，又须众生归敬三宝七佛，云何兼顾方便与正信而不流于邪术
  lesson: 归敬三宝七佛而持真言，慈心护念小儿，七遍诚诵即得安愈，方便不离正信
  summary_first_person: 我是佛，见小儿头痛腹痛而生慈悯，宣说神咒并归敬过去七佛与三宝，令持诵者七过即愈，所愿从心
