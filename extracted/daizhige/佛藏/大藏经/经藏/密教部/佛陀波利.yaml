    title_zh: 五体投地求见文殊
    rationale: 生逢八难不睹圣容故远涉流沙敬谒唯愿普覆令见尊仪
  - date: '0677'
    title_zh: 空手而还取经利生
    rationale: 既不将经来空来无益纵见文殊亦不得识不如取经流传汉土遍奉众圣广利群生
