endeavors:
- id: guji-善无畏-endeavor-1
  title_zh: 入唐住内道场弘传密法
  summary_zh: 自中天竺西来开元初抵长安奉诏住内道场与一行等译大日经等开唐密之宗
  phases:
  - key: brewing
    name: 中天竺出家兼学显密
    labels:
      zh: 出家学法
    start_date: 415
    highlight_event_id: guji-善无畏-event-birth
  - key: breakthrough
    name: 开元四年抵达长安奉诏
    labels:
      zh: 入唐奉诏
    start_date: 462
    highlight_event_id: guji-善无畏-event-arrive
  - key: climax
    name: 内道场译大毘卢遮那成佛经
    labels:
      zh: 译经弘化
    start_date: 469
    highlight_event_id: guji-善无畏-event-translate-vairocana
  - key: closure
    name: 开元末圆寂长安谥号开元三大士
    labels:
      zh: 圆寂付嘱
    start_date: 477
    highlight_event_id: guji-善无畏-event-death
  decisions:
  - date: 462
    title_zh: 应诏留住长安不归天竺
    rationale: 为令密法东传救唐土众生故留内道场译经授法
  - date: 469
    title_zh: 与一行共译大日经立胎藏曼荼罗
    rationale: 以毘卢遮那为本尊摄一切陀罗尼开后世受持之轨
- id: guji-善无畏-endeavor-2
  title_zh: 秘译阿吒薄俱元帅仪轨
  summary_zh: 于内道场秘译阿吒薄俱元帅大将上佛陀罗尼经修行仪轨立结界护身护国之法
  phases:
  - key: brewing
    name: 俱尸那付嘱会上起护法之愿
    labels:
      zh: 付嘱护法
    start_date: 462
    highlight_event_id: guji-善无畏-event-arrive
  - key: breakthrough
    name: 秘译甘露无边陀罗尼及心咒
    labels:
      zh: 秘译神咒
    start_date: 468
    highlight_event_id: guji-善无畏-event-translate-atawaka
  - key: climax
    name: 立坛结界四十九座竖刀结四方界
    labels:
      zh: 立坛结界
    start_date: 468
    highlight_event_id: guji-善无畏-event-translate-atawaka
  - key: closure
    name: 付智慧之人受持流布镇国安民
    labels:
      zh: 付嘱流通
    start_date: 477
    highlight_event_id: guji-善无畏-event-death
  decisions:
  - date: 468
    title_zh: 于内道场秘译不行于无智之人
    rationale: 此咒猛极威猛自在恐后世伤害众生故唯付智慧之人能斋戒受持者
  - date: 468
    title_zh: 说结界护身护国镇城门法
    rationale: 为令国土风雨顺时邻敌不起逆心众生离魔缚疫病故立坛散净水净灰芥子为界
