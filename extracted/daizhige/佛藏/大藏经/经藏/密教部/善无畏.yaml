  decisions:
  - date: '0716'
    title_zh: 应诏入唐开密教译场
    rationale: 见唐土未弘胎藏密部欲以大日准提普利群生故冒海陆艰险东行赴请
  - date: '0717'
    title_zh: 以略轨立简易坛法
    rationale: 见诸部广修供养难办故以新镜为坛香泥不繁但烧香清水静心结印诵咒百八遍即得成就以便在家出家皆可持行
- id: guji-善无畏-endeavor-2
  title_zh: 普传准提念诵摄化群机
  summary: 主张不简净秽不断辛肉妻子亦可成验依十斋日平明面东诵咒依四十九日祈愿观梦验成兼说息灾延命和合伏藏召请鬼神等自在神用
  phases:
