    rationale: 为顿开众生心地，须先会通显密，不偏执一法，方能普摄根机
  - date: '0717'
    title_zh: 先授三聚净戒再授密法
    rationale: 欲入大乘密禅者，先须身器清净，故立发心供养忏悔归依等十一门为基
