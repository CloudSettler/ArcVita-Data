  decisions:
  - date: '0724'
    title_zh: 以有相摄无相立二轨
    rationale: 为兼利求世间除灾与求无上菩提者，故分有相四种法与无生顿入法
  - date: 0728
    title_zh: 补阙重译尊胜具本
    rationale: 汉地佛陀波利以来诸本并阙少，为除障灭恶趣故具本译出流行
