    title_zh: 量机密授不辄对众
    rationale: 此法深奥信者甚希，恐杂学惑心，故先说方便令生坚信然后开晓
  - date: 0718
    title_zh: 以圆月为喻观自心
    rationale: 自性清净具清净清凉光明三义，取世人共见之月令其悟入，最易相应
