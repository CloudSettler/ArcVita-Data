    start_date: '0717'
    highlight_event_id: guji-善无畏-event-arrive
  - key: breakthrough
    name: 十日念诵普摄突破
    labels:
      zh: 普摄持诵
    start_date: '0720'
    highlight_event_id: guji-善无畏-event-teach
  - key: climax
    name: 成验自在神用显彰
    labels:
      zh: 验相显彰
    start_date: '0725'
    highlight_event_id: guji-善无畏-event-teach
  - key: closure
    name: 遗轨付后示寂洛阳
    labels:
      zh: 示寂付法
    start_date: '0735'
    highlight_event_id: guji-善无畏-event-death
  decisions:
  - date: '0720'
    title_zh: 许在家饮酒食肉持诵
    rationale: 悯末俗障重难持具戒若执净秽则多人退失故开方便但依镜印咒三事纵有妻子辛肉亦许成验以先摄后化
  - date: '0725'
    title_zh: 以梦相华果定成不成
    rationale: 学者疑法成否心无所据故立梦见佛菩萨华果吐黑食白为验令信心坚固勤行不退
events:
