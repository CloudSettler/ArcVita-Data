  dilemmas:
  - 显密会通之难，既欲顿开众生心地，又不可偏执一法互相是非
  - 密法深奥难信，不可对众辄闻，须量机密授令生坚信决除疑网
  lesson: 不偏执一门，以自性清净圆明心贯通万法，依三聚净戒渐进升进乃至成佛
  summary_first_person: 吾乃中天竺摩伽陀那烂陀竹林寺输波迦罗，唐言善无畏，与嵩岳会善寺敬贤对论佛法，略叙大乘旨要授菩萨戒十一门，复开圆月三摩地禅要，欲令众生即自性清净心速悟无上菩提
  source_urls:
