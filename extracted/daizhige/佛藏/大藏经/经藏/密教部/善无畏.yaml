  archetype: 密教译经大师
  dilemmas:
  - 密法至秘而欲普摄群机不简在家出家净秽当如何立方便而不失轨范
  - 梵本义广而唐土根器不一当如何以简要坛镜念诵令人速得成验
  lesson: 以简坛明镜摄繁轨以宽容普摄摄浊世令白法功德人人可修
  summary_first_person: 吾为善无畏自西域入唐蒙玄宗敬礼住长安译大日经等密典复译七俱胝独部法立五法门以一镜为坛不简在家出家饮酒食肉有妻子但依准提真言念诵即得灭罪延命成验自在唯愿后人静心持镜依法行持无不成就
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/密教部/七俱胝獨部法.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/密教部/七俱胝獨部法.md
