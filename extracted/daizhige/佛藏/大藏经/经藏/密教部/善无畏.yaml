  lesson: 舍王位而证无生，以有相摄无相，令末世得尊胜悉地
  summary_first_person: 吾善无畏，中天竺摩揭陀王裔，十三承位而让国出家，遍历那烂陀习瑜伽密藏，开元入唐，与一行译大日经，复译尊胜佛顶修瑜伽法轨仪，敷胎藏五智三密之法，愿众生一念证无生，转五蕴为五智身
