endeavors:
- id: guji-善无畏-endeavor-1
  title_zh: 航海東來開唐密先聲
  summary_zh: 自天竺受具習瑜伽密法聞大唐崇佛遂泛海東來蒙玄宗禮遇住大興善青龍等寺開壇灌頂奠定開元密教之基
  phases:
  - key: brewing
    name: 天竺出家習密
    labels:
      zh: 修學積累
    start_date: 415
    highlight_event_id: guji-善无畏-event-birth
  - key: breakthrough
    name: 開元四年抵長安
    labels:
      zh: 遠涉弘化
    start_date: 462
    highlight_event_id: guji-善无畏-event-arrival
  - key: climax
    name: 譯大日經開壇授法
    labels:
      zh: 譯經授徒
    start_date: 469
    highlight_event_id: guji-善无畏-event-dari
  - key: closure
    name: 化行二十年示寂
    labels:
      zh: 功成示寂
    start_date: 477
    highlight_event_id: guji-善无畏-event-death
  decisions:
  - date: 462
    title_zh: 決意泛海赴唐
    rationale: 聞大唐為有緣大國欲以密教普利東土故不憚海險東行
  - date: 469
    title_zh: 與一行共譯大日經
    rationale: 以法統相續需漢文聖典為憑故借朝廷之力速成根本經軌
- id: guji-善无畏-endeavor-2
  title_zh: 奉詔譯慈氏瑜伽念誦法
  summary_zh: 奉詔略修慈氏菩薩瑜伽念誦法立五輪觀法界眼及曼荼羅供養持誦次第使行者現世不捨色身速會兜率悉地
  phases:
  - key: brewing
    name: 觀淨法界安五輪
    labels:
      zh: 觀行奠基
    start_date: 462
    highlight_event_id: guji-善无畏-event-arrival
  - key: breakthrough
    name: 制曼荼羅請本尊儀
    labels:
      zh: 制儀立軌
    start_date: 469
    highlight_event_id: guji-善无畏-event-dari
  - key: climax
    name: 譯成慈氏念誦上下卷
    labels:
      zh: 譯軌流通
    start_date: 471
    highlight_event_id: guji-善无畏-event-cishi
  - key: closure
    name: 囑累後學三時無間
    labels:
      zh: 付囑流通
    start_date: 477
    highlight_event_id: guji-善无畏-event-death
  decisions:
  - date: 471
    title_zh: 以有相兼說無生
    rationale: 為利樂求有相者故先立圖像真言印契漸入無生實相智
  - date: 471
    title_zh: 詳定供養懺悔發願次第
    rationale: 恐行者著相起障故以歸依懺悔隨喜勸請發心攝持三業令成三密
