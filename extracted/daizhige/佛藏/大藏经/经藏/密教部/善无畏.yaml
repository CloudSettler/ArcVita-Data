    rationale: 见国位无常，为求无上菩提并利含识，故让国习道
  - date: '0713'
    title_zh: 携经赴唐
    rationale: 悯汉地尊胜诸本阙少，为传具足瑜伽轨仪故西来
- id: guji-善无畏-endeavor-2
  title_zh: 入唐译传尊胜瑜伽轨
  summary: 开元入长安洛阳，奉诏译大毗卢遮那经等，复译尊胜佛顶修瑜伽法轨仪，立五轮护摩四种悉地法，授一行慧琳等
  phases:
