endeavors:
- id: guji-圆仁-endeavor-1
  title_zh: 入唐巡礼访求密法
  summary: 开成五年至长安，留六年，访青龙寺东塔院及玄法寺，受胎藏苏悉地大法。
  phases:
  - key: brewing
    name: 发愿渡海入唐
    labels:
      zh:
      - 发愿
      - 渡海
    start_date: '0838-07-01'
    highlight_event_id: guji-圆仁-event-rutang
  - key: breakthrough
    name: 到达长安访寺
    labels:
      zh:
      - 长安
      - 访寺
    start_date: '0840-01-01'
    highlight_event_id: guji-圆仁-event-rutang
  - key: climax
    name: 青龙东塔院受法
    labels:
      zh:
      - 青龙寺
      - 灌顶
    start_date: '0841-01-01'
    highlight_event_id: guji-圆仁-event-shoufa
  decisions:
  - date: '0840-01-01'
    title_zh: 留住长安访青龙寺
    rationale: 为访东塔院曼荼罗书写经疏，设供受灌顶，故久留长安。
  - date: '0841-01-01'
    title_zh: 就义真受胎藏苏悉地法
    rationale: 为得胎藏正传，须依止青龙东塔院义真阿阇梨受法。
- id: guji-圆仁-endeavor-2
  title_zh: 请来阿蜜哩多军荼利法归国
  summary: 就玄法寺法全重受胎法，并得阿蜜哩多军荼利法，赍归本邦，成台密一系。
  phases:
  - key: brewing
    name: 就法全重受胎法
    labels:
      zh:
      - 玄法寺
      - 胎藏
    start_date: '0842-01-01'
    highlight_event_id: guji-圆仁-event-shoufa
  - key: breakthrough
    name: 得阿蜜哩多军荼利法
    labels:
      zh:
      - 军荼利
      - 请来
    start_date: '0845-01-01'
    highlight_event_id: guji-圆仁-event-guiguo
  - key: closure
    name: 赍归传持
    labels:
      zh:
      - 归国
      - 传持
    start_date: '0847-01-01'
    highlight_event_id: guji-圆仁-event-guiguo
  decisions:
  - date: '0842-01-01'
    title_zh: 往玄法寺就法全受法
    rationale: 与义真同门之法全能付胎藏及别尊仪轨，故往重受以广传持。
  - date: '0847-01-01'
    title_zh: 赍军荼利法归国
    rationale: 彼土此本独存东塔院，他家不传，若不赍归则法脉永泯，故冒艰携归。
events:
- id: guji-圆仁-event-birth
  date: '0794-01-01'
  year_of: 794
  title_zh: 诞生于日本下野国
  description: 延历十三年生，后出家入比睿山从最澄学天台。
- id: guji-圆仁-event-rutang
  date: '0840-01-01'
  year_of: 840
  title_zh: 开成五年至长安
  description: 以开成五年至长安，访青龙寺东塔院见诸曼荼罗，令博士王惠摸两部画帧书写经疏。
- id: guji-圆仁-event-shoufa
  date: '0841-06-01'
  year_of: 841
  title_zh: 受胎藏及苏悉地大法
  description: 于青龙东塔院受胎藏及苏悉地大法于义真，又至玄法寺重受胎法于法全，兼学悉昙于南天竺三藏宝月。
- id: guji-圆仁-event-guiguo
  date: '0847-09-01'
  year_of: 847
  title_zh: 赍阿蜜哩多军荼利法归国
  description: 独得东塔院所藏阿蜜哩多军荼利法赍归本邦，后入石山寺，成台密所传。
- id: guji-圆仁-event-death
  date: '0864-02-14'
  year_of: 864
  title_zh: 入灭于比睿山
  description: 贞观六年正月入灭，谥慈觉大师，著入唐求法巡礼行记传世。
