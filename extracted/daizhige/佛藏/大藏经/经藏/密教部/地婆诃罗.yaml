  date: 0676-01-01
  year_of: 676
  event_type: career
  description: 唐高宗仪凤初自天竺来到长安，入译场预备翻译梵本经典。
- id: guji-地婆诃罗-event-translate
  title_zh: 西魏国寺译准提经
  date: 0686-01-01
  year_of: 686
  event_type: career
  description: 垂拱二年于西魏国寺译出佛说七俱胝佛母心大准提陀罗尼经一卷，传南谟飒哆南等七句心咒。
- id: guji-地婆诃罗-event-preach
  title_zh: 宣说持诵坛法功德
  date: 0686-06-01
  year_of: 686
  event_type: career
  description: 宣说受持满八十万遍灭五无间罪，于佛像塔前作方坛诵咒千八遍，及治鬼病渡江海息灾疫等诸法。
- id: guji-地婆诃罗-event-death
