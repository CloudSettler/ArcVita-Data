  era: 唐
  reign_ref: 唐高宗仪凤至武后垂拱
  archetype: 译经三藏
  dilemmas:
  - 梵本义广文深而华言难达当如何既存密语真意又使众生得解
  - 密咒贵在持验而朝野重在义解当如何兼顾信解与实修
  - 远来异域为僧当如何取信于帝室与缁素以成译弘大业
  lesson: 以愍念未来众生之心精勤翻译流通使准提大法普利群生速证菩提
  summary_first_person: 吾是中天竺僧地婆诃罗，仪凤初来入长安，愍念未来众生，于西魏国寺译出七俱胝佛母心大准提陀罗尼，传七俱胝佛母心咒与坛法持验之道，愿持诵者灭罪生善，得见诸佛菩萨，速证无上菩提。
