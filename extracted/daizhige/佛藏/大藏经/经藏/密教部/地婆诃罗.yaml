    title_zh: 抉择译出大明咒藏中准提一卷
    rationale: 为令薄福无根器众生亦得速证菩提故择此普摄群机之法
  - date: 0686-01-01
    title_zh: 定名七俱胝佛母心大准提陀罗尼经
    rationale: 明此为过去未来现在诸佛同说之七俱胝佛母心法故正其名
- id: guji-地婆诃罗-endeavor-2
  title_zh: 弘传持诵坛法与验相
  summary: 弘传受持读诵满八十万遍灭五无间罪之功德，及方坛结界镜坛见像除鬼病等种种修持仪轨。
