    title_zh: 详传方坛香水瓶镜坛仪轨
    rationale: 为使行者得见佛菩萨像随请问法无不决了故须示具体行法
  - date: 0686-04-01
    title_zh: 开示重罪加行至七十万遍
    rationale: 为令五逆重罪众生亦得梦吐黑白而罪灭清净故立渐次加行
events:
