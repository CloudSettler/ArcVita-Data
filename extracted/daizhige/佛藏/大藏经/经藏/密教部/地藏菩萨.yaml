person:
  qid: guji-地藏菩萨
  name_zh: 地藏菩萨
  names:
    zh: 地藏菩萨摩诃萨
    en: Ksitigarbha Bodhisattva
  lifespan:
    birth:
      date: -1000-01-01
      precision: millennium
      is_circa: true
      raw: 过去无量恒河沙佛所发大悲坚固誓愿
    death:
      date: 9999-12-31
      precision: millennium
      is_circa: true
      raw: 不舍众生未般涅槃常住救度
  birth_date: -1000-01-01
  death_date: 9999-12-31
  era: 上古传说
  reign_ref: 佛在佉罗提耶山牟尼仙所住时
  archetype: 大愿救度者
  dilemmas:
  - 住胜菩提与不舍一众生之间如何抉择
  - 现神通摄化与令众生自修十善之间如何平衡
  lesson: 地狱未空誓不成佛众生度尽方证菩提以坚固大悲成就一切众生
  summary_first_person: 我是地藏菩萨摩诃萨，于过去无量劫佛前发坚固大悲誓如大地，愿于五浊恶世成就众生，南方来会佉罗提耶山，现沙门像说陀罗尼，令称名归依者离病苦饥乏系缚怖畏，增长寿命色力信戒多闻施忍禅慧，远离十恶成就十善，安住涅槃得第一乐。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%9C%B0%E8%97%8F%E8%8F%A9%E8%90%A8%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%9C%B0%E8%97%8F%E8%8F%A9%E8%90%A8%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.html
