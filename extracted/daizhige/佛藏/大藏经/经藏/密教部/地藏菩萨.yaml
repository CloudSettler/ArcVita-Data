  title_zh: 五浊恶世成就众生行
  summary: 与八十频婆那由他菩萨俱来佉罗提耶山，现种种身说法，令众生离十恶苦恼，安置涅槃
  phases:
  - key: brewing
    name: 久劫发愿积集功德
    labels:
      zh: 发愿
    start_date: -1000-01-01
    highlight_event_id: guji-地藏菩萨-event-birth
  - key: breakthrough
    name: 南方来会现瑞动地
    labels:
      zh: 来会
    start_date: 0100-01-01
    highlight_event_id: guji-地藏菩萨-event-south-assembly
  - key: climax
    name: 现种种身度脱无量众
    labels:
      zh: 化度
    start_date: 0100-06-01
    highlight_event_id: guji-地藏菩萨-event-manifest-salvation
  - key: closure
    name: 令众安住不退转地
    labels:
      zh: 安置
    start_date: 0100-12-01
    highlight_event_id: guji-地藏菩萨-event-manifest-salvation
  decisions:
  - date: -1000-01-01
    title_zh: 佛前发坚固大悲誓
    rationale: 犹如大地令一切众生皆悉受用，以精进力一食顷度无量世界众生
  - date: 0100-01-01
    title_zh: 舍净佛国入浊恶世
    rationale: 本愿欲度浊恶世成就一切众生，故与大菩萨众现声闻像礼佛听法
- id: guji-地藏菩萨-endeavor-2
  title_zh: 说陀罗尼护念增长行
  summary: 为增长四众寿命色力信戒多闻及一切善业，说咒护持，除苦恼系缚，满众生所愿
  phases:
  - key: brewing
    name: 过去佛所受持神咒
    labels:
      zh: 受持
    start_date: -1000-06-01
    highlight_event_id: guji-地藏菩萨-event-birth
  - key: breakthrough
    name: 佛前启请济度四天下
    labels:
      zh: 启请
    start_date: 0100-02-01
    highlight_event_id: guji-地藏菩萨-event-dharani-vow
  - key: climax
    name: 说陀罗尼利益除苦
    labels:
      zh: 说咒
    start_date: 0100-03-01
    highlight_event_id: guji-地藏菩萨-event-dharani-vow
  - key: closure
    name: 众会供养受持流通
    labels:
      zh: 流通
    start_date: 0100-04-01
    highlight_event_id: guji-地藏菩萨-event-dharani-vow
  decisions:
  - date: 0100-02-01
    title_zh: 愿护比丘比丘尼优婆塞优婆夷
    rationale: 为增长寿命无病色力名称资业眷属信戒施忍方便圣谛大乘照明，令法雨润泽三有
  - date: 0100-03-01
    title_zh: 说增长白净具足咒
    rationale: 此咒能除一切苦恼系缚，增长种子根茎华果药谷云雨地水火风福乐财物果报
events:
- id: guji-地藏菩萨-event-birth
  type: birth
  date: -1000-01-01
  year_of: -1000
  title_zh: 过去佛所发大悲誓愿生
  description: 于过去无量恒河沙诸佛所发大悲坚固誓愿，皆悉成就一切众生，庄严势力犹如电震
- id: guji-地藏菩萨-event-south-assembly
  type: career
  date: 0100-01-01
  year_of: 100
  title_zh: 南方来会佉罗提耶山
  description: 与八十频婆那由他百千亿大菩萨俱作沙门像来至佛所，先现香华衣璎珞雨如意宝光，大众身重如地不动
- id: guji-地藏菩萨-event-manifest-salvation
  type: career
  date: 0100-06-01
  year_of: 100
  title_zh: 现种种身成就众生
  description: 或作梵天帝释转轮圣王菩萨声闻男女龙鬼地狱卒等身，随众显示三乘，称名者饮食充足病愈解脱系缚离诸怖畏
- id: guji-地藏菩萨-event-dharani-vow
  type: career
  date: 0100-03-01
  year_of: 100
  title_zh: 佛前说陀罗尼护念增长
  description: 为济度四天下增长寿命色力信戒多闻六度五眼涅槃威德，说阎浮等三十九句咒，能除苦恼系缚增长一切善业
- id: guji-地藏菩萨-event-death
  type: death
  date: 9999-12-31
  year_of: 9999
  title_zh: 住持不般涅槃常度众生
  description: 誓愿众生度尽方证菩提，不舍一众生不住胜菩提，常在五浊恶世作涅槃导师无上商主，未言入灭
