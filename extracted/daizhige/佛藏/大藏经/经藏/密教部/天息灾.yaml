  name_zh: 天息灾
  names:
    zh: 天息灾
    en: Devasanti
  lifespan:
    birth:
      date: 0950
      precision: year
      is_circa: true
      raw: 约十世纪中叶北印度生
    death:
      date: '1000'
      precision: year
      is_circa: false
      raw: 宋咸平三年卒
  birth_date: 0950
  death_date: '1000'
  era: 北宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 译经三藏
  dilemmas:
  - title_zh: 梵汉悬隔而密义难传
    description_zh: 曼荼罗真言印契皆重音声形相，若直译则失其秘密庄严，若意译则恐乖本軌，当如何取舍以利后学。
  - title_zh: 奉诏译场与专修自行之衡
    description_zh: 既受朝命居译经院，日有译事课役，又欲自修三密相应行，当如何不负国恩亦不废道业。
  lesson: 以精严仪轨化他，以不退三密自行，令密法有据可依，使后世行人得入曼荼罗次第。
  summary_first_person: 吾本北印度人，习秘密教法，宋太平兴国中随法天东来，蒙太宗诏入译经院，赐明教大师，奉诏译密部诸经，详述择地作坛灌顶护摩之仪，愿以此最上微妙曼拏罗，利乐一切有情，破轮回怖，得金刚智。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E4%B8%80%E5%88%87%E5%A6%82%E6%9D%A5%E5%A4%A7%E7%A7%98%E5%AF%86%E7%8E%8B%E6%9C%AA%E6%9B%BE%E6%9C%89%E6%9C%80%E4%B8%8A%E5%BE%AE%E5%A6%99%E5%A4%A7%E6%9B%BC%E6%8B%8F%E7%BD%97%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E4%B8%80%E5%88%87%E5%A6%82%E6%9D%A5%E5%A4%A7%E7%A7%98%E5%AF%86%E7%8E%8B%E6%9C%AA%E6%9B%BE%E6%9C%89%E6%9C%80%E4%B8%8A%E5%BE%AE%E5%A6%99%E5%A4%A7%E6%9B%BC%E6%8B%8F%E7%BD%97%E7%BB%8F.md
endeavors:
- id: guji-天息灾-endeavor-1
  title_zh: 奉诏入宋译经院译传密部
  summary_zh: 太平兴国五年随法天来华，居译经院，与施护法贤等共译密教经轨十余部，成宋初译场三藏之一。
  phases:
  - key: brewing
    name: 北印度习学秘密法
    labels:
      zh: 酝酿
    start_date: 0950
    highlight_event_id: guji-天息灾-event-birth
  - key: breakthrough
    name: 随法天东来入宋
    labels:
      zh: 突破
    start_date: 0980
    highlight_event_id: guji-天息灾-event-arrival
  - key: climax
    name: 奉诏译密经授明教大师
    labels:
      zh: 高潮
    start_date: 0983
    highlight_event_id: guji-天息灾-event-translate
  - key: closure
    name: 译业圆满付梓流布
    labels:
      zh: 收束
    start_date: 0999
    highlight_event_id: guji-天息灾-event-translate
  decisions:
  - date: 0980
    title_zh: 决意随僧东行入华
    rationale: 见中土求法殷切，欲以密法利东方，遂离本土，历西域入汴京求附译场。
  - date: 0983
    title_zh: 受诏专攻密教部译事
    rationale: 朝廷置译经院重显密兼弘，而密部阙略，遂请以梵本进呈，专译陀罗尼曼荼罗诸经，以补其阙。
- id: guji-天息灾-endeavor-2
  title_zh: 详述曼荼罗仪轨传持密行
  summary_zh: 译出一切如来大秘密王曼拏罗经，备述择地作坛粉线灌顶护摩供养之法，立后世行人入坛次第。
  phases:
  - key: brewing
    name: 观察忉利集会发问缘起
    labels:
      zh: 酝酿
    start_date: 0998
    highlight_event_id: guji-天息灾-event-translate
  - key: breakthrough
    name: 定四种炉四种门仪则
    labels:
      zh: 突破
    start_date: 0999
    highlight_event_id: guji-天息灾-event-translate
  - key: climax
    name: 成就灌顶护摩广大轨
    labels:
      zh: 高潮
    start_date: 0999
    highlight_event_id: guji-天息灾-event-translate
  - key: closure
    name: 以仪轨利乐后世弟子
    labels:
      zh: 收束
    start_date: '1000'
    highlight_event_id: guji-天息灾-event-death
  decisions:
  - date: 0999
    title_zh: 决以繁琐仪轨具译不省
    rationale: 金刚手所问择地净地钉橛四门粉色阏伽瓶量皆修行关要，若略则后人无所依，故虽文繁亦具存其详。
  - date: 0999
    title_zh: 决明息增敬伏随法异制
    rationale: 息灾增益敬爱降伏所用木橛瓶色炉形香花饮食各异，若混则不成成就，故分别部居，令行人随愿入坛。
events:
- id: guji-天息灾-event-birth
  title_zh: 北印度出生习秘密法
  date: 0950
  year_of: 950
  place_zh: 北印度
  type: birth
  summary_zh: 约十世纪中叶生于北印度，少习梵文悉昙及密教三密仪轨，为后日译经之本。
- id: guji-天息灾-event-arrival
  title_zh: 太平兴国五年来华入译经院
  date: 0980
  year_of: 980
  place_zh: 汴京译经院
  type: achievement
  summary_zh: 随中印度僧法天东来，宋太宗太平兴国五年至汴京，敕居译经传法院，参与译事。
- id: guji-天息灾-event-translate
  title_zh: 奉诏译出大秘密王最上微妙大曼拏罗经
  date: 0999
  year_of: 999
  place_zh: 汴京译经院
  type: achievement
  summary_zh: 以西天译经三藏朝散大夫试鸿胪少卿明教大师衔，奉诏译出二卷本，详述内外中曼荼罗、四门果报、五色粉次第、七种阏伽瓶、灌顶护摩诸法。
- id: guji-天息灾-event-death
  title_zh: 咸平三年示寂于汴京
  date: '1000'
  year_of: 1000
  place_zh: 汴京
  type: death
  summary_zh: 宋真宗咸平三年卒于译场，毕生译密部经轨十余部，宋初三大译师之一，密教仪轨赖以存。
