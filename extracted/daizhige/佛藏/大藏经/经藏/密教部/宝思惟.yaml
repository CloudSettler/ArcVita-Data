    rationale: 左持金轮莲花按山，右作思惟持珠执念珠，乘月轮顶化佛，唯用薰陆香汁为胶不受胶垢，令观像系念易得三昧
events:
- id: guji-宝思惟-event-birth
  title_zh: 生于北印度
  date: '0650'
  year_of: 650
  description: 生北印度婆罗门种，少习显密，精陀罗尼，得三藏之号，后发愿东来弘化
- id: guji-宝思惟-event-translate
  title_zh: 奉诏译如意摩尼轮念诵法
  date: '0705'
  year_of: 705
  description: 奉诏于长安译出观世音菩萨如意摩尼轮陀罗尼念诵法一卷，具根本咒心咒随心咒及根本印，言每日平旦嚼杨枝诵满十万圣者现身与愿，每日千遍现世入初地
- id: guji-宝思惟-event-protection
  title_zh: 传马头护身结界与画像法
  date: '0710'
  year_of: 710
  description: 传马头观音护身结界大法身法身诸印及毗俱胝地结，诵明王咒左转三匝避除诸魔右旋三匝成坚固界，并授六臂如意轮画像彩色薰陆为胶受八斋之法
- id: guji-宝思惟-event-death
  title_zh: 开元九年圆寂长安
  date: '0721'
  year_of: 721
  description: 唐玄宗开元九年圆寂，所译密部念诵仪轨流行两京，为盛唐密教先驱，后人合金刚智善无畏并称开弘之渐
