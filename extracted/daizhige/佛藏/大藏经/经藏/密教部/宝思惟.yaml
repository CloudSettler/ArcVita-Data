    rationale: 为令密咒东流，利益阎浮众生，故舍本土安乐而涉险来华
  - date: '0705-01-01'
    title_zh: 以音译存梵咒真形
    rationale: 明咒功在音声加持，若妄改音则失验，故以汉字转梵音详注合口引声
