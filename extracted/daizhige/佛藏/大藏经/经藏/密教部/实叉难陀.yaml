  dilemmas:
  - 梵本浩繁而华言难达，既要存密咒音韵之真，又要令中土众生受持得益
  - 身系于阗故土与大唐译场之间，去留进退皆关华严大部与陀罗尼译业之成败
  lesson: 以精通三藏与不辞劳远之心主持译场，方能令大部深经与一咒甘露并行于世
  summary_first_person: 吾是于阗沙门实叉难陀，少出家而习三藏，奉武后诏入洛阳，于佛授记寺与大遍空寺主持译场，重译大方广佛华严及楞伽等经，并出甘露陀罗尼咒，愿以此甘露法味饶益一切持诵众生
  source_urls:
