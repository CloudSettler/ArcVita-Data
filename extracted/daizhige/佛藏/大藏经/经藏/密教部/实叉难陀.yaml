    title_zh: 承诏赴洛阳佛授记寺主持译经
    rationale: 为满武后弘法之愿，且以中土译场人才鼎盛可成华严大部，故舍故土而东来
  - date: 0698
    title_zh: 亲校梵汉逐卷勘定华严文义
    rationale: 恐旧译阙略而梵本异传纷然，故躬自覆校以定八十卷之正文
- id: guji-实叉难陀-endeavor-2
  title_zh: 译出甘露陀罗尼及诸大乘密部经典
  summary: 于佛授记寺译甘露陀罗尼咒及楞伽入楞伽等经，以简要陀罗尼接引不能广习大部之众生
