    title_zh: 先出甘露陀罗尼一卷以利持诵
    rationale: 见世人根有钝利，大部难持，故先以短咒施甘露味令速得受持功德
  - date: '0703'
    title_zh: 存梵音不妄改密语以全咒力
    rationale: 密语贵在音韵相应，若意译则失加持，故依梵音转写以存其真
