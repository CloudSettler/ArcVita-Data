  archetype: 通五明之译经仪宾
  dilemmas:
  - 世间造像离宗失迷程式靡准，如何立量度准绳以全神气
  - 处尘劳兼馆务，如何远朝市栖幽壑以竟梵册译业
  lesson: 具几分准量则凝几分神气，依量度造像即是第一福田，循有相以窥无相
  summary_first_person: 余乌朱穆沁仪宾，幼蒙圣祖鞠育，掌西番学总管翻译，悯造像失度，乃译舍利弗所问量度经，亲加注述绘图，刊布流通，愿见像者发二觉心
