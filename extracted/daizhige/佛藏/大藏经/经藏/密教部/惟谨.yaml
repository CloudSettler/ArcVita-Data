  birth_date: 0680
  death_date: '0760'
  era: 唐
  reign_ref: 唐玄宗开元
  archetype: 密教持明阿阇梨
  dilemmas:
  - 显教文字浩繁与阿字一门总持如何取舍
  - 事相坛仪繁琐与观心成身简易如何贯通
  lesson: 以阿字本不生总持万法住佛位而成身悲智双运即是阿阇梨真实智
  summary_first_person: 吾惟谨住净影寺比绮院持念五部依大毗卢遮那经真实智品集阿字观门以四重字轮布身成佛愿后学住本不生智同毗卢遮那而作佛事
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/密教部/大毗卢遮那经阿阇梨真实智品中阿阇梨住阿字观门.html
endeavors:
- id: guji-惟谨-endeavor-1
  title_zh: 集释阿字观门与四重字轮成身观
  summary: 依大毗卢遮那经真实智品释阿字本不生遍布支分立四重三转布字成身之轨
  phases:
  - key: brewing
    name: 住寺持念研思阿字
    labels:
      zh: 持念五部
    start_date: '0715'
    highlight_event_id: guji-惟谨-event-1
  - key: breakthrough
    name: 了达根本增加不一不异
    labels:
      zh: 悟阿字遍一切处
    start_date: '0720'
    highlight_event_id: guji-惟谨-event-1
  - key: climax
    name: 集为阿字观门一卷
    labels:
      zh: 开元三月集成
    start_date: '0725-03-15'
    highlight_event_id: guji-惟谨-event-2
  - key: closure
    name: 付嘱口授字轮品
    labels:
      zh: 意想相传
    start_date: '0730'
    highlight_event_id: guji-惟谨-event-3
  decisions:
  - date: '0725-03-15'
    title_zh: 以阿字为头总持一切真言
    rationale: 阿字是诸佛母一切真言生处见字音即能诠表理事故立为观门根本
  - date: '0730'
    title_zh: 布字分四重三转但以口授不具文载
    rationale: 三重秘密曼荼罗非集真明堪传授者不可文载故以意想传持以护密法
- id: guji-惟谨-endeavor-2
  title_zh: 住佛位建立大悲胎藏曼荼罗并化他
  summary: 自住佛位师弟坛三事皆布字成身持句轮洛叉相应起悲行化他
  phases:
  - key: brewing
    name: 先建大悲胎藏曼荼罗王
    labels:
      zh: 住于佛位
    start_date: '0725'
    highlight_event_id: guji-惟谨-event-2
  - key: breakthrough
    name: 师弟坛三事皆布字成身
    labels:
      zh: 三密相应
    start_date: 0728
    highlight_event_id: guji-惟谨-event-3
  - key: climax
    name: 持句轮观注洛叉成就
    labels:
      zh: 三洛叉相应
    start_date: '0730'
    highlight_event_id: guji-惟谨-event-3
  - key: closure
    name: 以不动轮常照世间作佛事
    labels:
      zh: 普现色身
    start_date: '0735'
    highlight_event_id: guji-惟谨-event-3
  decisions:
  - date: 0728
    title_zh: 以迦字与剑字择一为轮布身
    labels: 抉择
    rationale: 二轮发菩提心行果大寂三分义同不可并用故择一以成身
  - date: '0730'
    title_zh: 以三相平等除三垢为洛叉成就之准
    rationale: 若不相应百年千万洛叉亦不得成故以身语意实相为成就要门
