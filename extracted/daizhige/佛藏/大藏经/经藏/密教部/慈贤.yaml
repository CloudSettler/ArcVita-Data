  death_date: '1000-12-31'
  era: 宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 译经三藏
  dilemmas:
  - 梵汉悬隔密言难宣而欲令中土得闻如意轮观门
  - 末世根器未熟而深法不可妄传故须先立灌顶次第
  lesson: 传译密教当先立师承灌顶次第，再示坛场观想，使行者身口意清净而后入观，方能广利有情
  summary_first_person: 吾本中天竺摩竭陀国沙门，蒙宋朝延请入译场为三藏法师，于译场译出如意轮莲华心如来修行观门仪，立三种灌顶受法之制，示轮坛印莲华印召请净坛宝楼阁供养根本心印之次第，愿后世求法者循序渐进速得成就
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T1090
  - https://daizhige.org/佛说如意轮莲华心如来修行观门仪.html
endeavors:
- id: guji-慈贤-endeavor-1
  title_zh: 译出如意轮莲华心修行观门仪
  description: 于宋译场将如意轮莲华心法译为汉文，具载轮坛印三昧耶印召请印沐浴净坛宝楼阁观供养奉施之仪轨
  phases:
  - key: brewing
    name: 入宋居译场酝酿
