    labels:
      zh: 突破
    start_date: '0982-01-01'
    highlight_event_id: guji-慈贤-event-translate
  - key: climax
    name: 译成观门仪一卷
    labels:
      zh: 高潮
    start_date: '0984-01-01'
    highlight_event_id: guji-慈贤-event-translate
  - key: closure
    name: 进呈流通付后学
    labels:
      zh: 收束
    start_date: '0985-01-01'
    highlight_event_id: guji-慈贤-event-teach
  decisions:
  - date: '0982-06-01'
    title_zh: 以偈颂兼长行具译仪轨
    rationale: 密教手印真言次第繁多，若唯存梵偈则汉僧难行，故以汉文广分别演说之体详述作法
  - date: '0984-03-01'
    title_zh: 存留梵音真言不强意译
    rationale: 真言为佛密语不可漫译，唯以汉字转音存其声韵，令持诵不失加持之力
- id: guji-慈贤-endeavor-2
  title_zh: 建立灌顶观想传授体系
  description: 立先礼师受三种灌顶再传如意轮心法之制，教以五处加持结界护身五供养月轮吽字化现供养根本心印数珠母观
  phases:
  - key: brewing
    name: 观察末世根器
    labels:
      zh: 酝酿
    start_date: '0984-01-01'
    highlight_event_id: guji-慈贤-event-translate
  - key: breakthrough
    name: 开三种灌顶之门
    labels:
      zh: 突破
    start_date: '0988-01-01'
    highlight_event_id: guji-慈贤-event-teach
  - key: climax
    name: 亲示月轮心观
    labels:
      zh: 高潮
    start_date: '0989-01-01'
    highlight_event_id: guji-慈贤-event-teach
  - key: closure
    name: 付嘱奉送还本位
    labels:
      zh: 收束
    start_date: '0990-01-01'
    highlight_event_id: guji-慈贤-event-death
  decisions:
  - date: '0988-05-01'
    title_zh: 先灌顶后传心法
    rationale: 若根性未熟骤闻秘密则生谤慢，故先令受灌顶听闻诸法，再启白师次第传受
  - date: '0989-08-01'
    title_zh: 以自身观为宝楼阁莲华坛
    rationale: 坛在外则执著事相，故教舍自身想为楼阁，于心月轮安如意轮如来及吽字光明，内外相应即能普利有情
