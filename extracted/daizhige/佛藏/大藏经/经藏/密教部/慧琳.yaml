endeavors:
- id: guji-慧琳-endeavor-1
  title_zh: 依诸大乘经纂集拣择地建立曼荼罗法
  summary: 会通苏悉地苏婆呼玉呬耶毗卢遮那诸经定受戒灌顶择地请地验土筑坛安宝分布圣位之次第
  phases:
  - key: brewing
    name: 依秘密教受菩提心戒灌顶学三密
    labels:
      zh: 受法学律
    start_date: '0760'
    highlight_event_id: guji-慧琳-event-xingshan
  - key: breakthrough
    name: 七日前择地请地神验境界土色味虚实
    labels:
      zh: 拣择地法
    start_date: 0780
    highlight_event_id: guji-慧琳-event-mandala
  - key: climax
    name: 如法掘填筑坛埋五宝五谷五香五药涂拭分布圣位
    labels:
      zh: 建立曼荼罗
    start_date: 0785
    highlight_event_id: guji-慧琳-event-mandala
  - key: closure
    name: 成书传后嘱博学通人详定
    labels:
      zh: 集文垂训
    start_date: 0790
    highlight_event_id: guji-慧琳-event-mandala
  decisions:
  - date: 0780
    title_zh: 以四经为本略集建坛大纲
    rationale: 大教虽具明修行者卒难寻检又不明先后故纂集以传未悟
  - date: 0785
    title_zh: 严立师承开遮不许无师自建
    rationale: 不从明师亲受不闲教意造次建立非但灵只不安亦自招咎故须择师守瑜伽妙观
- id: guji-慧琳-endeavor-2
  title_zh: 住大兴善寺参弘密教并编一切经音义
  summary: 承不空密教之绪长于梵汉校雠晚年成一切经音义百卷以正群经文字音训
  phases:
  - key: brewing
    name: 住上都大兴善寺习梵本悉昙章句
    labels:
      zh: 梵汉兼通
    start_date: '0760'
    highlight_event_id: guji-慧琳-event-xingshan
  - key: breakthrough
    name: 助传瑜伽密法究苏悉地毗卢遮那教相
    labels:
      zh: 究习瑜伽
    start_date: '0770'
    highlight_event_id: guji-慧琳-event-mandala
  - key: climax
    name: 发愿编集一切经音义以惠后学
    labels:
      zh: 音义编纂
    start_date: 0800
    highlight_event_id: guji-慧琳-event-yinyi
  - key: closure
    name: 书成上进藏于大兴善寺流行后世
    labels:
      zh: 书成流布
    start_date: 0807
    highlight_event_id: guji-慧琳-event-yinyi
  decisions:
  - date: 0800
    title_zh: 以余力拾玄应慧苑旧业续作音义
    rationale: 群经翻译音义舛讹学者难读当以梵汉对校正其文字以利讲诵
  - date: 0807
    title_zh: 竭老成百卷不徇速成
    rationale: 宁阙毋滥一一考据梵本汉籍务令经文音训有据可依
