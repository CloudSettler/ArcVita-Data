endeavors:
- id: guji-指空-endeavor-1
  person_qid: guji-指空
  title_zh: 校持观自在大悲心陀罗尼
  summary: 以高丽僧嗣西天祖风，仇校观自在菩萨广大圆满无碍大悲心陀罗尼，厘定梵汉音字，令持诵圆满无碍
  phases:
  - key: brewing
    name: 嗣祖习密
    labels:
      zh:
      - 高丽出家
      - 西天嗣祖
    start_date: 1315-01-01
    highlight_event_id: guji-指空-event-birth
  - key: breakthrough
    name: 得梵本发心
    labels:
      zh:
      - 获梵本
      - 立志仇校
    start_date: 1335-01-01
    highlight_event_id: guji-指空-event-1
  - key: climax
    name: 仇校竟成
    labels:
      zh:
      - 对校音字
      - 定本流通
    start_date: 1345-01-01
    highlight_event_id: guji-指空-event-1
  - key: closure
    name: 付嘱流通
    labels:
      zh:
      - 普劝持诵
      - 功德圆满
    start_date: 1350-01-01
    highlight_event_id: guji-指空-event-1
  decisions:
  - date: 1340-01-01
    title_zh: 决意仇校大悲心咒本
    rationale: 旧译音字参差，学者讹诵难获胜益，故须博采梵本精加仇校以存真
  - date: 1345-01-01
    title_zh: 以圆满无碍为宗付嘱
    rationale: 观自在大悲普门示现，宜令文句具足，使持者灭障生善，故标广大圆满无碍之名
- id: guji-指空-endeavor-2
  person_qid: guji-指空
  title_zh: 译传观世音菩萨施食法
  summary: 译出观世音菩萨施食仪轨，立普请法施之法，诵真言施诸饿鬼，令幽显俱沾慈济
  phases:
  - key: brewing
    name: 愍念幽苦
    labels:
      zh:
      - 悲愍饿鬼
      - 访求仪轨
    start_date: 1346-01-01
    highlight_event_id: guji-指空-event-1
  - key: breakthrough
    name: 定普请法施
    labels:
      zh:
      - 普请大众
      - 法施为先
    start_date: 1348-01-01
    highlight_event_id: guji-指空-event-2
  - key: climax
    name: 译竟施食真言
    labels:
      zh:
      - 译施食咒
      - 立轨施食
    start_date: 1352-01-01
    highlight_event_id: guji-指空-event-2
  - key: closure
    name: 普劝奉行
    labels:
      zh:
      - 流通施食
      - 利济群生
    start_date: 1355-01-01
    highlight_event_id: guji-指空-event-2
  decisions:
  - date: 1348-01-01
    title_zh: 以法施摄众后行食施
    rationale: 欲令施者受者皆发菩提，故先普请大众慈悲法施，后以真言加持饮食
  - date: 1352-01-01
    title_zh: 决行观音施食普济
    rationale: 观音大悲拔苦，饿鬼逼迫最苦，依咒加持可令饱满解脱，故不择贵贱普行施与
