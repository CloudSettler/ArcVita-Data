  - key: climax
    name: 洛阳长安开坛弘咒
    labels:
      zh: 高潮
    start_date: 0690-06-01
    highlight_event_id: guji-提云般若-event-2
  - key: closure
    name: 以护生流通报佛恩
    labels:
      zh: 收束
    start_date: 0691-01-01
