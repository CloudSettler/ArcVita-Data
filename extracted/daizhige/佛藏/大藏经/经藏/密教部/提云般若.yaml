  decisions:
  - date: 0686-01-01
    title_zh: 应诏共译不专一家之言
    rationale: 为令梵汉义理无失，邀众参详共成会译，以全佛意
  - date: 0689-01-01
    title_zh: 详录持咒坛场仪轨
    rationale: 恐空有神咒而无行法，故具载择地斋戒香花灯供之节，令人人可修
- id: guji-提云般若-endeavor-2
  title_zh: 弘传陀罗尼护国护生之法
  description: 于洛阳长安教授四众如法受持书佩供养，以读诵书写流通除非时夭横，令寿命增长水火刀毒不侵
  phases:
  - key: brewing
    name: 恒河说法悲愿熏习
    labels:
