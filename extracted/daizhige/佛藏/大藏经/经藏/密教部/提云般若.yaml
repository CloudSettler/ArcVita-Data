  decisions:
  - date: 0690-06-01
    title_zh: 劝书咒佩身广令流通
    rationale: 欲令专护其身者得便，故劝书咒佩著及教人书，以承事供养一切诸佛
  - date: 0690-08-01
    title_zh: 以饶益众生为供养
    rationale: 若于众生能作饶益则为供养诸佛，故以护生除横为弘法宗旨
events:
- id: guji-提云般若-event-birth
  title_zh: 诞生于于阗
  date: 0630-01-01
  year_of: 630
  description: 约贞观年间生于于阗，少出家精律论梵呗，尤善密咒，后赍梵本东来
- id: guji-提云般若-event-1
  title_zh: 奉制译诸佛集会陀罗尼经
  date: 0689-01-01
  year_of: 689
  description: 在东都奉制与众共译，宣说佛在恒伽河边集十方诸佛金刚四天王说咒除非时夭横，并立七肘方坛持诵仪轨
- id: guji-提云般若-event-2
  title_zh: 洛阳长安开坛弘咒护生
  date: 0690-06-01
  year_of: 690
  description: 教授四众择净地涂檀建坛，斋戒诵咒供养流通，谓读诵书写此咒即供养一切佛，能令寿命增长灾横消除
- id: guji-提云般若-event-death
  title_zh: 示寂于译场
  date: 0692-01-01
  year_of: 692
  description: 译弘既毕示寂，门人付嘱流通，护生悲愿长存经中，天人欢喜奉行
