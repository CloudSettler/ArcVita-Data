  - title_zh: 居士弘法之定位
    description_zh: 以在俗之身拜为博士，当于官学与译经之间抉择，终以译典利人为本愿
  - title_zh: 文质会通之权衡
    description_zh: 梵本質朴难晓，过饰又恐失义，须在信实与通达之间求其中道
  lesson: 博通而守诚，在俗亦能弘圣教，译贵达义利人方为不朽
  summary_first_person: 我本月支居士之后，避乱江南，蒙吴主待以博士之礼，我不恋荣禄，惟愿译出梵典，令华积神咒普沾天人，度众出于险棘之途
