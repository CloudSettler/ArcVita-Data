  dilemmas:
  - title_zh: 早证菩提与久住轮回
    description: 若速取菩提则一身安乐，若久住轮回则多众得度，宁住暗劫化利有情不独取正觉
  - title_zh: 常游净土与不舍秽土
    description: 愿常游诸佛净土而又不舍轮回有情，于净秽之间以大悲平等摄持
  lesson: 以菩提心为根本，誓令一众未度不取正觉，于无量劫中以清净身语意恒利有情
  summary_first_person: 吾昔为哑马国王时，于雷音王佛前发大菩提心，愿自今日至证菩提中间永断痴嗔悭贪贡高，不舍一众未出离者，住于暗劫恒作化利，常游佛刹，身语意业悉令清净
