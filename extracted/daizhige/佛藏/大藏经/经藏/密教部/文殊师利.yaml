    rationale: 随喜正觉所行而以自己所修善回向众生，有一未出离则己不住正觉安乐
  - date: -0980-01-01
    title_zh: 常游净土兼净三业
    rationale: 于无量不思议劫中亲近诸佛以增智，于十方界中发露恶业以净障，悲智双运乃能久利
events:
