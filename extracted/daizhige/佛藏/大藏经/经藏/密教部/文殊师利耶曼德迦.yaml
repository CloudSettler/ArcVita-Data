  title_zh: 說耶曼德迦瞋怒王大神咒
  description: 於大眾中說根本大咒攝阎羅調伏及一切天仙菩薩咒大地六種震動天龍八部歸依法王
- id: guji-文殊师利耶曼德迦-event-2
