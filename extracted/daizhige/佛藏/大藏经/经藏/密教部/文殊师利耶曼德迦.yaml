  title_zh: 王舍竹林應化現身
  description: 世尊於王舍城竹林與文殊論燃燈授記因金剛藥叉將請說瞋怒王法佛入變化三昧我應化現前
- id: guji-文殊师利耶曼德迦-event-1
  date: -0499-06-01
