  title_zh: 童子示现降诞
  description_zh: 文殊师利菩萨示现童子形天衣搭左肩莲华上座说法之相
- id: guji-文殊师利菩萨-event-1
  date: '-0500'
  year_of: -500
  title_zh: 宣说六字咒功能法经
  description_zh: 说南无一切利益尊者文殊师利童子菩萨摩诃萨六字神咒每日七遍除罪百八遍临终得见六十万遍法成百二十万遍得成咒仙一俱胝入一生补处
- id: guji-文殊师利菩萨-event-2
  date: '-0400'
  year_of: -400
  title_zh: 授坛像阇提花散供验相
  description_zh: 教画匠受八戒不用胶画文殊及观自在普贤咒仙持咒人像于舍利塔前面西设供苏灯散千八阇提花闻妙声得称心坛动诤论得胜通达言教众生爱乐
- id: guji-文殊师利菩萨-event-3
  date: '-0300'
  year_of: -300
  title_zh: 授满月莲华与月蚀持验成就
  description_zh: 授紫檀莲华诵百千遍满月顶光取花得二八相金色光明寿一劫往生极乐及白菖蒲黄牛苏安悉香丸莲华掷河油麻火烧等得慧财寿辩才除病满愿诸法
- id: guji-文殊师利菩萨-event-death
  date: '3000'
  year_of: 3000
  title_zh: 示现无住涅槃常住度生
  description_zh: 不取究竟灭度常住法界随持咒众生感应现前说甚深法令入菩萨地
