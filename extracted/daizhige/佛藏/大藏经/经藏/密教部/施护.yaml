    title_zh: 应诏留宋专任译经
    rationale: 以译场为道场留华传梵可利多人故舍归国而就译席
  - date: 0983-01-01
    title_zh: 音译密咒兼存义译
    rationale: 密咒以声为体直译失验故以汉字系梵音存其神用复以华言释其功德
