    title_zh: 拣译降伏星曜法门
    rationale: 见世间星曜为祟众生惊怖，故先译此最胜大力如金刚宝之法以护国安民
  - date: 0995-01-01
    title_zh: 具存密语不省文
    rationale: 以陀罗尼字句具不思议力，若删略则失降伏之用，故具录梵音汉转令持诵得验
