    start_date: 0980
    highlight_event_id: guji-施护-event-arrival
  - key: climax
    name: 群译鼎盛多经并出
    labels:
      zh: 鼎盛多译
    start_date: 0990
    highlight_event_id: guji-施护-event-translate-many
  - key: closure
    name: 赐紫传法功成
    labels:
      zh: 功成赐号
    start_date: '1005'
    highlight_event_id: guji-施护-event-honor
  decisions:
  - date: 0980
    title_zh: 应诏东来就译
    rationale: 为使西天正法广布东土，不辞远行入华，依朝廷译场群议共译以取信
  - date: 0990
    title_zh: 坚持直译兼畅义
    rationale: 梵汉文体悬隔，须存密咒音义而以汉文明其理，令持诵解义两得
- id: guji-施护-endeavor-2
  title_zh: 传译金刚场庄严般若密教法门
  summary_zh: 于大部般若支流别行之中，择金刚场庄严一分译弘，以四念处乃至十八不共法配以大明真言，会显入密，令金刚瑜伽大秘密主法门在汉地有依可修。
  phases:
  - key: brewing
    name: 劝请因缘观察
    labels:
      zh: 缘起观察
    start_date: 0995
    highlight_event_id: guji-施护-event-translate-many
  - key: breakthrough
    name: 别行一分首译
    labels:
      zh: 别行首译
    start_date: '1000'
    highlight_event_id: guji-施护-event-translate-jingangchang
  - key: climax
    name: 庄严道场广说仪轨
    labels:
      zh: 广说庄严
    start_date: '1002'
    highlight_event_id: guji-施护-event-translate-jingangchang
  - key: closure
    name: 付嘱流通护念
    labels:
      zh: 流通护念
    start_date: '1010'
    highlight_event_id: guji-施护-event-honor
  decisions:
  - date: '1000'
    title_zh: 于大部中别行金刚场一分
    rationale: 大般若广博难持，别出一分以金刚场摄三十七道品等地，便于观修持诵
  - date: '1002'
    title_zh: 以大明总持摄诸法门
    rationale: 诸法门各付真言大明，使理事双运，显教义理藉密咒得护持成就
events:
- id: guji-施护-event-birth
  date: 约0950
  year_of: 950
  type: birth
  title_zh: 生于西天乌填曩国
  description_zh: 约宋初生于西域，幼习声明因明，兼通显密经论，为后入华译经奠基
- id: guji-施护-event-arrival
  date: 0980
  year_of: 980
  type: career
  title_zh: 随师东来入宋译经院
  description_zh: 宋太宗太平兴国五年随天息灾入开封，充译经三藏试光禄卿，赐紫传法大师，参预官方群译
- id: guji-施护-event-translate-many
  date: 0990
  year_of: 990
  type: career
  title_zh: 群译般若宝生等经百余卷
  description_zh: 与法贤法天等共译佛说圣曜母等及般若诸经，译风信实，朝野推重，译场规模大备
- id: guji-施护-event-translate-jingangchang
  date: '1000'
  year_of: 1000
  type: career
  title_zh: 译出佛说金刚场庄严般若波罗蜜多教中一分
  description_zh: 以大毗卢遮那金刚瑜伽为主尊，译四念处至十八不共法诸品及大明句，阐明即显即密平等法门，十方如来称赞流通
- id: guji-施护-event-honor
  date: '1005'
  year_of: 1005
  type: career
  title_zh: 朝廷褒显传法授徒
  description_zh: 以译经功授朝奉大夫传法大师，领徒传授梵本仪轨，护念正法成熟有情，译业至此圆满
- id: guji-施护-event-death
  date: '1017'
  year_of: 1017
  type: death
  title_zh: 卒于开封译经院
  description_zh: 宋真宗天禧元年示寂，朝廷厚赙荼毗，所译金刚场庄严一分与诸经并入大藏流行后世
