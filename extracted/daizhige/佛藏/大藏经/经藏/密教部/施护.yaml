endeavors:
- id: guji-施护-endeavor-1
  person_qid: guji-施护
  title_zh: 自西天来华入宋译经院效命
  summary: 自乌仗那国西来，于宋太祖开宝中抵华，入太平兴国译经院与法天等共参翻译，历受紫衣明教传法等封，专攻显密经律陀罗尼部
  phases:
  - key: brewing
    name: 西来发足与初抵华土
    labels:
      zh:
      - 筹备来华
    start_date: 0970
    highlight_event_id: guji-施护-event-join
  - key: breakthrough
    name: 入译经院奉诏参译
    labels:
      zh:
      - 奉诏入院
    start_date: 0982
    highlight_event_id: guji-施护-event-join
  - key: climax
    name: 加号传法大师领译事
    labels:
      zh:
      - 荣膺传法
    start_date: 0990
    highlight_event_id: guji-施护-event-confer
  - key: closure
    name: 译业宏富垂范后学
    labels:
      zh:
      - 译绩宏敷
    start_date: '1000'
    highlight_event_id: guji-施护-event-confer
  decisions:
  - date: 0982
    title_zh: 应诏入译经院专事翻译
    rationale: 感宋廷崇法护教之诚，愿以梵学长才报国利生，遂舍游化而就译席，与众共成信本
  - date: 0990
    title_zh: 坚持直译兼顾义趣通畅
    rationale: 陀罗尼密语难翻，若徒存音则义晦，若妄添义则失真，故当音义并存而以演说义趣补之
- id: guji-施护-endeavor-2
  person_qid: guji-施护
  title_zh: 译弘花积楼阁陀罗尼经
  summary: 在阿耨达池无热恼龙王宫会说因缘下，译出世尊答师子游戏菩萨所问福蕴供养法门，具载五法功德、舍利起塔、花鬘灯涂供养灭罪生善之益及陀罗尼行法
  phases:
  - key: brewing
    name: 咨问福蕴与供养因果
    labels:
      zh:
      - 发起咨问
    start_date: 0995
    highlight_event_id: guji-施护-event-translate
  - key: breakthrough
    name: 译定供塔持花功德分
    labels:
      zh:
      - 译定功德
    start_date: 0996
    highlight_event_id: guji-施护-event-translate
  - key: climax
    name: 宣说陀罗尼及现见佛法
    labels:
      zh:
      - 宣说总持
    start_date: 0997
    highlight_event_id: guji-施护-event-propagate
  - key: closure
    name: 流通受持广为人说
    labels:
      zh:
      - 流通弘化
    start_date: 0998
    highlight_event_id: guji-施护-event-propagate
  decisions:
  - date: 0996
    title_zh: 详译香泥曼拏罗扫塔洒净等易行
    rationale: 欲令在家出家皆得修福，故不舍一花一灯一掬水之微善，以志心故皆成无量，先世堕阿鼻之业亦得除灭
  - date: 0997
    title_zh: 具存陀罗尼音并明持诵轨则
    rationale: 此是十方诸佛同共宣说，若得经名至心供养已获无边功德，复明二三八月白月八日起首六时持念见佛之法，以坚行人净信
