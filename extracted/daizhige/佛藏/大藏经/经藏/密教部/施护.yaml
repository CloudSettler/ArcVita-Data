  title_zh: 入宋译场系统传译显密经论
  summary_zh: 自太平兴国中应诏入开封译经院，与法天等共事群译，历太宗真宗两朝译出般若宝生功德等经凡百余卷，确立北宋官方译场制度。
  phases:
