    en: Danapala
  lifespan:
    birth:
      date: 0950
      precision: year
      is_circa: true
      raw: 约十世纪中叶生于乌仗那国
    death:
      date: '1017'
      precision: year
      is_circa: true
      raw: 宋真宗天禧元年卒于开封
  birth_date: 0950
  death_date: '1017'
  era: 北宋
  reign_ref: 宋太祖开宝至宋真宗天禧
  archetype: 西天译经传法大师
  dilemmas:
  - 梵汉悬隔而诏命殷重，当如何在信达雅之间取舍，以全陀罗尼真实义趣
  - 显密并弘而众根不一，当如何以供塔持诵等易行门接引天上人间一切众生
  lesson: 以清净心译经弘法，以易行供养摄化群生，则福蕴无量而慧命长续
  summary_first_person: 我是施护，西天乌仗那国人，奉宋帝诏入译经院传法。深愧梵汉艰涩，惟以至诚受持宣演。我译说花积楼阁陀罗尼经，广明供养如来及舍利宝塔功德无量，劝人受持陀罗尼、兴供养、除宿业、生人天、证菩提，愿以此译业利益安乐一切众生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E4%BD%9B%E8%AF%B4%E8%8A%B1%E7%A7%AF%E6%A5%BC%E9%98%81%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.md
