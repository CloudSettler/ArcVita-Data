  summary_first_person: 我是施护本北印度人入宋充西天译经三藏奉诏译经我于补陀落迦会上缘起中译出圣观自在菩萨不空王秘密心陀罗尼具陈二十功德八善相种种法用但愿闻者罪灭病除临终安隐随愿往生
