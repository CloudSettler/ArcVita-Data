events:
- id: guji-施护-event-birth
  date: 0950
  year_of: 950
  title_zh: 生于西天乌苌国
  description_zh: 约十世纪中叶生于西天乌苌国，少习梵典，精通声明密轨，后发心东来传法。
- id: guji-施护-event-arrive
  date: 0980
  year_of: 980
  title_zh: 随师抵汴入译经院助译
  description_zh: 宋太宗太平兴国五年随天息灾至开封，入译经院习华言助译，渐通华梵。
- id: guji-施护-event-chief
  date: 0991
  year_of: 991
  title_zh: 授朝散大夫试鸿胪少卿传法大师主译
  description_zh: 授西天译经三藏朝散大夫试鸿胪少卿传法大师，独主译席，译出众多密教经轨。
- id: guji-施护-event-anxiang
  date: '1001'
  year_of: 1001
  title_zh: 奉诏译出一切如来安像三昧仪轨经
  description_zh: 译出安像三昧仪轨经，详定造像相好分量，建坛召请沐浴开眼供养护摩发遣之次第，为后世开像程式。
- id: guji-施护-event-death
  date: '1017'
  year_of: 1017
  title_zh: 圆寂于开封
  description_zh: 宋真宗天禧元年圆寂于开封译经院，一生译籍百余卷，密教仪轨藉之大行。
