  archetype: 译经持明沙门
  dilemmas:
  - 梵本艰涩而验效弘大当如何忠实传译以利末世
  - 咒印坛仪繁复当如何立简易灭罪之门令众得入
  lesson: 以总持译咒立坛传法，令诵持者灭障见圣往生净土
  summary_first_person: 吾为大唐总持寺沙门智通，翻梵本出千转陀罗尼观世音菩萨咒，具说手印坛场护摩修法，愿众生诵持灭四重五逆生诸佛净土
