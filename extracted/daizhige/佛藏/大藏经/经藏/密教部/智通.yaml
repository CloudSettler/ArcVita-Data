endeavors:
- id: guji-智通-endeavor-1
  title_zh: 翻译千转陀罗尼观世音菩萨咒
  description: 居大唐总持寺据梵本译出千转陀罗尼观世音菩萨咒及灭罪见圣功德
  phases:
  - key: brewing
    name: 居总持寺研习梵本
    labels:
      zh: 研习梵本
    start_date: '0640'
    highlight_event_id: guji-智通-event-1
  - key: breakthrough
    name: 译出千转咒文
    labels:
      zh: 译咒
    start_date: '0650'
    highlight_event_id: guji-智通-event-1
  - key: climax
    name: 具说诵持验效
    labels:
      zh: 说功德
    start_date: '0651'
    highlight_event_id: guji-智通-event-1
  - key: closure
    name: 流通咒本于世
    labels:
      zh: 流通
    start_date: '0652'
    highlight_event_id: guji-智通-event-1
  decisions:
  - date: '0650'
    title_zh: 决定直译咒语存梵音并注反切
    rationale: 为存总持神力不失字音，故以汉字系梵音并注反切令读诵得正
  - date: '0651'
    title_zh: 决定具载十遍十万遍功德
    rationale: 为劝末世生信，故明说灭五逆见观音往生净土之验以摄众机
- id: guji-智通-endeavor-2
  title_zh: 传持印坛护摩修法
  description: 会合崛多师印法与坛场护摩仪，传授千转受持作法令得成就
  phases:
  - key: brewing
    name: 咨受崛多师印法
    labels:
      zh: 咨受印法
    start_date: '0652'
    highlight_event_id: guji-智通-event-2
  - key: breakthrough
    name: 定千转印身脚仪
    labels:
      zh: 定印仪
    start_date: '0653'
    highlight_event_id: guji-智通-event-2
  - key: climax
    name: 立四重坛场护摩
    labels:
      zh: 立坛护摩
    start_date: '0655'
    highlight_event_id: guji-智通-event-2
  - key: closure
    name: 开别行简易持诵门
    labels:
      zh: 开方便门
    start_date: '0656'
    highlight_event_id: guji-智通-event-2
  decisions:
  - date: '0653'
    title_zh: 决定以观音心印为本别明身脚
    rationale: 为令印契易学，故同心印而别出身脚丁字跨屈之式以成千转别行
  - date: '0655'
    title_zh: 决定具说坛罐灯箭护摩之式
    rationale: 为令行者如法成就，故详载坛量色门水罐灯箭佉陀罗木护摩千八遍之法
events:
- id: guji-智通-event-birth
  title_zh: 唐初约生出家总持寺
  date: '0610'
  year_of: 610
  description: 约唐初生，后出家为大唐总持寺沙门，习梵文总持法门
- id: guji-智通-event-1
  title_zh: 译出千转陀罗尼观世音菩萨咒
  date: '0650'
  year_of: 650
  description: 在总持寺翻梵本出千转陀罗尼观世音菩萨咒，具说诵七遍十遍十万遍灭罪见观音功德
- id: guji-智通-event-2
  title_zh: 传布千转印坛护摩法
  date: '0655'
  year_of: 655
  description: 会崛多师所译印法，传千转印坛场供养护摩千八枝及别译突婆香楮木受持法
- id: guji-智通-event-death
  title_zh: 唐高宗时约卒
  date: 0680
  year_of: 680
  description: 约唐高宗时示寂，咒本与仪轨流通后世，载入密教部经藏
