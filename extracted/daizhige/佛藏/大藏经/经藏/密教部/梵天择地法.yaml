endeavors:
- id: guji-梵天择地法-endeavor-1
  title_zh: 入广州深山验福地感通
  summary: 开五年入广州深山按择地法验地受持，感大佛顶神现金色大身受法，证山中胜地作坛立成
  phases:
  - key: brewing
    name: 因地感怀游山被恼
    labels:
      zh: 案经见持咒仙人被魔恼法不成
    start_date: 0720-01-01
    highlight_event_id: guji-梵天择地法-event-dharma
  - key: breakthrough
    name: 入山得无草净地
    labels:
      zh: 深山猛兽坐处无草为护塔神地
    start_date: 0725-01-01
    highlight_event_id: guji-梵天择地法-event-guangzhou
  - key: climax
    name: 感大佛顶神现身
    labels:
      zh: 金色白衣大神长三丈来受法
    start_date: 0730-01-01
    highlight_event_id: guji-梵天择地法-event-guangzhou
  - key: closure
    name: 证验立说传后
    labels:
      zh: 验山中作坛百千胜俗家
    start_date: 0732-01-01
    highlight_event_id: guji-梵天择地法-event-precept
  decisions:
  - date: 0725-03-01
    title_zh: 舍俗家杂地专入深山
    rationale: 寺舍俗家百倍不及山中，欲救众生终须择胜地而后法成
  - date: 0730-06-01
    title_zh: 依持戒限定受用地
    rationale: 圣人成道福地非持戒比丘不得居，恐破戒招损故严加拣别
- id: guji-梵天择地法-endeavor-2
  title_zh: 案经总结四十二种择地法
  summary: 案大梵天王内秘密经备列石窟异花五色云光香烟等相及穿地相土结界之式，垂为曼荼罗准绳
  phases:
  - key: brewing
    name: 搜集经说相地旧文
    labels:
      zh: 案经有四十二种择地堪作曼荼罗
    start_date: 0733-01-01
    highlight_event_id: guji-梵天择地法-event-dharma
  - key: breakthrough
    name: 分类山相与穿地法
    labels:
      zh: 山中三十余相加穿地验骨验宝
    start_date: 0735-01-01
    highlight_event_id: guji-梵天择地法-event-dharma
  - key: climax
    name: 定持戒结界作坛仪
    labels:
      zh: 俗家作坛多不如法须结界
    start_date: 0740-01-01
    highlight_event_id: guji-梵天择地法-event-precept
  - key: closure
    name: 成文示劫灾不坏
    labels:
      zh: 得一胜地作坛劫灾其地不坏
    start_date: 0745-01-01
    highlight_event_id: guji-梵天择地法-event-precept
  decisions:
  - date: 0735-08-01
    title_zh: 以五色光香异花为上地
    rationale: 圣人学道坐处必现异相，以此辨真伪胜劣最为捷要
  - date: 0740-02-01
    title_zh: 俗家病室另居不入坛内
    rationale: 贫道验俗家作坛多有损伤，令病人别室澡浴著新衣咒师专心称名可两全
events:
- id: guji-梵天择地法-event-birth
  date: 0700-01-01
  year_of: 700
  title_zh: 降生岭南
  description: 约生唐初岭南，少习密咒立志游山持诵求感通
  place_zh: 岭南广州一带
- id: guji-梵天择地法-event-guangzhou
  date: 0730-05-01
  year_of: 730
  title_zh: 入广州深山感大佛顶神
  description: 开五年入广州深山得猛兽坐无草净地，依前法受持感金色白衣大神身长三丈自称大佛顶神来受法
  place_zh: 广州深山
- id: guji-梵天择地法-event-dharma
  date: 0735-10-01
  year_of: 735
  title_zh: 案经定四十二种择地法
  description: 案大梵天王内秘密经备录石窟清石五色石蛇角盘石白鹿双树五色光香烟穿地验宝等四十二法，堪作曼荼罗使持咒如意
  place_zh: 山中净室
- id: guji-梵天择地法-event-precept
  date: 0740-04-01
  year_of: 740
  title_zh: 立持戒结界俗家 alternatives 之戒
  description: 定持戒比丘方居福地，寺上伽蓝穿地二尺得骨不堪，俗家多结界不作坛，病人另室清净防损咒师
  place_zh: 道场坛所
- id: guji-梵天择地法-event-death
  date: 0780-12-31
  year_of: 780
  title_zh: 示寂留法
  description: 约寂于唐大历年间，留梵天择地法一篇后经灵云净严等校订流传东土
  place_zh: 山中坛地
