  name_zh: 梵天择地法
  names:
    zh: 梵天择地法
    en: Fantian Zedi Fa
  lifespan:
    birth:
      date: 0700-01-01
      precision: year
      is_circa: true
      raw: 唐初约生于岭南一带
    death:
      date: 0780-12-31
      precision: year
      is_circa: true
      raw: 唐大历年间约寂
  birth_date: 0700-01-01
  death_date: 0780-12-31
  era: 唐
  reign_ref: 唐玄宗开元至唐代宗大历
  archetype: 密教持咒择地师
  dilemmas:
  - 持戒清净与凡俗杂地之间的取舍
  - 山中胜地难得与救度众生须择地之间的矛盾
  - 神验感通与魔恼法事不成之间的辨别
  lesson: 非胜地不建曼荼罗，非持戒不清净不居福地，先相地结界而后作坛方能持咒如意成就
  summary_first_person: 我见如来因地五百万生作持咒仙人游历诸山而多被魔恼法事不成，便案大梵天王内秘密经总结四十二种择地法，曾开五年入广州深山验福地感大佛顶神现身受法，此后教人先穿地相地持戒结界，不以俗家杂地草率作坛
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E6%A2%B5%E5%A4%A9%E6%8B%A9%E5%9C%B0%E6%B3%95.html
