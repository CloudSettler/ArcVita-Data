events:
- id: guji-武彻-event-birth
  title_zh: 出生
  type: birth
  date: '0740-01-01'
  year_of: 740
  description: 唐开元年间生，长为朝议大夫兼侍御史，弱岁即常念持佛顶尊胜陀罗尼
- id: guji-武彻-event-yongtai-qiufa
  title_zh: 永泰初丧妻精进并从蒋那闻广本
  type: career
  date: '0765-06-01'
  year_of: 765
  description: 永泰初丧妻后倍益精心求出离，从殿中侍御史蒋那得闻王开士受金刚智三藏广本文句，拜受而蒋那旋殁，常怀遗悔
- id: guji-武彻-event-jiaoben-kanhe
  title_zh: 遇僧际得全本勘合三王本如一
  type: career
  date: '0770-01-01'
  year_of: 770
  description: 遇僧际果有此本，又得五台王居士王开士王少府各受圣授神授及金刚智梵夹本，三本勘校音旨字数如一，知多于波利本九句六十九字
- id: guji-武彻-event-zhuanji
  title_zh: 撰加句灵验记惠琳勘同序卷末
  type: career
  date: '0819-01-01'
  year_of: 819
  description: 撰成加句灵验佛顶尊胜陀罗尼记，具载诵咒见父生天及冥司拔苦诸验并列具足咒本，元和十四年僧惠琳修藏目录时亲自勘同序之卷末
- id: guji-武彻-event-death
  title_zh: 逝世
  type: death
  date: '0820-01-01'
  year_of: 820
  description: 元和末年左右殁，其所撰灵验记连同加句具足本经后人续附张绎马扬义追等事广传于世
