events:
- id: guji-法华十罗刹法-event-birth
  title_zh: 法华会上发愿受记
  date: '0280-01-01'
  year_of: 280
  description: 十罗刹女于法华陀罗尼品中立誓护持受持法华者即是法门之生
- id: guji-法华十罗刹法-event-vow
  title_zh: 誓护法华行者
  date: '0280-06-01'
  year_of: 280
  description: 发愿若有受持法华者我等与其眷属共守护令无忧恼
- id: guji-法华十罗刹法-event-mudra
  title_zh: 十印次第传出
  date: '0600-01-01'
  year_of: 600
  description: 自道场印法华印乃至天地魔目大缚印十印配真言次第成就
- id: guji-法华十罗刹法-event-form
  title_zh: 十罗刹形像分别
  date: '0650-01-01'
  year_of: 650
  description: 分别蓝婆毗蓝婆曲齿花齿黑齿多发无厌足持璎珞白幸帝夺精气等形色衣饰
- id: guji-法华十罗刹法-event-protect
  title_zh: 八龙王摄护同盟
  date: '0750-01-01'
  year_of: 750
  description: 以印咒摄难陀跋难陀等八龙王部类眷属同护行者护身无碍
- id: guji-法华十罗刹法-event-treasury
  title_zh: 修多罗藏护印成就
  date: '0800-01-01'
  year_of: 800
  description: 结修多罗藏印及护法华藏印令法藏不散行者记忆不忘
- id: guji-法华十罗刹法-event-mantra
  title_zh: 本心微尘等咒流通
  date: '0850-01-01'
  year_of: 850
  description: 说十罗刹本心咒及一一别咒并八罗刹咒令后世依声持诵即得加持
- id: guji-法华十罗刹法-event-death
  title_zh: 誓愿长护无有灭尽
  date: '0900-12-31'
  year_of: 900
  description: 以本誓故不取涅槃尽未来际护持法华当以此为法门之终归于无终
