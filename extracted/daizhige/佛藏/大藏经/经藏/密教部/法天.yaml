person:
  qid: guji-法天
  name_zh: 法天
  names:
    zh: 法天
    en: Dharmadeva
  lifespan:
    birth:
      date: 0958
      precision: year
      is_circa: true
      raw: 西天人，宋初来华，约生于十世纪中叶
    death:
      date: '1001'
      precision: year
      is_circa: false
      raw: 宋真宗咸平四年卒
  birth_date: 0958
  death_date: '1001'
  era: 北宋
  reign_ref: 宋太祖至真宗
  archetype: 译经弘法者
  dilemmas:
  - 梵本密咒艰涩难晓，如何以华言传其真实义而不失秘密威力
  - 部多忿怒降伏法猛厉难持，如何令末世懈怠破戒之人亦得成就而不堕邪见
  lesson: 以慈悲调伏为体，以仪轨真言为用，令一切众生离怖得成就
  summary_first_person: 吾本西天沙门，奉宋帝诏入华译经，传金刚手降伏一切部多大教王法，愿末法众生持诵成就，离诸怖畏，具足财宝福寿
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T1129
