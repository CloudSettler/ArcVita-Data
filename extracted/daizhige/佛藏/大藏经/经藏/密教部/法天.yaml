  - key: climax
    name: 授官传教大师
    labels:
      zh: 高潮
    start_date: 0986
    highlight_event_id: guji-法天-event-award
  - key: closure
    name: 译场领众不辍
    labels:
      zh: 收束
    start_date: 0990
    highlight_event_id: guji-法天-event-award
  decisions:
  - date: 0982
    title_zh: 应诏入开封译经
    rationale: 感宋帝崇法护教之诚，愿以梵汉兼通之长报佛恩国恩，遂西来赴阙
  - date: 0986
    title_zh: 受朝散大夫试鸿胪卿号而仍守译业
    rationale: 以官禄为弘法之助而不恋荣宠，立志但以多译经典为究竟
- id: guji-法天-endeavor-2
  title_zh: 译弘金刚大教宝王经
  summary: 译出最上大乘金刚大教宝王经上下二卷，宣演金刚乘四乘判教与菩萨四无量心，广传灌顶三昧
  phases:
  - key: brewing
    name: 取梵本审密教仪
    labels:
