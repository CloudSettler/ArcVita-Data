  archetype: 译经三藏
  dilemmas:
  - 梵本精微而华言难尽，如何令陀罗尼音义双存
  - 身为西域僧而处宋译场，如何调和师承与诏定体例
  - 密教修持重在受持流通，如何使经文简要易持而功德具足
  lesson: 以音正为信，以译正为慈，使异域密法得入中土持诵
  summary_first_person: 吾本中印度摩伽陀国那烂陀寺僧，奉佛顶法门而来宋，入译经院参译群经，别译最胜佛顶陀罗尼，愿众生受持清净，得诸如来加持护念。
