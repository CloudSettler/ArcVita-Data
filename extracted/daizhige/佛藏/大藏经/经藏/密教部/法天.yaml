  - key: climax
    name: 演说金刚乘摄一切乘
    labels:
      zh: 高潮
    start_date: 0984
    highlight_event_id: guji-法天-event-translate-baowang
  - key: closure
    name: 付嘱阿阇梨护持
    labels:
      zh: 收束
    start_date: '1001'
    highlight_event_id: guji-法天-event-death
  decisions:
  - date: 0984
    title_zh: 先明四乘后显金刚最上
    rationale: 为破大小偏执，先立声闻缘觉方广大乘为阶梯，方显发大菩提心即金刚乘性
  - date: 0984
    title_zh: 详译灌顶承事阿阇梨轨则
    rationale: 恐佛灭后邪解横生，故备载八种承事与十八空真谛，令学者敬师持戒证无生忍
