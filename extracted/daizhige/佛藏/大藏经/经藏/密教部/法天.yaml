  - 梵汉悬隔而圣旨督译，如何存密教仪轨之真又使华人可解可行
  - 显密大小乘并陈于世，如何显金刚大乘摄一切乘而不谤余乘
  lesson: 以信奉诏以译载道，令金刚大乘慈悲喜舍之行普利华夏
  summary_first_person: 吾本西天来华之僧，蒙宋帝诏入译经院，授朝散大夫试鸿胪卿传教大师之职，与天息灾施护等共译显密诸经，尤弘最上大乘金刚大教，使无生法忍与灌顶三昧流布中土，毕生以翻译为佛事
