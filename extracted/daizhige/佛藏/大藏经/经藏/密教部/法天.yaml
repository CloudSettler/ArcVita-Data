events:
- id: guji-法天-event-birth
  date: '0950-01-01'
  year_of: 950
  title_zh: 生于中印度摩伽陀国
  description: 生于摩伽陀国，后于那烂陀寺出家习三藏，精通梵本显密经论。
  event_type: birth
- id: guji-法天-event-arrive
  date: '0980-01-01'
  year_of: 980
  title_zh: 至开封入译经院
  description: 太平兴国中与天息灾等至京师，入译经院为证义，赐紫，初名法贤，后赐名法天。
  event_type: career
- id: guji-法天-event-translate
  date: '0984-01-01'
  year_of: 984
  title_zh: 译出最胜佛顶陀罗尼经
  description: 于京师译出最胜佛顶陀罗尼经一卷，具译根本真言八十八句，阐述净障增寿灭罪成佛功德。
  event_type: career
- id: guji-法天-event-death
  date: '1001-01-01'
  year_of: 1001
  title_zh: 卒于开封
  description: 咸平四年示寂于开封译经院，一生译经二十余部，密教陀罗尼多出其手。
