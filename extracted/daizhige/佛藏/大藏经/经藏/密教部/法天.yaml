  dilemmas:
  - title_zh: 梵汉悬隔当存音或显义
    description: 陀罗尼贵存梵音方具持诵功德若直译其义则失密意若纯存音则中土难解须音义兼顾以全信解行证
  - title_zh: 奉诏入华当守西天师承或就中土机宜
    description: 既为西天译经三藏又奉宋帝诏命既须严守戒律仪轨正其梵音又须令君臣士庶生信受持弘多罗救护法门
  lesson: 以音声存真以慈悲摄物译场即是道场令水陆众生离黑暗得光明
  summary_first_person: 吾法天西天人也蒙宋帝诏入译场授传教大师与天息灾等共译显密归命多罗大菩萨独译一百八名陀罗尼经愿以慈光普照十方令众生离怖得涅槃彼岸
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/密教部/圣多罗菩萨一百八名陀罗尼经.html
  - https://cbetaonline.dila.edu.tw/zh/T1105
