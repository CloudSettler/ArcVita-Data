  era: 北宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 译经弘法者
  dilemmas:
  - 梵本密义幽深而汉文贵在显畅，如何传译不失空智金刚本义
  - 仪轨威猛方便易生疑谤，如何以戒律与慈悲摄持令行者正信修持
  lesson: 以胜慧为体以大悲为用，译经弘法当令空智不离慈悲仪轨不违清净
  summary_first_person: 我是法护，西天来华译经僧，奉宋诏入译经院，专译密教仪轨，以大悲空智金刚之教开示中土，愿以胜慧方便成熟三有
  source_urls:
  - https://tripitaka.cbeta.org/T08n0892
  - https://kanripo.org/text/KR6j0060/
