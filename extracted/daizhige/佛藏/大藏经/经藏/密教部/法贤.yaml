  decisions:
  - date: 0990
    title_zh: 奉诏译灭除五逆罪大陀罗尼经
    rationale: 悯重罪众生无所依怙，故以密咒方便令其灭障
  - date: 0991
    title_zh: 明示顶戴受持获千佛功德
    rationale: 欲令闻者发至诚心尽形受持，故举大功德以劝信
