  - title_zh: 密咒重音而华夏异读
    description_zh: 陀罗尼以音声为用，华夏语音参差，如何以对音切韵存其神效延众生寿慧
  lesson: 以诚承诏以敬存真，译经弘咒皆在延续佛慧命
  summary_first_person: 我是法贤，西天来华译经僧，蒙宋圣诏入译经院，授明教大师，毕生参译独译显密诸典，以无量寿大智陀罗尼愿延众生慧命
