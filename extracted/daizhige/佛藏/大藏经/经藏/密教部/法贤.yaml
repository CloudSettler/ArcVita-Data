    description: 密咒以梵音存真，以汉语易持，音义难两全而须定例
  - title_zh: 济贫与持戒之衡
    description: 宝贤法许供给财宝爱敬成就，唯除淫怒痴邪行，须立洁净持戒诵持之法
  lesson: 以信重译秘密真言，安乐贫苦众生，显翻译即慈悲利他行
  summary_first_person: 我法贤自西天来，蒙诏入宋译经院，授朝散大夫试光禄卿明教大师，专任梵汉传译，所译宝贤陀罗尼经，愿持诵者衣食财宝供给，诸事吉祥，爱敬成就
