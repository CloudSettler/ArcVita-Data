  kind: birth
  description_zh: 约十世纪中叶生于中印度，幼习梵文显密，立志东行传法
- id: guji-法贤-event-arrive
  title_zh: 赴华入译经院
  date: 0980
  year_of: 980
  kind: achievement
  description_zh: 宋太平兴国中随西僧东来，入西天译经院参译，与施护等共襄译事
- id: guji-法贤-event-dharani
  title_zh: 译出无量寿大智陀罗尼
  date: 0989
  year_of: 989
  kind: achievement
  description_zh: 奉诏独译佛说无量寿大智陀罗尼，具题那谟婆誐嚩帝等咒句，署西天译经三藏朝散大夫试光禄卿明教大师臣法贤奉诏译
- id: guji-法贤-event-honor
  title_zh: 授明教大师显秩
