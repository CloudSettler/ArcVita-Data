  - date: 0985
    title_zh: 直承天说略为宣扬星曜因缘
    rationale: 恐世人不晓生时宫宿所感善恶，故详译羊牛等十二宫形貌寿夭以示因果
  - date: 0986
    title_zh: 存梵音兼畅华言示吉曜延寿
    rationale: 经言夭难时遇吉曜临照可变恶为善延寿，欲令人生信修善故两存其义
events:
- id: guji-法贤-event-birth
  date: 0950
  year_of: 950
  title_zh: 生于天竺
  description: 法贤生于西天，习梵本佛法，后随兄法天东来
- id: guji-法贤-event-enter-translation
  date: 0982
  year_of: 982
  title_zh: 太平兴国中入宋译经院
  description: 宋太宗太平兴国七年左右，与法天施护同充译经三藏，授朝散大夫试光禄卿明教大师
- id: guji-法贤-event-zhilun
  date: 0985
  year_of: 985
  title_zh: 奉诏译难儞计湿嚩啰天说支轮经
  description: 奉诏译出此经，述难儞计湿嚩啰天普观男女宫宿善恶，详列十二宫主曜所直星宿及形貌福禄寿夭，又说二十七宿分摄天罗刹人三趣
- id: guji-法贤-event-death
  date: '1001'
  year_of: 1001
  title_zh: 咸平四年示寂
  description: 宋真宗咸平四年卒于京师，毕生译经数十部，支轮经遂流通中土
