person:
  qid: guji-法贤
  name_zh: 法贤
  names:
    zh: 法贤
    en: Dharmabhadra
  lifespan:
    birth:
      date: 0950
      precision: year
      is_circa: true
      raw: 西天人，生年不详，约十世纪中叶生
    death:
      date: '1001'
      precision: year
      is_circa: false
      raw: 宋真宗咸平四年卒
  birth_date: 0950
  death_date: '1001'
  era: 北宋
  reign_ref: 宋太祖至宋真宗太平兴国至咸平
  archetype: 译经弘法者
  dilemmas:
  - title_zh: 梵汉悬隔信解难通
    description: 秘密之义浅识难信难解，译笔稍误即成谤法，如何令简易可持而义无谬误
  - title_zh: 去留羁旅奉诏难违
    description: 西天故土在远，东土诏命在近，西归旧里还是久住译场以毕残生
  lesson: 以至诚译秘密，以简易利群生，能令难信者信即是弘法
  summary_first_person: 吾法贤，西天人也，奉宋诏入译经院为三藏，译秘密八名陀罗尼等经，愿众生受持读诵，消无间业，不堕地狱，得生兜率，吾虽异域之人，得毕命于译场，幸矣
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E4%BD%9B%E8%AF%B4%E7%A7%98%E5%AF%86%E5%85%AB%E5%90%8D%E9%99%80%E7%BD%97%E5%B0%BC%E7%BB%8F.html
