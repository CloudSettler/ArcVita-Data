  decisions:
  - date: 0989
    title_zh: 以切韵标注咒音
    rationale: 华梵音异易失真，故用反切引声细注，务存陀罗尼本音神效
  - date: 0991
    title_zh: 受明教大师仍勤弘化
    rationale: 虽膺显秩不忘本愿，坚持讲授持验，使无量寿智法深入民间
events:
