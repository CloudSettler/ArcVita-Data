endeavors:
- id: guji-法贤-endeavor-1
  title_zh: 奉诏入院译传密藏
  description: 自西天至东京，入译经院为三藏，专译金刚部等密教经典，成秘密八名陀罗尼经
  phases:
  - key: brewing
    name: 跋涉东来初居译院
    labels:
      zh: 酝酿
    start_date: 0973
    highlight_event_id: guji-法贤-event-arrive
  - key: breakthrough
    name: 试译梵汉突破悬隔
    labels:
      zh: 突破
    start_date: 0976
    highlight_event_id: guji-法贤-event-arrive
  - key: climax
    name: 译出八名陀罗尼鼎盛
    labels:
      zh: 高潮
    start_date: 0982
    highlight_event_id: guji-法贤-event-translate-mimi
  - key: closure
    name: 进封明教刊定圆满
    labels:
      zh: 收束
    start_date: 0991
    highlight_event_id: guji-法贤-event-honor
  decisions:
  - date: 0976
    title_zh: 应诏留住专任译经
    rationale: 太平兴国设译经院，诏命难违，留住方能广利东土众生，故不归西域
  - date: 0982
    title_zh: 略说金刚部秘密八名
    rationale: 众生根器狭劣难信难解，故略说象耳乃至妙色八名及陀罗尼，令易持易成
- id: guji-法贤-endeavor-2
  title_zh: 宣扬持诵功德教化
  description: 弘传受持读诵秘密八名陀罗尼者消无间业退散魔众临终见佛之功德，令四众信受奉行
  phases:
  - key: brewing
    name: 承金刚手请法酝酿
    labels:
      zh: 酝酿
    start_date: 0980
    highlight_event_id: guji-法贤-event-translate-mimi
  - key: breakthrough
    name: 宣说持诵得戒得定
    labels:
      zh: 突破
    start_date: 0982
    highlight_event_id: guji-法贤-event-translate-mimi
  - key: climax
    name: 四众欢喜信受广布
    labels:
      zh: 高潮
    start_date: 0985
    highlight_event_id: guji-法贤-event-honor
  - key: closure
    name: 以兜率往生嘱付来学
    labels:
      zh: 收束
    start_date: '1001'
    highlight_event_id: guji-法贤-event-death
  decisions:
  - date: 0982
    title_zh: 直陈消业退魔功德
    rationale: 欲令不持戒者得戒完具，非梵行者得成梵行，故明言八万四千魔众退散及七俱胝劫不堕地狱
  - date: 0985
    title_zh: 付嘱四众欢喜奉行
    rationale: 经成之后唯信受奉行方能久住，故以金刚手等及天人阿修罗欢喜作结，令教化相续
events:
- id: guji-法贤-event-birth
  title_zh: 西天出生
  date: 0950
  year_of: 950
  place_zh: 西天
  description: 生于西天，少习梵典，通持明藏，长而有志东传
- id: guji-法贤-event-arrive
  title_zh: 至宋入译经院
  date: 0973
  year_of: 973
  place_zh: 东京
  description: 随西域僧众至宋，太平兴国中入译经院，预奉诏译经之列
- id: guji-法贤-event-translate-mimi
  title_zh: 译秘密八名陀罗尼经
  date: 0982
  year_of: 982
  place_zh: 东京译经院
  description: 奉诏译出佛在舍卫国祇树给孤独园说金刚手秘密八名，自象耳至妙色，并传陀罗尼及持诵功德
- id: guji-法贤-event-honor
  title_zh: 加号明教大师试光禄卿
  date: 0991
  year_of: 991
  place_zh: 东京
  description: 以译经功加西天译经三藏朝散大夫试光禄卿明教大师，久住译场刊定梵汉
- id: guji-法贤-event-death
  title_zh: 咸平四年示寂
  date: '1001'
  year_of: 1001
  place_zh: 东京
  description: 宋真宗咸平四年卒于译事，遗言受持此经者临终得见诸佛菩萨生兜率天
