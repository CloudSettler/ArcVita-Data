    rationale: 使在家眾暫捨塵緣隨佛出家速植出世勝因故自今時至明清旦
  - date: 0751-01-01
    title_zh: 合不飲酒食肉及莊飾觀聽等為八支
    rationale: 令身口意清淨遠離放逸堪受加持故具說八事不得有犯
