  - date: '0730-03-10'
    title_zh: 先请火天后烧供诸佛菩萨
    rationale: 火为传供之口，先以印咒请火天纳受，而后所烧方能遍达圣众鬼神
  - date: '0735-08-01'
    title_zh: 依所求分别白赤黑土坛形
    rationale: 安稳用白土圆坛求寂静，富饶用赤土方坛求增益，降怨用黑土三角坛折伏，随缘施设不滥
