  - title_zh: 摄心专诵与遍供诸天
    description: 既须专心持诵不动尊真言不断，又须遍施八方诸天龙鬼，不可偏废一方
  - title_zh: 息增慈护与降伏折摄
    description: 安稳富饶须洁净慈心，降怨须忿怒运心，一卷兼载三坛，进退之间如何不失菩提心
  lesson: 以菩提心为本，借坛场护摩调伏身心，息灾增福降怨皆归降伏四魔解脱六趣
  summary_first_person: 我是火吽轨别录，一卷载不动尊持诵与火天护摩之别行仪轨，我教行者澡浴设坛，诵持真言，请火烧供，散施八方，以安稳苍生，以增益福慧，以折伏怨障，行住坐卧皆不离本尊
  source_urls:
