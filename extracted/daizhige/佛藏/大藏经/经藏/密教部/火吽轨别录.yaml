  description: 安稳于露地白土坛面向北除灾延命，富饶于赤土大坛面向东发欢喜心令诸天欢喜，降怨于黑月夜半黑土三角坛皱眉咬齿称名而烧，各依时日成就
  place_zh: 三坛道场
