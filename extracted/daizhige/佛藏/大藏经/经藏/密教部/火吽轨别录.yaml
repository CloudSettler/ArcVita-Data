    title_zh: 先诵三昧耶真言辟除结界
    rationale: 若不洒净结界，诸魔能作秽恶，故左旋辟除，右旋结界，而后请圣降集
  - date: '0725-06-15'
    title_zh: 把数珠多多益善至千遍
    rationale: 本尊相应在久久熏修，七遍为基，百遍千遍为功，行住坐卧不令闲断
- id: guji-火吽轨别录-endeavor-2
  person_qid: guji-火吽轨别录
  title_zh: 火天护摩与三坛济世
  summary: 请火天降临纳受护摩，烧苏蜜酪乳木柴谷物供养诸圣，复分安稳富饶降怨三坛随月日时节作法
