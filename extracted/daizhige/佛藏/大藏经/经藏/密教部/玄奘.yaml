  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐
  reign_ref: 唐太宗贞观至唐高宗麟德
  archetype: 西行求法译经大师
  dilemmas:
  - 佛典异说纷纭而无从质正，发愿西行求本穷源
  - 违禁出关孤旅险绝，生死莫测而持戒不退
  - 梵本浩瀚译场事繁，欲忠信达兼全而精力有限
  lesson: 以大悲愿力求真证真，以精勤译述利乐有情
  summary_first_person: 吾姓陈名祎，洛州缑氏人也，少出家号玄奘，感中土经论未全而发愿西行，天竺受学十七载，归国奉诏译经，译十一面神咒心经等，弘十一面观音大悲神咒，愿众生离病障怖畏，同证菩提
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/密教部/十一面神咒心经.md
