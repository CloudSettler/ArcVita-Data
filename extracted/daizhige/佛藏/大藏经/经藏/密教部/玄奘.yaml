  - key: climax
    name: 译十一面神咒心经弘大悲咒
    labels:
      zh: 译密教观音经典
    start_date: '0650'
    highlight_event_id: guji-玄奘-event-yijing
  - key: closure
    name: 玉华正译安然圆寂
    labels:
      zh: 玉华圆寂
    start_date: '0663'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645-02-01'
    title_zh: 受诏专心传译不就爵位
    rationale: 以译经利生为己任，不恋荣禄，愿毕生忠信达以传圣言
  - date: '0650'
    title_zh: 译出十一面神咒心经
    rationale: 观自在十一面神咒威力广大，能除病障怖畏安乐有情，故应时传译流布
events:
- id: guji-玄奘-event-birth
  title_zh: 出生于洛州缑氏
  date: '0602'
  year_of: 602
  description: 隋仁寿二年生于洛州缑氏陈氏家，少聪慧出家学经
- id: guji-玄奘-event-xixing
  title_zh: 贞观三年西行出关
  date: '0629-08-01'
  year_of: 629
  description: 自长安出发，冒禁夜出玉门关，历高昌龟兹凌山铁门而往天竺
- id: guji-玄奘-event-qiufa
  title_zh: 那烂陀受学扬名五天竺
  date: '0631'
  year_of: 631
  description: 抵摩竭陀那烂陀寺师事戒贤，学瑜伽师地等，曲女城辩经折服群论
- id: guji-玄奘-event-huiguo
  title_zh: 贞观十九年东归长安
  date: '0645-01-01'
  year_of: 645
  description: 携梵本六百余部经像舍利归国，太宗亲迎，住弘福大慈恩寺专事翻译
- id: guji-玄奘-event-yijing
  title_zh: 奉诏译十一面神咒心经
  date: '0650'
  year_of: 650
  description: 于大慈恩寺奉诏译出十一面神咒心经，宣说观自在十一面根本神咒及种种事业成就法
- id: guji-玄奘-event-death
  title_zh: 麟德元年圆寂玉华宫
  date: '0664-02-05'
  year_of: 664
  description: 于玉华宫正译劳瘁示疾圆寂，遗命薄葬，高宗罢朝举哀
