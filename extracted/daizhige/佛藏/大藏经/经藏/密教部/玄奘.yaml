  summary_first_person: 我姓陈名袆，洛州缑氏人，幼慕释门，感此土经阙义乖，贞观初冒禁西行，历万里至印求法，携梵本归唐，奉诏译经，愿以诸佛心陀罗尼饶益一切怖畏者
