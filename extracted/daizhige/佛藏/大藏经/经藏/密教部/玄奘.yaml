  decisions:
  - date: '0629-08-01'
    title_zh: 贞观三年决意私行出关
    rationale: 中土经论残缺师说不一，不西行无以质正，故宁违禁令亦往求本
  - date: '0631'
    title_zh: 留学那烂陀师事戒贤
    rationale: 欲穷瑜伽唯识大义，须依正师久学，故止行取经广参深造
- id: guji-玄奘-endeavor-2
  title_zh: 长安译场译经弘法
  description: 归国后主持大慈恩玉华译场，奉诏译出大般若等及十一面神咒心经，弘十一面观音法门
  phases:
  - key: brewing
