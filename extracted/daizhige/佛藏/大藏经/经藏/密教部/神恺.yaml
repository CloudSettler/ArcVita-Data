endeavors:
- id: guji-神恺-endeavor-1
  title_zh: 辑记大黑天神供养法
  summary_zh: 采集天竺土风与吾朝伽蓝旧闻，结合野客梦事与经疏，撰成大黑天神法，详述形像咒印供养次第
  phases:
  - key: brewing
    name: 采集旧闻
    labels:
      zh: 访闻搜集
    start_date: '0740-01-01'
    highlight_event_id: guji-神恺-event-1
  - key: climax
    name: 撰成法记
    labels:
      zh: 撰述成书
    start_date: '0745-01-01'
    highlight_event_id: guji-神恺-event-1
  decisions:
  - date: '0745-01-01'
    title_zh: 引野客梦事以断疑
    rationale: 久闻诸寺安此天莫非丰饶，为断后辈之疑，故引梦事为证
  - date: '0745-06-01'
    title_zh: 详记形像咒印供养
    rationale: 令后人知黑身乌帽持袋之形与密止密止咒印，得以如法礼供
- id: guji-神恺-endeavor-2
  title_zh: 判为秘密嘱付传持
  summary_zh: 判此法为最极秘密，立不入室不传之制，嘱后学严持供养以祈伽蓝丰饶
  phases:
  - key: breakthrough
    name: 判定秘密
    labels:
      zh: 判教立制
    start_date: '0750-01-01'
    highlight_event_id: guji-神恺-event-2
  - key: closure
    name: 嘱付后学
    labels:
      zh: 付嘱流通
    start_date: '0752-01-01'
    highlight_event_id: guji-神恺-event-2
  decisions:
  - date: '0750-01-01'
    title_zh: 立不入室不传之制
    rationale: 此最秘密也，恐轻泄致渎，故云千金莫传
  - date: '0752-01-01'
    title_zh: 劝恒常供养以致丰饶
    rationale: 若日日敬供并三年专心供养，则僧众聚集官位富贵悉与，故勖后人恒供
events:
- id: guji-神恺-event-birth
  title_zh: 诞生
  date: '0700-01-01'
  year_of: 700
  place_zh: 唐土
  summary_zh: 唐世初生，后出家住嘉祥寺，习密教供养法
- id: guji-神恺-event-1
  title_zh: 撰记大黑天神法
  date: '0745-06-01'
  year_of: 745
  place_zh: 嘉祥寺
  summary_zh: 自署嘉祥寺神恺记，述大黑天为大自在天变身，记其五尺黑身乌帽持袋之像及唵密止密止舍婆隶咒印，并载每日炊饭上分三年专供得富贵之誓
- id: guji-神恺-event-2
  title_zh: 嘱付秘密不妄传
  date: '0750-12-01'
  year_of: 750
  place_zh: 嘉祥寺
  summary_zh: 于法末师云此最秘密，不入室弟子不可传受，千金莫传，并详列涂香华鬘饮食灯明念诵拨遣等供养次第以付后学
- id: guji-神恺-event-death
  title_zh: 示寂
  date: '0780-12-31'
  year_of: 780
  place_zh: 唐土
  summary_zh: 唐代后期示寂，其所记大黑天神法后经醍醐寺等传写校刊流传
