  - 佛法浇薄传尸鬼病展转流行名医不能疗当以密法救济与否
  - 辟鬼殊法为秘中极秘密妄莫传授与普救国王僧尼众生之两难
  - 鬼病须咒力深观行力业病须内观忏悔众治不得其意之抉择
  lesson: 持慈悲菩提心守静室净戒以显密兼修对治鬼业二病秘法不轻传而济世不懈
