  decisions:
  - date: 0378
    title_zh: 存梵音不尽意译
    rationale: 神咒以音声为用，义译则失验，故存梵音 transliteration，兼述断病断术之功，令持者得力。
  - date: 0380
    title_zh: 应末世难而速流通
    rationale: 经言后世国国相伐贼鬼毒害，若待太平乃传则失时，故速出经以护山林树下坐禅比丘。
events:
