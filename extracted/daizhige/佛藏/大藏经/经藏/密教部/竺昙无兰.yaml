  - date: '0345'
    title_zh: 决意东来传法
    rationale: 感中土渴仰大法，虽路远艰险，愿舍西域安适，以所学利彼四众。
  - date: '0355'
    title_zh: 显密兼弘随方设教
    rationale: 见僧俗多逢鬼毒贼难，空理难安身心，故兼弘神咒护持，令得安隐修道。
- id: guji-竺昙无兰-endeavor-2
  title_zh: 译传幻师颰陀神咒经
  description: 据梵本译出幻师颰陀所说神咒，载佛游竹园鹦鹉树间救护比丘因缘，传断术断病护僧之法。
  phases:
  - key: brewing
