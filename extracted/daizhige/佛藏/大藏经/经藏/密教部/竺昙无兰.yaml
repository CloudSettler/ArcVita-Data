  dilemmas:
  - title_zh: 梵汉悬隔音义难全
    description: 梵本神咒音韵秘妙，直译存真则中土难诵，意译显理则失持验之功，去取两难。
  - title_zh: 末世多难护持何依
    description: 后世国国相伐贼鬼毒害交侵，山林露坐比丘多被娆害，当以咒术方便护身，还是专以戒定为归，心存斟酌。
  lesson: 以慈悲为本，以方便护教，显密相资，方能安僧利世。
  summary_first_person: 我是竺昙无兰，西域三藏，值东晋世东来弘化，见佛游罗阅只竹园救护为蛇鬼贼所娆比丘，幻师颰陀说大神咒，我译传中土，愿四辈弟子山林树下露坐皆得安隐无病。
  source_urls:
