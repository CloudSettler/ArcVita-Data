    title_zh: 决定直存梵音译出咒齿经
    rationale: 齿病苦恼众生甚多，欲存梵天劝请威神，令持诵即验，故不删咒语，直译其音义
  - date: '0376-01-01'
    title_zh: 决定以归命三宝冠于咒首
    rationale: 恐俗人执咒为术，故先令归命佛法僧及大弟子，令小咒归于正信
