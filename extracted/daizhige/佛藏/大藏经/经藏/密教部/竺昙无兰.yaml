  description: 东晋初生于西域，自幼习梵文经论，尤谙咒术章句，为后译经之基。
- id: guji-竺昙无兰-event-1
  title_zh: 东来中土弘化
  date: '0350'
  year_of: '0350'
  type: 弘化
  location: 中土
  description: 跋涉东来，游化南北，宣说显密二法，见中土比丘山林坐禅多逢毒蛇鬼神劫贼之娆，发心求护持方便。
- id: guji-竺昙无兰-event-2
  title_zh: 译出幻师颰陀神咒经
  date: 0380
  year_of: 0380
  type: 译经
  location: 中土译场
  description: 译传佛游罗阅只竹园鹦鹉树间因缘，幻师颰陀随佛救护比丘说大神咒，佛诫勿伤而许护持，载诸阅叉护卫断术断病归命佛语，流通于世。
- id: guji-竺昙无兰-event-death
