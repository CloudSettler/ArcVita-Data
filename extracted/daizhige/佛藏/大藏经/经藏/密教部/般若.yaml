      zh: 入译场
    start_date: 0782
    highlight_event_id: guji-般若-event-arrive-changan
  - key: climax
    name: 译华严理趣心地观
    labels:
      zh: 广译经
    start_date: 0798
    highlight_event_id: guji-般若-event-translate-huayan
  - key: closure
    name: 以译经功德回向护国
    labels:
      zh: 回向
    start_date: 0808
    highlight_event_id: guji-般若-event-translate-huayan
  decisions:
  - date: 0798
    title_zh: 先密后显次第译弘
    rationale: 众生根器不同先以秘密摄受再以华严普贤行愿引导故显密兼弘
  - date: 0805
    title_zh: 依梵本直译存真实语
    rationale: 宁存梵音咒句不以华言改易令加持力不失而义理可解
