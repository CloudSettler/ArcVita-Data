  - key: closure
    name: 经成流通嘱累护持
    labels:
      zh: 流通
    start_date: 0790
    highlight_event_id: guji-般若-event-preach-mandala
  decisions:
  - date: 0788
    title_zh: 以菩提心月轮观为入门方便
    rationale: 化佛告言心是菩提先令行者观净满月再授金刚坚固义易入难思境故立此次第
  - date: 0789
    title_zh: 详译结印持咒仪轨不略
    rationale: 灭罪合掌缚钩会等印若阙则道场不成故悉译出令后学有所依止
- id: guji-般若-endeavor-2
  title_zh: 长安弘法译华严心地观等经续佛慧命
  goal: 融显密于一味广译大乘经律以报国恩而利群生
  phases:
  - key: brewing
    name: 罽宾习学通达三藏
