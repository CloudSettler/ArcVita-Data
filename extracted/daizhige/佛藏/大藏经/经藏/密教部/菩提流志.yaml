  dilemmas:
  - title_zh: 梵汉悬隔而义须不失
    description: 梵本浩繁华言有限，如何令密咒神变既存梵音又通华夏信解
  - title_zh: 显密兼弘而时俗多疑
    description: 处儒道并行之朝，如何令不空罥索观音大行而不起诤论
  lesson: 以不空悲智普摄群生，译经不止文字对翻，贵在令闻者植根诵者得益
  summary_first_person: 吾本南天竺婆罗门，远涉流沙而来东土，蒙武后玄宗敬礼，于崇福诸寺译大宝积及不空罥索神变真言，愿以观音罥索不空摄引，令一切有情闻即解脱持即安乐
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/密教部/不空罥索神变真言经.md
  - https://daizhige.org/佛藏/大藏经/经藏/密教部/不空罥索神变真言经.html
