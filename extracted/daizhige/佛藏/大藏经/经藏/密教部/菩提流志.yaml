    title_zh: 请以白月斋戒诵持仪轨译出
    rationale: 使极恶重罪亦可忏悔轻受，令净信者现世安稳临终往生，故详定日斋香供遍数
  - date: 0708
    title_zh: 许邪见恶辈闻即植根
    rationale: 依世间自在王如来威神及观音慈力，一经于耳即种善根，故不简机宜广令流通
