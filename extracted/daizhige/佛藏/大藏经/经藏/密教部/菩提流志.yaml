    en: Bodhiruci
  lifespan:
    birth:
      date: '0572'
      precision: year
      is_circa: true
      raw: 南天竺生，相传寿一百五十六岁，生年不详约推隋初
    death:
      date: '0727'
      precision: year
      is_circa: false
      raw: 唐玄宗开元十五年卒于洛阳
  birth_date: '0572'
  death_date: '0727'
  era: 唐
  reign_ref: 武周长寿二年至唐玄宗开元十五年
  archetype: 译经弘法者
  dilemmas:
  - 梵本浩繁而华言难契，如何既存密语神力又令中土依法可行
  - 龙神嗔恼与慈心利乐相违，如何以禁制摄伏转为誓愿守护
  lesson: 以大慈心摄持威猛方便，化灾害为守护，令翻译即是利生护国
  summary_first_person: 吾自南天竺来，蒙武后及玄宗礼敬，居崇福佛授诸寺译场，主译大宝积等经，复传金刚光焰止风雨陀罗尼护稼禳灾之法，愿以慈心调伏龙神，护持国土丰熟安乐
  source_urls:
