  decisions:
  - date: '0712'
    title_zh: 详定五方止雨四方止风真言
    rationale: 见毒龙非时风雹损稼，故具存东西南北十方章句，使随方作法皆得止息
  - date: '0712'
    title_zh: 制授水瓮坛场护摩仪轨
    rationale: 恐空诵无凭，故立涂坛置瓮搅水结界护摩之次第，令慈心观行有所依止
events:
- id: guji-菩提流志-event-birth
  kind: birth
  date: '0572'
  year_of: 572
  title_zh: 南天竺出生出家
  description_zh: 生于南印度婆罗门族，后出家习三藏，精通梵本显密经论，为西来之渐
- id: guji-菩提流志-event-arrival
  kind: career
  date: 0693
  year_of: 693
  title_zh: 长寿二年至东都洛阳
  description_zh: 应武后诏自南天竺至洛阳，敕居崇福寺佛授记寺等处，入译场主持证义，开启二十余年译业
- id: guji-菩提流志-event-dabaoji
  kind: career
  date: '0713'
  year_of: 713
  title_zh: 大宝积经译成一百二十卷
  description_zh: 与菩提留支义净等共译大宝积经，会合众部，文义周备，为唐译大部之冠，声望隆于两京
- id: guji-菩提流志-event-rain-sutra
  kind: career
  date: '0712'
  year_of: 712
  title_zh: 译金刚光焰止风雨陀罗尼经
  description_zh: 据佛为庆喜说止风雨法，译出东方南方西方北方十方止雨止风真言，兼授水瓮漫拏罗护摩结界护稼法，龙众誓愿守护
- id: guji-菩提流志-event-death
  kind: death
  date: '0727'
  year_of: 727
  title_zh: 开元十五年卒于洛阳
  description_zh: 年高德劭，卒于洛阳慈恩之属，玄宗悼惜，遗留梵汉译本及护国禳灾密法流通后世
