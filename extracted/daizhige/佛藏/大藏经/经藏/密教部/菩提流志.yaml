    title_zh: 应诏入洛居崇福寺译场
    rationale: 感武周求法之诚，愿以梵汉传译利乐中土，故不辞远涉而就译主之任
  - date: '0706'
    title_zh: 立慈心证义宗本
    rationale: 恐威猛密法滥用伤慈，故以六趣慈悲为译定衡尺，令禁伏转为守护
- id: guji-菩提流志-endeavor-2
  title_zh: 译传止风雨护稼密法
  summary_zh: 据摩伽陀途中遇黑云暴风雨因缘，传出五方止雨四方止风根本心真言并坛场护摩结界法，护持苗稼花果
