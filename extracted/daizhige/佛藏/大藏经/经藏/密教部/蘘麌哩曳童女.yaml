  summary_first_person: 我是观自在菩萨化身童女住雪山北香醉山以鹿皮为衣以毒蛇为璎珞与毒虫虎狼为伴饮毒果食毒草而得销伏毒害大真言我以此咒饶益有情令人闻咒念名远离诸毒常持者内外毒灭恶兽不害恶疮即差愿众生受持流布永得安隐
