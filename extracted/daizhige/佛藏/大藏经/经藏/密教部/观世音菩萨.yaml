  name_zh: 观世音菩萨
  names:
    zh: 观世音菩萨
    en: Avalokitesvara Ekadasamukha
  lifespan:
    birth:
      date: -5000-01-01
      precision: year
      is_circa: true
      raw: 恒河沙数劫前为持咒仙人王时得咒证忍
    death:
      date: 9999-12-31
      precision: year
      is_circa: true
      raw: 不入涅槃常住救护众生
  birth_date: -5000-01-01
  death_date: 9999-12-31
  era: 佛教传说时代
  reign_ref: 释迦牟尼佛住王舍城耆阇崛山时
  archetype: 大悲救护者
  dilemmas:
  - 如何以一心咒普除众生病难障难横死恶梦而不昧宿殃因果
  - 如何令持咒造像行道者既得现世安隐又发无上菩提之心
  lesson: 以大慈悲说持神咒救护苦难，兼引众生发无上菩提心。
  summary_first_person: 我是观世音，于百莲华眼顶佛所为持咒仙人王时得十一面心咒，十方诸佛现前即证无生忍，后于曼陀罗香如来所为优婆塞时复得此咒，今于王舍城承佛神力说之，愿昼夜受持造像行道者离病怖横死，得十方佛念，命终生无量寿国，究竟成就菩提。
  source_urls:
