endeavors:
- id: guji-观世音菩萨-endeavor-1
  title_zh: 于王舍城宣说十一面心咒
  summary: 在耆阇崛山对佛陈说十一面心咒来历功德，承佛印可说根本咒及咒水咒衣咒香咒华咒食咒火结界等随用诸咒，许昼夜诵持者得现身十报后世四报。
  phases:
  - key: brewing
    name: 古佛所得证忍
    labels:
      zh: 持咒仙人王得法
    start_date: -5000-01-01
    highlight_event_id: guji-观世音菩萨-event-obtain
  - key: breakthrough
    name: 王舍城请说利生
    labels:
      zh: 为一切众生说咒缘起
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-vulture
  - key: climax
    name: 承佛印可说根本咒
    labels:
      zh: 十一亿佛所说付嘱
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-dharani
  - key: closure
    name: 付嘱受持功德
    labels:
      zh: 离病破敌生无量寿国
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-dharani
  decisions:
  - date: -0520-01-01
    title_zh: 先陈得咒证信因缘后说咒本
    rationale: 以十方佛现前无生忍及超四万劫生死事，明此咒为一切佛所念所说，令众生起决定信而受持。
  - date: -0520-01-01
    title_zh: 承佛神力说咒并广说受持功德
    rationale: 既蒙佛印可，当为一切众生除病横障难恶梦怖畏，满其所愿并引发无上菩提心。
- id: guji-观世音菩萨-endeavor-2
  title_zh: 开示造像道场满愿除障法
  summary: 开示白旃檀十一面像造法与月半十五日道场仪轨，及月蚀酥治病芥子除疫结索除狂熏香逐鬼等随事治病禳灾满愿法门。
  phases:
  - key: brewing
    name: 示十一面像式
    labels:
      zh: 白旃檀造像庄严
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-image
  - key: breakthrough
    name: 立道场行道
    labels:
      zh: 十五日斋戒诵咒供养
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-image
  - key: climax
    name: 像动满愿
    labels:
      zh: 佛面出声授四愿
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-image
  - key: closure
    name: 别行治病禳灾
    labels:
      zh: 咒水咒索咒火除障
    start_date: -0520-01-01
    highlight_event_id: guji-观世音菩萨-event-dharani
  decisions:
  - date: -0520-01-01
    title_zh: 详示像式与道场仪轨
    rationale: 使行者有依可修，以香华幡盖沉水火供千八段花供，感像动佛面出声而满腾空无碍等四愿。
  - date: -0520-01-01
    title_zh: 开示随病随难别行治法
    rationale: 寒热鬼打蛇螫风病疫病怨敌厌祷各有咒水咒索咒火之法，令众生即事得救而信解大悲救护之力。
events:
- id: guji-观世音菩萨-event-birth
  title_zh: 示现为大持咒仙人中王
  date: -5000-01-01
  year_of: -5000
  place: 百莲华眼顶无障碍功德光明王如来所
  description: 于彼佛所得十一面心咒，十方诸佛现前即得无生法忍。
- id: guji-观世音菩萨-event-obtain
  title_zh: 于二古佛所得神咒超生死际
  date: -5000-01-01
  year_of: -5000
  place: 百莲华眼顶佛所及曼陀罗香如来所
  description: 初为仙人王得咒证忍，后为优婆塞复得此咒，于四万劫超生死际，得大慈大悲智慧藏法门。
- id: guji-观世音菩萨-event-vulture
  title_zh: 王舍城耆阇崛山请说利生
  date: -0520-01-01
  year_of: -520
  place: 王舍城耆阇崛山
  description: 与持咒贤圣围绕诣佛所，白佛为一切众生说十一面心咒，欲令念善法无忧恼除病障横死调柔恶心。
- id: guji-观世音菩萨-event-dharani
  title_zh: 承佛印可说根本咒及随用诸咒
  date: -0520-01-01
  year_of: -520
  place: 王舍城耆阇崛山
  description: 蒙佛印可偏袒合掌说根本大咒，次说咒水咒衣咒香咒华咒食咒火结界等法，许诵满百八遍者得十种现报四种后报。
- id: guji-观世音菩萨-event-image
  title_zh: 开示十一面像造法与道场满愿
  date: -0520-01-01
  year_of: -520
  place: 王舍城耆阇崛山道场
  description: 教以白旃檀作一尺三寸十一面像，十四十五日行道然檀火掷千八沉水段，感像动顶佛出声授腾空无碍等四愿，兼示散花雷声乞愿及除疫结索等法。
- id: guji-观世音菩萨-event-death
  title_zh: 不入涅槃常住救护
  date: 9999-12-31
  year_of: 9999
  place: 无量寿国及十方众生处
  description: 许称名持咒造像行道者现离苦恼障难怖畏，临终见十方佛，不堕地狱，不为禽兽所害，命终生无量寿国。
