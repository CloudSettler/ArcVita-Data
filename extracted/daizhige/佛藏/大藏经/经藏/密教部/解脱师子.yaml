  decisions:
  - date: '0723'
    title_zh: 先发慈悲菩提心方作护摩
    rationale: 若不发安忍慈悲求无上觉，世法成就则违本誓，故以菩提心摄四法
  - date: '0725'
    title_zh: 以白檀苏蜜等表法随类施设
    rationale: 随顺众生性欲，以炉形时节烧物差别，令息增怀伏各得相应成就
