  decisions:
  - date: 0718
    title_zh: 以三道真言摄全轨
    rationale: 以大心外加持根本想内小心内外通为纲，令行者存心无错乱而入明王地
  - date: '0720'
    title_zh: 略出密印诫勿错传
    rationale: 莲华部秘密甚深，恐浅机谬传，故略说印相并诫护如眼目，令圣者欢喜善神守护
- id: guji-解脱师子-endeavor-2
  title_zh: 开示莲华部四种护摩成就法
  summary: 开示息灾增益随心忆念降伏四法，摄除病延寿聪明宿命及调伏怨敌等世出世悉地
  phases:
