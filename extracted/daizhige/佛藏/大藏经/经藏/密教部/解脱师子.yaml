      raw: 唐玄宗开元末天宝初约寂
  birth_date: 0680
  death_date: '0740'
  era: 唐
  reign_ref: 唐玄宗开元
  archetype: 密教译师
  dilemmas:
  - title_zh: 秘密深奥当护持对慈悲普摄当宣说
    description: 莲华部三昧耶甚深不可错传，又不忍众生无怙，故略出次第而诫护如眼目
  - title_zh: 世间悉地速效对出世种智究竟
    description: 息灾增益爱敬降伏易动人心，须以发无上菩提心摄持，令不乐二乘而趣一切种智
  lesson: 守清净三昧耶，依大心根本小心三道次第念诵，世出世法皆可成就
  summary_first_person: 我是解脱师子，唐时译出都表如意摩尼转轮圣王次第念诵秘密最要略法，立大心根本小心三真言次第，兼说息灾增益随心降伏四法，愿行者护持三昧耶勤修不懈
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/密教部/都表如意摩尼转轮圣王次第念诵秘密最要略法.md
