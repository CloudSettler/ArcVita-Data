  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E5%AF%86%E6%95%99%E9%83%A8/%E6%91%84%E5%A4%A7%E6%AF%97%E5%8D%A2%E9%81%AE%E9%82%A3%E6%88%90%E4%BD%9B%E7%A5%9E%E5%8F%98%E5%8A%A0%E6%8C%81%E7%BB%8F%E5%85%A5%E8%8E%B2%E5%8D%8E%E8%83%8E%E8%97%8F%E6%B5%B7%E4%BC%9A%E6%82%B2%E7%94%9F%E6%9B%BC%E8%8D%BC%E6%94%9E%E5%B9%BF%E5%A4%A7%E5%BF%B5%E8%AF%B5%E4%BB%AA%E8%BD%A8%E4%BE%9B%E5%85%BB%E6%96%B9%E4%BE%BF%E4%BC%9A.html
endeavors:
- id: guji-输婆迦罗-endeavor-1
  title_zh: 奉诏东来与一行合译大日经王
  summary_zh: 自天竺历西域入长安，住大兴善寺，授法弟子一行笔授宝月译语，译出大毗卢遮那成佛神变加持经，奠定胎藏界密教经轨之基。
  phases:
  - key: brewing
    name: 天竺习密与发心东弘
    labels:
      zh: 酝酿
    start_date: '0637'
    highlight_event_id: guji-输婆迦罗-event-birth
  - key: breakthrough
    name: 渡海入唐至长安
    labels:
      zh: 突破
    start_date: '0716'
    highlight_event_id: guji-输婆迦罗-event-arrival
  - key: climax
    name: 大兴善寺开译经王
    labels:
      zh: 高潮
    start_date: '0724'
    highlight_event_id: guji-输婆迦罗-event-translation
  - key: closure
    name: 经成流通付嘱奉持
    labels:
      zh: 收束
    start_date: '0725'
    highlight_event_id: guji-输婆迦罗-event-translation
  decisions:
  - date: '0716'
    title_zh: 应请入唐弘密
    rationale: 为令东土众生得闻秘密神变加持，不辞海陆艰辛东行长安
  - date: '0724'
    title_zh: 择一行笔授宝月译语
    rationale: 一行聪慧通悉阴阳历数，宝月娴梵汉音义，合作方能准显经王义轨
- id: guji-输婆迦罗-endeavor-2
  title_zh: 建立悲生曼荼罗与念诵供养仪轨
  summary_zh: 依大日经王说其次第真言法，制入莲华胎藏海会悲生曼荼罗广大念诵仪轨，详陈礼佛忏悔归依发心，三昧耶法界生印明，布坛献涂香华烧香饮食灯明阏伽之方便。
  phases:
  - key: brewing
    name: 观察机宜立供养次第
    labels:
      zh: 酝酿
    start_date: '0724'
    highlight_event_id: guji-输婆迦罗-event-translation
  - key: breakthrough
    name: 宣说三昧耶法界生等印明
    labels:
      zh: 突破
    start_date: '0725'
    highlight_event_id: guji-输婆迦罗-event-ritual
  - key: climax
    name: 广说悲生曼荼罗布坛念诵
    labels:
      zh: 高潮
    start_date: '0726'
    highlight_event_id: guji-输婆迦罗-event-ritual
  - key: closure
    name: 付嘱护持令速成就
    labels:
      zh: 收束
    start_date: '0735'
    highlight_event_id: guji-输婆迦罗-event-death
  decisions:
  - date: '0725'
    title_zh: 先明礼忏归依发心后入正念诵
    rationale: 欲令行者本心离垢身口意净，方堪入佛三昧耶受加持成就
  - date: '0726'
    title_zh: 制大菩提幢密印标帜曼荼罗仪轨
    rationale: 以如来庄严具同法界幖帜严身，使处生死巡历诸趣而不染，度人天无量众
events:
- id: guji-输婆迦罗-event-birth
  title_zh: 生于中天竺摩揭陀
  date: '0637'
  year_of: 637
  description_zh: 唐贞观十一年生于中天竺，刹帝利种，少出家习显密两教，通达胎藏苏悉地法。
- id: guji-输婆迦罗-event-arrival
  title_zh: 奉诏至长安住大兴善寺
  date: '0716'
  year_of: 716
  description_zh: 唐睿宗景云末开元初至长安，上礼遇优渥，敕住大兴善寺，开始传授密法灌顶。
- id: guji-输婆迦罗-event-translation
  title_zh: 与一行合译大毗卢遮那成佛神变加持经
  date: '0725'
  year_of: 725
  description_zh: 开元十二三年间，与弟子一行笔授宝月译语，译出大日经七卷，兼出供养方便会仪轨。
- id: guji-输婆迦罗-event-ritual
  title_zh: 说入莲华胎藏海会念诵供养仪轨
  date: '0726'
  year_of: 726
  description_zh: 依经王说供养所资众仪轨，详示涂香华烧香饮食灯明阏伽印明及降魔护身五轮观行，成次第真言法。
- id: guji-输婆迦罗-event-death
  title_zh: 寂于洛阳大福先寺
  date: '0735'
  year_of: 735
  description_zh: 唐开元二十三年十月寂于洛阳，寿九十九，谥大弘教三藏，建塔立碑，密教付法慧琳等门人。
