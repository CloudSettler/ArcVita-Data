    en: Subhakarasimha
  lifespan:
    birth:
      date: '0637'
      precision: year
      is_circa: false
      raw: 唐贞观十一年生于中天竺摩揭陀
    death:
      date: '0735'
      precision: year
      is_circa: false
      raw: 唐开元二十三年寂于东都洛阳
  birth_date: '0637'
  death_date: '0735'
  era: 唐
  reign_ref: 唐玄宗开元
  archetype: 译经弘法者
  dilemmas:
  - 梵密渊广而华土初机难契弘传当求善巧方便
  - 王命翻译与持戒修证之间当守清净三业与慈悲利生
  - 密法择器而付与普令群生入悉地之间当立次第仪轨
  lesson: 以清净三业为基以菩提心为帅依法次第念诵供养则能入莲华胎藏海会
  summary_first_person: 我是中天竺输婆迦罗，号善无畏，少习显密，奉诏东来大唐，住大兴善寺，与一行宝月等合译大毗卢遮那成佛神变加持经，并说入莲华胎藏海会悲生曼荼罗广大念诵供养仪轨，立三昧耶法界生金刚萨埵等印明，教人忏悔归依发心布坛献供，以助众生此生入悉地离垢成佛。
