  title_zh: 菩提树下成道
  date: -528-12-08
  year_of: -528
  place_zh: 菩提伽耶菩提树下
  description: 降伏魔军，夜睹明星，成无上正等菩提，具大慈悲，堪为天人师
- id: guji-释迦牟尼-event-first-sermon
