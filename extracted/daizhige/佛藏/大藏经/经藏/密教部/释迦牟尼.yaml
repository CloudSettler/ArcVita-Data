    labels:
      zh: 树下安坐
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: climax
    name: 独对亿万魔军全胜
    labels:
      zh: 降魔全胜
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: closure
    name: 成就正觉身语意密
    labels:
      zh: 成道圆满
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  decisions:
  - date: '-528'
    title_zh: 不著甲胄独坐菩提树下
    rationale: 以慈慧为兵，不依世间器仗，示现大勇以降伏内心及外魔
  - date: '-528'
    title_zh: 以仁慈火煎欲天心而不舍慈海
    rationale: 于亲疏平等持守，令调伏事业归于利生而非摧毁
- id: guji-释迦牟尼-endeavor-2
  title_zh: 转法轮导引五浊众生
  summary: 为利众生丝毫无倦，随疑示现身语，同时断惑，摄受五浊恶世所弃众生
  phases:
  - key: brewing
    name: 观察百千人天成熟
    labels:
      zh: 观察机缘
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: breakthrough
    name: 光现千辐施展神变
    labels:
      zh: 示现摄受
    start_date: '-527'
    highlight_event_id: guji-释迦牟尼-event-first-sermon
  - key: climax
    name: 随众疑义同时示现身语
    labels:
      zh: 普应群机
    start_date: '-527'
    highlight_event_id: guji-释迦牟尼-event-first-sermon
  - key: closure
    name: 五浊境中全持不舍
    labels:
      zh: 浊世摄持
    start_date: '-483'
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: '-527'
    title_zh: 以一音普答同时示现
    rationale: 令所有世界众生一时禀义各得开解，断除诸惑
  - date: '-527'
    title_zh: 于他尊弃时坚持摄受
    rationale: 怜悯卑下，不弃五浊杂境，直如白莲出泥而持正教吉祥
events:
- id: guji-释迦牟尼-event-birth
  date: '-563'
  year_of: -563
  title_zh: 蓝毗尼园诞生
  description: 释迦族王子生于蓝毗尼园，金光朗耀具威德身，为后成导引众生之本
- id: guji-释迦牟尼-event-renunciation
  date: '-544'
  year_of: -544
  title_zh: 逾城出家修行
  description: 因昔修善业观察众生苦，舍宫廷安乐而修菩提，积集成道之因
- id: guji-释迦牟尼-event-enlightenment
  date: '-528'
  year_of: -528
  title_zh: 菩提树下将降魔成道
  description: 菩提树下英勇而坐，以慈慧兵镇魔君，不著甲胄独胜亿万魔阵，成就清明心
- id: guji-释迦牟尼-event-first-sermon
  date: '-527'
  year_of: -527
  title_zh: 初转法轮普应群机
  description: 光现千辐遍满虚空，随众生疑义同时示现身语，令睹面闻声忆念者悉不空过
- id: guji-释迦牟尼-event-death
  date: '-483'
  year_of: -483
  title_zh: 拘尸那罗入般涅槃
  description: 圣教显明如日光后，于娑罗林示现入灭，嘱持教相和如兄弟，愿正教恒吉祥
