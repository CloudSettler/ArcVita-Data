    en: Shakyamuni Buddha
  lifespan:
    birth:
      date: -563-04-08
      precision: day
      is_circa: true
      raw: 周昭王二十四年甲寅四月初八生于蓝毗尼园
    death:
      date: -483-02-15
      precision: day
      is_circa: true
      raw: 周敬王三十七年二月十五入涅槃于拘尸那揭罗
  birth_date: -563-04-08
  death_date: -483-02-15
  era: 春秋晚期
  archetype: 觉者导师
  dilemmas:
  - 王宫安乐与生老病死大苦之间的去留抉择
  - 自求解脱安乐与普度六趣饿鬼苦难之间的悲愿权衡
  lesson: 以无缘大悲破除悭贪，以清凉甘露救济饿鬼饥火，令众生同得解脱
  summary_first_person: 我是释迦牟尼，生于释迦族，睹生老病死苦而逾城出家，菩提树下成等正觉，后住孤陀山金刚轮峰海会，为月爱菩萨宣说施饿鬼甘露味大道场会陀罗尼，开咽喉，施浆食，愿碎地狱饿鬼业山，令一切含识饱满安乐速证菩提
  source_urls:
