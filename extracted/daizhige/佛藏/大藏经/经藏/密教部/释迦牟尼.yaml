- id: guji-释迦牟尼-event-ganlu-preach
  title_zh: 孤陀山宣说施饿鬼甘露味法
  date: -528-07-15
  year_of: -528
  place_zh: 孤陀山金刚轮峰嚧鸡舍婆罗道场
  description: 放月爱慈光照六趣，应月爱菩萨请，说召请开咽喉施甘露浆食陀罗尼及曼荼罗火供仪轨，天地震动，罪具摧坏，众得果证
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那揭罗入涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那揭罗娑罗双树间
  description: 化缘既毕，右侧而卧，入般涅槃，付嘱弟子以戒为师，依法修行
