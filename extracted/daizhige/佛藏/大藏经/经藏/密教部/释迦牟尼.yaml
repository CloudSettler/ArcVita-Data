  decisions:
  - date: -528-07-15
    title_zh: 愍念恶趣演说甘露味法
    rationale: 见饿鬼咽如针锋猛火烧身，父母兄弟皆堕其中，故以大悲开秘密善门，碎其业山
  - date: -528-07-16
    title_zh: 制立召请施食仪轨
    rationale: 令后世比丘俗人皆能以咒开咽喉，以乳酪净水普施，使十方饿鬼饱满解脱速证菩提
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼园诞生
  date: -563-04-08
  year_of: -563
  place_zh: 蓝毗尼园
  description: 释迦族净饭王之子，生于无忧树下，天龙灌沐，示现不失人身修行本缘
