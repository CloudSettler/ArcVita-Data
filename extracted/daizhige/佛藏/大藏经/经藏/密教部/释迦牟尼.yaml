  dilemmas:
  - 以慈悲不执兵器而独对亿万魔军之难
  - 以甚深身语意密理而欲普令群生同解之难
  - 于五浊恶世他尊舍弃处坚持摄受之难
  lesson: 以慈慧为兵镇伏群魔，以平等大悲导引众生，见闻忆念悉令不空
  summary_first_person: 我于菩提树下端坐，以慈慧之力降伏魔军，不著甲胄而全胜，复以清净身语意导引众生，愿于五浊恶世常持不舍，令众生睹我面即得解脱
