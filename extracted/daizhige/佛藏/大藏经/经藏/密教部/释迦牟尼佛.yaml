  - date: -534-02-08
    title_zh: 逾城出家
    rationale: 睹老病死及沙门，厌离宫欲，为求出离生死故舍国出家
  - date: -529-08-15
    title_zh: 舍苦行受乳糜
    rationale: 知苦行非道，形枯心昏不能得定，当以中道调身方能证慧
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 转法轮说陀罗尼普济群生
  summary_zh: 鹿野苑初转法轮度五比丘，后说金光照曜大陀罗尼，消幽冥滞碍，令众超凡入圣疾成佛道
