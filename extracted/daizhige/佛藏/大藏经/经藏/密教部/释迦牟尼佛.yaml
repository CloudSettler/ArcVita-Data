  - date: -527-05-15
    title_zh: 应梵天请转法轮
    rationale: 悯众生有可化机，不忍独证寂灭，欲以四谛开示令离苦海
  - date: -524-03-15
    title_zh: 说乌稣耆昼腻多大陀罗尼
    rationale: 为消三界幽冥隐滞拔其危难，令闻者往生善处，未发心者发心，已发心者疾至佛地
events:
- id: guji-释迦牟尼佛-event-birth
  title_zh: 蓝毗尼园降生
  date: -563-04-08
  year_of: -563
  place_zh: 迦毗罗卫蓝毗尼园
  description_zh: 摩耶夫人产太子悉达多，生时七步莲花，天龙注水灌顶
- id: guji-释迦牟尼佛-event-enlightenment
  title_zh: 菩提树下成道
  date: -528-12-08
  year_of: -528
  place_zh: 伽耶菩提树下
  description_zh: 降伏魔军，夜睹明星悟缘起，证无上菩提号释迦牟尼佛
- id: guji-释迦牟尼佛-event-first-sermon
  title_zh: 鹿野苑初转法轮
  date: -527-05-15
  year_of: -527
  place_zh: 波罗奈鹿野苑
  description_zh: 为憍陈如等五比丘说四谛法，三转十二行，始立僧宝
- id: guji-释迦牟尼佛-event-dharani
  title_zh: 说金光照曜大陀罗尼
  date: -524-03-15
  year_of: -524
  place_zh: 舍卫国说法会中
  description_zh: 说乌稣耆昼腻多神咒，谓过去九十九亿佛所说，能令幽隐罪垢闻音消灭，行者持戒忏悔诵持得灭重罪见佛授记
- id: guji-释迦牟尼佛-event-death
  title_zh: 拘尸那罗般涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那罗娑罗双树间
  description_zh: 说法四十九年化缘已毕，于双树间入般涅槃，付嘱正法流通
