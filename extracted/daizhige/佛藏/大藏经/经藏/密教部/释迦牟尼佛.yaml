  dilemmas:
  - 宫廷安乐与老病死苦逼迫之间何去何从
  - 苦行折磨与中道觉悟之间如何抉择
  - 默然入灭与住世弘化之间如何取舍
  lesson: 以中道智慧自觉觉他，慈悲普济，拯拔众生幽冥厄难
  summary_first_person: 我是乔达摩悉达多，见老病死苦而逾城出家，雪山苦行，菩提树下证悟，于鹿野苑初转法轮，后以金光照曜大陀罗尼拔济三界幽隐众生，令发菩提直至佛地
