    title_zh: 转入密教专修瑜伽
    rationale: 以显教为基，见密教即身成佛之速，遂专禀金刚顶大法，求灌顶传付
  - date: 0718
    title_zh: 辞国师位泛海东弘
    rationale: 念大法当普利东土，不惮海险，携弟子不空东渡大唐
- id: guji-金刚智-endeavor-2
  title_zh: 奉诏入唐译经灌顶弘化
  summary_zh: 开元八年抵广州，入洛阳长安，奉玄宗诏译出千手千眼观自在广大圆满无碍大悲心陀罗尼咒本等密部经典，建坛灌顶，敷扬真言，奠定唐密弘传之基
