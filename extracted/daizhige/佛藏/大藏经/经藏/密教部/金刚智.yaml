    labels:
      zh: 发愿东行
    start_date: 0718
    highlight_event_id: guji-金刚智-event-arrival
  decisions:
  - date: '0700'
    title_zh: 依止龙智专修金刚顶瑜伽
    rationale: 见显教渐修难摄钝根，欲以三密相应速令众生证菩提心故择密为归
  - date: 0718
    title_zh: 携弟子不空泛海赴唐
    rationale: 感中土有缘乐密法，愿将瑜伽仪轨传于东方饶益一切故冒海难东行
- id: guji-金刚智-endeavor-2
  title_zh: 入唐奉诏译青颈观自在仪轨弘瑜伽观
  summary: 开元中抵洛阳长安，奉诏与一行笔受，译金刚顶瑜伽青颈大悲王仪轨，建曼荼罗授灌顶，教授声念诵与三摩地念诵。
  phases:
  - key: brewing
    name: 抵洛奉诏入内道场
