  description: 唐咸亨二年生于南天竺，少出家游学，奠定瑜伽密教之基。
- id: guji-金刚智-event-study
  title_zh: 那烂陀学法依龙智受瑜伽付嘱
  date: '0700'
  year_of: 700
  place_zh: 那烂陀龙智门下
  description: 广学因明声明显密经论，依龙智受金刚顶瑜伽灌顶，得莲华部达磨法要。
- id: guji-金刚智-event-arrival
  title_zh: 泛海南来抵洛阳奉诏弘化
  date: '0720'
  year_of: 720
  place_zh: 洛阳长安
  description: 开元八年携弟子不空经南海至洛阳，得玄宗礼敬，入内道场弘瑜伽密法。
- id: guji-金刚智-event-translate
  title_zh: 译金刚顶瑜伽青颈大悲王观自在念诵仪轨
  date: '0725'
  year_of: 725
  place_zh: 长安洛阳译场
  description: 奉诏与一行笔受，依金刚顶经演说观自在王莲华法要，明结界召罪摧破布字三摩地次第，成密教部要典。
- id: guji-金刚智-event-death
  title_zh: 示寂洛阳龙门
  date: '0741'
  year_of: 741
  place_zh: 洛阳
  description: 开元二十九年示寂，葬龙门，谥国师，弟子不空继弘其学成开元三大士之一。
