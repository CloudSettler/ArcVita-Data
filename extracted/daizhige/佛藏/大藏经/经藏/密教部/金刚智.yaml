  - title_zh: 显密兼通道路抉择
    description_zh: 早年精通声明因明诸论，后值密教大行，抉择以金刚顶瑜伽为究竟归趣，转入真言密行
  - title_zh: 安住本土与泛海东弘
    description_zh: 已承师付法为南天竺国师，念大法东流未广，甘冒南海风涛之险，携弟子不空东来大唐弘化
  lesson: 以密契显，以行证解，不辞海险而传灯东土，令大悲愿行普被群生
  summary_first_person: 吾金刚智，南天竺人，出家那烂陀，承付金刚顶瑜伽大法。开元中泛海至广州洛阳，奉诏译千手千眼观自在广大圆满无碍大悲心陀罗尼等经，传灌顶瑜伽，毕生以持明弘化自任，示寂于洛阳，谥大弘教。
