  - key: breakthrough
    name: 与一行笔受译青颈仪轨
    labels:
      zh: 译经
    start_date: '0723'
    highlight_event_id: guji-金刚智-event-translate
  - key: climax
    name: 授灌顶教授观音瑜伽三摩地
    labels:
      zh: 授法
    start_date: '0725'
    highlight_event_id: guji-金刚智-event-translate
  - key: closure
    name: 付嘱不空示寂洛阳
    labels:
      zh: 示寂
    start_date: '0741'
    highlight_event_id: guji-金刚智-event-death
  decisions:
  - date: '0723'
    title_zh: 先说入坛灌顶三昧耶方许修习
    rationale: 若不入灌顶曼荼罗发大菩提心舍身命财，则三业不净三密不相应故立 strict 门槛
  - date: '0725'
    title_zh: 开声念诵与无记无数三摩地双轨
    rationale: 为摄求解脱速出离者与常课持名者，令随力定数不减与观字义不断绝各得成就故
events:
