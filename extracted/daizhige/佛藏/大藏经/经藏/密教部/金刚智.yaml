endeavors:
- id: guji-金刚智-endeavor-1
  title_zh: 入唐译传不动尊安镇法
  summary: 自天竺受得毗卢遮那所示不动金刚明王威德法入唐敷演安镇家国仪轨
  phases:
  - key: brewing
    name: 天竺受法
    labels:
      zh: 酝酿求法
    start_date: '0710'
    highlight_event_id: guji-金刚智-event-1
  - key: breakthrough
    name: 入唐传译
    labels:
      zh: 突破传译
    start_date: '0720'
    highlight_event_id: guji-金刚智-event-2
  - key: climax
    name: 建立安镇仪轨
    labels:
      zh: 高潮建立
    start_date: '0730'
    highlight_event_id: guji-金刚智-event-3
  - key: closure
    name: 图样护摩具足
    labels:
      zh: 收束成轨
    start_date: '0731'
    highlight_event_id: guji-金刚智-event-3
  decisions:
  - date: '0720'
    title_zh: 应召入唐传密法
    rationale: 为拔济三界苦海有情现威德光明安乐人天故不辞海路弘传
  - date: '0730'
    title_zh: 敷演八方安镇供养护摩
    rationale: 国土多灾须依像设供养春秋护摩令天龙欢喜国界丰饶故立轨范
- id: guji-金刚智-endeavor-2
  title_zh: 秘付白衣王光相承
  summary: 以安镇秘法不许出家人行只许授与白衣故付行者王光令秘之又秘
  phases:
  - key: brewing
    name: 观察付嘱对象
    labels:
      zh: 酝酿观察
    start_date: '0730'
    highlight_event_id: guji-金刚智-event-3
  - key: breakthrough
    name: 付法王光
    labels:
      zh: 突破付授
    start_date: '0731'
    highlight_event_id: guji-金刚智-event-3
  - key: climax
    name: 严诫秘传白衣
    labels:
      zh: 高潮立诫
    start_date: '0731'
    highlight_event_id: guji-金刚智-event-3
  - key: closure
    name: 西方相承继嗣
    labels:
      zh: 收束相承
    start_date: '0740'
    highlight_event_id: guji-金刚智-event-4
  decisions:
  - date: '0731'
    title_zh: 不传出家只授白衣
    rationale: 出家具佛禁戒令人不安不敢受拜所求福德不成就违行犯大罪故制限
  - date: '0731'
    title_zh: 敕令秘藏勿令诸国知
    rationale: 西方深重此法恐滥传生慢唯流尊样以为大护故令秘之又秘相承不绝
events:
- id: guji-金刚智-event-birth
  date: '0671'
  year_of: 671
  title_zh: 诞生天竺
  description: 金刚智生于天竺南印度家世婆罗门后出家学密
- id: guji-金刚智-event-1
  date: '0710'
  year_of: 710
  title_zh: 天竺大师所受得安镇法
  description: 于天竺大师所受得不动尊安镇家国等法并八方天王旗幡降怨真言
- id: guji-金刚智-event-2
  date: '0720'
  year_of: 720
  title_zh: 入唐弘传密教护国法
  description: 携不动明王图像曼荼罗护摩仪轨入唐译传演说王宫黎庶普安圣像诵五字心真言施残食
- id: guji-金刚智-event-3
  date: '0731'
  year_of: 731
  title_zh: 付行者王光此仪轨法
  description: 以秘法不许出家人行只许白衣修行故受与行者王光令八家相承秘藏
- id: guji-金刚智-event-4
  date: '0740'
  year_of: 740
  title_zh: 安镇八方摧敌仪成
  description: 备载东方帝释至东北伊舍那八旗八天眷属围绕设石像厌敌军陈摧他敌法成
- id: guji-金刚智-event-death
  date: '0741'
  year_of: 741
  title_zh: 示寂于唐开元年间
  description: 金刚智三藏于长安示寂所传不动尊安镇家国法由王光一系秘传不绝
