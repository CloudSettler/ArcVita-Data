    description: 金刚顶密法本属秘密付嘱不向无智轻传然末世薄福众生苦多当以真言教法拔济当择何道
  - title_zh: 世间福乐祈求与回向菩提之衡
    description: 北斗法能得官位寿命护国安民行者乐世间乐然须深回向无上正等菩提世出世间如何兼顾
  lesson: 持秘密法当以拔济为先世间愿求须回向菩提方得久安
  summary_first_person: 吾乃南天竺三藏金刚智泛海东来入唐弘传金刚顶瑜伽密法译北斗七星念诵仪轨以八星神咒护持众生令罪灭愿满国安民丰而以一切功德回向无上菩提
