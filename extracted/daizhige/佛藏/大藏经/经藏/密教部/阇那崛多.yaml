  reign_ref: 北周明帝至隋文帝
  archetype: 译经弘法者
  dilemmas:
  - 梵汉音义悬隔，如何既存陀罗尼梵音又令汉人能持能诵
  - 周武灭法迁流突厥，如何保全梵本经卷以待隋兴再弘
  lesson: 以总持音声摄护群机，译场不辍即是护法，患难之中尤当存续法脉
  summary_first_person: 我是阇那崛多，生于天竺犍陀罗，少年出家游学中天竺，周初入长安奉诏译经，集法华神咒观音诸咒为种种杂咒经，虽经周武法难流寓突厥，隋兴复还大兴善寺重开译席，愿以咒愿护持持法者，灭罪除障，所求遂愿
