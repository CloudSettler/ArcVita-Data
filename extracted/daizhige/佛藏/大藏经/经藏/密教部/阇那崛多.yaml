endeavors:
- id: guji-阇那崛多-endeavor-1
  title_zh: 周初奉诏译经集诸杂咒
  description: 自武成入京住寺与耶舍崛多等共译，注记反切以存梵音，集成种种杂咒经以利护持法师灭罪祈愿
  phases:
  - key: brewing
    name: 西学东来
    labels:
      zh: 酝酿求法
    start_date: 0559-01-01
    highlight_event_id: guji-阇那崛多-event-arrive
  - key: breakthrough
    name: 长安开译
    labels:
      zh: 初译突破
    start_date: 0561-01-01
    highlight_event_id: guji-阇那崛多-event-zhongzhong
  - key: climax
    name: 杂咒集成
    labels:
      zh: 集咒高峰
    start_date: 0565-01-01
    highlight_event_id: guji-阇那崛多-event-zhongzhong
  - key: closure
    name: 法难辍译
    labels:
      zh: 法难收束
    start_date: 0574-01-01
    highlight_event_id: guji-阇那崛多-event-fanan
  decisions:
  - date: 0562-01-01
    title_zh: 以反切注音存梵咒真音
    rationale: 陀罗尼以音声为体，义译则失神效，故逐字加注反切轻重长短，令汉人可依字转音
  - date: 0565-01-01
    title_zh: 集法华观音诸咒为一卷
    rationale: 持法者多遭恼乱病障，需灭罪护身治病各法兼备，故汇法华六咒及观音随心等咒以便受持
- id: guji-阇那崛多-endeavor-2
  title_zh: 隋兴复弘重开译席
  description: 开皇初还京住大兴善寺，与达摩笈多等再译佛本行集经等数十部，补续周代译业，弘传观音忏悔灭罪法门
  phases:
  - key: brewing
    name: 突厥存经
    labels:
      zh: 避难存法
    start_date: 0574-01-01
    highlight_event_id: guji-阇那崛多-event-fanan
  - key: breakthrough
    name: 隋初还京
    labels:
      zh: 还京复译
    start_date: 0582-01-01
    highlight_event_id: guji-阇那崛多-event-sui
  - key: climax
    name: 善寺盛译
    labels:
      zh: 盛译高峰
    start_date: 0585-01-01
    highlight_event_id: guji-阇那崛多-event-sui
  - key: closure
    name: 示寂隋京
    labels:
      zh: 圆寂收束
    start_date: 0600-01-01
    highlight_event_id: guji-阇那崛多-event-death
  decisions:
  - date: 0582-01-01
    title_zh: 应隋诏还京再开译场
    rationale: 隋兴崇佛经梵本多散佚，需旧人复出以正音义，故携突厥所存梵本还京续译
  - date: 0585-01-01
    title_zh: 弘传观音忏悔灭罪行法
    rationale: 世人业障深重多求除病灭罪，故力弘旋塔忏悔供养诸咒，令持诵礼拜易行得益
events:
- id: guji-阇那崛多-event-birth
  title_zh: 生于犍陀罗婆罗门家
  date: 0523-01-01
  year_of: 523
  description: 生于天竺犍陀罗国婆罗门种姓之家，少年出家，游学中天竺，精通律论及梵呗
- id: guji-阇那崛多-event-arrive
  title_zh: 周武成初入长安
  date: 0559-01-01
  year_of: 559
  description: 与耶舍崛多等西来至长安，奉诏住寺译经，开始传译大乘经论及陀罗尼
- id: guji-阇那崛多-event-zhongzhong
  title_zh: 于长安译出种种杂咒经
  date: 0565-01-01
  year_of: 565
  description: 集法华内药王勇施等六咒及观音随心灭罪治病诸咒，加注反切音读，集成一卷以护持法师
- id: guji-阇那崛多-event-fanan
  title_zh: 周武灭法避往突厥
  date: 0574-01-01
  year_of: 574
  description: 周武建德禁佛，译场停罢，携梵本与同侣北往突厥避难，存护经卷十年
- id: guji-阇那崛多-event-sui
  title_zh: 隋开皇还京住大兴善寺
  date: 0582-01-01
  year_of: 582
  description: 隋文帝兴佛，召还长安住大兴善寺，与达摩笈多等共译佛本行集经等，续弘咒法
- id: guji-阇那崛多-event-death
  title_zh: 卒于隋京
  date: 0600-01-01
  year_of: 600
  description: 译经弘化数十年后示寂于隋京，毕生译经三十余部，杂咒一卷广行于世
