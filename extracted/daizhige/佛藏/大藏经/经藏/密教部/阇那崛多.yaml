    rationale: 不安住本国安乐，欲以大乘利东方缘熟之地，遂冒艰险东行
  - date: '0574'
    title_zh: 法难中决意留守不归
    rationale: 念经像付嘱所在即是行道处，忍辱护持以待后时，胜于西归自保
- id: guji-阇那崛多-endeavor-2
  title_zh: 隋代主持译场大译群经传金刚场
  summary: 入隋开皇奉诏于大兴善寺等处译经，与弟子达摩笈多等共译三十余部，宣金刚场陀罗尼平等无二法门
