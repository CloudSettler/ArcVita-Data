  - title_zh: 值周武法难去留之抉择
    description: 周武灭法之际或西归避难或忍辱留守护持经像，终选择留中土以待法运再兴
  - title_zh: 空有二边与平等中道之抉择
    description: 于金刚场法门中不舍凡夫法亦不执取佛法，直显无明即菩提以破分别
  lesson: 烦恼菩提本无二相，守平等心而精勤译业，方能转法难为法缘
  summary_first_person: 吾本犍陀罗富留沙富城人，刹帝利种，少出家而从师游学，逾葱岭东入中土，历齐周之变而不改其志，入隋蒙诏译经，宣说金刚场陀罗尼平等法门，愿众生于烦恼中即见菩提
