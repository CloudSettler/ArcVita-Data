    title_zh: 以团队译场取代单人独译
    rationale: 梵汉义理悬隔，须集众智校文证义，方能信达兼备而广利后学
  - date: 0585
    title_zh: 直说无二法破名相执著
    rationale: 众生执烦恼涅槃为二，故说欲恼痴即陀罗尼句，令于一切法中见平等解脱
