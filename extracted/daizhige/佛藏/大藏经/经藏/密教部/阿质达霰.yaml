  - 梵语密咒深广难翻与唐土众生亟须灵要之矛盾
  - 秽迹威猛降伏之义与慈悲摄受普度之权衡
  lesson: 以无能胜之愿持咒译经，令佛法久住，群生离苦得安乐
  summary_first_person: 我本北天竺三藏沙门，唐言无能胜将，奉法入唐，译秽迹金刚说神通大满陀罗尼法术灵要门，述如来临涅槃于拘尸那跋提河边，蠡髻梵王恃慢不来，咒仙金刚往取不克，如来左心化出不坏金刚降伏梵王，说大圆满秽迹真言，誓于灭后给使持诵者，满愿疗病，护世利生
