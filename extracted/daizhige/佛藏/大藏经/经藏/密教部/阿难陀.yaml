  dilemmas:
  - 多闻广博而未早证无漏，如何以闻持趣向实证
  - 在舍卫祇园遭旃陀罗女符咒厌惑恍惚，如何依佛神咒自护护他
  lesson: 以专念多闻守护正法，以鲜洁持咒护身护众，危难不失正念则众恶灭而众善生
  summary_first_person: 我是阿难陀，侍佛多闻，一时在舍卫祇陀林为外道旃陀罗女符书厌祷所惑而恍惚，世尊怜愍三世有情说六字神咒王经护我，我受持忆念得昼安夜安，愿护持正法永绝八难
