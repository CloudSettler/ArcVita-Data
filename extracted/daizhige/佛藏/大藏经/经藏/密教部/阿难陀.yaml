  decisions:
  - date: -490-06-01
    title_zh: 一心受持六字神咒王忆念不忘
    rationale: 世间最上无过于佛法僧，以真实章句断帝释梵天四天王及一切邪鬼咒道，令昼安夜安得寿百岁
  - date: -490-07-01
    title_zh: 以白缕结索诵咒护衣带并设斋报恩
    rationale: 洗浴鲜洁不食五辛，诵咒七遍一遍一结以灭官事斗诤咒诅，事过请佛法僧烧香设斋发大愿与四生永绝八难
