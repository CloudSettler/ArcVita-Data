  reign_ref: 释迦牟尼佛游大兜国时
  archetype: 噬子恶母悔改护生者
  dilemmas:
  - 爱惜己之千子却日盗他人子杀啖，如何自解其恶
  - 备尝失子狂痛之后，能否真心受戒转而护持世间产子之家
  lesson: 以爱己子之心推爱他人之子，止杀受戒方能自度度人
  summary_first_person: 我本千子之母，千子皆为鬼王，我居大兜国喜盗他人子杀啖，佛令沙门藏我千子，令我备尝失子狂哭之痛，我方知己过，遂见佛受五戒，一心自悔得须陀洹，愿止精舍傍率千子与佛结要，护持世间求子生产治生之人永不娆害
