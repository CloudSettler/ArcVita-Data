endeavors:
- id: guji-鬼子母-endeavor-1
  title_zh: 居大兜国盗食人子
  summary: 有千子皆为鬼王纵横天上人间，自为人身居大兜国，日行盗取他人子杀啖，致合城啼哭，阿难启佛，佛以藏子之方便令其自悔
  phases:
  - key: brewing
    name: 千子为王娆乱天人
    labels:
      zh:
      - 鬼王纵横
    start_date: '-0550'
    highlight_event_id: guji-鬼子母-event-qianzi
  - key: breakthrough
    name: 大兜国中盗子杀啖
    labels:
      zh:
      - 盗子为害
    start_date: -0500-03-01
    highlight_event_id: guji-鬼子母-event-daodoudaozi
  - key: climax
    name: 千子被藏失子狂哭
    labels:
      zh:
      - 失子之痛
    start_date: -0500-04-10
    highlight_event_id: guji-鬼子母-event-cangzishizi
  - key: closure
    name: 被引见佛自知其恶
    labels:
      zh:
      - 闻法恐怖
    start_date: -0500-04-20
    highlight_event_id: guji-鬼子母-event-jianfoshoujie
  decisions:
  - date: -0500-03-01
    title_zh: 日行盗取他人子
    rationale: 恃千子鬼王之势，纵贪杀之性，不念他人失子之痛
  - date: -0500-04-20
    title_zh: 随沙门往见佛求子
    rationale: 遍寻千子不得，狂哭十日，闻佛知去来之事，故愿往问佛以得子
- id: guji-鬼子母-endeavor-2
  title_zh: 受戒证道护持世人
  summary: 蒙佛诘问爱子之心而恐怖自悔，受五戒得须陀洹，发愿止精舍傍召千子与佛结要，敕摩尼钵毗沙门等护持求子生产财物
  phases:
  - key: brewing
    name: 佛授五戒敕令自悔
    labels:
      zh:
      - 受戒自悔
    start_date: -0500-04-20
    highlight_event_id: guji-鬼子母-event-jianfoshoujie
  - key: breakthrough
    name: 一心自悔得须陀洹
    labels:
      zh:
      - 得道见真
    start_date: -0500-04-20
    highlight_event_id: guji-鬼子母-event-jianfoshoujie
  - key: climax
    name: 召千子王与佛结要
    labels:
      zh:
      - 结要护人
    start_date: -0500-05-01
    highlight_event_id: guji-鬼子母-event-jieyaohufa
  - key: closure
    name: 敕诸鬼王护持产治
    labels:
      zh:
      - 普护世间
    start_date: -0500-05-01
    highlight_event_id: guji-鬼子母-event-jieyaohufa
  decisions:
  - date: -0500-04-20
    title_zh: 听佛教诫受持五戒
    rationale: 知盗子必堕太山地狱，又欲得还千子，故愿随佛语永不远离
  - date: -0500-05-01
    title_zh: 止精舍傍报恩护生
    rationale: 思惟中正之道彻视己过，愿以护持无子求子有产得救以报天上天下人恩
events:
- id: guji-鬼子母-event-birth
  title_zh: 生为千子之母
  date: '-0600'
  year_of: -600
  location_zh: 传说鬼道人道之间
  description: 生而多子性极恶，有千子，五百在天上，五百在世间，皆为鬼王各从数万鬼
  endeavor_ref: guji-鬼子母-endeavor-1
- id: guji-鬼子母-event-qianzi
  title_zh: 千子为鬼王娆乱
  date: '-0550'
  year_of: -550
  location_zh: 天上世间
  description: 五百鬼王在天上娆诸天，五百鬼王在世间娆帝王人民，或诈称树木地水海船舍宅之神，令人祠祀烹杀以益其罪
  endeavor_ref: guji-鬼子母-endeavor-1
- id: guji-鬼子母-event-daodoudaozi
  title_zh: 大兜国中盗食人子
  date: -0500-03-01
  year_of: -500
  location_zh: 大兜国城中街里
  description: 佛游大兜国，鬼子母现作人母，日行盗取人子杀啖，亡子之家行街里啼哭，阿难出行见之以白佛
  endeavor_ref: guji-鬼子母-endeavor-1
- id: guji-鬼子母-event-cangzishizi
  title_zh: 沙门藏子母失子狂哭
  date: -0500-04-10
  year_of: -500
  location_zh: 大兜国精舍及城内外
  description: 依佛教诫，众沙门伺母出行敛取千子藏于精舍，母归不见其子，遍索城内外十日不得，被发入市啼哭自扑不能饮食
  endeavor_ref: guji-鬼子母-endeavor-1
- id: guji-鬼子母-event-jianfoshoujie
  title_zh: 见佛受五戒得须陀洹
  date: -0500-04-20
  year_of: -500
  location_zh: 大兜国佛所
  description: 母随沙门见佛，佛以爱子之心诘之，告以死后当入太山地狱，母恐怖自悔，受不杀不盗不淫不两舌不饮酒五戒，即得须陀洹道知去来事
  endeavor_ref: guji-鬼子母-endeavor-2
- id: guji-鬼子母-event-jieyaohufa
  title_zh: 召子结要护持求愿
  date: -0500-05-01
  year_of: -500
  location_zh: 佛精舍边
  description: 发愿止精舍傍呼千子王与佛结要，无子求子者与之子，敕浮陀摩尼钵主四海船车治生产业，炙匿救产生，毗沙门护人命，阿须伦主龙令毒不害人，求愿者慈心无所索谢
  endeavor_ref: guji-鬼子母-endeavor-2
- id: guji-鬼子母-event-death
  title_zh: 得道后长护世间
  date: -0490
  year_of: -490
  location_zh: 传说佛精舍边
  description: 自受戒得道后，常以千子鬼属随护人间，不复妄娆，世称护子安产之母神
  endeavor_ref: guji-鬼子母-endeavor-2
