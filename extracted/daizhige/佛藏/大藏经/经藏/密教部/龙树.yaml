    title_zh: 舍外道归佛quest
    rationale: 见外法不能尽苦源，依佛法缘起方可息戏论，故入佛门求解脱道。
  - date: 0195-01-01
    title_zh: 以八不立中道著论
    rationale: 为破有无执著，须以不生不灭不常不断显实相，令学人离边见。
