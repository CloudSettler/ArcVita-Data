  decisions:
  - date: 0205-01-01
    title_zh: 以法灯大如意代宝珠雨宝
    rationale: 见劫夺库藏损民乱国，知真济世在治法垂后息乱安民，非外求珠宝。
  - date: 0215-01-01
    title_zh: 开符药咒术三业并用
    rationale: 民患病疫鬼疰产难盗贼，当以忏悔供养为本，符药咒术为缘，方能除横护生。
events:
- id: guji-龙树-event-birth
  date: 0150-01-01
  year_of: 150
  title_zh: 龙树诞生南天竺
  description: 约公元一百五十年，龙树生于南天竺婆罗门家，少聪颖，博习外道五明百艺。
- id: guji-龙树-event-zhonglun
  date: 0195-06-01
  year_of: 195
  title_zh: 造中论立八不中道
  description: 深观般若，造中论等，立不生不灭不常不断不一不异不出不来，破邪显正，开中观宗。
- id: guji-龙树-event-wuming
  date: 0215-01-01
  year_of: 215
  title_zh: 传五明利民符药咒法
  description: 应阿育王国贫病饥疫，示燃灯供佛忏悔、利民符十八道、医药丸方、观音诸咒及禳雨止灾法，以济众生。
- id: guji-龙树-event-death
  date: 0250-01-01
  year_of: 250
  title_zh: 龙树示寂传法后世
  description: 约公元二百五十年示寂，付嘱弟子以法灯相续，五明论秘诀图经流布后代，护国利民。
