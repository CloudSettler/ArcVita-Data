  date: -2998-01-01
  year_of: -2998
  description: 受位后持戒安民合调伏者调伏定田制止偷盗令世间渐安
- id: guji-众许摩诃帝-event-succession
  type: career
  title_zh: 生子传嗣开后世王统
  date: -2950-01-01
  year_of: -2950
  description: 立爱王等子孙相继自此顶生尼噜乌波尼噜以至甘蔗诸王百千王统相承不断
- id: guji-众许摩诃帝-event-death
