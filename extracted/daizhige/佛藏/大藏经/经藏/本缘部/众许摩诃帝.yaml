  type: birth
  title_zh: 劫初人间出生
  date: -3000-01-01
  year_of: -3000
  description: 劫坏后遍静天众福尽生人间具端严身光后因食地味地饼林藤香稻乃至男女分别之后生于人间众中
- id: guji-众许摩诃帝-event-elected
  type: career
  title_zh: 众人推举为田主号三摩达多
  date: -3000-01-01
  year_of: -3000
  description: 因田种盗起众人共拣具福德者立为田主均分田土受少分收获号刹帝利三摩达多是为众许王
- id: guji-众许摩诃帝-event-govern
  type: career
