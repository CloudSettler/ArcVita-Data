person:
  qid: guji-大意
  name_zh: 大意
  names:
    zh: 大意
    en: Dayi
  lifespan:
    birth:
      date: -1000-01-01
      precision: year
      is_circa: true
      raw: 欢乐无忧国摩诃檀家生子堕地能言
    death:
      date: -0930-01-01
      precision: year
      is_circa: true
      raw: 大布施多年后寿终
  birth_date: -1000-01-01
  death_date: -0930-01-01
  era: 上古传说
  reign_ref: 欢乐无忧国广慈哀王时
  archetype: 布施济众者
  dilemmas:
  - 留住宝城受供养安乐与继续涉险求珠济众之衡
  - 珍琦七宝易得与明月珠难保之舍取
  - 失珠后隐忍退让与发愿抒海相争之决
  lesson: 以坚定誓愿加精诚专一，虽移山竭海亦可成，布施利众乃成佛之本
  summary_first_person: 吾生于欢乐无忧国，堕地即立愿布施天下，十七岁辞亲入海，历四宝城得四明月珠，虽为海神所夺，誓抒海水而夺回，还国大施济众，此皆吾成佛之远因
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E6%9C%AC%E7%BC%98%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%A4%A7%E6%84%8F%E7%BB%8F.html
endeavors:
- id: guji-大意-endeavor-1
  title_zh: 入海历四城求明月珠
  summary: 辞亲入海，历银金水精琉璃四城，以定意伏毒蛇，得王供养不受七宝，独求明月珠
  phases:
  - key: brewing
    name: 辞亲立愿入海
    labels:
      zh: 立愿入海
    start_date: -0983-01-01
    highlight_event_id: guji-大意-event-vow-sea
  - key: breakthrough
    name: 历银金二城得珠
    labels:
      zh: 初得二珠
    start_date: -0983-03-01
    highlight_event_id: guji-大意-event-four-cities
  - key: climax
    name: 历水精琉璃二城得珠
    labels:
      zh: 再得二珠
    start_date: -0983-05-01
    highlight_event_id: guji-大意-event-four-cities
  - key: closure
    name: 携四珠还道
    labels:
      zh: 满载还道
    start_date: -0983-06-01
    highlight_event_id: guji-大意-event-four-cities
  decisions:
  - date: -0983-01-01
    title_zh: 不受家财而入海采宝
    rationale: 家财虽多不足济天下，唯入海采七宝方可大施
  - date: -0983-03-01
    title_zh: 不受七宝独求明月珠
    rationale: 明月珠能引众宝随行，最利济众，故舍众宝而取珠
- id: guji-大意-endeavor-2
  title_zh: 抒海夺珠还国大施
  summary: 失珠后誓抒海水，感四天王相助，夺回四珠，迎娶布施，多年济众成佛因
  phases:
  - key: brewing
    name: 海神化人夺珠
    labels:
      zh: 失珠立誓
    start_date: -0983-07-01
    highlight_event_id: guji-大意-event-reclaim
  - key: breakthrough
    name: 以器抒海感天助
    labels:
      zh: 抒海感天
    start_date: -0983-07-15
    highlight_event_id: guji-大意-event-reclaim
  - key: climax
    name: 逼海神还珠
    labels:
      zh: 夺回宝珠
    start_date: -0983-08-01
    highlight_event_id: guji-大意-event-reclaim
  - key: closure
    name: 还国迎娶大布施
    labels:
      zh: 大施济众
    start_date: -0983-09-01
    highlight_event_id: guji-大意-event-giving
  decisions:
  - date: -0983-07-01
    title_zh: 誓抒尽海水不还珠不休
    rationale: 勤苦涉险所得不可轻舍，以断生死之志抒小海必能成
  - date: -0983-09-01
    title_zh: 不贪宝聚而恣意大施
    rationale: 得宝本为救济人民，唯普施令无饥寒方可满愿
events:
- id: guji-大意-event-birth
  title_zh: 生于欢乐无忧国立布施愿
  date: -1000-01-01
  year_of: -1000
  place: 欢乐无忧国摩诃檀家
  description: 居士摩诃檀妻栴陀生子姿容端正，堕地便言誓布施救济孤独贫穷，父母因名大意
- id: guji-大意-event-vow-sea
  title_zh: 年十七辞亲入海
  date: -0983-01-01
  year_of: -983
  place: 本国至大海道中
  description: 年十七告父母欲布施勤苦人，父母听恣意施与，自言家财不足用，辞行入海采七宝，道经他国拒婆罗门留婿之请
- id: guji-大意-event-four-cities
  title_zh: 历四宝城伏蛇得四明月珠
  date: -0983-05-01
  year_of: -983
  place: 银城金城水精城琉璃城
  description: 以定意令绕城毒蛇低头睡卧，入银金水精琉璃四城受王供养，历九十日六十日四十日二十日，不受珍琦七宝，各得一明月珠，有二十里至八十里宝随
- id: guji-大意-event-reclaim
  title_zh: 誓抒海水夺回明月珠
  date: -0983-07-15
  year_of: -983
  place: 大海中
  description: 海神化人夺四珠堕水，誓抒尽海水，以器抒海，感第一四天王来助，抒水三分已二，海神振怖出珠还之，不取众宝
- id: guji-大意-event-giving
  title_zh: 还国迎娶恣意大布施
  date: -0983-09-01
  year_of: -983
  place: 本国
  description: 取婆罗门女还本国，恣意大布施，境界无复饥寒，四方归仁，恩逮蜎飞蠕动，寿终上为帝释下为飞行皇帝，积功成佛
- id: guji-大意-event-death
  title_zh: 寿终后成佛特尊
  date: -0930-01-01
  year_of: -930
  place: 本国
  description: 布施历载后寿终，累世为帝释飞行皇帝，积累功德自致成佛三界特尊，佛言大意即我身是
