      raw: 入山修禅寿终之时
  birth_date: -1000-01-01
  death_date: -0980-01-01
  era: 传说过去世婆罗奈国时
  archetype: 忍辱求道圣者
  dilemmas:
  - 缄默忍辱以避旧业与开口自辩以免生埋之间两难
  - 王位富贵骨肉恩爱与入山求道离苦解脱之间抉择
  lesson: 忆前世地狱剧苦而怖后业，结舌忍辱以远尘垢，临生埋而发妙音明因，辞王位而入山禅定终得解脱之因
  summary_first_person: 吾昔为婆罗奈王太子名墓魄，生而明慧端正，忆前世为王有缺而堕地狱六万余岁蒸煮剥裂，怖苦故结舌不语十有三年，父母信婆罗门诳言欲掘坑生埋吾，临藏吾举右手发言道本因，辞父王弃国入山思惟禅定，寿终生兜術天，后下生为迦维罗卫太子得佛
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E6%9C%AC%E7%BC%98%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%A4%AA%E5%AD%90%E5%A2%93%E9%AD%84%E7%BB%8F.html
endeavors:
- id: guji-太子墓魄-endeavor-1
  title_zh: 缄默避业十三年
  description: 忆地狱苦而结舌不语，目不视色耳不听音，虽被诬荧惑将危国灭宗亦默然不辩，以安身避害济神离苦
  phases:
  - key: brewing
    name: 生而缄默
    labels:
      zh: 缄默始发
    start_date: -1000-01-01
    highlight_event_id: guji-太子墓魄-event-birth
  - key: breakthrough
    name: 十三年不言
    labels:
      zh: 忍辱坚守
    start_date: -0995-01-01
    highlight_event_id: guji-太子墓魄-event-pit-sermon
  - key: climax
    name: 被诬生埋
    labels:
      zh: 临坑受难
    start_date: -0987-06-01
    highlight_event_id: guji-太子墓魄-event-pit-sermon
  - key: closure
    name: 举手发言
    labels:
      zh: 发言明因
    start_date: -0987-06-01
    highlight_event_id: guji-太子墓魄-event-pit-sermon
  decisions:
  - date: -1000-01-01
    title_zh: 立志结舌不语
    rationale: 畏地狱六万余岁蒸煮剥裂之痛，冀免瑕除垢不与罪会，故恬惔质朴意如枯木
  - date: -0987-06-01
    title_zh: 临藏开口说法
    rationale: 若正不语而被生埋则枉死，若欲语又恐入地狱，终以济众明因故举手发言道宿命
- id: guji-太子墓魄-endeavor-2
  title_zh: 弃国入山求道
  description: 辞谢父王让位之请，言父子恩爱已乖骨肉已离，弃国捐王入山思惟禅定，寿终生兜術天为后世成佛之因
  phases:
  - key: brewing
    name: 父王迎请还国
    labels:
      zh: 让位相迎
    start_date: -0987-06-01
    highlight_event_id: guji-太子墓魄-event-pit-sermon
  - key: breakthrough
    name: 辞国明无常
    labels:
      zh: 看破无常
    start_date: -0987-07-01
    highlight_event_id: guji-太子墓魄-event-renounce
  - key: climax
    name: 入山禅定
    labels:
      zh: 山林修行
    start_date: -0987-08-01
    highlight_event_id: guji-太子墓魄-event-renounce
  - key: closure
    name: 寿终生天
    labels:
      zh: 生兜術天
    start_date: -0980-01-01
    highlight_event_id: guji-太子墓魄-event-death
  decisions:
  - date: -0987-07-01
    title_zh: 不受王位入山学道
    rationale: 知世间无常恍惚如梦室家欢娱须臾，忧苦延长不可选软去道日远，故高翔远逝自济于世
  - date: -0987-08-01
    title_zh: 常思惟禅定终身
    rationale: 厌畏地狱除忧去累念生若寄，欲出尘埃之外不与罪会，故寿终不悔
events:
- id: guji-太子墓魄-event-birth
  title_zh: 婆罗奈王宫太子诞生
  date: -1000-01-01
  year_of: -1000
  description: 昔婆罗奈王太子生，字名墓魄，生有无穷之明端正妙洁无双，父母供养瞻视欲待长大立字
- id: guji-太子墓魄-event-pit-sermon
  title_zh: 临坑举手发言明宿因
  date: -0987-06-01
  year_of: -987
  description: 王信婆罗门言掘坑欲生埋太子，太子乘四望象车至藏所，飞鸟走兽绕藏三匝，太子举右手发言，言前世为王有缺堕地狱六万余岁故结舌十三年，人民闻绝妙之音皆叩头悔过，王与夫人驾车来迎
- id: guji-太子墓魄-event-renounce
  title_zh: 辞父弃国入山求道
  date: -0987-07-01
  year_of: -987
  description: 太子谢父王让位之意，言今日父子已相弃捐恩爱已乖，王知其意坚志固遂听学道，太子弃国捐王入山求道思惟禅定
- id: guji-太子墓魄-event-death
  title_zh: 寿终生兜術天
  date: -0980-01-01
  year_of: -980
  description: 太子在山修行寿终即生兜術天上，毕天之寿下生世间为迦维罗卫王作太子，自致得佛，即释迦前身
