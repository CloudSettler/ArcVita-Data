  title_zh: 以法化世大治婆羅痆斯
  summary: 繼位婆羅痆斯，以法化世，國土豐樂人民熾盛，無鬥戰詐偽病苦災橫，稻蔗牛羊充滿，恩育兆人如觀一子
  phases:
  - key: brewing
    name: 發願化世
