    start_date: -0980
    highlight_event_id: guji-妙色王-event-reign
  - key: climax
    name: 渴仰勝法
    labels:
      zh:
      - 希求妙法
    start_date: -0976
    highlight_event_id: guji-妙色王-event-seek
  - key: closure
    name: 懸金募法
    labels:
      zh:
      - 懸賞求法
    start_date: -0976
    highlight_event_id: guji-妙色王-event-seek
  decisions:
  - date: -0980
    title_zh: 以法化世恩育兆人
    rationale: 國安民豐方能厭離放逸而希勝法故以慈悲平等攝化群官百姓
  - date: -0976
    title_zh: 懸金箱鳴鼓遍告求法
    rationale: 雖無佛出世亦不捨求法之願故以重賞普告四方冀得勝法
- id: guji-妙色王-endeavor-2
  person_qid: guji-妙色王
  title_zh: 捨子妻身求聞勝偈
  summary: 遇帝釋化藥叉索人血肉為食，次第捨愛子端正子妻妙容夫人及己身，得聞由愛故生憂怖之偈，歡喜奉持，蒙天帝還妻子而授記菩提
  phases:
  - key: brewing
    name: 藥叉索食試心
