  dilemmas:
  - 為保愛子妻身而錯失妙法，抑或捨親割身以求一偈
  - 安享豐樂國土以全王身，抑或捐軀殉法以種菩提遠因
  lesson: 為求勝法不惜身命妻兒，一偈受持勝過金箱國土，忘軀求法乃成佛正因
  summary_first_person: 我昔為婆羅痆斯妙色王，以法化世，國豐民安，渴仰勝法而懸金求偈，遇藥叉索子妻及身，我皆歡喜施與，得聞離愛無憂怖之偈，奉持無悔，天帝還我妻子而授記菩提
  source_urls:
