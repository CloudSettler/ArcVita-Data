    name: 捨愛子而不驚
    labels:
      zh:
      - 捨子求法
    start_date: -0975
    highlight_event_id: guji-妙色王-event-sacrifice
  - key: climax
    name: 捨妻身聞偈立要
    labels:
      zh:
      - 捨妻聞法
    start_date: -0975
    highlight_event_id: guji-妙色王-event-hearverse
  - key: closure
    name: 捨己身蒙授記
    labels:
      zh:
      - 捨身授記
    start_date: -0975
    highlight_event_id: guji-妙色王-event-hearverse
  decisions:
  - date: -0975
    title_zh: 捨端正子以充藥叉之食
    rationale: 久辛苦求法今聞法音便成無價故捨所愛以全求法之誠慕法情深了無驚懼
  - date: -0975
    title_zh: 先聞法後捨身
    rationale: 身死則無由聞法故與藥叉立要先受持伽他後即隨意捨身無退轉心
