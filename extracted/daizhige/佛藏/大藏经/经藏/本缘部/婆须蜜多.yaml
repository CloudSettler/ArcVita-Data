person:
  qid: guji-婆须蜜多
  name_zh: 婆须蜜多
  names:
    zh: 婆须蜜多
    en: Vasumitra
  lifespan:
    birth:
      date: -2000-01-01
      precision: year
      is_circa: true
      raw: 宝慧如来像法中生为莲华藏比丘
    death:
      date: -0490-01-01
      precision: year
      is_circa: true
      raw: 王舍城随佛出家后入灭经未载
  birth_date: -2000-01-01
  death_date: -0490-01-01
  era: 传说宝慧佛像法至释迦住世时
  reign_ref: 摩揭陀频婆娑罗王时
  archetype: 破戒忏悔终成佛者
  dilemmas:
  - 放逸亲近权贵犯戒堕阿鼻与持戒清净生天成佛之间如何抉择
  - 现身猕猴戏遭外道讥谤与以善巧令金色猕猴发菩提心之间如何权衡
  lesson: 持戒为甘露生天梯，破戒堕地狱畜生，一念忏悔受戒发愿即超千劫罪，终次弥勒而成师子月佛
  summary_first_person: 我前身为宝慧佛像法中莲华藏比丘，因邪命谄曲不持戒，历地狱饿鬼牛驼猪狗猕猴身，幸遇罗汉受三归五戒发无上心，得生兜率值补处菩萨，今生王舍城长者家随佛出家，戏度八万四千金色猕猴，蒙授记次弥勒后当成师子月如来
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E6%9C%AC%E7%BC%98%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%B8%88%E5%AD%90%E6%9C%88%E4%BD%9B%E6%9C%AC%E7%94%9F%E7%BB%8F.html
