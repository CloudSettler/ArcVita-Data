  title_zh: 猕猴身受罗汉三归五戒生天
  date: -1500-01-01
  year_of: -1500
  summary: 空泽中为猕猴，遇头陀罗汉披袈裟绕行，受三归五戒忏悔发愿成佛，坠树死后生兜率值补处菩萨
- id: guji-婆须蜜多-event-garden
