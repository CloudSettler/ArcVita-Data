    highlight_event_id: guji-婆须蜜多-event-precepts
  decisions:
  - date: -1900-01-01
    title_zh: 犯戒后果自受
    rationale: 以诳惑亲贵不持戒故堕阿鼻及饿鬼畜生，示破戒苦报
  - date: -1500-01-01
    title_zh: 猕猴身受五戒发佛愿
    rationale: 遇罗汉忏悔受不杀等五戒，立愿乃至成佛终不杀生，求无上菩提以破畜生业
- id: guji-婆须蜜多-endeavor-2
  title_zh: 竹园戏度授记师子月
  summary: 释迦时生王舍城长者家出家为婆须蜜多比丘，竹园戏度八万四千金色猕猴，令发菩提心，佛为授记未来成师子月佛
  phases:
  - key: brewing
