    highlight_event_id: guji-婆须蜜多-event-prophecy
  decisions:
  - date: -0530-01-01
    title_zh: 以猕猴戏行佛事
    rationale: 以宿习善巧与畜生为伴侣，令猕猴欢喜种善根，不畏外道讥笑
  - date: -0530-03-01
    title_zh: 忍讥显本生因果
    rationale: 借王疑说然灯前宝慧时及拘楼秦时因缘，劝众止恶修善持戒
events:
