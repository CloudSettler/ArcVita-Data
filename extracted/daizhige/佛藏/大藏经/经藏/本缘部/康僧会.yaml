endeavors:
- id: guji-康僧会-endeavor-1
  title_zh: 译梵为吴述集譬喻
  description: 于建业译出旧杂譬喻经六度集经等以浅喻弘深法开吴地佛典之先
  phases:
  - key: brewing
    name: 交趾出家博览三藏
    labels:
      zh: 学法酝酿
    start_date: '0215'
    highlight_event_id: guji-康僧会-event-birth
  - key: breakthrough
    name: 入吴见俗无佛法立志翻译
    labels:
      zh: 立志译经
    start_date: '0247'
    highlight_event_id: guji-康僧会-event-247-arrive
  - key: climax
    name: 译旧杂譬喻弘五戒十善
    labels:
      zh: 译经高潮
    start_date: '0251'
    highlight_event_id: guji-康僧会-event-251-translate
  - key: closure
    name: 集经授徒法留在世
    labels:
      zh: 付嘱流通
    start_date: '0252'
    highlight_event_id: guji-康僧会-event-251-translate
  decisions:
  - date: '0247'
    title_zh: 以譬喻入道先译浅近
    rationale: 吴俗未闻佛法宜以本生譬喻劝五戒十善故先译旧杂譬喻
  - date: '0251'
    title_zh: 直译质朴不饰文藻
    rationale: 恐失经义宁质不华使义理可信便于讽诵受持
- id: guji-康僧会-endeavor-2
  title_zh: 建业感舍利立教建寺
  description: 赤乌中感得佛舍利化孙权建建初寺立僧伽开江南佛化之基
  phases:
  - key: brewing
    name: 初至建业无人信向
    labels:
      zh: 弘化艰难
    start_date: '0247'
    highlight_event_id: guji-康僧会-event-247-arrive
  - key: breakthrough
    name: 立誓感舍利现灵瑞
    labels:
      zh: 舍利感通
    start_date: 0249
    highlight_event_id: guji-康僧会-event-249-relic
  - key: climax
    name: 孙权归信建建初寺
    labels:
      zh: 立寺弘化
    start_date: '0250'
    highlight_event_id: guji-康僧会-event-249-relic
  - key: closure
    name: 皓代护法至晋圆寂
    labels:
      zh: 守道善终
    start_date: 0280
    highlight_event_id: guji-康僧会-event-death
  decisions:
  - date: 0249
    title_zh: 以三七日立限求舍利
    rationale: 不以空言化帝王愿以戒行感圣迹使国主亲见乃信
  - date: '0250'
    title_zh: 受请建寺不受爵禄
    rationale: 欲使佛法久住在僧伽清修不在荣贵故立建初寺以安众
