  dilemmas:
  - 吴地初无佛法异域沙门孤立难信之困
  - 以舍利感通取信帝王与持戒不妄语之衡
  - 译梵为吴文质兼顾义不失真之难
  lesson: 直信持戒以慈化俗感通不求而至译经立教功在万世
  summary_first_person: 吾康僧会本康居之后世居天竺交趾出家入吴译旧杂譬喻与六度集等经感舍利建建初寺愿以五戒十善通道天下使后世知佛法至真无量
