  decisions:
  - date: -6999-01-01
    title_zh: 不爱色声香味决守清白
    rationale: 五欲如画瓶盛不净如堕罗网若习想念即失一心故断想专志
  - date: -6999-06-01
    title_zh: 以怨家想出离因缘
    rationale: 辨女伎乐众乱清白法久处必缚故立无所惜行求解脱
- id: guji-德光太子-endeavor-2
  title_zh: 答父发愿求佛度众
  summary: 以偈拒父王留恋阐明无常恩爱别离立愿得佛道雨法药度三界
  phases:
  - key: breakthrough
    name: 答父明无常
    labels:
      zh: 以偈谏父说解脱
    start_date: -6998-01-01
    highlight_event_id: guji-德光太子-event-dafu
  - key: closure
    name: 立愿度脱
    labels:
      zh: 为众求佛道
    start_date: -6998-06-01
    highlight_event_id: guji-德光太子-event-fayuan
  decisions:
  - date: -6998-01-01
    title_zh: 不受欲乐不受嗔恚
    rationale: 受贪欲即为心意作奴自坏功德非以淫欲可致佛道故终不受欲
  - date: -6998-06-01
    title_zh: 为众求道不为自乐
    rationale: 见五道生死人民流堕恶道愿作慈哀雨解脱灯令得三忍平等
