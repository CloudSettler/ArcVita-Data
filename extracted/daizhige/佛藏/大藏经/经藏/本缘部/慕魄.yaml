person:
  qid: guji-慕魄
  name_zh: 慕魄
  names:
    zh: 慕魄
    en: Prince Mupo
  lifespan:
    birth:
      date: -1013
      precision: year
      is_circa: true
      raw: 波罗奈国王太子始生端正自识宿命
    death:
      date: -0900
      precision: century
      is_circa: true
      raw: 弃国修道累功成佛度众入灭不可考
  birth_date: -1013
  death_date: -0900
  era: 上古传说波罗奈国
  archetype: 默行求道者
  dilemmas:
  - 自知宿命欲闭口避业却被视为喑哑聋痴遭弃埋
  - 已脱死地当救父王免杀子重罪而复涉世缘还是直去求道
  lesson: 以静默守心远离尘累，以慈言止杀救亲，视国位富贵如梦幻而直求大道济众
  summary_first_person: 吾昔为波罗奈太子名慕魄，生而知宿命，见前世为须念王小失堕地狱六万岁苦，故十三岁闭口不语欲避尘劳，却被婆罗门诬为恶子当生埋，吾不忍父王得罪乃开口显异，拒还宫继位，弃荣修道终至成佛
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E6%9C%AC%E7%BC%98%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%A4%AA%E5%AD%90%E6%85%95%E9%AD%84%E7%BB%8F.html
endeavors:
- id: guji-慕魄-endeavor-1
  title_zh: 十三年闭口静默避尘劳
  summary_zh: 追忆前世须念王微阙堕狱之苦，质朴如枯木闭口十三年，遭疑谤而临生埋之难
  phases:
  - key: brewing
    name: 生知宿命立志无言
    labels:
      zh: 忆狱苦发厌离
    start_date: -1013
    highlight_event_id: guji-慕魄-event-birth
  - key: breakthrough
    name: 十三年如盲聋喑哑
    labels:
      zh: 静默避缘
    start_date: -1005
    highlight_event_id: guji-慕魄-event-silence
  - key: climax
    name: 被诬恶子议定生埋
    labels:
      zh: 群迷共弃
    start_date: -1000
    highlight_event_id: guji-慕魄-event-pit
  - key: closure
    name: 车上自念将陷诳杀
    labels:
      zh: 悲悯愚惑
    start_date: -1000
    highlight_event_id: guji-慕魄-event-pit
  decisions:
  - date: -1013
    title_zh: 立志闭口不语
    rationale: 追念过世吉凶成败及地狱剧苦，恐复与会，冀以静默免瑕脱秽永辞于俗
  - date: -1000
    title_zh: 取衣宝自往坑所显身
    rationale: 见王以下皆谓我聋痴，若默然被埋将使父王得大重罪，故当现身发言止恶
- id: guji-慕魄-endeavor-2
  title_zh: 开口拒位弃国求道成佛
  summary_zh: 水边显神异说法，拒父王迎还继位之请，陈须念王旧事明轮回可畏，出家专精终成佛度众
  phases:
  - key: brewing
    name: 坑边现形惊众
    labels:
      zh: 开口显异
    start_date: -1000
    highlight_event_id: guji-慕魄-event-speech
  - key: breakthrough
    name: 王与国人迎观化园
    labels:
      zh: 天化园观转作道人
    start_date: -1000
    highlight_event_id: guji-慕魄-event-speech
  - key: climax
    name: 树下拒位陈狱因缘
    labels:
      zh: 说须念王旧狱
    start_date: -1000
    highlight_event_id: guji-慕魄-event-renounce
  - key: closure
    name: 得放行专精成佛
    labels:
      zh: 拯济未度
    start_date: -1000
    highlight_event_id: guji-慕魄-event-death
  decisions:
  - date: -1000
    title_zh: 拒还宫继位理政
    rationale: 畏厌地狱勤苦，视世间恍惚如梦，国财恩爱皆为累，使我为王当复憍泆为天下大患
  - date: -1000
    title_zh: 弃国捐王一心求道
    rationale: 欲除忧弃离尘累，反流索源拯济未度，不贪富贵思想大道高翔远逝
events:
- id: guji-慕魄-event-birth
  date: -1013
  year_of: -1013
  title_zh: 生为波罗奈太子名慕魄
  description_zh: 颜貌端正自识宿命无数劫善恶报应，年十三闭口不语
- id: guji-慕魄-event-silence
  date: -1005
  year_of: -1005
  title_zh: 十三年质朴如枯木遭婆罗门诬谤
  description_zh: 父王问婆罗门，婆罗门言恶子防固当生埋，王与群臣议弃深坑
- id: guji-慕魄-event-pit
  date: -1000
  year_of: -1000
  title_zh: 被载出城掘坑将埋
  description_zh: 母悲恋送衣被璎珞，仆掘坑未竟，慕魄自取衣宝往水边洗浴著衣
- id: guji-慕魄-event-speech
  date: -1000
  year_of: -1000
  title_zh: 坑边自认开口成章天人毕集
  description_zh: 自称即是慕魄，音声威神光景如月，飞鸟走兽皆来伏听，仆驰白王
- id: guji-慕魄-event-renounce
  date: -1000
  year_of: -1000
  title_zh: 拒王位说须念王堕狱弃国求道
  description_zh: 陈前世须念王烹杀得罪六万岁狱苦，明世梦幻国位为累，得放行修道
- id: guji-慕魄-event-death
  date: -0900
  year_of: -0900
  title_zh: 累功成佛度众入灭
  description_zh: 一心专精念道修德功勋累积遂成佛，复度十方天人不可称计
