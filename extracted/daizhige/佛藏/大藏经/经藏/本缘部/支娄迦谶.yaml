  archetype: 西来译经开山者
  dilemmas:
  - 胡汉言语隔阂而大乘深义难传
  - 般若深奥与譬喻浅近如何兼顾化俗
  - 羁旅洛阳而道俗信疑未定当去留如何
  lesson: 以异域之身弘道中土，当以诚信达义为本，不厌浅近譬喻以度群迷，方能开大乘于东土
  summary_first_person: 我本月支沙门，西来洛阳，见汉土未闻大乘般若，故竭力译出道行般若与般舟三昧，又以杂譬喻方便接引，愿以浅言喻深法，令众生离苦得度，虽言语迂涩而初心不改
