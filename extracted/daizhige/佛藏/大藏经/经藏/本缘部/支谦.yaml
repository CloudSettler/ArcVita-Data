  dilemmas:
  - title_zh: 以居士身译梵典如何取信
    description_zh: 身为月支居士而非沙门，流寓吴地，须以精通汉梵清信持戒方能开译场摄众
  - title_zh: 如何辨恶师与明师
    description_zh: 末世有卖戒贪供养谤师者，须劝人敬师重法，并开许悔改重从明师受戒
  lesson: 敬师重戒不贪供养不谤道师，误值恶师当悔改湔洗重受具戒，方免如猘狗啮主堕泥犁之苦
  summary_first_person: 我是月支国居士支谦，随祖避乱入吴，通汉梵之学，居建业译经弘法，译佛说猘狗经等八十余部，劝世人敬师持戒，慎卖戒贪利与诽谤师尊之过
  source_urls:
