  decisions:
  - date: '0240'
    title_zh: 峻呵阿谀随人不授杀酒戒者
    rationale: 不勤学无智慧而贪钱财谷帛以卖戒者，乃持人著泥犁，负佛明教，故须峻呵
  - date: '0250'
    title_zh: 开许发意误从恶师者重受戒
    rationale: 初发意心常曚冥为恶师所误实自不知，我法旷大可得悔更自湔洗始为入法
