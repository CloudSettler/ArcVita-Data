    title_zh: 定居建业专事译经
    rationale: 吴地初弘梵典乏人，欲以居士通汉梵之长，依佛威神传经戒开度人民
  - date: '0230'
    title_zh: 先译猘狗经明师道
    rationale: 见受戒者嫉谤其师卖戒贪利之弊，故先译此经以警敬师重戒之义
- id: guji-支谦-endeavor-2
  title_zh: 授戒摄众辨师邪正
  summary_zh: 演说持戒授受之法，呵卖戒取财与谤师之过，开许误从恶师者悔改重受
