  lesson: 以信达传灯不计身名借灌顶三王不忘初心示译业亦当念念不忘本愿
  summary_first_person: 吾本西域来者奉宋帝诏入译经院与众共译佛说灌顶王喻等经以三王受灌顶终身不忘为喻示苾刍出家见道证果三时常念修证吾愿所译一字一句皆令后学不忘本愿
