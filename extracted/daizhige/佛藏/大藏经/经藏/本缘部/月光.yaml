events:
- id: guji-月光-event-birth
  title_zh: 贤石城生为月光天子
  type: birth
  date: '-1000'
  year_of: -1000
  place_zh: 北印度贤石城
  description_zh: 寿四万岁具天眼宿命身如满月光照不用灯烛统四洲六万八千国
- id: guji-月光-event-giving
  title_zh: 四门普施济南赡部洲
  type: achievement
  date: '-1000'
  year_of: -1000
  place_zh: 贤石城四门市肆
  description_zh: 堆聚金银象马饮食击鼓普施复以细妙衣宝令众皆如我身城如忉利
- id: guji-月光-event-omen
  title_zh: 二相恶梦恶眼来乞头
  type: achievement
  date: '-1000'
  year_of: -1000
  place_zh: 贤石城王宫
  description_zh: 大月持地梦王冠黑四体散婆罗门占必有远人来乞王头护城天人劝保身王反踊跃欲满檀度
- id: guji-月光-event-head
  title_zh: 摩尼苑瞻卜树下舍头
  type: achievement
  date: '-1000'
  year_of: -1000
  place_zh: 摩尼宝藏苑瞻卜树下
  description_zh: 以发系无忧树枝执剑自断其头三千界动天雨花香发愿不求轮王生天但求无上正觉
- id: guji-月光-event-death
  title_zh: 焚身收舍利起塔供养
  type: death
  date: '-1000'
  year_of: -1000
  place_zh: 摩尼宝藏苑及四衢路
  description_zh: 以旃檀焚遗体收舍利如白芥子建大塔于苑及衢路令礼拜者命终生天发菩提心佛言即我前身
