endeavors:
- id: guji-栴檀摩提-endeavor-1
  title_zh: 济贫布施卖身求财大施天下
  summary: 游园见贫施尽所有，乞中藏不果，自卖裴提舍得金施贫，因牛头栴檀愈王疾得半国，开藏大施五十日，还国施贫一年
  phases:
  - key: brewing
    name: 游园见贫施尽所有
    labels:
      zh:
