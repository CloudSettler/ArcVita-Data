      - 半国布施
    start_date: -2983-06-01
    highlight_event_id: guji-栴檀摩提-event-giving
  - key: closure
    name: 还国开藏施贫一年
    labels:
      zh:
      - 乌鸟衔书
      - 还国大施
    start_date: -2982-01-01
    highlight_event_id: guji-栴檀摩提-event-giving
  decisions:
  - date: -2984-01-01
    title_zh: 乞藏不果决意自卖身
    rationale: 国库备急不可私用，贫者犹多志愿不遂，唯有卖己爱身救彼饥贫之苦
  - date: -2983-06-01
    title_zh: 以国还王求施五十日
    rationale: 不乐异国王位，好乐布施，愿以国奉还，换中藏财物周给天下孤老病苦共植功德
- id: guji-栴檀摩提-endeavor-2
  title_zh: 山居学道舍身饲虎起塔度众
  summary: 上山供养勇猛仙人留住学道，却服拒还，见雪中饿虎母子将死，发愿满千身投崖饲虎，收舍利起七宝塔愈众病
  phases:
  - key: brewing
    name: 上山供养留住学道
    labels:
      zh:
      - 供养仙众
      - 乐求无为
    start_date: -2975-01-01
    highlight_event_id: guji-栴檀摩提-event-cultivate
  - key: breakthrough
    name: 解饰却服坚志不还
    labels:
      zh:
      - 观欲如狱
      - 拒还守志
    start_date: -2974-01-01
    highlight_event_id: guji-栴檀摩提-event-cultivate
  - key: climax
    name: 投身崖下饲饿虎母子
    labels:
      zh:
      - 舍身饲虎
      - 满千身愿
    start_date: -2960-01-01
    highlight_event_id: guji-栴檀摩提-event-death
  - key: closure
    name: 收骨阇维起塔供养
    labels:
      zh:
      - 收舍利
      - 起宝塔愈病
    start_date: -2960-02-01
    highlight_event_id: guji-栴檀摩提-event-stupa
  decisions:
  - date: -2974-01-01
    title_zh: 解璎珞留山不还国
    rationale: 万物无常室家离别则苦，求无为欲度众苦得道先度父母，不碎身于此终不空还
  - date: -2960-01-01
    title_zh: 缠目合掌投身虎前
    rationale: 昔愿舍身千数已满九百九十九，今正是时救众生命速成菩提，以不净苦身换金刚法身
events:
- id: guji-栴檀摩提-event-birth
  title_zh: 乾陀摩提国太子生
  date: -3000-01-01
  year_of: -3000
  location_zh: 乾陀摩提国王宫
  description: 过去九劫无佛时，乾陀尸利王与差摩目佉夫人生太子栴檀摩提，慈仁智慧通达群籍道术，常好布施无所遗惜
- id: guji-栴檀摩提-event-sell
  title_zh: 自卖裴提舍得金施贫
  date: -2984-01-01
  year_of: -2984
  location_zh: 裴提舍国婆罗门家
  description: 乞中藏不果得阇耶十千钱复施不足，却珍宝衣着故服默出宫城，自卖与婆罗门得千金钱尽施贫人，后奴斫薪得牛头栴檀一段重一百斤
- id: guji-栴檀摩提-event-giving
  title_zh: 开藏大施五十日还国施一年
  date: -2983-06-01
  year_of: -2983
  location_zh: 裴提舍国及乾陀摩提国
  description: 持栴檀奉裴提舍王愈癞病得半国，以国还王求中藏财物布施贫人满五十日，托乌鸟衔书报父母，还国于大路施贫一年日日不绝
- id: guji-栴檀摩提-event-cultivate
  title_zh: 上山供养留住学道不还
  date: -2974-01-01
  year_of: -2974
  location_zh: 城北山勇猛仙人大岩窟
  description: 赍百味饮食上山供养五通仙师勇猛及五百弟子，观宫室如地狱妻子如杻械，解璎珞车马遣还，披鹿皮衣从师攒寻道术，母后来迎坚志不还
- id: guji-栴檀摩提-event-death
  title_zh: 投身饲饿虎母子而终
  date: -2960-01-01
  year_of: -2960
  location_zh: 山下绝崖深谷虎产处
  description: 大雪虎母新产七子多日不得食饥逼将啖子，太子入定得无生忍辞师，发愿速成菩提得金刚身，以鹿皮缠头目合掌投身虎前，虎母得食母子俱活，天雨曼陀罗华地动
- id: guji-栴檀摩提-event-stupa
  title_zh: 收舍利起七宝塔愈众病
  date: -2960-02-01
  year_of: -2960
  location_zh: 山谷口平坦地菩萨投身饿虎塔
  description: 王与夫人后妃吏民奔山收骸骨，积栴檀香薪阇维取舍利以宝器盛，起七宝塔纵广十里种华果凿浴池，四部伎人昼夜供养，癞病颠狂聋盲躄跛礼塔忏悔百日皆愈
