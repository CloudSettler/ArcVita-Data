  birth_date: -3000-01-01
  death_date: -2960-01-01
  era: 过去九劫无佛时乾陀摩提国
  reign_ref: 父王乾陀尸利在位时
  archetype: 布施舍身菩萨
  dilemmas:
  - title_zh: 国藏有限而贫苦无量
    description: 尽己所有犹不周足，当守库藏安分还是舍国卖身求财普济
  - title_zh: 宫室亲情与山林求道
    description: 父母后妃悲泣迎归，当还宫承嗣安亲还是留山学道求无为度众
  - title_zh: 爱惜身命与救虎母子
    description: 虎母雪困饥逼将啖七子，当坐视生死还是投身饲虎满千身誓愿
  lesson: 以身命财无所遗惜行檀波罗蜜，慈悲平等普覆众生，呵责不净身换金刚常乐法身，超越九劫速成菩提
  summary_first_person: 我是乾陀摩提国太子栴檀摩提，见贫穷孤老求不得苦，便尽施所有，自卖他国得财布施，又开藏大施五十日，还国施贫一年，后留山学道，投身饲饿虎母子，以舍利起塔愈众病，前后舍身满千，超越本师弥勒九劫成佛
