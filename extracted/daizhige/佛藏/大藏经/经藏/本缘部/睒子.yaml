  summary_first_person: 我名睒子生于迦夷盲亲之家七岁奉十善事亲如天十岁劝亲不违本誓共入深山结庐奉果汲泉兽鸟和合后为王误射不恨王罪唯忧盲亲蒙天药得活亲目复明王受戒我乃知孝慈可通天地前世之身即今佛身
