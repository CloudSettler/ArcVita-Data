  decisions:
  - date: -1000-05-20
    title_zh: 不恨王罪托养父母
    rationale: 非王之过乃宿罪所致，不惜身命但怜盲亲无依，愿王代养灭罪得福
  - date: -1000-05-21
    title_zh: 劝王还国安民奉戒
    rationale: 欲兴福者勿射猎横杀无辜，当安慰人民奉戒，恩爱暂有莫恃自在造恶
events:
- id: guji-睒子-event-birth
  title_zh: 托生盲父母家名睒子
  date: -1020-01-01
  year_of: -1020
  place_zh: 迦夷国长者家
  description_zh: 菩萨一切妙行念盲夫妇入山艰难，寿终往生其家为子，父母欢喜，年十岁号曰睒子，奉行十善孝如事天
- id: guji-睒子-event-foster
  title_zh: 散财入山奉养二亲
  date: -1010-03-01
  year_of: -1010
  place_zh: 迦夷国深山草屋
  description_zh: 睒劝父母践本誓，散家财施贫，与父母俱入山，以柴草作屋施置床褥，常取百种果蓏泉水奉亲，禽兽驯伏飞鸟作乐
- id: guji-睒子-event-shot
  title_zh: 泉边取水误中王箭
  date: -1000-05-20
  year_of: -1000
  place_zh: 山中泉水边
  description_zh: 睒著鹿皮衣提瓶取水，王见麋鹿引弓误中睒胸，毒箭甚痛，大风拔木飞鸟悲鸣，王悔拔箭不果，睒托王善护盲亲
- id: guji-睒子-event-death
  title_zh: 中箭暂死父母号呼
  date: -1000-05-20
  year_of: -1000
  place_zh: 山中草屋尸前
  description_zh: 王去后睒奄逝，百鸟绕尸舐血，王牵盲父母至尸上抱头抱脚，父母誓言若睒至孝天地所知当拔箭复生，帝座为动
- id: guji-睒子-event-revive
  title_zh: 天药复生父母复明化王
  date: -1000-05-21
  year_of: -1000
  place_zh: 山中草屋前
  description_zh: 帝释梵王来以神妙药灌口，箭拔毒出更生如故，父母两目皆开，风息日光泉涌花开，王礼谢愿献国供养，睒劝王还国安民奉戒止杀，随从悉奉五戒修十善
