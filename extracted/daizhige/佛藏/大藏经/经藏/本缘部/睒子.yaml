  decisions:
  - date: -1010-03-01
    title_zh: 散财劝亲入山
    rationale: 人居世间无常百变，不以子故绝本愿，愿奉亲俱入深山两全孝道
  - date: -1009-01-01
    title_zh: 鹿皮提瓶取水奉亲
    rationale: 父母渴欲饮则亲往泉边，与麋鹿飞鸟同饮不相畏，以时奉养不失节
- id: guji-睒子-endeavor-2
  title_zh: 中箭舍身感天化王
  summary_zh: 取水误中王毒箭，临终托王善护盲亲，父母誓愿感帝释，神药复生父母复明，王悔过止杀奉戒
  phases:
