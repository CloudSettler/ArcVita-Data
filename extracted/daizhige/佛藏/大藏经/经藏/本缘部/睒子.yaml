endeavors:
- id: guji-睒子-endeavor-1
  title_zh: 散财入山孝养盲父母
  summary_zh: 七岁奉十善，十岁劝父母入山，散财施贫，以蒲草作屋，取果汲水，令父母安隐，山中果茂泉涌禽兽驯服。
  phases:
  - key: brewing
    name: 劝亲入山
    labels:
      zh: 发愿求寂
    start_date: -1193-01-01
    highlight_event_id: guji-睒子-event-enter-mountain
  - key: breakthrough
    name: 筑室安亲
    labels:
      zh: 孝养安居
    start_date: -1192-01-01
    highlight_event_id: guji-睒子-event-support-parents
  - key: closure
    name: 山林和调
    labels:
      zh: 慈化群生
    start_date: -1191-01-01
    highlight_event_id: guji-睒子-event-support-parents
  decisions:
  - date: -1193-01-01
    title_zh: 散尽家财入山
    rationale: 命非金石无常迅速，不以子故绝本愿，愿奉亲俱入清净
  - date: -1192-01-01
    title_zh: 着鹿皮衣日取果水
    rationale: 盲亲年老目盲无依，唯以孝养令其无忧，昼夜精进如事天
- id: guji-睒子-endeavor-2
  title_zh: 中箭舍命感天劝王止杀
  summary_zh: 取水被迦夷王误射，忍毒痛托王护亲，盲亲舐疮发愿，帝释持神药救活，父母眼开，劝王还国持戒化民。
  phases:
  - key: brewing
    name: 汲水遇难
    labels:
      zh: 误中 ___毒箭
    start_date: -1181-06-01
    highlight_event_id: guji-睒子-event-shot
  - key: climax
    name: 托亲忏悔
    labels:
      zh: 舍命念亲
    start_date: -1181-06-01
    highlight_event_id: guji-睒子-event-shot
  - key: closure
    name: 复活化王
    labels:
      zh: 感天劝善
    start_date: -1181-06-02
    highlight_event_id: guji-睒子-event-revive
  decisions:
  - date: -1181-06-01
    title_zh: 不恨王罪唯托养亲
    rationale: 自知宿罪所致不惜身命，但怜盲亲衰老无依，愿王代养以全孝
  - date: -1181-06-02
    title_zh: 劝王还国持戒止猎
    rationale: 射猎夭伤虫兽现世不安寿尽堕泥犁，愿举国奉五戒修十善
events:
- id: guji-睒子-event-birth
  type: birth
  title_zh: 生于盲长者家名睒
  date: -1200-01-01
  year_of: -1200
  location_zh: 迦夷国
  summary_zh: 兜术天菩萨寿尽下生，为无子盲夫妻作子，年七岁号睒，奉十善孝养如事天。
- id: guji-睒子-event-enter-mountain
  type: career
  title_zh: 与父母俱入深山学道
  date: -1193-03-01
  year_of: -1193
  location_zh: 深山草屋
  summary_zh: 以家中所有施诸贫穷，与父母入山，以蒲草作屋施设床褥，众果丰茂泉水涌出。
- id: guji-睒子-event-support-parents
  type: career
  title_zh: 日取百果泉水供亲二十余年
  date: -1192-05-01
  year_of: -1192
  location_zh: 山中泉边
  summary_zh: 常取百种果蓏饮泉水供亲，着鹿皮衣提瓶取水，麋鹿众鸟不相畏，虎狼毒兽皆慈心不害。
- id: guji-睒子-event-shot
  type: career
  title_zh: 汲水被迦夷王误射中胸
  date: -1181-06-01
  year_of: -1181
  location_zh: 山中水边
  summary_zh: 王入山射鹿箭误中睒胸，大风折树百鸟悲鸣，王悔责拔箭不果，睒指示草屋托王护亲遂奄然逝。
- id: guji-睒子-event-revive
  type: career
  title_zh: 盲亲发愿帝释救活父母眼开
  date: -1181-06-02
  year_of: -1181
  location_zh: 山中尸前
  summary_zh: 盲父母抱尸舐疮愿代死，忉利震动帝释持神药灌口箭出复活，父母两目皆开，风息日朗，王礼敬受教还国令民持戒。
- id: guji-睒子-event-death
  type: death
  title_zh: 复活后终老山中示寂
  date: -1180-01-01
  year_of: -1180
  location_zh: 深山
  summary_zh: 得活后与父母终保年寿，天龙护助，后寿尽而逝，宿命为释迦前身，盲父为净饭王，盲母为摩耶，王为阿难，帝释为弥勒。
