  era: 上古传说
  reign_ref: 迦夷国王时
  archetype: 至孝菩萨
  dilemmas:
  - 本愿入山求空寂与幼年奉养盲亲之两全
  - 身被毒箭命可舍与盲亲衰老无依之不忍
  lesson: 至孝精诚可感天地神明，慈心能化强暴止杀，奉亲即是修道
  summary_first_person: 我前世名一切妙行，在兜率教授天人，见迦夷国盲夫妇愿入山而两目俱盲，便托生为其子名睒，十岁散财奉亲入山，结草屋取百果汲泉水娱乐二亲，后误中王箭不恨王，但怜父母衰老无依，感帝释以神药复生，父母复明，王改恶修善，我以此孝慈渐成三界尊
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E6%9C%AC%E7%BC%98%E9%83%A8/%E4%BD%9B%E8%AF%B4%E7%9D%92%E5%AD%90%E7%BB%8F%E4%B9%8B%E4%BA%8C.html
