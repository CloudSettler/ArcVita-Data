  lesson: 以至孝慈心奉养父母止杀行善感动天地
  summary_first_person: 我前世名睒，与盲父母入山学道，以蒲草作屋，取百果泉水以养亲，履地恐地痛，兽鸟皆相亲，后取水被王误射，不恨王罪，唯忧盲亲无依，孝心感动帝释得活，父母眼开，遂劝王止猎持戒。
