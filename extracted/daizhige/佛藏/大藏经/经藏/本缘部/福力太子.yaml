    title_zh: 以真实语愿令饿鬼见食
    rationale: 悭吝业障不见饮食当以福报大力真实加持令见食饱满离苦
  - date: -0975-01-01
    title_zh: 断自身手足续治罚人
    rationale: 他苦即我苦当弃舍自身支分填续其断处以善根回向无上正觉度彼安乐涅槃
events:
- id: guji-福力太子-event-birth
  date: -1000-01-01
  year_of: -1000
  title_zh: 广照后诞福力太子天雨珍宝
  description_zh: 眼力王广照后怀胎时天降珍宝师子座现十月满足日初出时诞太子大地六动天雨七宝衣服妙华四大天王奉师子座帝释覆盖五大藏开现百象百牛至王为立名福力授八母养育
  place_zh: 眼力王宫
- id: guji-福力太子-event-debate
  date: -0980-01-01
  year_of: -980
  title_zh: 园林与四兄辩论何业多获义利
  description_zh: 与色相精进工巧智慧四兄出游园苑论色相工巧精进智慧孰胜太子言若无福力诸作不成福是纯一可意适悦果能获色相富贵智慧善趣具说诸福事约兄潜适他国证验
  place_zh: 园林中
- id: guji-福力太子-event-sojourn
  date: -0979-01-01
  year_of: -979
  title_zh: 潜适他国各凭所长得养
  description_zh: 易装饰入他国色相者以瞻睹生悦得富盛精进者取河中旃檀香树货易获利工巧者以巧作得供智慧者以解怨附财者得衣食财宝各受用资养
  place_zh: 他国
- id: guji-福力太子-event-feed-hungry
  date: -0978-02-01
  year_of: -978
  title_zh: 天降饮食饲针口饿鬼生兜率
  description_zh: 中路见无数千针口饿鬼羸瘦炽焰求食太子念天降食授之业障不见复以真实语令悉见食恣取饱满身力完具面如人命终皆生兜率天空中称谢威神建立
  place_zh: 山半腹道中
- id: guji-福力太子-event-poorhouse
  date: -0978-06-01
  year_of: -978
  title_zh: 入贫舍现吉祥以四摄普摄众
  description_zh: 过贫人舍入其中舍忽金宝财谷充盈华果开实甘雨调适随念现珍宝乐具给来者以布施爱语利行同事平等摄持名称普闻国邑聚落
  place_zh: 贫人舍
- id: guji-福力太子-event-save-prisoner
  date: -0975-01-01
  year_of: -975
  title_zh: 断血肉手足救治罚人发菩提愿
  description_zh: 见国王治罚善医者断手足流血楚毒太子破身出血授饮取刀断己手足置其断处发真实愿令支节相合平复如故帝释化婆罗门证验太子说伽陀身复如故天雨华奏乐大地六动愿以善根成无上正觉授法味令住涅槃
  place_zh: 他国刑场
- id: guji-福力太子-event-death
  date: -0930-01-01
  year_of: -930
  title_zh: 示寂传略其终经未载
  description_zh: 本缘经止于舍身发愿成佛之事未载示寂时处传略其终以全始终
  place_zh: 未详
