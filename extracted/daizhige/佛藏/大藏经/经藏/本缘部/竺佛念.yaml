    title_zh: 应太尉姚旻之请出译出曜
    rationale: 法句不全出曜未具长怀在心逢笃诚乐法之请则不俟驾而出使旧阙得补
  - date: '0398-09-01'
    title_zh: 澄执梵本己宣译不自专断
    rationale: 时不有怙从本而已守信不饰与笔受正义二师共成使义味成就无留滞
