  title_zh: 生于月氏
  date: '0231'
  year_of: 231
  description: 约魏嘉平时生于月氏八岁出家诵经日万言
- id: guji-竺法护-event-west
  title_zh: 西行求法得梵本归
  date: '0266'
  year_of: 266
  description: 西晋泰始中西游诸国遍历西域得大乘梵本携归敦煌洛阳
- id: guji-竺法护-event-translate
  title_zh: 译出生经弘本生法
  date: 0285
  year_of: 285
  description: 于长安洛阳译出生经等说那赖仙人化方迹王及水鳖猕猴诸本生以明离欲
- id: guji-竺法护-event-death
  title_zh: 卒于洛阳
  date: 0308
  year_of: 308
  description: 永嘉之乱前示寂于洛阳一生译经百余部生经流传后世
