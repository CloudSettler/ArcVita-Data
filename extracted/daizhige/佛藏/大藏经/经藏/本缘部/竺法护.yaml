  lifespan:
    birth:
      date: '0231'
      precision: year
      is_circa: true
      raw: 约魏齐王嘉平三年生于月氏
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约西晋怀帝永嘉二年卒于洛阳
  birth_date: '0231'
  death_date: 0308
  era: 西晋
  reign_ref: 西晋武帝泰始至怀帝永嘉
  archetype: 译经弘法者
  dilemmas:
  - 胡汉语言隔阂而坚持传译大乘本缘以化导时俗
  - 世乱西行艰险而舍安就道求法携经东归
  lesson: 离欲修梵以度生死唯依正法勤求广译方能化导群迷
  summary_first_person: 吾本月氏居士舍俗出家西行求法携经东归译出生经诸部但愿离欲清净普令众生开解
  source_urls:
  - https://daizhige.org/fo-zang/da-zang-jing/jing-zang/ben-yuan-bu/sheng-jing.html
