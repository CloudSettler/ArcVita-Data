endeavors:
- id: guji-竺法护-endeavor-1
  title_zh: 西行求法携经东归
  summary: 幼怀慧颖出家学道西游诸国求得大乘梵本携归中夏为后译经奠基
  phases:
  - key: brewing
    name: 幼年出家立志求法
    labels:
      zh: 立志
    start_date: 0239
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 西游越境得遇梵本
    labels:
      zh: 西游
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-west
  - key: climax
    name: 携经东归至于敦煌
    labels:
      zh: 东归
    start_date: '0270'
    highlight_event_id: guji-竺法护-event-west
  - key: closure
    name: 安住洛阳筹备翻译
    labels:
      zh: 安住
    start_date: '0272'
    highlight_event_id: guji-竺法护-event-translate
  decisions:
  - date: '0266'
    title_zh: 决意西行求梵本
    rationale: 中夏经阙非亲往西域不得大乘本缘全本故冒难西行
  - date: '0270'
    title_zh: 携经归汉不留异域
    rationale: 念中土众生未闻正法故不贪异域安乐持经东归弘化
- id: guji-竺法护-endeavor-2
  title_zh: 翻译生经弘扬本生离欲之道
  summary: 在长安洛阳敦煌等地广译大乘译出生经五卷宣说离欲梵行本生因缘
  phases:
  - key: brewing
    name: 精通胡汉招集笔受
    labels:
      zh: 筹译
    start_date: '0272'
    highlight_event_id: guji-竺法护-event-translate
  - key: breakthrough
    name: 首译本缘晓示爱欲之患
    labels:
      zh: 首译
    start_date: 0285
    highlight_event_id: guji-竺法护-event-translate
  - key: climax
    name: 生经五卷流通教化
    labels:
      zh: 流通
    start_date: 0290
    highlight_event_id: guji-竺法护-event-translate
  - key: closure
    name: 以译显戒功成身退
    labels:
      zh: 功成
    start_date: '0305'
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0285
    title_zh: 先译本缘以断爱欲
    rationale: 见时俗贪著情色如方迹王与族姓子故先译那赖等缘以蠲欲患
  - date: 0290
    title_zh: 广译不辍不求供养
    rationale: 愍念和难为衣食说法堕俗故坚持道义翻译不以利养弘经
events:
