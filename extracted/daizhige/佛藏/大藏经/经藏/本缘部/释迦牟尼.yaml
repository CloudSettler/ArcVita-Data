    title_zh: 决定行七步自称天人师
    rationale: 以七觉意消七使垢示四谛法明此为末后身当得最难得道以坚定天人信解
  - date: -563-04-08
    title_zh: 决定受天龙浴护而不辞
    rationale: 顺诸天敬心令生欢喜以慈悲摄受开度三界九道同归灭度
