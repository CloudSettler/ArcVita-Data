endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 迦毗罗卫诞育与宫廷抚育
  description_zh: 白净王与摩耶夫人感瑞怀孕，于蓝毗尼园诞太子，相师阿私陀记当成佛，举国欢喜大赦，太子备众德义故名悉达罗他，母终由姨母瞿昙弥抚育，聪达超师，父王立清净宫以五欲留之。
  phases:
  - key: brewing
    name: 释迦王族积德待生
    labels:
      zh: 王族积善
    start_date: -0564-01-01
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: breakthrough
    name: 蓝毗尼园诞生圣子
    labels:
      zh: 诞生显瑞
    start_date: -0563-04-08
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: climax
    name: 相师授记命名悉达罗他
    labels:
      zh: 授记命名
    start_date: -0563-04-18
    highlight_event_id: guji-释迦牟尼-event-naming
  - key: closure
    name: 深宫抚育婚生罗睺罗
    labels:
      zh: 宫廷婚育
    start_date: -0544-01-01
    highlight_event_id: guji-释迦牟尼-event-marriage
  decisions:
  - date: -0563-04-18
    title_zh: 依经方论祠天施福护子
    rationale: 生子满十日依世间法广施贫乏祠神祈福，令太子安隐长养以绍王嗣
  - date: -0545-01-01
    title_zh: 纳耶输陀罗为妃以留其心
    rationale: 见太子志高远性安重，广访豪族礼义之家纳妃造清净宫，以世荣五欲诱导不令出家
- id: guji-释迦牟尼-endeavor-2
  title_zh: 出游观苦与厌患初萌
  description_zh: 太子慕闲旷野乐出园林，父王敕治王路除老病秽恶，净居天化作老人在道侧，太子惊问御者始知衰老皆然，长叹厌离，宫廷音乐园林不能悦心，为后日出家求道张本。
  phases:
  - key: brewing
    name: 严饰王路思乐出游
    labels:
      zh: 思游
    start_date: -0535-01-01
    highlight_event_id: guji-释迦牟尼-event-outing
  - key: breakthrough
    name: 道侧初见衰老之相
    labels:
      zh: 见老
    start_date: -0535-03-01
    highlight_event_id: guji-释迦牟尼-event-outing
  - key: climax
    name: 询御者悟人皆当老
    labels:
      zh: 悟老
    start_date: -0535-03-01
    highlight_event_id: guji-释迦牟尼-event-outing
  - key: closure
    name: 长叹厌患不乐世荣
    labels:
      zh: 厌患
    start_date: -0535-04-01
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -0535-03-01
    title_zh: 坚持出城游观园林
    rationale: 常慕闲旷如系狂象，闻园林清凉花果音乐而踊悦，启请父王严驾出游以观世间实相
  - date: -0535-03-01
    title_zh: 穷问老相不避真实
    rationale: 见老人头白背偻目冥战摇而惊怪，不受隐瞒逼御者说真言，由是悟婴儿壮年皆归枯朽而生厌离
events:
- id: guji-释迦牟尼-event-birth
  type: birth
  date: -0563-04-08
  year_of: -563
  title_zh: 蓝毗尼园诞生
  location_zh: 蓝毗尼园
  description_zh: 四月八日摩耶夫人游蓝毗尼园，菩萨从右胁生，行七步自言此生为佛生当度一切，天雨净水灌顶，光明普照，龙天欢喜，唯魔王忧恼。
- id: guji-释迦牟尼-event-naming
  type: naming
  date: -0563-04-18
  year_of: -563
  title_zh: 满十日命名悉达罗他
  location_zh: 迦毗罗卫王宫
  description_zh: 生子满十日安隐心泰，普祠天神广施沙门婆罗门及贫乏，以备众德义故名悉达罗他，阿私陀仙人观足下千辐轮等相，记必成正觉而自悲老不及闻法。
- id: guji-释迦牟尼-event-marriage
  type: marriage
  date: -0544-01-01
  year_of: -544
  title_zh: 纳耶输陀罗生罗睺罗
  location_zh: 迦毗罗卫清净宫
  description_zh: 太子年长德貌清明，父王为立宏丽清净宫，纳端正女耶轮陀罗为妃同处欢娱，后孕生罗睺罗，王喜宗嗣有继以为不复出家。
- id: guji-释迦牟尼-event-outing
  type: outing
  date: -0535-03-01
  year_of: -535
  title_zh: 出游见老人发厌离
  location_zh: 迦毗罗卫城外王路
  description_zh: 父王严饰王路除老病残贫，太子轩车出游，净居天化衰老相在道侧，太子问御者知色变气微皆名衰老，本为婴儿长养而终为老坏，遂长叹知吾等亦当然。
- id: guji-释迦牟尼-event-death
  type: death
  date: -0483-02-15
  year_of: -483
  title_zh: 拘尸那罗涅槃
  location_zh: 拘尸那罗娑罗林
  description_zh: 成道后弘法四十余年，为尽生故生已度无量众生，于娑罗林下入涅槃，示现无常以显解脱，众生依正法得度生死苦海。
