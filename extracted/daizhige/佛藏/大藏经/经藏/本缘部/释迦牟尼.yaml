    rationale: 在宫不乐伎乐愦闹志趣山林清净随顺王意就学书疏以系念观机
events:
- id: guji-释迦牟尼-event-shouji
  title_zh: 散五华供锭光佛得记释迦文
  date: -0723-04-01
  year_of: -723
  place: 提和卫国锭光佛会下
  description: 儒童无垢光以五百银钱买五茎花散佛成盖布发供蹈佛记却后百劫当得作佛名释迦文劫名波陀世界名沙桴父母妻侍弟子皆预记
- id: guji-释迦牟尼-event-rutai
  title_zh: 化乘白象降神母胎摩耶感梦
  date: -0624-04-08
  year_of: -624
  place: 迦维罗卫白净王宫
  description: 能仁菩萨于兜术观已化乘白象来就母胎用四月八日夫人梦见白象光明照天下来在我上相师占言当为飞行皇帝或出家成佛
- id: guji-释迦牟尼-event-birth
  title_zh: 四月七日右胁诞生行七步称尊
  date: -0623-04-07
  year_of: -623
  place: 迦维罗卫流民树下
  description: 十月已满夫人游过流民树下攀枝从右胁生堕地行七步举手言天上天下唯我为尊三界皆苦吾当安之天地大动龙王浴身释梵侍卫天降三十二瑞名悉达太子
- id: guji-释迦牟尼-event-xiangtai
  title_zh: 香山阿夷飞来占相断必成佛
  date: -0623-04-15
  year_of: -623
  place: 迦维罗卫王宫
  description: 道士阿夷见瑞飞来抱太子见三十二相八十种好断必成佛自悲七日当终不见说法以偈广说足轮鹿腨广舌肉髻等相福王为起四时殿育养
- id: guji-释迦牟尼-event-death
  title_zh: 示现涅槃
  date: -0543-02-15
  year_of: -543
  place: 拘尸那
  description: 依传统示寂之期本经止于试艺育养未载涅槃此备终寿以全传记
