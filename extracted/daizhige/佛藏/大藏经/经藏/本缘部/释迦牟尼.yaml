  - 母恩爱恋嫪与宿愿令子为道之间的取舍
  - 童身微小与承受九龙灌顶授记大法的承担
  lesson: 宿愿不违可感圣应，发无上道意能令十方震动
  summary_first_person: 我忆过去世为小儿时，母见过去佛分卫发愿令我为沙门，我年七岁出家，蒙九龙浴手华盖现佛，佛笑授记我十四劫后当作佛，母以饭供饱十方佛僧，今世功德如是皆由宿愿成就。
