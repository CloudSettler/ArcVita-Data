    rationale: 法海已满法幢已立应可度者甚多故念昔为法不顾身命今当润济枯槁之类
  - date: -0527-06-01
    title_zh: 往波罗奈鹿野苑说法
    rationale: 三宝因转法轮乃现人天龙神得覆护故先度应度令脱生死
  - date: -0520-01-01
    title_zh: 遣阿难请王赦老母二子令出家
    rationale: 过去已济其饿虎急厄今成佛亦当济其生死大苦令获涅槃安乐
