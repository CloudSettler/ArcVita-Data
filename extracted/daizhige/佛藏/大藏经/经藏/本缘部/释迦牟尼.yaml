    title_zh: 以五百钱买五茎花求成佛
    rationale: 不求释梵魔王转轮圣位唯愿得成佛度脱十方故倾财求花供养锭光
  - date: -0723-04-01
    title_zh: 布发著地请佛蹈之立誓度尽
    rationale: 欢喜踊跃以得决言为证立愿一人不得道吾不入泥洹故布发供养
