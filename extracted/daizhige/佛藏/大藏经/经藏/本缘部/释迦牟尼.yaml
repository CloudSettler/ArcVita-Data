    rationale: 白净为转轮王种性情淳正妙后德行清净国土中正堪为受生之处以顺古制而利教化
  - date: -564-07-15
    title_zh: 决定以白象托右胁
    rationale: 白象六牙为吉祥圣谶示无瑕清净令王后及占梦者皆生信解显佛出世之瑞
