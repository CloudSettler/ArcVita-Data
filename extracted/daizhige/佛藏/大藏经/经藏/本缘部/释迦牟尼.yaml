  decisions:
  - date: -1500-01-01
    title_zh: 以爱妻爱子施夜叉换无常偈
    rationale: 财宝只能资身法财方能安立一切故为一偈不惜亲爱书写颁示阎浮提
  - date: -1400-01-01
    title_zh: 剜身燃千灯斫千铁钉投火坑
    rationale: 过去为贪嗔痴丧身无数未曾为法今为佛道故忍苦无悔愿以智慧光明照悟黑闇
  - date: -1300-01-01
    title_zh: 自割股肉以至举身贸鸽命
    rationale: 害一救一于理无益且誓度一切故唯除己身自割称盘不断结使之病
- id: guji-释迦牟尼-endeavor-2
  title_zh: 现世成道转轮济众
  description: 于摩竭善胜道场初成正觉欲入涅槃受梵天劝请往波罗奈鹿野苑转法轮现萨埵饲虎本生济老母二子令得解脱
