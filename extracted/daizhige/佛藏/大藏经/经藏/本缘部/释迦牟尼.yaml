  - 宫廷五欲安乐与老病死众苦之间的矛盾
  lesson: 见生老病死而厌患宫廷乐，发起大悲出离以济度众生
  summary_first_person: 我是迦毗罗卫释迦族太子，母摩耶夫人在蓝毗尼园生我，行七步而天龙赞叹，相师记我当成正觉，父王以深宫五欲留我，我娶耶输陀罗生罗睺罗，出游见老人而悟衰老逼人，始厌患世荣而思解脱道。
