  - date: -564-09-01
    title_zh: 以白月弗沙星合入胎
    rationale: 母持清净斋戒时入胎方显菩萨无染正念受生之德
  - date: -533-01-01
    title_zh: 示现出家降魔成正觉
    rationale: 为破烦恼魔业摧异学邪见普施甘露法药令众生至涅槃
events:
- id: guji-释迦牟尼-event-tushita
  date: -565-01-01
  year_of: -565
  title_zh: 兜率天宫受请说法
  description_zh: 菩萨名净幢住兜率宫为天众说法，净居天子请说方广神通游戏大庄严法门，佛默然受请。
- id: guji-释迦牟尼-event-choose
  date: -564-06-01
  year_of: -564
  title_zh: 四心观察拣择释种
  description_zh: 菩萨以观时观方观国观族遍察阎浮十六大国皆不堪，遂定迦毗罗卫转轮王种净饭王家，母为具三十二德之摩耶夫人。
- id: guji-释迦牟尼-event-conceive
  date: -564-09-01
  year_of: -564
  title_zh: 白象形入摩耶胎
  description_zh: 白月弗沙星合之时，母持清净戒，菩萨现白象形入于母胎，具三十二大人相之因。
- id: guji-释迦牟尼-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 蓝毗尼园降生
  description_zh: 菩萨从兜率没生于人中，父为释氏净饭王，母为摩耶夫人，降生迦毗罗卫，具足大人相，在家当作转轮圣王，出家当得成佛。
- id: guji-释迦牟尼-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 拘尸那罗示现涅槃
  description_zh: 示现降伏魔军具如来十力四无畏一切佛法已，事业圆满，于人间示现入于涅槃，令三宝种不断绝。
