  place_zh: 迦毗罗卫蓝毗尼园
  description: 佛星与月合吉瑞应期从右胁生光明遏日幽冥皆明枯树生花五趣休息梵天帝释接擎敬礼
- id: guji-释迦牟尼-event-seven-steps
