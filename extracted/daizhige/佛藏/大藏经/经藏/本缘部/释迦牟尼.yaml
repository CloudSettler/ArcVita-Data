endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 舍国出家树下成道
  description: 前生为王让国从瞿昙学道，今生为白净王太子悉达，舍三时殿富贵，二十九出家三十五得道
  phases:
  - key: brewing
    name: 白象降生贵姓舍夷
