    name: 初发弘愿游化
    labels:
      zh: 发愿
    start_date: -531-07-15
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  decisions:
  - date: -1000-01-01
    title_zh: 让国求道受瞿昙姓
    rationale: 前世为王父母早丧让国与弟，解王服入深山坐禅，虽遭贯身之难而内怀慈心不悔
  - date: -537-04-08
    title_zh: 舍三妇六万婇女出家
    rationale: 虽有瞿夷明女等三妇及三时殿富贵，为求解脱生老病死故年二十九毅然出家
  - date: -531-04-08
    title_zh: 树下端坐誓得道
    rationale: 自四月八日至七月十五日坐树下禅思不毁，以至诚求无上正觉
- id: guji-释迦牟尼-endeavor-2
  title_zh: 十二年游化说法度众
  description: 自成道后十二年间游十六大国，鹿野度五比丘，收迦叶千众及舍利弗目连，建祇园精舍，还国度释种八万四千人
  phases:
  - key: brewing
    name: 鹿野初转法轮
    labels:
      zh: 初说
    start_date: -530-05-01
    highlight_event_id: guji-释迦牟尼-event-deerpark
  - key: breakthrough
    name: 收千比丘及二贤弟子
    labels:
      zh: 收徒
    start_date: -528-08-01
    highlight_event_id: guji-释迦牟尼-event-disciples
  - key: climax
    name: 祇园建寺弘般舟
    labels:
      zh: 建寺
    start_date: -525-01-01
    highlight_event_id: guji-释迦牟尼-event-jetavana
  - key: closure
    name: 还国度释种归化
    labels:
      zh: 还国
    start_date: -519-03-01
    highlight_event_id: guji-释迦牟尼-event-return
  decisions:
  - date: -530-05-01
    title_zh: 鹿野为拘邻等说法
    rationale: 为令正法初兴先度阿若拘邻等五人，次第度毕婆般迦者罗及长者优婆夷等
  - date: -528-08-01
    title_zh: 纳舍利弗目连为智慧神足弟子
    rationale: 见二人具善根因缘，以马师说因缘偈引入佛门，授四谛而成阿罗汉，共领二百五十众弘化
  - date: -519-03-01
    title_zh: 还父王国度释氏
    rationale: 为报亲恩及度本族，去城八十里建精庐，为父王释种说法，度八万四千人得须陀洹道
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 迦毗罗卫诞生
  date: -566-04-08
  year_of: -566
  type: birth
  description: 白净王长子悉达四月八日生，身长丈六，母摩耶，外家瞿昙一亿王家，妇瞿夷明女，白象宝车兜率来下之瑞
- id: guji-释迦牟尼-event-renunciation
  title_zh: 二十九岁舍殿出家
  date: -537-04-08
  year_of: -537
  type: career
  description: 舍三时殿六万婇女及遮迦越王位，年二十九出家求道
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 三十五岁树下得道
  date: -531-04-08
  year_of: -531
  type: career
  description: 自四月八日至七月十五日坐树下禅思，年三十五成就无上道
- id: guji-释迦牟尼-event-deerpark
  title_zh: 鹿野园初转法轮
  date: -530-05-01
  year_of: -530
  type: career
  description: 第二年在鹿野园为阿若拘邻等说法，复度毕婆般迦者罗十七人及大才长者等
- id: guji-释迦牟尼-event-disciples
  title_zh: 度迦叶千众及舍利弗目连
  date: -528-08-01
  year_of: -528
  type: career
  description: 第三年 unconditional 度郁为迦叶兄弟满千比丘，第五年竹园前度舍利弗目连二百五十人分别证阿罗汉
- id: guji-释迦牟尼-event-jetavana
  title_zh: 祇陀须达建精舍弘化
  date: -525-01-01
  year_of: -525
  type: career
  description: 第六年须达与祇陀共建精舍十二佛图七十二讲堂，第七年在拘耶尼说般舟经，十年间游象头竹园柳山秽泽摩竭等国说法
- id: guji-释迦牟尼-event-return
  title_zh: 第十二年还国度释种
  date: -519-03-01
  year_of: -519
  type: career
  description: 第十二年还父王国去城八十里建释氏精庐，为父王释种说法度八万四千人得须陀洹道，完成十二游化
- id: guji-释迦牟尼-event-death
  title_zh: 八十岁入灭
  date: -486-02-15
  year_of: -486
  type: death
  description: 化缘既毕年八十示现入灭，留十二游化之轨为后世所传
