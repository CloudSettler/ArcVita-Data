  date: -563-04-08
  year_of: -563
  place_zh: 蓝毗尼园
  description: 大龙王动海出水细雨香水敬浴太子毗沙门孔雀幢等天王将从拥护天华白盖覆上普皆欢喜
- id: guji-释迦牟尼-event-death
