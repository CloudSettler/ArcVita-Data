    title_zh: 不于劫初唯于劫减入胎
    rationale: 唯减劫众生了知老病死苦方能生厌离求解脱之机
  - date: -564-08-01
    title_zh: 舍十六大国拣释种净饭家
    rationale: 唯释种具六十四族德父母具足清净功德堪为最后身受生处
- id: guji-释迦牟尼-endeavor-2
  title_zh: 降神示现成佛度生
  summary_zh: 从兜率没降阎浮提，入胎住胎出胎，示现童子艺业出家降魔成正觉，转法轮度众生。
  phases:
