  title_zh: 最后施食感天雨宝
  summary: 以仅存五升饭施辟支佛并发愿断众生贫穷，感四方云起天雨饮食谷帛七宝
  phases:
  - key: brewing
    name: 楼上悲迎仙人
    labels:
      zh: 怜愍来赴
