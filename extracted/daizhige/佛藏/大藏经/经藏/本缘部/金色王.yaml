    start_date: '-7993'
    highlight_event_id: guji-金色王-event-last-alms
  - key: climax
    name: 圣者飞空而去众仰观
    labels:
      zh: 身现法去
    start_date: '-7993'
    highlight_event_id: guji-金色王-event-last-alms
  - key: closure
    name: 天雨食谷酥油钱叠七宝
    labels:
      zh: 果报普洽
    start_date: '-7992'
    highlight_event_id: guji-金色王-event-rain-treasure
