  - date: '-7993'
    title_zh: 舍自命一食施仙不令空钵
    rationale: 自食亦不免死不食则俱死不如施清净持戒者得大善根
  - date: '-7993'
    title_zh: 愿以施福令阎浮提永断贫穷
    rationale: 令大众随喜以最后施为缘断未来贫苦
events:
- id: guji-金色王-event-birth
  title_zh: 降生为饶金城金色王
  date: '-8000'
  year_of: -8000
  summary: 过去人寿八万四千年时生而端正殊特具最上胜妙色身，富有象马金银，都饶金城领五十七亿村邑
- id: guji-金色王-event-tax-relief
  title_zh: 下诏免赋税行法治国多年
  date: '-7995'
  year_of: -7995
  summary: 空闲思惟召大臣百官普放阎浮提赋税，依王法如法治国经多年
- id: guji-金色王-event-grain-share
  title_zh: 占知十二年大旱聚谷均食十一年
  date: '-7994'
  year_of: -7994
  summary: 婆罗门占恶星十二年不雨，即收天下谷一仓计数口数，以身为首均给，至十一年存命不死而谷渐尽
- id: guji-金色王-event-last-alms
  title_zh: 以最后五升饭施辟支佛
  date: '-7993'
  year_of: -7993
  summary: 阎浮提食尽独余王一食，辟支佛飞空来乞，王悲贫而迎，持饭置钵授其右手，愿断众生贫穷，圣者受已飞空而去
- id: guji-金色王-event-rain-treasure
  title_zh: 施讫天雨饮食谷帛七宝
  date: '-7992'
  year_of: -7992
  summary: 施食将食时四方云起凉风净地，天雨饭麨饼果油脂，七日雨谷，七日雨酥油钱叠杂物，七日唯雨金银琉璃真珠玛瑙等七宝，贫穷永断
- id: guji-金色王-event-death
  title_zh: 饶金城功成示终即释迦前身
  date: '-7990'
  year_of: -7990
  summary: 金色王施福普洽阎浮提，后世尊自记彼王即我身是，以证知施果离嫉舍施之法
