  reign_ref: 莲华王都银色王
  archetype: 割身布施求菩提者
  dilemmas:
  - 若将子携去则产妇命终，若不携去则童子被食，二命难全如何救济
  - 自割二乳剧痛流血，能否心无悔恨成就檀波罗蜜
  - 惜身命求安乐，或舍身命救众生取无上觉，应当何从
  lesson: 布施无悔不求回报，以大悲救众生方为波罗蜜，直至成就无上菩提
  summary_first_person: 我是往昔莲华王都银色女，见产妇饥困欲食其子，便自割二乳救其母子，发愿求无上菩提，誓无悔恨，乳复如本，又誓成男子，后为银色王劝行十善，复多生舍眼目身肉饲鸟兽饿虎，唯愿救一切众生得一切智
  source_urls:
