    title_zh: 不以兵威强取而以功德胜龙
    rationale: 自知威神福不如龙当大作塔寺供养三尊以功德往取必得不疑
  - date: '-245'
    title_zh: 遣小沙弥应幻化恶鬼护僧
    rationale: 外道作摩夷首罗鬼形欲啖无益沙门王虽不乐不得已遣使唯信三宝神力沙弥最小能伏其幻
events:
- id: guji-阿育王-event-birth
  title_zh: 阿育王诞生
  date: '-304'
  year_of: -304
  description: 约公元前304年生于华氏城孔雀王朝王家后嗣为转轮护法之器
- id: guji-阿育王-event-1
  title_zh: 立千二百塔织金幡病愈遂愿
  date: '-260'
  year_of: -260
  description: 境内立千二百塔寺各织金缕幡盖千二百枚欲自悬幡散华而得重病沙门现神足令悉见一界中塔见已欢喜病即时差取金幡金华悬诸刹上延二十五年广作功德得不退转
  endeavor_ref: guji-阿育王-endeavor-1
- id: guji-阿育王-event-2
  title_zh: 称量功德伏龙王得一分舍利
  date: '-250'
  year_of: -250
  description: 北界龙池广三百余里龙王得佛一分舍利昼夜供养独不降首三往不得作金龙与王身著称两头称轻重初龙重王轻后衡平后王重龙轻知功德日多兴兵往讨未至道半龙王大小奉迎首伏献舍利复兴塔寺广阐佛法
  endeavor_ref: guji-阿育王-endeavor-2
- id: guji-阿育王-event-3
  title_zh: 供养二万比丘沙弥伏幻化外道
  date: '-245'
  year_of: -245
  description: 佛般泥洹百年后爱乐佛法恒供养二万比丘九十六种外道作摩夷首罗鬼形索啖沙门十三岁沙弥端正请往取二万人食置口中飞著祇洹复吞二万梵志送著祇洹中剃头说法皆得罗汉王发无上正真道意佛法兴盛至今不灭
  endeavor_ref: guji-阿育王-endeavor-2
- id: guji-阿育王-event-death
  title_zh: 阿育王去世
  date: '-232'
  year_of: -232
  description: 广兴塔寺护持三宝功德圆满后于华氏城去世世称护法大王
