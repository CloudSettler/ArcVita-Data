    title_zh: 病中一心观塔不怀恨
    rationale: 沙门劝开大意莫恨前作功德不可计数当以信心见法除悲
  - date: '-259'
    title_zh: 得愿病愈延年广作功德
    rationale: 既见千二百塔低仰就手本愿得遂当发大意求不退转以报三宝恩
- id: guji-阿育王-endeavor-2
  title_zh: 称德伏龙迎舍利护僧摧外道
  description: 三往北界龙池不伏以修塔请僧称量金龙王身知功德日多兴兵往讨龙王归伏献佛舍利又供养二万比丘容小沙弥以神足吞食摧破幻化外道
  phases:
