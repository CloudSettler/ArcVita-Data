    title_zh: 以男女施鸠留婆罗门
    rationale: 远来求索已许不逆，恩爱别离本属无常，以此舍成檀波罗蜜当度儿女
  - date: -0979-01-01
    title_zh: 以妃曼坻施化身婆罗门
    rationale: 若不施妻何从得成平等度意，宿要本许随施不逆，唯以舍成无上道意
events:
- id: guji-须大拏-event-birth
  title_zh: 降生叶波王宫
  date: -1000-01-01
  year_of: -1000
  summary: 湿波王祷嗣夫人有娠满十月生太子，宫中乳湩自然因字须大拏，十六岁书射礼乐备足
- id: guji-须大拏-event-alms
  title_zh: 四城门外开藏大施
  date: -0983-01-01
  year_of: -983
  summary: 得王许愿辇珍宝置四门及市中恣施，百里千里万里来求食衣金宝皆不逆意，七日私财复尽施贫者得富
- id: guji-须大拏-event-elephant
  title_zh: 施白象须檀延与敌国道士
  date: -0982-01-01
  year_of: -982
  summary: 八道士乞却敌白象，左手持水右手牵象授之，国中震怖大臣白王共议逐太子
- id: guji-须大拏-event-exile
  title_zh: 徙檀特山十二年
  date: -0982-07-01
  year_of: -982
  summary: 王徙著檀特山六千里外，辞别父母出北门尽散珠华，途中施马车衣步行入山，慈心定渡水结茅居果为食
- id: guji-须大拏-event-giving-children
  title_zh: 山中以男女施婆罗门
  date: -0980-01-01
  year_of: -980
  summary: 鸠留丑婆罗门求儿为奴婢，澡手授耶利罽拏延令缚去，地动禽兽悲送，帝释化狮阻妃归路恐坏善心
- id: guji-须大拏-event-giving-wife
  title_zh: 以妃施帝释化身得三愿
  date: -0979-01-01
  year_of: -979
  summary: 帝释化十二丑婆罗门乞妃，太子澡手牵与了无悔心，天赞地动，还妃寄护，妃求儿还本国不饥早还国
- id: guji-须大拏-event-death
  title_zh: 愿满还国终全其德
  date: -0920-01-01
  year_of: -920
  summary: 发愿众生度脱及父臣思见，天释许大富好施胜前，儿卖还本国赎归，还国行化终成檀波罗蜜事
