    title_zh: 求王开藏四门布施
    rationale: 见贫穷聋盲生悲，愿以国藏饶益众生，不逆来求以行檀波罗蜜
  - date: -0982-01-01
    title_zh: 施白象与怨家道士
    rationale: 已立有求不逆本愿，若惜象则违道心，宁失父意也要成无上平等度意
- id: guji-须大拏-endeavor-2
  title_zh: 檀特山苦行施儿施妻
  summary: 携妃曼坻及耶利罽拏延入檀特山结茅居果为食，次第施马车衣，复以儿女施婆罗门，以妃施帝释化身，心无悔动天地大动。
