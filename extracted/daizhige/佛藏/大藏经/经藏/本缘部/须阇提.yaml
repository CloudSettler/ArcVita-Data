events:
- id: guji-须阇提-event-birth
  title_zh: 出生于边小国王家
  date: -3000-01-01
  year_of: -3000
  place_zh: 波罗奈属边小国王宫
  summary_zh: 父为边小国仁王母未详太子身黄金色七处平满人相具足年七岁聪慧慈仁好喜布施
- id: guji-须阇提-event-exile
  title_zh: 罗睺叛乱国破流亡
  date: -2999-01-01
  year_of: -2999
  place_zh: 波罗奈至边国道中
  summary_zh: 罗睺大臣起四兵杀大王及二太子守宫殿神警告小王携子须阇提逃命避怨家追捕
- id: guji-须阇提-event-filial
  title_zh: 行乞奉母孝养闻名
  date: -2998-01-01
  year_of: -2998
  place_zh: 王舍城乞食道中
  summary_zh: 家计荡尽担负老母次第行乞得好食香果仰奉于母恶食自食阿难见而偈赞国人天神敬爱
- id: guji-须阇提-event-vow
  title_zh: 发愿遍施报父母恩
  date: -2995-01-01
  year_of: -2995
  place_zh: 阎浮提流亡所至处
  summary_zh: 观一切众生皆曾为父母故发大愿修难行苦行施头目髓脑国城妻子衣服饮食卧具医药勤修戒定慧万行
- id: guji-须阇提-event-death
  title_zh: 功圆示灭成本愿佛因
  date: -2900-01-01
  year_of: -2900
  place_zh: 过去娑婆世界
  summary_zh: 以孝养报恩万行不息心无疲倦满菩提因后世速成阿耨多罗三藐三菩提即今释迦如来示大方便报恩
