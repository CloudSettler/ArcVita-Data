person:
  qid: guji-马鸣
  name_zh: 马鸣
  names:
    zh: 马鸣菩萨
    en: Ashvaghosha
  lifespan:
    birth:
      date: 0080
      precision: year
      is_circa: true
      raw: 约东汉建初五年中印度
    death:
      date: '0150'
      precision: year
      is_circa: true
      raw: 约东汉永建五年北印度
  birth_date: 0080
  death_date: '0150'
  era: 东汉贵霜迦腻色迦王时
  reign_ref: 迦腻色迦王
  archetype: 论师菩萨
  dilemmas:
  - 外道九十六种道炽盛如何以文辞摧邪显正
  - 众生计我贪爱流转如何示十二因缘无我解脱
  lesson: 以庄严文义分别可归不可归破身见断烦恼而得涅槃
  summary_first_person: 我本习外典后归依佛以诗论庄严佛德造大庄严论明可归不可归可供不可供令闻者满足众善得生
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/本缘部/大庄严论经.html
endeavors:
- id: guji-马鸣-endeavor-1
  title_zh: 撰集大庄严论显佛功德
  summary: 次第宣说显示庄严论分别善恶令闻者满足生善
  phases:
  - key: brewing
    name: 礼敬三宝集论发端
    labels:
      zh: 礼佛法僧立论宗旨
    start_date: '0100'
    highlight_event_id: guji-马鸣-event-1
  - key: breakthrough
    name: 引商人优婆塞喻破自在天
    labels:
      zh: 以慈悲无害显佛最胜
    start_date: '0110'
    highlight_event_id: guji-马鸣-event-1
  - key: climax
    name: 明可归不可归可供不可供
    labels:
      zh: 分别善恶功德过失
    start_date: '0120'
    highlight_event_id: guji-马鸣-event-1
  - key: closure
    name: 成大庄严论流通十方
    labels:
      zh: 庄严世间如虚空星宿
    start_date: '0130'
    highlight_event_id: guji-马鸣-event-2
  decisions:
  - date: '0100'
    title_zh: 以譬喻立论而不直斥
    rationale: 为令外道易解故借乾陀罗商客与婆罗门问答显佛慈悲无残害
  - date: '0120'
    title_zh: 以佛塔功德证最胜尊
    rationale: 欲破咒术自在天想故示戒闻定慧无等拔济众苦
- id: guji-马鸣-endeavor-2
  title_zh: 破僧佉卫世师立因缘无我
  summary: 借憍尸迦读十二缘经悟无我舍邪论出家得道
  phases:
  - key: brewing
    name: 憍尸迦客居得十二缘经
    labels:
      zh: 初读未解再读悟无我
    start_date: '0120'
    highlight_event_id: guji-马鸣-event-2
  - key: breakthrough
    name: 观察生灭破常我二见
    labels:
      zh: 知因灭则果灭出生死法
    start_date: '0125'
    highlight_event_id: guji-马鸣-event-2
  - key: climax
    name: 辩破瓶因遍常等过失
    labels:
      zh: 折毗世师僧佉无因之失
    start_date: '0130'
    highlight_event_id: guji-马鸣-event-2
  - key: closure
    name: 舍邪出家证阿罗汉
    labels:
      zh: 逆顺观缘归依戒定慧
    start_date: '0135'
    highlight_event_id: guji-马鸣-event-2
  decisions:
  - date: '0125'
    title_zh: 独举十二因缘为正论
    rationale: 外论无出生死法唯佛法说因果相续虽无我而缚解宛然
  - date: '0130'
    title_zh: 以谷芽乳药为喻明相续
    rationale: 为断计我及断灭疑故示种子灭而芽生业在而后阴受
events:
