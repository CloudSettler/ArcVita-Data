endeavors:
- id: guji-鹿母-endeavor-1
  title_zh: 堕弶哀求立誓还死
  description: 怀妊失侣生二子后误堕弶中，向猎者叩头求暂还视子，立重誓示水草死别后守信还就死地
  phases:
  - key: brewing
    name: 失侣生子误堕弶中
    labels:
      zh: 遇难被执
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-trapped
  - key: breakthrough
    name: 叩头求哀立下重誓
    labels:
      zh: 立誓求生
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-vow
  - key: climax
    name: 还视二子示诲别离
    labels:
      zh: 慈母别子
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-farewell
  - key: closure
    name: 守信还就猎者受死
    labels:
      zh: 守信赴死
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-return
  decisions:
  - date: 约-1000
    title_zh: 向猎者求假须臾还视二子
    rationale: 去则子存留则子亡，宁以己死全二子性命
  - date: 约-1000
    title_zh: 发重誓若不还罪过破塔杀亲
    rationale: 以极重罪为誓取信于人，表明终不违信盟
  - date: 约-1000
    title_zh: 别子后按期还就刀几
    rationale: 知死何足惜而违心信，毕故不造新以脱畜生形
- id: guji-鹿母-endeavor-2
  title_zh: 感化猎者国王归正
  description: 以丹诚信誓感动猎者放生，猎者悔过白王，王废邪宗归正举国奉戒，国丰太平
  phases:
  - key: brewing
    name: 猎者惊怪暂放遣鹿
    labels:
      zh: 慈心初发
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-vow
  - key: breakthrough
    name: 子母悲啼相寻至弶
    labels:
      zh: 母子相寻
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-return
  - key: climax
    name: 猎者感诚悔过放鹿
    labels:
      zh: 感化猎者
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-release
  - key: closure
    name: 国王宣令归正奉戒
    labels:
      zh: 举国归正
    start_date: 约-1000
    highlight_event_id: guji-鹿母-event-release
  decisions:
  - date: 约-1000
    title_zh: 以偈谢恩以子相托甘心就死
    rationale: 受慈育不敢负恩，愿灭对毕因缘以全信义
  - date: 约-1000
    title_zh: 得赦后率子还深林鸣群安集
    rationale: 制意离贪而后大安，示现信义祐身之证
events:
- id: guji-鹿母-event-birth
  title_zh: 鹿母生于林薮怀妊失侣
  date: 约-1000
  year_of: -1000
  description: 数百为群随逐水草，国王出猎各分迸，母鹿怀妊独逝生二子
- id: guji-鹿母-event-trapped
  title_zh: 求食误堕猎者弶中
  date: 约-1000
  year_of: -1000
  description: 舍行求食茕悸失错堕弶，悲鸣不能得脱，猎者闻声往视欲杀
- id: guji-鹿母-event-vow
  title_zh: 叩头立誓乞假视子
  date: 约-1000
  year_of: -1000
  description: 自陈初生二子未晓东西，乞暂还示水草死别，发重誓若不还罪大过逆害父母破塔坏寺
- id: guji-鹿母-event-farewell
  title_zh: 还林示草诫子死别
  date: 约-1000
  year_of: -1000
  description: 低头嗅子说无常偈，示好水草教生活道，令依群侣慎勿独游，迟回再三委背而去
- id: guji-鹿母-event-return
  title_zh: 守信还就弶所觉猎者
  date: 约-1000
  year_of: -1000
  description: 与二子同至弶所，低头大声觉猎者，陈说见放不敢稽还就刀几，子母悲啼相寻而至
- id: guji-鹿母-event-release
  title_zh: 猎者感化放鹿白王归正
  date: 约-1000
  year_of: -1000
  description: 猎者肃敬辞谢遣鹿，放弩坏弶诣寺归戒往白王，王废邪宗举国奉三尊五戒，三年国丰太平
- id: guji-鹿母-event-death
  title_zh: 率子还深林寿终缘尽
  date: 约-1000
  year_of: -1000
  description: 子母相得仰谢猎者，将率二子还深林鸣群啸侣安身草泽，毕鹿身之缘以显本生，佛言鹿母者我身是也
