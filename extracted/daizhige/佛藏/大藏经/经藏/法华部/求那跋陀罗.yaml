events:
- id: guji-求那跋陀罗-event-birth
  date: 0394
  year_of: 394
  title_zh: 生于中天竺婆罗门家
  description: 生中天竺，少聪慧，博通五明，精大乘及杂阿毘昙，誓弘法东方。
- id: guji-求那跋陀罗-event-arrival
  date: '0435'
  year_of: 435
  title_zh: 泛海至广州复至建康
  description: 元嘉十二年达广州，文帝遣使迎请至建康，住祇洹寺，礼遇甚厚。
- id: guji-求那跋陀罗-event-translation
  date: '0436'
  year_of: 436
  title_zh: 译胜鬘楞伽方便境界等经
  description: 自元嘉中起译胜鬘师子吼一乘大方便方广经楞伽阿跋多罗宝经及方便境界神通变化经等百余卷。
- id: guji-求那跋陀罗-event-preach
  date: '0443'
  year_of: 443
  title_zh: 讲演一乘方便摄众
  description: 依所译经为文武士庶说菩萨十二境界方便示现，劝发菩提心，化行甚盛。
- id: guji-求那跋陀罗-event-death
  date: 0468
  year_of: 468
  title_zh: 示寂于建康
  description: 泰始四年示寂于建康，春秋七十有五，译业弘化并垂后世。
