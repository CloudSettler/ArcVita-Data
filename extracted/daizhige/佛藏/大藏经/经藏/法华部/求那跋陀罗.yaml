  lesson: 以慈悲为怀以方便为门不舍众生终成一乘法化
  summary_first_person: 我是求那跋陀罗，本生中天竺，少学三乘，精通杂阿毘昙，远涉南海而来宋土，蒙文帝礼遇，住祇洹祇园译出楞伽胜鬘央掘魔罗等经，示人以方便境界神通变化，愿众生皆发无上菩提心。
