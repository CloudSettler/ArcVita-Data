  decisions:
  - date: '-528'
    title_zh: 决定说一乘不说小乘
    rationale: 为令一切众生同入佛智以方便普润如一雨润众草故唯说一味真实
  - date: '-528'
    title_zh: 决定入金刚三昧示现证境
    rationale: 以身心不动证无相无生决定实际令众信解实相非言说可到故入三昧为证
- id: guji-释迦牟尼-endeavor-2
  title_zh: 应机开示无相无生本觉实际普度末世
  summary: 应解脱心王无住大力四菩萨所问次第开示无相法无生行本觉利入实际四重法门转八识入庵摩罗
  phases:
  - key: brewing
    name: 解脱问末世酝酿慈悲
    labels:
      zh: 酝酿
    start_date: '-527'
    highlight_event_id: guji-释迦牟尼-event-2
  - key: breakthrough
    name: 说无生忍突破有无见
    labels:
      zh: 突破
    start_date: '-527'
    highlight_event_id: guji-释迦牟尼-event-3
  - key: climax
    name: 说本觉利转识入庵摩罗
    labels:
      zh: 高潮
    start_date: '-526'
    highlight_event_id: guji-释迦牟尼-event-4
  - key: closure
    name: 说五空三空入实际收束
    labels:
      zh: 收束
    start_date: '-526'
    highlight_event_id: guji-释迦牟尼-event-5
  decisions:
  - date: '-527'
    title_zh: 决定以无相六度破有相执
    rationale: 以众生执有相六度不能出世故重说无相无为六度令离欲无住空寂平等
  - date: '-526'
    title_zh: 决定说不住涅槃长行利生
    rationale: 以常住涅槃即是涅槃缚觉本无生无寂故教不住涅槃而常住本利导群生
events:
- id: guji-释迦牟尼-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 诞生于蓝毗尼园
  description: 迦毗罗卫王子悉达多诞生后观生老病死而萌出家之志
  place_zh: 蓝毗尼园
- id: guji-释迦牟尼-event-1
  date: '-528'
  year_of: -528
  title_zh: 王舍城耆阇崛山说一味真实入金刚三昧
  description: 与万阿罗汉二千菩萨八万长者六十万亿人非人聚会说大乘一味真实无相无生决定实际本觉利行经已结跏入金刚三昧阿伽陀比丘重宣一谛
  place_zh: 王舍大城耆阇崛山
- id: guji-释迦牟尼-event-2
  date: '-527'
  year_of: -527
  title_zh: 为解脱菩萨说无相法
  description: 答末劫五浊轮回之问明空寂无生心地十二因缘观灭有无见及无相无为六度入决定性超然出世
  place_zh: 耆阇崛山
- id: guji-释迦牟尼-event-3
  date: '-527'
  year_of: -527
  title_zh: 为心王菩萨说无生行
  description: 明无生法忍本无生诸行无生离得忍之妄显禅性无生不动及无生般若不依住
  place_zh: 耆阇崛山
- id: guji-释迦牟尼-event-4
  date: '-526'
  year_of: -526
  title_zh: 为无住菩萨说本觉利
  description: 明常以一觉转诸识入庵摩罗觉性清净决定以金钱喻显本有非得教安坐金刚地无一念及不住涅槃
  place_zh: 耆阇崛山
- id: guji-释迦牟尼-event-5
  date: '-526'
  year_of: -526
  title_zh: 为大力菩萨说入实际
  description: 明五空三空无取舍二入理行入六行等觉及实际无际心智引情智流入萨婆若海
  place_zh: 耆阇崛山
- id: guji-释迦牟尼-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 般涅槃于拘尸那罗
  description: 化缘既毕示现灭度而不住涅槃本觉常利众生
  place_zh: 拘尸那罗
