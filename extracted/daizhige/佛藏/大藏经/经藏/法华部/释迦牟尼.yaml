  lesson: 莫作二说谤正法师，敬一切法师如见佛，具修六度远离我慢嫉妒贪养，方能住持正法久住于世
  summary_first_person: 我是释迦牟尼，昔于无垢焰称起王佛世曾为达摩比丘，以恶心谤持法净命而堕地狱畜生贫贱多劫，值香宝光佛方发菩提心渐得超升，今于五浊恶世成佛，于王舍城耆阇崛山说方广总持，诫众莫谤莫作二说
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/法华部/大乘方广总持经.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/法华部/大乘方广总持经.md
