  title_zh: 五浊成佛说方广总持呵二说护法
  summary_zh: 以先世谤法业因处五浊世成佛，于王舍城耆阇崛山临涅槃时入定现瑞，为弥勒文殊等说方广总持，呵二说谤法之罪，劝敬法师具修六度
