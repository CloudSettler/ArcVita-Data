    title_zh: 自述达摩本生诫众莫作二说
    rationale: 以自身谤法受苦为证，令众知谤法师即谤佛，止息彼此是非，和合住持正法
  - date: -483-01-15
    title_zh: 广说六度具修破唯般若之执
    rationale: 破偏执空与唯学般若之邪见，明布施持戒忍辱精进禅定智慧缺一不可，方成菩提
events:
- id: guji-释迦牟尼-event-birth
  person_qid: guji-释迦牟尼
  title_zh: 降生蓝毗尼园
  date: -563-04-08
  year_of: -563
  location_zh: 蓝毗尼园
  description_zh: 相传周昭王世降生为悉达多太子，出家修行后于五浊恶世成等正觉，即今释迦如来
- id: guji-释迦牟尼-event-past-slander
  person_qid: guji-释迦牟尼
  title_zh: 无垢焰称起王佛世作达摩比丘谤净命
  date: -8000-01-01
  year_of: -8000
  location_zh: 跋陀城
  description_zh: 为达摩比丘时受持千部大乘得四禅，唯说空寂，谤净命法师所说杂秽不净，诬其受用华香，我慢轻慢持法者
- id: guji-释迦牟尼-event-hell
  person_qid: guji-释迦牟尼
  title_zh: 以谤法故堕地狱畜生受大苦恼
  date: -7999-01-01
  year_of: -7999
  location_zh: 地狱畜生道
  description_zh: 身坏命终堕地狱经七十劫具受众苦，复堕畜生过六十劫，后九万世犹生畜生中
- id: guji-释迦牟尼-event-meet-fragrant-light
  person_qid: guji-释迦牟尼
  title_zh: 值香宝光佛发菩提心历贫贱余报
  date: -7900-01-01
  year_of: -7900
  location_zh: 香宝光佛所
  description_zh: 于香宝光佛法中发菩提心，后得生人中六万世贫穷下贱恒无舌根，以恶口谤发心人之余报
- id: guji-释迦牟尼-event-entering-samadhi
  person_qid: guji-释迦牟尼
  title_zh: 王舍城夏安居已临涅槃入定现瑞
  date: -483-01-01
  year_of: -483
  location_zh: 王舍城耆阇崛山
  description_zh: 与六万二千比丘八十亿菩萨等俱，入如法三昧，三千大千世界庄严，天龙八部云集，出广长舌遍覆大千，遍观大众如师子王
- id: guji-释迦牟尼-event-preaching-vulture-peak
  person_qid: guji-释迦牟尼
  title_zh: 说大乘方广总持呵二说谤法
  date: -483-01-15
  year_of: -483
  location_zh: 王舍城耆阇崛山
  description_zh: 为弥勒文殊须菩提等说净命达摩本生，言过去达摩即我身，净命即阿弥陀佛，诫莫言是应学是不应学，劝敬法师如塔如佛，具修六度说四平等法
- id: guji-释迦牟尼-event-death
  person_qid: guji-释迦牟尼
  title_zh: 付嘱流通入无余涅槃
  date: -483-02-15
  year_of: -483
  location_zh: 拘尸那罗
  description_zh: 说法已大众悲泣受持，三十恒河沙菩萨得无生忍，付嘱弥勒文殊护持流通，寻入涅槃，令法眼久住
