    rationale: 执一切皆空为究竟，不解善方便随根施教，遂起我慢谤持法者为杂秽不净
  - date: -7900-01-01
    title_zh: 于香宝光佛所发菩提心求忏
    rationale: 历地狱畜生苦已知谤法罪重，依佛威力发心改往，立愿护法利生以赎前愆
