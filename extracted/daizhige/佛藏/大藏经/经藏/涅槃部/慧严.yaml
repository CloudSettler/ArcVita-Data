  decisions:
  - date: 0428
    title_zh: 坚持宣说常住佛性
    rationale: 众生悉有佛性乃涅槃要旨，不以旧学难而废讲
  - date: 0438
    title_zh: 安住东安不谋荣利
    rationale: 道场为弘法之本，守一寺以育僧才，胜于奔走权门
events:
- id: guji-慧严-event-birth
  title_zh: 降生
  date: '0363'
  year_of: 363
  summary_zh: 约晋孝武太元年间生，少而出家，笃志大乘
- id: guji-慧严-event-1
  title_zh: 游学谙通三藏入建康
  date: '0414'
  year_of: 414
  summary_zh: 博通经律，入建康住东安寺，与慧观齐名，声驰南北
- id: guji-慧严-event-2
  title_zh: 加治泥洹成南本涅槃三十六卷
  date: '0436'
  year_of: 436
  summary_zh: 与慧观谢灵运等依六卷泥洹参合大本，增广为三十六卷，题为宋慧严等依泥洹经加之，盛行南土
- id: guji-慧严-event-death
  title_zh: 示寂于建康
  date: '0443'
  year_of: 443
  summary_zh: 约宋文帝元嘉二十年寂，葬后道俗追慕，南本涅槃遂大行于世
