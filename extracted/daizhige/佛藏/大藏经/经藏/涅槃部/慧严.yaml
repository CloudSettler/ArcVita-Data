    title_zh: 决意增补泥洹
    rationale: 六卷文略义阙，不补则常住大义不明，故宁受物议亦当增治
  - date: '0436'
    title_zh: 联合慧观谢灵运校定
    rationale: 集众智以调文义，借名德以服物议，令南本取信于世
- id: guji-慧严-endeavor-2
  title_zh: 住持建康东安寺弘法护教
  summary_zh: 居东安道场，讲说涅槃，调和南北学说，护持大乘正法
  phases:
  - key: brewing
