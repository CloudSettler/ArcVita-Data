  era: 南朝宋
  reign_ref: 宋文帝元嘉
  archetype: 译经弘法者
  dilemmas:
  - 泥洹六卷文义未周，若增补重治则招僭续之谤，若守缺则大义不全，如何取舍
  - 常住佛性之说触动旧学，若力弘则纷争并起，若退让则正法不明，如何自处
  lesson: 守阙不如补阙，调和众说以全大义，方能令正法久住
  summary_first_person: 吾为宋沙门慧严，少出家，住建康东安，愍六卷泥洹未备，遂与慧观等依大本加治，成南本涅槃三十六卷，阐常住佛性，愿末世众生皆得归依
  source_urls:
