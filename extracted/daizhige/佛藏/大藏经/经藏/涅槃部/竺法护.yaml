  - key: climax
    name: 译灌腊经明福愿
    labels:
      zh: 译腊
    start_date: 0290
    highlight_event_id: guji-竺法护-event-translate-guanla
  - key: closure
    name: 世乱守道以终弘业
    labels:
      zh: 守终
    start_date: 0308
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0286
    title_zh: 先译正法华经立大乘宗本
    rationale: 以大乘义理未弘于晋土当先立经教纲维再明福愿行事
  - date: 0290
    title_zh: 译般泥洹后灌腊经示福罪
    rationale: 以四辈弟子问灌腊所用及七月十五度亡之义当明施僧然灯供养与负愿五罪三恶之报以劝信践愿
