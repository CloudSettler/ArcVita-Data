person:
  qid: guji-竺法护
  name_zh: 竺法护
  names:
    zh: 竺法护
    en: Dharmaraksa
  lifespan:
    birth:
      date: '0230'
      precision: year
      is_circa: true
      raw: 约公元二三〇年生于敦煌月氏家
    death:
      date: 0308
      precision: year
      is_circa: true
      raw: 约西晋永嘉二年卒于洛阳
  birth_date: '0230'
  death_date: 0308
  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉
  archetype: 译经弘法者
  dilemmas:
  - title_zh: 梵汉文义如何两全
    description: 梵本广博华言简略直译则晦涩文饰则失真欲存本旨而通俗解两难并存
  - title_zh: 世乱弘法去留如何抉择
    description: 永嘉丧乱弟子劝隐而经像未竟若去则负付嘱若留则蹈危难进退维谷
  lesson: 减财发愿当践信施，灌腊度亡当归众僧，以信践愿以福济亲方为度世之道
  summary_first_person: 吾本月氏裔生于敦煌，八岁出家志在弘法，随师西行遍历西域得梵本百六十余部，归国敷演于长安洛阳，译正法华及般泥洹后灌腊等经，阐灌腊福愿因果，愿众生以信满愿以善度亲
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E6%B6%85%E6%A7%83%E9%83%A8/%E8%88%AC%E6%B3%A5%E6%B4%B9%E5%90%8E%E7%81%8C%E8%85%8A%E7%BB%8F.html
