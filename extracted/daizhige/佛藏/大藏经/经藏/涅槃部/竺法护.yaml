  dilemmas:
  - 梵本浩繁而华言有限直译失旨意译失真如何取舍以存佛意
  - 世人喜杂句小经易解邀名深经难弘如何坚守正典不媚世俗
  - 永嘉乱起留洛殉法与西归避难保经全法如何抉择
  lesson: 护戒摄心修慧为本，质朴守真，案本说经，则正法久住
  summary_first_person: 吾本月氏，八岁出家，游学西域，携梵本归华，止敦煌长安洛阳译经弘化，译当来变经以警后世，愿诸学道者弃绮饰守根门，宣传正经不失佛意
