    highlight_event_id: guji-竺法护-event-return
  decisions:
  - date: 0259
    title_zh: 决意随师西行求法
    rationale: 以中原旧译不足梵本难得故远游西域求正本兼习三十六种胡言
  - date: '0266'
    title_zh: 决意携经东归弘化
    rationale: 以已得梵本众多当归本土翻译敷演令华人得闻正法故不留西土
- id: guji-竺法护-endeavor-2
  title_zh: 弘译灌腊阐福愿因果
  description: 止于长安洛阳敦煌等地设译场译正法华及般泥洹后灌腊经，明灌腊福田与誓愿因果
  phases:
