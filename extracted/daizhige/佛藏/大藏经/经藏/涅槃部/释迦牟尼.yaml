  dilemmas:
  - 慈念众生哀慕啼泣欲留住世与宿愿时至示现无常入灭之两难
  - 以神通威德即灭度恶护世与以身教开示万物法起当灭之两难
  lesson: 万物皆无常，法起当有灭，唯以戒定慧为依怙，不以色身存亡为得失。
  summary_first_person: 吾为迦毗罗卫瞿昙，出家成道，游化四十九年，最后至鸠夷那竭力士生地双树之间，命阿难敷师子床北首而右胁卧，为四方来会之童子天龙说法，示无常而般泥洹，嘱后世以法为师。
