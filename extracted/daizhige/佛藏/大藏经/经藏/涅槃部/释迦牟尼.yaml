  - title_zh: 化缘已毕与愍众嘱累
    description: 自知不久当般涅槃一切有为悉舍，犹愍众生以慈软音嘱付法眼
  - title_zh: 法眼久住与末世渐没
    description: 既愿正法饶益天人，又悬记千年之后渐当隐没，令弟子勤加护持
  lesson: 佛事已毕犹以慈心嘱累，正法兴衰系于持戒多闻和合，护持法眼令无断绝乃报佛恩
  summary_first_person: 吾在拘尸城娑罗双林临般涅槃，已三转无上法轮建幢击鼓济度应度者，今以无上正法付嘱阿难等，记千年法住兴衰及阿输迦护法，愿未来世佛眼常无断绝
