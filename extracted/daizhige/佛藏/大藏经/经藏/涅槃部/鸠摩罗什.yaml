    title_zh: 受姚兴请入长安专事翻译
    rationale: 为使大乘普行汉地，流通正法不断佛种，不辞国师之任，聚众校译
  - date: '0405'
    title_zh: 译集一切福德三昧明发心集福
    rationale: 欲令众生知一切福摄于初发菩提心中，故详译那罗延问佛及净威力士因缘，以劝发心修一乃至十法
