    description: 已通三藏而自觉小乘不足，抉择违亲远行，遍参莎车疏勒诸师以求大乘深义
  - title_zh: 逼娶破戒与弘法大愿
    description: 先后为龟兹王吕光逼娶，身处尘俗而心存出世，以译经利生赎愆，不舍一切智心
  lesson: 不舍一切智心即摄一切福德，以布施持戒多闻为柱，方得不失功德正法智慧
  summary_first_person: 吾生龟兹，七岁出家，先习小乘，后转大乘，历罽宾莎车而悟空性，入长安译经，传集一切福德三昧，愿众生发菩提心，集一切福而不退转
