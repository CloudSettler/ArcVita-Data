    title_zh: 舍小乘转学大乘
    rationale: 见小乘偏空不摄众生，为集大福当发菩提心，故从大乘师受空性深观
  - date: 0382
    title_zh: 留龟兹弘化而不即东行
    rationale: 母西往天竺嘱其东阐大法，暂住龟兹化导，以待东土机缘成熟
