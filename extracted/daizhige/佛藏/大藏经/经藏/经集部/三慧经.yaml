    title_zh: 广设譬喻破诤
    rationale: 众生各见少法自谓大解故以象足鼻耳尾之诤喻之令舍偏执
  - date: 0365-01-01
    title_zh: 劝内治守意为上
    rationale: 外求财宝如蜂作蜜终属他人，唯守意念道为内治生及内力故劝忍辱不贪至诚
