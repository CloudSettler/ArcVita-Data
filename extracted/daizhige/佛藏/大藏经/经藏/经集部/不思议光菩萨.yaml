  - 宿世恶口业报现前弃于空处如何转苦厄为法缘
  lesson: 黑白之业终不败亡当护身口意近善知识以空慧行大悲速得无生忍
  summary_first_person: 我本造恶口业堕淫女胎弃于空处蒙佛悲愍与我对论空性得放光明名不思议光复闻四法得无生忍蒙授记未来净洁土成佛
