events:
- id: guji-不思议光菩萨-event-birth
  title_zh: 舍卫空处诞生被弃
  date: -0480-05-08
  year_of: -480
  place_zh: 舍卫大城中路空处
  description: 淫女生子容貌端严自嗽右指弃捐空处狐狼狗舐而不逼多人围观生希有心
- id: guji-不思议光菩萨-event-debate
  title_zh: 空处与佛对偈论空
  date: -0480-05-10
  year_of: -480
  place_zh: 舍卫城空处
  description: 世尊乞食至空处与婴儿往复以偈论想空众生悲结心性三世如来出世世谛第一义婴儿悔过执佛指而起
- id: guji-不思议光菩萨-event-light
  title_zh: 升空放光得名不思议光
  date: -0480-05-10
  year_of: -480
  place_zh: 舍卫城上空七多罗树
  description: 婴儿升空放光遍照三千大千天龙来集释梵请名世尊即可名不思议光形如八岁童子说菩萨法服
- id: guji-不思议光菩萨-event-mother
  title_zh: 入母舍劝母供佛发心
  date: -0480-05-12
  year_of: -480
  place_zh: 所生母舍及祇陀林
  description: 随佛乞食至母舍劝母勿耻以天华香衣供佛引导发无上菩提心佛记不堕难趣终当成佛
- id: guji-不思议光菩萨-event-prophecy
  title_zh: 闻四法得忍授记未来佛
  date: -0480-06-02
  year_of: -480
  place_zh: 祇陀林给孤穷精舍
  description: 佛为波斯匿王说过去饶财谤贤天九十一劫弃捐之业复为婴儿说因缘空三世平等诸四法得无生忍升空动地佛授记百千阿僧祇劫后净洁土成佛号不思议光
- id: guji-不思议光菩萨-event-death
  title_zh: 此土缘尽示现离世
  date: -0400-12-01
  year_of: -400
  place_zh: 阎浮提
  description: 恶业行尽善业成就化缘既毕于此土示现寿终待未来无咎劫净洁土最初成佛寿命二十中劫
