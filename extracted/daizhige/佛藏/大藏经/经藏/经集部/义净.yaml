  birth_date: 413
  death_date: 459
  era: 唐
  reign_ref: 武周久视
  archetype: 西行求法译经者
  dilemmas:
  - 海路西行艰险与求法弘愿之间的生死抉择
  - 专宗大乘与兼习声闻之间的退转与不退抉择
  lesson: 守住大乘正信而不杂退，方能由不定转入决定，直趣菩提。
  summary_first_person: 我是义净，齐州历城张氏子，十四出家，慕法显玄奘西行，泛海至印度那烂陀学法十余年，携经四百余部归国，于洛阳长安译经五十六部，宣说决定不退之大乘正道。
