    title_zh: 专以毗尼为宗兼译显密
    rationale: 见末世懈怠放逸，特以少欲知足策励僧团，令具戒定慧
  - date: '0705'
    title_zh: 略出教诫以警策懈怠苾刍
    rationale: 依佛略教诫本怀，举焚尸木喻，劝断无明勤修解脱
events:
- id: guji-义净-event-birth
  title_zh: 出生于齐州历城
  date: '0635'
  year_of: 635
  place_zh: 齐州历城张氏
  description_zh: 贞观九年生于齐州历城，俗姓张，字文明，幼即慕道出家
- id: guji-义净-event-departure
  title_zh: 自广州浮海西行求法
  date: '0671'
  year_of: 671
  place_zh: 广州至室利佛逝至印度
  description_zh: 咸亨二年自广州浮海，经室利佛逝，历艰险抵印度，入那烂陀寺从学十年
- id: guji-义净-event-return
  title_zh: 携经东归抵洛阳
  date: 0695
  year_of: 695
  place_zh: 洛阳
  description_zh: 久留南海著述后，携梵本四五百部归国，武后亲迎礼为三藏
- id: guji-义净-event-translation
  title_zh: 译出佛说略教诫经等典
  date: '0705'
  year_of: 705
  place_zh: 长安洛阳译场
  description_zh: 奉制主持译场，译出五六部二百三十卷，内有佛说略教诫经，劝少欲知足断无明求解脱
- id: guji-义净-event-death
  title_zh: 示寂于长安
  date: '0713'
  year_of: 713
  place_zh: 长安
  description_zh: 先天二年示寂，年七十九，一生以弘律译经为业，遗著南海寄归传等传世
