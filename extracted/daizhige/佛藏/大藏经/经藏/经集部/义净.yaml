endeavors:
- id: guji-义净-endeavor-1
  title_zh: 泛海南行求法取经
  summary: 咸亨二年自广州浮海，经室利佛逝至印度，那烂陀十年学律，游学中印，携梵本四百余部归国。
  phases:
  - key: brewing
    name: 齐州出家立志慕西
    labels:
      zh: 立志求法
    start_date: 0649
    highlight_event_id: guji-义净-event-birth
  - key: breakthrough
    name: 广州登舟浮海西去
    labels:
      zh: 泛海发愿
    start_date: 441
    highlight_event_id: guji-义净-event-xixing
  - key: climax
    name: 那烂陀学律十年
    labels:
      zh: 学律取经
    start_date: 0680
    highlight_event_id: guji-义净-event-xixing
  - key: closure
    name: 携经归国至洛阳
    labels:
      zh: 归国献经
    start_date: 0695
    highlight_event_id: guji-义净-event-huiguo
  decisions:
  - date: 441
    title_zh: 舍陆从海西行
    rationale: 慕法显玄奘高迹，避西域阻隔，取南海路直达印度，以速求戒律梵本。
  - date: 0680
    title_zh: 久住那烂陀专学
    rationale: 欲穷律藏根本，须依胜友长期熏修，不贪游历速成，以成译经根基。
- id: guji-义净-endeavor-2
  title_zh: 奉制译经弘宣大乘
  summary: 武周久视至景云年间，于洛阳大福先寺及长安内道场主持译场，译出入定不定印经等五十六部，弘决定不退之菩萨行。
  phases:
  - key: brewing
    name: 洛阳献经蒙礼入译场
    labels:
      zh: 入译场
    start_date: 0695
    highlight_event_id: guji-义净-event-huiguo
  - key: breakthrough
    name: 大福先寺译入定不定印经
    labels:
      zh: 译决定印
    start_date: 448
    highlight_event_id: guji-义净-event-yiding
  - key: climax
    name: 长安洛阳广译律经
    labels:
      zh: 广译弘法
    start_date: 449
    highlight_event_id: guji-义净-event-yiding
  - key: closure
    name: 示寂长安藏经永传
    labels:
      zh: 圆寂传经
    start_date: 459
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: 0700-05-05
    title_zh: 先译入定不定印经明退不退
    rationale: 欲令初发心菩萨远离声闻杂习，安住大乘 reading 演说，故首辨羊车象车退转与三决定行不退。
  - date: 453
    title_zh: 专弘大乘兼护律行
    rationale: 以戒为基，以大乘信愿摄持，令身语心清净，教他亦住戒护，成就如来神力行。
events:
- id: guji-义净-event-birth
  date: 413
  year_of: 635
  title_zh: 义净诞生于齐州历城
  description: 唐贞观九年生于齐州历城张氏，字文明，十四岁出家，志慕西行求法。
- id: guji-义净-event-xixing
  date: 441
  year_of: 671
  title_zh: 自广州泛海西行
  description: 唐咸亨二年秋，自广州浮海，经室利佛逝，历艰险赴印度求法。
- id: guji-义净-event-huiguo
  date: 0695
  year_of: 695
  title_zh: 携经归国至洛阳
  description: 证圣元年夏，携梵本四百余部归至洛阳，得武后迎礼，入大福先寺译场。
- id: guji-义净-event-yiding
  date: 0700-05-05
  year_of: 700
  title_zh: 大福先寺译毕入定不定印经
  description: 久视元年庚子五月五日，于大福先寺翻译院奉制译毕此经，明五种菩萨行与退不退印，御制序以弘传。
- id: guji-义净-event-death
  date: 459
  year_of: 713
  title_zh: 示寂于长安
  description: 唐先天二年正月示寂于长安，谥号鸿胪卿，所译经律流布天下，入藏永传。
