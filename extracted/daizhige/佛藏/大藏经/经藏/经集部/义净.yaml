  description: 奉制主持译场，译出根本说一切有部律、金光明最胜王经等五十余部
- id: guji-义净-event-bawuxia
  title_zh: 奉制译出佛说八无暇有暇经
  date: '0703'
  year_of: 703
  location_zh: 长安
  description: 于室罗伐城给孤独园之说，分别八无暇与有暇，佛在世说法时堕地狱饿鬼傍生等为无暇，生中国根具正见逢佛为有暇，译竟以伽他重颂劝修
- id: guji-义净-event-death
  title_zh: 圆寂于长安
  date: '0713'
  year_of: 713
  location_zh: 长安
  description: 唐玄宗先天二年圆寂于长安，世寿七十九，谥号鸿胪卿，葬于龙门
