  date: '0635'
  year_of: 635
  location_zh: 齐州
  description: 唐太宗贞观九年生于齐州，幼颖悟，七岁出家，遍习经律
- id: guji-义净-event-xixing
  title_zh: 自广州泛海赴印度
  date: '0671'
  year_of: 671
  location_zh: 广州
  description: 唐高宗咸亨二年，自广州乘舶南行，经室利佛逝，历险赴印度求法
- id: guji-义净-event-qiufa
  title_zh: 那烂陀学法
  date: 0680
  year_of: 680
  location_zh: 中印度那烂陀寺
  description: 居那烂陀从师研习有部律及大乘经论，兼游中西印度圣迹，淹留多年
- id: guji-义净-event-guiguo
  title_zh: 携梵本归国洛阳
  date: 0695
  year_of: 695
  location_zh: 洛阳
  description: 武后证圣元年归抵洛阳，献梵本四百余部，奉敕入译，授三藏之号
- id: guji-义净-event-yichang
  title_zh: 主持译场广翻经律
  date: '0700'
