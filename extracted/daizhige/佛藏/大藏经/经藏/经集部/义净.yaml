  - date: 0695
    title_zh: 专事翻译不复远游
    rationale: 感国恩弘护，念中土亟需律典正行，遂舍游方而就笔受，以译业报佛恩
  - date: '0703'
    title_zh: 别译八无暇以警策时众
    rationale: 见世人寡闻不识暇满，欲令知八难处难闻法，得暇者勤修善品，故以浅近开示分别演说
events:
- id: guji-义净-event-birth
