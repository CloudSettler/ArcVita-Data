  decisions:
  - date: '0671'
    title_zh: 决意泛海西行
    rationale: 慕法显玄奘遗风，不畏海途险远，为求律本广利末法，故舍安稳而就艰危
  - date: 0680
    title_zh: 留学那烂陀专攻律部
    rationale: 见中土律藏未备，欲正僧制弘范，故久住从师，穷究有部律学
- id: guji-义净-endeavor-2
  title_zh: 奉制译经弘法
  summary: 归国后奉武后及中宗睿宗敕命主持译场，译出根本说一切有部律及大孔雀经等，兼译八无暇有暇经劝修有暇
