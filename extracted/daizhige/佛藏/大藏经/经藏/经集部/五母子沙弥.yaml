  dilemmas:
  - 一身展转五母腹中作子，五家同悲啼哭欲自杀，恩爱牵缠深重
  - 目见畜生饿鬼地狱恐怖，怜伤五母不能自脱，自度与度他两难
  lesson: 恩爱不断轮回不息，离贪欲断生死乃得泥洹最乐，作善得福作恶得殃因果不遗
  summary_first_person: 我年七岁好道辞母随师入山，至八岁得慧眼知宿命，忆一身曾为五母作子，累五家啼哭愁毒，因笑世间展转相生相笑，今已断生死会，唯愿众生断爱精进离苦得乐
