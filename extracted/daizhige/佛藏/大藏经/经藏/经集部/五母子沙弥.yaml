events:
- id: guji-五母子沙弥-event-birth
  person_id: guji-五母子沙弥
  title_zh: 生于世间展转作五母子
  date: -0560-01-01
  year_of: -560
  place_zh: 古印度
  description_zh: 一魄展转与五母腹中作子，或同邻生子而母悲，或早死乳儿而母泣，或十岁死临食而母哭，或娶妇时母念，或七岁出家而母念生死
- id: guji-五母子沙弥-event-renunciation
  person_id: guji-五母子沙弥
  title_zh: 年七岁辞母入山作沙弥
  date: -0553-01-01
  year_of: -553
  place_zh: 山中
  description_zh: 年始七岁大好道法，辞母出家求作沙弥，随大沙门于山中学道，给师所须诵经行道时无有懈
- id: guji-五母子沙弥-event-enlightenment
  person_id: guji-五母子沙弥
  title_zh: 年八岁得慧眼知宿命
  date: -0552-01-01
  year_of: -552
  place_zh: 山中
  description_zh: 至年八岁得慧眼能通视无极，耳彻听天上天下善恶，身能飞行分身自化，自知宿命所从来生及善恶之道
- id: guji-五母子沙弥-event-preaching
  person_id: guji-五母子沙弥
  title_zh: 说五母因缘叹世飞去
  date: -0552-03-01
  year_of: -552
  place_zh: 山中
  description_zh: 为师说五母适共一会相对啼哭之事，叹凡人不知死当有所至，作善得福作恶入泰山地狱，厌苦求道怜伤五母，说已便飞去
- id: guji-五母子沙弥-event-death
  person_id: guji-五母子沙弥
  title_zh: 得罗汉道后入灭归土
  date: -0540-01-01
  year_of: -540
  place_zh: 山中
  description_zh: 已断生死恩爱离贪欲，可得度脱不复与生死会，身归土魂随善恶，入泥洹道最乐长离勤苦
