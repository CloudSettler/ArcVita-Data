  - 不见如来忧悲将死与往圣住处睹空益悲之两难
  - 欲造佛像除忧与恐不似于佛获罪之两难
  lesson: 随分至诚造像供养能拔忧恼广种成佛之因
  summary_first_person: 吾为憍赏弥优陀延王，佛升忉利为母说法时，阎浮无佛，吾渴仰成疾，恐命终不见佛，遂发心以紫栴檀造坐像，天匠相助而成，躬自荷戴迎于僧伽尸，蒙佛授记赞叹，始开造像轨则。
