    start_date: -0485
    highlight_event_id: guji-优陀延王-event-1
  - key: breakthrough
    name: 决意造像
    labels:
      zh: 随分造像
    start_date: -0485
    highlight_event_id: guji-优陀延王-event-1
  - key: climax
    name: 天匠成像
    labels:
      zh: 紫檀坐像
    start_date: -0485
    highlight_event_id: guji-优陀延王-event-2
  - key: closure
    name: 见像得忍
    labels:
      zh: 忧恼销除
    start_date: -0485
    highlight_event_id: guji-优陀延王-event-2
  decisions:
  - date: -0485
    title_zh: 不以难而废造像
    rationale: 如渴饮河不以不能尽而不饮，当随分造像礼拜供养以除忧恼
  - date: -0485
    title_zh: 选用紫栴檀作坐像
    rationale: 从智臣议，一切诸佛成道说法降魔皆坐故，应作坐师子座结跏像
  - date: -0485
    title_zh: 迎天匠专精速成
    rationale: 毗首羯磨天化为匠者巧妙无匹，宜择月初八日祥庆日起作早得瞻仰
- id: guji-优陀延王-endeavor-2
  person_qid: guji-优陀延王
  title_zh: 荷像迎佛于僧伽尸
  summary: 佛将下阎浮提，率四兵躬荷佛像赴僧伽尸城献供，蒙佛称赞授菩提记。
  phases:
  - key: brewing
    name: 闻佛将下
    labels:
      zh: 欢喜踊跃
    start_date: -0484
    highlight_event_id: guji-优陀延王-event-3
  - key: breakthrough
    name: 严驾赴会
    labels:
      zh: 荷戴佛像
    start_date: -0484
    highlight_event_id: guji-优陀延王-event-3
  - key: climax
    name: 献像于佛
    labels:
      zh: 对佛奉献
    start_date: -0484
    highlight_event_id: guji-优陀延王-event-3
  - key: closure
    name: 蒙佛赞记
    labels:
      zh: 初为轨则
    start_date: -0484
    highlight_event_id: guji-优陀延王-event-3
  decisions:
  - date: -0484
    title_zh: 躬荷佛像赴僧伽尸
    rationale: 以花幡音乐随逐供养，从本国向僧伽尸城恭敬迎佛
  - date: -0484
    title_zh: 以像及上供奉献如来
    rationale: 自陈所造不似于佛深为过咎，求佛印可，蒙言非为过咎已作无量利益
events:
- id: guji-优陀延王-event-birth
  person_qid: guji-优陀延王
  date: '-0560'
  year_of: -560
  title_zh: 降生憍赏弥王家
  description: 生于憍赏弥国王族，后嗣位为王，号优陀延，与佛同时在世
- id: guji-优陀延王-event-1
  person_qid: guji-优陀延王
  date: -0485
  year_of: -485
  title_zh: 宫中悲慕决意造像
  description: 佛升三十三天为母说法，阎浮无佛如国无君，渴仰将死，召集工巧，定议以纯紫栴檀作坐像
- id: guji-优陀延王-event-2
  person_qid: guji-优陀延王
  date: -0485
  year_of: -485
  title_zh: 天匠斫木像成得忍
  description: 毗首羯磨天化为匠者，月初八日弗沙宿合时斫木，声彻忉利，不日成七尺加趺坐像，面及手足紫金色，王见像生净信获柔顺忍
- id: guji-优陀延王-event-3
  person_qid: guji-优陀延王
  date: -0484
  year_of: -484
  title_zh: 僧伽尸城献像迎佛
  description: 佛蹈三道宝阶下僧伽尸，王乘白象躬荷所造像并上供奉献，佛赞初为轨则令众生得信利，遥授无上菩提记
- id: guji-优陀延王-event-death
  person_qid: guji-优陀延王
  date: -0480
  year_of: -480
  title_zh: 功成命终
  description: 造像迎佛功德成就，业障忧恼销除，唯除现身一业，后命终流转，史传与佛法因缘深厚
