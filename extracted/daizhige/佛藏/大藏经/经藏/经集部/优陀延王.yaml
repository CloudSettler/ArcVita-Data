  person_qid: guji-优陀延王
  title_zh: 思慕发心造佛形像
  summary: 佛在忉利天三月安居，阎浮似暗夜无月，决意依相好随分造像，开后世轨则。
  phases:
  - key: brewing
    name: 忧悲思慕
