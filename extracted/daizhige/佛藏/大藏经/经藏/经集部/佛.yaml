endeavors:
- id: guji-佛-endeavor-1
  person_qid: guji-佛
  title_zh: 开示真孝化亲奉戒
  summary_zh: 破供养即孝之见立去恶向善持五戒归三宝为真孝并示极谏化亲之次第
  phases:
  - key: brewing
    name: 问亲恩述养恩
    labels:
      zh: 怀胎乳哺推燥卧湿
    start_date: -483-01-10
    highlight_event_id: guji-佛-event-1
  - key: breakthrough
    name: 辨供养非真孝
    labels:
      zh: 甘露天乐荷负四海未为孝
    start_date: -483-01-11
    highlight_event_id: guji-佛-event-1
  - key: climax
    name: 立化亲奉戒为孝
    labels:
      zh: 极谏启悟奉持五戒三归
    start_date: -483-01-12
    highlight_event_id: guji-佛-event-1
  - key: closure
    name: 显真孝福报安乐
    labels:
      zh: 九族和睦往生天上闻法得道
    start_date: -483-01-13
    highlight_event_id: guji-佛-event-1
  decisions:
  - date: -483-01-11
    title_zh: 否定衣食供养为足孝
    rationale: 供养虽大不能令亲离恶业苦果故未为孝
  - date: -483-01-12
    title_zh: 决以三尊至化导亲
    rationale: 唯奉佛五戒三自归能令亲现安后生天上长别众苦恩重于乳哺
- id: guji-佛-endeavor-2
  person_qid: guji-佛
  title_zh: 诫女色惑乱劝独清修
  summary_zh: 诫娶妻近女色违孝乱政亡民劝沙门独而不双清洁其志以道为务
  phases:
  - key: brewing
    name: 示女色妖蛊之变
    labels:
      zh: 女情多欲好色无倦
    start_date: -483-01-14
    highlight_event_id: guji-佛-event-2
  - key: breakthrough
    name: 明薄智回志没身
    labels:
      zh: 睹姿态不觉微渐从邪乱
    start_date: -483-01-15
    highlight_event_id: guji-佛-event-2
  - key: climax
    name: 陈杀身灭宗之祸
    labels:
      zh: 危亲杀君自古皆由女色
    start_date: -483-01-16
    highlight_event_id: guji-佛-event-2
  - key: closure
    name: 劝独守明戒得道
    labels:
      zh: 独而不双奉戒为君臣父子之则
    start_date: -483-01-17
    highlight_event_id: guji-佛-event-2
  decisions:
  - date: -483-01-16
    title_zh: 远离女色亲贤守戒
    rationale: 女色荒迷于欲能危亲杀君灭宗故当远贤不亲潜意寂寞学志睿达
  - date: -483-01-17
    title_zh: 立沙门独修清洁之制
    rationale: 独而不双方能清洁其志以道为务世世逢佛见法得道
