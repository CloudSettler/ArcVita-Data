  dilemmas:
  - 扶南海路艰险与赴梁弘法弘愿如何兼顾
  - 梵本义理深广与梁地华言达意如何取舍
  - 头陀苦行持戒与随方利物开缘如何权衡
  lesson: 以信达传译为舟筏，持戒契理而不滞文，利物弘法当随缘善巧
  summary_first_person: 我本扶南海滨扶南国人，幼慕佛法博习三藏，闻梁土崇佛遂泛海东来，蒙武帝礼遇住建康译场，译出文殊师利问经等，备述菩萨戒行与般若中道，愿以华言传佛本怀，令戒定慧流通无碍
  source_urls:
