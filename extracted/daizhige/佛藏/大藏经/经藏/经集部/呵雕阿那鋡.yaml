  decisions:
  - date: -500
    title_zh: 将众先诣舍利弗后诣佛
    rationale: 欲令大众次第闻法生欢喜，再以头面著地绕佛三匝亲承印可
  - date: -500
    title_zh: 长跪陈四事摄众
    rationale: 常以布施与善语与瞻视给足与财共不计教化五百弟子，故直陈以求证
- id: guji-呵雕阿那鋡-endeavor-2
  title_zh: 归舍转教守定隐德
  summary_zh: 还家次第为人客奴婢与持藏伎女及夫人妇女说生死善恶与经戒，还至正殿斋戒端坐得平等心，虽有天王下舍称誉而不答，比丘传佛誉则虑白衣信谤与烦扰，蒙佛更说八不欲令人知事
  phases:
