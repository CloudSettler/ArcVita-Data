    start_date: -500
    highlight_event_id: guji-呵雕阿那鋡-event-2
  - key: climax
    name: 端坐得定不答天誉
    labels:
      zh: 守定不答
    start_date: -499
    highlight_event_id: guji-呵雕阿那鋡-event-2
  - key: closure
    name: 佛说八隐德
    labels:
      zh: 隐德不扰
    start_date: -499
    highlight_event_id: guji-呵雕阿那鋡-event-3
  decisions:
  - date: -500
    title_zh: 归家三处次第说法
    rationale: 欲令奴婢人客与藏吏伎女及夫人妇女皆得闻生死善恶与经戒欢喜
  - date: -499
    title_zh: 得定不答天王与慎问佛誉
    rationale: 不欲以名闻烦扰于人，恐白衣不信堕泥犁，信者又来承事布施，故守定不答并问比丘佛誉时有无白衣
events:
- id: guji-呵雕阿那鋡-event-birth
  title_zh: 降生阿荼
  date: -550
  year_of: -550
  place_zh: 阿荼城
  summary_zh: 约公元前六世纪生于阿荼，为长者子，后为佛世著名在家领袖
- id: guji-呵雕阿那鋡-event-1
  title_zh: 将众诣舍利弗复诣佛蒙印四摄
  date: -500
  year_of: -500
  place_zh: 舍卫国祇园
  summary_zh: 将五百优婆塞诣舍利弗所作礼闻法欢喜退，复诣佛所头面作礼绕佛三匝，自陈奉行布施与说善语与瞻视给足与财共不计四事，佛印可为过去未来现在诸佛无过于是
- id: guji-呵雕阿那鋡-event-2
  title_zh: 归舍三处说法端坐得定天王称誉
  date: -499
  year_of: -499
  place_zh: 本舍正殿
  summary_zh: 还归入舍呼人客奴婢及持藏伎女与夫人妇女次第说经戒生死善恶之道，还至正殿斋戒端坐得平等心，四王请诸天集会称誉，中尊王下至其舍面称其德，时守定心而不答
- id: guji-呵雕阿那鋡-event-3
  title_zh: 问佛誉有无白衣蒙说八不欲人知
  date: -499
  year_of: -499
  place_zh: 本舍及佛所
  summary_zh: 起迎比丘问佛称誉时边有无白衣，虑白衣不信堕泥犁信者又来烦扰，留比丘饮食后比丘还白佛，佛赞善哉更说不求人知与信与惭愧与精进与自观与得禅与黠慧八事皆不欲令人知以不扰人
- id: guji-呵雕阿那鋡-event-death
  title_zh: 舍寿而逝
  date: -480
  year_of: -480
  place_zh: 阿荼城
  summary_zh: 约公元前五世纪舍寿，其四摄将众与八隐守德为后世居士典范
