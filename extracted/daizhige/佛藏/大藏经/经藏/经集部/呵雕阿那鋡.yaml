  summary_first_person: 我是呵雕阿那鋡，常将五百优婆塞亲近舍利弗与佛，以四事摄众，蒙佛印可，归家则次第为僮仆奴婢与藏吏伎女及夫人妇女说法，端坐得定，不答天誉，不愿以名闻烦扰于人
