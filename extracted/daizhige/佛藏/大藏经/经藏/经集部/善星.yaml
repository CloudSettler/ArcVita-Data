  dilemmas:
  - 信种不具而自谓知见与亲见圣德相违
  - 覆藏自罪执自辩才与如实忏悔敬信之间的抉择
  lesson: 具足信种敬佛法僧，莫以自辩不正智谤出要之法，覆藏相续谤言必如重担速堕恶趣
  summary_first_person: 我是毗舍离长者子善星，曾亲近佛法而后舍离，以多种因缘谤佛法僧，谓沙门瞿昙无最上法不能出要尽苦边际，世尊于最胜林中为舍利子广说十力四无畏八众六趣譬喻，记我以覆藏谤言速堕地狱，我事为后世警示，信种不具谤圣必受极苦
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0757
  - https://github.com/daizhige-org/daizhigev20
