  summary_first_person: 我闻佛说女人发无上心则永断恶法，便起座合掌，为利众生、为施安乐、为不断佛种而发阿耨多罗三藐三菩提心，不乐声闻辟支佛地，唯乐如来地一切智地，必定修行教化众生
