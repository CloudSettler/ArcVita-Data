    title_zh: 抉择以空性解四谛
    rationale: 见众生于四谛颠倒轮回，故依不生不灭显苦集灭道平等实相
  - date: '0995-01-01'
    title_zh: 以平等无所得摄道品
    rationale: 恐学者执念处根力觉分道分为实，故一一会归离相离念以绝戏论
events:
- id: guji-天息灾-event-birth
  person_id: guji-天息灾
  date: '0950-01-01'
  year_of: 950
  title_zh: 诞生于中印度惹烂驮啰国
  description_zh: 生于密林寺属地，自幼出家，精通三藏，尤善大乘空宗法义
- id: guji-天息灾-event-arrival
  person_id: guji-天息灾
  date: '0980-01-01'
  year_of: 980
  title_zh: 太平兴国间赴宋抵东京
  description_zh: 应宋太宗诏入华，赐紫衣，赐号明教大师，入译经院与施护等合译
- id: guji-天息灾-event-translate
  person_id: guji-天息灾
  date: '0990-01-01'
  year_of: 990
  title_zh: 奉诏译出善见变化文殊问法经
  description_zh: 于东京译出此经，明佛为颠倒众生说真实四圣谛，文殊屡问而佛广演念处正勤根力觉分圣道
- id: guji-天息灾-event-preach
  person_id: guji-天息灾
  date: '0995-01-01'
  year_of: 995
  title_zh: 会通道品宣演平等寂静
  description_zh: 演说见一切法不生即见苦集灭道及三十七道品，三万二千天子得法，八千比丘得漏尽，菩萨得无生忍
- id: guji-天息灾-event-death
  person_id: guji-天息灾
  date: '1001-01-01'
  year_of: 1001
  title_zh: 示寂于东京译经院
  description_zh: 译业既广，功圆示寂，众门人礼敬流通其所译善见变化等经，大地震动天花雨空之瑞传为美谈
