events:
- id: guji-威灯光-event-birth
  title_zh: 生于古印度修梵行成长寿仙首
  date: -0590
  year_of: -590
  place_zh: 古印度摩竭陀伽耶一带
  summary_zh: 生而修外道梵行得五通寿至六万劫说为大威灯光仙人领众苦行灰涂露形寻求论议
- id: guji-威灯光-event-q1
  title_zh: 伽耶佛会问众生体粗细生处
  date: -0589
  year_of: -589
  place_zh: 伽耶城佛大会中
  summary_zh: 当众诘佛众生体从何生一搩一尺一指乃至芥子许耶佛答无言说惟无明行等因缘父母为因邪念业风为缘五阴十八界和合假名无我
- id: guji-威灯光-event-q2
  title_zh: 问业果聚集劫烧众生无苦
  date: -0589
  year_of: -589
  place_zh: 伽耶城佛大会中
  summary_zh: 再问和合生少如树花结落佛说业风吹堕胎灾甚多问聚集佛说平等一乘无余涅槃为聚并说地狱畜生饿鬼人天先世共聚今世相见之相问劫烧佛说如来方便金火炼熟慈悲手救无人受苦见佛身者悉发善心
- id: guji-威灯光-event-vow
  title_zh: 发大弘誓率众发心蒙佛授记
  date: -0589
  year_of: -589
  place_zh: 伽耶城佛大会中
  summary_zh: 为求一切智发受火坑坠山劫火五热长劫苦行不舍精进之誓八万四千仙人同发菩提心佛放眉间无能降伏光动地雨花授记未来贤劫后月主刹作佛号毗婆尸众仙于弥勒时满十地愿号威灯如来
- id: guji-威灯光-event-death
  title_zh: 示寂归于授记传说
  date: '-0500'
  year_of: -500
  place_zh: 古印度
  summary_zh: 寿终示寂史无确载依经授记当来出世成佛其问疑法本流通阎浮为大良药读诵抄写功德超供养十方
