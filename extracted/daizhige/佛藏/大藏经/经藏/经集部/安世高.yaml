    highlight_event_id: guji-安世高-event-arrival
  - key: breakthrough
    name: 译定佛印即般若印
    labels:
      zh: 定名佛印三昧为智慧印
    start_date: '0152-01-01'
    highlight_event_id: guji-安世高-event-translate-foyin
  - key: climax
    name: 明信谤功过劝持
    labels:
      zh: 信者生天作佛疑者堕泥犁
    start_date: '0152-06-01'
    highlight_event_id: guji-安世高-event-translate-foyin
  - key: closure
    name: 付嘱流通欢喜奉行
    labels:
      zh: 文殊弥勒舍利弗等欢喜作礼
    start_date: '0153-01-01'
    highlight_event_id: guji-安世高-event-south
  decisions:
  - date: '0152-01-01'
    title_zh: 以般若为佛父母立宗译弘
    rationale: 菩萨欲作佛要得摩诃般若，故标佛印即般若印以正修学要津
  - date: '0152-06-01'
