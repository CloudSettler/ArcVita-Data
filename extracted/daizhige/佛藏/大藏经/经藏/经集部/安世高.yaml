  phases:
  - key: brewing
    name: 安息出家博学
    labels:
      zh: 安息王室博览三藏
    start_date: '0130-01-01'
    highlight_event_id: guji-安世高-event-birth
  - key: breakthrough
    name: 西来洛阳立译场
    labels:
      zh: 建和二年到达洛阳
    start_date: '0148-01-01'
    highlight_event_id: guji-安世高-event-arrival
  - key: climax
    name: 译禅数要典流通
    labels:
      zh: 安般守意等三十余部盛行
    start_date: '0150-01-01'
    highlight_event_id: guji-安世高-event-translate-foyin
  - key: closure
    name: 南下弘化授徒
    labels:
      zh: 避乱江南弘化传法
    start_date: '0165-01-01'
    highlight_event_id: guji-安世高-event-south
  decisions:
  - date: '0148-01-01'
    title_zh: 舍王位不顾国难西来弘法
    rationale: 为报佛恩广利中土，弃安息王位继承而来洛阳弘传禅法
  - date: '0150-01-01'
    title_zh: 译文质朴重义不饰文藻
    rationale: 初学未谙梵义，宁存质直以传禅数实义，令学者得依教修行
- id: guji-安世高-endeavor-2
  title_zh: 译弘佛印三昧经
  summary: 译出佛印三昧一卷，宣说诸佛三昧印即摩诃般若智慧，劝信向受持速得作佛
  phases:
  - key: brewing
    name: 罗阅耆阇崛山会起
    labels:
