  name_zh: 宝授菩萨
  names:
    zh: 宝授菩萨
    en: Baoshou Bodhisattva
  lifespan:
    birth:
      date: -0503-01-01
      precision: 年
      is_circa: true
      raw: 广严城星贺里蹉尾王之子，三岁见佛
    death:
      date: -0423-01-01
      precision: 世纪
      is_circa: true
      raw: 示现寿终未载，约以人寿八十计
  birth_date: -0503-01-01
  death_date: -0423-01-01
  era: 春秋末古印度列国时代
  reign_ref: 释迦牟尼佛住广严城大林楼阁时
  archetype: 不退转大菩萨
  dilemmas:
  - title_zh: 住相求证与离相无得之抉择
    description: 若住如来相菩提相即是取相妄想，离相则难为初机所信
  - title_zh: 出家形相与无相真出家之抉择
    description: 著出家相者多起妄想求得，了法性者不住心非心性无性
  lesson: 离一切相行施说法，方为清净菩提行
  summary_first_person: 我是广严城中宝授，三岁见佛光即舍身献千叶金莲，住于空中明说菩提不生，不住声闻缘觉及佛菩提相，复以一钵普施佛僧人民，蒙佛授记过三十劫当成不空力称如来，我愿一切众生皆离相求菩提
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0488
  - https://github.com/daizhige-org/daizhigev20
endeavors:
- id: guji-宝授菩萨-endeavor-1
  title_zh: 空中献莲辩说无生法忍
  summary: 三岁投身献莲住空，论说菩提不生，对辩目连舍利弗妙吉祥
  phases:
  - key: brewing
    name: 广严见光生信
    labels:
      zh: 见光生信
    start_date: -0500-05-01
    highlight_event_id: guji-宝授菩萨-event-birth
  - key: breakthrough
    name: 投身献莲住空
    labels:
      zh: 献莲住空
    start_date: -0500-05-01
    highlight_event_id: guji-宝授菩萨-event-offering
  - key: climax
    name: 对辩声闻明无相
    labels:
      zh: 辩说无相
    start_date: -0500-05-01
    highlight_event_id: guji-宝授菩萨-event-debate
  - key: closure
    name: 佛证久学无生第一
    labels:
      zh: 佛证久学
    start_date: -0500-05-01
    highlight_event_id: guji-宝授菩萨-event-debate
  decisions:
  - date: -0500-05-01
    title_zh: 舍身献莲唯求佛菩提
    rationale: 百千俱胝劫难遇佛，今值遇甚希有，当舍此身供养，不愿证二乘，唯以第一乘常转佛刹
  - date: -0500-05-01
    title_zh: 不住一法不作相辩
    rationale: 法性本无生无为，若有所证即住相愚迷，故以无住破有相见，令众不住贪嗔痴及声闻缘觉法
- id: guji-宝授菩萨-endeavor-2
  title_zh: 一钵普施清净布施得授记
  summary: 以无相净施一钵饱众，演说五宝四念，得佛授记未来成佛
  phases:
  - key: brewing
    name: 知佛僧未有食处
    labels:
      zh: 念众未食
    start_date: -0500-05-02
    highlight_event_id: guji-宝授菩萨-event-alms
  - key: breakthrough
    name: 发愿一器无尽普饱
    labels:
      zh: 愿食无尽
    start_date: -0500-05-02
    highlight_event_id: guji-宝授菩萨-event-alms
  - key: climax
    name: 离三业行于净施
    labels:
      zh: 离相净施
    start_date: -0500-05-02
    highlight_event_id: guji-宝授菩萨-event-alms
  - key: closure
    name: 蒙佛授记不空力称
    labels:
      zh: 授记成佛
    start_date: -0500-05-02
    highlight_event_id: guji-宝授菩萨-event-prophecy
  decisions:
  - date: -0500-05-02
    title_zh: 不以身心三业施不求福果
    rationale: 所施不起于相，不见果报，不令受者还报，方为菩萨清净施
  - date: -0500-05-02
    title_zh: 常念空佛大悲不求果报
    rationale: 以空三摩地摄心，以念佛大悲利物，是为净施，能令饮食无尽众皆饱满
events:
- id: guji-宝授菩萨-event-birth
  type: birth
  title_zh: 广严城诞生为王子
  date: -0503-01-01
  year_of: -503
  location_zh: 广严城王宫殿上
  summary: 星贺里蹉尾王之子宝授诞生，三岁时乳母抱持见佛大光明照耀广严城
- id: guji-宝授菩萨-event-offering
  type: achievement
  title_zh: 殿上投身空中献千叶金莲
  date: -0500-05-01
  year_of: -500
  location_zh: 广严城王宫空中佛前
  summary: 手持千叶金莲投身而下，佛力持住空中，莲变花盖覆佛上，说偈唯为佛菩提不为断烦恼
- id: guji-宝授菩萨-event-debate
  type: achievement
  title_zh: 对辩目连舍利弗妙吉祥说无相
  date: -0500-05-01
  year_of: -500
  location_zh: 广严城佛会中
  summary: 答目连菩提不生法性无为，告舍利弗无住一法，教妙吉祥为初地说不断贪嗔不念佛法，佛证其初发心时已证无生经三百千劫
- id: guji-宝授菩萨-event-alms
  type: achievement
  title_zh: 一钵普施佛僧人民悉令饱满
  date: -0500-05-02
  year_of: -500
  location_zh: 广严城宫中佛前
  summary: 取百味饮食一器奉佛，发愿法无尽食亦无尽，诸苾刍钵皆满，余食施城中人民犹不尽
- id: guji-宝授菩萨-event-prophecy
  type: prophecy
  title_zh: 佛授记过三十劫成不空力称如来
  date: -0500-05-02
  year_of: -500
  location_zh: 广严城佛会中
  summary: 佛说五种宝四种宝为净施，记宝授过三十劫得成正觉，众会菩萨皆住不退寿亦无量，此经名菩提行亦名一切法为首
- id: guji-宝授菩萨-event-death
  type: death
  title_zh: 示现寿终未载常行轮回
  date: -0423-01-01
  year_of: -423
  location_zh: 阎浮提传说
  summary: 虽出生死常行轮回，不乐二乘，不住涅槃，寿终事迹未载，约以人寿计，实为久住不退大士待时成佛
