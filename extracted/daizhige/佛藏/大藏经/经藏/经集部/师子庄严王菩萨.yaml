  - title_zh: 未见大会如何发起请问
    description: 过去广预大会而今见未曾有之胜会当以何因缘令众生获利而发问
  - title_zh: 如何令众生信受八曼荼罗
    description: 欲以易行约仪总摄六度统陈愿行令大小乘增长当如何请佛宣说本缘
  lesson: 以善问启教以易行摄众当为众生发起胜会令正法久住
  summary_first_person: 我于过去亿百千那由他诸佛所广预大会今于耆阇崛山见未曾有之胜会故从座起顶礼围绕而问如来往昔胜行欲令众生闻八曼荼罗获四胜报同成正觉
