  place_zh: 鸡头末城
  description_zh: 父名须凡，母名摩诃越题，种姓婆罗门，身具三十二相八十种好，身长十六丈
  is_circa: true
- id: guji-弥勒-event-1
  title_zh: 阎浮改转国土成就
  date: 9999-01-01
  year_of: 9999
  place_zh: 阎浮利地
  description_zh: 东西长四十万里南北广三十二万里，地生五果无山陵溪谷，人民寿八万四千岁聚落鸡鸣相闻
  is_circa: true
- id: guji-弥勒-event-2
  title_zh: 龙华树下得佛道
  date: 9999-04-08
  year_of: 9999
  place_zh: 龙华树下
  description_zh: 于高广各四十里龙华树下坐，四月八日明星出时得道，八万四千婆罗门弃家为沙门，国王僧罗将八十四王来归
  is_circa: true
- id: guji-弥勒-event-3
  title_zh: 龙华三会说法度众
  date: 9999-05-01
  year_of: 9999
  place_zh: 龙华树下
  description_zh: 初会九十六亿人得阿罗汉，二会九十四亿比丘得道，三会九十二亿沙门得道，皆是释迦时善根者
  is_circa: true
- id: guji-弥勒-event-4
  title_zh: 鸡头末宫中受供说法
  date: 9999-06-01
  year_of: 9999
  place_zh: 鸡头末王宫
  description_zh: 将诸阿罗汉至僧罗王宫受供，举城明如昼日，说语不可不作道不可不学经不可不赞，王及百官奉行得度
  is_circa: true
- id: guji-弥勒-event-death
  title_zh: 住世度众后示灭
  date: 9999-12-31
  year_of: 9999
  place_zh: 鸡头末国
  description_zh: 化缘既周，住世八万四千岁饶益人天后示灭，遗教令众奉行经戒
  is_circa: true
