person:
  qid: guji-德护长者
  name_zh: 德护长者
  names:
    zh: 德护长者
    en: Srigupta
  lifespan:
    birth:
      date: '-0530'
      precision: year
      is_circa: true
      raw: 约公元前六世纪生于王舍城
    death:
      date: '-0450'
      precision: year
      is_circa: true
      raw: 约公元前五世纪卒
  birth_date: '-0530'
  death_date: '-0450'
  era: 古印度摩揭陀国时期
  reign_ref: 释迦牟尼住王舍城说法时期
  archetype: 受邪师惑乱而迷途知返的长者
  dilemmas:
  - 信受六师外道师教与听从子月光劝谏之间抉择
  - 设火坑毒食谋害如来与畏惧因果业报之间挣扎
  lesson: 邪见惑人造三恶业，亲近善知识听受正谏，藉佛慈悲摄受方能转浊为净
  summary_first_person: 我本王舍城大长者，初独信六师外道，受其教唆设七重火坑毒食欲害如来，赖我子月光苦谏、母月云发心，复蒙佛以神通慈力摄受，火坑成清池，毒食不能害，遂舍邪见深生净信归依三宝。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%BE%B7%E6%8A%A4%E9%95%BF%E8%80%85%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%BE%B7%E6%8A%A4%E9%95%BF%E8%80%85%E7%BB%8F.md
endeavors:
- id: guji-德护长者-endeavor-1
  title_zh: 信奉六师设火坑毒食谋害如来
  summary_zh: 受尼揵陀等六师教唆，于七重门下作火坑毒食，躬请佛陀欲加陷害。
  phases:
  - key: brewing
    name: 独信外道深受敬供
    labels:
      zh: 信邪
    start_date: '-0500'
    highlight_event_id: guji-德护长者-event-faith
  - key: breakthrough
    name: 受计设谋造火坑
    labels:
      zh: 造恶
    start_date: -0490
    highlight_event_id: guji-德护长者-event-plot
  - key: climax
    name: 躬请如来赴供
    labels:
      zh: 请佛
    start_date: -0490
    highlight_event_id: guji-德护长者-event-invite
  - key: closure
    name: 恶谋不成伏藏待发
    labels:
      zh: 待报
    start_date: -0490
    highlight_event_id: guji-德护长者-event-invite
  decisions:
  - date: -0490
    title_zh: 纳受六师火坑毒药计
    rationale: 以王舍城独受外道供养为荣，嫉佛兴盛，欲以火毒验证佛是否为一切智
  - date: -0490
    title_zh: 躬往耆阇崛山请佛受供
    rationale: 依外道所教，若佛非一切智必受请赴死，若是智者必不受请，欲试佛虚实
- id: guji-德护长者-endeavor-2
  title_zh: 受子劝谏睹神变舍邪归正
  summary_zh: 子月光及母月云苦谏不听，佛至门火坑变莲池，毒食不能害，遂生净信忏悔归依。
  phases:
  - key: brewing
    name: 子母苦谏说佛功德
    labels:
      zh: 劝善
    start_date: -0490
    highlight_event_id: guji-德护长者-event-admonish
  - key: breakthrough
    name: 佛放大光明菩萨云集
    labels:
      zh: 显圣
    start_date: -0490
    highlight_event_id: guji-德护长者-event-miracle
  - key: climax
    name: 蹈火坑不陷毒不能害
    labels:
      zh: 折邪
    start_date: -0490
    highlight_event_id: guji-德护长者-event-miracle
  - key: closure
    name: 舍浊心得清净胜信
    labels:
      zh: 归正
    start_date: -0490
    highlight_event_id: guji-德护长者-event-convert
  decisions:
  - date: -0490
    title_zh: 不纳月光谏言坚持设供
    rationale: 初谓佛若知恶心不应受请，执外道语为实，不信佛为调伏故受请
  - date: -0490
    title_zh: 睹神变后舍邪归依三宝
    rationale: 亲见火不能烧毒不能害，知佛具十力大慈悲，为拔己恶心而来，遂生惭愧忏悔
events:
- id: guji-德护长者-event-birth
  title_zh: 出生于王舍城长者家
  date: '-0530'
  year_of: '-0530'
  place_zh: 王舍城
  description_zh: 生于摩揭陀国王舍城富贵长者家，承家业为大长者，初信奉六师外道。
- id: guji-德护长者-event-faith
  title_zh: 独信六师受供养恭敬
  date: '-0500'
  year_of: '-0500'
  place_zh: 王舍城
  description_zh: 阎浮提多归佛法，惟德护长者不信瞿昙，独受尼揵陀若提子等六师之法，布施供养深彻骨髓。
- id: guji-德护长者-event-plot
  title_zh: 受教作七重火坑毒食
  date: -0490
  year_of: -0490
  place_zh: 王舍城德护宅七重门下
  description_zh: 纳六师计，于七重门下一一作深没七人火坑，置佉他罗无烟炭，铜梁草土覆上，又以毒药置饮食中。
- id: guji-德护长者-event-admonish
  title_zh: 子月光母月云苦谏说佛德
  date: -0490
  year_of: -0490
  place_zh: 王舍城德护家
  description_zh: 子月光年十六具丈夫相，知父受邪教欲害如来，诣母月云说佛难遇功德无量，复谏父莫以小火小毒害佛，佛智无量不可坏。
- id: guji-德护长者-event-invite
  title_zh: 躬往耆阇崛山请佛明日受供
  date: -0490
  year_of: -0490
  place_zh: 耆阇崛山
  description_zh: 德护见佛相好端严六根寂静，以软语请佛及僧明日就家饭食，佛知受化时至默然受请，长者告六师谓佛非一切智。
- id: guji-德护长者-event-miracle
  title_zh: 佛放大光菩萨云集赴供
  date: -0490
  year_of: -0490
  place_zh: 耆阇崛山至王舍城途中
  description_zh: 佛敕比丘著衣持钵，从四牙齿顶毫放无量色光遍照十方，东方须弥光等、南方普德光焰王、西方普焰云王、北方卢舍那等菩萨各与眷属来集，为见月光愍德护故。
- id: guji-德护长者-event-convert
  title_zh: 火坑毒食不害舍邪生信
  date: -0490
  year_of: -0490
  place_zh: 王舍城德护宅
  description_zh: 佛蹈火坑火变清凉莲池，毒食眼视消灭，德护睹大神变大慈悲，知佛为除己恶心而来，舍浊心得最上清净胜信。
- id: guji-德护长者-event-death
  title_zh: 寿终
  date: '-0450'
  year_of: '-0450'
  place_zh: 王舍城
  description_zh: 归正后护持正法，寿终谢世。
