    highlight_event_id: guji-悟空-event-huigui
  decisions:
  - date: 0780
    title_zh: 捨泛海取北路還鄉
    rationale: 慮滄波險阻，卻取北路還歸帝鄉，誓心報國奉君親，備涉艱難捐軀委命
  - date: 0787
    title_zh: 安西請蓮花精進譯經
    rationale: 至龜茲蓮花寺，誠請三藏勿提提犀魚譯出十力經，以成一卷進上廣利群品
events:
- id: guji-悟空-event-birth
  title_zh: 出生於京兆雲陽車氏
  date: 473
  year_of: 473
  place_zh: 京兆雲陽青龍鄉向義里
  description: 俗姓車氏名奉朝，後魏拓拔之胤裔，天假聰敏志尚典墳
- id: guji-悟空-event-xizheng
  title_zh: 隨張韜光西使取安西路
  date: 489
  year_of: 489
  place_zh: 疏勒至乾陀羅
  description: 蒙恩授別將隨使，經疏勒蔥嶺播蜜川等國，至乾陀羅罽賓東都城
- id: guji-悟空-event-chujia
  title_zh: 病留健馱邏投越魔出家
  date: 495
  year_of: 495
  place_zh: 健馱邏國
  description: 為重患纏綿留寄，痊後投舍利越魔三藏落發，賜法號達摩馱都唐言法界，時年二十七
- id: guji-悟空-event-shoujie
  title_zh: 迦濕彌羅蒙鞮寺受近圓
  date: 0759
  year_of: 0759
  place_zh: 迦濕彌羅國蒙鞮寺
  description: 年二十九進受具足，三師七證授律儀，諷聲聞戒習根本說一切有部律，兼習梵語經遊四年
- id: guji-悟空-event-nanyou
  title_zh: 南遊中天竺親禮八塔
  date: 500
  year_of: 500
  place_zh: 迦毗羅伐窣睹至拘尸那及那爛陀
  description: 廣德二年南遊，禮降生而成道轉法輪等八塔，菩提寺安居，那爛陀住三載，又至烏仗那尋聖迹
- id: guji-悟空-event-fanyi
  title_zh: 安西北庭譯十力十地等經
  date: 0787
  year_of: 0787
  place_zh: 安西蓮花寺及北庭龍興寺
  description: 於龜茲請勿提提犀魚譯十力經，於北庭與尸羅達摩大震法超等譯十地經及回向輪經
- id: guji-悟空-event-huigui
  title_zh: 攜牙舍利梵漢本歸京住章敬寺
  date: 0790-02-25
  year_of: 0790
  place_zh: 上京躍龍門使院及章敬寺
  description: 貞元六年二月到京，進佛牙舍利及所譯經，正度賜名悟空，授壯武將軍試太常卿，請住章敬寺
- id: guji-悟空-event-death
  title_zh: 歸京後示寂
  date: 0790
  year_of: 0790
  place_zh: 上京章敬寺
  description: 尋禮述行托圓照作記，請編入貞元續開元釋教錄後事迹不詳，繫於歸京之年
