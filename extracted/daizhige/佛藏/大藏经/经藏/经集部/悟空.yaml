  summary_first_person: 吾俗姓車名奉朝，京兆雲陽人，隨使西征，病留健馱邏，投舍利越魔出家名法界後字悟空，巡禮五天聖迹，攜梵本舍利東歸，譯進十地等經，願流傳永代
