endeavors:
- id: guji-悟空-endeavor-1
  title_zh: 西使病留出家巡禮五天
  summary: 隨張韜光西使病留健馱邏，出家受具，巡禮罽賓迦濕彌羅及中天竺八塔那爛陀等處
