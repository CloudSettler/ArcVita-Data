  decisions:
  - date: 495
    title_zh: 病留誓心歸佛落發
    rationale: 使歸後漸痊，願早還鄉見明主覲父母，投舍利越魔三藏出家，忠孝兩全
  - date: 500
    title_zh: 請辭南遊親禮八塔
    rationale: 思戀聖朝本生父母，焚灼其心，往中天竺右繞供養，兼住那爛陀習學
- id: guji-悟空-endeavor-2
  title_zh: 攜經東歸譯進流傳
  summary: 得梵本十地等經及佛牙舍利，取北路歷艱東歸，於安西北庭譯出，進奉朝廷住章敬寺
  phases:
  - key: brewing
    name: 受付信物
    labels:
