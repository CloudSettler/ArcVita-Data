  location_zh: 维耶离国
  summary_zh: 弹尼生于维耶离，晋言才明，后奉佛五戒修行十善为清信士
- id: guji-才明-event-propose
  title_zh: 疫中集议倡请世尊
  type: career
  date: -0488
  year_of: -488
  location_zh: 维耶离国
  summary_zh: 厉气疫疾威猛如炽火死亡无数，婆罗门议设祠祀杀白马白牛等禳却，才明谏止害生救命之非，述佛无数劫修六度救危厄，众皆称善推其为使
- id: guji-才明-event-embassy
  title_zh: 奉使王舍竹林请佛
  type: career
  date: -0488
  year_of: -488
  location_zh: 王舍城竹林精舍
  summary_zh: 才明赍贡遗诣阿阇世王求通，王许诣佛，至竹林礼佛陈维耶离遥礼求救，佛默然许往，王舍神祇不悦，王留佛一月供养，佛分身乘三桥度恒水赴维耶离
- id: guji-才明-event-welcome
  title_zh: 迎佛入城咒愿除患
  type: career
  date: -0488
  year_of: -488
  location_zh: 维耶离城门
  summary_zh: 国王大臣长者居士出国迎佛，佛触城门阃说慈爱众生偈，地六返震动，鬼神退散，不净沉平，盲视聋听病愈，举城众病除愈，绕城咒愿灾疫悉除
- id: guji-才明-event-offering
  title_zh: 阖家十六日设斋施叠
  type: career
  date: -0488
  year_of: -488
  location_zh: 才明家舍
  summary_zh: 才明妻 particles 子妇各供佛四日凡十六日，饭食香洁，施金色十万价叠次至万钱，佛化其舍为琉璃表里清彻，大众入见听四谛八圣道，疑其福报，佛说仙居缘觉及波罗奈园监等本行以决疑
- id: guji-才明-event-death
  title_zh: 才明寿终
  type: death
  date: '-0460'
