  decisions:
  - date: 0266-01-01
    title_zh: 即从坐起咨问大道
    rationale: 为令众生晓了诸法分别诸度无极故请问菩萨何行建立誓愿无限功勋
  - date: 0280-01-01
    title_zh: 一心精进修清净慧力
    rationale: 欲速逮无上正真当学清净慧力夙夜勤修勿得懈废为放逸行以精进为成佛本
- id: guji-持人菩萨经-endeavor-2
  title_zh: 末世流布护持正法
  description: 于五浊世说以法身见佛舍利遍流持诵广说令景摸久住天下佛道永现
  phases:
  - key: brewing
    name: 五浊示难
