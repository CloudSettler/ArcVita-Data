    start_date: 0290-01-01
    highlight_event_id: guji-持人菩萨经-event-dharmakaya
  - key: climax
    name: 舍利遍流
    labels:
      zh: 塔寺供养
    start_date: 0300-01-01
    highlight_event_id: guji-持人菩萨经-event-relic
  - key: closure
    name: 持诵广说
    labels:
      zh: 流通不绝
    start_date: 0310-01-01
    highlight_event_id: guji-持人菩萨经-event-entrust
  decisions:
  - date: 0290-01-01
    title_zh: 不以色身观如来
    rationale: 佛者法身若见法者则睹如来当以奉行住如法教除法非法之执为见佛
  - date: 0310-01-01
    title_zh: 受持讽诵广为人说
    rationale: 若景摸久在天下则佛正道永长现故当劝菩萨学诵宣布建立菩萨
