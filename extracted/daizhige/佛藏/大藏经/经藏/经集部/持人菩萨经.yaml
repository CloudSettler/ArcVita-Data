  dilemmas:
  - 精进不懈与放逸懈废之辨当如何抉择
  - 以色身观佛与以法身见佛之异当何所依
  - 五浊恶世成佛开化众生难行当退转还是直进
  lesson: 以精进不放逸为本夙夜勤修清净慧力见法即见佛持诵广说令正法久住则疾成无上正真
  summary_first_person: 我于王舍城加邻竹园从坐而起咨问如来菩萨何行建立誓愿蒙佛开示四事五力三事清净慧力又闻妙慧超王本缘五百菩萨精进之证深知五浊虽难唯有精进不放逸见法即见佛受持流布方报佛恩
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E6%8C%81%E4%BA%BA%E8%8F%A9%E8%90%A8%E7%BB%8F.html
