  archetype: 请法护教梵天
  dilemmas:
  - 清净佛土安乐与忍界五浊勤苦之间如何抉择道行胜地
  - 欲问甚深空寂法义又恐触恼退转比丘退席而去
  - 奉行无言善闻之戒与广分别演说之愿如何兼顾
  lesson: 清净百年不如忍界一食行慈以利众生为最胜佛道在浊世炼心不在远离尘劳
  summary_first_person: 我是持心梵天本住东方清净国土月明佛所蒙佛光明劝进与万二千菩萨同赴忍界参觐能仁奉行十志性以问菩萨坚强柔和诸四事法分别空寂应顺之议欲令众会入不起法忍虽处梵天不乐安逸愿以大哀入浊世化众为证
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E6%8C%81%E5%BF%83%E6%A2%B5%E5%A4%A9%E6%89%80%E9%97%AE%E7%BB%8F.html
  - https://tripitaka.cbeta.org/T0585
