- id: guji-持心梵天-event-ask-four
  title_zh: 白佛问菩萨二十种四事
  date: 0285-04-05
  year_of: 285
  description: 长跪问志性坚强柔和德本威仪等二十门佛一一以四事答之众发道意
- id: guji-持心梵天-event-debate
  title_zh: 与明网论应顺度五百比丘
  date: 0285-05-01
  year_of: 285
  description: 论不二不计吾我法等以虚空喻解退席比丘之惑令其漏尽意解得神通
