  lesson: 观身不净则情执自解，宿世爱缘可转今世道缘
  summary_first_person: 我本水边持水之女，一见阿难便生贪爱，逼母以蛊道留之不得，复随逐不舍，蒙佛诘我所爱眼鼻口声行步，示我眼泪鼻涕口唾耳垢屎尿恶露，夫妻子女生死哭泪皆苦，我自思惟恶露形中，心开得阿罗汉，方知五百世夫妻之缘今成兄弟般清净道缘。
