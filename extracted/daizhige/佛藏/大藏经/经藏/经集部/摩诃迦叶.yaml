person:
  qid: guji-摩诃迦叶
  name_zh: 摩诃迦叶
  names:
    zh: 摩诃迦叶
    en: Mahakasyapa
  lifespan:
    birth:
      date: '-550'
      precision: year
      is_circa: true
      raw: 约公元前六世纪生于摩揭陀婆罗门家
    death:
      date: '-450'
      precision: year
      is_circa: true
      raw: 约佛涅槃后入灭于鸡足山中
  birth_date: '-550'
  death_date: '-450'
  era: 东周末春秋之际古印度摩揭陀列国时代
  reign_ref: 释迦牟尼佛住世弘化之世
  archetype: 头陀第一慈悲乞贫福田圣者
  dilemmas:
  - 舍豪富而专从贫乞世讥其颠倒而贫苦方需福佑当坚持乞贫否
  - 贫母唯有臭恶米汁难以下咽若弃之则失信若饮之则秽身当面饮以成信否
  - 帝释化作贫老诈献天食妙香非世所有若拒不受则坏其增福之愿若受之则似受欺诳当受持成全否
  lesson: 施不在多寡而在至诚减身口以施虽芥子亦获须弥报知惭知施虽贫亦富檀施第一
  summary_first_person: 吾本摩揭陀婆罗门出身大富而厌荣利从佛出家修头陀苦行常舍豪富专从贫乞欲为苦厄开福堂昔于王舍大城见粪窟中贫病老母受其臭米汁之施当面饮讫现水火神足说法劝施令其欢喜发愿生忉利天后复纳帝释夫妇化作织席贫老所献天食咒愿令获无量福但愿众生信罪福不虚以至诚施得解脱豪富
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0497
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/佛说摩诃迦叶度贫母经.html
endeavors:
- id: guji-摩诃迦叶-endeavor-1
  title_zh: 王舍城乞贫度贫母生忉利天
  summary: 舍豪富从贫乞受粪窟贫母臭米汁施现神足说法令其生天
  phases:
  - key: brewing
    name: 入定观察知贫母宿无福寿将终
    labels:
      zh: 慈悲观察
    start_date: '-505'
    highlight_event_id: guji-摩诃迦叶-event-birth
  - key: breakthrough
    name: 粪窟前说偈劝施受臭米汁
    labels:
      zh: 乞贫劝施
    start_date: '-500'
    highlight_event_id: guji-摩诃迦叶-event-poor-mother
  - key: climax
    name: 当面饮讫现水火神足令生真信
    labels:
      zh: 现通证信
    start_date: '-500'
    highlight_event_id: guji-摩诃迦叶-event-poor-mother
  - key: closure
    name: 贫母发愿生天命终生忉利放光
    labels:
      zh: 施少报多
    start_date: '-500'
    highlight_event_id: guji-摩诃迦叶-event-poor-mother
  decisions:
  - date: '-500'
    title_zh: 决定舍豪富专从粪窟贫母乞食
    rationale: 宿不植福者今生极贫寿命在近若不往度永失福堂故舍富就贫以开福缘
  - date: '-500'
    title_zh: 决定当母面饮臭米汁不弃余处
    rationale: 若携去余处饮母必疑吾弃之而不信故当面饮讫荡钵以成其真信令福成就
- id: guji-摩诃迦叶-endeavor-2
  title_zh: 纳受帝释化供传持正法福田
  summary: 识破帝释化作贫老仍受天食咒愿传续福田令檀施第一广宣
  phases:
  - key: brewing
    name: 天女报恩散华帝释思欲增福
    labels:
      zh: 天上感动
    start_date: '-500'
    highlight_event_id: guji-摩诃迦叶-event-poor-mother
  - key: breakthrough
    name: 帝释夫妇化作织席贫老巷边乞状
    labels:
      zh: 化贫试施
    start_date: '-499'
    highlight_event_id: guji-摩诃迦叶-event-indra-offering
  - key: climax
    name: 受百味天食咒愿香熏王舍识破本形
    labels:
      zh: 纳受咒愿
    start_date: '-499'
    highlight_event_id: guji-摩诃迦叶-event-indra-offering
  - key: closure
    name: 赞帝释种福无厌持衣待弥勒传法
    labels:
      zh: 福田无尽
    start_date: '-450'
    highlight_event_id: guji-摩诃迦叶-event-death
  decisions:
  - date: '-499'
    title_zh: 决定受持化贫老所献天食不复还
    rationale: 虽知是帝释化作欲增福祚既已受持不宜复还当成全其忍丑殖福之心令获影报
  - date: '-450'
    title_zh: 决定结集正法持衣入定待来
    rationale: 佛灭法付迦叶当闭罪门开真言令贫母天女帝释等事广宣使阎浮提知檀第一故传持不绝
