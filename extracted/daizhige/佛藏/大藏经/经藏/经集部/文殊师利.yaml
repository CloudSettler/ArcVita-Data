    start_date: -0500-02-04
    highlight_event_id: guji-文殊师利-event-2
  decisions:
  - date: -0500-02-03
    title_zh: 顺毁谤叹无文殊可得可舍
    rationale: 以彼唱言无见闻无住处翻显人法皆无所有令知非常住法界而还
  - date: -0500-02-04
    title_zh: 明闻法速除多罪胜四禅等定
    rationale: 悯一百比丘暂堕叫唤地狱即生兜率示疑心听受深经胜过成就禅定无量无色定
