    start_date: -0500-02-02
    highlight_event_id: guji-文殊师利-event-2
  - key: climax
    name: 以无文殊可得语令众还入
    labels:
      zh: 翻显还入
    start_date: -0500-02-03
    highlight_event_id: guji-文殊师利-event-2
  - key: closure
