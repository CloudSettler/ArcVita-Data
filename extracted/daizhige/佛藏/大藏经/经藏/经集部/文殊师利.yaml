    rationale: 为发起自身行法令众闻知获大利故不扰三昧待时发问
  - date: -0500-01-02
    title_zh: 连环诘问依三世五阴根尘坐禅
    rationale: 为破依过去未来现在心意等行见显求如来身皆不可得
- id: guji-文殊师利-endeavor-2
  title_zh: 化度五百比丘显闻深法功德
  summary_zh: 五百比丘闻空不解退席毁谤以无文殊可得语令还入四百得无漏解脱一百暂受轻报生兜率于弥勒初会证果
  phases:
