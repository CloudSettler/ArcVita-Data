  dilemmas:
  - 梵本义广而华言文约，如何以名数略摄令初学易持又不失正法大义
  - 身为西域僧而膺宋廷诏命，如何在译场功式与持戒弘法之间两全
  lesson: 以名数总持万法，化繁为简而信解不失，译弘在敬慎与慈悲并行
  summary_first_person: 吾本西天乌仗那人，蒙宋帝诏入译场，与天息灾等共译显密诸经，授朝散大夫试鸿胪少卿传法大师，略集佛说名数如三宝三乘十度十八空三十七道品乃至三十二相八十好等，以利后学忆持，愿正法久住
