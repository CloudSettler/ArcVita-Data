  summary_first_person: 我是舍卫城优婆夷名无垢，每日早起扫佛塔地涂治散华烧香供养已入房修四梵行奉三归持五戒恒常不懈，往祇园请问诸行福报，蒙佛说扫塔五福及涂地生天之报并示广长舌证其诚实，我断疑欢喜以偈赞佛闻清净寂静法趣涅槃城。
