    labels:
      zh: 显现
    start_date: -0500-01-01
    highlight_event_id: guji-无垢光女-event-fetal-dharma
  - key: climax
    name: 拒天衣说十种菩萨庄严
    labels:
      zh: 论庄严
    start_date: -0500-01-01
    highlight_event_id: guji-无垢光女-event-lotus-birth
