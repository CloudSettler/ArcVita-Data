  decisions:
  - date: -0500-01-01
    title_zh: 不受帝释天衣以菩提心为庄严
    rationale: 天衣属小智卑下不如深心慈悲惭愧施戒忍进禅慧十种衣及福慧相好方胜天人庄严
  - date: -0500-01-01
    title_zh: 受净住佛送衣具通诣佛请法
    rationale: 志同方同服彼佛所赐相应大乘即具神通下莲台礼佛求说摄菩提不退法
- id: guji-无垢光女-endeavor-2
  title_zh: 问答摄菩提与转女身教
  description_zh: 与舍利弗论名字如化调伏解脱成就众生请佛说摄菩提增长四法及女人离女身一至十法与厌离观
  phases:
  - key: brewing
    name: 请说摄菩提不退魔行法
