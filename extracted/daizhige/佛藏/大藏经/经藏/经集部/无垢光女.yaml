  - key: breakthrough
    name: 与舍利弗论空化无差别
    labels:
      zh: 破分别
    start_date: -0500-01-01
    highlight_event_id: guji-无垢光女-event-debate-shariputra
  - key: climax
    name: 佛说摄菩提四法及转女身次第
    labels:
      zh: 转女身法
    start_date: -0500-01-01
    highlight_event_id: guji-无垢光女-event-preach-transformation
  - key: closure
    name: 劝观女身过患厌离发菩提
    labels:
      zh: 劝修
    start_date: -0500-01-01
    highlight_event_id: guji-无垢光女-event-preach-transformation
  decisions:
  - date: -0500-01-01
    title_zh: 以法如化无差别成就众生
    rationale: 见差别则不能成就知邪即正我无我等平等无缚无解方为究竟调伏解脱
  - date: -0500-01-01
    title_zh: 代四众请问离女身速成男子行
    rationale: 愍念女人欲令发深心持十善修忍辱乐法念佛等悉回向菩提速转女身出家修道
events:
- id: guji-无垢光女-event-birth
  type: birth
  title_zh: 王舍城婆罗门家胎具足后莲花化生
  date: -0500-01-01
  year_of: -500
  location_zh: 王舍城耆阇崛山会下须达多净日家
  description_zh: 父婆罗门须达多母净日怀女胎诸根具足不杂垢秽合掌听法后从母右胁化生立宝莲花上得佛授名无垢光
- id: guji-无垢光女-event-fetal-dharma
  type: career
  title_zh: 胎中发问一乘解脱三解脱等法
  date: -0500-01-01
  year_of: -500
  location_zh: 王舍城耆阇崛山
  description_zh: 蒙佛威神在胎白佛为著我见不了一乘覆无明贪嗔痴堕颠倒盖缠众生欲问明解脱三解脱四谛五根六通七觉八道九定十善等法
- id: guji-无垢光女-event-lotus-birth
  type: career
  title_zh: 却天衣论庄严莲台诣佛请法
  date: -0500-01-01
  year_of: -500
  location_zh: 王舍城耆阇崛山
  description_zh: 拒帝释衣言菩萨以菩提深心慈悲救护惭愧施戒忍进禅慧为衣受净住无垢称王佛送衣光明除梵释日月光具五通地六动礼佛请说摄菩提增长法
- id: guji-无垢光女-event-debate-shariputra
  type: career
  title_zh: 与舍利弗论名字化相调伏解脱
  date: -0500-01-01
  year_of: -500
  location_zh: 王舍城耆阇崛山
  description_zh: 言法本无名随行立名彼土无女人如佛化无男女差别不见差别方能成就于有不起染爱雨无分别随熟调伏无缚无解即解脱亦现罗汉度机二百比丘得解脱
- id: guji-无垢光女-event-preach-transformation
  type: career
  title_zh: 请佛说离女身一至十法厌离观
  date: -0500-01-01
  year_of: -500
  location_zh: 王舍城耆阇崛山
  description_zh: 佛说深心菩提除慢欺诳身口意净忍辱乐法念佛法僧戒施天不坏信离偏爱息九恼十善及观女身虫秽婢使系闭苦役不净无我苦聚回向菩提即转女身
- id: guji-无垢光女-event-death
  type: death
  title_zh: 经后无记化现圆满
  date: -0400-01-01
  year_of: -400
  location_zh: 未记
  description_zh: 本经未记终年托为菩萨化现事毕以转女身之教利益四众功德圆满还归本愿
