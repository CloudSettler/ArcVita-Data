  dilemmas:
  - 居家而不染世法如何在白衣身具沙门威仪功德
  - 以方便示现有疾如何不违诚实而广为说法
  - 广说法与默然无言之间何者方显不二真义
  lesson: 随自心净即佛土净居家亦可成道方便即究竟直心是道场
  summary_first_person: 吾居广严城，虽为白衣而修菩萨行，曾供养无量诸佛，深殖善根，得无生忍，以无尽财摄贫穷，以净戒摄毁犯，以调顺忍摄嗔恚，以示疾说法令无数千人发菩提心，随心净故见土净，不住生死，不住涅槃，是吾所愿所行。
