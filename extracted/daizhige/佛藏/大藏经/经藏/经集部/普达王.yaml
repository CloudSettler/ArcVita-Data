  - date: '-0515'
    title_zh: 恳请道人屈威开导臣民
    rationale: 自知设喻有限愿借真法桥梁令一国得闻正道
  - date: '-0515'
    title_zh: 率群臣持华香出城迎佛
    rationale: 以至诚迎接表敬法之心令大众喜惧交并易于受化
  - date: '-0515'
    title_zh: 手自斟酌供佛及僧并受法戒
    rationale: 以国主亲供成福田以闻宿因断疑得入圣流并立五戒十善为常法
events:
- id: guji-普达王-event-birth
  type: birth
  title_zh: 先王执盖小儿报尽生为王子
  date: '-0550'
  year_of: -550
  place_zh: 夫延国王宫
  summary_zh: 本为先王时执盖小儿斋戒一日清净守意命终魂神还生为王作子遂致尊贵
- id: guji-普达王-event-road-rite
  type: 礼敬
  title_zh: 道中礼道人还宫设供
  date: '-0520'
  year_of: -520
  place_zh: 夫延国宫外道路
  summary_zh: 出行见道人即下车却盖头面作礼寻从而还设饭遂不成行群臣进谏言头面至贵不宜礼乞丐道人
- id: guji-普达王-event-market-heads
  type: 教化
  title_zh: 市卖人畜头示无常
  date: '-0520'
  year_of: -520
  place_zh: 夫延国市中
  summary_zh: 敕求死人头及牛马猪羊头于市卖之六畜头皆售人头臭胀无人买丐亦无取以破贵贱之执
- id: guji-普达王-event-show-robe
  type: 示证
  title_zh: 城外旷泽示故衣明宿因
  date: '-0520'
  year_of: -520
  place_zh: 夫延国城外旷泽
  summary_zh: 出示亡已十七年执盖小儿故衣令群臣识之并得道人现身为说王者本即此儿由斋戒福今得为王
- id: guji-普达王-event-invite-dharma
  type: 请法
  title_zh: 道人飞往舍卫启请世尊
  date: '-0515'
  year_of: -515
  place_zh: 夫延国至舍卫国
  summary_zh: 道人自言有大师号佛能飞行分身具三十二相去此六千余里须臾飞到舍卫具启民心可愍佛默许明日当到
- id: guji-普达王-event-welcome-buddha
  type: 迎供
  title_zh: 出城迎佛上殿供养
  date: '-0515'
  year_of: -515
  place_zh: 夫延国城外及宫殿
  summary_zh: 王及群臣随道人持华香出城数十里迎佛五体投地迎上殿就座手自斟酌饭食行澡水咒愿
- id: guji-普达王-event-attain-srota
  type: 证悟
  title_zh: 闻说本末得须陀洹国人受戒
  date: '-0515'
  year_of: -515
  place_zh: 夫延国宫殿
  summary_zh: 佛笑放五色光说王于摩诃文佛时为大姓家子传香及侍使誓度今合王闻意解得须陀洹人民皆受五戒十善
- id: guji-普达王-event-death
  type: death
  title_zh: 普达王寿终国法流传
  date: -0480
  year_of: -480
  place_zh: 夫延国
  summary_zh: 在位以正法化民立五戒十善为常法后寿终而国人奉法不绝
