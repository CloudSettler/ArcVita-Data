events:
- id: guji-月上女-event-birth
  person_id: guji-月上女
  title_zh: 生于毗耶离放光名月上
  date: -0500-01-01
  year_of: -500
  place_zh: 毗耶离毗摩罗诘离车家
  description: 离车妻无垢九月生女，光明照家地震鼓鸣，合掌说宿世迦叶佛前布施发心偈，身出月光故名月上
- id: guji-月上女-event-vow
  person_id: guji-月上女
  title_zh: 说慈心偈安父立七日之期
  date: -0492-01-01
  year_of: -492
  place_zh: 毗耶离本家
  description: 众童子胁夺其女，父忧哭，女说慈心不害偈，请于四衢振铃七日后自择夫主
- id: guji-月上女-event-flower
  person_id: guji-月上女
  title_zh: 右手生莲华见化如来
  date: -0492-01-06
  year_of: -492
  place_zh: 毗耶离家中楼上
  description: 月圆受斋夜，右手出金茎银叶莲华，华中有如来像放光，问答知释迦遣使劝往大林
- id: guji-月上女-event-preach
  person_id: guji-月上女
  title_zh: 升空呵欲化八万四千人
  date: -0492-01-07
  year_of: -492
  place_zh: 毗耶离街巷空中
  description: 众唱是我妻而来，女腾空一多罗说舍欲梵行偈，大地震动天雨华，大众舍欲生父母想随从出城
- id: guji-月上女-event-debate
  person_id: guji-月上女
  title_zh: 路遇舍利弗论涅槃无分别
  date: -0492-01-07
  year_of: -492
  place_zh: 毗耶离城外道上
  description: 舍利弗与五百比丘乞食相逢试忍，论举足依空行涅槃即涅槃，三乘无分别不可得见
- id: guji-月上女-event-death
  person_id: guji-月上女
  title_zh: 诣佛后传缺示寂
  date: -0420-01-01
  year_of: -420
  place_zh: 传缺
  description: 经文未载终寿，系佛世菩萨化现，随众诣大林后事迹不传，姑系佛灭前后以全传记
