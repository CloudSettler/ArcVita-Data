  phases:
  - key: brewing
    name: 观见劫衰
    labels:
      zh: 五浊五阴三毒炽盛
    start_date: '3000-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-teach
  - key: breakthrough
    name: 随方教化
    labels:
      zh: 不吝躯命敦慈尚善
    start_date: '3100-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-teach
  - key: climax
    name: 劝礼俄顷
    labels:
      zh: 礼拜能却无量劫罪
    start_date: '3200-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-teach
  - key: closure
    name: 罪灭福生
    labels:
      zh: 安住慈忍具足多闻
    start_date: '3300-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-teach
  decisions:
  - date: '3100-01-01'
    title_zh: 示善恶报应不虚
    rationale: 为令信悟者鲜者知为善者少堕三涂故先明理
  - date: '3200-01-01'
    title_zh: 劝一心礼事不懈怠
    rationale: 以俄顷之劳可得勉度永离三涂生死之患故
- id: guji-未来星宿劫千佛名经之二-endeavor-2
  title_zh: 集说星宿劫千佛名号授持
  summary: 自日光佛至无量名称德光次第列名八百，令受持习诵历值千佛得辩才陀罗尼
  phases:
  - key: brewing
    name: 集诸佛大功德山
    labels:
      zh: 一名集诸佛大功德山
    start_date: '3400-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-names
  - key: breakthrough
    name: 初说百佛
    labels:
      zh: 自日光佛至无底威佛一百佛竟
    start_date: '3500-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-names
  - key: climax
    name: 广说八百佛
    labels:
      zh: 自德丰佛至无量名称德光八百佛竟
    start_date: '3600-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-names
  - key: closure
    name: 付嘱奉持
    labels:
      zh: 行六和敬离名利嫉妒疾得菩提
    start_date: '3700-01-01'
    highlight_event_id: guji-未来星宿劫千佛名经之二-event-names
  decisions:
  - date: '3500-01-01'
    title_zh: 具列佛名令人闻名礼拜
    rationale: 若人闻名一心礼事必得涅槃故不厌广说
  - date: '3700-01-01'
    title_zh: 诫离名利嫉妒行六和敬
    rationale: 为令随宜说法不自欺诳得神通三昧无碍辩才故
events:
- id: guji-未来星宿劫千佛名经之二-event-birth
  title_zh: 星宿劫千佛受记诞生
  date: '3000-01-01'
  year_of: 3000
  description: 未来星宿劫中当有千佛出世，首为日光佛龙威佛华岩佛等，名字如是次第受记
- id: guji-未来星宿劫千佛名经之二-event-teach
  title_zh: 宣说五浊教化因缘
  date: '3100-06-01'
  year_of: 3100
  description: 示昔佛在世人民如恒沙今万不遗一，法华所言三恶道充满，劝修善礼拜以却重罪
- id: guji-未来星宿劫千佛名经之二-event-names
  title_zh: 次第说出八百佛名
  date: '3600-06-01'
  year_of: 3600
  description: 自日光佛起经德丰佛共发意佛无量慧称佛善中上德佛宝华普照胜佛禅思盖佛信如意佛至无量名称德光，一百佛竟至八百佛竟
- id: guji-未来星宿劫千佛名经之二-event-death
  title_zh: 示现常灭度入涅槃
  date: '8000-12-31'
  year_of: 8000
  description: 如常灭度佛所表，化缘既周示现灭度，令受持者安住慈忍历值千佛得阿耨多罗三藐三菩提
