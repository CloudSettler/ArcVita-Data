  dilemmas:
  - 梵义幽深与华言通俗之间，如何令深法随顺众生而又不失了义
  - 安住禅观自修与冒海東來译经利他之间，如何舍安就危以弘法为任
  lesson: 以无作无人观一切法，离虚伪染著，随顺众生说不了义引入了义
  summary_first_person: 我本中天竺人，学通三藏，感东方有缘，浮海至宋，于建康译出相续解脱等经，但愿以如来随顺巧便，令声闻菩萨皆入法身清净
