events:
- id: guji-沙曷比丘-event-birth
  title_zh: 诞生于古印度列国时代
  date: '-0600'
  year_of: -600
  location_zh: 古印度
  summary_zh: 生年不详，佛世时已出家为比丘，修行得阿罗汉果
- id: guji-沙曷比丘-event-subdue-dragon
  title_zh: 奉敕降伏须耶国恶龙
  date: '-0524'
  year_of: -524
  location_zh: 须耶国
  summary_zh: 佛念须耶饥馑遣我往化，龙兴恶欲败国杀我，我以钵覆一国御其风雨飞雪，出入龙室伏其心，劝令自归于佛，纳龙著笥，人民欢喜向佛
- id: guji-沙曷比丘-event-drunk-sleep
  title_zh: 中道受供醉卧树下
  date: '-0523'
  year_of: -523
  location_zh: 还舍卫中道树下
  summary_zh: 还时遇分卫受饭酒，致醉卧树下龙钵袈裟各在一处，众疑罗汉何以醉卧，佛说四事不及佛以开化菩萨意
- id: guji-沙曷比丘-event-convert-dragon
  title_zh: 摄龙礼佛受戒得须陀洹
  date: '-0523'
  year_of: -523
  location_zh: 舍卫国祇树给孤独园
  summary_zh: 目犍连奉敕召我摄龙来，龙头面礼佛，佛说宿命本末，龙心解受五戒行十善得须陀洹道而去，佛说我功德微妙
- id: guji-沙曷比丘-event-invite-buddha
  title_zh: 请佛赴须耶越国说法度众
  date: '-0522'
  year_of: -522
  location_zh: 须耶越国王宫
  summary_zh: 我请佛赴须耶，佛默许，我弹指先还告众，王扫洒严饰，佛与千二百五十比丘空行而至，王民迎礼供养，闻龙本末受戒得道者无数
- id: guji-沙曷比丘-event-death
  title_zh: 佛世前后入灭
  date: '-0500'
  year_of: -500
  location_zh: 古印度
  summary_zh: 卒年不详，化缘既毕入灭，功德载于佛说沙曷比丘功德经流传后世
