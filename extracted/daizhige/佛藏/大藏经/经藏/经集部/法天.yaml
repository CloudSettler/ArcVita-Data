  decisions:
  - date: 0985
    title_zh: 以无常平等破爱别离执
    rationale: 三界大轮回无免无常者唯正等觉为真依仗故示过失利众生
  - date: 0985
    title_zh: 以譬喻明轮回劝断贪爱
    rationale: 以泥丸父母骨如妙山泪如海水等喻令知苦真实为苦而证寂静
