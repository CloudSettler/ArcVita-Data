endeavors:
- id: guji-法天-endeavor-1
  title_zh: 入宋主持西天译经
  summary_zh: 自西域来华，入太平兴国译经院，授传教大师试鸿胪卿，专主梵汉传译
  phases:
  - key: brewing
    name: 西域学法初涉译场
    labels:
      zh:
      - 西域问道
    start_date: 0980-01-01
    highlight_event_id: guji-法天-event-arrive
  - key: breakthrough
    name: 奉诏入院授传教大师
    labels:
      zh:
      - 奉诏译经
    start_date: 0984-01-01
    highlight_event_id: guji-法天-event-confer
  - key: climax
    name: 领院群译广出众经
    labels:
      zh:
      - 广译众经
    start_date: 0990-01-01
    highlight_event_id: guji-法天-event-translate-weicengyou
  decisions:
  - date: 0984-01-01
    title_zh: 受诏就任译经三藏
    rationale: 为使西来正法久住中土，不辞繁难，承担梵汉传译重任
  - date: 0990-01-01
    title_zh: 坚持直译兼顾义畅
    rationale: 恐失佛智本义，故存梵义精密，同时以华言开显令众易解
- id: guji-法天-endeavor-2
  title_zh: 译弘未曾有正法经
  summary_zh: 于王舍城鹫峰大法会缘起下，译出妙吉祥等二十五菩萨论精进铠及一切智平等妙法
  phases:
  - key: brewing
    name: 集梵本审义立章
    labels:
      zh:
      - 审定梵本
    start_date: 0988-01-01
    highlight_event_id: guji-法天-event-confer
  - key: breakthrough
    name: 译出菩萨精进铠品
    labels:
      zh:
      - 精进铠义
    start_date: 0991-01-01
    highlight_event_id: guji-法天-event-translate-weicengyou
  - key: climax
    name: 宣说一切法平等幻化
    labels:
      zh:
      - 平等幻化
    start_date: 0992-01-01
    highlight_event_id: guji-法天-event-translate-weicengyou
  - key: closure
    name: 进呈御览流通天下
    labels:
      zh:
      - 流通正法
    start_date: 0995-01-01
    highlight_event_id: guji-法天-event-translate-weicengyou
  decisions:
  - date: 0991-01-01
    title_zh: 拣译未曾有正法以劝发菩提
    rationale: 见声闻乐小厌离生死，故译大乘不思议法，令发无上菩提心
  - date: 0992-01-01
    title_zh: 详译空幻化相而显佛智
    rationale: 为破著相求智之执，故明言诸法如幻自性空，一切智无所得而证
events:
- id: guji-法天-event-birth
  title_zh: 生于西域
  date: 0950-01-01
  year_of: 950
  place_zh: 西域
  description_zh: 约十世纪中叶生于西域，少习梵典，通达三藏
- id: guji-法天-event-arrive
  title_zh: 随众来华入译经院
  date: 0980-01-01
  year_of: 980
  place_zh: 开封太平兴国寺译经院
  description_zh: 随天息灾施护等东来，入宋译经院参与传译
- id: guji-法天-event-confer
  title_zh: 授传教大师试鸿胪卿
  date: 0984-01-01
  year_of: 984
  place_zh: 开封
  description_zh: 以精通梵汉授西天译经三藏朝奉大夫试鸿胪卿传教大师
- id: guji-法天-event-translate-weicengyou
  title_zh: 奉诏译佛说未曾有正法经二卷
  date: 0991-01-01
  year_of: 991
  place_zh: 开封译经院
  description_zh: 奉诏译出鹫峰山妙吉祥与二十五菩萨及四天子论被精进铠趣证一切智之法，辩积问化佛诸法幻化平等，开显大乘正法
- id: guji-法天-event-death
  title_zh: 示寂于宋
  date: 1001-01-01
  year_of: 1001
  place_zh: 开封
  description_zh: 宋咸平四年示寂，一生译经弘法，遗教以离分别证佛智为要
