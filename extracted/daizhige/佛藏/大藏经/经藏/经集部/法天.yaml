  name_zh: 法天
  names:
    zh: 法天
    en: Dharmadeva
  lifespan:
    birth:
      date: 0950-01-01
      precision: year
      is_circa: true
      raw: 约十世纪中叶生于西域
    death:
      date: 1001-01-01
      precision: year
      is_circa: false
      raw: 宋咸平四年卒
  birth_date: 0950-01-01
  death_date: 1001-01-01
  era: 北宋
  reign_ref: 宋太宗至宋真宗
  archetype: 译经弘法者
  dilemmas:
  - 梵汉悬隔而圣义难传，当直译存真还是意译便俗
  - 身居译经高位而佛智难证，当安住名位还是精进忘身以趣菩提
  lesson: 以平等无著之心被精进铠，广译正法利乐众生，方能趣证佛一切智
  summary_first_person: 我是法天，西天来华译经僧，奉诏居译经院，与施护等共译众经，复译说未曾有正法，劝诸菩萨离分别被精进铠以证佛智
  source_urls:
