    rationale: 六道业果幽微难见，须以伽陀直示，令华人易持易诵而生信
- id: guji-法天-endeavor-2
  title_zh: 开示六道业果
  summary_zh: 依佛说分别地狱傍生饿鬼人修罗天之因果，劝离贪嗔痴，修施戒慈慧
