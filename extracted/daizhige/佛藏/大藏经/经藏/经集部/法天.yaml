    name: 归结解脱正道
    labels:
      zh: 趣向解脱
    start_date: '1000'
    highlight_event_id: guji-法天-event-death
  decisions:
  - date: 0995
    title_zh: 以伽陀总摄六趣升沉
    rationale: 长行难记，故系以颂，令地狱等活乃至天界差等一目了然
  - date: '1000'
    title_zh: 劝求福远罪通达真实
    rationale: 善恶果报无虚，须审观舍爱，持戒修慧，必至大解脱
events:
- id: guji-法天-event-birth
  date: 0950
  title_zh: 生于中印度摩伽陀国
  description_zh: 约十世纪中叶生于摩伽陀国，后入那烂陀寺出家学法
  year_of: 950
- id: guji-法天-event-study
  date: 0970
  title_zh: 那烂陀寺受学修道
  description_zh: 于那烂陀寺习三藏教义，精梵本经论，为传教大师之学基
  year_of: 970
- id: guji-法天-event-honor
  date: 0982
  title_zh: 奉诏入宋授传教大师
  description_zh: 太平兴国中偕兄东来，太宗赐名法天，授三藏传教大师赐紫沙门，奉诏译经
  year_of: 982
- id: guji-法天-event-translate
  date: 0990
  title_zh: 译出佛说六道伽陀经
  description_zh: 于汴京译场译出此经，具陈地狱八热傍生饿鬼人修罗天六道因果，归命三界尊而开正智慧
  year_of: 990
- id: guji-法天-event-preach
  date: 0995
  title_zh: 宣说人天善业果报
  description_zh: 开示持斋戒修布施得人天乐果，乃至持戒禅定薰慧生四王忉利乃至他化自在，劝离淫杀戏论而趣安乐解脱
  year_of: 995
- id: guji-法天-event-death
  date: '1001'
  title_zh: 示寂于汴京
  description_zh: 宋真宗咸平四年示寂，一生译经弘化功成，遗教在六道伽陀业果之说
  year_of: 1001
