person:
  qid: guji-法志妻
  name_zh: 法志妻
  names:
    zh: 法志妻
    en: Wife of Elder Fazhi in Sravasti
  lifespan:
    birth:
      date: -344
      precision: century
      is_circa: true
      raw: 舍卫国长者法志之妻，生年不详，约佛世时人
    death:
      date: -0480
      precision: century
      is_circa: true
      raw: 卒年不详，约佛世后
  birth_date: -344
  death_date: -0480
  era: 先秦
  reign_ref: 释迦牟尼佛住世教化之时
  archetype: 悔过闻法即发大道者
  dilemmas:
  - 尊豪自恃苛待下使与视下一如赤子之抉择
  - 安于女身威势与发无上正真道意求解脱之抉择
  lesson: 豪富威势如朝露梦幻，唯信戒定慧四事庄严，发大道心方得转身不退
  summary_first_person: 我是舍卫长者法志之妻，本以宝饰香服自恃，奴使小过便加挝捶，蒙佛光明照身，清凉饱满，惭惧礼足悔过，闻十善六度四等之教，即发无上正真道意，立不退转，转女成男，踊身虚空礼佛
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/佛说长者法志妻经.html
  - https://cbetaonline.dila.edu.tw/zh/T0572
endeavors:
- id: guji-法志妻-endeavor-1
  title_zh: 蒙光悔过奉持十善六度
  summary_zh: 蒙佛光明照身而自念惭惧，礼足悔罪，奉十善六度四等，化苛虐为慈育
  phases:
  - key: brewing
    name: 豪饰苛使之积习
    labels:
      zh:
      - 庄饰自恃
      - 挝捶奴使
    start_date: -344
    highlight_event_id: guji-法志妻-event-birth
  - key: breakthrough
    name: 佛光照身心开悔过
    labels:
      zh:
      - 蒙光清凉
      - 礼足悔过
    start_date: -320
    highlight_event_id: guji-法志妻-event-meet
  - key: climax
    name: 闻十善六度四等之教
    labels:
      zh:
      - 十善六度
      - 慈悲喜护
    start_date: -320
    highlight_event_id: guji-法志妻-event-vow
  - key: closure
    name: 教令下使不复用杖
    labels:
      zh:
      - 以义理诫下
      - 信戒定慧庄严
    start_date: -320
    highlight_event_id: guji-法志妻-event-vow
  decisions:
  - date: -320
    title_zh: 速趣迎佛稽首悔过
    rationale: 见佛光明超日月清凉安隐，自知嗔喜由己不能自责，故舍杖迎佛不敢藏匿
  - date: -320
    title_zh: 奉十善六度化导奴使
    rationale: 闻佛言豪富须臾如月进退，唯道可保，故以罪福三涂诫下，以义理胜挝杖
- id: guji-法志妻-endeavor-2
  title_zh: 发无上道意转女成男
  summary_zh: 不求转轮王福，直发无上正真道意，晓空慧无男女相，即变男子得不退忍
  phases:
  - key: brewing
    name: 天帝劝求男身王位
    labels:
      zh:
      - 天帝试问
      - 女转男说
    start_date: -320
    highlight_event_id: guji-法志妻-event-vow
  - key: breakthrough
    name: 以偈明五阴幻化三世平等
    labels:
      zh:
      - 豪如朝露
      - 谁男何女
    start_date: -320
    highlight_event_id: guji-法志妻-event-vow
  - key: climax
    name: 心解变男踊空礼足
    labels:
      zh:
      - 转女成男
      - 踊空礼佛
    start_date: -320
    highlight_event_id: guji-法志妻-event-transform
  - key: closure
    name: 受记无垢王如来会众发心
    labels:
      zh:
      - 恒沙劫后作佛
      - 下使亦发大道
    start_date: -320
    highlight_event_id: guji-法志妻-event-transform
  decisions:
  - date: -320
    title_zh: 直发无上正真道不求王位
    rationale: 知天帝日月转轮威势无几不可久恃，在豪如梦，五阴如幻，故发道心无等侣
  - date: -320
    title_zh: 示现转身以证空慧
    rationale: 谛解三处如幻影响水月本净无男女，故心解即变以化会众令发道意
events:
- id: guji-法志妻-event-birth
  title_zh: 生于舍卫为长者法志妻
  date: -344
  year_of: -344
  place_zh: 舍卫国长者法志宅
  description: 生于舍卫，以严庄床座宝饰香服为常，役使奴客婢使
- id: guji-法志妻-event-meet
  title_zh: 佛至法志门外放大光明迎佛悔过
  date: -320
  year_of: -320
  place_zh: 舍卫国长者法志宅中合
  description: 佛著衣持钵入城分卫至法志门外放大光明，妻遥见佛明蒙身无患，速趣礼足，悔嗔恚挝捶之罪
- id: guji-法志妻-event-vow
  title_zh: 闻十善六度四等发无上道意却天帝请
  date: -320
  year_of: -320
  place_zh: 舍卫国祇树给孤独园会次法志宅前
  description: 闻佛说人身难得女人三垢及十善六度四等四庄严，心开踊跃发无上正真道意立不退转，以偈答天帝转女为男之劝
- id: guji-法志妻-event-transform
  title_zh: 心解变男踊空受记无垢王佛
  date: -320
  year_of: -320
  place_zh: 佛前虚空
  description: 佛印可三界如幻无吾我，即变为男子踊空礼足，佛记恒沙劫后当得作佛号无垢王如来世曰光净，下使亦发心变男得不起忍
- id: guji-法志妻-event-death
  title_zh: 示寂
  date: -0480
  year_of: -0480
  place_zh: 舍卫国
  description: 受记后奉行大道，寿终示寂之事不详附此
