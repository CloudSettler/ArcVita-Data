    rationale: 独译难广信，共译互证可除犹豫，使读经行道作福者专一不疑
  - date: '0293-01-01'
    title_zh: 留譬喻因缘不略
    rationale: 世人不解空理，需借本生譬喻明善恶报，方能止骂詈杀生轻慢经像之行
