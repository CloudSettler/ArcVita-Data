    title_zh: 决意直译衰利不同之问答
    rationale: 阿难问俱事佛而衰利不同，需完整保留佛答明师专一与慢法犹豫之对照以正视听
  - date: '0286-01-01'
    title_zh: 详载慢法过患以警世
    rationale: 经言挂经著壁掷床不敬招恶鬼守门衰病丧亡，故不省文以使人畏慢法而修恭敬
