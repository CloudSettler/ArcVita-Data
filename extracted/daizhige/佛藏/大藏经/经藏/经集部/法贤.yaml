events:
- id: guji-法贤-event-birth
  title_zh: 降生西域
  date: 0950
  year_of: 950
  place_zh: 迦湿弥罗
  description: 生于西域，精通梵典，后入宋为译经三藏，赐号明教大师
- id: guji-法贤-event-translate
  title_zh: 奉诏译佛说信解智力经
  date: 0985
  year_of: 985
  place_zh: 东京译经院
  description: 于舍卫国祇树给孤独园之会，译佛告苾刍信解力即如来无畏，具说信进念定慧五力及处非处乃至漏尽十力
- id: guji-法贤-event-preach
  title_zh: 宣说十力问答与等持正道
  date: 0990
  year_of: 990
  place_zh: 东京译经院
  description: 详陈十智力问答皆当实答，复判十力但为等持者说，等持是正道，非等持是非道，劝众勤行
- id: guji-法贤-event-death
  title_zh: 示寂于宋
  date: '1001'
  year_of: 1001
  place_zh: 东京
  description: 宋咸平四年示寂，一生传译显密诸经，信解智力经流通于世，苾刍闻法信受奉行
