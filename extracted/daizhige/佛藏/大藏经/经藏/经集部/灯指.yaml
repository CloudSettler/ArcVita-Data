  dilemmas:
  - 豪富放逸与绍继父业之两难
  - 极贫求活与担尸贱业之两难
  - 还复富贵与出家求道之抉择
  lesson: 少善种于胜福田终得大报恶口放逸终受剧苦当勤修福远离恶口
  summary_first_person: 我生于王舍城长者家生而一指放光明照十里故名灯指少时蒙王召见长大富乐娶妻而父母俱丧我放逸交恶友家财为贼劫尽指光亦灭贫贱乞食备受轻辱为食担尸反被死尸抱脊不脱后尸指化为真金剪复更生库藏倍胜于前我方悟富贵无常贫穷大苦遂以珍宝施众于佛法中出家精勤得阿罗汉
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/灯指因缘经.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/经集部/灯指因缘经.md
