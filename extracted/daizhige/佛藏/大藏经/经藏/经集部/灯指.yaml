    labels:
      zh:
      - 布施
      - 出家
    start_date: '-0452'
    highlight_event_id: guji-灯指-event-ordination
  - key: climax
    name: 精勤修习与得阿罗汉
    labels:
      zh:
      - 持戒
      - 证果
    start_date: '-0450'
    highlight_event_id: guji-灯指-event-ordination
  - key: closure
    name: 佛说宿缘与大众供养
    labels:
      zh:
      - 宿因
      - 说法
    start_date: -0448
    highlight_event_id: guji-灯指-event-buddha-teaching
  decisions:
  - date: '-0452'
    title_zh: 以珍宝施众出家求道
    rationale: 见五欲如电毒蛇虫荣乐不久停即生厌患故舍财出家求涅槃
  - date: '-0450'
    title_zh: 精勤修习不顾尸宝相随
    rationale: 虽获道果而尸宝常随逐之不生贪著唯勤修习以断漏结
