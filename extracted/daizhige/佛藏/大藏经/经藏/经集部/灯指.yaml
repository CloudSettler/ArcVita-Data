    title_zh: 担尸求食以自存济
    rationale: 贫至无路不欲造杀生等不善思惟担尸虽鄙而无后世苦故雇为担尸者
  - date: '-0454'
    title_zh: 试割金指以济交急
    rationale: 见背尸堕地手指纯金虽怖畏而知是真金遂试割以转贫为富
- id: guji-灯指-endeavor-2
  title_zh: 舍俗出家与精勤证果
  description: 睹五欲轻动荣乐不久以珍宝施众于佛法中出家精勤得阿罗汉并明宿世补像得光及恶口堕落之缘
  phases:
  - key: brewing
