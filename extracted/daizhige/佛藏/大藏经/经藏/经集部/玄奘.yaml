  lesson: 宁舍身命不舍大菩提心，远离乐小乘恶知识，亲近久学大乘善友，直趣无上正等菩提
  summary_first_person: 吾姓陈名袆洛州缑氏人，幼出家究摄论地论而义乖，贞观三年私出玉门，西逾流沙葱岭，至那烂陀从戒贤受瑜伽师地论，十七年而归，奉诏译经弘扬大乘，愿一切含识同发菩提不堕二乘。
