  - date: '0650'
    title_zh: 宣扬七佛受持功德
    rationale: 愍念有情流转剧苦，特译七佛名号，劝闻持建像供养以速证菩提。
events:
- id: guji-玄奘-event-birth
  date: '0602'
  year_of: 602
  title_zh: 诞生于河南偃师
  description_zh: 隋仁寿二年生于偃师陈氏，幼聪慧，早慕出家。
- id: guji-玄奘-event-fayuan
  date: '0626'
  year_of: 626
  title_zh: 长安发愿西行
  description_zh: 见中土经论支离，发大愿西游天竺求取圆经。
- id: guji-玄奘-event-xixing
  date: 0629
  year_of: 629
  title_zh: 贞观三年偷渡出关
  description_zh: 贞观三年自长安出发，偷渡玉门，历碛路西行求法。
- id: guji-玄奘-event-tianzhu
  date: '0630'
  year_of: 630
  title_zh: 抵天竺那烂陀问道
  description_zh: 遍历五天竺，止那烂陀从戒贤论师受学，兼学梵文因明。
- id: guji-玄奘-event-huiguo
  date: '0645'
  year_of: 645
  title_zh: 贞观十九年归长安
  description_zh: 贞观十九年正月载经六百余部还抵长安，太宗亲迎，敕住弘福寺译经。
- id: guji-玄奘-event-yijing
  date: 0648
  year_of: 648
  title_zh: 主持译场大规模传译
  description_zh: 奉诏主持译经，创译场新例，译大般若等众经，严谨精审。
- id: guji-玄奘-event-qifo
  date: '0650'
  year_of: 650
  title_zh: 奉诏译受持七佛名号所生功德经
  description_zh: 奉诏译出此经，于誓多林会上宣说东方南方七佛名号国土及闻持建像功德，舍利子等欢喜奉行。
- id: guji-玄奘-event-death
  date: '0664-02-05'
  year_of: 664
  title_zh: 示寂于玉华宫
  description_zh: 麟德元年二月五日示寂于玉华宫玉华寺，世寿六十三，葬浐东白鹿原。
