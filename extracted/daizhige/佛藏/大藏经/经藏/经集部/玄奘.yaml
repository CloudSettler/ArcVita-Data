  - title_zh: 冒禁西行与安守中土
    description: 中土经论残缺而义多歧，守旧则安稳无过，西行则涉险求全，可得真法
  - title_zh: 荣宠参政与专心译经
    description: 太宗高宗礼厚欲授以政事，趋荣则显达一时，守译则寂寞一生而福被后世
  lesson: 粗言为利刀，贪为毒药，嗔为炽火，无明为重暗，唯施忍慧戒福可得安乐庄严
  summary_first_person: 吾本陈氏，洛州缑氏人，幼龄出家，慨中土群经未备，贞观三年冒禁西行，历十七载取经归唐，奉诏译经千卷有余，天请问经乃吾所译，天以伽他请问，佛以伽他答之，吾愿以此令众知福能浮持世间而不为水火王贼所夺
  source_urls:
