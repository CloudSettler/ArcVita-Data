    rationale: 悯像法众生多病贫苦横死，为令闻名忆念即得安乐，决以琉璃净土愿行晓示群迷
  - date: 0659-01-01
    title_zh: 开示受持供养法
    rationale: 为令国界安隐有情无病，开示七日七夜持斋造像然灯放生读诵受持之轨，广令流通守护
