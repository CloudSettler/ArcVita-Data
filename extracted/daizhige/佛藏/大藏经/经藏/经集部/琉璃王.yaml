      - 乘虚逼宫
    start_date: -0486
    highlight_event_id: guji-琉璃王-event-usurpation
  - key: climax
    name: 闭门逐父称制
    labels:
      zh:
      - 篡逆称王
    start_date: -0486
    highlight_event_id: guji-琉璃王-event-usurpation
  - key: closure
    name: 波斯匿薨位定
    labels:
