  dilemmas:
  - 幼时讲堂受辱立誓诛释与亲缘外氏之情
  - 逼宫篡逆夺取王位与背负不孝逆罪之谤
  - 屠灭释种泄一时之忿与宿世罪业现世受报
  lesson: 怀毒抱恚肆意残害终以现世火烧受报因果不爽
  summary_first_person: 我名维楼黎，生而与琉璃宝俱。幼往外氏讲堂小憩，受释种辱骂逐出，遂誓为王必报。后果趁父波斯匿听法，夺军逼宫称制。又兴四种兵伐迦维罗卫，屠戮释种三万，虽快一时，七日之后入海避报，仍为自然火烧，灰灭海中。
