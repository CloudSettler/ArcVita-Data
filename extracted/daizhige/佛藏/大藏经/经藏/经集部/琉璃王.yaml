      - 父薨位固
    start_date: -0486
    highlight_event_id: guji-琉璃王-event-usurpation
  decisions:
  - date: '-0500'
    title_zh: 敕太史书辱立誓为王必诛
    rationale: 以释种面骂逐出刬去足迹为奇耻，欲留铁证待日后复仇
  - date: -0486
    title_zh: 趁父王后诣佛所率军夷灭近臣
    rationale: 见王出宫听法侍卫空虚，可一举夺其冠帻盖剑仪仗控制城门
- id: guji-琉璃王-endeavor-2
  title_zh: 三遇佛还四征灭释
  summary: 出带中旧书证恶，兴四种兵伐迦维罗卫，三值佛坐枯树而还，第四进军破城，埋戮释种，后遭海火烧死。
  phases:
  - key: brewing
    name: 出带书兴师
    labels:
      zh:
      - 举旧仇兴兵
    start_date: -0485
    highlight_event_id: guji-琉璃王-event-massacre
  - key: breakthrough
    name: 三值世尊还军
    labels:
      zh:
      - 遇佛暂退
    start_date: -0485
    highlight_event_id: guji-琉璃王-event-massacre
  - key: climax
    name: 破城屠戮释种
    labels:
      zh:
      - 屠城灭族
    start_date: -0485
    highlight_event_id: guji-琉璃王-event-massacre
  - key: closure
    name: 入海避谶火烧
    labels:
      zh:
      - 避罪就戮
    start_date: -0485
    highlight_event_id: guji-琉璃王-event-death
  decisions:
  - date: -0485
    title_zh: 用太史谏舍夷奉戒不杀可并力扑讨
    rationale: 见释种箭但恐人不害命，知其慈仁不杀可欺，遂催军破城
  - date: -0485
    title_zh: 乘船入海欲免七日地狱火
    rationale: 闻佛记七日火烧杀己，又与太史奏谶同，惧现世受报欲以水避火
events:
- id: guji-琉璃王-event-birth
  title_zh: 舍卫诞生与宝俱生
  date: '-0530'
  year_of: -530
  location_zh: 舍卫国王宫
  description_zh: 波斯匿太子维楼黎产育之初与琉璃宝俱，因以为号。
- id: guji-琉璃王-event-humiliation
  title_zh: 讲堂憩凉受辱立誓
  date: '-0500'
  year_of: -500
  location_zh: 迦维罗卫释氏讲堂
  description_zh: 领卫省外氏登讲堂息凉，被贵姓骂辱逐出刬去足迹贸易宝阶，敕太史阿萨陀书状藏带誓为王必诛。
- id: guji-琉璃王-event-usurpation
  title_zh: 祇园外逼宫称制为王
  date: -0486
  year_of: -486
  location_zh: 祇树园至舍卫城门
  description_zh: 趁父王末利诣佛听法，率所领夷灭近臣五百，夺冠帻仪仗闭门不纳，父后出奔食萝卜薨，遂称制为王。
- id: guji-琉璃王-event-massacre
  title_zh: 四征迦维罗卫屠释
  date: -0485
  year_of: -485
  location_zh: 迦维罗卫城
  description_zh: 三遇佛坐枯树哀愍亲族而还军，第四征破城，生缚贵姓三万埋地驱象蹈杀驾犁耕首，杀戮惨酷，释摩男投池自沉。
- id: guji-琉璃王-event-death
  title_zh: 海中七日期尽火烧灰灭
  date: -0485
  year_of: -485
  location_zh: 大海船上
  description_zh: 佛记现世作罪现世受七日有地狱火烧杀，乘船入海冀免，期尽水中自然火出烧船及王一時灰灭。
