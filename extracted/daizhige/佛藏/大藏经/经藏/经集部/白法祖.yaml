    title_zh: 以五福果报劝说法
    rationale: 讲经者多畏辛劳无功，故明言得寿富端正名闻智慧以坚其弘愿
  - date: 0292
    title_zh: 留洛说法不避危乱
    rationale: 众心惶惑更需法安，若我西去则群疑无依，故留住讲堂以正信安众
