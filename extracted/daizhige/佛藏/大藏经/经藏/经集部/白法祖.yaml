  archetype: 译经弘法沙门
  dilemmas:
  - title_zh: 梵汉文质之抉择
    description_zh: 直存梵义则汉人难晓，顺汉文辞则恐失本义，当如何权衡以令上中下语皆善
  - title_zh: 乱世去留之抉择
    description_zh: 八王扰洛众劝西避，我若独留恐遭杀害，若去则译场中断信众失依
  lesson: 上中下语悉令善好归于寂静，说法劝善者自得长寿富饶端正名闻智慧五福
  summary_first_person: 我是河内沙门白法祖，生逢西晋译经于洛，亲见好杀盗窃者闻法即止，故以汉言传佛说贤者五福，愿众生和悦敬信晓了妙慧
