endeavors:
- id: guji-目连-endeavor-1
  title_zh: 降伏龙王兄弟难头和难
  role_zh: 请命降伏者
  summary_zh: 佛众欲过虚空赴请，二龙嗔覆须弥致冥，吾请命往伏，以烟火神变入其身复化大龙覆之，令其悔过受戒
  phases:
  - key: brewing
    name: 虚空见冥请命往诃
    labels:
      zh: 请命
    start_date: '-500'
    highlight_event_id: guji-目连-event-subdue-ask
  - key: breakthrough
    name: 烟火神变相争
    labels:
      zh: 神变
    start_date: '-500'
    highlight_event_id: guji-目连-event-subdue-fight
  - key: climax
    name: 化龙覆须弥慑伏二龙
    labels:
      zh: 慑伏
    start_date: '-500'
    highlight_event_id: guji-目连-event-subdue-fight
  - key: closure
    name: 携龙见佛忏悔受戒
    labels:
      zh: 受戒
    start_date: '-500'
    highlight_event_id: guji-目连-event-convert-dragons
  decisions:
  - date: '-500'
    title_zh: 主动请命往诃止二龙
    rationale: 见二龙吐气为雾冥覆须弥，不忍其嗔害天下，故愿以神通折其慢心
  - date: '-500'
    title_zh: 闻佛敕止即收威复沙门身
    rationale: 佛言恐出水没坏天下，当以慈悲摄受令其自伏，不以杀伤为能
- id: guji-目连-endeavor-2
  title_zh: 随佛修行位居神通第一
  role_zh: 佛弟子弘化者
  summary_zh: 早随佛出家证阿罗汉得四神足，常往来天上人间，为佛宣扬功德，护持正法安隐众生
  phases:
  - key: brewing
    name: 归依出家修行
    labels:
      zh: 归依
    start_date: '-530'
    highlight_event_id: guji-目连-event-follow
  - key: breakthrough
    name: 证果得四神足
    labels:
      zh: 证果
    start_date: '-525'
    highlight_event_id: guji-目连-event-follow
  - key: climax
    name: 往来天龙教化
    labels:
      zh: 教化
    start_date: '-500'
    highlight_event_id: guji-目连-event-convert-dragons
  - key: closure
    name: 助佛弘化护世
    labels:
      zh: 护世
    start_date: '-500'
    highlight_event_id: guji-目连-event-convert-dragons
  decisions:
  - date: '-530'
    title_zh: 舍俗归佛精进禅定
    rationale: 信佛法能断苦得解脱，愿以持戒忍辱精进禅定智慧求证圣果
  - date: '-500'
    title_zh: 过帝释后园而不住直往龙所
    rationale: 不贪天乐以度众为急，先礼天帝而后赴难，示现比丘威仪与慈悲
events:
- id: guji-目连-event-birth
  title_zh: 出生于王舍城婆罗门家
  date: '-568'
  year_of: '-568'
  location_zh: 摩揭陀国王舍城
  description_zh: 约公元前六世纪末出生，与舍利弗为友，后同归佛门
- id: guji-目连-event-follow
  title_zh: 归依佛陀证阿罗汉
  date: '-530'
  year_of: '-530'
  location_zh: 王舍城竹林精舍
  description_zh: 随佛出家修行，证阿罗汉果，得四神足，称为神通第一
- id: guji-目连-event-subdue-ask
  title_zh: 虚空见冥请命降龙
  date: '-500'
  year_of: '-500'
  location_zh: 舍卫国祇洹上空至须弥山
  description_zh: 佛众赴阿难邠低舍受请，难头和难二龙绕须弥七匝吐雾致冥，吾长跪问佛请往诃止，佛言大善，绕佛三匝过帝释后园而行
- id: guji-目连-event-subdue-fight
  title_zh: 神变慑伏二龙王
  date: '-500'
  year_of: '-500'
  location_zh: 须弥山上
  description_zh: 二龙出烟出火，吾亦出烟绕之三重，分身入其眼耳鼻口，又化大龙绕之十四重以头覆须弥，龙悚栗动山扇海，佛遥敕且止
- id: guji-目连-event-convert-dragons
  title_zh: 携龙见佛受五戒
  date: '-500'
  year_of: '-500'
  location_zh: 阿难邠低舍佛前
  description_zh: 二龙恐惧稽首悔过，吾复沙门身将至佛所，二龙自言迷狂触犯愿哀原，受五戒而去，众宣扬功德
- id: guji-目连-event-death
  title_zh: 入灭
  date: '-484'
  year_of: '-484'
  location_zh: 摩揭陀国
  description_zh: 先佛入灭，示现无常，神通亦不免业缘
