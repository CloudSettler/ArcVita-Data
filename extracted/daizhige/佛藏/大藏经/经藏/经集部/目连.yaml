endeavors:
- id: guji-目连-endeavor-1
  title_zh: 得通观亲钵饭化火
  summary: 始得六通欲度父母以道眼见母生饿鬼钵盛饭往饷化成火炭驰白于佛
  phases:
  - key: brewing
    name: 出家修得六通
    labels:
      zh:
      - 修行得通
      - 孝念萌动
    start_date: '-530'
    highlight_event_id: guji-目连-event-birth
  - key: breakthrough
    name: 道眼见母堕饿鬼
    labels:
      zh:
      - 道眼观世
      - 见母受苦
    start_date: '-528'
    highlight_event_id: guji-目连-event-see-mother
  - key: climax
    name: 钵饭往饷化火炭
    labels:
      zh:
      - 钵盛饭饷母
      - 化火不得食
    start_date: '-528'
    highlight_event_id: guji-目连-event-offer-rice
  - key: closure
    name: 悲号驰还白佛
    labels:
      zh:
      - 悲泣求佛
      - 陈说因缘
    start_date: '-528'
    highlight_event_id: guji-目连-event-ask-buddha
  decisions:
  - date: '-528'
    title_zh: 以钵盛饭往饷饿鬼母
    rationale: 欲以神通独力报乳哺之恩见母皮骨连立不见饮食故先试自力救济
  - date: '-528'
    title_zh: 驰还白佛具陈母苦
    rationale: 自力化食成火炭声动天地亦无奈何故转求佛说救济之法
- id: guji-目连-endeavor-2
  title_zh: 奉盂兰盆救母度众
  summary: 依佛教于七月十五僧自恣日具盆供养十方大德母得脱一劫饿鬼苦复请为未来孝者立法得佛赞许
  phases:
  - key: brewing
    name: 佛说众僧威神救济法
    labels:
      zh:
      - 七世父母
      - 十方众僧
    start_date: '-528'
    highlight_event_id: guji-目连-event-ask-buddha
  - key: breakthrough
    name: 七月十五盆供自恣僧
    labels:
      zh:
      - 百味五果
      - 盆供咒愿
    start_date: -528-07-15
    highlight_event_id: guji-目连-event-ullanbana
  - key: climax
    name: 母脱饿鬼众皆欢喜
    labels:
      zh:
      - 解脱三途
      - 悲泣释然
    start_date: -528-07-15
    highlight_event_id: guji-目连-event-ullanbana
  - key: closure
    name: 请为未来立盆法
    labels:
      zh:
      - 行孝奉盆
      - 佛说奉持
    start_date: -528-07-15
    highlight_event_id: guji-目连-event-preach-filial
  decisions:
  - date: -528-07-15
    title_zh: 具饭百味盆供十方自恣僧
    rationale: 母罪根深结非一人力所奈何当须众僧清净戒德汪洋之力乃得解脱故依佛敕行供
  - date: -528-07-15
    title_zh: 复白佛请未来孝者亦奉盂兰盆
    rationale: 自亲蒙三宝众僧威神得度愿一切行孝顺者皆得救现在乃至七世父母故发大善快问
events:
- id: guji-目连-event-birth
  type: birth
  title_zh: 降生古印度
  date: '-568'
  year_of: -568
  description: 生于古印度婆罗门家后从佛出家位居十大弟子神通第一
- id: guji-目连-event-see-mother
  type: career
  title_zh: 始得六通道眼观母生饿鬼
  date: '-528'
  year_of: -528
  description: 在舍卫国祇树给孤独园始得六通欲度父母以道眼见亡母生饿鬼中不见饮食皮骨连立
- id: guji-目连-event-offer-rice
  type: career
  title_zh: 钵盛饭饷母化成火炭
  date: '-528'
  year_of: -528
  description: 钵盛饭往饷其母母以左手障饭右手抟食未入口化成火炭遂不得食悲号啼泣
- id: guji-目连-event-ask-buddha
  type: career
  title_zh: 驰还白佛蒙说救济法
  date: '-528'
  year_of: -528
  description: 驰还白佛具陈如此佛言母罪根深结当须十方众僧威神之力说七月十五盆供之法
- id: guji-目连-event-ullanbana
  type: career
  title_zh: 七月十五盆供自恣僧母得脱苦
  date: -528-07-15
  year_of: -528
  description: 于七月十五僧自恣时具百味五果盆器供养十方大德母即于是日得脱一劫饿鬼之苦众皆欢喜
- id: guji-目连-event-preach-filial
  type: career
  title_zh: 请为未来孝者立盂兰盆法
  date: -528-07-15
  year_of: -528
  description: 复白佛愿未来一切行孝顺者亦奉盂兰盆救现在乃至七世父母佛言大善令比丘国王万民皆应奉持
- id: guji-目连-event-death
  type: death
  title_zh: 般涅槃
  date: '-484'
  year_of: -484
  description: 先于佛入灭示现般涅槃后世尊为盂兰盆度亲之孝行典范
