endeavors:
- id: guji-祇域-endeavor-1
  title_zh: 弃位师学尽识草木皆药
  summary: 八岁归父为太子复弃位求医，往德叉尸罗师事宾迦罗七年，尽识一由旬内草木皆可入药，得药王树能照见腹脏
  phases:
  - key: brewing
    name: 持镮归父复弃太子位
    labels:
      zh:
      - 认父归宗
      - 弃荣求道
    start_date: '-532'
    highlight_event_id: guji-祇域-event-recognize
  - key: breakthrough
    name: 七年学医尽无非药之草
    labels:
      zh:
      - 遍识草木
      - 医道已成
    start_date: '-530'
    highlight_event_id: guji-祇域-event-study
  - key: climax
    name: 得药王树照见五脏
    labels:
      zh:
      - 神药照腹
      - 洞见病源
    start_date: '-523'
    highlight_event_id: guji-祇域-event-medicine-king
  - key: closure
    name: 归国初开医道
    labels:
      zh:
      - 学成归国
      - 初试头痛
    start_date: '-522'
    highlight_event_id: guji-祇域-event-first-cure
  decisions:
  - date: '-530'
    title_zh: 不为太子愿学医术
    rationale: 生而手把针药是医王之证，嫡子已生当让嗣位，行医可救一切命
  - date: '-530'
    title_zh: 远往德叉尸罗师事宾迦罗
    rationale: 国中诸医道无足学，闻宾迦罗极善医道可为师范
- id: guji-祇域-endeavor-2
  title_zh: 周行治病愈蟒毒王驰名天下
  summary: 治婆迦陀十二年头痛妇得四十万金，剖肠解轮戏肠结活已死长者子，开颅出数百刺虫活迦罗越女，正反戾之肝活木马坠地男，复以炼化醍醐愈南方蟒子王之遍身蛇毒
  phases:
  - key: brewing
    name: 婆迦陀灌鼻愈十二年头痛
    labels:
      zh:
      - 初治显名
      - 酥煎灌鼻
    start_date: '-522'
    highlight_event_id: guji-祇域-event-first-cure
  - key: breakthrough
    name: 破腹解结破颅出虫正肝续命
    labels:
      zh:
      - 起死回生
      - 金刀神膏
    start_date: '-521'
    highlight_event_id: guji-祇域-event-four-cures
  - key: climax
    name: 炼醍醐为水愈蟒毒暴王
    labels:
      zh:
      - 五愿方便
      - 白象脱身
    start_date: '-520'
    highlight_event_id: guji-祇域-event-snake-king
  - key: closure
    name: 治四人驰名天下护法济世
    labels:
      zh:
      - 医王扬名
      - 内外相护
    start_date: '-519'
    highlight_event_id: guji-祇域-event-snake-king
  decisions:
  - date: '-521'
    title_zh: 为已死者破腹破颅施治
    rationale: 以音声及药王照见非真死乃肠结脑虫肝戾之故，可治则当救不惧讥谤
  - date: '-520'
    title_zh: 承佛敕往治多杀医师之暴王
    rationale: 宿愿与佛俱救护天下佛治内病我治外病，又立五愿以醍醐化水令王不觉而服
events:
- id: guji-祇域-event-birth
  title_zh: 奈女生男手持针药囊弃于巷中
  date: '-540'
  year_of: -540
  place_zh: 维耶梨国梵志园奈树楼上
  summary: 奈女与瓶沙王宿合有娠生男，儿生手持针药囊，断为医王之证，以白衣裹弃巷中为无畏王子拾得养活
- id: guji-祇域-event-recognize
  title_zh: 八岁持金镮印远归瓶沙王为太子
  date: '-532'
  year_of: -532
  place_zh: 罗阅只国王宫
  summary: 只域被邻儿骂无父问母得金镮印信，往罗阅只见瓶沙王验印为子，立为太子二年后复请学医
- id: guji-祇域-event-study
  title_zh: 德叉尸罗七年学成尽识皆药
  date: '-523'
  year_of: -523
  place_zh: 德叉尸罗国宾迦罗师所
  summary: 师令觅一由旬内非药之草，周竟不得所见草木皆能分别入用，师叹阎浮提第一我死后次有汝
- id: guji-祇域-event-medicine-king
  title_zh: 宫门遇樵得药王树枝照见腹脏
  date: '-523'
  year_of: -523
  place_zh: 王舍城宫门前
  summary: 望见担樵小儿五脏分明，试以束中枝叶照腹，最后一尺余小枝具见腹内，知是药王树枝大喜
- id: guji-祇域-event-first-cure
  title_zh: 治婆迦陀十二年头痛妇得金供养
  date: '-522'
  year_of: -522
  place_zh: 婆迦陀城长者家
  summary: 以好药酥煎灌鼻令酥唾俱出口中，病愈得四十万两金并奴婢车马，是最初治病尽以上无畏王子
- id: guji-祇域-event-four-cures
  title_zh: 解肠结出脑虫正反肝活三死人
  date: '-521'
  year_of: -521
  place_zh: 拘睒弥国及维耶梨国迦罗越家
  summary: 破腹解轮戏肠结缝合无异，开颅出数百钻脑刺虫以三神膏补生，破腹手探还反戾之肝向前，各嘱静养三日十日而寤
- id: guji-祇域-event-snake-king
  title_zh: 以炼化醍醐愈南方蟒子王遍身蛇毒
  date: '-520'
  year_of: -520
  place_zh: 南方去罗阅只八千里大国王宫
  summary: 诊见血气皆蟒毒问太后知为蟒子，立新衣自出入见母后一仰尽服乘白象五愿，煎醍醐十五日化如清水五升令服，乘象脱身毒乌追摄以梨水方便令痢，三日后王病愈悔遣追杀
- id: guji-祇域-event-death
  title_zh: 医王济世毕卒于摩竭陀国
  date: '-460'
  year_of: -460
  place_zh: 摩竭陀国罗阅只城
  summary: 治四人驰名天下内外相护如佛所愿，寿终而卒后世尊为医王之因缘
