  dilemmas:
  - 太子尊荣与行医济世之间何去何从
  - 南方暴王征召多杀医师往救与畏死避祸之抉择
  lesson: 舍弃荣利精研医术以方便善巧救护众生命内外之病
  summary_first_person: 我是奈女之子瓶沙王之种，生即手把针药囊，八岁持镮归父，弃太子位师事宾迦罗，七年尽识草木皆可为药，得药王树照见五脏，行医四方治头痛解肠结破头出虫正肝续命，又以炼化醍醐愈蟒子王之毒，愿以此身治外病如佛治内病护佑天下
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%A5%88%E5%A5%B3%E7%A5%87%E5%9F%9F%E5%9B%A0%E7%BC%98%E7%BB%8F.html
