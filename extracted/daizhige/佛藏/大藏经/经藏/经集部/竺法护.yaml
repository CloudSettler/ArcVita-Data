endeavors:
- id: guji-竺法护-endeavor-1
  title_zh: 西涉诸国求取梵本
  summary: 幼居敦煌从师出家，博览通会胡汉语言，西行三十六国抄集梵经携归中土。
  phases:
  - key: brewing
    name: 敦煌出家博学胡汉
    labels:
      zh:
      - 出家
      - 通译
    start_date: 0238
    highlight_event_id: guji-竺法护-event-study
  - key: breakthrough
    name: 西行求经得大乘梵夹
    labels:
      zh:
      - 求法
      - 西行
    start_date: 181
    highlight_event_id: guji-竺法护-event-seek
  decisions:
  - date: 181
    title_zh: 携弟子西涉西域求梵本
    rationale: 中土阙大乘深典，非亲往西域访求原梵不足弘大法
  - date: 182
    title_zh: 负梵夹东归敦煌长安
    rationale: 得诸方等宝典当归汉地传译以济群生
- id: guji-竺法护-endeavor-2
  title_zh: 长安洛阳传译弘化
  summary: 居长安敦煌洛阳，译出光赞般若等百余部，宣说文殊悔过劝助转轮之法，教众发菩提心。
  phases:
  - key: climax
    name: 译说文殊悔过敷演劝助
    labels:
      zh:
      - 译经
      - 悔过
    start_date: 0286
    highlight_event_id: guji-竺法护-event-translate-wenshu
  - key: closure
    name: 乱中弘护付嘱门人
    labels:
      zh:
      - 弘护
      - 付嘱
    start_date: 196
    highlight_event_id: guji-竺法护-event-preach
  decisions:
  - date: 0286
    title_zh: 译出文殊悔过经示五体悔法
    rationale: 新学菩萨疑盖所覆，须以悔过劝助请转法轮摄归佛慧
  - date: 196
    title_zh: 永嘉之乱坚住弘化不舍众生
    rationale: 法灭时更当以慈护众，住法界教化无厌乃为菩萨本愿
events:
- id: guji-竺法护-event-birth
  title_zh: 生于月支家世
  date: 152
  year_of: 230
  place_zh: 月支后徙敦煌
  description: 月支国人后居敦煌，八岁出家从师诵习博通经论。
- id: guji-竺法护-event-study
  title_zh: 敦煌从师博通胡汉
  date: 0238
  year_of: 238
  place_zh: 敦煌
  description: 师事高僧博览六经及梵汉语言，志在传译大乘。
- id: guji-竺法护-event-seek
  title_zh: 西涉诸国求得梵本
  date: 182
  year_of: 266
  place_zh: 西域三十六国
  description: 游历西域诸国抄集大乘梵夹甚多，携归敦煌长安为译经之本。
- id: guji-竺法护-event-translate-wenshu
  title_zh: 译出佛说文殊悔过经
  date: 0286
  year_of: 286
  place_zh: 长安
  description: 于罗阅只耆阇崛会中译文殊答如来齐光所问，示五体投地悔过劝助转法轮之法。
- id: guji-竺法护-event-preach
  title_zh: 洛阳弘化教化不倦
  date: 197
  year_of: 305
  place_zh: 洛阳
  description: 值世乱犹率弟子弘宣般若方等，劝众悔罪发心住不退转。
- id: guji-竺法护-event-death
  title_zh: 卒于洛阳青门外
  date: 0308
  year_of: 308
  place_zh: 洛阳
  description: 永嘉二年示寂，门人立塔传其译典百五十余部行于世。
