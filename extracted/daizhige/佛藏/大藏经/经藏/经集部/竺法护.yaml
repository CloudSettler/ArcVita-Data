  place_zh: 大月氏
  description: 约生于月氏，世居敦煌，八岁出家，从师诵经，日记万言
- id: guji-竺法护-event-seek-dharma
  title_zh: 游西域三十六国求梵本
  date: '0265'
  year_of: 265
  place_zh: 西域至敦煌
  description: 遍游西域，通三十六国语言文字，得大乘梵夹而归
- id: guji-竺法护-event-translate-wuji
  title_zh: 译出无极宝三昧经
  date: 0286
  year_of: 286
  place_zh: 洛阳
  description: 于竹园说法之会译宝如来三昧，演九宝八直及三十二宝，明诸法本空无住
- id: guji-竺法护-event-death
  title_zh: 卒于洛阳乱中
  date: 0308
  year_of: 308
  place_zh: 洛阳
  description: 永嘉二年，避乱而终，年约七十八，门人奉其译本流传后世
