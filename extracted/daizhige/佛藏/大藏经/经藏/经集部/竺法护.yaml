  era: 西晋
  reign_ref: 晋武帝泰始至怀帝永嘉
  archetype: 译经弘法者
  dilemmas:
  - 胡梵深典难通而欲以汉语显大乘平等
  - 西域求经险远与中土乱世弘传两艰
  lesson: 自首悔过劝助众德归趣无上菩提
  summary_first_person: 吾本月支沙门寓居敦煌，博通胡汉游学西域，归而传译大乘，于耆阇崛宣说文殊悔过劝助之行，愿代众生悔除盖障发无上心。
