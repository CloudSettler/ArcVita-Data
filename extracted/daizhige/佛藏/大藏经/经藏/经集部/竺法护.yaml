  dilemmas:
  - 梵汉文义悬隔，如何传信达雅而不失禅观本意
  - 世乱流离译场艰辛，如何坚持弘化不懈
  lesson: 总众经大较，建易进径路，专精禅数，体空归无，方离众患
  summary_first_person: 吾幼居敦煌，八岁出家，随师游西域，通三十六国语，归中夏译经弘化，钞众经要作修行径路，愿后贤精进至甘露
