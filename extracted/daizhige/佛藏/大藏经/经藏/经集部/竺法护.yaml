  dilemmas:
  - 胡梵汉译语义难传而志在通经弘道
  - 战乱流离道场屡迁而守意精进不舍
  - 身爱贪著淫嗔痴盛而观空无常以制心
  lesson: 数息守意观身非常空无方得出离安隐泥洹
  summary_first_person: 吾本月氏裔居敦煌幼而出家西行求法携经东归毕生译经弘道但愿众生守意数息观身无常离贪恚痴同趣泥洹
