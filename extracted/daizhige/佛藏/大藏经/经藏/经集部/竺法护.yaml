  lesson: 发大愿游西域求法归中土勤译不辍乱世亦不舍经教方使大乘流通
  summary_first_person: 吾本月氏家居敦煌，少游西域求得梵本，归洛阳长安终身译经，译此宝网以显诸佛名号功德，愿众生闻名不疑同归正道
