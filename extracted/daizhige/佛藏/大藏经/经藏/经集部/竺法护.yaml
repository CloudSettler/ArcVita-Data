  summary_first_person: 吾本月支，家居敦煌，八岁出家，从师诵习，游学西域三十六国，尽通梵语胡书，还归洛阳长安，毕世译经百五十余部，译此大净法门，明文殊化度上金光首之缘，愿众生本净发无上道意
