    labels:
      zh: 得本
    start_date: '0255'
    highlight_event_id: guji-竺法护-event-seek-dharma
  - key: climax
    name: 携经东归达敦煌
    labels:
      zh: 归土
    start_date: '0265'
    highlight_event_id: guji-竺法护-event-seek-dharma
  - key: closure
    name: 入洛奠定译场之基
    labels:
      zh: 奠基
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-seek-dharma
  decisions:
  - date: '0255'
    title_zh: 决意西逾流沙求法
    rationale: 见中土所传多小乘，欲求大乘深典，故不惮险远而西行
  - date: '0265'
    title_zh: 携梵本东归弘传
    rationale: 以法付嘱不可自利，欲令东方见宝藏，故冒难东还
- id: guji-竺法护-endeavor-2
  title_zh: 洛阳长安译传大乘
  summary: 居洛阳白马寺及长安，译出无极宝三昧经等百余部，奠定般若方等 system
  phases:
  - key: brewing
    name: 初译正法华等开宗
    labels:
      zh: 初译
    start_date: '0266'
    highlight_event_id: guji-竺法护-event-translate-wuji
  - key: breakthrough
    name: 译出无极宝三昧经
    labels:
      zh: 宝三昧
    start_date: 0286
    highlight_event_id: guji-竺法护-event-translate-wuji
  - key: climax
    name: 百部竞出四众归仰
    labels:
      zh: 盛译
    start_date: 0290
    highlight_event_id: guji-竺法护-event-translate-wuji
  - key: closure
    name: 兵乱中守经至终
    labels:
      zh: 守法
    start_date: '0304'
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0286
    title_zh: 先译无极宝三昧明空慧
    rationale: 欲以无作无住破有想之疑，故举宝来问佛九宝八直为津梁
  - date: '0304'
    title_zh: 永嘉之乱不辍译事
    rationale: 知法宝不绝则慧命不断，故流离中犹护经卷教授门人
events:
