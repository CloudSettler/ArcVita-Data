  dilemmas:
  - title_zh: 在家与出家
    description: 虽为白衣居家有妻子而奉持沙门至贤之行以在俗摄众不舍道业
  - title_zh: 示疾与说法
    description: 以权道现身有疾引国王大臣长者问疾即借四大无常开示佛身从福慧生
  - title_zh: 言说与默然
    description: 折伏声闻弟子之辩才终以默然显入不二法门明无言为真入
  lesson: 不离世间而证菩提烦恼即菩提生死即涅槃以善权方便于居家示现一切道行摄化众生共净佛国
  summary_first_person: 吾乃毗耶离长者维摩诘汉言无垢称先佛已造行得法忍辩才神通居家而修梵行资财无量救摄贫民入诸衢巷王宫庶民皆以善权导之复示疾说法令问疾者发无上道意声闻不敢当锋文殊与吾论不二默然显道但愿众生意净即见佛国严净
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E8%AF%B4%E7%BB%B4%E6%91%A9%E8%AF%98%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0474
endeavors:
