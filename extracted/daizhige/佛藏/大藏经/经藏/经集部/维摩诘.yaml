    labels:
      zh: 严净佛国
    start_date: -0482
    highlight_event_id: guji-维摩诘-event-home-practice
  decisions:
  - date: -0485
    title_zh: 资财救贫摄恶戒
    rationale: 以无量资财救摄贫民以善方便摄诸恶戒以忍调恚怒使众先安后闻法
  - date: -0485
    title_zh: 现妻子而常修梵行
    rationale: 不离世间俗教善语而内守清净欲度人故居维耶离行权道不止无色而示有家
- id: guji-维摩诘-endeavor-2
  title_zh: 示疾说法显不思议解脱
  summary: 以权道现身有疾引舍利弗目连迦叶等问疾皆曾被折伏不敢承命后与文殊论不二法门现不可思议解脱令八万四千人发无上道意
  phases:
  - key: brewing
    name: 示疾卧床念佛
    labels:
