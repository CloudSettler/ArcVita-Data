  place: 毗耶离大城
  description: 生于毗耶离为人根名德生而具足资财无量在先佛已造行修善本得法忍辩才神通
- id: guji-维摩诘-event-home-practice
  type: career
  title_zh: 居家行善权普摄众生
  date: -0485
  year_of: -485
  place: 毗耶离四衢王宫讲堂
  description: 虽为白衣有妻子而常修梵行游四衢持法律入王藏讲众淫舍酒会长者居士君子梵志各正其意令乐法兴福
- id: guji-维摩诘-event-sick-preach
  type: career
  title_zh: 示疾为问疾者说法
  date: -0480
  year_of: -480
  place: 毗耶离维摩诘舍
  description: 以权道现身有疾国王大臣长者居士无数千人问疾即说身无常无我如幻梦影当学佛身从三十七品十力十八法生令无数千人发无上正真道意佛命声闻问疾皆辞不敢往
- id: guji-维摩诘-event-manjusri-dialogue
  type: career
  title_zh: 与文殊论不二不思议法
  date: -0480
  year_of: -480
  place: 毗耶离维摩诘室
  description: 佛命文殊问疾众会随往论说甚深不二法门现不思议解脱神通宝盖覆三千世界佛以足指案地现佛国严净八万四千人发道意长者子宝事等得柔顺法忍
- id: guji-维摩诘-event-death
  type: death
  title_zh: 示现灭度流通普入道门
  date: '-0420'
  year_of: -420
  place: 毗耶离
  description: 化缘既毕示现灭度其所说不思议法门名佛法普入道门三昧经由支谦译传令后世居家学者不舍生死而严净佛土
