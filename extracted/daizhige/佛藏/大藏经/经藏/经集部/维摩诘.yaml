  - key: breakthrough
    name: 折伏声闻不敢问疾
    labels:
      zh: 辩破执着
    start_date: -0480
    highlight_event_id: guji-维摩诘-event-sick-preach
  - key: climax
    name: 说身无常演佛身功德
    labels:
      zh: 身疾说法
    start_date: -0480
    highlight_event_id: guji-维摩诘-event-sick-preach
  - key: closure
    name: 对文殊默然入不二
    labels:
      zh: 默然显道
    start_date: -0480
    highlight_event_id: guji-维摩诘-event-manjusri-dialogue
  decisions:
  - date: -0480
    title_zh: 说四大身为死亡法
    rationale: 为问疾国王大臣说身如聚沫泡影梦响无常苦空当发清净行学佛法身从福慧慈悲布施戒忍禅智生
  - date: -0480
    title_zh: 呵宴坐乞食执相之见
    rationale: 语舍利弗不必坐为宴坐不于三界现身意为宴坐语迦叶须菩提等平等法施离相乞食令声闻舍小道趣大乘
events:
- id: guji-维摩诘-event-birth
