person:
  qid: guji-维摩诘
  name_zh: 维摩诘
  names:
    zh: 维摩诘
    en: Vimalakirti
  lifespan:
    birth:
      date: -0500-01-01
      precision: century
      is_circa: true
      raw: 与释迦同时毗耶离人约前五世纪
    death:
      date: -0440-01-01
      precision: century
      is_circa: true
      raw: 约前五世纪末示寂
  birth_date: -0500-01-01
  death_date: -0440-01-01
  era: 春秋战国之际
  archetype: 在家菩萨
  dilemmas:
  - 在家而持沙门净戒居俗而不染俗
  - 示疾而实无疾以苦身说无常法身
  - 辩说而归默然以无言显不二深义
  lesson: 直心是道场心净则土净居家学道亦可不思议解脱
  summary_first_person: 吾居毗耶离为长者供养无量佛得无生忍以善方便入诸众中示有妻子而不著欲示有身疾而广说法文殊来问默然无言是为入不二法门
  source_urls:
  - https://zh.wikisource.org/wiki/維摩詰所說經
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/维摩诘所说经.html
endeavors:
- id: guji-维摩诘-endeavor-1
  title_zh: 以善方便居毗耶离饶益众生
  summary: 资财摄贫持戒忍辱精进入诸阶层中尊说法不著三界现居家相而修梵行
  phases:
  - key: brewing
    name: 植本发愿
    labels:
      zh: 供养无量佛深植善本
    start_date: -0500-01-01
    highlight_event_id: guji-维摩诘-event-birth
  - key: breakthrough
    name: 遍入众中
    labels:
      zh: 于长者居士刹利婆罗门等中尊说法
    start_date: -0480-01-01
    highlight_event_id: guji-维摩诘-event-convenience
  - key: climax
    name: 治生饶益
    labels:
      zh: 游四衢入政法学堂淫舍酒肆皆以度人
    start_date: -0475-01-01
    highlight_event_id: guji-维摩诘-event-convenience
  - key: closure
    name: 摄化成就
    labels:
      zh: 一切见敬为供养中最执持正法
    start_date: -0472-01-01
    highlight_event_id: guji-维摩诘-event-convenience
  decisions:
  - date: -0480-01-01
    title_zh: 欲度人故以方便居毗耶离
    rationale: 非出家相方能遍摄王臣长者梵天帝释及贫民童蒙故现白衣而怀清净律行
  - date: -0475-01-01
    title_zh: 示有妻子眷属宝饰饮食而不染著
    rationale: 若不入俗则众生不亲故同其形服而以相好禅悦为严味令见敬而受法
- id: guji-维摩诘-endeavor-2
  title_zh: 示疾问疾显不思议解脱不二法门
  summary: 以方便现身有疾引国王大臣赴问广说身无常苦空劝发菩提心复与文殊论疾及不二默然无言惊伏声闻菩萨
  phases:
  - key: brewing
    name: 示疾卧床
    labels:
      zh: 以方便现身有疾引众问疾
    start_date: -0470-01-01
    highlight_event_id: guji-维摩诘-event-illness
  - key: breakthrough
    name: 说身说法
    labels:
      zh: 说身如聚沫泡炎梦影响劝乐佛身发菩提心
    start_date: -0470-06-01
    highlight_event_id: guji-维摩诘-event-illness
  - key: climax
    name: 折伏声闻
    labels:
      zh: 舍利弗目连迦叶须菩提等皆述被诘不堪问疾
    start_date: -0470-07-01
    highlight_event_id: guji-维摩诘-event-silence
  - key: closure
    name: 默然不二
    labels:
      zh: 与文殊论不二默然无言众叹未曾有
    start_date: -0470-08-01
    highlight_event_id: guji-维摩诘-event-silence
  decisions:
  - date: -0470-01-01
    title_zh: 以身疾广为说法
    rationale: 众因问疾而聚集身病为说法缘最能令悟无常厌患色身而乐法身故示疾而不忧戚
  - date: -0470-08-01
    title_zh: 于文殊问不二默然无言
    rationale: 言说皆属戏论无言方显无生无灭不二真义故以默印可令众入不可思议解脱
events:
- id: guji-维摩诘-event-birth
  title_zh: 诞生毗耶离为长者
  date: -0500-01-01
  year_of: -500
  place_zh: 毗耶离大城
  summary: 毗耶离长者家诞生曾供养无量诸佛深植善本得无生忍
- id: guji-维摩诘-event-convenience
  title_zh: 以善方便居毗耶离摄化四众
  date: -0480-01-01
  year_of: -480
  place_zh: 毗耶离
  summary: 资财摄贫奉戒摄毁禁遍入长者居士王臣梵天帝释中尊说法游衢治政诱开童蒙皆饶益众生
- id: guji-维摩诘-event-illness
  title_zh: 方便示疾广说法
  date: -0470-01-01
  year_of: -470
  place_zh: 毗耶离丈室
  summary: 现身有疾国王大臣长者居士无数千人往问因说身无常苦空不净劝发阿耨多罗三藐三菩提心
- id: guji-维摩诘-event-silence
  title_zh: 与文殊论不二默然问疾
  date: -0470-08-01
  year_of: -470
  place_zh: 毗耶离丈室
  summary: 佛遣声闻菩萨问疾皆称不堪文殊承命往问论说身疾及入不二法门维摩诘默然无言文殊叹为真入不二
- id: guji-维摩诘-event-death
  title_zh: 示寂毗耶离
  date: -0440-01-01
  year_of: -440
  place_zh: 毗耶离
  summary: 化缘既毕于毗耶离示现灭度后人结集其说为维摩诘所说经亦名不可思议解脱
