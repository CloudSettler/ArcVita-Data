  decisions:
  - date: -499
    title_zh: 薄敛省役顺古圣王勿行刑戮
    rationale: 以父母爱子为喻，断人命定招恶报，欲成就王民二利风调雨顺太平故
  - date: -498
    title_zh: 日日澡漱诵胜幡陀罗尼七遍
    rationale: 知老病死失势四山逼迫死苦无依，唯善法与神咒能为救济消除罪障生长福因故
  - date: -497
    title_zh: 顶戴王法令举国诵习流通
    rationale: 闻安隐自身长保国位利益含识名闻十方生天受乐故深心喜庆信受奉行
