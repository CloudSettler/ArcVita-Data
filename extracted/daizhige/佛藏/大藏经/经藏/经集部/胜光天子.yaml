  era: 春秋末期佛世
  reign_ref: 憍萨罗国
  archetype: 慕法护国之君
  dilemmas:
  - 以威刑治国速见功效与以仁法化世长保安乐之间如何抉择
  - 耽著王位寿命五欲尊贵与观身无常死苦逼迫精进修善之间如何自处
  lesson: 舍恶行善以四摄恩育万民，恭敬三宝拥护正法，恒观无常不放逸，方能现世安乐命终生天乃至菩提
  summary_first_person: 我是憍萨罗国胜光天子，严驾往逝多林礼佛，请问为国主法，蒙佛教以善法四摄薄敛恤民护持三宝观无常持胜幡陀罗尼，我顶戴受持愿举国流通不敢放逸
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E4%B8%BA%E8%83%9C%E5%85%89%E5%A4%A9%E5%AD%90%E8%AF%B4%E7%8E%8B%E6%B3%95%E7%BB%8F.html
