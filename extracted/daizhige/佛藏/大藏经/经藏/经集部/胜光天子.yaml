    title_zh: 舍五盛事著常人服礼佛
    rationale: 见佛相好庄严生大欢喜，为表恭敬调伏诸根故弃髻珠盖拂宝履宝剑
  - date: -500
    title_zh: 请问为国主法求现乐后乐
    rationale: 愿现在恒受安乐命终生天乃至菩提善心相续故求佛开悟善教
- id: guji-胜光天子-endeavor-2
  title_zh: 以正法化世护国利民
  summary: 奉佛教以四摄育民薄敛省役赏贤远佞护持三宝观无常修福举国流通
