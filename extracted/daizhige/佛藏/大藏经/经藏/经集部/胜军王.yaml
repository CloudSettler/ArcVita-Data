  name_zh: 胜军王
  names:
    zh: 胜军王
    en: Prasenajit
  lifespan:
    birth:
      date: -360
      precision: year
      is_circa: true
      raw: 约公元前六世纪生于憍萨罗
    death:
      date: -0483
      precision: year
      is_circa: true
      raw: 约公元前五世纪初卒
  birth_date: -360
  death_date: -0483
  era: 古印度列国时代
  reign_ref: 憍萨罗国王
  archetype: 护法仁王
  dilemmas:
  - 以正法治化与弃背正法行非法之抉择
  - 贪著富乐欲乐自在乐与观无常舍离染著之抉择
  - 世间有漏暂乐与出世无漏久安之抉择
  lesson: 世间富乐皆是无常灭法，唯舍常见修无常想，广修出世善法，方能远离老病死怖，趣向涅槃
  summary_first_person: 我为憍萨罗胜军大王，统大国城，富贵自在，久于佛法生大信重，我乘宝车诣祇树给孤独园，顶礼世尊，奉施宝冠宝盖而请法要，闻说无常四大怖及十二因缘，方知世间如梦如沫，唯精进修出世善法可为依怙
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0516
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/佛说胜军王所问经.html
endeavors:
- id: guji-胜军王-endeavor-1
  title_zh: 以正法治化摄护人民
  description: 为人民主，常以正法行治化，舍非法，以四摄法令人民归伏
  phases:
  - key: brewing
    name: 承国信佛
    labels:
      zh: 尊贵信法
    start_date: -320
    highlight_event_id: guji-胜军王-event-visit
  - key: breakthrough
    name: 出城诣佛
    labels:
      zh: 恭敬听法
    start_date: -0490
    highlight_event_id: guji-胜军王-event-visit
  - key: climax
    name: 正法摄民
    labels:
      zh: 四法摄化
    start_date: -0490
    highlight_event_id: guji-胜军王-event-rule
  - key: closure
    name: 归宫奉行
    labels:
      zh: 欢喜奉行
    start_date: -0490
    highlight_event_id: guji-胜军王-event-rule
  decisions:
  - date: -0490
    title_zh: 舍非法行正法
    rationale: 若弃背正法行非法则现世轻谤命终不生胜处，若行正法则现世称赞命终生天受胜果报，故须舍非法
  - date: -0490
    title_zh: 以四摄视民如子
    rationale: 王爱人民如父母爱子，以布施爱语利行同事摄化，则人民归伏，国土安稳
- id: guji-胜军王-endeavor-2
  title_zh: 舍世间常见修出世善法
  description: 了知富乐无常如梦如沫，舍坚执，念念作无常想，修出世行求涅槃
  phases:
  - key: brewing
    name: 奉施请法
    labels:
      zh: 请问法要
    start_date: -0490
    highlight_event_id: guji-胜军王-event-offer
  - key: breakthrough
    name: 闻无常怖
    labels:
      zh: 了知四怖
    start_date: -0490
    highlight_event_id: guji-胜军王-event-offer
  - key: climax
    name: 观缘起灭苦
    labels:
      zh: 明十二因缘
    start_date: -0490
    highlight_event_id: guji-胜军王-event-teach
  - key: closure
    name: 精进趣善
    labels:
      zh: 自作劝他
    start_date: -0490
    highlight_event_id: guji-胜军王-event-teach
  decisions:
  - date: -0490
    title_zh: 于无常法莫生常住想
    rationale: 世间如大树焚灭，如四山压众，如师子取兽，刹那坏灭竟无其实，故当舍常见作无常想
  - date: -0490
    title_zh: 速修出世善法自作劝他
    rationale: 临终病苦无亲友财宝可救，唯善业为归趣依怙，故寿报未尽当广修善因勤行梵行以至涅槃
events:
- id: guji-胜军王-event-birth
  title_zh: 生于憍萨罗王族
  date: -360
  year_of: -550
  description: 约公元前六世纪生于憍萨罗国，后嗣位为胜军大王，统舍卫国境
- id: guji-胜军王-event-visit
  title_zh: 乘宝车诣祇园见佛
  date: -0490
  year_of: -490
  description: 与臣从婆罗门长者围绕，以音乐导前，出舍卫诣祇树给孤独园，下车去盖，徒步礼佛足而听法
- id: guji-胜军王-event-offer
  title_zh: 奉施宝物请说法要
  date: -0490
  year_of: -490
  description: 持宝冠宝盖宝剑宝珠奉上世尊，合掌请佛说长夜大利乐之法要，得闻正法邪行老病死四怖及无常偈
- id: guji-胜军王-event-rule
  title_zh: 闻法欢喜以正法化民
  date: -0490
  year_of: -490
  description: 闻佛以方便譬喻说妙法已，了知王当视民如子行四摄法，顶礼回复王宫，行正法治化
- id: guji-胜军王-event-teach
  title_zh: 得闻十二因缘出世法
  date: -0490
  year_of: -490
  description: 佛说无明缘行乃至老死苦集苦灭，劝舍世间法修出世行，王欢喜踊跃赞叹信受
- id: guji-胜军王-event-death
  title_zh: 寿报尽归无常
  date: -0483
  year_of: -483
  description: 寿报既尽，一切眷属财宝不能守护，命终谢世，随自作业受果，示现世间无常灭法
