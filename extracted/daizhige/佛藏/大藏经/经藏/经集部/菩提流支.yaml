  dilemmas:
  - 梵汉文义悬隔如何既存无字实义又令华人得解
  - 空有论诤并起如何以不生不灭离二边之说调和众心
  lesson: 灭尽贪嗔痴慢懈怠睡眠诸障日夜护持己所不欲勿施于人则可契入无字法门广博严藏
  summary_first_person: 吾自北天竺来永平元年至洛阳蒙魏主礼敬入译场译出无字宝箧等经论吾观胜思惟所问一法当灭者贪嗔痴我见懈怠睡眠贪爱无明也一法当护者己所不欲勿施于人也一法如来所觉者无有一法可觉一切法不生不灭离二边如幻如焰不去不来此即无字辩才广博严藏愿后世受持读诵书写流通者皆得宿命不断辩才不堕恶道
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0828
  - https://daizhige.org/
