    start_date: 0512-01-01
    highlight_event_id: guji-菩提流支-event-translate
  - key: breakthrough
    name: 开示四发心次第
    labels:
      zh:
      - 初发行发
      - 不退补处
    start_date: 0515-01-01
    highlight_event_id: guji-菩提流支-event-preach
  - key: climax
    name: 广说方便慧双道
    labels:
      zh:
      - 方便摄善
      - 慧达实相
    start_date: 0518-01-01
    highlight_event_id: guji-菩提流支-event-preach
  - key: closure
    name: 劝修如实修行流通后世
    labels:
      zh:
      - 如实修行
      - 流通劝学
    start_date: 0525-01-01
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: 0515-04-01
    title_zh: 先授大悲直心平等之旨
    rationale: 菩萨行本于大悲，大悲本于直心平等，先立根本则后行不迷
  - date: 0520-08-01
    title_zh: 并弘方便慧二道令人福智双修
    rationale: 单修方便则滞于有碍，单修慧则阙于摄生，故劝双运以速证
