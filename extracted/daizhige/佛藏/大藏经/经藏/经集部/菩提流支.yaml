    title_zh: 应请入魏译经
    rationale: 为令中土得闻大乘广法，不辞远行入洛阳译场。
  - date: 0511-03-01
    title_zh: 先译佛名立忏悔门
    rationale: 众生罪重先需除障，故先出诸佛名号令人受持读诵。
- id: guji-菩提流支-endeavor-2
  title_zh: 弘传持名忏悔与发菩提心
  summary_zh: 依佛名经宣说十方诸佛名号受持功德，开示七心忏悔三障，发菩提心求一切种智。
  phases:
  - key: brewing
    name: 观察中土业重需忏
    labels:
      zh: 酝酿
    start_date: 0509-01-01
    highlight_event_id: guji-菩提流支-event-arrival
  - key: breakthrough
    name: 开示受持佛名除罪
