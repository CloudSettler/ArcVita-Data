      - 功成身退
    start_date: 0526-01-01
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: 0508-06-01
    title_zh: 应诏入洛主持译场
    rationale: 为使华夏得闻正法，不辞远游艰辛，愿集众智共成译业
  - date: 0512-03-01
    title_zh: 详译深义兼顾华言畅晓
    rationale: 若但存梵音则华人不解，若但取华俗则失实，故以正观忆念审定文义
- id: guji-菩提流支-endeavor-2
  title_zh: 弘扬菩萨发心大悲之道
  summary: 依文殊所说阐明四种发心十种智慧十种对治，引导学人以方便慧双道疾得菩提
  phases:
  - key: brewing
    name: 以大悲直心立本
    labels:
