    start_date: 0512-01-01
    highlight_event_id: guji-菩提流支-event-translate-foming
  - key: climax
    name: 广说七心忏悔三障
    labels:
      zh: 高潮
    start_date: 0515-01-01
    highlight_event_id: guji-菩提流支-event-preach
  - key: closure
    name: 劝发菩提同入正道
    labels:
      zh: 收束
    start_date: 0526-01-01
    highlight_event_id: guji-菩提流支-event-preach
  decisions:
  - date: 0515-05-01
    title_zh: 立七心为忏悔方便
    rationale: 唯兴惭愧恐怖厌离等七心，方能灭烦恼业果三障。
  - date: 0520-08-01
    title_zh: 劝怨亲平等念报佛恩
    rationale: 破分别想着，报如来舍头目国城之恩，弘通大乘广化众生。
