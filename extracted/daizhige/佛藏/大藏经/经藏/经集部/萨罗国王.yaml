  dilemmas:
  - 国富民乐耽著声色与念无常离苦之间抉择
  - 恣心聚敛享乐与布施持戒亲善之间抉择
  lesson: 富乐无常不可恃，布施少欲信戒亲善可离苦得记
  summary_first_person: 吾本治萨罗大国，土地广博人民富乐，耽著园观浴池五乐，不念无常。幸蒙世尊放光现神来化，吾率臣民出城礼佛，闻贪欲后世烧炙之苦，发心立信行四事，设大檀供佛及众，奉衣化成华盖，得蒙授记当来作佛号慧光，举国万余人皆发道意。
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/佛说萨罗国经.html
  - https://cbetaonline.dila.edu.tw/zh/T0520
