person:
  qid: guji-蓱沙王
  name_zh: 蓱沙王
  names:
    zh: 蓱比沙王
    en: Bimbisara
  lifespan:
    birth:
      date: -0558
      precision: year
      is_circa: true
      raw: 约公元前558年
    death:
      date: -0491
      precision: year
      is_circa: true
      raw: 约公元前491年
  birth_date: -0558
  death_date: -0491
  era: 古印度列国时代
  reign_ref: 摩揭陀国王舍城王
  archetype: 立愿值佛护法之王
  dilemmas:
  - 太子时立五愿年少为王与值佛听法如何得兼
  - 身居王位国事繁剧与出入佛所常听经法如何不相妨
  - 得须陀洹道后护国爱民与向道解脱如何抉择
  lesson: 至诚发愿亲近善知识闻法即行则愿愿皆成
  summary_first_person: 吾为王舍城蓱比沙王，少为太子即立五愿，愿年少为王，国中有佛，常往来佛所，常听说法，闻即开解得须陀洹，佛成道后吾迎佛入鹞山竹林，终身护法，并以佛出世之信遗告友邦弗迦沙王，令彼亦得见佛闻法，吾虽居王位，未尝舍离法喜，此吾一生之志也
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E8%AF%B4%E8%93%B1%E6%B2%99%E7%8E%8B%E4%BA%94%E6%84%BF%E7%BB%8F.html
  - https://cbetaonline.dila.edu.tw/zh/T0511
endeavors:
- id: guji-蓱沙王-endeavor-1
  title_zh: 五愿成就值佛证果
  summary: 太子时立五愿，年少即位，佛出世住王舍鹞山，迎请亲近，听法开解得须陀洹，终身护持
  phases:
  - key: brewing
    name: 太子立五愿
    labels:
      zh:
      - 立愿
    start_date: '-0545'
    highlight_event_id: guji-蓱沙王-event-vow
  - key: breakthrough
    name: 年少为王值佛出世
    labels:
      zh:
      - 即位值佛
    start_date: -0528
    highlight_event_id: guji-蓱沙王-event-meet-buddha
  - key: climax
    name: 常往佛所听法开解
    labels:
      zh:
      - 听法证果
    start_date: '-0527'
    highlight_event_id: guji-蓱沙王-event-attain-sotapanna
  - key: closure
    name: 舍竹林终身护持
    labels:
      zh:
      - 护法
    start_date: '-0526'
    highlight_event_id: guji-蓱沙王-event-protect
  decisions:
  - date: -0528
    title_zh: 迎佛入王舍城鹞山
    rationale: 既闻佛出世住世说法，恐失亲近之缘，故率群臣迎请住止，以便出入往来常听经
  - date: '-0527'
    title_zh: 施竹林精舍专心听法
    rationale: 欲令佛僧安住说法不绝，国人咸得度脱，故舍竹园为僧住处，自己恒往听受以求开解
- id: guji-蓱沙王-endeavor-2
  title_zh: 通书弗迦沙传播佛名
  summary: 与北方德差伊罗国弗迦沙王遥相敬爱，以金莲往来为信，专书告以佛出世功德及十二因缘要义，劝其见佛学道
  phases:
  - key: brewing
    name: 两王遥相爱敬
    labels:
      zh:
      - 交好
    start_date: '-0530'
    highlight_event_id: guji-蓱沙王-event-friendship
  - key: breakthrough
    name: 得千叶金莲报以佛讯
    labels:
      zh:
      - 通书报佛
    start_date: '-0527'
    highlight_event_id: guji-蓱沙王-event-letter
  - key: climax
    name: 详陈缘起劝其见佛
    labels:
      zh:
      - 劝学
    start_date: '-0527'
    highlight_event_id: guji-蓱沙王-event-letter
  - key: closure
    name: 弗迦沙弃国趣佛证道
    labels:
      zh:
      - 化友得道
    start_date: '-0527'
    highlight_event_id: guji-蓱沙王-event-fukasya-awaken
  decisions:
  - date: '-0527'
    title_zh: 以佛为人华回遗弗迦沙
    rationale: 彼遗千叶金莲至为希有，我国虽多金银珍宝不足为宝，唯佛出世最奇，故以此无上宝报之
  - date: '-0527'
    title_zh: 具书十二因缘教诫
    rationale: 彼愿具闻佛教施行奉行，又虑人命在呼吸间恐不及待报，故先具书缘起性空要义令其得入道门
events:
- id: guji-蓱沙王-event-birth
  title_zh: 王舍城诞生为太子
  type: birth
  date: -0558
  year_of: -558
  description: 生于摩揭陀王族王舍城，少小为太子，天性敬道即立五愿
  place_zh: 王舍城
- id: guji-蓱沙王-event-vow
  title_zh: 太子立五愿
  type: career
  date: '-0545'
  year_of: -545
  description: 为太子时立五愿，愿年少为王，国中有佛，常往来佛所，常听经，闻即开解得须陀洹
  place_zh: 王舍城
- id: guji-蓱沙王-event-friendship
  title_zh: 与弗迦沙遥相亲敬
  type: career
  date: '-0530'
  year_of: -530
  description: 与北方德差伊罗国弗迦沙王生未相见，遥相爱敬如兄弟，常书记往来相问遗不绝
  place_zh: 王舍城
- id: guji-蓱沙王-event-meet-buddha
  title_zh: 值佛住鹞山亲近供养
  type: career
  date: -0528
  year_of: -528
  description: 佛成道后住王舍国鹞山与五百比丘俱，王出入往来佛所，迎请供养，听受经法
  place_zh: 王舍鹞山
- id: guji-蓱沙王-event-attain-sotapanna
  title_zh: 闻法开解得须陀洹
  type: career
  date: '-0527'
  year_of: -527
  description: 常听佛说经，心疾开解，成就五愿之末，得须陀洹道，信敬益固
  place_zh: 王舍鹞山
- id: guji-蓱沙王-event-protect
  title_zh: 施竹林精舍护持僧团
  type: career
  date: '-0526'
  year_of: -526
  description: 施舍竹林以安僧众，使佛法久住王舍，国人咸得蒙益，终身护法不替
  place_zh: 王舍竹林
- id: guji-蓱沙王-event-letter
  title_zh: 遗书弗迦沙告以佛出世
  type: career
  date: '-0527'
  year_of: -527
  description: 受弗迦沙所遗千叶金色莲华，作书报言我国生一人华字佛，具三十二相，并具陈十二因缘教诫，劝其奉行
  place_zh: 王舍城
- id: guji-蓱沙王-event-fukasya-awaken
  title_zh: 弗迦沙闻讯弃国见佛
  type: career
  date: '-0527'
  year_of: -527
  description: 弗迦沙得书闻佛声欢喜踊跃，即夜起剃发作沙门，持髑髅应器至王舍窑家宿，佛为说六分经得阿那含，后为牛抵死生十六天得罗汉
  place_zh: 王舍城外窑家
- id: guji-蓱沙王-event-death
  title_zh: 王舍城崩逝
  type: death
  date: -0491
  year_of: -491
  description: 在位治国护法多年后崩逝，太子阿阇世继位，国运递变而护法之德传于后世
  place_zh: 王舍城
