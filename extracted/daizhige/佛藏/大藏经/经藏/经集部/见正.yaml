    highlight_event_id: guji-见正-event-awaken
  decisions:
  - date: -0480
    title_zh: 决意奉行三十七品要行
    rationale: 知肉眼眩惑不见往来，唯依四意止观等净行方能具见五道识神所堕
  - date: -0480
    title_zh: 决意坚固正法不休
    rationale: 既蒙佛解六系蔽隔碍之故，当勤学知身意事以灭除疑结
