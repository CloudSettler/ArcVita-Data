  - date: -0480
    title_zh: 决意直陈死无还报之疑
    rationale: 目见亲友死后无还面报者，故不信后世，愿冒愚痴之讥以求真解
  - date: -0480
    title_zh: 决意谛听佛说转徙之喻
    rationale: 佛豫知其心而先说树核成树之喻，知可依喻解生死变易之理
- id: guji-见正-endeavor-2
