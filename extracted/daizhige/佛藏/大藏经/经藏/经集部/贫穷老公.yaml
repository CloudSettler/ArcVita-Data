  place_zh: 舍卫国祇树给孤独园
  description_zh: 佛说前世悭贪致贫救命得寿之本源老公愿作沙门应时须发堕地法衣自然著耳目聪明入三昧门佛以偈颂其改悔
- id: guji-贫穷老公-event-death
