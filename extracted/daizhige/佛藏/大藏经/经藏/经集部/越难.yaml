  archetype: 豪富悭贪以财招苦型
  dilemmas:
  - 守巨富而畏人乞索是闭门拒施还是开门济众
  - 前身富而不施致后身盲乞是怨天尤人还是自识宿命改行布施
  lesson: 富贵无常悭贪招苦布施植福方能免于长夜苦报
  summary_first_person: 我本波罗奈私国四姓长者名越难家有珍宝牛马田宅而性悭贪不信道德日敕门监拒诸乞者寿尽转生本国盲乞妇家七岁行乞至子栴檀家被扑伤折臂蒙佛摩顶得开目识宿命方知富而不施如无有财世间无常唯法可依
  source_urls:
