  dilemmas:
  - title_zh: 人求宝行还是宝行求人
    description_zh: 世人皆求衣食七宝官爵国土，不知亦有珍宝诸欲行求索人，当以何为求
  - title_zh: 虚声大鼓还是实惠法鼓
    description_zh: 欲作大鼓声闻百里以扬德声，是尚枯木死皮之虚声，还是以开藏济贫成润泽四国之实声
  lesson: 行善有福行恶有殃如影随形，持戒覆济众生必获天福，法鼓不在皮木而在布施济众
  summary_first_person: 我前世为王念命无常，欲作大鼓闻于百里，得忠臣匡上以宝济贫供养道士，四方乏者襁负而来，我出巡见民比肩乃悟国安如身有病当以药救，遂恣民所求，寿终上生为天妙王复下为飞行皇帝今为天王太子，飞诣佛所问宝行求人之义，闻殃福如影随形而欢喜作礼而去
  source_urls:
  - https://cbeta.org/result/T596
  - https://daizhige.org/item/佛说天王太子辟罗经
