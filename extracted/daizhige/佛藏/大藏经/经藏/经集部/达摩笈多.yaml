  dilemmas:
  - 前译梵宋不融文辞杂糅致众疑惑，当重翻正本还是因循旧本
  - 梵本难得校勘未定，当急于传译还是待多本仇比揩定乃译
  lesson: 以多本仇校三覆乃书示译经当慎，以利物弘愿消灾致福护国安民
  summary_first_person: 我是南天竺三藏达摩笈多，隋时来华弘法，于东都洛水南上林园翻经馆与慧矩等重译药师如来本愿经，备陈十二大愿及净琉璃世界功德，愿众生闻名离苦帝祚遐永
