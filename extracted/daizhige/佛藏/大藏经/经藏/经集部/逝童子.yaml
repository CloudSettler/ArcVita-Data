  decisions:
  - date: -384
    title_zh: 以家中食分奉上世尊
    rationale: 见佛容貌端正诸根寂静光明照门心意安静故不忍空过愿尽所有供养
  - date: -384
    title_zh: 不愿富贵释梵但愿最智慧如佛无上
    rationale: 脆哉释梵皆为死法唯有一切智可安群生故舍人天直向佛道
