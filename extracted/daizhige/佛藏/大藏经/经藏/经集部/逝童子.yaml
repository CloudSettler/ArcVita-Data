    labels:
      zh: 立喻明渐
    start_date: -384
    highlight_event_id: guji-逝童子-event-debate
  - key: climax
    name: 设满天下火遍投不舍纵贼害常慈不废
    labels:
      zh: 坚誓不退
    start_date: -384
    highlight_event_id: guji-逝童子-event-debate
  - key: closure
    name: 蒙佛授记历十二亿劫修德后作须弥劫佛
    labels:
      zh: 蒙佛授记
    start_date: -384
    highlight_event_id: guji-逝童子-event-prophecy
  decisions:
  - date: -384
    title_zh: 以渐修义答帝释不舍一施之始
    rationale: 大树非一下斧可断太山木可渐尽求道亦由微积信精进必为世间将故不因难而退
  - date: -384
    title_zh: 立投火不舍贼害不废之誓独归一切智
    rationale: 释梵虽尊终归死法唯佛勇若师子能安群生故宁舍身命不舍佛意
