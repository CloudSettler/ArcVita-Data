  archetype: 西来译经僧
  dilemmas:
  - 梵本深广华言易失当如何不损平等实义而令华人得解
  - 世运迭变齐周隋兴替当以译经载道还是闭关自守以全戒行
  lesson: 于一切众生起平等救护无碍无毒之心即是一法速成无上道译弘即是行慈
  summary_first_person: 吾本北天竺乌苌人幼出家博通三藏观中土缘熟故西来至邺于王舍城耆阇崛山会上月光童子所问一法平等救护之旨深有所契遂于高齐敕命下译出月灯三昧经明诸法体性平等无戏论三昧愿此灯长照末世怖畏之时
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/月灯三昧经.html
  - https://tripitaka.cbeta.org/T0639
