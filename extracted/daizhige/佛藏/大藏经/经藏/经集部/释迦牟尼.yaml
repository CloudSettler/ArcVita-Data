    highlight_event_id: guji-释迦牟尼-event-preach-north
  decisions:
  - date: -0490-01-01
    title_zh: 开示闻名礼敬灭罪
    rationale: 众生罪重难修禅定，故以称名礼敬令易灭劫罪得不退转
  - date: -0485-01-01
    title_zh: 分说十方佛名普摄群机
    rationale: 十方众生根性各异，分方列名令随方闻名皆得往生净土见佛
