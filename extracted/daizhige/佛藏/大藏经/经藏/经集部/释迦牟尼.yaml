    title_zh: 所有财产知非常尽施与人
    rationale: 知财产非常故不爱惜，世世施与趣使安隐以成智慧庄严
  - date: -0590-01-01
    title_zh: 受毁辱忍之不报复
    rationale: 虽有筋力皆悉忍之，不作刀兵使人相害，故感地平荆棘自辟
- id: guji-释迦牟尼-endeavor-2
  title_zh: 耆阇崛山说前世功德
  summary: 应文殊师利请说菩萨前世五十因缘令众增功德
