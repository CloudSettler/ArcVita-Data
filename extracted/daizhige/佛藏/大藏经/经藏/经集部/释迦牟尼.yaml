    title_zh: 以慈身口意摄尽功德共回向
    rationale: 若不共众生回向则福有限故须以身礼供口赞叹意恭敬摄三世功德普施
  - date: -320
    title_zh: 以三空破回向执著
    rationale: 若住回向者回向法回向处则成凡夫法故须观过去空当来空现在空三处清净
