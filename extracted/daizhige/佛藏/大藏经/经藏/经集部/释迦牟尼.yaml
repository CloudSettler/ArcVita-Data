  decisions:
  - date: -0528
    title_zh: 志在小乘者为说四谛
    rationale: 随根机分别深义，先令知苦断习守身口意拔十二因缘根本
  - date: -0528
    title_zh: 以阴衰诸入为病疾相
    rationale: 明身本为患，贪色六衰为因，令众厌离生死求证灭道
- id: guji-释迦牟尼-endeavor-2
  title_zh: 开显大乘六度度脱十方
  summary: 奉六度无极四等四恩三十七道品为空无相愿大法药，合去来今佛为一法身，等心一切度脱十方
