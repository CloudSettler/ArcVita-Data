  name_zh: 释迦牟尼
  names:
    zh: 释迦牟尼
    en: Shakyamuni Buddha
  lifespan:
    birth:
      date: -0623-04-08
      precision: day
      is_circa: true
      raw: 约前六二三年四月初八生于迦毗罗卫
    death:
      date: -0543-02-15
      precision: day
      is_circa: true
      raw: 约前五四三年二月十五般涅槃于拘尸那揭罗
  birth_date: -0623-04-08
  death_date: -0543-02-15
  era: 东周春秋之际
  reign_ref: 周襄王至周敬王之际
  archetype: 菩萨行圆满之觉者
  dilemmas:
  - 珍奇重爱尽施与人还是悭惜积聚自用
  - 常受毁辱悉忍还是恃筋力报复
  - 为人说法不望报趣使安隐还是有所希望求报
  lesson: 累世舍施忍辱持戒护生然灯说法造福利他，故得三十二相八十种好端正无比，欲求佛者亦当如是行
  summary_first_person: 我前世为菩萨时世世以珍宝婇女香花饮食衣被施人，以好眼善意视世间人，忍毁辱不作刀兵，不说人恶，然灯解疑，治道造桥种树作井救毒愈病，持戒不犯事师父母，今在罗阅只耆阇崛山得庄严身，虚空可度须弥可称海水可量，我之功德不可称量
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E8%8F%A9%E8%90%A8%E8%A1%8C%E4%BA%94%E5%8D%81%E7%BC%98%E8%BA%AB%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E8%8F%A9%E8%90%A8%E8%A1%8C%E4%BA%94%E5%8D%81%E7%BC%98%E8%BA%AB%E7%BB%8F.html
