  dilemmas:
  - 自求泥洹安乐与普济五趣众生之间当以何为志
  - 在俗营生产业与出家修道解脱如何两全不相违背
  lesson: 立德不为己唯为十方施以大慈大悲普安众生方速逮成无上正真之道
  summary_first_person: 吾在舍卫祇园对给孤独等五百居士开演俗业三品财与出家声闻缘觉大乘三学欲令居家者修上财如醍醐出家者发大意行六度皆疾成无上正真
