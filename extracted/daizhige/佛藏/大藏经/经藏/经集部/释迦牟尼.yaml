    title_zh: 许说前世所作功德
    rationale: 善哉文殊发意问，听我说前世作功德使诸菩萨益增功德
  - date: -0588-06-15
    title_zh: 粗说少少功德劝众效行
    rationale: 无数世行用人故，人欲求佛作功德行亦当如是，至意念佛福无量
