    description: 欲界如幻梦色界必坏无色界亦不免死一切有为皆死得自在当超有为入无死涅槃处
  lesson: 深观十二因缘拔生死苦本以智慧度众生出生死海到涅槃岸
  summary_first_person: 吾为净饭王子见三界五道轮转受苦发大弘誓被精进铠出家观十二因缘执问老死生有取爱受断无明本成就一切种智为众生作大明证
