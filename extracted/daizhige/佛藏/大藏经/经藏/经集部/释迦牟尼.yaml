  decisions:
  - date: -0534-02-08
    title_zh: 逾城出家舍王位
    rationale: 见生老病死不可免，唯求道可解脱，故舍国荣出家访道
  - date: -0529-01-01
    title_zh: 舍苦行取中道
    rationale: 知枯身苦行非觉因，当调身以中道入定方能证悟
- id: guji-释迦牟尼-endeavor-2
  title_zh: 宣说十方千五百佛名
  summary: 为令众生闻名礼敬灭罪，说南方西南西方等十方各一百五十佛名及持名功德
  phases:
  - key: brewing
    name: 观察众生罪苦机缘
