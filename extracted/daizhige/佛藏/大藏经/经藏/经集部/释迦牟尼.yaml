    start_date: -0484
    highlight_event_id: guji-释迦牟尼-event-3
  decisions:
  - date: -0484
    title_zh: 同外道说以破取相
    rationale: 令增上慢比丘舍实想坚想悟幻性不实智
  - date: -0484
    title_zh: 以偈明无得无生
    rationale: 显无法可取舍令菩萨学无二幻化平等速得忍
