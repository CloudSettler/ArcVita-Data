  dilemmas:
  - 耕者欲礼佛又恋耕未竟当以何方便破其久习懈怠
  - 大众根机不等当以何示现令同发精进不退道心
  lesson: 莫以小务生懈怠失大法缘当勤精进耕无极福田
  summary_first_person: 我住罗阅祇竹园与大比丘众及菩萨俱游行欲往舍卫遥见耕者见我相好心生欢喜又以耕种未竟而自退悔我知其自维卫佛来九十一劫每见佛辄言且待后时遂过六佛不得度今复懈怠故微笑放五色光安众生心为阿难说其本末待其悔过来礼即为说懈怠之垢精进之利令立不退转亦令无央数天龙发无上道意
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E7%BB%8F%E9%9B%86%E9%83%A8/%E4%BD%9B%E8%AF%B4%E6%87%88%E6%80%A0%E8%80%95%E8%80%85%E7%BB%8F.html
