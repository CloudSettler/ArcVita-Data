  - key: climax
    name: 合三世佛为一法身
    labels:
      zh: 一法身显
    start_date: -0528
    highlight_event_id: guji-释迦牟尼-event-attainment
  - key: closure
    name: 以大慈悲度脱十方
    labels:
      zh: 普度十方
    start_date: '-0527'
    highlight_event_id: guji-释迦牟尼-event-attainment
  decisions:
  - date: -0528
    title_zh: 不为取证常济危厄
    rationale: 空无相愿而不取证，具六通善权，等心一切无所适莫故号菩萨
  - date: -0528
    title_zh: 以诸度无极为大法药
    rationale: 阴衰牵连为病，虚空日光须弥为喻，疗众生病令罪灭苦除逮不退转
