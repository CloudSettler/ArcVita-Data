- id: guji-释迦牟尼-event-2
  title_zh: 开示法身如来藏不增不减
  date: -483
  year_of: -483
  location: 王舍城耆阇崛山
  description: 说第一义即众生界即如来藏即法身常恒清凉不变具恒沙功德历众生菩萨如来无别并说本际相应清净等三法真实如
