  dilemmas:
  - 太子尊荣与睹生老病死大苦欲求解脱之冲突
  - 六年苦行无获与舍苦行取中道之抉择
  - 入寂涅槃与住世说法利乐众生之抉择
  lesson: 以慈悲智慧觉悟众生，令闻佛名信乐礼敬者灭无量劫生死之罪得不退转
  summary_first_person: 吾睹众生轮转生死受苦，故舍王位出家成道，为说十方千五百佛名，令闻名信乐礼敬者灭罪无量，得见十方佛，不退转于菩提。
