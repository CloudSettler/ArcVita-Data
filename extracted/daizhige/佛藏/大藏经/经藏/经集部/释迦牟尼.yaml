endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 开演俗家上中下三品财业
  summary: 应给孤独请问居处治家之法分别下财悭吝不施中财孝养而无后世信上财自安安彼广行布施劝修上财如醍醐最妙
  phases:
  - key: brewing
    name: 给孤独率五百居士诣祇园请问
    labels:
      zh: 请问俗业
    start_date: -522-01-10
    highlight_event_id: guji-释迦牟尼-event-1
  - key: breakthrough
    name: 呵下财守惜如蜂爱蜜示中财孝养局限
    labels:
      zh: 分别下中财
    start_date: -522-02-10
    highlight_event_id: guji-释迦牟尼-event-1
  - key: climax
    name: 赞上财自衣食孝父母施贫乏化痴冥如醍醐
    labels:
      zh: 宣说上财
    start_date: -522-03-10
    highlight_event_id: guji-释迦牟尼-event-1
  - key: closure
    name: 付嘱以善方便自安护彼一切众生
    labels:
      zh: 付嘱流通
    start_date: -522-04-10
    highlight_event_id: guji-释迦牟尼-event-1
  decisions:
  - date: -522-02-10
    title_zh: 以三品分别对治悭贪
    rationale: 因居士贪慕身地不解非常故先示下中之失令知惭愧方受上财正行
  - date: -522-03-10
    title_zh: 以醍醐为喻显上财最尊
    rationale: 欲令在俗者不舍衣食孝养而能普哀十方故以刍出醍醐喻自安安他速逮成佛
- id: guji-释迦牟尼-endeavor-2
  title_zh: 分别声闻缘觉大乘三学导归大乘
  summary: 应问出家修道行异同呵声闻但求自济缘觉著相悕望赞大乘发无上意行六度四等慈悲喜护广说化众七事卒以大臣三友为喻
  phases:
  - key: brewing
    name: 开示声闻畏苦厌身但求自安
    labels:
      zh: 说声闻学
    start_date: -522-05-10
    highlight_event_id: guji-释迦牟尼-event-2
  - key: breakthrough
    name: 破缘觉著佛身相悕望大道不了幻化
    labels:
      zh: 说缘觉失
    start_date: -522-06-10
    highlight_event_id: guji-释迦牟尼-event-2
  - key: climax
    name: 赞大乘发无上意行六度四等慈悲喜护
    labels:
      zh: 显大乘正行
    start_date: -522-07-10
    highlight_event_id: guji-释迦牟尼-event-2
  - key: closure
    name: 说大臣三友喻付嘱阿难给孤独奉行
    labels:
      zh: 设喻流通
    start_date: -522-08-10
    highlight_event_id: guji-释迦牟尼-event-2
  decisions:
  - date: -522-06-10
    title_zh: 开三乘为假引方便本无有三
    rationale: 因学者心有远近解有深浅故暂示三乘以引之终欲悉令至大乘无上道
  - date: -522-07-10
    title_zh: 以无所悕望摄六度四等
    rationale: 若有所悕望则如虚空界功德不得至佛故令解空无想无愿普度而不著
