endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 历劫值佛发愿供养成觉
  summary: 初值六十俱胝佛至德佛无能胜佛等，发大誓愿持梵行恭敬供养，以七宝建塔以宝华散供，历无数劫圆满菩提。
  phases:
  - key: brewing
    name: 初值六十俱胝佛发愿持行
    labels:
      zh:
      - 发愿
      - 持梵行
    start_date: -6000-01-01
    highlight_event_id: guji-释迦牟尼-event-past-vow
  - key: breakthrough
    name: 为转轮圣王供养无能胜佛建塔
    labels:
      zh:
      - 供养
      - 建塔
    start_date: -5000-01-01
    highlight_event_id: guji-释迦牟尼-event-past-vow
  - key: climax
    name: 以七宝华遍散供养诸佛
    labels:
      zh:
      - 散华供养
      - 广种福因
    start_date: -2000-01-01
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: closure
    name: 经历无数劫得证菩提
    labels:
      zh:
      - 圆满
      - 成佛
    start_date: -528-12-08
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  decisions:
  - date: -5000-01-01
    title_zh: 于德佛无能胜佛前同声闻发愿供养
    rationale: 以恭敬供养多种善根历多岁不退，为后成佛远因
  - date: -528-12-08
    title_zh: 以过去散华供养功德决意菩提树下证觉
    rationale: 过去诸佛皆从发心至成觉历无数劫，今因缘熟当证无上菩提
- id: guji-释迦牟尼-endeavor-2
  title_zh: 鹫峰开示诸佛本起破疑
  summary: 因目连问色究竟天百千劫一佛之语，开示过去值无量诸佛本事，令除疑生信，知佛出世劫数不可算计。
  phases:
  - key: brewing
    name: 目连问色究竟天佛出世时
    labels:
      zh:
      - 问疑
      - 天见狭少
    start_date: -525-01-01
    highlight_event_id: guji-释迦牟尼-event-sermon
  - key: breakthrough
    name: 佛言天主少知少见非正言
    labels:
      zh:
      - 破邪
      - 显正
    start_date: -525-01-01
    highlight_event_id: guji-释迦牟尼-event-sermon
  - key: climax
    name: 广说过去值无量诸佛名号本起
    labels:
      zh:
      - 说本起
      - 列佛名
    start_date: -525-01-01
    highlight_event_id: guji-释迦牟尼-event-sermon
  - key: closure
    name: 目连疑除欢喜礼退
    labels:
      zh:
      - 断疑
      - 欢喜信受
    start_date: -525-01-01
    highlight_event_id: guji-释迦牟尼-event-sermon
  decisions:
  - date: -525-01-01
    title_zh: 决意为目连广说过去诸佛成觉劫数
    rationale: 若不破百千劫一佛之狭见，行者将疑佛道难值，故以本生证不可算计之劫
  - date: -525-01-01
    title_zh: 以散华供养诸佛后方成觉为证
    rationale: 令知成佛须经长时发愿供养，不可以少缘小劫量度
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼诞生
  date: -563-04-08
  year_of: -563
  is_circa: true
  description: 约公元前五六三年四月初八诞生于蓝毗尼园，为净饭王太子，名悉达多。
- id: guji-释迦牟尼-event-past-vow
  title_zh: 过去世为百号王供养无能胜佛建塔
  date: -5000-01-01
  year_of: -5000
  is_circa: true
  description: 德佛灭后值无能胜佛，时为转轮圣王名百号，与声闻同发愿供养多年，佛灭后以七宝建塔供养舍利，修行经无量时。
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 菩提树下得证正觉
  date: -528-12-08
  year_of: -528
  is_circa: true
  description: 以过去值六十俱胝佛及妙华正梵燃灯等无量佛散华供养功德圆满，于菩提树下证无上菩提。
- id: guji-释迦牟尼-event-sermon
  title_zh: 鹫峰山说诸佛经破疑
  date: -525-01-01
  year_of: -525
  is_circa: true
  description: 在王舍城鹫峰山中，为大目乾连开示过去诸佛次第出世名号，破色究竟天满百千劫一佛出世之少见，令疑心即除。
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那罗入灭
  date: -483-02-15
  year_of: -483
  is_circa: true
  description: 约公元前四八三年于拘尸那罗娑罗林入般涅槃，住世利生或久或近随缘示灭。
