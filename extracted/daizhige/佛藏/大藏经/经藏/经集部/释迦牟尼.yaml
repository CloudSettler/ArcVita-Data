  dilemmas:
  - 众生执众生界增减起大邪见堕恶趣与如实说深法难解之间两难
  - 直说第一义众生界即法身或被误为断灭与曲顺凡夫或失真义之间两难
  lesson: 离增减二见了知众生界即如来藏法身不增不减方住正道
  summary_first_person: 我住王舍城耆阇崛山中因舍利弗请问众生海有增减否而说不增不减经破断灭始生诸邪见开示众生界即如来藏即法身常恒清凉不变劝离二见住正道
