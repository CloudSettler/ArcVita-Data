endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 王舍城破增减邪见救众生出险难
  description: 因舍利弗请问众生聚增减开示见增减为大邪见大险难辨减见所生三见二见六见及增见所生二见皆如罗网令离冥闇
  phases:
  - key: brewing
    name: 舍利弗请问众生海增减
    labels:
      zh: 请问缘起
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-1
  - key: breakthrough
    name: 正告增减为大邪见大险难
    labels:
      zh: 呵邪显正
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-1
  - key: climax
    name: 广辨增减所生罗网诸见
    labels:
      zh: 破网除执
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-1
  - key: closure
    name: 诫离二见住正道化众生
    labels:
      zh: 嘱累弘化
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-1
  decisions:
  - date: -483
    title_zh: 直指增减见为盲无目邪道
    rationale: 为令天人众生免长夜堕恶趣永失安乐故须先破根本
  - date: -483
    title_zh: 预记灭后五百岁后假沙门起增减见
    rationale: 因依不了义经无慧眼远离空见故须早诫后学莫依文执义
- id: guji-释迦牟尼-endeavor-2
  title_zh: 开显法身如来藏安立不增不减
  description: 说第一义即众生界即如来藏即法身具恒沙功德常恒清凉不变历众生菩萨如来三位无别明三法真实如不异
  phases:
  - key: brewing
    name: 明一界为佛智境界难测
    labels:
      zh: 显深难测
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-2
  - key: breakthrough
    name: 说众生界即如来藏即法身
    labels:
      zh: 立宗显体
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-2
  - key: climax
    name: 喻灯明摩尼及历三位无别
    labels:
      zh: 喻显融通
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-2
  - key: closure
    name: 说三法真实如及远离二见得正道
    labels:
      zh: 会归正道
    start_date: -483
    highlight_event_id: guji-释迦牟尼-event-2
  decisions:
  - date: -483
    title_zh: 以灯及摩尼喻法身不离功德
    rationale: 为令声闻缘觉凡夫仰信不离不脱不断不异深义故方便立喻
  - date: -483
    title_zh: 判一阐提起二见非我弟子
    rationale: 为断众生从冥入冥因缘护正法久住故须严呵责
