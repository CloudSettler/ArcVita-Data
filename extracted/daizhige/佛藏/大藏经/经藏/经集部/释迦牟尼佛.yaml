    start_date: -483-01-02
    highlight_event_id: guji-释迦牟尼佛-event-hundred-samadhi
  - key: climax
    name: 明金刚不坏不灭成菩提
    labels:
      zh: 点出金刚
    start_date: -483-01-03
    highlight_event_id: guji-释迦牟尼佛-event-vajra
  decisions:
  - date: -483-01-02
    title_zh: 以月盈喻说十地渐圆
    rationale: 为令初学不惊渐次以初月至满月喻初地至十地淡泊不动住首楞严
  - date: -483-01-02
    title_zh: 先立首楞严后开百三昧海
    rationale: 百门如珠光相照皆归首楞严海令智慧如空日烦恼如微烟自除
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 举往昔宝华佛事付嘱受持流通
  summary: 引九十一劫前宝华佛说百三昧门千比丘随喜成贤劫千佛之缘劝未来闻法随喜受持读诵书写供养并敕阿难勿忘
  phases:
  - key: brewing
    name: 述过去千比丘随喜获益
    labels:
      zh: 引昔证今
    start_date: -483-01-03
    highlight_event_id: guji-释迦牟尼佛-event-hundred-samadhi
  - key: closure
    name: 立经名敕阿难流通
    labels:
      zh: 付嘱流通
    start_date: -483-01-04
    highlight_event_id: guji-释迦牟尼佛-event-entrust
  decisions:
  - date: -483-01-03
    title_zh: 以随喜不谤许生兜率值弥勒
    rationale: 为摄未来钝根不断善根但闻法随喜即免三涂终值佛菩萨
  - date: -483-01-04
    title_zh: 立三名显不坏不灭宗要
    rationale: 以百三昧海不坏不灭与金刚相寂灭不动总摄全经令奉持不失
