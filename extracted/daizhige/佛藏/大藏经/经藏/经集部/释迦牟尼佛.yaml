  era: 先秦
  reign_ref: 周昭王至周穆王
  archetype: 觉者导师
  dilemmas:
  - 王位安乐与生老病死大苦如何抉择
  - 苦行压抑与中道觉悟如何取舍
  lesson: 见苦而求解脱，自觉已复能觉他，方为大丈夫行
  summary_first_person: 我本释迦族太子，观生老病死苦而舍王位出家，六年苦行而悟中道，于菩提树下成正觉，为喜王菩萨等说贤劫千佛名号功德，令众生归依忏悔离苦，我今涅槃而法住世间。
