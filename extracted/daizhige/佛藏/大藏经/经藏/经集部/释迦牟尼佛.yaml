  date: -483-01-02
  place_zh: 毗耶离重阁讲堂
  description: 应弥勒问以月喻十地说住首楞严修性空王乃至受法王印百三昧门弥勒得百法明门众得首楞严
- id: guji-释迦牟尼佛-event-vajra
