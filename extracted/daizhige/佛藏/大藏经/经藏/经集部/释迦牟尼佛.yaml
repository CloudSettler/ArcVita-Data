endeavors:
- id: guji-释迦牟尼佛-endeavor-1
  title_zh: 出家求道证菩提
  summary_zh: 舍王位出家，历苦行悟中道，于菩提树下成正觉
  phases:
  - key: brewing
    name: 王宫观苦萌出离心
    labels:
      zh: 观苦出家
    start_date: -534-01-01
    highlight_event_id: guji-释迦牟尼佛-event-renunciation
  - key: breakthrough
    name: 雪山苦行参究解脱
    labels:
      zh: 苦行参究
    start_date: -529-01-01
    highlight_event_id: guji-释迦牟尼佛-event-renunciation
  - key: climax
    name: 菩提树下悟正觉
    labels:
      zh: 悟道成佛
    start_date: -528-12-08
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: closure
    name: 初转法轮立僧团
    labels:
      zh: 初转法轮
    start_date: -527-06-01
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  decisions:
  - date: -534-02-08
    title_zh: 逾城出家
    rationale: 见生老病死不可免，王位安乐不能敌无常，故舍亲割爱而求出世道
  - date: -529-05-01
    title_zh: 舍苦行取中道
    rationale: 知苦行压身非解脱因，调身调心不紧不缓方能悟道，故受乳糜而取中道
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 宣说贤劫千佛弘法
  summary_zh: 为喜王菩萨说贤劫千佛名号，教众生忏悔业障护持正法
  phases:
  - key: brewing
    name: 会众请问千佛名
    labels:
      zh: 请法因缘
    start_date: -528-01-01
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: breakthrough
    name: 以偈宣说拘那提等百佛
    labels:
      zh: 说佛名号
    start_date: -527-03-01
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: climax
    name: 广说千佛令众忏悔
    labels:
      zh: 教令忏悔
    start_date: -526-01-01
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: closure
    name: 付嘱护法令久住
    labels:
      zh: 护法久住
    start_date: -484-01-01
    highlight_event_id: guji-释迦牟尼佛-event-death
  decisions:
  - date: -527-03-01
    title_zh: 应喜王请说诸佛名
    rationale: 为饶益天人安隐世间，为护佛法令得久住，为令菩萨心不疲懈，故说贤劫诸佛名号
  - date: -526-01-01
    title_zh: 制忏悔法除业障
    rationale: 知众生积恶如恒沙，杀盗淫妄障圣道，唯至诚归依忏悔方能净心，故制六根忏悔法门
