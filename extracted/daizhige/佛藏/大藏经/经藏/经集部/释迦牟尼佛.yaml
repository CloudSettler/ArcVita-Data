    title_zh: 立如法乞白衣净食
    rationale: 著衣持钵具四威仪如法往造方为真比丘福报如影响故
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 说饿鬼比丘本末立护净斋会法
  summary: 引新得阿罗汉夜厕遇饿鬼比丘事说昔以不净手触僧净器净食及以不净食食众僧致五百世饿鬼厕神铁杖遮护之苦立净手作食持斋受食不得挟残先尝之制
