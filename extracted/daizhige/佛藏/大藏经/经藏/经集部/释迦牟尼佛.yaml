  date: -483-01-03
  place_zh: 毗耶离重阁讲堂
  description: 说金刚轮喻海味金刚山不动火珠破闇师子吼伏兽剑入山无迹不住不起不灭不坏成无上菩提游寂灭海
- id: guji-释迦牟尼佛-event-entrust
  title_zh: 引宝华佛缘立经名敕阿难流通
  date: -483-01-04
  place_zh: 毗耶离重阁讲堂
  description: 说九十一劫宝华佛时千比丘随喜成贤劫千佛劝受持读诵书写供养生兜率值弥勒立名百三昧海不坏不灭等敕阿难受持
- id: guji-释迦牟尼佛-event-death
  title_zh: 入灭于拘尸那罗娑罗林
  date: -483-02-15
  place_zh: 拘尸那罗
  description: 化缘既毕于拘尸那罗城外入般涅槃众生奉舍利建塔供养
