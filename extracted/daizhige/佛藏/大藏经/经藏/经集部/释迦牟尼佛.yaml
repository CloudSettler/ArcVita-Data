  summary_first_person: 吾与阿难行见广深各四十里粪池中黑虫如科蚪知是十方僧众食不净食所堕当历粪池饿狗猪豚蜣螂贫穷之苦复见昔触僧净食之比丘堕厕边饿鬼五百余年不见浆水故诫后世比丘及檀越当以净手作食如法持斋乞食不得挟残先尝令诸天欢喜福报无量
