    title_zh: 诫一切不得触僧净食
    rationale: 以不净手触净器净食及以不净著净中皆招饿鬼猪狗蜣螂累劫之苦故
  - date: -489-06-17
    title_zh: 立持斋受食挟残先尝重戒
    rationale: 信施难销持斋一日得六十万世余粮犯者堕饿鬼挟热铁轮故当如法作斋令天神拥护
