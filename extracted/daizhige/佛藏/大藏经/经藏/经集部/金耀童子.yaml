  place_zh: 舍卫国婆罗门舍宅
  description: 初生心意安泰诸识明利，庭生莲华满室天香，瞻卜华树处处出生执天紫金色华，金盘盛天食百千万种无尽，口出音声念佛及阿罗汉。
