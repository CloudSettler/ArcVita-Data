  description: 路逢婆罗门呵责往见沙门，以得宝持归得吉祥迎面为喻对答毕，便往祇树礼佛足坐听本生法。
- id: guji-金耀童子-event-offer
  title_zh: 祇树园献莲华瞻卜华及金盘天食供养
  date: -0485
  year_of: -485
  place_zh: 祇树给孤独园
  description: 思惟即生天妙莲华瞻卜华散佛身上住顶怀足下成华鬘衣，虚空现金宝铃铎，随念现金盘天食亲自供佛僧王众皆得饱满。
- id: guji-金耀童子-event-vow
  title_zh: 发无上菩提心蒙记金曜如来并闻前世因缘
  date: -0485
  year_of: -485
  place_zh: 祇树给孤独园
  description: 欢喜礼足发阿耨多罗三藐三菩提心立广度誓愿，佛放四色光照地狱诸天说法，记经三大阿僧祇劫修六波罗蜜成金曜如来，说前世为贫人供吉祥密缘觉得今报。
- id: guji-金耀童子-event-death
