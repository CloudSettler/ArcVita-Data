  summary_first_person: 我是舍卫婆罗门家金耀童子，生时心意安泰，庭生莲华满室天香，瞻卜树生紫金色华，金盘盛天食无尽，口常念佛。我见佛即归依礼足，后诣祇树以莲华瞻卜华严佛，以金盘设斋供佛僧王众，发愿救度未度安乐未安乐者后方成佛，蒙记经三大阿僧祇劫成金曜如来，前世我为贫人以庵没罗果净地莲华伞盖供养吉祥密缘觉故得今报。
