  date: -0500-01-01
  year_of: -500
  place: 王舍城日照商主舍
  description: 帝释劝归依感天子托阴，八九月后生一童子，身有金色光艳赫，金衣覆体，雨妙衣现瑞，立名金色童子
- id: guji-金色童子-event-hear-verse
  title_zh: 竹林精舍闻无常偈
  date: -0484-06-01
  year_of: -484
  place: 竹林精舍
  description: 闻苾刍诵昼夜迅流寿命减少之偈，于生死极生厌离，欣乐涅槃，于佛法益生净信
- id: guji-金色童子-event-request-ordination
  title_zh: 归家白母求出家
  date: -0484-07-01
