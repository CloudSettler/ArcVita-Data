  summary_first_person: 我本忉利天子，慕佛出世庄严，托生王舍日照家，金身覆体众人瞻。我闻无常偈而厌生死，欲出家而孝奉母命，游园守戒不染欲染，虽蒙杀害疑谤而不失正信，终以因缘显明而趣解脱
