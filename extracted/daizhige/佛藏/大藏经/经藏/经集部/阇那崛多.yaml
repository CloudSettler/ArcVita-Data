  - 声闻独觉与无上菩提三乘差别如何会归一乘
  lesson: 自发菩提心复教他发心自利利他方为最胜大利速证无上道
  summary_first_person: 吾本北印度犍陀罗人，少习三藏远涉流沙而来东夏，蒙隋主敬礼于长安大兴善寺译经弘化，译出出生菩提心经一卷，具说迦叶婆罗门梦莲华月轮之瑞，三种菩提、四摄、天梵圣行及破魔陀罗尼，劝勉众生发阿耨多罗三藐三菩提心，愿此经母流布末世利益天人。
