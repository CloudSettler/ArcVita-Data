  decisions:
  - date: -0483
    title_zh: 见法即归依受持
    rationale: 度诸狐疑不由他知，于正法律得无畏，即合掌归依佛法僧尽寿为优婆塞
  - date: -0483
    title_zh: 辞佛而去不恋住
    rationale: 闻法欢喜随喜作礼而去，虽不久遇难而诸根清净，以次法向般涅槃
