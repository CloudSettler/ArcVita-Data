    start_date: -0483
    highlight_event_id: guji-阿支罗迦叶-event-ask
  - key: climax
    name: 四句皆蒙无记
    labels:
      zh: 遮边
    start_date: -0483
    highlight_event_id: guji-阿支罗迦叶-event-ask
  - key: closure
    name: 转问有苦无苦
    labels:
      zh: 转机
    start_date: -0483
    highlight_event_id: guji-阿支罗迦叶-event-ask
  decisions:
  - date: -0483
    title_zh: 道中趋佛求答
    rationale: 遥见世尊即诣佛所，虽闻今非论时仍三请说法，不以留难为退
  - date: -0483
    title_zh: 舍边见请说有苦
    rationale: 闻四句无记不滞戏论，转请世尊说有此苦令知苦见苦
- id: guji-阿支罗迦叶-endeavor-2
  person_qid: guji-阿支罗迦叶
  title_zh: 闻缘起证果般涅槃
  summary: 蒙佛说离边中道缘起法，得法眼净归依三宝为优婆塞，辞去不久为护犊牛触杀，命终根净色白，蒙佛授第一记已般涅槃。
