  dilemmas:
  - title_zh: 苦自作耶他作耶
    description: 执自作他作自他作无因作四边皆堕戏论，佛皆答为无记
  - title_zh: 有苦耶无苦耶
    description: 若言无苦则拨无因果，若不闻中道则狐疑不断，不知归依
  lesson: 离自他有无四边戏论，观此有故彼有之缘起中道，方能见苦断集证灭
  summary_first_person: 我是阿支罗迦叶，为小事出王舍城向耆阇崛山，道中遇世尊入城乞食，三问苦自作他作自他作无因作，蒙佛教以无记遮边，复闻缘起中道远尘离垢得法眼净，归依三宝为优婆塞，辞去不久即命终，蒙佛授记般涅槃。
