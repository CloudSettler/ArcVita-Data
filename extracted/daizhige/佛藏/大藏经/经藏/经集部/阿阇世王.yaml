    title_zh: 囚禁频婆娑罗王自立
    rationale: 信恶友言贪求王位速得自在，不顾父子亲情与罪报。
  - date: -0486
    title_zh: 筑建华氏城备战跋祇
    rationale: 为防强邻报复扩张国土，欲以坚城利兵巩固摩揭陀霸权。
