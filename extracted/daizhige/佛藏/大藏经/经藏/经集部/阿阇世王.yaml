  decisions:
  - date: -0489
    title_zh: 决意亲往见佛陈罪忏悔
    rationale: 知唯世尊能解重罪忧怖，愿发露前愆求哀救护以安身心。
  - date: -0483
    title_zh: 护持七叶窟首次结集
    rationale: 为报佛恩令正法久住，以国力供养僧众助阿难等结集经律。
events:
- id: guji-阿阇世王-event-birth
  date: -0492
  year_of: -492
  title_zh: 降生于王舍城王宫
  description: 频婆娑罗王之子，生而具王相，为摩揭陀太子。
- id: guji-阿阇世王-event-accession
  date: -0491
  year_of: -491
  title_zh: 囚禁父王而即位
  description: 受提婆达多教唆，囚禁频婆娑罗王，自立为摩揭陀国王，终致父王命终。
- id: guji-阿阇世王-event-repentance
  date: -0489
  year_of: -489
  title_zh: 耆阇崛山见佛忏悔
  description: 率众亲往见释迦文佛，闻阿阇世王经等法，发露弑父之罪，归依三宝得安慰。
- id: guji-阿阇世王-event-patronage
  date: -0483
  year_of: -483
  title_zh: 护持王舍城七叶窟结集
  description: 佛般涅槃后，以国力护持大迦叶等五百比丘结集经律，令正法久住。
- id: guji-阿阇世王-event-death
  date: '-0460'
  year_of: -460
  title_zh: 在位三十二年后逝世
  description: 晚年勤修善业护持正法，寿终于华氏城，王位传于子优陀夷。
