  summary_first_person: 我是阿难世尊随侍晨朝著衣持钵入王舍城乞食见新作重阁大舍严丽便念布施僧舍与佛灭后起塔造像何者功德多还至耆阇崛山头面礼佛具白所见以问世尊蒙佛广说四天下及帝释庄严殿施僧不及芥子舍利塔像之喻又蒙嘱付受持未曾有法广为天人分别演说我今欢喜受教流通
