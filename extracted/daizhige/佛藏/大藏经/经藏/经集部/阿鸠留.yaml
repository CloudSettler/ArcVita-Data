    labels:
      zh: 生忉利天
    start_date: -0500-01-01
    highlight_event_id: guji-阿鸠留-event-death
  decisions:
  - date: -0549-01-01
    title_zh: 散金银恣人取索不逆人意
    rationale: 眼见薜荔随喜得神手出物，深信作善得善，故以财布施贫穷衣被饮食，广种福田
  - date: -0549-06-01
    title_zh: 日日饭八万四千道人
    rationale: 欲学薜荔嘱托咒愿得福早脱苦处，以大众供养培植天福，誓不复悭吝
events:
- id: guji-阿鸠留-event-birth
  type: birth
  title_zh: 富家生为贾客阿鸠留
  date: -0600-01-01
  year_of: -600
  place_zh: 古印度
  description: 生于富豪之家，蓄金银珍宝奴婢众多，为众贾客中最尊豪者，初不信有后世
- id: guji-阿鸠留-event-desert
  type: career
  title_zh: 荒泽遇豪薜荔得水食珍宝
  date: -0550-06-01
  year_of: -550
  place_zh: 商道荒泽青树下
  description: 与五百贾客行经无水草处绝粮，遇树下豪薜荔举右手出泉水美食及金银琉璃等宝，救活人畜，闻其前世随喜迦叶佛塔功德而得神通，始信后世因果
- id: guji-阿鸠留-event-charity
  type: career
  title_zh: 归乡普施日饭八万四千道人
  date: -0549-01-01
  year_of: -549
  place_zh: 本乡里
  description: 归乡告国中人恣取金银珍宝衣被饮食，布施无央数，日日供饭八万四千道人，澜汗流出门可擿船而行
- id: guji-阿鸠留-event-death
  type: death
  title_zh: 卒后上生忉利天见佛
  date: -0500-01-01
  year_of: -500
  place_zh: 第二忉利天
  description: 作善极意死后上第二忉利天，去离天帝座四百八十里，佛为母天上说法时遥呼相见，自陈布施所得，礼佛而去
