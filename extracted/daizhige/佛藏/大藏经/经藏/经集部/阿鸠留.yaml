    highlight_event_id: guji-阿鸠留-event-charity
  - key: climax
    name: 日饭众道
    labels:
      zh: 大设供养
    start_date: -0549-06-01
    highlight_event_id: guji-阿鸠留-event-charity
  - key: closure
