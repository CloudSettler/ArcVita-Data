  decisions:
  - date: -0550-06-01
    title_zh: 遣骑四求水草并独往趣青树
    rationale: 粮水俱尽人畜将死，见远树叶青果盛，料树下必有水，故亲往求救
  - date: -0550-06-02
    title_zh: 驰还呼伴同受薜荔施食
    rationale: 独得饱食不忍伴众饿死，闻薜荔许普饱众人，故引五百人畜同往受施
- id: guji-阿鸠留-endeavor-2
  title_zh: 归乡大施生忉利天
  description: 既信后世善恶有报，归乡以所得金银普施贫穷，恣人求索，日饭八万四千道人，死后上生第二忉利天，复于天上见佛闻法
  phases:
  - key: brewing
