  dilemmas:
  - 不信后世无善恶报与亲见薜荔神通之间的信仰动摇
  - 独享珍宝富贵与普施贫穷道人求福之间的抉择
  lesson: 随喜善事手沾福分，布施济众必得善报，当信后世因果不虚
  summary_first_person: 我是阿鸠留，本为富豪贾客，不信后世，谓善恶无报，率五百人商行荒泽绝水粮，蒙树下豪薜荔以手出水食珍宝得活，自此深信因果，归乡普施贫穷，日饭八万四千道人，死后得生第二忉利天上
  source_urls:
