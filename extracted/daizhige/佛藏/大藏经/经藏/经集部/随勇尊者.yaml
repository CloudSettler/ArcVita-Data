  lesson: 不取眼耳乃至识蕴为我我所则身毒不能乱心生死不能系缚
  summary_first_person: 我名随勇独住王舍城侧尸陀林蛇聚孤峰僧坊独行梵行忽被毒蛇所噬肤体溃坏我不取著眼耳乃至色受想行识为我我所故面及诸根无有异相临舍寿时喜心舍报如弃毒器如出火宅
