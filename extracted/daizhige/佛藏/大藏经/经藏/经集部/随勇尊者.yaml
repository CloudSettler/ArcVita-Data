    title_zh: 请置我于僧坊之外
    rationale: 无令延毒流散污染僧坊护持大众清净以慈护他
  - date: '-0500'
    title_zh: 直陈无我无异相之理
    rationale: 已断我见我慢及取著根本如破多罗心不复生故临终喜心如重病得差
