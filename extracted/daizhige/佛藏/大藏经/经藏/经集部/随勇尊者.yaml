  description: 舍利子置随勇于僧坊外僵仆于地说道智者行梵行临舍寿喜心如弃毒器出火宅之偈已往诣佛所具陈上事佛说持国广目行慈及无足二足多足行慈伽陀与破贪嗔痴三毒真实力偈并说大明章句叹若早闻则蛇毒不能入
