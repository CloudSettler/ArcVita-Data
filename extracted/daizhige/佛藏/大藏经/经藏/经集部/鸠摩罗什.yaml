person:
  qid: guji-鸠摩罗什
  name_zh: 鸠摩罗什
  names:
    zh: 鸠摩罗什
    en: Kumarajiva
  lifespan:
    birth:
      date: '0344'
      precision: year
      is_circa: true
      raw: 约公元三四四年诞生于龟兹
    death:
      date: '0413'
      precision: year
      is_circa: false
      raw: 弘始十五年圆寂于长安
  birth_date: '0344'
  death_date: '0413'
  era: 十六国姚秦
  reign_ref: 姚兴弘始
  archetype: 译经宗师
  dilemmas:
  - 身陷凉州十七年不得东进弘法与安住随缘化众之难
  - 奉诏译经传禅须直说道教与调伏淫嗔睡掉疑五盖之难
  lesson: 欲入禅定当先净戒除五盖，以不净慈心为方便，由初禅次第深入至四禅不动处乃至涅槃
  summary_first_person: 吾生于龟兹，幼出家先习小乘后弘大乘，流滞凉州十七载，后入长安逍遥园译经传法，译出禅法要解，开示不净观除淫欲五盖次第入四禅及四无量心，愿众生离欲得乐同证实智
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/经集部/禅法要解.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/经藏/经集部/禅法要解.md
