    title_zh: 舍小乘转弘大乘
    rationale: 见中观般若深契实相，为利众生广行菩萨道故不滞小果
  - date: 0384
    title_zh: 留凉不抗安住弘化
    rationale: 时运未至强进无益，不如韬光养晦保存法种待姚兴迎请
- id: guji-鸠摩罗什-endeavor-2
  title_zh: 长安逍遥园译经传禅
  summary: 弘始三年迎入长安，居逍遥园率义学僧共译众经，译出禅法要解，详示不净观五盖对治及四禅四无量次第
  phases:
  - key: brewing
    name: 迎入长安集众译场
