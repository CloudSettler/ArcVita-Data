  type: achievement
  date: 0384
  year_of: 384
  location: 凉州
  description: 苻坚遣吕光迎吾东来，吕光战乱滞留凉州，吾随缘安住弘化不废
- id: guji-鸠摩罗什-event-changan
  title_zh: 姚兴迎入长安居逍遥园
  type: achievement
  date: '0401'
  year_of: 401
  location: 长安逍遥园
  description: 姚兴弘始三年遣使迎请，入长安为国师，集八百义学僧立译场开译众经
- id: guji-鸠摩罗什-event-yijing
  title_zh: 译出禅法要解示不净四禅次第
  type: achievement
  date: '0402'
  year_of: 402
  location: 长安逍遥园
  description: 于逍遥园译出禅法要解，示淫欲多者观不净，呵五盖离欲得初禅，乃至舍念清净入四禅修四无量心
- id: guji-鸠摩罗什-event-death
