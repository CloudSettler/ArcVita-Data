      zh: 译禅
    start_date: '0402'
    highlight_event_id: guji-鸠摩罗什-event-yijing
  - key: climax
    name: 广弘四禅四无量观行
    labels:
      zh: 弘禅
    start_date: '0405'
    highlight_event_id: guji-鸠摩罗什-event-yijing
  - key: closure
    name: 示寂长安舌根不坏
    labels:
      zh: 圆寂
    start_date: '0413'
    highlight_event_id: guji-鸠摩罗什-event-death
  decisions:
  - date: '0401'
    title_zh: 直说道教易解易行
    rationale: 为令初机得入禅定，故以不净白骨慈心等对机施教而不尚玄谈
  - date: '0402'
    title_zh: 先除五盖后说四禅
    rationale: 淫嗔睡眠掉悔疑覆心如云翳日，不除则定慧不生，故详示呵五盖集善法为入定先务
events:
