events:
- id: guji-龙施-event-birth
  title_zh: 生于须福长者家为女名龙施
  date: 约-1000
  year_of: -1000
  place_zh: 须福长者舍
  description_zh: 天上寿终来生世间为长者女意甚明端名曰龙施除去诸欲情见佛眉间放光便发菩提心
- id: guji-龙施-event-snake-devotion
  title_zh: 毒蛇丛林侍奉般遮旬
  date: 约-1500
  year_of: -1500
  place_zh: 丛树山中
  description_zh: 毒蛇见般遮旬诵经欢悦扫地洒水左侧听经悉能讽诵冬寒至道人欲去悲泣恋慕不舍
- id: guji-龙施-event-snake-death-rebirth
  title_zh: 投树舍身生兜率天报恩
  date: 约-1500
  year_of: -1500
  place_zh: 丛树山中复生兜率天
  description_zh: 毒蛇登树遥望道人不现自责宿恶自投树下堕岐身绝两分命过生兜率天识宿命散华报恩
- id: guji-龙施-event-tower-jump
  title_zh: 楼上投身转女成男得忍
  date: 约-1000
  year_of: -1000
  place_zh: 须福长者舍楼观
  description_zh: 魔变父劝取罗汉女对以佛德破之魔激投楼女向佛叉手为一切故投身即得无从生变为男子形
- id: guji-龙施-event-lion-roar
  title_zh: 佛前师子吼说前世行
  date: 约-1000
  year_of: -1000
  place_zh: 维耶离奈女树园
  description_zh: 龙施立佛前说前世积功不惜身命佛记般遮旬即世尊毒蛇即龙施身未来供养恒沙佛作佛号龙上度脱天人
- id: guji-龙施-event-death
  title_zh: 未来作佛号龙上后入灭
  date: 约-900
  year_of: -900
  place_zh: 未来龙上佛国土
  description_zh: 却后供养如恒沙佛得作佛号龙上大会度脱无数天人国土快乐饮食自然教化既毕乃取入灭
