  dilemmas:
  - 浮海西行九死一生当独往求法还是安住中土弘律
  - 律藏未备而般若深经请译当专宗一门还是兼弘显密
  lesson: 以戒为师兼通道俗远绍法显玄奘之志近开南海求法之风
  summary_first_person: 吾名义净齐州人也早岁出家慕法显玄奘之高风咸亨二年浮海西行历南海至印度那烂陀留学十载得具足律藏与大乘诸经天授二年携经返洛蒙则天迎待自长安三年至先天二年译经五十六部二百三十卷其中能断金刚般若波罗蜜多经即吾所译愿以无住布施破相显空令学者离我法二执同证菩提
