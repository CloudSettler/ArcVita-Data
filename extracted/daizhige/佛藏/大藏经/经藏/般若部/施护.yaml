    title_zh: 以一百八名略摄八千颂广文
    rationale: 广文难持故以名号总持，使一切智乃至一切法同一味易于忆念受持
  - date: 1000-01-01
    title_zh: 显说加秘密神咒双付流通
    rationale: 显义开解悟门，密句摄护持之力，令销罪称赞卫护之益速得成就
