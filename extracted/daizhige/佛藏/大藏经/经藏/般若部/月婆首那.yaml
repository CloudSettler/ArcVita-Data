  place_zh: 建康
  description: 自西土经海道至陈都建康，以王子兼三藏见重于朝野，受请主持译场
- id: guji-月婆首那-event-translate
  date: '0568-08-15'
  year_of: 568
  title_zh: 译出胜天王般若波罗蜜经
  place_zh: 建康译场
  description: 译出胜天王般若波罗蜜经七卷，首立通达品明一法般若通达檀尸羼毗禅慧方便愿力智，次显相品说普遍广大难思量相
- id: guji-月婆首那-event-preach
