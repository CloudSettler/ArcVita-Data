  decisions:
  - date: '0570'
    title_zh: 以同事方便摄化难化
    rationale: 或作同学弟子，或化端正女身示无常，皆为令入正教发无上心
  - date: '0572'
    title_zh: 发愿常生秽国度苦众生
    rationale: 病人乃须医药，无疾不须，故不愿净土，愿与苦众生同住说法
events:
