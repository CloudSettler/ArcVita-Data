  place_zh: 建康
  description: 依经敷演无畏檀恭敬檀无依止檀，及对治贪嗔痴三品观门，劝众发一切众生皆入涅槃然后成觉大愿
- id: guji-月婆首那-event-death
  date: 0585
  year_of: 585
  title_zh: 示寂于建康
  place_zh: 建康
  description: 译弘既毕，示寂于陈地，遗教即所译胜天王般若七卷，后世列入大藏般若部流传
