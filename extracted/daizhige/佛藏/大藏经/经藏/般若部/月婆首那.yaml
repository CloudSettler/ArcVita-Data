  decisions:
  - date: '0545'
    title_zh: 舍王位以法为命
    rationale: 见众生轮回皆由贪爱，愿以般若救拔，不恋国土王位
  - date: '0567'
    title_zh: 应陈请开译胜天王所问
    rationale: 华地渴仰大般若，以胜天王发问为缘，最宜摄机，故先译此经
  - date: 0568
    title_zh: 以十波罗蜜释一法通万法
    rationale: 恐学者滞空，特以檀戒忍进禅慧愿力智广释，使空有双照
- id: guji-月婆首那-endeavor-2
  title_zh: 弘阐般若无得行化摄众归菩提
  summary: 依译经敷演檀无住相戒无戒相忍无法相等，劝发菩提心常生秽国度生
  phases:
  - key: brewing
    name: 耆阇崛山缘起敷陈
