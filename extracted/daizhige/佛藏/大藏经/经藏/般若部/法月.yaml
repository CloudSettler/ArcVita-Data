    highlight_event_id: guji-法月-event-arrival
  - key: climax
    name: 依梵本正译空色不二
    labels:
      zh: 高潮
    start_date: '0732'
    highlight_event_id: guji-法月-event-translation
  - key: closure
    name: 经成流通信受奉行
    labels:
