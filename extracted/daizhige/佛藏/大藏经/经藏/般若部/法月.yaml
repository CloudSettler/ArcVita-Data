  decisions:
  - date: '0732'
    title_zh: 以普遍智藏标名心经以显菩萨智库
    rationale: 旧译但名心经恐学者滞于摄略故标普遍智藏令知空即含藏万智
  - date: '0732'
    title_zh: 存观自在慧光三昧缘起及请说仪轨
    rationale: 显此经由佛印可非私述以固信仰令闻者生大光明想
- id: guji-法月-endeavor-2
  title_zh: 开演五蕴皆空与神咒行门
  summary: 说照见五蕴空破十二处十八界及四谛以无得为得以神咒摄持
  phases:
  - key: brewing
    name: 入慧光三昧照见五蕴
    labels:
      zh: 蕴酿
    start_date: '0732'
    highlight_event_id: guji-法月-event-translation
  - key: breakthrough
    name: 告舍利弗色空相即
    labels:
      zh: 突破
    start_date: '0732'
    highlight_event_id: guji-法月-event-translation
  - key: climax
    name: 宣无智无得远离恐怖
    labels:
      zh: 高潮
    start_date: '0733'
    highlight_event_id: guji-法月-event-circulation
  - key: closure
    name: 付揭谛神咒普利世间
    labels:
      zh: 收束
    start_date: '0733'
    highlight_event_id: guji-法月-event-circulation
  decisions:
  - date: '0733'
    title_zh: 以不生不灭不垢不净释空相不断见
    rationale: 恐学者执空为无故以四不拂断常令知空中具三世佛菩提
  - date: '0733'
    title_zh: 以大神咒大明咒赞般若令持诵即观
    rationale: 为钝根者开易行门使诵揭谛即是行深般若能除一切苦
