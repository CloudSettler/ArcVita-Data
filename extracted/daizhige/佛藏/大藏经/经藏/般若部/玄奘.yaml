    name: 弘传受持功验
    labels:
      zh:
      - 弘传
      - 持诵
    start_date: '0650'
    highlight_event_id: guji-玄奘-event-translate-heart-sutra
  - key: closure
    name: 示寂留法
    labels:
      zh:
      - 圆寂
      - 留法
    start_date: '0664-02-05'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: 0649
    title_zh: 直译梵本不加润色
    rationale: 尊重观自在亲授原本，保持对音忠实以存圣枢
  - date: '0650'
    title_zh: 劝人虔诚受持勤行
    rationale: 信般若为圣枢，能销三障超觉际，须体理勤修
