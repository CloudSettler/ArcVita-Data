  decisions:
  - date: 0629
    title_zh: 受持心要决意西行
    rationale: 虽五天路远艰险，为法忘躯，受持心要以保来往
  - date: '0630'
    title_zh: 厄难当头虔诵四十九遍
    rationale: 失路思食皆诚祈持诵，仗此获得指引与供养
- id: guji-玄奘-endeavor-2
  title_zh: 译传般若心经
  summary: 还唐译出梵本心经，亲授观自在所传本，流通受持以超觉际
  phases:
  - key: brewing
    name: 携梵本还唐
