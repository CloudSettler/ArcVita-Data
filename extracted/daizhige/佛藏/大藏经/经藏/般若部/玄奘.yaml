  date: 0649
  year_of: 649
  place: 长安
  description: 以观自在亲授梵本译出心经，不加润色，劝人虔诚受持以销三障超觉际
- id: guji-玄奘-event-death
  title_zh: 示寂
  date: '0664-02-05'
  year_of: 664
  place: 长安玉华宫
  description: 唐高宗麟德元年寂于玉华宫，世寿六十三，一生以译传正法为业
