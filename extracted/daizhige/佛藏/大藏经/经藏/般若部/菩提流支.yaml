  name_zh: 菩提流支
  names:
    zh: 菩提流支
    en: Bodhiruci
  lifespan:
    birth:
      date: 0470-01-01
      precision: year
      is_circa: true
      raw: 約四七〇年生於北印度婆羅門家
    death:
      date: 0527-01-01
      precision: year
      is_circa: true
      raw: 約孝昌三年示寂於洛陽
  birth_date: 0470-01-01
  death_date: 0527-01-01
  era: 北魏
  reign_ref: 北魏宣武帝永平至孝明帝正光時
  archetype: 譯經弘法者
  dilemmas:
  - 梵漢文義乖違，如何忠信達兼全而不著言相
  - 奉詔居朝譯場，如何於功名供養中守無住初心
  - 般若空義深峻，如何令末世眾生不驚不怖而生實信
  lesson: 法尚應捨，何況非法，無住生心，方能荷負無上菩提
  summary_first_person: 吾乃菩提流支，自北印度來，永平元年至洛陽，奉詔譯經，譯金剛般若波羅蜜等三十九部，唯願眾生離我想人想，不住色聲香味觸法而行布施，以無為真如顯現，得見如來
