endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 奉詔洛陽譯經
  summary: 自永平入洛，居永寧寺等譯場，譯金剛般若第二譯及入楞伽法華論等，凡三十九部百二十七卷
  phases:
  - key: brewing
    name: 西來發軔
    labels:
      zh:
      - 北印度習學
      - 發願東行
    start_date: 0470-01-01
    highlight_event_id: guji-菩提流支-event-birth
  - key: breakthrough
    name: 永平至洛
    labels:
      zh:
      - 奉迎入洛
      - 詔入譯場
    start_date: 0508-01-01
    highlight_event_id: guji-菩提流支-event-arrive-luoyang
  - key: climax
    name: 金剛再譯
    labels:
      zh:
      - 般若再弘
      - 無住敷演
    start_date: 0509-01-01
    highlight_event_id: guji-菩提流支-event-translate-diamond
  - key: closure
    name: 譯業圓滿
    labels:
      zh:
      - 眾經流通
      - 示寂洛陽
    start_date: 0527-01-01
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: 0508-01-01
    title_zh: 應詔留洛譯經
    rationale: 為憐愍利益行無上乘人故，不辭異域，荷負譯任，令正法東流
  - date: 0509-01-01
    title_zh: 重譯金剛般若
    rationale: 既有羅什舊譯，仍以梵本勘詳再譯，顯法無定相，令末世持戒修福者得聞實義
- id: guji-菩提流支-endeavor-2
  title_zh: 敷演般若空義
  summary: 依金剛般若宣說無我無人，無法無非法，勸離相布施，安心無諍，普度一切入無餘涅槃
  phases:
  - key: brewing
    name: 深觀空性
    labels:
      zh:
      - 解空習定
      - 筏喻觀照
    start_date: 0508-01-01
    highlight_event_id: guji-菩提流支-event-arrive-luoyang
  - key: breakthrough
    name: 祇園發問
    labels:
      zh:
      - 須菩提請法
      - 云何應住
    start_date: 0509-01-01
    highlight_event_id: guji-菩提流支-event-translate-diamond
  - key: climax
    name: 無住開示
    labels:
      zh:
      - 不住生心
      - 忍辱無我
    start_date: 0509-06-01
    highlight_event_id: guji-菩提流支-event-translate-diamond
  - key: closure
    name: 付囑流通
    labels:
      zh:
      - 四句受持
      - 支提供養
    start_date: 0520-01-01
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: 0509-06-01
    title_zh: 以無住釋住
    rationale: 若心有住則為非住，故教菩薩不住色聲香味觸法而生其心，遠離四相
  - date: 0520-01-01
    title_zh: 勸受持四句偈
    rationale: 三千世界七寶布施不及受持四句為他說，以般若能生諸佛無上菩提故
