  description: 約四七〇年生於北印度婆羅門家，少習三藏，精般若楞伽
- id: guji-菩提流支-event-arrive-luoyang
  title_zh: 永平元年至洛陽
  date: 0508-01-01
  year_of: 508
  place_zh: 洛陽
  description: 北魏宣武帝永平元年至洛陽，帝崇重，詔入永寧寺譯場，始開譯業
- id: guji-菩提流支-event-translate-diamond
  title_zh: 譯金剛般若波羅蜜經之二
  date: 0509-01-01
  year_of: 509
  place_zh: 洛陽永寧寺
  description: 奉詔重譯金剛般若，演舍衛祇園佛告須菩提無住布施離四相之義，後世稱為留支三藏譯本
- id: guji-菩提流支-event-death
  title_zh: 示寂於洛陽
  date: 0527-01-01
  year_of: 527
  place_zh: 洛陽
  description: 正光末至孝昌前後示寂，共譯三十九部百二十七卷，般若楞伽之學遂盛於中土
