  - 度尽一切众生而实无众生可度之两难
  - 有说法度人而实无法可说之两难
  lesson: 应无所住而生其心离一切相方见如来
  summary_first_person: 我于舍卫国祇树给孤独园与大比丘众俱敷座而坐须菩提问云何住云何降伏我教以灭度一切入无余涅槃而无一众生实灭度教以不住色声香味触法行布施示凡所有相皆虚妄若见诸相非相则见如来无法可得方名菩提
  source_urls:
