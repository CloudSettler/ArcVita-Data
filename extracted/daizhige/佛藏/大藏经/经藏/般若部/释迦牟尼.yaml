  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E8%88%AC%E8%8B%A5%E9%83%A8/%E9%87%91%E5%88%9A%E8%88%AC%E8%8B%A5%E6%B3%A2%E7%BD%97%E8%9C%9C%E7%BB%8F.html
endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 祇园乞食敷座示无住度生
  summary_zh: 于舍婆提城次第乞食还至本处敷座而坐启须菩提问答示灭度一切而不取众生相示无住布施福如虚空
  phases:
  - key: brewing
    name: 乞食敷座默示
    labels:
      zh: 酝酿
    start_date: -485-01-01
    highlight_event_id: guji-释迦牟尼-event-jetavana
  - key: breakthrough
    name: 须菩提问住与降伏
    labels:
      zh: 突破
    start_date: -485-02-01
    highlight_event_id: guji-释迦牟尼-event-subhuti-asks
  - key: climax
    name: 开示灭度无量无得度者
    labels:
      zh: 高潮
    start_date: -485-03-01
    highlight_event_id: guji-释迦牟尼-event-subhuti-asks
  - key: closure
    name: 付嘱无住布施福不可量
    labels:
      zh: 收束
    start_date: -485-04-01
    highlight_event_id: guji-释迦牟尼-event-giving-no-abode
  decisions:
  - date: -485-02-01
    title_zh: 以灭度一切入无余涅槃立菩提心
    rationale: 若有我人众生寿者相则非菩萨须离相发心方名真行
  - date: -485-04-01
    title_zh: 教以不住色声香味触法行布施
    rationale: 无住相布施福德如东西南北四维上下虚空不可思量方能广利
- id: guji-释迦牟尼-endeavor-2
  title_zh: 般若破相显实相流通
  summary_zh: 以相非相筏喻无为示平等菩提述燃灯授记与忍辱行付嘱金刚般若名号令后世生净信
  phases:
  - key: brewing
    name: 问相见如来否
    labels:
      zh: 酝酿
    start_date: -484-01-01
    highlight_event_id: guji-释迦牟尼-event-no-form
  - key: breakthrough
    name: 明燃灯所无所得授记
    labels:
      zh: 突破
    start_date: -484-02-01
    highlight_event_id: guji-释迦牟尼-event-dipankara
  - key: climax
    name: 忍辱割截无嗔破四相
    labels:
      zh: 高潮
    start_date: -484-03-01
    highlight_event_id: guji-释迦牟尼-event-patience
  - key: closure
    name: 立名金刚般若付嘱流通
    labels:
      zh: 收束
    start_date: -484-04-01
    highlight_event_id: guji-释迦牟尼-event-name-sutra
  decisions:
  - date: -484-02-01
    title_zh: 直示无有定法可得菩提无法可说
    rationale: 若言有法可得即为谤佛一切圣人皆以无为法得名故须破执
  - date: -484-04-01
    title_zh: 立名金刚般若付嘱奉持为人广说
    rationale: 一切佛法皆从此经出受持四句为他说福胜恒沙七宝布施无量故须流通
events:
- id: guji-释迦牟尼-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 蓝毗尼园降生
  description_zh: 迦毗罗卫王子生于蓝毗尼园后出家修道为后世说法之本起
- id: guji-释迦牟尼-event-jetavana
  date: -485-01-01
  year_of: -485
  title_zh: 舍卫祇园敷座而坐
  description_zh: 如是我闻一时婆伽婆在舍婆提城祇树给孤独园与大比丘众千二百五十人俱食时著衣持钵入城乞食还至本处收衣钵洗足敷座结加趺坐
- id: guji-释迦牟尼-event-subhuti-asks
  date: -485-02-01
  year_of: -485
  title_zh: 须菩提问云何住降伏
  description_zh: 慧命须菩提偏袒右肩右膝著地合掌白佛云何菩萨发菩提心应云何住云何修行云何降伏其心佛令谛听当为宣说
- id: guji-释迦牟尼-event-giving-no-abode
  date: -485-04-01
  year_of: -485
  title_zh: 开示不住于事行布施
  description_zh: 教以菩萨不住色声香味触法布施不住于相想福德如虚空不可思量凡所有相皆是虚妄若见诸相非相则见如来
- id: guji-释迦牟尼-event-no-form
  date: -484-01-01
  year_of: -484
  title_zh: 示相非相见如来
  description_zh: 问可以相成就见如来否示如来说相即非相三十二大人相即是非相微尘世界皆非而名以破相执
- id: guji-释迦牟尼-event-dipankara
  date: -484-02-01
  year_of: -484
  title_zh: 述燃灯佛所无所得授记
  description_zh: 示于燃灯佛所实无有法得菩提以无所得故与授记汝于来世当得作佛号释迦牟尼言如来者即实真如
- id: guji-释迦牟尼-event-patience
  date: -484-03-01
  year_of: -484
  title_zh: 说歌利王割截忍辱无相
  description_zh: 念昔为歌利王割截身体时无我众生人寿者相五百世作忍辱仙人亦复如是故教以应生无所住心不住色生心
- id: guji-释迦牟尼-event-name-sutra
  date: -484-04-01
  year_of: -484
  title_zh: 立名金刚般若付嘱奉持
  description_zh: 须菩提问当何名此法门云何奉持告以是名金刚般若波罗蜜随所有处说此法门乃至四句一切天人阿修罗皆应供养如佛塔庙
- id: guji-释迦牟尼-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 拘尸那城入涅槃
  description_zh: 化缘既毕于拘尸那城入无余涅槃后世末世持此经者皆蒙授记成就无量功德
