  name_zh: 鸠摩罗什
  names:
    zh: 鸠摩罗什
    en: Kumarajiva
  lifespan:
    birth:
      date: '0344'
      precision: year
      is_circa: true
      raw: 约晋穆帝永和十年生于龟兹
    death:
      date: '0413'
      precision: year
      is_circa: false
      raw: 后秦弘始十五年寂于长安
  birth_date: '0344'
  death_date: '0413'
  era: 十六国
  reign_ref: 后秦姚兴弘始
  archetype: 译经弘法者
  dilemmas:
  - 安于小乘旧学与改宗大乘普度众生之间如何抉择
  - 凉州羁留十七载坚守法志与随缘化众之间如何自处
  - 译经求信达雅而文质权衡之间如何取舍
  lesson: 以空慧破执，以信达传法，贯通权实，坚守初心，方能成就弘传大业
  summary_first_person: 吾龟兹人也，幼随母出家，初习小乘，后悟大乘空义，游学西域，名震葱岭，羁留凉州而不改其志，入长安而大译众经，译般若大明咒等以显空性，愿众生照见五蕴皆空，度一切苦厄，吾以翻译弘传为任，虽才薄而志坚也
  source_urls:
  - https://zh.wikisource.org/wiki/摩訶般若波羅蜜大明咒經
  - https://daizhige.org/佛藏/大藏经/经藏/般若部/摩诃般若波罗蜜大明咒经.html
