events:
- id: guji-鸠摩罗什-event-birth
  title_zh: 龟兹诞生
  date: '0344'
  year_of: 344
  place_zh: 西域龟兹
  description: 父为天竺国师鸠摩罗炎，母为龟兹王妹耆婆，生而聪慧，七岁随母出家之先兆
- id: guji-鸠摩罗什-event-study
  title_zh: 随母出家游学西域
  date: '0351'
  year_of: 351
  place_zh: 罽宾沙勒
  description: 七岁出家，日诵千偈，从槃头达多习小乘，后从须利耶苏摩受大乘般若，转小向大
- id: guji-鸠摩罗什-event-fame
  title_zh: 弘化龟兹名震西土
  date: '0364'
  year_of: 364
  place_zh: 龟兹
  description: 返龟兹弘大乘，龟兹王亲奉为师，西域诸国争迎说法，声名远播河西
- id: guji-鸠摩罗什-event-liangzhou
  title_zh: 吕光西征执留凉州
  date: 0384
  year_of: 384
  place_zh: 凉州姑臧
  description: 前秦遣吕光迎请，途中建国受阻，留居凉州十七年，坚守法志，暗中弘化
- id: guji-鸠摩罗什-event-changan
  title_zh: 姚兴迎入长安为国师
  date: '0401'
  year_of: 401
  place_zh: 长安
  description: 后秦姚兴破后凉迎请入长安，礼为国师，住逍遥园，集八百义学之士共弘佛法
- id: guji-鸠摩罗什-event-translation
  title_zh: 译摩诃般若波罗蜜大明咒经等
  date: '0402'
  year_of: 402
  place_zh: 长安逍遥园
  description: 组织译场译出般若大明咒经，宣说观世音行深般若照见五蕴皆空及大明神咒，弘传空不异色之旨
- id: guji-鸠摩罗什-event-lecture
  title_zh: 逍遥园讲学授徒三千
  date: '0405'
  year_of: 405
  place_zh: 长安
  description: 开席讲授大品般若中论等，门下僧肇道生等传扬空宗，译讲并行，风行关中
- id: guji-鸠摩罗什-event-death
  title_zh: 示寂长安誓舌不坏
  date: '0413'
  year_of: 413
  place_zh: 长安
  description: 弘始十五年示寂于长安，临终誓言所译无谬则舌根不坏，荼毗后果舌不烂，众信其为三藏法师
