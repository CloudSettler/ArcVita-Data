  - 夜梦十事恐怖亡国当问异道还是诣佛求解
  lesson: 遇凶梦疑事莫妄信邪说而害亲，当问智者求正解，所谓灾祸多是后世之变，持戒行正即可得安
  summary_first_person: 我是不梨先泥，一夜梦见十事惊怖，恐失国及妻子，婆罗门教我杀亲祭天，我愁入斋房，幸夫人摩尼劝我诣祇园问佛，佛言十梦皆是后世之事，于今无咎，我心得欢喜，归宫重赐夫人，永不信异道之言
