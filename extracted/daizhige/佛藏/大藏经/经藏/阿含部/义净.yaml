  archetype: 求法译经高僧
  dilemmas:
  - 海路凶险与西行求法弘愿之间的取舍
  - 五蕴执我深固与正智观空无我之间的破执
  lesson: 色受想行识皆非常即苦非我，以正智观五取蕴无我无我所，不取不执，方证涅槃。
  summary_first_person: 我是义净，大唐求法译经僧，咸亨中浮海西行，久住那烂陀研习律典，证圣元年归国奉制译经，译出五蕴皆空经，劝人正智观察五蕴皆空无我，得心解脱。
