endeavors:
- id: guji-义净-endeavor-1
  title_zh: 浮海西行求法
  summary_zh: 咸亨二年自广州浮海南行，经室利佛逝至天竺，居那烂陀研习律典凡二十余年乃归。
  phases:
  - key: brewing
    name: 广州发愿浮海
    labels:
      zh: 发愿启程
    start_date: '0671'
    highlight_event_id: guji-义净-event-xihang
  - key: breakthrough
    name: 那烂陀研习律典
    labels:
      zh: 研律精进
    start_date: '0676'
    highlight_event_id: guji-义净-event-qiufa
  - key: climax
    name: 学成怀经东归
    labels:
      zh: 怀经东归
    start_date: 0695
    highlight_event_id: guji-义净-event-guiguo
  decisions:
  - date: '0671'
    title_zh: 决意由海路西行
    rationale: 不蹈陆路战乱阻隔，愿浮海速达天竺求取律典以弘南海
  - date: 0685
    title_zh: 决意久住深研不速归
    rationale: 以戒律为行持根本，未通三藏律部不愿空归，故留印精研
- id: guji-义净-endeavor-2
  title_zh: 归国奉制译经
  summary_zh: 证圣元年归抵洛阳，奉武后诏入译场，与法藏等共译经律，译出五蕴皆空经等要典。
  phases:
  - key: brewing
    name: 蒙诏归朝入译场
    labels:
      zh: 归朝奉诏
    start_date: 0695
    highlight_event_id: guji-义净-event-guiguo
  - key: breakthrough
    name: 译出五蕴皆空要经
    labels:
      zh: 译经传法
    start_date: '0700'
    highlight_event_id: guji-义净-event-yijing
  - key: closure
    name: 译业圆满示寂
    labels:
      zh: 圆满示寂
    start_date: '0713'
    highlight_event_id: guji-义净-event-death
  decisions:
  - date: 0695
    title_zh: 决意奉诏归国弘传
    rationale: 承圣后迎请礼遇，不负西行所学，愿归朝传译以报国恩
  - date: '0700'
    title_zh: 拣译五蕴皆空短经
    rationale: 此经直指色受想行识非常非我，便于初机正智观察，故先译流通
events:
- id: guji-义净-event-birth
  title_zh: 范阳诞生
  date: '0635'
  year_of: 635
  location_zh: 范阳
  description_zh: 贞观九年生于范阳，俗姓张，字文明，幼出家，慕玄奘西行之志。
- id: guji-义净-event-xihang
  title_zh: 广州浮海西行
  date: '0671'
  year_of: 671
  location_zh: 广州
  description_zh: 咸亨二年自广州乘舶南行，经室利佛逝，历艰险赴天竺求法。
- id: guji-义净-event-qiufa
  title_zh: 那烂陀研学律典
  date: '0676'
  year_of: 676
  location_zh: 中天竺那烂陀寺
  description_zh: 居那烂陀从师研习三藏，尤精律部，兼学声明因明，声名著于五天。
- id: guji-义净-event-guiguo
  title_zh: 怀经归抵洛阳
  date: 0695
  year_of: 695
  location_zh: 洛阳
  description_zh: 证圣元年携梵本四百余部归抵洛阳，蒙武后亲迎，敕住大福先寺译经。
- id: guji-义净-event-yijing
  title_zh: 译出五蕴皆空经
  date: '0700'
  year_of: 700
  location_zh: 洛阳大福先寺
  description_zh: 奉制译出佛说五蕴皆空经，明色受想行识过去未来现在皆无我无我所，以正智观证涅槃，五苾刍闻法解脱。
- id: guji-义净-event-death
  title_zh: 长安示寂
  date: '0713'
  year_of: 713
  location_zh: 长安
  description_zh: 先天二年示寂于长安，寿七十九，谥号鸿胪卿，译经五十余部行于世。
