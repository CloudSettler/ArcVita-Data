  decisions:
  - date: -0488
    title_zh: 拒欲不还俗称妹相待
    rationale: 以恶口诽谤嫉妒嗔恚妄语为大恶，观欲无要无可比，故守梵行不动
  - date: -0488
    title_zh: 劝其忏悔安隐而去
    rationale: 令眷属自观愚痴不别真，愿其安隐寿命延长而息贪求
