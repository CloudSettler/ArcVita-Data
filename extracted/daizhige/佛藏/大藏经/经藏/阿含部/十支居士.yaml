person:
  qid: guji-十支居士
  name_zh: 十支居士
  names:
    zh: 十支居士
    en: Dasama of Atthakanagara
  lifespan:
    birth:
      date: 约-0450
      precision: 世纪
      is_circa: true
      raw: 八城人，生年不详，与阿难同时代
    death:
      date: 约-0370
      precision: 世纪
      is_circa: true
      raw: 卒年不详，佛灭后不久入灭
  birth_date: 约-0450
  death_date: 约-0370
  era: 古印度列国时代
  reign_ref: 佛灭后不久，对应中原战国前期
  archetype: 护法居士
  dilemmas:
  - 治生求利与闻法求道如何兼顾
  - 一甘露门与十二甘露门应当依何安隐修行
  - 得法欢喜后如何以财护持僧团以报师恩
  lesson: 问一门而得十二门，守一门即可安隐出离，更当以财法二施护持正法
  summary_first_person: 我是八城人十支，以居士身往波罗梨弗都卢治生获利，诣鸡园听诸上尊说法，又往毗舍离猕猴水岸问阿难一甘露门，蒙说四禅、四无量、无色定等十二甘露门，欢喜设供施房护持僧团。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E9%98%AB%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%8D%81%E6%94%AF%E5%B1%85%E5%A3%AB%E5%85%AB%E5%9F%8E%E4%BA%BA%E7%BB%8F.html
endeavors:
- id: guji-十支居士-endeavor-1
  title_zh: 波罗梨弗都卢经商治生
  summary: 持财物往波罗梨弗都卢治生，尽买货物获大盈利，心生欢喜而往鸡园听法
  phases:
  - key: brewing
    name: 携财赴波罗梨弗都卢
    labels:
      zh: 经商筹划
    start_date: 约-0396
    highlight_event_id: guji-十支居士-event-trade
  - key: breakthrough
    name: 持钱财物尽买
    labels:
      zh: 尽买货物
    start_date: 约-0395
    highlight_event_id: guji-十支居士-event-trade
  - key: climax
    name: 得盈利极欢喜
    labels:
      zh: 获利欢喜
    start_date: 约-0395
    highlight_event_id: guji-十支居士-event-trade
  - key: closure
    name: 出城诣鸡园听法
    labels:
      zh: 转向闻法
    start_date: 约-0393
    highlight_event_id: guji-十支居士-event-chickenpark
  decisions:
  - date: 约-0396
    title_zh: 诣波罗梨弗都卢治生
    rationale: 身为八城居士多有财物，欲以治生增长资财以养家护法
  - date: 约-0393
    title_zh: 获利后不即归而诣鸡园礼僧听法
    rationale: 世尊般涅槃不久，诸上尊在鸡园，欲以欢喜心亲近听法求安隐
- id: guji-十支居士-endeavor-2
  title_zh: 问阿难甘露门并护持僧团
  summary: 问阿难一甘露门得十二甘露门，以重阁十二门喻领解，设净妙饮食供养两处僧团并施房
  phases:
  - key: brewing
    name: 鸡园听法欲见阿难
    labels:
      zh: 发问之心
    start_date: 约-0393
    highlight_event_id: guji-十支居士-event-chickenpark
  - key: breakthrough
    name: 赴毗舍离猕猴水岸问法
    labels:
      zh: 问一甘露门
    start_date: 约-0393
    highlight_event_id: guji-十支居士-event-ask-ananda
  - key: climax
    name: 得十二甘露门开示
    labels:
      zh: 闻法欢喜
    start_date: 约-0393
    highlight_event_id: guji-十支居士-event-ask-ananda
  - key: closure
    name: 设供施房护持招提僧
    labels:
      zh: 财法报恩
    start_date: 约-0392
    highlight_event_id: guji-十支居士-event-offering
  decisions:
  - date: 约-0393
    title_zh: 离鸡园往毗舍离见阿难问一法
    rationale: 欲知世尊所说圣弟子住一法即得漏尽解脱之要，须问亲侍世尊之阿难
  - date: 约-0392
    title_zh: 以净妙饮食供养两处僧并以五百种物买房施阿难转施招提僧
    rationale: 婆罗门尚以恶法俱施师物，我等于大师岂不以财施报恩，令正法久住
