- id: guji-大正句王-event-convert
  title_zh: 舍断见信有后世
  date: -0480-07-01
  year_of: -480
  description: 闻商主旷野负麻养猪大腹斗狮等喻知愚执长夜受苦遂舍断见信有人世化生及沙门婆罗门天眼实见
- id: guji-大正句王-event-death
  title_zh: 卒于尸利沙城
  date: -0450-01-01
