    title_zh: 谛听譬喻舍断见
    rationale: 知秽坑不返梦非真实灰中求火商主弃食负麻不改等皆喻己愚
  - date: -0480-08-01
    title_zh: 信有后世化生
    rationale: 悟沙门婆罗门以智自通天眼见死此生彼不复执无
