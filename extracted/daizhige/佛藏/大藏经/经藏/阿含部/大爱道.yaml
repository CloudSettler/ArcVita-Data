  title_zh: 乳养太子归依法道
  summary: 姊摩耶命终后乳养悉达多，从佛闻法自归三宝证阿罗汉以报佛恩。
  phases:
  - key: brewing
    name: 释种姨母乳养
    labels:
      zh: 抚育
    start_date: '-0563'
    highlight_event_id: guji-大爱道-event-foster
  - key: breakthrough
    name: 自归三宝入道
    labels:
