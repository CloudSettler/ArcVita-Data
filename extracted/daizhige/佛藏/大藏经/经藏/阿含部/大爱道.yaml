person:
  qid: guji-大爱道
  name_zh: 大爱道
  names:
    zh: 摩诃卑耶和题俱昙弥
    en: Mahaprajapati Gautami
  lifespan:
    birth:
      date: -0590
      precision: year
      is_circa: true
      raw: 约公元前五九零年迦毗罗卫释种生
    death:
      date: -0485
      precision: year
      is_circa: true
      raw: 约公元前四八五年毗舍离王园入灭
  birth_date: -0590
  death_date: -0485
  era: 古印度列国时代
  reign_ref: 净饭王治世至佛住世时
  archetype: 慈母开团者
  dilemmas:
  - 不忍见佛及贤圣先灭与依法住世之抉择
  - 母道恩爱与舍离证果之抉择
  - 女人之身求出家证道与世俗局限之抉择
  lesson: 以慈育圣以信求道，舍母身而成丈夫行，先佛入灭以全法护法。
  summary_first_person: 我为佛姨母，佛母命终后乳养太子长大成人，从佛自归三宝证阿罗汉，率五百释女开尼团，不忍见佛及阿难舍利弗目连入灭，故先舍寿于王园现神足而取泥洹。
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T0144
  - https://daizhige.org/佛藏/大藏经/经藏/阿含部/佛说大爱道般泥洹经.html
