  - key: climax
    name: 证阿罗汉具神足
    labels:
      zh: 证果
    start_date: '-0527'
    highlight_event_id: guji-大爱道-event-refuge
  - key: closure
    name: 母恩佛恩两相酬
    labels:
      zh: 报恩
    start_date: -0485
