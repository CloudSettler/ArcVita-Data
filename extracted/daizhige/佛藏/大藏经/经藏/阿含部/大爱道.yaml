  decisions:
  - date: '-0563'
    title_zh: 代姊乳养太子
    rationale: 姊命终不忍太子失恃，以慈母心养育长大为后求道之本。
  - date: -0528
    title_zh: 从佛自归三宝
    rationale: 因佛因缘断疑归依佛法僧及道迹，以信解入圣位以报佛恩。
- id: guji-大爱道-endeavor-2
  title_zh: 开创尼团先佛入灭
  summary: 率五百释女出家领众成阿罗汉，不忍见佛灭先现神足取泥洹受佛起塔供养。
  phases:
  - key: brewing
    name: 率众请出家
    labels:
      zh: 请法
    start_date: -0528
    highlight_event_id: guji-大爱道-event-refuge
  - key: breakthrough
    name: 尼团成就五百罗汉
    labels:
      zh: 化众
    start_date: '-0527'
    highlight_event_id: guji-大爱道-event-refuge
  - key: climax
    name: 辞佛先舍寿
    labels:
      zh: 先灭
    start_date: -0485
    highlight_event_id: guji-大爱道-event-death
  - key: closure
    name: 王园现通入塔
    labels:
      zh: 供养
    start_date: -0485
    highlight_event_id: guji-大爱道-event-death
  decisions:
  - date: -0528
    title_zh: 领五百女求出家
    rationale: 为开女人解脱之门，愿与眷属同离苦舍爱而证道。
  - date: -0485
    title_zh: 先佛舍寿取泥洹
    rationale: 不忍见佛及阿难舍利弗目连灭度，愿先灭去现神足以显法证。
events:
- id: guji-大爱道-event-birth
  date: -0590
  year_of: -590
  title_zh: 降生迦毗罗卫释种
  description: 为天臂城释种女，摩耶夫人妹，后为净饭王夫人，佛之姨母。
- id: guji-大爱道-event-foster
  date: '-0563'
  year_of: -563
  title_zh: 代姊乳养悉达多
  description: 摩耶命终后乳养太子长大，阿难述其于佛有阜恩，佛亦言教其归依有无量恩。
- id: guji-大爱道-event-refuge
  date: -0528
  year_of: -528
  title_zh: 自归三宝率众出家
  description: 从佛因缘自归佛法僧及道，率五百比丘尼俱证阿罗汉具大神足，住毗舍离王园精舍。
- id: guji-大爱道-event-death
  date: -0485
  year_of: -485
  title_zh: 王园现神足取泥洹
  description: 辞别世尊后与五百尼于王园布座，腾空经行坐卧出水出火现四神足而灭，佛手捧舍利赞舍母聚身得丈夫行，令起塔供养。
