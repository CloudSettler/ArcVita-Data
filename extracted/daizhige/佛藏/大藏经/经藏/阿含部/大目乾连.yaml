  - 以甚深三昧觉知微细魔扰与慈悲呵止之间的持守
  - 直陈过去拘楼孙佛时魔业惨报以警众而不令生怖
  lesson: 以定慧观照识破微细娆乱以慈悲呵止护持如来及弟子长夜安乐
  summary_first_person: 我是大目乾连，世尊座下神通弟子，一时在跋只国牧摩鼻量鹿野园中为世尊作窟，觉腹中沉重如食豆，以三昧观知是魔波旬化小入腹，即呵令速出，莫触娆如来及弟子，复为众说过去拘楼孙佛时毗楼萨若受魔娆乱堕阿鼻之旧缘，令众修慈悲喜舍及观无常以断魔便。
