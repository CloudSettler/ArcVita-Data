    highlight_event_id: guji-尸迦罗越-event-teach
  - key: breakthrough
    name: 辨识损益
    labels:
      zh: 远恶亲善
    start_date: -0483
    highlight_event_id: guji-尸迦罗越-event-teach
  - key: climax
    name: 领受六方
    labels:
      zh: 伦理正行
    start_date: -0483
    highlight_event_id: guji-尸迦罗越-event-teach
  - key: closure
    name: 受戒而去
    labels:
      zh: 信受奉行
    start_date: -0483
    highlight_event_id: guji-尸迦罗越-event-precept
  decisions:
  - date: -0483
    title_zh: 择善知识远离恶知识
    rationale: 佛言我与善知识相随自致成佛，故当从善者远离怨心两舌临急相弃者
  - date: -0483
    title_zh: 受五戒行六方五事
    rationale: 知身拜无益，唯持戒修善行六方伦理方知父教真义何忧不富，遂作礼受持
events:
- id: guji-尸迦罗越-event-birth
  person_id: guji-尸迦罗越
  title_zh: 生于王舍国长者家
  date: '-0500'
  year_of: -500
  place_zh: 王舍国
  description: 为长者子，父在时教以六向拜之礼，生长于敬亲奉训之家。
- id: guji-尸迦罗越-event-meet
  person_id: guji-尸迦罗越
  title_zh: 晨行六拜遇佛垂问
  date: -0483
  year_of: -483
  place_zh: 王舍国家中佛自鸡山入国分卫遥见处
  description: 早起严头洗浴著文衣东西南北风天地各四拜，佛往到其家问何为六向拜此应何法，答言父教不知何应不敢违。
- id: guji-尸迦罗越-event-teach
  person_id: guji-尸迦罗越
  title_zh: 长跪听佛说戒善恶知识六方
  date: -0483
  year_of: -483
  place_zh: 王舍国家中
  description: 佛说持四戒不杀不盗不邪淫不妄言两舌，制贪淫恚怒愚痴四意，断饮酒博掩懈惰好请恶友憍慢六耗财事，辨善恶知识各四辈，广说六方各五事及沙门教化之恩。
- id: guji-尸迦罗越-event-precept
  person_id: guji-尸迦罗越
  title_zh: 受五戒作礼而去
  date: -0483
  year_of: -483
  place_zh: 王舍国佛前
  description: 既知父在时六向拜之教在于去恶为善开示正道，即受五戒作礼而去，复闻佛说持戒精进度世呗偈。
- id: guji-尸迦罗越-event-death
  person_id: guji-尸迦罗越
  title_zh: 卒于王舍国
  date: '-0420'
  year_of: -420
  place_zh: 王舍国
  description: 受法之后奉行六方之行，年代不详，后卒于本地，事迹存于安世高所译六方礼经中。
