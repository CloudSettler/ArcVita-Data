  - key: climax
    name: 长跪请义
    labels:
      zh: 求解拜意
    start_date: -0483
    highlight_event_id: guji-尸迦罗越-event-meet
  - key: closure
    name: 愿闻正教
    labels:
      zh: 倾心受教
    start_date: -0483
    highlight_event_id: guji-尸迦罗越-event-teach
  decisions:
  - date: -0483
    title_zh: 不违父教坚持六向拜
    rationale: 父丧不敢于后违之，虽不知何应犹早起严饰礼拜以尽孝心
  - date: -0483
    title_zh: 长跪请佛解拜意
    rationale: 闻佛言不以身拜，当以心行，遂求明六向所应之法以改徒劳为实行
- id: guji-尸迦罗越-endeavor-2
  person_id: guji-尸迦罗越
  title_zh: 闻法受持六方伦理与五戒
  summary: 听佛说四戒制意、六耗财事、善恶知识四辈之别，复受子事父母、弟子事师、妇事夫、亲友、大夫奴客、事沙门道士六方之行，即受五戒而去。
  phases:
  - key: brewing
    name: 闻戒制意
    labels:
