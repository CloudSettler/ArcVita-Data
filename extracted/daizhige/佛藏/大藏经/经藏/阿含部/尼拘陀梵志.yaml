  decisions:
  - date: '-0500'
    title_zh: 坚持苦行即最上出离无上
    rationale: 虽闻佛言仅得少分非真出离，仍执裸露断食草衣等行即是真实清净真实中住
  - date: '-0500'
    title_zh: 执慈心神通即得洁白真实
    rationale: 谓与慈俱遍观十方及知宿住见生死即已出离，故三度答佛如是如是
  - date: '-0500'
    title_zh: 闻二十余种烦恼随增而俯首无答
    rationale: 佛说求供养贡高我慢嫉妒谄曲等皆是染分，众障重昏懵不能施设辩才，唯忧思而住
