    title_zh: 誇口如击空瓶必胜瞿昙
    rationale: 谓瞿昙处空舍慧不能转，若来会中当以一问建立胜义令其堕负，以壮本众声势
  - date: '-0500'
    title_zh: 当众问何法令声闻到安隐地
    rationale: 以声闻安隐止息内心清净梵行为问端，欲试佛法律与自法高下
