  archetype: 苦行论辩型外道领袖
  dilemmas:
  - 执苦行持戒为最上洁白与佛说烦恼随增之间的冲突
  - 誇口能以一问击破瞿昙与亲见佛慧默然无答之间的落差
  - 求王臣尊重供养与求真实出离清净之间的取舍
  lesson: 持戒苦行若为名闻恭敬我慢嫉妒所覆即是染分随增，唯有离热恼专注趣求方至安隐清净梵行
  summary_first_person: 我是尼拘陀梵志，聚众于乌昙末梨园，以四戒苦行自许出离洁白，曾对和合长者言必能问倒沙门瞿昙，及佛亲临善无毒池会，我发问何法令声闻到安隐地，蒙佛开示苦行慈心神通皆未离烦恼随增，我等障重默然，方知真出离不在形骸苦切而在心离染著
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E9%98%BF%E5%90%AB%E9%83%A8/%E4%BD%9B%E8%AF%B4%E5%B0%BC%E6%8B%98%E9%99%80%E6%A2%B5%E5%BF%97%E7%BB%8F.md
