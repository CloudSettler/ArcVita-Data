events:
- id: guji-护国-event-birth
  date: -360
  year_of: -550
  title_zh: 生于睹罗聚落长者家
  place_zh: 睹罗聚落
  description_zh: 生于婆罗门大长者家，眷属广大，财宝无量，少年具色力而厌轮回
- id: guji-护国-event-ordination
  date: -336
  year_of: -520
  title_zh: 绝食得许依佛出家证阿罗汉
  place_zh: 俱卢城睹罗聚落佛所
  description_zh: 佛会闻法起信，父母不许则绝食，知识劝许后诣佛受具，须发自落，离放逸证漏尽，我生已尽
- id: guji-护国-event-return
  date: -328
  year_of: -510
  title_zh: 还乡乞食弃财化亲
  place_zh: 本生睹罗聚落本舍大树下
  description_zh: 著衣持钵次第乞食，母以金银留恋则车载弃河，妻庄严相劝则呼姊拒之，饭讫为父母说法现神通说偈
- id: guji-护国-event-teach-king
  date: -0509
  year_of: -509
  title_zh: 为俱卢王说老病爱死四法
  place_zh: 睹罗聚落侧大树下
  description_zh: 答王四问，以色力衰变喻老，无代无救喻病，伐他国无厌喻爱，舍境生他世喻死，重说贪爱积聚偈，王皈依三宝受优婆塞戒
- id: guji-护国-event-death
  date: -312
  year_of: -470
  title_zh: 佛世后入灭
  place_zh: 古印度
  description_zh: 化亲化王已，持梵行安住，漏尽后入灭，年月不详
