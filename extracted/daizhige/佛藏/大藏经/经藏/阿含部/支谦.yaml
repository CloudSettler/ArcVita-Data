  summary_first_person: 我是支谦字恭明月支优婆塞幼随祖居洛阳师从支亮通梵汉六国语嘉禾中入吴蒙孙权礼为博士不就而专心译经以摄守六根意不放逸为要译不自守意经等四十九部开吴地译经之风
