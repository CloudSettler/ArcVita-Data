    title_zh: 以文达义曲从方言
    rationale: 天竺语与汉言异故不直守梵质而以达意为主使吴人易晓
  - date: '0250'
    title_zh: 居士终身不立宗派
    rationale: 以译经为务不聚徒营利唯以法施报佛恩故守优婆塞之分
