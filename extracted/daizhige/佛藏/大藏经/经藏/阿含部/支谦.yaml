    title_zh: 不就博士专心译经
    rationale: 以居士弘法为志不慕荣禄唯愿梵义流通故辞官而译
  - date: '0240'
    title_zh: 先译摄意守根小经
    rationale: 学者心散不知守意故先译不自守意经明自守不自守因缘以立修行纲要
