  description_zh: 生从母顶出，故字为文陀竭，后长大仁贤修正法
- id: guji-文陀竭王-event-rain-treasure
  type: career
  title_zh: 天雨钱金银七日七夜
  date: -1990-01-01
  year_of: -1990
  location_zh: 王舍中四天下
  description_zh: 王念有千子七宝，愿天雨宝，天闻随愿雨钱金银七日七夜，王大欢喜娱乐数千岁
- id: guji-文陀竭王-event-unify-four-continents
  type: career
  title_zh: 飞行平定四天下以正法治国
  date: -1989-01-01
  year_of: -1989
  location_zh: 阎浮提俱耶尼弗于逮郁单曰
  description_zh: 适生意即举七宝四兵俱飞，阎浮提二十八万里俱耶尼三十二万里弗于逮三十六万里郁单曰四十万里皆降伏，王以正法治国数千岁，得自然粳米衣树宝树
- id: guji-文陀竭王-event-ascend-trayastrimsa
  type: career
  title_zh: 上须弥入帝释宫受半座起代心即堕
  date: -1988-01-01
  year_of: -1988
  location_zh: 须弥山忉利天帝释宫
  description_zh: 王欲上须弥，举七宝百官飞到，帝释起迎以半座坐之，见天宫七宝心念使帝释死我欲代治，适生意神便去还天下
- id: guji-文陀竭王-event-death
  type: death
  title_zh: 堕地病困著床遗言而终
  date: -1980-01-01
  year_of: -1980
  location_zh: 天下王宫床边
  description_zh: 王被病困劣，群臣问遗言，王自述治四天下雨宝飞行受天半座犹不足，诫人至死无厌足，唯得须陀洹至佛道乃足，佛言时文陀竭即我身也
