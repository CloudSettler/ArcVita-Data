    title_zh: 发愿令天雨钱金银七日七夜
    rationale: 自念四天下炽盛千子具足，欲试福力，随愿得雨，大欢喜娱乐
  - date: -1989-01-01
    title_zh: 飞行往取四洲以正法治国
    rationale: 不以强暴烦扰万民，适生意即举七宝四兵俱飞，所至皆降，遂行仁政
- id: guji-文陀竭王-endeavor-2
  title_zh: 升忉利求天帝位堕落示无足
  summary_zh: 举七宝百官飞上须弥入帝释宫受半座，复起代释治天之念，即失神通堕地病困，临终遗言人无厌足，唯佛道乃足
  phases:
  - key: brewing
