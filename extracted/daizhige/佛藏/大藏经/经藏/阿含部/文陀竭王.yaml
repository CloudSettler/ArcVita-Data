  - key: breakthrough
    name: 帝释迎劳以半座与坐
    labels:
      zh: 天人礼遇
    start_date: -1988-02-01
    highlight_event_id: guji-文陀竭王-event-ascend-trayastrimsa
  - key: climax
    name: 起代帝释之念神即去堕地
    labels:
      zh: 一念堕落
    start_date: -1988-03-01
    highlight_event_id: guji-文陀竭王-event-ascend-trayastrimsa
  - key: closure
    name: 病床遗言示至死不知足
    labels:
      zh: 临终悔悟
    start_date: -1980-01-01
    highlight_event_id: guji-文陀竭王-event-death
  decisions:
  - date: -1988-01-01
    title_zh: 登须弥入天宫受半座
    rationale: 自念四洲已得舍中雨宝，欲见天上玉女宫殿，遂飞到忉利受礼遇
  - date: -1980-01-01
    title_zh: 病困遗言述无厌足之过
    rationale: 自悔适生意欲代天帝即堕，方知天雨七宝亦不饱，嘱群臣以知足求道为教
events:
- id: guji-文陀竭王-event-birth
