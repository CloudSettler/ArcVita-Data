  lesson: 以智慧为利刀以精进为胜行破散五蕴烦恼蚁聚方证圣果
  summary_first_person: 我本西天人蒙宋帝诏入译经院为传法大师与法贤等共译显密经律凡百余部复奉诏译此蚁喻经以蚁聚喻五蕴聚身以烟火喻寻伺身语业以龟蛇等喻五盖贪嗔痴慢疑嫉欲以龙喻阿罗汉以婆罗门喻如来以利刀喻智慧愿诸有智者勤行精进断诸烦恼我以译场为道场终身不怠
