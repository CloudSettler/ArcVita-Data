      - 参译
    start_date: 0983
    highlight_event_id: guji-施护-event-join
  - key: climax
    name: 奉诏广译
    labels:
      zh:
      - 广译
      - 弘传
    start_date: 0990
    highlight_event_id: guji-施护-event-translate-yuansheng
  - key: closure
    name: 授职传法
    labels:
      zh:
      - 授职
      - 传法
    start_date: '1007'
    highlight_event_id: guji-施护-event-honor
  decisions:
  - date: 0983
    title_zh: 应诏入译经院专事传译
    rationale: 感宋主崇法置院之诚，愿舍西归之念，以译经利华夏为己任
  - date: 0990
    title_zh: 坚持梵汉对校直存兼润文便览
    rationale: 恐失佛意则校梵本存真，虑滞华机则润文取达，务令信达雅兼顾
- id: guji-施护-endeavor-2
  title_zh: 译演园生树喻明四禅次第
  summary: 取三十三天园生树六变及开华异香喻声闻出家持戒至四禅及漏尽果，示道果次第分明可观可修
  phases:
  - key: brewing
    name: 拈喻立教
    labels:
      zh:
      - 立喻
      - 观察
    start_date: 0995
    highlight_event_id: guji-施护-event-translate-yuansheng
  - key: breakthrough
    name: 配法四禅
    labels:
      zh:
      - 配教
      - 禅定
    start_date: 0997
    highlight_event_id: guji-施护-event-translate-yuansheng
  - key: climax
    name: 花开证果
    labels:
      zh:
      - 证果
      - 供养
    start_date: 0998
    highlight_event_id: guji-施护-event-translate-yuansheng
  - key: closure
    name: 付嘱奉行
    labels:
      zh:
      - 信受
      - 奉行
    start_date: 0998
    highlight_event_id: guji-施护-event-translate-yuansheng
  decisions:
  - date: 0997
    title_zh: 以树喻禅层层配属而不躐等
    rationale: 见学者好速成而恶次第，故借树之萌芽生长开华，明初禅至四禅及无学各有相状不可躐进
  - date: 0998
    title_zh: 详述华香光明以劝欣乐修学
    rationale: 欲令苾刍慕果修因，故备述妙华清净异香远闻光明普照，劝发欢喜踊跃奉行
