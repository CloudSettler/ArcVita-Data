      raw: 宋真宗天禧元年卒
  birth_date: 0950
  death_date: '1017'
  era: 北宋
  reign_ref: 宋太宗至真宗朝
  archetype: 译场弘传者
  dilemmas:
  - 梵本义密华言难尽当存真而拙抑或润文而失
  - 诏命广译卷帙浩繁当多译以利世抑或专修以自证
  lesson: 修证如园生树渐生渐茂，依戒定慧次第而进，终至漏尽花开
  summary_first_person: 吾为施护，本于阗人，入宋居译经院，奉诏传译，借忉利园生树从萌芽至开华喻声闻出家至四禅及无学果，愿学者循次渐修终得清凉
  source_urls:
  - https://daizhige.org/佛藏/大藏经/经藏/阿含部/佛说园生树经.html
  - https://github.com/daizhige-org/daizhigev20
endeavors:
