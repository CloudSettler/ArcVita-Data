    title_zh: 详译七种灭诤法
    rationale: 未起已起诤事皆须现前忆念不痴等法息灭，故具译无省略
  - date: '1005'
    title_zh: 合说六种和敬法
    rationale: 欲令大众身语意慈和利戒见同，故以和敬巩固灭诤之果
