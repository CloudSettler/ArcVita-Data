  - title_zh: 众诤方兴而法须息灭
    description: 外道斗诤损减善法，如何以七灭诤六和敬安众止诤
  lesson: 不尚胜负，但息诤根，以恭敬师法和合众心止苦恼
  summary_first_person: 吾奉诏译经，传西天之法于中土，译息诤因缘一经，说明诤本七灭六和，愿众生离忿恨执著，同住安乐。
