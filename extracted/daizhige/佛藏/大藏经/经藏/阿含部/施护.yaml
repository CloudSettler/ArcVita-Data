  title_zh: 居宋译经院广译三藏
  summary: 太平兴国中入汴京译经院，与天息灾法贤等共译显密经律百余部，授明教大师朝奉大夫试鸿胪卿传法大师
  phases:
  - key: brewing
    name: 西来入华
    labels:
      zh:
      - 初发心
      - 入华
