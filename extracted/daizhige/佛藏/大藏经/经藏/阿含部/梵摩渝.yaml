  summary_first_person: 吾是梵摩渝弥夷国逝心年百二十博通众经为一国师闻瞿昙佛在随提国遣弟子摩纳往观六月具陈三十二相神化吾即诣佛问两相及逝心通达清净之义心解皈依设供七日得闻苦空真谛
