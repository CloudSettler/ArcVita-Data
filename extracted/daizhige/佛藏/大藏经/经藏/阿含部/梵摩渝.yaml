  description_zh: 弥夷国人博通众经星宿图书之始基后年至百二十为一国师
- id: guji-梵摩渝-event-scholar
  title_zh: 贯综秘谶为一国师
  date: 约-520
  year_of: -520
  place_zh: 弥夷国
  description_zh: 靖居斋房豫知天文吉凶逆照明当来有佛号悉达具三十二相为门徒广陈
- id: guji-梵摩渝-event-dispatch
  title_zh: 遣摩纳往随提观佛六月
  date: 约-485
  year_of: -485
  place_zh: 随提国
  description_zh: 闻佛在随提国与五百沙门俱行命弟子摩纳往视相好神化摩纳六月影随具睹广长舌阴马藏还报三十二相行住坐食威仪
- id: guji-梵摩渝-event-refuge
  title_zh: 诣弥夷林下问难皈依设斋七日
  date: 约-485
  year_of: -485
  place_zh: 弥夷国林树下
  description_zh: 佛至弥夷坐一树下率门徒诣所偈问两相佛现神足释疑复问逝心通达清净寂然佛义心解五体投地受三归守五戒设百味食七日
- id: guji-梵摩渝-event-death
  title_zh: 寿终得不还果
  date: 约-480
  year_of: -480
  place_zh: 弥夷国舍宅
  description_zh: 佛还随提国未久寿终比丘问所趣佛言圣心博解五盖已尽得不还净若天金入无为而去
