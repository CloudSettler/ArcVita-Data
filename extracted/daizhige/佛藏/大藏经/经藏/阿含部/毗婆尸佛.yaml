  name_zh: 毗婆尸佛
  names:
    zh: 毗婆尸佛
    en: Vipassi Buddha
  lifespan:
    birth:
      date: 约-91000
      precision: 年
      is_circa: true
      raw: 过去劫满度摩城太子
    death:
      date: 约-11000
      precision: 年
      is_circa: true
      raw: 寿八万岁入灭
  birth_date: 约-91000
  death_date: 约-11000
  era: 远古过去劫
  archetype: 觉者导师
  dilemmas:
  - 在家绍轮王位与出家求解脱之抉择
  - 耽著五欲妙乐与勤求涅槃安乐之抉择
  - 独住安乐与游行说法广度群生之抉择
  lesson: 睹老病死而悟无常，观十二缘起而得解脱，以忍辱持戒度群生
  summary_first_person: 我为满度摩王之子，久处深宫，四出游观，历见病人老人死人与沙门，悟世间无常不可免，遂舍王位国城而出家，与八万人同修梵行，夜观十二因缘生灭，断惑证得正觉，后于鹿野园三会说法，传波罗提目叉，令众得解脱
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E9%98%BF%E5%90%AB%E9%83%A8/%E6%AF%97%E5%A9%86%E5%B0%B8%E4%BD%9B%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%8F%E8%97%8F/%E9%98%BF%E5%90%AB%E9%83%A8/%E6%AF%97%E5%A9%86%E5%B0%B8%E4%BD%9B%E7%BB%8F.html
endeavors:
- id: guji-毗婆尸佛-endeavor-1
  title_zh: 四门游观舍俗出家
  summary_zh: 为太子时四出城游观，见病老死苦而厌离五欲，见沙门而欣乐出离，舍父王位剃发出家，八万人随从
  phases:
  - key: brewing
    name: 初见病者思惟病苦
    labels:
      zh:
      - 游观
      - 病苦
    start_date: 约-90980
    highlight_event_id: guji-毗婆尸佛-event-sick
  - key: breakthrough
    name: 再见老死深悟无常
    labels:
      zh:
      - 老苦
      - 死苦
    start_date: 约-90979
    highlight_event_id: guji-毗婆尸佛-event-old-dead
  - key: climax
    name: 睹沙门生欣乐出离
    labels:
      zh:
      - 沙门
      - 出离
    start_date: 约-90978
    highlight_event_id: guji-毗婆尸佛-event-renunciation
  - key: closure
    name: 剃发出家八万人随
    labels:
      zh:
      - 出家
      - 随从
    start_date: 约-90977
    highlight_event_id: guji-毗婆尸佛-event-renunciation
  decisions:
  - date: 约-90980
    title_zh: 见病回宫却五欲
    rationale: 知四大失调病不可免，端坐思惟病苦真实，不乐五欲妙乐
  - date: 约-90978
    title_zh: 见沙门决意出家
    rationale: 悟忍辱慈悲可趣涅槃安乐，遂发信心舍父母国城珍宝而作沙门
- id: guji-毗婆尸佛-endeavor-2
  title_zh: 缘起观照成就正觉
  summary_zh: 出家后离国游行安居，夜分入定逆顺观十二因缘，观五蕴如幻，断贪嗔痴而成正等觉
  phases:
  - key: brewing
    name: 离国游行结夏思惟
    labels:
      zh:
      - 游行
      - 思惟
    start_date: 约-90976
    highlight_event_id: guji-毗婆尸佛-event-renunciation
  - key: breakthrough
    name: 逆观十二支苦因
    labels:
      zh:
      - 缘起
      - 苦因
    start_date: 约-90970
    highlight_event_id: guji-毗婆尸佛-event-enlightenment
  - key: climax
    name: 顺观十二支灭尽
    labels:
      zh:
      - 还灭
      - 解脱
    start_date: 约-90970
    highlight_event_id: guji-毗婆尸佛-event-enlightenment
  - key: closure
    name: 蕴空惑尽成正觉
    labels:
      zh:
      - 空观
      - 正觉
    start_date: 约-90970
    highlight_event_id: guji-毗婆尸佛-event-enlightenment
  decisions:
  - date: 约-90976
    title_zh: 自厌迷醉游行而返本住
    rationale: 思何用世间富贵，众生轮回苦蕴无尽，当求出离之法
  - date: 约-90970
    title_zh: 入定谛观缘生得解脱
    rationale: 以智推老死乃至无明之因，又观无明灭则众苦灭，兼观五蕴生灭不住，遂断业习烦恼
- id: guji-毗婆尸佛-endeavor-3
  title_zh: 鹿野园三会广度声闻
  summary_zh: 成道后往满度摩城鹿野园，先度欠拏太子帝稣噜，次度八万人，遣六万二千人游行，六年后说波罗提目叉，三会皆得阿罗汉
  phases:
  - key: brewing
    name: 持钵往满度摩观察机缘
    labels:
      zh:
      - 观察
      - 机缘
    start_date: 约-90969
    highlight_event_id: guji-毗婆尸佛-event-first-sermon
  - key: breakthrough
    name: 度欠拏帝稣噜成罗汉
    labels:
      zh:
      - 说法
      - 证果
    start_date: 约-90969
    highlight_event_id: guji-毗婆尸佛-event-first-sermon
  - key: climax
    name: 度八万人同出家受戒
    labels:
      zh:
      - 广度
      - 出家
    start_date: 约-90968
    highlight_event_id: guji-毗婆尸佛-event-mass-ordination
  - key: closure
    name: 遣众游行说戒传律
    labels:
      zh:
      - 游行
      - 说戒
    start_date: 约-90962
    highlight_event_id: guji-毗婆尸佛-event-precept
  decisions:
  - date: 约-90969
    title_zh: 先往鹿野园度旧眷属
    rationale: 观满度摩城人民机缘纯熟，宜先说法利益有情，示施戒生天及四谛法行
  - date: 约-90968
    title_zh: 遣六万二千人游方六年
    rationale: 大众住一城宜减少，令往诸方聚落随意修习，期满归国受持波罗提目叉，显忍辱涅槃之道
events:
- id: guji-毗婆尸佛-event-birth
  title_zh: 降生为满度摩王太子
  date: 约-91000
  year_of: -91000
  location_zh: 满度摩城
  description_zh: 过去劫满度摩王之子，姓刹帝利，憍陈族，父名满度摩王，母名满度摩帝，寿八万岁
- id: guji-毗婆尸佛-event-sick
  title_zh: 出游见病人悟病苦
  date: 约-90980
  year_of: -90980
  location_zh: 城外园林
  description_zh: 太子出游见病人形色憔悴，问御者瑜誐知四大乖调病不可免，回宫端坐思惟病苦真实
- id: guji-毗婆尸佛-event-old-dead
  title_zh: 再出游见老死悟无常
  date: 约-90979
  year_of: -90979
  location_zh: 城外园林
  description_zh: 太子见老人须发皓白执杖呻吟，又见死人眷属悲啼，知老死三界无安不可免，入定思惟无常之法
- id: guji-毗婆尸佛-event-renunciation
  title_zh: 见沙门舍位出家
  date: 约-90978
  year_of: -90978
  location_zh: 城外园林
  description_zh: 太子见苾刍剃发被袈裟行慈悲忍辱求涅槃，欢喜发心舍父母国城珍宝而作沙门，八万人随从出家
- id: guji-毗婆尸佛-event-enlightenment
  title_zh: 夜观缘起成就正觉
  date: 约-90970
  year_of: -90970
  location_zh: 本住舍
  description_zh: 夜分入三摩地逆顺观无明缘行乃至生缘老死，又观无明灭则行灭乃至众苦灭，复观五蕴如幻，得大解脱成正等觉
- id: guji-毗婆尸佛-event-first-sermon
  title_zh: 鹿野园初度欠拏等二人
  date: 约-90969
  year_of: -90969
  location_zh: 满度摩城安乐鹿野园
  description_zh: 佛往鹿野园召欠拏太子及近臣帝稣噜，说布施持戒及苦集灭道，令出家受具足戒，现三神通，皆成阿罗汉
- id: guji-毗婆尸佛-event-mass-ordination
  title_zh: 度八万人同成罗汉
  date: 约-90968
  year_of: -90968
  location_zh: 满度摩城安乐鹿野园
  description_zh: 满度摩城八万人闻法发心舍家诣佛所，闻四谛得清净心，出家受戒，现三神通，不久漏尽成阿罗汉
- id: guji-毗婆尸佛-event-precept
  title_zh: 六年满说波罗提目叉
  date: 约-90962
  year_of: -90962
  location_zh: 满度摩城
  description_zh: 六万二千苾刍游行六年还本城，佛演说波罗提目叉，忍辱最为上能忍得涅槃，远离杀害身口七过，诸天亦来听受
- id: guji-毗婆尸佛-event-death
  title_zh: 寿八万岁示灭
  date: 约-11000
  year_of: -11000
  location_zh: 满度摩国
  description_zh: 三会说法广度声闻，第一会六万二千人，第二会十万人，第三会八万人得阿罗汉，化缘既周，寿尽入灭
