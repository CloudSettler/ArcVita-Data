endeavors:
- id: guji-法炬-endeavor-1
  title_zh: 译说法海经显僧法八德
  description: 依据梵本译出法海经，具载佛在瞻波国汉呿利池上月十五日说戒因缘及大海八德之喻
  phases:
  - key: brewing
    name: 习阿含蓄译志
    labels:
      zh: 学修培壅
    start_date: 0265-01-01
    highlight_event_id: guji-法炬-event-birth
  - key: breakthrough
    name: 得梵本发心译
    labels:
      zh: 得本发心
    start_date: 0280-01-01
    highlight_event_id: guji-法炬-event-translate
  - key: climax
    name: 译成八德海喻
    labels:
      zh: 译成流通
    start_date: 0285-06-01
    highlight_event_id: guji-法炬-event-translate
  - key: closure
    name: 付嘱奉行流通
    labels:
      zh: 付嘱奉行
    start_date: 0288-01-01
    highlight_event_id: guji-法炬-event-translate
  decisions:
  - date: 0280-01-01
    title_zh: 抉择译出说戒摈秽缘起
    rationale: 佛默然不说戒目连定观引秽比丘出众，此为清净根本，不可隐没，故具译其事以立戒本
  - date: 0285-06-01
    title_zh: 以大海八德摄僧法全义
    rationale: 海水无满不满潮信有时一味咸深广难量众宝备具神龙所居容受百川不受死尸，以八喻摄禅定四谛大乘及四双八辈之德，使初机易解
- id: guji-法炬-endeavor-2
  title_zh: 严净律仪护持僧团清净
  description: 依经中佛敕自今以后汝等自共说戒及海不受死尸之义，倡导布萨说戒以清净为禁戒业
  phases:
  - key: brewing
    name: 观察众中不净事
    labels:
      zh: 观秽存净
    start_date: 0286-01-01
    highlight_event_id: guji-法炬-event-precept
  - key: breakthrough
    name: 举目连摈秽为式
    labels:
      zh: 摈秽立范
    start_date: 0290-07-15
    highlight_event_id: guji-法炬-event-precept
  - key: climax
    name: 申明自共说戒制
    labels:
      zh: 自共说戒
    start_date: 0292-01-01
    highlight_event_id: guji-法炬-event-precept
  - key: closure
    name: 四姓同味无非释子
    labels:
      zh: 同味清净
    start_date: 0295-01-01
    highlight_event_id: guji-法炬-event-precept
  decisions:
  - date: 0290-07-15
    title_zh: 坚持秽人当出众不预清净集
    rationale: 如栴檀林不容伊兰臭秽，大海不受秽尸，若默然妄语预座则头破七分，故须引出以全大众净业
  - date: 0292-01-01
    title_zh: 劝四众自相敕戒无令正法有毁
    rationale: 如来于大众说戒甚为不易，潮水以时而来不失常处，四部受戒者亦当不犯禁戒违失常法，故以自共说戒承佛敕
