    title_zh: 引目连牵臂出恶喻立规矩
    rationale: 依经中不持戒者牵臂出之，立道法长幼相教护，不得自憍犯戒
  - date: 0293
    title_zh: 以四辈鼠四辈人劝学抉择
    rationale: 为破托名犹豫前却之弊，明示持戒学问念度一切可得佛道
events:
- id: guji-法炬-event-birth
  title_zh: 法炬出生
  date: '0230'
  year_of: 230
  description: 约生于魏晋之际，稍长出家，通梵汉，习阿含戒律
- id: guji-法炬-event-study
  title_zh: 研梵本习阿含
  date: 0280
  year_of: 280
  description: 于西晋初研读梵本，究阿含说戒因缘，为译恒水经积资粮
- id: guji-法炬-event-hengshui
  title_zh: 译出佛说恒水经
  date: 0290
  year_of: 290
  description: 译佛与大比丘菩萨至恒水月望说戒，阿难三请，目连屏破戒者，佛说海水故际七宝五江入海海不增减等喻
- id: guji-法炬-event-discipline
  title_zh: 弘戒整众劝持道宝
  date: 0293
  year_of: 293
  description: 依经弘传五戒十善二百五十戒得果次第，劝弃淫恚痴，持戒精进如海不受恶露
- id: guji-法炬-event-death
  title_zh: 法炬示寂
  date: '0310'
  year_of: 310
  description: 约卒于西晋末乱世，遗嘱奉行经戒无坏灭，弟子传持恒水经不绝
