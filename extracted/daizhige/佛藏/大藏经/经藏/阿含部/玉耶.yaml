  archetype: 恃美憍慢而改过从善之妇
  dilemmas:
  - 自恃端正姝好而轻慢夫婿姑妐，与妇礼恭顺本分之冲突
  - 逃藏拒礼心怀惶怖，与见佛闻法改往修来之抉择
  lesson: 端正不在颜色面目而在除邪定心，知过能改善莫大焉，妇道当以恭顺勤谨持家
  summary_first_person: 我是玉耶，给孤长者子妇，本恃端正而憍慢失礼，蒙佛化导说五善三恶七辈妇，方知怖悔，誓如婢妇奉事姑妐夫婿，受十戒为优婆夷，改往修来以终其身
