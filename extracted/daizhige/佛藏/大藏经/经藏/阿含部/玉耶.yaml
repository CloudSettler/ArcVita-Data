endeavors:
- id: guji-玉耶-endeavor-1
  title_zh: 嫁入给孤家恃美失礼
  summary: 为长者家女嫁给孤独长者子，端正姝好而生憍慢，不以妇礼承事姑妐夫婿，致家长欲请佛化导
  phases:
  - key: brewing
    name: 嫁娶憍慢
    labels:
      zh: 恃美轻夫
    start_date: '-0500'
    highlight_event_id: guji-玉耶-event-marry
  - key: climax
    name: 拒礼藏匿
    labels:
      zh: 刚强难化
    start_date: -0485
    highlight_event_id: guji-玉耶-event-teaching
  decisions:
  - date: '-0500'
    title_zh: 以颜色自恃不修妇礼
    rationale: 初嫁不闲礼仪，执端正而起慢心，故早卧晚起先食嗔视，失恭顺之节
  - date: -0485
    title_zh: 佛至逃藏不肯礼拜
    rationale: 惭惧交并不愿见佛，欲避教诃，然佛现琉璃净土光明相好，令其惶怖自出忏悔
- id: guji-玉耶-endeavor-2
  title_zh: 闻法改过受戒为善
  summary: 见佛闻说十恶五善三恶七辈妇，默然信服，立誓如婢妇奉事终身，受十戒为优婆夷，澡水供养听受布施经戒
  phases:
  - key: breakthrough
    name: 见佛忏悔闻法
    labels:
      zh: 闻法开解
    start_date: -0485
    highlight_event_id: guji-玉耶-event-teaching
  - key: closure
    name: 誓为婢妇受戒
    labels:
      zh: 改往修来
    start_date: -0485
    highlight_event_id: guji-玉耶-event-vow
  decisions:
  - date: -0485
    title_zh: 立誓如婢妇奉事姑妐夫婿
    rationale: 了知五善显荣三恶堕涂七辈妇高下，涕泣自陈愚痴，愿尽寿恭恪不敢憍慢
  - date: -0485
    title_zh: 请受十戒为优婆夷
    rationale: 信作善得福作恶得罪，信佛法僧，愿终身持不杀不盗不邪淫不饮酒等十戒以固其行
