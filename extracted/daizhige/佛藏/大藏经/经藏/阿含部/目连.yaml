      raw: 約前四八三年
  birth_date: -0568
  death_date: -0483
  era: 春秋晚期印度列國時代
  reign_ref: 釋迦牟尼佛住焚只國時
  archetype: 神通第一降魔護法
  dilemmas:
  - 腹中雷鳴擾亂禪行當驚怖驅斥抑或靜觀窮源
  - 面對隱形弊魔試探當以威力降伏抑或以宿緣慈誡
  lesson: 靜觀內照則魔不得便慈念平等則怨不能侵試佛擾眾者終自墮苦
  summary_first_person: 吾乃目連夜於鹿苑經行覺腹中雷鳴入室正受觀見弊魔化作徹景入吾腹中即誡其出莫嬈如來弟子又以過去拘樓秦佛時為嗔恨魔之宿緣開示因果令其降伏而去
  source_urls:
  - https://daizhige.org/zh-hans/佛藏/大藏經/經藏/阿含部/弊魔試目連經.html
  - https://cbetaonline.dila.edu.tw/zh/T0067
endeavors:
- id: guji-目连-endeavor-1
  title_zh: 經行察腹識魔誡出
  summary: 夜於鹿苑經行覺腹雷鳴入室正受觀見弊魔徹景入腹直呼其名令出莫嬈佛及弟子
  phases:
  - key: brewing
    name: 夜行經行腹鳴
    labels:
      zh: 經行覺異
    start_date: -0485
    highlight_event_id: guji-目连-event-enter
  - key: breakthrough
    name: 入室正受觀源
    labels:
      zh: 正受觀身
    start_date: -0485
    highlight_event_id: guji-目连-event-enter
  - key: climax
    name: 指名誡魔令出
    labels:
      zh: 當面呵魔
    start_date: -0485
    highlight_event_id: guji-目连-event-enter
  - key: closure
    name: 魔出住前對語
    labels:
      zh: 魔現請伏
    start_date: -0485
    highlight_event_id: guji-目连-event-tame
  decisions:
  - date: -0485
    title_zh: 不驚不怖入室觀身
    rationale: 腹作雷鳴如饑人負重當以三昧觀其本源而不妄動方見徹景之魔
  - date: -0485
    title_zh: 直呼弊魔令出莫嬈
    rationale: 已見其形即明告長夜獲苦墮惡之果令其畏懼出離不擾如來弟子
- id: guji-目连-endeavor-2
  title_zh: 說拘樓秦宿緣化魔
  summary: 自述過去拘樓秦佛時曾為嗔恨魔以姊子之緣說化長者毀辱供養兩番不得便及擊洪音墮獄之果誡今魔莫試佛
  phases:
  - key: brewing
    name: 道說姊子宿親
    labels:
      zh: 宿世明緣
    start_date: -0484
    highlight_event_id: guji-目连-event-tame
  - key: breakthrough
    name: 說四等心令魔無便
    labels:
      zh: 演說對治
    start_date: -0484
    highlight_event_id: guji-目连-event-tame
  - key: climax
    name: 說擊洪音墮獄大苦
    labels:
      zh: 因果震懾
    start_date: -0484
    highlight_event_id: guji-目连-event-tame
  - key: closure
    name: 誦偈誡魔忽不現
    labels:
      zh: 偈誡降伏
    start_date: -0484
    highlight_event_id: guji-目连-event-tame
  decisions:
  - date: -0484
    title_zh: 以自曾為魔之緣開解
    rationale: 曾為嗔恨魔有姊黤黑今魔為姊子以親緣說法易令信伏而不增怨
  - date: -0484
    title_zh: 以地獄苦果誡止試心
    rationale: 述擊洪音破頭灑血即墮地獄宛轉毒痛之報令知試佛弟子必歸惡趣長夜不安
