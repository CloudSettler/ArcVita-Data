  title_zh: 于东晋译出戒德香经
  date: '0388-01-01'
  year_of: 388
  place_zh: 东晋都邑
  description_zh: 译佛游舍卫国祇树给孤独园，阿难独思根香枝香华香唯随风不能逆风往问佛，佛答善男女修十善孝顺父母奉事三尊则东方乃至上下沙门梵志咸歌其德，是为随风逆风靡不周之香，并译佛颂戒香最无上
- id: guji-竺昙无兰-event-teach
  title_zh: 宣说戒香无碍与十善果报
  date: '0389-01-01'
  year_of: 389
  place_zh: 郡国县邑村落
  description_zh: 宣说此香不碍须弥山川天地不碍地水火风通达八极，一身不杀则长寿无横乃至除愚痴则生智慧，劝舍邪见常住正道，时诸比丘闻之欢喜作礼而去
