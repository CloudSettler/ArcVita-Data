    title_zh: 決意留止江南習漢譯經
    rationale: 欲使自恣和合法久住華土，須通華言俗訓，故忍異域之苦而留止譯場。
  - date: '0390-01-01'
    title_zh: 以散韻兼譯存梵偈勸誡之力
    rationale: 經中大目揵連洪音、諸天龍王偈讚皆為勸信，不可但存長行，故偈頌並譯以全其威神勸化之用。
- id: guji-竺曇無蘭-endeavor-2
  title_zh: 弘宣夏竟自恣清淨和合法
  summary_zh: 依新歲經宣說三月安居竟擊揵椎、行舍羅籌、相謝悔過、佛亦自向眾懺謝之制，勸導僧俗嚴身口意奉十善四等六度。
