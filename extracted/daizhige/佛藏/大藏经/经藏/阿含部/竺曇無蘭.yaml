  - key: closure
    name: 以戒淨功德歸於十方蒙濟
    labels:
      zh: 功德歸十方
    start_date: '0410-01-01'
    highlight_event_id: guji-竺曇無蘭-event-death
  decisions:
  - date: '0390-06-01'
    title_zh: 強調佛亦叉手向眾悔過
    rationale: 為破慢恣自大之心，特顯無上至真亦自省請忍，和同乃應道法，非卑下之事。
  - date: '0390-08-01'
    title_zh: 明毀戒如死屍不受新歲
    rationale: 若不痛陳毀戒必墮地獄餓鬼之報，眾則輕慢自恣，故以嚴誡顯慈護，令勤慎身口意三業。
