endeavors:
- id: guji-竺法护-endeavor-1
  person_qid: guji-竺法护
  title_zh: 西域求法携梵本东归
  description: 少年出家后立志弘法，西行遍历西域诸国，通晓梵语胡语，广集大乘小乘梵本携归敦煌，为后半生译经奠定本源
  phases:
  - key: brewing
    name: 敦煌出家立志弘法
    labels:
      zh: 少年立志
    start_date: 0239
    highlight_event_id: guji-竺法护-event-birth
  - key: breakthrough
    name: 西行遍历得遇梵本
    labels:
      zh: 西行求法
    start_date: 176
    highlight_event_id: guji-竺法护-event-seek
  - key: climax
    name: 携经东归至于敦煌
    labels:
      zh: 携经东归
    start_date: 182
    highlight_event_id: guji-竺法护-event-seek
  - key: closure
    name: 会通华胡奠定译基
    labels:
      zh: 奠定译业
    start_date: 0268
    highlight_event_id: guji-竺法护-event-seek
  decisions:
  - date: 176
    title_zh: 决意西行求梵本
    rationale: 汉地经本阙略，欲得如真正法，必须亲履西域，通语言而求原本
  - date: 182
    title_zh: 携本东归不留西土
    rationale: 独善不如兼善，汉地渴法甚于西土，当归敦煌洛阳弘化，令善法转增
- id: guji-竺法护-endeavor-2
  person_qid: guji-竺法护
  title_zh: 洛阳长安设场译经弘法
  description: 于洛阳长安敦煌等地设译场，广译正法华维摩诘贤劫应法等一百五十余部，阐明四法相应现乐后乐之道，教人弃杀盗淫妄邪见而行善趣道
  phases:
  - key: brewing
    name: 洛阳初开译场
    labels:
      zh: 初开译场
    start_date: 0269
    highlight_event_id: guji-竺法护-event-seek
  - key: breakthrough
    name: 广译大乘奠定名望
    labels:
      zh: 广译大乘
    start_date: 0280
    highlight_event_id: guji-竺法护-event-translate
  - key: climax
    name: 译出应法经阐四法
    labels:
      zh: 译弘应法
    start_date: 0284
    highlight_event_id: guji-竺法护-event-translate
  - key: closure
    name: 关中弘化战乱圆寂
    labels:
      zh: 弘化圆寂
    start_date: 197
    highlight_event_id: guji-竺法护-event-death
  decisions:
  - date: 0284
    title_zh: 译出应法经示四法相应
    rationale: 世人但贪现乐不计后报，当明示现乐后苦现苦后乐现苦后苦现乐后乐四种，劝乐行善法而不舍离
  - date: 197
    title_zh: 乱中坚持译经不辍
    rationale: 不善法转增之时更须善法救世，虽年老流离，不弃译事，令爱喜法转增而趣涅槃
