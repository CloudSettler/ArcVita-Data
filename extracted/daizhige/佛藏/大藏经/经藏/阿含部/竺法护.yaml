  dilemmas:
  - title_zh: 梵本艰深与汉地渴法
    description: 西域梵本浩繁深奥难解，汉地僧俗渴仰正法，当如何既忠于梵义又令汉人易解受持
  - title_zh: 战乱流离与译场不辍
    description: 西晋末年世乱流离，往返敦煌洛阳长安之间，当避乱自保还是坚持设译场弘化不止
  lesson: 弃现乐后苦之不善，忍现苦而行善，乐行善法而不舍离，方得现乐后乐而趣涅槃
  summary_first_person: 我是竺法护，月氏后人，生于敦煌，八岁出家，西行求法携梵本东归，终身译经弘化，我所译应法经说四法相应，劝人知如真而弃恶行善，以现乐后乐趣向等道涅槃
  source_urls:
