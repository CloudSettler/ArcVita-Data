  summary_first_person: 吾本舍卫巨富，愍孤恤独故名给孤独，买祇陀太子园献佛为祇树给孤独园，恒时供养，后诣佛请问施福，闻弥罗摩大施不如施一正见乃至归依持戒行慈之次第，遂离我人众生寿者之见，心得清净悟寂灭忍
