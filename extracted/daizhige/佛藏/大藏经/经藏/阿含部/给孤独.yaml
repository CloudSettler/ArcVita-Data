    rationale: 了知心求富贵快乐则福狭，为诸有情离分别行慈持戒归依则福胜，故转求心为利他心
events:
- id: guji-给孤独-event-birth
  person_id: guji-给孤独
  date: '-0545'
  year_of: -545
  title_zh: 舍卫巨富家生须达多
  description: 生于憍萨罗国舍卫城富豪家，名须达多，以常周给孤独无靠故号给孤独长者
- id: guji-给孤独-event-1
  person_id: guji-给孤独
  date: '-0520'
  year_of: -520
  title_zh: 买祇陀园建祇树给孤独园献佛
  description: 以重宝买祇陀太子园林，建造房舍床座香饮食供，献佛及随佛大苾刍众，佛常居说法遂名祇树给孤独园
- id: guji-给孤独-event-2
  person_id: guji-给孤独
  date: '-0515'
  year_of: -515
  title_zh: 祇园礼佛闻长者施报经得忍
  description: 来诣佛所头面礼足一面坐，闻佛说上妙饮食如法恒施之法，及弥罗摩八万金银盘牛女车乘大施不如施正见乃至佛僧园林精舍归依持戒行慈之次第，闻已无我人众生寿者见，远离惑想心得清净悟寂灭忍
- id: guji-给孤独-event-death
  person_id: guji-给孤独
  date: -0485
  year_of: -485
  title_zh: 舍卫命终以施护之业传世
  description: 于舍卫命终，一生以财法二施护持正法，祇园之名与施报之义并传后世
