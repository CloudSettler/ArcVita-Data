    highlight_event_id: guji-舍利弗-event-rebuke-desire
  - key: closure
    name: 纳受目犍连喻立善除恶
    labels:
      zh:
      - 收束印可
    start_date: -323
    highlight_event_id: guji-舍利弗-event-mahamaudgalyayana-parable
  decisions:
  - date: -324
    title_zh: 直指求欲生无量恶皆缘意恚而起
    rationale: 隐犯争前行争说法争供养等皆由求名利不遂生恚恚则所行唯不善故须尽舍
  - date: -323
    title_zh: 判覆秽器者当远离藏美食者当亲近
    rationale: 伪称沙门智慧上座定净者如满秽覆钵发则可厌当莫恭敬礼事真具善行者虽暂被谤终如美食发器可乐当承事亲近
