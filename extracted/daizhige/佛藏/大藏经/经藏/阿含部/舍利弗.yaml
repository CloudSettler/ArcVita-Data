  decisions:
  - date: -325
    title_zh: 以如实知为判胜劣不以有无表相判
    rationale: 同是有欲或同是无欲因知如真与不知及乐行护根与否果报全异故立知为要
  - date: -324
    title_zh: 连用四喻铜钵洗摩尘土明心垢净
    rationale: 垢钵不拭益垢净钵不护转秽唯随时洗拭护持方得清白善终故须喻显
- id: guji-舍利弗-endeavor-2
  person_qid: guji-舍利弗
  title_zh: 广呵求欲无量恶扶立无求欲善行
  summary_zh: 详说求欲者隐犯嫉他名利供养等十一类恶行如覆器藏秽当远离复显无求欲者无恚向善如覆器藏美食当亲近承事并受目犍连车轴喻印可
  phases:
  - key: brewing
    name: 诘问求欲名义
