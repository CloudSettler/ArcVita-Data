  summary_first_person: 我是舍利弗，与大目连游行诸国经历一年，领五百比丘还至药树园欲见世尊，虽因大众声高暂蒙止见，即顺教退住，受释种清信士供养待时，后因梵天劝请佛许复见，得以整众诣佛，闻如来供养僧团堪任重担之教，见六十比丘漏尽解脱，愿荷担僧团，护念新学不令退转
