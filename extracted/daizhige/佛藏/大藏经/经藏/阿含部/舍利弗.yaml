  date: -0568
  year_of: -568
  place_zh: 摩揭陀国那罗陀村
  description_zh: 舍利弗生于婆罗门望族少聪睿善论议后与目犍连同师删阇耶外道因闻马胜比丘偈得悟归佛
- id: guji-舍利弗-event-preach-four
  person_qid: guji-舍利弗
  title_zh: 婆只尸收摩林说四种求欲人
  date: -325
  year_of: -505
  place_zh: 婆只尸收摩林鼻量鹿野苑
  description_zh: 告诸比丘分别内有求欲内无求欲与知如真不知如真四种人以铜钵洗摩垢净为喻明善终恶终之因答比丘何故同有欲同无欲而一弊恶一最胜
- id: guji-舍利弗-event-rebuke-desire
  person_qid: guji-舍利弗
  title_zh: 广说求欲无量恶法与无求欲善行
  date: -324
  year_of: -504
  place_zh: 婆只尸收摩林鼻量鹿野苑
  description_zh: 释求欲能生无量恶谓隐犯嫉他独问世尊争前行争前坐争说法争谈论争名闻争供养争衣药等意恚则所行唯不善复举无求欲者无恚则所行唯善以覆秽器与覆美食器为喻判当远离与当亲近
- id: guji-舍利弗-event-mahamaudgalyayana-parable
  person_qid: guji-舍利弗
  title_zh: 受大目犍连车轴巧师喻印可
  date: -323
  year_of: -503
  place_zh: 婆只尸收摩林鼻量鹿野苑
  description_zh: 大目犍连以罗阅只巧师斫治车轴知无念满子心念及华鬘授净女为喻证舍利弗知谄幻懈怠者心念而解脱知信乐精进者闻法如快饮快食能除不善立于善中众欢喜奉行
- id: guji-舍利弗-event-death
  person_qid: guji-舍利弗
  title_zh: 先佛入灭于那罗陀故里
  date: -0484
  year_of: -484
  place_zh: 摩揭陀国那罗陀村故宅
  description_zh: 舍利弗智慧第一神通不及目犍连以报母恩还乡说法度亲族后先佛而般涅槃舍利起塔供养
