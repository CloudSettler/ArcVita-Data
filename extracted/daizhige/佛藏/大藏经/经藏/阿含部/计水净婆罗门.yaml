  dilemmas:
  - 信水洗能除一切恶与闻心有二十一结难以外洗除之矛盾
  - 安守婆罗门旧俗与舍邪归依佛法僧之抉择
  lesson: 外水但去尘垢，持戒修慈悲喜护方得内外俱净
  summary_first_person: 我本摩竭陀一婆罗门，久计水洗为净，过中食后彷徉至郁鞞罗水岸，得见世尊，闻二十一结如垢衣难染，闻无结如净衣易受，又闻慈悲喜护满四方为真内外洗，方知水不能净恶，唯戒行清净能度，遂舍旧计，归依佛法僧，尽命离杀为优婆塞
