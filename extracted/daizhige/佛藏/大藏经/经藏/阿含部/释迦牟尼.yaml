  summary: 释迦族悉达多诞生后出家成等正觉号如来至真
- id: guji-释迦牟尼-event-yishan
  title_zh: 拘夷足指移山石
  date: -483-02-14
  year_of: -483
  place_zh: 拘夷那竭力士生地大丛树间
  summary: 五百力士移方六十丈高百二十丈石一月不动佛以右足大指挑至梵天掌中三转置虚空去地四丈九尺三指篾屑吹销世界六返震动
- id: guji-释迦牟尼-event-shili
  title_zh: 校量四力说十力
  date: -483-02-14
  year_of: -483
  place_zh: 拘夷那竭大丛树间
  summary: 说凡牛至如来乳哺力算数说目连神足不及如来说舍利弗智慧不及如来说意行知雨渧归海复说处非处乃至漏尽十力
- id: guji-释迦牟尼-event-miedu
  title_zh: 力士生地夜半灭度付嘱建塔
  date: -483-02-15
  year_of: -483
  place_zh: 拘夷那竭力士生地四衢
  summary: 说无常力最胜金刚身亦归坏败是夜半灭度令供舍利建塔五百力士除贡高发无上道意得不退转天人得法眼净
