    rationale: 以饭僧福佑众生令去贪酷五心死后得脱地狱而护巴邻正地
  - date: -483-01-25
    title_zh: 先受奈女请却维耶梨理家请
    rationale: 守先受请之信护贫养护之慈兼诫比丘端心离淫观不随庄严色
  - date: -483-02-01
    title_zh: 令诸比丘往丰熟处分卫独留竹芳
    rationale: 竹芳米贵聚小难供千僧且自知身痛欲般泥洹先安众而后示灭
