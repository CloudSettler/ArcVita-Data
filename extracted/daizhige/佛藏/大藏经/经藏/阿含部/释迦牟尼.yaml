  dilemmas:
  - 国以七法不衰僧以戒法久住出世与处世如何两全
  - 生老病死四痛逼人爱欲贪着难离如何示现无常而令众得度
  lesson: 奉持七法则国不危僧不乱思惟四痛奉持八戒灭痴得慧即得泥洹久住之道
  summary_first_person: 吾为度生死故无数劫与心相诤而成佛游行王舍巴邻维耶梨等地以七法教国以四十九法教僧以四痛八戒开化天人今缘尽示现般泥洹汝等当端心持戒讽诵思义勿随愚人心
  source_urls:
