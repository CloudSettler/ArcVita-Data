    start_date: -500-05-01
    highlight_event_id: guji-释迦牟尼-event-hengshui
  - key: breakthrough
    name: 五喻分别
    labels:
      zh: 喻显空义
    start_date: -500-05-02
    highlight_event_id: guji-释迦牟尼-event-wuyun
  - key: climax
    name: 偈颂总摄
    labels:
      zh: 以偈收摄
    start_date: -500-05-02
    highlight_event_id: guji-释迦牟尼-event-wuyun
  - key: closure
    name: 众喜奉行
    labels:
      zh: 信受奉行
    start_date: -500-05-03
    highlight_event_id: guji-释迦牟尼-event-wuyun
  decisions:
  - date: -500-05-01
    title_zh: 即境取喻启发谛观
    rationale: 见恒水大聚沫随流漂动无坚可依即借眼前事启发比丘亲见而思惟分别五蕴同然
  - date: -500-05-02
    title_zh: 以偈重说令易受持
    rationale: 长行已说恐散乱难持故以色如聚沫等偈颂总摄令众忆念修观断除我执
- id: guji-释迦牟尼-endeavor-2
  title_zh: 领五百比丘游化恒河流域
  description: 与大比丘众五百人俱游行教化止住波斯匿王所造阿迎阇观恒水侧随缘说法摄受僧众令安住正念谛观修习
  phases:
  - key: brewing
