  - key: climax
    name: 分别五百得果差别
    labels:
      zh: 高潮
    start_date: -485-08-15
    highlight_event_id: guji-释迦牟尼-event-fenbie
  - key: closure
    name: 伽陀赞叹收结解夏
    labels:
      zh: 收束
    start_date: -485-08-15
    highlight_event_id: guji-释迦牟尼-event-zansong
  decisions:
  - date: -485-08-15
    title_zh: 赞舍利弗为法王子
    rationale: 以其能令未见者见未闻者闻，堪绍隆法化，利乐四众
  - date: -485-08-15
    title_zh: 授记学位苾刍满果
    rationale: 以其见法得法故，虽居学地必当证果，不舍一人以摄僧和
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼降生
  date: -563-04-08
  year_of: -563
  place_zh: 迦毗罗卫蓝毗尼园
  description: 我诞生于蓝毗尼，后出家成道，号为世尊如来
- id: guji-释迦牟尼-event-anju
  title_zh: 竹林安居圆满会集
  date: -485-07-15
  year_of: -485
  place_zh: 王舍城迦兰陀竹林精舍
  description: 与五百苾刍众俱安居，多是阿罗汉诸漏已尽，唯一苾刍现居学位，已得授记当证满果
- id: guji-释迦牟尼-event-jiexia
  title_zh: 解夏十五日敷座求忍
  date: -485-08-15
  year_of: -485
  place_zh: 王舍城迦兰陀竹林精舍
  description: 安居既满当解夏时，于十五日敷座而坐，告苾刍众言我已得梵行寂静最后身，夏中身口意业汝等可忍
- id: guji-释迦牟尼-event-renke
  title_zh: 忍可舍利弗绍法王位
  date: -485-08-15
  year_of: -485
  place_zh: 王舍城迦兰陀竹林精舍
  description: 舍利弗陈白佛无过可忍，佛赞其具戒多闻大慧如金轮王子受灌顶绍法王位，所转无上法轮皆悉忍可其三业
- id: guji-释迦牟尼-event-fenbie
  title_zh: 分别五百苾刍得果
  date: -485-08-15
  year_of: -485
  place_zh: 王舍城迦兰陀竹林精舍
  description: 应舍利弗启请，分别五百苾刍中九十得三明，九十得俱解脱，余者得慧解脱，皆尽烦恼住真实
- id: guji-释迦牟尼-event-zansong
  title_zh: 嚩拟舍伽陀赞叹奉行
  date: -485-08-15
  year_of: -485
  place_zh: 王舍城迦兰陀竹林精舍
  description: 嚩拟舍于众前说解夏伽陀，叹五百断缚证圣及佛为无上法王，舍利弗与诸苾刍闻法欢喜信受奉行
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那入灭
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那娑罗林
  description: 化缘既毕示现入灭，令弟子依戒依法而住
