    highlight_event_id: guji-释迦牟尼-event-miedu
  decisions:
  - date: -483-02-14
    title_zh: 以无常胜一切力
    rationale: 诸力虽盛不免坏败欲令舍力执归道谛
  - date: -483-02-14
    title_zh: 令于四衢建塔供养
    rationale: 利四方人以华香灯幡归胜寺得真妙法
events:
