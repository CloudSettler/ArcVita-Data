    labels:
      zh:
      - 说法高潮
    start_date: -500
    highlight_event_id: guji-释迦牟尼-event-kuyin
  - key: closure
    name: 众闻欢喜信受奉行
    labels:
      zh:
      - 信受圆满
    start_date: -500
    highlight_event_id: guji-释迦牟尼-event-kuyin
  decisions:
  - date: -500
    title_zh: 以反问试外道令知无能答者
    rationale: 唯如来及弟子能知味患离故先令比丘反诘以显正法胜
  - date: -500
    title_zh: 详陈淫色痛三事分别说离
    rationale: 淫因求财致斗诤刑罚恶趣色随老病死坏痛以离欲四禅为味无常为患故须知离
- id: guji-释迦牟尼-endeavor-2
  title_zh: 教诲弟子善对异学不诤
  summary: 教比丘闻异说不然可不呰蔑从容还白世尊以智慧观察后方决择
  phases:
  - key: brewing
    name: 异道自称亦说淫色痛
    labels:
      zh:
      - 异说酝酿
    start_date: -500
    highlight_event_id: guji-释迦牟尼-event-lunwen
  - key: breakthrough
    name: 制止诤论默然舍去
    labels:
      zh:
      - 离诤突破
    start_date: -500
    highlight_event_id: guji-释迦牟尼-event-qingfa
  - key: climax
    name: 建立味患离决择标准
    labels:
      zh:
      - 立标准高潮
    start_date: -500
    highlight_event_id: guji-释迦牟尼-event-kuyin
  - key: closure
    name: 能自止亦能止他与住俱止
    labels:
      zh:
      - 化他圆满
    start_date: -500
    highlight_event_id: guji-释迦牟尼-event-kuyin
  decisions:
  - date: -500
    title_zh: 闻异论不急然可不急呰蔑
    rationale: 避免无因诤论保持正念还咨世尊以广知义
  - date: -500
    title_zh: 以知如真为自止止他之本
    rationale: 不知味患离则不能自止止他知则有是处故立修行准绳
