  - date: -483-02-14
    title_zh: 先显乳哺力后显神足等
    rationale: 由近及远先破力慢后引深法次第调伏
- id: guji-释迦牟尼-endeavor-2
  title_zh: 临灭说无常十力付嘱
  summary: 示现诸力后说十力广大终归无常最胜付嘱四衢建塔令五百力士发无上道意
