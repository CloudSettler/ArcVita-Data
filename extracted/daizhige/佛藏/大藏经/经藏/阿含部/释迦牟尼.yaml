    rationale: 越只行七法则不可胜令王知胜在德不在兵亦令僧效法得久住
  - date: -483-01-06
    title_zh: 集千二百五十比丘重说持法
    rationale: 以国之七法转明僧之七法数相聚会和合持戒方能令正法久住
- id: guji-释迦牟尼-endeavor-2
