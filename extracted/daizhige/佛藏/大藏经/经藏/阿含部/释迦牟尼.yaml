    start_date: -500-05-03
    highlight_event_id: guji-释迦牟尼-event-wuyun
  decisions:
  - date: -501-01-01
    title_zh: 常与大众俱行教化
    rationale: 独行易倾多众相依可互相策励且令说法广被故与五百比丘俱会恒水侧
  - date: -500-05-01
    title_zh: 询而后说启发自见
    rationale: 先问汝等颇见此沫聚为恒水所漂不令亲见而后开示空义使信解坚固
