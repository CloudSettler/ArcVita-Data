  - key: breakthrough
    name: 初说三种
    labels:
      zh:
      - 日喻种子喻
    start_date: -484-10-02
    highlight_event_id: guji-释迦牟尼-event-2
  - key: climax
    name: 后说三种
    labels:
      zh:
      - 火喻涅槃
    start_date: -484-10-02
    highlight_event_id: guji-释迦牟尼-event-2
  - key: closure
    name: 劝修禅思
    labels:
      zh:
      - 慈愍教授
    start_date: -484-10-02
    highlight_event_id: guji-释迦牟尼-event-2
  decisions:
  - date: -484-10-02
    title_zh: 以六种人明善不善消长
    rationale: 令众自观众生善根断续及不善根断续知清净与断绝之分
  - date: -484-10-02
    title_zh: 嘱众静处树下禅思莫放逸
    rationale: 以慈愍饶益弟子令闻法已修行免后变悔
