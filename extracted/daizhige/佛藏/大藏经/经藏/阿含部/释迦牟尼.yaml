  - title_zh: 世香局限与遍闻之疑
    description_zh: 阿难疑根香花香子香可遍闻当破常见显正见
  - title_zh: 持戒得敬与解缚之道
    description_zh: 如何令近事男女持不杀不盗不淫不妄不饮酒而得十方称赞爱敬并远离魔缚
  lesson: 持佛净戒行善法者戒香有风无风遍闻十方胜一切世间花果沉檀之香
  summary_first_person: 吾在舍卫祇树给孤独园与大比丘众俱时答阿难所问明世间三香非遍闻唯近事男女持佛净戒行善法者戒香遍十方咸得称赞爱敬能解世缚令魔远离
