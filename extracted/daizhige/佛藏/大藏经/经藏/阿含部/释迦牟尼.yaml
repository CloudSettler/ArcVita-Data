  dilemmas:
  - 世间堕二边行贪欲无净志与猗著身爱不能精进如何令舍家弟子远离边行得值佛道
  - 四谛三转合十二事未净不证如何令千比丘诸天神等得法眼净漏尽意解成阿罗汉
  lesson: 舍贪欲身爱之二边受八正道之中得眼得慧断痴爱漏结而致泥洹
  summary_first_person: 吾昔从无数劫来为名色转受苦无量今痴爱意止漏结情解诸根已定生死已断不复转于五道吾在波罗奈鹿野苑中告千比丘舍二边行受八正道说苦集灭道四谛三转十二行令阿若拘邻等远尘离垢得法眼净千比丘皆得阿罗汉天上天下莫不遍闻三千世界皆震动是为无上法轮初转
  source_urls:
  - https://tripitaka.cbeta.org/T01n0109
  - https://daizhige.org/anzhi/fo-shuo-zhuan-fa-lun-jing
