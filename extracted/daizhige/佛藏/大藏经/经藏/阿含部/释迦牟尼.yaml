  title_zh: 恒水侧以聚沫五喻开示五蕴皆空
  description: 在阿迎阇恒水侧与五百比丘俱见水上大聚沫为水所漂以聚沫水泡野马芭蕉幻术五喻分别开示色痛想行识五阴空无所有无来无往亦不坚固并以偈总摄
  phases:
  - key: brewing
    name: 恒水观沫
    labels:
