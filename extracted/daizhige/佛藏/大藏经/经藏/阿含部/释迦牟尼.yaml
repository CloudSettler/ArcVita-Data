  decisions:
  - date: -485-08-15
    title_zh: 当众自陈三业求忍
    rationale: 以无过者先求忍故，令有过者敢于发露，解夏如法清净
  - date: -485-08-15
    title_zh: 平等忍可五百苾刍
    rationale: 以佛忍印众忍故，令证果者不慢，未证者不惧，僧团安隐
- id: guji-释迦牟尼-endeavor-2
  title_zh: 印证舍利弗及五百圣众
  summary_zh: 赞舍利弗具戒多闻大慧如金轮王子绍法王位，分别五百苾刍三明俱解脱慧解脱皆住真实，授记一学人当证满果
  phases:
  - key: brewing
    name: 舍利弗陈白无忍可
    labels:
      zh: 蕴酿
    start_date: -485-08-15
