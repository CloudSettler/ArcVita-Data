  summary_first_person: 吾为婆迦婆一时在阿迎阇恒水侧与五百比丘俱见大聚沫为水所漂即告诸比丘谛观察之思惟分别色如聚沫痛如水泡想如野马行如芭蕉识如幻术皆空无所有无来无往亦不坚固汝等当如是观而得离执
