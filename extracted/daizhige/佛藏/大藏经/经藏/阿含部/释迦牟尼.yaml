    start_date: -500-05-01
    highlight_event_id: guji-释迦牟尼-event-hengshui
  - key: climax
    name: 摄众入观
    labels:
      zh: 闻法得益
    start_date: -500-05-02
    highlight_event_id: guji-释迦牟尼-event-wuyun
  - key: closure
    name: 欢喜奉行
    labels:
