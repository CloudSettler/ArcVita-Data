  title_zh: 跋耆阿褥风城记提婆达多一劫堕泥犁
  summary: 于下晡后与阿难及众比丘至阿夷陀婆池澡浴告众提婆达多放逸失处无白法如毛发故一向记堕恶趣泥犁住一劫难救
  phases:
  - key: brewing
    name: 池畔起问
    labels:
