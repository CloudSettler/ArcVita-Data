      - 记别缘起
    start_date: -484-10-01
    highlight_event_id: guji-释迦牟尼-event-1
  - key: breakthrough
    name: 一向悬记
    labels:
      zh:
      - 堕狱悬记
    start_date: -484-10-01
    highlight_event_id: guji-释迦牟尼-event-1
  - key: climax
    name: 粪厕为喻
    labels:
      zh:
      - 无白法喻
    start_date: -484-10-01
    highlight_event_id: guji-释迦牟尼-event-1
  - key: closure
    name: 决众疑网
    labels:
      zh:
      - 断疑立信
    start_date: -484-10-01
    highlight_event_id: guji-释迦牟尼-event-1
  decisions:
  - date: -484-10-01
    title_zh: 一向记提婆达多堕泥犁一劫
    rationale: 不见其有白法如毛发若有则不一向记故据实而记无曲徇
  - date: -484-10-01
    title_zh: 以大厕没身为喻晓阿难
    rationale: 令众了知满恶不善着结必受苦热生老病死堕泥犁之理
- id: guji-释迦牟尼-endeavor-2
  title_zh: 为阿难分别说大人根相六种人
  summary: 应阿难请说前三后三六种人以日出没种子田火燃灭为喻明善恶法消长清净断绝堕恶趣及现法般涅槃之别劝众静处禅思
  phases:
  - key: brewing
    name: 阿难请法
