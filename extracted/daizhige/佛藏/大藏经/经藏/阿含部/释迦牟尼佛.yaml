    rationale: 施福世间共见归依出世难知故须次第开显令舍小趣大
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 次第开示五戒慈厌引导出世成佛
  summary: 承三归功德次说五戒具足最胜复说弹指慈念复说一切世间不可乐想能灭生死终成佛道为最胜
