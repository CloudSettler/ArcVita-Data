    title_zh: 以五戒功德覆三归
    rationale: 归依明向背持戒明止作故须明功德满具方能进趣慈行
  - date: -0485-04-04
    title_zh: 以厌离想为究竟
    rationale: 慈念虽广尚在生死厌离能断生死直趣佛道故判为最胜以收全经
