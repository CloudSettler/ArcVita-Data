    rationale: 五乐妓兵不能除心怵惕唯佛能开解疑惑故严驾夜出
  - date: -0491
    title_zh: 舍六师断见不信不受
    rationale: 六师问奈答瓜言无罪福因果颠倒无本末不能疗忧故舍去
