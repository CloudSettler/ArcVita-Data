    title_zh: 下乘脱冠步诣讲堂问讯世尊
    rationale: 以敬法故屏毖五事去盖收刀欲以诚心咨启疑结
  - date: -0491
    title_zh: 受持佛说寂志果法终身自归
    rationale: 闻出家持戒知足禅定神通现法乐住真实不虚能除忧结故信受
events:
- id: guji-阿阇世-event-birth
  date: -0508
  year_of: -508
  title_zh: 生于王舍城为频婆娑罗王子
  description: 为摩揭陀太子后因贪国篡位即王
- id: guji-阿阇世-event-anxiety
  date: -0492
  year_of: -492
  title_zh: 七月十五上寂安观愁悒求除忧术
  description: 新岁过腊与群臣百官上观自陈修非时愁悒不改问何方便除怵惕
- id: guji-阿阇世-event-ask-heretics
  date: -0491
  year_of: -491
  title_zh: 遍问不兰迦叶等六师沙门果证
  description: 历问不兰迦叶莫轲离阿夷专波休迦旃先比卢持尼揵子皆以断常见答不解而舍退
- id: guji-阿阇世-event-visit-buddha
  date: -0491
  year_of: -491
  title_zh: 夜从耆域诣耆域奈园见佛
  description: 乘仁调象率五百从夜出王舍城然炬至奈园下乘步诣佛问讯却住一面问寂志梵志法律得道证
- id: guji-阿阇世-event-hear-dharma
  date: -0491
  year_of: -491
  title_zh: 闻佛说寂志果经开解归依
  description: 蒙佛说出家戒品知足禅定四禅神通现世果证心结得解欢喜奉行
- id: guji-阿阇世-event-death
  date: '-0460'
