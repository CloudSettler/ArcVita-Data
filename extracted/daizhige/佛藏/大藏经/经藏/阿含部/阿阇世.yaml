  reign_ref: 摩揭陀国王
  archetype: 悔过求法之君
  dilemmas:
  - 弑父篡位后愁悒怵惕寝食难安
  - 遍问六师所答颠倒无本末不能开解
  - 云何于佛法律得道证入寂然道求安隐
  lesson: 为恶必悔唯舍邪见信受正法持戒禅定可得心安
  summary_first_person: 我本以贪国故害父自立虽得岁禄而愦惨不次遍问外道皆以无因无果见答不解我忧乃夜诣耆域奈园见佛闻寂志梵志果法心乃开解愿为优婆塞终身自归
