  lesson: 弃邪见除戏论于无记处默然而于因果趣生如实知方能接引众生归于三宝
  summary_first_person: 我是阿难世尊堂弟与常随侍者以多闻第一著称世尊般涅槃不久我在罗阅只城迦兰陀竹园遇旧友邪命问世尊何以不记世间常无常等我答世尊有智见弃邪见除邪见于此十事不记而如实知邪见相应之趣生后世遂劝彼归依佛法僧
