    description: 既敬事费迦沙为世豪贤又亲见佛陀圣智当择师承还是择真理
  - title_zh: 种姓贵与持戒贵孰重
    description: 生为梵种自恃清贵受佛诘难后当守种姓骄慢还是守净戒求解脱
  lesson: 师贵不如道真种姓贵不如戒净亲见圣者当舍骄慢择善而从
  summary_first_person: 我是阿颰费迦沙上首弟子奉师命率五百人往观佛相与佛论杀生种姓八戒得闻清信士戒与沙门二百五十戒归白本师共设供迎佛从骄慢求证转入信解
