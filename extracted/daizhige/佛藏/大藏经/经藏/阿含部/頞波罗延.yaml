  lesson: 尊贵不在血统在善行，心意善者生天为人，恶者堕三恶道
  summary_first_person: 我本舍卫少年婆罗门，为众所师，持种姓最尊之说往问世尊，蒙以通婚奴子胎生浴水火船日月骡喻开示，方知贵贱在行不在种，遂稽首归依受持。
