  description_zh: 佛以通婚生子奴子易位四种善恶同生天堕狱浴水不别王臣不问种火船胎生等喻，复说阿洫变身问七婆罗门本生，破口生最尊之说
  location_zh: 舍卫国祇树给孤独园
