    rationale: 见佛言心意善恶定贵贱升堕，种姓浴火渡水无别，自念前后被遮，遂舍诤心从正道
  - date: '-0470'
    title_zh: 与五百人同归依受检敛
    rationale: 既悟一为百百为千皆归无为一道，愿哀畜受持，朝来不食稽首而去
