  - 夫家奉六千梵志命我礼拜而梵志露形无惭当拜与不拜
  - 身陷满富邪见之城当苟安自保还是发愿请佛度脱满城
  lesson: 守正不屈以信感圣一人发大愿能令满城得度
  summary_first_person: 我是舍卫长者阿那邠邸之女须摩提女，自幼归依佛法，远适满富满财长者家，夫家举族事奉梵志，我独不肯向无惭之人作礼，宁受辱骂不改初心，后登楼焚香遥请世尊，世尊率大比丘众现大神变赴我之请，满城人民皆见佛闻法，我宿愿得遂，方知来此正是为度众生而来
  source_urls:
