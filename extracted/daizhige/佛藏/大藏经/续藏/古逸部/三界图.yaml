  title_zh: 撰述缘起
  description: 古逸传本托为唐代撰述三界图缘起于弘传俱舍断惑之教也
- id: guji-三界图-event-1
  date: '0735-01-01'
  year_of: 735
  title_zh: 绘三界配四谛总表
  description: 分欲界色界无色界各配苦集灭道列无明慢嗔贪疑戒禁见取邪见边见身见等
- id: guji-三界图-event-2
  date: '0740-01-01'
