  date: '0755-01-01'
  year_of: 755
  title_zh: 明忍智对治分齐
  description: 苦法忍智苦类忍智对治身见等十种余三谛各对治七使修断以比忍比智对治贪嗔慢无明
- id: guji-三界图-event-death
  date: '0780-01-01'
  year_of: 780
