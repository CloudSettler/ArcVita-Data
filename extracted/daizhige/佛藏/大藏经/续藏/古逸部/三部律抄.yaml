endeavors:
- id: guji-三部律抄-endeavor-1
  title_zh: 会通三部决结界布萨安居自恣之疑
  description: 钞集四分十诵僧祇三部律文，以问答决结界大小村，不失衣界，布萨十五种，安居前后与受日，自恣举罪之疑
  phases:
  - key: brewing
    name: 酝酿结界布萨之疑
    labels:
      zh: 结界大小村与布萨异说
    start_date: 0660-01-01
    highlight_event_id: guji-三部律抄-event-jiejie
  - key: breakthrough
    name: 转折会通十诵僧祇
    labels:
      zh: 以十诵聚落界证僧祇大村
    start_date: 0670-01-01
    highlight_event_id: guji-三部律抄-event-jiejie
  - key: climax
    name: 高潮决安居自恣
    labels:
      zh: 受日渐开与自恣举罪
    start_date: 0680-01-01
    highlight_event_id: guji-三部律抄-event-anju
  - key: closure
    name: 收束成布萨安居品
    labels:
      zh: 明五种持律与自恣五德
    start_date: 0685-01-01
    highlight_event_id: guji-三部律抄-event-anju
  decisions:
  - date: 0670-01-01
    title_zh: 依十诵证僧祇大村义
    rationale: 小村僧可集则须尽集，大村众难集方开随方作法，故非一切处皆成
  - date: 0680-01-01
    title_zh: 判受日为渐开次第
    rationale: 初开七日次开十五日乃至一月与三十九夜，随事远近安置三部故相异而理通
- id: guji-三部律抄-endeavor-2
  title_zh: 明净地僧残杂事以持律久住
  description: 明四种净地内煮内宿开制，僧残覆藏别住摩那埵出罪法，及分物教诫舍戒杂事，令学律者决断无畏
  phases:
  - key: brewing
    name: 酝酿净地开制之惑
    labels:
      zh: 饥时开净与丰时还制
    start_date: 0688-01-01
    highlight_event_id: guji-三部律抄-event-jingdi
  - key: breakthrough
    name: 转折辨舍净地得失
    labels:
      zh: 宿食戒存故不应一向舍
    start_date: 0690-01-01
    highlight_event_id: guji-三部律抄-event-jingdi
  - key: climax
    name: 高潮明僧残出罪
    labels:
      zh: 别住摩那埵夺三十五事
    start_date: 0695-01-01
    highlight_event_id: guji-三部律抄-event-sengcan
  - key: closure
    name: 收束成杂事品
    labels:
      zh: 五德分物与教诫比丘尼
    start_date: 0700-01-01
    highlight_event_id: guji-三部律抄-event-sengcan
  decisions:
  - date: 0690-01-01
    title_zh: 不许终身施主滥开净食
    rationale: 律无其文，宿食戒犹存，若一向舍则戒无所持，故当依饥丰开制行舍
  - date: 0695-01-01
    title_zh: 严别住摩那埵失宿之防
    rationale: 八事失宿与同室不同室之辨，务令覆藏发露分明，出罪如法不断律种
