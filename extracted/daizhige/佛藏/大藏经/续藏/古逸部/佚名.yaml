  description: 约生于唐代习律习禅亲近布萨羯磨仪轨
- id: guji-佚名-event-1
  type: career
  title_zh: 作入堂说偈及受水浴筹偈
  date: 0735-06-01
  year_of: 735
  description: 作持戒清净如满月身口皎洁无瑕秽清净和合无违诤乃可同布萨又作八功德水净诸尘灌掌去垢及罗汉圣僧集凡夫众和合香汤浴净布萨度众生诸偈
- id: guji-佚名-event-2
  type: career
  title_zh: 作香汤行香受筹还筹偈
  date: 0740-06-01
  year_of: 740
  description: 作香水勋沐澡诸垢法身具足五分充般若圆照解脱满又作戒香定香解脱香光明云台遍世界供养十方无量佛又作金刚无碍解脱筹欢喜顶戴受及具足清净受还此筹坚持禁戒无缺犯诸偈
- id: guji-佚名-event-3
  type: career
  title_zh: 作清净妙偈及布萨竟四快颂
  date: 0750-06-01
  year_of: 750
  description: 作清净如满月清净应布萨身口业清净乃同布萨又作诸佛出世第一快闻法奉行欢喜快大众和合寂灭快众生离苦安乐快以结叹流通
- id: guji-佚名-event-death
