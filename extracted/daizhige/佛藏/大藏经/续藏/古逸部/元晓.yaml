    rationale: 深山讲说难益下根，故携瓢入城村歌舞劝化，令愚夫愚妇同归净土
  - date: '0671'
    title_zh: 会通空有立一心和诤
    rationale: 百家诤论徒增烦恼，故立一心为本，和会起信中观唯识，息诤止争
