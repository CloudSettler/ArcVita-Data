  - date: 0737-01-01
    title_zh: 不居净土常住地狱恶趣
    rationale: 为救最苦众生故舍安乐直入刀山镬汤之处拔济沉沦
  - date: 0794-07-30
    title_zh: 以七月三十为圣诞示寂纪念
    rationale: 令后世于此日斋戒诵经忆念大愿相续救度事业不绝
events:
- id: guji-地藏菩萨-event-birth
  title_zh: 化身降生新罗王室
  date: 0696-01-01
  year_of: 696
  place_zh: 新罗国王室
  description: 相传为新罗王子金乔觉俗姓金氏幼而聪慧慈悲好佛后渡海入唐被尊为地藏菩萨化身
- id: guji-地藏菩萨-event-1
  title_zh: 开示上旬三斋除罪
  date: 0740-01-08
  year_of: 740
  place_zh: 阎浮提化境
  description: 示一日童子下念定光如来不涂刀枪地狱除罪四十劫八日太子下念药师琉璃光佛不涂粪屎地狱除罪三十劫十四日察命下念贤劫千佛不涂镬汤地狱除罪一千劫
- id: guji-地藏菩萨-event-2
  title_zh: 开示中旬四斋免堕
  date: 0741-07-15
  year_of: 741
  place_zh: 阎浮提化境
  description: 示十五日五道大将军下念阿弥陀佛不堕寒冰地狱除罪二百劫十八日阎罗王下念观世音菩萨不堕剑树地狱除罪九十劫二十三日大将军下念卢舍那佛不堕饿鬼地狱除罪一千劫二十四日太山府君下念地藏菩萨不堕斩斫地狱除罪一千劫
- id: guji-地藏菩萨-event-3
  title_zh: 开示下旬三斋付嘱流通
  date: 0741-08-30
  year_of: 741
  place_zh: 阎浮提化境
  description: 示二十八日帝释下念阿弥陀佛不堕铁锯地狱除罪九十劫二十九日四天王下念药师上菩萨不堕硙摩地狱除罪七千劫三十日梵天王下念释迦牟尼佛不堕灰河地狱除罪八千劫付嘱众生奉行
- id: guji-地藏菩萨-event-death
  title_zh: 示寂九华肉身不坏
  date: 0794-07-30
  year_of: 794
  place_zh: 九华山
  description: 唐贞元十年七月三十日跏趺示寂年九十九肉身不坏塔于神光岭后世以七月三十为地藏圣诞永志大愿
