  archetype: 大愿救度者
  dilemmas:
  - 地狱众苦无量而愿力宏深以何方便令阎浮众生定时止恶修善
  - 众生根钝忘失正念以何简易法门令持斋念佛即得除罪多劫
  lesson: 地狱未空誓不成佛以十斋持斋念佛接引众生离苦得度
  summary_first_person: 吾以大悲愿力观察阎浮众生恶业深重故开示每月十斋日令持斋念定光药师贤劫千佛阿弥陀观音卢舍那地藏药师上释迦诸佛菩萨名号免堕刀枪粪屎镬汤寒冰剑树饿鬼斩斫铁锯硙摩灰河等地狱除罪多劫乃至成佛
  source_urls:
