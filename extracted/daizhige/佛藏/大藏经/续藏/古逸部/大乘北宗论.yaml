  dilemmas:
  - title_zh: 有修与无修之辨
    description: 若言修学即堕生死若言无修又恐废弃方便如何直指人心而不落断灭
  - title_zh: 有言与无言之辨
    description: 欲以文字显无文字欲以言说显无言说如何不执言筌而得本意
  lesson: 离念无心方为真修无得无证即是涅槃
  summary_first_person: 我以无心说大乘心我尚不起布施持戒等胜心何况悭贪触犯等劣心有文有字有修有学皆是生死无文无字无修无学方名涅槃愿后学离诸名言直见本心
