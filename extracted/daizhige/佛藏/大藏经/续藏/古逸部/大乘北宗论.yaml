    rationale: 以尚不起胜心泯何况劣心欲令学人不生取舍直入无念故作二十重对破
  - date: 0712-01-01
    title_zh: 以偈重说忧乐从心
    rationale: 恐闻者执无心为断灭故示忧乐由妄心明妄息则忧乐俱寂以显心平
