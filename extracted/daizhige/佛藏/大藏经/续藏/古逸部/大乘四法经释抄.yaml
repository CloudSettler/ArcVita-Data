  - date: 0750-03-10
    title_zh: 略而不繁释证信序
    rationale: 证信通诸经共有若一一陈则成繁广故略明时方人教理行果
  - date: 0755-08-20
    title_zh: 以四念处对治四倒
    rationale: 为令不起常乐我净倒见得成圣道故观身不净受苦心无常法无我
