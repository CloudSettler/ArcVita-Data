  - key: breakthrough
    name: 示须弥入芥子
    labels:
      zh:
      - 心不思离系缚
    start_date: 0720-03-15
    highlight_event_id: guji-大乘无生方便门-event-2
  - key: climax
    name: 示海水入毛孔
    labels:
      zh:
      - 色如同相无娆
    start_date: 0722-06-01
    highlight_event_id: guji-大乘无生方便门-event-2
  - key: closure
    name: 归自然无碍解脱
    labels:
      zh:
      - 根本后得自在
    start_date: 1036-01-01
    highlight_event_id: guji-大乘无生方便门-event-death
  decisions:
  - date: 0720-03-15
    title_zh: 以无思显不思议解脱
    rationale: 起心思议即缚不起心思议则心色俱离同一如相故须弥芥子无增减
  - date: 0722-06-01
    title_zh: 以有方便慧解不住涅槃
    rationale: 见空不取空不厌生死不住涅槃方能庄严佛土成就众生归无碍道
