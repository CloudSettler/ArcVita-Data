  decisions:
  - date: 0705-06-01
    title_zh: 立离念为佛体
    rationale: 心体离念等虚空界无所不遍即是如来平等法身故不取一切相
  - date: 0710-03-01
    title_zh: 立耳根不动为慧门正定
    rationale: 知六根本来不动常闻不随声转方免贪著禅味堕二乘邪定
- id: guji-大乘无生方便门-endeavor-2
  title_zh: 显示不思议无碍解脱道
  description: 明诸法正性说须弥纳芥子海入毛孔证心色如如自然无碍解脱
  phases:
  - key: brewing
    name: 明染净二法界
