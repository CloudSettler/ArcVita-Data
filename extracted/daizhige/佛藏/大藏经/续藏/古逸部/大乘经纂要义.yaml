  title_zh: 敬礼归依明三身三宝
  date: 0735-03-01
  year_of: 735
  description: 敬礼无上佛证三身，明法身无分别智报身卢舍那相好化身降魔转法轮示涅槃，及法宝十二分教僧宝菩萨罗汉凡夫比丘轨范，劝供养归依生福德芽
- id: guji-大乘经纂要义-event-2
  person_qid: guji-大乘经纂要义
  type: career
  title_zh: 喻人身难得立十善戒
  date: 0742-06-01
  year_of: 742
  description: 以大海盲龟百年一出遇浮木孔喻人身难得，明永离八难，引仙人娇答摩草刺鹿蝇受木签报与童子施僧白石生豪富雨七宝事，明十恶杀盗淫等感三涂十善得人天胜处
- id: guji-大乘经纂要义-event-3
  person_qid: guji-大乘经纂要义
  type: career
  title_zh: 辨二谛十二因缘明三乘
  date: 0748-09-01
  year_of: 748
  description: 明世谛假有漏无常苦空无我无漏空无我，明无明行识乃至生老死轮转六道，钝根证声闻预流无余涅槃中根证辟支上人取向大乘，菩萨经十地修六度四摄具十力四无畏证佛地不般涅槃
- id: guji-大乘经纂要义-event-death
  person_qid: guji-大乘经纂要义
