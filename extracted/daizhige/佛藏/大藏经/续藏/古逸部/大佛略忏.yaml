    title_zh: 定先敬三宝为礼忏先行
    rationale: 三宝是一切众生良佑福田归向则灭无量罪长无量福离生死得解脱故须先归依
  - date: '0721-06-01'
    title_zh: 摄众罪为三障以便忏除
    rationale: 罪相无量大而言之不出烦恼业果报三者能障圣道及人天妙事故目为三障以便对治
