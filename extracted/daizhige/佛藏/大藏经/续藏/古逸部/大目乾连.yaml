  birth_date: '-0560'
  death_date: -0480
  era: 东周春秋战国之际，古印度佛陀住世时
  reign_ref: 释迦牟尼在鹿苑双林弘法时
  archetype: 孝亲救母的神通第一比丘
  dilemmas:
  - 在俗奉养与出家求道之间如何报答二亲
  - 神通自在与业力难违之间如何救度慈母
  lesson: 神通不敌业力，唯依佛敕设盂兰盆供十方众僧，以众力方能救倒悬之苦
  summary_first_person: 我本名罗卜，父母既没，三周礼毕，投佛出家，号神通大目乾连，以道眼遍寻慈母，历阎罗冥路诸狱至阿鼻相见，仗佛锡杖威神，还请世尊开盂兰盆方便，以斋僧修福救母脱苦
  source_urls:
  - https://daizhige.org/佛藏/大藏经/续藏/古逸部/大目乾連冥間救母變文並圖.html
  - https://cbetaonline.dila.edu.tw/zh/T2858
endeavors:
- id: guji-大目乾连-endeavor-1
  title_zh: 投佛出家证阿罗汉成神通第一
  summary_zh: 罗卜父母没后礼毕，往鹿苑双林投佛，阿难为剃发，衣化袈裟，证阿罗汉，复受具足戒，入深山宴坐观空，得自在神通，为佛弟子中神通第一
  phases:
  - key: brewing
    name: 在俗守信奉亲
    labels:
      zh: 在俗罗卜
    start_date: '-0560'
    highlight_event_id: guji-大目乾连-event-birth
  - key: breakthrough
    name: 投佛剃发出家
    labels:
      zh: 出家证果
    start_date: '-0530'
    highlight_event_id: guji-大目乾连-event-ordination
  - key: climax
    name: 深山坐禅得通
    labels:
      zh: 神通第一
    start_date: -0529
    highlight_event_id: guji-大目乾连-event-meditation
  - key: closure
    name: 受戒住持声闻上首
    labels:
      zh: 声闻上首
    start_date: -0528
    highlight_event_id: guji-大目乾连-event-meditation
  decisions:
  - date: '-0530'
    title_zh: 父母既没投佛出家
    rationale: 为报二亲深恩，不恋富贵，往双林求佛度脱，专心学道以度亲
  - date: -0529
    title_zh: 先证小果后学大行
    rationale: 依穷子喻先除粪后受价，入深山观空坐禅，降心住心以发神通
- id: guji-大目乾连-endeavor-2
  title_zh: 冥间巡历救母兴盂兰盆斋
  summary_zh: 以道眼不见慈母，上天访父，下冥路历阎罗奈河五道诸狱，仗佛锡杖威神入阿鼻见母受苦，还白世尊，依教于七月十五日设盂兰盆供十方众僧，以众力救母
  phases:
  - key: brewing
    name: 天上寻父冥路访母
    labels:
      zh: 寻亲问讯
    start_date: '-0527'
    highlight_event_id: guji-大目乾连-event-search
  - key: breakthrough
    name: 历阎罗五道诸狱
    labels:
      zh: 巡历地狱
    start_date: '-0527'
    highlight_event_id: guji-大目乾连-event-search
  - key: climax
    name: 阿鼻见母仗佛威入
    labels:
      zh: 阿鼻相见
    start_date: '-0526'
    highlight_event_id: guji-大目乾连-event-avici
  - key: closure
    name: 请佛开盂兰盆方便
    labels:
      zh: 盂兰救苦
    start_date: '-0526'
    highlight_event_id: guji-大目乾连-event-ullambana
  decisions:
  - date: '-0527'
    title_zh: 不惮冥涂亲巡历
    rationale: 六道不见慈母，虽为圣人亦亲往阎罗五道诸狱逐一检问，不以苦难为辞
  - date: '-0526'
    title_zh: 依佛敕设盂兰盆供
    rationale: 知独力不敌业力，非十方众僧解夏自恣日众力不可救，故设百味盆供以救倒悬
events:
- id: guji-大目乾连-event-birth
  title_zh: 降生在俗名罗卜
  date: '-0560'
  year_of: -560
  location_zh: 南阎浮提摩揭陀国
  summary_zh: 在俗名罗卜，父名辅相，母号青提夫人，家大富，深信三宝，兴易分财令母设斋供佛
- id: guji-大目乾连-event-ordination
  title_zh: 双林投佛出家证果
  date: '-0530'
  year_of: -530
  location_zh: 鹿苑双林佛所
  summary_zh: 父母没三周礼毕，往双林问佛，阿难为剃发，衣化袈裟，登时证阿罗汉，号神通大目乾连
- id: guji-大目乾连-event-meditation
  title_zh: 深山宴坐得神通自在
  date: -0529
  year_of: -529
  location_zh: 深山幽净处
  summary_zh: 剃除须发已入深山，端身盘石观空坐禅，降心住心，掷钵腾空，上至梵天，得神通自在
- id: guji-大目乾连-event-search
  title_zh: 天上访父冥路巡狱寻母
  date: '-0527'
  year_of: -527
  location_zh: 天庭阎罗所奈河五道将军所
  summary_zh: 以道眼不见母，上天见父知母堕落，辞父下冥路，历阎罗殿奈河五道及刀山剑树铜柱铁床诸狱检问，皆言母已被牒入阿鼻
- id: guji-大目乾连-event-avici
  title_zh: 仗佛锡杖入阿鼻见母
  date: '-0526'
  year_of: -526
  location_zh: 阿鼻地狱铁围城
  summary_zh: 还诣佛所得赐锡杖，专念佛名，振开黑城明门，入阿鼻见母受猛火剑轮诸苦，狱卒不敢遮
- id: guji-大目乾连-event-ullambana
  title_zh: 设盂兰盆斋众僧救母
  date: -0526-07-15
  year_of: -526
  location_zh: 娑罗林佛所
  summary_zh: 佛开方便，于七月十五日众僧解夏自恣日，天堂启户地狱门开时，设盂兰百味盆供三尊大众，以福资转生胜处，救倒悬之窘
- id: guji-大目乾连-event-death
  title_zh: 先佛入灭
  date: -0480
  year_of: -480
  location_zh: 古印度
  summary_zh: 为佛上首弟子，神通第一，于佛涅槃前先般涅槃，后世奉为盂兰救母之孝圣
