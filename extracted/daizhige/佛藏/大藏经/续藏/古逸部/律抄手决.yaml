  lesson: 随犯随制须明缘起会通诸部方能持戒不迷
  summary_first_person: 我曾游蒲晋降泽诸地追踪抄主旧迹见时俗尺度异于古制故于行事钞第三卷随文作手决分别杀妄房衣诸戒但愿后学因决明律不谬持犯
