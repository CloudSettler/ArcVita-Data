endeavors:
- id: guji-律抄手决-endeavor-1
  title_zh: 注解杀妄重戒明使杀虚说诸相
  summary: 依毗舍离不净观杀事及舍卫妄说得圣等缘分别杀遣使重使展转使与大妄语七句结罪开合
  phases:
  - key: brewing
    name: 搜集制戒缘起
    labels:
      zh:
      - 毗舍离杀事
    start_date: 700-03-01
    highlight_event_id: guji-律抄手决-event-1
  - key: breakthrough
    name: 分判使杀五相
    labels:
      zh:
      - 杀戒分别
    start_date: 702-05-01
    highlight_event_id: guji-律抄手决-event-1
  - key: climax
    name: 正解大妄七句
    labels:
      zh:
      - 妄语结罪
    start_date: 705-06-01
    highlight_event_id: guji-律抄手决-event-2
  - key: closure
    name: 决了增上慢开缘
    labels:
      zh:
      - 持犯决了
    start_date: 708-08-01
    highlight_event_id: guji-律抄手决-event-2
  decisions:
  - date: 702-05-01
    title_zh: 以五钱为允从急定盗
    rationale: 当部善见皆言五钱犯重更不劳引他部及古钱故径断以止争
  - date: 705-06-01
    title_zh: 除增上慢不结大妄
    rationale: 无师自谓得圣由慢非诳故须开缘以别虚诳妄语重罪
- id: guji-律抄手决-endeavor-2
  title_zh: 疏解房衣轻戒立尺度轨范
  summary: 因阐陀造房斫神树及畜长离衣等事考姬周隋尺步制并解二房过量与衣药离宿开遮
  phases:
  - key: brewing
    name: 游晋魏考俗度
    labels:
      zh:
      - 蒲晋旧游
    start_date: 695-04-01
    highlight_event_id: guji-律抄手决-event-3
  - key: breakthrough
    name: 定搩手步制
    labels:
      zh:
      - 尺度考定
    start_date: 698-06-01
    highlight_event_id: guji-律抄手决-event-3
  - key: climax
    name: 解二房过量妨难
    labels:
      zh:
      - 房舍轨范
    start_date: 710-04-01
    highlight_event_id: guji-律抄手决-event-2
  - key: closure
    name: 通解衣药离宿
    labels:
      zh:
      - 衣食行护
    start_date: 712-09-01
    highlight_event_id: guji-律抄手决-event-4
  decisions:
  - date: 698-06-01
    title_zh: 以今尺计步为四尺八寸
    rationale: 古忽丝毫厘分寸步相承今尺既变若用古数不成六尺之步故据见行校定
  - date: 710-04-01
    title_zh: 房主死远去属四方僧
    rationale: 房本为僧修道死绝无主若听私分则生诤故依多论处分以安住处
