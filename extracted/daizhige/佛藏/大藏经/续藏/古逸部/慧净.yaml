person:
  qid: guji-慧净
  name_zh: 慧净
  names:
    zh: 慧净
    en: Huijing
  lifespan:
    birth:
      date: 0578
      precision: 年
      is_circa: true
      raw: 约隋开皇十八年生
    death:
      date: '0654'
      precision: 年
      is_circa: true
      raw: 约唐永徽五年寂
  birth_date: 0578
  death_date: '0654'
  era: 唐
  reign_ref: 贞观
  archetype: 经义疏解型高僧
  dilemmas:
  - 文残义阙时如何守本经洗僧植福正意而补释不断
  - 小善微行如何会通人天凡圣大果以坚俗众净信
  lesson: 以七物洗浴喻七病得除，小因大果皆由用心不等，劝人奉行自得清净
  summary_first_person: 我是唐释慧净，愍俗众疏野随流未曾为福，乃疏解温室洗浴众僧经，明七物七病七福因果，以涌泉绳墨二义摄持，劝以洗僧净业为登十地之基，愿异世共观津流远代
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/续藏/古逸部/温室经疏.md
  - https://daizhige.org/佛藏/大藏经/续藏/古逸部/温室经疏.html
endeavors:
- id: guji-慧净-endeavor-1
  title_zh: 注疏温室洗浴众僧经
  summary: 以五义科判经文，释只域请洗缘起，明七物七病七福及偈颂果报，断行愿二疑以显流通
  phases:
  - key: brewing
    name: 发心科经立纲
    labels:
      zh: 酝酿
    start_date: 0628
    highlight_event_id: guji-慧净-event-faxin
  - key: breakthrough
    name: 释七物除七病
    labels:
      zh: 突破
    start_date: '0630'
    highlight_event_id: guji-慧净-event-faxin
  - key: climax
    name: 明七福相似果报与增上果
    labels:
      zh: 高潮
    start_date: '0631'
    highlight_event_id: guji-慧净-event-shucheng
  - key: closure
    name: 疏成标名流通
    labels:
      zh: 收束
    start_date: '0632'
    highlight_event_id: guji-慧净-event-shucheng
  decisions:
  - date: 0628
    title_zh: 决定以涌泉绳墨二义释经题
    rationale: 经理丰言约，须以注而无竭明常，以楷定正邪明法，方能总持洗浴众僧之义
  - date: '0630'
    title_zh: 决定以行能有无愿能胜劣断疑
    rationale: 只域一因而果有天人凡圣之异，非疑行愿参差不足以显，须明愿引行成以坚净信
- id: guji-慧净-endeavor-2
  title_zh: 弘宣洗僧福田劝众奉行
  summary: 依疏文劝俗众以燃火净水等七物供僧，化疏野随流为净信福业，令得须陀洹道迹
  phases:
  - key: brewing
    name: 示只域夜念晨引
    labels:
      zh: 酝酿
    start_date: '0632'
    highlight_event_id: guji-慧净-event-hongfu
  - key: breakthrough
    name: 说洗浴法与七福
    labels:
      zh: 突破
    start_date: '0633'
    highlight_event_id: guji-慧净-event-hongfu
  - key: climax
    name: 众闻法得道迹
    labels:
      zh: 高潮
    start_date: '0634'
    highlight_event_id: guji-慧净-event-hongfu
  - key: closure
    name: 严辨洗具依教奉行
    labels:
      zh: 收束
    start_date: '0635'
    highlight_event_id: guji-慧净-event-hongfu
  decisions:
  - date: '0632'
    title_zh: 决定以医王疗病喻转俗向道
    rationale: 众生身疾粗得疗治而圣骸未沐，借世医起信，方能引疏野众生请佛入浴
  - date: '0633'
    title_zh: 决定以行者得度非神受与劝诲
    rationale: 诸佛所记可劝，自作自受可诲，须令听者不恃他力而自奉行求清净福
events:
- id: guji-慧净-event-birth
  title_zh: 慧净诞生
  date: 0578
  year_of: 578
  place: 隋关中
  description: 约隋末生，少小好学，长而弥笃，博通三才六艺五明及天文地理
- id: guji-慧净-event-faxin
  title_zh: 发心疏解温室经
  date: 0628
  year_of: 628
  place: 长安精舍
  description: 睹温室经文约义丰，决意科判证信序与发起序，释只域名位种姓及医王善疗之义
- id: guji-慧净-event-shucheng
  title_zh: 撰成温室经疏
  date: '0632'
  year_of: 632
  place: 长安
  description: 疏成温室经，具释燃火净水渗豆苏膏淳灰杨枝内衣七物，明除七病得七福乃至作佛之果，颂以十八偈摄持报果
- id: guji-慧净-event-hongfu
  title_zh: 弘说七福劝众洗僧
  date: '0634'
  year_of: 634
  place: 长安
  description: 依疏弘宣洗浴众僧及报之福，劝众以愿行双运植净业，众闻欢喜多得道迹，严辨洗具奉行
- id: guji-慧净-event-death
  title_zh: 慧净示寂
  date: '0654'
  year_of: 654
  place: 长安
  description: 唐永徽年间示寂，一生以疏经劝福为业，遗疏流行远代，异世共观
