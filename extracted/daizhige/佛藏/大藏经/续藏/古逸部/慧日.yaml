  dilemmas:
  - 空见禅师谤念佛为著相虚妄我当依经破斥还是沉默避诤
  - 秽土修证艰难迟缓众生懈怠我当开示易行净土速脱之路还是随其自修
  lesson: 依圣言量摧邪显正专劝念佛往生西方则自他速出生死
  summary_first_person: 我是慧日，唐东莱僧，泛海西行礼佛圣迹，亲见佛光加被，立誓弘扬净土，回国集诸经论念佛法门勒成三卷，破执空之谬，显往生之正，劝自他同生极乐
  source_urls:
