- id: guji-慧日-event-quanhua
  date: '0730'
  year_of: 730
  title_zh: 普劝道俗念佛往生
  description: 教令道俗厌秽欣净上尽一形下沾十念回向愿生阿弥陀佛国
- id: guji-慧日-event-death
  date: 0748
  year_of: 748
  title_zh: 示寂
  description: 唐天宝七载示寂世称慈愍三藏净土著述流通后世
