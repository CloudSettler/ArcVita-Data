  lesson: 以嫉妒名利执五法破和合僧，虽勤苦行终失正道，示人当依八正勿以非法为法
  summary_first_person: 吾本释迦族出家修行，见世饥馑利养难得，便执纳衣乞食一食露坐不食肉五法，劝新学尽寿行之，谓疾得涅槃不用八正，僧三谏不止，遂行筹分僧作二部，坏羯磨法轮，终自陷大逆长夜受苦
