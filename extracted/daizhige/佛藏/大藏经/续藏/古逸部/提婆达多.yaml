  title_zh: 倡五法求速涅槃
  summary: 以纳衣乞食一食露坐不食肉为胜法，向新学说非法为法，法为非法，立十四法以诱众
  phases:
  - key: brewing
    name: 久怀名利不满僧制
    labels:
      zh: 嫉妒萌芽
    start_date: '-535'
    highlight_event_id: guji-提婆达多-event-five-laws
  - key: breakthrough
    name: 向新学宣说五法
    labels:
      zh: 立宗诱众
    start_date: '-530'
    highlight_event_id: guji-提婆达多-event-five-laws
  - key: climax
    name: 十四法判八正为非
    labels:
      zh: 倒说法律
    start_date: '-529'
    highlight_event_id: guji-提婆达多-event-fourteen-dharma
  - key: closure
    name: 三谏不止结破僧缘
    labels:
      zh: 拒谏成衅
    start_date: '-528'
    highlight_event_id: guji-提婆达多-event-three-admonitions
  decisions:
  - date: '-530'
    title_zh: 尽寿受行五法
    rationale: 欲以苦行速得涅槃，胜过八正，以此摄新学归己
  - date: '-529'
    title_zh: 以八正为非法
    rationale: 谓八正不能调伏三毒，唯五法能伏，颠倒律义以立己宗
- id: guji-提婆达多-endeavor-2
  title_zh: 行筹分僧破和合
  summary: 佛及僧众种种方便谏而不止，自起行筹，令五百新学凡夫捉筹从去，僧作二部，遮法轮坏羯磨
  phases:
  - key: brewing
    name: 勤心方便受恶缘
    labels:
      zh: 谋破和合
    start_date: '-528'
    highlight_event_id: guji-提婆达多-event-three-admonitions
  - key: breakthrough
    name: 众集三谏舍众而去
    labels:
      zh: 佛重谏不止
    start_date: '-527'
    highlight_event_id: guji-提婆达多-event-three-admonitions
  - key: climax
    name: 自起行筹众捉筹从
    labels:
      zh: 分僧二部
    start_date: '-527'
    highlight_event_id: guji-提婆达多-event-break-sangha
  - key: closure
    name: 法轮不转天人趁乱
    labels:
      zh: 破僧罪成
    start_date: '-526'
    highlight_event_id: guji-提婆达多-event-break-sangha
  decisions:
  - date: '-527'
    title_zh: 同昔者捉之行筹
    rationale: 欲以人数夺僧和合，初行助和离时四人捉之，终成二部以立别众
  - date: '-527'
    title_zh: 拒罗汉尼谏增恚慢
    rationale: 恚慢覆心不受正谏，抟手自大，遂成定业不可悔除
events:
- id: guji-提婆达多-event-birth
  date: '-580'
  year_of: -580
  title_zh: 释迦族中生
  description: 与佛同族生于迦毗罗卫，后从佛出家修梵行
- id: guji-提婆达多-event-five-laws
  date: '-530'
  year_of: -530
  title_zh: 灵鹫山下说五法
  description: 向新学比丘说纳衣乞食一食露坐不食肉五法，令尽寿受行，谓疾得涅槃不用八正
- id: guji-提婆达多-event-fourteen-dharma
  date: '-529'
  year_of: -529
  title_zh: 于五法边说十四法
  description: 言五法是法八正是非法，律谓调伏，以八道为非五法为是，受者是犯说者亦犯
- id: guji-提婆达多-event-three-admonitions
  date: '-528'
  year_of: -528
  title_zh: 僧三谏不止
  description: 欲破僧者先应三谏，白四羯磨谏之，轻偷重偷至犯僧残，佛种种方便谏乃止而复作
- id: guji-提婆达多-event-break-sangha
  date: '-527'
  year_of: -527
  title_zh: 行筹破僧分二部
  description: 众会时自起行筹，令二百五十人乃至五百新学捉筹从去，僧作二部，佛世以遮法轮为破僧
- id: guji-提婆达多-event-death
  date: '-480'
  year_of: -480
  title_zh: 破僧后命终堕落
  description: 以大逆破和合僧罪，天人趁乱法轮不转，命终长夜受苦，永无分于圣果涅槃
