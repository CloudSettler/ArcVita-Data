  decisions:
  - date: '0732-01-01'
    title_zh: 以本覺隨染顯體用度生
    rationale: 以智淨為自利體，不思議業為利他用，皆隨自他染緣而起，方能起勝業
  - date: '0738-01-01'
    title_zh: 會通修生本有圓珠無礙
    rationale: 以始契本名本覺，本作始名修生，雖分二門體無別異，故不滯一邊
