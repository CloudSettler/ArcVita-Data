  - title_zh: 群经浩博初学难览
    description_zh: 大教枢要散在群经，初学望法海而忙然，瞻义山而永退，如何编录以明入道次第
  - title_zh: 行布圆融如何兼顾
    description_zh: 楞伽一地即十地与唯识五位渐次似违，如何以证位行布与所证圆融会通而不相违
  lesson: 登高必自卑，入道必资粮，依教悟理起行证果，位位皆有所修所断所证，不可躐等
  summary_first_person: 吾昙旷，京西明道场沙门，生当盛唐，见智周大德纂大教枢要示入道方隅，遂作开决，明教理行果四种大乘，依五位四十二贤圣渐次悟入，会通超越与次第，愿以法灯照愚暗
