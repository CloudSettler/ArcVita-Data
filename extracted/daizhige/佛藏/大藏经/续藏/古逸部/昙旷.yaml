  decisions:
  - date: '0730-01-01'
    title_zh: 不取我癡貪等為四相別配九相
    rationale: 以我癡貪等違大乘假立及斷惑位次，故依九相中業轉現等配生住異滅
  - date: '0735-01-01'
    title_zh: 立始覺不異本覺四相無自性
    rationale: 以所覺四相俱時無自立，能覺亦無，故始覺即本覺同一覺
