  birth_date: 0620-01-01
  death_date: 0680-01-01
  era: 唐
  reign_ref: 唐太宗贞观至高宗永淳
  archetype: 戒律义疏学僧
  dilemmas:
  - title_zh: 声闻律与菩萨戒是否相违
    description: 此经说七逆现身不得戒而瑜伽不说七遮须会通忏悔得戒与声闻边罪不得受之义
  - title_zh: 从师受与自誓受得失之辨
    description: 千里无师时佛像前自誓须见好相与有师授受不须好相之间须立判例以免滥受
  lesson: 以瑜伽行派为纲会通声闻七众得戒与菩萨三聚净戒守住利他本愿不舍自利轨范
  summary_first_person: 我生逢像法研律藏与瑜伽唯识见学者惑于七遮自誓得舍诸缘故依梵网本经兼采十诵四分僧祇五分萨婆多毗婆沙俱舍正理以述记分别得戒缘舍戒缘持犯差别劝人发大菩提愿受三聚净戒饶益有情
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/续藏/古逸部/梵网经述记.md
  - https://daizhige.org/佛藏/大藏经/续藏/古逸部/梵网经述记.html
endeavors:
- id: guji-梵网经述记-endeavor-1
  title_zh: 会通七众得戒与菩萨得戒缘
  summary: 博采有部十种得戒与大乘四缘建立从师受自誓受二轨以明七逆遮难与忏悔得戒之关系
  phases:
  - key: brewing
    name: 博览律论酝酿
    labels:
      zh: 博览十诵四分瑜伽
    start_date: 0640-01-01
    highlight_event_id: guji-梵网经述记-event-study
  - key: breakthrough
    name: 立四缘得菩萨戒
    labels:
      zh: 发愿遇友远离七逆羯磨成
    start_date: 0650-01-01
    highlight_event_id: guji-梵网经述记-event-compose
  - key: climax
    name: 详辨自然见谛善来等得戒
    labels:
      zh: 会通大小乘十种得戒
    start_date: 0655-01-01
    highlight_event_id: guji-梵网经述记-event-compose
  - key: closure
    name: 结归羯磨成就
    labels:
      zh: 三说羯磨请证作法
    start_date: 0660-01-01
    highlight_event_id: guji-梵网经述记-event-compose
  decisions:
  - date: 0650-01-01
    title_zh: 以瑜伽四十卷为自誓受轨
    rationale: 无具德师时依佛像前三说誓受必先忏悔以见好相为限方不滥传
  - date: 0655-01-01
    title_zh: 存七遮而许忏悔得戒
    rationale: 此经据不忏悔说现身不得戒论据忏悔亦得戒故略不说各据一义不相违背
- id: guji-梵网经述记-endeavor-2
  title_zh: 明舍戒缘与持犯差别
  summary: 依瑜伽五十三卷七十五卷明苾刍菩萨舍缘复以八门分别声闻唯律仪与菩萨具三聚之共不共广大甚深等义
  phases:
  - key: brewing
    name: 检核舍戒诸缘
    labels:
      zh: 检核舍学处犯根本等缘
    start_date: 0658-01-01
    highlight_event_id: guji-梵网经述记-event-compose
  - key: breakthrough
    name: 立舍菩萨戒二缘四缘
    labels:
      zh: 舍大愿犯他胜处
    start_date: 0662-01-01
    highlight_event_id: guji-梵网经述记-event-teach
  - key: climax
    name: 开八门持犯差别
    labels:
      zh: 品类共不共广大甚深止作
    start_date: 0665-01-01
    highlight_event_id: guji-梵网经述记-event-teach
  - key: closure
    name: 劝修饶益有情戒
    labels:
      zh: 利他为胜摄善饶益
    start_date: 0670-01-01
    highlight_event_id: guji-梵网经述记-event-teach
  decisions:
  - date: 0662-01-01
    title_zh: 判舍功能不舍体性
    rationale: 依本业经菩萨戒有受无舍有犯不失还起清净受心应还受得故须开忏悔还净之门
  - date: 0665-01-01
    title_zh: 遮罪中学不学分判
    rationale: 将护他信者等学少事少业者不等学以声闻自利为胜菩萨利他为胜不可一概
events:
- id: guji-梵网经述记-event-birth
  date: 0620-01-01
  year_of: 620
  title_zh: 降生
  description: 唐初贞观年间生于中土具善根得人身具信乐亲近三宝
- id: guji-梵网经述记-event-study
  date: 0640-01-01
  year_of: 640
  title_zh: 研习律论与瑜伽
  description: 遍习十诵四分僧祇五分萨婆多毗婆沙俱舍正理及瑜伽师地论于菩萨律仪三聚净戒及苾刍五缘具足深究得舍
- id: guji-梵网经述记-event-compose
  date: 0660-01-01
  year_of: 660
  title_zh: 撰述梵网经述记卷第一
  description: 依梵网经正作羯磨自誓受戒得舍戒缘诸文详述从师受自誓受四缘七众十种得戒及白四羯磨请证作法
- id: guji-梵网经述记-event-teach
  date: 0665-01-01
  year_of: 665
  title_zh: 开讲持犯八门
  description: 以品类共不共广大甚深止作因果意乐八门分别声闻唯制律仪菩萨具律仪摄善饶益三戒劝修利他万行
- id: guji-梵网经述记-event-death
  date: 0680-01-01
  year_of: 680
  title_zh: 示寂
  description: 唐高宗末年示寂平生以会通大小乘戒律弘扬菩萨净戒为业述记流传续藏古逸部
