events:
- id: guji-玄奘-event-birth
  date: '0602'
  year_of: 602
  title_zh: 出生于洛州缑氏
  description: 隋仁寿二年生于洛州缑氏陈氏，幼慧敏，早慕释典。
- id: guji-玄奘-event-xixing
  date: '0627-08-01'
  year_of: 627
  title_zh: 贞观元年西行出关
  description: 自长安出发，偷渡玉门，历高昌龟兹，越大雪山，赴天竺求法。
- id: guji-玄奘-event-guixiang
  date: '0645-01-25'
  year_of: 645
  title_zh: 负经东归长安
  description: 贞观十九年归抵长安，携梵本六百余部，太宗亲迎，敕住弘福寺译经。
- id: guji-玄奘-event-yijing
  date: 0649
  year_of: 649
  title_zh: 别译般若心经流通
  description: 以所受持梵本别译心经，阐明五蕴皆空还源之旨，诵持流通，度一切苦厄。
- id: guji-玄奘-event-death
  date: '0664-03-07'
  year_of: 664
  title_zh: 示寂于玉华宫
  description: 麟德元年二月寂于长安玉华宫嘉寿殿，遗命薄葬，天下哀恸。
