  decisions:
  - date: 0725-01-01
    title_zh: 以自知照心不责人
    rationale: 平章他人不如反躬自察，自知者明故先观己身长短
  - date: 0730-01-01
    title_zh: 以求理读经不空诵
    rationale: 经为求福智如网为求鱼，不解深意则徒劳无成故运心求深意
- id: guji-真言要决-endeavor-2
  title_zh: 破禅病显真如
  description: 破坐禅取境执相厌死爱净愿生诸邪，显动寂一如无得无果之真旨
  phases:
  - key: brewing
    name: 示魔境难别
