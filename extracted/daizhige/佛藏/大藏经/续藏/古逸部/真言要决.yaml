  dilemmas:
  - 真俗相混时如何持真而不随伪
  - 厌生死爱涅槃与体真如常寂如何抉择
  - 坐禅见境与求生净土如何不入魔网
  lesson: 自知忏悔求深理，处厚居实破邪见，方能出生死而会真如
  summary_first_person: 我观世人昼夜忧劳，背正行邪，以伪乱真，故作此要决，劝人自知改过，读经求理，正心怀道，不取禅境光影，不贪圣智利养，不恶生死爱涅槃，直体常寂而化物济众
