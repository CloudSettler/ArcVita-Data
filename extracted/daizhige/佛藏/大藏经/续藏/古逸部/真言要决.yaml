  - key: climax
    name: 呵愿生执著
    labels:
      zh:
      - 法身自在
      - 解脱烦恼
    start_date: 0750-01-01
    highlight_event_id: guji-真言要决-event-4
  - key: closure
    name: 会弘道化物
    labels:
      zh:
      - 遣智利养
      - 饶益众生
    start_date: 0755-01-01
    highlight_event_id: guji-真言要决-event-4
  decisions:
  - date: 0745-01-01
    title_zh: 见境不动不取为证
    rationale: 魔能变佛身说法，非慧眼不能别，故但正心不动则魔事自灭
  - date: 0750-01-01
    title_zh: 不以暗心愿生净土
    rationale: 修道本为破无明出生死教化众生，若怀土怀惠求果报则还沉三趣故须悟理源
