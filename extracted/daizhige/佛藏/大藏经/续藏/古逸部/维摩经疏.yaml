    title_zh: 悉受众盖合之为一
    rationale: 为令施者众望满足为成一用并显不思议解脱幻通之力
  - date: -0483-05-01
    title_zh: 以偈略言广摄佛德而叹
    rationale: 偈言要略少字摄多义又美妙宜于赞美故作三十六行以叹身德现变余德
- id: guji-维摩经疏-endeavor-2
  title_zh: 十地六度法身净土医王摄益
  summary: 叹念定总持辨才不断历初地布施至十地无畏具功德智慧庄严相好严身近无等等佛十力无畏十八不共开闭恶趣现身五道为大医王应病与药严净无量佛土法宝普照雨甘露师子吼深入缘起断邪见
