      raw: 约与佛同世生于毗耶离城
    death:
      date: -0480
      precision: century
      is_circa: true
      raw: 约佛灭前后示现灭度
  birth_date: '-0500'
  death_date: -0480
  era: 春秋末古印度十六大国时
  archetype: 居士菩萨
  dilemmas:
  - 同尘行于非道如何内心无染而通达佛道
  - 烦恼淤泥为恶如何反为如来种而发无上心
  lesson: 行于非道是为通达佛道烦恼虽恶可为发心之缘和光同尘而不舍众生
  summary_first_person: 吾示居毗耶离现有父母妻子眷属资生以权实二智为父母以法喜为妻慈悲为女诚实为男处五浊而不染行非道而通佛道欲令凡夫于淤泥发心令独善者知报恩
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%AD%E8%97%8F/%E5%8F%A4%E9%80%B8%E9%83%A8/%E7%BB%B4%E6%91%A9%E7%BB%8F%E4%B9%89%E8%AE%B0%E5%8D%B7%E7%AC%AC%E5%9B%9B.html
endeavors:
- id: guji-维摩诘-endeavor-1
  title_zh: 行于非道通达佛道
  summary: 示行五无间三恶趣贪欲诸烦恼魔境涅槃相而心常清净以外同非道显内顺正慧
  phases:
  - key: brewing
    name: 和光同尘示恶因果
    labels:
      zh: 行五无间处三恶趣而无罪垢
    start_date: -0490
    highlight_event_id: guji-维摩诘-event-nondo
  - key: breakthrough
    name: 善因善果不以为胜
    labels:
      zh: 现色无色界道而不住胜想
    start_date: -0489
    highlight_event_id: guji-维摩诘-event-nondo
  - key: climax
    name: 示烦恼而心常清净
    labels:
      zh: 示贪欲诸烦恼而离染著
    start_date: -0488
    highlight_event_id: guji-维摩诘-event-fanzhong
  - key: closure
    name: 入魔道现涅槃总结通达
    labels:
      zh: 随佛慧不随他教遍入诸道
    start_date: -0487
    highlight_event_id: guji-维摩诘-event-fanzhong
  decisions:
  - date: -0490
    title_zh: 示行五逆而无恼恚
    rationale: 恶从心生不在事相欲明同尘不染须以外现非道显内心无嗔
  - date: -0488
    title_zh: 以烦恼为发心之缘
    rationale: 若无烦恼不能发心欲夺二乘独善须指淤泥为如来种令凡夫起胜求
- id: guji-维摩诘-endeavor-2
  title_zh: 空室说法显不二法门
  summary: 以空室无父母妻子资生为问端以权实二智眷属资生为答复终以默然显不二
  phases:
  - key: brewing
    name: 普现问室空所在
    labels:
      zh: 因室空生问父母妻子资生
    start_date: -0486
    highlight_event_id: guji-维摩诘-event-kongshi
  - key: breakthrough
    name: 偈答眷属资生有异
    labels:
      zh: 以智度为母方便为父道品六度为侣
    start_date: -0485
    highlight_event_id: guji-维摩诘-event-kongshi
  - key: climax
    name: 广说方便权智化物
    labels:
      zh: 知无起灭而示有生度无数众
    start_date: -0484
    highlight_event_id: guji-维摩诘-event-buer
  - key: closure
    name: 默然入不二利益五千
    labels:
      zh: 以不言遣言会平等空理
    start_date: -0483
    highlight_event_id: guji-维摩诘-event-buer
  decisions:
  - date: -0485
    title_zh: 以偈明世出世眷属资生
    rationale: 世人以生死为父母有为为资生须以二智功德为父母资生方能德备于内而外同非道
  - date: -0483
    title_zh: 默然对文殊显不二
    rationale: 至理幽玄言遣有限须以不言遣诸言方能令众会无生忍而得利益
events:
- id: guji-维摩诘-event-birth
  title_zh: 毗耶离示生
  date: '-0500'
  year_of: -500
  place_zh: 毗耶离城
  summary: 示生毗耶离为大居士现有父母妻子眷属象马车乘资生与世不异而内具权实二智
- id: guji-维摩诘-event-nondo
  title_zh: 示行非道明通佛道
  date: -0490
  year_of: -490
  place_zh: 毗耶离
  summary: 示行五无间地狱畜生饿鬼色界贪欲魔境涅槃相皆无染著以明菩萨行非道是为通达佛道
- id: guji-维摩诘-event-fanzhong
  title_zh: 问文殊明烦恼佛种
  date: -0488
  year_of: -488
  place_zh: 毗耶离
  summary: 问文殊何等为如来种答以身见无明爱慢七识住诸烦恼为种以高原淤泥大海取珠为喻叹凡夫能发心
- id: guji-维摩诘-event-kongshi
  title_zh: 空室答普现色身问
  date: -0485
  year_of: -485
  place_zh: 毗耶离空室
  summary: 因室空普现问父母妻子资生所在以偈答智度为母方便为父法喜为妻慈悲为女四摄六度为侣总持禅定为园苑床座饮食
- id: guji-维摩诘-event-buer
  title_zh: 命众说入不二法门
  date: -0483
  year_of: -483
  place_zh: 毗耶离空室
  summary: 命诸菩萨说不二法门各以生灭垢净动念一相无相等为二会于空理文殊遣其言吾默然遣文殊之言五千菩萨得无生忍
- id: guji-维摩诘-event-death
  title_zh: 示疾说法后示灭
  date: -0480
  year_of: -480
  place_zh: 毗耶离城
  summary: 以方便示疾广化众生说无尽灯不思议解脱已化缘既毕示现灭度而法身不断佛种相续
