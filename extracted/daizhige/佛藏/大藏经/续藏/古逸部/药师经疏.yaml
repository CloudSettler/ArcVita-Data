  decisions:
  - date: 0660-01-01
    title_zh: 择法胜四分与杂心处中说
    rationale: 毗婆沙太广令智退法胜二百五十偈太略难解故取达摩多罗三百五十偈足成六百偈处中庄严
  - date: 0665-01-01
    title_zh: 以三大士不断三宝判末法
    rationale: 五百年后魔王出世坏法故举马鸣龙树提婆更造三论令大乘经藏不断五浊兴行时尚须宣扬显说
- id: guji-药师经疏-endeavor-2
  person_qid: guji-药师经疏
  title_zh: 释药师十号净土与十二愿救苦
  summary: 释东方去此十恒沙药师琉璃光名义广释如来至佛陀十号功德次第广释十二愿上求佛果福慧下化持戒精进盲聋病残苦恼以大慈悲令所求皆得
  phases:
  - key: brewing
