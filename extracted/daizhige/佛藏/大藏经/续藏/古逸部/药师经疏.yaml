  - key: climax
    name: 高潮广释十二愿
    labels:
      zh: 十二大愿
    start_date: 0685-01-01
    highlight_event_id: guji-药师经疏-event-2
  - key: closure
    name: 收结慈悲救苦
    labels:
      zh: 生老病死救济
    start_date: 0690-01-01
    highlight_event_id: guji-药师经疏-event-2
  decisions:
  - date: 0680-01-01
    title_zh: 先释药师琉璃光喻后释十号
    rationale: 世药师除内病况如来除三毒四倒以琉璃内明喻果体万德以光除闇冥喻空有二解故须具释十号以显世间解无上士等
  - date: 0685-01-01
    title_zh: 以六双判十二愿先愿后行
    rationale: 愿为慕廓行则阗满故分佛果福慧自行化他慈悲体用制魔化外为六双先发菩提四心后令盲聋喑哑狂裸病残皆得具足疾病除愈
