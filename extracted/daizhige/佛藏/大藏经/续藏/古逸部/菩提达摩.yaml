endeavors:
- id: guji-菩提达摩-endeavor-1
  title_zh: 著无心论开示见闻觉知即无心
  summary_zh: 假立师弟问答层层破执明终日见闻觉知造作皆无心令悟真心般若
  phases:
  - key: brewing
    name: 西来观机酝酿无心之教
    labels:
      zh: 观机酝酿
    start_date: 0520-01-01
    highlight_event_id: guji-菩提达摩-event-arrive
  - key: breakthrough
    name: 假立问答点破有心妄执
    labels:
      zh: 立论破执
    start_date: 0525-01-01
    highlight_event_id: guji-菩提达摩-event-wuxinlun
  - key: climax
    name: 弟子大悟作颂印可流通
    labels:
      zh: 印可流通
    start_date: 0530-01-01
    highlight_event_id: guji-菩提达摩-event-wuxinlun
  decisions:
  - date: 0525-01-01
    title_zh: 假立二人共谈无心以言显理
    rationale: 至理无言须假言显理大道无相为接粗而见形故设问答接引
  - date: 0530-01-01
    title_zh: 直指一切事上觉了无心即是修行
    rationale: 若离见闻别觅无心即成有心故不另立修行令当下悟入
- id: guji-菩提达摩-endeavor-2
  title_zh: 面壁嵩山传心印开禅宗
  summary_zh: 于少林面壁观机传慧可等以无心般若为最上摧伏外道续佛慧命
  phases:
  - key: brewing
    name: 初至梁魏观时节因缘
    labels:
      zh: 观缘初化
    start_date: 0520-01-01
    highlight_event_id: guji-菩提达摩-event-arrive
  - key: breakthrough
    name: 少林面壁安心悟无心
    labels:
      zh: 面壁安心
    start_date: 0527-01-01
    highlight_event_id: guji-菩提达摩-event-facewall
  - key: closure
    name: 付法传衣示寂嵩洛
    labels:
      zh: 传法示寂
    start_date: 0536-01-01
    highlight_event_id: guji-菩提达摩-event-death
  decisions:
  - date: 0527-01-01
    title_zh: 居嵩山少林面壁坐禅待机
    rationale: 时机未熟言说无益故以无心居寂照之用待上根自悟
  - date: 0532-01-01
    title_zh: 以无心般若为最上传付弟子
    rationale: 诸般若中无心般若最上能摧外道断生死故直付心印不立文字
events:
