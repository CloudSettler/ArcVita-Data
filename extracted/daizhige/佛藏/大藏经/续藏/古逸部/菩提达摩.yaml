  dilemmas:
  - 王子尊贵与出家苦行何去何从
  - 梁武帝好佛求福与直指人心见性如何抉择
  - 文字言说与澄心无念观照如何兼顾
  lesson: 澄心不动照理分明，住心空心以至解脱真如，方为禅观正路
  summary_first_person: 吾自南天竺而来，专以澄心观照示人，心神澄净为禅，照理分明为观，自住心以至智慧，开七种观门，令乱心不起，湛然不动，同证无生
