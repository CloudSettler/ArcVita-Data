    title_zh: 以四卷楞伽付惠可依行
    rationale: 楞伽为诸佛心第一依此修行自然度脱故付嘱奉持
  - date: '0530'
    title_zh: 说理入行入开报怨等四行
    rationale: 入道多途不出理事二种故以四行摄余行令无错谬
