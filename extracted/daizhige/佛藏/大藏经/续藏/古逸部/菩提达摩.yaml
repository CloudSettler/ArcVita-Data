endeavors:
- id: guji-菩提达摩-endeavor-1
  title_zh: 直指观心断三毒出三界
  summary: 立真如佛性以觉为根明三毒为三界之本三劫之体劝除毒即解脱
  phases:
  - key: brewing
    name: 南竺阐观心立觉为根
    labels:
      zh: 观心立根
    start_date: 0519
    highlight_event_id: guji-菩提达摩-event-birth
  - key: breakthrough
    name: 东来示三毒六贼惑乱身心
    labels:
      zh: 明毒贼本
    start_date: '0527'
    highlight_event_id: guji-菩提达摩-event-guanxin
  - key: climax
    name: 答三界即三毒六趣分轻重
    labels:
      zh: 断界出趣
    start_date: 0528
    highlight_event_id: guji-菩提达摩-event-guanxin
  - key: closure
    name: 会三大阿僧祇即三毒劝度劫
    labels:
      zh: 除毒度劫
    start_date: 0529
    highlight_event_id: guji-菩提达摩-event-guanxin
  decisions:
  - date: '0527'
    title_zh: 立觉为根摄心离邪
    rationale: 真如佛性一切功德因觉为根若不观心外求无益故先制三毒六贼
  - date: 0528
    title_zh: 以三毒释三界三劫会通经教
    rationale: 贪为欲界嗔为色界痴为无色界三毒一念具恒沙不可数故除毒即度三大阿僧祇
- id: guji-菩提达摩-endeavor-2
  title_zh: 会通事相显无为正法
  summary: 破执相求福重释伽蓝像塔香花灯明行道斋戒礼拜洗浴念佛归于净心
  phases:
  - key: brewing
    name: 见世人执有为喻无为
    labels:
      zh: 见执有为
    start_date: 0529
    highlight_event_id: guji-菩提达摩-event-guanxin
  - key: breakthrough
    name: 释伽蓝为清净处地法乳为戒度
    labels:
      zh: 会通初门
    start_date: '0530'
    highlight_event_id: guji-菩提达摩-event-huitong
  - key: climax
    name: 重释香花灯塔斋戒洗浴念佛
    labels:
      zh: 尽会事相
    start_date: '0531'
    highlight_event_id: guji-菩提达摩-event-huitong
  - key: closure
    name: 结摄心内照万行成就
    labels:
      zh: 归宗观心
    start_date: '0532'
    highlight_event_id: guji-菩提达摩-event-death
  decisions:
  - date: '0530'
    title_zh: 以无为正法释有为功德
    rationale: 钝根假有为喻无为若不内行唯外求则无是处故须以戒定慧释三斗六升法乳
  - date: '0531'
    title_zh: 立在心曰念破执相求福
    rationale: 在口曰诵在心曰念凡所有相皆虚妄故以五分法香七法洗浴正念在心为真供养
events:
- id: guji-菩提达摩-event-birth
  date: '0470'
  year_of: 470
  title_zh: 诞生南天竺
  description: 约南朝宋时生于南天竺香至国后阐般若观心之旨
  kind: birth
- id: guji-菩提达摩-event-guanxin
  date: '0527'
  year_of: 527
  title_zh: 说观心断三毒明三界六趣
  description: 答无明以三毒为根六识为六贼贪为欲界嗔为色界痴为无色界摄心离邪则轮回业灭
  kind: teaching
- id: guji-菩提达摩-event-huitong
  date: '0530'
  year_of: 530
  title_zh: 会通伽蓝香花灯斋洗浴念佛
  description: 释伽蓝为常净六根铸像为镕练真性五香为戒定慧解脱长明为觉心正念在心不在言
  kind: teaching
- id: guji-菩提达摩-event-death
  date: '0536'
  year_of: 536
  title_zh: 寂于北魏洛滨
  description: 化缘既毕示寂于洛州遗观心一卷略论心要劝摄心内照超凡证圣
  kind: death
