  lesson: 舍妄归真凝住壁观藉教悟宗安心发行称法而行
  summary_first_person: 我本南天竺婆罗门王第三子，舍俗从缁志存大乘，远涉山海游化汉魏，虽遭讥谤而不移，以楞伽印心授于惠可，立理入行入与报怨随缘无求称法四行，令人壁观安心自他凡圣等一
