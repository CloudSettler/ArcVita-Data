  summary_zh: 约南北朝时生于南天竺婆罗门种后遇般若多罗悟无心之旨
- id: guji-菩提达摩-event-arrive
  title_zh: 泛海来华传无心之教
  date: 0520-01-01
  year_of: 520
  summary_zh: 自南天竺泛海至梁境南越及建康复北至少林观机施化
- id: guji-菩提达摩-event-wuxinlun
  title_zh: 制无心论假立问答显理
  date: 0528-01-01
  year_of: 528
  summary_zh: 假立师弟问答明见闻觉知终日运用皆无心觉无心则罪灭生死断弟子悟而作颂
- id: guji-菩提达摩-event-facewall
  title_zh: 少林面壁九年安心传法
  date: 0532-01-01
  year_of: 532
  summary_zh: 居嵩山少林面壁坐禅以无心意现行教化慧可等悟入真心般若
- id: guji-菩提达摩-event-death
  title_zh: 示寂于嵩洛
  date: 0536-01-01
  year_of: 536
  summary_zh: 约梁大通年间示寂于嵩山付无心法界流通后世
