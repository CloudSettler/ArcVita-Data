endeavors:
- id: guji-菩提达摩-endeavor-1
  title_zh: 西来传法面壁嵩山
  summary: 自南天竺泛海至梁，不契梁武，北渡嵩洛，面壁少林，传心印于慧可，开中土禅宗之源
  phases:
  - key: brewing
    name: 南天竺得法
    labels:
      zh:
      - 出家得法
    start_date: 0480
    highlight_event_id: guji-菩提达摩-event-birth
  - key: breakthrough
    name: 泛海至梁
    labels:
      zh:
      - 西来传法
    start_date: '0520'
    highlight_event_id: guji-菩提达摩-event-arrival
  - key: climax
    name: 北渡面壁
    labels:
      zh:
      - 面壁观心
    start_date: '0525'
    highlight_event_id: guji-菩提达摩-event-shaolin
  - key: closure
    name: 付法传衣
    labels:
      zh:
      - 传法慧可
    start_date: '0527'
    highlight_event_id: guji-菩提达摩-event-shaolin
  decisions:
  - date: '0520'
    title_zh: 不滞金陵北渡嵩洛
    rationale: 机缘不契则不留恋帝王福德，择澄心之地以全禅定
  - date: '0525'
    title_zh: 面壁九年不立文字
    rationale: 以端心止念为要，令学者返观自心，不向外攀缘
- id: guji-菩提达摩-endeavor-2
  title_zh: 开示七种禅观观门
  summary: 依住心空心无相解脱禅定真如智慧次第，开七观门，兼示大声念佛功德，立修禅学道轨范
  phases:
  - key: brewing
    name: 住心摄散
    labels:
      zh:
      - 住心门
    start_date: '0526'
    highlight_event_id: guji-菩提达摩-event-teaching
  - key: breakthrough
    name: 空心无相
    labels:
      zh:
      - 空心无相
    start_date: '0526'
    highlight_event_id: guji-菩提达摩-event-teaching
  - key: climax
    name: 解脱禅定真如
    labels:
      zh:
      - 解脱禅定
    start_date: '0527'
    highlight_event_id: guji-菩提达摩-event-teaching
  - key: closure
    name: 智慧究竟大乘
    labels:
      zh:
      - 智慧究竟
    start_date: '0527'
    highlight_event_id: guji-菩提达摩-event-teaching
  decisions:
  - date: '0526'
    title_zh: 立住心为空门之始
    rationale: 心散动攀缘故先摄念令住，不住而后方能观空
  - date: '0527'
    title_zh: 以智慧为究竟道
    rationale: 识了一切为智契达空源为慧，非慧不证真如，非智不破错谬
events:
- id: guji-菩提达摩-event-birth
  title_zh: 诞生南天竺
  date: '0470'
  year_of: 470
  location_zh: 南天竺国
  description: 相传为香至王第三子，生而聪慧，遇般若多罗而出家得法
- id: guji-菩提达摩-event-arrival
  title_zh: 泛海至梁见梁武帝
  date: '0520'
  year_of: 520
  location_zh: 建康
  description: 梁普通年间泛海至金陵，与梁武帝语不契机，遂渡江而北
- id: guji-菩提达摩-event-shaolin
  title_zh: 至少林面壁传法
  date: '0525'
  year_of: 525
  location_zh: 嵩山少林寺
  description: 止于嵩山少林，面壁观心，端心止念，传心印于慧可
- id: guji-菩提达摩-event-teaching
  title_zh: 开示七种观门
  date: '0527'
  year_of: 527
  location_zh: 嵩洛
  description: 次第开示住心空心无相解脱禅定真如智慧七门，阐禅观自达功德聚林之义，兼示念佛十种功德
- id: guji-菩提达摩-event-death
  title_zh: 示寂嵩山
  date: 0528
  year_of: 528
  location_zh: 嵩山少林寺
  description: 相传于北魏孝昌三年端坐而逝，塔于熊耳山，遗禅观门流传后世
