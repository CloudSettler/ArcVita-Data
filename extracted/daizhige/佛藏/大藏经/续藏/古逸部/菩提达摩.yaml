  dilemmas:
  - 真如佛性具一切功德何以仍被无明三毒覆障
  - 三界六趣广大无边唯观自心云何得免轮回之苦
  - 佛言三大阿僧祇劫勤苦成道与今言唯除三毒即名解脱如何会通
  - 修伽蓝铸像烧香散花然灯行道持斋礼拜等有为功德与观心无为如何抉择
  lesson: 摄心制三毒净六根则三聚六度自具三界六趣之业自然消灭
  summary_first_person: 吾但教人观心以觉为根制贪嗔痴三毒净眼耳鼻舌身意六根三聚净戒六波罗蜜皆会于心不以外求相为究竟
  source_urls:
