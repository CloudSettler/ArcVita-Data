      raw: 大悲常住不示涅槃
  birth_date: -0600-02-19
  death_date: 9999-12-31
  era: 上古传说
  reign_ref: 周庄王时妙善示现说
  archetype: 大悲救度者
  dilemmas:
  - 六道众苦无边而愿力须遍覆一切有情
  - 神通威德广大而仍须以凡夫持诵能入为本
  - 常住不灭而须随缘示现生灭以化刚强
  lesson: 大悲愿力不思议，持诵回向皆共成佛
  summary_first_person: 我是观自在，顶戴弥陀，现紫金身，以千臂遍伸、千眼遍照救度六道，宣说大悲神妙章句，愿读诵功德普及有情共成佛道
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%AD%E8%97%8F/%E5%8F%A4%E9%80%B8%E9%83%A8/%E5%A4%A7%E6%82%B2%E5%90%AF%E8%AF%B7.html
endeavors:
- id: guji-观世音-endeavor-1
  title_zh: 千手千眼大悲普度六道
  summary: 发大悲愿得千手千眼，于刀山火汤地狱饿鬼修罗畜生中随缘赴感，宣说一千二百真言契令众生满愿
  phases:
  - key: brewing
    name: 仰启月轮发愿
    labels:
      zh:
      - 志心念佛
      - 仰启观音
    start_date: -0600-02-19
    highlight_event_id: guji-观世音-event-birth
  - key: breakthrough
    name: 现紫金身得千臂眼
    labels:
      zh:
      - 广大圆满
      - 千臂千眼
    start_date: -0599-01-01
    highlight_event_id: guji-观世音-event-vow
  - key: climax
    name: 宣说大悲神妙章句
    labels:
      zh:
      - 真言微妙
      - 满众生愿
    start_date: -0598-05-01
    highlight_event_id: guji-观世音-event-dharani
  - key: closure
    name: 赴感六道摧破苦难
    labels:
      zh:
      - 刀山摧折
      - 火汤消灭
    start_date: -0597-06-01
    highlight_event_id: guji-观世音-event-salvation
  decisions:
  - date: -0599-01-01
    title_zh: 立千手千眼大悲愿
    rationale: 为满众生所愿心故，以千臂恒伸现世间、千眼光明常遍照为方便
  - date: -0598-05-01
    title_zh: 对众宣说大悲心陀罗尼
    rationale: 暂闻尚灭尘沙业，讽念增成佛因，故以神妙章句付嘱受持
- id: guji-观世音-endeavor-2
  title_zh: 顶戴弥陀化导人天回向成佛
  summary: 以弥陀为本师而顶戴持宝，居菩萨众中为上首，以辩才无碍化人天，劝受持读诵以功德回向共成佛道
  phases:
  - key: brewing
    name: 以弥陀为本师
    labels:
      zh:
      - 顶戴弥陀
      - 持宝庄严
    start_date: -0599-01-01
    highlight_event_id: guji-观世音-event-vow
  - key: breakthrough
    name: 居上首化人天
    labels:
      zh:
      - 辩才无碍
      - 上首开化
    start_date: -0598-05-01
    highlight_event_id: guji-观世音-event-dharani
  - key: climax
    name: 劝持十愿增智慧眼
    labels:
      zh:
      - 速知一切法
      - 早得智慧眼
    start_date: -0597-06-01
    highlight_event_id: guji-观世音-event-salvation
  - key: closure
    name: 回向普及共成佛道
    labels:
      zh:
      - 普及有情
      - 共成佛道
    start_date: -0596-01-01
    highlight_event_id: guji-观世音-event-dedication
  decisions:
  - date: -0597-06-01
    title_zh: 开示十种速愿法门
    rationale: 令速度一切众、速乘般若、早登涅槃、早同法性，故立愿我速知等十愿
  - date: -0596-01-01
    title_zh: 以读诵功德回向众生
    rationale: 独觉不足为大悲，故愿我等与众生皆共成佛道
events:
- id: guji-观世音-event-birth
  person_qid: guji-观世音
  type: birth
  title_zh: 月轮观自在示现降诞
  date: -0600-02-19
  year_of: -600
  description: 仰启月轮观自在，现广大圆满紫金身，面安三目遍庄严，为后宣说大悲法作本起
- id: guji-观世音-event-vow
  person_qid: guji-观世音
  type: career
  title_zh: 发大悲愿现千手千眼
  date: -0599-01-01
  year_of: -599
  description: 立千臂恒伸现世间、千眼光明常遍照之愿，得一千二百真言契，能满众生所愿心，顶戴弥陀持宝器
- id: guji-观世音-event-dharani
  person_qid: guji-观世音
  type: career
  title_zh: 宣说大悲心陀罗尼神妙章句
  date: -0598-05-01
  year_of: -598
  description: 宣说南无喝啰怛那哆啰夜耶起首乃至娑婆诃圆满之广大圆满无碍大悲心陀罗尼，赞受持当证佛菩提
- id: guji-观世音-event-salvation
  person_qid: guji-观世音
  type: career
  title_zh: 分身六道破苦满愿
  date: -0597-06-01
  year_of: -597
  description: 向刀山则刀山摧折，向火汤则火汤消灭，向地狱饿鬼修罗畜生则令枯渴得饱满、恶心调伏、自得大智慧，并开十愿令速度众生
- id: guji-观世音-event-dedication
  person_qid: guji-观世音
  type: career
  title_zh: 说回向愿普及有情
  date: -0596-01-01
  year_of: -596
  description: 说愿读诵功德普及诸有情，我等与众生皆共成佛道，以辩才无碍化人天为上首
- id: guji-观世音-event-death
  person_qid: guji-观世音
  type: death
  title_zh: 大悲常住不示涅槃
  date: 9999-12-31
  year_of: 9999
  description: 以大悲愿力不思议故，常住世间恒赞念救度，不入究竟涅槃，令众生讽念惟增成佛因
