  dilemmas:
  - 文字有为与实相无为如何兼顾
  - 形迹持戒与见性真戒如何抉择
  lesson: 借文字显无字义，反照自性，离有无二边方为真修
  summary_first_person: 我遍钞佛藏般若维摩楞伽诸要，辨善恶知识真假三宝，劝人不著色相音声，反闻反见，识心见性，同归实相。
