endeavors:
- id: guji-诸经要抄-endeavor-1
  title_zh: 钞集佛藏念佛法要辨正邪知识
  phases:
  - key: brewing
    name: 发心搜集佛藏金刚般若诸文
    labels:
      zh: 酝酿搜集
    start_date: '0720'
    highlight_event_id: guji-诸经要抄-event-1
  - key: breakthrough
    name: 立无相念佛破有相邪教
    labels:
      zh: 立宗突破
    start_date: '0725'
    highlight_event_id: guji-诸经要抄-event-1
  - key: climax
    name: 明善恶知识真假三宝高潮
    labels:
      zh: 高潮明辨
    start_date: 0728
    highlight_event_id: guji-诸经要抄-event-1
  - key: closure
    name: 结钞念佛无念无相之旨
    labels:
      zh: 收束结要
    start_date: '0730'
    highlight_event_id: guji-诸经要抄-event-1
  decisions:
  - date: '0725'
    title_zh: 以无相无念为念佛正义
    rationale: 佛藏经言念色取相贪味为识，故舍色声分别，取无形无色无缘无性为真念佛
  - date: 0728
    title_zh: 判恶知识不听受供养说法
    rationale: 教人著相念佛及贪利诤讼者名为恶知识诽谤如来，故不听高坐说法，唯许净戒通实相者说法
- id: guji-诸经要抄-endeavor-2
  title_zh: 会通顿教反照与持戒护摩行门
  phases:
  - key: brewing
    name: 兼采念诵结护金刚智仪轨
    labels:
      zh: 酝酿兼采
    start_date: '0731'
    highlight_event_id: guji-诸经要抄-event-2
  - key: breakthrough
    name: 悟自性清净圆镜反源之理
    labels:
      zh: 悟理突破
    start_date: '0733'
    highlight_event_id: guji-诸经要抄-event-2
  - key: climax
    name: 融戒定慧反闻反见成佛道
    labels:
      zh: 融会高潮
    start_date: '0735'
    highlight_event_id: guji-诸经要抄-event-2
  - key: closure
    name: 结示离有无不二入不二法门
    labels:
      zh: 结示归宗
    start_date: 0738
    highlight_event_id: guji-诸经要抄-event-2
  decisions:
  - date: '0733'
    title_zh: 立反源反照为顿教总纲
    rationale: 千经万论只指众生本性，若弃生灭守真常反流全一，则六根解脱尘识消落
  - date: '0735'
    title_zh: 以见性真戒易事相假戒
    rationale: 性自能持不待他教，若识心见性想念不生即是真持戒，故破执五岁具足为究竟之增上慢
events:
- id: guji-诸经要抄-event-birth
  title_zh: 诞生
  date: '0700'
  year_of: 700
  description: 唐初诞生，后为钞经弘法者，托名诸经要抄传世
- id: guji-诸经要抄-event-1
  title_zh: 钞佛藏念佛念法辨善恶知识
  date: '0725'
  year_of: 725
  description: 钞佛藏经念佛品念法品，以无觉无观寂然无想为念佛，判教他著相者为恶知识恶邪教
- id: guji-诸经要抄-event-2
  title_zh: 集念诵护摩顿教反照诸要
  date: '0735'
  year_of: 735
  description: 集金刚智念诵结护四种念诵及般若金刚三昧楞伽维摩诸文，立反源反闻见性成佛之旨
- id: guji-诸经要抄-event-death
  title_zh: 示寂
  date: '0750'
  year_of: 750
  description: 唐中叶示寂，所钞诸经要抄以离相求心劝世，收入续藏古逸部流传
