  - 留住宫中受供养与立愿归山修行的抉择
  - 密现神通速返与韬晦守戒的权衡
  - 恋阙惜别之情与涅槃无攀缘之理的取舍
  lesson: 涅槃本无攀缘，有攀缘皆属忌想，澄心守本方能自性造船归依上界
