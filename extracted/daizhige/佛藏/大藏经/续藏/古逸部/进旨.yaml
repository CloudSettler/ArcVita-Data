endeavors:
- id: guji-进旨-endeavor-1
  title_zh: 辞帝离宫归庐山
  summary: 宫中弘法数年，面对皇帝流泪挽留，以涅槃无攀缘之理谢绝，举国祖送，出长安密现神通须臾至庐山
  phases:
  - key: brewing
    name: 宫中弘法受供
    labels:
      zh: 宫中弘法
    start_date: '0405'
    highlight_event_id: guji-进旨-event-palace
  - key: climax
    name: 辞别祖送出长安
    labels:
      zh: 辞阙出关
    start_date: '0410'
    highlight_event_id: guji-进旨-event-palace
  - key: closure
    name: 神通须臾至庐山
    labels:
      zh: 归山神通
    start_date: '0410'
    highlight_event_id: guji-进旨-event-palace
  decisions:
  - date: '0410'
    title_zh: 以无攀缘义谢绝留住
    rationale: 涅槃之义本无攀缘，有攀缘皆属忌想，故劝帝莫怀恫怅，坚持归山本愿
  - date: '0410'
    title_zh: 密现神通速赴庐山
    rationale: 路远涉长劳众送别，不欲惊动，故足下云生如壮士展臂须臾而至
- id: guji-进旨-endeavor-2
  title_zh: 庐山结庵造法船
  summary: 不归旧寺，去十里峻岭权结草庵，结跏重寻旧卷，再举经声，观境入三昧，以自性心王造无漏法船
  phases:
  - key: brewing
    name: 结草庵重寻旧卷
    labels:
      zh: 结庵寻经
    start_date: '0410'
    highlight_event_id: guji-进旨-event-lushan
  - key: breakthrough
    name: 观胜境澄心入定
    labels:
      zh: 观境入定
    start_date: '0411'
    highlight_event_id: guji-进旨-event-lushan
  - key: closure
    name: 自性造船归上界
    labels:
      zh: 造船归依
    start_date: '0412'
    highlight_event_id: guji-进旨-event-lushan
  decisions:
  - date: '0410'
    title_zh: 别旧寺另结草庵
    rationale: 旧缘已了，新境清净，权时结庵便于重寻旧卷再举经声
  - date: '0411'
    title_zh: 以无漏大乘造法船
    rationale: 念浮生不久，想凡世无愖，不用凡间物料，直以菩提般若金刚密迹为材用
