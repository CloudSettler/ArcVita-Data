events:
- id: guji-释肇序-event-birth
  title_zh: 出生京兆
  date: 0384
  year_of: 384
  description: 约东晋太元九年生，少好老庄，慕道出家，号肇公
- id: guji-释肇序-event-translation
  title_zh: 弘始八年预听重译
  date: '0406'
  year_of: 406
  description: 于常安大寺草堂寺与生融睿等千二百义学沙门预听什公重译维摩诘经，手执胡文口宣陶冶精求
- id: guji-释肇序-event-annotation
  title_zh: 注解维摩明本迹
  date: 0408
  year_of: 408
  description: 顺所闻为维摩作注，分通本迹别辨教兴，明真俗理教体用权实，命不思议为经名
- id: guji-释肇序-event-death
  title_zh: 示寂长安
  date: '0414'
  year_of: 414
  description: 义熙十年示寂于长安，所注维摩及肇序传世，后人体请于大历二年资圣寺重释其序
