  title_zh: 示现三身四种涅槃化度
  summary_zh: 以法报化三身应群机，以有余无余无住自性四涅槃摄三乘
  phases:
  - key: brewing
    name: 集无边自利利他功德
    labels:
      zh: 积集资粮
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: breakthrough
    name: 示法身遍界报身受乐
    labels:
      zh: 显法报身
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-first-turning
  - key: climax
    name: 随十地凡小现应化身
    labels:
      zh: 应化利生
    start_date: '-528'
    highlight_event_id: guji-释迦牟尼-event-first-turning
  - key: closure
    name: 示无余而住无住涅槃
    labels:
      zh: 无住示灭
    start_date: '-483'
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: '-528'
    title_zh: 以三身分应十地凡小
    rationale: 为令地上菩萨及地前凡小各得见佛闻法故随根示现
  - date: '-483'
    title_zh: 示现灭度不舍大悲大智
    rationale: 为破二乘贪住涅槃故示无住处利乐有情穷未来际
events:
- id: guji-释迦牟尼-event-birth
  date: '-563'
  year_of: '-563'
  title_zh: 蓝毗尼降生
  description: 约春秋末叶生于蓝毗尼园为净饭王子，见人天苦相厌离无常
- id: guji-释迦牟尼-event-enlightenment
  date: '-528'
  year_of: '-528'
  title_zh: 菩提树下成正觉
  description: 出家苦行后于菩提树下离一切相证真如，具一切智成佛
- id: guji-释迦牟尼-event-first-turning
  date: '-528'
  year_of: '-528'
  title_zh: 鹿野苑初转法轮广说大乘
  description: 说四谛十二因缘及般若无相之教，化声闻缘觉发大菩提心入菩萨行
- id: guji-释迦牟尼-event-death
  date: '-483'
  year_of: '-483'
  title_zh: 拘尸那罗示现入灭
  description: 于拘尸那罗娑罗林下示无余依而证无住处大般涅槃，付嘱化度不绝
