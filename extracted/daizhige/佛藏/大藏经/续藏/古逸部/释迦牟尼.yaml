  dilemmas:
  - 世俗以五欲富贵为乐而法以少欲知足无生为最乐如何抉择
  - 世间以血肉亲族为眷属以王贼水火为难而法以福罪定苦乐如何取舍
  lesson: 少欲最安乐知足大富贵持戒得端严修福能浮持世间贪为极热病佛为大良医无生第一乐
  summary_first_person: 吾为释尊应天咨请次第而答由少欲知足持戒破戒以明苦乐次明福为善眷属罪为恶心怨地狱极重苦无生第一乐次明诸欲爱非宜解脱宜非爱贪为热病佛为良医次明无智覆世间愚痴所魅悭贪舍亲友染著障生天次明福非火烧风碎水烂能浮持世间能抗王贼人非人夺次诫多有珍财而不修福者今世往后世极自欺诳
  source_urls:
  - https://daizhige.org/天请问经疏.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/天请问经疏.md
