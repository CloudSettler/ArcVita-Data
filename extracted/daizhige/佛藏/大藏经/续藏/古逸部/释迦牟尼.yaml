  lesson: 止恶以护命护信，制戒以因缘为本，观机转观令众得度。
  summary_first_person: 我为瞿昙释迦，于毗舍离见比丘因不净观厌身自戕，便集众呵责制断人命戒，改授阿那般那令得果证，又于婆裘河王舍城因妄语贪供盗王财事，说大小贼义制盗戒妄语戒，广分别境心虚实轻重，令正法久住。
