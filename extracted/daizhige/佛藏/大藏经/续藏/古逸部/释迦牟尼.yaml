  lesson: 以戒为师依四念处而住尽形寿修习四法不远离
  summary_first_person: 我是释迦牟尼，在舍卫祇园告诸苾刍，菩萨应尽形寿不顾身命修菩提心亲近善知识忍辱柔和及住空闲，我灭后以戒为师依四念处住，令正法久住众生得度。
