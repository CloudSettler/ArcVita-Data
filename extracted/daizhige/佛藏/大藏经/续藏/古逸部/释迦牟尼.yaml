    highlight_event_id: guji-释迦牟尼-event-preaching
  decisions:
  - date: -0528
    title_zh: 教应无所住而生其心
    rationale: 住六尘即非净心，心自净方得解脱，故教不应住色声香味触法生心
  - date: '-0527'
    title_zh: 教离相发菩提布施
    rationale: 住法布施如人入暗无所见，不住法布施如有目日照见众色，故教离一切相发心
