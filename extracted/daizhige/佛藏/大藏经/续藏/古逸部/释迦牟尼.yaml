  lesson: 离一切诸相则名诸佛，应无所住而生其心
  summary_first_person: 我昔供养百万恒沙诸佛，以有所得故不得记，后于然灯佛所无所得乃蒙受记，曾五百世为忍辱仙人，节节支解而不生嗔，今教菩萨离相发心，无住布施，荷担菩提。
