  - date: 约-1100
    title_zh: 舍有所得取无所得
    rationale: 有觅心求师如小儿处处不遇，自求无住自然乃得受记，故舍有所得
  - date: 约-1000
    title_zh: 守忍辱离我人等相
    rationale: 节节支解时若有我相人相众生寿者相则应生嗔恨，照见五蕴皆空方能无嗔，故离相忍辱
