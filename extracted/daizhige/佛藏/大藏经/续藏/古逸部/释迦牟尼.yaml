    title_zh: 舍王位出家求道
    rationale: 见生老病死苦为拔群品故舍世乐寻求解脱
  - date: '-528'
    title_zh: 说因缘唯识无相真如四门
    rationale: 知二乘执相未亡故次第开示令入平等皆如
