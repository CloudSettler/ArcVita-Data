endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 忍辱修行然灯授记证无所得菩提
  summary: 过去五百世作忍辱仙人离我人众生寿者相于然灯佛所实无所得而得授记悟无上正道寂然无体
  phases:
  - key: brewing
    name: 忍辱仙人离相修行
    labels:
      zh:
      - 忍辱离我
    start_date: -0650-01-01
    highlight_event_id: guji-释迦牟尼-event-geli
  - key: breakthrough
    name: 然灯佛所悟无所得
    labels:
      zh:
      - 授记悟空
    start_date: -0623-01-01
    highlight_event_id: guji-释迦牟尼-event-randeng
  - key: climax
    name: 证阿耨多罗三藐三菩提
    labels:
      zh:
      - 无上正觉
    start_date: -0528-01-01
    highlight_event_id: guji-释迦牟尼-event-randeng
  - key: closure
    name: 了知无法可说归于无实无虚
    labels:
      zh:
      - 无说之说
    start_date: -0527-01-01
    highlight_event_id: guji-释迦牟尼-event-jingang
  decisions:
  - date: -0623-01-01
    title_zh: 于然灯佛所不取菩提法相
    rationale: 若有定法可得即著我人众生寿者故以无所得为得方契无为
  - date: -0610-01-01
    title_zh: 为歌利王割截时不起嗔恨忍辱
    rationale: 了知无我相无人相故无辱可忍无忍可立以成无诤之行
- id: guji-释迦牟尼-endeavor-2
  title_zh: 说金刚般若荷担大乘教化
  summary: 为发大乘最上乘者说金刚般若以筏喻破法执令菩萨无所住而生心不住色声香味触法布施以庄严而即非庄严
  phases:
  - key: brewing
    name: 对须菩提示四果无得
    labels:
      zh:
      - 破果相执
    start_date: -0486-01-01
    highlight_event_id: guji-释迦牟尼-event-jingang
  - key: breakthrough
    name: 立金刚般若之名喻破烦恼
    labels:
      zh:
      - 筏喻说法
    start_date: -0485-04-01
    highlight_event_id: guji-释迦牟尼-event-jingang
  - key: climax
    name: 付嘱受持四句偈广为人说
    labels:
      zh:
      - 荷担如来
    start_date: -0485-05-01
    highlight_event_id: guji-释迦牟尼-event-jingang
  - key: closure
    name: 以真语实语印可离相发心灭度一切众生而无一众生实灭度
    labels:
      zh:
      - 离相发心
    start_date: -0484-01-01
    highlight_event_id: guji-释迦牟尼-event-jingang
  decisions:
  - date: -0485-04-01
    title_zh: 以金刚为喻说般若波罗蜜而即非般若
    rationale: 烦恼是妄由执见生若执般若亦成烦恼故以遣执令人到岸舍筏
  - date: -0485-05-01
    title_zh: 劝菩萨不应住色生心应无所住而行布施
    rationale: 住相布施如人入暗无所见不住法布施如有目日照见种种色方能利益一切众生
