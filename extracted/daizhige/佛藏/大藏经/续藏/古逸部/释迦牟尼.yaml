    title_zh: 制断人命不共住戒
    rationale: 以断初后识相续为杀，禁自杀教杀赞杀，护命止恶令正法久住。
  - date: -523-08-01
    title_zh: 改授阿那般那三昧
    rationale: 不净偏增怖厌，数息调心守道，令众离患速证圣果。
- id: guji-释迦牟尼-endeavor-2
  person_qid: guji-释迦牟尼
  title_zh: 制盗妄语二戒广解境心轻重
  summary_zh: 因草屋瓦屋夺王财及婆裘河比丘妄称得圣受供，说大小贼义制盗戒妄语戒，广解七句五缘料简。
