endeavors:
- id: guji-释迦牟尼-endeavor-1
  person_id: guji-释迦牟尼
  title_zh: 破斥因中有果论
  summary: 针雨众外道常常时因中有果之计以因果同异未生已生四难破之立要有因待缘果生
  phases:
  - key: brewing
    name: 外道寻思立因果常有
    labels:
      zh: 寻思立计
    start_date: -528-01-01
    highlight_event_id: guji-释迦牟尼-event-1
  - key: breakthrough
    name: 以同异相审问因果
    labels:
      zh: 审问破执
    start_date: -528-06-01
    highlight_event_id: guji-释迦牟尼-event-1
  - key: climax
    name: 以未生已生难破先有
    labels:
      zh: 正破先有
    start_date: -528-09-01
    highlight_event_id: guji-释迦牟尼-event-1
  - key: closure
    name: 立待缘果生正义
    labels:
      zh: 立缘起义
    start_date: -528-12-01
    highlight_event_id: guji-释迦牟尼-event-1
  decisions:
  - date: -528-06-01
    title_zh: 以因果异相同异立难
    rationale: 若言无异则无因果二种决定若言有异则因中果相或未生或已生皆不应理故破常有
  - date: -528-09-01
    title_zh: 以五相立法可得之则
    rationale: 依处所所依自相自作业及因缘变异五相方可了知故先有之说不合现量比量
- id: guji-释迦牟尼-endeavor-2
  person_id: guji-释迦牟尼
  title_zh: 破斥从缘显了与去来实有论
  summary: 破声显论从缘但显及计过去未来成就如现在之实有以障缘显体三世等难破之显缘起假立
  phases:
  - key: brewing
    name: 外道立显了与三世实有
    labels:
      zh: 立显实计
    start_date: -527-01-01
    highlight_event_id: guji-释迦牟尼-event-2
  - key: breakthrough
    name: 以障缘有无审问显论
    labels:
      zh: 障缘审问
    start_date: -527-06-01
    highlight_event_id: guji-释迦牟尼-event-2
  - key: climax
    name: 以三世一异难破去来实有
    labels:
      zh: 三世正破
    start_date: -527-09-01
    highlight_event_id: guji-释迦牟尼-event-2
  - key: closure
    name: 开示十二处缘起假立
    labels:
      zh: 显假缘起
    start_date: -527-12-01
    highlight_event_id: guji-释迦牟尼-event-2
  decisions:
  - date: -527-06-01
    title_zh: 以障显体同异破显了
    rationale: 若无障缘则不应言障若有障缘则因果俱有不应独障独显且显与法异同皆不成故破显了
  - date: -527-09-01
    title_zh: 以常无常三世往来破实有
    rationale: 若三世相一则不应立三世若相异则不应言实有若未来至现在则有方所成常死生往来皆不合理故唯假立
