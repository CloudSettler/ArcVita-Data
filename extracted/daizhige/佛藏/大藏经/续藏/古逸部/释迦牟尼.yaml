  decisions:
  - date: -493-03-12
    title_zh: 以少欲知足持戒答世俗乐执
    rationale: 凡愚耽嗜五欲贪求无足破戒堕落故以少欲为最安乐知足为大富贵持戒为端严以反俗贵无为
  - date: -492-06-15
    title_zh: 以福罪地狱无生定眷属怨苦乐
    rationale: 世间眷属暂会永离唯三福牢固资人得圣果罪能害多身过于世怨地狱苦胜人间万倍涅槃常住安稳故为极乐
- id: guji-释迦牟尼-endeavor-2
  title_zh: 答天后请开示贪病佛医覆障与福持世间
  summary: 对天者再问爱非宜宜非爱热病良医及覆世魅世舍友障天与水火王贼七难并自欺诳次第答以诸欲贪佛无智愚痴悭贪染著及福能免难持世间
  phases:
  - key: brewing
    name: 天者问爱宜热病良医
    labels:
      zh: 诸欲爱非宜
    start_date: -491-05-08
    highlight_event_id: guji-释迦牟尼-event-answer-medicine
  - key: breakthrough
    name: 以贪为极热病佛为大良医
    labels:
      zh: 佛为大良医
    start_date: -491-05-10
    highlight_event_id: guji-释迦牟尼-event-answer-medicine
  - key: climax
    name: 明无智覆世福免七难持世间
    labels:
      zh: 福能浮持世间
    start_date: -490-08-20
    highlight_event_id: guji-释迦牟尼-event-answer-protect
  - key: closure
    name: 诫多财不修福极自欺诳流通
    labels:
      zh: 不修福自欺诳
    start_date: -490-08-25
    highlight_event_id: guji-释迦牟尼-event-answer-protect
  decisions:
  - date: -491-05-10
    title_zh: 断五欲贪举佛四智为医
    rationale: 五欲如蜜涂刀现受三苦后堕三涂解脱虽宜而凡不爱贪遍三界为生死根唯佛具五眼六通知苦集灭道能授对治药故为极大良医
  - date: -490-08-20
    title_zh: 以无智悭贪染著释覆障以福抗七难
    rationale: 无智覆慧眼过于盲覆肉眼悭贪舍亲友染著障生天修施戒定三福则不罹火风水王贼人鬼七难且感人天正报器界依果故能浮持世间多财不修福空手往三涂故为极自欺诳
