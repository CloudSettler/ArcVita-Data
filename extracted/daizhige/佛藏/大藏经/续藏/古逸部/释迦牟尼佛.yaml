  decisions:
  - date: -0499-05-01
    title_zh: 以无漏无作如幻之相为真实安住
    rationale: 若见乞者时时望报生悔即是施，若开心常施不悔不望报即是檀波罗蜜
  - date: -0499-06-01
    title_zh: 以大涅槃不闻而闻摄六度归实相
    rationale: 为令离市易恐怖名闻憍慢之施，直指法界空无所有觉知之相
