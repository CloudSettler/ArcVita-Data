  dilemmas:
  - 外道执自性决定士夫自在时自然等为因，如何以因缘所生破其僻执而不堕断常
  - 五德弟子于如来广略二教疑三摄十二及因果相生，如何以三道分别开决令趣菩提
  lesson: 诸法从空生空无有移转，善解缘起十二离二边见，依世俗假名显胜义真实速趣无上菩提
  summary_first_person: 吾龙猛比丘生南天竺，蒙佛受记破有无宗，为断五德弟子疑网摧外道诸见，造因缘心释论明十二支唯三摄递相生空无我不移转，立胜义皆空，愿众生了二谛证欢喜地
  source_urls:
