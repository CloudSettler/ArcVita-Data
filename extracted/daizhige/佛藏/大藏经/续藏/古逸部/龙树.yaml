endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 造因缘心释论开决十二缘起
  summary_zh: 为五德弟子断疑，以三摄十二明烦恼业苦，以递相生明流转，以空无我不移转还灭显胜义皆空
  phases:
  - key: brewing
    name: 五德弟子来诣问摄
    labels:
      zh: 问起
    start_date: 0185
    highlight_event_id: guji-龙树-event-1
  - key: breakthrough
    name: 三摄十二答疑立宗
    labels:
      zh: 立义
    start_date: 0190
    highlight_event_id: guji-龙树-event-1
  - key: climax
    name: 明空无我不移转还灭
    labels:
      zh: 显空
    start_date: 0195
    highlight_event_id: guji-龙树-event-2
  - key: closure
    name: 判胜义皆空流通后世
    labels:
      zh: 流通
    start_date: '0200'
    highlight_event_id: guji-龙树-event-2
  decisions:
  - date: 0190
    title_zh: 以烦恼业苦三道摄十二支
    rationale: 为令广略二义摄尽无余，初八九为烦恼，二及十为业，余七为苦，断增减疑
  - date: 0195
    title_zh: 以从空生空立不移转
    rationale: 为离断常二边，虽无极微至他世而业果不失，故说唯从空法还生空法
- id: guji-龙树-endeavor-2
  title_zh: 破有无宗护持大乘正法
  summary_zh: 依楞伽大云受记及空藏三昧现证，摧裸形数论自在时自然无因等十种僻执，显此论为正量
  phases:
  - key: brewing
    name: 善见缘起证极喜地
    labels:
      zh: 证入
    start_date: '0175'
    highlight_event_id: guji-龙树-event-3
  - key: breakthrough
    name: 摧断常僻执显因缘所生
    labels:
      zh: 破邪
    start_date: 0185
    highlight_event_id: guji-龙树-event-3
  - key: climax
    name: 会大小乘立胜义皆空
    labels:
      zh: 立教
    start_date: 0195
    highlight_event_id: guji-龙树-event-2
  - key: closure
    name: 得教理二量受记流通
    labels:
      zh: 受记
    start_date: '0205'
    highlight_event_id: guji-龙树-event-2
  decisions:
  - date: 0185
    title_zh: 直指自性决定等皆非正因
    rationale: 外道六法士夫相假自在时自然随欲化主皆非因缘正因，唯说因缘所生以遮恶见
  - date: '0205'
    title_zh: 引教理二量证论为正量
    rationale: 以楞伽大云受记及亲证空藏撝空出宝等胜德，令钝利二根信受不疑
