    description: 許人壽百二十歲星辰護命當滿足眾生延年益算之願抑或導向出世佛道
  lesson: 以守護身命為方便先令眾生離怖畏災厄再導向精進向道現世安穩即是修行之基
  summary_first_person: 吾為七千佛所護之神符法門託佛名而說為眾生延年益算禳災辟邪佩符之後諸佛生我光明照我北斗注生三台護命七千佛救護七百七十佛益算三十五佛破魔八萬菩薩衛護願眾生過災度難壽至百二十歲身心堅強勇猛精進終得佛道
