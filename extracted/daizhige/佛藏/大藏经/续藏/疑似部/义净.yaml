endeavors:
- id: guji-义净-endeavor-1
  title_zh: 泛海南行求法取经
  summary_zh: 咸亨二年自广州泛海，经室利佛逝至那烂陀留学，遍学戒律显密，携梵本四百余部归国
  phases:
  - key: brewing
    name: 齐州出家立志西行
    labels:
      zh:
      - 立志求法
    start_date: 424
    highlight_event_id: guji-义净-event-study
  - key: breakthrough
    name: 广州泛海抵占波室利佛逝
    labels:
      zh:
      - 海路突破
    start_date: 441
    highlight_event_id: guji-义净-event-depart
  - key: climax
    name: 那烂陀留学兼学诸部
    labels:
      zh:
      - 取经高峰
    start_date: 0680
    highlight_event_id: guji-义净-event-nalanda
  - key: closure
    name: 携梵本归国复命
    labels:
      zh:
      - 载誉而归
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  decisions:
  - date: 441
    title_zh: 决意海路西行
    rationale: 慕法显玄奘之迹，不畏贼役海难，以求戒律梵本，正信利生
  - date: 0680
    title_zh: 留学那烂陀十年
    rationale: 依胜师广学三藏，深解八识空性，为归国译经奠基
- id: guji-义净-endeavor-2
  title_zh: 奉诏译经弘扬八阳正见
  summary_zh: 归国后居洛阳长安译场，奉诏译出天地八阳神咒经等，宣说日日好日破邪择吉，教人受持读诵延寿成佛
  phases:
  - key: brewing
    name: 入译场参定规式
    labels:
      zh:
      - 译场酝酿
    start_date: 0695
    highlight_event_id: guji-义净-event-return
  - key: breakthrough
    name: 奉诏译出八阳神咒经
    labels:
      zh:
      - 译经突破
    start_date: 448
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 广宣读诵除病禳灾之益
    labels:
      zh:
      - 弘化高峰
    start_date: 453
    highlight_event_id: guji-义净-event-translate
  - key: closure
    name: 译本流通舍邪归正
    labels:
      zh:
      - 流通圆满
    start_date: 456
    highlight_event_id: guji-义净-event-translate
  decisions:
  - date: 448
    title_zh: 奉诏译八阳经示正见
    rationale: 愍邪见众生信邪倒见受众苦，以八识空理与持诵功德令得悟解免难
  - date: 453
    title_zh: 劝生死婚葬不问吉日
    rationale: 明日月常明日日好日，教人但读经修善，不返天时逆地理
