      - 发愿
    start_date: '0001-02-01'
    highlight_event_id: guji-地藏菩萨-event-observe
  - key: climax
    name: 从南方来入地狱中
    labels:
      zh:
      - 赴狱
      - 同处
    start_date: '0001-03-01'
    highlight_event_id: guji-地藏菩萨-event-enter
  - key: closure
    name: 与阎罗别床而座订四缘
    labels:
      zh:
      - 护正
      - 立约
    start_date: '0001-04-01'
    highlight_event_id: guji-地藏菩萨-event-enter
  decisions:
  - date: '0001-02-01'
    title_zh: 不忍众苦决定赴地狱
    rationale: 见铁碓铁磨镬汤猛火吞铁饮铜无休息，若安住不救则违悲愿，故即赴救
  - date: '0001-04-01'
    title_zh: 与阎罗同处共理四事
    rationale: 恐断罪不凭文案交错未合死者误陷罪毕者不出，故同处以正之
- id: guji-地藏菩萨-endeavor-2
  person_id: guji-地藏菩萨
  title_zh: 劝造像写经持名接引往生
  summary_zh: 开示造像写经持名功德，令善男女定得往生极乐，舍命亲自来迎，常得同处闻法欢喜奉行
  phases:
  - key: brewing
    name: 察地狱池边出离之机
    labels:
      zh:
      - 池边
      - 待度
    start_date: '0001-05-01'
    highlight_event_id: guji-地藏菩萨-event-vow
  - key: breakthrough
    name: 开示三行往生之因
    labels:
      zh:
      - 造像
      - 写经持名
    start_date: '0001-06-01'
    highlight_event_id: guji-地藏菩萨-event-vow
  - key: climax
    name: 许从佛国天堂展转超升
    labels:
      zh:
      - 极乐
      - 展转
    start_date: '0001-07-01'
    highlight_event_id: guji-地藏菩萨-event-vow
  - key: closure
    name: 舍命亲自来迎同处闻法
    labels:
      zh:
      - 来迎
      - 同处
    start_date: '0001-08-01'
    highlight_event_id: guji-地藏菩萨-event-welcome
  decisions:
  - date: '0001-06-01'
    title_zh: 立造像写经持名三行
    rationale: 众生罪苦无自拔，须藉像经名号系心植因，方能定得往生极乐展转超升，故普劝三行并重
  - date: '0001-08-01'
    title_zh: 许舍命亲自来迎
    rationale: 临终怖畏易失正念，若得亲自来迎同处安住，则能常闻佛说欢喜奉行不退，故立迎接之愿
