person:
  qid: guji-地藏菩萨
  name_zh: 地藏菩萨
  names:
    zh: 地藏菩萨
    en: Ksitigarbha Bodhisattva
  lifespan:
    birth:
      date: '0001-01-01'
      precision: millennium
      is_circa: true
      raw: 过去久远无量劫前示现，无确切纪年可考
    death:
      date: '9999-12-31'
      precision: millennium
      is_circa: true
      raw: 誓言地狱不空誓不成佛，长住度生，无涅槃示现，以象征无终
  birth_date: '0001-01-01'
  death_date: '9999-12-31'
  era: 佛教传说时代
  archetype: 悲愿救苦者
  dilemmas:
  - 不忍地狱众生受无间苦而自处安乐，何以自安
  - 阎罗断罪或有不凭文案交错，未合死者与罪毕者何以得正
  lesson: 以大悲愿力入苦处救度，劝造像写经持名以种往生之因，临终得迎
  summary_first_person: 吾住南方琉璃世界，以净天眼观地狱众生受铁碓铁磨铁犁铁锯镬汤猛火吞热铁丸饮铜汁之苦，无有休息，不忍见之，故从南方来到地狱中，与阎罗共同一处别床而座，护断罪之凭正文案之不谬，济未合死者出离，引罪毕者离池，劝世人造像写经持吾名，定得往生极乐，舍命之日吾亲自来迎，常得同处闻法欢喜奉行
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%AD%E8%97%8F/%E7%96%91%E4%BC%BC%E9%83%A8/%E5%9C%B0%E8%97%8F%E8%90%A8%E8%90%A8%E7%BB%8F.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%AD%E8%97%8F/%E7%96%91%E4%BC%BC%E9%83%A8/%E5%9C%B0%E8%97%8F%E8%90%A8%E8%90%A8%E7%BB%8F.html
endeavors:
