- id: guji-地藏菩萨-event-birth
  person_id: guji-地藏菩萨
  date: '0001-01-01'
  year_of: 1
  title_zh: 示现降生
  description_zh: 过去久远示现于南方琉璃世界，无确切纪年，传为大愿菩萨示现
  type: birth
- id: guji-地藏菩萨-event-observe
  person_id: guji-地藏菩萨
  date: '0001-02-01'
  year_of: 1
  title_zh: 以净天眼观地狱众苦
  description_zh: 住南方琉璃世界，以净天眼见地狱中铁碓捣铁磨磨铁犁耕铁锯解镬汤涌沸猛火饥吞热铁丸渴饮铜汁，受诸苦恼无有休息，不忍见之
  type: career
- id: guji-地藏菩萨-event-enter
  person_id: guji-地藏菩萨
  date: '0001-04-01'
  year_of: 1
  title_zh: 从南方来与阎罗同处
  description_zh: 即从南方来到地狱中，与阎罗王共同一处别床而座，缘有四者，恐断罪不凭，恐文案交错，未合死者，罪毕出池者，以正其理
  type: career
- id: guji-地藏菩萨-event-vow
  person_id: guji-地藏菩萨
  date: '0001-06-01'
  year_of: 1
  title_zh: 开示造像写经持名往生
  description_zh: 言若有善男子善女人造地藏菩萨像写地藏菩萨经及念地藏菩萨名，此人定得往生西方极乐世界，从一佛国至一佛国，从一天堂至一天堂
  type: career
- id: guji-地藏菩萨-event-welcome
  person_id: guji-地藏菩萨
  date: '0001-08-01'
  year_of: 1
  title_zh: 舍命亲自来迎同处闻法
  description_zh: 言此人舍命之日，地藏菩萨亲自来迎，常得与地藏菩萨共同一处，闻佛所说皆大欢喜信受奉行
  type: career
- id: guji-地藏菩萨-event-death
  person_id: guji-地藏菩萨
  date: '9999-12-31'
  year_of: 9999
  title_zh: 誓不成佛长住无终
  description_zh: 依大愿地狱不空誓不成佛，长住度生，无示涅槃，此以象征之期表无终之愿，非实有卒日
  type: death
