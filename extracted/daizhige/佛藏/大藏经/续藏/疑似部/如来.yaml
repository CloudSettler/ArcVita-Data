  - key: breakthrough
    name: 菩提成道
    labels:
      zh: 成道证觉
    start_date: -528
    highlight_event_id: guji-如来-event-enlightenment
  decisions:
  - date: -534
    title_zh: 踰城出家舍王位求解脱
    rationale: 见生老病死苦发心求无上大道济度众生
  - date: -528
    title_zh: 菩提树下誓不成道不起座
    rationale: 了生死涅槃不二安住平等一如而证无上觉
- id: guji-如来-endeavor-2
  title_zh: 示现光明弘法度众
  summary: 以圆光相好神通遍照幽冥振威说法令众生信受读诵流通
  phases:
  - key: climax
    name: 光明遍照说法
    labels:
      zh: 神通度众
    start_date: -528
    highlight_event_id: guji-如来-event-teaching
  - key: closure
    name: 付嘱流通涅槃
    labels:
      zh: 流通涅槃
    start_date: -483
    highlight_event_id: guji-如来-event-death
  decisions:
  - date: -528
    title_zh: 现相好光明遍覆幽冥说法
    rationale: 以有形显无形令见光闻法者永脱死生而生信
  - date: -483
    title_zh: 以读诵书写流通付嘱大众
    rationale: 令写经教人读诵者家富智开横病不来功德不灭
