endeavors:
- id: guji-如来-endeavor-1
  title_zh: 菩提树下成道证觉
  summary: 踰城出家苦行思维于菩提树下成等正觉具足相好光明神通
  phases:
  - key: brewing
    name: 出家求道
    labels:
