    rationale: 獨行為名利福少眾人同心隨力集施相續不絕施功常生故勸共施悲田
  - date: -0500-02-03
    title_zh: 修故不造新
    rationale: 修理破塔寺像經像得無造新根本功德更得勝福勝過別造新者故勸修故
