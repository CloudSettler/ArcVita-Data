  dilemmas:
  - 像法滅時眾生惡心熾盛不睹佛身當說何法而得調伏
  - 敬田悲田二種福田中何者最勝當如何平等布施
  lesson: 以慈悲方便行平等布施重悲田濟貧老病者功德最大能續佛慧命
  summary_first_person: 我是常施承佛神力從座而起諮問末法安住之法蒙佛開示悲田最勝平等普施修理故塔寺像我願勸化同心集施濟老病貧窮令眾生免墮惡趣
