  dilemmas:
  - title_zh: 灾厄竞起而众生不信
    description: 六种横死与禾豆不收交迫，劝写经免难而闻者多疑，若强说则近胁迫，若不说则众生灭门
  - title_zh: 写经免难而恐沦功利
    description: 以写一通免身二通免家三通免村劝善，虽能广传，若执数量免灾则失慈悲本怀
  lesson: 以抄写转读存善念，以劝善存村社，灾厄时不失慈悲
  summary_first_person: 我是新菩萨，见末世多患死卒死产坐死不持斋肠热自绞之厄，又逢禾豆不收之岁，故于西凉州城东门示雷雨石破见经，令人写经转读，一通免身，二通免家，三通免村，闻而不写则自灭，转示长安，愿众生得福无量，皆度苦难
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E7%BB%AD%E8%97%8F/%E7%96%91%E4%BC%BC%E9%83%A8/%E6%96%B0%E8%8F%A9%E8%90%A8%E7%BB%8F%E4%B9%8B%E4%BA%8C.html
