    title_zh: 立闻经必写之戒
    rationale: 若闻不写即灭门，以重罚止轻慢，使人不敢徒闻而不行
  - date: '0413-03-01'
    title_zh: 许转读皆度苦难
    rationale: 不独自写，凡转读示人者皆得度，使一经转示无量，得福无量
