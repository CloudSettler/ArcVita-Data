    title_zh: 以石破雷雨示经取信
    rationale: 众生敬远瑞而疑近言，故示天雷碎石，使见者生信
  - date: '0412-05-01'
    title_zh: 定写经数量免灾之格
    rationale: 以一通免身二通免家三通免村为阶，使好信者能量力劝写，广及一村
