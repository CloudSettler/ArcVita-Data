  - 宿业因缘不见诸佛云何忏悔劝请得见
  lesson: 系心一缘观佛见佛心得安乐罪灭得无生忍
  summary_first_person: 我是教人观十方佛与无量寿之法门，令人坐观东方廓然大光，从一佛增至无量佛，复以五门白骨调心，终以毕竟空兴大悲愿生净土
