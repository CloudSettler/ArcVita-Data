endeavors:
- id: guji-观经-endeavor-1
  title_zh: 十方佛观与五门念佛三昧
  description: 坐观东方一佛说法渐增至十百千万无量佛，遍观十方一念周遍，定中见佛说法得无生忍，兼传五门安般不净慈心观缘念佛随病施教
  phases:
  - key: brewing
    name: 东方系念见一佛
    labels:
      zh:
      - 东方观佛
      - 系心不令外缘
    start_date: '0700-01-01'
    highlight_event_id: guji-观经-event-birth
  - key: breakthrough
    name: 增广至无量佛光光相接
    labels:
      zh:
      - 增至无量无边佛
      - 十方遍观
    start_date: '0750-01-01'
    highlight_event_id: guji-观经-event-ten-directions
  - key: climax
    name: 定中见佛说法得忍
    labels:
      zh:
      - 定中见十方佛
      - 疑网悉除得无生忍
    start_date: '0750-06-01'
    highlight_event_id: guji-观经-event-ten-directions
  - key: closure
    name: 五门施教与忏悔得见
    labels:
      zh:
      - 五门禅要随病施教
      - 六时忏悔劝请随喜
    start_date: '0760-01-01'
    highlight_event_id: guji-观经-event-five-gates
  decisions:
  - date: '0750-01-01'
    title_zh: 一念周遍遍观十方
    rationale: 若逐方缘心易散，故令方方皆见已一时往观十方，一念所缘周遍得见以成定心
  - date: '0760-01-01'
    title_zh: 宿业不见者教以忏悔
    rationale: 纵使诸佛不为说法心得安乐，故令一日一夜六时忏悔劝请随喜渐得见佛
- id: guji-观经-endeavor-2
  title_zh: 白骨观与无量寿佛观愿生净土
  description: 先观身唯白骨连如珂雪，次观脐中莲华佛展转相出及师子奋迅解脱，次观无量寿佛钝根从额上赤骨至少多利根即观日光法界光明，终观实相毕竟空修众生忍法忍回向净土
  phases:
  - key: brewing
    name: 白骨连系念澄清
    labels:
      zh:
      - 白骨观
      - 行住坐卧皆见白骨
    start_date: '0780-01-01'
    highlight_event_id: guji-观经-event-white-bone
  - key: breakthrough
    name: 脐中莲华佛与琉璃身
    labels:
      zh:
      - 脐中莲华展转相出
      - 琉璃身放日光
    start_date: '0790-01-01'
    highlight_event_id: guji-观经-event-white-bone
  - key: climax
    name: 无量寿佛对坐得见
    labels:
      zh:
      - 钝根观赤骨变白变琉璃
      - 利根观日光法界光明见佛
    start_date: '0800-01-01'
    highlight_event_id: guji-观经-event-amitayus
  - key: closure
    name: 毕竟空兴悲回向净土
    labels:
      zh:
      - 世间如梦如幻毕竟空
      - 众生忍法忍回向往生
    start_date: '0800-06-01'
    highlight_event_id: guji-观经-event-death
  decisions:
  - date: '0780-01-01'
    title_zh: 从易及难先少后多
    rationale: 初观额上一寸赤骨变白，次观全身白骨如雪再作琉璃放光，光中方观阿弥陀西向端坐如紫金山
  - date: '0800-01-01'
    title_zh: 未得法忍者修习二忍回向
    rationale: 世间颠倒受报无实，故当伏心修众生忍不生嗔喜及法忍心无挂碍，一切善事回向无量寿佛国
events:
- id: guji-观经-event-birth
  date: '0700-01-01'
  year_of: 700
  title_zh: 疑似部观经撰述成一卷
  description: 佛说观经一卷成立，首明观十方佛法，坐观东方廓然大光见一佛结跏趺坐举手说法
- id: guji-观经-event-ten-directions
  date: '0750-01-01'
  year_of: 750
  title_zh: 十方遍观定中见佛得忍
  description: 自东方至东南方乃至十方皆见佛说法，复一时遍观十方，定心成就疑网悉除得无生忍，不见者六时忏悔
- id: guji-观经-event-five-gates
  date: '0760-01-01'
  year_of: 760
  title_zh: 五门禅要与念佛三昧境界
  description: 传五门安般不净慈心观缘念佛随众生病施教，观像系念额上心上出佛，脐中莲华佛展转出入，光明还来人身如净琉璃
- id: guji-观经-event-white-bone
  date: '0780-01-01'
  year_of: 780
  title_zh: 白骨观与师子奋迅解脱
  description: 观身皮肉总坏唯白骨连如珂雪，心静则行住坐卧皆见，脐中见莲华佛及五色光师子出入，四佛放日光见四天下如掌中得清净解脱
- id: guji-观经-event-amitayus
  date: '0800-01-01'
  year_of: 800
  title_zh: 无量寿佛观分钝利二根
  description: 钝根先观额上赤骨变白全身琉璃放光遍阎浮，光中观阿弥陀对坐得见，利根即观日光法界光明便见佛，欲生净土当作是观
- id: guji-观经-event-death
  date: '2018-11-26'
  year_of: 2018
  title_zh: 一卷终结回向净土流传至今
  description: 终明诸法实相如梦如幻，修众生忍法忍兴大悲度一切有情回向无量寿佛国，佛说观经一卷终后世续藏流传
