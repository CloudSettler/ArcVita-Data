endeavors:
- id: guji-迦叶菩萨-endeavor-1
  person_qid: guji-迦叶菩萨
  title_zh: 请问酒戒以弘断酒
  summary_zh: 因问何者为善引佛说不饮酒不断善根复问酒无命何故为苦引鸯崛魔罗醉乱杀父淫母及吉槃陀沽酒堕锯床地狱八万罗汉饮井水昏醉之事遂明五戒二百五十戒威仪具足皆不听饮酒酌酒与人劝酒酿酒皆得重罪
  start_date: -0500-01-01
  phases:
  - key: brewing
    name: 问善发端
    labels:
      zh: 问善
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-wine
  - key: breakthrough
    name: 佛说酒过
    labels:
      zh: 说酒过
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-wine
  - key: climax
    name: 井水昏醉为证
    labels:
      zh: 引证
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-wine
  - key: closure
    name: 立戒劝忏
    labels:
      zh: 立戒
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-wine
  decisions:
  - date: -0500-01-01
    title_zh: 再问酒无命何故为苦
    rationale: 欲明酒虽无命能乱心失伦致杀逆堕狱故须佛说醉乱因缘以断疑
  - date: -0500-01-01
    title_zh: 承佛诫劝众不饮不劝不酿不入酒家
    rationale: 以现前颠倒必招未来地狱唯重悔发露更莫复饮方发菩提心
- id: guji-迦叶菩萨-endeavor-2
  person_qid: guji-迦叶菩萨
  title_zh: 请问肉斋以弘慈悲断肉
  summary_zh: 因问食肉得何罪引佛说食肉断大慈种堕阿鼻粪秽地狱煮炙斩割各堕镬汤炙床剉碓诸狱食父母眷属肉啮父骨饮父血之理复问破斋堕饿鬼铁轮地狱及不饮酒不食肉胜布施国城金幡塔之福遂劝常行大慈不食肉发无上心
  start_date: -0500-01-01
  phases:
  - key: brewing
    name: 问肉罪发端
    labels:
      zh: 问肉
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-meat
  - key: breakthrough
    name: 佛说肉过诸狱
    labels:
      zh: 说肉过
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-meat
  - key: climax
    name: 问破斋明报
    labels:
      zh: 问破斋
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-meat
  - key: closure
    name: 赞断酒肉福劝发心
    labels:
      zh: 劝发心
    start_date: -0500-01-01
    highlight_event_id: guji-迦叶菩萨-event-ask-meat
  decisions:
  - date: -0500-01-01
    title_zh: 问食肉煮炙斩杀各堕何处
    rationale: 欲令众知一肉多分杀煮炙斩俱受苦报不敢食啖
  - date: -0500-01-01
    title_zh: 问破斋及断酒肉得福几所
    rationale: 以破斋堕饿鬼铁轮示苦以断酒肉胜无量布施示福劝慈持斋发露忏悔
