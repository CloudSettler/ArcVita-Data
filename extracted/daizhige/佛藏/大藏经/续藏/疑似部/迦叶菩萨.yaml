- id: guji-迦叶菩萨-event-ask-wine
  person_qid: guji-迦叶菩萨
  title_zh: 佛前请问酒戒
  date: -0500-01-01
  year_of: -500
  description_zh: 于大众中问何者为善复问酒无命何故为苦佛为说不饮酒是真子说君臣父子因酒颠倒说吉槃陀沽酒堕锯床说鸯崛魔罗醉乱杀父淫母制五戒等不听饮酒酌劝酿造
- id: guji-迦叶菩萨-event-ask-meat
  person_qid: guji-迦叶菩萨
  title_zh: 佛前请问肉斋罪福
  date: -0500-01-01
  year_of: -500
  description_zh: 问食肉得何罪煮炙斩杀分几处破斋堕何处不饮酒不食肉得几福佛为说阿鼻粪秽镬汤炙床剉碓饿鬼铁轮诸狱及断酒肉胜布施百千万分之一劝发无上菩提心
- id: guji-迦叶菩萨-event-death
