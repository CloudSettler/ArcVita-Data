  - 苦行压抑与中道觉悟之间的修行抉择
  - 独善涅槃与兼善度众之间的弘化抉择
  lesson: 以中道智慧转生死苦为慈悲度众之愿行
  summary_first_person: 吾本迦毗罗卫王子悉达多，睹生老病死而逾城出家，历雪山苦行而悟中道，于菩提树下证觉，后转法轮四十余年，常以慈眼视众生，宣说观世音救苦法门，令持诵者临危得济，愿一切众生离苦安稳
