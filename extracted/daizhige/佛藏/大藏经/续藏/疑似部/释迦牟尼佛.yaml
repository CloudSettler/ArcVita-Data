endeavors:
- id: guji-释迦牟尼佛-endeavor-1
  title_zh: 出家求道证悟建教
  summary_zh: 舍王位出家，参访修学，苦行悟中道，菩提树下成正觉，创立佛教僧团
  phases:
  - key: brewing
    name: 王宫观苦萌发出离心
    labels:
      zh:
      - 萌发蓄势
    start_date: -563-04-08
    highlight_event_id: guji-释迦牟尼佛-event-birth
  - key: breakthrough
    name: 逾城出家遍参明师
    labels:
      zh:
      - 突破求道
    start_date: -534-01-01
    highlight_event_id: guji-释迦牟尼佛-event-renunciation
  - key: climax
    name: 菩提树下证悟成佛
    labels:
      zh:
      - 高潮证悟
    start_date: -528-12-08
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: closure
    name: 鹿野苑初转法轮建僧团
    labels:
      zh:
      - 收束建制
    start_date: -527-06-01
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  decisions:
  - date: -534-01-01
    title_zh: 夜半逾城舍位出家
    rationale: 目睹生老病死大苦，了知王位富乐不能免苦，故舍国求解脱之道
  - date: -529-01-01
    title_zh: 舍弃苦行取中道
    rationale: 久修苦行身心羸损而未得解脱，悟极端无益，故受乳糜调身修定取中道证悟
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 宣说观音救苦法门
  summary_zh: 以慈悲本怀宣说观世音救苦救难法门，开示持诵功德，结集为高王观世音经流传后世
  phases:
  - key: brewing
    name: 长时观察众生苦难因缘
    labels:
      zh:
      - 慈悲观察
    start_date: -527-06-01
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: breakthrough
    name: 开示观世音称名解脱法
    labels:
      zh:
      - 开显妙法
    start_date: -484-05-01
    highlight_event_id: guji-释迦牟尼佛-event-preach-guanyin
  - key: climax
    name: 付嘱流通高王观世音经
    labels:
      zh:
      - 付嘱流通
    start_date: -484-05-01
    highlight_event_id: guji-释迦牟尼佛-event-preach-guanyin
  - key: closure
    name: 双林涅槃以法付嘱弟子
    labels:
      zh:
      - 涅槃付嘱
    start_date: -483-02-15
    highlight_event_id: guji-释迦牟尼佛-event-death
  decisions:
  - date: -484-05-01
    title_zh: 宣说七佛咒及观音圣号
    rationale: 哀愍末世众生多逢刀兵牢狱毒害急难，故说神咒圣号令称念得救
  - date: -483-02-15
    title_zh: 以正法付嘱流通不令断绝
    rationale: 色身无常而法身常住，为令后世薄福众生亦得度脱，故付嘱结集流通
events:
- id: guji-释迦牟尼佛-event-birth
  date: -563-04-08
  year_of: -563
  title_zh: 蓝毗尼园降生
  description_zh: 净饭王之子悉达多诞生于蓝毗尼园，为后成佛之本生起点
- id: guji-释迦牟尼佛-event-renunciation
  date: -534-01-01
  year_of: -534
  title_zh: 夜半逾城出家
  description_zh: 感生老病死苦，舍太子位，逾城出家遍访外道明师求解脱
- id: guji-释迦牟尼佛-event-enlightenment
  date: -528-12-08
  year_of: -528
  title_zh: 菩提树下成正觉
  description_zh: 于菩提伽耶菩提树下夜睹明星悟道，号释迦牟尼佛，始建佛教
- id: guji-释迦牟尼佛-event-preach-guanyin
  date: -484-05-01
  year_of: -484
  title_zh: 宣说观世音救苦法门
  description_zh: 于众中开示观世音菩萨称名救苦功德，宣说七佛咒及诸佛名号，后结集为高王观世音经
- id: guji-释迦牟尼佛-event-death
  date: -483-02-15
  year_of: -483
  title_zh: 拘尸那揭罗涅槃
  description_zh: 于娑罗双树间入般涅槃，以正法付嘱弟子结集流通
