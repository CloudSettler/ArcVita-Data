endeavors:
- id: guji-阿难-endeavor-1
  person_qid: guji-阿难
  title_zh: 随侍世尊请问慈教
  summary_zh: 久为侍者随佛听法，于无量大慈教中发问阐提化度，西方往生，三难得免，及种种因果，令大慈教广宣阎浮
  phases:
  - key: brewing
    name: 出家随侍
    labels:
      zh: 亲近听法
    start_date: -0525-01-01
    highlight_event_id: guji-阿难-event-shici
  - key: breakthrough
    name: 请问难化
    labels:
      zh: 发问阐提
    start_date: -0485-01-01
    highlight_event_id: guji-阿难-event-wenjing
  - key: climax
    name: 具问因果
    labels:
      zh: 明辨果报
    start_date: -0484-01-01
    highlight_event_id: guji-阿难-event-xiufu
  - key: closure
    name: 流通欢喜
    labels:
      zh: 信受奉行
    start_date: -0483-01-01
    highlight_event_id: guji-阿难-event-wenjing
  decisions:
  - date: -0485-01-01
    title_zh: 问阐提难化及西方往生缘
    rationale: 愍念阎浮众生难化难育，愿明药生西方之缘，乃至身口不净亦不辞劳，欲开慈教化门
  - date: -0484-01-01
    title_zh: 问酒肉偷盗谤僧及修福见佛
    rationale: 欲明饮酒破戒，食肉杀想，盗物作奴，伽蓝善恶，及修福明盲之别，以断众疑立正因果
- id: guji-阿难-endeavor-2
  person_qid: guji-阿难
  title_zh: 持诵流通护持三宝
  summary_zh: 承佛教敕尽心为人演说无量大慈教，劝勉舍财经营三宝，受戒忏悔同修净行，令闻者生欢喜发善心生净土
  phases:
  - key: brewing
    name: 禀受敕命
    labels:
      zh: 尽心为说
    start_date: -0484-06-01
    highlight_event_id: guji-阿难-event-xiufu
  - key: breakthrough
    name: 宣说三难得免
    labels:
      zh: 勤诵免苦
    start_date: -0483-06-01
    highlight_event_id: guji-阿难-event-wenjing
  - key: climax
    name: 劝修净行
    labels:
      zh: 普劝同修
    start_date: -0480-01-01
    highlight_event_id: guji-阿难-event-huchi
  - key: closure
    name: 结集护法
    labels:
      zh: 作礼而去
    start_date: -0425-01-01
    highlight_event_id: guji-阿难-event-huchi
  decisions:
  - date: -0483-06-01
    title_zh: 承担尽心为说之任
    rationale: 见闻经者如子见母远行得归，如饥得食如渴得浆，当如旱得水般为叹喜者说，不为如石浸水者徒劳
  - date: -0480-01-01
    title_zh: 劝众经营三宝护持大法
    rationale: 鉴善恶入寺二种心，善者礼拜忏悔舍财护法举足即趣天堂，恶者乞索谤僧堕铁叉地狱，故劝舍身命以护法
events:
- id: guji-阿难-event-birth
  person_qid: guji-阿难
  title_zh: 阿难降生
  date: -0544-01-01
  year_of: -544
  type: birth
  description_zh: 阿难生于古印度释迦族中，为佛堂弟，后出家为佛侍者，多闻第一
- id: guji-阿难-event-shici
  person_qid: guji-阿难
  title_zh: 出家随侍世尊
  date: -0525-01-01
  year_of: -525
  type: career
  description_zh: 阿难出家后常随世尊左右，亲近听法，具问阎浮教化因缘，为请说大慈教之缘起
- id: guji-阿难-event-wenjing
  person_qid: guji-阿难
  title_zh: 请问无量大慈教经
  date: -0484-03-01
  year_of: -484
  type: career
  description_zh: 阿难白佛问阐提难化，药生西方之缘，三难得免，劫剥师僧堕寒冰地狱，不净行尼堕铁窟地狱，饮酒堕饮铜地狱等，佛为开示殊别殊胜菩萨三名之经
- id: guji-阿难-event-xiufu
  person_qid: guji-阿难
  title_zh: 请问修福明盲及善恶因果
  date: -0484-06-01
  year_of: -484
  type: career
  description_zh: 阿难复问日月普照盲者不见之喻，佛答修福者明不修福者盲，障闭佛光污泥三宝则不见佛，并说食肉盗物伽蓝善恶及七岁修福临终破戒如毂车翻覆之喻
- id: guji-阿难-event-huchi
  person_qid: guji-阿难
  title_zh: 流通护持普劝同修净行
  date: -0480-01-01
  year_of: -480
  type: career
  description_zh: 承佛广说因缘共同成佛之旨，阿难流通大慈教，劝天人阿修罗等同修净行，闻者皆大欢喜作礼而去
- id: guji-阿难-event-death
  person_qid: guji-阿难
  title_zh: 阿难入灭
  date: -0424-01-01
  year_of: -424
  type: death
  description_zh: 阿难住寿传持教法后入灭，多闻之业流布后世，大慈教经因其请问得传阎浮
