endeavors:
- id: guji-首罗比丘-endeavor-1
  title_zh: 诣大仙请问免灾度世之法
  summary: 首罗诣大仙，屡问水难病灾妖邪大魔免脱之方，得闻持戒奉斋敬信三宝与月光出世阳州免难之说。
  phases:
  - key: brewing
    name: 初问水难免脱方
    labels:
      zh: 问水难
    start_date: '0180-01-01'
    highlight_event_id: guji-首罗比丘-event-ask-immortal
  - key: breakthrough
    name: 再问病灾妖邪大魔却法
    labels:
      zh: 问病灾邪魔
    start_date: '0180-06-01'
    highlight_event_id: guji-首罗比丘-event-ask-immortal
  - key: climax
    name: 得闻月光出世与阳州免难
    labels:
      zh: 闻授记
    start_date: '0181-01-01'
    highlight_event_id: guji-首罗比丘-event-ask-immortal
  decisions:
  - date: '0180-01-01'
    title_zh: 决定敬信三宝持斋礼拜以免水难
    rationale: 大仙言敬信不懈持斋礼拜可免大水之难，故立此为首要行持
  - date: '0180-06-01'
    title_zh: 决定不信妖邪唯平等敬奉贤圣
    rationale: 妖邪多种受敕莫信，贤圣难识宜行平等，故不逐邪说唯求善法
- id: guji-首罗比丘-endeavor-2
  title_zh: 敕四众持戒流布此经
  summary: 首罗以大仙所敕告比丘比丘尼优婆塞优婆夷，劝持三归五戒奉行斋法，并令城邑聚落流布此经使一切闻知。
  phases:
  - key: brewing
    name: 告四众大宝将至莫作常意
    labels:
      zh: 普告
    start_date: '0190-01-01'
    highlight_event_id: guji-首罗比丘-event-admonish-assembly
  - key: breakthrough
    name: 劝持三归五戒奉斋诵经
    labels:
      zh: 劝持戒
    start_date: '0190-03-01'
    highlight_event_id: guji-首罗比丘-event-admonish-assembly
  - key: climax
    name: 立流布功罪流通隐匿得失
    labels:
      zh: 立流布
    start_date: '0190-06-01'
    highlight_event_id: guji-首罗比丘-event-admonish-assembly
  - key: closure
    name: 付嘱城邑聚落皆使闻知
    labels:
      zh: 付嘱
    start_date: '0191-01-01'
    highlight_event_id: guji-首罗比丘-event-admonish-assembly
  decisions:
  - date: '0190-01-01'
    title_zh: 决定敕众坐禅诵经勤修三业
    rationale: 大灾将至本师父母国主皆当示经，故以勤修三业度恶世为要
  - date: '0190-06-01'
    title_zh: 决定流布此经不令隐匿章句
    rationale: 流通功德胜施三千国土珍宝，隐匿则堕恶道现世不吉，故立流布为度世正行
events:
- id: guji-首罗比丘-event-birth
  title_zh: 首罗出生
  date: '0150-01-01'
  year_of: 150
  place_zh: 汉境传说
  summary: 首罗生于汉境传说之世，生年无考，后出家为比丘，号首罗比丘。
- id: guji-首罗比丘-event-ask-immortal
  title_zh: 诣大仙问免水难妖邪大魔法
  date: '0180-01-01'
  year_of: 180
  place_zh: 太宁寺仙人所
  summary: 首罗问大仙何方免水难病灾妖邪之灾，得闻持斋礼拜持戒奉斋莫信妖邪，又闻赫天却大魔七日闇夜叉食人与唯阳州东南得无为之说。
- id: guji-首罗比丘-event-admonish-assembly
  title_zh: 告四众流布此经度末世
  date: '0190-01-01'
  year_of: 190
  place_zh: 四众集会处
  summary: 首罗告比丘比丘尼优婆塞优婆夷，大灾将至莫如常意，劝受三归五戒奉行斋法诵观世音，令城邑聚落皆使闻知，隐匿此经必堕恶道。
- id: guji-首罗比丘-event-death
  title_zh: 首罗示寂存没无考
  date: '0220-12-31'
  year_of: 220
  place_zh: 汉境传说
  summary: 首罗付嘱流布之后存没无考，传说示寂，其所传首罗比丘经于疑似部流传后世。
