    rationale: 为令河西军民皆能听受欢喜故不尚华饰而存哀愍开演之旨
- id: guji-道泰-endeavor-2
  title_zh: 河西弘法以施摄众安乱世
  description: 当北凉扰攘以财施法施救贫苦劝久住生死不行独解脱
  phases:
  - key: brewing
    name: 出家持戒立悲愿
