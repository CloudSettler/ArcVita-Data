    title_zh: 不求速证涅槃愿久处生死修施
    rationale: 见众生三有炽苦若独求解脱则违大悲故以施乐为解脱
  - date: '0432'
    title_zh: 以所得功德回施乞者愿其同成施主
    rationale: 菩提因乞者而得若不报恩则施不清净故当施菩提于一切
