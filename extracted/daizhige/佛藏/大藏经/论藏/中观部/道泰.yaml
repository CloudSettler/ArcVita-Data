  - key: climax
    name: 劝众恭敬乞者视施为解脱
    labels:
      zh: 劝施高潮
    start_date: '0430'
    highlight_event_id: guji-道泰-event-preach
  - key: closure
    name: 退隐修定回向菩提与乞者
    labels:
      zh: 回向收束
    start_date: '0435'
    highlight_event_id: guji-道泰-event-death
  decisions:
