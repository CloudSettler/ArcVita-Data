endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 开中观正道破有无显缘起性空
  summary: 于南天竺悟缘起无自性之理，造中论等摧破外道小乘执见，立八不中道弘通大乘
  phases:
  - key: brewing
    name: 少年博学蕴中道之疑
    labels:
      zh: 博学蓄疑
    start_date: '0165-01-01'
    highlight_event_id: guji-龙树-event-enlighten
  - key: breakthrough
    name: 悟缘起通达实相
    labels:
      zh: 悟入实相
    start_date: '0180-01-01'
    highlight_event_id: guji-龙树-event-enlighten
  - key: climax
    name: 造中论摧破诸执
    labels:
      zh: 造论破邪
    start_date: '0190-01-01'
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: closure
    name: 弘化付法提婆
    labels:
      zh: 弘传付嘱
    start_date: '0220-01-01'
    highlight_event_id: guji-龙树-event-teach
  decisions:
  - date: '0180-01-01'
    title_zh: 舍婆罗门术归依佛法
    rationale: 见世术不出生死，慕佛法甚深法藏能灭大苦故回心求道
  - date: '0190-01-01'
    title_zh: 以八不缘起总破生灭断常
    rationale: 欲令利钝俱得正观，先立不生不灭不常不断之宗以定邪正
- id: guji-龙树-endeavor-2
  title_zh: 造十二门论略解摩诃衍空义
  summary: 愍末世钝根寻经不达，故以因缘等十二门入空，事尽有无，理极虚位，开道场要轨
  phases:
  - key: brewing
    name: 愍钝根不达深经而发心略解
    labels:
      zh: 愍众发心
    start_date: '0195-01-01'
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: breakthrough
    name: 立十二门总摄众枝
    labels:
      zh: 开门立纲
    start_date: '0200-01-01'
    highlight_event_id: guji-龙树-event-twelvegates
  - key: climax
    name: 次第破因缘果相一异有无
    labels:
      zh: 广破显空
    start_date: '0205-01-01'
    highlight_event_id: guji-龙树-event-twelvegates
  - key: closure
    name: 会归涅槃无所得安归佛地
    labels:
      zh: 会归佛地
    start_date: '0210-01-01'
    highlight_event_id: guji-龙树-event-teach
  decisions:
  - date: '0200-01-01'
    title_zh: 以因缘门为首明众缘所生即无自性
    rationale: 万法所因推而会之实无自性，通达无滞故先开此门为入空初要
  - date: '0205-01-01'
    title_zh: 重推果缘相性因果作时生等十一门
    rationale: 若一理不尽则众异纷然，故须有无兼畅令事无不尽而忘筌得实
events:
- id: guji-龙树-event-birth
  title_zh: 诞生南天竺婆罗门家
  date: '0150-01-01'
  year_of: 150
  summary: 相传生于南天竺婆罗门家，天资聪颖，少习世间婆罗门术学，兼通四韦陀方术
- id: guji-龙树-event-enlighten
  title_zh: 归佛悟道深入龙宫传经
  date: '0180-01-01'
  year_of: 180
  summary: 厌世术无常，归依佛法，诵习三藏，悟无生法忍，相传入龙宫赍华严等大乘经出而弘阐
- id: guji-龙树-event-madhyamaka
  title_zh: 造中论等开中观正法
  date: '0190-01-01'
  year_of: 190
  summary: 造中论大智度论等，以缘起八不破有无断常，摧外道小乘执，奠定大乘中观宗义
- id: guji-龙树-event-twelvegates
  title_zh: 造十二门论开十二门入空
  date: '0200-01-01'
  year_of: 200
  summary: 为令钝根开悟光阐无上大法，略解摩诃衍空义，作十二门，自因缘门至生门，广破自性，姚秦时鸠摩罗什译传中土
- id: guji-龙树-event-teach
  title_zh: 住持弘化付法提婆
  date: '0220-01-01'
  year_of: 220
  summary: 住南天竺弘化一方，破邪显正，摄受提婆等弟子付嘱正法，令中道慧命相续
- id: guji-龙树-event-death
  title_zh: 示寂南天竺
  date: '0250-01-01'
  year_of: 250
  summary: 化缘既毕，安然示寂，后世尊为第二释迦，八宗共祖，十二门要轨永传
