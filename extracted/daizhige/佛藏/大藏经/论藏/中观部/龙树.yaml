  - title_zh: 有无执见难破
    description: 凡夫于无性计有性，于无生计有生，起烦恼及苦乐舍，如何破分别而不堕断常
  - title_zh: 生死度脱难运
    description: 众生烦恼水充满生死海，六趣轮转如野火烧林，如何以大乘运载令到彼岸
  lesson: 诸法缘生无性如幻如梦，灭心轮即灭一切法，当发菩提心广修菩萨行
  summary_first_person: 吾归命不可思议真实智，观第一义无生、佛与众生如虚空平等，见众生妄分别受老病死苦，故说二十颂破执显空，劝发菩提以大乘度脱
