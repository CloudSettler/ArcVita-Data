  summary: 依第一义无生宣说缘生性空，破有无二边，显佛众生一相平等
  phases:
  - key: brewing
    name: 南印度学禅观缘起
    labels:
      zh: 缘起观
    start_date: 0165-01-01
    highlight_event_id: guji-龙树-event-birth
  - key: breakthrough
    name: 悟无生立中道义
    labels:
      zh: 无生义
    start_date: 0180-01-01
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: climax
    name: 造论广破分别见
    labels:
      zh: 破邪显正
    start_date: 0200-01-01
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: closure
    name: 以空摄大乘二十颂
