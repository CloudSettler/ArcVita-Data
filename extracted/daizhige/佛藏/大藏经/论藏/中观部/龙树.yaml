    start_date: 0220-01-01
    highlight_event_id: guji-龙树-event-ershisong
  decisions:
  - date: 0180-01-01
    title_zh: 以缘生破自性见
    rationale: 若法有自性则不待缘，以观自性缘所生故知此彼岸无生、诸行皆空
  - date: 0200-01-01
    title_zh: 以幻喻示诸法性
    rationale: 众生如幻取幻境，自画夜叉而自怖，当说影像梦幻喻令知无实我
- id: guji-龙树-endeavor-2
  title_zh: 发菩提心大乘度生
  summary: 见众生无救起悲愍，发菩提广修行，示正真义令离初中后际到彼岸
  phases:
  - key: brewing
    name: 观众生坠堕起悲愍
    labels:
      zh: 悲愍观
    start_date: 0190-01-01
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: breakthrough
    name: 发菩提心修菩萨行
    labels:
      zh: 菩提心
    start_date: 0200-01-01
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: climax
    name: 说二十颂劝运大乘
    labels:
      zh: 大乘运载
    start_date: 0220-01-01
    highlight_event_id: guji-龙树-event-ershisong
  - key: closure
    name: 观生死涅槃俱空寂
    labels:
      zh: 生死涅槃空
    start_date: 0240-01-01
    highlight_event_id: guji-龙树-event-death
  decisions:
  - date: 0200-01-01
    title_zh: 发无上菩提愿
    rationale: 佛见彼无救乃起悲意，欲令分别缠缚者得利益，故发心修无上智果行
  - date: 0220-01-01
    title_zh: 以二十颂总摄修证
    rationale: 世间法即无明缘，不起分别则无所生，当以要颂示唯心幻化、灭心轮之道
