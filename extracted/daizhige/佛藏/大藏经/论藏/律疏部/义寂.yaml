  summary_first_person: 吾新罗沙门义寂以戒为道之所由生见梵网戒经文义深隐故依瑜伽地持本业诸论造疏先立受随二门次辨顺违缘成既明堪能种姓愿行与七逆十重三障去取又定同法发愿有智有力能授能开之师德与请师求力乞戒问缘正受请证礼退八轨终归三聚摄持律仪摄善饶益和合守护愿后学专精无犯中下犯已还净不失菩提
