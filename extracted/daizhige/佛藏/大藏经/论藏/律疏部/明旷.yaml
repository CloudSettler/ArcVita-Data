  decisions:
  - date: 0768-01-01
    title_zh: 先忏后受定三品忏法
    rationale: 戒是白净法，身器清净乃可堪受，如浣故衣方受染色，故运逆顺十心忏除十恶五逆
  - date: 0770-01-01
    title_zh: 三说授受摄律仪摄善法饶益有情
    rationale: 一刹那心十戒具足，事理双持以成圆顿菩萨律仪，令妙善戒法注身心满足
