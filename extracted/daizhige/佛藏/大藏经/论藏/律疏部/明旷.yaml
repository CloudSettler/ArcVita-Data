  decisions:
  - date: 0755-01-01
    title_zh: 以天台为宗骨定取舍
    rationale: 缘宜不同义有广略，为彰教旨四悉适时，不违先见而扶文
  - date: 0760-01-01
    title_zh: 开七门随文解释
    rationale: 明名体宗用教摄受法传译料简，然后销释序正流通，令行者得根本传授之意
- id: guji-明旷-endeavor-2
  title_zh: 建立菩萨戒十二门受法
  summary_zh: 依璎珞地持等文立开悟三归请师忏悔发心问遮授戒证明现相陈持犯发愿持戒十二门，轨范受持十重四十八轻
  phases:
