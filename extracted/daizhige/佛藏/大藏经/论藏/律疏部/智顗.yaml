  date: '0575'
  year_of: 575
  place_zh: 天台山
  description: 携弟子入天台，结庐修法华三昧，讲摩诃止观法华玄义，奠定天台一宗之基
- id: guji-智顗-event-preach
  title_zh: 说菩萨戒义疏释梵网心地品
