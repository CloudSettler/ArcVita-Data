endeavors:
- id: guji-智顗-endeavor-1
  title_zh: 敷演梵网菩萨戒义疏
  summary: 依鸠摩罗什所传梵网经律藏品明心地戒名体宗用立三聚十重判无作戒体
  phases:
  - key: brewing
    name: 承什师遗教深究梵网心地
    labels:
      zh: 酝酿研教
    start_date: '0575'
    highlight_event_id: guji-智顗-event-ordination
  - key: climax
    name: 宣说戒义疏广明天台戒观
    labels:
      zh: 高峰敷演
    start_date: 0594
    highlight_event_id: guji-智顗-event-preach
  decisions:
  - date: 0590
    title_zh: 依梵网经立心地戒为菩萨律仪正宗
    rationale: 欲以意业为主遍防三业统大小乘故舍名相繁争归心地妙旨
  - date: 0594
    title_zh: 以无作假色为戒体兼明止行二善
    rationale: 欲会成实毗昙等地持大论之诤明心力感发誓愿远至菩提故立有以化物
- id: guji-智顗-endeavor-2
  title_zh: 判立四教创天台止观
  summary: 判藏通别圆四教明五十二位及一心三观导禅定慧学使定道共戒相资
  phases:
  - key: breakthrough
    name: 从慧思受法华安般融通定慧
    labels:
      zh: 突破悟入
    start_date: '0560'
    highlight_event_id: guji-智顗-event-ordination
  - key: closure
    name: 居天台国清制止观弘圆教
    labels:
      zh: 收束立宗
    start_date: '0575'
    highlight_event_id: guji-智顗-event-tiantaishan
  decisions:
  - date: '0575'
    title_zh: 入天台山结庐修观立教观双轨
    rationale: 欲避世缘扰动专修法华三昧以实证验教判故栖岩壑以成宗
  - date: 0594
    title_zh: 以中道第一义谛戒该摄十种戒行
    rationale: 欲令律仪定道不二使学人即止观成净戒故以圆融收权实
