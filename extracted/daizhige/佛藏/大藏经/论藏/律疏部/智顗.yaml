  description: 依罗什译梵网经敷演戒序名体阶位，明三聚无作止行，开藏通别圆四教，门人灌顶记录成疏上下两卷
- id: guji-智顗-event-death
  title_zh: 石城圆寂遗嘱弘护正法
  date: 0597
  year_of: 597
  place_zh: 石城
  description: 隋开皇十七年十一月示寂于石城，年六十，遗命以戒定慧化世，隋炀帝受菩萨戒遥尊为师
