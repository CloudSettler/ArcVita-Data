      - 献经
    start_date: '0643'
    highlight_event_id: guji-玄奘-event-donggui
  decisions:
  - date: 0629
    title_zh: 贞观三年决意偷渡西行
    rationale: 慨诸师所说不一，欲亲往天竺求瑜伽对法真旨，虽禁令不许亦不改其志
  - date: '0636'
    title_zh: 留学那烂陀师从戒贤
    rationale: 欲穷究瑜伽唯识与阿毗达磨法相，故久住讲习，遍学大小乘论
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘扬对法
  summary: 贞观十九年归国后奉诏主持译场，译出大般若瑜伽师地入阿毗达磨论等七十余部，建慈恩寺以弘法相唯识
  phases:
  - key: brewing
