  - date: 0629
    title_zh: 冒禁偷渡玉门关
    rationale: 诸师章疏异同，无以决疑，宁违国禁也要亲往天竺求取原本
  - date: 414
    title_zh: 留学那烂陀兼学毗昙
    rationale: 大乘虽胜，须以毗昙品类明色心心所无为法相，方能破邪显正
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘毗昙
  summary_zh: 归国后奉太宗高宗诏，于弘福慈恩玉华译经，译出阿毗达磨品类足论，辩五事十智十二处，立有部法相纲宗
  phases:
