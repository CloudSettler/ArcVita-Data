      - 示寂
    start_date: '0663'
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: '0645'
    title_zh: 受诏专事翻译不就宰辅
    rationale: 以弘法利生为己任，谢绝朝位，愿以译经拔除中土法相愚闇
  - date: '0654'
    title_zh: 译出入阿毗达磨论以利初学
    rationale: 悯劣慧者闻对法名义稠林生怖畏，欲令于法相海易入，故译塞建陀罗所造略论以示纲要
