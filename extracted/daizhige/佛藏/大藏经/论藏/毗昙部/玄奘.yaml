  decisions:
  - date: 421
    title_zh: 受诏专心译经不就相州
    rationale: 弘法利生莫大于译经，辞官守译场以全翻译大业
  - date: 432
    title_zh: 先译品类足论明法相纲要
    rationale: 品类足论为众足论之纲，辩五法十智，能为唯识瑜伽张本，故先译以正名相
events:
- id: guji-玄奘-event-birth
  title_zh: 诞生洛州缑氏陈家
  date: 386
  year_of: 602
  summary_zh: 隋仁寿二年生于洛州缑氏，幼颖悟，十三岁出家洛阳净土寺
- id: guji-玄奘-event-xixing
  title_zh: 贞观三年偷渡西行
  date: 0629-08-01
  year_of: 629
  summary_zh: 贞观三年自长安出发，偷渡玉门，度流沙，经高昌龟兹，前往天竺求法
- id: guji-玄奘-event-qiufa
  title_zh: 那烂陀从戒贤受学
  date: 0636-01-01
  year_of: 636
  summary_zh: 至中天竺那烂陀，从戒贤论师学瑜伽唯识，兼习说一切有部毗昙品类五事诸智之学
- id: guji-玄奘-event-huigui
  title_zh: 贞观十九年负经东归
  date: 0645-01-01
  year_of: 645
  summary_zh: 贞观十九年归抵长安，奉敕于弘福寺设译场，太宗亲访叙西域记
- id: guji-玄奘-event-yipinlei
  title_zh: 奉诏译阿毗达磨品类足论
  date: 0660-01-01
  year_of: 660
  summary_zh: 于玉华宫奉诏译尊者世友造品类足论，辩五事品第一，明色心心所心不相应行无为，又辩诸智品十智所缘，辩诸处品十二处，凡十八卷成
- id: guji-玄奘-event-death
  title_zh: 麟德元年寂于玉华宫
  date: 0664-02-05
  year_of: 664
  summary_zh: 麟德元年二月五日寂于玉华宫嘉寿殿，门人窥基等传其唯识品类之学
