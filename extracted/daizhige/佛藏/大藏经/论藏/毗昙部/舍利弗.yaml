  summary_first_person: 吾舍利弗忝居左面亲承佛前所闻不忍纯风乖忤圣道亏曚故敢集经法先立章以崇本次广演以明义分问分非问分摄相应分序分四体以明二谛但愿殉有者祛妄向化者即隆耳
