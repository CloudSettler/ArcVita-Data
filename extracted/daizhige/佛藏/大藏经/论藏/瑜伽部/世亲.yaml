person:
  qid: guji-世亲
  name_zh: 世亲
  names:
    zh: 世亲
    en: Vasubandhu
  lifespan:
    birth:
      date: 0320-01-01
      precision: year
      is_circa: true
      raw: 约公元三二〇年生于北印度富娄沙富罗国
    death:
      date: 0400-01-01
      precision: year
      is_circa: true
      raw: 约公元四〇〇年入灭于中印度阿瑜陀
  birth_date: 0320-01-01
  death_date: 0400-01-01
  era: 印度笈多王朝前期
  reign_ref: 笈多王朝前期相当中土东晋南北朝之际
  archetype: 论师弘法型
  dilemmas:
  - title_zh: 守有部实有旧说还是开唯识中道新宗
    description: 早年精通说一切有部毗婆沙而名重北印，若安守旧说可保盛名，若转弘大乘则须重构体系承担破立之责
  - title_zh: 求自利解脱还是求利他一切智智
    description: 声闻但求自了生死，菩萨须遍知一切所缘成就三身，为显大乘十胜相须广造论释摄受学众
  lesson: 由闻熏习由思决择由修证入，依阿赖耶识为依止，观三性唯识入无分别智，终证无住涅槃与三身圆满
  summary_first_person: 吾世亲生于北印富娄沙富罗，先习有部毗婆沙，后受兄无著化导转趣大乘瑜伽行，以俱舍集小乘之大成，以唯识三十及摄大乘论释显十胜相，示人由应知依止经三性唯识六度十地三学而入灭智，愿学者离增益损减二边得一切智智
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E7%91%9C%E4%BC%BD%E9%83%A8/%E6%91%84%E5%A4%A7%E4%B9%98%E8%AE%BA%E9%87%8A%E8%AE%BA.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E7%91%9C%E4%BC%BD%E9%83%A8/%E6%91%84%E5%A4%A7%E4%B9%98%E8%AE%BA%E9%87%8A%E8%AE%BA.html
endeavors:
- id: guji-世亲-endeavor-1
  title_zh: 精研有部造俱舍集小乘大成
  summary: 于迦湿弥罗富娄沙富罗等地广学说一切有部大毗婆沙，造阿毗达磨俱舍论以颂摄义，决择因果业报凡圣差别
  phases:
  - key: brewing
    name: 北印出家广习婆沙
    labels:
      zh:
      - 有部研习
    start_date: 0335-01-01
    highlight_event_id: guji-世亲-event-birth
  - key: breakthrough
    name: 颂摄俱舍决择正义
    labels:
      zh:
      - 俱舍造论
    start_date: 0375-01-01
    highlight_event_id: guji-世亲-event-jushe
  - key: climax
    name: 破犊子我执显因果
    labels:
      zh:
      - 破执显正
    start_date: 0380-01-01
    highlight_event_id: guji-世亲-event-jushe
  - key: closure
    name: 声名遍北印诸国请益
    labels:
      zh:
      - 论师扬名
    start_date: 0382-01-01
    highlight_event_id: guji-世亲-event-jushe
  decisions:
  - date: 0378-01-01
    title_zh: 以颂释体造俱舍论
    rationale: 有部义广而紊乱，须以精炼颂文摄持纲要再以长行解释，令初后学易持易解
  - date: 0380-01-01
    title_zh: 兼采经部正理破实有偏执
    rationale: 有部执实有过甚，经部发难有理，当以理胜义会通因果相续不断不常
- id: guji-世亲-endeavor-2
  title_zh: 转趣大乘造摄大乘释显唯识
  summary: 受兄无著感召转弘大乘瑜伽行唯识学，造唯识二十三十及摄大乘论释，广明阿赖耶识三性唯识十胜相三身无住涅槃
  phases:
  - key: brewing
    name: 受无著化观大乘深义
    labels:
      zh:
      - 回小向大
    start_date: 0383-01-01
    highlight_event_id: guji-世亲-event-jushe
  - key: breakthrough
    name: 悟唯识无境制唯识论
    labels:
      zh:
      - 唯识开宗
    start_date: 0386-01-01
    highlight_event_id: guji-世亲-event-shedachengshi
  - key: climax
    name: 释摄大乘明十胜相胜语
    labels:
      zh:
      - 摄大乘释
    start_date: 0390-01-01
    highlight_event_id: guji-世亲-event-shedachengshi
  - key: closure
    name: 付嘱门人弘传三身正法
    labels:
      zh:
      - 弘传付嘱
    start_date: 0396-01-01
    highlight_event_id: guji-世亲-event-death
  decisions:
  - date: 0385-01-01
    title_zh: 舍小乘偏执专弘唯识中道
    rationale: 知分别性本无而依他成就有，为离增益损减二边，须以三性说会通空有以唯识观入无分别
  - date: 0390-01-01
    title_zh: 造摄大乘论释广显十处殊胜
    rationale: 无著摄大乘本论义深，须广释应知依止相入因果修差别三学灭智十义，证大乘是佛语能引大菩提
events:
- id: guji-世亲-event-birth
  date: 0320-01-01
  year_of: 320
  title_zh: 诞生于富娄沙富罗婆罗门家
  description: 与兄无著同母异父，幼习声明因明，后出家学说一切有部，聪慧善辩闻名北印
- id: guji-世亲-event-jushe
  date: 0380-01-01
  year_of: 380
  title_zh: 造阿毗达磨俱舍论成小乘集大成
  description: 摄大毗婆沙精要作颂六百，明界根世间业惑贤圣智定，兼以经部义难破有部实有偏执
- id: guji-世亲-event-shedachengshi
  date: 0390-01-01
  year_of: 390
  title_zh: 造摄大乘论释广明十胜相胜语
  description: 释无著摄大乘论，明阿赖耶识为应知依止，三性为应知相，唯识为入相，六度十地三学灭智为修证次第，隋世由笈多共行矩等汉译流传中土
- id: guji-世亲-event-death
  date: 0400-01-01
  year_of: 400
  title_zh: 入灭于阿瑜陀付法后学
  description: 晚年弘扬大乘不辍，嘱陈那等门人续弘唯识因明，示无住涅槃而入灭，遗著经隋唐译传成为法相宗所依
