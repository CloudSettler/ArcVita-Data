endeavors:
- id: guji-天亲-endeavor-1
  title_zh: 有部出家造俱舍弘扬对法
  summary: 于说一切有部出家，精研婆沙对法，造俱舍论总摄小乘义，后知局执为转弘大乘奠基
  phases:
  - key: brewing
    name: 富娄沙富罗出家学婆沙
    labels:
      zh:
      - 酝酿
      - 闻思
    start_date: 216
    highlight_event_id: guji-天亲-event-abhidharma
  - key: breakthrough
    name: 造俱舍论名扬五印度
    labels:
      zh:
      - 突破
      - 造论
    start_date: 229
    highlight_event_id: guji-天亲-event-abhidharma
  decisions:
  - date: 229
    title_zh: 造俱舍论总摄有部大义
    rationale: 为总持对法义理，摄化小乘学者，故依经立论分别正邪
  - date: 232
    title_zh: 受兄无着劝发回小向大
    rationale: 了知有部执实未尽空性，欲通达大乘甚深唯识，故转学大乘
- id: guji-天亲-endeavor-2
  title_zh: 回小向大造唯识论立三界唯心
  summary: 依大乘经造唯识二十论三十颂等，以似尘识生破外尘实有，立三性二谛，明三空唯识
  phases:
  - key: breakthrough
    name: 依无着大乘庄严经庄严入唯识
    labels:
      zh:
      - 转向
      - 立宗
    start_date: 234
    highlight_event_id: guji-天亲-event-weishi
  - key: climax
    name: 造唯识诸论破执显理
    labels:
      zh:
      - 高峰
      - 破立
    start_date: 240
    highlight_event_id: guji-天亲-event-weishi
  - key: closure
    name: 以顶礼大乘理付嘱后学
    labels:
      zh:
      - 收束
      - 付嘱
    start_date: 0390
    highlight_event_id: guji-天亲-event-death
  decisions:
  - date: 240
    title_zh: 立三界唯有识破色尘实有
    rationale: 见众生妄执外境如翳见毛轮，故以梦境饿鬼地狱为喻，证离尘识生
  - date: 248
    title_zh: 分相应心与清净心以存佛性
    rationale: 恐拨无因果故，唯破妄识相应心，不破常住第一义清净心
events:
- id: guji-天亲-event-birth
  date: 206
  year_of: 316
  title_zh: 诞生于北印度富娄沙富罗
  description: 生于婆罗门家，与兄无着同为佛法大师，幼聪慧好学
  place_zh: 北印度富娄沙富罗
- id: guji-天亲-event-abhidharma
  date: 229
  year_of: 345
  title_zh: 精研毗婆沙造俱舍论
  description: 出家于说一切有部，博通婆沙，造阿毗达磨俱舍论，盛弘小乘对法
  place_zh: 北印度
- id: guji-天亲-event-weishi
  date: 240
  year_of: 360
  title_zh: 造唯识论立三空三性之旨
  description: 回小向大后造唯识二十论三十颂等，明人无我空因缘法体空真如法空，立似尘识生无实外尘
  place_zh: 中印度
- id: guji-天亲-event-death
  date: 0396
  year_of: 396
  title_zh: 造论弘法毕入灭
  description: 一生造论千部，晚年以唯识理付嘱，成就唯识理难思佛境而入灭
  place_zh: 中印度
