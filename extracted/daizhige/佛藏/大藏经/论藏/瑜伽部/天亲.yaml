  era: 古印度笈多王朝
  reign_ref: 旃陀罗笈多二世之世
  archetype: 义理论师
  dilemmas:
  - 小乘有部实有执与大乘空有圆融之间如何抉择
  - 立破外境与安立唯识正理之间如何善巧化导
  lesson: 但有内心无实外境，破妄识而不拨清净心，因果不虚故勤修唯识观
  summary_first_person: 我是天亲，生于北印度婆罗门家，初出家于说一切有部，造俱舍论盛弘小乘，后受兄无着感召回小向大，造唯识二十三十诸论，立三界唯心，安立三性二谛，以破外尘执，显清净佛性
  source_urls:
