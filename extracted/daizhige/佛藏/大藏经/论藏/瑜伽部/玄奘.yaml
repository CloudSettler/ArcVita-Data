  decisions:
  - date: 0629-08-01
    title_zh: 违禁偷渡出关
    rationale: 中土经论残缺义多乖违，不亲证印度本义无以决疑，故宁冒禁令西行
  - date: 0631-02-01
    title_zh: 留学那烂陀师事戒贤
    rationale: 欲会通空有决择业识之义，须依瑜伽行正统，故久住听受解深密瑜伽等教
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘传成业义
  summary: 归国后主持弘福会昌玉华等译场，译出大乘成业论等唯识典籍，发明无身实表业唯思熏本识感果
  phases:
