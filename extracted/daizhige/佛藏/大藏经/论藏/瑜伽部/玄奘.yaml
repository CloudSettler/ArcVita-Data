  archetype: 西行求法译经师
  dilemmas:
  - 违禁偷渡西行求法与安守中土讲习之抉择
  - 有宗空宗众说纷纭与会通瑜伽唯识正义之抉择
  - 暮年多病衰耗与勤勉不辍奉诏译经之抉择
  lesson: 以亲证求真会通群典，明业果相续不在表色而在思熏本识，利他传灯乃为成业
  summary_first_person: 我本洛州缑氏陈氏子，幼而慕法，长而疑经义多歧，遂偷渡西行万里取经，归国奉诏译经弘法，译出大乘成业论，发明身语表业无实，唯思熏阿赖耶识持种感果，愿后学因果不昧
