    name: 首译瑜伽解深密奠基
    labels:
      zh: 奠基立宗
    start_date: 0646-01-01
    highlight_event_id: guji-玄奘-event-yijing
  - key: climax
    name: 译出大乘成业论明业果
    labels:
      zh: 明业成论
    start_date: 0648-06-01
    highlight_event_id: guji-玄奘-event-yijing
  - key: closure
    name: 玉华守译传付弟子
    labels:
      zh: 守译传付
    start_date: 0660-01-01
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: 0648-06-01
    title_zh: 译传世亲大乘成业论
    rationale: 身语表业形色行动诸执皆不成立，当显思熏阿赖耶识持种感果，以正业果相续，故亟须传译
  - date: 0660-05-01
    title_zh: 移席玉华专心译经
    rationale: 京师酬对纷扰妨碍译业，欲毕余生完成大般若等巨译，故谢绝朝请专功翰墨
