  reign_ref: 唐太宗贞观至唐高宗麟德
  archetype: 西行求法译经师
  dilemmas:
  - title_zh: 冒禁偷渡与奉法守律
    description: 中土唯识经论不全，欲西行求瑜伽全本，然贞观禁边，唯偷渡可达天竺，守国律与成求法愿两难
  - title_zh: 广开译场与专修证悟
    description: 归国后帝命宏译，译业浩繁昼夜不辍，欲广利群生则难专修，欲自证则有负众望
  lesson: 总摄五位百法以显补特伽罗无我法无我，求法当不畏险难，译经当以简摄广，学理终归实修
  summary_first_person: 吾幼慕释教，慨中土经义残缺，冒禁西行十七载，师事戒贤于那烂陀，携梵本归唐，设译场于弘福慈恩，先译百法明门总摄心法心所色法不相应无为，以明一切法无我，愿后学由此入门唯识
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E7%91%9C%E4%BC%BD%E9%83%A8/%E5%A4%A7%E4%B9%98%E7%99%BE%E6%B3%95%E6%98%8E%E9%97%A8%E8%AE%BA.html
