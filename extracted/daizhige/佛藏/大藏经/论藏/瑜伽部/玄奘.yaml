  - date: 0648
    title_zh: 先译百法明门总摄五位
    rationale: 百法摄心法八种心所五十一种色法十一不相应二十四无为六种，最宜作唯识入门
events:
- id: guji-玄奘-event-birth
  date: '0602'
  year_of: 602
  title_zh: 诞生于河南缑氏陈家
  description: 隋仁寿二年生于缑氏，幼聪慧，十三岁出家，研摄论毗昙立志求全经
- id: guji-玄奘-event-xixing
  date: 0629
  year_of: 629
  title_zh: 贞观三年偷渡西行
  description: 贞观三年自长安出发，偷渡敦煌玉门，越大漠历西域诸国西往天竺
- id: guji-玄奘-event-nalanda
  date: '0633'
  year_of: 633
  title_zh: 抵那烂陀师事戒贤
  description: 抵中天竺那烂陀寺，从戒贤论师学瑜伽师地论唯识诸论凡五年
- id: guji-玄奘-event-donggui
  date: '0643'
  year_of: 643
  title_zh: 取梵本启程东归
  description: 于天竺取瑜伽百法等梵本六百余部，辞王启程，经西域东归长安
- id: guji-玄奘-event-guiguo
  date: '0645'
  year_of: 645
  title_zh: 贞观十九年归抵长安
  description: 正月归抵长安，太宗亲迎，诏住弘福寺，组织译场，弟子云集
- id: guji-玄奘-event-baifa
  date: 0648
  year_of: 648
  title_zh: 译出大乘百法明门论
  description: 弘福寺译出天亲造百法明门论，明五位百法与补特伽罗无我法无我，为法相入门
- id: guji-玄奘-event-hongfu
  date: 0659
  year_of: 659
  title_zh: 慈恩玉华广译大乘经论
  description: 迁慈恩寺玉华宫，译大般若成唯识等七十余部，以百法为纲弘传唯识
- id: guji-玄奘-event-death
  date: '0664-02-05'
  year_of: 664
  title_zh: 寂于玉华宫嘉寿殿
  description: 麟德元年正月寂于玉华宫，高宗罢朝悼念，葬浐东，唯识译业由窥基传持
