  date: 0548
  year_of: 548
  title_zh: 梁太清二年至建业
  description: 以法济时来仪建业属梁季将溃侯景之乱避地东西至九江游五岭适闽越敷说不少欲旋旧国遂达蕃禺
- id: guji-真谛-event-translation
  date: 366
