  - title_zh: 梁末乱世去留之抉
    description: 梁武帝崩侯景乱起，归国路绝，留则颠沛，归则负弘法本愿，进退两难
  - title_zh: 有相空性会通之难
    description: 中土空有争衡，欲以阿梨耶识转识之说立唯识正义，又恐学者执识为实，故须境识俱泯
  lesson: 乱世不辍译业，以转识之智转境界为修行，终使唯识种子植于中土
  summary_first_person: 吾本西天竺优禅尼人，名拘那罗陀，中土号真谛，奉梁武帝请来华，值侯景之乱颠沛岭南，犹发愿译经弘法，以转识摄论开唯识之门，愿学者离境识之执，同证无所得智
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/论藏/瑜伽部/转识论.md
