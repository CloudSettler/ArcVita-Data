endeavors:
- id: guji-一行-endeavor-1
  title_zh: 随善无畏译大日经并笔记经疏
  summary: 随从善无畏传译毗卢遮那成佛经，笔受宗要，记述入真言门住心品等义，立身语意三密平等法门
  phases:
  - key: brewing
    name: 从善无畏闻熏密藏
    labels:
      zh:
      - 亲近
      - 闻法
    start_date: '0716'
    highlight_event_id: guji-一行-event-1
  - key: breakthrough
    name: 笔受大日经宗要
    labels:
      zh:
      - 传译
      - 笔受
    start_date: '0725'
    highlight_event_id: guji-一行-event-1
  - key: climax
    name: 记述成佛经疏流通
    labels:
      zh:
      - 述疏
      - 弘传
    start_date: '0725'
    highlight_event_id: guji-一行-event-1
  - key: closure
    name: 以三密门接引群机
    labels:
      zh:
      - 住心
      - 利生
    start_date: '0726'
    highlight_event_id: guji-一行-event-1
  decisions:
  - date: '0725'
    title_zh: 以真语为门自心发菩提
    rationale: 众生自心即一切智智，须以身语心三密为方便，乃于此生满足地波罗蜜
  - date: '0725'
    title_zh: 省通序而直显住心品大意
    rationale: 大本十万偈浩广难持，采其宗要三千余颂，令行者易入平等句法门
- id: guji-一行-endeavor-2
  title_zh: 奉诏测验天象改制大衍历
  summary: 奉唐玄宗诏与梁令瓒等造黄道游仪，组织南北大地测量，制大衍历推步日月交食
  phases:
  - key: brewing
    name: 博览儒释兼通算术
    labels:
      zh:
      - 博学
      - 算历
    start_date: '0713'
    highlight_event_id: guji-一行-event-2
  - key: breakthrough
    name: 造游仪测南北晷影
    labels:
      zh:
      - 测验
      - 制器
    start_date: '0724'
    highlight_event_id: guji-一行-event-2
  - key: climax
    name: 撰成大衍历经
    labels:
      zh:
      - 推步
      - 颁历
    start_date: '0727'
    highlight_event_id: guji-一行-event-3
  - key: closure
    name: 以历象经世利民
    labels:
      zh:
      - 经世
      - 利生
    start_date: '0727'
    highlight_event_id: guji-一行-event-3
  decisions:
  - date: '0724'
    title_zh: 以实测校正旧历交食之失
    rationale: 旧历推步渐疏，须南北立表测影，考验黄道进退，方能得天行真数
  - date: '0727'
    title_zh: 以开元大衍历颁行天下
    rationale: 以上明天时下授民事，使农桑有节，兼显佛法经世致用不离世间
events:
- id: guji-一行-event-birth
  title_zh: 生于魏州昌乐张氏
  date: 0683
  year_of: 683
  summary: 唐弘道元年出生，俗姓张名遂，少聪慧博览经史，后出家名一行
- id: guji-一行-event-1
  title_zh: 助译大日经并笔记经疏
  date: '0725'
  year_of: 725
  summary: 助善无畏译出大毗卢遮那成佛神变加持经，笔受大要，记为经疏，发明入真言门住心品义
- id: guji-一行-event-2
  title_zh: 奉诏测影制黄道游仪
  date: '0724'
  year_of: 724
  summary: 奉玄宗诏改历，与梁令瓒造黄道游仪，遣使南北测晷影，考验天行
- id: guji-一行-event-3
  title_zh: 撰成大衍历颁行
  date: '0727'
  year_of: 727
  summary: 撰成大衍历经推步日月交食，开元十七年颁行，古今历法最为精密
- id: guji-一行-event-death
  title_zh: 寂于长安华严寺
  date: '0727'
  year_of: 727
  summary: 开元十五年寂于长安，年四十五，玄宗辍朝，谥大慧禅师
