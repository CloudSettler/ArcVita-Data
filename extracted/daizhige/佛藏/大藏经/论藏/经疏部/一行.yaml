  archetype: 高僧智者
  dilemmas:
  - 以真言门统摄显教万行时如何令学者不起空有二执
  - 出世修证与天文历算经世之务看似相违如何一心兼成
  lesson: 以无所住而住其心，真语为门即心具万行，世出世法一源并进
  summary_first_person: 吾俗姓张，少学儒释，后依善无畏学密，笔受大日经而记其疏，又奉诏考验天象改制新历，愿以身口意三密加持，令众生即心见佛，即事而真
