    rationale: 百千颂广本已没海，唯存略本可利此土，故宁舍他物不舍法宝，以续佛慧命
  - date: '0723'
    title_zh: 依梵文次第助译不失句义
    rationale: 一行等亲受笔受，务令梵汉相应，使瑜伽观行有据可依
