    title_zh: 以自利利他判摄全经
    rationale: 长行虽广不出内外证智与摄生大用，判为二门三段则学者有所循入
  - date: '0755'
    title_zh: 详述护摩炉坛印相不避破坏法
    rationale: 末世恶人破灭三宝，非威猛智用不能摧邪显正，故为智者说之为利益不为损害
