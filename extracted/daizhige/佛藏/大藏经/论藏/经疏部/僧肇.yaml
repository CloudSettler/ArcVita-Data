  dilemmas:
  - 言象有限而玄旨渊玄，如何以约诣之文显微远之言
  - 本迹虽殊而不思议为一，如何因人弘道以显法门
  lesson: 道不孤运弘之由人，述而不作亦可显不思议解脱
  summary_first_person: 吾僧肇幸逢弘始之运，于长安大寺预随罗什法师重译维摩诘经，亲承圣旨粗得文意，遂顺所闻为之注解，述而不作，愿以权智六度慈悲不二之旨，助显不思议解脱以泽群生
