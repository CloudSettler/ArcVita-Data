- id: guji-僧肇-event-retranslate
  title_zh: 长安大寺预重译维摩诘经
  date: '0406'
  year_of: 406
  place_zh: 长安大寺
  description_zh: 弘始八年岁次鹑火，大将军等与义学千二百人请罗什重译，什手执梵文口自宣译，道俗一言三复，文约旨彰
