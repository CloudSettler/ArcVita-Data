  title_zh: 作注维摩诘经并序
  date: '0407'
  year_of: 407
  place_zh: 长安
  description_zh: 顺所闻为之注解，明维摩诘所说本末，立权智六度慈悲不二之宗，阐不思议解脱之迹，总以人名法名标经
- id: guji-僧肇-event-death
  title_zh: 长安圆寂
  date: '0414'
  year_of: 414
  place_zh: 长安
  description_zh: 弘法译注功成，于长安示寂，世传肇论诸作与维摩注并显中土般若之学
