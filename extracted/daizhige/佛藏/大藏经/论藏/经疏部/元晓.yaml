  archetype: 会通弘化型高僧
  dilemmas:
  - 入唐求法与安住本土以心求法之抉择
  - 空有诸宗诤论纷然与一心和会归于一味之抉择
  lesson: 万法归于一心，无所得即无所不得，以和诤契理，以悲愿利俗
  summary_first_person: 吾是新罗沙门元晓，少而出家，欲往唐土求法，中途梦悟心外无法，遂返国专事著述，以一心一味摄尽大乘，作金刚三昧经论，开四门，显六品观行，愿后世末法众生同入实相，同得解脱
  source_urls:
  - https://zh.wikisource.org/wiki/金剛三昧經論
  - https://cbetaonline.dila.edu.tw/zh/T1730
