  description: 壮年出家遍学三论唯识涅槃华严发愿西行唐土亲承玄奘诸师
- id: guji-元晓-event-return
  title_zh: 两度西行中途顿悟而返
  date: 0661-01-01
  year_of: 661
  place_zh: 唐境途中土龛
  description: 与义湘共往唐土夜宿疑为石室晓起乃是土墓豁悟三界唯心生死涅槃不离一心遂中止远行返国著述
- id: guji-元晓-event-niepan
  title_zh: 撰涅槃宗要弘一味大道
  date: 0665-01-01
  year_of: 665
  place_zh: 新罗山寺
  description: 依大般涅槃经作宗要略述大意广开因缘教宗教体教迹四门以涅槃佛性二门统摄三十六义及四种大义显诸佛出世大意为示无二佛性
- id: guji-元晓-event-lay
  title_zh: 还俗化俗号小性居士
  date: 0670-01-01
  year_of: 670
  place_zh: 新罗庆州闾里
  description: 破戒还俗与瑶石公主结缘生薛聪执击瓢歌舞于市井以无碍歌劝人念阿弥陀佛令愚夫愚妇皆知净土
- id: guji-元晓-event-death
  title_zh: 示寂血岬遗化海东
  date: 0686-01-01
  year_of: 686
  place_zh: 新罗血岬
  description: 文武王六年示寂世寿七十所著起信疏金刚三昧疏十门和诤论等百余卷并行于世海东尊为和诤国师
