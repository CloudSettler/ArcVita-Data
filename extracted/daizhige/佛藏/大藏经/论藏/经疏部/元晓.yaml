endeavors:
- id: guji-元晓-endeavor-1
  title_zh: 注疏涅槃宗要立一味实性宗
  summary: 研穷大般涅槃经统摄长寿佛性三宝阐提等义以涅槃佛性二门开六门分别会通有无空不空之诤显无二秘藏
  phases:
  - key: brewing
    name: 少出家研习众典
    labels:
      zh: 出家研学
    start_date: 0649-01-01
    highlight_event_id: guji-元晓-event-ordination
  - key: breakthrough
    name: 唐行中悟心净土折返
    labels:
      zh: 求法顿悟
    start_date: 0661-01-01
    highlight_event_id: guji-元晓-event-return
  - key: climax
    name: 撰涅槃宗要统摄大意
    labels:
      zh: 撰疏立宗
    start_date: 0665-01-01
    highlight_event_id: guji-元晓-event-niepan
  - key: closure
    name: 以实性无二和会诸宗
    labels:
      zh: 和会流通
    start_date: 0670-01-01
    highlight_event_id: guji-元晓-event-niepan
  decisions:
  - date: 0661-01-01
    title_zh: 中止西行唐土求法
    rationale: 夜宿土龛悟心外无法生死涅槃皆由心现遂知求法在心不在远行而返新罗专务著述化土
  - date: 0665-01-01
    title_zh: 以涅槃佛性二门摄经宗
    rationale: 为止息六家异论显经题涅槃即是无二实性离相离性无障无碍故立名义体相通局二灭三事四德等分别而归一味
- id: guji-元晓-endeavor-2
  title_zh: 破戒入俗以歌舞弘化万民
  summary: 自号小性居士执瓢唱歌化导闾里不分贵贱贤愚普劝念佛归净土以无碍大悲行无住处涅槃开新罗通俗佛教之风
  phases:
  - key: brewing
    name: 感时俗拘文难化
    labels:
      zh: 观察时弊
    start_date: 0667-01-01
    highlight_event_id: guji-元晓-event-niepan
  - key: breakthrough
    name: 还俗入市携瓢讴吟
    labels:
      zh: 还俗化俗
    start_date: 0670-01-01
    highlight_event_id: guji-元晓-event-lay
  - key: climax
    name: 作无碍歌广劝念佛
    labels:
      zh: 普及信仰
    start_date: 0672-01-01
    highlight_event_id: guji-元晓-event-lay
  - key: closure
    name: 化迹遍于新罗海东宗仰
    labels:
      zh: 遗化海东
    start_date: 0686-01-01
    highlight_event_id: guji-元晓-event-death
  decisions:
  - date: 0670-01-01
    title_zh: 舍比丘形服为居士弘法
    rationale: 知深法难入鄙俚之耳欲使屠沽妇孺皆得解脱故以方便坏二边执著现同相不同相之用而行无住涅槃
  - date: 0672-01-01
    title_zh: 制通俗歌辞教人持名
    rationale: 性净涅槃凡圣一味一切众生本来入涅槃故不简凡圣皆可即俗而真但令一念会道便成往生之业
