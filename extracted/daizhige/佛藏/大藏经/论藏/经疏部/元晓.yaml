  date: 399
  year_of: 617
  place_zh: 新罗押梁郡
  summary_zh: 薛氏子生于新罗，幼颖悟，后出家名晓，号元晓
- id: guji-元晓-event-qiufa
  title_zh: 与义湘偕往唐土求法中辍
  date: 433
  year_of: 661
  place_zh: 唐境辽东一带
  summary_zh: 与义湘谋入唐求法，途中遇险夜宿古冢，悟心生则境生，心灭则境灭，遂折返新罗
- id: guji-元晓-event-zhushu
  title_zh: 述金刚三昧经论阐一味真实
  date: 438
  year_of: 666
  place_zh: 新罗
  summary_zh: 依金刚三昧经作论，略开四门，初述大意，次辨经宗，三释题名，四消文义，立六品观行归于如来藏一心
- id: guji-元晓-event-death
  title_zh: 示寂新罗
  date: 0686
  year_of: 686
  place_zh: 新罗
  summary_zh: 毕生著述弘化之后示寂，世谥和净国师，著述流布中土与海东
