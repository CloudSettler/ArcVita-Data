    title_zh: 梦悟返国不复入唐
    rationale: 悟心外无法，境由心现，与其远求，不如安住本土著述弘化
  - date: 438
    title_zh: 以一心一味为经宗
    rationale: 融真俗泯境智，破无所不破，立无所不立，摄大乘归于无量义宗
- id: guji-元晓-endeavor-2
  title_zh: 和诤判教普化新罗俗众
  summary_zh: 会通空有调和诸宗，倡一心和诤，晚年放达化俗，以歌舞弘法，令五浊众生皆入一乘
  phases:
  - key: brewing
