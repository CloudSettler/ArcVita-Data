  - date: 440
    title_zh: 著述和会不立一宗之私
    rationale: 以一心和会空有，令各宗各得其所，共归实相，避免偏执诤论
  - date: 0680
    title_zh: 深入闾巷以俗谣教化
    rationale: 为度末劫五浊众生，须以方便俯就群机，令可度众生皆说一味
