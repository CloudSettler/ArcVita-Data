endeavors:
- id: guji-元照-endeavor-1
  title_zh: 灵芝住持与律宗复兴
  summary: 出家受具，博究南山律藏，住持杭州灵芝崇福寺，著资持记等，大振律风，为宋世律宗中兴之主
  phases:
  - key: brewing
    name: 幼年出家初习律仪
    labels:
      zh: 出家学律
    start_date: 1060
    highlight_event_id: guji-元照-event-ordination
  - key: breakthrough
    name: 受具究学博通律教
    labels:
      zh: 通究律藏
    start_date: 1067
    highlight_event_id: guji-元照-event-ordination
  - key: climax
    name: 住持灵芝大弘戒法
    labels:
      zh: 住持弘律
    start_date: 1085
    highlight_event_id: guji-元照-event-lingzhi
  - key: closure
    name: 造资持记律风复振
    labels:
      zh: 著述传律
    start_date: 1090
    highlight_event_id: guji-元照-event-lingzhi
  decisions:
  - date: 1067
    title_zh: 发心精持南山律行
    rationale: 见末世律学陵迟，欲以身作则，严净毗尼以立出离之基
  - date: 1085
    title_zh: 定居灵芝崇福寺弘化
    rationale: 得西湖道场因缘，欲聚徒讲律著书，使律宗正法久住江南
- id: guji-元照-endeavor-2
  title_zh: 归心净土与阿弥陀经义疏撰述
  summary: 晚年归心安养，以教理行果四章判释阿弥陀经，专弘持名一法，会通律净，劝信往生
  phases:
  - key: brewing
    name: 厌秽忻净归向安养
    labels:
      zh: 归心净土
    start_date: 1095
    highlight_event_id: guji-元照-event-yishu
  - key: breakthrough
    name: 立教理行果四纲判经
    labels:
      zh: 判教立义
    start_date: 1100
    highlight_event_id: guji-元照-event-yishu
  - key: climax
    name: 撰成佛说阿弥陀经义疏
    labels:
      zh: 撰疏弘名
    start_date: 1105
    highlight_event_id: guji-元照-event-yishu
  - key: closure
    name: 临终念佛示寂灵芝
    labels:
      zh: 念佛示寂
    start_date: 1116
    highlight_event_id: guji-元照-event-death
  decisions:
  - date: 1100
    title_zh: 以持名为宗造经义疏
    rationale: 慨著述虽多鲜穷要旨，秦译流通最广，故取佛名号为纲，专示一日七日执持之法
  - date: 1105
    title_zh: 判净土为大乘圆顿
    rationale: 为破贬净业为权乘之疑，引六方佛护念与不退菩提为证，定持名为成佛径术
events:
- id: guji-元照-event-birth
  date: 1048
  year_of: 1048
  title_zh: 生于余杭唐氏
  description: 宋庆历八年生于余杭唐氏，俗姓唐，幼而颖悟，夙有出尘之志
  place_zh: 余杭
- id: guji-元照-event-ordination
  date: 1067
  year_of: 1067
  title_zh: 出家受具博究律学
  description: 依慧鉴律师出家受具足戒，遍参讲席，博究南山四分律钞，兼通天台教观
  place_zh: 杭州
- id: guji-元照-event-lingzhi
  date: 1085
  year_of: 1085
  title_zh: 住持灵芝崇福寺弘律
  description: 住持西湖灵芝崇福寺，开堂讲律，徒众云集，造行事钞资持记等，大兴律宗
  place_zh: 杭州灵芝崇福寺
- id: guji-元照-event-yishu
  date: 1105
  year_of: 1105
  title_zh: 撰佛说阿弥陀经义疏并序
  description: 以一乘极唱归于乐邦为序，先以教理行果四章括纲，再分序分正宗流通三分释经，详明依正庄严与持名往生之义
  place_zh: 杭州灵芝崇福寺
- id: guji-元照-event-death
  date: 1116
  year_of: 1116
  title_zh: 示寂于灵芝寺
  description: 宋政和六年念佛示寂于灵芝，世寿六十九，荼毗后塔于灵芝，谥号大智，学者称灵芝律师
  place_zh: 杭州灵芝崇福寺
