    description_zh: 不二理绝言而弘法须藉言教若但尚言则未诣无言若但尚默则无以引物须以三阶摄机显理教不二
  lesson: 考诚文而废穿凿因名相以悟无名相方能显常住圆极不堕断常
  summary_first_person: 吾吉藏生逢扰攘幼出家而习三论开皇之末因疾自著玄章仁寿之终奉命撰为文疏居长安弘法寺废五时四教之穿凿立一极圆宗以不二法门会通众圣誓令闻者厌生死无常欣法身常住同入不思议解脱
