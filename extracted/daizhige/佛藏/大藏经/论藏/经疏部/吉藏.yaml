  reign_ref: 隋文帝开皇至唐太宗贞观初
  archetype: 义解弘教法师
  dilemmas:
  - 以空为宗弘法华时如何不落偏空断见又不滞有所得执
  - 面对成实毗昙盛行与五时四宗拘文如何抉择通经之论以显圆旨
  lesson: 住慈悲忍辱毕竟空三轨以弘经依无所得以说法方能会三归一入中道实相
  summary_first_person: 吾姓安本金陵人少出家习三论后究法华以如来室衣座为弘经之本以安乐四行为化他之轨撰玄论以明会三归一破有所得之执欲令心同教不令教同心耳
  source_urls:
