endeavors:
- id: guji-吉藏-endeavor-1
  title_zh: 撰法华玄论立弘经轨范
  summary: 依大乘论通方等明三轨四行及十种不思议以定法华圆教宗致
  phases:
  - key: brewing
    name: 少习三论博览众疏
    labels:
      zh:
      - 三论习学
      - 博览众师
    start_date: 366
    highlight_event_id: guji-吉藏-event-study
  - key: breakthrough
    name: 判大小明空辨有所得失
    labels:
      zh:
      - 空观破执
      - 辨成实失
    start_date: 0590
    highlight_event_id: guji-吉藏-event-critique
  - key: climax
    name: 撰玄论定六重玄义
    labels:
      zh:
      - 法华玄论
      - 会三归一
    start_date: 391
    highlight_event_id: guji-吉藏-event-xuanlun
  - key: closure
    name: 示十妙以显圆满教旨
    labels:
      zh:
      - 十种不思议
      - 圆教究竟
    start_date: 392
    highlight_event_id: guji-吉藏-event-xuanlun
  decisions:
  - date: 0595
    title_zh: 依大乘论通经不依成实毗昙
    rationale: 成实但明三藏小乘实义非方等空旨以数弘经久必成邪见故取中百智度法华论以释经
  - date: 391
    title_zh: 立三轨四行为弘经方法
    rationale: 以如来室衣座摄慈忍空慧以安乐四行摄解行慈悲令末世钝根有所依止而不住有所得
- id: guji-吉藏-endeavor-2
  title_zh: 讲演法华会通古今异说
  summary: 评量竺护罗什新旧二本及光宅开善庄严之说广采众长删繁正阙以显无所得中道
  phases:
  - key: brewing
    name: 考新旧二本译传缘起
    labels:
      zh:
      - 译经缘起
      - 新旧两本
    start_date: 0598
    highlight_event_id: guji-吉藏-event-critique
  - key: breakthrough
    name: 评五时四宗拘文之失
    labels:
      zh:
      - 破五时执
      - 显究竟圆
    start_date: 389
    highlight_event_id: guji-吉藏-event-xuanlun
  - key: climax
    name: 开迹显本融权实始终
    labels:
      zh:
      - 开权显实
      - 开近显远
    start_date: 0608
    highlight_event_id: guji-吉藏-event-xuanlun
  - key: closure
    name: 付嘱弘通劝无得说法
    labels:
      zh:
      - 无得说法
      - 弘经劝信
    start_date: 397
    highlight_event_id: guji-吉藏-event-xuanlun
  decisions:
  - date: 389
    title_zh: 弃五时半满之判取究竟一乘
    rationale: 法华是群圣喉衿教圆理满若格以五时规矩则失无方圣化故废妄谈明圆旨
  - date: 0608
    title_zh: 广集异论择善而从删繁正阙
    rationale: 慧基以空为乘本道生解寿量明常者可用遍行六度教辨四车无文鉾楯者当弃唯使文显理彰
