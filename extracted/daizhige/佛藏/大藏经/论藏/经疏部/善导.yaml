  - key: breakthrough
    name: 释名辨宗定顿教菩萨藏收
    labels:
      zh: 立宗释名
    start_date: 0649-01-01
    highlight_event_id: guji-善导-event-commentary
  - key: climax
    name: 七门料简定散通别思惟正受
    labels:
      zh: 料简定散
    start_date: 0652-01-01
    highlight_event_id: guji-善导-event-commentary
  - key: closure
    name: 玄义分成品流通后代
    labels:
      zh: 成疏流通
    start_date: 0655-01-01
    highlight_event_id: guji-善导-event-commentary
  decisions:
  - date: 0649-01-01
    title_zh: 判观经以观佛念佛三昧为宗
    rationale: 维摩以不思议解脱为宗大品以空慧为宗例推观经正以观佛三昧为宗一心回愿往生为体方能摄定散十六观
  - date: 0652-01-01
    title_zh: 正思惟正受唯属定善不通散善
    rationale: 思惟正受乃三昧异名地观文已证韦提两请皆是定善散善无请唯佛自说若通散善则乖经文
- id: guji-善导-endeavor-2
  title_zh: 破圣人生判显凡夫得生
  goal_zh: 会通别时二乘不生之疑令善恶凡夫同沾九品乘愿往生
  phases:
  - key: brewing
    name: 举诸师九品圣位之说
    labels:
      zh: 举旧解
    start_date: 0652-01-01
    highlight_event_id: guji-善导-event-commentary
  - key: breakthrough
    name: 以道理返对破上中下三辈
    labels:
      zh: 破圣判
    start_date: 0653-01-01
    highlight_event_id: guji-善导-event-commentary
  - key: climax
    name: 引十证定为凡夫不为圣人
    labels:
      zh: 证凡夫
    start_date: 0654-01-01
    highlight_event_id: guji-善导-event-promote
  - key: closure
    name: 会别时会二乘劝专修弘化
    labels:
      zh: 会通弘化
    start_date: 0672-01-01
    highlight_event_id: guji-善导-event-promote
  decisions:
  - date: 0653-01-01
    title_zh: 判九品皆是佛灭后凡夫遇缘不同
    rationale: 上品遇大凡夫中品遇小凡夫下品遇恶凡夫临终遇善乘愿得生若判圣人则圣人不藉韦提致请乖经三种众生当得往生之文
  - date: 0654-01-01
    title_zh: 会通别时意愿行相扶方生
    rationale: 但发愿无行则愿虚不生十声称佛即十愿十行具足一日七日执持必蒙诸佛护念迎接不可执论废经自失误他
