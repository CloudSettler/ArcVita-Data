    start_date: 0670-01-01
    highlight_event_id: guji-圆测-event-2
  - key: climax
    name: 以三性释色空四句
    labels:
      zh: 会通空有
    start_date: 0680-01-01
    highlight_event_id: guji-圆测-event-2
  - key: closure
    name: 示六门遣法显不生灭相
    labels:
      zh: 显果利生
