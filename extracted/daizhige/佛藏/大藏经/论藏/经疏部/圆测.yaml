  decisions:
  - date: 0670-01-01
    title_zh: 以四门科判释心经
    rationale: 心经文约义丰无序流通，故立教起宗体题目判文以摄纲要
  - date: 0680-01-01
    title_zh: 并存清辨护法二释显中道
    rationale: 空不违有有不违空，故双述历法遣相与在识遮境二观以顺佛意
events:
- id: guji-圆测-event-birth
  title_zh: 生于新罗王族
  date: 0613-01-01
  year_of: 613
  description: 武德六年生于新罗，俗姓金氏，王族出身，幼而聪慧慕佛
- id: guji-圆测-event-1
  title_zh: 入唐从玄奘学法
  date: 0645-01-01
  year_of: 645
  description: 贞观年间入华至长安，亲承玄奘，研习瑜伽唯识深密等义，参与译场
- id: guji-圆测-event-2
  title_zh: 撰佛说般若波罗蜜多心经赞
  date: 0680-01-01
  year_of: 680
  description: 以四门分别作心经赞，辨教起无相为宗，释观自在行深般若，论五蕴十二处十八界缘生等空相
- id: guji-圆测-event-death
  title_zh: 示寂于周
  date: 0696-01-01
  year_of: 696
  description: 长安二年示寂，世寿八十四，一生著述弘化，唯识疏学与般若疏并传后世
