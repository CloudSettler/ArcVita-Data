    title_zh: 应诏入译场受笔参详
    rationale: 以旧译四家增减不同贝叶尚有阙漏，故须寻梵考较以成圆备译本。
  - date: '0703'
    title_zh: 立五门判释经义
    rationale: 为令机宜得益法久住世，故叙起因彰宗体明时利辨得名依文广释。
events:
- id: guji-慧沼-event-birth
  title_zh: 出生于唐初
  date: '0651'
  year_of: 651
  description: 约贞观末生，长而慕道出家于淄州故号淄州沼。
- id: guji-慧沼-event-study
  title_zh: 师从玄奘窥基学法相
  date: '0666'
  year_of: 666
  description: 亲近玄奘窥基，禀受唯识瑜伽深义，承慈恩正统。
- id: guji-慧沼-event-teach
  title_zh: 弘讲唯识著述护法
  date: 0690
  year_of: 690
  description: 弘讲唯识经论，著述决择三性三无性等义，折伏异说大弘法相。
- id: guji-慧沼-event-translate
  title_zh: 奉敕参义净译场
  date: '0702'
  year_of: 702
  description: 长安二年壬寅奉敕为翻经沙门，参义净译场受笔考较金光明最胜王经梵本。
- id: guji-慧沼-event-compose
  title_zh: 撰成金光明最胜王经疏十卷
  date: '0703'
  year_of: 703
  description: 长安三年癸卯十月撰毕，以五门分别叙起因宗体时利得名依文释义，文圆理具敕令抄写流通。
- id: guji-慧沼-event-death
  title_zh: 示寂于开元初
  date: '0714'
  year_of: 714
  description: 开元二年示寂，世寿六十余，一生弘法相疏金光明，法施无尽。
