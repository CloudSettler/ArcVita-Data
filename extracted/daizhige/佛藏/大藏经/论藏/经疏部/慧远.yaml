endeavors:
- id: guji-慧远-endeavor-1
  person_qid: guji-慧远
  title_zh: 净影弘化判教著述
  summary: 常住净影，讲地持摄论涅槃，立大小二藏局渐顿义，著大乘义章等，成隋代义学宗主
  phases:
  - key: brewing
    name: 少出家邺下问道
    labels:
      zh:
      - 问道
    start_date: '0536'
    highlight_event_id: guji-慧远-event-study
  - key: breakthrough
    name: 长安弘法声名渐著
    labels:
      zh:
      - 弘法
    start_date: '0570'
    highlight_event_id: guji-慧远-event-jingying
  - key: climax
    name: 隋初国师礼遇著述宏富
    labels:
      zh:
      - 著述
    start_date: 0581
    highlight_event_id: guji-慧远-event-writing
  - key: closure
    name: 义章垂后宗风确立
    labels:
      zh:
      - 传灯
    start_date: 0590
    highlight_event_id: guji-慧远-event-death
  decisions:
  - date: '0570'
    title_zh: 定居净影专宗大乘
    rationale: 邺下丧乱长安安稳，欲专弘菩萨藏，遂止净影寺讲授摄论地持以化时众
  - date: 0581
    title_zh: 立二藏渐顿判教
    rationale: 为令学者不滥大小浅深，故判声闻菩萨二藏，局渐顿三轮，使经论各有宗趣
- id: guji-慧远-endeavor-2
  person_qid: guji-慧远
  title_zh: 疏解观经开净土观门
  summary: 作观无量寿经义疏，先明五要次释序正流通，以观佛三昧为宗，应身别观接引凡夫
  phases:
  - key: brewing
    name: 厌秽欣净因缘观察
    labels:
      zh:
      - 发起
    start_date: '0575'
    highlight_event_id: guji-慧远-event-jingying
  - key: breakthrough
    name: 立五要通释经名
    labels:
      zh:
      - 立义
    start_date: 0585
    highlight_event_id: guji-慧远-event-shu
  - key: climax
    name: 详释王宫起化韦提请生
    labels:
      zh:
      - 释经
    start_date: 0586
    highlight_event_id: guji-慧远-event-shu
  - key: closure
    name: 流通付嘱劝生无忧处
    labels:
      zh:
      - 流通
    start_date: 0588
    highlight_event_id: guji-慧远-event-shu
  decisions:
  - date: 0585
    title_zh: 以观佛三昧为经宗
    rationale: 诸经宗趣各异，此经正明系念观佛生净土，故定宗为观佛三昧，摄定散二善
  - date: 0586
    title_zh: 判此经为顿教菩萨藏
    rationale: 韦提凡夫不由小入直说大乘净境，故判属顿教，以显凡夫直往无疑
