    labels:
      zh:
      - 突破
    start_date: '0670'
    highlight_event_id: guji-憬兴-event-outline
  - key: climax
    name: 判三经皆大乘渐教摄
    labels:
      zh:
      - 高潮
    start_date: '0676'
    highlight_event_id: guji-憬兴-event-shu
  - key: closure
    name: 与元晓基师义相参弘化后学
    labels:
      zh:
      - 收束
    start_date: 0690
    highlight_event_id: guji-憬兴-event-spread
  decisions:
  - date: '0670'
    title_zh: 合江南所诠为宗与唐能诠所诠分宗二说
    rationale: 教名体义名宗则宗体有别，文义同用则宗体无异，二门并举方免偏执
  - date: '0676'
    title_zh: 断言三经皆大乘渐教不属小乘
    rationale: 上生具首楞严三昧，下生成佛具常德与发菩提心，三会皆蒙度，故须会小入大以拯末代
events:
- id: guji-憬兴-event-birth
  date: '0632'
  year_of: 632
  title_zh: 诞生于新罗
  description: 约唐贞观六年生于新罗，幼慕佛法，出家研习经论
- id: guji-憬兴-event-study
  date: '0655-01-01'
  year_of: 655
  title_zh: 研习弥勒经论与东西两土义学
  description: 博览弥勒上生下生成佛三经及阿含般若瑜伽佛地论，参详江南旧师与唐奘门基师之说
- id: guji-憬兴-event-outline
  date: '0668-01-01'
  year_of: 668
  title_zh: 立五门料简总纲
  description: 首述教兴缘起十四种机宜，次广辨教宗体，次辨经本单重真伪，次释题目，后立随文解释体例
- id: guji-憬兴-event-shu
  date: '0675-01-01'
  year_of: 675
  title_zh: 撰成三弥勒经疏
  description: 详释佛说观弥勒菩萨上生兜率天经首题如是我闻一时佛在等文，辨弥勒慈义兜率知足义，释放光雨华授记召众
- id: guji-憬兴-event-spread
  date: '0685-01-01'
  year_of: 685
  title_zh: 弘阐兜率往生与弥勒下生信仰
  description: 倡上中下三品往生兜率见圣不退，兼弘下生龙华三会值佛得度，学众云集，新罗弥勒信仰大盛
- id: guji-憬兴-event-death
  date: '0700'
  year_of: 700
  title_zh: 示寂于新罗
  description: 约孝昭王时示寂，遗疏流行于新罗与唐，为后世弥勒学所宗
