  decisions:
  - date: 0668
    title_zh: 以教兴缘起宗体单重题目随文五门判经
    rationale: 机悟不同须总别分判，先明如来放光召众缘起，再辨宗体与单重真伪，方能统摄三经
  - date: '0675'
    title_zh: 主释上生经兼摄下生成佛二经
    rationale: 上天利乐与下人利乐本为一相续身，偏弘上生则摄机最胜，兼明下生则普被三品
- id: guji-憬兴-endeavor-2
  title_zh: 会通大小顿渐护持新罗佛法正统
  summary: 论三经皆大乘渐教，调和江南旧义与唐新义，会通法义二无碍境，确立新罗义学地位
  phases:
  - key: brewing
