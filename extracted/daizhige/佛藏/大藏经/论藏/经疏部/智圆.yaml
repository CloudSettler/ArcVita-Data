endeavors:
- id: guji-智圆-endeavor-1
  title_zh: 立愿以天台三观撰十经义疏
  summary: 誓用三观法门撰十疏以伸十经为法施之资，七疏成后卧疾续成其三以全本誓
  phases:
  - key: brewing
    name: 学天台立写法施愿
    labels:
      zh:
      - 立愿
    start_date: '1000'
    highlight_event_id: guji-智圆-event-vow
  - key: breakthrough
    name: 七疏笔削初成
    labels:
      zh:
      - 笔削
    start_date: '1015'
    highlight_event_id: guji-智圆-event-vow
  - key: climax
    name: 卧疾扶羸续三疏
    labels:
      zh:
      - 续成
    start_date: '1020'
    highlight_event_id: guji-智圆-event-illness
  - key: closure
    name: 十疏既毕付后昆
    labels:
      zh:
      - 圆愿
    start_date: '1021-11-02'
    highlight_event_id: guji-智圆-event-amituo-complete
  decisions:
  - date: '1020'
    title_zh: 卧疾续成三疏
    rationale: 虑石火不久过隙难留，有负畴昔之心，遂扶羸隐几续成无量义普贤观及弥陀经
  - date: '1021-11-02'
    title_zh: 以弥陀疏为往生先容
    rationale: 辞理无取庶填本誓，且为往生之先容，空华之躯谷响之言于我何有
- id: guji-智圆-endeavor-2
  title_zh: 撰佛说阿弥陀经义疏
  summary: 约龙树之宗准智者之说，释题以五重玄义，分序正宗流通以显信愿净业与舍苦得乐
  phases:
  - key: brewing
    name: 约宗准说辨理
    labels:
      zh:
      - 依经辨理
    start_date: '1021-10-01'
    highlight_event_id: guji-智圆-event-amituo-complete
  - key: breakthrough
    name: 五重玄义释题
    labels:
      zh:
      - 释名辨体
    start_date: '1021-10-15'
    highlight_event_id: guji-智圆-event-amituo-complete
  - key: climax
    name: 染毫绝笔成疏
    labels:
      zh:
      - 成疏
    start_date: '1021-11-02'
    highlight_event_id: guji-智圆-event-amituo-complete
  - key: closure
    name: 义疏西资并行
    labels:
      zh:
      - 流通
    start_date: '1021-11-02'
    highlight_event_id: guji-智圆-event-amituo-complete
  decisions:
  - date: '1021-11-02'
    title_zh: 以信愿净业为经宗
    rationale: 经云应当发愿生彼国土，闻说名号执持七日即得往生，故以信愿净业为宗要
  - date: '1021-11-02'
    title_zh: 判教为生苏方等大乘
    rationale: 对告声闻非初乳顿说，谈众生作佛非酪味小乘，不说皆空不开会二乘，当属第三生苏
  - date: '1021-11-02'
    title_zh: 明无问自说存通阙别
    rationale: 集众即知必请法，故如来无问自说，译者略发起而不叙，新译云为闻法故俱来会座
