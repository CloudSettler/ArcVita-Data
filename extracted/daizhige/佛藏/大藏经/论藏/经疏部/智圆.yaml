  dilemmas:
  - title_zh: 卧疾与本誓难全
    description: 七疏已成而卧疾经年，虑石火不久，扶羸续成三疏以填本誓
  - title_zh: 折摄与欣厌难齐
    description: 释迦现秽土以折伏，弥陀现净土以摄受，欲令群迷复明静之体
  lesson: 以三观解净土，会事理以成信愿，令弱丧童蒙皆得欣求极乐而不退转
  summary_first_person: 吾孤山沙门智圆，学天台之道，誓以三观法门撰十疏为法施，卧疾犹续成无量义普贤观及弥陀经疏，于天禧五年绝笔，愿以此为往生先容
