events:
- id: guji-李通玄-event-birth
  date: '0646'
  year_of: 646
  title_zh: 北京降生皇枝李氏
  description_zh: 性禀天聪智慧明简，留情易道妙尽精微，后放旷林泉有同舍国之志
- id: guji-李通玄-event-vow
  date: 0695
  year_of: 695
  title_zh: 则天朝倾心华严发愿述论
  description_zh: 年过四十绝览外书，寻古德义疏掩卷叹博，幸会新译义理圆备，遂考八十卷拟开义门
- id: guji-李通玄-event-dongfang
  date: 0719
  year_of: 719
  title_zh: 开元七年游东方山隐述
  description_zh: 自开元七年游东方山逝多林，隐沦述论，上下科节成华严新论四十卷
- id: guji-李通玄-event-newlun
  date: '0723'
  year_of: 723
  title_zh: 新论成更作决疑论
  description_zh: 犹虑时俗机浅，又释决疑论四卷又略释一卷，又十玄六相百门义海普贤行门华严观诗赋并传于世
- id: guji-李通玄-event-jueyi
  date: '0726'
  year_of: 726
  title_zh: 略释修行次第十门示众
  description_zh: 举佛自果劝修生信，定该三世入果现障，自行成佛普贤恒行，乃至妙峰入位举行，令学者免滞三乘化城
- id: guji-李通玄-event-death
  date: '0730-03-28'
  year_of: 730
  title_zh: 开元十八年三月二十八日寂
  description_zh: 夜半山林震惊群鸟乱鸣，白光从顶直上冲天，道俗哀嗟，照明于大历庚戌秋叙其始末
