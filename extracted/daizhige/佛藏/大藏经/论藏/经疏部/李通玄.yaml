  dilemmas:
  - title_zh: 博文难修与简轨直入
    description_zh: 经文浩博义疏多家，后学寻文不暇，岂更修行，当立简要轨辙以免枉功
  - title_zh: 厌苦自脱与住生死成智悲
    description_zh: 三乘求自免苦厌生死，二乘住空净土求乐，一乘则以生死海为智悲海，不出不没利物无疲
  lesson: 以佛果为信，以愿起行，智由观照而显，悲由愿兴而深，住生死而不染方契一乘
  summary_first_person: 我是北京李氏皇枝，讳通玄，年过四十绝览外书，倾心华严新译，考八十卷括其微旨，隐东方山述新论决疑，示佛果五位因果，令初机径入普光明智，不滞三乘化城
