  dilemmas:
  - title_zh: 权实废立之难
    description_zh: 昔日三乘方便已深入人心，今欲废权显实，开三显一，恐动执生疑，难以取信
  - title_zh: 因果粗妙之辨
    description_zh: 旧说明因偏短狭劣，果报短促不圆，今欲总括万善为因，倍数长寿为果，恐世人不解长远之旨
  lesson: 会三归一以显因之长广胜，开发近显远以明果之长广胜，因果双妙方是法华正宗
  summary_first_person: 吾乃梁光宅寺沙门法云，少游讲坛，遍历教海，长住光宅，屡讲法华，感天雨华，撰写义记，开三显一以明同归之因，开近显远以辨长寿之果，述而不作以传妙法
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E7%BB%8F%E7%96%8F%E9%83%A8/%E6%B3%95%E5%8D%8E%E7%BB%8F%E4%B9%89%E8%AE%B0.html
