    rationale: 先以瑞相动情，次以正说授道，后以流通善始令终，使远播未闻
events:
- id: guji-法云-event-birth
  date: '0467'
  year_of: 467
  title_zh: 降生
  description_zh: 宋大明十一年生，少预僧数，遍历禅丛，染指教海，游诸家讲坛，腾摹遗编
- id: guji-法云-event-preach
  date: '0504'
  year_of: 504
  title_zh: 光宅屡讲法华感雨华
  description_zh: 梁初师受中兴，独为雄匠，尝讲法华于光宅寺，屡感天雨华之征，四众围绕，盛化一方
- id: guji-法云-event-compose
  date: '0515'
  year_of: 515
  title_zh: 撰法华经义记
  description_zh: 以光宅寺沙门云法师撰义记，释妙法莲花经题，明因体长义广用胜，果体长义广用胜，判序正流通三段，开三显一，开近显远
- id: guji-法云-event-death
  date: 0529
  year_of: 529
  title_zh: 示寂
  description_zh: 梁中大通元年示寂，义记厄于当时，漫弗复存，幸存一方，后世赖以窥光宅之深
