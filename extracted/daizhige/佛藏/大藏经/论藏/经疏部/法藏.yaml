  archetype: 华严弘教高僧
  dilemmas:
  - 真空未尝不有幻有未始不空，如何令空有两亡而不堕断常
  - 显了般若主慧解秘密神咒主福业，如何双灭烦恼罪业以成二严
  lesson: 以略摄广以空会有一味圆通，真俗无阂方能曜昏衢济苦海
  summary_first_person: 吾生于长安，承智俨贤首之统，弘华严兼通般若，值郑万钧殷勤请疏，于长安二年清禅寺翻经之暇撮心经十四行之枢要，显色空相即真空不生灭之义，愿拯物导迷会归中道
  source_urls:
  - https://daizhige.org/般若波罗蜜多心经略疏.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/般若波罗蜜多心经略疏.md
