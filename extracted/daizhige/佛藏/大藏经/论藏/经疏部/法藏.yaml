    title_zh: 参与实叉难陀译场助译大华严
    rationale: 借新译正文立圆教宗趣，以理事无碍收摄权实令华严大义流行
  - date: 0708-01-01
    title_zh: 应诏讲华严以缘起相作显圆通
    rationale: 以幻色即空真空即色之旨破执显中道，令君臣生净信护持正法
- id: guji-法藏-endeavor-2
  title_zh: 般若心经略疏撰述与显密兼弘
  summary_zh: 应郑万钧请于清禅寺作心经略疏，以五门分别释题解文，分显了秘密二般若，明色空相即与无所得而得
  phases:
  - key: brewing
