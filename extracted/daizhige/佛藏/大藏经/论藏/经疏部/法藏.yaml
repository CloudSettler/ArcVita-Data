  decisions:
  - date: 0702-01-01
    title_zh: 以五门分别释心经无序正宗之例
    rationale: 心经撮枢要无序流通，当先明教兴藏摄宗趣题义，然后略标广释令顿渐兼得
  - date: 0702-03-01
    title_zh: 分显了秘密二般若兼释神咒
    rationale: 显说生慧解灭烦恼障，密咒生福灭罪业障，双灭二障方成菩提涅槃二果
