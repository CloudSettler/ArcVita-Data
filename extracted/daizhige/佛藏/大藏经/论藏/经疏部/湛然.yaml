    title_zh: 判五时八教斥偏小异解
    rationale: 当时华严禅宗唯识并盛迷一乘妙法故须明开会久远以显天台圆教迥出诸说
  - date: 0780
    title_zh: 居国清传法不徇名利
    rationale: 弘经为大悲益他非为名利壅己自行暗妙宗则如无目导人故守山弘观以全慧命
