  dilemmas:
  - 身危法丧之间当奉法全身还是徇法忘身
  - 玄记博深后进难窥当繁述还是略举
  - 先德已详大科不举与诸生未达小疑必疏如何权衡
  lesson: 因签以释思逸功倍，观象得意俾昏作明，善继其宗方能永代不朽
  summary_first_person: 吾荆溪湛然，孩提秀发，志学名成，渊解得于自心，博赡振于先达，从左溪而悟天台，居国清毗坛而弘一乘，昔于台岭随问签录，晚还毗坛添饰管见，述闻兼寻经论，愿后进因签得窥玄记之深，不忘于本以天台命家
