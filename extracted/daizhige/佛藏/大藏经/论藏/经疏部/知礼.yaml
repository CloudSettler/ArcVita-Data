  - title_zh: 情卜圣应与依法立观
    description: 不以情见卜度圣应，当依三谛圆观立无尽名义，令机感冥合
  - title_zh: 事相救难与观行破障
    description: 七难不止在事，须约报业烦恼三障及王三昧十番破障，贯通事理以明圆应
  lesson: 解释经文使合于义理，以圆观发誓熏应，方能遍拔三障之苦
  summary_first_person: 我是宋四明沙门知礼，入天台法华三昧之门，述观音义疏记以释普门品，明无尽意能生之行与观世音所成之德，示一心称名即时解脱之意，愿学者即事阴合性阴，修圆观以感圆应
  source_urls:
