endeavors:
- id: guji-知礼-endeavor-1
  title_zh: 重兴天台山家教观
  summary_zh: 师事宝云义通，禀智者圆教，住持四明延庆，讲授止观，辨正山家山外，令圆顿妙旨在嘉运复盛
  phases:
  - key: brewing
    name: 幼出家投师
    labels:
      zh:
      - 出家
      - 求法
    start_date: 0974
    highlight_event_id: guji-知礼-event-ordain
  - key: breakthrough
    name: 禀宝云习圆教
    labels:
      zh:
      - 学教
      - 天台
    start_date: 0980
    highlight_event_id: guji-知礼-event-study
  - key: climax
    name: 主延庆弘山家
    labels:
      zh:
      - 弘法
      - 辨义
    start_date: 1004
    highlight_event_id: guji-知礼-event-yanqing
  - key: closure
    name: 授徒化导四方
    labels:
      zh:
      - 授徒
      - 化导
    start_date: 1015
    highlight_event_id: guji-知礼-event-yanqing
  decisions:
  - date: 0980
    title_zh: 决意师事宝云专宗智者
    rationale: 以愍物适时须有圆宗可依，故舍杂学专禀天台一家教观
  - date: 1004
    title_zh: 决意住延庆立众讲授
    rationale: 以教法陵夷慕学之徒欲得旨修证，故以讲席摄众使圆乘盛演
- id: guji-知礼-endeavor-2
  title_zh: 疏释观经弘妙宗净土观
  summary_zh: 悯下凡普沾缘种又欲令行者得旨修证，以一心三观释能观，以一体三身释所观，成妙宗钞数千言，示即心念佛感四净土之道
  phases:
  - key: brewing
    name: 悕净报说听观经
    labels:
      zh:
      - 发心
      - 研经
    start_date: 1010
    highlight_event_id: guji-知礼-event-yanqing
  - key: breakthrough
    name: 以心观会通十六观
    labels:
      zh:
      - 会通
      - 立宗
    start_date: 1020
    highlight_event_id: guji-知礼-event-miaozong
  - key: climax
    name: 天禧重阳下笔成钞
    labels:
      zh:
      - 著述
      - 妙宗
    start_date: 1021-10-09
    highlight_event_id: guji-知礼-event-miaozong
  - key: closure
    name: 劝即心念佛流通
    labels:
      zh:
      - 劝修
      - 流通
    start_date: 1022
    highlight_event_id: guji-知礼-event-miaozong
  decisions:
  - date: 1020
    title_zh: 决以心观为宗实相为体
    rationale: 以小乘昧唯心佛从外有，今托安养依正熏乎心性，全心是佛，全佛是心，方显圆妙
  - date: 1021-10-09
    title_zh: 决钞疏专明圆顿观门不止事相
    rationale: 以旧记多谈事相少示观门，今盛演圆乘，故竭鄙思上顺妙宗令初心可修速证无生
events:
- id: guji-知礼-event-birth
  date: 0960
  year_of: 960
  title_zh: 生于四明
  description_zh: 宋初建隆元年生于明州鄞县李氏，七岁丧母，早怀出尘之志
- id: guji-知礼-event-ordain
  date: 0974
  year_of: 974
  title_zh: 出家太平兴国寺
  description_zh: 年十五投四明太平兴国寺出家，勤习律教，志求圆宗
- id: guji-知礼-event-study
  date: 0980
  year_of: 980
  title_zh: 师事宝云义通习天台
  description_zh: 往宝云山师事义通，禀智者止观教观，深悟一心三观三谛一境之旨
- id: guji-知礼-event-yanqing
  date: 1004
  year_of: 1004
  title_zh: 主四明延庆弘山家教
  description_zh: 领延庆寺讲席，大弘止观，辨正山家山外之诤，四方学徒云集，复兴圆顿教观
- id: guji-知礼-event-miaozong
  date: 1021-10-09
  year_of: 1021
  title_zh: 重阳下笔作妙宗钞
  description_zh: 天禧五年岁在辛酉重阳日下笔，作观无量寿佛经疏妙宗钞，释十六观皆是一心三观，所观皆是三谛一境，劝即心念佛感四净土见三身弥陀
- id: guji-知礼-event-death
  date: 1028
  year_of: 1028
  title_zh: 示寂于延庆
  description_zh: 天圣六年正月示寂于四明延庆寺，世寿六十九，僧腊五十四，后世尊为四明尊者
