    title_zh: 守延庆祖庭不赴他请
    rationale: 以四明为天台弘传根本，当聚众熏修观行，以报本师付托
  - date: 1000
    title_zh: 以著述显正义斥偏解
    rationale: 见旧解局于果报地上清凉等偏会，故广引大论大经立圆普机应以正视听
