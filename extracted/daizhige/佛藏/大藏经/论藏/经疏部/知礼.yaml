  dilemmas:
  - 适时谈事相普沾下凡与直示圆顿妙观求解脱修证之间如何权衡
  - 舍秽取净欣厌往生与心性即具即心念佛不取不舍之间如何圆会
  - 山家正义孤微与山外异说盛行之间如何抉择守护
  lesson: 即心观佛最為徑要，外托依正，内显心性，正助双行，方得不退
  summary_first_person: 吾四明知礼，禀宝云义通之教，宗智者圆顿之旨，重兴天台于延庆，竭鄙思钞妙宗数千言，上顺妙宗，略消观疏，愿共有情即心念佛，同感四种净土，得见弥陀
