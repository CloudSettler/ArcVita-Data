    title_zh: 舍俗出家从奘受学
    rationale: 念生死恶趣众苦逼迫，愿求菩提作有情依，亲近善友修集善根。
  - date: '0660'
    title_zh: 会释诸师专弘一音
    rationale: 为除空有偏执，依唯识五重观会通三性，令后学渐悟顿入。
- id: guji-窥基-endeavor-2
  title_zh: 撰心经幽赞明中道
  summary: 甄综大般若精微，纂提纲迹作幽赞，破二执显二空叹二依得二利。
