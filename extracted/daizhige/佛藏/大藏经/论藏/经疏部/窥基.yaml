    title_zh: 依三性说申说两端
    rationale: 对机遣病假说有空，欲令真俗无乖信学皆获利乐，故略赞中道。
  - date: 0668
    title_zh: 以心目经摄万行归慧
    rationale: 大经随机义文俱广，传法当录坚实妙最，统色为空贯无智兼得。
events:
- id: guji-窥基-event-birth
  title_zh: 生于长安尉迟氏家
  date: '0632'
  year_of: 632
  description: 唐贞观六年生于长安，父为左金吾卫将军尉迟宗。
- id: guji-窥基-event-1
  title_zh: 奉诏出家师事玄奘
  date: 0648
  year_of: 648
  description: 年十七奉太宗诏出家为玄奘弟子，住大慈恩寺听受瑜伽唯识。
- id: guji-窥基-event-2
  title_zh: 助译弘法撰成唯识论述记
  date: '0660'
  year_of: 660
  description: 助玄奘译经，会通诸说撰成唯识论述记，大弘法相于慈恩。
- id: guji-窥基-event-3
  title_zh: 撰般若波罗蜜多心经幽赞
  date: 0668
  year_of: 668
  description: 探广文秘旨标贞心为称，作幽赞上下卷明空有中道接引初机。
- id: guji-窥基-event-death
  title_zh: 圆寂于慈恩寺
  date: 0682
  year_of: 682
  description: 永淳元年圆寂，世称慈恩大师，为法相宗初祖。
