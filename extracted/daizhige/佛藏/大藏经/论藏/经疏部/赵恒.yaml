endeavors:
- id: guji-赵恒-endeavor-1
  title_zh: 咸平景德守成理政与澶渊息兵
  summary_zh: 即位后任用李沆王旦寇准等，宽赋省刑，与辽对峙后亲征澶州，缔结澶渊之盟，换得百年边境大体安定，开创咸平景德之治。
  phases:
  - key: brewing
    name: 初政守成
    labels:
      zh: 酝酿守成
    start_date: 0997-05-08
    highlight_event_id: guji-赵恒-event-enthronement
  - key: breakthrough
    name: 亲征澶州
    labels:
      zh: 御驾亲征
    start_date: 1004-11-01
    highlight_event_id: guji-赵恒-event-chanyuan
  - key: climax
    name: 缔盟息兵
    labels:
      zh: 澶渊定盟
    start_date: 1005-01-23
    highlight_event_id: guji-赵恒-event-chanyuan
  - key: closure
    name: 景德养民
    labels:
      zh: 与民休息
    start_date: 1005-02-01
    highlight_event_id: guji-赵恒-event-chanyuan
  decisions:
  - date: 0997-05-08
    title_zh: 即位沿用太宗旧辅推行咸平德政
    rationale: 初嗣大统人心未附，须以老成持重安朝野，以宽仁养国力
  - date: 1004-11-01
    title_zh: 力排众议亲征澶州鼓舞士气
    rationale: 辽军深入，若示弱则社稷危，亲往可坚军心求转圜议和之机
  - date: 1005-01-23
    title_zh: 接受岁币之议缔结澶渊之盟
    rationale: 久战耗财伤民，以岁绢银换边境安宁，利在长远休养
- id: guji-赵恒-endeavor-2
  title_zh: 弘崇三宝注解四十二章经
  summary_zh: 万机之暇潜心佛典，览四十二章经旧注，亲作注疏，分章训解十善四谛二十难等要旨，刊板颁行朝野，以佛法辅王化。
  phases:
  - key: brewing
    name: 览阅旧注
    labels:
      zh: 潜览佛典
    start_date: 1008-01-01
    highlight_event_id: guji-赵恒-event-zhujing
  - key: breakthrough
    name: 发心注释
    labels:
      zh: 亲注经义
    start_date: 1010-01-01
    highlight_event_id: guji-赵恒-event-zhujing
  - key: climax
    name: 注成颁行
    labels:
      zh: 刊板颁布
    start_date: 1012-06-01
    highlight_event_id: guji-赵恒-event-zhujing
  - key: closure
    name: 缁素奉行
    labels:
      zh: 流布天下
    start_date: 1013-01-01
    highlight_event_id: guji-赵恒-event-zhujing
  decisions:
  - date: 1010-01-01
    title_zh: 以余闲注释四十二章经辨疑误
    rationale: 此经为初传华夏之本，旧注多传写讹误，须辨明句读演畅其义以利群氓
  - date: 1012-06-01
    title_zh: 命有司新刊经注遍颁朝野
    rationale: 欲使缁素若见若闻顶戴奉行，借佛之训戒辅世教续慧命
events:
- id: guji-赵恒-event-birth
  title_zh: 生于开封太平兴国三年
  date: 0968-12-23
  year_of: 968
  place_zh: 东京开封府
  description_zh: 太宗第三子，母元德皇后李氏，生而颖悟，封韩王襄王，淳化五年立为皇太子。
- id: guji-赵恒-event-enthronement
  title_zh: 至道三年即皇帝位改元咸平
  date: 0997-05-08
  year_of: 997
  place_zh: 东京大庆殿
  description_zh: 太宗崩，皇太子赵恒即位，是为真宗，任李沆吕端等为相，推行咸平之治。
- id: guji-赵恒-event-chanyuan
  title_zh: 亲征澶州缔结澶渊之盟
  date: 1005-01-23
  year_of: 1005
  place_zh: 澶州北城
  description_zh: 御驾至澶州督战，辽师气沮，遣曹利用议和，约定岁给银绢，宋辽约为兄弟，边境罢兵。
- id: guji-赵恒-event-zhujing
  title_zh: 注四十二章经告成颁行天下
  date: 1012-06-01
  year_of: 1012
  place_zh: 东京昭文馆
  description_zh: 真宗览腾兰所译四十二章经，潜加注疏，辨十善四谛二十难等义，命新刊板本遍颁朝野，溥光奉敕作序。
- id: guji-赵恒-event-death
  title_zh: 崩于汴京延庆殿
  date: 1022-03-23
  year_of: 1022
  place_zh: 东京延庆殿
  description_zh: 在位二十五年崩，年五十五，遗诏皇太子赵祯即位，谥文明武定章圣元孝皇帝，庙号真宗，葬永定陵。
