    title_zh: 以三法总摄无量想
    rationale: 佛经依无量想而命短难遍览故立德恶依觉善胜三门以假想显真想令易持解脱
  - date: 0391-06-01
    title_zh: 先说德恶依觉后显善胜
    rationale: 众生已乐向乐不待语道故先示福根忍辱多闻等因如灯即坏暗智生即具善胜
