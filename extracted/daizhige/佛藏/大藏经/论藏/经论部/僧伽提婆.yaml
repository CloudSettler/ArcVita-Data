  dilemmas:
  - title_zh: 繁广经义与末世短命之衡
    description: 众生为恶世所坏命以食存当以三法略摄无量想开真想假想以善持众生
  - title_zh: 受生善胜与出要善胜之序
    description: 世人乐向乐而背乐因故先说德恶依觉后显善胜以灯坏暗喻明智生即具善胜
  lesson: 以三法摄尽万行福根无恶为本戒定慧为方便当舍增饰而取损薄正御诸根以趣涅槃
  summary_first_person: 我是罽宾瞿昙僧伽提婆西来东晋于洛阳长安建康庐山间译出三法度等毗昙论典以德恶依觉开善胜之门愿众生离一切苦趣彼安稳
  source_urls:
