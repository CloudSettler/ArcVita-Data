endeavors:
- id: guji-天亲菩萨-endeavor-1
  title_zh: 造金刚般若论明住修行降伏
  summary: 依金刚经分别住修行降伏三义以四心释住以檀摄六释修行以离相断疑释降伏
  phases:
  - key: brewing
    name: 立四深心释菩萨住
    labels:
      zh:
      - 广大第一常不颠倒
    start_date: '0370-01-01'
    highlight_event_id: guji-天亲菩萨-event-zhu
  - key: breakthrough
    name: 以三檀摄六明修行住
    labels:
      zh:
      - 檀义摄六
    start_date: '0380-01-01'
    highlight_event_id: guji-天亲菩萨-event-xing
  - key: climax
    name: 离相断疑显降伏心
    labels:
      zh:
      - 降伏取相疑
    start_date: '0385-01-01'
    highlight_event_id: guji-天亲菩萨-event-fu
  decisions:
  - date: '0370-01-01'
    title_zh: 以四心摄大乘住
    rationale: 为令根熟未熟菩萨皆得住持故立广第一常不颠倒
  - date: '0380-01-01'
    title_zh: 唯说檀度摄余五度
    rationale: 檀有资生无畏法三义可总摄六度故举一摄六
- id: guji-天亲菩萨-endeavor-2
  title_zh: 破相显实明三身福胜令末世生信
  summary: 明化佛非真佛破相见显受持说四句偈福胜七宝显佛法从此经出
  phases:
  - key: brewing
    name: 明末世不空说具戒慧信
    labels:
      zh:
      - 断恶世疑
    start_date: '0390-01-01'
    highlight_event_id: guji-天亲菩萨-event-xin
  - key: climax
    name: 明应化非真破相见
    labels:
      zh:
      - 三身分别
    start_date: '0392-01-01'
    highlight_event_id: guji-天亲菩萨-event-xiang
  - key: closure
    name: 校量福德显受持为胜
    labels:
      zh:
      - 福德趣菩提
    start_date: '0394-01-01'
    highlight_event_id: guji-天亲菩萨-event-fu-sheng
  decisions:
  - date: '0390-01-01'
    title_zh: 说八相离相显智慧
    rationale: 为断寿者法等八种取相故分别八义令离相生信
  - date: '0392-01-01'
    title_zh: 立法报化三身判佛说法
    rationale: 为遮化佛不证不说之谤故说应化非真而真如可说可证
events:
- id: guji-天亲菩萨-event-birth
  date: '0316-01-01'
  year_of: 316
  title_zh: 诞生
  description: 约晋末生于北印度迦湿弥罗婆罗门家
- id: guji-天亲菩萨-event-zhu
  date: '0370-01-01'
  year_of: 370
  title_zh: 释菩萨大乘住
  description: 依经中灭度一切众生文立广第一常不颠倒四心为住处
- id: guji-天亲菩萨-event-xing
  date: '0380-01-01'
  year_of: 380
  title_zh: 释不住相行布施
  description: 以资生无畏法三檀摄六度明菩萨修行住及虚空喻显福不可量
- id: guji-天亲菩萨-event-fu
  date: '0385-01-01'
  year_of: 385
  title_zh: 释降伏取相疑心
  description: 明凡所有相皆妄语离三相异体即见如来为菩提行施断疑
- id: guji-天亲菩萨-event-xin
  date: '0390-01-01'
  year_of: 390
  title_zh: 释末世生信不断
  description: 明末世持戒修福慧菩萨闻此经生净信离八相如筏喻舍法
- id: guji-天亲菩萨-event-xiang
  date: '0392-01-01'
  year_of: 392
  title_zh: 明应化非真佛
  description: 明释迦为化佛无定法可得可说而真如非法非非法圣以无为得名
- id: guji-天亲菩萨-event-fu-sheng
  date: '0394-01-01'
  year_of: 394
  title_zh: 校量受持福胜
  description: 明满三千七宝施不及受持四句偈为他说以佛法从此经出
- id: guji-天亲菩萨-event-death
  date: '0396-01-01'
  year_of: 396
  title_zh: 入灭
  description: 约晋末入灭其论后由菩提流支于元魏译传中土
