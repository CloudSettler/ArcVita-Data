endeavors:
- id: guji-菩提流支-endeavor-1
  title_zh: 译释金刚仙论明八部般若
  summary: 于洛阳译出金刚仙论，释世亲义，明八部般若纲要与金刚坚实之义，立句义次第令学者可入
  phases:
  - key: brewing
    name: 来华精通梵汉
    labels:
      zh: 译场准备
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrive
  - key: breakthrough
    name: 承诏译金刚仙论
    labels:
      zh: 发难释经
    start_date: '0511'
    highlight_event_id: guji-菩提流支-event-translate
  - key: climax
    name: 阐明十障对治
    labels:
      zh: 立义显宗
    start_date: '0512'
    highlight_event_id: guji-菩提流支-event-preach
  - key: closure
    name: 论成流通奉持
    labels:
      zh: 流通结集
    start_date: '0515'
    highlight_event_id: guji-菩提流支-event-preach
  decisions:
  - date: '0511'
    title_zh: 以汉文存修多罗本义译金刚仙论
    rationale: 经文句略义富，若不译释则世间愚人不能解，故存理为本教为本之意而译
  - date: '0512'
    title_zh: 立十种义释对治十障
    rationale: 众生于有无空实等起断常见谤，故须以八部般若次第遣相，究竟一切智
- id: guji-菩提流支-endeavor-2
  title_zh: 洛阳译场弘化利物
  summary: 久住洛阳译场，广译大乘经论，摄受众生，令得人天乃至佛果之乐
  phases:
  - key: brewing
    name: 入洛应请住持译事
    labels:
      zh: 安住译场
    start_date: 0508
    highlight_event_id: guji-菩提流支-event-arrive
  - key: breakthrough
    name: 广译经论训导学人
    labels:
      zh: 开译弘宣
    start_date: '0510'
    highlight_event_id: guji-菩提流支-event-translate
  - key: climax
    name: 以般若津梁行人诣佛果
    labels:
      zh: 化导摄受
    start_date: '0520'
    highlight_event_id: guji-菩提流支-event-preach
  - key: closure
    name: 示寂洛阳遗法后世
    labels:
      zh: 圆寂流通
    start_date: '0527'
    highlight_event_id: guji-菩提流支-event-death
  decisions:
  - date: '0510'
    title_zh: 以译经为荷佛难胜事流通像法
    rationale: 凡夫二乘不能解入深理，菩萨当受持洪化继轨先圣，故不为名利而为摄受众生
  - date: '0520'
    title_zh: 依舍卫给园本事重器世间令生敬信
    rationale: 明说经处所与同闻大众证经理不虚，使未来众生礼拜供养生功德
events:
