- id: guji-菩提流支-event-arrive
  title_zh: 抵洛阳入译场
  date: 0508
  year_of: 508
  summary: 至洛阳，精通梵汉，承魏室诏请入译场主持翻译
- id: guji-菩提流支-event-translate
  title_zh: 译出金刚仙论
  date: '0511'
  year_of: 511
  summary: 译世亲菩萨造金刚仙论师释之金刚仙论，明法门句义次第及金刚般若名义
- id: guji-菩提流支-event-preach
  title_zh: 宣说八部般若十障对治
  date: '0520'
  year_of: 520
  summary: 依所译论宣说八部般若总括大宗，十种义对治十障，显果头无为法身能破烦恼
- id: guji-菩提流支-event-death
  title_zh: 圆寂于洛阳
  date: '0527'
  year_of: 527
  summary: 译经弘化多年后圆寂于洛阳，所译金刚仙论等流通后世
