      date: 0480
      precision: year
      is_circa: true
      raw: 北天竺人，生年失载，约当魏宣武前后
    death:
      date: '0527'
      precision: year
      is_circa: false
      raw: 北魏孝明帝时圆寂于洛阳
  birth_date: 0480
  death_date: '0527'
  era: 北魏
  reign_ref: 宣武帝至孝明帝
  archetype: 译经论师
  dilemmas:
  - 梵本义富而文略，世人不解句义次第，当如何以汉文显深远妙义
  - 般若遣相最尽，学者易堕断常空有二边，当如何立十障对治令归中道
  lesson: 以翻译训释显理教之本，令深法可解可持，津梁行人远诣佛果
  summary_first_person: 吾自北天竺来入洛阳，承诏译经，译世亲所造金刚般若义释，明八部纲要与十障对治，显金刚坚实之体，愿令众生解句义次第，得常住佛果
