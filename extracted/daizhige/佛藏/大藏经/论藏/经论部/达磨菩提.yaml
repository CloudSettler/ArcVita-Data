  name_zh: 达磨菩提
  names:
    zh: 达磨菩提
    en: Dharmabodhi
  lifespan:
    birth:
      date: '0500-01-01'
      precision: year
      is_circa: true
      raw: 天竺人，生年不详，约当北魏前期
    death:
      date: '0540-01-01'
      precision: year
      is_circa: true
      raw: 卒年不详，约当北魏末年
  birth_date: '0500-01-01'
  death_date: '0540-01-01'
  era: 北魏
  reign_ref: 北魏孝明帝时
  archetype: 译经师
  dilemmas:
  - 梵本玄微汉土初闻，如何以汉语文辞传达佛性微密而不失本义
  - 旧习大小三乘差别，如何开显涅槃平等一相而不坏众生根性
  lesson: 以平等大悲为译，以不坏假名显实，令未发心者亦得见常住
  summary_first_person: 吾自天竺来入元魏，顶礼净觉海住持甘露门，传婆薮槃豆所造涅槃论一卷，分五分以判大经，显众生即佛，佛性难见而可依，常乐我净非颠倒，愿长迷苍生同归实谛道
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E7%BB%8F%E8%AE%BA%E9%83%A8/%E6%B6%85%E6%A7%83%E8%AE%BA.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E7%BB%8F%E8%AE%BA%E9%83%A8/%E6%B6%85%E6%A7%83%E8%AE%BA.html
endeavors:
- id: guji-达磨菩提-endeavor-1
  title_zh: 译出婆薮槃豆所造涅槃论一卷
  description: 自天竺携梵本入魏，口授笔受，译涅槃论一卷，以五分科判摄大般涅槃经，释微密佛性与满字半字之义
  phases:
  - key: brewing
    name: 西来入华酝酿译缘
    labels:
      zh: 酝酿
    start_date: '0515-01-01'
    highlight_event_id: guji-达磨菩提-event-arrive
  - key: breakthrough
    name: 对译梵汉突破文义
    labels:
      zh: 突破
    start_date: '0520-01-01'
    highlight_event_id: guji-达磨菩提-event-translate
  - key: climax
    name: 分科显相高潮阐微密
    labels:
      zh: 高潮
    start_date: '0522-01-01'
    highlight_event_id: guji-达磨菩提-event-translate
  - key: closure
    name: 一卷成书收束流通
    labels:
      zh: 收束
    start_date: '0525-01-01'
    highlight_event_id: guji-达磨菩提-event-complete
  decisions:
  - date: '0520-01-01'
    title_zh: 立五分科判摄全经
    rationale: 以不思议神通反示分至显相分统摄经义，令初学有轨则可依，不迷多头而见一相
  - date: '0522-01-01'
    title_zh: 以满字半字显顿渐不二
    rationale: 半字摄渐教，满字摄满足顿教，就理无满不满，就行有满不满，故涅槃亦顿亦渐，不乖法相
- id: guji-达磨菩提-endeavor-2
  title_zh: 于中土弘宣佛性常住之旨
  description: 借译论开演常乐我净，四颠倒，正善具成就，不坏众，生盲作眼目导，处浊不污，疗众病为船师
  phases:
  - key: brewing
    name: 观察根性酝酿开演
    labels:
      zh: 酝酿
    start_date: '0522-01-01'
    highlight_event_id: guji-达磨菩提-event-preach
  - key: breakthrough
    name: 明众生是佛突破执着
    labels:
      zh: 突破
    start_date: '0523-01-01'
    highlight_event_id: guji-达磨菩提-event-preach
  - key: climax
    name: 显常乐我净高潮破倒
    labels:
      zh: 高潮
    start_date: '0524-01-01'
    highlight_event_id: guji-达磨菩提-event-preach
  - key: closure
    name: 不坏众生收束归如
    labels:
      zh: 收束
    start_date: '0526-01-01'
    highlight_event_id: guji-达磨菩提-event-complete
  decisions:
  - date: '0523-01-01'
    title_zh: 直说众生非有非无即是佛
    rationale: 身外有佛亦不密，身内有佛亦非密，众生非有非无故是佛，以此遣声闻狭小令见难见性
  - date: '0524-01-01'
    title_zh: 以阎浮檀金喻和会三乘
    rationale: 青喻外道，黄喻声闻缘觉，赤喻六度菩萨，紫磨喻如来，一切具足不可说过，故不坏众而作眼目导
events:
- id: guji-达磨菩提-event-birth
  date: '0500-01-01'
  year_of: 500
  title_zh: 生于天竺
  description: 生于天竺，幼习三藏，通达大乘瑜伽及涅槃宗义，发愿东行传法
- id: guji-达磨菩提-event-arrive
  date: '0515-01-01'
  year_of: 515
  title_zh: 入元魏都洛阳
  description: 携婆薮槃豆造涅槃论梵本入北魏，得众僧迎请，酝酿翻译，顶礼净觉海发甘露门愿
  endeavor_ref: guji-达磨菩提-endeavor-1
- id: guji-达磨菩提-event-translate
  date: '0522-01-01'
  year_of: 522
  title_zh: 译涅槃论释迦叶所问
  description: 译出迦叶问答，释长寿金刚不坏身，坚固力，微密广大，四依调御，四颠倒，满字半字，共圣行如娑罗娑鸟，日月太白岁星之喻
  endeavor_ref: guji-达磨菩提-endeavor-1
- id: guji-达磨菩提-event-preach
  date: '0524-01-01'
  year_of: 524
  title_zh: 开演佛性常住不坏众
  description: 宣说未发心而名为菩萨，于大众得无所畏，处浊世不污如莲华，医疗众病，生死大海作船师，舍生死如蛇脱皮，观三宝如天意树，为生盲作眼目导
  endeavor_ref: guji-达磨菩提-endeavor-2
- id: guji-达磨菩提-event-complete
  date: '0525-01-01'
  year_of: 525
  title_zh: 涅槃论一卷流通
  description: 译论一卷竟，具载从初如是至流血洒地等分科，示多头唯愿大仙说之义付嘱流通，学众受持
  endeavor_ref: guji-达磨菩提-endeavor-1
- id: guji-达磨菩提-event-death
  date: '0540-01-01'
  year_of: 540
  title_zh: 示寂于魏土
  description: 译弘既毕，安然示寂，门人护持译本，后世列入大藏经论部流传
