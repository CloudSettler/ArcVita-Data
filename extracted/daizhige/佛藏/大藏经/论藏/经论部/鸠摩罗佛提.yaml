  archetype: 译经高僧
  dilemmas:
  - 梵本精微而秦言易失，直译存质与顺俗达义如何两全
  - 三藏一年并出，译场役繁而时日迫促，持律精严何以不坠
  lesson: 直令转梵为秦，解方言而已，不易经之文质，方能存三藏之真
  summary_first_person: 吾自西域来，执梵于邺寺，与佛念佛护共译，僧导昙究僧睿笔受，壬午秋冬译出四阿鋡暮抄解，夏出阿毗昙，一年具三藏，惟愿经之璎鬘不坠于地
