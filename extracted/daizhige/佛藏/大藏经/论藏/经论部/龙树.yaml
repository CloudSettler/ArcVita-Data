  decisions:
  - date: 0190
    title_zh: 不为名利而造论
    rationale: 为慈悲饶益众生不舍一切，随所好以章句偈颂譬喻开悟，以此为无比供养佛
  - date: '0200'
    title_zh: 立坚心为菩萨第一功德
    rationale: 软心怖畏生死退求二乘，唯坚心能荷负众生久住生死成就十力，故标举八法集一切功德
- id: guji-龙树-endeavor-2
  title_zh: 明三乘同脱而佛德殊胜劝发大心
  summary: 分别声闻辟支佛佛烦恼解脱无差别，而佛具甚深禅定障解脱不可喻，破怯弱速脱见不断三宝种
  phases:
  - key: brewing
    name: 辨三乘解脱
    labels:
      zh:
      - 酝酿
    start_date: 0185
    highlight_event_id: guji-龙树-event-vow
  - key: breakthrough
    name: 明佛十力必定聚
    labels:
      zh:
      - 突破
    start_date: 0195
    highlight_event_id: guji-龙树-event-compose
  - key: climax
    name: 劝发自度度他大愿
    labels:
      zh:
      - 高潮
    start_date: '0200'
    highlight_event_id: guji-龙树-event-first-ground
  - key: closure
    name: 令生如来家转世间道
    labels:
      zh:
      - 收束
    start_date: '0210'
    highlight_event_id: guji-龙树-event-complete
  decisions:
  - date: 0195
    title_zh: 先自度已当度众生
    rationale: 自没淤泥不能济溺，先自善寂具足善根资用深心悲心，然后能转世间道入出世上道
  - date: '0205'
    title_zh: 呵怯弱小乘不断三宝
    rationale: 若皆效小心不修十地则无诸佛，无佛则无法僧断三宝种，故须发愿为得十力入必定聚
events:
- id: guji-龙树-event-birth
  title_zh: 南印度出生
  date: '0150'
  year_of: 150
  description: 约汉桓帝时生于南印度，厚种善根多闻智慧，为后弘大乘奠基
- id: guji-龙树-event-vow
  title_zh: 发无上道心立慈悲誓
  date: 0180
  year_of: 180
  description: 见六道生死大海苦无救护，发愿我得自度已当复度众生，为得十力入于必定聚
- id: guji-龙树-event-compose
  title_zh: 造十住毗婆沙论释十地
  date: 0190
  year_of: 190
  description: 敬礼一切佛及坚心住十地菩萨众，随顺佛说造论，以章句偈颂譬喻解十地第一义
- id: guji-龙树-event-first-ground
  title_zh: 开示初欢喜地八法资用
  date: '0200'
  year_of: 200
  description: 明厚种善根善行诸行善集资用善供养佛善知识护具足深心悲念信解，得初地名欢喜
- id: guji-龙树-event-complete
  title_zh: 集谛舍灭慧四功德流通
  date: '0210'
  year_of: 210
  description: 以造论演说照明正法集四功德处，自心他心清净，令钝根者亦得读诵受持
- id: guji-龙树-event-death
  title_zh: 示寂
  date: '0250'
  year_of: 250
  description: 约魏明帝时示寂，留十住毗婆沙论为后世解十地者之依
