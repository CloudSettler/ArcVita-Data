  reign_ref: 汉桓帝至魏明帝年间
  archetype: 大乘论师
  dilemmas:
  - title_zh: 速出生死与久住生死利他之择
    description: 声闻辟支佛速灭众苦，大乘经恒河沙劫具足十地，当择自利速脱还是慈悲久住普度群生
  - title_zh: 软心怖畏与坚心不退之争
    description: 见地狱畜生饿鬼诸苦易怖畏退求二乘，须以坚心大悲愿力超越怖畏直入必定
  lesson: 以大悲坚心久住生死，具足十地成就佛果，方不断三宝种普利群生
  summary_first_person: 吾龙树敬礼一切佛，为济生死大海众生造十住毗婆沙论，随顺佛说解十地义，明坚心大悲为第一，不为名利，但愿众生发无上道心入必定聚生如来家
  source_urls:
