  - key: breakthrough
    name: 开解十地名义
    labels:
      zh:
      - 突破
    start_date: 0190
    highlight_event_id: guji-龙树-event-compose
  - key: climax
    name: 广释初欢喜地行相
    labels:
      zh:
      - 高潮
    start_date: '0200'
