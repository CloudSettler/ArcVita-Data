  - key: breakthrough
    name: 浮海抵印学瑜伽
    labels:
      zh:
      - 那烂陀问道
    start_date: '0673'
    highlight_event_id: guji-义净-event-study
  - key: climax
    name: 亲核谈筵核校梵本
    labels:
      zh:
      - 核校梵典
    start_date: 0685
    highlight_event_id: guji-义净-event-study
