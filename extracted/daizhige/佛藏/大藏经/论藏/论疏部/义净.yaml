  decisions:
  - date: '0671'
    title_zh: 浮海西行不循陆路
    rationale: 慕法显玄奘西行之志欲直探印度瑜伽正源故冒海难而往
  - date: 0695
    title_zh: 携梵本归国襄译
    rationale: 见神州译文阙略义府难测欲以亲受之本补阙正义故东归
- id: guji-义净-endeavor-2
  title_zh: 重译般若并作末后一颂赞述
  summary_zh: 译无著般若颂释及世亲七门义释后因末后一颂释文隐昧作十八赞以三性通会空有
  phases:
  - key: brewing
    name: 译无著般若颂释
    labels:
