      - 初译颂释
    start_date: 0697
    highlight_event_id: guji-义净-event-translate
  - key: breakthrough
    name: 更译本经合世亲释
    labels:
      zh:
      - 重译补阙
    start_date: 0699
    highlight_event_id: guji-义净-event-translate
  - key: climax
    name: 以二九事喻作十八赞
    labels:
      zh:
      - 造赞明喻
    start_date: '0700'
    highlight_event_id: guji-义净-event-compose
  - key: closure
    name: 以三性三身收会真俗
    labels:
      zh:
      - 会通空有
    start_date: '0701'
    highlight_event_id: guji-义净-event-compose
  decisions:
  - date: 0699
    title_zh: 雅符释意更译本经
    rationale: 见旧译虽讫而义有阙如又世亲七门盛传西域故重详其妙以正视听
  - date: '0700'
    title_zh: 因九喻聊题赞述
    rationale: 见末后一颂一切有为法如星翳等释文既隐恐寻者昧故以见境识界身用过现未配九喻明无住涅槃
events:
- id: guji-义净-event-birth
  title_zh: 诞生于齐州
  date: '0635'
  year_of: 635
  description_zh: 唐贞观九年生于齐州张氏，少出家慕西行求法之志
- id: guji-义净-event-depart
  title_zh: 自广州浮海西行
  date: '0671-11-01'
  year_of: 671
  description_zh: 唐咸亨二年自广州乘舶经室利佛逝向印度求瑜伽正法
- id: guji-义净-event-study
  title_zh: 居那烂陀亲承瑜伽宗义
  date: '0679-01-01'
  year_of: 679
  description_zh: 居那烂陀寺习唯识三性之说，知慈氏授无著八十颂开般若要门之传
- id: guji-义净-event-return
  title_zh: 负经东归抵洛阳
  date: '0695-05-01'
  year_of: 695
  description_zh: 携梵本四百余部至洛阳，得敕襄译，始详校般若颂释諸家异说
- id: guji-义净-event-translate
  title_zh: 译般若颂释及七门义释
  date: '0699-01-01'
  year_of: 699
  description_zh: 译无著菩萨般若颂释及世亲般若七门义释，考师子月与月官等释意符三性不同中观
- id: guji-义净-event-compose
  title_zh: 作略明般若末后一颂赞述
  date: '0700-01-01'
  year_of: 700
  description_zh: 因末后一颂释文隐，以见如星境如翳识如灯界如幻身如露用如泡过如梦现如电未如云作十八赞复以三性三身真俗般若明观行
- id: guji-义净-event-death
  title_zh: 卒于长安
  date: '0713-02-01'
  year_of: 713
  description_zh: 唐先天二年卒于长安，谥鸿胪卿，译经传法之业终焉
