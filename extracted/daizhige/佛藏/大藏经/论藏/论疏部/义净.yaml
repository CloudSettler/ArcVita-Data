  dilemmas:
  - 中观瑜伽有空相隔之下如何会通般若大宗两意
  - 西域义府幽冲难测而东夏译文阙略之时如何抉择重译与赞释
  lesson: 以三性为本不住生死不居涅槃方契无住般若
  summary_first_person: 我是义净，因译无著菩萨般若颂释，详其九喻，恐寻者尚昧，遂作末后一颂赞述，以星翳灯幻露泡梦电云显生死区寰，以三性三身明观行，冀朝览遂闲夜光无惑
