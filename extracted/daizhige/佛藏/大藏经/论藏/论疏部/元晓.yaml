  - title_zh: 守习牵文与虚怀寻旨之辨
    description_zh: 各守所习则望源迷流把叶亡干，当直依论文属对经本以显一心宗体
  - title_zh: 广繁经教与总持悟入之难
    description_zh: 经中虽具此法，根行不等受解缘别，乐总持者须约文丰义之论以摄无边义
  lesson: 立一心开二门，摄无量义而不乱，会万行以还源
  summary_first_person: 吾新罗元晓，以一心为大乘宗体，开真如生灭二门，总摄如来广大深法，造疏以起众生正信，令离苦得乐绍隆佛种
