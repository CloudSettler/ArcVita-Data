  era: 唐初新罗
  reign_ref: 新罗善德女王至神文王之世
  archetype: 和诤论师
  dilemmas:
  - title_zh: 空有相诤如何融会
    description: 中观专破而不立，瑜伽广立而不夺，学者各守所习，牽文失旨，如何以一心二门总摄而和会百家
  - title_zh: 守戒持律与深入闾巷化俗
    description: 欲超名相而有归，须捨名相而入生死，是安住律儀以守其静，还是破戒还俗以随缘利生
  lesson: 以一心开二门，泯相以显理，揽理以成事，真俗平等而不碍升降，方能和百家之诤而还一心之源
  summary_first_person: 我是元晓，新罗押梁海东沙门，少出家而研三藏，伤学者各守所习不得论宗，依马鸣起信论开一心真如生灭二门，撰疏之后复自记此别记，直依文属略举纲领，开二门于一心以括百八之诰，示性净于相染以综幽致，愿为学者开一轴而掬三藏之指，永息万境而还一心
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AE%BA%E7%96%8F%E9%83%A8/%E5%A4%A7%E4%B9%98%E8%B5%B7%E4%BF%A1%E8%AE%BA%E5%88%AB%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AE%BA%E7%96%8F%E9%83%A8/%E5%A4%A7%E4%B9%98%E8%B5%B7%E4%BF%A1%E8%AE%BA%E5%88%AB%E8%AE%B0.md
endeavors:
- id: guji-元晓-endeavor-1
  title_zh: 疏解起信论立一心二门宗
  description: 依楞伽如来藏通二门为宗，总摄如来广大深法，撰起信论疏复撰别记，抉法义体相用以评群诤
  phases:
  - key: brewing
    name: 出家研藏栖心大乘
    labels:
      zh: 研读蓄积
    start_date: '0634'
    highlight_event_id: guji-元晓-event-ordination
  - key: breakthrough
    name: 撰起信论疏立法义
    labels:
      zh: 立义突破
    start_date: '0600'
    highlight_event_id: guji-元晓-event-shu
  - key: climax
    name: 再撰别记抉择纲领
    labels:
      zh: 别记抉微
    start_date: '0665'
    highlight_event_id: guji-元晓-event-bieji
  - key: closure
    name: 和会空有归于一心
    labels:
      zh: 融诤归宗
    start_date: '0670'
    highlight_event_id: guji-元晓-event-bieji
  decisions:
  - date: '0660'
    title_zh: 先疏后记不袭旧释
    rationale: 旧释或望源述流或把叶云干割领补袖，不近论主之意，故直依论文属当自记纲领
  - date: '0665'
    title_zh: 以法义二章摄体相用
    rationale: 法者众生心为大乘体，义者体相用为大乘名，真如门示体，生灭门示自体相用，方能总摄理事而不杂三性
- id: guji-元晓-endeavor-2
  title_zh: 还俗化俗弘一心无碍道
  description: 不守常住枯寂，随无明缘而起净用，深入市井闾巷，以歌化导，以和诤济世，令凡圣同归本觉
  phases:
  - key: brewing
    name: 感通动静参差发大悲
    labels:
      zh: 悲愿酝酿
    start_date: '0650'
    highlight_event_id: guji-元晓-event-huasu
  - key: breakthrough
    name: 舍律儀深入生死
    labels:
      zh: 化俗转身
    start_date: '0661'
    highlight_event_id: guji-元晓-event-huasu
  - key: climax
    name: 十门和诤普摄群宗
    labels:
      zh: 和诤弘化
    start_date: 0668
    highlight_event_id: guji-元晓-event-huasu
  - key: closure
    name: 示寂而留百部论典
    labels:
      zh: 述作圆成
    start_date: 0686
    highlight_event_id: guji-元晓-event-death
  decisions:
  - date: '0661'
    title_zh: 破戒相而全戒体
    rationale: 真如不守自性，随缘而不失自性清净，若执戒相则绝感应之路，故以染而不染之行显不空之用
  - date: 0668
    title_zh: 以方言俚曲接引群生
    rationale: 思议路绝则祈者无归，感应路通则影响有方，须超名相而垂影响，令学者暂开一轴即还一心之源
events:
- id: guji-元晓-event-birth
  title_zh: 生于新罗押梁郡
  date: '0617'
  year_of: 617
  place_zh: 新罗押梁郡
  description: 隋末唐初生于新罗押梁，姓薛，名晓，少聪慧，志慕大乘
- id: guji-元晓-event-ordination
  title_zh: 出家受具研习大乘
  date: '0634'
  year_of: 634
  place_zh: 新罗
  description: 年少出家，遍习中观瑜伽楞伽涅槃华严诸典，栖心如来藏一心之旨
- id: guji-元晓-event-shu
  title_zh: 撰大乘起信论疏
  date: '0660'
  year_of: 660
  place_zh: 新罗
  description: 依马鸣论立一心二门，释法义体相用，判摄摩罗百八逾阇十五之義，为别记之先声
- id: guji-元晓-event-huasu
  title_zh: 还俗深入闾巷化导
  date: '0661'
  year_of: 661
  place_zh: 新罗庆州一带
  description: 舍僧相而化俗，以无碍辩弘一心和诤，生子薛聪，仍以居士身弘通佛道
- id: guji-元晓-event-bieji
  title_zh: 撰大乘起信论别记
  date: '0665'
  year_of: 665
  place_zh: 新罗
  description: 海东沙门自记，述论大意明诸论祖宗群诤评主之義，次依文消息消立义分法义真如生灭四重，显非一非异之阿梨耶
- id: guji-元晓-event-death
  title_zh: 示寂于新罗
  date: 0686
  year_of: 686
  place_zh: 新罗
  description: 神文王六年示寂，世寿七十，遗著述百余部，起信疏记与和诤之风大行于海东及唐土
