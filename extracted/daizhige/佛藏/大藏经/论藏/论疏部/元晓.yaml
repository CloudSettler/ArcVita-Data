events:
- id: guji-元晓-event-birth
  title_zh: 生于新罗
  date: '0617'
  year_of: 617
  description_zh: 生于新罗，俗姓薛，少有志行，出家求道
- id: guji-元晓-event-seekdharma
  title_zh: 与义湘入唐中道而返悟一心
  date: '0661'
  year_of: 661
  description_zh: 欲入唐求法，中途而返，悟心外无法，一心具足，遂回国弘化
- id: guji-元晓-event-commentary
  title_zh: 撰大乘起信论疏
  date: '0665'
  year_of: 665
  description_zh: 标大乘宗体为一心，释大乘起信论题名，开二门摄无边义，与法藏慧远并称本论三师
- id: guji-元晓-event-preach
  title_zh: 弘示信心止观劝生净土
  date: '0675'
  year_of: 675
  description_zh: 示修行信心分止观法门及除障方便，劝专念生佛前，化俗利生
- id: guji-元晓-event-death
  title_zh: 圆寂于新罗
  date: 0686
  year_of: 686
  description_zh: 示寂于新罗，世寿七十，所造海东疏高出诸师之上盛行于世
