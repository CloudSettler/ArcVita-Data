endeavors:
- id: guji-吉藏-endeavor-1
  title_zh: 大业讲次疏解百论
  summary: 因讲次第直疏百论序义，判十章以叹功能明时节，正人名显缘起，述注传译定宗。
  phases:
  - key: brewing
    name: 幼习三论蕴酿中观
    labels:
      zh: 学三论
    start_date: '0556'
    highlight_event_id: guji-吉藏-event-congfalang
  - key: breakthrough
    name: 覆述讲说领悟玄宗
    labels:
      zh: 讲习
    start_date: '0570'
    highlight_event_id: guji-吉藏-event-congfalang
  - key: climax
    name: 大业四年讲筵直疏
    labels:
      zh: 疏百论
    start_date: '0608-10-01'
    highlight_event_id: guji-吉藏-event-bailunshu
  - key: closure
    name: 十章具足流通震旦
    labels:
      zh: 成疏
    start_date: 0609
    highlight_event_id: guji-吉藏-event-bailunshu
  decisions:
  - date: '0608-10-01'
    title_zh: 因讲次直疏不事访采
    rationale: 趁讲筵现前直述胸怀，以存讲时宗旨，不以后访杂乱本义
  - date: '0608-10-01'
    title_zh: 开一序为十章人法两义
    rationale: 以人法摄造注翻请与功能时节名宗品偈，令化行天竺与流传震旦条贯分明
- id: guji-吉藏-endeavor-2
  title_zh: 栖嘉祥弘通大小开显正观
  summary: 承兴皇法朗之学，辟三藏坦十二，立言无当破不执，以通圣心开真谛。
  phases:
  - key: brewing
    name: 师事法朗习中百十二门
    labels:
      zh: 承学
    start_date: '0556'
    highlight_event_id: guji-吉藏-event-congfalang
  - key: breakthrough
    name: 慧日嘉祥开筵讲化
    labels:
      zh: 开讲
    start_date: 0585
    highlight_event_id: guji-吉藏-event-hongdao
  - key: climax
    name: 会空有申二谛二智
    labels:
      zh: 立宗
    start_date: '0608-10-01'
    highlight_event_id: guji-吉藏-event-bailunshu
  - key: closure
    name: 隋唐帝王请讲四方宗仰
    labels:
      zh: 护法
    start_date: '0610'
    highlight_event_id: guji-吉藏-event-hongdao
  decisions:
  - date: '0600'
    title_zh: 宗肇师序弃睿师旧序
    rationale: 肇序亲睹时事言巧意玄妙符论旨，故恒读以正化本
  - date: '0608-10-01'
    title_zh: 明言无当破不执为论大宗
    rationale: 外小皆言有所当破有所执，唯提婆无住无执方能无难不通无通不难
events:
- id: guji-吉藏-event-birth
  date: 0549
  year_of: 549
  title_zh: 生于金陵安息裔家
  description: 梁太清三年生于建康，俗姓安，本安息国人，父早亡，母携往摄山栖霞精舍。
- id: guji-吉藏-event-congfalang
  date: '0556'
  year_of: 556
  title_zh: 七岁出家师事法朗
  description: 七岁于法朗处出家，专学三论中百十二门，深悟空假中，得兴皇法绪。
- id: guji-吉藏-event-bailunshu
  date: '0608-10-01'
  year_of: 608
  title_zh: 大业四年十月讲次疏百论
  description: 大业四年十月因讲筵直疏百论序义，开十章辨人法，叹提婆玄心独悟辟三藏坦十二，述罗什重翻与姚嵩请译之缘。
- id: guji-吉藏-event-hongdao
  date: '0610'
  year_of: 610
  title_zh: 住嘉祥慧日弘化帝京
  description: 住扬州嘉祥寺及长安慧日道场，隋炀帝唐高祖屡请讲法，三论之宗大盛于世。
- id: guji-吉藏-event-death
  date: '0623'
  year_of: 623
  title_zh: 唐武德六年示寂
  description: 唐武德六年于长安实际寺示寂，世寿七十五，著三论疏及百论疏等垂范后学。
