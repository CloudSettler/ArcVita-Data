      raw: 唐初约生
    death:
      date: '0710'
      precision: year
      is_circa: true
      raw: 唐中宗时约卒
  birth_date: '0650'
  death_date: '0710'
  era: 唐
  reign_ref: 高宗显庆至中宗景龙间
  archetype: 唯识义解沙门
  dilemmas:
  - 空有二执纷纠于怀，如何随病施药遣空除有以显无我
  - 百法名数浩博难持，如何以五位摄尽一切法令初学得入明门
  lesson: 随病说药，病息药亡，非空非有，即有即空，方为明门正义
  summary_first_person: 吾大乘光，住大慈恩寺，寻三界漂溺皆由空有二执，乃依本事分略录名数，以三门疏解百法，料简八识心所，令后学因诠显旨，悟入人法二空
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AE%BA%E7%96%8F%E9%83%A8/%E5%A4%A7%E4%B9%98%E7%99%BE%E6%B3%95%E6%98%8E%E9%97%A8%E8%AE%BA%E7%96%8F.html
  - https://zh.wikisource.org/wiki/%E5%A4%A7%E4%B9%98%E7%99%BE%E6%B3%95%E6%98%8E%E9%96%80%E8%AB%96%E7%96%8F
endeavors:
- id: guji-大乘光-endeavor-1
  title_zh: 三门疏解百法明门论立五位宗
  summary: 以造论意释题目随文释三门，立心法心所有色法不相应无为五位，总摄百法以明一切法无我
  phases:
  - key: brewing
    name: 引经标宗起问
    labels:
      zh: 酝酿立宗
    start_date: 0680
    highlight_event_id: guji-大乘光-event-shang
  - key: breakthrough
    name: 废立五法次第
    labels:
      zh: 突破判摄
    start_date: 0685
    highlight_event_id: guji-大乘光-event-shang
  - key: climax
    name: 别释五法列名
    labels:
      zh: 高峰广释
    start_date: 0690
    highlight_event_id: guji-大乘光-event-shang
  decisions:
  - date: 0685
    title_zh: 以心法为首明最胜用
    rationale: 心净则众生净，心染则众生染，或著生死或证涅槃，故先明心法以摄群法
  - date: 0690
    title_zh: 以略录名数摄本事分
    rationale: 本事分文繁浩博，略录非义略，目召诸法令初学易持，故立五位百法为纲
- id: guji-大乘光-endeavor-2
  title_zh: 五门料简八识心所弘传唯识
  summary: 以缘境四缘四界重数三性五门料简八识，又以诸论假实四界三性废立六位料简五十一种心所，辨大小乘异义
  phases:
  - key: brewing
    name: 料简八识缘境四缘
    labels:
      zh: 酝酿料简
    start_date: 0692
    highlight_event_id: guji-大乘光-event-xia
  - key: climax
    name: 广释心所五十一法
    labels:
      zh: 高峰细释
    start_date: 0695
    highlight_event_id: guji-大乘光-event-xia
  - key: closure
    name: 五门总结废立六位
    labels:
      zh: 收束弘传
    start_date: '0700'
    highlight_event_id: guji-大乘光-event-xia
  decisions:
  - date: 0693
    title_zh: 存两释以辨五识缘假实
    rationale: 一家谓五识唯缘实尘，一家谓假实并缘，存两说以显摄假从实与遍计法处之别，不偏执一边
  - date: 0696
    title_zh: 依大乘明心所相应义
    rationale: 小乘更立同行，大乘心王心所各变自缘同时相应，故须别明，以简小乘执见
events:
- id: guji-大乘光-event-birth
  title_zh: 诞生于唐初
  date: '0650'
  year_of: 650
  description: 唐初约生，后出家为沙门，习唯识法相之学
- id: guji-大乘光-event-enci
  title_zh: 住大慈恩寺弘法
  date: '0675'
  year_of: 675
  description: 住京师大慈恩寺为沙门，研习瑜伽百法诸论，专攻唯识义解
- id: guji-大乘光-event-shang
  title_zh: 撰百法明门论疏卷上
  date: 0690
  year_of: 690
  description: 造疏卷上，以三门分别，明造论意为除空有二执，释大乘百法明门论题，别解心法八识及心所有法前分
- id: guji-大乘光-event-xia
  title_zh: 撰百法明门论疏卷下料简心所
  date: 0698
  year_of: 698
  description: 造疏卷下，略以五门料简心所有法，广释善十一烦恼六随烦恼二十及不定四，明假实界性废立之别
- id: guji-大乘光-event-death
  title_zh: 示寂于长安
  date: '0710'
  year_of: 710
  description: 唐中宗景龙前后示寂于长安，疏本流行于后世，入藏为论疏部要典
