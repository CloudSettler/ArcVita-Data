endeavors:
- id: guji-天亲-endeavor-1
  title_zh: 依瑜伽广造众论阐扬中道
  summary_zh: 依瑜伽论广造诸论，释大乘非空非有中道，判一代圣教浅深八宗，以应理圆实为归趣。
  phases:
  - key: brewing
    name: 博学坟籍戒行清白
    labels:
      zh: 孕育积学
    start_date: '0335'
    highlight_event_id: guji-天亲-event-birth
  - key: breakthrough
    name: 依瑜伽立宗造论
    labels:
      zh: 立宗破执
    start_date: '0360'
    highlight_event_id: guji-天亲-event-treatises
  - key: climax
    name: 发挥中道判教八宗
    labels:
      zh: 弘扬大成
    start_date: '0370'
    highlight_event_id: guji-天亲-event-treatises
  - key: closure
    name: 成为大乘正宗所依
    labels:
      zh: 结集流传
    start_date: 0390
    highlight_event_id: guji-天亲-event-death
  decisions:
  - date: '0360'
    title_zh: 以瑜伽为本广造众论
    rationale: 为释大乘破偏执，故不守一文而遍造诸论以显中道
  - date: '0370'
    title_zh: 以应理圆实为此论旨趣
    rationale: 为别大小深浅，故判八宗以第八宗为归，明第三时空有双彰
- id: guji-天亲-endeavor-2
  title_zh: 略录名数造百法明门论
  summary_zh: 于本地分六百六十法中提纲挈领略录百法，以五位统摄心王心所色不相应无为，以一切法无我为一论纲领。
  phases:
  - key: brewing
    name: 愍学者繁而欲令人知要
    labels:
      zh: 发心略录
    start_date: '0365'
    highlight_event_id: guji-天亲-event-treatises
  - key: breakthrough
    name: 立五位百法章门
    labels:
      zh: 建构名数
    start_date: '0375'
    highlight_event_id: guji-天亲-event-baifa
  - key: climax
    name: 以一切法无我总标宗旨
    labels:
      zh: 点示纲领
    start_date: '0375'
    highlight_event_id: guji-天亲-event-baifa
  - key: closure
    name: 后代依此注疏传弘
    labels:
      zh: 注译流通
    start_date: 0395
    highlight_event_id: guji-天亲-event-death
  decisions:
  - date: '0375'
    title_zh: 以百法统摄一切法
    rationale: 为令学者易持，故以心法八心所五十一色十一不相应二十四无为六总摄万法
  - date: '0375'
    title_zh: 以二无我为问答宗旨
    rationale: 为急于利乐有情，故首问何等一切法云何为无我，直示人法二空
events:
- id: guji-天亲-event-birth
  title_zh: 生于富娄沙富罗婆罗门家
  date: '0320'
  year_of: 320
  place_zh: 北天竺富娄沙富罗
  description_zh: 国师婆罗门娇尸迦生三子同名婆薮盘豆，中子即天亲，博学多闻神才俊朗戒行清白，长兄为无著，季弟为比邻持跋婆。
- id: guji-天亲-event-treatises
  title_zh: 依瑜伽广造众论显中道
  date: '0360'
  year_of: 360
  place_zh: 北天竺
  description_zh: 遍通坟籍后依瑜伽论广造诸论以释大乘，发挥非空非有中道之教，详见婆薮盘豆传。
  endeavor_ref: guji-天亲-endeavor-1
- id: guji-天亲-event-baifa
  title_zh: 造大乘百法明门论略录名数
  date: '0375'
  year_of: 375
  place_zh: 北天竺
  description_zh: 于瑜伽本地分六百六十法中略录名数，立心法心所有法色法心不相应行法无为法五位百法，以如世尊言一切法无我为宗。
  endeavor_ref: guji-天亲-endeavor-2
- id: guji-天亲-event-death
  title_zh: 示寂流传为大乘论主
  date: '0400'
  year_of: 400
  place_zh: 北天竺
  description_zh: 生平造论宏深，后世奉为大乘论主，其百法一论经玄奘奉诏译出，复得窥基注解普泰增修而广行于世。
