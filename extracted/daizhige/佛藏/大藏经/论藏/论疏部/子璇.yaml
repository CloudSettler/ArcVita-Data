endeavors:
- id: guji-子璇-endeavor-1
  title_zh: 笔削法藏起信论疏成笔削记
  summary: 本乎石壁慈恩疏取要当者笔存繁缓者削去添改得中列疏就论以利讲习
  phases:
  - key: brewing
    name: 观石壁繁缓而思笔削
    labels:
      zh: 酝酿观阙
    start_date: '1005'
    highlight_event_id: guji-子璇-event-guanbi
  - key: breakthrough
    name: 定笔存削去体例
    labels:
      zh: 体例初定
    start_date: '1015'
    highlight_event_id: guji-子璇-event-dingti
  - key: climax
    name: 列疏就论科释五分三段
    labels:
      zh: 会通正宗
    start_date: '1020'
    highlight_event_id: guji-子璇-event-dingti
  - key: closure
    name: 笔削记成流通后学
    labels:
      zh: 成书流通
    start_date: '1025'
    highlight_event_id: guji-子璇-event-chengshu
  decisions:
  - date: '1015'
    title_zh: 立笔削得中之法
    rationale: 石壁先问发次举疏答后方委释有太过不及讲者未稳故取要笔存繁缓削去添改取中
  - date: '1020'
    title_zh: 列疏文以就于论
    rationale: 论疏二本别行学者不能周览互阙功进难前故论下有疏论上有科以昭文义章段
- id: guji-子璇-endeavor-2
  title_zh: 弘传一心二门起信正义
  summary: 住长水弘大乘起信华严法义明一心总别三大真如生灭不二破邪显正劝信修益
  phases:
  - key: brewing
    name: 宗法华涅槃楞伽研习起信
    labels:
      zh: 宗经研习
    start_date: 0990
    highlight_event_id: guji-子璇-event-guanbi
  - key: breakthrough
    name: 明一心体相用三大义
    labels:
      zh: 立义明宗
    start_date: '1010'
    highlight_event_id: guji-子璇-event-dingti
  - key: climax
    name: 讲演真如生灭不二圆实旨
    labels:
      zh: 讲演弘化
    start_date: '1022'
    highlight_event_id: guji-子璇-event-chengshu
  - key: closure
    name: 示四信五行劝修利益
    labels:
      zh: 劝修流通
    start_date: '1030'
    highlight_event_id: guji-子璇-event-hongfa
  decisions:
  - date: '1010'
    title_zh: 以一心为论主质弘实教
    rationale: 论文总摄如来广大深法为诸佛秘藏马鸣宗百部实教所造故明体相用护圆实破谤执
  - date: '1030'
    title_zh: 劝四信五行入不退
    rationale: 末法根劣须依论生信思惟修习得大利乐流后益生故说信解行证摄末归本
