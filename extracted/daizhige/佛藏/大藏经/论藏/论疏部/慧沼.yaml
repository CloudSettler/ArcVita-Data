  decisions:
  - date: '0700'
    title_zh: 于五释之外更助三释以明入正理
    rationale: 因明正理入字义兼通立敌持业依主不可一解尽故广演七释以摄三十五释七十七释
  - date: '0705'
    title_zh: 不立真似似似四分但立真似以摄义周
    rationale: 真似之外更立似似则亦应真中有真真自语相违且深为无用故但言真似
- id: guji-慧沼-endeavor-2
  title_zh: 住淄州大云寺弘唯识因明护正破邪
  summary: 住持大云寺以三支比量宗因喻多言开示问者辨极成宗依同异喻体简宗过九现比相违救萨婆多大小乘圣教之诤
  phases:
  - key: brewing
