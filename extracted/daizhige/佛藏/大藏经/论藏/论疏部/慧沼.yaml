  - key: breakthrough
    name: 简别宗依
    labels:
      zh:
      - 明极成有法
      - 简相符相违
    start_date: '0700'
    highlight_event_id: guji-慧沼-event-2
  - key: climax
    name: 正因喻义
    labels:
      zh:
      - 立遍是宗法
      - 明生因了因
    start_date: '0705'
    highlight_event_id: guji-慧沼-event-3
  - key: closure
    name: 付嘱流通
    labels:
      zh:
      - 示寂护法
      - 义疏传世
    start_date: '0714'
    highlight_event_id: guji-慧沼-event-death
  decisions:
  - date: '0702'
    title_zh: 以立者言为亲生因不以敌智为亲生因
    rationale: 敌无解智时三相不成敌了宗智从立者多言开示忆念本极成而生故立论言正是生因
  - date: '0706'
    title_zh: 通弟子说为至教不局佛说
    rationale: 显扬云如来及弟子所说展转流布不违正理即名圣言摄故大小各自信受不违理者皆得为量
