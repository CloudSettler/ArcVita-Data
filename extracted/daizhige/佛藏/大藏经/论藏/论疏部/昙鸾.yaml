    description: 本习方术求长生不死，遇菩提流支始悟佛道方为毕竟依归
  - title_zh: 自力难行与他力易行之择
    description: 五浊无佛之世求不退转极难，故依信佛因缘乘愿往生安乐国
  lesson: 舍自力执持，依他力本愿，以信愿往生证入正定聚
  summary_first_person: 我是昙鸾，本慕长生习陶隐仙术，后遇菩提流支授以净土法门，遂一心归命尽十方无碍光如来，注解往生偈论，判难易二道，以易行道接引众生愿生安乐国
