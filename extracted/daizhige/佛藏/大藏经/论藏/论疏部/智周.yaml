  decisions:
  - date: 0683
    title_zh: 依慧沼学法相唯识
    rationale: 慧沼为窥基上足，欲得玄奘正传，非就其门不可，故舍诸学专攻瑜伽唯识
  - date: '0700'
    title_zh: 以三机三时判教弘化
    rationale: 不定姓人根有利钝，须以三时开悟摄之，方能会通二圣空有互执，普摄群机
- id: guji-智周-endeavor-2
  title_zh: 撰述成唯识论演秘
  summary: 恐窥基述记之义隐而未畅，博引瑜伽佛地显扬诸论，疏解科判教体，成演秘数卷以令法久住
  phases:
  - key: brewing
    name: 研读述记博览群论
    labels:
      zh:
      - 研读蓄积
    start_date: 0695
    highlight_event_id: guji-智周-event-study
  - key: breakthrough
    name: 发愿演述记之秘
    labels:
      zh:
      - 立愿著述
    start_date: '0705'
    highlight_event_id: guji-智周-event-teach
  - key: climax
    name: 演秘撰成明教体性
    labels:
      zh:
      - 著述圆成
    start_date: '0712'
    highlight_event_id: guji-智周-event-write
  - key: closure
    name: 疏文流布法得久住
    labels:
      zh:
      - 流传后世
    start_date: '0720'
    highlight_event_id: guji-智周-event-death
  decisions:
  - date: '0705'
    title_zh: 决定疏解述记不另造论
    rationale: 本颂文略义未了，述记广悉，演其秘而畅其玄，比别立新义更能令法久住
  - date: '0712'
    title_zh: 以性用别明立教体
    rationale: 若不取性用别质出体，则无漏教随听成染，三宝无为亦成有为，故须详辨自识变现与佛实说之别
events:
- id: guji-智周-event-birth
  title_zh: 濮阳出生
  date: 0668
  year_of: 668
  description: 唐总章元年生于濮阳徐氏，幼而好学，早怀出尘之志
  place_zh: 濮阳
- id: guji-智周-event-study
  title_zh: 师事慧沼学唯识
  date: 0683
  year_of: 683
  description: 依淄州慧沼出家受具，专攻瑜伽成唯识及因明，尽得窥基一系相传
  place_zh: 淄州
- id: guji-智周-event-teach
  title_zh: 弘讲三时三机之教
  date: '0700'
  year_of: 700
  description: 弘讲成唯识论，依解深密说唯识，依华严说唯心，会通第二时般若亦说唯识，判不定姓三机前后悟异
  place_zh: 长安
- id: guji-智周-event-write
  title_zh: 撰成唯识论演秘
  date: '0712'
  year_of: 712
  description: 述窥基述记而演其秘，科判三分，辨教体成所引声，论十利五乐，明因乐受乐对治等义，卷帙遂成
  place_zh: 长安
- id: guji-智周-event-death
  title_zh: 开元示寂
  date: '0723'
  year_of: 723
  description: 唐开元十一年示寂，世寿五十余，法相宗风赖以不坠，后世与窥基慧沼并称
  place_zh: 长安
