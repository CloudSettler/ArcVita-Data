  - title_zh: 守宗统与穷义理之衡
    description: 既承玄奘窥基慧沼一系正统，又须于述记之外再加疏解，守成与创释之间难以两全
  - title_zh: 简略与详广之度
    description: 唯识教义广如瑜伽，略如二十论，讲说弘传时须得其中道，不堕繁简二失
  lesson: 守正统而能演畅微言，以疏解令法久住，则宗义不坠
  summary_first_person: 吾智周，濮阳徐氏子，幼依佛门，亲承慧沼，绍玄奘窥基之绪，专弘法相唯识，恐述记之义未畅，遂作演秘以演其秘，愿法久住，利乐含识
