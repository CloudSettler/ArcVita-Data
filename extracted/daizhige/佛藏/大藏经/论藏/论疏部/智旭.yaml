endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 造裂网疏会通性相
  summary: 以一心二门剖尽两宗迷执，显真如生灭不一不异，成起信要疏
  phases:
  - key: brewing
    name: 研阅二译深观心性
