  decisions:
  - date: 1653
    title_zh: 舍梁本取唐本
    rationale: 对阅二译唐本更为文显义顺，阄决于佛，遂殚微明专解唐本
  - date: 1653-10-18
    title_zh: 以裂网为名破相执
    rationale: 注疏家依名定义致二论乖同水火，故剖尽迷执，直指现前介尔心性为大乘
- id: guji-智旭-endeavor-2
  title_zh: 灵峰弘法修信利生
  summary: 依归敬述意正说五分，示作因立义解释修信利益，策进三根绍隆佛种
  phases:
  - key: brewing
    name: 出家持戒参究教观
    labels:
