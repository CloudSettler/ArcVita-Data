  - key: climax
    name: 示五分弘宣起信法门
    labels:
      zh: 高潮
    start_date: 1653
    highlight_event_id: guji-智旭-event-liewang
  - key: closure
    name: 示寂归安养莲邦
    labels:
      zh: 收束
    start_date: 1655
    highlight_event_id: guji-智旭-event-death
  decisions:
  - date: 1623
    title_zh: 弃儒出家归心佛祖心宗
    rationale: 信佛祖之道以心传心，十方谛求更无余乘，故愿自利利他运载至佛地
  - date: 1653
    title_zh: 以四悉檀判摄五分
    rationale: 为令上中下根及未种善根者各得欢喜生善灭恶入理，故立作因立义解释修信利益
events:
- id: guji-智旭-event-birth
  title_zh: 出生于吴县
  date: 1599
  year_of: 1599
  type: birth
  description: 明万历二十七年生于吴县钟氏家，宿具大乘信根，后为灵峰蕅益沙门
- id: guji-智旭-event-ordination
  title_zh: 发心出家研习经论
  date: 1623
  year_of: 1623
  type: career
  description: 年二十四出家为僧，遍参教观，深究唯识般若楞伽宗镜，为后会通性相奠基
- id: guji-智旭-event-liewang
  title_zh: 癸巳十月下笔造裂网疏
  date: 1653-10-18
  year_of: 1653
  type: career
  description: 癸巳十月十有八日下笔，以一心真如门显般若随智说，以生灭门显瑜伽随情说，破立相破相非圆之妄判，明真如受熏如触波即水，不受熏如波动湿性不动
- id: guji-智旭-event-death
  title_zh: 示寂于灵峰
  date: 1655
  year_of: 1655
  type: death
  description: 清顺治十二年示寂，留灵峰一脉，以起信净土之业绍佛种性相续不断
