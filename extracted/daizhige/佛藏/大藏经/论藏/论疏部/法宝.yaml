endeavors:
- id: guji-法宝-endeavor-1
  title_zh: 考定成道转法轮时地作疏首门
  summary: 以律论经疏互证定二月八日成道八月八日鹿野转法轮会通七七三七五十七日等异说
  phases:
  - key: brewing
    name: 博览经律论定时异说
    labels:
      zh: 收集异说
    start_date: '0650'
    highlight_event_id: guji-法宝-event-kao-falun
  - key: breakthrough
    name: 以婆沙释律论定八月八日
    labels:
      zh: 立定说
    start_date: '0660'
    highlight_event_id: guji-法宝-event-kao-falun
  - key: climax
    name: 五缘会通日数差别
    labels:
      zh: 会通异说
    start_date: '0665'
    highlight_event_id: guji-法宝-event-kao-falun
  - key: closure
    name: 首门既定依文解释
    labels:
      zh: 归宗释文
    start_date: '0670'
    highlight_event_id: guji-法宝-event-shu-cheng
  decisions:
  - date: '0660'
    title_zh: 舍三七七七独取六月说
    rationale: 唯婆沙释律论指陈月日分明余文不指月日不可为准故定八月八日
  - date: '0665'
    title_zh: 立举时别等五缘会异
    rationale: 成道八相父子生日等大小皆同转法轮日理合皆同故以广略传误释悬隔
- id: guji-法宝-endeavor-2
  title_zh: 弘宣学行次第立先小后大
  summary: 引涅槃十轮解深密般若等证明闻法亲友为本必先习声闻有教积资方信大乘空教
  phases:
  - key: brewing
    name: 引听法近友为万行本
    labels:
      zh: 立根本
    start_date: '0660'
    highlight_event_id: guji-法宝-event-li-xuexing
  - key: breakthrough
    name: 引十轮般若证必遍学小乘
    labels:
      zh: 立先小
    start_date: '0665'
    highlight_event_id: guji-法宝-event-li-xuexing
  - key: climax
    name: 简大乘种姓亦须积习善根
    labels:
      zh: 破法尔
    start_date: 0668
    highlight_event_id: guji-法宝-event-li-xuexing
  - key: closure
    name: 明一切教起皆归佛乘
    labels:
      zh: 归一乘
    start_date: '0670'
    highlight_event_id: guji-法宝-event-shu-cheng
  decisions:
  - date: '0665'
    title_zh: 决定先学有教后学空教
    rationale: 未种善根未积资粮闻空生谤堕断灭见故须先习苦空无常因缘
  - date: 0668
    title_zh: 不许法尔本性悬记种姓
    rationale: 凡夫印相非佛能知真如所缘一切皆有故须遇缘积习方分五性
events:
- id: guji-法宝-event-birth
  title_zh: 生于唐初出家为沙门
  date: '0620'
  year_of: 620
  description: 唐初生人后出家专攻毗昙俱舍亲近三藏门下
- id: guji-法宝-event-kao-falun
  title_zh: 会初转法轮时定八月八日
  date: '0660'
  year_of: 660
  description: 引长阿含灌佛智论婆沙四分等证二月八日成道八月八日鹿野度憍陈那
- id: guji-法宝-event-li-xuexing
  title_zh: 立学行次第先小后大
  date: '0665'
  year_of: 665
  description: 引十轮解深密般若法华律明未习小乘先学大乘获罪谤法堕恶须渐修五事
- id: guji-法宝-event-shu-cheng
  title_zh: 撰成俱舍论疏卷第一五门分别
  date: '0670'
  year_of: 670
  description: 首会时次学行次教缘次部执后依文释成俱舍正义疏解
- id: guji-法宝-event-death
  title_zh: 示寂
  date: '0700'
  year_of: 700
  description: 弘护俱舍论疏业竟示寂于唐
