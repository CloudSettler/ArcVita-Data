endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 判立四宗显如来藏缘起为究竟一乘
  summary_zh: 通大小权实立随相法执真空无相唯识法相如来藏缘起四宗以此论摄入第四宗明一切众生悉有佛性定性二乘亦当成佛
  phases:
  - key: brewing
    name: 综练大小留心大乘
    labels:
      zh:
      - 学练三藏
      - 留意大乘
    start_date: '0660'
    highlight_event_id: guji-法藏-event-birth
  - key: breakthrough
    name: 四宗判教分齐初立
    labels:
      zh:
      - 约乘约识约法约人
      - 权实分途
    start_date: 0685
    highlight_event_id: guji-法藏-event-translation
  - key: climax
    name: 明一切众生皆当作佛
    labels:
      zh:
      - 一乘无二
      - 佛性平等
    start_date: 0695
    highlight_event_id: guji-法藏-event-commentary
  - key: closure
    name: 归宗法界无差别义
    labels:
      zh:
      - 因果一味
      - 理事交彻
    start_date: '0700'
    highlight_event_id: guji-法藏-event-commentary
  decisions:
  - date: 0685
    title_zh: 以如来藏缘起为第四宗摄此论
    rationale: 为简小别权标玄奥明理彻事事彻理空有俱融故舍前三宗归此实教
  - date: 0695
    title_zh: 断定性二乘入灭实为变易终当发心
    rationale: 为破灰断永灭之见引法华胜鬘楞伽密严等证明唯有一乘无余涅槃故一切机皆此所为
- id: guji-法藏-endeavor-2
  title_zh: 预译提云般若译场并疏解法界无差别论
  summary_zh: 垂拱年间蒙召入魏国东寺译场与慧智法华复礼圆测等共译华严诸分及法界无差别论复作疏并序立十门随文解释
  phases:
  - key: brewing
    name: 蒙召入内供养观化
    labels:
      zh:
      - 魏国东寺
      - 十人译场
    start_date: 0687
    highlight_event_id: guji-法藏-event-translation
  - key: breakthrough
    name: 先译华严兼得宝聚
    labels:
      zh:
      - 华严境界分
      - 修慈分陀罗尼
    start_date: 0689
    highlight_event_id: guji-法藏-event-translation
  - key: climax
    name: 翻译法界无差别论一卷
    labels:
      zh:
      - 译语笔授缀文证义
      - 坚慧造论天慧译传
    start_date: 0692
    highlight_event_id: guji-法藏-event-translation
  - key: closure
    name: 造疏并序立十门解义
    labels:
      zh:
      - 教起藏摄分齐被机
      - 教体宗趣题名缘起
    start_date: 0695
    highlight_event_id: guji-法藏-event-commentary
  decisions:
  - date: 0689
    title_zh: 猥预译场先观华严后翻此论
    rationale: 为助佛扬化光辉佛日令末世钝根于深经开悟及令守权者归实故以不敏从命
  - date: 0695
    title_zh: 以十门释论十二门显菩提心
    rationale: 为略摄如来广大甚深义令易入明果因自性异名无差别等次第相生故标宗致敬开宗演释
events:
- id: guji-法藏-event-birth
  date: '0643'
  year_of: 643
  title_zh: 诞生于长安康居之后
  description: 唐贞观十七年生于长安聪睿逸群备穷俗典后出家学道综练大小乘教行菩萨道
- id: guji-法藏-event-translation
  date: 0689
  year_of: 689
  title_zh: 预于阗提云般若译场于魏国东寺
  description: 垂拱年间提云般若赍梵本至神都安置魏国东寺与大德十人共译华严诸分及法界无差别论慧智译语法华笔授复礼缀文圆测等证义
- id: guji-法藏-event-commentary
  date: 0695
  year_of: 695
  title_zh: 撰大乘法界无差别论疏并序
  description: 自号魏国西寺沙门立教起所因藏所摄教分齐被机教体宗趣题目缘起传译由致十门以菩提心涅槃界为因果判归如来藏缘起宗随文释十二门义
- id: guji-法藏-event-death
  date: '0712'
  year_of: 712
  title_zh: 圆寂于长安
  description: 唐先天元年示寂世寿七十弘华严一乘为贤首宗祖后世尊为华严三祖康居国师之号永传
