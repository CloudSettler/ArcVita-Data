  dilemmas:
  - 守权教者执三乘差别定性二乘不作佛如何显一乘实教令舍权归实
  - 法界理事染净因果差别与无差别之 tension 如何以缘起交彻双离空有两边
  - 音声名句孰为教体心境理事如何混融无碍而成说法
  lesson: 法界本无差别理事交彻因果平等唯以一乘菩提心契无二法身
  summary_first_person: 吾魏国西寺沙门法藏详性海虚凝寂门圆应以法界无差别缘起为宗判四宗教摄助佛扬化为钝根开权显实令一切含识信如来藏起菩提心归于最寂涅槃
