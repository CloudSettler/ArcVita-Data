person:
  qid: guji-法藏
  name_zh: 法藏
  names:
    zh: 法藏
    en: Fazang
  lifespan:
    birth:
      date: '0643'
      precision: year
      is_circa: false
      raw: 唐贞观十七年
    death:
      date: '0712'
      precision: year
      is_circa: false
      raw: 唐先天元年十一月
  birth_date: '0643'
  death_date: '0712'
  era: 唐
  reign_ref: 贞观至先天
  archetype: 华严义解高僧
  dilemmas:
  - 融会法相唯识与如来藏缘起时如何立真妄和合而不失中道
  - 面对帝王崇信与宗派纷争时如何护持正法久住
  lesson: 以一心二门统摄染净，以不变随缘会通真俗，学术当广大包容而归于实修证入
  summary_first_person: 我是法藏，唐京兆长安人，师事智俨，弘传华严，糅合法相与如来藏，造起信论义记，开如来藏缘起宗，愿令未信者生信，已信者增进，以一心开显大乘正义
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AE%BA%E7%96%8F%E9%83%A8/%E5%A4%A7%E4%B9%98%E8%B5%B7%E4%BF%A1%E8%AE%BA%E4%B9%89%E8%AE%B0.html
  - https://zh.wikisource.org/wiki/%E5%A4%A7%E4%B9%98%E8%B5%B7%E4%BF%A1%E8%AB%96%E7%BE%A9%E8%A8%98
endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 承继智俨弘传华严
  summary: 师事至相智俨，讲华严经，佐则天译经，立贤首宗规模
  phases:
  - key: brewing
    name: 少年慕道参学
    labels:
      zh: 参学
    start_date: 0658
    highlight_event_id: guji-法藏-event-xuehuayan
  - key: breakthrough
    name: 承嗣华严讲席
    labels:
      zh: 立宗
    start_date: 0668
    highlight_event_id: guji-法藏-event-jiangjing
  - key: climax
    name: 御前讲经显名
    labels:
      zh: 弘法
    start_date: 0690
    highlight_event_id: guji-法藏-event-yujiang
  - key: closure
    name: 著疏定宗归寂
    labels:
      zh: 圆成
    start_date: '0710'
    highlight_event_id: guji-法藏-event-death
  decisions:
  - date: '0660'
    title_zh: 弃俗从智俨学华严
    rationale: 仰华严境界广大无碍，愿以一乘普被群机，故专宗华严而兼摄诸乘
  - date: 0690
    title_zh: 应武后诏参与译场讲席
    rationale: 藉王力弘法可令华严广布天下，报佛恩护正法，故不辞荣宠而以弘传为务
- id: guji-法藏-endeavor-2
  title_zh: 造起信论义记开如来藏缘起
  summary: 依马鸣起信论立一心二门三大，判四宗，会法相与真空，成缘起融通之说
  phases:
  - key: brewing
    name: 研核深密中观诸教
    labels:
      zh: 判教
    start_date: 0680
    highlight_event_id: guji-法藏-event-jiangjing
  - key: breakthrough
    name: 标举一心二门纲要
    labels:
      zh: 立义
    start_date: 0695
    highlight_event_id: guji-法藏-event-zhuyiji
  - key: climax
    name: 义记成示理事无碍
    labels:
      zh: 造疏
    start_date: '0700'
    highlight_event_id: guji-法藏-event-zhuyiji
  - key: closure
    name: 付嘱后学令久住世
    labels:
      zh: 付嘱
    start_date: '0711'
    highlight_event_id: guji-法藏-event-death
  decisions:
  - date: '0700'
    title_zh: 以如来藏缘起判为第四宗
    rationale: 见法相唯识偏于事相，真空偏于理空，唯如来藏随缘能融理事，故立理事融通以显大乘究竟
  - date: '0705'
    title_zh: 开十门释教起因缘被机教体
    rationale: 为令中下之流因文悟入，须广明藏摄分齐被机体性，故繁征博引以显起信正义
events:
- id: guji-法藏-event-birth
  date: '0643'
  year_of: 643
  type: birth
  title_zh: 法藏出生于长安
  description: 唐贞观十七年出生于京兆长安康姓之家，少年慕法舍俗
- id: guji-法藏-event-xuehuayan
  date: 0658
  year_of: 658
  type: career
  title_zh: 师事智俨学华严
  description: 依云华寺智俨研习华严经，深契华严法界缘起之旨，得其付嘱
- id: guji-法藏-event-jiangjing
  date: 0685
  year_of: 685
  type: career
  title_zh: 弘讲华严参与译经
  description: 武周时期奉诏讲华严新经，参与译场，以华严金狮子喻开悟武后，名振朝野
- id: guji-法藏-event-zhuyiji
  date: '0700'
  year_of: 700
  type: career
  title_zh: 造大乘起信论义记
  description: 造大乘起信论义记上下卷，开十门分别教起藏摄分齐被机体性，立如来藏缘起宗义
- id: guji-法藏-event-yujiang
  date: 0708
  year_of: 708
  type: career
  title_zh: 晚年讲席授徒
  description: 居长安大荐福寺讲授华严及起信，门下慧苑宏观等承其学，华严宗风大盛
- id: guji-法藏-event-death
  date: '0712'
  year_of: 712
  type: death
  title_zh: 圆寂于长安
  description: 唐先天元年十一月圆寂于长安大荐福寺，世寿七十，谥号国一法师，塔于神禾原
