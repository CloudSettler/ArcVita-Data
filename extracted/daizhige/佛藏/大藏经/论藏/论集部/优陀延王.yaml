  summary_first_person: 我是优陀延，绍父王位居拘舍弥，文武才伎兼备，国富民殷，曾以王威为乐，后遇旧友宾头卢说法，方知五欲如幻王位无常，遂悲喜交集五体投地忏悔
  source_urls:
