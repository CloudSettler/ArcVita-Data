  decisions:
  - date: 1272
    title_zh: 以五法总摄一切所知而造论
    rationale: 器情道果并无为略摄为五，令初学易持，久修可究竟三乘义理。
  - date: 1276
    title_zh: 命沙罗巴译汉并许廉复作序
    rationale: 默译汉文见传于世，使如来之事皎如日月广于天地，利益汉地群生。
events:
- id: guji-发合思巴-event-birth
  type: birth
  date: 1235
  year_of: 1235
  title_zh: 诞生于吐蕃萨迦
  description: 1235年生于萨迦昆氏，自幼聪慧，通三藏显密，为萨迦班智达之侄。
- id: guji-发合思巴-event-meet
  type: career
  date: 1253
  year_of: 1253
  title_zh: 凉州会见忽必烈授法
  description: 随萨迦班智达至凉州，会裕皇潜邸，为说佛法，受请授戒灌顶，深结法缘。
- id: guji-发合思巴-event-preceptor
  type: career
  date: 1260
  year_of: 1260
  title_zh: 被尊为帝师总领释教
  description: 世祖即位，尊为国师后晋帝师，授玉印，总制天下释教，弘扬帝绪，大播宗风。
- id: guji-发合思巴-event-compose
  type: career
  date: 1273
  year_of: 1273
  title_zh: 造彰所知论阐明五聚
  description: 造彰所知论，分器世界情世界等五品，广说须弥四洲欲色无色及六趣因果，由沙罗巴译为汉文。
- id: guji-发合思巴-event-death
  type: death
  date: 1280-12-15
  year_of: 1280
  title_zh: 圆寂于萨迦寺
  description: 至元十七年冬圆寂于萨迦，世寿四十六，一生弘传正法，遗论流通中土西蕃。
