    title_zh: 应请赴凉州授法于忽必烈
    rationale: 以慈悲摄受王室，令大事因缘先结帝绪，为后弘创造缘起。
  - date: 1260
    title_zh: 受任帝师总领天下释教
    rationale: 以出世正传匡持世法，使三界苦恼群生皆得闻法调伏。
