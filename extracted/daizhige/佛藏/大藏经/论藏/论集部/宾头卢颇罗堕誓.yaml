  summary_first_person: 吾名宾头卢，姓颇罗堕誓，本佛弟子，因于树提长者前现神足取钵，受佛摈斥不听涅槃，奉敕为末法四部作福田，凡设会立舍备浴至心请者，吾必随处现僧形赴之，以华萎不萎验其信否，愿长住世间令众生植福解脱
