person:
  qid: guji-提婆
  name_zh: 提婆
  names:
    zh: 提婆菩萨
    en: Aryadeva
  lifespan:
    birth:
      date: '0170-01-01'
      precision: year
      is_circa: true
      raw: 约公元一百七十年生于南印度
    death:
      date: '0270-01-01'
      precision: year
      is_circa: true
      raw: 约公元二百七十年示寂
  birth_date: '0170-01-01'
  death_date: '0270-01-01'
  era: 古印度贵霜王朝时当中国东汉末至三国
  reign_ref: 东汉末至曹魏之际
  archetype: 破邪显正型大乘论师
  dilemmas:
  - title_zh: 直破外道涅槃邪执还是但显自宗正义
    description: 若但显正义则邪见不除，故须历破二十种外道小乘涅槃，以遮邪而显缘起性空正义
  - title_zh: 随世俗立名还是执一法为常实
    description: 方风梵天自在时水虚空等皆是虚妄分别，若执为常为实则堕六道，故须观无常无我以求真涅槃
  lesson: 不执一物一方为常实，唯以缘起正见破邪显正方得真涅槃
  summary_first_person: 我是提婆，龙树之徒，我释楞伽经义，历破二十种外道小乘所执涅槃，遮其以方风梵天微尘自性时水虚空等为常实之倒见，显佛说涅槃因果正义，愿众生不堕断常，得入正法
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T1640
  - https://daizhige.org/佛藏/大藏经/论藏/论集部/提婆菩萨释楞伽经中外道小乘涅槃论.html
endeavors:
- id: guji-提婆-endeavor-1
  title_zh: 释楞伽经破二十种外道小乘涅槃邪见
  summary: 依楞伽经正义，次第问答，破方风梵天等二十家执常实为涅槃因之邪论，立如来涅槃因果正义
  phases:
  - key: brewing
    name: 研楞伽集邪见
    labels:
      zh:
      - 楞伽经
      - 涅槃正义
      - 集邪见
    start_date: '0220-01-01'
    highlight_event_id: guji-提婆-event-2
  - key: breakthrough
    name: 立问答破受阴尽等初执
    labels:
      zh:
      - 问答立破
      - 小乘方风
    start_date: '0230-01-01'
    highlight_event_id: guji-提婆-event-2
  - key: climax
    name: 广破梵天自在自性时水等
    labels:
      zh:
      - 广破二十家
      - 显非常非断
    start_date: '0235-01-01'
    highlight_event_id: guji-提婆-event-2
  - key: closure
    name: 结成涅槃论流通后世
    labels:
      zh:
      - 结集成本
      - 付译弘传
    start_date: '0240-01-01'
    highlight_event_id: guji-提婆-event-2
  decisions:
  - date: '0230-01-01'
    title_zh: 以问答体逐一揭名破执
    rationale: 外道各执一法为常为涅槃因，须指名其师其说，方能遮其虚妄分别，不令混滥正法
  - date: '0235-01-01'
    title_zh: 以无常无我缘起破常实因
    rationale: 方风微尘自性时空等若是常则不能生灭变化，若能生灭则非常，故皆非涅槃真因
- id: guji-提婆-endeavor-2
  title_zh: 承龙树中观造论弘法摧破外道
  summary: 师事龙树，弘性空缘起，造百论四百论等，以中观正见摧外道小乘偏执，护持大乘正法
  phases:
  - key: brewing
    name: 南印度出家学道
    labels:
      zh:
      - 南印度
      - 出家求法
    start_date: '0185-01-01'
    highlight_event_id: guji-提婆-event-1
  - key: breakthrough
    name: 师事龙树得中观要
    labels:
      zh:
      - 师事龙树
      - 中观性空
    start_date: '0200-01-01'
    highlight_event_id: guji-提婆-event-1
  - key: climax
    name: 造论论辩摧破外道
    labels:
      zh:
      - 造论
      - 论辩摧邪
    start_date: '0215-01-01'
    highlight_event_id: guji-提婆-event-3
  - key: closure
    name: 付法后学示寂护法
    labels:
      zh:
      - 付法
      - 护法示寂
    start_date: '0260-01-01'
    highlight_event_id: guji-提婆-event-death
  decisions:
  - date: '0200-01-01'
    title_zh: 依止龙树学缘起性空
    rationale: 欲破外道小乘实有常住之倒见，须先得中观正见，以空有不二为宗本
  - date: '0215-01-01'
    title_zh: 以造论论辩代替徒斗
    rationale: 外道以咒术辩论惑众，唯以正理造论立破，方能令众生信解正法而舍邪归正
events:
- id: guji-提婆-event-birth
  title_zh: 生于南印度婆罗门家
  date: '0170-01-01'
  year_of: 170
  kind: birth
  description: 约公元二世纪后半，生于南印度，天资颖悟，博学外道典籍，后归佛法
- id: guji-提婆-event-1
  title_zh: 师事龙树弘传中观
  date: '0200-01-01'
  year_of: 200
  kind: career
  description: 往南印度从龙树菩萨出家受学，深悟缘起性空，成为龙树嫡传，弘扬大乘中观
- id: guji-提婆-event-2
  title_zh: 释楞伽破二十种涅槃邪见
  date: '0230-01-01'
  year_of: 230
  kind: career
  description: 依楞伽经义作论，以问答体次第破小乘方风围陀伊赊那裸形毗世苦行等乃至安荼二十家执常法为涅槃因之邪说，显如来正义，后魏菩提流支译传中国
- id: guji-提婆-event-3
  title_zh: 造百论四百论摧破外道
  date: '0245-01-01'
  year_of: 245
  kind: career
  description: 广造百论四百论等，以中观正理破数论胜论裸形尼犍等外道及小乘偏空，护持大乘，名震五天
- id: guji-提婆-event-death
  title_zh: 南印度示寂入灭
  date: '0270-01-01'
  year_of: 270
  kind: death
  description: 化缘既毕，于南印度示寂，付法后学，其破邪显正之论永传于世
