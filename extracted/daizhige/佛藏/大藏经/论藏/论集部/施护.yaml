    title_zh: 略释诸大乘相从菩提心出生大悲
    rationale: 欲令学者了知一切法即蕴处界等皆无我真如，以大悲相应而趣佛果
  - date: 1001-01-01
    title_zh: 具译十八空三十七道品十力不共法等
    rationale: 恐后学偏执一法，故遍集空圣谛静虑解脱陀罗尼等，示平等无相一境
