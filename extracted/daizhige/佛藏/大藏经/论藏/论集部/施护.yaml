    title_zh: 以菩提慈心为先广译三乘
    rationale: 以慈悲摄受众生，抉择梵汉文义，使施戒忍进定慧等波罗蜜多普沾中土
- id: guji-施护-endeavor-2
  title_zh: 汉译集大乘相论集诸法相
  summary_zh: 奉诏译觉吉祥智菩萨所造集大乘相论上下两卷，略释蕴处界缘生波罗蜜多地空菩提分圣谛静虑无量无色解脱三摩钵底解脱门神通陀罗尼力无畏无碍慈悲不共法声闻果真如实际无相法界等，示一切法无我
