endeavors:
- id: guji-法护-endeavor-1
  title_zh: 赴宋入译场奉诏译经
  description: 自西天来华入汴京译经院，充传梵大师，协同法贤施护等从事梵汉对译
  phases:
  - key: brewing
    name: 西天习学蕴育东行之志
    labels:
      zh: 西天究学
    start_date: 0970-01-01
    highlight_event_id: guji-法护-event-birth
  - key: breakthrough
    name: 抵汴授职入译经院
    labels:
      zh: 抵宋授职
    start_date: 0980-06-01
    highlight_event_id: guji-法护-event-arrive
  - key: climax
    name: 奉诏传梵参译众经
    labels:
      zh: 奉诏传译
    start_date: 0983-01-01
    highlight_event_id: guji-法护-event-translate-baoyaoyi
  - key: closure
    name: 译业垂成名列三藏
    labels:
      zh: 位列三藏
    start_date: 0990-01-01
    highlight_event_id: guji-法护-event-translate-baoyaoyi
  decisions:
  - date: 0980-06-01
    title_zh: 决意东来赴宋应诏
    rationale: 为使正法东传三宝不断，不辞远涉入华参预译场
  - date: 0983-01-01
    title_zh: 以音义兼顾方式传译
    rationale: 梵义幽深恐失真，亦虑华人不解，故参酌直译意译以利信受
- id: guji-法护-endeavor-2
  title_zh: 宣演大乘宝要弘扬菩提大悲
  description: 依大乘宝要义论阐明人身难得值佛甚难，劝发菩提心以大悲为先导，修六度四摄利乐有情
  phases:
  - key: brewing
    name: 集诸经论考值佛人身之难
    labels:
      zh: 集经立义
    start_date: 0982-01-01
    highlight_event_id: guji-法护-event-translate-baoyaoyi
  - key: breakthrough
    name: 译出宝要义论卷上明信与发心
    labels:
      zh: 译弘发心
    start_date: 0983-01-01
    highlight_event_id: guji-法护-event-translate-baoyaoyi
  - key: climax
    name: 译出卷下明大悲十法与菩提功德
    labels:
      zh: 弘阐大悲
    start_date: 0984-01-01
    highlight_event_id: guji-法护-event-preach-compassion
  - key: closure
    name: 流通要义付嘱后学
    labels:
      zh: 流通付嘱
    start_date: 0985-01-01
    highlight_event_id: guji-法护-event-preach-compassion
  decisions:
  - date: 0983-06-01
    title_zh: 以菩提心为宗立论纲领
    rationale: 见众生耽著生死不知人身难得，故先明信力次劝发心以摄众机
  - date: 0984-03-01
    title_zh: 以大悲十法摄化为行门
    rationale: 欲令发心不退须有实行，故举布施持戒忍辱等十法成就大悲之身
events:
- id: guji-法护-event-birth
  title_zh: 生于西天
  date: 0940-01-01
  year_of: 940
  kind: birth
  description: 约北宋初生于西天，幼习梵典，通三藏，久修大乘法义
- id: guji-法护-event-arrive
  title_zh: 抵汴京入西天译经院
  date: 0980-06-01
  year_of: 980
  kind: career
  description: 太平兴国年间抵汴京，授传梵大师赐紫沙门，奉诏与法天法贤等共任译事
- id: guji-法护-event-translate-baoyaoyi
  title_zh: 奉诏译出大乘宝要义论
  date: 0983-01-01
  year_of: 983
  kind: career
  description: 奉诏译大乘宝要义论上下二卷，明人身难得八难时分和合，十种功德得清净人身，信力发心回向一切智
- id: guji-法护-event-preach-compassion
  title_zh: 阐扬大悲先导十法利生
  date: 0984-03-01
  year_of: 984
  kind: career
  description: 依宝云经等宣说大悲所成之身十法，劝菩萨于贪恚痴慢诸病如应说法，令众生离恶趣入菩提
- id: guji-法护-event-death
  title_zh: 圆寂于汴京
  date: 1017-12-01
  year_of: 1017
  kind: death
  description: 真宗天禧年间圆寂于汴京译场，译本流通后世，列入大藏论集部
