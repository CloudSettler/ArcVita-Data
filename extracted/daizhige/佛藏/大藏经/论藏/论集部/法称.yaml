  decisions:
  - date: 0648-01-01
    title_zh: 决定以宿业释四姓平等
    rationale: 胎生皆从秽处而生血肉诸根同类无异四姓差别唯过去宿业假立非天口生定
  - date: 0650-01-01
    title_zh: 决定以五相判真伪不以族姓判
    rationale: 具忍辱精进静虑般若离杀离贪离染悲愍有情者即真婆罗门阙者即首陀旃陀罗具亦名婆罗门
