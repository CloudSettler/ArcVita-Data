    highlight_event_id: guji-法称-event-zhize
  decisions:
  - date: 0640-01-01
    title_zh: 决定以父子异姓证种姓间杂
    rationale: 那洛乞叉生兵誐罗仙布沙野左生娇尸迦等父子名姓各别故知血统本杂非最上无杂
  - date: 0642-01-01
    title_zh: 决定引鹿胎鱼女旃陀罗生仙证道不由姓
    rationale: 迦痴那生于鹿胎嚩娑生于采鱼女尾湿嚩弥怛噜生于旃陀罗家皆苦行成仙故知得仙在修不在生
- id: guji-法称-endeavor-2
  person_id: guji-法称
  title_zh: 立真婆罗门以五相德行为本
  summary: 借吠娑波洒对喻地瑟致啰王说立忍辱等德及五相为真婆罗门相显戒德代血统
  phases:
