      - 引史证杂
    start_date: 0640-01-01
    highlight_event_id: guji-法称-event-zhize
  - key: climax
    name: 引下姓成仙
    labels:
      zh:
      - 立量
      - 现量遮破
    start_date: 0642-01-01
    highlight_event_id: guji-法称-event-zhize
  - key: closure
    name: 结非姓得名
    labels:
      zh:
      - 总结
      - 针破邪网
