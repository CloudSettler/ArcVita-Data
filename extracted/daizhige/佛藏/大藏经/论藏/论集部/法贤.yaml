person:
  qid: guji-法贤
  name_zh: 法贤
  names:
    zh: 法贤
    en: Dharmabhadra
  lifespan:
    birth:
      date: 0950
      precision: year
      is_circa: true
      raw: 约宋初生于西天
    death:
      date: '1001'
      precision: year
      is_circa: false
      raw: 咸平四年卒于东京
  birth_date: 0950
  death_date: '1001'
  era: 北宋
  reign_ref: 宋太祖至宋真宗
  archetype: 译经弘法者
  dilemmas:
  - 梵呗音义难双全，直译存真与意译易晓之间如何取舍
  - 身为西来梵僧，依朝廷译场体制与守师承本义之间如何自处
  lesson: 以信达传梵意，以敬心系圣迹，虽片赞而能令八塔长存人心
  summary_first_person: 吾本西天人，涉海而来，蒙宋圣恩入译场，赐名法贤，授朝散试光禄明教大师，毕生所愿，惟将西天经呗译为华言，此八大灵塔梵赞系戒日王所制，吾奉诏庄重出之，愿见闻者如亲礼八塔
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/
  - https://daizhige.org/
endeavors:
- id: guji-法贤-endeavor-1
  title_zh: 奉诏入宋译场广译显密
  summary_zh: 自西天至东京，入译经院，与法天施护等共参，历太祖太宗真宗三朝，官至朝散大夫试光禄卿，译出大乘庄严宝王等经数十部
  phases:
  - key: brewing
    name: 西来发足
    labels:
      zh:
      - 初发西天
    start_date: 0976
    highlight_event_id: guji-法贤-event-arrive
  - key: breakthrough
    name: 入院得官
    labels:
      zh:
      - 奉诏入译场
    start_date: 0980
    highlight_event_id: guji-法贤-event-arrive
  - key: climax
    name: 广译群经
    labels:
      zh:
      - 显密兼弘
    start_date: 0983
    highlight_event_id: guji-法贤-event-fanyizan
  - key: closure
    name: 示寂留名
    labels:
      zh:
      - 谥号明教
    start_date: '1001'
    highlight_event_id: guji-法贤-event-death
  decisions:
  - date: 0980
    title_zh: 应诏入译经院
    rationale: 欲借朝廷之力广传佛法，虽拘体制而弘传更远，故欣然就馆
  - date: 0983
    title_zh: 坚持梵汉对勘详定
    rationale: 恐华言失梵本精义，故每卷必反复雠校，宁缓出而不草率
- id: guji-法贤-endeavor-2
  title_zh: 传译戒日王八大灵塔梵赞
  summary_zh: 得西天戒日王所制八塔赞梵本，考定蓝毗尼等八处圣迹，译为华言赞文四十句，进呈流通，令华人知礼塔功德
  phases:
  - key: brewing
    name: 获戒日王赞本
    labels:
      zh:
      - 访得梵本
    start_date: 0985
    highlight_event_id: guji-法贤-event-fanyizan
  - key: breakthrough
    name: 考定八塔圣迹
    labels:
      zh:
      - 圣迹考订
    start_date: 0988
    highlight_event_id: guji-法贤-event-fanyizan
  - key: climax
    name: 奉诏出译
    labels:
      zh:
      - 梵赞华译
    start_date: 0991
    highlight_event_id: guji-法贤-event-fanyizan
  - key: closure
    name: 进呈流通
    labels:
      zh:
      - 流通瞻礼
    start_date: 0995
    highlight_event_id: guji-法贤-event-fanyizan
  decisions:
  - date: 0988
    title_zh: 存梵音兼注华义
    rationale: 赞呗贵在口诵，故存转读之音，又附圣迹本事，令诵解双入
  - date: 0991
    title_zh: 以四十句定赞体进呈
    rationale: 依梵本句数不增减，以全戒日王敬塔本怀，虽艰涩而不妄饰
events:
- id: guji-法贤-event-birth
  title_zh: 生于西天
  date: 0950
  year_of: 950
  place_zh: 天竺那烂陀一带
  description_zh: 传云生于西天，少习声明经呗，长游学那烂陀，精梵典塔史
- id: guji-法贤-event-arrive
  title_zh: 至东京入译经院
  date: 0980
  year_of: 980
  place_zh: 东京译经院
  description_zh: 开宝太平兴国间至阙，太祖太宗引入译场，赐名法贤，授官赐紫，与施护法天同参译事
- id: guji-法贤-event-fanyizan
  title_zh: 奉诏译八大灵塔梵赞
  date: 0991
  year_of: 991
  place_zh: 东京译经院
  description_zh: 奉诏将西天戒日王所制八大灵塔梵赞出为华言，明八塔所表诞生成道涅槃等圣迹，凡四十句，署明教大师臣法贤奉诏译
- id: guji-法贤-event-death
  title_zh: 卒于东京谥明教大师
  date: '1001'
  year_of: 1001
  place_zh: 东京
  description_zh: 咸平四年示寂，朝廷追谥明教大师，所译经赞并入藏流通
