  name_zh: 玄奘
  names:
    zh: 玄奘
    en: Xuanzang
  lifespan:
    birth:
      date: '0602'
      precision: year
      is_circa: false
      raw: 隋仁寿二年生于洛州缑氏
    death:
      date: 0664-02-05
      precision: day
      is_circa: false
      raw: 麟德元年二月初五圆寂于长安玉华宫
  birth_date: '0602'
  death_date: 0664-02-05
  era: 唐初
  reign_ref: 唐太宗贞观
  archetype: 西行求法译师
  dilemmas:
  - 安坐中土讲经受供与冒死西行求取真经之抉择
  - 恪守旧译与依据梵本重译正名之抉择
  - 隐居修持与奉诏译经开悟群生之抉择
  lesson: 为求真实义不惜身命，为持正理不厌繁难，简持能立能破以显中道
  summary_first_person: 吾姓陈名祎，洛州缑氏人，幼丧亲而志慕出家，见中土经论分歧无所折衷，遂冒禁西行万里求法，遍历天竺学于戒贤，归而奉诏译经，造大慈恩寺译场，译出因明正理门论本等六百余部，以正立破之法简持真实，愿后学不堕戏论得见圣教本怀
  source_urls:
  - https://daizhige.org/佛藏/大藏经/论藏/论集部/因明正理门论本.html
endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法
  summary: 贞观初年冒禁出关，历西域至天竺那烂陀寺从戒贤学法，遍礼圣迹搜求梵本而东归
  phases:
  - key: brewing
    name: 洛阳出家博览经论
    labels:
      zh: 出家求学
    start_date: '0613'
    highlight_event_id: guji-玄奘-event-birth
  - key: breakthrough
    name: 冒禁出关西行
    labels:
      zh: 西行发愿
    start_date: 0627-08-01
    highlight_event_id: guji-玄奘-event-xixing
  - key: climax
    name: 那烂陀从戒贤受学
    labels:
      zh: 天竺留学
    start_date: 0631-01-01
    highlight_event_id: guji-玄奘-event-nalanda
  - key: closure
    name: 负梵本东归长安
    labels:
      zh: 载誉东归
    start_date: 0645-01-01
    highlight_event_id: guji-玄奘-event-huiguo
  decisions:
  - date: 0627-08-01
    title_zh: 不顾禁令偷渡玉门关西行
    rationale: 中土众师各执一义无可折衷，唯亲往天竺取经问难方能决疑，故宁冒死罪而求真实
  - date: 0631-01-01
    title_zh: 师事那烂陀戒贤专学瑜伽唯识因明
    rationale: 欲穷经论大义须依胜师系统熏习，戒贤为当时具德三藏，故久住听学兼通大小乘
- id: guji-玄奘-endeavor-2
  title_zh: 奉诏译经弘法
  summary: 归国后居弘福大慈恩玉华等处设译场译经一千三百余卷，译出因明正理门论本以立论轨，并著西域记以纪见闻
  phases:
  - key: brewing
    name: 弘福寺开译场
    labels:
      zh: 开场译经
    start_date: 0645-02-01
    highlight_event_id: guji-玄奘-event-huiguo
  - key: breakthrough
    name: 大慈恩寺专弘新译
    labels:
      zh: 慈恩弘化
    start_date: 0648-01-01
    highlight_event_id: guji-玄奘-event-yijing
  - key: climax
    name: 奉诏译因明正理门论本
    labels:
      zh: 因明立宗
    start_date: 0653-01-01
    highlight_event_id: guji-玄奘-event-yinming
  - key: closure
    name: 玉华宫译毕示寂
    labels:
      zh: 译毕圆寂
    start_date: 0663-10-01
    highlight_event_id: guji-玄奘-event-death
  decisions:
  - date: 0645-02-01
    title_zh: 受太宗劝留京师主持译经而谢宰相之请
    rationale: 弘赞圣教利在群生胜于一身荣禄，以译场续佛慧命方报西行本愿，故辞官而就译席
  - date: 0653-01-01
    title_zh: 重译因明正理门论简持能立能破
    rationale: 旧译论式阙略难御外难，须依梵本具陈宗因喻三相及似过，以为欲简持真实者之轨范，故奉诏重宣
events:
