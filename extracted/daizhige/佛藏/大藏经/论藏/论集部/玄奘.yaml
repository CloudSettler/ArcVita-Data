  date: 0631-01-01
  year_of: 631
  summary: 住寺五年学瑜伽师地论显扬圣教论及因明诸论，尽得其传并受请讲经
- id: guji-玄奘-event-huiguo
  title_zh: 贞观十九年归抵长安
  date: 0645-01-25
  year_of: 645
  summary: 负梵本六百五十七部归国，太宗迎见于洛阳，敕住弘福寺翻译
- id: guji-玄奘-event-yijing
  title_zh: 大慈恩寺创译场大译群经
  date: 0648-01-01
  year_of: 648
  summary: 奉敕建大慈恩寺，系统译出瑜伽大般若等大部，并口授西域记
- id: guji-玄奘-event-yinming
  title_zh: 奉诏译因明正理门论本
  date: 0653-01-01
  year_of: 653
  summary: 译大域龙菩萨造因明正理门论本，明宗因喻三相及似能立能破，为中土因明之正轨
- id: guji-玄奘-event-death
  title_zh: 圆寂于玉华宫肃成院
  date: 0664-02-05
  year_of: 664
  summary: 译大般若经毕，趺坐而逝，敕葬白鹿原，高宗罢朝三日
