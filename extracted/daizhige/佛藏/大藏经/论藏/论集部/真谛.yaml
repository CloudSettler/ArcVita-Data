  era: 南北朝
  reign_ref: 梁武帝至陈文帝
  archetype: 西来译经三藏
  dilemmas:
  - title_zh: 战乱失恃而守译志
    description: 梁末侯景之乱，梁武帝崩，译场离散，欲归而不得，仍坚持译经讲学
  - title_zh: 梵汉义异而求真会通
    description: 印度阿毗昙世界观与中土见闻悬隔，如何以汉语文显立世缘起而不失本义
  lesson: 身处乱世而不废传灯，立世明界以显缘起，译语即是弘愿之行
  summary_first_person: 吾名真谛，西印度优禅尼人，怀梵本泛海东来，值梁陈鼎革战乱，栖广州豫章建康之间，译摄大乘及立世阿毗昙等部，唯愿以汉言显佛世界缘起，使后学知器界成坏因缘。
  source_urls:
  - https://daizhige.org/佛藏/大藏经/论藏/论集部/佛说立世阿毗昙论.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/论藏/论集部/佛说立世阿毗昙论.md
endeavors:
- id: guji-真谛-endeavor-1
  title_zh: 泛海东来南朝译经弘法
  description: 自扶南泛海至梁，历广州建康，经侯景之乱转避豫章南海，讲译不辍，开摄论学派
  phases:
  - key: brewing
    name: 西国学成怀经发愿
    labels:
      zh: 求法立愿
    start_date: 0499
    highlight_event_id: guji-真谛-event-birth
  - key: breakthrough
    name: 大同来华初至建康
    labels:
      zh: 初入梁土
    start_date: '0546'
    highlight_event_id: guji-真谛-event-arrive-liang
  - key: climax
    name: 乱中转徙讲译摄论
    labels:
      zh: 乱世传灯
    start_date: '0553'
    highlight_event_id: guji-真谛-event-preach-shelun
  - key: closure
    name: 陈代归寂译业成就
    labels:
      zh: 建康归寂
    start_date: 0569
    highlight_event_id: guji-真谛-event-death
  decisions:
  - date: '0546'
    title_zh: 应梁武帝请泛海东行
    rationale: 闻江南崇佛求梵典，愿以阿毗昙唯识之学流通东土，故携梵本登舟
  - date: '0550'
    title_zh: 侯景乱后不归坚持留华
    rationale: 海路阻绝归国无缘，念弘法本愿未竟，避地讲译以存法种
- id: guji-真谛-endeavor-2
  title_zh: 翻译佛说立世阿毗昙论
  description: 以汉文重显世界成坏、地动风轮、剡浮洲相及六大国因缘，立器世间缘起正见
  phases:
  - key: brewing
    name: 集梵本审立世义
    labels:
      zh: 审定梵本
    start_date: '0556'
    highlight_event_id: guji-真谛-event-arrive-liang
  - key: breakthrough
    name: 陈初开译界品地动品
    labels:
      zh: 开译立世
    start_date: 0558
    highlight_event_id: guji-真谛-event-translate-lishi
  - key: climax
    name: 详译洲国夜叉因缘
    labels:
      zh: 广明器界
    start_date: 0559
    highlight_event_id: guji-真谛-event-translate-lishi
  - key: closure
    name: 付嘱流通后学得知
    labels:
      zh: 流通后世
    start_date: '0560'
    highlight_event_id: guji-真谛-event-preach-shelun
  decisions:
  - date: 0558
    title_zh: 择立世阿毗昙先译世界品
    rationale: 中土于劫成坏、日月地动多惑于外道说，故先明风轮水轮地轮及地动二缘以正见闻
  - date: 0559
    title_zh: 存剡浮六国本事不删
    rationale: 树王果香、长胫取果、麦地六国等虽繁，足证业感缘起，故具译以令人信器界从业生
events:
- id: guji-真谛-event-birth
  title_zh: 诞生于西印度优禅尼国
  date: 0499
  year_of: 499
  description: 真谛生于优禅尼婆罗门族，少出家，博通三藏，尤精阿毗昙及唯识
- id: guji-真谛-event-arrive-liang
  title_zh: 梁大同中泛海至广州建康
  date: '0546-09-18'
  year_of: 546
  description: 携梵本二百四十箧自扶南至广州，梁武帝迎入建康，敕住宝云殿从事翻译
- id: guji-真谛-event-translate-lishi
  title_zh: 陈永定中译佛说立世阿毗昙论
  date: '0558-05-01'
  year_of: 558
  description: 于建康及广州译出立世阿毗昙论十卷，明地动二缘、风轮水轮、剡浮树王、六大国及夜叉神王归佛因缘
- id: guji-真谛-event-preach-shelun
  title_zh: 讲摄大乘论开摄论学派
  date: '0562-03-01'
  year_of: 562
  description: 于豫章广州讲摄大乘论、俱舍释论，门下慧恺等传习，奠定地论摄论之学
- id: guji-真谛-event-death
  title_zh: 陈太建元年寂于建康
  date: '0569-01-11'
  year_of: 569
  description: 真谛晚年欲西归不果，疾终于建康，年七十一，所译经论四十九部传于世
