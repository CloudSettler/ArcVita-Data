  dilemmas:
  - 师命口含水不得语与优婆塞求法之间当守护戒还是开解愚痴
  - 被众逐出之后当怀忧退转还是入山精进以自证释疑
  - 面对弥兰王善难当用王者骄语相争还是用智者正语相解
  lesson: 以智慧断爱欲以诚信去五恶以孝顺立三十七品以车聚喻明无我
  summary_first_person: 我前世为象王承事佛于校罗树间后生罽宾名那先年少随舅楼汉出家受具于和禅寺曾吐水为优婆塞说法同得须陀洹逐出后入山自证阿罗汉后赴舍竭与弥兰王论道以车喻明人身和合以三十七品明道本
