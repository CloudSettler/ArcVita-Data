endeavors:
- id: guji-那先-endeavor-1
  title_zh: 出家持戒自证阿罗汉
  summary: 随舅楼汉出家学经得禅吐水说法度人入山精进证阿罗汉游行教化
  phases:
  - key: brewing
    name: 随舅出家诵经得禅
    labels:
      zh:
      - 学经持戒
      - 亲近明师
    start_date: '-0133'
    highlight_event_id: guji-那先-event-ordination
  - key: breakthrough
    name: 吐水说法同得须陀洹
    labels:
      zh:
      - 开解度众
      - 初证圣果
    start_date: -0128
    highlight_event_id: guji-那先-event-preach
  - key: climax
    name: 被逐入山昼夜精进
    labels:
      zh:
      - 忍辱精进
      - 独处思道
    start_date: -0128
    highlight_event_id: guji-那先-event-arhat
  - key: closure
    name: 还寺忏悔游行教化
    labels:
      zh:
      - 证果弘化
      - 四辈敬仰
    start_date: '-0127'
    highlight_event_id: guji-那先-event-arhat
  decisions:
  - date: -0128
    title_zh: 吐水为优婆塞说法
    rationale: 宁犯师含水之约不忍失度人之机知其高才可得道故说布施持戒及无常苦无我深经
  - date: -0128
    title_zh: 被逐即入深山精进
    rationale: 自念不宜处众师子中有如狐狗发愿不得道不复入众坐故昼夜念道不受懈怠
- id: guji-那先-endeavor-2
  title_zh: 舍竭论道降伏弥兰王
  summary: 止泄坻迦寺应王请入宫以车喻明无我以诚信孝顺三十七品答难令王信伏
  phases:
  - key: brewing
    name: 止舍竭寺名彻四天
    labels:
      zh:
      - 安止弘经
      - 天人归敬
    start_date: '-0120'
    highlight_event_id: guji-那先-event-debate
  - key: breakthrough
    name: 入宫应供立智者约
    labels:
      zh:
      - 对机立约
      - 不用王者语
    start_date: '-0115'
    highlight_event_id: guji-那先-event-debate
  - key: climax
    name: 车聚喻破我见执
    labels:
      zh:
      - 无我空义
      - 譬喻善巧
    start_date: '-0115'
    highlight_event_id: guji-那先-event-debate
  - key: closure
    name: 说诚信孝顺三十七品
    labels:
      zh:
      - 显道次第
      - 王众信伏
    start_date: '-0114'
    highlight_event_id: guji-那先-event-debate
  decisions:
  - date: '-0115'
    title_zh: 约以智者语不用王者语
    rationale: 智者谈极相诘有胜有负能相开悟王者自恣强罚不能显正故请王如对沙门弟子而语勿怀恐怖
  - date: '-0115'
    title_zh: 以车喻答何所为那先
    rationale: 头目耳鼻色声苦乐身心皆不为那先离合皆不为那先如材木合聚得车名故合聚五事得人名以显无我
events:
- id: guji-那先-event-birth
  title_zh: 生于罽宾婆罗门家
  date: -0148
  year_of: -148
  place: 天竺罽宾县
  description: 前世象王寿终得为人作子生婆罗门家被袈裟俱生家象同日生因象名那父母字为那先
- id: guji-那先-event-ordination
  title_zh: 从舅楼汉出家受具
  date: '-0133'
  year_of: -133
  place: 罽宾及和禅寺
  description: 年十五六诣舅楼汉求作沙弥受十戒诵经得四禅年满二十诣和禅寺頞陂曰所得大戒
- id: guji-那先-event-preach
  title_zh: 为优婆塞说法同得须陀洹
  date: -0128
  year_of: -128
  place: 迦惟曰师檀越家
  description: 为师持应器取饭遇优婆塞求法吐口中水说布施持戒及无常苦空泥洹最乐双方同得须陀洹道
- id: guji-那先-event-arhat
  title_zh: 入山精进自证阿罗汉
  date: -0128
  year_of: -128
  place: 深山树下及和禅寺
  description: 被众逐出后入山昼夜精进得阿罗汉具六通还寺忏悔转行郡县教化多得道果天王帝释梵王皆来敬礼
- id: guji-那先-event-debate
  title_zh: 舍竭宫中与弥兰王论道
  date: '-0115'
  year_of: -115
  place: 舍竭国王宫殿上
  description: 与八十沙门入宫应供留十人共止于殿上当贵人妓女面论要义说出家本怀死后生不生智慧断爱及诚信孝顺三十七品以车喻显义王称善哉
- id: guji-那先-event-death
  title_zh: 止泄坻迦寺后示寂
  date: -0080
  year_of: -80
  place: 舍竭国泄坻迦寺
  description: 论道化王之后行化四方功成名著后示寂于所止寺中具体年代失载后人集其问答为那先比丘经
