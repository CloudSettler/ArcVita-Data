person:
  qid: guji-释迦牟尼
  name_zh: 释迦牟尼
  names:
    zh: 释迦牟尼
    en: Shakyamuni Buddha
  lifespan:
    birth:
      date: -563-04-08
      precision: day
      is_circa: true
      raw: 周昭王二十四年甲寅四月初八，示生清净圣王种
    death:
      date: -483-02-15
      precision: day
      is_circa: true
      raw: 拘尸那罗娑罗双树间入无余依涅槃
  birth_date: -563-04-08
  death_date: -483-02-15
  era: 春秋战国之际，古印度十六大国时代
  reign_ref: 周昭王二十四年至周敬王三十七年
  archetype: 大觉导师
  dilemmas:
  - 宫廷富贵安乐与睹生老病死而求解脱之择
  - 自证清凉寂灭与不舍众生广行悲愿之衡
  - 甚深缘起正法难宣与随宜设教普令得度之难
  lesson: 以大悲为本，以智慧为灯，弃高举而下心，历难行而圆德，转法轮而度众，证清凉而归寂
  summary_first_person: 我生于王宫富贵之中，见生老病死之苦而弃舍荣华，出家求道，战退魔军，证无上菩提，具十力四无畏，转正法轮，以一味法药治众生身心之病，普令离缠缚而趣清凉
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AE%BA%E9%9B%86%E9%83%A8/%E4%BD%9B%E5%90%89%E7%A5%A5%E5%BE%B7%E8%B5%9E.html
endeavors:
- id: guji-释迦牟尼-endeavor-1
  title_zh: 出家修行证无上觉
  summary_zh: 示生王宫，厌离五欲，弃国出家，三阿僧祇积集难行，菩提树下降魔成道，具三十二相十力四无畏，到清凉地
  phases:
  - key: brewing
    name: 宫中观苦厌离
    labels:
      zh: 厌离生死
    start_date: -548-01-01
    highlight_event_id: guji-释迦牟尼-event-birth
  - key: breakthrough
    name: 弃国出家苦行
    labels:
      zh: 出家求道
    start_date: -534-02-08
    highlight_event_id: guji-释迦牟尼-event-renunciation
  - key: climax
    name: 菩提树下降魔成道
    labels:
      zh: 正觉降魔
    start_date: -528-12-08
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: closure
    name: 具足功德安住清凉
    labels:
      zh: 圆满清凉
    start_date: -528-12-09
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  decisions:
  - date: -534-02-08
    title_zh: 弃舍王位出家
    rationale: 见生老病死忧悲恼苦，不忍众生轮回，为求出离解脱故舍富贵而出家
  - date: -528-12-01
    title_zh: 舍无益苦行取中道正觉
    rationale: 知枯竭爱源流不在身苦，调伏寂静方能发智慧光明，故坐菩提树下誓证菩提
- id: guji-释迦牟尼-endeavor-2
  title_zh: 转法轮广度天人
  summary_zh: 成道后应梵天劝请，鹿野苑初转法轮，竖法幢破我慢幢，以柔软爱语说法，示现不害出离涅槃之相，普摄一切众生
  phases:
  - key: brewing
    name: 梵天劝请住世
    labels:
      zh: 劝请说法
    start_date: -528-12-09
    highlight_event_id: guji-释迦牟尼-event-enlightenment
  - key: breakthrough
    name: 鹿野苑初转法轮
    labels:
      zh: 初转法轮
    start_date: -527-07-08
    highlight_event_id: guji-释迦牟尼-event-first-sermon
  - key: climax
    name: 广宣妙法普化三界
    labels:
      zh: 普化众生
    start_date: -527-08-01
    highlight_event_id: guji-释迦牟尼-event-first-sermon
  - key: closure
    name: 付授正法示现涅槃
    labels:
      zh: 付嘱涅槃
    start_date: -483-02-14
    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -528-12-09
    title_zh: 应请说法不住速灭
    rationale: 愍念众生愚迷贪欲海，以大悲普覆故，起为众生作不请友度脱之心
  - date: -527-07-08
    title_zh: 以一味法药随病授药
    rationale: 了知众生根性界趣种种信解烦恼无边，故以无量法门调伏，令各得安隐出离
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗尼示生王宫
  date: -563-04-08
  year_of: -563
  place_zh: 蓝毗尼园
  description_zh: 示生清净圣王种，具三十二相八十种好，梵王帝释咸恭敬，天人阿修罗供养
- id: guji-释迦牟尼-event-renunciation
  title_zh: 弃国出家
  date: -534-02-08
  year_of: -534
  place_zh: 王宫外林野
  description_zh: 见生死忧悲恼苦，弃舍广大富贵端严妙境，下心离高举，出家修梵行
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 菩提树下成正等觉
  date: -528-12-08
  year_of: -528
  place_zh: 菩提伽耶菩提树下
  description_zh: 战死魔军，摧魔力大象龙，断贪恚痴，证十力四无畏漏尽智，到最上清凉地，自觉觉他觉行圆
- id: guji-释迦牟尼-event-first-sermon
  title_zh: 鹿野苑初转法轮
  date: -527-07-08
  year_of: -527
  place_zh: 鹿野苑
  description_zh: 竖法幢转正法轮，以无害无绮出离涅槃之相说法，开示尽灭离贪寂灭出离道，普令得渡烦恼流
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那罗入涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那罗娑罗双树间
  description_zh: 所作已办，尽诸有结，付授诸法不秘惜，证无余依涅槃，为天人世间留下利乐法
