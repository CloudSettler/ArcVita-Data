endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 深观缘起开中观正见
  summary_zh: 破外道常断见及执相分别以五蕴如沫泡阳焰等喻显蕴处界无我唯心所现空智平等
  phases:
  - key: brewing
    name: 南印度出家习学
    labels:
      zh:
      - 习学三藏
      - 深思缘起
    start_date: '0165'
    highlight_event_id: guji-龙树-event-study
  - key: breakthrough
    name: 悟缘起性空破邪执
    labels:
      zh:
      - 破邪显正
      - 立中道义
    start_date: 0180
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: climax
    name: 造中论等弘传大乘
    labels:
      zh:
      - 造论弘法
      - 化导四众
    start_date: 0190
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: closure
    name: 以空摄悲导归菩提
    labels:
      zh:
      - 空悲圆融
      - 付嘱后学
    start_date: '0230'
    highlight_event_id: guji-龙树-event-bodhicitta-vivarana
  decisions:
  - date: 0180
    title_zh: 立八不缘起破生灭断常
    rationale: 若法有自性则不待缘今观众缘生即无生无自性故离断常以显中道
  - date: 0190
    title_zh: 以五蕴喻破我执取舍
    rationale: 色如聚沫受如浮泡等五蕴本空取舍不可得若空我相则心不生分别可安住空相
- id: guji-龙树-endeavor-2
  title_zh: 说离相菩提心行大悲愿
  summary_zh: 明菩提心离相如虚空无生无所得而以大悲为体不舍众生示现成佛度生令超三有海
  phases:
  - key: brewing
    name: 悲观六趣轮回苦
    labels:
      zh:
      - 观苦起悲
      - 立誓度生
    start_date: '0200'
    highlight_event_id: guji-龙树-event-study
  - key: breakthrough
    name: 了知菩提心离相空性
    labels:
      zh:
      - 离相见空
      - 心如虚空
    start_date: '0210'
    highlight_event_id: guji-龙树-event-bodhicitta-vivarana
  - key: climax
    name: 造菩提心离相论普劝发心
    labels:
      zh:
      - 造论劝发
      - 悲智双运
    start_date: '0220'
    highlight_event_id: guji-龙树-event-bodhicitta-vivarana
  - key: closure
    name: 回向福聚令佛种不断
    labels:
      zh:
      - 回向众生
      - 佛种不断
    start_date: '0240'
    highlight_event_id: guji-龙树-event-death
  decisions:
  - date: '0220'
    title_zh: 以空智摄大悲不著自利禅味
    rationale: 若著自利禅味则舍众生故过声闻地修利他行发大菩提生菩提芽求佛果
  - date: '0240'
    title_zh: 称赞回向劝学离相发心
    rationale: 一刹那观菩提心福不可量故以此福施众生普愿速超三有海令佛种不断
