  lesson: 以缘起性空破一切执，以慈悲方便劝善护世，空有不二即是中道。
  summary_first_person: 我是龙树，生于南天竺，少习婆罗门学，后皈依佛门，深悟缘起性空，造中论等广破邪见，又以偈劝诸王修十善六念行菩萨道，愿以正法利乐世间。
