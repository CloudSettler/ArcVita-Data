  era: 东汉至曹魏
  reign_ref: 南印度沙多婆诃王朝引正王时期
  archetype: 中观论师
  dilemmas:
  - 有无断常二边炽盛，如何以缘起性空抉择中道而不落邪见
  - 国王耽著欲乐放逸，如何以诗代书劝诫持戒修福而不逆其心
  - 生死轮回众苦无量，如何令在家人厌离三有而趣向涅槃解脱
  lesson: 依缘起见破邪执，以持戒少欲摄王心，悲智双运方成菩提
  summary_first_person: 吾龙树生于南印度，以大悲愍有情无知覆心，造中论等抉择缘起性空，又以诗代书寄与南印度亲友国王，劝其念佛法僧施戒天，常亲十善离酒行舍，修少欲知足厌轮回，趣证无生涅槃
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AE%BA%E9%9B%86%E9%83%A8/%E9%BE%99%E6%A0%91%E8%8F%A9%E8%90%A8%E5%8A%9D%E8%AF%AB%E7%8E%8B%E9%A2%82.html
