endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 创立中观缘起性空学
  summary_zh: 破外道小乘有无邪执，造中论等阐八不中道，开大乘空宗正见之源
  phases:
  - key: brewing
    name: 南印度出家求学
    labels:
      zh: 蓄势
    start_date: '0165'
    highlight_event_id: guji-龙树-event-study
  - key: breakthrough
    name: 造中论抉择缘起
    labels:
      zh: 突破
    start_date: 0180
    highlight_event_id: guji-龙树-event-madhyamaka
  - key: closure
    name: 广弘中观摄众归正
    labels:
      zh: 收束
    start_date: '0200'
    highlight_event_id: guji-龙树-event-madhyamaka
  decisions:
  - date: 0180
    title_zh: 以八不颂破生灭断常
    rationale: 由无知起业生十二因缘，见缘起即见法身，以止诤显中道
  - date: 0190
    title_zh: 不滞空寂而说大乘行愿
    rationale: 空不碍假名有，为令众生修施戒忍进定慧六度渡有海成佛
- id: guji-龙树-endeavor-2
  title_zh: 以诗代书劝诫国王修学
  summary_zh: 与南印度乘土国王为亲友，寄亲友书宝行王正论及劝诫王颂，教王持戒布施厌离生死
  phases:
  - key: brewing
    name: 与王结为亲友
    labels:
      zh: 蓄势
    start_date: 0195
    highlight_event_id: guji-龙树-event-befriend-king
  - key: climax
    name: 寄劝诫王颂明王道
    labels:
      zh: 高潮
    start_date: '0205'
    highlight_event_id: guji-龙树-event-admonish-king
  - key: closure
    name: 回向成佛广度天人
    labels:
      zh: 收束
    start_date: '0215'
    highlight_event_id: guji-龙树-event-admonish-king
  decisions:
  - date: '0205'
    title_zh: 以诗代书劝王念三宝十善
    rationale: 王虽先解如如教，更闻佛语增胜解，依正法说虽拙勿轻
  - date: '0205'
    title_zh: 示无常地狱劝厌离求涅槃
    rationale: 寿命如风吹水泡，地狱傍生饿鬼苦长，唯尸罗定慧能至无老死涅槃
events:
- id: guji-龙树-event-birth
  title_zh: 龙树诞生于南印度
  date: '0150'
  year_of: 150
  description: 约东汉桓帝时生于南印度婆罗门家，夙慧超群，后出家学佛
- id: guji-龙树-event-study
  title_zh: 南印度求学弘法
  date: '0165'
  year_of: 165
  description: 出家受戒广学三藏，通晓因明医方，志破邪见立正法幢
- id: guji-龙树-event-madhyamaka
  title_zh: 造中论等立中观宗
  date: 0180
  year_of: 180
  description: 造中论大智度论等，说明色非我无生由勤，以十二因缘八圣道开深妙缘起门
- id: guji-龙树-event-befriend-king
  title_zh: 与乘土国王结亲友
  date: 0195
  year_of: 195
  description: 与南印度乘土国王为亲友，往来书信劝修福德，令护持佛法僧众
- id: guji-龙树-event-admonish-king
  title_zh: 寄劝诫王颂教王修行
  date: '0205'
  year_of: 205
  description: 以诗代书寄劝诫王颂，教王念佛法僧施戒天，行十善八支圣戒，修慈悲喜舍七菩提分，厌轮回趣涅槃，回向为成佛广度天人
- id: guji-龙树-event-death
  title_zh: 龙树示寂
  date: '0250'
  year_of: 250
  description: 住世约百岁教化圆满示寂，后人尊为圣龙树觉情菩萨，唐义净于东印度重译其颂流通神州
