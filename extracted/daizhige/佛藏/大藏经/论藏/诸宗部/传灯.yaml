endeavors:
- id: guji-传灯-endeavor-1
  title_zh: 住锡幽溪高明寺中兴天台
  summary: 绍隆天台性具实教，化导四众，会禅教律而归一心三观，为后世复兴台宗之枢纽
  phases:
  - key: brewing
    name: 衢州出家初习教观
    labels:
      zh: 酝酿
    start_date: '1571'
    highlight_event_id: guji-传灯-event-birth
  - key: breakthrough
    name: 住幽溪阐性具三千
    labels:
      zh: 突破
    start_date: '1586'
    highlight_event_id: guji-传灯-event-1
  - key: climax
    name: 讲楞严圆觉化众广博
    labels:
      zh: 高潮
    start_date: '1600'
    highlight_event_id: guji-传灯-event-1
  - key: closure
    name: 示寂幽溪付嘱后学
    labels:
      zh: 收束
    start_date: '1628'
    highlight_event_id: guji-传灯-event-death
  decisions:
  - date: '1586'
    title_zh: 择幽溪高明寺为弘法道场
    rationale: 慕天台智者遗风，借幽静山寺专修专弘，使性具教观有所系属
  - date: '1600'
    title_zh: 以性具思想贯通禅教律
    rationale: 破门庭偏执，全性起修，使学者即事即理而不滞空有两边
- id: guji-传灯-endeavor-2
  title_zh: 撰净土生无生论立十门
  summary: 采华严楞严天台性具之旨，会通持名念佛与唯心净土，明生即无生之至道
  phases:
  - key: brewing
    name: 深究一真法界性具
    labels:
      zh: 酝酿
    start_date: '1600'
    highlight_event_id: guji-传灯-event-1
  - key: breakthrough
    name: 立十门阐生无生宗
    labels:
      zh: 突破
    start_date: '1615'
    highlight_event_id: guji-传灯-event-2
  - key: climax
    name: 明感应任运彼此恒一
    labels:
      zh: 高潮
    start_date: '1615'
    highlight_event_id: guji-传灯-event-2
  - key: closure
    name: 流通净土法门劝信愿行
    labels:
      zh: 收束
    start_date: '1628'
    highlight_event_id: guji-传灯-event-death
  decisions:
  - date: '1615'
    title_zh: 立十门总摄净土理事
    rationale: 由一真法界至现未互在，层层相即，使初机由事入理而不昧去来之相
  - date: '1615'
    title_zh: 以法界为念明持名即法界
    rationale: 显念佛一念全体是法界，使行者信愿持名之功不唐捐而直阶不退
events:
- id: guji-传灯-event-birth
  title_zh: 诞生于衢州邓氏
  date: '1554'
  year_of: 1554
  summary: 明嘉靖三十三年生于浙江衢州，俗姓邓，后出家，字无尽，号幽溪
- id: guji-传灯-event-1
  title_zh: 住锡幽溪高明寺弘天台
  date: '1586'
  year_of: 1586
  summary: 入住杭州高明寺幽溪，讲习天台止观，大弘性具三谛三观，中兴台宗
- id: guji-传灯-event-2
  title_zh: 撰净土生无生论
  date: '1615'
  year_of: 1615
  summary: 敬采经论秘密旨，立一真法界门乃至现未互在门十重，明西方依正即我一念心具心造
- id: guji-传灯-event-death
  title_zh: 示寂于幽溪
  date: '1628'
  year_of: 1628
  summary: 明崇祯元年示寂，世寿七十五，以弘护台宗教观及净土生无生之说化世
