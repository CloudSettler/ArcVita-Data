  - 生者决定有生与无生本自不生云何两全
  - 极乐去此十万亿土与介尔一心云何相即不隔
  - 称名事修与称性实理云何圆融而不偏废
  lesson: 全性起修，全修在性，生与无生两冥，方断疑生信而阶不退
  summary_first_person: 吾乃明代幽溪沙门传灯，稽首能仁与无量寿觉，敬采经论秘密旨，立一真法界等十门，阐明净土生无生，普使将来断疑生信，持名愿生而不乖实相
