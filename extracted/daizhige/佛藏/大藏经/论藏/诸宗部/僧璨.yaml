  decisions:
  - date: '0600'
    title_zh: 以韵铭体述禅心
    rationale: 铭体易诵易持摄多义于短章使学者绝言绝虑而无处不通
  - date: '0601'
    title_zh: 直指息见不求真
    rationale: 不用求真唯须息见遣有没有从空背空之病故立不二信心
