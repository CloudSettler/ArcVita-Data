    rationale: 不逐外缘唯问罪性以返照自心契入空性故得安心
  - date: 0580
    title_zh: 隐居山林守法脉
    rationale: 法难之后不宜显迹山居守一以全法脉待机而化
- id: guji-僧璨-endeavor-2
  title_zh: 作信心铭阐不二至道
  summary: 融般若中观与禅悟以五言韵语作信心铭明拣择为心病指归一心不生不二信心言语道断
