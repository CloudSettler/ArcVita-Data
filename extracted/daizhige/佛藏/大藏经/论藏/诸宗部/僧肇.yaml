  dilemmas:
  - 有无两见竞兴，真俗双谛难融
  - 名教自然相违，言说无言相碍
  lesson: 空不乖有，有不乖空，守真抱一，息妄归于离微
  summary_first_person: 吾少好老庄，博览文典，遇什师而折服，遂归命般若，助译关中，撰论显空有不二，愿学者无染外物，体离微而入真寂。
