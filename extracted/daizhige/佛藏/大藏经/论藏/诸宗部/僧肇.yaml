endeavors:
- id: guji-僧肇-endeavor-1
  title_zh: 依止罗什助译大乘
  summary: 少习玄学，遇鸠摩罗什入关，执弟子礼，随侍译场，博通三藏，助弘般若，为关中四杰之首。
  phases:
  - key: brewing
    name: 少贫博学好老庄
    labels:
      zh: 潜修
    start_date: 0395
    highlight_event_id: guji-僧肇-event-youth
  - key: breakthrough
    name: 折服归依于什门
    labels:
      zh: 师承
    start_date: '0401'
    highlight_event_id: guji-僧肇-event-meet
  - key: climax
    name: 长安逍遥园助译
    labels:
      zh: 译场
    start_date: '0402'
    highlight_event_id: guji-僧肇-event-translate
  - key: closure
    name: 关中声望冠时流
    labels:
      zh: 扬名
    start_date: '0405'
    highlight_event_id: guji-僧肇-event-translate
  decisions:
  - date: '0401'
    title_zh: 弃玄归佛师事罗什
    rationale: 睹什师妙悟，知老庄未尽真理，遂洗心般若，决意依止，不顾旧学
  - date: '0402'
    title_zh: 入关助译不亟著述
    rationale: 欲先通经义，助正翻译，待见解纯熟，然后立言，以免谬传空义
- id: guji-僧肇-endeavor-2
  title_zh: 撰肇论宝藏论显离微
  summary: 融般若空宗与玄学名教，提出真空妙有，广照空有，离微体净，以无为宗无相为容，开中土般若新风。
  phases:
  - key: brewing
    name: 涵泳般若思空有
    labels:
      zh: 思惟
    start_date: '0404'
    highlight_event_id: guji-僧肇-event-translate
  - key: breakthrough
    name: 作不真空般若无知诸论
    labels:
      zh: 立义
    start_date: '0406'
    highlight_event_id: guji-僧肇-event-writing
  - key: climax
    name: 广照明离微体净
    labels:
      zh: 弘宗
    start_date: 0408
    highlight_event_id: guji-僧肇-event-writing
  - key: closure
    name: 遗风付后学宗仰
    labels:
      zh: 圆成
    start_date: '0414'
    highlight_event_id: guji-僧肇-event-death
  decisions:
  - date: '0406'
    title_zh: 以空有双遣立不真空
    rationale: 为救有无偏执，显即有即空，使学者不堕断常，守真抱一
  - date: 0408
    title_zh: 假言离微以示无相
    rationale: 真理不可言说，为通凡情，权立离微二字，令体用双显而不滞名相
events:
- id: guji-僧肇-event-birth
  title_zh: 出生京兆长安
  date: 0384
  year_of: 384
  place_zh: 京兆长安
  description: 约东晋太元九年生于京兆，家贫，少为书生，博览经史，尤好老庄。
- id: guji-僧肇-event-youth
  title_zh: 读维摩折服为沙门
  date: 0395
  year_of: 395
  place_zh: 长安
  description: 读维摩诘经，欣然感悟，叹服佛法高玄，遂出家为僧，专攻般若。
- id: guji-僧肇-event-meet
  title_zh: 师事鸠摩罗什
  date: '0401'
  year_of: 401
  place_zh: 姑臧长安
  description: 罗什入关，僧肇往从之为弟子，执礼甚恭，罗什称其解悟超群，为门下四杰之首。
- id: guji-僧肇-event-translate
  title_zh: 助译于逍遥园
  date: '0402'
  year_of: 402
  place_zh: 长安逍遥园
  description: 随什于逍遥园助译大品般若等经，参订文义，兼通三藏，深得空旨，名震关中。
- id: guji-僧肇-event-writing
  title_zh: 撰肇论及宝藏论
  date: 0408
  year_of: 408
  place_zh: 长安
  description: 撰不真空论般若无知论物不迁论涅槃无名论及宝藏论，广照空有，发明离微体净，以无为宗。
- id: guji-僧肇-event-death
  title_zh: 示寂于长安
  date: '0414'
  year_of: 414
  place_zh: 长安
  description: 后秦弘始十六年示寂，年三十余，著述虽寡而义极玄远，后世宗为解空第一。
