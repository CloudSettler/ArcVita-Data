  dilemmas:
  - title_zh: 远求与本地修悟
    description_zh: 西行渡海可亲近唐师然路险缘乖，留本土观心亦可悟道，当如何抉择去留
  - title_zh: 持净戒与入俗化导
    description_zh: 守戒则远于群生，入俗则毁于清誉，欲以无碍行化导愚蒙，当如何不舍大悲又不坏正见
  lesson: 心外无法，六尘本空，忏悔要在一心观照，不滞仪文，方能自度度人
  summary_first_person: 我是新罗沙门元晓，幼慕解脱，尝与义湘西游求法，宿土窟而悟三界唯心，遂返本国，会通诸宗，倡一心和诤，晚入闾巷，以歌偈忏法劝化众生，愿人人返照六情如梦，见本来无生
