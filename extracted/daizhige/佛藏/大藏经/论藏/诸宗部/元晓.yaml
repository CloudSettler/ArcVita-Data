    title_zh: 舍戒相入俗伍
    rationale: 若执戒相则化不及下凡，愿以大悲同尘，令屠沽男女皆得闻法起信
  - date: 0680
    title_zh: 制大乘六情忏悔
    rationale: 六根放逸如长梦，须以梦观与实相观并行，令行者即俗观心，惭愧忏除而不滞有无
