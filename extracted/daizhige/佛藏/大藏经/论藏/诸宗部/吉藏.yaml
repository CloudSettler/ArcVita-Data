  - date: 0581
    title_zh: 继法朗之后弘三论破小执
    rationale: 法朗示寂，保冥之徒守筌忘月，当以中观破有空偏执，开会二谛
  - date: 0609
    title_zh: 奉命撰三论玄义总序宗要
    rationale: 圣心以息患为主，教意以通理为宗，须总破邪显正，遍斥内外四宗以息戏论
- id: guji-吉藏-endeavor-2
  title_zh: 注疏经论会通大小
  summary: 钻仰众经澄汰五部，撰二谛义大乘玄论法华义疏等，会通小大，证成实为小内之胜而非究竟
  phases:
