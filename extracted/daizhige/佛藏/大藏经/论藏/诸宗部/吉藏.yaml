      - 空有
    start_date: 0590
    highlight_event_id: guji-吉藏-event-jiangsi
  - key: climax
    name: 判教立义斥成实偏空
    labels:
      zh:
      - 判教
      - 著述
    start_date: 0609
    highlight_event_id: guji-吉藏-event-xuanyi
  - key: closure
    name: 晚年著述付嘱后学
    labels:
