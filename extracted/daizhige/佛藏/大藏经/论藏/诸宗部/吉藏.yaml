  decisions:
  - date: '0556'
    title_zh: 依止法朗专学三论
    rationale: 欲祛内外滞碍，须明中论二谛宗要，故舍余学专攻四论
  - date: '0600'
    title_zh: 对开善立十重二谛义
    rationale: 开善十重未尽关键，为显有空不二二不二理教，故开大意至同异十重以辨正
- id: guji-吉藏-endeavor-2
  title_zh: 隋唐弘护翼赞教乘
  summary_zh: 隋炀帝召主慧日道场，唐初领袖长安，讲经疏论，护持正法，门徒遍布海内
  phases:
  - key: brewing
    name: 隋初游化讲三论
