    start_date: '0620'
    highlight_event_id: guji-吉藏-event-death
  decisions:
  - date: 0595
    title_zh: 以十义证成实属小乘
    rationale: 诃梨自云正论三藏，文无方等，空义短浅，当辨大小以防探大释小之迷
  - date: '0610'
    title_zh: 明大小相即不相即以立中道
    rationale: 小但住空不见不空，菩萨空亦不可得，须伤解行之偏以通道利人
events:
- id: guji-吉藏-event-birth
  title_zh: 生于金陵安氏
  date: 0549
  year_of: 549
  description: 梁太清三年生于建康，俗姓安，先世西域安息人，父安道聪
- id: guji-吉藏-event-ordination
  title_zh: 七岁出家师事法朗
  date: '0556'
  year_of: 556
  description: 七岁舍俗从兴皇法朗出家，专学三论，深悟中观破邪显正之旨
- id: guji-吉藏-event-jiangsi
  title_zh: 继席嘉祥大弘三论
  date: 0581
  year_of: 581
  description: 法朗示寂后继住嘉祥寺，敷讲三论及大乘经，四方学众云集，号嘉祥大师
- id: guji-吉藏-event-xuanyi
  title_zh: 奉诏住慧日撰三论玄义
  date: 0609
  year_of: 609
  description: 隋炀帝大业中奉命住扬州慧日道场，撰三论玄义，总序破邪显正，摧外道折毗昙排成实呵大执
- id: guji-吉藏-event-death
  title_zh: 卒于长安延兴寺
  date: '0623'
  year_of: 623
  description: 入唐住长安延兴寺，武德六年示寂，世寿七十五，著述数十部，三论宗风大振
