  dilemmas:
  - 真俗不二而须开二谛名言如何不堕戏论
  - 依倒不倒二谛说法如何令众生舍凡取圣而不住空有
  lesson: 依二谛显不二，借教悟理，转倒从不倒，以中道正观弘传佛法
  summary_first_person: 吾吉藏幼依兴皇法朗出家，以二谛为正道，依中论大品明真俗十重义，破开善旧说，隋唐弘三论于嘉祥慧日，著述千万言，付嘱门人令悟不二
