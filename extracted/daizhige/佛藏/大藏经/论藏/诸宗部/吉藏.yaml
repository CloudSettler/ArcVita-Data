  decisions:
  - date: '0610'
    title_zh: 应诏入慧日不辞劳
    rationale: 欲令王法护佛法，使二谛妙义广行天下，故入道场开众讲演
  - date: 0618
    title_zh: 唐初坚持著疏传灯
    rationale: 旧学将泯，为令后昆识中道佛性，故制诸经玄疏大乘玄论不辍
