endeavors:
- id: guji-善导-endeavor-1
  title_zh: 承道绰弘观经专修念佛
  summary_zh: 入终南悟真专修净业著观经疏判顿教劝一日七日专称
  phases:
  - key: brewing
    name: 参谒道绰悟入净土
