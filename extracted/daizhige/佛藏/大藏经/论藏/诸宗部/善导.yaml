    labels:
      zh: 疏释立宗
    start_date: '0646'
    highlight_event_id: guji-善导-event-2
  decisions:
  - date: '0641'
    title_zh: 舍诸行专修净土
    rationale: 睹道绰九品道场知是入佛津要故专依观经弥陀经修念佛三昧
  - date: '0646'
    title_zh: 著观经疏判即是顿教
    rationale: 愍钝根万劫难悟故明观经等即顿教菩萨藏劝专称速生不退
- id: guji-善导-endeavor-2
  title_zh: 明般舟行道作往生赞普劝
  summary_zh: 依观经等明常行道三业无间著行道往生赞广赞极乐依正
