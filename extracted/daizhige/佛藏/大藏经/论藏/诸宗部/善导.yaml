endeavors:
- id: guji-善导-endeavor-1
  title_zh: 专修念佛弘化长安
  summary: 亲承道绰之后入长安，以称名礼念劝化道俗，确立净土专修之风
  phases:
  - key: brewing
    name: 西河问道
    labels:
      zh:
      - 亲近道绰
      - 悟入本愿
    start_date: 417
    highlight_event_id: guji-善导-event-1
  - key: breakthrough
    name: 长安弘化
    labels:
      zh:
      - 专修教化
      - 普摄道俗
    start_date: 426
    highlight_event_id: guji-善导-event-2
  - key: climax
    name: 四修立则
    labels:
      zh:
      - 恭敬无余无间长时
      - 十即十生
    start_date: 429
    highlight_event_id: guji-善导-event-2
  decisions:
  - date: 417
    title_zh: 舍诸行归净土专修
    rationale: 见道绰净土九品道场，深信弥陀本愿，唯专称名号易得往生
  - date: 426
    title_zh: 住长安光明寺普劝持名
    rationale: 为破杂缘乱动，倡长时无间无余恭敬四修，令念念相续与佛愿相应
- id: guji-善导-endeavor-2
  title_zh: 撰述观经疏集记往生礼赞
  summary: 依大经观经龙树天亲之说，撰观经疏并集六时往生礼赞，成净土行仪
  phases:
  - key: brewing
    name: 采集大经要文
    labels:
      zh:
      - 依经造偈
      - 劝信往生
    start_date: 0658
    highlight_event_id: guji-善导-event-2
  - key: breakthrough
    name: 撰观经四帖疏
    labels:
      zh:
      - 楷定古今
      - 三心释义
    start_date: 0659
    highlight_event_id: guji-善导-event-2
  - key: climax
    name: 集记六时礼赞
    labels:
      zh:
      - 六时系念
      - 礼忏发愿
    start_date: 437
    highlight_event_id: guji-善导-event-3
  - key: closure
    name: 流通遐代
    labels:
      zh:
      - 晓悟未闻
      - 远沾后世
    start_date: 0680
    highlight_event_id: guji-善导-event-3
  decisions:
  - date: 0659
    title_zh: 以三心五念统摄行持
    rationale: 依观经具三心必生及天亲五念门，令一切善根皆成真实往生之业
  - date: 437
    title_zh: 分六时合诸家礼赞为一卷
    rationale: 集释迦十二光大经要文龙树天亲彦琮及自作之偈，欲相续系心助成往益
events:
- id: guji-善导-event-birth
  date: 395
  year_of: 613
  title_zh: 降生泗州
  description: 隋大业九年生于泗州，少出家，慕西方极乐之风
- id: guji-善导-event-1
  date: 417
  year_of: 641
  title_zh: 往西河亲承道绰
  description: 闻道绰讲净土九品，乃往并州西河亲承其教，喜曰此真入佛之津要，遂发心专修念佛
- id: guji-善导-event-2
  date: 426
  year_of: 652
  title_zh: 入长安弘化撰观经疏
  description: 入京居光明寺慈恩寺弘扬净土，劝人专称弥陀，撰观经四帖疏楷定三心四修之说，化度极盛
- id: guji-善导-event-3
  date: 437
  year_of: 665
  title_zh: 集记往生礼赞颁六时行仪
  description: 采集大经要文及龙树天亲彦琮诸赞，自作十六观礼赞，分为日没初夜中夜后夜晨朝午时六时礼忏仪轨，劝道俗相续系心
- id: guji-善导-event-death
  date: 0681
  year_of: 681
  title_zh: 示寂长安
  description: 唐永隆二年示寂于长安，遗教以专修相续为要，后世尊为净土宗二祖
