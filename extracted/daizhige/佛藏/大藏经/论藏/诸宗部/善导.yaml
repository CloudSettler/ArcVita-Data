  - key: climax
    name: 长安弘化造往生赞
    labels:
      zh: 行道劝化
    start_date: 0668
    highlight_event_id: guji-善导-event-3
  - key: closure
    name: 临终劝信归于安养
    labels:
      zh: 示寂成教
    start_date: 0681
    highlight_event_id: guji-善导-event-death
  decisions:
  - date: 0668
    title_zh: 制般舟赞明三昧乐
    rationale: 佛知众生心杂乱故偏教正念住西方以赞文令行住坐卧常行念佛互赞顺护三业
  - date: 0681
    title_zh: 以身劝信至死专复专
    rationale: 唯恨众生疑不疑故示一切时相续至死为期同生极乐报师恩佛恩
