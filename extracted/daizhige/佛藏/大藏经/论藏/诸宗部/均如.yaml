  lesson: 执名守迹则失体，唯以止观印契法界方能转别为圆。
  summary_first_person: 吾生高丽之世，慕华严性起之海，依一乘法界图作丛髓录，冀执名之徒还归无名真源，以止观一印融理事而显圆通。
