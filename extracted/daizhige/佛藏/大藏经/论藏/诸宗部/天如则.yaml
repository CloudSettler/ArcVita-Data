    title_zh: 以净土指归整肃丛林
    rationale: 引百丈病僧念佛津送十念之制，证合五家宗派无一人不归净土，令学人省觉祖师之意
  - date: '1350'
    title_zh: 坚持临终正念求生
    rationale: 以身示范虽悟达摩禅仍求上品往生，为末法立信，令见闻者触目西方归心净土
