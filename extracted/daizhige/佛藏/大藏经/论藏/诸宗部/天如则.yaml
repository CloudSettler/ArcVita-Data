  - date: '1342'
    title_zh: 以或问体设疑自释
    rationale: 怜禅者空腹高心谤净土，故于无疑中设疑，无问处兴问，以显文殊普贤龙树马鸣皆愿往生
  - date: '1345'
    title_zh: 明惟心而不废事生
    rationale: 恐学者执惟心之理废十万亿外之事实，故详辨四土融通三观妙观，令理事双彰信愿持名
- id: guji-天如则-endeavor-2
  title_zh: 住持师子林领众化世
  summary_zh: 宗说俱通领袖丛林，遵百丈清规导归安养，自行化他为末法劝信
