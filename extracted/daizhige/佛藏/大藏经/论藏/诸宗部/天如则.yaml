  archetype: 禅净会通之宗匠
  dilemmas:
  - 禅者轻净自谓悟后不须求生当如何破执显正
  - 未得不退急欲混俗度生与先求往生得忍再来何者为稳
  lesson: 未登不退须仗佛力先求往生极乐，得无生忍后再入生死度众，禅净本一源不可偏废
  summary_first_person: 吾乃师子林天如则，宴默卧云，见禅者鄙净土为愚夫愚妇之行，故设客问自答二十六则，发明永明寿之意，示惟心净土理事圆融，劝上中下根同归安养
  source_urls:
  - https://daizhige.org/净土或问.html
  - https://cbeta.org/result/T1972
