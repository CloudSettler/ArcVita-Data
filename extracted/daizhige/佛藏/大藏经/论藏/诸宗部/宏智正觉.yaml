    title_zh: 长芦接法衣升座
    rationale: 西竺传通东山付嘱之大事须当面承当，故两手分付，直超凡圣
  - date: 1128
    title_zh: 入泗州普照开堂普请入门
    rationale: 尽十方世界是解脱门，须普请诸人入门，尊宾和合，理事圆融
- id: guji-宏智正觉-endeavor-2
  title_zh: 住持天童倡默照禅
  summary: 久住天童，以默照禅风接引四海禅人，语录广传，士大夫归信，成就曹洞宗风
