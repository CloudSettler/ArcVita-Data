  decisions:
  - date: 1129
    title_zh: 安居天童不涉去来
    rationale: 不可以静躁去来求，须步步不将来心心无处所，故长居一处以育祥麟
  - date: 1152
    title_zh: 付侍者集成编语录
    rationale: 机缘语句须流通后世以别识知音，故令门人编次上堂小参以传信
events:
- id: guji-宏智正觉-event-birth
  title_zh: 出生
  date: 1091
  year_of: 1091
  description: 宋元祐六年生于隰州，幼喜从僧游，淡薄世味
- id: guji-宏智正觉-event-changlu
  title_zh: 长芦受请传衣
  date: 1127
  year_of: 1127
  description: 在长芦受请，拈疏示众，于长芦和尚手中接得法衣升座说法
- id: guji-宏智正觉-event-puzhao
  title_zh: 入住泗州大圣普照寺
  date: 1128
  year_of: 1128
  description: 辞长芦众入泗州大圣普照寺上堂，举赵州吃茶、五宗宗风，普请入门
- id: guji-宏智正觉-event-tiantong
  title_zh: 住持天童山
  date: 1129
  year_of: 1129
  description: 迁住明州天童山，弘扬默照禅，四海禅人云集，范宗尹邂逅相敬如故人
- id: guji-宏智正觉-event-xulu
  title_zh: 范宗尹作天童语录序
  date: 1152
  year_of: 1152
  description: 绍兴壬子秋，退晦居士范宗尹为天童觉和尚语录作序，记庐山四明相从大略
- id: guji-宏智正觉-event-death
  title_zh: 天童圆寂
  date: 1157
  year_of: 1157
  description: 宋绍兴二十七年于天童山圆寂，世寿六十七，语录由侍者集成等编为宏智禅师广录
