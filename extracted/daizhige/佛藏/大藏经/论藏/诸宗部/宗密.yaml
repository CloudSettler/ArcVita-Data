    labels:
      zh:
      - 注疏
      - 开宗
    start_date: 0815
    highlight_event_id: guji-宗密-event-panjiao
  - key: climax
    name: 圭峰弘法化徒
    labels:
      zh:
      - 弘法
      - 利生
    start_date: 0828
    highlight_event_id: guji-宗密-event-jiyao
  - key: closure
    name: 以定发慧遗教后学
    labels:
      zh:
      - 修证
      - 遗教
    start_date: 0840
    highlight_event_id: guji-宗密-event-death
  decisions:
  - date: 0815
    title_zh: 顿悟资于渐修定慧双运
    rationale: 真性不垢不净而禅有浅深若不修证则狂慧守默故须依解修心渐得百千三昧
  - date: 0828
    title_zh: 不立门户专弘圆教心地
    rationale: 万法之源名法性迷悟之源名藏识万德之源名佛性万行之源名心地故以华严摄禅
