  archetype: 会通者
  dilemmas:
  - 禅讲相斥顿渐相违如何以佛语统会而不立门户
  - 得意忘言与文合于经如何兼顾玄通与楷定邪正
  lesson: 局之则皆非会之则皆是当取信于佛取证于本法以圆教印诸宗令同归智海
  summary_first_person: 我是圭峰宗密自未解脱欲解他缚为法忘躯愍人切切别撰经律论疏大开戒定慧门舍众入山习定均慧前后十年因了自心辨诸教因辨诸教解修心以三教印三宗集百家禅述为禅源诸诠集而都序之愿禅教一味情遣解生
  source_urls:
  - https://daizhige.org/佛藏/大藏经/论藏/诸宗部/禅源诸诠集都序.html
  - https://zh.wikisource.org/wiki/禪源諸詮集
endeavors:
- id: guji-宗密-endeavor-1
  title_zh: 会通禅教会集禅源诸诠
  summary_zh: 以如来三种教义印禅宗三种法门融瓶盘钗钏为一金会江西荷泽北秀南侁等十室为三宗而都序之
  phases:
