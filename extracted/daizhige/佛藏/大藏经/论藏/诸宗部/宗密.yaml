    labels:
      zh:
      - 判教
      - 会宗
    start_date: 0820
    highlight_event_id: guji-宗密-event-panjiao
  - key: climax
    name: 纂集百家作都序
    labels:
      zh:
      - 集诠
      - 都序
      - 作图示心
    start_date: 0823
    highlight_event_id: guji-宗密-event-jiyao
  - key: closure
    name: 图文并传化导群迷
    labels:
      zh:
      - 流通
      - 化导
    start_date: 0825
    highlight_event_id: guji-宗密-event-jiyao
  decisions:
  - date: 0823
    title_zh: 以佛经权实印定诸禅是非
    rationale: 师有本末经如绳墨须依了义以教照心以心解教方知宗趣不乖佛意
  - date: 0824
    title_zh: 俱存其法俱遣其病会为一味
    rationale: 人多随情互执至道归一精义无二不应两存不应单取故会令圆妙
- id: guji-宗密-endeavor-2
  title_zh: 弘华严注疏兼修定慧
  summary_zh: 别撰经律论疏大开戒定慧门显顿悟资于渐修证师说符于佛意注华严圆觉弘菩萨万行之源心地
  phases:
  - key: brewing
    name: 遇道圆悟圆觉
