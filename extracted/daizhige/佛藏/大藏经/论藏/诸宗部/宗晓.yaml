  dilemmas:
  - title_zh: 博涉与专修之衡
    description: 藏海浩瀚与系念专一之间如何会通，我以类编群言同归一心
  - title_zh: 慕古与救今之衡
    description: 追慕庐阜远公遗风与救末世懈慢之间如何接续，我以莲社念佛为津梁
  lesson: 乐邦不离唯心，类聚群言以启信，专修系念以证心。
  summary_first_person: 吾四明石芝沙门宗晓，侵寻晚景悟世非坚，囊括诸经网罗众制，始于经咒终乎诗词，分十四门为五卷，名曰乐邦文类，愿与同志共归安养。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
  - https://cbetaonline.dila.edu.tw/zh/T1969A
