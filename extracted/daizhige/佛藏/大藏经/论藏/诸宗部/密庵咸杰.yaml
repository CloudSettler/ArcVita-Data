  death_date: 1186-01-01
  era: 南宋
  reign_ref: 南宋孝宗乾道淳熙年间
  archetype: 临济宗大慧派宗门大匠
  dilemmas:
  - 痛快截断与慈悲接引之间如何兼顾
  - 住持七大名山应缘迎送与保任正宗之间如何不染
  lesson: 一见便透，直截根源，以铁牛之机印定万象，不作野狐见解，各自成就生涯。
  summary_first_person: 吾是密庵咸杰，一见应庵便明大法，错路撞入衢州，将错就错承当业债，历镇乌巨乾明祥符蒋山等七大名山，横拈拄杖，喝下承当，但愿衲僧剥尽贴肉汗衫，莫向鬼门重贴卦去。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AF%B8%E5%AE%97%E9%83%A8/%E5%AF%86%E5%BA%B5%E5%92%8C%E5%B0%9A%E8%AF%AD%E5%BD%95.html
