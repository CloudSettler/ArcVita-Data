endeavors:
- id: guji-密庵咸杰-endeavor-1
  title_zh: 应庵座下得法与乌巨乾明初住开法
  description: 行脚江西回，错指路头入衢州明果见应庵，一见便明大法，乾道三年受请住衢州西乌巨山乾明禅院，升座开堂竖立宗风。
  phases:
  - key: brewing
    name: 行脚参学错入衢州
    labels:
      zh:
      - 行脚
      - 参方
    start_date: 1155-01-01
    highlight_event_id: guji-密庵咸杰-event-dharma
  - key: breakthrough
    name: 一见应庵便明大法
    labels:
      zh:
      - 得法
      - 印可
    start_date: 1158-01-01
    highlight_event_id: guji-密庵咸杰-event-dharma
  - key: climax
    name: 乾明受请升座开堂
    labels:
      zh:
      - 开法
      - 升座
    start_date: 1167-08-01
    highlight_event_id: guji-密庵咸杰-event-qianming
  - key: closure
    name: 乾明语录结集声播丛林
    labels:
      zh:
      - 弘化
      - 结集
    start_date: 1168-01-01
    highlight_event_id: guji-密庵咸杰-event-qianming
  decisions:
  - date: 1158-01-01
    title_zh: 将错就错礼拜应庵
    rationale: 既已错入明果，便礼三拜直下承当，以冤有头债有主之心酬法乳之恩，不再他求。
  - date: 1167-08-01
    title_zh: 受请就乌巨乾明升座
    rationale: 业债难逃便欢喜忍受，以杰上座转作乌巨长老，披毛戴角向异类中提持正令，全提铁牛之机。
- id: guji-密庵咸杰-endeavor-2
  title_zh: 七镇名山住持与入对阐扬般若
  description: 继住大中祥符寺，次住建康蒋山太平兴国寺等七镇名山，道满天下，龙象尽出钳锤，入对中宸阐扬般若，深契上意。
  phases:
  - key: brewing
    name: 祥符继席提持向上
    labels:
      zh:
      - 住持
      - 提持
    start_date: 1170-01-01
    highlight_event_id: guji-密庵咸杰-event-xiangfu
  - key: breakthrough
    name: 蒋山太平兴国弘化
    labels:
      zh:
      - 名山
      - 化众
    start_date: 1175-01-01
    highlight_event_id: guji-密庵咸杰-event-jiangshan
  - key: climax
    name: 入对中宸阐扬般若
    labels:
      zh:
      - 入对
      - 护国
    start_date: 1180-01-01
    highlight_event_id: guji-密庵咸杰-event-jiangshan
  - key: closure
    name: 示寂语录流通后世
    labels:
      zh:
      - 示寂
      - 流通
    start_date: 1186-01-01
    highlight_event_id: guji-密庵咸杰-event-death
  decisions:
  - date: 1170-01-01
    title_zh: 掘地觅天别立祥符家风
    rationale: 不随盘山千圣不传与慈明千圣不然之途辙，直道向上一路掘地觅天，截断葛藤。
  - date: 1175-01-01
    title_zh: 正令全提坐断十方
    rationale: 以一句该通千差万别，全宾是主全主是宾，于蒋山八字打开解脱门，成就一时龙象。
events:
- id: guji-密庵咸杰-event-birth
  title_zh: 政和八年出生
  date: 1118-01-01
  year_of: 1118
  place_zh: 福州
  description: 宋徽宗政和八年出生，俗姓未详，幼具出尘之志，后出家参禅。
- id: guji-密庵咸杰-event-dharma
  title_zh: 行脚见应庵昙华得法
  date: 1158-01-01
  year_of: 1158
  place_zh: 衢州明果山
  description: 自江西行脚回拟往四明，抵婺州智者被错指路头撞入衢州明果，一见应庵昙华便明大法，酬法乳之恩，破沙盆语盛播丛林。
- id: guji-密庵咸杰-event-qianming
  title_zh: 乾道三年住乌巨山乾明开堂
  date: 1167-08-01
  year_of: 1167
  place_zh: 衢州西乌巨山乾明禅院
  description: 乾道三年八月初一日就本院受请升座，以祖师心印状似铁牛之机示众，拈三圣兴化白云端等公案，竖立乌巨家风。
- id: guji-密庵咸杰-event-xiangfu
  title_zh: 住衢州大中祥符禅寺
  date: 1170-01-01
  year_of: 1170
  place_zh: 衢州大中祥符禅寺
  description: 继席祥符，上堂拈盐官虚空为鼓南泉不打破鼓及药山归方丈等公案，以掘地觅天别开向上活眼。
- id: guji-密庵咸杰-event-jiangshan
  title_zh: 住建康蒋山太平兴国禅寺
  date: 1175-01-01
  year_of: 1175
  place_zh: 建康府蒋山太平兴国禅寺
  description: 入寺八字打开无碍解脱门，正令全提十方坐断，圣节留下一转语祝皇帝万岁，七镇名山道满天下。
- id: guji-密庵咸杰-event-death
  title_zh: 淳熙十三年示寂
  date: 1186-01-01
  year_of: 1186
  place_zh: 蒋山
  description: 淳熙十三年示寂，得法真子住灵岩了悟等编语录，淳熙十五年张镃作序，语录总八十八板盛行丛林。
