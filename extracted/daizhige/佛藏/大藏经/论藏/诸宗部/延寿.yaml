  description: 搜罗诸经诸论法言会三归一劝一切有缘广修万善同归实相以理事无碍成无尽行
- id: guji-延寿-event-death
  date: 0975
  year_of: 975
  title_zh: 示寂於永明谥智觉
  description: 宋开宝八年十二月示寂世寿七十二僧腊四十余后谥智觉禅师塔於大慈山
