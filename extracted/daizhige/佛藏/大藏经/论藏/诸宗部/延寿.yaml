  title_zh: 生於余杭王氏
  description: 唐末生於杭州余杭俗姓王字冲元后为吴越吏而志在出世
- id: guji-延寿-event-ordination
  date: 0932
  year_of: 932
  title_zh: 出家受具习禅持律
