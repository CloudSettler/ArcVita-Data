- id: guji-延寿-event-yongming
  date: 0961
  year_of: 961
  title_zh: 吴越王请住永明寺
  description: 吴越忠懿王请住杭州慧日永明寺领众二千广开法筵昼夜弘演
- id: guji-延寿-event-wanshan
  date: 0970
  year_of: 970
