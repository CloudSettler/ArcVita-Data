  summary_first_person: 吾钱塘王氏子也少为吏属已知无常弃官出家遍参禅教因读楞伽经见佛语心为宗遂发愿广采三乘典籍圣贤教语以问答决疑以引证成信编宗镜百卷立一心为宗照万法如镜后住永明日课弥陀广行万善惟愿含灵返鉴自心同报佛恩
