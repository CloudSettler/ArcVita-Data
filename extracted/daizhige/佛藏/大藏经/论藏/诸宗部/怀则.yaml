endeavors:
- id: guji-怀则-endeavor-1
  title_zh: 阐发性具善恶与性恶法门
  summary: 以性恶之功明今家即义，立第六识为观境，通三千三谛三观，显无作妙行
  phases:
  - key: brewing
    name: 拣境立观酝酿
    labels:
      zh: 酝酿观境
    start_date: 1310-01-01
    highlight_event_id: guji-怀则-event-doctrine
  - key: breakthrough
    name: 悟性恶即义突破
    labels:
      zh: 突破即义
    start_date: 1318-01-01
    highlight_event_id: guji-怀则-event-doctrine
  - key: climax
    name: 三千三谛圆融高潮
    labels:
      zh: 高潮会通
    start_date: 1322-01-01
    highlight_event_id: guji-怀则-event-doctrine
  - key: closure
    name: 判诸师偏圆收束
    labels:
      zh: 收束判教
    start_date: 1326-01-01
    highlight_event_id: guji-怀则-event-doctrine
  decisions:
  - date: 1315-01-01
    title_zh: 的取识阴第六识为所观境
    rationale: 去丈就尺去尺就寸，伐树得根灸病得穴，以总无明修恶心为妙境方显性恶法门
  - date: 1322-01-01
    title_zh: 以性恶融通立全恶是恶即义
    rationale: 修恶即性恶无所破无所显，非二物相合亦非背面相翻，当体全是方名为即
- id: guji-怀则-endeavor-2
  title_zh: 述传佛心印正统广见闻
  summary: 自金口二十四传至慧文南岳天台章安荆溪四明，述付嘱通别与见闻相传，成一家古今绝唱
  phases:
  - key: brewing
    name: 网罗金口祖承酝酿
    labels:
      zh: 酝酿溯源
    start_date: 1324-01-01
    highlight_event_id: guji-怀则-event-writing
  - key: breakthrough
    name: 会通天台相承突破
    labels:
      zh: 突破会通
    start_date: 1328-01-01
    highlight_event_id: guji-怀则-event-writing
  - key: climax
    name: 明迦叶付托通别高潮
    labels:
      zh: 高潮付托
    start_date: 1330-01-01
    highlight_event_id: guji-怀则-event-writing
  - key: closure
    name: 凭纸墨广见闻收束
    labels:
      zh: 收束流通
    start_date: 1332-01-01
    highlight_event_id: guji-怀则-event-writing
  decisions:
  - date: 1330-06-01
    title_zh: 独明迦叶三意付嘱不局一处
    rationale: 如来缘谢迦叶缘兴，苦行久住小果易化，通该四众别在迦叶，付托即化他嘱累
  - date: 1332-08-01
    title_zh: 不辞鄙陋凭纸墨广见闻
    rationale: 幸逢嘉运效法华若田若里涅槃若树若石，纵生谤毁庶几强毒如兽渡河，不顾濡尾以续中兴
events:
- id: guji-怀则-event-birth
  date: 1275-01-01
  year_of: 1275
  title_zh: 虎溪出生
  description: 元初约生，后为虎溪沙门，传天台宗教，号兴教大师
- id: guji-怀则-event-doctrine
  date: 1322-06-01
  year_of: 1322
  title_zh: 阐明性恶三千妙观
  description: 明十界三千现前一念修恶心本具，即空即假即中，三观十乘无惑可破，诸佛不断性恶阐提不断性善
- id: guji-怀则-event-writing
  date: 1332-08-01
  year_of: 1332
  title_zh: 述作天台传佛心印记
  description: 自佛传迦叶至二十四代师子，继以慧文南岳天台章安二威左溪荆溪螺溪四明，辨教外别传无凭，成佛祖正传心印
- id: guji-怀则-event-death
  date: 1340-12-31
  year_of: 1340
  title_zh: 元中后期示寂
  description: 弘宣性具善恶心印之后示寂，留下天台传佛心印记终篇流通
