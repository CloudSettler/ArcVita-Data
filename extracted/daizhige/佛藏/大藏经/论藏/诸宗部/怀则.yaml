  reign_ref: 元仁宗至元顺帝间
  archetype: 天台弘教述作宗师
  dilemmas:
  - title_zh: 性具但言善或兼具恶
    description: 诸师但云性具善不知性具恶，我当以性恶之功明即义，否则缘理断九非圆顿心印
  - title_zh: 真心成佛或妄心即真
    description: 诸家直指真心见性，我据天台的取第六识修恶心为观境，直显妄心当体全是，不翻恶为善
  lesson: 性恶融通方见圆即，妄心当体全是三千，不假断除别求真心
  summary_first_person: 我是虎溪沙门怀则，传天台宗教，幸逢嘉运，凭纸墨述传佛心印，以性恶三千绝待妙观会通金口相承与今家教观，愿广见闻中兴此道
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AF%B8%E5%AE%97%E9%83%A8/%E5%A4%A9%E5%8F%B0%E4%BC%A0%E4%BD%9B%E5%BF%83%E5%8D%B0%E8%AE%B0.html
