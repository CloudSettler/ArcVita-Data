    highlight_event_id: guji-怀则-event-teach
  decisions:
  - date: 1305-01-01
    title_zh: 以天台圆顿解摄持净土行
    rationale: 悯初心念佛者多而知境观者少欲使不徒劳苦行须以教观为入道之门
  - date: 1308-01-01
    title_zh: 立约心观佛以决两家之诤
    rationale: 净觉摄佛归心与广智摄心归佛各执一边须双收而示定境属外境便是心不须摄归方名约心
- id: guji-怀则-endeavor-2
  title_zh: 撰述净土境观要门
  summary_zh: 引观经白毫等相示即心观佛之法辨唯心净土本性弥陀论三谛三观圆融远近生即无生
  phases:
