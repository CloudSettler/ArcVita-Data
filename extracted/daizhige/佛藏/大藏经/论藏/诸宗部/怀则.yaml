    labels:
      zh:
      - 约心观佛
      - 托彼熏心
    start_date: 1310-01-01
    highlight_event_id: guji-怀则-event-compose
  - key: closure
    name: 示远近圆解
    labels:
      zh:
      - 三谛三观
      - 生即无生
    start_date: 1310-12-11
    highlight_event_id: guji-怀则-event-compose
  decisions:
  - date: 1310-01-01
    title_zh: 专观眉间白毫从一相好入
    rationale: 丈六之身三十二相不可遍观须从一相入令极明了然后余相自然当现
  - date: 1310-12-11
    title_zh: 至大三年冬至前述成要门
    rationale: 恐信乐之人徒劳苦行故信笔略书大概虽老眼昏花不及检文亦欲留入道津梁
