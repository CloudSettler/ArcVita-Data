  dilemmas:
  - 渐修拭尘与顿见本性何者为究竟
  - 得衣为六祖后避难南行与即出弘化如何抉择
  - 定慧为次第先後还是体一不二
  lesson: 自性本自清净不假外求但于念念不住正见即除迷妄见性成佛
  summary_first_person: 我父贬官南荒幼孤卖柴养母闻金刚经心即开悟辞母往黄梅礼五祖于碓坊踏碓八月以菩提本无树之偈见本心三更受金刚印可传衣为六祖南遁十五年后于韶州大梵寺开摩诃般若顿教授无相戒
  source_urls:
  - https://daizhige.org/daizhige-tan-jing.html
  - https://github.com/daizhige-org/daizhigev20
endeavors:
- id: guji-惠能-endeavor-1
  title_zh: 黄梅求法夜受衣钵
  summary: 卖柴闻经往蕲州黄梅于碓坊劳作以无相偈显本心三更受顿法及衣为六代祖
  phases:
  - key: brewing
    name: 卖柴闻经辞母北上
    labels:
      zh: 宿缘闻法
    start_date: 424
    highlight_event_id: guji-惠能-event-huangmei
  - key: breakthrough
    name: 碓坊踏碓八月劳作
    labels:
      zh: 低位苦行
    start_date: 433
    highlight_event_id: guji-惠能-event-huangmei
  - key: climax
    name: 廊下呈偈见自本性
    labels:
      zh: 顿悟见性
    start_date: 435
    highlight_event_id: guji-惠能-event-chuanfa
  - key: closure
    name: 三更说金刚传衣南行
    labels:
      zh: 以心传心
    start_date: 0663-05-01
    highlight_event_id: guji-惠能-event-chuanfa
  decisions:
  - date: 433
    title_zh: 不求余物唯求作佛
    rationale: 闻持金刚经即得见性故远礼五祖不为福田只为了生死出离
  - date: 0663-05-01
    title_zh: 得法即速南行藏隐
    rationale: 传法气如悬丝住此有人害命故奉祖命三年勿弘保任南行
- id: guji-惠能-endeavor-2
  title_zh: 曹溪弘化大梵寺说法
  summary: 南遁避难大庾岭传法惠顺后于韶州大梵寺升高座说摩诃般若授无相戒四弘愿开南宗顿教
  phases:
  - key: brewing
    name: 大庾岭让衣传法惠顺
    labels:
      zh: 避难传法
    start_date: 0663-07-01
    highlight_event_id: guji-惠能-event-chuanfa
  - key: breakthrough
    name: 隐遁南中将法向南
    labels:
      zh: 韬晦待时
    start_date: 436
    highlight_event_id: guji-惠能-event-dafan
  - key: climax
    name: 韶州大梵寺开摩诃般若
    labels:
      zh: 定慧为本
    start_date: 0689
    highlight_event_id: guji-惠能-event-dafan
  - key: closure
    name: 曹溪示寂法流后代
    labels:
      zh: 无念无相
    start_date: 0713-08-03
    highlight_event_id: guji-惠能-event-death
  decisions:
  - date: 0663-07-01
    title_zh: 岭上以法施惠顺不恋祖衣
    rationale: 来为求法非为夺衣故以自性顿法示道令其心开北化度人
  - date: 0689
    title_zh: 立无念无相无住为宗授无相戒
    rationale: 破坐净看心之执令于一切境上念不起见本性不乱自归三身佛
