  lesson: 直指自性本来清净以无相为体无念为宗无住为本顿悟顿修
  summary_first_person: 吾本岭南新州卖柴养母之人因闻金刚经往黄梅参五祖于碓坊踏碓八月以本来无一物之偈见性三更得传衣法南遁曹溪隐于猎队十五载后于广州法性寺对风幡心动祝发出家登坛说法三十七年只传见性之旨
