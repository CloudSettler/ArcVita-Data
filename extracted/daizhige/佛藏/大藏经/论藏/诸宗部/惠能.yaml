events:
- id: guji-惠能-event-birth
  title_zh: 岭南新州诞生卖柴养母
  date: 0638
  year_of: 638
  description: 严父本贯范阳左降流岭南作新州百姓父早亡母孤遗移南海艰辛卖柴养亲
- id: guji-惠能-event-huangmei
  title_zh: 闻金刚经赴黄梅参五祖
  date: '0661'
  year_of: 661
  description: 闻客诵金刚经心即开悟得银安母不经三十余日便至黄梅礼拜忍大师自言惟求作佛被令随众作务退至后院破柴踏碓八月余
- id: guji-惠能-event-transmission
  title_zh: 廊壁呈偈三更传衣法
  date: '0662'
  year_of: 662
  description: 神秀书身是菩提树偈未见性惠能对以菩提本无树偈五祖以鞋擦偈潜至碓坊以杖击碓三下三鼓入室说金刚经至应无所住而生其心惠能大悟五偈何期自性遂受顿教及衣钵为第六代祖
- id: guji-惠能-event-dayuling
  title_zh: 大庾岭让衣付法惠明
  date: '0662'
  year_of: 662
  description: 五祖送至九江驿惠能南行两月至大庾岭掷衣钵于石上隐草莽中惠明提掇不动为法而来屏息诸缘得闻不思善恶本来面目言下大悟逢袁则止相别
- id: guji-惠能-event-seclusion
  title_zh: 四会猎队避难十五载
  date: '0663'
  year_of: 663
  description: 后至曹溪又被恶人寻逐乃于四会避难猎人队中凡经十五载随宜说法守网放生肉锅但吃肉边菜
- id: guji-惠能-event-faxing
  title_zh: 广州法性寺风幡祝发
  date: '0676-01-08'
  year_of: 676
  description: 出至广州法性寺值印宗讲涅槃经以不是风动不是幡动仁者心动触开正眼延至上席征诘奥义遂祝发登坛应跋陀罗悬记
- id: guji-惠能-event-caoqi
  title_zh: 曹溪宝林登坛开法
  date: '0676-07-08'
  year_of: 676
  description: 韶州韦刺史请出城中大梵寺讲堂为众开缘说法升座示菩提自性本来清净但用此心直了成佛始于五羊终至曹溪说法三十七年
- id: guji-惠能-event-death
  title_zh: 曹溪入寂付嘱不传衣
  date: '0713-08-03'
  year_of: 713
  description: 法则以心传心自悟自解衣为争端止勿传命如悬丝付嘱广度有情流布将来无令断绝遂入寂后谥大鉴禅师
