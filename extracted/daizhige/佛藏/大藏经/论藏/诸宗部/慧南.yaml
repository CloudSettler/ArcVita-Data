  - date: '1044'
    title_zh: 同安开堂为慈明拈香
    rationale: 明师承石霜一派不断慧命以灾祸语激衲僧开眼不使认光认影
  - date: '1050'
    title_zh: 应请迁住归宗上寺
    rationale: 不辞部封之召欲使慧风与尧风并扇以提唱问答辨邪正接王臣士民
- id: guji-黄龙慧南-endeavor-2
