    title_zh: 入黄龙不去不住搭印
    rationale: 道无疑滞法本随缘在积翠说积翠入黄龙说黄龙以不去不住全提祖师心印
  - date: '1062'
    title_zh: 以拈古击床立黄龙家风
    rationale: 举庞居士吃扑临济喝打等公案破情解息分别使学人转身大事现前续慧命
