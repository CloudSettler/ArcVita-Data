  dilemmas:
  - 情亲婚娶与出家求法之抉择
  - 秘本执守与得意忘象之抉择
  - 声色言说与大事因缘之体认
  lesson: 得意而忘象，用而无执，方能接人无碍，立宗不朽。
  summary_first_person: 我是韶州叶氏子慧寂，九岁投广州和安通禅师出家，十四岁断指誓法，耽源处得名，沩山处得地，执侍十五载而顿悟，后开法王莽仰山，与沩山共兴沩仰之风，以圆相拂子勘验学人。
  source_urls:
  - https://cbeta.org/result/T1990
