endeavors:
- id: guji-慧寂-endeavor-1
  title_zh: 游方问道沩山证悟
  goal: 断亲出家，遍参耽源沩山，求真佛住处而彻悟
  phases:
  - key: brewing
    name: 童真出家断指求法
    labels:
      zh: 出家求道
    start_date: 0816
    highlight_event_id: guji-慧寂-event-ordination
  - key: breakthrough
    name: 谒耽源焚圆相得名
    labels:
      zh: 悟玄旨
    start_date: 0824
    highlight_event_id: guji-慧寂-event-danyuan
  - key: climax
    name: 参沩山问真佛顿悟
    labels:
      zh: 顿悟侍奉
    start_date: 0825
    highlight_event_id: guji-慧寂-event-weishan-awaken
  - key: closure
    name: 执侍十五载升堂奥
    labels:
      zh: 师资相契
    start_date: 0826
    highlight_event_id: guji-慧寂-event-weishan-awaken
  decisions:
  - date: 0821
    title_zh: 断二指跪亲誓求正法
    rationale: 父母取归欲与婚媾，不从则断指明志，以答劬劳而再得披剃
  - date: 0824
    title_zh: 焚九十七圆相不执本
    rationale: 一览已知其意，但用得不可执本，复集一本更无遗失以信后人
  - date: 0825
    title_zh: 投沩山执侍不离
    rationale: 于思无思妙语下顿悟真佛如如，故盘桓十五载以养成宗门牙爪
- id: guji-慧寂-endeavor-2
  title_zh: 开法仰山兴立沩仰
  goal: 住持王莽仰山，以机锋圆相接引四方，印可后学
  phases:
  - key: brewing
    name: 王莽山初开法席
    labels:
      zh: 开法一方
    start_date: 0840
    highlight_event_id: guji-慧寂-event-kaifa
  - key: breakthrough
    name: 袁州仰山大弘宗风
    labels:
      zh: 沩仰立宗
    start_date: 0845
    highlight_event_id: guji-慧寂-event-kaifa
  - key: climax
    name: 勘验南北学人居士
    labels:
      zh: 机锋勘辨
    start_date: 0850
    highlight_event_id: guji-慧寂-event-kanbian
  - key: closure
    name: 印可南塔付嘱宗脉
    labels:
      zh: 传灯付嘱
    start_date: 0860
    highlight_event_id: guji-慧寂-event-kanbian
  decisions:
  - date: 0840
    title_zh: 受请住持王莽仰山
    rationale: 以沩山所证验众生业识，以拂子圆相为牙爪，辨有无师承义玄
  - date: 0850
    title_zh: 以拂子圆相露柱勘学
    rationale: 对庞居士陆希声三圣霍山等人不落言诠，直指声色东西与信门入路
  - date: 0860
    title_zh: 印可南塔为肉身佛
    rationale: 见其凡圣两忘情尽体露，二十年验人无决了者，故嘱保任以续宗风
events:
- id: guji-慧寂-event-birth
  title_zh: 诞生于韶州怀化叶氏
  type: birth
  date: 0807
  year_of: 807
  place: 韶州怀化
  description: 唐元和二年生于韶州怀化叶氏，俗姓叶，后为仰山宗师
- id: guji-慧寂-event-ordination
  title_zh: 和安出家断指披剃
  type: career
  date: 0816
  year_of: 816
  place: 广州和安寺
  description: 九岁投通禅师出家，十四岁被父母取归逼婚，断手二指跪誓求正法，再诣通处披剃，未登具即游方
- id: guji-慧寂-event-danyuan
  title_zh: 谒耽源焚圆相本
  type: career
  date: 0824
  year_of: 824
  place: 耽源处
  description: 初谒耽源已悟玄旨，受六代祖师九十七圆相本，一览便烧，重集一本无遗，以圆相拓呈及女人拜见契
- id: guji-慧寂-event-weishan-awaken
  title_zh: 参沩山问真佛顿悟
  type: career
  date: 0825
  year_of: 825
  place: 沩山
  description: 问如何是真佛住处，于以思无思返思灵焰语下顿悟，执侍前后十五载，扫地牧牛插锹等机锋皆在此间锤炼
- id: guji-慧寂-event-kaifa
  title_zh: 开法王莽山仰山
  type: career
  date: 0840
  year_of: 840
  place: 王莽山袁州仰山
  description: 后开法王莽山，住袁州仰山，以竖拂验诸方说不说，以召阇黎回首验业识茫茫，成沩仰一脉
- id: guji-慧寂-event-kanbian
  title_zh: 勘验庞陆三圣南塔
  type: career
  date: 0850
  year_of: 850
  place: 仰山
  description: 勘庞居士覆仰之问，答陆希声信门三门及拂子入字，笑三圣慧寂同名，印南塔不似佛为肉身佛，机风大播
- id: guji-慧寂-event-death
  title_zh: 示寂
  type: death
  date: 0883
  year_of: 883
  place: 仰山
  description: 唐中和三年示寂，世寿七十七，与沩山灵祐共创沩仰宗，语录由径山语风圆信郭凝之编集入藏
