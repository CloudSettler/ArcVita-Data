  reign_ref: 南唐中主李璟保大交泰年间
  archetype: 法眼宗开祖弘法型
  dilemmas:
  - 知解与证悟难分，肇论三界唯心片石心内外无对
  - 随时及节与仍旧守分难全，移时失候即虚度光阴
  lesson: 舍知解，信一切见成，离声色名字，守分随时仍旧，垂手处即接手，超三祇权学
  summary_first_person: 吾余杭鲁氏子，七岁依智通全伟落发，弱龄越州禀具，往明州育王听律探儒，南参长庆未明，雪阻地藏蒙一切见成言下大悟，住崇寿报恩清凉，垂手接千众，印可德韶诸贤，愿随时及节仍旧不虚度
  source_urls:
  - https://daizhige.org/佛藏/大藏经/论藏/诸宗部/金陵清凉院文益禅师语录.html
