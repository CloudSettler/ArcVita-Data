endeavors:
- id: guji-文益-endeavor-1
  title_zh: 南迈参学地藏大悟
  summary: 少习律儒号游夏，南迈参长庆未明，雪阻地藏放包求决，一切见成言下大悟
  phases:
  - key: brewing
    name: 育王听律探儒
    labels:
      zh: 律匠希觉盛化明州往预听习究微旨
    start_date: 0900
    highlight_event_id: guji-文益-event-lvxue
  - key: breakthrough
    name: 南参长庆未明
    labels:
      zh: 振锡南迈抵福州参长庆不大发明
    start_date: 0915
    highlight_event_id: guji-文益-event-nanmai
  - key: climax
    name: 地藏见成大悟
    labels:
      zh: 阻雪附炉三界唯心片石詰问一切见成
    start_date: 0928
    highlight_event_id: guji-文益-event-dizang
  - key: closure
    name: 临川应请开堂
    labels:
      zh: 同进等至临川州牧请住崇寿举古人方便
    start_date: 0936
    highlight_event_id: guji-文益-event-chongshou
  decisions:
  - date: 0928
    title_zh: 放包依地藏求决择
    rationale: 片石在心内外窘无对，知词穷理绝，唯依席近月呈解方得见成
  - date: 0936
    title_zh: 赴临川崇寿开堂
    rationale: 议历览江表丛林，州牧有请，正可激发存知解者令服膺
- id: guji-文益-endeavor-2
  title_zh: 金陵弘法开立法眼宗
  summary: 应江南国主住报恩署净慧，晚住清凉随时仍旧垂手，海众千计付法德韶光大祖道
  phases:
  - key: brewing
    name: 崇寿领众激发
    labels:
      zh: 子方举拂微发翕然至海参常不减千计
    start_date: 0936
    highlight_event_id: guji-文益-event-chongshou
  - key: breakthrough
    name: 报恩清凉应请
    labels:
      zh: 江南国主重道迎住报恩署净慧后住清凉
    start_date: 0947
    highlight_event_id: guji-文益-event-qingliang
  - key: climax
    name: 曹源印可德韶
    labels:
      zh: 举曹源一滴水韶国师豁然开悟付嘱光大
    start_date: 0952
    highlight_event_id: guji-文益-event-guofa
  - key: closure
    name: 仍旧付嘱示寂
    labels:
      zh: 示随时及节仍旧无事人化潜耸恒等五百毳徒
    start_date: 0957
    highlight_event_id: guji-文益-event-death
  decisions:
  - date: 0947
    title_zh: 应国主住报恩清凉
    rationale: 国主重道丛林可聚，正可大施垂手接千众明六相唯心
  - date: 0952
    title_zh: 以曹源一滴印韶
    rationale: 韶闻是曹源一滴水豁然开悟，可为国王所师致祖道光大故付嘱
