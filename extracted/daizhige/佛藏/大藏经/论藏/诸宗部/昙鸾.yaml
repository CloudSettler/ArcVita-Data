  decisions:
  - date: 0529
    title_zh: 焚仙经归净土
    rationale: 方术延寿终归无常，不及佛法无量寿，故焚仙经专依往生经论。
  - date: '0531'
    title_zh: 住大岩寺专弘持名
    rationale: 为令凡夫得易行入正定聚，故以十念相续为要劝同愿同行。
- id: guji-昙鸾-endeavor-2
  title_zh: 注经著论建立安乐净土义
  summary: 注无量寿经优婆提舍愿生偈，略论安乐净土义，辨三辈胎生破四疑显佛智。
  phases:
  - key: brewing
    name: 研寻无量寿经及诸佛土行
    labels:
      zh: 研经酝酿
    start_date: '0530'
    highlight_event_id: guji-昙鸾-event-meet
  - key: breakthrough
    name: 注往生论明二十九种庄严
    labels:
      zh: 立义突破
    start_date: '0532'
    highlight_event_id: guji-昙鸾-event-annotate
  - key: climax
    name: 略论净土问答破疑显信
    labels:
      zh: 破疑高峰
    start_date: '0533'
    highlight_event_id: guji-昙鸾-event-annotate
  - key: closure
    name: 赞十念相续付嘱后学
    labels:
      zh: 付嘱圆成
    start_date: '0540'
    highlight_event_id: guji-昙鸾-event-preach
  decisions:
  - date: '0532'
    title_zh: 依二种清净释净土庄严
    rationale: 为显安乐非三界所摄别业所成，故以器世间众生世间摄二十九种庄严。
  - date: '0533'
    title_zh: 以五智对治四疑明胎生
    rationale: 为令疑者识罪悔离边地，故以不思议等五智破疑立信归正定聚。
