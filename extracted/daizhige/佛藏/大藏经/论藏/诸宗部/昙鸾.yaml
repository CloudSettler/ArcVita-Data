  title_zh: 弃方术转弘净土念佛往生
  summary: 由厌无常求仙转向归命阿弥陀本愿，专提他力易行道，劝十念相续往生。
  phases:
  - key: brewing
    name: 雁门出家习学兼慕长生
    labels:
