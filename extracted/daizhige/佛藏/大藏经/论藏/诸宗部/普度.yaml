  birth_date: 1255
  death_date: 1320
  era: 元
  reign_ref: 元成宗大德至武宗至大至仁宗皇庆延祐
  archetype: 净土弘护型
  dilemmas:
  - 禅净分帜如敌国如何会归一揆同证菩提
  - 去古已远法流成弊邪正混淆如何剖分伪真
  - 白莲宗屡遭疑禁如何奏请圣旨护持正传
  lesson: 探赜先宗明辨邪正，以信愿行立正因，以奏请刊行护正法，令群品同归极乐
  summary_first_person: 吾丹阳蒋氏子，家世事佛，弱冠厌俗，投簪剃发，初参龙华宝山慧禅师，历叩诸老，达心净土，见自性弥陀，痛惜祖道湮微，邪说混淆，遂探经忏要旨，集为宝鉴十门，赴大都奏金轮，颁旨刊行，愿与大地众生同念弥陀，共生极乐
  source_urls:
  - https://daizhige.org/佛藏/大藏经/论藏/诸宗部/廬山蓮宗寶鑑.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/论藏/诸宗部/廬山蓮宗寶鑑.md
endeavors:
- id: guji-普度-endeavor-1
  title_zh: 编集庐山莲宗宝鉴立念佛正宗
  summary: 探赜先宗要旨，分十门剖邪显正，明正因正教正宗正派正信正行正愿及往生正诀正报正论
  phases:
  - key: brewing
    name: 翘心净土探赜先宗
    labels:
      zh: 酝酿
    start_date: 1275
    highlight_event_id: guji-普度-event-ordination
  - key: breakthrough
    name: 述集警要成十门纲目
    labels:
      zh: 突破
    start_date: 1300
    highlight_event_id: guji-普度-event-compilation
  - key: climax
    name: 大德乙巳题叙示众
    labels:
      zh: 高潮
    start_date: 1305-11-17
    highlight_event_id: guji-普度-event-compilation
  - key: closure
    name: 诸山印证流通护教
    labels:
      zh: 收束
    start_date: 1312-01-15
    highlight_event_id: guji-普度-event-print
  decisions:
  - date: 1300
    title_zh: 定十门名曰宝鉴
    rationale: 以正因开户，以正教示渐偏顿圆，以正宗明心，以正派溯源，以信愿行导归，以正诀示临终，以正报显庄严，以正论破邪见，令枉者直疑者决
  - date: 1305-11-17
    title_zh: 以弥陀示相日题叙流通
    rationale: 悲去古时遥群盲摸象，逢佛心天子流通之际，发明佛祖念佛三昧，作将来眼目，劝见闻随喜赞辅流通
- id: guji-普度-endeavor-2
  title_zh: 住持东林善法堂奏请刊行护白莲宗
  summary: 领白莲宗善法堂主，开导人天，赍宝鉴赴大都，咨扣国师，蒙皇帝颁旨刊板护持
  phases:
  - key: brewing
    name: 住东林开导念佛三昧
    labels:
      zh: 酝酿
    start_date: 1295
    highlight_event_id: guji-普度-event-ordination
  - key: breakthrough
    name: 赍鉴赴大都咨扣国师
    labels:
      zh: 突破
    start_date: 1308-10-11
    highlight_event_id: guji-普度-event-memorial
  - key: climax
    name: 蒙金轮奖称颁旨刊板
    labels:
      zh: 高潮
    start_date: 1308-10-11
    highlight_event_id: guji-普度-event-memorial
  - key: closure
    name: 明理不花寺镂板祝延流通
    labels:
      zh: 收束
    start_date: 1312-01-15
    highlight_event_id: guji-普度-event-print
  decisions:
  - date: 1308-10-11
    title_zh: 捧鉴启奉令旨请刊行
    rationale: 契合佛经无丛脞，须借圣朝力洗佛日重光，起远公之风于千载，策精进发阐提同成佛道
  - date: 1312-01-15
    title_zh: 以洪因祝延圣寿皇图
    rationale: 以刊板功德祝皇帝圣寿万安，太后皇后齐年，太子诸王千秋，官僚增禄，皇图永固，佛日光辉，见闻同成佛道
events:
- id: guji-普度-event-birth
  title_zh: 生于丹阳蒋氏家世事佛
  date: 1255
  year_of: 1255
  place_zh: 浙之丹阳
  description: 蒋氏家世事佛积善，生而敏锐，为后日厌俗学佛之远因
- id: guji-普度-event-ordination
  title_zh: 弱冠出家参龙华宝山悟净土
  date: 1275
  year_of: 1275
  place_zh: 龙华宝山
  description: 弱冠厌俗缘投簪剃发，初参龙华宝山慧禅师，一见器之，历叩诸老，琢磨淘汰，达心净土，见自性弥陀
- id: guji-普度-event-compilation
  title_zh: 大德乙巳集莲宗宝鉴题叙
  date: 1305-11-17
  year_of: 1305
  place_zh: 江州庐山东林禅寺白莲宗善法堂
  description: 翘心净土探赜先宗，编集要言为十篇，首正因，次正教正宗正派，次正信正行正愿，次往生正诀正报正论，于弥陀示相日斋沐题叙，得天童东岩圆应日禅师印证
- id: guji-普度-event-memorial
  title_zh: 至大元年捧鉴赴阙蒙旨刊行
  date: 1308-10-11
  year_of: 1308
  place_zh: 大都隆福宫
  description: 赍宝鉴来诣大都，礼拜罽宾国公班的答师父，咨扣灌顶国师证契佛经，亲捧启奉潜邸令旨，教刊板印行，得金轮皇帝奖称曰善
- id: guji-普度-event-print
  title_zh: 皇庆壬子镂板毕工祝延识记
  date: 1312-01-15
  year_of: 1312
  place_zh: 大都无量寿法王寺
  description: 于明理不花丞相施舍之无量寿法王寺内镂板毕工，以洪因祝延圣寿皇图，颁降圣旨遍行各省，重光佛日，振复虎溪祖风
- id: guji-普度-event-death
  title_zh: 延祐后示寂遗鉴垂无穷
  date: 1320
  year_of: 1320
  place_zh: 庐山东林
  description: 开导人天续佛慧命，融真混俗示火中莲，后之修净业者披阅是集洞明旨趣，弘扬垂之无穷
