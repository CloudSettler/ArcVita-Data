  dilemmas:
  - 三乘小乘名相交杂末学迷于共教不共教分齐如何以简要问答决择一乘别义
  - 性起缘起法界深玄难晓如何摄六道声闻直进菩萨同归普贤因果令正法久住
  lesson: 弘大教必先明教相分齐以问答决择破疑摄机方能立一乘宗本续慧命
  summary_first_person: 吾智俨终南太一至相沙门也少依杜顺帝心受称性之说息相还原专弘杂华一乘因果吾撮华严要义为五十问答辨小乘三乘一乘见佛受职作佛成佛因果转依诸门示共教不共教内外分齐以开普贤法界于当下愿末学由此作蹊径见镕融于毛海耳
  source_urls:
  - https://daizhige.org/佛藏/大藏经/论藏/诸宗部/华严五十要问答.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/论藏/诸宗部/华严五十要问答.md
