  decisions:
  - date: '0640'
    title_zh: 住持至相专弘华严不杂余宗
    rationale: 为息相还原须依菩提树下佛智为始专明法界缘起故舍杂行独弘一乘
  - date: '0660'
    title_zh: 以问答体撮要造五十要决择共不共教
    rationale: 为末学迷于内外严饰难扣觉门故设往复征责五十余条直示肯綮作入道蹊径
- id: guji-智俨-endeavor-2
  title_zh: 摄受法藏付嘱慧命开贤首先河
  summary: 晚年摄受法藏授以华严法界观门嘱令续弘临终付法使华严正统由云华而传贤首
  phases:
