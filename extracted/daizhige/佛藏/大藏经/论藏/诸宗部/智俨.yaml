  - key: climax
    name: 付嘱续弘华严嘱令讲传
    labels:
      zh: 付嘱流通
    start_date: '0667'
    highlight_event_id: guji-智俨-event-4
  - key: closure
    name: 示寂云华慧命由法藏续兴
    labels:
      zh: 示寂传灯
    start_date: 0668
    highlight_event_id: guji-智俨-event-death
  decisions:
  - date: 0658
    title_zh: 摄法藏为弟子倾囊相授不断慧命
    rationale: 见其堪任大法能开因果二人门故不惜正法专授一人以续华严宗脉
  - date: '0667'
    title_zh: 临终付法令续讲华严不令宗绝
    rationale: 为遐方终古大教遍播须得传人弘通故以搜玄要义及法界观付嘱令其继作
