  dilemmas:
  - title_zh: 经论广散与学人迷位
    description_zh: 唯识杂集华严瑜伽所说位次名义散漫难寻，初学不知何先何后，故须会归五位以定入道阶级
  - title_zh: 空有偏执与修断无据
    description_zh: 若不达遍计空依他有圆成实有无之境，及资粮加行见道修道之行，便堕妄执或废修证，故须明境明行明断
  lesson: 会繁归简，依五位三祇之纲渐次修断，方能趣入无上菩提
  summary_first_person: 吾唐沙门智周，承法相之绪，稽首三宝，依唯识杂集等论，开资粮加行通达修习究竟五位，明三性境与发心修行断障之要，撰大乘入道次第一卷，愿法朗长夜，拨众生重昏
