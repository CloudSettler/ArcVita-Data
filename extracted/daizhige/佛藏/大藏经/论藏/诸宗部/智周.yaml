endeavors:
- id: guji-智周-endeavor-1
  title_zh: 承传法相唯识宗义
  summary_zh: 少出家，依止慧沼等慈恩后嗣，专习唯识瑜伽杂集，弘传三性三无性及因明教观，绍隆唐初法相正统
  phases:
  - key: brewing
    name: 少出家从师受学
    labels:
      zh: 求法问道
    start_date: 0692
    highlight_event_id: guji-智周-event-study
  - key: climax
    name: 弘讲唯识化徒
    labels:
      zh: 弘法利生
    start_date: '0710'
    highlight_event_id: guji-智周-event-study
  decisions:
  - date: '0700'
    title_zh: 依止慧沼专宗唯识
    rationale: 欲绍慈恩玄奘窥基正传，舍杂就专，以瑜伽唯识为宗本
  - date: '0712'
    title_zh: 以教摄机不舍化导
    rationale: 愍生慕法故以讲诵传灯，令学人悟二空之理而起利他之行
- id: guji-智周-endeavor-2
  title_zh: 撰大乘入道次第明五位修断
  summary_zh: 依唯识杂集华严般若瑜伽等经论，总开资粮加行通达修习究竟五位，历三阿僧祇劫，详释名体修断，立唐法相入道纲要
  phases:
  - key: breakthrough
    name: 会通经论立五位总纲
    labels:
      zh: 会宗立纲
    start_date: '0720'
    highlight_event_id: guji-智周-event-compose
  - key: closure
    name: 详释名体垂训后学
    labels:
      zh: 撰述流通
    start_date: '0730'
    highlight_event_id: guji-智周-event-compose
  decisions:
  - date: '0725'
    title_zh: 依唯识杂集总摄三十心四加行十地
    rationale: 见十住十行十回向暖顶忍世第一法见道十地散在众典，故总为一卷以示始终
  - date: 0728
    title_zh: 先明发心后明修断
    rationale: 欲趣菩提必先发深固大菩提心，无欣趣则无修断，故以十门辨发心体因行相缘胜利等
