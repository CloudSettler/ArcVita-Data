  title_zh: 住持大興善寺傳持曼荼羅灌頂法統
  summary_zh: 從瑜伽阿闍梨發心受戒入壇灌頂紹阿闍梨位以三密門行如來事
  phases:
  - key: brewing
    name: 發心依師
    labels:
