    start_date: 0780
    highlight_event_id: guji-智慧轮-event-transmission
  - key: breakthrough
    name: 入壇灌頂
    labels:
      zh: 五智灌頂
    start_date: 0795
    highlight_event_id: guji-智慧轮-event-transmission
  - key: climax
    name: 紹位傳法
    labels:
      zh: 紹阿闍梨位
    start_date: 0800
    highlight_event_id: guji-智慧轮-event-transmission
  - key: closure
    name: 普攝群機
    labels:
      zh: 利樂有情
    start_date: 0810
    highlight_event_id: guji-智慧轮-event-stele
  decisions:
  - date: 0790
    title_zh: 從瑜伽阿闍梨受三昧耶戒
    rationale: 非發無上菩提心不受密戒不得入曼荼羅故先立信解以全法器
  - date: 0800
    title_zh: 非受五智灌頂不許傳教
    rationale: 灌頂乃冊命受位之義唯受佛智體金剛名號者方可紹佛傳法以護宗綱清淨
- id: guji-智慧轮-endeavor-2
  title_zh: 撰述明佛法根本碑會歸一乘三藏
  summary_zh: 立毗盧遮那為佛根本立真言陀羅尼為法根本明一字具攝契經調伏對法會通大小最上乘
  phases:
  - key: brewing
    name: 簡別三藏
    labels:
      zh: 契經律論
    start_date: 0805
    highlight_event_id: guji-智慧轮-event-stele
  - key: breakthrough
    name: 立一字總持
    labels:
      zh: 總持法門
    start_date: 0815
    highlight_event_id: guji-智慧轮-event-stele
  - key: climax
    name: 建碑明宗
    labels:
      zh: 立碑闡教
    start_date: 0820
    highlight_event_id: guji-智慧轮-event-stele
  - key: closure
    name: 偈贊流通
    labels:
      zh: 一乘流通
    start_date: 0825
    highlight_event_id: guji-智慧轮-event-stele
  decisions:
  - date: 0815
    title_zh: 以真言陀羅尼會通三藏教理
    rationale: 一字能生無量字能攝一切行果故以總持摧雜染證清淨不墮大小偏執
  - date: 0820
    title_zh: 作碑偈總攝灌頂相傳之旨
    rationale: 為令未入者入已入者持已持者悟故撮十萬頌要義勒石以示後學
events:
- id: guji-智慧轮-event-birth
  date: '0750'
  year_of: 750
  title_zh: 誕生於唐代中葉
  description_zh: 生於唐世少習經教後慕瑜伽密乘莫詳里族唯以傳法立碑見稱
- id: guji-智慧轮-event-transmission
  date: 0800
  year_of: 800
  title_zh: 受五智灌頂紹曼荼羅阿闍梨位
  description_zh: 從瑜伽阿闍梨發心受三昧耶戒入大曼荼羅受大毗盧遮那五智灌頂紹阿闍梨位住大興善寺行三密化益
  place_zh: 大興善寺
- id: guji-智慧轮-event-stele
  date: 0820
  year_of: 820
  title_zh: 撰述明佛法根本碑
  description_zh: 闡明佛根本即大毗盧遮那法根本即真言陀羅尼明一字總持具攝三藏及最上乘頓證三身之旨勒碑並繫以一乘三藏偈
  place_zh: 大興善寺
- id: guji-智慧轮-event-death
  date: 0830
  year_of: 830
  title_zh: 示寂於唐文宗前後
  description_zh: 傳法化益之後示寂於世後人唯傳其碑教以為密教根本之訓
