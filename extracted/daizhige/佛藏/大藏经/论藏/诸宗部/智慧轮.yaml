  dilemmas:
  - 顯密經律論分判紛紜如何會歸一乘根本
  - 灌頂傳承嚴格如何普應群機而不失宗綱
  lesson: 以毗盧遮那為佛根本以真言陀羅尼為法根本於一字中總持三藏普利群生
  summary_first_person: 吾住大興善寺紹曼荼羅阿闍梨位受五智灌頂以一字總持攝盡三藏立此碑以明佛法根本
