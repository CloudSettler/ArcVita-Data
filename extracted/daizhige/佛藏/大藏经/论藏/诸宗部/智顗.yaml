endeavors:
- id: guji-智顗-endeavor-1
  title_zh: 释摩诃般若立觉意三昧观门
  description: 依摩诃般若辩法相，释觉意三昧名义，立六度方便，总别观四运心，会七觉意，令行人反照心源入深法性。
  phases:
  - key: brewing
    name: 大誓庄严修六度方便
    labels:
      zh:
      - 大誓调心
      - 六度伏蔽
    start_date: '0575'
    highlight_event_id: guji-智顗-event-tiantai
  - key: breakthrough
    name: 明四运心相摄一切心
    labels:
      zh:
      - 四运观境
      - 未念欲念
    start_date: 0585
    highlight_event_id: guji-智顗-event-guanxin
  - key: climax
    name: 四句推检双照二谛
    labels:
      zh:
      - 反照观察
      - 七觉圆显
    start_date: 0594
    highlight_event_id: guji-智顗-event-jueyi
  - key: closure
    name: 门人灌顶记录成书
    labels:
      zh:
      - 付嘱流通
      - 觉意三昧
    start_date: 0595
    highlight_event_id: guji-智顗-event-jueyi
  decisions:
  - date: 0585
    title_zh: 举意摄心识统一切法
    rationale: 心意识造一切法本源，破意无明则余使随灭，故但举觉意以明三昧
  - date: 0594
    title_zh: 以四句破生灭入中道正慧
    rationale: 未念欲念生灭皆不可得，不得二边则不取结业，正观如虚空而双照朗然
- id: guji-智顗-endeavor-2
  title_zh: 栖心天台开宗摄化帝王
  description: 承慧思禅法，止观双运，陈隋两代弘化，居天台说法，为陈后主及隋晋王授戒，开天台一宗。
  phases:
  - key: brewing
    name: 荆州出家师事慧思
    labels:
      zh:
      - 出家学禅
      - 法华三昧
    start_date: '0556'
    highlight_event_id: guji-智顗-event-congshi
  - key: breakthrough
    name: 入天台山结庐弘禅
    labels:
      zh:
      - 天台栖止
      - 止观弘化
    start_date: '0575'
    highlight_event_id: guji-智顗-event-tiantai
  - key: climax
    name: 王宫说法授菩萨戒
    labels:
      zh:
      - 国师化导
      - 菩萨戒法
    start_date: 0585
    highlight_event_id: guji-智顗-event-guanxin
  - key: closure
    name: 石城示寂付嘱后学
    labels:
      zh:
      - 示寂传法
      - 灌顶承绪
    start_date: 0597
    highlight_event_id: guji-智顗-event-death
  decisions:
  - date: '0575'
    title_zh: 择天台幽静以修总别二观
    rationale: 坐中审谛方能一切处用心，先闲室调身心而后历缘对境不失正观
  - date: 0593
    title_zh: 为晋王杨广授菩萨戒而不舍俗化
    rationale: 怜愍众生兴起方便，虽知无住无行而以七觉善巧修自利利他行
events:
- id: guji-智顗-event-birth
  title_zh: 荆州华容诞生
  date: 0538
  year_of: 538
  place_zh: 荆州华容
  description: 梁大同四年生于荆州，陈氏子，字德安，七岁即好佛寺，见佛像而喜。
- id: guji-智顗-event-congshi
  title_zh: 出家从慧思受法华安乐行
  date: '0560'
  year_of: 560
  place_zh: 光州大苏山
  description: 十八岁出家，二十三岁北从慧思学禅，证法华三昧，得师付嘱，令弘天台教观。
- id: guji-智顗-event-tiantai
  title_zh: 入天台山建寺弘止观
  date: '0575'
  year_of: 575
  place_zh: 台州天台山
  description: 陈太建七年入天台，结庐说法，栖心禅观，陈后主迎为国师而不就，名震江表。
- id: guji-智顗-event-guanxin
  title_zh: 金陵弘法授王菩萨戒
  date: 0585
  year_of: 585
  place_zh: 金陵及扬州
  description: 陈隋之际往返金陵扬州，为众讲法华摩诃般若，为晋王杨广授菩萨戒，号智者大师。
- id: guji-智顗-event-jueyi
  title_zh: 说释摩诃般若觉意三昧
  date: 0594
  year_of: 594
  place_zh: 荆州玉泉寺
  description: 系玉泉弘化之时，说觉意三昧五重，辩法相，明心相，入观门，会七觉，门人灌顶笔受成书。
- id: guji-智顗-event-death
  title_zh: 石城寺端坐示寂
  date: '0597-11-24'
  year_of: 597
  place_zh: 台州石城寺
  description: 隋开皇十七年十一月二十四日，端坐入灭，世寿六十，隋文帝为之废朝，谥智者大师。
