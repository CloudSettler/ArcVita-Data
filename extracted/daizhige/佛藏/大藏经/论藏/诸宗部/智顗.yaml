  era: 隋
  reign_ref: 隋文帝开皇
  archetype: 天台开宗弘法圣哲
  dilemmas:
  - 心性本空而妄惑炽盛，如何反照心源以破无明
  - 自证涅槃与大悲度生之间，如何不住真如而兴万行
  - 止观定慧与六度万行之间，如何调伏粗心而入深三昧
  lesson: 以慧日照心空，反观四运心相，七觉调直，悲智双运，即入觉意海。
  summary_first_person: 吾智顗，荆州华容人，少依果愿，终师慧思，栖心天台。为度生死海，说摩诃般若觉意三昧，以四运观心，以七觉调直，令行人反照心源，朗然圆显二谛，流入涅槃，门人灌顶所记，即吾心要。
  source_urls:
