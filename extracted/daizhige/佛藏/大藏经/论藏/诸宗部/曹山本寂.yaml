  decisions:
  - date: 0873
    title_zh: 慕六祖名山为曹
    rationale: 志慕六祖遂名山为曹，更何王观为荷玉，借祖地标宗以聚云萃学者
  - date: 0885
    title_zh: 作五位君臣偈颂示众
    rationale: 恐学人杂真际以顽空，故以君臣偏正兼带明凡圣生熟，使虚玄大道有据可详审
events:
- id: guji-曹山本寂-event-birth
  date: 0840
  year_of: 840
  title_zh: 莆田黄氏诞生
  description_zh: 泉州莆田黄氏子，少业儒，后出家，是为曹山本寂
- id: guji-曹山本寂-event-ordination
  date: 0859
  year_of: 859
  title_zh: 灵石出家登戒
  description_zh: 年十九往福州灵石出家，年二十五登戒，寻谒洞山
- id: guji-曹山本寂-event-meet-dongshan
  date: 0866
  year_of: 866
  title_zh: 谒洞山入室盘桓
  description_zh: 谒洞山问名答不道不名本寂，深器之，自此入室盘桓数载
- id: guji-曹山本寂-event-transmission
  date: 0869
  year_of: 869
  title_zh: 不变异处密授宗旨
  description_zh: 辞去时洞山密授宗旨，问向甚处去，答不变异处去去亦不变异
- id: guji-曹山本寂-event-pilgrimage
  date: 0870
  year_of: 870
  title_zh: 往曹溪礼祖塔回吉水
  description_zh: 往曹溪礼六祖塔，回吉水，众向师名乃请开法
- id: guji-曹山本寂-event-abbacy
  date: 0873
  year_of: 873
  title_zh: 名山为曹迁荷玉住持
  description_zh: 志慕六祖名山为曹，值贼乱之宜黄，信士舍何王观请住持，更名荷玉，法席大兴
- id: guji-曹山本寂-event-teaching
  date: 0885
  year_of: 885
  title_zh: 示五位君臣旨诀
  description_zh: 因僧问五位君臣旨诀，示正偏兼带及君臣道合语，更作偈令学者先识自宗
- id: guji-曹山本寂-event-death
  date: 0901
  year_of: 901
  title_zh: 曹山示寂宗风大盛
  description_zh: 住持弘化多年，洞山之宗至师为盛，示寂于唐末，语录由门人集刊并行于世
