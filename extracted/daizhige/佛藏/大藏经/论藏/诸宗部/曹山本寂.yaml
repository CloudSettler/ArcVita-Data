    title_zh: 不道本寂而契洞山
    rationale: 洞山问名向上更道，答不道不名本寂，以离名言显正位空界，故深器而得入室
  - date: 0869
    title_zh: 答不变异处去
    rationale: 问子向甚处去，答不变异处去去亦不变异，不落去留变易，故堪付宗旨而行
- id: guji-曹山本寂-endeavor-2
  title_zh: 住持曹山大兴法席
  summary_zh: 礼曹溪回吉水应请开法，慕六祖名山为曹，值乱迁宜黄荷玉，以五位君臣偈颂大弘洞上之宗
  phases:
  - key: brewing
