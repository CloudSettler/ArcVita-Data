  - 守洞山正偏兼带宗要与随机活用开示的张力
  - 守不变异处避世与应请住持弘化利生的抉择
  lesson: 背理就事舍事入理皆是偏执，唯君臣道合兼带冥应方见不变异中活人
  summary_first_person: 我本寂莆田黄氏子，十九往灵石出家，亲承洞山盘桓数载，密授宗旨答不变异处去，慕六祖而名山为曹，以五位君臣接人，愿后人详审兼带不堕诸有
