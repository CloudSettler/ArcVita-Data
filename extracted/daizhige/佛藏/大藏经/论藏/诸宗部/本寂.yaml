  place_zh: 泉州莆田
  summary: 唐文宗开成中生于泉州莆田黄氏，少业儒，聪敏慕道。
- id: guji-曹山本寂-event-ordination
  date: 0865
  year_of: 865
  title_zh: 灵石出家登戒
  place_zh: 福州灵石
  summary: 年十九往福州灵石出家，年二十五登戒，寻师访道。
- id: guji-曹山本寂-event-dongshan
  date: 0868
  year_of: 868
  title_zh: 谒洞山得密授
  place_zh: 筠州洞山
  summary: 谒洞山良价答不名本寂深蒙器重，入室盘桓数载得密授洞上宗旨，问对不变异处去。
- id: guji-曹山本寂-event-caoshan
  date: 0880
  year_of: 880
  title_zh: 住持荷玉名山为曹
  place_zh: 抚州曹山荷玉
  summary: 礼曹溪祖塔回吉水开法，避乱至宜黄居信士所舍何王观，更名荷玉，慕六祖名山为曹，法席大兴。
- id: guji-曹山本寂-event-teaching
  date: 0890
  year_of: 890
  title_zh: 阐五位君臣兼带
  place_zh: 曹山荷玉
  summary: 示众三种堕回互相食，答五位君臣旨诀作偈明正偏兼带，接云门镜清诸禅者，洞上之宗至此为盛。
- id: guji-曹山本寂-event-death
  date: 0901
  year_of: 901
  title_zh: 荷玉示寂
  place_zh: 抚州曹山
  summary: 唐昭宗天复元年示寂于荷玉，塔于曹山，语录经郭凝之編集玄契重集而传于世。
