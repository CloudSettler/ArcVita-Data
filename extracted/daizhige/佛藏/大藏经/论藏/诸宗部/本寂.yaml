  decisions:
  - date: 0859
    title_zh: 弃儒往灵石出家
    rationale: 少业儒而志在出世故年十九往福州灵石出家求道
  - date: 0868
    title_zh: 辞洞山往曹溪礼塔
    rationale: 既得密授宗旨须礼祖塔印证本源再图开法故云不变异处去
- id: guji-曹山本寂-endeavor-2
  title_zh: 住持曹山大兴宗风
  summary: 回吉水应请开法，值乱之宜黄居荷玉，名山为曹，阐发五位君臣兼带，以偈颂接引云萃学者，使洞山之宗至此为盛。
  phases:
  - key: climax
    name: 曹山开法立宗
    labels:
      zh: 开法立宗
    start_date: 0880
    highlight_event_id: guji-曹山本寂-event-caoshan
  - key: closure
    name: 阐发五位垂示学人
    labels:
      zh: 著述垂训
    start_date: 0890
    highlight_event_id: guji-曹山本寂-event-teaching
  decisions:
  - date: 0880
    title_zh: 更何王为荷玉名山为曹
    rationale: 志慕六祖又有信士王若一舍观请住故改观名弘曹溪家风
  - date: 0890
    title_zh: 作五位君臣偈发明宗要
    rationale: 恐学者杂真际于顽空故以君臣偏正兼带详审辩明令转得自己作主宰
