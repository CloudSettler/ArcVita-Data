person:
  qid: guji-曹山本寂
  name_zh: 本寂
  names:
    zh: 曹山本寂
    en: Caoshan Benji
  lifespan:
    birth:
      date: 0840
      precision: year
      is_circa: true
      raw: 泉州莆田黄氏子
    death:
      date: 0901
      precision: year
      is_circa: false
      raw: 唐天复元年示寂
  birth_date: 0840
  death_date: 0901
  era: 唐末
  reign_ref: 唐昭宗天复元年
  archetype: 禅宗祖师
  dilemmas:
  - 守不变异处安住本分与应机开法广度学者之间如何抉择
  - 执言标而作葛藤与忘言得旨而传洞上宗要之间如何取舍
  lesson: 于不变异处随缘应机以君臣偏正兼带接引学者方能使洞上宗风大盛
  summary_first_person: 我是泉州莆田黄氏子本寂，少业儒，十九岁往福州灵石出家，二十五登戒，寻谒洞山良价入室盘桓数载得密授宗旨，立不变异处去之志，礼曹溪祖塔后开法吉水，值乱居宜黄荷玉，慕六祖而名山为曹，阐五位君臣兼带之旨，终老于荷玉。
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/T1987B
  - https://github.com/daizhige-org/daizhigev20
endeavors:
- id: guji-曹山本寂-endeavor-1
  title_zh: 洞山参学得法
  summary: 弃儒出家受戒后寻谒洞山良价，盘桓数载入室参究，得密授洞上宗旨，立去亦不变异之志。
  phases:
  - key: brewing
    name: 灵石出家受戒
    labels:
      zh: 出家求道
    start_date: 0859
    highlight_event_id: guji-曹山本寂-event-ordination
  - key: breakthrough
    name: 洞山入室得法
    labels:
