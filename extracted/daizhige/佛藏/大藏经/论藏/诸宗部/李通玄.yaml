  date: '0720'
  year_of: 720
  place_zh: 太原
  description_zh: 释十二缘生立十明，从所生本有无常等乃至超度成一切智海，明迷解同佛大智大悲
- id: guji-李通玄-event-death
  title_zh: 示寂
  date: '0730'
  year_of: 730
  place_zh: 五台山下
  description_zh: 开元末年示寂，遗教以空慧入行海，长养慈悲，如莲处水不染
