    rationale: 十二有支即智海悲海，若厌此别求，如舍冰求水，故须十明次第开显
  - date: '0720'
    title_zh: 不说本有修生定执
    rationale: 言本有则增益谤，言修生则损减谤，离四谤方显无生智，令学者无心合道
events:
