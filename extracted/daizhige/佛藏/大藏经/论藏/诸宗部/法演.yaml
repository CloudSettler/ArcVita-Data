endeavors:
- id: guji-法演-endeavor-1
  title_zh: 四面白云开堂弘法
  summary: 自海上云游至龙舒，初住四面再住白云海会，开堂拈香升座，以第一义第二义门接引朝宰衲子。
  phases:
  - key: brewing
    name: 海上云游参寻
    labels:
      zh: 云游参学
    start_date: 1060
    highlight_event_id: guji-法演-event-simianshan
  - key: breakthrough
    name: 四面开堂升座
    labels:
      zh: 开堂说法
    start_date: 1072
    highlight_event_id: guji-法演-event-simianshan
  - key: climax
    name: 白云授帖披衣
    labels:
      zh: 传法嗣座
    start_date: 1075
    highlight_event_id: guji-法演-event-baiyun
  - key: closure
    name: 白云四面守封疆而放一线
    labels:
      zh: 安众收束
    start_date: 1078
    highlight_event_id: guji-法演-event-baiyun
  decisions:
  - date: 1072
    title_zh: 拈香三瓣为国为民雪屈
    rationale: 以君亲外护为先，立丛林正向，借冤仇相遇因缘明师承有自。
  - date: 1075
    title_zh: 示第一义凡圣路绝
    rationale: 破言句滞壳狂见，令衲僧无出气处而自发出气，显云门临济家风。
- id: guji-法演-endeavor-2
  title_zh: 太平龙门接众传灯
  summary: 次住太平禅院，再至龙门兴化海会，举古则颂古，以夺人夺境四句及拈花棒喝培养圜悟克勤清远等法嗣。
  phases:
  - key: brewing
    name: 别双泉入太平
    labels:
      zh: 入院领众
    start_date: 1080
    highlight_event_id: guji-法演-event-taiping
  - key: breakthrough
    name: 太平宾主四句示众
    labels:
      zh: 宾主勘辨
    start_date: 1082
    highlight_event_id: guji-法演-event-taiping
  - key: climax
    name: 龙门兴化把手共行
    labels:
      zh: 游方弘化
    start_date: 1090
    highlight_event_id: guji-法演-event-longmen
  - key: closure
    name: 付嘱三佛眼圜悟诸子
    labels:
      zh: 传灯付嘱
    start_date: 1100
    highlight_event_id: guji-法演-event-longmen
  decisions:
  - date: 1080
    title_zh: 示露胸跣足大赦不放为佛法僧
    rationale: 以平常淈盾语破圣凡执，令学人转凡成圣不坏世谛。
  - date: 1090
    title_zh: 拈云门露柱相交为第四机
    rationale: 不随云门自代，另行拈出以显活句，激后学不甘滞壳而自立。
events:
- id: guji-法演-event-birth
  title_zh: 生于绵州巴西葛氏
  date: 1024
  year_of: 1024
  place_zh: 绵州巴西
  summary: 北宋天圣年间生，俗姓葛，后出家云游参禅。
- id: guji-法演-event-simianshan
  title_zh: 初住四面山开堂
  date: 1072
  year_of: 1072
  place_zh: 舒州四面山
  summary: 授疏升座，拈香为帝为官僚，举第一义拄杖语接众，参学才良编录语录卷上。
- id: guji-法演-event-baiyun
  title_zh: 住白云海会授帖披衣
  date: 1075
  year_of: 1075
  place_zh: 舒州白云山海会寺
  summary: 宣帖授法衣，披衣升座，举德山不答话及浮山白云悟处示众。
- id: guji-法演-event-taiping
  title_zh: 次住太平禅院入院说法
  date: 1080
  year_of: 1080
  place_zh: 太平寺
  summary: 入院上堂答太平境境中人，示宾中宾主中主四句，参学清远集录。
- id: guji-法演-event-longmen
  title_zh: 至龙门兴化海会说法传灯
  date: 1090
  year_of: 1090
  place_zh: 龙门兴化海会
  summary: 上堂示有舌无口风流儒雅，甘露资长老相访勘辨，座下出圜悟克勤佛眼清远等。
- id: guji-法演-event-death
  title_zh: 示寂于五祖山
  date: 1104
  year_of: 1104
  place_zh: 蕲州五祖山
  summary: 崇宁三年示寂，世称五祖法演，塔于本山，语录由才良清远等编行世。
