  archetype: 禅师
  dilemmas:
  - 第一义不可说而须为人剖露
  - 守封疆与放出气之间的接众分寸
  lesson: 不立一尘亦不废一尘，直指当下，贵在亲证。
  summary_first_person: 吾法演，绵州人，云游十余载，参浮山圆鉴、白云守端而得铁酸馅之味，住四面白云太平龙门，接众以喝棒机锋，令佛果佛鉴佛眼诸子灯灯相续。
