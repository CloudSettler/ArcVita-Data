  - 以音声语言作佛事恐被斥为著相，然为摄化群品不得不立声教
  - 欲以五会真声普度道俗，又恐滥授失宗误导后学
  lesson: 依弥陀四十八愿立五会声教，理事双修相无相念，与中道实相相应，令凡夫顿舍凡身往生极乐
  summary_first_person: 吾法照南岳沙门，于弥陀台般舟道场依无量寿经作五会念佛，后于上都章敬寺净土院述略法事仪赞，愿众生离五浊断五盖，同生安乐速成菩提
