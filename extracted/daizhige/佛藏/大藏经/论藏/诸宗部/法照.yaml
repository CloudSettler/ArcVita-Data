  decisions:
  - date: 0766-04
    title_zh: 依无量寿经作五会念佛
    rationale: 见宝树清风出五会音声皆念佛法僧，欲令闻者得深法忍住不退转，故定五种声节
  - date: 0766-06
    title_zh: 定第一至第五会缓急念法
    rationale: 以声势点大小明缓急，从平声缓念至四字转急念，使终日念佛恒顺真性
- id: guji-法照-endeavor-2
  title_zh: 章敬寺述略法事仪赞弘传
  summary_zh: 于上都章敬寺净土院述净土五会念佛略法事仪赞，立请赞庄严次第，传五会真声于未来
