  decisions:
  - date: 504
    title_zh: 定略法事道俗同修仪则
    rationale: 为令三五人至六七人皆可修持，须威仪齐整专心观佛，故立座主副座香火之制
  - date: 505
    title_zh: 以第三会和诸赞回向发愿
    rationale: 使散华乐宝鸟赞等皆归念佛三昧，普为法界怨亲同生极乐，故须专学真声不得滥授
