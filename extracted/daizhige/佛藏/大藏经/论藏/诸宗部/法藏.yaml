endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 承智俨弘华严大成一宗
  summary_zh: 自太白求法至从智俨出家再经武周译场笔受新译华严终成贤首宗义
  phases:
  - key: brewing
    name: 生于长安太白求法
    labels:
      zh: 酝酿
    start_date: '0643'
    highlight_event_id: guji-法藏-event-birth
  - key: breakthrough
    name: 从智俨出家禀华严法界
    labels:
      zh: 突破
    start_date: 0669
    highlight_event_id: guji-法藏-event-ordination
  - key: climax
    name: 入实叉难陀译场笔受八十华严
    labels:
      zh: 高峰
    start_date: 0695
    highlight_event_id: guji-法藏-event-translation
  - key: closure
    name: 被尊贤首国师化行朝野
    labels:
      zh: 收束
    start_date: '0705'
    highlight_event_id: guji-法藏-event-bodhicitta
  decisions:
  - date: 0669
    title_zh: 舍俗从俨专学华严
    rationale: 非圣教无以成行非得旨无以入观故投智俨以承法界缘起之宗
  - date: 0695
    title_zh: 应诏入译场笔受圣言
    rationale: 称性之教即是正行故不舍文字而融理事以弘新译大经
- id: guji-法藏-endeavor-2
  title_zh: 述发菩提心章立法界行门
  summary_zh: 依起信三心开三十心以简教十类拣去背教滞文之失以显过表德明真空无碍周遍含容之观
  phases:
  - key: brewing
    name: 探玄判教简别大小始终
    labels:
      zh: 酝酿
    start_date: 0690
    highlight_event_id: guji-法藏-event-translation
  - key: breakthrough
    name: 立会色归空明空即色之解
    labels:
      zh: 突破
    start_date: 0698
    highlight_event_id: guji-法藏-event-translation
  - key: climax
    name: 述发菩提心章示五门表德
    labels:
      zh: 高峰
    start_date: '0700'
    highlight_event_id: guji-法藏-event-bodhicitta
  - key: closure
    name: 以理事圆融十门付嘱后学
    labels:
      zh: 收束
    start_date: '0712'
    highlight_event_id: guji-法藏-event-death
  decisions:
  - date: '0700'
    title_zh: 以三心三十心示发心相
    rationale: 直心深心大悲心各开十门令广大甚深巧便之行皆归法界故作此章
  - date: '0700'
    title_zh: 立简教十类显过四句
    rationale: 斥舍教妄修与执文昧理之失以即非即俱俱非之破显理事无碍之正解
events:
- id: guji-法藏-event-birth
  date: '0643'
  year_of: 643
  title_zh: 生于长安康氏之家
  description: 唐贞观十七年生于长安本康居之后少好学求法于太白山
- id: guji-法藏-event-ordination
  date: 0669
  year_of: 669
  title_zh: 从智俨出家学华严
  description: 年二十七从云华智俨出家禀受华严法界缘起之旨尽得其传
- id: guji-法藏-event-translation
  date: 0695
  year_of: 695
  title_zh: 笔受八十华严弘传朝野
  description: 应武后之诏入实叉难陀译场笔受新译华严大经敷演宗义深得朝廷敬信
- id: guji-法藏-event-bodhicitta
  date: '0700'
  year_of: 700
  title_zh: 述华严发菩提心章
  description: 述发心简教显过表德四分具陈真空观理事无碍观周遍含容观及色空十门止观理事圆融义
- id: guji-法藏-event-death
  date: '0712'
  year_of: 712
  title_zh: 先天元年圆寂
  description: 唐先天元年示寂于长安世寿七十后谥号国一法师尊为华严三祖贤首大师
