    start_date: 0691
    highlight_event_id: guji-法藏-event-death
  decisions:
  - date: 0690
    title_zh: 以见边之喻晓无涯之法
    rationale: 华严理深事广非入理圣人难达其奥故借金师子有形之像显无形之真理
  - date: 0690
    title_zh: 合理事以明缘起无生
    rationale: 为破情执显真空故说金收师子尽相即无相生即无生令学者睹相当体入金
