  dilemmas:
  - 如何会通人天小乘三乘一乘所说三宝体性不同而不相违
  - 如何舍权归实立同相究竟归依而不坏别相住持功用
  lesson: 以同摄别以别显同，同别不二方能安立信仰与修行
  summary_first_person: 吾本康居苗裔，生于长安，少慕玄门，从智俨学华严，蒙武后礼遇参译弘讲，判五教立一乘宗义，造探玄记及明法品三宝章，以同相别相住持三门显佛法僧，融摄归于法界，愿众生因言得义舍末归本
  source_urls:
