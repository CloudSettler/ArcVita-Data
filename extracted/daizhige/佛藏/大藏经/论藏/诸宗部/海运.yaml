  phases:
  - key: brewing
    name: 搜集众经发心义
    labels:
      zh: 释名求觉
    start_date: 0725-01-01
    highlight_event_id: guji-海运-event-1
  - key: breakthrough
    name: 立五门纲格
    labels:
      zh: 体性一异
    start_date: 0730-01-01
    highlight_event_id: guji-海运-event-2
  - key: climax
    name: 详辨行位功用
    labels:
      zh: 相状证成
    start_date: 0732-01-01
    highlight_event_id: guji-海运-event-2
  - key: closure
    name: 成菩提心义一卷
    labels:
      zh: 著述完成
    start_date: 0735-01-01
    highlight_event_id: guji-海运-event-2
  decisions:
  - date: 0730-01-01
    title_zh: 依主相违二释立菩提心名义
    rationale: 为破执菩提与心为二或为一故兼存依主相违二释以显迷悟缘起
  - date: 0732-01-01
    title_zh: 会真妄无二与进修异门
    rationale: 理体无差别故说无二，进修起行愿故说真妄为异，藉起信熏习义贯通
- id: guji-海运-endeavor-2
  title_zh: 弘传发菩提心行愿
  summary: 引显扬毗卢遮那疏发心经等明誓愿六度四缘十因劝修真实发心
  phases:
  - key: brewing
    name: 劝亲近善知识修善根
    labels:
      zh: 四缘发起
    start_date: 0735-01-01
    highlight_event_id: guji-海运-event-3
  - key: breakthrough
    name: 明行愿功用如种田灯药
    labels:
      zh: 功用劝信
    start_date: 0738-01-01
    highlight_event_id: guji-海运-event-3
  - key: climax
    name: 立四弘誓六波罗蜜正行
    labels:
      zh: 誓愿正行
    start_date: 0740-01-01
    highlight_event_id: guji-海运-event-4
  - key: closure
    name: 结归出家具足流通
    labels:
      zh: 流通结劝
    start_date: 0742-01-01
    highlight_event_id: guji-海运-event-4
  decisions:
  - date: 0738-01-01
    title_zh: 广引华严维摩喻显功用
    rationale: 以种子良田净水大风盛火日月灯等喻令学者乐求不退
  - date: 0740-01-01
    title_zh: 以五事持坚固誓愿修六度
    rationale: 誓愿能坚心制烦恼遮放逸破五盖勤修行故判为真发心标准
