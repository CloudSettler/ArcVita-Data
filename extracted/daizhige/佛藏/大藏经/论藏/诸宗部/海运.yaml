  date: 0732-01-01
  location: 新罗
  description: 立释名义识体性辨一异明相状述行愿五门引长耳三藏起信本业仁王等明信成就解行证发心
- id: guji-海运-event-3
  kind: work
  title_zh: 阐明菩提心功用如药如灯
  date: 0738-01-01
  location: 新罗
  description: 引华严七十八维摩经说菩提心如种子良田大地净水大风盛火日月明灯大道及无畏药解脱药大应伽药
