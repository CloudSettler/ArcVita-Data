  date: 0740-01-01
  location: 新罗
  description: 依显扬毗卢遮那疏发心经明思惟诸佛观身过患慈愍众生求最胜果及坚固誓愿修六波罗蜜慈悲喜舍
- id: guji-海运-event-death
  kind: death
  title_zh: 海运示寂
  date: 0760-01-01
