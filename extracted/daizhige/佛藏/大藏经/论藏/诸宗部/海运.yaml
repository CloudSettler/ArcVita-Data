  - 真妄一异难分，既言性无有二，又言弃妄成真，如何会通
  - 发心相状高远，凡夫假想轻微，如何阶梯接引至信成就
  lesson: 菩提为本，愿行为要，真妄不二而进修不废，发心必兼解行证三位
  summary_first_person: 我观众经所说菩提心为成佛之本，乃立五门分别释名识体辨异明相述愿，欲令学者由假想发心渐至信成就解行证入
