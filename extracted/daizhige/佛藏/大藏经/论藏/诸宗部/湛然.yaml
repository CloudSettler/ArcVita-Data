  - date: 502
    title_zh: 引虚空喻证正因遍
    rationale: 涅槃云众生佛性犹如虚空一切处有，故墙壁瓦砾不隔真如，随缘不变故云有性
  - date: 0768
    title_zh: 设四十六问攻疑
    rationale: 为断权实进否之疑，以攻惑攻疑攻行攻理总摄因果自他依正，令一念具足法界
