  date: '0711'
  year_of: 711
  title_zh: 降生常州晋陵
  description_zh: 唐睿宗景云二年生于常州晋陵戚氏，幼习儒典后归心佛法
- id: guji-湛然-event-study
  date: 0729
  year_of: 729
  title_zh: 师事左溪玄朗
  description_zh: 往天台山从左溪玄朗学止观法门，尽得其传
- id: guji-湛然-event-preach
  date: '0734'
  year_of: 734
  title_zh: 驻锡荆溪妙乐弘化
  description_zh: 玄朗示寂后住荆溪妙乐寺，讲法华玄义摩诃止观，学者云集号荆溪尊者
- id: guji-湛然-event-zhiguan-dayi
  date: 0769
  year_of: 769
  title_zh: 应李华请述止观大意
  description_zh: 因员外李华欲知止观大意，略报纲要，明发圆心修圆行感圆果起八教归三德及十乘观法宿习对治
- id: guji-湛然-event-death
  date: 0782
  year_of: 782
  title_zh: 示寂于天台
  description_zh: 唐德宗建中三年示寂，世寿七十二，后谥妙乐大师尊为天台第九祖
