endeavors:
- id: guji-湛然-endeavor-1
  title_zh: 中兴天台教观
  goal_zh: 承龙树南岳天台之统，以疏释消经扶持教观
  phases:
  - key: brewing
    name: 师事玄朗承学
    labels:
      zh: 求学
    start_date: 0729
    highlight_event_id: guji-湛然-event-study
  - key: breakthrough
    name: 驻锡荆溪弘化
    labels:
      zh: 弘法
    start_date: '0734'
    highlight_event_id: guji-湛然-event-preach
  - key: climax
    name: 注疏广弘法华玄义止观
    labels:
      zh: 述作
    start_date: '0760'
    highlight_event_id: guji-湛然-event-zhiguan-dayi
  - key: closure
    name: 化缘圆满付嘱
    labels:
      zh: 圆寂
    start_date: 0782
    highlight_event_id: guji-湛然-event-death
  decisions:
  - date: '0734'
    title_zh: 继席弘扬天台
    rationale: 玄朗示寂之后痛念教观将坠，誓以释签疏记开拓义门观法周备
  - date: '0760'
    title_zh: 以五重玄十义消释诸经
    rationale: 使依教修有方便依行证有阶差，贤圣不滥免增上慢
- id: guji-湛然-endeavor-2
  title_zh: 述止观大意明圆顿行相
  goal_zh: 应李华请略报纲要，立圆顿止观一家行相
  phases:
  - key: brewing
    name: 应李华请发起
    labels:
      zh: 发起
    start_date: 0768
    highlight_event_id: guji-湛然-event-zhiguan-dayi
  - key: breakthrough
    name: 略述教观门户大概
    labels:
      zh: 纲要
    start_date: 0769
    highlight_event_id: guji-湛然-event-zhiguan-dayi
  - key: climax
    name: 详示二十五方便十乘轨行
    labels:
      zh: 正修
    start_date: '0770'
    highlight_event_id: guji-湛然-event-zhiguan-dayi
  - key: closure
    name: 嘱须口诀方成行相
    labels:
      zh: 嘱累
    start_date: '0771'
    highlight_event_id: guji-湛然-event-zhiguan-dayi
  decisions:
  - date: 0769
    title_zh: 以法华三昧为圆顿指南
    rationale: 圆顿止观即法华三昧异名，若不晓了权实本迹不可立观意
  - date: '0770'
    title_zh: 判上中下三根施设十法
    rationale: 上根唯一观不思议境即足，中根加慈悲安心，下根方具十法，使无相众相宛然
events:
