  archetype: 禅教圆融顿悟弘道者
  dilemmas:
  - 名相学问浩繁与直截根源证悟之间如何取舍
  - 生死事大急迫与沙门威仪谦敬之间如何兼顾
  lesson: 得本莫愁末，直截根源，定慧圆明，不著空有，悲智双运以利物应机
  summary_first_person: 吾姓戴，永嘉人，丱岁出家，遍探三藏而精天台圆妙法门，四威仪中常冥禅观，后访曹溪得印一宿觉，回温弘化，作证道歌以明绝学无为、不除妄想不求真之旨，愿学者舍妄取真之巧伪，直入无生，莫谤如来正法轮
