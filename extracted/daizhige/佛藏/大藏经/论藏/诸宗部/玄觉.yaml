endeavors:
- id: guji-玄觉-endeavor-1
  title_zh: 精研天台长养禅观
  summary_zh: 丱岁出家，遍探三藏，精天台圆妙法门，于四威仪中常冥禅观，为后参曹溪奠定解行之本
  phases:
  - key: brewing
    name: 丱岁出家遍探三藏
    labels:
      zh:
      - 酿造
      - 研教
    start_date: '0673'
    highlight_event_id: guji-玄觉-event-study
  - key: breakthrough
    name: 四威仪常冥禅观
    labels:
      zh:
      - 突破
      - 修观
    start_date: 0690
    highlight_event_id: guji-玄觉-event-meditation
  decisions:
  - date: 0680
    title_zh: 专精天台圆观
    rationale: 以三藏浩繁故，择天台止观为归，观圆妙法门以养定慧
  - date: 0695
    title_zh: 不滞讲说访道参禅
    rationale: 以生死事大无常迅速故，不以解为足，决意寻师访道为参禅
- id: guji-玄觉-endeavor-2
  title_zh: 曹溪印证回温弘化
  summary_zh: 与策禅师同诣曹溪，振锡绕祖而得印可，少留一宿，回温江弘化，著永嘉集及证道歌盛行于世
  phases:
  - key: climax
    name: 曹溪绕祖一宿觉
    labels:
      zh:
      - 高潮
      - 印证
    start_date: '0705'
    highlight_event_id: guji-玄觉-event-caoxi
  - key: closure
    name: 住温弘化著证道歌
    labels:
      zh:
      - 收束
      - 著述
    start_date: '0706'
    highlight_event_id: guji-玄觉-event-return
  decisions:
  - date: '0705'
    title_zh: 振锡绕祖直呈本分
    rationale: 以生死本无动速故，不拘常仪，直以体取无生对答以显自性
  - date: '0706'
    title_zh: 回温著述利物应机
    rationale: 以已蒙印可故，不久住曹溪，还温江接引学者，作证道歌表真僧决定说
events:
- id: guji-玄觉-event-birth
  title_zh: 永嘉戴氏诞生
  date: '0665'
  year_of: 665
  place_zh: 温州永嘉
  description_zh: 永嘉人也，姓戴氏，生于唐高宗时，后丱岁出家
- id: guji-玄觉-event-study
  title_zh: 遍探三藏精天台旨
  date: '0673'
  year_of: 673
  place_zh: 永嘉
  description_zh: 丱岁出家，遍探三藏，精天台旨，观圆妙法门
- id: guji-玄觉-event-meditation
  title_zh: 四威仪常冥禅观
  date: 0690
  year_of: 690
  place_zh: 温州
  description_zh: 于四威仪中常冥禅观，后因左溪朗禅师激励，决意参访
- id: guji-玄觉-event-caoxi
  title_zh: 同策禅师诣曹溪得印
  date: '0705'
  year_of: 705
  place_zh: 曹溪
  description_zh: 与东阳策禅师同诣曹溪，初到振锡携瓶绕祖三匝，对答体即无生了本无速，蒙印如是如是，少留一宿，时谓一宿觉
- id: guji-玄觉-event-return
  title_zh: 回温江弘化著证道歌
  date: '0706'
  year_of: 706
  place_zh: 温江
  description_zh: 翌日下山回温江，学者辐凑，号真觉大师，著禅宗悟修圆旨及证道歌一首，并盛行于世
- id: guji-玄觉-event-death
  title_zh: 先天二年示寂
  date: '0713'
  year_of: 713
  place_zh: 温州
  description_zh: 弘化温江后示寂，庆州刺史魏静缉其文成十篇，目为永嘉集，证道歌盛行于世
