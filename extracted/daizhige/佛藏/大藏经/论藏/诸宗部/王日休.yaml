endeavors:
- id: guji-王日休-endeavor-1
  title_zh: 编撰龙舒净土文十三卷
  summary_zh: 遍览藏经传记取意为文，以直白之言明净土理事，开示九品修持，引三教经书为证，普摄群品
  phases:
  - key: brewing
    name: 博览藏经立志著述
    labels:
      zh:
      - 博通儒典
      - 遍览藏经
    start_date: '1135'
    highlight_event_id: guji-王日休-event-lizhi
  - key: breakthrough
    name: 取意直书发愿普化
    labels:
      zh:
      - 直而不文
      - 人人共晓
    start_date: '1145'
    highlight_event_id: guji-王日休-event-lizhi
  - key: climax
    name: 宣城示书得名公序
    labels:
      zh:
      - 宣城示稿
      - 张孝祥序
    start_date: '1161'
    highlight_event_id: guji-王日休-event-xuancheng
  - key: closure
    name: 刊行流布寿其传
    labels:
      zh:
      - 锓木流布
      - 利他圆满
    start_date: '1162'
    highlight_event_id: guji-王日休-event-xuancheng
  decisions:
  - date: '1145'
    title_zh: 舍繁文用直白著述
    rationale: 欲令士农工商愚智皆晓，不以人微而隐其说，故言直而不文
  - date: '1150'
    title_zh: 引三教经书证净土
    rationale: 为破儒者以释徒戒行轻其教之疑，显儒释同归劝善而净土兼出世间法
- id: guji-王日休-endeavor-2
  title_zh: 布衣蔬茹千里弘化
  summary_zh: 年近六十布衣蔬茹，重趼千里风雨不避以净土教人，日课千拜夜分乃寝，临终正念明白往生示现
  phases:
  - key: brewing
    name: 指旧学为业习西归
    labels:
      zh:
      - 舍业习
      - 立西归
    start_date: '1140'
    highlight_event_id: guji-王日休-event-lizhi
  - key: breakthrough
    name: 布衣蔬茹重趼教人
    labels:
      zh:
      - 布衣弘化
      - 千里劝修
    start_date: '1155'
    highlight_event_id: guji-王日休-event-xuancheng
  - key: climax
    name: 日课千拜道风感人
    labels:
      zh:
      - 精进念佛
      - 面有光耀
    start_date: '1160'
    highlight_event_id: guji-王日休-event-xuancheng
  - key: closure
    name: 正念现前安然往生
    labels:
      zh:
      - 正念现前
      - 临终明白
    start_date: '1173'
    highlight_event_id: guji-王日休-event-death
  decisions:
  - date: '1155'
    title_zh: 弃荣利守布衣蔬茹
    rationale: 以身示范显净土不妨俗事，在官在士在商在农皆可修，破富贵贪著
  - date: '1160'
    title_zh: 风雨寒暑重趼劝化
    rationale: 不独自行更欲度尽众生，故不避劳苦千里教人，立早晨十念人人可行之法
events:
- id: guji-王日休-event-birth
  title_zh: 降生庐州龙舒
  date: '1105'
  year_of: 1105
  place_zh: 庐州龙舒
  description_zh: 北宋崇宁年间降生龙舒，字虚中，后登国学进士，博通群书，训传六经诸子数十万言
- id: guji-王日休-event-lizhi
  title_zh: 指旧学为业习发心著述净土文
  date: '1145'
  year_of: 1145
  place_zh: 龙舒
  description_zh: 自觉平生所学皆是业习非究竟法，遂精进专念阿弥陀佛，遍览藏经传记取其意作净土文，自言无一字无所本，欲以直白之言令人人共晓净土
- id: guji-王日休-event-xuancheng
  title_zh: 宣城示书张孝祥为序
  date: '1161-08-15'
  year_of: 1161
  place_zh: 宣城
  description_zh: 绍兴辛巳秋过宣城留两月，始出净土文示人，具载修习法门与感验章著，张孝祥叹其端静简洁布衣蔬茹重趼千里教人，日课千拜面目有光，遂为题序称其为有道之士
- id: guji-王日休-event-death
  title_zh: 临终正念明白往生
  date: '1173'
  year_of: 1173
  place_zh: 龙舒
  description_zh: 平生信之笃修之勤，至乾道九年正念现前临终明白，中道奄然而逝，示人以真觉，周必大等为赞，世传净土之归无疑，后人重刊其书广行流布
