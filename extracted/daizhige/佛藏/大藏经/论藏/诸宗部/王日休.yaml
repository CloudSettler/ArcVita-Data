    en: Wang Rixiu
  lifespan:
    birth:
      date: '1105'
      precision: year
      is_circa: true
      raw: 北宋崇宁四年约
    death:
      date: '1173'
      precision: year
      is_circa: false
      raw: 南宋乾道九年
  birth_date: '1105'
  death_date: '1173'
  era: 南宋
  reign_ref: 绍兴至乾道年间
  archetype: 净土弘化居士
  dilemmas:
  - 博通六经诸子而觉皆是业习，如何舍旧学转归西方而不负平生所学
  - 参禅者高谈唯心净土轻视事修，如何以理事双全之直白教化士农工商皆得往生
  lesson: 脚踏实地持诵修行胜过虚谈玄妙，自利利他贵在直白恳切人人可行
  summary_first_person: 我本龙舒布衣，少习儒业，博通群书，训传六经诸子数十万言，一旦自觉皆是业习非究竟法，遂发心西归，精进念佛，遍览藏经传记取其意作净土文十三卷，言直不文，欲令天下人人共晓，布衣蔬茹重趼千里以此教人，日课千拜夜分乃寝，至临终正念现前明白往生，此生但愿一切众生悉归净土
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AF%B8%E5%AE%97%E9%83%A8/%E9%BE%99%E8%88%92%E5%A2%9E%E5%B9%BF%E5%87%80%E5%9C%9F%E6%96%87.html
