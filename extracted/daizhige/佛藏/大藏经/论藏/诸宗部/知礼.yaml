  date: 0998
  year_of: 998
  place_zh: 四明
  description: 應寶山善信之請作扶宗釋難專救光明玄廣本十種觀心斥發揮廢觀之失
- id: guji-知礼-event-ten-inquiry
  title_zh: 景德三祀問義於昭師
  date: 1006-12
  year_of: 1006
  place_zh: 四明至浙陽
  description: 景德三祀臘月既望以為法之心問義於浙陽昭師於觀心立十義以定能觀所觀境觀之正
- id: guji-知礼-event-ten-complete
  title_zh: 往復五番集十義書成
  date: 1010
  year_of: 1010
  place_zh: 四明
  description: 與昭師往復各五綿歷七年攢結前後十番之文共成今十義書以破以教代觀等五番轉計
- id: guji-知礼-event-death
  title_zh: 示寂於延慶寺
  date: 1028
  year_of: 1028
  place_zh: 明州延慶寺
  description: 宋天聖六年示寂於四明諡法智後世尊為天台中興之祖十義盛行於浙右
