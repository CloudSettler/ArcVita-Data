  person_id: guji-知礼
  title_zh: 中兴天台教观
  description: 承宝云义通之学，主四明延庆，讲教著述，辨正山家山外，复兴天台宗风。
  phases:
  - key: brewing
    name: 幼年出家修律
    labels:
      zh: 出家求学
    start_date: 0974
    highlight_event_id: guji-知礼-event-ordination
  - key: breakthrough
    name: 从义通学天台
    labels:
