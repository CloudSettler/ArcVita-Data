    name: 率众行道护国祈福
    labels:
      zh: 行道护国
    start_date: '1015'
    highlight_event_id: guji-知礼-event-compile-chanfa
  - key: closure
    name: 忏仪流通示寂付嘱
    labels:
      zh: 流通付嘱
    start_date: '1028'
    highlight_event_id: guji-知礼-event-death
  decisions:
  - date: '1012'
    title_zh: 采金光明经文制忏仪
    rationale: 见经中忏悔灭障护国之义，欲令行者有章可循，故集奉请赞叹礼忏回向之仪。
  - date: '1015'
    title_zh: 以忏法祈风调雨顺国泰民安
    rationale: 承经言护国护世之旨，回向圣帝仁王万姓安乐，显大乘利他之行。
