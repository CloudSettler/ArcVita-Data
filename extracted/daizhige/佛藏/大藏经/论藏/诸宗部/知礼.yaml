    death:
      date: 1028
      precision: year
      is_circa: false
      raw: 宋天聖六年示寂於四明延慶
  birth_date: 0960
  death_date: 1028
  era: 北宋
  reign_ref: 宋仁宗天聖
  archetype: 護教明觀之宗匠
  dilemmas:
  - 以教代觀則有教無觀以觀廢教則有觀無教當如何雙全教觀以存圓旨
  - 同門異說盛行若默然則正教陵夷若往復詰難則近於諍競當如何抉擇
  lesson: 寧受好諍之譏不忍聖教陵替唯精揀境觀方能紹隆天台正傳
  summary_first_person: 吾四明沙門知禮為惜圓宗觀道被山外異說所亂乃於景德中與昭師往復五番問難觀心十義集為此書以明托事附法約行三觀皆須揀陰修觀使後學不失正路
  source_urls:
  - https://daizhige.org/佛藏/大藏經/論藏/諸宗部/四明十義書.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏經/論藏/諸宗部/四明十義書.md
endeavors:
- id: guji-知礼-endeavor-1
  title_zh: 扶宗釋難救廣本觀心
  description: 因慈光發揮記廢光明玄廣本觀心故作扶宗記專救十種觀心兼斥不解發軫拣境之失
  phases:
  - key: brewing
    name: 見廢廣本而發憤
    labels:
      zh: 護教
    start_date: 0990
    highlight_event_id: guji-知礼-event-fuzong
  - key: breakthrough
    name: 撰扶宗記明教觀
    labels:
      zh: 立宗
    start_date: 0998
    highlight_event_id: guji-知礼-event-fuzong
  - key: climax
    name: 以法華玄義例證觀心必立
    labels:
      zh: 顯正
    start_date: 0999
    highlight_event_id: guji-知礼-event-fuzong
  decisions:
  - date: 0998
    title_zh: 應寶山請作扶宗記
    rationale: 法鼓競鳴當仁不讓為存眾生入理之門不得不評是議非
  - date: 0999
    title_zh: 定判圓談法性亦須立觀
    rationale: 若廢觀心則杜絕趣果之路全迷一家解行之要故引法華玄義為例
- id: guji-知礼-endeavor-2
  title_zh: 十義往復折山外邪說
  description: 與梵天昭師孤山圓師往復五番立十義問難定能觀所觀內外境事理造以集十義書大成
  phases:
  - key: brewing
    name: 答疑問疑初往復
    labels:
      zh: 問難
    start_date: 1004
    highlight_event_id: guji-知礼-event-ten-inquiry
  - key: breakthrough
    name: 景德三祀立十門定難
    labels:
      zh: 定難
    start_date: 1006-12
    highlight_event_id: guji-知礼-event-ten-inquiry
  - key: climax
    name: 覆問催答結集十番
    labels:
      zh: 結集
    start_date: 1010
    highlight_event_id: guji-知礼-event-ten-complete
  - key: closure
    name: 十義流通付後學
    labels:
      zh: 傳付
    start_date: 1011
    highlight_event_id: guji-知礼-event-ten-complete
  decisions:
  - date: 1006-12
    title_zh: 約觀心立十義致昭師
    rationale: 隨文致詰恐大節難明故於觀心一科立難十段以定是非
  - date: 1007
    title_zh: 覆問催答不容稽留
    rationale: 前後義狀皆經二年遍尋教部旋構見知故須直誠速酬以塞虛心
  - date: 1010
    title_zh: 攢結前後十番為十義書
    rationale: 往復各五綿歷七年五番墮負四番轉計須撮大成以曉天台宗教
events:
