    start_date: '1020'
    highlight_event_id: guji-知礼-event-death
  decisions:
  - date: 0985
    title_zh: 决意从宝云义通学天台
    rationale: 慨教典散佚，欲绍智者正传，故弃律专攻天台教观。
  - date: 0995
    title_zh: 定居延庆广开讲席
    rationale: 为聚众弘法培育后学，以一寺为根本道场，教观并弘。
- id: guji-知礼-endeavor-2
  person_id: guji-知礼
  title_zh: 集金光明最胜忏仪
  description: 依金光明经制忏仪轨，融礼佛忏悔劝请随喜回向发愿，祈护国安民流通后世。
  phases:
  - key: brewing
    name: 依经修金光明忏
