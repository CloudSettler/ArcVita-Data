  birth_date: '1158'
  death_date: '1210'
  era: 高丽中期
  reign_ref: 高丽熙宗
  archetype: 弘法禅师
  dilemmas:
  - 顿悟易而习气难除，如何兼顾顿悟与渐修而不偏废
  - 空寂灵知易落知解，如何令学者返照自心而不外求
  lesson: 识自本心即佛，依悟而修，定慧等持，久久自成
  summary_first_person: 吾乃高丽知讷，号普照，悯三界如火宅，众生迷自真心而外求佛道，故倡顿悟渐修，示空寂灵知，结社弘禅，著修心诀以接后学，愿修道者不向外觅，直下返照，守本心而渐熏成圣
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E5%A4%A7%E8%97%8F%E7%BB%8F/%E8%AE%BA%E8%97%8F/%E8%AF%B8%E5%AE%97%E9%83%A8/%E6%99%AE%E7%85%A7%E7%A6%85%E5%B8%88%E4%BF%AE%E5%BF%83%E8%AF%80.md
