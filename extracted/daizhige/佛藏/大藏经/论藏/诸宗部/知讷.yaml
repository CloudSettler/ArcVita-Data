endeavors:
- id: guji-知讷-endeavor-1
  title_zh: 倡导顿悟渐修并著修心诀
  description: 指斥舍心外求之弊，立顿悟渐修两门，以空寂灵知直指本心，以定慧等持摄护后修，著修心诀以示学者
  phases:
  - key: brewing
    name: 出家求道观心
    labels:
      zh:
      - 求道
      - 观心
    start_date: '1165'
    highlight_event_id: guji-知讷-event-ordination
  - key: breakthrough
    name: 回光见性立顿悟
    labels:
      zh:
      - 顿悟
      - 见性
    start_date: '1182'
    highlight_event_id: guji-知讷-event-awakening
  - key: climax
    name: 著论诀示定慧
    labels:
      zh:
      - 著述
      - 定慧等持
    start_date: '1205'
    highlight_event_id: guji-知讷-event-xiuxinjue
  - key: closure
    name: 付嘱后学守心
    labels:
      zh:
      - 付嘱
      - 守心
    start_date: '1210'
    highlight_event_id: guji-知讷-event-death
  decisions:
  - date: '1182'
    title_zh: 立顿悟渐修宗旨
    rationale: 悟性虽顿同佛而习气深厚，若无后修则如风停波涌，故以先悟后修为千圣轨辙
  - date: '1205'
    title_zh: 著修心诀直指空寂灵知
    rationale: 为破心外求佛及执渐修为实之疑，须以问答决择顿渐定慧，令中下之机亦得趣入
- id: guji-知讷-endeavor-2
  title_zh: 结社松广中兴禅门
  description: 结定慧社与修禅社，聚众熏修，离闹入山，以无功之功养圣胎，兴高丽禅风
  phases:
  - key: brewing
    name: 发愿结社共修
    labels:
      zh:
      - 发愿
      - 结社
    start_date: '1190'
    highlight_event_id: guji-知讷-event-society
  - key: breakthrough
    name: 移住松广立修禅社
    labels:
      zh:
      - 开山
      - 安众
    start_date: '1200'
    highlight_event_id: guji-知讷-event-suseonsa
  - key: climax
    name: 牧牛行成化众
    labels:
      zh:
      - 牧牛
      - 化众
    start_date: '1205'
    highlight_event_id: guji-知讷-event-xiuxinjue
  - key: closure
    name: 示寂传法慧命
    labels:
      zh:
      - 示寂
      - 传法
    start_date: '1210'
    highlight_event_id: guji-知讷-event-death
  decisions:
  - date: '1190'
    title_zh: 结社以摄散众共修
    rationale: 独修易退，须借同行熏修对治昏乱，以随相定慧暂调习气而归自性定慧
  - date: '1200'
    title_zh: 入山建修禅社以远尘缘
    rationale: 烦恼浓厚者对境生情，须托静处均调动静，成就任运寂知之无事人
events:
- id: guji-知讷-event-birth
  date: '1158'
  year_of: 1158
  title_zh: 诞生于高丽
  description: 高丽仁宗三十六年生，后出家，号知讷，世称普照禅师
- id: guji-知讷-event-ordination
  date: '1165'
  year_of: 1165
  title_zh: 幼岁出家受具
  description: 八岁出家，习禅教，悯众生轮回长苦，立志求佛即求自心
- id: guji-知讷-event-awakening
  date: '1182'
  year_of: 1182
  title_zh: 登科发悟立顿渐义
  description: 经行悟入，了自性本来空寂与佛无殊，遂判顿悟渐修如车二轮，破一悟即具神通之邪见
- id: guji-知讷-event-society
  date: '1190'
  year_of: 1190
  title_zh: 结定慧社聚众熏修
  description: 与同行结社，倡定慧等持，以称理摄散择法观空对治昏乱，养圣胎于日用
- id: guji-知讷-event-suseonsa
  date: '1200'
  year_of: 1200
  title_zh: 移居松广山建修禅社
  description: 入松广山立修禅社，安众办道，行悟后牧牛行，不离本寂本知而任运双修
- id: guji-知讷-event-xiuxinjue
  date: '1205'
  year_of: 1205
  title_zh: 著普照禅师修心诀示众
  description: 以问答决择见性定慧后修之义，斥蒸沙作饭之外求苦行，示空寂灵知即本来面目，劝守而不忘照顾
- id: guji-知讷-event-death
  date: '1210'
  year_of: 1210
  title_zh: 示寂于修禅社
  description: 高丽熙宗六年示寂，后谥普照国师，法语流通，兴高丽禅宗慧命
