    rationale: 妄心不可力伏唯心中无物自然虚灵故立十种功夫专主休歇
  - date: '1209'
    title_zh: 正助双行不废众善
    rationale: 单主无心恐成懈怠故以休歇为正集善为助如磨镜兼用妙药
