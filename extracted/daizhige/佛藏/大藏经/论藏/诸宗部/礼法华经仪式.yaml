    description: 六根罪障无量无边而愿借礼经忏悔速得清净回向菩提
  lesson: 以礼经为宗兼礼三宝以忏悔发愿回向净土即是圆具解行之道
  summary_first_person: 吾以凡夫迷失真心罪障深重故制此礼法华经仪式令自他归命三宝忏悔发愿同证菩提同生莲华
