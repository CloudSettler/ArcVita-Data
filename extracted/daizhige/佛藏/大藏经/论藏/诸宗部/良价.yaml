  dilemmas:
  - 无情说法究竟谁人得闻以耳听终难会以眼处如何闻声
  - 先师道只这是究竟承当甚么须审细方契如如
  - 不蒙指示与直指人心之间云岩不为我说破是孤负还是大恩
  lesson: 切忌从他觅须向自己脚跟下究明我今独自往处处得逢渠正偏回互君臣合道方能剪诸见稠林
  summary_first_person: 我是良价会稽俞氏子幼从师念般若心经至无眼耳鼻舌身意处扪面质疑后礼五泄默禅师披剃二十一嵩山具戒游方参南泉沩山云岩于无情说法水鸟树林处有省过水睹影大悟后住新丰洞山权开五位善接三根得曹山共阐偏正君臣洞上玄风播于天下
