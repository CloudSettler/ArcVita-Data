    start_date: 0843
    highlight_event_id: guji-良价-event-yunyan
  - key: closure
    name: 供真设斋半肯半不肯
    labels:
      zh: 承当付嘱
    start_date: 0844
    highlight_event_id: guji-良价-event-yunyan
  decisions:
  - date: 0828
    title_zh: 不安一处远参南泉沩山云岩
    rationale: 为究南阳忠国师无情说法之微须拨草瞻风访善知识不可滞于一师一解
  - date: 0844
    title_zh: 离云岩湖南归乡皆道无别卜所止
    rationale: 承当大事须审细不从他觅待和尚有住处即来难得不相见故独立行脚以验所悟
- id: guji-良价-endeavor-2
  title_zh: 住持洞山开立曹洞宗
  summary: 唐大中末住新丰山接诱学徒后盛化豫章高安洞山权开五位善接三根得曹山深明的旨道合君臣偏正回互洞上玄风播于天下
