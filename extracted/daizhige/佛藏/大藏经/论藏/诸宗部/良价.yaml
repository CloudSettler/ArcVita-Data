  decisions:
  - date: 0860
    title_zh: 由新丰迁化洞山大阐一音
    rationale: 为广弘万品横抽宝剑剪诸见稠林须据大法席善接三根故不守一山而应豫章之请
  - date: 0865
    title_zh: 权开五位建立偏正回互君臣之旨
    rationale: 为截万端穿凿妙叶弘通接上中下根须以君臣偏正明理事回互使学人得入路故付嘱曹山共唱嘉猷
events:
- id: guji-良价-event-birth
  date: 0807
  year_of: 807
  type: birth
  title_zh: 会稽俞氏生良价幼疑般若无眼耳
  description: 会稽俞氏子幼岁从师念般若心经至无眼耳鼻舌身意处扪面问师有何故经言无师骇异指往五泄山礼默禅师披剃
  location: 会稽
- id: guji-良价-event-ordination
  date: 0828
  year_of: 828
  type: 事业
  title_zh: 嵩山具戒谒南泉沩山问无情说法
  description: 年二十一诣嵩山具戒游方首谒南泉对马祖还来否云待有伴即来次参沩山举南阳忠国师墙壁瓦砾常说炽然之话请指示沩山竖拂云父母所生口终不为子说遂指往澧陵攸县石室云岩
  location: 嵩山南泉沩山
- id: guji-良价-event-yunyan
  date: 0843
  year_of: 843
  type: 事业
  title_zh: 云岩有省过水睹影大悟作偈逢渠
  description: 在云岩问无情说法甚么人得闻云无情得闻竖拂云我说法汝尚不闻岂况无情说法乎引弥陀经水鸟树林悉皆念佛念法遂有省作偈无情说法不思议眼处闻声方得知后辞云岩问百年后还邈得师真否云岩云只这是沉吟过水睹影大悟云渠今正是我我今不是渠
  location: 澧陵攸县石室云岩
- id: guji-良价-event-dongshan
  date: 0860
  year_of: 860
  type: 事业
  title_zh: 住新丰洞山权开五位得曹山弘洞上玄风
  description: 自唐大中末于新丰山接诱学徒厥后盛化豫章高安之洞山权开五位善接三根大阐一音广弘万品又得曹山深明的旨妙唱嘉猷道合君臣偏正回互由是洞上玄风播于天下诸方推尊曰洞曹宗
  location: 新丰山豫章高安洞山
- id: guji-良价-event-death
  date: 0869
  year_of: 869
  type: death
  title_zh: 洞山示寂曹洞宗成
  description: 住持洞山晚年阐扬正偏兼带君臣五位之旨广接云居疏山雪峰龙牙诸匠后于洞山示寂洞曹玄风已播天下为后世五家之一
  location: 瑞州洞山
