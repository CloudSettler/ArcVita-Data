    title_zh: 立唯观心总摄万行
    rationale: 心为万法根本了心则枝叶俱备省力易成故不令外求
  - date: '0531-01-01'
    title_zh: 转三毒六贼为戒定慧
    rationale: 三界六趣唯心所生制三毒即持三聚净戒净六根即行六度故直示解脱
