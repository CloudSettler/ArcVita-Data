endeavors:
- id: guji-萧衍-endeavor-1
  title_zh: 为郗后集撰慈悲道场忏法
  goal_zh: 赎郗氏嫉妒惨毒之罪使离蟒身得生善处
  summary_zh: 因寝殿见蟒自陈为郗氏，集沙门问善之最，录佛名号亲撰悔文十卷，设忏礼以忏涤
  phases:
