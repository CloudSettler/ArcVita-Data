    highlight_event_id: guji-萧衍-event-chengchan
  - key: breakthrough
    name: 发十二缘
    labels:
      zh:
      - 发心
      - 立愿
    start_date: 322
    highlight_event_id: guji-萧衍-event-chengchan
  - key: climax
    name: 归依断疑忏悔
    labels:
      zh:
      - 归依
      - 忏悔
    start_date: 322
    highlight_event_id: guji-萧衍-event-chengchan
  - key: closure
