  decisions:
  - date: 322
    title_zh: 大集沙门问赎苦善最
    rationale: 独力难拔蟒苦，须依众僧智力抉择最胜功德
  - date: 322
    title_zh: 取志公礼佛忏涤之议亲撰悔文
    rationale: 礼佛忏悔方能涤悃款，以佛语为本削去闲词方为可依
- id: guji-萧衍-endeavor-2
  title_zh: 立慈悲道场护持三宝弘化
  goal_zh: 守护三宝摧伏增上慢令众生种善发菩提心
  summary_zh: 因梦感立慈悲道场四字，发十二大因缘，奉为国王人民父母师长一切众生归依忏悔发愿回向
  phases:
  - key: brewing
    name: 梦感题名
    labels:
