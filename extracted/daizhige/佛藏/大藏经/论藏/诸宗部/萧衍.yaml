      - 发愿
      - 回向
    start_date: 323
    highlight_event_id: guji-萧衍-event-tianren
  decisions:
  - date: 322
    title_zh: 以慈悲为道场之号依事题名不移易
    rationale: 弥勒慈隆即世悲臻后劫，慈悲为众生归依处堪为真知识
  - date: 322
    title_zh: 遍为六道四生发十二大因缘
    rationale: 独善一人生天不足恃，须化六道报慈恩令菩提心相续不断
events:
- id: guji-萧衍-event-birth
  title_zh: 萧衍生于秣陵
  date: 308
  year_of: 464
  place_zh: 秣陵
  description_zh: 宋大明八年出生，南兰陵人，后代齐受禅建立南梁
- id: guji-萧衍-event-mangxian
  title_zh: 寝殿见蟒自陈为郗氏
  date: 320
  year_of: 500
  place_zh: 梁宫寝殿
  description_zh: 郗氏崩后数月，帝昼忽忽不乐夜耿耿不寐，见蟒盘躄上殿，自言生嫉妒惨毒堕为蟒身，祈一功德拯拔
- id: guji-萧衍-event-jishamen
  title_zh: 大集沙门问善之最
  date: 322
  year_of: 502
  place_zh: 殿庭
  description_zh: 帝宣蟒由问何善最能赎苦，志公对以非礼佛忏涤悃款不可，帝然其言搜索佛经录名号
- id: guji-萧衍-event-chengchan
  title_zh: 亲撰悔文成慈悲道场忏法十卷
  date: 322
  year_of: 502
  place_zh: 梁宫
  description_zh: 兼亲杼眷思洒圣翰撰悔文，采摭佛语削去闲词共成十卷，为其忏礼立十二大因缘
- id: guji-萧衍-event-tianren
  title_zh: 宫室异香天人现身致谢
  date: 323
  year_of: 503
  place_zh: 宫室
  description_zh: 闻异香馥郁，仰视见天人容仪端丽，自言即蟒后身蒙功德已生忉利天，呈本身以为明验言讫不见
- id: guji-萧衍-event-death
  title_zh: 萧衍崩于净居殿
  date: 0549-06-12
  year_of: 549
  place_zh: 建康台城净居殿
  description_zh: 太清三年侯景之乱困于台城崩，年八十六，梁室自此衰微
