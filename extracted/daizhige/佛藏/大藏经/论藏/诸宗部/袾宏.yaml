  - 已过关者得少为足堕增上慢何以警策使之疾驱长驰破最后幽关
  lesson: 闲时办得下忙时得用以真疑实参克期取证不可徒学口头三昧
  summary_first_person: 吾俗姓沈，仁和人，法名袾宏，号莲池，晚住云栖。初出家得禅门佛祖纲目于坊间，慕古尊宿参学次第，续阅五灯语录杂传，删繁取要，汇成禅关策进，居则置案行则携囊，以自策励亦以策后学，愿人人透关破重关，直至安邦定国。
