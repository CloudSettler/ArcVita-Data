  - key: closure
    name: 作序流通置案携囊自警
    labels:
      zh: 流通
    start_date: 1600
    highlight_event_id: guji-袾宏-event-compile
  decisions:
  - date: 1600
    title_zh: 不取玄谈唯取工夫吃紧处
    rationale: 为便时时省览激励身心故舍向上玄谈专节法语苦功与经证要略
  - date: 1600
    title_zh: 易名禅关策进示重关之喻
    rationale: 以关吏启闭勘核为喻，明异言私越无所售奸，警已过关者关外有重关不可得少为足
- id: guji-袾宏-endeavor-2
  title_zh: 住持云栖融禅归净
  summary: 入云栖山复兴道场，立清规，持戒念佛，提倡参究与净土双修，化俗向善，成一方丛林。
  phases:
  - key: brewing
    name: 出家访道遍参知识
    labels:
      zh: 参访
    start_date: 1566
    highlight_event_id: guji-袾宏-event-ordination
  - key: breakthrough
    name: 入居云栖结茅立规
    labels:
      zh: 立规
    start_date: 1571
    highlight_event_id: guji-袾宏-event-revive
  - key: climax
    name: 弘法著述禅净并举
    labels:
      zh: 弘化
    start_date: 1600
    highlight_event_id: guji-袾宏-event-compile
  - key: closure
    name: 示寂云栖遗化后学
    labels:
      zh: 圆寂
    start_date: 1615
    highlight_event_id: guji-袾宏-event-death
  decisions:
  - date: 1571
    title_zh: 择云栖荒山重兴梵刹
    rationale: 见山水幽寂可为办道之场，立清规以束众，正戒律以端风，使僧俗有所依归
  - date: 1600
    title_zh: 以话头疑情兼摄念佛一门
    rationale: 鉴学者或执文字或堕枯寂，故教守一则以悟为期，复以净土为归宿，令上中下根皆得成就
events:
- id: guji-袾宏-event-birth
  date: 1535
  year_of: 1535
  title_zh: 生于仁和沈氏
  place_zh: 杭州府仁和县
  summary: 明嘉靖十四年十二月初八生于官宦之家，少习儒业，兼通典籍。
- id: guji-袾宏-event-ordination
  date: 1566
  year_of: 1566
  title_zh: 看破无常出家为僧
  place_zh: 云栖山
  summary: 中年丧子感悟无常，弃俗出家，遍参耆宿，得禅门佛祖纲目而慕效古人苦参。
- id: guji-袾宏-event-revive
  date: 1571
  year_of: 1571
  title_zh: 入主云栖重建丛林
  place_zh: 云栖寺
  summary: 入隆庆五年居云栖山，芟草结茅，订立清规，率众持戒念佛参究，远近问道者日集。
- id: guji-袾宏-event-compile
  date: 1600
  year_of: 1600
  title_zh: 编成禅关策进并作序
  place_zh: 云栖寺
  summary: 万历二十八年庚子孟春，汇诸祖法语节要与苦功事迹及经证为前后集，易名禅关策进，自置诸案以策进道业。
- id: guji-袾宏-event-death
  date: 1615
  year_of: 1615
  title_zh: 示寂于云栖
  place_zh: 云栖寺
  summary: 万历四十三年七月安然示寂，世寿八十一，僧腊五十，塔全身于云栖，著述流通后世。
