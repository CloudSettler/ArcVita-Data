  date: '1612'
  year_of: 1612
  title_zh: 微休居士刻疑辩流通
  description: 微休居士陈所蕴弘赞净土，镂刻疑辩广为流通，深契普贤愿王
- id: guji-袾宏-event-death
  date: '1615'
  year_of: 1615
  title_zh: 示寂云栖
  description: 明万历四十三年七月示寂于云栖，世寿八十一，后世尊为莲宗八祖
