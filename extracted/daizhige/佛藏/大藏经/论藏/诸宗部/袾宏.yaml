  date: '1571'
  year_of: 1571
  title_zh: 栖止云栖复兴道场
  description: 栖止杭州云栖山，持戒苦修，栽松建庵，荒山渐成丛林
- id: guji-袾宏-event-yibian
  date: '1600'
