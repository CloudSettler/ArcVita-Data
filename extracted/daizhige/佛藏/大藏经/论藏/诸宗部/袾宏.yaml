endeavors:
- id: guji-袾宏-endeavor-1
  title_zh: 融通禅净著疑辩
  summary: 答或问作净土疑辩，引中峰大势至普贤以证殊途同归，破表法偏见
  phases:
  - key: brewing
    name: 目睹禅者轻净
    labels:
      zh:
      - 禅净之争
    start_date: '1575'
    highlight_event_id: guji-袾宏-event-yunqi
  - key: breakthrough
    name: 引圣证会通禅净
    labels:
      zh:
      - 会通禅净
    start_date: '1595'
    highlight_event_id: guji-袾宏-event-yibian
  - key: climax
    name: 痛斥妄谈警示苦报
    labels:
      zh:
      - 慎口业
    start_date: '1600'
    highlight_event_id: guji-袾宏-event-yibian
  decisions:
  - date: '1600'
    title_zh: 决定作疑辩和会禅净
    rationale: 归元性无二方便有多门，非一门深入不足以破执理性拨事相之偏
  - date: '1600'
    title_zh: 决定痛戒恣意妄谈
    rationale: 劝人念佛可生净土，障人修行如箭入地狱，故须警示苦报以全慈航
- id: guji-袾宏-endeavor-2
  title_zh: 栖止云栖持戒弘净
  summary: 复兴云栖荒山，以戒为师，提倡持戒念佛并行，化被丛林
  phases:
  - key: brewing
    name: 看破世缘出家栖云
    labels:
      zh:
      - 出家栖止
    start_date: '1566'
    highlight_event_id: guji-袾宏-event-yunqi
  - key: breakthrough
    name: 持戒苦修复兴道场
    labels:
      zh:
      - 持戒念佛
    start_date: '1571'
    highlight_event_id: guji-袾宏-event-yunqi
  - key: closure
    name: 刻经流通化被四方
    labels:
      zh:
      - 流通教化
    start_date: '1612'
    highlight_event_id: guji-袾宏-event-kexing
  decisions:
  - date: '1571'
    title_zh: 决定栖止云栖荒山
    rationale: 远离尘嚣栽松种竹，以清苦道风培植念佛正行之基
  - date: '1580'
    title_zh: 决定坚持戒净并行
    rationale: 事外无理相外无性，净心必形于净行，故理事双修方能自利利他
events:
