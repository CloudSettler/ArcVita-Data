  dilemmas:
  - 禅净殊途是否同归，执理性拨事相者当如何破其偏见
  - 秽土堪忍行菩萨道与求生净土之间，凡夫根器如何抉择而不失大愿
  lesson: 归元性无二，方便有多门，事理相即，一门深入，慎口业而劝人念佛
  summary_first_person: 吾晚栖云栖，见人偏执禅理而轻净土，故作疑辩以摧慢幢破痴网，明禅净殊途同归，劝人一门深入，慎勿恣意妄谈
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/X1159
