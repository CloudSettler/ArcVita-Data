    labels:
      zh:
      - 高潮
    start_date: '0661'
    highlight_event_id: guji-迦才-event-preaching
  - key: closure
    name: 以处所不退决处退之疑
    labels:
      zh:
      - 收束
    start_date: '0662'
    highlight_event_id: guji-迦才-event-preaching
  decisions:
  - date: '0660'
    title_zh: 判西方具足三土
    rationale: 初地正体智见为法土，加行后得智见为报土，地前凡夫见为化土，故诸经或判报或判化皆不失旨
  - date: '0661'
    title_zh: 立处所不退摄凡夫
    rationale: 凡夫体是退人，在秽土逢五退缘即退，生西方无五退缘故毕竟不退，故不须十解方许往生
