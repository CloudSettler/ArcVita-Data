    title_zh: 弃杂糅而立九章殊位
    rationale: 远公谢公独善无承，道绰安乐集参杂混淆，故别立品目使览者宛如掌中
  - date: '0660'
    title_zh: 以理事二门答滞俗公子
    rationale: 语断心灭属理，期西念佛属事，如车两轮鸟二翼，故偏指西方令专想往生
