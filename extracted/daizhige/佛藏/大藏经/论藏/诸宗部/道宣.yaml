  - title_zh: 广解与专行如何兼顾
    description: 新学多求解少求行，于制仪门极为浮漫，须以简要行相摄心守戒，再开慧解
  - title_zh: 大乘小乘之争如何调伏
    description: 或谓大乘不行小乘法，内乖菩萨心外阙声闻行，须会通大小以戒为基成胜行
  lesson: 戒为定慧之基，新学当依师承行护律仪，调伏六根方成胜行
  summary_first_person: 吾道宣，京兆人，栖心终南，专弘毗尼，准教纂行事钞及教诫律仪四百六十五条，以诲新学，愿持戒清白以报四恩
