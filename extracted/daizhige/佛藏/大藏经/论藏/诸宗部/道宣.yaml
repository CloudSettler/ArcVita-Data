  summary_first_person: 吾丹徒钱氏子也少出家研穷毗尼居终南丰德寺一生以弘护律教为任见时僧服绫罗蚕丝忘慈忍本怀故述释门章服仪十篇立布衣坏色割截连缀之制限杀养之过显圣种之仪愿后学舍奢靡守圣制以净戒慈悲续佛慧命耳
