  - title_zh: 自力多劫与他力速成如何抉择
    description: 余门修道须经大劫方登初地，念佛乘弥陀本愿一日七日即得不退，当示他力超胜以断疑
  - title_zh: 专修念佛与杂善兼修如何取舍
    description: 杂善自力功少，专念功多，一念即灭八十亿劫罪，当劝一向专念以成多善根多福德
  lesson: 信愿专念，乘佛愿力，以少功速生净土，直至不退菩提
  summary_first_person: 吾道镜与善道共集念佛镜，立十一门以明念佛，劝进专修，辨自力他力，校量功德，破众疑惑，照明行人永出苦轮，同生极乐
