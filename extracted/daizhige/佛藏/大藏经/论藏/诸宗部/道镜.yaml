  title_zh: 共集念佛镜
  description: 与善道共集念佛镜，分劝进自力他力得益往生校量功德斋福疑谤誓愿广摄释疑出三界十一门，照明念佛永断疑惑
- id: guji-道镜-event-teach
  date: '0760-01-01'
  year_of: 760
  title_zh: 阐扬专念他力往生
  description: 宣说一日七日一心不乱十念除罪，一声灭八十亿劫罪，明念佛是多善根多福德，劝长时敬处无间无余修
- id: guji-道镜-event-death
  date: '0800-01-01'
  year_of: 800
  title_zh: 示寂
  description: 唐代寂，念佛镜后经杨杰序引莲池称叹流布后世，为浇世念佛宝镜
