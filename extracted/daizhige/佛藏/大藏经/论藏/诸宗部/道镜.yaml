    title_zh: 判念佛为他力余门为自力
    rationale: 明乘弥陀本愿力故用功少而速证不退，喻如乘船乘王力乘龙鳞以劝专修
  - date: '0760-01-01'
    title_zh: 举已往生事以证念佛必生
    rationale: 引德云比丘韦提希绰禅师善道怀感大行等僧尼白衣往生以息疑谤坚固信心
