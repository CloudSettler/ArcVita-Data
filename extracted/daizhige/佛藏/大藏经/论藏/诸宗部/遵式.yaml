      date: 0964
      precision: year
      is_circa: false
      raw: 宋乾德二年
    death:
      date: 1032
      precision: year
      is_circa: false
      raw: 宋明道元年
  birth_date: 0964
  death_date: 1032
  era: 北宋
  archetype: 弘法者
  dilemmas:
  - 凡夫散乱障重如何速破无明永灭五逆十恶重罪
  - 众事繁多如何不碍一心而以理事一心成就净业
  lesson: 以忏悔灭往生障，以五念门回向众生共生安养，理观与事修并运方能临终无怖安然往生
  summary_first_person: 我是宋僧遵式，采大本无量寿经及称赞净土等诸大乘经，集往生净土忏愿仪十科，立严净道场礼请赞礼忏愿旋诵坐禅之法，普劝四众同修净业共生安养
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/大藏经/论藏/诸宗部/往生净土忏愿仪.md
  - https://daizhige.org/佛藏/大藏经/论藏/诸宗部/往生净土忏愿仪.html
endeavors:
- id: guji-遵式-endeavor-1
  title_zh: 采经集往生净土忏愿仪
  summary_zh: 采无量寿经称赞净土等经立十科行法以利后学
  phases:
  - key: brewing
    name: 悯物发心
    labels:
      zh:
      - 悯物迷盲
      - 拈出净业捷径
    start_date: 0990
    highlight_event_id: guji-遵式-event-birth
  - key: breakthrough
    name: 采经立仪
    labels:
      zh:
      - 采大本经
      - 集忏愿法
    start_date: 1010
    highlight_event_id: guji-遵式-event-compile
  - key: climax
    name: 十科详定
    labels:
      zh:
      - 严净道场
      - 礼请忏愿
    start_date: 1013
    highlight_event_id: guji-遵式-event-compile
  - key: closure
    name: 流布结缘
    labels:
      zh:
      - 流布诸后
      - 普结净缘
    start_date: 1015
    highlight_event_id: guji-遵式-event-practice
  decisions:
  - date: 1010
    title_zh: 决定采诸大乘经集仪
    rationale: 诸佛悯物设多方便，唯安养净业捷直可修，十方诸佛无不称美，故取净土众经立行法
  - date: 1013
    title_zh: 决定以五念门加忏悔为正意
    rationale: 天亲五念门能毕竟往生见佛，加忏悔为除灭往生障顺佛慈悲速度众生
- id: guji-遵式-endeavor-2
  title_zh: 领众修七七日净土忏行
  summary_zh: 于闲静道场率十人以内克期精进昼夜六时修持
  phases:
  - key: brewing
    name: 方便调习
    labels:
      zh:
      - 别房调习
      - 诃弃爱欲
    start_date: 1015
    highlight_event_id: guji-遵式-event-compile
  - key: breakthrough
    name: 入坛正修
    labels:
      zh:
      - 严净供养
      - 奉请圣众
    start_date: 1017
    highlight_event_id: guji-遵式-event-practice
  - key: climax
    name: 礼忏发愿
    labels:
      zh:
      - 五悔并运
      - 系念不断
    start_date: 1017
    highlight_event_id: guji-遵式-event-practice
  - key: closure
    name: 旋诵坐禅证验
    labels:
      zh:
      - 旋绕诵经
      - 西向观想
    start_date: 1020
    highlight_event_id: guji-遵式-event-death
  decisions:
  - date: 1015
    title_zh: 限定行人十人六斋建首
    rationale: 行法贵专不贵多，多则喧杂难一心，十人以内方能同心克期取证
  - date: 1017
    title_zh: 坚持七日至七七日不减
    rationale: 依鼓音王十日十六观小弥陀七日之制，若减日期则心行未纯净业难成
events:
- id: guji-遵式-event-birth
  title_zh: 明州出生
  date: 0964
  year_of: 964
  place_zh: 明州宁海
  description_zh: 宋乾德二年生于明州，后出家习天台教观
- id: guji-遵式-event-compile
  title_zh: 采经集往生净土忏愿仪
  date: 1013
  year_of: 1013
  place_zh: 天竺
  description_zh: 采大本无量寿经及称赞净土等诸大乘经，集十科方法，立严净道场方便正意烧香礼请赞叹礼佛忏愿旋诵坐禅之制
- id: guji-遵式-event-practice
  title_zh: 率众行七七日净土忏
  date: 1017
  year_of: 1017
  place_zh: 天竺道场
  description_zh: 率四众十人以内昼夜六时礼十方佛及弥陀世尊，若坐若行皆勿散乱，以理一心事一心求生极乐
- id: guji-遵式-event-death
  title_zh: 示寂天竺
  date: 1032
  year_of: 1032
  place_zh: 杭州天竺
  description_zh: 宋明道元年示寂，世称慈云忏主，净土忏法盛行于后
