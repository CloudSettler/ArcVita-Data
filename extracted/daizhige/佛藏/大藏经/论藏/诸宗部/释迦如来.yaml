  - title_zh: 住世度生与入灭归真
    description_zh: 既愍四生漂流欲令安住如来藏又须示现无常入于寂灭以显真常
  - title_zh: 权现病食与法身真常
    description_zh: 久证法身而权现受供背疾卧床令人于有相中悟无相
  lesson: 以大悲示现生灭以遗教令人依法不依人常观无常而证真常
  summary_first_person: 我为能仁应世抚四生为子廓千界居尊法轮载转化迹弥隆今四心告满三德云归于双林北首入涅槃愿遗教流通令众生同归解脱
