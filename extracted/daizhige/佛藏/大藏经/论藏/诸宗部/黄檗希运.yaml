    rationale: 说法无说无示听法无闻无得，唯为息机忘见不被法障
  - date: 0848
    title_zh: 痛诫口头三昧临终热乱
    rationale: 平日瞒人临渴掘井不办，故劝闲时办取分晓忙时得用
