endeavors:
- id: guji-龙树-endeavor-1
  title_zh: 造中论申无生灭教破内学偏执
  summary: 承传法藏于像法之始，破五百部内学断常，牒八不以明二谛中实。
  phases:
  - key: brewing
    name: 禀比罗付嘱观像法内病
    labels:
      zh:
      - 酝酿
    start_date: '0180-01-01'
    highlight_event_id: guji-龙树-event-zhuanlun
  - key: breakthrough
    name: 牒八不立二谛为宗
    labels:
      zh:
      - 突破
    start_date: '0190-01-01'
    highlight_event_id: guji-龙树-event-zhuanlun
  - key: climax
    name: 横竖破二十七品显不生不灭
    labels:
      zh:
      - 高潮
    start_date: '0200-01-01'
    highlight_event_id: guji-龙树-event-zhuanlun
  - key: closure
    name: 收迷教开般若涅槃正法
    labels:
      zh:
      - 收束
    start_date: '0210-01-01'
    highlight_event_id: guji-龙树-event-zhuanlun
  decisions:
  - date: '0190-01-01'
    title_zh: 以二谛为宗首牒八不
    rationale: 外人学二谛成断常生灭，故以不生不灭等正其本，明教谛深义。
  - date: '0200-01-01'
    title_zh: 潜惟著笔不面对破而广收佛教
    rationale: 智慧日颓众闻名立伏，宜玄收迷情著论洗惑，使正教自开不须别立。
- id: guji-龙树-endeavor-2
  title_zh: 付法提婆续传法藏开中百之化
  summary: 去世付属提婆令面折外道，成师弟共弘中道之业，列四依传持不绝。
  phases:
  - key: brewing
    name: 察提婆上足堪任破外
    labels:
      zh:
      - 酝酿
    start_date: '0220-01-01'
    highlight_event_id: guji-龙树-event-fufa
  - key: breakthrough
    name: 授以无生灭观及二智方便
    labels:
      zh:
      - 突破
    start_date: '0225-01-01'
    highlight_event_id: guji-龙树-event-fufa
  - key: climax
    name: 付嘱法藏令集九十六种外道
    labels:
      zh:
      - 高潮
    start_date: '0230-01-01'
    highlight_event_id: guji-龙树-event-fufa
  - key: closure
    name: 示寂后提婆著百论续兴佛法
    labels:
      zh:
      - 收束
    start_date: '0240-01-01'
    highlight_event_id: guji-龙树-event-fufa
  decisions:
  - date: '0230-01-01'
    title_zh: 付法提婆不付余部论师
    rationale: 法胜呵梨等属生死缘河成断常，唯四依悟佛性河不生灭可托正教。
  - date: '0240-01-01'
    title_zh: 令提婆对缘面折异中论潜破
    rationale: 提婆隐迹婆罗门中外道不畏，宜无方对破，我如第三佛闻名立伏宜著论潜收。
events:
- id: guji-龙树-event-birth
  title_zh: 诞生南天竺
  date: '0150-01-01'
  year_of: 150
  description: 约东汉桓帝时生于南天竺婆罗门家，聪慧通晓内外典籍。
- id: guji-龙树-event-zhuanlun
  title_zh: 造中论十二门明八不中实
  date: '0190-01-01'
  year_of: 190
  description: 像法始兴内学执二谛成断常，造中论以二谛为宗，首牒不生不灭乃至不来不出，横竖破二十七品以显中道。
- id: guji-龙树-event-fufa
  title_zh: 付嘱提婆传持法藏
  date: '0230-01-01'
  year_of: 230
  description: 承摩诃迦叶以来二十三人传法之次，将法藏付提婆，令广破九十六种外道续兴摩诃衍。
- id: guji-龙树-event-death
  title_zh: 示寂于南天竺
  date: '0250-01-01'
  year_of: 250
  description: 化缘既毕方便示寂，法藏由提婆相承不断，后世尊为四依菩萨如佛无异。
