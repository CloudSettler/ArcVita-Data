  - 直对偏执明中与随缘化钝之难
  lesson: 以八不中道破断常虚妄令悟不生不灭
  summary_first_person: 吾承比罗付嘱而出世，观末世钝根住有住无失于二谛，故造中论牒八不以明中实，付法提婆以续佛慧命。
