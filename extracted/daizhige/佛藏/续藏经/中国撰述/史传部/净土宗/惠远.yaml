  - key: climax
    name: 般若台定见弥陀满空
    labels:
      zh:
      - 目击弥陀
    start_date: '0416-07-30'
    highlight_event_id: guji-惠远-event-linzhong
  - key: closure
    name: 七日期至端坐往生
    labels:
      zh:
      - 预知往生
    start_date: '0416-08-06'
    highlight_event_id: guji-惠远-event-death
  decisions:
  - date: 0392
    title_zh: 沉厚不言潜修观想
    rationale: 虽睹圣相而不轻说，唯克勤十念以固往生之志
  - date: '0416-08-06'
    title_zh: 却豉酒密浆遵律而终
    rationale: 以道疮病律无适文，披律寻文未半而终，全戒行以证净因
events:
- id: guji-惠远-event-birth
  title_zh: 诞生雁门
  date: '0334'
  year_of: 334
  place: 雁门
  description: 少游学许洛博总经史尤通庄老，后与弟惠持投大行道安出家
- id: guji-惠远-event-donglin
  title_zh: 居庐山创东林寺
  date: 0381
  year_of: 381
  place: 庐山
  description: 欲南之罗浮路出寻阳，见庐峰青峻以杖扣地得泉，创东林居之三十年影不出山
- id: guji-惠远-event-lianshe
  title_zh: 结莲社立誓往生
  date: '0402'
  year_of: 402
  place: 庐山东林佛影下净土观堂
  description: 与刘遗民雷次宗等僧俗百二十三人，于弥陀像前建诚立誓期升安养，令遗民撰文刻石
- id: guji-惠远-event-guanxiang
  title_zh: 初憩十一年三睹圣相
  date: 0392
  year_of: 392
  place: 庐山
  description: 澄心系想三观胜相而沉厚不言，著法性论罗什叹暗与理会
- id: guji-惠远-event-linzhong
  title_zh: 般若台见佛闻七日安慰
  date: '0416-07-30'
  year_of: 416
  place: 般若台东龛
  description: 方由定起见弥陀身满虚空观音势至侍立，水流光明分十四支演说苦空无常无我，告以七日当生我国，又见耶舍惠持昙顺前揖相迎
- id: guji-惠远-event-death
  title_zh: 义熙十二年八月六日示寂
  date: '0416-08-06'
  year_of: 416
  place: 庐山东林
  description: 寝疾却豉酒密浆命律师披律寻文，告法净惠宝等具言所见，至七日期果端坐而卒春秋八十三葬山西
