  decisions:
  - date: 0381
    title_zh: 止居庐峰创东林
    rationale: 见庐峰青峻可居，扣地得泉，遂不南适罗浮，结茅终焉以成弘化之基
  - date: '0402'
    title_zh: 会众于弥陀像前立誓
    rationale: 令遗民撰文刻石，期众同升安养，指群心誓生之所为莲社
- id: guji-惠远-endeavor-2
  title_zh: 专修净土观克勤十念
  summary: 以西方教迹为枢要，造净土观堂晨夕礼念，三睹圣相，著法性论，临终七日预知安慰往生
  phases:
  - key: brewing
