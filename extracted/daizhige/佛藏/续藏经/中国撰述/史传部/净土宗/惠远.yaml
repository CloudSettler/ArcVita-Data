  dilemmas:
  - 栖隐庐山不出俗与弘化接众之间的分际
  - 博综群经广学与专修西方一门之间的归一
  lesson: 澄心系想专志安养，结众立誓临终见佛，决定往生
  summary_first_person: 吾居庐山三十年影不出山，于佛影下造净土观堂晨夕礼念，与遗民等百二十三人结社立誓期生安养，三睹圣相临终亲见弥陀满虚空来迎，吾生净土决定矣
