    en: Huiyuan
  lifespan:
    birth:
      date: '0334'
      precision: year
      is_circa: true
      raw: 义熙十二年时年八十三逆推
    death:
      date: 0416-08-06
      precision: day
      is_circa: false
      raw: 义熙十二年八月六日顺寂
  birth_date: '0334'
  death_date: 0416-08-06
  era: 东晋
  reign_ref: 义熙十二年
  archetype: 净土始祖
  dilemmas:
  - 影不出山守志与弘道济世之衡
  - 情系同门爱聚与割欲西归之抉
  lesson: 以念佛三昧为先，谨律息心，三十年克勤不替，预知时至，安然西归，为后世净业楷模。
  summary_first_person: 吾姓贾，雁门楼烦人，幼好六经，尤善庄老，遇道安而悟般若皆糠秕，遂投簪受业，居庐山东林三十年，迹不入俗，结莲社，率百二十三人造像立誓，专修净土，三睹圣相，终见佛来安慰，七日后生，遗诫露骸松林，与土木同状，八十三岁而逝。
