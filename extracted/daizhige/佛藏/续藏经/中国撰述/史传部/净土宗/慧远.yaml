endeavors:
- id: guji-慧远-endeavor-1
  title_zh: 庐山开山结莲社念佛
  summary: 自太行从安，至浔阳扣地得泉，建龙泉及东林，结十八贤莲社，率众立誓同修净业。
  phases:
  - key: brewing
    name: 依安悟道
    labels:
      zh:
      - 从师求道
      - 般若开悟
    start_date: '0355'
    highlight_event_id: guji-慧远-event-congan
  - key: breakthrough
    name: 庐山得泉建舍
    labels:
      zh:
      - 栖神庐山
      - 扣地涌泉
    start_date: 0381
    highlight_event_id: guji-慧远-event-longquan
  - key: climax
    name: 建东林结莲社
    labels:
      zh:
      - 神运建刹
      - 结社立誓
    start_date: '0402'
    highlight_event_id: guji-慧远-event-lianshe
  - key: closure
    name: 三睹圣相预知时至
    labels:
      zh:
      - 澄心系想
      - 佛来安慰
    start_date: 0416-07-31
    highlight_event_id: guji-慧远-event-jianfo
  decisions:
  - date: 0381
    title_zh: 止庐山不入俗
    rationale: 见庐山间旷可以息心，山神梦告可栖，遂三十年迹不入俗，以净土克勤于念。
  - date: '0402'
    title_zh: 造像建斋立誓
    rationale: 谓诸教三昧念佛为先，遂造西方三圣像，令刘遗民著发愿文，王乔之等作念佛三昧诗，同修西归。
- id: guji-慧远-endeavor-2
  title_zh: 弘法护教垂范百世
  summary: 制莲华漏节行道，与罗什通好传译，著庐山集十卷，遗诫薄葬，为净土始祖。
  phases:
  - key: brewing
    name: 制莲华漏节行道
    labels:
      zh:
      - 严净律仪
      - 日夜行道
    start_date: 0390
    highlight_event_id: guji-慧远-event-lianshe
  - key: breakthrough
    name: 通好罗什弘通
    labels:
      zh:
      - 书问关中
      - 负荷至教
    start_date: '0401'
    highlight_event_id: guji-慧远-event-lianshe
  - key: climax
    name: 著述立教垂范
    labels:
      zh:
      - 经论序赞
      - 名重帝王
    start_date: '0410'
    highlight_event_id: guji-慧远-event-jianfo
  - key: closure
    name: 遗诫露骸顺寂
    labels:
      zh:
      - 绝迹外缘
      - 即岭为坟
    start_date: 0416-08-06
    highlight_event_id: guji-慧远-event-death
  decisions:
  - date: 0395
    title_zh: 山中立十二叶莲华漏
    rationale: 患山中无刻漏，遂于水上立莲华随波转，分定昼夜，以为行道之节。
  - date: 0416-08-06
    title_zh: 制七日展哀露骸松林
    rationale: 自审必尽之期，托业此山，不违古礼，即岭为坟，与土木同状，门徒始奉全躯葬西岭累石为塔。
events:
- id: guji-慧远-event-birth
  type: birth
  title_zh: 雁门贾氏诞生
  date: '0334'
  year_of: 334
  description: 姓贾氏，雁门楼烦人，幼而好学，十三游学许洛，博综六经，尤善庄老。
- id: guji-慧远-event-congan
  type: achievement
  title_zh: 从道安出家受业
  date: '0355'
  year_of: 355
  description: 年二十一欲渡江从范宁，值南路梗塞，见道安建刹太行，一面尽敬，闻讲般若豁然开悟，与弟慧持投簪受业，精思讽诵以夜继昼。
- id: guji-慧远-event-longquan
  type: achievement
  title_zh: 太元六年至庐山建龙泉精舍
  date: 0381
  year_of: 381
  description: 至浔阳见庐山间旷可以息心，扣地得清流，读海龙王经感神蛇大雨，岁竟有秋，因名龙泉精舍，后梦山神，雷震林辟，得桓伊建神运殿号东林。
- id: guji-慧远-event-lianshe
  type: achievement
  title_zh: 结莲社率众念佛立誓
  date: '0402'
  year_of: 402
  description: 集慧永慧持道生昙顺僧睿等及刘程之张野周续之宗炳雷次宗等十八贤，复率众至百二十三人，造西方三圣像，建斋立誓，令刘遗民著发愿文，同修净土。
- id: guji-慧远-event-jianfo
  type: achievement
  title_zh: 七月晦夕见佛预知七日往生
  date: 0416-07-31
  year_of: 416
  description: 初十一年三睹圣相沈厚不言，后十九年七月晦夕于般若台东龛定起，见阿弥陀佛身满虚空，观音势至侍立，水流光明演说苦空无常无我，佛告七日当生我国，又见邪舍慧持慧永遗民在侧揖请。
- id: guji-慧远-event-death
  type: death
  title_zh: 义熙十二年八月六日顺寂西岭
  date: 0416-08-06
  year_of: 416
  description: 即寝疾制遗诫，年已八十三，欲露骸松林即岭为坟，制七日展哀，至期顺寂，弟子与太守阮侃奉全躯葬西岭累石为塔，所著经论序铭诗记十卷号庐山集，百世推为净业始祖。
