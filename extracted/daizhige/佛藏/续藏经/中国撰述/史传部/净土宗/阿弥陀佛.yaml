  - 如何超越二百一十亿佛土建立清净庄严之国
  - 如何令十方众生乃至十念皆得往生不退
  lesson: 以无量愿摄无量土，心净则佛土净，一念归诚同登彼岸
  summary_first_person: 我本为国王，闻自在王佛说法，弃国捐王而作沙门，号法藏，睹见二百一十亿刹土，具足五劫思惟，发四十八愿，成就西方极乐世界，十方众生至心信乐欲生我国乃至十念皆得往生
