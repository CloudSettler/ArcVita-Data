      - 立因
    start_date: -4995-01-01
    highlight_event_id: guji-阿弥陀佛-event-practice
  decisions:
  - date: -5000-01-01
    title_zh: 弃国捐王而作沙门号法藏
    rationale: 闻佛说法心怀悦豫发无上正真道意，知不离土以言心，故舍小国求大土
  - date: -4999-01-01
    title_zh: 发四十八大愿
    rationale: 为普摄十方众生，设国有地狱三恶道则不取正觉，乃至十念若不生者不取正觉，以大愿为践形正轨
- id: guji-阿弥陀佛-endeavor-2
  title_zh: 成佛建极乐摄受十方众生
  summary: 愿行圆满成佛号阿弥陀，光明寿命无量，成就安乐刹，为十方恒河沙诸佛所共赞，众生闻名系念回向皆得往生
  phases:
  - key: brewing
    name: 修行圆满具足庄严
    labels:
      zh:
      - 修行
      - 圆满
    start_date: -4995-01-01
    highlight_event_id: guji-阿弥陀佛-event-practice
  - key: breakthrough
    name: 成佛号阿弥陀建极乐世界
    labels:
      zh:
      - 成佛
      - 建土
    start_date: -4990-01-01
    highlight_event_id: guji-阿弥陀佛-event-buddhahood
  - key: climax
    name: 十方诸佛咨嗟称名
    labels:
      zh:
      - 称名
      - 赞叹
    start_date: -4990-06-01
    highlight_event_id: guji-阿弥陀佛-event-buddhahood
  - key: closure
    name: 长住说法随愿接引
    labels:
      zh:
      - 摄受
      - 接引
    start_date: -4989-01-01
    highlight_event_id: guji-阿弥陀佛-event-death
  decisions:
  - date: -4990-01-01
    title_zh: 以光明寿命无量摄化
    rationale: 光明有限则不照十方，寿命有限则难尽未来际，故以无量光寿令即一即多无二无别
  - date: -4990-06-01
    title_zh: 开十念往生之门
    rationale: 十方众生至心信乐欲生我国乃至十念若不生者不取正觉，但肯回心都无弃物，故立易行道普令得度
events:
- id: guji-阿弥陀佛-event-birth
  title_zh: 出生为国王值自在王佛世
  date: -5000-01-01
  year_of: -5000
  summary: 过去久远世自在王佛世中有一国王闻佛说法心怀悦豫发无上道意
- id: guji-阿弥陀佛-event-vow
  title_zh: 法藏比丘诣佛所发四十八愿
  date: -4999-01-01
  year_of: -4999
  summary: 诣世自在王佛所求佛说法，睹二百一十亿刹土，发设我得佛国有地狱等四十八愿
- id: guji-阿弥陀佛-event-practice
  title_zh: 具足五劫思惟摄取庄严佛国
  date: -4998-01-01
  year_of: -4998
  summary: 其志寂静志无所著，具足五劫思惟摄取庄严佛国清净之行
- id: guji-阿弥陀佛-event-buddhahood
  title_zh: 成佛号阿弥陀成就西方极乐世界
  date: -4990-01-01
  year_of: -4990
  summary: 愿行圆满成佛，光明无量寿命无量，成就安乐刹备诸珍宝正觉华化生
- id: guji-阿弥陀佛-event-death
  title_zh: 无量寿长住不入涅槃
  date: 9999-12-31
  year_of: 9999
  summary: 寿命无能限量长住说法，临寿终时与大众围绕现其人前接引往生
