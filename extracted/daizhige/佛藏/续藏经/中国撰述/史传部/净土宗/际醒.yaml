    title_zh: 参广通粹如纯公求向上事
    rationale: 徧游名刹久无所契，须明师印心以了生死关头
  - date: '1790'
    title_zh: 继席广通策励后学
    rationale: 师资道合既得印心，当继席弘化振兴宗风不负付托
- id: guji-际醒-endeavor-2
  title_zh: 专修净业弘扬莲宗
  summary: 主张莲宗专修净业，日限香晤客过时唯礼念，迁觉生退居资福成丛林，著语录以深信切愿重心劝人念佛
  phases:
  - key: brewing
    name: 崇尚净业日限礼念
    labels:
