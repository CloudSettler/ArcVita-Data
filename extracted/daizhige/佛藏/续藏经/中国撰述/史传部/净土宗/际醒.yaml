person:
  qid: guji-际醒
  name_zh: 际醒
  names:
    zh: 际醒
    en: Jixing Chewu
  lifespan:
    birth:
      date: '1741'
      precision: year
      is_circa: true
      raw: 乾隆六年京东丰润马氏生
    death:
      date: 1810-02
      precision: month
      is_circa: false
      raw: 嘉庆十五年二月示寂
  birth_date: '1741'
  death_date: 1810-02
  era: 清
  reign_ref: 嘉庆
  archetype: 净土宗师
  dilemmas:
  - 既明禅宗向上大事，是否仍须舍禅专归净土
  - 宗风大振众所归仰之时，如何不惧讥谤而主张莲宗
  - 临终心力与业力交争，以何为重而定往生与否
  lesson: 以深信切愿培植重心，使净业强熟，则报尽命终定生西方不生余处
  summary_first_person: 我幼通经史，出家后遍历讲席，博贯性相，尤得法华三观十乘之旨，后参广通粹如纯公而明向上事，继席广通，宗风大振，每念永明寿禅师乃禅门宗匠尚归心净土，末代尤宜遵承，遂专修净业，主张莲宗，日限枝香晤客，过时唯礼念，以信深愿切之重心劝人，临终预知时至，嘱众努力念佛，他年净土好相见
  source_urls:
