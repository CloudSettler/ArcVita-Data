      - 圆寂
    start_date: 1810-02
    highlight_event_id: guji-际醒-event-death
  decisions:
  - date: '1792'
    title_zh: 舍禅专归净土主张莲宗
    rationale: 永明寿禅师为禅门宗匠尚归心净土，末代尤宜遵承以重心修净方保决定
  - date: '1802'
    title_zh: 退居红蠡山资福专弘净土
    rationale: 为法为人心终无厌，唯以净土为归，演说弥陀救苦摄乐之恩令闻者涕泗
events:
