    labels:
      zh: 付藏宗仰
    start_date: '0200'
    highlight_event_id: guji-龙树菩萨-event-death
  decisions:
  - date: 0185
    title_zh: 立志传华严出龙宫
    rationale: 以此经独为渊妙久摄龙宫六百余年不闻于世故立志诵持传布以开人天眼目
  - date: 0190
    title_zh: 开演因果不坏心宗
    rationale: 以五周大义悉标因果因该果海果彻因源故备陈感应以耸动群机启迪正信
events:
- id: guji-龙树菩萨-event-birth
  title_zh: 生于南天竺梵志豪贵家
  date: '0150'
  year_of: 150
  place_zh: 南天竺
  description_zh: 始生时在树下由龙成道因以为号襁褓能诵四韦陀有四万偈即能照了
- id: guji-龙树菩萨-event-study
  title_zh: 结友入山出家九旬通经论
  date: '0170'
  year_of: 170
  place_zh: 南天竺佛塔山中
  description_zh: 与友三人入山至一佛塔出家为道九旬诵阎浮提所有经论皆悉通达弱冠擅名诸国综练天文星纬道术
- id: guji-龙树菩萨-event-mahayana
  title_zh: 向雪山得摩诃衍受门神诃
  date: '0175'
  year_of: 175
  place_zh: 雪山瞿昙门前
  description_zh: 见一比丘以摩诃衍授之爱乐读诵辨才无尽请为师范自谓一切智欲从瞿昙门入门神诃其未辩如萤火齐日月闻之赧然有愧立志敷演以悟后学
- id: guji-龙树菩萨-event-dragon
  title_zh: 大龙接入海底开函得华严
  date: 0180
  year_of: 180
  place_zh: 大海龙宫
  description_zh: 独处水精房中大龙以神力接入大海至宫殿开七宝函以方等深奥无量妙法授之九旬通解深入见华严为文殊所集独为渊妙诵之在心龙知其悟道送还出宫
- id: guji-龙树菩萨-event-spread
  title_zh: 诵出华严传布人间付法藏
  date: 0185
  year_of: 185
  place_zh: 阎浮提
  description_zh: 初华严久摄龙宫六百余年乏大乘器不传自龙树诵出始得传布于世付法藏因缘经及西域记贤首华严传具志其事
- id: guji-龙树菩萨-event-death
  title_zh: 示寂归灭后世宗为初祖
  date: '0250'
  year_of: 250
  place_zh: 南天竺
  description_zh: 弘化既毕泊然示寂后世尊为大乘初祖华严感应诸传并首载其取经之事以劝进修
