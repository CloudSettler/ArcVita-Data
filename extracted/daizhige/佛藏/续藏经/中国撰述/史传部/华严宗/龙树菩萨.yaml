    title_zh: 裹粮入山依塔出家
    rationale: 以津途无量欲求出世正法故舍俗入道九旬遍览阎浮经论
  - date: 0180
    title_zh: 随大龙入海开函受法
    rationale: 以独处静室思敷演以悟后学蒙大龙愍念故深入宝宫亲见华严渊妙诵持在心
- id: guji-龙树菩萨-endeavor-2
  title_zh: 传布华严敷演大乘利世
  description_zh: 自龙宫还出人间始传华严流布世间付法藏中具载其事令乏大乘器者得闻第一义谛饶益众生开悟后学
