    start_date: 0440-01-01
    highlight_event_id: guji-求那跋陀罗-event-death
  decisions:
  - date: 0439-05-01
    title_zh: 以四海为家劝帝行大戒
    rationale: 帝王刑不夭命役不劳力风雨调百谷茂即是大斋至戒安在减一膳全一命
  - date: 0440-01-01
    title_zh: 安住祇园译经化众
    rationale: 得帝供养不图荣利唯以译经讲学续佛慧命为究竟
