  - date: '0505'
    title_zh: 屏绝荤血受戒
    rationale: 武帝宏佛教则奉而行之，以净戒为往生之本
  - date: '0510'
    title_zh: 舍供赐充法事精研维摩
    rationale: 武帝所立经义皆得指归，尤精维摩，以财法二施弘护三宝
events:
