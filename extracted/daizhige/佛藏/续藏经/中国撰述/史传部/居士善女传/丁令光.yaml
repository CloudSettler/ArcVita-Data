  decisions:
  - date: 0498
    title_zh: 小心祗敬事郗后
    rationale: 郗后性猜刻，未尝有过谪，以谨慎全身保嗣业
  - date: '0502'
    title_zh: 仁恕接物不好华饰
    rationale: 位在三夫人上居显阳殿，以俭约仁恕得群侍欢心
