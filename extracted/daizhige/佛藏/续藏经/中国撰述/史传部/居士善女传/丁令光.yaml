  dilemmas:
  - 处郗后猜刻之下如何小心祗敬以全身立德
  - 处宫廷富贵之中如何屏绝荤血华饰以坚修佛业
  lesson: 去贪爱存仁恕，以戒行净业回向解脱
  summary_first_person: 我生樊城入梁宫，虽处贵嫔之位，不好华饰，仁恕接物，屏荤受戒，助弘经义，悉舍供赐为法事，惟愿净业成就
