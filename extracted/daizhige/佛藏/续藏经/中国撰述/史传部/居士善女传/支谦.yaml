    rationale: 世榮無常，道業為重，欲以清淨身心終全戒品，故不交世務也
  - date: '0252'
    title_zh: 從竺法蘭更煉五戒
    rationale: 欲以優婆塞身份嚴持淨戒，親近沙門，增進定慧也
events:
- id: guji-支谦-event-birth
  title_zh: 誕生於歸化大月支家
  date: 0193
  year_of: 193
  type: birth
  description: 大父法度於漢靈帝世率國數百歸化拜率善中郎將，吾生於河南洛陽一帶，幼而仁慈
  endeavor_ref: guji-支谦-endeavor-1
- id: guji-支谦-event-nandu
  title_zh: 幼顯慈心及讓被南渡
  date: '0201'
  year_of: 201
  type: career
  description: 七歲傷脛不殺犬，化鄉人悉不殺生，十歲學書十三通梵書六國語，獻帝末與鄉人避寇歸吳，夜半客奪被而去，忍而不告以全客命
  endeavor_ref: guji-支谦-endeavor-1
- id: guji-支谦-event-zhaodui
  title_zh: 孫權召見拜博士輔東宮
  date: '0222'
  year_of: 222
  type: career
  description: 至吳聞博學有才，吳主問經中深隱義，應機釋難無疑不析，大悅拜博士使輔導東宮
  endeavor_ref: guji-支谦-endeavor-1
- id: guji-支谦-event-yijing
  title_zh: 譯摩詰泥洹等二十七經
  date: '0223'
  year_of: 223
  type: career
  description: 譯摩詰大般泥洹法句瑞應本起等二十七經，辭旨文雅盛傳於世，為天下博知三支出色者
  endeavor_ref: guji-支谦-endeavor-1
- id: guji-支谦-event-yinju
  title_zh: 隱穹窿山更煉五戒
  date: '0251'
  year_of: 251
  type: career
  description: 太子即位後遂隱於穹窿山不交世務，從道人竺法蘭更煉五戒，所遊從皆沙門而已
  endeavor_ref: guji-支谦-endeavor-2
- id: guji-支谦-event-death
  title_zh: 年六十卒於山中
  date: '0253'
  year_of: 253
  type: death
  description: 隱居持戒十餘年，年六十無疾卒於穹窿山中，時人歎其戒德譯功並美
  endeavor_ref: guji-支谦-endeavor-2
