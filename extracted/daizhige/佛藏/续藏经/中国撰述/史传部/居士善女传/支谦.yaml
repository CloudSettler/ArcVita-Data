  archetype: 譯經弘法型居士
  dilemmas:
  - 一被之失與一命之重，忍小失以全慈悲戒殺之抉擇
  - 輔導東宮榮顯與隱山煉戒清淨，出處進退之抉擇
  lesson: 以慈持戒，以解譯經，出則弘法利世，隱則守戒全真
  summary_first_person: 吾支謙字恭明，大月支歸化之後，幼通梵漢，遭亂南渡歸吳，蒙吳主知遇拜博士輔東宮，譯摩詰泥洹法句等二十七經，晚隱穹窿從竺法蘭更煉五戒，年六十卒，唯願以譯經功德普利群生
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/X1646
