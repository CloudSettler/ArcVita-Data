    highlight_event_id: guji-慧能-event-death
  decisions:
  - date: '0676-01-01'
    title_zh: 南归后开示金刚般若见性法
    rationale: 本因金刚经开悟得五祖印可故常劝僧俗但持金刚经即自见性直了成佛
  - date: '0713-08-03'
    title_zh: 临终以本心见性付嘱门人
    rationale: 不识本心学法无益若识自本心见自本性即名丈夫天人师佛故以此为究竟付托
