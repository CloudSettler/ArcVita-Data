  dilemmas:
  - 文藻经世与笃信佛理如何兼全
  - 仙道长生与佛道觉悟孰真孰妄
  lesson: 以文章通佛理，以声音弘法事，文艺亦可为弘道之器
  summary_first_person: 吾精通书艺，每读佛经辄留连嗟玩，以为至道之极宗，游渔山感空中梵响之清婉，仿其声而制梵呗，又著辨道论以明仙道虚妄，愿以文声助显正法
