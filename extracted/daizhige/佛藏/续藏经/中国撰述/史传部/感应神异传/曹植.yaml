endeavors:
- id: guji-曹植-endeavor-1
  title_zh: 研读佛经著辨道论
  summary: 博览佛经，尊为至道极宗，著辨道论以斥仙道虚妄
  phases:
  - key: brewing
    name: 精通书艺博览
    labels:
      zh: 研读蓄养
    start_date: '0210'
    highlight_event_id: guji-曹植-event-reading
  - key: breakthrough
    name: 尊佛为极宗
    labels:
      zh: 立宗
    start_date: 0218
    highlight_event_id: guji-曹植-event-reading
  - key: climax
    name: 著辨道论斥仙
    labels:
      zh: 著论明道
    start_date: '0223'
    highlight_event_id: guji-曹植-event-biandao
  decisions:
  - date: 0218
    title_zh: 留连佛经尊为极宗
    rationale: 以经义深广远胜俗典，故立佛为至道，不以儒玄自限
  - date: '0223'
    title_zh: 著辨道论破仙道妄
    rationale: 以仙道求形不求心多涉虚诞，故著论辨伪以显正觉
- id: guji-曹植-endeavor-2
  title_zh: 游渔山制梵呗
  summary: 游渔山闻空中梵响，仿其清婉制为梵呗，传为渔山梵
  phases:
  - key: brewing
    name: 游渔山闻梵
    labels:
      zh: 感闻
    start_date: '0222'
    highlight_event_id: guji-曹植-event-yushan
  - key: breakthrough
    name: 仿梵声制呗
    labels:
      zh: 制呗
    start_date: '0222'
    highlight_event_id: guji-曹植-event-yushan
  - key: closure
    name: 渔山梵传法事
    labels:
      zh: 流传
    start_date: '0225'
    highlight_event_id: guji-曹植-event-yushan
  decisions:
  - date: '0222'
    title_zh: 仿梵天响制梵呗
    rationale: 以梵音清扬哀婉最能摄心导善，故写为呗赞以助法事讽诵
  - date: '0225'
    title_zh: 以梵呗付法事行持
    rationale: 以声音为弘法方便，故留其余奏使后世法会得有所依
events:
- id: guji-曹植-event-birth
  title_zh: 曹植出生
  date: 0192
  year_of: 192
  description: 汉末沛国谯县出生，为曹操第三子，少聪慧善属文
- id: guji-曹植-event-reading
  title_zh: 留连佛经尊为极宗
  date: 0218
  year_of: 218
  description: 精通书艺为邯郸淳所称天人，每读佛经辄留连嗟玩，以为至道之极宗
- id: guji-曹植-event-yushan
  title_zh: 游渔山制梵呗
  date: '0222'
  year_of: 222
  description: 游渔山闻空中梵天之响清扬哀婉，因仿其声写为梵呗，后世法事称为渔山梵
- id: guji-曹植-event-biandao
  title_zh: 著辨道论斥仙道
  date: '0223'
  year_of: 223
  description: 著辨道论，言仙道虚妄，以明佛理真实
- id: guji-曹植-event-death
  title_zh: 曹植去世
  date: '0232-06-27'
  year_of: 232
  description: 魏明帝太和六年病逝于陈郡，年四十一，谥曰思
