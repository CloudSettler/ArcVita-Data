- id: guji-法尚-event-death
  title_zh: 示现念佛往生
  date: '0713-02-24'
  year_of: 713
  description: 七十八岁二月廿四日告众地藏来告当生忉利及慈氏二会得道自愿生西方专念一日一夜合掌向西而逝放光还净土
