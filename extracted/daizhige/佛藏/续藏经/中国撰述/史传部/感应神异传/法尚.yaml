events:
- id: guji-法尚-event-birth
  title_zh: 出生
  date: '0635'
  year_of: 635
  description: 唐初生于奉法之家少习游猎家业确年失载以卒年逆推
- id: guji-法尚-event-tiger-rescue
  title_zh: 猎遇虎难蒙地藏救
  date: '0671'
  year_of: 671
  description: 游猎逐虎弦断马蹶梦沙门自称地藏追虎而寤见马嘶立虎迹不见知朽木放光即其身
