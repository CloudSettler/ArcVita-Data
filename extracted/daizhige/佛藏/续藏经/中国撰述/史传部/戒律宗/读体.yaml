endeavors:
- id: guji-读体-endeavor-1
  title_zh: 弃爵东行求戒嗣席华山
  summary_zh: 自滇南弃袭爵出家，参访南岳九华五台，东至海潮从三昧受具，后嗣席华山，以十誓重整僧制。
  phases:
  - key: brewing
    name: 弃爵出家宝洪受度
    labels:
      zh:
      - 出家
      - 华严有省
    start_date: 1627-01-01
    highlight_event_id: guji-读体-event-ordination
  - key: breakthrough
    name: 跋涉江南海潮圆具
    labels:
      zh:
      - 求戒
      - 参学
    start_date: 1632-01-01
    highlight_event_id: guji-读体-event-ordination
  - key: climax
    name: 金陵传戒华山掌院
    labels:
      zh:
      - 教授
      - 掌院
    start_date: 1640-01-01
    highlight_event_id: guji-读体-event-succession
  - key: closure
    name: 十誓励众嗣席弘律
    labels:
      zh:
      - 嗣席
      - 立制
    start_date: 1644-01-01
    highlight_event_id: guji-读体-event-succession
  decisions:
  - date: 1627-01-01
    title_zh: 弃袭爵剑川出家
    rationale: 念世相无常，不慕军功世职，往赤宕岩从老僧受华严，诣宝洪山求度
  - date: 1632-01-01
    title_zh: 携瓢笠东行就三昧受具
    rationale: 慕江南三昧律师，历南岳破额九华五台，至海潮庵圆具充上座代讲梵网
  - date: 1644-01-01
    title_zh: 嗣席立十誓整肃华山
    rationale: 承三昧付衣钵戒本，不与剃度为徒，不蓄私财，不立化主募缘，以律重振道场
- id: guji-读体-endeavor-2
  title_zh: 修般舟建戒坛开戒著述
  summary_zh: 历兵难不屈感化护法，躬修般舟三昧，建石戒坛，开坛说戒万人，著止持会集等诸书传世。
  phases:
  - key: brewing
    name: 检律祷佛涣然冰释
    labels:
      zh:
      - 阅律
      - 求解
    start_date: 1635-01-01
    highlight_event_id: guji-读体-event-succession
  - key: breakthrough
    name: 兵难从容感化护法
    labels:
      zh:
      - 蒙难
      - 护法
    start_date: 1646-01-01
    highlight_event_id: guji-读体-event-succession
  - key: climax
    name: 建石戒坛开坛说戒
    labels:
      zh:
      - 般舟
      - 传戒
    start_date: 1650-01-01
    highlight_event_id: guji-读体-event-altar
  - key: closure
    name: 示寂茶毗舍利著述行世
    labels:
      zh:
      - 示寂
      - 著述
    start_date: 1679-03-02
    highlight_event_id: guji-读体-event-death
  decisions:
  - date: 1646-01-01
    title_zh: 剑戟林中从容对答保全华山
    rationale: 官兵搜山被押，神色不变，直言大道不禁往来，感巴廒敬服复还田地给帖永照
  - date: 1650-01-01
    title_zh: 修般舟建石坛广开戒期
    rationale: 为众楷模九十昼夜不坐卧二次，遵祇园遗制建坛，开坛少则五千多至万四千指，八坐道场七十余期
  - date: 1670-01-01
    title_zh: 集止持会集等诸书传后
    rationale: 恐律学复晦，集四分广律，撰传戒正范僧行轨则等十余种，使后学有所依
events:
- id: guji-读体-event-birth
  title_zh: 生于滇南白鹿
  date: 1601-04-05
  year_of: 1601
  place_zh: 滇南白鹿郡
  description_zh: 父胤昌母吴氏，梦明月投怀而生，幼神敏善绘大士像，时称小吴道子，十四父母继卒依伯为嗣。
- id: guji-读体-event-ordination
  title_zh: 弃爵出家东行圆具
  date: 1627-06-01
  year_of: 1627
  place_zh: 剑川赤宕岩至江南海潮庵
  description_zh: 二十七弃袭爵，遇兰若老僧授华严有省，从宝洪亮如乞度，偕成拙东行参南岳九华五台，遇三昧于海潮庵圆具充上座。
- id: guji-读体-event-succession
  title_zh: 嗣席华山立十誓历兵难
  date: 1646-08-01
  year_of: 1646
  place_zh: 华山报恩寺
  description_zh: 随昧师主华山掌院务，承付法衣戒本嗣席，以十誓励众，顺治三年官兵押赴军前从容感化，得复田地护法。
- id: guji-读体-event-altar
  title_zh: 修般舟建石戒坛开坛说戒
  date: 1650-05-01
  year_of: 1650
  place_zh: 华山铜殿之右
  description_zh: 躬修般舟三昧九十昼夜二次，建石戒坛感大士现瑞，开坛说戒多至万四千指，别请天宁五台碧峰诸刹。
- id: guji-读体-event-death
  title_zh: 端坐示寂茶毗获舍利
  date: 1679-03-02
  year_of: 1679
  place_zh: 华山
  description_zh: 示微疾嘱勿进汤药，更七日端坐而逝，世寿七十九僧腊四十四，茶毗获五色舍利无数，法嗣六十余人门徒数万。
