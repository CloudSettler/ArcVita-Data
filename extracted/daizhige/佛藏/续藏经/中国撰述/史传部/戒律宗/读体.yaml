  - 兵戈押解危难与从容护法之间的持守
  lesson: 以戒为法命，以十誓束身，以般舟苦行与开坛传戒续南山慧命
  summary_first_person: 吾滇南许氏子，梦月而生，二十七弃爵出家，东行受具于三昧座下，嗣席华山，以十誓励众，开坛说戒七十余期，建石坛，修般舟，著述传世，愿律命不绝于末运。
