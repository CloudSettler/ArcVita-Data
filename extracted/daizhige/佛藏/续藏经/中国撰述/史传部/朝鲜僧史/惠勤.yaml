  - 入华求法十年与归国济众之间，进退难决
  - 重营桧岩弘化与远离京邑纷扰之间，住止难安
  lesson: 破古今窠臼，直指心要，以实修实证续祖灯而利群生
  summary_first_person: 吾名惠勤，别号懒翁，宁海牙氏子，幼因邻友之死痛念无常而出家，甲申于桧岩独坐得悟，遂入燕都参指空，历参平山千岩得衣拂授记，奉旨住广济，后东还住台山桧岩，主功夫选，判衲子机缘，重兴殿宇，丙辰示寂于神勒，愿以棒喝扫尽凡圣踪由
