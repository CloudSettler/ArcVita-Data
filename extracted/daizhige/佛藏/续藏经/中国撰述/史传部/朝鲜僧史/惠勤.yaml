endeavors:
- id: guji-惠勤-endeavor-1
  title_zh: 入元求法参悟得记
  summary: 年冠出家，桧岩开悟，赴燕参指空，游江浙参平山千岩，受衣拂梵书，得授记而为西天百八代嫡传
  phases:
  - key: brewing
    name: 出家访道桧岩开悟
    labels:
      zh:
      - 出家
      - 开悟
    start_date: 1344
    highlight_event_id: guji-惠勤-event-enlightenment
  - key: breakthrough
    name: 燕都参指空契合
    labels:
      zh:
      - 参谒
      - 契合
    start_date: 1348-03-01
    highlight_event_id: guji-惠勤-event-yandu
  - key: climax
    name: 江浙参访受衣拂印可
    labels:
      zh:
      - 印可
      - 传衣
    start_date: 1350-01-01
    highlight_event_id: guji-惠勤-event-seal
  - key: closure
    name: 奉旨住广济辞师东还
    labels:
      zh:
      - 住持
      - 东还
    start_date: 1358-03-01
    highlight_event_id: guji-惠勤-event-return
  decisions:
  - date: 1348-03-01
    title_zh: 决意泛海入燕参指空
    rationale: 于桧岩虽得开悟，尚欲亲证西天正传，故不惮海道远赴大都
  - date: 1358-03-01
    title_zh: 辞指空得授记东还
    rationale: 既蒙衣拂授记，当归东土随机说法，续祖灯于三山两水之地
- id: guji-惠勤-endeavor-2
  title_zh: 归国住持重兴桧岩
  summary: 东还居台山，应召说法不避红贼，主广明功夫选验衲子，重营桧岩，落成示寂分舍利
  phases:
  - key: brewing
    name: 东还入台山潜修
    labels:
      zh:
      - 归国
      - 潜修
    start_date: 1358-03-01
    highlight_event_id: guji-惠勤-event-return
  - key: breakthrough
    name: 应召入京说法退贼
    labels:
      zh:
      - 说法
      - 护寺
    start_date: 1361-11-01
    highlight_event_id: guji-惠勤-event-capital
  - key: climax
    name: 广明功夫选验衲子
    labels:
      zh:
      - 拈香
      - 选僧
    start_date: 1370-09-16
    highlight_event_id: guji-惠勤-event-selection
  - key: closure
    name: 重营桧岩示寂分舍利
    labels:
      zh:
      - 营建
      - 示寂
    start_date: 1376-04-01
    highlight_event_id: guji-惠勤-event-death
  decisions:
  - date: 1361-11-01
    title_zh: 红贼至而不避寺
    rationale: 唯命是保，信土地神护持，若众散则寺灭，故安住说法以镇僧心
  - date: 1376-05-15
    title_zh: 病中移锡神勒示寂
    rationale: 桧岩逼近京邑士女络绎被旨移住，遂顺缘止于骊兴，以顶骨舍利示所终之地
events:
- id: guji-惠勤-event-birth
  date: 1320
  year_of: 1320
  title_zh: 出生于宁海
  description: 母郑氏梦金色隼坠五彩卵入怀而有娠，以延佑庚申生，俗姓牙氏，初名元惠
- id: guji-惠勤-event-enlightenment
  date: 1344
  year_of: 1344
  title_zh: 桧岩独坐开悟
  description: 年甫冠投功德山了然祝发，至正甲申至桧岩昼夜独坐忽得开悟，遂决意入中国求证
- id: guji-惠勤-event-yandu
  date: 1348-03-01
  year_of: 1348
  title_zh: 至燕都参指空
  description: 戊子三月至燕都参指空，答问契合，留侍十年，参究千釰之用
- id: guji-惠勤-event-seal
  date: 1350-01-01
  year_of: 1350
  title_zh: 蒙指空印可授衣
  description: 庚寅正月空集众下语无能对，出众吐数语三拜而出，复游江浙参平山雪岩千岩，得衣拂梵书授记
- id: guji-惠勤-event-return
  date: 1358-03-01
  year_of: 1358
  title_zh: 辞师东还入台山
  description: 戊戌春辞指空得授记东还，且行且止随机说法，庚子入台山居焉
- id: guji-惠勤-event-capital
  date: 1361-11-01
  year_of: 1361
  title_zh: 应召说法红贼不至
  description: 辛丑冬召入京请说心要赐袈裟拂子，十一月红贼蹂躏京畿，安住不避，梦神守土地座，贼果不至
- id: guji-惠勤-event-selection
  date: 1370-09-16
  year_of: 1370
  title_zh: 广明寺功夫选
  description: 玄陵二十年庚戌九月十六日就广明寺大会两宗五教衲子，升座破古今窠臼，以三句三关验幼庵修等，会罢还桧岩
- id: guji-惠勤-event-death
  date: 1376-05-15
  year_of: 1376
  title_zh: 示寂于神勒寺
  description: 重营桧岩落成被旨移住营源，舆至汉江寓神勒，五月十五日辰时寂然逝，年五十七，法腊三十八，得舍利百五十五粒，浮屠于桧岩北崖
