  - date: 1679-01-01
    title_zh: 就本寺开为丛林浚池放生
    rationale: 充拓厨库浴圊禅堂安众以禅观度群流以放生广福田
  - date: 1699-06-01
    title_zh: 应请主持上竺经营毗卢殿工
    rationale: 恭迎圣驾永镇灵山不忍梵刹湮没以一力新之
  - date: 1721-06-01
    title_zh: 祝融后复入山主持重建
    rationale: 灵山钟鼓寂然不辞老病立规策众广聚福田再兴宝地
