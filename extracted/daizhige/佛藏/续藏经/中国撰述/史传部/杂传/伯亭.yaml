    rationale: 依嘱志超界外慈徧尘刹律为师论为友承贤首嫡传弘化
  - date: 1670-03-01
    title_zh: 开讲般若楞严并排五教继证图
    rationale: 使学徒教观朗然不支离注解以图示圆融普利后进
  - date: 1679-01-01
    title_zh: 删定五教仪开蒙科注流通
    rationale: 恐学人遗忘难入立标本易披对募刻广行
