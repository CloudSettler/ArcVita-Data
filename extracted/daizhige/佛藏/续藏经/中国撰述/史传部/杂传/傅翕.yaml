  reign_ref: 南齐建武至南陈太建
  archetype: 在家应化菩萨
  dilemmas:
  - 天宫受乐与人间度生之抉择
  - 舍身速脱与住世度众之两难
  - 空谈悟道与持戒苦行之辨
  lesson: 舍天乐而不居，代众苦而持斋，以在家身行菩萨道，誓归兜率以续化
  summary_first_person: 我是傅翕，字玄风，义乌农家子，二十四岁遇嵩头陀而悟前缘，结庵双林，日作夜道，自号善慧大士，三至京师，抄经千卷，立誓持上斋代众偿业，临终作还源诗，期众生同生兜率见我
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E6%9D%82%E4%BC%A0/%E5%85%9C%E7%8E%87%E9%BE%9F%E9%95%9C%E9%9B%86.html
endeavors:
- id: guji-傅翕-endeavor-1
  title_zh: 双林结庵弘化
  summary_zh: 遇嵩头陀点化，舍天乐而度生，结庵松山双梼树下，夜行道旦劳作，感佛放光，对武帝而名动天下
  phases:
  - key: brewing
    name: 稽停遇僧
    labels:
      zh: 点化观影
    start_date: '0520-01-01'
    highlight_event_id: guji-傅翕-event-meet
  - key: breakthrough
    name: 双林立庵
    labels:
      zh: 悟无生忍
    start_date: '0520-06-01'
    highlight_event_id: guji-傅翕-event-shuanglin
  - key: climax
    name: 阙下对问
    labels:
      zh: 名动京师
    start_date: '0534-01-01'
    highlight_event_id: guji-傅翕-event-audience
  - key: closure
    name: 抄经度众
    labels:
      zh: 甘露普润
    start_date: '0535-01-01'
    highlight_event_id: guji-傅翕-event-audience
  decisions:
  - date: '0520-01-01'
    title_zh: 舍兜率之乐发度生愿
    rationale: 见圆光宝盖知前身自兜率来，笑言炉鞴多钝铁良医门下多病人，当度生为急不暇思天乐
  - date: '0534-01-01'
    title_zh: 对武帝答无所从师
    rationale: 学道须值无生师，我是现前得无生人，不覆藏以直示，使名僧云集而不立门户之见
- id: guji-傅翕-endeavor-2
  title_zh: 持斋誓愿归兜率
  summary_zh: 大同八年立誓三年持上斋代众偿业，营火龛欲烧身供养，弟子苦留，作还源诗示寂，反手传香以证明归兜率
  phases:
  - key: brewing
    name: 立誓上斋
    labels:
      zh: 代苦布施
    start_date: '0542-01-01'
    highlight_event_id: guji-傅翕-event-vow
  - key: breakthrough
    name: 营龛誓舍
    labels:
      zh: 烧身供养
    start_date: '0542-06-01'
    highlight_event_id: guji-傅翕-event-vow
  - key: climax
    name: 还源示疾
    labels:
      zh: 付嘱二子
    start_date: '0569-04-01'
    highlight_event_id: guji-傅翕-event-death
  - key: closure
    name: 反手传香
    labels:
      zh: 兜率之征
    start_date: '0569-05-01'
    highlight_event_id: guji-傅翕-event-death
  decisions:
  - date: '0542-01-01'
    title_zh: 每月六日不饮食以代众苦
    rationale: 自念无可从心布施，以饥渴之苦代一切众生酬偿罪业，以不食之粮广作布施
  - date: '0569-04-01'
    title_zh: 期嵩头陀先往忉利不久还兜率
    rationale: 我从第四天来为度众生故，汝愿生彼即得见我，使徒众不怀悲恋生生不相舍离
events:
- id: guji-傅翕-event-birth
  title_zh: 生于义乌农家
  date: '0497-05-08'
  year_of: 497
  place_zh: 婺州义乌县
  description: 父宣慈母王氏世为农，端靖淳和无所爱着，少时渔而放生，以竹笼沉水祝去者去止者留
- id: guji-傅翕-event-meet
  title_zh: 稽停塘遇嵩头陀
  date: '0520-01-01'
  year_of: 520
  place_zh: 稽停塘下
  description: 年二十四遇梵僧嵩头陀，言昔于毗婆尸佛前发愿今自兜率受用，命临水观影见圆光宝盖，遂发度生愿
- id: guji-傅翕-event-shuanglin
  title_zh: 结庵双林自号善慧
  date: '0521-01-01'
  year_of: 521
  place_zh: 松山双梼树下双林寺
  description: 与妙光日营作夜行道，见释迦金粟定光三佛放光集身，身常出妙香，感七佛相随，自称双树下当来解脱善慧大士，得首楞严三昧无漏智
- id: guji-傅翕-event-audience
  title_zh: 三至京师对武帝
  date: '0534-01-01'
  year_of: 534
  place_zh: 建康阙下
  description: 大通六年诣阙，武帝问师事从谁，答从无所从师无所师事无所事，天下名僧云集，常降甘露，躬写经律千余卷
- id: guji-傅翕-event-vow
  title_zh: 立誓三年持上斋
  date: '0542-01-01'
  year_of: 542
  place_zh: 双林
  description: 大同八年立誓每月六日不饮食，作愿文以饥渴代众偿业，欲执志烧身为大明灯，弟子坚意等请代持斋，四部刺心烧指割耳留住
- id: guji-傅翕-event-death
  title_zh: 太建元年入涅槃
  date: '0569-05-27'
  year_of: 569
  place_zh: 双林山顶
  description: 夏四月丙申朔寝疾，告普建普成云我从第四天来，作还源诗十二章，二十四日乙卯入涅槃年七十三，肉色不变三日还暖，七日反手受香，法猛送织成弥勒像镇床
