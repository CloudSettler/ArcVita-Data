  title_zh: 永平六年月支遇腾兰得经像
  date: 0063-01-01
  year_of: 63
  description_zh: 蔡愔于天竺邻境月支国遇摩腾竺法兰得佛倚像并梵本经六十万言载以白马相与东还
- id: guji-刘庄-event-temple
  title_zh: 永平十年勅立白马寺
  date: 0067-01-01
  year_of: 67
  description_zh: 勅于洛阳城西立白马寺以居腾兰以白马驮经故名又幸寺礼舍利冢诏塔其上高二百尺
- id: guji-刘庄-event-translate
  title_zh: 白马寺译四十二章经
  date: 0067-06-01
  year_of: 67
  description_zh: 腾兰于白马寺译四十二章经明年帝幸寺腾兰进说圣冢因缘光随步武群臣归信
- id: guji-刘庄-event-death
  title_zh: 永平十八年崩于洛阳
  date: 0075-09-05
  year_of: 75
  description_zh: 永平十八年八月壬子崩在位十八年以梦想求法建寺译经为东土佛法外护之祖
