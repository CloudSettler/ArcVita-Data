  description_zh: 建武四年五月生为光武第四子后继位为孝明皇帝改元永平
- id: guji-刘庄-event-dream
  title_zh: 永平三年南宫梦金人
  date: 0060-04-08
  year_of: 60
  description_zh: 寝南宫梦金人长丈六项佩日光胸题卍字飞行殿庭旦问群臣傅毅王遵对以西域有佛引周书异记为证
- id: guji-刘庄-event-dispatch
  title_zh: 遣蔡愔秦景西访佛道
  date: 0060-06-01
  year_of: 60
  description_zh: 即遣定远将军蔡愔中郎将秦景博士王遵等十八人使西域访求佛道
