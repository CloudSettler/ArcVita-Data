person:
  qid: guji-慧洪
  name_zh: 慧洪
  names:
    zh: 慧洪
    en: Huihong Juefan
  lifespan:
    birth:
      date: 1071
      precision: year
      is_circa: false
      raw: 宋神宗熙宁四年
    death:
      date: 1128
      precision: year
      is_circa: false
      raw: 宋高宗建炎二年
  birth_date: 1071
  death_date: 1128
  era: 北宋至南宋
  reign_ref: 熙宁至建炎
  archetype: 丛林文僧
  dilemmas:
  - 禅悦与翰墨兼擅而屡遭迁谪当如何自处
  - 尊宿高行散于谈笑当如何记录而不失其真
  - 体道见性与文字言说之间当如何权衡而不落筌蹄
  lesson: 以游戏翰墨存丛林遗训，见亡执谢而纵口成真，有补于宗教如俭岁粱稷
  summary_first_person: 吾筠阳人也，名慧洪，号觉范，得自在三昧于云庵老人，每与林间胜士抵掌清谈，凡尊宿高行与丛林遗训随得即录，垂十年得三百余事，门人本明析为上下帙名曰林间录，今住临川北景德禅寺，愿托斯文以寿后世
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/史传部/杂传/林间录.html
  - https://zh.wikisource.org/wiki/林間錄
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏续藏经林间录.md
endeavors:
- id: guji-慧洪-endeavor-1
  title_zh: 云庵得法与丛林参学
  summary_zh: 少年出家游方湘中，亲近云庵老人得自在三昧，纵口谈禅信笔成文
  phases:
  - key: brewing
    name: 出家游方访道
    labels:
      zh: 酝酿行脚
    start_date: 1089
    highlight_event_id: guji-慧洪-event-ordination
  - key: breakthrough
    name: 云庵言下得自在
    labels:
      zh: 突破悟入
    start_date: 1100
    highlight_event_id: guji-慧洪-event-yunan-enlightenment
  - key: climax
    name: 游戏翰墨名动丛林
    labels:
      zh: 高峰扬名
    start_date: 1105
    highlight_event_id: guji-慧洪-event-jingde-abiding
  decisions:
  - date: 1100
    title_zh: 师事云庵专心参究
    rationale: 慕云庵老人定乱两融之风，欲了生死大事，故久侍座下以求印可
  - date: 1105
    title_zh: 以翰墨记录尊宿遗训
    rationale: 恐林间胜谈散失无传，欲存丛林标表以补宗教，故随得随录不以古今为次
- id: guji-慧洪-endeavor-2
  title_zh: 住持景德与编集林间录
  summary_zh: 应显谟阁待制朱公之请住临川北景德禅寺，集十年所录成林间录上下帙并刊板流通
  phases:
  - key: brewing
    name: 应请住北景德寺
    labels:
      zh: 酝酿住持
    start_date: 1107
    highlight_event_id: guji-慧洪-event-jingde-abiding
  - key: breakthrough
    name: 本明析帙名林间录
    labels:
      zh: 突破成书
    start_date: 1107-11-01
    highlight_event_id: guji-慧洪-event-linjianlu
  - key: closure
    name: 刊板流通示寂建炎
    labels:
      zh: 收束流通
    start_date: 1128
    highlight_event_id: guji-慧洪-event-death
  decisions:
  - date: 1107
    title_zh: 赴朱公请住景德
    rationale: 为弘法化俗安众接机，故不辞劳应请而住临川
  - date: 1107-11-01
    title_zh: 命刊板以寿后世
    rationale: 借观者成市而传写失真，恐字画漫灭，故刻板流通并请谢逸作序
events:
- id: guji-慧洪-event-birth
  type: birth
  title_zh: 筠阳诞生
  date: 1071
  year_of: 1071
  place_zh: 筠州新吴
  description: 宋熙宁四年诞生于筠阳喻氏，幼颖悟，后出家名慧洪号觉范亦号寂音
- id: guji-慧洪-event-ordination
  type: career
  title_zh: 出家受具游方参学
  date: 1089
  year_of: 1089
  place_zh: 湘中云盖诸山
  description: 年十九出家受具，游方湘中，亲近云盖会禅师诸老，咨决三关语旨
- id: guji-慧洪-event-yunan-enlightenment
  type: career
  title_zh: 得自在三昧于云庵
  date: 1100
  year_of: 1100
  place_zh: 洞山云庵座下
  description: 服勤云庵老人，发明心地得游戏三昧，从此纵口谈禅信笔成文无适不真
- id: guji-慧洪-event-jingde-abiding
  type: career
  title_zh: 应请住临川景德寺
  date: 1107
  year_of: 1107
  place_zh: 临川北景德禅寺
  description: 赴显谟阁待制朱公之请，住临川北景德禅寺，学者追崇道显着矣
- id: guji-慧洪-event-linjianlu
  type: career
  title_zh: 林间录成书刊板
  date: 1107-11-01
  year_of: 1107
  place_zh: 临川北景德禅寺
  description: 十年所录三百余事经本明上人析为上下帙，名曰林间录，刻板流通，谢逸以大观元年十一月一日作序
- id: guji-慧洪-event-death
  type: death
  title_zh: 建炎二年示寂
  date: 1128
  year_of: 1128
  place_zh: 闽地
  description: 南宋建炎二年示寂，世寿五十八，一生着述甚富，石门文字禅风行丛林
