    rationale: 信经言能说此法为地神所护使所居安乐，锋镝方始，若不践行则为无益，故冒难劝和以证法力
- id: guji-摄摩腾-endeavor-2
  person_id: guji-摄摩腾
  title_zh: 应汉使西来开基雒邑
  summary: 汉明帝永平中夜梦金人飞空，遣蔡愔秦景往天竺寻访佛法，遇摩腾要还汉地，腾誓志弘通不惮疲苦，冒涉流沙至雒邑，得帝赏接，于城西门外立精舍，始开汉地沙门
  phases:
