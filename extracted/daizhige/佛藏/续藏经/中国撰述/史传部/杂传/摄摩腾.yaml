  - date: '0067'
    title_zh: 誓志弘通随使东行
    rationale: 以弘通为任，不惮疲苦流沙之险，欲使大法东被，故随汉使还雒
  - date: 0068
    title_zh: 居城西精舍安众传法
    rationale: 初至汉地，语言风土殊异，须依帝力立所安居，方能存僧形、传经教，开后学之源
