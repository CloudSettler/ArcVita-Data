endeavors:
- id: guji-行霆-endeavor-1
  title_zh: 重编诸天传笔削补正
  summary: 继鄣南草创，去繁补阙，补入经论天文，立常会与金光明两端，列十六天正次并赞
  phases:
  - key: brewing
    name: 镜庵雅会论天
    labels:
      zh: 绍兴论辩
    start_date: 1158
    highlight_event_id: guji-行霆-event-yahui
  - key: breakthrough
    name: 捡藏笔削旧传
    labels:
      zh: 辅阙去繁
    start_date: 1170
    highlight_event_id: guji-行霆-event-chongbian
  - key: climax
    name: 华严兰若成书
    labels:
      zh: 重编告成
    start_date: 1173-09-30
    highlight_event_id: guji-行霆-event-chongbian
  - key: closure
    name: 奉规序请刊行
    labels:
      zh: 流通博利
    start_date: 1173-12-01
    highlight_event_id: guji-行霆-event-kanxing
  decisions:
  - date: 1170
    title_zh: 去繁补阙不用己意
    rationale: 鄣南旧传多从己意而遗经论显文，故以经论质之以全始终
  - date: 1173-09-30
    title_zh: 立两端以息位次之诤
    rationale: 常会总相先梵释四王，金光明别席特设功德大辩于佛左右，两仪各安则自然无诤
- id: guji-行霆-endeavor-2
  title_zh: 出住宝阁弘护天台教观
  summary: 主乌戍塔院宝阁，与双槐莲社晦庵诸方以道义相忘，护持供天正仪与说听流通
  phases:
  - key: brewing
    name: 出住宝阁
    labels:
      zh: 住持弘法
    start_date: 1155
    highlight_event_id: guji-行霆-event-yahui
  - key: breakthrough
    name: 双槐莲社雅会
    labels:
      zh: 道义激扬
    start_date: 1158
    highlight_event_id: guji-行霆-event-yahui
  - key: climax
    name: 正供天排列之序
    labels:
      zh: 刊正护法
    start_date: 1173-09-30
    highlight_event_id: guji-行霆-event-chongbian
  - key: closure
    name: 空相来谒付刊
    labels:
      zh: 付嘱流通
    start_date: 1173-12-01
    highlight_event_id: guji-行霆-event-kanxing
  decisions:
  - date: 1158
    title_zh: 应考盘之嘱正天位
    rationale: 两刹供天排列失序，嘱令考经辩正使无谬误，故留意文稿辩证
  - date: 1173-12-01
    title_zh: 劝请刊行博利见闻
    rationale: 使今古凝滞泮然冰释，有补流通，不负昔会，故付奉规序而刊
events:
- id: guji-行霆-event-birth
  title_zh: 生于两浙
  date: 1120
  year_of: 1120
  location: 两浙乌戍
  description: 生年不详，约北宋末南宋初生， later为乌戍释子，习天台教观
- id: guji-行霆-event-yahui
  title_zh: 绍兴间镜庵雅会论天位
  date: 1158
  year_of: 1158
  location: 乌戍塔院镜庵
  description: 主宝阁时与具元考盘双槐莲社晦庵诸方以禅教诗文雅会，论供天排列失序，受嘱刊正
- id: guji-行霆-event-chongbian
  title_zh: 乾道癸巳重编诸天传成书
  date: 1173-09-30
  year_of: 1173
  location: 福田西华严兰若
  description: 捡大藏笔削鄣南旧传，去繁补阙，补入经论，立常会十六位正次及金光明别席，系赞以志，仲秋晦成书
- id: guji-行霆-event-kanxing
  title_zh: 奉规序刊行流布
  date: 1173-12-01
  year_of: 1173
  location: 乌戍镜庵
  description: 传天台教观奉规为之序，述草创于鄣南功成于镜庵，劝请刊行博利见闻，息总别位次之诤
- id: guji-行霆-event-death
  title_zh: 示寂
  date: 1190
  year_of: 1190
  location: 两浙
  description: 卒年不详，约绍熙年间示寂，重编诸天传通行续藏，梵释四王护法之迹赖以不谬
