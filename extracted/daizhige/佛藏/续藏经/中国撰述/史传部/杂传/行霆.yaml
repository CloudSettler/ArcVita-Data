  - 供天列位纷纭，当从旧俗还是据经论刊正
  - 常会总相次第与金光明别席特设，如何两全以息诤
  lesson: 据经论立两端，正尊卑昭穆，以天护助说听流通
  summary_first_person: 吾行霆，乌戍释子，出住宝阁，绍兴间与莲社诸贤论天位，感鄣南焕师刊正之志，捡大藏笔削重编诸天传，立常会别席两端以息诤，愿梵释四王呵护正法
