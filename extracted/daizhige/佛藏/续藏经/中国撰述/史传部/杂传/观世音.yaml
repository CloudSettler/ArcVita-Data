    death:
      date: '9999-12-31'
      precision: year
      is_circa: true
      raw: 未来众宝普集庄严土普光功德山王如来般涅盘时
  birth_date: -5000-01-01
  death_date: '9999-12-31'
  era: 过去无量劫至未来补处
  reign_ref: 删提岚善持劫
  archetype: 慈悲救度者
  dilemmas:
  - 如何以一身遍应九道苦恼而不舍本愿
  - 如何由自利耳根圆通转成利他普门示现
  lesson: 一心称名即得解脱，自利圆通与利他普门本同一体
  summary_first_person: 吾本观世间音声，从闻思修入三摩地，上合诸佛慈力，下合同体悲仰，愿众生受苦恐怖称我名者，即时观其音声皆得解脱
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E6%9D%82%E4%BC%A0/%E8%A7%82%E9%9F%B3%E6%85%88%E6%9E%97%E9%9B%86.html
endeavors:
- id: guji-观世音-endeavor-1
  title_zh: 悲华发愿授记成名
  summary: 于宝藏佛前以太子不眴身发大愿，观众生苦生大悲心，得名观世音，次补无量寿佛后成佛
  phases:
  - key: brewing
    name: 删提岚为太子奉事宝藏佛
    labels:
      zh: 出生奉佛
    start_date: -5000-01-01
    highlight_event_id: guji-观世音-event-birth
  - key: breakthrough
    name: 宝藏佛前发愿观苦救苦
    labels:
      zh: 发愿
    start_date: -4990-01-01
    highlight_event_id: guji-观世音-event-vow
  - key: climax
    name: 蒙授记得名观世音
    labels:
      zh: 授记
    start_date: -4890-01-01
    highlight_event_id: guji-观世音-event-named
  - key: closure
    name: 威德王世宝意童子再发菩提
    labels:
      zh: 重愿
    start_date: -4800-01-01
    highlight_event_id: guji-观世音-event-secondvow
  decisions:
  - date: -4990-01-01
    title_zh: 尽回向无上菩提愿观音声救苦
    rationale: 见天人三恶道众生受苦恐怖退失正法，故愿以天耳天眼闻见称名者悉免苦恼
  - date: -4800-01-01
    title_zh: 宝意童子不求声闻惟修无上菩提
    rationale: 见金光师子游戏佛土清净庄严，故誓取庄严世界广度众生万亿劫不退
- id: guji-观世音-endeavor-2
  title_zh: 耳根圆通普门救苦
  summary: 从观音如来闻思修入三摩地，得大悲咒千手千眼，证耳根圆通，起三十二应十四无畏普门示现
  phases:
  - key: brewing
    name: 供养观音如来从闻思修
    labels:
      zh: 修学
    start_date: -4700-01-01
    highlight_event_id: guji-观世音-event-practice
  - key: breakthrough
    name: 千光王所闻大悲咒超登八地
    labels:
      zh: 得咒
    start_date: -4600-01-01
    highlight_event_id: guji-观世音-event-dharani
  - key: climax
    name: 入流忘所证圆明获二殊胜
    labels:
      zh: 证悟
    start_date: -4500-01-01
    highlight_event_id: guji-观世音-event-enlighten
  - key: closure
    name: 普门示现救七难三毒满二求
    labels:
      zh: 利他
    start_date: -4400-01-01
    highlight_event_id: guji-观世音-event-pumen
  decisions:
  - date: -4600-01-01
    title_zh: 持大悲心咒为恶世众生作大利乐
    rationale: 蒙千光王静住如来摩顶付嘱，一闻此咒超登八地，故愿常诵持未曾废忘以安乐成熟众生
  - date: -4500-01-01
    title_zh: 反闻自性上合慈力下合同悲
    rationale: 动静闻觉空灭既寂，十方圆明现前，故以三十二应入国土，令众生获无畏解脱
events:
- id: guji-观世音-event-birth
  title_zh: 降生为无诤念王太子不眴
  date: -5000-01-01
  year_of: -5000
  place_zh: 删提岚世界
  description: 转轮圣王无诤念主四天下时，长子不眴与千子眷属供养宝藏如来从佛出家修道
- id: guji-观世音-event-vow
  title_zh: 悲华经前发大愿
  date: -4990-01-01
  year_of: -4990
  place_zh: 宝藏佛前
  description: 太子不眴白佛愿行菩萨道时众生受苦恐怖称我名字以天耳闻天眼见悉免苦恼，否则终不成正觉
- id: guji-观世音-event-named
  title_zh: 得授记字为观世音
  date: -4890-01-01
  year_of: -4890
  place_zh: 宝藏佛前
  description: 宝藏佛见其观天人三恶道生大悲心欲断众生苦令住安乐，授记为观世音，已令百千亿众生离苦
- id: guji-观世音-event-secondvow
  title_zh: 威德王世化为宝意童子初发心
  date: -4800-01-01
  year_of: -4800
  place_zh: 无量德聚安乐示现土
  description: 左右二莲花生二童子，宝意与宝上共诣金光师子游戏佛所发弘誓不求声闻惟修无上菩提广度众生
- id: guji-观世音-event-practice
  title_zh: 供养观音如来从闻思修
  date: -4700-01-01
  year_of: -4700
  place_zh: 观音如来法中
  description: 于观世音佛所发菩提心，佛教从闻思修入三摩地，初于闻中入流忘所为下手工夫
- id: guji-观世音-event-dharani
  title_zh: 得大悲咒具千手千眼
  date: -4600-01-01
  year_of: -4600
  place_zh: 千光王静住如来所
  description: 始住初地一闻广大圆满无碍大悲心陀罗尼超登八地，发愿利益安乐众生即时身具千手千眼十方震动
- id: guji-观世音-event-enlighten
  title_zh: 证耳根圆通获二殊胜
  date: -4500-01-01
  year_of: -4500
  place_zh: 楞严法会
  description: 闻所闻尽觉所觉空生灭既灭寂灭现前，超越世出世间十方圆明，上合诸佛慈力下合众生悲仰成三十二应
- id: guji-观世音-event-pumen
  title_zh: 普门示现救七难满二求
  date: -4400-01-01
  year_of: -4400
  place_zh: 娑婆世界
  description: 一心称名即脱火水罗刹刀杖枷锁怨贼七难，离淫嗔痴三毒，求男女得福慧端正，礼拜福不唐捐
- id: guji-观世音-event-death
  title_zh: 未来成普光功德山王佛后示现涅盘
  date: '9999-12-31'
  year_of: 9999
  place_zh: 众宝普集庄严土
  description: 阿弥陀佛般涅盘正法灭后过中夜于菩提树下成等正觉，国土胜金光佛土百千万亿倍，随寿命般涅盘
