- id: guji-释迦牟尼佛-endeavor-1
  title_zh: 逾城出家雪山证悟
  summary: 舍王位而出家，参访外道学定，雪山苦行六年，悟苦行非道，受乳糜修中道，菩提树下证无上觉。
  phases:
  - key: brewing
    name: 四门游观逾城出家
    labels:
      zh:
      - 出家萌志
    start_date: -534-02-08
    highlight_event_id: guji-释迦牟尼佛-event-renounce
  - key: breakthrough
    name: 参访诸师雪山苦行
    labels:
      zh:
      - 求道参学
    start_date: -533-03-01
    highlight_event_id: guji-释迦牟尼佛-event-austerity
  - key: climax
    name: 菩提树下夜睹明星
    labels:
      zh:
      - 证悟菩提
    start_date: -528-12-08
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  - key: closure
    name: 七七日受法乐观机
    labels:
      zh:
      - 安住观机
    start_date: -528-12-09
    highlight_event_id: guji-释迦牟尼佛-event-enlightenment
  decisions:
  - date: -534-02-08
    title_zh: 逾城出家
    rationale: 睹生老病死苦迫無常，知王位富貴難抵老死，唯出家求道可求解脫，故夜別親眷逾城而去。
  - date: -528-05-01
    title_zh: 舍苦行取中道
    rationale: 知苦行徒困身心如緊弦將斷，非解脫正因，故受牧女乳糜，發願菩提樹下不證不起名。
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 鹿野转轮传灯付嘱
  summary: 成道後觀機赴鹿野苑，度五比丘初轉法輪，住世四十九年說法教化，付無法之法於摩訶迦葉，拘尸那入滅。
  phases:
  - key: brewing
    name: 梵天勸請起座說法
    labels:
      zh:
      - 勸請說法
    start_date: -528-12-16
    highlight_event_id: guji-释迦牟尼佛-event-first-sermon
  - key: breakthrough
    name: 鹿野苑度五比丘
    labels:
      zh:
      - 初轉法輪
    start_date: -527-06-15
    highlight_event_id: guji-释迦牟尼佛-event-first-sermon
  - key: climax
    name: 住世四十九年化導
    labels:
      zh:
      - 廣度群品
    start_date: -527-07-01
    highlight_event_id: guji-释迦牟尼佛-event-first-sermon
  - key: closure
    name: 付法迦葉雙林入滅
    labels:
      zh:
      - 傳燈入滅
    start_date: -483-02-10
    highlight_event_id: guji-释迦牟尼佛-event-death
  decisions:
  - date: -527-06-15
    title_zh: 鹿野苑初轉法輪
    rationale: 觀五比丘機緣已熟，先度舊侶說四諦八正道，立僧團以住持正法，令心燈初燃。
  - date: -483-02-15
    title_zh: 拈花付法於迦葉
    rationale: 吾無法可說付無法之法，以正法眼藏涅槃妙心付摩訶迦葉，令佛祖心燈代代相續而入涅槃。
