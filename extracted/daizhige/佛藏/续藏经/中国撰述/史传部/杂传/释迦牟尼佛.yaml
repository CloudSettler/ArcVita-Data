  summary_first_person: 吾本迦毗罗卫太子悉达多，因睹生老病死而逾城出家，参访诸师苦行六年，舍苦行取中道，于菩提树下证悟，鹿野苑初转法轮，住世说法四十九年，以无法之法付嘱迦叶而入涅槃。
