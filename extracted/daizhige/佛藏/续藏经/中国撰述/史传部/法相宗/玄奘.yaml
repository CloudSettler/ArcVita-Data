      raw: 武德五年成都受具年二十一推算
    death:
      date: '0664-02-05'
      precision: day
      is_circa: false
      raw: 麟德元年二月五日
  birth_date: '0602'
  death_date: '0664-02-05'
  era: 唐
  reign_ref: 贞观
  archetype: 西行求法译经者
  dilemmas:
  - 高昌王挽留供养与誓往西方求法之间的去留之抉
  - 众师各擅宗途隐显有异与誓游西方质问所惑的求真之抉
  lesson: 为法忘躯，穷究异同，会宗归一，利乐群生
  summary_first_person: 吾本颍川陈氏，徙家缑氏，幼厌樊笼，遍谒贤哲而众说不一，遂誓游西方，历流沙葱岭，师事戒贤，会通瑜伽，立宗曲女城，庶以真经利后世
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E6%B3%95%E7%9B%B8%E5%AE%97/%E7%8E%84%E5%A5%98%E4%B8%89%E8%97%8F%E6%B3%95%E5%B8%88%E8%B5%84%E4%BC%A0%E4%B8%9B%E4%B9%A6.html
endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 西行求法
  summary: 遍谒贤哲疑碍未决，誓游西方取瑜伽等论以释众疑
  phases:
  - key: brewing
    name: 少年出家遍参
    labels:
      zh: 东都受学入蜀受具
    start_date: '0613'
    highlight_event_id: guji-玄奘-event-shouju
  - key: breakthrough
    name: 偷渡玉门穿越流沙
    labels:
      zh: 孤游西行历险
    start_date: 0629
    highlight_event_id: guji-玄奘-event-xixing
  - key: climax
    name: 高昌结义西域历国
    labels:
      zh: 蒙迎递送至迦湿弥罗
    start_date: '0630'
    highlight_event_id: guji-玄奘-event-gaochang
  - key: closure
    name: 抵达印度巡礼圣迹
    labels:
      zh: 菩提树那烂陀安止
    start_date: '0631'
    highlight_event_id: guji-玄奘-event-nalanda
  decisions:
  - date: '0622'
    title_zh: 泛舟三峡入京访道
    rationale: 益部经论研综已穷，为询殊旨不顾兄留，结商泛舟东下荆州北游
  - date: 0629
    title_zh: 表请不许仍孤游西行
    rationale: 各擅宗途莫知适从，效法显智严继踵求法，宁向西死不东归生
  - date: '0630'
    title_zh: 高昌绝食坚持西去
    rationale: 王欲留住不听西去，以不食四日感动王母，结为兄弟许递送西行
- id: guji-玄奘-endeavor-2
  title_zh: 会宗弘法
  summary: 师事戒贤究瑜伽唯识，造论破邪曲女城显宗
  phases:
  - key: brewing
    name: 那烂陀从戒贤受学
    labels:
      zh: 听瑜伽三遍穷决疑
    start_date: '0631'
    highlight_event_id: guji-玄奘-event-nalanda
  - key: breakthrough
    name: 巡礼问友祈愿观音
    labels:
      zh: 孤山祈三愿皆应
    start_date: '0636'
    highlight_event_id: guji-玄奘-event-qiyuan
  - key: climax
    name: 造论破恶见伏外道
    labels:
      zh: 会宗制恶见二论
    start_date: 0638
    highlight_event_id: guji-玄奘-event-zaolun
  - key: closure
    name: 曲女城大会显大乘
    labels:
      zh: 十八日无人敢问
    start_date: '0640'
    highlight_event_id: guji-玄奘-event-quvcheng
  decisions:
  - date: '0631'
    title_zh: 依止正法藏专学瑜伽
    rationale: 昔梦曼殊授记相待，亲承戒贤付授，为流通少阙经论五年不舍昼夜
  - date: 0638
    title_zh: 造会宗制恶见二论
    rationale: 小乘立中百破瑜伽，南印造破大乘论，为通圣人作论不违，会宗破邪以显正
  - date: '0640'
    title_zh: 曲女城升座标宗
    rationale: 戒日王命集五印度沙门外道，悬论十八日征击，以显大乘改邪从正
events:
- id: guji-玄奘-event-birth
  title_zh: 诞生缑氏陈家
  date: '0602'
  year_of: 602
  place_zh: 河南缑氏
  description: 俗姓陈，汉大丘长仲弓之后，本居颍川徙河南，第四子，幼标温嶷聪敏绝异
- id: guji-玄奘-event-shouju
  title_zh: 成都受具学律
  date: '0622'
  year_of: 622
  place_zh: 成都空慧寺
  description: 年二十一武德五年受具，坐夏学律五篇七聚一遍斯得，听摄论毗昙究诵诸部
- id: guji-玄奘-event-xixing
  title_zh: 贞观三年首途西行
  date: 0629
  year_of: 629
  place_zh: 长安至玉门关
  description: 年二十九夜梦莲花生苏迷卢，偷渡五烽，失水卧沙念观音，蒙凉风野马泉得济达伊吾
- id: guji-玄奘-event-gaochang
  title_zh: 高昌结义递送西域
  date: '0630'
  year_of: 630
  place_zh: 高昌叶护衙所
  description: 王母结母子王结兄弟，讲仁王度沙弥，修书附绢送至突厥叶护，历葱岭铁门至迦湿弥罗
- id: guji-玄奘-event-nalanda
  title_zh: 那烂陀师事戒贤
  date: '0631'
  year_of: 631
  place_zh: 摩揭陀那烂陀寺
  description: 四十德迎入幼日王院，参年百六十正法藏，听瑜伽三遍显扬因明等，五年不舍昼夜
- id: guji-玄奘-event-qiyuan
  title_zh: 孤山观音前祈三愿
  date: '0636'
  year_of: 636
  place_zh: 伴烂拏钵伐多孤山
  description: 散花缦祈平安还国生睹史多及有佛性，三愿花住尊手挂臂贯顶皆得如言
- id: guji-玄奘-event-zaolun
  title_zh: 造会宗制恶见论
  date: 0638
  year_of: 638
  place_zh: 那烂陀杖林山
  description: 就胜军学唯识庄严，造会宗三千颂制恶见千六百颂，伏顺世外道，戒贤称善流行
- id: guji-玄奘-event-quvcheng
  title_zh: 曲女城大会折服五印
  date: '0640'
  year_of: 640
  place_zh: 中印度曲女城
  description: 戒日王集数千沙门外道，请升座标论十八日无人敢问，号大乘天解脱天，施金银上氎
- id: guji-玄奘-event-death
  title_zh: 示寂长安
  date: '0664-02-05'
  year_of: 664
  place_zh: 长安
  description: 负经还国译传既毕，麟德元年二月五日示寂，垂义后裔标准当今
