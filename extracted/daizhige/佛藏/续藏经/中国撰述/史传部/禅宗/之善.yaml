    labels:
      zh:
      - 弘化四方
    start_date: '1205'
    highlight_event_id: guji-之善-event-huiyin
  - key: climax
    name: 晚居灵隐
    labels:
      zh:
      - 名刹守静
    start_date: '1225'
    highlight_event_id: guji-之善-event-lingyin
  - key: closure
    name: 坚辞天童示寂
    labels:
      zh:
      - 功成身退
    start_date: '1235-09-28'
    highlight_event_id: guji-之善-event-death
  decisions:
  - date: '1198'
    title_zh: 分座能仁继而出世
    rationale: 学者既众因缘已熟，当分座领众以利群机
  - date: '1225'
    title_zh: 领灵隐而掩户无迎
    rationale: 灵隐密迩行阙轮蹄凑集，唯守静默寒温以全道风
  - date: '1232'
    title_zh: 辞天童虚席之请
    rationale: 年踰耄矣不堪夜行，知止不赴以保晚节
events:
- id: guji-之善-event-birth
  date: '1152'
  year_of: 1152
  title_zh: 生于吴兴刘氏
  description: 先居彭城高曾及父皆登膴仕，生于纨绮中资性高洁
  place_zh: 吴兴
- id: guji-之善-event-ordination
  date: '1165'
  year_of: 1165
  title_zh: 十三辞家受业齐政院
  description: 于德清齐政院祝发，经论一见辄了大意
  place_zh: 德清齐政院
- id: guji-之善-event-yinguang
  date: '1180'
  year_of: 1180
  title_zh: 参佛照光以风幡话契旨蒙印可
  description: 往鄮山参礼佛照光，风幡话下契旨，得偈通一线起吾宗
  place_zh: 鄮山
- id: guji-之善-event-miaofeng
  date: '1185'
  year_of: 1185
  title_zh: 卓锡妙高峰面壁十年号妙峰
  description: 游衡湘还入匡庐，卓锡妙高峰下面壁十年，学者尊为妙峰禅师
  place_zh: 庐山妙高峰
- id: guji-之善-event-nengren
  date: '1198'
  year_of: 1198
  title_zh: 分座雁山能仁
  description: 分座于雁山能仁，开始领众说法
  place_zh: 雁山能仁
- id: guji-之善-event-huiyin
  date: '1205'
  year_of: 1205
  title_zh: 出世慧因历迁诸刹
  description: 出世慧因，迁洪福万年瑞岩万寿华藏，退居皋亭刘寺十余年
  place_zh: 慧因
- id: guji-之善-event-lingyin
  date: '1225'
  year_of: 1225
  title_zh: 晚居灵隐掩户善诱
  description: 晚居灵隐密迩行阙而掩户无迎，公卿至唯寒温接之，平生善诱未尝厉声色
  place_zh: 杭州灵隐
- id: guji-之善-event-death
  date: '1235-09-28'
  year_of: 1235
  title_zh: 示寂于灵隐
  description: 澡身趺坐书偈来去一如清风万里而逝，寿八十四腊七十一，火浴舍利无数瘗西冈
  place_zh: 杭州灵隐
