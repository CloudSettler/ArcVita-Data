    highlight_event_id: guji-之善-event-ordination
  - key: breakthrough
    name: 鄮山印可
    labels:
      zh:
      - 参悟印可
    start_date: '1180'
    highlight_event_id: guji-之善-event-yinguang
  - key: climax
    name: 妙峰面壁
    labels:
      zh:
      - 隐修涵养
    start_date: '1185'
    highlight_event_id: guji-之善-event-miaofeng
  - key: closure
    name: 学者归宗
    labels:
      zh:
      - 声名渐著
    start_date: '1195'
    highlight_event_id: guji-之善-event-miaofeng
  decisions:
  - date: '1165'
    title_zh: 辞家受业齐政院
    rationale: 资性高洁不恋纨绮，十三即就学经论以求出世
  - date: '1180'
    title_zh: 往参佛照光不守一师
    rationale: 经论一见了意，须遍谒大老以求心印，故赴鄮山
  - date: '1185'
    title_zh: 卓锡妙高峰面壁十年
    rationale: 得印可后不急出世，须涵养深固以待机缘
- id: guji-之善-endeavor-2
  title_zh: 分座出世历住至灵隐
  summary_zh: 分座雁山能仁，出世慧因，历迁洪福万年瑞岩万寿华藏，退居皋亭十余年，晚居灵隐掩户绝俗善诱门人
  phases:
  - key: brewing
    name: 分座能仁
    labels:
