endeavors:
- id: guji-之善-endeavor-1
  title_zh: 遍参契悟与妙峰面壁
  summary_zh: 十三出家后遍谒大老，参佛照光以风幡话契旨，游衡湘庐山卓锡妙高峰面壁十年，为学者所宗
  phases:
