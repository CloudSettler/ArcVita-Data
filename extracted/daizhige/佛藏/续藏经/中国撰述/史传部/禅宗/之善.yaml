  death_date: '1235-09-28'
  era: 南宋
  reign_ref: 宋理宗端平
  archetype: 清隐弘化型禅师
  dilemmas:
  - 出身纨绮而志在出尘，家族荣仕与修道之抉择
  - 居近阙名刹而掩户绝迎，清修与酬应之两难
  - 晚年天童虚席力请而坚辞不赴，去留进退之考量
  lesson: 守高洁而善诱，处闹市而独静，以柔化刚方能久远
  summary_first_person: 吾本吴兴刘氏子，十三辞家受业，遍谒大老，于鄮山得佛照印可，面壁妙高十年，后历住诸刹，晚居灵隐掩户无迎，唯以善诱接人，来去一如而已
  source_urls:
