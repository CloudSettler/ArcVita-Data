    labels:
      zh: 和诤弘法
    start_date: '0670'
    highlight_event_id: guji-元晓-event-teach
  - key: closure
    name: 普化念佛
    labels:
      zh: 念佛西归
    start_date: 0680
    highlight_event_id: guji-元晓-event-death
  decisions:
  - date: '0665'
    title_zh: 反本还俗号小性居士
    rationale: 欲近闾巷屠沽之辈非通俗之形难以摄化故舍僧服而游戏人间
  - date: '0670'
    title_zh: 广著疏论会通华严净土
    rationale: 新罗宗派竞立诤论纷然宜以一心和会空有并弘念佛以收机钝
events:
- id: guji-元晓-event-birth
  title_zh: 新罗押梁郡出生
  date: '0617'
  year_of: 617
  place_zh: 新罗押梁郡
  description_zh: 生于新罗押梁郡，俗姓薛，幼聪慧，志慕佛法。
- id: guji-元晓-event-seek
  title_zh: 与义湘偕行入唐求法遇障
  date: '0661'
  year_of: 661
  place_zh: 唐境边地
  description_zh: 与义湘法师结伴入唐求法，途中屡遭艰阻，未得达于中土。
- id: guji-元晓-event-awaken
  title_zh: 夜宿古冢悟一心之旨
  date: '0661'
  year_of: 661
  place_zh: 古冢途中
  description_zh: 夜宿古冢，一宿而悟心生则种种法生，心灭则冢墓不异，遂明一心不二。
- id: guji-元晓-event-teach
  title_zh: 还俗弘化著述念佛并行
  date: '0670'
  year_of: 670
  place_zh: 新罗庆州一带
  description_zh: 自号小性居士，持瓢唱念，广著华严起信等疏，弘一心念佛，子薛聪传其家学。
- id: guji-元晓-event-death
  title_zh: 新罗神文王朝示寂
  date: 0686
  year_of: 686
  place_zh: 新罗
  description_zh: 示寂于新罗，世寿七十，其化遍于朝野，华严净土之风遂大行。
