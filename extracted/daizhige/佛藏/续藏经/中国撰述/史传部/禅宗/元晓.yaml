endeavors:
- id: guji-元晓-endeavor-1
  title_zh: 入唐求法未果古冢悟一心
  summary_zh: 两度发心入唐求法，中途遇障折返，于古冢一宿悟心外无法，遂止入唐之念，回国弘化。
  phases:
  - key: brewing
