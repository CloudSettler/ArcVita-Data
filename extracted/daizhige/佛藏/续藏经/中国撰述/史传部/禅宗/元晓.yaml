    start_date: '0661'
    highlight_event_id: guji-元晓-event-awaken
  - key: closure
    name: 折返本国
    labels:
      zh: 还国弘化
    start_date: '0662'
    highlight_event_id: guji-元晓-event-awaken
  decisions:
  - date: '0661'
    title_zh: 夜宿古冢悟心外无法
    rationale: 连日涉险心生怖畏与安然之别全由心现故知求法不在远方而在一心
  - date: '0662'
    title_zh: 罢入唐之行还俗利生
    rationale: 既悟一心则不必远求唐土宜留新罗以通俗之行普化士庶
- id: guji-元晓-endeavor-2
  title_zh: 著述和诤弘通华严净土
  summary_zh: 留住新罗广淹佛书，著华严金刚起信等疏，提倡一心和诤与念佛往生，上交王臣下化闾巷。
  phases:
  - key: brewing
    name: 淹贯经论
    labels:
      zh: 博览群经
    start_date: '0662'
    highlight_event_id: guji-元晓-event-teach
  - key: breakthrough
    name: 还俗弘化
    labels:
