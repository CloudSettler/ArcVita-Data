  date: 1470
  year_of: 1470
  place_zh: 嘉禾
  description_zh: 年四十六病革再苏自惟失怙专心净土以米一粒一声积二百斛供众三年印图数万
  significance_zh: 由禅转兼净土劝人念佛广结缘
