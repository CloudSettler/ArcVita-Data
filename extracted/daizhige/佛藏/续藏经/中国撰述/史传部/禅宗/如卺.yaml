  lesson: 病革不废流通惧繁弗览则大法湮微去繁就简方能广接中下
  summary_first_person: 我嘉禾如卺蚤参空谷于虎林得旨病后再苏专心净土因悯中下畏五灯浩繁昼抄夜阅简集成编名禅宗正脉以便观览证悟
