  decisions:
  - date: '1117'
    title_zh: 封衾立誓不悟不展
    rationale: 佛鉴孤硬难入唯以死功夫断疑故封衾七七昼坐宵立以明大事
  - date: '1119'
    title_zh: 受佛果推堕潭仍对答无滞
    rationale: 以潭深鱼聚树高招风伸脚在缩脚里显见与未见一如故得圆悟称稳实
- id: guji-守珣-endeavor-2
  person_qid: guji-守珣
  title_zh: 历住天圣何山天宁弘化接众
  summary: 建炎住天圣以西湖诗喻对内翰开堂迁何山晚居天宁如瓶泻秋河援引钝根举婆子烧庵野火话及宾主四句接化学人
