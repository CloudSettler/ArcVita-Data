  summary: 初参不契遂投太平佛鉴封衾立誓昼坐宵立七七日闻森罗万象一法所印而踊跃出堂以桃花颂得印可复受圆悟勘验而名振湖海
  phases:
  - key: brewing
    name: 弃家行脚初参不契
