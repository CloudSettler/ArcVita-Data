      precision: year
      is_circa: true
      raw: 不知何许人氏族名字，自云姓李二月八日生，戏言不足据，见于后梁时，约系梁前数十年生
    death:
      date: '0917-03-03'
      precision: day
      is_circa: false
      raw: 贞明三年三月三日示寂于岳林寺庑下盘石上
  birth_date: 0880
  death_date: '0917-03-03'
  era: 五代后梁
  reign_ref: 后梁贞明三年
  archetype: 隐圣游戏弘法僧
  dilemmas:
  - 以胖腹蹙頞鄙相示人致轻慢与内具弥勒慈氏本迹难显
  - 恣饮啖酒庐屠肆随俗亲众与清净持戒形象相违
  - 放下布袋叉手荷行顿超言语与学人执着问答求解相碍
  lesson: 包纳乾坤放下即是，直指心心是佛，不滞形相，不堕是非，忍辱和合同登龙华
  summary_first_person: 吾契此，布袋自随，游化四明，放下便立，荷去便行，撒袋拈示，皆是佛事，世人不识弥勒，唯指即个心心是佛，放开泆日，宽却肚皮，自然证得六波罗
