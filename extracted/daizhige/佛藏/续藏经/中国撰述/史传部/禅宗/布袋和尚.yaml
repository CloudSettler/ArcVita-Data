    name: 撒袋拈示直指心佛
    labels:
      zh: 撒袋示法
    start_date: '0910-01-01'
    highlight_event_id: guji-布袋和尚-event-preaching
  - key: climax
    name: 机锋接引白鹿保福
    labels:
      zh: 机锋接引
    start_date: '0914-01-01'
    highlight_event_id: guji-布袋和尚-event-dialogue
  - key: closure
    name: 付嘱摩诃授袋言别
    labels:
      zh: 付嘱言别
    start_date: '0916-01-01'
    highlight_event_id: guji-布袋和尚-event-entrust
  decisions:
  - date: '0910-01-01'
    title_zh: 以布袋为佛事撒袋拈问
    rationale: 欲翻转众生无始业识，就事明理，纳诸佛法于袋中，开袋撒下复拈起问是甚么，令人绝解偷心
  - date: '0912-01-01'
    title_zh: 纵饮啖酒庐屠肆不避嫌疑
    rationale: 为亲近市井令所货倍售获利，以和言巽语解贪争，教念摩诃般若波罗蜜多为日课
  - date: '0916-01-01'
    title_zh: 示背四目授袋箱绳与蒋宗霸
    rationale: 与摩诃相聚三四载有大因缘，欲令其子孙如所遗小袋无数绵远，嘱加保爱以待相见
- id: guji-布袋和尚-endeavor-2
  title_zh: 示寂显圣证弥勒本迹
  summary_zh: 示寂岳林轻举入塔，栈道再见寄声，天兴官舍寄偈道破弥勒千百亿化身
  phases:
  - key: brewing
    name: 亭长夺袋三焚三复
    labels:
      zh: 忍辱异迹
    start_date: '0916-06-01'
    highlight_event_id: guji-布袋和尚-event-entrust
  - key: breakthrough
    name: 示寂盘石童棺轻举建塔
    labels:
      zh: 示寂建塔
    start_date: '0917-03-03'
    highlight_event_id: guji-布袋和尚-event-death
  - key: climax
    name: 栈道再见寄声摩诃趺坐而逝
    labels:
      zh: 寄声坐逝
    start_date: '0927-01-01'
    highlight_event_id: guji-布袋和尚-event-apparition
  - key: closure
    name: 寄圆封偈道破弥勒真身
    labels:
      zh: 显圣证真
    start_date: '0936-01-01'
    highlight_event_id: guji-布袋和尚-event-gatha
  decisions:
  - date: '0917-03-03'
    title_zh: 端然示寂于岳林盘石留全身建塔
    rationale: 缘尽当去，以全身舍利安封山之原，遗卓锡置钵水常盈等迹，令邦人起信设会
  - date: '0936-01-01'
    title_zh: 留圆封偈戒不得状吾相
    rationale: 恐人执幻相，七日后开封方知弥勒真弥勒化身千百亿，时时示世人世人不识
events:
- id: guji-布袋和尚-event-birth
  title_zh: 出生不详自称契此
  date: 0880
  year_of: 880
  place_zh: 不知何许人
  description_zh: 世莫知族氏名字，常自称契此，人以长汀子布袋和尚称之，自云姓李二月八日生，布袋与虚空齐年，戏言也
- id: guji-布袋和尚-event-wandering
  title_zh: 见于明州奉化栖止岳林
  date: '0909-01-01'
  year_of: 909
  place_zh: 明州奉化岳林寺
  description_zh: 五季梁时见于奉化，蹙頞皤腹，日夕寝食无常处，以岳林为归宿，锡杖布袋自随，有十八小儿谨逐之
- id: guji-布袋和尚-event-preaching
  title_zh: 阛阓撒袋纸包示内院
  date: '0911-01-01'
  year_of: 911
  place_zh: 聚落田野阛阓街市
  description_zh: 乞酰醢鱼菹投袋中，至阛阓撒下谓众看看，复拈起问是甚么，常以纸包屎物示云这是弥勒内院兜率陀天的，分卫所至遮挽不得去
- id: guji-布袋和尚-event-dialogue
  title_zh: 放下布袋叉手荷行答僧
  date: '0914-01-01'
  year_of: 914
  place_zh: 四明街市禅窟
  description_zh: 白鹿问如何是布袋便放下叉手立，问布袋下事便荷行，保福问西来意亦如是，十字街头正好化缘，橘子验不是这个人
- id: guji-布袋和尚-event-entrust
  title_zh: 长汀浴背显目授袋与摩诃
  date: '0916-01-01'
  year_of: 916
  place_zh: 四明长汀溪摩诃家
  description_zh: 与蒋宗霸游，教念摩诃般若波罗蜜多，浴中使揩背现四目光粲，嘱勿说，以布袋内无数小者并箱绳授之，令子孙如是，作布袋三宝堂等偈而别
- id: guji-布袋和尚-event-death
  title_zh: 示寂岳林盘石建塔封山
  date: '0917-03-03'
  year_of: 917
  place_zh: 岳林寺庑下盘石封山之原
  description_zh: 贞明三年三月三日示寂，亭长买棺赎过舁不能举，易童氏棺轻举若羽，建塔封山，有卓锡置钵水常盈不涸等迹
- id: guji-布袋和尚-event-apparition
  title_zh: 灭后十年栈道寄声摩诃坐逝
  date: '0927-01-01'
  year_of: 927
  place_zh: 蜀栈道跘跨山十二盘庵
  description_zh: 既灭十年会越师使蜀回栈道见师，寄声四明蒋摩诃加保爱以待相见，摩诃筑庵跘跨山，闻命设斋沐浴趺坐而逝
- id: guji-布袋和尚-event-gatha
  title_zh: 江南天兴寄圆封偈显弥勒
  date: '0936-01-01'
  year_of: 936
  place_zh: 江南天兴寺福州官舍
  description_zh: 晋天福初莆田令王仁煦遇师于天兴寺复遇于福州，怀中圆封戒七日不来开看，止一偈弥勒真弥勒化身千百亿时时示世人世人俱不识，后书不得状吾相此即是真，乃知是弥勒佛
