endeavors:
- id: guji-布袋和尚-endeavor-1
  title_zh: 布袋游化四明随缘化导
  summary_zh: 栖止岳林，布袋锡杖自随，阛阓撒袋拈示，机锋接引僧俗，付嘱摩诃居士
  phases:
