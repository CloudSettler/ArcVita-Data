    name: 选定自应庵至茆溪一线
    labels:
      zh: 虎邱龙池万派归墟
    start_date: 1794-01-01
    highlight_event_id: guji-平圣台-event-kezhi
  - key: closure
    name: 甲寅夏作序付梓
    labels:
