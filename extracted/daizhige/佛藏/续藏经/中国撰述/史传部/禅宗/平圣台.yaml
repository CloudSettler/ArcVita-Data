  - date: 1793
    title_zh: 取指月录及灯史逐则拈提
    rationale: 正法眼藏指月无继选残编消亡后学无由考证须决择以绍隆祖位
  - date: 1794-06-01
    title_zh: 以火莲居士名作序刻揞黑豆集
    rationale: 怜同道沈淹齑瓮踯躅歧途如昔荡子故贶以此编为学佛津梁
