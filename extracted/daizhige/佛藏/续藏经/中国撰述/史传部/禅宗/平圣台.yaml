  summary_first_person: 我家本儒林幼沾坟籍释褐后奔走风尘无裨身世闻经有会妄缘解路而困名利晚年流浪天涯发白齿落方知生死事大遂息影余庵闭关参穷因元沙语摸得娘生鼻孔又与心圆结夏拈提指月而涣然冰释幸识还乡之路故刻此黑豆集以接同道
