  date: 1755
  year_of: 1755
  title_zh: 释褐奔走风尘闻经有会
  description_zh: 释褐后奔走风尘无裨身世每闻修多罗一言半偈辄有会于心妄缘解路以求其合而为名利钩锁所系
- id: guji-平圣台-event-biguan
  date: 1788
  year_of: 1788
  title_zh: 息影余庵闭关谢客参穷
  description_zh: 流浪天涯发白齿落回思生死事大遂息影余庵闭关谢客锐志参穷
- id: guji-平圣台-event-wudao
  date: 1792
  year_of: 1792
  title_zh: 经行触发元沙语悟本地风光
  description_zh: 信步经行次触发元沙立地构取语瞥然摸得娘生鼻孔踏着本地风光欢喜踊跃信此道本来成现
