  decisions:
  - date: 1788
    title_zh: 息影余庵闭关谢客
    rationale: 生死事大迫不容缓名利钩锁须自脱故谋活计锐志参穷
  - date: 1792
    title_zh: 信本地风光不疑更阅古德机用
    rationale: 虽摸得鼻孔然差别机用末后牢关仍多疑义须决择杀活机权
