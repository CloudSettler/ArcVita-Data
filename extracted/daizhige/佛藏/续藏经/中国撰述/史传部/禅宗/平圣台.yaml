  title_zh: 结夏拈提编刻黑豆集接引后学
  summary_zh: 与心圆住庵结夏取指月录及灯史应庵以下机缘一一拈提决择遂选刻付梓为中流一壶
  phases:
  - key: brewing
    name: 与心圆住庵结夏
