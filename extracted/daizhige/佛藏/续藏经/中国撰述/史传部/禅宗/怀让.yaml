  year_of: 720
  place_zh: 衡岳庵前
  description_zh: 道一常习坐禅图作佛取砖於庵前石上磨喻磨砖不成镜坐禅岂得作佛示牛驾车及无住法道一如饮醍醐侍奉十秋
