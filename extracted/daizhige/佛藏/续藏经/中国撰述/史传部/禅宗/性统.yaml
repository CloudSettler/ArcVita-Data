person:
  qid: guji-性统
  name_zh: 性统
  names:
    zh: 性统
    en: Xing Tong
  lifespan:
    birth:
      date: 1635
      precision: year
      is_circa: true
      raw: 西蜀人，生年未详
    death:
      date: 1700
      precision: year
      is_circa: true
      raw: 卒年未详
  birth_date: 1635
  death_date: 1700
  era: 清
  reign_ref: 康熙
  archetype: 编纂弘法高僧
  dilemmas:
  - 法运中衰语多遗失，诸方各阐己宗，或拣收失刻，或博采流滥
  - 盛极则市源流卖虚声，衰极复振又惧履霜，编述去取难得其公
  lesson: 藉法以显人，因人以传法，丝系九鼎，任荷千钧
  summary_first_person: 余西蜀高梁嗣祖沙门，嗣法高峰，丙寅自蜀来浙，扫塔径山，寄锡天童，忝住普陀镇海，会辑续灯正统四十二卷，以补五灯未备，以昭济洞正统
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E7%A6%85%E5%AE%97/%E7%BB%AD%E7%81%AF%E6%AD%A3%E7%BB%9F%E7%9B%AE%E5%BD%95.md
endeavors:
- id: guji-性统-endeavor-1
  title_zh: 自蜀入浙住持普陀振兴宗风
  summary: 嗣高峰法，自西蜀礼径山访天童，主持普陀镇海禅寺，宗风丕振
  phases:
  - key: brewing
    name: 蜀中嗣法
    labels:
      zh: 高峰法嗣
    start_date: 1680
    highlight_event_id: guji-性统-event-birth
  - key: breakthrough
    name: 丙寅入浙扫塔
    labels:
      zh: 扫祖塔於径山
    start_date: 1686
    highlight_event_id: guji-性统-event-ruzhe
  - key: climax
    name: 住锡普陀
    labels:
      zh: 主持镇海禅寺
    start_date: 1688
    highlight_event_id: guji-性统-event-putuo
  - key: closure
    name: 名山宗誉遍闻
    labels:
      zh: 道誉遍闻
    start_date: 1692
    highlight_event_id: guji-性统-event-putuo
  decisions:
  - date: 1686
    title_zh: 自西蜀东来江浙礼祖
    rationale: 扫祖塔於径山，寄杖锡於天童，寻访临济正脉以续慧命
  - date: 1688
    title_zh: 应请主持普陀镇海禅寺
    rationale: 藉名山梵宇弘单传之道，开凿人天，提持后学
- id: guji-性统-endeavor-2
  title_zh: 会辑续灯正统四十二卷表彰世系
  summary: 搜群集补五灯未备，分列济洞两宗，自大鉴十六世编起，共四十二卷
  phases:
  - key: brewing
    name: 搜罗群集
    labels:
      zh: 搜补灯续略诸集
    start_date: 1688
    highlight_event_id: guji-性统-event-putuo
  - key: breakthrough
    name: 分宗列派定例
    labels:
      zh: 济洞分列昭法系
    start_date: 1690
    highlight_event_id: guji-性统-event-bianji
  - key: climax
    name: 编成四十二卷
    labels:
      zh: 续灯仍旧名正统昭法系
    start_date: 1691
    highlight_event_id: guji-性统-event-bianji
  - key: closure
    name: 征序流通
    labels:
      zh: 正续堂题序刊行
    start_date: 1692
    highlight_event_id: guji-性统-event-bianji
  decisions:
  - date: 1690
    title_zh: 定自大鉴十六世起编以补会元未备
    rationale: 济下儿孙俱出大慧虎丘，表其所自，永杜千百世分门之渐
  - date: 1691
    title_zh: 述而不作兼载未得语句者之名
    rationale: 宗师语句法眼所存，存人为最，俟后有志搜罗者因名增补
events:
- id: guji-性统-event-birth
  type: birth
  title_zh: 生於西蜀
  date: 1635
  year_of: 1635
  description: 西蜀人，蜀中嗣高峰老人法，为大慧十七世孙，别号别庵
- id: guji-性统-event-ruzhe
  type: journey
  title_zh: 丙寅自蜀来浙扫径山祖塔
  date: 1686
  year_of: 1686
  description: 自西蜀来江浙，礼径山，访天童，扫祖塔，寄杖锡
- id: guji-性统-event-putuo
  type: abbot
  title_zh: 主持普陀镇海禅寺
  date: 1688
  year_of: 1688
  description: 与提台陈公暨合郡诸先生同请主持普陀镇海禅寺，宗风丕振，道誉遍闻
- id: guji-性统-event-bianji
  type: compilation
  title_zh: 编成续灯正统自序於正续堂
  date: 1691-06-15
  year_of: 1691
  description: 康熙辛未夏五月下浣题自序於普陀之正续堂，济宗自大慧虎丘起，洞宗自雪窦起，共四十二卷
- id: guji-性统-event-death
  type: death
  title_zh: 示寂
  date: 1700
  year_of: 1700
  description: 弘法著述之后示寂，卒年未详，法系由续灯正统所载门人延续
