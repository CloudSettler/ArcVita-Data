    highlight_event_id: guji-惟照-event-ordination
  - key: climax
    name: 杖下大悟
    labels:
      zh: -彻悟印可
    start_date: '1110'
    highlight_event_id: guji-惟照-event-enlightenment
  - key: closure
    name: 湖上服役尽得其道
    labels:
      zh:
      - 嗣法芙蓉
    start_date: '1111'
    highlight_event_id: guji-惟照-event-enlightenment
  decisions:
  - date: '1102'
    title_zh: 弃讲席而游方
    rationale: 既称正信大乘岂言说所能了故虚心遍参不滞文字
  - date: '1110'
    title_zh: 再往唁芙蓉于沂水
    rationale: 闻楷遭罪居芙蓉庵趋往唁之道中奋击而悟遂留佐耕尽得其旨
- id: guji-惟照-endeavor-2
  title_zh: 五迁巨剎以死心化众
  summary_zh: 出世洛阳招提历甘露三祖圆通泐潭日供千钵超然法乐专提如大死人四字
  phases:
  - key: brewing
    name: 初住招提
    labels:
      zh:
      - 出世弘法
    start_date: '1115'
    highlight_event_id: guji-惟照-event-first-abbot
  - key: breakthrough
    name: 迁甘露三祖
    labels:
      zh:
      - 道价日隆
    start_date: '1118'
    highlight_event_id: guji-惟照-event-first-abbot
  - key: climax
    name: 补处圆通泐潭
    labels:
      zh:
      - 五处住院
    start_date: '1122'
    highlight_event_id: guji-惟照-event-letan
  - key: closure
    name: 建炎拈香示寂
    labels:
      zh:
      - 嘱后事而逝
    start_date: 1128-01
    highlight_event_id: guji-惟照-event-death
  decisions:
  - date: '1122'
    title_zh: 怡然让圆通还旧住
    rationale: 守惠诉于有司得旨还旧不争住位拽杖徜徉山谷间
  - date: '1127'
    title_zh: 建炎南渡坚持开堂施众
    rationale: 日不下千钵坐食檀施四来略不介意唯提如大死人以救学禅记忆之弊
events:
- id: guji-惟照-event-birth
  title_zh: 生于简州阳安
  date: '1084'
  year_of: 1084
  place_zh: 简州阳安李氏
  description_zh: 母方孕梦异僧持应器踵门一夕有光发其室卢而生儿时趣尚超卓
- id: guji-惟照-event-ordination
  title_zh: 成都得度弃讲游方
  date: '1102'
  year_of: 1102
  place_zh: 成都鹿苑寺大慈寺
  description_zh: 十九得度具戒受起信论辄归卧谓既称正信岂言说所了尽弃所闻而游方参大洪山楷禅师
- id: guji-惟照-event-enlightenment
  title_zh: 道中奋杖大悟得芙蓉法
  date: '1110'
  year_of: 1110
  place_zh: 沂水芙蓉庵道中
  description_zh: 闻楷谪居芙蓉趣往唁之仆夫迷道却行及之举杖奋击忽大悟见楷蒙印可留佐耕累年
- id: guji-惟照-event-first-abbot
  title_zh: 出世招提历迁甘露三祖
  date: '1115'
  year_of: 1115
  place_zh: 洛阳招提舒州甘露三祖
  description_zh: 致政王少宰以生年合亡子而请出世遂迁甘露再迁三祖宣和初道行闻于朝
- id: guji-惟照-event-letan
  title_zh: 移圆通让席补处泐潭
  date: '1122'
  year_of: 1122
  place_zh: 庐山圆通泐潭
  description_zh: 宣和初移圆通守惠还旧怡然出门徜徉山谷江西礼请补泐潭示众专提如大死人
- id: guji-惟照-event-death
  title_zh: 建炎二年正月示寂
  date: 1128-01
  year_of: 1128
  place_zh: 泐潭方丈
  description_zh: 二年正月夜参叙洞下宗旨欷歔沾襟闭方丈手书辞诀中夕命烛嘱后事泊然而逝阅岁四十五坐二十五夏火余五色舍利齿舌不烬塔于西峰
