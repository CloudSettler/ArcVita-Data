  era: 宋
  reign_ref: 建炎
  archetype: 舍筏求证以死心弘道者
  dilemmas:
  - 饱参经论与直指人心之间何去何从
  - 顺应丛林供养丰足与坚持苦行死心之间如何自处
  lesson: 莫向文字中求禅须如大死人绝学自办方得自由
  summary_first_person: 吾简州阳安人也母梦异僧而生十九得度弃起信讲肆而游方参芙蓉楷而大悟历住招提甘露三祖圆通泐潭五剎教人以如大死人建炎二年正月嘱后事而逝
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/史传部/禅宗/僧宝正续传.html
endeavors:
- id: guji-惟照-endeavor-1
  title_zh: 弃讲参禅芙蓉得法
  summary_zh: 弃起信讲席遍参宗师于沂水芙蓉庵外举杖奋击而大悟尽得芙蓉之道
  phases:
  - key: brewing
    name: 童真弃俗
