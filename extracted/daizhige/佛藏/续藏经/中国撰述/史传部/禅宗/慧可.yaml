  name_zh: 慧可
  names:
    zh: 慧可
    en: Huike
  lifespan:
    birth:
      date: 0487-01-01
      precision: year
      is_circa: false
      raw: 北魏太和十一年
    death:
      date: 0593-01-01
      precision: year
      is_circa: false
      raw: 隋开皇十三年
  birth_date: 0487-01-01
  death_date: 0593-01-01
  era: 北魏至隋
  reign_ref: 北魏孝文帝至隋文帝
  archetype: 断臂求法的禅宗祖师
  dilemmas:
  - 舍身求法还是保身全道
  - 息缘安心是否落于断空
  - 得法之后隐修还是出世利生
  lesson: 内息诸虑外息诸缘，明心安心而后传灯利生
  summary_first_person: 吾本求道儒释之士，遇达磨于少林，立雪断臂以明志，得安心已息诸缘，承髓付法为二祖，继阐玄风，复以罪性本空之旨付于僧璨，愿后学回光内照，直指心源。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E7%A6%85%E5%AE%97/%E5%BB%BA%E4%B8%AD%E9%9D%96%E5%9B%BD%E7%BB%AD%E7%81%AF%E5%BD%95.html
endeavors:
- id: guji-慧可-endeavor-1
  title_zh: 立雪断臂嗣达磨
  summary: 于少林坚求要道，立雪断臂，得安心法，复以三拜依位得髓，承正法眼藏为二祖。
  phases:
  - key: brewing
    name: 少林立雪
    labels:
      zh:
      - 立雪求法
    start_date: 0528-01-01
    highlight_event_id: guji-慧可-event-lixue
  - key: breakthrough
    name: 觅心安心
    labels:
      zh:
      - 将心来安
    start_date: 0529-01-01
    highlight_event_id: guji-慧可-event-anxin
  - key: climax
    name: 得髓付法
    labels:
      zh:
      - 得髓传衣
    start_date: 0534-01-01
    highlight_event_id: guji-慧可-event-desui
  - key: closure
    name: 继阐玄风
    labels:
      zh:
      - 继祖弘化
    start_date: 0535-01-01
    highlight_event_id: guji-慧可-event-desui
  decisions:
  - date: 0528-01-01
    title_zh: 立雪断臂坚求
    rationale: 不舍身命难显求道之诚，故以断臂明志感动初祖
  - date: 0529-01-01
    title_zh: 觅心不可得即安
    rationale: 知心本不可得则诸缘自息，不落空有而明明了了
- id: guji-慧可-endeavor-2
  title_zh: 忏罪安心付僧璨
  summary: 以是心是佛是法之旨，为风恙居士忏罪，付法于僧璨，令宗风不绝。
  phases:
  - key: brewing
    name: 博求法嗣
    labels:
      zh:
      - 博求法嗣
    start_date: 0550-01-01
    highlight_event_id: guji-慧可-event-desui
  - key: breakthrough
    name: 将罪来忏
    labels:
      zh:
      - 罪性本空
    start_date: 0572-01-01
    highlight_event_id: guji-慧可-event-chuanfa
  - key: climax
    name: 佛法僧付嘱
    labels:
      zh:
      - 是心是佛
    start_date: 0573-01-01
    highlight_event_id: guji-慧可-event-chuanfa
  - key: closure
    name: 正宗普觉流芳
    labels:
      zh:
      - 传灯无尽
    start_date: 0593-01-01
    highlight_event_id: guji-慧可-event-death
  decisions:
  - date: 0572-01-01
    title_zh: 以觅罪性付忏悔
    rationale: 罪不在内外中间，如心然则佛法无二，令学者自悟解脱
  - date: 0573-01-01
    title_zh: 依佛法僧住而传付
    rationale: 以心为佛法，摄僧宝归一，择法器以续慧命
events:
- id: guji-慧可-event-birth
  date: 0487-01-01
  year_of: 487
  title_zh: 出生
  description: 神光生于北魏，博览儒释，好游山水，后出家求道。
- id: guji-慧可-event-lixue
  date: 0528-01-01
  year_of: 528
  title_zh: 立雪断臂
  description: 于少林立雪坚求诸佛要道，自断左臂以明志，易名慧可。
- id: guji-慧可-event-anxin
  date: 0529-01-01
  year_of: 529
  title_zh: 乞师安心
  description: 乞师安心，达磨令将心来，觅心不可得，遂言与汝安心竟，复教内息诸虑外息诸缘而顿证不落空。
- id: guji-慧可-event-desui
  date: 0534-01-01
  year_of: 534
  title_zh: 三拜得髓付法
  description: 达磨将归西天，慧可礼三拜依位而立，得吾髓之印，付正法眼藏与一花开五叶之偈，为东土二祖。
- id: guji-慧可-event-chuanfa
  date: 0572-01-01
  year_of: 572
  title_zh: 为居士忏罪传法
  description: 居士久缠风恙来求忏罪，以将罪来觅罪不可得与之忏竟，复示是心是佛是法，付嘱依佛法僧住，后传于僧璨。
- id: guji-慧可-event-death
  date: 0593-01-01
  year_of: 593
  title_zh: 示寂
  description: 继阐玄风博求法嗣之后，于隋开皇十三年示寂，谥正宗普觉禅师。
