  archetype: 开宗弘法型
  dilemmas:
  - 不立文字与付嘱衣钵如何并行
  - 顿悟见性与渐修方便如何抉择
  lesson: 菩提自性本来清净，但用此心直了成佛，不假外求。
  summary_first_person: 我本岭南新州樵子，闻金刚经有省，北游黄梅舂米，夜受五祖衣法，南归曹溪说法三十余年，直指人心见性成佛。
  source_urls:
  - https://daizhige.org/liandenghuiyao.html
