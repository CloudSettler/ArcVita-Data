endeavors:
- id: guji-慧能-endeavor-1
  title_zh: 黄梅得法承衣钵
  summary_zh: 北上黄梅谒弘忍，舂米八月，应偈夜授衣法为六祖。
  phases:
  - key: brewing
    name: 岭南听经北上求法
    labels:
      zh:
      - 求法问道
    start_date: 433
    highlight_event_id: guji-慧能-event-huangmei
  - key: breakthrough
    name: 舂米作偈夜授衣法
    labels:
      zh:
      - 明心见性
    start_date: 444
    highlight_event_id: guji-慧能-event-huangmei
  decisions:
  - date: 433
    title_zh: 辞亲北游黄梅
    rationale: 闻金刚经应无所住而生其心有省，决意北上参礼五祖以了生死。
  - date: 444
    title_zh: 南归避难不留东山
    rationale: 衣法付嘱后众嫉，遵师命南遁韬晦，全顿教慧命不断。
- id: guji-慧能-endeavor-2
  title_zh: 曹溪弘化开顿教
  summary_zh: 住韶州宝林寺说法，定慧一体顿悟见性，开南宗禅源。
  phases:
  - key: climax
    name: 曹溪开堂说法度众
    labels:
      zh:
      - 弘化开宗
    start_date: 446
    highlight_event_id: guji-慧能-event-caoqi
  - key: closure
    name: 付嘱传法示寂归真
    labels:
      zh:
      - 传灯付嘱
    start_date: 0713-07-01
    highlight_event_id: guji-慧能-event-death
  decisions:
  - date: 446
    title_zh: 住曹溪宝林弘顿教
    rationale: 南方机缘已熟，不立文字教外别传，直指人心最利群生。
  - date: 0713-07-01
    title_zh: 临终付嘱不传衣钵
    rationale: 衣为争端，止汝传衣，依法不依衣，令顿教遍传而不绝。
events:
- id: guji-慧能-event-birth
  title_zh: 诞生于岭南新州
  date: 0638
  year_of: 638
  place_zh: 岭南新州
  description_zh: 唐贞观十二年生于新州，父卢行瑫，少孤贫樵采养母。
- id: guji-慧能-event-huangmei
  title_zh: 黄梅舂米夜授衣法
  date: 444
  year_of: 674
  place_zh: 黄梅东山寺
  description_zh: 谒五祖弘忍，舂米八月，以菩提本无树偈明见性，夜三更授衣钵为六祖。
- id: guji-慧能-event-caoqi
  title_zh: 曹溪宝林说法弘化
  date: 446
  year_of: 676
  place_zh: 韶州曹溪宝林寺
  description_zh: 南归住曹溪说法，倡定慧一体，顿悟见性，学者云集，得嗣青原行思南岳怀让等。
- id: guji-慧能-event-death
  title_zh: 圆寂于新州国恩寺
  date: 0713-08-03
  year_of: 713
  place_zh: 新州国恩寺
  description_zh: 唐开元元年八月初三示寂，世寿七十六，塔于曹溪南华寺，谥大鉴禅师。
