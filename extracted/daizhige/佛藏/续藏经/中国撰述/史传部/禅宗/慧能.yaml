events:
- id: guji-慧能-event-birth
  title_zh: 诞生新州
  date: 0638-02-08
  year_of: 638
  place_zh: 新州
  description: 范阳卢氏子，父左宦新州，母李氏，夜诞祥光满室，三岁父亡，徙居南海市薪养母
- id: guji-慧能-event-huangmei
  title_zh: 谒弘忍得法
  date: 0672-01-01
  year_of: 672
  place_zh: 蕲州黄梅东山
  description: 咸亨中谒五祖，自言唯求作佛，对以人有南北佛性无二，入槽厂逾八月，夜得传屈眴伽梨与偈
- id: guji-慧能-event-faxing
  title_zh: 法性寺剃度受戒
  date: 0676-01-15
  year_of: 676
  place_zh: 南海法性寺
  description: 仪凤元年正月八日届法性，辩风幡语惊印宗，出信衣瞻拜，十五日会众剃落，二月八日智光律师授满分戒
- id: guji-慧能-event-caoxi
  title_zh: 大梵寺说心地法门
  date: 0677-03-01
  year_of: 677
  place_zh: 韶州大梵寺宝林寺
  description: 韶刺史韦据请普为四众说心地法门，度诸弟子，明佛性非常非无常不二之法，后还国恩开示最上乘
- id: guji-慧能-event-death
  title_zh: 国恩寺入寂镇塔曹溪
  date: 0713-08-03
  year_of: 713
  place_zh: 新州国恩寺
  description: 先天二年七月一日辞众归新州，八月三日中夜跏趺而化，异香白虹，十一月十三日入塔曹溪，寿七十六
