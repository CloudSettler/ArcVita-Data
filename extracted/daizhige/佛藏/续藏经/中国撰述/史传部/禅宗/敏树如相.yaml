    rationale: 阅楞严虽暂歇尘劳未彻本源故投破山受狗子无佛性话深疑不解
- id: guji-敏树如相-endeavor-2
  title_zh: 往来黔蜀开法行化
  summary_zh: 承印后开法行化往来黔蜀数十年住贵州大兴禅寺示众始终不异
