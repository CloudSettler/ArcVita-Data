    title_zh: 住贵州大兴禅寺应请升座
    rationale: 为接引黔中学人远问近对皆妄情故直指不可智知意识处令人坐断十方
  - date: '1672'
    title_zh: 临终嘱勿索塔铭
    rationale: 不欲以名位彰于士大夫故嘱众勿索塔铭惟以偈示来去自由纵横无碍
