  - title_zh: 正旁难辨源流易乱
    description: 五宗分派后旁出日多，后人错乱昧却古序，需考传灯以定祖图
  - title_zh: 开山安众与传法正人两难兼顾
    description: 既要创开天龙山寺安众接众，又要会集世谱辨魔拣异，劳心劳力
  lesson: 师资授受须有源，衣钵传持须有本，辨魔拣异舍邪归正
  summary_first_person: 我是迅雷明喜，临济正宗第三十四世，住终南天龙山，考传灯录编集缁门世谱，以明五宗正派，付梓流行，愿后世知授受有源
