  - key: breakthrough
    name: 相地赤帝峪创建道场
    labels:
      zh:
      - 开山突破
    start_date: '1698-01-01'
    highlight_event_id: guji-明喜-event-tianlong
  - key: climax
    name: 领众会集刊谱传法
    labels:
      zh:
      - 传法高潮
    start_date: '1703-05-04'
    highlight_event_id: guji-明喜-event-tianlong
  - key: closure
    name: 续字派收束付后
    labels:
      zh:
      - 续派收束
    start_date: '1703-06-01'
    highlight_event_id: guji-明喜-event-zimen
  decisions:
  - date: '1698-01-01'
    title_zh: 创开天龙山寺安众
    rationale: 蟠龙法孙天龙嗣，始来蟠龙行无边，创开天龙更胜先，需另建道场以兴临济正宗
  - date: '1703-05-04'
    title_zh: 遵祖定派续智种一枝
    rationale: 遵上祖定派下至空字毕，后续智种金刚子等二十字，以接临济正脉，使后嗣有派可依
events:
- id: guji-明喜-event-birth
  type: birth
  date: '1640-01-01'
  year_of: 1640
  title_zh: 降生
  description: 约生于清初，俗系未详，后出家嗣临济法脉
  place_zh: 中土
- id: guji-明喜-event-study
