  place_zh: 终南天龙山寺
- id: guji-明喜-event-death
  type: death
  date: '1720-01-01'
  year_of: 1720
  title_zh: 示寂
  description: 康熙末约示寂于天龙山，法嗣此峰休等十二人续传临济正宗
  place_zh: 终南天龙山寺
