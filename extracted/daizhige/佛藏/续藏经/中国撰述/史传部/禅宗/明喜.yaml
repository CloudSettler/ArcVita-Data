    highlight_event_id: guji-明喜-event-zimen
  decisions:
  - date: '1701-01-01'
    title_zh: 断自七佛溯流定序
    rationale: 古佛绵历无穷难悉数，故断自七佛而下，遡庄严劫至释迦，以正天竺中华传法之始
  - date: '1703-05-04'
    title_zh: 按传灯纠正五宗世次
    rationale: 六祖下第五世方有沩仰临济，第六世曹洞，第七世云门，第九世法眼，不可昧却源流古序
- id: guji-明喜-endeavor-2
  title_zh: 创开天龙山寺续临济正宗
  summary: 嗣蟠龙超远法席，于终南赤帝峪创开天龙山寺，接祖定派后续智种金刚一枝，领众安居
  phases:
  - key: brewing
