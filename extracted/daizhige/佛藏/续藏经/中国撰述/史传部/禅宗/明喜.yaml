  description: 嗣古蟠龙山寺子肃超远和尚法，为临济正宗第三十四世，潜心考传灯录及五宗世系
  place_zh: 终南蟠龙山寺
- id: guji-明喜-event-tianlong
  type: career
  date: '1698-01-01'
  year_of: 1698
  title_zh: 创开天龙山寺
  description: 于西安府华州西南赤帝峪创开建正兴天龙山寺，开堂接众，为天龙第一代
  place_zh: 终南天龙山寺
- id: guji-明喜-event-zimen
  type: career
