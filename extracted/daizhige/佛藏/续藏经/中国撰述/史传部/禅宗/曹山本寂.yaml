    title_zh: 不甘处俗依止洞山
    rationale: 为向上事须会通衣线下，择洞山类己之师长期依止以堪大法
  - date: 0865-01-01
    title_zh: 三更独往受曲折
    rationale: 大法付授须择时护密，虽矮师叔盗听亦不违师付，善保护银碗盛雪之旨
- id: guji-曹山本寂-endeavor-2
  title_zh: 开山曹山垂示君臣五位
  summary: 慕六祖而名山为曹，示众转自己作主宰之道，答枯木龙吟髑髅眼睛，制君臣偈及法身偈注，化被南州
