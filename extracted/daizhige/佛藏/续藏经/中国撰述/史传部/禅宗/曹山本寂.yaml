    highlight_event_id: guji-曹山本寂-event-caoshan
  - key: closure
    name: 却南平钟王之请以偈寄意
    labels:
      zh: 守林不赴
    start_date: 0895-01-01
    highlight_event_id: guji-曹山本寂-event-death
  decisions:
  - date: 0870-01-01
    title_zh: 志慕六祖名山为曹
    rationale: 以曹溪为祖源正脉，借山名明绍祖风，不趂快利而明白自在
  - date: 0890-01-01
    title_zh: 却聘不赴南平王请
    rationale: 如枯木倚寒林不变心，守山林以全道风，免樵客郢人之搜寻
events:
- id: guji-曹山本寂-event-birth
  title_zh: 莆田诞生灵石出家
  date: 0840-01-01
  year_of: 840
  place_zh: 泉州莆田及福州灵石山
  summary: 黄氏子幼而奇逸，十九弃家入灵石山，六年薙发受具，为后参洞山之基
- id: guji-曹山本寂-event-dongshan
  title_zh: 依止洞山三更授诀
  date: 0865-03-01
  year_of: 865
  place_zh: 筠州高安洞山
  summary: 依止悟本禅师十余年，三更受宝镜三昧五位显诀三种渗漏，矮师叔盗听在前，遂成洞上宗要
- id: guji-曹山本寂-event-caoshan
  title_zh: 定居曹山示众弘化
  date: 0876-01-01
  year_of: 876
  place_zh: 抚州临川曹山
  summary: 造曹溪礼祖塔后还临川，以佳山水定居名山为曹，上堂示转自己作主宰，作君臣偈及法身偈注，答枯木龙吟等，纸衣道者脱化于前
- id: guji-曹山本寂-event-death
  title_zh: 天复夏中宴坐示寂
  date: 0901-06-16
  year_of: 901
  place_zh: 曹山
  summary: 天复辛酉六月十五问知事日月，谓平生行脚到处只管九十日为一夏，明日辰时行脚去，及期焚香宴坐而化，世寿六十二，坐夏三十七，全身塔于山西阿号福圆
