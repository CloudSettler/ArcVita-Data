  - date: '1270'
    title_zh: 呈录于偃溪求证
    rationale: 所收机语皆有控人入处，非资谈柄，须得宗匠点定去留
  - date: 1272-03
    title_zh: 南归兴福付梓刊行
    rationale: 继继汇集俾五灯之后复见光明，不以漫录自谦，激贪立懦
