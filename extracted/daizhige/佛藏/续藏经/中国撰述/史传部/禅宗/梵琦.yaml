  summary_first_person: 吾名梵琦字楚石象山朱氏子九岁授经十六剃染因阅楞严有省随元叟入京闻西楼鼓声汗下顿悟偈云捉得红炉一点雪却是黄河六月冰蒙元叟印可出住报恩筑西斋以终老举扬正法无愧古人兼倡念佛作西斋净土诗以接后学世寿七十五以六会语录传世
