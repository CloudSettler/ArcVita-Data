    highlight_event_id: guji-正受-event-pudeng
  decisions:
  - date: 1187
    title_zh: 承二师训补续灯遗阙
    rationale: 灯明等及一切，不可独收比丘而遗帝王师尼道俗，故立愿抉具宗眼者备成普灯
  - date: 1204
    title_zh: 缮写两封诣登闻检院投进
    rationale: 私书秘之行箧不过私书，必得圣序冠首与大藏刊行，方使佛法帝道万世同昌
- id: guji-正受-endeavor-2
  title_zh: 参学游方闭关著述弘宗
  summary: 年十六慕道剃落，参天童应庵净慈月堂道场虎丘诸老，分座说法不屑，庆元初返关寿星院，注楞伽合楞严括华严，阐教弘宗却名刹招
  start_date: 1162
  end_date: 1208
