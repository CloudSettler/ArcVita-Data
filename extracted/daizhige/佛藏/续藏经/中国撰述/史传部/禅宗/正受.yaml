    labels:
      zh: 著述
    start_date: 1195
    highlight_event_id: guji-正受-event-shouxing
  - key: closure
    name: 遁迹藏密示寂
    labels:
      zh: 示寂
    start_date: 1208
    highlight_event_id: guji-正受-event-death
  decisions:
  - date: 1162
    title_zh: 舍儒礼慧日心鉴剃落登具
    rationale: 世境虚幻百年一瞬，读世书选官不如究出世法以选佛，且母以外祖赞成故得超俗
  - date: 1195
    title_zh: 却名刹招翛然返关寿星院
    rationale: 以阐教弘宗为心斥远声利，藏密庵居方得发挥楞伽楞严华严义趣以幸来学
events:
- id: guji-正受-event-birth
  date: 1146
  year_of: 1146
  title_zh: 生于苏州常熟邵氏
  description: 出苏之常熟邵氏，年十六肄儒业，后因游慧日寺与心鉴语而慕道
  location: 苏州常熟
- id: guji-正受-event-tonsure
  date: 1162
  year_of: 1162
  title_zh: 礼慧日心鉴剃落登具游方
  description: 母以外祖赞成，俾礼鉴剃落登具，首见天童应庵华不契，回净慈依月堂昌侍左右，又谒道场无庵虎丘瞎堂诸老
  location: 平江慧日寺
- id: guji-正受-event-vow
  date: 1187
  year_of: 1187
  title_zh: 受月堂佛海嘱补续灯遗阙
  description: 月堂指续灯喟叹照之不普，命掇阙遗抉具宗眼者备成之，佛海慧远亦督为之，遂权舆普灯之作
  location: 杭州净慈寺
- id: guji-正受-event-shouxing
  date: 1195
  year_of: 1195
  title_zh: 憩寿星院返关发挥经论
  description: 庆元之初泛霅过都憩湖上寿星院，返关为来学诠辨楞伽，厘正补葺楞严为合论，又括华严八十卷兼长者论为三卷
  location: 杭州湖上寿星院
- id: guji-正受-event-pudeng
  date: 1204
  year_of: 1204
  title_zh: 十七年成普灯三十卷表进于朝
  description: 继践月堂之属，岁十七迁而绝编，垂三十卷目录三卷，拟题嘉泰普灯录，缮写两封诣登闻检院投进乞圣序刊行
  location: 平江报恩光孝寺
- id: guji-正受-event-death
  date: 1208-11-28
  year_of: 1208
  title_zh: 嘉定元年十一月二十八日示寂
  description: 遁迹藏密庵居郊，以嘉定改元岁在戊辰示微疾，索笔书偈奄忽而逝，寿六十三腊四十七
  location: 郊庵居
