  lesson: 补阙拾遗使灯照普大，以私书成公器方能报佛恩国恩
  summary_first_person: 吾名正受，字虚中，号雷庵，常熟邵氏子，受月堂佛海之嘱，十七年旁搜曲取，成嘉泰普灯录三十卷，又注楞伽合楞严华严之要，以阐教弘宗为心，屡却名刹，遁迹著述，终以微疾书偈而逝
