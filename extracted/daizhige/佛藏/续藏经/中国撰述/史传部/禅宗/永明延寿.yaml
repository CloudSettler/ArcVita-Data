events:
- id: guji-永明延寿-event-birth
  date: 0904
  year_of: 904
  title_zh: 丹陽誕生能言感親
  description_zh: 生而方能言坐高榻見父母反目奮躍跪泣親感悅永偕琴瑟總角歸心佛乘不茹葷日一食持法華感群羊跪聽
- id: guji-永明延寿-event-release
  date: 0932
  year_of: 932
  title_zh: 放生罹法臨刑蒙宥
  description_zh: 為餘杭庫吏遷華亭鎮將屢以庫錢買魚蝦放生事發坐死赴市曹面無戚容吳越王夢老人引魚蝦求免遂釋之
- id: guji-永明延寿-event-ordain
  date: 0934
  year_of: 934
  title_zh: 舍俗投龍冊出家
  description_zh: 年三十吳越王從其志放令出家舍妻孥投龍冊寺翠巖削染登戒執勞供眾衣不繒纊野蔬布襦習靜天台智者岩跏趺九旬鳥巢衣育雏
- id: guji-永明延寿-event-yinji
  date: 0952
  year_of: 952
  title_zh: 參德韶蒙記拈鬮修淨
  description_zh: 北面師事天台德韶密授心印國清旋繞見普賢蓮花在手登智者院作二鬮一心禪定萬善生淨土七拈皆得淨土遂專修淨業建法華懺堂六時代眾生禮懺
- id: guji-永明延寿-event-lingyin
  date: 0960
  year_of: 960
  title_zh: 中興靈隱開山永明
  description_zh: 建隆元年應錢忠懿王請重創靈隱千三百餘間顯德奉勅住永明為第一世會三宗集宗鏡錄百卷萬善同歸集等頒入大藏手度弟子二千人日課百八事暮往別峰念佛感天樂
- id: guji-永明延寿-event-nianfo
  date: 0961
  year_of: 961
  title_zh: 華台誦經別峰行道
  description_zh: 每日於慧日峰西岩誦妙法蓮華經計萬三千部感天雨花夜普為冥官鬼神說法授戒施法食印彌陀塔四十八萬勸人禮念
- id: guji-永明延寿-event-pagoda
  date: 0970
  year_of: 970
  title_zh: 建六和塔鎮潮說戒天台
  description_zh: 奉詔於月輪峰建六和塔九級五十餘丈以鎮羅剎江潮開寶七年入天台開菩薩戒受者萬餘高麗國王覽宗鏡遣使奉袈裟數珠致弟子禮
- id: guji-永明延寿-event-death
  date: '0975-12-26'
  year_of: 975
  title_zh: 預知時至趺坐而逝
  description_zh: 開寶八年屢見金台寶樹聞天樂異香十二月二十四日示疾二十六日晨起焚香趺坐而逝壽七十二臘四十二茶毗舍利如鱗砌葬大慈山宋太宗額曰壽寧禪院
