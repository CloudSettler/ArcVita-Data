  - date: 1122
    title_zh: 以香酬丹霞明嗣法本源
    rationale: 感一掌契旨之恩，表明曹洞正脉，立弘化正本
  - date: 1131
    title_zh: 舍长芦南游浮海至补陀
    rationale: 不恋名席，欲辟海隅弘法，普接海山机缘
- id: guji-清了-endeavor-2
  title_zh: 普陀开法化导海山
  summary: 结庵海岸孤绝，易律为禅，化渔户弃杀，奠定普陀禅宗第一世
  phases:
  - key: brewing
