person:
  qid: guji-清了
  name_zh: 清了
  names:
    zh: 真歇清了
    en: Zhenxie Qingliao
  lifespan:
    birth:
      date: 1091
      precision: year
      is_circa: true
      raw: 约宋元祐六年蜀左绵安昌雍氏子推算
    death:
      date: 1152-11-10
      precision: day
      is_circa: false
      raw: 南宋绍兴二十二年壬申十月朔日
  birth_date: 1091
  death_date: 1152-11-10
  era: 宋
  reign_ref: 绍兴
  archetype: 开山弘法禅师
  dilemmas:
  - 经论言说与禅门直指之抉择
  - 海岛渔民生计与慈悲戒杀之两难
  - 屡承诏住大刹与归休本怀之权衡
  lesson: 一掌下伎俩俱尽，不向寸心安立，转功就位方得自在弘化
  summary_first_person: 我蜀左绵雍氏子，十一出家，十八得度，参丹霞一掌契旨，继席长芦，南游浮海开普陀海岸孤绝，化七百余家渔户弃业，历七处说法，五承紫泥诏，六十二岁而逝
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/史传部/禅宗/普陀列祖錄.html
  - https://cbeta.org/X1609
