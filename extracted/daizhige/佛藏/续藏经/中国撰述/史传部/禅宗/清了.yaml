  decisions:
  - date: 1132
    title_zh: 奏请易律为禅
    rationale: 海山当为普门示现弘法之地，须立禅宗家风以接英秀
  - date: 1133
    title_zh: 以沤和方便化七百渔家
    rationale: 慈悲活命，日活千万亿命，示现不诤三昧与同体大悲
events:
- id: guji-清了-event-birth
  date: 1091
  year_of: 1091
  title_zh: 生于蜀左绵安昌雍氏
  description: 生有慧根眉目疎秀，见佛欣恋不舍，十一依圣果寺俊僧受业
- id: guji-清了-event-danxia
  date: 1109
  year_of: 1109
  title_zh: 扣丹霞子淳一掌契旨
  description: 问空劫时自己，蒙掌而契，次日举日照孤峰翠对机，北游五台京汴南抵仪真谒长芦祖照契合为侍者
- id: guji-清了-event-changlu
  date: 1122
  year_of: 1122
  title_zh: 继席长芦以香酬丹霞
  description: 宣和壬寅祖照病笃嘱继席，开法长芦，洞宗大振，禅流如归
- id: guji-清了-event-putuo
  date: 1131
  year_of: 1131
  title_zh: 浮海至补陀结庵海岸孤绝
  description: 绍兴元年辛亥自长芦南游浮海至此，结庵山椒扁海岸孤绝，英秀多依之
- id: guji-清了-event-jiaohua
  date: 1133
  year_of: 1133
  title_zh: 化导海山渔户弃渔业
  description: 郡请于朝易律为禅，以沤和机引导海山七百余家，一闻教音俱弃渔业
- id: guji-清了-event-yuwang
  date: 1140
  year_of: 1140
  title_zh: 历主国清雪峰育王双径崇先
  description: 应天台国清闽之雪峰，奉旨补处育王，诏主双径龙翔兴庆，慈宁建崇先居之，五承紫泥诏，得度四百嗣法三十余人
- id: guji-清了-event-death
  date: 1152-11-10
  year_of: 1152
  title_zh: 示疾跏趺而逝于崇先
  description: 上堂转功就位罢示疾，中使问候从容叙谢，呼首座言吾行矣，跏趺瞑目而逝，世六十二坐四十五夏
