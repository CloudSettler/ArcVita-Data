endeavors:
- id: guji-灵照女-endeavor-1
  title_zh: 随父参禅在家悟道
  description: 幼承庞居士家风，洗菜接丹霞，论百草头祖师意，於日用中发明心地
  phases:
  - key: brewing
    name: 幼承家学
    labels:
      zh: 庞家禅风熏习
    start_date: '0770'
    highlight_event_id: guji-灵照女-event-birth
  - key: breakthrough
    name: 洗菜示机
    labels:
      zh: 敛手提篮不落言筌
    start_date: 0795
    highlight_event_id: guji-灵照女-event-xicai
  - key: climax
    name: 百草头论道
    labels:
      zh: 不难不易饥食困眠
    start_date: 0798
    highlight_event_id: guji-灵照女-event-baicao
  decisions:
  - date: 0795
    title_zh: 洗菜不答以行显道
    rationale: 丹霞连问居士在否，放下菜篮敛手而立，复提篮便行，不以言对，保存活机
  - date: 0798
    title_zh: 明言平常即是禅
    rationale: 父言难易，母言祖师意，独道也不难也不易，饥来吃饭困来睡，直指日用是道
- id: guji-灵照女-endeavor-2
  title_zh: 以先逝示生死自在
  description: 卖漉篱下相扶倒地以显平等，临终视日先父坐化，以身证解脱
  phases:
  - key: brewing
    name: 相扶示同
    labels:
      zh: 卖漉篱下同倒同起
    start_date: 0800
    highlight_event_id: guji-灵照女-event-fudao
  - key: climax
    name: 视日先化
    labels:
      zh: 报蚀先登榻逝
    start_date: 0808
    highlight_event_id: guji-灵照女-event-death
  - key: closure
    name: 父母继化
    labels:
      zh: 一家四口次第解脱
    start_date: 0808
    highlight_event_id: guji-灵照女-event-death
  decisions:
  - date: 0800
    title_zh: 见父倒地亦倒
    rationale: 父於桥下吃扑，即随倒地，道见爷倒地相扶，显父女同体不分彼此
  - date: 0808
    title_zh: 诳父观日先坐亡
    rationale: 父令视日早晚报午，即报日中且蚀，趁父临窗，据榻趺坐奄然而逝，先行一步断其系恋
events:
- id: guji-灵照女-event-birth
  date: '0762'
  year_of: 762
  title_zh: 诞生於庞蕴家
  description: 为庞居士与庞行婆之女，生於衡阳庞家，自幼聪慧，随父母参禅问道
- id: guji-灵照女-event-xicai
  date: 0795
  year_of: 795
  title_zh: 洗菜接丹霞
  description: 丹霞来访居士，见灵照洗菜，问居士在否，灵照放下菜篮敛手而立，再问即提篮便行，归举似父得印可
- id: guji-灵照女-event-baicao
  date: 0798
  year_of: 798
  title_zh: 百草头论难易
  description: 与父母坐次，父言难难十石油麻树上摊，母言易易百草头祖师意，灵照言也不难也不易饥来吃饭困来睡，复会明明百草头意得父大笑
- id: guji-灵照女-event-fudao
  date: 0800
  year_of: 800
  title_zh: 卖漉篱下相扶
  description: 同父卖漉篱下桥吃扑，灵照见亦倒地，问作甚么，答见爷倒地相扶，显机锋平等
- id: guji-灵照女-event-death
  date: 0808
  year_of: 808
  title_zh: 视日先父坐化
  description: 父将入灭令视日早晚及午以报，出户报日已中而有蚀，父临窗观时，据榻趺坐奄然而逝，父随后亦化去
