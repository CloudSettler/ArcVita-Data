  event_type: career
  date: 1659
  precision: year
  is_circa: false
  raw: 顺治己亥春诏迎入京命住万善殿举西余端村里师子话赐大觉禅师
  year_of: 1659
  description: 初主报恩齿最少道望四驰，顺治己亥春诏迎入京住万善殿，御驾亲临升座举师子话大悦赐大觉禅师紫衣金印，次年再诏授千五百僧菩萨大戒加封普济能仁国师
