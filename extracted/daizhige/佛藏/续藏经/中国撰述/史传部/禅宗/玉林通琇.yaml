  event_type: career
  date: 1652
  precision: year
  is_circa: true
  raw: 修迁武康报恩连书促师破关诣修掀倒香案喝喝相承
  year_of: 1652
  description: 得修公精神日不如前有最要语分付书，即破蓉城江干关诣修，问大唐国里无禅师而今还有么，三喝转身叹死气
- id: guji-玉林通琇-event-rujing
  person_id: guji-玉林通琇
