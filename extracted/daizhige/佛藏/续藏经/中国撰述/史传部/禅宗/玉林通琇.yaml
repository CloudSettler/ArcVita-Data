  raw: 蓉城杨氏子童子时反观念起无念可得
  year_of: 1614
  description: 蓉城杨氏子，童子令闭目反观念起，独云无念可得，器识已异
- id: guji-玉林通琇-event-canwushan
  person_id: guji-玉林通琇
  title_zh: 参磬山闻吸尽西江水大悟
  event_type: career
  date: 1640
  precision: year
  is_circa: true
  raw: 参天隐修和尚命充侍司随堂坐香举庞居士见马祖因缘言下大悟
  year_of: 1640
  description: 随堂坐香疑不侣万法者是谁，大泪彻夜立单，闻待汝一口吸尽西江水即与汝道言下大悟拂袖而出
- id: guji-玉林通琇-event-poguan
  person_id: guji-玉林通琇
