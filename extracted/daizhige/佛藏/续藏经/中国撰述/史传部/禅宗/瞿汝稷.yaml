  lesson: 以指观月勿执指为月化私好为公器方能续佛慧命
  summary_first_person: 我垂髫好读竺坟尤好宗门家言乙亥夏侍东溟先生于竹堂寺幸沾甘露自此每读宗门语如从耆宿于长林深壑辄手录之寒暑饥渴不顾积至乙未成三十二卷友人陈孟起与严道彻误赏欲梓行我笑为嵇氏之锻阮氏之屐终不敢藏其僻乃次第缘起名曰水月斋指月录愿聊凭标月之指使人云开月露
