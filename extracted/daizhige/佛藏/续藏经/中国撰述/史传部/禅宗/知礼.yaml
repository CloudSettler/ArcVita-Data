    title_zh: 修光明忏五日召众遗训
    rationale: 知生必有死乃常分，示勤修勿间以续慧命
events:
- id: guji-知礼-event-birth
  title_zh: 建隆元年降生
  date: 960-01-01
  year_of: 960
  description_zh: 建隆元年生，后出家学天台，四十岁后常坐不卧足无外涉
  endeavor_ref: guji-知礼-endeavor-1
- id: guji-知礼-event-fahua
  title_zh: 结十僧修法华三昧誓焚身
  date: 1004-06-01
  year_of: 1004
  description_zh: 谓圣人为法忘躯，结十僧修法华三昧期满三载共焚其身，翰林杨亿致书确请住世，慈云自杭至明面沮其议，州将奉命护持不得行
  endeavor_ref: guji-知礼-endeavor-1
- id: guji-知礼-event-imperial
  title_zh: 真宗嘉叹赐法智之号
  date: 1017-05-01
  year_of: 1017
  description_zh: 杨亿奏遗身事，真宗嘉叹传谕留住世，即赐法智之号，由是愿行不得施，转以讲训利生，对答杨亿风吟宝树及法华梵网之问
  endeavor_ref: guji-知礼-endeavor-2
- id: guji-知礼-event-guangming
  title_zh: 复修光明忏为顺寂之期
  date: 1028-01-01
  year_of: 1028
  description_zh: 复修光明忏，方五日趺坐召众，诫勤修道勿令有间，从训如生
  endeavor_ref: guji-知礼-endeavor-2
- id: guji-知礼-event-death
  title_zh: 趺坐称佛而逝
  date: 1028-02-08
  year_of: 1028
  description_zh: 言毕称佛而逝，年六十九，行道讲训至疾顿无间，门徒请宴不从，舍利莫知其几，慈云叹其解行卓卓行之为艰
  endeavor_ref: guji-知礼-endeavor-2
