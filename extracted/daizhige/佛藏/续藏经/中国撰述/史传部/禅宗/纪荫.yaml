      raw: 清初约生新安
    death:
      date: '1695'
      precision: year
      is_circa: true
      raw: 康熙后期示寂
  birth_date: '1635'
  death_date: '1695'
  era: 清
  reign_ref: 康熙
  archetype: 高僧史家
  dilemmas:
  - 宗门灯录散漫无统，后学难辨修途，我当如何会众书而立信史
  - 时风浇薄知见日漓，坚持编年大义，宁枯瘁身命亦不负法苑深心
  lesson: 会儒释之渊源，以编年贯宗统，使佛祖血脉有征可信
  summary_first_person: 余新安沙门纪荫，号盘谭，忝承临济三十四世，住持夫椒祥符，痛宗门无编年信史，遂参合经史灯录，会儒释源流，仿春秋笔削，成宗统编年三十余卷，愿以此灯续迦叶之薪，照末劫人天
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E7%A6%85%E5%AE%97/%E5%AE%97%E7%BB%9F%E7%BC%96%E5%B9%B4.html
