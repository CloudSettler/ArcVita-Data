endeavors:
- id: guji-纪荫-endeavor-1
  title_zh: 编纂宗统编年
  summary_zh: 会儒释众书，仿春秋编年，成佛祖宗统信史三十一卷
  phases:
  - key: brewing
    name: 发愿搜讨
    labels:
      zh: 立志编史
    start_date: '1685'
    highlight_event_id: guji-纪荫-event-compile
  - key: breakthrough
    name: 参合众书
    labels:
      zh: 考定异同
    start_date: '1688'
    highlight_event_id: guji-纪荫-event-compile
  - key: climax
    name: 成书付梓
    labels:
      zh: 然炬成书
    start_date: '1689'
    highlight_event_id: guji-纪荫-event-complete
  - key: closure
    name: 进呈御览
    labels:
      zh: 进呈颁行
    start_date: '1693'
    highlight_event_id: guji-纪荫-event-memorial
  decisions:
  - date: '1688'
    title_zh: 会儒释渊源参圣贤壶域
    rationale: 为破门户藩篱，扩大同道域，故通经史子集与灯录语录，合订成编
  - date: '1689'
    title_zh: 仿春秋史例以纪月编年
    rationale: 为使循年核实举法知时，故立佛纪祖纪宗纪诸方略纪，大书嗣统示寂之年
  - date: '1693'
    title_zh: 托玉泉和尚代呈御前求序颁行
    rationale: 愿藉圣化流通，黼黻太平，兼得冠序敕许，使宗统永传
- id: guji-纪荫-endeavor-2
  title_zh: 住持祥符弘扬临济宗风
  summary_zh: 住持常州武进祥符寺，接引后学，续慧命于末法
  phases:
  - key: brewing
    name: 出家究心禅宗
    labels:
      zh: 出家学道
    start_date: '1655'
    highlight_event_id: guji-纪荫-event-abbot
  - key: breakthrough
    name: 住持夫椒祥符
    labels:
      zh: 住持弘法
    start_date: '1680'
    highlight_event_id: guji-纪荫-event-abbot
  - key: climax
    name: 接引撰述利生
    labels:
      zh: 著述接引
    start_date: '1689'
    highlight_event_id: guji-纪荫-event-complete
  - key: closure
    name: 遗付真传
    labels:
      zh: 付嘱后学
    start_date: '1693'
    highlight_event_id: guji-纪荫-event-memorial
  decisions:
  - date: '1680'
    title_zh: 驻锡祥符领众熏修
    rationale: 为安僧弘道，故守山林樗废之身而发广大心，开方便门
  - date: '1689'
    title_zh: 燃松滴露兀兀成书
    rationale: 念先师退翁未遑之志，不惜身命劳瘁数年，以照耀末劫人天
