  summary_first_person: 我是眉山苏轼，少举进士，浮沉黄惠儋杭常之间，老与佛印了元往来金山，一日欲借其四大为禅床坐，被诘四大本空五阴非有而拟议落机，遂解玉带相酬，作偈以病骨玉带换云山衲衣，晚助乐全印施楞伽，亲书令刻石金山，文字即是道场
