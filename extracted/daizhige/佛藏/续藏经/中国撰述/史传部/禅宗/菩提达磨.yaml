person:
  qid: guji-菩提达磨
  name_zh: 菩提达磨
  names:
    zh: 菩提达磨
    en: Bodhidharma
  lifespan:
    birth:
      date: '0440'
      precision: year
      is_circa: true
      raw: 南印度香至王之子约五世纪中生
    death:
      date: 0528
      precision: year
      is_circa: true
      raw: 相传梁大通二年寂于洛滨熊耳山
  birth_date: '0440'
  death_date: 0528
  era: 南北朝
  reign_ref: 梁普通年间
  archetype: 开宗传灯者
  dilemmas:
  - 世宝法宝之辨以智光明心宝为上
  - 对梁武帝廓然无圣不立知见而契机不契
  - 面壁九年心如墙壁以无言显教外别传之旨
  lesson: 直指心性不立文字，于廓然无圣处见作用全体，皮肉骨髓各得其分，方成果自然
  summary_first_person: 吾本香至王第三子，因辨宝珠得般若多罗改名达磨，既破六宗复化异见王，观赤县有机遂渡海来梁，武帝不契乃折芦至少林面壁九年，雪中得慧可传衣，以一花五叶付之，缘尽示寂于熊耳，只履西归而已
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/X1554
  - https://kanripo.org/text/KR6q0005/
endeavors:
- id: guji-菩提达磨-endeavor-1
  title_zh: 西天承记辨法化邪
  summary: 于本国辨珠明法宝受记出家，降六宗邪执，神助波罗提化异见王
  phases:
  - key: brewing
    name: 辨珠受记改名达磨
    labels:
      zh: 法宝为上智光辨珠
    start_date: '0460'
    highlight_event_id: guji-菩提达磨-event-prajnatara
  - key: breakthrough
    name: 降服六宗立正见
    labels:
      zh: 有相无相定慧戒行无得寂静皆降
    start_date: 0480
    highlight_event_id: guji-菩提达磨-event-subdue-six
  - key: climax
    name: 足生云化异见王
    labels:
      zh: 见性是佛性在作用
    start_date: 0490
    highlight_event_id: guji-菩提达磨-event-convert-king
  - key: closure
    name: 观赤县有机东行
    labels:
      zh: 踰海越漠为法求人
    start_date: '0515'
    highlight_event_id: guji-菩提达磨-event-vow-east
  decisions:
  - date: '0470'
    title_zh: 香至厌世后出家承法
    rationale: 以法宝心明为上故舍王位随般若多罗学道
  - date: '0515'
    title_zh: 决意东渡赤县神州
    rationale: 观东土有大乘根器故不恋西天道场远涉求人
- id: guji-菩提达磨-endeavor-2
  title_zh: 东土面壁传衣开宗
  summary: 金陵答武帝不契折芦至少林面壁九年雪中得慧可付衣传灯
  phases:
  - key: brewing
    name: 金陵答廓然无圣
    labels:
      zh: 圣谛第一义不识
    start_date: '0520'
    highlight_event_id: guji-菩提达磨-event-liangwu
  - key: breakthrough
    name: 少林面壁九年观心
    labels:
      zh: 外息诸缘内心无喘心如墙壁
    start_date: '0521'
    highlight_event_id: guji-菩提达磨-event-nine-years
  - key: climax
    name: 深雪得二祖付衣偈
    labels:
      zh: 一花开五叶结果自然成
    start_date: '0525'
    highlight_event_id: guji-菩提达磨-event-transmit-robe
  - key: closure
    name: 熊耳示寂只履西归
    labels:
      zh: 分皮肉骨髓江槎分玉浪
    start_date: 0528
    highlight_event_id: guji-菩提达磨-event-death
  decisions:
  - date: '0520'
    title_zh: 不住金陵折芦渡江
    rationale: 武帝着有功德不契无圣故舍朝堂入山林待根器
  - date: '0526'
    title_zh: 付衣慧可以髓拣徒
    rationale: 以得髓者堪荷大法故付衣偈令分宗不断
events:
- id: guji-菩提达磨-event-birth
  type: birth
  date: '0440'
  year_of: 440
  title_zh: 生于南印度香至王家
  description: 香至王第三子姓刹帝利本名菩提多罗聪慧善辨
- id: guji-菩提达磨-event-prajnatara
  type: career
  date: '0460'
  year_of: 460
  title_zh: 辨宝珠受记改名
  description: 对般若多罗陈法宝智光心明为上叹为辩慧改号菩提达磨遂出家
- id: guji-菩提达磨-event-subdue-six
  type: career
  date: 0480
  year_of: 480
  title_zh: 降服有相等六宗
  description: 立正法破有相无相定慧戒行无得寂静六宗偏执
- id: guji-菩提达磨-event-convert-king
  type: career
  date: 0495
  year_of: 495
  title_zh: 助波罗提化异见王
  description: 令弟子波罗提足生云至王前说见性是佛性在作用八处出现偈王开悟悔谢
- id: guji-菩提达磨-event-vow-east
  type: career
  date: '0515'
  year_of: 515
  title_zh: 发愿东渡赤县
  description: 自言观赤县神州有大根器遂逾海越漠为法求人
- id: guji-菩提达磨-event-liangwu
  type: career
  date: '0520'
  year_of: 520
  title_zh: 金陵见梁武帝语不契
  description: 答圣谛第一义廓然无圣对朕者谁不识帝不契遂渡江至少林
- id: guji-菩提达磨-event-nine-years
  type: career
  date: '0521'
  year_of: 521
  title_zh: 少林面壁九年
  description: 结庵少林面壁而坐教外息诸缘内心无喘心如墙壁可以入道
- id: guji-菩提达磨-event-transmit-robe
  type: career
  date: '0526'
  year_of: 526
  title_zh: 雪中得二祖付衣说偈
  description: 慧可深雪求法传衣付一花开五叶偈复以皮肉骨髓勘道副总持道育慧可四人
- id: guji-菩提达磨-event-death
  type: death
  date: 0528
  year_of: 528
  title_zh: 示寂熊耳只履西归
  description: 知缘尽服毒不救葬熊耳后宋云使西域葱岭遇其携只履而归开圹惟空棺只履存
