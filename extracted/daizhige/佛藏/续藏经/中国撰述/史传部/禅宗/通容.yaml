    en: Tongrong
  lifespan:
    birth:
      date: 1587-01-01
      precision: year
      is_circa: true
      raw: 明万历十五年前后
    death:
      date: 1660-01-01
      precision: year
      is_circa: true
      raw: 清初顺治康熙之际
  birth_date: 1587-01-01
  death_date: 1660-01-01
  era: 明末清初
  reign_ref: 明崇祯
  archetype: 卫道考信者
  dilemmas:
  - 恪守佛祖通载旧章与洞宗三家群起攻讦之间的进退维谷
  - 直笔厘清天皇天王分属青原南岳与保全宗门和合之间的取舍两难
  lesson: 依唐贤金石旧文考订源流，以至公至正存真黜伪，还禅史清白于千古，不以毁誉移志
  summary_first_person: 吾为径山兴圣万寿沙门通容，十易星霜辑成五灯严统，依丘玄素符载二碑与佛祖通载旧章，辨明天王归马祖天皇归石头，复作解惑篇以正视听，愿以存真黜伪为后学龟鉴
  source_urls:
  - https://cbetaonline.dila.edu.tw/zh/X1569
  - https://daizhige.org/zh-hans/fozang/xuzangjing/wudengyantongjiehuobian.html
endeavors:
- id: guji-通容-endeavor-1
  title_zh: 辑集五灯严统厘清五宗支派
  goal: 融会传灯录与传法正宗记旧文，分支表宗，使五家宗统有原有委，垂为禅史定案
  phases:
  - key: brewing
    name: 博考旧典溯流寻源
    labels:
      zh: 考订源流
    start_date: 1623-01-01
    highlight_event_id: guji-通容-event-compilation
  - key: breakthrough
    name: 分支表宗编成严统
    labels:
      zh: 立宗定统
    start_date: 1633-01-01
    highlight_event_id: guji-通容-event-compilation
  - key: closure
    name: 刊刻流通付之天下
    labels:
      zh: 刊行流通
    start_date: 1634-01-01
    highlight_event_id: guji-通容-event-compilation
  decisions:
  - date: 1633-01-01
    title_zh: 依佛祖通载旧章定天皇天王分属
    rationale: 据丘玄素符载同时同郡所作二碑金石之文，核定天王嗣马祖天皇嗣石头，使泾渭得清，不凭臆说
  - date: 1633-06-01
    title_zh: 以大川会元体例分支表宗
    rationale: 鉴传灯正宗仅叙世次而无宗旨支派之分，遂承大川旧制立临济云门曹洞沩仰法眼五宗，使家喻户晓
- id: guji-通容-endeavor-2
  title_zh: 著解惑篇复书捍卫严统
  goal: 驳斥洞宗三家辟书无君之诬，发明朝廷功令不禁辨论修补之大义，护持正法
  phases:
  - key: brewing
    name: 三家辟书交攻质疑
    labels:
      zh: 遭谤隐忍
    start_date: 1634-01-01
    highlight_event_id: guji-通容-event-defense
  - key: breakthrough
    name: 作解惑篇分疏立意
    labels:
      zh: 据典申辩
    start_date: 1635-01-01
    highlight_event_id: guji-通容-event-defense
  - key: climax
    name: 复武林缙绅书陈述本怀
    labels:
      zh: 护法明心
    start_date: 1636-01-01
    highlight_event_id: guji-通容-event-defense
  decisions:
  - date: 1635-01-01
    title_zh: 举明教嵩疏证明取斥不禁
    rationale: 引嵩公校验大藏或斥或取编成正宗记之例，证明敷文演义修补不足非改易龙藏，以破无君之诬
  - date: 1636-01-01
    title_zh: 以宗旨验龙潭德山雪峰非洞宗眷属
    rationale: 举雪峰淘米覆盆机缘无回互夹妙而不契洞上正偏兼到之旨，证其属马祖德山一系，确然不差
events:
- id: guji-通容-event-birth
  date: 1587-01-01
  year_of: 1587
  title_zh: 降生
  description: 明万历中叶降生，后祝发为僧，亲炙禅林，博达经传
- id: guji-通容-event-compilation
  date: 1633-01-01
  year_of: 1633
  title_zh: 辑成五灯严统
  description: 与同道缁素日积月累参考融会，辑成五灯严统，依通载旧章定天王归马祖天皇归石头，分支表宗
- id: guji-通容-event-defense
  date: 1636-01-01
  year_of: 1636
  title_zh: 作解惑篇复武林缙绅书
  description: 面对三宜远门辟谬摘欺诸书攻讦，作解惑篇普誓公论，复书武林越州缙绅，陈述存真黜伪守阙疑之大义
- id: guji-通容-event-death
  date: 1660-01-01
  year_of: 1660
  title_zh: 示寂
  description: 清初示寂，一生矢公矢慎，以至公至正还禅史于千古
