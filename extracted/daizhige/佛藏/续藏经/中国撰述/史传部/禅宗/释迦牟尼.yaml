    title_zh: 鹿野苑先度五人
    rationale: 为憍陈如等转四谛法轮，令证道果，以开化人天之始
  - date: -0950-02-15
    title_zh: 以法衣付迦叶护持
    rationale: 以清净法眼涅槃妙心付摩诃迦叶，并勑阿难副贰传化，无令断绝
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 降生王家行七步
  date: -1029-04-08
  year_of: -1029
  place_zh: 迦毗罗卫
  summary_zh: 周昭王二十四年甲寅四月八日生，放大智光明，地涌金莲捧足，东西南北各行七步，作师子吼
- id: guji-释迦牟尼-event-renunciation
  title_zh: 年十九逾城出家
  date: -1010-02-08
  year_of: -1010
  place_zh: 檀特山
  summary_zh: 年十九二月八日夜得净居天人劝请，逾城而去，学阿蓝迦蓝郁头蓝弗定而舍，同外道日食麻麦六年
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 明星出时成道转法轮
  date: -0999-02-08
  year_of: -999
  place_zh: 菩提场及鹿野苑
  summary_zh: 穆王三年癸未二月八日明星出时成道号天人师，鹿野苑为憍陈如等五人转四谛法轮而证道果
- id: guji-释迦牟尼-event-transmission
  title_zh: 灵山拈华付法迦叶
  date: -0951-01-01
  year_of: -951
  place_zh: 灵山会及多子塔
  summary_zh: 拈华示众唯迦叶破颜微笑，付正法眼藏涅槃妙心，多子塔前分座以僧伽梨围之而付嘱
- id: guji-释迦牟尼-event-death
  title_zh: 拘尸那双林入涅槃
  date: -0950-02-15
  year_of: -950
  place_zh: 拘尸那城熙连河侧娑罗双树下
  summary_zh: 穆王五十二年壬申二月十五日右胁累足泊然宴寂，说无常偈茶毗得舍利八斛四斗，说法住世四十九年
