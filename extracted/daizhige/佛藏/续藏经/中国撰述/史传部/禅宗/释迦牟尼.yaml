  decisions:
  - date: -1010-02-08
    title_zh: 逾城出家
    rationale: 见老病死可厌离，不忍承王位而沉沦，故闻净居天人劝请即夜去
  - date: -1005-01-01
    title_zh: 舍外道定见
    rationale: 知不用处定非非想定非究竟，日食麻麦亦非解脱，故悉舍而求正觉
- id: guji-释迦牟尼-endeavor-2
  title_zh: 成道说法付法涅槃
  summary_zh: 二月八日明星出时成道，鹿野苑转四谛法轮，说法住世四十九年，拈华付迦叶，双林入灭分舍利
  phases:
