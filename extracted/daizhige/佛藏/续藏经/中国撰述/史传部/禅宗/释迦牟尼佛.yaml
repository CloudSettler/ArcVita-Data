events:
- id: guji-释迦牟尼佛-event-birth
  title_zh: 蓝毘尼降生
  date: -563-04-08
  year_of: -563
  place_zh: 迦毘罗卫蓝毘尼园
  description: 自摩耶右胁诞生放大智光明地涌金莲周行七步一手指天一手指地言天上天下惟吾独尊
- id: guji-释迦牟尼佛-event-renunciation
  title_zh: 夜逾城出家
  date: -544-02-08
  year_of: -544
  place_zh: 迦毘罗卫王宫至檀特山
  description: 年十九二月八日夜净居天人告出家时至遂逾城而去立誓不断八苦不成菩提不转法轮终不还
- id: guji-释迦牟尼佛-event-austerity
  title_zh: 参学舍定行苦行
  date: -543-06-01
  year_of: -543
  place_zh: 阿蓝迦蓝郁头蓝弗象头山
  description: 三年学不用处定知非便舍三年学非非想定知非亦舍同外道日食麻麦经六年知苦行非正解脱
- id: guji-释迦牟尼佛-event-enlightenment
  title_zh: 菩提树下成正觉
  date: -530-02-08
  year_of: -530
  place_zh: 毕钵树下
  description: 受乳糜敷瑞草按地降魔於二月七日夕入正三昧至八日明星出时廓然大悟叹一切众生具有如来智慧德相
- id: guji-释迦牟尼佛-event-teaching
  title_zh: 归宫说法度众
  date: -524-03-01
  year_of: -524
  place_zh: 迦毘罗卫王宫
  description: 成道后六年归为净饭王说法王大喜遣族中五百贵子从之出家说法度人无算
- id: guji-释迦牟尼佛-event-transmission
  title_zh: 灵山拈花付迦叶
  date: -484-05-01
  year_of: -484
  place_zh: 灵山会
  description: 一日升座大众集定拈花示众众默然唯迦叶破颜微笑遂以正法眼藏涅槃妙心付嘱摩诃迦叶
- id: guji-释迦牟尼佛-event-death
  title_zh: 拘尸那入涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 拘尸那娑罗双树
  description: 付嘱已大事既毕凝然入寂留金缕袈裟为信开南岳单传六十九代之始
