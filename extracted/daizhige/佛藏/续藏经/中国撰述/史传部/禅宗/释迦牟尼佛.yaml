person:
  qid: guji-释迦牟尼佛
  name_zh: 释迦牟尼佛
  names:
    zh: 释迦牟尼佛
    en: Shakyamuni Buddha
  lifespan:
    birth:
      date: -1029-04-08
      precision: day
      is_circa: true
      raw: 周昭王二十四年甲寅岁四月八日生王宫
    death:
      date: -949-02-15
      precision: day
      is_circa: true
      raw: 穆王五十二年壬申岁二月十五日入涅槃
  birth_date: -1029-04-08
  death_date: -949-02-15
  era: 西周
  reign_ref: 周昭王至周穆王
  archetype: 开教觉者
  dilemmas:
  - 宫廷安乐与老病死苦何去何从
  - 外道禅定苦行与真正解脱如何抉择
  - 住世说法与入灭付嘱如何善终
  lesson: 见老病死而厌离生死，历试邪法而不住邪见，证菩提后转法轮付正法
  summary_first_person: 吾生于刹利王家，父净饭天，年十九游四门见老病死而悲，夜逾城至檀特山修道，学不用处定非非想定皆舍，又经六年麻麦苦行，知非解脱，遂于二月八日明星出时成道，号天人师，于鹿野苑为憍陈如等转四谛法轮，住世说法四十九年，以清净法眼涅槃妙心付摩诃迦叶，嘱以金缕僧伽梨转授补处，后于拘尸那熙连河侧娑罗双树下右胁而灭
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E7%A6%85%E5%AE%97/%E4%BA%94%E7%81%AF%E5%85%A8%E4%B9%A6.html
