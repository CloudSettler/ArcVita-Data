events:
- id: guji-释迦牟尼佛-event-birth
  title_zh: 刹利王家诞生行七步
  date: -1028-04-08
  year_of: -1028
  place: 迦毗罗卫蓝毗尼园
  description: 周昭王二十四年甲寅四月八日生放大智光明地涌金莲捧足东西南北各行七步作师子吼言天上天下唯吾独尊
- id: guji-释迦牟尼佛-event-renunciation
  title_zh: 年十九夜逾城出家
  date: -1010-02-08
  year_of: -1010
  place: 迦毗罗卫王宫至檀特山
  description: 周昭王四十二年二月八日年十九游四门见老病死心怀悲喜夜子时依净居天劝逾城而去往檀特山修道
- id: guji-释迦牟尼佛-event-enlightenment
  title_zh: 明星出时菩提成道
  date: -999-02-08
  year_of: -999
  place: 菩提树下
  description: 周穆王三年癸未二月八日明星出时成道号天人师时年三十先历阿蓝郁头定学及象头山六年苦行皆舍而证菩提
- id: guji-释迦牟尼佛-event-first-sermon
  title_zh: 鹿野苑度五比丘转法轮
  date: -999-06-15
  year_of: -999
  place: 鹿野苑
  description: 成道后于鹿野苑中为憍陈如等五人转四谛法轮而证道果自此说法住世四十九年
- id: guji-释迦牟尼佛-event-transmission
  title_zh: 灵山拈华付法于迦叶
  date: -950-01-01
  year_of: -950
  place: 灵山会及多子塔前
  description: 灵山会上拈华示众唯迦叶破颜微笑遂以正法眼藏涅槃妙心付嘱摩诃迦叶分座令坐以僧伽梨围之命护持流布
- id: guji-释迦牟尼佛-event-nirvana
  title_zh: 拘尸那双树入涅槃
  date: -949-02-15
  year_of: -949
  place: 拘尸那城熙连河侧娑罗双树下
  description: 周穆王五十二年壬申二月十五日右胁累足泊然宴寂说诸行无常偈茶毗得舍利八斛四斗后一千一十七年教至中夏
