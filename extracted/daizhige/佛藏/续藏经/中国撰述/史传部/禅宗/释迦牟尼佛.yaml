    labels:
      zh: 普化人天
    start_date: -998-01-01
    highlight_event_id: guji-释迦牟尼佛-event-first-sermon
  - key: climax
    name: 拈华付嘱迦叶
    labels:
      zh: 以心传心
    start_date: -950-01-01
    highlight_event_id: guji-释迦牟尼佛-event-transmission
  - key: closure
    name: 熙连河侧双树入灭
    labels:
      zh: 娑罗示寂
    start_date: -949-02-15
    highlight_event_id: guji-释迦牟尼佛-event-death
  decisions:
  - date: -950-01-01
    title_zh: 以正法眼藏付迦叶
    rationale: 拈华唯迦叶破颜微笑，可付不立文字教外别传之妙心，令护持不断
  - date: -949-02-15
    title_zh: 右胁累足入涅槃
    rationale: 背痛示无常，说诸行无常偈，留舍利金棺化火，令众生瞻仰取足
events:
- id: guji-释迦牟尼佛-event-birth
  title_zh: 王宫诞生行七步
  date: -1029-04-08
  year_of: -1029
  location_zh: 迦毗罗卫王宫
  summary_zh: 周昭王二十四年甲寅四月八日生，地涌金莲捧足，东西南北各行七步，一手指天一手指地，作狮子吼天上天下唯吾独尊
- id: guji-释迦牟尼佛-event-renunciation
  title_zh: 年十九逾城出家
  date: -1011-02-08
  year_of: -1011
  location_zh: 檀特山
  summary_zh: 周昭王四十二年二月八日，游四门见老病死，夜子时闻净居天人劝请，逾城至檀特山修道
- id: guji-释迦牟尼佛-event-ascetic
  title_zh: 学定苦行六年
  date: -1005-06-01
  year_of: -1005
  location_zh: 阿蓝迦蓝郁头蓝弗处象头山
  summary_zh: 三年学不用处定知非便舍，三年学非非想定知非亦舍，同外道日食麻麦六年，悉摧伏诸外道
- id: guji-释迦牟尼佛-event-enlightenment
  title_zh: 明星出时成道
  date: -999-02-08
  year_of: -999
  location_zh: 菩提树下
  summary_zh: 穆王三年癸未岁二月八日明星出时成道，号天人师，时年三十
- id: guji-释迦牟尼佛-event-first-sermon
  title_zh: 鹿野苑转四谛法轮
  date: -999-06-01
  year_of: -999
  location_zh: 鹿野苑
  summary_zh: 为憍陈如等五人转四谛法轮而证道果，始建僧团，说法住世四十九年
- id: guji-释迦牟尼佛-event-transmission
  title_zh: 灵山拈华付迦叶
  date: -950-01-01
  year_of: -950
  location_zh: 灵山会多子塔前
  summary_zh: 拈华示众唯迦叶破颜微笑，付正法眼藏涅槃妙心实相无相微妙法门，分座以僧伽梨围之，嘱传补处慈氏
- id: guji-释迦牟尼佛-event-death
  title_zh: 双树下入般涅槃
  date: -949-02-15
  year_of: -949
  location_zh: 拘尸那城熙连河侧娑罗双树下
  summary_zh: 穆王五十二年壬申二月十五日，告众善观紫磨金色身，说诸行无常偈，右胁累足宴寂，从棺起为母说法示双足，金棺化火三昧得舍利八斛四斗
