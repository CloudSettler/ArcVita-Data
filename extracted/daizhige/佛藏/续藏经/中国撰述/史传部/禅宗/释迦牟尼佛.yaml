    title_zh: 见老病死而逾城出家
    rationale: 了知生老病死终可厌离不欲安居王位故依净居天劝往檀特山修道
  - date: -1007-01-01
    title_zh: 舍无想定及非非想定另求正道
    rationale: 于阿蓝迦蓝处学不用处定三年于郁头蓝弗处学非非想定三年皆知非究竟故舍去
  - date: -999-02-08
    title_zh: 捨苦行于明星出时成道
    rationale: 日食麻麦六年知苦行非因以无心意无受行摧伏外道而证菩提号天人师
