    rationale: 不立文字教外别传唯证者相应故以正法眼藏密付护持
  - date: -0950-01-01
    title_zh: 传金缕僧伽黎及偈
    rationale: 为转授补处慈氏敕阿难副贰传化使法脉不断绝
events:
- id: guji-释迦牟尼佛-event-birth
  date: -1027-04-08
  title_zh: 摩耶右胁降诞
  description_zh: 周昭王二十四年甲寅四月初八日自摩耶右胁诞生放大光明地涌金莲周行七步指天指地称天上天下惟吾独尊
- id: guji-释迦牟尼佛-event-renunciation
  date: -1008-02-08
  title_zh: 年十九逾城出家
  description_zh: 年十九二月八日夜感净居天人劝请超城而去入檀特山修道先学不用处定非非想定知非皆舍
- id: guji-释迦牟尼佛-event-enlightenment
  date: -0997-02-08
  title_zh: 菩提树下成等正觉
  description_zh: 受牧女乳糜诣毕钵树下以指按地降伏天魔于穆王三年癸未二月初八明星出时廓然大悟叹众生皆具如来智慧德相时年三十
- id: guji-释迦牟尼佛-event-flower
  date: -0960-01-01
  title_zh: 灵山拈花微笑付嘱
  description_zh: 灵山会上拈花示众众默然唯迦叶破颜微笑遂以正法眼藏涅槃妙心实相无相微妙法门付嘱摩诃迦叶
- id: guji-释迦牟尼佛-event-transmission
  date: -0950-01-01
  title_zh: 多子塔前分座传衣
  description_zh: 命迦叶分座以僧伽黎围之告以护持并敕阿难副贰传化说偈法本法无法传金缕僧伽黎衣转授补处慈氏
- id: guji-释迦牟尼佛-event-death
  date: -0947-02-15
  title_zh: 八十岁入般涅槃
  description_zh: 住世说法四十九年已卒云未尝说一字寿八十示现入灭令衣法相承流布震旦
