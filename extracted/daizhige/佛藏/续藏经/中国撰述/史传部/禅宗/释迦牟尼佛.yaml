  - date: -1005-01-01
    title_zh: 舍苦行至菩提树下
    rationale: 日食麻麦六年知非正因，以无心意摧伏外道，发心趣菩提
- id: guji-释迦牟尼佛-endeavor-2
  title_zh: 住世说法付嘱入灭
  summary_zh: 成道后说法四十九年，付正法眼藏于迦叶，于双树下示灭
  phases:
  - key: brewing
