  reign_ref: 哲宗元祐至徽宗崇宁
  archetype: 文士参禅居士
  dilemmas:
  - 文章名重与究明本心如何兼顾
  - 谪居困厄与道心安乐如何相持
  lesson: 文章乃一小技，悟彻本心方为大道，谪厄即是道场。
  summary_first_person: 我黄庭坚字鲁直，元祐丁艰馆于黄龙，从晦堂究无隐之旨，因木犀香而领解，谪黔南道中昼卧廓然而悟，方知平生被天下老和尚瞒，唯死心不肯相瞒，乃是第一相为。
