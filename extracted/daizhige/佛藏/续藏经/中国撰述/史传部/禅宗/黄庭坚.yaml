    title_zh: 再三诠释无隐语
    rationale: 欲以文义解禅，虽忤师意亦直陈己见，以求决择印可
  - date: 1087-10-01
    title_zh: 因香返闻信受师指
    rationale: 秋香满院现前即信无隐之旨，不再滞于言说诠释
- id: guji-黄庭坚-endeavor-2
  title_zh: 谪黔南悟道弘宗
  summary: 谪官黔州道中昼卧廓悟，书述本心，复与灵源死心偈书酬唱，以文章发挥宗乘。
  phases:
  - key: brewing
