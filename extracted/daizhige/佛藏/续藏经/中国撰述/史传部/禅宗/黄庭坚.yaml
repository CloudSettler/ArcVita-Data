  decisions:
  - date: 1095-05-01
    title_zh: 直认平生被瞒独许死心
    rationale: 廓悟之后反观疑情不断命根不断之病，诚服死心苦口提撕为第一相为
  - date: 1097
    title_zh: 以诗偈发挥化女主宾旨
    rationale: 以文章主盟之长酬灵源见寄，显东西南北难藏之活路，接引后学
events:
- id: guji-黄庭坚-event-birth
  title_zh: 出生洪州分宁
  date: 1045
  year_of: 1045
  description: 庆历五年出生洪州分宁，少以文章名世，后为文坛主盟
- id: guji-黄庭坚-event-huanglong
  title_zh: 丁艰馆黄龙从晦堂游
  date: 1086
  year_of: 1086
  description: 元祐间丁家艰，馆黄龙山，从晦堂和尚游，尤与死心新老灵源清老笃方外契
- id: guji-黄庭坚-event-muxi
  title_zh: 闻木犀香领解无隐
  date: 1087-10-01
  year_of: 1087
  description: 晦堂举孔子无隐语相诘，值暑退凉生秋香满院，因闻木犀香而欣然领解吾无隐乎尔之旨
- id: guji-黄庭坚-event-qianzhou
  title_zh: 谪黔州道中昼卧廓悟
  date: 1095-05-01
  year_of: 1095
  description: 谪官黔州道中昼卧觉来忽然廓尔，追思平生被天下老和尚瞒了多少，唯死心不肯相瞒
- id: guji-黄庭坚-event-chouchang
  title_zh: 与灵源偈书酬唱
  date: 1097
  year_of: 1097
  description: 在黔南致书死心自述悟境，灵源以偈见寄，乃和以石工来斫鼻端尘一首，发挥主宾化女之旨
- id: guji-黄庭坚-event-death
  title_zh: 卒于宜州谪所
  date: 1105
  year_of: 1105
  description: 崇宁四年卒于宜州，世谓其以文章小技锐意斯道，于黔南机感相应，书偈并传
