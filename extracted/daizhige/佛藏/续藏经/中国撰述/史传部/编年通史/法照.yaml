  date: 1272-08-15
  year_of: 1272
  place_zh: 天岩塔院
  description_zh: 秋示疾移归塔院却药屏医作文自祭中秋夕书偈仙寿八十我多九年掷笔端坐而逝寿八十九腊七十四谥普通塔曰慈应
