  dilemmas:
  - title_zh: 儒释相非如何会通
    description_zh: 儒者讥佛为异端，道流与释子互争胜负，我当考典据以折衷，明儒佛相表里而广天下以善
  - title_zh: 千载散事如何统贯
    description_zh: 自汉永平至宋事涉两千年，传志浩繁真伪杂糅，我当以编年系年，以通论断义，去取之间甚难
  lesson: 以编年考信，以通论明心，不随毁誉而移，儒佛同归于善
  summary_first_person: 我是隆兴府石室沙门祖琇，感汉明感梦以来圣教东被，儒释是非纷然，故考群书编年系事，每事附论以通之，愿后人知佛法与王化相扶而不惑
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E5%8F%B2%E4%BC%A0%E9%83%A8/%E7%BC%96%E5%B9%B4%E9%80%9A%E5%8F%B2/%E9%9A%86%E5%85%B4%E7%BC%96%E5%B9%B4%E9%80%9A%E8%AE%BA.html
