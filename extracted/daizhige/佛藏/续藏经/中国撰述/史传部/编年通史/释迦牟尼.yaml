  - 默然入灭与弘法利生之抉择
  lesson: 以出离心证菩提，以慈悲心转法轮，悟后起行方为释门正统
  summary_first_person: 我本迦维卫太子悉达多，见老病死而逾城出家，参仙习定，六年苦行，降魔成道，鹿苑说法，行化十六大国，制戒摄僧，唯愿众生离苦
