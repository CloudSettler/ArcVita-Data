    title_zh: 舍太子位出家学道
    rationale: 见生老病死之苦，欲炼精神求解脱，故释累辞家修净行
  - date: -0658-01-01
    title_zh: 降伏外道坚持苦行终至觉悟
    rationale: 外道以变幻嬲恼乱心而不能得，遂精进彻悟一切种智谓之佛
