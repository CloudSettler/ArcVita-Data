    highlight_event_id: guji-释迦牟尼-event-death
  decisions:
  - date: -0657-01-01
    title_zh: 随机说大小乘三乘之法
    rationale: 以人之性识根业各差，故设四谛十二因缘六度以乘运至道
  - date: -0609-02-15
    title_zh: 以灭度示无迁谢留影迹舍利
    rationale: 明佛生非实生灭非实灭，留骨舍利建塔供养以系后世信心
events:
