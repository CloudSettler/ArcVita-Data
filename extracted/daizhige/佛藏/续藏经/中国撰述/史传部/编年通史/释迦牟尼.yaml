    rationale: 因须提那犯淫等缘，僧团渐广，为久住世间故制二百五十戒等广律
events:
- id: guji-释迦牟尼-event-birth
  title_zh: 蓝毗园诞生
  date: -1027-04-08
  year_of: -1027
  place_zh: 中天竺迦维卫国蓝毗园无忧树下
  description_zh: 摩耶夫人游园举手折花，太子悉达多从右胁降生，九龙灌沐，行七步称天上天下唯吾独尊
- id: guji-释迦牟尼-event-renunciation
  title_zh: 逾城出家
  date: -1009-02-15
  year_of: -1009
  place_zh: 迦维卫宫城至雪山跋陀仙人苦行林
  description_zh: 十九岁二月十五夜乘天马逾城，至雪山落发贸易袈裟，从阿蓝迦兰等习定
- id: guji-释迦牟尼-event-enlightenment
  title_zh: 菩提道场成正觉
  date: -0997-02-08
  year_of: -997
  place_zh: 摩竭国菩提道场尼连禅河侧
  description_zh: 三十一岁穆王五年甲申二月七夜降魔军，八日明星出豁然大悟号世尊
- id: guji-释迦牟尼-event-first-sermon
  title_zh: 鹿苑初转四谛法轮
  date: -0996-02-08
  year_of: -996
  place_zh: 波罗奈鹿野苑
  description_zh: 为憍陈如等五比丘三转四谛，一呼善来得具足戒，未几证阿罗汉，四众渐具
- id: guji-释迦牟尼-event-death
  title_zh: 鹤林入灭
  date: -0948-02-15
  year_of: -948
  place_zh: 拘尸那鹤林
  description_zh: 说法度生凡数十年，制戒付嘱迦叶阿难等，示现入灭，正法付嘱后世
