  date: -0688-04-08
  year_of: -688
  place_zh: 天竺迦维卫国
  type: birth
  description_zh: 周庄王九年四月八日夜自母右胁而生，姿貌奇异具三十二相八十二好，天降嘉瑞，春秋鲁庄公七年夏四月恒星不见夜明是也
- id: guji-释迦牟尼-event-renunciation
  person_id: guji-释迦牟尼
  title_zh: 舍太子位出家学道
  date: -0659-01-01
  year_of: -659
  place_zh: 天竺
  type: career
  description_zh: 舍太子位出家，勤行精进，群邪外道事水火毒龙善变幻者并来嬲恼而不能乱其心
- id: guji-释迦牟尼-event-enlightenment
  person_id: guji-释迦牟尼
  title_zh: 年三十觉悟成佛
  date: -0658-01-01
  year_of: -658
  place_zh: 天竺菩提道场
  type: career
  description_zh: 年三十觉悟一切种智谓之佛，亦曰佛陀浮屠，华言净觉，尽伏外道并为弟子，立僧尼优婆塞夷之制
- id: guji-释迦牟尼-event-teaching
  person_id: guji-释迦牟尼
  title_zh: 说法教化四十九年
  date: -0657-01-01
  year_of: -657
  place_zh: 拘萨罗国摩竭提国等
  type: career
  description_zh: 在世教化四十九年，天龙人鬼并来听法，弟子得道以百千万亿数，说正像末法及四果菩萨之次第
- id: guji-释迦牟尼-event-death
  person_id: guji-释迦牟尼
  title_zh: 拘尸那城入般涅盘
  date: -0609-02-15
  year_of: -609
  place_zh: 拘尸那城娑罗双树间
  type: death
  description_zh: 以二月十五日入般涅盘，香木焚尸灵骨分碎为舍利，弟子大迦叶阿难等五百人结集三藏十二部经，后阿育王分舍利造八万四千塔
