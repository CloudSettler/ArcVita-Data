person:
  qid: guji-天息灾
  name_zh: 天息灾
  names:
    zh: 天息灾
    en: Tian Xizai
  lifespan:
    birth:
      date: 0950
      precision: century
      is_circa: true
      raw: 北天竺迦湿弥罗国人，生年不详，约十世纪中叶生
    death:
      date: 1000-08
      precision: month
      is_circa: false
      raw: 宋真宗咸平三年八月示寂
  birth_date: 0950
  death_date: 1000-08
  era: 宋
  reign_ref: 宋太宗太平兴国至宋真宗咸平
  archetype: 译经三藏
  dilemmas:
  - 梵汉悬隔而圣旨督责新译，如何兼顾信达以取信于义学之众
  - 译场久废而供亿浩繁屡遭朝议裁省，如何维持传译长久不辍
  lesson: 以戒定为体，以翻译为用，持律精严方能荷担圣教，广搜梵本与慎定华言并重乃可利济群生
  summary_first_person: 吾本北天竺迦湿弥罗国僧，慕华夏弘法之盛，太平兴国中抵京师，得太宗建译经传法院见委，与法天施护同膺译主，赐号明教大师，亲定译经仪式，进圣佛母经诸部，蒙制序褒扬，终老于译席，愿以贝叶真诠续人天慧命
  source_urls:
  - https://daizhige.org/fozang/xuzangjing/zhongguogaoxuan/shizhuanbu/zhuzongtongchuan/buxugaosengchuan.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/fozang/xuzangjing/zhongguogaoxuan/shizhuanbu/zhuzongtongchuan/buxugaosengchuan.md
endeavors:
- id: guji-天息灾-endeavor-1
  title_zh: 主持太平兴国译经传法院译经
  summary_zh: 应诏入译经传法院为译主，率众翻译密教显教圣典，每岁诞节进献新经，付藏颁行
  phases:
  - key: brewing
    name: 自西域携梵本来华
    labels:
      zh: 蕴蓄西来
    start_date: 0976
    highlight_event_id: guji-天息灾-event-arrive
  - key: breakthrough
    name: 召见称旨赐居传法院
    labels:
      zh: 得旨建院
    start_date: 0977
    highlight_event_id: guji-天息灾-event-confer
  - key: climax
    name: 岁进新经御制序冠首
    labels:
      zh: 译经鼎盛
    start_date: 0983
    highlight_event_id: guji-天息灾-event-present
  - key: closure
    name: 真宗嗣位力保译院不废
    labels:
      zh: 守成护法
    start_date: 0998
    highlight_event_id: guji-天息灾-event-protect
  decisions:
  - date: 0977
    title_zh: 请定译经仪式与避讳之法
    rationale: 为正译场体例，上仪式并请御名庙讳不须回避，以免回护妨经旨，获诏许从正文
  - date: 0983
    title_zh: 先翻梵义再以华文证义
    rationale: 面对两街义学详定之难，持梵文先出梵义后参华文，使详定诸僧心服，确保新经流通
- id: guji-天息灾-endeavor-2
  title_zh: 辨伪卫教与肃清邪伪经本
  summary_zh: 详定于阗所进大乘祝藏经，奏其非梵文且文义不正，请焚弃以绝后惑，得旨施行
  phases:
  - key: brewing
    name: 西国有进祝藏经本
    labels:
      zh: 献经待验
    start_date: 0980
    highlight_event_id: guji-天息灾-event-present
  - key: breakthrough
    name: 奉诏详定书体源流
    labels:
      zh: 考验真伪
    start_date: 0981
    highlight_event_id: guji-天息灾-event-examine
  - key: climax
    name: 面奏六十五处文义不正
    labels:
      zh: 正言辨伪
    start_date: 0981
    highlight_event_id: guji-天息灾-event-examine
  - key: closure
    name: 诏焚伪本以崇佛教
    labels:
      zh: 焚伪存真
    start_date: 0982
    highlight_event_id: guji-天息灾-event-examine
  decisions:
  - date: 0981
    title_zh: 直奏祝藏经非梵文请焚弃
    rationale: 明辨于阗书体与梵文之别，察无请问听众与多处舛谬，若使邪伪得行则害法，故宁忤献经者以卫圣教
  - date: 0998
    title_zh: 从法贤请存太宗真宗御序
    rationale: 以两朝圣制冠新译之首，借王法护持佛法，使译院久费供亿之议不得行，保慧命长续
events:
- id: guji-天息灾-event-birth
  title_zh: 生于北天竺迦湿弥罗国
  date: 0950
  year_of: 950
  place_zh: 北天竺迦湿弥罗国
  description: 家世不详，妙解五明，深入三藏，久怀东来弘法之志
- id: guji-天息灾-event-arrive
  title_zh: 太平兴国中抵京师献梵策
  date: 0977
  year_of: 977
  place_zh: 东京开封府
  description: 与乌填曩国施护等至京师，值朝廷集置梵策锐意翻传，诏建太平兴国寺西译经传法院以待
- id: guji-天息灾-event-confer
  title_zh: 对扬称旨赐号明教大师
  date: 0977
  year_of: 977
  place_zh: 译经传法院
  description: 与法天施护同召见问佛法大意，赐紫方袍并居传法院，赐号明教大师，诏以所将梵本各译一经，命法进等笔受缀文润文监护
- id: guji-天息灾-event-present
  title_zh: 上圣佛母经授朝散大夫
  date: 0978
  year_of: 978
  place_zh: 译经传法院
  description: 未逾月译成上圣佛母经一卷进上，深得翻译之体，诏除朝散大夫试光禄卿，月给酥酪钱，太宗亲制三藏圣教序冠新译之首
- id: guji-天息灾-event-examine
  title_zh: 详定祝藏经奏请焚伪本
  date: 0981
  year_of: 981
  place_zh: 译经传法院
  description: 奉诏详定西国所进大乘祝藏经，奏为于阗书体非梵文，前后六十五处文义不正，帝纳言下诏焚弃以绝后惑
- id: guji-天息灾-event-protect
  title_zh: 真宗即位译院得存
  date: 0998
  year_of: 998
  place_zh: 东京开封府
  description: 礼部侍郎以译院久费供亿为言，真宗不听，从请以先帝御序置后并续制序文，传译岁进不辍
- id: guji-天息灾-event-death
  title_zh: 咸平三年八月示寂
  date: 1000-08
  year_of: 1000
  place_zh: 译经传法院
  description: 示寂于译席，毕生所译及所定仪式并御序冠藏，时人谓芳猷重启，续人天圣教
