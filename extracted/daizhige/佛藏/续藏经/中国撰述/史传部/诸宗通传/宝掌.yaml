    start_date: 0657-01-01
    highlight_event_id: guji-宝掌-event-death
  - key: closure
    name: 遗骨金锁建塔供奉
    labels:
      zh: 舍利传灯
    start_date: 0657-01-09
    highlight_event_id: guji-宝掌-event-death
  decisions:
  - date: 417
    title_zh: 游历将遍还归竺峰
    rationale: 诸方胜地游历已周，还守初心之地以待缘终，不作无止漂泊
  - date: 0657-01-01
    title_zh: 手捏遗像自定化期
    rationale: 誓住千岁数将满足，以九日塑像留形为证，晓告门徒，端坐示寂
events:
- id: guji-宝掌-event-birth
  title_zh: 丁卯诞生掌含明珠
  date: 约-0414
  year_of: -414
  place_zh: 中天竺
  description_zh: 周威烈王十二年丁卯生，左手握拳，掌有明珠，因名宝掌，自云后住世千岁
- id: guji-宝掌-event-meet-damo
  title_zh: 梁朝建邺遇达磨扣法
  date: 336
  year_of: 520
  place_zh: 建邺
  description_zh: 魏晋间东游，抵峨嵋五台，南返衡庐，入建邺，与达磨遇于梁朝，遂扣法得印
- id: guji-宝掌-event-settle-tianzhu
  title_zh: 爱天竺胜结茅四十五年
  date: 0595
  year_of: 595
  place_zh: 杭州中天竺
  description_zh: 来游二浙，爱天竺之胜，结茅而居四十五年，为中竺开山之始
- id: guji-宝掌-event-return-tianzhu
  title_zh: 贞观十五年还竺峰移宝岩
  date: 417
  year_of: 641
  place_zh: 天竺峰浦江宝岩
  description_zh: 复往四明天台及诸名山游历将遍，唐贞观十五年还竺峰，久之移居浦江宝岩以终老
- id: guji-宝掌-event-death
  title_zh: 显庆二年捏像说偈而化
  date: 0657-01-09
  year_of: 657
  place_zh: 浦江宝岩
  description_zh: 显庆二年正旦手捏一像九日而成貌无异，告众言自来支那忽四百岁并前已过七十有二年誓满千岁，说偈而化，世称千岁和尚，遗骨连锁金色，别建塔藏，为中竺开山始祖
