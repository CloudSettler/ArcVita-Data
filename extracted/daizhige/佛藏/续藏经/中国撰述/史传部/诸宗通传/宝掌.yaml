  decisions:
  - date: 336
    title_zh: 梁朝谒达磨扣法
    rationale: 不滞名山形迹，直扣心印本源，故遇达磨即参请以决大事
  - date: 0595
    title_zh: 结茅中天竺四十五年
    rationale: 爱其山水清胜堪为法窟，誓久住以接引二浙学人，不复他往
- id: guji-宝掌-endeavor-2
  title_zh: 誓满千岁示化宝岩
  summary_zh: 游历四明天台诸山既遍，还归竺峰，晚移浦江宝岩，自塑遗像，预记千岁期限，说偈而化，遗骨连锁金色，建塔藏奉
  phases:
