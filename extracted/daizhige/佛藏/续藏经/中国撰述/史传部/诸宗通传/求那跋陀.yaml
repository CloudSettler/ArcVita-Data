    rationale: 以名义宣当以义济，兴兵犯顺必败，不容扈从以全戒律
  - date: '0455'
    title_zh: 梁山败后一心称观世音投江
    rationale: 火榄逼岸无济理，唯凭三宝慈力，手捉邛杖投身得童子牵救
events:
- id: guji-求那跋陀-event-birth
  title_zh: 生于中天竺习五明入大乘
  date: 0394
  year_of: 394
  place_zh: 中天竺
  description_zh: 少传五明，天文书算医方咒术多所究竟，偏习方等，遁游师子国依师入道，号摩诃乘，暗室探得华严大品，劝父母归正
- id: guji-求那跋陀-event-arrival
  title_zh: 元嘉十二年泛海至广州迎入京
  date: '0435'
  year_of: 435
  place_zh: 广州云峰山至建康祇洹寺
  description_zh: 春至广州憩云峰立寺，刺史表闻，文帝遣迎，冬至京师勅住祇洹，入宫传译，颜延之束带诣门，彭城谯王义宣师事
- id: guji-求那跋陀-event-translation
  title_zh: 祇洹东安道场译经七十三卷
  date: '0436'
  year_of: 436
  place_zh: 建康祇洹寺东安寺道场寺
  description_zh: 初出杂阿含五十卷，又出法鼓相续解脱第一义五相略，舟杨译胜鬘，道场出央掘楞伽，众七百余人，宝云传译惠观执笔
- id: guji-求那跋陀-event-jingzhou
  title_zh: 随谯王镇荆州讲华严续译十三部
  date: '0446'
  year_of: 446
  place_zh: 荆州辛寺
  description_zh: 元嘉二十三年随义宣至荆，安憩辛寺立殿房，出无忧王八吉祥因果无量寿泥洹等十三部，礼忏感梦白衣持剑，遂通汉语，就讲华严，法勇传译僧念都讲
- id: guji-求那跋陀-event-liangshan
  title_zh: 谏阻无效梁山投江蒙观音救
  date: '0455'
  year_of: 455
  place_zh: 江州至梁山江中
  description_zh: 孝建初义宣谋逆，流涕谏以义济不克，被逼俱下，过江洲答军容如聚墨，梁山败投江称观世音，水裁至膝，童子牵行十余步得岸，脱纳衣谢不见人，王玄谟得之驿送还都，孝武引见慰遇
- id: guji-求那跋陀-event-rain
  title_zh: 中兴起寺凤凰楼驱神祈雨感应
  date: '0463'
  year_of: 463
  place_zh: 建康中兴寺秣陵凤凰楼西北湖钓台
  description_zh: 勅移中兴开三间房，起寺凤凰楼西，夜半推户厌梦，咒愿护寺善神居去，众梦鬼神荷担移去，大明七年亢旱，往北湖钓台烧香诵经秘咒，次日云起降雨，公卿入贺，蔬食执炉终身
- id: guji-求那跋陀-event-death
  title_zh: 泰始四年示寂建康
  date: 0468
  year_of: 468
  place_zh: 建康
  description_zh: 垂四十年蒙天恩隆遇，年七十老病，以译讲祈祷功德终，时人敬为摩诃乘功德贤
