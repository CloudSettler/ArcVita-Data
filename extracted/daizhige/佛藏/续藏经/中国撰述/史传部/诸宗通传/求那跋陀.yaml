    en: Gunabhadra
  lifespan:
    birth:
      date: 0394
      precision: year
      is_circa: true
      raw: 约晋安帝义熙十年生于中天竺
    death:
      date: 0468
      precision: year
      is_circa: false
      raw: 宋明帝泰始四年示寂于建康
  birth_date: 0394
  death_date: 0468
  era: 南北朝刘宋
  reign_ref: 宋文帝元嘉至宋明帝泰始
  archetype: 译经弘法型高僧
  dilemmas:
  - 奉父母命而舍外道习大乘，如何兼顾孝亲与归正
  - 身寄谯王义宣幕府十年，遇其谋逆犯顺，如何守不预戎事而全义全法
  lesson: 以戒定为舟，以慈悲为楫，虽蹈大难，唯念观音，终以译经弘道报国恩
  summary_first_person: 吾本中天竺人，少习五明，偏尚方等，遁游师子国而入大乘。元嘉十二年泛海至广州，蒙宋文帝迎住祇洹，译杂阿含楞伽胜鬘等十三部七十三卷。随谯王镇荆州十年，讲华严，历梁山之难，蒙观音神力得脱。后住中兴，起寺凤凰楼西，祈雨北湖有验，蔬食执炉终身。
  source_urls:
