    start_date: -0998-06-01
    highlight_event_id: guji-释迦如来-event-chujia
  decisions:
  - date: -1000-03-01
    title_zh: 见老病死决意出家
    rationale: 睹生老病死无常，唯沙门寂静可乐，立志修学解脱
  - date: -0999-02-08
    title_zh: 落发贸衣逾城而去
    rationale: 为统御大千摄化众生出长夜，不取转轮圣王七宝，自落绀发换坏色衣
- id: guji-释迦如来-endeavor-2
  title_zh: 降魔成道示现正觉
  description: 食麻麦而悟中道，受乳糜草座，坐金刚座降魔成佛
  phases:
  - key: brewing
    name: 六年苦行试中边
    labels:
      zh: 苦行
    start_date: -0998-06-01
    highlight_event_id: guji-释迦如来-event-chujia
  - key: breakthrough
    name: 悟琴弦中道受乳糜
    labels:
      zh: 中道
    start_date: -0994-01-01
    highlight_event_id: guji-释迦如来-event-chengdao
  - key: climax
    name: 菩提树下降魔
    labels:
      zh: 降魔
    start_date: -0993-12-08
    highlight_event_id: guji-释迦如来-event-chengdao
  - key: closure
    name: 成等正觉具不共德
    labels:
      zh: 成道
    start_date: -0993-12-08
    highlight_event_id: guji-释迦如来-event-chengdao
  decisions:
  - date: -0994-01-01
    title_zh: 舍苦乐行取中道
    rationale: 喻如瑶琴弦太急则疲太缓则怠，唯中则曲成，佛果亦假中而满
  - date: -0993-12-08
    title_zh: 登金刚座誓不成不起
    rationale: 以最后胜体诣菩提场，圆解脱深因，具一百四十不共功德以超十地
events:
- id: guji-释迦如来-event-birth
  title_zh: 蓝毗尼园诞生
  date: -1028-04-08
  year_of: -1028
  place_zh: 迦毗罗国蓝毗尼园无忧树下
  description: 摩耶夫人攀无忧树枝，太子从右胁生，四方各行七步，九龙沐身，作师子吼
- id: guji-释迦如来-event-simen
  title_zh: 四门游观厌离
  date: -1000-03-01
  year_of: -1000
  place_zh: 迦毗罗城东西南北四门
  description: 依次见老人病人死人与沙门，感生老病死苦，喜沙门寂静，决意出家
- id: guji-释迦如来-event-chujia
  title_zh: 夜半逾城出家
  date: -0999-02-08
  year_of: -999
  place_zh: 迦毗罗城至雪山苦行林
  description: 二月八日夜半，车匿奉马，天人捧持，四天王卫，逾城八百里，落发贸衣为沙门
- id: guji-释迦如来-event-chengdao
  title_zh: 菩提树下降魔成道
  date: -0993-12-08
  year_of: -993
  place_zh: 摩竭国菩提道场金刚座
  description: 受难陀乳糜吉祥茆草，坐金刚座，以慈刀慑魔军，证解脱深因，具不共功德成正觉
- id: guji-释迦如来-event-death
  title_zh: 娑罗林下般涅槃
  date: -0948-02-15
  year_of: -948
  place_zh: 娑罗林
  description: 化缘既毕，示现八相最后一相，舍应身而归常住，令众生知无常而勤精进
