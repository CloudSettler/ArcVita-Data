- id: guji-德清-endeavor-1
  title_zh: 提挈华严纲要疏通清凉
  summary: 游心清凉疏钞，断义分文，提纲挈要，不三年而全经大旨昭然，并补疏义未发，以导学者入经见性。
  phases:
  - key: brewing
