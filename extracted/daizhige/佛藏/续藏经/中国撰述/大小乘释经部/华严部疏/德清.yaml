  birth_date: 1546
  death_date: 1623
  era: 明
  reign_ref: 明万历至天启
  archetype: 弘宗疏经的高僧导师
  dilemmas:
  - 时流轻古疏而尚简易口语，我当如何护持大经正解
  - 清凉疏钞浩瀚难入，学者望涯而返，我当如何提纲挈要令人得入
  lesson: 痛惜时蔽而提纲挈要，以纲要导疏钞，以疏钞入经，以经见性，方不负法界缘起。
  summary_first_person: 我是德清，世称憨山，痛见末流厌繁鄙教，不闻华严疏义，故游心清凉疏钞，不三年而提挈纲要成书，欲令学者因纲入疏，因疏入经，因经见性，临示寂于曹溪而以此付后。
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/大小乘释经部/华严部疏/华严纲.html
