  - key: breakthrough
    name: 断义分文提纲挈要
    labels:
      zh: 突破
    start_date: 1621
    highlight_event_id: guji-德清-event-huayan
  - key: climax
    name: 三年成书补发幽旨
    labels:
      zh: 高潮
    start_date: 1622
    highlight_event_id: guji-德清-event-huayan
  - key: closure
    name: 手泽付嘱新安刊刻
    labels:
      zh: 收束
    start_date: 1623
    highlight_event_id: guji-德清-event-publish
  decisions:
  - date: 1621
    title_zh: 立意提纲挈要以导疏钞
    rationale: 见疏钞湮没，学者厌繁，故不复繁疏，但收群诠于指掌，窥法界于毫端。
  - date: 1622
    title_zh: 补出清凉疏有未发之义
    rationale: 即一座而疏有未发，复为补出，使一性圆明，百无覆盖，令狭劣之习渐远，广大之境愈深。
- id: guji-德清-endeavor-2
  title_zh: 雨法海内住持曹溪传灯
  summary: 往来南北说法，著述殷盛，晚应请赴曹溪，示寂于彼，遗书由法属募刻流通。
  phases:
  - key: brewing
    name: 南北游方雨法海内
    labels:
      zh: 酝酿
    start_date: 1580
    highlight_event_id: guji-德清-event-caoqi
  - key: breakthrough
    name: 名山通都说法化众
    labels:
      zh: 突破
    start_date: 1600
    highlight_event_id: guji-德清-event-caoqi
  - key: climax
    name: 应请赴曹溪急成大法
    labels:
      zh: 高潮
    start_date: 1622
    highlight_event_id: guji-德清-event-caoqi
  - key: closure
    name: 示寂曹溪遗书传后
    labels:
      zh: 收束
    start_date: 1623
    highlight_event_id: guji-德清-event-death
  decisions:
  - date: 1622
    title_zh: 应曹溪之请而行
    rationale: 正提挈阁笔之日，适曹溪坚请，义不能辞，故行为彼应，以了法界大愿。
  - date: 1623
    title_zh: 知世缘将尽急成此书
    rationale: 佛命师命众生命端在此中，故早夜跄跄，急成纲要，以付法属新安刊刻。
events:
- id: guji-德清-event-birth
  date: 1546
  year_of: 1546
  title_zh: 诞生
  description: 明嘉靖二十五年诞生，即后之憨山沙门德清。
- id: guji-德清-event-huayan
  date: 1622
  year_of: 1622
  title_zh: 提挈华严纲要成稿
  description: 注意大经，游心古疏，提纲挈要，断义分文，不三年而全经大旨首尾昭然，并补清凉未发。
- id: guji-德清-event-caoqi
  date: 1623
  year_of: 1623
  title_zh: 赴曹溪说法付嘱
  description: 应曹溪之请赴彼说法，知世缘将尽，早夜成书，以手泽付嘱门人。
- id: guji-德清-event-death
  date: 1623
  year_of: 1623
  title_zh: 示寂于曹溪
  description: 先师示寂曹溪，纲要起止公案遂成缺典，付法属竭力募刻。
- id: guji-德清-event-publish
  date: 1637
  year_of: 1637
  title_zh: 新安刊刻纲要序成
  description: 崇祯丁丑岁，益公法属竭力募刻，新安剞劂告成，门人观衡于五乳峰法云禅寺题序，广流通布。
