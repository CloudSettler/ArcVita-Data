  date: 0757-03-28
  year_of: 757
  location_zh: 神福山逝多兰若
  description_zh: 三月二十八日报龄九十六端俨坐化，白鹤哀唳二鹿连叫，累石为坟於大山之阴，後广超道光流布二论於并汾燕赵
