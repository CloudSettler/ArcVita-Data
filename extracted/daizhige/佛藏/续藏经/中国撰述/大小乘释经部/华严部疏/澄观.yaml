    title_zh: 居清凉山专弘华严
    rationale: 以华藏法界普周而须有化本，故据清凉胜境总摄徒众，令教观并阐
  - date: 0830
    title_zh: 以利今后劝发见闻
    rationale: 悯未来众生未闻大法，故力劝诵持信解，令食少金刚终成正觉，广利无边
events:
- id: guji-澄观-event-birth
  title_zh: 诞生会稽
  date: 0738
  year_of: 0738
  description: 唐开元二十六年诞生於越州会稽，俗姓夏侯，幼而聪慧，夙植善根
- id: guji-澄观-event-study
  title_zh: 出家研学华严
  date: '0757'
  year_of: '0757'
  description: 出家受具，遍习律教禅观，深契华严法界缘起，立志疏解大经以济后学
- id: guji-澄观-event-shu
  title_zh: 奉诏造华严经疏
  date: 0784
  year_of: 0784
  description: 应唐德宗诏入京，造大方广佛华严经疏，立十门总启，详明教起因缘时处主伴，以法界无尽身云为说法之主
- id: guji-澄观-event-qingliang
  title_zh: 住清凉山弘化讲演
  date: 0798
  year_of: 0798
  description: 住五台清凉山，敷演华严疏钞，阐果德地位胜行真法，历代宗奉为清凉国师，宗风大振
- id: guji-澄观-event-death
  title_zh: 示寂入灭
  date: 0839
  year_of: 0839
  description: 唐文宗开成四年示寂，世寿一百有二，遗疏钞盛行於世，后经宋晋水净源录疏注经为华严经疏注流通
