events:
- id: guji-澄观-event-birth
  date: 0738
  year_of: 738
  title_zh: 开元戊寅生于会稽
  description: 俗姓夏侯，越州会稽人，法号澄观，字大体，童戏聚沙建塔
- id: guji-澄观-event-ordination
  date: 0748
  year_of: 748
  title_zh: 天宝戊子出家受具
  description: 九岁礼宝林寺体真为师，十一奉恩得度，具戒后讲律藏，复授菩萨戒立十誓，参无名印可
- id: guji-澄观-event-dwelling
  date: 0780
  year_of: 780
  title_zh: 栖托五台大华严寺
  description: 依东京大诜和尚听受玄旨，再周能演，委命五千里栖圣境十稔，却览诗礼竺梵诸学
- id: guji-澄观-event-composing
  date: 0784
  year_of: 784
  title_zh: 兴元甲子岁造疏
  description: 于般若院启曼拏罗祈圣佑，梦金像捧咽面门，下笔撰大方广佛华严经疏，梦龙头枕南台北为流通兆
- id: guji-澄观-event-completion
  date: 0787
  year_of: 787
  title_zh: 贞元丁卯疏成制钞
  description: 疏功就，后制随疏演义钞四十卷，随文手镜百卷，华严纲要法界观等三十余部八十余卷
- id: guji-澄观-event-preaching
  date: 0796
  year_of: 796
  title_zh: 奉诏译讲赐清凉国师
  description: 与般若三藏译华严后分，奉诏内殿谈法，赐紫衲授教授和尚及清凉国师号，后授僧统印，讲大经五十遍，设无遮十五会
- id: guji-澄观-event-death
  date: 0839-03-06
  year_of: 839
  title_zh: 开成己未三月六日示寂
  description: 春三月六日付法宝印海岸而卒，寿百二腊八十三，迁全身终南石室，阇维得舍利数千舌红如莲
