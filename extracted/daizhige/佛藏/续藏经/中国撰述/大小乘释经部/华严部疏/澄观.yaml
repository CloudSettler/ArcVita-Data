    title_zh: 应诏入京造华严经疏
    rationale: 以旧新译文义繁广，机感不一，须立教起十因十缘以定宗本，使本末相收
  - date: 0798
    title_zh: 以行布圆融双存立位说行
    rationale: 为显菩萨阶位不乱而一位摄一切，故疏中兼陈行布圆融二门，令学者不滞偏执
- id: guji-澄观-endeavor-2
  title_zh: 住清凉山弘阐华严宗风
  summary: 居五台清凉化众，被历朝礼遇，以讲演华严摄机，令果德地位胜行深入人心，奠华严宗风
