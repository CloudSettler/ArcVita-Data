  - date: 0515-01-01
    title_zh: 从足轮放光立下摄群生义
    rationale: 上会面门放光表说法甚深此品为普应世间故取足轮表下摄渐次遍照
  - date: 0518-01-01
    title_zh: 立法身常住五平等观释偈
    rationale: 破取舍分别令离相见月轮身不一不异故立有行依正阴见无我五观
- id: guji-灵辨-endeavor-2
  title_zh: 造华严经论十卷判十门教义
  summary_zh: 集救苦说法智身寂灭大悲拔苦等十门以性净无漏智化导群生趣无余涅槃
