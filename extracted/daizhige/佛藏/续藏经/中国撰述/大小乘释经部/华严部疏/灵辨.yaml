  decisions:
  - date: 0518-01-01
    title_zh: 以十力智无碍示现判法身自在
    rationale: 为令大众于常果起深信解故须明智照自在成败宿命三明等十种方便
  - date: 0520-01-01
    title_zh: 以大悲拔苦摄同类化导
    rationale: 为度难度拔三有断无常坏果故随缘示现同彼形而令心无疑惑悉寂灭
