  name_zh: 受登
  names:
    zh: 受登
    en: Shoudeng
  lifespan:
    birth:
      date: 1610-01-01
      precision: year
      is_circa: true
      raw: 明末未详具体生年
    death:
      date: 1680-01-01
      precision: year
      is_circa: true
      raw: 清初未详具体卒年
  birth_date: 1610-01-01
  death_date: 1680-01-01
  era: 明末清初
  reign_ref: 康熙
  archetype: 持律观心密教集成者
  dilemmas:
  - 浅智测量但顺初机，难会直接上根超凡入圣之宗趣
  - 以文字求字轮，以名言音韵解观行，难离名离相
  - 坛仪混滥缁素不分，难严持戒律感得圣应
  lesson: 严净尸罗为基，会通显密为轨，以无生理观融摄持诵供养，方成三昧正途
  summary_first_person: 我是天溪比丘受登，景淳其字，台衡世传三昧之学人，生于明末，长于律行观智，穷研准提群经三译及持明藏仪轨，考订字声句引，集成准提三昧行法十科，以严治道场清净三业为先，以持咒五悔行道入三摩地为次，定三七日为一期，辅以法华三昧观想，范骧与明源两公为我作序，述我戒行精严证空不堕空之旨，我愿后学不计身命尽力争先，离生死于片念，决三昧于一期
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/礼忏部/准提三昧行法.md
  - https://daizhige.org/佛藏/续藏经/中国撰述/礼忏部/准提三昧行法.html
