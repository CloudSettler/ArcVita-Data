      - 会通立义
    start_date: 1663-01-01
    highlight_event_id: guji-受登-event-compilation
  - key: climax
    name: 十章明法三密加持成书
    labels:
      zh:
      - 集成高峰
    start_date: 1665-03-01
    highlight_event_id: guji-受登-event-mingyuan-preface
  - key: closure
    name: 两序印证善本流通
    labels:
      zh:
      - 印证流通
    start_date: 1669-08-01
    highlight_event_id: guji-受登-event-fanxiang-preface
  decisions:
  - date: 1663-06-01
    title_zh: 以无生理观为前导统摄三密
    rationale: 为救专缘坛印偏守字声之弊，立诸法性空万行无作之圆因为标准，使显密一体感应道交
  - date: 1665-03-01
    title_zh: 引法华三昧补助观想句偈
    rationale: 使正修时以心观照之，令四肘方坛镜光影现皆显法身般若解脱，随触即得
- id: guji-受登-endeavor-2
  title_zh: 严净戒律整肃坛仪推行精进期制
  description: 重严受戒发心，汰别僧俗界相，定三七日乃至七七日之期，立三时四时六时持诵通轨，肃豫严待以招圣应
  phases:
  - key: brewing
    name: 自誓受戒调伏身心
    labels:
      zh:
      - 严戒酝酿
    start_date: 1660-06-01
    highlight_event_id: guji-受登-event-compilation
  - key: breakthrough
    name: 厘定行人界相与日期时数
    labels:
      zh:
      - 建制突破
    start_date: 1664-01-01
    highlight_event_id: guji-受登-event-mingyuan-preface
  - key: climax
    name: 缁素分明同场别坛共修
    labels:
      zh:
      - 整肃高峰
    start_date: 1668-01-01
    highlight_event_id: guji-受登-event-fanxiang-preface
  - key: closure
    name: 方便一七加护进道无魔
    labels:
      zh:
      - 持守成规
    start_date: 1669-08-01
    highlight_event_id: guji-受登-event-fanxiang-preface
  decisions:
  - date: 1664-02-01
    title_zh: 定三七日为一期精进修法
    rationale: 约法审机，合经中七日至七七日与百二十日之制，使初修有程限而毕生修者可增进
  - date: 1668-05-01
    title_zh: 僧俗同场设界相以隔坛席
    rationale: 在家纵沾戒品未具道仪，进止失谐反成扰动，须谨始以昭圣应
