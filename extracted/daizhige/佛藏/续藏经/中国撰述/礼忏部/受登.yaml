  date: 1664-06-01
  year_of: 1664
  description: 遍考地婆诃罗金刚智不空等诸译，合龙树持明藏仪轨，立严治道场至入三摩地十意方法
- id: guji-受登-event-mingyuan-preface
  type: achievement
  title_zh: 明源作序印证心观
  date: 1665-03-01
  year_of: 1665
  description: 康熙乙巳仲春，宝轮沙门明源赞其以台衡世传三昧作持诵轨仪，会三德印十乘，总莫总于真性密莫密于惟心
- id: guji-受登-event-fanxiang-preface
