    rationale: 专修之士尤为急要修此见佛奇勋明心妙诀故从时公行仪中摘出遵古略辑
  - date: 1693-10-01
    title_zh: 以四十八愿九品观成信愿行资粮
    rationale: 读此方了弥陀因果始终不舍苦恼众生依此持名念念圆具信愿行三种资粮西归不远
events:
- id: guji-古昆-event-birth
  title_zh: 诞生
  date: 1645-01-01
  year_of: 1645
  description: 清初约生后为僧号恋西释子习舜江天台教观
- id: guji-古昆-event-study
  title_zh: 阅净土典籍立日课之志
  date: 1688-06-01
  year_of: 1688
  description: 因阅妙宗圆中二钞及净土十要等书始知弥陀经十念门礼想仪四十八愿九品观章皆净土必要深信切愿莫不由斯遂奉为日课
- id: guji-古昆-event-preface
  title_zh: 癸酉冬序西归行仪
  date: 1693-12-01
  year_of: 1693
  description: 恋西学人古昆在舜江天台教观敬然臂香四十八炷供养阿弥陀佛稽首谨序西归行仪以所集奉为日课告同心共作往生左券
- id: guji-古昆-event-ritual
  title_zh: 辑弥陀礼想及临睡入观仪
  date: 1693-10-01
  year_of: 1693
  description: 自号恋西释子遵古略辑佛说阿弥陀经礼想仪附大忏悔文礼四十八愿仪及临睡入观礼诵仪兼录四十八愿九品观章以便初学专修
- id: guji-古昆-event-death
  title_zh: 示寂
  date: 1710-01-01
  year_of: 1710
  description: 康熙末约卒一生以净土行仪接引学人所辑西归行仪续藏收录流通
