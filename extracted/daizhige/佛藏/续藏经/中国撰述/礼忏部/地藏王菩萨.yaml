    title_zh: 驻锡九华苦行摄众
    rationale: 因九华山川清净可为道场，以苦行示范摄散精勤，令信众起增上坚固行
events:
- id: guji-地藏王菩萨-event-birth
  title_zh: 新罗王族诞生
  date: '0696-01-01'
  year_of: 696
  place_zh: 新罗国王宫
  description_zh: 相传万岁通天元年诞生新罗王族，性慈聪慧，厌离五欲，出家慕道
- id: guji-地藏王菩萨-event-vow
  title_zh: 忉利天宫发大誓愿
  date: '0733-04-08'
  year_of: 733
  place_zh: 忉利天宫大集会
  description_zh: 承释迦付嘱，于忉利大集发地狱未空誓不成佛之愿，运同体慈悲度六道爱河
- id: guji-地藏王菩萨-event-jiuhua
  title_zh: 驻锡九华山苦行
  date: '0757-01-01'
  year_of: 757
  place_zh: 池州九华山
  description_zh: 航海入唐，驻锡九华，结茅苦行，广摄檀信，示现地藏应化，声名远播
- id: guji-地藏王菩萨-event-repentance
  title_zh: 开示慈悲地藏忏法
  date: '0770-07-30'
  year_of: 770
  place_zh: 九华道场水月坛
  description_zh: 为令众生破烦恼障除业障，开示严净坛场归命三宝，发露三毒十习，忏悔宿愆，究竟菩提
- id: guji-地藏王菩萨-event-death
  title_zh: 九华示寂肉身不坏
  date: '0794-07-30'
  year_of: 794
  place_zh: 九华山神光岭
  description_zh: 唐贞元十年七月三十日跏趺示寂，肉身不坏，众建塔供奉，后世以是日为地藏圣诞，忏法流布不绝
