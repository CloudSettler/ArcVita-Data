  - date: '0733-04-08'
    title_zh: 发地狱不空誓不成佛大愿
    rationale: 因众生妄境迷心轮回三有，唯大愿可摄苦难，效普贤行愿先度众生后成佛道
  - date: '0770-07-30'
    title_zh: 开慈悲忏法令发露改往
    rationale: 因宿习结业非一生可释，须藉忏悔灭罪方便，令三毒永息十习化为净缘
