    start_date: '1595-03-01'
    highlight_event_id: guji-如惺-event-chan-yinshan
  - key: closure
    name: 住慈云寺传教编刻流通护持慧命
    labels:
      zh: 住持
    start_date: '1600-01-01'
    highlight_event_id: guji-如惺-event-jintang-bianke
  decisions:
  - date: '1595-03-01'
    title_zh: 连以所刻佛法金汤编诸书相质
    rationale: 方今去圣逾遥魔军炽盛欲树法幢传佛慧命故不惮别去数载以著述就正先达
  - date: '1600-01-01'
    title_zh: 广求良友严持戒律限众共修
    rationale: 非常之事必有非常之人恐众中有不肖厕滓故限二十五人十二人择行朴志锐者共成三昧
