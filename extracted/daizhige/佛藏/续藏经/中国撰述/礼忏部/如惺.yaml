    start_date: '1585-01-01'
    highlight_event_id: guji-如惺-event-yibo-chuanfa
  - key: breakthrough
    name: 从千松请益楞严究达磨之道解行俱迈
    labels:
      zh: 参学
    start_date: '1590-01-01'
    highlight_event_id: guji-如惺-event-yibo-chuanfa
  - key: climax
    name: 会营志道于吴门尹山寺以金汤编相质
