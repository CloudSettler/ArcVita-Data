endeavors:
- id: guji-如惺-endeavor-1
  title_zh: 撰述得遇龙华修证忏仪开龙华三会真因
  description_zh: 依诸大乘经及法住记立十二方便自开发正信广求良友严持戒律发菩提心乃至总观兜率别观龙华念一实相判横竖出三界明弥勒四殊胜劝大心凡夫求生内院得遇龙华
  phases:
  - key: brewing
    name: 悯世束龙华高阁发心结缘
    labels:
      zh: 发心
    start_date: '1590-01-01'
    highlight_event_id: guji-如惺-event-yibo-chuanfa
  - key: breakthrough
    name: 撰成十二条自开发正信终念实相
    labels:
      zh: 撰述
    start_date: '1600-01-01'
    highlight_event_id: guji-如惺-event-jintang-bianke
  - key: climax
    name: 以忏仪请序于吴门得娄江营志道印可
    labels:
      zh: 请序
    start_date: '1607-02-01'
    highlight_event_id: guji-如惺-event-longhua-chan
  - key: closure
    name: 劝见闻随喜流通弗以人废教
    labels:
      zh: 流通
    start_date: '1607-03-01'
    highlight_event_id: guji-如惺-event-longhua-chan
  decisions:
  - date: '1607-02-01'
    title_zh: 以弥勒对他方佛立四殊胜
    rationale: 愍世独尊净土专恃弥陀不察慈氏居兜率疾入不退故约主约机分四殊胜令生正信
  - date: '1607-02-01'
    title_zh: 依法华结普贤弥勒二坛专诵法华
    rationale: 以法华为龙华之本令修法华忏发愿求生内院即三界而不染三界不劳欣厌便睹白毫
- id: guji-如惺-endeavor-2
  title_zh: 嗣天台法脉请益楞严编刻护法
  description_zh: 得衣钵于天台象先清公复从千松请益楞严究达磨之道编刻佛法金汤编诸书住天台慈云寺传教观行力修甘苦为众师范
  phases:
  - key: brewing
    name: 得衣钵于清公为法门麟角
    labels:
