  decisions:
  - date: 1665
    title_zh: 以忏法尊主兼请八部定序
    rationale: 古师列十六增至二十四既无位座亦失次序故按忏法事当尊主兼请八部风火水神以合经旨
  - date: 1670
    title_zh: 总别三请安座如法伸供
    rationale: 既非修忏惟是设供亦须知位次尊卑故立三请功德七诵天咒及总请安座伸供回向之节次
- id: guji-弘赞-endeavor-2
  title_zh: 检讨大藏撰诸天行仪传
  summary: 为定尊卑检讨大藏撰诸天传释梵释四王密迹自在波旬散脂辩才功德等主客男女本迹显晦弘金光明护国护经思想
  phases:
