  decisions:
  - date: 1668
    title_zh: 立主客男女本迹显晦四端以定尊卑
    rationale: 梵王为三界主帝释为忉利主四王为八部主功德大辩但客寄故难拘十二十六十八之数当以四端可与言天
  - date: 1672
    title_zh: 附垂内外三业洁净训
    rationale: 近见僧俗供天心缺殷重供具非新饮食不精故示香汤沐浴杨枝净漱专心懃敬及洗净洗手之法以求感格
