  era: 清初
  reign_ref: 康熙
  archetype: 重仪轨弘戒律之高僧
  dilemmas:
  - 今时礼拜多乖仪则不符教旨何以重立规范令捐埃获福
  - 经论忏法文广初学难诵何以长短得中便於昼夜持诵
  lesson: 礼佛须具礼敬赞德忏悔随喜劝请发愿回向五法方成正行
  summary_first_person: 吾南海宝象林沙门弘赞也，见今时称名失次欠存敬，不知忏悔发愿回向，故取经论五法编此礼佛仪式，以正仪则而导后学。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E7%A4%BC%E5%BF%8F%E9%83%A8/%E7%A4%BC%E4%BD%9B%E4%BB%AA%E5%BC%8F.html
endeavors:
- id: guji-弘赞-endeavor-1
  title_zh: 编订礼佛仪式正昼夜六时行仪
  summary: 据经论五法编普礼三宝及诸佛菩萨赞礼，定香赞偈与接足观想，通行昼夜六时日三时晨昏二时。
  phases:
  - key: brewing
    name: 睹乖仪则发心
    labels:
      zh: 睹乖发心
    start_date: '1660'
    highlight_event_id: guji-弘赞-event-compile
  - key: breakthrough
    name: 取经论立五法纲
    labels:
      zh: 立纲取则
    start_date: '1665'
    highlight_event_id: guji-弘赞-event-compile
  - key: climax
    name: 次第成普礼诸圣仪
    labels:
      zh: 成仪普礼
    start_date: '1670'
    highlight_event_id: guji-弘赞-event-compile
  - key: closure
    name: 流通宝象林行持
    labels:
      zh: 流通守成
    start_date: '1675'
    highlight_event_id: guji-弘赞-event-compile
  decisions:
  - date: '1665'
    title_zh: 先敬三宝后礼诸圣
    rationale: 三宝是最胜吉祥良佑福田，能消业垢却魔障，故凡礼拜必须先敬三宝。
  - date: '1670'
    title_zh: 赞德随佛菩萨改偈
    rationale: 随礼何佛菩萨即依德而赞，取经论偈颂以申叹，不称者依经旨自述，令存敬称扬。
- id: guji-弘赞-endeavor-2
  title_zh: 弘传五悔法与弥勒行愿
  summary: 阐弥勒昼夜各三时五悔，代君亲师长四辈法界回向，并附宝积经二十四颂以便初学持诵。
  phases:
  - key: brewing
    name: 举弥勒本求道行
    labels:
      zh: 本行考据
    start_date: '1668'
    highlight_event_id: guji-弘赞-event-five-repentance
  - key: breakthrough
    name: 略摄悔劝助归命回向
    labels:
      zh: 略摄五悔
    start_date: '1672'
    highlight_event_id: guji-弘赞-event-five-repentance
  - key: climax
    name: 附宝积二十四颂注义
    labels:
      zh: 附经注义
    start_date: '1674'
    highlight_event_id: guji-弘赞-event-five-repentance
  - key: closure
    name: 以音释三灾八难等利初机
    labels:
      zh: 音释利初
    start_date: '1676'
    highlight_event_id: guji-弘赞-event-five-repentance
  decisions:
  - date: '1672'
    title_zh: 五悔摄一切忏愿
    rationale: 凡为忏悔发愿不出礼敬忏悔随喜劝请发愿回向，故以略文摄广义，令行者易持。
  - date: '1674'
    title_zh: 附宝积经长短得中
    rationale: 上五悔偈文略哀恳不伸，余经文过长初学难诵，故附宝积偈并科判二十四颂以便持诵。
events:
- id: guji-弘赞-event-birth
  date: '1611'
  year_of: 1611
  title_zh: 生於明末
  summary: 约明万历三十九年前后生，后出家为僧。
- id: guji-弘赞-event-compile
  date: '1670'
  year_of: 1670
  title_zh: 编成礼佛仪式
  summary: 自称广州南海宝象林沙门，编礼佛仪式，定香台献香、普礼三宝、礼释迦弥陀弥勒文殊普贤观音势至地藏虚空藏及迦叶优波离阿难仪则。
- id: guji-弘赞-event-five-repentance
  date: '1674'
  year_of: 1674
  title_zh: 弘五悔法附宝积经
  summary: 示五悔法与代为君亲师长四辈法界回向之愿，附宝积经弥勒所问会二十四颂并加科注及音释。
- id: guji-弘赞-event-death
  date: '1685'
  year_of: 1685
  title_zh: 示寂於清初
  summary: 约清康熙二十四年示寂，留礼佛仪式流通於丛林净业行门。
