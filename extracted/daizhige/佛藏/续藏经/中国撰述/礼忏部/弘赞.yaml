  - 俗信但知称名不晓赞德之际如何以仪轨摄心入理
  lesson: 以赞德显名以仪轨摄心令一瞻一礼皆成三乘道因
  summary_first_person: 吾乃粤东鼎湖山沙门弘赞在犙，亲见时人礼敬舍利罔谙教法多乖仪则，故博采经论偈颂谨述诸经之义结为礼舍利塔仪式，条列香赞持咒供养赞礼旋绕发愿六法，愿人由事入理灭罪生福。
