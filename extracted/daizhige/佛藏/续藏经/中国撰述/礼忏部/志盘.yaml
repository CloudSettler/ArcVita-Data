endeavors:
- id: guji-志盘-endeavor-1
  title_zh: 编撰法界圣凡水陆胜会修斋仪轨
  description: 集唐宋水陆斋法，立上下堂十位二百席，详定开启结界发符悬旛请圣供施送圣全程仪则
  phases:
  - key: brewing
    name: 阅藏搜集水陆旧仪
    labels:
      zh: 酝酿搜集
    start_date: 1255
    highlight_event_id: guji-志盘-event-birth
  - key: breakthrough
    name: 立法界圣凡平等普度宗旨
    labels:
      zh: 立义突破
    start_date: 1258
    highlight_event_id: guji-志盘-event-shuilu
  - key: climax
    name: 谨撰修斋仪轨六卷告成
    labels:
      zh: 撰述高峰
    start_date: 1260
    highlight_event_id: guji-志盘-event-shuilu
  - key: closure
    name: 仪轨流通后世重订
    labels:
      zh: 流通归结
    start_date: 1262
    highlight_event_id: guji-志盘-event-shuilu
  decisions:
  - date: 1258
    title_zh: 定名法界圣凡水陆普度大斋胜会
    rationale: 以法界明理一，以圣凡明事十，以水陆摄依报，以普度大斋胜会显法施食施无不周遍
  - date: 1260
    title_zh: 详定结界洒净发符次第
    rationale: 先召秽迹明王天龙八部护持结界，再请观音大悲水与毗卢灌顶光水洒净，令道场同于净土堪受圣凡云临
- id: guji-志盘-endeavor-2
  title_zh: 弘天台教观撰佛祖统纪
  description: 住四明东湖研习天台，撰佛祖统纪五十四卷，明正统纪世家以振宗风
  phases:
  - key: brewing
    name: 东湖出家习天台教观
    labels:
      zh: 出家习教
    start_date: 1235
    highlight_event_id: guji-志盘-event-birth
  - key: breakthrough
    name: 考订宗统史传发凡起例
    labels:
      zh: 考史立例
    start_date: 1264
    highlight_event_id: guji-志盘-event-tongji
  - key: climax
    name: 咸淳五年佛祖统纪成书
    labels:
      zh: 统纪告成
    start_date: 1269
    highlight_event_id: guji-志盘-event-tongji
  - key: closure
    name: 以史弘法垂范后学
    labels:
      zh: 弘法垂后
    start_date: 1272
    highlight_event_id: guji-志盘-event-death
  decisions:
  - date: 1264
    title_zh: 以纪传体统摄佛教史
    rationale: 恐宗源淆乱故分正统纪与世家纪志传，明佛祖授受与天台传承之正脉
  - date: 1269
    title_zh: 以戒观行持合于史学
    rationale: 使学教者不滞空言，修忏供者有所依归，理事双举以利末法群机
events:
- id: guji-志盘-event-birth
  title_zh: 降生四明出家东湖
  date: 1220
  year_of: 1220
  description: 南宋嘉定年间生于四明，后出家为东湖沙门，专修天台止观
- id: guji-志盘-event-shuilu
  title_zh: 谨撰水陆胜会修斋仪轨
  date: 1260
  year_of: 1260
  description: 受请开建道场修平等供，集晨朝开启结界洒净发符请圣之法，撰成法界圣凡水陆胜会修斋仪轨，定上下堂各十位共二百席
- id: guji-志盘-event-tongji
  title_zh: 撰成佛祖统纪
  date: 1269
  year_of: 1269
  description: 于咸淳五年撰成佛祖统纪五十四卷，详述世尊至宋朝佛教兴替与天台宗统
- id: guji-志盘-event-death
  title_zh: 南宋末年示寂
  date: 1275
  year_of: 1275
  description: 南宋末年前后示寂，所撰水陆仪轨后经明代袾宏重订流通至今
