  birth_date: '1599'
  death_date: '1655'
  era: 明末清初
  reign_ref: 万历至顺治
  archetype: 高僧弘法者
  dilemmas:
  - 律教禅宗淆讹之际当何依止而得清净正修
  - 业重之人当先修定慧还是先依忏法得清净
  lesson: 先依忏法得清净已然后修习二观方为末世对症之径
  summary_first_person: 我是智旭，悲障深而值法乱，幸逢占察经开我迷云，乃立缘起劝修简择占察正修观道诸科，集成行法，令人先占轮相发露偏重之罪，忏得清净再修二种观道，同归一实境界。
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/礼忏部/占察善恶业报经行法.html
