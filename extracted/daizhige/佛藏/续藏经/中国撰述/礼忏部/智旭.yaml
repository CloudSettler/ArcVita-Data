endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 述集占察善恶业报经行法
  summary: 依占察经立缘起劝修简择占察正修诸科，集成末世可践之忏仪。
  phases:
  - key: brewing
    name: 悲障感发
    labels:
      zh: 萌芽
    start_date: '1625'
    highlight_event_id: guji-智旭-event-renunciation
  - key: breakthrough
    name: 逢典开解
    labels:
      zh: 突破
    start_date: '1635'
    highlight_event_id: guji-智旭-event-compile-xingfa
  - key: climax
    name: 十科集成
    labels:
      zh: 高潮
    start_date: '1643'
    highlight_event_id: guji-智旭-event-compile-xingfa
  - key: closure
    name: 付嘱流通
    labels:
      zh: 收束
    start_date: '1650'
    highlight_event_id: guji-智旭-event-preach-guandao
  decisions:
  - date: '1643'
    title_zh: 以十科集成行法
    rationale: 诸忏行法详略稍殊，须纤疑始决，不敢师心，故述缘起以集成
  - date: '1643'
    title_zh: 先占轮相后修忏悔
    rationale: 当人业习各有偏强，先简察善恶何罪偏重，修忏时方能陈白灭障
- id: guji-智旭-endeavor-2
  title_zh: 弘传忏悔清净与二种观道
  summary: 主张业重者先忏得三业纯善轮相，然后修唯心识观与真如实观入一实境界。
  phases:
  - key: brewing
    name: 劝修立信
    labels:
      zh: 萌芽
    start_date: '1643'
    highlight_event_id: guji-智旭-event-compile-xingfa
  - key: breakthrough
    name: 严净修忏
    labels:
      zh: 突破
    start_date: '1645'
    highlight_event_id: guji-智旭-event-compile-xingfa
  - key: climax
    name: 得清净相
    labels:
      zh: 高潮
    start_date: '1650'
    highlight_event_id: guji-智旭-event-preach-guandao
  - key: closure
    name: 别明观道
    labels:
      zh: 收束
    start_date: '1652'
    highlight_event_id: guji-智旭-event-preach-guandao
  decisions:
  - date: '1650'
    title_zh: 未得纯善轮相不许修观
    rationale: 经诫业重之人不得先修定慧，应依忏法得清净已然后修习二观
  - date: '1652'
    title_zh: 利钝分授二种观道
    rationale: 利根直学真如实观，钝根先学唯心识观，方能契会一实境界
events:
- id: guji-智旭-event-birth
  title_zh: 诞生
  date: '1599'
  year_of: 1599
  description: 明万历二十七年生于古吴，俗姓钟
- id: guji-智旭-event-renunciation
  title_zh: 出家研学
  date: '1625'
  year_of: 1625
  description: 出家为比丘，遍研律教禅宗，悲律教禅宗淆讹而求对症神剂
- id: guji-智旭-event-compile-xingfa
  title_zh: 集占察善恶业报经行法
  date: '1643'
  year_of: 1643
  description: 以古吴比丘身份集行法七门，立缘起劝修简择占察正修十科，别明二种观道，并附占轮相法与斋佛仪
- id: guji-智旭-event-preach-guandao
  title_zh: 开示忏法观道
  date: '1650'
  year_of: 1650
  description: 劝四众先占初轮相发露偏重之罪，昼三夜三称念地藏名号，得三业纯善轮相后修唯心识观与真如实观
- id: guji-智旭-event-death
  title_zh: 示寂
  date: '1655'
  year_of: 1655
  description: 清顺治十二年示寂，留下占察行法以利末世净信
