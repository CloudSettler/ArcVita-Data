  archetype: 感冤兴忏的高僧
  dilemmas:
  - 受宠过奢而损德，名利心起则宿冤得便
  - 宿世冤业累劫难解，唯凭三昧法水与至诚忏悔方得释然
  lesson: 戒律虽严不恃宿德，遇宠常怀惭愧，逢冤深自忏悔，方能转冤亲为眷属，化罪薮为福田
  summary_first_person: 吾知玄十世为僧，蒙懿宗临席称为国师赐以沉香之座，宠遇过奢遂损德业，膝生人面疮备受剧苦，忆迦诺尊者之约往西蜀彭州九龙山，以三昧法水洗解袁盎晁错之宿冤，遂卓庵制三卷忏文，愿末世展演者皆得业海波平
