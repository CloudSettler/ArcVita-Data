    highlight_event_id: guji-知玄-event-birth
  - key: breakthrough
    name: 道德昭著升座
    labels:
      zh:
      - 弘法化众
    start_date: 0860
    highlight_event_id: guji-知玄-event-honour
  - key: climax
    name: 赐号赐座极宠
    labels:
      zh:
      - 国师恩渥
    start_date: 0870
    highlight_event_id: guji-知玄-event-honour
  - key: closure
    name: 过奢损德伏衅
    labels:
      zh:
      - 名利为害
    start_date: 0871
    highlight_event_id: guji-知玄-event-washing
  decisions:
  - date: 0860
    title_zh: 不厌迦摩罗疾者而殷勤顾问
    rationale: 见同林病僧人皆嫌恶，独以慈悲摄受结未来解冤之缘
  - date: 0870
    title_zh: 受沉香座安享人主宠遇
    rationale: 感恩知遇而受之，未觉奢逸损德遂令累世宿冤得便
- id: guji-知玄-endeavor-2
  title_zh: 九龙山洗冤制水忏垂世
  summary: 膝生人面疮遍召名医不治，入西蜀彭州九龙山求迦诺尊者，以三昧法水洗解宿冤，卓庵修三卷忏文
  phases:
  - key: brewing
    name: 人面疮发忆旧约
    labels:
      zh:
      - 业报现前
    start_date: 0871
    highlight_event_id: guji-知玄-event-washing
  - key: breakthrough
    name: 烟云寻松见尊者
    labels:
      zh:
      - 入山求解
    start_date: 0873
    highlight_event_id: guji-知玄-event-washing
  - key: climax
    name: 三昧水洗宿冤释
    labels:
      zh:
      - 袁盎晁错对辩
    start_date: 0873
    highlight_event_id: guji-知玄-event-washing
  - key: closure
    name: 卓庵制忏利末世
    labels:
      zh:
      - 水忏三卷
    start_date: 0874
    highlight_event_id: guji-知玄-event-compiling
  decisions:
  - date: 0873
    title_zh: 不就名医而入山寻约
    rationale: 深知此疮非医药可治，乃宿世冤业，唯圣者法水可解
  - date: 0874
    title_zh: 录佛名采经义制忏三卷
    rationale: 既感圣师洗冤之恩，愿施仁末世，令展演礼诵者转冤家如眷属
events:
- id: guji-知玄-event-birth
  date: 0810
  year_of: 810
  title_zh: 知玄诞生
  description: 唐元和五年诞生，夙具宿慧，后出家为十世高僧，戒律精严
- id: guji-知玄-event-honour
  date: 0870
  year_of: 870
  title_zh: 懿宗临席赐号赐座
  description: 以道德昭著蒙懿宗亲临法席，称为国师，复赐沉香为座，恩渥甚厚
- id: guji-知玄-event-washing
  date: 0873
  year_of: 873
  title_zh: 九龙山三昧水洗人面疮
  description: 膝生人面疮眉目口齿俱备，往彭州九龙山见迦诺尊者，引至岩下泉所，闻袁盎晁错对辩，掬水洗之痛彻骨髓而疮灭殿失
- id: guji-知玄-event-compiling
  date: 0874
  year_of: 874
  title_zh: 卓庵修慈悲道场水忏三卷
  description: 取三昧水洗冤业为义，录诸佛洪名采群经玄义，成忏文三卷以利末世
- id: guji-知玄-event-death
  date: 0880
  year_of: 880
  title_zh: 知玄示寂
  description: 唐僖宗中和二年示寂，世寿七十一，遗下水忏流通，启后世礼忏之门
