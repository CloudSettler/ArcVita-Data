endeavors:
- id: guji-知玄-endeavor-1
  title_zh: 京师弘法膺国师宠遇
  summary: 以道德昭著居京师丛林，懿宗亲临法席称为国师复赐沉香为座，恩渥甚厚而名利心起
  phases:
  - key: brewing
    name: 丛林潜修结缘
    labels:
