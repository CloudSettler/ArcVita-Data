person:
  qid: guji-遂禅师
  name_zh: 遂禅师
  names:
    zh: 遂禅师
    en: Master Sui of Dahong Mountain
  lifespan:
    birth:
      date: 1550-01-01
      precision: year
      is_circa: true
      raw: 明嘉靖末约生
    death:
      date: 1620-01-01
      precision: year
      is_circa: true
      raw: 明万历末约寂
  birth_date: 1550-01-01
  death_date: 1620-01-01
  era: 明
  reign_ref: 明嘉靖至万历
  archetype: 华严行愿弘化者
  dilemmas:
  - title_zh: 经卷浩繁与行门简易
    description: 华严经卷浩大，学人难以周遍，故以礼诵发愿摄持全经，令初机亦得同入华藏。
  - title_zh: 自利证入与利他道场
    description: 既愿自眼常见耳闻口诵心悟，又愿与四恩三有同游华藏，于自修与共修之间立道场仪轨。
  lesson: 以礼诵发愿摄华严全经，令自他同归华藏性海，共入菩提大道场。
  summary_first_person: 吾住随州大洪山，仰华严性海，愧业重福轻，惟以礼诵发愿为舟筏，愿生生世世眼见耳闻口诵手书心悟大方广佛华严经，亲近华藏圣贤，与法界众生同消罪垢，同集福智，同游华藏，共入菩提。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E7%A4%BC%E5%BF%8F%E9%83%A8/%E5%8D%8E%E4%B8%A5%E9%81%93%E5%9C%BA%E8%B5%B7%E6%AD%A2%E5%A4%A7%E7%95%A5.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E7%A4%BC%E5%BF%8F%E9%83%A8/%E5%8D%8E%E4%B8%A5%E9%81%93%E5%9C%BA%E8%B5%B7%E6%AD%A2%E5%A4%A7%E7%95%A5.md
endeavors:
- id: guji-遂禅师-endeavor-1
  title_zh: 撰述礼华严经文
  summary: 依华严性海及善财文殊普贤行愿，撰礼经发愿文，立生生世世供养证入之愿。
  phases:
  - key: brewing
    name: 大洪山阅藏熏习
    labels:
      zh: 阅藏熏习
    start_date: 1575-01-01
    highlight_event_id: guji-遂禅师-event-1
  - key: breakthrough
    name: 发愿常供常诵
    labels:
      zh: 发愿持经
    start_date: 1585-01-01
    highlight_event_id: guji-遂禅师-event-1
  - key: climax
    name: 撰成礼经文
    labels:
      zh: 撰述愿文
    start_date: 1590-01-01
    highlight_event_id: guji-遂禅师-event-1
  - key: closure
    name: 付道场讽诵
    labels:
      zh: 付众讽诵
    start_date: 1595-01-01
    highlight_event_id: guji-遂禅师-event-2
  decisions:
  - date: 1585-01-01
    title_zh: 以五愿摄全经
    rationale: 立眼见耳闻口诵手书心悟五愿，令尘尘混入刹刹圆融之旨归于日用行持。
  - date: 1590-01-01
    title_zh: 以善财普贤为轨范
    rationale: 愿如善财文殊弥勒普贤观音毗卢，以圣贤行愿导引后学，同归种智。
- id: guji-遂禅师-endeavor-2
  title_zh: 住持华严道场起止
  summary: 助成华严道场清晨入坛香赞开经回向之仪，使七处九会之法筵不异寂场。
  phases:
  - key: brewing
    name: 结众启建法筵
    labels:
      zh: 结众建坛
    start_date: 1595-01-01
    highlight_event_id: guji-遂禅师-event-2
  - key: breakthrough
    name: 定香赞开经之式
    labels:
      zh: 定香赞仪
    start_date: 1598-01-01
    highlight_event_id: guji-遂禅师-event-2
  - key: climax
    name: 七处九会同宣
    labels:
      zh: 宣演华严
    start_date: 1600-01-01
    highlight_event_id: guji-遂禅师-event-2
  - key: closure
    name: 总回向同圆种智
    labels:
      zh: 回向圆成
    start_date: 1605-01-01
    highlight_event_id: guji-遂禅师-event-2
  decisions:
  - date: 1598-01-01
    title_zh: 定清晨入坛普回向
    rationale: 每日清晨入坛，先香赞祝皇图法轮，后开经补阙回向，以朝暮不失序。
  - date: 1600-01-01
    title_zh: 存行愿品拜诵之便
    rationale: 或拜行愿品或礼华严文宣疏，许随力起止，使大小道场皆可奉行。
events:
- id: guji-遂禅师-event-birth
  title_zh: 诞生
  date: 1550-01-01
  year_of: 1550
  place_zh: 随州境
  description: 约明嘉靖末生，后出家，住大洪山。
- id: guji-遂禅师-event-1
  title_zh: 撰述礼华严经文
  date: 1590-01-01
  year_of: 1590
  place_zh: 随州大洪山
  description: 演宝偈经文布琅函玉轴之旨，撰礼经发愿文，立常供养常证入常宣说之愿，愿与四恩三有同游华藏。
- id: guji-遂禅师-event-2
  title_zh: 助成华严道场起止仪
  date: 1600-01-01
  year_of: 1600
  place_zh: 随州大洪山
  description: 华严道场清晨入坛，举香赞南无华严教主卢舍那佛，开经偈讽诵，补阙回向，拜行愿品，仰祝皇图巩固法轮常转。
- id: guji-遂禅师-event-death
  title_zh: 示寂
  date: 1620-01-01
  year_of: 1620
  place_zh: 随州大洪山
  description: 约明万历末寂，礼经文与道场仪附续藏流布，见华严道场起止大略所录。
