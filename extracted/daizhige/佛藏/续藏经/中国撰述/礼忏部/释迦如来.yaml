events:
- id: guji-释迦如来-event-birth
  type: birth
  title_zh: 无忧树下诞右胁
  date: -563-04-08
  year_of: -563
  place_zh: 迦维卫国无忧园
  description_zh: 圣后攀树次右胁产金躯，才行七步指天地称最胜，天雨细香地开伏藏，阿夷占言当成佛
- id: guji-释迦如来-event-marriage
  type: career
  title_zh: 东宫受职纳耶输
  date: -545-01-01
  year_of: -545
  place_zh: 迦维卫国东宫
  description_zh: 太子妙年父王求娉得耶输，虽将五欲勾牵但见诸根寂静，莲生浊水心净金在炉体坚，终以智刀割爱网
- id: guji-释迦如来-event-renunciation
  type: career
  title_zh: 四门游观逾城出俗
  date: -544-02-08
  year_of: -544
  place_zh: 迦维卫国四门及他山道
  description_zh: 严驾四门观衰老病死及真僧，圣意不存行乐唯赞出尘，中宵逾国城千里神驹去，车匿还宫净饭遥瞻礼
- id: guji-释迦如来-event-austerity
  type: career
  title_zh: 伽耶苦行受乳糜
  date: -529-12-08
  year_of: -529
  place_zh: 伽耶山内及熙连河畔
  description_zh: 五人侍卫六载雪岭受苦寒，麻麦充饥断常非真，渐引邪徒归正，将应供先受难陀乳糜，落发归忉利传衣自饮光，步步震动近菩提
- id: guji-释迦如来-event-enlightenment
  type: career
  title_zh: 金刚座上降魔成道
  date: -528-12-08
  year_of: -528
  place_zh: 金刚座道树下
  description_zh: 籍草结趺过永夜圆成正觉，九地尘劳断六天魔降伏，大梵闻鼓群生觐紫金山，由是随宜转法轮至今受赐
- id: guji-释迦如来-event-death
  type: death
  title_zh: 双林示灭涅槃
  date: -483-02-15
  year_of: -483
  place_zh: 双林
  description_zh: 化仪始终既成转法轮已毕，于双林示灭，真法本无来去，僧祇律称扬佛德以备始终
