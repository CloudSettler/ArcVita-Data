      raw: 晋义熙十年终於长安逍遥园
  birth_date: 0384
  death_date: '0414'
  era: 东晋十六国
  reign_ref: 后秦弘始东晋义熙
  archetype: 般若义解高僧
  dilemmas:
  - 以庄老文饰般若易招猛浪之讥如何守正显实
  - 文字拘束而义理深远如何接引初机不失中道
  lesson: 借世典之言显出世之理、文质兼备、空有不滞、方能远播大乘
  summary_first_person: 吾俗姓张家贫佣书、博观坟籍、深味庄老犹以为未尽、得古维摩经始知所归、遂出家大通实相、弱冠英辩远闻、奔姑臧师事罗什、随入长安居逍遥园详定经论、作宗本物不迁不真空般若无知涅盘无名诸论、复造宝藏论进秦王、惟愿以文字般若接引后学
