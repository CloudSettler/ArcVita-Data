    title_zh: 奔姑臧师事罗什
    rationale: 罗什东来化诱难逢、携先著述往质、求决实相深义
  - date: '0402'
    title_zh: 随什入长安应姚兴之命入逍遥园
    rationale: 得正师兼逢护法、居译场详定经论、方能宏大學解
