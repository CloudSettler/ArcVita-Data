    en: Sengzhao
  lifespan:
    birth:
      date: '0374'
      precision: year
      is_circa: true
      raw: 京兆人，家贫佣书，东晋时生
    death:
      date: '0414'
      precision: year
      is_circa: false
      raw: 后秦弘始十六年卒于长安
  birth_date: '0374'
  death_date: '0414'
  era: 东晋末后秦
  reign_ref: 后秦姚兴弘始
  archetype: 彻法英悟的义解高僧
  dilemmas:
  - 少习庄老虚无自然之道，遇般若方知未尽善，去留何决
  - 假声名句文立论示中道，又恐滞于文字事业，如何示物修悟
  lesson: 离有无二边，依一心实相立行，借言诠道以悟物
  summary_first_person: 吾京兆佣书小子，历观经史，栖神庄老，谓尽善矣，及见旧维摩，方知虚无未契实相，乃越关河从什公于长安，蒙许神明大器，厕身译场，详定经论，作四论以明不迁不真般若涅槃之旨，冠以宗本，欲令众生悟理修观，息妄显真而已
