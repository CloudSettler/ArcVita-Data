- id: guji-僧肇-event-2
  title_zh: 著般若无知不真空物不迁三论
  date: 0408
  year_of: 408
  place_zh: 长安
  description: 依大品般若旨，次第著无知论不真空论物不迁论，明不迁即真，触事而真
- id: guji-僧肇-event-3
  title_zh: 著涅槃无名论并作宗本
