endeavors:
- id: guji-僧肇-endeavor-1
  title_zh: 越关河从鸠摩罗什受学般若
  summary: 闻姑臧有什公，越二千里往从，厕身逍遥园译场，详定大品诸经，深悟实相为宗
  phases:
  - key: brewing
    name: 佣书历观厌庄老
    labels:
      zh: 发心求法
    start_date: 0385
    highlight_event_id: guji-僧肇-event-birth
  - key: breakthrough
    name: 越二千里从什师
    labels:
      zh: 师资遇合
    start_date: '0401'
    highlight_event_id: guji-僧肇-event-1
  - key: climax
    name: 厕身逍遥译场详定
    labels:
      zh: 译场参决
    start_date: '0402'
    highlight_event_id: guji-僧肇-event-1
  - key: closure
    name: 实相为宗道声大著
    labels:
      zh: 宗立名扬
    start_date: '0405'
    highlight_event_id: guji-僧肇-event-2
  decisions:
  - date: '0401'
    title_zh: 负笈从什公
    rationale: 旧维摩启悟，知庄老未尽善，唯般若实相可依，故越关河受学
  - date: '0402'
    title_zh: 留长安助译经
    rationale: 欲依经立义，非通梵汉诠旨不可，故厕身逍遥园参详定
- id: guji-僧肇-endeavor-2
  title_zh: 撰宗本四论明中道实相
  summary: 依次著般若无知不真空物不迁涅槃无名四论，冠以宗本，摄第一义中道理智，接上根乐略之机
  phases:
  - key: brewing
    name: 什出大品立宗意
    labels:
      zh: 酝酿宗本
    start_date: '0404'
    highlight_event_id: guji-僧肇-event-2
  - key: breakthrough
    name: 先著无知不真不迁
    labels:
      zh: 三论并弘
    start_date: 0408
    highlight_event_id: guji-僧肇-event-2
  - key: climax
    name: 什亡后著涅槃无名
    labels:
      zh: 究竟归趣
    start_date: '0413'
    highlight_event_id: guji-僧肇-event-3
  - key: closure
    name: 合四为一冠宗本
    labels:
      zh: 会归一心
    start_date: '0414'
    highlight_event_id: guji-僧肇-event-3
  decisions:
  - date: 0408
    title_zh: 简要作论摄上根
    rationale: 佛说散在方广，乐略之机难遍览，故至简至要摄一乘平等之义
  - date: '0414'
    title_zh: 冠宗本合四论为一
    rationale: 四论皆述一心实相，分则各宗一义，合则总示不有不无，故最后总摄
