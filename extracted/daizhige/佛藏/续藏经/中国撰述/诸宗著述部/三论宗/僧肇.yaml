    title_zh: 以此方经书文言缘饰般若
    rationale: 神道不形心敏难绘、文拘义远、假世典令后学易晓而归中道
  - date: '0410'
    title_zh: 什公迁化后补造涅盘无名论
    rationale: 圆因在般若极果在涅盘、前二论明真俗、后二论启重玄、体用始周圆
  - date: '0412'
    title_zh: 复造宝藏论三章进上姚兴
    rationale: 帝王护法可颁大训於天下、使正典取代讥毁陋音
events:
- id: guji-僧肇-event-birth
  title_zh: 长安张氏佣书家生肇
  date: 0384
  year_of: 384
  type: birth
  description_zh: 家贫以佣书为业、因善写历观经史备尽坟籍、为儒生深味玄微
- id: guji-僧肇-event-shave
  title_zh: 见古维摩经出家通实相
  date: '0400'
  year_of: 400
  type: career
  description_zh: 读老子叹栖神未尽、披古维摩经言始知所归、因此出家大通实相、年方弱冠英辩远闻
- id: guji-僧肇-event-guzang
  title_zh: 姑臧参罗什随入长安逍遥园
  date: '0402'
  year_of: 402
  type: career
  description_zh: 奔往姑臧参承罗什、呈先著述得叹同善吉、随入长安、与僧睿等居逍遥园详定经论
- id: guji-僧肇-event-sizong
  title_zh: 造宗本物不迁不真空般若无知涅盘无名四论
  date: '0410'
  year_of: 410
  type: career
  description_zh: 因著述宗本义物不迁不真空般若无知、什迁化后方成涅盘无名、刘遗民叹方袍有平叔、远公抚机称未尝有
- id: guji-僧肇-event-baozang
  title_zh: 造宝藏论三章进秦王
  date: '0412'
  year_of: 412
  type: career
  description_zh: 以涅盘无名复造宝藏论三章进上姚兴、答旨殷勤敕缮写班诸子侄以为大训、为时所重
- id: guji-僧肇-event-death
  title_zh: 终於长安逍遥园
  date: '0414'
  year_of: 414
  type: death
  description_zh: 晋义熙十年终於长安逍遥园、春秋三十有一、遗文四论为后世三论宗所祖
