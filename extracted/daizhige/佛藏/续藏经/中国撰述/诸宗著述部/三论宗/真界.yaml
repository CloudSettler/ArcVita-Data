endeavors:
- id: guji-真界-endeavor-1
  title_zh: 作物不迁论辩解破或人谬驳
  summary_zh: 释僧肇物不迁宗旨以缘生无性明昔物不至今去即不去来即不来
  phases:
  - key: brewing
    name: 研肇论起惑
    labels:
      zh:
      - 通读放光中观
    start_date: '1585'
    highlight_event_id: guji-真界-event-write
  - key: breakthrough
    name: 即迁明不迁
    labels:
      zh:
      - 立缘生无性义
    start_date: '1589-06-15'
    highlight_event_id: guji-真界-event-write
  - key: climax
    name: 寓双径成辩解
    labels:
      zh:
      - 驳或人断常之难
    start_date: '1597-08-01'
    highlight_event_id: guji-真界-event-preface
  - key: closure
    name: 刻流通觉梦
    labels:
      zh:
      - 流通三论正义
    start_date: '1597-09-01'
    highlight_event_id: guji-真界-event-preface
  decisions:
  - date: '1589-06-15'
    title_zh: 拈昔物不至今立静而非动
    rationale: 对计迁者即迁明不迁以破有物流动之见
  - date: '1597-08-01'
    title_zh: 寓双径作序明非迁非不迁
    rationale: 因梦觉梦恐昧其言者堕谤法坑故不得不辩
- id: guji-真界-endeavor-2
  title_zh: 寓双径弘三论导俗会归同致
  summary_zh: 乘一真心吐不一教谈真有不迁导俗有流动使中下各得信解
  phases:
  - key: brewing
    name: 栖心双径
    labels:
      zh:
      - 习宗镜华严
    start_date: '1590'
    highlight_event_id: guji-真界-event-teach
  - key: breakthrough
    name: 会迁即不迁
    labels:
      zh:
      - 明动静不异
    start_date: '1595'
    highlight_event_id: guji-真界-event-teach
  - key: climax
    name: 示声闻缘觉阶道
    labels:
      zh:
      - 演非常无动之教
    start_date: '1597-08-01'
    highlight_event_id: guji-真界-event-preface
  - key: closure
    name: 结归第一义谛
    labels:
      zh:
      - 明言殊致一
    start_date: '1600'
    highlight_event_id: guji-真界-event-teach
  decisions:
  - date: '1595-01-01'
    title_zh: 以旋岚江河喻明迁而不迁
    rationale: 以事显理使惑者神会而不以事求
  - date: '1597-08-01'
    title_zh: 对机说迁说不迁两言一会
    rationale: 谈真逆俗顺俗违真故须方言辩惑会归同致
events:
