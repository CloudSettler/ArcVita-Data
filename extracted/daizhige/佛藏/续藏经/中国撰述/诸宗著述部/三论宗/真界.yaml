  date: '1589-06-15'
  year_of: 1589
  title_zh: 物不迁解初成流通
  description_zh: 万历己丑五月望日真实居士凭梦祯题辞刻而流通之
- id: guji-真界-event-preface
  date: '1597-08-01'
  year_of: 1597
  title_zh: 寓双径作序成辩解
  description_zh: 万历丁酉孟秋朔日寓双径作序发明缘生无性去即不去驳或人昔物住昔之谬
- id: guji-真界-event-teach
  date: '1600-01-01'
  year_of: 1600
  title_zh: 弘三论言殊致一
  description_zh: 引仲尼回见新交臂非故及梵志白首归喻明藏山临川感往难留之旨
- id: guji-真界-event-death
  date: '1605'
  year_of: 1605
  title_zh: 示寂
  description_zh: 万历年间示寂於江浙一带留辩解以正肇公不迁之旨
