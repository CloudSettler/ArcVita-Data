  dilemmas:
  - 性空性住名异实同，时人误作死常定异
  - 赞叹无以扬休，须以弹驳发奥以护肇师
  lesson: 会空有於同致，以各住真空即寂之性证物不迁
  summary_first_person: 吾为慧日永明寺道衡，见肇师物不迁精义沦没为死常之执，故借因明立各住真空之正因，以明性空即是性住
