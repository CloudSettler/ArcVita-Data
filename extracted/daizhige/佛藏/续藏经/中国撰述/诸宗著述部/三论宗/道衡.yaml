endeavors:
- id: guji-道衡-endeavor-1
  title_zh: 撰物不迁正量论证护肇
  description: 悯月川澄师弹驳后精义难明，以因明重立不迁正因，证各住真空即寂之性
  phases:
  - key: brewing
    name: 悯精义沦没而观澄师弹驳
    labels:
      zh: 酝酿
    start_date: '1600'
    highlight_event_id: guji-道衡-event-duchang
  - key: breakthrough
    name: 判性空即性住破死常之执
    labels:
      zh: 突破
    start_date: '1602'
    highlight_event_id: guji-道衡-event-zhengliang
  - key: climax
    name: 借因明立各住真空即寂之性
    labels:
      zh: 高潮
    start_date: '1603'
    highlight_event_id: guji-道衡-event-zhengliang
  - key: closure
    name: 会通法华般若华严以定大乘性空
    labels:
      zh: 收束
    start_date: '1603-07-01'
    highlight_event_id: guji-道衡-event-zhengliang
  decisions:
  - date: '1602'
    title_zh: 以弹驳发奥不以赞叹扬休
    rationale: 知诠释无补颓靡，故以楔出楔借澄师之驳显肇师之妙
  - date: '1603'
    title_zh: 借因明立不迁真能立
    rationale: 以各住真空即寂之性为因，江河竞注即湿静流为同喻，破法自相相违之谬立
- id: guji-道衡-endeavor-2
  title_zh: 作正量论跋会通五教
  description: 托香山问答辨剎那灭性空即真事理无碍事事无碍，会归不迁常寂因缘
  phases:
  - key: brewing
    name: 设问物各住位五教不摄何以驳肇
    labels:
      zh: 酝酿
    start_date: '1603-06-01'
    highlight_event_id: guji-道衡-event-ba
  - key: breakthrough
    name: 示肇师超然独见五教三乘之外
    labels:
      zh: 突破
    start_date: '1603-06-15'
    highlight_event_id: guji-道衡-event-ba
  - key: climax
    name: 以长风百窍喻因缘适会法本常寂
    labels:
      zh: 高潮
    start_date: '1603-07-01'
    highlight_event_id: guji-道衡-event-ba
  - key: closure
    name: 书於独寐庵以息是非之诤
    labels:
      zh: 收束
    start_date: '1603-08-01'
    highlight_event_id: guji-道衡-event-ba
  decisions:
  - date: '1603-07-01'
    title_zh: 不泥经不合师悟直指常寂
    rationale: 见澄僧但知锥头利不知凿头方，故示法本常寂因缘适会以止诤
  - date: '1603-08-01'
    title_zh: 托香醉山隐者无似道人书跋
    rationale: 以旁观问答收束正量，显观国师唱前澄师和后诸宿交攻皆为互相发挥
events:
- id: guji-道衡-event-birth
  date: '1580'
  year_of: 1580
  title_zh: 降生
  description: 明万历前后降生，住慧日永明寺，传三论性空之学，生年不详系约计
- id: guji-道衡-event-duchang
  date: '1600'
  year_of: 1600
  title_zh: 读月川澄师驳论而悯精义沦没
  description: 见澄师以因非驳肇师物各性住为不迁，时人尽将性空认作死常，遂萌护法之志
- id: guji-道衡-event-zhengliang
  date: '1603'
  year_of: 1603
  title_zh: 撰物不迁正量论证
  description: 万历癸卯前后述正量证，以各住真空即寂之性为因，会通法华法住法位般若即色即空，定不迁为大乘性空妙理
- id: guji-道衡-event-ba
  date: '1603-08-01'
  year_of: 1603
  title_zh: 作正量论跋书於独寐庵
  description: 托香山子问答辨五教剎那灭因果转变之难，以长风百窍喻释常寂因缘，自署香醉山隐者无似道人
- id: guji-道衡-event-death
  date: '1635'
  year_of: 1635
  title_zh: 示寂
  description: 明末前后示寂，卒年不详系约计，留正量一帙以证肇师不迁
