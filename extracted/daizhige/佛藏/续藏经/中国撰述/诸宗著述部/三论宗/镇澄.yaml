- id: guji-镇澄-event-dushen
  kind: career
  title_zh: 研肇论质性住遍质海内名流
  date: 1582
  year_of: 1582
  place_zh: 五台山前
  description_zh: 初读肇公物不迁论久之不喻阅杂华钞观国师滥同小乘之评再研其论知其宗似而因非质诸海内莫有出理引证者遂立志考圣言求正理
- id: guji-镇澄-event-zhenglun
  kind: career
  title_zh: 台山狮子窟著物不迁正量论
  date: 1588
  year_of: 1588
  place_zh: 台山狮子窟
  description_zh: 皇明万历戊子冬以贤首后学自称作正量论序及上下卷引大品华严涅盘中论楞伽立性空为因破有无一异四计明昔物已化今物即真
- id: guji-镇澄-event-xuxing
  kind: career
  title_zh: 李天麟作正量论序论行于世
  date: 1600
  year_of: 1600
  place_zh: 燕地
  description_zh: 万历庚子仲冬净土居士燕人李天麟为正量论作序谓澄公运摩尼于巨鹿持空印于赤壁与肇公相成海内诸名师宿衲皆有酬唱
- id: guji-镇澄-event-death
  kind: death
  title_zh: 镇澄圆寂
  date: 1617
  year_of: 1617
  place_zh: 五台山狮子窟
  description_zh: 明万历四十五年镇澄示寂于五台留正量论以正物不迁之量
