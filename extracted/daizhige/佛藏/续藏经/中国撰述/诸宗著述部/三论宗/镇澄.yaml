endeavors:
- id: guji-镇澄-endeavor-1
  title_zh: 著物不迁正量论辨肇公性住之失
  summary_zh: 久疑肇公以昔物住昔今物住今释不迁考大品华严涅盘中论以性空立正因于台山狮子窟著正量论上下卷以正其说
  phases:
  - key: brewing
    name: 初读肇论久而不喻
    labels:
      zh: 研读生疑
    start_date: 1575
    highlight_event_id: guji-镇澄-event-dushen
  - key: breakthrough
    name: 考圣言悟性空为因
    labels:
      zh: 考教得旨
    start_date: 1580
    highlight_event_id: guji-镇澄-event-dushen
  - key: climax
    name: 台山狮子窟著正量论
    labels:
      zh: 著论立量
    start_date: 1588
    highlight_event_id: guji-镇澄-event-zhenglun
  - key: closure
    name: 居士作序论行于世
    labels:
      zh: 序行天下
    start_date: 1600
    highlight_event_id: guji-镇澄-event-xuxing
  decisions:
  - date: 1588
    title_zh: 决定以性空易性住为不迁正因
    rationale: 性住即是有为去来住相违般若无所住及涅盘断去来住相之说唯性空乃无生灭去来可成不迁宗
  - date: 1588
    title_zh: 决定条陈所滞证正圣言非为驳肇公
    rationale: 肇公心空无物得失无加损恐后世以异因异果为常使实相常住沦于性住故不得不辨以卫大藏
- id: guji-镇澄-endeavor-2
  title_zh: 住五台狮子窟弘贤首弘护实相常住
  summary_zh: 以贤首后学自任住台山狮子窟敷演华严兼通般若涅盘唯识质诸海内名流酬唱往复以明因灭果生相续常义护如来藏常住之旨
  phases:
  - key: brewing
    name: 燕山布衲参学海内
    labels:
      zh: 参学发轫
    start_date: 1565
    highlight_event_id: guji-镇澄-event-dushen
  - key: breakthrough
    name: 阅杂华钞观国师说有省
    labels:
      zh: 得师印证
    start_date: 1582
    highlight_event_id: guji-镇澄-event-dushen
  - key: climax
    name: 狮子窟开堂演教酬唱诸师
    labels:
      zh: 住山弘化
    start_date: 1588
    highlight_event_id: guji-镇澄-event-zhenglun
  - key: closure
    name: 付嘱后学觅金刚眼者
    labels:
      zh: 付嘱后世
    start_date: 1600
    highlight_event_id: guji-镇澄-event-xuxing
  decisions:
  - date: 1588
    title_zh: 决定以修多罗为法印旁引曲喻
    rationale: 名言有在天魔外道不得沮必以大品华严涅盘楞伽为证方能昭肇公之蕴而起后人之信
  - date: 1600
    title_zh: 决定示相续常以通因果不失
    rationale: 恐人疑因灭则堕断故举蜡印灯光服甘露等喻明因灭果生熏习不爽以会通三灾弥纶业行湛然之说
