  dilemmas:
  - 遵肇公旧义以物各性住言不迁还是归圣教以性空立正量
  - 全先贤体面而嘿然还是冒忿然之讥而驳天下之所是
  lesson: 以性空为不迁正因因灭果生而真性湛然不堕常断
  summary_first_person: 吾镇澄号空印燕山布衲晚住五台狮子窟久读肇公物不迁论而生疑考诸修多罗以性空立量著正量论以显般若无去来之旨愿后世具金刚眼者详之
