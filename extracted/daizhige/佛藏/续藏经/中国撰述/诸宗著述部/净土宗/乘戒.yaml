  - 禅净分歧当如何以唯心会通
  - 幼岁出家云游在外当如何报父母罔极之恩
  lesson: 念佛必先观心，自性弥陀即是唯心净土，禅净双修悲智齐融，孝行为佛法之本。
  summary_first_person: 吾乘戒幼岁出家，号海涌小白花海岸山人，云游在外未遑归省，晚年将近耳顺，深感父母恩深难报，乃以念佛观心为捷径，倡自性弥陀唯心净土，作唯心集与孝思篇以自警而化人。
  source_urls:
  - https://cbeta.org/result/normal/X/X1208
endeavors:
- id: guji-乘戒-endeavor-1
  title_zh: 念佛观心弘扬唯心净土
  summary_zh: 以修行捷径莫如念佛为宗，倡观心念佛，自性弥陀唯心净土，禅净双修，著唯心集以接引莲社道友。
  phases:
  - key: brewing
    name: 幼岁出家念佛萌心
    labels:
      zh: 出家念佛
    start_date: '1760'
    highlight_event_id: guji-乘戒-event-chujia
  - key: breakthrough
    name: 会通禅净唯心之旨
    labels:
      zh: 禅净会通
    start_date: '1785'
    highlight_event_id: guji-乘戒-event-yunyou
  - key: climax
    name: 著唯心集示自性弥陀
    labels:
      zh: 著述唯心集
    start_date: '1805'
    highlight_event_id: guji-乘戒-event-weixinji
  - key: closure
    name: 逗漏话堕普劝同生
    labels:
      zh: 普劝念佛
    start_date: '1808'
    highlight_event_id: guji-乘戒-event-weixinji
  decisions:
  - date: '1785'
    title_zh: 立禅净双修悲智齐融之宗
    rationale: 见学人徒劳唇吻不知念者是谁，故以观心为要，直下双忘，心佛齐泯，以显寂光真境。
  - date: '1805'
    title_zh: 应莲社道友请益著唯心集
    rationale: 因道友请益禅净唯心之旨，不忍自秘，遂以偈颂开示九品往生与念佛参禅法要，损己利人。
- id: guji-乘戒-endeavor-2
  title_zh: 云游参学与孝思报恩
  summary_zh: 世为农业，父早逝母在堂，兄终养而己云游，晚年追远报恩，作孝思篇倡在家出家皆以孝敬尊亲为先。
  phases:
  - key: brewing
    name: 农业之家早失怙恃之依
    labels:
      zh: 家世农耕
    start_date: '1750'
    highlight_event_id: guji-乘戒-event-birth
  - key: breakthrough
    name: 云游在外未遑归省
    labels:
      zh: 云游参学
    start_date: '1780'
    highlight_event_id: guji-乘戒-event-yunyou
  - key: climax
    name: 将近耳顺追远作孝思篇
    labels:
      zh: 作孝思篇
    start_date: '1809'
    highlight_event_id: guji-乘戒-event-xiaosi
  - key: closure
    name: 以孝为先垂训后学
    labels:
      zh: 孝为功德本
    start_date: '1810'
    highlight_event_id: guji-乘戒-event-death
  decisions:
  - date: '1780'
    title_zh: 离家云游专修念佛
    rationale: 幸藉兄终养菽水无匮，己当急办前程勤精进，以一句阿弥陀普济群生，方为大报恩。
  - date: '1809'
    title_zh: 作孝思篇以自警示人
    rationale: 生不供甘旨殁不克烝尝，每一念兴悲噎涕泪，故明家家有佛即堂上父母，三教同归于孝，以补追远之心。
events:
- id: guji-乘戒-event-birth
  title_zh: 出生于农业之家
  date: '1750'
  year_of: 1750
  summary_zh: 生于以农业为世业之家，父早逝，唯慈母在堂，胞兄奉养。
- id: guji-乘戒-event-chujia
  title_zh: 幼岁出家
  date: '1762'
  year_of: 1762
  summary_zh: 幼年出家，自号海涌小白花海岸山人乘戒定慧，早习念佛信愿行。
- id: guji-乘戒-event-yunyou
  title_zh: 云游在外参学念佛
  date: '1785'
  year_of: 1785
  summary_zh: 云游四方在外，未遑归省，于禅余课弥陀，体认心佛不二，禅净双修。
- id: guji-乘戒-event-weixinji
  title_zh: 著唯心集弘唯心净土
  date: '1805'
  year_of: 1805
  summary_zh: 应莲社道友请益，作自序及数十首念佛偈颂，明自性弥陀唯心净土，详九品往生因行。
- id: guji-乘戒-event-xiaosi
  title_zh: 作孝思篇明报恩之道
  date: '1809'
  year_of: 1809
  summary_zh: 将近耳顺追念慈母罔极之恩，作孝思篇，倡堂上父母即是释迦弥勒，在家出家皆承父母恩德。
- id: guji-乘戒-event-death
  title_zh: 示寂
  date: '1810'
  year_of: 1810
  summary_zh: 晚年以一句阿弥陀普劝同生，愿临终神不乱托质金台上品莲后示寂。
