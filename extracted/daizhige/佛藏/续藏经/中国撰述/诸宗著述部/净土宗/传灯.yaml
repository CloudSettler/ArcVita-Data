  - key: breakthrough
    name: 依四土缘起宗旨立论纲要
    labels:
      zh: 突破
    start_date: '1610'
    highlight_event_id: guji-传灯-event-2
  - key: climax
    name: 成净土生无生论示唯心唯佛
    labels:
      zh: 高峰
    start_date: '1613'
    highlight_event_id: guji-传灯-event-2
  - key: closure
    name: 留付后世由达默会集流通
    labels:
      zh: 收束
    start_date: '1628'
