  decisions:
  - date: '1610'
    title_zh: 拣去藏通别收归圆教无生
    rationale: 唯圆教即中即假即空方显他方净土之生即是无生
  - date: '1613'
    title_zh: 立唯心唯佛绝待圆融超情离见四重宗旨
    rationale: 欲令人信念佛时即见佛成佛时不经悟门而证不退
events:
