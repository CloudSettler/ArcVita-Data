  - title_zh: 自利专修与利他广传
    description: 既求自生安养又悯尘沙罔觉故博采经论以启信破疑鼓迈往之志
  lesson: 法专则功纯心净则土净以定式示易以全书示博自利利他同登宝所
  summary_first_person: 我俞行敏号宝莲道人得龙舒净土文虔诵详览见其度世婆心然虑文浩繁钝根难信乃先括要旨画为定式刊板普劝复博采诸经及先宿绪论重辑为净土全书上下二卷愿娑婆众生人人信向莲花日发生同脱轮回
