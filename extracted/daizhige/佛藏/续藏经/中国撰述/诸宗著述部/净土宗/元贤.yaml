person:
  qid: guji-元贤
  name_zh: 元贤
  names:
    zh: 元贤
    en: Yongjue Yuanxian
  lifespan:
    birth:
      date: '1578'
      precision: year
      is_circa: false
      raw: 明万历六年
    death:
      date: '1657'
      precision: year
      is_circa: false
      raw: 清顺治十四年
  birth_date: '1578'
  death_date: '1657'
  era: 明末清初
  reign_ref: 万历至顺治
  archetype: 禅净合一弘化者
  dilemmas:
  - zh: 执理废事则落空，执事迷理犹可往生，如何理事双全
  - zh: 居恶世救苦与求生净土之间如何抉择方能自他两利
  lesson: 以念佛总摄万行，以戒杀放生为助缘，理事并行，还归本净本慈
  summary_first_person: 我本寿昌门下，依博山受具，舟过剑津闻法华而廓然大悟，年五十六谒闻谷而投契受云栖戒本，应鼓山开元真寂之请重建鼓山，海内尊为古佛，集成净慈要语劝人念佛放生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏续藏经净慈要语.md
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/净土宗/净慈要语.html
endeavors:
- id: guji-元贤-endeavor-1
  title_zh: 重兴鼓山大阐宗风
  summary: 落发寿昌依博山受具，剑津悟道后谒闻谷出世，应鼓山开元真寂宝善之请重建寺宇说法三会
  phases:
  - key: brewing
    name: 落发参学剑津悟道
    labels:
      zh: 舟过剑津闻法华廓然大悟
    start_date: '1600'
    highlight_event_id: guji-元贤-event-wudao
  - key: breakthrough
    name: 谒闻谷受戒本出世
    labels:
      zh: 宝善投契传云栖戒本
    start_date: '1633'
    highlight_event_id: guji-元贤-event-jianwengu
  - key: climax
    name: 开法泉杭重建鼓山
    labels:
      zh: 开元真寂宝善相继开法
    start_date: '1634'
    highlight_event_id: guji-元贤-event-kaifa
  - key: closure
    name: 海内尊为古佛撰述等身
    labels:
      zh: 三会语录二十种八十余卷
    start_date: '1640'
    highlight_event_id: guji-元贤-event-kaifa
  decisions:
  - date: '1633'
    title_zh: 谒闻谷受云栖戒本决意出世
    rationale: 既彻见寿昌用处，又得闻谷印可，知禅律并弘方能利生，故受戒本而应世
  - date: '1634'
    title_zh: 以庵主自居暂不应师位
    rationale: 初应鼓山犹守本分以观机缘，机熟方开法开元真寂，重建鼓山以大阐宗风
- id: guji-元贤-endeavor-2
  title_zh: 集成净慈要语弘扬念佛放生
  summary: 以净慈庵名统摄念佛放生，集净土及戒杀诸书为上下二卷，劝建州缁素广修净慈之化
  phases:
  - key: brewing
    name: 建州缁素笃修念佛放生
    labels:
      zh: 奉大师教念佛放生有年
    start_date: '1633'
    highlight_event_id: guji-元贤-event-jianwengu
  - key: breakthrough
    name: 取净土戒杀诸书集成要语
    labels:
      zh: 净门慈门分卷集要
    start_date: '1634'
    highlight_event_id: guji-元贤-event-zhushu
  - key: climax
    name: 崇祯甲戌作序付梓
    labels:
      zh: 鼓山题序付梓广传
    start_date: '1634'
    highlight_event_id: guji-元贤-event-zhushu
  - key: closure
    name: 净慈之化洋溢不穷
    labels:
      zh: 念佛还净放生还慈普劝
    start_date: '1635'
    highlight_event_id: guji-元贤-event-zhushu
  decisions:
  - date: '1634'
    title_zh: 专尚持名兼修众福
    rationale: 见高明谈理易落空，中下执事易迷理，持名简易直捷三根普利，更以三福放生为助缘如顺水加棹
  - date: '1634'
    title_zh: 以戒杀放生为慈行之首
    rationale: 见世风薄恶竞尚口腹杀戮无恻隐，上体佛慈下满众生深爱，故首戒杀生广劝放生以全慈义
events:
- id: guji-元贤-event-birth
  title_zh: 出生
  date: '1578'
  year_of: 1578
  description_zh: 生于明万历六年，后落发寿昌，依同门博山三年而受具
- id: guji-元贤-event-wudao
  title_zh: 舟过剑津闻法华悟道
  date: '1612'
  year_of: 1612
  description_zh: 辞归闽住山舟过剑津，闻僧唱法华经一时謦欬俱共弹指廓然大悟，彻见寿昌用处
- id: guji-元贤-event-jianwengu
  title_zh: 年五十六谒闻谷受戒本
  date: '1633'
  year_of: 1633
  description_zh: 谒闻谷大师于宝善一见投契，力劝出世，乃传云栖戒本授之
- id: guji-元贤-event-zhushu
  title_zh: 撰成净慈要语作序付梓
  date: '1634'
  year_of: 1634
  description_zh: 取净土及戒杀诸书集成要语分净门慈门上下卷，于崇祯甲戌端午后三日题序付梓
- id: guji-元贤-event-kaifa
  title_zh: 应鼓山开法重建寺宇
  date: '1636'
  year_of: 1636
  description_zh: 明年应鼓山请犹以庵主自居，又二年开法泉之开元杭之真寂延之宝善，后归鼓山重建寺宇大阐宗风
- id: guji-元贤-event-death
  title_zh: 示寂
  date: '1657'
  year_of: 1657
  description_zh: 迁化于清顺治十四年，海内尊为古佛，遗三会语及撰述二十种八十余卷
