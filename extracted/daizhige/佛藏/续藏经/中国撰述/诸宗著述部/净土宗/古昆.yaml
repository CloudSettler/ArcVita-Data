  birth_date: 1630
  death_date: 1700
  era: 清
  reign_ref: 康熙
  archetype: 净土弘传者
  dilemmas:
  - 唯心空解与实境昭彰之辨，误执自性弥陀而舍西方极乐
  - 着空念佛与死心求生之抉择，空谈不生与实愿往生之冲突
  lesson: 生本无生生四土，见犹离见见三身，一句弥陀包含无尽，当念圆成佛功德海
  summary_first_person: 余惜从前虽喜净土不知其实，每问禅友皆云唯心净土自性弥陀不可着相，因此虽喜念佛但只着空而已，后阅台净二宗及无生论，始知净土实境昭彰即是唯心，弥陀真身显现即是自性，实有净土可生实有弥陀可见，从兹死心念佛求生，谨集成编以自勉并告同心
  source_urls:
