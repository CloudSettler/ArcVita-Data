endeavors:
- id: guji-古昆-endeavor-1
  title_zh: 由空转有重悟唯心净土
  summary: 早喜净土而随禅友着空，后研天台净土及无生论，悟现前一念具无量义，西方依正不离本性，遂死心念佛求生
  phases:
  - key: brewing
    name: 喜净而着空
    labels:
      zh: 迷悟交织
    start_date: 1665
    highlight_event_id: guji-古昆-event-study
  - key: breakthrough
    name: 阅教悟实境
    labels:
      zh: 转悟实有
    start_date: 1680
    highlight_event_id: guji-古昆-event-realize
  - key: climax
    name: 死心念佛求生
    labels:
      zh: 行愿笃实
    start_date: 1685
    highlight_event_id: guji-古昆-event-realize
  - key: closure
    name: 立宗不谬解
    labels:
      zh: 正信确立
    start_date: 1692
    highlight_event_id: guji-古昆-event-compile
  decisions:
  - date: 1680
    title_zh: 弃舍空解依实境
    rationale: 台净昭示宝地光明随心出现，弥陀真身即是自性，故不舍西方，不堕死水深坑
  - date: 1685
    title_zh: 死心念佛定往生
    rationale: 现前一念亘古亘今为无量寿，灵明洞彻为无量光，念念执持即念念证入，果因交彻
- id: guji-古昆-endeavor-2
  title_zh: 集净土神珠弘劝同心
  summary: 愍时人谬解及己前非，集诸圣诚言阐一乘妙旨，以如意珠喻现前一念心性，劝广开解目深入行门
  phases:
  - key: brewing
    name: 采摭群经论疏
    labels:
      zh: 集腋成裘
    start_date: 1685
    highlight_event_id: guji-古昆-event-realize
  - key: breakthrough
    name: 立神珠总纲
    labels:
      zh: 立义弘通
    start_date: 1690
    highlight_event_id: guji-古昆-event-compile
  - key: climax
    name: 集成往生决疑系缘诸门
    labels:
      zh: 成编示信
    start_date: 1692
    highlight_event_id: guji-古昆-event-compile
  - key: closure
    name: 付流通告同心
    labels:
      zh: 流通劝修
    start_date: 1692-06-01
    highlight_event_id: guji-古昆-event-compile
  decisions:
  - date: 1690
    title_zh: 以神珠名一乘心要
    rationale: 此心性竖穷横遍本具十方净土，弥陀经所赞不可思议功德诸佛护念皆为此，故喻如意顿含众宝
  - date: 1692
    title_zh: 集圣言破谬劝行
    rationale: 见时人舍乐邦慈父恋空不生，故取决疑文系缘门忏愿仪略传等，令信弥陀依正在西方亦不离本性，回神亿刹实生自己心中
events:
- id: guji-古昆-event-birth
  title_zh: 出生
  date: 1630
  year_of: 1630
  description: 清初出生，后承幽溪传法之绪，出家学佛，喜净土法门
- id: guji-古昆-event-study
  title_zh: 问禅友而着空
  date: 1665
  year_of: 1665
  description: 虽喜念佛，每问禅友皆言唯心净土自性弥陀不可着相，遂但着空不知实境
- id: guji-古昆-event-realize
  title_zh: 阅台净悟实有净土
  date: 1680
  year_of: 1680
  description: 阅天台净土二宗及无生论，始知净土实境昭彰即是唯心，弥陀真身显现即是自性，生本无生生四土，遂死心念佛求生
- id: guji-古昆-event-compile
  title_zh: 集成净土神珠成编
  date: 1692-06-01
  year_of: 1692
  description: 壬申夏集成净土神珠，自序阐现前一念心性，辑决疑文系缘门忏愿仪等，同门芳慧为作序以表师志
- id: guji-古昆-event-death
  title_zh: 圆寂
  date: 1700
  year_of: 1700
  description: 康熙末示寂，一生以一句弥陀包含无尽劝人尽心力行，愿同生安养
