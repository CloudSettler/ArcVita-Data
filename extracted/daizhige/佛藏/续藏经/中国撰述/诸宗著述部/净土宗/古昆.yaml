  decisions:
  - date: '1869-09-01'
    title_zh: 辑阿弥陀经礼想仪
    rationale: 依经十二科唱礼随经默想坚固信愿一心持名
  - date: '1870-11-01'
    title_zh: 辑临睡入观礼诵仪
    rationale: 深信二佛愿力同化众生具欣厌二行决定得生
  - date: '1873-03-01'
    title_zh: 立誓戒好作文字
    rationale: 因撰述得重病知障道非浅恨意马难止故戒之以免丧失实德
- id: guji-古昆-endeavor-2
  title_zh: 会集净土随学弘传
  summary: 会集自警录及一生著述为一本以自览警策然臂供佛发愿见佛利生
  phases:
  - key: brewing
    name: 触事昏迷思忏
