    start_date: '1875-04-01'
    highlight_event_id: guji-古昆-event-chanhui
  - key: climax
    name: 会集编稿告成
    labels:
      zh: 会集自警录成书
    start_date: '1875-06-01'
    highlight_event_id: guji-古昆-event-bianshu
  - key: closure
    name: 然香供佛发愿
    labels:
      zh: 然四十八炷愿见佛
    start_date: '1875-07-01'
    highlight_event_id: guji-古昆-event-bianshu
  decisions:
  - date: '1875-04-01'
    title_zh: 重立誓今生再不妄作
    rationale: 若不忏悔必成恶障故发露重誓再为即是逆佛子
  - date: '1875-07-01'
    title_zh: 会集命名净土随学
    rationale: 随信力勉强所学以便自览常自警策并愿法宝住世人人沾恩
  - date: '1875-07-01'
    title_zh: 然臂香四十八炷供养发愿
    rationale: 愿承随学善根早得见佛闻法早能说法利生
