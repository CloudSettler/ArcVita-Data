  - key: breakthrough
    name: 取精要类编成帙
    labels:
      zh: 成帙
    start_date: 1658-01-01
    highlight_event_id: guji-周克复-event-biancheng
  - key: climax
    name: 冬初书成自撰序文
    labels:
      zh: 序定
    start_date: 1659-10-01
    highlight_event_id: guji-周克复-event-xu
  - key: closure
    name: 敬订晨夕课以利日诵
    labels:
      zh: 课定
    start_date: 1659-11-01
    highlight_event_id: guji-周克复-event-ke
  decisions:
  - date: 1658-09-01
    title_zh: 单提称名兼收观想万行
    rationale: 称名简要三尺童子可办可通行末世，观想难成，故尊称名而统摄六度万行回向西方
  - date: 1659-11-01
    title_zh: 会事归理心境一如
    rationale: 理外无事浅外无深，摄心念佛即是修悟自性惟心之工夫，不堕空谈，亦不执土议心
- id: guji-周克复-endeavor-2
  title_zh: 辑金刚法华持验并劝流通广布
  summary: 先辑金刚法华持验诸纪，既成晨钟，复以同善道人名作劝流通引，恳人广刻传布自利利他
  phases:
  - key: brewing
    name: 戊戌秋辑金刚持验
    labels:
      zh: 辑验
    start_date: 1658-09-01
    highlight_event_id: guji-周克复-event-jijin
  - key: breakthrough
    name: 兼辑法华华严观音感通
    labels:
      zh: 广辑
    start_date: 1659-01-01
    highlight_event_id: guji-周克复-event-biancheng
  - key: climax
    name: 作劝流通引谛信力行
    labels:
      zh: 劝流通
    start_date: 1659-11-01
    highlight_event_id: guji-周克复-event-quan
  - key: closure
    name: 以同善道人名恳广布
    labels:
      zh: 广布
    start_date: 1660-01-01
    highlight_event_id: guji-周克复-event-quan
  decisions:
  - date: 1658-09-01
    title_zh: 以持验征信古今
    rationale: 搜采载籍征信古今颇殚心手，令人见闻欣慕，一句赞扬即是获持善根，一念鼓动即消罪业
  - date: 1659-11-01
    title_zh: 劝人刻施不吝原本
    rationale: 劝一人修净土即成就一众生成佛，法施功德不可思议，或仍原本或易新编，皆可庄严佛土续佛慧命
events:
