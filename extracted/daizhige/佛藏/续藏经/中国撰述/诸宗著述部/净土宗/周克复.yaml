- id: guji-周克复-event-jijin
  date: 1658-09-01
  year_of: 1658
  title_zh: 辑金刚法华持验诸纪
  place_zh: 阳羡
  description: 戊戌秋辑金刚持验诸纪，又以净土简捷通贯，萌意裒集古今表章是教者
- id: guji-周克复-event-biancheng
  date: 1659-01-01
  year_of: 1659
  title_zh: 类编晨钟十卷初成
  place_zh: 阳羡
  description: 取古今之书裒其精要类而编之，分原始启信劝修念佛功行策进饬终正辨了俗持验，冬初书成
- id: guji-周克复-event-xu
  date: 1659-11-01
  year_of: 1659
  title_zh: 顺治己亥阳月自撰晨钟序
  place_zh: 阳羡
  description: 顺治己亥阳月，盥沐撰净土晨钟自序，明生死大事，辨惟心即土，会禅净理事一心不乱
- id: guji-周克复-event-ke
  date: 1659-11-15
  year_of: 1659
  title_zh: 敬订净土晨夕课诵
  place_zh: 阳羡
  description: 敬订晨课观经上品上生章心经念佛章，夕课弥陀经往生咒念佛文，以利在家日诵专持
- id: guji-周克复-event-quan
  date: 1659-12-01
  year_of: 1659
  title_zh: 作劝流通引恳广布
  place_zh: 阳羡
  description: 以同善道人名作劝流通引，恳同人广刻晨钟及金刚法华华严观音持验，自利利他续佛慧命
- id: guji-周克复-event-death
  date: 1680-01-01
  year_of: 1680
  title_zh: 清初以后安逝
  place_zh: 阳羡
  description: 清初以后卒，卒年不详，日常摄心念佛，以净业终，约计于此
  is_circa: true
