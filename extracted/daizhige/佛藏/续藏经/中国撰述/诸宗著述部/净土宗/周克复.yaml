  birth_date: 1615-01-01
  death_date: 1680-01-01
  era: 清
  reign_ref: 顺治
  archetype: 净土居士
  dilemmas:
  - 生死大事当如何了当，忘讳交困
  - 舍浊取净与即浊即净当何从
  - 禅净权实深浅圣凡当如何会通
  lesson: 摄心念佛真实做去，心净则土净，生死可了，同归一心不乱
  summary_first_person: 吾为阳羡净业弟子，感生死事大，取古今表章净土者之精要，类编晨钟十卷，兼订晨夕课诵，愿以朝气警甜梦者，劝人人念佛求生，同归极乐
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
  - https://kanripo.org/text/KR6p0091/
endeavors:
- id: guji-周克复-endeavor-1
  title_zh: 裒集古今表章净土编成晨钟十卷
  summary: 以净土为简捷通贯之门，分类编次原始启信劝修念佛功行策进饬终正辨了俗持验，兼订晨夕课诵以利日持
  phases:
  - key: brewing
