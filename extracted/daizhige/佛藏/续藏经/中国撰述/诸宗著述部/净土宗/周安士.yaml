endeavors:
- id: guji-周安士-endeavor-1
  title_zh: 戒杀戒淫著书劝世
  summary_zh: 以淫杀二业为众罪大半，发誓终身不杀，著万善先资欲海回狂以救度
  phases:
  - key: brewing
    name: 通经信土
    labels:
      zh:
      - 博通经藏
      - 深信净土
    start_date: '1670'
    highlight_event_id: guji-周安士-event-birth
  - key: breakthrough
    name: 神前立誓
    labels:
      zh:
      - 过神祠祝愿
      - 不受血食
    start_date: '1679'
    highlight_event_id: guji-周安士-event-vow
  - key: climax
    name: 二书告成
    labels:
      zh:
      - 万善先资戒杀
      - 欲海回狂戒淫
    start_date: '1710'
    highlight_event_id: guji-周安士-event-jieyin
  - key: closure
    name: 流布遐迩
    labels:
      zh:
      - 恳切深痛
      - 劝世回头
    start_date: '1720'
    highlight_event_id: guji-周安士-event-jieyin
  decisions:
  - date: '1679'
    title_zh: 二十四岁自誓终身不杀
    rationale: 自今二十四岁直至寿尽，若杀一鱼虾乃至伤一蚊蚁，愿神纠殛，以此坚志化众
  - date: '1710'
    title_zh: 著戒杀戒淫二书
    rationale: 众生造无量罪，唯淫杀居大半，先观胎狱不净无常以息淫，先怀慈悲救度以止杀
- id: guji-周安士-endeavor-2
  title_zh: 汇辑西归直指弘扬净土
  summary_zh: 节录大小弥陀要旨为净土纲要，广破疑问，杂说启信，搜往生事略，共成四卷
  phases:
  - key: brewing
    name: 会通儒佛
    labels:
      zh:
      - 昆山诸生
      - 出入儒佛
    start_date: '1690'
    highlight_event_id: guji-周安士-event-vow
  - key: breakthrough
    name: 立纲释疑
    labels:
      zh:
      - 净土纲要
      - 疑问指南
    start_date: '1725'
    highlight_event_id: guji-周安士-event-xigui
  - key: climax
    name: 四卷告成
    labels:
      zh:
      - 启信杂说
      - 往生事略
    start_date: '1730'
    highlight_event_id: guji-周安士-event-xigui
  - key: closure
    name: 预知西归
    labels:
      zh:
      - 与家人诀
      - 谈笑而逝
    start_date: 1739-02
    highlight_event_id: guji-周安士-event-death
  decisions:
  - date: '1730'
    title_zh: 辑西归直指四卷
    rationale: 将弥陀要旨节录其概，使阅者一览便知，以一门普摄三根，直指西方
  - date: 1739-02
    title_zh: 乾隆四年正月与家人诀别
    rationale: 自言将西归，却香汤沐浴，谈笑而逝，以身证念佛往生之验
events:
- id: guji-周安士-event-birth
  title_zh: 出生于昆山
  date: '1656'
  year_of: 1656
  place_zh: 昆山
  description: 周梦颜一名思仁字安士，昆山诸生，博通经藏，生于康熙初年
- id: guji-周安士-event-vow
  title_zh: 二十四岁神前立戒杀誓
  date: '1679'
  year_of: 1679
  description: 每过神祠祝愿尊神发出世心勿受血食，自誓终身不杀生，见鱼鸟唯思救度，见杀生则称佛发救度心
- id: guji-周安士-event-jieyin
  title_zh: 著万善先资欲海回狂
  date: '1710'
  year_of: 1710
  description: 著戒杀书名万善先资言多恳切，著戒淫书名欲海回狂以胎狱不净白骨诸观为息淫方便，究竟发愿往生极乐永脱淫阱
- id: guji-周安士-event-xigui
  title_zh: 汇辑西归直指四卷
  date: '1730'
  year_of: 1730
  description: 自号怀西居士，辑西归直指四卷，卷一净土纲要，卷二疑问指南，卷三启信杂说，卷四往生事略
- id: guji-周安士-event-death
  title_zh: 乾隆四年正月谈笑西归
  date: 1739-02
  year_of: 1739
  place_zh: 昆山
  description: 乾隆四年正月与家人诀云将西归，却香汤沐浴，谈笑而逝，异香郁然满室，年八十四
