  date: '1717'
  year_of: 1717
  place_zh: 江苏昆山
  description_zh: 撰西归直指等篇，劝戒杀放生，明九类皆当往生，人间胜事无如念佛。
- id: guji-周思仁-event-preach-jingtu
  title_zh: 普劝僧俗同修净土
  date: '1730'
  year_of: 1730
  place_zh: 江南
  description_zh: 劝为僧高僧皆修净土，不可甘心作鬼，以调马四法恩威并施化众。
- id: guji-周思仁-event-death
  title_zh: 示寂
  date: '1739'
  year_of: 1739
  place_zh: 江苏昆山
  description_zh: 清乾隆四年示寂，一生以善书弘净土，遗书流通后世。
