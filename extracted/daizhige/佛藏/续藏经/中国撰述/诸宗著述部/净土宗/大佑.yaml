endeavors:
- id: guji-大佑-endeavor-1
  title_zh: 编辑净土指归集十门
  summary: 遍采大藏经论及历代祖师净土著述立十门以原教明宗显相辨观示行
  phases:
  - key: brewing
    name: 发愿搜采教典
    labels:
      zh: 酝酿搜集
    start_date: 1615-01-01
    highlight_event_id: guji-大佑-event-collect
  - key: breakthrough
    name: 分判十门纲领
    labels:
      zh: 立纲判教
    start_date: 1620-01-01
    highlight_event_id: guji-大佑-event-complete
  - key: closure
    name: 成书上下两卷
    labels:
      zh: 集成流通
    start_date: 1628-01-01
    highlight_event_id: guji-大佑-event-complete
  decisions:
  - date: 1620-01-01
    title_zh: 立原教宗旨法相观慧行法五门为卷上
    rationale: 欲使初心先明教起之缘次达心观之宗再辨难易定散然后入观修行故以上半统教理下半统事修
  - date: 1626-01-01
    title_zh: 立证验决疑斥谬指广劝修五门为卷下
    rationale: 恐学者疑谬未除信心不坚故引古今往生证验广破群疑呵斥邪执会归华严法华而终以劝修
- id: guji-大佑-endeavor-2
  title_zh: 住持吴郡北禅寺弘扬念佛
  summary: 居吴郡北禅寺以念佛三昧接引僧俗倡晨朝十念礼忏发愿回向之行
  phases:
  - key: brewing
    name: 掩关阅藏专修净业
    labels:
      zh: 潜修用功
    start_date: 1610-01-01
    highlight_event_id: guji-大佑-event-collect
  - key: climax
    name: 北禅开堂示众劝修
    labels:
      zh: 弘化劝信
    start_date: 1632-01-01
    highlight_event_id: guji-大佑-event-preach
  - key: closure
    name: 以指归付嘱后学
    labels:
      zh: 付嘱流通
    start_date: 1638-01-01
    highlight_event_id: guji-大佑-event-preach
  decisions:
  - date: 1632-03-01
    title_zh: 日用系缘高声念佛兼修观想
    rationale: 见末世众生散乱难调故以持名为正行以十六观及般舟为助行令理事双进现生获福临终正念
  - date: 1635-06-01
    title_zh: 严持戒律孝养读诵以助净业
    rationale: 以三种净业为往生正因为僧念佛为众善相资故劝具众戒发菩提心亲近善友免因循误事
