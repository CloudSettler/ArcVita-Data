endeavors:
- id: guji-妙空子-endeavor-1
  title_zh: 撰述莲邦消息九品阐明往生正路
  description: 融摄华严法界性相与天台贤首诸宗义理，立九品次第，破背觉合尘之迷，指念佛往生之的
  phases:
  - key: brewing
    name: 烟水潜修观察轮回
