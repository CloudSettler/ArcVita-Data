person:
  qid: guji-妙空子
  name_zh: 妙空子
  names:
    zh: 妙空子
    en: Miaokongzi
  lifespan:
    birth:
      date: '1830'
      precision: year
      is_circa: true
      raw: 生年不详，约清道光咸丰间
    death:
      date: '1880'
      precision: year
      is_circa: true
      raw: 同治十年之后，卒年不详
  birth_date: '1830'
  death_date: '1880'
  era: 清
  reign_ref: 同治
  archetype: 净土弘化者
  dilemmas:
  - 真心本自清净圆明，如何因一念无明而流转六道
  - 众生根器不等习气深重，如何以一句弥陀普摄三根同归极乐
  lesson: 一念不觉即成轮回，一句弥陀即是归家，但肯至诚念佛，便可横超三界同生安乐
  summary_first_person: 吾寄迹百城烟水，亲见众生背觉合尘，生死不休，乃发心撰述莲邦消息，立性相光明至身土圆融九品，劝人不论贤愚老少，但将一句阿弥陀佛勤勤忆念，念至一心不乱，自然心花开明，往生九品，不退菩提
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%87%80%E5%9C%9F%E5%AE%97/%E8%8E%B2%E9%82%A6%E6%B6%88%E6%81%AF.html
