      - 抉择
      - 立纲
    start_date: '1870'
    highlight_event_id: guji-妙空子-event-write
  - key: climax
    name: 同治十年冬书成全编
    labels:
      zh:
      - 撰述
      - 圆成
    start_date: '1871'
    highlight_event_id: guji-妙空子-event-write
  - key: closure
    name: 自序归家付嘱流通
    labels:
      zh:
      - 付嘱
      - 回向
    start_date: '1871-12-01'
    highlight_event_id: guji-妙空子-event-publish
  decisions:
  - date: '1870'
    title_zh: 不立深玄论辩专指一句弥陀
    rationale: 为摄禅教律及无专法之人，故舍繁论，以自性弥陀唯心净土摄一切行，令老少贤愚皆得下手
  - date: '1871'
    title_zh: 以九品层层解说兼附戒恶劝善
    rationale: 众生杀盗淫妄习气难除，故先明性相光明与背觉合尘，次示轮回消息，终归极乐，并附驻云飞临江仙以戒十恶
- id: guji-妙空子-endeavor-2
  title_zh: 劝募刊刻普劝众善女人檀施流布
  description: 联合善女人及众檀施，刊刻莲邦消息，广劝念佛求生极乐，回此功德利益有情
  phases:
  - key: brewing
    name: 发起刊刻回向之愿
    labels:
      zh:
      - 发愿
      - 劝募
    start_date: '1871'
    highlight_event_id: guji-妙空子-event-write
  - key: breakthrough
    name: 感得善信乐助刻版
    labels:
      zh:
      - 感通
      - 助刻
    start_date: '1871-11-01'
    highlight_event_id: guji-妙空子-event-publish
  - key: climax
    name: 同治十年冬刊成流布
    labels:
      zh:
      - 刊刻
      - 流布
    start_date: '1871-12-01'
    highlight_event_id: guji-妙空子-event-publish
  - key: closure
    name: 回向同生安乐佛国为家
    labels:
      zh:
      - 回向
      - 同生
    start_date: '1872'
    highlight_event_id: guji-妙空子-event-publish
  decisions:
  - date: '1871-11-01'
    title_zh: 托善女人檀越共成刻事
    rationale: 净土法门尤关女众解脱，故令众善女人兼众檀施共植福田，以刊刻因缘广结往生之缘
  - date: '1871-12-01'
    title_zh: 以流通功德回向法界有情
    rationale: 独善不如兼善，故不私著述为己有，愿回此功德，令见闻者同生极乐，净土圆现，娑婆顿空
events:
- id: guji-妙空子-event-birth
  title_zh: 降生
  date: '1830'
  year_of: 1830
  description: 生于清代，年月不详，约道光咸丰间，宿具净土善根
- id: guji-妙空子-event-settle
  title_zh: 栖止百城烟水之居
  date: '1868'
  year_of: 1868
  description: 栖心百城烟水之居，专修念佛，观察娑婆大千世界相与众生轮回之苦，酝酿著述
- id: guji-妙空子-event-write
  title_zh: 撰成莲邦消息九品
  date: '1871'
  year_of: 1871
  description: 同治十年间撰成莲邦消息，自性相光明品至身土圆融品凡九品，阐明阿弥陀佛无量光明，劝各宗各派皆须念佛往生
- id: guji-妙空子-event-publish
  title_zh: 自序刊刻劝众流布
  date: '1871-12-01'
  year_of: 1871
  description: 同治十年冬自书序文于百城烟水之居，托诸善女人兼众檀施刊刻流布，回此功德利益有情同生安乐
- id: guji-妙空子-event-death
  title_zh: 示寂
  date: '1880'
  year_of: 1880
  description: 刊经之后行化不详，示寂年月不传，世但传其莲邦消息劝化之功
