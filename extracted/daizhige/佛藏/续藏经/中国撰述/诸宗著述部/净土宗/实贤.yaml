endeavors:
- id: guji-实贤-endeavor-1
  title_zh: 注解东海若明信毁二机
  description_zh: 以海神喻宏法大士，以二瓠喻信毁二机，抉石破瓠示出离之路，明去取利害
  phases:
  - key: brewing
    name: 愍知见不同而发解心
    labels:
      zh: 发起
    start_date: 1686
    highlight_event_id: guji-实贤-event-birth
  - key: breakthrough
    name: 以二瓠海水释信毁缘起
    labels:
      zh: 阐释
    start_date: 1732
    highlight_event_id: guji-实贤-event-annotate
  - key: climax
    name: 示抉石破瓠荡秽归海
    labels:
      zh: 显理
    start_date: 1732
    highlight_event_id: guji-实贤-event-annotate
  - key: closure
    name: 结信毁得失以明去取
    labels:
      zh: 结归
    start_date: 1732
    highlight_event_id: guji-实贤-event-annotate
  decisions:
  - date: 1732
    title_zh: 申明深文奥义为初机劝发
    rationale: 怜残编断简莫之通达，故解释东海若以助初机信解
  - date: 1732
    title_zh: 判执理为偏空断空非真空
    rationale: 守一废事则大患至，故须性事圆融修证不无以破谬执
- id: guji-实贤-endeavor-2
  title_zh: 陈西方事弘念佛三昧
  description_zh: 示自力难他力易，劝无念而念无生而生，得去群恶集万行同佛知见
  phases:
  - key: brewing
    name: 审自力不足问若何出离
    labels:
      zh: 审机
    start_date: 1733
    highlight_event_id: guji-实贤-event-preach
  - key: breakthrough
    name: 陈西方依正劝修三昧
    labels:
      zh: 劝修
    start_date: 1733
    highlight_event_id: guji-实贤-event-preach
  - key: climax
    name: 明一空有生则决定生去则实不去
    labels:
      zh: 融通
    start_date: 1733
    highlight_event_id: guji-实贤-event-preach
  - key: closure
    name: 示不念佛终与十二类同
    labels:
      zh: 警策
    start_date: 1734
    highlight_event_id: guji-实贤-event-death
  decisions:
  - date: 1733
    title_zh: 抉择去自力取他力念佛
    rationale: 藏教菩萨尚经三无数劫，末法唯念佛一生可办故劝专修
  - date: 1733
    title_zh: 示悟后愈急求生西方
    rationale: 惑业未断隔阴即迷，不如亲近导师直登佛地故劝往生
events:
- id: guji-实贤-event-birth
  title_zh: 出生
  date: 1686
  year_of: 1686
  description_zh: 清康熙二十五年丙寅生，法名实贤字思齐号省庵
- id: guji-实贤-event-annotate
  title_zh: 作东海若解
  date: 1732
  year_of: 1732
  description_zh: 解唐柳子厚东海若文，以性海二瓠粪水等喻，明信者归海毁者处臭之利害
- id: guji-实贤-event-preach
  title_zh: 陈西方事劝念佛三昧
  date: 1733
  year_of: 1733
  description_zh: 为顺教修行士陈西方之事，使修念佛三昧，一空有而去群恶集万行
- id: guji-实贤-event-death
  title_zh: 示寂
  date: 1734
  year_of: 1734
  description_zh: 清雍正十二年甲寅示寂，居圣者之地，同佛知见之旨以终
