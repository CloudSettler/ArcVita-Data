  era: 清
  reign_ref: 康熙至雍正
  archetype: 净土弘法高僧
  dilemmas:
  - title_zh: 执理废事与事理圆融之抉择
    description_zh: 偏空执性拨无修证则大患至，须性事一而二二而一，即妄观真以显真空
  - title_zh: 自力难超与他力易生之去取
    description_zh: 末法自力出生死旷劫未成，唯念佛兼仗他力一生可办，须知难易以定去取
  lesson: 知利害而去执理取念佛，无念而念无生而生，同佛知见以出生死
  summary_first_person: 我见习儒者置佛理于弗究，学佛者漫不经心于文字，聪明者多阙信根，具信者复无智慧，致深文奥义韬晦残编，故申明柳子厚东海若之义，劝初机一心念佛，同归性海
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%87%80%E5%9C%9F%E5%AE%97/%E4%B8%9C%E6%B5%B7%E8%8B%A5%E8%A7%A3.html
