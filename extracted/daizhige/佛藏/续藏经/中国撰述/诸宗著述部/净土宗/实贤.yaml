    en: Shixian
  lifespan:
    birth:
      date: '1686'
      precision: year
      is_circa: false
      raw: 康熙二十五年
    death:
      date: '1734'
      precision: year
      is_circa: false
      raw: 雍正十二年
  birth_date: '1686'
  death_date: '1734'
  era: 清
  reign_ref: 康熙至雍正
  archetype: 高僧
  dilemmas:
  - 初机钝根尚难开解圆理，而净土法门属圆教，不明圆理则非圆人
  - 但求自利往生则堕小乘，而普愿利他回入娑婆方名大士
  lesson: 发菩提心为正因，专心持名为助缘，忏悔立誓回向俱圆方成往生正行
  summary_first_person: 我是东吴虞山沙弥实贤，雍正四年在海南蛟门海云精舍为云栖莲池大师西方发愿文作注，我以发菩提心忏悔立誓求生回入总摄六章，欲令初机亦通圆理而实行自他俱利之净业
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%87%80%E5%9C%9F%E5%AE%97/%E8%A5%BF%E6%96%B9%E5%8F%91%E6%84%BF%E6%96%87%E6%B3%A8.html
endeavors:
- id: guji-实贤-endeavor-1
  title_zh: 注解西方发愿文阐明圆教净土
  summary: 以六章判摄愿文，归无作四谛与称性回向，变换名相以逗初机
  phases:
  - key: brewing
    name: 感云栖略注未发理致
    labels:
      zh: 发心
    start_date: '1725'
    highlight_event_id: guji-实贤-event-zhushu
  - key: breakthrough
    name: 判六章始终备足
    labels:
      zh: 立义
    start_date: '1726'
    highlight_event_id: guji-实贤-event-zhushu
  - key: climax
    name: 海云精舍成注作叙
    labels:
      zh: 成注
    start_date: '1726-12-25'
    highlight_event_id: guji-实贤-event-zhushu
  - key: closure
    name: 示行愿深广劝力行
    labels:
      zh: 劝行
    start_date: '1727'
    highlight_event_id: guji-实贤-event-hongfa
  decisions:
  - date: '1726'
    title_zh: 不惮繁文复为注释
    rationale: 云栖但明大意而理致蕴而未发，为令钝根开解故详释事理
  - date: '1726-12-25'
    title_zh: 以无作四谛释四宏誓愿
    rationale: 愿不依谛名为狂愿，非无作不名深，故必归本性具足以发圆愿
- id: guji-实贤-endeavor-2
  title_zh: 住持弘法倡导发菩提心念佛
  summary: 以信愿行为宗，专主西方，接引四恩三有法界众生同生安养再回娑婆
  phases:
  - key: brewing
    name: 虞山出家熏习教观
    labels:
      zh: 出家
    start_date: '1708'
    highlight_event_id: guji-实贤-event-chujia
  - key: breakthrough
    name: 专志净土阐发愿要义
    labels:
      zh: 专修
    start_date: '1726'
    highlight_event_id: guji-实贤-event-zhushu
  - key: climax
    name: 领众持名劝发大心
    labels:
      zh: 化众
    start_date: '1730'
    highlight_event_id: guji-实贤-event-hongfa
  - key: closure
    name: 以身示现期生安养
    labels:
      zh: 示寂
    start_date: '1734'
    highlight_event_id: guji-实贤-event-death
  decisions:
  - date: '1726'
    title_zh: 专劝西方不杂余方
    rationale: 弥陀与此土缘深且依正超胜，兜率难生药师非专，故一其志念以定趣向
  - date: '1730'
    title_zh: 以发菩提心为往生正因
    rationale: 不发大心不与弥陀本愿相应，不专念佛亦不往生，故心佛并举以成助正
events:
- id: guji-实贤-event-birth
  title_zh: 生于常熟时氏
  date: '1686'
  year_of: 1686
  description: 康熙二十五年生长江之南常熟，俗姓时，后字思齐号省庵
- id: guji-实贤-event-chujia
  title_zh: 虞山出家受具修学
  date: '1708'
  year_of: 1708
  description: 年二十余于虞山出家为沙弥，广习天台圆教，专志求生净土
- id: guji-实贤-event-zhushu
  title_zh: 海云精舍注成西方发愿文
  date: '1726-12-25'
  year_of: 1726
  description: 雍正四年嘉平月既望于海南蛟门海云精舍作叙成注，判六章明发心忏悔立誓求生回入回向
- id: guji-实贤-event-hongfa
  title_zh: 领众弘扬净土圆行
  date: '1730'
  year_of: 1730
  description: 住持弘法劝专心持念万德洪名，普为四恩三有法界众生发一乘无上菩提
- id: guji-实贤-event-death
  title_zh: 示寂往生安养
  date: '1734'
  year_of: 1734
  description: 雍正十二年示寂，世寿四十有九，一生注述劝勉以信愿持名为归
