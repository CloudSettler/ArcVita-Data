person:
  qid: guji-宽量
  name_zh: 宽量
  names:
    zh: 宽量
    en: Kuanliang
  lifespan:
    birth:
      date: '1850'
      precision: year
      is_circa: true
      raw: 四明鄞县应氏子，生年不详，约清末道咸间
    death:
      date: '1905'
      precision: year
      is_circa: true
      raw: 卒年不详，光绪末后事迹不传
  birth_date: '1850'
  death_date: '1905'
  era: 清
  reign_ref: 光绪
  archetype: 净土弘化僧
  dilemmas:
  - 志慕宗乘参究念佛是谁久而未达，如何安住一心
  - 事理偏执或信自心无西方或执西来昧自心，如何圆通不堕邪见
  - 末法钝根多犯戒失人身，如何以严净毗尼为往生正因
  lesson: 重实行戒专修一心念佛，以信愿行三门为往生标准，事理圆通方登救生船。
  summary_first_person: 吾四明鄞县应氏子，字源海，号澹云，又号西舵。年二十祝发出家，受具于天童。曾参宗乘，复专念六字，栖隐玉泉白沙泉及南山六通，敬写华严，集净土救生船诗四十八篇，自注经论，普劝同出苦海，同生净土。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/净土宗/净土救生船诗.md
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/净土宗/净土救生船诗.html
endeavors:
- id: guji-宽量-endeavor-1
  title_zh: 出家参究转归专修念佛
  summary_zh: 幼弃诗书慕清凉，年二十祝发天童受具，参广昱和尚楞严征心，遍参诸方念佛是谁，后遵师命专念六字，栖隐持戒观照楞严宗镜。
  phases:
  - key: brewing
    name: 弃俗祝发
    labels:
      zh:
      - 出家受具
    start_date: '1870'
    highlight_event_id: guji-宽量-event-tonsure
  - key: breakthrough
    name: 参究开示
    labels:
      zh:
      - 宗乘参究
    start_date: '1880'
    highlight_event_id: guji-宽量-event-canchan
  - key: climax
    name: 专修持名
    labels:
      zh:
      - 一心念佛
    start_date: '1891'
    highlight_event_id: guji-宽量-event-zhuanxiu
  - key: closure
    name: 持戒安居
    labels:
      zh:
      - 严净毗尼
    start_date: '1894'
    highlight_event_id: guji-宽量-event-anjing
  decisions:
  - date: '1870'
    title_zh: 决志祝发受具天童
    rationale: 恶尘俗慕清凉，宿树正因，愿世世出家宏宣正法
  - date: '1880'
    title_zh: 再造天童请益楞严七处征心
    rationale: 志慕宗乘信而犹豫，欲达无生之体，依广昱和尚棒喝开示见地
  - date: '1891'
    title_zh: 恪遵师命惟念六字真言
    rationale: 参究既久祇得轻安，阅净土经论大智度论，知万行无亏一毫不舍，遂信愿弥坚密密持名
- id: guji-宽量-endeavor-2
  title_zh: 集注净土救生船诗弘化
  summary_zh: 立愿敬写华严，神会中得净土诗四十八篇，广搜经论汇纂注解，发明三观圆修事理一心，劝孝戒淫严持戒律，蒙徐莲臣劝付梨枣流通。
  phases:
  - key: brewing
    name: 立愿写经
    labels:
      zh:
      - 敬写华严
    start_date: '1894'
    highlight_event_id: guji-宽量-event-anjing
  - key: breakthrough
    name: 得诗注疏
    labels:
      zh:
      - 四十八篇成
    start_date: '1896'
    highlight_event_id: guji-宽量-event-chengshu
  - key: climax
    name: 付梓流通
    labels:
      zh:
      - 救生船行世
    start_date: '1896'
    highlight_event_id: guji-宽量-event-chengshu
  - key: closure
    name: 同登愿船
    labels:
      zh:
      - 回向菩提
    start_date: '1896'
    highlight_event_id: guji-宽量-event-chengshu
  decisions:
  - date: '1894'
    title_zh: 影不出山立愿敬写华严回向莲根
    rationale: 顿忘肤见滋润莲根永固，普为群灵敬述兹集求佛加被
  - date: '1896'
    title_zh: 广搜经论注四十八篇名净土救生船
    rationale: 举六字摄无边教海，标宗引证令眠云立雪者栖心净土，究理探玄者尽入圆宗
  - date: '1896'
    title_zh: 受徐莲臣劝付梨枣流通
    rationale: 药无贵贱启病者良，法无精粗救时为要，不可怀悭秘而不传
events:
- id: guji-宽量-event-birth
  title_zh: 生于四明鄞县应氏
  date: '1850'
  year_of: 1850
  place_zh: 四明鄞县
  description_zh: 应氏子，赋性懒戆，幼弃诗书，及长恶尘俗，惟慕清凉欢喜跏趺默坐。
- id: guji-宽量-event-tonsure
  title_zh: 年二十祝发出家受具天童
  date: '1870'
  year_of: 1870
  place_zh: 太白山天童名蓝
  description_zh: 年满二十决志祝发染衣，入空门皈依佛海，受具于天童，愿博通儒典了悟心宗宏宣正法。
- id: guji-宽量-event-canchan
  title_zh: 参广昱和尚及诸方念佛是谁
  date: '1880'
  year_of: 1880
  place_zh: 天童东湖青山寺
  description_zh: 再造天童顶礼广昱和尚请益楞严七处征心，蒙当头一棒反覆开示，退院后侍左右获见地，复往诸方参究念佛是谁。
- id: guji-宽量-event-zhuanxiu
  title_zh: 栖玉泉白沙泉专修六字持名
  date: '1891'
  year_of: 1891
  place_zh: 杭州玉泉白沙泉护国寺
  description_zh: 携钵来杭与精觉同居茅茨，阅净土经论回向绵续，遵师命惟念六字，课余思惟经义，辛卯夏梦现赤白莲华光明晔晔，气爽神清密密不辍。
- id: guji-宽量-event-anjing
  title_zh: 移南山六通安居阅宗镜立愿写经
  date: '1894'
  year_of: 1894
  place_zh: 南山六通兰若
  description_zh: 甲午秋再移南山影不出山，细阅永明宗镜录唯心诀万善同归，悟纵未明道眼也须成就净身，作偈明志，立愿敬写华严回向。
- id: guji-宽量-event-chengshu
  title_zh: 集注净土救生船诗四十八篇成蒙俞樾序
  date: '1896-03-15'
  year_of: 1896
  place_zh: 南山右台仙馆
  description_zh: 得净土诗四十八篇每篇七言四句广注经论，发明三观圆修事理一心，归本信愿行劝孝戒淫，光绪丙申仲春自序，徐莲臣劝付梨枣，俞樾夏六月作序冬十月再题。
- id: guji-宽量-event-death
  title_zh: 示寂事迹不传
  date: '1905'
  year_of: 1905
  place_zh: 浙江
  description_zh: 著述流通后行履湮微，卒年不详，惟以救生船诗普愿法界众生同出六道沉沦苦海同游九品果海。
