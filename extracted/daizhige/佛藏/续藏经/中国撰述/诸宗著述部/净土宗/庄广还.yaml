  summary_first_person: 吾少承儒业以母疾兼学医几二十余载数奇无闻弃而从事于玄口诀无传几成奇疾遂构小园吟咏见花荣悴悟盈虚毁园闭户习静取金刚诵之万历乙酉泛舟武林得翁指示徒步云栖扣关谒莲池师授净业五戒名广还日课五万声恍若有得思见性度生以法施胜财施遂分六卷成净土资粮复补辑为全集就正于师重蒙校正授菩萨戒终身经历皆命皆天而以教立命尽人合天者资粮之功莲师之启也
