    name: 抚苏劝戒严禁捕鱼署中不杀生
    labels:
      zh: 封疆劝善
    start_date: 1824
    highlight_event_id: guji-张师诚-event-fusu-1824
  - key: closure
    name: 长斋奉佛自号一西居士
    labels:
      zh: 栖心净土
    start_date: 1825-01
    highlight_event_id: guji-张师诚-event-jingzhongjing-1825
  decisions:
  - date: 1824
    title_zh: 署中不晏客不杀生严放生河捕鱼之禁
    rationale: 苏城杀业甚伙，欲以劝善戒杀佐治功，息恶刑全物命，化民成俗以全净业之助行
  - date: 1825-01
    title_zh: 以圣制传灯净土文弁卷首
    rationale: 彰正教佐治功，先破沈迷方可引之入胜，示从善去恶为修净根源
- id: guji-张师诚-endeavor-2
  title_zh: 辑径中径又径弘扬净土
  summary: 嘉庆甲戌择前贤净土论说精语辑径资浅切编，后见荆溪周克复净土晨钟先得我心，道光五年正月重加订定删繁增备，以信愿行为大纲改名径中径又径付梓，后附净土歌咏自作数十首最为警切
  phases:
  - key: brewing
    name: 取前贤论说辑径资浅切编
    labels:
      zh: 择语辑集
    start_date: 1814
    highlight_event_id: guji-张师诚-event-jingzi-1814
  - key: breakthrough
    name: 见晨钟先得我心重加订定
    labels:
      zh: 醒迷发端
    start_date: 1824
    highlight_event_id: guji-张师诚-event-fusu-1824
  - key: climax
    name: 道光五年正月辑成径中径又径自序付梓
    labels:
      zh: 径路弘法
    start_date: 1825-01
    highlight_event_id: guji-张师诚-event-jingzhongjing-1825
  - key: closure
    name: 乞假归里静居斗室一意西驰临终安逝
    labels:
      zh: 饬终示验
    start_date: 1828
    highlight_event_id: guji-张师诚-event-guili-1828
  decisions:
  - date: 1814
    title_zh: 择前贤精语辑径资浅切编
    rationale: 自愧根钝障深惟于净土信愿坚笃，欲广度有情普济含识，用作法施简要直捷接引末学
  - date: 1825-01
    title_zh: 改编名径中径又径删繁增备
    rationale: 以信愿行为大纲层递分门较有次第，取莲池持名是径路之中径而又径之义，醒迷发端开门见山令人深省
