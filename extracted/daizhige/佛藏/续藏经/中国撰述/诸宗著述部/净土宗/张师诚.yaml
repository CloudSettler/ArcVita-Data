endeavors:
- id: guji-张师诚-endeavor-1
  title_zh: 历任封疆抚苏劝善戒杀
  summary: 少年登科事父以孝闻，历任封疆为江苏巡抚，见苏城杀业甚伙屡出示劝戒，严放生河捕鱼之禁，署中不晏客不杀生，长斋奉佛栖心净土自号一西居士
  phases:
  - key: brewing
    name: 少年登科事父以孝闻
    labels:
