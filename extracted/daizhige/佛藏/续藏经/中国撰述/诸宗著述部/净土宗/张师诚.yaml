  dilemmas:
  - 居封疆显位任江苏巡抚，如何以劝善戒杀佐治功又不违出世本怀
  - 口念弥陀者多得生者少，如何以信愿行三足并重破沈迷引人真修
  lesson: 口虽念佛心中须善，积德修福孝亲忠君，从善去恶方为修净根源，信愿行缺一不可
  summary_first_person: 余张师诚，字心友，号一西居士，湖州归安人，少年登科第，历任封疆为江苏巡抚，见苏城杀业甚伙，屡示劝戒，严放生河捕鱼之禁，署中不晏客不杀生，长斋奉佛栖心净土，嘉庆甲戌辑径资浅切编，道光五年正月重订为径中径又径付梓，道光八年乞假归里静居斗室一意西驰，逾年诵弥陀经毕称佛五声而逝
