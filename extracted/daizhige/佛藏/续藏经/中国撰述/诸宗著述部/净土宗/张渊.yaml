events:
- id: guji-张渊-event-birth
  date: 1820-01-01
  year_of: 1820
  title_zh: 生于浙东剡南
  description_zh: 清中期约生于剡南，潜心儒释，尤志净土，号潜室
- id: guji-张渊-event-zhuanzhu
  date: 1873-12-01
  year_of: 1873
  title_zh: 撰念佛起缘弥陀观偈直解正文
  description_zh: 自阿弥陀佛身金色至九品咸令登彼岸逐句直解，发明三身八万四千相好光明及白毫绀目化佛菩萨四十八愿之义
- id: guji-张渊-event-zhixu
  date: 1874-05-01
  year_of: 1874
  title_zh: 同治甲戌孟夏作叙告成
  description_zh: 于剡南作念佛起缘观偈直解叙，溯灵山庐山天台至灵峰源流，斥以佛号作钱抵之谬，发明一念功德徧法界及唯心净土本性弥陀之旨
- id: guji-张渊-event-jiaokan
  date: 1874-07-01
  year_of: 1874
  title_zh: 联章梦仙等辑校刊行
  description_zh: 由章梦仙辑，楼仁深赵洪文戒肃莲芳同校，刊刻流通，以八句观偈接引老幼妇女，进劝阅灵峰净土十要
- id: guji-张渊-event-death
  date: 1890-12-31
  year_of: 1890
  title_zh: 清末约卒
  description_zh: 弘化乡里后约卒于清末，一生以念佛圆解接引初机，愿同生西方
