endeavors:
- id: guji-彭绍升-endeavor-1
  title_zh: 由儒入佛归心净土
  summary: 早年攻诗书慕皋夔，继而访道求仙，终回心西池，专修念佛，以知归子自号
  phases:
  - key: brewing
    name: 少习诗书志经世
    labels:
      zh: 儒学经世
    start_date: 1740
    highlight_event_id: guji-彭绍升-event-birth
  - key: breakthrough
    name: 叩元关服气求仙未安
    labels:
      zh: 访道求出离
    start_date: 1760
    highlight_event_id: guji-彭绍升-event-oushu
  - key: climax
    name: 回心西池作偶述明志
    labels:
      zh: 归心净土
    start_date: 1770
    highlight_event_id: guji-彭绍升-event-oushu
  - key: closure
    name: 以知归自任劝人念佛
    labels:
      zh: 自利利他
    start_date: 1771
    highlight_event_id: guji-彭绍升-event-chou
  decisions:
  - date: 1770
    title_zh: 作偶述四首自陈归向
    rationale: 历言儒仙皆梦，唯净土可归，断轮转因缘，得修持津要
  - date: 1771
    title_zh: 以戒杀慈恩劝同学
    rationale: 阎浮杀戮为食，怨结轮回，普宣梵网，成就淳风，共睹莲华
- id: guji-彭绍升-endeavor-2
  title_zh: 主盟二林唱和领众弘净
  summary: 邀汪元亮罗有高汪缙等以诗唱和，集为二林唱和诗，示远公六时之则
  phases:
  - key: brewing
    name: 寄偶述邀同袍唱和
    labels:
      zh: 以诗结缘
    start_date: 1770
    highlight_event_id: guji-彭绍升-event-oushu
  - key: breakthrough
    name: 竹香子和诗海潦卷辩
    labels:
      zh: 同心三千里
    start_date: 1771
    highlight_event_id: guji-彭绍升-event-chou
  - key: climax
    name: 酬竹香子并呈诸同学
    labels:
      zh: 领众同归
    start_date: 1771
    highlight_event_id: guji-彭绍升-event-chou
  - key: closure
    name: 集刻二林唱和诗传世
    labels:
      zh: 结集流通
    start_date: 1776
    highlight_event_id: guji-彭绍升-event-jieji
  decisions:
  - date: 1771
    title_zh: 酬和竹香子普呈同学
    rationale: 借莲华法喻及觉海一月之义，会儒释道同归念佛，坚同学信愿
  - date: 1776
    title_zh: 集诸家唱和付刻并属校订
    rationale: 使迦陵雅音与莲华香片并传，令后学睹末光而生信向
events:
- id: guji-彭绍升-event-birth
  title_zh: 诞生苏州彭氏
  date: 1740
  year_of: 1740
  description: 清乾隆五年诞生，名绍升，字允初，号尺木，后称知归子，法名际清
- id: guji-彭绍升-event-oushu
  title_zh: 作偶述四首自述归净
  date: 1770
  year_of: 1770
  description: 追述昔事诗书抗志皋夔，继叩元关求仙，终回心西池，远公课六时为则
- id: guji-彭绍升-event-chou
  title_zh: 酬竹香子并呈诸同学
  date: 1771
  year_of: 1771
  description: 答汪元亮和诗，更陈戒杀放生，莲华挺立，觉海无边，誓尽本形生为世间导
- id: guji-彭绍升-event-jieji
  title_zh: 二林唱和诗成集
  date: 1776
  year_of: 1776
  description: 罗有高自浙东过苏州见是册，叹为迦陵雅音，命校字违古者，距作诗时凡六年
- id: guji-彭绍升-event-death
  title_zh: 示寂
  date: 1796
  year_of: 1796
  description: 清嘉庆元年示寂，一生著述弘净，以居士身领袖净土，遗二林唱和等行世
