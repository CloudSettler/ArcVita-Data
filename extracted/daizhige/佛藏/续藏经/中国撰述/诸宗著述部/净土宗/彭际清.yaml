  description: 乾隆五年出生于江苏苏州吴县士族，字绍升，号知归学人
- id: guji-彭际清-event-gongju-begin
  title_zh: 受请校订西方公据旧本
  date: 1790
  year_of: 1790
  description: 吴门信士所集西方公据行世四十余年板渐模糊，属请校其得失，阅知诱掖颇勤而伦次谬误不可不正
- id: guji-彭际清-event-shengxian
  title_zh: 编成净土圣贤录居士传
  date: 1783
  year_of: 1783
