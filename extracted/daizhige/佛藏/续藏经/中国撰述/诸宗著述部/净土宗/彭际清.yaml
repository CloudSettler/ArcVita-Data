- id: guji-彭际清-event-gongju-compile
  title_zh: 重订七门付刻题叙
  date: 1792-06-01
  year_of: 1792
  description: 乾隆五十七年夏六月于文星阁僧舍完成重订，厘为起教大纲净业正因净课仪式西方境观往生功行莲宗开示往生现果七门，论东坡公据之失，劝三心具足一念往生
- id: guji-彭际清-event-death
  title_zh: 安然示寂
  date: 1796
  year_of: 1796
  description: 嘉庆元年示寂，一生以居士身弘护净土，遗下公据圣贤录居士传等流通后世
