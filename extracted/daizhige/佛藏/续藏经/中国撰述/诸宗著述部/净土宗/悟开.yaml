  archetype: 净土弘法僧
  dilemmas:
  - title_zh: 世乐即苦海当离欲求生
    description_zh: 世间富贵皆有忧愁造业受报当发愿出离不贪现世来世福报
  - title_zh: 真切念佛与世务牵缠相碍
    description_zh: 以念佛为切实事世务为外壳子事当即念即听说教持名系念不杂
  lesson: 苦海求离惟在信愿持名真切念佛以助道善心防障道恶心仗佛力往生极乐
  summary_first_person: 吾灵岩山下宝藏僧悟开也见世间纯苦故述净业知津劝人皈依南无阿弥陀佛发愿往生西方以真切念佛戒杀恭敬为助道以亲近真师友为要至临终亡命念佛必蒙接引
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%87%80%E5%9C%9F%E5%AE%97/%E5%87%80%E4%B8%9A%E7%9F%A5%E6%B4%A5.html
