endeavors:
- id: guji-悟开-endeavor-1
  title_zh: 述净业知津开示念佛往生
  summary_zh: 为优婆夷唐贞女述净业知津以粗浅语明信愿持名临终接引之要兼立朝暮功课礼拜忏悔之法
  phases:
  - key: brewing
    name: 发心述书
    labels:
      zh:
      - 优婆夷请述
      - 粗浅易明
    start_date: 1828-01-01
    highlight_event_id: guji-悟开-event-xing
  - key: breakthrough
    name: 示念佛妙诀
    labels:
      zh:
      - 即念即听
      - 系念弥陀
    start_date: 1828-06-01
    highlight_event_id: guji-悟开-event-fa
  - key: climax
    name: 定功课礼拜
    labels:
      zh:
      - 弥陀经往生咒
      - 四十八拜忏愿
    start_date: 1829-01-01
    highlight_event_id: guji-悟开-event-ke
  - key: closure
    name: 付梓流通
    labels:
      zh:
      - 黄居士捐梓
      - 道光己丑刊行
    start_date: 1829-03-01
    highlight_event_id: guji-悟开-event-zi
  decisions:
  - date: 1828-06-01
    title_zh: 立信愿持名为正主
    rationale: 不求现世来世好处只求临终一心念佛蒙佛光明接引莲华化生
  - date: 1829-01-01
    title_zh: 定朝暮专精不夹杂
    rationale: 朝暮以弥陀经往生咒念佛回向拜佛为正课大乘经咒另作午课高王经等非藏经所载皆不念
- id: guji-悟开-endeavor-2
  title_zh: 示助道防障辨师戒杀
  summary_zh: 明助道好心肠与障道坏心肠教亲近真明师善友须戒杀放生普度以成往生之助缘
  phases:
  - key: brewing
    name: 明善恶心肠
    labels:
      zh:
      - 恭敬慈悲解脱
      - 防名利机巧
    start_date: 1828-08-01
    highlight_event_id: guji-悟开-event-xing
  - key: breakthrough
    name: 辨真假师友
    labels:
      zh:
      - 平实开发为真
      - 另翻调门为假
    start_date: 1829-01-01
    highlight_event_id: guji-悟开-event-fa
  - key: climax
    name: 劝戒杀放生
    labels:
      zh:
      - 杀业障碍往生
      - 买放发愿普度
    start_date: 1829-02-01
    highlight_event_id: guji-悟开-event-jie
  - key: closure
    name: 嘱临终亡命念佛
    labels:
      zh:
      - 小病服药大病待死
      - 千魔不动只念弥陀
    start_date: 1829-03-01
    highlight_event_id: guji-悟开-event-zi
  decisions:
  - date: 1829-01-01
    title_zh: 以弥陀经为师友不杜撰
    rationale: 未遇真师友则以经文回向为依防假师引入错路塞杀正修心
  - date: 1829-02-01
    title_zh: 念佛必戒杀兼放生
    rationale: 杀生业果相续障碍清泰虽开荤素方便而三业首重不杀方为佛弟子
