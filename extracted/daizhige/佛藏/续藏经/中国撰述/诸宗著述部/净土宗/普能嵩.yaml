endeavors:
- id: guji-普能嵩-endeavor-1
  title_zh: 毗陵天宁参禅弘宗
  summary_zh: 早年参宗门不二禅，后住毗陵天宁，化导四众
  phases:
  - key: brewing
    name: 宗门参学
