    start_date: '1740'
    highlight_event_id: guji-普能嵩-event-abbot-tianing
  decisions:
  - date: '1740'
    title_zh: 会禅归净不废持名
    rationale: 禅净本同体共源，劝人不必争人我，直念弥陀报佛恩
- id: guji-普能嵩-endeavor-2
  title_zh: 作净土诗普劝群机
  summary_zh: 以浅近诗歌演净土深义，遍劝十二时二十四节士农工商老病僧俗同归极乐
  phases:
  - key: climax
    name: 诗歌演净
    labels:
      zh: 弘扬净土
    start_date: '1760'
    highlight_event_id: guji-普能嵩-event-pureland-verses
  - key: closure
    name: 付嘱流通
    labels:
      zh: 后学敬录
    start_date: '1780'
    highlight_event_id: guji-普能嵩-event-derun-record
  decisions:
  - date: '1760'
    title_zh: 以诗代疏普摄三根
    rationale: 痴愚老病工商皆难读典章，故用句句弥陀成诗，令行住坐卧皆可持名
  - date: '1780'
    title_zh: 示现平实敦劝实修
    rationale: 莫待临时抱佛脚，贵在平旦寅时至子丑恒持，四字洪名不间断
