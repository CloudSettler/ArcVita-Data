  decisions:
  - date: 1598-01-01
    title_zh: 作净土决前引立念佛即心净
    rationale: 以维摩心净则土净为据谓念佛必定往生参禅亦不能舍此净土若一来一往即是二土非净故即自心明净土
  - date: 1599-01-01
    title_zh: 以寿禅师为法以自身为鉴
    rationale: 录永明自余杭吏勤修净业放生忘身得上品上生之事自戒贪恋劝人晨朝焚香读其书
- id: guji-李贽-endeavor-2
  title_zh: 发明一心三观赞念佛必定见佛
  description: 明念佛法门不单约事相佛具三身念存三观以破三惑谓一声佛即空假中具足起念便生开口便见不待往生之劳
