  decisions:
  - date: 1598-06-01
    title_zh: 发明念存三观之旨
    rationale: 能念体空所念无相为真报身破见思能所分明为应身破尘沙空假互存为法身破无明以显天台止观即大乘净土
  - date: 1599-06-01
    title_zh: 合智者决疑与无为序为两决
    rationale: 以智者十疑为往生津梁决往生疑以无为序赞必定往生一心三观赞必定见佛合观方知起念便生不劳疑虑
