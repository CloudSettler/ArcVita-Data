  summary_first_person: 吾四明朱氏子母梦日堕怀而生幼名昙曜九岁出家十六受具参元叟于径山至京师闻鼓豁然大悟后住报国天宁筑室西偏专修净业清晨十念未尝少懈定中亲见莲华如来海众围绕著怀净土诗以劝世洪武三年被召说法即示寂于天界以偈明真性圆明西方日出而去吾以禅契心以净归心愿学者莫分禅净同生极乐
