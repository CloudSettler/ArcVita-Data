  description_zh: 庚午仲秋少荷居士赵成夏及虚舟堂德真作序净愿社友欲付剞劂广布同志同愿结社念佛
- id: guji-治兆-event-death
  date: '1880'
  year_of: 1880
  title_zh: 圆寂
  description_zh: 同治光绪之际圆寂具体年月未详遗集清珠集流行于世劝人净念相继同游华藏
