      - 结社念佛
      - 净愿弘化
    start_date: '1840'
    highlight_event_id: guji-治兆-event-jieshe
  - key: climax
    name: 结夏三十年
    labels:
      zh:
      - 久住熏修
      - 缁素同修
    start_date: '1869'
    highlight_event_id: guji-治兆-event-jiexia
  - key: closure
    name: 立社约证珠
    labels:
      zh:
      - 社规约众
      - 以珠证心
    start_date: '1870-05-08'
    highlight_event_id: guji-治兆-event-chengshu
  decisions:
  - date: '1840'
    title_zh: 立净愿社专主持名
    rationale: 众生心粗观难成就持名甚易有愿必生故舍繁就简以横出生死
  - date: '1870-05-08'
    title_zh: 以社约弁卷劝众同修
    rationale: 既到宝所须探骊得珠故立规约使览者顿悟自性佛即证无生忍
- id: guji-治兆-endeavor-2
  title_zh: 节录诸家净土要语辑刊清珠集
  description_zh: 耽赜内典披沙拣金尽祛繁冗不以己意参入汇为一书专说净土兼摄警策启信修行发愿饬终诸门刊印流布广化含识
  phases:
  - key: brewing
    name: 博览节录
    labels:
      zh:
      - 披沙拣金
      - 持名纲宗
    start_date: '1868'
    highlight_event_id: guji-治兆-event-jilu
  - key: breakthrough
    name: 书成请序
    labels:
      zh:
      - 自序发明心珠
      - 儒士作序
    start_date: '1870-05-08'
    highlight_event_id: guji-治兆-event-chengshu
  - key: closure
    name: 刊印流布
    labels:
      zh:
      - 付梓广传
      - 同圆种智
    start_date: '1870-09-01'
    highlight_event_id: guji-治兆-event-kanxing
  decisions:
  - date: '1868'
    title_zh: 不录出处俨成一家语
    rationale: 譬如集腋成裘贵无缝痕欲使览者启信笃修而不暇为他人数宝
  - date: '1870-05-08'
    title_zh: 以清珠名集专主持名略观想
    rationale: 清珠下浊水不得不清念投散心不得不一此土根机持名最易故取简易直捷
