endeavors:
- id: guji-瑞圣叹-endeavor-1
  title_zh: 撰注念佛三昧立念佛正因
  summary: 依檀几丛书立论破妄心念遥佛及妄心念妄心之失立先念成后见佛之宗
  phases:
  - key: brewing
    name: 观察妄心流浪而感愤
    labels:
      zh:
      - 观察
      - 感愤
    start_date: 1640-01-01
    highlight_event_id: guji-瑞圣叹-event-1
  - key: breakthrough
    name: 悟得先念成后见佛
    labels:
      zh:
      - 悟入
      - 立宗
    start_date: 1650-01-01
    highlight_event_id: guji-瑞圣叹-event-1
  - key: climax
    name: 著论诀择本际为念
    labels:
      zh:
      - 著述
      - 诀择
    start_date: 1660-01-01
    highlight_event_id: guji-瑞圣叹-event-1
  - key: closure
    name: 流通檀几丛书二集
    labels:
      zh:
      - 流通
      - 付嘱
    start_date: 1670-01-01
    highlight_event_id: guji-瑞圣叹-event-2
  decisions:
  - date: 1650-01-01
    title_zh: 不以妄心念遥佛亦不以妄心念妄心
    rationale: 妄心是生死因不能感通本际前妄后妄与世间流浪无异故须舍却
  - date: 1660-01-01
    title_zh: 立先念成次见佛以本际为念以妄心为佛
    rationale: 本际不可见不能令行人欢喜若以妄心念本际如毒器盛师子乳终不受故以念为实佛为假
- id: guji-瑞圣叹-endeavor-2
  title_zh: 会通华藏极乐劝求往生
  summary: 举释尊卢舍那阿弥陀一花一世尊说极乐九品化生劝恶浊众生造念佛往生之因
  phases:
  - key: brewing
    name: 会通娑婆华藏极乐
    labels:
      zh:
      - 会通
      - 发愿
    start_date: 1645-01-01
    highlight_event_id: guji-瑞圣叹-event-2
  - key: breakthrough
    name: 明下品下生即成佛
    labels:
      zh:
      - 开显
      - 慈济
    start_date: 1655-01-01
    highlight_event_id: guji-瑞圣叹-event-2
  - key: climax
    name: 演莲花化生九品义
    labels:
      zh:
      - 演义
      - 劝信
    start_date: 1665-01-01
    highlight_event_id: guji-瑞圣叹-event-2
  - key: closure
    name: 以阿弥陀名字付后学
    labels:
      zh:
      - 付嘱
      - 流通
    start_date: 1675-01-01
    highlight_event_id: guji-瑞圣叹-event-2
  decisions:
  - date: 1655-01-01
    title_zh: 举阿鼻罪人闻名粉碎示名字功德
    rationale: 罪人不敌阿弥陀名字千年暗室一灯即照地狱即在莲花中故下品下生亦成佛
  - date: 1665-01-01
    title_zh: 判得生极乐是果造因在念佛三昧
    rationale: 菩萨不愿住恶浊不得不求生极乐欲获果先须造因故以念佛三昧为往生正因
