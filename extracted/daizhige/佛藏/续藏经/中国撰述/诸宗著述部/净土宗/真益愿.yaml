endeavors:
- id: guji-真益愿-endeavor-1
  title_zh: 纂述劝修净土切要普劝发心求生
  summary: 以娑婆苦多西方乐永为宗，设三劝发心实心求生，普摄清闲冗忙富贵贫穷老少善恶诸根。
  phases:
  - key: brewing
    name: 观察生死无备萌念
    labels:
      zh: 观苦发心
    start_date: 1845-01-01
    highlight_event_id: guji-真益愿-event-1
  - key: breakthrough
    name: 立劝发心普摄群机
    labels:
      zh: 普劝念佛
    start_date: 1850-01-01
    highlight_event_id: guji-真益愿-event-1
  - key: climax
    name: 明实心三等策励精进
    labels:
      zh: 辨心真妄
    start_date: 1853-01-01
    highlight_event_id: guji-真益愿-event-2
  - key: closure
    name: 成书流通递相化导
    labels:
      zh: 流通化导
    start_date: 1861-05-17
    highlight_event_id: guji-真益愿-event-2
  decisions:
  - date: 1850-01-01
    title_zh: 专劝持名阿弥陀佛
    rationale: 阿弥陀佛有四十八愿与娑婆有缘，持名即蒙摄受，恶人忏悔亦可带业往生，最为直捷。
  - date: 1853-01-01
    title_zh: 分上中下三等以劝实心
    rationale: 众生妄念难除一暴十寒，故辨真切老实与有名无实，令立定不退之志，魔强亦以洪名抵对。
- id: guji-真益愿-endeavor-2
  title_zh: 开示在家念佛不碍世业兼劝正助双修
  summary: 示闹处炼心行住坐卧皆可念佛，不必静室长斋，主张晨起十念忙里偷闲，正行持名助修众善。
  phases:
  - key: brewing
    name: 悯在家人难修起方便
    labels:
      zh: 慈悯开权
    start_date: 1848-01-01
    highlight_event_id: guji-真益愿-event-1
  - key: breakthrough
    name: 示闹中炼心晨起十念
    labels:
      zh: busy中念佛
    start_date: 1852-01-01
    highlight_event_id: guji-真益愿-event-1
  - key: climax
    name: 劝正助双修回向西方
    labels:
      zh: 正助双修
    start_date: 1855-09-01
    highlight_event_id: guji-真益愿-event-2
  - key: closure
    name: 戒附邪教立念佛仪式
    labels:
      zh: 正信仪轨
    start_date: 1861-05-17
    highlight_event_id: guji-真益愿-event-2
  decisions:
  - date: 1852-01-01
    title_zh: 不废世业不拘行住坐卧
    rationale: 若必弃业长斋则阻人向道，故许忙里偷闲片刻至诚，心净即土净，一声胜数声。
  - date: 1855-09-01
    title_zh: 劝求生净土不徒求福报
    rationale: 人天福报有尽仍堕轮回，唯莲花生净土寿乐无量直成佛道，故须发愿回向，不可附邪教当钱用。
events:
- id: guji-真益愿-event-birth
  title_zh: 诞生
  date: 1790-01-01
  year_of: 1790
  description: 清嘉庆年间生于世，长而具慧根，归心净土，号净业行人。
- id: guji-真益愿-event-1
  title_zh: 普劝群机发心念佛
  date: 1850-06-01
  year_of: 1850
  description: 观察富贵贫穷老少善恶皆苦，依阿弥陀经劝清闲冗忙男女老幼残疾疾病皆可持名，不废士农工商之业。
- id: guji-真益愿-event-2
  title_zh: 纂述劝修净土切要成书
  date: 1861-05-17
  year_of: 1861
  description: 于咸丰年间纂述劝修净土切要，分劝发心实心求生正助双修诸篇，立念佛仪式发愿回向，潘曾莹无相室为序重刻流通。
- id: guji-真益愿-event-death
  title_zh: 示寂
  date: 1865-12-31
  year_of: 1865
  description: 清同治年间卒，一生以念佛换骨灵丹自度度人，遗书劝后学递相化导同出迷津。
