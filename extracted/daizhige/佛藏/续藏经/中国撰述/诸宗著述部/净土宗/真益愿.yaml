  archetype: 弘法者
  dilemmas:
  - 世人贪著眼前快乐挂碍深重难以发心念佛
  - 杂念炽盛信心不专一暴十寒难得实益
  - 求人天福报与求生极乐净土之取舍
  lesson: 生死事大当以真信切愿老实持名以念佛为终身之备自度度人同生极乐
  summary_first_person: 吾真益愿为净业行人，观世人忘身逐尘生死无备，故纂劝修净土切要，劝发心实心求生，令士农工商忙闲贫富皆得持名往生，不负佛慈。
