events:
- id: guji-程兆鸾-event-birth
  date: 1829
  title_zh: 海陵出生
  description: 清道光九年前后生於海陵后徙居高邮
- id: guji-程兆鸾-event-1
  date: 1860
  title_zh: 梦乩发心师悟和学净土
  description: 咸丰避乱梦旷野比丘劝念佛后诣张金门家观乩被呼乳名遂发心弃儒学佛亲炙悟和法师解净土法门
- id: guji-程兆鸾-event-2
  date: 1875
  title_zh: 领永清念佛社改智慧道场
  description: 悟和圆寂承师命领众乩改名智慧道场瘟疫行时兼事放生施丹济苦力劝信愿行横出三界
- id: guji-程兆鸾-event-3
  date: 1884
  title_zh: 刺血书经十年造塔供养
  description: 立誓三宝前陆续刺指血书大乘经三十二部恒写十年事毕造缯彩七级浮图奉经供养念佛七昼夜焚化沉灰於珠湖为父母师长法界众生忏罪
- id: guji-程兆鸾-event-4
  date: 1894-11-06
  title_zh: 编成莲修起信录六卷付梓
  description: 光绪甲午净业课毕搜箧中鸾训往生征信及杂着合六卷名莲修起信录节衣食资付梨枣流通
- id: guji-程兆鸾-event-death
  date: 1895
  title_zh: 甲午后示寂
  description: 自云鬓发如霜幻宅难久居往昔净因将具足甲午着书后行迹未详暂系圆寂
