  title_zh: 侍奘译经弘唯识立宗
  summary_zh: 十七出家，事玄奘于广福慈恩，学五竺语，尽领瑜伽唯识之妙，恢廓源流，流通五性宗法
  phases:
  - key: brewing
    name: 诞育长安
    labels:
      zh: 尉迟氏子
    start_date: '0632'
    highlight_event_id: guji-窥基-event-birth
  - key: breakthrough
    name: 预缁奉勅为奘弟子
    labels:
      zh: 出家从奘
    start_date: 0649
    highlight_event_id: guji-窥基-event-ordination
  - key: climax
    name: 入慈恩统综译业
    labels:
      zh: 译经弘法
    start_date: 0659
    highlight_event_id: guji-窥基-event-translation
  - key: closure
    name: 付嘱流通示疾长往
    labels:
      zh: 长往樊村
    start_date: '0682-11-13'
    highlight_event_id: guji-窥基-event-death
  decisions:
  - date: 0649
    title_zh: 奉勅入大慈恩躬事奘师
    rationale: 为解纷开结，统综条然，亲承瑜伽师地唯识，流通五性宗法
  - date: 0659
    title_zh: 专弘唯识恢廓源流
    rationale: 以奘公付嘱唯汝流通，故尽领其妙，著述传宗
- id: guji-窥基-endeavor-2
  title_zh: 造西方要决劝归净土
  summary_zh: 愍学者疑虑经论相违，略陈十四种释疑，判念佛为宗往生为趣，令人舍圣道归净土，速成不退
  phases:
  - key: brewing
    name: 从奘受学兼详净土
    labels:
      zh: 兼通净土
    start_date: 0649
    highlight_event_id: guji-窥基-event-ordination
  - key: breakthrough
    name: 会通诸经立他力不共义
    labels:
      zh: 会通立义
    start_date: 0659
    highlight_event_id: guji-窥基-event-translation
  - key: climax
    name: 造西方要决释疑通规
    labels:
      zh: 造论劝生
    start_date: '0665'
    highlight_event_id: guji-窥基-event-xifangyaojue
  - key: closure
    name: 以念佛为宗垂范后学
    labels:
      zh: 垂范后学
    start_date: '0682-11-13'
    highlight_event_id: guji-窥基-event-death
  decisions:
  - date: '0665'
    title_zh: 判西方通报化立化土化身可生
    rationale: 以凡夫障重法身难缘，且教念佛观形，逢化佛作不退良缘，故许凡夫往生
  - date: '0665'
    title_zh: 以十四门会通相违劝专念弥陀
    rationale: 为绝疑网令归心妙业，以大师说教各称时机等无差异，故同归一实专劝往生
events:
- id: guji-窥基-event-birth
  date: '0632'
  year_of: 632
  title_zh: 诞生于京兆长安尉迟氏
  description_zh: 唐左金吾将军宗之子，母裴氏梦掌月轮吞之而有孕，盈月诞弥，与群儿弗类
- id: guji-窥基-event-ordination
  date: 0649
  year_of: 649
  title_zh: 年十七预缁林为奘师弟子
  description_zh: 始住广福寺，寻奉别勅选聪慧颖脱者入大慈恩寺，躬事玄奘，学五竺语
- id: guji-窥基-event-translation
  date: 0659
  year_of: 659
  title_zh: 从奘受瑜伽唯识流通宗法
  description_zh: 亲授瑜伽师地唯识尽领其妙，奘公称五性宗法唯汝流通，恢廓源流闻见叹伏
- id: guji-窥基-event-xifangyaojue
  date: '0665'
  year_of: 665
  title_zh: 撰西方要决释疑通规劝归净土
  description_zh: 述娑婆一形乃至临终十念皆得往生，通金刚般若色声求佛等十四疑，以念佛为宗往生为趣
- id: guji-窥基-event-death
  date: '0682-11-13'
  year_of: 682
  title_zh: 示疾长往于慈恩翻经院
  description_zh: 以永淳元年壬午示疾，至十一月十三日长往，春秋五十一，葬樊村北渠祔三藏茔
