person:
  qid: guji-行策
  name_zh: 行策
  names:
    zh: 行策
    en: Xingce
  lifespan:
    birth:
      date: 1628
      precision: year
      is_circa: false
      raw: 明崇祯元年
    death:
      date: 1682
      precision: year
      is_circa: false
      raw: 清康熙二十一年示寂
  birth_date: 1628
  death_date: 1682
  era: 清
  reign_ref: 康熙
  archetype: 净土宗师
  dilemmas:
  - 专持一句洪名求一心不乱与兼修余经咒功行之间如何取舍
  - 慈悲摄受广众随喜与严立规约罚例治放逸之间如何权衡
  lesson: 一生悠忽止在七日精进，一句洪名当如呼吸不断，不惜躯命，不杂不间，严规罚例皆是助成胜行之慈悲方便
  summary_first_person: 吾乃虞山普仁院净业比丘行策，别号截流，依弥陀经教立一心精进念佛七期规式，选十二人分三班，旋绕安坐相代，使七昼夜佛声不断，立三等二十三条罚例以止放逸，七日内专持洪名以求一心，愿与众等同生安养
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%87%80%E5%9C%9F%E5%AE%97/%E8%B5%B7%E4%B8%80%E5%BF%83%E7%B2%BE%E8%BF%9B%E5%BF%B5%E4%BD%9B%E4%B8%83%E6%9C%9F%E8%A7%84%E5%BC%8F.html
endeavors:
- id: guji-行策-endeavor-1
  title_zh: 制定一心精进念佛七期规式
  description: 择清净广厦为七堂，中奉弥陀，定十二人分三班，旋行安坐相代，立罚例疏文，使七日持名一心不乱
  phases:
  - key: brewing
    name: 择堂分班预习演礼
    labels:
      zh: 预备周严
    start_date: 1677-02-19
    highlight_event_id: guji-行策-event-qiri
  - key: breakthrough
    name: 三班轮替佛声不断
    labels:
      zh: 旋坐相代
    start_date: 1677-02-19
    highlight_event_id: guji-行策-event-qiri
  - key: climax
    name: 夜集同声发愿归寝
    labels:
      zh: 一心归命
    start_date: 1677-02-26
    highlight_event_id: guji-行策-event-yuanman
  - key: closure
    name: 满七宣疏送疏圆礼
    labels:
      zh: 功德回向
    start_date: 1677-02-26
    highlight_event_id: guji-行策-event-yuanman
  decisions:
  - date: 1677-02-19
    title_zh: 定十二僧分三班旋行一千安坐二千
    rationale: 使从旦至暮佛声不绝，身口不疲，劳逸均等，神气清明，一心缘佛
  - date: 1677-02-19
    title_zh: 立不语禁与三等二十三条罚例
    rationale: 制止放逸助成胜行，期中戒语不便指授，故以罚例肃威仪，犯者登牌记罚
  - date: 1677-02-19
    title_zh: 七日内止余经咒恒课专持洪名
    rationale: 免间断夹杂，方得称为七日持名一心不乱，宁七日后追补恒课
- id: guji-行策-endeavor-2
  title_zh: 住普仁院领众实修弘扬净土
  description: 早入弥陀愿海专修净土，丁巳春依经起七日新规，领缁素追随，饮食便利皆不离洪名，普愿同生乐国
  phases:
  - key: brewing
    name: 熏沐投诚归命净土
    labels:
      zh: 信愿专修
    start_date: 1677-02-19
    highlight_event_id: guji-行策-event-qiri
  - key: breakthrough
    name: 普仁起七风雨梵音相和
    labels:
      zh: 道场兴行
    start_date: 1677-02-19
    highlight_event_id: guji-行策-event-qiri
  - key: climax
    name: 猛将追敌杂妄无间可乘
    labels:
      zh: 精进一心
    start_date: 1677-02-26
    highlight_event_id: guji-行策-event-yuanman
  - key: closure
    name: 撰疏回向七宝七觉七菩提
    labels:
      zh: 普令往生
    start_date: 1677-02-26
    highlight_event_id: guji-行策-event-yuanman
  decisions:
  - date: 1677-02-19
    title_zh: 但以香光庄严不用蔬果赞吹
    rationale: 如法供养，令堂仪清净，众缘佛号，不驰外境
  - date: 1677-02-19
    title_zh: 斋堂食时击板念佛相继
    rationale: 使一句洪名不绝于心口耳间，行住坐卧饮食皆存想洪名须臾不离
events:
- id: guji-行策-event-birth
  date: 1628
  year_of: 1628
  title_zh: 出生
  description: 明崇祯元年生，后出家，专修净土，世称截流大师，住虞山普仁院
- id: guji-行策-event-qiri
  date: 1677-02-19
  year_of: 1677
  title_zh: 丁巳春普仁院起七日念佛新规
  description: 依弥陀经教，于二月十九大士圣诞集净众不拣僧俗，选十二人分三班，每班四人司引磬小鱼巡察，从旦至暮佛声不绝
- id: guji-行策-event-yuanman
  date: 1677-02-26
  year_of: 1677
  title_zh: 七期满宣疏送疏圆礼事竟
  description: 入夜六千佛竟同起旋念，称观音势至，宣回向发愿疏，送疏念发愿偈，礼谢主七护七职事，归堂圆礼为一期事竟，规式罚例流传
- id: guji-行策-event-death
  date: 1682
  year_of: 1682
  title_zh: 示寂
  description: 清康熙二十一年示寂于杭州，世寿五十五，后有阎罗迎西归及放还感应之记，门人宝林记于康熙三十六年
