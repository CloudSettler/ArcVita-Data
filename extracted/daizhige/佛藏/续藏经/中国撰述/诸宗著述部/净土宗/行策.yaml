      - 持名
    start_date: '1674'
    highlight_event_id: guji-行策-event-writing
  - key: climax
    name: 九品略辩示往生阶次
    labels:
      zh:
      - 九品
      - 往生
    start_date: '1675'
    highlight_event_id: guji-行策-event-writing
  - key: closure
    name: 示居士开示后学成书流通
    labels:
      zh:
      - 开示
      - 流通
    start_date: '1678'
    highlight_event_id: guji-行策-event-writing
  decisions:
  - date: '1674'
    title_zh: 独举持名凡圣同居为异方便
    rationale: 实相法门观想相好非钝根所堪惟仗佛愿带业可生
  - date: '1675'
    title_zh: 以解悟戒善忏悔分判九品
    rationale: 令上智下愚各知所从事而不谤大乘不执空见
events:
- id: guji-行策-event-birth
  title_zh: 生于宜兴蒋氏
  date: '1628'
  year_of: 1628
  place_zh: 江苏宜兴
  summary: 明崇祯元年生于宜兴蒋氏，宿具善根，少即向道。
- id: guji-行策-event-puren
  title_zh: 住杭州普仁结莲社
  date: '1660'
  year_of: 1660
  place_zh: 杭州普仁寺
  summary: 住持普仁，广邀善侣同修净因，六时行道，示以真实信心。
- id: guji-行策-event-three-year
  title_zh: 起三年长期示众
  date: '1661'
  year_of: 1661
  place_zh: 杭州普仁寺
  summary: 示众当发痛惜光阴专求出离和顺守约三种心，掩关禁足专念洪名以求往生。
- id: guji-行策-event-seven-day
  title_zh: 起精进七期示一心
  date: '1665'
  year_of: 1665
  place_zh: 杭州普仁寺
  summary: 示七日持名贵在一心不乱无间无杂，事一心则决定往生，理一心则可阶上品。
- id: guji-行策-event-writing
  title_zh: 撰净土警语流通
  date: '1675'
  year_of: 1675
  place_zh: 杭州普仁寺
  summary: 述劝发真信申劝料柬法门九品略辩及示居士书，明持名带业横超之义，成净土警语一卷。
- id: guji-行策-event-death
  title_zh: 示寂
  date: '1682'
  year_of: 1682
  place_zh: 杭州
  summary: 清康熙二十一年示寂，世寿五十五，遗著净土警语等盛行于世，后世奉为净土前贤。
