    rationale: 痛惜光阴专求出离和顺守约以防退堕
  - date: '1665'
    title_zh: 以一心不乱为七期准则
    rationale: 不尚快多惟贵无间无杂以成往生正因
- id: guji-行策-endeavor-2
  title_zh: 著述净土警语料柬法门
  goal: 明辨四种念佛四种净土确立持名带业横超之异方便
  phases:
  - key: brewing
