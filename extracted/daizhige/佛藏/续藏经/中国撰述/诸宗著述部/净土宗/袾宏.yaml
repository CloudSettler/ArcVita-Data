  decisions:
  - date: 1566
    title_zh: 舍俗出家守本分因果念佛
    rationale: 受遍融守本分不要攀援因果分明一心念佛教诲故终身遵守不昧
  - date: 1571
    title_zh: 住山不入城市广设持戒念佛规约
    rationale: 以戒定慧摄持名以持名全摄戒定慧故重建云栖普令僧俗放下万缘纯一念佛
