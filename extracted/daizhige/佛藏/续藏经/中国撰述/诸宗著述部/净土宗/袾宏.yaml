- id: guji-袾宏-event-preach
  date: '1580'
  year_of: 1580
  title_zh: 严持戒律普劝持名
  description: 以律为师范禅教律融归一行三昧日课佛名普劝四众发愿往生
- id: guji-袾宏-event-xifangyuanwenjie
  date: '1600'
  year_of: 1600
  title_zh: 造西方愿文并自注
  description: 造西方愿文分总序归敬正述愿文开求生正因得生明验已生大用三科并自作解流通于世
- id: guji-袾宏-event-death
  date: '1615'
  year_of: 1615
  title_zh: 示寂云栖弟子刻文志皈
  description: 万历四十三年六月示寂於云栖弟子广亶刻西方愿文以志皈依并述像赞颂其功德
