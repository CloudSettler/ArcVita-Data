  - date: '1566'
    title_zh: 决意出家受具
    rationale: 悟世无常不慕功名愿以出世正法自利利他故舍俗披缁
  - date: '1571'
    title_zh: 拣选云栖荒山安居
    rationale: 慕幽僻便修持以戒定为基聚众熏修使废寺再兴故结茅栖隐
- id: guji-袾宏-endeavor-2
  title_zh: 造愿文解专弘净土
  description: 本为四恩三有发大菩提造西方愿文并自注开示忏悔发愿感佛现前临终往生见佛授记之次第
  phases:
