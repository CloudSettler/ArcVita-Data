  birth_date: 1535
  death_date: 1615
  era: 明代
  reign_ref: 万历
  archetype: 净土弘化高僧
  dilemmas:
  - 执理废事堕偏空与即事显理守专修之间如何抉择
  - 恋世缘贪生与厌身命求速死之间如何持中道正行
  - 繁简异宜之间如何以七日十念与六时礼忏接引中下之机
  lesson: 心净土净须理事双彰，不执内影为极乐，不舍弘愿为高远，专一念佛以横超生死
  summary_first_person: 吾杭沙门袾宏，结茅云栖，专宗念佛，愍中流狐疑鼠怯，代众生答四十八问，破偏空拨无之见，明因果理事之真，劝专心一处同归极乐
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/净土宗/答净土.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/净土宗/答净土.md
endeavors:
- id: guji-袾宏-endeavor-1
  title_zh: 云栖结庵中兴净业
  description_zh: 隆庆至万历间入杭州云栖结茅持戒，领众念佛，化王臣居士军民同修净土，国政佛事打成一片
  phases:
  - key: brewing
    name: 弃俗向道发心出家
    labels:
      zh:
      - 访道潜修
    start_date: 1566
    highlight_event_id: guji-袾宏-event-birth
  - key: breakthrough
    name: 结茅云栖专修念佛
    labels:
      zh:
      - 结庵专念
    start_date: 1571
    highlight_event_id: guji-袾宏-event-yunqi
  - key: climax
    name: 领众熏修远近归仰
    labels:
      zh:
      - 化众同归
    start_date: 1580
    highlight_event_id: guji-袾宏-event-qa48
  - key: closure
    name: 示寂云栖垂范后世
    labels:
      zh:
      - 圆寂垂范
    start_date: 1615
    highlight_event_id: guji-袾宏-event-death
  decisions:
  - date: 1571
    title_zh: 入云栖山结茅专修
    rationale: 以远离尘嚣自净其心，以持戒念佛为报满往生之本，不恋世缘不残躯命
  - date: 1580
    title_zh: 开门接众普劝念佛
    rationale: 达心之士万机不繁，王事佛事一如，明镜照物不劳，普令王臣居士即事契理
- id: guji-袾宏-endeavor-2
  title_zh: 著答净土四十八问破疑
  description_zh: 万历十二年应德园居士代百千众生之请，随问结答四十八条，拣偏空邪见，明心土一如，接引中流往生
  phases:
  - key: brewing
    name: 见中流从违无定起悲心
    labels:
      zh:
      - 观察病机
    start_date: 1582
    highlight_event_id: guji-袾宏-event-yunqi
  - key: breakthrough
    name: 据款结案随绳解纷
    labels:
      zh:
      - 随问立答
    start_date: 1584
    highlight_event_id: guji-袾宏-event-qa48
  - key: climax
    name: 阐理事一如破身分邪执
    labels:
      zh:
      - 破邪显正
    start_date: 1584
    highlight_event_id: guji-袾宏-event-qa48
  - key: closure
    name: 付刊流通翊赞先宗
    labels:
      zh:
      - 流通翊教
    start_date: 1585
    highlight_event_id: guji-袾宏-event-death
  decisions:
  - date: 1584
    title_zh: 作序陈宗旨应四十八难
    rationale: 以十疑或问之后病剧药增，不得不再述，使越烦恼河者决狐疑出死生穴者离鼠怯
  - date: 1584
    title_zh: 立理事双彰斥肺西舌池之谬
    rationale: 革囊不净幻质非真，认肉络为宝罗指妄想为真佛者苦报弥深，须以事显理以净心感净土
events:
- id: guji-袾宏-event-birth
  date: 1535
  year_of: 1535
  title_zh: 诞生仁和沈氏
  description_zh: 明嘉靖十四年生于仁和，俗姓沈，少习儒业，后悟无常，号莲池
- id: guji-袾宏-event-yunqi
  date: 1571
  year_of: 1571
  title_zh: 结庵杭州云栖山
  description_zh: 隆庆五年入云栖山结茅，持戒念佛，修建梵宇，中兴云栖，领众同修净业
- id: guji-袾宏-event-qa48
  date: 1584
  year_of: 1584
  title_zh: 万历十二年作答四十八问序
  description_zh: 冬日于杭作序应答，详论心净土净理事二义莲华荣悴现征西方十万亿程发愿为先，斥外道白莲诸谬，垂训金口接引往生
- id: guji-袾宏-event-death
  date: 1615
  year_of: 1615
  title_zh: 示寂于云栖
  description_zh: 明万历四十三年示寂，世寿八十一，后世列为净土宗八祖，著述宏传莲宗不绝
