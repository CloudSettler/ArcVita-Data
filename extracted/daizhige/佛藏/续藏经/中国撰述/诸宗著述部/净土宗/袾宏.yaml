    start_date: 1584
    highlight_event_id: guji-袾宏-event-1600-huiyu
  - key: climax
    name: 书答广化
    labels:
      zh: 答问士大夫居士示阅藏示参究归于一心
    start_date: 1600
    highlight_event_id: guji-袾宏-event-1600-huiyu
  - key: closure
    name: 汇语结集
    labels:
      zh: 门人汇录净土开示书答成篇
    start_date: 1615
    highlight_event_id: guji-袾宏-event-death
  decisions:
  - date: 1584
    title_zh: 专主护持名而会通参究观想
    rationale: 以杂心修观难成故直劝专持名号深达实相即与妙观同功故判持名为往生之要
  - date: 1600
    title_zh: 不立念佛会不募化守分修行教居士
    rationale: 令在家二众闭门安坐孝亲作福端心灭恶随忙闲皆可念佛故普劝九品皆堪往生
