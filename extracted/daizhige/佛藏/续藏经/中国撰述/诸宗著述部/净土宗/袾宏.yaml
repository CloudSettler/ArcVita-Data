  description: 明嘉靖十四年十二月初八生於杭州沈氏后名袾宏字佛慧
- id: guji-袾宏-event-ordination
  date: '1566'
  year_of: 1566
  title_zh: 看破出家受戒
  description: 年三十二出家受具遍参讲席后专志念佛归心净土
- id: guji-袾宏-event-yunqi
  date: '1571'
  year_of: 1571
  title_zh: 入主云栖中兴道场
