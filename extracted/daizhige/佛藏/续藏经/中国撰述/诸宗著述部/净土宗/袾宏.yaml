    highlight_event_id: guji-袾宏-event-death
  decisions:
  - date: '1595'
    title_zh: 决定造文自释
    rationale: 念佛求生须信愿行具足恐学者因地不真故作文立科自注发明
  - date: '1600'
    title_zh: 示现感应不著相求
    rationale: 既仗自力又蒙佛力须一心精诚感应自然不作意求现以免魔事故谆谆诫勖
events:
- id: guji-袾宏-event-birth
  date: '1535'
  year_of: 1535
