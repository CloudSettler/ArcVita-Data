endeavors:
- id: guji-观如-endeavor-1
  title_zh: 随见随录辑成莲修必读
  summary: 搜罗净土歌颂偈赞，辑为初机读诵便览，以念佛三昧贯摄众篇
  phases:
  - key: brewing
    name: 目览搜集
    labels:
      zh: 搜罗净土歌颂
    start_date: '1880'
    highlight_event_id: guji-观如-event-collect
  - key: breakthrough
    name: 随录成编
    labels:
      zh: 借语明心
    start_date: '1885'
    highlight_event_id: guji-观如-event-compile
  - key: closure
    name: 刻行流通
    labels:
      zh: 以便读诵
    start_date: '1886'
    highlight_event_id: guji-观如-event-preface
  decisions:
  - date: '1885'
    title_zh: 以歌颂摄初机
    rationale: 初修难阅全典又难记诵，故选一言半偈可诵可行之文以了生死
  - date: '1886'
    title_zh: 自陈遗珠不以为了竟
    rationale: 自愧法眼未明，诫人勿以此为究竟，亦勿因人微而藐视此书
- id: guji-观如-endeavor-2
  title_zh: 扬州藏经院阐扬念佛戒杀
  summary: 会寒山拾得楚石及戒杀放生诸篇劝世，融禅教律于净土，劝戒杀放生同归极乐
  phases:
  - key: brewing
    name: 会归寒山拾得
    labels:
      zh: 劝出生死轮回
    start_date: '1884'
    highlight_event_id: guji-观如-event-collect
  - key: climax
    name: 以戒杀助往生
    labels:
      zh: 慈心放生
    start_date: '1886'
    highlight_event_id: guji-观如-event-compile
  - key: closure
    name: 托宿西斋诗赞
    labels:
      zh: 同愿往生
    start_date: '1886'
    highlight_event_id: guji-观如-event-preface
  decisions:
  - date: '1886'
    title_zh: 并收戒杀放生卫生诸集
    rationale: 杀业感刀兵，生机转杀机，放生念佛如苦海之舟可逢凶化吉
  - date: '1886'
    title_zh: 引藕益西斋诗赞作结劝
    rationale: 一读二读尘念消，读至千万遍此身已向莲花托，劝后来同生极乐
