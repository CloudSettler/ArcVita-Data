    start_date: 1684-05-01
    highlight_event_id: guji-道沾-event-compile
  decisions:
  - date: 1681-03-01
    title_zh: 以净土八问请益为霖师
    rationale: 欲破参方鄙薄净行之偏显禅净同源故不惮远问以求剖晰
  - date: 1684-05-01
    title_zh: 决意编刻旨诀流通
    rationale: 以此书词简旨深为净邦楷梯别传宝鉴故博引佛言广参祖语以利后学
- id: guji-道沾-endeavor-2
  title_zh: 开示居士勤修净业
  description: 示德彰惟祥莲实及温陵莲社劝发三资粮以持名念佛求生极乐
  phases:
  - key: brewing
    name: 看破娑婆
    labels:
      zh: 信愿奠基
    start_date: 1682-01-01
    highlight_event_id: guji-道沾-event-teach
  - key: climax
    name: 普劝持名
    labels:
      zh: 一心不乱
    start_date: 1683-01-01
    highlight_event_id: guji-道沾-event-teach
  - key: closure
    name: 回向安养
    labels:
      zh: 导归极乐
    start_date: 1684-05-01
    highlight_event_id: guji-道沾-event-compile
  decisions:
  - date: 1682-01-01
    title_zh: 示以持名为最捷径
    rationale: 以弥陀经执持名号若日至七日一心不乱即得往生故令字字分明句句相续
  - date: 1683-01-01
    title_zh: 立决定信真实行广大愿三资粮
    rationale: 以信不决定即浮信行不真实即妄行愿不广大即劣愿故须三者具足如顺风扬帆
