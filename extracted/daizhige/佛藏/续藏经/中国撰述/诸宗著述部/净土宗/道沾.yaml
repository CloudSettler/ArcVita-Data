endeavors:
- id: guji-道沾-endeavor-1
  title_zh: 辑录鼓山净土旨诀
  description: 亲承为霖师法印辑其开示问答偈赞成净土旨诀一书以明禅净合一
  phases:
  - key: brewing
    name: 请益蓄积
