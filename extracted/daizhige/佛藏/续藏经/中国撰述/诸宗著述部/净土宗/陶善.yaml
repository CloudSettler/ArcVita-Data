    rationale: 自伤女流流浪生死，故以惭愧策厉熏修，誓成无生法忍
  - date: 1779-01-01
    title_zh: 和二林主人闭关诗十首
    rationale: 通达净土法源，以一句弥陀空自性，回向莲邦，证平生信愿
- id: guji-陶善-endeavor-2
  title_zh: 净土持修慈心利他
  summary_zh: 九岁喜茹素，闻出世法，手书报恩金刚弥陀诸经，印施慈心宝鉴，归彭后劝夫宽慈，日有常课，临终诵佛而逝
