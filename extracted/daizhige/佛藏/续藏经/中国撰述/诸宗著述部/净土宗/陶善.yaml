  decisions:
  - date: 1778-06-01
    title_zh: 印施慈心宝鉴千本
    rationale: 悯吴俗宰割大奢，欲以慈心劝杀，广种福田，回向净土
  - date: 1780-01-01
    title_zh: 临终嘱慰姑亲不悲
    rationale: 自知因缘仅一载，愿夫慰姑亲并无忘父母，以报四恩，安心西去
events:
- id: guji-陶善-event-birth
  date: 1756-02-22
  year_of: 1756
  title_zh: 生于苏州陶氏
  description_zh: 乾隆二十一年二月二十二日生，为岁贡生寄轩公长女，苇齐翁孙女，名善字庆余
- id: guji-陶善-event-early-poetry
  date: 1769-01-01
  year_of: 1769
  title_zh: 十四岁成百花诗见赏耆宿
  description_zh: 幼聪颖好读书，强记博涉经史类书，年十四成百花诗，吐属清远不染尘垢
- id: guji-陶善-event-marriage
  date: 1778-01-01
  year_of: 1778
  title_zh: 年二十三归彭希洛
  description_zh: 年十六大父为希洛缔姻，越八年始归，事姑得欢心，劝夫宽慈勤学，代理家务令专心科举
- id: guji-陶善-event-cankui-printing
  date: 1778-06-01
  year_of: 1778
  title_zh: 著惭愧吟印施慈心宝鉴
  description_zh: 戊戌长夏作惭愧吟六十首，以惭愧为三教之基，手书报恩金刚弥陀诸经，印吴江沈氏慈心宝鉴千本以施
- id: guji-陶善-event-hebilin
  date: 1779-01-01
  year_of: 1779
  title_zh: 和二林主人闭关诗十首
  description_zh: 己亥次二林主人戊戌闭关原韵十首，通达法源，净诸疑惑，演出念佛法门，为彭绍升序为迦陵音
- id: guji-陶善-event-death
  date: 1780-01-23
  year_of: 1780
  title_zh: 产后感疾诵佛而逝
  description_zh: 腊月初生子蕴辉，半月后感时邪，延及新正，临终朗诵佛号及往生咒，言大和尚自西而来，年二十有五
