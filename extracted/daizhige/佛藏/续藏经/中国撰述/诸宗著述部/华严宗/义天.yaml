endeavors:
- id: guji-义天-endeavor-1
  title_zh: 入宋求法搜集教典
  description_zh: 舍高丽王子之位而西渡大宋，遍参华严天台诸师，搜集经疏三千余卷以归。
  phases:
  - key: brewing
    name: 王子出家立志求法
    labels:
      zh:
      - 发心出家
    start_date: 1066
    highlight_event_id: guji-义天-event-ordain
  - key: breakthrough
    name: 渡海入宋亲承净源
    labels:
      zh:
      - 入宋求法
    start_date: 1085
    highlight_event_id: guji-义天-event-study-song
  - key: climax
    name: 遍访江南搜集众疏
    labels:
      zh:
      - 搜集教典
    start_date: 1086
    highlight_event_id: guji-义天-event-study-song
  - key: closure
    name: 携典东归发愿流通
    labels:
      zh:
      - 载典归国
    start_date: 1086
    highlight_event_id: guji-义天-event-return
  decisions:
  - date: 1085
    title_zh: 决意赴宋求法
    rationale: 高丽教典阙略，为补华严天台章疏，虽冒海险亦往大宋访求全藏。
  - date: 1086
    title_zh: 购藏三千卷归国
    rationale: 见宋藏完备，恐本国后学无依，故倾资购写，务令大藏东传不绝。
- id: guji-义天-endeavor-2
  title_zh: 开立天台编集圆宗
  description_zh: 住持兴王寺开高丽天台宗，编新编诸宗教藏总录，集华严诸师精义成圆宗文类。
  phases:
  - key: brewing
    name: 住持兴王整理旧藏
    labels:
      zh:
      - 住持整理
    start_date: 1087
    highlight_event_id: guji-义天-event-return
  - key: breakthrough
    name: 奏立天台别传教观
    labels:
      zh:
      - 开宗立教
    start_date: 1097
    highlight_event_id: guji-义天-event-found-tiatai
  - key: climax
    name: 编录教藏甄别诸宗
    labels:
      zh:
      - 编藏著述
    start_date: 1099
    highlight_event_id: guji-义天-event-found-tiatai
  - key: closure
    name: 集圆宗文类示圆融旨
    labels:
      zh:
      - 集文示法
    start_date: 1100
    highlight_event_id: guji-义天-event-compile
  decisions:
  - date: 1097
    title_zh: 请立天台宗
    rationale: 为调和禅教争执，立圆融止观，使教观双美，止息空有偏执。
  - date: 1100
    title_zh: 编集圆宗文类
    rationale: 取澄观宗密以来华严精义，分类编次，令行位因果昭然，使后学一卷可览圆旨。
events:
- id: guji-义天-event-birth
  title_zh: 生于开京王宫
  date: 1055
  year_of: 1055
  place_zh: 高丽开京
  description_zh: 高丽文宗第四子，名颙，后以义天为字，母仁睿王后李氏。
- id: guji-义天-event-ordain
  title_zh: 出家受具从学华严
  date: 1066
  year_of: 1066
  place_zh: 灵通寺
  description_zh: 年十一出家，依灵通寺受具，遍学高丽国内华严天台章疏，立志补阙求全。
- id: guji-义天-event-study-song
  title_zh: 入宋从净源学华严
  date: 1085
  year_of: 1085
  place_zh: 杭州慧因院
  description_zh: 渡海至宋，从慧因净源受华严探玄起信诸义，复参慈辩从谏等五十余师。
- id: guji-义天-event-return
  title_zh: 携三千卷东归
  date: 1086
  year_of: 1086
  place_zh: 开京兴王寺
  description_zh: 以宋哲宗所赐大藏及自购写教典归国，住兴王寺，声名大振，四方从学。
- id: guji-义天-event-found-tiatai
  title_zh: 开立高丽天台宗
  date: 1097
  year_of: 1097
  place_zh: 国清寺兼兴王寺
  description_zh: 奏请置天台宗，传台家教观，兼弘华严圆宗，调和禅教，编新编诸宗教藏总录。
- id: guji-义天-event-compile
  title_zh: 编成圆宗文类
  date: 1100
  year_of: 1100
  place_zh: 兴王寺
  description_zh: 汇集华严探玄记教义分齐行位宗趣等文，分门编类，成二十二卷圆宗文类。
- id: guji-义天-event-death
  title_zh: 圆寂于兴王寺
  date: 1101
  year_of: 1101
  place_zh: 开京兴王寺
  description_zh: 十月示寂，世寿四十七，谥大觉国师，塔号慧光，门人延续天台法脉。
