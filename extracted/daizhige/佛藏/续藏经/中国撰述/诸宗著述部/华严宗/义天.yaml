person:
  qid: guji-义天
  name_zh: 义天
  names:
    zh: 义天
    en: Uicheon
  lifespan:
    birth:
      date: 1055
      precision: year
      is_circa: false
      raw: 高丽文宗九年
    death:
      date: 1101
      precision: year
      is_circa: false
      raw: 高丽肃宗六年十月
  birth_date: 1055
  death_date: 1101
  era: 高丽中期
  reign_ref: 高丽肃宗朝
  archetype: 集藏弘教型高僧
  dilemmas:
  - 王子尊荣与舍俗出家求道之抉择
  - 诸宗分歧与会归圆宗一乘之抉择
  - 广集异域教典与拣择扶择正义之权衡
  lesson: 广采集证而会归一心，以圆融法界贯摄诸教，令后学有所依归。
  summary_first_person: 吾本高丽王子，舍荣出家，入宋求法，亲承华严天台之旨，携数千卷教典归国，开立天台，编集圆宗文类，愿以普贤法界因果普利群生。
  source_urls:
