endeavors:
- id: guji-净源-endeavor-1
  title_zh: 华严疏钞刊正与宗风复兴
  summary: 嗟佛灭传授乖宗，后裔无依，刊正澄观疏钞，住持慧因弘讲，续晋水华严正脉
  phases:
  - key: brewing
    name: 晋水出家博览群典
    labels:
      zh: 出家学律阅华严
    start_date: '1025'
    highlight_event_id: guji-净源-event-study
  - key: breakthrough
    name: 南游求法得贤首旨
    labels:
      zh: 亲承华严耆宿
    start_date: '1045'
    highlight_event_id: guji-净源-event-study
  - key: climax
    name: 住慧因刊正疏钞弘讲
    labels:
      zh: 刊正疏钞大弘华严
    start_date: '1065'
    highlight_event_id: guji-净源-event-huayin
  - key: closure
    name: 删补群典付嘱后学
    labels:
      zh: 著述付嘱接续宗统
    start_date: '1080'
    highlight_event_id: guji-净源-event-huayin
  decisions:
  - date: '1065'
    title_zh: 住杭州慧因教院专弘华严
    rationale: 以威仪住持有则为轨，以讲授注疏为业，拯义溺学衰之弊
  - date: '1070'
    title_zh: 删补旧疏刊正澄观疏钞
    rationale: 去繁就简，纵夺略示，使初学有依，顿渐两益
- id: guji-净源-endeavor-2
  title_zh: 还源观科判整理与观门开示
  summary: 统括法藏还源观旨，立显一体起二用，继以三遍四德五止六观，会别归总，示谦勉学
  phases:
  - key: brewing
    name: 略序宗旨叹圣教超胜
    labels:
      zh: 总叹教宗叙凡难晓
    start_date: '1068'
    highlight_event_id: guji-净源-event-kepan
  - key: breakthrough
    name: 正辨一体二用立观本
    labels:
      zh: 显自性清净起二用
    start_date: '1070'
    highlight_event_id: guji-净源-event-kepan
  - key: climax
    name: 广辨三遍四德五止六观
    labels:
      zh: 一尘普周止观双运
    start_date: '1072'
    highlight_event_id: guji-净源-event-kepan
  - key: closure
    name: 统收会名偈辞勉学
    labels:
      zh: 会名示谦勉励寻源
    start_date: '1075'
    highlight_event_id: guji-净源-event-kepan
  decisions:
  - date: '1070'
    title_zh: 以科判摄还源观全文
    rationale: 总别开章，依章牒释，一显一体，二用三遍四德五止六观次第分明
  - date: '1075'
    title_zh: 以统收会名结归一源
    rationale: 此上法喻合理，顿根圆满获益，渐机亦得返迷悟道，故作偈勉学
events:
- id: guji-净源-event-birth
  title_zh: 晋水杨氏出生
  date: '1011'
  year_of: 1011
  description: 宋真宗咸平四年，生于并州晋水杨氏，宿具华严善根
- id: guji-净源-event-study
  title_zh: 出家受具博研华严
  date: '1028'
  year_of: 1028
  description: 少出家受具戒，南游从华严耆宿研澄观疏钞及起信宝性，兼通瑜伽杂集维摩经论
- id: guji-净源-event-huayin
  title_zh: 住慧因刊正疏钞弘华严
  date: '1065'
  year_of: 1065
  description: 住持杭州慧因教院，刊正华严经疏钞，大弘贤首之教，学者云集，华严中兴
- id: guji-净源-event-kepan
  title_zh: 刊正华严还源观科
  date: '1072'
  year_of: 1072
  description: 以晋水沙门身份刊正还源观科，题下分题目本文，文中分略序广辨统收会名示谦偈勉，显一体起二用，详三遍四德五止六观，并引华严起信为证
- id: guji-净源-event-death
  title_zh: 示寂于慧因
  date: '1088'
  year_of: 1088
  description: 宋哲宗元祐三年示寂于杭州慧因教院，世寿七十八，遗著普贤行愿品钞入法界品纂释等行于世
