  birth_date: '1011'
  death_date: '1088'
  era: 宋代
  reign_ref: 宋真宗至宋哲宗
  archetype: 华严复兴注疏宗师
  dilemmas:
  - 教海深广而凡情难晓，如何以科判摄归观门
  - 华严疏钞散乱而后学无依，如何刊正删补以续宗风
  - 理事圆融而根机有顿渐，如何以止观双运令迷者返源
  lesson: 以科判统摄经旨，以止观融会理事，令还源有门可入，复兴有教可依
  summary_first_person: 吾晋水沙门净源，生当宋初华严中微之际，窃见还源深旨难穷，机浅妄执，輙以删补群典，科判观门，显一体，起二用，示三遍，行四德，入五止，起六观，冀返迷归源，会别归总，备寻顿渐，不敢自专
  source_urls:
