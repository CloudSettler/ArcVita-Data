    start_date: 1178
    highlight_event_id: guji-善熹-event-shiyuan
  - key: climax
    name: 正名相斥妄添擅改
    labels:
      zh: 正名
    start_date: 1178
    highlight_event_id: guji-善熹-event-shiyuan
  - key: closure
    name: 合通论事苑成辨非集
    labels:
