endeavors:
- id: guji-善熹-endeavor-1
  title_zh: 辨圓覺經位斥別教之謬
  summary: 考圭山大小疏鈔及清涼玄談，證圓覺為頓教一乘非別教一乘，駁性起法界三觀之附會
  phases:
  - key: brewing
    name: 研讀圭山疏鈔見時謬
    labels:
      zh: 醞釀
    start_date: 1210-01-01
    highlight_event_id: guji-善熹-event-birth
  - key: breakthrough
    name: 據大疏除圓融主伴等文斷判
    labels:
      zh: 突破
    start_date: 1218-01-01
    highlight_event_id: guji-善熹-event-yuanjue-bian
  - key: climax
    name: 連書數條斥圓覺別教性起說
    labels:
      zh: 高潮
    start_date: 1222-01-01
    highlight_event_id: guji-善熹-event-yuanjue-bian
  - key: closure
    name: 結示頓教不屬三時五時
    labels:
      zh: 收束
    start_date: 1224-01-01
    highlight_event_id: guji-善熹-event-chimiu-complete
  decisions:
  - date: 1218-06-01
    title_zh: 定圓覺為頓教一乘
    rationale: 大疏明言義具終教頓教而不攝圓融主伴，大鈔自云頓教不屬三時五時，故不許為別教
  - date: 1222-03-01
    title_zh: 斥圓覺談性起及普眼三觀之說
    rationale: 疏云如華嚴說則知性起唯屬華嚴，經旨分同華嚴而不的配，故守圭山教眼不亂
- id: guji-善熹-endeavor-2
  title_zh: 正華嚴宗義斥三宗五教法華之謬
  summary: 依清涼敘西域賢首五教義章，辨性相法性三宗，駁法華終教三乘及破會不盡等說
  phases:
  - key: brewing
    name: 博覽探玄教章孔目見紛爭
    labels:
      zh: 醞釀
    start_date: 1215-01-01
    highlight_event_id: guji-善熹-event-yuanjue-bian
  - key: breakthrough
    name: 依清涼戒賢智光文考三宗
    labels:
      zh: 突破
    start_date: 1220-01-01
    highlight_event_id: guji-善熹-event-huayan-bian
  - key: climax
    name: 斥二宗三輪法華三乘破會之失
    labels:
      zh: 高潮
    start_date: 1223-01-01
    highlight_event_id: guji-善熹-event-huayan-bian
  - key: closure
    name: 以斥謬終篇警示後學
    labels:
      zh: 收束
    start_date: 1225-01-01
    highlight_event_id: guji-善熹-event-chimiu-complete
  decisions:
  - date: 1220-08-01
    title_zh: 守西域三宗兼敘性相之說
    rationale: 法界無差別疏及清涼敘文皆具三宗，戒賢智光各立三時互相違故不可合為二宗
  - date: 1223-05-01
    title_zh: 判法華為同教一乘非三乘終教
    rationale: 孔目教章皆云當同教一乘如法華經說，清涼云誰敢判法華為不了，故斥終頓三乘之判
events:
- id: guji-善熹-event-birth
  date: 1175-01-01
  year_of: 1175
  title_zh: 誕生於宋
  summary: 南宋時誕生，自號玉岑頤庵，學華嚴宗義
- id: guji-善熹-event-yuanjue-bian
  date: 1222-01-01
  year_of: 1222
  title_zh: 斥圓覺別教一乘之說
  summary: 引圭山序及玄談大疏第一第三鈔文，證圓覺為頓教一乘，斥以普眼章約法界三觀及性起附會華嚴者為大謬
- id: guji-善熹-event-huayan-bian
  date: 1223-01-01
  year_of: 1223
  title_zh: 斥三宗法華奘三藏三輪之說
  summary: 辨那爛陀戒賢智光及馬鳴堅慧三宗，斥法華終教三乘破會不盡及舉人不舉法之說，兼斥連珠判心經頓實之失
- id: guji-善熹-event-chimiu-complete
  date: 1225-01-01
  year_of: 1225
  title_zh: 撰成斥謬示來學
  summary: 以近人不師先覺多尚胸臆為憂，書條件辨頓漸同別三聖圓融等義，署玉岑頤庵善喜以傳後
- id: guji-善熹-event-death
  date: 1250-01-01
  year_of: 1250
  title_zh: 示寂於宋
  summary: 南宋時示寂，一生以考祖文護華嚴圓頓宗旨為任
