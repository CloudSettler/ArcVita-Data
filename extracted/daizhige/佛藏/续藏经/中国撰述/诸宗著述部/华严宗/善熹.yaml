  archetype: 護教辨謬的華嚴學僧
  dilemmas:
  - 近人不師先覺多尚胸臆聾瞽後生，我若緘默則過非淺，若直書斥謬則恐違時俗
  - 圓覺或判頓教一乘或判別教一乘，性起緣起同別未定，法華破會通局難明，必須考祖文以決擇
  lesson: 學教當師先覺考祖文，不以胸臆亂教眼，方能恢弘五祖之道而示來學
  summary_first_person: 我丁胸臆橫行之時，不容緘默，遂書條件以示來學，斥圓覺別教性起及三宗五教諸謬，願後人不昧教門宗旨
