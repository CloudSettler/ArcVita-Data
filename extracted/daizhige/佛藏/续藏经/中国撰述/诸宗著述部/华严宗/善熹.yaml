      zh: 立纲
    start_date: 1178
    highlight_event_id: guji-善熹-event-tonglun
  - key: climax
    name: 逐条破即非福德大身等说
    labels:
      zh: 逐破
    start_date: 1178
    highlight_event_id: guji-善熹-event-tonglun
  - key: closure
    name: 成通论辨非诸篇
    labels:
      zh: 成篇
    start_date: 1178
    highlight_event_id: guji-善熹-event-preface
  decisions:
  - date: 1178
    title_zh: 效明教非韩体作辨非集
    rationale: 非爱恶相攻志在法门流布共赞大猷故引圣教为衡量不任胸臆
  - date: 1178
    title_zh: 双用弥勒无著天亲以尊圭峰
    rationale: 无著天亲皆圣师不可取一舍一当以断疑为正兼存悬判科释
- id: guji-善熹-endeavor-2
  title_zh: 辨金刚事苑正译场旧义
  description: 针对分名心字不字添字大小经垂足即则虚空后五百岁持戒等斥穿凿守秦魏译本与大圣师说
  phases:
  - key: brewing
