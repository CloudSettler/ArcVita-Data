  decisions:
  - date: 1178
    title_zh: 守什本不擅加入藏
    rationale: 圣教东渐千圣不改易不可以信向便易存三十二分与添六十二字别行可也入藏不可
  - date: 1178
    title_zh: 尊慈恩清凉青龙元晓定量
    rationale: 大小经论不同不可以小乘母论证大乘经独异诸大圣师恐不胜任
