    title_zh: 以注代经直指即心即佛
    rationale: 凡圣一真唯证方知故须注释破迷现量之惑苦示悟真性之空明
  - date: '0832-01-01'
    title_zh: 立双忘双照不堕有无
    rationale: 有证有知则滞有无照无悟则滞无故立一念不生前后际断照体独立
