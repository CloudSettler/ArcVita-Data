person:
  qid: guji-师会
  name_zh: 师会
  names:
    zh: 师会
    en: Shihui
  lifespan:
    birth:
      date: 1130-01-01
      precision: year
      is_circa: true
      raw: 南宋绍兴初年左右
    death:
      date: 1185-01-01
      precision: year
      is_circa: true
      raw: 南宋淳熙年间左右
  birth_date: 1130-01-01
  death_date: 1185-01-01
  era: 南宋
  reign_ref: 宋孝宗乾道
  archetype: 华严义学辨惑者
  dilemmas:
  - 同别二教众说纷纭学者莫知适从当如何折衷群言以定一尊
  - 终顿二教是否合为同教一乘圆中之同与离教之同当如何分辨
  lesson: 博采祖文以公论定是非不党同异方能信佛祖之道而释学者之疑
  summary_first_person: 我为玉峰沙门师会生当南宋之世见华严同别之说易简迎福至相等各执一义学者二三不知孰是我乃博采孔目教章清凉贞元之文撰同教问答以会通终顿同实之旨庶几合符佛祖之道后有蠡泽善喜为之注脚其是非付之后学公论而已
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%8D%8E%E4%B8%A5%E5%AE%97/%E6%B3%A8%E5%90%8C%E6%95%99%E9%97%AE%E7%AD%94.html
endeavors:
- id: guji-师会-endeavor-1
  title_zh: 撰述华严同教问答
  description: 针对易简三种四门等异说博采祖文示其所归撰为问答以定同教之旨
  phases:
  - key: brewing
    name: 睹众说并立而起述作之志
    labels:
      zh:
      - 酝酿立言
    start_date: 1155-01-01
    highlight_event_id: guji-师会-event-compose-start
  - key: breakthrough
    name: 博采孔目教章以定同别纲宗
    labels:
      zh:
      - 会通祖文
    start_date: 1160-01-01
    highlight_event_id: guji-师会-event-compose-done
  - key: climax
    name: 问答成篇示学者以所归
    labels:
      zh:
      - 问答示归
    start_date: 1165-01-01
    highlight_event_id: guji-师会-event-compose-done
  - key: closure
    name: 付门人流布以待公论
    labels:
      zh:
      - 付嘱流布
    start_date: 1168-01-01
    highlight_event_id: guji-师会-event-annotated
  decisions:
  - date: 1160-01-01
    title_zh: 摭祖文而不用私党之说
    rationale: 学者二三不知孰是当公论是非不可私其所党故博采祖文以定归趣
  - date: 1165-01-01
    title_zh: 以会三归一立同教正义
    rationale: 从至相会三归一之释取孔目中同教示章中对别之同以合符佛祖之道
- id: guji-师会-endeavor-2
  title_zh: 会通终顿为同教一乘
  description: 会通清凉总相会通贞元观密之说辨终顿合为同教与圆中之同以拣别教
  phases:
  - key: brewing
    name: 研清凉四教开合之文
    labels:
      zh:
      - 研疏穷理
    start_date: 1160-01-01
    highlight_event_id: guji-师会-event-compose-done
  - key: breakthrough
    name: 点出终顿泯二合为同教一乘
    labels:
      zh:
      - 立义会通
    start_date: 1163-01-01
    highlight_event_id: guji-师会-event-compose-done
  - key: climax
    name: 以理事无碍三重显圆中之同
    labels:
      zh:
      - 显理证义
    start_date: 1165-01-01
    highlight_event_id: guji-师会-event-compose-done
  - key: closure
    name: 善喜注成其说益显
    labels:
      zh:
      - 注疏显道
    start_date: 1168-12-23
    highlight_event_id: guji-师会-event-annotated
  decisions:
  - date: 1163-01-01
    title_zh: 以合终顿释同教一乘
    rationale: 清凉云三同教一乘如法华等即合终顿二教故以存三为别泯二为同成四教开合之旨
  - date: 1165-01-01
    title_zh: 以该取存泯显圆中之同
    rationale: 江水入海亦咸以别该同皆圆教摄该取终顿入圆为理事无碍方是圆中同教非离教之存泯
