      zh: 习儒排佛
    start_date: '1755'
    highlight_event_id: guji-彭际清-event-1
  - key: breakthrough
    name: 究生死回向心地
    labels:
      zh: 回向心地
    start_date: '1762'
    highlight_event_id: guji-彭际清-event-1
  - key: climax
    name: 以四先生证佛会通
    labels:
      zh: 儒佛互证
    start_date: '1770'
    highlight_event_id: guji-彭际清-event-2
  - key: closure
    name: 读法华华严自信一乘
    labels:
      zh: 决疑自信
    start_date: '1775'
    highlight_event_id: guji-彭际清-event-2
  decisions:
  - date: '1762'
    title_zh: 弃排佛究生死回向心地
    rationale: 未闻道而死为虚生当发愤忘老以策性命之忧而求闻道
  - date: '1770'
    title_zh: 以明道象山阳明梁溪之旨证佛
    rationale: 四先生心学与佛往往而合不可入主出奴当穷法海原底而直决
- id: guji-彭际清-endeavor-2
  title_zh: 撰述一乘决疑论解惑
  description_zh: 惧天下万世之疑不决疏畅其说驳程张朱诸儒排佛之论以究竟一乘旨归华严
  phases:
  - key: brewing
    name: 畜疑华严藏海
    labels:
      zh: 畜疑求决
    start_date: '1773'
    highlight_event_id: guji-彭际清-event-2
  - key: breakthrough
    name: 悟易系中庸圆融
    labels:
      zh: 悟入一乘
    start_date: '1775'
    highlight_event_id: guji-彭际清-event-2
  - key: climax
    name: 驳程朱张排佛之说
    labels:
      zh: 破邪显正
    start_date: '1780'
    highlight_event_id: guji-彭际清-event-3
  - key: closure
    name: 成一乘决疑论流通
    labels:
      zh: 著述流通
    start_date: '1785'
    highlight_event_id: guji-彭际清-event-3
  decisions:
  - date: '1775'
    title_zh: 以易系无方中庸无倚游华严藏海
    rationale: 世出世间圆融无碍此土圣人多是大权方便名字不同不应横生异见
  - date: '1780'
    title_zh: 并附论显然排佛者以解诸儒之惑
    rationale: 既自信于中当究竟一乘之旨使忠孝仁义师心勿泥其迹而有助名教
