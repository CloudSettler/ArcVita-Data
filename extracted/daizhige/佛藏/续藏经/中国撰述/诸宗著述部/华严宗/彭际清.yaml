endeavors:
- id: guji-彭际清-endeavor-1
  title_zh: 由儒入佛会通决疑
  description_zh: 由执泥文字排佛转向究生死回向以四先生深造之旨证佛累年畜疑而后决
  phases:
  - key: brewing
    name: 初习儒书排佛
