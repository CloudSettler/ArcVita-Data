endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 承绪立宗判五教
  summary: 承杜顺智俨旧学别天台四教而立小始终顿圆五教统摄如来一代时教
  phases:
  - key: brewing
    name: 师事云华研华严
    labels:
      zh: 酝酿研学
    start_date: 0660-01-01
    highlight_event_id: guji-法藏-event-1
  - key: breakthrough
    name: 造五教章离四为五
    labels:
      zh: 立教突破
    start_date: 0680-01-01
    highlight_event_id: guji-法藏-event-2
  - key: climax
    name: 武周讲经帝师尊崇
    labels:
      zh: 弘阐高峰
    start_date: 0699-01-01
    highlight_event_id: guji-法藏-event-3
  - key: closure
    name: 教观齐备垂范后学
    labels:
      zh: 集成收束
    start_date: 0708-01-01
    highlight_event_id: guji-法藏-event-4
  decisions:
  - date: 0680-01-01
    title_zh: 离台四教别立五教
    rationale: 华严为根本法轮具开渐摄末之义四教未能尽其致故备其未备以全教体
  - date: 0699-01-01
    title_zh: 应诏讲新译华严
    rationale: 欲借译场因缘令根本法轮普耀朝野摄士庶同入法界
- id: guji-法藏-endeavor-2
  title_zh: 注经造论普化朝野
  summary: 疏解华严演三观十玄造金狮子章等百余卷论著化导帝王士庶宏传法界宗旨
  phases:
  - key: brewing
    name: 参译华严探玄抉微
    labels:
      zh: 译场酝酿
    start_date: 0695-01-01
    highlight_event_id: guji-法藏-event-3
  - key: breakthrough
    name: 进金狮子章喻法界
    labels:
      zh: 善巧突破
    start_date: 0698-01-01
    highlight_event_id: guji-法藏-event-3
  - key: climax
    name: 两朝悦服三帝归崇
    labels:
      zh: 化导高峰
    start_date: 0705-01-01
    highlight_event_id: guji-法藏-event-4
  - key: closure
    name: 着述百卷付嘱门人
    labels:
      zh: 着述收束
    start_date: 0710-01-01
    highlight_event_id: guji-法藏-event-4
  decisions:
  - date: 0698-01-01
    title_zh: 以金狮子喻十玄无碍
    rationale: 为令武后易解法界缘起故以近事为喻显理事圆融重重无尽
  - date: 0705-01-01
    title_zh: 受请讲经不辞王命
    rationale: 以护教宏法为怀借帝王之力延续华严正绪普令见闻得益
events:
- id: guji-法藏-event-birth
  title_zh: 生于京兆长安
  date: 0643-01-01
  year_of: 643
  place: 京兆长安
  description: 康居之后生于长安幼而静默好学博涉经史慕佛乘而舍俗
- id: guji-法藏-event-1
  title_zh: 师事智俨承华严绪
  date: 0660-01-01
  year_of: 660
  place: 长安云华寺
  description: 亲承二祖云华智俨研华严法界缘起深悟三观五教之旨继其席而弘化
- id: guji-法藏-event-2
  title_zh: 造五教章判三时五教
  date: 0680-01-01
  year_of: 680
  place: 长安
  description: 依华严判日出先照日升转照日没还照三时立小始终顿圆五教别四为五统摄一代时教
- id: guji-法藏-event-3
  title_zh: 武周译场讲新译华严
  date: 0699-01-01
  year_of: 699
  place: 洛阳佛授记寺
  description: 参译八十华严应武后之请升座讲演以金狮子喻法界无碍三帝归崇海内扬化
- id: guji-法藏-event-4
  title_zh: 着述垂后教观圆备
  date: 0708-01-01
  year_of: 708
  place: 长安
  description: 造探玄记妄尽还源观等百余卷明三观六相十玄令后学教观兼修入不思议法界
- id: guji-法藏-event-death
  title_zh: 示寂于长安
  date: 0712-12-01
  year_of: 712
  place: 长安
  description: 先天元年示寂于长安帝恸悼赠鸿胪卿谥号国一门人慧苑等继其绝学清凉圭峰绍隆其绪
