endeavors:
- id: guji-澄观-endeavor-1
  title_zh: 华严注疏弘宗化世
  summary: 研习华严，撰大疏钞，历事九朝为七帝师，确立华严宗正统。
  phases:
  - key: brewing
    name: 出家学律参禅
    labels:
      zh:
      - 出家
      - 学律
    start_date: 495
    highlight_event_id: guji-澄观-event-ordination
  - key: breakthrough
    name: 发愿深研华严
    labels:
      zh:
      - 华严
      - 研教
    start_date: 504
    highlight_event_id: guji-澄观-event-huayan
  - key: climax
    name: 撰疏进呈膺国师礼
    labels:
      zh:
      - 注疏
      - 弘法
    start_date: 0788
    highlight_event_id: guji-澄观-event-huayan
  - key: closure
    name: 门师七帝化流天下
    labels:
      zh:
      - 国师
      - 化世
    start_date: 0800
    highlight_event_id: guji-澄观-event-wuyunguan
  decisions:
  - date: 504
    title_zh: 专宗华严立教
    rationale: 见诸宗纷然，欲以华严圆教统摄小大，普被三乘，故专研华严以兴圆宗。
  - date: 0788
    title_zh: 撰华严大疏进朝
    rationale: 为令教义分明、学者有依，发愿注经，使圆旨大明，君臣信奉，正法久住。
- id: guji-澄观-endeavor-2
  title_zh: 述五蕴观破人法二执
  summary: 以色受想行识开示身心，立人空法空二观，破凡夫二乘之滞，示究竟解脱。
  phases:
  - key: brewing
    name: 观身心立五蕴名相
    labels:
      zh:
      - 五蕴
      - 身心
    start_date: 0795
    highlight_event_id: guji-澄观-event-wuyunguan
  - key: breakthrough
    name: 立人空观破人我执
    labels:
      zh:
      - 人空
      - 破执
    start_date: 0800
    highlight_event_id: guji-澄观-event-wuyunguan
  - key: climax
    name: 立法空观破法我执
    labels:
      zh:
      - 法空
      - 缘生
    start_date: 0805
    highlight_event_id: guji-澄观-event-wuyunguan
  - key: closure
    name: 双照结示究竟解脱
    labels:
      zh:
      - 双照
      - 解脱
    start_date: 0810
    highlight_event_id: guji-澄观-event-death
  decisions:
  - date: 0800
    title_zh: 以人空观对治人我
    rationale: 生死之本在人法二执，凡夫迷身心总相而计人我，故先观五蕴和合假名，求我不可得，出分段生死。
  - date: 0805
    title_zh: 以法空观对治法我
    rationale: 二乘迷五蕴自相而计法有，故次观一一蕴皆从缘生无自性，五蕴皆空，度变易生死，证究竟涅槃。
