      raw: 唐开成四年
  birth_date: 0738
  death_date: 0839
  era: 唐
  reign_ref: 唐玄宗至唐文宗
  archetype: 弘法宗师
  dilemmas:
  - 身心真妄难辨，若不识五蕴则悬契真如无本，诸行徒施
  - 人我法我双执难除，凡夫执人我，二乘滞法我，须二观双照方得究竟解脱
  lesson: 了妄证真须先观身心，五蕴皆空则人法俱遣，方出分段变易二种生死。
  summary_first_person: 我是澄观，唐时沙门，世称清凉国师。我研华严而立宗，弘大经以化时，更述五蕴观，教人以人空观破人我，以法空观破法我，令双照五蕴皆空，离怖畏度苦厄，趣究竟解脱。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%8D%8E%E4%B8%A5%E5%AE%97/%E4%BA%94%E8%95%B4%E8%A7%82.html
