endeavors:
- id: guji-续法-endeavor-1
  title_zh: 集录略本渐悟教观奥妙
  summary_zh: 自丙午得教仪六卷至己酉略成一卷练习日课久久精纯知教观从自心流出
  phases:
  - key: brewing
    name: 丙午得教仪六卷而未能诵
    labels:
      zh:
      - 得法
    start_date: '1666'
    highlight_event_id: guji-续法-event-delue
  - key: breakthrough
    name: 己酉略成一卷以为日课
    labels:
      zh:
      - 略集
    start_date: '1669'
    highlight_event_id: guji-续法-event-delue
  - key: climax
    name: 久久练习渐得奥妙精纯贯通
    labels:
      zh:
      - 悟入
    start_date: '1670'
    highlight_event_id: guji-续法-event-delue
  - key: closure
    name: 知教观创于华严诸祖本于经论
    labels:
      zh:
      - 会通
    start_date: '1674'
    highlight_event_id: guji-续法-event-jiang
  decisions:
  - date: '1669'
    title_zh: 略成一卷练习以为日课
    rationale: 非日课研诵不能久久渐得奥妙故以略本便记诵
  - date: '1675'
    title_zh: 出箧中略本普令录诵
    rationale: 听众不熟究全本茫然故以略本令昼夜研诵而工成
- id: guji-续法-endeavor-2
  title_zh: 讲演刊刻流通开蒙
  summary_zh: 乙卯秋讲全本辛酉再讲皆茫然遂募资于壬戌春刻略本以利行远登高
  phases:
  - key: brewing
    name: 乙卯秋讲全本听众茫然
    labels:
      zh:
      - 开讲
    start_date: '1675'
    highlight_event_id: guji-续法-event-jiang
  - key: breakthrough
    name: 辛酉再讲落堂考问仍不知终始
    labels:
      zh:
      - 验众
    start_date: '1681'
    highlight_event_id: guji-续法-event-jiang
  - key: climax
    name: 壬戌春募资刻略本流传
    labels:
      zh:
      - 刊刻
    start_date: '1682'
    highlight_event_id: guji-续法-event-kanke
  - key: closure
    name: 梓行天下为行远登高要诀
    labels:
      zh:
      - 流通
    start_date: '1682'
    highlight_event_id: guji-续法-event-kanke
  decisions:
  - date: '1681'
    title_zh: 以略本普令录诵再加研考
    rationale: 众不熟究全本故须便记诵之略本方能豁通无碍
  - date: '1682'
    title_zh: 募资梓行略本不秘惜
    rationale: 详略各益苟利生物则行远登高皆赖此要诀故从众请刻流传
