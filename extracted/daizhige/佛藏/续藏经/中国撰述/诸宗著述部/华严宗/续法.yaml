endeavors:
- id: guji-续法-endeavor-1
  title_zh: 五教断证排图贯线
  summary: 准贤宗诸大部录出小始终顿圆五教断证以本觉名字相似随分圆觉贯线成图明行布中圆融无碍
  phases:
  - key: brewing
    name: 痛心发心
    labels:
      zh: 发心立志
    start_date: 1670-03-01
    highlight_event_id: guji-续法-event-chart-vertical
  - key: breakthrough
    name: 竖录单条
    labels:
      zh: 竖图初成
    start_date: 1670-03-01
    highlight_event_id: guji-续法-event-chart-vertical
  - key: climax
    name: 横钞册页
    labels:
      zh: 横图重编
    start_date: 1681-12-08
    highlight_event_id: guji-续法-event-chart-horizontal
  - key: closure
    name: 付嘱门人
    labels:
      zh: 校刊流布
    start_date: 1681-12-08
    highlight_event_id: guji-续法-event-chart-horizontal
  decisions:
  - date: 1670-03-01
    title_zh: 竖录此图于单条纸粘之座侧
    rationale: 典诰既多知见自广后后胜前前故先竖录令一家判释明如指掌
  - date: 1681-12-08
    title_zh: 再为横钞于册页流之远久
    rationale: 单条易遗失不便行坐披阅故改为横钞令行坐可阅兼利久远
- id: guji-续法-endeavor-2
  title_zh: 三觉五位拣滥开示
  summary: 立本觉名字相似随分圆觉三觉摄小始终顿圆五位拣滥偏圆权实示双观法门令转小成大转权成实
  phases:
  - key: brewing
    name: 会通经论
    labels:
      zh: 搜检教仪
    start_date: 1670-03-01
    highlight_event_id: guji-续法-event-chart-vertical
  - key: breakthrough
    name: 三觉判摄
    labels:
      zh: 立三觉
    start_date: 1670-03-01
    highlight_event_id: guji-续法-event-chart-vertical
  - key: climax
    name: 双观指示
    labels:
      zh: 示两观
    start_date: 1681-12-08
    highlight_event_id: guji-续法-event-chart-horizontal
  - key: closure
    name: 诗偈付学
    labels:
      zh: 嘱返妄归真
    start_date: 1681-12-08
    highlight_event_id: guji-续法-event-chart-horizontal
  decisions:
  - date: 1670-03-01
    title_zh: 以三觉五位判教相权实
    rationale: 三五位别一觉性同唯悟顿圆妙觉方能断执证界故立此以拣滥偏圆
  - date: 1681-12-08
    title_zh: 示竖横两观不凝滞于佛
    rationale: 竖则迷本逐末横则先后有次若作返妄归真须逆观故特示两观以显圆融
