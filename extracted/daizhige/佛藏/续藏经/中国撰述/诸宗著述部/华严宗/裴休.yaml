    en: Pei Xiu
  lifespan:
    birth:
      date: 0791
      precision: year
      is_circa: false
      raw: 唐德宗贞元七年河东闻喜
    death:
      date: 0864
      precision: year
      is_circa: false
      raw: 唐懿宗咸通五年
  birth_date: 0791
  death_date: 0864
  era: 唐
  reign_ref: 唐文宗开成至唐懿宗咸通
  archetype: 儒佛贯通之居士宰相
  dilemmas:
  - 身居相位手握权衡，如何不以世荣损道心而以道心运世务
  - 末法根钝凡夫难信大心，如何以三心五誓接引僧俗同归菩提
  lesson: 以儒治世以佛治心，发出世大心行入世大事，悲智愿三心相资方能自度度人直至菩提
  summary_first_person: 吾河东裴休，少登进士，历事数朝，位至中书侍郎平章事，然深感世荣无常，遂归心佛乘，师事圭峰宗密，参扣黄檗希运，深悟圆觉真心，愍念末法众生少信大法，故于绵州刺史任上作劝发菩提心文，发明菩提名义心体三心五誓，普劝僧俗同发无上道心，生生护持正法直至成佛
