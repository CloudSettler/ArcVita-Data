endeavors:
- id: guji-裴休-endeavor-1
  title_zh: 筮仕历州入朝拜相
  summary: 由进士登第历监察御史中书舍人，历绵州宣州浙东，终至大中七年拜中书侍郎同平章事，以儒术振纲守正
  phases:
  - key: brewing
    name: 进士登第初入仕途
    labels:
      zh: 科名筮仕
    start_date: 0825
    highlight_event_id: guji-裴休-event-jinshi
  - key: breakthrough
    name: 历任内外谏诤守正
    labels:
      zh: 历练中外
    start_date: 0830
    highlight_event_id: guji-裴休-event-mianzhou
  - key: climax
    name: 大中拜相总理庶政
    labels:
      zh: 入朝秉政
    start_date: 0853
    highlight_event_id: guji-裴休-event-zaixiang
  - key: closure
    name: 罢政守官归老守道
    labels:
      zh: 罢相守道
    start_date: 0856
    highlight_event_id: guji-裴休-event-death
  decisions:
  - date: 0838
    title_zh: 出守绵州不废弘道
    rationale: 外放刺史不以迁谪为意，乘暇阐发菩提心义，化一方为道场
  - date: 0853
    title_zh: 居相位以法绳吏
    rationale: 以儒法整顿吏治，以佛心运大悲，欲令朝野皆沾教化
- id: guji-裴休-endeavor-2
  title_zh: 参禅问道劝发菩提
  summary: 师事宗密受圆觉心要，参黄檗得禅门宗旨，撰劝发菩提心文立三心五誓，普劝僧俗同成佛道
  phases:
  - key: brewing
    name: 问道圭峰悟自真心
    labels:
      zh: 亲近宗密
    start_date: 0831
    highlight_event_id: guji-裴休-event-jinshi
  - key: breakthrough
    name: 绵州述作劝发心文
    labels:
      zh: 撰述劝发
    start_date: 0838
    highlight_event_id: guji-裴休-event-mianzhou
  - key: climax
    name: 参扣黄檗刊传禅录
    labels:
      zh: 护持禅宗
    start_date: 0848
    highlight_event_id: guji-裴休-event-huangbo
  - key: closure
    name: 流通本愿回向菩提
    labels:
      zh: 流通遗化
    start_date: 0864
    highlight_event_id: guji-裴休-event-death
  decisions:
  - date: '0838-07-18'
    title_zh: 发三心立五誓普告僧俗
    rationale: 悟真心本具三无差别，恐凡夫自薄不发大心，故以大悲大智大愿摄众同登佛地
  - date: 0848
    title_zh: 集黄檗语为宛陵录
    rationale: 恐禅门正眼失传，躬自请益记录流通，令学人不堕偏邪怠速之病
events:
- id: guji-裴休-event-birth
  title_zh: 诞生河东闻喜裴氏
  date: 0791
  year_of: 791
  place_zh: 河东闻喜
  description: 唐德宗贞元七年生于河东名族，字公美，少颖悟好学，深通儒典
- id: guji-裴休-event-jinshi
  title_zh: 登进士第入官
  date: 0825
  year_of: 825
  place_zh: 长安
  description: 宝历太和间登进士第，释褐入仕，历监察御史起居郎，以文行器识见重于时
- id: guji-裴休-event-mianzhou
  title_zh: 守绵州撰劝发菩提心文
  date: '0838-07-18'
  year_of: 838
  place_zh: 绵州
  description: 唐文宗开成三年六月二十日，以绵州刺史述劝发菩提心文，宗密为序，明菩提名义心体三心五誓，普劝僧俗同发无上道心
- id: guji-裴休-event-huangbo
  title_zh: 参黄檗问道钟陵
  date: 0848
  year_of: 848
  place_zh: 钟陵洪州
  description: 镇钟陵时延请黄檗希运住大安寺，朝夕请益，记录语要成黄檗断际禅师宛陵录，并深契圭峰圆觉之旨
- id: guji-裴休-event-zaixiang
  title_zh: 大中七年拜相
  date: 0853
  year_of: 853
  place_zh: 长安
  description: 唐宣宗大中七年拜中书侍郎同中书门下平章事，辅政五年，持法守正，时望翕然，仍以护法居士领袖缁素
- id: guji-裴休-event-death
  title_zh: 咸通五年示寂
  date: 0864
  year_of: 864
  place_zh: 长安
  description: 唐懿宗咸通五年卒，遗文流通后世，宋绍兴净照重刊，明清续藏收为华严宗著述，后世日本高辨亦顶戴流通
