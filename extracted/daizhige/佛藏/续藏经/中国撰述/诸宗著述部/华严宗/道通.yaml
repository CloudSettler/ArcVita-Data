endeavors:
- id: guji-道通-endeavor-1
  title_zh: 疏解真空观与理事无碍观
  description: 以会色归空明空即色四句开显真空，又以理事十门波水十喻发明大小一异全遍全匝依理成事事能显理等义
  phases:
  - key: brewing
    name: 栖心华严法界教观
    labels:
      zh: 酝酿研读
    start_date: 1070-01-01
    highlight_event_id: guji-道通-event-study
  - key: breakthrough
    name: 提纲真空四句八门
    labels:
      zh: 突破立纲
    start_date: 1082-01-01
    highlight_event_id: guji-道通-event-true-emptiness
  - key: climax
    name: 详释理事无碍十门
    labels:
      zh: 高潮敷演
    start_date: 1088-01-01
    highlight_event_id: guji-道通-event-principle-phenomena
  - key: closure
    name: 结集真空理事章句
    labels:
      zh: 收束成文
    start_date: 1092-01-01
    highlight_event_id: guji-道通-event-principle-phenomena
  decisions:
  - date: 1082-01-01
    title_zh: 立十字标三字征二十字释体例
    rationale: 为令初学观照妙境因解起行，故前二句八门各立标征释，若改色字为十法界字则法法即真
  - date: 1088-01-01
    title_zh: 以波水十喻明理事互望
    rationale: 理事不相离而不可分不坏相，故取海波水湿为喻，以全遍全匝同时各匝显非一异之量
- id: guji-道通-endeavor-2
  title_zh: 阐发周遍含融与十玄无尽成披云集
  description: 以理如事事如理事含理事通局广狭遍容摄入交涉相在溥融十门，入金镜灯喻发明重重无尽主伴互融，集成一卷
  phases:
  - key: brewing
    name: 博观华严经吞海诸疏
    labels:
      zh: 酝酿资粮
    start_date: 1090-01-01
    highlight_event_id: guji-道通-event-principle-phenomena
  - key: breakthrough
    name: 立周遍含融五门纲要
    labels:
      zh: 突破构架
    start_date: 1094-01-01
    highlight_event_id: guji-道通-event-pervasive-fusion
  - key: climax
    name: 以镜灯喻演十玄交涉
    labels:
      zh: 高潮敷演
    start_date: 1098-01-01
    highlight_event_id: guji-道通-event-pervasive-fusion
  - key: closure
    name: 集成法界观披云集一卷
    labels:
      zh: 收束流通
    start_date: 1102-01-01
    highlight_event_id: guji-道通-event-compile
  decisions:
  - date: 1094-01-01
    title_zh: 以金为六道太虚空为喻显理事互融
    rationale: 真理随相异而俱时显现，一尘正遍华藏唯心所现，故立理如事事如理事含理事等门
  - date: 1098-01-01
    title_zh: 以九镜十镜灯影发明摄入交涉
    rationale: 为显一摄一切一切入一同时顿具，故借镜镜相摄灯灯相在，将十门入一切法义方成十玄之义
