  dilemmas:
  - 如何会色归空又明空即色而不堕断空实色两边
  - 如何理事互望全遍全匝而不坏性相一异大小之相
  - 如何以一尘含摄剎海令十玄重重无尽而行者可入
  lesson: 因解起行遗智忘言，由真空而理事无碍而周遍含融，渐次升进以悟难思法界
  summary_first_person: 我是河朔平原道通，宋世研习华严法界观的沙门，我取杜顺法界三观为纲，以十字标三字征二十字释疏解真空理事周遍三重，又以波水镜喻发明十门十玄，集成法界观披云集一卷，愿披云见日令学者自悟真体而起无碍妙用
