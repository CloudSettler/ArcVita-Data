endeavors:
- id: guji-与咸-endeavor-1
  title_zh: 重明教证四义复别教宗旨
  summary_zh: 考地论教道证道以正约行约说之名定地前登地十地妙觉四位消别教教权证实之疑
  phases:
  - key: brewing
    name: 迟疑旧说考核经论
    labels:
      zh:
      - 教证
      - 别教
    start_date: 1180-01-01
    highlight_event_id: guji-与咸-event-jiaozheng
  - key: breakthrough
    name: 悟约说但有其教无人历证
    labels:
      zh:
      - 约行
      - 约说
    start_date: 1183-01-01
    highlight_event_id: guji-与咸-event-jiaozheng
  - key: climax
    name: 立十地妙觉判约说教证
    labels:
      zh:
      - 约说教道
      - 约说证道
    start_date: 1185-01-01
    highlight_event_id: guji-与咸-event-jiaozheng
  - key: closure
    name: 撰教证篇以示后学
    labels:
      zh:
      - 复宗
      - 述作
    start_date: 1186-01-01
    highlight_event_id: guji-与咸-event-jiaozheng
  decisions:
  - date: 1185-01-01
    title_zh: 不从旧说以十地始终为约说教道
    rationale: 旧以一教始终为约说教道则一位两属借义无功故据地论十地始终及荆溪仍存教道之文改判
  - date: 1186-01-01
    title_zh: 以妙觉一位为约说证道
    rationale: 已证指妙觉果人道场所证方合有教无人之旨故定妙觉为证道以免十地圆融隔历两属之谬
- id: guji-与咸-endeavor-2
  title_zh: 释法华方便品题旨显实之功
  summary_zh: 明经家标方便不标真实之意叹三教方便引导之力今日成功显实故殷勤称叹
  phases:
  - key: brewing
    name: 研味方便品总别不贯之难
    labels:
      zh:
      - 法华
      - 方便
    start_date: 1188-01-01
    highlight_event_id: guji-与咸-event-fangbian
  - key: breakthrough
    name: 悟标方便是叹善巧成功之功
    labels:
      zh:
      - 能通
      - 法用
    start_date: 1189-01-01
    highlight_event_id: guji-与咸-event-fangbian
  - key: climax
    name: 以良将喻显方便有显实之功
    labels:
      zh:
      - 秘妙方便
      - 显实
    start_date: 1190-01-01
    highlight_event_id: guji-与咸-event-fangbian
  - key: closure
    name: 撰方便篇会通三释
    labels:
      zh:
      - 复宗
      - 述作
    start_date: 1191-01-01
    highlight_event_id: guji-与咸-event-fangbian
  decisions:
  - date: 1190-01-01
    title_zh: 从称叹方便之功释题品
    rationale: 一品始终皆叹无数方便引导之力若标真实反成总别不贯故以方便显实立义
  - date: 1191-01-01
    title_zh: 以三教为方便会三释归一
    rationale: 在昔施设为法用能通今日成功为秘妙并以三教为体方合天台释题与佛心
- id: guji-与咸-endeavor-3
  title_zh: 辨尘沙惑体兼俗复化导本怀
  summary_zh: 明尘沙无别体即见思药病方法破牵生不牵生之诤显四教兼俗为利他之学
  phases:
  - key: brewing
    name: 考三惑对土牵生之诤
    labels:
      zh:
      - 尘沙
      - 惑体
    start_date: 1191-01-01
    highlight_event_id: guji-与咸-event-chensha
  - key: breakthrough
    name: 悟尘沙即分别见思药病之法
    labels:
      zh:
      - 知病
      - 识药
    start_date: 1192-01-01
    highlight_event_id: guji-与咸-event-chensha
  - key: climax
    name: 断尘沙不牵自生但障化导
    labels:
      zh:
      - 俗谛
      - 化他
    start_date: 1192-06-01
    highlight_event_id: guji-与咸-event-chensha
  - key: closure
    name: 撰尘沙篇以正四明之外诸说
    labels:
      zh:
      - 复宗
      - 述作
    start_date: 1193-01-01
    highlight_event_id: guji-与咸-event-chensha
  decisions:
  - date: 1192-01-01
    title_zh: 立尘沙无别体即见思方法
    rationale: 止观出假三科皆为分别他分见思久近重数与治病之药故尘沙不是别惑
  - date: 1192-06-01
    title_zh: 判尘沙不牵自生但障化导
    rationale: 自分见思已断不能牵生但不了他分药病则不能利物故尘沙唯障化导四念处招果报指他分众生
