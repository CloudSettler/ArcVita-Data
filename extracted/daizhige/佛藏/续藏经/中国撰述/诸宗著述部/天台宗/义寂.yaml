events:
- id: guji-义寂-event-birth
  title_zh: 永嘉出生
  date: 0919
  year_of: 919
  place_zh: 温州永嘉胡氏家
  description_zh: 母郑氏娠而不食肉，幼与群儿戏遇游方僧摩顶记为吾门达者，十二投开元寺子安出家
- id: guji-义寂-event-ordination
  title_zh: 受具习台宗顿悟
  date: 0938
  year_of: 938
  place_zh: 会稽及天台国清寺
  description_zh: 十九受具业律于会稽清律师，南之天台承耸广二师学法华本迹不二门，汗落顿悟登座衍说
- id: guji-义寂-event-build-chuanjiao
  title_zh: 螺溪法堂初成
  date: 0964-08-01
  year_of: 964
  place_zh: 台州天台螺溪传教院
  description_zh: 纳张彦安舍地，得法华岩公门人齐公请施三十万，乾德甲子秋八月堂成率徒二十人居之
- id: guji-义寂-event-complete
  title_zh: 传教院建创毕备
  date: 0967-01-01
  year_of: 967
  place_zh: 螺溪传教院
  description_zh: 承汉南国王命及襄华二师宗藩施助，丁卯岁重构忏堂法堂禅室经室总百三十余间
- id: guji-义寂-event-preach
  title_zh: 讲金光明饭僧三万
  date: 0977-01-01
  year_of: 977
  place_zh: 螺溪传教院弥陀殿
  description_zh: 太平兴国二年承施建弥陀殿，讲金光明一座饭僧三万人，请襄师募建像设庄严三宝
- id: guji-义寂-event-precepts
  title_zh: 入山授菩萨戒化众
  date: 0983-01-01
  year_of: 983
  place_zh: 天台山中
  description_zh: 癸未年使臣与台守入山请受菩萨戒自称弟子，遂为台人授戒，舍屠宰断血食及发愿出家者甚众
- id: guji-义寂-event-death
  title_zh: 丈室端坐迁化
  date: 0987-11-04
  year_of: 987
  place_zh: 国清寺方丈
  description_zh: 雍熙四年十一月四日目疾终右胁而卧神往形具，俗寿六十九僧腊五十，后五年改葬身体不坏芳香蓊然
