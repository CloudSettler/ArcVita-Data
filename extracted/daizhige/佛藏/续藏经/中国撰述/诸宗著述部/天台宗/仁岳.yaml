      - 师资
    start_date: '1023'
    highlight_event_id: guji-仁岳-event-shijian
  decisions:
  - date: '1015'
    title_zh: 对论刊正仍存生身别圆异解
    rationale: 以安养生身混同舍那尊特有妨一家教观不使外闻潜修以待决择
  - date: '1022'
    title_zh: 不避言黜上书十谏妙宗
    rationale: 以父有诤子之义逃不孝之罪惜妙宗偶失之文为后昆莫救之义尽忠赤极犯慈颜
- id: guji-仁岳-endeavor-2
  title_zh: 著雪谤析难止疑抉膜维护山外异说
  summary: 十谏后复作雪谤书别理随缘十门析难书止疑书抉膜书等与知礼释难扶宗往复辨论弥陀八万四千相业识事识与同居实报之分
