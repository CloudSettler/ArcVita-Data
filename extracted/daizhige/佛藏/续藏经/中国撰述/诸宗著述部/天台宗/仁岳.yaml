  - date: '1023'
    title_zh: 作雪谤别理随缘析难
    rationale: 以事业二识分判生报恐伤径庭须正名分相以显权实二理空中二观
  - date: '1024'
    title_zh: 作止疑抉膜论弥陀常身观境
    rationale: 以观经八万四千相为安养胜应生身非藏尘尊特须托同居依正修三观以全托彼依正之义
