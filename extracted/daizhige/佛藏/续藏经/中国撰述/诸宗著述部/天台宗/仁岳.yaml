  date: '1022'
  year_of: 1022
  title_zh: 讲荆溪十不二门
  description: 因讲次览荆溪十门辞实体要，历观诸家释者莫能一贯，遂发心笺解以决持疑
- id: guji-仁岳-event-wenxin
  date: '1032'
  year_of: 1032
  title_zh: 述十不二门文心解
  description: 述十不二门文心解，释迹门因果自他，立色心内外修性因果染净依正自他三业权实受润十门不二，会归一念三千即空假中
- id: guji-仁岳-event-death
  date: '1064'
  year_of: 1064
  title_zh: 示寂
  description: 北宋仁宗时示寂，留文心解以示观法大体
