endeavors:
- id: guji-仁岳-endeavor-1
  title_zh: 笺解十不二门文心解
  description: 因讲次笺解荆溪十不二门，分节科目，以文心命题，撮十妙为观法大体
  phases:
  - key: brewing
    name: 讲次积累
    labels:
      zh: 天台讲学
    start_date: '1022'
    highlight_event_id: guji-仁岳-event-lecture
  - key: climax
    name: 文心解成
    labels:
      zh: 撰述
    start_date: '1032'
    highlight_event_id: guji-仁岳-event-wenxin
  decisions:
  - date: '1032'
    title_zh: 以文心命题分节科目
    rationale: 接迹本以通本，撮十妙为一念三千观体，使一部经旨皎在目前
  - date: '1032'
    title_zh: 直申一理而不广引诚证
    rationale: 迹门已广引法华证十妙，此下但申不二之理以利观行
- id: guji-仁岳-endeavor-2
  title_zh: 迹门因果自他辨正
  description: 谈迹门因果自他，开教入醍醐，辨矢石帝虎之讹，正自他不二之旨
  phases:
  - key: breakthrough
    name: 辨因果自他
    labels:
      zh: 义理辨正
    start_date: '1025'
    highlight_event_id: guji-仁岳-event-lecture
  - key: closure
    name: 矢石帝虎之辨
    labels:
      zh: 讲学决疑
    start_date: '1032'
    highlight_event_id: guji-仁岳-event-wenxin
  decisions:
  - date: '1025'
    title_zh: 以因果自他收摄十妙
    rationale: 境智行位为自因，三法为自果，感应神通说法眷属利益为化他能所，始末具足
  - date: '1032'
    title_zh: 正自他不二立义之讹
    rationale: 感应等立自他不二，不可以前五为自后五为他一例玄义释名
events:
