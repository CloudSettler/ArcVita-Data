endeavors:
- id: guji-仁潮-endeavor-1
  title_zh: 集录法界安立图七门
  description: 自南洲人间发轸渐及大地三界大千佛刹以至法界总论，从凡至圣自近而远通为一观
  phases:
  - key: brewing
    name: 发轸人间起观
    labels:
      zh:
      - 近远渐进
    start_date: 1600
    highlight_event_id: guji-仁潮-event-vow
  - key: breakthrough
    name: 广搜经论立纲
    labels:
      zh:
      - 七门分卷
    start_date: 1605
    highlight_event_id: guji-仁潮-event-outline
  - key: climax
    name: 天目兰若成书
    labels:
      zh:
      - 自序阐宗
    start_date: 1607-08-15
    highlight_event_id: guji-仁潮-event-tianmu
  - key: closure
    name: 流通僻壤劝信
    labels:
      zh:
      - 法施利生
    start_date: 1607-09-01
    highlight_event_id: guji-仁潮-event-spread
  decisions:
  - date: 1605-01-01
    title_zh: 略明有门暂置空空妙理
    rationale: 山陬海曲穷年不闻正法者须先信实有人天世界凡圣因果故以有门接引
  - date: 1607-08-15
    title_zh: 明知通都有大藏仍坚持汇集
    rationale: 怜头白未谤因果者无书可依宁为骈赘也要开发善信作法施之助
- id: guji-仁潮-endeavor-2
  title_zh: 辨胡梵中外显中道
  description: 别胡梵论地中九义论仙道断疑生信，明天竺为大地之中金刚座为地脐中道为正法
  phases:
  - key: brewing
    name: 考西域图生疑
    labels:
      zh:
      - 华夷之辨
    start_date: 1603
    highlight_event_id: guji-仁潮-event-vow
  - key: breakthrough
    name: 九义证明地中
    labels:
      zh:
      - 名闻里分山王水源地脐轮王梵字气和道中
    start_date: 1606
    highlight_event_id: guji-仁潮-event-outline
  - key: climax
    name: 正名胡梵斥邪
    labels:
      zh:
      - 梵胡甄别
    start_date: 1607-08-15
    highlight_event_id: guji-仁潮-event-tianmu
  - key: closure
    name: 以中道调心劝修
    labels:
      zh:
      - 不缓不急
    start_date: 1607-09-01
    highlight_event_id: guji-仁潮-event-spread
  decisions:
  - date: 1606-06-01
    title_zh: 以九义立天竺为中
    rationale: 世俗谓中国为中乃一隅之中，依里分数山王水源地脐等方知中印当大地之正中
  - date: 1607-08-15
    title_zh: 改胡经胡语为梵经梵语
    rationale: 天竺为净行婆罗门国非胡虏之乡，正名方能通幽彻明令鬼神敬畏
events:
- id: guji-仁潮-event-birth
  title_zh: 降生燕山
  date: 1570
  year_of: 1570
  place_zh: 燕山
  description: 明隆庆前后生于燕地，后出家为沙门，习天台诸宗著述
- id: guji-仁潮-event-vow
  title_zh: 发愿汇集法界诸说
  date: 1600
  year_of: 1600
  place_zh: 燕山
  description: 见凡庸暗识疑信相半邪正交陈，发愿搜采经论西域志释迦方谱等渐次安立法界
- id: guji-仁潮-event-outline
  title_zh: 分卷立目七门百余则
  date: 1605
  year_of: 1605
  place_zh: 天目山
  description: 立略明南洲广步大地遍观三界大千劫量游诸佛刹研穷法界法界总论七门百十余则
- id: guji-仁潮-event-tianmu
  title_zh: 天目兰若成书作自序
  date: 1607-08-15
  year_of: 1607
  place_zh: 天目兰若
  description: 万历丁未仲秋于天目兰若集录告成，自序明因果为操修之具凡圣为升进之功刹海总会心源
- id: guji-仁潮-event-spread
  title_zh: 流通安立图示方隅
  date: 1607-09-01
  year_of: 1607
  place_zh: 江南山陬
  description: 将南赡部洲图震旦国图别胡梵九义等流通穷乡，令未闻正法者断疑生信开发善信
- id: guji-仁潮-event-death
  title_zh: 示寂
  date: 1625
  year_of: 1625
  place_zh: 燕山
  description: 明天启前后示寂，一生以有门法施补通都大藏之所不及
