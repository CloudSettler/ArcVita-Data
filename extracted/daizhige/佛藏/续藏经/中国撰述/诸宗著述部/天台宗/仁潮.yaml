  reign_ref: 明神宗万历
  archetype: 汇集显正型讲席沙门
  dilemmas:
  - title_zh: 空有之诤
    description: 一执耽空拨无佛土堕莽荡深坑，一执迷事昧因果，须以有门实有接引未闻法者
  - title_zh: 华夷中外之惑
    description: 世俗以华夏为天下之中而疑西域，须以九义辨明大地之中在天竺雪山龙池
  lesson: 因果是自心影向，凡圣是迷悟分位，离事无理，守中道而行方能空有无碍福智两严
  summary_first_person: 我是燕山沙门仁潮，万历丁未仲秋集法界安立图于天目兰若，自略明南洲渐至研穷法界通为一观，欲令山陬海曲未闻正法者信因果明凡圣趋向有阶终归心源
