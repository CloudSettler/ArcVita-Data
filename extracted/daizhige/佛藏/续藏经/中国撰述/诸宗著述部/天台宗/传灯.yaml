  decisions:
  - date: 1595-01-01
    title_zh: 坚持天台圆教以对抗禅华独大
    rationale: 时运下衰教脉几绝唯有举性具旗帜方能续慧命故不附时好而专弘止观
  - date: 1620-01-01
    title_zh: 结坛楞严专事注疏讲学
    rationale: 行解并重以著述摄机欲以文字般若印证心行令学人有所依凭故栖不瞬堂而勤笔削
- id: guji-传灯-endeavor-2
  title_zh: 注解传佛心印记显性恶圆义
  summary_zh: 因无尽旧注微有不稳乃重加消释辨修性即离以正他宗似是之非
  phases:
  - key: brewing
    name: 得虎溪心印记及无尽旧注而研味
    labels:
      zh: 发愿注解
    start_date: 1625-01-01
    highlight_event_id: guji-传灯-event-preach
  - key: breakthrough
    name: 揭只一具字立性恶正义
    labels:
      zh: 拈出宗体
    start_date: 1627-01-01
    highlight_event_id: guji-传灯-event-annotate
  - key: climax
    name: 天启丁卯自恣后述序成书
    labels:
      zh: 成书示众
    start_date: 1627-09-11
    highlight_event_id: guji-传灯-event-annotate
  - key: closure
    name: 校付灵耀流通后世
    labels:
      zh: 校刊流通
    start_date: 1628-01-01
    highlight_event_id: guji-传灯-event-death
  decisions:
  - date: 1627-09-11
    title_zh: 以妄心即佛心为注疏纲宗
    rationale: 若迥指真心则堕别教唯即现前介尔妄念具百界千如方显天台独得真传故力辨之
  - date: 1627-09-11
    title_zh: 痛斥空腹高心不修三观之弊
    rationale: 见性成佛若无空假中三观还入狂解故须以十乘观阴等境令修恶即性成圆顿妙行
