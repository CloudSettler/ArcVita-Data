  title_zh: 幽溪住持中兴天台教观
  goal_zh: 重建高明道场，疏解台宗教观，接引四方学众
  phases:
  - key: brewing
    name: 少习台教发心住持
    labels:
      zh: 习学发心
    start_date: 1566
    highlight_event_id: guji-传灯-event-birth
  - key: breakthrough
    name: 住锡幽溪开讲止观
    labels:
      zh: 开讲弘传
    start_date: 1588
    highlight_event_id: guji-传灯-event-youxi
  - key: climax
    name: 注疏楞严圆觉盛化一方
    labels:
      zh: 注经化众
    start_date: 1605
    highlight_event_id: guji-传灯-event-zhushu
  - key: closure
    name: 门徒辑录遗绪不坠
    labels:
      zh: 付嘱后学
    start_date: 1628
    highlight_event_id: guji-传灯-event-death
  decisions:
  - date: 1588
    title_zh: 择幽溪高明寺为弘法本据
    rationale: 台宗久衰须有定所聚众讲习，故结庐幽溪以止观教观并弘
  - date: 1605
    title_zh: 以注经摄引文士缁素
    rationale: 借楞严圆觉会通性相，使台衡性具之旨易入人心
- id: guji-传灯-endeavor-2
  title_zh: 撰著性善恶论明性具宗义
  goal_zh: 立八门辨性修善恶，会儒释以显圆顿直指之道
  phases:
  - key: brewing
    name: 设宾主问答会通儒家性论
    labels:
      zh: 会通儒释
    start_date: 1615
    highlight_event_id: guji-传灯-event-zhushu
  - key: breakthrough
    name: 判五时八教定位性具
    labels:
      zh: 判教定位
    start_date: 1620
    highlight_event_id: guji-传灯-event-zhushu
  - key: climax
    name: 天启元年夏秋撰成八门正论
    labels:
      zh: 撰论立宗
    start_date: 1621
    highlight_event_id: guji-传灯-event-xingshan
  - key: closure
    name: 门人校定刊行流布后世
    labels:
      zh: 校刊流通
    start_date: 1622
    highlight_event_id: guji-传灯-event-xingshan
  decisions:
  - date: 1621
    title_zh: 以性具善恶双举破偏执
    rationale: 他宗但知性具善不知性具恶，故特揭性恶以全平等不二之旨
  - date: 1621
    title_zh: 立八门以原始要终旁证曲喻
    rationale: 至理惊人难信，故设辨说事图使人洞胸澈髓见自家藏
