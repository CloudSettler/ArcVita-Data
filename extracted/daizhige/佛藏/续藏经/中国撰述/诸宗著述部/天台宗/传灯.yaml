  title_zh: 注传佛心印记述序不瞬堂
  date: 1627-09-11
  year_of: 1627
  description_zh: 大明天启七年丁卯僧自恣后二日于楞严坛不瞬堂述序发明只一具字弥显今宗之旨由灵耀参校
- id: guji-传灯-event-death
  title_zh: 示寂
  date: 1628-01-01
  year_of: 1628
  description_zh: 明崇祯元年寂平生著述甚富心印记注与净土生无生论等并入藏流通
