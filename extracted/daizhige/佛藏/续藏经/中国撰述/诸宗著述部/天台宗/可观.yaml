  - 净觉分生身尊特为相对与四明生身即尊特相违，如何抉择双游元意
  - 事造为无常可破还是事理三谛一体相即，如何不堕偏解而扶圆常
  lesson: 双游本喻一体相即，事理三谛法法互具，方能会通常与无常而不失圆旨
  summary_first_person: 吾云间沙门可观，苦心大经二鸟双游，考论净觉四明得失，以五义开演事理相即，又释金錍以扶一念三千，集为山家义苑，以明山家正义
