endeavors:
- id: guji-可观-endeavor-1
  title_zh: 考论双游定相即元意
  summary: 因讲次说双游，叙净觉四明各据，评其得失，以高下事理游息横竖凡圣五义开演大经本疏，明常无常二用双游并息
  phases:
  - key: brewing
    name: 讲下随听说双游
    labels:
      zh: 苦心斯文随听记录
    start_date: '1040'
    highlight_event_id: guji-可观-event-shuangyou
  - key: breakthrough
    name: 叙评两家各据
    labels:
      zh: 辨净觉分别四明相即
    start_date: '1050'
    highlight_event_id: guji-可观-event-shuangyou
  - key: climax
    name: 五义开演涅槃大义
    labels:
      zh: 高下事理游息横竖凡圣
    start_date: '1052'
    highlight_event_id: guji-可观-event-shuangyou
  - key: closure
    name: 五重释疑定宗
    labels:
      zh: 会通应身二用归一体
    start_date: '1055'
    highlight_event_id: guji-可观-event-shuangyou
  decisions:
  - date: '1050'
    title_zh: 弃分别取相即
    rationale: 双游本喻事理一体，若取生身对尊特分别则失经疏元意，故从四明生身即尊特
  - date: '1055'
    title_zh: 以三谛三千证成佛界二身
    rationale: 一切法无不具二用互遍互收，故丈六高大当处即具事理三谛，不将两身相合为相即
- id: guji-可观-endeavor-2
  title_zh: 释金錍扶一念三千
  summary: 通释金錍题喻功能，以一念三千扶佛眼三重膜，明凡圣一如色香泯净，立众生三因体遍，破不了一念及权实之执
  phases:
  - key: brewing
    name: 遍览因果自他依正
    labels:
      zh: 通约大小部帙明权实
    start_date: '1058'
    highlight_event_id: guji-可观-event-jinpi
  - key: breakthrough
    name: 示观心妙境
    labels:
      zh: 凡圣一如色香泯净
    start_date: '1060'
    highlight_event_id: guji-可观-event-jinpi
  - key: climax
    name: 立三因体遍破三膜
    labels:
      zh: 果法不离因心佛性遍情无情
    start_date: '1062'
    highlight_event_id: guji-可观-event-jinpi
  - key: closure
    name: 集义苑十篇传山家
    labels:
      zh: 山阴法孙智增印证流通
    start_date: '1065'
    highlight_event_id: guji-可观-event-jinpi
  decisions:
  - date: '1060'
    title_zh: 不立五章强开金錍
    rationale: 金錍为假梦点示佛性权实，非如止观分科诠自他因果，故斥孤山五章之说
  - date: '1062'
    title_zh: 以随缘真如立无情佛性
    rationale: 万法是真如随缘，色即是心，心色俱遍，若局有情则因果隔绝佛眼不明
events:
- id: guji-可观-event-birth
  title_zh: 云间出家为沙门
  date: 0980
  year_of: 980
  place_zh: 云间
  description: 宋初生于云间，少出家禀天台教观，苦心大经双游疏义
- id: guji-可观-event-shuangyou
  title_zh: 讲次论双游撰义苑上卷
  date: '1050'
  year_of: 1050
  place_zh: 云间讲肆
  description: 因讲次说双游，讲下随听记之，考论净觉十谏与四明解谤，以五义五重释疑明二用相即
- id: guji-可观-event-jinpi
  title_zh: 述金錍义十篇
  date: '1060'
  year_of: 1060
  place_zh: 云间
  description: 释荆溪金錍题喻，明一念三千观境，示阿鼻依正全处极圣自心，扶佛眼三重膜，辨别圆三因修性
- id: guji-可观-event-death
  title_zh: 示寂山阴法孙证义苑
  date: '1090'
  year_of: 1090
  place_zh: 山阴
  description: 撰述既成，属山阴法孙智增印证，山家义苑流通天台，后示寂
