endeavors:
- id: guji-善月-endeavor-1
  title_zh: 撰述台宗十类因革论
  description: 立经体经王随缘习气观法二空被接教证明寿量四土十类以因革通塞归天台正传
  phases:
  - key: brewing
    name: 博览台宗章疏酝酿十类
    labels:
      zh:
      - 法华玄义
      - 涅槃玄文
      - 荆溪四明记钞
    start_date: '1230'
    highlight_event_id: guji-善月-event-study
  - key: breakthrough
    name: 立经体开废离合之断
    labels:
      zh:
      - 开权废权取体
      - 离合拣取中道
    start_date: '1245'
    highlight_event_id: guji-善月-event-jingti
  - key: climax
    name: 十类循环终成四卷
    labels:
      zh:
      - 十类撰述
      - 四卷告成
    start_date: '1255'
    highlight_event_id: guji-善月-event-compose
  - key: closure
    name: 以即心流通后学
    labels:
      zh:
      - 即心是道
      - 流通付嘱
    start_date: '1265'
    highlight_event_id: guji-善月-event-circulate
  decisions:
  - date: '1245'
    title_zh: 取天台荆溪四明正传为断
    rationale: 异说纷纭宗极不著须合文理当然以格异端归至当
  - date: '1255'
    title_zh: 以开废废立兼明离合拣取并举
    rationale: 体遍一切而妙极诸法非兼废开离合不能彰法华体绝余经
- id: guji-善月-endeavor-2
  title_zh: 弘阐天台观行证果之道
  description: 由观法三千十乘接被接教证终至寿量四土寂光还源经体
  phases:
  - key: brewing
    name: 深究三千观法大旨
    labels:
      zh:
      - 三千大旨
      - 十乘观相
    start_date: '1235'
    highlight_event_id: guji-善月-event-study
  - key: breakthrough
    name: 明被接教证由权趣实
    labels:
      zh:
      - 被接进否
      - 教证权实
    start_date: '1250'
    highlight_event_id: guji-善月-event-jiaozheng
  - key: climax
    name: 彰寿量四土果人依正
    labels:
      zh:
      - 寿量果德
      - 四土寂光
    start_date: '1260'
    highlight_event_id: guji-善月-event-shouliang
  - key: closure
    name: 还源一心清净之道
    labels:
      zh:
      - 诸法不离我心
      - 究竟出生死
    start_date: '1268'
    highlight_event_id: guji-善月-event-circulate
  decisions:
  - date: '1250'
    title_zh: 以观法统被接教证次第度入
    rationale: 权机宜教道教道必至证道由观入证方显唯一圆实真因
  - date: '1260'
    title_zh: 以寿量四土明因果不二还宗经体
    rationale: 因必有果身必有土寂光理性复宗经体循环宛转方为一道
