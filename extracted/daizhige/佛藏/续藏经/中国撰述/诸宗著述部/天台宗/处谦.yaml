endeavors:
- id: guji-处谦-endeavor-1
  title_zh: 再注十不二门成显妙
  summary_zh: 遵荆溪记主之意撮十妙为观法大体以色心等十门收摄十妙直显一念三千即空假中
  phases:
  - key: brewing
    name: 忧旧解杂发心显妙
    labels:
      zh: 发心忧旧
    start_date: 1070-06-01
    highlight_event_id: guji-处谦-event-study
  - key: breakthrough
    name: 撮十妙立十门纲宗
    labels:
      zh: 立纲十门
    start_date: 1071-06-01
    highlight_event_id: guji-处谦-event-write
  - key: climax
    name: 直申一理点示一念三千
    labels:
      zh: 直申一理
    start_date: 1071-11-01
    highlight_event_id: guji-处谦-event-write
  - key: closure
    name: 钱塘净住序成显妙
    labels:
      zh: 序成流通
    start_date: 1071-12-16
    highlight_event_id: guji-处谦-event-write
  decisions:
  - date: 1071-06-01
    title_zh: 去诸异同专取文旨
    rationale: 旧解不详繁于异论杂乎粹旨故去异同再为注解以符记主之意
  - date: 1071-11-01
    title_zh: 以六即捡一一门
    rationale: 门既成妙入者作佛故以六即显高下不生功滥方见门功
- id: guji-处谦-endeavor-2
  title_zh: 住钱塘净住弘传教观
  summary_zh: 以观心为教行枢机弘天台教观一致令开教悉入醍醐止观十乘成自行因果起教成化他
  phases:
  - key: brewing
    name: 永嘉出家禀天台教
    labels:
      zh: 禀承源流
    start_date: 1050-01-01
    highlight_event_id: guji-处谦-event-birth
  - key: breakthrough
    name: 会开权显实归佛乘
    labels:
      zh: 开权显实
    start_date: 1070-06-01
    highlight_event_id: guji-处谦-event-study
  - key: climax
    name: 以教成行示遮照双运
    labels:
      zh: 教行并弘
    start_date: 1071-11-01
    highlight_event_id: guji-处谦-event-write
  - key: closure
    name: 寄观心于诸说传后学
    labels:
      zh: 寄说传灯
    start_date: 1071-12-16
    highlight_event_id: guji-处谦-event-write
  decisions:
  - date: 1070-06-01
    title_zh: 以观心为枢机略点寄诸说
    rationale: 观心乃教行枢机非此教无所设行无所寄故略点以全心即妙观
  - date: 1071-12-16
    title_zh: 分文对相存旧解而不复云
    rationale: 分文辨讹存此旧解即可此不复云唯直申一理使经旨皎然目前
events:
- id: guji-处谦-event-birth
  date: 1030-01-01
  year_of: 1030
  title_zh: 诞生永嘉出家
  description_zh: 生于永嘉少出家为沙门禀天台法华之学究玄义荆溪之记
- id: guji-处谦-event-study
  date: 1070-06-01
  year_of: 1070
  title_zh: 研十妙患旧解杂
  description_zh: 撮十妙为观法大体见旧解各固所是不详故发心去异同再注以显妙
- id: guji-处谦-event-write
  date: 1071-12-16
  year_of: 1071
  title_zh: 钱塘净住序显妙
  description_zh: 熙宁四年冬十一月既望于钱塘净住方丈东轩作序成法华玄记十不二门显妙直申一念三千不二之旨
- id: guji-处谦-event-death
  date: 1090-01-01
  year_of: 1090
  title_zh: 熙宁后示寂
  description_zh: 熙宁作序之后弘传教观示寂确年不详唯显妙一书传续藏经以显荆溪本怀
