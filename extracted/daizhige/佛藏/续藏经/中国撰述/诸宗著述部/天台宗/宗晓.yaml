endeavors:
- id: guji-宗晓-endeavor-1
  title_zh: 施食群典汇览编纂
  summary: 披阅大藏及天台诸师著述，凡关施食者悉誊录汇聚，铨次成帙为施食通览上下卷
  phases:
  - key: brewing
    name: 披阅搜集
    labels:
      zh: 阅藏搜佚
    start_date: '1195'
