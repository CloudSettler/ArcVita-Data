  - key: breakthrough
    name: 麕积汇聚
    labels:
      zh: 誊录汇编
    start_date: '1200'
    highlight_event_id: guji-宗晓-event-collect
  - key: climax
    name: 铨次成帙
    labels:
      zh: 闰次通览
    start_date: '1204'
    highlight_event_id: guji-宗晓-event-preface
  - key: closure
    name: 嘉泰作序
    labels:
      zh: 序明宗旨
    start_date: '1204'
    highlight_event_id: guji-宗晓-event-preface
  decisions:
  - date: '1200'
    title_zh: 凡涉施食悉录不遗
    rationale: 遐迩遵行者虽众而昧由者多，须汇聚经律论疏及感验使知所自
  - date: '1204'
    title_zh: 目曰通览以便后学
    rationale: 典籍散在羊槐壹别诸函及诸家法式，铨次一帙则人人了然易于遵行
- id: guji-宗晓-endeavor-2
  title_zh: 法食义理解说与劝行流通
  summary: 于序中开显法食兼财法无畏三施及自他二利，收录水陆缘起仪文以劝广行无相施
  phases:
  - key: brewing
    name: 深究三施
    labels:
      zh: 教理抉择
    start_date: '1200'
    highlight_event_id: guji-宗晓-event-collect
  - key: breakthrough
    name: 拈出二利五果
    labels:
      zh: 法义提纲
    start_date: '1204'
    highlight_event_id: guji-宗晓-event-preface
  - key: climax
    name: 中秋作序劝施
    labels:
      zh: 悲智劝化
    start_date: '1204'
    highlight_event_id: guji-宗晓-event-preface
  - key: closure
    name: 附水陆以广流通
    labels:
      zh: 水陆兼弘
    start_date: '1204'
    highlight_event_id: guji-宗晓-event-preface
  decisions:
  - date: '1204'
    title_zh: 以兼三施破本末之疑
    rationale: 法食以饮食济饥虚为财施，以咒法随食入为法施，以解脱幽趣为无畏施，万行由般若导则三轮空寂
  - date: '1204'
    title_zh: 收录水陆仪文感验劝广行
    rationale: 使近则现招寿色力辩安五果，远则成就二严，自脱幽涂生善道归三宝成正觉故广列缘起赞疏
