  dilemmas:
  - 领徒太早损己益他与一心求证铜轮之憾
  - 隐栖自修证悟与出山弘通忍难之择
  lesson: 全性起修即动而静即昏而明以止观转无尘智度众生
  summary_first_person: 吾武津李氏子也，幼栖空冢读法华，顶礼精勤，感普贤摩顶，后谒慧文得观心，豁悟法华三昧，弘通大乘，避地南岳，曲授心要作止观，以报佛恩
