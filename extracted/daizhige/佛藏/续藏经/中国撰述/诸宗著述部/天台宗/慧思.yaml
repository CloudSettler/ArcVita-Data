    title_zh: 登祝融求一坐具地居南岳
    rationale: 为远离诤毒安众修禅故择衡岳福地以作佛种导师
  - date: 376
    title_zh: 出数万言著大乘止观
    rationale: 为悯后代罔闻圆顿止观故曲授心要令即念明静
events:
- id: guji-慧思-event-birth
  date: 333
  year_of: 515
  title_zh: 生于武津李氏
  description: 元魏南豫州武津人，俗姓李，儿童时梦梵僧勉令入道
- id: guji-慧思-event-ordination
  date: 0529
  year_of: 529
  title_zh: 空冢读经年十五出家受具
  description: 栖古城凿穴昼夜读法华顶礼不息，忍肿向经消磨，梦普贤摩顶起肉髻，年十五出家，梦二十四僧加羯磨圆满戒法
- id: guji-慧思-event-enlightenment
  date: 352
  year_of: 540
  title_zh: 谒慧文得观心证法华三昧
  description: 遍亲禅学后谒慧文受观心法，坐禅达旦动八触见三生行道迹，放身倚壁豁然大悟法华三昧
- id: guji-慧思-event-preaching
  date: 365
  year_of: 555
  title_zh: 辗转弘通遭毒念般若得免
  description: 初河南兖州次郢州次光州开岳寺次大苏山讲大般若，为恶论师毒害，一心念般若毒消，遂愿造金字大品及法华，命智顗代讲决了圆顿旨
- id: guji-慧思-event-nanyue
  date: 375
  year_of: 567
  title_zh: 居南岳化岳神占福严寺
  description: 登祝融飞锡定处为今福严寺，转石鼓逢平地为岳神所居，为岳神说法授戒，所居灵瑞重沓瓶水自满
- id: guji-慧思-event-composition
  date: 376
  year_of: 570
  title_zh: 著大乘止观曲授心要
  description: 从大悲心出数万言目为大乘止观亦名一乘曲示心要，开止观解示止观行，总马鸣龙树心要具菩提涅槃了义
- id: guji-慧思-event-death
  date: 0577-06-22
  year_of: 577
  title_zh: 陈大建九年六月二十二日示寂
  description: 大集门学说法求十人不惜身命修忏苦行竟无答，展众敛念诃灵辨端坐唱佛来迎合掌而逝，颜色如生异香满室，寿六十三夏四十九
