endeavors:
- id: guji-戒珠-endeavor-1
  title_zh: 撰別傳心法議明三藏付囑
  summary: 溯迦葉結集阿難相承至馬鳴龍樹皆不離經律論辨達磨藉楞伽悟宗斥別傳離教之妄
  phases:
  - key: brewing
    name: 目擊離教說禪醞釀護教
    labels:
      zh: 醞釀
    start_date: '1065'
    highlight_event_id: guji-戒珠-event-1
  - key: breakthrough
    name: 考三藏傳承立論宗旨
    labels:
      zh: 突破
    start_date: '1075'
    highlight_event_id: guji-戒珠-event-2
  - key: climax
    name: 成議痛斥南泉普願後學
    labels:
      zh: 高潮
    start_date: '1080'
    highlight_event_id: guji-戒珠-event-2
  - key: closure
    name: 附祭懷要文以詔後學
    labels:
      zh: 收束
    start_date: '1085'
    highlight_event_id: guji-戒珠-event-2
  decisions:
  - date: '1075'
    title_zh: 決定以三藏為祖道正統
    rationale: 迦葉至二十七祖皆云是三藏法未聞心外別有一法故不許別傳凌亂
  - date: '1080'
    title_zh: 決定直斥排挫經訓者為像法罪人
    rationale: 浮漓輩不窮師承經論以機巧勝負為得失必辨以救學者入魔外
- id: guji-戒珠-endeavor-2
  title_zh: 住持玄沙飛山弘傳性宗
  summary: 自號飛山默子傳法玄沙弘天台性宗心宗勉學人根力覺道藉教修證得義天推重刊行
  phases:
  - key: brewing
    name: 福唐出家學性宗教觀
    labels:
      zh: 醞釀
    start_date: '1020'
    highlight_event_id: guji-戒珠-event-birth
  - key: breakthrough
    name: 領眾玄沙闡心宗精奧
    labels:
      zh: 突破
    start_date: '1070'
    highlight_event_id: guji-戒珠-event-1
  - key: climax
    name: 性宗講說極盛座下弘傳
    labels:
      zh: 高潮
    start_date: '1078'
    highlight_event_id: guji-戒珠-event-1
  - key: closure
    name: 義天奉旨刊翠琰流布海東
    labels:
      zh: 收束
    start_date: '1090'
    highlight_event_id: guji-戒珠-event-death
  decisions:
  - date: '1070'
    title_zh: 決定以經論照了為接引正途
    rationale: 後學心如風輪毛輪易入天魔外道唯教有辨故揭精奧流通不任巧亂
  - date: '1085'
    title_zh: 決定以祭懷要之言申明權實萬途在心
    rationale: 佛道無適諸外所防者情所悟者心故錄舊誨以證議旨大同
