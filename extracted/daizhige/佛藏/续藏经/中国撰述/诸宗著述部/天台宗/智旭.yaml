  decisions:
  - date: '1636'
    title_zh: 万行归心净土专志西归
    rationale: 自审生平业障深重唯仗佛力可得解脱故以净土为归宿而不舍禅教
  - date: '1648'
    title_zh: 弘律扶教著书觉世
    rationale: 见末世钝根教观不明戒律陵替故广著述以续佛慧命
