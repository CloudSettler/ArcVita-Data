  decisions:
  - date: '1647'
    title_zh: 以无实法为宗不执权实
    rationale: 为破执实废权与执权异实故以药喻示权即实家之权实即权家之实
  - date: '1647'
    title_zh: 以教印观以观释教双举
    rationale: 为救作工夫不以教印之殆与学文字不解观心之罔故须教观相应
- id: guji-智旭-endeavor-2
  title_zh: 住持灵峰倡导禅教律净合一
  summary: 晚年住灵峰弘律研教提倡念佛融摄天台华严唯识而归净土
  phases:
