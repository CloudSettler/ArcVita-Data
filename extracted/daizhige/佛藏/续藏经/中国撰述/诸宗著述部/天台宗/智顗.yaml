    title_zh: 先以定动后以慧拔而说法
    rationale: 神通伏高心令生信伏然后示真道若直说空则化他阙而众生不伏
  - date: 0593
    title_zh: 遍学诸法知病识药而设教
    rationale: 众生机病无量须遍知五行八卦医方乃至三谛方能随宜赴缘无方转变
