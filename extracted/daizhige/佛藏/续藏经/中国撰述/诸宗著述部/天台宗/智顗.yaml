  - date: '0575'
    title_zh: 以次第为正明摄钝根渐入
    rationale: 若不遍浅深次第后修般若空未发余空预证则谬谓为是故须分别异相以显般若
  - date: 0590
    title_zh: 立十科前解后行以解为行本
    rationale: 行若无解不得立行故先明简非显是发菩提心然后明修证果报起教
