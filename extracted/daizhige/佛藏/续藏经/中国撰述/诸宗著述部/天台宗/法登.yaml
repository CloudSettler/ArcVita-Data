  name_zh: 法登
  names:
    zh: 法登
    en: Fadeng
  lifespan:
    birth:
      date: 1150
      precision: year
      is_circa: true
      raw: 南宋约绍兴末
    death:
      date: 1210
      precision: year
      is_circa: true
      raw: 南宋约嘉定初
  birth_date: 1150
  death_date: 1210
  era: 南宋
  reign_ref: 宋光宗绍熙
  archetype: 弘教宗师
  dilemmas:
  - title_zh: 禅教别传与灵山付法之争
    description: 教外别传盛行，拈华微笑无稽，付法系谱不明，故须正灵山佛知见为迦叶所传之总纲
  - title_zh: 即心是佛与废弃修行之偏
    description: 才言即心便废修，闻道远便绝分，故须明修性相资与一念三千三观照性
  lesson: 以佛眼佛智照诸法，以三观修性还源，贯通禅教而归圆顿一道
  summary_first_person: 我是四明沙门法登，学大乘而晓己身有佛性，依圆顿大乘述宗眼十篇，原心究性，明道穷徧，谈具所传，明三观正宗与修性相资，会灵山付法于佛之知见，绍隆迦叶祖祖相传之要
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%A4%A9%E5%8F%B0%E5%AE%97/%E5%9C%86%E9%A1%BF%E5%AE%97%E7%9C%BC.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E5%A4%A9%E5%8F%B0%E5%AE%97/%E5%9C%86%E9%A1%BF%E5%AE%97%E7%9C%BC.md
endeavors:
- id: guji-法登-endeavor-1
  title_zh: 述圆顿宗眼立佛知见为宗
  summary: 原于心法究体性，以佛眼佛智为圆诠教旨，判鹿苑鹫头鹤林一线付迦叶，作宗眼十篇总摄天台圆顿
  phases:
  - key: brewing
    name: 原心究性穷心徧
    labels:
      zh: 酝酿
    start_date: 1180
    highlight_event_id: guji-法登-event-study
  - key: breakthrough
    name: 会付法于法华开显
    labels:
      zh: 突破
    start_date: 1190
    highlight_event_id: guji-法登-event-study
  - key: climax
    name: 福严涌泉阁下成书作序
    labels:
      zh: 高潮
    start_date: 1194
    highlight_event_id: guji-法登-event-zongyan
  - key: closure
    name: 十篇流通示修性还源
    labels:
      zh: 收束
    start_date: 1194
    highlight_event_id: guji-法登-event-zongyan
  decisions:
  - date: 1190
    title_zh: 弃拈华别传说取法华付法说
    rationale: 拈华于竺典无稽，般若被加非迦叶，唯法华开权显实点佛知见可总一切知见，故付法正在灵山
  - date: 1194
    title_zh: 以十篇名圆顿宗眼
    rationale: 宗即是要，圆顿要在佛眼佛智，总略题之可使学人得佛祖相传之要而不逐流失源
- id: guji-法登-endeavor-2
  title_zh: 弘天台三观修性会通禅教
  summary: 以璎珞大品为文，以法华为宗骨，赞于龙树广于天台，明一念三千即空即假即中，会禅宗直指不离三观
  phases:
  - key: brewing
    name: 禀南岳北齐龙树之绪
    labels:
      zh: 酝酿
    start_date: 1185
    highlight_event_id: guji-法登-event-study
  - key: breakthrough
    name: 明三智一心即三观一心
    labels:
      zh: 突破
    start_date: 1192
    highlight_event_id: guji-法登-event-preach
  - key: climax
    name: 示介尔一念为事理解行要
    labels:
      zh: 高潮
    start_date: 1194
    highlight_event_id: guji-法登-event-preach
  - key: closure
    name: 说修性不二劝起修照性
    labels:
      zh: 收束
    start_date: 1195
    highlight_event_id: guji-法登-event-preach
  decisions:
  - date: 1192
    title_zh: 以次第文会不次第圆义
    rationale: 璎珞次第文后有三观法界之说，部在方等尊极唯圆，据胜为论即圆三观，故不以文拘而以意会
  - date: 1194
    title_zh: 指禅教同源皆归三谛
    rationale: 若谓禅不离此道之外别有单传，则释迦有二心迦叶分两派，故须明直指见性不出妙解妙行归源
events:
- id: guji-法登-event-birth
  title_zh: 生于南宋
  date: 1150
  year_of: 1150
  description: 约绍兴末生，长而为四明沙门，学天台圆顿大乘
- id: guji-法登-event-study
  title_zh: 究天台教观原心谈具
  date: 1185
  year_of: 1185
  description: 习毗陵四明之说，信己心有性，达心徧法界与一念具三千，为述宗眼酝酿
- id: guji-法登-event-zongyan
  title_zh: 绍熙甲寅序圆顿宗眼于福严
  date: 1194
  year_of: 1194
  description: 绍熙甲寅闰月五日，于福严兰若涌泉阁下作并序，立宗眼原心究性明道穷徧谈具所传三观正宗修性十篇
- id: guji-法登-event-preach
  title_zh: 弘三观修性会禅教一源
  date: 1195
  year_of: 1195
  description: 敷扬一念无相谓空无法不备谓假不一不异谓中，及修性相资之说，示还源要术
- id: guji-法登-event-death
  title_zh: 示寂
  date: 1210
  year_of: 1210
  description: 约嘉定初示寂，遗圆顿宗眼续藏传世
