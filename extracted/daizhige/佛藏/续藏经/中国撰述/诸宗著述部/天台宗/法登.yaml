    title_zh: 特立阴妄为所观
    rationale: 山外不晓观境以一念为真心不立阴境大失宗旨故指介尔心显妙理
  - date: '1090-01-01'
    title_zh: 著议中兴教观一篇
    rationale: 后人不识中兴主意远传四明之道故须举事理三千总别三观三身等委示源流
