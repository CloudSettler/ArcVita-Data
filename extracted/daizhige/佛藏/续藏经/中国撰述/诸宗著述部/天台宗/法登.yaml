  - date: '1070-01-01'
    title_zh: 从天竺慈云指要究中兴教
    rationale: 教门权实同昧别理随缘共迷非指要不明故据以判权实
  - date: '1080-01-01'
    title_zh: 斥山外随缘同终教之谬
    rationale: 彼以随缘齐今家圆教又立顿圆不谈具即是别义故当以具字显今宗圆顿
