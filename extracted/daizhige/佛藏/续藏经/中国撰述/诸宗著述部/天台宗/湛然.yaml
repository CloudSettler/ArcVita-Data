    name: 判渐次不定圆顿三法同缘顿理
    labels:
      zh: 高潮
    start_date: '0772'
    highlight_event_id: guji-zhanran-event-panjiao
  - key: closure
    name: 以中论三立一荡证师资确立显摩诃
