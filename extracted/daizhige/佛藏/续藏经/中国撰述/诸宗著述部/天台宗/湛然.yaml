  era: 唐
  reign_ref: 唐玄宗至唐德宗
  archetype: 弘教辨正者
  dilemmas:
  - 情与无情分际何在，若言无情无性则违性遍义，若言无情有性则逆权教人情
  - 涅槃经文权实兼带，若执瓦石永非则昧理性正因，若滥同邪空则失佛性真喻
  lesson: 依圆实教观抉无明之膜，达依正色心即是佛性，方能权实不谬性修不二
  summary_first_person: 余天台沙门湛然，滥沾释典积有岁年，常以佛性义经怀，曾于静夜久思恍如梦寐而寱云无情有性，遂假梦寄客立宾主而著金刚錍，以虚空徧一切处喻正因体徧，抉四眼无明之膜，令悉见遮那佛性之指，愿后代善得经旨不昧理性
