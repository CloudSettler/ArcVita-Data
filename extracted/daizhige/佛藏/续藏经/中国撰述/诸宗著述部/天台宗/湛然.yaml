  - date: 0768
    title_zh: 以龙树为高祖始祖尊尚圆教
    rationale: 至闻师来所承异本慧闻独步故取闻师承龙树为信
  - date: '0772'
    title_zh: 南岳唯授圆顿之理以二行助成于圆
    rationale: 渐人解顿行渐顿人行解俱顿不定或渐或顿同缘顿理故分三行
