  decisions:
  - date: 0975
    title_zh: 从能赞科释赞佛偈不断彼疑
    rationale: 大师不从所赞科释为显龙女闻经得解深达罪福徧照十界故从能赞断智积执别之疑
  - date: 0977
    title_zh: 以胎经释成佛以权巧释利益
    rationale: 前科成道为现成明证引胎经验实证无生后科利益为权巧之力得普现色身三昧方能示成故体用分释文理无伤
