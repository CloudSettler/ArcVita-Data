  date: '0977-10-01'
  year_of: 977
  title_zh: 撰法华龙女成佛权实义
  description_zh: 于大宋太平兴国二年十月录成此义开列文科释简略约义引文销会征释傍通示判教相四意以显经力不可思议
- id: guji-源清-event-debate
  date: 0977
