  - key: closure
    name: 流通弘化愿众染神登岸
    labels:
      zh:
      - 弘化流通
      - 护持天台
    start_date: 0980
    highlight_event_id: guji-源清-event-teach
  decisions:
  - date: 0977
    title_zh: 判李长者往南表法体用俱失
    rationale: 彼以南为正顺离明表觉却无机设化又以妙用文为实证故迷实证之源失一乘开权显实之旨当依义乖须去
  - date: 0980
    title_zh: 明智积身子善权共成机缘
    rationale: 高位大士仍执藏别为疑乃为破有此执者未得妙益共就一段机缘令众信伏故不疑圣智但寻言辨义
