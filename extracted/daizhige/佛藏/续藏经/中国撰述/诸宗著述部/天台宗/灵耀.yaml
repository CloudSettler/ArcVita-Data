  - key: climax
    name: 住楞严讲席弘法化众
    labels:
      zh: 弘法
    start_date: '1675'
    highlight_event_id: guji-灵耀-event-yinshan
  - key: closure
    name: 以真隐义颂佛海守道恒一
    labels:
      zh: 颂隐
    start_date: '1679'
    highlight_event_id: guji-灵耀-event-jiwei
  decisions:
  - date: '1672'
    title_zh: 归乡访慧严古址礼佛海
    rationale: 辨守道恒一与用世之才，以定真隐之标准，不慕捷径之出
  - date: '1675'
    title_zh: 久住楞严讲寺不苟出
    rationale: 以潜龙在野自守，积养待机，期出则振聋发聩裨补法门
- id: guji-灵耀-endeavor-2
  title_zh: 随缘述作与教观会通
  summary: 翻般若探金刚部旨，摘经史百家成十册，解药师直示三法，会六经以助教观，门人集为随缘集
  phases:
  - key: brewing
    name: 志学酬酢古人心迹语言
    labels:
      zh: 摘微
    start_date: '1645'
    highlight_event_id: guji-灵耀-event-birth
  - key: breakthrough
    name: 甲辰摘记五经章意成编
    labels:
      zh: 会儒
    start_date: '1664'
    highlight_event_id: guji-灵耀-event-jiachen
  - key: climax
    name: 随文点出金刚部旨贯通始终
    labels:
      zh: 解经
    start_date: '1670'
    highlight_event_id: guji-灵耀-event-jiachen
  - key: closure
    name: 己未中元自序随缘集命意
    labels:
      zh: 集录
    start_date: '1679-08-01'
    highlight_event_id: guji-灵耀-event-jiwei
  decisions:
  - date: '1664'
    title_zh: 摘记五经但记大章关节
    rationale: 以一经得意余第旁通，日以二时习世典以绥外人而内闲正法
  - date: '1679-08-01'
    title_zh: 命门人所集曰随缘削去十九
    rationale: 自认无特操无专属，言非本真，偶应外来，以向晦宴息自处
events:
- id: guji-灵耀-event-birth
  title_zh: 出生於吴兴嘉禾一带
  date: '1619'
  year_of: 1619
  place_zh: 浙江嘉兴吴兴菁山泗水乡里
  description_zh: 约生於明末清初之浙西，幼而披缁，遂与古人心迹酬酢，行住以摘微册为师友
- id: guji-灵耀-event-jiachen
  title_zh: 甲辰摘记五经章意作序
  date: '1664'
  year_of: 1664
  place_zh: 嘉禾楞严讲寺
  description_zh: 绎教之余翻阅六经，摘其微辞要意，引无不敬安定辞等以助明教观，论儒佛不相悖
- id: guji-灵耀-event-yinshan
  title_zh: 访菁山慧严作佛海隐山序
  date: '1672'
  year_of: 1672
  place_zh: 吴兴菁山慧严古址
  description_zh: 礼隐居十余载之佛海和尚，达旦清谈，见其见明养固才充，作序辨真隐山在守恒秉一
- id: guji-灵耀-event-jiwei
  title_zh: 己未中元作随缘集叙
  date: '1679-08-01'
  year_of: 1679
  place_zh: 楞严讲寺大树方丈
  description_zh: 门人裒集偶应之言成帙，命曰随缘，编为杂着尺牍诗偈源流四类，自比泽中有雷随义
- id: guji-灵耀-event-death
  title_zh: 示寂於楞严讲寺
  date: '1690'
  year_of: 1690
  place_zh: 嘉禾楞严讲寺
  description_zh: 康熙末约寂，平生述作付门人流通，所付衣拂源流具载随缘集卷三
