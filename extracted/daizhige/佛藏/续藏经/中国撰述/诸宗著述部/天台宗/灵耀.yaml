  dilemmas:
  - 荆溪注解繁密与天溪提纲贯义之间如何取舍而不晦祖意
  - 天溪即世遗言付丙丁与斯文恐湮之间如何补定成书以诒后贤
  lesson: 单提义理联贯昭明不使止观埋没于注解葛藤
  summary_first_person: 吾乃嗣兴天台教观第五世比丘灵耀，早随天溪老人听讲摩诃止观，私记在心，老人既逝，恐斯文湮没，遂于讲次缀辑前闻参以管见，补定贯义科上下卷，序于楞严讲寺大树方丈，愿后贤因科明义不做念注读科之学。
  source_urls:
