  dilemmas:
  - 外缘感触与本真恒守如何相即不离
  - 世典六经与出世教观如何圆融会通
  lesson: 随缘非攀缘，偶应不失恒守，以无专属之言显常住之道
  summary_first_person: 我是嘉禾楞严讲寺比丘灵耀，字全彰，幼而披缁，慕菁山佛海之风，久住楞严讲席，随缘述作以助教观，门人裒集为随缘集，分为杂着尺牍诗偈源流四类，我无特操，惟以泽中有雷向晦宴息自处
