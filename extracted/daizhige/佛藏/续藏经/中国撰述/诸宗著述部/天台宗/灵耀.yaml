  decisions:
  - date: '1678'
    title_zh: 唯提大师义意立科讲授
    rationale: 矫猜科为注扯注为科之弊使祖意不晦
  - date: '1682-09-01'
    title_zh: 讲贯佛经亦单提义理不累叙科念注
    rationale: 为弘经传宗不愿埋没佛祖宗旨于后人脚跟下
