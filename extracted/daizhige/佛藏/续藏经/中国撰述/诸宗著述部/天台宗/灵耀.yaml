    title_zh: 不事细碎科条专解盘根错节
    rationale: 后人科解云云祖意反晦故名之曰节以存折中之解
  - date: 1738-09-15
    title_zh: 戊午中秋作序明集注所以
    rationale: 文略则义不备词博则义太烦故集诸文注于下事实便于披阅兼自出手眼
- id: guji-灵耀-endeavor-2
  title_zh: 八度禀受七番弘讲天台教观
  description: 从师二十年禀受八度为众讲说七番或启帏咨闻或于教部领会以解行相须接引后学
  phases:
  - key: brewing
    name: 从师二十年禀受
    labels:
