  - title_zh: 繁科晦祖意与节解明盘根之抉择
    description: 玉岗广集如一气呵成后人琐碎科段反翳太虚我当舍细碎科条直解盘根错节
  - title_zh: 集诸家便披阅与出手眼标同异之权衡
    description: 既集玄粹纪要诸文注于下以便披阅又须于义有妨处自出手眼恐后贤未允故存不用亦可之心
  lesson: 教观既足则解行相须文字显总持文门即解脱不可离文别求实相
  summary_first_person: 吾灵耀浙之古清凉寺比丘从玉岗师二十稔八度禀受四教七番为众讲说见玉师集注广博后人科解繁碎故节其大义为集注节义愿学者即此究心忘言得意
