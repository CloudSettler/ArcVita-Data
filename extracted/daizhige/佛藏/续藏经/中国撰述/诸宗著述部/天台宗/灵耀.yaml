    start_date: 1738-09-15
    highlight_event_id: guji-灵耀-event-jieyi
  decisions:
  - date: 1728
    title_zh: 七番为众讲说不惮重复
    rationale: 欲令学者即此究心忘言得意如筏喻者必由数番熏习方契色香中道
  - date: 1738-09-15
    title_zh: 示文字即实相劝离言契证
    rationale: 教观既足解行相须过关之人无适非真不可离此文门别求实相
