  title_zh: 楞严讲席弘法与菁山问道
  summary: 幼披缁慕秋衲之名，往菁山慧严谒佛海，辨真隐与名隐，久住嘉禾楞严讲寺弘天台教观
  phases:
  - key: brewing
    name: 幼披缁闻秋衲之名
    labels:
