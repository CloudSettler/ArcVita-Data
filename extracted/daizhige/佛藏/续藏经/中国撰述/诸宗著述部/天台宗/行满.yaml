endeavors:
- id: guji-行满-endeavor-1
  title_zh: 绍述五时八教与一心三观大意
  summary: 依大师教门，以乳酪生熟苏醍醐喻五时，以顿渐秘密不定与藏通别圆释八教，会渐归顿，明三观巧拙六即不滥
  phases:
  - key: brewing
    name: 承师研习天台教观
    labels:
      zh: 研习酝酿
    start_date: '0770-01-01'
    highlight_event_id: guji-行满-event-study
  - key: breakthrough
    name: 提炼五味八教纲领
    labels:
      zh: 判教突破
    start_date: '0795-01-01'
    highlight_event_id: guji-行满-event-study
  - key: climax
    name: 撰述法门大意成文
    labels:
      zh: 撰述高峰
    start_date: '0804-10-01'
    highlight_event_id: guji-行满-event-record
  - key: closure
    name: 以简驭繁付嘱后学
    labels:
      zh: 收束传持
    start_date: '0804-10-20'
    highlight_event_id: guji-行满-event-record
  decisions:
  - date: '0804-10-01'
    title_zh: 定以五味喻五时统摄化仪
    rationale: 华严顿教为乳，阿含为酪，方等为生苏，般若为熟苏，法华涅槃为醍醐，以喻显次第，令初学易解
  - date: '0804-10-10'
    title_zh: 判华严别教次第法华圆顿不次第
    rationale: 华严主伴未融犹不自在，法华白牛开渐归顿，须分次第与不次第，以防混滥圆别
- id: guji-行满-endeavor-2
  title_zh: 应日本最澄求法授记大意
  summary: 贞元二十年因日本求法僧最澄东来求法，应请略记天台宗法门大意，助天台教观东传日本
  phases:
  - key: brewing
    name: 最澄入唐求法访道
    labels:
      zh: 因缘酝酿
    start_date: '0804-01-01'
    highlight_event_id: guji-行满-event-record
  - key: breakthrough
    name: 应请决意略述大猷
    labels:
      zh: 应请决断
    start_date: '0804-10-15'
    highlight_event_id: guji-行满-event-record
  - key: climax
    name: 十月二十日记付法门大意
    labels:
      zh: 记述付授
    start_date: '0804-10-20'
    highlight_event_id: guji-行满-event-record
  - key: closure
    name: 华严法华同异之辨留示后世
    labels:
      zh: 东传收束
    start_date: '0804-10-20'
    highlight_event_id: guji-行满-event-record
  decisions:
  - date: '0804-10-20'
    title_zh: 因最澄求法而记
    rationale: 异域求法因缘难得，故不广引诸文，直述大师教门五时八教要旨，俾得持归传扬
  - date: '0804-10-20'
    title_zh: 点明涅槃捃拾扶律说常之义
    rationale: 法华三周记莂如秋收冬藏已竟，涅槃为增上外道广开常宗，故特标捃拾之说以全醍醐之教
