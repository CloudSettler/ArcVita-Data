  - key: climax
    name: 口授集录
    labels:
      zh: 乾淑笔受
    start_date: 0788
    highlight_event_id: guji-道邃-event-preach
  - key: closure
    name: 付嘱详镜
    labels:
      zh: 示人取舍
    start_date: 0805
    highlight_event_id: guji-道邃-event-teach-east
  decisions:
  - date: 0785
    title_zh: 以三界为无漏总中之三
    rationale: 从前次修无漏止三界狱中来，故合三界为所止无漏为能止，共成四义
  - date: 0788
    title_zh: 令门人录异义以示后
    rationale: 与记文少乖各有眉目，虑后人专文昧义，故使笔录留世令详镜而择之
events:
- id: guji-道邃-event-birth
  date: '0746'
  year_of: 746
  title_zh: 生于江南吴地
  description_zh: 唐开元末年约生，俗姓吴，少慕佛乘，长而志求天台教观
  place_zh: 江南
- id: guji-道邃-event-study
  date: '0765'
  year_of: 765
  title_zh: 师事荆溪湛然禀受止观
  description_zh: 往天台亲近湛然，禀受摩诃止观及辅行弘决，深得圆顿之旨，时人称为止观和尚门下
  place_zh: 天台山
- id: guji-道邃-event-preach
  date: 0785
  year_of: 785
  title_zh: 口说止观记中异义乾淑笔录
  description_zh: 就无漏总中三义及发心行道十境方便等处发挥别解，与湛然记文相参，令弟子乾淑集为一卷
  place_zh: 天台山
- id: guji-道邃-event-teach-east
  date: 0805
  year_of: 805
  title_zh: 授日本僧最澄以天台教法
  description_zh: 日本沙门最澄入唐登天台求法，从受菩萨戒及天台教观，开东瀛天台一宗之源
  place_zh: 天台山
- id: guji-道邃-event-death
  date: 0806
  year_of: 806
  title_zh: 示寂于天台山
  description_zh: 永贞元年左右示寂，世推为天台相承第七祖，所说异义后为四明诸师所详辨
  place_zh: 天台山
