    title_zh: 决意师事荆溪湛然
    rationale: 慕天台圆顿教观精微，舍他门而专就荆溪请益止观，以求正传
  - date: 0805
    title_zh: 决意授最澄以天台教法
    rationale: 悯东瀛求法诚恳，欲使大乘圆教广布海外，故不辞衰老而为说戒授法
- id: guji-道邃-endeavor-2
  title_zh: 口说止观记中异义开示后学
  summary_zh: 就湛然辅行记发挥别解，与记主相参，令乾淑集录成篇，以辨三界无漏诸义
  phases:
  - key: brewing
    name: 研寻辅行
    labels:
