  title_zh: 随侍先老人观摩二部授戒
  summary: 随侍昭庆先老人左右，观摩丁未春蜜照等四十余尼受具之全仪
  phases:
  - key: brewing
    name: 随侍昭庆习律
    labels:
      zh: 随侍见闻
    start_date: '1660'
    highlight_event_id: guji-书玉-event-birth
  - key: breakthrough
    name: 丁未春众尼求具
    labels:
      zh: 二部缘起
    start_date: '1667-03-01'
    highlight_event_id: guji-书玉-event-dingwei
  - key: climax
    name: 山南一叶庵先授本法次诣大僧圆具
    labels:
      zh: 圆具正作
    start_date: '1667-03-15'
    highlight_event_id: guji-书玉-event-dingwei
  - key: closure
    name: 目睹成规铭记于心
    labels:
      zh: 铭记成规
    start_date: '1667-04-01'
    highlight_event_id: guji-书玉-event-dingwei
  decisions:
  - date: '1667-03-01'
    title_zh: 未列坛位而全程随侍记录
    rationale: 无法不从目过故，欲存先老人成规以待后用
  - date: '1667-03-15'
    title_zh: 详观尼部十师与大僧二部会合之法
    rationale: 二部二十众方成具足，少一人则作法不成，须审谛观摩
- id: guji-书玉-endeavor-2
  title_zh: 述作二部僧授戒仪式一册
  summary: 应巨翰二公之请，于癸未上元录成仪式凡例卷上下以证将来
  phases:
  - key: brewing
    name: 师资不偶从权授受
    labels:
      zh: 从权之叹
    start_date: '1680'
    highlight_event_id: guji-书玉-event-dingwei
  - key: breakthrough
    name: 松隐传戒巨源领尼部
    labels:
      zh: 南北因缘
    start_date: '1702'
    highlight_event_id: guji-书玉-event-guiwei
  - key: climax
    name: 巨翰南来请述旧仪
    labels:
      zh: 请述仪轨
    start_date: '1702-11-01'
    highlight_event_id: guji-书玉-event-guiwei
  - key: closure
    name: 癸未上元录册奉览
    labels:
      zh: 成书传世
    start_date: '1703-02-11'
    highlight_event_id: guji-书玉-event-guiwei
  decisions:
  - date: '1702-11-01'
    title_zh: 谆请再四理不容辞而许述作
    rationale: 欲令受大戒僧尼共睹如来圣制律法森严
  - date: '1703-02-11'
    title_zh: 以昔年所见据实录成凡例十二则及卷上下
    rationale: 事法俱出传戒作持，不敢增饰，证将来之轨则
events:
- id: guji-书玉-event-birth
  title_zh: 出生
  kind: birth
  date: '1635'
  year_of: 1635
  description: 生于明末清初，后出家于古杭昭庆寺传习毗尼
- id: guji-书玉-event-dingwei
  title_zh: 丁未春随侍观摩二部授戒
  kind: career
  date: '1667-03-01'
  year_of: 1667
  description: 昆山蜜照尼同徐太夫人上山设供，四十余学戒女求具，先老人命蜜照为和尚超尘为羯磨圆证为教授，往山南一叶庵先授本法，次日领众登山于二部僧中圆具，书玉随侍目睹
- id: guji-书玉-event-guiwei
  title_zh: 癸未上元述成仪式
  kind: career
  date: '1703-02-11'
  year_of: 1703
  description: 康熙四十二年癸未上元，应巨源翰屏之请，将昔年所见录成二部僧授戒仪式一册，具凡例十二则及授本法大僧正授等仪
- id: guji-书玉-event-death
  title_zh: 示寂
  kind: death
  date: '1705'
  year_of: 1705
  description: 述仪之后示寂于昭庆，传律之范赖此一册以存
