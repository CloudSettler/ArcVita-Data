    highlight_event_id: guji-允堪-event-fuzhu
  decisions:
  - date: '0993-01-01'
    title_zh: 据南山正文定五观不从别本
    rationale: 先印行本与正文有异故须正本清源令根锐者可入律渊
  - date: '0994-03-01'
    title_zh: 附见出生食法节量普施
    rationale: 令食时不弃不盗节饼饭七粒徧施十方成就施主无量波罗蜜
