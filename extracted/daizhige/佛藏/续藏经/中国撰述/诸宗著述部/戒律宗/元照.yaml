person:
  qid: guji-元照
  name_zh: 元照
  names:
    zh: 元照
    en: Yuanzhao
  lifespan:
    birth:
      date: 1048
      precision: year
      is_circa: false
      raw: 宋慶曆八年餘杭
    death:
      date: 1116
      precision: year
      is_circa: false
      raw: 宋政和六年靈芝
  birth_date: 1048
  death_date: 1116
  era: 北宋
  reign_ref: 宋徽宗政和
  archetype: 重興南山律兼弘淨土之高僧
  dilemmas:
  - 專宗經教講律持戒恐被目為束縛名相，對機漸失，若捨經教直談空性又恐壞戒體失住持根本
  - 末法根機怯弱難信淨土莊嚴妙相，若峻立嚴規恐眾散去，若一味隨緣方便又恐律制蕩然
  lesson: 以戒為師，以像設經藏接引群品，理事一如，真俗不二，方能令律教久住淨業弘廣
  summary_first_person: 吾餘杭唐氏子，依神悟謙受具弘南山律，住靈芝崇福，講律著述兼勸淨土，凡殿閣輪藏像設有請皆為作記，欲使見聞者回邪復正，禮敬者蒙福開悟，會律歸淨以報佛恩
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E6%88%92%E5%BE%8B%E5%AE%97/%E8%A1%A5%E7%BB%AD%E8%8A%9D%E5%9B%AD%E9%9B%86.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E6%88%92%E5%BE%8B%E5%AE%97/%E8%A1%A5%E7%BB%AD%E8%8A%9D%E5%9B%AD%E9%9B%86.md
endeavors:
- id: guji-元照-endeavor-1
  title_zh: 重興南山律宗與芝園著述
  summary: 承南山律學於將廢之際，住靈芝弘講，著資持等記，奉命建壇結界，以律範維持住持三寶
  phases:
  - key: brewing
    name: 餘杭出家稟具學律
    labels:
      zh:
      - 出家稟戒
      - 親近神悟
    start_date: 1048
    highlight_event_id: guji-元照-event-birth
  - key: breakthrough
    name: 住靈芝弘講著述
    labels:
      zh:
      - 靈芝弘律
      - 資持著述
    start_date: 1081
    highlight_event_id: guji-元照-event-lingzhi
  - key: climax
    name: 奉命結界傳戒化導
    labels:
      zh:
      - 建壇傳戒
      - 結界統眾
    start_date: 1087
    highlight_event_id: guji-元照-event-jiejie
  - key: closure
    name: 集芝園文垂裕後世
    labels:
      zh:
      - 芝園集
      - 示寂靈芝
    start_date: 1116
    highlight_event_id: guji-元照-event-death
  decisions:
  - date: 1081
    title_zh: 擇住靈芝專弘律學不隨禪講風轉
    rationale: 道無興替維持在人，無律則僧制不立，故寧守寂寞而闡南山正義
  - date: 1087
    title_zh: 應命結界以戒律統攝僧團住持
    rationale: 非相無以動心，非制無以攝眾，藉結界建壇令四眾有所依仰
- id: guji-元照-endeavor-2
  title_zh: 弘揚淨土與殿閣像設護持
  summary: 承廬山遠公之緒，勸修觀想持名，以輪藏寶塔彌陀像閣之記，導俗信歸向，令即事通道
  phases:
  - key: brewing
    name: 順感輪藏啟信
    labels:
      zh:
      - 轉輪藏
      - 興福接眾
    start_date: 1077
    highlight_event_id: guji-元照-event-shungan
  - key: breakthrough
    name: 無量院彌陀像勸修淨業
    labels:
      zh:
      - 彌陀立像
      - 結社念佛
    start_date: 1093
    highlight_event_id: guji-元照-event-wuliang
  - key: climax
    name: 龍泉彌陀寶閣會通三寶
    labels:
      zh:
      - 寶閣莊嚴
      - 住持三寶
    start_date: 1107
    highlight_event_id: guji-元照-event-longquan
  - key: closure
    name: 三聖觀像示理事一如
    labels:
      zh:
      - 三聖立像
      - 觀像見佛
    start_date: 1116
    highlight_event_id: guji-元照-event-death
  decisions:
  - date: 1093
    title_zh: 為俗眾雕造丈六彌陀專崇持名觀想
    rationale: 末流狂妄正道梗塞，唯淨土三昧上中下根莫不沾益，故以有相引入無相
  - date: 1107
    title_zh: 以僧為上重修藏閣改立彌陀寶閣
    rationale: 范金合土住持佛寶必得人維持，推僧為上則三寶隆安四生依仰
events:
- id: guji-元照-event-birth
  title_zh: 生於杭州餘杭唐氏
  date: 1048
  year_of: 1048
  description: 宋慶曆八年生於餘杭，俗姓唐，後出家號安忍子，字湛然
- id: guji-元照-event-shungan
  title_zh: 為台州順感院轉輪藏作記
  date: 1077
  year_of: 1077
  description: 熙寧十年應臨華希湛請，為順感院輪藏法堂等興建作記，歎俗吏外護而警同道莫忽經教
- id: guji-元照-event-lingzhi
  title_zh: 住靈芝崇福寺弘南山律
  date: 1081
  year_of: 1081
  description: 繼嗣靈芝，講律傳戒，著資持記等疏釋南山，中興戒律宗風
- id: guji-元照-event-jiejie
  title_zh: 奉命結界過台州慈德院為重修大殿作記
  date: 1087
  year_of: 1087
  description: 元祐二年以結界之命過慈德院，應仲元請記重修大殿始末，明非相無以表理之義
- id: guji-元照-event-wuliang
  title_zh: 為臨安無量院彌陀像作記
  date: 1093
  year_of: 1093
  description: 元祐八年應用淵請，為九仙山無量院八尺彌陀像作記，暢述東林以來淨社源流勸歸淨土
- id: guji-元照-event-longquan
  title_zh: 為越州龍泉彌陀寶閣作記
  date: 1107
  year_of: 1107
  description: 大觀元年丁亥為餘姚龍泉寺彌陀寶閣作記，明住持三寶推僧為上，讚智榮鼎新之功
- id: guji-元照-event-death
  title_zh: 示寂於靈芝
  date: 1116
  year_of: 1116
  description: 宋政和六年示寂，世壽六十九，遺著芝園集等行於世，律淨並弘之風遠被浙右
