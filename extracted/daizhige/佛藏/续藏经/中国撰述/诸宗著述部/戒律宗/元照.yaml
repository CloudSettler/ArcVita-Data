  decisions:
  - date: 1070-08-01
    title_zh: 熙宁三年后安居录出戒体章
    rationale: 圣师既往文存理隐，任意私说殆六七家，故专依疏本直叙大略以正视听
  - date: 1070-08-15
    title_zh: 立善种为体融会前宗
    rationale: 多宗成宗各计不同，考实求深终非了义，故推佛本怀跨入大乘位立圆教指实体
- id: guji-元照-endeavor-2
  title_zh: 重明持犯开坛弘律
  description: 以制听二教所诠事法为所持犯体，破体状两分万境等说，建戒坛授戒讲学化众
  phases:
  - key: brewing
    name: 详勘钞疏持犯方轨
    labels:
      zh: 酝酿
    start_date: 1075
    highlight_event_id: guji-元照-event-xining-jieti
  - key: breakthrough
    name: 立事法为所持犯体
    labels:
      zh: 突破
    start_date: 1080
    highlight_event_id: guji-元照-event-chifanti
  - key: climax
    name: 建明州开元戒坛授戒
    labels:
      zh: 高潮
    start_date: 1085
    highlight_event_id: guji-元照-event-kaiyuan-jiantan
  - key: closure
    name: 集芝园遗编垂后
    labels:
      zh: 收束
    start_date: 1110
    highlight_event_id: guji-元照-event-kaiyuan-jiantan
  decisions:
  - date: 1080
    title_zh: 定以一切事法为所持犯体
    rationale: 持犯既因事法而生心起违顺，故约二教对显事法使分齐可辨
  - date: 1085
    title_zh: 建明州开元寺戒坛誓众弘律
    rationale: 行人常思此行即摄律仪，欲使怀道者识本体发大行，故开坛授受讲演要义
events:
- id: guji-元照-event-birth
  title_zh: 诞生于余杭
  date: 1048
  year_of: 1048
  location_zh: 余杭
  description: 宋庆历八年生于余杭唐氏，后出家号安忍，专学南山律宗
- id: guji-元照-event-xining-jieti
  title_zh: 熙宁三年录出戒体章
  date: 1070-08-01
  year_of: 1070
  location_zh: 余杭
  description: 后安居日于南山祖师羯磨疏录出戒体章，贬黜浮伪，鼎示多宗成宗圆教三宗，指善种为戒体
- id: guji-元照-event-chifanti
  title_zh: 撰持犯体章持犯句法章
  date: 1080
  year_of: 1080
  location_zh: 余杭
  description: 叙昔传伸格义，破增晖会正万境诸说，定以二教所诠善恶事法为所持犯体，复辨可学不可学九句
- id: guji-元照-event-kaiyuan-jiantan
  title_zh: 建明州开元寺戒坛开讲
  date: 1085
  year_of: 1085
  location_zh: 明州开元寺
  description: 建戒坛立誓文授大乘菩萨戒，兼剃发授戒方便，为众开讲要义，化风大振
- id: guji-元照-event-death
  title_zh: 示寂
  date: 1116
  year_of: 1116
  location_zh: 余杭
  description: 政和六年示寂，遗编由道询集为芝园遗编上中下三卷传世
