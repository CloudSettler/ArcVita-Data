endeavors:
- id: guji-妙生-endeavor-1
  title_zh: 述六物辨讹救始萌之弊
  summary_zh: 因六物图谬传惑人述书辨长短条叶刺缝押叶之正以遏讹风
  phases:
  - key: brewing
    name: 听寻观图察六物之谬
    labels:
      zh:
      - 观图察讹
    start_date: 1130-01-01
    highlight_event_id: guji-妙生-event-1
  - key: breakthrough
    name: 述书辨讹明割截叶相
    labels:
      zh:
      - 述书辨讹
    start_date: 1135-01-01
    highlight_event_id: guji-妙生-event-1
  - key: climax
    name: 会通却刺鸟足诸文定式
    labels:
      zh:
      - 会通定式
    start_date: 1136-01-01
    highlight_event_id: guji-妙生-event-1
  - key: closure
    name: 讹风未遏转谋图显正
    labels:
      zh:
      - 转谋显正
    start_date: 1138-01-01
    highlight_event_id: guji-妙生-event-2
  decisions:
  - date: 1135-01-01
    title_zh: 先述辨讹书救萌
    rationale: 六物图诬罔取惑于时人若不辨则行事无补故先为书救之
  - date: 1138-01-01
    title_zh: 不获已复为显正图
    rationale: 讹风尚未能遏律文事相难晓故以图显所注之义使日用无晦
- id: guji-妙生-endeavor-2
  title_zh: 作三衣显正图束十五科显正
  summary_zh: 束衣相为十五科据九品末品九条为式明重作破缘钩纽肘量以定作衣伦叙
  phases:
  - key: brewing
    name: 以图显注立作衣伦叙
    labels:
      zh:
      - 立图显注
    start_date: 1138-06-01
    highlight_event_id: guji-妙生-event-2
  - key: breakthrough
    name: 束为十五科示财色长短
    labels:
      zh:
      - 十五科成
    start_date: 1140-01-01
    highlight_event_id: guji-妙生-event-2
  - key: climax
    name: 准感通传定破缘重作之式
    labels:
      zh:
      - 定破缘重作
    start_date: 1141-01-01
    highlight_event_id: guji-妙生-event-2
  - key: closure
    name: 凭肘量画图门人重开传世
    labels:
      zh:
      - 凭量传世
    start_date: 1146-05-01
    highlight_event_id: guji-妙生-event-3
  decisions:
  - date: 1140-01-01
    title_zh: 据下品九条为图式通九品
    rationale: 大衣九品长短条数虽异而割截揲叶之法可类推故举一以明众
  - date: 1141-01-01
    title_zh: 准感通传定破缘三缝与重作缦刺
    rationale: 四分安缘恐速坏而天神示破缘重作之法坚牢足为受用故从之
