endeavors:
- id: guji-妙生-endeavor-1
  title_zh: 辨东藏六物图之讹
  summary_zh: 因见东藏律师六物图文义疏漏恐讹传久远故循图为十一段辨其立题画图衣名受舍明相改文坐具钩纽之失
  phases:
