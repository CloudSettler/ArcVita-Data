    start_date: 1096-04-01
    highlight_event_id: guji-妙生-event-2
  - key: climax
    name: 据律正讹
    labels:
      zh: 据律正讹
    start_date: 1096-04-10
    highlight_event_id: guji-妙生-event-2
  - key: closure
    name: 付嘱门人
    labels:
      zh: 付嘱门人
    start_date: 1096-04-16
    highlight_event_id: guji-妙生-event-3
  decisions:
  - date: 1095
    title_zh: 决循图文随见随辨
    rationale: 恐专信新图不看疏钞正文日久相承讹谬不可革故不杜口无言
  - date: 1096-04-01
    title_zh: 决引南山疏钞感通传为证
    rationale: 三衣六物之制已备于二衣篇章服仪轨度图经当以祖述为准以正改文废增之失
- id: guji-妙生-endeavor-2
  title_zh: 护南山律教劝废图文
  summary_zh: 明南山疏钞文义已备新图无益且失祖师不集一处欲人明通之意故劝藏卷斯文使学者归宗正教
  phases:
  - key: brewing
    name: 考校祖述
    labels:
      zh: 考校祖述
    start_date: 1095
    highlight_event_id: guji-妙生-event-1
  - key: breakthrough
    name: 明受舍坐具钩纽
    labels:
      zh: 明受舍坐具钩纽
    start_date: 1096-04-05
    highlight_event_id: guji-妙生-event-2
  - key: closure
    name: 劝废归宗
    labels:
      zh: 劝废归宗
    start_date: 1096-04-16
    highlight_event_id: guji-妙生-event-3
  decisions:
  - date: 1096-04-10
    title_zh: 决明受三说舍一说及增量坐具之制
    rationale: 受难舍易不可增减迦留增量通于后世卧具皆须展坐具故当存旧制
  - date: 1096-04-16
    title_zh: 决劝丧亡我执藏卷图文
    rationale: 图亡制度无益于人又引文迷教旨失祖师用意不如流通疏钞以免惑后生
