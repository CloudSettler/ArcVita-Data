    title_zh: 决意拣形同取法同
    rationale: 形同剃发无戒非真沙弥，唯法同禀受十戒方为入道初基可造重楼
  - date: 1680-01-01
    title_zh: 决意回向大乘不滞小果
    rationale: 十戒体通大小，心大则戒广功成正觉，若无出世之心纵持多戒止报人天
events:
- id: guji-弘赞-event-birth
  date: 1611-01-01
  year_of: 1611
  title_zh: 降生
  description_zh: 生于明末清初之际，后出家于粤东鼎湖，号弘赞，字在犙
- id: guji-弘赞-event-1
  date: 1670-01-01
  year_of: 1670
  title_zh: 撰述沙弥学戒仪轨颂注
  description_zh: 取沙弥十戒及事师法结为一百一十七颂，每颂二十字，并加注疏，以罗睺罗密行为缘起，标戒体相，明杀盗淫妄四重及诸威仪
- id: guji-弘赞-event-2
  date: 1660-01-01
  year_of: 1660
  title_zh: 居鼎湖弘律化众
  description_zh: 住持粤东鼎湖，以十戒为道基，教初机息除身口七支之恶，广修六和敬及檀度梵行，回向一乘常寂
- id: guji-弘赞-event-death
  date: 1685-01-01
  year_of: 1685
  title_zh: 示寂
  description_zh: 于清康熙中后期示寂，一生以律仪为出世轨则，遗颂注流通后学
