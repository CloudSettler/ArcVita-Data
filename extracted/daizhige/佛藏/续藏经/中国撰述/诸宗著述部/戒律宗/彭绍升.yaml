endeavors:
- id: guji-彭绍升-endeavor-1
  title_zh: 重整文星阁放生会广行放生
  description: 承先曾祖旧会，于南园木杏桥开池畜鱼，重定司月募款之制，劝众尽寿勤行，回向西方净土
  phases:
  - key: brewing
    name: 南园开池畜鱼
    labels:
      zh:
      - 肇会蓄养
    start_date: 1774
    highlight_event_id: guji-彭绍升-event-1774
  - key: breakthrough
    name: 拟定重整募放之制
    labels:
      zh:
      - 立制募众
    start_date: 1779
    highlight_event_id: guji-彭绍升-event-1779
  - key: climax
    name: 八条破疑广劝体仁
    labels:
      zh:
      - 劝化立信
    start_date: 1779
    highlight_event_id: guji-彭绍升-event-1779
  - key: closure
    name: 通名桂香回向净土
    labels:
      zh:
      - 回向净土
    start_date: 1779
    highlight_event_id: guji-彭绍升-event-1779
  decisions:
  - date: 1779
    title_zh: 纠司月十二人岁募买放
    rationale: 旧会食料费繁而与会寥落，故定人持簿岁募三百六十，积股买放，有余充食料，以继长寿因
  - date: 1779
    title_zh: 作八条以破退堕之障
    rationale: 恐人乍发善心旋复退堕，故举八疑而辨体仁推恩之义，令生机勃发天理昭彰
  - date: 1779
    title_zh: 以放生功德回向西方
    rationale: 愿度有情同生净土，令施者受者断恐怖竭烦恼，更不相吞相杀，共沐佛慈
- id: guji-彭绍升-endeavor-2
  title_zh: 营家园收生池立碑著述弘仁
  description: 自少买鱼纵于家园之池，请立收生池碑，又撰南园放生池碑铭与回向文，集为体仁要术以阐仁道
  phases:
  - key: brewing
    name: 少时园中纵鱼为乐
    labels:
      zh:
      - 家园养善
    start_date: 1752
    highlight_event_id: guji-彭绍升-event-1752
  - key: breakthrough
    name: 请立收生池碑示后
    labels:
      zh:
      - 立碑垂训
    start_date: 1774
    highlight_event_id: guji-彭绍升-event-1774
  - key: climax
    name: 撰南园放生池碑铭
    labels:
      zh:
      - 阐发仁理
    start_date: 1779
    highlight_event_id: guji-彭绍升-event-1779
  - key: closure
    name: 集体仁要术以传后世
    labels:
      zh:
      - 著述结集
    start_date: 1779
    highlight_event_id: guji-彭绍升-event-1779
  decisions:
  - date: 1752
    title_zh: 因洼为池稍畜鲫鲤
    rationale: 承父命规舍后隙地为园，植荷畜鱼，时买市鱼纵之，观泳游而乐生生之理
  - date: 1779
    title_zh: 颜曰收生池并作铭示子姓
    rationale: 见池鱼日充而家族日蕃，悟我生物生并育无害，故立碑以昭天地同气之义
  - date: 1779
    title_zh: 以生止杀立对治法
    rationale: 举流水长者故事与佛孔同音，明救物之生即戒己之杀，同归觉城
events:
- id: guji-彭绍升-event-birth
  date: 1740
  year_of: 1740
  title_zh: 诞生于苏州彭氏
  description: 乾隆五年诞生，苏州望族，先世肇文星阁放生会，家风仁厚
- id: guji-彭绍升-event-1752
  date: 1752
  year_of: 1752
  title_zh: 家园收生池初成纵鱼
  description: 乾隆十七年随父规舍后隙地为园，因洼为池畜鱼，读书园中时买市鱼纵之
- id: guji-彭绍升-event-1774
  date: 1774
  year_of: 1774
  title_zh: 南园木杏桥始辟放生池
  description: 乾隆三十九年于南园辟放生池畜生鱼，阁中隙地养羊豕鸡鹜，满则送之云栖
- id: guji-彭绍升-event-1779
  date: 1779
  year_of: 1779
  title_zh: 重整放生会作体仁要术
  description: 拟重整前会定司月募款之制，作重整引文八条及回向文，又撰两放生池碑铭
- id: guji-彭绍升-event-death
  date: 1796
  year_of: 1796
  title_zh: 示寂
  description: 乾隆六十一年示寂，一生以放生弘净土，遗体仁要术行世
