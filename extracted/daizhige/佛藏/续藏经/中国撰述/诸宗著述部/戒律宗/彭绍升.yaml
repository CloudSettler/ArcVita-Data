  dilemmas:
  - 所放甚少而所杀甚多，少善能否挽回众杀之劫
  - 平日食肉而偶一放生，是否一暴十寒而无补于事
  - 放生著相求福，是否违背无为真如之道
  lesson: 体仁为五常之首，以放生止杀，长养恻隐，同愿往生净土
  summary_first_person: 我是彭绍升，苏州彭氏子，先曾祖肇文星阁放生会，我承先志重整旧会，纠众募财随时买放，又因园为池立碑垂训，作八条以破群疑，愿人止杀全生，体仁合天，同生安养
