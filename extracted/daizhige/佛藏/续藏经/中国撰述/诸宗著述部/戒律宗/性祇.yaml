  - date: 1622-01-01
    title_zh: 赘古集密咒以便持诵
    rationale: 为令初学易持兼得神咒加持故于一一行相附七遍真言贵在持诵慎毋彼此疑议
- id: guji-性祇-endeavor-2
  title_zh: 总列戒相三衣名义以训后进
  description_zh: 于日用偈咒外总书在家五戒沙弥十戒比丘二百五十戒比丘尼三百四十八戒菩萨十重四十八轻及三聚净戒三衣瓶钵锡杖名义并晦望羯磨忏悔之法以便初学记持
