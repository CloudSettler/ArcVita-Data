endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 别述梵网经忏悔行法
  summary: 为受菩萨戒后犯十重者别明忏仪依卢舍那佛金口明训立十意行法求见好相以复戒体
  phases:
  - key: brewing
    name: 痛念毁犯寻觅还净仪轨
    labels:
      zh: 酝酿
    start_date: '1635'
    highlight_event_id: guji-智旭-event-1
  - key: breakthrough
    name: 抉择别依梵网不泛依余法
    labels:
      zh: 突破
    start_date: '1642'
    highlight_event_id: guji-智旭-event-1
  - key: climax
    name: 制定十意详立事理二忏
    labels:
      zh: 高潮
    start_date: '1648'
    highlight_event_id: guji-智旭-event-2
  - key: closure
    name: 示好相证相与空观相应之旨
    labels:
      zh: 收束
    start_date: '1650'
    highlight_event_id: guji-智旭-event-2
  decisions:
  - date: '1642'
    title_zh: 决定别依梵网行法忏十重罪
    rationale: 法华方等虽能灭罪而犯十戒者仍须还从地起标心不泛故别立此仪
  - date: '1648'
    title_zh: 决定兼修福德智慧二种庄严
    rationale: 有事无理不能清罪之源有理无事不能竭罪之流故礼佛诵戒与观罪性空并行
- id: guji-智旭-endeavor-2
  title_zh: 弘扬菩萨戒与学戒持律
  summary: 先述学戒法明千里无师像前自受之旨复明破戒后密默进道直证无生之阶次
  phases:
  - key: brewing
    name: 述学戒法明自誓受戒
    labels:
      zh: 酝酿
    start_date: '1630'
    highlight_event_id: guji-智旭-event-1
  - key: breakthrough
    name: 分判梵网璎珞地持受戒异同
    labels:
      zh: 突破
    start_date: '1638'
    highlight_event_id: guji-智旭-event-1
  - key: climax
    name: 开示破戒后附学进道之门
    labels:
      zh: 高潮
    start_date: '1648'
    highlight_event_id: guji-智旭-event-2
  - key: closure
    name: 劝永断相续闭恶趣植出世种
    labels:
      zh: 收束
    start_date: '1652'
    highlight_event_id: guji-智旭-event-2
  decisions:
  - date: '1638'
    title_zh: 决定先弘学戒后别明忏法
    rationale: 未受须明得戒之方已受犯重须明出罪之门故次第而述不令混滥
  - date: '1648'
    title_zh: 决定开许见好相后复进比丘戒
    rationale: 八戒五戒沙弥破根本者见好相已既得菩萨大戒仍可进趣故存悲济之道
