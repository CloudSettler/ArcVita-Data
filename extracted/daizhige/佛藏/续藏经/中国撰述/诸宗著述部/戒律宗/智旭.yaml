  summary_first_person: 吾名智旭吳縣鍾氏子也少讀儒書而闢佛教及父亡讀蓮池文而悟出家遍參律教禪淨晚年愍在家二眾不知歸戒乃集在家律要並加箋注願人人守五戒發菩提以全其為人不愧於天也
