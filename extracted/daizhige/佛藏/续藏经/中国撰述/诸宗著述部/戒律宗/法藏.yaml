    rationale: 令发上品真诚十方善法注身五分戒体成就故先拜辞君亲灌顶剃发授钵衣而后请圣忏悔
events:
- id: guji-法藏-event-birth
  title_zh: 诞生出家
  date: '1573'
  year_of: 1573
  description: 约明万历前后诞生后舍俗出家受具精研毗尼律藏发愿弘戒
- id: guji-法藏-event-death
  title_zh: 示寂
  date: '1635'
  year_of: 1635
  description: 约明崇祯前后示寂所集法仪后经终南蟠龙寺超远检录流通
- id: guji-法藏-event-1
  title_zh: 住持北禅寺弘戒
  date: '1621'
  year_of: 1621
  description: 明天启年间住持北禅寺以弘戒沙门自任开坛传戒为诸佛子剃度授戒
- id: guji-法藏-event-2
  title_zh: 建坛祝圣授比丘戒
  date: '1624'
  year_of: 1624
  description: 设草莽之坛请现前十师作得戒羯磨教授尊证宣祝圣文迎建坛四圣升座演毗尼
- id: guji-法藏-event-3
  title_zh: 制授沙弥十戒法卷上
  date: '1625'
  year_of: 1625
  description: 制授沙弥仪详定请师拜辞君亲灌顶剃发授钵三衣三皈五戒十戒次第
- id: guji-法藏-event-4
  title_zh: 撰集成传授三坛弘戒法仪
  date: '1627'
  year_of: 1627
  description: 撰集三坛弘戒法仪全编卷中说比丘戒法备列问难轻重遮难单白羯磨以垂后世
