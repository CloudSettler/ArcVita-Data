person:
  qid: guji-法藏
  name_zh: 法藏
  names:
    zh: 汉月法藏
    en: Hanyue Fazang
  lifespan:
    birth:
      date: '1573'
      precision: year
      is_circa: false
      raw: 万历元年
    death:
      date: '1635'
      precision: year
      is_circa: false
      raw: 崇祯八年
  birth_date: '1573'
  death_date: '1635'
  era: 明末
  reign_ref: 万历至崇祯
  archetype: 会通禅律的中兴者
  dilemmas:
  - 禅人忽律而重心，戒师执相而遗体，相顾讥诃，如何和会归于一心
  - 戒坛一闭仪法尽亡，三家分茅裂土，如何拾古规以补全授受次第
  - 受菩萨戒者一受便了不知心地大意，如何开导令其直下明心见性
  lesson: 以实相无相涅槃妙心为禅教律的旨，持律以固禅宗，究禅以求戒体
  summary_first_person: 我是法藏，初受戒于云栖，既具圆于灵谷，再禀云栖塔前而教授于云门，见禅律相非、戒坛仪亡，遂得南坛具足戒式而参演补全，又按梵网经重重开导菩萨心地，汇成弘戒法仪一函，愿禅律一心同归实相
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/戒律宗/弘戒法仪.md
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/戒律宗/弘戒法仪.html
endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 编纂弘戒法仪重整戒坛
  summary: 会合三归五戒八戒十戒及具足菩萨戒，参演古式而成一函仪轨
  phases:
  - key: brewing
    name: 云栖受戒灵谷具圆
    labels:
      zh: 受戒学律
    start_date: '1612'
    highlight_event_id: guji-法藏-event-ordination
  - key: breakthrough
    name: 得南坛古式参演
    labels:
      zh: 拾古参演
    start_date: '1620'
    highlight_event_id: guji-法藏-event-ordination
  - key: climax
    name: 天启癸亥成弘戒法仪
    labels:
      zh: 编仪告成
    start_date: '1623'
    highlight_event_id: guji-法藏-event-compile
  - key: closure
    name: 刻函流通示禅律一心
    labels:
      zh: 流通付嘱
    start_date: '1623'
    highlight_event_id: guji-法藏-event-compile
  decisions:
  - date: '1620'
    title_zh: 纵三家之法为一律
    rationale: 禅忽律，律遗体，须以实相心会通，不使堕增慢不净破戒之弊
  - date: '1623'
    title_zh: 按梵网经重立菩萨戒开导
    rationale: 求戒者不知菩萨戒为何物，须先开导心地忏悔苦行誓愿再正授
- id: guji-法藏-endeavor-2
  title_zh: 住持三峰阐扬禅律同宗
  summary: 以禅接众，以律固宗，注梵网一线，流通佛藏经以警三家匪人
  phases:
  - key: brewing
    name: 云门教授研律究禅
    labels:
      zh: 教授研习
    start_date: '1615'
    highlight_event_id: guji-法藏-event-ordination
  - key: breakthrough
    name: 开堂三峰接引后学
    labels:
      zh: 开法摄众
    start_date: '1624'
    highlight_event_id: guji-法藏-event-preach
  - key: climax
    name: 注梵网一线明禅律一心
    labels:
      zh: 注经立宗
    start_date: '1628'
    highlight_event_id: guji-法藏-event-preach
  - key: closure
    name: 示寂留付嘱后学
    labels:
      zh: 示寂付嘱
    start_date: '1635'
    highlight_event_id: guji-法藏-event-death
  decisions:
  - date: '1624'
    title_zh: 以持律固禅宗
    rationale: 禅不参律则流于狂，须令参禅者务持律以固根本
  - date: '1628'
    title_zh: 以佛藏经警三种匪人
    rationale: 今人分禅教律为三家而斗诤，须流通实相为宗以破门户之见
events:
- id: guji-法藏-event-birth
  title_zh: 出生
  date: '1573'
  year_of: 1573
  description: 万历元年出生，俗姓苏，后出家名法藏，字汉月
- id: guji-法藏-event-ordination
  title_zh: 云栖受戒灵谷具圆
  date: '1612'
  year_of: 1612
  description: 初受戒于云栖，既具圆于灵谷，再禀云栖塔前而教授于云门，纵观三家法而有志会通
- id: guji-法藏-event-compile
  title_zh: 书弘戒法仪序于北禅寺
  date: 1623-11-01
  year_of: 1623
  description: 天启癸亥孟冬朔旦，于北禅寺禁蛙堂书序告成，汇三归五戒乃至菩萨戒羯磨为一函
- id: guji-法藏-event-preach
  title_zh: 住持弘法注梵网一线
  date: '1628'
  year_of: 1628
  description: 住持三峰，以禅律一心接众，著梵网一线上下卷及授戒辨进戒示语等以阐宗
- id: guji-法藏-event-death
  title_zh: 示寂
  date: '1635'
  year_of: 1635
  description: 崇祯八年示寂，世寿六十三，遗三峰宗风，后学奉弘戒法仪以传戒
