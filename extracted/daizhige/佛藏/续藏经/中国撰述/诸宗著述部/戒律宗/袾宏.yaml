  title_zh: 诞生杭州沈氏
  description: 嘉靖乙未正月二十二日生于杭州沈氏后讳袾宏字佛慧号莲池
  location: 杭州
- id: guji-袾宏-event-buxiang
  date: 1551-01-01
  year_of: 1551
  title_zh: 年十七补庠试
  description: 年十七补庠试为儒生后因父母俱丧悟无常而萌出世之志
  location: 杭州
- id: guji-袾宏-event-chujia
  date: 1566-01-01
  year_of: 1566
  title_zh: 投无门洞出家昭庆受戒
  description: 三十二岁父母皆丧投无门洞性天理和尚出家乞昭庆寺无尘玉律师授戒于地涌坛前嗣后遍参知识
  location: 杭州昭庆寺
- id: guji-袾宏-event-yunqi
  date: 1571-01-01
  year_of: 1571
  title_zh: 结茅云栖渐建丛林
  description: 归武林乞食见云栖山水幽寂遂结茅居渐建丛林精修白业道行天下世寿八十有一僧腊满五旬
  location: 杭州云栖寺
- id: guji-袾宏-event-jiyao
  date: 1600-01-01
  year_of: 1600
  title_zh: 辑沙弥律仪要略
  description: 于毗尼藏中采取日用必行之事辑为沙弥律仪要略以世间法释出世法使初机由小进大得入僧数盛行于世
  location: 杭州云栖寺
- id: guji-袾宏-event-death
  date: 1615-07-27
  year_of: 1615
  title_zh: 示寂于云栖
  description: 万历乙卯七月初四示寂于云栖世寿八十有一僧腊满五旬后世尊为莲宗祖师戒律垂范
  location: 杭州云栖寺
