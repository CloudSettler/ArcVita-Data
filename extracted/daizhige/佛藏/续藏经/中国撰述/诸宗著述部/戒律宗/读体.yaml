  archetype: 律宗中兴祖师
  dilemmas:
  - 末世律弛而欲重兴戒法，持守精严与方便摄众如何兼顾
  - 鼎革战乱之中，守护僧团清净与续佛慧命如何两全
  lesson: 律即佛法寿命，日用行住坐卧皆是持戒了生死处
  summary_first_person: 吾读体，字见月，宝华山弘戒比丘，逢末世律弛，发愿以毗尼中兴佛教，日用切要，皆为令初学不失正念，僧团有法可依耳
