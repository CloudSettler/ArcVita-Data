  decisions:
  - date: 1657
    title_zh: 应请住持宝华山隆昌寺
    rationale: 见戒法陵夷僧制废弛，欲以一处清净轨范挽回世运续佛慧命
  - date: 1660
    title_zh: 制定传戒正范严净戒坛
    rationale: 传戒不如法则慧命不断而断，故须刊定仪轨令得戒清净
- id: guji-读体-endeavor-2
  title_zh: 汇集毗尼日用切要化导日用
  summary_zh: 采经律中日用行持偈咒轨则，汇为切要一编，令初学出家者行住坐卧不离愿行
  phases:
  - key: brewing
    name: 搜采经律日用偈咒
    labels:
      zh: 搜采经律
    start_date: 1658
    highlight_event_id: guji-读体-event-baohua
  - key: breakthrough
    name: 删繁举要定体例
    labels:
      zh: 删繁举要
    start_date: 1661
    highlight_event_id: guji-读体-event-compilation
  - key: climax
    name: 汇成毗尼日用切要流通
    labels:
      zh: 汇编流通
    start_date: 1663
    highlight_event_id: guji-读体-event-compilation
  - key: closure
    name: 以日用持犯劝勉学众
    labels:
      zh: 劝勉学众
    start_date: 1675
    highlight_event_id: guji-读体-event-death
  decisions:
  - date: 1661
    title_zh: 以华严日用偈为纲兼采律咒
    rationale: 初机难持广律，先摄日用威仪偈愿，令念念回向则戒行易成
  - date: 1663
    title_zh: 汇刻切要普示丛林
    rationale: 丛林日用轨则不一，汇为一编则学者有所持循不致放逸
events:
- id: guji-读体-event-birth
  date: 1601
  year_of: 1601
  title_zh: 诞生
  description_zh: 明万历二十九年辛丑生于云南，俗姓许
- id: guji-读体-event-ordination
  date: 1623
  year_of: 1623
  title_zh: 出家受具足戒
  description_zh: 早年出家，遍参知识，受具足戒后专攻南山律学，精持毗尼
- id: guji-读体-event-baohua
  date: 1657
  year_of: 1657
  title_zh: 住持宝华山隆昌寺
  description_zh: 应请入主宝华山，重建大殿戒坛，弘传律学，四方从之受戒者甚众
- id: guji-读体-event-compilation
  date: 1663
  year_of: 1663
  title_zh: 汇集毗尼日用切要
  description_zh: 以宝华山弘戒比丘名汇集日用切要，自早觉鸣钟以至睡眠，一一系以偈咒愿行，通行丛林
- id: guji-读体-event-death
  date: 1679
  year_of: 1679
  title_zh: 示寂于宝华山
  description_zh: 清康熙十八年己未示寂，世寿七十九，塔于宝华山，为律宗中兴之祖
