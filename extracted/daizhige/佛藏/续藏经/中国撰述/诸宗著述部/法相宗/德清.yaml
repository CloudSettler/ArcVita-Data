  archetype: 通宗通教高僧
  dilemmas:
  - 相宗名相繁细难入修行者望崖而退
  - 参禅但勘话头不明心地生灭头数易得少为足
  lesson: 藉规矩简要印心使性相不二观心即入一真法界
  summary_first_person: 吾居双径寂照应铠公之请会通性相二宗先依起信会通百法复据唯识论义以此方文势消归八识规矩颂使学者一览了然参禅者即此可以印心
