  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E6%B3%95%E7%9B%B8%E5%AE%97/%E5%85%AB%E8%AF%86%E8%A7%84%E7%9F%A9%E9%80%9A%E8%AF%B4.html
endeavors:
- id: guji-德清-endeavor-1
  title_zh: 述八识规矩通说会归唯心
  role_zh: 述作者
  goal_zh: 变窥基旧解之语使一览便见正要因此悟心
  phases:
  - key: brewing
    name: 居双径寂照应请
    labels:
      zh: 会通起信百法
    start_date: '1610'
    highlight_event_id: guji-德清-event-tongshuo
  - key: breakthrough
    name: 先提大纲明唯识心境
    labels:
      zh: 一真法界为纲
    start_date: '1615'
    highlight_event_id: guji-德清-event-tongshuo
  - key: climax
    name: 逐颂消释转识成智
    labels:
      zh: 五七六八果因转
    start_date: '1616'
    highlight_event_id: guji-德清-event-tongshuo
  - key: closure
    name: 附解六祖识智颂
    labels:
      zh: 转而不转
    start_date: '1617'
    highlight_event_id: guji-德清-event-liuzu
  decisions:
  - date: '1610'
    title_zh: 不依论文细解而取义变语
    rationale: 委细分别名相转见难入故以此方文势消归于颂
  - date: '1617'
    title_zh: 引六祖颂证识本是智
    rationale: 发挥转无所转但转名言以通相宗与参禅向上一路
- id: guji-德清-endeavor-2
  title_zh: 会通性相复兴禅教
  role_zh: 禅师兼讲主
  goal_zh: 使讲者通教纲参禅者知起灭头数
  phases:
  - key: brewing
    name: 五台梦感唯识旨
    labels:
      zh: 分别是识不分别是智
    start_date: '1575'
    highlight_event_id: guji-德清-event-meng
  - key: breakthrough
    name: 悟唯识染净之旨
    labels:
      zh: 依识染依智净
    start_date: '1576'
    highlight_event_id: guji-德清-event-meng
  - key: climax
    name: 双径开示性相二宗
    labels:
      zh: 日用见闻觉知洞察生灭
    start_date: '1610'
    highlight_event_id: guji-德清-event-tongshuo
  - key: closure
    name: 示未破藏识终在生死岸头
    labels:
      zh: 诫未得谓得
    start_date: '1620'
    highlight_event_id: guji-德清-event-liuzu
  decisions:
  - date: '1576'
    title_zh: 以梦中弥勒语为宗
    rationale: 染有生死净无诸佛故以离妄想境界为工夫
  - date: '1620'
    title_zh: 诫生灭未忘便称悟道者
    rationale: 藏识丝毫未透终在生死故须破微细流注
events:
- id: guji-德清-event-birth
  title_zh: 出生
  date: '1546'
  year_of: 1546
  place_zh: 南直隶全椒
  summary_zh: 明嘉靖二十五年诞生后出家弘通禅教
- id: guji-德清-event-meng
  title_zh: 居五台梦升兜率亲见弥勒说唯识
  date: '1575'
  year_of: 1575
  place_zh: 五台山
  summary_zh: 梦中得分别识不分别智依识染依智净之旨因此悟唯识大意
- id: guji-德清-event-tongshuo
  title_zh: 居双径寂照述八识规矩通说
  date: '1615'
  year_of: 1615
  place_zh: 双径寂照
  summary_zh: 应澹居铠公请先会起信百法复据成唯识论以此方文势消归玄奘集窥基解之四十八句颂先提一真法界大纲后分释五六七八四识
- id: guji-德清-event-liuzu
  title_zh: 附解六祖识智颂明转而不转
  date: '1617'
  year_of: 1617
  place_zh: 双径寂照
  summary_zh: 解大圆镜智性清净等颂明五八六七果因转但转名言无实性念念不留情则繁兴永处那伽定
- id: guji-德清-event-death
  title_zh: 示寂
  date: '1623'
  year_of: 1623
  place_zh: 广东曹溪
  summary_zh: 明天启三年示寂世称憨山大师与紫柏齐名中兴明代禅宗
