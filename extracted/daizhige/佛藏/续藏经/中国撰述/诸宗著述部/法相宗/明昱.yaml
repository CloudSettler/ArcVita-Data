  archetype: 法相义学沙门
  dilemmas:
  - 旧注笔授多舛已刻行于世，是沿用旧文还是重加补缉证义
  - 八识颂文精约难记，是略解名相还是广引唯识论文以证成规矩
  lesson: 楷定八识须依瑜伽唯识圣言为证，补阙证明方使行相心所缘性量境各有定数而不杂
  summary_first_person: 我是西蜀辅慈沙门明昱，久研八识规矩，见鲁山泰师补注多引唯识而义有未尽，遂尽取论文释义伦次，于万历己酉端阳造此补注证义于秣陵木末亭
