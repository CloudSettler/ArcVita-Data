endeavors:
- id: guji-mingyu-endeavor-1
  title_zh: 补注证义撰述
  summary: 针对鲁山普泰补注多舛未尽之处，广取引唯识论文证释八识规矩四十八句颂
  phases:
  - key: brewing
    name: 久研斯典
    labels:
      zh:
      - 研读唯识
      - 考订旧注
    start_date: 1600
    highlight_event_id: guji-mingyu-event-study
  - key: breakthrough
    name: 尽取论文为证
    labels:
      zh:
      - 引文证义
      - 伦次释义
    start_date: 1608
    highlight_event_id: guji-mingyu-event-compile
  - key: climax
    name: 秣陵著述告成
    labels:
      zh:
      - 撰述
      - 证义
    start_date: 1609-06-07
    highlight_event_id: guji-mingyu-event-compile
  - key: closure
    name: 序成付刻
    labels:
      zh:
      - 作序
      - 流通
    start_date: 1609-06-07
    highlight_event_id: guji-mingyu-event-compile
  decisions:
  - date: 1608
    title_zh: 不循旧注舛文，别取唯识论文重证
    rationale: 旧注笔授多舛，所引唯识亦有未尽，非重取论文不足以定规矩
  - date: 1609-06-07
    title_zh: 以四十八句颂为纲分章证释
    rationale: 颂统唯识绪而分四章括其猷，依颂证义可使境量性界督纯无杂
- id: guji-mingyu-endeavor-2
  title_zh: 西蜀辅慈弘传法相
  summary: 住持西蜀辅慈，弘宣玄奘护法一系唯识法相，调和性相二宗之诤
  phases:
  - key: brewing
    name: 辅慈学法
    labels:
      zh:
      - 持律
      - 习教
    start_date: 1585
    highlight_event_id: guji-mingyu-event-study
  - key: breakthrough
    name: 会通性相
    labels:
      zh:
      - 讲说
      - 会通
    start_date: 1600
    highlight_event_id: guji-mingyu-event-preach
  - key: climax
    name: 秣陵南游传法
    labels:
      zh:
      - 游方
      - 著述
    start_date: 1609
    highlight_event_id: guji-mingyu-event-compile
  - key: closure
    name: 法席相传
    labels:
      zh:
      - 传承
      - 付嘱
    start_date: 1620
    highlight_event_id: guji-mingyu-event-preach
  decisions:
  - date: 1600
    title_zh: 以中道离边为宗兼弘性相
    rationale: 时移世易性相犁然而云月本同，不欲分河饮水故开万汇凝至真
  - date: 1609
    title_zh: 南游秣陵结茅木末亭撰述
    rationale: 藉江南法席兴盛之地，成书流通以补鲁山刻本之阙
