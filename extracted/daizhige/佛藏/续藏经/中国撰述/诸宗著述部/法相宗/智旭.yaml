person:
  qid: guji-智旭
  name_zh: 智旭
  names:
    zh: 智旭
    en: Ouyi Zhixu
  lifespan:
    birth:
      date: '1599'
      precision: year
      is_circa: false
      raw: 明万历二十七年
    death:
      date: '1655'
      precision: year
      is_circa: false
      raw: 清顺治十二年
  birth_date: '1599'
  death_date: '1655'
  era: 明末清初
  reign_ref: 万历至顺治
  archetype: 高僧学者
  dilemmas:
  - 禅宗空疏与经教繁密之间如何抉择入门
  - 严持戒律与 convenient 接引末法学人之间如何权衡
  - 会通唯识天台华严与归心净土之间如何圆融
  lesson: 以直解化繁为简，以会通破门户之见，终以信愿持名收摄一切教观
  summary_first_person: 吾名智旭，字蕅益，吴江钟氏子，少習儒而辟佛，後因蓮池之書翻然信向，焚儒書而出家，遍究天台華嚴唯識中觀，嚴淨毗尼，晚年住靈峰，融禪教律而歸淨土，願以直解八要接引初機，令相宗大義人人可解
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E6%B3%95%E7%9B%B8%E5%AE%97/%E7%9B%B8%E5%AE%97%E5%85%AB%E8%A6%81%E7%9B%B4%E8%A7%A3.md
