  dilemmas:
  - title_zh: 性相分河如何融通
    description_zh: 时人或执性宗而拨相宗繁琐，或执相宗而疑性宗空疏，须以直解会通二宗不相违背
  - title_zh: 解行宗趣何以归宿
    description_zh: 博通经论之后身心归宿何处，须抉择净土为稳当了生死之径
  lesson: 以教启观以观导行，融通性相，会归净土，令后学解行并进
  summary_first_person: 吾名智旭，号藕益，少读儒书而感无常，阅藏研律而通性相，直解八识规矩以示心识因果，晚年一意归心净土，愿与一切有情同生极乐
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/法相宗/八识规矩直解.html
  - https://cbetaonline.dila.edu.tw/zh/X0895
