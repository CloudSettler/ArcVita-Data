endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 会通唯识直解相宗八要
  summary: 抉擇唯識八種要典，以直解體例疏通名相，並附六離合釋法式略解，令初學易入唯識因明之門
  phases:
  - key: brewing
    name: 少習儒典轉向佛典
    labels:
      zh:
      - 研讀 Lotus 竹窗隨筆自知錄
    start_date: '1617'
    highlight_event_id: guji-智旭-event-ordination
  - key: breakthrough
    name: 遍究性相發心直解
    labels:
      zh:
      - 參究唯識天台華嚴
    start_date: '1630'
    highlight_event_id: guji-智旭-event-commentary
  - key: climax
    name: 撰成八要直解流通
    labels:
      zh:
      - 撰述相宗八要直解
    start_date: '1643'
    highlight_event_id: guji-智旭-event-commentary
  - key: closure
    name: 六離合釋示人法式
    labels:
      zh:
      - 略解六離合釋法式
    start_date: '1647'
    highlight_event_id: guji-智旭-event-commentary
  decisions:
  - date: '1623'
    title_zh: 焚儒書發心出家究佛
    rationale: 以儒闢佛之後深自悔責，讀蓮池書而信佛因果，決意焚棄舊習專究出世法
  - date: '1643'
    title_zh: 以直解體裁解唯識八要
    rationale: 相宗名相繁密初機難入，須捨繁瑣疏鈔而用平直語句直顯大義，故作直解
  - date: '1647'
    title_zh: 先明六離合釋以立解經規矩
    rationale: 若不明依主等六釋，則經論立名莫辨，故先示法式為後文張本
- id: guji-智旭-endeavor-2
  title_zh: 融貫禪教律淨住持靈峰
  summary: 主張禪教律三學一源，晚年專弘淨土，著彌陀要解等，整飭僧制，開末法持名念佛之正路
  phases:
  - key: brewing
    name: 參禪持律遍歷叢林
    labels:
      zh:
      - 參究禪宗嚴持戒律
    start_date: '1625'
    highlight_event_id: guji-智旭-event-ordination
  - key: breakthrough
    name: 閱藏會通性相禪淨
    labels:
      zh:
      - 閱律藏通會各宗
    start_date: '1635'
    highlight_event_id: guji-智旭-event-commentary
  - key: climax
    name: 住靈峰專弘淨土
    labels:
      zh:
      - 靈峰弘化專修淨業
    start_date: '1650'
    highlight_event_id: guji-智旭-event-lingfeng
  - key: closure
    name: 示疾坐化遺囑荼毗
    labels:
      zh:
      - 安然示寂歸於安養
    start_date: '1655'
    highlight_event_id: guji-智旭-event-death
  decisions:
  - date: '1625'
    title_zh: 從雪齡剃度受具足戒
    rationale: 欲紹隆三寶須以内律為本，故決意出家受戒以正僧體
  - date: '1650'
    title_zh: 結茅靈峰歸心西方
    rationale: 見禪病叢生教爭不息，唯信願持名三法最為穩當，故晚年專提淨土以收機
  - date: '1655'
    title_zh: 遺命坐化不立塔銘
    rationale: 為息後人名利之爭，以身示無常，令弟子唯以弘法利生為務
events:
- id: guji-智旭-event-birth
  type: birth
  title_zh: 出生於吳江鍾氏
  date: '1599'
  year_of: 1599
  place_zh: 江蘇吳江
  description: 明萬曆二十七年誕生，俗姓鍾，父持佛號而生，故幼具善根
- id: guji-智旭-event-ordination
  type: career
  title_zh: 焚儒書出家受戒
  date: '1625'
  year_of: 1625
  place_zh: 江蘇吳江
  description: 年二十餘焚棄儒稿，發心出家，從雪齡剃度，字蕅益，號八不道人，遍參知識，嚴持毗尼
- id: guji-智旭-event-commentary
  type: career
  title_zh: 撰相宗八要直解
  date: '1643'
  year_of: 1643
  place_zh: 浙江杭州
  description: 會通唯識八種要典而作直解，並附六離合釋法式略解，以依主等六釋明經論立名之法，後於日本寬文十二年重刊流通
- id: guji-智旭-event-lingfeng
  type: career
  title_zh: 住靈峰弘揚淨土
  date: '1650'
  year_of: 1650
  place_zh: 浙江杭州靈峰寺
  description: 晚年結茅靈峰，著阿彌陀經要解等，倡禪教律合一而歸淨土，整飭僧制，接引四眾念佛
- id: guji-智旭-event-death
  type: death
  title_zh: 坐化於靈峰
  date: '1655'
  year_of: 1655
  place_zh: 浙江杭州靈峰寺
  description: 清順治十二年跏趺而逝，世壽五十七，荼毗後塔於靈峰，與蓮池並稱淨土弘傳之祖
