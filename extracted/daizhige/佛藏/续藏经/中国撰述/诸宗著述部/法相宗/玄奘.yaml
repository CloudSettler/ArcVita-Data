endeavors:
- id: guji-玄奘-endeavor-1
  title_zh: 万里西行求法取经
  description_zh: 自长安出发经西域至中天竺那烂陀学法游历百国负梵本东归
  phases:
  - key: brewing
    name: 长安发愿冒禁西行
    labels:
      zh: 发愿西行
    start_date: 0629-08-01
    highlight_event_id: guji-玄奘-event-xixing
  - key: breakthrough
    name: 穿越大漠抵达天竺
    labels:
      zh: 历险抵竺
    start_date: 0630-01-01
    highlight_event_id: guji-玄奘-event-xixing
  - key: climax
    name: 那烂陀从戒贤受唯识
    labels:
      zh: 就学戒贤
    start_date: 0636-01-01
    highlight_event_id: guji-玄奘-event-qiufa
  - key: closure
    name: 负经六百余部东归长安
    labels:
      zh: 负经东归
    start_date: 0645-01-01
    highlight_event_id: guji-玄奘-event-guilai
  decisions:
  - date: 0629-08-01
    title_zh: 冒禁偷渡出玉门关
    rationale: 中土无究竟瑜伽之本，不入虎穴不得真经，宁就刑戮不违初心。
  - date: 0636-01-01
    title_zh: 师事戒贤专攻瑜伽唯识
    rationale: 非依亲传不能断空有之诤，欲弘法相须得那烂陀正承。
- id: guji-玄奘-endeavor-2
  title_zh: 译经造论开法相宗
  description_zh: 奉诏住大慈恩寺设译场译出大般若瑜伽师地论等并作八识规矩颂开示八识转四智
  phases:
  - key: brewing
    name: 奉诏建译场定规式
    labels:
      zh: 建场定式
    start_date: 0645-02-01
    highlight_event_id: guji-玄奘-event-guilai
  - key: breakthrough
    name: 翻译大般若及瑜伽师地论
    labels:
      zh: 大译群经
    start_date: 0648-01-01
    highlight_event_id: guji-玄奘-event-yijing
  - key: climax
    name: 造八识规矩颂摄唯识纲要
    labels:
      zh: 造颂摄义
    start_date: 0650-01-01
    highlight_event_id: guji-玄奘-event-yijing
  - key: closure
    name: 付嘱弟子慈恩窥基弘传
    labels:
      zh: 付嘱后学
    start_date: 0663-01-01
    highlight_event_id: guji-玄奘-event-yijing
  decisions:
  - date: 0648-01-01
    title_zh: 采用新译直陈梵义重翻旧经
    rationale: 旧译多讹不足以显唯识精微，当以亲闻梵本正名定义。
  - date: 0650-01-01
    title_zh: 作四十八句八识规矩颂
    rationale: 群经浩繁学者难持，以颂摄眼耳身意末那黎耶转识成智之旨，便后学记持修证。
events:
- id: guji-玄奘-event-birth
  title_zh: 诞生洛州缑氏陈家
  date: 0602-04-06
  year_of: 602
  place_zh: 洛州缑氏
  description_zh: 隋仁寿二年生于官宦之家，幼颖悟好佛典，十三岁出家入洛阳净土寺。
- id: guji-玄奘-event-xixing
  title_zh: 贞观三年自长安西行
  date: 0629-08-01
  year_of: 629
  place_zh: 长安至玉门关
  description_zh: 因请西行未允，乘灾荒潜出长安，偷渡五烽，穿越八百里流沙，取道高昌西赴天竺。
- id: guji-玄奘-event-qiufa
  title_zh: 那烂陀从戒贤学法
  date: 0636-01-01
  year_of: 636
  place_zh: 中天竺那烂陀寺
  description_zh: 谒百岁戒贤论师，学瑜伽师地论摄大乘论唯识诸论，兼通声明因明，曲女城大会显扬大乘。
- id: guji-玄奘-event-guilai
  title_zh: 贞观十九年携经还国
  date: 0645-01-25
  year_of: 645
  place_zh: 长安弘福寺
  description_zh: 携梵本六百五十七部经由西域归长安，太宗亲迎，敕住弘福寺大慈恩寺从事翻译。
- id: guji-玄奘-event-yijing
  title_zh: 大慈恩寺译经作八识规矩颂
  date: 0650-01-01
  year_of: 650
  place_zh: 长安大慈恩寺大雁塔
  description_zh: 领译场十九年译出七十五部千三百余卷，摄成唯识论述要义，作八识规矩母颂四十八句分四科明转识成智。
- id: guji-玄奘-event-death
  title_zh: 麟德元年寂于玉华宫
  date: 0664-03-07
  year_of: 664
  place_zh: 凤翔玉华宫肃成院
  description_zh: 译大般若经毕，端坐而逝，敕葬白鹿原，弟子窥基等继弘法相唯识之学。
