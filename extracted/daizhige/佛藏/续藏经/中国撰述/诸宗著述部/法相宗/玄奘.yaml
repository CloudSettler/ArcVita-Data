  name_zh: 玄奘
  names:
    zh: 玄奘
    en: Xuanzang
  lifespan:
    birth:
      date: 0602-04-06
      precision: day
      is_circa: false
      raw: 隋仁寿二年洛州缑氏
    death:
      date: 0664-03-07
      precision: day
      is_circa: false
      raw: 唐麟德元年长安玉华宫
  birth_date: 0602-04-06
  death_date: 0664-03-07
  era: 唐代
  reign_ref: 贞观至麟德
  archetype: 西行求法译经宗师
  dilemmas:
  - 中土经论支离难求真义而西行犯禁生死未卜
  - 佛性法相空有两宗相诤而立唯识中道以会通
  lesson: 弘法当以求真为体以译传为用，转识成智方证菩提。
  summary_first_person: 吾玄奘幼慕释氏，慨中土义疏支离，冒禁西行万里求法，十七年历百余国，归而译经弘扬唯识，作八识规矩之颂以示后学，但愿众生同证唯识性海。
  source_urls:
