  - key: climax
    name: 四方流通声望益隆
    labels:
      zh:
      - 弘化极盛
    start_date: 1598
    highlight_event_id: guji-真可-event-2
  - key: closure
    name: 蒙难圆寂以身殉法
    labels:
      zh:
      - 以身殉法
    start_date: 1603
    highlight_event_id: guji-真可-event-death
  decisions:
  - date: 1589
    title_zh: 倡刻方册藏经
    rationale: 欲使佛典广布初机易得，故不辞艰辛募缘刻造以续慧命
  - date: 1602
    title_zh: 临难不屈守道
    rationale: 妖书事起牵连丛林，宁以身殉法不妄攀他人以护清誉
