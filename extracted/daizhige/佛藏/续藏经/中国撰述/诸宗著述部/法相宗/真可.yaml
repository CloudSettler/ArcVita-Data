    start_date: 1590
    highlight_event_id: guji-真可-event-1
  - key: climax
    name: 撰成规矩解示转智次第
    labels:
      zh:
      - 著述完成
    start_date: 1595
    highlight_event_id: guji-真可-event-1
  - key: closure
    name: 略解总摄流通初机
    labels:
      zh:
      - 流通利生
    start_date: 1598
    highlight_event_id: guji-真可-event-2
  decisions:
  - date: 1590
    title_zh: 以浅解接引蒙孺
    rationale: 相宗名义繁多非妙密难明，故取大略疏解，令初机粗晓纲骨
  - date: 1595
    title_zh: 会通性相禅三学
    rationale: 性通相不通则见未圆满，故主张性相俱通兼达磨禅，方能荷担法道
- id: guji-真可-endeavor-2
  person_qid: guji-真可
  title_zh: 刻藏兴教中兴丛林
  summary_zh: 联合憨山等倡刻方册藏经，复兴禅林弘法利生，后因妖书牵连下狱圆寂，以身殉法
  phases:
  - key: brewing
