  title_zh: 注解八识规矩阐明唯识
  summary_zh: 依玄奘八识规矩颂分释前五第六第七第八识及唯识略解，辨性境带质现量等义，破小乘迷执，明转识成智次第
  phases:
  - key: brewing
    name: 博览性相酝酿注疏
