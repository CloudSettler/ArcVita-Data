endeavors:
- id: guji-行舟-endeavor-1
  title_zh: 注解五识颂明现量转智
  summary: 围绕性境现量通三性至三类分身息苦轮十二句，辨根识缘境合离，示变相观空唯后得，归圆明初发成无漏之旨
  phases:
  - key: brewing
    name: 研读唯识蓄势
    labels:
      zh: 蓄势研读
    start_date: 1680
    highlight_event_id: guji-行舟-event-wushi
  - key: breakthrough
    name: 悟解根识难分
    labels:
      zh: 悟解突破
    start_date: 1685
    highlight_event_id: guji-行舟-event-wushi
  - key: climax
    name: 注成五识颂义
    labels:
      zh: 注述高潮
    start_date: 1690
    highlight_event_id: guji-行舟-event-wushi
  - key: closure
    name: 归结成所作智
    labels:
      zh: 收束圆成
    start_date: 1691
    highlight_event_id: guji-行舟-event-completion
  decisions:
  - date: 1685
    title_zh: 以禅解唯识直指现量
    rationale: 不欲学者堕名相执，故以灵云桃花洞山流水为例，令于五根门头看破根之用处
  - date: 1690
    title_zh: 判变相观空为后得
    rationale: 恐学人以偏空为究竟，故依护法义辨根本后得，令因即该果海
- id: guji-行舟-endeavor-2
  title_zh: 注解六识颂明观察圆明
  summary: 围绕三性三量通三境至观察圆明照大千十二句，析五十一心所引满二业，示初心欢喜至远行纯无漏之道
  phases:
  - key: brewing
    name: 抉择三境蓄势
    labels:
      zh: 蓄势抉择
    start_date: 1690
    highlight_event_id: guji-行舟-event-liushi
  - key: breakthrough
    name: 看破意根卜度
    labels:
      zh: 看破突破
    start_date: 1691
    highlight_event_id: guji-行舟-event-liushi
  - key: climax
    name: 注成六识颂义
    labels:
      zh: 注述高潮
    start_date: 1692
    highlight_event_id: guji-行舟-event-liushi
  - key: closure
    name: 会归妙观察智
    labels:
      zh: 收束会归
    start_date: 1695
    highlight_event_id: guji-行舟-event-completion
  decisions:
  - date: 1691
    title_zh: 详分性境带质独影
    rationale: 为破心境混滥，故辨性境不随心独影唯从见带质通情本，令尘消觉净
  - date: 1692
    title_zh: 示远行地后纯无漏
    rationale: 恐学人执观门对治为圆明，故指俱生法执未破仍是船横野渡，须心花粲发无法不悟
