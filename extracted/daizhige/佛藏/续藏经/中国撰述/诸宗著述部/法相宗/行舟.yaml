  - 因地渐修次第与果上圆证无漏之间如何不落执著
  lesson: 现量初发即是悟门，不被三性三量所转，方能转识成智，分身息苦
  summary_first_person: 吾行舟生逢清世，披览玄奘八识规矩颂，有感五识现量易被尘转，六识分别难出轮回，故发心作注，直指根尘识交芦处，但愿学者于合三离二观尘世中豁然圆明，三类分身以息苦轮耳
