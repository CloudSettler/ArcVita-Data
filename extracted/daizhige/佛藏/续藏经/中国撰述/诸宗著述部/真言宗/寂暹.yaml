person:
  qid: guji-寂暹
  name_zh: 寂暹
  names:
    zh: 寂暹
    en: Juche Jixian
  lifespan:
    birth:
      date: 1640
      precision: year
      is_circa: true
      raw: 生年不详，约明末清初，康熙十四年前已为净业比丘
    death:
      date: 1700
      precision: year
      is_circa: true
      raw: 卒年不详，康熙后圆寂
  birth_date: 1640
  death_date: 1700
  era: 清
  reign_ref: 康熙
  archetype: 真言仪轨纂述高僧
  dilemmas:
  - 密教须五智灌顶绍阿阇黎位方可传授，末世难得金刚阿阇黎，如何权宜立坛而不成盗法
  - 焰口仪轨流传既久枝蔓讹杂，如何稽古考定去华就实以正季世之讹
  lesson: 稽古考定，去华就实，剪除枝蔓，以正讹补阙，普济法界饥虚
  summary_first_person: 吾寂暹，秀州后学，净业比丘，康熙乙卯孟秋熏沐敬书于楞严般若堂，纂此瑜伽焰口注集纂要，愿洞开古詻，饶益有情
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/真言宗/瑜伽焰口注集纂要仪轨.md
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/真言宗/瑜伽焰口注集纂要仪轨.html
endeavors:
- id: guji-寂暹-endeavor-1
  title_zh: 纂集瑜伽焰口注集纂要仪轨
  summary: 会合不空实叉难陀二译及瑜伽集要仪轨，参以大悲空智诸经，作注集纂要
  phases:
  - key: brewing
    name: 稽古考定
    labels:
      zh:
      - 稽古考定
      - 会合注疏
    start_date: 1670
    highlight_event_id: guji-寂暹-event-kaozheng
  - key: climax
    name: 熏沐纂书
    labels:
      zh:
      - 纂要成书
    start_date: 1675
    highlight_event_id: guji-寂暹-event-zhuanshu
  decisions:
  - date: 1675
    title_zh: 以注集纂要体例会通显密
    rationale: 显通大小密唯大乘，须明瑜伽相应义与施食缘起，故详引本经及圆通诸说以正本清源
  - date: 1675
    title_zh: 详注真言手印字种
    rationale: 恐末世疑误不成印契贤圣不喜，故备引法界生字唵啊吽三字及三十七尊种子以导修习
- id: guji-寂暹-endeavor-2
  title_zh: 考正坛仪阿阇黎法以弘施食增益
  summary: 考定莲华部三昧耶手印坛与阿阇黎资格，定戌亥施食时分以利人天幽显
  phases:
  - key: breakthrough
    name: 坛仪考正
    labels:
      zh:
      - 坛仪考正
      - 手印随心坛
    start_date: 1674
    highlight_event_id: guji-寂暹-event-tanyi
  - key: closure
    name: 请正流通
    labels:
      zh:
      - 仝考正较阅
    start_date: 1675
    highlight_event_id: guji-寂暹-event-liutong
  decisions:
  - date: 1675
    title_zh: 权用手印坛代画像曼荼啰
    rationale: 虑末世不能建画像坛亦不得金刚阿阇黎，故权用大轮明王印与转法轮印起首，随心变现以便修习
  - date: 1675
    title_zh: 严定戌亥二时施食
    rationale: 依本教饿鬼得食施主获福，过时徒废精神地方不宁，故特书示以警违越
events:
- id: guji-寂暹-event-birth
  type: birth
  date: 1640
  year_of: 1640
  title_zh: 出生
  description: 约明末清初生于秀州一带，家世不详，后出家为净业比丘，号巨彻
- id: guji-寂暹-event-kaozheng
  type: career
  date: 1674
  year_of: 1674
  title_zh: 会同苕水子若观内衡智铨考正仪轨
  description: 与苕水法师子若净观及称山法师内衡智铨共同考正瑜伽焰口仪轨六则，辨显密瑜伽坛仪阿阇黎观心字种手印诸义
- id: guji-寂暹-event-zhuanshu
  type: career
  date: 1675
  year_of: 1675
  title_zh: 康熙乙卯孟秋纂成注集纂要
  description: 康熙十四年乙卯孟秋自恣前三日，熏沐敬书于楞严般若堂，成瑜伽焰口注集纂要仪轨卷上下，桃村无隐千峰为序
- id: guji-寂暹-event-tanyi
  type: career
  date: 1675
  year_of: 1675
  title_zh: 定莲华部增益三昧耶坛仪
  description: 判定本坛属莲华部遍调伏增益出世悉地，明三昧耶授戒坛义及手印随心坛，示上供求菩提下济度萨埵次第
- id: guji-寂暹-event-liutong
  type: career
  date: 1675
  year_of: 1675
  title_zh: 付梓流通示戌亥施食法
  description: 书示虔恳严洁坛场随力备办香花饮食净水，准戌亥二时施之，饿鬼得食施主获福，以完成佛事同归真际
- id: guji-寂暹-event-death
  type: death
  date: 1700
  year_of: 1700
  title_zh: 圆寂
  description: 康熙后圆寂于江浙一带，具体年月塔铭不详，后人惟以所纂焰口注集传其学
