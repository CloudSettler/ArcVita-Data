    title_zh: 定三密相应持诵次第
    rationale: 使散持与具仪者各随根器得入，或想梵字或缘音声，久不间断即获福进菩提
  - date: 1673-09-09
    title_zh: 明魔障验相应对持戒
    rationale: 恐恃宽而肆情自陷罪戾，故示对治观字与不说境界之义，令有善必进有过必改
events:
- id: guji-尧挺-event-birth
  title_zh: 出生闽中
  date: 1632
  year_of: 1632
  description: 明末生于福建，自称闽中佛弟子施尧挺，信奉真言法门
- id: guji-尧挺-event-compilation
  title_zh: 撰准提心要序
  date: 1672-12-21
  year_of: 1672
  description: 天运壬子岁长至日熏沐拜撰序，明准提佛母以宽摄众之义，阐饮酒食肉有妻子者亦可持诵
- id: guji-尧挺-event-image
  title_zh: 记准提宝像法物
  date: 1673-09-09
  year_of: 1673
  description: 癸丑年记宝像十八臂相好法物，考经忏参酌至当，示观想三密相应与散持口诵之法
- id: guji-尧挺-event-death
  title_zh: 示寂流通
  date: 1700
  year_of: 1700
  description: 清初示寂，藏板存福省南台后洲准提堂，后经僧慧昙校阅刊行流通海外
