endeavors:
- id: guji-法藏-endeavor-1
  title_zh: 参禅彻悟会通五家宗旨
  summary_zh: 以不参禅无以悟入为则彻悟宗旨后深入法门以临济云门手段会通五宗为施食立宗本
  phases:
  - key: brewing
    name: 弱冠受法初机参究
    labels:
      zh:
      - 参禅
      - 初机
    start_date: 1592-01-01
    highlight_event_id: guji-法藏-event-vow
  - key: breakthrough
    name: 深心学戒参禅十稔
    labels:
      zh:
      - 持戒
      - 参禅
    start_date: 1601-01-01
    highlight_event_id: guji-法藏-event-chan
  - key: climax
    name: 彻悟宗旨深入法门
    labels:
      zh:
      - 彻悟
      - 会通五宗
    start_date: 1615-01-01
    highlight_event_id: guji-法藏-event-chan
  - key: closure
    name: 以宗旨印定施食
    labels:
      zh:
      - 以宗印教
      - 相应
    start_date: 1625-01-01
    highlight_event_id: guji-法藏-event-zhigai
  decisions:
  - date: 1601-01-01
    title_zh: 二十九岁深心学戒愿设百堂布施
    rationale: 愿结菩萨缘以布施摄众后因见千灯火现思烦冤之火非观力不可沃灭故愿中止而专力参禅观行
  - date: 1615-01-01
    title_zh: 究五家宗旨以印施食
    rationale: 宗旨一透则无量差别法门皆同旨趣故须以禅宗彻悟返照瑜伽相应之体用
- id: guji-法藏-endeavor-2
  title_zh: 考订施食仪轨著旨概弘传
  summary_zh: 考石机图本辨云栖校正细究观理从体起用详释瑜伽相应次第著旨概并因王昌噪荐父而镂板流通
  phases:
  - key: brewing
    name: 考诸图本辨其得失
    labels:
      zh:
      - 考订
      - 校正
    start_date: 1620-01-01
    highlight_event_id: guji-法藏-event-chan
  - key: breakthrough
    name: 从体起用建立法界观
    labels:
      zh:
      - 法界观
      - 相应
    start_date: 1624-01-01
    highlight_event_id: guji-法藏-event-zhigai
  - key: climax
    name: 笔成旨概劝禅者力行
    labels:
      zh:
      - 著述
      - 力行
    start_date: 1626-01-01
    highlight_event_id: guji-法藏-event-zhigai
  - key: closure
    name: 为荐季和先生如法修设镂板
    labels:
      zh:
      - 修设
      - 流通
    start_date: 1626-02-01
    highlight_event_id: guji-法藏-event-print
  decisions:
  - date: 1624-01-01
    title_zh: 细究观理参合五宗而立说
    rationale: 施食之法迷失宗旨已久竟类俳倡故须辨图本校正而还其三观妙体与瑜伽相应本义
  - date: 1626-02-01
    title_zh: 因王文学昌噪请而镂板广劝
    rationale: 倘人人如法观施则心心相契于九莲华上故以所施忏分镂板以广告真正发菩萨心学者
events:
- id: guji-法藏-event-birth
  title_zh: 出生于无锡苏氏
  date: 1573-01-01
  year_of: 1573
  description_zh: 万历元年诞生俗姓苏后出家号汉月住三峰故称三峰法藏
- id: guji-法藏-event-vow
  title_zh: 弱冠受施食法二十九岁愿设百堂
  date: 1601-01-01
  year_of: 1601
  description_zh: 弱冠于众人中受焰口施食法二十九岁深心学戒愿以百堂布施结菩萨缘偶于座下见千灯火现观者惊散因思烦冤之火非观力可灭故愿中止
- id: guji-法藏-event-chan
  title_zh: 参禅十余稔梦感幽灵群请
  date: 1620-01-01
  year_of: 1620
  description_zh: 参禅十有几稔之后幽灵群起请于梦者不一方忆旧愿未酬乃考石机图本辨云栖校正细究观理参合五宗劝数禅者熟观力行
- id: guji-法藏-event-zhigai
  title_zh: 笔成於密渗施食旨概
  date: 1626-01-01
  year_of: 1626
  description_zh: 论施食本如来大悲作用以身口意三业与所悟之法相应自唵嚂净法界至吽字涌金刚地破狱召六道忏罪施甘露次第广明临济云门手段之宗旨笔成数叶久藏箧中
- id: guji-法藏-event-print
  title_zh: 天启六年正月为季和先生修设镂板
  date: 1626-02-01
  year_of: 1626
  description_zh: 一士王文学昌噪为荐先翁季和先生见旨概欣然求如法修设因以所施忏分镂板以广告真正发心学施食法者自署三峰法藏记
- id: guji-法藏-event-death
  title_zh: 示寂
  date: 1635-01-01
  year_of: 1635
  description_zh: 崇祯八年示寂世寿六十余以会通禅密及施食旨概之学传于后世
