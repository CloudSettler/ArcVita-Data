endeavors:
- id: guji-袾宏-endeavor-1
  title_zh: 较正集要补注坛仪
  summary: 准云栖所行要集较正施食法，补注坛仪以正真言手印观门
  phases:
  - key: brewing
    name: 察流通多种芟增不一名相纠纷
    labels:
      zh: 察乱
    start_date: '1586'
    highlight_event_id: guji-袾宏-event-buzhu
  - key: breakthrough
    name: 准要集而定云栖所行正本
    labels:
      zh: 较正
    start_date: '1595'
    highlight_event_id: guji-袾宏-event-buzhu
  - key: climax
    name: 明三密相应五部集要之义
    labels:
      zh: 立义
    start_date: '1605'
    highlight_event_id: guji-袾宏-event-buzhu
  - key: closure
    name: 成修设瑜伽集要施食坛仪补注
    labels:
      zh: 成书
    start_date: '1610'
    highlight_event_id: guji-袾宏-event-buzhu
  decisions:
  - date: '1595'
    title_zh: 定以云栖要集为准绳
    rationale: 惟本山所行要集得相应正意故芟繁就简直指法体
  - date: '1605'
    title_zh: 兼明三施四食及观音本尊之义
    rationale: 题虽标施食而文兼财法无畏欲令开发本觉转识成智故也
- id: guji-袾宏-endeavor-2
  title_zh: 中兴云栖弘戒弘净
  summary: 居云栖严净毗尼提倡念佛普化僧俗挽末法颓风
  phases:
  - key: brewing
    name: 壮年看破出家修道
    labels:
      zh: 出家
    start_date: '1566'
    highlight_event_id: guji-袾宏-event-chujia
  - key: breakthrough
    name: 卜居云栖恢复道场
    labels:
      zh: 住山
    start_date: '1571'
    highlight_event_id: guji-袾宏-event-zhuchi
  - key: climax
    name: 严持戒律弘扬净土普应群机
    labels:
      zh: 弘化
    start_date: '1585'
    highlight_event_id: guji-袾宏-event-zhuchi
  - key: closure
    name: 化缘既毕示寂云栖
    labels:
      zh: 示寂
    start_date: '1615'
    highlight_event_id: guji-袾宏-event-death
  decisions:
  - date: '1566'
    title_zh: 舍俗出家受具修道
    rationale: 欲炼磨治习转八识成四智速登圣位利益群品故也
  - date: '1571'
    title_zh: 住持云栖以戒为师
    rationale: 见末法藏扬华态故以净戒庄严弘道以念佛普摄三根故也
