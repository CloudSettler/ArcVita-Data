person:
  qid: guji-谢于教
  name_zh: 谢于教
  names:
    zh: 谢于教
    en: Xie Yujiao
  era: 明
  reign_ref: 天启
  archetype: 居士弘法型著述者
  dilemmas:
  - 观行难入与初机难契如何以持诵先导
  - 舍秽取净与圆宗无隔如何会通显密导归极乐
  lesson: 以一字收多字，以持诵引入观行，以普贤行愿导准提归于净业圆修
  summary_first_person: 吾古虔青莲居士谢于教，承塘南先师及近溪先生之教，感梦圆相与梵字因缘，集准提持诵布字观行之法，会普贤愿王以导归极乐，著准提净业三卷以示初机
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%9C%9F%E8%A8%80%E5%AE%97/%E5%87%86%E6%8F%90%E5%87%80%E4%B8%9A.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%9C%9F%E8%A8%80%E5%AE%97/%E5%87%86%E6%8F%90%E5%87%80%E4%B8%9A.html
endeavors:
- id: guji-谢于教-endeavor-1
  title_zh: 编集准提持诵仪轨与梵字布字法
  summary: 访得西域相合梵字，对校梵藏，立月轮圆相九圣布字，定净法界护身六字次第与准提正诵回向仪
  phases:
  - key: brewing
    name: 塘南授教与疑梵字无据
    labels:
      zh: 酝酿
    start_date: 1618-12-22
    highlight_event_id: guji-谢于教-event-1618-dream
  - key: breakthrough
    name: 得德庵僧授梵书月轮
    labels:
      zh: 突破
    start_date: 1619-01-01
    highlight_event_id: guji-谢于教-event-1619-fan字
  - key: climax
    name: 定持诵便览与仪轨次第
    labels:
      zh: 高潮
    start_date: 1623-08-01
    highlight_event_id: guji-谢于教-event-1623-yin
  - key: closure
    name: 重刻准提净业卷一成编
    labels:
      zh: 收束
    start_date: 1623-08-15
    highlight_event_id: guji-谢于教-event-1623-xu
  decisions:
  - date: 1619-01-01
    title_zh: 以梵书立观不用此方文字
    rationale: 梵字有大神力，对梵藏本相合的真，故以九圣梵字安布身心月轮
  - date: 1623-08-01
    title_zh: 先持诵后观行以一字收多字
    rationale: 观行难入多字难观，故以净法界嚂字一字净法界，曲为初机而一多无碍
- id: guji-谢于教-endeavor-2
  title_zh: 会通显密导归普贤净业圆修
  summary: 引普贤行愿品与准提同观，立显密双修观行说与净业圆修说，变娑婆为极乐即极乐为华藏
  phases:
  - key: brewing
    name: 闻贺少龙梦九华衣生天
    labels:
      zh: 酝酿
    start_date: 1618-12-22
    highlight_event_id: guji-谢于教-event-1618-dream
  - key: breakthrough
    name: 得普贤行愿导归之旨
    labels:
      zh: 突破
    start_date: 1619-01-01
    highlight_event_id: guji-谢于教-event-1619-fan字
  - key: climax
    name: 发净业合准提之愿
    labels:
      zh: 高潮
    start_date: 1623-08-01
    highlight_event_id: guji-谢于教-event-1623-yin
  - key: closure
    name: 孟秋作引中元作序阐圆宗
    labels:
      zh: 收束
    start_date: 1623-08-15
    highlight_event_id: guji-谢于教-event-1623-xu
  decisions:
  - date: 1623-08-01
    title_zh: 以净业合准提防忘正指
    rationale: 准提随众希求易忘菩提正指，故以普贤行愿为究竟，发起菩提广大愿
  - date: 1623-08-15
    title_zh: 立显密圆通而重观行
    rationale: 读显密心要取精用宏，故首及布字法而以观行仪轨续课华严般若为归
events:
- id: guji-谢于教-event-birth
  type: birth
  title_zh: 出生古虔
  description: 明代虔州古虔人，自号青莲居士，承塘南先生之教，究心准提与普贤行愿
- id: guji-谢于教-event-death
  type: death
  title_zh: 逝世
  description: 生卒年不详，明末居士，遗有准提净业三卷行世
- id: guji-谢于教-event-1618-dream
  type: endeavor
  date: 1618-12-22
  year_of: 1618
  title_zh: 戊午冬至梦近溪示圆相
  description: 戊午至日梦近溪罗先生示圆图，又梦僧授二签见南字，俄遇德庵僧募造大悲像而善梵咒，能作准提梵字
- id: guji-谢于教-event-1619-fan字
  type: endeavor
  date: 1619-01-01
  year_of: 1619
  title_zh: 得梵字作月轮九圣布画
  description: 因德庵所授西域相合梵字，作月轮圆相安九圣梵字，忆先师塘南命教，以普贤行愿品与准提同观
- id: guji-谢于教-event-1623-yin
  type: endeavor
  date: 1623-08-01
  year_of: 1623
  title_zh: 天启癸亥孟秋作准提净业引
  description: 明言以一字净法界更增净业，以普贤行愿为究竟，帝网妙观显密双融
- id: guji-谢于教-event-1623-xu
  type: endeavor
  date: 1623-08-15
  year_of: 1623
  title_zh: 天启癸亥中元作重刻序
  description: 论混元圆相与万字轮相，述九圣梵字即毗卢法界，变娑婆为极乐，沐手焚香书于古虔
