  birth_date: '1578'
  death_date: '1657'
  era: 明末清初
  reign_ref: 明万历至清顺治
  archetype: 曹洞宗师弘法著述型
  dilemmas:
  - 丛林重疏职而才学兼优者鲜，因袭陈文腐语苟且应酬，我当杜撰补阙还是听其废弛
  - 疏语非佛制非祖制而引群生归佛海时用难废，我当守古朴还是顺时宜以考证明训
  lesson: 事虽细而用实难废，辞虽鄙而意亦可达，当以考证正俗用，以悲愿利群生
  summary_first_person: 我是元贤，号永觉，人称石鼓主人，早年在众常任疏职，苦无旧可因，率多杜撰应酬，积三十余年成帙，后住持鼓山，大弘曹洞宗风，集为禅林疏语考证，考典故以达情表事
