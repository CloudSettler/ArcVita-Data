endeavors:
- id: guji-元贤-endeavor-1
  title_zh: 在众任疏积稿成帙
  summary_zh: 早年在众每任疏职，无旧可因，多自杜撰应酬，积久成帙，流传三十余年
  phases:
  - key: brewing
    name: 在众任疏职
    labels:
      zh:
      - 丛林书记
      - 疏语应酬
    start_date: '1598'
    highlight_event_id: guji-元贤-event-renshu
  - key: breakthrough
    name: 杜撰积为成帙
    labels:
      zh:
      - 积稿成帙
    start_date: '1615'
    highlight_event_id: guji-元贤-event-jigao
  decisions:
  - date: '1615'
    title_zh: 率多杜撰以应时需
    rationale: 丛林疏用难废而旧本无可因，宁自撰鄙辞以达意，不使表事陈情阙如
  - date: '1620'
    title_zh: 存稿不废听人传抄
    rationale: 好事者珍重抄录流传，念其虽细事亦可利后学，故不弃置
- id: guji-元贤-endeavor-2
  title_zh: 住持鼓山集疏语考证流通
  summary_zh: 住持鼓山涌泉寺弘法著述，考疏语典故出处，集为禅林疏语考证四卷，命武林泉南镂板流通
  phases:
  - key: brewing
    name: 住持鼓山弘化
    labels:
      zh:
      - 住持弘法
    start_date: '1634'
    highlight_event_id: guji-元贤-event-zhuchi
  - key: climax
    name: 集考证付镂板
    labels:
      zh:
      - 著述考证
      - 刊刻流通
    start_date: '1650'
    highlight_event_id: guji-元贤-event-kanxing
  - key: closure
    name: 题小引以明流通意
    labels:
      zh:
      - 题引付后
    start_date: '1653'
    highlight_event_id: guji-元贤-event-kanxing
  decisions:
  - date: '1650'
    title_zh: 考典故以证疏语
    rationale: 唐宋特重疏职，入明鲜堪任者，故引经史佛藏考圣节祝厘诸目，使鄙辞有据
  - date: '1653'
    title_zh: 许武林泉南镂板流通
    rationale: 俞时笃请刊于武林，泉南善友继之，念大丛林奇杰可不用而小刹难废，故漫题数语付刊
events:
- id: guji-元贤-event-birth
  title_zh: 出生
  date: '1578'
  year_of: 1578
  description_zh: 明万历六年出生于建阳，后出家，号永觉，人称石鼓主人
- id: guji-元贤-event-renshu
  title_zh: 在众常任疏职
  date: '1598'
  year_of: 1598
  description_zh: 昔在众日每任疏职，苦于无旧可因，率多自撰应酬
- id: guji-元贤-event-jigao
  title_zh: 积疏稿成帙传抄
  date: '1615'
  year_of: 1615
  description_zh: 杜撰积久不觉成帙，好事者珍重抄录以传，盖三十余年
- id: guji-元贤-event-zhuchi
  title_zh: 住持鼓山涌泉寺弘法
  date: '1634'
  year_of: 1634
  description_zh: 住持福州鼓山涌泉寺，大振曹洞宗风，著述宏富，门徒众多
- id: guji-元贤-event-kanxing
  title_zh: 集禅林疏语考证付刊
  date: '1653'
  year_of: 1653
  description_zh: 集平生疏稿，考证典故，分典门修因门弭灾门祈恩门荐悼门及附录为四卷，俞时笃镂板武林，泉南继刊，题小引于卷首
- id: guji-元贤-event-death
  title_zh: 示寂
  date: '1657'
  year_of: 1657
  description_zh: 清顺治十四年示寂，世寿八十，弘法著述之功为后世丛林所重
