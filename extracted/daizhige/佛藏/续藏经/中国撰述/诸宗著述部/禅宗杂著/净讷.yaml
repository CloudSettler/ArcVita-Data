    title_zh: 断取重离为喻不谈易理
    rationale: 云岩专取奇偶爻相喻偏正回互若浪谈易理则以喻为法故断章取义即事显理
  - date: 1690-03-01
    title_zh: 指斥觉范变卦配法遗害千古
    rationale: 觉范非理变卦配法违戾儒佛滥觞后学故虽涉先德亦须痛辨以存正脉
- id: guji-净讷-endeavor-2
