endeavors:
- id: guji-博山元来-endeavor-1
  title_zh: 真参苦究求彻悟
  summary: 自云栖受戒发破生死心，插香自誓，结疑情于眉睫，看船子没踪迹句放下布袋，复见宝方知非惭愧，得不肯二字进步
  phases:
  - key: brewing
    name: 受戒发破生死心
    labels:
      zh: 破生死心
    start_date: 1575
    highlight_event_id: guji-博山元来-event-birth
  - key: breakthrough
    name: 云栖受戒办己事
    labels:
      zh: 办己事
    start_date: 1595
    highlight_event_id: guji-博山元来-event-ordination
  - key: climax
    name: 没踪迹句有省发
    labels:
      zh: 疑情顿发
    start_date: 1605
    highlight_event_id: guji-博山元来-event-awakening
  - key: closure
    name: 见宝方得不肯印可
    labels:
      zh: 融豁印可
    start_date: 1607
    highlight_event_id: guji-博山元来-event-awakening
  decisions:
  - date: 1605
    title_zh: 不以轻安省发便为悟
    rationale: 虽放下千斤担子自谓大悟，见宝方如方木逗圆孔，方具惭愧，悟后必见大善知识乃了
  - date: 1607
    title_zh: 不向举起处承当只起疑情
    rationale: 得宝方空拶空有追有偈及不肯二字，不作道理会，不求人说破，硬硬参去逼拶令悟
- id: guji-博山元来-endeavor-2
  title_zh: 住博山示禅病警众
  summary: 住博山能仁寺，以伽陀遍疗狂狷业病，示初心做工夫，评古德垂示，示疑情发起，门人成正集为参禅警语
  phases:
  - key: brewing
    name: 住山融通肯綮
    labels:
      zh: 住山
    start_date: 1608
    highlight_event_id: guji-博山元来-event-awakening
  - key: breakthrough
    name: 痛示禅病五章
    labels:
      zh: 示禅病
    start_date: 1611
    highlight_event_id: guji-博山元来-event-compilation
  - key: climax
    name: 开示做工夫吃紧
    labels:
      zh: 做工夫
    start_date: 1615
    highlight_event_id: guji-博山元来-event-compilation
  - key: closure
    name: 警语流通愈人
    labels:
      zh: 流通
    start_date: 1630
    highlight_event_id: guji-博山元来-event-death
  decisions:
  - date: 1611
    title_zh: 以病为药示禅病警语
    rationale: 识病乃能去病，禅病即法身之病，直捷简当把参禅骨髓中病说透，使疑情发不起处发起
  - date: 1612
    title_zh: 不避喧向寂境缘上做去
    rationale: 不在古人公案上卜度，不耽静境枯寂，不作无事会，要在动境中话头现前紧正绵密融豁
events:
- id: guji-博山元来-event-birth
  title_zh: 出生
  date: 1575
  year_of: 1575
  summary: 明万历三年生，宿具破生死之志，后为博山嗣法高僧
- id: guji-博山元来-event-ordination
  title_zh: 云栖受戒出家
  date: 1595
  year_of: 1595
  summary: 从云栖受戒出家，发坚硬破生死心，视世界身心悉是假缘，作敲门瓦子直奔
- id: guji-博山元来-event-awakening
  title_zh: 看没踪迹句有省见宝方
  date: 1605
  year_of: 1605
  summary: 看船子和尚没踪迹句，阅传灯赵州三千里外逢人语打失布袋，逮见宝方慧经知方木逗圆孔，具惭愧得不肯二字受用
- id: guji-博山元来-event-compilation
  title_zh: 参禅警语集成作序
  date: 1611
  year_of: 1611
  summary: 首座成正集示初心做工夫评古德垂示等篇为博山参禅警语，信州弟子刘崇庆于万历辛亥孟秋作序
- id: guji-博山元来-event-death
  title_zh: 示寂
  date: 1630
  year_of: 1630
  summary: 明崇祯三年示寂，留参禅警语为末世舟杭，使祖师命脉流通
