endeavors:
- id: guji-圆澄-endeavor-1
  title_zh: 著慨古录以慨末法
  summary: 感陵夷而叹三武之祸将起假无名叟问答以溯付法源流而痛斥今之绝口不提授受之事
  phases:
  - key: brewing
    name: 慨叹丛林规废
    labels:
      zh: 酿成
    start_date: 1600-01-01
    highlight_event_id: guji-圆澄-event-1
  - key: breakthrough
    name: 假托问答立论
    labels:
      zh: 突破
    start_date: 1607-07-15
    highlight_event_id: guji-圆澄-event-1
  - key: climax
    name: 痛陈授受断绝
    labels:
      zh: 高潮
    start_date: 1607-07-15
    highlight_event_id: guji-圆澄-event-1
  - key: closure
    name: 付梓以警后学
    labels:
      zh: 收束
    start_date: 1608-01-01
    highlight_event_id: guji-圆澄-event-1
  decisions:
  - date: 1607-07-15
    title_zh: 以无名叟自号作问答体
    rationale: 去古日远直斥时弊易招讥嫌故托二三子问答以畅其说
  - date: 1608-01-01
    title_zh: 详述远公忍辱事以明逆行
    rationale: 今人疑惮呵骂故举叶县省远公泼水撒灰逐出而不动之事以显砥石利器之理
- id: guji-圆澄-endeavor-2
  title_zh: 陈四制以图复兴
  summary: 主张定官制择住持考试度制游行以清滥漫而辨贤愚使贤者竞慕其荣钝者生胜渴仰
  phases:
  - key: brewing
    name: 观察度牒纳银之弊
    labels:
      zh: 酿成
    start_date: 1605-01-01
    highlight_event_id: guji-圆澄-event-2
  - key: breakthrough
    name: 提出官制住持之议
    labels:
      zh: 突破
    start_date: 1607-07-15
    highlight_event_id: guji-圆澄-event-2
  - key: climax
    name: 详定考试游行之法
    labels:
      zh: 高潮
    start_date: 1607-07-15
    highlight_event_id: guji-圆澄-event-2
  - key: closure
    name: 申珠玉稀有之喻
    labels:
      zh: 收束
    start_date: 1608-01-01
    highlight_event_id: guji-圆澄-event-2
  decisions:
  - date: 1607-07-15
    title_zh: 立十夏考试给牒之限
    rationale: 朝方出家暮可为僧则贤愚不分故以经律论三学次第试之以辨玉石
  - date: 1607-07-15
    title_zh: 立执照度牒稽查游行之法
    rationale: 负罪逃匿混于行脚故令千里外批执照千里内凭牒登簿以杜私行
events:
- id: guji-圆澄-event-birth
  date: 1560-01-01
  year_of: 1560
  title_zh: 圆澄诞生
  description: 明嘉靖末万历初前后生于江南具利根而慕宗乘
- id: guji-圆澄-event-1
  date: 1607-07-15
  year_of: 1607
  title_zh: 丁未季夏作慨古录
  description: 自号无名叟于丁未季夏之望喟然叹丛林之规扫地作问答以溯迦叶至达磨授受之重
- id: guji-圆澄-event-2
  date: 1607-07-15
  year_of: 1607
  title_zh: 提出定官制等四条
  description: 陈定官制择住持考试度制游行四事请以道德者主僧录司以试经给牒以执照稽游行
- id: guji-圆澄-event-death
  date: 1626-01-01
  year_of: 1626
  title_zh: 圆澄示寂
  description: 明天启前后示寂于江南其慨古之叹流传续藏以警末世
