  archetype: 缚律为禅之丛林立法者
  dilemmas:
  - 古规简古与今俗繁杂之间如何沿革损益以折中人情
  - 未身行则不敢传学与救极坏不得不辑之间的自愧与勤苦
  lesson: 沿革损益以趋时，备而不用，守律所以护禅
  summary_first_person: 吾壹咸，庐山东林比丘，自至元戊寅依石林于南屏得抄本发心，询耆旧证编简，历承天雪窦双径天宁永福东林，躬行而后成禅林备用清规十卷，期拯极坏而存纲常
