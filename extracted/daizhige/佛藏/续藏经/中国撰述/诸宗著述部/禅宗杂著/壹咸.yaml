endeavors:
- id: guji-壹咸-endeavor-1
  title_zh: 编集禅林备用清规十卷
  summary_zh: 询耆旧证编简，门分类聚，厘为十卷，以祝圣冠首，备极坏之用
  phases:
  - key: brewing
    name: 南屏见闻发心
    labels:
      zh: 南屏得本
    start_date: 1278
    highlight_event_id: guji-壹咸-event-1278-nanping
  - key: breakthrough
    name: 承天定卷目规模
    labels:
      zh: 承天定篇
    start_date: 1282
    highlight_event_id: guji-壹咸-event-1282-chengtian
  - key: climax
    name: 雪窦溪西校正详舛
    labels:
      zh: 雪窦校正
    start_date: 1286
    highlight_event_id: guji-壹咸-event-1286-xuedou
  - key: closure
    name: 东林书成自序
    labels:
      zh: 东林书成
    start_date: 1311
    highlight_event_id: guji-壹咸-event-1311-shucheng
  decisions:
  - date: 1278
    title_zh: 究心访问编集成帙
    rationale: 见大川笑翁遗风将泯，得友云明西堂抄本，恐轨则失传故发心辑集
  - date: 1282
    title_zh: 以祝圣如来降诞冠前门分类聚
    rationale: 朝夕扣问觉庵先师，定祝圣为首以报水土，余门分类聚厘为十卷
- id: guji-壹咸-endeavor-2
  title_zh: 历住诸刹躬行清规
  summary_zh: 自双径首众至天宁永福东林，力行座次茶汤礼式，守师说清严峻整
  phases:
  - key: brewing
    name: 双径首众试行座次
    labels:
      zh: 双径试行
    start_date: 1292
    highlight_event_id: guji-壹咸-event-1292-shuangjing
  - key: breakthrough
    name: 天宁备员行之无易
    labels:
      zh: 天宁莅众
    start_date: 1295
    highlight_event_id: guji-壹咸-event-1295-tianning
  - key: climax
    name: 永福东林皆行无易
    labels:
      zh: 永福东林
    start_date: 1300
    highlight_event_id: guji-壹咸-event-1300-yongfu
  - key: closure
    name: 备而不用垂训后学
    labels:
      zh: 备不用训
    start_date: 1311
    highlight_event_id: guji-壹咸-event-1311-shucheng
  decisions:
  - date: 1292
    title_zh: 定小座汤位次请云峰力行
    rationale: 诸方废小座汤位次之争而不举，定西堂首座都寺后堂等次以止哗
  - date: 1295
    title_zh: 缚律为禅守师说不从人
    rationale: 世薄俗侈奇邪充满，以清严峻整讲道不辍，未身行者不敢轻传故历住躬行
events:
- id: guji-壹咸-event-birth
  title_zh: 出生
  date: 1250
  year_of: 1250
  place_zh: 未详
  description_zh: 约至元以前生，泽山一脉，后为禅林比丘，守律为禅
- id: guji-壹咸-event-1278-nanping
  title_zh: 南屏依石林见遗风得抄本
  date: 1278
  year_of: 1278
  place_zh: 南屏
  description_zh: 至元戊寅依石林和尚于南屏，犹见大川笑翁遗风，得友云明西堂所藏抄本，究心访问编集成帙
- id: guji-壹咸-event-1282-chengtian
  title_zh: 承天依觉庵定十卷规模
  date: 1282
  year_of: 1282
  place_zh: 承天
  description_zh: 壬午依觉庵先师于承天，朝夕扣问，以祝圣如来降诞二仪冠前，余门分类聚厘为十卷
- id: guji-壹咸-event-1286-xuedou
  title_zh: 雪窦溪西论详正舛
  date: 1286
  year_of: 1286
  place_zh: 雪窦
  description_zh: 丙戌夏留雪窦与千峰琬西堂论其详，丁亥春得溪西泽和尚正其舛，见闻益稔
- id: guji-壹咸-event-1292-shuangjing
  title_zh: 双径首众力行小座汤位次
  date: 1292
  year_of: 1292
  place_zh: 双径
  description_zh: 壬辰夏首众双径，定西堂一出首座再出都寺三出后堂四出等位，请于云峰伯父力行，讫事无敢哗
- id: guji-壹咸-event-1295-tianning
  title_zh: 备员永嘉天宁行清规
  date: 1295
  year_of: 1295
  place_zh: 永嘉天宁
  description_zh: 元贞乙未备员永嘉天宁，大德庚子补番易永福，乙巳主庐山东林，皆行之无易
- id: guji-壹咸-event-1300-yongfu
  title_zh: 补永福主东林躬行不替
  date: 1300
  year_of: 1300
  place_zh: 番易永福
  description_zh: 补番易永福及主庐山东林太平兴龙，守清严峻整，讲道不辍，以身行验所编之规
- id: guji-壹咸-event-1311-shucheng
  title_zh: 庐山东林书成自序
  date: 1311
  year_of: 1311
  place_zh: 庐山东林
  description_zh: 至大辛亥秋书自序于庐山东林，名曰禅林备用清规，谓备而不用，知我罪我其惟春秋，袁桷泰定二年为叙
- id: guji-壹咸-event-death
  title_zh: 示寂
  date: 1320
  year_of: 1320
  place_zh: 未详
  description_zh: 其死尤奇伟，清严峻整之行终，以缮性理内之效闻于时
