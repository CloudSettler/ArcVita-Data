person:
  qid: guji-大韶
  name_zh: 大韶
  names:
    zh: 大韶
    en: Dashao
  lifespan:
    birth:
      date: 1580-01-01
      precision: year
      is_circa: true
      raw: 明万历年间前后
    death:
      date: 1650-01-01
      precision: year
      is_circa: true
      raw: 明末清初前后
  birth_date: 1580-01-01
  death_date: 1650-01-01
  era: 明
  reign_ref: 明末
  archetype: 禅宗著述高僧
  dilemmas:
  - 禅教分宗互相诋呰与会归一心之间如何抉择
  - 纸墨文字死句与活泼泼地见性活句之间如何透脱
  - 随文逐义穿凿名相与直指千劫以前本来面目之间如何示人
  lesson: 教从心流，心为说教之主，十二分教皆表显之说，须从自己胸襟流出，读其活句而不滞死句，方能安身立命。
  summary_first_person: 吾明代沙门大韶，栖心千松，观释迦四十九年未曾说一字，一片圆融无碍清净心为辩才，痛近世禅教分作两家互相诋呰，遂著千松笔记与楞严击节，直餐梵响，点出如来舌端活句，欲令人不食人糟粕，悬崖撒手，直下会取父母未生以前一段光明。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E6%9D%82%E8%91%97/%E5%8D%83%E6%9D%BE%E7%AC%94%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E6%9D%82%E8%91%97/%E5%8D%83%E6%9D%BE%E7%AC%94%E8%AE%B0.md
