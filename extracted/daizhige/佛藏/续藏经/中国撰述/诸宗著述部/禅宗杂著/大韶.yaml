      - 酝酿
      - 观心
    start_date: 1600-01-01
    highlight_event_id: guji-大韶-event-study
  - key: breakthrough
    name: 悟教皆活句突破
    labels:
      zh:
      - 突破
      - 活句
    start_date: 1615-01-01
    highlight_event_id: guji-大韶-event-qiansong
  - key: climax
    name: 千松笔记成书高峰
    labels:
      zh:
      - 高峰
      - 著述
    start_date: 1625-01-01
    highlight_event_id: guji-大韶-event-qiansong
  - key: closure
    name: 示本体收束流通
    labels:
      zh:
      - 收束
      - 流通
    start_date: 1630-01-01
    highlight_event_id: guji-大韶-event-teach
  decisions:
  - date: 1615-01-01
    title_zh: 不食人糟粕自吐胸襟
    rationale: 具眼者不检人涕吐，须从自己胸襟流出应世，踏翻圣贤窠臼，方成解脱道人
  - date: 1625-01-01
    title_zh: 以一心摄十二分教
    rationale: 教为表显，心为说教之主，海水一味，万法归一心，不于说字上更下注脚
- id: guji-大韶-endeavor-2
  title_zh: 著楞严击节接引参学
  goal: 令参学之士真参实悟，透楞严大定，复真元未散之果体
  phases:
  - key: brewing
    name: 痛参学吃野狐涎唾
    labels:
      zh:
      - 酝酿
      - 参学
    start_date: 1620-01-01
    highlight_event_id: guji-大韶-event-study
  - key: breakthrough
    name: 点出大佛顶果体
    labels:
      zh:
      - 突破
      - 楞严
    start_date: 1628-01-01
    highlight_event_id: guji-大韶-event-lengyan
  - key: climax
    name: 发明妙奢摩三摩禅那
    labels:
      zh:
      - 高峰
      - 妙观
    start_date: 1632-01-01
    highlight_event_id: guji-大韶-event-lengyan
  - key: closure
    name: 门人智睿录文付嘱
    labels:
      zh:
      - 收束
      - 付嘱
    start_date: 1640-01-01
    highlight_event_id: guji-大韶-event-teach
  decisions:
  - date: 1628-01-01
    title_zh: 翦截浮辞恢弘至道
    rationale: 须彻底掀翻自得，不就人吻角吃野狐涎唾，举其闳纲得其真趣，莫寻枝叶
  - date: 1640-01-01
    title_zh: 令门人录楞严击节流通
    rationale: 为续众生慧命，发明最初方便，融世出世法为一团，普令复真元证涅槃
events:
- id: guji-大韶-event-birth
  type: birth
  title_zh: 大韶出生
  date: 1580-01-01
  year_of: 1580
  location: 中国
  description: 明万历年间前后，大韶出生，后出家为沙门，栖心禅教。
- id: guji-大韶-event-study
  type: study
  title_zh: 参究教观悟禅教一源
  date: 1605-01-01
  year_of: 1605
  location: 中国
  description: 观如来千古雄文即千古之心，研十二分教、法华华严楞严及临济洞山岩头鼓山诸家语，悟教从心流，心言非两法。
  endeavor_refs:
  - guji-大韶-endeavor-1
  - guji-大韶-endeavor-2
- id: guji-大韶-event-qiansong
  type: composition
  title_zh: 撰成千松笔记并作序
  date: 1625-01-01
  year_of: 1625
  location: 中国
  description: 著千松笔记，作序发明释迦四十九年一片圆融无碍心为辩才，论禅宗合论，引懒庵岩头鼓山洞山临济永明之语，斥禅教分家，显事事无碍。
  endeavor_refs:
  - guji-大韶-endeavor-1
- id: guji-大韶-event-lengyan
  type: composition
  title_zh: 著楞严击节解大佛顶妙义
  date: 1632-01-01
  year_of: 1632
  location: 中国
  description: 著楞严击节，释大佛顶为诸佛果体，发明妙奢摩它三摩禅那为真元未散之体，示最初方便融世出世法，救识侵圣隐之弊。
  endeavor_refs:
  - guji-大韶-endeavor-2
- id: guji-大韶-event-teach
  type: teaching
  title_zh: 示众弘法门人智睿录文
  date: 1640-01-01
  year_of: 1640
  location: 中国
  description: 接引参学，诫就人吻角吃野狐涎唾，须真参实悟从胸中呕出，门人智睿随侍记录楞严击节等语流通后世。
  endeavor_refs:
  - guji-大韶-endeavor-1
  - guji-大韶-endeavor-2
- id: guji-大韶-event-death
  type: death
  title_zh: 大韶示寂
  date: 1650-01-01
  year_of: 1650
  location: 中国
  description: 明末清初前后，大韶示寂，遗千松笔记一卷入续藏经禅宗杂著部，后学赖以窥心佛之宗。
