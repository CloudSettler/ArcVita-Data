endeavors:
- id: guji-天頙-endeavor-1
  title_zh: 编纂禅门宝藏录立三门以辨禅教
  summary: 感禅教混滥毁谤并起乃集经录语录古德重言分上中下三卷以明禅教对辨诸讲归伏君臣崇信
  phases:
  - key: brewing
    name: 发心蒐集古重言
    labels:
      zh: 立志护宗
    start_date: 1285
    highlight_event_id: guji-天頙-event-collect
  - key: breakthrough
    name: 定三门纲目体例
    labels:
      zh: 纲目初定
    start_date: 1290
    highlight_event_id: guji-天頙-event-collect
  - key: climax
    name: 成书并作序流通
    labels:
      zh: 宝藏告成
    start_date: 1293-11-01
    highlight_event_id: guji-天頙-event-preface
  - key: closure
    name: 分卷刻布海东
    labels:
      zh: 流通后世
    start_date: 1294
    highlight_event_id: guji-天頙-event-preface
  decisions:
  - date: 1290
    title_zh: 以三门质禅教是非
    rationale: 以混滥毁谤流通为三大病故立禅教对辨诸讲归伏君臣崇信以对治之
  - date: 1293-11-01
    title_zh: 但引古重言不立臆说
    rationale: 非臆说则人信之故皆引经传语录以取信于禅讲君臣
- id: guji-天頙-endeavor-2
  title_zh: 住持弘禅调和诸宗以护正法
  summary: 以内愿堂真静大禅师之位接引讲肆学徒及护法君臣会教归禅显教外别传之旨
  phases:
  - key: brewing
    name: 早年出家参学禅教
    labels:
      zh: 兼通经论
    start_date: 1245
    highlight_event_id: guji-天頙-event-birth
  - key: breakthrough
    name: 升座内愿堂弘化
    labels:
      zh: 宗席渐盛
    start_date: 1275
    highlight_event_id: guji-天頙-event-collect
  - key: climax
    name: 以禅门宝藏化导讲主
    labels:
      zh: 讲众归伏
    start_date: 1293-11-01
    highlight_event_id: guji-天頙-event-preface
  - key: closure
    name: 付嘱后学护持宝藏
    labels:
      zh: 法脉绵续
    start_date: 1298
    highlight_event_id: guji-天頙-event-death
  decisions:
  - date: 1275
    title_zh: 直指人心兼引教海
    rationale: 欲破职教者面青眼白之疑故不废教而显禅为教之心髓
  - date: 1293-11-01
    title_zh: 以君臣崇信为流通归宿
    rationale: 佛法流通系于护法故下卷集君臣崇信三十九则以劝护持
