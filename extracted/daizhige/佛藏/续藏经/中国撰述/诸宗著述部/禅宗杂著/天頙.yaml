  date: 1293-11-01
  year_of: 1293
  description: 以海东沙门内愿堂真静大禅师名义作序明作书本意谓皆古重言非臆说目之为禅门宝藏
- id: guji-天頙-event-death
  title_zh: 约元成宗朝示寂
  date: 1300
  year_of: 1300
  description: 宝藏流通后住持弘化不久示寂后学传持其书于海东禅林
