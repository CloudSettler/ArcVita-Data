    title_zh: 從澄觀學華嚴以教證禪
    rationale: 禪門內照非言可宣須借教理衡鏡定是非以顯靈知不昧之體
  - date: 0835
    title_zh: 堅持頓悟無念為宗兼修萬行
    rationale: 悟雖頓而習未盡須以無念統萬行令悲智增明罪業斷除方名無修之修
