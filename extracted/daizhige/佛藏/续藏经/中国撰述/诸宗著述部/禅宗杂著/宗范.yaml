  date: 1800-01-01
  year_of: 1800
  type: career
  title_zh: 浮沈参学
  description_zh: 浮沈卅五年历参诸开士受钳锤广搜佛祖宗教理究心无梦想时主人公得管窥一隙
- id: guji-宗范-event-awaken
  date: 1830-01-01
  year_of: 1830
  type: career
  title_zh: 彻参印可
  description_zh: 以炮声邻家放炮等落草勘验究明无梦主百日绝后苏体会入微发悟心有抓着痒筋处
- id: guji-宗范-event-compile
  date: 1835-12-15
  year_of: 1835
  type: career
  title_zh: 编成宗范
  description_zh: 于道光乙未成宗范卷上下分十章诺庵盘谈作序揭化机变通之理以死后生前体若何为偈证明
- id: guji-宗范-event-fusion
  date: 1836-01-01
  year_of: 1836
  type: career
  title_zh: 贯教归净
  description_zh: 明禅宗顿圆台宗妙圆倡悟后兼融台宗末后归重持名劝同参上士以弥陀消归秘密藏
- id: guji-宗范-event-death
  date: 1845-12-01
  year_of: 1845
  type: death
  title_zh: 示寂
  description_zh: 自愧见浅习厚忽忽死将至后至光绪丙戌李宗邺杨仁山等重刻宗范于吴中流通
