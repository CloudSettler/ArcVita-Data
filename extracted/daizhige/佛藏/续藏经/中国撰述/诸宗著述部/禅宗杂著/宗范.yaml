  dilemmas:
  - title_zh: 言句与机用之抉择
    description_zh: 痛感末流擎拳竖指模棱揣窃故舍机锋炫奇而取话头参究以策鲁钝
  - title_zh: 禅悟与教贯之抉择
    description_zh: 既得正悟恐风停波涌理现念侵故兼融台宗妙圆并归重弥陀持名以全自利利他
  lesson: 穷则变变则通必依明眼印证藉无梦主人公话头彻参熏修再以般若贯教归净方能自利利他不落空解
  summary_first_person: 我依当代匠究心无梦主百日绝后苏复历参诸开士浮沈卅五年忽忽死将至因缉宗范十章自禅源以至贯教愿见者依行发悟既悟之后借一句弥陀消归秘密同生莲邦
