  - key: climax
    name: 缉编成帙
    labels:
      zh: 编纂成书
    start_date: 1835-12-01
    highlight_event_id: guji-宗范-event-compile
  - key: closure
    name: 流通付嘱
    labels:
      zh: 流通嘱累
    start_date: 1836-01-01
    highlight_event_id: guji-宗范-event-compile
  decisions:
  - date: 1830-01-01
    title_zh: 独指妙心为禅源
    rationale: 佛法东流泥经语不探心源故以达摩别传妙心及楞伽自觉圣智摩诃般若为源以定宗旨
  - date: 1835-12-01
    title_zh: 分十章叙秩井然
    rationale: 自参学以竟离垢自利利他贯穿故首禅源继彻参调习入圣勖利人别显喻机用受纲宗广示辩终贯教
- id: guji-宗范-endeavor-2
  title_zh: 提唱无梦主人公兼归念佛
  description_zh: 专提无梦想时主人公话头塞断意根导人入门复融会台宗妙圆末后归重持名以免一悟便休再落圈缋
  phases:
  - key: brewing
    name: 勘验落草
    labels:
      zh: 勘验学人
    start_date: 1825-01-01
    highlight_event_id: guji-宗范-event-awaken
  - key: breakthrough
    name: 单提话头
    labels:
      zh: 单提话头
    start_date: 1830-01-01
    highlight_event_id: guji-宗范-event-awaken
  - key: climax
    name: 融台归净
    labels:
      zh: 贯教归净
    start_date: 1835-12-01
    highlight_event_id: guji-宗范-event-fusion
  - key: closure
    name: 普愿流通
    labels:
      zh: 普劝流通
    start_date: 1836-01-01
    highlight_event_id: guji-宗范-event-fusion
  decisions:
  - date: 1830-01-01
    title_zh: 专提无梦无想主
    rationale: 从朝至寝明了意识主事易杂昭灵窠臼故以父母未生前死了烧了何处相见等语塞断意根令疑情得起
  - date: 1835-12-01
    title_zh: 禅顿圆兼台妙圆归弥陀
    rationale: 悟后气习难净风停波涌故取永明角虎之喻劝既悟正好借一句弥陀消归秘密上品上升不负接引苦心
events:
- id: guji-宗范-event-birth
  date: 1780-01-01
  year_of: 1780
  type: birth
  title_zh: 降生
  description_zh: 约生于清乾隆末为菩萨戒弟子自称钱伊庵
