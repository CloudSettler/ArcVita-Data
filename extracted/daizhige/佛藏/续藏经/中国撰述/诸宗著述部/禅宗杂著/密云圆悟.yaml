person:
  qid: guji-密云圆悟
  name_zh: 密云圆悟
  names:
    zh: 密云圆悟
    en: Miyun Yuanwu
  lifespan:
    birth:
      date: '1566'
      precision: year
      is_circa: false
      raw: 明嘉靖四十五年生
    death:
      date: '1642'
      precision: year
      is_circa: false
      raw: 明崇祯十五年寂
  birth_date: '1566'
  death_date: '1642'
  era: 明末
  reign_ref: 崇祯
  archetype: 护法卫道弘禅者
  dilemmas:
  - 汉月妄捏一○为千佛万佛之祖混灭正法眼藏若坐视不救亦是老僧之罪
  - 若痛加辟破又恐被目为争竞胜负得罪佛祖招后世骂
  lesson: 佛法的的大意直指当人本体觅个不受惑底人不可认圆相三玄三要名相为宗旨
  summary_first_person: 吾老僧圆悟住天童，见汉月于五宗原中画一○为宗旨潭吉又作五宗救展转相诳，恐后学忘认一○而灭慧命，故略撮七佛西天东土六十八人传灯大端以辟其妄救之
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗杂著/辟妄救略说.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/禅宗杂著/辟妄救略说.md
endeavors:
- id: guji-密云圆悟-endeavor-1
  title_zh: 住持天童续临济正脉
  summary: 承龙池正传笑岩德宝之系列临济第三十四世，出世天童直以问着便打棒不作棒用发明当人独尊
  phases:
  - key: brewing
    name: 早年参学得法
    labels:
      zh: 参学承法
    start_date: '1585'
    highlight_event_id: guji-密云圆悟-event-study
  - key: breakthrough
    name: 出世弘化
    labels:
      zh: 出世弘法
    start_date: '1611'
    highlight_event_id: guji-密云圆悟-event-abbot
  - key: climax
    name: 住持天童说法
    labels:
      zh: 天童弘禅
    start_date: '1630'
    highlight_event_id: guji-密云圆悟-event-abbot
  - key: closure
    name: 付法传灯三十四世
    labels:
      zh: 传灯付嘱
    start_date: '1640'
    highlight_event_id: guji-密云圆悟-event-death
  decisions:
  - date: '1630'
    title_zh: 住天童发明黄檗宗旨
    rationale: 临济建立宗旨唯问着便打末后正法眼藏向瞎驴边灭却不在三圣外别立，故直指当人自悟不与汉月争胜负
  - date: '1638'
    title_zh: 以仰山抹圆相为榜样示众
    rationale: 耽源九十七种圆相看竟即烧仰山以脚抹之从未以圆相为宗旨，故劝后世慎勿堕汉月圈套
- id: guji-密云圆悟-endeavor-2
  title_zh: 作辟妄救略说辟一○之妄
  summary: 因汉月五宗原立威音无象一○为祖潭吉作五宗救附会三玄三要三击三撼，故分十卷引七佛偈西天二十八祖东土六祖下传灯逐一说破
  phases:
  - key: brewing
    name: 见五宗原置之不阅
    labels:
      zh: 初见五宗原
    start_date: '1630'
    highlight_event_id: guji-密云圆悟-event-wuzongyuan
  - key: breakthrough
    name: 复磬山望汉月改辙
    labels:
      zh: 复书磬山
    start_date: '1633'
    highlight_event_id: guji-密云圆悟-event-wuzongyuan
  - key: climax
    name: 简阅五宗原发愤辟妄
    labels:
      zh: 披阅辟妄
    start_date: '1636'
    highlight_event_id: guji-密云圆悟-event-piwang
  - key: closure
    name: 崇祯戊寅长至成书示众
    labels:
      zh: 成辟妄救略说
    start_date: '1638-12-22'
    highlight_event_id: guji-密云圆悟-event-piwang
  decisions:
  - date: '1630'
    title_zh: 初置五宗原不阅但逆耳劝改
    rationale: 恐其目原之一字不出六祖道成知解宗徒，故望汉月知非而不遽辟
  - date: '1636'
    title_zh: 决意略撮大端辟妄救略
    rationale: 潭吉妄作五宗救益见密嘱之祸不得休息，若坐视则灭佛灭祖灭慧命之罪自汉月始老僧亦有罪，故不得不救
  - date: '1638-12-22'
    title_zh: 引七佛偈及拈花一棒证一○之非
    rationale: 七佛但有偈未有双头独结四法交加世尊惟我独尊即人人独尊，何曾有五色球深深意与无文密印，故摘毁其相
events:
- id: guji-密云圆悟-event-birth
  title_zh: 诞生
  date: '1566'
  year_of: 1566
  location: 常州宜兴
  description: 明嘉靖四十五年生，是为后住天童之密云圆悟
- id: guji-密云圆悟-event-study
  title_zh: 参学得法承临济系
  date: '1594'
  year_of: 1594
  location: 龙池
  description: 参龙池幻有正传得法为临济嫡系，下分笑岩德宝一脉
- id: guji-密云圆悟-event-abbot
  title_zh: 住持天童阐直指宗风
  date: '1630'
  year_of: 1630
  location: 明州天童寺
  description: 崇祯三年住天童，以打棒直指当人本体阐明临济黄檗宗旨
- id: guji-密云圆悟-event-wuzongyuan
  title_zh: 汉月寄五宗原磬山转书
  date: '1633'
  year_of: 1633
  location: 天童
  description: 崇祯三年汉月寄五宗原置之不阅至六年磬山寄汉月书云威音无象一○为祖，亦各与一顿望其改辙
- id: guji-密云圆悟-event-piwang
  title_zh: 作辟妄救略说缘起并成十卷
  date: '1638-12-22'
  year_of: 1638
  location: 天童
  description: 崇祯戊寅长至日书缘起，侍者真启编，列七佛西天二十八祖东土六祖下至天童六十八人以证一○妄捏，辟三玄三要四料拣配数之失
- id: guji-密云圆悟-event-death
  title_zh: 示寂
  date: '1642'
  year_of: 1642
  location: 天童寺
  description: 明崇祯十五年寂，世寿七十七，留下辟妄救略说以警后昆不受惑
