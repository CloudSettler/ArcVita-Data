endeavors:
- id: guji-延寿-endeavor-1
  title_zh: 永明弘化会通禅净
  summary: 自吴越吏属出家参德韶悟道历住雪窦灵隐永明提倡禅教律净一味定慧等学普摄缁素
  phases:
  - key: brewing
    name: 厌俗出家修定
    labels:
      zh:
      - 弃俗习定
    start_date: 0932
    highlight_event_id: guji-延寿-event-ordination
  - key: breakthrough
    name: 参韶发明心地
    labels:
      zh:
      - 开悟承法
    start_date: 0951
    highlight_event_id: guji-延寿-event-enlightenment
  - key: climax
    name: 住持永明大弘
    labels:
      zh:
      - 住持化众
    start_date: 0962
    highlight_event_id: guji-延寿-event-yongming
  - key: closure
    name: 示寂永明道盛行
    labels:
      zh:
      - 示寂化终
    start_date: 0976
    highlight_event_id: guji-延寿-event-death
  decisions:
  - date: 0932
    title_zh: 舍吏出家受具
    rationale: 不乐荣禄欲以湛心水荡念垢洗惑尘故投翠岩出家专修禅定为基
  - date: 0951
    title_zh: 投天台德韶得法
    rationale: 定多须慧照乃往天台求决了悟一心开般若门遂承法眼正宗
  - date: 0962
    title_zh: 就请住永明举扬
    rationale: 为弼心王成无上普现群生诸佛智故不辞劳开堂接众禅净并举
- id: guji-延寿-endeavor-2
  title_zh: 撰述定慧相资歌
  summary: 愍偏修定慧之弊作歌阐一法双分寂照双运劝等学莫偏修即凡途登觉岸
  phases:
  - key: brewing
    name: 较量偏枯之病
    labels:
      zh:
      - 观察机弊
    start_date: 0965
    highlight_event_id: guji-延寿-event-yongming
  - key: breakthrough
    name: 立定慧为父母将相之喻
    labels:
      zh:
      - 立宗设喻
    start_date: 0968
    highlight_event_id: guji-延寿-event-song
  - key: climax
    name: 作歌广劝双运
    labels:
      zh:
      - 作歌劝修
    start_date: 0970
    highlight_event_id: guji-延寿-event-song
  - key: closure
    name: 付后学流通受持
    labels:
      zh:
      - 流通付嘱
    start_date: 0975
    highlight_event_id: guji-延寿-event-death
  decisions:
  - date: 0968
    title_zh: 以日月将相喻定慧
    rationale: 定如月光烁外道慧如日照破无明将相父母之喻最能显相资之功故取以示人
  - date: 0970
    title_zh: 作歌明理事事理四观
    rationale: 或事定一处或理定观心或事观明相或理观顿了欲令学者即寂而照即照而寂故集为长歌
events:
- id: guji-延寿-event-birth
