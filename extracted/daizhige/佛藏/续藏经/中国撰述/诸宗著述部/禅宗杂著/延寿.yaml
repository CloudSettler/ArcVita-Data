  summary: 后梁贞明四年诞生于钱塘王氏家幼有异相长为吴越吏属
- id: guji-延寿-event-ordination
  title_zh: 舍俗出家受具
  date: 0932
  year_of: 932
  summary: 厌离世荣投四明翠岩令参出家受具专修禅定日夜习观
- id: guji-延寿-event-enlightenment
  title_zh: 参德韶发明心要
  date: 0951
  year_of: 951
  summary: 往天台山参德韶国师一言下悟宗镜一心之旨得法眼正脉
- id: guji-延寿-event-yongming
  title_zh: 住杭州永明弘化
  date: 0962
  year_of: 962
  summary: 吴越王请住灵隐次迁永明大道场领众行道著宗镜录万善同归集等禅净并弘
- id: guji-延寿-event-song
  title_zh: 撰定慧相资歌示众
  date: 0970
  year_of: 970
  summary: 为破偏修定慧纯阴纯阳之病作歌明定即慧慧即定双运俱泯之旨劝莫虚弃光阴
- id: guji-延寿-event-death
  title_zh: 示寂于永明
  date: 0976
  year_of: 976
  summary: 北宋开宝九年示寂于杭州永明道场世寿七十三后谥智觉禅师塔号慧日
