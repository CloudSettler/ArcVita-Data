  decisions:
  - date: 1107
    title_zh: 先传高僧行实以明证
    rationale: 菩萨运心非止利他乃所以自利欲以宏法度生栽培功德故先记僧宝以示典范
  - date: 1109
    title_zh: 次录林间言行以辅智证
    rationale: 空摧外道须有师承可据恐学者以扬眉瞬目为极则故录丛林机缘以相表里
