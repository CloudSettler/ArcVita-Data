  - date: 1107
    title_zh: 应无尽问决辨三玄三要
    rationale: 丛林谓玄要无益于道则祖意陵夷故须以涂毒鼓喻明闻者有死与不死之别以存壁立万仞之家风
  - date: 1110
    title_zh: 正塔主远公玄沙三句之误
    rationale: 古人误认玄沙三句为三玄遗落三要远公又以意识解意中玄故须还临济一句具三玄一玄具三要之本义
