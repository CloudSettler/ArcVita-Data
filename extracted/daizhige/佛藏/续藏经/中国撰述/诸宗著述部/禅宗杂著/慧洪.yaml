    highlight_event_id: guji-慧洪-event-zhizheng
  decisions:
  - date: 1119
    title_zh: 以智证名书犯所忌而不惜
    rationale: 非智不足辨邪正非证不足行赏罚欲照用全而荷大法故宁犯众忌直发五家所秘
  - date: 1115
    title_zh: 引涅槃涂毒鼓与伊字三点立宗门旨
    rationale: 文字语言虽不可见道离文字亦无以见道故借经义明一句具三玄一玄具三要
- id: guji-慧洪-endeavor-2
  title_zh: 作僧宝林间相表里弘法
  summary: 与智证传相表里作禅林僧宝传记高僧行实作林间录记丛林规则以栽培如来功德度脱众生
  phases:
