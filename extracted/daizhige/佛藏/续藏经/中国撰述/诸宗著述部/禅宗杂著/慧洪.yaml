  dilemmas:
  - 纲宗不明魔外充斥时当直犯众忌而折衷五家否
  - 文字语言即不可见道又离文字无以见道当如何举唱
  - 名迹为道之累而师承不可弃绝当如何守护付嘱
  lesson: 非智不足以辨邪正非证不足以行赏罚照用全方能荷大法
  summary_first_person: 我是慧洪字觉范号寂音见末法纲宗不明三尺竖子掠剩句为己悟故离合宗教引事比类折衷五家作智证传与僧宝传林间录相表里但愿后人直究纲宗而行祖令
