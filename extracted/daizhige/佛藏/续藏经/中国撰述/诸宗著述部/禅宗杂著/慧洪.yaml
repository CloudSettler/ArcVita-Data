    highlight_event_id: guji-慧洪-event-sengbao
  - key: breakthrough
    name: 离合宗教立义
    labels:
      zh:
      - 会通教禅
      - 引事比类
    start_date: 1115
    highlight_event_id: guji-慧洪-event-zhizheng
  - key: climax
    name: 折衷五家发其所秘
    labels:
      zh:
      - 辨邪正
      - 明照用
    start_date: 1119
    highlight_event_id: guji-慧洪-event-zhizheng
