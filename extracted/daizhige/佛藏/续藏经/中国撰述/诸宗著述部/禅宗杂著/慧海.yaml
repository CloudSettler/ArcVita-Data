events:
- id: guji-慧海-event-birth
  date: '0730'
  year_of: 730
  title_zh: 建州诞生姓朱依大云寺道智受业
  description: 建州朱氏子依越州大云寺道智和尚出家受业为后参马祖之本
- id: guji-慧海-event-wudao
  date: '0760'
  year_of: 760
  title_zh: 江西参马祖问宝藏言下大悟
  description: 自越州大云寺来求佛法马祖诘自家宝藏不顾师礼拜请问即今问我者是汝宝藏遂大悟识自本心不由知觉事师六载
- id: guji-慧海-event-guiyang
  date: '0766'
  year_of: 766
  title_zh: 以受业师年老归越奉养晦迹
  description: 受业师年老遽归奉养外示痴讷藏用自修不求名闻
- id: guji-慧海-event-zhushu
  date: '0770'
  year_of: 770
  title_zh: 撰顿悟入道要门论得马祖印许
  description: 自撰顿悟入道要门论一卷师侄玄晏窃呈马祖马祖叹越州有大珠圆明光透自在无遮障众寻访来越上号大珠和尚
- id: guji-慧海-event-honghua
  date: '0775'
  year_of: 775
  title_zh: 住大珠山答诸方门人参问
  description: 学侣渐多日夜叩激随问随答论即心即佛青竹黄华真如变易三教同异广示顿悟要门成诸方门人参问语录
- id: guji-慧海-event-death
  date: 0800
  year_of: 800
  title_zh: 越州示寂留语录流通
  description: 住持大珠晚年示寂年月不详语录与顿悟要门合传后世称大珠慧海
