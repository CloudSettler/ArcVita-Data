  birth_date: 1185-01-01
  death_date: 1260-12-31
  era: 南宋
  reign_ref: 宋理宗绍定至咸淳间
  archetype: 禅门编纂者
  dilemmas:
  - 曹洞五位辞语纠缠晚学难晓，若直陈恐落意思血指，若置阃外恐广陵散绝
  - 借位明功借功明位缘绪多端，若混尊卑收落功勋则误彰先师意度
  lesson: 不混其功看语来势，寻流得源方免堕地
  summary_first_person: 吾乃后曹山门人慧霞，自谓了悟，编洞山五位显诀，拣出曹山语要，随门夹入离为二册，欲凭法水一洗障秽，庶几寻流得源掬海识川
