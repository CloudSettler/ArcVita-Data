endeavors:
- id: guji-慧霞-endeavor-1
  title_zh: 编集洞山偏正五位显诀
  description: 以洞山五位为纲，会通宝镜三昧三渗漏诸文，离为卷上卷中卷下以便童蒙检阅
  phases:
  - key: brewing
    name: 问津曹溪洞上家风
    labels:
      zh: 酝酿搜集
    start_date: 1220-01-01
    highlight_event_id: guji-慧霞-event-1
  - key: breakthrough
    name: 立纲分列五门
    labels:
      zh: 立纲突破
    start_date: 1235-06-01
    highlight_event_id: guji-慧霞-event-1
  - key: climax
    name: 随门夹入成编
    labels:
      zh: 成编高潮
    start_date: 1240-01-01
    highlight_event_id: guji-慧霞-event-1
  - key: closure
    name: 付梓以备后学
    labels:
      zh: 付梓收束
    start_date: 1245-01-01
    highlight_event_id: guji-慧霞-event-2
  decisions:
  - date: 1235-06-01
    title_zh: 以洞山首唱为定不惑后来异说
    rationale: 宝镜显诀虽禀药山而著文设位流布丛林创自洞山故天下称洞山五位
  - date: 1240-03-01
    title_zh: 错综三家语句随门夹入
    rationale: 辞语纠缠寻究稍难故取详去略两通俱存以便检阅不涉胸臆
- id: guji-慧霞-endeavor-2
  title_zh: 拣出曹山语要以明宗旨
  description: 拣曹山先后语及广辉释补晦然补，正中偏偏中辨圆，明借位明功不负来机
  phases:
  - key: brewing
    name: 亲承曹山父子付嘱
    labels:
      zh: 承绪酝酿
    start_date: 1230-01-01
    highlight_event_id: guji-慧霞-event-2
  - key: breakthrough
    name: 贬正真和尚独脱之说
    labels:
      zh: 辨正突破
    start_date: 1242-01-01
    highlight_event_id: guji-慧霞-event-2
  - key: climax
    name: 明五位兼带去就圆转
    labels:
      zh: 圆转高潮
    start_date: 1248-01-01
    highlight_event_id: guji-慧霞-event-2
  - key: closure
    name: 示学徒不混其功
    labels:
      zh: 垂训收束
    start_date: 1255-01-01
    highlight_event_id: guji-慧霞-event-2
  decisions:
  - date: 1242-01-01
    title_zh: 拣贬独脱物外起众圣之前为屈正位
    rationale: 语中有语过迹尚存不得呼为相兼带来只得呼为有病兼带
  - date: 1248-05-01
    title_zh: 借事来者须向偏位明体物
    rationale: 恐后人收落功勋将为向上事故就缘中认得不同向去辨不得
events:
- id: guji-慧霞-event-birth
  title_zh: 诞生
  date: 1185-01-01
  year_of: 1185
  description: 南宋间生，后出家嗣曹山法系自称后曹山了悟大师
- id: guji-慧霞-event-1
  title_zh: 编摩洞山五位显诀卷上
  date: 1235-06-01
  year_of: 1235
  description: 编洞山五位显诀，述西祖持花南华散叶至新丰宏提纲要圆融一句分列五门
- id: guji-慧霞-event-2
  title_zh: 拣出曹山语要传付学徒
  date: 1248-05-01
  year_of: 1248
  description: 拣曹山正位却偏偏位中来相兼带来诸则，明无语中有语有语中无语正面而去之旨
- id: guji-慧霞-event-death
  title_zh: 示寂
  date: 1260-12-31
  year_of: 1260
  description: 宋末示寂，所编显诀由广辉释晦然补后学重刊流布，至中统元年晦然序行世
