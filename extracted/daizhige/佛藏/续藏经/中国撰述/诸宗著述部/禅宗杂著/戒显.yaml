  birth_date: 1610
  death_date: 1672
  era: 明末清初
  reign_ref: 清康熙
  archetype: 锻禅中兴之匠
  dilemmas:
  - title_zh: 守通套安逸还是行锻炼劳苦
    description: 守成规则身逸体尊而慧命无传门庭冷落，行锻炼则劳筋苦骨而能出龙象续佛祖慧命
  - title_zh: 死法中如何见活法
    description: 末法根器劣智巧深须用话头，若不辨器授话则活法亦成死法，能作三种根器断则死法中有活法
  lesson: 以正治国以奇用兵，锻禅须先坚誓忍苦，次辨器授话搜刮开导，猛利逼拶垂手锻炼方能透牢关续慧命
  summary_first_person: 我是东吴愿云戒显，号晦山，昔居板首颇悟锻法，卜静匡山逼住欧阜，空拳赤手创为随众经行敲击移换擒啄斩劈之法，一时大验，因思人根无论利钝苟得锻法皆可省悟，遂著锻禅十三篇流布宗门，愿三玄戈甲永见雄强五位旌旗不致偃息，知我罪我所弗惜，虽谓禅门孙武子可也
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E6%9D%82%E8%91%97/%E7%A6%85%E9%97%A8%E9%94%BB%E7%82%BC%E8%AF%B4.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E6%9D%82%E8%91%97/%E7%A6%85%E9%97%A8%E9%94%BB%E7%82%BC%E8%AF%B4.md
endeavors:
- id: guji-戒显-endeavor-1
  title_zh: 欧阜创行随众锻炼法
  summary: 空拳赤手创经行敲击移换擒啄斩劈之法，当场苦战而奏凯多俘，证猛利参胜于和平参
  phases:
  - key: brewing
    name: 板首悟法
    labels:
      zh: 居板首悟兵机
    start_date: 1650
    highlight_event_id: guji-戒显-event-chuangfa
  - key: breakthrough
    name: 欧阜创法
    labels:
      zh: 逼住欧阜杜撰新法
    start_date: 1655
    highlight_event_id: guji-戒显-event-chuangfa
  - key: climax
    name: 苦战奏凯
    labels:
      zh: 当场苦战多俘
    start_date: 1656
    highlight_event_id: guji-戒显-event-chuangfa
  - key: closure
    name: 验法可传
    labels:
      zh: 人根利钝皆可省悟
    start_date: 1660
    highlight_event_id: guji-戒显-event-zhushu
  decisions:
  - date: 1655
    title_zh: 不辞杜撰创奇毒辣法
    rationale: 卒伍全无而欲出人才，非出奇兵频握竹篦随众旋绕不能搂窟穴斩根株
  - date: 1660
    title_zh: 不秘其法著书流布
    rationale: 人多执死法不垂手险崖则多悲钝置，欲令初踞曲盝者勤加操练而出大法将
- id: guji-戒显-endeavor-2
  title_zh: 住云居著锻禅十三篇弘化
  summary: 住江西云居真如 systematize 坚誓忍苦至谨严付授十三篇，重拈竹篦恢复纲宗
  phases:
  - key: brewing
    name: 承接疆土
    labels:
      zh: 继天童三峰灵隐家风
    start_date: 1658
    highlight_event_id: guji-戒显-event-zhushu
  - key: breakthrough
    name: 入室搜刮落堂开导
    labels:
      zh: 识号貌谙本参解黏去缚
    start_date: 1660
    highlight_event_id: guji-戒显-event-zhushu
  - key: climax
    name: 垂手锻炼机权策发
    labels:
      zh: 竹篦敲击寄巧回换斩关
    start_date: 1661
    highlight_event_id: guji-戒显-event-zhushu
  - key: closure
    name: 序书传法
    labels:
      zh: 辛丑上元自识流布
    start_date: 1661-02-21
    highlight_event_id: guji-戒显-event-zhushu
  decisions:
  - date: 1660
    title_zh: 立十三篇纲目
    rationale: 自坚誓第一至付授第十三，先正大本而后施钳锤，使高下咸宜利钝兼济
  - date: 1661-02-21
    title_zh: 以孙武拟锻禅而不惜嗤议
    rationale: 以正治国以奇用兵奇正相因，柱下之言确，佛法据位治丛林用机法锻众不易之道
events:
- id: guji-戒显-event-birth
  type: birth
  title_zh: 诞生于东吴
  date: 1610
  year_of: 1610
  description: 东吴金氏子，后字愿云号晦山，明末出家参学，久居板首颇悟锻法
- id: guji-戒显-event-chuangfa
  type: achievement
  title_zh: 逼住欧阜创随众经行锻炼法
  date: 1655
  year_of: 1655
  description: 卜静匡山逼住欧阜，空拳赤手创随众经行敲击移换擒啄斩劈法，长老时时在堂同众起倒，频握五尺竹篦拦胸把住劈头鞫参，一时大验
- id: guji-戒显-event-zhushu
  type: achievement
  title_zh: 住云居真如序禅门锻炼说
  date: 1661-02-21
  year_of: 1661
  description: 岁次辛丑孟春上元日住云居自识，著坚誓忍苦辨器授话入室搜刮落堂开导垂手锻炼等十三篇，以孙武兵法喻佛祖机法，流布宗门以出人才
- id: guji-戒显-event-death
  type: death
  title_zh: 示寂
  date: 1672
  year_of: 1672
  description: 弘化云居之后示寂，一生以恢复纲宗重拈竹篦为任，锻炼复行而龙象竞出
