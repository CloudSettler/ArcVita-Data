endeavors:
- id: guji-文益-endeavor-1
  title_zh: 历参悟道绍法眼宗
  summary_zh: 幼出家受具，参长庆桂琛，於地藏发明心地，绍玄沙法脉，开法眼一宗
  phases:
  - key: brewing
    name: 幼出家历参
    labels:
