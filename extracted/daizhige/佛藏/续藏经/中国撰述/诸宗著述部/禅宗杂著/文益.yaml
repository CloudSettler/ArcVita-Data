  dilemmas:
  - 心地未明而妄为人师，误后学入轮回
  - 党护门风是非锋起，乖大道无方同味之旨
  lesson: 顿悟须渐证辅之，宗眼时节理事俱圆，方能续佛慧命而不负师承
