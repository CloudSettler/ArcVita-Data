      - 求道参学
    start_date: 0892
    highlight_event_id: guji-文益-event-birth
  - key: breakthrough
    name: 地藏得法
    labels:
      zh:
      - 豁然契悟
    start_date: 0934
    highlight_event_id: guji-文益-event-enlighten
  - key: climax
    name: 金陵开堂
    labels:
      zh:
      - 开宗立派
    start_date: 0937
    highlight_event_id: guji-文益-event-jinling
  - key: closure
    name: 清凉付嘱
    labels:
      zh:
      - 付法传灯
    start_date: 0950
    highlight_event_id: guji-文益-event-tenrules
  decisions:
  - date: 0934
    title_zh: 依地藏桂琛决择疑情
    rationale: 不择宗匠则邪正不辨，须亲善知识切磋淘汰，方得发明心地
  - date: 0937
    title_zh: 应南唐烈祖请住金陵
    rationale: 遇般若缘非小，为续佛慧命引接初机，非为声名利养，故随缘建化
- id: guji-文益-endeavor-2
  title_zh: 作宗门十规救时弊
  summary_zh: 悯南方宗派瀚漫而达者罕得，指陈十病，立规匡正，托文显道以药喑郁之病
  phases:
  - key: brewing
    name: 观察丛林流弊
    labels:
      zh:
      - 审时察病
    start_date: 0940
    highlight_event_id: guji-文益-event-jinling
  - key: breakthrough
    name: 拈出十病纲要
    labels:
      zh:
      - 立规垂范
    start_date: 0950
    highlight_event_id: guji-文益-event-tenrules
  - key: climax
    name: 十规论成众传
    labels:
      zh:
      - 著论弘化
    start_date: 0952
    highlight_event_id: guji-文益-event-tenrules
  - key: closure
    name: 示寂付嘱后学
    labels:
      zh:
      - 警策来者
    start_date: 0958
    highlight_event_id: guji-文益-event-death
  decisions:
  - date: 0950
    title_zh: 强显其言作十规论
    rationale: 中测颇深力排匪逮，於无言中强显其言，以救一时之弊，防误后进
  - date: 0952
    title_zh: 融通教禅不专守门风
    rationale: 具理具事贵在圆融，不通教典则乱引证，故须理事相资宗教一致
events:
- id: guji-文益-event-birth
  type: birth
  date: 0885
  year_of: 885
  title_zh: 生於余杭鲁氏
  description_zh: 唐光启元年，生於浙江余杭鲁氏，七岁依新定智通出家
- id: guji-文益-event-enlighten
  type: career
  date: 0934
  year_of: 934
  title_zh: 参地藏桂琛得悟
  description_zh: 历参长庆慧棱诸师，至漳州地藏院，依桂琛禅师决择，发明心地，得玄沙法脉
- id: guji-文益-event-jinling
  type: career
  date: 0937
  year_of: 937
  title_zh: 住金陵报恩清凉弘化
  description_zh: 为南唐烈祖迎请，住金陵报恩禅院，后住清凉寺，大播法眼宗风，门下十四五人弘化一方
- id: guji-文益-event-tenrules
  type: career
  date: 0950
  year_of: 950
  title_zh: 撰宗门十规论
  description_zh: 悯祖派瀚漫时弊丛生，作论十条，分辨心地未明妄为人师乃至护短争胜之病，以正宗眼时节理事
- id: guji-文益-event-death
  type: death
  date: 0958
  year_of: 958
  title_zh: 示寂於金陵
  description_zh: 南唐交泰元年七月示寂，谥大法眼禅师，塔号无相，法眼一宗经文遂等大弘於江南
