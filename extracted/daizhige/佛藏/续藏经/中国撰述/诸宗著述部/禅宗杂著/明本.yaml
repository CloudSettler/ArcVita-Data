    highlight_event_id: guji-明本-event-qinggui
  decisions:
  - date: '1317'
    title_zh: 不袭丛林全仪别置须知一编
    rationale: 庵居处众既不敢效丛林礼法又不可破规裂矩故列十门自成一家
  - date: '1317'
    title_zh: 以辨道日用为一庵之务
    rationale: 道无始终起于日用昼三夜三寸阴不弃故以坐禅作息为常规
- id: guji-明本-endeavor-2
  title_zh: 祝圣利生行楞严圣节道场
