  - title_zh: 古语寻常与后学难行
    description: 宝训语句寻常而后人行之如登渺莽，欲以笔说续微学于将坠
  lesson: 融古人之言为己言，通古人之志为己志，削势利趋道德
  summary_first_person: 我参学以来读宝训已四十春秋如饮醍醐，立身接物窃取一二奉为典型，晚谢事寒岩，禅者请说益坚，只得命楮颖代为说之，日渍月浸遂成笔说一帙，愿学者肯綮深思不负前辈嚼食喂婴之婆心
