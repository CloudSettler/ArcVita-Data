  archetype: 禅门弘法注疏者
  dilemmas:
  - title_zh: 言意与心法如何两忘
    description: 言意皆是妄想，离言意亦復如是，不即不离方得心法，当以何示人
  - title_zh: 证道无证如何更颂
    description: 道本无为无所事证，却哓哓与世俗辩，当不断烦恼而住解脱
  lesson: 不绝诸念不著诸相，普以自觉悦可众心，方是真常住
  summary_first_person: 吾千顷山沙门法泉，昔居千顷，复颂永嘉证道歌成三百二十篇，发如来大智慧海，使人望涯涘而泝其流，不外因缘，利物应形终不竭。
