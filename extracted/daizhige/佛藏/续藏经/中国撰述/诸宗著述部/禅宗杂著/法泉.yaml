  decisions:
  - date: '1070'
    title_zh: 发心继颂证道歌
    rationale: 恐后学以色见声求，欲发智慧海使人泝流，故不辞哓哓而辩
  - date: 1077-07
    title_zh: 付刊请序流通
    rationale: 颂成三百二十篇，须得文人护持，使普悦众心，故请括苍吴庸作序
- id: guji-法泉-endeavor-2
  title_zh: 住持千顷南明弘禅接众
  summary: 由千顷移住南明，以无为闲道人自处，示身贫道不贫，利物应形
  phases:
  - key: brewing
    name: 千顷山静坐养道
    labels:
      zh: 静坐养道
    start_date: '1060'
    highlight_event_id: guji-法泉-event-1
  - key: breakthrough
    name: 开堂示众阐宗说兼通
    labels:
      zh: 开堂阐宗
