    highlight_event_id: guji-法泉-event-3
  decisions:
  - date: '1068'
    title_zh: 开堂宗说兼通
    rationale: 定慧圆明不滞空，宗亦通说亦通，故随机宣畅不坠有无二边
  - date: '1075'
    title_zh: 移锡南明接众
    rationale: 为使含生依归、达者同游涅槃路，故不独行独步而出世利物
events:
- id: guji-法泉-event-birth
  type: birth
  date: '1025'
  year_of: 1025
  title_zh: 法泉出生
  description: 北宋仁宗朝前后生，世系未详，幼具宿慧，后出家为沙门
- id: guji-法泉-event-death
  type: death
  date: '1091'
  year_of: 1091
  title_zh: 法泉示寂
  description: 北宋哲宗元祐前后示寂于南明，世寿约六十余，生死不相干，了无生而去
- id: guji-法泉-event-1
  type: career
  date: '1070'
  year_of: 1070
  title_zh: 居千顷山继颂证道歌
  description: 居千顷山沙门，发心继颂永嘉真觉禅师证道歌，逐句发明心镜明廓然莹彻之旨
- id: guji-法泉-event-2
  type: career
  date: 1077-07
  year_of: 1077
  title_zh: 颂成三百二十篇吴庸作序
  description: 熙宁十年丁巳七月，继颂成三百二十篇，括苍吴庸为之作南明泉颂永嘉证道歌序，盛赞发智慧海悦可众心
- id: guji-法泉-event-3
  type: career
  date: '1085'
  year_of: 1085
  title_zh: 住南明弘禅示贫道不贫
  description: 住南明弘法，以穷释子口称贫自况，示身披缕褐而心藏无价珍，三身四智体中圆
