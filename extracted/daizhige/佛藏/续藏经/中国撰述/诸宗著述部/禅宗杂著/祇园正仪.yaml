  - 升堂入室拈槌竖拂与萧条冷淡省缘办道之抉择
  lesson: 两头撒开中间放下尽却今时心中无事方为出家本色
  summary_first_person: 我为厌尘劳求脱生死而出家不肯以等闲利养埋没平生今忝主山门辄效古人立住持体例更不下山不赴斋不发化主唯将庄课均作三百六十分日取一分备饭作粥新到唯相见茶汤务要省缘专一辨道但得心中无事一切世事自然冷淡
