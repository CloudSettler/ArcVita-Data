  summary_zh: 忝主山门不坐费常住议定庄课均分日用备饭作粥不随人添减置茶堂自取省缘办道
  phases:
  - key: brewing
    name: 厌离尘劳立志办道
    labels:
      zh:
      - 出家厌离
      - 休心息念
    start_date: '1065'
    highlight_event_id: guji-祇园正仪-event-1
  - key: breakthrough
    name: 议定体例均分庄课
    labels:
      zh:
      - 住持体例
      - 均分日用
    start_date: '1104'
    highlight_event_id: guji-祇园正仪-event-1
  - key: climax
    name: 省缘专修萧条山居
    labels:
      zh:
      - 省缘办道
      - 山居萧条
    start_date: '1105'
    highlight_event_id: guji-祇园正仪-event-1
  - key: closure
    name: 示人冷淡垂训后学
    labels:
      zh:
      - 冷淡垂训
      - 各自努力
    start_date: '1110'
    highlight_event_id: guji-祇园正仪-event-2
  decisions:
  - date: '1104'
    title_zh: 更不下山不赴斋不发化主
    rationale: 为断攀缘专一辨道不以利养埋没平生
  - date: '1105'
    title_zh: 庄课均作三百六十分日取一分
    rationale: 可以备饭则作饭不足则粥不足则米汤不随人添减以养廉节
- id: guji-祇园正仪-endeavor-2
  person_id: guji-祇园正仪
  title_zh: 呵斥浮华举扬古圣苦行
  summary_zh: 举隐山赵州匾担大梅纸衣布衣石霜投子榜样呵百味供养四事具足之迟误示达磨面壁二祖立雪之不措一词
  phases:
  - key: brewing
    name: 追慕古圣榜样在怀
    labels:
      zh:
      - 追慕古圣
      - 惭愧自省
    start_date: '1104'
    highlight_event_id: guji-祇园正仪-event-2
  - key: breakthrough
    name: 当众说家门示冷淡
    labels:
      zh:
      - 说家门
      - 示冷淡
    start_date: '1105'
    highlight_event_id: guji-祇园正仪-event-2
  - key: climax
    name: 举达磨二祖不立文字
    labels:
      zh:
      - 举古讥今
      - 不尚升堂
    start_date: '1108'
    highlight_event_id: guji-祇园正仪-event-2
  - key: closure
    name: 撰祇园正仪垂训丛林
    labels:
      zh:
      - 著述垂训
      - 劝勉同道
    start_date: '1110'
    highlight_event_id: guji-祇园正仪-event-2
  decisions:
  - date: '1108'
    title_zh: 不作升堂入室拈槌竖拂
    rationale: 山前已说家门不著便更作喝棒张眉如痫病发唯屈沉上座辜负先圣
  - date: '1110'
    title_zh: 示山田脱粟野菜淡齑偈劝努力
    rationale: 要尽今时心中无事莫待隔生隔世时光似箭当各自珍重
