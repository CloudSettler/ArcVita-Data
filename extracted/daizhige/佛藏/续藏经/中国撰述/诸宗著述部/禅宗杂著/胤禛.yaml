  decisions:
  - date: 1733-05-22
    title_zh: 召不服魔徒面陈较量佛法
    rationale: 若见过於朕所论尤高即收回原旨否则以世法从重治罪以昭公允
  - date: 1734-01-01
    title_zh: 附论三教并行不悖日月星同一光
    rationale: 老子与孔子同时问礼佛先孔数十年若接迹同方必交相敬礼故不必作拘碍之见
