  decisions:
  - date: 1733-05-22
    title_zh: 颁雍正十一年四月初八日上谕
    rationale: 魔说传染则正信断正见灭法眼慧命所关非细故不得不言
  - date: 1733-06-01
    title_zh: 命毁藏忍语录五宗原五宗救等板片
    rationale: 魔嗣著述不行即毁冀魔说不朽故尽行毁板不许私藏违者以不敬论
  - date: 1733-06-01
    title_zh: 削天童密云悟派下法藏一支永不许复入祖庭
    rationale: 曹溪清派不可容此浊流故撤钟板择别支承接方丈而常住十方原自无涉
- id: guji-胤禛-endeavor-2
  title_zh: 精一执中会通三教会归性理
  summary_zh: 以修齐治平为本解脱诸相以达性理附论仙佛一贯三教并行不悖屏去畛域以正人心
