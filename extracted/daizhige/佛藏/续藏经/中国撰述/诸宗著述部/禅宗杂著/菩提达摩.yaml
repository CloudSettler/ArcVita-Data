  title_zh: 航海至梁魏传顿教
  date: '0520'
  year_of: 520
  place_zh: 江南复北至少林
  description: 来此土唯传顿教大乘即心是佛不言持戒精进直指人心见性成佛
- id: guji-菩提达摩-event-treatise
  title_zh: 述血脉论示心是佛
  date: '0526'
  year_of: 526
  place_zh: 嵩山少林
  description: 说自心是涅盘心外无佛不见性念佛诵经持戒布施终不得成佛见性即佛
- id: guji-菩提达摩-event-teach
  title_zh: 面壁传心付法慧可
  date: '0527'
  year_of: 527
  place_zh: 嵩山少林
  description: 息缘养神面壁而化令学人苦求会解前佛后佛以心传心不立文字
- id: guji-菩提达摩-event-death
  title_zh: 示寂于洛阳
  date: 0528
  year_of: 528
  place_zh: 洛阳嵩山
  description: 于生死中自在出没圣体本来清净长生不死一华开五叶结果自然成
