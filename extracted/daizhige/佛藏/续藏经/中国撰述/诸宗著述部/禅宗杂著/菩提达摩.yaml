person:
  qid: guji-菩提达摩
  name_zh: 菩提达摩
  names:
    zh: 菩提达摩
    en: Bodhidharma
  lifespan:
    birth:
      date: '0470'
      precision: year
      is_circa: true
      raw: 约五世纪末生于南天竺香至国
    death:
      date: 0528
      precision: year
      is_circa: true
      raw: 北魏孝昌年间示寂于洛阳嵩山
  birth_date: '0470'
  death_date: 0528
  era: 南北朝
  reign_ref: 梁普通北魏孝昌
  archetype: 禅宗初祖
  dilemmas:
  - 不立文字与经教泛滥相争如何使人直信自心是佛
  - 持戒念佛布施福利皆是因果受报如何直指见性免堕轮回
  - 礼佛相好见光见境易被天魔外道摄持如何不取一切相方为真见
  lesson: 心外无佛见性即佛不取相不执着息缘养神方入如来知见
  summary_first_person: 吾自西天来此土唯传顿教大乘以心传心不立文字三界混起同归一心汝问即汝心吾答即吾心施为运动见闻觉知皆是灵觉之性若见本性即是佛圣体本来清净若不见性纵诵十二部经终免不得生死轮回
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E6%9D%82%E8%91%97/%E8%BE%BE%E7%A3%A8%E5%A4%A7%E5%B8%88%E8%A1%80%E8%84%89%E8%AE%BA.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E6%9D%82%E8%91%97/%E8%BE%BE%E7%A3%A8%E5%A4%A7%E5%B8%88%E8%A1%80%E8%84%89%E8%AE%BA.md
endeavors:
- id: guji-菩提达摩-endeavor-1
  title_zh: 西来传顿教直指见性
  summary: 自南天竺航海至梁魏不言持戒精进苦行唯言即心是佛面壁传心以破外驰求
  phases:
  - key: brewing
    name: 南天竺承传心印
    labels:
      zh: 酝酿
    start_date: 0490
    highlight_event_id: guji-菩提达摩-event-birth
  - key: breakthrough
    name: 梁土初化不契机缘
    labels:
      zh: 突破
    start_date: '0520'
    highlight_event_id: guji-菩提达摩-event-arrive
  - key: climax
    name: 嵩山面壁传付慧可
    labels:
      zh: 高潮
    start_date: '0525'
    highlight_event_id: guji-菩提达摩-event-teach
  - key: closure
    name: 洛阳示寂心印不绝
    labels:
      zh: 收束
    start_date: 0528
    highlight_event_id: guji-菩提达摩-event-death
  decisions:
  - date: '0520'
    title_zh: 不立文字以心传心
    rationale: 前佛后佛只言传心除此心外无佛可得故直指自性不说持戒精进诸行
  - date: '0525'
    title_zh: 面壁息缘待可传法
    rationale: 迷人不自委信向外驰求须息缘养神直下便会方能断生死根本
- id: guji-菩提达摩-endeavor-2
  title_zh: 述血脉论破邪显正
  summary: 标举性即是佛佛即是性破念佛诵经持戒布施得成佛之执辨魔说佛说以定邪正
  phases:
  - key: brewing
    name: 观机设问标举本心
    labels:
      zh: 酝酿
    start_date: '0525'
    highlight_event_id: guji-菩提达摩-event-teach
  - key: breakthrough
    name: 破因果福利成佛论
    labels:
      zh: 突破
    start_date: '0526'
    highlight_event_id: guji-菩提达摩-event-treatise
  - key: climax
    name: 辨魔佛不取一切相
    labels:
      zh: 高潮
    start_date: '0526'
    highlight_event_id: guji-菩提达摩-event-treatise
  - key: closure
    name: 付嘱后学见性即佛
    labels:
      zh: 收束
    start_date: 0528
    highlight_event_id: guji-菩提达摩-event-death
  decisions:
  - date: '0526'
    title_zh: 但言见性不言淫欲作业
    rationale: 性本清净染污不得若见性疑心顿除一切业拘不得故直示法身无受
  - date: '0526'
    title_zh: 不许礼相不取异境
    rationale: 天魔外道皆作菩萨相貌诸佛本性体上都无相貌若取相即堕魔界故令离一切相
