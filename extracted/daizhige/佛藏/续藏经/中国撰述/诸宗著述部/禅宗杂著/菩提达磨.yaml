  - 心外求佛还是直指人心见性
  - 断烦恼入涅槃还是即烦恼悟菩提
  lesson: 离相见性，心空即道，不外求佛，烦恼即菩提
  summary_first_person: 吾自西来，但示一心，离相寂灭，见性是佛，莫向外求，心空归静，即在道场
