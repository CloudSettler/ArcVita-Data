endeavors:
- id: guji-菩提达磨-endeavor-1
  title_zh: 西来传法立禅宗
  summary: 自南天竺航海入梁，北渡嵩洛，面壁观心，付法断臂者，开中土禅宗之源
  phases:
  - key: brewing
    name: 南天竺得法修寂灭
    labels:
      zh:
      - 得法
      - 观心
    start_date: 0490
    highlight_event_id: guji-菩提达磨-event-birth
  - key: breakthrough
    name: 泛海入梁见武帝
    labels:
      zh:
      - 西来
      - 破相
    start_date: '0520'
    highlight_event_id: guji-菩提达磨-event-arrive-liang
  - key: climax
    name: 北渡嵩山面壁示心
    labels:
      zh:
      - 面壁
      - 安心
    start_date: '0525'
    highlight_event_id: guji-菩提达磨-event-face-wall
  - key: closure
    name: 付法慧可传心印
    labels:
      zh:
      - 付法
      - 传灯
    start_date: '0527'
    highlight_event_id: guji-菩提达磨-event-preach-wuxinglun
  decisions:
  - date: '0520'
    title_zh: 航海入华不滞南土
    rationale: 道以寂灭为体，须破文字相执，故西来直指人心
  - date: '0525'
    title_zh: 北行面壁不将心求法
    rationale: 将心求法者为迷，安心无为即是解脱，故默坐嵩少以示之
- id: guji-菩提达磨-endeavor-2
  title_zh: 宣说悟性论明佛性
  summary: 示寂灭菩提，言即心是佛，贪嗔痴性即佛性，三身平等，作夜坐偈以导后学
  phases:
  - key: brewing
    name: 示道体寂灭离相
    labels:
      zh:
      - 寂灭
      - 离相
    start_date: '0526'
    highlight_event_id: guji-菩提达磨-event-face-wall
  - key: breakthrough
    name: 说悟性破心外求佛
    labels:
      zh:
      - 见性
      - 破执
    start_date: '0527'
    highlight_event_id: guji-菩提达磨-event-preach-wuxinglun
  - key: climax
    name: 明三身平等涅槃
    labels:
      zh:
      - 三身
      - 涅槃
    start_date: '0527'
    highlight_event_id: guji-菩提达磨-event-preach-wuxinglun
  - key: closure
    name: 作夜坐偈示五更修证
    labels:
      zh:
      - 夜坐
      - 证道
    start_date: 0528
    highlight_event_id: guji-菩提达磨-event-death
  decisions:
  - date: '0527'
    title_zh: 说烦恼即菩提不妄断
    rationale: 烦恼性空即是佛性，妄断则滞涅槃，故示不离空常在涅槃
  - date: 0528
    title_zh: 以偈示禅定不忆一切法
    rationale: 不忆一切法乃名禅定，行住坐卧皆禅，故作五更偈以摄机
events:
- id: guji-菩提达磨-event-birth
  title_zh: 南天竺诞生
  date: '0470'
  year_of: 470
  place_zh: 南天竺香至国
  description: 相传为香至国王第三子，遇般若多罗得法，通达大乘空宗
- id: guji-菩提达磨-event-arrive-liang
  title_zh: 入梁传法
  date: '0520'
  year_of: 520
  place_zh: 建康
  description: 航海至梁，与武帝论功德无功德，机契不合，遂北渡而去
- id: guji-菩提达磨-event-face-wall
  title_zh: 嵩山面壁安心
  date: '0525'
  year_of: 525
  place_zh: 嵩山少林
  description: 面壁九年，示离心相见佛，慧可断臂求法，付以安心法门
- id: guji-菩提达磨-event-preach-wuxinglun
  title_zh: 说悟性论示见性
  date: '0527'
  year_of: 527
  place_zh: 嵩洛
  description: 说寂灭为体离相为宗，明心是佛，三毒即佛性，三身一心，普示学人
- id: guji-菩提达磨-event-death
  title_zh: 嵩山示寂
  date: 0528
  year_of: 528
  place_zh: 嵩山
  description: 北魏孝昌年间端坐示寂，留夜坐五更偈，付法慧可，禅脉遂传
