endeavors:
- id: guji-行海-endeavor-1
  title_zh: 撰述禅宗指掌八篇显中道
  description: 以一真心即万法为宗，破斥断常有无，述八篇直显本来面目。
  phases:
  - key: brewing
    name: 思惟般若酝酿立宗
    labels:
      zh: 酝酿
    start_date: 1780
    highlight_event_id: guji-行海-event-teaching
  - key: breakthrough
    name: 定一心真空之见
    labels:
      zh: 突破
    start_date: 1785
    highlight_event_id: guji-行海-event-writing
  - key: climax
    name: 成八篇指掌
    labels:
      zh: 高潮
    start_date: 1787
    highlight_event_id: guji-行海-event-writing
  - key: closure
    name: 刊板天宁流通
    labels:
      zh: 收束
    start_date: 1787-05-02
    highlight_event_id: guji-行海-event-publish
  decisions:
  - date: 1785
    title_zh: 以非空非有立一心宗
    rationale: 若不立一真心即万法，学者必堕断空或着有常见，故定以中道第一义为纲。
  - date: 1787
    title_zh: 设八篇问答破执显真
    rationale: 以问答破二见，直指举念者是谁而不许认着，令学者善巧用心。
- id: guji-行海-endeavor-2
  title_zh: 开堂接众示善巧用心
  description: 接引居士僧俗，示知有不落常知无不堕断，开本来面目参究一路。
  phases:
  - key: brewing
    name: 静坐观机
    labels:
      zh: 酝酿
    start_date: 1783
    highlight_event_id: guji-行海-event-teaching
  - key: breakthrough
    name: 示眼不自见喻真心
    labels:
      zh: 突破
    start_date: 1786
    highlight_event_id: guji-行海-event-teaching
  - key: climax
    name: 开示悟空居士解空
    labels:
      zh: 高潮
    start_date: 1786
    highlight_event_id: guji-行海-event-teaching
  - key: closure
    name: 付嘱流通报佛恩
    labels:
      zh: 收束
    start_date: 1787-05-02
    highlight_event_id: guji-行海-event-publish
  decisions:
  - date: 1786
    title_zh: 以唤诺破断空疑
    rationale: 学人抛无见便恐落断空，直唤其名应诺即是不空活体，不须更觅。
  - date: 1787
    title_zh: 以无处用心为正用心
    rationale: 有处用心皆着相，无处用心而知落空者即是不落空，故付嘱流通。
events:
- id: guji-行海-event-birth
  type: birth
  title_zh: 行海诞生
  date: 1700
  year_of: 1700
  is_circa: true
  description: 清代生，后出家为沙门，自称后学。
- id: guji-行海-event-teaching
  type: career
  title_zh: 开示悟空居士及示众参本来面目
  date: 1786
  year_of: 1786
  is_circa: true
  description: 静坐中接悟空居士，示六尘无着抛却无见，唤诺显不堕断空，又示眼不自见喻本来面目非有非无。
- id: guji-行海-event-writing
  type: career
  title_zh: 述禅宗指掌八篇
  date: 1787
  year_of: 1787
  description: 述第一至第八篇，明中道第一义真空妙理，破着有执无，示善巧看举念者是谁。
- id: guji-行海-event-publish
  type: career
  title_zh: 禅宗指掌新刊板存天宁寺
  date: 1787-05-02
  year_of: 1787
  description: 乾隆五十二年四月望日新刊，板存常州府天宁寺禅堂，后光绪十九年重镌流通。
- id: guji-行海-event-death
  type: death
  title_zh: 行海示寂
  date: 1790
  year_of: 1790
  is_circa: true
  description: 清乾隆后示寂，后学重刊其指掌流通。
