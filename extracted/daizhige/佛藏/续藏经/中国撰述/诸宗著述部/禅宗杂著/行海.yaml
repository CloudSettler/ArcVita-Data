  archetype: 禅师
  dilemmas:
  - 着有执无皆是外道见如何善巧用心不落两边
  - 本来面目说有成二我说无堕断空如何直显中道
  lesson: 离断常有无两边即万法为一真心方契中道第一义
  summary_first_person: 我后学沙门行海，唯以一真心为宗，破断常空有之执，述指掌八篇，直指本来面目，开示后学善巧用心。
