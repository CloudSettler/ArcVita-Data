  decisions:
  - date: '1670'
    title_zh: 受胡介之属考正宗旨
    rationale: 见人天眼目载洞宗讹舛滋多，愍后学迷本源三昧，故许考正
  - date: '1678'
    title_zh: 阖户烧香三复遗言
    rationale: 故友谢世蕴怀数年，因禅者劝请，决意闭户谛观重离，不负前托
  - date: '1679'
    title_zh: 公开密授不计毁誉
    rationale: 慨古说支离辱先误后，宁冒流布之罪，作图说以阐幽微
- id: guji-行策-endeavor-2
  title_zh: 荆溪住持弘扬禅净
  description: 住持荆溪虞山一带，融合曹洞宗旨与念佛持戒，接引学人，破狂禅而归实行
  phases:
  - key: brewing
    name: 早年慕道出家
    labels:
      zh:
      - 出家
      - 慕道
    start_date: '1651'
    highlight_event_id: guji-行策-event-entrust
  - key: breakthrough
    name: 深究教乘宗乘
    labels:
      zh:
      - 穷究
      - 会通
    start_date: '1660'
    highlight_event_id: guji-行策-event-closed-study
  - key: climax
    name: 领众熏修立规
    labels:
      zh:
      - 化导
      - 领众
    start_date: '1675'
    highlight_event_id: guji-行策-event-six-diagrams
  - key: closure
    name: 著述付后示寂
    labels:
      zh:
      - 付嘱
      - 圆寂
    start_date: '1682'
    highlight_event_id: guji-行策-event-death
  decisions:
  - date: '1660'
    title_zh: 以戒律为基倡禅净合修
    rationale: 见学人空谈正偏不沾实行，故以持戒念佛摄心，显三昧受用
  - date: '1675'
    title_zh: 以图说接引后学
    rationale: 秘藏幽扃难开物解，故借太极两仪卦象为方便，令初机可入
events:
- id: guji-行策-event-birth
  date: '1628'
  year_of: 1628
  title_zh: 诞生于宜兴蒋氏
  description: 明崇祯元年生于宜兴，俗姓蒋，父全昌笃信佛法，幼即慕道
- id: guji-行策-event-entrust
  date: '1670'
  year_of: 1670
  title_zh: 受旅堂居士之托考正三昧
  description: 友人胡介见五家宗旨洞宗讹舛，属行策考正其义，遂留意宝镜三昧
- id: guji-行策-event-closed-study
  date: '1678'
  year_of: 1678
  title_zh: 阖户烧香悟重离精义
  description: 旅堂谢世后蕴怀数年，因禅者劝请，阖户烧香三复遗言，觉精义于重离一卦层见迭出
- id: guji-行策-event-six-diagrams
  date: '1679'
  year_of: 1679
  title_zh: 作六种图说成宝镜三昧本义
  description: 抽绎爻象之绪，作宝镜正偏三迭五变二喻六爻六种图说，发明一卦具三德三昧之旨
- id: guji-行策-event-death
  date: '1682'
  year_of: 1682
  title_zh: 示寂于虞山
  description: 清康熙二十一年示寂，世寿五十五，著述收入续藏经禅宗杂著部流传后世
