  archetype: 禅净兼弘之高僧
  dilemmas:
  - key: 密显之难
    title_zh: 密授与显说之难
    description: 洞下三昧本室中密授以防渗漏，若公开图说恐违祖制，若不说则讹舛日甚
  - key: 破立之难
    title_zh: 攻谬与全身之难
    description: 欲辩觉范永觉诸老异说之谬，又恐辱先宗招毁誉，知我罪我难以两全
  lesson: 抉幽发微以正本源，不计毁誉以续慧命
  summary_first_person: 吾荆溪行策，受旅堂之托，愍洞宗本源三昧讹舛，阖户烧香，三复遗言，悟精义于重离一卦，作六种图说以发明之，惟愿后学不迷正偏回互之旨
  source_urls:
  - https://daizhige.org/宝镜三昧本义.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/宝镜三昧本义.md
endeavors:
