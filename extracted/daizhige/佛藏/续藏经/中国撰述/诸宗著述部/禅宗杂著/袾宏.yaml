  decisions:
  - date: '1609'
    title_zh: 录图颂重寿诸梓
    rationale: 悯学人得少为足，欲借十图次第使俯察已臻仰希未到
  - date: '1609'
    title_zh: 明示图颂亦成剩语
    rationale: 为一超直入者留向上关，不使滞于阶级名相
events:
- id: guji-袾宏-event-birth
  title_zh: 出生于杭州
  date: '1535'
  year_of: 1535
  description_zh: 明嘉靖十四年生于钱塘，俗姓沈。
- id: guji-袾宏-event-ordination
  title_zh: 出家受具参禅
  date: '1566'
  year_of: 1566
  description_zh: 三十二岁弃儒出家，受具足戒，参究禅旨，后归心念佛。
- id: guji-袾宏-event-yunqi
  title_zh: 住持云栖建丛林
  date: '1571'
  year_of: 1571
  description_zh: 入居杭州云栖，修复殿宇，结茅弘道，严净戒律，四众归仰。
- id: guji-袾宏-event-preface
  title_zh: 为牧牛图作序付梓
  date: '1609'
  year_of: 1609
  description_zh: 万历己酉如来诞日，作牧牛图序，论遗教牧牛至十图双泯，付梓流通。
- id: guji-袾宏-event-death
  title_zh: 示寂于云栖
  date: '1615'
  year_of: 1615
  description_zh: 明万历四十三年示寂，世寿八十一，后世尊为净土宗第八祖。
