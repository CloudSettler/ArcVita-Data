  lesson: 离念息缘不求速成，四威仪易脱互修，渐次入无相方为摩诃衍禅要
  summary_first_person: 我是北天竺婆罗门禅师佛陀波利，唐云觉爱，仪凤二年客游西京禅林寺，应沙门明恂之请随问略说，由梵僧慧智传译，我主大乘止观人法双除，以四威仪印法摄心，从鼻端垂露到脐泉顶贯而入无相，劝令起慈悲离攀缘不堕苦行魔事
  source_urls:
