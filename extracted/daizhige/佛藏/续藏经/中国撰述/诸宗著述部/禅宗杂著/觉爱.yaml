      - 游化
      - 印证
    start_date: '0660'
    highlight_event_id: guji-觉爱-event-1
  - key: climax
    name: 东来大唐传授易脱禅
    labels:
      zh:
      - 东来
      - 传授
    start_date: '0677'
    highlight_event_id: guji-觉爱-event-1
  - key: closure
    name: 示以离念精进得果
    labels:
      zh:
      - 付嘱
      - 离念
    start_date: 0680
    highlight_event_id: guji-觉爱-event-2
  decisions:
  - date: '0660'
    title_zh: 不住一地游化印证
    rationale: 以佛经行处与弥勒经行处等圣迹坚定四威仪皆是印法之信解
  - date: '0677'
    title_zh: 坚持渐授不许顿说无相
    rationale: 初机猕猴尚可坐禅，须从长安一城渐摄至鼻端，不可躐等而致失心
- id: guji-觉爱-endeavor-2
  title_zh: 仪凤二年长安口授修禅要诀
  summary: 于西京禅林寺应明恂启请随问略说，破禅定时久近之疑，授结跏经行住卧轨则与定相魔事对治，由明恂随录慧智传译成一卷
  phases:
  - key: brewing
    name: 明恂迎请申疑
    labels:
      zh:
      - 迎请
      - 问难
    start_date: '0677'
    highlight_event_id: guji-觉爱-event-1
  - key: breakthrough
    name: 随问略说破疑
    labels:
      zh:
      - 问答
      - 破疑
    start_date: '0677'
    highlight_event_id: guji-觉爱-event-1
  - key: climax
    name: 授四威仪与观境次第
    labels:
      zh:
      - 授法
      - 次第
    start_date: '0677'
    highlight_event_id: guji-觉爱-event-2
  - key: closure
    name: 随录传译成卷流布
    labels:
      zh:
      - 笔录
      - 传译
    start_date: '0677'
    highlight_event_id: guji-觉爱-event-3
  decisions:
  - date: '0677'
    title_zh: 有问随说不具顿陈
    rationale: 禅法合当渐授，既欲西还不忍阻机缘，故随问而说以全渐次
  - date: '0677'
    title_zh: 以右压左为印法不从此方擅改
    rationale: 西方诸佛相承坐法皆右压左手足皆是印法，故正身端坐易脱互修以防魔事
events:
- id: guji-觉爱-event-birth
  type: birth
  date: '0630'
