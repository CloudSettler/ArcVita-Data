  description: 约唐初贞观年间生于北天竺婆罗门族，少习多闻后专禀摩诃衍禅法
  place_zh: 北天竺
- id: guji-觉爱-event-1
  type: career
  date: '0677'
  year_of: 677
  title_zh: 仪凤二年西京禅林寺随问说禅
  description: 大唐仪凤二年丁丑客游长安，应禅林寺沙门明恂之请，答时远不合修禅与失心废行之疑，判为魔说偏举，劝决定修定
  place_zh: 西京禅林寺
- id: guji-觉爱-event-2
  type: career
  date: '0677'
  year_of: 677
  title_zh: 授四威仪印法与鼻端脐顶观
  description: 授结跏右压左经行直往直来住立卧右胁等轨则，令先住长安渐摄鼻端垂露脐泉顶贯而入无相，并示定前光明香气等相与魔事对治
  place_zh: 西京禅林寺
- id: guji-觉爱-event-3
  type: career
  date: '0677'
  year_of: 677
  title_zh: 明恂随录慧智传译成书
  description: 明恂问并随口录，同寺梵僧慧智传译，成修禅要诀一卷，兼明持戒破戒皆可学禅与临终排恶趣之益
  place_zh: 西京禅林寺
- id: guji-觉爱-event-death
  type: death
  date: 0690
  year_of: 690
  title_zh: 西归后示寂
  description: 还国弘化后示寂，学人传其离念精进如磨铁锤作针之喻，后世以修禅要诀一卷流布显密禅要
  place_zh: 北天竺
