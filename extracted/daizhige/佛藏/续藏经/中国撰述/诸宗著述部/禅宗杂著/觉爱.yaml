endeavors:
- id: guji-觉爱-endeavor-1
  title_zh: 北天竺禀承摩诃衍禅并西域游化
  summary: 于北天竺禀承禅法，谙悉四威仪印法与渐次方便，游化乌苌诸国印证经行遗迹，后东来大唐弘传显密兼具之禅
  phases:
  - key: brewing
