endeavors:
- id: guji-达磨-endeavor-1
  title_zh: 西来传心面壁安心
  summary: 自西土航海至梁魏，以直指人心对机，面壁嵩山以待慧可
  phases:
  - key: brewing
    name: 西土习定慧
    labels:
      zh:
      - 习法
    start_date: 0485-01-01
    highlight_event_id: guji-达磨-event-birth
  - key: breakthrough
    name: 金陵对武帝
    labels:
      zh:
      - 传法
    start_date: 0520-01-01
    highlight_event_id: guji-达磨-event-meet-liangwu
  - key: climax
    name: 少林面壁九年
    labels:
      zh:
      - 安心
    start_date: 0523-01-01
    highlight_event_id: guji-达磨-event-facewall
  - key: closure
    name: 付法慧可北传
    labels:
      zh:
      - 付嘱
    start_date: 0527-01-01
    highlight_event_id: guji-达磨-event-facewall
  decisions:
  - date: 0520-06-01
    title_zh: 不许造寺度僧为真功德
    rationale: 功在心净不在事相故须破有为之执
  - date: 0523-03-01
    title_zh: 决计面壁息言以观心
    rationale: 多言不契钝根故以默示净心恒乐之理
- id: guji-达磨-endeavor-2
  title_zh: 说破相论破执显真
  summary: 以问答破伽蓝像塔香花礼拜之相，显戒定慧慈悲即心之实
  phases:
  - key: brewing
    name: 对机见钝根迷事
    labels:
      zh:
      - 观察
    start_date: 0524-01-01
    highlight_event_id: guji-达磨-event-facewall
  - key: breakthrough
    name: 立观心总摄诸法
    labels:
      zh:
      - 立宗
    start_date: 0525-01-01
    highlight_event_id: guji-达磨-event-poxiang
  - key: climax
    name: 重释六度三聚温室念佛
    labels:
      zh:
      - 破相
    start_date: 0526-01-01
    highlight_event_id: guji-达磨-event-poxiang
  - key: closure
    name: 付偈求心心是佛
    labels:
      zh:
      - 总结
    start_date: 0527-06-01
    highlight_event_id: guji-达磨-event-poxiang
  decisions:
  - date: 0525-01-01
    title_zh: 唯立观心为省要法门
    rationale: 心为万法根本故少力易成胜于心外别求
  - date: 0526-05-01
    title_zh: 转三毒六贼为戒定慧六度
    rationale: 制心即具众德故借有为喻无为以导迷者
events:
- id: guji-达磨-event-birth
  date: 0470-01-01
  year_of: 470
  title_zh: 诞生于南天竺
  description: 相传为香至王第三子，习大乘空宗而通达心宗
  place_zh: 南天竺
- id: guji-达磨-event-meet-liangwu
  date: 0520-10-01
  year_of: 520
  title_zh: 航海至梁见武帝
  description: 与武帝论造寺度僧之功，示无为真功在心净不在事相
  place_zh: 建康
- id: guji-达磨-event-facewall
  date: 0523-01-01
  year_of: 523
  title_zh: 渡江面壁嵩山少林
  description: 九年面壁安心，待慧可断臂求法而付心印
  place_zh: 嵩山少林
- id: guji-达磨-event-poxiang
  date: 0526-05-01
  year_of: 526
  title_zh: 说破相论示观心
  description: 以问答明观心摄诸法，重释伽蓝香花六度念佛皆归自心
  place_zh: 嵩山
- id: guji-达磨-event-death
  date: 0528-12-15
  year_of: 528
  title_zh: 示寂于嵩山
  description: 付法慧可以后，端然示寂，塔于熊耳山
  place_zh: 嵩山
