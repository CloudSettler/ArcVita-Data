endeavors:
- id: guji-退隐-endeavor-1
  title_zh: 会通禅教述作龟鉴
  summary: 据世尊三处传心与一代教海，辨禅是佛心教是佛语，示不变随缘顿悟渐修
  phases:
  - key: brewing
    name: 曹溪薙发出家习教观心
    labels:
      zh: 出家学道
    start_date: 1543-01-01
    highlight_event_id: guji-退隐-event-1
  - key: breakthrough
    name: 拈狗子无字透脱活句
    labels:
      zh: 参究悟入
    start_date: 1560-01-01
    highlight_event_id: guji-退隐-event-1
  - key: climax
    name: 提唱禅教一致撰成龟鉴
    labels:
      zh: 述作垂训
    start_date: 1585-01-01
    highlight_event_id: guji-退隐-event-1
  - key: closure
    name: 流通龟鉴示不自屈不自高
    labels:
      zh: 流通付嘱
    start_date: 1600-01-01
    highlight_event_id: guji-退隐-event-1
  decisions:
  - date: 1560-06-01
    title_zh: 舍死句参活句
    rationale: 参句径截无心路语路，参意落闻思，故专举狗子无字疑来疑去
  - date: 1585-03-01
    title_zh: 先教后禅放下教义参究
    rationale: 须先以教门委辨性相始终，然后放下教义将现前一念参详方有所得
- id: guji-退隐-endeavor-2
  title_zh: 以戒定慧摄持禅行
  summary: 明淫杀盗妄四戒为根，守本真心，兼持咒礼拜念佛，以敌生死
  phases:
  - key: brewing
    name: 深观四恩无常警策身心
    labels:
      zh: 警策自省
    start_date: 1565-01-01
    highlight_event_id: guji-退隐-event-2
  - key: breakthrough
    name: 制伏魔境打成一片
    labels:
      zh: 调弦用功
    start_date: 1575-01-01
    highlight_event_id: guji-退隐-event-2
  - key: climax
    name: 访明师决择正眼流通悲愿
    labels:
      zh: 悟后保任
    start_date: 1595-01-01
    highlight_event_id: guji-退隐-event-2
  - key: closure
    name: 劝往生示自性弥陀不废他力
    labels:
      zh: 慈悲摄众
    start_date: 1602-01-01
    highlight_event_id: guji-退隐-event-death
  decisions:
  - date: 1575-08-01
    title_zh: 立三无漏学为宗
    rationale: 带淫杀盗妄修禅必成魔道，故以戒器定水慧月为万法之源
  - date: 1602-04-01
    title_zh: 会自性弥陀与愿力往生
    rationale: 性虽是佛行是众生，悟后仍须渐修，故不废称名十声往生莲胎
events:
- id: guji-退隐-event-birth
  date: 1528-01-01
  year_of: 1528
  title_zh: 诞生于朝鲜
  description: 退隐诞生，宿具善根，后投曹溪出家
- id: guji-退隐-event-1
  date: 1585-01-01
  year_of: 1585
  title_zh: 述禅家龟鉴
  description: 会禅教二途，示参狗子无字话头三要，诫持戒渐修而成书
- id: guji-退隐-event-2
  date: 1595-01-01
  year_of: 1595
  title_zh: 住持弘法示细行
  description: 示四恩四大无常，劝持戒忍辱念佛看经，呵名利衲子
- id: guji-退隐-event-death
  date: 1605-01-01
  year_of: 1605
  title_zh: 示寂
  description: 工夫打成一片，眼光落地不为恶业所率，安然示寂
