  dilemmas:
  - 禅教分河饮水如何会归一源
  - 顿悟虽彻习气未除如何渐修保任
  lesson: 以持戒为器以禅定为水以慧月为照，参活句透祖师关，不自屈不自高
  summary_first_person: 吾乃曹溪退隐，见末世学者执名生解，遂述禅家龟鉴，直指一物，劝人参狗子无佛性活句，持戒渐修以续佛慧命
