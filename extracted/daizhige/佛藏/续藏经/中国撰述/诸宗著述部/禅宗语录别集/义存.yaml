events:
- id: guji-义存-event-birth
  title_zh: 泉州南安诞生
  date: 0822
  year_of: 822
  place_zh: 泉州南安曾氏家
  description_zh: 家世奉佛，襁褓恶荤茹，闻钟梵旛华必动容。
- id: guji-义存-event-tonsure
  title_zh: 依庆玄落发往幽州受戒
  date: 0839
  year_of: 839
  place_zh: 莆田玉涧寺后至幽州宝刹寺
  description_zh: 十二从父游玉涧见庆玄即拜为师，十七落发，后谒芙蓉弘照，往幽州受具足戒。
- id: guji-义存-event-canshan
  title_zh: 参洞山作饭头复谒德山
  date: 0857
  year_of: 857
  place_zh: 洞山后至德山
  description_zh: 洞山淘米斫槽蒸饭等机锋皆契合德山因缘，问宗乘有分无，初棒下不会，再请益闻无语句实无一法与人大有省。
- id: guji-义存-event-awakening
  title_zh: 鳌山镇阻雪蒙岩头印可成道
  date: 0860
  year_of: 860
  place_zh: 澧州鳌山镇
  description_zh: 与岩头同行阻雪，具陈盐官色空入处洞山过水偈德山桶底脱见解，岩头斥从门入者非家珍，教从胸襟流出，言下大悟，号鳌山成道。
- id: guji-义存-event-xuefeng
  title_zh: 唐咸通中归闽创雪峰院
  date: 0864
  year_of: 864
  place_zh: 闽中雪峰
  description_zh: 回闽创院，徒侣翕然，上堂勘验，空手去空手归，水牯牛七十九等机锋大播。
- id: guji-义存-event-title
  title_zh: 懿宗锡号真觉赐紫袈裟
  date: 0870
  year_of: 870
  place_zh: 雪峰寺
  description_zh: 道望隆重，懿宗锡号真觉禅师，仍赐紫袈裟，领袖丛林。
- id: guji-义存-event-teaching
  title_zh: 住持垂语接众四十年
  date: 0895
  year_of: 895
  place_zh: 雪峰道场
  description_zh: 日常上堂垂语，呵掠虚依通，示临河渴死饭箩受饥之病，嗣法玄沙师备鼓山神晏等，为石头五叶嫡传。
- id: guji-义存-event-death
  title_zh: 后梁开平中示寂
  date: 0908
  year_of: 908
  place_zh: 雪峰寺
  description_zh: 住持垂四十年，法席极盛，示寂后语录由玄沙稿及云水全帙流传，明林弘衍等编次刊行。
