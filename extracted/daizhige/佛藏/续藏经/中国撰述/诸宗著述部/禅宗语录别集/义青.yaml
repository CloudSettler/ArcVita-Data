events:
- id: guji-义青-event-birth
  title_zh: 诞生
  date: '1032'
  year_of: 1032
  place: 青社
  description: 俗姓李氏青社李氏子生于北宋明道元年
- id: guji-义青-event-ordination
  title_zh: 出家得度习教
  date: '1039'
  year_of: 1039
  place: 妙相寺
  description: 七岁颖异自往妙相寺出家试经得度习百法论后入洛听华严宛若贯珠号青华严
- id: guji-义青-event-awakening
  title_zh: 参浮山远大悟
  date: '1060'
  year_of: 1060
  place: 会圣岩
  description: 梦见青鹰而往浮山圆鉴法远处受教参不问有言无言话三年掩口而大悟云设有也须吐却复经三载尽契洞下宗旨
- id: guji-义青-event-succession
  title_zh: 受大阳顶相嘱续宗风
  date: '1063'
  year_of: 1063
  place: 浮山
  description: 受大阳顶相皮履直裰及传法偈代续宗风潜众十年后方宣扬交众作务十二载依圆通秀韬晦
- id: guji-义青-event-abbot
  title_zh: 住投子山开法
  date: '1070'
  year_of: 1070
  place: 舒州投子山
  description: 唱新丰雪曲排洞上妙灯上堂示徒举正偏圆色妙及平常无生无私无尽三句
- id: guji-义青-event-teaching
  title_zh: 化道楷等传洞上心印
  date: '1078'
  year_of: 1078
  place: 投子山
  description: 接道楷问家常茶饭外为人处以拂撼口使大悟许以不疑之地法嗣八人住芙蓉石门泐潭等枝蔓天下
- id: guji-义青-event-death
  title_zh: 示寂谥妙续大师
  date: '1083'
  year_of: 1083
  place: 投子山
  description: 深入报身无差稳现华严妙相示寂敕谥妙续大师丹霞三世孙子淳撰跋记其事
