    highlight_event_id: guji-了堂惟一-event-2
  decisions:
  - date: '1342-10-01'
    title_zh: 入门即诫莫存知解
    rationale: 泥牛吼月木马追风，法印利益世间，不堕情识搏量
  - date: '1342-10-01'
    title_zh: 为国开堂直指脑后一句
    rationale: 一切智智清净无二，灯笼露柱交参处吹出万年欢，护持圣君贤相大法
