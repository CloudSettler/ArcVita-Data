    start_date: '1341-01-01'
    highlight_event_id: guji-了堂惟一-event-2
  decisions:
  - date: '1330-08-05'
    title_zh: 应请住持蕞尔江干禅林
    rationale: 宿缘难避，土面灰头亦须为蛇画足，竖拂举扬超情绝谓
  - date: '1330-08-05'
    title_zh: 升座先拈香祝圣报恩
    rationale: 金轮统御国泰为先，次酬竺元道法乳之恩，不忘本源
- id: guji-了堂惟一-endeavor-2
  title_zh: 继席台州紫箨山广度禅寺
  summary_zh: 至正二年冬入紫箨广度，踵混源密等名德旧席，为国开堂，举夹山境等公案，冬至岁除元旦次第说法。
  phases:
  - key: brewing
    name: 奉命继席
    labels:
