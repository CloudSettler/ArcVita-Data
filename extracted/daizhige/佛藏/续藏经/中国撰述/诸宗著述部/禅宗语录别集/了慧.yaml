    name: 住平江定慧开法
    labels:
      zh: 初住弘法
    start_date: 1245
    highlight_event_id: guji-西岩了慧-event-dinghui
  - key: breakthrough
    name: 住雁山能仁安居
    labels:
      zh: 安居提唱
    start_date: 1248
    highlight_event_id: guji-西岩了慧-event-nengren
  - key: climax
    name: 住东林重振法社
    labels:
      zh: 重振颓纲
    start_date: 1250
    highlight_event_id: guji-西岩了慧-event-donglin
  - key: closure
    name: 奉诏入住天童景德
    labels:
      zh: 入主天童
    start_date: 1252-11-15
    highlight_event_id: guji-西岩了慧-event-tiantong
  decisions:
  - date: 1250
    title_zh: 破戒重建法社
    rationale: 为成就已进已退者，不惜破十余年缄默，重振颓纲，再举宗旨。
  - date: 1252-11-15
    title_zh: 应诏入主天童
    rationale: 以法门大局为重，入主太白名山，荷担应庵家风，续佛慧命。
- id: guji-西岩了慧-endeavor-2
  title_zh: 提唱删定语录传宗
  summary_zh: 五会提唱皆手自删定，拈古举古，超宗逸格，门人修义景元宗清等编成上下二卷。
  phases:
  - key: brewing
    name: 随处拈提积累
    labels:
      zh: 积累提唱
    start_date: 1245
    highlight_event_id: guji-西岩了慧-event-dinghui
  - key: breakthrough
    name: 东林天童升堂举古
    labels:
      zh: 举古拈古
    start_date: 1250
    highlight_event_id: guji-西岩了慧-event-donglin
  - key: climax
    name: 手自删定五会语录
    labels:
      zh: 删定语录
    start_date: 1252-11-15
    highlight_event_id: guji-西岩了慧-event-tiantong
  - key: closure
    name: 门人编次流通
    labels:
      zh: 编录流通
    start_date: 1263
    highlight_event_id: guji-西岩了慧-event-death
  decisions:
  - date: 1252
    title_zh: 亲手删定提唱
    rationale: 恐滥觞错传，故五会提唱皆手自删定，務使正眼流通，无可投者。
  - date: 1263
    title_zh: 付门人编录付梓
    rationale: 以门人修义景元宗清等分编上下卷，立法语偈颂行状，使后学有据。
events:
- id: guji-西岩了慧-event-birth
  title_zh: 诞生
  date: 1198
  year_of: 1198
  place_zh: 中国江南
  description_zh: 南宋嘉熙前后诞生，宿具善根，后投径山佛鉴禅师得法。
- id: guji-西岩了慧-event-dinghui
  title_zh: 住平江定慧禅寺说法
  date: 1245
  year_of: 1245
  place_zh: 平江府定慧禅寺
  description_zh: 拈衣升座祝圣酬法乳，浴佛中秋开炉上堂，机锋峻烈，初显跨灶之风。
- id: guji-西岩了慧-event-nengren
  title_zh: 住温州雁山能仁禅寺
  date: 1248
  year_of: 1248
  place_zh: 温州雁山能仁禅寺
  description_zh: 入院升堂结夏小参，举睡龙主丈米仓保寿等公案，示同箩同饭安居之旨。
- id: guji-西岩了慧-event-donglin
  title_zh: 住江州东林禅寺重振法社
  date: 1250
  year_of: 1250
  place_zh: 江州东林禅寺
  description_zh: 面对青山重开法社，冬至臈八元正上元皆有提唱，谢两班秉拂，颓纲复振。
- id: guji-西岩了慧-event-tiantong
  title_zh: 淳祐十二年入住天童景德禅寺
  date: 1252-11-15
  year_of: 1252
  place_zh: 庆元府天童景德禅寺
  description_zh: 十一月十五日入院，指三门佛殿方丈法座，祝香升座，拈提大白启米胡诸则，声价喧湖海。
- id: guji-西岩了慧-event-death
  title_zh: 示寂
  date: 1263
  year_of: 1263
  place_zh: 天童或瑞岩
  description_zh: 景定前后示寂，门人编语录上下卷，淮海元肇序于景定癸亥，赞其超宗逸格截铁斩钉。
