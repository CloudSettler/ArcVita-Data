  archetype: 跨灶弘法禅师
  dilemmas:
  - 将错就错中重振颓纲而严持宗眼
  - 随缘历住名刹而直截截断葛藤
  lesson: 超宗逸格不在多言，守定本分，随处作主，方能将错就错而不失正眼。
  summary_first_person: 吾承径山佛鉴法乳，历住定慧能仁东林天童诸刹，提唱皆手自删定，贵在超宗逸格，截铁斩钉，愿后人莫向言句蹉过，直下承当。
