  description_zh: 瓦砾堆头示现宝坊，特书新扁开选佛场，拈黄龙南隆庆闲好僧堂公案以验来学
- id: guji-介清-event-ciyi
  person_qid: guji-介清
  type: career
  date: 1275
  year_of: 1275
