    title_zh: 以丝纶香饵垂示沙门行
    rationale: 万顷烟波中直下垂丝纶，借云门会不得之话令学人不贪香饵而直下承当
  - date: 1269
    title_zh: 灯夕移山门直指佛地
    rationale: 借一灯明门门有路之喻，令诸人不移脚跟径登佛地，不向外驰求
- id: guji-介清-endeavor-2
  person_qid: guji-介清
  title_zh: 住持湖州道场禅寺弘法
  summary_zh: 迁住湖州道场山禅寺，三门佛殿据室升座，重兴僧堂选佛场，蒙赐金襕袈裟及佛海性空师号，四时结制解制皆有提持
