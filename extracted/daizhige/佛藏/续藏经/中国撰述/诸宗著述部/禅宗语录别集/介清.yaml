  - date: 1273
    title_zh: 瓦砾堆头别开选佛场
    rationale: 于旧地特书新扁立僧堂，以一梁对一柱之实地接引后学续慧命于万世
  - date: 1275
    title_zh: 奉金襕师号仍显本分
    rationale: 上感皇恩而以万年松祝圣，不忘全身奉重之旨，显扬佛海性空而不立知见
