  description_zh: 万顷烟波一天风月下升座垂语，提持过量事，据大座宴安自若，收放自由
- id: guji-介清-event-kaishou-jiefen
  person_qid: guji-介清
  type: career
  date: 1269
  year_of: 1269
  title_zh: 开寿冬节灯夕上堂
  description_zh: 冬节示不可以智知，灯夕示一灯明门门有路，腊八示住山忙似出山忙，中夏示必竟空
