  decisions:
  - date: 1623
    title_zh: 禅教律并弘不局一途
    rationale: 以正中妙挟为宗而以经律儒释会归一雪痛快绵密高古平实皆为接机
  - date: 1652
    title_zh: 晚年自编付梨枣公世
    rationale: 恐斯言泯而宗灭故命嗣法道霈重编三十卷使后人因言见心不入邪林
events:
- id: guji-元贤-event-birth
  date: 1578
  year_of: 1578
  title_zh: 出生
  description: 明万历六年生早专鲁诰善朱程之学学贯天人
- id: guji-元贤-event-ordination
  date: 1617
  year_of: 1617
  title_zh: 四十出家入寿昌法社
  description: 壮岁弃儒入博山寿昌社火参一口气不来向何处去话久之有得
- id: guji-元贤-event-enlightenment
  date: 1623
  year_of: 1623
  title_zh: 四十六岁悟道
  description: 在寿昌博山座下悟明心地得法印后归闽潜修涵养到家
- id: guji-元贤-event-first-abbot
  date: 1634
  year_of: 1634
  title_zh: 五十七岁出世住福州鼓山涌泉寺
  description: 首开堂说法祝延圣寿升座拈香机辩自在丛林耆衲腰包来觐士大夫折节问道
- id: guji-元贤-event-zhenji
  date: 1637
  year_of: 1637
  title_zh: 应请住泉州开元杭州真寂剑州宝善
  description: 历主四刹说法普说小参拈古颂古佛事问答禅余内外集多成于此时
- id: guji-元贤-event-death
  date: 1657
  year_of: 1657
  title_zh: 八十岁鼓山坐脱入灭
  description: 临终说偈辞众危然坐脱头正尾正嗣法道霈建州弟子刊最后语行业曲记及传行世
