  archetype: 曹洞中兴弘法禅师
  dilemmas:
  - 明末机锋流弊中如何令人真参实悟不落偷心
  - 承寿昌中兴重任与守山静修之间如何抉择
  lesson: 不画地为牢，不弄捏怪机锋，直指愤地悟入，转身通气，断人命根
  summary_first_person: 吾乃寿昌无明座下东苑晦台元镜，泰昌庚申开堂于建阳一枝山，结制接众，痛斥操弄机锋之弊，惟愿学者自断命根，自寻出路，共续洞上正宗
