endeavors:
- id: guji-晦台元镜-endeavor-1
  title_zh: 建阳一枝山开堂结制弘法
  summary_zh: 泰昌庚申冬开堂结制，拈香祝圣，立建化门庭，接待勘验四句，接引士庶，冬至腊八除夕元旦上元皆有示众
  phases:
  - key: brewing
    name: 嗣法寿昌蓄势待发
    labels:
      zh: 嗣法蓄势
    start_date: 1620-10-01
    highlight_event_id: guji-晦台元镜-event-kaidang
  - key: breakthrough
    name: 一枝山开堂结制
    labels:
      zh: 开堂结制
    start_date: 1620-11-01
    highlight_event_id: guji-晦台元镜-event-kaidang
  - key: climax
    name: 冬至至元旦连番上堂
    labels:
      zh: 冬春弘法
    start_date: 1620-12-22
    highlight_event_id: guji-晦台元镜-event-yuandan
  - key: closure
    name: 解制辞众入山
    labels:
      zh: 解制入山
    start_date: 1621-03-01
    highlight_event_id: guji-晦台元镜-event-jiezhi
  decisions:
  - date: 1620-11-01
    title_zh: 拈三瓣香开堂立宗
    rationale: 一祝当今圣寿，一报檀越护法，一酬寿昌本师，以明续洞上正宗之志
  - date: 1621-01-01
    title_zh: 元旦唱不离当念即具万行
    rationale: 破历劫修行之执，显当念圆具，以接上根，兼贺新君即位
- id: guji-晦台元镜-endeavor-2
  title_zh: 嗣承寿昌宗风四方示众成录
  summary_zh: 承寿昌无明慧经中兴之绪，于会心园静观堂黄华等地示众，拈颂古则，接龙湖浪等嗣法门人，由道盛集录成书，崇祯丙子李长庚作序
  phases:
  - key: brewing
    name: 随寿昌参究得法
    labels:
      zh: 嗣法得旨
    start_date: 1615-01-01
    highlight_event_id: guji-晦台元镜-event-kaidang
  - key: breakthrough
    name: 四处示众转身接物
    labels:
      zh: 示众接物
    start_date: 1621-04-01
    highlight_event_id: guji-晦台元镜-event-huixin
  - key: climax
    name: 拈颂世尊祖师古则
    labels:
      zh: 拈古颂古
    start_date: 1622-01-01
    highlight_event_id: guji-晦台元镜-event-niangu
  - key: closure
    name: 门人集录长庚作序
    labels:
      zh: 集录流通
    start_date: 1636-05-12
    highlight_event_id: guji-晦台元镜-event-xu
  decisions:
  - date: 1621-04-01
    title_zh: 不守一山随缘示众
    rationale: 以活意接人，或致八达衢头，或致悬崖万仞，使学者自断命根
  - date: 1636-05-12
    title_zh: 许门人道盛集录流通
    rationale: 使石头鈯斧重破天荒，嵩岳曹溪山高水长，不负寿昌真父之托
events:
- id: guji-晦台元镜-event-birth
  type: birth
  title_zh: 生于明万历间
  date: 1575-01-01
  year_of: 1575
  is_circa: true
  place_zh: 闽地
  description: 生年不详，约明万历间人，后嗣法寿昌无明慧经，号晦台，住东苑
- id: guji-晦台元镜-event-kaidang
  type: endeavor
  title_zh: 泰昌庚申冬建阳一枝山开堂结制
  date: 1620-11-01
  year_of: 1620
  place_zh: 建阳一枝山
  description: 拈香三瓣，祝延圣寿，报檀越，酬寿昌本师，答第一义及临济三句问，立建化接待勘验宗旨
- id: guji-晦台元镜-event-yuandan
  type: endeavor
  title_zh: 天启元年元旦上堂唱三般胜事
  date: 1621-01-01
  year_of: 1621
  place_zh: 建阳一枝山
  description: 以今上登极山呼万年为胜事，唱不离当念即具不可说佛刹微尘数菩萨妙行
- id: guji-晦台元镜-event-jiezhi
  type: endeavor
  title_zh: 解制辞众欲向千万峰头去
  date: 1621-03-01
  year_of: 1621
  place_zh: 建阳一枝山
  description: 以一结一解为千古风规，付拄杖子，众请久住，要于拄杖头边道一句，长啸归去
- id: guji-晦台元镜-event-huixin
  type: endeavor
  title_zh: 会心园静观堂黄华示众
  date: 1621-06-01
  year_of: 1621
  place_zh: 会心园静观堂
  description: 示会得心来，与张居士黄孝廉柯居士问答，举韩文公参大颠，点生死结交处
- id: guji-晦台元镜-event-niangu
  type: endeavor
  title_zh: 拈颂世尊拈花达磨面壁等古则
  date: 1622-01-01
  year_of: 1622
  place_zh: 东苑
  description: 拈世尊初生雪山悟道灵山拈花，达磨面壁青原石头南岳磨砖德山末后句赵州勘婆等，皆有拈语颂文
- id: guji-晦台元镜-event-xu
  type: endeavor
  title_zh: 崇祯丙子李长庚作东苑语录序
  date: 1636-05-12
  year_of: 1636
  place_zh: 楚黄
  description: 李长庚叙与袁石公论宗风及遇龙湖浪请益五家宗旨事，称东苑有寿昌为真父有龙湖为真子，门人道盛集录
- id: guji-晦台元镜-event-death
  type: death
  title_zh: 圆寂于崇祯后
  date: 1640-01-01
  year_of: 1640
  is_circa: true
  place_zh: 闽地
  description: 卒年不详，崇祯丙子作序时尚有语录流通，示寂事迹不载
