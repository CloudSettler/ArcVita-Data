endeavors:
- id: guji-净端-endeavor-1
  title_zh: 吴山隐修弄师子悟道
  goal: 一参宗匠顿悟全机，退隐本山游戏三昧示现师子奋迅
  phases:
  - key: brewing
    name: 归安肄业吴山解空
    labels:
      zh: 出家肄业
    start_date: 1055
    highlight_event_id: guji-净端-event-birth
  - key: breakthrough
    name: 见弄师子发明心要参翠峰月得三昧
    labels:
      zh: 顿悟游戏
    start_date: 1070
    highlight_event_id: guji-净端-event-longhua
  - key: climax
    name: 退隐本山自号安闲作寒山拾得之流
    labels:
      zh: 隐逸弘化
    start_date: 1072
    highlight_event_id: guji-净端-event-yinxi
  - key: closure
    name: 师子语录脍炙人口法孙辑录流通
    labels:
      zh: 遗化流通
    start_date: 1135
    highlight_event_id: guji-净端-event-death
  decisions:
  - date: 1072
    title_zh: 退隐本山不就繁华
    rationale: 三千法席众少投机，独得荒凉之乐，守安闲以全机用
  - date: 1073
    title_zh: 披彩帛作师子皮弄乡里
    rationale: 以游戏三昧破玄解执，令当人时时省捕不随八风
- id: guji-净端-endeavor-2
  title_zh: 应请住持寿圣西余灵山行化
  goal: 应士大夫太守之请，住持小刹修造殿堂祈雨化缘警世
  phases:
  - key: brewing
    name: 刘谊请住长兴寿圣
    labels:
      zh: 初住行化
    start_date: 1080
    highlight_event_id: guji-净端-event-shousheng
  - key: breakthrough
    name: 西余大觉祈雨修造入城化缘
    labels:
      zh: 祈雨化缘
    start_date: 1084-09-01
    highlight_event_id: guji-净端-event-huayuan
  - key: climax
    name: 住灵山孝感与章惇吕大防王安石酬唱
    labels:
      zh: 士大夫酬唱
    start_date: 1090
    highlight_event_id: guji-净端-event-lingshan
  - key: closure
    name: 作十愁十空丰年词警世退归林下
    labels:
      zh: 警世退隐
    start_date: 1130
    highlight_event_id: guji-净端-event-tuiling
  decisions:
  - date: 1080
    title_zh: 受请住持寿圣禅刹
    rationale: 公文已至辞不获免，勉旃向前随缘为人何妨行化
  - date: 1084-09-01
    title_zh: 元丰七年入城乞化修殿堂
    rationale: 宝殿大柱僧堂正门颓损，箱无寸帛，自知福薄不怨他人，徧扣豪门以续慧命
  - date: 1095
    title_zh: 退灵山归岩畔作闲人
    rationale: 思量祖教苦极，辞归林下报佛深恩，不打鼓笛聒噪他人
events:
- id: guji-净端-event-birth
  title_zh: 生于湖州归安丘氏
  date: 1040
  year_of: 1040
  place_zh: 湖州归安
  description: 族姓丘氏，受业吴山解空院，字明表
- id: guji-净端-event-longhua
  title_zh: 参临安龙华齐岳得法
  date: 1070
  year_of: 1070
  place_zh: 临安龙华院
  description: 一参宗匠顿悟全机，解不存玄见量颖脱，复见翠峰月得游戏三昧
- id: guji-净端-event-yinxi
  title_zh: 退隐吴山自号安闲弄师子
  date: 1072
  year_of: 1072
  place_zh: 湖州吴山
  description: 四住小刹皆荒凉不给，独得其乐，以彩帛像师子皮而衣之，作诗颂如寒山拾得
- id: guji-净端-event-shousheng
  title_zh: 应刘谊请住长兴寿圣升堂
  date: 1080
  year_of: 1080
  place_zh: 长兴寿圣禅寺
  description: 太博士承野翁请住持，拈帖升堂说梦，示师子儿生下便能大哮吼
- id: guji-净端-event-huayuan
  title_zh: 元丰七年中秋入城化缘修造西余
  date: 1084-09-01
  year_of: 1084
  place_zh: 西余大觉禅寺
  description: 因四大相逼思换宝殿大柱修僧堂正门，入城徧扣豪门，人人欢喜而舍微，归岩观月誓弘般若
- id: guji-净端-event-lingshan
  title_zh: 住灵山孝感与章吕酬唱祈雨
  date: 1090
  year_of: 1090
  place_zh: 灵山孝感禅院
  description: 童申公送入院，歌渔父升座，西余祈雨顷刻下雨，往来章惇王安石吕大防，作十愁十空观贫恤民
- id: guji-净端-event-tuiling
  title_zh: 退灵山作丰年词警世
  date: 1134-05-01
  year_of: 1134
  place_zh: 吴山岩畔
  description: 谢章庭臣李八入山，作丰年词检点禅宗多端，打睡说熙宁雪中观贫，劝佐圣明莫为私雠
- id: guji-净端-event-death
  title_zh: 示寂于吴山遗语流行
  date: 1135
  year_of: 1135
  place_zh: 湖州吴山
  description: 示寂后百余年微言奥旨脍炙人口，法孙师皎辑酬唱杂著开板流通
