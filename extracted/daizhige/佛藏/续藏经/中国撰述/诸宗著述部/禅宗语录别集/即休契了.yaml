    start_date: '1341-10-04'
    highlight_event_id: guji-即休契了-event-fire
  - key: climax
    name: 瓦砾奋身
    labels:
      zh:
      - 劫灰守志
      - 示众明心
    start_date: '1344-01-01'
    highlight_event_id: guji-即休契了-event-vow
  - key: closure
    name: 化缘兴建
    labels:
