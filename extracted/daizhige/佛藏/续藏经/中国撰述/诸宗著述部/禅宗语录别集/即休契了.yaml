  birth_date: '1269'
  death_date: '1350'
  era: 元朝
  reign_ref: 元惠宗至正年间
  archetype: 劫灰中兴型禅师
  dilemmas:
  - 去留之抉择，预知灾劫当退院避难，众请复住当顺缘承劫
  - 兴废之担当，殿塔尽毁当化缘重建，力薄愿大当以诗疏感檀
  lesson: 定业难逃而弘愿不舍，守祖庭于瓦砾，续慧命于诗偈疏祭之中
  summary_first_person: 吾即休契了，住持镇江金山，辛巳年七十三，预知山门有灾而退院，众请复住而遭劫火，瓦砾中奋身化缘，以重兴梵刹续灯为己任，诗偈疏祭皆是度世方便
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/即休契了禅师拾遗集.html
