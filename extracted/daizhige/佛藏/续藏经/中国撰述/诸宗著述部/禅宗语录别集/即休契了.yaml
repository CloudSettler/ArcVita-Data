    start_date: '1345-01-01'
    highlight_event_id: guji-即休契了-event-rebuild
  decisions:
  - date: '1341-09-28'
    title_zh: 七十三岁退院避灾
    rationale: 山灵预报十月有灾，老病难任，故上堂白众卸伴云闲，以图免灾
  - date: '1341-10-04'
    title_zh: 应首座孟喆等请复住
    rationale: 寺众不信再三恳留，勉从请再上方丈，共承定业不独避
  - date: '1344-01-01'
    title_zh: 作造寺化疏募缘
    rationale: 寺自东晋裴公建历四劫火，今众屋不存二塔亦毁，非聚檀力不能复旧观
- id: guji-即休契了-endeavor-2
  title_zh: 诗偈说法诸山交化
  summary: 以诗送僧答俗，以疏助诸山住持化缘，以祭文系法谊，拾遗集成宗门交化之网
  phases:
  - key: brewing
    name: 拈香题赞
    labels:
      zh:
      - 达磨拈香
      - 古德题赞
    start_date: '1340-01-01'
    highlight_event_id: guji-即休契了-event-vow
  - key: breakthrough
    name: 送僧答问
    labels:
      zh:
      - 送僧归省
      - 次韵酬答
    start_date: '1341-01-01'
    highlight_event_id: guji-即休契了-event-rebuild
  - key: climax
    name: 诸山疏请
    labels:
      zh:
      - 请住持疏
      - 化缘疏
    start_date: '1344-01-01'
    highlight_event_id: guji-即休契了-event-rebuild
  - key: closure
    name: 祭奠传灯
    labels:
      zh:
      - 祭元叟笑隐等
      - 祭别岸文
    start_date: '1348-07-27'
    highlight_event_id: guji-即休契了-event-mourning
  decisions:
  - date: '1344-05-01'
    title_zh: 为颙长老住鹤林作诸山疏
    rationale: 禅宫败棋须出手兴心人，北山法嗣堪开马素门户，故共推以延季运
  - date: '1348-07-27'
    title_zh: 祭寿山别岸和尚设位奠文
    rationale: 追念兄礼让弘宗之谊，老怀难堪，以文表同门以谕来者
events:
- id: guji-即休契了-event-birth
  title_zh: 诞生
  date: '1269'
  year_of: 1269
  description: 逆推辛巳年七十三，约生于至元六年前后，幼出家参禅
- id: guji-即休契了-event-retire
  title_zh: 辛巳九月退院示众
  date: '1341-09-28'
  year_of: 1341
  description: 年七十三，上堂言十月有难，老病卸职伴云闲，图免山门之灾
- id: guji-即休契了-event-fire
  title_zh: 十月复住遭劫火
  date: '1341-10-27'
  year_of: 1341
  description: 应众复住方丈，是月二十七日晚果灾不救，众屋与双塔化为劫灰
- id: guji-即休契了-event-vow
  title_zh: 劫后三年瓦砾示众
  date: '1344-01-01'
  year_of: 1344
  description: 越三年志之，作偈言瓦砾堆中独奋身，七旬有六犹还债，誓愿重兴
- id: guji-即休契了-event-rebuild
  title_zh: 作造寺及华藏等化疏
  date: '1345-01-01'
  year_of: 1345
  description: 述裴公建寺历梁唐宋四劫火，募财用匠力，以新梵刹双浮图，并助华藏寿星殿经阁钟楼
- id: guji-即休契了-event-mourning
  title_zh: 祭别岸和尚
  date: '1348-07-27'
  year_of: 1348
  description: 至正八年六月三日别岸顺寂，七月二十四日接遗音，二十七日扶惫设奠作祭文，时仍住持金山
- id: guji-即休契了-event-death
  title_zh: 示寂
  date: '1350'
  year_of: 1350
  description: 至正八年后圆寂于金山，世寿八十余，拾遗诗疏由及藏主集录流传
