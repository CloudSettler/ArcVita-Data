endeavors:
- id: guji-古林清茂-endeavor-1
  title_zh: 四坐道场住持弘化
  summary: 自天平白云开堂，历平江开元再住，至饶州永福，四坐道场接引五方英衲
  phases:
  - key: brewing
    name: 天平受请开堂
    labels:
      zh:
      - 天平开堂
      - 白云门风
    start_date: 1298-02-03
    highlight_event_id: guji-古林清茂-event-tianping
  - key: breakthrough
    name: 开元再住声益振
    labels:
      zh:
      - 开元弘法
      - 皇恩佛恩
    start_date: 1310
    highlight_event_id: guji-古林清茂-event-kaiyuan
  - key: climax
    name: 永福宏开解脱门
    labels:
      zh:
      - 永福化众
      - 五方英衲
    start_date: 1320
    highlight_event_id: guji-古林清茂-event-yongfu
  - key: closure
    name: 示寂付嘱后学
    labels:
      zh:
      - 付嘱
      - 圆寂
    start_date: 1329
    highlight_event_id: guji-古林清茂-event-death
  decisions:
  - date: 1298-02-03
    title_zh: 受请入天平白云开堂说法
    rationale: 承横川付嘱，为续杨岐宗风，不辞劳瘁登座竖拂，皇恩佛恩一时报毕
  - date: 1310
    title_zh: 再住开元不舍初心
    rationale: 应众再请，以祝延圣寿、饶益一切，不立高广法座，独步大方
- id: guji-古林清茂-endeavor-2
  title_zh: 重拈雪窦垂训辑录
  summary: 重拈雪窦举古百则，集法语小参普说偈颂真赞，以雪山药树、天竺醍醐示后学
  phases:
  - key: brewing
    name: 上堂小参随机垂训
    labels:
      zh:
      - 上堂
      - 小参普说
    start_date: 1298-02-03
    highlight_event_id: guji-古林清茂-event-tianping
  - key: breakthrough
    name: 重拈雪窦举古百则
    labels:
      zh:
      - 拈古
      - 续宗
    start_date: 1325
    highlight_event_id: guji-古林清茂-event-niangu
  - key: climax
    name: 法语偈颂流通丛林
    labels:
      zh:
      - 法语
      - 偈颂
    start_date: 1327
    highlight_event_id: guji-古林清茂-event-niangu
  - key: closure
    name: 门人编次刊行语录
    labels:
      zh:
      - 编录
      - 刊行
    start_date: 1329
    highlight_event_id: guji-古林清茂-event-death
  decisions:
  - date: 1325
    title_zh: 重拈雪窦举古一百则
    rationale: 恐后箭顿惊啮镞，统宗再续，故窦古重拈，明活句死句，不负雪窦云门
  - date: 1327
    title_zh: 集法语偈颂真赞示后
    rationale: 以镜了影、以谷传音，使垢尽明复，令后学不向第二月作活计
events:
- id: guji-古林清茂-event-birth
  type: birth
  title_zh: 生於台州临海
  date: 1262
  year_of: 1262
  location: 台州临海
  description: 宋理宗景定三年生，俗姓黄，出家后嗣杨岐十世横川行珙
- id: guji-古林清茂-event-tianping
  type: career
  title_zh: 住天平山白云禅寺开堂
  date: 1298-02-03
  year_of: 1298
  location: 平江府天平山白云禅寺
  description: 大德二年二月初三受请入寺，指山门据室升座，祝延圣寿，拈香嗣横川
- id: guji-古林清茂-event-kaiyuan
  type: career
  title_zh: 住平江府开元禅寺及再住
  date: 1310
  year_of: 1310
  location: 平江府开元禅寺
  description: 继天平之后住持开元，再住开元，四坐道场之一，五方英衲交屦
- id: guji-古林清茂-event-yongfu
  type: career
  title_zh: 住饶州永福寺说法
  date: 1320
  year_of: 1320
  location: 饶州永福寺
  description: 住持永福，宏开解脱门，举盘山船子云门公案，接引学人
- id: guji-古林清茂-event-niangu
  type: career
  title_zh: 重拈雪窦举古一百则成编
  date: 1325
  year_of: 1325
  location: 永福寺
  description: 重拈雪窦百则，自跋明宗，兼集法语小参普说偈颂真赞，门人元浩等编
- id: guji-古林清茂-event-death
  type: death
  title_zh: 示寂
  date: 1329
  year_of: 1329
  location: 江南
  description: 元天历二年示寂，世寿六十八，语录七卷由门人刊行，冯子振序之
