endeavors:
- id: guji-善慧大士-endeavor-1
  title_zh: 双林结庵苦行化俗
  summary: 自悟前因后结庵松山双梼树下，佣作蔬食昼作夜讲，化妻子乡里忍谤持戒
  phases:
  - key: brewing
    name: 渔农少年
    labels:
      zh: 农渔养家
    start_date: 0497-05-08
    highlight_event_id: guji-善慧大士-event-birth
  - key: breakthrough
    name: 临水悟因
    labels:
      zh: 遇嵩头陀得悟
    start_date: 336
    highlight_event_id: guji-善慧大士-event-awaken
  - key: climax
    name: 双林苦行
    labels:
      zh: 结庵弘法显异
    start_date: 337
    highlight_event_id: guji-善慧大士-event-shuanglin
  - key: closure
    name: 舍宅设会
    labels:
      zh: 舍田宅鬻身供众
    start_date: 0528
    highlight_event_id: guji-善慧大士-event-giving
  decisions:
  - date: 336
    title_zh: 弃鱼具携行归舍
    rationale: 悟宿因后以度众生为急，不贪兜率天乐，决意修道
  - date: 0528
    title_zh: 舍田宅鬻妻子助法会
    rationale: 先化妻子以导群品，以舍施破悭贪，普为三界众生消灾集福
- id: guji-善慧大士-endeavor-2
  title_zh: 入都见帝弘教舍施
  summary: 三至建康见梁武帝论真谛，奏置双林寺，广写经律，持不食上斋，舍财济贫劝请住世
  phases:
  - key: brewing
    name: 遣使奉书
    labels:
      zh: 条上中下善
    start_date: 346
    highlight_event_id: guji-善慧大士-event-audience
  - key: breakthrough
    name: 阙下论道
    labels:
      zh: 直入善言殿论真谛
    start_date: 347
    highlight_event_id: guji-善慧大士-event-audience
  - key: climax
    name: 营寺写经
    labels:
      zh: 置双林寺躬写千卷
    start_date: 352
    highlight_event_id: guji-善慧大士-event-giving
  - key: closure
    name: 持斋济荒
    labels:
      zh: 不食上斋煮粥救饥
    start_date: 0548
    highlight_event_id: guji-善慧大士-event-famine
  decisions:
  - date: 346
    title_zh: 遣傅暀奉书梁武帝
    rationale: 以虚怀不着为上善，欲借国主之力绍弘正教普度群生
  - date: 0548
    title_zh: 立誓持三年不食上斋并舍田园设会
    rationale: 以饥渴之苦代众生酬偿罪业，请佛住世，普令离苦得解脱
events:
- id: guji-善慧大士-event-birth
  date: 0497-05-08
  year_of: 497
  title_zh: 生于乌伤稽停里
  description: 父宣慈母王氏世为农，端靖淳和，少渔于稽停塘
- id: guji-善慧大士-event-awaken
  date: 336
  year_of: 520
  title_zh: 遇嵩头陀临水悟因
  description: 普通元年年二十四取鱼遇嵩头陀，观影见圆光宝盖，悟毗婆尸佛前度生之愿，弃鱼具结庵双林
- id: guji-善慧大士-event-shuanglin
  date: 343
  year_of: 527
  title_zh: 双林苦行见三佛放光
  description: 种植蔬果为人佣作昼作夜讲苦行七年，宴坐见释迦金粟定光三佛放光，身出妙香，得首楞严三昧
- id: guji-善慧大士-event-audience
  date: 0532-12-19
  year_of: 532
  title_zh: 至蒋山入阙见梁武帝
  description: 遣傅暀奉书条上中下善，直入善言殿登宝榻，论无所从师，帝赐水火珠，止定林寺甘露降
- id: guji-善慧大士-event-giving
  date: 0548-02-15
  year_of: 548
  title_zh: 舍田园产业设普会供养
  description: 太清二年倾资为善供，为六道四生供养三宝，说倾资为善供偈，复欲持不食上斋烧身为灯
- id: guji-善慧大士-event-famine
  date: 0549
  year_of: 549
  title_zh: 散财煮粥济乡邑饥贫
  description: 太清三年梁运将终灾祸竞兴，散资财课徒侣拾野菜煮粥割食济闾里，后助人耕地唯耕亩半
- id: guji-善慧大士-event-death
  date: 0569
  year_of: 569
  title_zh: 示寂
  description: 化缘既毕舍身灭度，世传为弥勒应身，弟子奉语录八卷传后
