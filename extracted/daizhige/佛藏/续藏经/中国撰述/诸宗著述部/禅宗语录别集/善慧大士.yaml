  name_zh: 善慧大士
  names:
    zh: 傅翕
    en: Fu Xi Shan Hui
  lifespan:
    birth:
      date: 0497-05-08
      precision: day
      is_circa: false
      raw: 齐建武四年丁丑岁五月八日
    death:
      date: 0569
      precision: year
      is_circa: true
      raw: 陈太建元年示寂
  birth_date: 0497-05-08
  death_date: 0569
  era: 南北朝梁陈之际
  reign_ref: 南齐建武至梁武帝至陈太建
  archetype: 在家菩萨居士圣者
  dilemmas:
  - 以白衣居士身承担度众重任与世俗毁谤之间的张力
  - 显现神异接引群品与恐人着相迷信之间的分寸
  - 倾尽家资广设法会与自奉极俭之间的取舍
  lesson: 不执出家在家之相，以慈悲布施忍辱直指心性，代众生苦而同登解脱
  summary_first_person: 我姓傅名翕字玄风，东阳乌伤农家子，二十四岁遇嵩头陀而悟宿因，结庵双林蔬食苦行，三至京师见梁武帝论道，舍妻子田宅广设法会，愿以身灯供养三宝普度群生
