person:
  qid: guji-断桥妙伦
  name_zh: 妙伦
  names:
    zh: 妙伦
    en: Miaolun Duanqiao
  lifespan:
    birth:
      date: 1201
      precision: year
      is_circa: true
      raw: 天台人，生年失载，约南宋嘉泰前后
    death:
      date: 1268
      precision: year
      is_circa: true
      raw: 卒年失载，约咸淳以后
  birth_date: 1201
  death_date: 1268
  era: 南宋
  reign_ref: 淳祐咸淳
  archetype: 高僧
  dilemmas:
  - 机锋险峻破的与慈悲接引之间的分寸如何把握
  - 呵佛骂祖的纵横与饮水思源的报恩如何两全
  lesson: 老辣痛快亦须有来历，破的之语本于嗣法报恩与护生持戒的实地。
  summary_first_person: 吾天台妙伦，自号断桥，嗣法径山无准。淳祐初住台州瑞峰祇园，继迁瑞岩净土，复住国清诸刹，直以赤骨力拈出一句子，愿天上人间未闻者闻。
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/断桥妙伦禅师语录.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/断桥妙伦禅师语录.md
endeavors:
- id: guji-断桥妙伦-endeavor-1
  title_zh: 台州两刹住持弘禅
  summary: 淳祐元年入主瑞峰祇园，结夏解夏、中秋冬至皆有提唱，后迁住瑞岩净土，以棒喝拂主丈勘验学人，扫荡野狐放出狮子。
  phases:
  - key: brewing
    name: 行脚拾得拈弄受用
    labels:
      zh: 酝酿
    start_date: 1235
    highlight_event_id: guji-断桥妙伦-event-1
  - key: breakthrough
    name: 初住祇园拈出主丈
    labels:
      zh: 突破
    start_date: 1241-03-11
    highlight_event_id: guji-断桥妙伦-event-1
  - key: climax
    name: 迁住瑞岩七纵八横
    labels:
      zh: 高潮
    start_date: 1244
    highlight_event_id: guji-断桥妙伦-event-2
  - key: closure
    name: 国清教忠灯王续焰
    labels:
      zh: 收束
    start_date: 1250
    highlight_event_id: guji-断桥妙伦-event-3
  decisions:
  - date: 1241-03-11
    title_zh: 入院祇园直指脚下
    rationale: 大道无门，须从脚下践履，不立阶梯处立阶梯，以赤骨力开山。
  - date: 1244
    title_zh: 离瑞阜就鞔峰分宾主
    rationale: 棒头列宾中宾，喝下分主中主，欲于猿啼虎啸处扬清激浊，故不辞迁化。
- id: guji-断桥妙伦-endeavor-2
  title_zh: 嗣法无准编集语录
  summary: 自云居拾香供养无准以酬法乳，拈古颂古、浴佛结夏皆归宗门正眼，示寂后由侍者文宝善清编成上下两卷语录。
  phases:
  - key: brewing
    name: 云居拾香参无准
    labels:
      zh: 酝酿
    start_date: 1238
    highlight_event_id: guji-断桥妙伦-event-3
  - key: breakthrough
    name: 径山酬恩定嗣法
    labels:
      zh: 突破
    start_date: 1241-03-11
    highlight_event_id: guji-断桥妙伦-event-1
  - key: climax
    name: 拈古颂古破的电光
    labels:
      zh: 高潮
    start_date: 1244
    highlight_event_id: guji-断桥妙伦-event-2
  - key: closure
    name: 侍者编录林希逸序
    labels:
      zh: 收束
    start_date: 1265-02-14
    highlight_event_id: guji-断桥妙伦-event-3
  decisions:
  - date: 1241-03-11
    title_zh: 焚香供养无准酬法乳
    rationale: 法乳之恩不可忘，拾得之香须爇向径山，方是知恩报恩的宗门家风。
  - date: 1265-02-14
    title_zh: 付侍者编录付后世猜看
    rationale: 电光石火醍醐毒药俱有，须完整编次使具眼者勘验，不使蠹蚀散佚。
events:
- id: guji-断桥妙伦-event-birth
  title_zh: 生于天台
  date: 1201
  year_of: 1201
  place_zh: 天台
  summary: 妙伦生于天台，俗家生平失载，后出家参学，号断桥。
- id: guji-断桥妙伦-event-1
  title_zh: 淳祐元年入主瑞峰祇园
  date: 1241-03-11
  year_of: 1241
  place_zh: 台州瑞峰祇园禅寺
  summary: 三月十一日入院，指三门佛殿法座升座，拈香供养径山无准，拈主丈酬法乳，冬夏皆有小参上堂。
- id: guji-断桥妙伦-event-2
  title_zh: 迁住瑞岩净土禅寺
  date: 1244
  year_of: 1244
  place_zh: 台州瑞岩净土禅寺
  summary: 出瑞峰入瑞岩，指门揖佛登座，举主人翁话拈古，结夏解夏提唱乾坤一宝，谢两堂秉拂监收。
- id: guji-断桥妙伦-event-3
  title_zh: 国清弘化语录编成行世
  date: 1265-02-14
  year_of: 1265
  place_zh: 天台国清教忠禅寺
  summary: 住国清及净报诸刹后，侍者文宝善清编上下两卷，林希逸于咸淳初元人日作序，称其老辣痛快险怪奇绝。
- id: guji-断桥妙伦-event-death
  title_zh: 示寂
  date: 1268
  year_of: 1268
  place_zh: 天台
  summary: 晚年行状失详，约咸淳年间示寂，语录及法语偈颂小佛事传世。
