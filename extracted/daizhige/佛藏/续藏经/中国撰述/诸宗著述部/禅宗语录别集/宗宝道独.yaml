endeavors:
- id: guji-宗宝道独-endeavor-1
  title_zh: 参究悟道嗣法博山
  summary: 因即心是佛而信入，遇坛经而醒，遍研五宗至极头还归本来，嗣博山无异法脉
  phases:
  - key: brewing
    name: 闻即心是佛信入
    labels:
      zh: 信入本心
    start_date: 1615-01-01
    highlight_event_id: guji-宗宝道独-event-wudao
  - key: breakthrough
    name: 坛经一言便醒遍研
    labels:
      zh: 参究遍研
    start_date: 1625-01-01
    highlight_event_id: guji-宗宝道独-event-wudao
  - key: climax
    name: 极头还归本来嗣法
    labels:
      zh: 彻悟嗣法
    start_date: 1632-01-01
    highlight_event_id: guji-宗宝道独-event-sifa
  - key: closure
    name: 拟深隐不露
    labels:
      zh: 守本深隐
    start_date: 1635-01-01
    highlight_event_id: guji-宗宝道独-event-sifa
  decisions:
  - date: 1625-01-01
    title_zh: 舍他向专究自心
    rationale: 既信即心是佛必无他向，故参究问学费尽心神以求醒
  - date: 1632-01-01
    title_zh: 归博山法乳嗣脉
    rationale: 本法不曾动着一毫，缘熟而契，酬法乳之恩以直指接人
- id: guji-宗宝道独-endeavor-2
  title_zh: 华首开堂接众成录
  summary: 应缘华首长庆开堂，上堂示众结夏解夏，随问随答，门人抄录成宗宝道独语录六卷
  phases:
  - key: brewing
    name: 缘熟囊锥始露
    labels:
      zh: 出世缘熟
    start_date: 1645-01-01
    highlight_event_id: guji-宗宝道独-event-kaitang
  - key: breakthrough
    name: 华首重开拈香开堂
    labels:
      zh: 开堂弘法
    start_date: 1650-04-08
    highlight_event_id: guji-宗宝道独-event-kaitang
  - key: climax
    name: 结夏解夏勘验提持
    labels:
      zh: 领众勘验
    start_date: 1655-07-01
    highlight_event_id: guji-宗宝道独-event-jiexia
  - key: closure
    name: 随录成册固请流通
    labels:
      zh: 成录流通
    start_date: 1660-01-01
    highlight_event_id: guji-宗宝道独-event-death
  decisions:
  - date: 1650-04-08
    title_zh: 开堂直指回光达本
    rationale: 为令学人放下伎俩回光达本，不随语句，不立一法与人
  - date: 1660-01-01
    title_zh: 许抄录刊刻流通
    rationale: 诸子固请不已，虽止之再三，不忍违缘，姑从流通以示后学
events:
- id: guji-宗宝道独-event-birth
  title_zh: 出生
  date: 1600-01-01
  year_of: 1600
  place: 中国
  summary: 宗宝道独生於明末，夙具佛缘
- id: guji-宗宝道独-event-wudao
  title_zh: 遇坛经一言便醒遍研五宗
  date: 1625-01-01
  year_of: 1625
  place: 中国
  summary: 一闻即心是佛便信得及，偶遇坛经如甘露灌顶，嗣后参究问学遍研五宗及诸祖钳锤
- id: guji-宗宝道独-event-sifa
  title_zh: 究极还归嗣博山无异
  date: 1632-01-01
  year_of: 1632
  place: 博山
  summary: 至极头处还归本来，了知用功毕竟非别有，嗣江西博山无异大和尚法脉，酬法乳恩
- id: guji-宗宝道独-event-kaitang
  title_zh: 华首开堂上堂示众
  date: 1650-04-08
  year_of: 1650
  place: 华首长庆罗浮
  summary: 华首重开拈香奉博山先师，竖拂上堂直指人心，浴佛结夏端午等随节示众，提持向上不容毫发
- id: guji-宗宝道独-event-jiexia
  title_zh: 结夏解夏勘辨学人
  date: 1655-07-01
  year_of: 1655
  place: 华首
  summary: 一夏领众参究，以万象独露身及无头尾一物勘验，令独行独步壁立万仞
- id: guji-宗宝道独-event-death
  title_zh: 示寂并语录行状塔铭成
  date: 1661-01-01
  year_of: 1661
  place: 华首
  summary: 示寂后门人函昰等编语录六卷，附行状塔铭，自序言取信於心不求人信而许流通
