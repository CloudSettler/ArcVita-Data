  description: 得请罢慧林后退隐苏州灵岩山秀峰寺作山居二十首及岁旦免人事等颂示随缘任运居山不见山之旨并接引诸方长老化主
- id: guji-宗本-event-death
  date: 1099
  year_of: 1099
  title_zh: 示寂于灵岩
  description: 北宋元符二年于灵岩丈室示寂世寿八十僧腊六十余付法门人继踵弘化朝野同悼
