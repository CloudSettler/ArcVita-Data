  description: 北宋天禧年间生于常州无锡幼怀出尘丱岁入空门后参禅悟入续云门之灯
- id: guji-宗本-event-huilin
  date: 1083
  year_of: 1083
  title_zh: 诏住慧林禅院
  description: 元丰六年奉神宗皇帝诏住持京师慧林禅院大振宗风号圆照
- id: guji-宗本-event-funing
  date: 1085-04-10
  year_of: 1085
  title_zh: 福宁殿为神宗灵驾升座
  description: 元丰八年四月初十日哲宗宣入内于福宁殿为大行神宗皇帝灵驾前升座拈香说法祝仙驾超升净域并祝今上太皇太后等福寿
- id: guji-宗本-event-yitian
  date: 1086-03-01
  year_of: 1086
  title_zh: 接待高丽僧统义天
  description: 元祐元年三月初一日高丽僧统义天入寺请升座以华严法界观相质师直指见性成佛劝吞却一喝莫辜负言诠并作颂美其万顷洪波为法忘躯
- id: guji-宗本-event-lingyan
