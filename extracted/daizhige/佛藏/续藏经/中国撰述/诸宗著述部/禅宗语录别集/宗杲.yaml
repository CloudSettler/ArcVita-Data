  lesson: 枷上着杻自透自脱，不向言句觅玄妙，直下承当方为自在
  summary_first_person: 吾妙喜宗杲，嗣圆悟而倡看话，历径山衡阳梅州而不悔，愿学者不滞文字，自悟西来直指
