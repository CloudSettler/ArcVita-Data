person:
  qid: guji-师备
  name_zh: 师备
  names:
    zh: 玄沙师备
    en: Xuansha Shibei
  lifespan:
    birth:
      date: 0835
      precision: year
      is_circa: true
      raw: 唐咸通初年甫三十推算闽县谢氏生
    death:
      date: 0908
      precision: year
      is_circa: true
      raw: 后梁开平二年示寂相传
  birth_date: 0835
  death_date: 0908
  era: 唐末五代
  reign_ref: 唐咸通
  archetype: 禅宗宗师
  dilemmas:
  - 遍参诸方与当下承当之抉择
  - 方便言说与宗乘直指之张力
  lesson: 放下意度商量，直下承当金刚正体，方出生死罗网
  summary_first_person: 吾闽县谢氏子，少喜渔钓，三十弃舟出家，亲近雪峰，趯足悟道，阅楞严发明心地，住玄沙接引来学，只教当人自承当现成具足
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/玄沙师备禅师广录.md
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/玄沙师备禅师广录.html
endeavors:
- id: guji-师备-endeavor-1
  title_zh: 弃钓出家雪峰参悟
  summary_zh: 自南台渔钓转身出尘，投芙蓉落发，豫章受具，亲近雪峰，以趯足痛悟入道
  phases:
  - key: brewing
    name: 南台垂钓蕴酿出尘
    labels:
      zh: 蕴酿
    start_date: 0835
    highlight_event_id: guji-师备-event-birth
  - key: breakthrough
    name: 咸通弃舟落发受具
    labels:
      zh: 突破
    start_date: 0860
    highlight_event_id: guji-师备-event-1
  - key: climax
    name: 筑足趯倒顿悟身非有
    labels:
      zh: 高潮
    start_date: 0862
    highlight_event_id: guji-师备-event-2
  - key: closure
    name: 回归雪峰晨昏咨决
    labels:
      zh: 收束
    start_date: 0863
    highlight_event_id: guji-师备-event-2
  decisions:
  - date: 0860
    title_zh: 弃钓舟投芙蓉灵训落发
    rationale: 忽慕出尘，不忍生涯杀业，愿求解脱，故舍渔具礼训禅师为师
  - date: 0862
    title_zh: 中途折返不遍参去
    rationale: 达摩不来东土，二祖不往西天，痛即菩提，何必远求，故回雪峰安住用功
- id: guji-师备-endeavor-2
  title_zh: 住持玄沙阐扬宗乘
  summary_zh: 同雪峰缔构象骨，阅楞严发明心地，应机敏捷，日本高丽皆来决疑，示纲宗三句接引后学
  phases:
  - key: brewing
    name: 象骨同力缔构玄徒臻萃
    labels:
      zh: 蕴酿
    start_date: 0875
    highlight_event_id: guji-师备-event-3
  - key: breakthrough
    name: 阅楞严发明心地应机冥契
    labels:
      zh: 突破
    start_date: 0880
    highlight_event_id: guji-师备-event-3
  - key: climax
    name: 开堂示众金刚正体垂慈接引
    labels:
      zh: 高潮
    start_date: 0890
    highlight_event_id: guji-师备-event-4
  - key: closure
    name: 示纲宗三句开方便门
    labels:
      zh: 收束
    start_date: 0905
    highlight_event_id: guji-师备-event-4
  decisions:
  - date: 0875
    title_zh: 登象骨与雪峰同建道场
    rationale: 师资相契，大法当举，众人臻萃须安顿，故同力缔构不别栖他方
  - date: 0905
    title_zh: 示纲宗三句破依语生解
    rationale: 疾大法难举学者随照失宗，故立第一句自承当现成具足以开正信
events:
- id: guji-师备-event-birth
  title_zh: 生于福州闽县谢家
  date: 0835
  year_of: 835
  place_zh: 福州闽县
  description: 谢氏子生，幼好垂钓，泛艇南台江与渔者狎
- id: guji-师备-event-1
  title_zh: 咸通初年出家受具
  date: 0860
  year_of: 860
  place_zh: 芙蓉山豫章开元寺
  description: 年甫三十弃钓舟投芙蓉灵训落发，往豫章开元寺道玄律师处受具，布衲芒屦终日宴坐
- id: guji-师备-event-2
  title_zh: 携囊出岭趯足悟道回归雪峰
  date: 0862
  year_of: 862
  place_zh: 雪峰
  description: 欲遍参出岭筑着脚指流血，叹是身非有痛从何来，便回雪峰，对答终不敢诳人，深得雪峰印可为再来人
- id: guji-师备-event-3
  title_zh: 登象骨缔构阅楞严发明心地
  date: 0875
  year_of: 875
  place_zh: 象骨山玄沙
  description: 与雪峰同力缔构象骨，入室咨决罔替晨昏，阅楞严发明心地，应机敏捷与修多罗冥契，诸方请益征诘不让
- id: guji-师备-event-4
  title_zh: 开堂示众立纲宗三句
  date: 0900
  year_of: 900
  place_zh: 福州玄沙
  description: 升座垂示金刚眼睛秘密金刚体，呵依语生解，立第一句自承当现成具足开方便门，日本高丽万里决疑
- id: guji-师备-event-death
  title_zh: 玄沙示寂
  date: 0908
  year_of: 908
  place_zh: 福州玄沙
  description: 住持弘化数十年后示寂，语录三卷由林弘衍搜辑后世广传
