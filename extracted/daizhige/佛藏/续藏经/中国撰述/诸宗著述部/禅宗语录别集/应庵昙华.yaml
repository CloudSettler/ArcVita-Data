endeavors:
- id: guji-应庵昙华-endeavor-1
  title_zh: 参学得法嗣虎丘绍隆
  summary_zh: 挂锡天台护国为元布袋称赏请为第一座，后嗣平江虎丘绍隆，荷担杨岐正印，期振一宗
  phases:
  - key: brewing
    name: 天台挂锡声名籍甚
    labels:
      zh: 参学蓄势
    start_date: 1130
    highlight_event_id: guji-应庵昙华-event-dharma
  - key: breakthrough
    name: 嗣法虎丘付正法眼
    labels:
      zh: 得法承印
    start_date: 1135
    highlight_event_id: guji-应庵昙华-event-dharma
  decisions:
  - date: 1135
    title_zh: 酬法乳爇香虎丘隆和尚
    rationale: 明果开堂三拈香特为先师隆和尚酬恩，不忘所承，以定杨岐嫡嗣之分
- id: guji-应庵昙华-endeavor-2
  title_zh: 遍住名山天童大兴
  summary_zh: 自处州妙严首座道场，历桐山明果德章安国饶州莞山庐山归宗婺州宝林东林蒋山报恩，至明州天童法席尤盛，门人守诠等编十卷语录
  phases:
  - key: brewing
    name: 初住妙严竖拂全提
    labels:
      zh: 首住开法
    start_date: 1147
    highlight_event_id: guji-应庵昙华-event-miaoyan
  - key: climax
    name: 绍兴丙子衢途遇钱端礼
    labels:
      zh: 名重诸方
    start_date: 1156
    highlight_event_id: guji-应庵昙华-event-baihe
  - key: closure
    name: 最后天童肩摩袂属
    labels:
      zh: 天童中兴
    start_date: 1160
    highlight_event_id: guji-应庵昙华-event-tiantong
  decisions:
  - date: 1147
    title_zh: 受请入院处州妙严开堂
    rationale: 以宝剑挥空掀翻是非窠窟立宗旨，奠定遍住名山之始
  - date: 1160
    title_zh: 住持天童景德随根普化
    rationale: 法席最盛随器得益，付嘱崭然出头之密庵咸杰守诠等，使杨岐再振并勒语录传后
events:
- id: guji-应庵昙华-event-birth
  title_zh: 蕲州出生江氏
  date: 1103
  year_of: 1103
  place_zh: 蕲州蕲水
  description_zh: 北宋崇宁二年生于蕲州，俗姓江，后出家名昙华，号应庵
- id: guji-应庵昙华-event-dharma
  title_zh: 参虎丘绍隆得法
  date: 1135
  year_of: 1135
  place_zh: 平江虎丘山云岩
  description_zh: 挂锡天台护国为元布袋称赏请为第一座，后参宣州彰教及虎丘绍隆得法，嗣其法乳，列临济杨岐嫡嗣
- id: guji-应庵昙华-event-miaoyan
  title_zh: 初住处州妙严开堂
  date: 1147
  year_of: 1147
  place_zh: 处州妙严禅院
  description_zh: 初住妙严升座拈左司度疏为无尽藏顶王三昧，竖拂云天上有星皆拱北人间无水不朝东，开启历住诸方之化
- id: guji-应庵昙华-event-baihe
  title_zh: 绍兴丙子白鹤夜话钱端礼
  date: 1156
  year_of: 1156
  place_zh: 衢州白鹤寺
  description_zh: 绍兴丙子去郡三衢道遇钱端礼，少留白鹤寺夜话终夕论辩如大川东注，预期必振杨岐一宗，后果遍住名山
- id: guji-应庵昙华-event-tiantong
  title_zh: 住明州天童法席大盛
  date: 1160
  year_of: 1160
  place_zh: 明州天童山景德禅寺
  description_zh: 历住桐山明果安国光孝莞山归宗宝林东林蒋山报恩后，最后住天童，云衲归重肩摩袂属，随根器皆有所得，门人守诠编语录十卷
- id: guji-应庵昙华-event-death
  title_zh: 天童示寂
  date: 1163
  year_of: 1163
  place_zh: 明州天童山
  description_zh: 南宋隆兴元年八月示寂于天童，世寿六十一，塔铭祭文附于语录卷末，法嗣密庵咸杰等大振宗风
