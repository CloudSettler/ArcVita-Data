  era: 南宋
  reign_ref: 宋高宗绍兴至宋孝宗隆兴之际
  archetype: 中兴宗师
  dilemmas:
  - 道本不可以言传情解识识，而为后学不得不立言垂录，以黄叶止啼而又恐人执叶为实
  - 峻提正印棒喝交驰以夺人境，而又须随其根器咸令有得，刚柔出没难两全
  lesson: 从苗辩地因语识人，借语录话行而终须超脱语录，咬定活句方见杨岐家风
  summary_first_person: 吾江氏子蕲水人，名昙华，号应庵，嗣虎丘绍隆，遍住妙严明果安国光孝归宗东林蒋山以至天童，惟以铁壁银山截断情识，愿后人着精彩于言外而自见本来
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/应庵昙华禅师语录.html
