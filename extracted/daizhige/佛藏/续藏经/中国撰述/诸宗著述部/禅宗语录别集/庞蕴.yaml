person:
  qid: guji-庞蕴
  name_zh: 庞蕴
  names:
    zh: 庞蕴
    en: Pang Yun
  lifespan:
    birth:
      date: '0740'
      precision: year
      is_circa: true
      raw: 衡州衡阳县人世本儒业少悟尘劳
    death:
      date: 0808
      precision: year
      is_circa: true
      raw: 元和中北游襄汉枕节度使于頔膝而化遗命焚弃江
  birth_date: '0740'
  death_date: 0808
  era: 唐
  reign_ref: 贞元元和
  archetype: 白衣居士
  dilemmas:
  - 缁素之间如何明道愿从所慕而不剃染
  - 日用搬柴运水即是神通妙用如何开口道得
  - 有男不婚有女不嫁如何团圞共说无生而全家解脱
  lesson: 日用事无别头头非取舍运水与搬柴即神通并妙用但愿空诸所有慎勿实诸所无
  summary_first_person: 吾衡阳庞蕴字道玄也少悟尘劳贞元初谒石头掩口而省复参马祖吸尽西江而领玄旨留驻二载不剃染而为居士与丹霞药山大梅松山诸老往复机锋鬻竹漉篱以供朝夕有男不婚有女不嫁共说无生临行视日而女灵照先登座亡吾枕于公膝而去皆如影响耳
  source_urls:
  - https://daizhige.org/庞居士语录.html
  - https://github.com/daizhige-org/daizhigev20庞居士语录.md
endeavors:
- id: guji-庞蕴-endeavor-1
  title_zh: 参谒石头马祖悟入玄旨
  goal_zh: 不与万法为侣处顿领玄旨立居士身
  phases:
  - key: brewing
    name: 少悟尘劳志求真谛
    labels:
      zh: 儒业转向
    start_date: '0770'
    highlight_event_id: guji-庞蕴-event-birth
  - key: breakthrough
    name: 谒石头掩口豁然有省
    labels:
      zh: 石头印可
    start_date: 0784
    highlight_event_id: guji-庞蕴-event-shitou
  - key: climax
    name: 参马祖吸尽西江顿领
    labels:
      zh: 马祖留驻
    start_date: 0786
    highlight_event_id: guji-庞蕴-event-mazu
  - key: closure
    name: 不剃染愿从所慕定居士位
    labels:
      zh: 白衣定格
    start_date: 0788
    highlight_event_id: guji-庞蕴-event-mazu
  decisions:
  - date: 0784
    title_zh: 谒石头问不与万法为侣者
    rationale: 以万法不侣叩宗石头掩口即知开口处无开口处故呈日用偈
  - date: 0786
    title_zh: 之江西再叩马祖留驻二载
    rationale: 待吸尽西江方道直指心空及第故不复他往而参承究竟
- id: guji-庞蕴-endeavor-2
  title_zh: 襄汉鬻篱随机酬问传偈三百
  goal_zh: 以居士日用示无生话全家解脱
  phases:
  - key: brewing
    name: 遍参药山丹霞诸老机锋往复
    labels:
      zh: 诸方参请
    start_date: 0790
    highlight_event_id: guji-庞蕴-event-mazu
  - key: breakthrough
    name: 茅庐难易百草头祖师意家风成
    labels:
      zh: 家风团圞
    start_date: 0795
    highlight_event_id: guji-庞蕴-event-xianghan
  - key: climax
    name: 北游襄汉鬻竹漉篱洪州卖篱化僧
    labels:
      zh: 鬻篱供朝夕
    start_date: 0800
    highlight_event_id: guji-庞蕴-event-xianghan
  - key: closure
    name: 视日早晚女先坐亡枕公膝化
    labels:
      zh: 入灭焚江
    start_date: 0808
    highlight_event_id: guji-庞蕴-event-death
  decisions:
  - date: 0800
    title_zh: 随处而居鬻篱不立寺宇
    rationale: 心如境亦如无实亦无虚护生须杀杀尽始安居故以市井日用为道场
  - date: 0808
    title_zh: 遗命焚弃江不立坟塔
    rationale: 好住世间皆如影响空诸所有故不留形骸以累人
events:
- id: guji-庞蕴-event-birth
  title_zh: 生于衡州衡阳儒家
  date: '0740'
  year_of: 740
  place_zh: 衡州衡阳县
  description_zh: 世本儒业少悟尘劳志求真谛后字道玄称庞居士
- id: guji-庞蕴-event-shitou
  title_zh: 贞元初谒石头豁然有省
  date: 0784
  year_of: 784
  place_zh: 南岳石头处
  description_zh: 问不与万法为侣者是什么人石头以手掩口豁然有省呈日用事无别偈石头然之问缁耶素耶答愿从所慕遂不剃染
- id: guji-庞蕴-event-mazu
  title_zh: 之江西参马祖顿领玄旨留驻二载
  date: 0786
  year_of: 786
  place_zh: 江西马祖处
  description_zh: 再问不与万法为侣者马祖道待汝一口吸尽西江水即向汝道言下顿领呈有心空及第偈留驻二载作有男不婚有女不嫁大家团圞头共说无生话偈
- id: guji-庞蕴-event-xianghan
  title_zh: 元和中北游襄汉鬻篱酬问诸老
  date: 0800
  year_of: 800
  place_zh: 襄汉洪州茅庐
  description_zh: 与女灵照鬻竹漉篱以供朝夕往复药山丹霞百灵普济松山大梅诸老随问随答洪州市卖笊篱试僧不辜负信施茅庐作难易偈传诗偈三百余篇
- id: guji-庞蕴-event-death
  title_zh: 视日入灭女先坐亡枕于頔膝化
  date: 0808
  year_of: 808
  place_zh: 襄州
  description_zh: 将入灭令灵照视日早晚报日已中而有蚀出户观时照登父座合掌坐亡笑言我女锋捷吏延七日州牧于頔问疾付嘱但愿空诸所有慎勿实诸所无好住世间皆如影响言讫枕公膝而化遗命焚弃江时谓毗耶净名
