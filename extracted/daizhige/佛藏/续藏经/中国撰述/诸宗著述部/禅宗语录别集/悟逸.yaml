events:
- id: guji-悟逸-event-birth
  title_zh: 诞生
  date: 1268
  year_of: 1268
  summary: 生年不详，约元初诞生，后嗣佛心大和尚法
- id: guji-悟逸-event-zaizhu
  title_zh: 延佑元年闰三月初一日进寺再住雪峰
  date: 1314-04-23
  year_of: 1314
  summary: 捧圣旨再住福州路雪峰崇圣禅寺，步步升高，道无所希求自天而至
- id: guji-悟逸-event-kaitang
  title_zh: 开堂拈香祝延圣寿
  date: 1314-04-23
  year_of: 1314
  summary: 开堂之次遥瞻金阙爇香，祝今上万岁，次为宰相藩府资陪禄算
- id: guji-悟逸-event-tigang
  title_zh: 提纲酬法乳了旧案
  date: 1314-05-01
  year_of: 1314
  summary: 举法灯为清凉了公案事，自言为佛心先师未了公案而出，传佛心宗
- id: guji-悟逸-event-xieliangban
  title_zh: 谢新旧两班建立宗旨
  date: 1314-06-01
  year_of: 1314
  summary: 举临济建立黄檗宗旨事，勉大众各住本位各务本业水乳一源
- id: guji-悟逸-event-jiexia
  title_zh: 结夏小参拈主丈
  date: 1314-06-15
  year_of: 1314
  summary: 道在稊稗瓦砾，拈主丈论禁足安居，灵灵自照卷舒无碍
- id: guji-悟逸-event-kanbian
  title_zh: 勘巴陵法眼等诸方公案
  date: 1314-07-15
  year_of: 1314
  summary: 拈巴陵问游山僧，真觉握拳示森罗，曹源一滴水等，辨佛法与人情
- id: guji-悟逸-event-jiadian
  title_zh: 月朔架佛殿并舍藏经铸钟立碑
  date: 1315-01-15
  year_of: 1315
  summary: 幻普光明殿现丈六金身，为吴国公舍藏经立碑兼铸钟，梵策重宣
- id: guji-悟逸-event-jiexia2
  title_zh: 解夏小参论去住印
  date: 1315-09-10
  year_of: 1315
  summary: 去则印住住则印破不去不住，九十日拖柴拽木晏起早眠眼不见为净
- id: guji-悟逸-event-death
  title_zh: 示寂
  date: 1332
  year_of: 1332
  summary: 卒年不详，约元中期后示寂，语录由侍者正定编为雪峰再住语录上下卷
