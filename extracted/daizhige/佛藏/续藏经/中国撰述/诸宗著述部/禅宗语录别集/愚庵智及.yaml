  - key: closure
    name: 语录付梓塔铭流传
    labels:
      zh: 宋濂作序
    start_date: 1375-02-21
    highlight_event_id: guji-愚庵智及-event-death
  decisions:
  - date: 1350-01-01
    title_zh: 晋住净慈报恩禅寺
    rationale: 由普慈而净慈，扩大弘化，扫荡陈年露布，斩新旧日风规，直指平常心是道
  - date: 1360-01-01
    title_zh: 四据名蓝住径山兴圣万寿
    rationale: 承先师元叟旧席，大机大用如大将临陈，解人胶缠如鹰脱绦，全提正令
events:
- id: guji-愚庵智及-event-birth
  person_qid: guji-愚庵智及
  title_zh: 出生
  date: 1289-01-01
  year_of: 1289
  kind: birth
  description_zh: 生于元至元年间前后，生年失载，幼年出家，后嗣法元叟端。
- id: guji-愚庵智及-event-1342-longjiao
  person_qid: guji-愚庵智及
  title_zh: 初住庆元隆教禅寺
  date: 1342-10-10
  year_of: 1342
  kind: career
  description_zh: 至正壬午十月十日承行宣政院疏请入隆教，指山门升座，为国祝延，举百丈奇特事接众。
- id: guji-愚庵智及-event-1345-puci
  person_qid: guji-愚庵智及
  title_zh: 移住普慈禅寺
  date: 1345-10-01
  year_of: 1345
  kind: career
  description_zh: 至正乙酉十月初一日受请入普慈，烧香祝赞升座，拈云门三香别作话会，祈雨看经示众。
- id: guji-愚庵智及-event-1350-jingci
  person_qid: guji-愚庵智及
  title_zh: 住持杭州净慈报恩禅寺
  date: 1350-01-01
  year_of: 1350
  kind: career
  description_zh: 由普慈晋住净慈报恩，语录三十四条，敷扬佛法，缁素如云归岫。
- id: guji-愚庵智及-event-1360-jingshan
  person_qid: guji-愚庵智及
  title_zh: 初住径山兴圣万寿禅寺
  date: 1360-01-01
  year_of: 1360
  kind: career
  description_zh: 继元叟旧席初住径山，四据名蓝，敷扬佛法以耸人天龙鬼之听。
- id: guji-愚庵智及-event-1366-jingshan-zai
  person_qid: guji-愚庵智及
  title_zh: 再住径山兴圣万寿禅寺
  date: 1366-01-01
  year_of: 1366
  kind: career
  description_zh: 再住径山，语录五十九条，加以小参颂古偈颂，门人观通等会稡成十卷。
- id: guji-愚庵智及-event-death
  person_qid: guji-愚庵智及
  title_zh: 圆寂示灭
  date: 1369-01-01
  year_of: 1369
  kind: death
  description_zh: 洪武初年圆寂，门人编语录十卷，宋濂于洪武八年作四会语序并撰塔铭。
