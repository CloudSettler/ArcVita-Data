    highlight_event_id: guji-愚庵智及-event-1342-longjiao
  - key: climax
    name: 移席普慈
    labels:
      zh: 沧溟驾船
    start_date: 1345-10-01
    highlight_event_id: guji-愚庵智及-event-1345-puci
  - key: closure
    name: 普慈示众圆成
    labels:
      zh: 主宾道合
    start_date: 1346-01-01
    highlight_event_id: guji-愚庵智及-event-1345-puci
  decisions:
  - date: 1342-10-10
    title_zh: 应宣政院请入庆元隆教
    rationale: 远承院命，三江九堰航海梯山，为国开堂，无丝毫瞒人，冀各存诚共相委悉
  - date: 1345-10-01
    title_zh: 受请移住普慈禅寺
    rationale: 自怜宿债难逃，又向沧溟驾船，邀文殊普贤打篙摇橹，普济愚痴下劣众生
- id: guji-愚庵智及-endeavor-2
  person_qid: guji-愚庵智及
  title_zh: 住持净慈径山四会扬宗
  description_zh: 历住杭州净慈报恩，晋住径山兴圣万寿，再住径山，四会语录，会稡成书，宋濂作序，宗风大振。
  phases:
  - key: brewing
