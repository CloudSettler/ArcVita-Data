  birth_date: '1120'
  death_date: '1190'
  era: 南宋
  reign_ref: 宋孝宗淳熙
  archetype: 严冷慈悲的禅门宗师
  dilemmas:
  - 隐遁自守与受府命出山之间的进退
  - 面目严冷喝骂与慈悲接引之间的方便
  - 把住死句与放行活句之间的宗风
  lesson: 转痴钝为俊快，直下承当，不倚他门傍他户，以金刚宝剑截断疑情
  summary_first_person: 吾乃雪峰东山慧空，从前推挽不出，有院不住，嫌佛不做，嫌法不说，今受府命住持雪峰，披毛戴角，横身是非海中，日中一饭，夜中一宿，打就无底铁船，运载情与无情，愿衲子如师子儿哮吼一声，壁立千仞
