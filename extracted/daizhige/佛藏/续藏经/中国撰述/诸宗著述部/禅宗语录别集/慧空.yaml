endeavors:
- id: guji-慧空-endeavor-1
  title_zh: 受请出山住持雪峰
  summary: 自秀峰受府命，转痴钝为俊快，登座入院，拈香祝圣，自述出山因缘
  phases:
  - key: brewing
    name: 秀峰推挽不出
    labels:
      zh: 隐遁守拙
    start_date: '1178-01-01'
    highlight_event_id: guji-慧空-event-1
  - key: breakthrough
    name: 引座登座雪峰
    labels:
      zh: 受命出山
    start_date: '1178-12-01'
    highlight_event_id: guji-慧空-event-1
  - key: climax
    name: 入院升座祝圣
    labels:
      zh: 开堂弘化
    start_date: '1178-12-05'
    highlight_event_id: guji-慧空-event-2
  - key: closure
    name: 当晚小参述怀
    labels:
      zh: 披毛戴角自任
    start_date: '1178-12-05'
    highlight_event_id: guji-慧空-event-2
  decisions:
  - date: '1178-12-01'
    title_zh: 应府命登座雪峰
    rationale: 俊快直行不滞推挽，以欢喜承当令佛祖命脉不断
  - date: '1178-12-05'
    title_zh: 横身是非海自在行去
    rationale: 既无夺帖打回之衲僧，便披毛戴角入豺虎群中弘化
- id: guji-慧空-endeavor-2
  title_zh: 雪峰安居弘法化众
  summary: 结夏安居，上堂小参普说，应供祈雨，以四转语勘验学人，付嘱门人编录语录
  phases:
  - key: brewing
    name: 结夏安居摄众
    labels:
      zh: 以大圆觉为伽蓝
    start_date: '1179-04-15'
    highlight_event_id: guji-慧空-event-3
  - key: breakthrough
    name: 上堂举古立宗
    labels:
      zh: 勘验机锋
    start_date: '1179-05-01'
    highlight_event_id: guji-慧空-event-3
  - key: climax
    name: 普说应供祈雨
    labels:
      zh: 慈悲利物
    start_date: '1179-06-01'
    highlight_event_id: guji-慧空-event-4
  - key: closure
    name: 付嘱编录语录
    labels:
      zh: 传灯后世
    start_date: '1179-10-01'
    highlight_event_id: guji-慧空-event-4
  decisions:
  - date: '1179-05-01'
    title_zh: 举真觉备头陀机缘勘验学人
    rationale: 辨当时肯之与而今打逐之别，令具眼者自辨透关
  - date: '1179-06-01'
    title_zh: 立四转语验天下衲僧
    rationale: 以宾主互换之四句接初机验衲僧，正令行立乾坤
events:
- id: guji-慧空-event-birth
  title_zh: 诞生
  date: '1120'
  year_of: 1120
  location: 未详
  summary: 生年未详，约南宋初诞生，后出家参禅，亲近丛林耆旧
- id: guji-慧空-event-death
  title_zh: 示寂
  date: '1190'
  year_of: 1190
  location: 福州雪峰山
  summary: 寂年未详，淳熙住持雪峰弘化后示寂，门人慧弼编录语录以传
- id: guji-慧空-event-1
  title_zh: 受请登座雪峰
  date: '1178-12-01'
  year_of: 1178
  location: 福州雪峰山
  summary: 秀峰和尚引座，登座答话，转痴钝为俊快，从前不出而今出，从前不住而今住，喝一喝下座
- id: guji-慧空-event-2
  title_zh: 入院升座祝圣小参
  date: '1178-12-05'
  year_of: 1178
  location: 福州雪峰方丈
  summary: 指方丈喝云雪峰方丈也不识，升座拈香祝圣，当晚小参自述闰年春色晚，愿入是非海横身弘化
- id: guji-慧空-event-3
  title_zh: 结夏上堂小参示众
  date: '1179-04-15'
  year_of: 1179
  location: 福州雪峰山
  summary: 结夏安居，以大圆觉为伽蓝，上堂举少室马祖临济德山等公案，喝云河里失钱河里摝，小参拈风穴策问代笔划破
- id: guji-慧空-event-4
  title_zh: 普说应供祈雨祝圣
  date: '1179-06-01'
  year_of: 1179
  location: 福州雪峰山
  summary: 应安抚龙学侍郎斋僧上堂，应施主普说论生死如梦，祈雨卓主丈兴雷雨，圣节祝皇帝寿山福海
