    start_date: 1615
    highlight_event_id: guji-憨山德清-event-caoxi
  decisions:
  - date: 1596
    title_zh: 坦然受谪不怨圣明
    rationale: 以慈心三昧视瘴海为道场，欲搏生死海水取善根众生置佛法中
  - date: 1601
    title_zh: 住持曹溪重建宝林
    rationale: 曹溪涸而祖灯熄，藉谪戍因缘为波澜，令曹源复活普度南粤
  - date: 1615
    title_zh: 嘱门人雠勘遗稿为梦游集
    rationale: 著述援笔立就，恐散佚失次，嘱通炯等编辑刊定以惠后学
events:
- id: guji-憨山德清-event-birth
  title_zh: 生于金陵蔡家
  type: birth
  date: 1546-11-05
  year_of: 1546
  place_zh: 南直隶金陵
  description: 嘉靖二十五年十月十二日生，俗姓蔡，母梦观音抱子而孕
- id: guji-憨山德清-event-ordain
  title_zh: 报恩寺出家受具
  type: endeavor
  date: 1557
  year_of: 1557
  place_zh: 南京报恩寺
  description: 十一岁从西林永宁出家，十九岁受具，遍习内外典，喜楞严华严
- id: guji-憨山德清-event-awaken
  title_zh: 参悟华严法界开悟
  type: endeavor
  date: 1575
  year_of: 1575
  place_zh: 五台山
  description: 游五台悟华严法界，夜梦补处慈氏授法，遂以唯心识智阐教说法
- id: guji-憨山德清-event-preach
  title_zh: 东游说法名动京师
  type: endeavor
  date: 1588
  year_of: 1588
  place_zh: 牢山径山
  description: 结庵牢山，东游讲经，与紫柏达观交深，慈寿开法，缁素云集
- id: guji-憨山德清-event-exile
  title_zh: 以私建寺役获罪谪雷州
  type: endeavor
  date: 1595
  year_of: 1595
  place_zh: 雷州
  description: 万历二十三年坐私造寺院下狱论死，旋充军雷州，孤钵南行，瘴海弘化，感化士民
- id: guji-憨山德清-event-caoxi
  title_zh: 复兴曹溪南华千日道场
  type: endeavor
  date: 1601
  year_of: 1601
  place_zh: 曹溪南华寺
  description: 赦后住曹溪，建千日道场，传戒说法，著楞严通议法华通议道德经注等，重振六祖庭户
- id: guji-憨山德清-event-death
  title_zh: 示寂南华塔全身曹溪
  type: death
  date: 1623-11-28
  year_of: 1623
  place_zh: 南华寺
  description: 天启三年十月七日趺坐示寂，世寿七十八，僧腊五十九，谥弘觉禅师，塔于曹溪
