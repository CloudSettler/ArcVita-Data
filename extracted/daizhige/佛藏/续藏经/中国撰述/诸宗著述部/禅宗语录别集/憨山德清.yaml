  era: 明
  reign_ref: 明嘉靖至天启
  archetype: 禅教圆融中兴高僧
  dilemmas:
  - 以英雄不世出之资当狮弦绝响之候，舍身为法与全身远祸之两难
  - 以禅扶宗以教崇教，机锋斩截与悲婉摄受如何兼济之两难
  lesson: 生死大海皆如梦游，唯真参实悟可超拔，逆境瘴海即是道场
  summary_first_person: 吾德清号憨山，幼出家于报恩，梦授于慈氏，悟彻华严于清凉，横说竖说皆从如来文字海流出，虽谪戍雷州，犹复兴曹溪，愿以一言半句令众生同归智海
  source_urls:
