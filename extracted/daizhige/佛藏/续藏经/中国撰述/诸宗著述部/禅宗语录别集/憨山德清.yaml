    title_zh: 决意舍俗出家报恩寺
    rationale: 幼慕佛门，不恋世荣，立志真参实悟以续慧命
  - date: 1575
    title_zh: 融通禅教华严为归
    rationale: 见宋以来文繁而旨疲，欲以华严法界统摄禅教，令根器各得沾被
- id: guji-憨山德清-endeavor-2
  title_zh: 谪戍瘴海复兴曹溪著述流通
  summary: 以弘法获罪谪戍雷州，转瘴海为法筵，复兴六祖道场，著梦游集四十卷
  phases:
  - key: brewing
    name: 万历末年以法获罪
