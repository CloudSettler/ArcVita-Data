person:
  qid: guji-文琇
  name_zh: 文琇
  names:
    zh: 南石文琇
    en: Nanshi Wenxiu
  lifespan:
    birth:
      date: 1330-01-01
      precision: year
      is_circa: true
      raw: 元末至顺年间前后生
    death:
      date: 1415-01-01
      precision: year
      is_circa: true
      raw: 永乐年间寂于径山寂照塔左
  birth_date: 1330-01-01
  death_date: 1415-01-01
  era: 元末明初
  reign_ref: 明洪武至永乐
  archetype: 禅门宗匠
  dilemmas:
  - 野狐禅盛行诳吓后学时如何以正眼续佛慧命
  - 退隐吴淞乐与野老相从与应诏入京纂修大典之间何去何从
  - 年老多病倦于人事与径山缺席众举补处之间如何担当
  lesson: 不贵奇特只贵明自本心见自本性吃饭着衣处处归源
  summary_first_person: 吾讳文琇字南石，儒释兼备宗说俱通，得法于云岩行中仁，瓣香嗣之，初住苏州普门，次迁灵岩报国永祚，三主万寿报恩光孝，退隐吴淞之上与山翁野老说无义语，后应诏入京纂修永乐大典留京三年，预建报恩大斋会，晚补径山兴圣万寿，登凌霄握竹篦验方来，老病引退卜庐寂照塔左，四会法语由上首宝华文楙裒为一帙以垂后学
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/南石文琇禅师语录.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/南石文琇禅师语录.md
