  summary_first_person: 吾初阅坛经玄觉因缘而起疑情问巩禅师不契遂与天界日兄结伴遍参于育王得佛鉴语心慕径山会佛鉴示疾以偈指吾往天台石桥乃谒国清断桥老师屡遭棒喝因择菜掷苋根而脱然大悟蒙印可为宝侍者彻也后住瑞岩方山以拄杖棒喝接化学人直指自心是佛
