endeavors:
- id: guji-方山文宝-endeavor-1
  title_zh: 遍参求决国清大悟
  summary: 阅坛经起疑历参巩禅师及诸方慕佛鉴赴径山再依断桥于国清苋根因缘下彻悟
  phases:
  - key: brewing
    name: 阅经起疑结伴遍参
    labels:
      zh: 起疑遍参
    start_date: '1110'
    highlight_event_id: guji-方山文宝-event-canxue
  - key: breakthrough
    name: 育王得语径山慕道
    labels:
      zh: 得语慕道
    start_date: '1115'
    highlight_event_id: guji-方山文宝-event-jingshan
  - key: climax
    name: 国清断桥苋根彻悟
    labels:
      zh: 彻悟印可
    start_date: '1117'
    highlight_event_id: guji-方山文宝-event-guoqing-wu
  - key: closure
    name: 蒙印宝侍者彻也
    labels:
      zh: 印可入室
    start_date: '1118'
    highlight_event_id: guji-方山文宝-event-guoqing-wu
  decisions:
  - date: '1110'
    title_zh: 求芟染与日兄结伴参禅
    rationale: 不会巩老意思而具信力大起疑情必要讨个明白故不中止化城而东敲西击
  - date: '1117'
    title_zh: 禀佛鉴遗偈往谒断桥
    rationale: 来时空索索去也赤条条更要问端的天台有石桥故指向国清求最后勘验
- id: guji-方山文宝-endeavor-2
  title_zh: 住持瑞岩方山弘法接机
  summary: 悟后住瑞岩西庵方山升堂小参举古拈拄杖以活句棒喝接引令学人返观话头
  phases:
  - key: brewing
    name: 初住瑞岩西庵
    labels:
      zh: 初住弘化
    start_date: '1130'
    highlight_event_id: guji-方山文宝-event-zhuchi
  - key: breakthrough
    name: 上堂拈古立宗
    labels:
      zh: 拈古立宗
    start_date: '1135'
    highlight_event_id: guji-方山文宝-event-zhuchi
  - key: climax
    name: 小参示做工夫诀
    labels:
      zh: 示工夫诀
    start_date: '1140'
    highlight_event_id: guji-方山文宝-event-shizhong
  - key: closure
    name: 付嘱门人录语流传
    labels:
      zh: 付嘱流通
    start_date: '1148'
    highlight_event_id: guji-方山文宝-event-shizhong
  decisions:
  - date: '1135'
    title_zh: 以棒喝活句接人而不说死句
    rationale: 贵在提持话头返观自看如吃茶去栢树子皆活句可用以截断意识卜度
  - date: '1140'
    title_zh: 示众直指自心是佛
    rationale: 离四句绝百非要信自心是佛佛是自心心外别无别佛故劝保养圣胎随类演化
events:
- id: guji-方山文宝-event-birth
  kind: birth
  title_zh: 出生
  date: '1090'
  year_of: 1090
  description: 约生于北宋末世
- id: guji-方山文宝-event-canxue
  kind: career
  title_zh: 阅坛经问巩禅师结伴参学
  date: '1110'
  year_of: 1110
  description: 偶阅坛经玄觉见六祖因缘而庆快问黄梅衣钵及绍祖位不契求芟染与天界日兄结伴参见数员知识
- id: guji-方山文宝-event-jingshan
  kind: career
  title_zh: 育王得佛鉴语赴径山请遗偈
  date: '1115'
  year_of: 1115
  description: 在育王得佛鉴上堂语心心念念想见闻朝廷诏住径山遂往依佛鉴请示疾遗偈得指天台有石桥
- id: guji-方山文宝-event-guoqing-wu
  kind: career
  title_zh: 国清谒断桥因苋根大悟蒙印可
  date: '1117'
  year_of: 1117
  description: 往谒国清断桥老师入室屡蒙赐棒因纸烛豁然复因择菜掷苋根脱然无碍升堂印为宝侍者彻也
- id: guji-方山文宝-event-zhuchi
  kind: career
  title_zh: 住瑞岩方山西庵上堂弘化
  date: '1130'
  year_of: 1130
  description: 住瑞岩方山结制上堂举临济四夺洞山万里无寸草云门九十日饭钱等拈拄杖棒喝接引四方学者
- id: guji-方山文宝-event-shizhong
  kind: career
  title_zh: 小参示众付嘱门人录语
  date: '1140'
  year_of: 1140
  description: 小参示做工夫提话头返观之诀示众论自心是佛由嗣法门人先睹祖灯等记录后世机云编次
- id: guji-方山文宝-event-death
  kind: death
  title_zh: 圆寂
  date: '1150'
  year_of: 1150
  description: 约寂于南宋初住持弘化之后语录经杇蠧散佚至清康熙年间复被发现流通
