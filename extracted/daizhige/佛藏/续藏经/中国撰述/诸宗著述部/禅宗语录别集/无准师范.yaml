  decisions:
  - date: 1220-04-29
    title_zh: 应请入住庆元清凉寺
    rationale: 以直截机锋奠定宗风，不徇人情，首竖壁立家风
  - date: 1231
    title_zh: 受请长住径山兴圣万寿寺
    rationale: 因缘成熟，当以大炉鞴陶冶四海衲子，故久住不动以成丛林楷范
- id: guji-无准师范-endeavor-2
  title_zh: 上堂小参拈古编成语录奏对
  summary: 随处举扬拈古颂古普说，又以直言奏对理宗，语录由侍者编次流通
  phases:
