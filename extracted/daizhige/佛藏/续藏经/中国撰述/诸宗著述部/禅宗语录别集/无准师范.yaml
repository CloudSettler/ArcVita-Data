    name: 奏对理宗深契宸衷
    labels:
      zh: 奏对说法
    start_date: 1233
    highlight_event_id: guji-无准师范-event-jingshan
  - key: climax
    name: 门人编次六卷语录
    labels:
      zh: 编录流通
    start_date: 1248
    highlight_event_id: guji-无准师范-event-jingshan
  - key: closure
    name: 顺寂前搜拣自编付后
    labels:
      zh: 自编付后
    start_date: 1249
    highlight_event_id: guji-无准师范-event-death
  decisions:
  - date: 1233
    title_zh: 赴阙奏对直陈禅要
    rationale: 不以媚语迎合，以平直道路对扬君王，护持正法住世
  - date: 1249
    title_zh: 嘱侍者搜拣语录刊行
    rationale: 恐后人展转传抄走失宗旨，故亲加勘验以图省事免祸
events:
- id: guji-无准师范-event-birth
  date: 1178
  title_zh: 生于蜀地隆庆府
  description: 南宋淳熙五年诞生，幼年出家，往参破庵祖先得句中眼
  year_of: 1178
- id: guji-无准师范-event-qingliang
  date: 1220-04-29
  title_zh: 初住庆元清凉寺开堂
  description: 嘉定十三年三月二十八日入清凉，指三门佛殿法座祝圣举扬家风
  year_of: 1220
- id: guji-无准师范-event-jiaoshan
  date: 1222
  title_zh: 住镇江焦山普济寺
  description: 离清凉而住焦山，枕石漱流截断众流，接引江淮衲子
  year_of: 1222
- id: guji-无准师范-event-jingshan
  date: 1231
  title_zh: 长住临安径山兴圣万寿寺
  description: 自雪窦育王迁径山，大弘杨岐宗风，奏对理宗，四方问道云集
  year_of: 1231
- id: guji-无准师范-event-death
  date: 1249
  title_zh: 寂于径山谥号佛鉴
  description: 淳祐九年顺寂于径山，门人编次语录六卷，奏对行状并传
  year_of: 1249
