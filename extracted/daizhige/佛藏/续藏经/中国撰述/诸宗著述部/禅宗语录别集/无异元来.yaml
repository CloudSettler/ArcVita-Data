  - 宗门衰微之际如何振起洞上宗风
  - 机锋棒喝与慈悲接引如何兼顾
  lesson: 以真参实悟为本以警策痛语去禅病方能续佛慧命
  summary_first_person: 我是无异元来，嗣法寿昌无明，住持博山董岩诸刹，以拈古颂古禅警宗教答响接引学人，愿以生死大事警醒世人，同归本地风光。
