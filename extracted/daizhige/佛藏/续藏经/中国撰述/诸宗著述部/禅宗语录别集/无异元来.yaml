  title_zh: 嗣寿昌出世住持博山
  date: '1618'
  year_of: 1618
  location_zh: 信州博山能仁禅寺
  description_zh: 嗣寿昌无明慧经之法，应请住持博山，升座拈香祝圣开法，四方禅衲辏集。
