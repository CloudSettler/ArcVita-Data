  dilemmas:
  - 操履实修与词锋文句之辨守朴拙而远媟慢
  - 深隐山林与中兴废刹之任五十年不履城隍而重建寿昌
  - 金刚王剑截断众流与慈悲接引之衡杀活并行而不露锋芒
  lesson: 行解双修重在操履直下承当不落思议生死话头打彻方得省力
  summary_first_person: 吾寿昌无明慧经崇仁人也游少林登五台遇瑞峰而契合初住峨峰宝方次迁寿昌住山五十余年足不履城隍牍不近豪右惟随众作务信口说法欲使衲子歇狂直下承当不被诈明头所欺也
