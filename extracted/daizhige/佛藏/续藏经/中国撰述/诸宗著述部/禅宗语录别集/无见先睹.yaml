endeavors:
- id: guji-无见先睹-endeavor-1
  title_zh: 华顶四十年隐修住持
  summary: 嗣方山宝公后卓锡天台华顶展一坐具阅尽四十春秋足迹不下山而道价倾动远迩得元主赐号
  phases:
  - key: brewing
    name: 嗣法方山
    labels:
      zh: 承绪临济
    start_date: 1310
    highlight_event_id: guji-无见先睹-event-dharma
  - key: breakthrough
    name: 初住华顶
    labels:
      zh: 孤峰苦行
    start_date: 1315
    highlight_event_id: guji-无见先睹-event-huading
  - key: climax
    name: 道播寰宇
    labels:
      zh: 不下山而倾动远迩
    start_date: 1330
    highlight_event_id: guji-无见先睹-event-teaching
  - key: closure
    name: 遗诫示寂
    labels:
      zh: 临终垂诫
    start_date: 1350
    highlight_event_id: guji-无见先睹-event-death
  decisions:
  - date: 1315
    title_zh: 终守华顶不下山
    rationale: 高寒孤僻展一坐具阅尽四十春秋以苦行坚守养道价
  - date: 1330
    title_zh: 峻门庭而广接奔走归依者
    rationale: 门庭严峻机关警捷不假声施而应机垂示开凿眼目
- id: guji-无见先睹-endeavor-2
  title_zh: 拈提开示与语录流通
  summary: 示众小参法语颂古偈颂山居诗应机接引士俗僧尼弟子道昌集录智度等编黄溍作序昙噩作塔铭后世重梓
  phases:
  - key: brewing
    name: 开堂示众
    labels:
      zh: 称性而谈
    start_date: 1315
    highlight_event_id: guji-无见先睹-event-huading
  - key: breakthrough
    name: 接引士俗
    labels:
      zh: 应病与药
    start_date: 1330
    highlight_event_id: guji-无见先睹-event-teaching
  - key: climax
    name: 颂古垂范
    labels:
      zh: 机锋耸峻
    start_date: 1340
    highlight_event_id: guji-无见先睹-event-teaching
  - key: closure
    name: 集录刊行
    labels:
      zh: 龙宫推出
    start_date: 1357
    highlight_event_id: guji-无见先睹-event-yulu
  decisions:
  - date: 1330
    title_zh: 举古人话头令人密参实悟
    rationale: 不向黑山鬼窟作活计不向急水打球子要人喷地一下到大安乐地
  - date: 1350
    title_zh: 以遗诫辞世偈付嘱弟子
    rationale: 令道昌等集语录塔铭跋文具存以当千秋考证续佛慧命
