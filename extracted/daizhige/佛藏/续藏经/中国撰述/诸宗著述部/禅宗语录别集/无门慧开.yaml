    rationale: 了却先师未了底，虽恶声满丛林亦赴感承席。
  - date: '1249-04-01'
    title_zh: 再住黄龙再转法轮
    rationale: 再偿拽杷拖犁债，鼓得西江水逆流，以答丛林相成。
