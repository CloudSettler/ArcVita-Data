  - date: '1249-04-01'
    title_zh: 许侍者笔授逢场作戏
    rationale: 十字街头竿木随身，为得人解黏释缚，待三十年后知音。
events:
- id: guji-无门慧开-event-birth
  title_zh: 出生
  date: '1183'
  year_of: 1183
  description: 宋孝宗淳熙十年生于杭之良渚，俗姓梁，早修杜多行。
- id: guji-无门慧开-event-baoyin
  title_zh: 住湖州报因入院
  date: '1218-05-09'
  year_of: 1218
  description: 嘉定十一年五月初九入院嗣月林，指三门升座，拈香递相钝置。
- id: guji-无门慧开-event-wumenguan
  title_zh: 守无门庵集成无门关
  date: '1228'
  year_of: 1228
  description: 绍定年间评唱赵州狗子等四十八则，设三关，开无门为法门。
- id: guji-无门慧开-event-yulu
  title_zh: 语录结集程公许作序
  date: '1249-04-01'
  year_of: 1249
  description: 淳佑己酉季春，历住天宁黄龙灵岩翠岩语录成，眉山程公许序之。
- id: guji-无门慧开-event-death
  title_zh: 示寂
  date: '1260'
  year_of: 1260
  description: 宋理宗景定元年示寂，世寿七十八，塔于湖州。
