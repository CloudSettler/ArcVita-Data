    rationale: 以慈悲为体方便为用，报国资家导化檀那令众生积善得福
  - date: 1169-07-21
    title_zh: 书偈嘱众善自护持无令退失
    rationale: 诸佛不出世亦无涅槃，入室者必能玄契以续慧命
events:
- id: guji-普庵印肃-event-birth
  title_zh: 政和五年太平里诞生
  date: 1115-11-27
  year_of: 1115
  place_zh: 袁州宜春太平里
  description: 余氏子辰时生，邻室祥光烛天莲生道周，五相丰润善世言
- id: guji-普庵印肃-event-ordination
  title_zh: 依寿隆贤出家受戒
  date: 1142-05-01
  year_of: 1142
  place_zh: 袁州开元寺
  description: 绍兴四年依寿隆贤出家，绍兴十一年剃染，次年于开元寺受甘露大戒
- id: guji-普庵印肃-event-visit-muan
  title_zh: 入湘访沩山牧庵有省
  date: 1143-01-01
  year_of: 1143
  place_zh: 沩山
  description: 问万法归一一归何处，牧庵竖拂示之即有省而回受业
- id: guji-普庵印肃-event-abbot-cihua
  title_zh: 领帖住持慈化寺
  date: 1153-01-01
  year_of: 1153
  place_zh: 慈化寺
  description: 使牒请主慈化，布衾纸衣晨粥暮食，专阅华严经论禅定不辍
- id: guji-普庵印肃-event-enlightenment
  title_zh: 阅华严合论豁然大悟
  date: 1153-06-01
  year_of: 1153
  place_zh: 慈化寺
  description: 至达本情忘知心体合处豁然大悟徧体汗流，自言亲契华严法界开化人天
- id: guji-普庵印肃-event-temple-complete
  title_zh: 重营慈化梵宇落成
  date: 1168-12-01
  year_of: 1168
  place_zh: 慈化寺
  description: 乾道二年正月始营梵宇，至四年十二月落成，兼辟路建桥折草为药祈雨晴灵应甚多
- id: guji-普庵印肃-event-death
  title_zh: 跏趺书偈示寂入塔
  date: 1169-07-21
  year_of: 1169
  place_zh: 慈化寺方丈
  description: 沐浴书偈于方丈西壁乍雨乍晴宝象明，跏趺而逝，冬十一月奉全身于塔
