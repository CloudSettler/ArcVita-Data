  date: 1200-03-15
  year_of: 1200
  place_zh: 信州龟峰
  description_zh: 辞妙果大众，古帆高挂入曹源，卓拄杖定乾坤，布长蛇大阵，谢知事头首，开堂弘化
- id: guji-曹源道生-event-qiyu
  title_zh: 龟峰祈雨散会为人
  date: 1208-06-01
  year_of: 1208
  place_zh: 信州龟峰
  description_zh: 举睦州看经云兴雨至，拈拄杖变天大将军祈雨，散楞严华严会，谢监收，普请拽木，为施主升座说偈
- id: guji-曹源道生-event-death
