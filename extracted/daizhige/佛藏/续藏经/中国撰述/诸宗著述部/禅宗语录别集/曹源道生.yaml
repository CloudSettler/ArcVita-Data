  place_zh: 江南
  description_zh: 约南宋绍兴年间生，幼具宿慧，后出家参禅得法
- id: guji-曹源道生-event-miaoguo
  title_zh: 住饶州妙果禅寺开堂
  date: 1195-08-15
  year_of: 1195
  place_zh: 饶州妙果禅寺
  description_zh: 自云居受请，拈拄杖上堂，举宝公思大公案，裂破面皮为人，中秋八月说法接众
