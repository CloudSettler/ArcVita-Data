    title_zh: 以本分见成接引不假词色
    rationale: 为人至深切故不用机巧只以现成公案令衲子自悟
  - date: '1200'
    title_zh: 踏碎破砂盆收不得而弘化
    rationale: 杀人刀活人剑不在言句故纵横全提寿杨岐正脉
events:
- id: guji-松源崇岳-event-birth
  date: '1139'
  year_of: 1139
  title_zh: 处州龙泉出生出家
  description: 绍兴九年处州龙泉徐氏子出生幼出家未受具即从应庵华公有所契入
- id: guji-松源崇岳-event-canxue
  date: '1165'
  year_of: 1165
  title_zh: 参木庵密庵遍参知识
  description: 从木庵永公密庵杰公及遍参知识屡有省悟犹以未能脱洒为疑刻苦自厉忘寒暑
- id: guji-松源崇岳-event-wudao
  date: '1175'
  year_of: 1175
  title_zh: 留道场彻证谒密庵印可
  description: 留道场全公席下一日蓦有所得疑网尽除先众入室詈言而出挑包过凤口谒密庵蒙云且喜大事明了归堂憩息有偈当头一着没誵讹
- id: guji-松源崇岳-event-chengzhao
  date: '1190'
  year_of: 1190
  title_zh: 受请住阳山澄照开堂
  description: 在灵隐首座寮受请拈帖升座提全提半提之旨后历君山冶父荐福香山虎丘等处开堂提唱
- id: guji-松源崇岳-event-lingyin
  date: '1200'
  year_of: 1200
  title_zh: 住灵隐显亲报慈高提正印
  description: 开山显亲报慈及住景德灵隐提持佛祖向上之机接引光睦惠足等参学弟子以一钵去就为诸方重轻三十年
- id: guji-松源崇岳-event-death
  date: '1202'
  year_of: 1202
  title_zh: 嘉泰二年示寂语录成编
  description: 示寂后嗣惠足会粹平生之言黄龙庆如撮其玄要成编回庵谯令宪孟猷作序称其得密庵之髓以寿杨岐正脉
