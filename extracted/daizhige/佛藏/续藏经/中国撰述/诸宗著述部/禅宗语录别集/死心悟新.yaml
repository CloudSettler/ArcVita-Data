  dilemmas:
  - 半提全提难兼顾，既施机锋问答又须超越葛藤直指全提
  - 杀活夺境难把握，既破斥时弊颓风又须接引后学令得自在
  - 凡圣同异难遣执，既明清浊体用又须归于无见无闻转身一路
  lesson: 放下四大五蕴业识，向脚根下推穷参活句，死中得活，方能于水火是非中自在安身立命
  summary_first_person: 我是死心悟新，韶州翁源郑氏子，少年出家，久参黄龙心宗，历住云岩翠岩再住云岩，晚年迁住黄龙，结解纵夺，骂人接人，只教人放下臭皮袋子，向自己脚跟下看，参活句，出生死，顶上无人处亲到便是
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E8%AF%AD%E5%BD%95%E5%88%AB%E9%9B%86/%E6%AD%BB%E5%BF%83%E6%82%9F%E6%96%B0%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-死心悟新-endeavor-1
  title_zh: 初住云岩历住翠岩开堂弘法
  summary_zh: 初住云岩开堂示全提半提，再历翠岩广化示无尽藏，主张参活句莫参死句，拈古辨家风
  phases:
  - key: brewing
    name: 云岩初住开堂
    labels:
      zh: 开堂全提
    start_date: '1090'
    highlight_event_id: guji-死心悟新-event-yunyan-first
  - key: breakthrough
    name: 云岩拈古示家风
    labels:
      zh: 拈古立宗
    start_date: '1092'
    highlight_event_id: guji-死心悟新-event-yunyan-first
  - key: climax
    name: 翠岩广化示无尽藏
    labels:
      zh: 广化无尽藏
    start_date: '1098'
    highlight_event_id: guji-死心悟新-event-cuiyan
  - key: closure
    name: 翠岩示参活句
    labels:
      zh: 活句接人
    start_date: '1100'
    highlight_event_id: guji-死心悟新-event-cuiyan
  decisions:
  - date: '1090'
    title_zh: 初住云岩开堂直示全提不用葛藤
    rationale: 问答纵横只是口传心授葛藤，祖师门下圆同大虚，故须海底火然午夜阳辉直指全提
  - date: '1098'
    title_zh: 转住翠岩示无尽藏与参活句
    rationale: 色里胶青闻所未闻方为佛乘，死句下明只能活人，活句下明方能死却天下衲僧而后大活
- id: guji-死心悟新-endeavor-2
  title_zh: 再住云岩迁住黄龙振宗
  summary_zh: 再住云岩选三儿验入室，迁住黄龙登绝顶结解纵夺，小参痛斥驰求名利乡党爱缚，立黄龙源接人句
  phases:
  - key: brewing
    name: 再住云岩入院
    labels:
      zh: 再住选徒
    start_date: '1101'
    highlight_event_id: guji-死心悟新-event-yunyan-again
  - key: breakthrough
    name: 迁住黄龙入院登顶
    labels:
      zh: 黄龙登顶
    start_date: '1104'
    highlight_event_id: guji-死心悟新-event-huanglong
  - key: climax
    name: 黄龙小参破弊示夺
    labels:
      zh: 小参破弊
    start_date: '1110'
    highlight_event_id: guji-死心悟新-event-huanglong
  - key: closure
    name: 黄龙垂手源流付嘱
    labels:
      zh: 垂手付嘱
    start_date: '1115'
    highlight_event_id: guji-死心悟新-event-death
  decisions:
  - date: '1101'
    title_zh: 再住云岩以三儿拣择入室
    rationale: 聪明凶顽盲聋三儿皆是情见，须于选得选不得处透过，方入云岩门见春雨花枝
  - date: '1104'
    title_zh: 迁住黄龙立夺人夺境四句验僧
    rationale: 丛林淡泊人根狭劣驰求名利乡党相护，故以死中有活活中有死死中恒死活中恒活验天下衲僧，令退步放下推穷脚跟下
events:
- id: guji-死心悟新-event-birth
  date: '1044'
  year_of: 1044
  title_zh: 诞生韶州翁源郑氏
  description_zh: 宋仁宗庆历四年生于韶州翁源，俗姓郑，少年出家，后嗣黄龙心宗
  location_zh: 韶州翁源
- id: guji-死心悟新-event-yunyan-first
  date: '1090'
  year_of: 1090
  title_zh: 初住云岩开堂升座
  description_zh: 初住云岩开堂，竖拂示看，论问答纵横归一贯，示半提全提，海底火然连碧岫，元正日示四门开通
  location_zh: 云岩
- id: guji-死心悟新-event-cuiyan
  date: '1098'
  year_of: 1098
  title_zh: 住翠岩广化示无尽藏
  description_zh: 住翠岩广化，示空谷传响色里胶青无尽藏三昧，浴佛示拂子变释迦，示翠岩身同大地心同虚空，教参活句莫参死句
  location_zh: 翠岩
- id: guji-死心悟新-event-yunyan-again
  date: '1101'
  year_of: 1101
  title_zh: 再住云岩拣选三儿
  description_zh: 再住云岩入院，示养三儿喻，聪明凶顽盲聋中选一人用，示树凋叶落珊瑚枝枝，辨沩山军容弄巧
  location_zh: 云岩
- id: guji-死心悟新-event-huanglong
  date: '1104'
  year_of: 1104
  title_zh: 迁住黄龙结解纵夺
  description_zh: 迁住黄龙入院登绝顶顶上无人，解夏示拂子结解万里无寸草处，小参示夺人不夺境四句，痛斥破落户长老与乡党相护爱缚，示黄龙源深深无底白浪滔天
  location_zh: 黄龙
- id: guji-死心悟新-event-death
  date: '1115'
  year_of: 1115
  title_zh: 黄龙圆寂示付嘱
  description_zh: 宋徽宗政和五年圆寂于黄龙，垂手以死中恒死活中恒活验僧，大体还他肌骨好，不搽红粉也风流
  location_zh: 黄龙
