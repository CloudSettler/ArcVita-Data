endeavors:
- id: guji-玄沙师备-endeavor-1
  title_zh: 雪峰参学得印可
  summary: 从芙蓉弘照至钟陵受具亲近雪峰得再来人之印不乐外游守本分参究
  phases:
  - key: brewing
    name: 芙蓉从学钟陵受具
    labels:
      zh: 出家受戒
    start_date: '0860-01-01'
    highlight_event_id: guji-玄沙师备-event-ordination
  - key: breakthrough
    name: 雪峰印可不喜游方
    labels:
      zh: 参雪峰悟道
    start_date: '0880-01-01'
    highlight_event_id: guji-玄沙师备-event-xuefeng
  - key: closure
    name: 守拙安住待缘弘化
    labels:
      zh: 韬晦待时
    start_date: '0895-01-01'
    highlight_event_id: guji-玄沙师备-event-xuansha
  decisions:
  - date: '0880-01-01'
    title_zh: 对雪峰劝游答初祖不来东土
    rationale: 道不在远求守本地风光方为真参故不出游诸方直守己躬
  - date: '0890-01-01'
    title_zh: 以直下是你点拨棱道者
    rationale: 驴事马事皆是当人自体莫向灵云言句外觅须自肯即心即佛
- id: guji-玄沙师备-endeavor-2
  title_zh: 住持玄沙安国化众
  summary: 初住玄沙光化初王审知请开安国聚七百众赐紫号宗一以古镜南山等机锋接引
  phases:
  - key: brewing
    name: 初住玄沙安众八九年
    labels:
      zh: 住玄沙
    start_date: '0900-01-01'
    highlight_event_id: guji-玄沙师备-event-xuansha
  - key: breakthrough
    name: 王审知请开安国赐号
    labels:
      zh: 开安国弘法
    start_date: '0901-01-01'
    highlight_event_id: guji-玄沙师备-event-anguo
  - key: climax
    name: 七百众集机锋高峻
    labels:
      zh: 广录垂世
    start_date: '0905-01-01'
    highlight_event_id: guji-玄沙师备-event-teaching
  - key: closure
    name: 开平二年十一月示灭
    labels:
      zh: 示寂
    start_date: '0908-11-01'
    highlight_event_id: guji-玄沙师备-event-death
  decisions:
  - date: '0901-01-01'
    title_zh: 受王审知请住安国不为荣号所动
    rationale: 为续无生之旨广接桑梓学人故就请开山不为紫衣荣号
  - date: '0905-01-01'
    title_zh: 以百杂碎用南山截断言句
    rationale: 使学人离四句绝百非于见色闻鼓处自肯妙明真心不落言筌
events:
- id: guji-玄沙师备-event-birth
  date: '0835-01-01'
  year_of: 835
  title_zh: 生于福州闽县谢氏
  description: 福州闽县谢氏子后为宗一大师以示灭年七十四逆推约咸通年间生
- id: guji-玄沙师备-event-ordination
  date: '0861-01-01'
  year_of: 861
  title_zh: 从芙蓉义通事弘照钟陵受具
  description: 咸通初从芙蓉山义通事弘照久之往钟陵开元寺道玄律师处受具足戒
- id: guji-玄沙师备-event-xuefeng
  date: '0880-01-01'
  year_of: 880
  title_zh: 亲近雪峰得再来人之印
  description: 雪峰称为备头陀再来人劝出游对以初祖不来东土二祖不往西天勘破孚上座棱道者机缘
- id: guji-玄沙师备-event-xuansha
  date: '0900-01-01'
  year_of: 900
  title_zh: 初住玄沙十二时未曾移易
  description: 初住玄沙已八九年皎皎地示众以清净本然性相般若智海古镜明镜接人
- id: guji-玄沙师备-event-anguo
  date: '0901-01-01'
  year_of: 901
  title_zh: 王审知请为安国开山赐号宗一
  description: 光化初王审知请开安国学者尝七百余人慧球桂琛为高弟奏赐紫袈裟宗一之号
- id: guji-玄沙师备-event-teaching
  date: '0905-01-01'
  year_of: 905
  title_zh: 玄沙广录垂世机锋峻烈
  description: 上堂示一法不成一法四大性本真空直须辨缁素亲明己躬智严集为广录
- id: guji-玄沙师备-event-death
  date: '0908-11-01'
  year_of: 908
  title_zh: 开平二年十一月示灭
  description: 开平二年十一月示灭年七十有四遗风遍四海为禅者所宗
