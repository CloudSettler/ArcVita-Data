    title_zh: 许门人记录话句
    rationale: 虽知语录为赘，欲以言载道，使后人因言会心
  - date: 1265-01-01
    title_zh: 广设小参普说题跋
    rationale: 以拈古颂古佛祖赞启发学人，不以口耳为学而以默契为归
events:
- id: guji-环溪惟一-event-birth
  date: 1205
  year_of: 1205
  title_zh: 降生
  description_zh: 南宋年间生，少习儒学，后慕释氏寂灭之旨，遍游湖海参无准诸老
  place_zh: 中国江南
- id: guji-环溪惟一-event-ruiyan
  date: 1246-10-01
  year_of: 1246
  title_zh: 初住建宁府瑞岩禅寺
  description_zh: 淳祐六年良月入院，指三门举佛殿方丈事，大开炉鞴，接引两班四众
  place_zh: 建宁府瑞岩禅寺
- id: guji-环溪惟一-event-huili
  date: 1253-01-01
  year_of: 1253
  title_zh: 住临江瑞篁惠力及隆兴宝峰
  description_zh: 宝祐改元前后住惠力宝峰，举南泉牧牛德山小参马祖圆相，结制开炉，号令一新
  place_zh: 临江军瑞篁山惠力禅寺
- id: guji-环溪惟一-event-tiantong
  date: 1260-01-01
  year_of: 1260
  title_zh: 住雪峰天童等大刹
  description_zh: 历黄龙资圣黄檗仰山，终住福州雪峰庆元天童，拈古颂古普说广布，学人汇为语录上下卷
  place_zh: 庆元府天童景德禅寺
- id: guji-环溪惟一-event-death
  date: 1272
  year_of: 1272
  title_zh: 示寂
  description_zh: 化缘既毕示寂，门人编小参拈古颂古法语偈赞行状成环溪语录传世
  place_zh: 江南禅刹
