    title_zh: 应请入瑞岩开堂
    rationale: 以无窠窟中做窠窟，撤开面目与人相见，不避住山之累
  - date: 1253-01-01
    title_zh: 移锡瑞篁惠力泐潭宝峰
    rationale: 随缘应请，玩江月听松风，借黄龙宝峰家风锻炼后学
  - date: 1260-01-01
    title_zh: 住持雪峰天童大刹
    rationale: 以大炉鞴接四方衲子，使佛祖正令久长不息
