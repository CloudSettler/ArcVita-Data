  dilemmas:
  - title_zh: 立言与无言
    description_zh: 欲以无言载道，又不得不以言显道，语录之设本为赘疣
  - title_zh: 住山与应缘
    description_zh: 志在寂灭晦光，又历住九刹应缘接众，去住之间难两全
  lesson: 不以言求道而以心会道，即喧闹中守寂静，即施设处见平常
  summary_first_person: 吾学于儒而逸于墨，遍参湖海，历住瑞岩瑞篁宝峰黄龙以至雪峰天童，一话一言皆门人所记，愿学者以环溪求环溪，莫徒以语录求我
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/環溪惟一禪師語錄.html
