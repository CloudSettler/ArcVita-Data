    title_zh: 应请圆通法华
    rationale: 游戏卷舒皆衲僧分上，定慧一如，随分纳些些，不为金屑落眼所翳
  - date: '1070'
    title_zh: 终老海会白云
    rationale: 香火六寺所居既广，命门人处凝等编帙传灯，以白云名山总题，令后人即言见心
events:
- id: guji-白云守端-event-birth
  title_zh: 诞生衡湘
  date: '1025'
  year_of: 1025
  place: 衡湘间
  description: 以超拔卓异之资生于衡湘间，能以不心而心不言而言
- id: guji-白云守端-event-canyi
  title_zh: 参谒杨岐得法
  date: '1048'
  year_of: 1048
  place: 袁州杨岐
  description: 先住袁州杨岐亲见慈明下杨岐方会，嗣其法，得超拔宗风
- id: guji-白云守端-event-chengtian
  title_zh: 江州承天开堂
  date: '1055'
  year_of: 1055
  place: 江州承天禅院
  description: 拈香三瓣报国恩谢圣贤，开堂垂语，问答酬机，巡礼庐山归宗开先万杉栖贤罗汉诸刹
- id: guji-白云守端-event-yuantong
  title_zh: 住持圆通法华
  date: '1060'
  year_of: 1060
  place: 江州圆通舒州法华
  description: 受请住圆通崇胜，次住法华证道，举古辨今，定慧卷舒，化导江舒
- id: guji-白云守端-event-haihui
  title_zh: 终住海会白云
  date: '1070'
  year_of: 1070
  place: 海会白云山
  description: 历龙门兴化而终住海会，海会山名白云，门人处凝智本智华法演等编集语录
- id: guji-白云守端-event-death
  title_zh: 示寂海会
  date: '1072'
  year_of: 1072
  place: 海会寺
  description: 终老海会，太原王孜为序，总题白云禅录，传灯后世
