      - 作务
    start_date: 0795
    highlight_event_id: guji-百丈怀海-event-abbot
  - key: climax
    name: 野狐虎话勘学人
    labels:
      zh:
      - 勘验
      - 因果
    start_date: 0800
    highlight_event_id: guji-百丈怀海-event-wildfox
  - key: closure
    name: 付嘱示寂谥大智
    labels:
      zh:
      - 付授
      - 圆寂
    start_date: '0814-01-17'
    highlight_event_id: guji-百丈怀海-event-death
  decisions:
  - date: 0795
    title_zh: 作务先众一日不作一日不食
    rationale: 无德争合劳于人，徧求作具不获亦忘食，以身率众使农禅并行，流播寰宇
  - date: 0800
    title_zh: 代转语云不昧因果
    rationale: 惜过去迦叶时老人错对不落因果而堕野狐，须以不昧因果正大修行眼目，依法火葬以显因果分明
  - date: 0810
    title_zh: 许黄檗超师之见付沩山黄檗
    rationale: 见与师齐减师半德，见过于师方堪传授，黄檗得大用沩山得大机，不承嗣马祖而丧儿孙之讥可免
