- id: guji-百丈怀海-event-duck
  person_qid: guji-百丈怀海
  title_zh: 野鸭搊鼻言下有省
  date: 0785
  year_of: 785
  precision: year
  is_circa: true
  place_zh: 江西马祖会下
  description: 侍马祖行次见野鸭飞过，对飞过去也，被回头搊鼻负痛失声，于言下有省，归寮哭转呵呵大笑
- id: guji-百丈怀海-event-flywhisk
  person_qid: guji-百丈怀海
