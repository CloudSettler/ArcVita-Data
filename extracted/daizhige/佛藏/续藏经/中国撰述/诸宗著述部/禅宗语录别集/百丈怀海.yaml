  name_zh: 百丈怀海
  names:
    zh: 百丈怀海
    en: Baizhang Huaihai
  lifespan:
    birth:
      date: '0720'
      precision: year
      is_circa: true
      raw: 福州长乐王氏子，春秋九十五逆推，约开元八年
    death:
      date: '0814-01-17'
      precision: day
      is_circa: false
      raw: 唐元和九年正月十七日示寂
  birth_date: '0720'
  death_date: '0814-01-17'
  era: 唐
  reign_ref: 唐宪宗元和九年
  archetype: 禅宗清规创立者
  dilemmas:
  - 即此用离此用之间，如何直下为人而不落窠臼
  - 农禅作务与持戒清净之间，如何立万世清规而不昧因果
  - 见与师齐减师半德，见过于师方堪传授，如何付嘱黄檗沩山
  lesson: 一日不作一日不食，不昧因果，离妄缘即如如佛。
  summary_first_person: 我是怀海，福州长乐王氏子，丱岁离尘，三学该练，倾心依附马祖大寂，与西堂南泉同号入室，因野鸭飞过去被搊鼻有省，因竖拂被喝三日耳聋而深明大事，后住洪州大雄山，以岩峦峻极号百丈，坚持作务先众，立一日不作一日不食之规，以不昧因果点化野狐，以大机大用接引黄檗沩山，元和九年正月十七日示寂，春秋九十五，谥大智，塔大胜宝轮。
  source_urls:
