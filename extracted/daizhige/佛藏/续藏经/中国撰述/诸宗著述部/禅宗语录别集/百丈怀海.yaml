  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E8%AF%AD%E5%BD%95%E5%88%AB%E9%9B%86/%E7%99%BE%E4%B8%88%E6%80%80%E6%B5%B7%E7%A6%84%E5%B8%88%E8%AF%AD%E5%BD%95.md
endeavors:
- id: guji-百丈怀海-endeavor-1
  person_qid: guji-百丈怀海
  title_zh: 随侍马祖悟入大机
  description: 丱岁离尘后倾心依附江西马祖，与西堂南泉角立，历野鸭搊鼻与竖拂一喝而悟入，得印可为入室三大士之一。
  phases:
  - key: brewing
    name: 倾心依附
    labels:
