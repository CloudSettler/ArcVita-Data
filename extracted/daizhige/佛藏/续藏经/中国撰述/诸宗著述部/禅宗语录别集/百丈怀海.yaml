    labels:
      zh:
      - 印可
      - 传承
    start_date: 0787
    highlight_event_id: guji-百丈怀海-event-flywhisk
  decisions:
  - date: 0780
    title_zh: 倾心依附马祖
    rationale: 大寂阐化江西，三学该练后须明心大事，故与西堂南泉同号入室求决
  - date: 0785
    title_zh: 野鸭痛哭转呵呵大笑
    rationale: 被搊鼻痛不彻而于言下有省，假哭笑勘验会与不会，直下承当飞过去即当下
  - date: 0786
    title_zh: 卷席竖拂直呈本分
    rationale: 不落言句，即此用离此用俱舍，以卷席竖拂挂拂呈大机，宁受一喝三日耳聋
- id: guji-百丈怀海-endeavor-2
  person_qid: guji-百丈怀海
  title_zh: 住持百丈立规育人
  description: 受请住洪州新吴大雄山，以岩峦峻极号百丈，四方麇至，作务先众，立一日不作一日不食清规，以野狐不昧因果等公案接引黄檗沩山，大振禅风。
  phases:
  - key: brewing
    name: 受请住大雄山
