  date: 0786
  year_of: 786
  precision: year
  is_circa: true
  place_zh: 江西马祖方丈
  description: 再参侍立，即此用离此用之问下取拂竖起复挂旧处，被振威一喝直得三日耳聋，自此雷音将震
- id: guji-百丈怀海-event-abbot
  person_qid: guji-百丈怀海
  title_zh: 受请住大雄山号百丈
  date: 0789
  year_of: 789
  precision: year
  is_circa: true
  place_zh: 洪州新吴大雄山
  description: 檀信请住大雄山，以居处岩峦峻极故号百丈，未期期月参玄之宾四方麇至，沩山黄檗当其首，作务执劳必先于众
- id: guji-百丈怀海-event-wildfox
  person_qid: guji-百丈怀海
  title_zh: 代野狐转语不昧因果
  date: 0800
  year_of: 800
  precision: year
  is_circa: true
  place_zh: 百丈山法堂
  description: 每日上堂有老人听法，自述迦叶佛时住此山，错对不落因果堕野狐身，代以不昧因果而大悟，领众山后岩下挑出死狐依法火葬，黄檗近前一掌，师笑言赤须胡
- id: guji-百丈怀海-event-death
  person_qid: guji-百丈怀海
  title_zh: 元和九年正月十七示寂
  date: '0814-01-17'
  year_of: 814
  precision: day
  is_circa: false
  place_zh: 洪州百丈山
  description: 示寂春秋九十五，长庆元年敕谥大智禅师，塔曰大胜宝轮，语录为四家语录卷二，灵光独耀迥脱根尘之旨大行
