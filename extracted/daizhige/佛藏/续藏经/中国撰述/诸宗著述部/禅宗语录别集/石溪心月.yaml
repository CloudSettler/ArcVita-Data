  description_zh: 名重一时搢绅圣天子皆知之主名山锡徽号宠灵赫奕说法不辍
  is_circa: true
- id: guji-石溪心月-event-death
  date: 1254
  year_of: 1254
  title_zh: 示寂门人编语录行世
  description_zh: 没于景定元年前六年门弟子录其语锓梓刘震孙为序比于大慧语录并行
