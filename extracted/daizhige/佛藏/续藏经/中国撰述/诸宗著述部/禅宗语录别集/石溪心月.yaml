endeavors:
- id: guji-石溪心月-endeavor-1
  title_zh: 历住江南名山弘法接众
  summary_zh: 自建康报恩能仁至蒋山虎丘灵隐径山次第住持秉拂小参普说法语偈颂广接四众
  phases:
  - key: brewing
    name: 初住建康报恩能仁
    labels:
      zh: 初机肇兴
    start_date: 1245
    highlight_event_id: guji-石溪心月-event-baonen
  - key: breakthrough
    name: 转住蒋山虎丘
    labels:
      zh: 声名渐重
    start_date: 1250
    highlight_event_id: guji-石溪心月-event-jiangshan
  - key: climax
    name: 主灵隐径山大道场
    labels:
      zh: 化被四方
    start_date: 1252
    highlight_event_id: guji-石溪心月-event-jingshan
  - key: closure
    name: 语录编行示寂后传
    labels:
      zh: 法音长存
    start_date: 1254
    highlight_event_id: guji-石溪心月-event-death
  decisions:
  - date: 1245
    title_zh: 受请初住报恩拈帖升座立宗
    rationale: 以不立孤危不坐平实开示单传直指之宗确立家风接引四众
  - date: 1252
    title_zh: 应请主径山兴圣万寿
    rationale: 以大法付嘱不可辞劳就名山广接帝京缙绅四众续松源杨岐正脉
- id: guji-石溪心月-endeavor-2
  title_zh: 守蒋山风节抗权贵夺地
  summary_zh: 在蒋山时王氏子恃权贵规取山地为墓田争之不得鸣鼓说偈而去趋浙东遍游佳山水终以直节名重一时
  phases:
  - key: brewing
    name: 蒋山住持地被规取
    labels:
      zh: 守土遇夺
    start_date: 1249
    highlight_event_id: guji-石溪心月-event-jiangshan
  - key: breakthrough
    name: 鸣鼓说偈拂袖而去
    labels:
      zh: 抗节而去
    start_date: 1250
    highlight_event_id: guji-石溪心月-event-jiangshan
  - key: climax
    name: 遍游浙东名重一时
    labels:
      zh: 清望日隆
    start_date: 1251
    highlight_event_id: guji-石溪心月-event-jingshan
  - key: closure
    name: 圣天子知之主名山锡徽号
    labels:
      zh: 直道受知
    start_date: 1252
    highlight_event_id: guji-石溪心月-event-jingshan
  decisions:
  - date: 1250
    title_zh: 不徇王氏请鸣鼓说偈去蒋山
    rationale: 以介甫苗裔以学术误天下徇请则为山灵所笑宁去不屈以全风教
  - date: 1251
    title_zh: 趋东淛遍游佳山水将终老
    rationale: 不附权门守清高远游以养道待圣明之知不干进取
events:
