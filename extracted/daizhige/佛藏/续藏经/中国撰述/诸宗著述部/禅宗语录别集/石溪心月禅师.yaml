  dilemmas:
  - title_zh: 宗门衰微与法席维持
    description: 先师入灭后丛林离散当以繁琐法事摄众还是以简峻机锋立宗
  - title_zh: 诗偈应酬与本地风光
    description: 为檀越官绅作送别劝慰语录当徇人情文字还是直指本分生死大事
  lesson: 以丧祭法事收摄离散人心以诗偈开示接引士俗方为乱世守道之实业
  summary_first_person: 我承痴绝无准余绪于干戈陵谷之际为人举火阇维挂真奠茶以杂录诗偈收拾丛林残局只为慧命不断
  source_urls:
