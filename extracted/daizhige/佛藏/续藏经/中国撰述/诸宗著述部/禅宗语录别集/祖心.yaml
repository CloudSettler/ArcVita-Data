endeavors:
- id: guji-宝觉祖心-endeavor-1
  title_zh: 熙宁继席黄龙领众
  summary: 慧南宴寂后奉请继住黄龙，升座云岩，四方参学，法席大盛
  phases:
  - key: brewing
    name: 参南得法
    labels:
      zh: 参学蕴锋
    start_date: '1055'
    highlight_event_id: guji-宝觉祖心-event-dharma
  - key: breakthrough
    name: 继席黄龙
    labels:
      zh: 继席开堂
    start_date: '1069'
    highlight_event_id: guji-宝觉祖心-event-succeed
  - key: climax
    name: 云岩升座
    labels:
      zh: 弘化云岩
    start_date: '1070'
    highlight_event_id: guji-宝觉祖心-event-yunyan
  - key: closure
    name: 法席重光
    labels:
      zh: 举秀立僧
    start_date: '1075'
    highlight_event_id: guji-宝觉祖心-event-lixiu
  decisions:
  - date: '1069'
    title_zh: 受请继住黄龙
    rationale: 先师既寂穷子无归，当阳晓示令大用现前，故不辞劳继席
  - date: '1070'
    title_zh: 云岩开堂示众
    rationale: 临机应用不失其宜，直指自家田地，令学者乘时契入
- id: guji-宝觉祖心-endeavor-2
  title_zh: 拈古垂示直指心源
  summary: 上堂拈拂击床举古破执，教人顿忘诸见明心见性，子和集录成编
  phases:
  - key: brewing
    name: 穷究生死根源
    labels:
      zh: 穷究提唱
    start_date: '1070'
    highlight_event_id: guji-宝觉祖心-event-yunyan
  - key: breakthrough
    name: 顿忘诸见示众
    labels:
      zh: 直指顿忘
    start_date: '1072'
    highlight_event_id: guji-宝觉祖心-event-teaching
  - key: climax
    name: 语录集成分行
    labels:
      zh: 集录流通
    start_date: '1078'
    highlight_event_id: guji-宝觉祖心-event-record
  - key: closure
    name: 示寂留颂
    labels:
      zh: 圆寂宝觉
    start_date: '1100'
    highlight_event_id: guji-宝觉祖心-event-death
  decisions:
  - date: '1072'
    title_zh: 以拂子竹篦破言诠执
    rationale: 若唤作拂子则扫宗，若不唤则生波澜，直须离即离非顿忘乃契
  - date: '1078'
    title_zh: 许子和集录付传
    rationale: 垂丝千尺意在深潭，令后昆有归，三十年后悟去不负此恩
events:
- id: guji-宝觉祖心-event-birth
  type: birth
  title_zh: 诞生
  date: '1025'
  year_of: 1025
  description: 天圣三年生，南雄人，俗姓邬，后参黄龙慧南得法
- id: guji-宝觉祖心-event-dharma
  type: dharma
  title_zh: 嗣法慧南
  date: '1066'
  year_of: 1066
  description: 久蕴锋芒不沽时誉，嗣黄龙慧南，为黄龙第二代
- id: guji-宝觉祖心-event-succeed
  type: succeed
  title_zh: 熙宁二年继席黄龙
  date: '1069'
  year_of: 1069
  description: 慧南宴寂，郡请心师继焉，升座云岩，徐禧率同学焚香听法
- id: guji-宝觉祖心-event-yunyan
  type: teaching
  title_zh: 云岩升座说法
  date: '1070'
  year_of: 1070
  description: 上堂拈拂示众，明取自家一片田地，顿忘诸见则大智洞然
- id: guji-宝觉祖心-event-teaching
  type: teaching
  title_zh: 拈古击床垂示
  date: '1072'
  year_of: 1072
  description: 上堂举达磨少室马祖升堂等公案，一尘才举大地全收，破执显宗
- id: guji-宝觉祖心-event-lixiu
  type: teaching
  title_zh: 举秀首座立僧
  date: '1075'
  year_of: 1075
  description: 举秀首座立僧，赞其明悟卓识，愿破尘出经卷重光吾道
- id: guji-宝觉祖心-event-record
  type: record
  title_zh: 语录集成
  date: '1078'
  year_of: 1078
  description: 侍者和子集录所闻，门人仲介重编，徐禧作序，宝觉语录流通
- id: guji-宝觉祖心-event-death
  type: death
  title_zh: 示寂
  date: '1100'
  year_of: 1100
  description: 元符三年示寂，谥宝觉，嗣法克文等大振黄龙宗风
