    start_date: 1357-12-06
    highlight_event_id: guji-穆庵文康-event-mingyan
  - key: closure
    name: 示去就分明退院
    labels:
      zh: 收束
    start_date: 1358-01-01
    highlight_event_id: guji-穆庵文康-event-mingyan
  decisions:
  - date: 1357-12-06
    title_zh: 拈香祝圣报国恩
    rationale: 以宝香祝延今上，显禅门护国之义，融王法与佛法
  - date: 1358-01-01
    title_zh: 去就分明退院
    rationale: 示来去自在，不恋住持，令学人悟露柱正眼，青山随处好
- id: guji-穆庵文康-endeavor-2
  title_zh: 历住龙华金山辅化护国
  summary_zh: 至正甲辰住杭州龙华宝乘，洪武七年住镇江金山龙游，秉拂冬至，举南岳临济，宏宣圣化，燮理阴阳，善世泽民
  phases:
  - key: brewing
    name: 住龙华演三会
    labels:
