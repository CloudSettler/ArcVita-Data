endeavors:
- id: guji-穆庵文康-endeavor-1
  title_zh: 初住天台明岩开堂立宗
  summary_zh: 至正丁酉入明岩大梵寺，开堂举扬赵州柏树子，重岩压须弥，别资一路接引学人，终以去就分明退院
  phases:
