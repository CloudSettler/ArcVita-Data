  - key: climax
    name: 金山祝颂大明王化
    labels:
      zh: 高潮
    start_date: 1374-04-21
    highlight_event_id: guji-穆庵文康-event-jinshan
  - key: closure
    name: 留班结众付后学
    labels:
      zh: 收束
    start_date: 1374-06-01
    highlight_event_id: guji-穆庵文康-event-jinshan
  decisions:
  - date: 1364-09-01
    title_zh: 以向上一路遍地遍天接众
    rationale: 破千圣不传不然之执，直指心佛灵物，令尘尘得自在
  - date: 1374-04-21
    title_zh: 祝延大明并酬法乳恩
    rationale: 当鼎革之际，以密语辅翊王度，厚植生基，同时报了庵法乳，立宗门正统
events:
- id: guji-穆庵文康-event-birth
  type: birth
  title_zh: 出生
  date: 1317
  year_of: 1317
  place_zh: 未详
  description_zh: 约元延祐年间生，后嗣法了庵系，为松源下传人
- id: guji-穆庵文康-event-mingyan
  type: career
  title_zh: 初住天台明岩大梵寺开堂
  date: 1357-12-06
  year_of: 1357
  place_zh: 台州天台山明岩大梵禅寺
  description_zh: 至正丁酉十二月初六入寺，指山门，踞室升座，祝圣拈香为开福灵岩了庵，举赵州柏树子，马祖盐酱，示重岩压须弥，后退院示去就分明
- id: guji-穆庵文康-event-longhua
  type: career
  title_zh: 次住杭州龙华宝乘寺
  date: 1364-09-01
  year_of: 1364
  place_zh: 杭州龙华宝乘禅寺
  description_zh: 至正甲辰九月一日入寺，示太尉丞相公验，祝圣拈香为千佛塔院南堂，举南岳镜铸像，盘山向上一路，倡遍地遍天，冬至秉拂激扬法螺法鼓
- id: guji-穆庵文康-event-jinshan
  type: career
  title_zh: 再住镇江金山龙游寺
  date: 1374-04-21
  year_of: 1374
  place_zh: 镇江金山龙游禅寺
  description_zh: 大明洪武七年四月二十一日入寺，祝延大明皇帝皇后太子，拈香酬金刚幢了庵，举临济王常侍，法灯未了公案，示密语辅翊王化，留两班共立宗旨
- id: guji-穆庵文康-event-death
  type: death
  title_zh: 示寂
  date: 1385
  year_of: 1385
  place_zh: 未详
  description_zh: 金山化缘既毕，付嘱后学，约洪武年间示寂，语录由清逸智辩宝日等编行世
