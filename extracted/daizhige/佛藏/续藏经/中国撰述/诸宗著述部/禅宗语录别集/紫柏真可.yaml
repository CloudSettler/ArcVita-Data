events:
- id: guji-紫柏真可-event-birth
  date: 1543
  year_of: 1543
  title_zh: 生于吴江太湖滩缺沈氏家
  description: 父沈连季子母梦异人授附叶大鲜桃寤而香满室遂有娠生五岁不语遇异僧摩顶乃能言
- id: guji-紫柏真可-event-ordination
  date: 1560
  year_of: 1560
  title_zh: 虎丘礼明觉剃度出家
  description: 年十七仗剑远游塞上至苏州阊门值天雨遇明觉同归虎丘闻诵八十八佛名心悦即解腰缠设斋剃度二十岁受具戒后掩关武塘景德寺三年行脚参究至五台京师参遍融诸老而悟
- id: guji-紫柏真可-event-sutra-carving
  date: 1589
  year_of: 1589
  title_zh: 万历己丑创刻方册藏于五台
  description: 与陆光祖冯梦祯曾同亨瞿汝稷等议刻方册藏命密藏开董其事如奇纲维居四年以冰雪移于径山寂照庵续刻弘愿以流通为第一事
- id: guji-紫柏真可-event-lengyan
  date: 1595
  year_of: 1595
  title_zh: 驻锡楞严说法创立清规
  description: 与陆庄简冯具区深谈不二筑精舍于楞严废址说法如云雨施物填委建禅堂立规条血书联句江以南称清规楚楚足迹遍五台峨嵋五顶而后入京辇弘法
- id: guji-紫柏真可-event-death
  date: 1603
  year_of: 1603
  title_zh: 圆寂于京师圜扉
  description: 以弘法故示灭圜扉万历壬寅夏自题这个阿师心直口快走遍天下圜中自在明年癸卯冬果合掌跏趺而逝南迁启龛相好如生验瞑目地不坏
