endeavors:
- id: guji-虎丘绍隆-endeavor-1
  title_zh: 嗣法圜悟承续临济正脉
  summary: 依止金山佛果圜悟克勤得法，以拂子正眼流通正脉，报法乳深恩
  phases:
  - key: brewing
    name: 参学金山依止圜悟
    labels:
      zh: 参学得法
    start_date: '1120'
    highlight_event_id: guji-虎丘绍隆-event-kaisheng
  - key: breakthrough
    name: 蒙印嗣法命脉一札
    labels:
      zh: 嗣法印可
    start_date: '1126'
    highlight_event_id: guji-虎丘绍隆-event-kaisheng
  - key: climax
    name: 拈香报乳竖拂传宗
    labels:
      zh: 拈香传宗
    start_date: '1127'
    highlight_event_id: guji-虎丘绍隆-event-kaisheng
  - key: closure
    name: 以心契心流通后学
    labels:
      zh: 流通正续
    start_date: '1132'
    highlight_event_id: guji-虎丘绍隆-event-huqiu
  decisions:
  - date: '1126'
    title_zh: 长依圜悟命脉放下
    rationale: 遇无面目老子命脉上一札，从空放下，故对众拈出报法乳恩
  - date: '1127'
    title_zh: 竖拂子明接物利生之机
    rationale: 以拂子辨三世诸佛接物与祖师流通正脉，不落今时言诠
- id: guji-虎丘绍隆-endeavor-2
  title_zh: 历住三刹开堂说法度众
  summary: 历住和州开圣、宣州彰教、平江虎丘云岩，拈拄杖八字打开，普利群品
  phases:
  - key: brewing
    name: 初住和州开圣开堂
    labels:
      zh: 开堂展演
    start_date: '1127'
    highlight_event_id: guji-虎丘绍隆-event-kaisheng
  - key: breakthrough
    name: 移住宣州彰教别开一路
    labels:
      zh: 广开一路
    start_date: '1130'
    highlight_event_id: guji-虎丘绍隆-event-zhangjiao
  - key: climax
    name: 大阐宗风于虎丘云岩
    labels:
      zh: 虎丘阐化
    start_date: '1132'
    highlight_event_id: guji-虎丘绍隆-event-huqiu
  - key: closure
    name: 付嘱丛林圆寂虎丘
    labels:
      zh: 示寂付嘱
    start_date: '1136'
    highlight_event_id: guji-虎丘绍隆-event-death
  decisions:
  - date: '1127'
    title_zh: 应请开堂随缘赴感
    rationale: 法王大宝自然而至，随缘赴感如鉴当台，以助无为之化
  - date: '1132'
    title_zh: 拈拄杖八字打开示众
    rationale: 以无门为法门，无见而见，无闻而闻，令衲僧拨转天关
