      raw: 明万历年间约生
    death:
      date: '1652'
      precision: year
      is_circa: true
      raw: 明末清初示寂
  birth_date: '1585'
  death_date: '1652'
  era: 明末清初
  reign_ref: 崇祯
  archetype: 禅师
  dilemmas:
  - 韬晦藏锋不立一字与慈悲接物续佛心灯之两难
  - 杀刀活剑勘验学人与平常穿衣吃饭是道之两难
  lesson: 藏拙于没踪迹处，发明在穿衣吃饭处，生死两字竖眉毛上，方得转身自由
  summary_first_person: 吾少学道，闻师说法如雷，于临济三顿棒处发明本来，然甘没踪迹藏身数十年，不立一字，不发一语，后因海岸一言投契，浪公推席寿昌，不得已示众颂古问答，只愿学者话头绵密，于生死两字亲见主人公，莫拘小享，直至古人田地
  source_urls:
  - https://daizhige.org/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/见如元谧禅师语录.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/续藏经/中国撰述/诸宗著述部/禅宗语录别集/见如元谧禅师语录.md
endeavors:
- id: guji-见如元谧-endeavor-1
  title_zh: 参师寿昌于棒下发明大事
  summary_zh: 早年亲近寿昌先师，于临济三顿棒话发明本来，立坚固志，以生死两字为话头，韬晦潜行如愚若鲁，丛林屡推不出
  phases:
  - key: brewing
    name: 初心学道立志参究
    labels:
      zh: 立志参禅
    start_date: '1605'
    highlight_event_id: guji-见如元谧-event-enlightenment
  - key: breakthrough
    name: 棒下发明韬晦藏身
    labels:
      zh: 发明韬晦
    start_date: '1620'
    highlight_event_id: guji-见如元谧-event-enlightenment
  decisions:
  - date: '1620'
    title_zh: 发明后密用潜行不轻示人
    rationale: 恐学人重知见立知而昧主人公，故藏身没踪迹处，非端伯虔请不示一言半句
  - date: '1625'
    title_zh: 以生死两字竖眉毛上用功
    rationale: 不为作颂论禅等别事，只向穿衣吃饭屙屎放尿处照顾主人公，如见猛虎躲身逃命，如上阵取贼魁首
- id: guji-见如元谧-endeavor-2
  title_zh: 继席寿昌示众颂古利生
  summary_zh: 因海岸居士投契及浪公扫塔推让，继寿昌法席，示众拈花喝棒，颂古世尊拈花赵州无字云门饼黄龙三关，问答勘验海岸十六问及道璞诸问，门人道璞阴录成语录
  phases:
  - key: climax
    name: 继席弘化杀活并行
    labels:
      zh: 继席示众
    start_date: '1635'
    highlight_event_id: guji-见如元谧-event-succession
  - key: closure
    name: 语录流通付嘱后学
    labels:
      zh: 集录流通
    start_date: '1637'
    highlight_event_id: guji-见如元谧-event-record
  decisions:
  - date: '1635'
    title_zh: 受浪公推让继寿昌法席
    rationale: 本欲口挂壁上如古庙香炉，然救世婆心不忍，兼海岸博山瀛山天童径山建帜因缘，故出世续佛心灯
  - date: '1637'
    title_zh: 许门人道璞阴录示众问答颂古
    rationale: 初非本意欲无言莫知，然为验智愚贤不肖求知一念及示杀刀活剑全机大用，故留指据录示作家
events:
- id: guji-见如元谧-event-birth
  date: '1585'
  year_of: 1585
  title_zh: 诞生
  summary_zh: 明万历年间生，未入孔圣之门，早怀出世志，后投寿昌先师下学道
- id: guji-见如元谧-event-enlightenment
  date: '1620'
  year_of: 1620
  title_zh: 临济棒下发明本来
  summary_zh: 于临济三顿棒话发明本来大事，具载录中，先寿昌印可，末后复以衲衣付之，遂密用潜行如愚若鲁
- id: guji-见如元谧-event-succession
  date: '1635'
  year_of: 1635
  title_zh: 继席寿昌开堂示众
  summary_zh: 海岸居士一言投契露本色，浪公归扫寿昌塔推以法席，开堂示众论参禅为生死两字，示话头绵密照顾主人公，举香严击竹悟道勉学
- id: guji-见如元谧-event-record
  date: '1637'
  year_of: 1637
  title_zh: 颂古问答集录成编
  summary_zh: 颂世尊拈花双趺无缝塔德山拓钵赵州无字麻三斤柏树子云门饼黄龙三关，答道璞楞严华严之问及海岸十六问，门人道璞集为寿昌见如谧禅师语录，黄端伯李长庚作序
- id: guji-见如元谧-event-death
  date: '1652'
  year_of: 1652
  title_zh: 示寂
  summary_zh: 明末清初示寂，生时决定生去时实不去，来去无端如岚风送白云归，塔存寿昌博山东峰坞一带
