  - 直截祖令大地荒凉与就下平高普利群机之间如何权衡
  - 孤峻宗风粉碎铜头铁额与住持大刹慈悲接引五百众之间如何兼顾
  lesson: 不立葛藤直截本分，住世虽暂而利人贵在截断众流
  summary_first_person: 吾名道宁，嗣蕲州五祖法演，由天宁第一座于大观三年受请住潭州开福报慈，众聚五百，以拄杖拂子划断古今葛藤，住院五年如顷刻而寂
