endeavors:
- id: guji-道宁-endeavor-1
  title_zh: 遍参诸方嗣法五祖演
  description: 敏悟坚恪遍参诸方，蒙东山五祖法演印记，为二勤一远一宁之宁，后居湖湘天宁第一座
  phases:
  - key: brewing
    name: 遍参诸方
    labels:
      zh: 参学历练
    start_date: '1090'
    highlight_event_id: guji-道宁-event-dharma
  - key: breakthrough
    name: 蒙演印可
    labels:
      zh: 得法承嗣
    start_date: '1103'
    highlight_event_id: guji-道宁-event-dharma
  decisions:
  - date: '1103'
    title_zh: 承嗣五祖演
    rationale: 信缘既至不滞见闻，直承临济正脉以续慧命
  - date: '1105'
    title_zh: 居天宁第一座
    rationale: 养道湖湘以待机缘，不急出世以全宗风
- id: guji-道宁-endeavor-2
  title_zh: 出世开福弘化五年
  description: 大观三年由崇宁首座受席震请，住持潭州开福报慈第十九代，众盈五百，上堂小参机锋峻烈，门人善果集语录
  phases:
  - key: climax
    name: 受请住持开福
    labels:
      zh: 出世弘化
    start_date: '1109-02-01'
    highlight_event_id: guji-道宁-event-kaifu
  - key: closure
    name: 五年利人示寂
    labels:
      zh: 嘱付遗编
    start_date: '1110'
    highlight_event_id: guji-道宁-event-teaching
  decisions:
  - date: '1109-02-01'
    title_zh: 受请入院开堂
    rationale: 时缘既至落在手里，当仁不让为国开堂祝延圣寿
  - date: '1114'
    title_zh: 示寂付嘱门人
    rationale: 住院五年都虑顷刻，四十九年不是过，以语录付后人
events:
- id: guji-道宁-event-birth
  date: '1050'
  year_of: 1050
  title_zh: 诞生
  description: 生年不详，约北宋中期出生，灵根宿植敏悟坚恪
- id: guji-道宁-event-dharma
  date: '1103'
  year_of: 1103
  title_zh: 遍参蒙五祖演印可
  description: 遍参诸方蒙蕲州五祖山法演印记，列为所嗣二勤一远一宁之宁，后居天宁第一座
- id: guji-道宁-event-kaifu
  date: '1109-02-01'
  year_of: 1109
  title_zh: 受请住持潭州开福报慈
  description: 大观三年二月由崇宁首座受知州席震疏请，前去开福充长老住持为国开堂，拈香酬法乳于五祖演
- id: guji-道宁-event-teaching
  date: '1110'
  year_of: 1110
  title_zh: 开福上堂弘化众盈五百
  description: 住院弘化禅徒大集众盈五百，一柱杖划断古今葛藤，一拂子指开大千障碍，门人善果编次语录
- id: guji-道宁-event-death
  date: '1114'
  year_of: 1114
  title_zh: 住院五年示寂
  description: 住院经五年示寂，告寂偈云住院经五年都虑如顷刻，遗编付门人善果集为开福语录
