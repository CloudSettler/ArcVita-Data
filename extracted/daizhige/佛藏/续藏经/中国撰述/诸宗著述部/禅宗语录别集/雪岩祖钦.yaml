  dilemmas:
  - 守祖师家法与随机接引之间何去何从
  - 住持名山应缘与保任己事之间如何取舍
  - 峻厉痛拶与慈悲摄受之间如何平衡
  lesson: 鼻端眼正方能父作子述，於文采未彰之前一刀两段始见门面光明
  summary_first_person: 吾雪岩祖钦，以无准为父，以高峰为子，历主龙兴道林南明护圣光孝仰山，改声换调重翻少林一曲，但愿学人於一字已多之前一刀两段荐取，不作刻舟求剑守株之解
