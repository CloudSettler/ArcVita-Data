endeavors:
- id: guji-雪岩祖钦-endeavor-1
  title_zh: 历主六刹重翻少林一曲
  summary: 自宝祐元年入潭州龙兴，历湘西道林处州南明仙居护圣湖州光孝袁州仰山，以击拂竖拂痛拶接引，中兴江西湖南禅风
  phases:
  - key: brewing
    name: 嗣无准蕴酿宗眼
    labels:
      zh: 蕴酿
    start_date: 1240
    highlight_event_id: guji-雪岩祖钦-event-birth
  - key: breakthrough
    name: 龙兴入院开堂
    labels:
      zh: 突破
    start_date: 1253-08-01
    highlight_event_id: guji-雪岩祖钦-event-longxing
  - key: climax
    name: 道林南明护圣光孝仰山弘化
    labels:
      zh: 高潮
    start_date: 1255
    highlight_event_id: guji-雪岩祖钦-event-daolin
  - key: closure
    name: 语录付编示寂
    labels:
      zh: 收束
    start_date: 1287
    highlight_event_id: guji-雪岩祖钦-event-death
  decisions:
  - date: 1253-08-01
    title_zh: 宝祐元年就请入潭州龙兴
    rationale: 被业风吹到潭州城里，只得改声换调向十字街头重翻此曲，以续江西湖南慧命
  - date: 1255
    title_zh: 应请住湘西道林提持圆悟家风
    rationale: 据断佛祖命根去处，振坠地宗纲，以松直棘曲凫短鹤长勘验学人
  - date: 1260
    title_zh: 转席南明护圣光孝仰山不守一隅
    rationale: 不以一院一会为足，遍历浙闽湘湖，以炉鞴拂子接引十方，令土旷人稀之运再振
- id: guji-雪岩祖钦-endeavor-2
  title_zh: 上承无准下付高峰传灯
  summary: 以无准师范为父得正法眼，拣择锻造，付法高峰原妙，令父作子述宗风不坠
  phases:
  - key: brewing
    name: 参无准得法为子
    labels:
      zh: 蕴酿
    start_date: 1242
    highlight_event_id: guji-雪岩祖钦-event-birth
  - key: breakthrough
    name: 龙兴拈赵州金佛木佛发明向上
    labels:
      zh: 突破
    start_date: 1253-08-01
    highlight_event_id: guji-雪岩祖钦-event-longxing
  - key: climax
    name: 付法高峰原妙
    labels:
      zh: 高潮
    start_date: 1270
    highlight_event_id: guji-雪岩祖钦-event-transmission
  - key: closure
    name: 门人昭如希陵等编语录四卷
    labels:
      zh: 收束
    start_date: 1298-03-01
    highlight_event_id: guji-雪岩祖钦-event-death
  decisions:
  - date: 1253-08-01
    title_zh: 拈金佛度炉木佛度火别立宗猷
    rationale: 不随赵州强生节目旧解，揭起如来正体，令学人撒开两手自看，免堕话堕
  - date: 1270
    title_zh: 拣付高峰为嗣令狮子向悬崖一拶
    rationale: 良马望见鞭影而驰，须得望见鞭影便驰之儿，方堪付授三老卓巍家业
  - date: 1280
    title_zh: 峻厉家风不许文采已彰后荐取
    rationale: 若待文采彰显已是第二见，须於未开口以前退步就己一踏踏着
events:
- id: guji-雪岩祖钦-event-birth
  title_zh: 降生台州仙居朱氏
  date: 1216
  year_of: 1216
  place_zh: 台州仙居
  description: 宋宁宗嘉定九年降生，俗姓朱，后出家参无准师范得法，号雪岩
- id: guji-雪岩祖钦-event-longxing
  title_zh: 宝祐元年八月初一入潭州龙兴
  date: 1253-08-01
  year_of: 1253
  place_zh: 潭州龙兴禅寺
  description: 指三门八字打开，拈香祝圣后举少林一曲五传至六祖之说，拈赵州金佛不度炉语别创新猷，开堂接众
- id: guji-雪岩祖钦-event-daolin
  title_zh: 住湘西道林提持圆悟宗纲
  date: 1255
  year_of: 1255
  place_zh: 湘西道林禅寺
  description: 据老圆悟断佛祖命根去处，据室拈香，举保寿三圣麻谷临济等公案，冬至腊八解夏小参接引，发明济北平常之道
- id: guji-雪岩祖钦-event-nanming
  title_zh: 住处州南明佛日及护圣光孝仰山
  date: 1262
  year_of: 1262
  place_zh: 处州南明佛日禅寺
  description: 入院以拄杖自在说法，结夏以大圆觉为伽蓝，举临济洛浦灵云桃花等公案，次转护圣光孝仰山，声震浙湘
- id: guji-雪岩祖钦-event-transmission
  title_zh: 付法高峰原妙续慧命
  date: 1270
  year_of: 1270
  place_zh: 仰山禅寺
  description: 以父作子述之志，付正法于高峰原妙，令望鞭影而驰，成宋末元初禅门中兴关键
- id: guji-雪岩祖钦-event-death
  title_zh: 至元二十四年示寂门人编语录
  date: 1287
  year_of: 1287
  place_zh: 湖州光孝一带
  description: 示寂后嗣法门人昭如希陵等编语录四卷，大德二年性存真逸题端，鼻端眼正之道赖以长存
