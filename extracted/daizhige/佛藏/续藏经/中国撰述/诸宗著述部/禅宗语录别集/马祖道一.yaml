    en: Mazu Daoyi
  lifespan:
    birth:
      date: 0709
      precision: year
      is_circa: true
      raw: 汉州什邡人约生於唐景云二年
    death:
      date: '0788-02-01'
      precision: day
      is_circa: false
      raw: 贞元四年二月一日沐浴跏趺入灭
  birth_date: 0709
  death_date: '0788-02-01'
  era: 唐
  reign_ref: 唐玄宗开元至唐德宗贞元
  archetype: 洪州禅开宗立派之祖师
  dilemmas:
  - 坐禅图佛与磨砖岂成镜之困惑
  - 即心是佛与非心非佛权实之抉择
  - 平常心是道与造作污染取舍之考验
  lesson: 道不用修但莫污染，平常心是道，即心即佛，万法皆从心生，任运过时长养圣胎
  summary_first_person: 吾姓马，汉州什邡人，本邑罗汉寺出家，幼依资州唐和尚落发，渝州受具，开元中衡岳习定，遇让和尚以磨砖点破坐禅执，蒙示心地法门而悟，侍奉十秋密受心印，后出建阳佛迹岭历临川南康，大历中隶名锺陵开元，四方云集，示即心是佛平常心是道，贞元四年二月一日归寂
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E8%AF%AD%E5%BD%95%E5%88%AB%E9%9B%86/%E9%A9%AC%E7%A5%96%E9%81%93%E4%B8%80%E7%A6%85%E5%B8%88%E5%B9%BF%E5%BD%95.html
endeavors:
- id: guji-马祖道一-endeavor-1
  title_zh: 衡岳参让磨砖悟道
  summary: 落发出家习定衡岳，因磨砖作镜之诘得悟心地法门，侍奉怀让十秋密受心印
  phases:
  - key: brewing
    name: 落发出家习定
    labels:
      zh: 熏修
    start_date: '0720'
    highlight_event_id: guji-马祖道一-event-birth
  - key: breakthrough
    name: 磨砖问答转机
    labels:
      zh: 点化
    start_date: 0728
    highlight_event_id: guji-马祖道一-event-mozhuan
  - key: climax
    name: 悟心地法门超然
    labels:
      zh: 彻悟
    start_date: 0729
    highlight_event_id: guji-马祖道一-event-mozhuan
  - key: closure
    name: 侍奉十秋受心印
    labels:
      zh: 承继
    start_date: 0738
    highlight_event_id: guji-马祖道一-event-jiangxi
  decisions:
  - date: 0728
    title_zh: 舍坐禅执参究用心
    rationale: 让和尚以磨砖不成镜喻坐禅不得成佛，悟无住法不应取舍，遂请问如何用心合无相三昧
  - date: 0738
    title_zh: 侍奉怀让日益玄奥
    rationale: 蒙开悟心意超然，留侍十秋，六人中独密受心印，为南下阐化奠基
- id: guji-马祖道一-endeavor-2
  title_zh: 江西弘化开洪州宗
  summary: 自建阳佛迹岭历临川南康龚公山，大历隶名锺陵开元，连帅归敬四方云集，立即心是佛平常心是道，室中弟子百三十九人各为宗主
  phases:
  - key: brewing
    name: 建阳佛迹岭初化
    labels:
      zh: 肇始
    start_date: '0745'
    highlight_event_id: guji-马祖道一-event-jiangxi
  - key: breakthrough
    name: 临川南康次第开堂
    labels:
      zh: 展化
    start_date: '0755'
    highlight_event_id: guji-马祖道一-event-jiangxi
  - key: climax
    name: 锺陵开元四方云集
    labels:
      zh: 鼎盛
    start_date: '0770'
    highlight_event_id: guji-马祖道一-event-jiangxi
  - key: closure
    name: 石门经行示疾归寂
    labels:
      zh: 圆寂
    start_date: '0788-01-01'
    highlight_event_id: guji-马祖道一-event-death
  decisions:
  - date: '0770'
    title_zh: 隶名开元广接四方
    rationale: 大历中应路嗣恭景慕亲受宗旨之缘，居锺陵开元，以即心是佛止小儿啼，以非心非佛遣执，应机施设
  - date: '0788-01-01'
    title_zh: 预记石门为归宿地
    rationale: 正月登建昌石门见洞壑平坦，谓朽质当於来月归兹，示疾以日面佛月面佛付嘱，沐浴跏趺而逝
events:
- id: guji-马祖道一-event-birth
  title_zh: 生於汉州什邡出家
  date: 0709
  year_of: 709
  place_zh: 汉州什邡罗汉寺
  description: 姓马氏，容貌奇异牛行虎视，幼依资州唐和尚落发，渝州圆律师处受具
- id: guji-马祖道一-event-mozhuan
  title_zh: 衡岳磨砖悟心地法门
  date: 0728
  year_of: 728
  place_zh: 衡岳传法院
  description: 开元中习定衡岳，遇怀让以磨砖作镜破坐佛之执，示无住法不取舍，闻偈心地含诸种而开悟，侍奉十秋密受心印
- id: guji-马祖道一-event-jiangxi
  title_zh: 阐化江西隶名开元
  date: '0770'
  year_of: 770
  place_zh: 建阳佛迹岭至锺陵开元寺
  description: 自建阳佛迹岭迁临川次南康龚公山，大历中隶名锺陵开元，连帅路嗣恭亲受宗旨，四方学者云集，入室弟子一百三十九人各为宗主，高倡即心是佛平常心是道
- id: guji-马祖道一-event-shimen
  title_zh: 石门经行预记归期
  date: '0788-01-01'
  year_of: 788
  place_zh: 建昌石门山
  description: 贞元四年正月中登石门林中经行，见洞壑平坦，谓侍者朽质当於来月归兹，言讫而回既而示疾
- id: guji-马祖道一-event-death
  title_zh: 跏趺入灭谥大寂
  date: '0788-02-01'
  year_of: 788
  place_zh: 锺陵开元寺
  description: 示疾答日面佛月面佛，二月一日沐浴跏趺入灭，元和中谥大寂禅师塔曰大庄严
