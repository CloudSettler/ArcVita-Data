endeavors:
- id: guji-宗杲-endeavor-1
  title_zh: 住径山弘看话禅破默照邪执
  summary: 承圆悟之印住持径山以看话禅接化学人破斥守静默照砺爪摩空振临济家风
  phases:
  - key: brewing
    name: 参圆悟得法
    labels:
      zh: 参学悟道
    start_date: 1125
    highlight_event_id: guji-宗杲-event-jingshan
  - key: breakthrough
    name: 出住径山四方云集
    labels:
      zh: 开堂化众
    start_date: 1137
    highlight_event_id: guji-宗杲-event-jingshan
  - key: climax
    name: 举扬话头摧邪显正
    labels:
      zh: 宗锋峻烈
    start_date: 1138
    highlight_event_id: guji-宗杲-event-jingshan
  decisions:
  - date: 1137
    title_zh: 住持径山不避权贵往来
    rationale: 借士大夫周旋广弘宗乘以缟裹旃檀之喻令宗说兼畅而砻斫门徒不失山林骨格
  - date: 1138
    title_zh: 焚话本斥默照为邪禅
    rationale: 见学人执静坐默照为究竟恐断佛慧命故峻烈破执令回看话头大疑大悟
- id: guji-宗杲-endeavor-2
  title_zh: 谪衡阳集正法眼藏示后学
  summary: 以罪居衡阳杜门循省随手酬酢为衲子抄录成轴目为正法眼藏但取彻证向上者以解黏去缚
  phases:
  - key: brewing
    name: 以言获罪南谪衡阳
