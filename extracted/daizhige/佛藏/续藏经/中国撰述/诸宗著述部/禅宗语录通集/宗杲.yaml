  - key: breakthrough
    name: 衲子请益随手抄录成轴
    labels:
      zh: 酬酢成编
    start_date: 1149
    highlight_event_id: guji-宗杲-event-zhengfa
  - key: climax
    name: 以琅邪为篇首目为正法眼藏
    labels:
      zh: 决择付世
    start_date: 1151
    highlight_event_id: guji-宗杲-event-zhengfa
  - key: closure
    name: 答张子韶书明收忠国师意
    labels:
      zh: 护法存正
    start_date: 1152
    highlight_event_id: guji-宗杲-event-zhengfa
  decisions:
  - date: 1151
    title_zh: 不分门派但收正知正见
    rationale: 众生根器不同须备众生机故不分云门临济曹洞沩仰法眼但取堪解黏去缚者以救瞥脱一机之偏
  - date: 1152
    title_zh: 力主保留忠国师大珠老婆禅
    rationale: 法性须宽波澜须阔方能摄钝根不断生死命根若尽删拖泥带水则揠苗助长故存之以救一类根器
