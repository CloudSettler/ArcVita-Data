person:
  qid: guji-怀让
  name_zh: 怀让
  names:
    zh: 南岳怀让
    en: Nanyue Huairang
  lifespan:
    birth:
      date: 0677-04-08
      precision: day
      is_circa: false
      raw: 仪凤二年四月八日
    death:
      date: 0744-08-11
      precision: day
      is_circa: false
      raw: 天宝三年八月十一日
  birth_date: 0677-04-08
  death_date: 0744-08-11
  era: 唐
  reign_ref: 高宗仪凤至玄宗天宝
  archetype: 禅宗化导祖师
  dilemmas:
  - 修证即不无与污染即不得之间如何立不污染之宗
  - 破坐禅成佛之执而全无相三昧之正传
  lesson: 心地含种遇泽即萌，离取舍而守不污染，以活机磨砖点化后学
  summary_first_person: 吾金州杜氏子，三岁殊异，十五辞亲往荆州玉泉依弘景出家，习毗尼而叹无为，谒嵩山安而直诣曹溪，八载乃悟蒙六祖印可，侍奉十五载而居南岳般若，以磨砖牛车点化道一，示万法从心而无住无碍，终老南岳
  source_urls:
  - https://daizhige.org/guji-guzunsuyu
  - https://github.com/daizhige-org/daizhigev20
endeavors:
- id: guji-怀让-endeavor-1
  title_zh: 荆州出家曹溪得法
  summary: 辞亲出家受具习律，谒安启发直诣曹溪，八载参究得不污染印可
  phases:
  - key: brewing
    name: 辞亲出家习律
    labels:
      zh:
      - 求道出离
    start_date: 0687-01-01
    highlight_event_id: guji-怀让-event-chujia
  - key: breakthrough
    name: 曹溪参礼六祖
    labels:
      zh:
      - 参究悟入
    start_date: 0698-01-01
    highlight_event_id: guji-怀让-event-caoqi
  - key: climax
    name: 八载有省蒙印
    labels:
      zh:
      - 以心印心
    start_date: 0706-01-01
    highlight_event_id: guji-怀让-event-yinzi
  - key: closure
    name: 侍奉圆满南行
    labels:
      zh:
      - 传付南岳
    start_date: 0713-01-01
    highlight_event_id: guji-怀让-event-nanyue
  decisions:
  - date: 0687-01-01
    title_zh: 十五辞亲玉泉出家
    rationale: 感白气之瑞与玄静之奇，志在无为上乘，故舍俗往荆州依弘景
  - date: 0698-01-01
    title_zh: 舍律学谒安直诣曹溪
    rationale: 叹出家为无为法，同学劝谒嵩山安，安启发而直指曹溪求心地
  - date: 0706-01-01
    title_zh: 直陈说似一物即不中
    rationale: 八载参什么物与么来，悟修证不无而污染不得，故得护念印可
- id: guji-怀让-endeavor-2
  title_zh: 南岳化众磨砖点马
  summary: 先天居南岳般若示心生万法，多方诱导习坐之道一以磨砖喻觉
  phases:
  - key: brewing
    name: 始往南岳般若
    labels:
      zh:
      - 开堂化众
    start_date: 0713-01-01
    highlight_event_id: guji-怀让-event-nanyue
  - key: breakthrough
    name: 庵前磨砖设喻
    labels:
      zh:
      - 機鋒點化
    start_date: 0715-01-01
    highlight_event_id: guji-怀让-event-mozhuan
  - key: climax
    name: 牛車坐佛開悟
    labels:
      zh:
      - 直指心地
    start_date: 0715-06-01
    highlight_event_id: guji-怀让-event-mozhuan
  - key: closure
    name: 付嘱六人示寂
    labels:
      zh:
      - 傳燈示滅
    start_date: 0744-08-11
    highlight_event_id: guji-怀让-event-death
  decisions:
  - date: 0713-01-01
    title_zh: 居般若示心地法门
    rationale: 奉六祖馬駒之讖南行，示一切萬法從心生而所作無礙，唯慎接上根
  - date: 0715-01-01
    title_zh: 磨磚喻牛駕車點道一
    rationale: 見道一獨習坐禪不顧，以磨磚不成鏡喻坐禪豈成佛，破執坐相而顯無住
  - date: 0720-01-01
    title_zh: 印六人而許道一得心
    rationale: 觀侍者各契其一，以善古今印道一，遣僧驗鹽醬消息而然之
events:
- id: guji-怀让-event-birth
  title_zh: 金州降诞
  date: 0677-04-08
  year_of: 677
  place: 金州安康
  description: 儀鳳二年四月八日生，感白氣應玄象，太史奏聞，高宗敕守慰家，三歲炳然恩讓
- id: guji-怀让-event-chujia
  title_zh: 荆州玉泉出家受戒
  date: 0687-01-01
  year_of: 687
  place: 荆州玉泉寺
  description: 年十五辭親依弘景律師出家，通天二年受戒，後習毗尼藏而歎無為最勝
- id: guji-怀让-event-caoqi
  title_zh: 謁安直詣曹溪參祖
  date: 0698-01-01
  year_of: 698
  place: 嵩山與曹溪
  description: 與坦然同謁嵩山安得啟發，直詣曹溪禮六祖，答什麼處來與什麼物與麼來而無語
- id: guji-怀让-event-yinzi
  title_zh: 八載有省蒙祖印可
  date: 0706-01-01
  year_of: 706
  place: 曹溪
  description: 經八載忽有省，白說似一物即不中，蒙示不污染即護念，得多羅讖與馬駒記，侍奉十五載
- id: guji-怀让-event-nanyue
  title_zh: 先天始往南岳般若
  date: 0713-01-01
  year_of: 713
  place: 南岳般若寺
  description: 先天二年居般若寺示眾，演一切萬法從心生，心無所生法無能住，所作無礙
- id: guji-怀让-event-mozhuan
  title_zh: 磨磚點化馬祖道一
  date: 0715-01-01
  year_of: 715
  place: 南岳傳法院庵前
  description: 於庵前磨磚云磨作鏡，詰磨磚不成鏡則坐禪豈成佛，以牛駕車喻打牛非打車，示無住法不取捨，令悟心地法眼
- id: guji-怀让-event-death
  title_zh: 天寶南岳示寂
  date: 0744-08-11
  year_of: 744
  place: 南岳
  description: 天寶三年八月十一日示寂於南岳，敕諡大慧禪師，塔號最勝輪，歸登撰塔記
