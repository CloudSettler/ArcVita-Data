person:
  qid: guji-无准师范
  name_zh: 无准师范
  names:
    zh: 无准师范
    en: Wuzhun Shifan
  lifespan:
    birth:
      date: 1178
      precision: year
      is_circa: true
      raw: 淳熙五年左右生于剑州梓潼
    death:
      date: 1249-03-15
      precision: day
      is_circa: false
      raw: 淳祐九年己酉三月十五日示寂
  birth_date: 1178
  death_date: 1249-03-15
  era: 南宋
  reign_ref: 宋理宗淳祐年间
  archetype: 中兴祖庭型禅师
  dilemmas:
  - 既要精通经教又要放下文字执着方能彻悟本心
  - 既居径山大刹受帝王礼遇又须持退耕归藏之心以全道业
  lesson: 直心彻悟不昧初心退步保任方能续慧命兴祖庭
  summary_first_person: 我是剑州梓潼雍氏子九岁依阴平出家绍熙登具后南下参究历谒佛照破庵于石笋庵下豁然大彻蒙付法印后历住清凉焦山雪窦育王晚年补处径山两经火劫重兴蒙召内廷说法赐号佛鉴终筑退耕于明月池示寂塔于正续之侧
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E8%AF%AD%E5%BD%95%E9%80%9A%E9%9B%86/%E5%BE%84%E7%9F%B3%E6%BB%B4%E4%B9%B3%E9%9B%86.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E4%B8%AD%E5%9B%BD%E6%92%B0%E8%BF%B0/%E8%AF%B8%E5%AE%97%E8%91%97%E8%BF%B0%E9%83%A8/%E7%A6%85%E5%AE%97%E8%AF%AD%E5%BD%95%E9%80%9A%E9%9B%86/%E5%BE%84%E7%9F%B3%E6%BB%B4%E4%B9%B3%E9%9B%86.html
endeavors:
- id: guji-无准师范-endeavor-1
  title_zh: 参学悟道求彻本心
  summary: 自阴平薙染经教成诵南下成都究坐禅为何物历参佛照破庵以狗子业识风吹水纹等机锋穷究终大彻得法
  phases:
  - key: brewing
    name: 阴平出家经教成诵
    labels:
      zh: 蓄势参究
    start_date: 1187
    highlight_event_id: guji-无准师范-event-ordination
  - key: breakthrough
    name: 厕前提话昼夜体究略省
    labels:
      zh: 初省
    start_date: 1195
    highlight_event_id: guji-无准师范-event-first-awakening
  - key: climax
    name: 石笋庵下闻风吹水纹大彻
    labels:
      zh: 豁然大彻
    start_date: 1209
    highlight_event_id: guji-无准师范-event-great-awakening
  - key: closure
    name: 蒙破庵付嘱法偈承印
    labels:
      zh: 得法承印
    start_date: 1210
    highlight_event_id: guji-无准师范-event-dharma-transmission
  decisions:
  - date: 1194
    title_zh: 登具后南下成都坐夏参尧
    rationale: 不滞经书成诵之利欲究坐底阿谁故远行求决
  - date: 1209
    title_zh: 随破庵游石笋放下捉心
    rationale: 悟猢狲子不用捉如风吹水自然成纹故当下放下而彻
- id: guji-无准师范-endeavor-2
  title_zh: 住持径山重兴祖庭
  summary: 历住清凉焦山雪窦育王应朝命补处径山两经寺毁而重建筑万年正续接纳云水入内廷说法蒙赐佛鉴晚年筑退耕求老
  phases:
  - key: brewing
    name: 分座瑞岩初出世清凉
    labels:
      zh: 初住持
    start_date: 1215
    highlight_event_id: guji-无准师范-event-dharma-transmission
  - key: breakthrough
    name: 历住焦山雪窦育王声著
    labels:
      zh: 历练名著
    start_date: 1224
    highlight_event_id: guji-无准师范-event-abbacy-jingshan
  - key: climax
    name: 补处径山内廷说法赐佛鉴
    labels:
      zh: 极盛弘化
    start_date: 1230
    highlight_event_id: guji-无准师范-event-imperial-preaching
  - key: closure
    name: 筑退耕区画后事示寂正续
    labels:
      zh: 退藏示寂
    start_date: 1248
    highlight_event_id: guji-无准师范-event-death
  decisions:
  - date: 1230
    title_zh: 应朝命补处径山不辞劳瘁
    rationale: 为续临济正脉纵寺毁而逆知其数亦不动容经意重建以安众
  - date: 1248
    title_zh: 筑室明月池榜退耕乞老
    rationale: 既老且病无力东语西话当抖擞从前说不到者以明去就故筑归藏
events:
- id: guji-无准师范-event-birth
  date: 1178
  year_of: 1178
  title_zh: 生于剑州梓潼雍氏
  description: 剑州梓潼雍氏子母家世未详后蜀中乳养先祀遂绝故终身以香火报本
- id: guji-无准师范-event-ordination
  date: 1194-12-01
  year_of: 1194
  title_zh: 阴平出家绍熙五年冬登具
  description: 九岁依阴平山道钦出家经书过目成诵绍熙五年冬登具明年次成都坐夏正法
- id: guji-无准师范-event-first-awakening
  date: 1195-06-01
  year_of: 1195
  title_zh: 参瞎堂高弟尧厕前有省
  description: 遇瞎堂高弟名尧请益坐禅之法以禅是何物坐底阿谁昼夜体究于厕前提话有省
- id: guji-无准师范-event-great-awakening
  date: 1209-08-01
  year_of: 1209
  title_zh: 随破庵游石笋庵大彻
  description: 随破庵游石笋庵有道者问猢狲子捉不住庵答如风吹水自然成纹在傍大彻汗流夹背尽脱前疑
- id: guji-无准师范-event-dharma-transmission
  date: 1210-03-01
  year_of: 1210
  title_zh: 蒙破庵付法偈分座瑞岩
  description: 破庵付法偈我若不见时汝应不见见等偕游天童台雁留分座于瑞岩云巢梦伟衣冠持茆见授而应清凉之请
- id: guji-无准师范-event-abbacy-jingshan
  date: 1230-05-01
  year_of: 1230
  title_zh: 历住雪窦育王补处径山
  description: 三年迁焦山期年迁雪窦又三年敕移育王又三年嵩少林散席朝命补处径山明年寺毁不动容而重建
- id: guji-无准师范-event-imperial-preaching
  date: 1233-10-01
  year_of: 1233
  title_zh: 召入内廷修政慈明说法赐佛鉴
  description: 有旨召入内廷御修政殿引见奏对详明赐金襕僧伽衣又宣入慈明殿升座帝垂帘听大悦赐号佛鉴筑万年正续接待云水藏御翰奉祖香
- id: guji-无准师范-event-death
  date: 1249-03-15
  year_of: 1249
  title_zh: 退耕示寂塔于正续之侧
  description: 淳祐戊申筑室明月池榜退耕乞老己酉三月旦日起身抖衣是多少而归十五日集众区画后事书遗偈来时空索索去也赤条条等移顷而逝停龛二七日奉全身葬谥圆照
