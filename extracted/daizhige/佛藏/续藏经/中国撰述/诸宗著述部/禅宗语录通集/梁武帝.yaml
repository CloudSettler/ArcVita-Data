  birth_date: '0464-01-01'
  death_date: '0549-06-12'
  era: 南北朝南梁
  reign_ref: 天监至太清
  archetype: 护法求道型帝王
  dilemmas:
  - 有为功德与无漏功德之辨执起寺写经度僧而难契空寂
  - 帝王权威与祖师直指之间问圣谛第一义而滞于名相对峙
  - 护持与放下之间欲诏回达磨而不知大道不属诏命
  lesson: 有漏善行如影随形唯净智妙圆体自空寂方为真实功德
  summary_first_person: 朕自即位起寺写经度僧无数却被达磨一句实无功德点破又问圣谛第一义但得廓然无圣不识对朕者谁后请傅大士讲经挥尺便下始知佛法不在言说勋业亦属有漏
  source_urls:
  - https://daizhige.org/fozang/xuzangjing/chanlinleiju.html
  - https://cbeta.org/result/normal/X78/1299_001.htm
