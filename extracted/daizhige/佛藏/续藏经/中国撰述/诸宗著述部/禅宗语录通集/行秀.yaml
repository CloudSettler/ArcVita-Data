endeavors:
- id: guji-行秀-endeavor-1
  title_zh: 嗣雪岩慧满弘曹洞正宗
  description: 河内出身，参雪岩而得绪余，住中都万松，举洞山万里无寸草话，辨尊贵一路，主张门户，拱默威严中转位提持
  phases:
  - key: brewing
    name: 河内参学酝酿
    labels:
      zh: 酝酿
    start_date: 1180-01-01
    highlight_event_id: guji-行秀-event-birth
  - key: breakthrough
    name: 嗣雪岩得法突破
    labels:
      zh: 突破
    start_date: 1195-01-01
    highlight_event_id: guji-行秀-event-1
  - key: climax
    name: 住万松高峰
    labels:
      zh: 高潮
    start_date: 1215-01-01
    highlight_event_id: guji-行秀-event-2
  - key: closure
    name: 付嘱云仍收束
    labels:
      zh: 收束
    start_date: 1240-01-01
    highlight_event_id: guji-行秀-event-death
  decisions:
  - date: 1195-01-01
    title_zh: 承嗣雪岩
    rationale: 忝授绪余，义无牢让，为续洞山正脉，须明尊贵底人不处尊贵位
  - date: 1215-01-01
    title_zh: 住持万松行宫
    rationale: 王山顶上滏水岸边举洞山示众，借功施设，左右分权，全成廊幕边事
- id: guji-行秀-endeavor-2
  title_zh: 评唱天童觉拈古请益录
  description: 应众请益，自庚寅九月旦起拈天童百则，如文殊过夏卧轮伎俩百丈上堂南泉圆相洞山尊贵法灯开堂等，廿七日毕，二十八日序，词源滚滚开合卷舒
  phases:
  - key: brewing
    name: 请益发起酝酿
    labels:
      zh: 酝酿
    start_date: 1230-09-01
    highlight_event_id: guji-行秀-event-3
  - key: breakthrough
    name: 拈弄百则突破
    labels:
      zh: 突破
    start_date: 1230-09-10
    highlight_event_id: guji-行秀-event-3
  - key: climax
    name: 伎俩已尽高潮
    labels:
      zh: 高潮
    start_date: 1230-09-27
    highlight_event_id: guji-行秀-event-3
  - key: closure
    name: 二十八日序收束
    labels:
      zh: 收束
    start_date: 1230-09-28
    highlight_event_id: guji-行秀-event-3
  decisions:
  - date: 1230-09-01
    title_zh: 应请评唱天童拈古
    rationale: 最初威音王前无孔铁锤被人拈弄成百则，湛然之后须再呈丑拙，老不歇心以激云仍
  - date: 1230-09-28
    title_zh: 序而自警不犯手势
    rationale: 撩人笑话之后方知铁团不曾动丝毫，休侵洞岭初秋草，请看疏山腊月莲
events:
- id: guji-行秀-event-birth
  date: 1166-01-01
  year_of: 1166
  title_zh: 诞生河内
  description: 金大定六年生于河内刘氏，后参禅得法，号万松老人
- id: guji-行秀-event-1
  date: 1195-01-01
  year_of: 1195
  title_zh: 嗣法雪岩慧满
  description: 亲觐雪岩，于王山顶滏水岸边闻洞山万里无寸草话有省，忝授绪余，继曹洞宗风
- id: guji-行秀-event-2
  date: 1215-01-01
  year_of: 1215
  title_zh: 住持万松弘法
  description: 住中都万安禅院改万松行宫，举唱借功施设转位提持，明尊贵一路，接引耶律楚材等士俗
- id: guji-行秀-event-3
  date: 1230-09-01
  year_of: 1230
  title_zh: 评唱请益录百则
  description: 自庚寅九月旦应众请益，评唱天童觉拈古，自文殊过夏至洞山钵袋共百则，廿七日毕，廿八日序，评文殊三处过夏迦叶摈出，卧轮伎俩对六祖语，百丈上堂拄杖打散，南泉圆相归宗坐谷拜
- id: guji-行秀-event-death
  date: 1246-01-01
  year_of: 1246
  title_zh: 示寂
  description: 蒙古定宗元年示寂，世寿八十一，付嘱门人无孔窍生铁团几曾动着，野老从来不犯手势
