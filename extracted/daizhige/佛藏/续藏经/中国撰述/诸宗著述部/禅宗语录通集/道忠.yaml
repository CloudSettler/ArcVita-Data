endeavors:
- id: guji-道忠-endeavor-1
  title_zh: 汇刊古尊宿语录四十八卷
  summary: 遍搜禅宗诸老宿语录，由南岳马祖百丈以至云门法眼，汇为四十八卷，奠定禅录通集规模
  phases:
  - key: brewing
    name: 搜访旧本
    labels:
      zh:
      - 搜集旧刊
    start_date: 1670-01-01
    highlight_event_id: guji-道忠-event-compile
  - key: breakthrough
    name: 定卷编次
    labels:
      zh:
      - 编次卷目
    start_date: 1673-01-01
    highlight_event_id: guji-道忠-event-catalogue
  - key: climax
    name: 开雕流通
    labels:
      zh:
      - 刊刻流通
    start_date: 1676-01-01
    highlight_event_id: guji-道忠-event-catalogue
  - key: closure
    name: 目录告成
    labels:
      zh:
      - 目录告成
    start_date: 1679-01-01
    highlight_event_id: guji-道忠-event-catalogue
  decisions:
  - date: 1673-01-01
    title_zh: 以世系分卷重定次第
    rationale: 旧本杂乱无绪，依南岳马祖下诸派源流分卷，使后学易考法脉
  - date: 1676-01-01
    title_zh: 以语录全存不删异说
    rationale: 风穴南院诸本与正灯所录大异，宁并存以俟考，不敢辄删
- id: guji-道忠-endeavor-2
  title_zh: 考订增补鼓山本与逸文
  summary: 新刊增补鼓山本撰述诸家，补白云端逸录，辨正灯录与杨岐录所引异同，以全禅籍
  phases:
  - key: brewing
    name: 比勘诸本
    labels:
      zh:
      - 校勘比对
    start_date: 1677-01-01
    highlight_event_id: guji-道忠-event-supplement
  - key: breakthrough
    name: 增补十六家
    labels:
      zh:
      - 增补新刊
    start_date: 1678-06-01
    highlight_event_id: guji-道忠-event-supplement
  - key: climax
    name: 补录白云端
    labels:
      zh:
      - 补逸拾遗
    start_date: 1679-03-01
    highlight_event_id: guji-道忠-event-supplement
  - key: closure
    name: 跋识异同
    labels:
      zh:
      - 跋识存疑
    start_date: 1680-01-01
    highlight_event_id: guji-道忠-event-supplement
  decisions:
  - date: 1678-06-01
    title_zh: 增鼓山本二十家取十六家合为三十六家
    rationale: 鼓山本新出可补旧阙，择其精要以广流通，不致冗滥
  - date: 1680-01-01
    title_zh: 存正灯杨岐异文而不强合
    rationale: 正灯与续刊杨岐录不载文会诸说，别刊所览又异，直书以存疑，俟来哲考正
