  lesson: 透三關而無透者，明心見性以續佛慧命，破外道昏蒙以安民物
  summary_first_person: 朕膺元后父母之任，十年未談禪宗，念人天慧命，閱從上古錐語錄，擇提持向上直指真宗者手為刪輯，刊示來今，嘉惠後學
