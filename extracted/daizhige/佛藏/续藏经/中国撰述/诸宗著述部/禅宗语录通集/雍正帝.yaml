endeavors:
- id: guji-雍正帝-endeavor-1
  person_qid: guji-雍正帝
  title_zh: 御選語錄編纂刊行
  summary: 幾暇辨味淄澠，閱古錐語錄，擇十二禪師並紫陽真人及蓮池大師要語，手為刪輯，成十九卷，弁總序於篇端
  phases:
  - key: brewing
    name: 御極十年未談禪
    labels:
      zh: 潛養
    start_date: 1723-01-01
    highlight_event_id: guji-雍正帝-event-1
  - key: breakthrough
    name: 辨味閱藏擇善知識
    labels:
      zh: 抉擇
    start_date: 1732-01-01
    highlight_event_id: guji-雍正帝-event-2
  - key: climax
    name: 御制總序指明三關
    labels:
      zh: 總綱
    start_date: 1733-05-24
    highlight_event_id: guji-雍正帝-event-2
  - key: closure
    name: 分卷刊示來今
    labels:
      zh: 流通
    start_date: 1733-07-01
    highlight_event_id: guji-雍正帝-event-3
  decisions:
  - date: 1733-05-24
    title_zh: 作御制總序明透三關之理
    rationale: 去聖遙遠魔外益繁，不達佛心妄參祖席，故指明初步破參透重關踏末後關，以破三端訛謬
  - date: 1733-06-01
    title_zh: 擇僧肇永嘉寒山拾得等十二家並紫陽蓮池
    rationale: 窮微洞本究旨通宗，深契不二一味，能使未見未聞者得妙見妙聞，故以為人天眼目刊行
- id: guji-雍正帝-endeavor-2
  person_qid: guji-雍正帝
  title_zh: 以居士身護持宗門正眼
  summary: 自稱圓明居士，作圓明百問，附上諭二道，辨僧肇非小乘，正永嘉一宿覺，斥執空弄影拾涕唾之弊
  phases:
  - key: brewing
    name: 自號圓明參究宗乘
    labels:
      zh: 自修
    start_date: 1724-01-01
    highlight_event_id: guji-雍正帝-event-1
  - key: breakthrough
    name: 正僧肇永嘉宗旨
    labels:
      zh: 正名
    start_date: 1733-05-25
    highlight_event_id: guji-雍正帝-event-3
  - key: climax
    name: 拈提趙州雲門永明示範
    labels:
      zh: 拈提
    start_date: 1733-06-01
    highlight_event_id: guji-雍正帝-event-3
  - key: closure
    name: 以圓明語錄上諭垂訓叢林
    labels:
      zh: 垂訓
    start_date: 1733-08-01
    highlight_event_id: guji-雍正帝-event-3
  decisions:
  - date: 1733-05-25
    title_zh: 辨僧肇非小乘刊其要文
    rationale: 肇論般若無知涅槃無名深明宗旨，不立文字慧命無隔封疆今古，故序而刊行破達摩前無宗旨之說
  - date: 1733-06-15
    title_zh: 錄雲門趙州精粹示真軌範
    rationale: 雲門超情絕解直指自心，趙州皮膚剝落獨見真實，皆達摩護念，故刪輯以示後學令直入如來地
events:
- id: guji-雍正帝-event-birth
  person_qid: guji-雍正帝
  title_zh: 誕生於北京紫禁城永和宮
  date: 1678-12-13
  year_of: 1678
  place_zh: 北京紫禁城
  summary: 康熙十七年十月三十日生，為聖祖第四子，母孝恭仁皇后
- id: guji-雍正帝-event-1
  person_qid: guji-雍正帝
  title_zh: 登極改元雍正御極理政
  date: 1722-12-27
  year_of: 1722
  place_zh: 北京太和殿
  summary: 康熙六十一年十一月二十日即皇帝位，明年改元雍正，以元后父母之任循周孔之轍期民物之安
- id: guji-雍正帝-event-2
  person_qid: guji-雍正帝
  title_zh: 作御制總序闡透三關
  date: 1733-05-24
  year_of: 1733
  place_zh: 北京圓明園
  summary: 雍正癸丑四月朔日作總序，明初步破參透重關踏末後關，斥上中下三種訛謬，發刊御選語錄總目十九卷
- id: guji-雍正帝-event-3
  person_qid: guji-雍正帝
  title_zh: 撰諸家御制序刊成御選語錄
  date: 1733-08-01
  year_of: 1733
  place_zh: 北京
  summary: 自四月望至七月朔連作僧肇永嘉寒山拾得溈仰趙州雲門永明紫陽諸序，采肇論永嘉集證道歌等要文編次成集附蓮池外集歷代前後集及當今法會
- id: guji-雍正帝-event-death
  person_qid: guji-雍正帝
  title_zh: 崩於圓明園九州清晏殿
  date: 1735-10-08
  year_of: 1735
  place_zh: 北京圓明園
  summary: 雍正十三年八月二十三日吉祥滅度，在位十三年，御選語錄已刊示叢林嘉惠後學
