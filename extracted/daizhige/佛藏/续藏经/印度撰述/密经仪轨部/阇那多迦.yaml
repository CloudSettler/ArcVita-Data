  archetype: 译经弘法僧
  dilemmas:
  - 因果业报丝毫不爽与心性本空顿悟如何会通示人
  - 渐法顿法分途而证道理一如何兼顾利钝众生
  - 梵本古义深奥与华言俗解如何善巧转译令群迷得悟
  lesson: 发善言不如发善心，发善心不如行善事，因缘善则果报福，识自本心见自本性即得成佛
  summary_first_person: 我是天竺沙门阇那多迦，唐时来华译出十六大罗汉因果识见颂，传十六尊者各七颂共一百一十二颂，直指因缘果报与识心见性悟本成佛之旨，愿众生断恶修善离生死苦同证菩提
