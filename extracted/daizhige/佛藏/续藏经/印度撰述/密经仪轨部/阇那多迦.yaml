    title_zh: 决定以法印法船法灯等喻摄持众机
    rationale: 众生着恶昧善根机各异，借法船法灯法水法桥等喻破暗除秽，令渐顿皆得悟入
events:
- id: guji-阇那多迦-event-birth
  title_zh: 生于天竺出家为沙门
  date: 0650-01-01
  year_of: 650
  place_zh: 天竺
  description: 约唐初生于天竺，累学戒定慧，通梵典，立志弘法，后东来华土
- id: guji-阇那多迦-event-translation
  title_zh: 唐时译出十六大罗汉因果识见颂
  date: 0690-01-01
  year_of: 690
  place_zh: 华土译场
  description: 自称天竺沙门阇那多迦译，记十六大阿罗汉于崛陀山为摩拏罗多等各说七颂共一百一十二颂，明因缘果报与识心见性悟本成佛大法
- id: guji-阇那多迦-event-preaching
  title_zh: 宣说因果识见劝善度众
  date: 0695-06-01
  year_of: 695
  place_zh: 华土讲席
  description: 依所译颂文广说发善言发善心行善事福报差别，劝断十恶持戒忍辱孝亲放生，示渐法顿法理一令群魔三恶不起于心
- id: guji-阇那多迦-event-death
  title_zh: 示寂于唐世法住流传
  date: 0710-01-01
  year_of: 710
  place_zh: 华土
  description: 约唐中宗时示寂，所译因果识见颂垂于末劫流在人间，后经范仲淹序录承天寺别录藏之，普劝奉持
