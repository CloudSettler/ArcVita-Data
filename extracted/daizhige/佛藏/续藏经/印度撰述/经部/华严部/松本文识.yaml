endeavors:
- id: guji-松本文识-endeavor-1
  title_zh: 访获古宋本圆觉经检出佚文
  summary: 以古宋本一帖对勘现存诸藏本检出贤善首品前百十三言佚文
  phases:
  - key: brewing
    name: 偶获古宋本
    labels:
      zh: 访书得本
    start_date: 1911-10
    highlight_event_id: guji-松本文识-event-1
  - key: breakthrough
    name: 对勘检出佚文
    labels:
      zh: 校勘发现
    start_date: 1911-11
    highlight_event_id: guji-松本文识-event-2
  - key: closure
    name: 断为误脱佚文
    labels:
      zh: 考定结论
    start_date: 1911-12
    highlight_event_id: guji-松本文识-event-2
  decisions:
  - date: 1911-11
    title_zh: 以宋本对校诸藏通行本
    rationale: 宋本有汝善男子当获来世至无令生退屈百十三言而诸藏本皆无须比勘定是非
  - date: 1911-12
    title_zh: 断文体不一乃误脱
    rationale: 全经十二菩萨皆长行加偈重说而贤善首独缺偈故知传刻脱去当补
- id: guji-松本文识-endeavor-2
  title_zh: 撰跋录文示旧藏经者
  summary: 明治辛亥十二月作跋具录重颂以补圆觉会之阙
  phases:
  - key: brewing
    name: 起意示人
    labels:
      zh: 发愿录文
    start_date: 1911-12
    highlight_event_id: guji-松本文识-event-3
  - key: climax
    name: 具录偈文
    labels:
      zh: 录文传世
    start_date: 1911-12
    highlight_event_id: guji-松本文识-event-3
  - key: closure
    name: 跋成流通
    labels:
      zh: 撰跋流通
    start_date: 1911-12
    highlight_event_id: guji-松本文识-event-3
  decisions:
  - date: 1911-12
    title_zh: 为看旧藏经者具录全文
    rationale: 恐学者不见宋本故将尔时世尊重宣此义以下偈文全录以便持诵护持
  - date: 1911-12
    title_zh: 署明治辛亥岁十二月以记
    rationale: 明记时地与得本缘起以取信后人并存版本源流
