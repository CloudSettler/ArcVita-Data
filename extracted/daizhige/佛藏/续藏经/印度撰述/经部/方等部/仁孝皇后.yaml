      raw: 永乐五年七月
  birth_date: 1362
  death_date: 1407-08-10
  era: 明初
  reign_ref: 永乐
  archetype: 弘法国母
  dilemmas:
  - 国难危困守城与深宫持诵安忍之间的取舍
  - 梦感密因不敢自秘与广施流通利世之间的抉择
  - 正位中宫赞助之谦与母仪天下教化之责之间的平衡
  lesson: 以清净信心持守梦授妙典，临难不怖，流通不秘，方能转个人感应为济世津梁。
  summary_first_person: 吾洪武三十一年春正月朔旦焚香静坐，忽见观世音导吾升耆阇崛菩提场，授以第一希有大功德经，诵三遍记忆无遗，口有异香，合中香气七日不散。靖难秋难果作，吾持诵益力恬无怖畏。及平定祸难正位中宫，深惟此经奥义微妙不可思议，不敢自秘，用锓梓广施，作济苦津梁，觉途捷径，以示妙道于无穷。
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E5%8D%B0%E5%BA%A6%E6%92%B0%E8%BF%B0/%E7%BB%8F%E9%83%A8/%E6%96%B9%E7%AD%89%E9%83%A8/%E5%A4%A7%E6%98%8E%E4%BB%81%E5%AD%9D%E7%9A%87%E5%90%8E%E6%A2%A6%E6%84%9F%E4%BD%9B%E8%AF%B4%E7%AC%AC%E4%B8%80%E5%B8%8C%E6%9C%89%E5%A4%A7%E5%8A%9F%E5%BE%B7%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E7%BB%AD%E8%97%8F%E7%BB%8F/%E5%8D%B0%E5%BA%A6%E6%92%B0%E8%BF%B0/%E7%BB%8F%E9%83%A8/%E6%96%B9%E7%AD%89%E9%83%A8/%E5%A4%A7%E6%98%8E%E4%BB%81%E5%AD%9D%E7%9A%87%E5%90%8E%E6%A2%A6%E6%84%9F%E4%BD%9B%E8%AF%B4%E7%AC%AC%E4%B8%80%E5%B8%8C%E6%9C%89%E5%A4%A7%E5%8A%9F%E5%BE%B7%E7%BB%8F.md
endeavors:
- id: guji-仁孝皇后-endeavor-1
  title_zh: 梦感授经与刊刻流通
  summary: 洪武末年梦感观音授第一希有大功德经，日夜持诵，永乐初年作序锓梓广施流通。
  phases:
  - key: brewing
    name: 焚香阅藏凝定
    labels:
      zh: 焚香凝定
    start_date: 1398-01-01
    highlight_event_id: guji-仁孝皇后-event-dream
  - key: breakthrough
    name: 梦游耆阇崛得授经
    labels:
      zh: 梦感授经
    start_date: 1398-02-06
    highlight_event_id: guji-仁孝皇后-event-dream
  - key: climax
    name: 持诵应难无畏
    labels:
      zh: 持诵应难
    start_date: 1399-09-01
    highlight_event_id: guji-仁孝皇后-event-defend
  - key: closure
    name: 作序锓梓广施
    labels:
      zh: 刊经流通
    start_date: 1403-02-08
    highlight_event_id: guji-仁孝皇后-event-publish
  decisions:
  - date: 1398-02-06
    title_zh: 亟取笔札书所授经咒不遗一字
    rationale: 以净瓶甘露灌顶后忆念明了，恐梦寐易失，故即时默记书写，日夜持诵不辍，以固善因。
  - date: 1403-02-08
    title_zh: 不敢自秘锓梓广施利世
    rationale: 深惟经义具实理为济苦津梁，旷劫未闻有待其时，故作序翼赞流通，令学佛者超般若取泥洹。
- id: guji-仁孝皇后-endeavor-2
  title_zh: 正位中宫与靖难辅佐
  summary: 为燕王妃而佐藩，靖难外征时守城持诵安众，平定后正位中宫，以仁孝赞助奠安宗社。
  phases:
  - key: brewing
    name: 徐门家教嫔于燕邸
    labels:
      zh: 嫔燕佐藩
    start_date: 1362-01-01
    highlight_event_id: guji-仁孝皇后-event-birth
  - key: breakthrough
    name: 靖难守城持诵
    labels:
      zh: 守城持诵
    start_date: 1399-09-01
    highlight_event_id: guji-仁孝皇后-event-defend
  - key: climax
    name: 平定祸难正位中宫
    labels:
      zh: 正位中宫
    start_date: 1402-07-17
    highlight_event_id: guji-仁孝皇后-event-publish
  - key: closure
    name: 仁孝遗泽垂范后世
    labels:
      zh: 仁孝垂范
    start_date: 1407-08-10
    highlight_event_id: guji-仁孝皇后-event-death
  decisions:
  - date: 1399-09-01
    title_zh: 城中危困持诵益力恬无怖畏
    rationale: 皇上提兵御侮于外，数受危困，惟以持诵第一希有功德安定人心，承天地眷佑以待平定。
  - date: 1402-07-17
    title_zh: 揆德薄能鲜弗胜赞助而勤抚临
    rationale: 既荷太祖高皇帝孝慈高皇后盛德垂荫奠安宗社，当以谦德居中宫，赞助大统，抚临天下母仪。
events:
- id: guji-仁孝皇后-event-birth
  date: 1362
  year_of: 1362
  title_zh: 徐达嫡长女诞生
  description: 元至正二十二年，生于徐达府第，聪慧贞静，娴于内则，后嫔燕王。
  place_zh: 应天府
- id: guji-仁孝皇后-event-dream
  date: 1398-02-06
  year_of: 1398
  title_zh: 洪武三十一年春梦感观音授经
  description: 焚香静坐合中，梦随观世音至耆阇崛第一道场，升七宝莲台，得授第一希有大功德经，诵三遍记忆无遗，觉后口有异香，天雨空华。
  place_zh: 北平燕王府
- id: guji-仁孝皇后-event-defend
  date: 1399-09-01
  year_of: 1399
  title_zh: 靖难秋难守城持诵
  description: 洪武三十二年秋难作，皇上提兵御侮于外，城中数受危困，持诵是经益力，恬无怖畏以安众心。
  place_zh: 北平
- id: guji-仁孝皇后-event-publish
  date: 1403-02-08
  year_of: 1403
  title_zh: 永乐元年作序锓梓流通
  description: 平定祸难正位中宫，深惟梦感经义不可思议，述序刊刻广施，为济苦津梁觉途捷径，以示妙道无穷。
  place_zh: 南京皇宫
- id: guji-仁孝皇后-event-death
  date: 1407-08-10
  year_of: 1407
  title_zh: 永乐五年崩逝谥仁孝
  description: 正位中宫五年，以仁孝慈惠赞助大统，崩后谥曰仁孝文皇后，梦感经序遂为后世流通之本。
  place_zh: 南京皇宫
