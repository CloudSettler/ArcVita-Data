  - date: -1989-06-01
    title_zh: 发无上菩提心能度三世父母
    rationale: 依佛教诲舍小孝取大孝以度一切父母化无佛众生为己任故名地藏
- id: guji-地藏菩萨-endeavor-2
  title_zh: 无佛世界六身分化救度
  summary_zh: 受释迦付嘱守娑婆安住善名称院中央每日入恒沙定以六种名字应天人修罗畜生饿鬼地狱遍入救生
