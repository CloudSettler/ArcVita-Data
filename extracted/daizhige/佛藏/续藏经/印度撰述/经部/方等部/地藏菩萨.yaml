  archetype: 大愿代苦救度者
  dilemmas:
  - 一母之苦与三世一切父母之苦孰先孰后
  - 自求解脱与代地狱众生受苦如何取舍
  - 无佛世界刚恶难化是舍离是坚守
  lesson: 地狱未空誓不成佛以代苦施乐救度众生即成就无上菩提
