  - date: -1988-01-01
    title_zh: 不舍此身现大丈夫僧助化
    rationale: 为堪利益恶趣众生愿以丈夫身广行方便超过恒沙菩萨一事
  - date: -1987-01-01
    title_zh: 以六名分身应六道施救
    rationale: 随缘熟众生以预天贺放光王金刚幢金刚悲金刚宝金刚愿六身雨法施食和诤代苦
events:
- id: guji-地藏菩萨-event-birth
  title_zh: 降生为圣近士女
  date: -2000-01-01
  year_of: -2000
  place_zh: 觉华定自在王佛像法时人间
  description_zh: 于觉华定自在王佛入涅槃后像法中生为圣近士女起大深信供养恭敬佛形像
- id: guji-地藏菩萨-event-1
  title_zh: 七日断食感佛现身
  date: -1990-01-01
  year_of: -1990
  place_zh: 室中
  description_zh: 知悲母堕在地狱为救彼苦七日断食一心祈请于第七日第五更时室中空中忽现佛身告以发无上大菩提心能度三世父母能化无佛世界众生
- id: guji-地藏菩萨-event-2
  title_zh: 立代苦誓愿蒙授记现丈夫身
  date: -1989-06-01
  year_of: -1989
  place_zh: 佛前
  description_zh: 初发无上心救母得脱后立誓地狱代苦饿鬼施食畜生救济等十二愿蒙授记预天贺等六种名字忽变成大丈夫僧得大乘第三果位善现色身三昧
- id: guji-地藏菩萨-event-3
  title_zh: 常住善名称院分身救六道
  date: -1988-06-01
  year_of: -1988
  place_zh: 无佛世界善名称院中央宝座
  description_zh: 坐中央宝座每日晨朝入恒沙定遍十方国立有情宅门现智笑悲泣等相以六名应六道入地狱授戒救生受释迦付嘱守娑婆日日不怠
- id: guji-地藏菩萨-event-death
  title_zh: 誓不成佛常住化导无入灭
  date: 9999-12-31
  year_of: 9999
  place_zh: 无佛世界阎魔罗国
  description_zh: 以我若证真后代地狱苦等誓愿故地狱未空誓不取正觉常住无佛世界化导众生以无入灭为终
