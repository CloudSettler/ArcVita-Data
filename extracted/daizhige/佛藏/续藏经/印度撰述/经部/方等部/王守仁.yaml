endeavors:
- id: guji-王守仁-endeavor-1
  title_zh: 谪居贵阳龙场悟道并弘传化珠保命真经
  summary: 谪居贵阳于龙场大悟心学又检方书释典得是经为之作序建寺重刻以惠十方
  phases:
  - key: brewing
    name: 谪居龙场多病寡欢
    labels:
      zh:
      - 谪居困厄
    start_date: 1508-01-01
    highlight_event_id: guji-王守仁-event-exile
  - key: breakthrough
    name: 龙场大悟心即理
    labels:
      zh:
      - 心学初兴
    start_date: 1508-06-01
    highlight_event_id: guji-王守仁-event-exile
  - key: climax
    name: 得经作序建寺广施
    labels:
      zh:
      - 得经作序
    start_date: 1510-01-01
    highlight_event_id: guji-王守仁-event-preface
  - key: closure
    name: 还携归重刻家藏
    labels:
      zh:
      - 刻经流布
    start_date: 1511-01-01
    highlight_event_id: guji-王守仁-event-preface
  decisions:
  - date: 1510-01-01
    title_zh: 为化珠保命真经作序明其可信
    rationale: 方书论痘疹终非的证而此经言摩尼善恶因缘详悉可信故表章之
  - date: 1510-06-01
    title_zh: 谋之父老因废庙为寺名佛箧峰寺
    rationale: 游僧所示药王化现度厄不可没其迹故立寺以安众信
  - date: 1511-01-01
    title_zh: 还携归重刻此本而家藏之
    rationale: 以善与人同令广其传俾痘患之家持诵获安
- id: guji-王守仁-endeavor-2
  title_zh: 平定宸濠讲学天下立致良知之教
  summary: 以文武兼全勘定内乱继而讲学书院倡致良知开明代心学之盛
  phases:
  - key: brewing
    name: 出守南赣巡抚剿抚兼施
    labels:
