    start_date: 1516-01-01
    highlight_event_id: guji-王守仁-event-pingluan
  - key: breakthrough
    name: 南昌起兵旬日擒宸濠
    labels:
      zh:
      - 勘定祸乱
    start_date: 1519-07-01
    highlight_event_id: guji-王守仁-event-pingluan
  - key: climax
    name: 揭榜安民讲学赣州
    labels:
      zh:
      - 讲学化民
    start_date: 1520-01-01
    highlight_event_id: guji-王守仁-event-pingluan
  - key: closure
    name: 晚年归越开稽山书院
    labels:
      zh:
      - 致良知成
    start_date: 1527-01-01
    highlight_event_id: guji-王守仁-event-death
  decisions:
  - date: 1519-07-15
    title_zh: 举兵勤王直捣南昌
    rationale: 以攻其必救解安庆之围全社稷大计不计个人毁誉
  - date: 1521-01-01
    title_zh: 提倡致良知以挽颓俗
    rationale: 格物穷理徒向外求不如反求本心以良知为是非之准
