  title_zh: 佛前忏悔得闻长寿法
  summary_zh: 于普光如来前发露杀胎之罪闻地狱苦相及七日转经济度之法至心悔过得闻十二因缘菩提心六度
  phases:
  - key: brewing
    name: 造罪怖畏
    labels:
      zh:
      - 杀胎怖罪
    start_date: -1500-01-01
    highlight_event_id: guji-颠倒-event-kill
  - key: breakthrough
    name: 佛前发露
    labels:
      zh:
      - 至诚忏悔
    start_date: -1500-01-01
    highlight_event_id: guji-颠倒-event-repent
  - key: climax
    name: 得闻因缘
    labels:
      zh:
      - 见法见佛
    start_date: -1500-01-01
    highlight_event_id: guji-颠倒-event-dharma
  - key: closure
    name: 守念发心
    labels:
      zh:
