  era: 过去无垢清净世
  reign_ref: 普光正见如来住世时
  archetype: 忏悔向善者
  dilemmas:
  - 杀胎重罪当堕阿鼻与至诚发露求佛救护之抉择
  - 爱惜身命与碎身刺血书写流通以报佛恩之抉择
  lesson: 有罪即能至诚忏悔受持大乘守护菩提心即得灭罪延寿见佛性
  summary_first_person: 我名颠倒曾因家法服毒杀胎身怀八月儿形具足后闻智者言杀胎得短命堕阿鼻生大悲惧即于普光正见如来前悲号发露得闻十二因缘一实菩提心六波罗蜜及长寿经复削骨为笔刺血为墨七日书写四十九卷以报佛恩虽遇龙宫请经誓愿不退疮即平复得无生忍愿生生遇佛宣扬此法救度罪苦众生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛说长寿灭罪护诸童子陀罗尼经.md
  - https://daizhige.org/CBETA/X0017.html
