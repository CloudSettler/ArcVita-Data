  decisions:
  - date: -1500-01-01
    title_zh: 悲号求哀愿听出家
    rationale: 自忖杀胎现得短命后堕阿鼻故求佛以慈悲力说法听许出家以免斯苦
  - date: -1500-01-01
    title_zh: 受持一念菩提心不忘
    rationale: 一念菩提即大乘身如金刚心如虚空能远离无常杀鬼地狱苦故常勤守护
- id: guji-颠倒-endeavor-2
  title_zh: 碎身写经流通护世
  summary_zh: 年四十九自佛闻长寿经欲令众生受持读诵削骨刺血七日书成四十九卷遇龙请供养誓愿平复得忍
  phases:
  - key: brewing
    name: 闻法欢喜
    labels:
      zh:
      - 报恩流通
    start_date: -1490-01-01
    highlight_event_id: guji-颠倒-event-dharma
  - key: breakthrough
    name: 刺血书经
    labels:
      zh:
      - 碎身写经
    start_date: -1490-01-01
    highlight_event_id: guji-颠倒-event-write
  - key: climax
    name: 龙宫请经
    labels:
      zh:
      - 经忽不见
    start_date: -1490-01-01
    highlight_event_id: guji-颠倒-event-dragon
  - key: closure
    name: 誓愿得忍
    labels:
      zh:
      - 平复得道
    start_date: -1490-01-01
    highlight_event_id: guji-颠倒-event-vow
  decisions:
  - date: -1490-01-01
    title_zh: 卖眼写经四十九卷
    rationale: 既悟佛性远离鬼苦欲碎身报恩令一切众生受持读诵得长寿故不惜躯命
  - date: -1490-01-01
    title_zh: 誓愿生生遇佛宣法
    rationale: 不愿生天受乐唯愿在在处处常遇世尊为罪苦众生宣扬此法故以实心除愈疮秽
events:
- id: guji-颠倒-event-birth
  title_zh: 出生为优婆夷
  date: -1500-01-01
  year_of: -1500
  description: 生于无垢清净世界时中名曰颠倒后闻普光正见如来出世
- id: guji-颠倒-event-kill
  title_zh: 服毒杀胎造重罪
  date: -1500-06-01
  year_of: -1500
  description: 身怀胎孕足满八月为家法故服毒杀子伤胎唯生死儿人形具足遂生大怖
- id: guji-颠倒-event-repent
  title_zh: 佛前悲泣发露忏悔
  date: -1500-07-01
  year_of: -1500
  description: 于普光如来前五体投地说杀胎因缘闻五逆难灭及阿鼻苦相复闻七日转读大乘可度亡者
- id: guji-颠倒-event-dharma
  title_zh: 得闻十二因缘长寿经
  date: -1500-08-01
  year_of: -1500
  description: 蒙佛说十二因缘流转还灭见法即见佛性复受一念菩提心六波罗蜜及寂灭偈心豁明净升空七多罗
- id: guji-颠倒-event-bodhi
  title_zh: 无常鬼退舍鬼界
  date: -1500-08-02
  year_of: -1500
  description: 佛以威力止无常杀鬼为说长寿经鬼闻法已地狱为莲池舍鬼境界颠倒免难
- id: guji-颠倒-event-write
  title_zh: 削骨刺血七日书经
  date: -1490-01-01
  year_of: -1490
  description: 年四十九为报佛恩削骨为笔身肉支解以血为墨供给四十九书人七日书写长寿经四十九卷竟
- id: guji-颠倒-event-dragon
  title_zh: 龙王请经入宫供养
  date: -1490-02-01
  year_of: -1490
  description: 难陀龙王等以威力请经入龙宫受持供养颠倒须臾不见经流泪白佛佛令欢喜不须愁恼
- id: guji-颠倒-event-vow
  title_zh: 誓愿平复得无生忍
  date: -1490-03-01
  year_of: -1490
  description: 不愿生无色界天愿生生遇佛宣法以实心誓愿身疮对佛除愈一心念佛游诸佛国得无生法忍菩提心
- id: guji-颠倒-event-death
  title_zh: 功德圆满示灭
  date: -1400-01-01
  year_of: -1400
  description: 以书写受持宣扬功德尽此寿已离女人身得道示灭后世常为善知识护持长寿经
