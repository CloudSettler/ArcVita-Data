  - date: '0746'
    title_zh: 止鸿胪入内立坛受诏译经
    rationale: 先代梵文散落未译，为续慧命利济群品故尽许翻度
  - date: '0757'
    title_zh: 为肃代二帝受转轮灌顶建护摩
    rationale: 国难方殷，欲以秘密法护持邦家安定人心故不入山独善
events:
- id: guji-不空-event-birth
  title_zh: 生于北天竺婆罗门家
  date: '0705'
  year_of: 705
  description: 北天竺婆罗门族，幼失所天，随叔父观光东国而来华
- id: guji-不空-event-fashi
  title_zh: 年十五师事金刚智三藏
  date: 0719
  year_of: 719
  description: 开元七年金刚智至广府，初导以梵本悉昙章及声明论，浃旬通彻，引入金刚界大曼荼罗
- id: guji-不空-event-guanding
  title_zh: 尽传五部灌顶阿阇梨法
  date: '0725'
  year_of: 725
  description: 涉三载求学新瑜伽五部三密，师梦诸寺佛像东行，知是真法器，授毘卢遮那经苏悉地轨则等
- id: guji-不空-event-qiufa
  title_zh: 泛海赴师子国五天竺求法
  date: 0741-12
  year_of: 741
  description: 开元二十九年十二月附昆仑舶离南海，遇黑风大鲸以大随求法免难，达师子国受王供养，从普贤阿阇梨开十八会金刚顶法，遍游五印度得经论五百余部
- id: guji-不空-event-huanjing
  title_zh: 天宝五载还京译经祈雨
  date: '0746'
  year_of: 746
  description: 进师子国王表及梵夹，诏入内立坛灌顶，居净影寺，立孔雀王坛三日得雨，赐号智藏
- id: guji-不空-event-huguo
  title_zh: 安史中密奉朝廷建护摩灌顶
  date: '0757'
  year_of: 757
  description: 至德乾元中密奉表于灵武凤翔，为肃宗立护摩及转轮王位七宝灌顶，以大随求除疾，代宗朝恩渥弥厚
- id: guji-不空-event-jinjing
  title_zh: 大历六年诞节进译经目录
  date: 0772-10-02
  year_of: 772
  description: 自天宝迄大历六年译七十七部百二十余卷，具笔受润文名氏进上，敕付中外编入一切经目录，庆云现而举朝贺
- id: guji-不空-event-death
  title_zh: 大历九年六月十五日寂于兴善寺
  date: 0774-06-15
  year_of: 774
  description: 春夏说法诫勗门人，属累观菩提心及阿字义，出涅槃茶毘仪轨，香水澡沐东首倚卧以大印定寂，寿七十腊五十，七月六日茶毘，敕谥如前建塔供养
