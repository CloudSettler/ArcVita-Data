  - date: 0741-12
    title_zh: 奉遗旨泛海西行求所未授
    rationale: 师已示灭，恐密藏未全，为兴教法故远赴五天师子国
- id: guji-不空-endeavor-2
  title_zh: 入朝译经建坛护国利民
  summary: 天宝还京后居净影大兴善寺，为玄肃代三朝灌顶建护摩，译密严仁王等经，祈雨止风，奏置文殊上座
  phases:
  - key: brewing
