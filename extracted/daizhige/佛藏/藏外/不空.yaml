  dilemmas:
  - 密法本秘密传持与为利群品广为流通之间如何抉择
  - 深入宫廷为帝王建坛护国与住山自修普度众生之间如何持衡
  lesson: 以密咒显定慧，以翻译续慧命，护国利民而不忘度众本怀
  summary_first_person: 吾北天竺婆罗门种，幼随叔父来华，十五岁师事金刚智三藏，尽传五部灌顶三密瑜伽，远游师子国及五天竺，广求密藏五百余部，还朝译经七十七部百二十余卷，三朝建坛灌顶祈雨护国，惟愿众生同证菩提，同出生无边法门
  source_urls:
  - https://zh.wikisource.org/wiki/宋高僧傳
  - https://daizhige.org/佛藏/藏外/宋高僧传.html
