  dilemmas:
  - 禅净门户分张敌国相视如何会通归一而不堕空见
  - 称莲宗者弃本逐末着相修行如何辨伪存真重立正宗正派
  - 欲复东林远公祖风须藉朝廷护持如何不失融真混俗本怀而入世弘化
  lesson: 守自心正念以念佛为归趣辨真伪以宝鉴为明镜借世缘护法而不染世缘方能续佛慧命振复宗风
  summary_first_person: 吾丹阳蒋氏子弱冠舍俗初参龙华宝山历叩诸方悟达心净土见性弥陀痛惜祖道湮微邪说混淆乃探赜先宗编莲宗宝鉴十卷赴大都进呈蒙金轮皇帝奖谕刊行复教惟愿尽大地人一念中同得念佛三昧共证菩提
  source_urls:
