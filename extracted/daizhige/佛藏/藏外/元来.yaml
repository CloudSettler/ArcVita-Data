  - 静境轻安与真疑情难辨
  - 解悟领略与亲证彻悟难辨
  lesson: 起真切疑情做真实工夫，识禅病方能去病出生死
  summary_first_person: 吾乃博山元来，痛念生死大事未明，力倡起疑情做工夫，遍疗枯寂狂解诸禅病，以警语开示初心，愿人自取自悟直至安乐田地
