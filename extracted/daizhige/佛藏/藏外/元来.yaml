endeavors:
- id: guji-元来-endeavor-1
  title_zh: 参究疑情彻见生死大事
  summary_zh: 看没踪迹公案有省，复参宝方得不肯二字受用不尽，炼疑情成片
  phases:
  - key: brewing
    name: 初心发破生死心起疑情
    labels:
      zh:
      - 破生死心
      - 起疑情
    start_date: '1595'
    highlight_event_id: guji-元来-event-awakening
  - key: breakthrough
    name: 阅传灯有省自谓大悟
    labels:
      zh:
      - 看公案
      - 有省发
    start_date: '1605'
    highlight_event_id: guji-元来-event-awakening
  - key: climax
    name: 参见宝方惭愧受不肯诀
    labels:
      zh:
      - 参善知识
      - 知非便舍
    start_date: '1607'
    highlight_event_id: guji-元来-event-baofang
  - key: closure
    name: 疑情成片融豁相应
    labels:
      zh:
      - 绵密融豁
      - 彻见本体
    start_date: '1610'
    highlight_event_id: guji-元来-event-baofang
  decisions:
  - date: '1605'
    title_zh: 不以轻安省发便为悟
    rationale: 轻安省发终是未了，须见大善知识始得踏着向上关捩
  - date: '1607'
    title_zh: 知非便舍亲履实践
    rationale: 行在错处肯一念知非便舍，不坐在窠臼里方能出生死破魔网
- id: guji-元来-endeavor-2
  title_zh: 住持博山著参禅警语育人
  summary_zh: 住博山能仁寺，示初心做工夫评古德垂示，诊禅病为后学作舟航
  phases:
  - key: brewing
    name: 住博山观察学者禅病
    labels:
      zh:
      - 住持弘化
      - 识病调人
    start_date: '1610'
    highlight_event_id: guji-元来-event-boshan
  - key: breakthrough
    name: 开示做工夫切要吃紧法
    labels:
      zh:
      - 示做工夫
      - 贵在真切
    start_date: '1611'
    highlight_event_id: guji-元来-event-boshan
  - key: climax
    name: 评古德示公案疗狂狷业病
    labels:
      zh:
      - 评公案
      - 救法身病
    start_date: '1611'
    highlight_event_id: guji-元来-event-boshan
  - key: closure
    name: 警语成书付信州弟子刊行
    labels:
      zh:
      - 著述流通
      - 自警警众
    start_date: '1611-08-01'
    highlight_event_id: guji-元来-event-boshan
  decisions:
  - date: '1611'
    title_zh: 直说禅病不为高妙玄谈
    rationale: 亲证实履见到说到，方能照见群僚肝胆使疑情发起病根点破
  - date: '1611'
    title_zh: 专提一则公案发起疑情
    rationale: 不在公案上卜度作解会，只就本参话头愤然讨个下落方为亲见
events:
- id: guji-元来-event-birth
  title_zh: 出生
  date: '1575'
  year_of: 1575
  place_zh: 大明
  summary_zh: 明万历三年诞生，后出家参究，是为博山无异元来
- id: guji-元来-event-awakening
  title_zh: 看没踪迹阅传灯有省
  date: '1605'
  year_of: 1605
  place_zh: 参究席下
  summary_zh: 看船子和尚没踪迹句，因阅传灯见赵州三千里外逢人语打失布袋如放下千斤担子，自谓大悟
- id: guji-元来-event-baofang
  title_zh: 参见宝方得不肯二字
  date: '1607'
  year_of: 1607
  place_zh: 宝方席下
  summary_zh: 逮见宝方如方木逗圆孔始具惭愧，得勉以空拶空不肯之偈，受用不尽
- id: guji-元来-event-boshan
  title_zh: 住博山撰参禅警语流通
  date: '1611-08-01'
  year_of: 1611
  place_zh: 博山能仁寺
  summary_zh: 住持博山示初心做工夫评古德垂示，分上下卷五章，万历辛亥孟秋信州弟子刘崇庆作序刊行
- id: guji-元来-event-death
  title_zh: 圆寂
  date: '1630'
  year_of: 1630
  place_zh: 博山
  summary_zh: 明崇祯三年示寂，留警语为末世舟航初心径路，与佛祖同一鼻孔通风
