  description: 主持灵岩厘定净宗章程领众专修念佛十方缁素航海梯山问道
- id: guji-印光法师-event-death
  date: 1940-11-04
  year_of: 1940
  title_zh: 灵岩山寺端坐念佛圆寂
  description: 民国二十九年农历十月初五于灵岩端坐念佛安详西归荼毗得五色舍利无数
