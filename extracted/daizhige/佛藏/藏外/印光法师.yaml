  date: 1861-01-11
  year_of: 1861
  title_zh: 陕西郃阳出生
  description: 清咸丰十一年腊月初八生于陕西郃阳赵氏幼病目而悟世无常具出世志
- id: guji-印光法师-event-putuo
  date: 1893-01-01
  year_of: 1893
