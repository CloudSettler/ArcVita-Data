  dilemmas:
  - 國制嚴而求法切，留唐違制與負命即歸兩難
  - 風濤破船痢疾困頓與巡禮台州決疑大願相持
  - 外國人不得濫入寺制與畫像供養結緣之願相礙
  lesson: 萬里求法在誓願不退，漂危患病皆成行記資糧，持戒巡禮方能傳燈不絕
  summary_first_person: 吾圓仁為決天台法華之疑，隨遣唐使渡海，漂破至揚州海陵，雖患痢困於開元寺，誓往台州國清尋師，後歸叡山傳燈，並直錄巡禮見聞以示後人
