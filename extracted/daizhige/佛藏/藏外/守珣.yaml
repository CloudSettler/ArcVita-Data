endeavors:
- id: guji-守珣-endeavor-1
  title_zh: 封衾参究悟道得法
  description: 初参广鉴瑛不契谒太平佛鉴勤封衾立誓不悟不展昼坐宵立逾七七日因森罗万象一法所印踊跃而出投灵云见桃花作颂得印可复经佛果潭边勘验称稳实自治严刻
  phases:
  - key: brewing
    name: 封衾立誓死参
    labels:
      zh:
      - 立誓参究
      - 昼坐宵立
    start_date: 1112
    highlight_event_id: guji-守珣-event-enlightenment
  - key: breakthrough
    name: 桃花悟入蒋山首众
    labels:
      zh:
      - 豁然有省
      - 师资印可
    start_date: 1119
    highlight_event_id: guji-守珣-event-jiangshan
  decisions:
  - date: 1112
    title_zh: 封衾矢誓不悟不展
    rationale: 佛鉴孤硬难入唯断绝退路死参七七方能发明大事以报四恩
  - date: 1115
    title_zh: 以桃花颂呈佛鉴求证
    rationale: 闻法印语踊跃有省须以颂显发灵云不疑处请师决择去疑
- id: guji-守珣-endeavor-2
  title_zh: 住持弘化委曲接引
  description: 建炎间住天圣开堂答内翰王公三圣话以西湖比西子喻之迁何山晚居天宁怜学者根器不妙委曲援引举婆子烧庵及野火等话示众以宾主四句接机
  phases:
  - key: climax
    name: 住天圣开堂扬化
    labels:
      zh:
      - 开堂提唱
      - 接引士夫
    start_date: 1127
    highlight_event_id: guji-守珣-event-tiansheng
  - key: closure
    name: 晚居天宁归寂鄣南
    labels:
      zh:
      - 委曲利生
      - 示寂建塔
    start_date: 1130
    highlight_event_id: guji-守珣-event-tianning
  decisions:
  - date: 1127
    title_zh: 建炎住天圣开堂应机
    rationale: 南渡之初禅林南指须以诗喻等善巧接引士夫护持正法
  - date: 1130
    title_zh: 迁何山晚居天宁委曲援引
    rationale: 学者根器不妙不遑恤窃议唯如瓶泻秋河方能续佛鉴家风
events:
- id: guji-守珣-event-birth
  type: birth
  title_zh: 吉安施氏出生早岁弃家
  date: 1085
  year_of: 1085
  description: 出吉安州施姓巨族幼喜林泉早岁弃家为大僧趋最上乘
- id: guji-守珣-event-enlightenment
  type: career
  title_zh: 封衾七七闻法印悟入
  date: 1115
  year_of: 1115
  description: 谒太平佛鉴封衾立誓昼坐宵立逾七七日闻森罗万象一法所印踊跃出堂见桃花作颂云终日看天不举头桃花烂熳始抬眸得佛鉴印可
- id: guji-守珣-event-jiangshan
  type: career
  title_zh: 宣和首众蒋山知名湖海
  date: 1119
  year_of: 1119
  description: 宣和改元佛鉴住蒋山佛果移书必以珣首蒋山众潭边答牛头未见四祖话云潭深鱼聚树高招风由是湖海知名
- id: guji-守珣-event-tiansheng
  type: career
  title_zh: 建炎住天圣开堂示众
  date: 1127
  year_of: 1127
  description: 建炎间住天圣开堂内翰王公问三圣逢人则出话答以西湖比西子淡妆浓抹总相宜又答潘良贵南泉斩猫话斥依义理快活如将钱买油糍
- id: guji-守珣-event-tianning
  type: career
  title_zh: 迁何山晚居天宁提唱
  date: 1130
  year_of: 1130
  description: 迁何山晚居天宁举婆子烧庵雪后始知松柏操及野火起处等话以宾主四句接机雪夜喝退威仪不具求决疑情之僧
- id: guji-守珣-event-death
  type: death
  title_zh: 绍兴甲寅归鄣南告寂
  date: 1134
  year_of: 1134
  description: 绍兴甲寅从天宁归鄣南告寂侍者请遗偈云不曾做得即逝火浴舌根不坏塔于宝应院庐山时曾呵少年著荻花纸衣求温暖者
