      zh:
      - 持戒立範
    start_date: 1407-01-01
    highlight_event_id: guji-宗喀巴-event-gelug
  - key: climax
    name: 建甘丹寺傳大願法會
    labels:
      zh:
      - 建寺立法
    start_date: 1409-01-01
    highlight_event_id: guji-宗喀巴-event-gelug
  - key: closure
    name: 付囑弟子守三學傳承
    labels:
      zh:
      - 付囑傳承
    start_date: 1418-01-01
    highlight_event_id: guji-宗喀巴-event-death
  decisions:
  - date: 1409-01-01
    title_zh: 建甘丹寺立僧制
    rationale: 欲以身行之教攝眾，令學者先具調伏寂靜之德，然後學空性發菩提，故須清淨僧團為所依
  - date: 1407-01-01
    title_zh: 興正月大祈願法會
    rationale: 為報佛恩令正法久住，聚合僧俗發正願積資糧，廣益教論
