    highlight_event_id: guji-宗喀巴-event-writing
  decisions:
  - date: 1392-01-01
    title_zh: 閉關專修中觀因明
    rationale: 見時人於空性未達關要，或謗方便，或執密而壞戒，故須閉關決擇顯密樞要
  - date: 1402-01-01
    title_zh: 依阿底峽道炬造廣論
    rationale: 為令初業未多聞者直趣宗要，攝一切經教為三士次第，說修一致
- id: guji-宗喀巴-endeavor-2
  title_zh: 重興戒律創建格魯僧團
  summary: 以別解脫為基，建甘丹哲蚌色拉三大寺，制定學修制度，令正法久住
  phases:
  - key: brewing
    name: 觀察雪域戒律衰微
    labels:
