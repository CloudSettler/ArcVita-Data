  - key: climax
    name: 造菩提道次第廣論略論
    labels:
      zh:
      - 著述立宗
    start_date: 1402-01-01
    highlight_event_id: guji-宗喀巴-event-writing
  - key: closure
    name: 講授道次第攝持弟子修心
    labels:
