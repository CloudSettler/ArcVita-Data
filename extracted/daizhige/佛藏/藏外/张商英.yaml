endeavors:
- id: guji-张商英-endeavor-1
  title_zh: 元祐礼五台瞻睹圣灯
  summary: 元祐丁卯梦游金刚窟，戊辰提刑河东诣台山，于金阁真容院中台西台秘麻岩累见祥云金桥圆光宝灯菩萨队仗，发大誓愿护持正法
  phases:
  - key: brewing
    name: 梦兆赴部
    labels:
      zh: 梦验感召
    start_date: 1087-02-01
    highlight_event_id: guji-张商英-event-dream
  - key: breakthrough
    name: 金阁真容见光
    labels:
      zh: 初见圆光圣灯
    start_date: 1088-06-27
    highlight_event_id: guji-张商英-event-jinge
  - key: climax
    name: 中台现菩萨队仗
    labels:
      zh: 亲见文殊圣境
    start_date: 1088-07-01
    highlight_event_id: guji-张商英-event-zhongtai
  - key: closure
    name: 秘麻岩睹真身发愿
    labels:
      zh: 发愿护法
    start_date: 1088-07-05
    highlight_event_id: guji-张商英-event-mimayan
  decisions:
  - date: 1088-06-27
    title_zh: 虔请圣灯现前以断疑心
    rationale: 疑溪上灯为人为火，故十请愿至我前，以红日腾空收敛为珠验为三昧火而断疑
  - date: 1088-07-05
    title_zh: 于秘麻岩发愿护持像季之法
    rationale: 连见金灯白光菩萨立光中，若为菩萨眷属愿示异相，若以正法付嘱愿愈示现，故誓学无边佛法永灭恶念
- id: guji-张商英-endeavor-2
  title_zh: 撰续清凉传祈雨护教
  summary: 直书见闻附清凉传后，塑像归奉表明发愿，再诣台山祈雨迎奉罗睺像，奏闻朝廷请崇奉台山十寺旧庄
  phases:
  - key: brewing
    name: 直书记传
    labels:
      zh: 实录流通
    start_date: 1088-08-01
    highlight_event_id: guji-张商英-event-chengshu
  - key: breakthrough
    name: 塑像表明发愿
    labels:
      zh: 归奉发愿
    start_date: 1088-11-08
    highlight_event_id: guji-张商英-event-fayuan
  - key: climax
    name: 祈雨迎奉罗睺像
    labels:
      zh: 感应降雨
    start_date: 1089-06-01
    highlight_event_id: guji-张商英-event-qiyu
  - key: closure
    name: 奏闻崇奉台山
    labels:
      zh: 护教奏请
    start_date: 1089-07-01
    highlight_event_id: guji-张商英-event-qiyu
  decisions:
  - date: 1088-08-01
    title_zh: 不避疑谤附记于清凉传后
    rationale: 以圣语凡恐人不信，然传百信一传千信十足以破邪扶正，若涉一语虚妄甘沦恶趣，故谨书实见以诱掖信心
  - date: 1089-06-01
    title_zh: 以亢旱再诣台山祈雨并奏朝廷
    rationale: 朝廷有道众圣垂佑则应如响，台山十寺旧管四十二庄蒙太宗蠲租，今山林残伐僧众乞散，故祈泽验实即奏请护持名山异境
events:
- id: guji-张商英-event-birth
  title_zh: 出生
  date: 1043
  year_of: 1043
  description: 宋仁宗庆历三年生于新津，后登进士第历开封推官提点刑狱
- id: guji-张商英-event-death
  title_zh: 示寂
  date: 1121
  year_of: 1121
  description: 宋徽宗宣和三年卒，一生以无尽居士护持佛法
- id: guji-张商英-event-dream
  title_zh: 梦游金刚窟
  date: 1087-02-01
  year_of: 1087
  description: 元祐丁卯二月为开封府推官时梦游五台金刚窟，觉而异之，后除河东提点刑狱验梦而行
- id: guji-张商英-event-jinge
  title_zh: 金阁真容院见金桥圆光圣灯
  date: 1088-06-27
  year_of: 1088
  description: 戊辰六月壬寅至清凉金阁见白云金桥金色相轮，至真容院清辉阁见黄金宝阶火炬群灯，溪上红日腾空收敛如珠，断疑为三昧火
- id: guji-张商英-event-zhongtai
  title_zh: 中台见琉璃世界菩萨队仗
  date: 1088-07-01
  year_of: 1088
  description: 乙巳谢绝荤腥登中台，于碧琉璃世界见万菩萨队仗楼殿幢盖天王罗汉，又见文殊骑师子及尊者游戏，夜见绀轮三灯齐现如心宿
- id: guji-张商英-event-mimayan
  title_zh: 秘麻岩睹菩萨真身发愿
  date: 1088-07-05
  year_of: 1088
  description: 至秘麻岩见文殊乘青毛师子入云，夜于赤崖见金灯等身白光菩萨三现，发愿尽形学无边佛法永灭邪淫杀生妄语恶念
- id: guji-张商英-event-chengshu
  title_zh: 撰成续清凉传表明
  date: 1088-08-28
  year_of: 1088
  description: 以见闻述成记传附清凉传后并作清凉山赋及五台诗，遣人以锦囊赍疏至真容院文殊前表明，众僧读疏现金灯四十余遍
- id: guji-张商英-event-fayuan
  title_zh: 塑像归奉发愿
  date: 1088-11-08
  year_of: 1088
  description: 自塑泥像出按赍至菩萨前发愿投体归依，愿起信足于妙峰资辩河于阿耨池，读文现金灯雪止现五色祥云
- id: guji-张商英-event-qiyu
  title_zh: 祈雨感应奏闻
  date: 1089-06-10
  year_of: 1089
  description: 以并路亢旱再诣台山迎奉罗睺像，三祷三应还至代州大雨弥日转歉为丰，即奏闻灵光宝焰千人同睹并请念台山十寺旧庄蠲租崇奉
