  - 疑溪上灯火为寺僧设炬相欺与信为三昧火圣境赴感之间求证
  lesson: 亲见亲验则直书不妄，护法弘道不避疑谤
  summary_first_person: 我是张商英字天觉，元祐中提点河东刑狱，梦游五台金刚窟而往礼清凉，累见金桥圆光宝灯菩萨队仗，发愿学无边佛法永断恶念，直书见闻为续清凉传以信后人
