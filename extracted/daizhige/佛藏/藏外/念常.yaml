  era: 元
  reign_ref: 元顺帝至正元年
  archetype: 编史高僧
  dilemmas:
  - 侈神异陈罪福以尊教与儒家礼乐刑政不可废之间
  - 援儒入墨尊孔子与辟佛者力争之间
  - 道家清净同源尊老子与攻斋醮章咒服饵之间
  lesson: 博涉儒书而专志佛史，以编年通载贯通世道佛道盛衰，可为考订之资而党同之偏不可取
  summary_first_person: 吾姓黄号梅屋华亭人，得临济之传于晦机，延祐中居嘉兴大中祥符寺，驿召入京缮金字经，二十余年博及群书而成佛祖历代通载二十二卷，上起七佛下迄元统元年
  source_urls:
