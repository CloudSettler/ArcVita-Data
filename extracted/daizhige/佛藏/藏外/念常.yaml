    start_date: '1323'
    highlight_event_id: guji-念常-event-jingshi
  - key: climax
    name: 二十余年成编二十二卷
    labels:
      zh: 成书高峰
    start_date: '1341'
    highlight_event_id: guji-念常-event-chengshu
  - key: closure
    name: 虞集序而刊行资考订
    labels:
