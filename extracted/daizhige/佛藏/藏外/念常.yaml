    highlight_event_id: guji-念常-event-chengshu
  decisions:
  - date: '1323'
    title_zh: 卷首冠彰所知论
    rationale: 受法于帝师故以帕克斯巴彰所知论冠篇首，明器世界情世界道果
  - date: '1341'
    title_zh: 自昭王二十五年始据内典编年
    rationale: 庄严贤劫不知当中国何年，盘古至康王略存统系，释迦诞后方证信不诬
- id: guji-念常-endeavor-2
  title_zh: 住持祥符缮经弘禅
  summary: 延祐中居嘉兴大中祥符禅寺，得法晦机，入京缮写金字佛经，弘临济宗风
  phases:
  - key: brewing
    name: 华亭黄氏出家得法晦机
    labels:
