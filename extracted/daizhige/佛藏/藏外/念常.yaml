    labels:
      zh: 入京缮经
    start_date: '1323'
    highlight_event_id: guji-念常-event-jingshi
  - key: closure
    name: 示古德宗风归于通载
    labels:
      zh: 弘法归史
    start_date: '1341'
    highlight_event_id: guji-念常-event-chengshu
  decisions:
  - date: '1317'
    title_zh: 住持嘉兴大中祥符寺
    rationale: 辟地东南弘禅说之外博及群书，为通载积累碑碣志传
  - date: '1323'
    title_zh: 应诏入京缮金字佛经
    rationale: 承敕命而弘教，兼受帝师法以通显密义学
events:
