  date: 1119-01-01
  year_of: 1119
  place_zh: 庐山及湘鄂间
  description_zh: 记寿端华严栖贤唐宣宗盐官安公等嘉言懿行，辨传灯高僧传之阙误，成禅门史传名作
- id: guji-惠洪-event-death
  title_zh: 建炎二年示寂
  date: 1128-01-01
  year_of: 1128
  place_zh: 庐山
  description_zh: 晚年安居著述，建炎二年寂，世寿五十八，遗石门文字禅等数十种行世
