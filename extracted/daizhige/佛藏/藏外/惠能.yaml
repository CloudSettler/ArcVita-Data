person:
  qid: guji-惠能
  name_zh: 惠能
  names:
    zh: 惠能
    en: Huineng
  lifespan:
    birth:
      date: 0638
      precision: year
      is_circa: false
      raw: 唐贞观十二年岭南新州
    death:
      date: '0713-08-13'
      precision: day
      is_circa: false
      raw: 唐先天二年八月初三曹溪入灭
  birth_date: 0638
  death_date: '0713-08-13'
  era: 唐
  reign_ref: 唐高宗至唐玄宗
  archetype: 禅宗六祖
  dilemmas:
  - 岭南葛獠受轻而坚持人有南北佛性无南北
  - 神秀渐偈盛行时以本来无一物直显顿见
  - 得衣法为六代而须夜遁避害三年不弘
  lesson: 不识本心学法无益，定慧一体，无念无相无住即见自性顿成佛道
  summary_first_person: 我本范阳后裔，生于岭南新州，幼丧父，与母移南海卖柴养亲，闻客读金刚经心即开悟，辞母往蕲州黄梅礼五祖弘忍，踏碓八月，作菩提本无树偈，三更得传顿法衣钵为六代祖，南至大庾岭付法，隐韬后于韶州大梵寺升座说摩诃般若授无相戒，法海集为坛经
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E8%97%8F%E5%A4%96/%E5%9D%9B%E7%BB%8F%E6%B3%95%E6%B5%B7%E6%9C%AC.html
