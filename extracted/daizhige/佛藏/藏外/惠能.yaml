endeavors:
- id: guji-惠能-endeavor-1
  title_zh: 黄梅求法得衣为六祖
  summary: 闻金刚经北上黄梅，碓房作务，呈无相偈，三更受金刚经印可得衣法南归
  phases:
  - key: brewing
    name: 卖柴闻经辞亲北上
    labels:
      zh: 闻金刚经宿缘
    start_date: '0661'
    highlight_event_id: guji-惠能-event-hear-diamond
  - key: breakthrough
    name: 碓房踏碓南廊呈偈
    labels:
      zh: 本无树对勤拂拭
    start_date: '0662'
    highlight_event_id: guji-惠能-event-verse
  - key: climax
    name: 三更堂内说经传付
    labels:
      zh: 夜传顿法衣钵
    start_date: '0663'
    highlight_event_id: guji-惠能-event-transmission
  - key: closure
    name: 九江驿送别大庾南行
    labels:
      zh: 岭上传法惠顺
    start_date: '0663'
    highlight_event_id: guji-惠能-event-dayuling
  decisions:
  - date: '0661'
    title_zh: 辞母往黄梅只求作佛
    rationale: 闻持金刚经即见性成佛，宿业有缘，不求余物唯求佛法，虽被责为葛獠仍以佛性平等对答
  - date: '0663'
    title_zh: 夜得衣法即南遁
    rationale: 古传法命如悬丝，住此有人害命，遵五祖速去向南三年勿弘之嘱，保顿教慧命
- id: guji-惠能-endeavor-2
  title_zh: 曹溪南弘说坛经立宗
  summary: 韶州大梵寺升座说摩诃般若，授无相戒三归，立法海集记流行后代
  phases:
  - key: brewing
    name: 岭南韬晦累劫因缘
    labels:
      zh: 隐遁待时化南
    start_date: '0664'
    highlight_event_id: guji-惠能-event-dayuling
  - key: breakthrough
    name: 大梵寺升座净心
    labels:
      zh: 万众请说般若
    start_date: '0677'
    highlight_event_id: guji-惠能-event-dafan
  - key: climax
    name: 说定慧无念无相无住
    labels:
      zh: 授无相戒示三身
    start_date: '0677'
    highlight_event_id: guji-惠能-event-dafan
  - key: closure
    name: 法海集记付嘱流通
    labels:
      zh: 坛经递相传授
    start_date: '0713-08-13'
    highlight_event_id: guji-惠能-event-death
  decisions:
  - date: '0677'
    title_zh: 以定慧一体破坐相执
    rationale: 迷人著看心看净坐不动，障道被缚，故立外离相为禅内不乱为定，直心是一行三昧
  - date: '0677'
    title_zh: 授无相三归四弘自性度
    rationale: 不归他佛归自性觉正净，众生自性自度，立无念为宗无相为体无住为本，使上根顿悟小根渐劝皆得见性
events:
- id: guji-惠能-event-birth
  title_zh: 生于岭南新州
  date: 0638
  year_of: 638
  place_zh: 岭南新州
  description: 父本贯范阳左降流南为新州百姓，幼少父亡，与母移南海艰辛卖柴
- id: guji-惠能-event-hear-diamond
  title_zh: 送柴闻金刚经悟
  date: '0661'
  year_of: 6661
  place_zh: 南海官店门前
  description: 送柴至官店，闻客读金刚经心明悟，问得蕲州黄梅五祖劝持一卷即见性，遂辞亲北上
- id: guji-惠能-event-verse
  title_zh: 南廊呈菩提本无树偈
  date: '0662'
  year_of: 6662
  place_zh: 黄梅东冯墓山碓房南廊
  description: 踏碓八月未至堂前，闻童诵神秀身是菩提树偈知未见性，请人书菩提本无树明镜亦非台佛性常清净偈于西壁
- id: guji-惠能-event-transmission
  title_zh: 三更受衣为六代祖
  date: '0663'
  year_of: 6663
  place_zh: 黄梅五祖堂内
  description: 五祖夜唤堂内说金刚经，言下便悟，受顿法及衣为六代，以心传心，嘱速南行三年勿弘
- id: guji-惠能-event-dayuling
  title_zh: 大庾岭还衣传法惠顺
  date: '0663'
  year_of: 6663
  place_zh: 大庾岭上
  description: 南行两月至大庾岭，陈惠顺追来求法不要衣，于岭上传法心开，使其北上化人
- id: guji-惠能-event-dafan
  title_zh: 大梵寺升座说坛经
  date: '0677'
  year_of: 6677
  place_zh: 韶州大梵寺讲堂
  description: 刺史韦璩官寮道俗万余请说摩诃般若，升高座授无相戒，说定慧等一行三昧无念无相无住及自性三身，法海集记流行
- id: guji-惠能-event-death
  title_zh: 曹溪入灭
  date: '0713-08-13'
  year_of: 713
  place_zh: 曹溪
  description: 南弘顿教后付嘱门人以坛经为禀承，示现入灭，衣法代代心传
