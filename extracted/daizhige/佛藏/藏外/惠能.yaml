  era: 唐
  reign_ref: 唐贞观至先天
  archetype: 禅宗祖师
  dilemmas:
  - 身为岭南獦獠而求作佛当如何证佛性本无南北
  - 得衣得法即为众矢之的当速弘还是藏锋避难
  - 顿渐功德禅定诤论纷起当如何以不二直指见性
  lesson: 菩提自性本自清净但用此心直了成佛不假外求念念无滞即是功德
  summary_first_person: 吾本范阳后裔流寓岭南新州卖柴养母因闻金刚经而开悟赴黄梅礼五祖忍于碓坊踏碓八月以本无一物之偈见性三鼓受顿教衣钵为第六祖南遁大庾岭付法惠明避难猎队十五载后于广州法性寺剃发出家开东山法门于韶州大梵寺说摩诃般若令众言下见性
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E8%97%8F%E5%A4%96/%E5%85%AD%E7%BB%84%E5%9D%9B%E7%BB%8F.html
