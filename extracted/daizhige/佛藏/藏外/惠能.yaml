endeavors:
- id: guji-惠能-endeavor-1
  title_zh: 黄梅求法得衣钵
  summary: 卖柴闻金刚经而悟道安母赴黄梅舂米踏碓以无相偈显本性夜受衣钵为六祖
  phases:
  - key: brewing
    name: 卖柴闻经安母赴梅
    labels:
      zh: 闻法起信
    start_date: 0659
    highlight_event_id: guji-惠能-event-fuhuangmei
  - key: breakthrough
    name: 廊壁呈偈本无一物
    labels:
      zh: 见性呈偈
    start_date: '0671'
    highlight_event_id: guji-惠能-event-chengji
  - key: climax
    name: 三鼓入室传顿教衣钵
    labels:
      zh: 得法为祖
    start_date: '0671'
    highlight_event_id: guji-惠能-event-defa
  - key: closure
    name: 大庾岭付法惠明
    labels:
      zh: 转授心要
    start_date: '0672'
    highlight_event_id: guji-惠能-event-huiming
  decisions:
  - date: 0659
    title_zh: 取银安母赴黄梅参礼
    rationale: 惟求作佛不求余物宿昔有缘闻黄梅劝持金刚经即自见性遂安置老母辞违南行
  - date: '0671'
    title_zh: 三鼓入室受法即南遁
    rationale: 会杖击三下米熟欠筛之意言下大悟万法不离自性衣为争端恐人害故逢怀则止遇会则藏
- id: guji-惠能-endeavor-2
  title_zh: 曹溪开法说顿教
  summary: 避难猎队十五载以肉边菜护念后出广州法性寺剃发于菩提树下开东山法门于大梵寺说般若
  phases:
  - key: brewing
    name: 四会猎队避难守网
    labels:
      zh: 韬晦护念
    start_date: '0672'
    highlight_event_id: guji-惠能-event-huiming
  - key: breakthrough
    name: 法性寺风幡心动剃发
    labels:
      zh: 出家开法
    start_date: '0676'
    highlight_event_id: guji-惠能-event-faxing
  - key: climax
    name: 大梵寺说摩诃般若
    labels:
      zh: 直指见性
    start_date: '0701'
    highlight_event_id: guji-惠能-event-dafan
  - key: closure
    name: 付嘱流行无令断绝
    labels:
      zh: 传法后学
    start_date: '0713-08-03'
    highlight_event_id: guji-惠能-event-death
  decisions:
  - date: '0676'
    title_zh: 出示衣钵事印宗为师剃发
    rationale: 论佛性非常非无常即不二之法不论禅定解脱惟论见性故得印可开东山法门
  - date: '0701'
    title_zh: 于大梵寺说顿教破疑
    rationale: 为韦刺史官僚僧俗说功德在法身不在修福说随其心净即佛土净普愿法界言下见性成佛
events:
- id: guji-惠能-event-birth
  title_zh: 诞生岭南新州
  date: 0638
  year_of: 638
  description: 严父本贯范阳左降流岭南为新州百姓父早亡随母移南海艰辛卖柴养母
- id: guji-惠能-event-fuhuangmei
  title_zh: 闻金刚经赴黄梅礼五祖
  date: 0659
  year_of: 659
  description: 送柴至客店闻客诵金刚经心即开悟得银安母不经三十余日便至黄梅礼拜忍大师自言惟求作佛
- id: guji-惠能-event-chengji
  title_zh: 南廊呈偈菩提本无树
  date: '0671'
  year_of: 671
  description: 神秀书身是菩提树于南廊惠能请别驾张日用书菩提本无树明镜亦非台本来无一物何处惹尘埃众惊为肉身菩萨
- id: guji-惠能-event-defa
  title_zh: 三鼓受法传衣钵为六祖
  date: '0671'
  year_of: 671
  description: 会击碓三下之意三鼓入室五祖以袈裟遮围说金刚经至应无所住而生其心言下大悟五颂自性本自清净受顿教及衣钵
- id: guji-惠能-event-huiming
  title_zh: 大庾岭付法惠明
  date: '0672'
  year_of: 672
  description: 掷衣钵隐草莽中惠明提不动为法而来教以不思善不思恶识本来面目指返照密在汝边后避难猎队十五载
- id: guji-惠能-event-faxing
  title_zh: 广州法性寺剃发出家
  date: '0676'
  year_of: 676
  description: 因风幡之论言不是风动不是幡动仁者心动印宗延至上席出示衣钵遂剃发于菩提树下开东山法门
- id: guji-惠能-event-dafan
  title_zh: 大梵寺说顿教般若
  date: '0701'
  year_of: 701
  description: 韶州韦刺史请于大梵寺讲堂为千余人说摩诃般若波罗蜜说功德在法身说法界心净即佛土净众闻皆叹岭南有佛出世
- id: guji-惠能-event-death
  title_zh: 示寂曹溪
  date: '0713-08-03'
  year_of: 713
  description: 将顿教法门流行后学付嘱护念广度有情无令断绝示寂于曹溪为禅宗六祖
