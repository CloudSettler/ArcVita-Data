  summary_first_person: 我是岭南新州百姓幼失父与母移南海卖柴养命因闻金刚经心迷便悟辞亲往黄梅礼拜五祖弘忍踏碓八月余于南廊呈菩提本无树偈三更蒙说金刚经言下大悟受顿法及衣为六代祖南归过庾岭度慧明后于韶州大梵寺升高座说摩诃般若教人自悟三身自度自性
