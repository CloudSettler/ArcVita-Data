      - 随众作务
      - 不至堂前
    start_date: '0660'
    highlight_event_id: guji-慧能-event-huangmei
  - key: climax
    name: 南廊呈偈三更传衣
    labels:
      zh:
      - 菩提本无树
      - 言下便悟
      - 传衣为信
    start_date: '0661'
    highlight_event_id: guji-慧能-event-verse
  - key: closure
    name: 九江送别庾岭南行
    labels:
      zh:
      - 三年勿弘
      - 还衣传法
      - 避难向南
    start_date: '0661'
    highlight_event_id: guji-慧能-event-dayuling
  decisions:
  - date: 0659
    title_zh: 辞母远赴黄梅只求作佛
    rationale: 闻持金刚经即见性成佛宿业有缘不求余物但求法作佛
  - date: '0661'
    title_zh: 请人代书本无树偈呈本心
    rationale: 不识本心学法无益为明佛性常清净无处染尘示众见性
  - date: '0661'
    title_zh: 三更受法即发向南不恋住
    rationale: 传法气如悬丝住此有人害命依五祖处分将法向南善诱迷人
- id: guji-慧能-endeavor-2
  title_zh: 韶州大梵寺弘顿教
  summary_zh: 应韶州刺史韦据请升高座说法传无相戒定慧无念顿悟法门
  phases:
  - key: brewing
    name: 累劫因缘依止岭南
    labels:
      zh:
      - 韶州因缘
      - 道俗同请
      - 法海集记
    start_date: '0676'
    highlight_event_id: guji-慧能-event-dafan
  - key: breakthrough
    name: 升高座说摩诃般若
    labels:
      zh:
      - 定慧一体
      - 直心是道场
      - 灯光喻定慧
    start_date: '0677'
    highlight_event_id: guji-慧能-event-dafan
  - key: climax
    name: 传授无相戒归依自性
    labels:
      zh:
      - 自归三身佛
      - 四弘誓愿
      - 无相忏悔
    start_date: '0677'
    highlight_event_id: guji-慧能-event-dafan
  - key: closure
    name: 以无念为宗流行后代
    labels:
      zh:
      - 无念为宗
      - 无相为体
      - 无住为本
    start_date: '0677'
    highlight_event_id: guji-慧能-event-dafan
  decisions:
  - date: '0677'
    title_zh: 自净心神直说般若不行口诤
    rationale: 菩提般若世人本有只缘心迷须示道见性自悟修行不在口诤
  - date: '0677'
    title_zh: 授无相戒令自归自性三宝
    rationale: 三身在自法性色身是舍宅不任归依除迷外觅令见自性三身佛
  - date: '0677'
    title_zh: 立无念无相无住破坐禅执
    rationale: 看心看净坐不动同无情障道须外离相内不乱一行直心通流
