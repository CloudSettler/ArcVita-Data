      raw: 明天启三年十月七日示寂于南华寺
  birth_date: 1546-11-15
  death_date: 1623-11-07
  era: 明代
  reign_ref: 万历
  archetype: 中兴弘法型高僧
  dilemmas:
  - 深入山林真参实悟与应缘说法广利群生之间如何兼顾
  - 蒙冤谪戍瘴海之时坚守道心还是随俗沉浮之抉择
  - 扶宗崇教与应机接引之间文繁义广如何归于一心
  lesson: 以梦游视世间，逆境即道场，真参实悟后以慈悲愿力转瘴海为法海，以著述接引末法众生同归智海
  summary_first_person: 吾德清号憨山，幼悟无常出家参究，梦授于慈氏悟彻华严法界，虽因弘法蒙难谪戍雷州，终转瘴疠为法筵，重兴曹溪，横说竖说皆从如来文字海中流出，愿末法众生沾吾一言半句同登智海
  source_urls:
  - https://daizhige.org/佛藏/藏外/憨山老人夢遊集.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/藏外/憨山老人夢遊集.md
