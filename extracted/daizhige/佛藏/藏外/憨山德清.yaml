    title_zh: 谪戍不废说法
    rationale: 以弘法得罪命如单线，决以慈心三昧普使朽骨生春，转流放为弘化之机
  - date: 1601-03-01
    title_zh: 住持南华重建丛林
    rationale: 见曹溪涸而宝林萧然，发愿搏生死大海取善根众生置佛法中，故建道场续慧命
- id: guji-憨山德清-endeavor-2
  title_zh: 注经释论与梦游集撰述
  summary: 融通性相禅教，注释楞严法华金刚起信道德诸经，法语书问序记塔铭并行，直指人心，欲以一言半句令众生饮河满腹
