  archetype: 苦行护教诗僧
  dilemmas:
  - 文字诗名与生死本分之辨究属文字障还是弘法缘
  - 政教剧变中避世自修还是入世护产兴学创会
  - 官府清查僧产以布施募化分官公私时忍辱退让还是据约法力争
  lesson: 以苦行炼心以诗缘接众以护教舍身始励苦行终成慧业方为不负如来
  summary_first_person: 吾湖南湘潭黄氏子也幼丧父母牧牛自课见桃花零落感无常而投湘阴法华出家继于南岳受具参岐山而饲犬悟入剜肉燃指以供舍利精修法华般若而证寒触三昧还湘中兴上封沩山继主天童十一年值寺产被夺外教窥伺遂拒伪保护兴僧学创中华佛教总会北上护法而示寂于京师
  source_urls:
