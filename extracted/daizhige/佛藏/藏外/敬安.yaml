      - 妙智顿开
    start_date: 1880-01-01
    highlight_event_id: guji-寄禅-event-realization
  decisions:
  - date: 1868-04-01
    title_zh: 见桃花落而投法华出家
    rationale: 感生死无常不忍醉生梦死故舍牧牛而从东林祝发
  - date: 1870-01-01
    title_zh: 冒雪往参岐山恒志甘执饲犬贱役
    rationale: 闻教外别传之旨欲究本分故不惮苦行以磨业识分别
  - date: 1878-01-01
    title_zh: 剜背肉注油代灯燃去左手两指
    rationale: 慕千疮求半偈之诚愿以身供舍利而发起法华般若大愿
- id: guji-寄禅-endeavor-2
  title_zh: 还湘住持中兴丛林
  summary_zh: 光绪十年还湘历主罗汉上封大善沩山神鼎上林规复上封田产振兴沩山后主天童十一年夏讲冬禅
  phases:
  - key: brewing
    name: 还湘历主衡岳沩山诸刹
    labels:
