      - 力争
    start_date: 1912-11-01
    highlight_event_id: guji-寄禅-event-founding
  - key: closure
    name: 吉祥卧示寂京师法源寺龛归天童冷香塔
    labels:
      zh:
      - 示寂
      - 归龛
    start_date: 1912-11-11
    highlight_event_id: guji-寄禅-event-death
  decisions:
  - date: 1908-06-01
    title_zh: 陈窃名之妄力请严拒伊藤贤道
    rationale: 以借传教保护为辱国辱教故飞函当事得学部颁僧教育会章程而自办僧学
  - date: 1912-04-15
    title_zh: 赴沪联合创中华佛教总会谒孙大总统
    rationale: 以平等国行平等教最适共和又虑僧人惊恐流徙而废置故以静安为总机关而电请立案
  - date: 1912-11-10
    title_zh: 见礼俗司据约法龂龂争辩不屈而出
    rationale: 以布施募化界说不明调查僧产分别官公私违约法故宁愤而出不肯以文宴自解
events:
- id: guji-寄禅-event-birth
  title_zh: 湘潭黄氏梦兰生
  date: 1852-01-23
  year_of: 1852
  place_zh: 湖南湘潭
  description: 母奉观音甚虔梦兰而生方髫龄即屏腥随母拜月喜闻仙佛事
- id: guji-寄禅-event-ordination
  title_zh: 投湘阴法华祝发南岳受具
  date: 1868-04-01
  year_of: 1868
  place_zh: 湘阴法华寺南岳祝圣寺
  description: 同治七年春驱牛见桃花被风雨摧落感哭投法华从东林祝发后从贤楷律师受具足戒
- id: guji-寄禅-event-realization
  title_zh: 岐山饲犬悟入燃指证法华三昧
  date: 1880-01-01
  year_of: 1880
  place_zh: 岐山阿育王寺南岳
  description: 司行堂饲犬食余而悟垢净分别参乾矢橛剜肉燃指修法华般若十八日寒触舌转默公证为法华三昧
- id: guji-寄禅-event-abbacy
  title_zh: 历主上封沩山天童中兴丛林
  date: 1902-01-01
  year_of: 1902
  place_zh: 衡山上封沩山天童
  description: 光绪十年还湘讼复上封田产驻锡沩山三年光绪二十八年主天童十一年夏讲冬禅百废俱举
- id: guji-寄禅-event-protection
  title_zh: 严拒窃名保护兴僧教育会
  date: 1908-06-01
  year_of: 1908
  place_zh: 浙江宁波
  description: 浙江三十五寺请日本本愿寺伊藤贤道窃名为首飞函陈妄力请严拒得自办僧学长宁波分会三年
- id: guji-寄禅-event-founding
  title_zh: 创中华佛教总会被推为长北上护法
  date: 1912-04-15
  year_of: 1912
  place_zh: 上海留云寺静安寺北京法源寺
  description: 联合十七省僧侣创中华佛教总会谒孙大总统四月成立被推为长改僧教育会为支部十月为湘事北上见礼俗司据约法相诘
- id: guji-寄禅-event-death
  title_zh: 吉祥卧示寂京师归龛天童冷香
  date: 1912-11-11
  year_of: 1912
  place_zh: 北京法源寺宁波天童青龙冈
  description: 到京九日夜半胸膈作痛明晨吉祥卧示寂世寿六十二僧腊四十五道阶奉龛南归次年正月藏真于冷香塔院
