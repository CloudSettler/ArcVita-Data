      - 中兴
      - 沩山
    start_date: 1895-01-01
    highlight_event_id: guji-寄禅-event-abbacy
  - key: closure
    name: 主天童十一年百废俱举
    labels:
      zh:
      - 天童
      - 讲禅
    start_date: 1902-01-01
    highlight_event_id: guji-寄禅-event-abbacy
  decisions:
  - date: 1884-01-01
    title_zh: 辞江浙旧游还湘领众
    rationale: 以本师贤楷笠云之教思报桑梓故历主衡湘诸寺以整颓风
  - date: 1885-01-01
    title_zh: 为上封田产被夺讼于当道经年不退
    rationale: 山后数千亩皆供众之产宗风所系故赖巡抚力而次第规复
  - date: 1902-01-01
    title_zh: 辞上林应请出主天童
    rationale: 以四明净域需高僧守护法度又念旧游胜地故守护十一年而夏讲冬禅不辍
- id: guji-寄禅-endeavor-3
  title_zh: 护教兴学创中华佛教总会
  summary_zh: 拒日本本愿寺窃名保护兴僧教育会创中华佛教总会谒孙大总统北上争约法护湘僧产而示寂
  phases:
  - key: brewing
    name: 飞函严拒窃名保护兴僧学
    labels:
