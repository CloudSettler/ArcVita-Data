endeavors:
- id: guji-文悦-endeavor-1
  title_zh: 龙兴受业嗣法大愚
  summary: 南昌龙兴受业，参大愚守芝得法，列临济第八世
  phases:
  - key: brewing
    name: 龙兴受业参学
    labels:
      zh:
      - 受业
      - 参学
    start_date: '1010'
    highlight_event_id: guji-文悦-event-ordination
  - key: breakthrough
    name: 嗣法大愚契悟
    labels:
      zh:
      - 得法
      - 嗣承
    start_date: '1035'
    highlight_event_id: guji-文悦-event-dharma
  decisions:
  - date: '1035'
    title_zh: 投大愚守芝座下
    rationale: 为求临济正宗向上宗乘，不滞言中取的，故亲近大愚而得法
  - date: '1040'
    title_zh: 承当临济第八世家风
    rationale: 为续汾阳大愚一脉全提正令，故直下承当不狐狸恋窟
- id: guji-文悦-endeavor-2
  title_zh: 住持云峰辞众坐逝
  summary: 行是令于西山谷口南岳峰前，学者景从，报缘将终辞众坐逝舍利充溢
  phases:
  - key: climax
    name: 云峰住持弘化
    labels:
      zh:
      - 住持
      - 接学
    start_date: '1045'
    highlight_event_id: guji-文悦-event-abbot
  - key: closure
    name: 辞众坐逝度人
    labels:
      zh:
      - 示寂
      - 舍利
    start_date: '1058'
    highlight_event_id: guji-文悦-event-death
  decisions:
  - date: '1045'
    title_zh: 应请住持弘扬正令
    rationale: 为令丛林学者辐凑得益，不失本宗，故坐断十方壁立千仞而接人
  - date: '1058'
    title_zh: 报缘将终辞众坐逝
    rationale: 为示末后度人大事，以坐逝舍利激射宝龛，令后人信向，故怡然辞众而逝
