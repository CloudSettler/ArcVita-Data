    rationale: 欲报深恩须先自度持戒清净方能为世福田广设法供
  - date: '1648'
    title_zh: 会通三学不执一门
    rationale: 见末法门户分诤故以实相印会台律净令学者事理双彰同归自性
events:
- id: guji-智旭-event-birth
  title_zh: 出生吴县钟氏之家
  date: '1599'
  year_of: 1599
  place_zh: 吴县
  description_zh: 明万历二十七年生于古吴钟氏家，少习儒业，聪慧究心圣贤之道。
- id: guji-智旭-event-ordination
  title_zh: 弃儒出家受具持律
  date: '1623'
  year_of: 1623
  place_zh: 江南
  description_zh: 发出世心，薙染出家，受具足戒，遍参知识，专志律台教观。
- id: guji-智旭-event-study
  title_zh: 掩关灵峰深入经藏
  date: '1640'
  year_of: 1640
  place_zh: 灵峰
  description_zh: 掩关修道，深研大乘经律，融通天台性相，会归净土持名。
- id: guji-智旭-event-ulan
  title_zh: 作盂兰盆经新疏
  date: '1647'
  year_of: 1647
  place_zh: 古吴
  description_zh: 以五重玄义新疏盂兰盆经，明盂兰救倒悬之义，立自性三宝为体，孝慈为宗，道昉参订流通。
- id: guji-智旭-event-teaching
  title_zh: 弘化四方著述等身
  date: '1650'
  year_of: 1650
  place_zh: 江浙
  description_zh: 讲演著述不辍，弘扬持戒念佛，劝勉佛弟子年年七月十五日修盂兰盆供。
- id: guji-智旭-event-death
  title_zh: 示寂于灵峰
  date: '1655'
  year_of: 1655
  place_zh: 灵峰
  description_zh: 清顺治十二年示寂于灵峰，世寿五十七，遗著灵峰宗论等流通后世。
