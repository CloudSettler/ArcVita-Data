  birth_date: '1599'
  death_date: '1655'
  era: 明末清初
  reign_ref: 明万历至清顺治
  archetype: 弘律高僧
  dilemmas:
  - 梵网十重与戒本四重详略不同宽严有异如何参合会通而不相违
  - 性罪为利他可开遮罪须同学凡夫初学身心力弱如何不借口悲心而自欺亏戒
  - 像前自受与必见好相上中下品戒相如何审因择人令因地真实不自诳
  lesson: 受持菩萨戒要在因地真实悲智相应，会通三家而不执一辙，数发菩提心，宁严立法择人，不贪虚名自欺
  summary_first_person: 我藕益智旭以菩萨戒弟子究毗尼后集，感时人疑梵网璎珞地持详略宽严授受忏悔之异，故设问辩以会三为一，明杀盗淫妄酤酒等轻重失受之别与性遮开制之义，劝后贤审因求戒数发四弘不自欺诳
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E8%97%8F%E5%A4%96/%E6%AF%97%E5%B0%BC%E5%90%8E%E9%9B%86%E9%97%AE%E8%BE%A9.html
endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 会通三家折衷菩萨戒法撰毗尼后集问辩
  summary: 以梵网为本师和尚立法，璎珞地持为授戒阇梨详悉，参合杀盗淫妄酤酒等十重四重之制，会三为一式，决详略宽严授受之疑
  phases:
  - key: brewing
    name: 疑义酝酿
    labels:
      zh:
      - 究律
      - 疑情
    start_date: '1623'
    highlight_event_id: guji-智旭-event-study-vinaya
  - key: breakthrough
    name: 参合经论
    labels:
      zh:
      - 会通
      - 折衷
    start_date: '1640'
    highlight_event_id: guji-智旭-event-study-vinaya
  - key: climax
    name: 设问作辩
    labels:
      zh:
      - 著述
      - 决疑
    start_date: '1647'
    highlight_event_id: guji-智旭-event-write-wenbian
  - key: closure
    name: 三一流通
    labels:
      zh:
      - 付刻
      - 俟后贤
    start_date: '1648'
    highlight_event_id: guji-智旭-event-write-wenbian
  decisions:
  - date: '1640'
    title_zh: 独遵慈氏羯磨嫌太略乃参酌三家
    rationale: 根器习性各别理无多致而机贵随宜，既法可融通故不用别加文饰，但用经论成言折衷为一
  - date: '1647'
    title_zh: 以问答九则决诵讲说戒重轻开制
    rationale: 为防比丘贼住须严众缘，为趋菩提须观因地，故明未受前说戒忏悔二师好相之制令互为表里
- id: guji-智旭-endeavor-2
  title_zh: 开示授受忏悔弘通菩萨律仪
  summary: 辨像前自受与从师亲授上中下品之分，明发增上心方得增上戒，示向小乘悔过与布萨遣出之别，诫驾言菩萨借口悲心者
  phases:
  - key: brewing
    name: 观察当机
    labels:
      zh:
      - 授戒
      - 择人
    start_date: '1635'
    highlight_event_id: guji-智旭-event-preach-precepts
  - key: breakthrough
    name: 审因授法
    labels:
      zh:
      - 发心
      - 羯磨
    start_date: '1642'
    highlight_event_id: guji-智旭-event-preach-precepts
  - key: climax
    name: 劝数发心
    labels:
      zh:
      - 四弘
      - 相续
    start_date: '1647'
    highlight_event_id: guji-智旭-event-write-wenbian
  - key: closure
    name: 诫勉后学
    labels:
      zh:
      - 惭愧
      - 不自欺
    start_date: '1650'
    highlight_event_id: guji-智旭-event-preach-precepts
  decisions:
  - date: '1642'
    title_zh: 严择内因不妄传授滥膺菩萨名
    rationale: 羯磨具有观察当机之法，不知内因而妄授则犯无解作师之过，受者虽不发戒亦当依法判罪
  - date: '1647'
    title_zh: 示像前自受必审悲智与遇师与否
    rationale: 果能念念悲智相应可遵璎珞地持设不遇师亦得自受，若悲智未深须秉梵网求见好相，有师憍慢不求则两经咸不听许
events:
- id: guji-智旭-event-birth
  date: '1599'
  year_of: 1599
  title_zh: 诞生吴县
  description: 明万历二十七年生于吴县钟氏家，晚号藕益，名智旭
- id: guji-智旭-event-study-vinaya
  date: '1623'
  year_of: 1623
  title_zh: 出家究教观律学
  description: 年二十余出家，遍究台贤教观，专志毗尼，究菩萨戒本梵网璎珞地持之异同
- id: guji-智旭-event-write-wenbian
  date: '1647'
  year_of: 1647
  title_zh: 述毗尼后集问辩会三为一
  description: 以问答九则决诵讲遮显四重十重性遮开制自受好相悔过二师重发四弘等疑，会梵网璎珞地持三家成一式
- id: guji-智旭-event-preach-precepts
  date: '1650'
  year_of: 1650
  title_zh: 弘授菩萨戒诫因地须真
  description: 为学人授菩萨戒，强调发增上心审悲智深浅，示忏悔布萨之制，诫莫贪大士虚名招长夜苦报
- id: guji-智旭-event-death
  date: '1655'
  year_of: 1655
  title_zh: 示寂灵峰
  description: 清顺治十二年正月示寂于灵峰，世寿五十有七，后世尊为净土宗九祖兼弘律之祖
