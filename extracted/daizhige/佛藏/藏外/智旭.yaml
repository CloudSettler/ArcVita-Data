    title_zh: 舍繁就简依地持璎珞立本
    rationale: 梵网受法已失传仅存影略惟地持璎珞的的可依承故以二家为主兼采梵网以求痛快直捷
  - date: 1631-09-01
    title_zh: 定请师三说白佛三番证盟之式
    rationale: 令受者先发弘愿请师礼拜归依悔过发愿再由师三番启白引妙善戒法震动覆顶流入身心以得无作戒体
