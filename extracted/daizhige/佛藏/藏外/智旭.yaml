      - 苦到礼佛
    start_date: 1650
    highlight_event_id: guji-智旭-event-fanwang-chanfa
  - key: climax
    name: 重修愿行旋绕坐观实相
    labels:
      zh:
      - 重修愿行
      - 旋绕自归
      - 坐念实相
    start_date: 1651
    highlight_event_id: guji-智旭-event-fanwang-chanfa
  decisions:
  - date: 1650
    title_zh: 不泛依诸行法而别依梵网行法
    rationale: 法华方等虽能灭罪于犯十戒者仍须别依梵网方使标心不泛如从地倒还从地起
  - date: 1651
    title_zh: 以空观洗涤罪尘而不先观相好
    rationale: 戒缺解未圆若作意观相恐招魔事故先推简罪性本空令垢净感应自现
- id: guji-智旭-endeavor-2
  title_zh: 学戒弘律以通道俗进修
  summary: 先述学戒法明千里无师像前自受之义后通明大小乘戒相令破戒优婆塞沙弥及比丘皆有所依而密达无生
  phases:
  - key: brewing
    name: 述学戒法明自誓受戒
    labels:
      zh:
      - 璎珞地持
      - 自誓受戒
      - 七日忏悔
    start_date: 1640
    highlight_event_id: guji-智旭-event-xuejiefa
  - key: closure
    name: 开示三根证相普植出世种
    labels:
      zh:
      - 下根戒品净
      - 中根定品净
      - 上根慧品净
    start_date: 1652
    highlight_event_id: guji-智旭-event-fanwang-chanfa
  decisions:
  - date: 1640
    title_zh: 先述学戒通明自受大意
    rationale: 经明七日佛前忏悔得见好相便得戒与璎珞地持同故先立通用之学戒轨
  - date: 1652
    title_zh: 纵未感应亦令永断相续恳求哀
    rationale: 障深未成感应者能断相续恳恻必能闭恶趣门植出世种不致空过
