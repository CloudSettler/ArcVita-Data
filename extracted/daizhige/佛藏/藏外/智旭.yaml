endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 撰述成唯识论观心法要
  description: 领会诸家旨趣，自抒浅显之文，随讲随录五卷，直明心观，以五位五观贯通唯识教理
  phases:
  - key: brewing
    name: 溯流穷源研习瑜伽显扬大钞宗镜
    labels:
      zh: 研教穷源
    start_date: 1640
    highlight_event_id: guji-智旭-event-study
  - key: breakthrough
    name: 立五观纲领冠罩诸家
    labels:
      zh: 立观提纲
    start_date: 1647
    highlight_event_id: guji-智旭-event-study
  - key: climax
    name: 随讲随录直明心观
    labels:
      zh: 著述讲录
    start_date: 1648
    highlight_event_id: guji-智旭-event-compose
  - key: closure
    name: 五卷告成付同志质正大方
    labels:
      zh: 成书流通
    start_date: 1649
    highlight_event_id: guji-智旭-event-compose
  decisions:
  - date: 1647
    title_zh: 不更衍繁文秪图直明心观
    rationale: 钝者望洋而退，利者蔑裂而求，故舍繁琐引证，便初机句读，句句消归自己
  - date: 1648
    title_zh: 以五重唯识观贯通境教理行果
    rationale: 性相如水与波不一不异，须以遣虚存实舍滥留纯摄末归本隐劣显胜遣相证性断障证果
- id: guji-智旭-endeavor-2
  title_zh: 破执显宗弘扬大乘正解
  description: 依真比量破凡外我执及有宗清辩等四师法执，令迷谬者生正解断二障证二果
  phases:
  - key: brewing
    name: 开示谬执我法迷唯识者
    labels:
      zh: 悲愿发心
    start_date: 1645
    highlight_event_id: guji-智旭-event-preach
  - key: breakthrough
    name: 以三支八支成立唯识道理
    labels:
      zh: 立量破执
    start_date: 1647
    highlight_event_id: guji-智旭-event-preach
  - key: climax
    name: 广破外小六师三计及四师异执
    labels:
      zh: 破邪显正
    start_date: 1648
    highlight_event_id: guji-智旭-event-preach
  - key: closure
    name: 指示修行位次趣入二空妙观
    labels:
      zh: 利乐有情
    start_date: 1649
    highlight_event_id: guji-智旭-event-compose
  decisions:
  - date: 1647
    title_zh: 借破我法二执以显二空真理
    rationale: 西域外道党已无，不劳细究出处，但借言端破二执，便显妙理，遮增减二执
  - date: 1648
    title_zh: 融摄天台性具圆融于唯识能变所变
    rationale: 适同志拟从能变所变差别之途，开性具性徧圆融之钥，故兼命管城共阐观心法要
events:
- id: guji-智旭-event-birth
  date: 1599
  year_of: 1599
  title_zh: 出生于吴县
  description: 明万历二十七年出生，俗姓钟，后出家名智旭，号蕅益
- id: guji-智旭-event-study
  date: 1640
  year_of: 1640
  title_zh: 穷研唯识诸疏及瑜伽显扬
  description: 研读开蒙问答大钞宗镜及音义集解证义合响诸作，究明三性四分五位百法
- id: guji-智旭-event-compose
  date: 1648
  year_of: 1648
  title_zh: 撰述成唯识论观心法要五卷
  description: 蕅益沙门智旭述，随讲随录，先申凡例，次释题目颂主论主译师，终广释唯识观心
- id: guji-智旭-event-preach
  date: 1649
  year_of: 1649
  title_zh: 讲演唯识五观利乐有情
  description: 以遣虚存实等五观开示学人，令达我法二空，断烦恼所知二障，证解脱菩提二果
- id: guji-智旭-event-death
  date: 1655
  year_of: 1655
  title_zh: 示寂于灵峰
  description: 清顺治十二年正月示寂，世寿五十七，一生著述宏丰，晚归净土持名
