  dilemmas:
  - 受菩萨戒已而毁犯十重当何依出罪而不永弃于佛法海
  - 事仪理观若偏废一端何能既竭罪流又清罪源而复戒体
  - 戒缺解劣而妄求好相恐招魔事当何修方得感应而不被境迷
  lesson: 如从地倒还从地起以事理二忏拔罪根而复戒体密进无生
  summary_first_person: 我是藕益智旭菩萨戒弟子先述学戒法以明自誓受戒今特为犯十重者别明梵网忏仪立严道场乃至坐念实相十意依三世千佛苦到礼诵以求好相令戒体完复直证无生
