  - title_zh: 经论授戒详略互殊何以适从
    description_zh: 梵网璎珞地持善戒及心地观等被机各别详略互殊制旨教行各抒己意反致义因文隐难以授受
  - title_zh: 律制繁简之间如何令授受明白简易
    description_zh: 比丘受戒宜专遵四分削繁文菩萨受法当会通的证以免紊杂使授者受者皆得简易明了
  lesson: 会通经论以成简易明白之制方能利授受而续佛种
  summary_first_person: 吾古吴智旭也窃观菩萨受法经论各异而后人增设科条反不若经论痛快直捷故敬酌地持璎珞梵网三家会成一式庶俾详简适中授受明白以十方三宝为证令受者得无作戒体永为佛种
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/藏外/重定授菩萨戒法.md
  - https://daizhige.org/佛藏/藏外/重定授菩萨戒法.html
