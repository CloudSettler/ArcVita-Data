    rationale: 见末法众生障重唯依念佛得度故以天台教观解净土以净土行归摄万善
  - date: 1648-05-01
    title_zh: 闭关注疏以文字摄众
    rationale: 身病缘乖不便远游故以注述为佛事令后学由解起行同生极乐以免口说不行之弊
