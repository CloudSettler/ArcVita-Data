person:
  qid: guji-桂迁
  name_zh: 桂迁
  names:
    zh: 桂迁
    en: Gui Qian
  lifespan:
    birth:
      date: 1270
      precision: year
      is_circa: true
      raw: 大德中青壮推约生于至元末长洲
    death:
      date: 1350
      precision: year
      is_circa: true
      raw: 会稽分产为名家后卒约惠宗时
  birth_date: 1270
  death_date: 1350
  era: 元朝
  reign_ref: 元成宗大德至元惠宗时
  archetype: 负恩悔悟者
  dilemmas:
  - 桑下得金匿报自肥与尽报施恩之辨
  - 薄偿施孤绝义自安与厚报赎罪改过之择
  lesson: 天道好还丝粟不爽，负人者终自辱，悔悟改过犹可立名
  summary_first_person: 我本长洲寒士，贩折遇施济拯救又栖其前村田庐，桑下得金听妻言而匿之徙越致富，薄偿施孤致其母抱疾而亡，后因赋役求官被刘诳尽金，京师梦为犬受辱方悟果报，归而厚葬施母以女妻其子三分其产以赎前愆
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E4%BD%9B%E8%97%8F/%E8%97%8F%E5%A4%96/%E8%A7%85%E7%81%AF%E5%9B%A0%E8%AF%9D.md
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E8%97%8F%E5%A4%96/%E8%A7%85%E7%81%AF%E5%9B%A0%E8%AF%9D.html
endeavors:
- id: guji-桂迁-endeavor-1
  title_zh: 寄田得金负恩背义
  summary: 得施济代偿债务又栖其田，掘得白金匿而不报，徙越致富薄偿施孤而绝义
  phases:
  - key: brewing
    name: 虎丘遇救寄田栖身
    labels:
      zh: 遇救栖田
    start_date: 1300
    highlight_event_id: guji-桂迁-event-meet
  - key: breakthrough
    name: 桑下掘得白金藏
    labels:
      zh: 得金匿报
    start_date: 1301
    highlight_event_id: guji-桂迁-event-gold
  - key: climax
    name: 薄偿施子二锭绝义
    labels:
      zh: 薄偿绝义
    start_date: 1325
    highlight_event_id: guji-桂迁-event-repay
  - key: closure
    name: 徙居会稽积产致富
    labels:
      zh: 徙越致富
    start_date: 1326
    highlight_event_id: guji-桂迁-event-move
  decisions:
  - date: 1301
    title_zh: 匿金潜置会稽产业
    rationale: 听妻言恐尽与不见德反致疑，欲潜置膏腴徐以己力为报，遂昧良心置施恩于度外
  - date: 1325
    title_zh: 仅以二锭偿施子
    rationale: 既富而吝且讳言前负，托言恐其不克负荷，又恶其发怒失礼，故薄偿以绝之
- id: guji-桂迁-endeavor-2
  title_zh: 求官被诳梦感改过
  summary: 苦赋役谋官被刘滑稽所卖，京师怀匕首欲刺而梦为犬受辱，幡然悔悟归善厚报施家
  phases:
  - key: brewing
    name: 赋役繁重谋官免役
    labels:
      zh: 谋官免役
    start_date: 1332
    highlight_event_id: guji-桂迁-event-seek
  - key: breakthrough
    name: 京师尽金被刘所卖
    labels:
      zh: 被诳尽金
    start_date: 1333-05-01
    highlight_event_id: guji-桂迁-event-seek
  - key: climax
    name: 阛阓梦为犬受辱
    labels:
      zh: 梦犬悔悟
    start_date: 1333-06-15
    highlight_event_id: guji-桂迁-event-dream
  - key: closure
    name: 归吴厚报三分其产
    labels:
      zh: 归善赎罪
    start_date: 1334
    highlight_event_id: guji-桂迁-event-return
  decisions:
  - date: 1333-05-01
    title_zh: 以三千金托刘求官
    rationale: 信滑稽之言欲捐耗赀跻崇秩免岁输折腰之苦，罄付所携不问出入又称贷续投
  - date: 1333-06-15
    title_zh: 弃匕首返吴赎罪
    rationale: 梦中为犬乞怜受杖悟天道好还负人即负己，刘之负我犹我之负施，遂弃仇归善厚报
events:
- id: guji-桂迁-event-birth
  title_zh: 出生长洲
  date: 1270
  year_of: 1270
  place_zh: 苏州长洲
  description: 生于长洲民家，有薄田数亩足供饘粥，少与施济同学
- id: guji-桂迁-event-meet
  title_zh: 剑池遇施济得救
  date: 1300
  year_of: 1300
  place_zh: 虎丘剑池读书台
  description: 贩折归被李平章家驱逐，遇施济倾诉，施如额代偿二十锭又给前村田十亩桑枣栖身
- id: guji-桂迁-event-gold
  title_zh: 桑下掘得白金匿之
  date: 1301
  year_of: 1301
  place_zh: 吴前村田庐最高桑树下
  description: 居一年见白鼠入室夜发得白金一藏，听妻言匿而不报施君，倩旧识潜置膏田于会稽
- id: guji-桂迁-event-repay
  title_zh: 薄偿施子二锭
  date: 1325
  year_of: 1325
  place_zh: 会稽桂家西斋
  description: 施济殂后十五年其子自吴抵越求偿，留一饭仅偿二锭，使人诟其浅暴，施母抱疾还家而亡
- id: guji-桂迁-event-move
  title_zh: 挈家徙居会稽致富
  date: 1326
  year_of: 1326
  place_zh: 会稽
  description: 以只鸡斗酒奠施君诈言久占田庐靦颜，挈家居会稽，素饶幹局居积致富门庭奕然
- id: guji-桂迁-event-seek
  title_zh: 托刘求官被卖尽金
  date: 1333-05-01
  year_of: 1333
  place_zh: 京师邸中
  description: 苦赋役听刘滑稽之说携金三千至都求显官，金尽又称贷二千，刘除亲军指挥使押取余金而卖之
- id: guji-桂迁-event-dream
  title_zh: 阛阓梦为犬悔悟
  date: 1333-06-15
  year_of: 1333
  place_zh: 京师阛阓
  description: 怀利匕首欲刺刘，倚身少息梦入施堂为犬乞怜受杖，妻子皆成犬形，惊惧而苏幡然悔悟弃刃河中
- id: guji-桂迁-event-return
  title_zh: 归善厚报分产
  date: 1334
  year_of: 1334
  place_zh: 吴越之间
  description: 急访施子时年二十七，更厚葬其父母载至越以女妻之，三分财产遂为会稽名家，刘以赃败往赠钱相感
- id: guji-桂迁-event-death
  title_zh: 会稽善终
  date: 1350
  year_of: 1350
  place_zh: 会稽
  description: 晚年分产赎愆为会稽名家，江左犹能道其详，卒于家
