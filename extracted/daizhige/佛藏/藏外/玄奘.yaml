  dilemmas:
  - 众师宗涂各异莫知适从当留当往
  - 高昌王固留供养与毕命西方之冲突
  - 碛中失水生死一线东归偷生与西死之抉择
  lesson: 为法忘躯矢志不移方能穷源决择利济苍生
  summary_first_person: 吾姓陈名玄奘幼而慕道遍学南北经论而圣典隐显莫适所从而发愿西游遍历百三十国取经而还会译以报群生
  source_urls:
