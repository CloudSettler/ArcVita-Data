  birth_date: 0684
  death_date: 0758
  era: 唐
  reign_ref: 唐玄宗至肃宗时
  archetype: 弘法辩道型
  dilemmas:
  - 顿悟不由阶渐，如何令学者一念相应而不落空缚定缚
  - 佛性本有而为烦恼所覆，如何说本有今无而不失常住之本
  lesson: 见无念即见实相，本性空寂而恒沙功德一时等备，无住而生其心即得解脱
  summary_first_person: 我是荷泽神会，嗣曹溪慧能，主南宗顿旨，破北宗凝心看净，以无念为宗，一行三昧为门，明佛性常住本有，滑台定是非，洛阳弘般若，愿众生即心是道，一念相应便成正觉
  source_urls:
  - https://daizhige.org/%E4%BD%9B%E8%97%8F/%E8%97%8F%E5%A4%96/%E8%8D%B7%E6%B3%BD%E7%A5%9E%E4%BC%9A%E7%A6%85%E5%B8%88%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-神会-endeavor-1
  person_id: guji-神会
  title_zh: 滑台定宗旨显南顿北渐
  summary_zh: 承慧能南宗正脉，破凝心入定住心看净之渐法，立顿悟无念，楷定南北是非
  phases:
  - key: brewing
    name: 曹溪参学酿顿义
