endeavors:
- id: guji-神会-endeavor-1
  title_zh: 滑台设会定南宗是非
  summary: 开元年间滑台大云寺设无遮大会与崇远论辩立慧能正统辨顿渐
  phases:
  - key: brewing
    name: 承慧能顿教悟无生忍
    labels:
      zh: 襄阳悟道得上乘法
    start_date: 464
    highlight_event_id: guji-神会-event-dingben
  - key: breakthrough
    name: 开元十八九廿年修论
    labels:
      zh: 论本屡修言论未定
    start_date: 472
    highlight_event_id: guji-神会-event-dingben
  - key: climax
    name: 滑台大云寺对辩崇远
    labels:
      zh: 无遮大会辨邪正定旨
    start_date: 0734-02-12
    highlight_event_id: guji-神会-event-huatai
  - key: closure
    name: 取廿一载本为定行世
    labels:
      zh: 定本兼血脉传流行
    start_date: 476
    highlight_event_id: guji-神会-event-huatai
  decisions:
  - date: 0734-02-12
    title_zh: 设无遮大会兼庄严道场
    rationale: 不为功德唯为天下学道者定宗旨辨是非
  - date: 475
    title_zh: 取开元廿一载本为定
    rationale: 前诸本未成言论不同今定是非以灭后学之惑
- id: guji-神会-endeavor-2
  title_zh: 弘般若破凝心看净
  summary: 弘金刚般若为诸佛母破北宗凝心入定住心看净之渐教
  phases:
  - key: brewing
    name: 修般若波罗蜜法行
    labels:
      zh: 摄一切法为行根本
    start_date: 472
    highlight_event_id: guji-神会-event-dingben
  - key: breakthrough
    name: 示念不起为坐见性为禅
    labels:
      zh: 直了见性不教坐身住心
    start_date: 475
    highlight_event_id: guji-神会-event-dingben
  - key: climax
    name: 斥普寂自称七代妄竖
    labels:
      zh: 六代相承连绵不绝正统在慧能
    start_date: 0734-02-12
    highlight_event_id: guji-神会-event-huatai
  - key: closure
    name: 劝诵持金刚经弘大乘
    labels:
      zh: 以般若为佛母祖师普令知闻
    start_date: 476
    highlight_event_id: guji-神会-event-huatai
  decisions:
  - date: 0734-02-12
    title_zh: 不教凝心入定住心看净
    rationale: 此是系缚菩提唯念不起见本性方为坐禅
  - date: 476
    title_zh: 料简是非不惜身命
    rationale: 恐天魔外道惑众灭正法须弘大乘建立正法
