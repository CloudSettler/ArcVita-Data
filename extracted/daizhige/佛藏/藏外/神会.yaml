      - 参学
      - 顿悟
    start_date: '0704'
    highlight_event_id: guji-神会-event-birth
  - key: breakthrough
    name: 滑台大会破渐执
    labels:
      zh:
      - 论辩
      - 定宗
    start_date: '0732'
    highlight_event_id: guji-神会-event-dingzong
  - key: climax
    name: 南北是非大明
    labels:
      zh:
      - 南宗
      - 正统
    start_date: '0734'
    highlight_event_id: guji-神会-event-dingzong
  - key: closure
    name: 顿旨付嘱后学
    labels:
      zh:
      - 付嘱
      - 传灯
    start_date: '0750'
    highlight_event_id: guji-神会-event-heze
  decisions:
  - date: '0732'
    title_zh: 滑台大云寺当众定宗旨
    rationale: 为救学者住空住定之缚，须明辨顿渐，立南宗无念为正，以般若直指本性
  - date: '0733'
    title_zh: 判北宗普寂为渐法非究竟
    rationale: 北宗凝心看净起心外照皆有所得系缚，不见本性空寂，故须楷定以显顿门
- id: guji-神会-endeavor-2
  person_id: guji-神会
  title_zh: 弘无念一行三昧度众
  summary_zh: 居南阳洛阳荷泽寺，以金刚般若开示无住无念，教人见本性成佛道
  phases:
  - key: brewing
    name: 研涅槃般若酝本有义
    labels:
      zh:
      - 佛性
      - 般若
    start_date: '0720'
    highlight_event_id: guji-神会-event-dingzong
  - key: breakthrough
    name: 荷泽开堂说无念
    labels:
      zh:
      - 无念
      - 开示
    start_date: '0745'
    highlight_event_id: guji-神会-event-heze
  - key: climax
    name: 一行三昧普被道俗
    labels:
      zh:
      - 一行三昧
      - 无住
    start_date: '0746'
    highlight_event_id: guji-神会-event-heze
  - key: closure
    name: 语录结集示后世
    labels:
      zh:
      - 语录
      - 化导
    start_date: '0757'
    highlight_event_id: guji-神会-event-death
  decisions:
  - date: '0745'
    title_zh: 直指无念为宗不立阶次
    rationale: 本性从本来空寂无所得，若立缘起次第即成系缚，故令见念不起空无所有即定慧等
  - date: '0746'
    title_zh: 教持金刚经入一行三昧
    rationale: 不取于相如如即无念，无念即般若，能生一切法摄一切法，故劝受持读诵为人演说
