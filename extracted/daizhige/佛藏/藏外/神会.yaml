endeavors:
- id: guji-神会-endeavor-1
  title_zh: 曹溪承法弘南宗顿教
  summary: 少年问道曹溪亲承慧能无念为宗后以解脱禅门直了性普示学人
  phases:
  - key: brewing
    name: 襄阳问道持戒学禅
    labels:
      zh:
      - 求法持戒
    start_date: 0698
    highlight_event_id: guji-神会-event-birth
  - key: breakthrough
    name: 曹溪参礼悟无念宗
    labels:
      zh:
      - 顿悟传心
    start_date: '0704'
    highlight_event_id: guji-神会-event-caoxi
  - key: climax
    name: 南阳普说了性坛语
    labels:
      zh:
      - 直了成佛
    start_date: '0720'
    highlight_event_id: guji-神会-event-huatai
  - key: closure
    name: 荷泽付法续慧命
    labels:
      zh:
      - 付嘱流通
    start_date: '0750'
    highlight_event_id: guji-神会-event-death
  decisions:
  - date: '0704'
    title_zh: 不惮远行投曹溪参六祖
    rationale: 为求无上菩提直了佛性须亲近真正善知识得无住心印
  - date: '0720'
    title_zh: 立无念为宗普说顿教
    rationale: 为破住空住定法缚令学人离相无住即戒定慧一时齐等
- id: guji-神会-endeavor-2
  title_zh: 滑台定是非护国弘道
  summary: 滑台设无遮大会辨南北邪正定达摩南宗正统安史难中募财助军护法护国
  phases:
  - key: brewing
    name: 观南北分歧起护法心
    labels:
      zh:
      - 辨邪正
    start_date: 0728
    highlight_event_id: guji-神会-event-caoxi
  - key: breakthrough
    name: 滑台大云寺立宗旨
    labels:
      zh:
      - 定是非
    start_date: '0732'
    highlight_event_id: guji-神会-event-huatai
  - key: climax
    name: 洛阳聚众募缘助军
    labels:
      zh:
      - 护国济难
    start_date: '0756'
    highlight_event_id: guji-神会-event-junzi
  - key: closure
    name: 荷泽示寂正法重兴
    labels:
      zh:
      - 遗化不灭
    start_date: 0758
    highlight_event_id: guji-神会-event-death
  decisions:
  - date: '0732'
    title_zh: 滑台设无遮大会辩崇远
    rationale: 为天下学道者定宗旨辨是非明达摩六代相承南宗为正
  - date: '0756'
    title_zh: 应请聚财佐国平乱
    rationale: 以平等说法摄众济难令佛法不绝国难可平即是不尽有为
