  - title_zh: 面对六宗分灯与异见毁佛是渐化还是顿除
    description: 分宗立异王室毁法若急则激众若纵则蔓邪须以权衡渐破
  lesson: 以慧辨破执以渐化合异以护法报本方能续佛慧命
  summary_first_person: 我本香至国第三子初名菩提多那蒙般若多罗点化更名达摩禀受正法继师化导南天六十载循次辟破六宗之邪翳又遣弟子化导异见王使毁谤回心三宝复兴但愿法宝智光胜于世宝世光使如来正统不坠也
