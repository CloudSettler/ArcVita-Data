endeavors:
- id: guji-菩提达摩-endeavor-1
  title_zh: 南天辟六宗一统正法
  summary: 继般若多罗之后守南天弘化之命循次辩破有相无相定慧戒行无得寂静六宗使邪归正化被南天
  phases:
