  date: '0455'
  year_of: 455
  place_zh: 南印度香至国法堂
  description: 遇般若多罗以宝珠试三子独多那明法宝智光为上又对无相而契宗旨遂更名达摩嘱传如来正统
- id: guji-菩提达摩-event-master-parinirvana
  type: career
  title_zh: 多罗圆寂继志化本国
  date: '0457'
  year_of: 457
  place_zh: 南印度香至国
  description: 般若多罗放光现变白日升天达摩阇维建塔继其志提化本国遵未可远行之命守南天
- id: guji-菩提达摩-event-six-schools
  type: career
  title_zh: 循次辟破六宗归一
  date: '0470'
  year_of: 470
  place_zh: 南印度
  description: 佛大胜多沉小乘分立有相无相定慧戒行无得寂静六宗达摩微现神力往辩以实相三昧定慧戒行得得空空之旨使各宗开悟混而为一
- id: guji-菩提达摩-event-yijian-king
  type: career
  title_zh: 遣弟子化导异见王
  date: '0510'
  year_of: 510
  place_zh: 异见王宫殿前
  description: 异见王毁三宝焚经罢旧宗胜往辩屈于佛法何在达摩遣波罗提乘云而至以在胎为身在眼若见等偈示作用即性王悔悟咨询法要九旬不倦
- id: guji-菩提达摩-event-death
  type: death
  title_zh: 震旦弘化后圆寂
  date: '0536'
  year_of: 536
  place_zh: 中土北魏境
  description: 南天普度六十余载后遵师谶往震旦设大法药直指善根化众无数学毕圆寂传灯不绝
