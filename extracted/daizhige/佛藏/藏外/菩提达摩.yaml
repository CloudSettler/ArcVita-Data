    start_date: '0510'
    highlight_event_id: guji-菩提达摩-event-six-schools
  decisions:
  - date: '0460'
    title_zh: 决定循次渐辟不骤正六宗
    rationale: 合而壁之则势愈固骤而正之则言无渐故先服一宗以率余宗
  - date: '0470'
    title_zh: 决定以实相无相义会通定慧
    rationale: 有相无相已悟定慧戒行等若不收则佛道分裂故须穷其一二内外之谬
- id: guji-菩提达摩-endeavor-2
  title_zh: 化导异见王护持三宝
  summary: 异见王轻毁三宝罢黜旧臣达摩先遣宗胜试化不利再遣波罗提乘云赴阙以作用见性之旨感悟王心使改毁为敬
  phases:
  - key: brewing
    name: 见毁佛废旧而兴叹
    labels:
      zh:
      - 护法存诚
    start_date: '0505'
    highlight_event_id: guji-菩提达摩-event-six-schools
  - key: breakthrough
    name: 遣宗胜潜往说法人天
    labels:
      zh:
      - 初机试化
    start_date: 0508
    highlight_event_id: guji-菩提达摩-event-yijian-king
  - key: climax
    name: 遣波罗提乘云正邪问对
    labels:
      zh:
      - 作用见性
    start_date: '0510'
    highlight_event_id: guji-菩提达摩-event-yijian-king
  - key: closure
    name: 王悔悟咨询法要护教
    labels:
      zh:
      - 回邪归正
    start_date: '0515'
    highlight_event_id: guji-菩提达摩-event-yijian-king
  decisions:
  - date: 0508
    title_zh: 决定先遣宗胜后遣波罗提
    rationale: 宗胜与王宿缘浅而道力未全波罗提与王有缘且已证果可救义堕
  - date: '0510'
    title_zh: 决定以见性作用直指王心
    rationale: 王执有为功业不见妙理故不滞有无但于眼耳鼻口手足作用处指示佛性
