    labels:
      zh:
      - 守命潜修
    start_date: '0457'
    highlight_event_id: guji-菩提达摩-event-master-parinirvana
  - key: breakthrough
    name: 初破有相无相二宗
    labels:
      zh:
      - 慧辨破执
    start_date: '0460'
    highlight_event_id: guji-菩提达摩-event-six-schools
  - key: climax
    name: 再破定慧戒行无得寂静
    labels:
      zh:
      - 循次袪邪
    start_date: '0470'
    highlight_event_id: guji-菩提达摩-event-six-schools
  - key: closure
    name: 六宗归一普度南天
    labels:
      zh:
