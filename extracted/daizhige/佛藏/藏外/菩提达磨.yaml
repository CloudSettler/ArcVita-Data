    highlight_event_id: guji-菩提达磨-event-death
  decisions:
  - date: 0525-01-01
    title_zh: 以安心付二祖传衣偈
    rationale: 内心无喘可入道以一花五叶预五家宏传
  - date: 0528-12-01
    title_zh: 知缘尽示寂不避毒害
    rationale: 缘尽则归以死显法空棺只履破生死见
events:
- id: guji-菩提达磨-event-birth
  title_zh: 诞生南印度香至王家辨珠得名
  date: 0480-01-01
  year_of: 480
  place: 南印度
  description: 香至王第三子本名菩提多罗以法宝智光心明之辩得般若多罗改号菩提达磨后出家降伏六宗救波罗提正异见王邪执
- id: guji-菩提达磨-event-liangwu
  title_zh: 金陵见梁武帝答廓然无圣
  date: 0520-01-01
  year_of: 520
  place: 金陵
  description: 初至见梁武帝问圣谛第一义答廓然无圣问对朕者谁答不识帝不契遂渡江北行
- id: guji-菩提达磨-event-shaolin
  title_zh: 少林面壁九年
  date: 0521-01-01
  year_of: 521
  place: 少林
  description: 折芦渡江至少林面壁九年诲众外息诸缘内心无喘心如墙壁可以入道
- id: guji-菩提达磨-event-fufa
  title_zh: 付法慧可分皮肉骨髓
  date: 0528-01-01
  year_of: 528
  place: 少林
  description: 命门人各言所得道副得皮总持得肉道育得骨慧可得髓遂付衣法与偈一花开五叶结果自然成
- id: guji-菩提达磨-event-death
  title_zh: 示寂葬熊耳只履西归
  date: 0528-12-01
  year_of: 528
  place: 熊耳山
  description: 六度遇毒知缘已尽而寂葬熊耳后宋云使西域遇于葱岭携只履而归发圹唯空棺只履存
