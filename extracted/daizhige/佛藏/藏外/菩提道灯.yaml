  decisions:
  - date: 1044-01-01
    title_zh: 以止为通因勤修定资粮
    rationale: 未成止者千载不生定神通不具难利有情故先安住善所缘
  - date: 1045-01-01
    title_zh: 般若不离方便
    rationale: 单空成缚单施亦缚唯悲智双运速证菩提故说施等为方便
  - date: 1050-01-01
    title_zh: 梵行者不受密慧灌顶
    rationale: 恐失坏律仪犯他胜堕恶趣但许听续护摩承事师长求师灌顶
