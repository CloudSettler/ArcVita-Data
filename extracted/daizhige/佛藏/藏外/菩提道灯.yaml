    title_zh: 以三士摄一切机
    rationale: 下求自利中求寂灭上求利他次第接引不紊根器
  - date: 1042-06-01
    title_zh: 以愿行心统菩提心
    rationale: 先发愿心数数增长再受行心律仪令福智资粮圆满
- id: guji-菩提道灯-endeavor-2
  title_zh: 持梵行弘显密圆融示止观神通双运
  description: 以别解脱梵行为基受菩萨律修止发通以般若断障以方便集福遮止犯律而修密令显密不相违
