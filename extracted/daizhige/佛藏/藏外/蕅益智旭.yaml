person:
  qid: guji-蕅益智旭
  name_zh: 蕅益智旭
  names:
    zh: 蕅益智旭
    en: Ouyi Zhixu
  lifespan:
    birth:
      date: 1599-06-15
      precision: day
      is_circa: true
      raw: 万历二十七年己亥五月初三亥时
    death:
      date: 1655-02-27
      precision: day
      is_circa: true
      raw: 清顺治十二年乙未正月示寂
  birth_date: 1599-06-15
  death_date: 1655-02-27
  era: 明末清初
  reign_ref: 明万历至清顺治
  archetype: 弘法宗师
  dilemmas:
  - 禅律教儒门庭各执中如何会归一源而不堕杂执迹
  - 自惭三业未净而志在重兴戒法当如何自处
  - 求五比丘如法共住决不可得时是坚守旧愿还是转求西方再来拔济
  lesson: 全性起修全修在性，悲智双运解行互融，不自立宗而纵横变化，一归堂堂正正
  summary_first_person: 我是八不道人，俗姓钟名际明字振之，先世汴梁后居古吴木渎，少时辟佛后取辟佛论焚之，二十岁悟孔颜心法，闻地藏本愿发出世心，从雪岭剃度名智旭，径山大悟知此身当处出生随处灭尽，彻见近世禅病在无正知见不重戒律，遂以戒教匡救，究心台部而不为台家子孙，晚年一意西驰，愿乘本愿轮再来拔济，随时著述讲演与有缘下圆顿种
  source_urls:
  - https://daizhige.org/佛藏/藏外/灵峰蕅益大师宗论.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/藏外/灵峰蕅益大师宗论.md
