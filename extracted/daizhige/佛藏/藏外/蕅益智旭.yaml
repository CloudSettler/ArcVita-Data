    title_zh: 更科易文会入己意
    rationale: 旧疏经疏各行致句读割裂，章安古朴荆溪精深皆难逗初心，故稍更科文以随文演义
  - date: 1649-11-05
    title_zh: 立因缘约教本迹观心四释
    rationale: 因缘显感应大事，本迹显久成行本，约教简偏小，观心令句句入心成观而不数他宝
