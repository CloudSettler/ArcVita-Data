      - 出家
    start_date: 1615-01-01
    highlight_event_id: guji-蕅益智旭-event-chujia
  - key: breakthrough
    name: 径山逼拶身心消殒
    labels:
      zh:
      - 径山大悟
    start_date: 1623-06-01
    highlight_event_id: guji-蕅益智旭-event-jingshan
  - key: climax
    name: 遍阅律藏究心台部
    labels:
      zh:
      - 宏律
      - 会通
    start_date: 1625-01-01
    highlight_event_id: guji-蕅益智旭-event-fanwang
  - key: closure
    name: 抹倒禅字力匡末流
    labels:
      zh:
      - 匡禅
      - 重戒
    start_date: 1630-01-01
    highlight_event_id: guji-蕅益智旭-event-fanwang
  decisions:
  - date: 1622-01-01
    title_zh: 尽焚窗稿决意出家体究大事
    rationale: 功夫不能成片昏散最重，唯体究大事方能了生死，故从雪岭剃度
  - date: 1626-01-01
    title_zh: 拈阄得台宗而不为台家子孙
    rationale: 近世台禅贤首慈恩各执门庭不能和合，故究心台部而志在和会，不立门户
- id: guji-蕅益智旭-endeavor-2
  title_zh: 一意西驰著述下圆顿种
  goal: 求生净土乘愿再来，以著述讲演普下圆顿种
  phases:
  - key: brewing
    name: 松陵掩关求生净土
    labels:
      zh:
      - 念佛
      - 西归
    start_date: 1628-01-01
    highlight_event_id: guji-蕅益智旭-event-qiusheng
  - key: breakthrough
    name: 龙居述律灵峰过冬
    labels:
      zh:
      - 述律
      - 灵峰
    start_date: 1629-01-01
    highlight_event_id: guji-蕅益智旭-event-qiusheng
  - key: climax
    name: 温陵漳州湖州诸述作
    labels:
      zh:
      - 注疏
      - 讲演
    start_date: 1639-01-01
    highlight_event_id: guji-蕅益智旭-event-fanwang
  - key: closure
    name: 返灵峰述法华阅藏知津
    labels:
      zh:
      - 法华会义
      - 阅藏知津
      - 净土十要
    start_date: 1649-01-01
    highlight_event_id: guji-蕅益智旭-event-lingfeng
  decisions:
  - date: 1628-06-01
    title_zh: 以参禅功夫求生净土
    rationale: 关中大病深知生死无常，参禅虽悟解发非圣证，故回向西方以保不退
  - date: 1635-01-01
    title_zh: 决不可得五比丘共住遂一意西驰
    rationale: 本愿求五比丘如法共住令正法重兴，久求不得，遂冀乘本愿轮仗佛力再来拔济，聊与有缘下圆顿种
events:
- id: guji-蕅益智旭-event-birth
  date: 1599-06-15
  year_of: 1599
  title_zh: 生于古吴木渎
  description: 万历二十七年己亥五月初三亥时，母金氏梦大士送子而生，俗姓钟名际明
- id: guji-蕅益智旭-event-chujia
  date: 1622-01-01
  year_of: 1622
  title_zh: 从雪岭剃度名智旭
  description: 二十四岁决意出家体究大事，从雪岭师剃度，雪师为憨山门人
- id: guji-蕅益智旭-event-jingshan
  date: 1623-07-01
  year_of: 1623
  title_zh: 径山大悟性相一齐透彻
  description: 往径山坐禅，次年夏逼拶功极身心世界忽皆消殒，知此身当处出生随处灭尽，性相二宗一齐透彻
- id: guji-蕅益智旭-event-qiusheng
  date: 1628-03-01
  year_of: 1628
  title_zh: 松陵掩关求生净土述毗尼集要
  description: 葬母毕焚弃笔砚，掩关于松陵，关中大病以参禅功夫求生净土，出关后住龙居述毗尼事义集要
- id: guji-蕅益智旭-event-fanwang
  date: 1638-01-01
  year_of: 1638
  title_zh: 住九华述梵网合注
  description: 三十二岁拈阄宗天台，三十八岁住九华，次年述梵网合注，后住温陵漳州述大佛顶玄义金刚破空论等
- id: guji-蕅益智旭-event-lingfeng
  date: 1649-12-01
  year_of: 1649
  title_zh: 返灵峰述法华会义重治律要
  description: 五十一岁冬返灵峰述法华会义，次年述占察疏重治律要，五十四岁草楞伽义疏，晚年成阅藏知津法海观澜净土十要
- id: guji-蕅益智旭-event-death
  date: 1655-02-27
  year_of: 1655
  title_zh: 示寂于灵峰
  description: 甲午还灵峰卧病，乙未正月示寂，遗诫勿乞言徒增诳误，门人成时辑七稿为灵峰宗论十大卷
