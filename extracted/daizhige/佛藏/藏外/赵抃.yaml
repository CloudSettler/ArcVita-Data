endeavors:
- id: guji-赵抃-endeavor-1
  title_zh: 牧青州闻雷悟道
  description: 以天钵元为师咨决心法，牧青州因雷有省作偈，并以书与富弼发明教外别传之旨
  phases:
  - key: brewing
    name: 以元禅师为方外友
    labels:
      zh: 咨决心法
    start_date: 1055-01-01
    highlight_event_id: guji-赵抃-event-qingzhou
  - key: breakthrough
    name: 青州闻雷有省
    labels:
      zh: 霹雳透顶门
    start_date: 1060-01-01
    highlight_event_id: guji-赵抃-event-qingzhou
  - key: climax
    name: 作偈答富郑公
    labels:
      zh: 明心见性
    start_date: 1061-01-01
    highlight_event_id: guji-赵抃-event-fubi
  - key: closure
    name: 付传灯发明宗旨
    labels:
      zh: 属累不孤
    start_date: 1062-01-01
    highlight_event_id: guji-赵抃-event-fubi
  decisions:
  - date: 1055-01-01
    title_zh: 奉天钵元为方外友
    rationale: 藉宗师提携以决生死大事，不滞文字方便
  - date: 1061-01-01
    title_zh: 以所证形于尺素寄富弼
    rationale: 同事摄化使富贵中人亦留意如来大事因缘
- id: guji-赵抃-endeavor-2
  title_zh: 退归三衢高斋善终
  description: 元丰以太子少保归衢州，与里民不间位貌，自号高斋老人并预志寿茔以示法身
  phases:
  - key: brewing
    name: 致政归三衢
    labels:
      zh: 腰佩黄金已退藏
    start_date: 1080-01-01
    highlight_event_id: guji-赵抃-event-gaozhai
  - key: breakthrough
    name: 名居为高斋作偈见意
    labels:
      zh: 只是柯村赵四郎
    start_date: 1080-06-01
    highlight_event_id: guji-赵抃-event-gaozhai
  - key: climax
    name: 预志寿茔漏家风
    labels:
      zh: 真法身不即不离
    start_date: 1082-01-01
    highlight_event_id: guji-赵抃-event-gaozhai
  - key: closure
    name: 善始令终契佛祖
    labels:
      zh: 不出户庭
    start_date: 1084-01-01
    highlight_event_id: guji-赵抃-event-death
  decisions:
  - date: 1080-01-01
    title_zh: 归老三衢不间位貌
    rationale: 身退名遂以闲淡养道，示居士入道轨范
  - date: 1082-01-01
    title_zh: 自志寿茔明法身义
    rationale: 以寿茔之说破生死之执，使后人见悲智充满大千
events:
- id: guji-赵抃-event-birth
  title_zh: 生于衢州
  date: 1008-01-01
  year_of: 1008
  description: 宋咸平元年生于衢州，后登第历仕终至少保，谥清献
- id: guji-赵抃-event-qingzhou
  title_zh: 牧青州闻雷有省作偈
  date: 1060-01-01
  year_of: 1060
  description: 退食公堂闻雷透顶门，作偈言刹刹尘尘无不是以明本性无欠无余
- id: guji-赵抃-event-fubi
  title_zh: 答富郑公书论禅旨
  date: 1061-01-01
  year_of: 1061
  description: 以节本传灯相赠，论教外别传棒喝方便，贺富弼于真性有所悟入
- id: guji-赵抃-event-gaozhai
  title_zh: 归三衢居高斋志寿茔
  date: 1080-01-01
  year_of: 1080
  description: 元丰以太子少保归三衢，名居高斋作偈自称柯村赵四郎，并志寿茔明法身充满大千
- id: guji-赵抃-event-death
  title_zh: 寿七十二终
  date: 1084-01-01
  year_of: 1084
  description: 年七十二善始令终，不出户庭而心契佛祖，贤于远祸从赤松之游者
