    rationale: 见性一转三千卷武帝执有为功德不识无字经不强留恐折其福
  - date: 0528
    title_zh: 含齿血忍辱化阎君再点神光
    rationale: 神光讲经四十九年未了生死须以死惧激其低心求真传不弃有缘
events:
- id: guji-达摩-event-birth
  date: '0470'
  year_of: 470
  title_zh: 南印度降生为香枝国三太子
  description: 西城南印度香枝国王三太子不恋王位看破荣华出家修证
- id: guji-达摩-event-xitian
  date: '0510'
  year_of: 510
  title_zh: 承般若多罗付嘱为西天二十八祖
  description: 承释迦一脉世世相续作东林初代道统之尊得心印大觉金禅
- id: guji-达摩-event-duliangwu
  date: '0527'
  year_of: 527
  title_zh: 金銮殿度梁武帝不契被逐
  description: 落梁武帝殿答九世为人十世足等八句讲无字真经历四十八卷莲台不言说法被玉棍逐出叹无缘预言饿死台城
- id: guji-达摩-event-dushenguang
  date: 0528
  year_of: 528
  title_zh: 王舍城度神光被打落门牙
  description: 指神光纸上佛法不能了生死说须弥为笔难写一字神光怒以铁素珠打落二齿含血西去度胭脂留芒鞋偈化尸而去
- id: guji-达摩-event-guojiang
  date: 0529
  year_of: 529
  title_zh: 化十殿阎君醒神光踏芦过江居熊耳
  description: 取数珠化阎君钩魂惊醒神光踏倒莲台追悔掘墓唯见单只芒鞋追至江边化渔翁渡之熊耳山面壁待其参驾
- id: guji-达摩-event-death
  date: '0536'
  year_of: 536
  title_zh: 熊耳山示寂
  description: 培体养牙传灯神光后示寂东土初祖道统有续留一花五叶收圆定凭
