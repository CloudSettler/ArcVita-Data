    title_zh: 以浅近易行之四十二章先化汉俗
    rationale: 中土初闻佛法，宜以断欲去爱十善四果为先，使人易解易行
  - date: 0070-01-01
    title_zh: 坚持离欲寂静沙门本制
    rationale: 恐汉俗以爱欲乱道，故力倡识心达本常行净戒以正其本
