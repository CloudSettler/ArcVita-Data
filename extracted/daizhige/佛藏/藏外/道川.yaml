    title_zh: 决定以禅颂解经不作义疏
    rationale: 恐学者滞于名言故以颂截断众流令见月忘指直契无相
  - date: 1120-06-01
    title_zh: 决定逐句拈提兼破四果执
    rationale: 须陀洹至阿罗汉皆无所得若存得果之念即著我人故须痛下钳锤
