- id: guji-道川-event-verse
  title_zh: 作金刚般若波罗蜜经颂
  date: 1120-01-01
  year_of: 1120
  summary_zh: 依金刚经从法会因由至流通分逐段作颂以如是水波镜月等喻明实相即非相
- id: guji-道川-event-teach
  title_zh: 开堂弘禅广接四众
  date: 1125-01-01
  year_of: 1125
  summary_zh: 住持禅林以无住生心接引学者劝离我相法相非法相荷担大乘
- id: guji-道川-event-death
  title_zh: 示寂
  date: 1135-01-01
  year_of: 1135
  summary_zh: 晚年付嘱而逝颂本流通于世为藏外禅解金刚之要籍
