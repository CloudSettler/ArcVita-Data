  decisions:
  - date: 1118-04-01
    title_zh: 决定以日用事接引不尚玄妙
    rationale: 佛法即在乞食洗足敷座而坐之间若离日用别觅玄妙即是住相
  - date: 1125-09-01
    title_zh: 决定呵斥住法布施明福德无性
    rationale: 住相布施如人入暗故须令舍东西南北虚空之量直入无住福德
events:
