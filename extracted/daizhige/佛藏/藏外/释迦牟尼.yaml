    title_zh: 夜逾王城往檀特山修道
    rationale: 见老病死终可厌离净居天人告出家时至即舍王位而去
  - date: -1007-01-01
    title_zh: 舍不用处定与非非想定及六年麻麦苦行
    rationale: 知非便舍以无心意无受行摧伏诸外道方能至菩提
- id: guji-释迦牟尼-endeavor-2
  title_zh: 转法轮付法眼与双树涅槃
