    title_zh: 鹿野苑中为憍陈如等五人说法
    rationale: 成道已当先度宿缘转四谛法轮令证道果开化人天
  - date: -0950-02-10
    title_zh: 以清净法眼涅槃妙心付迦叶并传金缕僧伽梨衣
    rationale: 咐嘱副贰传化无令断绝待慈氏佛出世续补处之传
