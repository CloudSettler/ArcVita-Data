  name_zh: 释迦牟尼
  names:
    zh: 释迦牟尼佛
    en: Shakyamuni Buddha
  lifespan:
    birth:
      date: -1028-04-08
      precision: day
      is_circa: true
      raw: 周昭王二十四年甲寅岁四月八日
    death:
      date: -0950-02-15
      precision: day
      is_circa: true
      raw: 穆王五十二年壬申岁二月十五日
  birth_date: -1028-04-08
  death_date: -0950-02-15
  era: 西周昭王至穆王
  reign_ref: 周昭王二十四年至周穆王五十二年
  archetype: 开教觉者
  dilemmas:
  - 王宫安乐与老病死苦逼迫之间当如何取舍
  - 外道苦行与不用处定非非想定皆非究竟当何处求菩提
  - 四十九年说法未曾说一字与普度群生之间如何持正法眼藏不断绝
  lesson: 见老病死而厌离，历试邪法而摧伏，以无心意证菩提，以拈花付法续慧命。
  summary_first_person: 吾生于刹利王家，见四门老病死而悲喜交集，逾城出家，历阿蓝迦蓝郁头蓝弗及六年苦行皆舍，明星出时成道，鹿野苑转四谛法轮，住世说法四十九年，以清净法眼涅槃妙心付摩诃迦叶，熙连河侧双树下宴寂。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/佛藏/藏外/五灯会元.md
  - https://daizhige.org/佛藏/藏外/五灯会元.html
  - https://zh.wikisource.org/wiki/五燈會元
