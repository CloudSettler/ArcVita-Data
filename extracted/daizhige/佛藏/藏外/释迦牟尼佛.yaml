events:
- id: guji-释迦牟尼佛-event-birth
  title_zh: 毗羅苑右脅誕生
  date: -1028-04-08
  year_of: -1028
  location_zh: 迦毗羅衛毗羅苑婆羅樹下
  description_zh: 摩耶夫人攀婆羅樹花生太子身真金色行七步稱天上天下唯我獨尊九龍吐水沐浴
- id: guji-释迦牟尼佛-event-renunciation
  title_zh: 夜半逾城出家
  date: -1010-02-08
  year_of: -1010
  location_zh: 迦毗羅城西北至摩竭陀斑荼山
  description_zh: 年十九命車匿引健陟四神捧足逾城剃鬢脫冠服付車匿還宮學定於阿藍迦藍郁頭藍弗處
- id: guji-释迦牟尼佛-event-enlightenment
  title_zh: 金剛座睹明星成道
  date: -0998-02-08
  year_of: -998
  location_zh: 摩竭提國金剛座正覺山下
  description_zh: 受牧女乳糜得吉安淨草敷座發弘願明星出時大悟號釋迦如來時當周穆王三年
- id: guji-释迦牟尼佛-event-teaching
  title_zh: 示眾說出家沙門之道
  date: -0997-01-01
  year_of: -997
  location_zh: 正覺山會下
  description_zh: 示斷欲去愛識自心源達佛本理答比丘何為清淨本性外道不問有言無言良久而得入
- id: guji-释迦牟尼佛-event-death
  title_zh: 涅槃示滅
  date: -0948-02-15
  year_of: -948
  location_zh: 拘尸那
  description_zh: 化緣既畢以八十歲示入涅槃傳金縷袈裟囑迦葉持衣為信
