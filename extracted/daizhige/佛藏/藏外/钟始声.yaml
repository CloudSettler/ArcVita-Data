endeavors:
- id: guji-钟始声-endeavor-1
  title_zh: 撰天学初征列二十二不通
  summary_zh: 因客示圣像略说，披读即诟其不通，以天主形质居所赎罪拜祭等立二十二征
  phases:
  - key: brewing
    name: 震泽读易客扣庐论天教
    labels:
      zh: 震泽遇客
    start_date: 1642-01-01
    highlight_event_id: guji-钟始声-event-meike
  - key: breakthrough
    name: 披圣像略说立征
    labels:
      zh: 初征二十二条
    start_date: 1643-06-01
    highlight_event_id: guji-钟始声-event-chuzheng
  - key: climax
    name: 斥阳辟佛阴窃伪尊儒实坏
    labels:
      zh: 斥妖胡卫道
    start_date: 1643-07-01
    highlight_event_id: guji-钟始声-event-chuzheng
  decisions:
  - date: 1643-06-01
    title_zh: 以彼说攻彼说列不通
    rationale: 天主若有形谁生之依何住，若无形即是太极不应有爱恶福罚，故据儒理穷其体用
  - date: 1643-07-01
    title_zh: 断逐人毁书禁像
    rationale: 既证其窃佛坏儒为中国之贼，须明禁以闲孔孟之道
- id: guji-钟始声-endeavor-2
  title_zh: 撰天学再征复征西来意
  summary_zh: 客笑其卤莽未深究，取西来意三山论学记圣教约言细读，复逐条再征
  phases:
  - key: brewing
    name: 取西书细读深究
    labels:
      zh: 再阅西来意
    start_date: 1643-07-15
    highlight_event_id: guji-钟始声-event-zaizheng
  - key: breakthrough
    name: 三天三魂太极本原之辨
    labels:
      zh: 明继天立极真脉
    start_date: 1643-08-01
    highlight_event_id: guji-钟始声-event-zaizheng
  - key: closure
    name: 致际明禅师以求正
    labels:
      zh: 致书际明
    start_date: 1643-09-01
    highlight_event_id: guji-钟始声-event-zhishuming
  decisions:
  - date: 1643-08-01
    title_zh: 分苍苍上帝本性三天以破生世之谬
    rationale: 上帝但治世非生世，本性灵明无造作赏罚，方显裁成辅相归于人
  - date: 1643-09-01
    title_zh: 以初再征致际明禅师
    rationale: 释子不必忿辩而居士纲维世道则宜辟，故求正于禅门以广流通
events:
- id: guji-钟始声-event-birth
  title_zh: 生于金阊
  date: 1600-01-01
  year_of: 1600
  place_zh: 苏州金阊
  summary_zh: 年十二三即以千古学脉为己任，辟释老闲圣道，足不窥户外
- id: guji-钟始声-event-meike
  title_zh: 震泽读易客以天学相示
  date: 1642-03-01
  year_of: 1642
  place_zh: 震泽之滨
  summary_zh: 客出圣像略说，言大西人辟佛尊儒，劝共讨究，披读甫竟即诟为妖胡
- id: guji-钟始声-event-chuzheng
  title_zh: 作天学初征
  date: 1643-06-01
  year_of: 1643
  place_zh: 震泽
  summary_zh: 就天主形质居所造善恶赎罪拜祭轮回等立二十二不通，断为阳排佛阴窃伪尊儒实坏
- id: guji-钟始声-event-zaizheng
  title_zh: 作天学再征
  date: 1643-08-01
  year_of: 1643
  place_zh: 震泽
  summary_zh: 复征舟舵工匠一家一君太极理气三魂赋性等说，明物物各具太极继天立极之旨
- id: guji-钟始声-event-zhishuming
  title_zh: 以初再征致际明禅师
  date: 1643-09-01
  year_of: 1643
  summary_zh: 钟振之惧邪风益炽著征致际明，禅师以不辩辩之，梦士评而杲庵序付梓
- id: guji-钟始声-event-death
  title_zh: 卒于清初
  date: 1650-01-01
  year_of: 1650
  summary_zh: 明亡后逸史终老，初再征附辟邪集而传
