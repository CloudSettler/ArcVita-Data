  archetype: 卫道居士
  dilemmas:
  - 以儒卫道与借佛理为儒辩之分际
  - 面对西教能辩之徒当辩与不辩之抉择
  lesson: 据本具太极之理以烛他说体用本末之谬，卫孔孟以助明佛法
  summary_first_person: 吾年十二三即以学脉为任，读易震泽，客以天学见示，吾见其阳排佛阴窃秕糠伪尊儒实乱道脉，乃列二十二不通初征之，再取西来意细读而再征之，逐其人毁其书以庶不为中国之贼
