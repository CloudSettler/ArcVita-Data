  - date: '1042'
    title_zh: 受藏王请整理藏地教务
    rationale: 藏地显密衰微需总摄纲宗之教授故不辞远涉而前往化导
  - date: '1044'
    title_zh: 造菩提道炬论会通三士道
    rationale: 为令具堪能者易入深广道故以略法总摄一切佛语皆为教授而不相违
events:
- id: guji-阿底峡-event-birth
  title_zh: 诞生于东方惹火地次第聚落
  date: 0982
  year_of: 982
  place_zh: 东方惹火地次第聚落金幢王宫
  summary: 国王善德王妃吉祥光所生三王子中之吉祥藏，后称精进月比丘
- id: guji-阿底峡-event-study
  title_zh: 少年精通四明辩伏外道
  date: 0997
  year_of: 997
  place_zh: 黑山道场
  summary: 十五岁听正理滴论折服外道，二十一岁内声明因明工巧医药极精通，亲罗侯罗古达受大灌顶名智密金刚
- id: guji-阿底峡-event-ordination
  title_zh: 投戒铠大德出家遍学显教
  date: '1011'
  year_of: 1011
  place_zh: 啊登打补日
  summary: 三十一岁内依止法铠论师研究大毗婆沙十二年，于根本四部取舍了然，具别解脱菩萨金刚乘三戒
- id: guji-阿底峡-event-india
  title_zh: 金刚座三次制外道兴正法
  date: '1025'
  year_of: 1025
  place_zh: 金刚座大菩提寺
  summary: 三次制诸外道令受佛教，洗除内宗邪解疑惑，各派视同顶髻，具五明三因造论
- id: guji-阿底峡-event-tibet
  title_zh: 应藏王菩提光请入藏弘法
  date: '1042'
  year_of: 1042
  place_zh: 藏卫
  summary: 多次迎请未允，至菩提光秉政蒙允降临，前后游住将二十年教化无算
- id: guji-阿底峡-event-torch
  title_zh: 著菩提道炬论总摄显密
  date: '1044'
  year_of: 1044
  place_zh: 藏地
  summary: 依众劝请整理教务著道炬论等，总摄一切显密心要，为后世道次第根本
- id: guji-阿底峡-event-disciple
  title_zh: 摄受种敦杰绍承事业
  date: '1052'
  year_of: 1052
  place_zh: 藏地
  summary: 藏中弟子以种敦杰为上首，能绍承增广师之事业，印度则有比朵巴法生慧等
- id: guji-阿底峡-event-death
  title_zh: 住藏二十年后圆寂
  date: '1054'
  year_of: 1054
  place_zh: 藏卫
  summary: 游化藏卫将二十年，具根器者皆蒙利益后示寂，传承由种敦杰继持
