  - date: '1011'
    title_zh: 依戒铠大德出家受具
    rationale: 梦寐师长本尊劝请出家方能于佛法众生作大饶益故舍密咒慢心而剃染
  - date: '1025'
    title_zh: 住持菩提寺洗除邪解
    rationale: 内宗上下未达邪解疑惑垢染正法故不分部类平等整兴令生爱敬
