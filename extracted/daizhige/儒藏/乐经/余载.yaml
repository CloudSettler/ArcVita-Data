    en: Yu Zai
  lifespan:
    birth:
      date: 1282
      precision: year
      is_circa: true
      raw: 约生于至元年间，天历间自称年四十七推算
    death:
      date: 1345
      precision: year
      is_circa: true
      raw: 卒年无考，元末前卒佚
  birth_date: 1282
  death_date: 1345
  era: 元
  reign_ref: 元文宗天历
  archetype: 嘉遁儒者
  dilemmas:
  - 位卑言高，欲以韶舞补遗裨圣朝制作，惧僭逾之罪
  - 养亲辞官与出仕立功之间，甘嘉遁授徒以全笃行
  - 古乐无传而欲以图书律吕义起新制，恐附会牵合难合于古
  lesson: 以养亲辞官而专精礼乐，知其小谋大而仍尽畎亩忠忱
  summary_first_person: 余三山布衣，前为福州路儒学录，以养亲辞官，授徒自守。穷二纪之功考韶之意音教文，谐律吕被金石，制九德之歌音义图与九磬缀兆采章舞图，冀备皇元一代制作，存古义于万一。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E9%9F%B6%E8%88%9E%E4%B9%9D%E6%88%90%E4%B9%90%E8%A1%A5.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E9%9F%B6%E8%88%9E%E4%B9%9D%E6%88%90%E4%B9%90%E8%A1%A5.html
endeavors:
- id: guji-余载-endeavor-1
  title_zh: 研订韶舞撰九成乐补
  summary_zh: 以二纪之功考虞书舜典益稷，定六律六吕分用五声五言相配之说，制九德歌音义图及九防舞缀兆采章图，进呈朝廷以备韶舞制作
  phases:
  - key: brewing
    name: 剔经搜史沉潜韶义
    labels:
      zh: 穷经
    start_date: 1310
    highlight_event_id: guji-余载-event-office
  - key: breakthrough
    name: 悟得韶之要领定律吕
    labels:
      zh: 悟要
    start_date: 1326
    highlight_event_id: guji-余载-event-book
  - key: climax
    name: 制图审数谐律被乐
    labels:
      zh: 制图
    start_date: 1328
    highlight_event_id: guji-余载-event-book
  - key: closure
    name: 作原序贡呈天朝
    labels:
      zh: 进书
    start_date: 1329
    highlight_event_id: guji-余载-event-book
  decisions:
  - date: 1328
    title_zh: 以六律六吕分用定韶制
    rationale: 据舜典欲闻六律及周官郑注阳声阴声之说，断韶当阳用六律阴用六吕，以别于大武三律三吕并用
  - date: 1329
    title_zh: 以平浊平清配宫商进呈
    rationale: 据中原音韵阴阳平之说，改韵书平上下为平浊平清，以配宫商角徵羽，考图籍订度数后敢贡诸天府
- id: guji-余载-endeavor-2
  title_zh: 辞官养亲授徒嘉遁
  summary_zh: 为福州路儒学录，以养亲辞官不仕，笃行授徒，门人新安朱模为进乐通韶舞补略，自甘嘉遁以终
  phases:
  - key: brewing
    name: 出为福州路儒学录
    labels:
      zh: 出仕
    start_date: 1318
    highlight_event_id: guji-余载-event-office
  - key: breakthrough
    name: 以养亲辞官归养
    labels:
      zh: 辞官
    start_date: 1322
    highlight_event_id: guji-余载-event-office
  - key: climax
    name: 笃行授徒嘉遁三山
    labels:
      zh: 授徒
    start_date: 1325
    highlight_event_id: guji-余载-event-teach
  - key: closure
    name: 门人传乐补遗绪
    labels:
      zh: 传业
    start_date: 1330
    highlight_event_id: guji-余载-event-teach
  decisions:
  - date: 1322
    title_zh: 以养亲辞去儒学录
    rationale: 字大车，欲全孝养不以官禄易环堵之安，甘守布衣以承煦育之恩
  - date: 1325
    title_zh: 杜门授徒不复求仕
    rationale: 明王未用空言无施，不如服膺先正坦明详委，以教学存孔子之道待圣明采择
events:
- id: guji-余载-event-birth
  type: birth
  title_zh: 生于三山遐左
  date: 1282
  year_of: 1282
  is_circa: true
  place_zh: 三山
  summary_zh: 生长遐左，戴皇元天地风雨之赐，至天历间自称年四十七
- id: guji-余载-event-office
  type: career
  title_zh: 任前福州路儒学录后辞官
  date: 1322
  year_of: 1322
  is_circa: true
  place_zh: 福州路
  summary_zh: 曾为福州路儒学录，以养亲辞官，自称三山布衣
- id: guji-余载-event-book
  type: career
  title_zh: 撰成韶舞九成乐补并作原序
  date: 1329
  year_of: 1329
  is_circa: true
  place_zh: 三山
  summary_zh: 天历中撰成一卷，首九德歌音图义图，次九磬缀兆采章舞图，作三薰九沐原序贡呈，论夏时殷辂周冕已备而韶舞当作
- id: guji-余载-event-teach
  type: career
  title_zh: 授徒嘉遁门人进乐通
  date: 1330
  year_of: 1330
  is_circa: true
  place_zh: 三山
  summary_zh: 笃行授徒自甘嘉遁，门人新安朱模进乐通韶舞补略，可知为文宗天历中人字大车
- id: guji-余载-event-death
  type: death
  title_zh: 卒佚世无确载
  date: 1345
  year_of: 1345
  is_circa: true
  place_zh: 三山
  summary_zh: 始末无考，惟据进书原序及朱模序知其事，四库提要称传本仅见永乐大典
