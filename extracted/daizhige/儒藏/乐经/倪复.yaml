  name_zh: 倪复
  names:
    zh: 倪复
    en: Ni Fu
  lifespan:
    birth:
      date: '1485'
      precision: year
      is_circa: true
      raw: 约明成化末弘治初生于宁波
    death:
      date: '1550'
      precision: year
      is_circa: true
      raw: 约明世宗嘉靖中后期卒
  birth_date: '1485'
  death_date: '1550'
  era: 明
  reign_ref: 明世宗嘉靖
  archetype: 守古训而勤于考据的礼乐学者
  dilemmas:
  - 守汉志蔡氏古训与辨正百家得失之间如何求合声气之元
  - 从朱子旋相为宫之说与从蔡元定二变不为调之间如何取舍
  lesson: 体元守正参互详审勤于律数方能厘千古之谬以复古乐
  summary_first_person: 吾名复字汝新宁波人也好古乐本之仪礼经传参之西山蔡氏之说历考古今制度辨正百家得失著钟律通考二十七章以求合乎声律之元虽间有好奇穿凿漏略之失然于朱蔡异同黄钟本原度量权衡之法参互详审颇为不苟亦可谓勤于此事者矣
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E9%92%9F%E5%BE%8B%E9%80%9A%E8%80%83.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E9%92%9F%E5%BE%8B%E9%80%9A%E8%80%83.md
endeavors:
- id: guji-倪复-endeavor-1
  title_zh: 本仪礼参蔡学撰钟律通考
  summary_zh: 本之仪礼经传参之西山蔡氏之说历考古今制度辨正百家得失撰成钟律通考六卷二十七章始于黄钟本原终于风雅诗图谱以求合声气之元
  phases:
  - key: brewing
    name: 好古穷经酝酿通考
    labels:
      zh:
      - 好古
      - 穷经
    start_date: '1520'
    highlight_event_id: guji-倪复-event-birth
  - key: breakthrough
    name: 参定黄钟寸分突破
    labels:
      zh:
      - 黄钟九寸
      - 围九分
    start_date: '1524'
    highlight_event_id: guji-倪复-event-chengshu
  - key: climax
    name: 嘉靖丙戌秋书成
    labels:
      zh:
      - 通考成书
      - 二十七章
    start_date: '1526-07-01'
    highlight_event_id: guji-倪复-event-chengshu
  - key: closure
    name: 张邦奇序而收束
    labels:
      zh:
      - 张邦奇序
      - 少俟于时
    start_date: '1526-10-01'
    highlight_event_id: guji-倪复-event-xuzhuan
  decisions:
  - date: '1524'
    title_zh: 决定本仪礼经传参西山蔡氏立说
    rationale: 唯古训可守蔡学得声气之元故不取径三分之谬而取空围九方分之实以定律本
  - date: '1526-07-01'
    title_zh: 决定以二十七章统摄通考
    rationale: 自黄钟本原至诗图谱首尾贯通虽编次有失而大端能守古训故成书以俟后圣试用
- id: guji-倪复-endeavor-2
  title_zh: 考辨黄钟本原与度量权衡
  summary_zh: 以汉斛铭胡安定议证黄钟长九寸围九分容千二百黍之实辨三寸九分之非并列朱蔡异同推三损益生十一律与六十四变之法
  phases:
  - key: brewing
    name: 考汉志斛铭酝酿
    labels:
      zh:
      - 斛铭
      - 嘉量
    start_date: '1522'
    highlight_event_id: guji-倪复-event-chengshu
  - key: breakthrough
    name: 破径三分立九方分
    labels:
      zh:
      - 九方分
      - 容黍
    start_date: '1525'
    highlight_event_id: guji-倪复-event-chengshu
  - key: climax
    name: 推演三损益生十一律
    labels:
      zh:
      - 三分损益
      - 十七万七千一百四十七
    start_date: '1526-07-01'
    highlight_event_id: guji-倪复-event-chengshu
  - key: closure
    name: 并列朱蔡以俟后考
    labels:
      zh:
      - 朱蔡异同
      - 参互详审
    start_date: '1526-10-01'
    highlight_event_id: guji-倪复-event-xuzhuan
  decisions:
  - date: '1525'
    title_zh: 决定斥三寸九分从九寸之说
    rationale: 三寸者三三九寸也九分者九方分也若止三寸九分则声亢急元气不具度量权衡无由而定故从九寸以统天
  - date: '1526-07-01'
    title_zh: 决定从蔡元定二变不为调
    rationale: 朱子旋相为宫之说与礼记似有未合故特从元定以防宾以下不可为宫存古义而俟再考
