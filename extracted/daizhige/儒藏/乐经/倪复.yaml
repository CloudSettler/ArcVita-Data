  description_zh: 嘉靖丙戌秋七月精思力索钩玄析微成钟律通考六卷二十七章自黄钟本原定法至风雅十二诗图谱以求合声律之元
- id: guji-倪复-event-xuzhuan
  type: career
  date: '1526-10-01'
  year_of: 1526
  title_zh: 同郡张邦奇为通考作序
  description_zh: 是岁冬十月朔旦同郡张邦奇为书作序叹其厘千古之谬复二帝之隆谓圣天子建中和之极兹惟其时勉其少俟
- id: guji-倪复-event-death
  type: death
  date: '1550'
  year_of: 1550
  title_zh: 卒于嘉靖中后期
  description_zh: 嘉靖中后期卒通考久未克售后入四库列于经部乐类纪昀等称其能守古训参互详审颇为不苟可谓勤于此事者
