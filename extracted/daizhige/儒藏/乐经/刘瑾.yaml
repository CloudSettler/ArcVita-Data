    rationale: 黄钟始于声气之元，先多截竹管候气得长，再以祖冲之密率求幂积周径，方为至当归一
  - date: '1347'
    title_zh: 决定合二书次第编辑付梓
    rationale: 蔡氏冠绝千古而算疏，彭氏补其未及，合而编之旁采他说，可使数明义备以补一代正律
