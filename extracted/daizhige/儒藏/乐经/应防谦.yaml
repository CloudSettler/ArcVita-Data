endeavors:
- id: guji-应防谦-endeavor-1
  title_zh: 撰古乐书上卷明律吕本原
  summary: 本蔡氏新书参注疏朱子之说辨黄钟九寸围九分积八百一十分及历代尺度量衡之得失
  phases:
  - key: brewing
    name: 会通蔡朱注疏酝酿律原
    labels:
      zh:
      - 律吕
      - 黄钟
    start_date: 1670
    highlight_event_id: guji-应防谦-event-lulv
  - key: climax
    name: 论定律原尺度成上卷
    labels:
      zh:
      - 成书
    start_date: 1675
    highlight_event_id: guji-应防谦-event-lulv
  decisions:
  - date: 1675
    title_zh: 宗蔡氏而参朱子断黄钟九寸之制
    rationale: 古人既云九寸必有尺度真意不可强作一尺亦不可减为八寸一分当参声气之元定之
- id: guji-应防谦-endeavor-2
  title_zh: 撰古乐书下卷考乐器制度
  summary: 本陈祥道礼书及李之藻頖宫礼乐疏考钟鼓舞铣间之制图示正体侧体以明古钟之形
  phases:
  - key: breakthrough
    name: 考钟制得铣间鼓钲之度
    labels:
      zh:
      - 乐器
      - 考工
    start_date: 1676
    highlight_event_id: guji-应防谦-event-yueqi
  - key: closure
    name: 图说乐器成下卷以传
    labels:
      zh:
      - 定稿
    start_date: 1678
    highlight_event_id: guji-应防谦-event-yueqi
  decisions:
  - date: 1676
    title_zh: 以钲间同舞广为四破郑注之疑
    rationale: 鼓间钲间不得同度而舞广可证当作正侧二图使铣间鼓钲舞粲然可考
