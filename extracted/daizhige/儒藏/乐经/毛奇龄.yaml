  archetype: 经学考据型礼乐学者
  dilemmas:
  - 声音与数度之辨，径一围三粗疏当祛数归理以求乐本
  - 制作大事不敢溷扰与承圣谕阐发记述之职分进退两难
  lesson: 因圣谕而推阐乐本，辨律本之讹以立乐本之实，古乐之兴在声音而不在器数
  summary_first_person: 吾毛奇龄萧山人也，幼承先父镜公庭训，闻从祖得唐时五调遗法而叹古乐不传，幸通籍为翰林检讨，侍班窃听中和丹陛之声，入太常观宫县法物，知圣人审声知乐，待罪十年不敢妄献，及读邸抄得圣谕论径一围三隔八相生，豁然梦觉，口授男远宗撰为圣谕乐本解说，合皇言定声录竟山乐录共十三卷，于南巡迎驾嘉兴恭进，愿以此昌明声音之本
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/乐经/圣谕乐本解说.md
  - https://daizhige.org/儒藏/乐经/圣谕乐本解说.html
endeavors:
- id: guji-毛奇龄-endeavor-1
  title_zh: 奉圣谕撰述乐本解说并恭进
  description: 承大学士伊桑阿原疏所传圣谕，分条推阐考证，辨径一围三止可算六角，明隔八相生本在人声九声十二声，前后成三书十三卷，于康熙三十八年迎驾嘉兴恭进
  phases:
  - key: brewing
    name: 家学蓄养与待时不进
    labels:
      zh:
      - 家学
      - 候时
    start_date: 1679
    highlight_event_id: guji-毛奇龄-event-hongci
  - key: breakthrough
    name: 因邸抄圣谕悟律算而口授成书
    labels:
      zh:
      - 圣谕
      - 乐本
    start_date: 1692-03
    highlight_event_id: guji-毛奇龄-event-chengshu
  - key: climax
    name: 南巡迎驾嘉兴恭进刊本
    labels:
      zh:
      - 进呈
      - 刊行
    start_date: 1699-03
    highlight_event_id: guji-毛奇龄-event-jinjian
  decisions:
  - date: 1692-05-15
    title_zh: 口授男远宗先成圣谕乐本解说一卷
    rationale: 圣谕煌然为臣职在记述，当推大阐微祛数归理，以尺龠密率相生之法立乐本之实
  - date: 1699-03
    title_zh: 于嘉兴迎驾以刊本二卷恭进
    rationale: 前次拟进未果，逢南巡之便即用前卷论围三后卷论相生之刊本进呈以垂永久
- id: guji-毛奇龄-endeavor-2
  title_zh: 博学鸿词入仕与经学礼乐著述
  description: 以布衣举博学鸿词授翰林检讨，侍班改定乐章考宫县法物，乞疾归里后专治经学礼乐，晚号竟山著述甚富
  phases:
  - key: brewing
    name: 幼承庭训博览经史
    labels:
      zh:
      - 经学
      - 家学
    start_date: 1635
    highlight_event_id: guji-毛奇龄-event-birth
  - key: breakthrough
    name: 鸿词通籍侍班闻乐
    labels:
      zh:
      - 入仕
      - 闻乐
    start_date: 1679
    highlight_event_id: guji-毛奇龄-event-hongci
  - key: closure
    name: 在籍讲学以竟山诸录传世
    labels:
      zh:
      - 讲学
      - 著述
    start_date: 1684
    highlight_event_id: guji-毛奇龄-event-chengshu
  decisions:
  - date: 1679
    title_zh: 应鸿词授检讨仅论乐章篇次而不及歌咏之法
    rationale: 圣上朝乾夕惕万机不暇，不宜以制作大事重肆溷扰，故待罪十年不敢妄献
  - date: 1684
    title_zh: 乞疾归里专事考证著述
    rationale: 既睹世祖所改埙篪与圣人审声辨器，当待运而发以成一家竟山之学
events:
- id: guji-毛奇龄-event-birth
  title_zh: 出生于萧山
  date: 1623
  year_of: 1623
  description: 明天启三年生于浙江萧山，父镜公授以从祖从王守仁征藩所得唐时五调遗说，临殁嘱以圣人生古乐兴
- id: guji-毛奇龄-event-hongci
  title_zh: 举博学鸿词授翰林院检讨
  date: 1679
  year_of: 1679
  description: 康熙十八年举博学鸿词科，授翰林院检讨，侍班听中和乐及丹陛乐，入直考乐章入太常观宫县埙篪诸器
- id: guji-毛奇龄-event-chengshu
  title_zh: 撰成圣谕乐本解说拟进呈
  date: 1692-05-15
  year_of: 1692
  description: 在杭就医读邸抄知圣谕论径一围三隔八相生，口授男远宗撰为圣谕乐本解说一卷皇言定声录八卷竟山乐录四卷，合十三卷具疏拟进未果
- id: guji-毛奇龄-event-jinjian
  title_zh: 嘉兴迎驾恭进刊本二卷
  date: 1699-03
  year_of: 1699
  description: 康熙三十八年三月圣祖南巡，于嘉兴迎驾以刊本恭进，前卷论径一围三后卷论隔八相生，四库著录为二卷
- id: guji-毛奇龄-event-death
  title_zh: 逝世
  date: 1716
  year_of: 1716
  description: 康熙五十五年卒于家，晚号竟山，以经学礼乐考订名世，乐本解说列入四库经部乐类
