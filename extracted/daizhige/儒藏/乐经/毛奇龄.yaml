  dilemmas:
  - 求声与求数之辨明知算律精密动听而声律茫然当舍数而就声否
  - 托父竟山之名与自署己名之间为存家学渊源当隐己名以尊父否
  lesson: 乐亡于为说者求乐当先求人声管笛之声舍声而言度量算数皆欺人之学
  summary_first_person: 吾少承先检讨竟山府君及汀州司马家学中年以博学鸿词入翰林晚年归里以痹病僵居追述先人乐说托名竟山撰成乐录四卷以明五声九声七调之本斥三分损益隔八相生之妄欲以箫笛色谱还乐于声
