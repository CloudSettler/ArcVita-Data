  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E5%BE%8B%E5%90%95%E6%96%B0%E8%AE%BA.html
endeavors:
- id: guji-江永-endeavor-1
  title_zh: 撰述律吕新论考定黄钟律法
  summary: 以琴徽泛声与周鬴容积验算蔡氏律书辨黄钟之宫半律立均匀截管以应月气之新法
  phases:
  - key: brewing
    name: 少读蔡书蓄疑
    labels:
      zh:
      - 蓄疑律书
    start_date: 1695
    highlight_event_id: guji-江永-event-study-cai
  - key: breakthrough
    name: 以琴参证悟管弦异理
    labels:
      zh:
      - 琴律参证
    start_date: 1720
    highlight_event_id: guji-江永-event-study-qin
  - key: climax
    name: 考周鬴推积分合再期
    labels:
      zh:
      - 积算合历
    start_date: 1745
    highlight_event_id: guji-江永-event-write-lulu
  - key: closure
    name: 成书二卷俟论定
    labels:
      zh:
      - 著书论定
    start_date: 1755
    highlight_event_id: guji-江永-event-write-lulu
  decisions:
  - date: 1720
    title_zh: 舍管从琴以琴徽定五声之用
    rationale: 蔡书二变与琴不合唯目前可验之琴徽有均齐参差之自然故以琴决律书是非
  - date: 1745
    title_zh: 改三分损益为均匀截管以应历日
    rationale: 旧法忽疏忽密往而不返唯黄钟半律容分合一岁日数均匀截去方合十二月中气与斗建六合
  - date: 1755
    title_zh: 揭黄钟之宫为半律以正班志之删
    rationale: 据呂氏春秋与蔡邕月令章句订三九字之讹存四寸五分少宫为全律之本
- id: guji-江永-endeavor-2
  title_zh: 精研三礼考据经学授徒传学
  summary: 治周礼仪礼考订制度名物兼通历算授徒戴震等开皖派朴学先声
  phases:
  - key: brewing
    name: 婺源力学通经史
    labels:
      zh:
      - 经史力学
    start_date: 1700
    highlight_event_id: guji-江永-event-study-cai
  - key: breakthrough
    name: 注礼考制名重江淮
    labels:
      zh:
      - 礼学考制
    start_date: 1730
    highlight_event_id: guji-江永-event-teach-daizhen
  - key: climax
    name: 授徒戴震传声韵历算
    labels:
      zh:
      - 授徒传学
    start_date: 1745
    highlight_event_id: guji-江永-event-teach-daizhen
  - key: closure
    name: 晚年著述总成一家
    labels:
      zh:
      - 晚年总成
    start_date: 1758
    highlight_event_id: guji-江永-event-write-lulu
  decisions:
  - date: 1730
    title_zh: 以算学通经不守宋儒旧说
    rationale: 胡范蔡氏算术用围三径一之疏法唯祖冲之密率可得周径积幂之真故精算法以治经
  - date: 1745
    title_zh: 收戴震为弟子授以考据之法
    rationale: 见其颖悟可传经世实学欲以礼乐历算声韵之业托之后起
events:
- id: guji-江永-event-birth
  date: 1681
  year_of: 1681
  title_zh: 出生于徽州婺源
  description: 康熙二十年生于婺源少力学于经史历算
- id: guji-江永-event-study-cai
  date: 1705
  year_of: 1705
  title_zh: 潜心蔡氏律吕本原及朱子琴律说
  description: 少读蔡书沈潜反覆中年因琴有两角声之说始疑律书未尽善而博考管弦历志
- id: guji-江永-event-study-qin
  date: 1725
  year_of: 1725
  title_zh: 推琴徽验五声参差考俗乐工尺
  description: 推琴徽泛声出于自然访工尺上四之记知音律别有精微法度
- id: guji-江永-event-teach-daizhen
  date: 1745
  year_of: 1745
  title_zh: 授徒讲学传经学历算之业
  description: 讲学江淮授戴震等以训诂考据声韵历算为皖派先导
- id: guji-江永-event-write-lulu
  date: 1755
  year_of: 1755
  title_zh: 著成律吕新论二卷
  description: 上卷论蔡书五声黄钟十一律三分损益下卷论琴四清旋宫乐调造律候气以琴音立说自成一家
- id: guji-江永-event-death
  date: 1762
  year_of: 1762
  title_zh: 卒于乾隆二十七年
  description: 晚年著述既成考订礼乐历算之学传于后世四库馆臣录其书而为提要
