  dilemmas:
  - 遵古成法与求合管弦实用之间如何取舍
  - 以管定律与以琴徽验律孰为可据
  - 三分损益旧法与黄钟积分合历日之数孰是
  lesson: 以可验之器与精密算术考订古法不泥成说别辟平易可据之理
  summary_first_person: 我少读蔡氏律书沈潜反覆而有疑中年因琴律管弦之异参以历志管积之数蓄之二十余年乃敢以管见为律吕新论二卷俟后君子论定
  source_urls:
