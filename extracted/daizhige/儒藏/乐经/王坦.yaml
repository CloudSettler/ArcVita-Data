  dilemmas:
  - 管律以度较虚音弦音以数较实音分合不同何以贯通为一
  - 世传一弦为宫与一弦尚徵丝音尚徵之旨相违何去何从
  lesson: 审音各从其类丝乐当以五声之数较弦纶多寡徽分疏密不可执黄钟九寸之度论琴方得古圣作乐精微
  summary_first_person: 余王坦字吉途南通州人目睹世人执管律论弦音以仲吕为角废旋宫为一均纷然聚讼乃本御制律吕正義作琴旨二卷以五声相生定体用辨尚徵旋宫徽分泛音以明丝竹虚实之异冀不失古人审音之宗
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E7%90%B4%E6%97%A8.md
