  decisions:
  - date: 1775-01-01
    title_zh: 舍律吕之度取五声之数较弦音
    rationale: 管音全半不相应弦音全半相应欲取声同则分不同欲取分同则声不同故丝乐必以宫商角徵羽之数定体用
  - date: 1780-01-01
    title_zh: 断一弦尚徵不主一弦为宫
    rationale: 宫生徵徵生商商生羽羽生角按三分损益一弦全度散声当为林钟徵非黄钟宫方合丝音尚徵三弦为宫之义
- id: guji-王坦-endeavor-2
  title_zh: 本律吕正义阐发徽分泛音旋宫
  summary_zh: 释黄钟均仲吕为角之疑三弦独下一徽五弦独上半徽泛音四准角调旋宫转调之理以证御制正义之得
  phases:
  - key: brewing
    name: 考仲吕为角十徽应三弦之义
    labels:
      zh:
      - 酝酿
      - 考徽
    start_date: 1776-01-01
    highlight_event_id: guji-王坦-event-1
  - key: breakthrough
    name: 明三弦十一徽五弦九徽上下之故
    labels:
      zh:
      - 突破
      - 推分
    start_date: 1778-01-01
    highlight_event_id: guji-王坦-event-1
  - key: climax
    name: 定泛音清浊界限与旋宫之法
    labels:
      zh:
      - 高潮
      - 通调
    start_date: 1780-06-01
    highlight_event_id: guji-王坦-event-1
  - key: closure
    name: 以正义之法折服聚讼之说
    labels:
      zh:
      - 收束
      - 定论
    start_date: 1781-11-01
    highlight_event_id: guji-王坦-event-2
  decisions:
  - date: 1778-01-01
    title_zh: 以度分实算定徽位升降
    rationale: 十徽为全度四分之三九徽为三分之二按三弦八十一分三因之数必按十一徽方与角声应五弦角生变宫必在上半徽方应故徽分疏密皆有数存
  - date: 1780-06-01
    title_zh: 主角调角弦一声为宫即旋宫
    rationale: 角既为宫则宫转徵徵转商商转羽羽转角皆以次而移非隋废旋宫独存黄钟一均可比故守五声旋宫转调之全
