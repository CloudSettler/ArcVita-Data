  decisions:
  - date: '1038'
    title_zh: 分经义治事二斋
    rationale: 欲使学者明体达用，经术兼习政事、水利、算数，不为空言，故分斋授徒，敦尚实学。
  - date: '1044'
    title_zh: 以湖学法入太学
    rationale: 范仲淹等兴学，取湖学规制颁行天下，使士有守有为，以救文弱浮华之弊。
- id: guji-胡瑗-endeavor-2
  title_zh: 奉敕详定皇祐新乐
  summary: 景祐三年诏较钟律，皇祐二年驿召同议，以秬黍定律度量衡，铸镈钟特磬编钟磬晋鼓鼎器，皇祐五年乐成作图记。
