  reign_ref: 宋仁宗景祐皇祐嘉祐
  archetype: 安定师儒，兴学定乐
  dilemmas:
  - 以黍起度还是以度起律，古律已亡何从求中声
  - 房庶横黍纵黍围径之争，司马光范镇往返聚讼而持论互异
  - 旧钟旧磬形制声高失叙，改作是否违祖宗旧而致纷扰
  lesson: 反求经史以黍定度，以厚薄齐钟磬之声，学以实事济世，乐以中和格神
  summary_first_person: 吾胡瑗字翼之，海陵人也。少励学，居湖州教授，分经义治事二斋以教士。景祐中，李照乐穿凿失古，仁宗诏较钟律。吾与阮逸奉敕，召驿豫议，用上党秬黍制律度量衡，铸镈钟特磬编钟编磬晋鼓鼎器，历二年议定，皇祐五年乐成，下太常旧乐一律，众音谐和，遂为图记三卷以垂不朽。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E7%9A%87%E7%A5%90%E6%96%B0%E4%B9%90%E5%9B%BE%E8%AE%B0.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%B9%90%E7%BB%8F/%E7%9A%87%E7%A5%90%E6%96%B0%E4%B9%90%E5%9B%BE%E8%AE%B0.html
