  decisions:
  - date: '1050-01-01'
    title_zh: 以横黍起度定黄钟九寸
    rationale: 古律已亡，非黍无以见度，反从度法求律，以上党秬黍中者一黍之广为分，积八百一十分容千二百黍，下太常旧乐一律以合中和。
  - date: '1051-05-19'
    title_zh: 镈钟齐一以厚薄定声
    rationale: 十二镈钟大小高下皆如黄钟，不各依本律倍半，唯于厚薄中定清浊，使声器宏大可和众乐，乳数疏密齐一，旋虫县置合古。
  - date: '1052-12-21'
    title_zh: 编钟用双牙磬虡用羽饰
    rationale: 详考周礼小胥梓人及三礼图，钟虡当双牙使县平声畅，磬虡趺当用羽属鸷鸟之形，请敕太常修换时正之。
events:
- id: guji-胡瑗-event-birth
  title_zh: 诞生海陵
  date: 0993
  year_of: 993
  description: 宋太宗淳化四年，生于泰州海陵，字翼之，少笃学经术，留意历代制度。
  place_zh: 泰州海陵
- id: guji-胡瑗-event-huxue
  title_zh: 主湖州教授分二斋
  date: '1035'
  year_of: 1035
  description: 景祐中授湖州教授，创经义治事二斋，教人有序，庆历兴学多取其法，遂为天下师表。
  place_zh: 湖州
- id: guji-胡瑗-event-zhaoyi
  title_zh: 驿召豫议钟律
  date: '1036-02-01'
  year_of: 1036
  description: 仁宗以李照乐穿凿，特诏较定钟律，驿召致仕诸儒，与阮逸房庶等各作钟律以献，往返论难。
  place_zh: 京师
- id: guji-胡瑗-event-dinglv
  title_zh: 用秬黍制律度量衡
  date: '1049-09-01'
  year_of: 1049
  description: 皇祐二年秋大飨明堂后，奉敕与阮逸等依周礼史志，用上党羊头山秬黍制律吕黍尺四量权衡，交相酬验。
  place_zh: 修制局
- id: guji-胡瑗-event-jincheng
  title_zh: 垂拱殿进呈新钟磬
  date: '1051-05-19'
  year_of: 1051
  description: 议定旧镈钟七失旧特磬三失，于垂拱殿进呈新制，上可其奏，命铸造镈钟特磬，复于皇祐四年冬御紫宸观制度听声音，称精和。
  place_zh: 垂拱殿
- id: guji-胡瑗-event-yuecheng
  title_zh: 皇祐新乐成作图记
  date: '1053-06-01'
  year_of: 1053
  description: 皇祐五年六月，按周礼范金，两宫架登歌钟磬晋鼓三牲鼎鸾刀皆成，考声下旧乐一律，众器尽合钟磬，与阮逸撰皇祐新乐图记三卷以进。
  place_zh: 京师
- id: guji-胡瑗-event-death
  title_zh: 卒于嘉祐
  date: '1059-06-09'
  year_of: 1059
  description: 官至国子监直讲太常博士天章阁待制兼侍讲，嘉祐四年夏卒，门人私谥安定，学称安定先生。
  place_zh: 京师
