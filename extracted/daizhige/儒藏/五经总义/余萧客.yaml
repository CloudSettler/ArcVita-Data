    start_date: 1762-08-01
    highlight_event_id: guji-余萧客-event-complete
  decisions:
  - date: 1760-06-01
    title_zh: 经文同异以北宋精本参校
    rationale: 前明监板讹缺多以唐石经宋椠本校补涂乙示学者闻见
  - date: 1762-04-01
    title_zh: 急补孟子章指孙疏之疑
    rationale: 赵岐章指混入疏中零落从李氏蜀大字本及毛斧季手校补入以解二十八卷之疑
