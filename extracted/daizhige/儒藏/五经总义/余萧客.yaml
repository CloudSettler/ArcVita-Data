  decisions:
  - date: 1759-10-01
    title_zh: 断限唐前独存稽古之思
    rationale: 汉宋殊旨以李唐为限尽取唐前旧说以别现行刊本
  - date: 1761-01-01
    title_zh: 改疏注为经解兼包异同
    rationale: 从朱文游议以经解目本后苍旧例相承分类遂定今名
  - date: 1762-08-01
    title_zh: 别叙录一卷详姓氏书目
    rationale: 先儒姓氏僻者近半随条附见则繁故别为一卷略述源流
- id: guji-余萧客-endeavor-2
  title_zh: 参校经文补正注疏缺误
  summary_zh: 以北宋精本参校正明监板之讹并补礼记疏孙氏疏缺文百数十条
