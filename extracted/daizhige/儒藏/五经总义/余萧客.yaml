  - key: breakthrough
    name: 得朱校北宋本
    labels:
      zh: 借朱楷字孔林比对本
    start_date: 1761-01-01
    highlight_event_id: guji-余萧客-event-zhuwenjiao
  - key: climax
    name: 补礼疏缺误
    labels:
      zh: 补正礼记疏百数十条
    start_date: 1762-02-01
    highlight_event_id: guji-余萧客-event-complete
  - key: closure
    name: 标异字异句脱文
    labels:
