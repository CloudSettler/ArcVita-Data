  year_of: 1759
  title_zh: 己卯创始钩沉作前序
  description_zh: 己卯杪秋从事钩沉旁搜尚书古注略遍周易五卷既削稿十月作前序立尽取唐前之例
- id: guji-余萧客-event-zhuwenjiao
