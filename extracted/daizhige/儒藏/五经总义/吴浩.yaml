  dilemmas:
  - 博采先儒合订与不敢与先儒抗衡之谦慎两难
  - 穿凿傅会武断与鹘突不解轖结于中之两病
  lesson: 读书不能无疑，疑必博采先儒，揆之理斟之情，准于常道而后详说，戒穿凿武断
  summary_first_person: 余华亭后学吴浩，幸生圣世，得优游丘园，日取诸经研究，寤寐勿谖，寒暑无间，忘寝食三十余年，摘其未确未安者博采先儒合订，以俟同志相参而晰疑
