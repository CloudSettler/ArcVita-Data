  decisions:
  - date: 1716-01-01
    title_zh: 以古本为主经注以宋板为主疏
    rationale: 古本多助字存唐前博士所传宋板正义平稳可据故分主以广异闻
  - date: 1717-01-01
    title_zh: 以崇祯汲古阁本为主参校
    rationale: 崇祯本世所通行便学者对照故存其文而别标补阙以见妄补
- id: guji-山井鼎-endeavor-2
  title_zh: 与物观共成考文补遗二百六卷
  summary_zh: 既为考文复与东都讲官物观分任补遗凡易书诗礼记论语孝经孟子共二百六卷别孟子于七经之外以存唐制旧义
