  date: 1220
  year_of: 1220
  title_zh: 相台书塾校刊九经三传成
  description: 博采唐石晋铜京蜀等二十三本与明经老儒分卷校勘命良工刻梓悉循旧文并作总例一卷论书本书画注文音释句读脱简考异
