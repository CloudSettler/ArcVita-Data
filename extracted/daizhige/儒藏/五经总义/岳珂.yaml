    title_zh: 以廖氏精本为底别增公谷年表
    rationale: 余于二本并建安余氏兴国于氏皆未尽善惟廖氏合诸本参订为最精故增二传以补其阙
  - date: 1220
    title_zh: 悉循旧文偏旁圈点必校证以说文韵略
    rationale: 字学不讲久矣俗字易旧文故以许慎说文张参五经文字毛晃韵略为据不增损于前以存真
