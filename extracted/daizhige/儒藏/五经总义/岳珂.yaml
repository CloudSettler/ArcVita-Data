  archetype: 校勘守成型学者
  dilemmas:
  - 众本互有得失难于取正如何博采二十三本以定一是
  - 俗字流行点画混淆如何酌古准今而不骇俗以存圣经之真
  lesson: 校勘须精博参订守旧存异以俟通经先达订正方为有功于经学
  summary_first_person: 吾乃鄂忠武王之孙敷文阁待制霖之子居嘉兴官至户部侍郎淮东总领制置使吾惜世传九经譌谬脱略遂聚唐石晋铜京蜀潭抚闽越诸本二十有三属于家塾反覆参订刻梓相台并述书本字画注文音释句读脱简考异为总例一卷以正俗学之陋而俟后之君子
  source_urls:
  - https://daizhige.org/儒藏/五经总义/九经三传沿革例.html
