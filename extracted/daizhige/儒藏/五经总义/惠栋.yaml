  decisions:
  - date: 1740
    title_zh: 先作周易述再推九经
    rationale: 易象文字假借最多先明其例可为诸经通例
  - date: 1750
    title_zh: 宁存异文不改古训
    rationale: 漆书口授同音异字辗转多岐当并存互证不以今形声改古义
