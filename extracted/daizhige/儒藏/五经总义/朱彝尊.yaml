  lesson: 以尊经为宗以考据为实网罗存佚详注源委方能文献足征
  summary_first_person: 我是朱彝尊，字锡鬯，号竹垞，浙江秀水人，康熙己未以博学鸿词授检讨入直内廷，平生博闻淹贯，文章淹雅，与王士祯齐名而与顾炎武阎若璩相颉颃，汇考历代说经书目为经义考三百卷，初名存亡考后改分存阙佚未见四例，每书列撰人卷数并录序跋论断爵里而附案语于末，以尊经考据文献足征为志
