  dilemmas:
  - title_zh: 守道与从政之衡
    description_zh: 明道不行则退守洛学讲易穷理，朝命至则入经筵正心诚意以格君
  - title_zh: 传经与立言之难
    description_zh: 易传既成而系辞阙略，春秋未成而义例孤悬，门人掇拾恐失易简本旨
  lesson: 以易简为教，敬以直内，义以方外，穷理尽性以至于命
  summary_first_person: 吾伊川程颐，洛阳人也，与兄明道共阐圣学，一生解经讲易，以易简亲从为宗，历经筵之进退，遭党禁之流离，著易传春秋传以示后，愿学者敬守天理不流于虚文
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%BA%94%E7%BB%8F%E6%80%BB%E4%B9%89/%E7%A8%8B%E6%B0%8F%E7%BB%8F%E8%AF%B4.html
