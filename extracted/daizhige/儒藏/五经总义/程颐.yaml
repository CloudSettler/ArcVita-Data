endeavors:
- id: guji-程颐-endeavor-1
  title_zh: 解经注易阐易简之道
  summary_zh: 遍注五经总义，成伊川易传，补系辞说，改定大学，传春秋大义，开洛学一脉
  phases:
  - key: brewing
    name: 少从周敦颐讲学穷理
    labels:
      zh: 求道养心
    start_date: 1057
    highlight_event_id: guji-程颐-event-jingyan
  - key: breakthrough
    name: 伊川讲易易传初具规模
    labels:
      zh: 注易明理
    start_date: 1080
    highlight_event_id: guji-程颐-event-yizhuan
  - key: climax
    name: 崇宁自序春秋传成系辞说传世
    labels:
      zh: 经说大成
    start_date: 1103
    highlight_event_id: guji-程颐-event-chunqiu
  - key: closure
    name: 门人编次河南经说七卷定本
    labels:
      zh: 定本传后
    start_date: 1107
    highlight_event_id: guji-程颐-event-death
  decisions:
  - date: 1080
    title_zh: 专治易学以易简立教
    rationale: 天下之理易简而已，亲合则久大，故先明乾坤易简以定诸经纲领
  - date: 1103
    title_zh: 春秋未成而先自序其例
    rationale: 圣人未成之书不可强成，存大义以待后圣，不以私意乱圣笔
- id: guji-程颐-endeavor-2
  title_zh: 洛学讲学经筵格君
  summary_zh: 洛阳讲学育才天下，元祐入侍经筵以正君心，绍圣党禁远谪涪州而道不屈
  phases:
  - key: brewing
    name: 洛阳讲席从游者众
    labels:
      zh: 设教洛阳
    start_date: 1072
    highlight_event_id: guji-程颐-event-jingyan
  - key: breakthrough
    name: 元祐召为崇政殿说书
    labels:
      zh: 经筵侍讲
    start_date: 1086
    highlight_event_id: guji-程颐-event-jingyan
  - key: climax
    name: 论经筵当以格君心为本
    labels:
      zh: 以道事君
    start_date: 1087
    highlight_event_id: guji-程颐-event-yizhuan
  - key: closure
    name: 贬涪州晚归洛阳而卒
    labels:
      zh: 守道而终
    start_date: 1100
    highlight_event_id: guji-程颐-event-death
  decisions:
  - date: 1086
    title_zh: 受诏入经筵不辞
    rationale: 得君行道之机不可失，欲以敬义夹持涵养人主德性
  - date: 1097
    title_zh: 谪涪不废讲学著述
    rationale: 穷则独善以传道，著书立言亦所以济天下，不以患难易其守
events:
- id: guji-程颐-event-birth
  date: 1033
  year_of: 1033
  title_zh: 生于洛阳伊川程氏
  description_zh: 明道二年生于洛阳，与兄颢共称二程，少颖悟从周敦颐论道
- id: guji-程颐-event-jingyan
  date: 1086
  year_of: 1086
  title_zh: 元祐入经筵侍讲
  description_zh: 司马光吕公著荐为崇政殿说书，侍哲宗讲读，以师道自居，正容格君
- id: guji-程颐-event-yizhuan
  date: 1099
  year_of: 1099
  title_zh: 伊川易传系辞说大备
  description_zh: 久讲易学成易传，门人又录系辞说诗书解论语说，以易简弥纶天地之道
- id: guji-程颐-event-chunqiu
  date: 1103
  year_of: 1103
  title_zh: 崇宁二年作春秋传自序
  description_zh: 春秋传专著而未成，自序其传经之意，后与诸经说合为河南经说
- id: guji-程颐-event-death
  date: 1107
  year_of: 1107
  title_zh: 卒于洛阳
  description_zh: 大观元年闰十月卒于洛阳故居，门人朱光庭等护丧，谥正公，从祀孔庙
