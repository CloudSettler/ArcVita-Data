  dilemmas:
  - 以考据求实与以馆阁体例维持大局之间的权衡
  - 以直书存真与以避讳全身之间的两难
  lesson: 网罗群书而别择是非，兼存异说而折衷至当，方能使古籍流传不失真意
  summary_first_person: 我为直隶献县纪昀，字晓岚，一生以纂修校勘为业，总纂四库，辨章学术，于经书音义尤重择善而从，欲使后学有所依据而不惑于坊本之陋
  source_urls:
