    title_zh: 受命总纂以考据为衡
    rationale: 以博考源流补阙证误为任，立凡例以一众手，使分纂有所遵循
  - date: 1781-06-01
    title_zh: 于提要中兼存异说而断是非
    rationale: 如于经书音释既录陆氏旧音又采宋儒新说，以足相续而不专主一家
- id: guji-纪昀-endeavor-2
  title_zh: 考据著述与经义阐明
  summary: 宦海之余笔耕不辍，撰阅微草堂笔记及经义考证，以通儒之学疏解名物训诂
  phases:
