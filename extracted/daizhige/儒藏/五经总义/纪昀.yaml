    labels:
      zh: 以简驭繁
    start_date: 1800-01-01
    highlight_event_id: guji-纪昀-event-1789
  decisions:
  - date: 1789-01-01
    title_zh: 以小说笔法存考据之实
    rationale: 托志怪以寄褒贬，使劝惩之旨隐于叙事而学术根柢不失
  - date: 1800-01-01
    title_zh: 守宋学而兼采汉注
    rationale: 于经义不专主空疏，亦不泥于章句，务求义理与训诂两得其平
events:
- id: guji-纪昀-event-birth
  date: 1724-07-26
  year_of: 1724
  title_zh: 诞生于直隶献县
  description: 雍正二年生于书香之家，少颖悟，博览经史，为日后馆阁之业奠基
- id: guji-纪昀-event-1754
  date: 1754-05-15
  year_of: 1754
  title_zh: 登进士第入翰林
  description: 乾隆十九年成进士，授庶吉士，迁翰林院编修，得以遍观内府藏书
  endeavor_ref: guji-纪昀-endeavor-2
- id: guji-纪昀-event-1773
  date: 1773-03-01
  year_of: 1773
  title_zh: 入四库馆任总纂官
  description: 乾隆三十八年开四库馆，与陆锡熊同为总纂，总其成而定凡例
  endeavor_ref: guji-纪昀-endeavor-1
- id: guji-纪昀-event-1776
  date: 1776-08-01
  year_of: 1776
  title_zh: 校勘经部群书
  description: 分校永乐大典所辑经书，辨建本杭本明本之异同，订音释之得失
  endeavor_ref: guji-纪昀-endeavor-1
- id: guji-纪昀-event-1781
  date: 1781-09-01
  year_of: 1781
  title_zh: 恭校明本排字九经直音提要
  description: 与陆锡熊孙士毅等恭校上提要，断其为宋人所著元初梅隐书堂所刊，许其音释最为妥善
  endeavor_ref: guji-纪昀-endeavor-1
- id: guji-纪昀-event-1789
  date: 1789-06-01
  year_of: 1789
  title_zh: 阅微草堂笔记成编
  description: 以休沐之暇缀录见闻，兼载考据议论，晚年学派影响远播士林
  endeavor_ref: guji-纪昀-endeavor-2
- id: guji-纪昀-event-death
  date: 1805-03-14
  year_of: 1805
  title_zh: 卒于京师
  description: 嘉庆十年二月病卒于京邸，追谥文达，所纂四库全书垂范后世
