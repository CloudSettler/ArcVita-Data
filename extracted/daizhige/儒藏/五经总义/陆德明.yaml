    rationale: 微言久绝大义愈乖职司其忧宁可视成而已故研精六籍以正名审音
  - date: 384
    title_zh: 以墨书经本朱字辩注摘字为音
    rationale: 旧音全录经文徒烦翰墨今标篇章摘字为音而孝经老子特纪全句以便童蒙稽考
