  decisions:
  - date: 1748-01-01
    title_zh: 不取梅赜古文不废诗序
    rationale: 以他书征引与义理文辞参验，伪者虽盛行亦黜，旧序虽被疑而有据者存之
  - date: 1750-01-01
    title_zh: 春秋不取义例礼不违情
    rationale: 以为圣人书法在婉而成章直而能曲，礼义必合人情，穿凿附会反失圣意
