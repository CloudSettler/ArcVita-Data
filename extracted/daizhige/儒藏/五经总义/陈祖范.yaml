  era: 清代
  reign_ref: 雍正至乾隆
  archetype: 通达醇实的经学家
  dilemmas:
  - 信古传注与疑古考辨之间如何持平
  - 经义精微与人事时宜之间如何贯通
  - 守师法与伸己见之间如何取舍
  lesson: 说经贵在通达人情事理，不泥章句，不尚穿凿，方为醇实。
  summary_first_person: 我字见复，一字亦韩，常熟人，雍正癸卯会试中式，未及殿试，乾隆辛未以经学荐举，特赐国子监司业衔，我说易书诗春秋礼论孟诸经，不取伪古文，不废诗小序，不取春秋义例，不以古礼违人情，门人辑为经咫一卷，取咫闻之义，冀以片言通大义。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E4%BA%94%E7%BB%8F%E6%80%BB%E4%B9%89/%E7%BB%8F%E5%92%AB.md
