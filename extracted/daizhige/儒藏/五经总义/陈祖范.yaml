  decisions:
  - date: 1723-06-01
    title_zh: 会试中式后守经学正途
    rationale: 未及殿试而不改其志，专以说经为业，不逐科名文辞之末
  - date: 1751-06-01
    title_zh: 应经学荐举录呈御览
    rationale: 以平生说经之文进呈，冀以醇实之学感悟上听，裨益世教
