  dilemmas:
  - title_zh: 心学盛而经学衰
    description_zh: 嘉隆以来帖括之士墨守方隅，我独远讨遐搜潜心训诂
  - title_zh: 存古义与守宋儒之别
    description_zh: 取汉唐以来说经异于宋儒者，欲存诸经古训，不杂明人议论
  lesson: 不墨守一方，远讨遐搜以存古义，空谷足音亦可待后
  summary_first_person: 余幼业专经，入官多暇，优游典籍之场，凡不诡于经有裨于传者咸笔识之，久之遂成此编，师承各异见以人殊，贻之同好庶裁其狂斐
