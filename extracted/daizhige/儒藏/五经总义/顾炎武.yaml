      - 游历考实
    start_date: 1645-01-01
    highlight_event_id: guji-顾炎武-event-rizhilu
  - key: breakthrough
    name: 日知录渐成体系
    labels:
      zh:
      - 著述
      - 经世
    start_date: 1670-01-01
    highlight_event_id: guji-顾炎武-event-rizhilu
  - key: climax
    name: 北游授徒讲求实学
    labels:
      zh:
      - 讲学
      - 育人
    start_date: 1675-01-01
    highlight_event_id: guji-顾炎武-event-jiujing
  - key: closure
    name: 卒于曲沃遗书后世
    labels:
      zh:
      - 守志
      - 遗惠
    start_date: 1682-02-15
    highlight_event_id: guji-顾炎武-event-death
  decisions:
  - date: 1645-08-01
    title_zh: 不仕新朝以布衣行天下
    rationale: 国变之后耻事二姓，惟以稽古经世自任，行万里路读万卷书以求实济
  - date: 1670-05-01
    title_zh: 著日知录以明道救世
    rationale: 空疏经义误国，必考制度名物音韵地理，发明圣学经世，使人材不下而风俗可正
events:
- id: guji-顾炎武-event-birth
  date: 1613-07-15
  year_of: 1613
  title_zh: 生于昆山
  description_zh: 明万历四十一年六月初七生于江苏昆山千灯，名绛，字忠清，后名炎武，字宁人
- id: guji-顾炎武-event-stone
  date: 1664-06-01
  year_of: 1664
  title_zh: 关中访唐石壁九经
  description_zh: 游历关中亲见唐开成石经，复得旧时摹本，虽有踳駮而足以正今监本之误，遂发愿雠校诸经
- id: guji-顾炎武-event-rizhilu
  date: 1670-01-01
  year_of: 1670
  title_zh: 日知录著述讲学
  description_zh: 久历四方考实，著日知录成帙，论经术吏治人材，倡经世致用之学
- id: guji-顾炎武-event-jiujing
  date: 1675-01-01
  year_of: 1675
  title_zh: 九经误字告成
  description_zh: 考石经旧刻列监坊讹脱成九经误字一卷，尤补仪礼士昏乡射燕礼特牲少牢诸篇脱文，以告后学
- id: guji-顾炎武-event-death
  date: 1682-02-15
  year_of: 1682
  title_zh: 卒于曲沃
  description_zh: 清康熙二十一年正月初九卒于山西曲沃，遗著经史考订及经世之论传于后世
