endeavors:
- id: guji-顾炎武-endeavor-1
  title_zh: 雠校九经正监坊讹脱
  summary_zh: 以唐开成石经及旧摹本雠正国子监本与坊刻之误，纠仪礼脱文最众，成九经误字一卷以告后学
  phases:
