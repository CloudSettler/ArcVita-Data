      - 立志雠经
    start_date: 1659-01-01
    highlight_event_id: guji-顾炎武-event-stone
  - key: breakthrough
    name: 得旧摹本雠监坊
    labels:
      zh:
      - 雠校
      - 辨讹脱
    start_date: 1664-01-01
    highlight_event_id: guji-顾炎武-event-stone
  - key: climax
    name: 列九经误字告后学
    labels:
      zh:
      - 著书
      - 正经文
    start_date: 1670-01-01
    highlight_event_id: guji-顾炎武-event-jiujing
  - key: closure
    name: 仪礼脱文赖以补正
    labels:
      zh:
      - 补阙
      - 惠后学
    start_date: 1675-01-01
    highlight_event_id: guji-顾炎武-event-jiujing
  decisions:
  - date: 1664-06-01
    title_zh: 以石经为据不徇监本
    rationale: 监坊流传多误，必以石经旧刻为衡，虽小字亦必正之，方能离经不谬
  - date: 1670-03-01
    title_zh: 专举大误脱文著录
    rationale: 笔误显然及两通异文不录，专录讹脱害义者，尤重仪礼脱文数十处，使后学得补正
- id: guji-顾炎武-endeavor-2
  title_zh: 稽古著述倡经世致用
  summary_zh: 足迹遍天下，考音韵地理，著日知录音学五书，讲经世之学，砥砺人材风俗
  phases:
  - key: brewing
    name: 明亡弃举业游历四方
    labels:
      zh:
