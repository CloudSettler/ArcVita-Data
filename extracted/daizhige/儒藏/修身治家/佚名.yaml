  title_zh: 撰述劝报亲恩篇述孝亲与亲恩
  summary: 以俚俗歌诀述孝亲工夫与怀胎乳哺养育之恩，劝世及时行孝
  phases:
  - key: brewing
    name: 观风酝酿
