    highlight_event_id: guji-佚名-event-2
  decisions:
  - date: '1760-01-01'
    title_zh: 以俚言歌诀劝孝
    rationale: 使妇孺皆解，故不用文言而用三字七字俚语，反复言孝
  - date: '1770-01-01'
    title_zh: 详述三年乳哺劬劳
    rationale: 人多忘本，故备述怀胎分娩，偎干就湿，养育婚娶之劳，使知恩重难报
- id: guji-佚名-endeavor-2
  title_zh: 劝睦兄弟并总劝流传
  summary: 劝兄弟和睦以悦亲心，并总劝报恩循环，使善书流传乡里
  phases:
  - key: brewing
    name: 察兄弟争竞
    labels:
      zh:
      - 酝酿
    start_date: '1780-01-01'
    highlight_event_id: guji-佚名-event-3
  - key: breakthrough
    name: 立睦族之论
    labels:
      zh:
      - 突破
    start_date: '1785-01-01'
    highlight_event_id: guji-佚名-event-3
  - key: climax
    name: 总劝报恩循环
    labels:
      zh:
      - 高潮
    start_date: '1790-01-01'
    highlight_event_id: guji-佚名-event-4
  - key: closure
    name: 付刻流传
    labels:
      zh:
      - 收束
    start_date: '1795-01-01'
    highlight_event_id: guji-佚名-event-4
  decisions:
  - date: '1785-01-01'
    title_zh: 以兄弟和睦为孝
    rationale: 兄弟参商则亲心不安，故引紫荆桃园及沈仁沈义之事，劝兄宽弟忍
  - date: '1790-01-01'
    title_zh: 隐名付刊不求闻达
    rationale: 欲人只存孝心而不慕作者之名，故托为佚名善书，任人传抄讽诵
events:
- id: guji-佚名-event-birth
  title_zh: 出生
  date: '1700-01-01'
  year_of: 1700
  description: 清代生人，籍贯生年俱不详，姑系为清中期人士
- id: guji-佚名-event-death
  title_zh: 逝世
  date: '1900-12-31'
  year_of: 1900
  description: 清末去世，具体年月不详，生平不入史传，仅以善书传世
- id: guji-佚名-event-1
  title_zh: 述孝亲工夫成篇首二节
  date: '1760-01-01'
  year_of: 1760
  description: 作劝报亲恩篇一二节，言孝贵心诚，和悦耐烦，晨昏定省，戒淫赌，惜谷字，婉谏亲过，善事继母孤亲
  endeavor_ref: guji-佚名-endeavor-1
- id: guji-佚名-event-2
  title_zh: 述怀胎乳哺养育恩成第三节
  date: '1770-01-01'
  year_of: 1770
  description: 作第三节，备述十月怀胎，临产九死，三年乳哺，偎干就湿，延医延师，婚娶操劳，劝勿听妻言而忘亲恩
  endeavor_ref: guji-佚名-endeavor-1
- id: guji-佚名-event-3
  title_zh: 劝兄弟和睦成第四节
  date: '1785-01-01'
  year_of: 1785
  description: 作第四节，引紫荆复活，桃园结义，牛宏彦霄，沈仁沈义抚宪劝和之事，劝莫因嫡庶妯娌奴仆而伤手足
  endeavor_ref: guji-佚名-endeavor-2
- id: guji-佚名-event-4
  title_zh: 总劝报恩循环成第五节流传
  date: '1790-01-01'
  year_of: 1790
  description: 作第五节总束，以父母恩深似海，生儿育女循环相报作结，付刊流传，劝家贫亦可尽孝，鸟兽尚知哺育
  endeavor_ref: guji-佚名-endeavor-2
