  lesson: 察荣枯之常通圆融之变，不拘虚名以全身济世
  summary_first_person: 吾长乐老也，生于乱世，历事数朝，见荣者多以媚存，枯者多以直亡，故著荣枯鉴十卷，言圆通闻达解厄之术，非教人为奸，但求明哲全身，于进退存亡之际有所鉴耳
