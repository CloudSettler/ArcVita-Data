  - date: '1765'
    title_zh: 断以节欲为养生第一义
    rationale: 精竭则死，药不能补，不如一宵独卧正念照心
  - date: '1770'
    title_zh: 示将心比心速止淫念法
    rationale: 视人妻女如己妻女，思报应杀害折福以猛省回头
events:
- id: guji-别樵居士-event-birth
  date: '1720'
  year_of: 1720
  title_zh: 生于汉阳
  description_zh: 清乾隆初约生于汉阳，自号别樵居士，潜心儒释修身治家之学
- id: guji-别樵居士-event-1
  date: '1762'
  year_of: 1762
  title_zh: 发愿辑家庭宝筏总论
  description_zh: 感时风浇漓色害戕生，采罗念庵薛文清慈受禅师莲池大师等语，立天堂地狱判于一心之总论
- id: guji-别樵居士-event-2
  date: '1772'
  year_of: 1772
  title_zh: 家庭宝筏成编示好色必死
  description_zh: 成杜邪避嫌肃闺严教丧祭远虑御下宴会出外居官诸条，次论好色必死节欲保生，劝世布种传灯流布
- id: guji-别樵居士-event-death
  date: '1790'
  year_of: 1790
  title_zh: 卒于故里
  description_zh: 约乾嘉之际卒，遗编家庭宝筏流传于世，劝人以清净自居永脱众苦
