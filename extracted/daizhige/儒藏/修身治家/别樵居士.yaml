    title_zh: 以家庭为劝化本位
    rationale: 以家为修身之本，杜邪肃闺严教以绝淫源
  - date: '1768'
    title_zh: 引彭启丰姚庭若等言入编
    rationale: 借先贤布种传灯之喻，劝人以劝十百千流布后世
- id: guji-别樵居士-endeavor-2
  title_zh: 倡节欲保生居家修身
  summary_zh: 论好色必死伤生之理，教少年节欲慎婚，正源治本以全精气
  phases:
  - key: brewing
    name: 察少年夭殁之由
    labels:
