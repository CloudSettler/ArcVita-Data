  - title_zh: 变法与祖制之争
    description_zh: 熙宁新法纷起，坚持祖制不可轻变，宁退居洛阳十五年而不附新法
  - title_zh: 富贵与清俭之辨
    description_zh: 位至宰相而布衣蔬食，以为多藏遗子孙适足以长恶，惟以德礼廉俭遗后
  lesson: 修身齐家而后治国，忍让均俭以保宗族，史以资治，礼以正家
  summary_first_person: 吾涑水司马光，一生以史资治，以礼齐家，早年登第入朝，晚年退居洛阳成通鉴，又采史传嘉言善行著家范十卷，示后学以正家睦族之准绳，愿子孙以清白传家，以忍俭保家
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%BF%AE%E8%BA%AB%E6%B2%BB%E5%AE%B6/%E5%AE%B6%E8%8C%83.html
