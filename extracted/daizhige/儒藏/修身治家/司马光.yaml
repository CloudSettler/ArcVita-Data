  - date: 1086-06-01
    title_zh: 拜左仆射尽罢新法
    rationale: 与民休息复旧制，以俭素正朝廷，以忠厚安宗族百姓
events:
- id: guji-司马光-event-birth
  title_zh: 诞生于陕州夏县
  date: 1019-11-17
  year_of: 1019
  place_zh: 陕州夏县涑水乡
  description_zh: 宋真宗天禧三年十月十八日生，父司马池，名光，字君实，号迂叟
- id: guji-司马光-event-jinshi
  title_zh: 宝元进士甲科及第
  date: 1038-04-01
  year_of: 1038
  place_zh: 开封
  description_zh: 仁宗宝元元年进士，授奉礼郎，入馆阁，历仕仁宗英宗神宗三朝，以直谏闻
- id: guji-司马光-event-tongzhi
  title_zh: 受诏编修通志
  date: 1066-04-01
  year_of: 1066
  place_zh: 开封史馆
  description_zh: 英宗治平三年置局修书，命光领其事，神宗赐名资治通鉴，许自辟属官借官书
- id: guji-司马光-event-luoyang
  title_zh: 退居洛阳独乐园著书
  date: 1071-06-01
  year_of: 1071
  place_zh: 洛阳独乐园
  description_zh: 熙宁四年以端明殿学士判西京御史台，退居洛阳十五年，专意著史，晨夕不辍
- id: guji-司马光-event-tongjian
  title_zh: 资治通鉴书成进御
  date: 1084-12-01
  year_of: 1084
  place_zh: 洛阳
  description_zh: 神宗元丰七年全书二百九十四卷成，起周威烈王至后周世宗，神宗亲为制序
- id: guji-司马光-event-jiafan
  title_zh: 撰成家范十卷
  date: 1085-03-01
  year_of: 1085
  place_zh: 洛阳
  description_zh: 杂采史传嘉言善行，自治家至乳母凡十九篇，首载家人卦辞大学孝经之语为序，示后学准绳
- id: guji-司马光-event-zaixiang
  title_zh: 元祐拜尚书左仆射
  date: 1086-06-01
  year_of: 1086
  place_zh: 开封
  description_zh: 哲宗元祐元年入相，更化旧制，罢青苗复常平，海内翕然，民呼为司马相公
- id: guji-司马光-event-death
  title_zh: 病逝于京师
  date: 1086-10-11
  year_of: 1086
  place_zh: 开封
  description_zh: 元祐元年九月庚子日卒，年六十八，赠温国公，谥文正，海内为之罢市，追惜不已
