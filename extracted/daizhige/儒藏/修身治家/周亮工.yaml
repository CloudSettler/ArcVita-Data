events:
- id: guji-周亮工-event-birth
  title_zh: 出生于祥符
  date: '1612'
  year_of: 1612
  kind: birth
  description_zh: 明万历四十年生于河南祥符，字元亮，一字减斋，号栎园栎下先生
- id: guji-周亮工-event-jinshi
  title_zh: 中庚辰进士
  date: '1640'
  year_of: 1640
  kind: career
  description_zh: 中庚辰进士，材器挥霍善经济，吏当大疑难剸断迎刃而解，累官少司农
- id: guji-周亮工-event-visiting
  title_zh: 宦辙访才置簿记名
  date: '1655'
  year_of: 1655
  kind: career
  description_zh: 宦辙所至置一簿坐上，记海内人才，有读书能文名者必枉车过之，或拂席开阁，令进其所知
- id: guji-周亮工-event-burial
  title_zh: 在闽葬赵璧陈鸿
  date: '1656'
  year_of: 1656
  kind: career
  description_zh: 在闽见词人赵十五璧陈叔度鸿没不能葬，出俸金葬之西郊，题曰词人赵十五陈叔度墓，时渍酒其下
- id: guji-周亮工-event-promotion
  title_zh: 累官少司农兼勤绘事著述
  date: '1661'
  year_of: 1661
  kind: career
  description_zh: 累官少司农，性严岸不假借，好嘉与后进，每天明谈说古今图史书画，客退手一卷至夜分，著述多至数十种
- id: guji-周亮工-event-death
  title_zh: 逝世
  date: '1672'
  year_of: 1672
  kind: death
  description_zh: 清康熙十一年卒，一生奖掖后进，葬恤词人，以著述绘事传世
