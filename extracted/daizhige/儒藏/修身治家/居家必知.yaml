    highlight_event_id: guji-居家必知-event-2
  decisions:
  - date: '1702-06-15'
    title_zh: 灶下不堆柴草厨中常满水缸
    rationale: 水火无情多起于灶厨，大风久旱更须扫净余草远堆柴薪以断火路
  - date: '1708-11-10'
    title_zh: 人上床则火下床改用锡汤壶
    rationale: 奴婢老人贪暖留火笼过夜最易沉睡失火，汤壶布包既暖且安
