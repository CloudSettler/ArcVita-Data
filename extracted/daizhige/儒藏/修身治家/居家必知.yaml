  - 夜间守更劳众扰眠与放任盗起的两难
  - 寒夜取暖安卧与谨防火烛的两难
  lesson: 居家以预防为本，盗火皆在平时修垣慎火约众相救
  summary_first_person: 我一生所记皆是守屋护家之事，白日修墙垣备器械，夜里约纺织守更，寒暑谨火烛，荒年暗施米谷，只愿一家老小安稳，邻里相安
