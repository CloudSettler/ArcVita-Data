  decisions:
  - date: '1705-09-15'
    title_zh: 每月晦朔躬率男女纺织守夜
    rationale: 盗多乘无月黑夜而入，纺织不眠则响动即觉，屋上置瓦石可惊退盗贼
  - date: '1710-11-20'
    title_zh: 约同庄少壮轮流巡更呐喊
    rationale: 一家之力单薄，约众执枪棍梆锣轮巡，令小人知畏而歹念自消
- id: guji-居家必知-endeavor-2
  title_zh: 慎火烛兼理文房日用
  summary: 自灶下灯火以至烘被汤壶皆立规矩，又兼晒书藏墨洗砚诸法以安家业
