  - key: climax
    name: 晒书薰香以辟蠹
    labels:
      zh: 护书传家
    start_date: '1712-07-01'
    highlight_event_id: guji-居家必知-event-2
  - key: closure
    name: 积炭辨炭以备寒
    labels:
