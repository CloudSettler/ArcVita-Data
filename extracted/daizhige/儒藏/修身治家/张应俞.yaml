  decisions:
  - date: 1616-01-01
    title_zh: 决定每则附按语发明防法
    rationale: 徒述棍术恐止资谈柄，须明断其假道灭虢欲取姑与之机，教人关防不密之失
  - date: 1617-01-01
    title_zh: 决定托存仁堂陈怀轩刊本行世
    rationale: 欲广流布以救白昼被迷之祸，借善堂刊刻与熊振骥序文取信于众
events:
- id: guji-张应俞-event-birth
  title_zh: 生于浙江
  date: 1570-01-01
  year_of: 1570
  type: birth
  description: 明万历前后生于浙江，号蘷衷，生平不详，少历江湖，习见市井骗局
- id: guji-张应俞-event-compile
  title_zh: 历览采集成八十三则
  date: 1610-01-01
  year_of: 1610
  type: career
  description: 久历年冬市道，采集假马脱缎先寄银拐逃明骗贩猪乘闹窃布等事，渐积分脱剥以至引嫖二十四类，共八十三则
- id: guji-张应俞-event-publish
  title_zh: 存仁堂刊刻杜骗新书熊振骥序
  date: 1617-01-01
  year_of: 1617
  type: career
  description: 明万历四十五年，书成四卷，托存仁堂陈怀轩刻本行世，熊振骥为序，题浙江蘷衷张应俞著，列为儒藏修身治家之属
- id: guji-张应俞-event-death
  title_zh: 逝世
  date: 1630-01-01
  year_of: 1630
  type: death
  description: 明末前后卒，卒年不详，其书流传为后世防骗警世之祖
