  decisions:
  - date: 1610-01-01
    title_zh: 决定亲历采访而不托空言
    rationale: 骗局多在马头铺店舟车间，非亲闻目见则情状不真，故须历览而后可信
  - date: 1615-01-01
    title_zh: 决定以类统则以术命名
    rationale: 脱剥丢包换银以至僧道法术各殊，分类二十四则纲举目张，便于商旅查览防微
- id: guji-张应俞-endeavor-2
  title_zh: 分门撰按刊刻杜骗新书
  summary: 以四卷八十三则成书，附按语评断，托存仁堂陈怀轩刊行警世
