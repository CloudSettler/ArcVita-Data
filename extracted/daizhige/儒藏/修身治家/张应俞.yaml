  archetype: 警世防骗著述家
  dilemmas:
  - 江湖棍术百出而良善屡堕彀中，欲揭露则须亲历采集，恐力薄而难全
  - 欲以类编次直书骗局，又恐启奸，反须附按语以劝善防微
  lesson: 小人之计甚诡，君子之防宜密，历览预知则不堕彀中
  summary_first_person: 吾浙江张应俞也，见世人多堕脱剥丢包换银诸局，白昼被迷，讼累不解，遂历览江湖，采集八十余则，分为二十四类，附按语以断之，名曰江湖历览杜骗新书，愿后人读之而烛其伪，不为棍徒所愚
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%BF%AE%E8%BA%AB%E6%B2%BB%E5%AE%B6/%E6%9D%9C%E9%AA%97%E6%96%B0%E4%B9%A6.html
