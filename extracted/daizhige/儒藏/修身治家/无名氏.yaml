  lesson: 以实用存礼教使居家有法日用有据不求闻达而惠后人
  summary_first_person: 吾元之布衣也姓名不传惟以居家日用为念辑朱颜司马袁氏之训与仕宦宅舍农桑之法分甲乙丙丁戊五集合为一书愿后之居家者开卷有用则吾志足矣
