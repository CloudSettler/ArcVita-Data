    description: 明亡之后是应征出仕还是坚守故国之节隐居不仕以全晚节
  - title_zh: 治家之道
    description: 世风侈靡伦常乖舛之际如何以俭约质朴和顺持家以诗书义方教子
  lesson: 一粥一饭当思来处不易，半丝半缕恒念物力维艰，守分安命，质朴持家，读书志在圣贤
  summary_first_person: 我是朱用纯，字致一，号柏庐，昆山人，明亡后绝意仕进，隐居乡里，讲学授徒，晚年有感世俗奢靡，作治家格言五百余言，晓谕子孙黎明即起，洒扫庭除，俭约持家，诚敬祭祀，勤读经书，但愿家门和顺，守分安命，近于圣贤之道
  source_urls:
