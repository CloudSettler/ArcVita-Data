  summary_first_person: 余瓮斋老人，生于乡而老于乡，闲病抑郁经年，试坐坐苦试行行苦，感亲友慰问而于苦中寻乐，追忆七十年间故乡谣谚歌诵耳熟能详者，念之于口而笔之于书，部以天地人物名曰乡言解颐，聊为解颐，亦以示子孙不忘乡俗乡音
