  dilemmas:
  - 少孤家窭先祀将坠，是安于困顿还是母织供学以承家
  - 在幕在官利禄当前，是苟取速达还是尽心竭力不造孽
  lesson: 以尽心立本，以厚传家，耐困境守恒认真，方能仰承先泽下裕后昆
  summary_first_person: 我汪辉祖字焕曾，一字龙庄，晚号归庐，萧山大义邨人，少孤多病家窭，赖嫡母王氏生母徐氏织纴供学，日诵感应以自儆，习幕多年，登乾隆戊子举人乙未进士，宰宁远署道州，告病归里，作双节堂庸训六卷以述先律己治家应世，愿后人厚以传世
  source_urls:
  - https://daizhige.org/儒藏/修身治家/雙節堂庸訓.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/修身治家/雙節堂庸訓.md
