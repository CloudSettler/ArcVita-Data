  archetype: 山林修身立言者
  dilemmas:
  - 出仕求显与归隐保真之间何去何从
  - 儒释道三教会通时如何不失本心
  - 立事功与立言传世之间轻重如何衡量
  lesson: 咬得菜根则百事可为，守得淡泊方能致远
  summary_first_person: 吾洪应明，自号还初道人，万历间蜀中隐士，遍参儒释道之书，深信浓艳中有淡泊真味，纷纭中有镇定工夫，故采格言辑为菜根谭，又辑仙佛奇踪，愿后人咬菜根以炼性，处卑微而不苟，安闲适以全真。
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E4%BF%AE%E8%BA%AB%E6%B2%BB%E5%AE%B6/%E8%8F%9C%E6%A0%B9%E8%B0%AD.html
