- id: guji-洪应明-event-compile
  type: career
  title_zh: 始辑菜根谭格言
  date: 1590
  year_of: 1590
  place_zh: 山林别业
  summary_zh: 万历中叶，取咬得菜根百事可做之意，分修身应酬评议闲适四门，纂辑成帙。
- id: guji-洪应明-event-xianfo
