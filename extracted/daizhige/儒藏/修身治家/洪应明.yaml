endeavors:
- id: guji-洪应明-endeavor-1
  title_zh: 编著菜根谭
  summary_zh: 融儒摄释道，分修身应酬评议闲适四卷，以菜根为喻，阐淡泊明志镇定应世之道。
  phases:
  - key: brewing
    name: 博览涵养
    labels:
      zh: 栖心典籍
    start_date: 1570
    highlight_event_id: guji-洪应明-event-study
  - key: breakthrough
    name: 会通三教
    labels:
      zh: 参悟菜根
    start_date: 1585
    highlight_event_id: guji-洪应明-event-compile
  - key: climax
    name: 分门纂辑
    labels:
      zh: 立言成书
    start_date: 1590
    highlight_event_id: guji-洪应明-event-compile
  - key: closure
    name: 校雠流传
    labels:
      zh: 付梓传世
    start_date: 1595
    highlight_event_id: guji-洪应明-event-xianfo
  decisions:
  - date: 1588
    title_zh: 以菜根为书名立言
    rationale: 菜根粗粝而滋味深长，以喻淡泊中真味，欲警世人舍肥甘就清苦以炼性
  - date: 1590
    title_zh: 分四卷统摄身心世缘
    rationale: 修身为本，应酬为用，评议以明眼，闲适以养心，体用兼备方能超尘而不离尘
- id: guji-洪应明-endeavor-2
  title_zh: 辑仙佛奇踪并归隐修行
  summary_zh: 搜辑历代仙佛异迹，兼明出世襟期，终栖心山林，以著述全其性命之学。
  phases:
  - key: brewing
    name: 访道栖隐
    labels:
      zh: 淡泊养真
    start_date: 1575
    highlight_event_id: guji-洪应明-event-study
  - key: breakthrough
    name: 转向仙佛
    labels:
      zh: 穷究性命
    start_date: 1595
    highlight_event_id: guji-洪应明-event-compile
  - key: climax
    name: 撰辑奇踪
    labels:
      zh: 表章幽异
    start_date: 1602
    highlight_event_id: guji-洪应明-event-xianfo
  - key: closure
    name: 还初归真
    labels:
      zh: 山林善终
    start_date: 1605
    highlight_event_id: guji-洪应明-event-death
  decisions:
  - date: 1600
    title_zh: 不求仕进专事著述
    rationale: 见仕途赫奕多倾覆，不如以笔墨立教，藏身林下以全冲雅之节
  - date: 1602
    title_zh: 辑仙佛奇踪以补菜根谭
    rationale: 菜根谭言世法，仙佛事言出世法，一显一隐，方显圣凡同源性命一理
events:
