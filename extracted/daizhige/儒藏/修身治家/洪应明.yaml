- id: guji-洪应明-event-death
  type: death
  title_zh: 洪应明逝世
  date: 约1609
  year_of: 1609
  place_zh: 蜀地
  summary_zh: 万历末年归隐而终，其书初秘于残经败纸，后经遂初堂主人校雠而大显于世。
