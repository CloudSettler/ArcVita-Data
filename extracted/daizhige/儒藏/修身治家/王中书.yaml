    start_date: 1770
    highlight_event_id: guji-王中书-event-1
  decisions:
  - date: 1750
    title_zh: 决定不用文言而用俚言
    rationale: 使愚夫愚妇皆能诵解方能广劝孝道
  - date: 1760
    title_zh: 决定备列养育细节以感发天性
    rationale: 先述母卧湿就干与父延师课读之苦使人知罔极之恩难报
- id: guji-王中书-endeavor-2
  person_qid: guji-王中书
  title_zh: 引古劝今化导乡里下篇
  summary: 举王祥孟宗蔡顺杨香等古人孝行及慈乌反哺为证警戒忤逆难容天地劝人早悔添福
