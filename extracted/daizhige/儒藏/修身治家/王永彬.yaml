    highlight_event_id: guji-王永彬-event-teaching
  decisions:
  - date: '1830'
    title_zh: 安守农籍不事词讼
    rationale: 种田人改习廛市词讼定入下流，故守耕读本业以保家风清正。
  - date: '1835'
    title_zh: 教子先严后宽立品行
    rationale: 求显荣不如立品行，故教小儿宜严，教子弟以品行为先。
