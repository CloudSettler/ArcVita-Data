    title_zh: 以浅辞芜语课家人
    rationale: 语无伦次意浅辞芜不足为外人道，但求课家人消永夜，故直录心得不饰文采。
  - date: '1854-03-24'
    title_zh: 请正于有道君子
    rationale: 自知多非信心之论，故虚怀求益不自矜伐，愿蒙君子惠而正之。
