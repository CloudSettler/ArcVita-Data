endeavors:
- id: guji-苏瓌-endeavor-1
  person_id: guji-苏瓌
  title_zh: 历牧守正拜相辅政
  summary: 弱冠登第历州县以清正闻，长安中任尚书右丞直绳不挠，神龙初拜侍中参知政事佐定国策
  phases:
  - key: brewing
