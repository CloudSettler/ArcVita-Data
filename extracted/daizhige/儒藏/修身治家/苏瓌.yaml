    labels:
      zh: 直道守正
    start_date: '0701'
    highlight_event_id: guji-苏瓌-event-shangshu
  - key: climax
    name: 神龙拜相佐命定策
    labels:
      zh: 佐命定策
    start_date: '0705'
    highlight_event_id: guji-苏瓌-event-zaixiang
  - key: closure
    name: 晚年戒子成龟镜篇
    labels:
      zh: 戒子传道
    start_date: 0708
    highlight_event_id: guji-苏瓌-event-guijing
  decisions:
  - date: '0705'
    title_zh: 临大事断大议以正道当之不能则速退
    rationale: 中枢之地非偷安之所，不以道应命则上阻交泰下阻阜植，故当守正退让
  - date: '0706'
    title_zh: 举官将帅必用材德听众议定是非
    rationale: 人有贤愚器局各异，惟公听并观随器任使，方能事无不举而无失根本
- id: guji-苏瓌-endeavor-2
  person_id: guji-苏瓌
  title_zh: 安边恤民清白治家
  summary: 主张刺史县令久任谨守制度，边将严兵守疆不务广地，清身检下远妻族约子弟以保家治国
  phases:
  - key: brewing
    name: 久任牧守体察民隐
    labels:
      zh: 恤民求安
    start_date: 0685
    highlight_event_id: guji-苏瓌-event-shangshu
  - key: breakthrough
    name: 建言谨守中典慎用刑赦
    labels:
      zh: 守制慎刑
    start_date: '0705'
    highlight_event_id: guji-苏瓌-event-zaixiang
  - key: climax
    name: 严兵守边不务广地耗中
    labels:
      zh: 安边固本
    start_date: '0706'
    highlight_event_id: guji-苏瓌-event-zaixiang
  - key: closure
    name: 清身约族以廉保家
    labels:
      zh: 清廉传家
    start_date: 0708
    highlight_event_id: guji-苏瓌-event-guijing
  decisions:
  - date: '0706'
    title_zh: 刺史县令久次居官不能者立除勿以奸柄施恩
    rationale: 欲庶而富在乎久安，交驰道路则失为官之意，久任责成方能民情胶固
  - date: 0708
    title_zh: 财不私蓄散于亲族远妻族检子弟车服居第
    rationale: 多蓄害义令人心不宁，妻族子弟开户牖则纲纪难提，故当洁俭守家以治国
