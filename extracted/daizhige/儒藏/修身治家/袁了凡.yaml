  birth_date: 1533
  death_date: 1606
  era: 明
  reign_ref: 明嘉靖至万历
  archetype: 立命自求者
  dilemmas:
  - 孔先生算定荣辱生死皆验澹然无求与云谷所言命由我作福自己求之间何去何从
  - 誓行三千善一万善而见善行之不勇救人心常自疑功过相折如何坚持圆满
  - 宝坻衙中无事可行万善难完与合县减粮一念当万善之间如何利民践愿
  lesson: 命由我作福自己求日日知非日日改过积善包荒和爱惜神谦德不息则天作之孽可违
  summary_first_person: 余童年丧父母命弃举业学医后遇孔先生算定科名贡宦及五十三岁八月十四日丑时终于正寝无子皆验后访云谷禅师于栖霞对坐三昼夜悟极善极恶数拘不定改号了凡誓行三千善求登科持准提旦夕登记逾十年而完复求子得天启复许万善求进士丙戌登第宰宝坻减粮惠民逾算定之厄今六十九作此四训以训汝
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
  - https://daizhige.org/
