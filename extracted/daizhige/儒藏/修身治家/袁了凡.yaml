    rationale: 晨夕记善恶纤悉必录以治身过以俟天命
  - date: 1587
    title_zh: 区处宝坻田粮由二分三厘七毫减至一分四厘六毫
    rationale: 善心真切一行可当万善合县受福以完万善之愿
