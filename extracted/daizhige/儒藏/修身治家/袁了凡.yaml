    title_zh: 捐俸请五台斋僧一万回向减粮之事
    rationale: 以众善回向固惠民之果报天地祖宗之德
events:
- id: guji-袁了凡-event-birth
  title_zh: 童年丧父生于嘉善
  date: 1533
  year_of: 1533
  description_zh: 明嘉靖十二年生袁氏原名黄字坤仪母命弃举业学医以养生济人成父夙心
- id: guji-袁了凡-event-kong
  title_zh: 慈云寺遇孔先生算定终身
  date: 1548
  year_of: 1548
  description_zh: 遇云南孔姓老人得邵子皇极数试之纤悉皆验悬定县考十四名府考七十一名提学第九名及补廪出贡选四川大尹任三年半五十三岁八月十四日丑时终无子明年赴考三处名数皆合食廪九十一石五斗出贡亦验遂澹然无求
- id: guji-袁了凡-event-yungu
  title_zh: 栖霞访云谷禅师改号了凡
  date: 1569
  year_of: 1569
  description_zh: 贡入燕都留京一年己巳归游南雍访云谷于栖霞对坐三昼夜不生妄念闻极善极恶数拘不定之论悟立命之说改初号学海为今号了凡拜受功过格持准提咒
- id: guji-袁了凡-event-firstzhong
  title_zh: 礼部考第一秋闱中式
  date: 1570
  year_of: 1570
  description_zh: 明年礼部考孔算第三忽考第一孔言不验而秋闱中式然行义未纯以过折功日常虚度
- id: guji-袁了凡-event-son
  title_zh: 十年完三千善辛巳生子天启
  date: 1581
  year_of: 1581
  description_zh: 自己巳发愿至己卯历十余年三千善行始完庚辰南还请性空慧空于东塔回向起求子愿亦许三千辛巳生男天启每行一事笔记母以鹅毛管印朱圈于历日
- id: guji-袁了凡-event-wanshan
  title_zh: 癸未完三千九月起求进士愿许万善
  date: 1583
  year_of: 1583
  description_zh: 至癸未八月三千之数已满请性空辈家庭回向九月十三日复起求中进士愿许行善事一万条
- id: guji-袁了凡-event-jinshi
  title_zh: 丙戌登第授宝坻知县
  date: 1586
  year_of: 1586
  description_zh: 丙戌登第授直隶宝坻知县置治心篇晨起坐堂家人付门役置案上夜设桌于庭焚香告帝
- id: guji-袁了凡-event-jianliang
  title_zh: 宝坻减粮梦神告万行俱完
  date: 1587
  year_of: 1587
  description_zh: 母忧衙中无事可行万善难完夜梦神人告只减粮一节万行俱完将每亩二分三厘七毫减至一分四厘六毫问幻余禅师云善心真切即一行可当万善遂捐俸就五台斋僧一万回向
- id: guji-袁了凡-event-yue
  title_zh: 逾五十三岁之厄今六十九
  date: 1585
  year_of: 1585
  description_zh: 孔公算五十三岁有厄未尝祈寿是岁竟无恙今六十九乃知天难谌命靡常祸福自己求者乃圣贤之言
- id: guji-袁了凡-event-book
  title_zh: 作了凡四训立命改过积善谦德
  date: 1601
  year_of: 1601
  description_zh: 以己验立命之说作第一篇立命第二篇改过发耻畏勇三心第三篇积善辨真假端曲阴阳是非偏正半满大小难易第四篇谦德训子日日知非改过毋自旷
- id: guji-袁了凡-event-death
  title_zh: 卒于万历间
  date: 1606
  year_of: 1606
  description_zh: 万历三十四年卒享年七十四以立命积善之效逾算定寿数其书流传天下劝善改过
