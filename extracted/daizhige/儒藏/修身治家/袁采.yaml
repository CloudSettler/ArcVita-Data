  date: '1193'
  year_of: 1193
  place_zh: 临安登闻检院
  summary: 仕至监登闻检院，持廉明刚直，达民冤抑，不避贵势，时论称美
- id: guji-袁采-event-death
  title_zh: 卒于官守之后
  date: '1195'
  year_of: 1195
  place_zh: 信安故里
  summary: 约宋庆元元年卒，世范三卷赖永乐大典宋本流传，为颜氏家训之亚
