  birth_date: '1140'
  death_date: '1195'
  era: 南宋
  reign_ref: 孝宗乾道至宁宗庆元
  archetype: 廉明循吏
  dilemmas:
  - title_zh: 性禀不同如何致和
    description: 父子兄弟性或宽缓褊急刚暴柔懦不同，互欲同于己则争论不胜，须通情仰承，和颜几谏以致和协
  - title_zh: 慈宽严峻如何得中
    description: 慈父多败子，遇强则避遇弱则肆，须以他人不肖喻己，慈爱与孝敬相济，不偏胜而无纵暴
  lesson: 反求自省，随事解忍，先下气和众，均平公心，则家道可久，讼争不兴
  summary_first_person: 吾袁采字君载，信安人，登进士第，宰乐清政和剧邑，以廉明刚直自持，后监登闻检院，见末俗父子兄弟夫妇多乖争破家，故作训俗三门，名曰世范，愿人人诚笃忍让，均平勤业，以全天伦
  source_urls:
  - https://daizhige.org/ru-zang/xiu-shen-zhi-jia/shi-fan.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/ru-zang/xiu-shen-zhi-jia/shi-fan.md
endeavors:
- id: guji-袁采-endeavor-1
  title_zh: 宰乐清训俗著世范
  summary: 在乐清修县志十卷，察民间争财失欢之由，分睦亲处己治家三门作训俗，后更名世范，以砥砺末俗
  phases:
  - key: brewing
    name: 登第宰剧邑
    labels:
      zh: 廉明刚直
    start_date: '1172'
    highlight_event_id: guji-袁采-event-leqing
  - key: breakthrough
    name: 修志察俗
    labels:
      zh: 睦亲处己
    start_date: '1176'
    highlight_event_id: guji-袁采-event-leqing
  - key: climax
    name: 作训俗三卷
    labels:
      zh: 治家教化
    start_date: '1178'
    highlight_event_id: guji-袁采-event-shifan
  - key: closure
    name: 刘镇序名世范
    labels:
      zh: 流传天下
    start_date: '1179'
    highlight_event_id: guji-袁采-event-shifan
  decisions:
  - date: '1176'
    title_zh: 修乐清县志十卷
    rationale: 宰剧邑欲知风俗利病，故修志以考镜得失，为训俗立实据
  - date: '1178'
    title_zh: 立睦亲处己治家三门
    rationale: 人伦不和根于性异财争，若不详尽反复示以忍让均平之道，则览者不知所从，故详为训诫求通俗易行
- id: guji-袁采-endeavor-2
  title_zh: 宰政和监登闻持正
  summary: 宰政和著政和杂志县令小录，以刚直廉明称，后监登闻检院，持法平允，不以贵势夺理
  phases:
  - key: brewing
    name: 移宰政和
    labels:
      zh: 勤谨爱民
    start_date: '1185'
    highlight_event_id: guji-袁采-event-zhenghe
  - key: breakthrough
    name: 著杂志小录
    labels:
      zh: 循吏经验
    start_date: '1188'
    highlight_event_id: guji-袁采-event-zhenghe
  - key: climax
    name: 以廉明刚直称
    labels:
      zh: 不阿权贵
    start_date: '1190'
    highlight_event_id: guji-袁采-event-zhenghe
  - key: closure
    name: 监登闻检院
    labels:
      zh: 达情察冤
    start_date: '1193'
    highlight_event_id: guji-袁采-event-jian院
  decisions:
  - date: '1188'
    title_zh: 著政和杂志示后
    rationale: 邑务繁杂易生奸弊，欲以亲历政事教后之君子，使知防微杜渐，不陷刑辟
  - date: '1193'
    title_zh: 监登闻持平进言
    rationale: 登闻达下情，若不刚直廉明则冤抑不伸，故守正不徇，以全朝廷恤民之意
