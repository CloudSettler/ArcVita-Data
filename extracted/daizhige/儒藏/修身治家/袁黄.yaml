events:
- id: guji-袁黄-event-birth
  title_zh: 出生嘉善
  date: 1533-12-26
  year_of: 1533
  description: 明嘉靖十二年生于嘉善童年丧父母命弃举业学医
- id: guji-袁黄-event-kong
  title_zh: 遇孔先生算定毕生
  date: 1548-03-01
  year_of: 1548
  description: 慈云寺遇云南孔老人得皇极数定科名贡选寿数子嗣悉验遂起读书念
- id: guji-袁黄-event-yungu
  title_zh: 栖霞参云谷悟立命改号了凡
  date: 1569-06-01
  year_of: 1569
  description: 访云谷于栖霞对坐三昼夜悟极善极恶数拘不定受立命改过之学改号了凡
- id: guji-袁黄-event-vow
  title_zh: 佛前发愿行三千善求登科
  date: 1569-07-01
  year_of: 1569
  description: 佛前发露昔罪立誓行善三千以求登科得功过格逐日记注持准提咒
- id: guji-袁黄-event-son
  title_zh: 礼部考第一辛巳得子天启
  date: 1581-03-01
  year_of: 1581
  description: 礼部考科举孔算当第三忽考第一后求子许三千善辛巳生男天启三千圆满回向
- id: guji-袁黄-event-jinshi
  title_zh: 丙戌登第授宝坻知县
  date: 1586-04-01
  year_of: 1586
  description: 丙戌登进士第授直隶宝坻知县置治心编日记善恶夜效告帝自省
- id: guji-袁黄-event-dream
  title_zh: 梦神示减粮可完万善
  date: 1588-06-01
  year_of: 1588
  description: 以衙中无事可行忧万善难完梦神人告以减粮一节万行俱完
- id: guji-袁黄-event-reduce
  title_zh: 减宝坻田赋捐俸斋僧
  date: 1588-07-01
  year_of: 1588
  description: 区处宝坻田赋由二分三厘七毫减至一分四厘六毫捐俸请五台斋僧万众回向
- id: guji-袁黄-event-writing
  title_zh: 寿逾孔算著训子书
  date: 1602-01-01
  year_of: 1602
  description: 孔算五十三岁有厄而安然逾之至六十九述立命改过积善谦德四篇以训子
- id: guji-袁黄-event-death
  title_zh: 万历中安逝
  date: 1606-08-16
  year_of: 1606
  description: 明万历三十四年逝世毕生以改过积善验立命之学留书垂后
