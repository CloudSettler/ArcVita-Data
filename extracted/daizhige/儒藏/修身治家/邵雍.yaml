  dilemmas:
  - title_zh: 出处之择
    detail: 屡荐授官皆辞不就，安居洛阳讲学，以隐守道
  - title_zh: 吉凶之辨
    detail: 吉人为善惟日不足，凶人为不善亦惟日不足，子孙当亲贤避恶
  lesson: 上品不教而善，中品教而后善，下品教亦不善，亲贤如就芝兰，避恶如畏蛇蝎，方为吉人
  summary_first_person: 吾少立志苦学，得先天之学，迁居洛阳安乐窝，著书讲学不仕，作戒子孙以告后人，愿汝等为吉人，日进于善，亲贤远恶
