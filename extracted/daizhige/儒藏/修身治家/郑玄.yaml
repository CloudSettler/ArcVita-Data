events:
- id: guji-郑玄-event-birth
  date: '0127'
  year_of: 127
  title_zh: 生于北海高密
  description_zh: 汉顺帝永建二年生于北海高密，家旧贫，为父母昆弟所容
- id: guji-郑玄-event-study
  date: '0142'
  year_of: 142
  title_zh: 游学周秦幽并兖豫
  description_zh: 去厮役之吏，游学周秦之都，往来幽并兖豫，觐在位通人，处逸大儒，博稽六艺，粗览传记，时睹秘书纬术之奥
- id: guji-郑玄-event-return
  date: 0168
  year_of: 168
  title_zh: 年过四十归养播殖
  description_zh: 年过四十乃归供养，假田播殖，以娱朝夕，后遇阉尹擅势，坐党禁锢十有四年
- id: guji-郑玄-event-refuse
  date: 0188
  year_of: 188
  title_zh: 蒙赦举辟辞不就
  description_zh: 蒙赦令举贤良方正有道辟大将军三司府公交车再召，自忖无任王臣，闻命罔从，黄巾为害萍浮南北复归邦乡
- id: guji-郑玄-event-precept
  date: 0197
  year_of: 197
  title_zh: 七十作戒子益恩书传家
  description_zh: 入此岁来已七十，案礼合传家，告老归事于益恩，勖求君子之道研钻勿替，憾亡亲坟垄未成群书腐敝不得写定传人
- id: guji-郑玄-event-death
  date: '0200'
  year_of: 200
  title_zh: 卒于建安五年
  description_zh: 建安五年卒于流离，终年七十四，一生以论赞之功传经，后人受其戒以勤力务时菲饮食薄衣服为念
