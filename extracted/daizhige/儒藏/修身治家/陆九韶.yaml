  birth_date: 1128
  death_date: 1205
  era: 南宋
  reign_ref: 宋孝宗至宋宁宗
  archetype: 儒者家训作者
  dilemmas:
  - 科举登第与孝悌忠信孰为本末
  - 丰奢鄙啬与量入为出孰能久家
  lesson: 得其本则末随，崇孝悌仁义而轻名利，量入为出，预备水旱，方得安宁和睦悠久
  summary_first_person: 吾老矣，深思熟虑日久，观世人教子惟逐科举名利，用度无法而致破家，故考古经国之制，述居家正本制用四篇，欲使子孙明本末守中道，虽招怒骂亦不恤
  source_urls:
  - https://daizhige.org/儒藏/修身治家/陸氏家制.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/修身治家/陸氏家制.md
endeavors:
- id: guji-陆九韶-endeavor-1
  title_zh: 述居家正本崇孝悌黜名利
  summary: 斥学校科举之弊，立教子先通经知古今修身之法
  phases:
  - key: brewing
    name: 观小学废坏慨然有怀
    labels:
      zh: 忧世教
    start_date: 1170
    highlight_event_id: guji-陆九韶-event-1
  - key: breakthrough
    name: 明求在我求在外之辨
    labels:
      zh: 立本末
    start_date: 1180
    highlight_event_id: guji-陆九韶-event-1
  - key: climax
    name: 成居家正本上下二篇
    labels:
      zh: 示正道
    start_date: 1185
    highlight_event_id: guji-陆九韶-event-1
  - key: closure
    name: 冒言垂训付乡曲子弟
    labels:
      zh: 付后人
    start_date: 1190
    highlight_event_id: guji-陆九韶-event-1
  decisions:
  - date: 1180
    title_zh: 舍科举之业先六经语孟
    rationale: 通经知古今修身为求在我者易得，命应仕宦亦无难，且能事君临民合义
  - date: 1185
    title_zh: 冒怒骂直言本末之理
    rationale: 谋名利遂者百一千一，趋末则本末俱废，得本则末随，信者稍众则贤才自盛
- id: guji-陆九韶-endeavor-2
  title_zh: 定居家制用量入为出备荒
  summary: 仿冢宰制国用之法，定十分收支祭存之准，戒七病以久家
  phases:
  - key: brewing
    name: 察居家破败原于无制
    labels:
      zh: 究病源
    start_date: 1190
    highlight_event_id: guji-陆九韶-event-2
  - key: breakthrough
    name: 立十分三存六用一祭之法
    labels:
      zh: 立中制
    start_date: 1195
    highlight_event_id: guji-陆九韶-event-2
  - key: climax
    name: 成居家制用上下二篇
    labels:
      zh: 详丰俭
    start_date: 1198
    highlight_event_id: guji-陆九韶-event-2
  - key: closure
    name: 示余财周济戒妄施僧道
    labels:
      zh: 劝仁惠
    start_date: 1200
    highlight_event_id: guji-陆九韶-event-2
  decisions:
  - date: 1195
    title_zh: 专存米谷逐年增置仓廪
    rationale: 量入为出留三分为水旱不测之备，三十年通制则虽凶旱民无菜色
  - date: 1198
    title_zh: 戒呼游饮食土木等七病
    rationale: 有一于此皆能破家，贫薄务周旋丰余尚鄙啬终害亦同，须先余后用谨戒侵过
events:
- id: guji-陆九韶-event-birth
  date: 1128
  year_of: 1128
  title_zh: 生于抚州金溪
  description: 建炎二年左右生于金溪陆氏，为梭山长兄，笃志经学，启弟辈象山之学
- id: guji-陆九韶-event-1
  date: 1180
  year_of: 1180
  title_zh: 述居家正本论教子本末
  description: 斥投名糊名取士绝灭礼义廉耻，主教子以孝悌忠信，先六经语孟后诸史，辨求在我求在外之分
- id: guji-陆九韶-event-2
  date: 1195
  year_of: 1195
  title_zh: 撰居家制用定家计之制
  description: 仿周官制国用，定田收十分之法，日用约三十分之一，戒七病，准丧婚丰约，周给贫弱而不妄施
- id: guji-陆九韶-event-death
  date: 1205
  year_of: 1205
  title_zh: 老成家训卒
  description: 开禧元年左右卒，一生以明本末守中道垂训乡曲，遗家制四篇行于世
