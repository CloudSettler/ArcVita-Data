  decisions:
  - date: '1730-01-01'
    title_zh: 以学校书院劝谕为治本
    rationale: 天下无不可教之人亦无可以不教之人，涵养德性必自蒙养闺门始
  - date: '1742-10-05'
    title_zh: 先教子复教女兼顾闺门
    rationale: 在家为女出嫁为妇生子为母，家人利在女贞故女教所系綦重
