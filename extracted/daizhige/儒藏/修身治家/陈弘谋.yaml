  - 女子久处深闺无师友诗书当如何施教
  - 尚文词才艺与敦敬顺大义孰为女德本末
  lesson: 有贤女而后有贤妇贤母，王化始于闺门，教女所系綦重
  summary_first_person: 我于养正遗规之后复采古今教女之书及有关女德者裒集成编，事取平易近人理取显浅易晓，欲世人既教子更教女以正家风
