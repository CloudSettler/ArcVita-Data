    highlight_event_id: guji-陈弘谋-event-compilation
  decisions:
  - date: '1742-01-01'
    title_zh: 以平易近人显浅易晓为采择之则
    rationale: 女子知书者少，必陈述故事讲说遗文乃可心领神会随事感发
  - date: '1742-10-05'
    title_zh: 卷首列曹大家女诫以为百代女师之则
    rationale: 大家以敬顺为主始卑弱终谦和，最切惩骄惰严礼法之对症良剂
- id: guji-陈弘谋-endeavor-2
  title_zh: 历官封疆兴学劝俗吏治教化合一
  summary_zh: 由翰林出任封疆，劝农兴学辑书化俗，以儒臣之学行循吏之政
  phases:
  - key: brewing
