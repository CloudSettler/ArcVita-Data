  dilemmas:
  - title_zh: 历仕乱朝全门还是洁身避祸
    description: 梁齐周隋四朝更迭屡为俘虏欲全兄弟骨肉又耻失节事人
  - title_zh: 慈爱纵子还是严教成德
    description: 见世人无教而有爱骄慢已习捶挞无威欲以严慈相济早教婴孩
  lesson: 门户不坠在勤学立行不在富贵积财不如以家训提撕子孙
  summary_first_person: 吾九岁丁荼蓼兄弟鞠养少爱属文肆欲轻言及长历侯景丧乱江陵倾覆流转齐周晚乃追思平昔指铭肌镂骨作二十篇以为汝曹后车愿诚孝慎言勤学自立
  source_urls:
  - https://daizhige.org/rucang/xiushenzhijia/yanshijiaxun.html
