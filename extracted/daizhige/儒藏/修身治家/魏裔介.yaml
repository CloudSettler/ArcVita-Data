    start_date: 1680
    highlight_event_id: guji-魏裔介-event-chengshu
  - key: closure
    name: 以书垂训后学
    labels:
      zh: 尽性立命
    start_date: 1686
    highlight_event_id: guji-魏裔介-event-death
  decisions:
  - date: 1675
    title_zh: 发愿辑先贤语录
    rationale: 一时劝人以口百世劝人以书欲使学者变化气质以敬存心
  - date: 1680
    title_zh: 分为学修己惇伦政术等门成书
    rationale: 为学只是学天理人伦汇众说而归尽性使习者有据而行
