  summary_first_person: 吾柏乡贞庵也，少逢鼎革，慨然以圣贤自期，入仕则以正风俗得贤才为务，在朝持心如水以义理为衡，退而纂琼琚佩语集格言以劝百世，愿学者敬胜百邪勤俭养福而已
