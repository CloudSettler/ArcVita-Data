  decisions:
  - date: 1646
    title_zh: 登进士授大理评事
    rationale: 以学致用由读书穷理而入经世吏治立慎独事君之基
  - date: 1654
    title_zh: 任御史陈时政得失
    rationale: 以正风俗重师儒进君子退小人为治本不避权贵
  - date: 1672
    title_zh: 晋保和殿大学士兼吏部尚书
    rationale: 持心如水以义理为权衡储才于平时以济事功
- id: guji-魏裔介-endeavor-2
  title_zh: 纂集琼琚佩语立言劝世
  summary: 汇集周程张朱薛文清及前贤格言分门别类成琼琚佩语以书劝百世以补政教之化
  phases:
  - key: brewing
    name: 平生蓄德读书
