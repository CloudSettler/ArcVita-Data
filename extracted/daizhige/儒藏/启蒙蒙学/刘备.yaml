  dilemmas:
  - 信义与功利如何取舍
  - 兄弟情义与战略大局如何平衡
  - 复汉理想与荆益现实如何兼顾
  lesson: 以信义收人心，以托付保基业，逞小忿则大业难继
  summary_first_person: 余起布衣，自言中山靖王之后，颠沛半生，赖卧龙关张赵黄之助，借荆取益，方成鼎足，荆州既失，猇亭大败，白帝托孤而终，愿后人守仁义，不以私怒废大事
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
