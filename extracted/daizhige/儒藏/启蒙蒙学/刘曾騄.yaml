    title_zh: 以弟子规合三字经演为日用仪则
    rationale: 旧本言理略而寡于行，故详洒扫应对进退之节使童蒙可力行
  - date: 1890-01-01
    title_zh: 别撰女子修身训劝早起勤家不缠足读书
    rationale: 欲使女子亦明伦理通国事教子兴家故补闺门一章
- id: guji-刘曾騄-endeavor-2
  title_zh: 演教数劝学贯通古今中外
  summary_zh: 演三才三光至九州五洲诸数，次及经史子集源流与廿二省五大洲通商边疆之实，以开蒙童见闻
  phases:
