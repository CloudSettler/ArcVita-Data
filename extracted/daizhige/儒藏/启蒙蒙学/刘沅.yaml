    start_date: 1815
    highlight_event_id: guji-刘沅-event-huaixuan
  - key: climax
    name: 授徒讲学以经纶谈笑协天理
    labels:
      zh: 讲学经纶
    start_date: 1835
    highlight_event_id: guji-刘沅-event-huaixuan
  - key: closure
    name: 以礼乐诗书养人心而传后学
    labels:
      zh: 礼乐传后
    start_date: 1850
    highlight_event_id: guji-刘沅-event-death
  decisions:
  - date: 1815
    title_zh: 以存心养性为圣学之的
    rationale: 未生性即心，既生拘气质，故养性最为急，欲尽天理之纯
  - date: 1835
    title_zh: 倡耕莘钓渭不拘资格而礼贤下士
    rationale: 贤士难逢，培养非一日，士人须以圣为的以佐君成绩
