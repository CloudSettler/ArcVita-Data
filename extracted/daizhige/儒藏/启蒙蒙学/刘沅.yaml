  decisions:
  - date: 1820
    title_zh: 以三字四言韵语作蒙训
    rationale: 便于束发蒙童记诵，使数目造化伦常易入心
  - date: 1825
    title_zh: 历陈唐虞至皇清兴衰以示天命
    rationale: 使知有德昌荣无德消灭，体天心而儆惕君师之职
- id: guji-刘沅-endeavor-2
  title_zh: 创立槐轩之学以明性命经纶
  description: 主张太极在人身，静存动察，诚正修齐，佐君成伟绩，兼通礼乐文章之用
  phases:
  - key: brewing
    name: 合天心养性命之体认
