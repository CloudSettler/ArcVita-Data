  archetype: 启蒙型儒师
  dilemmas:
  - 近人重章词而轻忠孝本源，如何以文章载道而不堕淫夸
  - 蒙童多见多闻易惑于谬说，如何辨瑕瑜而守诚一
  - 法古与宜今之间，如何损益礼乐而不拘执
  lesson: 养性为急，正心修身，以圣为的，推经纶于天下
  summary_first_person: 吾刘沅生于乾隆之世，见蒙养衰息，遂作蒙训，以数目造化性命伦常历史礼乐之大义告蒙童，欲人人养性存心，敦五伦，正言行，以合天心，而成经纶之用
