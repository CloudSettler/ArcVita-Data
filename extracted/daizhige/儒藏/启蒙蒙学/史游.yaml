endeavors:
- id: guji-史游-endeavor-1
  title_zh: 编撰急就篇以启童蒙
  summary: 继苍颉爰历博学凡将之后，广采名姓器物典制，成三十二章无一复字，列于秘府为小学正宗。
  phases:
  - key: brewing
    name: 景慕前修酝酿篇体
    labels:
      zh: 酝酿
    start_date: -0048
    highlight_event_id: guji-史游-event-1
  - key: breakthrough
    name: 罗列品类撰成急就
    labels:
      zh: 突破
    start_date: '-0040'
    highlight_event_id: guji-史游-event-2
  - key: climax
    name: 列于秘府风行学官
    labels:
      zh: 高潮
    start_date: '-0033'
    highlight_event_id: guji-史游-event-2
  - key: closure
    name: 三十二章定型传世
    labels:
      zh: 收束
    start_date: '-0025'
    highlight_event_id: guji-史游-event-3
  decisions:
  - date: '-0042'
    title_zh: 拟凡将而广急就
    rationale: 相如凡将务适时要而篇幅未备，故拟其体而广采姓氏器物服饰饮食以便日用诵习
  - date: '-0040'
    title_zh: 分别部居不杂厕
    rationale: 以姓氏居首次及器物衣食宫室鸟兽医药法律为序，使童蒙分别部居易于记诵考检
- id: guji-史游-endeavor-2
  title_zh: 解散隶体创制章草
  summary: 以速就急切之用解散隶体，草法简约以行于世，后世因出于急就章遂名章草。
  phases:
  - key: brewing
    name: 习隶参草体势考察
    labels:
      zh: 酝酿
    start_date: -0048
    highlight_event_id: guji-史游-event-1
  - key: breakthrough
    name: 以急就之书写成章草
    labels:
      zh: 突破
    start_date: '-0040'
    highlight_event_id: guji-史游-event-2
  - key: climax
    name: 汉俗简惰渐以行之
    labels:
      zh: 高潮
    start_date: '-0030'
    highlight_event_id: guji-史游-event-3
  - key: closure
    name: 后人以章名草垂为书法一宗
    labels:
      zh: 收束
    start_date: '-0020'
    highlight_event_id: guji-史游-event-3
  decisions:
  - date: '-0040'
    title_zh: 以章草书急就以趋速就
    rationale: 蒙学日用约少诚快意，故解散隶体省约笔势，使乡曲小吏皆可速写流布
  - date: '-0033'
    title_zh: 守隶法而不失正体
    rationale: 草而不乱使后之皇象钟繇卫夫人王羲之等可据以审定，童蒙识字不致僻谬
events:
- id: guji-史游-event-birth
  date: '-0070'
  year_of: -70
  title_zh: 诞生于西汉
  description: 约宣帝之世生，少习小学苍雅训故，博综流略尤精文字。
- id: guji-史游-event-1
  date: -0048
  year_of: -48
  title_zh: 任黄门令供奉宫中
  description: 汉元帝初为黄门令，掌通传诏令，得窥秘府苍颉凡将博学诸篇，遂萌拟作之志。
- id: guji-史游-event-2
  date: '-0040'
  year_of: -40
  title_zh: 作急就篇列于秘府
  description: 元成之间撰成急就篇，自急就奇觚与众异起至汉土兴隆中国康止，三十二章包括品类错综古今。
- id: guji-史游-event-3
  date: '-0030'
  year_of: -30
  title_zh: 章草因篇得名流布天下
  description: 以所变草法书此篇，汉俗简惰渐以行之，后人以其出于急就章遂名章草，皇象钟繇等递相传写。
- id: guji-史游-event-death
  date: '-0020'
  year_of: -20
  title_zh: 卒于长安篇留四海
  description: 卒后其篇为官学童蒙必诵之书，颜师古为之解训，王应麟补注厘为四卷，至今犹竞习之。
