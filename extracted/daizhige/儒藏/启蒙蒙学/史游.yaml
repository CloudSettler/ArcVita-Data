  era: 西汉
  reign_ref: 汉元帝至汉成帝
  archetype: 蒙学创制者
  dilemmas:
  - 以宦官黄门令之身如何立言传世而不泯
  - 以童蒙识字之简如何兼备物训诂之雅奥
  lesson: 包括品类错综古今以便初学，简要易持方能垂久，备物致用即是大学之基。
  summary_first_person: 吾史游为汉元帝时黄门令，景慕相如凡将苍颉博学之业，拟而广之作急就篇，分别部居不杂厕，解散隶体为章草，列于秘府以启青衿，愿后学勉力务之必有喜。
