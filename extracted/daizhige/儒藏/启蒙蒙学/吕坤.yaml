  dilemmas:
  - 科举取富贵与读书明理之辨
  - 整肃礼法与养育童蒙本性之衡
  lesson: 读书贵在明理修身，教化必自童蒙社学始
  summary_first_person: 吾乃吕坤，山西宁化人，历任州县台省，慨教化陵夷，世人读书只求科甲富贵，遂选社师，立社学，著要略，欲使童子识字明理，敦伦立身，以挽世风人心。
