endeavors:
- id: guji-吕坤-endeavor-1
  title_zh: 循良吏治与直谏巡抚
  summary: 由浚县令起家，以实心行实政，历工刑曹郎，巡抚山西山东，敢上忧危疏直陈时弊，后解官归里。
  phases:
  - key: brewing
    name: 进士授浚县
    labels:
      zh:
      - 养望
      - 亲民
    start_date: '1574'
    highlight_event_id: guji-吕坤-event-jinshi
  - key: breakthrough
    name: 历曹郎持正
    labels:
      zh:
      - 立政
      - 守廉
    start_date: '1587'
    highlight_event_id: guji-吕坤-event-xunfu
  - key: climax
    name: 巡抚封疆直谏
    labels:
      zh:
      - 诤谏
      - 安边
    start_date: '1592'
    highlight_event_id: guji-吕坤-event-xunfu
  - key: closure
    name: 解官归耕
    labels:
      zh:
      - 全节
      - 归隐
    start_date: '1597'
    highlight_event_id: guji-吕坤-event-guiju
  decisions:
  - date: '1574'
    title_zh: 浚县务实爱民
    rationale: 不事虚文，省刑劝农，以实政养民，立循良之基。
  - date: '1592'
    title_zh: 上忧危疏直陈时弊
    rationale: 以廉耻为重，不顾祸福，愿以直言悟主，以救危亡。
- id: guji-吕坤-endeavor-2
  title_zh: 著书立教与蒙养启蒙
  summary: 归里后讲学著述，作小儿语续小儿语呻吟语实政录闺范，以通俗言语教蒙童妇孺，以慎独自修化民成俗。
  phases:
  - key: brewing
    name: 留心民俗教化
    labels:
      zh:
      - 观察
      - 存心
    start_date: '1597'
    highlight_event_id: guji-吕坤-event-guiju
  - key: breakthrough
    name: 作小儿语启蒙
    labels:
      zh:
      - 蒙养
      - 立言
    start_date: '1598'
    highlight_event_id: guji-吕坤-event-zhushu
  - key: climax
    name: 续小儿语成书垂训
    labels:
      zh:
      - 续补
      - 垂训
    start_date: '1598'
    highlight_event_id: guji-吕坤-event-zhushu
  - key: closure
    name: 刊落讲学惠后
    labels:
      zh:
      - 传道
      - 惠后
    start_date: '1618'
    highlight_event_id: guji-吕坤-event-death
  decisions:
  - date: '1598'
    title_zh: 作续小儿语示俗
    rationale: 以四言六言杂言俗语，言慈悲方便知足慎独，使妇孺皆晓，便于践行。
  - date: '1597'
    title_zh: 归里讲学不干进
    rationale: 既去官守，即以著述代封章，以教化代刑政，以全晚节而淑人心。
events:
- id: guji-吕坤-event-birth
  date: '1536'
  year_of: 1536
  title_zh: 生于河南宁陵
  place_zh: 河南宁陵
  description_zh: 明嘉靖十五年生于宁陵，自幼力学，志在经纶天下。
- id: guji-吕坤-event-jinshi
  date: '1574'
  year_of: 1574
  title_zh: 万历二年进士授浚县令
  place_zh: 直隶浚县
  description_zh: 登进士第，授浚县知县，省刑劝农，兴学化俗，声称循良。
- id: guji-吕坤-event-xunfu
  date: '1592'
  year_of: 1592
  title_zh: 巡抚山西山东上忧危疏
  place_zh: 山西太原
  description_zh: 巡抚山西，寻移山东，上忧危疏直陈朝政得失，言极剀切，遂忤权贵。
- id: guji-吕坤-event-guiju
  date: '1597'
  year_of: 1597
  title_zh: 解官归里讲学
  place_zh: 河南宁陵
  description_zh: 去官归里，杜门著述，讲学乡邦，不复出仕，以全廉耻之节。
- id: guji-吕坤-event-zhushu
  date: '1598'
  year_of: 1598
  title_zh: 撰成续小儿语诸书
  place_zh: 河南宁陵
  description_zh: 继小儿语而作续小儿语，分四言六言杂言，杂引日用伦常因果，以教蒙童闾巷，并著呻吟语实政录等。
- id: guji-吕坤-event-death
  date: '1618'
  year_of: 1618
  title_zh: 卒于家
  place_zh: 河南宁陵
  description_zh: 明万历四十六年卒于家，以直节实学蒙学并传于后。
