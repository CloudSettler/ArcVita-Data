endeavors:
- id: guji-吕坤-endeavor-1
  title_zh: 历任州县兴办社学
  summary: 以亲民之官整饬乡教，选社师，立条约，使穷乡子弟皆得入学明理。
  phases:
  - key: brewing
    name: 知县亲民见教化陵夷
    labels:
      zh: 襄垣大同任上观察
    start_date: 1574
    highlight_event_id: guji-吕坤-event-jinshi
  - key: breakthrough
    name: 选师立学颁社约
    labels:
      zh: 社师选拔与社学设立
    start_date: 1590
    highlight_event_id: guji-吕坤-event-shexue
  - key: closure
    name: 巡抚两省推广乡教
    labels:
      zh: 通饬所属一体遵行
    start_date: 1596
    highlight_event_id: guji-吕坤-event-shexue
  decisions:
  - date: 1590
    title_zh: 务取年长端士为社师
    rationale: 非良心未丧志向颇端者不能正童蒙，先教小学孝经音韵，方拨发社学。
  - date: 1592
    title_zh: 晓谕百姓送子入学
    rationale: 有子不教遂成盗贼，明理识字者不为非，故穷忙亦须冬春在学三年。
- id: guji-吕坤-endeavor-2
  title_zh: 撰述实学垂训童蒙
  summary: 著社学要略训蒙约呻吟语等书，以洒扫应对歌诗体认，养其德性文理。
  phases:
  - key: brewing
    name: 采集古今切要歌诗
    labels:
      zh: 纲常伦理日讲一章
    start_date: 1590
    highlight_event_id: guji-吕坤-event-shexue
  - key: climax
    name: 著成社学要略颁行
    labels:
      zh: 立身行检读书次第
    start_date: 1595
    highlight_event_id: guji-吕坤-event-shexue
  - key: closure
    name: 实学传世启迪后学
    labels:
      zh: 去伪存真嘉惠来兹
    start_date: 1610
    highlight_event_id: guji-吕坤-event-death
  decisions:
  - date: 1595
    title_zh: 每讲贴己体认省惕
    rationale: 使童子以书问己能否学，附法戒故事两条，他日违犯即以所讲责之。
  - date: 1595
    title_zh: 定读书作文写仿节次
    rationale: 先三字经百家姓千字文以习姜字，次第背读看讲仿作，令勤而不伤脾弱。
events:
- id: guji-吕坤-event-birth
  title_zh: 出生于山西宁化
  date: 1536
  year_of: 1536
  place_zh: 山西宁化
  summary: 明嘉靖十五年生于山西宁化吕氏，自幼力学，志在经世致用。
- id: guji-吕坤-event-jinshi
  title_zh: 万历二年登进士授知县
  date: 1574
  year_of: 1574
  place_zh: 襄垣
  summary: 登甲戌进士，授襄垣知县，调大同，历官御史按察，亲见举世不知读书为何事。
- id: guji-吕坤-event-shexue
  title_zh: 兴社学著社学要略
  date: 1595
  year_of: 1595
  place_zh: 山西山东任所
  summary: 选年四十以上端士为社师，定五禁十戒孝敬威仪，颁歌诗三百篇教法及读书次第，著为要略。
- id: guji-吕坤-event-death
  title_zh: 卒于刑部侍郎任上
  date: 1618
  year_of: 1618
  place_zh: 京师
  summary: 万历四十六年卒，遗著呻吟语社学要略等行世，以实学敦本启迪后人。
