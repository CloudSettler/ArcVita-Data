    start_date: 1140-01-01
    highlight_event_id: guji-吕本中-event-tongmeng
  decisions:
  - date: 1140-01-01
    title_zh: 以五经论孟为本训蒙
    rationale: 恐后学躐等陵节，故先令熟味孝经论语中庸大学孟子，然后通求诗书易春秋
  - date: 1140-01-01
    title_zh: 会粹程张邵胡事迹为法
    rationale: 欲使学者有所据守，故记明道伊川横渠康节安定行事，以礼诚为归
- id: guji-吕本中-endeavor-2
  title_zh: 应中兴而出处直道
  summary_zh: 靖康建炎应诏入朝，绍兴为中书舍人兼侍讲，论恢复守正不合，罢去讲学以终
  phases:
  - key: brewing
    name: 应诏入朝
    labels:
      zh: 仕进初心
    start_date: 1128-01-01
    highlight_event_id: guji-吕本中-event-serve
  - key: climax
    name: 侍讲论事
    labels:
      zh: 直道事君
    start_date: 1131-01-01
    highlight_event_id: guji-吕本中-event-xuns讲
  - key: closure
    name: 罢去著书
    labels:
      zh: 守正俟命
    start_date: 1140-01-01
    highlight_event_id: guji-吕本中-event-tongmeng
  decisions:
  - date: 1131-01-01
    title_zh: 受命侍讲不枉道求合
    rationale: 以诚实为行己之本，书帖言语不情缪敬尽削去，守至正以俟天命
  - date: 1136-01-01
    title_zh: 去国讲学传江西诗派
    rationale: 既不合于朝，则退而明道论文，以诗书传诸生，不以进退累其心
events:
- id: guji-吕本中-event-birth
  date: 1084-01-01
  year_of: 1084
  title_zh: 出生于寿州吕氏
  description_zh: 元丰七年生，为吕好问子，荥阳公吕希哲之孙，正献公吕公著曾孙，幼承家法
- id: guji-吕本中-event-serve
  date: 1128-01-01
  year_of: 1128
  title_zh: 建炎应诏入朝任馆职
  description_zh: 靖康之难后应诏，辟为枢密院编修，迁著作郎，历官显要，以气节学问闻于时
- id: guji-吕本中-event-xuns讲
  date: 1131-01-01
  year_of: 1131
  title_zh: 除中书舍人兼侍讲
  description_zh: 绍兴元年除中书舍人兼侍讲，敷陈经义，论恢复大计，直言忤时，旋罢去
- id: guji-吕本中-event-tongmeng
  date: 1140-01-01
  year_of: 1140
  title_zh: 撰成童蒙训示子弟
  description_zh: 晚年居家，会粹家塾所闻二程横渠康节安定诸儒言行，撰童蒙训三卷，以小学洒扫应对进退训后学
- id: guji-吕本中-event-death
  date: 1145-01-01
  year_of: 1145
  title_zh: 卒于家
  description_zh: 绍兴十五年卒，年六十二，后谥文清，所著有春秋集解东莱集传世，童蒙训为蒙养要籍
