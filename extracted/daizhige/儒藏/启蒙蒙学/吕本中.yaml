  - 出处进退之难，既欲以道事君匡复时政，又不肯枉道求合
  - 传道训人之难，欲以洒扫应对之小学养成大儒气象
  lesson: 以孝经论语为本，下学上达，诚实不动心，守至正以俟天命
  summary_first_person: 我是吕本中，字居仁，荥阳吕氏之后，幼承正献荥阳家法，亲炙二程张氏余风，中兴入朝为中书舍人兼侍讲，直言罢去，晚年以著述训子弟，作童蒙训，欲使后学以经书论孟为准绳，以礼诚为归宿
  source_urls:
