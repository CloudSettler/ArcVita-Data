  dilemmas:
  - 三字经旧文简略难尽见闻与增字过多难于记诵之间如何折中
  - 童蒙年幼记性有限与天文地理名物繁杂之间如何化繁为简
  lesson: 以简驭繁编要略使童蒙先博见闻后入经文最为稳妥
  summary_first_person: 吾为周保璋清之诸生也见旧三字经未备见闻故节取经史子集之要增为此篇自太极阴阳三才以至九族十义皆以三字叶韵使弟子终日习之可启见闻而入圣贤之门此吾之志也
