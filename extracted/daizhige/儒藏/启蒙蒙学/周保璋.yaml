    rationale: 见闻须熟记更须躬行故以孝友睦姻任恤及君仁臣忠之义导其行
  - date: 1870
    title_zh: 定编要略此篇起以承经传
    rationale: 恐弟子以此篇为足故结云编要略使知此仅启蒙之始终须入学问正经
