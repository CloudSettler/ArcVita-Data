endeavors:
- id: guji-周秉清-endeavor-1
  title_zh: 撰述养蒙便读立童蒙日用之则
  summary: 以立行坐卧言语饮食衣履读书习字卫生为纲，撰为便读，以养童蒙之身心
  phases:
  - key: brewing
    name: 观风酝酿
    labels:
      zh:
      - 酝酿
    start_date: 1915-01-01
    highlight_event_id: guji-周秉清-event-writing
  - key: breakthrough
    name: 成书示教
    labels:
      zh:
      - 突破
    start_date: 1925-01-01
    highlight_event_id: guji-周秉清-event-complete
  decisions:
  - date: 1920-01-01
    title_zh: 以十八章统摄身心家国
    rationale: 童蒙养正当自立行坐卧始，推及读书卫生事亲交友，故立十八章以便诵读实行
  - date: 1925-01-01
    title_zh: 参旧礼以通新用
    rationale: 旧礼主敬，新知主卫生服务，兼采则切于日用而不迂，故于饮食卫生服务特加详述
- id: guji-周秉清-endeavor-2
  title_zh: 推行孝悌服务改过立志之教
  summary: 由事亲友爱事长而及夫妇交友服务，劝改过立志，以全伦理而济群生
  phases:
  - key: climax
    name: 阐扬伦教
    labels:
      zh:
      - 高潮
    start_date: 1925-01-01
    highlight_event_id: guji-周秉清-event-complete
  - key: closure
    name: 垂训收束
    labels:
      zh:
      - 收束
    start_date: 1930-01-01
    highlight_event_id: guji-周秉清-event-complete
  decisions:
  - date: 1926-01-01
    title_zh: 以孝亲为作圣之基
    rationale: 欲修圣功始于孝亲，养身养志成德皆本于此，故详述侍养谏亲丧祭之礼
  - date: 1928-01-01
    title_zh: 以服务改过勖后生
    rationale: 人非独活互助为义，少年立志当博施济众，断妄习以复清净，故终以改过立志作结
