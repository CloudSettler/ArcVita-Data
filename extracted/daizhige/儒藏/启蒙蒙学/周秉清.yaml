  - 世风浮薄童蒙失教何以挽回人心
  - 旧礼新知交争之际何以兼采而立日用之则
  lesson: 蒙以养正为先，端身正心孝亲敬长，早立大志，始可作圣
  summary_first_person: 吾乃周秉清，逢清季民初之变，忧童蒙失养，取立行坐卧言语饮食衣履读书习字之则，参以事亲友爱事长交友服务改过立志之义，撰为养蒙便读，愿后生自童年习礼寡欲，养身养心，以成圣贤之基
