person:
  qid: guji-唐彪
  name_zh: 唐彪
  names:
    zh: 唐彪
    en: Tang Biao
  lifespan:
    birth:
      date: 1640-01-01
      precision: year
      is_circa: true
      raw: 清初顺治末前后浙江金华一带人以子正心事推之
    death:
      date: 1715-12-31
      precision: year
      is_circa: true
      raw: 清康熙末以后
  birth_date: 1640-01-01
  death_date: 1715-12-31
  era: 清
  reign_ref: 康熙
  archetype: 蒙学师匠
  dilemmas:
  - 独请先生束修菲薄难得明师与合馆延师往来微艰之间如何抉择
  - 经蒙兼摄先生精力不济与经蒙分馆各专其业之间如何变通
  - 严厉督责易致烦苦与宽恕姑息课程有缺之间如何守中
  lesson: 蒙养之功全在认字清切与课程有恒父兄尽督课择师之职先生尽勤讲解之任方能有成
  summary_first_person: 吾乃唐彪生长婺地目睹家塾独请兼摄苟且误人遂考父师善诱之法上卷言父兄陶淑尊师择师分馆之要下卷言童蒙认字授读温习标记之节又记吾子正心遇朱两生以认字清切而豁然贯通之事愿后之父师以严勤补前师之不足使幼学皆能成诵明理
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%90%AF%E8%92%99%E8%92%99%E5%AD%A6/%E5%AE%B6%E5%A1%BE%E6%95%99%E5%AD%A6%E6%B3%95.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%90%AF%E8%92%99%E8%92%99%E5%AD%A6/%E5%AE%B6%E5%A1%BE%E6%95%99%E5%AD%A6%E6%B3%95.html
endeavors:
- id: guji-唐彪-endeavor-1
  title_zh: 倡导父师善诱与经蒙分馆
  description: 针对富贵之家姑息子弟独请先生及已冠童蒙同馆兼摄之弊倡导合馆延访明师经蒙分馆少而精专
  phases:
  - key: brewing
    name: 观察独请兼摄之弊
    labels:
      zh: 萌芽
    start_date: 1668-01-01
    highlight_event_id: guji-唐彪-event-son
  - key: breakthrough
    name: 悟得合馆延师分馆专治
    labels:
      zh: 突破
    start_date: 1674-06-01
    highlight_event_id: guji-唐彪-event-yushan
  - key: climax
    name: 辑定父师择师督课诸法
    labels:
      zh: 高峰
    start_date: 1680-01-01
    highlight_event_id: guji-唐彪-event-bianzuan
  - key: closure
    name: 垂训尊崇蒙师厚其束修
    labels:
      zh: 收束
    start_date: 1685-01-01
    highlight_event_id: guji-唐彪-event-bianzuan
  decisions:
  - date: 1674-06-01
    title_zh: 舍独请而取合馆延访
    rationale: 独请束修不厚难养名师合众延访方能尽心夹辅以成就冠幼
  - date: 1680-01-01
    title_zh: 主经蒙分馆各专课程
    rationale: 经蒙兼摄则耳目手足不给分馆则经师专冠者蒙师专童蒙两受其益
- id: guji-唐彪-endeavor-2
  title_zh: 奠定童蒙认字读书温习法
  description: 以子正心受困不识字而豁然于朱两生认字清切之教为契机创立半年专认缓授句读界限遍数筹记理温习熟标记之法
  phases:
  - key: brewing
    name: 子正心历三师不成诵
    labels:
      zh: 萌芽
    start_date: 1670-01-01
    highlight_event_id: guji-唐彪-event-son
  - key: breakthrough
    name: 甲寅避乱得认字清切术
    labels:
      zh: 突破
    start_date: 1674-03-01
    highlight_event_id: guji-唐彪-event-yushan
  - key: climax
    name: 推演授读温习标记成规
    labels:
      zh: 高峰
    start_date: 1680-03-01
    highlight_event_id: guji-唐彪-event-bianzuan
  - key: closure
    name: 分长幼分月日定读书次第
    labels:
      zh: 收束
    start_date: 1686-01-01
    highlight_event_id: guji-唐彪-event-bianzuan
  decisions:
  - date: 1674-05-01
    title_zh: 先令认字清切而后读书
    rationale: 字不认清则不敢放心读去通体不成诵认清则三四遍亦能上口百遍必熟
  - date: 1680-03-01
    title_zh: 立遍数设筹与理温习熟标记
    rationale: 不记遍数不作标记则温习淆乱避难就易设筹记遍五日记簿方能有稽
events:
- id: guji-唐彪-event-birth
  title_zh: 出生于浙婺
  date: 1640-01-01
  year_of: 1640
  description: 清初生于浙江金华一带长而留心家塾蒙养之事
- id: guji-唐彪-event-son
  title_zh: 子正心入学困于不识字
  date: 1670-02-01
  year_of: 1670
  description: 子正心六岁入学三岁历三师至四年无可如何因一二句中字认不清通体皆不成诵
- id: guji-唐彪-event-yushan
  title_zh: 甲寅避乱遇朱两生得法
  date: 1674-05-01
  year_of: 1674
  description: 甲寅兵乱避居山中令子从朱两生游五月新旧之书无不极熟悟惟令认字清切而已
- id: guji-唐彪-event-bianzuan
  title_zh: 辑成家塾教学法上下卷
  date: 1680-08-01
  year_of: 1680
  description: 辑父师善诱法上卷言父兄教子尊师择师分馆之要下卷言初入学认字授读温书注法及觅书择友之要
- id: guji-唐彪-event-death
  title_zh: 逝世
  date: 1715-12-31
  year_of: 1715
  description: 康熙末年后逝世其认字清切分馆专治之说流传于蒙馆
