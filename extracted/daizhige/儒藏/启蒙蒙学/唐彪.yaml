    start_date: 1670-01-01
    highlight_event_id: guji-唐彪-event-1
  - key: climax
    name: 父师同心勤督成规
    labels:
      zh: 善诱成规
    start_date: 1675-01-01
    highlight_event_id: guji-唐彪-event-2
  decisions:
  - date: 1670-01-01
    title_zh: 定详加检点面背面课之法
    rationale: 父兄不检则师不尽心故必时令面背面课或转质于人以知虚实
  - date: 1672-01-01
    title_zh: 设缴筹课程薄温旧标记之法
    rationale: 遍数得实方可久记故以筹记遍以薄记程以标记别生熟以免避难就易
