  title_zh: 蒙馆授读著述传法
  description: 积蒙馆讲解授读之验定逐字讲背带覆书之式作文改文问难之方撰父师善诱法以传后
  phases:
  - key: brewing
    name: 积蒙馆讲读之验
    labels:
      zh: 授读实验
    start_date: 1678-01-01
