    highlight_event_id: guji-唐彪-event-2
  - key: closure
    name: 撰成父师善诱法传后
    labels:
      zh: 著述传法
    start_date: 1685-01-01
    highlight_event_id: guji-唐彪-event-2
  decisions:
  - date: 1682-01-01
    title_zh: 定随读随解五日背带之法
    rationale: 强记易忘故必逐字讲如说话令读三十遍再带背五日共习十日以期永久不忘
  - date: 1685-01-01
    title_zh: 撰父师善诱法明蒙养之道
    rationale: 欲使父师静专切督因材造就迎机而导故总幼识字调声作文问难之法著书传后
