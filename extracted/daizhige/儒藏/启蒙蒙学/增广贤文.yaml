  dilemmas:
  - 雅俗之间如何兼收俚谚与经训以垂训蒙学
  - 劝世之间如何兼顾安分知足与勤学进取以化人心
  lesson: 观今宜鉴古，知足守分，勤读力行，但行好事莫问前程
  summary_first_person: 吾为增广贤文，本名昔时贤文，采集群言而成于明人，增广于后人，重刊定型于清同治，句句劝人识人情物理，守本分，勤读书，重仁义，愿后学多见多闻，修身处世，不枉度春
  source_urls:
