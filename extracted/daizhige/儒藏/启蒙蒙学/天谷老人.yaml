  decisions:
  - date: 1720-03-01
    title_zh: 补而不僭守正益新
    rationale: 旧本言简而人事日繁须以方便第一心地福田因果报应勤俭让恕补之而不改其雅正
  - date: 1730-06-01
    title_zh: 以俗语传正道使幼学易记
    rationale: 小儿不解深文故用白饭血汗体面欠钱摸针摸金等切近之言使一诵即记终身不忘
- id: guji-天谷老人-endeavor-2
  person_qid: guji-天谷老人
  title_zh: 以蒙养推行乡里劝善化俗
  summary: 持方便第一与人方便不离心地为纲劝孝亲养老戒杀惜生戒赌远讼崇节俭睦宗族以化乡俗
