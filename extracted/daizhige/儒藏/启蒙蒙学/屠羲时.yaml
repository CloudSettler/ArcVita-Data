  - title_zh: 姑息为恩与养正之争
    description: 父兄以姑息为恩师者以课程为急礼教废搁童蒙何赖
  - title_zh: 课程功利与洒扫根本之辨
    description: 洒扫应对似为小节然即此可达天德当先何者
  lesson: 蒙以养正圣功也养正莫先于礼幼时持循则长而不放
  summary_first_person: 吾见世之父兄以姑息为恩师者以课程为急礼教废而不讲乃本曲礼内则少仪弟子职附诸儒训蒙要语辑为童子礼愿童子晨兴盥栉衣冠端正洒扫应对进退得正以养其正而达圣功
