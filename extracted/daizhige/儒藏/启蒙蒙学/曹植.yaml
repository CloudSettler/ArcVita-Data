  lesson: 持才宜谦守分，临危以诚动人，处逆以诗明志
  summary_first_person: 吾乃曹植字子建，沛国谯人，武帝之子文帝之弟，少以才章见称，铜雀台赋建声名，夺嫡既失屡徙封地，七步成诗以全性命，晚年忧谗著述，终以愤郁而卒，独以诗名传后
