endeavors:
- id: guji-曹植-endeavor-1
  title_zh: 邺下植声与立嗣之争
  summary_zh: 少以辞藻见重，铜雀台赋惊座，植党见嫉，夺嫡既失，转向自抑
  phases:
  - key: brewing
    name: 邺下养望
