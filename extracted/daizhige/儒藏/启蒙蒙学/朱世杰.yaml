  lesson: 以浅驭深以诀摄法使绝学可传后学可继
  summary_first_person: 吾燕山朱世杰字汉卿遍历齐赵吴楚讲明算学见九数归除纵横开方之法散而难习乃先撰算学启蒙以释九数明纵横定率式复撰四元玉鉴以集天元四元之大成愿后学由启蒙而入九章由浅入深不失算道之传
