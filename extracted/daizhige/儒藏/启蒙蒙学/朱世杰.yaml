  decisions:
  - date: 1290
    title_zh: 以总括先行统摄全书
    rationale: 九数归除斤下留法纵横诀繁杂难记故先作总括释九数明异名正负乘除开方使初学有纲可循
  - date: 1299
    title_zh: 三卷二十门由浅入深
    rationale: 由乘除起率而入天元开方由古法圆率而及徽术密率使蒙童可习九章学者可进四元
- id: guji-朱世杰-endeavor-2
  title_zh: 四元玉鉴集天元四元大成
  summary: 继李冶秦韶之后发展天元术四元术垛积招差开方正负之法成元代算学巅峰之作
  phases:
  - key: brewing
    name: 研习九章测圆海镜遗法
    labels:
      zh: 研习遗法
    start_date: 1280
    highlight_event_id: guji-朱世杰-event-suanxue-qimeng
  - key: breakthrough
    name: 立天元一四元术式
    labels:
      zh: 立元术式
    start_date: 1300
    highlight_event_id: guji-朱世杰-event-siyuan-yujian
  - key: climax
    name: 四元玉鉴成书
    labels:
      zh: 玉鉴成书
    start_date: 1303
    highlight_event_id: guji-朱世杰-event-siyuan-yujian
  - key: closure
    name: 讲授四元以传后学
    labels:
      zh: 讲授传承
    start_date: 1304
    highlight_event_id: guji-朱世杰-event-death
  decisions:
  - date: 1300
    title_zh: 由启蒙而进四元不躐等
    rationale: 启蒙已明纵横正负开方之基然后可立天元二三四元相消相长使高深之法有所承接
  - date: 1303
    title_zh: 以垛积招差补立术之阙
    rationale: 积求垛求化难为易故集垛积招差弦矢开方诸门以全四元体系使算道无遗法
