  dilemmas:
  - 博文约礼之间如何兼顾读书穷理与饬身践行
  - 仕教之间如何以师道立人而不随世浮沉
  lesson: 饬身自童蒙始，正衣冠，谨言行，勤洒扫，专读书，由近及远，可入圣贤之域
  summary_first_person: 吾朱熹，少学圣贤，集理学之大成，晚年悯童蒙未悟，作童蒙须知五篇，教以衣服冠履，语言步趋，洒扫涓洁，读书写字及杂细事宜，欲使子弟端身体，正威仪，存诚敬而成谨愿之士，进于大贤君子之域
