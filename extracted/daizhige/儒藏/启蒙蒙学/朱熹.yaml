  - date: 1160-01-01
    title_zh: 师事李侗潜心道学
    rationale: 不安词章科举之学，欲求孔孟正脉，故弃俗学而专主敬穷理
  - date: 1180-01-01
    title_zh: 奏复白鹿洞书院定学规
    rationale: 欲以书院养士明伦，使读书有次第，践履有规矩，故立洞规以示学者
