    labels:
      zh: 蒙学鼎盛
    start_date: 1190-01-01
    highlight_event_id: guji-朱熹-event-tongmeng
  - key: closure
    name: 以谨愿为基勉进圣贤
    labels:
      zh: 勉学收束
    start_date: 1200-04-23
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1190-01-01
    title_zh: 别亲贤讲为童蒙五篇
    rationale: 见世人忽于细行威仪放肆，故先言衣服冠履语言步趋以端其本
  - date: 1190-06-01
    title_zh: 定读书三到爱护书册之法
    rationale: 欲使童子专心久记不忘且知敬惜字纸，故立心到眼到口到与卷束整齐之训
events:
