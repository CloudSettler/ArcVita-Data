  description_zh: 建炎四年九月十五出生，父朱松命名熹，少颖悟敬重容止
- id: guji-朱熹-event-jinshi
  title_zh: 登绍兴进士第
  date: 1148-04-01
  year_of: 1148
  place_zh: 临安
  description_zh: 年十九登进士第，授泉州同安主簿，始潜心圣贤之学不汲汲仕进
- id: guji-朱熹-event-bailudong
