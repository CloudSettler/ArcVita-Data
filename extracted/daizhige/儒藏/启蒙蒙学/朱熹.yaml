  date: 1180-01-01
  year_of: 1180
  place_zh: 庐山白鹿洞
  description_zh: 知南康军，奏复白鹿洞书院，颁学规，讲大学诚意之旨，四方学者云集
- id: guji-朱熹-event-sishu
  title_zh: 四书章句集注成编
  date: 1182-01-01
  year_of: 1182
  place_zh: 建阳考亭
  description_zh: 成大学章句中庸章句论语孟子集注，以理一分殊心性情才发明圣贤精义
- id: guji-朱熹-event-tongmeng
  title_zh: 撰成童蒙须知五篇
  date: 1190-01-01
  year_of: 1190
  place_zh: 建阳考亭
  description_zh: 分衣服冠履语言步趋洒扫涓洁读书写字杂细事宜五篇，示子弟日用谨愿之则，勉以读圣贤书进于大贤君子
- id: guji-朱熹-event-death
  title_zh: 卒于考亭沧洲
  date: 1200-04-23
  year_of: 1200
  place_zh: 建阳考亭
  description_zh: 庆元六年三月初九卒，年七十一，后谥文，追封徽国公，从祀孔庙
