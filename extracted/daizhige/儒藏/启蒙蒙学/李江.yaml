  dilemmas:
  - 乡俗敬大书先生而轻小书先生蒙养根基无人重视
  - 子弟鲁钝便弃而不教读书只求功名不求明理实行
  - 乡塾年年换师贪多速成早散冬荒言动无人考察
  lesson: 蒙养在敬师久任少授多诵随读随讲即知即行以培后进
  summary_first_person: 吾见乡俗轻蒙师弃鲁钝求名利数换师废礼仪贪多不温故不讲不行早散荒学故撰幼学篇历陈诸误愿同志敬蒙师因性施教为明伦常而读久任讲诵习礼察行以养其德
