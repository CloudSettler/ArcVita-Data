  dilemmas:
  - 科举屡试不第当守儒业还是别寻天命救世
  - 借西洋教义立教当全用旧约新约还是杂糅儒家伦理以合华夏
  - 天京初定当休养保境还是北伐西征一统天下
  lesson: 假天命而兴可聚众成势然教化独断而无制度约束终致内讧而败
  summary_first_person: 我本广东花县农家子屡试科举不第而得异梦自谓皇上帝次子耶稣之弟立拜上帝会以唤醒世人金田举义建号太平天国定都天京为天王御制千字诏以千言教民识神知恩守诫我一生欲拜真神均贫富反满兴夏惜晚年猜忌丛生国势遂倾此我之志与憾也
