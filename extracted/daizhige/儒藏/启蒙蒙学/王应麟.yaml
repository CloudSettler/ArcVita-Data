  decisions:
  - date: 1270
    title_zh: 定三字韵语之体
    rationale: 蒙童记性宜短韵，故以三字为句，详训诂，明句读，先孝弟，次见闻，后经史
  - date: 1285
    title_zh: 增史纲劝勤学
    rationale: 历叙三皇至前代治乱，缀勤学苦卓故事，以励幼学朝斯夕斯，立志效贤
- id: guji-王应麟-endeavor-2
  title_zh: 历仕守正晚年困学著述
  summary: 宝祐登第后直言忤权臣，累迁礼部尚书，宋亡不仕，闭户著玉海困学纪闻诸书以存文献
  phases:
