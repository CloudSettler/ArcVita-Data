  decisions:
  - date: 1256
    title_zh: 对策直言不附权幸
    rationale: 宁忤丁大全贾似道之流，不枉道以求容，守臣子敬忠之义
  - date: 1276
    title_zh: 宋亡不仕元闭户著述
    rationale: 国祚既移则以文献存统绪，辑玉海困学纪闻诗考地理考诸书，以惠后学
events:
- id: guji-王应麟-event-birth
  title_zh: 生于庆元府鄞县
  date: 1223
  year_of: 1223
  description: 宋嘉定十六年生于鄞县王氏，自幼博览，困学记闻
- id: guji-王应麟-event-1
  title_zh: 宝祐四年登进士第授职
  date: 1256
  year_of: 1256
  description: 宝祐四年登第，历太常博士秘书郎权直学士院，直言敢谏，忤权臣而出
- id: guji-王应麟-event-2
  title_zh: 晚年著玉海困学纪闻及三字蒙养篇
  date: 1290
  year_of: 1290
  description: 宋亡归里，著玉海二百卷困学纪闻二十卷，兼撰三字经小学绀珠诸蒙养之书，明经史治乱劝勤学
- id: guji-王应麟-event-death
  title_zh: 卒于鄞里故宅
  date: 1296
  year_of: 1296
  description: 元贞二年卒，年七十四，守节不仕，以著述传后，乡人尊为鄞学宗师
