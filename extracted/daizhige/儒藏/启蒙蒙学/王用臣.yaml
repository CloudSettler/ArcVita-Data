  archetype: 蒙学编纂者
  dilemmas:
  - 天文星象名目繁杂幼童难记如何以歌括收摄经史使可诵可知
  - 地理沿革迁变前代九州郡县与本朝疆域并陈如何取舍而不相淆
  lesson: 蒙以养正，化繁为简，以韵语承经史，使童蒙因歌得知天文地理之大要
  summary_first_person: 吾王用臣，生长清代，愍幼学记诵之难，采集经史天文地理大要，编为幼学歌，冀童蒙因声得知，以开蒙养之正
