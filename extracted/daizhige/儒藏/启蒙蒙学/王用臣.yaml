  decisions:
  - date: '1780'
    title_zh: 以步天歌为纲参用文献通考
    rationale: 步天歌传诵已久句式便于记诵故参用通考及蒙求以成歌授三垣二十八宿
  - date: '1782'
    title_zh: 并载九天九道五星分野岁月之名
    rationale: 童蒙但知星名不足明天时故兼载七政九道十二次岁阳月名以明历象授时之义
- id: guji-王用臣-endeavor-2
  title_zh: 编纂幼学歌地理门
  summary: 汇集禹贡职方历代郡县及本朝舆图，以歌括授九州沿革中外疆域之要
