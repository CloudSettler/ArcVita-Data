  decisions:
  - date: '1788'
    title_zh: 历代都邑郡县并列本朝十八省
    rationale: 欲使幼学知古今沿革故自上古九州至本朝直省新疆回疆依次歌括以见一统之盛
  - date: '1792'
    title_zh: 增载外洋各国及九夷八蛮诸说
    rationale: 海疆渐开通于时事故本瀛环志略载东西洋诸国以广童蒙耳目而不惑于华夷之辨
