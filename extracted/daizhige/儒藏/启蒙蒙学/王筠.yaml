  date: 1795
  year_of: 1795
  title_zh: 十一岁从王惺斋师受学
  description_zh: 从王朝辂事事皆讲遂知用心感其训诲终身不忘也
- id: guji-王筠-event-jiaotongzifa
  date: 1830
  year_of: 1830
  title_zh: 撰述教童子法倡分段专功
  description_zh: 论识字解义读书讲义属对典故诗文放养之法以救念藏经鬼扯腿之弊也
- id: guji-王筠-event-late
  date: 1845
  year_of: 1845
  title_zh: 晚年以博学敦行诲人
  description_zh: 戒以功名为学问教以孝弟忠信应对进退学问既深坐待功名进可战退可守也
- id: guji-王筠-event-death
  date: 1854
  year_of: 1854
  title_zh: 卒于咸丰四年
  description_zh: 以文字小学名家卒留说文句读文字蒙求教童子法等以惠后学也
