endeavors:
- id: guji-王筠-endeavor-1
  title_zh: 立识字读书分段专功之蒙养次第
  summary_zh: 先象形指事纯体后合体先易讲后难讲识二千字后读书读必讲八九岁授声韵属对典故才高才钝各尽其经也
  phases:
  - key: brewing
    name: 幼苦不讲之学
    labels:
      zh: 蒙养反思
    start_date: 1790
    highlight_event_id: guji-王筠-event-school
  - key: breakthrough
    name: 识字为先讲义为要
    labels:
      zh: 识字解义
    start_date: 1820
    highlight_event_id: guji-王筠-event-jiaotongzifa
  - key: climax
    name: 截断合拢分功课实
    labels:
      zh: 分段专功
    start_date: 1830
    highlight_event_id: guji-王筠-event-jiaotongzifa
  decisions:
  - date: 1820
    title_zh: 先纯体后合体先易讲后难讲
    rationale: 使童子切实识解二千字后方可读书读亦必讲解至茁实异日作文可嚼出汁浆也
  - date: 1830
    title_zh: 今年读书明年废学之专功
    rationale: 识字时专于识字读经时专于读经不瞻前顾后方步步着实免鬼扯腿两伤也
- id: guji-王筠-endeavor-2
  title_zh: 以放为主涵养诱掖之诗文乐学之教
  summary_zh: 以学生是人寻乐为本教属对授活死典故作诗文以放为主以圈为主待脱换自化而成家也
  phases:
  - key: brewing
    name: 见念藏经嚼木札之弊
    labels:
      zh: 乐学之思
    start_date: 1810
    highlight_event_id: guji-王筠-event-school
  - key: breakthrough
    name: 属对典故放作诗歌
    labels:
      zh: 放养启趣
    start_date: 1825
    highlight_event_id: guji-王筠-event-jiaotongzifa
  - key: closure
    name: 脱换涵养待自化成家
    labels:
      zh: 涵养待成
    start_date: 1840
    highlight_event_id: guji-王筠-event-late
  decisions:
  - date: 1825
    title_zh: 读书一两年即教属对每日一典故
    rationale: 学生是人非猪狗书中得有乐趣乃相从审问善疑则作文标新领异也
  - date: 1840
    title_zh: 作诗文必须放脱换时不督责
    rationale: 放如野马久必自厌收束加以衔辔则俯首乐从如蚕化蛾屡次脱换必能成家也
events:
