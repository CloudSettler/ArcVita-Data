  archetype: 蒙学师者
  dilemmas:
  - 蒙养先识字解义还是遽令读书成诵之抉择
  - 放养乐学与绳束督责之间如何得中之两难
  - 分段专功与牵肠挂肚求双美之间何去何从之困
  lesson: 蒙养先识字后读书读必讲分段专功以放为主以圈为主涵养诱掖使乐学善疑而后博约可期
  summary_first_person: 吾安丘王筠也幼苦塾师不讲解经长从王惺斋师事事得讲乃知用心遂立识字解义读书讲义属对典故诗文放养之法愿天下为师者各为心丧三年计也
  source_urls:
