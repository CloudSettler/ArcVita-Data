  - title_zh: 务外词章与务内明理之辨
    description_zh: 世俗父师急于学文而失序无本坐失岁月终身陷于为人而不自知当守先德行后艺文之本末
  - title_zh: 宽期限与紧课程之衡
    description_zh: 既要循序渐进不可躐等又要日有常守积日积月积岁而成大儒当宽著期限紧著课程
  lesson: 读书须居敬持志循序渐进熟读精思虚心涵泳切己体察著紧用力以成德达材之全功
  summary_first_person: 吾鄞人程端礼也痛时之教子弟者未读书明理遽使学文失序无本欲速不达故本辅汉卿所粹朱子读书法参以先儒之论辑为读书分年日程延祐二年八月书序于池之建德学愿守是而本末不遗工夫有序心与理浃身与道一
