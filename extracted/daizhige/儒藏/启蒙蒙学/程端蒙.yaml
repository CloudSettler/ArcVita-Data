    title_zh: 以主静慎独为持守
    rationale: 学必立志，持志在敬义交养，使学者有本可立，有则可循
  - date: 1186
    title_zh: 以正己新民为治教
    rationale: 善政不如善教，必由明伦修道推至皇极大顺，方为王道之全
