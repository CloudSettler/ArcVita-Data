  - 如何以浅近字训负载太极性命精微而不失其真
  - 如何在宗奉周程张朱道统同时立足蒙养日用以化俗成德
  lesson: 由字以明理，由近以及远，蒙养既端则圣贤可跂
  summary_first_person: 吾程端蒙生于南宋，慨造化精微而后学难窥，遂辑性理字训六篇，以造化情性学力善恶成德治道为序，一字一训，究其名义，质诸先觉，愿后学由洒扫应对而达天命性情，由格物致知而至尽心尽性，以续道统之明
