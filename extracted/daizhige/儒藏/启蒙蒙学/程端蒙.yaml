  decisions:
  - date: 1178
    title_zh: 以六门统摄字义
    rationale: 造化明本原，情性明禀受，学力明用功，善恶明辨别，成德明极致，治道明推行，使终身向望有所底止
  - date: 1185
    title_zh: 坚持一字一训质朴之体
    rationale: 不尚文辞，不杂异端，使童蒙由近及远，由粗及精，得窥性命之梗概
