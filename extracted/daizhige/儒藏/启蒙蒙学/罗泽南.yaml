  description_zh: 撮朱子小学内外两篇之要为韵语自胎教乳母右手俞言以至五伦六艺四书五经次第及戒童子之条以觉来裔
- id: guji-罗泽南-event-death
  date: '1856-05-12'
  year_of: 1856
  title_zh: 殉国于武昌城下
  description_zh: 咸丰六年三月初八攻武昌力战中炮伤重而殁以忠孝全其始终朝廷优恤立祠后学奉为理学将儒之表
