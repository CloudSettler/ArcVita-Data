  lesson: 蒙以养正为圣功之基小学之功即大学之基由洒扫应对以达明德新民
  summary_first_person: 余湘乡人也早年讲学以程朱自任辑小学韵语以教蒙童谓童子当由威仪伦常孝弟敬长入手立志学圣后值国难练乡勇转战湘鄂以身殉之此生惟一敬字彻始彻终而已
