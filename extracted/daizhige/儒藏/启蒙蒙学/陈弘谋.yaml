endeavors:
- id: guji-陈弘谋-endeavor-1
  title_zh: 编纂养正遗规以端蒙养
  summary: 考辑朱子白鹿洞揭示沧洲谕学童蒙须知诸篇，辨学之纲宗与立志向背，成上下二卷补编，颁行乡塾以正父兄师长之教
  phases:
  - key: brewing
    name: 公余考辑昔贤遗规
    labels:
      zh: 考辑立纲
    start_date: '1738'
    highlight_event_id: guji-陈弘谋-event-yangzheng
  - key: breakthrough
    name: 以朱子五教为学开宗第一义
    labels:
      zh: 明伦定序
    start_date: '1739'
    highlight_event_id: guji-陈弘谋-event-yangzheng
  - key: closure
    name: 厘为二卷题序津门流布
    labels:
      zh: 成书颁行
    start_date: '1739'
    highlight_event_id: guji-陈弘谋-event-yangzheng
  decisions:
  - date: '1739'
    title_zh: 首编白鹿洞揭示明五教五序
    rationale: 学所以学为人，无伦外之人亦无伦外之学，先示纲宗使孩提知爱亲敬长即为学之基
  - date: '1739'
    title_zh: 次正立志以贪道义不要作贵人
    rationale: 世人志在科名利禄则学非其学，须先指点路头使迤逦向圣贤一路上去
  - date: '1739'
    title_zh: 择简要可通行者分上下卷
    rationale: 篇帙无多本末略备，毋轻小节毋骛速成，便于乡塾耳提面命循循规矩
- id: guji-陈弘谋-endeavor-2
  title_zh: 历任封疆兴学劝农经世济民
  summary: 由进士入仕累任督抚，昌明理学整饬吏治，兴乡塾广教化，劝农桑恤民隐，以从政遗规等五种遗规垂训后世
  phases:
  - key: brewing
    name: 雍正进士入仕观政
    labels:
      zh: 初入仕途
    start_date: '1723'
    highlight_event_id: guji-陈弘谋-event-jinshi
  - key: climax
    name: 分路扬镳循行风俗备员圻辅
    labels:
      zh: 牧民兴教
    start_date: '1739'
    highlight_event_id: guji-陈弘谋-event-xunfu
  - key: closure
    name: 晚年汇刻五种遗规垂训
    labels:
      zh: 遗规垂后
    start_date: '1770'
    highlight_event_id: guji-陈弘谋-event-wuzhong
  decisions:
  - date: '1739'
    title_zh: 以训蒙为郡邑先勉竭愚忱
    rationale: 身负人材之责，与其迂固琐屑之讥，不如源洁流清少助世教
  - date: '1745'
    title_zh: 兴乡塾正师长劝农重本
    rationale: 教术之端自闾巷始，人材之成自儿童始，果行育德则暴慢放肆不设于身
