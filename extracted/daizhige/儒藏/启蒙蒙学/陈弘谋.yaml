  dilemmas:
  - 记诵词章速成与德行根本养正之辨
  - 科名利禄之诱与孝弟忠信立志之正
  - 琐屑小节之讥与源洁流清世教之任
  lesson: 蒙以养正是为圣功，自闾巷儿童始，毋轻小节，毋骛速成，循循规矩以笃伦理砥躬行
  summary_first_person: 余桂林陈弘谋，公余考昔贤养正遗规，择其简要可通行者厘为二卷，用以流布乡塾，俾父兄师长以是教其子弟，切勿以读书取科名之说汩乱良知，但愿源洁流清，于世教少助
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%90%AF%E8%92%99%E8%92%99%E5%AD%A6/%E5%85%BB%E6%AD%A3%E9%81%97%E8%A7%84.html
