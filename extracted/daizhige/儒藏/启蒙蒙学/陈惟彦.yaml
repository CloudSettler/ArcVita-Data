    start_date: 1898-06-01
    highlight_event_id: guji-陈惟彦-event-1
  - key: climax
    name: 己亥春二月课程成书
    labels:
      zh: 高潮
    start_date: 1899-03-01
    highlight_event_id: guji-陈惟彦-event-2
  - key: closure
    name: 付塾施行便俗易行
    labels:
      zh: 收束
    start_date: 1899-06-01
    highlight_event_id: guji-陈惟彦-event-2
  decisions:
  - date: 1898-06-01
    title_zh: 定六岁至八岁为第一级先识字讲义兼心算
    rationale: 古圣六年教数方名，泰西字训图算易入，先开其悟事半功倍
  - date: 1899-03-01
    title_zh: 定十二岁至十六岁第三级兼习中外史地语言格致医学体操后习帖括
    rationale: 先令多识嘉言懿行以固其本，明治乱大纲储肆应之才，慎勿早习帖括消沮英华
- id: guji-陈惟彦-endeavor-2
  title_zh: 立幼学规正教授养正之法
  summary_zh: 立学礼明敬服劳示罚定课讲贯勤授休息八规，令塾师认真训诲随机指点，使童孺乐从各得成就
  phases:
  - key: brewing
    name: 鉴施悖求佛养成交失
    labels:
