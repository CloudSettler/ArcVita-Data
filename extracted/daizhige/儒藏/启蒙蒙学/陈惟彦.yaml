    start_date: 1895-01-01
    highlight_event_id: guji-陈惟彦-event-1
  - key: breakthrough
    name: 揭授蒙背诵不讲之误
    labels:
      zh: 突破
    start_date: 1898-01-01
    highlight_event_id: guji-陈惟彦-event-2
  - key: climax
    name: 学礼讲贯定课八规并立
    labels:
      zh: 高潮
    start_date: 1899-03-01
    highlight_event_id: guji-陈惟彦-event-3
  - key: closure
    name: 望师认真训诲造福童孺
    labels:
      zh: 收束
    start_date: 1899-06-01
    highlight_event_id: guji-陈惟彦-event-3
  decisions:
  - date: 1899-03-01
    title_zh: 行朔望释奠讲圣谕广训养廉耻
    rationale: 崇圣教习仪范民礼中，使常知警乐于信从
  - date: 1899-03-01
    title_zh: 定每日讲贯复述与定课休息之节
    rationale: 童子全恃讲解启导，积久自贯，张而不弛藏修息游，课程善而教授亦须得法
events:
- id: guji-陈惟彦-event-birth
  title_zh: 出生于清末
  date: 1850-01-01
  year_of: 1850
  description_zh: 生于清道咸之间，江南士人之家，少承经训，长究礼学，留意蒙养
- id: guji-陈惟彦-event-1
  title_zh: 察俗学之弊酝酿改教
  date: 1890-01-01
  year_of: 1890
  description_zh: 见龆龀授经有诵无讲，稍长授帖括以投时好弋科第，心术先坏，中材困于俗学，遂思本内则参西法以救之
- id: guji-陈惟彦-event-2
  title_zh: 光绪己亥春成幼学分年课程
  date: 1899-03-01
  year_of: 1899
  description_zh: 春二月成书，课分三级，六岁至八岁识字韵语心算，九岁至十一岁孝弟经史舆地珠算笔算，十二岁至十六岁读经明大义兼习中外文史算图格致医学体操语言，列应读书习书数十种
- id: guji-陈惟彦-event-3
  title_zh: 同期订立幼学规八条
  date: 1899-03-01
  year_of: 1899
  description_zh: 立学礼明敬服劳示罚定课讲贯勤授休息之规，朔望行三跪九叩讲广训，每日解字串讲复述始授下课，月朔望及节假散学休养，戒扑头挞背，务循循善诱
- id: guji-陈惟彦-event-death
  title_zh: 逝世于清末
  date: 1905-01-01
  year_of: 1905
  description_zh: 课程既布，付塾施行，望教授得法由少而壮成通儒正士，中道废学者亦涵濡义理不蹈非辟，后卒于光绪末年
