  name_zh: 陈惟彦
  names:
    zh: 陈惟彦
    en: Chen Weiyan
  lifespan:
    birth:
      date: 1850-01-01
      precision: year
      is_circa: true
      raw: 清末人，生年不详，约道咸之间
    death:
      date: 1905-01-01
      precision: year
      is_circa: true
      raw: 清末人，卒年不详，约光绪末年
  birth_date: 1850-01-01
  death_date: 1905-01-01
  era: 清
  reign_ref: 光绪
  archetype: 蒙学改革者
  dilemmas:
  - 俗学重帖括轻为人，心术先坏，中材达则用非所学，穷则学无所用，如何救之
  - 古圣内则本末兼具与泰西幼学易入有用，如何参合又不废干禄之具
  lesson: 蒙以养正为圣功，幼学之正一生之正，教必循年分级，讲贯得法，方能成通儒正士而不为俗学所误
  summary_first_person: 我是陈惟彦，清末留意蒙养之人，见龆龀入塾有诵无讲，稍长舍经授帖括，利欲中其腑肠，心术先坏，故本礼内则，参泰西字训图算天地言语体操诸法，间以帖括，分六岁至十六岁为三级，订为幼学课程，又立幼学规以正教授之法，欲使子弟知为人之道，有适世之用，又便俗易行，不废干禄，望中人以下皆无弃材
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%90%AF%E8%92%99%E8%92%99%E5%AD%A6/%E5%B9%BC%E5%AD%A6%E5%88%86%E5%B9%B4%E8%AF%BE%E7%A8%8B.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%90%AF%E8%92%99%E8%92%99%E5%AD%A6/%E5%B9%BC%E5%AD%A6%E5%88%86%E5%B9%B4%E8%AF%BE%E7%A8%8B.md
endeavors:
- id: guji-陈惟彦-endeavor-1
  title_zh: 本内则参西法编订幼学分年课程
  summary_zh: 以六岁至十六岁分三级，六岁识字韵语心算，九岁孝弟经史舆地珠算笔算，十二岁见经大义兼习文史算图格致医学语言体操，使知为人且适世用
  phases:
  - key: brewing
    name: 忧俗学毒酝酿新教
