  decisions:
  - date: 1179
    title_zh: 往建阳谒朱熹而师事之
    rationale: 悟科举不足为学愤求圣贤之道故尽弃旧习而从朱子游
  - date: 1200
    title_zh: 朱子没后坚持讲学不仕
    rationale: 念斯道之重不以死生易志愿以讲明遗经为己任而不求闻达
