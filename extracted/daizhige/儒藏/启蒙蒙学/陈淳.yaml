  - date: 1212
    title_zh: 述北溪字义以辨经训
    rationale: 患学者昧于名义之辨故取四书要字详加讲辨使性理之旨粲然可晓
  - date: 1220
    title_zh: 作经学启蒙以教初学
    rationale: 欲使蒙士知天地之性人伦之序由孝悌忠信以进于圣贤故撮经要为韵语以便诵习
