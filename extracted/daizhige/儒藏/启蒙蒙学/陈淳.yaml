  summary_first_person: 吾陈淳字安卿号北溪，闽之龙溪人，早岁慨然向道，师事朱子而得闻性理之要，晚岁讲学授徒，以洒扫应对进退之节养童蒙之正，著小学诗礼以明事亲事长之序，愿后学由近及远以入圣贤之域
