  dilemmas:
  - 大礼议中徇君亲与守旧统之间如何秉礼守正
  - 居庙堂之高后如何以蒙养家法挽回世风人心
  lesson: 蒙以养正为圣功，正心始于洒扫应对，兴家始于童蒙之教
  summary_first_person: 吾南海霍韬，号渭厓，正德进士，历事武宗世宗，以议礼进，以守礼立身，晚年作蒙规家训三篇，教子弟以孝亲弟长尊师敬友，诵读字画咏歌习礼，愿正其心以作圣，不负君亲师友之恩
