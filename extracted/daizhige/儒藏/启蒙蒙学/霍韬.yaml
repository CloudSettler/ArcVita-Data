endeavors:
- id: guji-霍韬-endeavor-1
  title_zh: 大礼议明伦与礼部经世
  summary: 正德进士入翰林，嘉靖初以议礼合上意，累迁詹事礼侍，终至南礼部尚书礼部尚书，以礼匡君革新祀典朝仪
  phases:
  - key: brewing
    name: 庶吉士观礼养望
    labels:
      zh: 翰林养望
    start_date: 1514
    highlight_event_id: guji-霍韬-event-jinshi-1514
  - key: breakthrough
    name: 大礼议上疏定伦
    labels:
      zh: 明伦定礼
    start_date: 1524
    highlight_event_id: guji-霍韬-event-daliyi-1524
  - key: climax
    name: 掌礼革新祀典
    labels:
      zh: 掌礼经世
    start_date: 1528
    highlight_event_id: guji-霍韬-event-libu-1528
  - key: closure
    name: 宗伯致仕谥文敏
    labels:
      zh: 礼成身退
    start_date: 1540
    highlight_event_id: guji-霍韬-event-death
  decisions:
  - date: 1524
    title_zh: 上疏议大礼尊本生
    rationale: 以为人后者之义不可乱嫡统，尊亲並重以安君心而全大伦
  - date: 1528
    title_zh: 请正祀典釐革淫祠
    rationale: 以礼有节文，欲去媚神黩祭以复古礼，端君心正风俗
- id: guji-霍韬-endeavor-2
  title_zh: 渭厓家训与蒙养教化
  summary: 鉴于世风浇漓，述蒙规三篇，立养心正容诵读习礼之法，推行于家塾乡校，欲以童蒙之教兴家作文圣之基
  phases:
  - key: brewing
    name: 南海设塾察蒙弊
    labels:
      zh: 察弊立教
    start_date: 1520
    highlight_event_id: guji-霍韬-event-jinshi-1514
  - key: breakthrough
    name: 述蒙规养心正容
    labels:
      zh: 养正立规
    start_date: 1532
    highlight_event_id: guji-霍韬-event-jiaxun-1535
  - key: climax
    name: 推诵读咏歌习礼
    labels:
      zh: 游艺致知
    start_date: 1535
    highlight_event_id: guji-霍韬-event-jiaxun-1535
  - key: closure
    name: 家训成书传后学
    labels:
      zh: 成书诒后
    start_date: 1538
    highlight_event_id: guji-霍韬-event-jiaxun-1535
  decisions:
  - date: 1532
    title_zh: 定孝亲弟长尊师敬友四目
    rationale: 以仁义礼智存养童心，先立人伦大端以遏人欲扩天理
  - date: 1535
    title_zh: 定诵读字画咏歌习礼四艺
    rationale: 以致知开明心，以游艺存养心，悠久不息可使愚者明塞者聪
events:
- id: guji-霍韬-event-birth
  title_zh: 生于广州南海
  date: 1487
  year_of: 1487
  description: 明成化二十三年生于广东广州府南海县，幼颖敏力学笃志圣贤
  place_zh: 广东南海
- id: guji-霍韬-event-jinshi-1514
  title_zh: 正德九年登进士
  date: 1514
  year_of: 1514
  description: 正德九年中进士，选庶吉士授兵部主事，以气节学行见重于时
  place_zh: 京师
- id: guji-霍韬-event-daliyi-1524
  title_zh: 大礼议上疏显名
  date: 1524
  year_of: 1524
  description: 嘉靖三年上疏议大礼，言人后之义，主尊本生兴献王，深合世宗意，繇是骤迁詹事翰林学士
  place_zh: 京师
- id: guji-霍韬-event-libu-1528
  title_zh: 累迁礼部论祀典
  date: 1528
  year_of: 1528
  description: 累迁礼部右侍郎署掌礼部事，议正孔庙祀典釐革群祀，风裁峻整，为士林所瞻
  place_zh: 京师
- id: guji-霍韬-event-jiaxun-1535
  title_zh: 作霍渭厓家训蒙规
  date: 1535
  year_of: 1535
  description: 官南礼部尚书任上及归里，述家训蒙规三篇，立养心正容四伦四艺之教，流布乡校家塾
  place_zh: 南京并南海
- id: guji-霍韬-event-death
  title_zh: 卒于礼部尚书任
  date: 1540
  year_of: 1540
  description: 嘉靖十九年卒于礼部尚书兼文渊阁大学士任，年五十四，赠少保谥文敏，著有渭厓文集家训传世
  place_zh: 京师
