    rationale: 循序渐进熟读精思虚心涵泳切己体察著紧用力居敬持志，千古不磨
  - date: '1830-01-01'
    title_zh: 举第一等人第一等事以厉志
    rationale: 童蒙不解精修之语，须举圣贤师儒学问经济为楷模，使当仁不让
