  - title_zh: 专精与博通之衡
    description: 经史百家卷帙繁重，贪多鹜广则庞杂无得，须专一致志以达博通
  - title_zh: 科名与实学之辨
    description: 不徒弋取科名，须深通经术博稽史事，以经世致用裨补国计民生
  lesson: 蒙养贵早，专致精勤，循序渐进，明体达用方为实学
  summary_first_person: 吾立宏远谟斋家塾，以明德行厉志气亲师友储书籍务实学为总纲，课子弟贵早修求专致尚精勤，遵朱子读书法，仿程端礼分年日程，自识字小学以至经史古文，循循善诱以成德达才
