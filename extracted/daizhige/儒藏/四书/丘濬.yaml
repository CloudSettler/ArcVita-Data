  decisions:
  - date: 1470
    title_zh: 仿真氏体例别立十二目
    rationale: 真氏止于修齐而阙治平，必先立朝廷百官邦本国用礼乐祭祀教化规制刑宪武备驭夷成功化之目，方能兼本末合内外
  - date: 1487-11-18
    title_zh: 奏请摘要下内阁议行
    rationale: 所载皆可见之行事，不欲徒为空言，故请摘其要者付内阁议行以见施行之实
