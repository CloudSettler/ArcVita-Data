  decisions:
  - date: 1465
    title_zh: 以真氏衍义充经筵讲义
    rationale: 太祖大书殿壁列圣屡讲经筵，欲使人君举修齐而措之国天下，故亲睹儒臣进讲而益坚补阙之志
  - date: 1491
    title_zh: 以旧学素讲经营新政建置
    rationale: 新政大建置皆旧学素讲明之理，必广充格致之功方能致雍熙太和之治，故受阁务以身任之
events:
- id: guji-丘濬-event-birth
  date: 1421
  year_of: 1421
  title_zh: 生于琼山
  description_zh: 明永乐十九年生于广东琼山，字仲深，号深庵，少留心扶世读书著书
- id: guji-丘濬-event-jinshi
  date: 1454
  year_of: 1454
  title_zh: 景泰五年进士入仕
  description_zh: 景泰五年登进士第，入翰林，历司文墨，缀经筵班行，睹儒臣以真氏衍义进讲，遂萌补阙之志
- id: guji-丘濬-event-compiling
  date: 1487
  year_of: 1487
  title_zh: 缮写衍义补成编
  description_zh: 出教大学之暇，采六经诸史百氏之言，分为十二目，附以己见，缮写成大学衍义补一百六十卷并目录
- id: guji-丘濬-event-present-book
  date: 1487-11-18
  year_of: 1487
  title_zh: 进大学衍义补于孝宗
  description_zh: 以国子监掌监事礼部右侍郎上表进书，请摘其要下内阁议行，诏嘉奖命录副本付书坊刊行
- id: guji-丘濬-event-grand-secretary
  date: 1491
  year_of: 1491
  title_zh: 入文渊阁预机务
  description_zh: 弘治初政擢文渊阁大学士，以掌故淹通参赞新政，持海运等议，务以辨博济其说
- id: guji-丘濬-event-death
  date: 1495
  year_of: 1495
  title_zh: 卒于京师
  description_zh: 明弘治八年卒于官，年七十五，其书后于万历间重梓，御制序称其有功于大学体用之全
