  dilemmas:
  - title_zh: 体用全缺与补阙续貂之讥
    description_zh: 真氏衍义止于修齐而阙治平，欲补则恐僭逾前贤，不补则体用不全，决以续貂自任而立十二目以成全书
  - title_zh: 忠言切要与避祸全身之择
    description_zh: 明中叶阉竖恣肆，欲尽纳忠之责又虑触忌，终以经制政典为主而略于宦寺，遂招避书不书之议
  lesson: 学贵体用兼赅，补阙须贯串古今而见之可行，方能收格致修齐之功于治平
  summary_first_person: 吾远方下士叨官禁近，见真氏衍义止于修齐而阙治国平天下，深惜体用未全，遂采经传子史附以己见，分为十二目，成大学衍义补一百六十卷以献，愿摘其要者下内阁议行，以收明德新民之功
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%9B%9B%E4%B9%A6/%E5%A4%A7%E5%AD%A6%E8%A1%8D%E4%B9%89%E8%A1%A5.html
