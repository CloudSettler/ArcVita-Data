person:
  qid: guji-余允文
  name_zh: 余允文
  names:
    zh: 余允文
    en: Yu Yunwen
  lifespan:
    birth:
      date: '1120-01-01'
      precision: year
      is_circa: true
      raw: 建安人，生年失载，约隆兴前四十载
    death:
      date: '1190-01-01'
      precision: year
      is_circa: true
      raw: 卒年失载，约隆兴后
  birth_date: '1120-01-01'
  death_date: '1190-01-01'
  era: 南宋
  reign_ref: 宋孝宗隆兴
  archetype: 尊孟卫道之儒
  dilemmas:
  - title_zh: 从俗诋孟以快意还是折以公议以自信
    description_zh: 温公疑而不敢非，泰伯非近于诋，叔友诋逮于骂，时论蜂起，当随波逐流还是分辨是非定一尊
  - title_zh: 谋身迎合还是辟邪卫道
    description_zh: 世讥迎合风气武断乡里，当顾人品毁誉还是惧仁义道泯而为后学明辨
  lesson: 道不明由无公议，必自信而后信于人，以真儒之辩复泰山岩岩之观
  summary_first_person: 余建安隐之也，惧世学者随波逐流荡其心术，取司马温公李泰伯郑叔友之说折以公议而辩之，非敢必人之信，姑以自信，命曰尊孟辨，俟有道者正焉
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%9B%9B%E4%B9%A6/%E5%B0%8A%E5%AD%9F%E8%BE%A8.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%9B%9B%E4%B9%A6/%E5%B0%8A%E5%AD%9F%E8%BE%A8.md
endeavors:
- id: guji-余允文-endeavor-1
  title_zh: 撰尊孟辨三卷折衷温李郑三家
  description_zh: 取温公疑孟十一则附史剡一则李觏常语十七则郑叔友折衷十则，以经义春秋大义逐条分辨，尊孔孟仁义时中之道
  phases:
  - key: brewing
    name: 会萃三家疑诋之说
    labels:
      zh:
      - 蒐集疑孟
    start_date: '1160-01-01'
    highlight_event_id: guji-余允文-event-1
  - key: breakthrough
    name: 折以公议逐条立辩
    labels:
      zh:
      - 清和时中
    start_date: '1162-01-01'
    highlight_event_id: guji-余允文-event-2
  - key: climax
    name: 隆兴初春作原序定名
    labels:
      zh:
      - 尊孟自信
    start_date: '1163-02-15'
    highlight_event_id: guji-余允文-event-2
  decisions:
  - date: '1162-06-01'
    title_zh: 以时中解夷惠清和之弊
    rationale: 孟言隘与不恭言末流之弊，非疵圣清圣和，孔子时清时和是圣之时，以此解温公隘恭之疑
  - date: '1163-02-15'
    title_zh: 命书曰尊孟辨以俟有道
    rationale: 道不同不相知，不必人之信，先求自信，立公议以救荡心
- id: guji-余允文-endeavor-2
  title_zh: 作续辨别录原孟申明大义
  description_zh: 续辨王充论衡刺孟十则苏轼论语说八则，别录厘然具条理，又作原孟三篇总括大意反复申明，以复完书旧观
  phases:
  - key: breakthrough
    name: 续辨充轼之刺孟解经
    labels:
      zh:
      - 辟邪卫道
    start_date: '1163-06-01'
    highlight_event_id: guji-余允文-event-3
  - key: closure
    name: 作原孟三篇总括申明
    labels:
      zh:
      - 原孟守经
    start_date: '1164-01-01'
    highlight_event_id: guji-余允文-event-3
  decisions:
  - date: '1163-09-01'
    title_zh: 以法与孝辨舜窃负而逃之设问
    rationale: 桃应设事非法已行，明士守先王公法舜不以私废公，宁弃天下全人子之道，不可无辩
  - date: '1164-03-01'
    title_zh: 以正变大义明贵戚易位之权
    rationale: 尧舜让汤武伐伊尹放太甲皆处变，春秋归罪大臣经世虑深，得孟子遗意则不为簒乱之资
events:
- id: guji-余允文-event-birth
  type: birth
  title_zh: 建安余氏生允文
  date: '1120-01-01'
  year_of: 1120
  description_zh: 宋建安人生，字隐之，生年失载约推隆兴前，少通经术笃信孔孟
- id: guji-余允文-event-1
  type: career
  title_zh: 会萃温李郑疑孟之说
  date: '1160-03-01'
  year_of: 1160
  description_zh: 取司马光疑孟李觏常语郑叔友艺圃折衷诸篇，考其疑信诋骂之别，立折以公议之例
- id: guji-余允文-event-2
  type: career
  title_zh: 隆兴元年初春作尊孟辨原序
  date: '1163-02-15'
  year_of: 1163
  description_zh: 建安初春望日作序，明问以辩之辩之弗措之义，定尊孟辨三卷之名，以时中救清和之弊诸条成书
- id: guji-余允文-event-3
  type: career
  title_zh: 成续辨二卷别录一卷原孟三篇
  date: '1164-08-01'
  year_of: 1164
  description_zh: 续辨王充苏轼之说，别录厘然有条理，原孟三篇总括大意反复申明，备完书体例以显微旨
- id: guji-余允文-event-death
  type: death
  title_zh: 隐之卒于建安
  date: '1190-01-01'
  year_of: 1190
  description_zh: 卒年失载约推隆兴后，其书后附朱子读余氏尊孟辨说，四库提要称卓然不磨久湮复显
