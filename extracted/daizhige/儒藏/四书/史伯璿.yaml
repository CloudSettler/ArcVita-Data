  decisions:
  - date: 1350-01-01
    title_zh: 以集注或问为准绳别白异说
    rationale: 朱子门人记述润色多失真，须考年月先后覆按原书，不可一字奉为经典
  - date: 1360-01-01
    title_zh: 兼存异说以候知道者折衷
    rationale: 于智字训释等处阙疑不断，不强作臆说，留待后贤
