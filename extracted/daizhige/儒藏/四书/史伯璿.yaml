  dilemmas:
  - 朱子著述传述异同门户尊信反淆本旨，何以别白真伪先后
  - 饶氏诸家变易章句自谓亲切受用，是否可从
  lesson: 尊朱必先求真，析之极精而后合之尽大，方不以尊信害本旨
  summary_first_person: 吾温州平阳史伯璿字文玑，穷三十年之力，集赵顺孙吴真子胡炳文许谦陈栎饶氏张氏诸说，考其与集注异同而论辨之，欲还朱子本旨于天下
