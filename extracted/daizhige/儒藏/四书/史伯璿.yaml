  decisions:
  - date: 1365-01-01
    title_zh: 明明德于天下该体用合论
    rationale: 篇首分体用言自明，后段合体用言极全，不可专指新民亦不可专指自明
  - date: 1367-01-01
    title_zh: 直斥变易章句者为欺世
    rationale: 教人之法不容自贬，大匠不为拙工改绳墨，守正方能造圣域
