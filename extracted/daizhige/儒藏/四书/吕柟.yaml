  decisions:
  - date: 1519
    title_zh: 谏止武宗南巡不避廷杖
    rationale: 以修身为本，不以利害摇其格物诚意之守，宁受杖而不自欺其知
  - date: 1528
    title_zh: 守薛瑄实学不逐空谈
    rationale: 文章虽染时派，学问必宗笃行，以躬行证四书，不为空言所转
- id: guji-吕柟-endeavor-2
  title_zh: 泾野讲学辑录四书因问
  summary_zh: 门人质问四书随问开示，大学中庸各一卷论孟各二卷，由魏廷萱等辑刊为六卷
  phases:
  - key: brewing
    name: 讲大学旧本次序本义
    labels:
      zh: 讲学
    start_date: 1525
