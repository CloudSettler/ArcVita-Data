    start_date: 1535
    highlight_event_id: guji-吕柟-event-sishu
  - key: closure
    name: 魏廷萱等校刊六卷成书
    labels:
      zh: 成书
    start_date: 1538
    highlight_event_id: guji-吕柟-event-sishu
  decisions:
  - date: 1530
    title_zh: 以明明德为纲统摄三纲领
    rationale: 明德能兼新民，至善必尽天理，不涉分析支离，令学者有归
  - date: 1535
    title_zh: 因八佾舞庭章戒门人华靡
    rationale: 推四书之言证诸躬行实事，开示亲切，使格物不为训诂空谈
