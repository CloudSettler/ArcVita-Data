  dilemmas:
  - 文章染李梦阳一派而学问宗法薛瑄，如何不以文害道
  - 格物致知聚讼纷纭，如何切己躬行以贯本末终始
  lesson: 以明明德为纲，以修身为本，格致诚正皆见诸实事，不为训诂空谈
  summary_first_person: 我是吕柟，字仲木，号泾野，高陵人，正德戊辰进士第一，官至南京礼部右侍郎，我以明明德为纲讲授四书，指门人服饰华靡以戒僭，务使学见诸躬行实事
