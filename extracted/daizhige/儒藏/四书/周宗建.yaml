  dilemmas:
  - 禅近之学与圣学矩度之间如何守正而不落虚悟
  - 强直敢言与保身全家之间如何抉择以殉国是
  - 经生章句与体贴身心之实用之间如何会通讲学
  lesson: 以孝弟为仁本以时习为实功立大局段而后求精微临大节而不可夺
  summary_first_person: 余松陵周宗建字季侯吴江人也万历癸丑进士初令武康与诸生商论语而著论语商二卷后官监察御史巡按湖广以劾魏忠贤见害崇祯初赠太仆寺卿谥忠毅平生以时习体贴身心以孝弟培植根本直道殉国无愧此心
