  era: 春秋
  reign_ref: 鲁襄公至鲁哀公
  archetype: 万世师表
  dilemmas:
  - 道不行于列国，是浮海居夷还是栖栖守道以待时
  - 出仕从政以行仁，是尽礼事人还是直道事人不顾毁誉
  - 富贵贫贱之间，是以道取舍还是以利取舍
  lesson: 以仁为本，以礼为节，忠恕一贯，学思并进，述而不作而化万世
  summary_first_person: 吾丘也，鲁鄹人也，十五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲不逾矩，一生述而不作，信而好古，以仁礼教人，老安少怀，欲以道济天下也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%9B%9B%E4%B9%A6/%E8%AE%BA%E8%AF%AD.md
