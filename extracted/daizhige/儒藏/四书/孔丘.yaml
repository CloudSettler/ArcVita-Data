      - 传道
    start_date: -484-01-01
    highlight_event_id: guji-孔丘-event-compile
  decisions:
  - date: -522-01-01
    title_zh: 有教无类广收弟子
    rationale: 唯仁可化民成俗，不论贵贱，皆以诗书礼乐教之，以成君子之德
  - date: -484-01-01
    title_zh: 述而不作删述诗书
    rationale: 道不行于时，则托空文以传后，使仁礼之道不坠于后世
- id: guji-孔丘-endeavor-2
  title_zh: 周游列国以道匡时
  summary: 仕鲁摄政而后去鲁适卫齐陈蔡宋楚，历说诸侯，虽困厄而不改其道，反鲁以终讲学
  phases:
