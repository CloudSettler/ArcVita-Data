  decisions:
  - date: -497-01-01
    title_zh: 去鲁而周游列国
    rationale: 鲁政不从，君臣失礼，不义而富贵如浮云，不如求仁得仁以明道于天下
  - date: -489-01-01
    title_zh: 厄困而不改其乐
    rationale: 君子固穷，小人穷斯滥，朝闻道夕死可矣，守仁安命以显天命之德
