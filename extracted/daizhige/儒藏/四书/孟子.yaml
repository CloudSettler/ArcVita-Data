  date: '-0372'
  year_of: -372
  location: 邹国
  description: 孟轲生于邹为鲁公族孟孙之后传闻字子舆又云字子车
- id: guji-孟子-event-study
  title_zh: 受业子思之门人
  date: '-0355'
  year_of: -355
  location: 邹鲁间
  description: 受业于子思之门人通五经尤长诗书易春秋得曾子子思孔子之统
- id: guji-孟子-event-liang
  title_zh: 至梁见梁惠王论义利王政
  date: '-0334'
  year_of: -334
  location: 大梁
  description: 梁惠王卑礼厚币招贤孟子至梁对以何必曰利亦有仁义并陈不违农时五亩百亩之制惠王不能用
- id: guji-孟子-event-qi
  title_zh: 游事齐宣王论王道乐民
  date: -0319
  year_of: -319
  location: 临淄
  description: 说齐宣王以与民偕乐独乐不若与众乐论制产养老发政施仁宣王不能用
- id: guji-孟子-event-retire
  title_zh: 退而与万章之徒讲学
  date: -0309
  year_of: -309
  location: 邹
  description: 所如不合退而与万章公孙丑之徒序诗书述仲尼之意授徒讲论性善养气
- id: guji-孟子-event-book
  title_zh: 作孟子七篇成
  date: '-0305'
  year_of: -305
  location: 邹
  description: 作孟子七篇凡二百六十一章二万四千六百八十五字韩愈推为醇乎醇程子许其有大功于圣门
- id: guji-孟子-event-death
  title_zh: 卒
  date: -0289
  year_of: -289
  location: 邹
  description: 孟轲卒后世尊为亚圣配享孔庙其书与论语大学中庸并为四书
