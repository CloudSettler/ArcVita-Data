  reign_ref: 周顯王至周赧王時
  archetype: 以仁義遏利欲之亞聖
  dilemmas:
  - 梁惠齊宣皆好利好戰言仁義王道多不見用當去當留
  - 楊墨縱橫惑世人心陷溺當力闢還是闕疑存厚
  lesson: 王何必曰利亦有仁義而已以養民教民為王道之始窮則著書以明道
  summary_first_person: 吾鄒人也受業於子思之門以仁義之說遊於齊梁見梁惠王首言何必曰利見齊宣王勸行王政雖時君不能用而吾闢楊墨辯義利著七篇以詔後世欲使天下知王道在得民心而已
  source_urls:
  - https://daizhige.org/孟子傳梁惠王章句上
  - https://github.com/daizhige-org/daizhigev20
