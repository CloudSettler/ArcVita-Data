person:
  qid: guji-孟子
  name_zh: 孟子
  names:
    zh: 孟轲
    en: Mencius
  lifespan:
    birth:
      date: '-0372'
      precision: year
      is_circa: true
      raw: 周烈王四年邹人生约前三七二年
    death:
      date: -0289
      precision: year
      is_circa: true
      raw: 约前二八九年卒
  birth_date: '-0372'
  death_date: -0289
  era: 战国中期
  reign_ref: 周显王至周赧王时
  archetype: 亚圣守道行仁义者
  dilemmas:
  - 出仕行王道与道不行则奉身而退之抉择
  - 言仁义与言功利之间防本塞源之坚持
  - 尊衰周与以王道救生民涂炭之时义判断
  lesson: 循天理行仁义则不求利而自无不利正人心存养性则可承孔氏之统
  summary_first_person: 吾邹人也受业于子思之门道既通而游齐梁以仁义王道说君君不能用则退而与万章之徒序诗书述仲尼之意作七篇以正人心辟邪说而已
  source_urls:
  - https://daizhige.org/MengZiJiShu.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/MengZiJiShu.md
endeavors:
- id: guji-孟子-endeavor-1
  title_zh: 游事齐梁论仁义王道
  summary: 受业通经后游齐宣梁惠梁襄齐湣诸君极言仁义王政不言功利因不用而去
  phases:
  - key: brewing
    name: 受业子思门人通达五经
    labels:
      zh: 师承求道
    start_date: '-0355'
    highlight_event_id: guji-孟子-event-study
  - key: breakthrough
    name: 至梁见惠王首辨义利
    labels:
      zh: 初见梁君
    start_date: '-0334'
    highlight_event_id: guji-孟子-event-liang
  - key: climax
    name: 游齐论王政养老制产
    labels:
      zh: 说齐行王
    start_date: -0319
    highlight_event_id: guji-孟子-event-qi
  - key: closure
    name: 道不行奉身而退不苟合
    labels:
      zh: 不合则去
    start_date: -0309
    highlight_event_id: guji-孟子-event-retire
  decisions:
  - date: '-0334'
    title_zh: 见梁惠王直言何必曰利亦有仁义而已
    rationale: 天下惟利是求故须防本塞源循天理则自无不利徇人欲则害随之
  - date: -0319
    title_zh: 劝齐梁行不违农时制民之产谨庠序之教
    rationale: 养生丧死无憾为王道之始制产教民使老者衣帛食肉黎民不饥不寒则可王
  - date: -0309
    title_zh: 言不合则去不枉道求合
    rationale: 识时守道不可枉尺直寻以道自任如颜子有孔子在可乐吾时无圣人则当以道自任
- id: guji-孟子-endeavor-2
  title_zh: 退而著书辟杨墨正人心
  summary: 与万章公孙丑等序诗书述仲尼之意作孟子七篇论性善养气仁义礼智以承三圣之统
  phases:
  - key: brewing
    name: 历聘不用观察时变
    labels:
      zh: 韬晦待时
    start_date: '-0314'
    highlight_event_id: guji-孟子-event-qi
  - key: breakthrough
    name: 与弟子讲论集仁义之言
    labels:
      zh: 授徒讲学
    start_date: -0309
    highlight_event_id: guji-孟子-event-retire
  - key: climax
    name: 作孟子七篇述圣道
    labels:
      zh: 著书立言
    start_date: '-0305'
    highlight_event_id: guji-孟子-event-book
  - key: closure
    name: 以性善养气之论传后世
    labels:
      zh: 道统有传
    start_date: -0295
    highlight_event_id: guji-孟子-event-book
  decisions:
  - date: '-0305'
    title_zh: 定七篇二百六十一章以明道
    rationale: 道述唐虞三代而接孔子子思不作空言须托诗书春秋以见王道本末
  - date: '-0305'
    title_zh: 首倡性善并辟杨墨告子诸说
    rationale: 人心之正本在仁义礼智之端邪说生于心害于政必正人心然后可救天下
  - date: '-0300'
    title_zh: 以养气配道义立大丈夫之教
    rationale: 孔子只言仁与志吾须发明仁义养气使学者知圣道全体可由修身达平天下
events:
