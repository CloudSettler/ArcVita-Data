  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%9B%9B%E4%B9%A6/%E5%9B%9B%E4%B9%A6%E9%80%9A%E8%AF%81.html
endeavors:
- id: guji-张存中-endeavor-1
  title_zh: 排纂旧说成四书通证
  summary: 因胡炳文通释略名物乃取杜缑山旁通薛寿之引证熊氏标题赵氏笺义等删冗从简去非取是成六卷
  phases:
  - key: brewing
    name: 感通释略名物而立志补苴
    labels:
      zh: 酝酿立志
    start_date: '1320'
    highlight_event_id: guji-张存中-event-1
  - key: breakthrough
    name: 雠校旁通引证标题笺义去繁从简
    labels:
      zh: 雠校突破
    start_date: '1325'
    highlight_event_id: guji-张存中-event-1
  - key: climax
    name: 引经数典字字著所出六卷初成
    labels:
      zh: 成书高峰
    start_date: '1328'
    highlight_event_id: guji-张存中-event-2
  - key: closure
    name: 以书附通后请胡炳文序而传行
    labels:
      zh: 附序收束
    start_date: '1328'
    highlight_event_id: guji-张存中-event-2
  decisions:
  - date: '1325'
    title_zh: 删冗从简去非取是
    rationale: 不使初学夸多务靡玩物丧志故参取诸家仅存三之一
  - date: '1328'
    title_zh: 名曰通证以附通后
    rationale: 通释已明理通证当审事相辅而行故不别立专名
- id: guji-张存中-endeavor-2
  title_zh: 从胡云峰游明四书用事
  summary: 与胡炳文交游讲论四书用意用事之审订立凡例标题证引之法以便初学检阅
  phases:
  - key: brewing
    name: 新安从游通释之学
    labels:
      zh: 从游酝酿
    start_date: '1315'
    highlight_event_id: guji-张存中-event-1
  - key: breakthrough
    name: 考定凡例参取旁通诸书
    labels:
      zh: 考定突破
    start_date: '1320'
    highlight_event_id: guji-张存中-event-1
  - key: climax
    name: 详难略易标经子史集出处
    labels:
      zh: 考证高峰
    start_date: '1327'
    highlight_event_id: guji-张存中-event-2
  - key: closure
    name: 示同志求是正传习四书
    labels:
      zh: 传习收束
    start_date: '1328'
    highlight_event_id: guji-张存中-event-2
  decisions:
  - date: '1320'
    title_zh: 只证朱子所引不复出通内已注
    rationale: 详所难知略所易见以省繁复使检阅简便
  - date: '1327'
    title_zh: 不标系某人所纪虑其繁
    rationale: 所引经子史集则一故浑而不分以从简约
events:
- id: guji-张存中-event-birth
  title_zh: 生于新安
  date: '1290'
  year_of: 1290
  description: 张存中字德庸生于徽州新安约当元世祖至元年间家世业儒
- id: guji-张存中-event-1
  title_zh: 从胡炳文游研治名物训诂
  date: '1320'
  year_of: 1320
  description: 与云峰老人胡炳文交游见其四书通释明理而略名物遂发心排纂旧说参校旁通引证诸书
- id: guji-张存中-event-2
  title_zh: 四书通证六卷成胡炳文作序
  date: '1328-01-01'
  year_of: 1328
  description: 书成凡大学或问通证一卷论语集注通证二卷孟子集注通证二卷中庸章句或问通证一卷泰定戊辰正月胡炳文序称删冗从简去非取是
- id: guji-张存中-event-death
  title_zh: 卒于元末
  date: '1350'
  year_of: 1350
  description: 通证既传于学官四库馆臣称其征引详明可省检阅之烦存中约卒于元顺帝时
