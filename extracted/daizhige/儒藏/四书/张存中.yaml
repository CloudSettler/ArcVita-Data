  reign_ref: 泰定
  archetype: 经学家
  dilemmas:
  - title_zh: 义理与名物孰重
    description: 胡炳文通释明义理而略名物繁简之间如何取舍
  - title_zh: 述作与僭越之惧
    description: 指摘先辈删繁从简恐招僭越之讥然为初学计不得不为
  lesson: 删冗从简去非取是使事通理明足以便初学检阅
  summary_first_person: 吾新安张存中字德庸因胡云峰四书通释略于名物乃排纂旧说删繁从简而成通证六卷以附其后愿学者由事以明理勿玩物丧志
  source_urls:
