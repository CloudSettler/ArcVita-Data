  - 师友辨难与道同志合之间与朱熹反复争辩而不失敬
  lesson: 务本求实以孝弟忠信为仁之本以敬立身以行践言学贵时习而日新
  summary_first_person: 吾张栻字敬夫世称南轩生于忠献之家少承庭训长师胡宏讲仁于湖湘乾道九年癸巳岁成论语解十卷与晦庵往复商订百余条虽龂龂不合终归于求是平生欲以孝弟忠信为本修身以任道讲学以济时虽未得大用此心不改
  source_urls:
