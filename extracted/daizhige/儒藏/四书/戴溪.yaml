  archetype: 书院经师
  dilemmas:
  - 训诂考据与义理阐发难以兼全
  - 书院讲习务本与仕途事功难以两立
  lesson: 务本求诚以贯经意，持论醇正可补学者，日用孝弟信敬即是为政为学之本
  summary_first_person: 我戴溪字岷隐，奉化人，淳熙进士，尝领石鼓书院山长，与湘中诸生集所闻为论语答问三卷，又续吕氏家塾读诗记，务明经意以诲人，朱子一见以为近道，一生以讲学传道为事
