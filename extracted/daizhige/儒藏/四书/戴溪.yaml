endeavors:
- id: guji-戴溪-endeavor-1
  title_zh: 石鼓书院讲论语成答问
  summary_zh: 淳熙丙午丁未间领石鼓书院山长，与湘中诸生问答论语，集所闻成三卷，持论醇正，重义理发明
  phases:
  - key: brewing
    name: 领石鼓山长
    labels:
      zh: 山长到任
    start_date: 1186
    highlight_event_id: guji-戴溪-event-shigu
  - key: breakthrough
    name: 与诸生集问答
    labels:
      zh: 讲习论语
    start_date: 1186
    highlight_event_id: guji-戴溪-event-shigu
  - key: climax
    name: 答问三卷成编
    labels:
      zh: 成书传世
    start_date: 1187
    highlight_event_id: guji-戴溪-event-lunyu-book
  decisions:
  - date: 1186
    title_zh: 以时习朋来发明心性之乐
    rationale: 矫正功利求知之弊，令学者玩味义理自得悦乐，不以外求为乐
  - date: 1187
    title_zh: 集诸生所闻为定本不事词章
    rationale: 存讲席亲切启发之益，使后学得圣门诱进之机，重躬行次第
- id: guji-戴溪-endeavor-2
  title_zh: 登第入仕续诗记传经
  summary_zh: 淳熙五年登进士第，历官讲筵，续吕氏家塾读诗记，晚年经说并重，宝庆初许复序刻石鼓答问，四库著录流传
  phases:
  - key: brewing
    name: 淳熙登第入仕
    labels:
      zh: 科第出身
    start_date: 1178
    highlight_event_id: guji-戴溪-event-jinshi
  - key: breakthrough
    name: 续读诗记进讲经筵
    labels:
      zh: 经筵著述
    start_date: 1195
    highlight_event_id: guji-戴溪-event-jinshi
  - key: closure
    name: 宝庆序刻四库著录
    labels:
      zh: 刊行传世
    start_date: 1225
    highlight_event_id: guji-戴溪-event-lunyu-book
  decisions:
  - date: 1195
    title_zh: 续吕氏诗记阐发经意
    rationale: 补前人未备，以义理贯穿诗教，使学者知温柔敦厚之旨
  - date: 1205
    title_zh: 守醇正不苛求名物
    rationale: 知训诂与义理各有所长，宁存阐发防言之功，不以考据小疵废大义
