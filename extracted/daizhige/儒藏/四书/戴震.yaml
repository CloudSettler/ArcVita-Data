endeavors:
- id: guji-戴震-endeavor-1
  title_zh: 训诂考据治经立实学
  summary: 由江永问学博究六书声韵训诂历算，以语言文字求经义本真，授段玉裁等，开乾嘉朴学一派
  phases:
  - key: brewing
    name: 休宁受经从江永问礼
    labels:
      zh:
      - 酝酿
      - 问学
    start_date: 1738-01-01
    highlight_event_id: guji-戴震-event-birth
  - key: breakthrough
    name: 入京以经学考据名闻
    labels:
      zh:
      - 突破
      - 成名
    start_date: 1754-09-01
    highlight_event_id: guji-戴震-event-rujing
  - key: climax
    name: 入四库馆纂修校经
    labels:
      zh:
      - 高峰
      - 校雠
    start_date: 1773-03-01
    highlight_event_id: guji-戴震-event-siku
  - key: closure
    name: 授徒传学段玉裁等承绪
    labels:
      zh:
      - 收束
      - 传承
    start_date: 1776-01-01
    highlight_event_id: guji-戴震-event-siku
  decisions:
  - date: 1754-09-01
    title_zh: 弃科举帖括专治古经训诂
    rationale: 以帖括不足明道，欲由字义声韵求六经本义，还古贤圣条分缕析之理
  - date: 1773-03-01
    title_zh: 应征入四库全书馆任纂修
    rationale: 得尽读内府群籍以校水经注等经史，成考据实学，亦藉此表经义明道
- id: guji-戴震-endeavor-2
  title_zh: 义理批判撰孟子字义疏证
  summary: 辨理欲性命等字义，斥宋儒以理为得于天具于心及存理灭欲之说，立以情絜情自然分理之论
  phases:
  - key: brewing
    name: 少读论语易悟性与天道
    labels:
      zh:
      - 酝酿
      - 思辨
    start_date: 1740-01-01
    highlight_event_id: guji-戴震-event-rujing
  - key: breakthrough
    name: 辨宋儒杂老释理欲之谬
    labels:
      zh:
      - 突破
      - 立说
    start_date: 1766-01-01
    highlight_event_id: guji-戴震-event-siku
  - key: climax
    name: 撰成孟子字义疏证三卷
    labels:
      zh:
      - 高峰
      - 著述
    start_date: 1777-05-01
    highlight_event_id: guji-戴震-event-shuzheng
  - key: closure
    name: 以同情遂欲明仁政王道
    labels:
      zh:
      - 收束
      - 垂训
    start_date: 1777-06-01
    highlight_event_id: guji-戴震-event-shuzheng
  decisions:
  - date: 1766-01-01
    title_zh: 以理为分理不为心具之物
    rationale: 考六经孔孟理字本义皆为区分条理，反躬絜情无过无不及始谓得理，不可以意见当理
  - date: 1777-05-01
    title_zh: 发愤述孟子字义疏证以正人心
    rationale: 惧后人以杨墨老庄佛言汩乱孟子，又惧尊者以理责卑之祸，故不得不辩，明欲不可无节而不过
events:
- id: guji-戴震-event-birth
  title_zh: 生于休宁隆阜
  date: 1724-01-19
  year_of: 1724
  description: 雍正元年十二月十五生于安徽休宁隆阜戴氏，幼聪慧，从江永等问学，治经究礼算声韵
- id: guji-戴震-event-rujing
  title_zh: 入京师以经学名闻天下
  date: 1754-09-01
  year_of: 1754
  description: 赴顺天乡试入京，以六书声韵训诂考据名动公卿，讲学授徒，与惠栋段玉裁等论学
- id: guji-戴震-event-siku
  title_zh: 征入四库全书馆纂修赐进士
  date: 1773-03-01
  year_of: 1773
  description: 乾隆三十八年征入四库馆为纂修官，校订水经注等，考据精审，赐同进士出身授翰林院庶吉士
- id: guji-戴震-event-shuzheng
  title_zh: 撰成孟子字义疏证三卷
  date: 1777-05-01
  year_of: 1777
  description: 晚年述孟子字义疏证，分理气性命道义等目，辨天理为自然分理，以情絜情为得理，斥存理灭欲尊理责下之祸
- id: guji-戴震-event-death
  title_zh: 病卒于京师
  date: 1777-07-01
  year_of: 1777
  description: 乾隆四十二年五月二十七病卒于京师，年五十四，学行传于段玉裁王念孙等，实学大昌
