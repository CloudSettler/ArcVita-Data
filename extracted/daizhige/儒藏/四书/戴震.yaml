  dilemmas:
  - 以训诂考据实学求道与科举功名进退之难
  - 以情絜情得理与宋儒以意见为理存理灭欲之辨
  - 体民之情遂民之欲行仁政与以理责人流祸之戒
  lesson: 理在事情条分缕析而非心具之物，以我之情絜人之情无爽失始为理，学贵自得而化，不可以意见当理义
  summary_first_person: 吾休宁戴震字东原，少治六经究声韵训诂，壮游京师以经学名，晚入四库馆纂修，述孟子字义疏证三卷，明理为分理天理为自然之分理，斥理欲对立存理遏欲之谬，欲还圣人体民情遂民欲之王道
