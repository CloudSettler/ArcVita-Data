endeavors:
- id: guji-智旭-endeavor-1
  title_zh: 述论语点睛会通儒佛
  summary: 以灵觉本性释学而时习，以格物致知修身解孝弟忠信，贯通四书与佛法心印
  phases:
  - key: brewing
    name: 习儒研佛悟心
    labels:
      zh: 博览儒佛
    start_date: '1623'
    highlight_event_id: guji-智旭-event-ordination
  - key: breakthrough
    name: 以三谛三观解论语
    labels:
      zh: 会通立宗
    start_date: '1640'
    highlight_event_id: guji-智旭-event-writing
  - key: climax
    name: 论语点睛成书
    labels:
      zh: 述作点睛
    start_date: '1647'
    highlight_event_id: guji-智旭-event-writing
  decisions:
  - date: '1640'
    title_zh: 以觉释学立宗
    rationale: 以始觉合本觉释学而时习，使朋来不知皆成时习之时，悦乐不愠皆成说之血脉
  - date: '1647'
    title_zh: 以格物释时习
    rationale: 以致知在格物释时习之功，以修身为本释孝弟为仁之本，破弃物蹈空之弊
- id: guji-智旭-endeavor-2
  title_zh: 弘扬净土慎终追远
  summary: 以慎终追远归于念佛求生净土，以普度众生报多生父母之恩，倡素食戒杀忏悔修行
  phases:
  - key: brewing
    name: 专修净业发愿
    labels:
      zh: 净土发愿
    start_date: '1646'
    highlight_event_id: guji-智旭-event-writing
  - key: climax
    name: 劝孝劝戒普度群品
    labels:
      zh: 普劝念佛
    start_date: '1650'
    highlight_event_id: guji-智旭-event-preach
  - key: closure
    name: 示寂灵峰垂范后学
    labels:
      zh: 示寂垂范
    start_date: '1655'
    highlight_event_id: guji-智旭-event-death
  decisions:
  - date: '1650'
    title_zh: 以净土释慎终追远
    rationale: 以临终一心念佛为真慎终，以普度众生报恩为真追远，使民德归于本厚性德
  - date: '1652'
    title_zh: 劝亲戒杀念佛为大孝
    rationale: 杀生设祭反堕恶道，唯劝亲念佛求生净土永脱轮回，方为至孝至仁
events:
- id: guji-智旭-event-birth
  title_zh: 出生于江苏吴县
  date: '1599'
  year_of: 1599
  summary: 明万历二十七年生于古吴，宿具灵觉之性，少习儒书
- id: guji-智旭-event-ordination
  title_zh: 出家研习宗教
  date: '1623'
  year_of: 1623
  summary: 二十四岁出家，遍参宗教，悟惟精惟一允执厥中即三观心印，会通尧舜心法与佛法
- id: guji-智旭-event-writing
  title_zh: 述论语点睛
  date: '1647'
  year_of: 1647
  summary: 以学为宗主时习为旨趣悦为血脉，发明孝弟为仁之本温故知新不器之旨，述论语点睛示人随文入观
- id: guji-智旭-event-preach
  title_zh: 弘扬念佛戒杀之教
  date: '1650'
  year_of: 1650
  summary: 释慎终追远劝人慎终念佛追远报恩，劝提倡素食戒杀，示忏悔往生之道
- id: guji-智旭-event-death
  title_zh: 示寂于灵峰
  date: '1655'
  year_of: 1655
  summary: 清顺治十二年示寂，留论语点睛等述作，后人江谦为之补注，流通后世
