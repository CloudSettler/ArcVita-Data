  - title_zh: 杨叶空拳皆诱化与真实解脱何在
    description: 儒玄佛禅律教皆如黄叶空拳随婴孩所欲而诱之如何不滞名相直指现前一念之心
  - title_zh: 世间治平与出世解脱如何双全
    description: 大学为世间法总持阿弥陀经为出世法总持如何即身修家齐国治而出生死生净土究竟成佛
  lesson: 莫滞空拳黄叶当称性起修以格物致知诚意正心修身为本归明明德于天下
  summary_first_person: 吾年十二谈理学而不知理年二十习玄门而不知玄年二十三参禅而不知禅年二十七习律而不知律年三十六演教而不知教逮大病几绝归卧九华万虑尽灰一心无寄乃知儒玄佛禅律教无非杨叶空拳随缘诱化遂为彻因拈四书大旨晚年重阅旧稿补成点睛直指择乳以助显第一义谛
