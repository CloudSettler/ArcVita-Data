  - date: 1189-01-01
    title_zh: 因程子所定更考经文别为序次
    rationale: 旧本颇有错简，传文无统纪，故考经文正旧误为一经十传
  - date: 1189-09-01
    title_zh: 窃取程子之意补格致传阙文
    rationale: 第五章释格物致知之义今亡，故补以即物穷理豁然贯通之说以续圣绪
- id: guji-朱熹-endeavor-2
