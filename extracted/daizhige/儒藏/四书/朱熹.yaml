    start_date: 1177-01-01
    highlight_event_id: guji-朱熹-event-lunmeng
  - key: climax
    name: 大学详密中庸授徒
    labels:
      zh: 大学中庸纲领
    start_date: 1189-01-01
    highlight_event_id: guji-朱熹-event-daxue
