  dilemmas:
  - 表章圣经与僭逾获罪之惧，采辑补阙而恐蹈僭越
  - 明道化民与俗儒词章异端虚无充塞之间，坚守大学次第而不惑
  lesson: 格物致知以明明德，新民止于至善，学有次第不可躐等
  summary_first_person: 吾熹不敏，私淑河南程氏，见大学之书放失错简，遂因程子所定更考经文，采辑补阙以明明明德新民止于至善之纲，愿于国家化民成俗学者修己治人略有小补，虽知僭逾不敢辞也
