  dilemmas:
  - 集注屡更不定而或问未暇重编异同并存当何以示后学
  - 幼不及小学者年长后当直入大学还是以敬兼补小学之功
  - 亲民当作新民是否可以己意轻改经文而又不失传疑之义
  lesson: 以敬为圣学始终格物致知以明明德推以及民止于至善
  summary_first_person: 吾既作四书章句集注复因诸家纷错设为问答以明去取大学改定尤多中庸颇不自惬论孟屡更不定皆欲学者收放心养德性明明德于天下
