  decisions:
  - date: 1175
    title_zh: 以中和问答定戒惧谨独之功
    rationale: 人心危道心微不知所以治则天理难胜人欲故须精以察之一以守之使动静云为无过不及
  - date: 1180
    title_zh: 据程氏旧书斥老佛近理乱真之说
    rationale: 异端日盛老佛弥近理而大乱真幸此书不泯故有所考据以续绪有所据依以斥非而大子思之功
