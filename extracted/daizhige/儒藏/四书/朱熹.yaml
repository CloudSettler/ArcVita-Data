  decisions:
  - date: 1177-01-01
    title_zh: 设为问答以明集注去取
    rationale: 诸家之说纷错不一须明所以去取之意使学者晓然于折衷之由
  - date: 1189-01-01
    title_zh: 从程子以新解亲存本文作某当作某
    rationale: 以文义推则无理以传文考则有据用汉儒变例存疑而不侮圣言
- id: guji-朱熹-endeavor-2
  title_zh: 闽学讲学与道统阐明
  summary: 白鹿岳麓讲学鹅湖论辩以敬贯小学大学成己成物
  phases:
  - key: brewing
    name: 师事李侗潜心敬义
    labels:
      zh: 敬立本
    start_date: 1160-01-01
    highlight_event_id: guji-朱熹-event-jinshi
  - key: breakthrough
    name: 鹅湖之会辨无极太极
    labels:
      zh: 道问学尊德性
    start_date: 1175-06-10
    highlight_event_id: guji-朱熹-event-ehu
  - key: climax
    name: 白鹿洞揭示学规化民成俗
    labels:
      zh: 明明德于天下
    start_date: 1180-01-01
    highlight_event_id: guji-朱熹-event-daxue
  - key: closure
    name: 晚年删定四书付门人传承
    labels:
      zh: 道统续传
    start_date: 1194-01-01
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1175-06-10
    title_zh: 赴鹅湖与陆九渊辩为学次第
    rationale: 为己无所为而然须察善利之分明格物穷理不可堕于虚空功利
  - date: 1180-01-01
    title_zh: 以敬补小学之阙揭示学规
    rationale: 过时后学者用力于敬可兼补小学进乎大而不患无本以收小学成功
