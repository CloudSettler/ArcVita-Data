    title_zh: 请复白鹿洞书院颁揭示谕学者
    rationale: 学校之政不修风俗颓败，故立大小学次第使学者由入德之门而进
  - date: 1196-03-01
    title_zh: 党禁之下闭门注经不废讲学
    rationale: 权谋术数充塞仁义，道不可屈，故以著述存圣经贤传之指以俟后人
