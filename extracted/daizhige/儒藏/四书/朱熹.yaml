    title_zh: 会众说折其中而定章句
    rationale: 子思推本尧舜相传之意程门微言未析石氏所辑仅出门人记忆故须精一执中之旨以提纲维开蕴奥
  - date: 1189-04-04
    title_zh: 取石氏书删繁为辑略别为或问
    rationale: 使详略相因巨细毕举同异得失曲畅旁通以助初学行远升高而不敢妄议道统之传
- id: guji-朱熹-endeavor-2
