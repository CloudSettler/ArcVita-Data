endeavors:
- id: guji-李光地-endeavor-1
  title_zh: 著述榕村四书说发明古本
  summary: 以古本大学为宗，重立知止定静为小学大学关要，以诚意为一篇之要，重分中庸十二章，阐敬统知行之旨
  phases:
  - key: brewing
    name: 读朱五十年而疑大学
    labels:
      zh: 涵养启发
    start_date: 1660
    highlight_event_id: guji-李光地-event-jinshi
  - key: breakthrough
    name: 考郑注旧本得文从理得
    labels:
      zh: 据经诘传
    start_date: 1700
    highlight_event_id: guji-李光地-event-guben
  - key: closure
    name: 撰大学古本说中庸章段成编
    labels:
      zh: 待后折中
    start_date: 1710
    highlight_event_id: guji-李光地-event-guben
  decisions:
  - date: 1700
    title_zh: 存旧贯不从朱子改本
    rationale: 知本诚身为枢要，不应溷于众目致陆王攘袂自托据经诘传，故仍旧贯待方来朱子折中
  - date: 1710
    title_zh: 以诚意为一篇之要统摄诸传
    rationale: 前无致知之文后无正心之释，故揭诚意以合中庸诚身，节节皆有工夫而归于慎独
- id: guji-李光地-endeavor-2
  title_zh: 入仕辅政经世致用
  summary: 康熙九年进士入翰林，历官文渊阁大学士，以理学辅政，兼重民生吏治与教化
  phases:
  - key: brewing
    name: 少习程朱举进士入翰林
    labels:
      zh: 立志存心
    start_date: 1670
    highlight_event_id: guji-李光地-event-jinshi
  - key: climax
    name: 大学士辅政倡朱子之学
    labels:
      zh: 明德新民
    start_date: 1703
    highlight_event_id: guji-李光地-event-ruxiang
  - key: closure
    name: 晚年以著述化天下
    labels:
      zh: 没世不忘
    start_date: 1715
    highlight_event_id: guji-李光地-event-guben
  decisions:
  - date: 1680
    title_zh: 以朱学正人心而辟陆王
    rationale: 天下之本在身心，必诚意致知以知本，故立朝以敬统知行以防人心陷于虚妄
  - date: 1705
    title_zh: 出家而成教于国推絜矩之道
    rationale: 治国平天下不出家而得其理行其化，故以孝弟慈之推及财用用人以同民好恶
