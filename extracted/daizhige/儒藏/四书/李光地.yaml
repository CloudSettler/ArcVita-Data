  archetype: 经世儒臣
  dilemmas:
  - 守朱子成法以取信天下万世，抑或直书旧贯仍文从理得之疑
  - 以敬补小学大学之阙以立本，抑或径以格致辩志而恐适于他岐
  lesson: 读书五十年而后敢疑，不附和以自欺，待方来折中，此为老而逾坚之学
  summary_first_person: 吾读朱子之书五十年，于易卜筮诗雅郑皆灼然不惑，独于大学古本牵勉应和而未心通默契，乃考郑注旧本，存知本诚身枢要，以诚意为一篇之要，主敬以统知行，不敢附和自欺，以待后之朱子折中
  source_urls:
