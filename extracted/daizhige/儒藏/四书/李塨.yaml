  - title_zh: 为静坐穷理还是躬行六艺
    description: 究竟以读书谈道为大学还是以礼乐射御书数为大学正业而习行
  lesson: 学以明亲为道以格习六艺为业道业合一始能承圣道而致中和位育
  summary_first_person: 吾少承先父孝悫躬行之训弱冠师事颜习斋而习六艺始知格物为亲事其事遍考六经而知物即大学中礼乐等成法学文即格物致知诚意以至平天下即约礼遂于康熙戊寅著大学辨业以明圣门旧章救静坐观空之弊
