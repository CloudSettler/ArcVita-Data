endeavors:
- id: guji-杨名时-endeavor-1
  title_zh: 读四书作劄记阐明大学中庸义理
  summary: 宗李文贞古本解大学以格物为明善以诚意为本以慎独为止欺慊之几
  phases:
  - key: brewing
    name: 师承文贞研读大学古本
    labels:
      zh: 知止静安能虑能得
    start_date: 1680
    highlight_event_id: guji-杨名时-event-study
  - key: breakthrough
    name: 悟格物为明善非博物
    labels:
      zh: 明善择善尽性
    start_date: 1695
    highlight_event_id: guji-杨名时-event-gewu
  - key: climax
    name: 以诚意慎独为自修大本
    labels:
      zh: 诚意慎独毋自欺
    start_date: 1715
    highlight_event_id: guji-杨名时-event-chengyi
  - key: closure
    name: 成四书劄记四卷传世
    labels:
      zh: 大学中庸论孟会归
    start_date: 1730
    highlight_event_id: guji-杨名时-event-book
  decisions:
  - date: 1695
    title_zh: 定格物为明善之功
    rationale: 不取守仁格竹之说不主朱子补传之说以穷性之固有为要归于实践诚身
  - date: 1715
    title_zh: 以慎独为吃紧教法
    rationale: 独为己所独知之地谨于此则共见处自无不慎足以包精而不宽假
- id: guji-杨名时-endeavor-2
  title_zh: 历官礼部尚书总理国子监以理学教士
  summary: 以主敬存诚忠恕一贯之旨讲论语孟子成人伦之极致而化士习
  phases:
  - key: brewing
    name: 登第入仕涵养忠信
    labels:
      zh: 主忠信徙义崇德
    start_date: 1691
    highlight_event_id: guji-杨名时-event-jinshi
  - key: breakthrough
    name: 讲论语一贯忠恕之旨
    labels:
      zh: 忠体恕用一以贯之
    start_date: 1710
    highlight_event_id: guji-杨名时-event-yiguan
  - key: climax
    name: 总理国子监事以敬恕教学者
    labels:
      zh: 敬以直内义以方外
    start_date: 1725
    highlight_event_id: guji-杨名时-event-guozijian
  - key: closure
    name: 晚年定论孟中庸心得垂训后学
    labels:
      zh: 宗庙社稷即人伦极致
    start_date: 1732
    highlight_event_id: guji-杨名时-event-book
  decisions:
  - date: 1710
    title_zh: 以涵养为主宰以精察力行为恕
    rationale: 无忠则恕不出平时主一持养临事方能推心使体立而用行
  - date: 1725
    title_zh: 以敬恕立法国学
    rationale: 敬以居之恕以扩之久亦将无己可克以善法颜渊仲弓而化士
events:
- id: guji-杨名时-event-birth
  date: 1661
  year_of: 1661
  title_zh: 出生江阴
  description: 顺治十八年生于江苏江阴天资慤谨笃志圣贤之学
- id: guji-杨名时-event-jinshi
  date: 1691
  year_of: 1691
  title_zh: 登进士入仕
  description: 康熙年间登第历官讲席以理学忠贞持身务终其事
- id: guji-杨名时-event-study
  date: 1695
  year_of: 1695
  title_zh: 研读四书宗文贞古本
  description: 以李光地古本解大学知止静安能虑能得为确不可易奠定劄记基础
- id: guji-杨名时-event-gewu
  date: 1705
  year_of: 1705
  title_zh: 定格物明善之说
  description: 辨格物须明本性之善非博物观象极数之学非格庭前一竹可当明善
- id: guji-杨名时-event-yiguan
  date: 1710
  year_of: 1710
  title_zh: 阐一以贯之忠恕体用
  description: 解忠为体恕为用曾子于恕着力多于忠犹未满量以主一涵养贯精察力行
- id: guji-杨名时-event-chengyi
  date: 1715
  year_of: 1715
  title_zh: 发挥诚意慎独之义
  description: 以实其为善去恶之意为诚不欺其意为慎独审欺慊之几于己所独知
- id: guji-杨名时-event-guozijian
  date: 1725
  year_of: 1725
  title_zh: 任礼部尚书总理国子监事
  description: 以居敬涵养讲学徙义之旨造士主忠信修德讲学以辅仁成教于国
- id: guji-杨名时-event-book
  date: 1732
  year_of: 1732
  title_zh: 撰成四书劄记四卷
  description: 分大学论语中庸孟子四卷论鬼神宗庙社稷人伦极致及无声臭天命本然多切实心得
- id: guji-杨名时-event-death
  date: 1736
  year_of: 1736
  title_zh: 卒于京师
  description: 乾隆元年卒生平著有周易劄记四书劄记乾隆四十六年收入四库全书经部
