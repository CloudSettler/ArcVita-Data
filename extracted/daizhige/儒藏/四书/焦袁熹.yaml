endeavors:
- id: guji-焦袁熹-endeavor-1
  title_zh: 此木轩四书说撰述
  summary: 自康熙己巳志圣学，积年笔录，断自辛巳迄乙卯，手定六成，子掇拾残稿成九卷
  phases:
  - key: brewing
    name: 弱冠志学心师陆陇其
    labels:
      zh: 立志
    start_date: '1689'
    highlight_event_id: guji-焦袁熹-event-zhixue
  - key: breakthrough
    name: 丙子举贤书专力经解
    labels:
      zh: 转向
    start_date: '1696'
    highlight_event_id: guji-焦袁熹-event-juren
  - key: climax
    name: 辛巳至乙卯手定四书说
    labels:
      zh: 著述
    start_date: '1701'
    highlight_event_id: guji-焦袁熹-event-zhushu
  - key: closure
    name: 子辑残稿成编刘于义序行世
    labels:
      zh: 成书
    start_date: '1743'
    highlight_event_id: guji-焦袁熹-event-kanxing
  decisions:
  - date: '1689'
    title_zh: 心师陆陇其终身不名不字不走其门
    rationale: 志不近名，取其学而不徇门户之迹
  - date: '1701'
    title_zh: 不苟同时文讲章独求学问的义
    rationale: 坊肆讲章徒资举业，故直截简净以求程朱心印
  - date: '1715'
    title_zh: 小异并存以俟君子折衷
    rationale: 一意再三言者小异并存，全同则删，广异闻求的义
- id: guji-焦袁熹-endeavor-2
  title_zh: 侍养两太夫人终老畎亩
  summary: 以寡兄弟之身侍祖母母皆至九十，奉召不出，泊如畎亩，以诚化乡里
  phases:
  - key: brewing
    name: 侍亲不能出辞奉召
    labels:
      zh: 守养
    start_date: '1696'
    highlight_event_id: guji-焦袁熹-event-juren
  - key: breakthrough
    name: 侍祖母母两太夫人至九十
    labels:
      zh: 致孝
    start_date: '1701'
    highlight_event_id: guji-焦袁熹-event-zhushu
  - key: climax
    name: 亲终已老泊如畎亩
    labels:
      zh: 守道
    start_date: '1720'
    highlight_event_id: guji-焦袁熹-event-shoudao
  - key: closure
    name: 以诚接物乡里化服遗书传后
    labels:
      zh: 化成
    start_date: '1743'
    highlight_event_id: guji-焦袁熹-event-kanxing
  decisions:
  - date: '1696'
    title_zh: 奉召以侍亲辞出
    rationale: 祖母母高寿寡兄弟，宁縻我身以全孝养
  - date: '1720'
    title_zh: 终身不仕经世之学存而不试
    rationale: 亲终已老，守畎亩讲学著述不逐荣进
