endeavors:
- id: guji-程树德-endeavor-1
  title_zh: 会通汉宋编纂论语集释
  summary: 以述而不作之旨立十门分类采辑汉宋清诸家以求正当解释
  phases:
  - key: brewing
    name: 发凡立十门体例
    labels:
      zh: 考异音读考证集解古注集注别解余论发明按语
    start_date: '1917'
    highlight_event_id: guji-程树德-event-fanli
  - key: breakthrough
    name: 广采宋以后诸家及清儒考证
    labels:
      zh: 以集解为汉学所宗以集注为宋学所本
    start_date: '1920'
    highlight_event_id: guji-程树德-event-caiji
  - key: climax
    name: 裁断异同撰按语示取舍
    labels:
      zh: 不分门户惟求其是
    start_date: '1927'
    highlight_event_id: guji-程树德-event-chengshu
  - key: closure
    name: 百余万言成书待后学发明
    labels:
      zh: 列书目提要以便寻检
    start_date: '1930'
    highlight_event_id: guji-程树德-event-chengshu
  decisions:
  - date: '1917'
    title_zh: 定十门兼列集解集注
    rationale: 汉儒重训诂宋儒重大义各有所长不宜偏废故先列集解次列集注以会通之
  - date: '1927'
    title_zh: 意气诟争门户标榜概不采录
    rationale: 矫宋人轻詈古人及贬抑圣门之弊惟录纯正心得以示戒而存厚道
- id: guji-程树德-endeavor-2
  title_zh: 搜罗辑佚唐以前古注
  summary: 搜剔汉魏六朝唐人论语著述三十八家片言只字不使遗漏以存佚书
  phases:
  - key: brewing
    name: 以皇疏辑佚书为底本搜集
    labels:
      zh: 皇侃义疏玉函山房辑佚书
    start_date: '1918'
    highlight_event_id: guji-程树德-event-caiji
  - key: breakthrough
    name: 汇集刘歆包咸郑玄王肃等三十八家
    labels:
      zh: 上自汉末正及于唐
    start_date: '1922'
    highlight_event_id: guji-程树德-event-caiji
  - key: climax
    name: 校考异音读存类书所引佚文
    labels:
      zh: 片言只字一一搜剔
    start_date: '1926'
    highlight_event_id: guji-程树德-event-chengshu
  - key: closure
    name: 罕见本全部收入附简明提要
    labels:
      zh: 仿四库总目例以防失传
    start_date: '1930'
    highlight_event_id: guji-程树德-event-chengshu
  decisions:
  - date: '1922'
    title_zh: 增唐以前古注一门备列无遗
    rationale: 何晏集解后郑王各注皆废故须搜罗佚文使已佚之书赖以不堕
  - date: '1930'
    title_zh: 罕见本及近人专著从优全录
    rationale: 篇帙无多恐日久失传故仿四库例附提要以备稽考
