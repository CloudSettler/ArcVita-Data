  dilemmas:
  - 汉学重训诂宋学重大义如何不偏废而求其是
  - 述而不作广采众说与按语裁断取舍如何兼顾
  lesson: 不分汉宋门户以训诂为基以义理为归惟是之求以待后学
  summary_first_person: 我本述而不作之旨分类采辑宋以后诸家兼收汉魏六朝唐人佚说列十门以求一正当解释待后学者发明圣人立言之旨
