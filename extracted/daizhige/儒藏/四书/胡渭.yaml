    title_zh: 合康诰盘铭为释明明德一章
    rationale: 使传语各有归宿界限分明头不欠尾不剩
  - date: 1705
    title_zh: 移此谓知本二句于止于信之下
    rationale: 从顾亭林夏雨苍说正知止之讹使格致有安顿
  - date: 1705
    title_zh: 宗朱子不作补传力辟王学改本
    rationale: 信经文玉盘无阙传文亦无阙割裂推移适失真面
