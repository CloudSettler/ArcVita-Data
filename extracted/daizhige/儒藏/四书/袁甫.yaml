  - 心学简易与章句精详之衡如何既发明本心又不流于狂禅
  lesson: 守独以时中由率性以复命使内外精粗融为常中
  summary_first_person: 我是袁甫字广微鄞人宝文阁直学士袁燮之子嘉定七年进士历官至吏部侍郎兼国子祭酒权兵部尚书谥正肃我受学于杨简远承陆九渊金溪之旨平日录中庸讲义以授门人推阐常中使学者由慎独以致中和
