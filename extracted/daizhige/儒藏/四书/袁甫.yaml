    rationale: 为救滞于纸上言说依仿近似之弊直指慎独时中使学者勿忘勿助以识道统
  - date: 1230
    title_zh: 录平日讲授以授门弟子
    rationale: 以中庸为穷理尽性至命之书须委曲推阐重言申之方能使常中见于日用
