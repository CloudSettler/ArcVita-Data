  - 博约之辨，疏体当繁证还是当简明
  - 恪守朱子成说还是杂以众说异论
  lesson: 守朱子之正以疏经义，繁而不杀亦可传道
  summary_first_person: 吾字格庵，括苍人，父从朱门滕璘游，吾一本朱子之学，遍取朱子诸书及门人高第讲解以明章句集注，架屋下屋，陪于颖达公彦之后，名曰四书纂疏，以俟后之君子
