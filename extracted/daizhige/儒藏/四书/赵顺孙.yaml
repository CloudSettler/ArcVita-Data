    title_zh: 定一以朱子为归之例
    rationale: 章句集注精密简严，非由或问语录集义不可见其全，故旁引皆限朱门学者
  - date: 1255
    title_zh: 以疏体存繁证附己见
    rationale: 注尚简明疏存曲证，宁繁不杀以便观省，间附鄙见一二以明取舍
