endeavors:
- id: guji-金履祥-endeavor-1
  title_zh: 师承王柏何基疏解大学以传朱学
  summary: 随章第作疏义畅其文，又申指义以统其纲，融会章句或问，阐发明明德新民止至善之旨
  phases:
  - key: brewing
    name: 少师王柏初闻朱学
    labels:
      zh: 求学兰溪
    start_date: '1251'
    highlight_event_id: guji-金履祥-event-study
  - key: breakthrough
    name: 再从何基得道统之传
    labels:
      zh: 问学金华
    start_date: '1260'
    highlight_event_id: guji-金履祥-event-study
  - key: climax
    name: 随章作大学疏义
    labels:
      zh: 著述疏义
    start_date: '1285'
    highlight_event_id: guji-金履祥-event-writing
  - key: closure
    name: 指义统纲柳贯为序
    labels:
      zh: 成书流传
    start_date: '1295'
    highlight_event_id: guji-金履祥-event-writing
  decisions:
  - date: '1260'
    title_zh: 决从何基穷朱子之遗绪
    rationale: 王柏之后复从何基，欲得朱子相传本末，不随俗儒记诵辞章而直探明德之体
  - date: '1285'
    title_zh: 决依章句次序作疏义而申指义
    rationale: 朱子改易旧说学者多疑，故随章疏解以畅其文，又统以指义，使纲领条目融贯亲切
- id: guji-金履祥-endeavor-2
  title_zh: 宋亡隐居仁山讲学以存道统
  summary: 国变不仕，居仁山之下收徒讲授，注述经史，化乡闾而续婺学一脉
  phases:
  - key: brewing
    name: 宋末观时不求仕进
    labels:
      zh: 守身待变
    start_date: '1270'
    highlight_event_id: guji-金履祥-event-reclusion
  - key: breakthrough
    name: 宋亡杜门不出
    labels:
      zh: 遗民自守
    start_date: '1279'
    highlight_event_id: guji-金履祥-event-reclusion
  - key: climax
    name: 仁山讲学四方从游
    labels:
      zh: 讲学授徒
    start_date: '1285'
    highlight_event_id: guji-金履祥-event-teaching
  - key: closure
    name: 论著成编付后学
    labels:
      zh: 托文传道
    start_date: '1300'
    highlight_event_id: guji-金履祥-event-teaching
  decisions:
  - date: '1279'
    title_zh: 决不仕元隐居讲学
    rationale: 故国已亡，不以功名易节，愿以明德新民之学化乡人，使道在民间而不坠
  - date: '1285'
    title_zh: 决以经术教人先修身为本
    rationale: 自天子至庶人皆以修身为本，故授徒必先格物诚意，不尚智谋功利躐等之习
