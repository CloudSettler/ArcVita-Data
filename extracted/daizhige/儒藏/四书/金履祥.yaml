events:
- id: guji-金履祥-event-birth
  title_zh: 出生于婺州兰溪
  date: 1232
  year_of: 1232
  description_zh: 南宋绍定五年出生于婺州兰溪，金氏世家，少力学承朱子余绪
- id: guji-金履祥-event-study
  title_zh: 师事王柏何基承朱子之学
  date: 1249
  year_of: 1249
  description_zh: 少从王柏游，又师何基，得朱子再传之学，专治四书及经史
- id: guji-金履祥-event-kaozheng-start
  title_zh: 宋亡隐居仁山发愿考证集注
  date: 1279
  year_of: 1279
  description_zh: 宋亡不仕，隐居仁山，闵读集注者得其粗而不能悉其义，始櫽括演绎补正名物事迹
- id: guji-金履祥-event-kaozheng-done
  title_zh: 论语集注考证十卷孟子集注考证七卷成
  date: 1290
  year_of: 1290
  description_zh: 折衷朱子未定之说，辨订事迹典故，成十七卷，用经典释文例表其疑难者疏之
- id: guji-金履祥-event-preach
  title_zh: 授徒许谦雠校传布
  date: 1298
  year_of: 1298
  description_zh: 命门人许谦翻阅羣书雠校考证之书，藏诸家传诸其徒，许谦为之序
- id: guji-金履祥-event-death
  title_zh: 卒于家
  date: 1303
  year_of: 1303
  description_zh: 元大德七年卒，私谥仁山先生，学统由许谦等传于四方
