  title_zh: 讲学授徒续婺学道脉
  date: '1290'
  year_of: 1290
  place_zh: 婺州
  description: 四方学者从游，授以修身为本之学，门人多传其业，事迹载元史儒林传
- id: guji-金履祥-event-death
  title_zh: 卒于家
  date: '1303'
  year_of: 1303
  place_zh: 兰溪
  description: 元大德七年卒，后裔梓行疏义，金氏旧本赖以存，柳贯尝序之，清四库馆臣称为朱子功臣
