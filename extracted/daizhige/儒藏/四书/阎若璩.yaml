endeavors:
- id: guji-阎若璩-endeavor-1
  title_zh: 撰四书释地四续
  summary: 因解四书者昧于地理往往致乖经义以地理正经由地及人及物凡四百二十一条
  phases:
  - key: brewing
    name: 少习孟子疑盖邑分食之悟
    labels:
      zh: 萌发
    start_date: 1650
    highlight_event_id: guji-阎若璩-event-study
  - key: breakthrough
    name: 撰释地一卷释地续一卷
    labels:
      zh: 立说
    start_date: 1679
    highlight_event_id: guji-阎若璩-event-shidi
  - key: climax
    name: 又续三续由地及人及物及经义
    labels:
      zh: 贯通
    start_date: 1685
    highlight_event_id: guji-阎若璩-event-shidi-xu
  - key: closure
    name: 总以释地为名从其朔成一家之学
    labels:
      zh: 成书
    start_date: 1695
    highlight_event_id: guji-阎若璩-event-shidi-xu
  decisions:
  - date: 1679
    title_zh: 康熙己未以监生应博学鸿词而专治考据
    rationale: 不慕荣进欲以旁参互证正四书地理之误故辞荣而著书
  - date: 1685
    title_zh: 由释地牵连人名物类训诂典制
    rationale: 地明则人明人明则物明故由五十七条扩至四百二十一条以求贯通
- id: guji-阎若璩-endeavor-2
  title_zh: 辨尚书古文伪作明经学本原
  summary: 博极群书精于考证与顾炎武抗行以古文疏证正经文真伪与释地相发明
  phases:
  - key: brewing
    name: 博览群书疑古文之伪
    labels:
      zh: 存疑
    start_date: 1660
    highlight_event_id: guji-阎若璩-event-study
  - key: breakthrough
    name: 集证辨伪立疏证之纲
    labels:
      zh: 辨伪
    start_date: 1680
    highlight_event_id: guji-阎若璩-event-shidi-xu
  - key: climax
    name: 以地理沿革参证经文得失
    labels:
      zh: 互证
    start_date: 1690
    highlight_event_id: guji-阎若璩-event-shidi-xu
  - key: closure
    name: 疏证与释地并传为考据典范
    labels:
      zh: 定论
    start_date: 1700
    highlight_event_id: guji-阎若璩-event-death
  decisions:
  - date: 1680
    title_zh: 以实证不以空言定经文真伪
    rationale: 经义必有依据故考山川郡邑官制源流以断古文之非
  - date: 1695
    title_zh: 宁执一义以求是不断章取便
    rationale: 考证虽间有过执然十之七八可据故守求真之志不为俗学所移
