  lesson: 事必求依据旁参互证多所贯通以实证正经义
  summary_first_person: 余太原人而寓淮安为山阳少习孟子疑邑里之误乃悟地理不明则经义必乖遂撰释地及续又续三续凡四百二十一条又以古文疏证辨伪守真愿后人论世知意不为俗说所惑也
