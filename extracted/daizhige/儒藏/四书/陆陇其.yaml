  decisions:
  - date: '1672'
    title_zh: 羞乞璠贱垄防辟佛老黜阳儒阴释
    rationale: 明中叶来学术坏风俗乖必自大纲始董子程子之言不可易
  - date: '1680'
    title_zh: 增删大全困勉录皆以松阳讲义意为凖
    rationale: 异论纷呶是非蜂起拒之惟恐不力方显醇正精实
