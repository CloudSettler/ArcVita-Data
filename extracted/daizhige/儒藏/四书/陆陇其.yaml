  dilemmas:
  - 帖括盛行循章摘句保残守缺当守举业津梁还是明圣贤立言本意
  - 明季阳儒阴释似是而非当兼收并蓄还是廓清别择以羽翼集注
  lesson: 以困勉自处精思力践返躬克己方能明善复性载道淑世
  summary_first_person: 我是陆陇其字稼书长洲人自释褐休暇迄解组归田昼考夕思于四书以大全为经以困勉录为纬搜辑群书远宗近取辨其醇疵取万历以后纯粹无疵者以羽翼朱子集注律己服官一介不取直道而事终身以困勉自厉
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏四书讲义困勉录
  - https://kanripo.org/work/KR1h0057/WYG
  - https://ctext.org/library.pl?if=gb&res=80628
