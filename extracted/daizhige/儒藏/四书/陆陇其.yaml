  decisions:
  - date: '1671'
    title_zh: 只以朱子章句或问讲大学之道
    rationale: 明季讲家分合牵合乱序缺功必扫异说明朱意即圣意
  - date: '1673'
    title_zh: 因诸生一日之长竭愚告以身心体认
    rationale: 怕书自书我自我无益须猛省戒尸素之惭
- id: guji-陆陇其-endeavor-2
  title_zh: 潜心正学增删大全困勉录以闲邪卫道
  goal_zh: 拒异论扶大纲使经生家得醇正精实之准
  phases:
