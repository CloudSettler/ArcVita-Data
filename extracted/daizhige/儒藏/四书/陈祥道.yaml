    start_date: 1092
    highlight_event_id: guji-陈祥道-event-lunyu
  decisions:
  - date: 1089
    title_zh: 言理答问不务辨议
    rationale: 以论语为言理之书，罕言不语之间使学者思得，归于忠恕仁义
  - date: 1090
    title_zh: 存序明时不立异
    rationale: 论辨随世而施，孔子时但言理足矣，孟子时不得不辨，明圣人时义
