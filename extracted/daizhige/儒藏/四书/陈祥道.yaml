  era: 北宋
  reign_ref: 元祐
  archetype: 礼学经师
  dilemmas:
  - 宗信王氏新学而杂引庄子为证，解经体例不纯之讥与博证之益如何权衡
  - 明于臣礼制度而好创立别解，连类引申与恪守经意之间如何取舍
  lesson: 穷礼以明经，守本以求道，博证而不失忠恕仁义之归
  summary_first_person: 吾用之福州人也，元祐为太常博士秘书正字，长于三礼而著礼书，复作论语全解十卷，以礼明经，欲使学者思得忠恕仁义而已
