  decisions:
  - date: 1086
    title_zh: 以礼制证经义
    rationale: 不空谈心性，以乡饮酒待瞽诸礼明论语，使经义有所据依
  - date: 1088
    title_zh: 守王氏而兼采诸家
    rationale: 学本宗信王氏，然博引旁证以求义训之备，不以一眚废全书
- id: guji-陈祥道-endeavor-2
  title_zh: 论语全解十卷讲学
  summary: 答问言理以明忠恕仁义，作论语全解十卷，门人章粹校勘，重广真本行于世
  phases:
  - key: brewing
    name: 师友讲学穷究论语
