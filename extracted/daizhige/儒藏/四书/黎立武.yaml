    description: 明德新民止善众说纷纭欲以知止慎独诚意贯通始终恐支离而失其本
  lesson: 因文求义守诚止善以明体达用
  summary_first_person: 吾观学者皆以更定错简为据吾独因经文旧次疏其本旨以明明德新民止至善为纲以知止慎独诚意为枢欲使学者反己守约归于仁诚而已
