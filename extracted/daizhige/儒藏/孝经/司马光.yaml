  dilemmas:
  - 今文独行而古文沉废是否当奋起表章以存圣经之真
  - 章句异同纷然而大义无别是否当舍繁芜而撮枢要以广教化
  lesson: 圣经犹的众人射之乃多中明道在求大义而不在争章句
  summary_first_person: 我入馆阁见古文孝经出孔壁而沉废于世遂以隶写本为指解引伸旧注易去不合进于仁宗愿以至德要道顺天下后与范祖禹相续发明天经地义之原
