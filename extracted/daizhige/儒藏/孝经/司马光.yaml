    title_zh: 以古为据兼存今文注
    rationale: 古今大义本同字句分合小异移今注以注古可广思虑而显至德要道
  - date: 1054-01-01
    title_zh: 缮写进上不避狂僭
    rationale: 经犹的也众人射之多中庶几补先王之道于万一故冒进阙下
- id: guji-司马光-endeavor-2
  title_zh: 明孝治以谏政守正
  summary: 推孝经事亲事君立身之义以谏君守位保社稷终以史笔绳是非
  phases:
