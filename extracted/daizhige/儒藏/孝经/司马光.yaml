    title_zh: 守先王法度不阿新议
    rationale: 如卿大夫非法不言非道不行口无择言身无择行方可守宗庙保社稷
  - date: 1084-01-01
    title_zh: 以史明得失成资治通鉴
    rationale: 博爱敬让礼乐好恶皆孝治之具载之信史以示后王知禁
