    rationale: 传文袭左传而文势不贯当存格言去傅会以明本义
  - date: 1186-08-12
    title_zh: 断孔丛子为伪书
    rationale: 其词气卑近叙事失实与西京杂记同类故记于刊误之后以俟别论
