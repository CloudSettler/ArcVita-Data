    highlight_event_id: guji-李隆基-event-death
  decisions:
  - date: 0719-06-01
    title_zh: 诏群儒学官集议孔郑得失
    rationale: 刘子玄斥郑注十谬七惑，司马贞请孔郑俱行，必经集议而后去取，乃得允当
  - date: 0722-03-01
    title_zh: 亲于旧注采英芟繁为注并制序
    rationale: 旧疏辞多纰缪理昧精研，朕三复孝治之文景行先哲，欲以顺移忠立身扬名之道昭示四海
  - date: 0743-02-01
    title_zh: 颁御注于天下勒石台
    rationale: 以十八章为定本，八分御札勒于京兆石碑，使金石可消而孝常行不灭，垂范将来
