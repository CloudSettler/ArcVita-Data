    title_zh: 受睿宗禅即皇帝位
    rationale: 承中宗韦后之乱后人心思定，受禅以正名分，早建储贰以安天下
  - date: 0713-12-01
    title_zh: 诛太平公主用姚崇为相
    rationale: 外戚干政则权柄旁落，必先清内难，后任贤相以行十事要说，整顿吏治
  - date: 0740-01-01
    title_zh: 罢张九龄相任李林甫
    rationale: 以守成倦勤喜柔媚而恶直言，遂启专权壅蔽，为天宝乱阶
- id: guji-李隆基-endeavor-2
  title_zh: 御注孝经以孝治天下
  summary: 鉴孔郑旧注残谬，敕儒集议，亲采菁英芟繁就简，开元十年制序并注，天宝二年注成颁行，八分御札勒石京兆，以孝显君臣父子之道
