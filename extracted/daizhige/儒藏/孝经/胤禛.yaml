      - 仿章句集注
    start_date: 1726-01-01
    highlight_event_id: guji-胤禛-event-jizhu
  - key: climax
    name: 制序颁行天下
    labels:
      zh:
      - 制序
      - 颁行诵习
    start_date: 1727-01-01
    highlight_event_id: guji-胤禛-event-jizhu
  - key: closure
    name: 列入经部垂永久
    labels:
      zh:
      - 刊行海内
      - 列圣阐孝备至
    start_date: 1728-01-01
    highlight_event_id: guji-胤禛-event-jizhu
  decisions:
  - date: 1723-03-01
    title_zh: 命续成孝经衍义百卷
    rationale: 承世祖注经与圣祖缵成之绪，务使本末条贯无遗蕴，以备集注之本。
  - date: 1727-01-01
    title_zh: 亲制序颁御纂集注一卷
    rationale: 虑篇帙繁多难周遍，故专释经文词简义畅，俾贤愚共晓口讽心知身践。
- id: guji-胤禛-endeavor-2
  title_zh: 以孝治天下敷教化民
  summary: 推明王孝治不遗小国不侮鳏寡之义，先博爱敬让礼乐以化民，致灾害不生祸乱不作。
  phases:
  - key: brewing
    name: 登极敷陈孝理
    labels:
      zh:
      - 以孝治为先务
      - 宰世经物
    start_date: 1722-12-27
    highlight_event_id: guji-胤禛-event-enthroned
  - key: breakthrough
    name: 明五孝等差立教
    labels:
      zh:
      - 天子诸侯卿大夫士庶
      - 各守其分
    start_date: 1724-01-01
    highlight_event_id: guji-胤禛-event-jizhu
  - key: climax
    name: 教不肃成政不严治
    labels:
      zh:
      - 博爱德义敬让
      - 礼乐好恶示禁
    start_date: 1727-01-01
    highlight_event_id: guji-胤禛-event-jizhu
  - key: closure
    name: 比户可封厚望成风
    labels:
      zh:
      - 亲逊成和
      - 闾里向淳
    start_date: 1730-01-01
    highlight_event_id: guji-胤禛-event-jizhu
  decisions:
  - date: 1722-12-27
    title_zh: 以孝治宣示内外臣庶
    rationale: 列圣相承宏敷孝理，必自天子爱敬尽于事亲而德教加百姓刑四海。
  - date: 1727-01-01
    title_zh: 令父子师徒诵习力行
    rationale: 使为士者资孝作忠显亲，为庶者谨身节用竭力致养，以跻和平之俗。
events:
- id: guji-胤禛-event-birth
  date: 1678-12-13
  year_of: 1678
  title_zh: 生于北京紫禁城
  description: 康熙十七年十月三十日生，为圣祖仁皇帝第四子，母孝恭仁皇后。
- id: guji-胤禛-event-enthroned
  date: 1722-12-27
  year_of: 1722
  title_zh: 继位改元雍正承绪治国
  description: 圣祖宾天后继大统，缵述世祖章皇帝与圣祖遗绪，以孝治为先务，辑孝经衍义。
- id: guji-胤禛-event-jizhu
  date: 1727-01-01
  year_of: 1727
  title_zh: 御纂孝经集注一卷制序颁行
  description: 雍正五年亲制序颁行集注，专释经文仿朱子章句，刊行海内以便诵习，阐开宗明义至五刑诸章。
- id: guji-胤禛-event-death
  date: 1735-10-08
  year_of: 1735
  title_zh: 崩于圆明园九州清晏殿
  description: 雍正十三年八月二十三日崩，在位十三年，以孝治垂教后世列入四库经部孝经类。
