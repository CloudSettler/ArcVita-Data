endeavors:
- id: guji-胤禛-endeavor-1
  title_zh: 缵述圣绪御纂孝经集注
  summary: 缵承圣祖仁皇帝辑衍义之绪，命约经文专释，仿朱子四书章句为集注一卷，雍正五年制序颁行。
  phases:
  - key: brewing
    name: 缵绪命辑酝酿
    labels:
      zh:
