    start_date: 1260
    highlight_event_id: guji-董鼎-event-shangshu
  - key: breakthrough
    name: 以辑录体汇朱蔡异同
    labels:
      zh: 辑录纂注
    start_date: 1277
    highlight_event_id: guji-董鼎-event-shangshu
  - key: climax
    name: 尚书辑录纂注行于世
    labels:
      zh: 成书传世
    start_date: 1290
    highlight_event_id: guji-董鼎-event-shangshu
  decisions:
  - date: 1277
    title_zh: 不自立说而以辑录为体
    rationale: 朱蔡之后议论纷纭不如存众说以俟来者故以纂注示公
  - date: 1290
    title_zh: 守朱子晚年疑古文尚书之意
    rationale: 为尊朱学正统须存疑辨伪以明经文真义
- id: guji-董鼎-endeavor-2
  title_zh: 因朱子刊误作孝经大义
  summary: 就朱子古文刊误本逐章诠解以明孝为德本教源
  phases:
  - key: brewing
    name: 有志汇集诸家传注
    labels:
      zh: 孝经学
    start_date: 1285
    highlight_event_id: guji-董鼎-event-xiaojing
  - key: breakthrough
    name: 顺朱子改本衍说经传
    labels:
      zh: 诠解刊误本
    start_date: 1295
    highlight_event_id: guji-董鼎-event-xiaojing
  - key: climax
    name: 大义成书付子传行
    labels:
      zh: 授子真卿
    start_date: 1305
    highlight_event_id: guji-董鼎-event-faxing
  decisions:
  - date: 1295
    title_zh: 悉芟刊误圈记之字仍存辨正之语
    rationale: 既遵朱子定本复使读者知去取之由故一遵原文不私出入
  - date: 1305
    title_zh: 以口义体为初学设教
    rationale: 经义精深非浅闻可窥须以明白切实之词反覆敷陈方能化民成俗
