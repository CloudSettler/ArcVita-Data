endeavors:
- id: guji-董鼎-endeavor-1
  title_zh: 辑录尚书以续蔡传
  summary: 汇集朱子晚年意向与诸家解说而成尚书辑录纂注
  phases:
  - key: brewing
    name: 潜心书学博采诸说
    labels:
