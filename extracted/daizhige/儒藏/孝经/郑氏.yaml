endeavors:
- id: guji-郑氏-endeavor-1
  title_zh: 辅导永王妃习妇道礼教
  summary: 因侄女策为永王妃而未娴诗礼戒以為妇之道申以执巾之礼朝夕督导
  phases:
  - key: brewing
