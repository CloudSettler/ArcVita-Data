    highlight_event_id: guji-郑氏-event-compile
  decisions:
  - date: 482
    title_zh: 以妇道戒勉永王妃
    rationale: 少长闺闱未娴诗礼若不早戒恐失宗庙祭祀与夫君之义故先示大体
  - date: 483
    title_zh: 取法经史不载浮词
    rationale: 浮词无益于德唯经史正义可守故直述诗书易礼之训以立规
- id: guji-郑氏-endeavor-2
  title_zh: 编撰进献女孝经十八章
  summary: 以曹大家为主总开宗明义后妃夫人帮君庶人以至胎教母仪举恶等十八章上进于朝
  phases:
  - key: brewing
    name: 缅想余芳
    labels:
