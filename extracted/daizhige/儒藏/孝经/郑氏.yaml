  lesson: 以孝为宗以礼成家女子之孝上可刑于邦国下可安于室家
  summary_first_person: 妾郑氏也见侄女策为永王妃而未娴诗礼夙夜忧惧乃述经史正义以曹大家为主总十八章名曰女孝经上自皇后下及庶人皆以孝成名不敢自专谨进以补闺庭
