      - 览圣贤行事
      - 抚躬三复
    start_date: 484
    highlight_event_id: guji-郑氏-event-compile
  - key: breakthrough
    name: 编成十八章
    labels:
      zh:
      - 女孝之孝
      - 刑于四海
    start_date: 485
    highlight_event_id: guji-郑氏-event-compile
  - key: climax
    name: 进表陈献
    labels:
      zh:
      - 不敢自专
      - 轻触屏扆
    start_date: 486
    highlight_event_id: guji-郑氏-event-present
  - key: closure
    name: 补于闺庭
    labels:
      zh:
      - 上及皇后
      - 下及庶人
    start_date: 486
    highlight_event_id: guji-郑氏-event-present
  decisions:
  - date: 485
    title_zh: 托曹大家以为主
    rationale: 才微不敢自专且班昭德行足为女宗托之则言重而易行亦可免僭越之罪
  - date: 486
    title_zh: 具表进献不敢藏私
    rationale: 女子之孝关人伦之始得失非细务故虽伏待罪戾亦愿上达以补闺庭
