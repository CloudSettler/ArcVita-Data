  - 科举视孝经为考试题目而忘圣贤教人之本
  - 世俗取浮屠道士巫觋之语劝善而不知求圣人之书
  lesson: 尊信圣经人人诵读躬行孝道不徒为文辞功令
  summary_first_person: 吾陈澧番禺人也，慨世人视孝经为试帖而取异端以劝善，乃刻唐石台本与开成石经本，又抄十七史论说孝经之事为纪事一帙，欲使读者知其不可不读而躬行其教
