    title_zh: 受命赴江西大藩任佥事
    rationale: 圣天子首建孝治内外设宪纠奸慝非学有经术廉慎明察者不足与选故毅然出仕
  - date: 1370-01-01
    title_zh: 取集书内孝经注广其传
    rationale: 以孝为百行之原可移风易俗安上治民故乐助锓梓使家有是书以振风纪
