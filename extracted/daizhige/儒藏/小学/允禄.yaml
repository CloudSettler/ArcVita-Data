    start_date: 1767-03-15
    highlight_event_id: guji-允禄-event-death
  decisions:
  - date: 1746-01-01
    title_zh: 以十二字头衡律吕以西番字法补华音
    rationale: 华音字有数而梵音无穷须借合声二合三合法及大小细书之例使有音皆有字可考
  - date: 1749-12-28
    title_zh: 请钦定嘉名御制序文开列职名
    rationale: 书成五卷复加校对每韵分阴阳收声须请圣定嘉名弁序刊刻以垂永久
