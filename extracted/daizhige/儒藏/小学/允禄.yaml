  dilemmas:
  - 梵呗本音与华言字音乖隔难合诵持渐失其真
  - 诸家译字互异比附假借须折衷归一以定权衡
  lesson: 以合声统筹华梵以圣裁屡定条例方能同文
  summary_first_person: 我是庄亲王允禄，奉命率儒臣咨章嘉国师考西番本音溯天竺字母，屡次进呈恭候圣裁，终成同文韵统一书，以汉字合声备梵音，使持诵得真韵而华梵相通。
