    start_date: 1746-01-01
    highlight_event_id: guji-允禄-event-lulv-1746
  - key: climax
    name: 兼领同文韵统与礼器考订
    labels:
      zh: 高潮兼综
    start_date: 1749-12-28
    highlight_event_id: guji-允禄-event-dingming-1749
  - key: closure
    name: 身后以勤慎亲贤垂名馆阁
    labels:
