  decisions:
  - date: 1748-09-14
    title_zh: 择三经合音兼取十二字头定字母
    rationale: 文殊问金刚顶师利问三经汉字各异须择合西番本音者取用不合者于十二字头取用以存真韵
  - date: 1749-04-27
    title_zh: 拟定六条分谱并考同异合璧
    rationale: 首列天竺字母次列翻切配合次列西番字母次辨阴阳次考大藏同异终作华梵合璧以贯本源
- id: guji-允禄-endeavor-2
  title_zh: 宗室监修律历礼器与经籍
  description: 久任宗人府理藩院监纂律吕正义后编历象考成及礼器图式兼理译经润文之事
  phases:
