endeavors:
- id: guji-刘鉴-endeavor-1
  title_zh: 以指掌图为本编撰切韵指南
  summary: 以司马光指掌图等韵为粉本，参用四声等子，增以格子门法，次成十六通摄检韵之法，使出切行韵取字分明
  phases:
  - key: brewing
    name: 研读指掌图与等子
    labels:
      zh:
      - 指掌图
      - 四声等子
    start_date: 1330
    highlight_event_id: guji-刘鉴-event-study
  - key: breakthrough
    name: 参用格子门法补隙
    labels:
      zh:
      - 格子门法
      - 出切行韵
    start_date: 1334
    highlight_event_id: guji-刘鉴-event-study
  - key: climax
    name: 次成十六摄玄关六段
    labels:
      zh:
      - 十六摄
      - 玄关六段
    start_date: 1336-11
    highlight_event_id: guji-刘鉴-event-preface
  - key: closure
    name: 自序命名互为体用
    labels:
      zh:
      - 自序
      - 五音集韵
    start_date: 1336-11
    highlight_event_id: guji-刘鉴-event-preface
  decisions:
  - date: 1334
    title_zh: 定以指掌图为粉本兼采等子
    rationale: 欲总括诸韵订字权衡，得法得传而后通，故舍浮浅小法而宗旧图正传
  - date: 1336-11
    title_zh: 命名经史正音切韵指南付众共用
    rationale: 愿与韩氏五音集韵互为体用，诸韵字音皆由此出，庶为斯文一助
- id: guji-刘鉴-endeavor-2
  title_zh: 辨清浊正门法以订经史音读
  summary: 揭时忍时掌其蹇其两之误，辨清浊重轻与符羁都江士鱼详里之门法，斥方言俗读，倡归正随谬成风之弊
  phases:
  - key: brewing
    name: 搜集诵读误读之例
    labels:
      zh:
      - 清浊
      - 俗读
    start_date: 1332
    highlight_event_id: guji-刘鉴-event-study
  - key: breakthrough
    name: 考定清浊重轻之分
    labels:
      zh:
      - 清浊
      - 四声
    start_date: 1334
    highlight_event_id: guji-刘鉴-event-study
  - key: climax
    name: 详分门类正门法
    labels:
      zh:
      - 门法
      - 反切
    start_date: 1336-11
    highlight_event_id: guji-刘鉴-event-preface
  - key: closure
    name: 兼附字音动静示人
    labels:
      zh:
      - 字音动静
      - 知音
    start_date: 1336-11
    highlight_event_id: guji-刘鉴-event-preface
  decisions:
  - date: 1336-11
    title_zh: 举误例以明清浊门法
    rationale: 时忍切肾与时掌切上之类若不审清浊门法则习为蔑裂，故须举例晓示学者
  - date: 1336-11
    title_zh: 略开合摄转以便初学
    rationale: 开合二十四摄内外八转立法之初多挂碍纠纷，姑置之以存简明实用之法
events:
- id: guji-刘鉴-event-birth
  date: 约1300
  year_of: 1300
  title_zh: 出生于关中
  description: 刘鉴字士明，自署关中人，地广不知隶籍何郡县，生年不详
- id: guji-刘鉴-event-study
  date: 1334
  year_of: 1334
  title_zh: 研习等韵参用门法
  description: 研读指掌图与四声等子，参用格子门法，详审五音清浊等第交互，以备检韵
- id: guji-刘鉴-event-preface
  date: 1336-11
  year_of: 1336
  title_zh: 至元丙子良月自序成书
  description: 至元二年岁在丙子良月，关中刘鉴士明自序，成经史正音切韵指南一卷，次十六摄，述玄关六段
- id: guji-刘鉴-event-death
  date: 约1368
  year_of: 1368
  title_zh: 卒于元末
  description: 卒年不详，约卒于元末，其书经四库馆臣著录，至今言等韵者多称切韵指南
