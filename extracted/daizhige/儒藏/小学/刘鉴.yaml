  name_zh: 刘鉴
  names:
    zh: 刘鉴
    en: Liu Jian
  lifespan:
    birth:
      date: 约1300
      precision: year
      is_circa: true
      raw: 生年不详，元代关中人，约生于十四世纪初
    death:
      date: 约1368
      precision: year
      is_circa: true
      raw: 卒年不详，约卒于元末
  birth_date: 约1300
  death_date: 约1368
  era: 元代
  reign_ref: 元惠宗至元
  archetype: 韵学家
  dilemmas:
  - 清浊重轻与门法精微难明，俗读方言成风而归正匪易
  - 开合摄转通广局狭繁难挂碍，欲详备则纠纷，欲便学则不得不略
  lesson: 穷经博史以声求字，必归韵母横竖，审清浊门法，方能正音读而助斯文
  summary_first_person: 吾关中刘鉴，字士明，暇日因旧制次成十六摄检韵之法，析繁补隙，私述玄关六段，名曰经史正音切韵指南，愿与朋友共正字音，以为斯文一助
  source_urls:
