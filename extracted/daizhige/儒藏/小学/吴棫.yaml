  decisions:
  - date: '1135'
    title_zh: 兼采五十种书证古韵
    rationale: 经传歌谚及诸子史汉多协韵，旁搜以明古读，虽下及欧苏道藏亦取其韵古
  - date: '1145'
    title_zh: 以一条证一义以待君子
    rationale: 有疑有未尽不强作解，俟后之君子正而成之，以存斯道
