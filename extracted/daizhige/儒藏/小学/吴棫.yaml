  dilemmas:
  - 古今音变经生不晓，欲明古读则须泛搜旁证而易失体例
  - 直道事君忤权相则身谪，附势苟容则心愧，守正与全躯难两全
  lesson: 考音当由经传本文推求，博采而有择，立身当守正不阿
  summary_first_person: 吾吴棫字才老，宋人，宣和六年登进士，不就馆职，绍兴中为太常丞，因草表忤秦桧谪通州通判以终，采辑经传子史协韵成韵补五卷，以明古音
