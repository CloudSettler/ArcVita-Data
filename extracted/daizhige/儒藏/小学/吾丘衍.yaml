  name_zh: 吾丘衍
  names:
    zh: 吾丘衍
    en: Wuqiu Yan
  lifespan:
    birth:
      date: 1272-01-01
      precision: year
      is_circa: true
      raw: 宋咸淳八年
    death:
      date: 1311-01-01
      precision: year
      is_circa: true
      raw: 元至大四年
  birth_date: 1272-01-01
  death_date: 1311-01-01
  era: 元
  reign_ref: 元武宗至大
  archetype: 学者
  dilemmas:
  - 石鼓阙泐难读，强为辞则失真，阙而不补又难成章句
  - 众说音训乖诞，欲削繁就真，又恐失前人异闻可备参校
  lesson: 阙疑存真，参真刻以求章句，不以己意填补古文
  summary_first_person: 我是钱塘吾丘衍，字子行，旧藏甲秀堂谱，取石鼓真刻置几上参校，削去乖诞音训，删定杨文昺周秦刻石释音，止存石鼓诅楚泰山峄山之文，又正绊缝遝遂二字，以存三代金石之真
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%8F%E5%AD%A6/%E5%91%A8%E7%A7%A6%E5%88%BB%E7%9F%B3%E9%87%8A%E9%9F%B3.html
endeavors:
- id: guji-吾丘衍-endeavor-1
  title_zh: 删定周秦刻石释音
  summary: 因杨文昺书误收琅琊碑，重加删定，合石鼓诅楚泰山峄山为一卷
  phases:
  - key: brewing
    name: 藏谱览旧
    labels:
      zh: 收书
    start_date: 1300-01-01
    highlight_event_id: guji-吾丘衍-event-shigu
  - key: breakthrough
    name: 得真校虚
    labels:
      zh: 校刻
    start_date: 1305-01-01
    highlight_event_id: guji-吾丘衍-event-shigu
  - key: climax
    name: 削郑存真
    labels:
      zh: 删定
    start_date: 1308-01-01
    highlight_event_id: guji-吾丘衍-event-zhouqin
  - key: closure
    name: 自序成卷
    labels:
      zh: 成书
    start_date: 1308-12-01
    highlight_event_id: guji-吾丘衍-event-zhouqin
  decisions:
  - date: 1308-01-01
    title_zh: 削去郑樵音训不用
    rationale: 以其最为乖诞，曲取意义，与真刻相远，故削去以存真
  - date: 1308-06-01
    title_zh: 删琅琊止存泰山峄山
    rationale: 琅琊不类秦文，不应收入，故删定止存泰山峄山刻字并二世诏文
- id: guji-吾丘衍-endeavor-2
  title_zh: 考释石鼓诅楚古文
  summary: 以薛氏款识古文苑参订石鼓章句，正诅楚绊缝遝遂二字，列诸家音注书评于后
  phases:
  - key: brewing
    name: 置刻隐度
    labels:
      zh: 考鼓
    start_date: 1302-01-01
    highlight_event_id: guji-吾丘衍-event-shigu
  - key: breakthrough
    name: 依例补阙
    labels:
      zh: 补阙
    start_date: 1305-01-01
    highlight_event_id: guji-吾丘衍-event-shigu
  - key: climax
    name: 正读诅楚
    labels:
      zh: 正字
    start_date: 1308-06-01
    highlight_event_id: guji-吾丘衍-event-zhouqin
  - key: closure
    name: 汇注传学
    labels:
      zh: 传学
    start_date: 1310-01-01
    highlight_event_id: guji-吾丘衍-event-xuegu
  decisions:
  - date: 1305-01-01
    title_zh: 阙文不以己意填补
    rationale: 依穆天子传例补以围方，重文注于右，不可识者阙音，以存阙疑之义
  - date: 1308-06-01
    title_zh: 正诅楚绊遝二字
    rationale: 参三文石本考文义字体，正绊为缝，正遝为遂，共成一卷以广闻
events:
- id: guji-吾丘衍-event-birth
  title_zh: 生于钱塘
  date: 1272-01-01
  year_of: 1272
  description: 宋咸淳八年生于钱塘，字子行，号鲁郡
- id: guji-吾丘衍-event-shigu
  title_zh: 取真刻考石鼓
  date: 1305-01-01
  year_of: 1305
  description: 取石鼓真刻置几上，以钱为文求章句，参薛氏款识及古文苑，隐度成章
- id: guji-吾丘衍-event-zhouqin
  title_zh: 自序周秦刻石释音
  date: 1308-12-01
  year_of: 1308
  description: 至大戊申十二月自序，削郑樵音训，删琅琊，正诅楚二字，仍以周秦刻石为题号成一卷
- id: guji-吾丘衍-event-xuegu
  title_zh: 研六书汇诸家评注
  date: 1310-01-01
  year_of: 1310
  description: 列石鼓音注书评于后，自苏朂李嗣真至欧阳修赵明诚苏轼诸家，以存金石绝学
- id: guji-吾丘衍-event-death
  title_zh: 卒于元
  date: 1311-01-01
  year_of: 1311
  description: 元至大四年卒，平生精小学篆刻之学，所订石鼓次第为朱彝尊石鼓考所据
