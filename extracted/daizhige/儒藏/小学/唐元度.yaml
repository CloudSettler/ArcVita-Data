  description: 生年里籍未详约生于玄宗开元末至德宗贞元间
- id: guji-唐元度-event-death
  title_zh: 逝世
  date: 0850
  year_of: 850
  description: 开成后事迹不显卒年不详约卒于武宗宣宗之际
- id: guji-唐元度-event-fuding
  title_zh: 太和七年奉敕覆定石经字体
  date: 0833-02
  year_of: 833
  description: 太和七年二月敕唐元度覆定石经字体以翰林待诏朝议郎权知沔王友详覆九经字体
- id: guji-唐元度-event-lishi
  title_zh: 太和七年十二月立石九经于国子监
  date: 0833-12
  year_of: 833
  description: 奉敕于国子监讲论堂两廊创立石九经以所定字体刊石经籍观人文以成俗
- id: guji-唐元度-event-zhuanlu
  title_zh: 参详比就纂录新加字样
  date: 0836-01
  year_of: 836
  description: 依字书参详比就正讫于五经文字本部采疑误旧未载者分七十六部纂四百二十一字声韵谨依开元文字以四声定音
- id: guji-唐元度-event-jinshang
  title_zh: 开成二年进上九经字样
  date: 0837-08-12
  year_of: 837
  description: 开成二年八月十二日牒请以新加九经字样一卷附于五经字样之末奉敕宜依刊削有成谨随状进上
