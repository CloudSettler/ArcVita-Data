  decisions:
  - date: 0746-01-01
    title_zh: 决定兼习诸书具为训解并据今时州县
    rationale: 若无刊正何以讨论，州县名号亦据今时，字体从木从才等悉具言庶无纰缪
  - date: 0749-01-01
    title_zh: 决定遍考九经三史诸子补遗漏要字
    rationale: 搜神记精怪图山海经博物志等遗漏要字训义多有不载，必子细研穷究其巢穴而具言之
