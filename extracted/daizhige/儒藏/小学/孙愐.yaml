person:
  qid: guji-孙愐
  name_zh: 孙愐
  names:
    zh: 孙愐
    en: Sun Mian
  lifespan:
    birth:
      date: 0700-01-01
      precision: year
      is_circa: true
      raw: 生年不详，约武周久视前后，活跃于开元天宝间
    death:
      date: 0760-01-01
      precision: year
      is_circa: true
      raw: 卒年不详，约肃宗前后
  birth_date: 0700-01-01
  death_date: 0760-01-01
  era: 唐
  reign_ref: 唐玄宗开元天宝
  archetype: 韵书编纂者
  dilemmas:
  - 切韵盛行而注有差错文复漏误，清浊难辨何以刊正讨论
  - 姓氏原由土地物产山河草木散见群书，何以兼收而不慁糅
  lesson: 考穷史籍广览群书，以五年之功补遗阙正音韵，使清浊昭然而览者去疑
  summary_first_person: 吾闻文字聿兴音韵乃作，惟陆生切韵盛行而随珠尚纇注有差错，吾罄謏闻敢补遗阙，兼习诸书具为训解，案三苍尔雅字统字林说文玉篇及九经诸子史汉以列注，又纽唇齿喉舌牙部而次之，起终五年精成一部，总加四万二千三百八十三言，名曰唐韵，冀览者去疑而宿滞者豁如
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%8F%E5%AD%A6/%E5%8E%9F%E6%9C%AC%E5%B9%BF%E9%9F%B5.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%8F%E5%AD%A6/%E5%8E%9F%E6%9C%AC%E5%B9%BF%E9%9F%B5.md
