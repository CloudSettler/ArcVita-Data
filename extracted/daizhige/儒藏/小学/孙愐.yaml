  decisions:
  - date: 0748-01-01
    title_zh: 决定纽唇齿喉舌牙部仵而次之
    rationale: 欲令清浊昭然学之有终，有可纽不可行及古体依约并采为证庶无壅
  - date: 0750-01-01
    title_zh: 决定以四声寻绎执优尸之不失元本
    rationale: 一字数训则执优而尸之劣而副之，轻重斯分不令慁糅，冀览者去疑宿滞者豁如
events:
- id: guji-孙愐-event-birth
  type: birth
  date: 0700-01-01
  year_of: 700
  title_zh: 诞生
  description_zh: 孙愐生年不详，约生于武周前后，博通内外遁禄岩岭，考穷史籍广览群书
- id: guji-孙愐-event-compile-start
  type: career
  date: 0746-01-01
  year_of: 746
  title_zh: 发愿补辑切韵开始编纂
  description_zh: 观陆生切韵注有差错文复漏误，罄謏闻敢补遗阙，兼习三苍尔雅字统字林说文玉篇及九经诸子并列注中，州县名号据开元三十年今时，起终五年之始
- id: guji-孙愐-event-complete
  type: career
  date: 0751-01-01
  year_of: 751
  title_zh: 唐韵成书天宝十载作序
  description_zh: 岁次辛卯天宝十载，起终五年精成一部，前后总加四万二千三百八十三言，仍篆石经勒存正体，名曰唐韵，取周易周礼之义
- id: guji-孙愐-event-death
  type: death
  date: 0760-01-01
  year_of: 760
  title_zh: 逝世
  description_zh: 卒年不详，约卒于肃宗前后，其唐韵后经严宝文裴务齐陈道固及宋陈彭年等重修为广韵而盛行于世
