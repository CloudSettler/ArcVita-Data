  lesson: 正俗各有体干禄有常经守正不废通方为传远之法
  summary_first_person: 吾颜元孙京兆长安人也少承家学博涉经籍见时俗字与经典正文乖违遂厘定俗通正三体以平上去入四声为次撰成干禄字书以供士子干禄应举入声一卷凡二百七十一字如䅽哭僕曝肉肃倏叔鞠鞫孰熟之属皆辨其俗正欲使后学有所据依也
