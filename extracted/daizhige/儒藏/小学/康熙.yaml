events:
- id: guji-康熙字典-event-birth
  title_zh: 降生于景仁宫
  date: 1654-05-04
  year_of: 1654
  description: 爱新觉罗玄烨降生，为顺治帝第三子，母为孝康章皇后
  place: 北京紫禁城
- id: guji-康熙字典-event-zhuanxiu
  title_zh: 下诏纂修字书
  date: 1710-03-01
  year_of: 1710
  description: 命张玉书陈廷敬等三十人博采字汇正字通诸书，参以经史，开始修康熙字典
  place: 北京武英殿
- id: guji-康熙字典-event-chengshu
  title_zh: 康熙字典告成颁行
  date: 1716-04-01
  year_of: 1716
  description: 全书四十二卷收字四万七千余，以二百十四部统之，御制序文颁行天下
  place: 北京
- id: guji-康熙字典-event-death
  title_zh: 驾崩于畅春园
  date: 1722-12-20
  year_of: 1722
  description: 在位六十一年后病逝，遗诏传位于四子胤禛，是为雍正帝
  place: 北京畅春园
