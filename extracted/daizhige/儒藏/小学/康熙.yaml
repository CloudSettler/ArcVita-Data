  - 字书纷杂正音难定何以一统天下之文
  - 以满洲君主而主中华道统何以服士人之心
  lesson: 以一统之志成大典，文字即治道，欲致太平先正字书
  summary_first_person: 朕玄烨以冲龄践祚，鉴明代字书繁杂，敕张玉书陈廷敬等博采群书而成康熙字典，以二万余字系于二百十四部，欲使天下读书人有字可守，有音可依
