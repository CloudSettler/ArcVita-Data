  dilemmas:
  - 官韵漏略当补与丧制拘忌音义弗顺不可入韵之间的权衡
  - 上官求增补以行于世与藏家塾以待后识之间的进退
  lesson: 以九经为根源考订假借防通，不以时用废古义，阙疑而待后识
  summary_first_person: 我是代郡杨伯嵒，字彦思，一作彦瞻，号泳斋，南宋时以工部郎守衢州，我性嗜古，涉猎诸经训释，见礼部韵略漏载经字假借防音，遂搜罗九经为补韵一编，嘉定十七年冬序于家塾，非敢上官求增补，姑以寤疑辩惑，待博识君子
  source_urls:
