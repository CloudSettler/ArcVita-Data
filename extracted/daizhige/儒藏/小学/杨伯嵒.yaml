  - date: 1220
    title_zh: 定以九经为限不泛采子史
    rationale: 以经为根源，防黄吴毛张诸家尽采子史方言难行之失，专摭九经之字以补官韵
  - date: 1224-11-15
    title_zh: 分正补与附载不强入韵
    rationale: 正补周易尚书毛诗周礼礼记左传公羊孟子七十九字，附载音义弗顺丧制所出八十八字，存阙疑之义
  - date: 1224-11-15
    title_zh: 非敢上官仅藏家塾
    rationale: 明言非敢上于官以求增补，亦非敢淑诸人以侈见闻，姑藏家塾以击防昧，待博识君子
