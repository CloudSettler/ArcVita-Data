  lesson: 存古须辨源流，直道当付滇南著述以传后
  summary_first_person: 吾杨慎，字用修，号升庵，少举状元，官翰林修撰，嘉靖初以议礼忤旨，谪戍云南三十余年，谪中博览秦汉载籍，作古音丛目及奇字韵五卷，以四声类奇字，欲存古文于小学，虽疵阙难免，亦冀去疵存醇以助六书
