  decisions:
  - date: 1525
    title_zh: 别标稍异之字体以四声为类
    rationale: 以说文小篆为正，收卫宏扬雄古文奇字，俾六书有据可求
  - date: 1540
    title_zh: 就记忆所及录秦汉载籍奇字
    rationale: 充腹笥录十之三四，虽不详考出处，亦欲存古以助六书
