  dilemmas:
  - 以今韵部分求古音还是以古音求古音
  - 排斥顾炎武五书而另立条例是否牵率逞博
  lesson: 不执今律古，博考通转以存一家之说，方能资考证而不困于条例
  summary_first_person: 我是毛奇龄，萧山人，应博学鸿词授翰林检讨，为排斥顾炎武音学五书而作古今通韵十二卷，创五部三声两界两合之说，虽见黜于四库，然援据浩博，亦欲备一家之言
