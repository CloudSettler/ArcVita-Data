  lesson: 读古经当以古韵本音参证通变舍短取长阙疑而行不可以后起之韵强协圣经
  summary_first_person: 吾治经兼究韵学见世儒拾周易有韵一语字字强协致文部韵部一概乱尽故置其无韵之文而论其有韵之文立五部三声两界两合蓦韵叶韵之例撰易韵四卷以祛世惑与顾氏易本音互证而行
