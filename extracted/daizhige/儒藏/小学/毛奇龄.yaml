  - date: 1705
    title_zh: 置无韵论文有韵
    rationale: 彖象原辞偶然及韵夫子象传杂卦传则尽韵若字字强协必矫直揉曲故只论有韵之文使条理秩然
  - date: 1705
    title_zh: 立五部三声两界两合之例
    rationale: 就宋韵三十部收为宫商角征羽五部以平上去三声通用别有入无入两界及去入两合以通周易毛诗楚词后世诗文之变
