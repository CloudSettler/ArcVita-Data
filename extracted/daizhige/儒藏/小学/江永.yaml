endeavors:
- id: guji-江永-endeavor-1
  title_zh: 考定诗韵著古韵标准
  description: 以诗三百篇为主谓之诗韵，以周秦以下近古之音附之为补韵，平上去各十三部入声八部，辨正吴棫杨慎陈第顾炎武诸家得失
  phases:
  - key: brewing
    name: 博览诸家权度在胸
    labels:
      zh: 博览
    start_date: 1713-01-01
    highlight_event_id: guji-江永-event-study
  - key: breakthrough
    name: 定以诗为主补韵为附之例
    labels:
      zh: 立准
    start_date: 1745-01-01
    highlight_event_id: guji-江永-event-guyun-draft
  - key: climax
    name: 分部列目著成四卷
    labels:
      zh: 成书
    start_date: 1757-01-01
    highlight_event_id: guji-江永-event-guyun-draft
  - key: closure
    name: 作诗韵举例以明体例
    labels:
      zh: 举例
    start_date: 1760-01-01
    highlight_event_id: guji-江永-event-shiyun
  decisions:
  - date: 1745-01-01
    title_zh: 惟以三百篇为主他书为证
    rationale: 惩吴杨泛引后世变音为古严界畔以遏强通，方语假借则求其故而不混部
  - date: 1757-01-01
    title_zh: 平上去各十三部入声八部
    rationale: 补正顾炎武十部之合离，于真文元寒萧尤侵凡诸部分合处详加析分，使疆界甚严
- id: guji-江永-endeavor-2
  title_zh: 明今韵审音以通经学三礼
  description: 作四声切韵表音学辨微以条理隋唐二百六部之韵，又注三礼疑义举要训义择言，守沈韵条理而不以今混古
  phases:
  - key: brewing
    name: 研穷字母等韵三礼经训
    labels:
      zh: 穷经
    start_date: 1720-01-01
    highlight_event_id: guji-江永-event-study
  - key: breakthrough
    name: 作四声切韵表细区今韵
    labels:
      zh: 审音
    start_date: 1742-01-01
    highlight_event_id: guji-江永-event-qieyun
  - key: climax
    name: 著周礼疑义举要礼记训义
    labels:
      zh: 释礼
    start_date: 1750-01-01
    highlight_event_id: guji-江永-event-zhouli
  - key: closure
    name: 与戴震商定归纳韵学体系
    labels:
      zh: 会通
    start_date: 1760-01-01
    highlight_event_id: guji-江永-event-shiyun
  decisions:
  - date: 1742-01-01
    title_zh: 悉用唐韵不从平水并韵
    rationale: 并韵混部则真文元寒删先通转莫辨，必沿二百六部条分缕析方能溯古音源流
  - date: 1750-01-01
    title_zh: 四声各守本声不强纽一声
    rationale: 从陈第启示去拘读之病，随声讽诵方谐适而字守本音，省无数纠纷
events:
- id: guji-江永-event-birth
  date: 1681-01-01
  year_of: 1681
  type: birth
  title_zh: 生于婺源
  description: 康熙二十年生于安徽婺源，字慎修，少颖悟潜心经学
- id: guji-江永-event-study
  date: 1713-01-01
  year_of: 1713
  type: study
  title_zh: 博览音学经传
  description: 遍读吴棫韵补杨慎转注古音陈第毛诗古音考顾炎武音学五书及毛奇龄柴绍炳诸家，权衡得失
- id: guji-江永-event-qieyun
  date: 1742-01-01
  year_of: 1742
  type: achievement
  title_zh: 作四声切韵表
  description: 细区今韵归之字母音等，与同志戴震商讨，为考古韵立审音之基
- id: guji-江永-event-zhouli
  date: 1750-01-01
  year_of: 1750
  type: achievement
  title_zh: 著三礼训义
  description: 著周礼疑义举要礼记训义择言等，考制度名物以通经，为四库著录
- id: guji-江永-event-guyun-draft
  date: 1757-01-01
  year_of: 1757
  type: achievement
  title_zh: 古韵标准成书
  description: 以诗三百篇凡千九百余入韵字比合部居，定平上去各十三部入声八部，每部列韵目注字音而系总论，冠以例言
- id: guji-江永-event-shiyun
  date: 1760-01-01
  year_of: 1760
  type: achievement
  title_zh: 作诗韵举例辨体例
  description: 列连句韵间句韵隔韵四声通韵诸体，明连韵易韵之变，以防误读强叶
- id: guji-江永-event-death
  date: 1762-01-01
  year_of: 1762
  type: death
  title_zh: 卒于婺源
  description: 乾隆二十七年卒，年八十二，四库馆臣称古韵之有条理者当以是编为最
