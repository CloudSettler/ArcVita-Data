  dilemmas:
  - 以今韵部分求古韵则拘格不通，泛引汉魏隋唐递变之音为古则丛脞无绪，如何严立界畔
  - 尊朱子从韵补以便诵读与驳正叶音旧误以辨古音之间，如何存敬而不苟同
  lesson: 以三百篇为宗严分部居，由今韵溯古音始得条理不淆
  summary_first_person: 我是婺源江永，潜心经训音学，以诗三百篇为主考定古韵，著古韵标准四卷及诗韵举例，又作四声切韵表以明今韵条理，愿后世得古音准绳而免淆乱
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%8F%E5%AD%A6/%E5%8F%A4%E9%9F%B5%E6%A0%87%E5%87%86.html
