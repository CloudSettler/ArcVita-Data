    start_date: 1285
    highlight_event_id: guji-熊忠-event-meeting-huang
  - key: breakthrough
    name: 快覩全帙
    labels:
      zh: 突破
    start_date: 1292
    highlight_event_id: guji-熊忠-event-meeting-huang
  decisions:
  - date: 1292
    title_zh: 决意举要以便四方
    rationale: 韵会编帙浩瀚四方学士不能遍览故取礼部韵为纲别为举要以解旧惑
- id: guji-熊忠-endeavor-2
  title_zh: 隐屏纂古今韵会举要三十卷
  summary: 隐屏取礼部韵略增以毛晃刘渊二韵及经传当收未载之字凡万二千余字详注音义字体
  phases:
  - key: climax
    name: 增字补注
    labels:
      zh: 高潮
    start_date: 1295
    highlight_event_id: guji-熊忠-event-completion-dingyou
  - key: closure
    name: 丁酉序成
    labels:
      zh: 收束
    start_date: 1297
    highlight_event_id: guji-熊忠-event-completion-dingyou
  decisions:
  - date: 1295
    title_zh: 以礼部韵为纲兼收毛刘今增
    rationale: 旧韵虽屡增而经史引用多未收故逐韵随音附入注明续降补遗以存依据
  - date: 1297
    title_zh: 详定凡例分韵例音例字例义例
    rationale: 音学久失字学浸失训释日繁故据说文六书考七音正字体明本义以复古而可行今
