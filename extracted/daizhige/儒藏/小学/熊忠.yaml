endeavors:
- id: guji-熊忠-endeavor-1
  title_zh: 馆黄门快覩古今韵会
  summary: 馆于在轩黄公绍门下先睹大书日承绪论明律吕次第七音六书之要
  phases:
  - key: brewing
    name: 馆学启蒙
    labels:
