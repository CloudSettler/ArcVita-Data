      raw: 嘉庆十年二月十四
  birth_date: 1724-07-26
  death_date: 1805-03-14
  era: 清代
  reign_ref: 乾隆
  archetype: 儒臣编纂者
  dilemmas:
  - 古今音变迥异而歌咏需协今，如何不戾于古而可行于今
  - 叶韵众说纷纭愈治愈棼，如何据古书承用以类相从而不旁牵博辩
  lesson: 叶韵非古而即古，以今视则叶，以古视则同，考音当据承用，明前有所承即后为有本，方能解结释纷
  summary_first_person: 我纪昀奉敕总纂钦定叶韵汇辑，与陆锡熊孙士毅等博考经史，仍佩文诗韵之部分，附叶韵于后，明通转叶之别，欲使临文索句者恢见闻而益思致，虽掇拾羣籍不敢穿凿，惟求得要于数百年讲古韵者
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%8F%E5%AD%A6/%E9%92%A6%E5%AE%9A%E5%8F%B6%E9%9F%B5%E6%B1%87%E8%BE%91.html
