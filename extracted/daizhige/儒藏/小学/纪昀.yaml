endeavors:
- id: guji-纪昀-endeavor-1
  title_zh: 总纂钦定叶韵汇辑考定古今通叶
  summary: 乾隆十五年奉敕撰五十八卷，仍佩文诗韵部分，別古韵之同，附叶韵于各部之后，征引经史以实其音
  phases:
  - key: brewing
    name: 奉敕受命立例
    labels:
      zh: 受命立例
    start_date: 1750-01-01
    highlight_event_id: guji-纪昀-event-yeyun-start
  - key: breakthrough
    name: 博考经史疏所出
    labels:
      zh: 博考疏证
    start_date: 1750-03-01
    highlight_event_id: guji-纪昀-event-yeyun-start
  - key: climax
    name: 分部附叶成编
    labels:
      zh: 分部成编
    start_date: 1750-06-01
    highlight_event_id: guji-纪昀-event-yeyun-complete
  - key: closure
    name: 恭校提要进呈
    labels:
      zh: 恭校进呈
    start_date: 1781-10-10
    highlight_event_id: guji-纪昀-event-tishang
  decisions:
  - date: 1750-03-01
    title_zh: 仍佩文诗韵为断分部附叶
    rationale: 古今遵用不同，以今韵离合別古韵之同，东冬自为部江自为部，使不戾于古而可行于今
  - date: 1750-06-01
    title_zh: 惟据古书注有是音者以类相从
    rationale: 宋以来叶韵纠纷弥甚，不复旁牵博辩，惟取承用有据者，明前有所承即后为有本
- id: guji-纪昀-endeavor-2
  title_zh: 总纂四库全书撰述提要辨章学术
  summary: 乾隆三十八年开四库馆任总纂官，与陆锡熊孙士毅等校书考证，撰提要辨源流正误，为叶韵汇辑作提要恭校上
  phases:
  - key: brewing
    name: 开馆入选充总纂
    labels:
      zh: 开馆总纂
    start_date: 1773-02-01
    highlight_event_id: guji-纪昀-event-siku
  - key: breakthrough
    name: 汇辑群书考订源流
    labels:
      zh: 考订源流
    start_date: 1774-01-01
    highlight_event_id: guji-纪昀-event-siku
  - key: climax
    name: 撰提要解结释纷
    labels:
      zh: 撰述提要
    start_date: 1780-01-01
    highlight_event_id: guji-纪昀-event-tishang
  - key: closure
    name: 恭校叶韵汇辑提要
    labels:
      zh: 恭校提要
    start_date: 1781-10-10
    highlight_event_id: guji-纪昀-event-tishang
  decisions:
  - date: 1773-02-01
    title_zh: 以渊海群书为据参校去留
    rationale: 征引错误诸本不免，细加参校，小误改而存之，大误竟削去，疑有别本则阙疑存按
  - date: 1781-10-10
    title_zh: 断叶韵以独酌其中之法持平
    rationale: 于数百年讲古韵者取不偏执一理之法，转叶必引韵语为证，使通韵一定而叶韵有本
events:
- id: guji-纪昀-event-birth
  title_zh: 生于直隶献县纪氏
  date: 1724-07-26
  year_of: 1724
  kind: birth
  description: 雍正二年六月十五生于直隶献县书香之家，少习经史长而泛览百家
- id: guji-纪昀-event-yeyun-start
  title_zh: 乾隆十五年奉敕编纂叶韵汇辑
  date: 1750-01-01
  year_of: 1750
  kind: career
  description: 与梁诗正蒋溥汪由敦等奉敕撰叶韵汇辑，定凡例別通转叶，仍佩文诗韵部分为五十八卷
- id: guji-纪昀-event-yeyun-complete
  title_zh: 御制叶韵汇辑序授梓而行
  date: 1750-07-01
  year_of: 1750
  kind: career
  description: 乾隆庚午夏六月御笔制序，言幼习易诗考音与今不合，指授儒臣博考经史唐宋大家之文列于今韵之后
- id: guji-纪昀-event-siku
  title_zh: 开四库馆充总纂官
  date: 1773-02-01
  year_of: 1773
  kind: career
  description: 乾隆三十八年开四库全书馆，与陆锡熊孙士毅同为总纂官，总其成而辨章学术
- id: guji-纪昀-event-tishang
  title_zh: 恭校叶韵汇辑提要上
  date: 1781-11-25
  year_of: 1781
  kind: career
  description: 乾隆四十六年十月初十日恭校上提要，言古今声音递变如篆隶之变，所録惟据古书注有是音者，诚为独酌其中
- id: guji-纪昀-event-death
  title_zh: 卒于京师
  date: 1805-03-14
  year_of: 1805
  kind: death
  description: 嘉庆十年二月十四卒于京师，历乾隆嘉庆两朝，以总纂四库及提要之学名世
