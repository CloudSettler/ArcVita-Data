  summary_first_person: 余钱塘薛尚功字用敏绍兴中佐定江军幕嗜古好奇深通篆籀集三代钟鼎彝器款识为二十卷又析为钟鼎篆韵七卷校考古博古之失以明古文大小篆之变愿以此为考古征鉴书家原系
