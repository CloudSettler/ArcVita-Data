    labels:
      zh:
      - 明辨
    start_date: 0110-01-01
    highlight_event_id: guji-许慎-event-present
  - key: climax
    name: 以古学传马融郑玄开后学之先
    labels:
      zh:
      - 传道
    start_date: 0120-01-01
    highlight_event_id: guji-许慎-event-present
  - key: closure
    name: 病免归召陵闭门授徒以终
    labels:
      zh:
      - 归守
    start_date: 0130-01-01
    highlight_event_id: guji-许慎-event-death
  decisions:
  - date: 0110-01-01
    title_zh: 不党今古而据经据文以折是非
    rationale: 今古各护师说而经义不明故征文字本义以定一尊免空争
  - date: 0130-01-01
    title_zh: 病免不求荣进而归乡教授
    rationale: 宦达非吾志不如全经术于后世故闭户精究以待来者
