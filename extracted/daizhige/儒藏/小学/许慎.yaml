  name_zh: 许慎
  names:
    zh: 许慎
    en: Xu Shen
  lifespan:
    birth:
      date: 0058-01-01
      precision: year
      is_circa: true
      raw: 汉光武建武十四年左右
    death:
      date: 0147-01-01
      precision: year
      is_circa: true
      raw: 汉顺帝永和二年左右
  birth_date: 0058-01-01
  death_date: 0147-01-01
  era: 东汉
  reign_ref: 汉和帝永元至汉安帝建光
  archetype: 穷经考文者
  dilemmas:
  - 师承古文经而今文显贵当坚守家法还是隐默避争
  - 俗书省变乱真当从俗便易还是追原订正以正经义
  lesson: 守先师之法而通其变以一字一原还文字之本真
  summary_first_person: 吾召陵许叔重也少从贾逵受古文经见俗书讹谬遂究六书之恉采仓颉之绪以五百四十部统九千三百五十三文作说文解字以系文字统绪虽世贵今文吾守古笃实不敢失坠
  source_urls:
  - https://daizhige.org/儒藏/小学/说文解字.html
  - https://zh.wikisource.org/wiki/說文解字
  - https://ctext.org/shuo-wen-jie-zi/zh
endeavors:
- id: guji-许慎-endeavor-1
  title_zh: 集古文考六书作说文解字
  summary: 以五百四十部统九千余文究形音义之原以救俗书之讹变
  phases:
  - key: brewing
    name: 少从贾逵受古文经学
    labels:
      zh:
      - 积学
    start_date: 0075-01-01
    highlight_event_id: guji-许慎-event-study
  - key: breakthrough
    name: 立五百四十部首纲纪群字
    labels:
      zh:
      - 立纲
    start_date: 0089-01-01
    highlight_event_id: guji-许慎-event-complete
  - key: climax
