    labels:
      zh:
      - 成书
    start_date: 0100-01-01
    highlight_event_id: guji-许慎-event-complete
  - key: closure
    name: 建光元年子冲奉书献于宫中
    labels:
      zh:
      - 显学
    start_date: 0121-01-01
    highlight_event_id: guji-许慎-event-present
  decisions:
  - date: 0089-01-01
    title_zh: 不从俗简而追仓颉之迹别六书之恉
    rationale: 俗书省改乱真唯原形可正经义故以小篆为正兼收古文籀文
  - date: 0100-01-01
    title_zh: 以部为纲系众字使分别部居不杂厕
    rationale: 字多形散非部分无以统之故创五百四十部以一统众使学者可寻
- id: guji-许慎-endeavor-2
  title_zh: 任南阁祭酒治五经作五经异义
  summary: 守古文师法辨五经今古异同以存圣人之微言
  phases:
  - key: brewing
    name: 出为南阁祭酒励精经术
    labels:
      zh:
      - 入仕
    start_date: 0086-01-01
    highlight_event_id: guji-许慎-event-study
  - key: breakthrough
