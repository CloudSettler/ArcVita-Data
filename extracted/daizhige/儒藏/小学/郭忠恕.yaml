  dilemmas:
  - 俗书讹变日盛而经籍当守古义，何以辨正形声
  - 才高狂直不容于朝，当徇直道守拙还是俯仰事人
  lesson: 明小学以正文字，辨讹俗以存古义，守精审而不徇流俗
  summary_first_person: 吾幼能属文，穷究六书，深悯形声讹变传写差舛，乃分三科作佩觿三卷，以四声分十段，辨疑似，正读义，欲使童蒙知小学为大学之本，虽狂直获罪，初心不改
