- id: guji-郭忠恕-event-peixi
  type: work
  date: 0970
  year_of: 970
  title_zh: 佩觿考证精审传世
  description: 书成辨逄姓读皮江反角里作甪里之类，证以碑刻字源，较他家精审，为小学字书之宗
- id: guji-郭忠恕-event-exile
  type: career
  date: 0975
  year_of: 975
  title_zh: 狂直获罪贬谪
  description: 以酒狂讥讽时政不容于朝，太平兴国初擅离贬官，流配崖州，道上自处泊然
- id: guji-郭忠恕-event-death
  type: death
  date: 0977
  year_of: 977
  title_zh: 卒于贬所
  description: 宋太平兴国二年卒于流贬途中，后世以小学宗师兼画家仙品传之，御题称其蝉蜕地仙列
