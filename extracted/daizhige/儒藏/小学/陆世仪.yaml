endeavors:
- id: guji-陆世仪-endeavor-1
  title_zh: 重建幼仪小学
  goal: 五六岁入小学，编易晓韵语，使即读即教知行并进
  phases:
  - key: brewing
    name: 察世变议早入
    labels:
      zh: 早教
    start_date: 1660
    highlight_event_id: guji-陆世仪-event-jieyun
  - key: breakthrough
    name: 拟定节韵幼仪
    labels:
      zh: 编书
    start_date: 1665
    highlight_event_id: guji-陆世仪-event-jieyun
  - key: climax
    name: 知行并进之教
    labels:
      zh: 知行
    start_date: 1668
    highlight_event_id: guji-陆世仪-event-jieyun
  - key: closure
    name: 戒时文务实读
    labels:
      zh: 务实
    start_date: 1670
    highlight_event_id: guji-陆世仪-event-lileyue
  decisions:
  - date: 1665
    title_zh: 决当五六岁入小学
    rationale: 今时人心风俗不如古，子弟五六岁已多知诱物化，迟至八岁则费手脚，故当早教
  - date: 1668
    title_zh: 采礼经编节韵幼仪
    rationale: 文公所集多穷理近大学且多难字古礼不谐今俗，故采曲礼幼仪参以近礼作三五字韵语易晓易行
- id: guji-陆世仪-endeavor-2
  title_zh: 礼乐涵养社学
  goal: 以礼乐涵养气质，复社学歌诗习礼之法，反朴养才
  phases:
  - key: brewing
    name: 叹礼乐久废
    labels:
      zh: 礼乐
    start_date: 1662
    highlight_event_id: guji-陆世仪-event-lileyue
  - key: breakthrough
    name: 辑礼书乐书
    labels:
      zh: 辑礼
    start_date: 1666
    highlight_event_id: guji-陆世仪-event-lileyue
  - key: climax
    name: 社学鼓舞简束并用
    labels:
      zh: 社学
    start_date: 1669
    highlight_event_id: guji-陆世仪-event-lileyue
  - key: closure
    name: 家庭朝廷端本
    labels:
      zh: 端本
    start_date: 1671
    highlight_event_id: guji-陆世仪-event-lileyue
  decisions:
  - date: 1666
    title_zh: 辑冠婚祭乡饮乡射为礼书
    rationale: 礼乐不可斯须去身，童子当兼习书数暇日升歌习礼如舞勺舞象以薰陶德性
  - date: 1669
    title_zh: 社学宽严因年而施
    rationale: 少年宜宽以诱入道，壮年宜严以禁或放，徒督句读则失鼓舞，纯用鼓舞则流放荡
events:
- id: guji-陆世仪-event-birth
  date: 1611
  year_of: 1611
  title_zh: 生于太仓
  description_zh: 明万历三十九年生于南直隶太仓，字道威，号桴亭
  location_zh: 太仓
- id: guji-陆世仪-event-jieyun
  date: 1665
  year_of: 1665
  title_zh: 论定小学早教与节韵幼仪
  description_zh: 论古者八岁入小学今当五六岁始，议编节韵幼仪，头容直手容恭即读即教，兼论记性悟性与分年读书法
  location_zh: 太仓
- id: guji-陆世仪-event-lileyue
  date: 1669
  year_of: 1669
  title_zh: 倡礼乐社学以养人才
  description_zh: 主辑礼书乐书，童子歌诗习礼，辨六艺文义之别，戒早习时文，强调家庭洒扫应对与朝廷教化端本清源
  location_zh: 太仓
- id: guji-陆世仪-event-death
  date: 1672
  year_of: 1672
  title_zh: 卒于太仓
  description_zh: 清康熙十一年卒，一生以理学教育著述传世，论小学为其蒙养要旨
  location_zh: 太仓
