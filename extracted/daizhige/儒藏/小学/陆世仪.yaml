  dilemmas:
  - 遵古礼与谐今俗之间如何斟酌通行
  - 早习时文捷得与读书务实养深之间如何取舍
  lesson: 蒙养当早正礼乐，知行并进以养淳朴，读书务实戒早习时文
  summary_first_person: 吾桴亭太仓人，见人心风俗远不如古，主五六岁即入小学，欲采曲礼幼仪参以近礼编节韵幼仪，兼辑礼乐之书，令童子歌诗习礼洒扫应对中涵养德性，反朴养才以救时文之弊
