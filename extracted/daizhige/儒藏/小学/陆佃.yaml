  decisions:
  - date: 1067
    title_zh: 召对言物性进二篇
    rationale: 因神宗问对即以鱼木明名义相须故先献说鱼说木
  - date: 1090
    title_zh: 易名埤雅明为辅
    rationale: 既毕尔雅注则以此裨补尔雅故不立门类而以埤为名
