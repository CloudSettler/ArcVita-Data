endeavors:
- id: guji-陈第-endeavor-1
  title_zh: 撰毛诗古音攷
  summary: 考五百字本音以破叶音之说立古音学之基
  phases:
  - key: brewing
    name: 少好古音遍稽群书
    labels:
      zh: 酝酿
    start_date: '1570'
    highlight_event_id: guji-陈第-event-maoshi-brewing
  - key: breakthrough
    name: 毛诗古音攷灾木刊行
    labels:
      zh: 突破
    start_date: '1603'
    highlight_event_id: guji-陈第-event-maoshi-done
  decisions:
  - date: '1603'
    title_zh: 以本音系联不从叶韵
    rationale: 考诗易之音耿然不可易合群书以证上世之音
- id: guji-陈第-endeavor-2
  title_zh: 撰屈宋古音义
  summary: 取屈宋三十八篇推二百三十四字本音以羽翼毛诗
  phases:
  - key: climax
    name: 以韵为断集注三十八篇
    labels:
      zh: 高潮
    start_date: '1610'
    highlight_event_id: guji-陈第-event-qusong-writing
  - key: closure
    name: 万历癸丑序成于东瓯江心寺
    labels:
      zh: 收束
    start_date: '1613'
    highlight_event_id: guji-陈第-event-qusong-done
  decisions:
  - date: '1613'
    title_zh: 依朱熹集注参王逸章句而不取他本
    rationale: 校雠援引已悉一以韵为断则开卷若指诸掌
  - date: '1613'
    title_zh: 本证明列旁证附注以发明古音
    rationale: 毛诗所有者提本音注出处所无者旁引他书相质证
