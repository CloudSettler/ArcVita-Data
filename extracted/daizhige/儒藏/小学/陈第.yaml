  decisions:
  - date: 1600
    title_zh: 定本证旁证二条
    rationale: 本证以诗自相证探古音之源，旁证采左国易象离骚秦碑汉赋以竟其委，不随意改读
  - date: 1606
    title_zh: 断叶音皆即本音
    rationale: 母必读米马必读姥京必读疆福必读偪，矩律严于唐韵，非辗转牵就
