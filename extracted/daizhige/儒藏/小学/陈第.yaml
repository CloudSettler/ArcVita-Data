  archetype: 古音学家
  dilemmas:
  - 时人悉委古韵于叶音一字而古音晦而不明
  - 楚辞注家率不论其音致声韵不谐而训诂亦乖
  lesson: 稽往古合群书以求本音可破叶韵之陋而羽翼经义
  summary_first_person: 吾少好楚辞尤好屈宋以古音读之声韵颇谐遂先成毛诗古音攷复取屈宋三十八篇推本音二百三十四字以明叶音之谬而羽翼毛诗也
