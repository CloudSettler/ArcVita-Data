  archetype: 文武兼备的古音学开创者
  dilemmas:
  - title_zh: 今音读古诗乖剌不入
    description_zh: 以今之音读古之作则韵不谐，委之叶音则茫无定律
  - title_zh: 武事与经术难兼
    description_zh: 以诸生从军立功与独居海上考究三百篇之间抉择
  lesson: 以经证经排比本证旁证，证明古今音异而古音截然不紊，不执今韵妄通古音
  summary_first_person: 我字季立，闽连江人，少受诗于家庭，尝以诸生从军，晚独居海上，日夕读三百篇，排比经文参以群籍，列本证旁证以考古音，欲便于歌咏以复古人之声
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%8F%E5%AD%A6/%E6%AF%9B%E8%AF%97%E5%8F%A4%E9%9F%B3%E6%94%B7.md
