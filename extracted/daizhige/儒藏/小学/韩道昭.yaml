  dilemmas:
  - 以等韵颠倒字纽次第是否违古而惑后学
  - 广韵二万六千余言集韵五万三千余言如何取舍并合而不失旧法
  lesson: 会通广集二韵以简驭繁则旧法可存而检寻可便
  summary_first_person: 吾为真定松水韩道昭字伯晖生逢金世以小学韵书为业采广韵为本增以集韵字分三十六母四等合二百六韵为一百六十韵成五音集韵十五卷欲使唐韵旧法不因礼部韵略窜改而泯也
