endeavors:
- id: guji-韩道昭-endeavor-1
  title_zh: 重编等韵成五音集韵十五卷
  goal_zh: 以三十六母四等统收五万三千余字便检寻
  phases:
  - key: brewing
    name: 博览广韵集韵积学等韵
    labels:
      zh: 酝酿
    start_date: '1190'
    highlight_event_id: guji-韩道昭-event-1
  - key: breakthrough
    name: 立三十六母四等排比诸字
    labels:
      zh: 突破
    start_date: '1200'
    highlight_event_id: guji-韩道昭-event-1
  - key: climax
    name: 合二百六韵为一百六十韵
    labels:
      zh: 高潮
    start_date: '1208'
    highlight_event_id: guji-韩道昭-event-1
  - key: closure
    name: 注文三十三万余言定稿刊传
    labels:
      zh: 收束
    start_date: '1212'
    highlight_event_id: guji-韩道昭-event-2
  decisions:
  - date: '1200'
    title_zh: 以广韵为蓝本以集韵为增入蓝本
    rationale: 广韵二万六千一百九十四言为基集韵新增二万七千三百余言为益则五万三千五百二十五言可全
  - date: '1208'
    title_zh: 以三十六母各分四等颠倒字纽先后
    rationale: 不依平上去入旧次而依等韵母等则音理贯通检字易得虽遭诟病而不改
- id: guji-韩道昭-endeavor-2
  title_zh: 考订韵略窜改存唐韵旧法
  goal_zh: 订正重刊广韵之讹存十三处并合真相
  phases:
  - key: brewing
    name: 考礼部韵略颁行后窜改之迹
    labels:
      zh: 酝酿
    start_date: '1195'
    highlight_event_id: guji-韩道昭-event-2
  - key: breakthrough
    name: 辨独用同用本为唐旧非宋新法
    labels:
      zh: 突破
    start_date: '1205'
    highlight_event_id: guji-韩道昭-event-2
  - key: climax
    name: 并忝于琰槛于豏俨于范等以复旧
    labels:
      zh: 高潮
    start_date: '1208'
    highlight_event_id: guji-韩道昭-event-2
  - key: closure
    name: 废不与队代通殷隐不与文吻通以垂则
    labels:
      zh: 收束
    start_date: '1212'
    highlight_event_id: guji-韩道昭-event-2
  decisions:
  - date: '1205'
    title_zh: 不从贾昌朝所改窄韵十三处
    rationale: 唐末至景祐功令所遵未改韵略并合致舛当存旧以订重刊广韵之讹
  - date: '1208'
    title_zh: 定为一百六十韵仍注独用同用
    rationale: 上去末六韵通为二与平入不殊废殷诸韵仍旧不与他韵错互则犁然可考
