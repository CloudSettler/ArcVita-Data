  reign_ref: 梁武帝大同九年至陈宣帝太建
  archetype: 小学宗师
  dilemmas:
  - 五典三坟异义竞开六书八体古今殊形如何会通成一家之制
  - 梁陈鼎革兴亡频仍如何以文字之业寄不朽而全身
  lesson: 会通群籍以正文字则经世治俗有所本守正不阿以立言则身没而书可传
  summary_first_person: 吾吴郡顾野王也少博学七岁能文承明命为黄门侍郎兼太学博士总会众篇校雠群籍成玉篇三十卷凡五百四十二部后入陈知国史撰舆地志惟愿后人因文字以通道德识古今而不惑
  source_urls:
