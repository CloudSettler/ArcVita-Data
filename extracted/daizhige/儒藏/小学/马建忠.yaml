  dilemmas:
  - 中体西用之局中如何以西法之规矩发明华文之不变之例
  - 讲究富强经世之实用与沉潜小学考据之孤学之间何去何从
  lesson: 因西文已有之规矩以律华文，比类会通，立可授受之程以载道明理
  summary_first_person: 余丹徒马建忠，少习西学，游历泰西，佐李鸿章办洋务，深感西童习文有葛郎玛之序而华文无定程，遂积十余年，取经史韩文为宗，字栉句比而成马氏文通，以揭华文义例，开后人学文之先路
