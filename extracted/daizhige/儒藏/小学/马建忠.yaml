  decisions:
  - date: 1886
    title_zh: 取经史韩文为宗作字类句读比勘
    rationale: 古人文运虽变而集字成句有一成不变之例，须博引互证以得会通
  - date: 1898
    title_zh: 先刊上册六卷明正名实字虚字
    rationale: 草创未定不敢尽出，先示规矩方圆以待同志新补臻备
