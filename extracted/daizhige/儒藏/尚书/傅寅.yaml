    description_zh: 博引诸家而不肯蹈袭前人，特立己见以求经义大成
  - title_zh: 出仕还是隐居著述
    description_zh: 以处士终老，专力群书百考与禹贡之学
  lesson: 治经当遍集先儒而后断以己心，通世务以求山川实地，方能卓然自立
  summary_first_person: 我为金华处士傅寅，生当南宋，隐居不仕，遍考群书而为之图，尤究心禹贡山川贡赋，博引众说而断以己意，不愿蹈袭前人，愿后学复见完书而得其经世之用
