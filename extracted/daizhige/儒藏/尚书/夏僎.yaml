  archetype: 尚书集解型经师
  dilemmas:
  - title_zh: 会粹众说与断以己意
    description: 博采二孔王苏陈程张及林之奇集解而折衷六七分，既要舍短取长，又要反覆条畅深究详绎，恐流于略冗穿凿。
  - title_zh: 便举子与明大经大法
    description: 陈振孙讥其便于举子，而时澜李公凯许其渊源正议论醇，要在使唐虞三代大经大法曲折而通。
  lesson: 研精覃思博采折衷，曲折详绎以通大经，方能使古书垂世立教。
  summary_first_person: 吾少治尚书，妙年以之掇第，与周升缪景仁以明经教授并称三俊，老而益精，博采众说折衷林之奇而断以己意，成详解以明唐虞三代之用心，幸得麻沙刊行以与学者共之。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E5%A4%8F%E6%B0%8F%E5%B0%9A%E4%B9%A6%E8%AF%A6%E8%A7%A3.md
