  decisions:
  - date: '1160'
    title_zh: 以尚书举进士
    rationale: 少治一经而精，欲以其英掇巍第以显经术
  - date: '1170'
    title_zh: 以明经教授终身
    rationale: 与周升缪景仁切磋经义，不废讲授以淑后学
- id: guji-夏僎-endeavor-2
  title_zh: 博采折衷撰尚书详解
  description: 老而益精尚书，兼取二孔王苏陈程张而折衷林之奇集解什六七，成详解二十六卷，于淳熙丙午由麻沙刘氏刊行。
  phases:
  - key: brewing
    name: 研精覃思博采众说
    labels:
