    highlight_event_id: guji-夏僎-event-xu
  - key: closure
    name: 明初并列学官寖微
    labels:
      zh:
      - 学官并用
      - 蔡传独行
    start_date: '1369'
    highlight_event_id: guji-夏僎-event-xueguan
  decisions:
  - date: '1180'
    title_zh: 兼采折衷林之奇
    rationale: 考南渡数百家以三山林之奇集解最称，故折衷其说什六七而参以诸家
  - date: '1186'
    title_zh: 付麻沙刘氏刊行
    rationale: 不欲秘为己私，命工锓木以与学者共之，使唐虞三代用心得以心通意解
events:
- id: guji-夏僎-event-birth
  date: '1130'
  year_of: 1130
  title_zh: 生于龙游
  description: 约南宋绍兴前后生于浙之龙游，字元肃，号柯山。
- id: guji-夏僎-event-jinshi
  date: '1160'
  year_of: 1160
  title_zh: 举进士以明经教授称三俊
  description: 妙年撷尚书之英掇巍第，与周升缪景仁以明经教授并称三俊。
- id: guji-夏僎-event-shangshu
  date: '1186'
  year_of: 1186
  title_zh: 尚书详解麻沙刊行
  description: 老而益精成尚书详解，淳熙间麻沙书坊刘氏得善本锓木刊行。
- id: guji-夏僎-event-xu
  date: '1186-07-01'
  year_of: 1186
  title_zh: 时澜作序推许
  description: 淳熙丙午七月觉斋时澜作序，称其议论渊深词气超迈，参于前有光顾于后绝配。
- id: guji-夏僎-event-xueguan
  date: '1369'
  year_of: 1369
  title_zh: 明初诏并用夏蔡二传
  description: 明洪武间初定科举式，诏习尚书者并用夏氏蔡氏两传，后永乐大全出蔡传独行学官而夏书寖微。
- id: guji-夏僎-event-death
  date: '1200'
  year_of: 1200
  title_zh: 卒
  description: 约庆元前后卒，遗书惟抄帙传世，后经永乐大典参校补辑成完帙。
