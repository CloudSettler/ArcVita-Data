  decisions:
  - date: '1710'
    title_zh: 以春秋二时喻曲礼之名
    rationale: 因曲字便谓有曲无经者失谦辞本意，故举春秋止纪二时而实包四时以正之
  - date: '1710'
    title_zh: 区分君臣朝觐与饮食步趋
    rationale: 经属大仪，曲属细节，兼记方见全礼，故特标经曲两目以定篇旨
events:
- id: guji-姚际恒-event-birth
  title_zh: 出生休宁姚氏
  date: '1647'
  year_of: 1647
  description: 清顺治四年生于休宁，字立方，少阎若璩十一岁，后闭户著书
- id: guji-姚际恒-event-meet-1693
  title_zh: 癸酉冬西泠谒阎若璩
  date: '1693'
  year_of: 1693
  description: 薄游西泠，经毛大可介绍交阎若璩，出示所著十卷，阎喜而手自缮写散各条下
- id: guji-姚际恒-event-shangshu-1700
  title_zh: 成古文尚书通论十卷
  date: '1700'
  year_of: 1700
  description: 统论句法排对四六与字法钦臧庸乃诸字，又逐篇辨舜典浚哲文明袭王延寿鲁灵光殿赋，泰誓同德度义袭左传苌弘语，立经传俱伪之说
- id: guji-姚际恒-event-liji-1710
  title_zh: 论礼记曲礼经曲兼备
  date: '1710'
  year_of: 1710
  description: 谓曲礼兼记君臣上下吉凶朝觐之经与饮食居处进退步趋之曲，以举细为名乃谦辞，驳有曲无经之说
- id: guji-姚际恒-event-death
  title_zh: 逝世
  date: '1715'
  year_of: 1715
  description: 康熙末年卒，尚书礼记二通论辑本流传，阎氏尚书古文疏证多引其说
