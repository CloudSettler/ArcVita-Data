  decisions:
  - date: '1693'
    title_zh: 出示十卷求正阎氏
    rationale: 闻阎氏攻伪同调，故以失得相质，借其缮写散各条以显超人意见
  - date: '1700'
    title_zh: 主张经传俱伪斩葛藤
    rationale: 见世人但辨伪传不知辨伪经，处处成碍，故立经传同出一手之说以通伊训泰誓诸节
- id: guji-姚际恒-endeavor-2
  title_zh: 撰礼记通论明经曲之义
  summary: 释曲礼兼记经曲之别，以谦辞解曲字，纠诸儒有曲无经之误
