  - title_zh: 师说纷纭何以定一
    description_zh: 南北经说各守师承后学迷惑故须会通众说以立正义
  - title_zh: 守古义与成时教之衡
    description_zh: 既存汉魏古注之实又成一代国学之教故在博采与裁断之间求中
  lesson: 会通众说以定一尊方能使经典垂之久远
  summary_first_person: 吾少好学昼夜不倦值南北异说纷纭入唐侍秦王府讲论遂奉太宗诏领诸儒撰五经正义亲主尚书会郑王诸家之言断以大义成二十卷颁行国学愿后学有所折衷不迷多歧
  source_urls:
  - https://zh.wikisource.org/wiki/尚書正義
  - https://ctext.org/library.pl?if=gb&res=780
