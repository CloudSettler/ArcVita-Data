  - date: 1752
    title_zh: 以水经立总目先蔡传而为笺
    rationale: 以水经所载为主附论于下会四海于同使支派有所归而不为蔡传所囿
  - date: 1778
    title_zh: 年近九旬托赵文冕捐资剞劂
    rationale: 检旧簏得十二卷旧稿不忍藏拙愿以此书为后学司南故邮请是正付刻问世
