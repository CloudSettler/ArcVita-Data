  decisions:
  - date: 1315
    title_zh: 多宗蔡义不考旧文
    rationale: 为启迪幼学而设，延祐学官业举皆习蔡传，故舍孔传繁复以就显明
  - date: 1316
    title_zh: 引孔安国序冠篇首
    rationale: 明伏生加尚及壁中古文五十九篇之源，使学者知百篇恢弘至道之本
events:
- id: guji-朱祖义-event-birth
  title_zh: 生于庐陵
  date: 1270
  year_of: 1270
  description: 朱祖义字子由生于吉州庐陵，少治诸经，长以句解授徒
- id: guji-朱祖义-event-qunjing
  title_zh: 遍作群经句解
  date: 1305
  year_of: 1305
  description: 于诸经皆有句解，随文诠释词意显明，后多散佚不传
- id: guji-朱祖义-event-yanyou
  title_zh: 延祐定经义取士
  date: 1315
  year_of: 1315
  description: 元延祐中定科举，尚书以古注疏及蔡沈集传为宗，末流蔡传独立于学官
- id: guji-朱祖义-event-shangshu
  title_zh: 成尚书句解十三卷
  date: 1317
  year_of: 1317
  description: 专为启迪幼学撰尚书句解十三卷，多宗蔡义，自尧典舜典至文侯秦誓皆句释，乾隆四十六年入四库提要称其笃实
- id: guji-朱祖义-event-death
  title_zh: 约卒于元后期
  date: 1335
  year_of: 1335
  description: 句解既成传于学者，群经句解多散佚，尚书句解独存，卒年约在元惠宗前
