  dilemmas:
  - title_zh: 宗蔡还是博考旧疏
    description: 延祐定科举宗蔡传，若博考孔传旧疏则繁难，幼学难入，若专宗蔡义则失之浅近
  - title_zh: 浅近启蒙还是深奥义理
    description: 欲使殷盘周诰展卷了然，须随文诠释词意显明，又恐附凿浮文反晦经义
  lesson: 离经辨志，笃实显明，启迪幼学先求了然心口，不以穿凿妨要
  summary_first_person: 吾庐陵朱祖义，字子由，元时治经为学，遍注群经皆为句解，尤存尚书十三卷，延祐科举独宗蔡沈，吾专为幼学启迪，随文显释，使聱牙可解，虽浅近不废笃实
  source_urls:
