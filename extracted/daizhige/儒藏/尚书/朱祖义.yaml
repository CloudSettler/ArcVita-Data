    title_zh: 定句解体专迪幼学
    rationale: 见古注疏繁而科举童习莫入，故不复考证旧文，随文显释以了然心口
  - date: 1310
    title_zh: 罕引训诂名物
    rationale: 恐浮文妨要晦蚀经义，守先儒笃实，取离经辨志之意
