person:
  qid: guji-梅鷟
  name_zh: 梅鷟
  names:
    zh: 梅鷟
    en: Mei Zhuo
  lifespan:
    birth:
      date: 1484
      precision: year
      is_circa: true
      raw: 约弘治末年旌德
    death:
      date: 1541
      precision: year
      is_circa: true
      raw: 约嘉靖二十年前后
  birth_date: 1484
  death_date: 1541
  era: 明
  reign_ref: 明武宗正德至明世宗嘉靖
  archetype: 经学考据家
  dilemmas:
  - 尊信汉唐传注以安 versus 逐条考其所出以辨伪
  - 畏好为异论之讥 versus 任恢复圣经之责
  lesson: 治经当除蔽翳核所出，不以袭旧为安，不以传久为真。
  summary_first_person: 吾为旌德梅鷟，正德癸酉举人，官南京国子监助教，终盐课司提举。吾见世传古文尚书孔安国传出于东晋梅赜，增多二十五篇，杂取传记以成文，遂作考异逐条考证其所出，以伏生二十九篇为真经，欲使学者涣然知蔽塞之由，恢复圣经而非好辨。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E5%B0%9A%E4%B9%A6%E8%80%83%E5%BC%82.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E5%B0%9A%E4%B9%A6%E8%80%83%E5%BC%82.html
endeavors:
- id: guji-梅鷟-endeavor-1
  title_zh: 考辨古文尚书撰尚书考异
  summary_zh: 以伏生二十九篇为真经，指安国序及增多二十五篇皆杂取左传论语诸书而成，逐条考其所出，为古文疏证开先声。
  phases:
  - key: brewing
    name: 疑古酝酿
    labels:
      zh: 酝酿
    start_date: 1513
    highlight_event_id: guji-梅鷟-event-juren
  - key: breakthrough
    name: 群书互证
    labels:
      zh: 突破
    start_date: 1522
    highlight_event_id: guji-梅鷟-event-zhujiao
  - key: climax
    name: 考异成书
    labels:
      zh: 高潮
    start_date: 1530
    highlight_event_id: guji-梅鷟-event-kaoyi
  - key: closure
    name: 藏阁垂后
    labels:
      zh: 收束
    start_date: 1540
    highlight_event_id: guji-梅鷟-event-tiju
  decisions:
  - date: 1525
    title_zh: 定伏生二十九篇为圣经之本真
    rationale: 以史记儒林传及汉志壁藏独得二十九篇并序为据，斥失其本经口以传授之诞妄。
  - date: 1530
    title_zh: 断增多二十五篇为东晋模仿窥窃之伪书
    rationale: 以德乃降连经辰不集房系季秋惟孝截去孝乎等为例，证其无一字不本古语而平缓卑弱不类先汉文。
- id: guji-梅鷟-endeavor-2
  title_zh: 仕宦讲学与尚书谱
  summary_zh: 正德举人后官南京国子监助教，推明今文正经，终盐课司提举，别撰尚书谱与考异相表里。
  phases:
  - key: brewing
    name: 举于正德
    labels:
      zh: 酝酿
    start_date: 1513
    highlight_event_id: guji-梅鷟-event-juren
  - key: breakthrough
    name: 助教讲经
    labels:
      zh: 突破
    start_date: 1522
    highlight_event_id: guji-梅鷟-event-zhujiao
  - key: climax
    name: 谱传并行
    labels:
      zh: 高潮
    start_date: 1530
    highlight_event_id: guji-梅鷟-event-kaoyi
  - key: closure
    name: 提举以终
    labels:
      zh: 收束
    start_date: 1540
    highlight_event_id: guji-梅鷟-event-tiju
  decisions:
  - date: 1522
    title_zh: 就南京国子监助教以正经训士
    rationale: 以嘉谷明珠不可杂以秕稗鱼目，故守伏生今文斥伪孔传附丽正经而行。
  - date: 1535
    title_zh: 别作尚书谱存其目
    rationale: 持论略同考异而未及精核，留以俟后之君子，不复杂入考异五卷之中。
events:
- id: guji-梅鷟-event-birth
  date: 1484
  year_of: 1484
  type: birth
  title_zh: 出生于旌德
  description_zh: 约弘治末年生于徽州旌德梅氏，后治尚书为举业。
- id: guji-梅鷟-event-juren
  date: 1513
  year_of: 1513
  type: achievement
  title_zh: 正德癸酉举人
  description_zh: 明武宗正德八年癸酉科举人，始以经学知名。
- id: guji-梅鷟-event-zhujiao
  date: 1522
  year_of: 1522
  type: career
  title_zh: 官南京国子监助教
  description_zh: 官南京国子监助教，以伏生今文教授诸生，辨东晋伪孔之非。
- id: guji-梅鷟-event-kaoyi
  date: 1530
  year_of: 1530
  type: work
  title_zh: 撰成尚书考异
  description_zh: 以史汉隋志及左传论语月令等逐条考增多二十五篇所出，成尚书考异，别有尚书谱相辅，为阎若璩疏证之先声。
- id: guji-梅鷟-event-tiju
  date: 1540
  year_of: 1540
  type: career
  title_zh: 终盐课司提举
  description_zh: 晚官盐课司提举，其书藏范懋柱家天一阁，不题撰人而书中自称鷟按。
- id: guji-梅鷟-event-death
  date: 1541
  year_of: 1541
  type: death
  title_zh: 逝世
  description_zh: 约嘉靖二十年前后卒，后四库馆臣析其书为五卷，以舜典以下为卷二，以仲虺以下为卷三，以泰誓以下为卷四，以旧本异同为卷五。
