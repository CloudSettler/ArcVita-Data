  lesson: 卫经当求实证辨伪不可逞辞反害经
  summary_first_person: 吾七岁受尚书即闻今古文之分壮岁避兵流离见攻古文者遍天下故考中外官私授受之源辨梅赜所上为孔传而经文自在著冤词八卷以讼千年之冤
