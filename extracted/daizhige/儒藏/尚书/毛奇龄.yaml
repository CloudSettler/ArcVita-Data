endeavors:
- id: guji-毛奇龄-endeavor-1
  title_zh: 讼古文尚书之冤
  goal_zh: 考今古文源流辨梅赜所献为孔传而存经文以解千年冤诬
  phases:
  - key: brewing
    name: 少闻今古文之分
    labels:
      zh: 受经发疑
    start_date: '1630'
    highlight_event_id: guji-毛奇龄-event-early-study
  - key: breakthrough
    name: 考中外授受之别
    labels:
      zh: 考辨立说
    start_date: '1679'
    highlight_event_id: guji-毛奇龄-event-hanlin
  - key: climax
    name: 著冤词八卷力辨为真
    labels:
      zh: 著书讼冤
    start_date: '1698'
    highlight_event_id: guji-毛奇龄-event-yuan-word
  - key: closure
    name: 卫经之说行于世
    labels:
      zh: 垂后互考
    start_date: '1716'
    highlight_event_id: guji-毛奇龄-event-death
  decisions:
  - date: '1644'
    title_zh: 不从毁经之论而存疑考证
    rationale: 见曲水议毁经恶之归而不食立志考定根祗以俟后
  - date: '1698'
    title_zh: 别孔传与经文而断古文非伪
    rationale: 据隋志永嘉后犹存经文及都尉朝至梅赜授受不断故以为内外相应不可轻废
- id: guji-毛奇龄-endeavor-2
  title_zh: 博学鸿词入仕讲学著述
  goal_zh: 以经学淹贯群书设教著述以明礼经大义
  phases:
  - key: brewing
    name: 避兵讲求坟典易象
    labels:
      zh: 流离问道
    start_date: '1644'
    highlight_event_id: guji-毛奇龄-event-early-study
  - key: breakthrough
    name: 举博学鸿词授检讨
    labels:
      zh: 入翰林
    start_date: '1679'
    highlight_event_id: guji-毛奇龄-event-hanlin
  - key: climax
    name: 与李塨蔡衍鎤等辩尚书真伪
    labels:
      zh: 论学授业
    start_date: '1697'
    highlight_event_id: guji-毛奇龄-event-yuan-word
  - key: closure
    name: 晚年著述以终
    labels:
      zh: 考礼垂世
    start_date: '1716'
    highlight_event_id: guji-毛奇龄-event-death
  decisions:
  - date: '1679'
    title_zh: 应博学鸿词入翰林
    rationale: 乱定还乡经史亡佚欲以馆阁之力辑佚考礼以存斯文
  - date: '1697'
    title_zh: 与后学辨古文授九声管乐之学
    rationale: 见海外征书废古文之机已决故急为考定以止煽惑
events:
- id: guji-毛奇龄-event-birth
  title_zh: 出生于萧山
  date: '1623'
  year_of: 1623
  description_zh: 明天启三年生于浙江萧山毛氏
- id: guji-毛奇龄-event-early-study
  title_zh: 七岁受尚书闻今古文之分
  date: '1630'
  year_of: 1630
  description_zh: 七岁受尚书问经师今古文之别崇祯十六年闻邹镛张杉等议分今古文取士事遂存疑
- id: guji-毛奇龄-event-hanlin
  title_zh: 举博学鸿词授翰林院检讨
  date: '1679'
  year_of: 1679
  description_zh: 康熙十八年举博学鸿词汇观博学以淹贯群书授翰林院检讨辑经传考礼制
- id: guji-毛奇龄-event-yuan-word
  title_zh: 著成古文尚书冤词八卷
  date: '1698'
  year_of: 1698
  description_zh: 因李塨问乐蔡衍鎤请废古文征海外之疏急为考定分十门辨隋志孔传与经文之别以讼古文之冤
- id: guji-毛奇龄-event-death
  title_zh: 逝世
  date: '1716'
  year_of: 1716
  description_zh: 清康熙五十五年卒留下仲氏易经问等数百卷其古文之辨与阎若璩疏证并存以俟互考
