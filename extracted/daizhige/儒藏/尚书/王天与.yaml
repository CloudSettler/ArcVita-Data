  description: 乙亥冬携纂传初稿偕子振求是正于集斋彭应龙，往复考正十有五年
  place_zh: 江陵
- id: guji-王天与-event-chengshu
  date: 1288-03-01
  year_of: 1288
  title_zh: 尚书纂传四十六卷成
  description: 戊子春仲自识成书，先引汉唐二孔，次收诸家，一以朱子真德秀为归
  place_zh: 安成
- id: guji-王天与-event-shouguan
  date: 1298-01-01
  year_of: 1298
  title_zh: 荐授临江路儒学教授
  description: 为赣州路先贤书院山长时，宪使臧梦解以是书申台省闻于朝，大德二年授临江路儒学教授
  place_zh: 临江路
- id: guji-王天与-event-kanxing
  date: 1310-01-01
  year_of: 1310
  title_zh: 子振锓梓至大本流布
  description: 命子振锓梓刊行，刘辰翁刘坦等为序，吉安经学遂多传本
  place_zh: 吉安
- id: guji-王天与-event-death
  date: 1315-01-01
  year_of: 1315
  title_zh: 卒于家
  description: 刊行后卒于家，乡人私淑其书，垂训来世
  place_zh: 安成梅浦
