  summary_first_person: 吾为安成梅浦王天与，字立大，早岁息意科举，覃思尚书，稽伏生二孔之传，折衷朱真，往复彭翼夫十有五年，成纂传四十六卷，惟愿后学因是窥见圣贤用心
