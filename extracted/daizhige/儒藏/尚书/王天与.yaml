events:
- id: guji-王天与-event-birth
  date: 1240-01-01
  year_of: 1240
  title_zh: 生于吉安安成梅浦
  description: 王天与字立大，生于安成梅浦王氏，少颖脱有场屋声
  place_zh: 安成梅浦
- id: guji-王天与-event-qiuzheng
  date: 1275-01-01
