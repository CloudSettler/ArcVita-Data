    start_date: '1596'
    highlight_event_id: guji-王樵-event-shangshu
  decisions:
  - date: '1575'
    title_zh: 山东乞归后专意劄记
    rationale: 使人如见庶有所入不为空言故以日记自验所进
  - date: '1595-03-01'
    title_zh: 定以蔡传为宗兼采众说
    rationale: 讨论贵求其是采辑不厌于广折衷精当以发明经义切己可用
- id: guji-王樵-endeavor-2
  title_zh: 入仕历官至南右都御史
  summary_zh: 嘉靖丁未进士历官中外以恭简持身晚归讲学经世致用谥恭简
