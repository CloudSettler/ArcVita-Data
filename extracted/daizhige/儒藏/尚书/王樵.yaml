    highlight_event_id: guji-王樵-event-retire
  - key: climax
    name: 官至南京右都御史
    labels:
      zh:
      - 南都风宪
      - 恭简持身
    start_date: '1590'
    highlight_event_id: guji-王樵-event-governor
  - key: closure
    name: 致仕归老谥恭简
