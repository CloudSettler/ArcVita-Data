      - 身后易名
    start_date: '1599'
    highlight_event_id: guji-王樵-event-death
  decisions:
  - date: '1575'
    title_zh: 山东任上乞归养志著书
    rationale: 居千载之下可仰而求有不求未有求而无得者故归而求之
  - date: '1590'
    title_zh: 以经术持风宪不废讲授
    rationale: 修齐治平本于敬明以经中之义理通当世之政事故达顺而守正
