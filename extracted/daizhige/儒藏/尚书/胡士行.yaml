person:
  qid: guji-胡士行
  name_zh: 胡士行
  names:
    zh: 胡士行
    en: Hu Shixing
  lifespan:
    birth:
      date: 1220
      precision: year
      is_circa: true
      raw: 宋庐陵人，生年不详，约十三世纪
    death:
      date: 1290
      precision: year
      is_circa: true
      raw: 卒年不详，约元初
  birth_date: 1220
  death_date: 1290
  era: 宋
  reign_ref: 南宋后期
  archetype: 守正笃实的经学家
  dilemmas:
  - 孔传为主还是尽取新说，守经与存异之间如何权衡
  - 空谈名理还是留心古义训诂，义理与考据如何兼顾
  lesson: 以孔传为宗而博采众说补其未备，防萃成一家之言，方为笃实解经
  summary_first_person: 我是胡士行，庐陵人，官临江军军学教授，我以孔传为主而存异说于后，复采杨时林之奇吕祖谦夏僎诸说补之，不足则以己意解之，绘星辰四图验分至，补太极图释洪范，成尚书详解十三卷，愿以大训垂世
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E8%83%A1%E6%B0%8F%E5%B0%9A%E4%B9%A6%E8%AF%A6%E8%A7%A3.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E8%83%A1%E6%B0%8F%E5%B0%9A%E4%B9%A6%E8%AF%A6%E8%A7%A3.html
endeavors:
- id: guji-胡士行-endeavor-1
  title_zh: 撰述尚书详解十三卷
  summary_zh: 以孔传为主，存异说于后，又引杨时诸家补其未善，不足则以己意解之，并绘图发明历象五行而成一家言
  phases:
  - key: brewing
    name: 博考经籍采摭群言
    labels:
      zh: 研读孔传与诸家说
    start_date: 1260
    highlight_event_id: guji-胡士行-event-professor
  - key: breakthrough
    name: 以孔传为主存异说
    labels:
      zh: 立训传约文申义
    start_date: 1270
    highlight_event_id: guji-胡士行-event-book
  - key: climax
    name: 绘图发明历象五行
    labels:
      zh: 尧典四图洪范太极图
    start_date: 1275
    highlight_event_id: guji-胡士行-event-book
  - key: closure
    name: 书成传世称名互异实为一书
    labels:
      zh: 书集解初学尚书详解即一书
    start_date: 1280
    highlight_event_id: guji-胡士行-event-book
  decisions:
  - date: 1270
    title_zh: 定以孔传为主而存异说于后
    rationale: 孔传宏纲可举而行，未善之处须引杨时林之奇吕祖谦夏僎诸说补之，方能敷畅厥防
  - date: 1275
    title_zh: 增绘星辰四图与太极图
    rationale: 尧典分至须验以星辰伏见，洪范初一曰五行须明生克有本，根据旧说绘图则天人之理粲然
- id: guji-胡士行-endeavor-2
  title_zh: 任临江军军学教授化民成俗
  summary_zh: 居庐陵而官临江军军学教授，以尚书大训教士，明旧章立教化，守经笃实不空谈名理
  phases:
  - key: brewing
    name: 出身庐陵潜心尚书
    labels:
      zh: 留心古义训诂
    start_date: 1250
    highlight_event_id: guji-胡士行-event-birth
  - key: breakthrough
    name: 除授临江军军学教授
    labels:
      zh: 开设学校阐明大猷
    start_date: 1265
    highlight_event_id: guji-胡士行-event-professor
  - key: climax
    name: 以详解授徒明体达用
    labels:
      zh: 孝悌明德亲族和邦
    start_date: 1270
    highlight_event_id: guji-胡士行-event-professor
  - key: closure
    name: 遗书以贻后代好古君子
    labels:
      zh: 有补将来不隐其志
    start_date: 1285
    highlight_event_id: guji-胡士行-event-death
  decisions:
  - date: 1265
    title_zh: 就职军学以经术教士
    rationale: 帝王之制坦然明白，教授之任在明旧章，以尚书轨范示人主与士子，方为有用之学
  - date: 1280
    title_zh: 以己意补诸说未备而传其书
    rationale: 汉晋训诂间有异字如黹紩为绣之类，必留心古义而不但空谈，庶防有补于将来
events:
- id: guji-胡士行-event-birth
  date: 1220
  year_of: 1220
  type: birth
  title_zh: 出生于庐陵
  description: 宋代庐陵人，生年不详，此处系约十三世纪前期，家学尚书，后潜心经训
- id: guji-胡士行-event-professor
  date: 1265
  year_of: 1265
  type: career
  title_zh: 官临江军军学教授
  description: 除授临江军军学教授，开设学校教士，以尚书大训立教，明钦敬明德之防
- id: guji-胡士行-event-book
  date: 1280
  year_of: 1280
  type: career
  title_zh: 撰成尚书详解十三卷
  description: 解经多以孔传为主而存异说于后，孔传未善则引杨时林之奇吕祖谦夏僎补之，复以己意解之，列四图验分至，补太极图释初字，焦竑作书集解，朱彝尊作初学尚书详解，实为一书
- id: guji-胡士行-event-death
  date: 1290
  year_of: 1290
  type: death
  title_zh: 卒于宋元之际
  description: 卒年不详，约在书成之后，其书以笃实解经传世，清乾隆四十六年收入四库 recon 校上称其防萃成一家言
