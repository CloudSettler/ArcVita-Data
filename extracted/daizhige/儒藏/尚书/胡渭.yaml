  birth_date: '1633'
  death_date: '1714'
  era: 清
  reign_ref: 康熙
  archetype: 考据学者
  dilemmas:
  - 面对汉唐旧注与实地山川不合，是从旧说还是据今考正
  - 著述博采群书致卷帙浩繁，是存繁备考还是芟繁取简
  lesson: 穷经必核实地，集众说而断以考据，阙疑而不强解
  summary_first_person: 我名胡渭，字朏明，号东樵，浙江德清人，少治经史，尤留意舆地，随徐乾学参修一统志，与顾祖禹黄仪阎若璩切磋地理，归里卧病三载成禹贡锥指二十卷，以集解辨证明古今山川分合迁徙，康熙乙酉蒙圣祖赐览并赐耆年笃学之褒，一生以考据明圣经为事
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E7%A6%B9%E8%B4%A1%E9%94%A5%E6%8C%87.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E7%A6%B9%E8%B4%A1%E9%94%A5%E6%8C%87.html
endeavors:
- id: guji-胡渭-endeavor-1
  title_zh: 撰述禹贡锥指考定九州山水
  summary_zh: 依经立解，集解辨证兼收，考九州分域河道变迁成二十卷
  phases:
  - key: brewing
    name: 随馆参订积累手记
    labels:
      zh: 积累
    start_date: '1689'
    highlight_event_id: guji-胡渭-event-tongzhi
  - key: breakthrough
    name: 卧病排纂依经立解
    labels:
      zh: 立解
    start_date: '1694'
    highlight_event_id: guji-胡渭-event-zhuanzhu
  - key: climax
    name: 导河九州考成全书
    labels:
      zh: 考成
    start_date: '1697'
    highlight_event_id: guji-胡渭-event-zhuanzhu
  - key: closure
    name: 进呈御览蒙赐匾额
    labels:
      zh: 进呈
    start_date: '1705'
    highlight_event_id: guji-胡渭-event-jincheng
  decisions:
  - date: '1694'
    title_zh: 以集解加辨证分层释经
    rationale: 亚经一字列集解，再亚一字为辨证，使古今得失分明而不混经文
  - date: '1697'
    title_zh: 据今图志考定禹河故道
    rationale: 大伾以下禹河难寻，须据班志水经及历代徙流图求故道，不泥王莽河为禹河
- id: guji-胡渭-endeavor-2
  title_zh: 参修一统志并明辨易图
  summary_zh: 助徐乾学考订舆地，交游顾阎诸家，另著易图明辨正图书之失
  phases:
  - key: brewing
    name: 入幕翻阅图史
    labels:
      zh: 参馆
    start_date: '1685'
    highlight_event_id: guji-胡渭-event-tongzhi
  - key: breakthrough
    name: 洞庭共研地理
    labels:
      zh: 切磋
    start_date: '1689'
    highlight_event_id: guji-胡渭-event-tongzhi
  - key: climax
    name: 著易图明辨
    labels:
      zh: 明辨
    start_date: '1690'
    highlight_event_id: guji-胡渭-event-yitu
  - key: closure
    name: 以舆地之学归于经术
    labels:
      zh: 归经
    start_date: '1705'
    highlight_event_id: guji-胡渭-event-jincheng
  decisions:
  - date: '1689'
    title_zh: 兼采方志水经以证经
    rationale: 地理志水经详载源委，不可舍今泥古，必知古知今方为穷经要诀
  - date: '1690'
    title_zh: 辨图书真伪不附怪诞
    rationale: 山海纬候多涉怪诞不敢言，当摈落勿污圣经，唯据可验证者说经
events:
- id: guji-胡渭-event-birth
  title_zh: 出生于浙江德清
  date: '1633'
  year_of: 1633
  description: 明崇祯六年生于浙江德清，字朏明号东樵
- id: guji-胡渭-event-tongzhi
  title_zh: 参修大清一统志
  date: '1689'
  year_of: 1689
  description: 应大司寇徐乾学之聘翻阅图史参订异同，与顾祖禹黄仪阎若璩晨夕群处讲习地理
- id: guji-胡渭-event-yitu
  title_zh: 著易图明辨
  date: '1690'
  year_of: 1690
  description: 考辨易图之失另著易图明辨，与禹贡锥指并为生平精力所注
- id: guji-胡渭-event-zhuanzhu
  title_zh: 家居撰禹贡锥指
  date: '1697'
  year_of: 1697
  description: 甲戌后家居养病，取手记循环展玩，依经立解历三期成禹贡锥指二十卷
- id: guji-胡渭-event-jincheng
  title_zh: 南巡进呈蒙赐匾额
  date: '1705'
  year_of: 1705
  description: 康熙乙酉恭逢圣祖南巡进禹贡锥指御览，赐耆年笃学匾额
- id: guji-胡渭-event-death
  title_zh: 逝世
  date: '1714'
  year_of: 1714
  description: 清康熙五十三年卒，享年八十二，考据地理之学传于后世
