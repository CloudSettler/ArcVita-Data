  dilemmas:
  - 天人感应多流于阴阳灾异附会我当守正明天人合一之防还是趋时言象数新奇
  - 经注多谶纬术数之说我当驳正注疏自抒心得还是因循旧说
  - 为学当空谈性命还是明体达用以经治事以建皇极而出治
  lesson: 建用皇极守大中之道以经注经经世致用方得圣人立训之要
  summary_first_person: 吾胡瑗字翼之泰州海陵人也生逢北宋盛时笃实为学不务新奇尝讲明洪范九畴以建中出治为本驳正阴阳灾异之附会又设湖学以明体达用教人唯愿后学守大中而行正道
