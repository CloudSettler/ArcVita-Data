  summary_first_person: 吾眉山苏轼，究心经世之学，明于事势，长于议论，以是诠解尚书虞夏之政，于治乱兴亡之故披抉明畅，释尧典之钦明，辨舜典之郊祀，词惟典要，但求词达而已
