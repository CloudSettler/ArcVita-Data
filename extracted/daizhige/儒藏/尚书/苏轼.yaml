  decisions:
  - date: '1095'
    title_zh: 从郑康成以三江为南北中江
    rationale: 远有端绪，虽未详审经文水道，亦存一家之断以待后考
  - date: '1097'
    title_zh: 以祭法疏解舜典六宗为四时寒暑日月星水旱
    rationale: 受终齐政之后所祭皆天神，非人鬼，坛位当以祭法为准，不从曲说改宗为禜
