  - date: '1094'
    title_zh: 谪居岭海发愤注书
    rationale: 以经世之学托于解经，于虞书大政详加论断，不为空言训诂
  - date: '1097'
    title_zh: 坚持词达不尚繁征
    rationale: 解经之体词贵典要，敛万斛源泉之才，但取词达而止
- id: guji-苏轼-endeavor-2
  person_id: guji-苏轼
  title_zh: 考订水道郊祀刑礼特见
  description_zh: 释禹贡三江为南北中江，辨舜典类禋望徧之礼，正康王诰服冕，断吕刑荒度作刑为句
  phases:
  - key: brewing
    name: 远绍康成考求水道
