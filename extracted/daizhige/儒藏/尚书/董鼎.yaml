  dilemmas:
  - 集传宗朱而阙失并存如何补阙而不叛师说
  - 传注盈斥遗珠弃玉如何荟稡归一以成一经
  lesson: 以朱翼朱荟稡成经阙疑折衷以便君心王政之观览
  summary_first_person: 吾鄱阳董鼎字季亨再传私淑朱子以蔡氏集传为宗辑录语录纂注诸家荟稡以成朱子之一经
  source_urls:
