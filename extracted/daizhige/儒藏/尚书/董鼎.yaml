endeavors:
- id: guji-董鼎-endeavor-1
  title_zh: 私淑朱学再传得统
  summary_zh: 从族兄董梦程闻勉斋黄干绪论私淑朱子奠定释经宗旨
  phases:
  - key: brewing
    name: 鄱阳受学
    labels:
      zh: 族兄介轩亲受学于勉斋
    start_date: '1245'
    highlight_event_id: guji-董鼎-event-study
  - key: breakthrough
    name: 再传私淑
    labels:
      zh: 得朱子再传释经多出朱子
    start_date: '1260'
    highlight_event_id: guji-董鼎-event-study
  - key: closure
    name: 立宗守传
    labels:
      zh: 取订定集传为宗以朱为主
    start_date: '1290'
    highlight_event_id: guji-董鼎-event-compile
  decisions:
  - date: '1260'
    title_zh: 从梦程闻绪论而私淑
    rationale: 生也晚道未闻赖族兄亲受学于黄氏故再传获私淑以朱子为归
  - date: '1290'
    title_zh: 以蔡氏集传为宗
    rationale: 集传既为朱子所订定则与自著无异故当守其本而补其阙
- id: guji-董鼎-endeavor-2
  title_zh: 纂辑书传辑录纂注
  summary_zh: 搜辑朱子语录附于蔡传之后增纂诸家发明以成六卷
  phases:
  - key: brewing
    name: 搜辑语录
    labels:
      zh: 辑录朱子语及他书所载朱子语
    start_date: '1295'
    highlight_event_id: guji-董鼎-event-compile
  - key: breakthrough
    name: 增纂诸家
    labels:
      zh: 采诸说相发明者附列于末
    start_date: '1300'
    highlight_event_id: guji-董鼎-event-compile
  - key: climax
    name: 荟稡成经
    labels:
      zh: 防粹以成朱子之一经
    start_date: 1308-12
    highlight_event_id: guji-董鼎-event-preface
  - key: closure
    name: 至大序成
    labels:
      zh: 至大戊申十二月序于鄱阳
    start_date: 1308-12
    highlight_event_id: guji-董鼎-event-preface
  decisions:
  - date: '1295'
    title_zh: 名曰辑录附蔡传之次
    rationale: 补集传阙失恐人疑源出朱子故特引朱子之说以朱翼朱则不以异蔡为嫌
  - date: '1300'
    title_zh: 名曰纂注附辑录之后
    rationale: 推蔡氏所本发其未尽补其不及并间缀鄙见备临政愿治观览
  - date: 1308-12
    title_zh: 纲领凡例定体例
    rationale: 训诂居先释经义次之疏传释音又次之以经文为序以便统宗防元无参稽之劳
