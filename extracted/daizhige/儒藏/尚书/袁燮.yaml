  title_zh: 逝世谥正献
  date: 1224
  year_of: 1224
  place_zh: 鄞县
  description_zh: 卒，谥正献，事迹具宋史本传，子乔甫相继而卒
- id: guji-袁燮-event-kanke
  title_zh: 绍定刊絜斋家塾书钞于象山书院
  date: 1231
  year_of: 1231
  place_zh: 象山书院
  description_zh: 子甫刻伯兄乔所钞家塾书钞十二卷纳诸象山书院，后经永乐大典采辑复显
