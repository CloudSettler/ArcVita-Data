  date: 1195
  year_of: 1195
  place_zh: 鄞县家塾
  description_zh: 平旦集诸生及诸子危坐说书，夜再讲至二鼓，发明本心，子乔手钞至君奭
- id: guji-袁燮-event-xianshi
