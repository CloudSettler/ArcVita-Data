person:
  qid: guji-袁燮
  name_zh: 袁燮
  names:
    zh: 袁燮
    en: Yuan Xie
  lifespan:
    birth:
      date: 1144
      precision: year
      is_circa: false
      raw: 宋绍兴十四年鄞县
    death:
      date: 1224
      precision: year
      is_circa: false
      raw: 宋嘉定十七年
  birth_date: 1144
  death_date: 1224
  era: 南宋
  reign_ref: 宋孝宗淳熙至宋宁宗嘉定
  archetype: 象山心学经师
  dilemmas:
  - 坚持发明本心与恪守章句训诂之间如何持醇正而不流于空疏
  - 家塾讲学传道与出仕守官经世之间如何兼顾本末而不失敬
  lesson: 学问大防在明本心，以敬持己，以诚知人，方能醇正经义而见之行事
  summary_first_person: 我是袁燮，字和叔，自号絜斋，鄞县人，师出陆九渊象山，旦暮集诸生说书，惟发明本心为大防，解尚书虞夏诸篇以儆戒无虞为要，幸得子乔手钞、子甫刊置象山书院以与学者共之
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/
  - https://daizhige.org/xiezhaijiashushuchao.html
endeavors:
- id: guji-袁燮-endeavor-1
  title_zh: 家塾说书发明本心解尚书
  role_zh: 家塾师席讲书者
  summary_zh: 师承象山，每日平旦夜分危坐说书，以本心贯通尧舜禹治迹，由子乔手钞成编
  phases:
  - key: brewing
    name: 从游象山悟本心
    labels:
      zh:
      - 师承问道
    start_date: 1168
    highlight_event_id: guji-袁燮-event-jinshi
  - key: breakthrough
    name: 家塾旦暮危坐说书
    labels:
      zh:
      - 家塾讲学
    start_date: 1190
    highlight_event_id: guji-袁燮-event-jiashu
  - key: climax
    name: 伯兄手钞至君奭成编
    labels:
      zh:
      - 手钞成书
    start_date: 1210
    highlight_event_id: guji-袁燮-event-jiashu
  - key: closure
    name: 子甫绍定刊置象山书院
    labels:
      zh:
      - 刊行传世
    start_date: 1231
    highlight_event_id: guji-袁燮-event-kanke
  decisions:
  - date: 1190
    title_zh: 以明本心为说经大防
    rationale: 吾之本心即古圣之心即天地之心，昏则迷惑，复则光明，故反覆引伸以畅师说
  - date: 1210
    title_zh: 举帝王治迹标举要领
    rationale: 参酌古今以儆戒无虞罔失法度为戒逸尚钦之实，使学者体之于身心政事
- id: guji-袁燮-endeavor-2
  title_zh: 淳熙进士历官至显谟阁学士
  role_zh: 朝臣与经世守官者
  summary_zh: 淳熙辛丑登第，历官守正，以敬辅政，卒谥正献，四库据永乐大典采辑复显
  phases:
  - key: brewing
    name: 淳熙辛丑登进士第
    labels:
      zh:
      - 科第入仕
    start_date: 1181
    highlight_event_id: guji-袁燮-event-jinshi
  - key: breakthrough
    name: 历官守职以民为重
    labels:
      zh:
      - 经世任事
    start_date: 1195
    highlight_event_id: guji-袁燮-event-jiashu
  - key: climax
    name: 官至显谟阁学士
    labels:
      zh:
      - 位显守正
    start_date: 1223
    highlight_event_id: guji-袁燮-event-xianshi
  - key: closure
    name: 卒谥正献遗编复显
    labels:
      zh:
      - 身后显学
    start_date: 1224
    highlight_event_id: guji-袁燮-event-death
  decisions:
  - date: 1181
    title_zh: 由儒学正途入仕而不废讲学
    rationale: 立为君师为民而设，故官守与家塾并重，皆所以明天理正人心
  - date: 1223
    title_zh: 以醇正持论鉴古今兴亡
    rationale: 议论持醇正方能致危戒逸胜怠如钦，故守法度而不流失
