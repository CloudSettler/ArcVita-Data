  death_date: 1242
  era: 南宋
  reign_ref: 宋宁宗开禧至宋理宗淳祐
  archetype: 宗室儒臣
  dilemmas:
  - 汉儒灾异附会离合九畴与经义本旨之辨
  - 朱陆论皇极分朋讲胜而不预门户之难
  - 有德无位欲以著述经世之志
  lesson: 得其统则九畴可一以贯之，建皇极于君心以致彝伦攸叙
  summary_first_person: 吾赵善湘，字清臣，濮安懿王五世孙，官至资政殿大学士，封文水郡公，赠少师。吾于易学用力至深，见汉儒以五行五事皇极庶征福极合求灾异而余畴散失所统，遂采欧阳修唐志苏洵图论遗意，于开禧三年撰成洪范统一，以皇极为九畴之统，合朱陆之说而不预门户，愿明箕子之传以经世。
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E6%B4%AA%E8%8C%83%E7%BB%9F%E4%B8%80.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E6%B4%AA%E8%8C%83%E7%BB%9F%E4%B8%80.md
endeavors:
- id: guji-赵善湘-endeavor-1
  title_zh: 撰述洪范统一以皇极统九畴
  description_zh: 采欧苏遗意，定皇极为九畴之统，五行五事五纪庶征皆归于统，以正汉儒离合之说，于开禧三年成书。
  phases:
  - key: brewing
    name: 潜心易学涵养洪范本旨
    labels:
      zh:
      - 酝酿涵养
    start_date: 1190
    highlight_event_id: guji-赵善湘-event-birth
  - key: breakthrough
    name: 立皇极居五统摄九畴
    labels:
      zh:
      - 立统破局
    start_date: 1205
    highlight_event_id: guji-赵善湘-event-hongfan
  - key: climax
    name: 开禧三年撰成统一全编
    labels:
      zh:
      - 撰述高峰
    start_date: 1207-09-11
    highlight_event_id: guji-赵善湘-event-hongfan
  - key: closure
    name: 复叙易范相表里垂法后世
    labels:
      zh:
      - 收束垂训
    start_date: 1207-09-11
    highlight_event_id: guji-赵善湘-event-hongfan
  decisions:
  - date: 1205
    title_zh: 不从灾异附会另立统贯之例
    rationale: 汉儒以事应语多傅会而八政五纪三德稽疑离不相属，须废离合之说而求一统
  - date: 1207-09-11
    title_zh: 以大中释皇极而兼取朱陆
    rationale: 朱陆往复各持一说，注疏大中合于陆氏，建极合于朱子，通怀彼我方可显君心运化之用
- id: guji-赵善湘-endeavor-2
  title_zh: 宗室入仕牧民经邦至文水郡公
  description_zh: 以宗室进身，历州郡至资政殿大学士，封文水郡公，以经术饰吏治，持敬用五事协用五纪之道以养民。
  phases:
  - key: brewing
    name: 宗学出身初入仕途
    labels:
      zh:
      - 入仕历练
    start_date: 1190
    highlight_event_id: guji-赵善湘-event-birth
  - key: breakthrough
    name: 历牧州郡以农政养民
    labels:
      zh:
      - 经世牧民
    start_date: 1210
    highlight_event_id: guji-赵善湘-event-service
  - key: climax
    name: 仕至资政殿大学士封文水郡公
    labels:
      zh:
      - 位极儒臣
    start_date: 1240
    highlight_event_id: guji-赵善湘-event-service
  - key: closure
    name: 殁赠少师名载宋史本传
    labels:
      zh:
      - 盖棺定论
    start_date: 1242
    highlight_event_id: guji-赵善湘-event-death
  decisions:
  - date: 1210
    title_zh: 以经术施于八政之养民急务
    rationale: 八政本于天地固有而见于五事敬用，食货祀司空诸务不可阙，须务本以安居
  - date: 1240
    title_zh: 守皇极正直不预门户之争
    rationale: 当世分朋讲胜，介然不预方可持正直刚柔之乂以辅皇极，故以著述明道不以党显
events:
- id: guji-赵善湘-event-birth
  type: birth
  title_zh: 出生为濮安懿王五世孙
  date: 1169
  year_of: 1169
  description_zh: 生于南宋宗室，字清臣，后以宗室进身，于易学用力至深。
- id: guji-赵善湘-event-hongfan
  type: career
  title_zh: 开禧三年撰成洪范统一
  date: 1207-09-11
  year_of: 1207
  description_zh: 于中秋前五日自叙成书，定皇极为九畴之统，谓五行之土五事之思五纪之历数庶征之风皆具统贯，得其统而九畴可一以贯之。
- id: guji-赵善湘-event-service
  type: career
  title_zh: 仕至资政殿大学士封文水郡公
  date: 1240
  year_of: 1240
  description_zh: 历官州郡以经世致用，终至资政殿大学士，封文水郡公，以宗室儒臣显于宁理之朝。
- id: guji-赵善湘-event-death
  type: death
  title_zh: 逝世赠少师载宋史本传
  date: 1242
  year_of: 1242
  description_zh: 殁后赠少师，事迹具宋史本传，所著易说五种不传，洪范统一赖永乐大典缮录复为完编。
