  place_zh: 严州淳安
  description_zh: 宋孝宗淳熙二年生，大父觷靖康捍睦寇金人有奇功，家风魁岸慷慨
- id: guji-钱时-event-study
  kind: career
  title_zh: 受学杨简讲学郡庠
  date: '1225'
  year_of: 1225
  place_zh: 严州徽州绍兴
  description_zh: 从宝谟阁学士杨简游，莅讲郡庠，远近士子翕然云集，著四书管见诗学管见周易释传两汉笔记等
- id: guji-钱时-event-present
  kind: career
  title_zh: 嘉熙进书授秘阁校勘
  date: '1238-09-01'
  year_of: 1238
  place_zh: 严州至临安
  description_zh: 乔行简劄荐，万一荐进家塾尚书演义学诗管见周易释传四书管见两汉笔记共百册，特补迪功郎畀秘阁校勘后迁史馆检阅
- id: guji-钱时-event-compile
  kind: career
  title_zh: 晚年更定融堂书解
  date: '1240'
  year_of: 1240
  place_zh: 淳安融堂
  description_zh: 删削尚书演义旧稿，表章书序，旁搜远绍，更定为融堂书解二十卷，论泰誓牧誓武成康诰洛诰多有卓见
- id: guji-钱时-event-death
  kind: death
  title_zh: 卒后书散见永乐大典
  date: '1244'
  year_of: 1244
  place_zh: 淳安
  description_zh: 卒于淳祐四年，书久尠传本，后据永乐大典散见各韵裒缀编辑厘为二十卷入四库经部
