  dilemmas:
  - 山居守经自隐与应诏出仕经世之间如何两全
  - 墨守注疏与自抒心得之间如何择善而从而不惑曲说
  lesson: 敬以穷经，择善而从，表章常道方能经世致用
  summary_first_person: 我是钱时，字子是，严州淳安人，早年受学于杨简，山居读书，讲学郡庠，演义尚书，嘉熙应诏授秘阁校勘迁史馆检阅，晚年更定融堂书解，愿以尧舜常道发明疑难，有补斯世
