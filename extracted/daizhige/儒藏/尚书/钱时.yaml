endeavors:
- id: guji-钱时-endeavor-1
  title_zh: 表章书序撰融堂书解
  summary_zh: 以书序为纲，参核史记释文集解索隐，博采马融郑氏，择善而从，成尚书演义晚更定为融堂书解二十卷
  phases:
  - key: brewing
    name: 山居穷经立纲
    labels:
      zh: 穷经立说
    start_date: '1200'
    highlight_event_id: guji-钱时-event-study
  - key: breakthrough
    name: 演义进呈得荐
    labels:
      zh: 进书得荐
    start_date: '1238-05-10'
    highlight_event_id: guji-钱时-event-present
  - key: climax
    name: 晚年删削定本
    labels:
      zh: 删削定本
    start_date: '1240'
    highlight_event_id: guji-钱时-event-compile
  - key: closure
    name: 永乐辑佚传世
    labels:
      zh: 辑佚传世
    start_date: '1244'
    highlight_event_id: guji-钱时-event-death
  decisions:
  - date: '1220'
    title_zh: 以书序表章大指
    rationale: 每篇先条大指，逸书则核史记时事释篇题，使常道昭明有统摄
  - date: '1235'
    title_zh: 兼采众说择善而从
    rationale: 不专主一家，如从苏轼论羲和，从孔传论康叔封卫，兼采张九成论康王之诰，以求博而精新而确
  - date: '1240'
    title_zh: 晚年更定演义为书解
    rationale: 删削家塾尚书演义三十册旧稿，更定为融堂书解，以就精约传远
- id: guji-钱时-endeavor-2
  title_zh: 山居讲学应诏校勘
  summary_zh: 受学杨简，讲学严州徽州绍兴，嘉熙二年经乔行简万一荐特补迪功郎授秘阁校勘迁史馆检阅
  phases:
  - key: brewing
    name: 受学慈湖山居
    labels:
      zh: 受学养望
    start_date: '1195'
    highlight_event_id: guji-钱时-event-study
  - key: breakthrough
    name: 郡庠讲学云集
    labels:
      zh: 讲学化俗
    start_date: '1225'
    highlight_event_id: guji-钱时-event-study
  - key: climax
    name: 丞相荐授校勘
    labels:
      zh: 应诏入仕
    start_date: '1238-05-10'
    highlight_event_id: guji-钱时-event-present
  - key: closure
    name: 进书百册检阅史馆
    labels:
      zh: 进书任职
    start_date: '1238-09-01'
    highlight_event_id: guji-钱时-event-present
  decisions:
  - date: '1225'
    title_zh: 莅讲郡庠发明疑难
    rationale: 辨析义理参错事物，起发士子，以有用之学矫袭秦之弊而望三代之治
  - date: '1238-05-10'
    title_zh: 应乔行简荐赴阙进书
    rationale: 既承大臣知荐，又有经世之志，不终老山林，取所著百册缮写进御以备采择
  - date: '1238-09-01'
    title_zh: 受迪功郎就秘阁史馆之职
    rationale: 以校勘检阅正经籍得失，使所蕴有补斯世，不徒守陈言
events:
- id: guji-钱时-event-birth
