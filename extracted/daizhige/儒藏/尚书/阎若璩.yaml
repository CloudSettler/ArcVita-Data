  dilemmas:
  - title_zh: 信古还是证古
    description: 对奉为定本的晚出孔传古文尚书，是曲徇唐疏旧说还是引经据古条分缕析抉其罅漏
  - title_zh: 应征还是守学
    description: 康熙己未荐举博学鸿词，是赴征入仕还是辞疾家居专心疏证著述
  lesson: 考据当引经据古反复磨勘，不以众信废疑，不以孤证明伪，平心易气以复古学
  summary_first_person: 吾字百诗太原人徙居山阳，少读尚书即疑古文，穷三十余年考篇数文辞历象授受之矛盾，列一百二十八条著为疏证，愿后学不以唐人义疏为可安
