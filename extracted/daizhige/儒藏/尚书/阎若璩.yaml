  decisions:
  - date: 1679
    title_zh: 辞博学鸿词之荐
    rationale: 不赴征召以全心考经证史，避免仕宦羁绊中断辨伪大业
  - date: 1680
    title_zh: 先刊初稿四卷以就正
    rationale: 引经据古一一陈矛盾，不待全书告成，先求通人如黄宗羲序正流传
- id: guji-阎若璩-endeavor-2
  title_zh: 潜丘札记考据授徒
  description: 以札记附见旁文，辨名物历律地理，守山阳讲学以传考证之法
  phases:
  - key: brewing
    name: 徙居山阳潜心群经
    labels:
