  decisions:
  - date: 1690
    title_zh: 存旁论于疏证不删
    rationale: 恐潜丘札记不传，故附见卷帙，虽嫌支蔓而存考证条理以惠后学
  - date: 1699
    title_zh: 存前说虽自驳不改
    rationale: 仿郑注用鲁诗后不追改之意，留存论证曲折使学者见求真之迹
