  date: '1245'
  year_of: 1245
  title_zh: 或问独存著录四库
  description: 集传久佚独或问二卷存世清乾隆三十九年收入钦定四库全书经部
- id: guji-陈大猷-event-death
  date: '1265'
  year_of: 1265
  title_zh: 卒于南宋晚期
  description: 卒年不详约卒于理宗景定度宗咸淳之间与都昌陈大猷受学双峰者非一人
