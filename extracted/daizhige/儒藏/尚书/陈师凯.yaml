    start_date: 1321-04-06
    highlight_event_id: guji-陈师凯-event-complete
  decisions:
  - date: 1320
    title_zh: 主回护注文不主攻驳
    rationale: 如孔颖达正义主发挥注文故歧误不复纠正但节取所长
  - date: 1321-04-06
    title_zh: 为初学小子设不为通人道
    rationale: 本传未晓不宜游目广览故先通本传次及辑录纂注
- id: guji-陈师凯-endeavor-2
  title_zh: 考订名物度数与审音
  summary: 释天文地理律历礼乐兵刑河图洛书性命官职封建及隐字审音博搜备录期至于通
  phases:
  - key: brewing
