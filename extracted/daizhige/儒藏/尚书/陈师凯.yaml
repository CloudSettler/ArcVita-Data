  lesson: 为初学设旁通先定本传再及纂注权度在我而不惑
  summary_first_person: 吾家彭蠡自题东汇泽见董氏辑录纂注羽翼蔡传而初学茫无畔岸故于至治辛酉撰旁通六卷专释传文片言只字博引名物度数量求通而止以俟知者
