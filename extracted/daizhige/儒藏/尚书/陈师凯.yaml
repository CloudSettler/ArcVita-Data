      - 立例
    start_date: 1320
    highlight_event_id: guji-陈师凯-event-study
  - key: climax
    name: 至治辛酉四月成书作序
    labels:
      zh:
      - 成书
    start_date: 1321-04-06
    highlight_event_id: guji-陈师凯-event-complete
  - key: closure
