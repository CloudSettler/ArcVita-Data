  - key: climax
    name: 成引用书目与尧典至费誓审音
    labels:
      zh:
      - 编定
    start_date: 1321-04-06
    highlight_event_id: guji-陈师凯-event-complete
  - key: closure
    name: 以旁搜备录助融会贯通
    labels:
      zh:
      - 助读
    start_date: 1321-04-06
    highlight_event_id: guji-陈师凯-event-complete
  decisions:
  - date: 1320
    title_zh: 道德性命已明者略衍名物度数太简者详究
    rationale: 使转瞩即得微疑易释大义易畅无嗫嚅龃龉之患
  - date: 1321-04-06
    title_zh: 不厌琐碎旁搜备录
    rationale: 片言只字当寻绎考训者必期至于通而后止
