  decisions:
  - date: 1600
    title_zh: 专攻引经注经不照应三条
    rationale: 粤若来懋字正人三处前后显相矛盾最见蔡氏疏略故先揭之以立考订纲领
  - date: 1605
    title_zh: 直录注语不加论断
    rationale: 存蔡传原文比勘异同使读者自见得失免增臆断之辞以守实录之体
  - date: 1610
    title_zh: 以同字异解为大宗比勘
    rationale: 一字数义分疏虽嫌过严然训诂异词最易见矛攻盾之失故广搜三百余条以备稽考
- id: guji-陈泰交-endeavor-2
  title_zh: 注考成书著录与名实流传
  summary: 尚书注考一卷成于万历嘉兴府志著录项皋谟称引后经义考误作泰来四库馆臣据府志辨正
