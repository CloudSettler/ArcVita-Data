    start_date: 1630
    highlight_event_id: guji-陈泰交-event-death
  decisions:
  - date: 1615
    title_zh: 以尚书注考名篇单行
    rationale: 不作全经疏解独为考订之作使蔡传得失一目了然便于学者覆勘
  - date: 1620
    title_zh: 听任府志与友朋称引存名
    rationale: 以国子监生不求仕进惟以著述寄托经术故籍府志与同门之口以传其书
