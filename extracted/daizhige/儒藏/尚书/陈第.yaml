      zh: 辨伪守古
    start_date: '1600'
    highlight_event_id: guji-陈第-event-guyin
  - key: closure
    name: 尚书疏衍付梓并行
    labels:
      zh: 付梓垂训
    start_date: 1612-11
    highlight_event_id: guji-陈第-event-shangshu
  decisions:
  - date: '1600'
    title_zh: 不从宋元疑古而笃信古文
    rationale: 谓古文辞义精绝纯粹可征实用疑古者徒以文体訾迹不足废经
  - date: 1612-11
    title_zh: 以深思所得附著成疏衍付梓
    rationale: 欲使典谟训诰皆征行事冀修己治人者有取于经
