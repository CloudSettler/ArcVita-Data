    en: Ma Mingheng
  lifespan:
    birth:
      date: '1490'
      precision: year
      is_circa: true
      raw: 以正德丁丑进士逆推约生于成化弘治间莆田
    death:
      date: '1545'
      precision: year
      is_circa: true
      raw: 嘉靖壬寅成书后废弃而卒卒年不详约计
  birth_date: '1490'
  death_date: '1545'
  era: 明
  reign_ref: 明世宗嘉靖
  archetype: 直谏经师
  dilemmas:
  - 从蔡传以求稳妥还是存疑于心以求是正
  - 附和新局以保禄位还是惓惓故君以直道获罪
  - 宗蔡清旧学以合流俗还是受业阳明以开闽中王学
  lesson: 于所明而无疑者从之有所疑而不敢苟从则录以求正是经师之诚守道不附和虽废弃而不愧
  summary_first_person: 余马明衡字子萃莆田人正德丁丑进士官至监察御史受业阳明先生嘉靖三年与朱淛力争大礼遂终身废弃凡于所明而无疑者从蔡氏有所疑而不敢苟从者辄录为尚书疑义六卷以俟君子正之
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E5%B0%9A%E4%B9%A6/%E5%B0%9A%E4%B9%A6%E7%96%91%E4%B9%89.html
endeavors:
- id: guji-马明衡-endeavor-1
  title_zh: 监察直谏守正废弃
  summary: 正德登科任御史嘉靖初以兴国太后贺仪及大礼事与朱淛力争不附和新局几殆获罪终身废弃
  phases:
  - key: brewing
    name: 登科任御史
    labels:
      zh: 酝酿
    start_date: '1517'
    highlight_event_id: guji-马明衡-event-jinshi
  - key: climax
    name: 嘉靖三年力争
    labels:
      zh: 高潮
    start_date: '1524'
    highlight_event_id: guji-马明衡-event-jianzheng
  - key: closure
    name: 获罪废弃终身
    labels:
      zh: 收束
    start_date: '1525'
    highlight_event_id: guji-马明衡-event-jianzheng
  decisions:
  - date: '1524'
    title_zh: 争慈寿皇太后诞辰免朝及尊所生薄所后事
    rationale: 以经术守名分不以盈庭附和为然惓惓故君故与朱淛并力以争
  - date: '1525'
    title_zh: 不改守道废弃不复出
    rationale: 知时局已定不以门户进退易其所守甘以废弃全其经术之节
- id: guji-马明衡-endeavor-2
  title_zh: 著述尚书疑义以存疑求是
  summary: 受业王守仁后研究古义于尚书不主一家参酌众说嘉靖壬寅成书六卷论历数中星闰法文祖诸义四库称其醇驳互存而不掩其瑜
  phases:
  - key: brewing
    name: 受业阳明研经
    labels:
      zh: 酝酿
    start_date: '1520'
    highlight_event_id: guji-马明衡-event-jinshi
  - key: breakthrough
    name: 嘉靖壬寅成书
    labels:
      zh: 突破
    start_date: '1542-11-01'
    highlight_event_id: guji-马明衡-event-chengshu
  - key: closure
    name: 醇驳互存传世
    labels:
      zh: 收束
    start_date: '1542-11-01'
    highlight_event_id: guji-马明衡-event-chengshu
  decisions:
  - date: '1542-11-01'
    title_zh: 从蔡氏于所明录疑于所疑
    rationale: 窃以为不得圣人之心而徒求字句之通则失之远故疑金縢三江文祖诸节以引其端俟君子正之
  - date: '1542-11-01'
    title_zh: 以心与理折衷文祖为舜之祖
    rationale: 以纲常大义反诸吾心不据旧说而决告祖摄政之礼必以舜祖为重方合圣人至公之心
events:
- id: guji-马明衡-event-birth
  date: '1490'
  year_of: 1490
  title_zh: 生于福建莆田
  description: 字子萃生于莆田闽中学者多宗蔡清后独受业王守仁开闽中王学之始
  is_circa: true
- id: guji-马明衡-event-jinshi
  date: '1517'
  year_of: 1517
  title_zh: 正德丁丑登进士官监察御史
  description: 正德十二年丁丑登进士列官至监察御史以经术自持见重于时
- id: guji-马明衡-event-jianzheng
  date: '1524'
  year_of: 1524
  title_zh: 嘉靖三年偕朱淛力争获罪废弃
  description: 世宗尊所生薄所后于兴国太后诞节命妇入贺而慈寿诞辰反免朝盈庭附和而明衡与朱淛力争构祸几殆坐是终身废弃
- id: guji-马明衡-event-chengshu
  date: '1542-11-01'
  year_of: 1542
  title_zh: 嘉靖壬寅十一月朔尚书疑义成书
  description: 自序凡于所明而无疑者从蔡氏有所疑而不敢苟从者辄录为篇凡六卷论六宗五瑞洪范日月金縢文祖历象授时闰法诸义
- id: guji-马明衡-event-death
  date: '1545'
  year_of: 1545
  title_zh: 废弃后卒于家
  description: 自嘉靖三年废弃不复起用卒于莆田史称不愧于经术事迹附见明史朱淛传
  is_circa: true
