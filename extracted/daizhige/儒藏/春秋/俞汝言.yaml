  decisions:
  - date: 1676
    title_zh: 以渐川诸生自署勤学
    rationale: 以好学深思立身不与腹高谈者同故署渐川诸生以示谦勤
  - date: 1676
    title_zh: 兼治宰相列卿年表与诗文
    rationale: 经史明典相资经义考赖以存名故经史诗文并进不独治春秋
