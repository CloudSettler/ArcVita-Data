  decisions:
  - date: 1676
    title_zh: 不入臆测一语务得其平
    rationale: 圣人笔削合人情宜时势矜奇异众者皆与圣人远故其言足录不以人弃不足录不以人存
  - date: 1676
    title_zh: 多引旧文自立论无几
    rationale: 自孙复攻三传相高穿凿烦碎元后尊胡传牵就附合张岐然作平文去取未允故简汰精审不以多生新解为长
- id: guji-俞汝言-endeavor-2
  title_zh: 研精经史博通明代典故
  summary_zh: 研精经史尤熟明代典故撰宰相列卿年表诗古文名渐川集好学深思异于腹高谈
  phases:
  - key: brewing
