person:
  qid: guji-俞汝言
  name_zh: 俞汝言
  names:
    zh: 俞汝言
    en: Yu Ruyan
  lifespan:
    birth:
      date: '1670'
      precision: year
      is_circa: true
      raw: 清初秀水人，生年不詳，據康熙丙辰春秋平義脫稿推約壯年
    death:
      date: '1740'
      precision: year
      is_circa: true
      raw: 晚年失明口授成書，卒年不詳，約乾隆初
  birth_date: '1670'
  death_date: '1740'
  era: 清康熙至乾隆間
  reign_ref: 康熙丙辰
  archetype: 經學糾謬者
  dilemmas:
  - 尊聖褒貶與僭分越禮之辨
  - 執理明義與迂闊失實之衡
  lesson: 去尊僭執迂尚異億測稱美摘瑕六弊而後可讀春秋，立義正大持論簡明
  summary_first_person: 余秀水俞汝言，見六經不明諸儒亂之，公穀胡氏以名稱褒貶言春秋，偏駁者半，故先纂集諸家自為一書，以四傳糾正為六端該之，康熙丙辰春秋平義脫稿，是歲之夏復續作此書以綜括大防，晚年失明口授而成，願學者去六弊而讀經
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E5%9B%9B%E4%BC%A0%E7%BA%A0%E6%AD%A3.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E5%9B%9B%E4%BC%A0%E7%BA%A0%E6%AD%A3.html
endeavors:
- id: guji-俞汝言-endeavor-1
  title_zh: 纂集諸家撰春秋平義
  description_zh: 不揣纂集諸家自為一書，康熙丙辰春秋平義始脫稿，欲正王輔嗣鄭康成公穀胡氏亂經之失
  phases:
  - key: brewing
    name: 習見諸儒亂經
    labels:
      zh: 醞釀
    start_date: '1700-01-01'
    highlight_event_id: guji-俞汝言-event-1
  - key: breakthrough
    name: 得程朱正纰繆之法
    labels:
      zh: 突破
    start_date: '1710-01-01'
    highlight_event_id: guji-俞汝言-event-1
  - key: climax
    name: 丙辰平義脫稿
    labels:
      zh: 高潮
    start_date: '1716-01-01'
    highlight_event_id: guji-俞汝言-event-1
  - key: closure
    name: 續作糾正以綜括
    labels:
      zh: 收束
    start_date: '1716-06-01'
    highlight_event_id: guji-俞汝言-event-2
  decisions:
  - date: '1716-01-01'
    title_zh: 先立平義以定經旨
    rationale: 易有本義禮有通解而春秋是非未定，故先纂集自為一書以見大指
  - date: '1716-06-01'
    title_zh: 續作糾正以鍼石前賢
    rationale: 六者之弊去而後可以讀春秋，故復續作此書聊以志願學
- id: guji-俞汝言-endeavor-2
  title_zh: 作春秋四傳糾正區為六類
  description_zh: 摘列春秋三傳及胡安國傳之失隨事辨正，區為尊聖忘僭執理近迂尚異鄰鑿億測涉誣稱美失實摘瑕傷刻六類，末附春王正月辨
  phases:
  - key: brewing
    name: 摘列三傳胡傳之失
    labels:
      zh: 醞釀
    start_date: '1716-06-01'
    highlight_event_id: guji-俞汝言-event-2
  - key: breakthrough
    name: 立六端以該群失
    labels:
      zh: 突破
    start_date: '1716-07-01'
    highlight_event_id: guji-俞汝言-event-2
  - key: climax
    name: 隨事辨正申周正改時說
    labels:
      zh: 高潮
    start_date: '1716-08-01'
    highlight_event_id: guji-俞汝言-event-2
  - key: closure
    name: 失明口授全書告成
    labels:
      zh: 收束
    start_date: '1730-01-01'
    highlight_event_id: guji-俞汝言-event-3
  decisions:
  - date: '1716-07-01'
    title_zh: 以六類綜括大防
    rationale: 左氏公穀胡氏疵類不少，須以尊僭迂鑿誣實刻六端該之方能治經
  - date: '1730-01-01'
    title_zh: 口授成書不廢辨正
    rationale: 晚年失明猶堅持隨事辨正春王正月日食諸條，以存治春秋藥石
events:
- id: guji-俞汝言-event-birth
  date: '1670-01-01'
  year_of: 1670
  title_zh: 出生於秀水
  description_zh: 清初浙江秀水人，生年不詳，約生於康熙初年，漸川諸生
- id: guji-俞汝言-event-1
  date: '1716-01-01'
  year_of: 1716
  title_zh: 康熙丙辰春秋平義脫稿
  description_zh: 康熙丙辰歲春秋平義始脫稿，纂集諸家自為一書以正諸儒亂經
- id: guji-俞汝言-event-2
  date: '1716-06-01'
  year_of: 1716
  title_zh: 夏續作春秋四傳糾正
  description_zh: 是歲之夏復續作此書以綜括大防，摘三傳胡傳之失區為六類，末附春王正月辨明周正改時改月
- id: guji-俞汝言-event-3
  date: '1730-01-01'
  year_of: 1730
  title_zh: 晚年失明口授成書
  description_zh: 相傳其晚年失明口授而成之者，仲夏下澣漸川諸生自識其志在去六弊而讀春秋
- id: guji-俞汝言-event-death
  date: '1740-01-01'
  year_of: 1740
  title_zh: 卒於乾隆初
  description_zh: 卒年不詳約在乾隆初，後乾隆四十二年四月四庫提要稱其立義正大持論簡明為治春秋藥石
