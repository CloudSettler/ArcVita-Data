      raw: 清初秀水
      precision: dynasty
      is_circa: true
    death:
      raw: 清康熙后
      precision: dynasty
      is_circa: true
  era: 清
  reign_ref: 康熙
  archetype: 经学家
  dilemmas:
  - 传经之失不在浅而在于深春秋为甚如何务得其平而不入臆测
  - 宋人攻三传求驾先儒与元后尊胡传求利于科举两弊并生如何简汰精审多得经意
  lesson: 知圣人不远于人人亦不远人以求道而学术一则天下平不独春秋然也
  summary_first_person: 吾秀水俞汝言字右吉泛澜春秋诸家初茫然再亲则华文可喜数四读而得指归圣人笔削合乎人情宜乎时势未尝矜奇于是偏访著述辑成平义十二卷皆出儒先不入臆测务得其平而已
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E5%B9%B3%E4%B9%89.md
