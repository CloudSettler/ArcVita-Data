  - key: breakthrough
    name: 知制诰直经筵奉使
    labels:
      zh:
      - 经筵奉使
    start_date: 1055
    highlight_event_id: guji-刘敞-event-mission
  - key: climax
    name: 以经术议礼论政成名
    labels:
      zh:
      - 经世议礼
    start_date: 1064
    highlight_event_id: guji-刘敞-event-zhushu
  - key: closure
    name: 晚年守郡卒于京师
    labels:
      zh:
      - 守郡考终
    start_date: 1068
    highlight_event_id: guji-刘敞-event-death
  decisions:
  - date: 1055
    title_zh: 奉使契丹不辱君命
    rationale: 以礼自显定其位长世保民，化俗守信不可轻失国体
  - date: 1060
    title_zh: 以春秋大义参议朝政
    rationale: 王者赏罚当其功罪，纪纲失则赏罚不明，须托正名分以救时弊
events:
- id: guji-刘敞-event-birth
  date: 1019
  year_of: 1019
  title_zh: 生于临江新喻
  description_zh: 宋真宗天禧三年生，字原父，与弟刘攽俱以博学知名
- id: guji-刘敞-event-jinshi
  date: 1046
  year_of: 1046
  title_zh: 庆历六年进士及第
  description_zh: 登进士第为扬州观察推官，召试学士院为集贤校理判考功，始专治七经及春秋
- id: guji-刘敞-event-mission
  date: 1055
  year_of: 1055
  title_zh: 知制诰奉使契丹
  description_zh: 历知制诰直集贤院，奉使契丹，归而名益重，研求春秋运意深曲
- id: guji-刘敞-event-zhushu
  date: 1064
  year_of: 1064
  title_zh: 春秋权衡意林成稿
  description_zh: 著成春秋权衡十七卷春秋传十五卷，复为春秋意林二卷随笔札记，多遗阙而微言灼然
- id: guji-刘敞-event-death
  date: 1068
  year_of: 1068
  title_zh: 熙宁元年卒
  description_zh: 出知永兴汝潞诸州后卒于京师，其春秋之学经叶梦得吴莱等推阐而传于后世
