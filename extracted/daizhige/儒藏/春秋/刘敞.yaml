  dilemmas:
  - 守汉唐章句旧说以求安稳还是抉微言大义以正名分辨嫌疑
  - 意林属稿未竟文多阙略当藏诸家还是付传以俟后贤成之
  lesson: 苦志研求以明圣人之意，正名分别嫌疑，虽文体艰深而大义灼然
  summary_first_person: 吾刘敞字原父，临江人，毕生苦志研求春秋，著权衡断疑，著意林抉微，贵本重名分，虽属稿未竟而圣人之微言灼然，愿后人熟读深思而存其大义
