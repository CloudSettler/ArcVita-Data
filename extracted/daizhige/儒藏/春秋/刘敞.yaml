endeavors:
- id: guji-刘敞-endeavor-1
  title_zh: 春秋三书研撰抉微
  summary_zh: 研治春秋左氏公羊穀梁，著春秋权衡十七卷春秋传十五卷及春秋意林二卷，随笔札记以明褒贬名分
  phases:
  - key: brewing
    name: 少年博学苦志研经
    labels:
      zh:
      - 研经积累
    start_date: 1046
    highlight_event_id: guji-刘敞-event-jinshi
  - key: breakthrough
    name: 作权衡以断诸传是非
    labels:
      zh:
      - 立说断疑
    start_date: 1055
    highlight_event_id: guji-刘敞-event-mission
  - key: climax
    name: 作意林以抉经文微言
    labels:
      zh:
      - 抉微成书
    start_date: 1064
    highlight_event_id: guji-刘敞-event-zhushu
  - key: closure
    name: 属稿未竟以待后贤
    labels:
      zh:
      - 未竟留阙
    start_date: 1068
    highlight_event_id: guji-刘敞-event-death
  decisions:
  - date: 1055
    title_zh: 弃章句旧说别立权衡
    rationale: 不知经者以其难入，须正名分别嫌疑以显圣人之意，不可牵合传注
  - date: 1064
    title_zh: 以札记随笔存意林阙文
    rationale: 经文数字或仅标不置一词，宁存阙略不强为解，以俟熟读深思者得之
- id: guji-刘敞-endeavor-2
  title_zh: 馆阁经筵仕宦经世
  summary_zh: 庆历进士历集贤校理知制诰，直经筵奉使契丹，出守永兴汝潞诸州，以经术文章名重一时
  phases:
  - key: brewing
    name: 进士及第入馆阁校理
    labels:
      zh:
      - 入仕馆阁
