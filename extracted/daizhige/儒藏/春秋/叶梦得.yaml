    rationale: 文武之道未坠于地，当以所学见于用，而以余力明经以垂万世
  - date: 1138-01-01
    title_zh: 以春秋天事立万世常法
    rationale: 三纲既坏，不以一时之权济乱，而举常道揭示天下使昭然如日月
