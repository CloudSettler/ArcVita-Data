    title_zh: 先谳后考再传以序为学
    rationale: 不难攻人失而难正己是非，必先正三家之过，再立可信之制，而后可观传
  - date: 1140-01-01
    title_zh: 不录经文而列统论十二公
    rationale: 考为发明之义疏，当论次周典以求合春秋之法，而仍旧例不杂经文
