  archetype: 通经考制之儒臣
  dilemmas:
  - 得失相偶，是非相反，未有所得而遽攻人失，则纷乱学者之听，当先正己再正人
  - 去古既远，先王典籍残缺，三传异说各蔽一偏，当博求周典而慎择以明春秋天事
  lesson: 多闻多见而慎择其善，论次先王之制以合春秋，则经义自明而不惑于臆说
  summary_first_person: 我本吴县叶氏，慨春秋不明而三传汨之，乃博求周官礼制，论次可信不疑者为考三十卷，又推之为传为谳，愿以圣人之道先王之制，免惑于后世
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=619480
  - https://github.com/daizhige-org/daizhigev20
