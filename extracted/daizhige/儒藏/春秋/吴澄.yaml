endeavors:
- id: guji-吴澄-endeavor-1
  title_zh: 纂言春秋考订七纲例目
  summary: 采摭三传诸家注疏仿陆淳纂例分天道人纪嘉宾军凶吉七篇以正经文阙误
  phases:
  - key: brewing
    name: 隐居草庐博览三传
    labels:
      zh: 积学候时
    start_date: 1279
    highlight_event_id: guji-吴澄-event-birth
  - key: breakthrough
    name: 仿纂例立总例七纲
    labels:
      zh: 立纲创例
    start_date: 1305
    highlight_event_id: guji-吴澄-event-ruchao
  - key: climax
    name: 完成春秋纂言十二卷总例七卷
    labels:
      zh: 成书示学
    start_date: 1317
    highlight_event_id: guji-吴澄-event-zhuanchunqiu
  - key: closure
    name: 付徒传抄谕取长舍短
    labels:
      zh: 传付后学
    start_date: 1330
    highlight_event_id: guji-吴澄-event-zhuanchunqiu
  decisions:
  - date: 1305
    title_zh: 不蹈袭而闇合五礼创天道人纪二例
    rationale: 以礼失则书出礼入法浑浑如天道故首明天道以统岁时月日
  - date: 1317
    title_zh: 割裂经文分经附传各丽其例
    rationale: 为分所异合所同使事实辞文善恶毕见虽阙文补空亦存其义
- id: guji-吴澄-endeavor-2
  title_zh: 出仕元廷讲学授经
  summary: 应辟为国子司业翰林学士经筵进讲授徒江西以草庐之学兼金溪新安之传
  phases:
  - key: brewing
    name: 乐安著述授徒不仕
    labels:
      zh: 讲道山林
    start_date: 1285
