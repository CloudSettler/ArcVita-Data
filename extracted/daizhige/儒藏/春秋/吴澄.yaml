  - key: climax
    name: 经筵进讲纂修五经纂言
    labels:
      zh: 经筵敷经
    start_date: 1317
    highlight_event_id: guji-吴澄-event-zhuanchunqiu
  - key: closure
    name: 引退南归专事著述
    labels:
      zh: 归老著书
    start_date: 1325
    highlight_event_id: guji-吴澄-event-death
  decisions:
  - date: 1309
    title_zh: 受元辟出山以行圣学
    rationale: 思以经术致君泽民不以改朝而废道统之传
  - date: 1325
    title_zh: 辞官南归终老草庐
    rationale: 年高志在成书立教故归乡讲学以全晚节
