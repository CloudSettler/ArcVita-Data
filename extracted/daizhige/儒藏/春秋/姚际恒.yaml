  archetype: 辨伪经学家
  dilemmas:
  - title_zh: 舍传从经还是舍经从传
    description: 世人附形左氏顷刻不可离，我若束传究经则孤行招訾，不破则圣旨愈隐
  - title_zh: 立例求褒贬还是直书见善恶
    description: 例与常事不书深入肺腑，我若埽尽群例标取义书法，则尽废旧说而自任其咎
  lesson: 舍传从经，据事直书，不以例绳经，不以微言罗织成罪
  summary_first_person: 吾新安首源姚际恒，发愤从事春秋，大破三传积习，独抱遗经究终始，分别取义书法与鲁史旧文，冀复圣人尊周明法之衷
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E9%80%9A%E8%AE%BA.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E9%80%9A%E8%AE%BA.md
endeavors:
- id: guji-姚际恒-endeavor-1
  title_zh: 著春秋通论破例明义
  summary: 埽荡例与常事不书之说，标取义书法二端，孤行一经以明春秋大义
  phases:
  - key: brewing
    name: 遍读三传起疑积愤
    labels:
      zh:
      - 读经
      - 疑传
    start_date: 1680
    highlight_event_id: guji-姚际恒-event-1
  - key: breakthrough
    name: 悟取义在窃取与书法在圣笔
    labels:
      zh:
      - 取义
      - 书法
    start_date: 1700
    highlight_event_id: guji-姚际恒-event-1
  - key: climax
    name: 成春秋通论前后贯穿
    labels:
      zh:
      - 著述
      - 孤行一经
    start_date: 1707-07
    highlight_event_id: guji-姚际恒-event-2
  - key: closure
    name: 附春秋无例详考大声疾呼
    labels:
      zh:
      - 无例
      - 示后
    start_date: 1707-07
    highlight_event_id: guji-姚际恒-event-2
  decisions:
  - date: 1700
    title_zh: 定舍传从经之志
    rationale: 三传纰缪滋多，左氏叙事亦多失实，不舍传不足以从经
  - date: 1707-07
    title_zh: 以取义书法分别新旧文成编
    rationale: 不标取义书法则混圣笔于旧史，不得不别新意以彰圣衷
- id: guji-姚际恒-endeavor-2
  title_zh: 辨伪群经考订诗书
  summary: 著古今伪书考与诗经通论等，正周礼考礼制，辨后人枉撰无稽之言
  phases:
  - key: brewing
    name: 以春秋正左兼及他经
    labels:
      zh:
      - 考据
      - 正传
    start_date: 1690
    highlight_event_id: guji-姚际恒-event-1
  - key: breakthrough
    name: 悟小事不书以通史法
    labels:
      zh:
      - 史法
      - 辨伪
    start_date: 1700
    highlight_event_id: guji-姚际恒-event-1
  - key: climax
    name: 成古今伪书考诗经通论
    labels:
      zh:
      - 伪书考
      - 诗经通论
    start_date: 1705
    highlight_event_id: guji-姚际恒-event-1
  - key: closure
    name: 以左正他经以经正左传
    labels:
      zh:
      - 互正
      - 存周礼
    start_date: 1710
    highlight_event_id: guji-姚际恒-event-2
  decisions:
  - date: 1705
    title_zh: 专标确证不妄标臆度
    rationale: 取义必真确无疑灼然共信，不敢穿凿以失圣人正大谨严之意
  - date: 1710
    title_zh: 存春秋所书记周礼大端
    rationale: 鲁君礼事即周礼所存，不可以非礼书之妄说没其千百什一
events:
- id: guji-姚际恒-event-birth
  title_zh: 生于徽州歙县首源
  date: 1647
  year_of: 1647
  description: 清顺治四年生于新安歙县，字立方又字首源，少治经学
- id: guji-姚际恒-event-1
  title_zh: 发愤考订群经辨伪
  date: 1700
  year_of: 1700
  description: 遍观三传宋明诸家，深病例与褒贬常事不书之说，始以取义书法求圣衷，兼考伪书诗经
- id: guji-姚际恒-event-2
  title_zh: 自识成春秋通论
  date: 1707-07
  year_of: 1707
  description: 康熙四十六年丁亥秋七月自识，言束五传独抱遗经，前后起应首尾贯穿，附无例详考以醒世
- id: guji-姚际恒-event-death
  title_zh: 卒于康熙年间
  date: 1715
  year_of: 1715
  description: 康熙五十四年卒，一生孤行一经，质诸圣人无罪，世有訾者弗恤
