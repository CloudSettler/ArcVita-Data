person:
  qid: guji-姜宝
  name_zh: 姜宝
  names:
    zh: 姜宝
    en: Jiang Bao
  lifespan:
    birth:
      date: '1514'
      precision: year
      is_circa: true
      raw: 明正德九年左右
    death:
      date: '1591'
      precision: year
      is_circa: true
      raw: 明万历十九年左右
  birth_date: '1514'
  death_date: '1591'
  era: 明代
  reign_ref: 嘉靖
  archetype: 经师传道型
  dilemmas:
  - 以胡传为本以应制举还是自出己意以求圣心之至当
  - 以一字一句求褒贬予夺还是以直书实事见是非善恶
  - 以褒讥施于君父以示笔削之权还是以明伦垂教为本不敢僭议君父
  lesson: 直书实事而义自见，不以一字求予夺，不以贬绝施于君父，方得春秋经世之大防
  summary_first_person: 吾丹阳姜宝，字廷善，号凤阿，少由业诗改业春秋，从晋陵唐应德受学，以春秋魁天下，嘉靖癸丑登进士，视学闽蜀，为南国子祭酒，隆庆初罢官还山，参订诸家，以胡传为主，补其阙，考舆地，成春秋事义全考十六卷，谓圣人多直书而义自见，窃取之义不敢代天子赏罚，万历乙酉自序付梓以传学者
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E4%BA%8B%E4%B9%89%E5%85%A8%E8%80%83.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E4%BA%8B%E4%B9%89%E5%85%A8%E8%80%83.md
endeavors:
- id: guji-姜宝-endeavor-1
  title_zh: 以春秋起家历学政与国子师道
  summary: 受学唐应德，以春秋魁天下登进士，视学福建四川，为南京国子祭酒，以经术传四方，严教指而尊师道
  phases:
  - key: brewing
    name: 从师受春秋
    labels:
      zh: 师承问学
    start_date: '1530'
    highlight_event_id: guji-姜宝-event-jinshi
  - key: breakthrough
    name: 嘉靖癸丑进士及第
    labels:
      zh: 科名显亲
    start_date: '1553'
    highlight_event_id: guji-姜宝-event-jinshi
  - key: climax
    name: 视学闽蜀为南祭酒
    labels:
      zh: 学政师道
    start_date: '1560'
    highlight_event_id: guji-姜宝-event-xuezheng
  - key: closure
    name: 隆庆初罢官还山
    labels:
      zh: 去国里居
    start_date: '1567'
    highlight_event_id: guji-姜宝-event-guiju
  decisions:
  - date: '1540'
    title_zh: 由业诗改业春秋
    rationale: 心疑诸家聚讼，求孟氏程朱之宗，以得圣人窃取之义
  - date: '1560'
    title_zh: 视学闽蜀严教指
    rationale: 以春秋经术传四方，整饬师道，使学者知是非善恶之大防
- id: guji-姜宝-endeavor-2
  title_zh: 罢官纂著春秋事义全考
  summary: 还山检阅旧业，参属词私考辨疑经世诸家，以胡传为主附益己意，补襄昭以后之阙，准皇明舆地图考地里，成十六卷，万历乙酉付梓
  phases:
  - key: brewing
    name: 还山检阅旧业
    labels:
      zh: 退居考索
    start_date: '1567'
    highlight_event_id: guji-姜宝-event-guiju
  - key: breakthrough
    name: 参订诸家以胡传为主
    labels:
      zh: 折衷会通
    start_date: '1575'
    highlight_event_id: guji-姜宝-event-zhushu
  - key: climax
    name: 补阙正地成全考
    labels:
      zh: 补传考地
    start_date: '1580'
    highlight_event_id: guji-姜宝-event-zhushu
  - key: closure
    name: 万历乙酉自序付梓
    labels:
      zh: 锓梓传世
    start_date: '1585'
    highlight_event_id: guji-姜宝-event-kanxing
  decisions:
  - date: '1578'
    title_zh: 以胡传为本兼出己意
    rationale: 本朝学官主胡传，宜存其体，而以属词私考辨疑经世之说补其未明未备
  - date: '1582'
    title_zh: 主直书见义不以一字求褒贬
    rationale: 周王鲁侯有非则直著其非，不用恶字罪字讥贬字加于君父，以阐笔削微旨立名教大防
  - date: '1585'
    title_zh: 携稿入留曹付李一阳锓梓
    rationale: 同郡侍御见而谓可以传，冀以传心要典与百王大法公于学者
events:
- id: guji-姜宝-event-birth
  date: '1514'
  year_of: 1514
  title_zh: 生于丹阳
  description: 明正德年间生于丹阳姜氏，字廷善，号凤阿，早从晋陵唐应德受学
- id: guji-姜宝-event-jinshi
  date: '1553'
  year_of: 1553
  title_zh: 嘉靖癸丑进士
  description: 以春秋魁天下，嘉靖三十二年癸丑登进士第，晋读中秘书，精博有声
- id: guji-姜宝-event-xuezheng
  date: '1560'
  year_of: 1560
  title_zh: 视学闽蜀为南国子祭酒
  description: 先后敕视学福建四川，入为南京国子监祭酒，经术传四方，一时师道为尊
- id: guji-姜宝-event-guiju
  date: '1567'
  year_of: 1567
  title_zh: 隆庆初罢官还山
  description: 隆庆初去国还丹阳，家居检阅春秋，日事考索，集宗族及邑中俊秀开决经义
- id: guji-姜宝-event-zhushu
  date: '1580'
  year_of: 1580
  title_zh: 纂著春秋事义全考
  description: 以胡传为本参以赵汸属词季本私考西亭辨疑王樵经世，补襄昭以后阙传，准皇明舆地图考地里，发明直书义自见之旨
- id: guji-姜宝-event-kanxing
  date: '1585'
  year_of: 1585
  title_zh: 万历乙酉自序付梓
  description: 万历十三年冬十二月自序于丹阳，经李一阳赞助锓梓，进官至南京礼部尚书南大司寇
- id: guji-姜宝-event-death
  date: '1591'
  year_of: 1591
  title_zh: 卒于丹阳
  description: 万历末年卒于里第，四库馆臣称其明白正大阐笔削微旨立名教大防，所著读传解略今佚
