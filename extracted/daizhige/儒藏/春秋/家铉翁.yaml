  - 国亡被执后绝食殉节与忍死存道传经之间的抉择
  - 解春秋时从旧传训说与探求圣人心法垂王法之间的抉择
  lesson: 以春秋垂王法诛乱贼立身亦当如是守正不屈以经寄志
  summary_first_person: 我是眉山家铉翁，号则堂，官至端明殿学士签书枢密院事。宋亡时我方为祈请使留馆，闻变绝食数日，后改馆河间以春秋教授弟子。自燕至瀛，覃思旧闻，答问述意，积十年而成春秋集传详说，首明托始诛乱贼与行夏时之义。
  source_urls:
