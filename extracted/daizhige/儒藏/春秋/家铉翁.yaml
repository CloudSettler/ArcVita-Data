endeavors:
- id: guji-家铉翁-endeavor-1
  title_zh: 南宋立朝与祈请使节守节
  summary_zh: 早年登第立朝至端明殿学士签书枢密院事，元兵逼近郊时奉命为祈请使留馆，闻宋亡绝食明志，后被迁河间。
  phases:
  - key: brewing
    name: 眉山问学登第立朝
    labels:
      zh:
      - 出仕
      - 立朝
    start_date: 1247
    highlight_event_id: guji-家铉翁-event-birth
  - key: breakthrough
    name: 拜端明殿学士参预枢密
    labels:
      zh:
      - 大用
      - 枢密
    start_date: 1274
    highlight_event_id: guji-家铉翁-event-qiqing
  - key: climax
    name: 奉使祈请留馆闻变绝食
    labels:
      zh:
      - 使节
      - 守节
    start_date: 1276
    highlight_event_id: guji-家铉翁-event-qiqing
  - key: closure
    name: 改馆河间以春秋教授
    labels:
      zh:
      - 北迁
      - 讲学
    start_date: 1276
    highlight_event_id: guji-家铉翁-event-hejian
  decisions:
  - date: 1276
    title_zh: 闻宋亡不食饮数日
    rationale: 君国倾覆之际以绝食明臣节，不忍遽死以存孤忠之志
  - date: 1276
    title_zh: 改馆河间后以春秋教授弟子
    rationale: 身虽北迁而道不可废，借讲经存文脉以待后世
- id: guji-家铉翁-endeavor-2
  title_zh: 北地覃思著春秋集传详说
  summary_zh: 自燕至瀛十年间尽见春秋文字，因答问述己意，撮纲领十篇，成三十卷详说，主垂法不主记事，明托始诛乱贼与行夏时。
  phases:
  - key: brewing
    name: 北行丧失旧稿忧患覃思
    labels:
      zh:
      - 北迁
      - 追忆
    start_date: 1276
    highlight_event_id: guji-家铉翁-event-hejian
  - key: breakthrough
    name: 到瀛尽见春秋文字答问述意
    labels:
      zh:
      - 研经
      - 授徒
    start_date: 1277
    highlight_event_id: guji-家铉翁-event-hejian
  - key: climax
    name: 积十年撰成三十卷详说
    labels:
      zh:
      - 著述
      - 集传
    start_date: 1286
    highlight_event_id: guji-家铉翁-event-chengshu
  - key: closure
    name: 自瀛寄宣托友藏之大藏纲领揭篇端
    labels:
      zh:
      - 成书
      - 垂后
    start_date: 1286
    highlight_event_id: guji-家铉翁-event-chengshu
  decisions:
  - date: 1277
    title_zh: 弃去旧说参稽众说求圣人心法
    rationale: 前辈训说不足尽得经意，须探得垂法予夺之旨而后定取舍
  - date: 1286
    title_zh: 撮纲领十篇揭于篇端寄宣付藏
    rationale: 恐微言湮没，先明托始夏正五始三传明霸诸义使观者有考
