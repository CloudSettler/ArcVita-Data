  - 新学方炽之时独守公羊谷梁旧训而被讥墨守胶固
  - 绍圣罢春秋取士三上书乞复不报而守志著书
  lesson: 于异说渐起时硁硁守先儒旧训以谨严补偏救弊
  summary_first_person: 吾涪陵崔子方字彦直为人介而有守绍圣中朝廷罢春秋取士吾三上书乞复之虽不报而不改其志乃考春秋编年为体举时为名著日月为例列王公内外灾异十六门分著例变例而成春秋本例二十卷愿学者通日月之本例而得春秋之义过半矣
  source_urls:
