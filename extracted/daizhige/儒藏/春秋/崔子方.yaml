  summary_first_person: 余涪陵人也字彦直号西畴居士熙宁元丰间见王安石废春秋三传讳学独抱遗经闭门研究伏读三年乃知褒贬具在一经之中遂析经解本例例要三书绍圣间三上疏请置春秋博士不报乃隐六合杜门著书三十余年书成而道终传于南渡
