    start_date: 1068
    highlight_event_id: guji-崔子方-event-writing
  - key: breakthrough
    name: 伏读经文悟情理之说
    labels:
      zh:
      - 以情理通辞例
    start_date: 1072
    highlight_event_id: guji-崔子方-event-writing
  - key: climax
    name: 分经析解成十二卷
    labels:
      zh:
      - 经解本例例要相表里
    start_date: 1080
    highlight_event_id: guji-崔子方-event-writing
  - key: closure
    name: 三书遗子孙待后显
    labels:
      zh:
      - 南渡取藏秘书
    start_date: 1128
    highlight_event_id: guji-崔子方-event-honor
  decisions:
  - date: 1072
    title_zh: 舍传求经
    rationale: 三家先经始事后经终说以自见故失浅险迂当以情理度事考言
  - date: 1080
    title_zh: 著例明经
    rationale: 辞难明者著例见之例不可尽则有日月变例网在纲则条理顺
- id: guji-崔子方-endeavor-2
  title_zh: 上疏请博士不遇而隐
  description: 绍圣间三上疏乞置春秋博士不报遂隐居真州六合杜门著书三十余年
  phases:
  - key: brewing
    name: 知滁州游苏黄
