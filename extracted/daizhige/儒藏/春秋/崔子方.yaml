  decisions:
  - date: 1095
    title_zh: 三上疏言春秋
    rationale: 王安石独任私意诬蔑圣经不列学官当复博士以明褒贬大典
  - date: 1098
    title_zh: 不报则隐
    rationale: 时俗已成莫敢议非与其追逐时好不如守遗经以遗子孙
