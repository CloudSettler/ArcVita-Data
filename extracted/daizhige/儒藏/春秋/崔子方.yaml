  - key: climax
    name: 隐居六合杜门著书
    labels:
      zh:
      - 东川布衣守道三十年
    start_date: 1098
    highlight_event_id: guji-崔子方-event-seclusion
  - key: closure
    name: 没后书显蒙旌褒
    labels:
      zh:
