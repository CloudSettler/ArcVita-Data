endeavors:
- id: guji-崔子方-endeavor-1
  title_zh: 三上书乞复春秋取士
  description: 绍圣中朝廷罢春秋取士三上书论复经科虽不报而明守经之志得黄庭坚极称其贤
  phases:
  - key: brewing
    name: 罢春秋取士而忧经废
    labels:
      zh:
      - 罢春秋取士
      - 忧经废
    start_date: 1094
    highlight_event_id: guji-崔子方-event-petition
  - key: climax
    name: 三上书乞复而不报
    labels:
      zh:
      - 三上书
      - 不报而守
    start_date: 1095
    highlight_event_id: guji-崔子方-event-petition
  decisions:
  - date: 1094
    title_zh: 初上书乞复春秋取士
    rationale: 以春秋为圣人之书不可废经取士乃养士之本故冒言乞复
  - date: 1096
    title_zh: 再三上书终不改守
    rationale: 虽前书不报而新学方炽异说渐起更当守先儒旧训不以用舍易志
- id: guji-崔子方-endeavor-2
  title_zh: 撰春秋本例二十卷明经
  description: 考春秋日月时例分十六门著例变例以日月为例之本成一家谨严之学
  phases:
  - key: brewing
    name: 考三传日月时例
    labels:
      zh:
      - 考公羊谷梁
      - 详略轻重
    start_date: 1097
    highlight_event_id: guji-崔子方-event-book
  - key: breakthrough
    name: 立十六门分著例变例
    labels:
      zh:
      - 十六门
      - 著例变例
    start_date: 1100
    highlight_event_id: guji-崔子方-event-book
  - key: closure
    name: 成春秋本例二十卷
    labels:
      zh:
      - 本例成书
      - 守先儒旧训
    start_date: 1102
    highlight_event_id: guji-崔子方-event-book
  decisions:
  - date: 1098
    title_zh: 以日月为例之本
    rationale: 以编年为体举时为名著日月为例权事之轻重大小尊卑亲疏以定详略故先明日月
  - date: 1100
    title_zh: 墨守旧训不从新学
    rationale: 二传去圣人近必有所传虽有穿凿不可尽废而凭臆自用故宁胶固而守谨严
