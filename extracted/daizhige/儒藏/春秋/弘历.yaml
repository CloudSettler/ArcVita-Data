  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆
  archetype: 御纂经师
  dilemmas:
  - title_zh: 传注纷歧当何考衷
    description: 三传及胡氏张氏聚讼，人自为师，傅会臆说不免，承学之士宜何考衷，须息纷歧以尊经
  - title_zh: 曲说离经与直书之义
    description: 废传解经则各以臆度相胜，例多苛细缴绕，曲说离经甚于曲学泥经，须辞简事明以见劝惩
  lesson: 索解过而不直则义不见，斟酌情理之平以求圣经微意，辞简事明方能尊王翼传
  summary_first_person: 朕服习皇祖钦定传說彚纂有年，绍闻志切，辑易诗竣事即命馆臣系是经具解，以彚纂为指南，融诸传同异以尊经，务去穿凿破碎，赐名直解，冠以御制序文，复于戊戌孟夏发明元年春王正月开宗明义，以明天下一统之义
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E5%BE%A1%E7%BA%82%E6%98%A5%E7%A7%8B%E7%9B%B4%E8%A7%A3.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E5%BE%A1%E7%BA%82%E6%98%A5%E7%A7%8B%E7%9B%B4%E8%A7%A3.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 御纂春秋直解十五卷
  summary: 乾隆二十三年奉敕命馆臣系经具解，以钦定彚纂为指南，斥穿凿破碎，以十二公为十二卷，庄僖襄各析子卷，赐名直解
  phases:
  - key: brewing
    name: 服习彚纂绍闻志切
    labels:
      zh:
      - 服习
      - 绍闻
    start_date: 1736
    highlight_event_id: guji-弘历-event-birth
  - key: breakthrough
    name: 奉敕命馆臣系经进解
    labels:
      zh:
      - 立纲
      - 命纂
    start_date: 1758
    highlight_event_id: guji-弘历-event-zhuanxiu
  - key: climax
    name: 御制序文赐名直解
    labels:
      zh:
      - 定名
      - 序经
    start_date: 1758
    highlight_event_id: guji-弘历-event-zhuanxiu
  - key: closure
    name: 四十一年恭校上进四库
    labels:
      zh:
      - 校上
      - 列经部
    start_date: 1776
    highlight_event_id: guji-弘历-event-jiaoshang
  decisions:
  - date: 1758
    title_zh: 以彚纂为指南息纷歧
    rationale: 镕范羣言去取精当，务斟酌情理之平，使笔削大义炳然，不取迂曲之说
  - date: 1758
    title_zh: 斥曲例命曰直解
    rationale: 五经如法律春秋如断例之说凿枘不入，例转多而律转晦，故去其所滞择善而从，辞简事明
- id: guji-弘历-endeavor-2
  title_zh: 发明元年春王正月大义
  summary: 于戊戌孟夏御制书春秋元年春王正月事，明尊王开宗第一义，贯春秋本末至获麟，示大一统足以一天下之心
  phases:
  - key: brewing
    name: 托始隐公据鲁史考年
    labels:
      zh:
      - 托始
      - 考年
    start_date: 1758
    highlight_event_id: guji-弘历-event-zhuanxiu
  - key: breakthrough
    name: 辨春王正月禀王之义
    labels:
      zh:
      - 尊王
      - 正朔
    start_date: 1778
    highlight_event_id: guji-弘历-event-yuanyi
  - key: climax
    name: 明夏时王元大一统
    labels:
      zh:
      - 行夏时
      - 大一统
    start_date: 1778
    highlight_event_id: guji-弘历-event-yuanyi
  - key: closure
    name: 贯本末绝笔获麟示后
    labels:
      zh:
      - 贯通
      - 示后
    start_date: 1778
    highlight_event_id: guji-弘历-event-yuanyi
  decisions:
  - date: 1778
    title_zh: 书春王不言王春存夏时
    rationale: 月可改而春不可改，隐寓夏时与王元，叹私议不能行于时而志在万世
  - date: 1778
    title_zh: 断封建不可行于后世
    rationale: 圣人之道忧在万世，大一统足以一天下之心，不可任其纷纭，故以获麟绝笔为戒
events:
- id: guji-弘历-event-birth
  type: birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生
  description: 康熙五十年八月十三日生，后即位为清高宗，年号乾隆
- id: guji-弘历-event-zhuanxiu
  type: career
  date: 1758
  year_of: 1758
  title_zh: 乾隆二十三年奉敕纂春秋直解
  description: 命在馆诸臣系是经具解以进，以彚纂为指南，冠御制序文，赐名直解，以十二公为十二卷，庄僖襄析子卷成十五卷
- id: guji-弘历-event-jiaoshang
  type: career
  date: 1776-09-01
  year_of: 1776
  title_zh: 乾隆四十一年九月恭校上
  description: 总纂官纪昀陆锡熊孙士毅总校官陆费墀恭校上进，列经部春秋类，称读彚纂辨是非复读直解融精要则无余蕴
- id: guji-弘历-event-yuanyi
  type: career
  date: 1778
  year_of: 1778
  title_zh: 戊戌孟夏御制书元年春王正月事
  description: 发明春秋尊王开宗明义第一，平王四十九年总纪为王年以别经，明禀王春王正得元始之义，贯本末至获麟以示大一统
- id: guji-弘历-event-death
  type: death
  date: 1799-02-07
  year_of: 1799
  title_zh: 弘历崩逝
  description: 嘉庆四年正月初三日崩，御纂经籍列入四库经部，春秋直解与传說彚纂并行于学官
