  decisions:
  - date: '1580'
    title_zh: 经传别行不载经文
    rationale: 汉代经传本别行故只录诠义以复古法不随人射覆
  - date: '1580'
    title_zh: 驳夏时冠周月及无字非例
    rationale: 谓为下先倍失为春秋之义隐庄闵僖不书即位皆史阙非圣人削夺
