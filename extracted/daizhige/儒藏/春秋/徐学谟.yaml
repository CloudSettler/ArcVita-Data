  dilemmas:
  - title_zh: 信经还是信传
    description: 三传各就其词为说而经文暧昧当独推尊孔氏还是辅车并观
  - title_zh: 褒贬有无特笔之争
    description: 公谷无字非例与胡氏无事非讥是否穿凿当回归仍人道正王法
  - title_zh: 夏时周月如何断
    description: 以夏时冠周月与为下先倍之讥当以周时周月据事直书
  lesson: 舍穿凿附会回归简易明达据事直书方得圣人窃取之义
  summary_first_person: 余以易起家旁窥春秋三十余年填郧之隙重掇三氏及范杨何孔胡传裒辑成春秋亿六卷不徇传蔑经不随人射覆惟求仍人道正王法善善恶恶是是非非
  source_urls:
