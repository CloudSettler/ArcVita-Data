  dilemmas:
  - 推尊圣人行赏罚与恪守陪臣礼分之间何以持论为正
  - 沿旧儒穿凿书法与据经文先后以经辨经之间何以取舍
  lesson: 以礼经明春秋，不以私意立赏罚，以经文先后辨例，守大防而求经意
  summary_first_person: 我为秀水徐廷垣，曾任新昌县丞，慨叹春秋真义千载成冥途，乃以左传事实质经，以经之异同辨例于公羊谷梁及诸儒，合于义例者不复置议，曲说偏断者据经驳正，名曰春秋管窥，以备好学深思者观览
  source_urls:
