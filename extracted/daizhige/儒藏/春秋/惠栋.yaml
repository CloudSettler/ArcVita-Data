endeavors:
- id: guji-惠栋-endeavor-1
  title_zh: 承四世家学作左传补注
  summary: 曾王父朴庵幼通左氏至耄不衰作补注一卷传序相授四世广为补注六卷以补杜阙
  phases:
  - key: brewing
    name: 幼承庭训习左氏
    labels:
      zh: 家学传承
    start_date: 1705
    highlight_event_id: guji-惠栋-event-childhood
  - key: breakthrough
    name: 刺取经传附先世遗闻
    labels:
      zh: 刺经补杜
    start_date: 1718
    highlight_event_id: guji-惠栋-event-xu1718
  - key: climax
    name: 由四卷增益为六卷
    labels:
      zh: 增益成书
    start_date: 1750
    highlight_event_id: guji-惠栋-event-sixjuan
  - key: closure
    name: 传子孙俾业勿替
    labels:
      zh: 垂训后昆
    start_date: 1755
    highlight_event_id: guji-惠栋-event-death
  decisions:
  - date: 1718
    title_zh: 以戊戌序定补注初稿
    rationale: 少习是书长闻庭训谓杜氏颇多违误故效乐刘之意有失必规先定规模再图增益
  - date: 1750
    title_zh: 由九经古义别行增为六卷
    rationale: 本为九经古义之一以先出别行故虚列其目后有所增益乃博采周礼仪礼尔雅说文国语以证杜失
- id: guji-惠栋-endeavor-2
  title_zh: 宗郑韦之学辨古今文同异
  summary: 宗韦郑之遗前修不掩于古今文同异尤悉博异说祛俗议兼作周易述以明古学
  phases:
  - key: brewing
    name: 博览郑贾服杜旧训
    labels:
      zh: 博采旧训
    start_date: 1720
    highlight_event_id: guji-惠栋-event-xu1718
  - key: breakthrough
    name: 以古文石经证经传文字
    labels:
      zh: 证文以古
    start_date: 1735
    highlight_event_id: guji-惠栋-event-sixjuan
  - key: climax
    name: 辨杜注得失立补规之体
    labels:
      zh: 补阙规失
    start_date: 1750
    highlight_event_id: guji-惠栋-event-sixjuan
  - key: closure
    name: 四库馆臣定评博而泥古
    labels:
      zh: 身后定评
    start_date: 1781-11
    highlight_event_id: guji-惠栋-event-siku
  decisions:
  - date: 1735
    title_zh: 从石经改二十为廿三十为卅
    rationale: 谓古文出孔壁兼采金石故以唐石经及说文钟鼎证二十三十当作廿卅以存古文之旧
  - date: 1750
    title_zh: 存设关讥征等驳议不删
    rationale: 虽废六关训置等说偏驳犹存其说以见博而泥之失令读者考得失审异同
events:
- id: guji-惠栋-event-birth
  date: 1697
  year_of: 1697
  title_zh: 生于元和惠氏经学之家
  description: 康熙三十六年生于苏州元和幼承曾王父朴庵及家君庭训通左氏春秋
- id: guji-惠栋-event-childhood
  date: 1705
  year_of: 1705
  title_zh: 幼年习左氏闻补注一卷之业
  description: 曾王父朴庵幼通左氏至耄不衰作补注一卷传序相授遂立四世勿替之志
- id: guji-惠栋-event-xu1718
  date: 1718
  year_of: 1718
  title_zh: 戊戌冬日自序左传补注
  description: 东吴惠栋定宇自序谓春秋三传左氏先著竹帛晋宋以来服杜盛行乃刺取经传附先世遗闻以补杜集解之遗
- id: guji-惠栋-event-sixjuan
  date: 1750
  year_of: 1750
  title_zh: 补注由四卷增益为六卷
  description: 本为九经古义之一先出别行初作四卷后援引周礼国语墨子说文等旧训增益为六卷之本
- id: guji-惠栋-event-death
  date: 1758
  year_of: 1758
  title_zh: 卒于乾隆二十三年
  description: 毕生治古经学兼有周易述等著作卒后补注六卷流传馆阁别行
- id: guji-惠栋-event-siku
  date: 1781-11
  year_of: 1781
  title_zh: 四库馆臣恭校上提要
  description: 乾隆四十六年十一月纪昀等恭校上提要称其援引旧训根据昭然长在博短亦在嗜博长在古短亦在泥古
