  - title_zh: 博与泥之辨
    description: 长于博采旧训而短亦在嗜博长于宗古而短亦在泥古如何守故而不臆揣
  - title_zh: 补杜与规杜之度
    description: 宗韦郑之遗以补杜集解之阙又有失必规如何博异说而不徒骇耳目
  lesson: 援引旧训以补阙遗有失必规然博而能约守古而不泥方为善注
  summary_first_person: 余少习左氏长闻庭训刺取经传附以先世遗闻广为补注六卷以博异说祛俗议宗韦郑之遗有失必规传之子孙俾四世之业勿替
