endeavors:
- id: guji-戴溪-endeavor-1
  title_zh: 资善堂进讲春秋启沃储君
  description: 开禧中为资善堂说书累转太子詹事奉景献太子命类易诗书春秋论语孟子通鉴各为说以进专以春秋尊王内修外攘之道启沃君听
  phases:
  - key: brewing
    name: 早年潜心麟经
    labels:
      zh: 治经养望
    start_date: '1196'
    highlight_event_id: guji-戴溪-event-dengdi
  - key: breakthrough
    name: 应命入侍资善堂
    labels:
      zh: 东宫进讲
    start_date: '1205'
    highlight_event_id: guji-戴溪-event-zishantang
  - key: climax
    name: 进春秋说于景献太子
    labels:
      zh: 启沃君听
    start_date: '1207'
    highlight_event_id: guji-戴溪-event-jinchunqiu
  - key: closure
    name: 义精语平重席专讲
    labels:
      zh: 功成身退
    start_date: '1208'
    highlight_event_id: guji-戴溪-event-jinchunqiu
  decisions:
  - date: '1205'
    title_zh: 以夏正说进讲春秋正朔
    rationale: 欲明天道授时与王者班朔之义故不拘周月而主夏时以正君心
  - date: '1207'
    title_zh: 于北伐败衂后惓惓内修外攘
    rationale: 时当韩侂胄北伐败衂和议再成故借经义申交邻经武之道以儆储君
- id: guji-戴溪-endeavor-2
  title_zh: 著述春秋讲义垂范后学
  description: 所进春秋说凡四卷多从左氏发明大义兼辨公谷长子桷修葺旧闻于嘉定癸未锓木金陵学舍复刻于泰州以广其传
  phases:
  - key: brewing
    name: 续吕氏家塾读诗记旧业
    labels:
      zh: 读诗著述
    start_date: '1200'
    highlight_event_id: guji-戴溪-event-dengdi
  - key: breakthrough
    name: 会萃东宫讲义成编
    labels:
      zh: 编次成书
    start_date: '1207'
    highlight_event_id: guji-戴溪-event-jinchunqiu
  - key: climax
    name: 明白正大发明大义
    labels:
      zh: 义例精深
    start_date: '1210'
    highlight_event_id: guji-戴溪-event-zhushu
  - key: closure
    name: 金陵锓木泰州复刻
    labels:
      zh: 刊行广传
    start_date: '1223'
    highlight_event_id: guji-戴溪-event-zhushu
  decisions:
  - date: '1210'
    title_zh: 多从左氏兼附公谷案语
    rationale: 所释经文多从左氏其从公谷者附案语于下以存阙疑不敢改史旧文
  - date: '1223'
    title_zh: 托长子桷沈光牛大年刊行
    rationale: 是书期于启沃君听不可得闻故命工锓木置之郡校以正后学之讹谬
