  summary_first_person: 吾吴江愚庵朱鹤龄也明亡不仕潜心经传采赵汸陆粲傅逊邵宝王樵诸家以补正杜预集解之阙讹十之七集旧解十之三出己意故名曰钞复得亭林顾先生华阴所寄左传注数十则附为补二卷以翼春秋
