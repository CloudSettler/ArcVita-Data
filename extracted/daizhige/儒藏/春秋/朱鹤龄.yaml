endeavors:
- id: guji-朱鹤龄-endeavor-1
  title_zh: 采诸家说撰读左日钞十二卷以补杜注
  description: 集赵汸陆粲傅逊邵宝王樵五家为主十之七集旧解十之三出己意辨杜预春秋经传集解阙讹汰林尧叟繁芜以钞名篇
  phases:
  - key: brewing
    name: 博采旧解发凡起例
    labels:
      zh: 酝酿立纲
    start_date: 1660-01-01
    highlight_event_id: guji-朱鹤龄-event-zhushu
  - key: breakthrough
    name: 折衷杜孔辨正得失
    labels:
      zh: 考订突破
    start_date: 1675-01-01
    highlight_event_id: guji-朱鹤龄-event-zhushu
  - key: climax
    name: 读左日钞十二卷刻成
    labels:
      zh: 成书高峰
    start_date: 1680-08-01
    highlight_event_id: guji-朱鹤龄-event-zhushu
  - key: closure
    name: 辛酉自序明钞义例
    labels:
      zh: 序定收束
    start_date: 1681-07-01
    highlight_event_id: guji-朱鹤龄-event-zhushu
  decisions:
  - date: 1675-06-01
    title_zh: 定以钞名广集旧解而断以新义
    rationale: 杜注得孔疏而明然郑玄贾逵诸儒不可尽废故十之七集旧十之三出己意不作全注而作日钞
  - date: 1680-10-01
    title_zh: 尽汰林尧叟音义仅存一二
    rationale: 林注繁芜坊刻与杜注混淆无别故汰去以存杜孔本义持论务允
- id: guji-朱鹤龄-endeavor-2
  title_zh: 会亭林说增补二卷兼成尚书埤传春秋集说
  description: 庚申秋得顾炎武自华阴寄左传注数十则已刻逾半不及纂入乃取三传三礼注疏与所贻汇成补二卷又成尚书埤传及春秋集说相辅
  phases:
  - key: brewing
    name: 与顾炎武通问论左氏
    labels:
      zh: 交游酝酿
    start_date: 1679-01-01
    highlight_event_id: guji-朱鹤龄-event-buchong
  - key: breakthrough
    name: 得华阴寄示数十则析疑正舛
    labels:
      zh: 得助突破
    start_date: 1680-08-01
    highlight_event_id: guji-朱鹤龄-event-buchong
  - key: climax
    name: 缀缉三传三礼注疏成补二卷
    labels:
      zh: 补缀高峰
    start_date: 1681-01-01
    highlight_event_id: guji-朱鹤龄-event-buchong
  - key: closure
    name: 附于简末以待好古君子参和全注
    labels:
      zh: 附梓收束
    start_date: 1681-07-01
    highlight_event_id: guji-朱鹤龄-event-buchong
  decisions:
  - date: 1680-09-01
    title_zh: 多用顾说别为补卷不混正编
    rationale: 杜解补正已有完帙所采未及什一且正编已刻逾半故另汇二卷附简末以存亭林析疑之功
  - date: 1665-03-01
    title_zh: 先成春秋集说再作日钞略举其概
    rationale: 左传以史事解经得失已详于集说此书只辨补杜阙故分工不重出以明经翼辅之体
events:
- id: guji-朱鹤龄-event-birth
  date: 1606-01-01
  year_of: 1606
  title_zh: 生于吴江
  description: 明万历三十四年生于苏州府吴江字长孺号愚庵
- id: guji-朱鹤龄-event-shangshu
  date: 1660-05-01
  year_of: 1660
  title_zh: 尚书埤传著录成名
  description: 撰尚书埤传已著录清初以经学名复治春秋作春秋集说为日钞之本
- id: guji-朱鹤龄-event-zhushu
  date: 1680-12-01
  year_of: 1680
  title_zh: 读左日钞十二卷初刻成
  description: 采赵汸陆粲傅逊邵宝王樵诸家补正杜预集解成十二卷凡例斥林注之陋明集旧断新之例
- id: guji-朱鹤龄-event-buchong
  date: 1681-07-01
  year_of: 1681
  title_zh: 得顾炎武寄注增补二卷自序
  description: 庚申秋得顾炎武自华阴寄左传注数十则辛酉七月朔自序取三传三礼注疏与所贻汇成补二卷附简末
- id: guji-朱鹤龄-event-death
  date: 1683-12-31
  year_of: 1683
  title_zh: 卒于吴江
  description: 清康熙二十二年卒读左日钞后入四库春秋类存其考证之功
