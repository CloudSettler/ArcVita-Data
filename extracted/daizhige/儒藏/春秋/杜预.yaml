endeavors:
- id: guji-杜预-endeavor-1
  title_zh: 集解左氏春秋
  description_zh: 专取丘明之传以释孔氏之经，分年相附，随而解之，世称左氏功臣。
  phases:
  - key: brewing
    name: 博览三传
    labels:
      zh: 酝酿
    start_date: '0235'
    highlight_event_id: guji-杜预-event-birth
  - key: breakthrough
    name: 顿悟丘明大意
    labels:
      zh: 突破
    start_date: '0263'
    highlight_event_id: guji-杜预-event-annotation
  - key: closure
    name: 经传集解成书
    labels:
      zh: 收束
    start_date: '0270'
    highlight_event_id: guji-杜预-event-annotation
  decisions:
  - date: '0263'
    title_zh: 弃杂取公羊谷梁以释左氏之法
    rationale: 以冠双屦将丝综麻不可入，必子应乎母以胶投漆，方能曲畅经传本意。
  - date: '0270'
    title_zh: 分年相附别集诸例
    rationale: 经传 mixed 难读则分年解之，异同之说则作释例详之，使后学有所据依。
- id: guji-杜预-endeavor-2
  title_zh: 镇襄阳谋平吴
  description_zh: 都督荆州，抚民修备，造平吴舆图，力主伐吴，成一统之业。
  phases:
  - key: brewing
    name: 出镇襄阳
    labels:
      zh: 酝酿
    start_date: '0273'
    highlight_event_id: guji-杜预-event-pingwu
  - key: climax
    name: 上表力主伐吴
    labels:
      zh: 高潮
    start_date: 0279
    highlight_event_id: guji-杜预-event-pingwu
  - key: closure
    name: 王濬顺流东下吴平
    labels:
      zh: 收束
    start_date: 0280
    highlight_event_id: guji-杜预-event-pingwu
  decisions:
  - date: '0273'
    title_zh: 到镇安民修水利
    rationale: 欲取江东必先固荆襄，仓廪实而军可久，民安而师有名。
  - date: 0279
    title_zh: 力排众议请速伐吴
    rationale: 吴主昏虐天时已至，失今不伐必滋后患，国之大事不可坐失机宜。
events:
- id: guji-杜预-event-birth
