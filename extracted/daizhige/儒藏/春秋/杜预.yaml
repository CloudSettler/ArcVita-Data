  place_zh: 京兆杜陵
  description_zh: 魏文帝黄初三年生于京兆杜氏，少有大志，博学多闻。
- id: guji-杜预-event-annotation
  title_zh: 撰成春秋左氏经传集解
  date: '0270'
  year_of: 270
  place_zh: 洛阳
  description_zh: 考校左氏传，专取丘明之传以释春秋之经，分年相附而成集解三十卷，后又作释例以明凡例。
- id: guji-杜预-event-pingwu
  title_zh: 镇荆州策平吴
  date: 0280
  year_of: 280
  place_zh: 襄阳
  description_zh: 都督荆州诸军事，镇襄阳，修备安民，累陈伐吴之策，至太康元年吴平，封当阳县侯。
- id: guji-杜预-event-death
  title_zh: 卒于京师
  date: 0284
  year_of: 284
  place_zh: 洛阳
  description_zh: 晋武帝太康五年卒，谥曰成，追赠征南大将军，所注左传与孔颖达疏并行于学官。
