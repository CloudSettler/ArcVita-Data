  archetype: 经世致用之儒将
  dilemmas:
  - 专宗左氏还是兼采公羊谷梁以释春秋
  - 伐吴当速发还是安民积粮以待可胜
  lesson: 以胶投漆以解经，以全谋全功以定天下，学问功业可以相济。
  summary_first_person: 吾幼承家学，博览经籍，深感左氏义略而事详，遂专取丘明之传以释孔氏之经，名为经传集解。后镇襄阳，修水利，造舆图，力主伐吴而成一统之功。愿后人读经知事，通权识务，不以浮文害理。
