  dilemmas:
  - 遵胡安国一家之言以应学官还是虚心榷三传以求圣人精意
  - 以夏时冠周月托空言见行事还是信鲁史从周不紊天地四时之序
  lesson: 不以精意求圣人而执一家以诮余家犹祀天或以牛或以马当以精意合苍苍者也
  summary_first_person: 吾杨于庭字道行全椒人万历庚辰进士少受读春秋窃疑胡氏传归田之暇胪列虚心而榷之合者什七不合者什三笔而识之成春秋质疑十二卷以质四方
