  - date: 1337
    title_zh: 以胡氏为主附录三传要语
    rationale: 国家设科专用三传及胡传故分注三传程子诸家以发明胡氏而禆其阙遗
  - date: 1341
    title_zh: 烬余复辑往正是于虞集
    rationale: 郁攸之后断简煨烬遂搜辑旧闻求邵庵订正以存一家之学
  - date: 1346
    title_zh: 详注纪年谥号并列经文异同
    rationale: 一事笔削一字同异皆圣心精微所寓故究事实之悉求圣笔之真以待初学
