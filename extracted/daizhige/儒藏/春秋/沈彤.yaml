  dilemmas:
  - 杜注孔疏相沿已久从旧说则安而失实订正则劳而招议当何从
  - 周礼田制采地赏地加田名实易混据注疏则简而多误核经文则繁而难明当何据
  lesson: 读经当以经证经核名实而辨得失不徇旧说不苟同流俗
  summary_first_person: 吾吴江沈彤一生考经补注作尚书小疏周官禄田考又以赵汸顾炎武所补杜注为未尽而作春秋左传小疏虽为未完之书亦愿于读左者有所裨补
  source_urls:
