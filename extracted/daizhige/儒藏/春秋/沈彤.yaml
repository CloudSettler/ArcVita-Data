      - 研读旧注
    start_date: 1735
    highlight_event_id: guji-沈彤-event-study-zuozhuan
  - key: breakthrough
    name: 辨正赵顾补注得失
    labels:
      zh:
      - 订正补注
    start_date: 1745
    highlight_event_id: guji-沈彤-event-write-xiaoshu
  - key: climax
    name: 撰成左传小疏初稿
    labels:
      zh:
      - 著述小疏
    start_date: 1750
    highlight_event_id: guji-沈彤-event-write-xiaoshu
  - key: closure
    name: 未完而止传世一卷
    labels:
      zh:
      - 未完传世
    start_date: 1752
    highlight_event_id: guji-沈彤-event-death
  decisions:
  - date: 1745
    title_zh: 不从杜解别明天王正月与郑伯克段之义
    rationale: 列国史官记事常法与传文如二君之义若从旧则经义不明故别解之
  - date: 1750
    title_zh: 辨八邑六邑为赏地非加田以正孔疏之误
    rationale: 赏地采地贡数显异误以赏地为采地则田制尽乖故据周礼司勲大司徒核正之
- id: guji-沈彤-endeavor-2
  title_zh: 撰尚书小疏与周官禄田考建经学体系
  description: 先作尚书小疏继考周官禄田明采地赏地加田之别为读春秋礼制张本
  phases:
  - key: brewing
    name: 治尚书而作小疏
    labels:
      zh:
      - 治尚书
    start_date: 1730
    highlight_event_id: guji-沈彤-event-write-shangshu
  - key: breakthrough
    name: 考周官禄田明田制
    labels:
      zh:
      - 考田制
    start_date: 1740
    highlight_event_id: guji-沈彤-event-write-lutian
  - key: climax
    name: 以禄田考证左传赋制
    labels:
      zh:
      - 以礼证传
    start_date: 1748
    highlight_event_id: guji-沈彤-event-write-xiaoshu
  - key: closure
    name: 经说相发明录而存之
    labels:
      zh:
      - 经说传世
    start_date: 1752
    highlight_event_id: guji-沈彤-event-death
  decisions:
  - date: 1740
    title_zh: 作周官禄田考以辨大司徒司勲之异
    rationale: 注疏混采地赏地为一则左传倍赋诸事不可通故专考禄田以明经制
  - date: 1748
    title_zh: 引周礼证左传丘赋车兵之制
    rationale: 传文作丘赋赋车兵徒兵非礼制不明故以周官相证补正顾氏杜氏之失
