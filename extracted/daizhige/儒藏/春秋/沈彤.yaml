  - https://daizhige.org/儒藏/春秋/春秋左传小疏.html
endeavors:
- id: guji-沈彤-endeavor-1
  title_zh: 撰春秋左传小疏订正杜注孔疏
  description: 以赵汸顾炎武所补左传杜注为未尽更相订正辨采地赏地之误正徒兵闰月诸说成一卷小疏
  phases:
