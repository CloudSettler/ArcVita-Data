    highlight_event_id: guji-湛若水-event-zhuancheng
  decisions:
  - date: 1520
    title_zh: 不泥经文而考之于事求之于心
    rationale: 经识其大传识其小合文与事而义存其中去穿凿而反浑沦
  - date: 1534
    title_zh: 名曰春秋正传以正诸传
    rationale: 正诸传之谬而归之正幸与天下后世学者共商以明圣心
