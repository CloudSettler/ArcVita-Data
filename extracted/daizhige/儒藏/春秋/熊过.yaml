      zh: 辨驳三传
    start_date: 1540-01-01
    highlight_event_id: guji-熊过-event-book
  - key: closure
    name: 四库采录传世
    labels:
      zh: 警醒后学
    start_date: 1782-09-01
    highlight_event_id: guji-熊过-event-book
  decisions:
  - date: 1535-01-01
    title_zh: 定信经不信传大防
    rationale: 道存乎志志明诸言，不主先儒旧说，专以经文正传注之失
  - date: 1540-01-01
    title_zh: 举邢迁夷仪等数十条立新解
    rationale: 考据经文时月地名，虽涉凿空，亦求大义炳然，不为摭拾空谈
- id: guji-熊过-endeavor-2
  title_zh: 注周易明象数历官祠祭
  summary_zh: 己丑登第后历官礼部祠祭司郎中，注易专明象数，与来知德并称
