  decisions:
  - date: 1535-01-01
    title_zh: 守祠祭而究礼意
    rationale: 官在礼部当明郊庙之义，不徒具文，故于春秋郊赙等事尤致意
  - date: 1545-01-01
    title_zh: 舍旧说专言象数
    rationale: 易道广大象数可征，不徇成说，欲以实学警空疏
