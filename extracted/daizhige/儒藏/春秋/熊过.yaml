  era: 明
  reign_ref: 嘉靖
  archetype: 信经辨传的经学家
  dilemmas:
  - title_zh: 信经还是信传
    description_zh: 三传旧说纷纭，从传则经义晦，信经则不免凿空抵牾之讥
  - title_zh: 守官还是著书
    description_zh: 官至祠祭郎中守礼有责，又欲明志于春秋象数于易，两途难兼
  lesson: 信经以明志，辨驳以求是，大义炳然胜于摭拾空谈
  summary_first_person: 吾熊过字叔仁四川富顺人嘉靖己丑进士曾官礼部祠祭司郎中平生注易专明象数复著春秋明志录十二卷以信经不信传为大防虽多新裁微中亦不免臆断之失愿后学因吾书而得圣人反正之几
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=954682
  - https://github.com/daizhige-org/daizhigev20
