endeavors:
- id: guji-玄烨-endeavor-1
  title_zh: 敕命纂辑春秋传说汇纂
  goal: 以四传为主集说为辅删舛驳正成四十卷以正经义
  phases:
  - key: brewing
    name: 服膺朱子论以定去取之准
    labels:
      zh:
      - 明道正谊据实书事
    start_date: 1715-01-01
    highlight_event_id: guji-玄烨-event-order
  - key: breakthrough
    name: 命王掞张廷玉等总裁分修校对
    labels:
      zh:
      - 开馆分修
    start_date: 1715-06-01
    highlight_event_id: guji-玄烨-event-order
  - key: climax
    name: 详考三传集说刊除乖畔
    labels:
      zh:
      - 辨详取慎
    start_date: 1716-01-01
    highlight_event_id: guji-玄烨-event-preface
  - key: closure
    name: 御制序文成书四十卷
    labels:
      zh:
      - 康熙六十年序成
    start_date: 1721-06-01
    highlight_event_id: guji-玄烨-event-preface
  decisions:
  - date: 1715-01-01
    title_zh: 以四传为主集说为辅
    rationale: 三家各述所闻四传并行当择当于理者删舛存真
  - date: 1721-06-01
    title_zh: 仍缀胡传于三传之末而详加驳正
    rationale: 念士子久诵胡传难以骤更故存其名而刊其乖经义者
- id: guji-玄烨-endeavor-2
  title_zh: 以朱子义正春秋学官积弊
  goal: 破一字褒贬变例赏罚及灾祥谶纬之怪僻复炳若日星之义
  phases:
  - key: brewing
    name: 洞鉴胡传穿凿附会去经逾远
    labels:
      zh:
      - 批判胡安国解义
    start_date: 1710-01-01
    highlight_event_id: guji-玄烨-event-order
  - key: breakthrough
    name: 表章朱子书名书爵无意义之说
    labels:
      zh:
      - 服膺朱子
    start_date: 1715-01-01
    highlight_event_id: guji-玄烨-event-order
  - key: climax
    name: 采录不合胡传而合古学之旧说
    labels:
      zh:
      - 阐明古学
    start_date: 1718-01-01
    highlight_event_id: guji-玄烨-event-preface
  - key: closure
    name: 颁示属辞比事之教以幸天下后世
    labels:
      zh:
      - 维风维草
    start_date: 1721-06-01
    highlight_event_id: guji-玄烨-event-preface
  decisions:
  - date: 1715-01-01
    title_zh: 独宗朱子不立一尊于胡氏
    rationale: 胡传立于学官贡举取士穿凿日甚必以明道正谊正之
  - date: 1721-06-01
    title_zh: 示辨详取慎不悬断圣人笔削
    rationale: 千百年后悬断笔削至难唯择言当于理者以资劝戒
