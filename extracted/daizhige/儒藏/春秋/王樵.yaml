  archetype: 守正传经的经学家
  dilemmas:
  - title_zh: 博采与醇正之衡
    description: 辑传博采诸家附以论断易失之冗须以朱子为宗守经世大法而归醇正
  - title_zh: 科举俗学与笃实之辨
    description: 明人说春秋多范围胡传或趋科举庸滥或推求刻酷须不移于俗而务笃实明简
  lesson: 以朱子为宗比类推求不涉穿凿经世大法在尊王贱霸内夏外夷正谊明道
  summary_first_person: 我是王樵金坛方麓以朱子为宗博采诸家辑春秋辑传十三卷又凡例二卷复著周易私录愿以直道公心明经世大法使后人通文求义得意法用
  source_urls:
