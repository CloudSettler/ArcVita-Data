  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E6%98%A5%E7%A7%8B%E8%BE%91%E4%BC%A0.html
endeavors:
- id: guji-王樵-endeavor-1
  title_zh: 辑春秋传以明经世大法
  summary: 以朱子为宗博采诸家作宗旨三篇附论一篇又凡例二卷成春秋辑传十三卷
  phases:
  - key: brewing
    name: 博览注疏立宗旨
    labels:
      zh:
      - 研读
      - 立宗
    start_date: 1550
    highlight_event_id: guji-王樵-event-jinshi
  - key: breakthrough
    name: 辑传成编定凡例
    labels:
      zh:
      - 辑述
      - 类例
    start_date: 1570
    highlight_event_id: guji-王樵-event-jizhuan
  - key: closure
    name: 宗旨凡例并传于世
    labels:
      zh:
      - 成书
      - 垂教
    start_date: 1585
    highlight_event_id: guji-王樵-event-jizhuan
  decisions:
  - date: 1570
    title_zh: 以朱子为宗博采诸家
    rationale: 孟子程子朱子深得圣人全体须黙契圣心不用穿凿细碎以正大义
  - date: 1580
    title_zh: 撰宗旨凡例比类推求
    rationale: 春秋大义数十炳如日星须明简类例使诛乱讨贼内夏外夷之法可守
- id: guji-王樵-endeavor-2
  title_zh: 通群经著述以扶三纲五常
  summary: 兼治易礼作周易私录等发明性命名分扶持三纲五常以补春秋经世之用
  phases:
  - key: brewing
    name: 登第历官养经学之基
    labels:
      zh:
      - 仕学
      - 涵养
    start_date: 1547
    highlight_event_id: guji-王樵-event-jinshi
  - key: climax
    name: 著周易私录发明经旨
    labels:
      zh:
      - 著述
      - 明道
    start_date: 1575
    highlight_event_id: guji-王樵-event-zhousi
  - key: closure
    name: 经学并传笃实不移俗
    labels:
      zh:
      - 守正
      - 垂后
    start_date: 1590
    highlight_event_id: guji-王樵-event-zhousi
  decisions:
  - date: 1547
    title_zh: 由进士历官而不废经
    rationale: 天下无道礼乐征伐自诸侯大夫出须以经术匡时不为科举俗学所移
  - date: 1575
    title_zh: 先明易理再畅春秋
    rationale: 五经载道春秋圣人之用须理明义精然后可议褒贬权衡万变
events:
- id: guji-王樵-event-birth
  date: 1521
  year_of: 1521
  title_zh: 生于金坛
  description: 明嘉靖初年生于南直隶镇江府金坛王氏自幼力学志于经术
- id: guji-王樵-event-jinshi
  date: 1547
  year_of: 1547
  title_zh: 嘉靖丁未登进士
  description: 嘉靖二十六年登进士第历官中外以经学笃实称不趋时俗刻薄之论
- id: guji-王樵-event-zhousi
  date: 1575
  year_of: 1575
  title_zh: 著周易私录
  description: 研治群经著周易私录已著录发明性命天理为辑春秋之学理之基
- id: guji-王樵-event-jizhuan
  date: 1585
  year_of: 1585
  title_zh: 成春秋辑传及凡例
  description: 以朱子为宗博采诸家附论断成辑传十三卷宗旨三篇附论一篇凡例二卷传世
- id: guji-王樵-event-death
  date: 1599
  year_of: 1599
  title_zh: 万历年间卒
  description: 晚年以经学垂教卒于万历年间其书后入四库列经部春秋类称笃实明简
