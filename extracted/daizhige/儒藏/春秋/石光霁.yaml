    title_zh: 以五礼统书法别杂书法冠首
    rationale: 春秋因失礼而书，出乎礼则入乎春秋，故分吉凶军宾嘉以属辞比事
  - date: 1392
    title_zh: 以左公谷胡张为纲主间采啖赵
    rationale: 纂例详经略传与备传略经皆未备，故损益折衷便于初学
