person:
  qid: guji-程端学
  name_zh: 程端学
  names:
    zh: 程端学
    en: Cheng Duanxue
  lifespan:
    birth:
      date: 1278
      precision: year
      is_circa: true
      raw: 至元十五年左右生于庆元鄞县
    death:
      date: 1340
      precision: year
      is_circa: true
      raw: 至正初卒
  birth_date: 1278
  death_date: 1340
  era: 元朝
  reign_ref: 延祐至至正间
  archetype: 春秋辨疑经师
  dilemmas:
  - title_zh: 尊经还是徇传
    description_zh: 三传义例典故多自相违戾，若尽信传则经义反晦，若尽废传则无所据依，当以经证传而非以传害经
  - title_zh: 求是还是从众
    description_zh: 世儒尊左氏公谷如束高阁不敢议，我若直斥其伪妄必招诽谤，然为明圣人褒贬书法不得不辨
  lesson: 治经当以经文为据，传有可疑即当摘录辨正，不可因袭旧说而失是非
  summary_first_person: 吾鄞人也，少治春秋，见左氏公羊谷梁传注经文往往傅会穿凿，遂发愤稽经考传，著春秋本义或问及三传辨疑二十卷，欲存圣人正名定分之意于千载之下
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E4%B8%89%E4%BC%A0%E8%BE%A8%E7%96%91.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E4%B8%89%E4%BC%A0%E8%BE%A8%E7%96%91.md
endeavors:
- id: guji-程端学-endeavor-1
  title_zh: 攻驳三传撰成辨疑二十卷
  description_zh: 以经为本，摘录三传可疑之说，疏辨于下，兼纠义例书法与典故舛误
  phases:
  - key: brewing
    name: 少读春秋生疑
    labels:
      zh:
      - 研经
      - 蓄疑
    start_date: 1293
    highlight_event_id: guji-程端学-event-study
  - key: breakthrough
    name: 立以经证传之法
    labels:
      zh:
      - 立法
    start_date: 1310
    highlight_event_id: guji-程端学-event-jinshi
  - key: climax
    name: 分卷辨疑成书
    labels:
      zh:
      - 撰述
      - 辨正
    start_date: 1330
    highlight_event_id: guji-程端学-event-bianyi
  - key: closure
    name: 辨疑流传待校
    labels:
      zh:
      - 传世
    start_date: 1340
    highlight_event_id: guji-程端学-event-death
  decisions:
  - date: 1330
    title_zh: 兼采啖赵孙刘叶诸家而断以经文
    rationale: 不专主一家，汇尊王发微权衡三谳诸说，以经文是非为衡，传违经则弃传
  - date: 1332
    title_zh: 直断左传多伪不避时忌
    rationale: 左氏身为国史虽近真，然杂以小说家言，若不辨伪则书法不明，故宁受刚愎之讥亦须明言
- id: guji-程端学-endeavor-2
  title_zh: 明春秋书法授徒教学
  description_zh: 延祐登第后历官国子助教等，以春秋本义教授诸生，明正名定分之旨
  phases:
  - key: brewing
    name: 鄞越讲学养望
    labels:
      zh:
      - 授徒
    start_date: 1305
    highlight_event_id: guji-程端学-event-study
  - key: breakthrough
    name: 延祐五年登进士第
    labels:
      zh:
      - 科第
    start_date: 1318
    highlight_event_id: guji-程端学-event-jinshi
  - key: climax
    name: 入国子明经训士
    labels:
      zh:
      - 任官
      - 训士
    start_date: 1319
    highlight_event_id: guji-程端学-event-jiaoshou
  - key: closure
    name: 归老著述以终
    labels:
      zh:
      - 归隐
    start_date: 1335
    highlight_event_id: guji-程端学-event-bianyi
  decisions:
  - date: 1319
    title_zh: 以春秋大义施于国学
    rationale: 经义不明则是非不别，欲使后生知褒贬不在日月名字之琐例而在事理本身
  - date: 1335
    title_zh: 致仕归鄞专力著述
    rationale: 官守有限而经义无穷，不如归里删定本义或问辨疑诸稿以惠来学
events:
- id: guji-程端学-event-birth
  date: 1278
  year_of: 1278
  title_zh: 生于庆元鄞县
  description_zh: 至元十五年左右生于鄞县程氏，少颖悟致力于经学尤专春秋
- id: guji-程端学-event-study
  date: 1293
  year_of: 1293
  title_zh: 潜心春秋广览三传注疏
  description_zh: 遍读左氏公羊谷梁及杜预何休范宁诸注，兼及啖助赵匡孙复刘敞叶梦得诸家，始生疑辨之志
- id: guji-程端学-event-jinshi
  date: 1318
  year_of: 1318
  title_zh: 延祐五年登进士第
  description_zh: 以春秋经义中式，授国子监助教等官，名重一时
- id: guji-程端学-event-jiaoshou
  date: 1319
  year_of: 1319
  title_zh: 任国子助教讲明大义
  description_zh: 在官以春秋本义训迪诸生，强调正名定分求情责实别是非明善恶之旨
- id: guji-程端学-event-bianyi
  date: 1330
  year_of: 1330
  title_zh: 撰成春秋三传辨疑二十卷
  description_zh: 摘录隐公元年至经文所涉三传可疑之说，以欧阳修黄泽刘敞等说参证辨正，专攻三传义例典故之失
- id: guji-程端学-event-death
  date: 1340
  year_of: 1340
  title_zh: 卒于鄞里书稿流传
  description_zh: 至正初卒，遗稿有春秋本义或问辨疑等，后通志堂经解刊本义或问，辨疑赖吴玉墀家藏及永乐大典校补得全，四库馆臣录其说备采
