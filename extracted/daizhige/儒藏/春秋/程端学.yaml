  dilemmas:
  - 屈经从传与废传说经之间的权衡
  - 夏时周月之辨中坚守天时人事之常
  lesson: 取诸家之长而知其短，奉若天道以读春秋，防民之欲而约于义理
  summary_first_person: 吾程端学，鄞人也，延祐进士，辑春秋本义，复作或问十卷，明去取之意，主夏时正朔以斥周正之误，欲使后人知礼之所在而克己复礼
