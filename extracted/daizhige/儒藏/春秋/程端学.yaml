endeavors:
- id: guji-程端学-endeavor-1
  title_zh: 辑春秋本义以立褒贬之法
  summary: 削鲁史之合于礼者笔其不合于礼者以训后世
  phases:
  - key: brewing
    name: 潜心三传博采诸儒
    labels:
      zh:
      - 潜心
      - 博采
    start_date: 1310-01-01
    highlight_event_id: guji-程端学-event-jinshi
  - key: breakthrough
    name: 辑成本义明笔削大义
    labels:
      zh:
      - 辑述
      - 立教
    start_date: 1325-01-01
    highlight_event_id: guji-程端学-event-benyi
  - key: closure
    name: 本义或问相辅而行
    labels:
      zh:
      - 成书
      - 垂训
    start_date: 1330-01-01
    highlight_event_id: guji-程端学-event-huowen
  decisions:
  - date: 1325-01-01
    title_zh: 断以事立教不在年月时日之间
    rationale: 年月所以次先后而已，立教在其事，防欲约于义理之中
  - date: 1328-01-01
    title_zh: 取杜氏鲁史本号说削余家命名训诂
    rationale: 古人简质即物取名，何必研精覃思转相训诂
- id: guji-程端学-endeavor-2
  title_zh: 作春秋或问以辨诸家得失
  summary: 历举张洽左氏诸说之得失，明夏时冠月之志
  phases:
  - key: brewing
    name: 考平王之终辨春秋之始
    labels:
      zh:
      - 考始
      - 明义
    start_date: 1326-01-01
    highlight_event_id: guji-程端学-event-benyi
  - key: climax
    name: 力主夏时痛斥周正改时易月
    labels:
      zh:
      - 夏时
      - 正朔
    start_date: 1330-01-01
    highlight_event_id: guji-程端学-event-huowen
  - key: closure
    name: 或问十卷分经传十公而传世
    labels:
      zh:
      - 辨正
      - 传世
    start_date: 1332-01-01
    highlight_event_id: guji-程端学-event-huowen
  decisions:
  - date: 1330-01-01
    title_zh: 坚主夏时冠周月说不从左氏王周正
    rationale: 天时无迁改之理，变易四时则分至启闭皆舛，故以夏正数月为断
  - date: 1331-01-01
    title_zh: 掊击张洽之传及左氏伪撰事实
    rationale: 伸己说必废传以说经，然取其长知其短方为正大
events:
- id: guji-程端学-event-birth
  title_zh: 生于庆元鄞县
  date: 1278-01-01
  year_of: 1278
  place_zh: 庆元路鄞县
  description: 至元十五年生，字时叔，笃志经学
- id: guji-程端学-event-jinshi
  title_zh: 延祐五年登进士第
  date: 1318-01-01
  year_of: 1318
  place_zh: 大都
  description: 登第授国史院编修，迁国子助教，太常博士，专治春秋
- id: guji-程端学-event-benyi
  title_zh: 辑春秋本义
  date: 1325-01-01
  year_of: 1325
  place_zh: 鄞县
  description: 辑春秋本义，明笔削褒贬之义，为或问之本
- id: guji-程端学-event-huowen
  title_zh: 成春秋或问十卷
  date: 1330-01-01
  year_of: 1330
  place_zh: 鄞县
  description: 自隐公至哀公分卷设为或问，辨夏时周正，攻张洽左氏之失，与本义相辅而行
- id: guji-程端学-event-death
  title_zh: 卒于元统二年
  date: 1334-01-01
  year_of: 1334
  place_zh: 鄞县
  description: 卒后或问与本义并传，四库列于经部春秋类，纪昀等称其持论多正大
