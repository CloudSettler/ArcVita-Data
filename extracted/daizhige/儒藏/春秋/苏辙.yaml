  decisions:
  - date: 1072-01-01
    title_zh: 化谪厄为治经
    rationale: 谪居高安无事即览诸家说以义裁之不以迁谪废学养浩然之气
  - date: 1094-01-01
    title_zh: 正王介甫毁经之失
    rationale: 介甫以宰相解经诋春秋为断烂朝报使士不得学实由诸儒讲解不明故当正其得失以存孔子遗言
events:
- id: guji-苏辙-event-birth
  date: 1039-03-18
  year_of: 1039
  title_zh: 出生眉山苏氏
  description: 生于眉州眉山为苏洵次子苏轼之弟少与兄齐名后以文名显世称颍滨先生
- id: guji-苏辙-event-jijie-chugao
  date: 1072-06-01
  year_of: 1072
  title_zh: 熙宁谪高安初撰集解
  description: 自熙宁谪居高安览孙明复以下诸家之说裁之以义初成春秋集解十二卷不尽弃三传
- id: guji-苏辙-event-ruzhi
  date: 1086-03-01
  year_of: 1086
  title_zh: 入朝侍讲经筵
  description: 元祐入朝历起居舍人中书舍人兼侍讲以经学论事守正不阿为士林所重
- id: guji-苏辙-event-nanqian
  date: 1094-05-01
  year_of: 1094
  title_zh: 绍圣南迁三易其地
  description: 绍圣之初迁于南方凡三易地暇辄取前说观之得其非随改之不以流离废定稿之志
- id: guji-苏辙-event-longchuan-dinggao
  date: 1099-11-08
  year_of: 1099
  title_zh: 龙川白云桥定稿
  description: 卜居龙川白云桥杜门无事所改定洒然而笑自谓无憾于元符二年闰九月八日作引付传
- id: guji-苏辙-event-death
  date: 1112-10-25
  year_of: 1112
  title_zh: 卒于许州
  description: 政和二年卒于许州享年七十四著述有春秋集解栾城集等行于世经学深邃开东莱渊源
