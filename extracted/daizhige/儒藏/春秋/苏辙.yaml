  decisions:
  - date: 1072-01-01
    title_zh: 以左氏为本参取公谷
    rationale: 丘明授经仲尼身为国史躬览载籍故以其史为本孔子予夺不明尽者参公谷啖赵诸人方通
  - date: 1099-11-08
    title_zh: 杜门改定付子传学
    rationale: 南荒无可与论者恐前说有非屡改至无憾属子传之后生使绝学有续不以一时毁誉废经
- id: guji-苏辙-endeavor-2
  title_zh: 历谪守道授徒传学
  summary: 历官祠部起居舍人中书舍人兼侍讲因议论屡谪高安筠州至南方不以荣辱废学以颍滨家学开后进渊源
