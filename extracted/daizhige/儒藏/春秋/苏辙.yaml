  dilemmas:
  - 尽弃三传还是以史为本参取众说
  - 谪居困厄废学自弃还是裁义著述以续绝学
  lesson: 学不学复众人之所过循理而言要之于通不立门户不妄毁经
  summary_first_person: 我少治春秋不从世人尽弃三传独信左氏为鲁史本以作经参以公谷啖赵诸家熙宁谪高安始览众说裁之以义为集解十二卷十数年每有暇辄改定绍圣南迁三易其地卜居龙川杜门定稿以付子逊愿后生有闻使千岁绝学有续
