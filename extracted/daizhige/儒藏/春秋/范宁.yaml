endeavors:
- id: guji-范宁-endeavor-1
  title_zh: 集解春秋穀梁传
  summary: 商略名例，考合三传得失，作集解以明穀梁善于经之义
  phases:
  - key: brewing
    name: 少治经学有志春秋
    labels:
      zh: 研读三传
    start_date: '0360'
    highlight_event_id: guji-范宁-event-study
  - key: breakthrough
    name: 与门徒商略名例
    labels:
      zh: 别为略例百余条
    start_date: 0385
    highlight_event_id: guji-范宁-event-jijie
  - key: climax
    name: 集解成篇传示同异
    labels:
      zh: 名曰春秋穀梁传集解
    start_date: 0395
    highlight_event_id: guji-范宁-event-jijie
  - key: closure
    name: 授子弟以传家学
    labels:
      zh: 范泰范雍等承学
    start_date: '0400'
    highlight_event_id: guji-范宁-event-jijie
  decisions:
  - date: 0385
    title_zh: 专治穀梁兼考三传
    rationale: 以穀梁善于经而世说妄引三传，故折衷是非以归经旨
  - date: 0395
    title_zh: 别立略例以统名例
    rationale: 名例不正则褒贬不明，故先明例后解经以彰黜陟
- id: guji-范宁-endeavor-2
  title_zh: 守豫章兴学崇儒
  summary: 出守豫章，设庠序敦礼教，驳斥浮虚谶纬以振兴儒学
  phases:
  - key: brewing
    name: 朝野崇玄浮虚成风
    labels:
      zh: 目睹礼坏乐崩
    start_date: '0370'
    highlight_event_id: guji-范宁-event-taishou
  - key: breakthrough
    name: 出为豫章太守
    labels:
      zh: 兴学设教
    start_date: 0378
    highlight_event_id: guji-范宁-event-taishou
  - key: climax
    name: 上书驳斥王弼何晏
    labels:
      zh: 黜虚崇实
    start_date: 0380
    highlight_event_id: guji-范宁-event-taishou
  - key: closure
    name: 政教大行于一方
    labels:
      zh: 拯颓纲继道统
    start_date: 0390
    highlight_event_id: guji-范宁-event-taishou
  decisions:
  - date: 0378
    title_zh: 以经术为政兴庠序
    rationale: 欲拯颓纲必先正人心，故以礼教化俗使知劝诫
  - date: 0380
    title_zh: 上疏斥玄虚尊孔孟
    rationale: 虚谈误国而经义不明，故黜谶纬浮华以弘圣道
