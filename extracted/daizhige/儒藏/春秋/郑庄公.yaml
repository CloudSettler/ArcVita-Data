  decisions:
  - date: '-0717'
    title_zh: 不朝抗夺政
    rationale: 王取邬刘蒍邘之田又尽夺政事则朝而无位故以不朝明直待王兴师而后以兵自救
  - date: '-0707'
    title_zh: 命二拒先犯而止祝聃追王
    rationale: 料蔡卫陈无斗心先犯必奔以乱王卒可集事既胜则以不欲多上人为辞禁追陵天子以全臣节
- id: guji-郑庄公-endeavor-2
  title_zh: 和王室诛子颓迎惠王
  description: 子颓奉五大夫作乱出奔温卫郑伯和室不克遂奉王居栎邬与虢叔同入王城杀乱迎还
  phases:
  - key: brewing
    name: 五大夫乱作
    labels:
      zh: 蓄势
    start_date: '-0675'
    highlight_event_id: guji-郑庄公-event-zitui
  - key: breakthrough
    name: 和室奉王
    labels:
      zh: 破局
    start_date: '-0674'
    highlight_event_id: guji-郑庄公-event-fengwang
  - key: climax
    name: 胥命同伐
    labels:
      zh: 高潮
    start_date: '-0673'
    highlight_event_id: guji-郑庄公-event-navang
  - key: closure
    name: 享王备乐取宝还
    labels:
      zh: 收束
    start_date: '-0673'
    highlight_event_id: guji-郑庄公-event-navang
  decisions:
  - date: '-0674'
    title_zh: 和王室而执燕仲父奉王归栎
    rationale: 和而不克则直以王归居郑邑以存王统待虢共举而名正
  - date: '-0673'
    title_zh: 闻歌舞乐祸遂约虢叔纳王
    rationale: 子颓歌舞不倦临祸忘忧天弃之时不可失故自圉门入诛颓及五大夫而享王备乐
events:
- id: guji-郑庄公-event-birth
  date: '-0757'
  year_of: -757
  title_zh: 寤生嗣郑
  description: 郑武公姜氏子寤生继立为郑伯后为平王桓王卿士左右王室
- id: guji-郑庄公-event-jiaozhi
  date: '-0720'
  year_of: -720
  title_zh: 周郑交质取麦禾
  description: 隐公三年王子狐质郑公子忽质周郑祭足取温之麦成周之禾周郑交恶君子讥信不由中
- id: guji-郑庄公-event-duozheng
  date: '-0717'
  year_of: -717
  title_zh: 王取四邑田夺政不朝
  description: 桓十一年王取邬刘蒍邘之田与郑苏忿生之田桓五年尽夺郑伯政郑伯不朝王以诸侯伐郑
- id: guji-郑庄公-event-xuge
  date: '-0707'
  year_of: -707
  title_zh: 繻葛之战射王中肩
  description: 郑以鱼丽之陈命左右拒先犯蔡卫陈王卒大乱祝聃射王中肩郑伯使祭足劳王问左右
- id: guji-郑庄公-event-laowang
  date: '-0707'
  year_of: -707
  title_zh: 夜使劳王存臣礼
  description: 战后夜郑伯使祭足劳王且问左右敛军不追以君子不欲多上人自解示不敢陵天子
- id: guji-郑庄公-event-zitui
  date: '-0675'
  year_of: -675
  title_zh: 子颓据王城作乐
  description: 庄十九年蒍国边伯等奉子颓伐王不克奔温卫立子颓享五大夫乐及遍舞郑伯闻而忧之
- id: guji-郑庄公-event-fengwang
  date: '-0674'
  year_of: -674
  title_zh: 和王室奉王居栎入邬
  description: 庄二十年郑伯和王室不克执燕仲父以王归居栎入邬入成周取宝器而还
- id: guji-郑庄公-event-navang
  date: '-0673'
  year_of: -673
  title_zh: 胥命弭同伐诛子颓迎惠王
  description: 庄二十一年胥命于弭同伐王城郑伯自圉门入虢叔自北门入杀子颓及五大夫享王于阙西辟乐备
- id: guji-郑庄公-event-death
  date: '-0701'
  year_of: -701
  title_zh: 郑庄公卒
  description: 在位四十三年卒庄公克段正内以王命讨宋郕兴外威繻葛后复以勤王定周乱为春秋小霸之基
