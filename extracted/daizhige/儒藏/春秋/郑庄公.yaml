  lesson: 假王命以正不庭可兴一时事功陵王室而射王中肩终亏臣节勤王纳王则名义俱得
  summary_first_person: 吾为郑庄公寤生继父武公为平王卿士而与周室交质以麦禾交恶继而见夺政失礼终至繻葛陈鱼丽以抗王师不敢陵上而仅自救后闻子颓乐祸与虢叔同纳惠王诛乱而还宝器一生以礼信起以兵强显以勤王终
