endeavors:
- id: guji-郑玉-endeavor-1
  title_zh: 折衷诸儒撰春秋阙疑四十五卷
  description: 博采左氏公谷及历代诸儒之论，以经为纲大字掲上，以传为目小字疏下，合于经理者取之，经阙则阙传异则两存
  phases:
  - key: brewing
    name: 博采诸儒窥测圣意
    labels:
      zh: 发愤起意
    start_date: 1330
    highlight_event_id: guji-郑玉-event-zhushu
  - key: breakthrough
    name: 以经为纲以传为目体例初定
    labels:
      zh: 体例初定
    start_date: 1345
    highlight_event_id: guji-郑玉-event-zhushu
  - key: climax
    name: 至正十五年序成全书
    labels:
      zh: 序成全书
    start_date: 1355-09-01
    highlight_event_id: guji-郑玉-event-xu1355
  - key: closure
    name: 阙疑以俟知者传世
    labels:
      zh: 阙疑传世
    start_date: 1355-09-01
    highlight_event_id: guji-郑玉-event-xu1355
  decisions:
  - date: 1345
    title_zh: 仿纲目体例以经为纲
    rationale: 叙事专于左氏附以公谷，立论先于公谷参以诸儒，合于经者取之合于理者取之
  - date: 1355-09-01
    title_zh: 经阙则阙不强通
    rationale: 圣人辞简义奥残阙维多，与其强通所不可通以取讥当世，孰若阙所当阙以俟知于后人
- id: guji-郑玉-endeavor-2
  title_zh: 辞翰林待制守节不屈而死
  description: 元末除翰林待制以疾辞，隐居师山讲学，明兵入徽州守将要致之，不屈而死，学者称师山先生
  phases:
  - key: brewing
    name: 隐居歙县讲学师山
    labels:
      zh: 隐居讲学
    start_date: 1330
    highlight_event_id: guji-郑玉-event-cishi
  - key: breakthrough
    name: 除翰林待制以疾辞
    labels:
      zh: 辞官守志
    start_date: 1350
    highlight_event_id: guji-郑玉-event-cishi
  - key: climax
    name: 明兵入徽要致不屈
    labels:
      zh: 不屈守节
    start_date: 1357
    highlight_event_id: guji-郑玉-event-buju
  - key: closure
    name: 守节而死称为师山先生
    labels:
      zh: 守节而终
    start_date: 1358
    highlight_event_id: guji-郑玉-event-death
  decisions:
  - date: 1350
    title_zh: 以疾辞翰林待制
    rationale: 不慕荣进守儒者出处之节，不以仕进易隐操
  - date: 1357
    title_zh: 明兵要致坚不屈从
    rationale: 义不事二姓，宁守节而死不以身屈于威逼
