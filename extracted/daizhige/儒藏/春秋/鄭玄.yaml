  - key: closure
    name: 學成四方從遊門盈
    labels:
      zh: 收束
    start_date: 128
    highlight_event_id: guji-鄭玄-event-death
  decisions:
  - date: 124
    title_zh: 謝病歸里專事著述
    rationale: 朝政昏亂徵辟不就唯以注經講學為己任使後世有所據依
  - date: 0197
    title_zh: 拒袁紹劫請守道不屈
    rationale: 袁紹強致隨軍吾不附逆不背義病卒以全節傳學不絕
