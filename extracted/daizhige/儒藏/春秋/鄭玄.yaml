  decisions:
  - date: 0192
    title_zh: 決意為穀梁作辯
    rationale: 何休以日與不日遠近異詞等說抑穀梁義多不通若不辨則經義遂乖故舉其謬而釋之
  - date: 0192
    title_zh: 以經證經不為黨爭
    rationale: 直據盟會戰伐葬祭本事明褒貶所在使理自見不徒逞口舌
- id: guji-鄭玄-endeavor-2
  title_zh: 遍注群經教授後學
  summary: 隱居不仕遍注詩書禮易論語等以傳聖學弟子盈門
