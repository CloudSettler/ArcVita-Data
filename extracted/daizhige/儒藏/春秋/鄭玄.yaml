  lesson: 守正以通經辨謬以起廢學在致用不在空言
  summary_first_person: 吾鄭玄字康成北海高密人也少嗜學西師馬融盡得其傳見何休廢穀梁故作起廢疾以正之晚年遍注群經以授門人願以經術存世道人心
