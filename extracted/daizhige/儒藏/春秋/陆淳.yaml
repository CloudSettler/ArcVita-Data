    description: 左公谷各执一辞啖赵新义并起当并存旧说以朱墨别是非还是曲徇一家
  - title_zh: 微旨当显还是当隐
    description: 圣心皇极之理介于疑似之间当委曲发明以端本清源还是直书贬绝以使乱臣知惧
  lesson: 集三传啖赵之说以明圣心端本清源则褒贬之义可贯于灵府
  summary_first_person: 吾陆淳字敦信吴人也师啖助赵匡而传春秋掇其微旨总为三卷并存三传旧说以朱墨别当否欲使后学齐心极虑得端本清源之意而周流二百四十二年之义
