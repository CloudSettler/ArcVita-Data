  archetype: 经师辨疑者
  dilemmas:
  - title_zh: 尊经还是徇传
    description: 三传各守专门是非相攻，当从经文年月裁其得失
  - title_zh: 信古还是疑古
    description: 左氏事有本而论多疏，公谷曲说尤甚，疑之过则愈辨愈非
  lesson: 守师说而不盲从，依经文以辨传失，疑古须有据
  summary_first_person: 我是陆淳，吴郡人，承啖助赵匡之学，排科条为纂例，缕传文为辨疑，复作微旨以明笔削，愿以经文正三传之失
