endeavors:
- id: guji-陆淳-endeavor-1
  title_zh: 师承啖赵排比纂例
  summary_zh: 受啖助排比科条自发笔削之旨，集三传可入条例者为纂例诸篇，明取舍大义
  phases:
  - key: brewing
    name: 吴中问道
    labels:
      zh:
      - 师承
      - 治经
    start_date: '0760'
    highlight_event_id: guji-陆淳-event-study
  - key: breakthrough
    name: 排条入例
    labels:
      zh:
      - 纂例
      - 科条
    start_date: 0780
    highlight_event_id: guji-陆淳-event-compilation
  - key: closure
    name: 集传初成
    labels:
      zh:
      - 集传
      - 成书
    start_date: 0790
    highlight_event_id: guji-陆淳-event-compilation
  decisions:
  - date: 0780
    title_zh: 三传可入例者归纂例
    rationale: 繁文可以例包则但举例，不复繁释，以省学者之惑
  - date: 0785
    title_zh: 移传文于本经之下
    rationale: 三传叙事先后于经者移附本经，释例或发事首或入总传，使览者易观
- id: guji-陆淳-endeavor-2
  title_zh: 缕列传文著辨疑微旨
  summary_zh: 举传文不入纂例者一字一句而诘之，啖赵之说著为辨疑，又申微旨以见褒贬
  phases:
  - key: brewing
    name: 随文起疑
    labels:
      zh:
      - 疑难
      - 随文
    start_date: 0785
    highlight_event_id: guji-陆淳-event-compilation
  - key: breakthrough
    name: 攻驳三传
    labels:
      zh:
      - 辨疑
      - 驳正
    start_date: 0790
    highlight_event_id: guji-陆淳-event-compilation
  - key: climax
    name: 辨疑七篇成
    labels:
      zh:
      - 成书
      - 凡例十七条
    start_date: 0795
    highlight_event_id: guji-陆淳-event-compilation
  - key: closure
    name: 柳铭唐志传学
    labels:
      zh:
      - 墓志
      - 传世
    start_date: 0805
    highlight_event_id: guji-陆淳-event-death
  decisions:
  - date: 0790
    title_zh: 以赵说为主啖说为次
    rationale: 推两家之例悉随文辨之，无啖赵曰者即例可晓，存精核以补汉儒未发
  - date: 0795
    title_zh: 立凡例十七条删繁
    rationale: 公谷何以曷为及托始记异之类皆繁文，于理不安则删，时有取者但为属文
