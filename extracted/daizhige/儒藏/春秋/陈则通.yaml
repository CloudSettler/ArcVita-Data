endeavors:
- id: guji-陈则通-endeavor-1
  title_zh: 櫽括诸传撰春秋提纲十卷
  description_zh: 分征伐朝聘盟会杂例四门以类相从别成史论一格
  phases:
  - key: brewing
    name: 博览数十百家茫无津涯而发凡
    labels:
      zh: 博览诸传
    start_date: 1290
    highlight_event_id: guji-陈则通-event-1
  - key: breakthrough
    name: 立四门分类参校始终而成体系
    labels:
      zh: 四门立例
    start_date: 1310
    highlight_event_id: guji-陈则通-event-1
  - key: climax
    name: 十卷告成闳肆纵横纯为史论
    labels:
      zh: 十卷告成
    start_date: 1320
    highlight_event_id: guji-陈则通-event-1
  - key: closure
    name: 旴江胡光世锓梓广传同学共读
    labels:
      zh: 锓梓广传
    start_date: 1330
    highlight_event_id: guji-陈则通-event-2
  decisions:
  - date: 1310
    title_zh: 不泥书法以事类为例
    rationale: 考究成败得失之由发明大防别于他家说书法者
  - date: 1320
    title_zh: 托胡光世序而刊行以广同学
    rationale: 闻善相告见善相示不敢自秘以发经之蕴
- id: guji-陈则通-endeavor-2
  title_zh: 论王伯升降明春秋大防得失
  description_zh: 论单伯会伐始郑争陈争许终以明周室兴废与伯业盛衰
  phases:
  - key: brewing
    name: 考王臣会伐论征伐自诸侯出之始
    labels:
      zh: 王臣会伐
    start_date: 1310
    highlight_event_id: guji-陈则通-event-1
  - key: breakthrough
    name: 辨齐晋楚争郑为要领以识形势兵势
    labels:
      zh: 争郑要领
    start_date: 1315
    highlight_event_id: guji-陈则通-event-3
  - key: climax
    name: 断陈许从违系伯弱而诗绝春秋绝
    labels:
      zh: 争陈争许
    start_date: 1320
    highlight_event_id: guji-陈则通-event-3
  - key: closure
    name: 排灾异事应守夏正而胜安国之见
    labels:
      zh: 排谬守正
    start_date: 1325
    highlight_event_id: guji-陈则通-event-3
  decisions:
  - date: 1315
    title_zh: 以单伯会伐宋为征伐倒置之始
    rationale: 天子之权一失再失召陵城濮移于齐晋不可复挽
  - date: 1320
    title_zh: 深排汉儒灾异事应之谬
    rationale: 坚守夏正而不用符应附会其见固胜于胡安国
