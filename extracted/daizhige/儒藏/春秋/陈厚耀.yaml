  summary_first_person: 我是陈厚耀字泗源泰州人康熙丙戌进士初官苏州府教授以通算入直内廷改授检讨终右谕德我见杜预长历以干支递排迁就闰月小建遂备引汉晋隋唐宋元诸史及大衍诸说为历证立古历表求历元逐年推春秋二百四十二年朔闰以经传干支为证定隐公元年正月庚辰朔较杜历退两月著春秋长历十卷以补阙正讹
