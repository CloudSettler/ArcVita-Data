    title_zh: 以孔氏正义为纲旁及他书
    rationale: 杜氏原本未睹则以现存孔疏为最近古之可据者
  - date: 1716-08-01
    title_zh: 经传有名而世系无考者别为杂人
    rationale: 依杜例存其名号而不强系以存阙疑之义
  - date: 1717-12-01
    title_zh: 杜说不详则曲从杜氏
    rationale: 宁守师传以存古人之谨不以新证夺旧义
