endeavors:
- id: guji-顾奎光-endeavor-1
  title_zh: 撰述春秋随笔二卷
  description: 不载经文偶有所得则录之辨达例特笔正三传胡氏苛谬以求平允近理
  phases:
  - key: brewing
    name: 研读三传起疑
    labels:
      zh: 博览左公谷注疏
    start_date: 1755-01-01
    highlight_event_id: guji-顾奎光-event-1
  - key: breakthrough
    name: 立例从义起之说
    labels:
      zh: 悟达例特笔之分
    start_date: 1765-01-01
    highlight_event_id: guji-顾奎光-event-2
  - key: climax
    name: 随笔编定成帙
    labels:
      zh: 上下二卷论桓庄僖事
    start_date: 1778-01-01
    highlight_event_id: guji-顾奎光-event-2
  - key: closure
    name: 并入然疑录见收四库
    labels:
      zh: 菁华尽在此两卷
    start_date: 1779-01-01
    highlight_event_id: guji-顾奎光-event-3
  decisions:
  - date: 1765-06-01
    title_zh: 不立例释经
    rationale: 义有变通而例多拘碍勉强傅会故因经求义例从义起
  - date: 1778-10-01
    title_zh: 只录所得不载经文
    rationale: 随得随录以存平允之论不为琐杂所掩故名随笔
- id: guji-顾奎光-endeavor-2
  title_zh: 出守泸溪知县与编然疑录
  description: 以知县理事兼治经学编然疑录载说春秋诸条务求事理人心之安
  phases:
  - key: brewing
    name: 无锡力学入仕
    labels:
      zh: 究心经义
    start_date: 1750-01-01
    highlight_event_id: guji-顾奎光-event-birth
  - key: breakthrough
    name: 除授泸溪知县
    labels:
      zh: 治民兼治学
    start_date: 1772-01-01
    highlight_event_id: guji-顾奎光-event-1
  - key: climax
    name: 以政验经论小国告命
    labels:
      zh: 知理更知势
    start_date: 1776-01-01
    highlight_event_id: guji-顾奎光-event-2
  - key: closure
    name: 然疑录成四库著录
    labels:
      zh: 以平允服人心
    start_date: 1779-01-01
    highlight_event_id: guji-顾奎光-event-3
  decisions:
  - date: 1772-03-01
    title_zh: 守官泸溪不废著述
    rationale: 居官得见民情国势故论春秋责被伐者必谅其势不为空言
  - date: 1779-01-01
    title_zh: 以随笔菁华归然疑录
    rationale: 然疑录颇琐杂故摘菁华别为两卷以传笔削大防
