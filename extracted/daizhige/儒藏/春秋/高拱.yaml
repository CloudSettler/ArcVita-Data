  dilemmas:
  - 以匹夫假天子南面之权行赏罚是否反陷无君作威之罪
  - 鲁史纪事当用当代周正还是追改前代夏时
  - 褒贬当准文武道法大义还是求之片言只字之间
  lesson: 明天子之义以正君臣之分则乱臣贼子无所借口而万世纲常可维
  summary_first_person: 余高拱字肃卿新郑人嘉靖辛丑进士历吏部尚书中极殿大学士谥文襄余见宋以来说春秋者穿凿傅会欲尊圣人而反以天自处故作春秋正旨以明天子之事谓春秋继二雅表王迹据文武典制以存周号令非孔子自为天子行赏罚庶几君臣之义明而圣人之志显
