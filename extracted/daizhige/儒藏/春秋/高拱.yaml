  decisions:
  - date: '1572'
    title_zh: 据文武典制修明经旨
    rationale: 天子之事即周天子事非孔子自行赏罚故当述而不作因鲁史存周礼而修之
  - date: '1573'
    title_zh: 断用周正不取胡传夏时
    rationale: 纪当代事必用当代正朔兼日南至无冰陨霜诸证断非夏正故力辟以夏时冠周月之说
