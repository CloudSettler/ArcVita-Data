person:
  qid: guji-高闶
  name_zh: 高闶
  names:
    zh: 高闶
    en: Gao Kang
  lifespan:
    birth:
      date: '1100'
      precision: year
      is_circa: true
      raw: 约北宋末生于明州鄞县
    death:
      date: '1155'
      precision: year
      is_circa: true
      raw: 约绍兴末家食中寿而殁
  birth_date: '1100'
  death_date: '1155'
  era: 南宋
  reign_ref: 宋高宗绍兴
  archetype: 直道经师
  dilemmas:
  - 直道事君见忤于时宰与全身保家之择
  - 宗程子春秋传为本与据经考史正其失之衡
  - 太学司成显用与杜门家食专志著述之分
  lesson: 以直道立身，以经世立法，称师而知所本，又能考据精详而正其失
  summary_first_person: 我高闶字抑崇，明州鄞县人，少入上庠登舍选，绍兴改元赐进士出身，继而为太学少司成，擢礼部侍郎，以直道忤时宰一斥不复，杜门家食，日有定课，专以程氏为本博采诸儒成春秋集注四十卷，托鲁史以明百王不易之法，愿后人通其文求其义得其意法其用
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E9%AB%98%E6%B0%8F%E6%98%A5%E7%A7%8B%E9%9B%86%E6%B3%A8.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E6%98%A5%E7%A7%8B/%E9%AB%98%E6%B0%8F%E6%98%A5%E7%A7%8B%E9%9B%86%E6%B3%A8.html
endeavors:
- id: guji-高闶-endeavor-1
  title_zh: 太学立教直道事君
  summary_zh: 上舍出身入太学为少司成，车驾幸学讲易见擢贰卿，以直道忤秦桧见斥家食
  phases:
  - key: brewing
    name: 上舍登名
    labels:
      zh: 太学舍选
    start_date: '1131'
    highlight_event_id: guji-高闶-event-jinshi
  - key: breakthrough
    name: 少司成定规
    labels:
      zh: 太学立教
    start_date: '1143'
    highlight_event_id: guji-高闶-event-taixue
  - key: climax
    name: 讲易擢卿忤宰见斥
    labels:
      zh: 直道一斥
    start_date: '1144'
    highlight_event_id: guji-高闶-event-jiangyi
  decisions:
  - date: '1143'
    title_zh: 应选少司成裁定学规
    rationale: 高宗初建太学需名儒表率，士子云集故以学规正士风
  - date: '1144'
    title_zh: 不附时宰出知筠州不赴
    rationale: 宁以直道见斥家食，不以附合求显用，全出处之义
- id: guji-高闶-endeavor-2
  title_zh: 集注春秋明经世大法
  summary_zh: 耽玩遗经以程传为本博采唐宋诸家，家食累年成集注四十卷，黄州刊刻行世
  phases:
  - key: brewing
    name: 耽玩遗经
    labels:
      zh: 废学独治
    start_date: '1144'
    highlight_event_id: guji-高闶-event-jiangyi
  - key: breakthrough
    name: 宗程博采
    labels:
      zh: 集注体成
    start_date: '1150'
    highlight_event_id: guji-高闶-event-zhushu
  - key: climax
    name: 家食成书
    labels:
      zh: 杜门定课
    start_date: '1150'
    highlight_event_id: guji-高闶-event-zhushu
  - key: closure
    name: 黄州刊刻行世
    labels:
      zh: 学者重之
    start_date: '1201'
    highlight_event_id: guji-高闶-event-kanxing
  decisions:
  - date: '1150'
    title_zh: 直引伊川序不更一辞以为本
    rationale: 称师知本以明万世通行之法，又如子纠长幼据史记荀子正程传之失
  - date: '1150'
    title_zh: 杜门屏居日有定课成书
    rationale: 一斥不复不以事物自撄，晚年精力尽在是书以明褒贬经世之旨
events:
- id: guji-高闶-event-birth
  title_zh: 生于明州鄞县
  date: '1100'
  year_of: 1100
  description: 四明高氏，天资纯笃济以勤敏，师友渊源，得伊洛之传
- id: guji-高闶-event-jinshi
  title_zh: 绍兴元年上舍赐进士第
  date: '1131'
  year_of: 1131
  description: 建炎二年升补上舍，绍兴改元德音免殿试赐同进士出身，始有盛名
- id: guji-高闶-event-taixue
  title_zh: 绍兴十三年为太学少司成
  date: '1143'
  year_of: 1143
  description: 高宗初建太学遴择名儒为少司成，士子云集，学之规则皆所裁定
- id: guji-高闶-event-jiangyi
  title_zh: 幸学讲易擢贰卿忤宰见斥
  date: '1144'
  year_of: 1144
  description: 车驾幸学讲易泰卦于上前擢礼部侍郎，以直道忤秦桧出知筠州不赴，家食累年
- id: guji-高闶-event-zhushu
  title_zh: 家食成春秋集注四十卷
  date: '1150'
  year_of: 1150
  description: 以程子传为本博采诸儒，正子纠长幼及刘盟地望之失，推明经世大法托始隐公
- id: guji-高闶-event-kanxing
  title_zh: 仲子知黄州刊刻楼钥序行世
  date: '1201'
  year_of: 1201
  description: 仲子得全知黄州取道稿刻之，楼钥嘉定四年作序，学者甚重，汇纂采取最多
- id: guji-高闶-event-death
  title_zh: 家食中寿而殁复官诸子
  date: '1155'
  year_of: 1155
  description: 杜门屏居风雨弗渝，中寿而殁，后汪公奏其学行出处诏复次对官诸子
