    highlight_event_id: guji-魏了翁-event-yaoyi
  decisions:
  - date: 1215
    title_zh: 定节录注疏体例
    rationale: 疏中日月名氏曲说烦重者刊除，名物度数削繁举要，以见左氏详于典制之长
  - date: 1220
    title_zh: 专取左氏不杂公谷
    rationale: 以杜预专门为法，去公谷异端，存经世大法传心要典之正
- id: guji-魏了翁-endeavor-2
  title_zh: 直言立朝抗权相弥远
  summary: 庆元登第入仕，轮对直陈时弊，抗史弥远擅政，屡贬靖州潭州，理宗即位召还，官至端明殿学士同签书枢密院事
  phases:
