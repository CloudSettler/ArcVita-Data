    title_zh: 上疏论史弥远专权
    rationale: 惧朝政偏私危社稷，宁以身试贬谪，不肯附和权门以保禄位
  - date: 1233
    title_zh: 应召还朝力辞要职
    rationale: 年病交迫而志在匡君，勉就论思之职，以行其经世之学
