  dilemmas:
  - 权相擅国而直言见忌，去就进退难全
  - 注疏繁琐而经义不明，删繁举要难得其衷
  lesson: 守正直言以立朝，删繁举要以明经，方不负经世传心之学
  summary_first_person: 吾蒲江魏了翁，字华父，号鹤山，庆元进士，历事宁理两朝，直言抗史弥远而屡遭贬逐，晚召还朝不及大用，惟裒集九经注疏为春秋左传要义等，以存经世大法传心要典之志
