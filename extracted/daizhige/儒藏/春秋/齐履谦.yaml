  dilemmas:
  - 三传专言褒贬与据事实书善恶自见之间何去何从
  - 分国编次便检与尊周大一统名分之间如何兼顾
  lesson: 合二十国史以统全经，据实分国而不苟泥褒贬，纲领自见
  summary_first_person: 吾乃大名齐履谦字伯恒，官至太史院使，尝为国子司业，疑世儒只工褒贬而遗诸国分合与春秋所以为春秋，遂合二十国史作春秋诸国统纪二十二篇，内鲁尊周外列五等，附小国亡国以备全经纲领，兼治历象易学以尽经世之志
  source_urls:
  - https://daizhige.org/儒藏/春秋/春秋诸国统纪.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/春秋/春秋诸国统纪.md
endeavors:
- id: guji-齐履谦-endeavor-1
  title_zh: 合二十国史撰春秋诸国统纪
  role_zh: 国子司业兼经学家
  summary_zh: 疑三传褒贬之蔽，合鲁周宋齐晋卫蔡陈郑曹秦薛杞滕莒邾许宿楚吴二十国史为统纪二十二篇以备诸家之阙
  phases:
  - key: brewing
    name: 疑褒贬积弊
    labels:
      zh: 经学反思
    start_date: 1300
    highlight_event_id: guji-齐履谦-event-teach
  - key: breakthrough
    name: 立内鲁尊周分国之例
    labels:
      zh: 体例初定
    start_date: 1315
    highlight_event_id: guji-齐履谦-event-teach
  - key: climax
    name: 延祐丁巳成书二十二篇
    labels:
      zh: 统纪告成
    start_date: 1317-06-01
    highlight_event_id: guji-齐履谦-event-tongji
  - key: closure
    name: 吴澄作序流布四方
    labels:
      zh: 序行于世
    start_date: 1318
    highlight_event_id: guji-齐履谦-event-tongji
  decisions:
  - date: 1315
    title_zh: 不主因鲁史从赴告别立分国统纪
    rationale: 以墨子百国春秋与百二十国宝书为据，谓今之春秋乃合二十国史以一统万之书，当分国汇编以见分合
  - date: 1317-06-01
    title_zh: 内鲁尊周外以五等爵为次楚吴僭王殿后
    rationale: 首鲁次周以示托鲁史寓王法，爵同以亲为序而霸者特列，以道名分而便寻览
- id: guji-齐履谦-endeavor-2
  title_zh: 治历象居太史以经世致用
  role_zh: 太史院使兼国子司业
  summary_zh: 由国子育才而进太史院使，考历数推日食，兼治易与春秋，务使经学与天文相参
  phases:
  - key: brewing
    name: 讲学国子笃志经学
    labels:
      zh: 育才讲经
    start_date: 1314
    highlight_event_id: guji-齐履谦-event-teach
  - key: breakthrough
    name: 授国子司业推步考历
    labels:
      zh: 历数参经
    start_date: 1316
    highlight_event_id: guji-齐履谦-event-teach
  - key: climax
    name: 进太史院使掌天文历法
    labels:
      zh: 太史掌历
    start_date: 1320
    highlight_event_id: guji-齐履谦-event-taishi
  - key: closure
    name: 易春秋二书并成遗惠后学
    labels:
      zh: 经历并传
    start_date: 1328
    highlight_event_id: guji-齐履谦-event-taishi
  decisions:
  - date: 1316
    title_zh: 以授时历推经传日食以辨阙误
    rationale: 经书日食三十六，以历推频月不应食与变交不食者当为传写之误，须据实考定而不曲从传注
  - date: 1320
    title_zh: 以经学入太史不废讲授著述
    rationale: 圣人经浑然无迹如天道，治历明时与解经训世本为一事，故居太史仍成易春秋之学
events:
- id: guji-齐履谦-event-birth
  title_zh: 生于大名路元城
  date: 1263
  year_of: 1263
  place_zh: 大名路元城
  description_zh: 齐履谦字伯恒生于大名，后笃志经学兼通天文历算
- id: guji-齐履谦-event-teach
  title_zh: 为国子司业讲授春秋
  date: 1316
  year_of: 1316
  place_zh: 大都国子监
  description_zh: 任国子司业，苦思深究不承陋袭故，于暇日叙类诸国统纪以备诸家之阙
- id: guji-齐履谦-event-tongji
  title_zh: 延祐四年夏著成春秋诸国统纪
  date: 1317-06-01
  year_of: 1317
  place_zh: 大都
  description_zh: 延祐丁巳夏六月乙未朔自书序文，成前二十篇据国史本春秋所据作，后二篇附小国亡国凡二十二篇，吴澄为之序
- id: guji-齐履谦-event-taishi
  title_zh: 官至太史院使考定历法
  date: 1320
  year_of: 1320
  place_zh: 大都太史院
  description_zh: 累迁至太史院使，事迹具元史本传，推历考日食兼成易春秋二书之学
- id: guji-齐履谦-event-death
  title_zh: 卒于元
  date: 1329
  year_of: 1329
  place_zh: 大都
  description_zh: 晚年以经学历学并传于世，四库馆臣录其统纪存之而略指瑕瑜
