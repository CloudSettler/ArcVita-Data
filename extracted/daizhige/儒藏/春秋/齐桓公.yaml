  decisions:
  - date: -0685
    title_zh: 不杀管仲反以为相
    rationale: 知其才可经国，弃私怨而取大用，以图富强
  - date: '-0651'
    title_zh: 葵丘会盟申明天子禁令
    rationale: 以尊王为名收诸侯之心，以礼义固霸主之位
- id: guji-齐桓公-endeavor-2
  person_qid: guji-齐桓公
  title_zh: 蔡姬荡舟而怒伐蔡问罪于楚
  summary: 因与蔡姬乘舟戏水之隙，蔡嫁其女而绝好，遂兴师伐蔡，并以此为名南问楚罪，扬威汉水
  phases:
  - key: brewing
    name: 乘舟荡舟夫妇生隙
    labels:
      zh: 酝酿生隙
    start_date: -0685
    highlight_event_id: guji-齐桓公-event-ascend
  - key: breakthrough
    name: 怒归蔡姬蔡人改嫁
    labels:
      zh: 突破绝交
    start_date: '-0656'
    highlight_event_id: guji-齐桓公-event-facai
  - key: climax
    name: 率师侵蔡蔡溃遂伐楚
    labels:
      zh: 高峰问罪
    start_date: '-0656'
    highlight_event_id: guji-齐桓公-event-facai
  - key: closure
    name: 召陵结盟威行南北
    labels:
      zh: 收束扬威
    start_date: '-0651'
    highlight_event_id: guji-齐桓公-event-kuiqiu
  decisions:
  - date: '-0656'
    title_zh: 因内宠之怒兴倾国之师
    rationale: 以小忿激大义，借伐蔡以伸霸令，明小邦事大不可轻慢
  - date: '-0656'
    title_zh: 假伐蔡之势问楚之罪
    rationale: 以蔡为引直指楚之不贡包茅，扩大战果以立威于诸侯
events:
- id: guji-齐桓公-event-birth
  person_qid: guji-齐桓公
  type: birth
  title_zh: 姜小白生于齐宫
  date: '-0716'
  year_of: -716
  description: 齐僖公之子小白生，是为后之齐桓公，早年历襄公之乱而出奔莒国
- id: guji-齐桓公-event-ascend
  person_qid: guji-齐桓公
  type: career
  title_zh: 抢先归齐即君位
  date: -0685
  year_of: -685
  description: 齐襄公孙无知之乱后，小白先纠入齐即位，败公子纠而定君位，开启桓公时代
- id: guji-齐桓公-event-guanzhong
  person_qid: guji-齐桓公
  type: career
  title_zh: 释仇拜管仲为相
  date: -0685
  year_of: -685
  description: 听鲍叔言不杀管仲，尊之为仲父，委以国政，修内政练兵备，奠定霸业之基
- id: guji-齐桓公-event-facai
  person_qid: guji-齐桓公
  type: career
  title_zh: 蔡姬荡舟怒而伐蔡
  date: '-0656'
  year_of: -656
  description: 与蔡姬乘舟，蔡姬荡舟不止，怒而归之，蔡人改嫁，遂率师侵蔡，蔡溃而进问楚罪，见载帛书春秋事语齐桓公与蔡夫人乘舟章
- id: guji-齐桓公-event-kuiqiu
  person_qid: guji-齐桓公
  type: career
  title_zh: 葵丘会盟成春秋首霸
  date: '-0651'
  year_of: -651
  description: 会诸侯于葵丘，申明天子禁令，诸侯归附，周襄王赐胙命为伯，霸业极盛
- id: guji-齐桓公-event-death
  person_qid: guji-齐桓公
  type: death
  title_zh: 薨于齐宫五子争立
  date: '-0643'
  year_of: -643
  description: 晚年宠易牙竖貂，管仲既卒政乱，桓公薨而五公子争立，停尸不葬，霸业遂衰
