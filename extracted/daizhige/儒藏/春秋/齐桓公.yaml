  dilemmas:
  - 念私情而绝蔡好与顾大局而容小过之间如何权衡
  - 任贤图霸与纵嬖信谗之间如何守成
  lesson: 能用人则兴，溺私情则败，霸业成于管仲而成于能忍，毁于竖貂易牙而毁于不忍
  summary_first_person: 吾乃姜小白，齐僖公之子，历艰难而得位，任管仲而九合诸侯，一匡天下，然因蔡姬荡舟之小怒而兴伐蔡之师，亦因晚年亲小人而致身死不葬，方知成霸在用人，失霸在縦欲
