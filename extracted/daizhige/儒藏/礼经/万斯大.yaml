    start_date: 1680
    highlight_event_id: guji-万斯大-event-zhichao
  decisions:
  - date: 1670
    title_zh: 不守注疏别立新义
    rationale: 经已讹者不可承讹，经已明者不可淆之，故于裼袭箱庙寝多发前人未发
  - date: 1680
    title_zh: 以答书附录明治朝无堂
    rationale: 治朝听政之所无堂，辨之尤精核，取所长以助考证
- id: guji-万斯大-endeavor-2
  title_zh: 守志不仕讲学传经
  summary: 为鄞县诸生不求仕进，与应撝谦切磋往复，以经学奖掖后进
  phases:
  - key: brewing
    name: 幼承家学博习亲师
    labels:
      zh: 酝酿
    start_date: 1648
    highlight_event_id: guji-万斯大-event-study
  - key: breakthrough
    name: 与应撝谦往复切磋
    labels:
      zh: 突破
    start_date: 1680-08-01
    highlight_event_id: guji-万斯大-event-yilishang
  - key: closure
    name: 付梓流传以待取长
    labels:
      zh: 收束
    start_date: 1681
    highlight_event_id: guji-万斯大-event-zhichao
  decisions:
  - date: 1680-08-01
    title_zh: 请应撝谦作序而阙未合
    rationale: 喜其能知己而存异，未合者阙之，不为唯唯以全切磋之义
  - date: 1681
    title_zh: 历丧稿而益自喜不衰
    rationale: 旧著尺许为回禄所忌失去，不以忧苦废志，重加爬梳以明忘食忘忧之志
events:
- id: guji-万斯大-event-birth
  title_zh: 生于鄞县万氏
  date: 1633
  year_of: 1633
  summary: 崇祯六年生于浙江鄞县，字充宗，国朝儒者，专治礼经
- id: guji-万斯大-event-study
  title_zh: 潜心礼经数十年
  date: 1655
  year_of: 1655
  summary: 为诸生不仕，专志殚精于三礼，爬罗剔抉，颇见先儒所不及
- id: guji-万斯大-event-yilishang
  title_zh: 著成仪礼商二卷
  date: 1680-08-01
  year_of: 1680
  summary: 取仪礼十七篇篇为之说成书二卷，应撝谦于庚申孟秋作序，许其覃思而嫌其自用
- id: guji-万斯大-event-zhichao
  title_zh: 答应嗣寅书辨治朝无堂
  date: 1681
  year_of: 1681
  summary: 以附录答书精核辨明治朝无堂，以及冠昏裼袭庙寝诸义，为全书最精处
- id: guji-万斯大-event-death
  title_zh: 卒于康熙年间
  date: 1683
  year_of: 1683
  summary: 康熙二十二年卒，一生以礼学闻，与万斯同并称，著述助后世考证
