  name_zh: 万斯大
  names:
    zh: 万斯大
    en: Wan Sida
  lifespan:
    birth:
      date: 1633
      precision: year
      is_circa: false
      raw: 明崇祯六年鄞县
    death:
      date: 1683
      precision: year
      is_circa: false
      raw: 清康熙二十二年
  birth_date: 1633
  death_date: 1683
  era: 明末清初
  reign_ref: 清圣祖康熙
  archetype: 礼学考据者
  dilemmas:
  - 泥注疏则失古礼本义，立新说则恐无显据见疑于世
  - 周正改月改时与否，夏时周正诗证明辨难定是非
  lesson: 考礼必稽经文时令，存是去非方为一家之学
  summary_first_person: 吾鄞县万斯大，潜心三礼，著仪礼商与学礼质疑，辨郊社宗法历正，欲复古礼本义，虽立异说见驳于四库馆臣，亦愿以精确之辨存一家之学
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%AD%A6%E7%A4%BC%E8%B4%A8%E7%96%91.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%AD%A6%E7%A4%BC%E8%B4%A8%E7%96%91.html
endeavors:
- id: guji-万斯大-endeavor-1
  title_zh: 研治仪礼著仪礼商
  summary_zh: 博考仪礼经文注疏，辨名物制度，著仪礼商二卷，为学礼之基
  phases:
  - key: brewing
    name: 鄞中讲学酝酿礼学
    labels:
      zh:
      - 酝酿
    start_date: 1650
    highlight_event_id: guji-万斯大-event-birth
  - key: breakthrough
    name: 考辨仪礼突破传注
    labels:
      zh:
      - 突破
    start_date: 1665
    highlight_event_id: guji-万斯大-event-yili
  - key: closure
    name: 仪礼商成书著录
    labels:
      zh:
      - 收束
    start_date: 1670
    highlight_event_id: guji-万斯大-event-yili
  decisions:
  - date: 1665
    title_zh: 舍注疏而稽经文考仪礼
    rationale: 郑孔之说错杂纬书，欲求本义故以经证经
  - date: 1670
    title_zh: 先成仪礼商为学礼之阶
    rationale: 明器数然后可辨郊社宗法，故先定仪礼再及三礼总义
- id: guji-万斯大-endeavor-2
  title_zh: 著学礼质疑辨郊社历正
  summary_zh: 著学礼质疑四卷，论古历分至、商周改正、周诗周正、鲁郊祈谷、社制宗法，多发新说
  phases:
  - key: brewing
    name: 考古历时月酝酿
    labels:
      zh:
      - 酝酿
    start_date: 1670
    highlight_event_id: guji-万斯大-event-yili
  - key: breakthrough
    name: 立鲁郊惟日至一礼之说
    labels:
      zh:
      - 突破
    start_date: 1678
    highlight_event_id: guji-万斯大-event-xueli
  - key: climax
    name: 学礼质疑四卷告成
    labels:
      zh:
      - 高潮
    start_date: 1680
    highlight_event_id: guji-万斯大-event-xueli
  - key: closure
    name: 宗法历正之说流传待论
    labels:
      zh:
      - 收束
    start_date: 1683
    highlight_event_id: guji-万斯大-event-death
  decisions:
  - date: 1678
    title_zh: 断周郊惟日至一礼祈谷不名郊
    rationale: 郊特牲止言日至报天，春秋鲁郊皆在正月，故以鲁托祈谷为假托
  - date: 1679
    title_zh: 断商周皆改正改月改时
    rationale: 寅丑子皆可为春正月，秦建亥止为改年始，故以易革左传证商建丑周建子
  - date: 1680
    title_zh: 断士亦得为大宗七月十月诸诗皆周正
    rationale: 据丧服小记荀子及诗时令乖错为刺，故不从朱子夏时之说
events:
- id: guji-万斯大-event-birth
  title_zh: 出生于浙江鄞县
  date: 1633
  year_of: 1633
  type: birth
  description_zh: 明崇祯六年生于鄞县万氏，自幼治经，长而专攻三礼
- id: guji-万斯大-event-yili
  title_zh: 著成仪礼商
  date: 1670
  year_of: 1670
  type: achievement
  description_zh: 考辨仪礼成仪礼商，后著录于四库，为学礼质疑之先声
- id: guji-万斯大-event-xueli
  title_zh: 著成学礼质疑四卷
  date: 1680
  year_of: 1680
  type: achievement
  description_zh: 著学礼质疑四卷，论古历无二十四气、秦时夏正由吕不韦始、郊社大小宗法，颇多新说，四库提要存其改月改时周诗周正宗法之精而驳其郊社大宗之误
- id: guji-万斯大-event-death
  title_zh: 卒于康熙二十二年
  date: 1683
  year_of: 1683
  type: death
  description_zh: 康熙二十二年卒，遗书学礼质疑流传，后收入钦定四库全书经部礼类
