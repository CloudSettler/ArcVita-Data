endeavors:
- id: guji-刘绩-endeavor-1
  title_zh: 参酌诸家编撰三礼图
  summary: 病汉以来礼失其传而妄作乃本陆佃礼象陈祥道礼书林希逸考工记解及博古图作三礼图四卷以总乡遂井田宫室车服礼器之制
  phases:
  - key: brewing
    name: 病旧说而留心礼学
    labels:
      zh:
      - 注易
      - 注礼
      - 病妄作
    start_date: 1485
    highlight_event_id: guji-刘绩-event-jinshi
  - key: breakthrough
    name: 会通陆陈博古诸说
    labels:
      zh:
      - 礼象
      - 礼书
      - 博古图
    start_date: 1495
    highlight_event_id: guji-刘绩-event-sanlitu-brewing
  - key: climax
    name: 图定乡遂井田宫室器物
    labels:
      zh:
      - 六乡图
      - 六遂图
      - 井田法
    start_date: 1505
    highlight_event_id: guji-刘绩-event-sanlitu-done
  - key: closure
    name: 示同志以一贯之旨
    labels:
      zh:
      - 三礼图说
      - 勿泥旧说
    start_date: 1510
    highlight_event_id: guji-刘绩-event-sanlitu-done
  decisions:
  - date: 1495
    title_zh: 舍郑阮旧图而取陆陈博古
    rationale: 汉儒去古未远而传疏已多踵谬博古虽疏漏而有魏晋宋时彝器可证故参酌其牺尊象尊蒲璧谷璧之说以备一解
  - date: 1505
    title_zh: 增补崇义阙遗七十余事
    rationale: 聂崇义参六本虽有典型而宫室舆轮珽荼曲植多阙故一一分析补阙拾遗以便日用合于天人
- id: guji-刘绩-endeavor-2
  title_zh: 进士入仕出守镇江
  summary: 弘治庚戌登进士由部曹历练出为镇江府知府以礼教为政令民守闾以待政令致仕后以著述终
  phases:
  - key: brewing
    name: 江夏力学举进士
    labels:
      zh:
      - 江夏
      - 弘治庚戌
    start_date: 1485
    highlight_event_id: guji-刘绩-event-jinshi
  - key: breakthrough
    name: 入仕历练明习政令
    labels:
      zh:
      - 进士
      - 宦历
    start_date: 1490
    highlight_event_id: guji-刘绩-event-jinshi
  - key: climax
    name: 出守镇江以礼导民
    labels:
      zh:
      - 镇江知府
      - 礼治
    start_date: 1508
    highlight_event_id: guji-刘绩-event-zhifu
  - key: closure
    name: 致政著述以传后学
    labels:
      zh:
      - 致仕
      - 传学
    start_date: 1515
    highlight_event_id: guji-刘绩-event-zhifu
  decisions:
  - date: 1490
    title_zh: 以经术应科第而不废著述
    rationale: 既欲究易原极礼详故借科第以进身终不以仕废学乃注易注礼复作图以总之
  - date: 1508
    title_zh: 以乡遂任民之法施于镇江
    rationale: 载师任地闾师任民之意在使地无旷民无游故守郡则令民各守其业以礼齐之以复先王遗意
