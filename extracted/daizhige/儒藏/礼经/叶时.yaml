endeavors:
- id: guji-叶时-endeavor-1
  title_zh: 撰礼经会元阐周礼大指
  description_zh: 不随文笺疏举周礼中大指为目凡百篇旁推交通以畅其说镕经义自成一家
  phases:
  - key: brewing
    name: 研读周礼注疏酝酿释经
    labels:
      zh: 研经酝酿
    start_date: 1195-01-01
    highlight_event_id: guji-叶时-event-study
  - key: breakthrough
    name: 立纲举大指为目百篇
    labels:
      zh: 立纲突破
    start_date: 1210-01-01
    highlight_event_id: guji-叶时-event-compose
  - key: climax
    name: 成书四卷旁推交通成一家言
    labels:
      zh: 成书高峰
    start_date: 1220-01-01
    highlight_event_id: guji-叶时-event-compose
  - key: closure
    name: 与朱子友善诋王安石新法以传道
    labels:
      zh: 传道收束
    start_date: 1224-01-01
    highlight_event_id: guji-叶时-event-compose
  decisions:
  - date: 1210-01-01
    title_zh: 不随文笺疏而举大指为目
    rationale: 镕经义以自成一家旁推交通以畅圣人之道
  - date: 1220-01-01
    title_zh: 辨郑康成五失不泥旧注
    rationale: 纬书兵法传记礼记皆非圣经当以圣经为据防袭注疏则法亡
- id: guji-叶时-endeavor-2
  title_zh: 历仕理宗经世致用辅政
  description_zh: 钱塘进身历官至龙图阁学士光禄大夫究心经世之具致仕卒谥文康
  phases:
  - key: brewing
    name: 钱塘进身究心经世之具
    labels:
      zh: 出仕酝酿
    start_date: 1198-01-01
    highlight_event_id: guji-叶时-event-study
  - key: breakthrough
    name: 理宗朝擢用历官清要
    labels:
      zh: 擢用突破
    start_date: 1224-01-01
    highlight_event_id: guji-叶时-event-office
  - key: climax
    name: 位龙图阁学士光禄大夫辅治
    labels:
      zh: 辅政高峰
    start_date: 1226-01-01
    highlight_event_id: guji-叶时-event-office
  - key: closure
    name: 致仕而终谥文康以经术传后
    labels:
      zh: 致仕收束
    start_date: 1230-01-01
    highlight_event_id: guji-叶时-event-death
  decisions:
  - date: 1224-01-01
    title_zh: 以经术言治道不行徒法不行
    rationale: 待其人而后行身任君师之责当思周公所思行周公所行
  - date: 1226-01-01
    title_zh: 致仕守道不附权势
    rationale: 权自上出大臣禀命而行以民极为标准全君臣同德之义
