    title_zh: 不改字解元端
    rationale: 郑氏改端为冕以就周礼吾据乐记冠礼内则证元端本兼冕冠不改字而义自通
  - date: 1702
    title_zh: 以经证经黜周礼为据
    rationale: 玉藻日少牢朔大牢崇俭可法周礼六牲十二鼎启侈不足凭故以礼记证礼记不以周礼绳礼记
