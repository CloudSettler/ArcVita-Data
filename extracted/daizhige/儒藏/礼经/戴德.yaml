    start_date: '-0075'
    highlight_event_id: guji-戴德-event-compile
  decisions:
  - date: -0085
    title_zh: 以礼为防存古为要
    rationale: 礼者禁于将然之前，婚姻乡饮聘射丧祭之礼不可废，故广收遗文以塞乱源
  - date: -0080
    title_zh: 存曾子夏小正诸古篇
    rationale: 曾子立事本孝诸篇与夏小正最古，诸侯迁庙投壶公冠为古经遗文，不可遗落，故并录以羽翼礼经
- id: guji-戴德-endeavor-2
  title_zh: 出为信都王太傅以礼辅王
  summary_zh: 应诏出为信都王太傅，以王言七教三至明王之道劝王内修外行，折冲千里守国安民
  phases:
  - key: brewing
    name: 以经名闻征为王傅
    labels:
      zh: 名闻被征
    start_date: '-0076'
    highlight_event_id: guji-戴德-event-taifu
  - key: breakthrough
    name: 陈七教三至辅王
    labels:
      zh: 陈道辅王
    start_date: '-0073'
    highlight_event_id: guji-戴德-event-taifu
  - key: climax
    name: 别地州治选贤恤孤
    labels:
      zh: 行礼化民
    start_date: '-0072'
    highlight_event_id: guji-戴德-event-taifu
  - key: closure
    name: 守经归老遗书传后
    labels:
      zh: 守成传后
    start_date: '-0070'
    highlight_event_id: guji-戴德-event-death
  decisions:
  - date: '-0073'
    title_zh: 内修七教外行三至
    rationale: 七教不修虽守不固，三至不行虽征不服，故劝王敬老顺齿乐施亲贤以正其本
  - date: '-0072'
    title_zh: 薄敛恤民选贤举能
    rationale: 明王关讥不征市廛不税，哀鳏寡养孤独，如此则迩者说远者来，故节财用而厚民生
