  title_zh: 师承后苍集录礼传八十五篇
  summary_zh: 师事后苍传礼，网罗古礼遗文与曾子诸篇，删集为大戴礼八十五篇，存夏小正诸侯迁庙諸篇古义
  phases:
  - key: brewing
    name: 梁地受业师事后苍
    labels:
      zh: 积学传经
    start_date: '-0100'
    highlight_event_id: guji-戴德-event-birth
  - key: breakthrough
    name: 网罗遗文删集礼传
    labels:
      zh: 删集钩稽
    start_date: -0085
    highlight_event_id: guji-戴德-event-compile
  - key: climax
    name: 八十五篇体系初成
    labels:
      zh: 体系大成
    start_date: -0080
    highlight_event_id: guji-戴德-event-compile
  - key: closure
    name: 大小戴分传授徒守经
    labels:
