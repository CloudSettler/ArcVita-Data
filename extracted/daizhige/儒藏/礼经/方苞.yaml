    highlight_event_id: guji-方苞-event-zhouguan
  decisions:
  - date: 1720-11
    title_zh: 复周礼旧名曰周官
    rationale: 汉志列周官五篇于礼家相沿误称周礼，是书乃分职命事之程式，故正名以复其初
  - date: 1720-11
    title_zh: 仿朱子集注例圈外别义
    rationale: 承用注疏串合己意者不复识别，全引一家者著其名，推极义类旁见侧出者以圈外别之，使端绪易求
- id: guji-方苞-endeavor-2
  title_zh: 落职修书倡桐城古文
  description: 由举人入仕，蒙难赦出后修书，官至内阁学士兼礼部侍郎，以侍讲衔致仕，以古文义法倡导士林
  phases:
  - key: brewing
    name: 丙戌举人
    labels:
