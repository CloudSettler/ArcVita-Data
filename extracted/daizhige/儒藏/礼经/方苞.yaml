  - date: '1725'
    title_zh: 主张义法经世雅洁行文
    rationale: 矫明季浮靡，以经术义理为文章根柢，故能开一派之先
  - date: '1735'
    title_zh: 先成周官集注再专治仪礼
    rationale: 于三礼周礼差深，由周礼以通仪礼，则士相见张侯聘礼觐礼诸义皆可得其通
