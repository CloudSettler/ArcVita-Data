  - date: '1740'
    title_zh: 定例无疑者不录经文有疑则详辨
    rationale: 使精力专于疑义，不为支离疏义所牵，突出发明而辞约义该
  - date: '1743'
    title_zh: 以周礼党正闾胥诸职通士冠礼有司宾赞
    rationale: 士冠礼有司非府史胥徒，当取族党中下士，以官制通私家礼事方合古制
