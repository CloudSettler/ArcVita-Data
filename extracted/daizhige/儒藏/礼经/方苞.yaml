  decisions:
  - date: 1713
    title_zh: 安心馆局考礼制义
    rationale: 落职之后不怨尤，以修书自效，穷思经制以经理民物为实用
  - date: 1736
    title_zh: 以醇正持论教士
    rationale: 位至学士兼礼部侍郎，黜浮华崇雅正，使学者勿徒以资文学
