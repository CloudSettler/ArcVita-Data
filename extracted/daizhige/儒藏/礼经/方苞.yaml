  era: 清代
  reign_ref: 康熙至乾隆
  archetype: 经学家
  dilemmas:
  - 融会旧说与断以己意之间如何不失古义又能明辨得失
  - 面对删定六经之戒如何守述而不作之分而又辨析疑义
  lesson: 治经当由本文求义参伍互证前人既辟径涂后人乃得由间而入不可因己所得而瑕疵前人更不可奋笔删削以僭圣人之事
  summary_first_person: 余方苞桐城人自明以来礼注列学官者惟陈氏集说学者弗心厌也壬辰癸巳间余始悉心治之就所疑而辨析凡四十六卷义得本文者十五六因辨陈说而详审者十三四后虽蒙四库存录而考定文王世子之删削见讥为乖方余深以为戒愿后学汇众说而整齐之以明经义而已
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E7%A4%BC%E8%AE%B0%E6%9E%90%E7%96%91.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E7%A4%BC%E8%AE%B0%E6%9E%90%E7%96%91.html
endeavors:
- id: guji-方苞-endeavor-1
  title_zh: 礼记析疑撰述
  description: 疑陈氏集说而悉心治礼融会注疏旧说断以己意成四十六卷以明郊飨丧祭冠昏之本义
  phases:
  - key: brewing
    name: 悉心治礼疑陈说
    labels:
      zh: 治礼发端
    start_date: 1712
    highlight_event_id: guji-方苞-event-study
  - key: breakthrough
    name: 就疑辨析得义于本文
    labels:
      zh: 辨析突破
    start_date: 1725
    highlight_event_id: guji-方苞-event-study
  - key: climax
    name: 融会旧说成四十六卷
    labels:
      zh: 成书礼记析疑
    start_date: 1745
    highlight_event_id: guji-方苞-event-liji
  - key: closure
    name: 四库存录垂为烱戒
    labels:
      zh: 存录垂戒
    start_date: 1749
    highlight_event_id: guji-方苞-event-liji
  decisions:
  - date: 1712
    title_zh: 舍心厌陈说而切究其义
    rationale: 视之若皆可通及切究则多未审故就所疑而辨析不欲强合其说于一
  - date: 1745
    title_zh: 融会旧说而断以己意
    rationale: 礼经散亡羣儒各记所闻于所指之事所措之言无失便可于郊血大飨及尝有乐等条明辨注疏得失
- id: guji-方苞-endeavor-2
  title_zh: 周官集注与整齐众说
  description: 先成周官集注已著录复校卫正叔集解去同旧说者以汇众说整齐经义为后学开径涂
  phases:
  - key: brewing
    name: 治周官以通礼制本末
    labels:
      zh: 通礼发端
    start_date: 1720
    highlight_event_id: guji-方苞-event-zhouguan
  - key: breakthrough
    name: 周官集注著录成家法
    labels:
      zh: 集注突破
    start_date: 1738
    highlight_event_id: guji-方苞-event-zhouguan
  - key: climax
    name: 校卫氏集解以相参证
    labels:
      zh: 参证会通
    start_date: 1745
    highlight_event_id: guji-方苞-event-liji
  - key: closure
    name: 望后学汇众说以时次录
    labels:
      zh: 期许后学
    start_date: 1749
    highlight_event_id: guji-方苞-event-death
  decisions:
  - date: 1738
    title_zh: 先注周官以立礼制纲领
    rationale: 三礼参伍伦类彼此互证必先通官制然后文王世子大司成大司乐之属可辨
  - date: 1745
    title_zh: 校卫氏集解而不必皆自己出
    rationale: 治经求其义明而已去其同于旧说者后之学者次以时代而录其先出者可矣
events:
- id: guji-方苞-event-birth
  title_zh: 出生于桐城
  date: 1668
  year_of: 1668
  description: 康熙七年生于桐城方氏后以古文经学名世官至翰林院侍讲
- id: guji-方苞-event-study
  title_zh: 壬辰癸巳悉心治礼
  date: 1712
  year_of: 1712
  description: 自明以来礼注列学官者惟陈氏集说学者弗心厌于是悉心究义就所疑而辨析
- id: guji-方苞-event-zhouguan
  title_zh: 周官集注成书著录
  date: 1738
  year_of: 1738
  description: 融会旧说以注周官先立纲领其书已著录为治三礼之基
- id: guji-方苞-event-liji
  title_zh: 礼记析疑四十六卷成书
  date: 1745
  year_of: 1745
  description: 融会旧说断以己意于郊特牲飨禘内则丧服小记诸条多所发明惟考定文王世子删削后被讥为乖方
- id: guji-方苞-event-death
  title_zh: 逝世
  date: 1749
  year_of: 1749
  description: 乾隆十四年卒其书后经四库馆臣恭校存录而辨其删经之谬以为后来烱戒
