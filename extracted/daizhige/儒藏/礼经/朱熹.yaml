endeavors:
- id: guji-朱熹-endeavor-1
  title_zh: 以仪礼为经编定经传通解
  summary: 以仪礼十七篇为经取礼记诸经史杂书附本经之下分家礼乡礼学礼邦国礼王朝礼厘析章次晚年更定今名
  phases:
  - key: brewing
    name: 乞修三礼立以经统传之志
    labels:
      zh: 立志稽古
    start_date: 1190-01-01
    highlight_event_id: guji-朱熹-event-zouqing
  - key: breakthrough
    name: 厘析仪礼分章表目开卷了然
    labels:
      zh: 厘析经文
    start_date: 1195-01-01
    highlight_event_id: guji-朱熹-event-gending
  - key: climax
    name: 更定今名具家乡邦国王朝规模
    labels:
      zh: 更定成书
    start_date: 1198-01-01
    highlight_event_id: guji-朱熹-event-gending
  - key: closure
    name: 南康刊板四十二篇流传后世
    labels:
      zh: 刊传后世
    start_date: 1200-04-23
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1190-01-01
    title_zh: 草定乞修三礼劄子以仪礼为经
    rationale: 纠王安石废罢仪礼独存礼记弃经任传之失欲存先圣遗制故以经为纲附传记注疏于下
  - date: 1198-01-01
    title_zh: 晚年修葺更定名为经传通解
    rationale: 初名集注端绪已具晚年厘析士冠陈器服戒宿加冠诸辞及增女子笄诸目故更今名以定体例
- id: guji-朱熹-endeavor-2
  title_zh: 托付门人续成丧祭以全书
  summary: 自以创稿粗就命杨复黄榦类次丧祭丧礼十五卷先成祭礼留藁待杨复重修十四卷以合六十六卷之全
  phases:
  - key: brewing
    name: 以创藁属杨复命黄榦类次
    labels:
