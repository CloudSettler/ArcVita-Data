    start_date: 1198-06-01
    highlight_event_id: guji-朱熹-event-tuofu
  - key: breakthrough
    name: 黄榦修丧礼十五卷规模得定
    labels:
      zh: 丧礼粗成
    start_date: 1199-01-01
    highlight_event_id: guji-朱熹-event-tuofu
  - key: climax
    name: 祭礼留藁待定以全梗概
    labels:
      zh: 祭礼留待
    start_date: 1200-01-01
    highlight_event_id: guji-朱熹-event-death
  - key: closure
    name: 杨复张虙郑逢辰续刊合六十六卷
    labels:
      zh: 续成全书
    start_date: 1200-04-23
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1198-06-01
    title_zh: 以丧祭二门属黄榦类次
    rationale: 家乡邦国王朝礼已具规模丧祭体大故命门人专治其悉用所立规模更定以求端绪相因
  - date: 1200-01-01
    title_zh: 存祭礼藁本以待后人更定
    rationale: 祭礼未及订定而精力已衰与其强成不如留藁本并刊使杨复参所闻稍加更定以续成之
