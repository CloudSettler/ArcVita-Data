  birth_date: 1130-10-18
  death_date: 1200-04-23
  era: 南宋
  reign_ref: 宋高宗建炎至宋宁宗庆元
  archetype: 理学集大成之礼经疏通者
  dilemmas:
  - 以空言骋辨易而名物度数难明，何以使仪礼可读
  - 经记割附便览一时而淆乱古本，何以两全便学与存古
  lesson: 读礼当先明宫室器数之实，再通义理之大，方能使先王旧典涣然冰释
  summary_first_person: 吾朱熹，少读三礼而病仪礼难读，乃以仪礼为主，取周官礼记及他经传言礼者以类相从，草创经传通解，又考释宫以定庙朝寝室之概，付门人续成丧祭，冀后学沿溯而得其津涯
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E9%92%A6%E5%AE%9A%E4%BB%AA%E7%A4%BC%E4%B9%89%E7%96%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E9%92%A6%E5%AE%9A%E4%BB%AA%E7%A4%BC%E4%B9%89%E7%96%8F.md
endeavors:
- id: guji-朱熹-endeavor-1
  title_zh: 创制仪礼经传通解
  summary_zh: 以仪礼十七篇为主纲，汇周官礼记及群经传记言礼者，以类相从，分章定段，开三礼分治而统贯之新例，为钦定仪礼义疏所本
  phases:
  - key: brewing
    name: 病仪礼难读而酝酿通解
    labels:
      zh:
      - 酝酿
    start_date: 1170-01-01
    highlight_event_id: guji-朱熹-event-tongjie-start
  - key: breakthrough
    name: 定以仪礼为主之纲例
    labels:
      zh:
      - 突破
    start_date: 1190-01-01
    highlight_event_id: guji-朱熹-event-tongjie-start
  - key: climax
    name: 分章析段草创通解
    labels:
      zh:
      - 高峰
    start_date: 1194-01-01
    highlight_event_id: guji-朱熹-event-tongjie-start
  - key: closure
    name: 付门人续成丧祭二礼
    labels:
      zh:
      - 收束
    start_date: 1198-01-01
    highlight_event_id: guji-朱熹-event-xumen
  decisions:
  - date: 1190-06-01
    title_zh: 立以经为主以传记附丽之例
    rationale: 仪礼经不分章所以难读，必分章段并取他经互相发明，方能开卷了然
  - date: 1196-03-01
    title_zh: 托黄榦杨复续成丧祭
    rationale: 三礼浩博精力不逮，遵门人守成之例，使端绪不坠而全书可就
- id: guji-朱熹-endeavor-2
  title_zh: 考释宫室以便学者
  summary_zh: 考定庙朝寝舍之制，作仪礼释宫及附论讲去取，使学者先晓梗概而后读全经无所窒碍，清代义疏卷首仍全用其本
  phases:
  - key: brewing
    name: 积疑庙朝寝舍古今殊制
    labels:
      zh:
      - 酝酿
    start_date: 1180-01-01
    highlight_event_id: guji-朱熹-event-shigong
  - key: breakthrough
    name: 参李如圭本考定释宫
    labels:
      zh:
      - 突破
    start_date: 1185-01-01
    highlight_event_id: guji-朱熹-event-shigong
  - key: climax
    name: 以释宫冠经传通解之首
    labels:
      zh:
      - 高峰
    start_date: 1190-01-01
    highlight_event_id: guji-朱熹-event-shigong
  - key: closure
    name: 释宫为钦定义疏卷首所宗
    labels:
      zh:
      - 收束
    start_date: 1198-01-01
    highlight_event_id: guji-朱熹-event-xumen
  decisions:
  - date: 1185-08-01
    title_zh: 先图宫室后解名物
    rationale: 不晓宫室梗概则全经窒碍，必先立释宫一册以统全经
  - date: 1192-02-01
    title_zh: 斥旧图之谬而存行礼之节
    rationale: 名物器用与行礼节次二图不可偏废，当按据经文参礼书而刊正
events:
- id: guji-朱熹-event-birth
  title_zh: 生于尤溪
  date: 1130-10-18
  year_of: 1130
  description_zh: 宋建炎四年九月十五日生于南剑州尤溪，父朱松命名熹
- id: guji-朱熹-event-tongjie-start
  title_zh: 草创仪礼经传通解
  date: 1194-01-01
  year_of: 1194
  description_zh: 以仪礼为主，取周官礼记及他经传记言礼者以类相从，每篇案行礼节次分为章段，开三礼分治之端
- id: guji-朱熹-event-shigong
  title_zh: 撰成仪礼释宫
  date: 1185-06-01
  year_of: 1185
  description_zh: 考庙寝朝舍之制，参李如圭本撰释宫一册，冠于通解卷首，以便学者先晓梗概
- id: guji-朱熹-event-xumen
  title_zh: 命黄榦杨复续成丧祭礼
  date: 1198-03-01
  year_of: 1198
  description_zh: 以年高精力不逮，命门人黄榦续丧礼，杨复续祭礼并作仪礼图，遵通解体例而成全书
- id: guji-朱熹-event-death
  title_zh: 卒于考亭
  date: 1200-04-23
  year_of: 1200
  description_zh: 宋庆元六年三月初九日卒于建阳考亭，年七十一，遗命门人续成通解，后钦定义疏多从其章段
