  lesson: 循文训诂谨守旧说阙疑存真不以新奇乱经
  summary_first_person: 我生于宋世专治周礼逐句训释为十二卷多依郑注贾疏取义简约异则明言疑则阙载不以新说乱古经惟愿后人守经谨严得民极之正
