    highlight_event_id: guji-朱申-event-2
  decisions:
  - date: '1148'
    title_zh: 不执孟子疑周礼
    rationale: 大司徒诸公之地坚守注中半为附庸说以全经义不以他经摇本经
  - date: '1152'
    title_zh: 易郑注贡职为赋税贡献
    rationale: 太宰五曰贡职于义当为税献故显易其说不曲从
