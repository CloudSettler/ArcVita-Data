    start_date: 1688
    highlight_event_id: guji-李光坡-event-liji
  decisions:
  - date: 1680
    title_zh: 舍集说便文而归注疏详核
    rationale: 集说以一宗去取自悖注疏备载众诂最为详核故以述注疏为正
  - date: 1688
    title_zh: 以述为名不自居有得
    rationale: 童习白首修尊所得于遗经切磋就正不敢侈口经纬故但称述注
