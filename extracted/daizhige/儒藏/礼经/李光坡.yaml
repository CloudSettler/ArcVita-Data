    start_date: 1688
    highlight_event_id: guji-李光坡-event-liji
  decisions:
  - date: 1682
    title_zh: 推寻夏殷旧礼不遽斥臆说
    rationale: 学孔门多是殷礼师门原本当推寻究竟未可以今非古
  - date: 1685
    title_zh: 先以周礼述注示学界再成礼记
    rationale: 五礼大者先有成说则礼记诸篇条理有所据依故先后相成
