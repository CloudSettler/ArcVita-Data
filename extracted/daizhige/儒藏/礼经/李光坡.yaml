  - key: breakthrough
    name: 遍读郑孔注疏考众诂详核
    labels:
      zh: 博考注疏
    start_date: 1680
    highlight_event_id: guji-李光坡-event-study
  - key: climax
    name: 次第条理撰成述注
    labels:
      zh: 撰述成编
    start_date: 1686
    highlight_event_id: guji-李光坡-event-liji
  - key: closure
    name: 自序于康熙戊子以示子弟
    labels:
