  decisions:
  - date: 约1175
    title_zh: 全录郑康成注旁征博引
    rationale: 贾公彦疏有未备，据古本唐石经陆氏释文张淳识误及各本辩证脱讹衍
  - date: 约1180
    title_zh: 别作纲目释宫以发明
    rationale: 分别章句之指以明礼意，考论宫室之制以实礼象，使学者玩而绎之
- id: guji-李如圭-endeavor-2
  title_zh: 登第仕宦佐朱熹校定礼书
  description_zh: 由进士入仕官至福建路抚干，以习礼闻，与朱熹往还校定礼书，裨益世教
