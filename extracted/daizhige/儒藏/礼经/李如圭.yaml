  dilemmas:
  - title_zh: 仪礼久废经注讹脱何以正
    description_zh: 熙宁废罢仪礼，学者鲜治，经文并注往往讹脱，乾道张淳订讹之后，何以据古本校正补注
  - title_zh: 郑注疏略贾疏未备何以补
    description_zh: 全录郑康成注而旁征博引，出入经传，作纲目以别章句，作释宫以论宫室，发明前人未备
  lesson: 穷探博采出入经传以补前人未备，周旋揖让皆天理流行，知礼废兴关乎化行俗美
  summary_first_person: 我是庐陵李如圭，字宝之，习于礼者，淳熙中集释仪礼十七篇，全录郑注而旁征博引，又作纲目以别章句，作释宫以论宫室，绍熙癸丑登第，官至福建路抚干，曾与朱熹校定礼书，陈汶刻我书于桂林郡学以与同志共之
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E4%BB%AA%E7%A4%BC%E9%9B%86%E9%87%8A.html
