    rationale: 以礼学素养应举入仕，求以礼之大经大本施于政教
  - date: 约1196
    title_zh: 与朱熹往还共定礼书
    rationale: 朱熹尝与之校定礼书，盖以其习于礼，可正仪礼之讹而明先王盛化
events:
- id: guji-李如圭-event-birth
  title_zh: 生于庐陵
  date: 约1160
  year_of: 1160
  description_zh: 宋绍兴末淳熙初生于庐陵，字宝之，少习礼经
- id: guji-李如圭-event-jishi
  title_zh: 淳熙中撰成仪礼集释
  date: 约1180
  year_of: 1180
  description_zh: 淳熙中为仪礼集释，出入经传，又为纲目以别章句，为释宫以论宫室，陈汶序而刻之桂林郡学
- id: guji-李如圭-event-dengdi
  title_zh: 绍熙癸丑登进士第
  date: 1193
  year_of: 1193
  description_zh: 疑为绍熙癸丑进士，陈振孙马端临误作淳熙绍兴癸丑，考淳熙无癸丑，绍兴癸丑太早，当从四库提要作绍熙癸丑
- id: guji-李如圭-event-jiaoli
  title_zh: 与朱熹校定礼书
  date: 约1196
  year_of: 1196
  description_zh: 朱熹晚岁校正仪礼，李如圭以习于礼与其校定，于世教大有裨补
- id: guji-李如圭-event-fugan
  title_zh: 官至福建路抚干
  date: 约1198
  year_of: 1198
  description_zh: 入仕后官至福建路抚干，以经术饰吏事
- id: guji-李如圭-event-death
  title_zh: 卒于南宋宁宗初
  date: 约1220
  year_of: 1220
  description_zh: 卒年不详，约卒于宋宁宗初，集释及纲目释宫传于后，四库自永乐大典录出排纂成三十卷
