  dilemmas:
  - 师说浩博经文难明当如何以图像疏通仪节方位
  - 宫室堂室制度不明则揖让进退失方当如何守旧说而补其阙
  lesson: 原本师意勤于图像以明古礼梗概创始虽有舛漏亦可补苴
  summary_first_person: 吾杨复字茂才号信斋福州长溪人早游朱子之门得闻礼学大义严陵赵彦肃尝作特牲少牢二礼图以质朱子朱子以为更得冠昏图及堂室制度考之乃佳吾因原本师意录仪礼十七篇经文节取旧说疏通其意各详仪节陈设方位系之以图凡二百有五又分宫庙门冕弁门牲鼎礼器门为旁通图二十有五附于后书成于绍定戊子以续郑逢辰仪礼经传通解之业
  source_urls:
