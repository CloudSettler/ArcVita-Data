endeavors:
- id: guji-柯尚迁-endeavor-1
  person_qid: guji-柯尚迁
  title_zh: 以经证经复冬官六典
  summary_zh: 谓冬官未尝亡而合于地官之末，取遂人以下至旅下士正六十人为冬官，取大司徒建邦土地之图以下为大司空之职，以复序官同乎六十之数
  phases:
  - key: brewing
    name: 研读体验探求
    labels:
      zh: 研经
    start_date: 1530-01-01
    highlight_event_id: guji-柯尚迁-event-fudongguan
  - key: breakthrough
    name: 断冬官合于地官
    labels:
      zh: 立说
    start_date: 1540-01-01
    highlight_event_id: guji-柯尚迁-event-fudongguan
  - key: climax
    name: 定六十官证序官
    labels:
      zh: 证经
    start_date: 1544-01-01
    highlight_event_id: guji-柯尚迁-event-preface
  decisions:
  - date: 1540-01-01
    title_zh: 分遂人以下为冬官
    rationale: 以遂人至旅下士正合六十之数，可证序官之同，不待割裂五官以乱圣经
  - date: 1544-01-01
    title_zh: 析大司徒土地之事为大司空职
    rationale: 以地官土地之事本属司空掌邦土居四民之职，归之冬官则六典各得其所
- id: guji-柯尚迁-endeavor-2
  person_qid: guji-柯尚迁
  title_zh: 集注释原撰成十四卷
  summary_zh: 自天官至冬官凡十二卷，附通论续论各一卷，称说者依古注集成，曰原者推原作经本意，并明乡遂封建井田学校军赋之大义
  phases:
  - key: brewing
    name: 会萃汉宋诸儒训释
    labels:
      zh: 集注
    start_date: 1541-01-01
    highlight_event_id: guji-柯尚迁-event-preface
  - key: climax
    name: 作原发明圣人精意
    labels:
      zh: 释原
    start_date: 1545-02-01
    highlight_event_id: guji-柯尚迁-event-preface
  - key: closure
    name: 卷首源流序论目问告成
    labels:
      zh: 成书
    start_date: 1545-02-01
    highlight_event_id: guji-柯尚迁-event-chengshu
  decisions:
  - date: 1545-02-01
    title_zh: 称说依古注曰原发鄙见
    rationale: 使圣经大义敷畅阐明，既存汉学之旧，又得周公运用天理之心
  - date: 1545-02-01
    title_zh: 附源流叙论通论续论纲领凡例
    rationale: 正简札淆乱封建井田之悖说，明在位在职与乡官民官之分，以立全经纲纪
events:
- id: guji-柯尚迁-event-birth
  person_qid: guji-柯尚迁
  type: birth
  date: 1498-01-01
  year_of: 1498
  title_zh: 生于福建长乐
  description_zh: 字乔可，自号阳石山人，少有志于天地民物得所之由，古今治乱悬隔之故
- id: guji-柯尚迁-event-fudongguan
  person_qid: guji-柯尚迁
  type: career
  date: 1540-01-01
  year_of: 1540
  title_zh: 体验探求定冬官不亡之说
  description_zh: 窃志是经，体验探求至形寤寐，知遂人以下地官之半实为冬官，乃战国诸侯恶害己所乱，决意以经证经复之
- id: guji-柯尚迁-event-preface
  person_qid: guji-柯尚迁
  type: career
  date: 1545-02-01
  year_of: 1545
  title_zh: 嘉靖乙巳作序周礼全经释原成
  description_zh: 自天官至冬官十二卷，附通论续论，列源流序论，六官目问，全经纲领，释原凡例，于二月朔旦作序以明防心政礼法为一道
- id: guji-柯尚迁-event-chengshu
  person_qid: guji-柯尚迁
  type: career
  date: 1555-01-01
  year_of: 1555
  title_zh: 立论平实得唐顺之姜宝深许
  description_zh: 其以经证经不窜乱古经之说，较俞庭椿割裂五官为有据，故为时贤所是，后入四库得参备一解
- id: guji-柯尚迁-event-death
  person_qid: guji-柯尚迁
  type: death
  date: 1573-12-31
  year_of: 1573
  title_zh: 约卒于长乐
  description_zh: 阳石山人考终，遗书十四卷流传于世，待后之知孟子之心者率由而行仁政
