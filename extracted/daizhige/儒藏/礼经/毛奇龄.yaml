    labels:
      zh: 定有禘无祫
    start_date: '1689'
    highlight_event_id: guji-毛奇龄-event-aitang
  - key: climax
    name: 艾堂集议明三禘皆称祫
    labels:
      zh: 艾堂论定
    start_date: '1690-03-05'
    highlight_event_id: guji-毛奇龄-event-aitang
  - key: closure
    name: 以郊社禘祫问传世资礼家采择
    labels:
      zh: 成书传世
    start_date: '1691'
    highlight_event_id: guji-毛奇龄-event-aitang
  decisions:
  - date: '1689'
    title_zh: 断天子无祫诸侯亦无祫
    rationale: 祫者合也特对合之虚义大传所云祫即是禘干祫即干禘不可别立一祭
  - date: '1690-03-05'
    title_zh: 分大禘吉禘时禘三等皆合祭
    rationale: 五年大禘追所自出三年吉禘谛昭穆四时禘尝烝皆及毁存诸庙犆祭惟春礿故必合祭而称祫
