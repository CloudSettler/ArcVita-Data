    highlight_event_id: guji-毛奇龄-event-aitang
  decisions:
  - date: '1680'
    title_zh: 主冬夏二至分祀天地
    rationale: 既祭天必祭地因丘陵川泽为坛兆南郊北郊经传互见不可废地祭
  - date: '1690-03-05'
    title_zh: 辨社非大地之祭
    rationale: 社为田正土谷之祭泰折瘗埋别有大地之祭郊社对举者皆小郊不可混大郊天地之对
- id: guji-毛奇龄-endeavor-2
  title_zh: 正禘祫之名倡有禘无祫
  summary: 答李塨及艾堂问谓大禘吉禘时禘皆合祭故称祫实无别立一祫祭破三年一祫五年一禘之说
  phases:
  - key: brewing
    name: 遍观群籍疑祫为虚义
    labels:
