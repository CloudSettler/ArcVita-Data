  - date: 1760
    title_zh: 宗王肃祔义而阙弟子字
    rationale: 生不及祖之税当计己生，弟子字不敢辄删，宁阙疑从郑注
events:
- id: guji-江永-event-birth
  date: 1681
  year_of: 1681
  title_zh: 生于徽州婺源
  description: 康熙二十年生于婺源，少治经学尤精三礼
- id: guji-江永-event-jian识
  date: 1735
  year_of: 1735
  title_zh: 客程恂所签识纂言
  description: 在休宁程恂处置礼记纂言于案头，随笔签识得十五篇，程为诠次录本
- id: guji-江永-event-zhouli
  date: 1750
  year_of: 1750
  title_zh: 周礼疑义举要著录
  description: 所撰周礼疑义举要先已著录，为训义择言考辨礼制之基
- id: guji-江永-event-zhiyan
  date: 1760-05
  year_of: 1760
  title_zh: 乾隆庚辰夏成训义择言
  description: 乾隆庚辰夏五月自识其引，自檀弓至杂记八卷录存，以正吴氏割裂之失
- id: guji-江永-event-death
  date: 1762
  year_of: 1762
  title_zh: 卒于乾隆二十七年
  description: 训义择言成后二年而卒，全书持义多允为四库馆臣称精核
