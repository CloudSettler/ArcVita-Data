  - title_zh: 墨守旧疏还是臆改经文
    description: 吴澄删定割裂窜易虽便考索却失本义，如何折衷而不轻动简策
  - title_zh: 众说聚讼何所从
    description: 郑孔陈吴吕朱诸家异同并存，择一是须据经证经而不以臆度
  lesson: 折衷群言据经证经，阙疑存异不轻改古经
  summary_first_person: 吾江永婺源人也，少治礼经，尝客程恂所签识纂言十五篇，年衰犹录存所疑，自檀弓至杂记择注家一是为训义择言八卷，冀存先王遗制而不以臆裂乱经
