person:
  qid: guji-沈彤
  name_zh: 沈彤
  names:
    zh: 沈彤
    en: Shen Tong
  lifespan:
    birth:
      date: 1688
      precision: year
      is_circa: false
      raw: 康熙二十七年
    death:
      date: 1752
      precision: year
      is_circa: false
      raw: 乾隆十七年
  birth_date: 1688
  death_date: 1752
  era: 清
  reign_ref: 康熙至乾隆
  archetype: 考据经学家
  dilemmas:
  - 欧阳修疑周礼官多田少禄将不给后人踵为诬谤当如何辨正
  - 经注阙载官爵田禄之数当阙疑还是据经起例推阐旁通
  lesson: 研求本经旁览传记以义例推确征可决千古官禄田数之疑
  summary_first_person: 吾吴江沈彤也尝研求周官以载师都邑得其端旁览传记为官爵数公田数禄田数三篇以明内外官爵禄田相当供用有余冀破自宋以来官多田少之谬而复显周官法制之大端
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%91%A8%E5%AE%98%E7%A6%84%E7%94%B0%E8%80%83.html
endeavors:
- id: guji-沈彤-endeavor-1
  title_zh: 考定天子内外官爵数
  summary: 以序官命数遍稽五官乡遂郊野及妇官在官庶人以定爵等总数
  phases:
  - key: brewing
    name: 研求本经得端于载师
    labels:
      zh:
      - 研经起例
    start_date: 1730
    highlight_event_id: guji-沈彤-event-study
  - key: breakthrough
    name: 补定郊野县鄙之官
    labels:
      zh:
      - 补阙推例
    start_date: 1740
    highlight_event_id: guji-沈彤-event-guanjue
  - key: climax
    name: 以五官例推冬官阙文
    labels:
      zh:
      - 整齐总数
    start_date: 1745
    highlight_event_id: guji-沈彤-event-guanjue
  - key: closure
    name: 著成官爵数篇并为问答
    labels:
      zh:
      - 著述明辨
    start_date: 1750
    highlight_event_id: guji-沈彤-event-guanjue
  decisions:
  - date: 1740
    title_zh: 以县鄙名郊野之家而递降其爵
    rationale: 若以州党名郊则禄田当益十万余夫公田不足供故量入定降于遂之制
  - date: 1745
    title_zh: 以五分取一例推冬官有爵及庶人数
    rationale: 冬官亡阙而五官可周知故约推五百余爵四千余庶人以全五万九千余人之总数
- id: guji-沈彤-endeavor-2
  title_zh: 推算公田禄田以破官多田少之疑
  summary: 通不易一易再易上中下之率以井数定公田以爵等命数定禄以明田禄相当有余
  phases:
  - key: brewing
    name: 访究经济策举此相论
    labels:
      zh:
      - 访学论难
    start_date: 1742
    highlight_event_id: guji-沈彤-event-study
  - key: breakthrough
    name: 定王畿百同私田家受二夫之算
    labels:
      zh:
      - 算田定率
    start_date: 1746
    highlight_event_id: guji-沈彤-event-lutian
  - key: climax
    name: 以县都以下田食公卿大夫士之爵
    labels:
      zh:
      - 田禄相当
    start_date: 1748
    highlight_event_id: guji-沈彤-event-lutian
  - key: closure
    name: 总名周官禄田考三卷以尽阐其制
    labels:
      zh:
      - 成书破谬
    start_date: 1751
    highlight_event_id: guji-沈彤-event-lutian
  decisions:
  - date: 1746
    title_zh: 并郊野之吏而补通三等受田之率以二夫当一夫
    rationale: 旧稽官不及乡遂属吏稽田不去山林等三之一今尽补则官益多田益寡必以精密之算方显相当之实
  - date: 1748
    title_zh: 定禄必称爵而量给于公田不以摄官为词
    rationale: 前人辨官多田少不过以摄官为说未得等数故直究本经禄秩爵等命数以正其本
events:
- id: guji-沈彤-event-birth
  date: 1688
  year_of: 1688
  title_zh: 出生
  description_zh: 康熙二十七年生于江苏吴江
- id: guji-沈彤-event-study
  date: 1730
  year_of: 1730
  title_zh: 研求周官与友论学
  description_zh: 研求本经旁览传记于载师都邑得义例之端与徐灵胎论经济策相访答
  endeavor_ref: guji-沈彤-endeavor-1
- id: guji-沈彤-event-guanjue
  date: 1745
  year_of: 1745
  title_zh: 考成官爵数
  description_zh: 遍考公孤卿大夫士及郊野县鄙妇官庶人定天子内外三万一千余爵二万一千余庶人之总数
  endeavor_ref: guji-沈彤-endeavor-1
- id: guji-沈彤-event-lutian
  date: 1750
  year_of: 1750
  title_zh: 撰成公田禄田数
  description_zh: 推王畿井数公田数禄田数明以县都以下田食诸爵相当且供他用有余撰为周官禄田考三卷
  endeavor_ref: guji-沈彤-endeavor-2
- id: guji-沈彤-event-death
  date: 1752
  year_of: 1752
  title_zh: 逝世
  description_zh: 乾隆十七年卒于吴江其书后入四库著录以决官多田少千古之疑
