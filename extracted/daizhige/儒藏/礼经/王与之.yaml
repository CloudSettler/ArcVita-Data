  era: 南宋
  reign_ref: 宋理宗绍定至淳祐
  archetype: 皓首穷经的义理经学家
  dilemmas:
  - 博采众说与删繁取要之衡
  - 尊信周礼与鉴戒王安石误用祸天下之辨
  - 守志厉行无求于世与应诏进书接受旌异之际
  lesson: 由博得约，以程张义理统名物制度，方能明周公之心而裨圣治
  summary_first_person: 吾乐清王与之，字次点，山泽臞儒，皓首穷经，遍搜五十一家集成周礼订义八十卷，蒙真德秀序引，赵汝腾荐进，特补賓州文学，后终于泗州通判，愿以周公之学明周公之心
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%91%A8%E7%A4%BC%E8%AE%A2%E4%B9%89.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%91%A8%E7%A4%BC%E8%AE%A2%E4%B9%89.md
endeavors:
- id: guji-王与之-endeavor-1
  title_zh: 集成周礼订义八十卷
  summary: 遍营天下搜采唐宋五十一家，以宋儒义理为本，删繁取要，由博得约
  phases:
  - key: brewing
    name: 遍搜讲说发端
    labels:
      zh: 搜猎积累
    start_date: 1220
    highlight_event_id: guji-王与之-event-xu-1232
  - key: breakthrough
    name: 真德秀序引表章
    labels:
      zh: 得大儒认可
    start_date: 1232
    highlight_event_id: guji-王与之-event-xu-1232
  - key: climax
    name: 删繁取要益精粹
    labels:
      zh: 由博得约
    start_date: 1237
    highlight_event_id: guji-王与之-event-houxu-1237
  - key: closure
    name: 进书秘书省藏
    labels:
      zh: 进御旌异
    start_date: 1242
    highlight_event_id: guji-王与之-event-jinshu-1242
  decisions:
  - date: 1232
    title_zh: 以程张为本兼采诸儒
    rationale: 郑贾析名物辨制度有功而未睹微言，惟洛之程氏关中张氏得精微之蕴，故以义理为本典制为末
  - date: 1237
    title_zh: 德秀殁后益删繁取要
    rationale: 真德秀击节是书后更自审是非，由博得约，使其书益精粹无疵以释学者之惑
  - date: 1242
    title_zh: 以序官散附诸官
    rationale: 欲因爵之尊卑权之轻重以知所职之事，虽先儒所不遵而效释文旧例以便学者易见
- id: guji-王与之-endeavor-2
  title_zh: 守志厉行皓首出仕
  summary: 山泽臞儒居乐清著书数种，守志厉行无求于世，因进书特补一官终于泗州
  phases:
  - key: brewing
    name: 乐清山泽著书
    labels:
      zh: 隐居穷经
    start_date: 1220
    highlight_event_id: guji-王与之-event-xu-1232
  - key: breakthrough
    name: 守臣识拔荐闻
    labels:
      zh: 知遇守臣
    start_date: 1237
    highlight_event_id: guji-王与之-event-houxu-1237
  - key: climax
    name: 特补賓州文学
    labels:
      zh: 旌异授官
    start_date: 1243
    highlight_event_id: guji-王与之-event-jinshu-1242
  - key: closure
    name: 终于泗州通判
    labels:
      zh: 以官终身
    start_date: 1245
    highlight_event_id: guji-王与之-event-death
  decisions:
  - date: 1242
    title_zh: 守志无求听守臣上闻
    rationale: 职在著书释惑，不自鬻以求进，与献书自鬻者不同，故由秘省访求守臣奏进
  - date: 1243
    title_zh: 受旌异备乙夜之观
    rationale: 上可裨圣明之治下可释学者之惑，有功于六典，故受賓州文学以风厉天下学者
events:
- id: guji-王与之-event-birth
  type: birth
  title_zh: 生于温州乐清
  date: 1190
  year_of: 1190
  place_zh: 温州乐清
  description: 生年不详，乐清士人，字次点，山泽臞儒，皓首穷经满家藏书
- id: guji-王与之-event-xu-1232
  type: achievement
  title_zh: 真德秀绍定五年为序
  date: 1232
  year_of: 1232
  place_zh: 建安
  description: 真德秀嘉次点之志，作序称其学本于程张，勉使蚤夜以思深原作经本指
- id: guji-王与之-event-houxu-1237
  type: achievement
  title_zh: 赵汝腾嘉熙元年后序删定益精
  date: 1237
  year_of: 1237
  place_zh: 温州
  description: 德秀殁后与之益删繁取要由博得约，汝腾后序称其书益精粹，守志厉行节守不渝
- id: guji-王与之-event-jinshu-1242
  type: achievement
  title_zh: 淳祐二年进周礼订义授賓州文学
  date: 1242-12-01
  year_of: 1242
  place_zh: 温州至行在秘书省
  description: 秘书省访求未进之书，知温州赵汝腾印写五十册申送，诏特补一官授賓州文学付秘书省
- id: guji-王与之-event-death
  type: death
  title_zh: 终于通判泗州
  date: 1250
  year_of: 1250
  place_zh: 泗州
  description: 受旌异后历官，终于通判泗州，卒年不详，宋本卷首省牒州状具载其事
