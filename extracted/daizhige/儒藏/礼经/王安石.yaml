  death_date: 1086-05-21
  era: 北宋
  reign_ref: 宋神宗熙宁
  archetype: 改革家
  dilemmas:
  - 祖宗之法不可变与救积贫积弱须变法之争
  - 假六典经义以钳儒口与经不可徒行须得人之辨
  - 富强功利之实与圣王礼义之名如何两全
  lesson: 托经改制可一时立法终须得人以行法经义精详不如用人得当
  summary_first_person: 我临川人也熙宁中遇神宗而变法以富强又董经义局亲为周官新义笔削欲以成周六典经邦治民晚退江宁始知法存乎人徒法不能自行也
  source_urls:
