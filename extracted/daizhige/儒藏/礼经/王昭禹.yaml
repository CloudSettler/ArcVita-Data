  decisions:
  - date: '1112'
    title_zh: 以王氏字说为基而不尽同
    rationale: 三经新义列于学官不得不宗，然于泉府国服为息等处目睹青苗之弊，阴破其说以存民本
  - date: '1120'
    title_zh: 详释载师里布屋粟等难解
    rationale: 不从先儒二十五家之泉等旧说，欲以近郊远郊甸稍县都之制发明先王因远近剧易制役之意
- id: guji-王昭禹-endeavor-2
  title_zh: 阐发六官治教礼政刑事之道
  summary_zh: 以道判万物成理，以六官法天地四时，论辨方正位体国经野设官分职以为民极
  phases:
  - key: brewing
    name: 推原道礼之本
    labels:
      zh: 道理涵养
    start_date: '1105'
    highlight_event_id: guji-王昭禹-event-study
  - key: breakthrough
    name: 提出探本伺末之论
    labels:
      zh: 体用贯通
    start_date: '1115'
    highlight_event_id: guji-王昭禹-event-complete
  - key: climax
    name: 明六典先后之序
    labels:
      zh: 经世大义
    start_date: '1120'
    highlight_event_id: guji-王昭禹-event-complete
  decisions:
  - date: '1115'
    title_zh: 立治官天道之说
    rationale: 治以道为本，教以化为本，礼以仁为本，政以礼为本，刑以义为本，事以智为本，本末相因终始相应
  - date: '1120'
    title_zh: 驳荀卿礼生于伪之论
    rationale: 礼者法之大分道实寓焉，神无在而无不在，圣人立礼为体行礼为翼，不可谓华而不实
