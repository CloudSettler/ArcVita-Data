  birth_date: '1080'
  death_date: '1135'
  era: 北宋
  reign_ref: 宋徽宗
  archetype: 经学家
  dilemmas:
  - title_zh: 宗王氏新说与守古训之间如何抉择
    description_zh: 当时三经新义列在学官，遵用王安石字说易得功令之助，却不免附会穿凿，我当因之而不尽同，阴破其说而发明义理
  - title_zh: 形名度数与道德性命之间如何兼顾
    description_zh: 礼之事显于形名度数，礼之理隐于道德性命，我欲即事以阐幽，即理以显微，使六官之制不徒为故好详之文
  lesson: 守经以致用，释礼以明道，方能使古制活于今世
  summary_first_person: 我名昭禹，字光远，北宋徽钦时人，潜心周礼六官之制，参酌王氏新说而时加匡正，撰周礼详解四十卷，以经邦国纪万民，愿以圣人治教礼政刑事之法，存天地四时之序于人世
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%91%A8%E7%A4%BC%E8%AF%A6%E8%A7%A3.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E5%91%A8%E7%A4%BC%E8%AF%A6%E8%A7%A3.md
