  birth_date: '1700'
  death_date: '1780'
  era: 清
  reign_ref: 乾隆
  archetype: 集说守正之经师
  dilemmas:
  - 博收一百九十七家与断以己意之间如何兼顾广备与折衷至当
  - 存郑氏旧次与考定经记传注错乱之间如何既不移易经文又明圣经之旧
  - 驳正杨复旧图与诸家谬误之间如何去非求是不蹈轻排郑贾之习
  lesson: 博采众说而守郑为归去非求是不以新奇掩旧章方为根据之学
  summary_first_person: 我是盛世佐秀水人官龙里县知县潜心仪礼十载裒辑自先秦迄本朝一百九十七家之说以时代为序断以己意经自为经记自为记而成集编四十卷又勘正监本石本补前人之阙愿守先王制度以待后之君子
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E4%BB%AA%E7%A4%BC%E9%9B%86%E7%BC%96.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E7%A4%BC%E7%BB%8F/%E4%BB%AA%E7%A4%BC%E9%9B%86%E7%BC%96.html
endeavors:
- id: guji-盛世佐-endeavor-1
  title_zh: 裒辑仪礼集编
  summary: 自先秦迄本朝博收一百九十七家以时代为序兼存异义断以己意成书四十卷
  phases:
  - key: brewing
    name: 潜心是经博收众说
    labels:
      zh: 博收奠基
    start_date: '1737'
    highlight_event_id: guji-盛世佐-event-office
  - key: breakthrough
    name: 以时代为序厘定取舍
    labels:
      zh: 编次折衷
    start_date: '1745'
    highlight_event_id: guji-盛世佐-event-book
  - key: climax
    name: 集编成于乾隆丁卯
    labels:
      zh: 成编进呈
    start_date: '1747'
    highlight_event_id: guji-盛世佐-event-book
  - key: closure
    name: 桑调元作序四库著录
    labels:
      zh: 序定传世
    start_date: 1747-10
    highlight_event_id: guji-盛世佐-event-preface
  decisions:
  - date: '1745'
    title_zh: 以时代为序编次众说
    rationale: 志在博收兼存异义不专主一家又追正袭用先儒而没姓氏者以表章微学
  - date: '1747'
    title_zh: 经自为经记自为记不从通解合编
    rationale: 通解为权立以便寻省而经传混淆非定本故一依郑旧不敢学步失故步
- id: guji-盛世佐-endeavor-2
  title_zh: 守郑正图勘正监石二本
  summary: 谨守郑贾守师说而驳正杨复旧图及监本石本之失附考定于后以求至当
  phases:
  - key: brewing
    name: 龙里为官笃守郑学
    labels:
      zh: 守官明礼
    start_date: '1740'
    highlight_event_id: guji-盛世佐-event-office
  - key: breakthrough
    name: 辨杨复旧图并注疏之意失
    labels:
      zh: 正图辨误
    start_date: '1746'
    highlight_event_id: guji-盛世佐-event-book
  - key: climax
    name: 勘正监本石本补顾张之阙
    labels:
      zh: 勘正补阙
    start_date: '1747'
    highlight_event_id: guji-盛世佐-event-book
  - key: closure
    name: 别定考定附于后而不移经文
    labels:
      zh: 谨严存旧
    start_date: 1747-10
    highlight_event_id: guji-盛世佐-event-preface
  decisions:
  - date: '1746'
    title_zh: 舍旧图而别构以求毫厘不差
    rationale: 以图释经毫厘之差便有千里之谬故揆理稽古未安未协者别构之
  - date: '1747'
    title_zh: 仿蔡沈武成例别为考定附于后
    rationale: 士冠士相见丧服等篇经记相汩心知非旧然不敢辄改故别定次序以存谨严
