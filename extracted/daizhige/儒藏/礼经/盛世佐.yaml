- id: guji-盛世佐-event-book
  date: '1747'
  year_of: 1747
  type: achievement
  title_zh: 仪礼集编成于乾隆丁卯
  description: 裒辑古今说仪礼者一百九十七家断以己意成集编按经篇数分卷以存郑旧
- id: guji-盛世佐-event-preface
