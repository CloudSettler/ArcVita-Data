    title_zh: 负笈西入关师事马融
    rationale: 欲求圣人之真法必就当世通儒，故不辞劳远从融学，尽得古今文义
  - date: 0169
    title_zh: 党祸禁锢杜门注经
    rationale: 时路险塞不可出仕，莫若闭户著书以述圣义传后，故注经授徒以待后世
