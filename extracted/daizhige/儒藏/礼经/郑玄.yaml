  era: 东汉
  reign_ref: 汉顺帝至汉献帝
  archetype: 汉代经学集大成者
  dilemmas:
  - 古今文纷争之中如何兼采众长而守古文正法
  - 党锢祸起之时出仕显名与退隐保身之间抉择
  - 乱世屡征之际守道不仕与济世救民之间权衡
  lesson: 守经述圣以立身，乱世不仕以全节，遍注群经以传后
  summary_first_person: 吾北海高密人也，少好学，游太学，师事马融尽得古文经法，遭党禁归里注经授徒，遍注易诗书礼乐孝经论语，三礼尤详，屡征不就，终以经学传后，愿后学者守正解经，勿以强说诬圣
  source_urls:
