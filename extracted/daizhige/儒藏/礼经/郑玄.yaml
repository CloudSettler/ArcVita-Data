      - 考终
    start_date: '0200'
    highlight_event_id: guji-郑玄-event-death
  decisions:
  - date: 0191
    title_zh: 注解礼记明体履之别
    rationale: 礼经残缺世多昧于体履，故依卢马之本注礼记以正名分，使三百三千之义复明
  - date: 0197
    title_zh: 辞袁绍辟及大司农征
    rationale: 黄巾乱后道不可行，出仕则违素志，故守正不屈以全节，用经学保身传道
