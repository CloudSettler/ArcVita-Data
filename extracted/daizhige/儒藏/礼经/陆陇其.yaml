endeavors:
- id: guji-陆陇其-endeavor-1
  title_zh: 考订三礼著读礼志疑
  summary: 见三礼多汉儒采辑龃龉不合乃折衷孔郑注疏以就朱子旁采春秋律吕天时人事疑者阙之成六卷
  phases:
  - key: brewing
    name: 博览注疏始生疑义
    labels:
      zh: 读仪礼周礼
    start_date: 1670
    highlight_event_id: guji-陆陇其-event-jinshi
  - key: breakthrough
    name: 以朱子折衷郑孔
    labels:
      zh: 折衷孔郑就朱子
    start_date: 1678
    highlight_event_id: guji-陆陇其-event-zhushu
  - key: climax
    name: 随文纠正羽翼经训
    labels:
      zh: 纠月令庙制丧服之失
    start_date: 1685
    highlight_event_id: guji-陆陇其-event-zhushu
  - key: closure
    name: 疑而未决则阙成编
    labels:
      zh: 成读礼志疑六卷
    start_date: 1690
    highlight_event_id: guji-陆陇其-event-zhushu
  decisions:
  - date: 1678
    title_zh: 定折衷朱子之例
    rationale: 宋儒义理精而考据不及注疏故以注疏为据以朱子为断务得其中
  - date: 1685
    title_zh: 存疑阙如不强解
    rationale: 经残阙而注疏亦疏略与其穿凿不如传疑故曰志疑
- id: guji-陆陇其-endeavor-2
  title_zh: 墨守程朱讲学居官
  summary: 覃思心性力传洛闽之学登进士历知县官至四川道御史以清献名世兼著古文尚书考问学录
  phases:
  - key: brewing
    name: 少力学立志洛闽
    labels:
      zh: 治举业兼治心性
    start_date: 1630
    highlight_event_id: guji-陆陇其-event-birth
  - key: breakthrough
    name: 登康熙九年进士
    labels:
      zh: 进士及第入仕
    start_date: 1670
    highlight_event_id: guji-陆陇其-event-jinshi
  - key: climax
    name: 任御史直声著闻
    labels:
      zh: 任四川道监察御史
    start_date: 1690
    highlight_event_id: guji-陆陇其-event-yushi
  - key: closure
    name: 身后赠谥传学统
    labels:
      zh: 赠内阁学士谥清献
    start_date: 1692
    highlight_event_id: guji-陆陇其-event-death
  decisions:
  - date: 1670
    title_zh: 以理学为出仕本
    rationale: 学以明道仕以行道不以穿穴自限而以醇正自守
  - date: 1690
    title_zh: 守正不阿持宪纠劾
    rationale: 宁信康成之谨慎不效啖助之自信故居官亦以谨慎守法为要
