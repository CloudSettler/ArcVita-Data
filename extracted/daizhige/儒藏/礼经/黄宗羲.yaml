endeavors:
- id: guji-黄宗羲-endeavor-1
  title_zh: 深衣制度考辨与礼服重建
  summary: 以经文玉藻为据，立指尺交解续衽钩边之新解，驳正郑孔朱吴黄王诸家，重建深衣衣裳相连之制
  phases:
  - key: brewing
    name: 博览汉宋诸家深衣说
    labels:
      zh: 酝酿
    start_date: 1653-01-01
    highlight_event_id: guji-黄宗羲-event-retreat
  - key: breakthrough
    name: 立指尺交解续衽钩边新解
