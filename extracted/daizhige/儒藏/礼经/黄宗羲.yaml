    start_date: 1665-01-01
    highlight_event_id: guji-黄宗羲-event-shenyikao
  - key: climax
    name: 深衣考成书驳正曲裾贴边诸误
    labels:
      zh: 高潮
    start_date: 1676-01-01
    highlight_event_id: guji-黄宗羲-event-shenyikao
  - key: closure
    name: 缁冠幅巾黑履缘带定式以俟后人
    labels:
      zh: 收束
    start_date: 1680-01-01
    highlight_event_id: guji-黄宗羲-event-shenyikao
  decisions:
  - date: 1665-03-01
    title_zh: 以指尺为度不用官尺
    rationale: 以各人中指中节为寸，合人身长短，使短毋见肤长毋被土之经义可行
  - date: 1670-05-01
    title_zh: 主裳六幅交解不主七幅辟积
    rationale: 要中七尺二寸下齐一丈四尺四寸难兼济，交解则狭头在上阔头在下，要缝半下，辟积则龃龉不合
  - date: 1676-02-01
    title_zh: 驳曲裾贴边定续衽钩边本义
    rationale: 续衽为衣裳相属而成小要之横，钩边为袼下至裳下尽缝之直，非贴边非鸟喙曲裾可当
- id: guji-黄宗羲-endeavor-2
  title_zh: 易代坚节与讲学经世
  summary: 明亡起兵抗清不成，绝意仕清，讲学著述，成明夷待访录等经世之学，以存斯文
  phases:
  - key: brewing
    name: 出身余姚世家受学刘宗周
    labels:
      zh: 酝酿
    start_date: 1625-01-01
    highlight_event_id: guji-黄宗羲-event-birth
  - key: breakthrough
    name: 甲申后起兵抗清南明奔走
    labels:
      zh: 突破
    start_date: 1645-07-01
    highlight_event_id: guji-黄宗羲-event-resistance
  - key: climax
    name: 隐居讲学著述经史礼学
    labels:
      zh: 高潮
    start_date: 1653-01-01
    highlight_event_id: guji-黄宗羲-event-retreat
  - key: closure
    name: 辞博学鸿词守节以终
    labels:
      zh: 收束
    start_date: 1678-01-01
    highlight_event_id: guji-黄宗羲-event-death
  decisions:
  - date: 1645-08-01
    title_zh: 毁家纾难起兵浙东
    rationale: 国变君亡，臣子当以直政方义自任，规矩绳权衡之志不可屈
  - date: 1653-04-01
    title_zh: 绝意仕进隐居著述
    rationale: 深衣可文可武完且弗费之志转为学术，存明学之统，俟后圣复礼
  - date: 1678-06-01
    title_zh: 力辞清廷博学鸿词之征
    rationale: 负绳抱方安志平心，守遗民之节，不以文武之用易气节之正
events:
- id: guji-黄宗羲-event-birth
  date: 1610-09-24
  year_of: 1610
  title_zh: 出生于浙江余姚
  description: 明万历三十八年八月初七日生于余姚通德乡黄竹浦，父黄尊素为东林名士
- id: guji-黄宗羲-event-resistance
  date: 1645-07-15
  year_of: 1645
  title_zh: 浙东起兵抗清
  description: 清兵下江南，与钱肃乐等起兵浙东，拥鲁王监国，奔走军旅，力图恢复
- id: guji-黄宗羲-event-retreat
  date: 1653-01-01
  year_of: 1653
  title_zh: 隐居龙虎山讲学著述
  description: 抗清无望，返乡隐居，讲学于龙虎山黄竹浦，潜心经史，考礼著书
- id: guji-黄宗羲-event-shenyikao
  date: 1676-01-01
  year_of: 1676
  title_zh: 撰成深衣考辨正诸家
  description: 以白细布指尺为度，发明交解续衽钩边袼袪袷缘带冠巾履之制，驳朱子吴澄黄润玉王廷相等说
- id: guji-黄宗羲-event-death
  date: 1695-08-12
  year_of: 1695
  title_zh: 卒于余姚故里
  description: 清康熙三十四年七月初三日卒于家，年八十六，遗命薄葬，学者私谥忠端
