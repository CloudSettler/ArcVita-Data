  dilemmas:
  - 明亡之后应否出仕与坚守遗民气节的两难
  - 尊崇三代古礼与驳正汉唐宋儒旧说的两难
  - 考据精密与经世致用的平衡难题
  lesson: 以指尺实测交解续衽钩边之制，辨正旧误，使礼学归于可行可用
  summary_first_person: 我是余姚黄宗羲，明亡后不仕，潜心经史礼学，我以中指中节为寸，以白细布考深衣衣二幅裳六幅交解十二叶之制，明续衽为衣裳相连属而成小要，钩边为直缝尽合，驳正朱子曲裾之失与黄润玉无裳王廷相七幅之误，欲存古礼通变之实
