  birth_date: 1585
  death_date: 1646-04-20
  era: 明末南明
  reign_ref: 隆武
  archetype: 忠烈经臣
  dilemmas:
  - 以春秋礼义表行而世乱礼崩，如何以经术立表而正人心
  - 以孤臣事亡国而兵微势绝，如何以恭敬仁义全节而不辱身
  lesson: 以礼表行，以春秋明义，隐显庄威信以立命，临难不失其正
  summary_first_person: 吾以经筵讲礼为表记集传，以春秋发坊表条例，欲以恭敬仁义表天下之行，晚以孤忠辅隆武，兵败被执，不屈而死，庶几隐而显不言而信之志
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/礼经/表记集传.md
  - https://daizhige.org/儒藏/礼经/表记集传.html
endeavors:
- id: guji-黄道周-endeavor-1
  title_zh: 经筵讲学撰表记集传
  summary: 在经筵日讲纂辑进呈，以春秋条例发明表记恭敬仁义之义，分三十六章以立表
  phases:
  - key: brewing
    name: 博通六经入直讲筵
    labels:
      zh: 蓄养经术
    start_date: 1622
    highlight_event_id: guji-黄道周-event-jinshi
  - key: breakthrough
    name: 以春秋解表记立说
    labels:
      zh: 以经发明
    start_date: 1635
    highlight_event_id: guji-黄道周-event-biaojijizhuan
  - key: climax
    name: 表记集传进呈成书
    labels:
      zh: 著作进呈
    start_date: 1638
    highlight_event_id: guji-黄道周-event-biaojijizhuan
  - key: closure
    name: 四库提要定论流传
    labels:
      zh: 后世评定
    start_date: 1781-10
    highlight_event_id: guji-黄道周-event-biaojijizhuan
  decisions:
  - date: 1635
    title_zh: 以春秋条例发坊表二记
    rationale: 以坊表不专为春秋而以春秋稽测晷影，使百世有所考正
  - date: 1638
    title_zh: 约为三十六章详记脉络
    rationale: 依古注正义子言之体例，明恭敬仁义之相承，不从陈澔强分四十余章
- id: guji-黄道周-endeavor-2
  title_zh: 辅隆武抗清殉节
  summary: 南明隆武朝任吏部兵部尚书大学士，募兵江西，兵败被执，不屈就义
  phases:
  - key: brewing
    name: 崇祯旧臣守正去国
    labels:
      zh: 守道待时
    start_date: 1644
    highlight_event_id: guji-黄道周-event-jinshi
  - key: breakthrough
    name: 入闽辅政隆武授任
    labels:
      zh: 担当大义
    start_date: 1645-08
    highlight_event_id: guji-黄道周-event-fulongwu
  - key: climax
    name: 出师江西兵败被执
    labels:
      zh: 孤军殉国
    start_date: 1646-02
    highlight_event_id: guji-黄道周-event-martyrdom
  - key: closure
    name: 南京不屈从容就义
    labels:
      zh: 成仁取义
    start_date: 1646-04-20
    highlight_event_id: guji-黄道周-event-death
  decisions:
  - date: 1645-08
    title_zh: 应诏入闽辅隆武
    rationale: 以君臣父子大义不可废，明室虽微当以残躯表忠
  - date: 1646-02
    title_zh: 以孤军出江西迎敌
    rationale: 知不可为而为之，以躬行表记敬忌之义，不失足失色失口于人
