  summary_first_person: 吾常熟严虞惇字宝成康熙丁丑进士官至太仆寺少卿以小序为宗参以集传撰读诗质疑三十一卷附录十五卷每篇冠序文每章疏字义篇末总论大旨以推求诗意为主
