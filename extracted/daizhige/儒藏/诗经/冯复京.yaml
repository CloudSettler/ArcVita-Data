    title_zh: 据周礼追师辨被字
    rationale: 编列发为之次第发长短为之，定集传混编为髲髢之误
  - date: 1601
    title_zh: 据贾疏辨缁衣之制
    rationale: 卿士朝服皮弁，治事之馆改服缁衣，以合郑笺私朝之说
events:
- id: guji-冯复京-event-birth
  title_zh: 生于常熟
  date: 1542
  year_of: 1542
  is_circa: true
  description_zh: 明嘉靖间生于常熟，字嗣宗，少习诗经旁通诸籍
- id: guji-冯复京-event-compile
  title_zh: 缀集名物疏
  date: 1598
  year_of: 1598
  description_zh: 取陆玑疏郑樵略而广之，缀集旧闻参以新义，分门考释名见于经者
- id: guji-冯复京-event-preface
  title_zh: 焦竑序刊行五十五卷
  date: 1605
  year_of: 1605
  description_zh: 万历乙巳九日焦竑作序，称其补陆郑之遗起废疾，书成五十五卷行于世
- id: guji-冯复京-event-death
  title_zh: 万历末年逝世
  date: 1615
  year_of: 1615
  is_circa: true
  description_zh: 万历末年卒于常熟，后乾隆四十三年四库馆臣校上提要称其征引赅博大端可取
