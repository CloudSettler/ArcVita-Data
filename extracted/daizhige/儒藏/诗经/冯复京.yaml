    title_zh: 定三十二门体例
    rationale: 上穷景纬下括舆图中备人事，以总别详略错意立文，使名物殚备
  - date: 1603
    title_zh: 存意而不论诗旨
    rationale: 诗人意虚圆难言，释可释者阙不可释者，以俟读者虚心自得
- id: guji-冯复京-endeavor-2
  title_zh: 以经解经辨正旧诂
  description_zh: 据周礼仪礼尔雅群书考证名物，辨被为髲髢编次之别，正缁衣为治事之馆所服
