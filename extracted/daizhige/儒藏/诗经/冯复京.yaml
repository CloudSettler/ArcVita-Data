    en: Feng Fujing
  lifespan:
    birth:
      date: 1542
      precision: year
      is_circa: true
      raw: 明嘉靖二十一年前后常熟
    death:
      date: 1615
      precision: year
      is_circa: true
      raw: 明万历末年前后
  birth_date: 1542
  death_date: 1615
  era: 明
  reign_ref: 明万历
  archetype: 经学家
  dilemmas:
  - title_zh: 虚实之辨
    description_zh: 诗有虚实，宗旨虚圆难言，名物据实当核，如何不以穿凿实虚，不以孤陋虚实
  - title_zh: 六家支派之合
    description_zh: 齐鲁毛韩郑笺朱传分合各异，毛郑本属一家，如何参伍群书而不乖传经之统
  lesson: 以经解经，博采参伍，考证名物，存意阙疑以待自得
  summary_first_person: 我字嗣宗常熟人，少习诗经，久而有得，广蔡氏之说为五十五卷，分三十二门，博引经史子集以明名物，辨编髲缁衣之误，存诗人意以俟虚心自得
  source_urls:
  - https://daizhige.org/六家诗名物疏.html
  - https://github.com/daizhige-org/daizhigev20
