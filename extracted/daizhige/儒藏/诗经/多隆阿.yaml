person:
  qid: guji-多隆阿
  name_zh: 多隆阿
  names:
    zh: 多隆阿
    en: Duolonga
  lifespan:
    birth:
      date: 约1800
      precision: year
      is_circa: true
      raw: 生年不详，嘉庆末道光初间人，以道光乙酉拔贡推算
    death:
      date: 约1865
      precision: year
      is_circa: true
      raw: 卒年不详，约在咸丰同治间后
  birth_date: 约1800
  death_date: 约1865
  era: 清
  reign_ref: 道光
  archetype: 名物考据型经学家
  dilemmas:
  - 先儒毛郑孔疏陆玑诸说聚讼不决，当守旧诂还是以亲见闻见折衷
  - 释名物简略则蹈空，详备则嫌繁芜俚俗，如何取舍以裨经义
  lesson: 传闻不如亲见，考名物当以多见折衷多闻，识形色兼识性情以明比兴
  summary_first_person: 余长白舒穆禄氏，字文希，嘉道间治毛诗，童年读诗随俗立解，壮岁读汉唐注疏参师友讲论，积片楮成多识初稿，寄同年周华甫订正而失之，辛亥自燕晋游归，重加删润，益以闻见，详鸟兽草木形色性情古号谚名，以明比兴之由，留瑕颣以俟后贤折衷
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E6%AF%9B%E8%AF%97%E5%A4%9A%E8%AF%86.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E6%AF%9B%E8%AF%97%E5%A4%9A%E8%AF%86.html
endeavors:
- id: guji-多隆阿-endeavor-1
  title_zh: 读汉唐注疏积稿初成多识
  summary_zh: 童年读诗会心而少据，壮岁参注疏讲论，积稿成帙名曰多识，寄周华甫求订
  phases:
  - key: brewing
    name: 童年读诗随俗立解
    labels:
      zh: 萌芽
    start_date: 约1810
    highlight_event_id: guji-多隆阿-event-bagong
  - key: breakthrough
    name: 壮岁积片楮成初稿
    labels:
      zh: 初成
    start_date: 约1832
    highlight_event_id: guji-多隆阿-event-chugao
  decisions:
  - date: 约1832
    title_zh: 录成卷帙名曰多识
    rationale: 积稿既多恐散失，遵夫子多识鸟兽草木之教，专载名物以补注家摸棱之弊
  - date: 约1833
    title_zh: 缮写寄周华甫求订
    rationale: 一人之见不无偏执，欲得师友折衷，留瑕颣以备指摘
- id: guji-多隆阿-endeavor-2
  title_zh: 燕晋游历归来重加删润
  summary_zh: 辛亥自燕晋游归，重检原草，益以数年闻见，参互考证，详关左所见，疑者阙疑
  phases:
  - key: climax
    name: 游燕晋扩闻见多见
    labels:
      zh: 考验
    start_date: 约1845
    highlight_event_id: guji-多隆阿-event-youyanjin
  - key: closure
    name: 辛亥重修定十二卷
    labels:
      zh: 定稿
    start_date: 1851
    highlight_event_id: guji-多隆阿-event-chongxiu
  decisions:
  - date: 1851
    title_zh: 以亲见正旧误存旧说以俟后贤
    rationale: 关左一隅物已多异，疆域所限者备载先儒不加论断，确有据者详释古号杂以谚名
  - date: 1851
    title_zh: 不避繁芜俚俗以矫简略蹈空
    rationale: 病陆疏简略蔡解蹈空，宁详毋略，宁实毋空，务使阅者因端竟委即流寻源
events:
- id: guji-多隆阿-event-birth
  title_zh: 出生
  date: 约1800
  year_of: 1800
  description_zh: 长白舒穆禄氏，字文希，生于嘉庆末道光初间
- id: guji-多隆阿-event-bagong
  title_zh: 道光乙酉拔贡
  date: 1825
  year_of: 1825
  description_zh: 列道光乙酉同年齿录为拔贡，检阅身份，嘉道间经学名家
- id: guji-多隆阿-event-chugao
  title_zh: 初成毛诗多识寄周华甫
  date: 约1832
  year_of: 1832
  description_zh: 读汉唐注疏十数年成十二卷初稿，缮写寄同年周华甫求订正，其后本失
- id: guji-多隆阿-event-youyanjin
  title_zh: 自燕晋游归检得原草
  date: 约1850
  year_of: 1850
  description_zh: 自燕晋游归，日长多暇，偶阅旧书见原草尚存，遂谋重修
- id: guji-多隆阿-event-chongxiu
  title_zh: 辛亥重加删润成书
  date: 1851
  year_of: 1851
  description_zh: 岁在辛亥重光大渊献，益以数年闻见参互考证，改正昨非今是，成慧珠阁再序本
- id: guji-多隆阿-event-death
  title_zh: 逝世
  date: 约1865
  year_of: 1865
  description_zh: 卒年不详，约在同治初后，书止传曹风前，有祭酒家藏本及侍讲校语流传
