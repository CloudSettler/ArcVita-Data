endeavors:
- id: guji-姚舜牧-endeavor-1
  title_zh: 重订诗经疑问十二卷之撰述
  description: 兼用毛传朱传及严粲诗缉，屡疑屡订，辨成王未赐周公天子礼乐，通融赋比兴，强调以意逆志得诗人一定之志
  phases:
  - key: brewing
    name: 数十年蓄疑
    labels:
      zh: 蓄疑
    start_date: 1580-01-01
    highlight_event_id: guji-姚舜牧-event-1
  - key: breakthrough
    name: 参酌三家自出新论
    labels:
      zh: 立说
    start_date: 1600-01-01
    highlight_event_id: guji-姚舜牧-event-1
  - key: climax
    name: 万历辛亥重订成书
    labels:
      zh: 重订
    start_date: 1611-12-01
    highlight_event_id: guji-姚舜牧-event-2
  - key: closure
    name: 清高启后轩自序俟知
    labels:
      zh: 俟知
    start_date: 1611-12-01
    highlight_event_id: guji-姚舜牧-event-2
  decisions:
  - date: 1600-01-01
    title_zh: 兼用毛朱而不为旧说拘束
    rationale: 以毛传朱传诗缉为参而以己意裁之，务求诗人本志而非姑为讲解
  - date: 1611-12-01
    title_zh: 前误亟为辨正不恤制义
    rationale: 心独苦而求高明裁订，藏名山俟千载，坚持辨正旧解
- id: guji-姚舜牧-endeavor-2
  title_zh: 诸经疑问体系与疑古治经
  description: 由易经疑问推及诸经皆立疑问，晚年用力最深在诗，倡疑经以明经之风
  phases:
  - key: brewing
    name: 治易起疑
    labels:
