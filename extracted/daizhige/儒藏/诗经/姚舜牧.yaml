    start_date: 1611-12-01
    highlight_event_id: guji-姚舜牧-event-2
  - key: closure
    name: 四库著录流传
    labels:
      zh: 流传
    start_date: 1780-05-01
    highlight_event_id: guji-姚舜牧-event-3
  decisions:
  - date: 1590-01-01
    title_zh: 三纬通融不截然三分
    rationale: 赋比兴通融取义，若截然分则求之不得而浸失其义
  - date: 1605-01-01
    title_zh: 不信古人字少假借之说
    rationale: 守本字解龙光伴奂等，虽失于少见古书亦欲守一字一义之隽永
events:
- id: guji-姚舜牧-event-birth
  title_zh: 出生于乌程
  date: 1540-01-01
  year_of: 1540
  description: 明嘉靖末约生于浙江乌程，后自称乌程后学
  place_zh: 乌程
- id: guji-姚舜牧-event-1
  title_zh: 治诸经立疑问
  date: 1590-01-01
  year_of: 1590
  description: 于诸经皆有疑问，兼采毛传朱传及严粲诗缉，自出新论
- id: guji-姚舜牧-event-2
  title_zh: 重订诗经疑问成书自序
  date: 1611-12-01
  year_of: 1611
  description: 万历辛亥季冬书于清高启后轩，言所疑凡经数十年且重加订问
  place_zh: 清高启后轩
- id: guji-姚舜牧-event-3
  title_zh: 四库全书著录与评定
  date: 1780-05-01
  year_of: 1780
  description: 乾隆四十五年五月总纂纪昀等校上提要，称说诗为差善而讥其少见古书
- id: guji-姚舜牧-event-death
  title_zh: 逝世
  date: 1625-01-01
  year_of: 1625
  description: 约卒于明天启初，诸经疑问稿流传于世
