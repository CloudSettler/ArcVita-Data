    start_date: 1702
    highlight_event_id: guji-姚际恒-event-bianlun
  - key: climax
    name: 九经通论略具规模伪书考成
    labels:
      zh: 高潮
    start_date: 1705
    highlight_event_id: guji-姚际恒-event-jiujing
  - key: closure
    name: 诸稿散佚仅诗礼得全
    labels:
      zh: 收束
    start_date: 1715
    highlight_event_id: guji-姚际恒-event-death
  decisions:
  - date: 1702
    title_zh: 以潜抑二序证小序为汉人所作
    rationale: 潜袭吕氏月令抑首鼠两端皆显露弊窦则三百篇时事不足信
  - date: 1705
    title_zh: 略毛郑传笺专折中序与集传是非
    rationale: 毛传惟训诂郑笺卤莽不足论是非关键惟在小序与集传当择善而从
