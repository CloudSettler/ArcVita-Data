  - key: climax
    name: 十八卷成作自序明释诗独难
    labels:
      zh: 高潮
    start_date: 1705-10
    highlight_event_id: guji-姚际恒-event-tonglun
  - key: closure
    name: 藏稿钞传待后人刊布
    labels:
      zh: 收束
    start_date: 1710
    highlight_event_id: guji-姚际恒-event-tonglun
  decisions:
  - date: 1700
    title_zh: 不悬成见涵泳辨别从是黜非
    rationale: 明人凿空臆说不可从当寻绎文义辨别前说守阙疑
  - date: 1705-10
    title_zh: 宁获罪前人不遗误后人直书正旨
    rationale: 汉人之失在固宋人之失在妄皆埋没原诗真面目当明言集传郑声淫之误与小序潜抑之谬
- id: guji-姚际恒-endeavor-2
  title_zh: 九经通论与古今伪书考辨
  description_zh: 遍考九经存真别伪著古文尚书礼记春秋仪礼论语诸通论并考诗序来历辨卫宏所作非子夏毛公之旧
  phases:
  - key: brewing
    name: 遍考九经积稿等身
    labels:
      zh: 酝酿
    start_date: 1685
    highlight_event_id: guji-姚际恒-event-xuejing
  - key: breakthrough
    name: 考定诗序为卫宏作辨潜抑二篇之谬
    labels:
