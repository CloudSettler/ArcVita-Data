endeavors:
- id: guji-姚际恒-endeavor-1
  title_zh: 撰著诗经通论十八卷
  description_zh: 涵泳三百篇寻绎文义分兴而比与兴比而赋与赋为二例黜小序固滞与集传淫诗妄说以文学说诗
  phases:
