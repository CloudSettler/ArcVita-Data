    description: 以小序首句为据兼采众说持论和平不专主毛郑不专主朱子
  - title_zh: 明亡后出仕还是闭户守节
    description: 屡试不第遭时变革闭户却扫绝迹人事以著述经史终老
  lesson: 以序为本而不尽信确有证据不敢苟同持论和平消融门户之见
  summary_first_person: 我是盐官张次仲字元岵天启辛酉举于乡屡上春官不第明亡后闭户著述读易之余笺注毛诗二十年成待轩诗记八卷老病命孙刊成
