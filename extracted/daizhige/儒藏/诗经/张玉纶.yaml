  dilemmas:
  - 读若反切叶音皆失古音而世儒弃乐工口授如遗欲从歌声求古音则恐招物议
  - 亭林诗本音引证闳博而音韵源流未的欲自述一得俟知音又不敢直斥古人
  lesson: 礼失求野歌存古音以口授验经文不叶而自协
  summary_first_person: 余辽阳张玉纶号梦月轩主人少从友王补楼闻歌得古音之绪两三月间切究而毛诗古音尽复无待于叶癸巳补楼谢世每读诗辄悲怆今老矣追忆切磋作毛诗古乐音一书为家塾读本以俟知音
  source_urls:
