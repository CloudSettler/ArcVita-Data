      - 考据
      - 补阙
    start_date: '1345-01-01'
    highlight_event_id: guji-朱公迁-event-kaozheng
  - key: climax
    name: 书成丁亥
    labels:
      zh:
      - 著述
      - 二十卷成
    start_date: '1347-01-01'
    highlight_event_id: guji-朱公迁-event-shucheng
  - key: closure
    name: 辑录增释
    labels:
      zh:
      - 附益
      - 刊行
    start_date: '1347-06-01'
    highlight_event_id: guji-朱公迁-event-shucheng
  decisions:
  - date: '1342-01-01'
    title_zh: 立注有疏之例发明集传
    rationale: 宗守朱子不逾尺寸，如注有疏故曰疏义，以定三百篇大防
  - date: '1347-01-01'
    title_zh: 辨证补阙详考出处而成书
    rationale: 以尔雅正崔嵬石戴土，以岁差正流火月令，以考订补赵伯循曾氏等名氏，用心不苟
events:
- id: guji-朱公迁-event-birth
  title_zh: 生于乐平
  date: '1295-01-01'
  year_of: 1295
  type: birth
  description_zh: 朱公迁字克升饶州乐平人，生年失载约元初，潜心朱子之学
- id: guji-朱公迁-event-xiangshi
  title_zh: 至正辛巳领浙江乡试
  date: '1341-01-01'
  year_of: 1341
  type: career
  description_zh: 以至正辛巳领浙江乡试，始得进身，后以特恩授教官
- id: guji-朱公迁-event-jiaoshou
  title_zh: 教婺州正金华郡庠
  date: '1342-01-01'
  year_of: 1342
  type: career
  description_zh: 授教官得正金华婺州郡庠，以诗经风雅颂之正经为教
- id: guji-朱公迁-event-chuzhou
  title_zh: 改处州学正
  date: '1345-01-01'
  year_of: 1345
  type: career
  description_zh: 由婺州改处州学正，江西通志载其至正间为处州学正，化士以经
- id: guji-朱公迁-event-kaozheng
  title_zh: 推考崔嵬岁差等义
  date: '1346-01-01'
  year_of: 1346
  type: career
  description_zh: 引尔雅说文正卷耳崔嵬当为石戴土，推验岁差正七月流火在五六月之交，并考卫风赵子为赵伯循等出处
- id: guji-朱公迁-event-shucheng
  title_zh: 至正丁亥疏义会通成书
  date: '1347-01-01'
  year_of: 1347
  type: career
  description_zh: 诗经疏义会通二十卷成，为发明朱子集传而作，后经同里王逄辑录何英增释附益
- id: guji-朱公迁-event-death
  title_zh: 至正后卒
  date: '1360-01-01'
  year_of: 1360
  type: death
  description_zh: 至正后卒于任或里中，卒年失载，遗稿经王逄何英增订于正统甲子刊行传世
