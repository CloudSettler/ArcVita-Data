  decisions:
  - date: '1341-01-01'
    title_zh: 应浙江乡试求仕设教
    rationale: 以经术致用，愿得教官以明朱子之学于郡庠
  - date: '1345-01-01'
    title_zh: 从婺州改处州学正
    rationale: 随命转任，务在经夫妇成孝敬厚人伦以移风俗
- id: guji-朱公迁-endeavor-2
  title_zh: 发明集传作疏义会通
  summary_zh: 为发明朱子集传而作疏义，墨守不逾而间有辨证，后经王逄辑录何英增释而成会通
  phases:
  - key: brewing
