  archetype: 守朱传经之儒师
  dilemmas:
  - 墨守朱子集传尺寸不逾与据经考据辨证补阙之间如何守正而不失真
  - 详考典故出处名氏与阐明宏旨大义之间如何用心不苟而不拘细末
  lesson: 守朱为宗而能以尔雅岁差典故考订补其阙，用心不苟方能成疏义会通
  summary_first_person: 吾朱公迁字克升乐平人，至正间领乡试教婺州改处州，以发明朱子集传作诗经疏义会通二十卷，墨守而间有辨证，成于至正丁亥以俟后贤
