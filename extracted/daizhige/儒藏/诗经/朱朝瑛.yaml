  decisions:
  - date: 1660-01-01
    title_zh: 以小序首句为主
    rationale: 亡诗六篇仅存首句则首句作于未亡之前其下作于既亡之后，与程大昌同而辨之尤明，足决千古之疑
  - date: 1662-01-01
    title_zh: 不尽废朱子而斟酌折中
    rationale: 朱子言理则得言情未尽，国风得十之五小雅得十之七大雅颂得十之九，后人好异尽易之则过，故於楚茨抑生民诸篇参稽荀子竹书以取持平
  - date: 1664-01-01
    title_zh: 斥伪子贡传申培说
    rationale: 以鲁颂为鲁风以定之方中为僖公楚宫者揣摩乱真，当以经证经以春秋书城楚丘虎牢之义辨其伪
