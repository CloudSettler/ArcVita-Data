  dilemmas:
  - title_zh: 小序存废之辨
    description_zh: 朱子尽废小序而以己意揣摩，好异者又尽易集传，吾主以小序首句为据，参稽折中以取持平
  - title_zh: 郑卫淫奔与刺俗之辨
    description_zh: 世争郑卫为淫奔自作还是刺诗，吾谓有刺其人者如卫宣公之类，有刺其俗者如桑中溱洧之类，当别观辞气与国俗
  lesson: 论诗当以小序首句为据，不尽废朱子，不苟从伪说，参稽融贯，务取持平，涵泳性情以得温柔敦厚之旨
  summary_first_person: 吾朱朝瑛，明末诸生，隐居稽古，先成读易略记，继成读诗略记，谓亡诗六篇仅存首句则首句作于未亡之前，足决小序首句之可据，既不废朱子，亦不尽易旧说，於楚茨抑生民诸篇皆考据折中，愿后人因声求志，得思无邪之教
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E8%AF%BB%E8%AF%97%E7%95%A5%E8%AE%B0.html
