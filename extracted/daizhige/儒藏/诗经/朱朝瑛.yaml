    title_zh: 先治易以明理义
    rationale: 易以发挥理义，书不尽言言不尽意，必先明理而后可涵泳诗之性情
  - date: 1655-01-01
    title_zh: 由易转治诗
    rationale: 易理既明，当以温柔敦厚之教正风化，故继作读诗略记
