    description: 时制以朱注列学官而朱注多坐国风以淫奔心窃疑之不敢轻发
  - title_zh: 从毛郑小序与从朱子已见之折衷
    description: 小序一举归刺朱子一举归淫不自揣量折衷其间又惧为迂儒妄人
  lesson: 不专主一家折衷汉宋议论平和绝无门户之见守阙疑之义
  summary_first_person: 余李先芳字伯承号北山湖广监利人嘉靖丁未进士官至尚宝司少卿列广五子之一自童时授诗疑朱注以郑卫为淫奔归田之暇考东莱吕氏及注疏大全折衷成读诗私记五卷藏之山中以备考订
