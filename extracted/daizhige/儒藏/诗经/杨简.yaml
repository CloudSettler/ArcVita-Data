  archetype: 心学经师
  dilemmas:
  - 师法陆九渊本心之说而于经传训诂当如何折衷去取
  - 尊孔子思无邪之旨而于毛序郑笺及小序当如何辨伪存真
  lesson: 自信本心即道，诵诗以兴起良心，不为章句所蔽
  summary_first_person: 吾杨简字敬仲号慈湖，明州慈溪人，师事陆九渊而悟本心即道，谓六经一道，诗三百一言以蔽之曰思无邪，遂作慈湖诗传二十卷，黜卫宏毛序之穿凿，考核六书训诂而曲畅其说，欲使学者诵咏二南而兴起自有之良心，不复面墙
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E6%85%88%E6%B9%96%E8%AF%97%E4%BC%A0.md
