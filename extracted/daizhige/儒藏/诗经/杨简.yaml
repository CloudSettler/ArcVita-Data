endeavors:
- id: guji-杨简-endeavor-1
  name_zh: 师事陆九渊发明本心之学
  summary: 出入经史而归本于心，自信人心自善自正自无邪，以一贯通六经
  phases:
  - key: brewing
    name: 慈溪问道初悟本心
    labels:
      zh:
      - 问道
      - 悟道
    start_date: 1168
    highlight_event_id: guji-杨简-event-study-lu
  - key: breakthrough
    name: 以心解经卓然成家
    labels:
      zh:
      - 立说
      - 传道
    start_date: 1185
    highlight_event_id: guji-杨简-event-yizhuan
  - key: closure
    name: 慈湖讲学化行四方
    labels:
      zh:
      - 讲学
      - 化成
    start_date: 1210
    highlight_event_id: guji-杨简-event-jiangxue
  decisions:
  - date: 1175
    title_zh: 决意师陆九渊舍章句而求本心
    rationale: 谓人心自正不必远求，遂以孔子思无邪为宗，不泥传注
  - date: 1190
    title_zh: 决以六经一道立教不分汉宋门户
    rationale: 谓其文则六其道则一，欲学者自信自有之经，不为序说所蔽
- id: guji-杨简-endeavor-2
  name_zh: 撰慈湖诗传折衷训诂
  summary: 据思无邪之旨辨毛序之失，博引说文尔雅方言而自成一家，并采吴棫补音以存古韵
  phases:
  - key: brewing
    name: 搜辑诗序传注博考名物
    labels:
      zh:
      - 考据
      - 集说
    start_date: 1195
    highlight_event_id: guji-杨简-event-yizhuan
  - key: climax
    name: 诗传二十卷勒成一家之言
    labels:
      zh:
      - 著述
      - 成书
    start_date: 1215
    highlight_event_id: guji-杨简-event-shizhuan
  - key: closure
    name: 遗书补序总论流传后世
    labels:
      zh:
      - 补辑
      - 流传
    start_date: 1226
    highlight_event_id: guji-杨简-event-death
  decisions:
  - date: 1210
    title_zh: 决据后汉书以小序出卫宏不足深信
    rationale: 谓孔子不作序，毛卫转远而失圣人删诗大旨，故直求本诗正情
  - date: 1215
    title_zh: 决以本心释关雎葛覃而不推世系穿凿
    rationale: 谓诵咏即足以兴起道心，若赘言世人国故则如云翳日尘积鉴
