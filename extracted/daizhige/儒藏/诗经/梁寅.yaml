  title_zh: 集庆训导与亲老辞归
  description: 元末屡举不第，辟为集庆路儒学训导，居二年以亲老辞归守孝讲学
  phases:
  - key: brewing
    name: 屡举不第潜心经学
    labels:
      zh: 潜修待辟
    start_date: '1345'
    highlight_event_id: guji-梁寅-event-birth
  - key: breakthrough
    name: 辟授集庆路儒学训导
    labels:
      zh: 训导授业
    start_date: '1362'
    highlight_event_id: guji-梁寅-event-jiaoxun
  - key: climax
    name: 居二年以亲老辞归
    labels:
      zh: 舍官全孝
    start_date: '1364'
    highlight_event_id: guji-梁寅-event-jiaoxun
  - key: closure
    name: 归养新喻退居授徒
    labels:
      zh: 归隐授徒
    start_date: '1366'
    highlight_event_id: guji-梁寅-event-jiaoxun
  decisions:
  - date: '1364'
    title_zh: 以亲老辞训导归
    rationale: 亲老需养不可久离，官守虽荣不如全孝，故居二年即辞归
  - date: '1366'
    title_zh: 绝意仕进专治经义
    rationale: 元季纷扰虚谈多而笃实少，宜守正学以待时，不复奔竞科举
- id: guji-梁寅-endeavor-2
  title_zh: 考定礼乐与演义诗传
  description: 洪武初征聘考定礼乐，书成辞官退居石门，申朱子诗传之义作诗演义十五卷
  phases:
  - key: brewing
    name: 洪武初征聘考礼
    labels:
      zh: 应征考礼
    start_date: '1369'
    highlight_event_id: guji-梁寅-event-kaoli
  - key: breakthrough
    name: 礼乐书成赐金币辞官
    labels:
      zh: 成书辞官
    start_date: '1370'
    highlight_event_id: guji-梁寅-event-kaoli
  - key: climax
    name: 退居石门博稽训诂
    labels:
      zh: 石门著述
    start_date: '1375'
    highlight_event_id: guji-梁寅-event-xushu
  - key: closure
    name: 洪武十六年序诗演义
    labels:
      zh: 演义垂教
    start_date: 1383-05
    highlight_event_id: guji-梁寅-event-xushu
  decisions:
  - date: '1370'
    title_zh: 书成将授官以老病辞
    rationale: 年老多病不堪官事，退居方能保节全学，故受赐金币而不受官
  - date: 1383-05
    title_zh: 为幼学作诗演义
    rationale: 传或简略初学难通，须先用传义而博稽训诂，使隐者显略者详，一遵程朱以正义理
