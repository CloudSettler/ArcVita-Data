  name_zh: 梁寅
  names:
    zh: 梁寅
    en: Liang Yin
  lifespan:
    birth:
      date: '1309'
      precision: year
      is_circa: false
      raw: 元至顺元年
    death:
      date: '1390'
      precision: year
      is_circa: false
      raw: 明洪武二十三年
  birth_date: '1309'
  death_date: '1390'
  era: 元末明初
  reign_ref: 明太祖洪武
  archetype: 笃实隐儒
  dilemmas:
  - 亲老须归养与训导官守之间当舍官全孝
  - 礼乐书成将授官与年老多病之间当辞荣保节
  lesson: 训诂必明义理必正，笃实为学可启幼蒙，退隐亦足垂教
  summary_first_person: 余新喻梁寅字孟敬，元末屡举不第，曾辟集庆路儒学训导，居二年以亲老辞归，洪武初与天下名儒考定礼乐，书成赐金币以老病辞官，退居石门，博稽训诂以启其塞，根极义理以达其意，专申朱子诗传之义，为幼学作诗演义十五卷，欲使隐者显略者详，以温柔敦厚之教感人心而易入
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E8%AF%97%E6%BC%94%E4%B9%89.md
