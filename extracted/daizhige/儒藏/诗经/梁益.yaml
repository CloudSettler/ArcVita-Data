  kind: birth
  description_zh: 先世福州三山，自署三山，家江阴，字友直号庸斋
- id: guji-梁益-event-xiangshi
  title_zh: 举江浙乡试不仕
  date: '1330'
  year_of: 1330
  kind: career
  description_zh: 尝举江浙乡试不及仕宦，遂教授乡里以终
