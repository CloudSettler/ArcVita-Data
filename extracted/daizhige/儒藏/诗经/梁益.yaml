  decisions:
  - date: '1335'
    title_zh: 以旁通为名兼辑诸说
    rationale: 法杜文瑛语孟旁通之例，不泥不僻，发挥旁通以该贯集传出处
  - date: '1340'
    title_zh: 不坚持门户是是非非
    rationale: 引礼部韵正陆德明音切之异，补朱子未详，绝不攀附高名言言附合
- id: guji-梁益-endeavor-2
  title_zh: 乡试不仕教授乡里
  summary_zh: 举江浙乡试不仕，终身教授乡里以淑人，事迹附元史陆文圭传
  phases:
  - key: brewing
    name: 三山江阴家学
    labels:
