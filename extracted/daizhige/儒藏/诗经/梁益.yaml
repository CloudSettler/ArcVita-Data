endeavors:
- id: guji-梁益-endeavor-1
  title_zh: 撰述诗传旁通
  summary_zh: 仿孔贾注疏明注文之例，旁引群经诸说以通朱子诗集传，成十五卷
  phases:
  - key: brewing
    name: 潜心诗经
