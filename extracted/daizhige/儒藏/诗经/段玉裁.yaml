  - 出仕养亲与归里治经之抉择
  - 尊郑守许与实事求是之权衡
  lesson: 以声音通训诂，以训诂明经义，守实事求是之法
  summary_first_person: 我是段玉裁，字若膺，号懋堂，金坛人，师事戴震而治许郑之学，我订毛传郑笺之得失，成毛诗故训传定本，辨关雎后妃之德与风雅变正之体，又以三十余年之力注说文解字，欲以形声古音通群经大义
