  - date: '1773'
    title_zh: 执弟子礼于戴震
    rationale: 闻转语而悟小学为经学之基，遂尽弃旧学而从之
  - date: '1813'
    title_zh: 先成说文注后付梓
    rationale: 一字未安不敢轻出，必使形音义无余蕴而后传世
