  decisions:
  - date: '1786'
    title_zh: 辞官归里专治经训
    rationale: 以官守妨于考据，不若解组以全著述之志
  - date: '1798'
    title_zh: 以说文声韵法治毛诗
    rationale: 毛传多古训，必以形声假借求之，方能辨传笺是非
- id: guji-段玉裁-endeavor-2
  title_zh: 注释说文解字立古音学
  summary_zh: 承戴震之学，三十余年注说文解字，作六书音韵表，立古声纽韵部之纲，以通群经
