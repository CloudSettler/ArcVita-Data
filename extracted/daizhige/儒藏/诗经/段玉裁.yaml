  date: '1798'
  year_of: 1798
  place_zh: 苏州
  description_zh: 订正毛传郑笺，发明关雎为后妃之德风之始，葛覃为后妃之本，卷耳为后妃之志，樛木逮下，螽斯多嗣，以正始之道明王化之基
