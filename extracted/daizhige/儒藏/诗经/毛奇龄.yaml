    start_date: 1679
    highlight_event_id: guji-毛奇龄-event-hanlin
  - key: climax
    name: 复作诗札托写官答问
    labels:
      zh:
      - 札问授徒
    start_date: 1692
    highlight_event_id: guji-毛奇龄-event-shizha
  - key: closure
    name: 门人记少时所作多非定论
    labels:
      zh:
      - 付后择取
    start_date: 1705
    highlight_event_id: guji-毛奇龄-event-zixing
  decisions:
  - date: 1679
    title_zh: 应鸿博出仕以展经术
    rationale: 以贫者禄仕可就馆阁校雠并得刊布诗说垂示后学
  - date: 1692
    title_zh: 再托写官札答以存异义
    rationale: 毛郑异义齐鲁殊文汉代专门不限一说兼收并蓄固说经家所旁采
