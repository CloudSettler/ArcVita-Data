    start_date: 1705
    highlight_event_id: guji-毛奇龄-event-zixing
  decisions:
  - date: 1685
    title_zh: 取汉写官为名托问答成记
    rationale: 忆壁中写官说诗于堂不能尽记以纤词琐文杂成记如复供其写不为专隅
  - date: 1690
    title_zh: 专辨朱子而仍称毛诗从始
    rationale: 以朱子置齐鲁韩毛郑诸家而自为诗故须写其所写各成其义说得无得不得无失
- id: guji-毛奇龄-endeavor-2
  title_zh: 博学鸿词入翰林以经学授徒
  summary_zh: 康熙博学鸿词授翰林院检讨以经例诗札授门人兼收并蓄旁采汉唐诸家
  phases:
  - key: brewing
