  title_zh: 辑佚三家诗撰诗攷
  summary_zh: 检诸书所引集韩鲁齐三家逸文，又附诗异字异义逸诗及补遗，以存亡诗
  phases:
  - key: brewing
    name: 读朱子集传说三家
    labels:
      zh: 萌芽
    start_date: '1241'
    highlight_event_id: guji-王应麟-event-jinshi
  - key: breakthrough
    name: 网罗传记辑韩诗
    labels:
      zh: 积累
    start_date: '1260'
    highlight_event_id: guji-王应麟-event-jishi
  - key: climax
    name: 成帙分韩鲁齐异义逸诗
    labels:
      zh: 成书
    start_date: '1270'
    highlight_event_id: guji-王应麟-event-shikao
  - key: closure
    name: 别为补遗以掇拾所缺
    labels:
      zh: 补遗
    start_date: '1275'
    highlight_event_id: guji-王应麟-event-shikao
  decisions:
  - date: '1260'
    title_zh: 以朱子之意为宗广参三家
    rationale: 朱子集传取匡衡刘向仪礼左氏国语汉书韩序等，一洗专己守残之陋，故亦扶微学广异义
  - date: '1270'
    title_zh: 每条著所出旁搜说文尔雅
    rationale: 三家绪言尚多存于传记注疏类书，当罔罗遗轶傅以小学诸书以成一编
- id: guji-王应麟-endeavor-2
  title_zh: 困学博闻撰玉海困学纪闻
  summary_zh: 守馆阁博闻强记，编玉海二百卷及困学纪闻诗地理考汉制考等以备典故
  phases:
  - key: brewing
    name: 登第入馆博览群书
    labels:
      zh: 入仕
    start_date: '1241'
    highlight_event_id: guji-王应麟-event-jinshi
  - key: breakthrough
    name: 兼崇政殿说书编玉海
    labels:
      zh: 编纂
    start_date: '1260'
    highlight_event_id: guji-王应麟-event-yuhai
  - key: climax
    name: 辞官归鄞著困学纪闻
    labels:
      zh: 归隐
    start_date: '1276'
    highlight_event_id: guji-王应麟-event-guiyin
  - key: closure
    name: 授徒讲学以经术惠后
    labels:
      zh: 授徒
    start_date: '1290'
    highlight_event_id: guji-王应麟-event-guiyin
  decisions:
  - date: '1260'
    title_zh: 述职编玉海备君臣考据
    rationale: 朝廷经筵需典故渊海，当搜辑经史会要以便御览讲读
  - date: '1276'
    title_zh: 宋亡不仕元归乡著述
    rationale: 国亡不仕新朝，守遗民之节，以著述存斯文于江南
events:
- id: guji-王应麟-event-birth
  date: '1223'
  year_of: 1223
  title_zh: 生于庆元府鄞县
  description_zh: 宋嘉定十六年生于鄞，字伯厚，父王撝，少颖悟博闻
- id: guji-王应麟-event-jinshi
  date: '1241'
  year_of: 1241
  title_zh: 淳祐元年进士及第
  description_zh: 登淳祐元年进士，调西安主簿，入馆阁为正字校书郎
- id: guji-王应麟-event-jishi
  date: '1260'
  year_of: 1260
  title_zh: 兼崇政殿说书搜三家说
  description_zh: 兼崇政殿说书兼侍讲，读朱子集传，始罔罗韩鲁齐遗说及说文尔雅诸书
- id: guji-王应麟-event-shikao
  date: '1270'
  year_of: 1270
  title_zh: 撰成诗攷一卷
  description_zh: 集韩诗鲁诗齐诗以存三家逸文，又附诗异字异义逸诗并补遗，自序言扶微学广异义之意
- id: guji-王应麟-event-yuhai
  date: '1268'
  year_of: 1268
  title_zh: 编成玉海二百卷
  description_zh: 在馆阁编成玉海，备天文地理制度典故，为一时之大典
- id: guji-王应麟-event-guiyin
  date: '1276'
  year_of: 1276
  title_zh: 宋亡归鄞著困学纪闻
  description_zh: 宋亡归鄞不仕，著困学纪闻诗地理考古诗考等，授徒讲学以终
- id: guji-王应麟-event-death
  date: '1296'
  year_of: 1296
  title_zh: 卒于鄞县
  description_zh: 元贞二年卒于家，年七十四，后人踵事增修三家诗拾遗等皆以其书为首庸
