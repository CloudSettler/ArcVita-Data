  dilemmas:
  - title_zh: 独宗毛郑与参攷三家
    description_zh: 当时诸儒说诗壹以毛郑为宗，未有参攷齐鲁韩三家者，若从朱子之意广搜异义，则散佚难收
  - title_zh: 创始搜辑与遗漏疏略
    description_zh: 古书散佚搜采为难，恐有遗漏如后人所摘十九条，然筚路蓝缕终当为首倡
  lesson: 网罗遗轶以扶微学，筚路蓝缕以待后人增修
  summary_first_person: 吾王应麟字伯厚，鄞人也，观朱文公集传参取三家之意，乃罔罗传记三家绪言，傅以说文尔雅诸书，稡为诗攷一编，以存韩鲁齐逸文及异字异义逸诗，冀读集传者有所攷焉
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E8%AF%97%E6%94%B7.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E8%AF%97%E6%94%B7.html
endeavors:
