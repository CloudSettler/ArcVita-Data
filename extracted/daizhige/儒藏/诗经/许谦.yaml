  name_zh: 许谦
  names:
    zh: 许谦
    en: Xu Qian
  lifespan:
    birth:
      date: 1270
      precision: year
      is_circa: false
      raw: 元至元七年
    death:
      date: 1337
      precision: year
      is_circa: false
      raw: 元至元三年
  birth_date: 1270
  death_date: 1337
  era: 元代
  reign_ref: 元世祖至元七年至元惠宗至元三年
  archetype: 经学师儒
  dilemmas:
  - 师承王柏二南相配移经之说与守圣经原貌之间如何抉择
  - 郑声淫诗当存当黜之间如何守朱子存而不论之义
  - 广引毛郑孔陆诸说与独尊朱子集传之间如何权衡
  lesson: 守正而不株守门户，补阙而不轻窜圣经，方能羽翼先儒嘉惠后学
  summary_first_person: 吾许谦字益之婺州金华人号白云先生，少受学于王柏金履祥得朱子四传之绪，讲学乡里以醇正自持，旁搜博采成诗集传名物钞八卷以补集传名物音训之阙，谱正时世以羽翼朱子于无穷
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E8%AF%97%E9%9B%86%E4%BC%A0%E5%90%8D%E7%89%A9%E9%92%9E.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%97%E7%BB%8F/%E8%AF%97%E9%9B%86%E4%BC%A0%E5%90%8D%E7%89%A9%E9%92%9E.md
endeavors:
- id: guji-许谦-endeavor-1
  title_zh: 承朱子四传讲学金华
  summary: 受业王柏金履祥绍黄勉斋何北山之绪以醇正化乡授徒吴师道等开浙东朱学正脉
  phases:
  - key: brewing
    name: 少力学经
    labels:
      zh:
      - 养蒙
      - 立志
    start_date: 1278
    highlight_event_id: guji-许谦-event-birth
  - key: breakthrough
    name: 师事王金得统
    labels:
      zh:
      - 求道
      - 师承
    start_date: 1287
    highlight_event_id: guji-许谦-event-study
  - key: climax
    name: 白云讲道授徒
    labels:
      zh:
      - 讲学
      - 育才
    start_date: 1310
    highlight_event_id: guji-许谦-event-teach
  - key: closure
    name: 醇正过师风范垂后
    labels:
      zh:
      - 守正
      - 垂范
    start_date: 1335
    highlight_event_id: guji-许谦-event-death
  decisions:
  - date: 1287
    title_zh: 笃守王金而不尽从其窜经
    rationale: 受学王柏而醇正过之于所删国风三十二篇疑而未敢遽信以守是非之公
  - date: 1310
    title_zh: 开门授徒以读书丛说教四书
    rationale: 念朱传大义已明当先正蒙养使学者由四书以达诸经故不专以诗名家
- id: guji-许谦-endeavor-2
  title_zh: 撰诗集传名物钞羽翼朱传
  summary: 念朱子集传犹有未备旁搜博采引王金附己见考名物正音释谱时世成八卷以补阙遗
  phases:
  - key: brewing
    name: 采集诸说博考名物
    labels:
      zh:
      - 辑佚
      - 考据
    start_date: 1315
    highlight_event_id: guji-许谦-event-teach
  - key: breakthrough
    name: 纲领发明大序温柔敦厚之旨
    labels:
      zh:
      - 明义
      - 立纲
    start_date: 1325
    highlight_event_id: guji-许谦-event-book
  - key: climax
    name: 八卷钞成考训度数粲然毕具
    labels:
      zh:
      - 著述
      - 补传
    start_date: 1335
    highlight_event_id: guji-许谦-event-book
  - key: closure
    name: 吴师道序行四库著录嘉惠后学
    labels:
      zh:
      - 刊行
      - 传后
    start_date: 1337
    highlight_event_id: guji-许谦-event-death
  decisions:
  - date: 1330
    title_zh: 名曰钞以兼采陆德明孔颖达而不株守一家
    rationale: 朱传未备处须以释文正义参证方能音训有据故自名为钞以示不敢自专
  - date: 1335
    title_zh: 存用全经而不削郑声从王柏二南相配图姑存师说
    rationale: 遵用全经以存圣人放郑声之意虽列师图于卷中而终不破壊三百篇之旧
events:
- id: guji-许谦-event-birth
  date: 1270
  year_of: 1270
  title_zh: 生于婺州金华
  description: 元至元七年生于婺州金华少颖悟力学笃志圣贤之道
- id: guji-许谦-event-study
  date: 1287
  year_of: 1287
  title_zh: 师事王柏金履祥得朱子渊源
  description: 受学于鲁斋王柏仁山金履祥上接北山何基勉斋黄公直承朱子四传益大以尊
- id: guji-许谦-event-teach
  date: 1310
  year_of: 1310
  title_zh: 讲学白云授徒四方
  description: 隐居金华白云山讲授四书诸经四方学者来受业者甚众吴师道吴莱柳贯等皆出其门著读书丛说以教
- id: guji-许谦-event-book
  date: 1335
  year_of: 1335
  title_zh: 成诗集传名物钞八卷
  description: 旁搜博采引王金附己见正音释考名物度数谱作诗时世本康成而改从集传以羽翼朱传成书示吴师道等
- id: guji-许谦-event-death
  date: 1337
  year_of: 1337
  title_zh: 卒于金华吴师道为序
  description: 元至元三年卒于家门人吴师道既为读书丛说序复为名物钞序叹其淫诗屏黜之论未究而不可作后入四库经部诗类
