  decisions:
  - date: 1168-01-01
    title_zh: 初从吕祖谦问学
    rationale: 慕东莱之学先就近从游以立根基涵养德性为本
  - date: 1185-01-01
    title_zh: 改从朱子讲学不暖暖奉一先生之讥
    rationale: 既闻朱子之道遂往考亭执经问难各尊所闻各行所知谨守集传以明圣经本义
- id: guji-辅广-endeavor-2
  title_zh: 著诗童子问羽翼诗集传
  summary: 述平日闻于朱子之说不载经文惟录篇目分章训诂末卷专论叶韵以明风雅颂赋比兴之体
  phases:
  - key: brewing
    name: 采录大序小序及诸儒辨说
    labels:
      zh: 会萃纲领
    start_date: 1190-01-01
    highlight_event_id: guji-辅广-event-study-zhu
  - key: breakthrough
    name: 以童子问体述师说
    labels:
      zh: 问答发明
    start_date: 1195-01-01
    highlight_event_id: guji-辅广-event-book
  - key: climax
    name: 十卷成书明读诗之法
    labels:
      zh: 着书羽翼
    start_date: 1200-01-01
    highlight_event_id: guji-辅广-event-book
  - key: closure
    name: 汲古阁刊行传于后世
    labels:
      zh: 刊行传远
    start_date: 1200-01-01
    highlight_event_id: guji-辅广-event-book
  decisions:
  - date: 1195-01-01
    title_zh: 不载经文惟录篇目训诂以附集传
    rationale: 恐与朱子集传重复故上取集传下附童子问使学者知六义体面而讽咏以得之
  - date: 1200-01-01
    title_zh: 多掊击诗序专主义理不求考证
    rationale: 以先王之泽止乎礼义为大义所在虽或疏舛如潜篇之失亦不以引经据古为长但求感发惩创使人心无邪
