  dilemmas:
  - 集传主于义理而略名物训诂，当专言义理还是兼精考证
  - 小序集传聚讼两家，当委曲调停还是尽废古说
  lesson: 不立汉宋门户，镕铸群言而注明所出，精心考证以裨读诗
  summary_first_person: 吾顾镇字备九号古湫常熟人居城东故自号虞东乾隆甲戌进士官至宗人府主事吾著虞东学诗十二卷以讲学尊集传博古申小序而委曲调停兼考名物训诂声音愿持其平以助读诗者
