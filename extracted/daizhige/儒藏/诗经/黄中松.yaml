  decisions:
  - date: '1765'
    title_zh: 以辨证名书兼存异说
    rationale: 名物聚讼难一宁并存以待考故有雎鸠黍稷诸条两存之失
  - date: '1770'
    title_zh: 主毛传为宗参以朱传
    rationale: 关雎之义以毛为宗而义从朱合故断为后妃之德非刺康王
- id: guji-黄中松-endeavor-2
  title_zh: 辨正诗序四始风雅之说
  summary: 论诗序四诗入乐四始五际国风次第以明诗教本义
