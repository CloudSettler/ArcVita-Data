  - key: brewing
    name: 考诗序子夏卫宏诸说
    labels:
      zh: 考序
    start_date: '1750'
    highlight_event_id: guji-黄中松-event-study
  - key: breakthrough
    name: 论四诗皆可入乐
    labels:
      zh: 明乐
    start_date: '1768'
    highlight_event_id: guji-黄中松-event-complete
  - key: closure
    name: 定四始毛优于鲁齐韩
    labels:
      zh: 定论
    start_date: '1775'
    highlight_event_id: guji-黄中松-event-complete
  decisions:
  - date: '1768'
    title_zh: 断三百篇皆有声律可歌
    rationale: 乐必有诗诗未必皆入乐然不可谓徒诗而不入乐故辨程大昌之非
  - date: '1775'
    title_zh: 取毛氏四始弃纬书五际
    rationale: 水木火金配诗穿凿难信毛氏统风雅颂言王道兴衰为优故从毛
