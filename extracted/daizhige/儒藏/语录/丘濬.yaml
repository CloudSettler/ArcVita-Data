  name_zh: 丘濬
  names:
    zh: 丘濬
    en: Qiu Jun
  lifespan:
    birth:
      date: '1421'
      precision: year
      is_circa: false
      raw: 明永乐十九年
    death:
      date: '1495'
      precision: year
