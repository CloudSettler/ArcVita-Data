      raw: 明弘治八年
  birth_date: '1421'
  death_date: '1495'
  era: 明
  reign_ref: 成化弘治
  archetype: 经世儒臣
  dilemmas:
  - 体用兼全而议论易杂，如何补治平之阙而不乖正理
  - 居馆阁文墨而怀爱君忧国之心，如何以著述裨补初政万一
  lesson: 大学体用本末兼该，格致诚正之后必究治平之实，博综掌故以归可行
  summary_first_person: 我是丘濬，字仲深，琼山人，景泰进士，官居馆阁，尝侍经筵讲真氏衍义，见其止于齐家而阙治国平天下，乃采六经诸史百氏之言，缮写成大学衍义补，以收明德新民之功，愿采十百之中用二三之策
  source_urls:
  - https://daizhige.org/儒藏/语录/大学衍义补.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/语录/大学衍义补.md
endeavors:
- id: guji-丘濬-endeavor-1
  title_zh: 编纂大学衍义补以成全体大用
  summary: 仿真德秀体例，补治国平天下十二目一百六十卷，附以己见，冀资出治御世之具
  phases:
  - key: brewing
    name: 经筵见阙立志编摩
    labels:
      zh:
      - 经筵进讲
      - 补阙立志
    start_date: '1465'
    highlight_event_id: guji-丘濬-event-jinshi
  - key: breakthrough
    name: 采辑经史缮写初完
    labels:
      zh:
      - 采辑六经
      - 贯串古今
    start_date: '1480'
    highlight_event_id: guji-丘濬-event-zhangjian
  - key: climax
    name: 进表献书蒙诏刊行
    labels:
      zh:
      - 进献初政
      - 刊播广传
    start_date: '1487-11-18'
    highlight_event_id: guji-丘濬-event-jincheng
  - key: closure
    name: 累朝重梓列为经筵
    labels:
      zh:
      - 重梓刊行
      - 羽翼圣经
    start_date: '1488'
    highlight_event_id: guji-丘濬-event-jincheng
  decisions:
  - date: '1480'
    title_zh: 决意补齐家之后以治平终篇
    rationale: 网阙一目则不张，室亏一榱则不具，体用须兼该方成大用
  - date: '1487-11-18'
    title_zh: 奉表进大学衍义补四十帙
    rationale: 适际更化肃清，愿彻九重之听，取二三之策以裨初政万一
- id: guji-丘濬-endeavor-2
  title_zh: 历仕馆阁掌教入阁辅政
  summary: 由翰林庶吉士累迁国子监祭酒礼部尚书，弘治中入文渊阁，以旧典掌故参决政务
  phases:
  - key: brewing
    name: 景泰登第入选翰林
    labels:
      zh:
      - 登第入仕
      - 文墨自效
    start_date: '1454'
    highlight_event_id: guji-丘濬-event-jinshi
  - key: breakthrough
    name: 掌监国学司成教士
    labels:
      zh:
      - 掌教成均
      - 订正礼仪
    start_date: '1480'
    highlight_event_id: guji-丘濬-event-zhangjian
  - key: climax
    name: 晋尚书参预机务
    labels:
      zh:
      - 户部尚书
      - 文渊阁辅政
    start_date: '1494'
    highlight_event_id: guji-丘濬-event-ruge
  - key: closure
    name: 病卒京师谥文庄
    labels:
      zh:
      - 鞠躬尽瘁
      - 身后定论
    start_date: '1495'
    highlight_event_id: guji-丘濬-event-death
  decisions:
  - date: '1480'
    title_zh: 以旧典掌故条列政务
    rationale: 学本淹通又习知旧典，故原原本本贯串古今以资施行
  - date: '1494'
    title_zh: 受命入阁不辞晚暮
    rationale: 年近七旬惜余龄无几，欲以平生精力尽辅圣治，不敢以衰老自解
events:
- id: guji-丘濬-event-birth
  title_zh: 出生于琼山
  date: '1421'
  year_of: 1421
  place_zh: 广东琼山
  description: 明永乐十九年生于琼山孤寒之家，少颖敏留心扶世之学
- id: guji-丘濬-event-jinshi
  title_zh: 景泰五年登进士第
  date: '1454'
  year_of: 1454
  place_zh: 京师
  description: 登进士选庶吉士入翰林，自此六转官阶皆司文墨，莫试临民之技而徒怀忧国之心
- id: guji-丘濬-event-zhangjian
  title_zh: 掌国子监事进讲衍义
  date: '1480'
  year_of: 1480
  place_zh: 京师国子监
  description: 掌监事兼礼部侍郎，侍经筵以真氏衍义进讲，暇日采六经诸史成补编之缮写
- id: guji-丘濬-event-jincheng
  title_zh: 进大学衍义补一百六十卷
  date: '1487-11-18'
  year_of: 1487
  place_zh: 京师阙下
  description: 以所撰大学衍义补四十帙奉表以闻，分十二目以终治国平天下之要，诏嘉奖命录副本付书坊刊行
- id: guji-丘濬-event-ruge
  title_zh: 晋户部尚书入文渊阁
  date: '1494'
  year_of: 1494
  place_zh: 京师内阁
  description: 弘治七年晋户部尚书兼文渊阁大学士，参预机务，以海运规制刑宪诸议筹划国用边备
- id: guji-丘濬-event-death
  title_zh: 卒于京师
  date: '1495'
  year_of: 1495
  place_zh: 京师
  description: 弘治八年卒于官，赠谥文庄，所著衍义补后经弘治正德刊行，万历重梓御制序行于世
