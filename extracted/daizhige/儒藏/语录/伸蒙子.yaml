  - key: climax
    name: 分三才三辰二教叙天地君臣文武
    labels:
      zh: 体大思精
    start_date: 0865-01-01
    highlight_event_id: guji-伸蒙子-event-wenda
  - key: closure
    name: 以尧舜禹汤文武行事垂训后世
