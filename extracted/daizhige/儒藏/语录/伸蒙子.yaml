  dilemmas:
  - 沽名未售是干禄求仕还是退栖槐里著述明道
  - 儒范辞艰理僻不为时知是弃置还是研精覃思再述伸蒙子
  lesson: 王道兴衰不在天而在人退栖不废其志设问答以明教化
  summary_first_person: 吾长乐林慎思沽名未售退栖槐里旧著儒范七篇辞艰理僻不为时知复研精覃思斋沐祷心灵梦有所异召蓍得蒙之观遂自号伸蒙子与二三子辩论兴亡敷陈古今编成上中下三卷以周公仲尼之道尧舜禹汤文武之事垂训后世
