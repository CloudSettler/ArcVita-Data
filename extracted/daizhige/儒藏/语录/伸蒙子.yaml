  - date: 0864
    title_zh: 设六子问答引事明理
    rationale: 兴衰系乎君赏罚均于政徒陈古今难入人心故托干禄知道诸子往复辩难以润词显义
  - date: 0865-02-04
    title_zh: 分卷象三才垂后圣之鉴
    rationale: 所学周公仲尼之道所言尧舜文武行事若有用我则施行之无用则托空言以待后世知音
