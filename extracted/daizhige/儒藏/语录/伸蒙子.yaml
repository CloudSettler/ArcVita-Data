    title_zh: 退栖研精覃思著儒范
    rationale: 沽名未售不徇时态栖迟法度欲以周公仲尼之道施于后世故先著七篇试之
  - date: 0865-02-04
    title_zh: 因梦筮自号伸蒙子再述三卷
    rationale: 儒范辞艰理僻不为时知梦异筮得蒙观通明之象故感而述作敷陈古今近万言
