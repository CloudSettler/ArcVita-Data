  archetype: 谏诤守道型名臣
  dilemmas:
  - 立朝大节当直言犯颜而恐祸及身家何以处之
  - 师承温公不妄语之诚而处流俗变法之世何以守之
  - 崇儒辟异而佛老之说流行士大夫间何以辨之
  lesson: 以不妄语立诚，以慎重守道，以大节观人，不以细行掩大亏
  summary_first_person: 吾元城人，讳安世，字器之，学于司马温公，得不妄语之传，立朝以大节为重，虽谪岭表而绝嗜欲以保身，晚寄永城，授言于马永卿，冀后人知吾道之正
  source_urls:
