endeavors:
- id: guji-刘安世-endeavor-1
  title_zh: 元祐立朝绍圣南谪守道
  summary: 熙宁登第师事温公，元祐为谏官极言新法之害，绍圣谪岭表而绝欲守身，北归而不改其度
  phases:
  - key: brewing
    name: 登第师温公
    labels:
      zh:
      - 师承
      - 不妄语
    start_date: '1073'
    highlight_event_id: guji-刘安世-event-1
  - key: breakthrough
    name: 元祐为谏官
    labels:
      zh:
      - 立朝
      - 谏诤
    start_date: '1086'
    highlight_event_id: guji-刘安世-event-2
  - key: climax
    name: 绍圣谪岭表
    labels:
      zh:
      - 南谪
      - 绝欲
    start_date: '1094'
    highlight_event_id: guji-刘安世-event-3
  - key: closure
    name: 赦还守道不渝
    labels:
      zh:
      - 北归
      - 守正
    start_date: '1100'
    highlight_event_id: guji-刘安世-event-3
  decisions:
  - date: '1086'
    title_zh: 元祐极论金陵之失在开侥幸之路
    rationale: 不攻新法枝节而攻用人变法之本，谓广开邪路则纲纪大坏，欲使人主信而后从
  - date: '1094'
    title_zh: 到岭即绝嗜欲断酒色
    rationale: 奉父母遗体投炎荒，念温公烟瘴绝欲之戒，自誓不为则止，不用术而全生以守道
- id: guji-刘安世-endeavor-2
  title_zh: 永城授学传元城语录
  summary: 大观寄居永城回车院，马永卿为主簿而执弟子礼，往来问答一年有余，退而疏记而成语录
  phases:
  - key: brewing
    name: 寄居永城
    labels:
      zh:
      - 寄居
      - 永城
    start_date: '1107'
    highlight_event_id: guji-刘安世-event-4
  - key: breakthrough
    name: 永卿执经问学
    labels:
      zh:
      - 授学
      - 问答
    start_date: '1109'
    highlight_event_id: guji-刘安世-event-4
  - key: climax
    name: 论经史时事是非
    labels:
      zh:
      - 论学
      - 明辨
    start_date: '1109'
    highlight_event_id: guji-刘安世-event-4
  - key: closure
    name: 追录成书传后
    labels:
      zh:
      - 成书
      - 传道
    start_date: '1135'
    highlight_event_id: guji-刘安世-event-4
  decisions:
  - date: '1109'
    title_zh: 许永卿时时见过教以立身仕宦之道
    rationale: 喜其少年初仕肯来相从，教以法令保身经术明道，冀其无负所学
  - date: '1109'
    title_zh: 明辨三不足为万世祸而不绝其说
    rationale: 毒药不可绝而可明辨告人，使后人见而识之必不从，胜于禁绝而误食
events:
- id: guji-刘安世-event-birth
  title_zh: 元城出生
  date: '1048'
  year_of: 1048
  place_zh: 大名府元城
  description: 庆历八年生于元城刘氏，后以进士师事司马光，号元城先生
- id: guji-刘安世-event-1
  title_zh: 熙宁六年登第师事司马光
  date: '1073'
  year_of: 1073
  place_zh: 京师
  description: 登进士第不就选，从学于司马温公，得不妄语心法，辟为书局官
- id: guji-刘安世-event-2
  title_zh: 元祐为谏官论新法大害
  date: '1086'
  year_of: 1086
  place_zh: 开封
  description: 元祐初为秘书正字迁左正言兼侍讲，论金陵学乖僻开侥幸之路，立朝大节极可观
- id: guji-刘安世-event-3
  title_zh: 绍圣谪岭表绝欲守身
  date: '1094'
  year_of: 1094
  place_zh: 梅州新州岭表
  description: 绍圣初章惇当国谪新州别驾梅州安置，北望中原慨然绝嗜欲断酒色，遍历恶弱而独无恙
- id: guji-刘安世-event-4
  title_zh: 大观寄居永城授马永卿
  date: '1109'
  year_of: 1109
  place_zh: 亳州永城回车院
  description: 大观中寄居永城，马永卿为主簿三两日一造门，受学一年有余，退必疏记，后追录为元城语录三卷
- id: guji-刘安世-event-death
  title_zh: 宣和七年卒
  date: '1125'
  year_of: 1125
  place_zh: 南京
  description: 徽宗赦还寄居南京，风裁岳岳气节震动天下，卒而行事附语录以传
