  decisions:
  - date: '1760'
    title_zh: 主才质断性善
    rationale: 人得天地全能全德，心能通理义，不可以欲觉为私，当养大者寡欲
  - date: '1765'
    title_zh: 去私蔽立三达德
    rationale: 私生溺党慝，蔽生惑偏谬，以强恕解蔽，以忠信恕进仁义礼
