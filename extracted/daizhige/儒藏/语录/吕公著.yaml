  names:
    zh: 吕公著
    en: Lü Gongzhu (Lü Kung-chu)
  name_zh: 吕公著
  lifespan:
    birth:
      date: '1018'
      precision: year
      is_circa: true
      raw: 生年 Typically 端拱元年（1018）
    death:
      date: '1089'
      precision: year
      is_circa: false
      raw: 元祐三年卒（1089）
  birth_date: '1018'
  death_date: '1089'
  era: 北宋
  reign_ref: 仁宗、英宗、神宗、哲宗（元祐）
  archetype: 荐贤清简的师表宰相、家法治教之表率
  dilemmas:
  - 荐贤竟至差改节（荐常秩后悔），如何持衡眼光与好贤之心
  - 严于教子与自身清静简约之间，不以私恩废礼法
  lesson: 好贤之心不可少替；立身之本在诚实，观人观其德不观其私
  summary_first_person: 我吕公著以荐贤立世，举程颢、程颐、胡瑗诸人于朝，盘桓元祐政事之间；家法严而有度，教子示范则以诚实与长幼之序为根。所谓「立身从政务切于实用」，皆我在座右与儿孙间日日践履之旨。
  source_urls:
  - https://www.sikuquanshu.com/zi-01-1-tongmengxun/
