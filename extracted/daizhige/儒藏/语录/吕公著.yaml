  decisions:
  - date: ~1050
    title_zh: 延欧阳文忠之门人焦千之为子师
    rationale: 见师道严肃而欲以规矩教子，从师得正
  - date: ~1070
    title_zh: 家中待诸子以严法
    rationale: 中人以下，内无贤父兄外无严师友则难有成就，故以内严致其成
