  - 直言救世易忤旨获祸，缄默保身又负所学，当何从
  - 讲学崇实黜虚易见讥粗浅，谈玄说妙易流空疏，当何守
  lesson: 不侈精微而笃实行，不慕高远而力践履，存心主静而应务以公
