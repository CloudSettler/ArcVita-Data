  decisions:
  - date: 1592
    title_zh: 刊布呻吟语以救空谈
    rationale: 世索隐行怪而务高远，故言纲常事物，于人事上存天理，激浊立懦
  - date: 1616
    title_zh: 自删四卷为二卷定本
    rationale: 去浮存实，取知畏所续若干条，存十之二三，务求规矩切于践履
