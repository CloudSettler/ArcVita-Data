    title_zh: 授襄垣知县躬访疾苦
    rationale: 为政当自亲民始，不入州县不知民艰，故取与慎一介而兼怀万汇
  - date: 1591
    title_zh: 巡抚山西力行实政
    rationale: 宗法废而政散，民散而教格，须以次责成，以实惠固结人心
