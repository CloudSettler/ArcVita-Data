  summary_first_person: 我吕希哲，字原明，人称荥阳公，吕公著（正献公）之子。幼承严教，二十一岁入太学，率先以师礼事程颐，广交二程、二张诸贤，一生笃行不欺、处事有恒，为洛学传承与士大夫家法树立典范。
