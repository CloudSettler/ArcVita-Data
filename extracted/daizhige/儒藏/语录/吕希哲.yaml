  year_of: 1060
  type: career_event
  title_zh: 二十一岁入太学，师事程颐
  summary_zh: 荥阳公年二十一（一作十九）入太学，与伊川邻斋，察其议论大异，首以师礼事之，后学者遂众，实自荥阳公发之。
- id: guji-吕希哲-event-jingyan
  date: '1086'
  year_of: 1086
  type: career_event
  title_zh: 元祐中在经筵
  summary_zh: 元祐中荣阳公在经筵，姚勔当制词称其'道学至于无心，立行至于无愧'，时人谓之实录。
- id: guji-吕希哲-event-zheju
  date: '1100'
  year_of: 1100
  type: life_event
  title_zh: 自和州谪居起知单州，过山阳访徐积
  summary_zh: 元符三年道过山阳，出市桥桥坏堕水不伤，年几七十的徐积作《我敬》诗赠之。
