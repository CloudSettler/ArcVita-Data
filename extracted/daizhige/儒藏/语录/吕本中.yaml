  name_zh: 吕本中
  names:
    zh: 吕本中
    en: Lü Benzhong
  lifespan:
    birth:
      date: '1084'
      precision: year
      is_circa: true
      raw: 约北宋元丰七年
    death:
      date: '1145'
      precision: year
