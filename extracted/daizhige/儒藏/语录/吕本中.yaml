  type: endeavor
  endeavor_id: guji-吕本中-endeavor-1
  source_text: 嘉定乙亥婺州守邱寿隽重校刊之，有楼昉所为跋；后绍定己丑睂山李守郡，得本于提刑吕祖烈，复锓木于玉山堂
- id: guji-吕本中-event-4
  person_id: guji-吕本中
  title_zh: 朱子称其论诗文必以苏黄为法，《春秋集解》并著录于世
  date: '1160'
  year_of: '1160'
  location: 南宋
  type: endeavor
  endeavor_id: guji-吕本中-endeavor-2
  source_text: 朱子答吕祖谦书有舍人所著童训极论诗文必以苏黄为法之语；本中有春秋集解，已著录
