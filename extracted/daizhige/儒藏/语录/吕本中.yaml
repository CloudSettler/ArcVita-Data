    start_date: '1126'
    highlight_event_id: guji-吕本中-event-2
  - key: closure
    name_zh: 《童蒙训》历代刊校流传
    labels:
      zh: 刊刻流传
    start_date: '1215'
    highlight_event_id: guji-吕本中-event-3
  decisions:
  - date: '1126'
    title_zh: 依家塾训课之例纂记元祐遗老正论格言
    rationale: 北宋故家及见元祐遗老，师友传授具有渊源，故所记多正论格言，根本经训、务切实用
  - date: '1215'
    title_zh: 授梓刊行，重词华者传内编，重行谊者传外编
    rationale: 传其书者轻词华而重行谊，但刻其半
- id: guji-吕本中-endeavor-2
  name_zh: 诗学传承与《春秋集解》撰述
  phases:
  - key: brewing
    name_zh: 承江西诗派论诗之学
    labels:
      zh: 诗学
    start_date: '1100'
    highlight_event_id: guji-吕本中-event-2
  - key: climax
    name_zh: 著《春秋集解》并世立诗法
    labels:
      zh: 著述
    start_date: '1130'
    highlight_event_id: guji-吕本中-event-4
  decisions:
  - date: '1130'
    title_zh: 治经与论诗并行，以经书为本、以苏黄为诗法
    rationale: 舍人所著童训极论诗文必以苏黄为法，另有《春秋集解》已著录
