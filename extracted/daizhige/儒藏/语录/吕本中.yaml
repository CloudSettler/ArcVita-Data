  date: '1126'
  year_of: '1126'
  location: 家塾
  type: endeavor
  endeavor_id: guji-吕本中-endeavor-1
  source_text: 是书其家塾训课之本也，所记多正论格言，大抵皆根本经训，务切实用
- id: guji-吕本中-event-3
