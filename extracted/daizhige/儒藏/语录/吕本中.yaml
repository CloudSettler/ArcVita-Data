      raw: 约南宋绍兴年间卒
  birth_date: '1084'
  death_date: '1145'
  era: 两宋之际
  reign_ref: 北宋末至南宋绍兴年间
  archetype: 学者型官员与诗论家
  dilemmas:
  - 家传学问与科举仕进之间的取舍
  - 诗文词华与立身行谊孰重的家训取舍（传者刻其半，遗其论诗之编）
  lesson: 学问当以经书为本，务切实用，立身行己先于词华
  summary_first_person: 我吕本中出身北宋故家，及见元祐遗老，师友传授具有渊源。我著有《童蒙训》以为家塾训课之本，所记多正论格言，皆根本经训、务切实用；另有《春秋集解》行世。我论诗以苏黄为法，传江西诗派之学，论文章学问每以行谊为先。
  source_urls:
  - source_original
endeavors:
- id: guji-吕本中-endeavor-1
  name_zh: 撰《童蒙训》
  phases:
  - key: brewing
    name_zh: 蒙元祐家学熏陶
    labels:
      zh: 家学渊源
    start_date: '1084'
    highlight_event_id: guji-吕本中-event-1
  - key: breakthrough
    name_zh: 撰成家塾训课之本
    labels:
