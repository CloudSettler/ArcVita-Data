  - 出仕显贵与退守讲学何以两全
  lesson: 格物穷理必切于身心语默作止，践履笃实，终身以程朱为归
  summary_first_person: 我是吕柟，字仲木，号泾野，陕西高陵人，正德戊辰进士第一，授翰林修撰，历官至南京礼部右侍郎，我师事薛敬之，远接薛瑄之传，在南都与湛若水邹守益同主讲席，一生以格物穷理为学，斥良知之偏，守程朱不变，门人辑我语录为泾野子内篇二十七卷
