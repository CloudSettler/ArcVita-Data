  lesson: 敬以直内义以方外，由下学而上达，削驳留醇以便初学
  summary_first_person: 吾十七八时梦明道于泾野草堂之上，既举得全书于崔子钟氏，每讽诵不释手，病其浩大繁博初学难观，故抄心所好者为八卷二十九篇稍释其下，又抄诗文为外卷，潜江初公命刻于解梁书院，愿始学因是求二夫子之志以遡孔孟之道
