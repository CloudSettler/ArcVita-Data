person:
  qid: guji-吴如愚
  name_zh: 吴如愚
  names:
    zh: 吴如愚
    en: Wu Ruyu
  lifespan:
    birth:
      date: 1190
      precision: year
      is_circa: true
      raw: 约南宋庆元前后生于钱塘
    death:
      date: 1245
      precision: year
      is_circa: true
      raw: 嘉熙以后卒
  birth_date: 1190
  death_date: 1245
  era: 南宋
  reign_ref: 宋理宗嘉熙
  archetype: 理学儒者
  dilemmas:
  - 早年留心清净之教凡三四年，既而幡然尽弃所学，刻意讲道，于禅悦与圣学之间抉择
  - 少以父任得官，历试监税州县，终以解职归养、荐授三辞而与祠，于出处进退之间持守
  - 穷理与格物分合之辨，于先穷其理与物交物而不为所引之间求体用兼备
  lesson: 塞乎天地者皆实理，行乎万世者皆实用，尽心知性则实理融而实用贯，格物以正，不坠虚无
  summary_first_person: 我是吴如愚，字子发，钱塘人，少以父任补承信郎，监福州连江商税，再调常熟，解职而归，嘉熙二年丞相乔行简荐我换授承信郎差充秘阁校勘，我三疏辞免，特转秉义郎与祠而终，我早年稍涉清净禅悦，三四年而幡然弃去，刻意讲道，以格物为正物不为物引，著易诗书说大学中庸论孟及准斋杂说，愿后人以体用兼备为功
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E5%87%86%E6%96%8B%E6%9D%82%E8%AF%B4.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E5%87%86%E6%96%8B%E6%9D%82%E8%AF%B4.html
