    highlight_event_id: guji-周敦颐-event-nanan
  - key: breakthrough
    name: 虔州定图授受程门
    labels:
      zh:
      - 手授太极图
      - 开启洛学
    start_date: 1060
    highlight_event_id: guji-周敦颐-event-taichi
  - key: climax
    name: 濂溪著说立人极
    labels:
      zh:
      - 无极而太极
      - 主静立人极
    start_date: 1068
    highlight_event_id: guji-周敦颐-event-taichi
  - key: closure
    name: 作通书易通垂教后学
    labels:
      zh:
