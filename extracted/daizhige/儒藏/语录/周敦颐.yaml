  reign_ref: 宋仁宗天圣至宋神宗熙宁
  archetype: 主静立极的理学宗师
  dilemmas:
  - title_zh: 动静相胜何以定天下之动
    description: 众人得秀最灵而常失于动，欲动情胜则人极不立，须以主静定之而后动静周流
  - title_zh: 出处显隐何以全身极之道
    description: 历州县理刑政而志在道统，既欲以中正仁义济世，又欲退守庐山以全太极之静
  lesson: 以无欲故静为体，以中正仁义为用，动必主静方能立人极
  summary_first_person: 吾濂溪周敦颐，悟无极而太极之妙，见动静阴阳五行之序，惟人得秀最灵而易流于欲，故定之以中正仁义而主静，愿立人极以合天地日月四时鬼神
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/儒藏/语录/太极图说.md
  - https://daizhige.org/儒藏/语录/太极图说.html
