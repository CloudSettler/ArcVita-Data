      - 垂范后世
    start_date: 1072
    highlight_event_id: guji-周敦颐-event-guangnan
  decisions:
  - date: 1060
    title_zh: 手图以授程颢程颐而不广示
    rationale: 道体浑然粲然，非虚心潜玩不能得，故择人而传以全微意
  - date: 1068
    title_zh: 定之以中正仁义而主静
    rationale: 惟静为诚之复性之真，无欲故静方能酬酢万变而一天下之动
- id: guji-周敦颐-endeavor-2
  title_zh: 历仕州县以仁义行平恕之政
  summary: 历分宁南安郴虔诸任，断狱明恕，政简刑清，以圣学施于吏治
  phases:
  - key: brewing
    name: 初仕将作安仁试政
    labels:
