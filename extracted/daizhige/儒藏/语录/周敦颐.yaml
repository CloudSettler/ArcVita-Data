      - 不惮权贵
    start_date: 1046
    highlight_event_id: guji-周敦颐-event-nanan
  - key: climax
    name: 知郴爱莲通判虔州
    labels:
      zh:
      - 出淤不染
      - 政通人和
    start_date: 1068
    highlight_event_id: guji-周敦颐-event-taichi
  - key: closure
    name: 提刑广南乞分司归庐
    labels:
      zh:
      - 活人无数
      - 退藏于静
    start_date: 1071
    highlight_event_id: guji-周敦颐-event-guangnan
  decisions:
  - date: 1046
    title_zh: 南安力争不决之狱
    rationale: 人命至重，虽忤上官亦必洗其冤，以全仁义之用
  - date: 1072
    title_zh: 乞分司南京归庐山养疾
    rationale: 年高多病不堪剧任，当退而保静以终太极之学，不恋禄位
events:
- id: guji-周敦颐-event-birth
  date: 1017
  year_of: 1017
  title_zh: 生于道州营道
  description: 宋真宗天禧元年生于营道，字茂叔，号濂溪，少孤养于母舅龙图阁学士郑向家
  place_zh: 道州营道
- id: guji-周敦颐-event-nanan
  date: 1046
  year_of: 1046
  title_zh: 任南安军司理参军
  description: 断狱平恕，洗冤禁，程颢程颐从游，始以太极图授之，理学一脉由此开
  place_zh: 南安军
- id: guji-周敦颐-event-taichi
  date: 1068
  year_of: 1068
  title_zh: 知郴州作太极图说爱莲说
  description: 于濂溪书堂定无极而太极动静阴阳五行男女万物人极圣功之序，明主静立人极之义
  place_zh: 郴州濂溪
- id: guji-周敦颐-event-guangnan
  date: 1071
  year_of: 1071
  title_zh: 提点广南东路刑狱活冤狱
  description: 按部所至洗冤泽物，不惮劳苦，岁余求分司南京以归，定居庐山莲花峰下
  place_zh: 广南东路
- id: guji-周敦颐-event-death
  date: 1073
  year_of: 1073
  title_zh: 卒于庐山葬莲花峰下
  description: 宋神宗熙宁六年六月病卒于庐山，年五十七，后谥元公，从祀孔庙，为宋代理学开山之祖
  place_zh: 庐山莲花峰
