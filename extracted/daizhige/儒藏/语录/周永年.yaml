  - key: climax
    name: 以诀示人劝专一有恒
    labels:
      zh: 示人劝学
    start_date: 1798
    highlight_event_id: guji-周永年-event-dushujue
  - key: closure
    name: 诀行于世以正学风
    labels:
      zh: 正学传远
    start_date: 1805
    highlight_event_id: guji-周永年-event-death
  decisions:
  - date: 1795
    title_zh: 以恒艮为纲辑录先正格言
    rationale: 学者多患进锐退速振动无功，故以恒艮静定为先以端其本
  - date: 1798
    title_zh: 详录朱子专精反复之法
    rationale: 贪多务广则终身无得，唯逐段精思熟读方能浃洽，故备录朱子训以救时弊
events:
- id: guji-周永年-event-birth
  title_zh: 生于浙江余姚
  date: 1730
  year_of: 1730
  description: 雍正八年左右生于余姚，少力学，留心经史收藏
  place_zh: 浙江余姚
- id: guji-周永年-event-jieshuyuan
  title_zh: 营建借书园许人借观
  date: 1771
  year_of: 1771
  description: 于京师及乡里聚书数万卷，建借书园，定借阅章程，士人得借钞传习，一时传为美谈
  place_zh: 北京及余姚
- id: guji-周永年-event-dushujue
  title_zh: 辑成先正读书诀
  date: 1798
  year_of: 1798
  description: 采周易恒艮大学知止朱子精思专一等先正格言，分条辑录，以戒欲速贪多，劝专精有恒，编成先正读书诀
  place_zh: 北京
- id: guji-周永年-event-rucang
  title_zh: 倡议编纂儒藏汇集经史
  date: 1785
  year_of: 1785
  description: 上书倡议汇刻儒家经史群书为儒藏，以存文献便观览，其说后多为藏书家所宗
  place_zh: 北京
- id: guji-周永年-event-death
  title_zh: 卒于嘉庆年间
  date: 1811
  year_of: 1811
  description: 嘉庆十六年左右卒，生平藏书传人，读书诀行于世，学者奉为专恒之训
  place_zh: 浙江余姚
