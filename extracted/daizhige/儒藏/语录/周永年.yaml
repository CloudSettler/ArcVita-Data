  decisions:
  - date: 1771
    title_zh: 立借书园许人借钞
    rationale: 独藏无益于世，公借方能成人成己，故立章程而广流通
  - date: 1785
    title_zh: 议辑儒藏以存经史
    rationale: 零散藏书易散佚，汇为儒藏则纲举目张，可久可传
- id: guji-周永年-endeavor-2
  title_zh: 辑先正读书诀明为学之法
  summary: 采周易大学论孟荀子及朱张苏黄诸家论学之语，辑为读书诀以戒欲速贪多，示专精静恒之要
  phases:
  - key: brewing
    name: 泛览先正语录病贪多务广
