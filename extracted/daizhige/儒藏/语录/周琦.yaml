  summary_first_person: 吾周琦字廷玺马平人也学出河东薛瑄之门成化辛丑进士官至南京户部员外郎居乡居官垂五十年非儒不接非道不谈体认天地万物之性以会经传之旨分十三类录为日谈录十八卷以明性道理气祭祀学术出处之正
