endeavors:
- id: guji-子思-endeavor-1
  title_zh: 述圣阐道著中庸明诚
  summary: 承曾子仲尼之教，论天命性道，发明中和诚明，成内篇三篇以传后世
  phases:
  - key: brewing
    name: 受业传圣学
    labels:
