    start_date: '-0430'
    highlight_event_id: guji-子思-event-zhongyong
  - key: climax
    name: 成书示来学
    labels:
      zh: 著书立言
    start_date: '-0420'
    highlight_event_id: guji-子思-event-zhongyong
  - key: closure
    name: 以道托后贤
    labels:
      zh: 传道授徒
    start_date: '-0410'
    highlight_event_id: guji-子思-event-teach
  decisions:
  - date: '-0430'
    title_zh: 以天命性道立教
    rationale: 性出于天，道不可离，故戒慎独以致中和，使上下察而万物育
  - date: '-0420'
    title_zh: 以至诚经纶为归
    rationale: 唯至诚能尽性赞化育与天地参，故明自诚明自明诚之分以开问学
- id: guji-子思-endeavor-2
  title_zh: 居卫适鲁守道不屈
  summary: 居卫受困不受非义之赠，适鲁论政荐贤而不夺节，辞车马拒钓饵以全道
  phases:
  - key: brewing
