  - key: breakthrough
    name: 辞裘却赠明义
    labels:
      zh: 辞受取义
    start_date: '-0435'
    highlight_event_id: guji-子思-event-wei
  - key: climax
    name: 鲁廷论贤拒饵
    labels:
      zh: 鲁穆公问政
    start_date: '-0425'
    highlight_event_id: guji-子思-event-lu
  - key: closure
    name: 守大不改全节
    labels:
      zh: 守道不移
    start_date: '-0410'
    highlight_event_id: guji-子思-event-lu
  decisions:
  - date: '-0435'
    title_zh: 辞白狐裘与车马
    rationale: 妄与如弃物沟壑，受粟为周乏而酒脯为宴乐，度义而行不以身为沟壑
  - date: '-0425'
    title_zh: 拒为穆公钓公仪休
    rationale: 以高官厚禄钓饵君子无信用之意，毁道求容则无行，故不任操竿下钓
events:
- id: guji-子思-event-birth
  date: -0483
  year_of: -483
  title_zh: 孔伋生于鲁
  description: 仲尼之孙，伯鱼之子，生而承圣绪，少受业于曾子
- id: guji-子思-event-zhongyong
  date: '-0430'
  year_of: -430
  title_zh: 论天命作中庸之义
  description: 言天命谓性率性谓道，发明中和费隐诚明，及九经达道达德之说以传仲尼之教
- id: guji-子思-event-teach
  date: '-0415'
  year_of: -415
  title_zh: 授徒论学传圣道
  description: 教子上必始诗书终礼乐，论学益才如砥致刃，辨浸水膏雨以明上德不德
- id: guji-子思-event-wei
  date: '-0435'
  year_of: -435
  title_zh: 居卫辞赠守义
  description: 缊袍九食不受田子方白狐裘，不当卫公子交车马之贶，辞酒脯而受粟以周乏
- id: guji-子思-event-lu
  date: '-0425'
  year_of: -425
  title_zh: 适鲁对穆公论政荐贤
  description: 与穆公论旧君反服及友士之义，荐公仪休而拒以爵禄相钓，不邀邑召叛臣
- id: guji-子思-event-death
  date: '-0402'
  year_of: -402
  title_zh: 子思卒
  description: 守道终身，丧服之礼自其家始定，其学由门人传于孟子一系
