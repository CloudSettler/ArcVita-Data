    title_zh: 不歎魯而歎道不行
    rationale: 明吾道一以貫歎道不行非為魯一國之失立大義以正人心
  - date: -499
    title_zh: 對子游極言禮本於天
    rationale: 痛掃疑禮無與天地之惑明禮即道之見於品節使人因禮復性
