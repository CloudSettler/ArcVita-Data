  decisions:
  - date: -497
    title_zh: 之杞之宋求徵而不泥於徵
    rationale: 文獻不足徵則以義通之以夏時坤乾觀等倫一貫之妙
  - date: -496
    title_zh: 尊玄酒薄厚味存古初之敬
    rationale: 不忘古始以止逐味去道之失使養生送死皆從其朔復本心之敬
events:
- id: guji-孔子-event-birth
  title_zh: 誕生於魯
  date: -551-09-28
  year_of: -551
  place_zh: 魯國陬邑
  summary_zh: 襄公二十二年生後為先聖述禮明道之本
- id: guji-孔子-event-sikou
  title_zh: 為魯司寇與蠟賓喟然歎大道
  date: -500
  year_of: -500
  place_zh: 魯國
  summary_zh: 為魯司寇與於蠟賓事畢出游於觀之上喟然而歎言大道之行天下為公今大道既隱天下為家明大同小康之辨
- id: guji-孔子-event-kaoli
  title_zh: 之杞之宋觀夏殷之道
  date: -497
  year_of: -497
  place_zh: 杞宋
  summary_zh: 欲觀夏道之杞而不足徵得夏時欲觀殷道之宋而不足徵得坤乾以是觀禮之等倫義無不通
- id: guji-孔子-event-lunli
  title_zh: 與子游論禮本於天地鬼神
  date: -496
  year_of: -496
  place_zh: 魯國
  summary_zh: 答子游極言禮必本於天殽於地列於鬼神達於喪祭射御冠婚朝聘明天地人一貫又言人者天地之心五行之端
- id: guji-孔子-event-death
  title_zh: 卒於魯
  date: -479-04-11
  year_of: -479
  place_zh: 魯國
  summary_zh: 哀公十六年卒後弟子傳其言楊簡等輯為先聖大訓以傳道統
