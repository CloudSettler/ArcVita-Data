endeavors:
- id: guji-孔子-endeavor-1
  title_zh: 私学授徒劝学立教
  summary: 设教于鲁，以诗书礼乐诲弟子，好学不厌，诲人不倦，开平民为学之先
  phases:
  - key: brewing
    name: 少好学发愤忘食
    labels:
      zh:
      - 劝学
      - 修身
    start_date: -536-01-01
    highlight_event_id: guji-孔子-event-teach
  - key: breakthrough
    name: 开私学有教无类
    labels:
      zh:
      - 授徒
      - 诲人
    start_date: -521-01-01
    highlight_event_id: guji-孔子-event-teach
  - key: climax
    name: 教成七十贤者并兴
    labels:
      zh:
      - 育才
      - 传道
    start_date: -501-01-01
    highlight_event_id: guji-孔子-event-teach
  - key: closure
    name: 晚年删述以教来者
    labels:
      zh:
