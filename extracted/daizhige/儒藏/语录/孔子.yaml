      - 论政
    start_date: -497-01-01
    highlight_event_id: guji-孔子-event-travel
  - key: climax
    name: 明争臣之义辨孝贞
    labels:
      zh:
      - 谏争
      - 臣术
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-compile
  - key: closure
    name: 归鲁系麟书以诏后
    labels:
      zh:
      - 传道
      - 守道
    start_date: -479-01-01
    highlight_event_id: guji-孔子-event-compile
  decisions:
  - date: -497-01-01
    title_zh: 周游列国不息于行
    rationale: 知生无所息，阖棺乃止，故虽不用，仍以仁义说诸侯，冀天下有行道之机
  - date: -484-01-01
    title_zh: 辨父子君臣从义不从命
    rationale: 子从父奚子孝，臣从君奚臣贞，审其所以从之谓孝贞，故立争子争臣之教以全宗庙社稷
events:
- id: guji-孔子-event-birth
  type: birth
  title_zh: 诞生于鲁国陬邑
  date: -551-09-28
  year_of: -551
  description: 春秋鲁襄公二十二年生于鲁，少而好学，晚而闻道，以博学闻于天下
- id: guji-孔子-event-teach
  type: career
  title_zh: 设私学教七十子
  date: -521-01-01
  year_of: -521
  description: 修成康之道，述周公之训，使服衣冠修篇籍，劝弟子终身为学，好学不厌，好教不倦
- id: guji-孔子-event-travel
  type: career
  title_zh: 周游列国论孝论政
  date: -497-01-01
  year_of: -497
  description: 历说列国，论孝本五性六艺主德臣术交道论人论政之旨，门人归养亲者甚众，儒风大导
- id: guji-孔子-event-compile
  type: career
  title_zh: 晚年删述修六经以诏来者
  date: -484-01-01
  year_of: -484
  description: 归鲁之后，综诗书礼乐，修春秋，微言大义藉子史传注以存，集语流传羽仪经业
- id: guji-孔子-event-death
  type: death
  title_zh: 卒于鲁国
  date: -479-04-11
  year_of: -479
  description: 鲁哀公十六年卒，弟子如丧亲，望其圹皋如填如鬲如而知所息，君子息焉，儒者之学遂生焉
