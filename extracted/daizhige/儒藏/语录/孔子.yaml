  archetype: 立教垂訓之聖人
  dilemmas:
  - 大道既隱天下為家禮崩樂壞當以何道救世
  - 禮文品節繁雜眾人執迹昧本如何顯明禮即道一以貫之
  - 魯郊禘僭禮君臣失序直言則犯時忌隱默則道益晦
  lesson: 道一以貫禮本於天循禮即可復性天下為公始於正心
  summary_first_person: 吾生於禮壞之世為魯司寇與於蠟賓喟然歎大道之不行述大同小康之義考夏殷之禮源以明禮本於天道一而已欲使天下後世由禮以復道也
