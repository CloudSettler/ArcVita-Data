      - 遗教
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-compile
  decisions:
  - date: -521-01-01
    title_zh: 设私学收徒讲学
    rationale: 以学可以开四方昭诸侯，不论族姓出身，唯以好学立身，遂开万世师表之业
  - date: -501-01-01
    title_zh: 以学行并重取弟子
    rationale: 远有光者饰也，近逾明者学也，故重假物博见，劝子路诸生受学重问以顺成其德
- id: guji-孔子-endeavor-2
  title_zh: 明孝悌仁政周游传道
  summary: 述孝本论政，事亲以全归，事君以争臣，周游列国以求仁政之行
  phases:
  - key: brewing
    name: 论孝本立身之始
    labels:
      zh:
      - 孝本
      - 立身
    start_date: -518-01-01
    highlight_event_id: guji-孔子-event-travel
  - key: breakthrough
