  - 出仕济世与退隐全节的抉择
  lesson: 士可仕则尽忠直言，不可仕则守道退隐
  summary_first_person: 我是孔斌，字子顺，孔子六世孙。魏安釐王时我入魏为相，欲以尧舜之道匡正魏政，然王不得贤臣辅我，我谏多不用，遂称疾致仕。秦将攻魏时，我应该王之问直言秦虎狼不可与盟；魏亡后，我退居守志，不肯仕秦，与陈涉之世诸事相始终。
  source_urls:
  - https://ctext.org/kongcongzi/zh
