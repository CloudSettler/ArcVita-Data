      - 仗义疏救
      - 捐助诏狱
    start_date: '1625'
    highlight_event_id: guji-孙奇逢-event-rescue-donglin
  - key: climax
    name: 率里坚守容城御寇
    labels:
      zh:
      - 守城御贼
      - 修武备讲性命
    start_date: '1636'
    highlight_event_id: guji-孙奇逢-event-defend-rongcheng
  - key: closure
    name: 移家五公山自全
    labels:
      zh:
      - 避地讲学
      - 全节不仕
    start_date: '1644'
    highlight_event_id: guji-孙奇逢-event-baiquan-jiangxue
  decisions:
  - date: '1625'
    title_zh: 遣弟彦逢上书高阳请救左魏诸君
    rationale: 以善类之宗不可不救，虽知时不可为亦尽心力而无愧。
  - date: '1636'
    title_zh: 率里人坚守容城不去
    rationale: 身为乡人表率，守土安民即是尽分，危难不可独避。
  - date: '1644'
    title_zh: 移家易州五公山不仕新朝
    rationale: 国变之后守身全节，以讲学耕读存斯文于草野。
- id: guji-孙奇逢-endeavor-2
  title_zh: 苏门讲学与理学宗传
  summary: 躬耕苏门百泉筑兼山堂读易讲学，汤斌为门下第一人，著理学宗传以周程张邵朱陆等为正宗泯除门户。
  phases:
  - key: brewing
    name: 五公定约默识心性
    labels:
      zh:
      - 忧患默识
      - 喜怒哀乐合礼
    start_date: '1644'
    highlight_event_id: guji-孙奇逢-event-baiquan-jiangxue
  - key: breakthrough
    name: 躬耕百泉四方负笈
    labels:
      zh:
      - 筑兼山堂
      - 汤斌从学
    start_date: '1652'
    highlight_event_id: guji-孙奇逢-event-baiquan-jiangxue
  - key: climax
    name: 著理学宗传定正宗
    labels:
      zh:
      - 会通朱陆
      - 平实切理
    start_date: '1660'
    highlight_event_id: guji-孙奇逢-event-baiquan-jiangxue
  - key: closure
    name: 固辞征辟以寿终
    labels:
      zh:
      - 巡按交荐不就
      - 北学宗主
    start_date: '1676'
    highlight_event_id: guji-孙奇逢-event-death
  decisions:
  - date: '1652'
    title_zh: 固辞巡按敦促出仕躬耕百泉
    rationale: 时不可为而道可传，守静讲学以淑后进胜于屈节荣身。
  - date: '1660'
    title_zh: 著理学宗传不分门别户
    rationale: 病世人辩朱陆异同徒腾口说，故以躬行绳墨定宗以泯门户之见。
events:
- id: guji-孙奇逢-event-birth
  title_zh: 生于容城
  date: '1585'
  year_of: 1585
  description: 直隶容城人，字启泰号锺元，年十七中万历庚子举人。
- id: guji-孙奇逢-event-rescue-donglin
  title_zh: 遣弟上书营救东林三君并经纪丧葬
  date: '1625'
  year_of: 1625
  description: 天启阉祸，左光斗魏大中周顺昌被逮，遣弟彦逢上书孙承宗请救，又与鹿善继父倡义捐助缴纳诬赃，经纪三君丧归葬故里。
- id: guji-孙奇逢-event-defend-rongcheng
  title_zh: 率里坚守容城得旨褒美
  date: '1636'
  year_of: 1636
  description: 崇祯丙子容城被围，率里人坚守，巡抚上其事得旨褒美，后贼氛迫近移家五公山定条约修武备暇则讲论身心性命。
- id: guji-孙奇逢-event-baiquan-jiangxue
  title_zh: 躬耕苏门百泉讲学著理学宗传
  date: '1652'
  year_of: 1652
  description: 顺治中固辞征辟，率子弟躬耕苏门百泉筑兼山堂读易，四方负笈日众，汤斌成进士后始从学为门下第一人，著理学宗传以周程张邵朱陆薛王罗顾十一子为正宗。
- id: guji-孙奇逢-event-death
  title_zh: 卒于百泉
  date: '1676'
  year_of: 1676
  description: 康熙十五年卒，年九十二，为北方百泉二曲之宗，学者称为容城先生。
