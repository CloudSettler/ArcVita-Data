endeavors:
- id: guji-孙奇逢-endeavor-1
  title_zh: 乱世全节与乡里守护
  summary: 天启救助东林三君，崇祯守卫容城，甲申后移家五公山定约讲学，以忠义气节全乡里。
  phases:
  - key: brewing
    name: 圣贤相期居丧尽礼
