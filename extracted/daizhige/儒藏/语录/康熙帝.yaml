  title_zh: 勤学格物以明治道
  summary_zh: 幼年亲师诵习五经四书性理，融会贯通天地万物之理，宣为至教，饮食起居咸成矩度
  phases:
  - key: brewing
    name: 幼年登极黾勉学问
    start_date: 1661-02-05
    highlight_event_id: guji-康熙帝-event-study
    labels:
      zh: 蒙养勤学
  - key: breakthrough
    name: 十七八岁笃学贯通经史
    start_date: 1670-01-01
    highlight_event_id: guji-康熙帝-event-study
    labels:
      zh: 格致明理
  - key: climax
    name: 以经术敷政任人敷治
    start_date: 1684-01-01
    highlight_event_id: guji-康熙帝-event-tingxun
    labels:
      zh: 经世致用
  - key: closure
    name: 庭训垂范启迪后嗣
    start_date: 1710-01-01
    highlight_event_id: guji-康熙帝-event-tingxun
    labels:
      zh: 垂宪后世
  decisions:
  - date: 1670-01-01
    title_zh: 五更诵读讲论不辍
    rationale: 圣由天纵益以多能，一字未明必寻绎务明，日新盛德，不虚度时日
  - date: 1684-01-01
    title_zh: 训子熟习五经四书性理
    rationale: 养生存心养性立命之道无所不具，不胜习诸杂学，以明理为要
- id: guji-康熙帝-endeavor-2
  title_zh: 勘定三藩仁政守成
  summary_zh: 主迁藩议而当三逆之叛，坚心筹画示暇景山，不委过于人，剿灭三孽察哈尔，推种痘节俭恤民而致承平
  phases:
  - key: brewing
    name: 廷议迁藩定策
    start_date: 1673-04-01
    highlight_event_id: guji-康熙帝-event-sanfan
    labels:
      zh: 审虑决断
  - key: breakthrough
    name: 三逆叛乱坚心筹军务
    start_date: 1674-01-01
    highlight_event_id: guji-康熙帝-event-sanfan
    labels:
      zh: 持重安众
  - key: climax
    name: 永兴被困忧形而纳谏克复
    start_date: 1678-01-01
    highlight_event_id: guji-康熙帝-event-sanfan
    labels:
      zh: 不卸过服众
  - key: closure
    name: 承平勤政种痘恤民生息
    start_date: 1681-06-01
    highlight_event_id: guji-康熙帝-event-zhongdou
    labels:
      zh: 仁育守成
  decisions:
  - date: 1673-04-01
    title_zh: 主迁藩而不归过于廷臣
    rationale: 迁亦叛不迁亦叛，事至危而不委罪于人，自任其过以服人心
  - date: 1678-06-01
    title_zh: 景山骑射示暇不疑谤帖
    rationale: 居安思危而临危不惧，若稍有疑惧则人心摇动，置谤而不闻
  - date: 1681-06-01
    title_zh: 坚意推行种痘全活众生
    rationale: 国初畏出痘，独得种痘方，虽年老人以为怪，坚意为之以全千万人之生
events:
- id: guji-康熙帝-event-birth
  title_zh: 出生
  date: 1654-05-04
  year_of: 1654
  description_zh: 顺治十一年三月十八日生于景仁宫，性秉生安，天纵多能
- id: guji-康熙帝-event-study
  title_zh: 幼年勤学诵读习书
  date: 1661-02-05
  year_of: 1661
  description_zh: 八岁登极即黾勉学问，师事张林诸人以经书为要，五更诵读，日暮讲论，从沈荃学董其昌书法，痰中带血亦不辍
- id: guji-康熙帝-event-sanfan
  title_zh: 议迁藩平定三逆
  date: 1673-04-01
  year_of: 1673
  description_zh: 与议政王大臣议迁藩，定迁藩之议，三逆既叛，料理军务日昃不遑，出游景山骑射以安众，永兴被困纳都统毕立克图之谏，卒剿灭三孽及察哈尔而复安
- id: guji-康熙帝-event-zhongdou
  title_zh: 推行种痘全活民生
  date: 1681-06-01
  year_of: 1681
  description_zh: 得种痘方，令诸子女及边外四十九旗喀尔喀诸藩俱种痘，皆得善愈，全千万人之生
- id: guji-康熙帝-event-tingxun
  title_zh: 庭训示教垂宪家法
  date: 1715-01-01
  year_of: 1715
  description_zh: 宫庭视膳问安之暇，谆谆提命，对越天祖，侍养两宫，主敬存诚，任人敷政，慎刑重谷，节饮食慎起居，贵为天子衣服适体常膳不兼味，以身先而垂格言二百四十六则
- id: guji-康熙帝-event-death
  title_zh: 驾崩
  date: 1722-12-20
  year_of: 1722
  description_zh: 康熙六十一年十一月十三日驾崩于畅春园，在位六十一年，宇宙清宁，遗庭训格言由世宗辑成以昭垂亿万世
