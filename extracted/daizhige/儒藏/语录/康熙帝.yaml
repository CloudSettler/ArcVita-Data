  birth_date: 1654-05-04
  death_date: 1722-12-20
  era: 清朝
  reign_ref: 康熙
  archetype: 儒家圣君
  dilemmas:
  - 用人宜信又不可遽信，常视上意而投好，如何察言观行而不溺偏好
  - 三藩察哈尔交叛危殆之时，持心坚定而外示暇豫，如何安众而不摇
  - 天理人欲只在顷刻一念，如何慎独主敬而去伪存诚
  lesson: 以诚敬为本，以勤俭养身，以格致明理，慎终如始，融贯三才而垂宪后世
  summary_first_person: 朕八岁登极，即知黾勉学问，五更即起诵读，日暮复讲论琢磨，虽痰中带血亦未少辍，凡祀坛庙理事务总以实心相待，不务虚名，对越天祖，孝养两宫，任人敷政，慎刑重谷，治河行师，图书经史礼乐文章及天象地舆历律步算莫不随时示训，临御六十载，宇宙清宁，惟愿后嗣恪循祖训，引伸扩充，格致诚正修齐治平一以贯之
  source_urls:
