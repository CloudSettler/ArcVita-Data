  dilemmas:
  - 博综古义以广闻见与总理万几以务实政之间如何兼顾日力而不流于虚文
  - 广挹群言以观人察学与裁定是非以折衷群言之间如何执两用中而不失大信
  lesson: 以勤学养政心以兼听察人志方能化经术史鉴为可久之治道
  summary_first_person: 朕在潜邸即诵习六经诸史，承大统后未尝不稽经读礼，乾隆二年嘉科臣毕谊之请，命翰詹科道轮班日缮经史奏议进呈，朕一一披阅，或温纶嘉勉，或召对开示，十余年积累篇章日富，至乾隆十四年罢日进而命大学士蒋溥等择其有裨经义政治者荟萃成编为三十一卷以资观览，此即朕好察迩言望道未见之本心
  source_urls:
