    start_date: 1724-01-01
    highlight_event_id: guji-弘曆-event-study
  - key: breakthrough
    name: 登極刪擇舊課定名薈說
    labels:
      zh: 刪擇編次
    start_date: 1736-02-12
    highlight_event_id: guji-弘曆-event-huishuo
  - key: climax
    name: 四卷垂訓闡發經世實功
    labels:
      zh: 垂訓天下
    start_date: 1736-09-15
    highlight_event_id: guji-弘曆-event-huishuo
  - key: closure
    name: 以知行合一自考施政
    labels:
      zh: 知行互考
    start_date: 1737-01-01
    highlight_event_id: guji-弘曆-event-govern
  decisions:
  - date: 1736-06-01
    title_zh: 取其精去其疵錄其正棄其偏
    rationale: 念舊聞弗釋，積成卷帙瑕瑜各半，欲存道徳性命學問政治之要為班朝莅政之考據
  - date: 1736-09-15
    title_zh: 以子夏日知無忘所能為學問窽要
    rationale: 必所知日新賡續極於高明，非空言無濟實用，方能遜敏敦修考驗知行合一
- id: guji-弘曆-endeavor-2
  title_zh: 內聖外王久道化成之文治
  summary_zh: 以聖人之德居天子之位，吐詞為經，修禮樂興教化，纂校鴻編，致太和翔洽百度修明，握內聖外王文經武緯之樞要
  phases:
  - key: brewing
    name: 敬天勤民居心養德
    labels:
      zh: 敬天法祖
    start_date: 1736-02-12
    highlight_event_id: guji-弘曆-event-govern
  - key: breakthrough
    name: 釐正紀綱慎簡大臣正心率物
    labels:
      zh: 正心用人
    start_date: 1737-01-01
    highlight_event_id: guji-弘曆-event-govern
  - key: climax
    name: 興禮樂隆教化頒行薈說
    labels:
      zh: 興文教化
    start_date: 1740-01-01
    highlight_event_id: guji-弘曆-event-huishuo
  - key: closure
    name: 纂修四庫奉為萬世之訓
    labels:
      zh: 校錄鴻編
    start_date: 1773-01-01
    highlight_event_id: guji-弘曆-event-siku
  decisions:
  - date: 1736-03-01
    title_zh: 以正心為用人理政之本
    rationale: 人君正心以正朝廷百官萬民四方，必慎簡大臣量才授職豫造其材方能阜成兆民
  - date: 1773-02-01
    title_zh: 命儒臣校錄薈說入四庫儒家類
    rationale: 帝王之學必歸實心要義與經世實功，吐詞為經足以垂萬世之訓當備天地立心生民立命之全
events:
- id: guji-弘曆-event-birth
  title_zh: 出生於雍親王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍親王府
  description_zh: 康熙五十年八月十三日生，為雍親王胤禛第四子，母為熹妃鈕祜祿氏
- id: guji-弘曆-event-study
  title_zh: 潛邸懋學日課屬文
  date: 1724-10-01
  year_of: 1724
  place_zh: 北京圓明園書齋
  description_zh: 自十四歲學屬文，留連六經四子旁搜史鑑，日課詩論雜文未嘗少輟，究心探索餍飫其中
- id: guji-弘曆-event-huishuo
  title_zh: 御製日知薈說成四卷
  date: 1736-09-15
  year_of: 1736
  place_zh: 北京紫禁城
  description_zh: 乾隆元年取向日日課所為文刪擇編次得二百六十則釐為四卷首卷論帝王治化之要次卷論天人性命之防三卷論禮樂法度之用末卷論古今得失之迹丙辰中秋自序其端
- id: guji-弘曆-event-govern
  title_zh: 踐阼莅政以知行合一自考
  date: 1736-02-12
  year_of: 1736
  place_zh: 北京太和殿
  description_zh: 登極踐阼萬幾待理，班朝莅政之間發抒聞見，以仁宅身以禮隄防民欲，以正心用人阜成兆民，期躬行實踐不為空言
- id: guji-弘曆-event-siku
  title_zh: 命館臣校錄薈說奉入四庫
  date: 1776-05-01
  year_of: 1776
  place_zh: 北京文淵閣
  description_zh: 乾隆四十一年五月總纂官紀昀陸錫熊孫士毅恭校上提要，稱亶聰首出念典彌勤內聖外王文經武緯早握樞要，列子部儒家類循環跪讀
- id: guji-弘曆-event-death
  title_zh: 龍馭上賓於養心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城養心殿
  description_zh: 嘉慶四年正月初三日崩，享年八十九歲，在位六十年禪位太上皇帝訓政三年，諡憲皇帝廟號高宗葬裕陵
