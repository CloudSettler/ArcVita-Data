  era: 清代
  reign_ref: 乾隆
  archetype: 內聖外王型帝王學者
  dilemmas:
  - 日課所得空言與莅政實用之間知行合一何以自考
  - 博覽經史詞苑菁華與躬行實踐之學恧然未逮何以敦修
  - 創業守成之際文治武功並舉與持盈保泰久道化成何以兼得
  lesson: 為學貴日知日新，為君貴知行合一，帝王之學必本聖人之德征經世之實功方能垂訓萬世
  summary_first_person: 予稟承庭訓，留連六經四子，旁搜史鑑儒先，自十四歲學屬文，日課詩論雜文未嘗少輟，踐阼以來萬幾待理，取舊製各體文刪擇精要得二百六十則，釐為四卷名曰日知薈說，欲以向日所得自考班朝莅政知行合一，期於為天地立心為生民立命為往聖繼絕學為萬世開太平
  source_urls:
