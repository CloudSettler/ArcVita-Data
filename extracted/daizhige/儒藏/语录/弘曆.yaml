endeavors:
- id: guji-弘曆-endeavor-1
  title_zh: 日課著述刪定日知薈說四卷
  summary_zh: 自潛邸懋學日課積累至乾隆元年取精去疵錄正棄偏成二百六十則分治化性命禮樂得失四卷以明道徳性命學問政治經傳淵源古今事迹
  phases:
  - key: brewing
    name: 潛邸懋學遍覽經史
    labels:
