endeavors:
- id: guji-张九韶-endeavor-1
  title_zh: 辑理学类编八卷会通六子
  goal_zh: 以周程张邵朱六子为主荀子以下五十三家辅之使初学不待遍阅而可考天道性命
  summary_zh: 元末博采成书至正丙午初名格物编吴当易名理学类编分天地天文地理鬼神人物性命异端八卷每篇末绎以己见破阴阳相术谶纬之惑
