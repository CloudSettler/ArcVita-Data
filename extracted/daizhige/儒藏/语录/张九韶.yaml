    highlight_event_id: guji-张九韶-event-office
  decisions:
  - date: 1366
    title_zh: 以六子为主五十三家为辅不事博引
    rationale: 摘取精要条理精蜜使初学可考而不抵牾于性命天道
  - date: 1366
    title_zh: 从吴当议易格物编为理学类编
    rationale: 所辑乃格物之一端不足尽格物之义宜正名以明天地鬼神人物性命之统
  - date: 1366
    title_zh: 每篇末绎以己见并收容斋鹤林诸说以互证
    rationale: 不存讲学家门户之见于异端阴阳谶纬斥驳明切以破世俗之惑
- id: guji-张九韶-endeavor-2
  title_zh: 明初为学官师范成就诸生
  goal_zh: 以躬行导率居博士助教之任使国子诸生多所成就
  summary_zh: 元末不仕洪武三年荐为县学教谕迁国子助教改翰林编修致仕归后复征校书书成遣还与宋讷聂鈜贝琼等先后为师范
