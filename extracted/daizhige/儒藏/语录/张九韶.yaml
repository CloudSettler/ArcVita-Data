  summary_first_person: 吾清江张九韶字美和元末累举不仕潜心周程张邵朱之说至正丙午辑天地鬼神人物性命为格物编八卷临川吴当更名理学类编洪武三年以荐为县学教谕迁国子监助教改翰林编修致仕归后复征入校书书成遣还愿后学验之身心不徒博物洽闻
