  summary: 栻顷获登门，从胡宏（五峰先生）受道义之诲，浃洽于中，得其学问之传。
- id: guji-张栻-event-2
  event_type: scholarship
  date: '1167'
  year_of: 1167
  endeavor_id: guji-张栻-endeavor-1
  summary: 胡宏卒后，栻承受其《知言》之学，以为道学枢要、制治蓍龟。
- id: guji-张栻-event-3
  event_type: debate
  date: '1168'
  year_of: 1168
  endeavor_id: guji-张栻-endeavor-1
  summary: 或问《论语》不言性而《知言》论性特详，是否与圣贤之意异；栻答曰无以异，谓夫子文章无非性与天道之流行，孟子道性善乃有不得已焉。
- id: guji-张栻-event-4
  event_type: publication
  date: '1170'
  year_of: 1170
  endeavor_id: guji-张栻-endeavor-1
  summary: 栻为胡宏《知言》撰《胡子知言序》，自署门人广汉张栻，序遗书以贻同志，而辞不韪之罪。
- id: guji-张栻-event-death
  event_type: death
  date: '1180'
  year_of: 1180
  summary: 张栻约卒于南宋淳熙年间，其学 后来经吴儆等传《知言》于世。
