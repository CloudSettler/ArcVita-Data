  dilemmas:
  - 在湖湘学派与中原伊洛之学之间传承与融会，须辨异端而不流于空谈性命
  lesson: 求仁而察于视听言动之间，方能默识性命之理，不可坐谈性理而流入异端。
  summary_first_person: 我张栻，一作广汉人而称南轩先生，早年登胡宏之门，受其道义之诲，深契知言之学。我应学者之问，辨明胡先生《知言》详论性情与孔孟言性之意并无不同：夫子之文章无非性与天道之流行，孟子道性善乃惧异说惑人有不得已者在。我序其遗书，使学者因言精察，求仁尽性，以传湖湘之统于同志。
  source_urls:
  - https://zh.wikipedia.org/wiki/张栻
