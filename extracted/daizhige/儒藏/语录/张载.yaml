- id: guji-张载-event-death
  title_zh: 病逝于临潼
  date: 1077
  year_of: 1077
  description: 熙宁十年告归道病逝于临潼存顺没宁门人行状传之明人吕柟谪解州时稡抄注释为张子抄释六卷
