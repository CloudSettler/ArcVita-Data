    rationale: 以礼乐政教化民之志欲述天理而措之故不辞朝命而议王安石新法之礼
  - date: 1077
    title_zh: 病告归以存顺没宁全归
    rationale: 富贵福泽厚生贫贱忧戚玉成故体受归全如曾参之勇以终西铭之义
events:
