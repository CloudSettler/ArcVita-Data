  lesson: 修本务内虚心受善贵验笃行则道立名传
  summary_first_person: 吾徐干字伟长北海剧人也，少诵文数十万言，年十四始读五经发愤忘食，弱冠博通，值灵帝末冠族结党权门，吾病俗迷昏闭户自守以六籍娱心，避地归都，辞疾不就州郡礼命，后力疾从戍，潜身穷巷颐志保真，废诗赋颂铭而著中论二十篇以阐大义救流俗之昏，年四十八建安二十三年春殒于厉疾
