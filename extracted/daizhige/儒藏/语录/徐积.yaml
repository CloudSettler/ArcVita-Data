endeavors:
- id: guji-徐积-endeavor-1
  title_zh: 应荐出仕教授守分
  summary: 元祐初以荐授扬州司户参军为楚州教授，历和州防御推官改宣德郎监中岳庙，借书守分，分过不掠美，以和同官，以笃行化人。
  phases:
  - key: brewing
    name: 山阳力学成名
    labels:
      zh: 潜修
    start_date: 1028
    highlight_event_id: guji-徐积-event-birth
  - key: breakthrough
    name: 登第应荐入仕
    labels:
      zh: 入仕
    start_date: 1086
    highlight_event_id: guji-徐积-event-1
  - key: climax
    name: 楚州和州教授推官
    labels:
      zh: 教授
    start_date: 1087
    highlight_event_id: guji-徐积-event-1
  - key: closure
    name: 监中岳庙退守
    labels:
      zh: 退守
    start_date: 1094
    highlight_event_id: guji-徐积-event-2
  decisions:
  - date: 1086
    title_zh: 受荐任司户教授不辞劳
    rationale: 借书必白，守分不敢自专，以教授尽职为报国，不以利禄动心。
  - date: 1094
    title_zh: 转推官监庙安于闲散
    rationale: 事各有所主不相侵，和同官分过不掠美，退而养气全精神。
- id: guji-徐积-endeavor-2
  title_zh: 论经论文门人传录
  summary: 治春秋诗书以孟子为折衷，论文主简易自然，论人物以死生定优劣，门人江端礼录为节孝语录，近于古之儒家。
  phases:
  - key: brewing
    name: 少读货殖悟为学法
    labels:
      zh: 悟学
    start_date: 1045
    highlight_event_id: guji-徐积-event-1
  - key: breakthrough
    name: 以春秋立法论文教士
    labels:
      zh: 论文
    start_date: 1086
    highlight_event_id: guji-徐积-event-1
  - key: climax
    name: 说经论史评人物
    labels:
      zh: 论道
    start_date: 1090
    highlight_event_id: guji-徐积-event-2
  - key: closure
    name: 端礼录成语录传世
    labels:
      zh: 成书
    start_date: 1103
    highlight_event_id: guji-徐积-event-death
  decisions:
  - date: 1090
    title_zh: 治春秋先求经阙疑存阙
    rationale: 不立例拘泥，不以传害经，以孟子为折衷，曲说不如存阙文。
  - date: 1100
    title_zh: 论文取简易戒溢美传闻
    rationale: 为文正如为人，贵出诸己自然浑成，美人只据所见所长，不以虚誉欺后世。
events:
- id: guji-徐积-event-birth
  date: 1028
  year_of: 1028
  title_zh: 出生于山阳
  description: 天圣六年生于楚州山阳，少力学笃于躬行，粹于儒术。
- id: guji-徐积-event-1
  date: 1086
  year_of: 1086
  title_zh: 元祐初授扬州司户为楚州教授
  description: 元祐初以荐授扬州司户参军，为楚州教授，教士读春秋学曾苏，守分和众。
- id: guji-徐积-event-2
  date: 1094
  year_of: 1094
  title_zh: 历和州防御推官监中岳庙
  description: 历和州防御推官，改宣德郎监中岳庙，退守闲散，论经论文不辍，门人江端礼随侍记录。
- id: guji-徐积-event-death
  date: 1103
  year_of: 1103
  title_zh: 卒于家
  description: 崇宁二年卒，躬行节孝名闻乡里，门人录其语为节孝语录一卷。
- id: guji-徐积-event-honor
  date: 1116
  year_of: 1116
  title_zh: 政和六年赐谥节孝处士
  description: 政和六年朝廷赐谥节孝处士，事迹具宋史卓行传，四库著录节孝语录一卷。
