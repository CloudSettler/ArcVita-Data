  dilemmas:
  - 笃守孝行不求闻达与应荐出仕教授之间如何安分守己
  - 治经论人务求实事实用与流俗空谈性命高远之间如何自处
  lesson: 为人为文皆贵简易自然，守分养气，论经论事归于实用，临死生之际方见人物。
  summary_first_person: 吾山阳徐积，字仲车，少力学笃行，登进士第而不求闻达，元祐初以荐为扬州司户楚州教授，后历和州推官监中岳庙，终身以经术教人，以躬行化俗，门人录吾语为节孝语录。
