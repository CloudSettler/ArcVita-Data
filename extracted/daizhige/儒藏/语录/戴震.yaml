  dilemmas:
  - 尊程朱之贤而必辨其理气二分之失何以自处
  - 以训诂考据为实学而欲直承孟子性善本旨何以会通
  lesson: 以气化流行释天道以血气心知释性善归理于条理必然不别立理为一物
  summary_first_person: 余少治训诂而慕孟子性善之旨深病宋儒以理生气以理为形上之说乃以一阴一阳流行生生为道以分于阴阳五行而成性以人伦日用得理为善私淑孟子以正人心
