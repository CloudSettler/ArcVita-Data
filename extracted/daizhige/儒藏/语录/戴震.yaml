    description_zh: 世重空谈性理轻视训诂音韵致圣人之道不明人伦日用反失其据
  lesson: 以实事求是体道于日用气化之中不以虚理凌驾生生之德
  summary_first_person: 吾少疑宋儒理生气之说乃博考六经论孟以气化流行生生不息释道以条理分理释理以分于阴阳五行释性愿学者舍虚就实还于人伦日用之必然
