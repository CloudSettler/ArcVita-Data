endeavors:
- id: guji-戴震-endeavor-1
  person_id: guji-戴震
  title_zh: 私淑孟子论性善气禀
  summary_zh: 以分于阴阳五行释性之不齐以仁义心知之利释善之必然会通论语性相近与孟子性善驳宋儒别立气质之性之说
  phases:
  - key: brewing
    name: 酝酿考据
    labels:
      zh: 训诂考据
    start_date: 1745-01-01
    highlight_event_id: guji-戴震-event-1
  - key: breakthrough
    name: 立分于道成性之说
    labels:
      zh: 性善发微
    start_date: 1766-01-01
    highlight_event_id: guji-戴震-event-1
  - key: climax
    name: 定孟子字义疏证纲领
    labels:
      zh: 义理大显
    start_date: 1776-01-01
    highlight_event_id: guji-戴震-event-2
  - key: closure
    name: 著私淑录以诏后学
    labels:
      zh: 成书垂教
    start_date: 1777-01-01
    highlight_event_id: guji-戴震-event-2
  decisions:
  - date: 1766-01-01
    title_zh: 以材质见性不离气禀言性
    rationale: 离材质无睹所谓性故以阴阳五行杂糅万变释人物性殊而守孟子同类相似之喻
  - date: 1776-01-01
    title_zh: 以利为故立性善本然
    rationale: 善以顺利逆害为断故以水之下人趋善为喻专言人之仁义心知不泛及禽兽草木
- id: guji-戴震-endeavor-2
  person_id: guji-戴震
  title_zh: 释一阴一阳为道驳理生气
  summary_zh: 以气化流行生生不息为天道实体证形而上即阴阳未成形质之前驳宋儒以理为形上以阴阳为形下器具之分
  phases:
  - key: brewing
    name: 研易庸探道器
    labels:
      zh: 道器辨名
    start_date: 1755-01-01
    highlight_event_id: guji-戴震-event-1
  - key: breakthrough
    name: 正太极两仪本指
    labels:
      zh: 正名太极
    start_date: 1768-01-01
    highlight_event_id: guji-戴震-event-1
  - key: climax
    name: 立气化即道即理之论
    labels:
      zh: 理气合一
    start_date: 1776-01-01
    highlight_event_id: guji-戴震-event-2
  - key: closure
    name: 系私淑录上下二卷
    labels:
      zh: 垂书定论
    start_date: 1777-01-01
    highlight_event_id: guji-戴震-event-2
  decisions:
  - date: 1768-01-01
    title_zh: 以作易卦画释太极生两仪
    rationale: 太极即一阴一阳会归之称两仪四象八卦皆指易画不指气生于理故不于阴阳外别求主宰枢纽
  - date: 1776-01-01
    title_zh: 以条理训理归理于事为之则
    rationale: 理即物之文理分理与不易之则粲然可征故不尊理为净洁空阔一物而使学者皓首茫然
