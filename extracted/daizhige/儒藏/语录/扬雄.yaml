  birth_date: '-53'
  death_date: '18'
  era: 西汉末至新莽
  reign_ref: 汉宣帝甘露至新莽天凤年间
  archetype: 立言明道之鸿儒
  dilemmas:
  - 诸子各以其知舛驰诋訾圣人，大道将破，如何以法言正之
  - 身历汉莽之际仕为大夫校书天禄，如何守道不失其正
  lesson: 学以成行，言以明法，教以传道，三者立则圣道不坠
  summary_first_person: 吾少好学，见诸子怪迂析辩以挠世事，太史公记六国颇谬于经，故常用法应之，象论语作法言十三卷，又作太玄十九篇，欲以明圣人之道，垂则后世，死无所恨
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E6%B3%95%E8%A8%80%E4%B9%89%E7%96%8F.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E6%B3%95%E8%A8%80%E4%B9%89%E7%96%8F.html
endeavors:
- id: guji-扬雄-endeavor-1
  title_zh: 象论语作法言以正诸子
  summary: 睹诸子诋訾圣人溺于所闻，象论语撰法言十三卷，以法圣人为典则
  phases:
  - key: brewing
    name: 入长安观诸子之失
    labels:
      zh:
      - 悯道
      - 博览
    start_date: '-27'
    highlight_event_id: guji-扬雄-event-dai-zhao
  - key: breakthrough
    name: 定象论语十三卷之体
    labels:
      zh:
      - 立制
    start_date: '-2'
    highlight_event_id: guji-扬雄-event-taixuan
  - key: climax
    name: 法言成书以法应问
    labels:
      zh:
      - 立言
    start_date: '5'
    highlight_event_id: guji-扬雄-event-fayan
  - key: closure
    name: 自序三十八篇以传家法
    labels:
      zh:
      - 传道
    start_date: '10'
    highlight_event_id: guji-扬雄-event-fayan
  decisions:
  - date: '-2'
    title_zh: 更立名号曰法言
    rationale: 明非诸子之俦，以典则为常，纠绳怪迂之辩
  - date: '5'
    title_zh: 以学行为首篇
    rationale: 学者仁其性命之本，本立而道生，故冠众篇之首以教一切
- id: guji-扬雄-endeavor-2
  title_zh: 校书天禄守道著述
  summary: 历成哀平给事黄门校书天禄，作太玄乐箴方言，虽仕莽朝而守玄静之道
  phases:
  - key: brewing
    name: 待诏承明博习群书
    labels:
      zh:
      - 好学
    start_date: '-27'
    highlight_event_id: guji-扬雄-event-dai-zhao
  - key: breakthrough
    name: 作太玄十九篇拟易
    labels:
      zh:
      - 拟圣
    start_date: '-2'
    highlight_event_id: guji-扬雄-event-taixuan
  - key: climax
    name: 校书天禄考订经传
    labels:
      zh:
      - 守职
    start_date: '5'
    highlight_event_id: guji-扬雄-event-fayan
  - key: closure
    name: 病免归玄冢传名
    labels:
      zh:
      - 全归
    start_date: '18'
    highlight_event_id: guji-扬雄-event-death
  decisions:
  - date: '-2'
    title_zh: 作太玄以赞易道
    rationale: 明幽赞神明通合天人之道，补六经之所未备
  - date: '10'
    title_zh: 不附权势安于校书
    rationale: 以文儒立言为高，不以荣利易其守，卒葬安陵以玄为号
events:
- id: guji-扬雄-event-birth
  date: '-53'
  year_of: -53
  title_zh: 生于蜀郡成都
  description: 汉宣帝甘露元年生于蜀郡，少而好学，博览无所不见
- id: guji-扬雄-event-dai-zhao
  date: '-27'
  year_of: -27
  title_zh: 入长安待诏承明
  description: 慕司马相如之文，入长安上赋待诏，历给事黄门郎
- id: guji-扬雄-event-taixuan
  date: '-2'
  year_of: -2
  title_zh: 撰太玄十九篇
  description: 拟易作太玄，与法言乐箴共为三十八篇，自序其旨
- id: guji-扬雄-event-fayan
  date: '5'
  year_of: 5
  title_zh: 撰成法言十三卷
  description: 人有问者常用法应之，譔为十三卷象论语，号曰法言，以正诸子
- id: guji-扬雄-event-death
  date: '18'
  year_of: 18
  title_zh: 卒葬安陵阪上
  description: 新莽天凤五年卒，葬安陵阪上，弟子侯芭负土作坟，号曰玄冢
