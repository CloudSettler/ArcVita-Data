    start_date: 1075
    highlight_event_id: guji-晁说之-event-jinshi
  - key: breakthrough
    name: 进士受知
    labels:
      zh: 进士受荐
    start_date: 1082
    highlight_event_id: guji-晁说之-event-jinshi
  - key: climax
    name: 政和作儒言
    labels:
      zh: 作儒言辨学
    start_date: 1112
    highlight_event_id: guji-晁说之-event-ruyan
  - key: closure
    name: 集外别行
    labels:
      zh: 生集别传
    start_date: 1120
    highlight_event_id: guji-晁说之-event-ruyan
  decisions:
  - date: 1112
    title_zh: 作儒言托始废春秋
    rationale: 安石废春秋配享孔子后，直斥孔孟名圣祀圣诸条，以明一王之制不可有二上
  - date: 1112
    title_zh: 兼斥居心不止学术
    rationale: 不夺心迹流品诸条并斥其居心行事，与绍述之徒辨而不但与安石辨
- id: guji-晁说之-endeavor-2
  title_zh: 立朝事君直言致仕
  summary_zh: 元符上书入邪等，靖康召试中书舍人兼太子詹事，建炎擢待制，以书非孟子勒令致仕
  phases:
  - key: brewing
    name: 上书罹党
    labels:
      zh: 上书入籍
    start_date: 1100
    highlight_event_id: guji-晁说之-event-jinshi
  - key: breakthrough
    name: 靖康召用
    labels:
