  - key: climax
    name: 建炎擢待制
    labels:
      zh: 建炎显擢
    start_date: 1127
    highlight_event_id: guji-晁说之-event-zhishi
  - key: closure
    name: 非孟致仕
    labels:
      zh: 勒令致仕
    start_date: 1128
    highlight_event_id: guji-晁说之-event-zhishi
  decisions:
  - date: 1126
    title_zh: 就召著作郎试舍人
    rationale: 国难之际以儒者之言澄定意气，兼詹事辅导太子以尽臣节
  - date: 1128
    title_zh: 坚持非孟子不改
    rationale: 守匹夫不可夺之志，不以爵禄易学，虽致仕而不悔直言
events:
- id: guji-晁说之-event-birth
  date: 1059
  year_of: 1059
  title_zh: 诞生于巨野
  description_zh: 宋仁宗嘉祐四年生于巨野，字以道，少慕司马光，自号景迂
- id: guji-晁说之-event-jinshi
  date: 1082
  year_of: 1082
  title_zh: 元丰五年进士受苏轼荐
  description_zh: 元丰五年登进士第，苏轼以著述科荐之，始以文学治经闻于世
- id: guji-晁说之-event-ruyan
  date: 1112
  year_of: 1112
  title_zh: 政和二年作儒言
  description_zh: 元黓执徐仲秋作儒言一卷，辨王安石新经义字说及废春秋配享之事，后编入景迂生集而别行
- id: guji-晁说之-event-chushi
  date: 1126
  year_of: 1126
  title_zh: 靖康初召为著作郎试中书舍人
  description_zh: 靖康初召为著作郎，试中书舍人兼太子詹事，以经术论事侃侃不挠
- id: guji-晁说之-event-zhishi
  date: 1128
  year_of: 1128
  title_zh: 建炎擢徽猷阁待制勒令致仕
  description_zh: 建炎初擢徽猷阁待制，高宗恶其作书非孟子，勒令致仕
- id: guji-晁说之-event-death
  date: 1129
  year_of: 1129
  title_zh: 建炎三年卒
  description_zh: 宋高宗建炎三年卒，一生以儒者之言守正辨邪，著述存于景迂生集
