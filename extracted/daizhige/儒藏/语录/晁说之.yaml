endeavors:
- id: guji-晁说之-endeavor-1
  title_zh: 著儒言辨斥新学守护六经
  summary_zh: 本诸六艺志在春秋，斥王安石废春秋配享孔子及新经义字说之违僻，兼斥绍述之徒居心行事
  phases:
