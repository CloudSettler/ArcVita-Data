  era: 宋
  reign_ref: 宋徽宗政和至宋高宗建炎
  archetype: 守经辨邪之儒
  dilemmas:
  - 绍述盛行而侃侃辨斥王安石新学，不挠于权势与党锢
  - 因安石附会周礼尊崇孟子而激诋周礼抑孟子，以恩怨为是非之偏
  lesson: 守六艺明春秋以正人心可法，然负气求胜攻讦太甚则酿偏激，当取大旨之正而戒有激之谈
  summary_first_person: 吾晁说之，字以道，巨野人，少慕司马温公，自号景迂，元丰五年进士，政和二年作儒言以辨新学，靖康建炎间历著作郎中书舍人徽猷阁待制，以言见黜而致仕
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E5%84%92%E8%A8%80.html
