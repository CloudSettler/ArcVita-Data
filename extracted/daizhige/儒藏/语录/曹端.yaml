      - 便初学
    start_date: '1425'
    highlight_event_id: guji-曹端-event-teach
  - key: climax
    name: 宣德序书辨语录之戾
    labels:
      zh:
      - 尊注解
      - 辨语录
    start_date: '1428'
    highlight_event_id: guji-曹端-event-zhushu
  - key: closure
    name: 合刻三书垂后学
    labels:
      zh:
      - 述解
      - 正传
    start_date: '1434'
    highlight_event_id: guji-曹端-event-death
  decisions:
  - date: '1428'
    title_zh: 舍语录而守注解
    rationale: 注解出朱子之手为成书至当归一，语录乃门人所记讲究未定仓卒应答百得一失，故弃顽石取良玉
  - date: '1428'
    title_zh: 作序附辨戾诗赞
    rationale: 太极不自生动静一段语录与注解互异，恐后学雷同附和，故考定其说附于卷末以就有道
events:
- id: guji-曹端-event-birth
  date: '1376'
  year_of: 1376
  title_zh: 生于渑池
  description_zh: 明洪武九年生于渑池，字正夫，号月川，成童业农弱而学儒
- id: guji-曹端-event-juren
  date: '1408'
  year_of: 1408
  title_zh: 永乐戊子举人
  description_zh: 永乐六年戊子举于乡，授霍州学正，后改蒲州学正，事迹具明史儒林传
- id: guji-曹端-event-teach
  date: '1415'
  year_of: 1415
  title_zh: 霍蒲讲授倡静存
  description_zh: 在霍州蒲州讲授太极图说通书西铭，以躬行实践静存为要，学者称月川先生
- id: guji-曹端-event-zhushu
  date: '1428'
  year_of: 1428
  title_zh: 宣德戊申作述解序
  description_zh: 宣德三年三月作太极图说述解原序，大书周说分布朱解，附辨戾一条及诗赞于卷末，论无极太极理气不离不杂
- id: guji-曹端-event-death
  date: '1434'
  year_of: 1434
  title_zh: 卒为明初醇儒之首
  description_zh: 明宣德九年卒，明代醇儒以曹端胡居仁薛瑄为最而端开二人之先，后张燝合刻三书黎尧卿作跋传世
