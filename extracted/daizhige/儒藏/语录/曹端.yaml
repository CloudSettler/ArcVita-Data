  dilemmas:
  - 科举縻身与潜心玩理之取舍
  - 从朱子注解成书与从语录仓卒应答之辨别
  lesson: 以静存立体以躬行达用，守朱子成书辨语录之讹以正道传
  summary_first_person: 我是渑池曹端，字正夫，号月川，成童业农弱而学儒，困于科举二十余年而后潜心玩理，以静存为要，读周子太极图说通书西铭而知道在是，讲授之际大书周说分布朱解以便初学，又辨语录太极动静之戾以归至当，愿后学不雷同附和而躬行实践以立人极
