  decisions:
  - date: '1408'
    title_zh: 不溺科举潜心玩理
    rationale: 縻于科举二十余年，自强后因故所学潜心玩理，坐下砖皆穿以求实践
  - date: '1415'
    title_zh: 以静存为要教诸生
    rationale: 学务躬行实践，非此心寂然无欲而静则无以酬酢万变，故主敬存养以立人极
- id: guji-曹端-endeavor-2
  title_zh: 述解三书尊朱辨戾
  summary_zh: 大书周说分布朱解作太极图说通书西铭述解，取注解舍语录，附辨戾诗赞以正传
  phases:
  - key: brewing
    name: 得图说知晓道在是
    labels:
      zh:
      - 太极图说
      - 通书西铭
    start_date: '1415'
    highlight_event_id: guji-曹端-event-teach
