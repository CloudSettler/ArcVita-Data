  dilemmas:
  - 以书生治军以仁治勇而时势逼以峻法残忍当守仁礼还是从权尚严
  - 居高位享大名而恐一身享用殆尽福泽不延当趋进取功名还是退守耕读孝友
  - 明强求自修之强还是求胜人之强刚柔当如何互用而不偏废
  lesson: 慎独主敬求仁思诚以立内圣根基勤谦明强坚忍以成外王事功进以猛持以恒久战养气不浪战
  summary_first_person: 余少壮不知努力老而多悔唯以慎独主敬求仁思诚自勉以勤谦明强坚忍自励创建湘军久战养气不敢扰民不敢贪利但愿家为耕读孝友之家不愿子弟以仕宦为荣晚年辑此挺经以示来者
  source_urls:
