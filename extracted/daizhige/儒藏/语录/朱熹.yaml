  - title_zh: 事教先行还是空谈义理先行
    description: 小儿未知推究义理若先说空理则心无涵养故先以洒扫应对礼乐书数养其诚敬
  - title_zh: 复古小学还是补救失教
    description: 今人自小已失本领若徒理会闲知识则反害心故须庄敬诚实立本再逐事穷理
  lesson: 蒙养以正先养诚敬后穷义理则大学之功不费力而德业自成
  summary_first_person: 吾以为古人自能食能言即教以洒扫应对孝弟忠信养其诚敬善端及年十六七入大学方教以致知格物穷其所以为忠孝之理今人小学已失故力主庄敬诚实立本逐事穷理辑定小学以救时弊
