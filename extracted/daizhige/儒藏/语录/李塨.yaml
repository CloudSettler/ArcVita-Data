  - title_zh: 口耳翻读与躬行实事之辨
    description: 世人以翻读章句为学吾欲以礼乐兵农实事为学当从何守
  - title_zh: 师道守丧与经世致用之衡
    description: 既承习斋之教守墓讲学又念民生国计当以实行经世如何两全
  lesson: 学必躬行文必合礼博文约礼方为圣学正途
  summary_first_person: 吾少师习斋始知圣学不在口耳而在躬行礼乐兵农皆学也晚年纂圣经学规以明六艺实功愿后学由博文以约礼由下学以上达勿堕空言
