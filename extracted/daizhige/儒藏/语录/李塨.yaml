  - date: 1710
    title_zh: 以六艺实事释博学注脚
    rationale: 后儒以翻读为博学失圣门本义故断以礼乐射御书数兵农实务为文以救其偏
  - date: 1714
    title_zh: 成书论学以附大学之后
    rationale: 学明则格物明故总论语中庸孟子尚书学规数十条使学者有所持循而不入空言
