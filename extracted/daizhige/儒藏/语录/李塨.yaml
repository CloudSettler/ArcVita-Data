    title_zh: 决意师事颜元舍章句而习六艺
    rationale: 既见习斋存性存学之实知口耳翻读非圣学故尽弃旧习以实事求是为归
  - date: 1704
    title_zh: 师殁守墓三年讲学不辍
    rationale: 师恩道重非守墓讲习不足以明躬行之教以身守道示门人不使习斋之学坠于地
