  archetype: 守正直谏之臣
  dilemmas:
  - 直道事君则见疑于上，曲身容身则有愧于心，进退皆难
  - 好名好术足以乱治，守诚守礼足以化民，君臣当守何道
  lesson: 君臣一体相须而成，舍人任法必离其体，唯诚与礼可致治平
  summary_first_person: 吾乃杜畿之子，少立志行，历事魏朝，见好名好术之弊，故直谏守正，不为容悦，虽斥逐章武而不悔，所著体论，言君体臣体以及政法听察，欲使后世知诚礼为治本也
