    title_zh: 杜门著体论不复求进
    rationale: 知中才之主难与言诚，欲以文字存君臣之体，为后世明鉴
  - date: 169
    title_zh: 明法本于公参以人情
    rationale: 见酷吏任法以饰聪，狱讼求杀不求生，故倡与其害善宁利淫，必原情恤刑
events:
- id: guji-杜恕-event-birth
  date: 0198
  year_of: 198
  title_zh: 生于京兆杜陵
  description: 杜畿之子，生于杜陵家门，少以孝悌信义见称，结发束修立志事君
- id: guji-杜恕-event-0228
  date: 0228
  year_of: 228
  title_zh: 任散骑侍郎谏时政
  description: 入朝为散骑侍郎，上疏论治道在择人任诚，不在法术密察，言甚切直
- id: guji-杜恕-event-0239
  date: 0239
  year_of: 239
  title_zh: 出镇幽州乐浪抚边
  description: 出为幽州刺史建威将军领乐浪太守，宽惠得众，含垢藏疾，不肯邀功生事
- id: guji-杜恕-event-0249
  date: 0249
  year_of: 249
  title_zh: 论事得罪徙章武
  description: 以论事忤旨贬为庶人，徙居章武，自此绝意仕进，专心著述以明道
- id: guji-杜恕-event-0250
  date: 168
  year_of: 250
  title_zh: 著体论七篇
  description: 作体论分君臣言行及政法听察七篇，斥尊君卑臣及法术之说，倡君使臣以礼臣事君以忠
- id: guji-杜恕-event-death
  date: 170
  year_of: 252
  title_zh: 卒于章武
  description: 卒于徙所章武，体论赖群书治要意林贞观政要等传抄而存，为魏晋政论要篇
