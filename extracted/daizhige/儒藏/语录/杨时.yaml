  archetype: 理学家、师儒
  dilemmas:
  - 出处之际：屡被召旨而仕途多阻，学者身份与朝堂政治之间的取舍
  - 传道与著述：承伊洛之学而须在乱世中维系师门学统
  lesson: 程门立雪、笃信好学，师道之传端赖诚敬不辍。
  summary_first_person: 我杨时字中立，世称龟山先生，师事二程，尝立雪程门。晚年倡道东南，学者称吾为闽学先导；五峰胡宏亦尝于京师见我问学。
  source_urls:
  - https://zh.wikisource.org/wiki/知言
