  dilemmas:
  - 拟经续孟见疑僭经与阐发仁义补阙之间何从
  - 空言施政惠民一邑与临难殉义取信天下之间何重
  lesson: 昌言仁义以药时病，更以死节实其言，方使立言取信后世
  summary_first_person: 吾字虔中，闽之长乐人也，咸通十年进士，十一年宏词拔萃魁，为秘书校书兴平尉，转水部守万年，感孟子七篇弟子所记不能尽意，推阐而作续孟十四篇，巢贼称帝，百僚鼠窜，吾抗节骂贼以死，庶平昔仁义之言有以自信
  source_urls:
