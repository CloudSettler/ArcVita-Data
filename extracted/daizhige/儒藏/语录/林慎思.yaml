endeavors:
- id: guji-林慎思-endeavor-1
  title_zh: 推阐仁义续孟十四篇
  summary: 感孟子章句略而多阙，假问答敷演仁义，成续孟子上下二卷
  phases:
  - key: brewing
    name: 槐里著书发端
    labels:
      zh:
      - 阐发仁义
      - 补阙拾遗
    start_date: 0870
    highlight_event_id: guji-林慎思-event-zhushu
  - key: breakthrough
    name: 续孟成编行世
    labels:
      zh:
      - 敷演譬喻
      - 续经立言
    start_date: 0875
    highlight_event_id: guji-林慎思-event-zhushu
  decisions:
  - date: 0870
    title_zh: 不立新论而托孟子问答
    rationale: 以庄列寓言之体假姓氏敷演，使大义委曲发明而不自僭经
  - date: 0875
    title_zh: 以大举小论封诛比屋
    rationale: 明尧封纣诛以其大而举之不以其小而废之，得持论之衡
- id: guji-林慎思-endeavor-2
  title_zh: 守万年抗节骂贼死义
  summary: 由水部出宰万年，惠民在邑，巢乱不屈，骂贼殒身以实其言
  phases:
  - key: climax
    name: 出宰万年施仁
    labels:
      zh:
      - 治邑怀惠
      - 学孟行义
    start_date: 0879
    highlight_event_id: guji-林慎思-event-shouwan
  - key: closure
    name: 抗节骂巢殒身
    labels:
      zh:
      - 忠烈殉国
      - 以死证言
    start_date: 0880
    highlight_event_id: guji-林慎思-event-xunjie
  decisions:
  - date: 0879
    title_zh: 施所学于一邑
    rationale: 如有用吾吾言其施吾学其行，不徒抱空言老于槐里
  - date: 0880
    title_zh: 知必死而骂贼不苟生
    rationale: 义在于死而不利苟生，真知义利之辨，使平生之言重若泰山
