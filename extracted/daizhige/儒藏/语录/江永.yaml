  - key: climax
    name: 集注十四卷告成
    labels:
      zh: 守次集注
    start_date: '1760'
    highlight_event_id: guji-江永-event-jinsilu
  - key: closure
    name: 四库馆臣校上著录
    labels:
      zh: 入库传世
    start_date: '1762'
    highlight_event_id: guji-江永-event-siku
  decisions:
  - date: '1748'
    title_zh: 仍原本次第不妄改
    rationale: 朱子原本以所引之书为先后，周公恕分析移置漏落淆混，故守原本以正后学
  - date: '1757'
    title_zh: 以朱子说为主兼采补阙
    rationale: 凡文集或问语类相发明者悉采入分注，未备者始取叶采他说，间附己意以求详洽
