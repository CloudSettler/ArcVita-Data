endeavors:
- id: guji-江永-endeavor-1
  title_zh: 穷经考据开皖派先河
  description: 专治三礼及群经，著周礼疑义举要等，以古义实征开皖派考据之风
  phases:
  - key: brewing
    name: 少年治经立志古义
    labels:
      zh: 博览群经
    start_date: '1696'
    highlight_event_id: guji-江永-event-birth
  - key: breakthrough
    name: 潜心礼学穿穴典籍
    labels:
      zh: 究心礼制
    start_date: '1725'
    highlight_event_id: guji-江永-event-zhouli
  - key: climax
    name: 举要成书为世所宗
    labels:
      zh: 著述立宗
    start_date: '1750'
    highlight_event_id: guji-江永-event-zhouli
  - key: closure
    name: 以实学授徒传派
    labels:
      zh: 传学皖派
    start_date: '1755'
    highlight_event_id: guji-江永-event-death
  decisions:
  - date: '1745'
    title_zh: 专力古义不徇空谈
    rationale: 讲学家空谈尊朱无实征，故以考据训诂求圣贤本义
  - date: '1750'
    title_zh: 先成周礼疑义举要
    rationale: 礼为群经纲纪，疑义举要则经义可正，后学有所据依
- id: guji-江永-endeavor-2
  title_zh: 集注近思录阐明道体
  description: 仍朱子原本次第，采文集或问语类相发明者分注，兼采叶采他说并附己意而成十四卷
  phases:
  - key: brewing
    name: 有感周公恕本贻误后学
    labels:
      zh: 辨伪存真
    start_date: '1735'
    highlight_event_id: guji-江永-event-zhouli
  - key: breakthrough
