  decisions:
  - date: 1780
    title_zh: 以虚实二数释三九
    rationale: 实数可稽虚数不可执，通语言而不胶文字，以祛说经凿空株守之弊
  - date: 1790
    title_zh: 考六明堂坛庙之制辨月令之谬
    rationale: 则古昔称先王，多闻择善而从，宗周坛而不屋洛邑在国中，不可淆名实
