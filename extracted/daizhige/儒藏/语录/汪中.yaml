    start_date: 1794
    highlight_event_id: guji-汪中-event-death
  decisions:
  - date: 1785
    title_zh: 不摩放欧曾王苏不貌奇傀
    rationale: 流衍于豪素而根于经史，渊雅醇茂方能卓尔不群
  - date: 1790
    title_zh: 以经义养文气以考证为依据
    rationale: 酝酿者厚则神与之合，片言只字皆可为世宝
events:
- id: guji-汪中-event-birth
  date: 1745
  year_of: 1745
  title_zh: 生于江都
  description_zh: 清乾隆十年生于江都，名中，字容甫，才卓识高，孝亲笃友
- id: guji-汪中-event-jingxue
  date: 1787
  year_of: 1787
  title_zh: 撰释三九释阙明堂通释等经解
  description_zh: 释曟曑释阙释三九上中下明堂通释释媒氏，周官左氏荀子贾谊皆有表章，振烦袪惑得其会通
- id: guji-汪中-event-guwen
  date: 1790
  year_of: 1790
  title_zh: 成哀盐船文广陵对黄鹤楼铭
  description_zh: 合汉魏晋宋作者而铸一家，渊雅醇茂，当世最称颂，贯穿经史而流衍豪素
- id: guji-汪中-event-death
  date: 1794
  year_of: 1794
  title_zh: 以病殁于宦游之前
  description_zh: 清乾隆五十九年以病殁，王念孙忆其直谅多闻古之益友，后其子喜孙携述学已刻未刻数十篇索叙于嘉庆乙亥
