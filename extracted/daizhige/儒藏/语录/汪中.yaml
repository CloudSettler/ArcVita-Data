  era: 清
  reign_ref: 乾隆
  archetype: 考据经师兼古文大家
  dilemmas:
  - 说经病凿空与株守之陋何以振烦袪惑而得会通
  - 为文袭欧曾王苏之迹与貌为奇傀失真何以合汉魏晋宋而自成一家
  lesson: 通其语言则不胶其文字，知其意则不疑其言，贯穿经史而酝酿者厚
  summary_first_person: 我是江都汪中，字容甫，与王念孙以古学相砥砺，讨论经史而疏发纲维，合汉魏晋宋而为古文，著述学内外篇以表章经传，虽早殁而愿后之儒林传有所稽采
  source_urls:
