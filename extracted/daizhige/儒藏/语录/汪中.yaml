    start_date: 1785
    highlight_event_id: guji-汪中-event-guwen
  - key: climax
    name: 渊雅醇茂神与古合
    labels:
      zh: 自成一家
    start_date: 1790
    highlight_event_id: guji-汪中-event-guwen
  - key: closure
    name: 文集归于述学待儒林采录
    labels:
