    title_zh: 录母训附遗集卷末
    rationale: 母言虽质直颇切事理欲使后人知家法有素贤母造就不虚
  - date: 1645-09
    title_zh: 临难谕妻茅氏及女宝德从容就死
    rationale: 平日以名教相砥砺故能临难不苟免全节以显母教之成
