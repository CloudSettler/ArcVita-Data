  decisions:
  - date: 1525
    title_zh: 应诏辑帝王德政之要
    rationale: 嘉靖四年诏撮经史有关德政者直解进览，遂采五经诸子史及祖宗格言大训疏解成帙以助圣学日新
  - date: 1528-06-01
    title_zh: 以南京吏部右侍郎进百卷
    rationale: 以格物为诸条统摄枢纽，随事体认合孔门一贯，欲效愚于圣德而裨涓埃，故冒位远言亲之嫌而进表
- id: guji-湛若水-endeavor-2
  title_zh: 甘泉讲学立随处体认之教
  summary: 弘治进士历翰林讲官及南京礼吏兵部尚书，倡随处体认天理，主盟岭南，与王阳明并称，教人寡欲养知以扩良知。
  phases:
