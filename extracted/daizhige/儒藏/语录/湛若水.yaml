  decisions:
  - date: 1515
    title_zh: 主随处体认以别良知现成
    rationale: 谓心无事不包，须于意心身家国天下事上至其理，知止定静安虑相承，方为知行并进之实
  - date: 1528
    title_zh: 以讲官旧忝而忠爱劝学
    rationale: 位有崇卑而臣子心一，欲以平生格物之学开发聪明扩充良知，为祖述宪章之一助
