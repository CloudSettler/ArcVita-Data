  - date: '1524'
    title_zh: 率德约礼振颓习
    rationale: 一月陈大纲三月举众务，先正身而后正天下国家。
  - date: '1525'
    title_zh: 先出训规后出樵语
    rationale: 以大科训规知新明论二礼为序，终以樵语示精要，使博约一体。
events:
- id: guji-湛若水-event-birth
  date: '1466'
  year_of: 1466
  title_zh: 生于番禺
  summary: 明成化二年生于广东番禺，号甘泉，后从陈白沙游。
- id: guji-湛若水-event-xiqiao
  date: '1517'
  year_of: 1517
  title_zh: 西樵设教门人录语
  summary: 居西樵讲学，论一本敬德道器一体，门人沈珠等记录成樵语。
- id: guji-湛若水-event-nanyong
  date: '1524'
  year_of: 1524
  title_zh: 主南雍刊布樵语
  summary: 嘉靖甲申主南京国子监教事，开讲院馆，出大科训规二礼训测及樵语并刊行。
- id: guji-湛若水-event-death
  date: '1560'
  year_of: 1560
  title_zh: 卒于甘泉
  summary: 明嘉靖三十九年卒，一生以敬为教，以礼成化，甘泉之学大行。
