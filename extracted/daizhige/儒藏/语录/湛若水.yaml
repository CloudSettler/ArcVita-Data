  lesson: 万变万化只在一德一心，随处体认，存存不息，由成德而致治。
  summary_first_person: 吾乃岭海鲰儒，旧忝翰林末品，以三十余年力学，自谓不诡圣贤中路，下契程张，于南京职务之暇搜罗五经诸子及祖宗格言，编摩四载成圣学格物通百卷，于嘉靖七年六月初一日进献，愿圣明由格物以贯意心身家国天下之治。
