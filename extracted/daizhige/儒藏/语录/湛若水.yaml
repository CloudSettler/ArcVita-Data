- id: guji-湛若水-endeavor-1
  title_zh: 编摩圣学格物通百卷进献
  summary: 体仿大学衍义，以格物统摄诚意正心修身齐家治国平天下，杂引诸儒参以祖训而发明己意，于嘉靖七年进表。
