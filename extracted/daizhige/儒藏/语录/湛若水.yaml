  - date: '1517'
    title_zh: 居西樵设教讲心性
    rationale: 以敬尽心知性知天，令学者大其心而不迁就外物。
  - date: '1520'
    title_zh: 任门人记录讲语
    rationale: 循循善诱，存授受之真，使一本敬德之旨不失。
- id: guji-湛若水-endeavor-2
  title_zh: 南雍主教振颓兴礼
  summary: 嘉靖甲申主南雍教事，开讲院辟观光馆，出训规明论二礼及樵语以广教。
