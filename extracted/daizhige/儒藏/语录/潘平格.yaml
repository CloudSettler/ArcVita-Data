  death_date: '1677'
  era: 明末清初
  reign_ref: 明熹宗天启至清圣祖康熙
  archetype: 求仁体道者
  dilemmas:
  - 程朱王罗老庄禅皆不合孔孟，真学脉何在
  - 明明德于天下之大愿与世俗纠缠埋没本性之忧如何两全
  lesson: 格通人我强恕反求以复浑然天地万物一体之仁
  summary_first_person: 余慈溪潘平格，字用微，幼奉祖母至孝，十七立必为圣贤之志，遍参程朱王罗老庄禅皆不合，惭痛参求四十日，三十八岁冬十月亲证浑然天地万物一体，始知孔曾一贯即强恕求仁，格物即格通身家国天下，著求仁录以明道
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E6%BD%98%E5%AD%90%E6%B1%82%E4%BB%81%E5%BD%95%E8%BE%91%E8%A6%81.html
