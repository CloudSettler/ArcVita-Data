endeavors:
- id: guji-潘平格-endeavor-1
  title_zh: 遍参诸家亲证一体
  summary_zh: 自豪杰自命至遍学程朱王罗老庄禅，惭痛参求，亲证浑然一体，立明明德于天下之宗
  phases:
  - key: brewing
    name: 豪杰自命立圣贤志
    labels:
      zh:
      - 立志
      - 孝养
    start_date: '1626'
    highlight_event_id: guji-潘平格-event-vow
  - key: breakthrough
    name: 遍从事程朱王罗二氏
    labels:
      zh:
      - 参学
      - 辨脉
    start_date: '1630'
    highlight_event_id: guji-潘平格-event-study
  - key: climax
    name: 惭痛交迫亲证一体
    labels:
      zh:
      - 证道
      - 一贯
    start_date: 1647-10
    highlight_event_id: guji-潘平格-event-awakening
  - key: closure
    name: 立明明德天下之欲
    labels:
      zh:
      - 立宗
      - 格物
    start_date: '1648'
    highlight_event_id: guji-潘平格-event-awakening
  decisions:
  - date: '1630'
    title_zh: 从事程朱之学
    rationale: 恐世俗纠缠埋没本性，欲求圣贤实学，先从乡里所传程朱入手
  - date: '1635'
    title_zh: 转参王罗老庄禅学
    rationale: 验程朱不合孔孟，又恐王罗二氏亦偏，故遍参以究真伪
  - date: 1647-10
    title_zh: 直认浑然一体为孔孟真传
    rationale: 竭力参求后当下亲证天地万物一体，知强恕反求即格物致知，不复疑宋元明诸儒
- id: guji-潘平格-endeavor-2
  title_zh: 著求仁录授徒传道
  summary_zh: 体认亲切笃志力行，保任缉熙，著求仁录道录四书发明等书，手授高第颜长文，托毛文强郑性刊行
  phases:
  - key: brewing
    name: 体认亲切笃志力行
    labels:
      zh:
      - 存养
      - 力行
    start_date: '1648'
    highlight_event_id: guji-潘平格-event-awakening
  - key: breakthrough
    name: 笔之于书剖析精微
    labels:
      zh:
      - 著述
      - 求仁
    start_date: '1650'
    highlight_event_id: guji-潘平格-event-writing
  - key: climax
    name: 授徒颜长文付全稿
    labels:
      zh:
      - 授徒
      - 付托
    start_date: '1675'
    highlight_event_id: guji-潘平格-event-writing
  - key: closure
    name: 辑要刊行昌明其道
    labels:
      zh:
      - 刊行
      - 传道
    start_date: '1717'
    highlight_event_id: guji-潘平格-event-publish
  decisions:
  - date: '1650'
    title_zh: 著求仁录十卷明格物宗旨
    rationale: 以格通身家国天下释格物，以扩充四端释致知，抉千圣不传之秘，恐久而湮没
  - date: '1675'
    title_zh: 以平生著述手授颜长文
    rationale: 一时同人缠于举业拘于集注，无可与言者，故托高第保守全书以待后兴
events:
- id: guji-潘平格-event-birth
  kind: birth
  title_zh: 生于慈溪文溪潘氏
  date: '1610'
  year_of: 1610
  place_zh: 宁波府慈溪县文溪
  description_zh: 祖为宋将潘美之弟后，幼端重不嬉戏，早失怙恃，奉事祖母极孝
- id: guji-潘平格-event-vow
  kind: career
  title_zh: 十七立必为圣贤之志
  date: '1626'
  year_of: 1626
  place_zh: 慈溪
  description_zh: 以豪杰自命，谓忠孝节义优为之，自叹岂不能为孔孟，思入山学道以避世俗纠缠
- id: guji-潘平格-event-study
  kind: career
  title_zh: 遍学程朱王罗老庄禅
  date: '1630'
  year_of: 1630
  place_zh: 慈溪
  description_zh: 二十岁从事程朱，越五年从事王罗，后从事老庄半载禅学二年，皆验其不合孔孟
- id: guji-潘平格-event-awakening
  kind: career
  title_zh: 三十八岁冬亲证浑然一体
  date: 1647-10
  year_of: 1647
  place_zh: 慈溪
  description_zh: 惭痛交迫四十日如一日，当下知孔曾一贯，知佛老程朱王罗之异，立明明德于天下之欲，以强恕反求释格物致知
- id: guji-潘平格-event-writing
  kind: career
  title_zh: 著求仁录诸书授颜长文
  date: '1675'
  year_of: 1675
  place_zh: 慈溪
  description_zh: 著求仁录十卷道录十卷四书发明六卷孝经发明二卷等，对同尧舜禹汤文武周孔颜曾思孟若合符节，将没手授高第颜长文
- id: guji-潘平格-event-publish
  kind: career
  title_zh: 毛文强郑性辑刊求仁录辑要
  date: '1717'
  year_of: 1717
  place_zh: 宁波并都门
  description_zh: 毛文强因万季野得书嗜之，从颜长文求全书集录，携入都门，郑性读而心契，康熙丁酉镌行于世
- id: guji-潘平格-event-death
  kind: death
  title_zh: 卒于慈溪
  date: '1677'
  year_of: 1677
  place_zh: 慈溪
  description_zh: 保任缉熙无少间断有年而没，门人在昆山者尚守师说，裔孙楷录府志隐逸传存其概
