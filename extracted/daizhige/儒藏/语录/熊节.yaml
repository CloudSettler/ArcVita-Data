  lesson: 守师说而不敢为高论采群言以存旧观编书惠后守邑行实德
  summary_first_person: 吾建阳熊节字端操早受业朱子之门惧圣远言湮道统散佚遂采摭濂溪明道伊川康节横渠涑水及杨罗范吕蔡黄张胡真诸贤遗文分类编次为性理群书后官至通直郎知闽清县事惟愿后学由布帛菽粟之言得圣贤之实
