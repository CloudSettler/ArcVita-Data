  - date: 1210
    title_zh: 特列涑水司马光以存朱子旧统
    rationale: 朱子竹林精舍从祀本有司马不敢因门户而去之故列传道支派以存道虽殊辙道则同归之义
  - date: 1222
    title_zh: 以七贤为主兼及杨罗范吕蔡黄张胡真诸家
    rationale: 主于濂洛关闽而博采近思之外文使赞训戒箴规铭诗赋序记说录辨论图略备学者可由文见道
- id: guji-熊节-endeavor-2
  title_zh: 历官通直郎知闽清县事施政教
