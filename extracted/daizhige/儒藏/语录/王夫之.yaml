  title_zh: 出生于衡州府衡阳县
  description: 万历四十七年九月初一生于湖广衡州士人之家少颖异力学经史
- id: guji-王夫之-event-xiangju
  date: 1642-08-01
  year_of: 1642
  title_zh: 崇祯十五年中湖广乡试举人
  description: 登乡举第五名以经义策论知名于楚中目击铨部督学请托之弊志在澄清吏治
- id: guji-王夫之-event-kangqing
  date: 1648-05-01
  year_of: 1648
  title_zh: 永历二年起兵衡湘扈从桂林
  description: 闻瞿式耜等守桂林毁家赀起兵授行人司行人事败流离粤湘间亲见忠臣烈妇殉难
- id: guji-王夫之-event-saoshouwen
  date: 1670-01-01
  year_of: 1670
  title_zh: 隐居湘西草堂著搔首问
  description: 于衡阳石船山湘西草堂闭户著书论思宗黄道周论学论东林卫道论滇黔廉贪论隐逸取舍以存国史之阙
- id: guji-王夫之-event-death
  date: 1692-02-18
  year_of: 1692
  title_zh: 卒于湘西草堂
  description: 康熙三十一年正月初二卒于衡阳忍冻忍贫二十余年著述不辍遗稿付门人藏之
