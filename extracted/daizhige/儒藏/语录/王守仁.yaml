      raw: 明嘉靖七年十一月二十九卒于南安
  birth_date: 1472-10-31
  death_date: 1529-01-09
  era: 明代
  reign_ref: 成化至嘉靖
  archetype: 心学宗师
  dilemmas:
  - 知行分隔之惑，如何在事物相接与未接时皆有着落而不落空言
  - 胜心与谦虚之辨，如何去胜心以全孝敬恭信仁慈之道
  - 三教分争与名利之偏，如何去藩篱而复天下同风之一家
  lesson: 谨独以存致良知，在事上磨练，去胜心存谦虚，方能为天地立心为生民立命
  summary_first_person: 我是王守仁，字伯安，号阳明，余姚人，龙场悟得心即理，一生只指点学者是良知，教人信得及，真切用功，慎独集义，事上磨练，去胜心而归谦虚，与天地万物为一体，晚年聚讲越城稽山，望同志相聚相磨，学有日新
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E7%A8%BD%E5%B1%B1%E6%89%BF%E8%AF%AD.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E7%A8%BD%E5%B1%B1%E6%89%BF%E8%AF%AD.md
endeavors:
- id: guji-王守仁-endeavor-1
  title_zh: 创立致良知心学并稽山越城讲学
  summary: 由龙场悟道立心即理，倡知行合一，晚年拈出致良知，聚徒越城稽山，以谨独慎独为要，答问四方学者而成稽山承语
  phases:
  - key: brewing
    name: 龙场悟道立心即理
    labels:
      zh: 谪居龙场
    start_date: 1508-03-01
    highlight_event_id: guji-王守仁-event-longchang
  - key: breakthrough
    name: 知行合一倡学贵阳
    labels:
      zh: 知行合一
    start_date: 1510-01-01
    highlight_event_id: guji-王守仁-event-longchang
  - key: climax
    name: 越城稽山指点良知
    labels:
      zh: 致良知讲席
    start_date: 1527-07-01
    highlight_event_id: guji-王守仁-event-jishan
  - key: closure
    name: 嘱托真切用功相传
    labels:
      zh: 宗风永传
    start_date: 1528-01-01
    highlight_event_id: guji-王守仁-event-jishan
  decisions:
  - date: 1508-03-01
    title_zh: 龙场静悟立心即理之宗
    rationale: 格物穷理不通，惟反求本心，悟道无形体而万象皆其形体，心外无理无物，以此为学之头脑
  - date: 1527-07-01
    title_zh: 越城只指点良知不尚多言
    rationale: 四方学者求伸其说而不肯虚心易气，故不与多辨，只令人信得及良知，日用间慎独集义，必有事焉
- id: guji-王守仁-endeavor-2
  title_zh: 经略赣闽平宸濠思田之功
  summary: 以爱民保赤为心，提督南赣平横水桶冈三浰，迅平宁王宸濠之乱，晚年再平思恩田州，皆以良知之学见之于用
  phases:
  - key: brewing
    name: 南赣抚剿立保甲爱民
    labels:
      zh: 赣南经营
    start_date: 1516-01-01
    highlight_event_id: guji-王守仁-event-pingning
  - key: breakthrough
    name: 横水桶冈断藤峡勘定
    labels:
      zh: 剿抚并用
    start_date: 1517-10-01
    highlight_event_id: guji-王守仁-event-pingning
  - key: climax
    name: 奋起勤王平定宸濠
    labels:
      zh: 勤王讨逆
    start_date: 1519-07-01
    highlight_event_id: guji-王守仁-event-pingning
  - key: closure
    name: 再出平思田功成身退
    labels:
      zh: 思田底定
    start_date: 1527-11-01
    highlight_event_id: guji-王守仁-event-jishan
  decisions:
  - date: 1519-07-15
    title_zh: 起兵勤王直捣南昌以解宸濠之围
    rationale: 以主意坚定爱民为心，不逆诈亿不信，乘虚捣巢以破逆谋，乃以良知之明断行之于事
  - date: 1521-01-01
    title_zh: 功成不居仍以讲学化众
    rationale: 登山一步只在此心，登高不在意先在顶，治事治心一也，故归而与诸友歌诗投壶，位天地育万物
events:
- id: guji-王守仁-event-birth
  date: 1472-10-31
  year_of: 1472
  title_zh: 余姚出生
  description: 明成化八年九月三十生于浙江余姚，名守仁，字伯安，后号阳明
- id: guji-王守仁-event-longchang
  date: 1508-03-01
  year_of: 1508
  title_zh: 谪龙场悟心即理
  description: 谪居贵州龙场，穷格物之说不通，忽悟心即理之旨，立圣学宗要，后讲知行合一于贵阳
- id: guji-王守仁-event-pingning
  date: 1519-08-28
  year_of: 1519
  title_zh: 平定宁王宸濠之乱
  description: 宸濠反于南昌，起兵吉安，攻复南昌，决战鄱阳湖，擒宸濠，勘定大乱，以功封新建伯
- id: guji-王守仁-event-jishan
  date: 1527-07-01
  year_of: 1527
  title_zh: 越城稽山聚讲成承语
  description: 丁亥聚徒越城，会友登香炉峯论一步工夫，答谦虚胜心、四句教、举业、责善诸问，朱得之追记为稽山承语
- id: guji-王守仁-event-death
  date: 1529-01-09
  year_of: 1529
  title_zh: 病逝南安
  description: 平思恩田州凯旋，嘉靖七年十一月二十九病逝于江西南安舟中，遗言此心光明
