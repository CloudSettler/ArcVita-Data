      - 缺漏无归
    start_date: 1500
    highlight_event_id: guji-王守仁-event-gezhu
  decisions:
  - date: 1487
    title_zh: 对竹格物穷物理之终
    rationale: 姑放先儒说而实验格致茫然无得遂疑此路非入圣之门
  - date: 1500
    title_zh: 暂习老释求径捷
    rationale: 儒说纷扰疲薾无入而老释欣然有会然措之日用缺漏故终须别求
