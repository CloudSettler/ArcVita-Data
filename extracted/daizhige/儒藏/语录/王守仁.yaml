    name: 龙场大悟
    labels:
      zh:
      - 龙场悟道
      - 致良知
    start_date: 1508
    highlight_event_id: guji-王守仁-event-longchang
  - key: closure
    name: 传习示学
    labels:
      zh:
      - 传习讲学
      - 遗言付门人
    start_date: 1520
    highlight_event_id: guji-王守仁-event-chuanxi
  decisions:
  - date: 1508
    title_zh: 认良知为头脑用功处
    rationale: 向外求讨无穷须向头脑勘破持正念致良知方有下落
  - date: 1527
    title_zh: 采录朱子晚年定论以证同源
    rationale: 喜己学与晦翁晚悟同而中年旧本误人故示同志以明圣学一源
