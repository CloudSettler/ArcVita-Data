endeavors:
- id: guji-王守仁-endeavor-1
  title_zh: 早年求圣格竹之困
  description: 十五六岁志圣学苦格致无入格竹致疾转习举业又究老释
  phases:
  - key: brewing
    name: 立志求圣
    labels:
