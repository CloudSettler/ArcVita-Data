    title_zh: 格物从朱无极从陆
    rationale: 平心静气久之是非判然贤者之异无害其为同故两贤折衷
  - date: 1676
    title_zh: 指斥祸首论与真赃论为太过
    rationale: 先朝之乱归罪阳明无极出老谓周子实犯皆词气偏激故不取
