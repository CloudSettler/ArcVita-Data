      zh: 易稿
    start_date: 1705
    highlight_event_id: guji-王植-event-juren
  - key: climax
    name: 辛丑京邸就录本速成
    labels:
      zh: 成书
    start_date: 1721
    highlight_event_id: guji-王植-event-book
  - key: closure
    name: 作臆说十七条总纲
    labels:
      zh: 总括
    start_date: 1721
    highlight_event_id: guji-王植-event-book
  decisions:
  - date: 1705
    title_zh: 存旧说什五六而自出心悟
    rationale: 晓披夜诵朝信暮疑，不执程朱绪余以合张子，还张子之说于张子
  - date: 1721
    title_zh: 就陈蜚英录本速成覆校
    rationale: 说书欲莹白如话详明晓畅，与家弟家君三阅月覆校决大义以便初学
- id: guji-王植-endeavor-2
  title_zh: 出守邳州兼治经世之学
  summary: 由进士出为邳州知州，以穷理格物之功推于政教，另著皇极经世解
  phases:
  - key: brewing
    name: 南宫登第入仕
    labels:
      zh: 入仕
    start_date: 1721
    highlight_event_id: guji-王植-event-jinshi
  - key: breakthrough
