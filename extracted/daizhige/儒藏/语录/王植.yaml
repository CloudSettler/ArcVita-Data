  - 尊程朱绪论与还张子本意之间如何持平以破门户之见
  - 踵训诂旧习与自出心悟之间如何守平实不蹈新奇纤巧
  lesson: 涵泳白文合观前后，分别读之不宜横生訾议，以平实求精理
  summary_first_person: 余家世读书，未尝就外傅，幼从家君先大父授经，苦正蒙难读，积二十余载一再易稿而后汇次十七卷，聊备初学一义
