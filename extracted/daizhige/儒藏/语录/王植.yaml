  - key: closure
    name: 著皇极经世解别著录
    labels:
      zh: 述作
    start_date: 1735
    highlight_event_id: guji-王植-event-magistrate
  decisions:
  - date: 1730
    title_zh: 以濂洛关闽传圣人之意裨身心
    rationale: 注疏仅诠圣人之言，欲以穷理之准的正人心息邪说
  - date: 1735
    title_zh: 别著皇极经世解发明象数
    rationale: 正蒙规模大取精多，以经世之学足其脩齐治平礼乐政教之用
events:
- id: guji-王植-event-birth
  date: 1682
  year_of: 1682
  title_zh: 生于直隶深泽
  description: 家世读书，从家君先大父授四子孝经太极通书西铭继以正蒙
- id: guji-王植-event-juren
  date: 1705
  year_of: 1705
  title_zh: 乙酉乡荐
  description: 康熙四十四年乙酉举于乡，洊历四方获与贤士游，时时以正蒙为志
- id: guji-王植-event-jinshi
  date: 1721
  year_of: 1721
  title_zh: 辛丑成进士携稿入京
  description: 康熙六十年辛丑春登南宫，同年生陈蜚英见其稿嗜之手写成册
- id: guji-王植-event-book
  date: 1721
  year_of: 1721
  title_zh: 正蒙初义十七卷告成
  description: 列程朱诸说采张子经学理窟语录拾遗附录，各以己见参订作臆说十七条
- id: guji-王植-event-magistrate
  date: 1730
  year_of: 1730
  title_zh: 知邳州并著皇极经世解
  description: 出为邳州知州，以邳州知州王植撰正蒙初义，另有皇极经世解别著录
- id: guji-王植-event-death
  date: 1762
  year_of: 1762
  title_zh: 卒于乾隆年间
  description: 没后四库馆臣纪昀等提要称其持平破门户辨析不苟，乾隆四十四年恭校上
