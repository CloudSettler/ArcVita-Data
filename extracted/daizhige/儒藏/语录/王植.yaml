endeavors:
- id: guji-王植-endeavor-1
  title_zh: 汇次正蒙初义十七卷
  summary: 集高攀龙徐德夫冉觐祖李光地张伯行诸说，附经学理窟语录拾遗，以己见参订发明太虚三层之旨
  phases:
