endeavors:
- id: guji-王艮-endeavor-1
  title_zh: 师事阳明发明安身格物之学
  summary_zh: 自奋灶户往江西拜阳明，悟致良知而进揭止至善安身说，立身为本以会通大学中庸
  phases:
  - key: brewing
    name: 安丰自奋寻道
    labels:
      zh:
      - 自学
    start_date: 1505
    highlight_event_id: guji-王艮-event-birth
  - key: breakthrough
    name: 江西拜师悟道
    labels:
      zh:
      - 拜师
    start_date: 1521
    highlight_event_id: guji-王艮-event-meet
  - key: climax
    name: 拈出安身立本
    labels:
      zh:
      - 立宗
    start_date: 1524
    highlight_event_id: guji-王艮-event-anshen
  - key: closure
    name: 语录印证成学
    labels:
      zh:
      - 成学
    start_date: 1530
    highlight_event_id: guji-王艮-event-anshen
  decisions:
  - date: 1521
    title_zh: 往江西拜王守仁为师
    rationale: 自负豪杰而往质所学，闻致良知之教心服，遂执弟子礼以定圣学根基
  - date: 1524
    title_zh: 以止至善为安身别于师说
    rationale: 悟身为天下国家之本，本立而末治，故立安身立本之极以补发明
- id: guji-王艮-endeavor-2
  title_zh: 泰州讲学开宗淑百姓日用
  summary_zh: 不以科举仕进为归，布衣讲学容教天下，以百姓日用条理为圣人条理，开泰州学派
  phases:
  - key: brewing
    name: 还乡省亲讲习
    labels:
      zh:
      - 归里
    start_date: 1522
    highlight_event_id: guji-王艮-event-meet
  - key: breakthrough
    name: 淮南格物会讲
    labels:
      zh:
      - 会讲
    start_date: 1528
    highlight_event_id: guji-王艮-event-teach
  - key: climax
    name: 泰州立社传道
    labels:
      zh:
      - 开宗
    start_date: 1532
    highlight_event_id: guji-王艮-event-teach
  - key: closure
    name: 遗教付门人
    labels:
      zh:
      - 付托
    start_date: 1540
    highlight_event_id: guji-王艮-event-death
  decisions:
  - date: 1528
    title_zh: 定布衣讲学不以仕为学
    rationale: 以政为学最难莫若且做学而后入政，故处以师天下万世而不失本
  - date: 1532
    title_zh: 以百姓日用立教容教天下
    rationale: 圣人之道无异百姓日用，包蒙容众方能教众，故开泰州之风使愚夫愚妇皆可知行
events:
- id: guji-王艮-event-birth
  date: 1483
  year_of: 1483
  title_zh: 生于泰州安丰场
  description_zh: 明成化十九年生于泰州灶户之家，早岁经商奉亲而志于学
- id: guji-王艮-event-meet
  date: 1521
  year_of: 1521
  title_zh: 江西拜王守仁为师
  description_zh: 正德十六年往江西谒阳明，阳明与语大悦，授致良知之学，赠字汝止
- id: guji-王艮-event-anshen
  date: 1524
  year_of: 1524
  title_zh: 发明止至善安身说
  description_zh: 于大学止至善中拈出安身之义，以身为本立天下大本，会通中庸位育之功
- id: guji-王艮-event-teach
  date: 1532
  year_of: 1532
  title_zh: 泰州讲学开泰州学派
  description_zh: 还泰州聚徒讲学，以百姓日用即道教化愚夫愚妇，从游者众遂开泰州一脉
- id: guji-王艮-event-death
  date: 1541
  year_of: 1541
  title_zh: 卒于泰州
  description_zh: 明嘉靖十九年卒，门人辑其语为王心斋语录上下传世
