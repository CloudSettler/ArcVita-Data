    start_date: 1519-06-01
    highlight_event_id: guji-王阳明-event-pingfan
  - key: climax
    name: 樵舍擒宸濠定江西
    labels:
      zh: 平定宸濠
    start_date: 1519-08-20
    highlight_event_id: guji-王阳明-event-pingfan
  - key: closure
    name: 功成被谗归姚讲学
    labels:
      zh: 归隐传道
    start_date: 1521-10-01
    highlight_event_id: guji-王阳明-event-jiangxue
  decisions:
  - date: 1519-07-13
    title_zh: 举兵勤王不待命而动
    rationale: 以诚孝纯乎天理之心发为忠义，随机应变如明镜照物
  - date: 1519-08-20
    title_zh: 存天理去人欲以断军政
    rationale: 以良知为主不预讲求而应变不穷，削繁文务实行以安百姓
events:
- id: guji-王阳明-event-birth
