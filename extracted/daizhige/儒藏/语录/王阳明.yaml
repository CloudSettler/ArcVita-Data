  title_zh: 出生于浙江余姚
  description: 成化八年九月三十生于余姚，名守仁，字伯安，号阳明
- id: guji-王阳明-event-jinshi
  type: career
  date: 1499-04-01
  year_of: 1499
  title_zh: 登进士第格竹穷理
  description: 弘治十二年举进士，格竹求理不得，反疑朱子格物旧训
- id: guji-王阳明-event-longchang
  type: career
  date: 1508-03-01
  year_of: 1508
  title_zh: 谪贵阳龙场悟心即理
  description: 以谏忤刘瑾谪龙场驿丞，处困养静大悟心即理致良知之旨
- id: guji-王阳明-event-nangan
  type: career
  date: 1516-09-01
  year_of: 1516
  title_zh: 巡抚南赣剿平匪患
  description: 提督南赣汀漳军务，剿平池仲容等，设崇文书院以教化兼施
- id: guji-王阳明-event-pingfan
  type: career
  date: 1519-08-20
  year_of: 1519
  title_zh: 平定宁王宸濠之乱
  description: 宸濠反于南昌，先生以巡抚起兵吉安，决战鄱阳樵舍擒宸濠
- id: guji-王阳明-event-jiangxue
  type: career
  date: 1521-10-01
  year_of: 1521
  title_zh: 归姚讲学录传习录
  description: 丁忧归余姚，门人徐爱陆澄辑语录为传习，明知行合一致良知
- id: guji-王阳明-event-death
  type: death
  date: 1529-01-09
  year_of: 1529
  title_zh: 卒于江西南安青龙铺
  description: 嘉靖七年奉命征思田，班师道病卒，遗言此心光明，亦复何言
