  era: 明代
  reign_ref: 成化弘治正德嘉靖
  archetype: 心学宗师兼经世名臣
  dilemmas:
  - 旧说格物穷理缠于胸中与反身实践不能合当何从
  - 知行分为两截终身讲习而不行当如何救偏补弊
  - 繁文盛而实行衰著述拟经当从简正人心还是从博逞技
  lesson: 存天理去人欲只在心上用功，知行合一方为真知，致良知以经世安民
  summary_first_person: 吾少豪迈不羁泛滥词章出入二氏，格竹穷理不得，谪居龙场处困养静乃悟心即理，悟致良知，倡知行合一，平宸濠后归姚讲学，录传习以正人心，愿学者反求诸己不狃旧闻
  source_urls:
