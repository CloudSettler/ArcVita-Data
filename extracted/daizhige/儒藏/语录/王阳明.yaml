    start_date: 1521-10-01
    highlight_event_id: guji-王阳明-event-jiangxue
  decisions:
  - date: 1508-03-01
    title_zh: 居夷处困反求诸己
    rationale: 不狃旧闻殚精竭思参互质正，信圣人之道在心不在物
  - date: 1510-06-01
    title_zh: 以知行合一破分截之病
    rationale: 对冥行妄作与悬空思索之偏，以本体合一为对病之药
- id: guji-王阳明-endeavor-2
  title_zh: 南赣军功平定宸濠
  summary: 巡抚南赣剿匪安民，临危擒宸濠，全仁孝之心于事功，功成反被谗而归讲学
  phases:
  - key: brewing
    name: 南赣剿匪安民
    labels:
      zh: 经略赣南
    start_date: 1516-09-01
    highlight_event_id: guji-王阳明-event-nangan
  - key: breakthrough
