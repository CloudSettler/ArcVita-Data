    title_zh: 直言济王之冤不避权奸
    rationale: 以安义命审轻重为出处大义宁处患难以存君臣父子之伦
  - date: 1232
    title_zh: 以经筵讲读感悟君心
    rationale: 致治之法须自格君始故以读书讲学之序进于上以期据千载而施四事
