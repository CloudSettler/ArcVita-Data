  - key: breakthrough
    name: 分经史立甲丁纲目
    labels:
      zh: 甲言情性中述治道末言出处
    start_date: 1215
    highlight_event_id: guji-真德秀-event-daxueyanyi
  - key: climax
    name: 进大学衍义于朝
