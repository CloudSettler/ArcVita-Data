    highlight_event_id: guji-真德秀-event-death
  decisions:
  - date: 1215
    title_zh: 以读书记为下学上达之本
    rationale: 大学衍义已详治法故分类录自身心性命至先儒授受以便观览体用兼该
  - date: 1228
    title_zh: 先进大学衍义以陈君道
    rationale: 欲使人君格心致知以正朝廷故以乙记上卷先进而下卷俟缮写以成全书
- id: guji-真德秀-endeavor-2
  title_zh: 直谏辅政以行尊主庇民之学
  summary: 历官州郡至参知政事因济王狱上疏直谏晚年辅理宗欲复真儒之效
  phases:
  - key: brewing
    name: 登第入仕历州县
