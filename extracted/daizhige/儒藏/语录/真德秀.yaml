  - key: climax
    name: 参知政事辅理宗
    labels:
      zh: 进读经筵推行正学
    start_date: 1232
    highlight_event_id: guji-真德秀-event-canzheng
  - key: closure
    name: 病没谥文忠配享理宗庙
    labels:
