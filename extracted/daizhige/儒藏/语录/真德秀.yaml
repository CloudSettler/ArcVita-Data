    labels:
      zh:
      - 审治体
    start_date: 1234-09-14
    highlight_event_id: guji-真德秀-event-1234
  - key: closure
    name: 爱君忧国以殁谥文忠
    labels:
      zh:
      - 察民情
    start_date: 1235
    highlight_event_id: guji-真德秀-event-death
  decisions:
  - date: 1234
    title_zh: 阴切时事以立言
    rationale: 理宗多欲权幸交煽，故首崇敬畏戒逸欲，重妃匹严内治以清源。
  - date: 1234
    title_zh: 论经权实务不尚空谈
    rationale: 宰驭百职须有节次实际，故以道术人才治体民情为格致之要。
events:
