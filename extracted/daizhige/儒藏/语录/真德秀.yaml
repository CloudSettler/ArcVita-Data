  - 明心性体用之本与综理万端经权实务之辨
  - 羽翼朱熹章句而推衍为君天下律令之重
  lesson: 身为天下国家之本，正心修身始能齐家治平，格物致知必见之实行。
  summary_first_person: 吾始读大学，见本末有序先后有伦，断以为君天下之律令格例，屏居十年编摩衍义四十三卷以进，欲清出治之源，正君心肃宫闱抑权幸，体用兼全而后治平可期。
