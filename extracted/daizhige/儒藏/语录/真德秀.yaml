endeavors:
- id: guji-真德秀-endeavor-1
  title_zh: 推衍大学成大学衍义以进经筵
  summary_zh: 因大学之义而推衍之，首序次帝王为治为学，次分格物致知正心诚意修身齐家四纲四十四子目，引经参史以正君心为治平之基。
  phases:
  - key: brewing
    name: 陪讲读立志羽翼
    labels:
      zh:
      - 格物致知
    start_date: 1225
    highlight_event_id: guji-真德秀-event-1199
  - key: breakthrough
    name: 屏居编摩初成全书
    labels:
      zh:
      - 修身齐家
    start_date: 1229
    highlight_event_id: guji-真德秀-event-1229
  - key: climax
    name: 端平召对投进御览
    labels:
      zh:
      - 正心诚意
    start_date: 1234-09-14
    highlight_event_id: guji-真德秀-event-1234
  - key: closure
    name: 列儒家垂法后世
    labels:
      zh:
      - 治国平天下
    start_date: 1235
    highlight_event_id: guji-真德秀-event-death
  decisions:
  - date: 1229
    title_zh: 绍定二年成书四十三卷
    rationale: 先去有妨治平者，以六条目立治平之基，明法戒以待时而献。
  - date: 1234-09-14
    title_zh: 端平元年因召对上劄投进
    rationale: 亲政之始机不可失，附经史典训事迹以备清燕之览，补体用之学。
- id: guji-真德秀-endeavor-2
  title_zh: 立朝匡君抑权幸肃宫闱
  summary_zh: 以理学事理宗，直言正君心谨宫闱，辨人才审治体察民情，抑权臣外戚以挽元气。
  phases:
  - key: brewing
    name: 登第入仕养望州郡
    labels:
      zh:
      - 辨人才
    start_date: 1199
    highlight_event_id: guji-真德秀-event-1199
  - key: breakthrough
    name: 入侍经帷讲大学
    labels:
      zh:
      - 明道术
    start_date: 1229
