- id: guji-真德秀-event-1234
  date: 1234-09-15
  year_of: 1234
  title_zh: 端平元年投进大学衍义
  description_zh: 新除权户部尚书因召对上劄，三省奉旨疾速投进，以备理宗亲政览观。
