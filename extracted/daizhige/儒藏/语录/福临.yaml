    start_date: 1651-02-15
    highlight_event_id: guji-福临-event-progov
  - key: climax
    name: 以君道臣道体仁察微昭信知人为纲推行新政
    labels:
      zh: 推行仁政
    start_date: 1653-01-01
    highlight_event_id: guji-福临-event-compile
  - key: closure
    name: 以资政要览总结治道垂训后世
    labels:
