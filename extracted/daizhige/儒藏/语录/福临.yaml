  birth_date: 1638-03-15
  death_date: 1661-02-05
  era: 清初
  reign_ref: 顺治
  archetype: 典学求治的守成开创之君
  dilemmas:
  - 满洲旧俗与汉地经治之间何以会通为一
  - 清静无为与振饬有为之间何以持其衡
  lesson: 以经为本以史为戒，提要钩玄，使臣民共知修齐之道，乃可保邦于万年
  summary_first_person: 朕惟帝王为政贤哲修身莫不本于德而成于学，览四书五经通鉴等编得其梗概，推之十三经二十一史及诸子，采集关乎政事者为三十篇，贯以大义，加之训诂，名曰资政要览，欲使观者熟思体之，推类广之，共跻太平
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E5%BE%A1%E5%AE%9A%E8%B5%84%E6%94%BF%E8%A6%81%E8%A7%88.html
endeavors:
- id: guji-福临-endeavor-1
  title_zh: 御览经史提要钩玄撰资政要览
  summary: 览经史得梗概，定君道至爱物三十章体裁，亲加笺注，撰序颁行，使约而易明简而易阅
  phases:
  - key: brewing
    name: 典学求治览经得要
    labels:
      zh: 典学
    start_date: 1651-02-01
    highlight_event_id: guji-福临-event-ascension
  - key: breakthrough
    name: 采集群书定三十篇纲目
    labels:
      zh: 采集
    start_date: 1653-01-01
    highlight_event_id: guji-福临-event-book
  - key: climax
    name: 亲加笺注阐明圣谟
    labels:
      zh: 亲撰
    start_date: 1654-01-01
    highlight_event_id: guji-福临-event-book
  - key: closure
    name: 撰序颁行晓谕朝野
    labels:
      zh: 颁行
    start_date: 1655-02-01
    highlight_event_id: guji-福临-event-book
  decisions:
  - date: 1653-06-01
    title_zh: 定体裁仿周秦诸子镕铸经史
    rationale: 卷帙浩繁恐人一时难解难得，故记事提要纂言钩玄，萃众白为裘范六金成鼎
  - date: 1655-02-01
    title_zh: 每篇贯以大义加训诂证据
    rationale: 虑其涣而无统，故联以文词举忠孝贤良与奸贪悖乱使法戒炯然，又详证据以正人心
- id: guji-福临-endeavor-2
  title_zh: 澄叙官方敦崇世教以保邦
  summary: 鉴明季三纲沦九法斁，深知胜国之所以败，故诰诫群臣百姓，使百官禔躬饬行万姓讲让型仁
  phases:
  - key: brewing
    name: 监夏监殷察胜国之败
    labels:
      zh: 鉴戒
    start_date: 1644-11-08
    highlight_event_id: guji-福临-event-ascension
  - key: breakthrough
    name: 平章百姓协和万邦立纲
    labels:
      zh: 立纲
    start_date: 1651-02-01
    highlight_event_id: guji-福临-event-ascension
  - key: climax
    name: 丁宁诰诫阐明修齐之道
    labels:
      zh: 教喻
    start_date: 1655-02-01
    highlight_event_id: guji-福临-event-book
  - key: closure
    name: 题名资政要览期共守太平
    labels:
      zh: 保邦
    start_date: 1655-02-01
    highlight_event_id: guji-福临-event-book
  decisions:
  - date: 1651-02-01
    title_zh: 以修身齐家为大防教及臣民
    rationale: 治天下者治臣民而已，故不独为君道，更阐臣道父子夫妇兄弟之道以厚风俗
  - date: 1655-02-01
    title_zh: 示法戒兼重忠贤与奸贪
    rationale: 使朝野知所激劝，故忠臣孝子贤人良吏略举事迹，奸贪不肖悖乱亦载其内
events:
- id: guji-福临-event-birth
  date: 1638-03-15
  title_zh: 生于盛京
  description: 崇德三年正月三十日生，为太宗第九子，母为孝庄文皇后
  year_of: 1638
- id: guji-福临-event-ascension
  date: 1644-11-08
  title_zh: 定都北京即皇帝位
  description: 顺治元年定鼎燕京，颁诏天下，孜孜图治，学于古训，览四书五经通鉴等编
  year_of: 1644
- id: guji-福临-event-book
  date: 1655-02-01
  title_zh: 御撰资政要览成书颁行
  description: 顺治十二年正月撰序成书三卷三十章，自君道至爱物，大学士吕宫等恭纂，体裁仿周秦诸子而义本于经
  year_of: 1655
- id: guji-福临-event-death
  date: 1661-02-05
  title_zh: 崩于北京紫禁城
  description: 顺治十八年正月初七崩，在位十八年，传位皇三子玄烨
  year_of: 1661
