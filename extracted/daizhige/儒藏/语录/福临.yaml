  decisions:
  - date: 1653-03-01
    title_zh: 定采集政事三十篇之体例
    rationale: 卷帙浩繁恐人一时难解难得，故记事提要纂言钩玄，萃众为裘范金成鼎
  - date: 1654-08-01
    title_zh: 定每篇贯大义联文词加训诂
    rationale: 恐涣而无统，故举忠孝贤廉与奸贪悖乱使法戒炯然，旨约易明文简易阅
- id: guji-福临-endeavor-2
  title_zh: 幼冲践阼亲政图治
  summary: 六岁即位，睿王摄政，八年亲政，法天体仁，弘义敦礼，重农厚生，兴教化崇俭德，以无为致太平
  phases:
  - key: brewing
