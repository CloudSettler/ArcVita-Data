    start_date: 1655-02-06
    highlight_event_id: guji-福临-event-zizheng
  decisions:
  - date: 1651-02-15
    title_zh: 亲政后务学法古以收人心
    rationale: 帝王为政莫不本于德成于学，嘉言善行皆修己治人之方可施于今
  - date: 1655-02-06
    title_zh: 以仁义礼信教化天下
    rationale: 善御民者如御良马，除其灾致其利，不尚于威而威已有托，故布教化务迁善
events:
- id: guji-福临-event-birth
  date: 1638-03-15
  year_of: 1638
  kind: birth
  title_zh: 诞生于盛京
  description: 崇德三年二月初七，太宗第九子福临生于盛京，为孝庄文皇后所出
- id: guji-福临-event-enthroned
  date: 1643-10-08
  year_of: 1643
  kind: career
  title_zh: 幼冲即皇帝位改元顺治
  description: 崇德八年八月太宗崩，福临六岁即位，睿亲王多尔衮摄政，次年定鼎北京
- id: guji-福临-event-progov
  date: 1651-02-15
  year_of: 1651
  kind: career
  title_zh: 顺治八年正月亲政图治
  description: 摄政王既薨，亲理万机，孜孜图治，览四书五经通鉴等编得其梗概要务学为政
- id: guji-福临-event-compile
  date: 1654-06-01
  year_of: 1654
  kind: career
  title_zh: 采集经史子集编纂政要三十篇
  description: 推及十三经二十一史及不悖圣经之诸子，采集关于政事者为君道臣道父子夫妇兄弟体仁弘义等三十篇，加训诂详证据
- id: guji-福临-event-zizheng
  date: 1655-02-06
  year_of: 1655
  kind: career
  title_zh: 顺治十二年正月资政要览作序成书
  description: 以大义贯每篇，联以文词，举忠孝贤廉奸贪悖乱使法戒炯然，正月吉日作序，名曰资政要览以谆谆教喻天下
- id: guji-福临-event-death
  date: 1661-02-05
  year_of: 1661
  kind: death
  title_zh: 崩于北京养心殿
  description: 顺治十八年正月初七崩，年二十四，遗诏罪己求治，庙号世祖，葬孝陵
