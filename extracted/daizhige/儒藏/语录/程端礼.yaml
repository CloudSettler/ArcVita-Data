  - key: climax
    name: 吴陆冯诸家钞刊流布
    labels:
      zh: 诸处钞刊
    start_date: 1320
    highlight_event_id: guji-程端礼-event-spread
  - key: closure
    name: 元统三年自跋定本
    labels:
      zh: 自跋存真
    start_date: 1335-11
    highlight_event_id: guji-程端礼-event-colophon
  decisions:
  - date: 1315-08
    title_zh: 一本辅氏朱子法修成日程
    rationale: 见父兄无定见师长阿意曲徇失序欲速，子弟书无精熟悔已老，故立分年月日程限救斯弊
  - date: 1335-11
    title_zh: 历叙崇德吴氏诸本作跋
    rationale: 江浙诸处钞刊各本易混，欲存定本使本末不遗工夫有序，故详记源流
