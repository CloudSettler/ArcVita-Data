  decisions:
  - date: 1290
    title_zh: 舍陆从朱师史蒙卿
    rationale: 庆元自宋季尊陆而朱学不行，欲求明体达用正脉必从朱子，故独师史氏
  - date: 1330
    title_zh: 就衢州路教授之职
    rationale: 以师道推及郡县，使学者知德行为首经术为先，故就职劝学
