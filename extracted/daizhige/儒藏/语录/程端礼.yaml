  dilemmas:
  - 庆元尊陆九渊而朱学不行，独从朱子明体达用则孤立难容
  - 父兄师长欲速务外失序无本，子弟坐失岁月先入为主难返
  lesson: 为学当以居敬持志为本，以循序渐进熟读精思为法，本末有序则心与理浃身与道一
  summary_first_person: 余鄞人程端礼字敬叔，少颖悟纯笃即通六经大义，庆元尚陆而独从史蒙卿传朱子之指，设教乡里及门甚众，后官衢州路教授，一本辅汉卿所粹朱子读书法辑为读书分年日程，愿后学循序致精不务外为人
