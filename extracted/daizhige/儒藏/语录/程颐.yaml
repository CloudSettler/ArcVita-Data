      is_circa: true
  birth_date: '1033'
  death_date: '1107'
  era: 北宋
  reign_ref: 元祐、绍圣、大观
  archetype: 理学家
  dilemmas:
  - 应举与治学：殿试不中后不复再试，弃科举而专圣学。
  - 出仕与去就：元祐初被荐侍讲禁中，旋又罢去，不复求用。
  lesson: 治学当以圣学为己任，出处进退以理义为本。
  summary_first_person: 我名颐，字正叔，学人称我为伊川先生。早岁举进士不第，遂不复应试，专以推明治道、穷理尽性为事。元祐初，吕公著正献公与司马温公同荐，得召用侍讲禁中，旋又罢去，不复再用于朝。绍圣中贬涪州，元符间还洛，大观间卒于家。我与兄颢俱师周敦颐而自光大之，并称二程，天下学者靡然从之。
  source_urls:
  - https://www.zhonghuadiancang.com/skqszibu/tongmengxun/
