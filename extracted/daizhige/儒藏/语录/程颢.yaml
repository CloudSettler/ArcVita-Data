  dilemmas:
  - 道在己还是道外求道若外求则离道若内求又须克己复礼方能体道
  - 出仕行道还是归洛化人以法把持易以道治难直谏见黜则当以讲学修礼续其志
  - 辞章传道还是立诚传道修辞立诚方为实业空言讲习无益须敬直义方以进德
  lesson: 道即性也敬以直内义以方外存养熟后自然简易明白而易行
  summary_first_person: 吾乃河南程颢字伯淳与叔子同阐道学尝谓道即性也天德完足若有污坏则敬以治之使复如旧论仁曰得道不忧即为仁论学曰圣贤千言只欲人收放心而上达平生黜佛老之幻守孔孟之实出仕则以忠信开牖归洛则以礼教合族庶几以道治天下
  source_urls:
