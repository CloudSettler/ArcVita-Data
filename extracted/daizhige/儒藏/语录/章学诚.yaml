  dilemmas:
  - 官守学业合一古义与私门著述繁芜之衡
  - 七略古法与四部成法之间如何辨章流别
  - 考据词章与明道经世之间如何不离器以言道
  lesson: 部次所以辨章学术考镜源流必宗家法而通源委方能由委溯源以见坟籍之初
  summary_first_person: 吾生会稽少孤力学慨官师失守而私述日繁故宗刘向父子校雠之义作通义九篇原道宗刘互著别裁以辨流别庶使后人即类求书因书究学不徒为甲乙纪数之需
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E6%A0%A1%E9%9B%A0%E9%80%9A%E4%B9%89.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E6%A0%A1%E9%9B%A0%E9%80%9A%E4%B9%89.html
endeavors:
- id: guji-章学诚-endeavor-1
  title_zh: 撰述文史通义校雠通义以立辨章学术之宗
  summary: 折衷刘向七略郑樵通志之得失立原道宗刘互著别裁诸篇以明部次流别使六艺诸子各得统宗
  phases:
  - key: brewing
    name: 少力学经史有志著述
    labels:
      zh: 通经致用
    start_date: 1751-01-01
    highlight_event_id: guji-章学诚-event-1768-teacher
  - key: breakthrough
    name: 登第入史馆窥中秘藏书
    labels:
      zh: 史馆考镜
    start_date: 1778-01-01
    highlight_event_id: guji-章学诚-event-1778-jinshi
  - key: climax
    name: 讲学著书成通义之纲
    labels:
      zh: 立言通义
    start_date: 1789-01-01
    highlight_event_id: guji-章学诚-event-1796-jiaochou
  - key: closure
    name: 晚年删定以传后学
    labels:
      zh: 删定传道
    start_date: 1800-01-01
    highlight_event_id: guji-章学诚-event-death
  decisions:
  - date: 1785-01-01
    title_zh: 宗刘向七略而不泥四部成法
    rationale: 七略明官守学业合一私门流别之故四部势不能返故就四部附辨章之义以救文章日散之病
  - date: 1790-01-01
    title_zh: 立互著别裁以正著录
    rationale: 书有两用理有互通若避重复则一体不全一家不备故详略互载裁篇别出以全源委
  - date: 1796-01-01
    title_zh: 补郑樵之阙以存逸补亡
    rationale: 樵讥班固而拙于自用又未究治书法守故作校雠条理藏书诸篇以究求书以前校书以后之法
- id: guji-章学诚-endeavor-2
  title_zh: 编纂方志以践六经皆史经世致用之旨
  summary: 主修湖北通志亳州志永清县志诸书以史法修志方以地方文献补官守之阙而验文史相通之说
  phases:
  - key: brewing
    name: 馆阁纂修习史例
    labels:
      zh: 习史明例
    start_date: 1778-06-01
    highlight_event_id: guji-章学诚-event-1778-jinshi
  - key: breakthrough
    name: 出馆讲学修志四方
    labels:
      zh: 四方修志
    start_date: 1782-01-01
    highlight_event_id: guji-章学诚-event-1787-hubei
  - key: climax
    name: 主修湖北通志成一家之法
    labels:
      zh: 通志成法
    start_date: 1787-01-01
    highlight_event_id: guji-章学诚-event-1787-hubei
  - key: closure
    name: 晚岁客授以志学传人
    labels:
      zh: 授徒传志
    start_date: 1799-01-01
    highlight_event_id: guji-章学诚-event-death
  decisions:
  - date: 1782-01-01
    title_zh: 以史法修方志而不为艺文簿注
    rationale: 志即一方之史当具本纪表志传之体方能使六艺不为虚器而州县文献有所稽检
  - date: 1787-01-01
    title_zh: 接受湖北通志之聘以验所学
    rationale: 欲以平日校雠条理之法施于征文考献使书掌于官而奇邪不匿故不辞远聘以身试之
events:
- id: guji-章学诚-event-birth
  date: 1738-03-11
  year_of: 1738
  title_zh: 生于浙江会稽
  description: 乾隆三年二月初一日生于山阴会稽之家少孤力学笃志经世
- id: guji-章学诚-event-1768-teacher
  date: 1768-01-01
  year_of: 1768
  title_zh: 受业浙东师友讲论史学
  description: 游学浙东交大兴朱筠等论辨道问学之分始立六经皆史辨章学术之志
- id: guji-章学诚-event-1778-jinshi
  date: 1778-05-01
  year_of: 1778
  title_zh: 登乾隆四十三年进士入翰林
  description: 登进士授翰林院编修充国史馆纂修得窥中秘藏书而究校雠源委
- id: guji-章学诚-event-1787-hubei
  date: 1787-09-01
  year_of: 1787
  title_zh: 主修湖北通志
  description: 应毕沅之聘主修湖北通志以史馆条例搜访文献主持校雠以践治书法守之说
- id: guji-章学诚-event-1796-jiaochou
  date: 1796-01-01
  year_of: 1796
  title_zh: 撰成校雠通义九篇
  description: 折衷刘郑作校雠通义分原道宗刘互著别裁辨嫌名补郑校雠条理著录残逸藏书诸篇以明辨章流别之义
- id: guji-章学诚-event-death
  date: 1801-10-14
  year_of: 1801
  title_zh: 卒于杭州书院
  description: 嘉庆六年九月初七日卒于杭州年六十四所著文史通义校雠通义传于后世
