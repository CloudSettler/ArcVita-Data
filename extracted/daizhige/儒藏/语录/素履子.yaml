    title_zh: 以履字统摄全书
    rationale: 以易象履卦为纲援引三皇五帝至孔孟老庄事迹使道可履而行
  - date: '0750'
    title_zh: 词义平近不求高古
    rationale: 本圣贤垂训之防而归之于正不与汉魏诸子争奇以便民用
