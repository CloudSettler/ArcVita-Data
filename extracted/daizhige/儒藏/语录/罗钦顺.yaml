  title_zh: 研磨理气著困知记卫道辟佛
  summary_zh: 积数十年体认，以理一分殊明性命，著困知记续记附录，辟佛老，辩阳明良知
  phases:
  - key: brewing
    name: 初与老僧论佛恍悟虚灵
