    title_zh: 自名困知积稿成帙
    rationale: 独学无朋，病中寻绎辄记，置座间讲于同志，以求大本
  - date: 1531
    title_zh: 与守仁书辨良知辟佛
    rationale: 专以躬行实践为务，摘发理奥，痛辟空寂，以启后学
