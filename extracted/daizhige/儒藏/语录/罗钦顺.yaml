  archetype: 穷理卫道之儒
  dilemmas:
  - 心性之辨毫厘千里，如何精察道心人心不混虚灵与性理
  - 佛老禅悟与圣学易简相类，如何躬行实践不堕空寂而守礼法
  - 理气一分为二之惑未定于一，如何以理一分殊贯通天人物我
  lesson: 真积力久，格物致知，存养省察，方能立大本而达易简
  summary_first_person: 余泰和罗钦顺，字允升，号整庵，早业章句，四十始志于道，研磨体认数十年，著困知记以明性命理气，斥释氏明心之偏，辩良知之误，守程朱而求定于一
