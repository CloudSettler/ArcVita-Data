  title_zh: 与王龙溪作致知议略往复论辩
  date: '1550'
  year_of: 1550
  era: 明嘉靖
  description: 聂豹致书王龙溪，就先天后天、寂感、良知与未发之中等问题往复辩难，作致知议略， Калибра为归寂派立论。
  categories:
  - 著述
  - 思想
  participants:
  - guji-聂豹
  - 王龙溪
  quotes:
  - 来书云：寂之一字，千古圣学之宗，感生于寂，寂不离感。
  - 鄙以致虚守寂、充满乎虚灵之体为致知，感而遂通天下之故为格物。
  quote_refs:
  - 答王龙溪
  location: 书信往还
  source_refs:
