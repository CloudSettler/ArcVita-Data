  dilemmas:
  - 在王门后学中力主'归寂致知'，与王龙溪'现成良知'之说激烈论辩，坚持虚寂为未发工夫
  - 面对同门指其近于禅定虚寂，仍坚守器识与修养论立场
  lesson: 为学当收敛涵养于未发之中，不逐外感，方得圣学之根。
  summary_first_person: 我聂豹，明代学者，私淑阳明之教，主张良知须致虚守寂、从未发涵养，与王龙溪反复书信论辩致知格物之旨，晚岁以归寂之学自成一派。
  source_urls:
  - https://ctext.org/text.pl?node=&if=gb&chapter=&remap=gb
