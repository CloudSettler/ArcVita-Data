  - 抱道欲施于家国天下而卒与时违未获小试当笔之于册以居业传心
  lesson: 以敬为本主一无适涵养本原穷索义理内外一致方能居业成德
  summary_first_person: 吾弱冠奋志圣贤往游康斋吴先生之门退而藏修于家书无不读理无不穷以敬名斋恪守朱子不逾尺寸再三辨献章近禅恐其陷溺人心变乱士习道明德立无可告语遂笔之于册以居业自命终怡然自得不肯小贬以徇时
