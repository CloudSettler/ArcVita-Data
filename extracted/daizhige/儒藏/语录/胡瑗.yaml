  title_zh: 胡瑗出生
  description: 胡瑗生于北宋，约993年（一说991年），字翼之，泰州海陵人，世称安定先生。
- id: guji-胡瑗-event-1
  date: 1042
  year_of: 1042
  type: endeavor
  endeavor_id: guji-胡瑗-endeavor-1
  title_zh: 主湖州学，创湖学
  description: 安定胡先生之主湖州学也，天下之人谓之湖学，学者最盛。
- id: guji-胡瑗-event-2
  date: 1045
  year_of: 1045
  type: endeavor
  endeavor_id: guji-胡瑗-endeavor-1
  title_zh: 使学者各治一事，分居一斋
  description: 先生使学者各治一事，如边事、河事之类，各居一斋，日夕讲究，其后从学者多为时用，盖先生教人务有实效、不为虚言。
- id: guji-胡瑗-event-3
  date: 1040
  year_of: 1040
  type: endeavor
  endeavor_id: guji-胡瑗-endeavor-2
  title_zh: 厉声正徐积头容
  description: 徐积初从安定胡先生学，退而头容少偏，安定忽厉声云头容直。徐积因自思不独头容直、心亦要直，自此不敢有邪心。
- id: guji-胡瑗-event-4
  date: 1045
  year_of: 1045
  type: endeavor
  endeavor_id: guji-胡瑗-endeavor-2
  title_zh: 高弟成名
  description: 是时孙公莘老名觉、顾公子敦名临，最为高弟。
- id: guji-胡瑗-event-death
  date: 1059
  year_of: 1059
  type: death
  title_zh: 胡瑗去世
  description: 胡瑗约于1059年去世，其苏湖教法为后世学校所推崇效法。
