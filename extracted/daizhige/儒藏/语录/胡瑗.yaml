  - 教学务求实效而不为虚言，在科举浮文之风中坚持经世致用之教
  - 使学者各治一事、分斋而教，须平衡专精与博通
  lesson: 教人务有实效，不为虚言
  summary_first_person: 我主湖州学，世人称之湖学。我让学生各治一事，如边事、河事之类，分居一斋，日夕讲究，故从学者多为时用。我教人务求实效，不为虚言。
