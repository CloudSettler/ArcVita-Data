      date: '1517'
      precision: year
      is_circa: false
      raw: 明正德十二年
    death:
      date: '1585'
      precision: year
      is_circa: false
      raw: 明万历十三年
  birth_date: '1517'
  death_date: '1585'
  era: 明
  reign_ref: 嘉靖至万历
  archetype: 心学儒者
  dilemmas:
  - 良知若专认觉照则流于纵欲病物，若离觉照言天则则堕空寂，如何守本然无内外之则
  - 世儒索理于物而遗心，时儒玩良知而轻物则，如何慎独以合内外而得其中
  lesson: 慎其独知即是致良知实功，虚灵不昧处即中即仁即天则，内外合一方为真学
  summary_first_person: 仆胡直泰和人也，早岁问学于欧王罗诸公，中年历官刑部及藩臬，鞫盗而证独知之不容欺，晚归衡庐讲学著述，以独知慎独会通朱王，辨天则良知之本然，愿后学不以外求幻理，不以觉照为良知，常存虚灵以全天命
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E8%A1%A1%E5%BA%90%E7%B2%BE%E8%88%8D%E8%97%8F%E7%A8%BF.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E8%A1%A1%E5%BA%90%E7%B2%BE%E8%88%8D%E8%97%8F%E7%A8%BF.html
endeavors:
- id: guji-胡直-endeavor-1
  title_zh: 会通朱王阐发独知天则
  summary: 以独知为圣学真血脉，会朱子慎独与阳明良知，辨本然天则无内外，救重内轻外之弊
  phases:
  - key: brewing
    name: 早岁问学求独知
    labels:
      zh:
      - 问学
      - 慎独
    start_date: '1535'
    highlight_event_id: guji-胡直-event-birth
  - key: breakthrough
    name: 鞫盗证独知不欺
    labels:
      zh:
      - 独知
      - 良知
    start_date: '1555'
    highlight_event_id: guji-胡直-event-jinshi
  - key: climax
    name: 复书论辩天则良知
    labels:
      zh:
      - 天则
      - 良知
    start_date: '1570'
    highlight_event_id: guji-胡直-event-jiangxi
  - key: closure
    name: 著理问六锢明中定论
    labels:
      zh:
      - 理在人心
      - 中和
    start_date: '1577'
    highlight_event_id: guji-胡直-event-henglu
  decisions:
  - date: '1558'
    title_zh: 以独知解良知不以外求
    rationale: 独知虚灵不昧即明德天命，舍此别无源头，故立慎独为大头脑以诚意致中和
  - date: '1570'
    title_zh: 辨觉照非即良知守天则
    rationale: 能觉照者亦能作恶纵欲，故须以本然无内外之则约之，方免认狂慧苛察为良知
- id: guji-胡直-endeavor-2
  title_zh: 历官守正归隐衡庐著述
  summary: 登进士历刑部藩臬提学，以存心修身为政本，晚归衡庐精舍讲学，汇藏稿以传心性之学
  phases:
  - key: brewing
    name: 登进士入刑部
    labels:
      zh:
      - 进士
      - 刑部
    start_date: '1555'
    highlight_event_id: guji-胡直-event-jinshi
  - key: breakthrough
    name: 督学江西明心性
    labels:
      zh:
      - 提学
      - 心性
    start_date: '1570'
    highlight_event_id: guji-胡直-event-jiangxi
  - key: climax
    name: 归衡庐聚徒讲学
    labels:
      zh:
      - 讲学
      - 衡庐
    start_date: '1577'
    highlight_event_id: guji-胡直-event-henglu
  - key: closure
    name: 汇刻精舍藏稿传后
    labels:
      zh:
      - 著述
      - 传道
    start_date: '1583'
    highlight_event_id: guji-胡直-event-henglu
  decisions:
  - date: '1571'
    title_zh: 提学以存心养性为先不先物
    rationale: 穷索物理是舍本逐末，唯先正心诚意尽心性，方能上通天子下通庶人以明伦物
  - date: '1577'
    title_zh: 罢归衡庐专意著述讲学
    rationale: 出处取予须得其当，与其逐末于官守，不如守衡庐以明道心人心之辨全藏稿之托
events:
- id: guji-胡直-event-birth
  date: '1517'
  year_of: 1517
  title_zh: 生于江西泰和
  description_zh: 明正德十二年生于江西泰和，自幼笃志圣学，后师事欧阳德罗洪先
- id: guji-胡直-event-jinshi
  date: '1555'
  year_of: 1555
  title_zh: 登进士授刑部主事鞫盗证独知
  description_zh: 嘉靖三十四年登进士，授刑部主事，以独知之语感化大盗输服，益信独知不容虚假为至诚之动
- id: guji-胡直-event-jiangxi
  date: '1571'
  year_of: 1571
  title_zh: 历藩臬提学江西阐发慎独
  description_zh: 历湖广佥事广西参议江西提学福建按察使，以正心诚意为教本，复书论辩良知天则独知中和之义
- id: guji-胡直-event-henglu
  date: '1577'
  year_of: 1577
  title_zh: 归隐衡庐精舍讲学著述
  description_zh: 万历初罢归，筑衡庐精舍聚徒讲学，作理问六锢明中续问等篇，汇为衡庐精舍藏稿
- id: guji-胡直-event-death
  date: '1585'
  year_of: 1585
  title_zh: 逝世
  description_zh: 明万历十三年卒，学以独知慎独会通朱王，谓理在人心不在物，后人辑其语录为藏稿传世
