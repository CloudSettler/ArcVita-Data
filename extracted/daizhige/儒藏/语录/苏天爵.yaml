      date: '1294'
      precision: year
      is_circa: false
      raw: 元贞元年
    death:
      date: '1352'
      precision: year
      is_circa: false
      raw: 至正十二年
  birth_date: '1294'
  death_date: '1352'
  era: 元
  reign_ref: 至正
  archetype: 经世护元之文臣
  dilemmas:
  - 干戈俶扰之时，是专务军旅抑或兼修善政以养元气
  - 博采前代嘉言，是托之空言抑或见之行事以尊主庇民
  lesson: 治乱之分在所与同道与同事，干戈之际更当包荒守正以培养元气
  summary_first_person: 吾赵郡苏天爵，历御史参政，两典大藩，奉诏宣抚京畿，以护惜元气为心，至正再任江浙参政，总兵饶信之际，采经史切于治道者为治世龟鉴六纲，欲以后王嘉谟贻当世示来哲
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E6%B2%BB%E4%B8%96%E9%BE%9F%E9%89%B4.html
endeavors:
- id: guji-苏天爵-endeavor-1
  title_zh: 辑治世龟鉴六纲以立治体
  summary: 采经史百氏切于治道政要者，分治体用人守令爱民为政止盗六纲，归于培养元气
  phases:
  - key: brewing
    name: 御史持宪洗冤泽物
    labels:
