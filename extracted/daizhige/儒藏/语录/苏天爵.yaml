    labels:
      zh:
      - 为政
      - 爱民
    start_date: '1347'
    highlight_event_id: guji-苏天爵-event-xuanfu
  - key: climax
    name: 再任参政编成龟鉴
    labels:
      zh:
      - 治体
      - 用人
    start_date: 1352-01
    highlight_event_id: guji-苏天爵-event-guijian
  - key: closure
    name: 林赵作序刊行示后
    labels:
      zh:
      - 为政
      - 止盗
    start_date: 1352-02
    highlight_event_id: guji-苏天爵-event-guijian
  decisions:
  - date: 1352-01
    title_zh: 干戈俶扰中留心治理
    rationale: 妖寇自淮右延及江东之际，不专言兵，采宋以前善政嘉言，终以止盗，欲图难于易为大于细
  - date: 1352-01
    title_zh: 大旨归于培养元气
    rationale: 鉴西汉末元气先败之失，主包荒含弘而施刚果，以正大公平之体为谋国元龟
- id: guji-苏天爵-endeavor-2
  title_zh: 两拜江浙参政总兵饶信护元气
  summary: 至正七年与十二年两拜江浙参政，奉诏总兵饶信，克复一路六县，两典大藩勤于庶事
  phases:
  - key: brewing
    name: 初拜参政勤于庶事
    labels:
      zh:
      - 为政
      - 守令
    start_date: '1347'
    highlight_event_id: guji-苏天爵-event-canzheng
  - key: breakthrough
    name: 奉诏宣抚旁求民瘼
    labels:
      zh:
      - 爱民
      - 为政
    start_date: '1351'
    highlight_event_id: guji-苏天爵-event-xuanfu
  - key: climax
    name: 总兵饶信克复六县
    labels:
      zh:
      - 止盗
      - 治体
    start_date: 1352-01
    highlight_event_id: guji-苏天爵-event-raoxin
  - key: closure
    name: 退居仍讨论尊主庇民
    labels:
      zh:
      - 治体
      - 为政
    start_date: 1352-08
    highlight_event_id: guji-苏天爵-event-raoxin
  decisions:
  - date: 1352-01
    title_zh: 受诏总兵不废抚治
    rationale: 于军旅之中酌理道之中正，存大体于几微，不迎合于前，无顾虑于后，以护惜国家元气
  - date: '1347'
    title_zh: 参议政府屹然弗阿
    rationale: 持宪节以洗冤泽物为己任，知无不言，秋毫无隐，守正大之规
events:
- id: guji-苏天爵-event-birth
  date: '1294'
  year_of: 1294
  title_zh: 降生赵郡
  summary: 生于元贞元年，力学得伊洛渊源许文正之传，明体适用
- id: guji-苏天爵-event-canzheng
  date: '1347'
  year_of: 1347
  title_zh: 初拜江浙参政
  summary: 至正七年拜中奉大夫江浙等处行中书省参知政事，两典大藩勤于庶事
- id: guji-苏天爵-event-yushi
  date: '1351'
  year_of: 1351
  title_zh: 御史参议宣抚京畿
  summary: 为御史知无不言，参议政府屹然弗阿，奉诏宣抚京畿实冠诸道，旁求民瘼秋毫无隐
- id: guji-苏天爵-event-xuanfu
  date: 1351-12
  year_of: 1351
  title_zh: 宣抚京畿求民瘼
  summary: 奉诏宣抚京畿，酌理道之中正，存大体于几微，以护惜元气为心
- id: guji-苏天爵-event-guijian
  date: 1352-01
  year_of: 1352
  title_zh: 编成治世龟鉴
  summary: 至正十二年再任参政，林兴祖赵汸作序，采经史百氏分为治体用人守令爱民为政止盗六纲
- id: guji-苏天爵-event-raoxin
  date: 1352-02
  year_of: 1352
  title_zh: 总兵饶信克复六县
  summary: 妖寇延及江东，诏总兵饶信，克复一路六县，于干戈俶扰之际留心治理
- id: guji-苏天爵-event-death
  date: '1352'
  year_of: 1352
  title_zh: 卒于至正十二年
  summary: 再任江浙参政总兵之后卒，著有明臣事略文类松厅章疏诸书，治世龟鉴为本传偶遗之作
