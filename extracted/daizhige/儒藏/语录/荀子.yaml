  reign_ref: 齐宣王至楚考烈王时
  archetype: 崇礼劝学宗师
  dilemmas:
  - 性不可恃而教可恃，如何劝人舍性任学而归于礼义
  - 当世申商苛虐孙吴变诈盛行，如何羽翼六经而存孔氏之道
  lesson: 学不可以已，积善成德，化性起伪以归于礼
  summary_first_person: 吾为赵人荀况，世称荀卿，游学稷下三为祭酒，后仕楚为兰陵令，春申君死而废居著书，明周孔之教，崇礼勤学，以性恶论劝人力学成德
