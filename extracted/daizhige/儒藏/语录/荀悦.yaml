    highlight_event_id: guji-荀悦-event-hanji
  decisions:
  - date: 0198
    title_zh: 依左氏传体为汉纪
    rationale: 汉书文繁难省，欲仿编年以便省览，使帝好典籍有所通晓
  - date: '0200'
    title_zh: 文约事详不失醇正
    rationale: 原本儒术，删繁就简，存劝戒大体，以助治道
- id: guji-荀悦-endeavor-2
  title_zh: 见政移曹氏作申鉴五篇
  summary: 政体时事俗嫌杂言，辨通政体，破讖纬，明考试，先屏伪私放奢，崇农桑正俗章化秉威统法
  phases:
  - key: brewing
    name: 见政移曹氏志在献替
