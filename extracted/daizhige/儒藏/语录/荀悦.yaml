    highlight_event_id: guji-荀悦-event-shenjian
  - key: climax
    name: 申鉴五篇既成奏上
    labels:
      zh: 奏申鉴
    start_date: '0205'
    highlight_event_id: guji-荀悦-event-shenjian
  - key: closure
    name: 帝览而善之传于世
    labels:
