  dilemmas:
  - 政移曹氏而谋无所用，居侍中秘书监之位，进退两难
  - 欲献替匡正而权重在外，直言与保身难两全
  lesson: 守仁义申重政体，以著述存献替之志
  summary_first_person: 吾仲豫也，颍川人，淑之孙，爽之兄子，值汉室衰微，侍讲禁中，见政移于外，志在献替而谋无所用，乃约汉书为汉纪，又作申鉴五篇，论政体时事，以申明仁义之道
