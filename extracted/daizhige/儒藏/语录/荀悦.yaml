    start_date: '0206'
    highlight_event_id: guji-荀悦-event-shenjian
  decisions:
  - date: '0203'
    title_zh: 不直争而以著述献替
    rationale: 谋无所用则托论辨通见政体，申重仁义，冀人主览而悟之
  - date: '0205'
    title_zh: 首论屏四患崇五政
    rationale: 伪乱俗私坏法放越轨奢败制，先去患而后兴养生正俗章化秉威统法，方为政之方
