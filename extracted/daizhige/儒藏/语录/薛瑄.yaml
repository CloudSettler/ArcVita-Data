  decisions:
  - date: '1430'
    title_zh: 隨開隨錄不待成篇
    rationale: 恐不思則還塞故即錄以備省察俟正後之君子而不求文辭之工
  - date: '1450'
    title_zh: 專以小學四書為修己教人之法
    rationale: 以雅鄭之辨明淡則理存甘則欲肆故不尚浮靡而務敦實行以繼朱子之統
- id: guji-薛瑄-endeavor-2
  title_zh: 歷官持正而視民如傷
  summary: 永樂辛丑進士官至禮部右侍郎入閣預機務以法律為師以忠厚為戒安於義命而濟世安民
