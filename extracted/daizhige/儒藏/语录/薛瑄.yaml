  decisions:
  - date: '1435'
    title_zh: 書視民如傷於座側以自警
    rationale: 每欲責人念此而不敢忽深以刻薄為戒而每事從忠厚以全安民之心
  - date: '1457'
    title_zh: 以安義命即所遇為事
    rationale: 修德行義之外一聽於天不計利達故在閣務持大體而不妄動以全出處之正
events:
- id: guji-薛瑄-event-birth
  date: '1389'
  year_of: 1389
  title_zh: 生於山西河津
  description: 洪武二十二年生字德溫號敬軒河東薛氏後為河津人
- id: guji-薛瑄-event-1421-jinshi
  date: '1421'
  year_of: 1421
  title_zh: 永樂辛丑登進士第
  description: 永樂十九年中式舉進士授御史之屬始入清要日夜思念職事而自警恣肆
- id: guji-薛瑄-event-zhaji
  date: '1435'
  year_of: 1435
  title_zh: 湖南沅辰道中札記省察
  description: 自京師至沅涉名山大川觀萬物生生而默識語大莫載語小莫破之理夜就枕必思一日所行合理則安寢不合則展轉思改
- id: guji-薛瑄-event-dushulu
  date: '1455'
  year_of: 1455
  title_zh: 讀書錄及續錄大成
  description: 因程子心中有所開即便札記之語自錄隨時所得凡性命道德動靜敬獨王霸雅鄭之辨皆躬行心得而成十一卷續十二卷
- id: guji-薛瑄-event-ruge
  date: '1457'
  year_of: 1457
  title_zh: 官至禮部右侍郎入閣預機務
  description: 歷大理卿等官以持正奉公聞陞禮部右侍郎兼翰林學士入閣參預機務後致仕歸
- id: guji-薛瑄-event-death
  date: '1464'
  year_of: 1464
  title_zh: 卒贈禮部尚書諡文清
  description: 天順八年卒於家朝廷追贈禮部尚書諡文清事跡具明史本傳四庫著錄讀書錄以存其舊
