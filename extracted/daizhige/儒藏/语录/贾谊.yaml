    title_zh: 居长沙而不忘谏诤著书
    rationale: 以祸福倚伏自宽，续陈政事以待后用，全忠附之义
  - date: -122
    title_zh: 尽傅道以辅梁怀王
    rationale: 以君子慎所习为怀，欲以礼义导王保全宗室，不幸王夭则以死自咎
