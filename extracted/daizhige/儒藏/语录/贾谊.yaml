  lesson: 取与攻守不同术，仁义不行必危，安民可与为义，治安当早为之
  summary_first_person: 吾洛阳贾谊，少通诗书，年十八以能诵名，文帝召为博士迁太中大夫，痛汉室藩大礼废，上治安策陈过秦之鉴，欲众建诸侯而少其力，明等级正礼制，遭谗谪傅长沙，复傅梁怀王，怀王堕马死，吾自伤失职，岁余而终，所著新书皆安危之言也
