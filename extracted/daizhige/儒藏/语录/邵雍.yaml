  reign_ref: 元祐（卒后谥康节）
  archetype: 理学先驱·象数易学家
  dilemmas:
  - 欲传先天数学于程颐而程颐不领其意，其学卒不传
  - 面对章惇求教数学，要求其十年不仕方可学，终不轻传
  lesson: 学有渊源、推其源流远有端绪，然名师之学须择可传之人
  summary_first_person: 我名雍字尧夫，取"黎民于变时雍"之义，又谓尧当十二年之中数。我先居卫州共城，后居洛阳，取天地之中。我受学于李挺之，挺之受学于穆伯长，伯长受学于陈抟，所传先天之学具见于易图与皇极经世。程伯淳为作墓志，推其源流远有端绪。我既没，元祐间諡康节。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=童蒙训
