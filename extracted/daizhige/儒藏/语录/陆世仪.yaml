  dilemmas:
  - title_zh: 虚谈心性与践履实政之辨
    description: 世尚空谈性命清谈讲学，我当敦守礼法施行实政以砭虚骄
  - title_zh: 隐居守志与经世致用之衡
    description: 易代之后不仕而讲学著书，以思辨补苴发明内圣外王之道
  lesson: 思贵慎而辨贵明，学必归于日用践履方能扶世道人心
  summary_first_person: 余太仓陆世仪字桴亭，明亡隐居讲学，一生思辨六经四子与周程张朱之义，主敦礼法行实政，札记师友问答而成思辨录，愿学者慎思明辨笃行以弘内圣外王之道
  source_urls:
  - https://daizhige.org/sibianlujiyao.html
  - https://github.com/daizhige-org/daizhigev20-sibianlu
