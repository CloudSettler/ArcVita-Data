    title_zh: 改小学为节韵幼仪兼习礼乐
    rationale: 童子记性强而悟性弱，当即读即教知行并进以养德性气质
  - date: 1668
    title_zh: 主张兼习天文地理河渠兵法并复井田封建
    rationale: 内圣必达外王，六艺之外皆切用世，不可高谈性命无补于世
