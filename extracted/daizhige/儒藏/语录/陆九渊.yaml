  decisions:
  - date: 1160
    title_zh: 揭宇宙便是吾心
    rationale: 读书穷理反观本心，谓万物森然于方寸间，须先立大者，不逐末节支离
  - date: 1175-06
    title_zh: 鹅湖力主尊德性
    rationale: 与朱晦庵吕伯恭会鹅湖，作诗明易简与支离之分，定心学与理学分途
- id: guji-陆九渊-endeavor-2
  title_zh: 经世出仕荆门之政
  summary: 登第入仕议恢复，晚知荆门兴社仓修城备，以义公经世见实行
