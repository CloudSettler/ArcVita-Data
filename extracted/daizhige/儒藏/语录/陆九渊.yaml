  birth_date: 1139-03-26
  death_date: 1193-01-10
  era: 南宋
  reign_ref: 宋孝宗乾道至宋光宗绍熙
  archetype: 心学宗师
  dilemmas:
  - 守简易直截之本心还是逐支离繁琐之训诂，向内发明本心还是向外考索末节
  - 以经世明义公行道还是堕出世利私求解脱，儒释义利公私之辨如何立定脚跟
  lesson: 宇宙便是吾心，吾心即是宇宙，学须先立乎其大，发明本心，勿为浮论虚说与意见物欲所蔽，日用即道，易简而久大
  summary_first_person: 吾陆九渊，字子静，抚州金溪人，世称象山先生，少悟宇宙便是吾心之义，谓心即理，此理本天所与，非由外烁，主张先立其大，尊德性，斥支离训诂与佛老出世之私，曾与朱晦庵辩无极太极，又赴鹅湖之会明尊德性道问学之异，后出知荆门军，兴社仓，修城防，明义利以经世，晚筑象山精舍讲学，以发明本心为归
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E8%B1%A1%E5%B1%B1%E8%AF%AD%E8%A6%81.html
