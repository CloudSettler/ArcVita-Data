  - date: 1172
    title_zh: 对策言恢复大计
    rationale: 登进士第陈北伐恢复与君道，不为科举文饰，要以本心行实政
  - date: 1190
    title_zh: 赴荆门修城兴社仓
    rationale: 不辞边郡难治，罢 Robinson 浮费，立社仓以赈民，筑城练兵以固边，经世明义
events:
- id: guji-陆九渊-event-birth
  date: 1139-03-26
  year_of: 1139
  title_zh: 出生抚州金溪
  description: 绍兴九年生于金溪陆氏，居戾陵，少颖悟，静思宇宙本心之义
- id: guji-陆九渊-event-jinshi
  date: 1172
  year_of: 1172
  title_zh: 乾道八年登进士第
  description: 登第授调，初仕隆兴靖安主簿，授学官，讲发明本心之学，声名日起
- id: guji-陆九渊-event-ehu
  date: 1175-06
  year_of: 1175
  title_zh: 鹅湖之会辩学
  description: 会朱熹吕祖谦于信州鹅湖寺，论尊德性道问学，作诗明易简支离之分，朱陆分帜
- id: guji-陆九渊-event-xiangshan
  date: 1188
  year_of: 1188
  title_zh: 筑象山精舍讲学
  description: 归贵溪象山筑精舍，四方从学者众，语录相传，后成象山语要，明心即理敬义之旨
- id: guji-陆九渊-event-jingmen
  date: 1190
  year_of: 1190
  title_zh: 知荆门军兴政
  description: 出知荆门军，躬亲庶务，兴社仓，筑城池，访民瘼，流民归附，政声大著
- id: guji-陆九渊-event-death
  date: 1193-01-10
  year_of: 1193
  title_zh: 殁于荆门官舍
  description: 绍熙三年十二月卒于荆门任上，遗命简薄，士民巷哭，后谥文安，从祀孔庙
