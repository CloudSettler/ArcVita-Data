  decisions:
  - date: -0198
    title_zh: 以诗书对马上治天下之问
    rationale: 高祖谓马上得天下吾对马上得之宁可以马上治之当以文武圣德守之故引汤武王道以谏止霸术独任
  - date: -0196
    title_zh: 定十二篇以经艺防乱
    rationale: 秦以刑罚为巢而覆故立道基术事辅政无为等篇以仁义为巢以圣贤为杖欲使君以仁治臣以义平
- id: guji-陆贾-endeavor-2
  title_zh: 使南越南越归汉
  summary_zh: 两度出使南越说赵佗去帝号归附汉室定岭南归属全兵不血刃之功
  phases:
