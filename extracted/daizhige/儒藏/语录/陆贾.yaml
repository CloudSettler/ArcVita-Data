  decisions:
  - date: -0196
    title_zh: 单车入越以义说佗
    rationale: 赵佗拥兵自尊若以兵加之则劳费不止不如以大义陈汉德之盛与秦暴之异使其知去就之分而自归
  - date: -0179
    title_zh: 再使陈汉恩信弃前隙
    rationale: 吕后时与越有隙文帝欲修复旧好吾当捐前嫌布德怀远以安边境全君臣大义
