  summary_first_person: 吾陆贾楚之辩士也以客从高祖定天下常使诸侯既以马上治天下之辩醒高祖又著新语十二篇论王霸之道复两使南越服赵佗晚年助陈平定策诛吕迎文帝一生以口辩安邦以文义垂世
