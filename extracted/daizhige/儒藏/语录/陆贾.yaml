  person_id: guji-陆贾
  title_zh: 从汉定天下并著新语论治道
  summary: 以客从高祖屡使诸侯以马上治天下之问转汉家方向并著新语十二篇定汉初治国之本
  phases:
  - key: brewing
    name: 以客从军积口辩之名
    labels:
      zh: 从军积望
    start_date: '-209'
    highlight_event_id: guji-陆贾-event-cong-han
  - key: breakthrough
    name: 面折高祖马上治天下之言
    labels:
      zh: 转君心
    start_date: '-202'
    highlight_event_id: guji-陆贾-event-bian-zhitianxia
  - key: climax
    name: 奏新语十二篇立仁义无为之纲
    labels:
      zh: 立言定策
    start_date: '-195'
    highlight_event_id: guji-陆贾-event-xinyu
  - key: closure
    name: 封尉氏侯以文显于汉廷
    labels:
      zh: 功成名立
    start_date: '-194'
    highlight_event_id: guji-陆贾-event-xinyu
  decisions:
  - date: '-202'
    title_zh: 进说马上得之宁可马上治乎
    rationale: 以秦二世尚刑而亡与齐桓尚德而霸为鉴劝高祖反秦苛政行仁义之治
  - date: '-195'
    title_zh: 承诏著书不专任辩士之口
    rationale: 将口说之效凝为道基术事辅政无为诸篇使人君有法可守垂诸来世
- id: guji-陆贾-endeavor-2
  person_id: guji-陆贾
  title_zh: 两使南越服赵佗安边定藩
  summary: 受命赐赵佗印绶为南越王晓以汉大义使去帝号称臣再使申约守藩臣之礼
  phases:
  - key: brewing
    name: 受汉命赐印南越
    labels:
      zh: 奉命南行
    start_date: '-196'
    highlight_event_id: guji-陆贾-event-nanyue1
  - key: breakthrough
    name: 番禺折服赵佗
    labels:
      zh: 以义服夷
    start_date: '-196'
    highlight_event_id: guji-陆贾-event-nanyue1
  - key: climax
    name: 赵佗去黄屋左纛称臣奉贡
    labels:
      zh: 定藩臣礼
    start_date: '-195'
    highlight_event_id: guji-陆贾-event-nanyue1
  - key: closure
    name: 文帝时再使南越申汉约
    labels:
      zh: 重申旧好
    start_date: '-179'
    highlight_event_id: guji-陆贾-event-nanyue2
  decisions:
  - date: '-196'
    title_zh: 以汉亲喻越不以兵胁
    rationale: 以赵佗本真定人亲属在汉兼陈汉大汉方兴之势使其去僭号以保富贵
  - date: '-179'
    title_zh: 老年再冒瘴疠南行
    rationale: 以存旧恩信慰赵佗之疑绝匈奴南越之连横守汉南境安宁
- id: guji-陆贾-endeavor-3
  person_id: guji-陆贾
  title_zh: 助陈平定策诛吕迎立文帝
  summary: 高后吕氏擅权时以计授陈平周勃促其定变迎代王为帝保全刘氏社稷
  phases:
  - key: brewing
    name: 见吕氏擅权称病杜门
    labels:
      zh: 韬晦观变
    start_date: '-188'
    highlight_event_id: guji-陆贾-event-zhu-lv
  - key: breakthrough
    name: 以千金交欢绛侯助其谋
    labels:
      zh: 密授定计
    start_date: '-181'
    highlight_event_id: guji-陆贾-event-zhu-lv
  - key: climax
    name: 诸吕诛灭迎代王为文帝
    labels:
      zh: 安刘定嗣
    start_date: '-180'
    highlight_event_id: guji-陆贾-event-zhu-lv
  - key: closure
    name: 功成不受厚赏以太中大夫终
    labels:
      zh: 退守文名
    start_date: '-178'
    highlight_event_id: guji-陆贾-event-death
  decisions:
  - date: '-181'
    title_zh: 散财结绛侯促其有为
    rationale: 知陈平多谋而绛侯有勇须以外物助其交合使将相协心方能图吕
  - date: '-180'
    title_zh: 定迎立代王之议不贪立功
    rationale: 以代王仁孝宽厚有太后之子之顺可得人心以安天下不以久居权位自危
