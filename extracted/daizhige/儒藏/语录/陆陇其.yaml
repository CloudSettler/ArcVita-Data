  - key: breakthrough
    name: 洞明心性之辨识禅病源
    labels:
      zh: 明辨心性
    start_date: 1675
    highlight_event_id: guji-陆陇其-event-study-zhu
  - key: climax
    name: 作学术辨三篇力排良知
    labels:
      zh: 著述辟邪
    start_date: 1682
    highlight_event_id: guji-陆陇其-event-write-xueshubian
  - key: closure
    name: 问学录传世张伯行刊订表彰
    labels:
      zh: 正学显明
    start_date: 1690
    highlight_event_id: guji-陆陇其-event-write-xueshubian
  decisions:
  - date: 1682
    title_zh: 作辨上明道统托名之弊
    rationale: 自唐后异端托孔孟宋后托程朱必辨名同实异以遏阳尊阴篡
  - date: 1683
    title_zh: 作辨中直指知觉非性
    rationale: 心是气之精英性是心具之理以知觉为性则彝伦仁义皆障故须格物穷理
  - date: 1684
    title_zh: 作辨下论天资学术胜负
    rationale: 不因王门间有大贤而恕其学亦不因其学而弃其人以全正学人才之论
- id: guji-陆陇其-endeavor-2
  title_zh: 清官牧民守程朱遗规
  summary_zh: 康熙九年进士历嘉定灵寿知县监察御史以正学施政事崇礼教恤民隐谥清献从祀孔庙
