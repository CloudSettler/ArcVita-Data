person:
  qid: guji-陆陇其
  name_zh: 陆陇其
  names:
    zh: 陆稼书
    en: Lu Longqi
  lifespan:
    birth:
      date: 1630
      precision: year
      is_circa: false
      raw: 明崇祯三年生于浙江平湖
    death:
      date: 1692
      precision: year
      is_circa: false
      raw: 清康熙三十一年卒
  birth_date: 1630
  death_date: 1692
  era: 清
  reign_ref: 康熙
  archetype: 程朱卫道之笃行理学家
  dilemmas:
  - 尊德性与道问学何以并重而不偏废
  - 矫激清议与乡愿调停何以得中而不流于党偏
  lesson: 操存涵养以明德性之当尊，格物致知以著问学之不可废，知其所以然则守之固而化民久
  summary_first_person: 余服膺考亭，谓任心废学者必弊，故以问学名编，辨姚江金溪之失，守程朱格物主敬之实，牧民则开导使知所以然，处世则不为矫激亦不为乡愿，惟求直道可行于斯民
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E9%99%86%E7%A8%BC%E4%B9%A6%E5%85%88%E7%94%9F%E9%97%AE%E5%AD%A6%E5%BD%95.md
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E9%99%86%E7%A8%BC%E4%B9%A6%E5%85%88%E7%94%9F%E9%97%AE%E5%AD%A6%E5%BD%95.html
endeavors:
- id: guji-陆陇其-endeavor-1
  title_zh: 尊朱辟王述问学录以明正学
  goal_zh: 以考亭格物致知补姚江致良知之弊使问学并重而道统不坠
  phases:
  - key: brewing
    name: 少习考亭讲四书困勉自守
    labels:
      zh: 服膺程朱
    start_date: 1645
    highlight_event_id: guji-陆陇其-event-birth
  - key: breakthrough
    name: 登第益笃正学辨陆王异同
    labels:
      zh: 进士立志
    start_date: 1670
    highlight_event_id: guji-陆陇其-event-jinshi
  - key: climax
    name: 问学条辨成帙尊德性道问学
    labels:
      zh: 著录卫道
    start_date: 1685
    highlight_event_id: guji-陆陇其-event-wenxue
  - key: closure
    name: 门人校订伯行刊行表彰正学
    labels:
      zh: 刊行显学
    start_date: 1690
    highlight_event_id: guji-陆陇其-event-wenxue
  decisions:
  - date: 1675
    title_zh: 毅然指姚江之非以尊考亭
    rationale: 理无两是，若无格物之功，所认为本心良知未必是本心，故须存养涵养兼致知问学
  - date: 1685
    title_zh: 遵注必求所以然不徒守当然
    rationale: 知其当然不知所以然则可遵可叛，故讲仲尼焉学章必明大道即见于谟烈礼文，方能久守而不惑
- id: guji-陆陇其-endeavor-2
  title_zh: 牧嘉定灵寿以理学践躬行化民
  goal_zh: 以主敬从容剖决政务，以学校开导使民知所以然而安于直道
  phases:
  - key: brewing
    name: 杜门讲学养主敬审几集义
    labels:
      zh: 主敬养气
    start_date: 1660
    highlight_event_id: guji-陆陇其-event-jinshi
  - key: breakthrough
    name: 知嘉定县剖决精明劝学均役
    labels:
      zh: 嘉定牧民
    start_date: 1675
    highlight_event_id: guji-陆陇其-event-jiading
  - key: climax
    name: 移灵寿县化俗兴教不事牢笼
    labels:
      zh: 灵寿化俗
    start_date: 1678
    highlight_event_id: guji-陆陇其-event-jiading
  - key: closure
    name: 去官归里讲学全节以风来学
    labels:
      zh: 归里讲道
    start_date: 1685
    highlight_event_id: guji-陆陇其-event-wenxue
  decisions:
  - date: 1675
    title_zh: 遇事从容详审不以急遽处之
    rationale: 平时无主敬则临事不能虑，故入仕牧民必以敬为本，方能每事问而能虑
  - date: 1678
    title_zh: 荐贤守公议不示私恩守清议
    rationale: 但愿朝廷进用不失正人，不以术牢笼士类，忧疑之际书绅自安，不避好名之嫌而无好名之心
  - date: 1685
    title_zh: 治民开导使知所以然
    rationale: 民可由而不可使不知，若徒责当然不示所以然，则阳由阴违终归废弛，故设教浸灌务令知者常多
events:
- id: guji-陆陇其-event-birth
  title_zh: 生于浙江平湖
  date: 1630
  year_of: 1630
  place_zh: 浙江平湖
  description_zh: 明崇祯三年生，少颖敏，服膺朱子考亭之学，讲四书而笃困勉之功
- id: guji-陆陇其-event-jinshi
  title_zh: 康熙九年成进士
  date: 1670
  year_of: 1670
  place_zh: 京师
  description_zh: 康熙九年庚戌登进士第，益以程朱格物致知之说自任，辨姚江致良知任心废学之弊
- id: guji-陆陇其-event-jiading
  title_zh: 知嘉定灵寿县牧民兴教
  date: 1675
  year_of: 1675
  place_zh: 江南嘉定
  description_zh: 出知嘉定继知直隶灵寿，剖决精明，从容详审，以主敬集义为政，以学校劝谕开导民知所以然
- id: guji-陆陇其-event-wenxue
  title_zh: 问学条辨成帙讲尊德性道问学
  date: 1685
  year_of: 1685
  place_zh: 平湖里第
  description_zh: 罢官归里，论清任和三路，论善人狂狷中行，论谏法宽时婉辞，论守注求所以然，门人共校问学录以卫考亭
- id: guji-陆陇其-event-death
  title_zh: 卒于里第后学刊问学录
  date: 1692
  year_of: 1692
  place_zh: 浙江平湖
  description_zh: 清康熙三十一年卒，后仪封张伯行订校刊行问学录于榕城正谊堂，表其与考亭相表里之意
