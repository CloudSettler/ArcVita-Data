    title_zh: 赴嘉定不徇私恩兴学劝善
    rationale: 以范纯仁潘良贵为法不牢笼士以术但愿进用正人以挽风俗
  - date: 1676
    title_zh: 持濂洛关闽清议不为调停
    rationale: 惩乡愿混平等之顽钝亦戒矫激之偏以中道持风世渐导婉出
