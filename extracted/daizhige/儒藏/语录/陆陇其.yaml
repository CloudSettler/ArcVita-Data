endeavors:
- id: guji-陆陇其-endeavor-1
  title_zh: 尊朱辟王作学术辨
  summary_zh: 服膺考亭辨汉唐宋明学术源流指阳明以禅之实托儒之名阳尊阴篡致风俗坏作辨上中下以扶正学
  phases:
