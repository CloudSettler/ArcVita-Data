  - key: breakthrough
    name: 就正龙溪始得实地
    labels:
      zh:
      - 就正龙溪
    start_date: 1525
    highlight_event_id: guji-陈九川-event-conference
  - key: climax
    name: 书信辨正同门异旨
    labels:
      zh:
      - 辨正宗旨
    start_date: 1545
    highlight_event_id: guji-陈九川-event-letters
  - key: closure
    name: 以身明道归于慎独
    labels:
      zh:
      - 以身明道
    start_date: 1555
    highlight_event_id: guji-陈九川-event-death
  decisions:
  - date: 1525
    title_zh: 尽扫精思妙解从独知几微处缉熙
    rationale: 自觉见悟成象与诚意格物分作两截，故尽扫前见落实致知功夫
  - date: 1545
    title_zh: 指斥空谈本体与门户之私
    rationale: 见同志掺入意见高悬本体卑便习气，恐宗旨决裂支离，故作书辨正
- id: guji-陈九川-endeavor-2
  title_zh: 以慎独研几阐明日用实功
  summary: 主张慎独研几贯通动静，不离感应发用涵养本原，日用经纶即是实学
  phases:
  - key: brewing
    name: 体认未发之中即是良知
    labels:
      zh:
      - 体认本心
    start_date: 1525
    highlight_event_id: guji-陈九川-event-conference
  - key: breakthrough
    name: 明寂感一贯不分动静
    labels:
      zh:
      - 寂感一贯
    start_date: 1540
    highlight_event_id: guji-陈九川-event-letters
  - key: climax
    name: 以慎独研几统摄诚意格物
    labels:
      zh:
      - 慎独研几
    start_date: 1550
    highlight_event_id: guji-陈九川-event-letters
  - key: closure
    name: 归于改过迁善切实修行
    labels:
      zh:
      - 改过迁善
    start_date: 1555
    highlight_event_id: guji-陈九川-event-death
  decisions:
  - date: 1540
    title_zh: 不取涵养停当而后发中之说
    rationale: 以为离发见养本原则体用两截，非孔门格物致知宗旨
  - date: 1550
    title_zh: 以研几慎独为圣学一贯之功
    rationale: 见学者或合动静而一之或判动静而著象，故以致良知一以贯之
