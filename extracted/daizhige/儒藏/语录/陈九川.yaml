endeavors:
- id: guji-陈九川-endeavor-1
  title_zh: 守致知宗旨辨正师门流弊
  summary: 以格物为致知实下手处，批评空谈本体与各立门户之失，维护阳明正法眼藏
  phases:
  - key: brewing
    name: 初从念虑长善消恶
    labels:
