  archetype: 阳明后学中守正阐道者
  dilemmas:
  - 本体自然流行与着实格物致知如何兼顾不堕空悟
  - 恪守阳明致知宗旨与同门各立门户分歧如何抉择
  lesson: 致知必在格物实地慎独研几，不以虚见光景为得道
  summary_first_person: 吾明水陈九川，师事阳明夫子，笃信良知致知之训，三起意见而后始得实地，日以格物慎独研几为功，忧同门意见掺和致宗旨决裂，故以书信往复辨正，愿以身明道不以笔舌争是非
