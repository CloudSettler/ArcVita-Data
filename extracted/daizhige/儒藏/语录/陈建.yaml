endeavors:
- id: guji-陈建-endeavor-1
  title_zh: 著学蔀通辨明朱陆之辨
  summary: 以七年之功分前后续终四编通辨三重蔀障尊朱辟陆以卫圣学
  phases:
  - key: brewing
    name: 闻进陆议忧道发愤
    labels:
      zh: 忧道
    start_date: '1542'
    highlight_event_id: guji-陈建-event-xiezuo
  - key: breakthrough
    name: 编年考朱陆早同晚异
    labels:
      zh: 考年
    start_date: '1543'
    highlight_event_id: guji-陈建-event-xiezuo
  - key: climax
    name: 勘破象山养神禅实
    labels:
      zh: 辟禅
    start_date: '1546'
    highlight_event_id: guji-陈建-event-shucheng
  - key: closure
    name: 戊申书成垂十万言
    labels:
      zh: 成书
    start_date: '1548'
    highlight_event_id: guji-陈建-event-shucheng
  decisions:
  - date: '1542'
    title_zh: 因陆入孔庙议发愤著书
    rationale: 道统将移学脉日紊不著书辨则后学尽涂耳目故批横浦证江门详朱陆始终
  - date: '1543'
    title_zh: 决定编年属辞比事
    rationale: 近世颠倒早晚矫诬朱子晚合唯编年据文集语类年谱方昭然可破定论之诬
  - date: '1546'
    title_zh: 直指养神为儒佛纲要
    rationale: 佛老专养精神儒者养道理象山完养精神即是禅据故以后续终三编究其根本
- id: guji-陈建-endeavor-2
  title_zh: 宰闽惠政纂皇明通纪
  summary: 以进士宰南闽尽心民事暇则纂述皇明通纪以存国史以端治体
  phases:
  - key: brewing
    name: 己丑登第授官南闽
    labels:
      zh: 入仕
    start_date: '1529'
    highlight_event_id: guji-陈建-event-jinshi
  - key: breakthrough
    name: 闽中勤政体民疾苦
    labels:
      zh: 惠政
    start_date: '1530'
    highlight_event_id: guji-陈建-event-jinshi
  - key: climax
    name: 纂皇明通纪纲目国史
    labels:
      zh: 纂史
    start_date: '1555'
    highlight_event_id: guji-陈建-event-tongji
  - key: closure
    name: 通纪流行兼传蔀辨
    labels:
      zh: 传世
    start_date: '1566'
    highlight_event_id: guji-陈建-event-tongji
  decisions:
  - date: '1529'
    title_zh: 以进士就州县亲民之任
    rationale: 欲行圣贤之学必自亲民始故不辞南闽远任以践知行兼尽之教
  - date: '1555'
    title_zh: 毅然纂述皇明一代之纪
    rationale: 国史散佚是非易淆唯纲目体可明治乱以助治安故博采实录邸报成通纪之业
events:
- id: guji-陈建-event-birth
  date: '1497'
  year_of: 1497
  title_zh: 生于东莞
  description: 明弘治十年生于广东东莞清澜间颖悟好学早志圣贤
- id: guji-陈建-event-jinshi
  date: '1529'
  year_of: 1529
  title_zh: 登进士令南闽
  description: 明嘉靖八年登进士第出令福建南安诸邑勤于民事声绩著闻
- id: guji-陈建-event-xiezuo
  date: '1542'
  year_of: 1542
  title_zh: 闻陆祀孔庙发愤著辩
  description: 明嘉靖壬寅朝议进陆九渊于孔庙忧道统将移乃立志著学蔀通辨以破晚年定论之诬
- id: guji-陈建-event-shucheng
  date: '1548'
  year_of: 1548
  title_zh: 学蔀通辨书成
  description: 明嘉靖戊申孟夏阅七年著成学蔀通辨分前后续终四编垂十万言以撤丰蔀
- id: guji-陈建-event-tongji
  date: '1555'
  year_of: 1555
  title_zh: 皇明通纪成编
  description: 博采实录纂皇明通纪以纲目体存一代治乱为世所重行于世
- id: guji-陈建-event-death
  date: '1567'
  year_of: 1567
  title_zh: 卒于家
  description: 明隆庆元年卒于东莞家中蔀通辨后经黄氏顾氏诸贤刻传以卫道功传
