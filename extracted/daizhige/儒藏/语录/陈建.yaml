  - 儒佛相似养神近理当容忍还是抉蔀辟异
  lesson: 学必考实辨章早晚以真儒辟近似之禅方能撤蔀明道
  summary_first_person: 吾东莞陈建号清澜嘉靖进士令官南闽忧陆学入孔庙道统将移发愤十年著学蔀通辨以明朱陆早同晚异以判儒禅养神养理之分愿后学虚心熟察不为三重蔀障所蔽
