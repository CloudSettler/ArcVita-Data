  - key: climax
    name: 进表进序投进两宫
    labels:
      zh: 投进
    start_date: 1202
    highlight_event_id: guji-陈模-event-donggong
  - key: closure
    name: 上宰相札子申言三要
    labels:
      zh: 申义
    start_date: 1203
    highlight_event_id: guji-陈模-event-donggong
  decisions:
  - date: 1202
    title_zh: 定始生入学立教师傅讲读为首先经后史
    rationale: 以天命为重以正人经术养心术，防胡亥术数狱习之覆辙
  - date: 1203
    title_zh: 于二十条中独举择妃简僚谨习三要上宰相
    rationale: 妃嫔正家之始，宫僚朝夕移习，游习易移，故撮其最切者申言
events:
- id: guji-陈模-event-birth
  title_zh: 生于泉州永春
  date: 1170
  year_of: 1170
  place_zh: 泉州永春
  description_zh: 字中行，泉州永春人，约生于乾道晚期，生平始载于庆元进士
- id: guji-陈模-event-jinshi
  title_zh: 庆元二年登进士第
  date: 1196
  year_of: 1196
  place_zh: 临安
  description_zh: 庆元二年进士，由此入仕，为后入馆阁之阶
- id: guji-陈模-event-zhengzi
  title_zh: 嘉泰二年除秘书省正字三年兼国史院编修
  date: 1202
  year_of: 1202
  place_zh: 临安秘书省
  description_zh: 嘉泰二年为迪功郎守秘书省正字，三年兼国史院编修，始有馆阁续录可考之历官
- id: guji-陈模-event-donggong
