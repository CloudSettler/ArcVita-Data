  date: 1202
  year_of: 1202
  place_zh: 临安
  description_zh: 取经史关乎训储者汇为始生至监国二十条，厘为六卷二策，具进书表序投进，又上宰相札子申择妃简僚谨习三要
- id: guji-陈模-event-jiantao
  title_zh: 开禧三年兼实录院检讨官兼庄文府教授
  date: 1207
  year_of: 1207
  place_zh: 临安
  description_zh: 开禧三年又兼实录院检讨官，兼庄文府教授，亲近储宫讲授
- id: guji-陈模-event-xiaoshulang
  title_zh: 嘉定二年除校书郎仍兼检讨
  date: 1209
  year_of: 1209
  place_zh: 临安
  description_zh: 嘉定二年除校书郎仍兼检讨，历官始末见于馆阁续录，此后事迹失载
- id: guji-陈模-event-death
  title_zh: 卒年失载
  date: 1230
  year_of: 1230
  place_zh: 不详
  description_zh: 嘉定以后无别传，卒年卒地不详，四库提要录其书为六卷传世，宋史艺文志误作一卷
