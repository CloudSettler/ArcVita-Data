  dilemmas:
  - 博引经史旧文与切于当世训储之衡
  - 直陈择妃简僚谨习之要与全君臣进言之体之衡
  lesson: 重始生以重天命，择正人用经术以养储德，谨游习以防微杜渐。
  summary_first_person: 我字中行，泉州永春人，庆元二年登进士第，嘉泰二年除秘书省正字，兼国史院编修，开禧三年兼实录院检讨，嘉定二年除校书郎。为正字时取经史关乎训储者加以臆说，厘为二十条六卷，名曰东宫备览，投进以资储闱进修。
