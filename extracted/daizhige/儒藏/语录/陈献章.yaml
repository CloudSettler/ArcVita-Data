  birth_date: 1428
  death_date: 1500
  era: 明代
  reign_ref: 明宣德至弘治
  archetype: 主静涵养之心学先驱
  dilemmas:
  - 博览群书与舍繁求约之间何为入圣之门
  - 出仕用世与林下自得之间何以安身立命
  - 言说糟粕与默识真机之间何以传道授徒
  lesson: 舍彼之繁求吾之约，去耳目支离之用，全虚圆不测之神，静中养出端倪，随处体认天理
  summary_first_person: 仆年二十七始发奋从吴聘君学，圣贤垂训无所不讲而未知凑泊，比归白沙杜门静坐，忘寝忘食累年，久之始见心体隐然呈露，日用应酬如马御衔勒，涣然自信作圣之功在此，有学者辄教之静坐，此吾所经历实效也
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E7%99%BD%E6%B2%99%E8%AF%AD%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E7%99%BD%E6%B2%99%E8%AF%AD%E5%BD%95.md
endeavors:
- id: guji-陈献章-endeavor-1
  title_zh: 从吴康斋学而归白沙静坐悟道
  summary_zh: 年二十七游小陂从吴与弼学，尊师道勇担荷，遍讲濂洛关闽而心与理未合，归白沙杜门静坐，舍繁求约，久见心体，以静为作圣之功
  phases:
  - key: brewing
    name: 小陂从师遍讲群书
