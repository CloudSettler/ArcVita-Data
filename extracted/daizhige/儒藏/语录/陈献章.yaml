      - 静坐
    start_date: 1458
    highlight_event_id: guji-陈献章-event-wudao
  - key: climax
    name: 静久心体隐然呈露
    labels:
      zh:
      - 悟道
      - 自信
    start_date: 1464
    highlight_event_id: guji-陈献章-event-wudao
  - key: closure
    name: 以静坐教人立定宗旨
    labels:
      zh:
