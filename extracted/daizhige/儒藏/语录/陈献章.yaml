person:
  qid: guji-陈献章
  name_zh: 陈献章
  names:
    zh: 陈献章
    en: Chen Xianzhang
  lifespan:
    birth:
      date: 1428
      precision: year
      is_circa: false
      raw: 明宣德三年
    death:
      date: 1500
      precision: year
