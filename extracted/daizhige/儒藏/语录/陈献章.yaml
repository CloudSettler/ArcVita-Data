      - 传承
    start_date: 1467
    highlight_event_id: guji-陈献章-event-jiangxue
  decisions:
  - date: 1455
    title_zh: 发奋从吴聘君学
    rationale: 知圣人可学而至，欲由涵养以及致知，下学上达，日新又新
  - date: 1458
    title_zh: 舍繁求约专务静坐
    rationale: 心与理未有凑泊吻合处，惟静坐久之方见心体，随所欲如马御衔勒
- id: guji-陈献章-endeavor-2
  title_zh: 白沙讲学立岭南心学主静之教
  summary_zh: 居白沙茅屋讲学授徒，启鸢飞鱼跃勿忘勿助之旨，倡虚圆不测之神，戒慎恐惧以存不睹不闻，往来湛若水等成江门之学
  phases:
  - key: brewing
    name: 筑室白沙优游收敛
    labels:
      zh:
      - 隐居
      - 涵养
    start_date: 1458
    highlight_event_id: guji-陈献章-event-wudao
  - key: breakthrough
    name: 发明鸢飞鱼跃真机
    labels:
      zh:
      - 讲学
      - 发明
    start_date: 1467
    highlight_event_id: guji-陈献章-event-jiangxue
  - key: climax
    name: 江门授徒主张世道
    labels:
      zh:
      - 授徒
      - 主静
    start_date: 1475
    highlight_event_id: guji-陈献章-event-jiangxue
  - key: closure
    name: 语录诗文存道心普万物
    labels:
      zh:
      - 著述
      - 收束
    start_date: 1495
    highlight_event_id: guji-陈献章-event-death
  decisions:
  - date: 1467
    title_zh: 开门授徒教以静坐
    rationale: 以吾所经历粗有实效者告人，非务高虚，先据德后依仁，立本贵自然
  - date: 1475
    title_zh: 立大中以主张世道
    rationale: 道无往不在，仁无时或息，学者求诸吾心，察动静有无之机，不可偏高坏人
events:
- id: guji-陈献章-event-birth
  type: birth
  title_zh: 生于广东新会白沙里
  date: 1428
  year_of: 1428
  description_zh: 明宣德三年生于广东新会，字公甫，号石斋，后号白沙，世称白沙先生
- id: guji-陈献章-event-congxue
  type: career
  title_zh: 年二十七游小陂从吴与弼学
  date: 1455
  year_of: 1455
  description_zh: 闻吴康斋论学尊师道勇担荷如立千仞壁，晨起簸谷受懒惰之戒，遍讲濂洛关闽以上达洙泗而未知入处
- id: guji-陈献章-event-wudao
  type: career
  title_zh: 归白沙杜门静坐悟见心体
  date: 1458
  year_of: 1458
  description_zh: 独无师友指引，惟靠书册寻用力之方，忘寝忘食累年，舍繁求约惟在静坐，久见心体隐然呈露，体认物理由源及委，涣然自信作圣之功在兹
- id: guji-陈献章-event-jiangxue
  type: career
  title_zh: 白沙讲学倡主静涵养授湛若水等
  date: 1467
  year_of: 1467
  description_zh: 筑室讲学论前辈言道妙不可言，言此理无内外终始充塞穿纽，教人日用随处体认天理，发明鸢飞鱼跃须勿忘勿助功夫，主张虚圆不测之神
- id: guji-陈献章-event-death
  type: death
  title_zh: 卒于白沙江门之上
  date: 1500
  year_of: 1500
  description_zh: 明弘治十三年卒，一生林下自得不累外物，富贵非乐湖山为乐，自得无愧怍为至乐，开岭南心学一脉，士称文恭
