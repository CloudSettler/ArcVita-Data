    en: Chen Xuan
  lifespan:
    birth:
      date: '1429'
      precision: year
      is_circa: true
      raw: 约明宣德四年临海人
    death:
      date: '1486'
      precision: year
      is_circa: false
      raw: 明成化二十二年逮死
  birth_date: '1429'
  death_date: '1486'
  era: 明代
  reign_ref: 明英宗天顺至明宪宗成化
  archetype: 直谏守正之臣
  dilemmas:
  - 居御史救罗伦劾权贵则忤上招忌，缄默则负平生所学
  - 守广东争市舶忤宦官则被逮致死，曲从则病民误国
  lesson: 立教在明伦敬身，直道而行虽死无愧所学
  summary_first_person: 我字士贤临海人，天顺庚辰进士，尝为御史救罗伦劾权贵，晚守广东争市舶忤中官而被逮，复集注小学以明养正之功，愿童蒙皆习洒扫应对以成圣贤忠孝之节
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E5%BE%A1%E5%AE%9A%E5%B0%8F%E5%AD%A6%E9%9B%86%E6%B3%A8.html
endeavors:
- id: guji-陈选-endeavor-1
  title_zh: 御史直声救罗伦劾权贵
  summary_zh: 为御史时救罗伦劾倪谦钱溥马昂汪直，风采可观
  phases:
  - key: brewing
    name: 天顺登第养望
    labels:
      zh:
      - 蓄养直气
    start_date: '1460'
    highlight_event_id: guji-陈选-event-jinshi
  - key: breakthrough
    name: 居台垣救罗伦
    labels:
      zh:
      - 直声初著
    start_date: '1467'
    highlight_event_id: guji-陈选-event-yushi
  - key: climax
    name: 连劾权幸宦官
    labels:
      zh:
      - 不畏强御
    start_date: '1477'
    highlight_event_id: guji-陈选-event-yushi
  decisions:
  - date: '1467'
    title_zh: 上疏营救罗伦
    rationale: 罗伦以言事谪戍，不救则言路塞，故冒犯救之以存国是
  - date: '1477'
    title_zh: 劾倪谦钱溥马昂汪直
    rationale: 权幸乱政纲纪渐坏，不劾则风纪扫地，故不顾身劾之以正朝纲
- id: guji-陈选-endeavor-2
  title_zh: 守粤争市舶著小学集注
  summary_zh: 官广东布政使争市舶忤宦官被逮，又集注朱子小学以迪童蒙
  phases:
  - key: brewing
    name: 辑朱子小学成集注
    labels:
      zh:
      - 明伦敬身
    start_date: '1480'
    highlight_event_id: guji-陈选-event-jizhu
  - key: breakthrough
    name: 守广东布政使
    labels:
      zh:
      - 廉正爱民
    start_date: '1484'
    highlight_event_id: guji-陈选-event-guangdong
  - key: climax
    name: 争市舶忤中官
    labels:
      zh:
      - 守正不屈
    start_date: '1486'
    highlight_event_id: guji-陈选-event-guangdong
  - key: closure
    name: 被逮卒追赠谥恭慤
    labels:
      zh:
      - 以身殉道
    start_date: '1486'
    highlight_event_id: guji-陈选-event-death
  decisions:
  - date: '1480'
    title_zh: 集注小学以教童蒙
    rationale: 小学为立教明伦敬身之本，随文衍义使乡塾易晓，故辑注以补风化
  - date: '1486'
    title_zh: 争市舶忤宦官不屈
    rationale: 市舶病民宦官专横，曲从则误国病民，故力争虽逮死不悔
