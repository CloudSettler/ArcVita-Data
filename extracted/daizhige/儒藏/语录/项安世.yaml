    title_zh: 不附权臣韩侂胄
    rationale: 宁摈斥十年，不以迎合求进，保全名节以守道
  - date: '1206'
    title_zh: 闻警即起任边寄
    rationale: 国难当前，虽老病犹当出，外御凭陵内固根本，以经术施于政事
events:
- id: guji-项安世-event-birth
  date: '1129'
  year_of: 1129
  title_zh: 出生括苍
  description_zh: 建炎三年生于括苍项氏，少力学经史，长通治道
- id: guji-项安世-event-jinshi
  date: '1172'
  year_of: 1172
  title_zh: 乾道登进士第
  description_zh: 乾道八年登进士第，入仕州县，留意经世之学
- id: guji-项安世-event-bianzhe
  date: '1195'
  year_of: 1195
  title_zh: 庆元忤权摈斥居江陵
  description_zh: 庆元中忤权臣，为时论所嫉，摈斥十年，居江陵杜门却扫，足迹不涉户限，送迎宾友未尝逾阈，潜心经史
- id: guji-项安世-event-zhushu
  date: '1202'
  year_of: 1202
  title_zh: 撰成周易玩辞项氏家说
  description_zh: 于江陵条记读经史所得，成周易玩辞及家说十卷附录二卷，说经七卷说事说政说学三卷，皆洞见本原
- id: guji-项安世-event-qifu
  date: '1206'
  year_of: 1206
  title_zh: 兵端开被命御边
  description_zh: 开禧兵端既开，边事告急，被命而起，独当一面，外御凭陵内固根本，成就卓然
- id: guji-项安世-event-death
  date: '1208'
  year_of: 1208
  title_zh: 嘉定元年逝世
  description_zh: 嘉定元年卒，遗书家说散佚，后人自永乐大典辑出，宋史艺文志著录十卷
