  reign_ref: 宋孝宗至宋宁宗
  archetype: 杜门潜心的经世儒者
  dilemmas:
  - 忤权臣而遭摈斥十年，是迎合时论以求通显，还是杜门却扫以明经守道
  - 耽思经史专意著述，是尚虚言性理，还是订覈同异通达治道以致用
  lesson: 学贵有体有用，守正不阿，通经以致用，穷居亦可成大业
  summary_first_person: 吾项安世，字平甫，括苍人，少登进士第，庆元中忤权臣而摈斥十年，居江陵杜门潜心，足迹不逾阈，专治经史，著周易玩辞及家说十卷以明圣人之意，晚起当一面，粗立边功，愿以实学经世，不以虚言徇人
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E9%A1%B9%E6%B0%8F%E5%AE%B6%E8%AF%B4.html
