  - date: 1644-06-01
    title_zh: 明亡不仕专心著述
    rationale: 国变之后奋欲自树而不得试，遂以立言为经世，穷源溯本讨论民生国命
  - date: 1656-03-01
    title_zh: 携书载箧出游稽考
    rationale: 不安固陋空言，必亲历山川交贤豪长者，有疑反复参考归于至当
