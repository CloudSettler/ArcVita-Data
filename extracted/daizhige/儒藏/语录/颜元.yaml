person:
  qid: guji-颜元
  name_zh: 颜元
  names:
    zh: 颜元
    en: Yan Yuan
  lifespan:
    birth:
      date: 1635-03
      precision: month
      is_circa: false
      raw: 明崇祯八年乙亥三月生于博野
    death:
      date: 1704-09-02
      precision: day
      is_circa: false
      raw: 康熙四十三年九月二日卒
  birth_date: 1635-03
  death_date: 1704-09-02
  era: 明末清初
  reign_ref: 康熙
  archetype: 习斋实学宗师
  dilemmas:
  - 朱氏养恩与颜氏宗亲之间孝义两全之难
  - 尊崇程朱旧名与恢复周孔教学成法之间道统抉择之难
  - 隐居不仕与以实学经世救苍生之间出处进退之难
  lesson: 必有事焉，以事物为归，习礼乐射书数究兵农水火，方为明亲一致大学之道
  summary_first_person: 我颜元字易直又字浑然，博野北杨村人，幼遭乱离为朱氏义孙，尽孝守礼而后归宗颜氏，折节由陆王入程朱而返求六经孔孟，著四存编名居习斋，以六府三事三物四教教学者，关东寻父终丧，南游倡学，漳南设教，愿以实学救五百年空言之弊，积学待用以明圣道
  source_urls:
  - https://daizhige.org/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E9%A2%9C%E6%B0%8F%E5%AD%A6%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%84%92%E8%97%8F/%E8%AF%AD%E5%BD%95/%E9%A2%9C%E6%B0%8F%E5%AD%A6%E8%AE%B0.md
endeavors:
- id: guji-颜元-endeavor-1
  title_zh: 开创习斋实学正救空言讲论之弊
  summary_zh: 由陆王程朱返求六经孔孟，著存学存性存治存人四编，主张学习六艺而成德行，反对静坐读书章句之学
  phases:
  - key: brewing
    name: 早年折节为学
    labels:
      zh:
      - 折节为学
      - 由陆王入程朱
    start_date: 1655-01
    highlight_event_id: guji-颜元-event-qiuxue
  - key: breakthrough
    name: 著四存编立习斋
    labels:
      zh:
      - 四存编
      - 习斋讲学
    start_date: 1669-01
    highlight_event_id: guji-颜元-event-xizhai
  - key: climax
    name: 漳南设教试实学
    labels:
      zh:
      - 漳南书院
      - 文事武备
    start_date: 1695-01
    highlight_event_id: guji-颜元-event-zhangnan
  - key: closure
    name: 遗绪付门人成谱录
    labels:
      zh:
      - 年谱言行录
      - 积学待用
    start_date: 1704-09-02
    highlight_event_id: guji-颜元-event-death
  decisions:
  - date: 1669-01
    title_zh: 著四存编以事物为归
    rationale: 不以章句诵读为学，要复六府三事三物四教旧章，使德行艺征诸事物而成实用之学
  - date: 1695-01
    title_zh: 三聘赴漳南书院立经史艺能等科
    rationale: 礼乐射御书数兵农水火皆当习行，欲以实学人才任朝廷大政而收经世之效
- id: guji-颜元-endeavor-2
  title_zh: 践履大孝寻亲终丧并高隐经世设教
  summary_zh: 事朱翁媪至孝，归宗颜氏后誓寻亲于关东，沈阳得墓奉主归葬弃诸生终丧，南游开封倡学，晚年漳南讲学而终
  phases:
  - key: brewing
    name: 为朱氏子尽孝守礼
    labels:
      zh:
      - 事亲至孝
      - 遵古丧礼
    start_date: 1650-01
    highlight_event_id: guji-颜元-event-qiuxue
  - key: breakthrough
    name: 誓不返关东寻亲
    labels:
      zh:
      - 关东寻父
      - 招魂奉主
    start_date: 1674-01
    highlight_event_id: guji-颜元-event-xungen
  - key: climax
    name: 南游开封漳南授徒
    labels:
      zh:
      - 开封倡学
      - 漳南设教
    start_date: 1680-01
    highlight_event_id: guji-颜元-event-zhangnan
  - key: closure
    name: 归里遗言待用而卒
    labels:
      zh:
      - 高隐不仕
      - 私谥文孝
    start_date: 1704-09-02
    highlight_event_id: guji-颜元-event-death
  decisions:
  - date: 1674-01
    title_zh: 誓不得亲不返如关东寻父
    rationale: 父被掠音耗绝而昼夜凄怆，虽为朱氏义子仍必亲往辽左寻墓，以全人伦大孝
  - date: 1675-01
    title_zh: 归葬后弃诸生终三年丧
    rationale: 既于沈阳得父墓哭奠奉主归里，当弃举业不仕，以苍生休戚圣道明晦为己任而设教救世
events:
- id: guji-颜元-event-birth
  type: birth
  title_zh: 孕十四月生于博野北杨村
  date: 1635-03
  year_of: 1635
  location_zh: 直隶保定府博野县北杨村
  description_zh: 明崇祯八年乙亥三月生，孕十四月，手文生舌文中，父昹为朱氏义子故初姓朱
- id: guji-颜元-event-qiuxue
  type: career
  title_zh: 折节为学由陆王入程朱
  date: 1657-01
  year_of: 1657
  location_zh: 博野蠡县一带
  description_zh: 年二十余好陆王书，未几从事程朱笃信之，与王法干共立日记自勘言行意念，始寤尧舜之道在六府三事
- id: guji-颜元-event-xizhai
  type: career
  title_zh: 著四存编名居习斋授徒
  date: 1669-01
  year_of: 1669
  location_zh: 博野习斋
  description_zh: 著存学存性存治存人四编，名居习斋，帅弟子习礼乐射书数究兵农水火，主张必有事焉学以事物为归
- id: guji-颜元-event-xungen
  type: career
  title_zh: 如关东寻父沈阳得墓奉主归葬
  date: 1674-01
  year_of: 1674
  location_zh: 关东沈阳
  description_zh: 值三藩变后如关东誓不得亲不返，于沈阳访得父墓哭奠如初丧礼，见异母妹招魂奉主躬御而归，遂弃诸生终三年丧
- id: guji-颜元-event-zhangnan
  type: career
  title_zh: 三聘赴肥乡漳南书院设教
  date: 1695-01
  year_of: 1695
  location_zh: 肥乡漳南书院
  description_zh: 应郝文灿三聘往设教，立文事武备经史艺能等科，从游数十人，会漳水溢堂舍没乃叹天不欲行吾道而辞归
- id: guji-颜元-event-death
  type: death
  title_zh: 卒于博野门人私谥文孝
  date: 1704-09-02
  year_of: 1704
  location_zh: 博野
  description_zh: 自漳南归后八年而卒，年七十，卒日谓弟子天下事尚可为当积学待用，远近百余人会葬，门人编年谱言行录辟异录
