    title_zh: 决意驳程朱气质性恶
    rationale: 气即理之气不可分恶，恶乃外引习染，当尊明德性以正其源
  - date: 1686
    title_zh: 决以棉桃水喻明性
    rationale: 以日用形色实物晓性善，使学者不贱气质而重习行洗染
