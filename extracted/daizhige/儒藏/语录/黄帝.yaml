person:
  qid: guji-轩辕
  name_zh: 黄帝
  names:
    zh: 黄帝
    en: Yellow Emperor
  lifespan:
    birth:
      date: '-2711'
      precision: year
      is_circa: true
      raw: 约公元前27世纪
    death:
      date: '-2599'
      precision: year
      is_circa: true
  birth_date: 约-2711
  death_date: 约-2599
  era: 上古五帝时代
  reign_ref: 约公元前27世纪在位
  archetype: 创制文明、奠定华夏的圣王
  dilemmas:
  - 面对炎裔德衰、部族相侵的乱局，须以兵威定乱又须垂文立制
  - 战胜东夷劲敌后，须建立万邦屏藩并定鼎安民
  lesson: 诛强暴以绝祸，建制度以安民，文明肇始在於定纷止争而非穷兵
  summary_first_person: 我轩辕氏生於炎裔德衰之世，见生民阽危，乃铸五兵，诛铜额、灭蚩尤於涿鹿之野，涤荡飞沙乱气。定鼎以後，我垂文鼓弦，巡狩定瑞，建屏万邦，为华夏神明之胄开创基业，使後世百十有七后皆得所凭依。
  source_urls:
  - https://zh.wikisource.org/wiki/黃書/原極
  - https://zh.wikisource.org/wiki/黃書/古儀
