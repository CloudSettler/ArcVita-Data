endeavors:
- id: guji-黄绾-endeavor-1
  title_zh: 建构知止之学并撰明道编
  description: 溯伏羲艮止尧舜执中至孔孟大学知止以立圣学本原而著书辩惑
  phases:
  - key: brewing
    name: 早年求道究性命本原
    labels:
      zh:
      - 求道
      - 穷理
    start_date: 1495
    highlight_event_id: guji-黄绾-event-qiudao
  - key: breakthrough
    name: 悟知止为圣学要诀
    labels:
      zh:
      - 知止
      - 艮止执中
    start_date: 1517
    highlight_event_id: guji-黄绾-event-wudao
  - key: climax
    name: 撰明道编系统立说
    labels:
      zh:
      - 著述
      - 明道
    start_date: 1540
    highlight_event_id: guji-黄绾-event-zhuanshu
  - key: closure
    name: 晚年纯粹以言行发妙道
    labels:
      zh:
      - 纯粹
      - 垂训
    start_date: 1550
    highlight_event_id: guji-黄绾-event-death
  decisions:
  - date: 1517
    title_zh: 以知止定宗旨以精思为工夫
    rationale: 由艮止执中会通大学定静安虑得以简易明白继绝学而接孔孟真传
  - date: 1540
    title_zh: 撰明道编辩禅明儒佛之辨
    rationale: 痛禅学乱真宋儒溺禅将为天下国家之害故不得不深明根本以塞其源
- id: guji-黄绾-endeavor-2
  title_zh: 仕京讲学与辟异端卫世道
  description: 登进士仕京师与阳明甘泉定交讲习而辩宋儒禅弊以谦慎独经世
  phases:
  - key: brewing
    name: 登进士入仕京师
    labels:
      zh:
      - 科第
      - 入仕
    start_date: 1505
    highlight_event_id: guji-黄绾-event-jinshi
  - key: breakthrough
    name: 定交讲习与阳明甘泉并称
    labels:
      zh:
      - 交游
      - 讲学
    start_date: 1517
    highlight_event_id: guji-黄绾-event-wudao
  - key: climax
    name: 辩宋儒禅学之失
    labels:
      zh:
      - 辩禅
      - 正学
    start_date: 1540
    highlight_event_id: guji-黄绾-event-zhuanshu
  - key: closure
    name: 守谦慎独以终
    labels:
      zh:
      - 慎独
      - 尚谦
    start_date: 1550
    highlight_event_id: guji-黄绾-event-death
  decisions:
  - date: 1517
    title_zh: 与阳明甘泉交而独守知止精思之旨
    rationale: 海内愿学必曰夫子与阳明甘泉而吾学超然独悟不堕虚无高远之谈
  - date: 1542
    title_zh: 辩濂溪明道伊川晦庵象山皆由禅入
    rationale: 其入门皆由于禅语焉不详择焉不精故须辨无极廓然大公格物诸说以明尧舜允执厥中之传
events:
- id: guji-黄绾-event-birth
  date: 1480
  year_of: 1480
  title_zh: 黄绾诞生
  description: 明成化十六年生于浙江黄岩资禀异人早有求道之志
- id: guji-黄绾-event-qiudao
  date: 1495
  year_of: 1495
  title_zh: 早年求道慨然慕古圣
  description: 早年求道穷性命本原究艮止执中慨然欲至于古圣之域
- id: guji-黄绾-event-jinshi
  date: 1505
  year_of: 1505
  title_zh: 登进士仕于京师
  description: 登进士后仕于京师定交讲习用功造诣为海内所宗
- id: guji-黄绾-event-wudao
  date: 1517
  year_of: 1517
  title_zh: 定交讲习悟知止之要
  description: 与阳明甘泉二先生定交讲习超然独悟以知止为圣学要诀以精思为致知工夫以格物为功效
- id: guji-黄绾-event-zhuanshu
  date: 1540
  year_of: 1540
  title_zh: 撰明道编辩禅卫道
  description: 溯伏羲尧舜文王孔子曾思孟相传之艮止执中之学作明道编以辩禅学及宋儒濂溪明道伊川晦庵象山之失兼论良知一体格物之弊
- id: guji-黄绾-event-death
  date: 1554
  year_of: 1554
  title_zh: 黄绾逝世
  description: 明嘉靖三十三年卒晚年从容纯粹一行一言莫非妙道精义之发越门人辑日录语录以传
