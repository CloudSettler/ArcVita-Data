  birth_date: 1480
  death_date: 1554
  era: 明
  reign_ref: 成化至嘉靖
  archetype: 知止卫道之儒臣
  dilemmas:
  - 圣道湮沦当直辩禅学还是容忍并存
  - 出仕经世与退居讲学著述之间何以两全
  - 与阳明甘泉并称当同调还是独守知止之旨
  lesson: 以艮止执中立本以定静安虑得为归以慎独尚谦辩异端而明圣传
  summary_first_person: 吾黄绾早年求道仕于京师与阳明甘泉定交讲习悟以知止为圣学要诀以精思为致知工夫以格物为功效晚年撰明道编以明伏羲尧舜孔孟相传之艮止执中之学而辩禅学与宋儒之失
  source_urls:
