  archetype: 守正求是的朱学讲者
  dilemmas:
  - 尊朱子而或舍朱取诸家，守门户还是求是非之中
  - 排佛老诋功利而疑周礼太平，信古说还是求实行
  lesson: 反复发明务求是非，不假借声价，读书躬行以化民成俗
  summary_first_person: 余自幼承先父之教熟读朱子论语集注，长师王贯道而朝夕不出晦庵之说，年逾六十遗忘是惧窃官暇复读诸经史，随笔札记断以己意，论古人六十八卷兼存奏劄讲义自作之文，力排佛老功利不附陆学，愿后学熟诵体之躬行不负先儒拳拳之意
  source_urls:
