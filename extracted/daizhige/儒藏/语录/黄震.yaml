    highlight_event_id: guji-黄震-event-death
  decisions:
  - date: 1265
    title_zh: 力排佛老及陆张杂禅
    rationale: 由陆九渊张九成上溯杨时谢良佐皆议其杂禅，朱子校正参同亦不敢遽信
  - date: 1270
    title_zh: 诋王安石功利疑周礼太平
    rationale: 治术排功利，虽朱子谓周礼可致太平亦不敢遽信，务求可行之实
