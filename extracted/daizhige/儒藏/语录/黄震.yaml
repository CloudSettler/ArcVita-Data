  decisions:
  - date: 1260
    title_zh: 以古今纪要外别为日抄
    rationale: 读经三十卷读史读子各有专卷，摘切要或存标目，务求坦然易知而发指要
  - date: 1270
    title_zh: 尊朱而不囿门户
    rationale: 引诸家以翼朱子或舍朱取诸家，反复发明求是非之中不徒假借声价
- id: guji-黄震-endeavor-2
