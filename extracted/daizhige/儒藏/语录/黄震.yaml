  - key: climax
    name: 讲义策问排佛老功利
    labels:
      zh:
      - 讲学辟异
    start_date: 1270
    highlight_event_id: guji-黄震-event-zouzha
  - key: closure
    name: 宋亡不仕以著述终
    labels:
      zh:
      - 隐居守正
