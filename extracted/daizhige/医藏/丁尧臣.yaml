    rationale: 通都大邑不乏医肆而僻壤穷乡束手无策更有多误于庸医故取简便者广传
  - date: 1880
    title_zh: 厘四卷付剞劂并存版听刷
    rationale: 药须眼前常用易购对症即效切戒增减原版存铺听人刷印施送以拯疾厄
