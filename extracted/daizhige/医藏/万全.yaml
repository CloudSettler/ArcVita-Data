    title_zh: 弃八股专青囊
    rationale: 感八股不得志而幼科不鸣不行恐斩家泽故从张玉泉胡柳溪游明理而后专精岐黄
  - date: 1549
    title_zh: 不授诸子而公其书
    rationale: 恐诸子不能明不能行而使泽斩故遗书子孙兼流传荆襄闽洛吴越以授受得人
- id: guji-万全-endeavor-2
  title_zh: 明外科大法而济痈疽
  description: 穷通性理识别阴阳撰外科心法十二卷辨痈疽疔发虚实阴阳创千金托里凉膈败毒诸方及太乙万灵膏以救外科庸误
