  decisions:
  - date: 1571
    title_zh: 先托里后攻毒不妄勾割
    rationale: 见针发背者专行勾割去筋膜败肉益痛非仁术故主内攻宣热解毒定痛排脓生肌敛口为正道
  - date: 1572
    title_zh: 秘方不秘辑膏传世
    rationale: 悯病家付性命于乡巷庸徒之手故纂疡科方脉载九十六味太乙万灵膏以补目未见耳未闻
events:
- id: guji-万全-event-birth
  type: birth
  date: 1495
  year_of: 1495
  title_zh: 生于罗田万氏医家
  description: 明弘治八年乙卯生于罗田先祖杏城翁以幼科鸣先考菊轩翁客罗娶陈氏而家焉
- id: guji-万全-event-yuying
  type: career
  date: 1549
  year_of: 1549
  title_zh: 辑成育婴家秘传幼科三世
  description: 自求家世相传之绪散失者集之缺略者补之书成名育婴家秘以遗子孙流传荆襄闽洛吴越
- id: guji-万全-event-waike
  type: career
  date: 1571
  year_of: 1571
  title_zh: 撰成外科心法立痈疽大法
  description: 撰总论大法辨痈疽疔发虚实阴阳五善七恶定托里解毒排脓定痛之序兼载太乙万灵膏九十六味
- id: guji-万全-event-kanxing
  type: career
  date: 1579
  year_of: 1579
  title_zh: 樵川太守付梓纸贵三湘
  description: 成数十卷先为樵川太守李公付梓一时纸贵三湘后板毁于兵燹赖五世孙藏帖于墙壁得存
- id: guji-万全-event-death
  type: death
  date: 1580
  year_of: 1580
  title_zh: 卒于罗田享年八十六
  description: 明万历八年庚辰卒平生业辄精屡效以效志编邑人称密斋万生歧黄名手噪闻隆万年间
