endeavors:
- id: guji-万全-endeavor-1
  name_zh: 继承家学集著育婴家秘
  description_zh: 继杏城菊轩二世家传集补删订成育婴家秘流传荆襄闽洛吴越
  phases:
  - key: brewing
    name: 随父习幼科从儒师游学
    labels:
      zh:
      - 家传幼科
      - 儒医兼修
    start_date: 1510
    highlight_event_id: guji-万全-event-birth
  - key: breakthrough
    name: 搜集家世绪删补订正
    labels:
      zh:
      - 集散补缺
      - 删繁订误
    start_date: 1540
    highlight_event_id: guji-万全-event-yuying
  - key: climax
    name: 育婴家秘成流传四方
    labels:
      zh:
      - 成书传世
      - 万氏小儿科
    start_date: 1550
    highlight_event_id: guji-万全-event-yuying
  - key: closure
    name: 念诸子莫能明行思再阐
    labels:
      zh:
      - 忧道不传
      - 求授受得人
    start_date: 1560
    highlight_event_id: guji-万全-event-fahui
  decisions:
  - date: 1549
    title_zh: 决意取家传绪成一书以遗子孙
    rationale: 前无作者虽美弗彰后无述者虽盛弗传不肖之责莫大于失传
  - date: 1550
    title_zh: 定名育婴家秘不私于诸子而公传于世
    rationale: 有子十人未有能而行之者与其斩于家不如流传荆襄闽洛吴越以济众
- id: guji-万全-endeavor-2
  name_zh: 著幼科发挥发明胎疾医理
  description_zh: 以形气发微原病审候立论发明五脏胎禀胎毒治法主补脾肾调中
  phases:
  - key: brewing
    name: 察徒法徒意之弊欲明遗意
    labels:
      zh:
      - 法意之辨
      - 发微起意
    start_date: 1555
    highlight_event_id: guji-万全-event-yuying
  - key: breakthrough
    name: 立形气胎毒论辨望闻问切
    labels:
      zh:
      - 胎弱胎毒
      - 四诊审候
    start_date: 1565
    highlight_event_id: guji-万全-event-fahui
  - key: climax
    name: 幼科发挥成以地黄丸参苓白术丸为主
    labels:
      zh:
      - 补肾培根
      - 调理脾胃
    start_date: 1570
    highlight_event_id: guji-万全-event-fahui
  - key: closure
    name: 以书付后世君子明之行之
    labels:
      zh:
      - 托之后贤
      - 泽及幼婴
    start_date: 1580
    highlight_event_id: guji-万全-event-death
  decisions:
  - date: 1565
    title_zh: 决以补肾调脾为胎禀大法不用峻攻
    rationale: 胎弱者禀受不足肾为五脏根本脾胃壮实则四肢安宁补泻须取其平
  - date: 1570
    title_zh: 决著幼科发挥以明育婴家秘遗意
    rationale: 择法不精则徒法语意不详则徒意法愈烦而意无补不如明之以利后学
events:
- id: guji-万全-event-birth
  date: 1499
  year_of: 1499
  title_zh: 诞生于罗田万氏幼科之家
  description_zh: 明弘治十二年生于罗先祖杏城翁以幼科鸣先考菊轩客罗娶陈氏而生全
- id: guji-万全-event-yuying
  date: 1550
  year_of: 1550
  title_zh: 集成家传著成育婴家秘
  description_zh: 暇日求家世相传之绪集散补缺删繁订误书成名育婴家秘以遗子孙遂流传荆襄闽洛吴越
- id: guji-万全-event-fahui
  date: 1570
  year_of: 1570
  title_zh: 著幼科发挥发明形气原病
  description_zh: 论形气发微胎弱胎毒望闻问切三关脉纹及调理脾胃王道发明育婴家秘遗意
- id: guji-万全-event-death
  date: 1582
  year_of: 1582
  title_zh: 卒于罗田幼科泽被后世
  description_zh: 明万历十年卒一生以幼科全赤子之命所著育婴家秘幼科发挥广嗣纪要等并行于世
