  - 家传绪散失缺略繁芜错误当如何集补删订以遗子孙
  - 治病择法主治在意法繁意晦当如何发明遗意使法精意详
  lesson: 调理脾胃乃医中王道节戒饮食乃却病良方补泻取平勿过其剂幼科贵在防微杜渐
  summary_first_person: 余万全家于罗先祖杏城翁以幼科鸣先考菊轩翁继述其志余少从钜儒张玉泉胡柳溪游暇日集家世相传之绪散失者集之缺略者补之繁芜者删之错误者订之成育婴家秘以遗子孙又恐徒法徒意无补于世复著幼科发挥以明其意愿授受得人不坠万氏之泽
  source_urls:
