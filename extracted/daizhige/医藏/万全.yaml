person:
  qid: guji-万全
  name_zh: 万全
  names:
    zh: 万全
    en: Wan Quan
  lifespan:
    birth:
      date: 1499
      precision: year
      is_circa: false
      raw: 明弘治十二年
    death:
      date: 1582
      precision: year
      is_circa: false
      raw: 明万历十年
  birth_date: 1499
  death_date: 1582
  era: 明
  reign_ref: 明世宗嘉靖至明神宗万历
  archetype: 儒医济世者
  dilemmas:
  - 求嗣当恃药石燥补还是当修德寡欲以全天真
  - 妇人无子当专责母血虚寒还是当兼察父气不足与胎毒
  - 行医活人于一时还是著书立说以惠后世
  lesson: 广嗣当以修德积庆寡欲全真择配调元协期为本药石不过佐助不可妄投辛热以夺天和
  summary_first_person: 吾万全号密斋湖广罗田人也少承家学长而业医见世人求嗣惟恃药石不知节欲养精血不知修德以转祸为福故著广嗣纪要立修德寡欲择配调元协期五法又明胎养痘疹妇幼之旨愿后人惜精爱身以续宗祀
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%B9%BF%E5%97%A3%E7%BA%AA%E8%A6%81.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%B9%BF%E5%97%A3%E7%BA%AA%E8%A6%81.html
endeavors:
- id: guji-万全-endeavor-1
  title_zh: 撰述广嗣纪要立求嗣五法
  description: 以修德寡欲择配调元协期五篇纠偏时俗并详护胎养胎禁忌以全生育之真
  phases:
  - key: brewing
    name: 少承家学博览医籍察时俗求嗣之谬
    labels:
      zh: 积学省俗
    start_date: 1510
    highlight_event_id: guji-万全-event-birth
  - key: breakthrough
    name: 立修德寡欲为求嗣之本破专恃药石之惑
    labels:
      zh: 立论破惑
    start_date: 1535
    highlight_event_id: guji-万全-event-practice
  - key: climax
    name: 撰成广嗣纪要详五法及胎产诸证
    labels:
      zh: 撰述成书
    start_date: 1549
    highlight_event_id: guji-万全-event-guangsi
  - key: closure
    name: 广嗣纪要流传后世为妇幼必读
    labels:
      zh: 传世惠后
    start_date: 1570
    highlight_event_id: guji-万全-event-guangsi
  decisions:
  - date: 1535
    title_zh: 首倡修德积庆以转祸为福
    rationale: 见乏嗣多因娇奢残忍气数当绝非药石可回当省躬悔过行十种利益以积阴功
  - date: 1549
    title_zh: 定寡欲养精血节欲以时之纲
    rationale: 见男子纵欲则精竭女子多交则血枯故主清心寡欲平心定气远四时一月一日之虚以滋化源
- id: guji-万全-endeavor-2
  title_zh: 开拓妇幼痘疹医学悬壶济世
  description: 辨父气母血胎毒之源治妇人经带胎产治幼科痘疹以滋肾养阴为要惠及一方
  phases:
  - key: brewing
    name: 悬壶罗田诊治妇人经闭无子幼科夭札
    labels:
      zh: 行医察证
    start_date: 1525
    highlight_event_id: guji-万全-event-practice
  - key: breakthrough
    name: 悟无子多起父气不足胎毒相传之旨
    labels:
      zh: 悟源辨因
    start_date: 1540
    highlight_event_id: guji-万全-event-practice
  - key: climax
    name: 著妇人科幼科发挥痘疹心法等以滋阴泻火为法
    labels:
      zh: 著书立法
    start_date: 1560
    highlight_event_id: guji-万全-event-treatise
  - key: closure
    name: 万氏医学为后世妇幼儿科宗匠
    labels:
      zh: 宗匠垂范
    start_date: 1582
    highlight_event_id: guji-万全-event-death
  decisions:
  - date: 1540
    title_zh: 不专责母血改用滋肾养阴泻火
    rationale: 法丹溪东垣之论见李叔和红丝瘤郑宪史淋病皆父之胎毒故戒轻用秦桂辛热主张六味地黄滋肾丸救真阴
  - date: 1560
    title_zh: 分弱男羸女而补养立婚嫁调治之法
    rationale: 见父少母老母壮父衰则子羸弱故补弱男以补肾补羸女以养血壮脾并定嫁娶之期以全形气
events:
- id: guji-万全-event-birth
  title_zh: 出生于湖广罗田医家
  date: 1499
  year_of: 1499
  description: 明弘治十二年生于湖广罗田自幼从父习医博览经史百家
- id: guji-万全-event-practice
  title_zh: 悬壶罗田专治妇幼无子证
  date: 1525
  year_of: 1525
  description: 青年悬壶乡里见求嗣者朋饮热剂纵欲早衰乃倡节欲养精血辨父气母血之病
- id: guji-万全-event-guangsi
  title_zh: 撰成广嗣纪要五卷
  date: 1549
  year_of: 1549
  description: 嘉靖年间撰成广嗣纪要立修德寡欲择配调元协期五篇并详转女为男护胎调理胎疾诸法
- id: guji-万全-event-treatise
  title_zh: 著妇幼痘疹诸书成万氏医学
  date: 1560
  year_of: 1560
  description: 继广嗣纪要之后著妇人科幼科发挥痘疹心法等倡滋阴泻火辨胎毒之源为后世所宗
- id: guji-万全-event-death
  title_zh: 卒于罗田万氏医门传世
  date: 1582
  year_of: 1582
  description: 明万历十年卒于家享年八十余所著广嗣纪要及妇幼诸书流传后世尊为万密斋
