    rationale: 方士绝谷休妻不近人情，惟保婴护产调理气血最切民生，故弃仙方而务实用
  - date: 1549
    title_zh: 以食治药治并重
    rationale: 饮食男女为大欲，节之则气血和平，佐以八羔七损诸方，方能标本兼治
