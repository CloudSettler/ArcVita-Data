endeavors:
- id: guji-东轩居士-endeavor-1
  title_zh: 家藏痈疽方论验治
  summary_zh: 以家藏二十二篇为本，息心澄意行之十二年，辨痈疽五发，兼针灸汤贴熏洗而救人无数
  phases:
  - key: brewing
    name: 家藏采辑
    labels:
      zh: 家学采辑
    start_date: '1158'
    highlight_event_id: guji-东轩居士-event-jiaxue
  - key: breakthrough
    name: 十二年行验
    labels:
      zh: 临床证验
    start_date: '1160'
    highlight_event_id: guji-东轩居士-event-xingyan
  - key: climax
    name: 乾道证方神验
    labels:
      zh: 以方证效
    start_date: 1170-06
    highlight_event_id: guji-东轩居士-event-gandao
  - key: closure
    name: 会萃成帙
    labels:
      zh: 会萃成帙
    start_date: '1172'
    highlight_event_id: guji-东轩居士-event-huicui
  decisions:
  - date: '1160'
    title_zh: 息心澄意以行家方
    rationale: 片言只字皆不妄发，须颖悟之后奉行庶几不误后人
  - date: 1170-06
    title_zh: 以卷中逼毒妙贴互参居礼法
    rationale: 仲父背疽旬日盈尺，服卷尾逼毒散敷黄真君妙贴散熏以雌雄黄等而得敛
- id: guji-东轩居士-endeavor-2
  title_zh: 编刊卫济宝书传世
  summary_zh: 会不老山高先生答问，洞灵辛隐士玉女飞花散，深溪吴道士神杖散，清河衲僧赵侯须等，图证悉具条陈篇目使易明易行
  phases:
  - key: brewing
    name: 采百家说会十经旨
    labels:
      zh: 采会百家
    start_date: '1165'
    highlight_event_id: guji-东轩居士-event-xingyan
  - key: breakthrough
    name: 得仙芝神杖飞花等方
    labels:
      zh: 得授奇方
    start_date: '1170'
    highlight_event_id: guji-东轩居士-event-gandao
  - key: climax
    name: 授居礼传好事者
    labels:
      zh: 授书济世
    start_date: '1175'
    highlight_event_id: guji-东轩居士-event-shoushu
  - key: closure
    name: 自序名家传卫济宝书
    labels:
      zh: 序书传远
    start_date: '1180'
    highlight_event_id: guji-东轩居士-event-shoushu
  decisions:
  - date: '1175'
    title_zh: 不敢私于家授文居礼
    rationale: 居礼以卷之一二方愈人大疾若是，得集大全则活人岂有极
  - date: '1180'
    title_zh: 条陈篇目图证悉具
    rationale: 使传者易明易行，随病施效可以传之无穷为卫家济世之宝
events:
- id: guji-东轩居士-event-birth
  title_zh: 出生
  date: '1140'
  year_of: 1140
  description_zh: 约南宋绍兴间生，居东轩，自号东轩居士，家藏痈疽方论
- id: guji-东轩居士-event-jiaxue
  title_zh: 得家藏痈疽方论二十二篇
  date: '1158'
  year_of: 1158
  description_zh: 家藏痈疽方论二十二篇共为一帙，方论精微图证悉具，采百家会十经旨而自得其妙
- id: guji-东轩居士-event-xingyan
  title_zh: 十二年行方救人无数
  date: '1160'
  year_of: 1160
  description_zh: 凭文注解行之十有二年，救人莫知其数，方知其中微奥，辨痈疽癌瘭疽痼痈五发
- id: guji-东轩居士-event-gandao
  title_zh: 乾道庚寅仲父背疽证验
  date: 1170-06
  year_of: 1170
  description_zh: 仲父乾道庚寅六月苦背疮，文居礼以药熏贴十日敛二十日生肉，所用逼毒散妙贴散默契所传背方一帙
- id: guji-东轩居士-event-huicui
  title_zh: 会方论为帙
  date: '1172'
  year_of: 1172
  description_zh: 以此集示居礼互用之，不两月平复，叹药功之大患人不得而善用之
- id: guji-东轩居士-event-shoushu
  title_zh: 序书授书名卫济宝书
  date: '1180'
  year_of: 1180
  description_zh: 自序家传卫济宝书，不敢私于家谨授居礼仍传好事者，董为之原序
- id: guji-东轩居士-event-death
  title_zh: 逝世
  date: '1200'
  year_of: 1200
  description_zh: 约南宋庆元间卒，所传卫济宝书分上下卷载十一论入门试法针灸骑竹马灸法及仙芝神杖飞花等方传于世
