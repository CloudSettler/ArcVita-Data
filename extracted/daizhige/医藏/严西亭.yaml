  decisions:
  - date: 1758
    title_zh: 以纲目为准绳分部著录
    rationale: 纲目虽备而繁简失宜须删繁就简分水火土金石草谷菜果木虫鳞介禽兽人二十五部以便省览考证
  - date: 1760
    title_zh: 首标畏恶反使详主治次著配偶
    rationale: 独入一经只治一病随佐使可治百病须先明畏恶反使令人开卷了然次详主治后著配偶使寒热攻补变化无穷
- id: guji-严西亭-endeavor-2
  title_zh: 兼擅歧黄以配伍法治临床
  summary: 文章之外兼擅歧黄以正为配以反为配一药收数药之功数病同一药之效活人济世
  phases:
  - key: brewing
    name: 文章歧黄兼修明理
    labels:
      zh:
      - 文章兼医
      - 明药性病机
    start_date: 1730
    highlight_event_id: guji-严西亭-event-practice
  - key: breakthrough
    name: 得配治验触类旁通
    labels:
      zh:
      - 以正为配
      - 以反为配
    start_date: 1750
    highlight_event_id: guji-严西亭-event-practice
  - key: climax
    name: 怪症制法禁忌并传
    labels:
      zh:
      - 制法禁忌
      - 怪症相制
    start_date: 1760
    highlight_event_id: guji-严西亭-event-publish
  - key: closure
    name: 传授后学一以贯之
    labels:
      zh:
      - 知药知病
      - 一以贯之
    start_date: 1770
    highlight_event_id: guji-严西亭-event-death
  decisions:
  - date: 1750
    title_zh: 详优劣制法与禁忌
    rationale: 名同实异功效悬殊制得其宜性味为之变化药有利必有害须详论辨备载炮制禁忌使不敢轻试
  - date: 1760
    title_zh: 附怪症以明相制之妙
    rationale: 百药不治之症一物足以疗之乃物之相制附怪症于各条之后使运用之妙无过得配
