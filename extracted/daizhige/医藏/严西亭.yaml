  birth_date: 1708
  death_date: 1782
  era: 清
  reign_ref: 乾隆
  archetype: 本草医家
  dilemmas:
  - 知药者不知方知方者仍不知病医者终误于所治何以贯通药病方
  - 寒温消补各执一性君臣佐使泛言轻重何以辨性明体详治达用
  lesson: 药不能独用病不可泛治得一药而配数药以正为配以反为配知药即知病知病即知所以治病
  summary_first_person: 吾乃严西亭清代习歧黄者与施澹宁洪缉庵共念药不能独用病不可泛治遂博采群书互相辨论合为得配本草十卷搜罗六百五十种前辨性以明体后详治以达用愿后学者触类旁通运用入妙
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/得配本草.md
  - https://daizhige.org/医藏/得配本草.html
