    start_date: '1825'
    highlight_event_id: guji-丹波元坚-event-1
  - key: breakthrough
    name: 以定证对方为要
    labels:
      zh: 舍真类空辨专取证方对应
    start_date: '1835'
    highlight_event_id: guji-丹波元坚-event-1
  - key: climax
    name: 外因类中风门成
    labels:
      zh: 总说风有内外脏腑血脉经络闭脱
    start_date: '1845'
    highlight_event_id: guji-丹波元坚-event-1
  - key: closure
    name: 广要流布后学
    labels:
      zh: 垂训预防调气活血灸法固脱
