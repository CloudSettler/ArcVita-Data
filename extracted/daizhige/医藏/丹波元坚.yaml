  decisions:
  - date: '1820'
    title_zh: 不另立注而附标上层
    rationale: 先人定本已极精核，另立恐成赘述，故以撷粹标记为妥，不没前功而兼存新说
  - date: '1830'
    title_zh: 兼取赵周朱三家之粹
    rationale: 三家皆出先人下世之后，偶有扩充经旨者，取其合于仲景本意者以补辑义之阙
