    title_zh: 以原刻正重刊之失
    rationale: 重刊间失其旧，得原刻勘之可复旧文，不可尽信流俗本
  - date: '1838'
    title_zh: 并揭类聚异文不没所疑
    rationale: 朝鲜医方类聚所据似宋元旧刻，与今本互有异同，并校而揭之，使学者知有别本可参
