    highlight_event_id: guji-丹波元坚-event-2
  decisions:
  - date: '1835'
    title_zh: 存真类之辨梗概专主定证对方
    rationale: 金元以来非风类中之争徒乱人意不如就长沙之旨归于证方实用
  - date: '1845'
    title_zh: 首列中风详载五脏中风灸法与开阖轻重之辨
    rationale: 中藏性命危中府肢体废闭脱误治即死必先察口眼开阖涎沫有无以别治
- id: guji-丹波元坚-endeavor-2
  title_zh: 折衷中风病因守护家学
  summary_zh: 调和河间主火东垣主气彦修主湿与长沙风邪之说倡内虚召风外风引肝风
  phases:
  - key: brewing
    name: 考镜源流
    labels:
      zh: 研读溯洄集正传丹台玉案金匮翼
    start_date: '1828'
    highlight_event_id: guji-丹波元坚-event-2
  - key: breakthrough
    name: 立内虚外风相召之论
    labels:
      zh: 邪之所凑其气必虚肝风为始基
    start_date: '1838'
    highlight_event_id: guji-丹波元坚-event-2
  - key: climax
    name: 别中风中气闭脱寒热虚实
    labels:
      zh: 身温多痰为风身冷无痰为气闭宜开脱宜补
    start_date: '1848'
    highlight_event_id: guji-丹波元坚-event-2
  - key: closure
    name: 示预防调摄之法
    labels:
      zh: 节欲远色养气血戒暴怒房劳
    start_date: '1858'
    highlight_event_id: guji-丹波元坚-event-2
  decisions:
  - date: '1838'
    title_zh: 主真类不分途以内虚统外风
    rationale: 体虚腠疏则风得入无肝风内应则不成卒倒偏枯故内外合参方尽其情
  - date: '1848'
    title_zh: 严别闭脱禁以苏合牛黄施于脱证
    rationale: 闭者邪闭于外元气在内可开脱者元气泄于外误下斩关之药如入井下石
