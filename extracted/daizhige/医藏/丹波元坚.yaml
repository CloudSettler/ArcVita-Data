  dilemmas:
  - 先人辑义已极精核，续补则恐成赘述，不补则诸家粹言散佚难征
  - 众注异同迂僻并存，存其粹而去其僻难得其平，又恐误导后学子弟
  lesson: 守先业而不泥先业，撷众说之粹以补阙，校异本以求是，方能使经旨不坠而惠及后人
  summary_first_person: 吾受读先教谕金匮辑义，时有管见，又见赵以德衍义、周扬俊补义、朱光被正义皆出先人下世之后，乃撷其粹，标记于辑义上层，复校赵开美本与朝鲜医方类聚之异同，整录为编，不敢谓有裨学人，窃比鸡肋，以供子弟参对而已
  source_urls:
