  dilemmas:
  - 出仕济世与守野专医之辨
  - 先开医学堂与先医医者之病之辨
  - 重金钱与重生命之辨
  lesson: 医通治道名利为鹄先医医病而后医人病以臻大同
  summary_first_person: 噫噫噫医岂易言哉我欲合格致诚正修齐治平而一贯之汇通中外因地制宜先医医者之病而后医天下之病
  source_urls:
