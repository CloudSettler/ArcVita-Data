endeavors:
- id: guji-于风八-endeavor-1
  title_zh: 永感守野专一于医
  summary_zh: 丁忧后绝意进取专一于医名节益广屡辞道府敦迫不处公卿之事
  phases:
  - key: brewing
    name: 神交桂林
    labels:
      zh: 共治经医学
    start_date: '1875'
    highlight_event_id: guji-于风八-event-1
  - key: breakthrough
    name: 永感专医
    labels:
      zh: 绝意进取
    start_date: '1885'
    highlight_event_id: guji-于风八-event-2
  - key: climax
    name: 四路争迎
    labels:
      zh: 力辞敦迫
    start_date: '1895'
    highlight_event_id: guji-于风八-event-2
  - key: closure
    name: 达穷不变
    labels:
      zh: 夷然不为意
    start_date: '1909'
    highlight_event_id: guji-于风八-event-3
  decisions:
  - date: '1890'
    title_zh: 永感后绝意进取
    rationale: 亲老家贫之后以医为济世正途不复逐科举仕进
  - date: '1900'
    title_zh: 力却道府敦迫之招
    rationale: 性情率野不宜公卿之事达无加穷无损守医道自重
- id: guji-于风八-endeavor-2
  title_zh: 发愤著医医医以医医病
  summary_zh: 痛医界腐败庸恶陋劣苟且轻贱分朝廷世界医者三方立论著医医医三卷
  phases:
  - key: brewing
    name: 久蕴医论
    labels:
      zh: 斯未能信迟之又久
    start_date: '1889'
    highlight_event_id: guji-于风八-event-2
  - key: breakthrough
    name: 痛陈病源
    labels:
      zh: 迁延岁月卒不能应学堂之请
    start_date: '1905'
    highlight_event_id: guji-于风八-event-2
  - key: climax
    name: 三方鼎峙
    labels:
      zh: 朝廷世界医者各服一篇
    start_date: '1909-08-01'
    highlight_event_id: guji-于风八-event-3
  - key: closure
    name: 邮寄校序
    labels:
      zh: 嘱徐绍桢校序寿世
    start_date: '1909-12-01'
    highlight_event_id: guji-于风八-event-3
  decisions:
  - date: '1905'
    title_zh: 不应开办医学堂先明病源
    rationale: 不知病源而徒严章程订功课如治标不治本必先洗旧染而改良
  - date: '1909-08-01'
    title_zh: 名编医医医寓一字三叹
    rationale: 先求有以医医之医以名利为鹄赏罚为盾使医道治道合而为一
events:
- id: guji-于风八-event-birth
  title_zh: 诞生
  date: '1850'
  year_of: 1850
  summary_zh: 约生清末早岁治经学医学举子业与徐绍桢神交桂林
- id: guji-于风八-event-1
  title_zh: 桂林神交声名初起
  date: '1875'
  year_of: 1875
  summary_zh: 徐绍桢髫年在桂林闻名相思亲炙过从共治经医咸许有汉儒实学宋儒实行
- id: guji-于风八-event-2
  title_zh: 永感专医四路争迎
  date: '1890'
  year_of: 1890
  summary_zh: 丁忧后绝意进取专一于医当道大吏四路争迎屡以道府敦迫皆善辞力却
- id: guji-于风八-event-3
  title_zh: 宣统己酉著成医医医
  date: '1909-08-01'
  year_of: 1909
  summary_zh: 秋八月发愤著成医医医三卷论朝廷世界医者之医方邮寄徐绍桢校序于江南陆军营次
- id: guji-于风八-event-death
  title_zh: 逝世
  date: '1915'
  year_of: 1915
  summary_zh: 宣统后卒年月不详其通医道治道开万世利之愿存于医医医一编
