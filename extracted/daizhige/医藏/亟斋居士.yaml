  - key: climax
    name: 补遗保赤劝善成帙
    labels:
      zh: 补遗圆成
    start_date: 1718
    highlight_event_id: guji-亟斋居士-event-supplement
  decisions:
  - date: 1717
    title_zh: 保产心法首戒交媾
    rationale: 欲火伤胎致漏下难产痘毒疮疾，故有孕即居另室绝欲以全儿质庞浓性情温良
  - date: 1718
    title_zh: 劝幼时念佛临产念观音
    rationale: 产难远因多由杀业，宿怨作障令不生，至诚念菩萨威德远避，故治未病亦治当病
events:
- id: guji-亟斋居士-event-birth
  date: 1650
  year_of: 1650
  title_zh: 降生于清初
  description_zh: 生于清初年月不详，亲见民间以难产闻者众，立志求之人事以弭人患而协天德
  is_circa: true
- id: guji-亟斋居士-event-write
  date: 1715
  year_of: 1715
  title_zh: 撰成达生编明临产试痛
  description_zh: 身经目击口授耳闻千试不爽而成帙，首载临产睡忍痛慢，辨试痛一阵紧一阵为正生，戒早用力早临盆
- id: guji-亟斋居士-event-publish
  date: 1716
  year_of: 1716
  title_zh: 刊刻广布嘱不改动
  description_zh: 剞劂布之劝好生者重刻手抄口授广布，一邑产难渐寡，嘱不必改动尤不必增入方药
- id: guji-亟斋居士-event-supplement
  date: 1718
  year_of: 1718
  title_zh: 补遗保产全婴心法
  description_zh: 补保产心法全婴心法保赤戒杀文，发明保胎绝欲及产后调护，使天下后世产母婴儿同登寿域
- id: guji-亟斋居士-event-death
  date: 1730
  year_of: 1730
  title_zh: 辞世后书屡经流通
  description_zh: 辞世年月不详，后经连氏删节简便易从及印光重印流通，福幼并附以广利济
  is_circa: true
