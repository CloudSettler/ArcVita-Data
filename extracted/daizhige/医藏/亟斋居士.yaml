  decisions:
  - date: 1715
    title_zh: 不载奇方只言其理
    rationale: 极平常之事须用极平常之药，矜奇炫异反损气血，故只载芎归佛手及睡法以保平安
  - date: 1716
    title_zh: 俚俗反复以便妇孺通晓
    rationale: 闺房日用琐屑不到即致病，故不厌烦絮使平时讲明临时有主，不改动不增药以免矛盾
- id: guji-亟斋居士-endeavor-2
  title_zh: 保胎育婴劝善广济后世
  summary_zh: 首戒交媾以保胎，补遗保产全婴心法，劝念佛戒杀以消宿现杀业，培德节欲以广流传
  phases:
  - key: brewing
    name: 察受胎远因杀业欲火
