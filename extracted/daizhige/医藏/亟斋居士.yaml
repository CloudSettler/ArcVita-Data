  - title_zh: 顺天自生与妄施人事之抉择
    description_zh: 信瓜熟蒂落待时自出安睡待产，抑或早坐草用力揉腰擦肚致横生倒产之险
  - title_zh: 平常简易与矜奇炫异之抉择
    description_zh: 守睡忍痛慢及芎归佛手平常之法，抑或逐鼠肾兔脑回生丹奇方而耗气破血遗患无穷
  lesson: 顺承天休毋以人事挠之，平时致谨预防胜于病后服药
  summary_first_person: 吾观天地大德曰生，胎产本至平至易自然而然，世人误认试痛为正生，早临盆早用力以致横倒沥浆诸险，故倡睡忍痛慢六字真言，劝保胎绝欲临产安睡忍痛，以全母子之生
  source_urls:
