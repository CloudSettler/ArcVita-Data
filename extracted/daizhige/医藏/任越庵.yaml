  description_zh: 去繁从简正定无瑕分经立论并遵柯氏成卷上全论大法
- id: guji-任越庵-event-liujing
  date: 1682
  year_of: 1682
  title_zh: 著六经正义辨地面
  description_zh: 立太阳阳明少阳太阴少阴厥阴地面以心腹为界斥叔和引热病论之误
- id: guji-任越庵-event-hebing
  date: 1685
  year_of: 1685
  title_zh: 发合并启微合病并病之旨
  description_zh: 明阴阳互根三阳底即三阴以葛根黄芩白虎四逆等分阴阳合病并病次第
- id: guji-任越庵-event-death
  date: 1695
  year_of: 1695
  title_zh: 卒后钞本传于鸿波
  description_zh: 法祖钞本藏于家后经任鸿波出示陶观永抄读识于道光壬寅
