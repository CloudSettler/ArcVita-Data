    labels:
      zh: 立说
    start_date: 1682
    highlight_event_id: guji-任越庵-event-liujing
  - key: climax
    name: 合论伤寒杂病互参并合
    labels:
      zh: 合论
    start_date: 1685
    highlight_event_id: guji-任越庵-event-hebing
  - key: closure
    name: 以兵法地理喻治法定乡
    labels:
      zh: 喻法
    start_date: 1688
    highlight_event_id: guji-任越庵-event-hebing
  decisions:
  - date: 1682
    title_zh: 舍经络取地面为经界
    rationale: 仲景六经分六区地面统百病非专主经脉热病故当以开合枢分野定表里阴阳
  - date: 1685
    title_zh: 主合病并病互参不分门类症
    rationale: 病有定体亦有变迁唯在六经求根本不在病名寻枝叶方能阴阳互根用药恰当
events:
