  year_of: 1615
  title_zh: 生于明末
  description_zh: 先世儒医家传至越公生而好古读仲景内经之书
- id: guji-任越庵-event-jiaokan
  date: 1675
  year_of: 1675
  title_zh: 校定柯氏伤寒论注翼
  description_zh: 见慈溪柯韵伯注论六卷论翼二卷阐仲景精微而刻本鱼豕遂细加校正
- id: guji-任越庵-event-chengshu
  date: 1680
  year_of: 1680
