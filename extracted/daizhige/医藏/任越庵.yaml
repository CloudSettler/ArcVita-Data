  decisions:
  - date: 1675
    title_zh: 不守鱼豕之刻而细校
    rationale: 流传翻刻错讹使观者置高阁故须正文义字句以还柯氏本意
  - date: 1680
    title_zh: 去繁从简遵柯分经
    rationale: 欲使业此者细心领会得其精义免担头箧里之弊
