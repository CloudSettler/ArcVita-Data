  title_zh: 立六经地面阐伤寒杂病合论大法
  summary_zh: 辨叔和经络之误立六经地面分野明三阳主外三阴主里合参汗吐下诸法祖述内经
  phases:
  - key: brewing
    name: 疑叔和搜采改换旧集
