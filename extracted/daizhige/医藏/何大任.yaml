  - title_zh: 家藏秘本私珍还是公传济众
    description: 先君遗藏二十卷家传六十余载，恐画蛇添足之讥，终决意订正锓版与人共之
  - title_zh: 幼科哑科难治与成人方通用之辨
    description: 小儿气质微弱不能自陈，须审天时地势经脉，又试以增汤剂通用于大人
  lesson: 保卫其生总括精微，敬而用之可保赤子
  summary_first_person: 余先君遗有小儿卫生总微论方二十卷，家藏六十余载，博访未闻流播。自婴孩至成童保卫其生极为详尽，宗族幼稚有疾每口传指授效如影响，又增汤剂用于大人亦神异，不敢掩为一家之实，遂集同志订正誊写之舛，锓于行在太医局以广其传。
