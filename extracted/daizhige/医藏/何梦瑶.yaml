    rationale: 疠流行不独治一邑当广施方药使饮者辄起存活为先不计毁誉
  - date: '1748'
    title_zh: 威刑怖之继以汤液吐下治狂
    rationale: 狂易多力热伏于内非桂附可扶当先慑其神后以承气白虎之类直折上热使邪去正安
- id: guji-何梦瑶-endeavor-2
  title_zh: 纂述医碥羽翼准绳
  summary: 少诵岐黄宦游十余年随得随录芟繁疏郁参以己见成医碥六卷以救桂附酷烈之弊羽翼王金坛证治准绳以阶梯初学
