    start_date: '1751'
    highlight_event_id: guji-何梦瑶-event-book
  decisions:
  - date: '1751'
    title_zh: 芟繁疏郁不系成方但明其理
    rationale: 论证明其所以然则所当然不言而喻初学得理则方在其中可检准绳而不惑于偏执
  - date: '1751'
    title_zh: 力辟温补酷烈明承气即回阳
    rationale: 今人不明热伏妄投桂附杀人而不怨庸黠皆用温补藏拙不得不救正河间丹溪之学补泻无定名视寒热为去留
