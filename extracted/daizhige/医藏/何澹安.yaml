endeavors:
- id: guji-何澹安-endeavor-1
  title_zh: 类中肝风眩晕证治实践
  summary: 以类中为纲辨肝风挟痰诸证创安养调治与清镇疏肝相结合之法
  phases:
  - key: brewing
    name: 临证积累类中肝风经验
    labels:
      zh:
      - 类中
      - 肝风
      - 眩晕
    start_date: 1820
    highlight_event_id: guji-何澹安-event-1
  - key: breakthrough
    name: 立疏风清镇与潜阳温补两大纲
    labels:
      zh:
      - 疏风清镇
      - 潜阳温补
    start_date: 1835
    highlight_event_id: guji-何澹安-event-1
  - key: climax
    name: 分经辨治厥阴化风成熟
    labels:
      zh:
      - 厥阴化风
      - 柔肝培本
    start_date: 1845
    highlight_event_id: guji-何澹安-event-2
  - key: closure
    name: 类中肝风医案定型流传
    labels:
      zh:
      - 医案总结
    start_date: 1855
    highlight_event_id: guji-何澹安-event-2
  decisions:
  - date: 1835
    title_zh: 肝火挟痰卒厥用疏风清镇不用骤补
    rationale: 壮时晕厥脉弦滑数者痰火壅闭上焦先清镇疏肝降气以开清窍俟动静安定再议培本
  - date: 1845
    title_zh: 命门火微阳不交阴用潜阳温补
    rationale: 鼻塞膝麻脉软者属下焦气亏命门火微宜熟地杞子胡桃苁蓉温补潜纳不可妄用凉泄伤阳
- id: guji-何澹安-endeavor-2
  title_zh: 咳嗽吐血内伤杂病纂案
  summary: 由脾肺肝肾论咳呛吐血以健中保肺柔肝为要编成咳嗽吐血诸案
  phases:
  - key: brewing
    name: 观察久咳脾泄土不生金之证
    labels:
      zh:
      - 咳嗽
      - 脾肺两虚
    start_date: 1828
    highlight_event_id: guji-何澹安-event-3
  - key: breakthrough
    name: 立健胃固表润肺保肝之法
    labels:
      zh:
      - 健中
      - 保肺
    start_date: 1840
    highlight_event_id: guji-何澹安-event-3
  - key: climax
    name: 辨咳血络伤与虚劳分别施治
    labels:
      zh:
      - 吐血
      - 络伤
    start_date: 1850
    highlight_event_id: guji-何澹安-event-3
  - key: closure
    name: 咳嗽吐血案汇编成帙
    labels:
      zh:
      - 编案存真
    start_date: 1860
    highlight_event_id: guji-何澹安-event-3
  decisions:
  - date: 1840
    title_zh: 久嗽中虚表弱先用玉屏风固表后进补
    rationale: 咳喘自汗腠理空疏者阳明气旺可固表润肠若径投凉剂则脾胃困败故先实卫后滋益
  - date: 1850
    title_zh: 络伤见血无咳呛者以平肝降气为主
    rationale: 温邪伤肺与内伤失血不同气分病者宜平肝降气佐以养阴不宜大补壅滞以免留瘀助火
events:
- id: guji-何澹安-event-birth
  type: birth
  date: 1790
  year_of: 1790
  title_zh: 生于清嘉庆年间
  description: 何澹安生于清嘉庆年间少习岐黄留心内风类中之证
- id: guji-何澹安-event-1
  type: career
  date: 1835
  year_of: 1835
  title_zh: 临证治类中肝风卒厥诸案
  description: 诊头晕体丰心悸脉动及卒然厥晕膈胀者以熟地石决明白蒺藜枣仁柔肝潜阳以羚羊角半夏天麻清镇涤痰提出安养调治以防类中
- id: guji-何澹安-event-2
  type: career
  date: 1845
  year_of: 1845
  title_zh: 系统辨治厥阴化风与眩晕头痛
  description: 辨水不涵木血虚肝郁之厥阴化风创甘露饮加减黑逍遥佐苦泄及补水柔肝諸法兼治眩晕头痛耳鸣不寐
- id: guji-何澹安-event-3
  type: career
  date: 1855
  year_of: 1855
  title_zh: 纂定咳嗽吐血医案
  description: 汇久咳膈痛喘咳稠痰及络伤吐血诸案以于术茯苓沙参川贝健中保肺以生地牛膝藕汁平肝降气成何澹安医案主体
- id: guji-何澹安-event-death
  type: death
  date: 1865
  year_of: 1865
  title_zh: 卒于清同治初年医案流传
  description: 何澹安卒后其类中肝风眩晕咳嗽吐血诸案辑为何澹安医案收入医藏流传于世
