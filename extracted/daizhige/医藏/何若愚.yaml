endeavors:
- id: guji-何若愚-endeavor-1
  title_zh: 撰指微论探经络荣卫本源
  summary: 久读难素，务法上古，探经络源流，明荣卫清浊，别孔穴部分，撰指微论三卷立针刺纲纪。
  phases:
  - key: brewing
    name: 久习难素积疑
    labels:
      zh: 读难素穷针理
    start_date: '1165'
    highlight_event_id: guji-何若愚-event-zhiweilun
  - key: breakthrough
    name: 探源别部立论
    labels:
      zh: 明荣卫别孔穴
    start_date: '1180'
    highlight_event_id: guji-何若愚-event-zhiweilun
  - key: closure
    name: 三卷初成未广传
    labels:
      zh: 指微论成
    start_date: '1185'
    highlight_event_id: guji-何若愚-event-zhiweilun
  decisions:
  - date: '1180'
    title_zh: 舍直刺而法上古
    rationale: 近世直刺不务法则劳而少功，须回法灵素以求纪纲。
  - date: '1185'
    title_zh: 以三卷统荣卫孔穴
    rationale: 非分清浊部分则补泻无据，故先立论而后立赋。
- id: guji-何若愚-endeavor-2
  title_zh: 作流注赋立子午时穴针法
  summary: 取指微论妙理，定井荥俞经合六十穴，推阴阳气血昼夜流注，按时开阖迎随补泻，成流注指微针赋百余门。
  phases:
  - key: brewing
    name: 推昼夜营运时穴
    labels:
      zh: 考井荥六十首
    start_date: '1190'
    highlight_event_id: guji-何若愚-event-liuzhufu
  - key: breakthrough
    name: 定迎随补泻开阖
    labels:
      zh: 得时为开失时为合
    start_date: '1193'
    highlight_event_id: guji-何若愚-event-liuzhufu
  - key: climax
    name: 百余门赋成传用
    labels:
      zh: 流注赋成
    start_date: '1195'
    highlight_event_id: guji-何若愚-event-ying­sui
  - key: closure
    name: 付后人注解流传
    labels:
      zh: 阎注续传
    start_date: '1200'
    highlight_event_id: guji-何若愚-event-ying­sui
  decisions:
  - date: '1193'
    title_zh: 以养子时克注穴
    rationale: 气开当补泻，气闭忌针刺，必据时干旺气以定补泻。
  - date: '1195'
    title_zh: 以赋统百余法门便讨阅
    rationale: 赜义隐奥难穷，以赋撮其枢机则虚实总附而易验于人。
