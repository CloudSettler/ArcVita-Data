  reign_ref: 金世宗大定至宣宗间
  archetype: 法古穷经之针医
  dilemmas:
  - 近世指病直刺不务法而速效与务法上古探经络源流而难传之衡
  - 博而寡要劳而少功与守时穴开阖迎随补泻以求一验之择
  lesson: 针刺须明天时气开流注，辨荣卫虚实阴阳，迎随补泻各得其部，方能移疼住痛而不劳无功。
  summary_first_person: 我久习医业，好读难素，见针刺之理尤难，博而寡要，近世多直刺不务法，故我务法上古，探经络之源，明荣卫清浊，别孔穴部分，撰指微论以成赋，立子午流注时穴之法，愿后人按时开阖而用针。
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%AD%90%E5%8D%88%E6%B5%81%E6%B3%A8%E9%92%88%E7%BB%8F.html
