  dilemmas:
  - 夏令用麻黄石膏遭时医群疑而坚持是证用是药
  - 高年结胸重证峻下攻逐与顾护正气之两难
  lesson: 审证求因，有是证即用是药，不拘时令，不惑浮议
  summary_first_person: 吾生平笃信仲景，伤风伤寒湿温皆以六经审证，证当则虽峻剂亦投，一剂中病便觉心安
