  title_zh: 以仲景经方治伤风伤寒时病
  summary: 夏冬伤寒不拘时令，审太阳少阳结胸诸证投麻黄柴胡陷胸大青龙等方
  phases:
  - key: brewing
    name: 研习伤寒奠定经方根基
    labels:
      zh:
      - 伤寒论
      - 学医
    start_date: '1935'
    highlight_event_id: guji-余无言-event-birth
  - key: breakthrough
    name: 夏令伤寒投麻黄取效
    labels:
      zh:
      - 夏令伤寒
      - 麻黄汤
    start_date: 1942-06
    highlight_event_id: guji-余无言-event-xialing-shanghan
  - key: climax
    name: 大青龙峻剂退壮热
    labels:
      zh:
      - 大青龙汤
      - 急证
    start_date: 1942-07
    highlight_event_id: guji-余无言-event-daqinglong
  - key: closure
    name: 冬令伤寒讲究煎服得汗
    labels:
      zh:
      - 冬令伤寒
      - 煎服法
    start_date: 1940-12
    highlight_event_id: guji-余无言-event-dongling-shanghan
  decisions:
  - date: 1942-06
    title_zh: 六月伤寒仍投麻黄汤加葛根藿香
    rationale: 证属太阳无汗脉浮紧，虽值夏令仍从证不从时令拘忌
  - date: 1942-07
    title_zh: 壮热烦躁用大青龙原量加石膏
    rationale: 表实里热俱重，非大汗大清不足解，具名担责以救急
- id: guji-余无言-endeavor-2
  title_zh: 治湿温化燥杂病并著医案医话
  summary: 以泻心三仁竹叶石膏等法清湿热透疹痦，兼治结胸水臌痉厥并笔录成书
  phases:
  - key: brewing
    name: 久治湿温研求三仁泻心法
    labels:
      zh:
      - 湿温
      - 三仁汤
    start_date: 1942-08
    highlight_event_id: guji-余无言-event-shiwen-huazao
  - key: breakthrough
    name: 泻心合三仁透疹通便
    labels:
      zh:
      - 化燥
      - 透疹
    start_date: 1942-08
    highlight_event_id: guji-余无言-event-shiwen-huazao
  - key: climax
    name: 桂枝加附子救自汗阳虚
    labels:
      zh:
      - 阳虚
      - 桂枝加附子汤
    start_date: 1950-03
    highlight_event_id: guji-余无言-event-guiyang-xuhan
  - key: closure
    name: 笔录医案医话诊余漫话传世
    labels:
      zh:
      - 著述
      - 医案
    start_date: '1960'
    highlight_event_id: guji-余无言-event-guiyang-xuhan
  decisions:
  - date: 1942-08
    title_zh: 湿温谵语用大黄黄连泻心合三仁
    rationale: 湿热化燥便燥疹隐，必通阳明以透邪外出
  - date: 1950-03
    title_zh: 自汗厥冷用桂枝加附子不发大汗
    rationale: 卫虚漏汗与大发汗之漏同，当温固卫阳缓取微汗
events:
- id: guji-余无言-event-birth
  date: '1900'
  year_of: 1900
  title_zh: 出生
  description: 生于二十世纪初，后业医精研仲景经方
- id: guji-余无言-event-dongling-shanghan
  date: 1940-12
  year_of: 1940
  title_zh: 冬令伤寒如法煎药得汗而解
  description: 友人邓汉城冬月正伤寒，两次煎服失法不汗，亲督慢煎取浓汁遂大汗解
- id: guji-余无言-event-xialing-shanghan
  date: 1942-06
  year_of: 1942
  title_zh: 夏令影场受寒投麻黄汤愈
  description: 杨达奎夫人秦碧筠六月观影受冷气致恶寒壮热无汗，以麻黄汤加葛根藿香及石膏一剂汗出热退
- id: guji-余无言-event-daqinglong
  date: 1942-07
  year_of: 1942
  title_zh: 夏夜纳凉壮热用大青龙汤救急
  description: 邓一东当门露卧受寒高热四十一度烦躁无汗，投大青龙汤麻黄桂枝各四钱石膏四两得大汗而痊
- id: guji-余无言-event-shiwen-huazao
  date: 1942-08
  year_of: 1942
  title_zh: 湿温化燥谵语以泻心三仁法治愈
  description: 刘庆生夏末湿温久治谵语神糊便燥疹隐，以大黄黄连泻心合三仁汤通便透疹再以竹叶石膏清余热
- id: guji-余无言-event-guiyang-xuhan
  date: 1950-03
  year_of: 1950
  title_zh: 自汗阳虚恶寒用桂枝加附子汤愈
  description: 顾芝轩卫虚自汗劳汗当风继见手足微厥，以桂枝加附子汤一剂汗止热退
- id: guji-余无言-event-death
  date: '1963'
  year_of: 1963
  title_zh: 逝世
  description: 毕生以经方活人，遗有余无言医案及医话行世后于一九六三年卒
