  decisions:
  - date: 1913
    title_zh: 马姓儿不用清宫至宝而用羚羊竹沥下法
    rationale: 病交十二日木火炽盛烁液成痰上蒙兼大便不通满腹胀痛当凉肝清胃降痰下之师仲景意不用其方
  - date: 1915
    title_zh: 录案立论以正时弊
    rationale: 神昏属胃者多属肝者亦有谵语分胃经胃腑与肝郁不可一遇神昏便作心包络治
