  decisions:
  - date: 1890
    title_zh: 阮某坠马谵语先温后凉
    rationale: 暑热为寒湿所束先辛温发汗后辛凉解热不可妄用牛黄丸引邪入里
  - date: 1900
    title_zh: 久咳以熟梨润肺风温以箬叶泄肺风寒以酒发表
    rationale: 知理知物性则寻常食物皆可为药当随脉证寒热施治
- id: guji-余景和-endeavor-2
  title_zh: 著论破温病专属心包之说
  summary: 考内经金匮诸家论神昏谵语多属胃间属肝而撰案以正叶吴成法
  phases:
  - key: brewing
    name: 疑叶吴简法
