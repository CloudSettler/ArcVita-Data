  decisions:
  - date: 1764
    title_zh: 弃举子业专务岐黄
    rationale: 先君染时疫为群医所误，悟伤寒法治疫必毙，遂遍览十三科究阴阳运气独悟疫疹
  - date: 1780
    title_zh: 坚持重用生熟石膏
    rationale: 本草言石膏大清胃热能表肌热能泄实热，临症由三五钱至二三两无不应手辄效，虽谤谓非石膏不立剂亦不移
- id: guji-余霖-endeavor-2
  title_zh: 著述刊刻疫疹一得
  summary_zh: 参合司天大运主气著书一卷，蒙庄锦蔡曾源张若吴贻等序助梓行以广其传
  phases:
  - key: brewing
