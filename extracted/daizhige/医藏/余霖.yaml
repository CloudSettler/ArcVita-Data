  decisions:
  - date: 1794-03
    title_zh: 参合运气著为一得
    rationale: 一人之治有限因人及人无穷，欲以刍荛之见公之于人使天下病疫者起死回生稍释终天之恨
  - date: 1794-07
    title_zh: 付梓公世不私独得
    rationale: 契好咸谓此书不宜独秘遂助金付梓，俾悬壶者咸得一得以辨证立方跻斯人于仁寿
events:
- id: guji-余霖-event-birth
  date: 1725
  year_of: 1725
  kind: birth
  title_zh: 生于桐城余氏
  description_zh: 幼读鲁论志隐居求志行义达道，力学二十余年屡踬名场，总角蒙庭训留心医道
- id: guji-余霖-event-1764-father
  date: 1764
  year_of: 1764
  kind: career
  title_zh: 甲申客中州父疫误治
  description_zh: 桐邑大疫先君染时疫为群医以伤寒法治之而误，奔丧回里查看诸方总不外三法，遂益肆力古书研究运气恍悟石膏治热疫
- id: guji-余霖-event-1780-heal
  date: 1780
  year_of: 1780
  kind: career
  title_zh: 南北行医屡起沉疴
  description_zh: 自南而北遇疫疹辄投石膏黄连等剂，得之则生不得则死，所全活不可数计，都门时疫十室而九活于其手
- id: guji-余霖-event-1794-book
  date: 1794-03
  year_of: 1794
  kind: achievement
  title_zh: 甲寅季春著成疫疹一得
  description_zh: 参合司天大运主气小运著为一卷，自叙谓疫乃无形之毒宜用石膏不宜用硝黄，名曰一得示不敢自矜
- id: guji-余霖-event-1794-print
  date: 1794-07
  year_of: 1794
  kind: achievement
  title_zh: 津门付梓众序广传
  description_zh: 需次芦鹾见误于此症者众，庄锦蔡曾源张若吴贻等各为序，助金付梓于津门旅次以广其传
- id: guji-余霖-event-death
  date: 1800
  year_of: 1800
  kind: death
  title_zh: 卒于嘉庆初年之后
  description_zh: 甲寅年将七十貌古神腴得摄生之术，书成梓行后卒年不详，遗书以石膏治疫疹之法行于世
