  birth_date: 1725
  death_date: 1800
  era: 清
  reign_ref: 乾隆
  archetype: 济世医者
  dilemmas:
  - 屡踬名场当穷经皓首终为童子试抑或弃儒为医以行隐居求志行义达道之愿
  - 世守伤寒六经类治疫疹而多误当遵成方抑或独用石膏重剂以清无形之毒虽遭众谤不移
  lesson: 疫与伤寒寒热悬殊辨疫当参运气而重石膏清胃先立其方预断传变方能起死回生
  summary_first_person: 我桐城余霖字师愚，少力学二十余年屡踬名场，遂究心灵素专务岐黄，甲申客中州先君误于群医，益肆力古书参合运气，悟非石膏不足治热疫，三十年来南北活人无数，乃著疫疹一得公之天下，愿病斯疫者咸登寿域
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%96%AB%E7%96%B9%E4%B8%80%E5%BE%97.html
