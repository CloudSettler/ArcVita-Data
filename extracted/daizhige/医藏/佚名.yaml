    death:
      date: 1720-01-01
      precision: year
      is_circa: true
      raw: 清初至乾隆初约卒
  birth_date: 1650-01-01
  death_date: 1720-01-01
  era: 清代
  reign_ref: 康熙至乾隆间
  archetype: 喉科医家
  dilemmas:
  - title_zh: 真火虚火真寒相混
    description: 喉痹皆指相火而有实火虚火格阳真寒之异，误清误温皆能杀人，何以察脉证情志而别治
  - title_zh: 乳蛾缠喉形近治异
    description: 双鹅单鹅圆突如珠多须刺血出毒，缠喉满喉红肿但使火降肿消，何以辨痈疖与风热而不妄针
  lesson: 喉为一身总关，上病须察下，辨经络虚实阴阳，不可概从火清，亦不可妄攻妄补
  summary_first_person: 我观喉痹世皆言火，然火有真假虚实，少阳厥阴多热，阳明火盛，少阴则有虚实寒热之大异，我乃察情志口腹酒色劳欲之源，辨左右经络色膜核点声息之形，录双松单松燕子鹅喉缠喉以至木舌重舌等四十六症，立升提驱风解毒清凉之大法，戒攻下热燥收敛，欲使毒在咽喉而得救，不使归脏而难全
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%96%89%E8%88%8C%E5%A4%87%E8%A6%81%E7%A7%98%E6%97%A8.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%96%89%E8%88%8C%E5%A4%87%E8%A6%81%E7%A7%98%E6%97%A8.html
endeavors:
- id: guji-佚名-endeavor-1
  title_zh: 喉痹虚实经络辨证体系创立
  description: 驳十八证皆作相火之旧说，立少阳少阴阳明厥阴分经，辨实火虚火水亏格阳诸证，明上病察下之义
  phases:
  - key: brewing
    name: 博览古方察火真假
    start_date: 1650-01-01
    highlight_event_id: guji-佚名-event-birth
    labels:
      zh:
      - 博览
      - 察火
  - key: breakthrough
    name: 分经辨虚实立纲
    start_date: 1685-06-01
    highlight_event_id: guji-佚名-event-lunhoushi
    labels:
      zh:
      - 分经
      - 辨证
  - key: climax
    name: 别乳蛾缠喉治法
    start_date: 1690-01-01
    highlight_event_id: guji-佚名-event-lunhoushi
    labels:
      zh:
      - 别形
      - 立法
  - key: closure
    name: 垂训上病察下
    start_date: 1692-01-01
    highlight_event_id: guji-佚名-event-lunhoushi
    labels:
      zh:
      - 垂训
      - 守正
  decisions:
  - date: 1685-06-01
    title_zh: 不概从火断分虚实寒热
    rationale: 实火可清，肾虚水亏须壮水，无根格阳须温补命门，不可类从火清
  - date: 1690-01-01
    title_zh: 乳蛾刺血缠喉降火
    rationale: 双鹅单鹅圆突如珠系痈疖结喉宜刺血出毒，缠喉红肿不成脓但使火降肿消
- id: guji-佚名-endeavor-2
  title_zh: 四十六喉症谱系编撰
  description: 统喉口舌齿鼻耳之变，详左右先后色膜核点声息，录松燕鹅缠悬蜞合架以至胎毒锁子等症，立阴阳诀与升提解毒通法
  phases:
  - key: brewing
    name: 采喉症形色声息
    start_date: 1693-01-01
    highlight_event_id: guji-佚名-event-lunhoushi
    labels:
      zh:
      - 采症
      - 观形
  - key: breakthrough
    name: 定左右经络治则
    start_date: 1698-01-01
    highlight_event_id: guji-佚名-event-sishiliuzheng
    labels:
      zh:
      - 定经
      - 配药
  - key: climax
    name: 编成四十六症辨治
    start_date: 1700-03-01
    highlight_event_id: guji-佚名-event-sishiliuzheng
    labels:
      zh:
      - 编症
      - 明禁
  - key: closure
    name: 作阴阳诀示后人
    start_date: 1702-01-01
    highlight_event_id: guji-佚名-event-sishiliuzheng
    labels:
      zh:
      - 辨阴阳
      - 示戒
  decisions:
  - date: 1698-01-01
    title_zh: 左肝右肺心舌脾唇肾齿分治
    rationale: 左先起属肝用柴胡白芍，右先起属肺用黄芩桑皮，心用连栀，满喉黄属脾湿黑属肾险，须各从脏腑治源
  - date: 1700-03-01
    title_zh: 守升提解毒戒攻补收
    rationale: 诸症惟可升提驱风发散解毒清凉，切不可攻下通利及补托热燥收敛，毒在咽喉犹可救，归脏则难全
events:
- id: guji-佚名-event-birth
  title_zh: 诞生于清初
  date: 1650-01-01
  year_of: 1650
  type: birth
  description: 约康熙年间生，家世不传，好医方，尤究喉科，察嗜欲饮食劳郁致病之源
- id: guji-佚名-event-lunhoushi
  title_zh: 撰论喉症辨虚实经络
  date: 1685-06-01
  year_of: 1685
  type: career
  description: 著论喉症篇，言少阳少阴阳明厥阴皆有喉痹，辨实火虚火格阳真寒，论单双乳鹅缠喉之异，宗内经太阳在泉寒淫嗌肿之义及褚氏上病察下之说
- id: guji-佚名-event-sishiliuzheng
  title_zh: 编定喉症总论及四十六症
  date: 1700-03-01
  year_of: 1700
  type: career
  description: 作喉症总论辨喉症经络治法，详五味伤脏五音属脏腑之理，次第录双松单松燕子鹅喉缠喉悬蜞合架圹瘰乘枕斗底联珠以至木舌重舌喉痈胎毒锁子等四十六症，立甘桔玉龙犀角地黄诸方加减，作辨阳喉阴喉诀及论症治法，示白膜黄膜气响声哑等可治不可治之候
- id: guji-佚名-event-death
  title_zh: 卒后遗书传世
  date: 1720-01-01
  year_of: 1720
  type: death
  description: 约卒于康熙末乾隆初，姓名不传，惟喉舌备要秘旨喉部诸篇传世，为后世喉科辨形色经络之秘旨
