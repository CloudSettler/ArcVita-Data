endeavors:
- id: guji-佚名-endeavor-1
  title_zh: 调经求子立济阴丹方体系
  summary: 以经信为主论血热先期血寒过期详抑气四物及三丹补宫济阴之法
  phases:
  - key: brewing
    name: 察心性审虚实寒热
    labels:
      zh: 调心调经
    start_date: 1550
    highlight_event_id: guji-佚名-event-tiaojing
  - key: breakthrough
    name: 制百病济阴补宫益阴三丹
    labels:
      zh: 制方立丹
    start_date: 1560
    highlight_event_id: guji-佚名-event-zhidan
  - key: climax
    name: 定服丸戒忌以候受胎
    labels:
      zh: 候胎有准
    start_date: 1565
    highlight_event_id: guji-佚名-event-zhidan
  - key: closure
    name: 补母益子以全胎元
    labels:
      zh: 培元保寿
    start_date: 1570
    highlight_event_id: guji-佚名-event-bumu
  decisions:
  - date: 1550
    title_zh: 以经信为主先服汤后服丸
    rationale: 荣卫不实则经乱先汤后丸论虚实服以和气血
  - date: 1560
    title_zh: 制三丹不增减分两贵贱
    rationale: 滋养血气密腠理实脏腑治风虚痼冷须守方制米丸
- id: guji-佚名-endeavor-2
  title_zh: 妊娠安胎救胎产诸危症
  summary: 论恶阻胎动胎漏子悬子淋子痫等症立安胎和气诸方守三禁之戒
  phases:
  - key: brewing
    name: 辨恶阻胎动不安之源
    labels:
      zh: 顺气理血
    start_date: 1560
    highlight_event_id: guji-佚名-event-antai
  - key: breakthrough
    name: 立安胎饮桑寄生散等方
    labels:
      zh: 调母固胎
    start_date: 1568
    highlight_event_id: guji-佚名-event-antai
  - key: climax
    name: 治胎漏子悬水肿子淋转胞
    labels:
      zh: 救危安胎
    start_date: 1575
    highlight_event_id: guji-佚名-event-jiuhu
  - key: closure
    name: 申三禁戒堕胎燥热之剂
    labels:
      zh: 三禁为准
    start_date: 1580
    highlight_event_id: guji-佚名-event-jiuhu
  decisions:
  - date: 1568
    title_zh: 固胎在调母按月调血气
    rationale: 感冒跌扑另调余皆视虚实调母则无坠胎之患
  - date: 1575
    title_zh: 守三禁不用堕胎燥热之剂
    rationale: 不犯胃气及上二焦荣卫自和寒热止为胎产准绳
events:
- id: guji-佚名-event-birth
  date: 1520
  year_of: 1520
  title_zh: 生于明中叶医家
  description: 家传女科技艺相授习妇人经产之法
- id: guji-佚名-event-tiaojing
  date: 1550
  year_of: 1550
  title_zh: 立论调经为先
  description: 论血盛气衰为顺详先期血热过期血寒审虚实寒热而调之
- id: guji-佚名-event-zhidan
  date: 1560
  year_of: 1560
  title_zh: 制济阴补宫益阴三丹
  description: 制百病济阴丹济阴补宫丸滋阴大补丹配抑气散四物汤以求子
- id: guji-佚名-event-bumu
  date: 1570
  year_of: 1570
  title_zh: 立补母益子大造丸法
  description: 论屡产无气育而不寿在父母元气不足立补母益子方及大造丸
- id: guji-佚名-event-antai
  date: 1568
  year_of: 1568
  title_zh: 著妊娠安胎诸方
  description: 治恶阻胎动不安立参橘缩砂杜仲如圣安胎饮守调母之法
- id: guji-佚名-event-jiuhu
  date: 1575
  year_of: 1575
  title_zh: 救胎漏子悬水肿危症
  description: 立桑寄生散紫苏饮鲤鱼汤安荣散羚羊角散等方辨三禁以保子母
- id: guji-佚名-event-death
  date: 1600
  year_of: 1600
  title_zh: 卒于明末经验传世
  description: 家传女科经验摘奇成书流传以调经安胎济阴诸法惠后世
