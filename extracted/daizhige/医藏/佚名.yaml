  - 血盛气衰为顺血衰气盛为逆何以调和阴阳使经候如期
  - 妇人忧恚抑郁难解何以调心气为先而后投药保胎全寿
  lesson: 调经为先调母固胎心性和平方易受孕安胎全寿
