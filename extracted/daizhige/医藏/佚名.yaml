    description: 和剂局方流传既广而诸药性味主治散见诸家亟需总论以统之
  - title_zh: 玉石金石毒效并存
    description: 丹砂水银雄黄硫黄等效验显著而毒性畏恶分明如何示人趋利避害
  lesson: 博采本经药性论日华子诸家之说以性味主治畏恶为纲使局方用药有据
  summary_first_person: 吾生于元世潜心医方见和剂局方行于世而药性未有总括遂博采本经诸家之论以玉石部为首详列性味主治兼明畏恶使后人用药知所从违此吾所以作药性总论之志也
