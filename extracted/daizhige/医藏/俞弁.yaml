  summary_first_person: 吾俞弁字子容自附守约吴人癖于论医或闻师友讲谈或披阅诸史百家凡会于心辄手抄备忘积久成帙十卷名曰续医说先经始事后经终义系以经脉辩症症辩剂系以余得前烈参时贤系以某人以示无专无私无掩略节取要讲于家塾愿与好事者共之
