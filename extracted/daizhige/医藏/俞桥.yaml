person:
  qid: guji-俞桥
  name_zh: 俞桥
  names:
    zh: 俞桥
    en: Yu Qiao
  lifespan:
    birth:
      date: '1520'
      precision: year
      is_circa: true
      raw: 明中期嘉靖前后生
    death:
      date: '1585'
      precision: year
      is_circa: true
      raw: 明后期万历前后卒
  birth_date: '1520'
  death_date: '1585'
  era: 明
  reign_ref: 嘉靖
  archetype: 济世医者
  dilemmas:
  - 世间求嗣心切而种子诸方或偏寒或偏热务张其功反致求全之毁何以立中正可守之法
  - 男子嗜欲无节精气微薄女子阴血衰弱经候失常何以调理精血以复生育之常
  lesson: 得其养则硗者肥瘠者沃寡欲储精调和阴阳则无不可父之男无不可母之女
  summary_first_person: 吾俞桥生于明时目见世人艰于嗣续而庸方偏执害人深矣乃积平日所闻缙绅方士之说质诸古今名家论议著调理精血直指真源男女服药三论绘阴阳虚实四图合用方法三十五道附金锁思仙丹玉钥启荣丸诸灵验秘方号曰广嗣要语惟愿天下人守投虚之法寡欲养正以成螽斯之庆
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%B9%BF%E5%97%A3%E8%A6%81%E8%AF%AD.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%B9%BF%E5%97%A3%E8%A6%81%E8%AF%AD.html
endeavors:
- id: guji-俞桥-endeavor-1
  title_zh: 缉著广嗣要语立三论四图以明种子真源
  summary: 博采方士缙绅之说参合古今医论著总论及三论四图定经后三日投虚必孕之法以正种子之源
  phases:
  - key: brewing
    name: 博采种子之说质诸古今
    labels:
      zh: 酝酿
    start_date: '1545'
    highlight_event_id: guji-俞桥-event-career-1
  - key: breakthrough
    name: 立调理精血直指真源男女服药三论
    labels:
      zh: 创立
    start_date: '1555'
    highlight_event_id: guji-俞桥-event-career-1
  - key: climax
    name: 绘实阳虚阴弱阴微阳四图定交会宜忌
    labels:
      zh: 弘宣
    start_date: '1560'
    highlight_event_id: guji-俞桥-event-career-1
  - key: closure
    name: 合三十五道方法成书号曰广嗣要语
    labels:
      zh: 守成
    start_date: '1562'
    highlight_event_id: guji-俞桥-event-career-1
  decisions:
  - date: '1555'
    title_zh: 以精血充满无病为求嗣之要立调理之纲
    rationale: 孤阳不生独阴不成精兼气血兼水火总属肾与命门故先辨阴阳虚实而后可言种子
  - date: '1560'
    title_zh: 以经净三日内交合为的定投虚之法
    rationale: 经尽一日至三日新血未盛精胜其血必成男胎阴阳和平交而必孕故当俯拾其时戒暴怒醉饱以全静一之气
- id: guji-俞桥-endeavor-2
  title_zh: 创制调元调经安胎便产诸方以济嗣育
  summary: 制金锁思仙丹收固真阴制玉钥启荣丸鼓作微阳分调元调经安胎便产诸门附转女为男法以全生育之用
  phases:
  - key: brewing
    name: 察男子易失女子弗孕之苦究培养之术
    labels:
      zh: 酝酿
    start_date: '1558'
    highlight_event_id: guji-俞桥-event-career-2
  - key: breakthrough
    name: 制思仙丹启荣丸分男女调护之剂
    labels:
      zh: 创立
    start_date: '1562'
    highlight_event_id: guji-俞桥-event-career-2
  - key: climax
    name: 分调元调经安胎便产救难产保胎气
    labels:
      zh: 弘宣
    start_date: '1565'
    highlight_event_id: guji-俞桥-event-career-2
  - key: closure
    name: 附灵验秘方及诊妊歌以广其传
    labels:
      zh: 守成
    start_date: '1570'
    highlight_event_id: guji-俞桥-event-career-2
  decisions:
  - date: '1562'
    title_zh: 男子用思仙丹收固真阴女子用启荣丸调和气血
    rationale: 男子以阳用事忌过温助阳女子以阴用事忌过寒益阴故一涩以去脱一鼓微阳以为持久发育之计不蹈偏寒偏热之弊
  - date: '1565'
    title_zh: 妊娠七八月束胎八九月宽气临月瘦胎分施达生救生诸方
    rationale: 胎气展大则难产肥厚则壅隘瘦怯则不宜破气故按月按质扶母气紧束儿胎受妊后镇静远欲禁大冷大热以安长养
events:
- id: guji-俞桥-event-birth
  title_zh: 俞桥生于明中期
  type: birth
  date: '1520'
  year_of: 1520
  description: 明嘉靖前后俞桥生于江南医家之门少习岐黄旁通方士缙绅种子之说
- id: guji-俞桥-event-career-1
  title_zh: 著成广嗣要语明三论四图种子大法
  type: career
  date: '1562'
  year_of: 1562
  description: 俞桥积平日所闻质诸古今成调理精血直指真源男女服药三论及实阳入虚阴等四图合三十五道方法号曰广嗣要语引罗天益雪中护果以明天人可转移之理
- id: guji-俞桥-event-career-2
  title_zh: 创思仙启荣诸方分调元安胎便产诸门
  type: career
  date: '1565'
  year_of: 1565
  description: 俞桥制秘传金锁思仙丹以莲蕊鸡头石莲金樱收固男子真阴制玉钥启荣丸以参术归芎调女子气血又立还少巨胜大补阴虎潜八味补天及四物加减安胎饮束胎枳壳达生救生催生夺命诸法并录诊妊歌以全书
- id: guji-俞桥-event-death
  title_zh: 俞桥卒于明万历前后书传于世
  type: death
  date: '1585'
  year_of: 1585
  description: 俞桥晚年以广嗣要语传世而卒其书列医藏流布天下后世求嗣者多宗其投虚寡欲调摄之训
