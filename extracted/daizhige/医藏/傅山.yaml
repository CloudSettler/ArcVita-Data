    highlight_event_id: guji-傅山-event-2
  decisions:
  - date: '1655'
    title_zh: 阳痈急消不用虎狼
    rationale: 背痈初起红肿高突属阳毒初萌，以忍冬地丁花粉和解消散，三剂全消，保全真元不致耗损变病
  - date: '1660'
    title_zh: 阴痈大补变阴为阳
    rationale: 背肿如山隐隐发红属正气大虚阴痈，以金银花八两人参黄芪附子大补气血，佐柴胡荆芥开郁，三剂变阳而消
  - date: '1665'
    title_zh: 溃后舍攻专补胃气
    rationale: 溃烂洞见肺腑之后内外皆虚，以十全大补加减转败回生之法补气血阴阳，使毒散血生肉长皮合
- id: guji-傅山-endeavor-2
  title_zh: 明亡不仕隐逸行医
  summary_zh: 国变之后坚守遗民气节，拒受清职，以医儒道兼修之身，行医太原京师之间，著述以存济世之心
  phases:
  - key: brewing
    name: 国变守志
    labels:
      zh: 遗民之节
    start_date: '1644'
    highlight_event_id: guji-傅山-event-1
  - key: breakthrough
    name: 以医自活
    labels:
      zh: 悬壶济世
    start_date: '1650'
    highlight_event_id: guji-傅山-event-1
  - key: climax
    name: 著述传道
    labels:
      zh: 医道并传
    start_date: '1660'
    highlight_event_id: guji-傅山-event-2
  - key: closure
    name: 高寿考终
    labels:
      zh: 全节而归
    start_date: '1684'
    highlight_event_id: guji-傅山-event-death
  decisions:
  - date: '1644'
    title_zh: 不仕新朝隐居养母
    rationale: 明社既屋，不忍易节，以布衣寒士奉母行医，保全名节胜于富贵功名
  - date: '1655'
    title_zh: 以医载道不没人善
    rationale: 得石道人潘子原本青囊秘诀，虽不知姓氏而不没其善，抄录校以洞天奥旨之法，使无名氏之书得传于世
