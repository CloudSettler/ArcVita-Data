      - 产后
    start_date: 1672-01-01
    highlight_event_id: guji-傅山-event-nvke
  decisions:
  - date: 1660-01-01
    title_zh: 立脾胃肝三经同治完带汤
    rationale: 白带本于脾虚肝郁湿陷，当补脾舒肝升提而不徒止涩
  - date: 1672-01-01
    title_zh: 分上下卷系统论治妇科
    rationale: 妇科难于辨症，须明病原分带下血崩调经种子妊娠产后以立法
