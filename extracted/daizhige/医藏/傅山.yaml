    title_zh: 太原艰难存活不附新朝
    rationale: 国变后以气节自持，不以富贵易初心
  - date: 1678-03-01
    title_zh: 以病坚辞博学鸿词之征
    rationale: 不为新朝用以全故国遗民之节
