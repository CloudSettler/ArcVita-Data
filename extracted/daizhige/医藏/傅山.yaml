  birth_date: '1607'
  death_date: '1684'
  era: 明末清初
  reign_ref: 康熙
  archetype: 隐逸医家
  dilemmas:
  - title_zh: 仕隐之辨
    description_zh: 明亡之后坚不仕清，以行医著述全气节，甘守清贫而不改其志
  - title_zh: 阴阳之辨
    description_zh: 外科痈疡外小内大，阳症似重而实轻，阴症似轻而实重，先阴变阳者生，先阳变阴者死，投药稍误即至横决
  lesson: 救痈如救火，辨阴阳于毫末，阳毒宜和解消散，阴毒须大补气血以变阴为阳，既溃之后全在顾护胃气，不可徒恃攻毒
  summary_first_person: 我是傅山，字青主，山西太原人，明亡不仕，隐于医道。我阅石道人所传青囊秘诀，见其议论纯正，试之对口痔漏无不应手，遂挥汗抄录傳世。我论七情六欲六淫为病之源，作痈疡总歌五善五恶之诀，尤详背痈肺痈阴阳辨证，立急消汤变阳汤转败汤生肤散诸方，欲以王霸并施、补正祛邪之法，活人于溃烂垂危之际。
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E9%9D%92%E5%9B%8A%E7%A7%98%E8%AF%80.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%9D%92%E5%9B%8A%E7%A7%98%E8%AF%80.md
endeavors:
- id: guji-傅山-endeavor-1
  title_zh: 辨痈疡阴阳传青囊秘诀
  summary_zh: 抄录校订青囊秘诀，立七情六淫与痈疡总歌纲领，分背痈肺痈阴阳治法，创急消变阳转败生肤诸方
  phases:
