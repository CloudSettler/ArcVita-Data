endeavors:
- id: guji-傅山-endeavor-1
  title_zh: 伏阙讼师坚节不仕
  summary_zh: 年十四入庠受知袁继咸，崇祯丙子徒步千里伏阙讼师冤，明亡绝意进取为道士，康熙博学宏词征聘坚辞授官放归
  phases:
  - key: brewing
    name: 三立受知
    labels:
      zh: 入庠受知
    start_date: '1628'
    highlight_event_id: guji-傅山-event-birth
  - key: breakthrough
    name: 伏阙讼冤
    labels:
      zh: 讼冤扬名
    start_date: '1636'
    highlight_event_id: guji-傅山-event-songyuan
  - key: climax
    name: 国变隐沦
    labels:
      zh: 弃儒入道
    start_date: '1644'
    highlight_event_id: guji-傅山-event-yinlun
  - key: closure
    name: 辞聘放归
    labels:
      zh: 辞荣全节
    start_date: '1678'
    highlight_event_id: guji-傅山-event-zhengpin
  decisions:
  - date: '1636'
    title_zh: 徒步伏阙讼袁师冤
    rationale: 师恩如父受诬下狱，转徙自匿百折不回，以忠义明师生大伦
  - date: '1678'
    title_zh: 称病拒试受官即归
    rationale: 已心寄长林丰草不以青紫为荣，卧邸不赴试以全遗民之节
- id: guji-傅山-endeavor-2
  title_zh: 精医著述兼善天下
  summary_zh: 精岐黄邃脉理通以儒义，踵门求医贵贱一视，著女科大小诸证方论杂症方论，门人后学编为男科流传救世
  phases:
  - key: brewing
    name: 邃于脉理
    labels:
      zh: 儒医会通
    start_date: '1644'
    highlight_event_id: guji-傅山-event-yinlun
  - key: breakthrough
    name: 活人无算
    labels:
      zh: 行医济世
    start_date: '1650'
    highlight_event_id: guji-傅山-event-yinlun
  - key: climax
    name: 方论传世
    labels:
      zh: 女科男科
    start_date: '1660'
    highlight_event_id: guji-傅山-event-zhengpin
  - key: closure
    name: 校刊广传
    labels:
      zh: 户藏一编
    start_date: '1863'
    highlight_event_id: guji-傅山-event-zhengpin
  decisions:
  - date: '1650'
    title_zh: 以医为兼善之柄
    rationale: 生当丧乱无治国之柄，愿以良医培养元气救民于呼吸间
  - date: '1660'
    title_zh: 只言病形不玄脉理
    rationale: 使人一望即知寒热虚实，深入显出以便世人持方救世传世
events:
- id: guji-傅山-event-birth
  title_zh: 生于阳曲傅氏
  date: '1607'
  year_of: 1607
  place_zh: 太原阳曲
  summary_zh: 祖霖官参议父之谟授徒，生而颖异十行并下，十四岁督学拔入庠受知袁继咸
- id: guji-傅山-event-songyuan
  title_zh: 伏阙讼袁继咸冤
  date: '1636'
  year_of: 1636
  place_zh: 京师阙下
  summary_zh: 袁继咸被诬下狱，徒步走千里伏阙上书，敝衣转徙百折不回，冤得白义声闻天下
- id: guji-傅山-event-yinlun
  title_zh: 明亡为黄冠行医
  date: '1644'
  year_of: 1644
  place_zh: 平定祁汾之间
  summary_zh: 李自成犯阙庄烈殉国，绝意进取弃青衿为黄冠号石道人，工诗文书画精岐黄踵门求医者满
- id: guji-傅山-event-zhengpin
  title_zh: 征聘入都授官放归
  date: '1678'
  year_of: 1678
  place_zh: 京师至阳曲
  summary_zh: 康熙戊午诏举博学宏词，肩舆入都卧邸不赴试，明年授内阁中书存问放归，愈澹泊居远村
- id: guji-傅山-event-death
  title_zh: 卒于家远近会葬
  date: '1684'
  year_of: 1684
  place_zh: 阳曲
  summary_zh: 放归六年卒，远近会葬者数千百人，所著性史十三经字区周易偶释等及女科男科方论传世
