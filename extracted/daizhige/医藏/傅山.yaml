  birth_date: '1607'
  death_date: '1684'
  era: 明末清初
  reign_ref: 崇祯至康熙
  archetype: 遗民良医
  dilemmas:
  - 知己蒙难则伏阙讼冤不避死，异代征聘则称病坚辞不为官
  - 国破家窭则安贫乐道不问田产，病者踵门则贵贱一视救死扶伤
  lesson: 穷则独善守节，达则以医兼善，忠孝诚实可通于岐黄
  summary_first_person: 吾傅山字青主阳曲人也，少受知于袁临候师，丙子徒步伏阙白师冤而义声闻天下，明亡弃青衿为黄冠号石道人，精岐黄通儒义以医活人，著女科方论传世，康熙征聘授内阁中书得放归，澹泊以终
