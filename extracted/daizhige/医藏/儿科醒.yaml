  decisions:
  - date: '1760'
    title_zh: 以望闻问切为纲揭表里寒热虚实
    rationale: 小儿病情难测面部手纹渺昧难凭故专以四诊为延医之要以免颠倒混施
  - date: '1770'
    title_zh: 立辨惊风之误与不可饿论
    rationale: 前人凿空谈惊风近世谓有病宜饿遗祸无已故引圣经贤论大破其惑以救夭札
- id: guji-儿科醒-endeavor-2
  title_zh: 戒寒凉攻下推广种痘济贫
  description: 痛斥痘疹正宗寒凉攻下之害主张不事寒凉攻下并广为贫家儿女种痘以避危就安
  phases:
  - key: brewing
    name: 目击痘疹夭亡
    labels:
      zh: 萌芽
    start_date: '1765'
    highlight_event_id: guji-儿科醒-event-3
  - key: breakthrough
    name: 明种痘万全良法
    labels:
      zh: 突破
    start_date: '1770'
    highlight_event_id: guji-儿科醒-event-3
  - key: climax
    name: 堂中广种奏全功
    labels:
      zh: 高潮
    start_date: '1771'
    highlight_event_id: guji-儿科醒-event-3
  - key: closure
    name: 载章程劝仁人遍行
    labels:
      zh: 收束
    start_date: '1772'
    highlight_event_id: guji-儿科醒-event-3
  decisions:
  - date: '1770'
    title_zh: 治痘不事寒凉攻下
    rationale: 自痘疹正宗出死者更多故以保护元气为主少少与方贵在与病相值
  - date: '1771'
    title_zh: 为单寒之子广种痘
    rationale: 有力之家固知早种贫家欲种弗能故举行广种悉奏全功以造福群生
events:
- id: guji-儿科醒-event-birth
  date: '1720'
  year_of: '1720'
  title_zh: 诞生于清代
  description: 禀天地正气而生后习儿医知今昔气运不同禀赋愈薄
- id: guji-儿科醒-event-1
  date: '1745'
  year_of: '1745'
  title_zh: 师从华阳山人受命撰儿科书
  description: 受师意悯童稚无辜挽当时陋习综前贤奥旨别径分门
- id: guji-儿科醒-event-2
  date: '1770'
  year_of: '1770'
  title_zh: 撰成儿科醒总论至治疹十二论
  description: 列总论延医法表里寒热虚实辨惊风不可饿治痘治疹并附参苏饮惺惺散理中汤诸方
- id: guji-儿科醒-event-3
  date: '1771'
  year_of: '1771'
  title_zh: 推行种痘广济贫家儿女
  description: 堂中举行种痘章程载于治痘论中悉奏全功劝有力仁人在在行之
