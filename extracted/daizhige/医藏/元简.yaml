endeavors:
- id: guji-元简-endeavor-1
  title_zh: 辑金匮要略义例校注四本采撷六家
  summary: 以宋本徐熔本俞稿本赵开美本为底，采徐彬程林沈明宗魏荔彤尤怡医宗金鉴之说，一如伤寒辑义体例，成金匮玉函要略辑义上中下
  phases:
  - key: brewing
    name: 属草发凡
    labels:
      zh:
      - 校本
      - 发凡
    start_date: 1806-09-10
    highlight_event_id: guji-元简-event-draft-1806
  - key: breakthrough
    name: 采辑注家
    labels:
      zh:
      - 辑义
      - 会通
    start_date: 1807-01-01
    highlight_event_id: guji-元简-event-draft-1806
  - key: closure
    name: 讫功授儿对读
    labels:
      zh:
      - 付梓
      - 传家
    start_date: 1810-08-06
    highlight_event_id: guji-元简-event-complete-1810
  decisions:
  - date: 1806-09-10
    title_zh: 定四本互校之法
    rationale: 宋本不载杂疗以下，徐俞赵各有异同，非参校不能得真，故并列四本以正讹舛
  - date: 1807-03-01
    title_zh: 定一如伤寒辑义体例不别作序例
    rationale: 恐考据未确舛漏犹多，不敢示大方，聊授儿辈，故守成例以便检用
- id: guji-元简-endeavor-2
  title_zh: 作综概辨金匮玉函原流真伪
  summary: 考伤寒杂病十六卷之分合，王洙蠹简得书，林亿校正沿革，辨葛洪玉函方与唐人标题之异，会通仲景群方之祖地位
  phases:
  - key: brewing
    name: 十年构思综概
    labels:
      zh:
      - 原流
      - 考证
    start_date: 1784-01-01
    highlight_event_id: guji-元简-event-zonggai-1794
  - key: climax
    name: 日光山中定论
    labels:
      zh:
      - 辨伪
      - 立论
    start_date: 1794-02-28
    highlight_event_id: guji-元简-event-zonggai-1794
  - key: closure
    name: 揭卷首以示来学
    labels:
      zh:
      - 刊行
      - 示学
    start_date: 1810-08-06
    highlight_event_id: guji-元简-event-complete-1810
  decisions:
  - date: 1794-02-28
    title_zh: 存疑不删以存古
    rationale: 要略中不合绳墨者及宋人附方，疑非仲景原方，然千金外台多引仲景，宜存而不议，不效程林辈肆意删改
  - date: 1794-02-28
    title_zh: 断金匮玉函出葛洪而唐人取以标题
    rationale: 抱朴子肘后序有玉函金匮百卷之目，隋唐志无仲景金匮玉函，故定为唐人尊宗仲景者取葛氏书名以珍秘之
