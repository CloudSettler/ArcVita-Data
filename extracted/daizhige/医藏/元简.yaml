  - 金匮方论与伤寒论暌离孤处五百年，如何使华剑复合昌镜再圆
  - 要略中方论多有不合绳墨者，存而不议以存古还是肆意删改以复古
  lesson: 博采宋本徐本俞稿赵本及诸家注义，以考据存仲景之旧，以辑义淑后学
  summary_first_person: 余元简廉夫，向撰伤寒论辑义，又辑金匮方论之义，综概原流，校雠四本，采辑徐彬程林沈魏尤金鉴诸家，呵冻挥汗，授儿元胤元坚对读，冀济暌而得会遇，不致得此失彼
