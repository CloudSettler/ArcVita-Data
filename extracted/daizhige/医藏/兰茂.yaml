  name_zh: 兰茂
  names:
    zh: 兰茂
    en: Lan Mao
  lifespan:
    birth:
      date: 1397
      precision: year
      is_circa: false
      raw: 明洪武三十年
    death:
      date: 1476
      precision: year
      is_circa: false
      raw: 明成化十二年
  birth_date: 1397
  death_date: 1476
  era: 明
  reign_ref: 洪武至成化
  archetype: 济世本草医者
  dilemmas:
  - 贪大利与存救病之心的取舍
  - 滇南草木湮没无闻与表章传世的担当
  lesson: 考性味辨地理以济世，不贪利慎施治以传后
  summary_first_person: 余幼酷好本草，考性味辨地理，留心数年，合滇中菜蔬草木性情著书传后，愿后学合脉理参悟慎之
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E6%BB%87%E5%8D%97%E6%9C%AC%E8%8D%89.html
endeavors:
- id: guji-兰茂-endeavor-1
  title_zh: 遍察滇中草木编著滇南本草
  description: 研心草木数十年，味甘辛酸苦，明温燥凉热，图柯叶形状，著滇南本草三卷以表章滇产
  phases:
  - key: brewing
    name: 幼好本草留心察验
    labels:
      zh:
      - 启蒙
      - 考察
    start_date: 1410
    highlight_event_id: guji-兰茂-event-birth
  - key: breakthrough
    name: 区类辨性绘图注书
    labels:
      zh:
      - 辨性
      - 绘图
    start_date: 1430
    highlight_event_id: guji-兰茂-event-caiyao
  - key: climax
    name: 三卷成书表章滇产
    labels:
      zh:
      - 成书
      - 济世
    start_date: 1436
    highlight_event_id: guji-兰茂-event-benchao
  - key: closure
    name: 传抄刊刻惠及医林
    labels:
      zh:
      - 流传
      - 利物
    start_date: 1440
    highlight_event_id: guji-兰茂-event-benchao
  decisions:
  - date: 1430
    title_zh: 立志专研滇产灵药百草
    rationale: 滇南所产极多而纲目所载有限，若无人表章则湮没未宣，故备极精研以存其用
  - date: 1436
    title_zh: 绘图形注性味成滇南本草
    rationale: 空言性味难资采览，必图其形明其气味寒热，方能俾得者朝夕识认不贻误医药
- id: guji-兰茂-endeavor-2
  title_zh: 明脉理审见症著医门揽要
  description: 合滇中经验附医门揽要二卷，明脉理精微审见症确切附汤方合宜以传后世
  phases:
  - key: brewing
    name: 行医合参脉理悟对
    labels:
      zh:
      - 行医
      - 悟脉
    start_date: 1425
    highlight_event_id: guji-兰茂-event-caiyao
  - key: breakthrough
    name: 辨药性明脉理审症
    labels:
      zh:
      - 脉理
      - 症方
    start_date: 1438
    highlight_event_id: guji-兰茂-event-yimen
  - key: climax
    name: 附医门揽要二卷传后
    labels:
      zh:
      - 著述
      - 传道
    start_date: 1441
    highlight_event_id: guji-兰茂-event-yimen
  - key: closure
    name: 诫后学慎治勿贪大利
    labels:
      zh:
      - 诫勉
      - 仁心
    start_date: 1450
    highlight_event_id: guji-兰茂-event-death
  decisions:
  - date: 1438
    title_zh: 以本草附揽要兼明医理
    rationale: 单辨药性不足以应变，必合脉理参悟其应如响，方能救病而不误人
  - date: 1441
    title_zh: 撰序诫贪大利泯救病之思
    rationale: 行医者易为利动而忘济世初心，特立训慎之慎之以正医道
events:
- id: guji-兰茂-event-birth
  date: 1397
  year_of: 1397
  title_zh: 出生于云南杨林
  description: 明洪武三十年生于滇南杨林，原籍中州，自幼酷好本草
- id: guji-兰茂-event-caiyao
  date: 1430
  year_of: 1430
  title_zh: 遍采滇中药草察脉络地理
  description: 留心数年，察地理情形与脉络往来，辨滇中菜蔬草木种种性情
- id: guji-兰茂-event-benchao
  date: 1436
  year_of: 1436
  title_zh: 编成滇南本草三卷
  description: 研心草木数十年，图柯叶明甘辛温凉，著滇南本草，尚早于濒湖纲目
- id: guji-兰茂-event-yimen
  date: 1441
  year_of: 1441
  title_zh: 著医门揽要二卷以传后世
  description: 并著医门揽要，辨药性周详明脉理精微，附汤方合宜有益济世
- id: guji-兰茂-event-death
  date: 1476
  year_of: 1476
  title_zh: 卒于云南
  description: 明成化十二年卒，一生著作甚多，滇南本草传抄刊刻家喻户晓
