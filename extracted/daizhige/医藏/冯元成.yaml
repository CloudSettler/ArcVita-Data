  decisions:
  - date: '1585'
    title_zh: 断定虚劳诸证皆由阳亏主张温补
    rationale: 虚劳眩运痞隔皆阳气亏损所致助阴耗阳则病益深温补既行阳长而病除
  - date: '1595'
    title_zh: 恪遵仲景古剂不妄立多品
    rationale: 病情有限攻病之法亦有限多品杂投莫识刑反忌宜反为害故须洞识病情恪遵古剂
- id: guji-冯元成-endeavor-2
  person_qid: guji-冯元成
  title_zh: 撰上池杂说辑屡验良方
  description: 录治目疮毒痘疹痢疾诸案及附子大黄得力之验并辑太极光绀雪丹等良方以济世
  phases:
  - key: brewing
