  - key: breakthrough
    name: 明目疮痘皆须温散之法
    labels:
      zh: 温散活人
    start_date: '1600'
    highlight_event_id: guji-冯元成-event-cases
  - key: climax
    name: 撰成上池杂说辨医理
    labels:
      zh: 著书立说
    start_date: '1605'
    highlight_event_id: guji-冯元成-event-book
  - key: closure
    name: 附经目屡验良方传世
    labels:
      zh: 良方济世
    start_date: '1610'
    highlight_event_id: guji-冯元成-event-formulas
  decisions:
  - date: '1600'
    title_zh: 目疾疮毒阴证专用热药温散
    rationale: 血得热则行得寒则凝目为血华疮毒属阴者扪不知痛色黑不起泡非天雄附子热药不能起死回生
  - date: '1610'
    title_zh: 辑附屡验良方不私其术
    rationale: 医贵活人去老膜翳障喉风肿毒跌打诸方皆经验证故附于经目之后以公诸世
