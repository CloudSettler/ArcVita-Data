    start_date: 1840
    highlight_event_id: guji-凌奂-event-practice
  - key: closure
    name: 悟得分隊布陣用藥之道
    labels:
      zh: 收束
    start_date: 1860
    highlight_event_id: guji-凌奂-event-practice
  decisions:
  - date: 1835
    title_zh: 棄諸子業從吳古年游
    rationale: 欲探本窮源讀破萬卷隨時就正恐苟且誤人性命故專師名醫講論達旦
  - date: 1840
    title_zh: 臨症必四診辨經用藥
    rationale: 觀氣色聽聲音問病源切浮沉遲數以明虛實表裏寒熱然後定君臣佐使
- id: guji-凌奂-endeavor-2
  title_zh: 集注本草害利成書
  summary: 補吳氏分隊未刊之缺集各家本草補入藥之害於病者逐一加注更名本草害利於咸豐壬戌付梓
  phases:
  - key: brewing
    name: 親嘗審識防偽充誤人
    labels:
      zh: 醞釀
    start_date: 1845
    highlight_event_id: guji-凌奂-event-practice
  - key: breakthrough
    name: 得吳氏本草分隊稿本
    labels:
      zh: 突破
    start_date: 1860
    highlight_event_id: guji-凌奂-event-practice
  - key: climax
    name: 刪繁就簡撰述害利
    labels:
      zh: 高峰
    start_date: 1861
    highlight_event_id: guji-凌奂-event-book
  - key: closure
    name: 咸豐壬戌自序付剞劂
    labels:
      zh: 收束
    start_date: 1862
    highlight_event_id: guji-凌奂-event-book
  decisions:
  - date: 1861
    title_zh: 補害更名為本草害利
    rationale: 凡藥有利必有害但知其利如衝鋒罔顧其後故補害於病者以戒粗知大略信手下筆
  - date: 1862
    title_zh: 付梓公諸同好就正海內
    rationale: 欲求同道知斷不可辨證不明枉折人命亦為慎疾之一端故不揣固陋刊行
