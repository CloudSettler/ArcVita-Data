  dilemmas:
  - title_zh: 知利不知害
    description: 世醫但知某藥能除某病而不知閉邪歛邪之害恐失之毫釐謬以千里
  - title_zh: 粗略信手與審慎辨證
    description: 不先望聞問切而聽病家自述即寫藥數味與慎思明辨然後下筆之抉擇
  lesson: 藥有利必有害必辨證明經絡虛實寒熱而後用君臣佐使方能起死回生
  summary_first_person: 余吳興凌奂字曉五幼而體弱多病因閱方書棄諸子業從吳古年夫子游讀破萬卷講論錯謬業醫二十餘年慎思明辨補偏救弊集古今名醫之說撰成本草害利以明害利公諸同好
  source_urls:
