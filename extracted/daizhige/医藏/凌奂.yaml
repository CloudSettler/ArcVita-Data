  type: career
  title_zh: 從吳古年夫子游學
  date: 1835
  year_of: 1835
  description: 棄諸子業從本郡吳古年游歷代名醫著述探本窮源昏黃達旦講論辨證之法
- id: guji-凌奂-event-practice
  type: career
  title_zh: 業醫二十年慎思明辨
  date: 1840
  year_of: 1840
  description: 臨症審脈辨證親嘗出產形狀氣味補偏救弊得臟腑如地理處方如布陣用藥如用兵之旨
- id: guji-凌奂-event-book
  type: career
  title_zh: 咸豐壬戌撰成本草害利
  date: 1862
  year_of: 1862
  description: 集古今名醫之說刪繁就簡於心肝脾肺腎分隊逐藥注害利修治咸豐壬戌自序刊行
