endeavors:
- id: guji-刘一仁-endeavor-1
  title_zh: 诊脉传心立纲
  summary: 以浮沉迟数为则分虚洪弱实滑涩紧弦芤等脉论主病及四季人迎气口三部六经分诊
  phases:
