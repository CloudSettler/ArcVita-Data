  decisions:
  - date: 1755-01-01
    title_zh: 分寒热温平立传心赋
    rationale: 用药如将用兵不在多而在能，故分寒以清热温以补中热以温经平以调和，使学者循性酌用
  - date: 1760-01-01
    title_zh: 定发言须当理兼问诊大法
    rationale: 单凭切脉难决百病死生，故立详问所苦所思饮食二便经产跌扑服药诸法以校诊折衷万全
