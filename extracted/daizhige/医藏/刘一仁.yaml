    name: 习脉酝酿
    labels:
      zh: 酝酿
    start_date: 1720-01-01
    highlight_event_id: guji-刘一仁-event-maimai
  - key: breakthrough
    name: 四脉提纲初成
    labels:
      zh: 突破
    start_date: 1745-01-01
    highlight_event_id: guji-刘一仁-event-maimai
  - key: climax
    name: 传心诀主病歌成
    labels:
      zh: 高潮
    start_date: 1750-01-01
    highlight_event_id: guji-刘一仁-event-maimai
  - key: closure
    name: 六法三部总括
    labels:
      zh: 收束
    start_date: 1752-01-01
    highlight_event_id: guji-刘一仁-event-maimai
  decisions:
  - date: 1745-01-01
    title_zh: 以四脉为纲化繁为简
    rationale: 脉学越繁初学越难，故以浮沉迟数为则，再视有力无力分虚实洪弱，以纲带目先易后难
  - date: 1750-01-01
    title_zh: 自明不出古人书以示传心秘识
    rationale: 所言脉象间有与历代脉学不合，故明言为自家心得，劝读者参阅他书结合实践互证
- id: guji-刘一仁-endeavor-2
  title_zh: 用药传心分类
  summary: 分寒热温平论药性主治，定引经用药，传四君四物二陈加减及治病主药诀与问诊大法
  phases:
  - key: brewing
    name: 集药性酝酿
