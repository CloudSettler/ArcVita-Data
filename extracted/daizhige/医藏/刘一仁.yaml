  dilemmas:
  - 脉学繁琐则初学难明与提纲挈领则恐失精微之衡
  - 药分寒热温平各称其能与临证调和加减之难
  lesson: 以简驭繁，先易后难，传心在切用
  summary_first_person: 吾乃清人刘一仁，悯切脉之事胸中了了指下难明，故以浮沉迟数为纲传诊脉之心，以寒热温平为类传用药之心，著医学传心录以示初学，劝其参合他书互证实践
