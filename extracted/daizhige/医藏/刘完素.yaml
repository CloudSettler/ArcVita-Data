  archetype: 寒凉派宗师
  dilemmas:
  - 伤寒当从火热通论还是寒热分论
  - 尊仲景而如何正活人书以阴阳为寒热之误
  - 世人喜温恶寒而力主寒凉是否招疑谤
  lesson: 明六气火热为本以寒凉汗下救世革温补之偏
  summary_first_person: 吾守真河间人也深明素问造化阴阳之理谓伤寒六经自浅至深皆是热证前三日汗之后三日下之著直格宣明以正医流之惑虽世喜温恶寒吾不忍无言
