  reign_ref: 金熙宗至金章宗时
  archetype: 寒凉派开山医家
  dilemmas:
  - 遵仲景旧法与革麻黄桂枝误用之衡
  - 顺世俗喜温恶寒与执寒凉攻下治热之争
  lesson: 亢则害承乃制，伤寒皆热，辨阴阳在表里脏腑，以寒治热，正治反治相济以全人命
  summary_first_person: 吾乃河间守真，恐素问斯文坠地，民生横夭，遂引素问明受病本源，著书八万余言，又恐桂枝麻黄承气误人，制双解散与三一承气以总之，辨朱肱以寒热释阴阳之谬，明六经传受皆热证，愿为医者龟鉴，使对形见影人可自疗
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/刘河间伤寒医鉴.md
  - https://daizhige.org/医藏/刘河间伤寒医鉴.html
endeavors:
- id: guji-刘完素-endeavor-1
  title_zh: 注素问著四书明造化病机
  summary: 以素问为本，作要旨论宣明论直格玄机原病式，通计八万余言，明天地运化与病机气宜
  phases:
  - key: brewing
    name: 穷天道地理究素问本旨
    labels:
      zh:
      - 素问
      - 运气
    start_date: 1140
    highlight_event_id: guji-刘完素-event-zhushu
  - key: breakthrough
    name: 分君臣佐使定奇偶逆从
    labels:
      zh:
      - 宣明论
      - 直格
    start_date: 1172
    highlight_event_id: guji-刘完素-event-zhushu
  - key: climax
    name: 取至真要大论著原病式
    labels:
      zh:
      - 病机
      - 玄机原病式
    start_date: 1186
    highlight_event_id: guji-刘完素-event-yuanbingshi
  decisions:
  - date: 1172
    title_zh: 作要旨论宣明论直格
    rationale: 恐斯文将坠民罹横夭，引素问标受病本源处方用药，使运化盛衰可考
  - date: 1186
    title_zh: 著玄机原病式发明病机
    rationale: 取至真要大论病机气宜之说，著二万余言，使后学得枢要不失纲领
- id: guji-刘完素-endeavor-2
  title_zh: 革伤寒旧弊倡寒凉攻下
  summary: 针对仲景法难通与朱肱活人书以寒热释阴阳之误，制双解散三一承气凉膈解毒之法，主以寒治热
  phases:
  - key: brewing
    name: 察桂枝麻黄承气误人之弊
    labels:
      zh:
      - 伤寒
      - 双解散
    start_date: 1175
    highlight_event_id: guji-刘完素-event-shuangjie
  - key: climax
    name: 辨六经传受皆热破阴毒说
    labels:
      zh:
      - 六经传受
      - 阳厥
    start_date: 1190
    highlight_event_id: guji-刘完素-event-bianhuo
  - key: closure
    name: 示正治反治以成医鉴
    labels:
      zh:
      - 正治反治
      - 医鉴
    start_date: 1195
    highlight_event_id: guji-刘完素-event-bianhuo
  decisions:
  - date: 1175
    title_zh: 制双解散总伤风伤寒
    rationale: 恐麻黄桂枝误用致毙，无问内外诸邪皆能治疗，革误人之弊已不少
  - date: 1190
    title_zh: 斥朱肱阴毒温补投姜附之非
    rationale: 明前三日汗后三日下皆是热证，身冷脉微乃阳厥极深，当养阴退阳微下，不可实实虚虚
events:
- id: guji-刘完素-event-birth
  date: 1110
  year_of: 1110
  title_zh: 生于河间
  description: 金天会年间生于河间，字守真，后究素问以全民生寿域
- id: guji-刘完素-event-zhushu
  date: 1172
  year_of: 1172
  title_zh: 作宣明论直格要旨论
  description: 分君臣佐使定奇偶逆从，注伤寒六经传受，要旨三万六千余字宣明八千余字直格一万七千余字
- id: guji-刘完素-event-yuanbingshi
  date: 1186
  year_of: 1186
  title_zh: 著玄机原病式
  description: 取至真要大论病机气宜之说，著一帙计二万余言，发明火热病机
- id: guji-刘完素-event-shuangjie
  date: 1175
  year_of: 1175
  title_zh: 创双解散三一承气
  description: 芟仲景三百九十七法一百十三方之繁，制三十二药以总之，制双解散治诸邪三一承气总三承气
- id: guji-刘完素-event-bianhuo
  date: 1190
  year_of: 1190
  title_zh: 辨活人书阎氏之失明皆热
  description: 辨朱肱以寒热释阴阳之谬及阎孝忠以疮疹为寒之失，明六经传受阳厥发黄呕利皆热证当寒治下治
- id: guji-刘完素-event-death
  date: 1200
  year_of: 1200
  title_zh: 归世留书为龟鉴
  description: 归世之后门人集紧切药方六十道分为六门亦名直格，通计八万余言为医者龟鉴
