    highlight_event_id: guji-刘完素-event-book
  decisions:
  - date: '1186'
    title_zh: 集切要药方六十道分六门名直格
    rationale: 欲使习医者执简驭繁临证有格故以方配运气病机直截痛快
  - date: '1196'
    title_zh: 托书坊刊梓以广其传
    rationale: 恐论者不详反生疑谤故借明灯巨火喻直格使聪明博雅者原始反终
events:
- id: guji-刘完素-event-birth
  title_zh: 生于河间
  date: '1110'
  year_of: 1110
  description_zh: 大观年间生于河间自幼聪慧慕素问灵枢之学后以字守真行世
- id: guji-刘完素-event-theory
  title_zh: 悟伤寒皆热阐六气病机
  date: '1168'
  year_of: 1168
  description_zh: 深明素问造化阴阳谓朱肱活人书以阴阳为寒热失仲景本意力言伤寒为大热之病六经皆热
- id: guji-刘完素-event-practice
  title_zh: 河间行医寒凉活人
  date: '1175'
  year_of: 1175
  description_zh: 于河间以双解散益元散等寒凉之剂治表里热证辨表里缓急全活甚众遂称刘河间
- id: guji-刘完素-event-book
  title_zh: 成宣明论直格伤寒心法
  date: '1186'
  year_of: 1186
  description_zh: 集平生经验成素问病机气宜保命集宣明论方及伤寒直格方标本心法类萃授门人葛雍辈编次刊行
- id: guji-刘完素-event-death
  title_zh: 卒于金承安年间
  date: '1200'
  year_of: 1200
  description_zh: 晚年德望益隆学者云集卒后寒凉之学经张从正李东垣传扬为金元四大家之首
