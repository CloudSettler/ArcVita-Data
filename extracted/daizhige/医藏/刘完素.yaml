  decisions:
  - date: '1172'
    title_zh: 以寒凉治热定伤寒杂病方
    rationale: 见世医温补误治火热，热极兼水化，温之益弊，故率运气之理而用凉寒
  - date: '1175'
    title_zh: 以宣明论证明世说之误
    rationale: 凡有世说之误详以此证明，庶令学人真伪自分而易为得用
