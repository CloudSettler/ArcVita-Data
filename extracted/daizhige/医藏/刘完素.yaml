  dilemmas:
  - title_zh: 守近代方论还是求三坟大道
    description: 世人但究仲景之末而不求运气之本，我欲直推五运六气，恐被讥为言圣贤之非
  - title_zh: 矜炫名利还是普救生命
    description: 述文十万余言非为美己，但愿后学易晓而行无枉错，改正世俗谬说
  lesson: 明五运六气造化之理，识亢则害承乃制，则阴阳虚实自分，热病当用寒凉
  summary_first_person: 吾守真河间人也，耽玩素问既久，粗见得失，本三坟圣经兼众贤妙论，举二百七十七字为原病式，推火热病机，立寒凉之法，愿宣扬古圣妙道以救生民
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%B4%A0%E9%97%AE%E7%8E%84%E6%9C%BA%E5%8E%9F%E7%97%85%E5%BC%8F.html
