    title_zh: 先成运气要旨论九篇
    rationale: 妙道恐后学难施用，故先备见圣贤妙用，再求病机提纲
  - date: '1181'
    title_zh: 独举二百七十七字立式
    rationale: 大凡明病阴阳虚实无越此法，复虑妄说违圣，故独为一本以明六气虚实
- id: guji-刘完素-endeavor-2
  person_qid: guji-刘完素
  title_zh: 开河间寒凉学派济世活人
  summary: 宗仲景而参圣贤，推运气自然之理，集伤寒杂病方论，倡六气从火化，主以寒凉治热病
  phases:
