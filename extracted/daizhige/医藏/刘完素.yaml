endeavors:
- id: guji-刘完素-endeavor-1
  title_zh: 研究内经与宣明三书革新寒凉
  summary: 自廿五岁潜心内经，悟亢则害承乃制之旨，倡火热为病本，立寒凉清热之法，著直格宣明原病式以正俗论
  phases:
  - key: brewing
    name: 志学内经
    labels:
      zh: 研读内经
    start_date: 1145
    highlight_event_id: guji-刘完素-event-birth
  - key: breakthrough
    name: 天人授饮开悟
    labels:
      zh: 开悟病机
    start_date: 1170
    highlight_event_id: guji-刘完素-event-xuanming
  - key: climax
    name: 宣明三书刊行
    labels:
      zh: 革新医道
    start_date: 1172
    highlight_event_id: guji-刘完素-event-xuanming
  - key: closure
    name: 寒凉法行于世
    labels:
      zh: 普救生命
    start_date: 1175
    highlight_event_id: guji-刘完素-event-xuanming
  decisions:
  - date: 1172
    title_zh: 述作宣明论方原病式
    rationale: 见世医倚约旧方耻问不学，十误八九，故首述玄机以革鄙陋正舛讹
  - date: 1175
    title_zh: 力主火热病机寒凉治法
    rationale: 悟木极似金火极似水亢害承制之变，不认似作是，以清凉救热病之偏
- id: guji-刘完素-endeavor-2
  title_zh: 集成保命集以全性命之道
  summary: 年近六旬再遇异人豁然有悟，以三十年亲验比物立象，裁成三卷三十二论，自原道原脉摄生阴阳以至治法方论
  phases:
  - key: brewing
    name: 三十年亲验积累
    labels:
      zh: 亲用若神
    start_date: 1155
    highlight_event_id: guji-刘完素-event-xuanming
  - key: breakthrough
    name: 橡斗玄酝豁然悟道
    labels:
      zh: 穷理尽性
    start_date: 1184
    highlight_event_id: guji-刘完素-event-baoming
  - key: climax
    name: 大定丙午撰成保命集
    labels:
      zh: 集成保命
    start_date: 1186-08-15
    highlight_event_id: guji-刘完素-event-baoming
  - key: closure
    name: 秘箧传后以待明者
    labels:
      zh: 传道济世
    start_date: 1187
    highlight_event_id: guji-刘完素-event-baoming
  decisions:
  - date: 1186-08-15
    title_zh: 裁成保命集三十二论
    rationale: 自谓穷理尽性精微至要莫出乎是，远取诸物近取诸身，直明真理以济人命
  - date: 1187
    title_zh: 秘之箧笥不轻示人
    rationale: 圣人之法不遇当人未易授，非绝仁人之心，待后之明者自传
events:
- id: guji-刘完素-event-birth
  title_zh: 河间出生
  date: 1120
  year_of: 1120
  summary: 宋宣和二年左右生于河间，字守真，号通玄真人，后为金之名医
- id: guji-刘完素-event-xuanming
  title_zh: 著成宣明原病诸书
  date: 1172
  year_of: 1172
  summary: 历二十余年研治内经，撰直格宣明论方素问玄机原病式凡十七万余言，开导后学
- id: guji-刘完素-event-baoming
  title_zh: 大定丙午撰保命集自序
  date: 1186-08-15
  year_of: 1186
  summary: 以三十年心手亲验，成素问病机气宜保命集三卷三十二论，自述得轩岐要妙济人命之旨
- id: guji-刘完素-event-death
  title_zh: 金承安间逝世
  date: 1200
  year_of: 1200
  summary: 卒于金章宗承安年间，其学由门人传续，保命遗稿后经杨威校刊广传
