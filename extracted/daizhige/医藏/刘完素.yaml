  decisions:
  - date: '1168'
    title_zh: 断伤寒六经皆热不用温补
    rationale: 经言人伤于寒则为病热六经传受自浅至深皆热证非有阴寒故舍温从凉
  - date: '1175'
    title_zh: 以汗下寒凉分治表里
    rationale: 前三日在表汗之则愈后三日入里下之则痊表里缓急分明则生死可全
