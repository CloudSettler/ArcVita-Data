      - 分类
      - 编次
    start_date: 1148-01-01
    highlight_event_id: guji-刘昉-event-1
  - key: climax
    name: 绍兴二十年进呈成书
    labels:
      zh:
      - 进呈
      - 成书
    start_date: 1150-01-01
    highlight_event_id: guji-刘昉-event-2
  - key: closure
    name: 刊传流布惠及幼幼
    labels:
      zh:
      - 流布
    start_date: 1151-01-01
    highlight_event_id: guji-刘昉-event-2
  decisions:
  - date: 1146-01-01
    title_zh: 以求子方论冠于卷首
    rationale: 子之有无胎之厚薄乃幼科之本，故先论天癸冲任以探其源。
  - date: 1149-01-01
    title_zh: 并存千金圣惠肘后诸方不废异说
    rationale: 择其可传者备载方药禁忌，令后医有所稽考取舍。
- id: guji-刘昉-endeavor-2
  title_zh: 阐发调经养胎保产医理
  summary: 论男女精血阴阳和合，戒交合禁忌，传紫石门冬丸庆云散等以助嗣育。
  phases:
  - key: brewing
    name: 推演内经天癸冲任之理
    labels:
      zh:
      - 天癸
      - 冲任
    start_date: 1145-01-01
    highlight_event_id: guji-刘昉-event-1
  - key: breakthrough
    name: 汇集调经荡胞坐导诸法
    labels:
      zh:
      - 调经
      - 荡胞
    start_date: 1148-01-01
    highlight_event_id: guji-刘昉-event-3
  - key: climax
    name: 明示养胎护胎转养之术
    labels:
      zh:
      - 养胎
      - 保产
    start_date: 1150-01-01
    highlight_event_id: guji-刘昉-event-3
  decisions:
  - date: 1147-01-01
    title_zh: 详载王相贵宿避忌时日
    rationale: 顺天时忌风寒晦冥，欲使福德智人托胎，免癫痴短寿之患。
  - date: 1150-01-01
    title_zh: 录七子散紫石门冬丸等补虚荡冷之剂
    rationale: 男补精气女暖子宫，荡去积血冷脓而后受孕，故全录其配伍服法。
events:
- id: guji-刘昉-event-birth
  title_zh: 生于北宋末年
  date: 1090-01-01
  year_of: 1090
  description: 约生于哲徽之间，少习医方，尤留意妇幼。
- id: guji-刘昉-event-1
  title_zh: 博采诸家立求端探本
  date: 1148-01-01
  year_of: 1148
  description: 采内经素问上古天真论及千金圣惠肘后求子诸论，以求子方论冠卷首。
- id: guji-刘昉-event-2
  title_zh: 绍兴二十年进呈幼幼新书
  date: 1150-01-01
  year_of: 1150
  description: 书成四十卷，卷一首论求子养胎转女为男，次列诸方药禁忌以进。
- id: guji-刘昉-event-3
  title_zh: 传荡胞坐导养胎诸方
  date: 1150-06-01
  year_of: 1150
  description: 传朴消荡胞汤坐导药紫石门冬丸庆云散承泽丸等，以治无子断绪及保胎。
- id: guji-刘昉-event-death
  title_zh: 卒于南宋绍兴之后
  date: 1160-01-01
  year_of: 1160
  description: 书成流布之后约卒，其书为后世幼科集大成之祖。
