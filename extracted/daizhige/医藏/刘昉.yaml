endeavors:
- id: guji-刘昉-endeavor-1
  title_zh: 编纂幼幼新书存幼科大法
  summary: 博采历代医籍，以求子养胎为端，汇为幼幼新书四十卷进呈朝廷。
  phases:
  - key: brewing
    name: 博采群书立求端探本
    labels:
      zh:
      - 求子
      - 集方
      - 立纲
    start_date: 1145-01-01
    highlight_event_id: guji-刘昉-event-1
  - key: breakthrough
