  decisions:
  - date: 0405-06-01
    title_zh: 诘旦率徒追踪
    rationale: 夜射中异物声如雷电风雨，不甘弃置，故率门徒子弟寻踪至山下以究其竟
  - date: 0405-06-02
    title_zh: 收存遗方药臼
    rationale: 三鬼齐走遗下方卷药臼，知为天授异方，故谨藏以待后用
- id: guji-刘涓子-endeavor-2
  title_zh: 从宋武北征以方治疮
  description: 从宋武北征，以鬼遗方治金疮痈疽皆愈，遂寄书与姊传于龚氏，开启方书流布之绪
