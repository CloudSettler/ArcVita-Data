  - title_zh: 神方自珍还是济世
    description: 得黄父鬼遗痈疽秘方，家世能治而不传，须择得人方付
  - title_zh: 军旅试方系命之险
    description: 从宋武北征以新得异方治金疮痈疽，效验关乎将士生死
  lesson: 天授异方不私藏，军旅验证其神验，传付得人方能久济世人
  summary_first_person: 吾乃刘涓子，晋末居丹阳，郊外夜射得黄父鬼遗痈疽方一卷并药一臼，从宋武北征以法治金疮痈疽千无一失，后寄书与姊传于龚氏，愿此方流布乡曲以活众人
