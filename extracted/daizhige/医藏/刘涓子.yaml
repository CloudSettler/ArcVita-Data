      zh: 寄书传方
    start_date: 0417-01-01
    highlight_event_id: guji-刘涓子-event-send-book
  - key: closure
    name: 龚氏世守其方
    labels:
      zh: 世守流布
    start_date: 0418-01-01
    highlight_event_id: guji-刘涓子-event-send-book
  decisions:
  - date: 0416-08-01
    title_zh: 军中用鬼方治疮
    rationale: 北征多被疮者，常规难治，故试用鬼遗方药，果得千无一失
  - date: 0417-01-01
    title_zh: 寄姊书具叙本末
    rationale: 姊适龚家从叔祖，恐神方湮没，故具书并方一卷相寄，托家族世守传治
events:
- id: guji-刘涓子-event-birth
  title_zh: 出生于丹阳一带
  date: 0375-01-01
  year_of: 375
  description: 晋末生于丹阳一带，少长习射，后居丹阳
  place_zh: 丹阳
- id: guji-刘涓子-event-shoot-ghost
  title_zh: 丹阳郊外射鬼得方
  date: 0405-06-01
  year_of: 405
  description: 晋末丹阳郊外夜射中高二丈异物，诘旦追至山下遇提罐小儿，自称主为黄父鬼，至其门闻捣药声，三鬼走遗痈疽方一卷并药一臼
  place_zh: 丹阳郊外
- id: guji-刘涓子-event-conquest-heal
  title_zh: 从宋武北征以方治疮
  date: 0416-08-01
  year_of: 416
  description: 从宋武北征，军中有被疮者，以鬼遗方药涂治即愈，用方为治千无一失，时论谓天授
  place_zh: 北征军中
- id: guji-刘涓子-event-send-book
  title_zh: 寄姊书传鬼遗方
  date: 0417-01-01
  year_of: 417
  description: 寄姊书具叙射鬼得方本末，并附丹阳白薄纸本方一卷，姊家世能为治方，后经道庆传于龚庆宣
  place_zh: 军中寄丹阳龚家
- id: guji-刘涓子-event-death
  title_zh: 逝世
  date: 0425-01-01
  year_of: 425
  description: 宋初逝世，具体年月不详，其方经龚家祖考相承，齐永元元年由龚庆宣编次流布
  place_zh: 丹阳
