    start_date: 1750-01-01
    highlight_event_id: guji-包三述-event-theory
  - key: climax
    name: 虚实寒热生死辨决
    labels:
      zh: 生死决断
    start_date: 1755-01-01
    highlight_event_id: guji-包三述-event-book
  - key: closure
    name: 三十六证治则归一
    labels:
      zh: 体系告成
    start_date: 1770-01-01
    highlight_event_id: guji-包三述-event-book
  decisions:
  - date: 1750-01-01
    title_zh: 以火痰立纲分虚实
    rationale: 实火因煎炒积热二便闭塞宜去风痰解热毒虚火因酒色忿怒阴虚上炎宜养阴降火故先辨虚实再定攻补
  - date: 1755-01-01
    title_zh: 以三日寒热二便定轻重缓急
    rationale: 一二日肿痛三日发寒热头痛则变重二便通则浮游之火易解二便闭则毒火内蓄须降火通利故必问寒热头痛二便
- id: guji-包三述-endeavor-2
  title_zh: 家传方药研制与家宝成书
  summary: 研制青药黄药凉药膏子药及咽喉舌牙三方煎剂并开牙关吹药出痰针烙放脓之法汇成家宝传世
  phases:
  - key: brewing
    name: 青黄二药配伍摸索
    labels:
      zh: 方药酝酿
    start_date: 1752-01-01
    highlight_event_id: guji-包三述-event-prescription
  - key: breakthrough
    name: 出痰开闭法得验
    labels:
      zh: 出痰突破
    start_date: 1760-01-01
    highlight_event_id: guji-包三述-event-prescription
  - key: climax
    name: 煎剂针刺外治 hội 成
    labels:
      zh: 内外合治
    start_date: 1765-01-01
    highlight_event_id: guji-包三述-event-book
  - key: closure
    name: 家宝一卷付子孙
    labels:
      zh: 著书传家
    start_date: 1770-01-01
    highlight_event_id: guji-包三述-event-book
  decisions:
  - date: 1760-01-01
    title_zh: 青黄先后多少为要诀
    rationale: 青药和缓清热解毒黄药峻利消肿出痰初起骤用黄药则轻病不胜故初用青渐加黄热甚以黄为君吹必直对喉中方效
  - date: 1765-01-01
    title_zh: 内外兼治忌纯凉忌误汗误针
    rationale: 喉证初起内服解毒兼发散则毒易解纯用凉药则上热未降下寒复起毒入腹而死虚劳失音及帝中舌系尤忌针故立内外合治与禁忌
