person:
  qid: guji-华佗
  name_zh: 华佗
  names:
    zh: 华佗
    en: Hua Tuo
  lifespan:
    birth:
      date: '0145'
      precision: year
      is_circa: true
      raw: 约东汉永嘉元年
    death:
      date: 0208
      precision: year
      is_circa: false
      raw: 建安十三年死于狱中
  birth_date: '0145'
  death_date: 0208
  era: 东汉末年
  reign_ref: 汉献帝建安年间
  archetype: 外科神医
  dilemmas:
  - 不慕权贵恬淡行医与曹操征召之间的冲突
  - 秘方济世活人与保守不泄之间的权衡
  lesson: 恃术济世不附权贵，存济世之心则秘方终不湮没
  summary_first_person: 吾谯人也，性好恬淡，喜味方书，游名山遇异人授秘方，遂创麻沸散行刳肠湔胃之术，活人无算，虽终不免于操狱，而此心惟在活人耳
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8D%8E%E4%BD%97%E7%A5%9E%E6%96%B9.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8D%8E%E4%BD%97%E7%A5%9E%E6%96%B9.html
endeavors:
- id: guji-华佗-endeavor-1
  title_zh: 创麻沸散行外科神术
  description: 精方药针灸，制麻沸散与神膏，行刳破腹背抽割积聚之术，治疾发结于内者
  phases:
  - key: brewing
    name: 游山求法
    labels:
      zh: 游名山幽洞遇异人
    start_date: '0165'
    highlight_event_id: guji-华佗-event-1
  - key: breakthrough
    name: 得秘方施验
    labels:
      zh: 得石函秘方屡试神效
    start_date: '0175'
    highlight_event_id: guji-华佗-event-1
  - key: climax
    name: 麻沸刳腹名震四方
    labels:
      zh: 醉服麻沸散刳肠湔胃
    start_date: 0195
    highlight_event_id: guji-华佗-event-2
  - key: closure
    name: 术成名立
    labels:
      zh: 以神医见称于世
    start_date: '0200'
    highlight_event_id: guji-华佗-event-2
  decisions:
  - date: '0175'
    title_zh: 立誓济世受秘方
    rationale: 许以无贵贱贫富不务财贿矜老恤贫，方得脱祸而传术
  - date: 0195
    title_zh: 先醉后刳以刀补针药之穷
    rationale: 疾结于内针药不及，故以酒服麻沸散而后抽割洗涤敷以神膏
- id: guji-华佗-endeavor-2
  title_zh: 手录藏书传方后世
  description: 随时手录秘方佩于囊中，原书藏家，狱中焚书后家藏本经孙思邈整理复出于世
  phases:
  - key: brewing
    name: 随身录方
    labels:
      zh: 手录一编时时检索
    start_date: 0185
    highlight_event_id: guji-华佗-event-2
  - key: breakthrough
    name: 为操治病思归
    labels:
      zh: 治头风久不愈求还取方
    start_date: '0207'
    highlight_event_id: guji-华佗-event-3
  - key: climax
    name: 下狱焚书
    labels:
      zh: 临死以书付狱吏不果而烧之
    start_date: 0208
    highlight_event_id: guji-华佗-event-3
  - key: closure
    name: 家藏复出
    labels:
      zh: 家藏本经孙真人排比复传
    start_date: 0682
    highlight_event_id: guji-华佗-event-4
  decisions:
  - date: '0207'
    title_zh: 托妻疾不返
    rationale: 恃能厌事不欲久留操侧，故求还取方而数期不至
  - date: 0208
    title_zh: 狱中付书
    rationale: 知必死欲以活人之术付狱吏，吏畏法不敢受则索火烧之
events:
- id: guji-华佗-event-birth
  title_zh: 生于沛国谯县
  date: '0145'
  year_of: 145
  description: 约生于东汉沛国谯县，少好恬淡，喜味方书
- id: guji-华佗-event-1
  title_zh: 公宜山古洞遇仙得秘方
  date: '0175'
  year_of: 175
  description: 酒后息于公宜山古洞，闻论病法，拜二老得东洞石床书函，从兹施验靡不神效
- id: guji-华佗-event-2
  title_zh: 创麻沸散行刳腹术
  date: 0198
  year_of: 198
  description: 处剂不过数种，针灸不过数处，若疾结于内则以酒服麻沸散刳破腹背断截煎洗敷以神膏，一月平复
- id: guji-华佗-event-3
  title_zh: 为曹操治头风下狱死
  date: 0208
  year_of: 208
  description: 为操治头风久不愈，求还取方托妻疾不返，操怒收付狱考验，荀彧请宥不从，竟杀之，临死焚书一卷
- id: guji-华佗-event-4
  title_zh: 家藏本经孙思邈整理复传
  date: 0682
  year_of: 682
  description: 家藏本辗转数百年入孙思邈手，于终南山下排比分门补苴罅漏，永淳元年识之，后经姚氏徐大椿沈骧刊布于世
- id: guji-华佗-event-death
  title_zh: 死于许昌狱中
  date: 0208
  year_of: 208
  description: 建安十三年被曹操考验致死于狱中，秘方手录本焚毁，家藏本独存
