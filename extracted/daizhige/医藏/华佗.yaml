events:
- id: guji-华佗-event-birth
  date: '0145'
  year_of: 145
  title_zh: 生于沛国谯县
  description_zh: 约汉永寿年间生于谯郡，少好方术游学四方
- id: guji-华佗-event-tour
  date: '0165'
  year_of: 165
  title_zh: 游历行医精诸科
  description_zh: 游走江淮精通内外妇儿针灸药石，视疾如亲名闻乡里
- id: guji-华佗-event-surgery
  date: 0190
  year_of: 190
  title_zh: 制麻沸散开外科
  description_zh: 以麻沸散佐酒剖腹背疮断肠湔洗，针药并施起死回生
- id: guji-华佗-event-writing
  date: 0198
  year_of: 198
  title_zh: 论著中藏演禽戏
  description_zh: 论人法天地阴阳虚实寒热，传五禽戏以养生，弟子吴普樊阿得传
- id: guji-华佗-event-fame
  date: '0207'
  year_of: 207
  title_zh: 曹操召治拒留
  description_zh: 操苦头风召治小效，佗辞归思家不返，终以欺骗下狱
- id: guji-华佗-event-death
  date: 0208
  year_of: 208
  title_zh: 下狱死于建安十三年
  description_zh: 不从曹操为侍医，考验狱中临死焚医书，一生济世之学多赖中藏以传
