    description: 举孝廉辟公府皆不就，坚持游行四方以医济世
  - title_zh: 侍曹与保身
    description: 不愿久为侍医系身，托妻病还乡终遭下狱殒命
  lesson: 术精而心正，通经脉均气血，方为良医济世之道
  summary_first_person: 吾少游学徐土，通经方针灸，制麻沸散，创五禽戏，行医江淮吴越，针起跛足，药除肠痈，虽终殒于许都，然针道已载歌赋传后世
