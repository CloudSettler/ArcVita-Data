  archetype: 医家
  dilemmas:
  - 安胎与治母两难，治母恐伤胎，专安胎则母病不除
  - 温补与清热权衡，虚寒宜温，胎热宜清，误用升散攻伐则促堕
  lesson: 胎产母子相连，治母即所以安胎，辨虚实寒热，补泻温清各得其宜，方为盘珠不乱之法
  summary_first_person: 吾单南山生于清时，目见胎前产后危症繁杂，医者临证多惑，故博采前贤，综胎前恶阻子烦子痫诸症，详产后难产血晕恶露諸疾，又列补散攻涩寒热和泻诸方，编成盘珠集胎产症治三卷，愿盘珠在握，临证不迷，母子俱安
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E7%9B%98%E7%8F%A0%E9%9B%86%E8%83%8E%E4%BA%A7%E7%97%87%E6%B2%BB.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%9B%98%E7%8F%A0%E9%9B%86%E8%83%8E%E4%BA%A7%E7%97%87%E6%B2%BB.html
endeavors:
- id: guji-单南山-endeavor-1
  title_zh: 综论胎前诸症成卷上
  summary_zh: 统摄恶阻子烦子悬子肿子满子气子喑子痫子淋子嗽以下血转胞胎动诸症，辨气血虚实寒热，立法调气安胎为主
  phases:
  - key: brewing
    name: 博采胎前医论
    labels:
      zh:
      - 胎前
      - 搜集
    start_date: 1770-01-01
    highlight_event_id: guji-单南山-event-1
  - key: breakthrough
    name: 立恶阻子烦纲目
    labels:
      zh:
      - 恶阻
      - 子烦
    start_date: 1775-01-01
    highlight_event_id: guji-单南山-event-1
  - key: climax
    name: 成卷上三十余症
    labels:
      zh:
      - 子痫
      - 下血
    start_date: 1780-01-01
    highlight_event_id: guji-单南山-event-1
  - key: closure
    name: 以调气安胎归纳
    labels:
      zh:
      - 安胎
      - 调气
    start_date: 1782-01-01
    highlight_event_id: guji-单南山-event-1
  decisions:
  - date: 1775-01-01
    title_zh: 怀娠两月宜静待不妄投药
    rationale: 足厥阴少阳养胎之初，恶心头眩多属气郁，妄用安胎寒凉反伤脾胃，故以疏理为要
  - date: 1780-01-01
    title_zh: 胎动宜行气胎漏宜清热
    rationale: 胎动腹痛属气逆，胎漏下血属热迫，行气与清热分途，兼腰痛防堕不用升举
- id: guji-单南山-endeavor-2
  title_zh: 详述产后列方成卷中卷下
  summary_zh: 论难产胎衣不下血晕恶露头痛腹痛诸产后危症，复列补散攻涩寒热和泻及胎前产后备用良方，以盘珠统摄
  phases:
  - key: brewing
    name: 搜集产后危症
    labels:
      zh:
      - 产后
      - 难产
    start_date: 1783-01-01
    highlight_event_id: guji-单南山-event-2
  - key: breakthrough
    name: 明血晕恶露虚实
    labels:
      zh:
      - 血晕
      - 恶露
    start_date: 1785-01-01
    highlight_event_id: guji-单南山-event-2
  - key: climax
    name: 成卷中产后诸论
    labels:
      zh:
      - 产后
      - 腹痛
    start_date: 1787-01-01
    highlight_event_id: guji-单南山-event-2
  - key: closure
    name: 列方备用归盘珠
    labels:
      zh:
      - 列方
      - 备用
    start_date: 1790-01-01
    highlight_event_id: guji-单南山-event-3
  decisions:
  - date: 1785-01-01
    title_zh: 产后以补散和为纲不用峻攻
    rationale: 产后气血大虚，胞宫未复，非急不攻，宜补养调和兼疏郁散滞以防变
  - date: 1790-01-01
    title_zh: 分补散攻涩寒热和泻八类列方
    rationale: 症杂方乱易迷，故以补六十三散三十一攻十六之类分门，使临证如盘珠可索
