    title_zh: 以顾名思义核本经立名
    rationale: 药性赋后人苟简遗大全，须就德性色味体用一端求大全以妙其用
  - date: '1646'
    title_zh: 兵燹后舍衍断存核定半偈
    rationale: 板帙零落家徒四壁，慕破甑弗顾又怀敝帚之思，先完核以公海内
- id: guji-卢之颐-endeavor-2
  title_zh: 会通家学禅学明师承医道
  summary: 承父训师传，参惟识以解仲景，宗纲目以阐本草，明道脉不冒师承
  phases:
  - key: brewing
    name: 家学父执启蒙
    labels:
      zh: 荷薪心传
