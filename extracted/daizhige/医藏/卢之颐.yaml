    labels:
      zh: 明述师承
    start_date: '1630'
    highlight_event_id: guji-卢之颐-event-1630
  - key: closure
    name: 引释典证医理俟正
    labels:
      zh: 禅医会通
    start_date: '1647'
    highlight_event_id: guji-卢之颐-event-1647
  decisions:
  - date: '1631'
    title_zh: 宗李时珍纲目为阐扬蓝本
    rationale: 纲目搜罗百代访采四方，推求前人未尽以相成惠养后世
  - date: '1647'
    title_zh: 引惟识论明仲景立方之义
    rationale: 先君与绍隆先生从绍觉法师悟惟识，见其与仲景立论暗契不敢避讥
events:
- id: guji-卢之颐-event-birth
  title_zh: 生于钱唐卢氏医家
  date: '1598'
  year_of: 1598
  description: 约万历末年生于钱唐，承先大人博议本草家学，幼耽禅学
- id: guji-卢之颐-event-1626
  title_zh: 丙寅发愤纂述乘雅
  date: '1626'
  year_of: 1626
  description: 自丙寅起核本经立名，躬莳斋圃察甲孕癸终，记所得于侧理
- id: guji-卢之颐-event-1630
  title_zh: 庚午武林诸君子集舍讲学
  date: '1630'
  year_of: 1630
  description: 武林诸君子大集余舍，期阐发仲景两论及灵素秘奥，遂诵说乘雅稿
- id: guji-卢之颐-event-1643
  title_zh: 癸未乘雅全稿始成
  date: '1643'
  year_of: 1643
  description: 自丙寅至癸未历十八春秋，原分核衍断四种名乘雅始成
- id: guji-卢之颐-event-1645
  title_zh: 乙酉兵变挈家流离
  date: 1645-05
  year_of: 1645
  description: 甲申方事剞劂，乙酉五月逢兵变挈家而逃，沿至丙戌十月生还家徒四壁板帙零落殆尽
- id: guji-卢之颐-event-1647
  title_zh: 丁亥重九书半偈自序
  date: 1647-10-04
  year_of: 1647
  description: 丁亥重九日书于无恒业，勉缉旧业完核残缺，仍名乘雅半偈以俟补衍断
- id: guji-卢之颐-event-death
  title_zh: 卒于清初
  date: '1660'
  year_of: 1660
  description: 半偈后行迹不显，约卒于顺治末年后，以残稿贻笑海内就正海内
