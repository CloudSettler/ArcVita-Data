  era: 明末清初
  reign_ref: 明崇祯
  archetype: 穷经核物的本草医哲
  dilemmas:
  - 质性黑暗师承稀少，却欲阐发仲景灵素与本经精义，恐摸索未通
  - 十八年心血乘雅全稿逢甲申乙酉兵燹板帙零落，当破甑弗顾还是敝帚自珍
  lesson: 由一名求大全，辩药之真德用以妙时措，方能不以人试方
  summary_first_person: 余钱唐卢之颐，字子繇，幼承先大人荷薪之训，私淑绍隆王先生金匮心传及象先陈先生薛案，又得仲淳缪先生指示，兼参闻谷憨山离言禅旨，自丙寅至癸未历十八春秋纂乘雅，遭兵变板毁，仅存核残缺，更名半偈以俟后贤起予
  source_urls:
  - https://daizhige.org/医藏/本草乘雅半偈.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/本草乘雅半偈.md
