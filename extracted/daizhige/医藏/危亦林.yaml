  birth_date: 1280
  death_date: 1350
  era: 元代
  reign_ref: 元文宗天历至元顺帝至正年间
  archetype: 世医方书家
  dilemmas:
  - 家传秘方宜私藏自利抑或公之于世以济众
  - 山林鄙陋见闻不博而妄意纂集当如何求当道校正补偏
  lesson: 医贵专门方贵经验，以书种德公术济世则活人无穷
  summary_first_person: 我是南丰达斋危亦林，幼读儒书弱冠业医，承高祖至我五世家传，兼通大方脉小方脉风产眼口齿正骨疮肿诸科，感方书浩如沧海而取效为难，乃于天历初元起昕夕刻苦十稔，参古方以家传仿圣济总录十三科编成世医得效方十九卷，愿家有其书人无夭死，以广圣皇好生之仁
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E4%B8%96%E5%8C%BB%E5%BE%97%E6%95%88%E6%96%B9.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E4%B8%96%E5%8C%BB%E5%BE%97%E6%95%88%E6%96%B9.md
endeavors:
- id: guji-危亦林-endeavor-1
  title_zh: 承五世家学兼通诸科仕医南丰
  description_zh: 自抚迁南丰，历高祖云仙得董奉后裔大方脉，伯祖子美传妇人正骨金镞，大父碧崖得小方科，伯熙传眼科瘵疾，至亦林再究疮肿咽喉口齿，儒医兼通仕医行医
  phases:
  - key: brewing
    name: 幼读儒书弱冠业医
    labels:
      zh:
      - 家学渊源
      - 儒医兼通
    start_date: 1300
    highlight_event_id: guji-危亦林-event-study
  - key: breakthrough
    name: 历任学录副提领教授
    labels:
      zh:
      - 仕医南丰
      - 活人济众
    start_date: 1328
    highlight_event_id: guji-危亦林-event-office
  - key: climax
    name: 遍参诸科随试随效
    labels:
      zh:
      - 兼通诸科
      - 经验得效
    start_date: 1330
    highlight_event_id: guji-危亦林-event-practice
  decisions:
  - date: 1310
    title_zh: 不守一科遍究诸科
    rationale: 先世各得一科，若拘守一科则救人不广，故再参疮肿咽喉口齿及古今名医诸方以求全
  - date: 1328
    title_zh: 就任南丰医学仕医济众
    rationale: 国朝设惠民局医学以恤疾苦，愿以家庭之训见诸方册，仕医以尽活人济世之心
- id: guji-危亦林-endeavor-2
  title_zh: 十年编纂刊行世医得效方
  description_zh: 以天历初元起昕夕弗怠刻苦十稔，根据古方参以家传，仿圣济总录十三科编次十九卷十二帙，申官校正绣梓广传
  phases:
  - key: brewing
    name: 天历初元发凡起例
    labels:
      zh:
      - 发纵指示
      - 十三科纲
    start_date: 1328
    highlight_event_id: guji-危亦林-event-office
  - key: breakthrough
    name: 十稔刻苦编次初成
    labels:
      zh:
      - 博见约取
      - 纲举目张
    start_date: 1337-08-01
    highlight_event_id: guji-危亦林-event-compile
  - key: climax
    name: 申官校正绣梓广传
    labels:
      zh:
      - 公术于人
      - 以书种德
    start_date: 1343-06-01
    highlight_event_id: guji-危亦林-event-publish
  - key: closure
    name: 流传后世活人无穷
    labels:
      zh:
      - 家有其书
      - 人无夭死
    start_date: 1343-06-01
    highlight_event_id: guji-危亦林-event-publish
  decisions:
  - date: 1328
    title_zh: 立志编书便观览
    rationale: 方书浩若沧海卒有所索目不能周，欲分门析类由博见约，使一开卷间对病知证因证得药
  - date: 1337-08-01
    title_zh: 尽公家传秘方不私藏
    rationale: 得一方辄靳示人往往自误，以身种有限以书种无穷，愿尽五世所得之秘公诸人以种阴德
  - date: 1337-11-01
    title_zh: 申解官司求委官校正
    rationale: 自愧山林鄙陋见闻不博舛谬惟多，恐己见差殊，故申江西官医提举司转申太医院三复校正而后刊行
events:
- id: guji-危亦林-event-birth
  date: 1280
  year_of: 1280
  title_zh: 生于江西南丰危氏医门
  description_zh: 鼻祖自抚迁南丰，世为医家，至是五世相承，幼读儒书为儒医地步
  place_zh: 江西南丰
- id: guji-危亦林-event-study
  date: 1300
  year_of: 1300
  title_zh: 弱冠业医承授诸科
  description_zh: 弱冠业医，重念先世授受之难，遍承大方脉小方脉妇人正骨金镞眼科瘵疾疮肿咽喉口齿诸传
  place_zh: 江西南丰
- id: guji-危亦林-event-office
  date: 1328
  year_of: 1328
  title_zh: 任南丰州医学学录转官医副提领
  description_zh: 自天历元年充本州医学学录，转充官医副提领，家居丰郡世称良医，儒学渊源医书博览
  place_zh: 江西南丰州
- id: guji-危亦林-event-practice
  date: 1330
  year_of: 1330
  title_zh: 兼通诸科随试随效
  description_zh: 并诸积古方及近代名医诸方，由高祖至身凡五世，随试随效，医道日行
  place_zh: 江西南丰
- id: guji-危亦林-event-compile
  date: 1337-08-01
  year_of: 1337
  title_zh: 编成世医得效方十九卷
  description_zh: 以十三科名目根据古方参以家传，昕夕弗怠刻苦凡十稔，首论脉病证治，次由大方脉杂医科发端至疮肿科终编，为十有九卷
  place_zh: 江西南丰
- id: guji-危亦林-event-publish
  date: 1343-06-01
  year_of: 1343
  title_zh: 建宁绣梓广传申解太医院
  description_zh: 经南丰医学甘学正保举，江西官医提举司余提举校正申解太医院，建宁路官医提领陈志命工绣梓，以广圣皇好生之仁
  place_zh: 福建建宁路
- id: guji-危亦林-event-death
  date: 1350
  year_of: 1350
  title_zh: 元末卒于南丰
  description_zh: 以世医活人阴德及刊书济世之功，终老于南丰，书行于世而泽被后人
  place_zh: 江西南丰
