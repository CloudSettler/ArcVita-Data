  name_zh: 危亦林
  names:
    zh: 危亦林
    en: Wei Yilin
  lifespan:
    birth:
      date: 1280
      precision: year
      is_circa: true
      raw: 约元世祖末年生于江西南丰
    death:
      date: 1350
