  summary_first_person: 余幼在武城侍膝下见舅氏淡园为季子失明作经穴汇解上下二卷仅引三五家不足取征乃以家藏书修补增为八卷本之灵素甲乙参之铜人图经上自千金外台下至明清诸书搜罗会粹正以经脉量以尺度揣以骨度动脉冀后学无乖错之弊
