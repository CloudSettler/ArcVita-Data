  dilemmas:
  - 燥属秋阴而反同风热火化当如何辨阴阳以定病机
  - 亡液成燥与风热耗液成燥当如何分用温开与凉润之法
  - 世人多以燥药治燥致阴气消亡当如何力挽其弊
  lesson: 燥虽属秋阴其性反同风热火详辨兼化虚实开通道路养阴退阳慎用燥热乌附
  summary_first_person: 吾守真河间人也览内经诸涩枯涸干劲皴揭皆属于燥之文乃推手阳明燥金肺与大肠之化辨风能胜湿热能耗液而为燥著论以正世之以燥治燥者欲使荣血通流气液宣通而已
