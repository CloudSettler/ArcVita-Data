endeavors:
- id: guji-刘完素-endeavor-1
  title_zh: 阐发燥病病机立诸涩枯涸皆属于燥之纲
  description: 承素问阴阳应象脏气法时诸篇以手阳明燥金解肺与大肠之气辨春秋燥湿相反紧敛纵缓之异论皴揭麻痹枯涸之源归于水液衰少气行壅滞及风胜湿热耗液之兼化
  phases:
  - key: brewing
    name: 溯素问而酝酿燥纲
    labels:
      zh: 溯经酝酿
    start_date: '1150-01-01'
    highlight_event_id: guji-刘完素-event-study
  - key: breakthrough
    name: 悟风热胜湿为燥
    labels:
      zh: 悟燥兼化
    start_date: '1168-01-01'
    highlight_event_id: guji-刘完素-event-lunzao
  - key: climax
    name: 著论定涩枯涸揭之目
    labels:
      zh: 著论定纲
    start_date: '1172-01-01'
    highlight_event_id: guji-刘完素-event-lunzao
  - key: closure
    name: 以金极反兼火化收束燥义
    labels:
      zh: 收束成说
    start_date: '1180-01-01'
    highlight_event_id: guji-刘完素-event-school
  decisions:
  - date: '1168-01-01'
    title_zh: 断燥虽同阴而反同阳
    rationale: 经言寒燥湿同阴然燥金虽属秋阴其性异于寒湿反同风热火故当以阳实阴虚风热胜水湿立论
  - date: '1172-01-01'
    title_zh: 分亡液与风热两途致麻
    rationale: 亡液为燥无热证则冲开道路以通利风热胜湿为燥而病麻则退风散热活血养液润燥通气不可混治
- id: guji-刘完素-endeavor-2
  title_zh: 立燥证治法主开通道路养阴退阳
  description: 鉴世人以乌附辛热治燥重伤阴血乃立法宜开通道路养阴退阳以凉药调之使荣血通流麻木涩涸干劲皴揭皆得其所慎毋服乌附燥药助火
  phases:
  - key: brewing
    name: 察寒敛燥涩病形
    labels:
      zh: 察形酝酿
    start_date: '1165-01-01'
    highlight_event_id: guji-刘完素-event-study
  - key: breakthrough
    name: 悟凉药润燥之旨
    labels:
      zh: 悟润治法
    start_date: '1172-01-01'
    highlight_event_id: guji-刘完素-event-lunzao
  - key: climax
    name: 示开通养阴退阳大法
    labels:
      zh: 示法救弊
    start_date: '1175-01-01'
    highlight_event_id: guji-刘完素-event-lunzao
  - key: closure
    name: 诫乌附而传河间心法
    labels:
      zh: 诫附传学
    start_date: '1185-01-01'
    highlight_event_id: guji-刘完素-event-school
  decisions:
  - date: '1175-01-01'
    title_zh: 定凉润为燥证正治
    rationale: 燥则血涩气液凝滞润则血旺气液宣通故宜甘寒润剂养血以润之不可徒以辛香动火发汗
  - date: '1180-01-01'
    title_zh: 禁乌附燥药治燥
    rationale: 燥已伤阴乌附辛热开通虽快终助火烁金耗液惟亡液无热之麻痹壅滞可暂用余皆宜凉药调荣血通流
