  decisions:
  - date: 1150-06-01
    title_zh: 断鼽为肺热甚出涕非肺寒
    rationale: 见冒寒则甚者乃腠理闭密热极怫郁愈甚故不从寒治
  - date: 1162-03-01
    title_zh: 断鼻窒为热客阳明肿胀非寒闭
    rationale: 火主肿胀侧卧上下通塞乃左右经脉相交风热偏郁所致
- id: guji-刘完素-endeavor-2
  title_zh: 制防风汤通圣散治鼻渊嚏痒
  summary: 本胆移热于脑辛頞鼻渊之旨创清热祛风开通之法兼治嚏痒焦干
