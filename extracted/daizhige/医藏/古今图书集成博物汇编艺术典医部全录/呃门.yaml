endeavors:
- id: guji-呃门-endeavor-1
  title_zh: 经典立哕以胃逆为纲
  summary: 自素问至真要大论灵枢杂病金匮要略中藏经奠定哕为胃气上逆刺鼻取嚏利前后分部之纲
  phases:
  - key: brewing
    name: 素问灵枢肇名
    labels:
      zh: 肇名胃逆
    start_date: -0380
    highlight_event_id: guji-呃门-event-birth
  - key: breakthrough
    name: 金匮分证主方
    labels:
      zh: 分证主方
    start_date: '0200'
    highlight_event_id: guji-呃门-event-1
  decisions:
  - date: -0380
    title_zh: 以哕系三阴三阳之复与心肺胃
    rationale: 少阴阳明太阳之复皆见哕噫咳哕心脉胃逆为纲以统后世
  - date: '0200'
    title_zh: 视前后知何部不利而利之
    rationale: 黄疸热除必哕腹满哕者察前后二便以小半夏承气猪苓之属决之
- id: guji-呃门-endeavor-2
  title_zh: 后世辨名分阴阳虚实论治
  summary: 宋金元明清诸家辨哕非咳逆非呃忒分阴寒阳热虚实火冲而施橘皮竹茹丁香柿蒂吐下温凉之法汇成呃门
  phases:
  - key: climax
    name: 宋元辨呃火义
    labels:
      zh: 辨名降火
    start_date: '1240'
    highlight_event_id: guji-呃门-event-2
  - key: closure
    name: 明清汇证刊录
    labels:
      zh: 汇证定型
    start_date: '1600'
    highlight_event_id: guji-呃门-event-3
  decisions:
  - date: '1240'
    title_zh: 辨哕呃咳三名不相紊
    rationale: 东垣丹溪力辨哕为干呕类咳逆为气逆呃为入声以正活人明理之误别火与元气之贼
  - date: '1600'
    title_zh: 分阴阳虚实寒热而治
    rationale: 阳证小柴胡竹茹承气阴证橘皮干姜附子虚者补中四物实者吐下以纸捻取嚏闭气大惊为助
events:
- id: guji-呃门-event-birth
  title_zh: 素问灵枢始载哕
  date: -0380
  year_of: -380
  place_zh: 中原
  description: 至真要大论言少阴阳明太阳之复皆为哕噫咳哕灵枢言心脉小甚为善哕胃为气逆哕草刺鼻嚏无息迎引大惊止哕开后世治呃之源
- id: guji-呃门-event-1
  title_zh: 金匮中藏立哕病证治
  date: '0200'
  year_of: 200
  place_zh: 南阳
  description: 张机立哕而腹满视前后利之小半夏汤主热除必哕华佗言脾胀喜哕寒则腰脊疼哕不能食奠虚寒为本之说
- id: guji-呃门-event-2
  title_zh: 宋元辨呃逆属火
  date: '1240'
  year_of: 1240
  place_zh: 河东江南
  description: 朱肱严用和成无己论伤寒吐下后胃虚寒哕李杲辨哕非咳逆朱震亨言诸逆冲上皆属火阴气依胃为养木挟相火直冲清道
- id: guji-呃门-event-3
  title_zh: 明清分证汇方
  date: '1600'
  year_of: 1600
  place_zh: 江南闽浙
  description: 李梴戴思恭陶华徐春甫王肯堂分阴阳虚实劳役伤食痰气失下以橘皮竹茹丁香柿蒂小柴胡承气吐法详列脉死候
- id: guji-呃门-event-death
  title_zh: 医部全录汇刊定型
  date: '1725'
  year_of: 1725
  place_zh: 京师
  description: 古今图书集成博物汇编艺术典医部全录卷三百二十五汇素问灵枢金匮以迄明清诸家之论呃门体系遂定
