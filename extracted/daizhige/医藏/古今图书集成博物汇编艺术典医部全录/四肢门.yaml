endeavors:
- id: guji-四肢门-endeavor-1
  title_zh: 阐发脾胃充养四肢之理
  summary_zh: 以素问阴阳应象太阴阳明阳明脉解逆调诸篇，立清阳实四肢，四肢禀气于胃因于脾之纲，辨痿痹不用多责脾湿
  phases:
  - key: brewing
    name: 清阳实四肢立论
    labels:
      zh:
      - 清阳实四肢
      - 浊阴归六腑
      - 脾主四肢
    start_date: -0430-01-01
    highlight_event_id: guji-四肢门-event-birth
  - key: breakthrough
    name: 太阴阳明释四肢不用
    labels:
      zh:
      - 四肢禀气于胃
      - 必因于脾乃得禀
    start_date: -0300-01-01
    highlight_event_id: guji-四肢门-event-suwen
  - key: climax
    name: 阳明实则能登高
    labels:
      zh:
      - 四肢为诸阳之本
      - 阳盛则实
    start_date: -0200-01-01
    highlight_event_id: guji-四肢门-event-lingshu
  - key: closure
    name: 医部全录汇编定型
    labels:
      zh:
      - 土太过则四肢不举
      - 脾病身重足不收
    start_date: 1726-01-01
    highlight_event_id: guji-四肢门-event-compilation
  decisions:
  - date: -0300-01-01
    title_zh: 以脾为转输定四肢不用之因
    rationale: 胃为水谷之海，脾为转输之官，脉道不利则筋骨肌肉无气以生，故治痿先调脾胃
  - date: -0200-01-01
    title_zh: 以阴阳和失辨肿与热
    rationale: 结阳则肿四肢，阴虚阳盛则四肢热逢风如炙，当分清浊补泻以和表里
- id: guji-四肢门-endeavor-2
  title_zh: 分经辨证四肢痹厥跛枯
  summary_zh: 以厥论风论灵枢邪气脏腑病形诸篇，分太阳少阳厥阴与风寒湿，辨跖跛偏枯足寒足热之经络虚实
  phases:
  - key: brewing
    name: 三阴三阳发病察偏枯痿易
    labels:
      zh:
      - 偏枯痿易
      - 四肢不举
    start_date: -0400-01-01
    highlight_event_id: guji-四肢门-event-birth
  - key: breakthrough
    name: 伤风在上伤湿在下
    labels:
      zh:
      - 阳病上行极而下
      - 阴病下行极而上
    start_date: -0300-01-01
    highlight_event_id: guji-四肢门-event-suwen
  - key: climax
    name: 经脉厥逆致跛与寒热
    labels:
      zh:
      - 巨阳厥足不能行
      - 少阳厥胻不可以运
      - 肾脉急足不收
    start_date: -0200-01-01
    highlight_event_id: guji-四肢门-event-lingshu
  - key: closure
    name: 运气客胜统摄四肢痛痿
    labels:
      zh:
      - 岁土太过四肢不举
      - 太阳在泉股胫足痛
    start_date: 1726-01-01
    highlight_event_id: guji-四肢门-event-compilation
  decisions:
  - date: -0200-01-01
    title_zh: 按经定位手足寒热痛痹
    rationale: 三阳在头三阴在手，邪中手足则气至而病，当循经审脉以别虚实重虚
  - date: 1726-01-01
    title_zh: 合运气时令论四肢外在肌肉病
    rationale: 土不及则病外在肌肉四肢，岁运客胜扰脾肾，故久立久坐起视眩皆须参天时
events:
- id: guji-四肢门-event-birth
  title_zh: 素问立论四肢为诸阳之本
  date: -0430-01-01
  year_of: -430
  event_type: birth
  description_zh: 黄帝素问阴阳应象言清阳实四肢，阳明脉解言四肢者诸阳之本，为全门立纲
- id: guji-四肢门-event-suwen
  title_zh: 太阴阳明阐释四肢禀气于胃脾
  date: -0300-01-01
  year_of: -300
  event_type: endeavor
  description_zh: 岐伯答脾病四肢不用，因于脾乃得禀胃气，脉道不利则筋骨肌肉不用，又论风伤上湿伤下
- id: guji-四肢门-event-lingshu
  title_zh: 灵枢论经脉厥逆致足不收跛偏枯
  date: -0200-01-01
  year_of: -200
  event_type: endeavor
  description_zh: 灵枢邪气脏腑病形言肾脉急足不收，合素问厥论巨阳少阳厥阴之足不行胻不运屈膝，分经辨四肢疾
- id: guji-四肢门-event-compilation
  title_zh: 医部全录卷一百八十九汇编定型
  date: 1726-01-01
  year_of: 1726
  event_type: death
  description_zh: 古今图书集成博物汇编艺术典医部全录汇素问灵枢四肢诸论为一门，载运气客胜与示从容阴阳类论，成定本
