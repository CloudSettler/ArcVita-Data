      raw: 约战国秦汉素问成篇之时
    death:
      date: 1726-01-01
      precision: year
      is_circa: true
      raw: 清雍正四年医部全录汇编定本
  birth_date: -0430-01-01
  death_date: 1726-01-01
  era: 上古至清
  reign_ref: 黄帝至雍正
  archetype: 医典门类化身
  dilemmas:
  - 清阳当实四肢而浊阴当归六腑，如何分辨虚实以治痿痹不用
  - 脾主四肢而经脉分属五脏，如何统合脾胃转输与十二经行气
  lesson: 四肢为诸阳之本，禀气于胃而转输于脾，养筋骨肌肉以立形，察清浊虚实以复用
  summary_first_person: 吾为四肢之总门，生于素问阴阳应象与太阴阳明之论，长于灵枢经脉厥逆之辨，主张清阳实四肢，脾胃养筋骨，四肢不用则责之脾土转输不利，偏枯痿易则责之阴阳失和
  source_urls:
