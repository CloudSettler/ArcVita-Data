endeavors:
- id: guji-孔子-endeavor-1
  title_zh: 慎疾谨药立教
  summary_zh: 以所慎齐战疾为教，辞季康子馈药，明臣子先尝君父饮药之义
  phases:
  - key: brewing
    name: 少习礼慎疾
    labels:
      zh: 萌芽
    start_date: -551-09-28
    highlight_event_id: guji-孔子-event-birth
  - key: breakthrough
    name: 明慎疾之训
    labels:
      zh: 立说
    start_date: -496-01-01
    highlight_event_id: guji-孔子-event-1
  - key: climax
    name: 辞康子馈药
    labels:
      zh: 实践
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-2
  - key: closure
    name: 以慎疾垂后世
    labels:
      zh: 成教
    start_date: -479-04-11
    highlight_event_id: guji-孔子-event-death
  decisions:
  - date: -484-01-01
    title_zh: 辞季康子馈药不敢尝
    rationale: 未达药性则不敢尝，守慎疾之义，不以不明之药自试亦不轻进
  - date: -496-01-01
    title_zh: 申臣子先尝之义
    rationale: 君父有疾饮药臣子先尝，谨齐量寒热补泻之宜以全忠孝
- id: guji-孔子-endeavor-2
  title_zh: 正巫医恒业之辨
  summary_zh: 言无恒之人不可以作巫医，合医不三世不服其药之古义，重专精传承
  phases:
  - key: brewing
    name: 观医巫之杂
    labels:
      zh: 见闻
    start_date: -521-01-01
    highlight_event_id: guji-孔子-event-birth
  - key: breakthrough
    name: 发无恒之戒
    labels:
      zh: 立论
    start_date: -496-01-01
    highlight_event_id: guji-孔子-event-1
  - key: climax
    name: 许止不尝药之鉴
    labels:
      zh: 垂戒
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-2
  - key: closure
    name: 以恒业传道统
    labels:
      zh: 定论
    start_date: -479-04-11
    highlight_event_id: guji-孔子-event-death
  decisions:
  - date: -496-01-01
    title_zh: 断无恒者不可作巫医
    rationale: 巫医系人死生，非有恒心恒业者不能谨物齐量，故斥无恒
  - date: -484-01-01
    title_zh: 守医贵专精传承
    rationale: 医道论篇可传后世，必专心守经循法守度，不妄作杂术以误人
