  title_zh: 论无恒不可以作巫医
  date: -496-01-01
  year_of: -496
  location_zh: 鲁国
  description_zh: 孔子言无恒之人不可以作巫医，明医术当专精有恒，合医不三世不服其药之义
- id: guji-孔子-event-2
  type: career
  title_zh: 季康子馈药不敢尝
  date: -484-01-01
  year_of: -484
  location_zh: 鲁国
  description_zh: 季康子馈药，孔子对曰丘未达不敢尝，守君有疾饮药臣先尝父有疾饮药子先尝之慎，与许世子止不尝药被弑君之名相对发明
- id: guji-孔子-event-death
