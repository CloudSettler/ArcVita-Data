  dilemmas:
  - title_zh: 出仕与隐逸之择
    description: 太宗高宗屡征不就，守山林以全医道济世之志
  - title_zh: 喉证寒热之辨
    description: 脏热则肿塞腑寒则耿耿，不敢一概清火须依脏调治
  lesson: 喉咙为脾胃之候，热则开之寒则通之，不热不寒依脏调之，以慈悲存心以精勤济世
  summary_first_person: 吾隐居太白终南，博览经方，撰千金以救疾苦，论喉咙通利水谷往来神气，愿以医为济世之仁，不慕荣达，但愿生民少病
