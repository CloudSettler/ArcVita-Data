  - key: climax
    name: 立将息大经以防复发
    labels:
      zh: 高潮
    start_date: 0659-06-01
    highlight_event_id: guji-孙思邈-event-wenbu-jiuzhi
  - key: closure
    name: 叹骄恣不慎而至难治
    labels:
      zh: 收束
    start_date: 0660-01-01
    highlight_event_id: guji-孙思邈-event-wenbu-jiuzhi
  decisions:
  - date: 0659-01-01
    title_zh: 久冷积痢先下后补
    rationale: 久痢脾虚积滞胶结非温下不去非补养不复故以下开其闭以补实其本
  - date: 0659-06-01
    title_zh: 严忌生冷并定将息期限
    rationale: 食饮失节则胃气复伤痢必再发故重者慎口百日次者一月皆须大熟烂勿伤饱
