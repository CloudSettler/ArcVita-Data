    start_date: '0659-01-01'
    highlight_event_id: guji-孙思邈-event-2
  - key: closure
    name: 垂训慎针灸慎厚暖
    labels:
      zh: 垂训慎养
    start_date: '0660-01-01'
    highlight_event_id: guji-孙思邈-event-2
  decisions:
  - date: '0645-01-01'
    title_zh: 乳母寒热房劳皆先去乳而后哺
    rationale: 乳为血化，母怒醉热皆能传儿致惊癎黄瘦，故节之
  - date: '0659-01-01'
    title_zh: 以旧絮薄衣数见风日为常法
    rationale: 暖衣则筋骨缓弱，不见风则肌肤脆软，故如春候养之
