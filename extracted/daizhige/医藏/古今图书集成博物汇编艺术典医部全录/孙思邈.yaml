  - date: '0630-01-01'
    title_zh: 绵裹指急拭口中青泥恶血
    rationale: 啼声未发先清咽喉，防恶血入腹成百病
  - date: '0640-01-01'
    title_zh: 隔单衣咬断脐带暖气呵护
    rationale: 忌刀割中寒，留六寸缠至足趺，防腹痛脐风下痢
  - date: '0652-01-01'
    title_zh: 先与甘草汤后慎与朱蜜牛黄
    rationale: 吐去心胸恶汁则神慧无病，多与则脾冷腹胀变痉
- id: guji-孙思邈-endeavor-2
  title_zh: 撰备急千金要方惠幼科
  summary: 集古今方论，载小儿护养哺乳灸忌，使后世有据可守
