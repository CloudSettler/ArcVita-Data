  decisions:
  - date: 0652-01-01
    title_zh: 冷白热赤疳杂蛊瘀分治
    rationale: 冷热虚实不同须去干姜益黄连或加温热吹灌各随其宜方能主对相当
  - date: 0652-06-01
    title_zh: 暴痢用陟厘乌梅松皮速治
    rationale: 暴痢积滞未深以通利宣荡为要故撮效方使人速服无致迁延胃弱
- id: guji-孙思邈-endeavor-2
  title_zh: 温脾建脾治久痢并倡慎口将息
  summary: 主久下温补先下后补并严忌生冷酢滑定百日一月将息之限
  phases:
  - key: brewing
    name: 见久痢胃弱心力俱微
