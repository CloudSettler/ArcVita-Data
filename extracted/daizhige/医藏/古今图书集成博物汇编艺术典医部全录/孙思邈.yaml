  dilemmas:
  - 过暖过饱姑息为爱反害小儿与清凉节养保全真阴之抉择
  - 热毒攻伐取速效与无毒调养固根本之抉择
  lesson: 初生护养当先清后养，节乳哺，适寒温，慎用药，若要小儿安，常受三分饥与寒
  summary_first_person: 吾少多病，隐居太白，究心医道，著千金要方，首论小儿初生出腹，拭口断脐浴儿哺乳，一法一戒皆为保赤子，愿后人不以厚暖为恩，不以热毒为功，守春和以全其真
