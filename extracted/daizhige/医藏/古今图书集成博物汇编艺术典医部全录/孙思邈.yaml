    rationale: 恐宦途妨医，愿留山中为生民治病，不以荣禄易济世之心
  - date: '0660'
    title_zh: 以乌翣膏等治脏热喉塞
    rationale: 脏热则气不通，须清热开结，腑寒则温通，不可妄用寒凉伤胃气
events:
- id: guji-孙思邈-event-birth
  title_zh: 降生京兆华原
  date: '0541'
  year_of: 541
  description: 隋开皇前后生于京兆华原，自幼多病遂发愤学医
- id: guji-孙思邈-event-study
  title_zh: 隐太白博览医经
  date: '0600'
  year_of: 600
  description: 隐居太白山博览素问灵枢及诸家经方，究喉咽呼吸水谷之分
- id: guji-孙思邈-event-qianjin
  title_zh: 撰成备急千金要方
  date: '0652'
  year_of: 652
  description: 撰千金要方三十卷，兼及喉咙嗌喉痹痛诸方，传于世
- id: guji-孙思邈-event-houlong
  title_zh: 立喉咙脾胃之候论
  date: 0659
  year_of: 659
  description: 明喉咙长一尺二寸广二寸十二重应十二时，若脏热则肿塞用乌翣膏，若腑寒则耿耿如物当温通
- id: guji-孙思邈-event-death
  title_zh: 永淳元年羽化
  date: 0682
  year_of: 682
  description: 唐永淳元年卒，年百余岁，遗命薄葬，后世尊为药王
