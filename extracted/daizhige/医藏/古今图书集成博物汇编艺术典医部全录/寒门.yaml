  date: -0256-01-01
  year_of: -256
  description: 内经言阴盛生内寒血凝脉不通脉盛大以濇为后世中寒立纲
- id: guji-寒门-event-zhonghan
  title_zh: 证治准绳定中寒温法
  date: 1602-01-01
  year_of: 1602
  description: 王肯堂辨中寒与伤寒之异定苏合五积姜附理中分经加减兼灸丹田
