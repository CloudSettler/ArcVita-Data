- id: guji-寒门-event-jingyue
  title_zh: 景岳全书温补三阴
  date: 1624-01-01
  year_of: 1624
  description: 张介宾言寒由外入由内生之别立理中四逆归气暖肝分治太阴阳明厥阴
- id: guji-寒门-event-death
