  description: 朱震亨列伤风伤寒伤暑伤食痘疹变蒸潮热惊热夜热余热疳热壮热等各立方药戒妄汗下
- id: guji-小儿诸热门-event-fangxian
  title_zh: 方贤详述十四证小儿诸热
  date: '1520-01-01'
  year_of: 1520
  description: 明方贤详惊热温壮壮热风热烦热潮热积热虚实疳热主治明表里俱虚阳浮再热宜和胃收阳
