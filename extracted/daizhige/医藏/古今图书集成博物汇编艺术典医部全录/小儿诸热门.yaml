  date: -300-01-01
  year_of: -300
  description: 黄帝问乳子病热脉悬小岐伯答手足温生寒死喘鸣肩息脉实大缓生急死奠后天胃气宗气之宗
- id: guji-小儿诸热门-event-qianyi
