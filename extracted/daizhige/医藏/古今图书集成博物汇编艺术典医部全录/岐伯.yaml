  date: '-2600'
  year_of: -2600
  title_zh: 对黄帝论鼓胀厥逆与腹满
  description: 答黄帝心腹满旦食不能暮食为鼓胀主鸡矢醴论膺肿颈痛胸满腹胀为厥逆阳气重上须气并乃治论寒生浊上生䐜胀太阴厥腹满䐜胀
- id: guji-岐伯-event-shuizhong
  date: '-2599'
  year_of: -2599
  title_zh: 论水热穴风水胕肿与胀形针法
  description: 言肾者胃之关关门不利聚水溢皮肤为胕肿风水客元府行皮里言三阴结谓水结阳肿四肢石水少腹肿并陈心烦短气肺虚满喘咳肝胁满引小腹脾哕体重肾腹满引背及六腑胀状
