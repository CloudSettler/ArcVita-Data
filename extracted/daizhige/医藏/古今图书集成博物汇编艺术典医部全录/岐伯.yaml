      - 三阴结水
      - 腹中鼓胀
    start_date: '-2600'
    highlight_event_id: guji-岐伯-event-guzhang
  decisions:
  - date: '-2600'
    title_zh: 以鸡矢醴治鼓胀心腹满旦食不能暮食
    rationale: 脾土难运胀满不食故以通利行水一剂知二剂已
  - date: '-2600'
    title_zh: 断肾风脉大紧身无痛形不瘦不能食
    rationale: 病生在肾风水上乘非外受风邪故别于骨节疼痛之风水
- id: guji-岐伯-endeavor-2
  title_zh: 垂灵枢胀论辨五脏六腑胀形与针治
  summary: 立胀舍在脏腑之外郭胸胁胀皮肤之说分别心肺肝脾肾胃大小肠膀胱三焦胆胀并取足三里疾泻
  phases:
  - key: breakthrough
    name: 分形立法
    labels:
