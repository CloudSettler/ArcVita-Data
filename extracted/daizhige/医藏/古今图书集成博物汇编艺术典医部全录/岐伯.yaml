      - 胀论
      - 脉大坚涩
    start_date: '-2599'
    highlight_event_id: guji-岐伯-event-shuizhong
  - key: closure
    name: 传法水肿
    labels:
      zh:
      - 肾主水
      - 风水胕肿
    start_date: '-2599'
    highlight_event_id: guji-岐伯-event-shuizhong
  decisions:
  - date: '-2599'
    title_zh: 定脉大坚以涩者胀阴脏阳腑之别
    rationale: 大则邪盛坚则邪实涩则气血不流故以阴阳分脏腑之胀
  - date: '-2599'
    title_zh: 立卫气逆为脉胀并脉为肤胀取三里泻之
    rationale: 营循脉卫逆留则为脏腑之胀故无问虚实工在疾泻防留为深
