endeavors:
- id: guji-张机-endeavor-1
  title_zh: 撰伤寒杂病论立下利泄泻辨治纲纪
  summary_zh: 博采素问难经诸家论泄之旨，集六经脉证，以温清补下分别下利寒热虚实，垂桃花汤白头翁汤通脉四逆汤等方。
  phases:
  - key: brewing
    name: 南阳习医博采古训
    labels:
      zh: 习医
    start_date: '0165'
    highlight_event_id: guji-张机-event-study
  - key: breakthrough
    name: 辨六经立下利纲要
    labels:
      zh: 立法
    start_date: 0196
    highlight_event_id: guji-张机-event-office
  - key: climax
    name: 著书明寒热虚实治法
    labels:
      zh: 著书
    start_date: '0205'
    highlight_event_id: guji-张机-event-book
  - key: closure
    name: 方论流传惠及后世
    labels:
      zh: 传世
    start_date: '0210'
    highlight_event_id: guji-张机-event-book
  decisions:
  - date: 0198
    title_zh: 以脉辨下利当下当温
    rationale: 下利三部脉平而心下坚者当急下，脉沉迟清谷者当温里，脉证不符则不妄攻，以存胃气。
  - date: '0205'
    title_zh: 定热利下重用白头翁汤
    rationale: 热利下重便脓血者系热毒在里，宜清热坚阴，不可单止涩，以去邪为安。
- id: guji-张机-endeavor-2
  title_zh: 长沙坐堂行医救疫活人
  summary_zh: 任长沙太守不废医事，坐堂诊疾，治洞泄飧泄鹜溏清谷诸证，活人甚众，践行进则救世退则救民之志。
  phases:
  - key: brewing
    name: 怜宗族夭亡立救世志
    labels:
      zh: 立志
    start_date: 0168
    highlight_event_id: guji-张机-event-study
  - key: breakthrough
    name: 出守长沙坐堂诊病
    labels:
      zh: 坐堂
    start_date: 0196
    highlight_event_id: guji-张机-event-office
  - key: climax
    name: 疫疠流行全力救治下利
    labels:
      zh: 救疫
    start_date: '0202'
    highlight_event_id: guji-张机-event-office
  - key: closure
    name: 辞官归隐专心著述
    labels:
      zh: 归隐
    start_date: 0208
    highlight_event_id: guji-张机-event-book
  decisions:
  - date: 0196
    title_zh: 坐堂问疾不避卑贱
    rationale: 医道贵在济众，虽居太守仍开堂候诊，使下利困厄者皆得及时诊治。
  - date: '0203'
    title_zh: 先温里后攻表治腹胀下利身痛
    rationale: 下利腹胀满而身体疼痛者里虚为本，先温其里乃攻其表，免汗出胀满之变。
