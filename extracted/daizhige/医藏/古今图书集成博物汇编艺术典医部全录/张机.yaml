  dilemmas:
  - 咳案虚实寒热错杂，误治则耗正伤肺，当守温清补泻之度
  - 支饮伏饮隐伏难见，攻逐与扶正相悖，当权衡缓急先后
  lesson: 辨证求因方证相应，治咳必治其本而护胃气
  summary_first_person: 吾南阳张机，感宗族疫亡，发愤著伤寒杂病，於咳喘痰饮详辨肺痿肺痈支饮风水，立射干麻黄小青龙十枣诸方以存津液而逐邪水，愿后人观脉证而知进退
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%9B%BE%E4%B9%A6%E9%9B%86%E6%88%90%E5%8D%9A%E7%89%A9%E6%B1%87%E7%BC%96%E8%89%BA%E6%9C%AF%E5%85%B8%E5%8C%BB%E9%83%A8%E5%85%A8%E5%BD%95/%E5%92%B3%E5%97%BD%E9%97%A8.html
endeavors:
- id: guji-张机-endeavor-1
  title_zh: 著金匮杂证辨咳分肺痿肺痈
  summary_zh: 承素问咳论五脏六腑皆令人咳之旨，辨热在上焦为肺痿与热壅血瘀为肺痈，立桔梗汤射干麻黄诸方
  phases:
  - key: brewing
    name: 博采素难奠基
    labels:
      zh:
      - 酿造
      - 读经
    start_date: 0196
    highlight_event_id: guji-张机-event-1
  - key: breakthrough
    name: 立肺痿浊唾之辨
    labels:
      zh:
      - 突破
      - 辨证
    start_date: '0204'
    highlight_event_id: guji-张机-event-1
  - key: climax
    name: 别肺痈脓血之候
    labels:
      zh:
      - 高潮
      - 立方
    start_date: '0206'
    highlight_event_id: guji-张机-event-1
  - key: closure
    name: 成杂证咳篇传世
    labels:
      zh:
      - 收束
      - 成书
    start_date: '0210'
    highlight_event_id: guji-张机-event-1
  decisions:
  - date: '0206'
    title_zh: 以脉合证别痿痈
    rationale: 寸口微数为风热在卫荣，咳吐浊沫米粥者辨为痈脓初萌可救，脓成则死，故早用桔梗宣壅排脓
  - date: 0208
    title_zh: 喉中水鸡声用射干麻黄
    rationale: 咳而上气喉鸣如水鸡乃寒饮射肺，须宣肺散寒涤痰，不可纯用寒凉遏邪
- id: guji-张机-endeavor-2
  title_zh: 治支饮伏饮咳喘不得卧
  summary_zh: 论支饮咳逆倚息不得卧与留饮胁痛，创小青龙十枣茯苓桂枝五味诸法，攻逐停饮而护正
  phases:
  - key: brewing
    name: 察饮病咳喘之源
    labels:
      zh:
      - 酿造
      - 察饮
    start_date: 0198
    highlight_event_id: guji-张机-event-2
  - key: breakthrough
    name: 悟弦脉为水之机
    labels:
      zh:
      - 突破
      - 诊脉
    start_date: '0205'
    highlight_event_id: guji-张机-event-2
  - key: climax
    name: 十枣逐水小青龙解表
    labels:
      zh:
      - 高潮
      - 攻逐
    start_date: '0207'
    highlight_event_id: guji-张机-event-2
  - key: closure
    name: 调气冲定咳满之法
    labels:
      zh:
      - 收束
      - 调气
    start_date: '0212'
    highlight_event_id: guji-张机-event-2
  decisions:
  - date: '0207'
    title_zh: 咳家脉弦用十枣逐水
    rationale: 弦为水饮内停，咳烦胸痛非卒死之证，当峻逐胸胁伏饮而后安肺，不可徒止咳
  - date: '0212'
    title_zh: 气冲咳满去桂加姜辛半夏
    rationale: 小青龙下后气从小腹上冲胸咽复咳满者，乃支饮未去，当以干姜细辛温化，冒呕者加半夏去水
