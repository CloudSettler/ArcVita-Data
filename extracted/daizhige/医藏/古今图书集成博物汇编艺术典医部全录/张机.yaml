  decisions:
  - date: '0200'
    title_zh: 以呕吐而利定霍乱名兼辨伤寒
    rationale: 别吐利与霍乱，别伤寒与饮食伤，使内外不和者有据
  - date: '0205'
    title_zh: 热多用五苓寒多用理中
    rationale: 中焦失治阴阳乖隔必有偏，偏阳多热偏阴多寒故分治
- id: guji-张机-endeavor-2
  title_zh: 金匮论转筋及因食成霍乱
  summary: 论转筋入腹用鸡屎白散，戒驴马合猪兔肉合姜之食禁
  phases:
