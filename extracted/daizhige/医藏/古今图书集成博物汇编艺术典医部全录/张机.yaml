  - date: '0205'
    title_zh: 转筋入腹用鸡屎白散
    rationale: 脚臂直脉上下微弦急当通利出邪，不使内陷
  - date: 0208
    title_zh: 记驴马合猪兔合姜成霍乱
    rationale: 五味相克杂食不化则阴阳反戾，故立食禁以防病
events:
- id: guji-张机-event-birth
  type: birth
  title_zh: 生于南阳涅阳
  date: '0150'
  year_of: 150
  description: 东汉南阳涅阳张氏子，少习医方博采众方
- id: guji-张机-event-shanghan-lun
  type: career
  title_zh: 著伤寒论辨霍乱病脉证治
  date: '0200'
  year_of: 200
  description: 定呕吐而利为霍乱，辨发热头痛身疼恶寒兼证，论吐下利止复发热之变
- id: guji-张机-event-fenhanre
  type: career
  title_zh: 分寒热立五苓理中四逆法
  date: '0205'
  year_of: 205
  description: 热多欲饮水者用五苓散，寒多不用水者用理中丸，亡血厥冷者用四逆辈
- id: guji-张机-event-jinkui-lun
  type: career
  title_zh: 金匮立转筋鸡屎白散法
  date: '0206'
  year_of: 206
  description: 转筋脚臂直脉上下微弦，入腹者以鸡屎白散主之
- id: guji-张机-event-yinshi
  type: career
  title_zh: 戒因食成霍乱
  date: 0208
  year_of: 208
  description: 记驴马肉合猪肉食之成霍乱，兔肉着干姜食之成霍乱，以节饮食防病
- id: guji-张机-event-death
  type: death
  title_zh: 卒于建安末
  date: 0219
  year_of: 219
  description: 建安末卒于任上，所著伤寒杂病论垂于后世，为医圣宗师
