      - 坐堂
    start_date: 0196
    highlight_event_id: guji-张机-event-magistrate
  - key: climax
    name: 以桂枝麻黄救太阳风寒
    labels:
      zh:
      - 太阳
      - 中风伤寒
    start_date: '0200'
    highlight_event_id: guji-张机-event-magistrate
  - key: closure
    name: 遗法后世医门宗仰
    labels:
      zh:
      - 活人
      - 宗仰
    start_date: 0219
    highlight_event_id: guji-张机-event-death
  decisions:
  - date: 0196
    title_zh: 为官不废坐堂诊疾
    rationale: 念病家忧苦不避贵贱，虽居郡守仍每月坐堂诊视，以近医道济众，不以官位自隔
  - date: '0205'
    title_zh: 严辨桂枝禁与误下之戒
    rationale: 见脉浮紧发热无汗不可与桂枝，酒客湿热不可与桂枝，阳虚阴盛汗愈下死，阳盛阴虚汗死下愈，故必视虚实调逆从
events:
- id: guji-张机-event-birth
  title_zh: 出生南阳涅阳
  date: '0150'
  year_of: 150
  place_zh: 南阳涅阳
  description: 东汉和平元年左右生于南阳，少时笃好医术，宗族繁盛，后多死于伤寒疫疠
- id: guji-张机-event-study
  title_zh: 从张伯祖学医博采古训
  date: '0165'
  year_of: 165
  place_zh: 南阳
  description: 从同郡张伯祖学医，勤求素问热论六经传变灵枢邪气脏腑病形及难经中风伤寒湿温热病温病之辨，博采众方
- id: guji-张机-event-magistrate
  title_zh: 任长沙太守坐堂行医
  date: 0196
  year_of: 196
  place_zh: 长沙
  description: 建安年间任长沙太守，每月坐堂诊疾，辨太阳之为病脉浮头项强痛而恶寒，风伤卫用桂枝寒伤营用麻黄，活人甚众
- id: guji-张机-event-book
  title_zh: 撰成伤寒杂病论
  date: '0205'
  year_of: 205
  place_zh: 荆州
  description: 鉴于伤寒有汗出愈下死与汗出死下愈之异，撰伤寒杂病论十六卷，立六经汗下纲纪，诫热病愈后食肉则复多食则遗
- id: guji-张机-event-death
  title_zh: 病卒医法垂范后世
  date: 0219
  year_of: 219
  place_zh: 南阳
  description: 建安二十四年左右卒，所著经王叔和编次分为伤寒论金匮要略，后世奉为医圣，太阳中风桂枝汤主之等法永为伤寒门典范
