    labels:
      zh:
      - 成书
      - 传法
    start_date: '0210'
    highlight_event_id: guji-张机-event-book
  decisions:
  - date: 0196
    title_zh: 目击宗族死亡决意著书
    rationale: 建安以来疫疠大行，宗族二百余口死亡过半，伤寒十居其七，深感旧方错乱不足活人，故勤求古训博采众方以成书
  - date: '0200'
    title_zh: 以六经统伤寒分设汗下
    rationale: 法素问一日太阳二日阳明三日少阳四日太阴五日少阴六日厥阴之序，未满三日可汗而已，满三日可泄而已，调其营卫逆从以免两感致死
- id: guji-张机-endeavor-2
  title_zh: 坐堂行医济世活人
  summary: 任长沙太守不废行医，坐堂诊疾，视病虚实，以桂枝解肌麻黄发汗，慎禁酒客湿热误治，活人无数
  phases:
  - key: brewing
    name: 居南阳行医初试
    labels:
      zh:
