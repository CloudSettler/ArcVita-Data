  - 宗族疫疠死亡过半，是恋栈仕途保身，还是弃官行医著书以活众生
  - 素问热论灵枢难经旧说奥约错乱，是因循旧方，还是重立六经辨证纲纪
  lesson: 伤寒本为外感六经传变，当辨阴阳表里虚实，汗下有序，调其逆从，勿犯虚虚实实之戒
  summary_first_person: 吾乃南阳张机，字仲景，少从张伯祖学医，见建安疫盛宗族亡故过半，慨然著伤寒杂病论以辨太阳阳明少阳太阴少阴厥阴传变，立桂枝麻黄汗下之法，愿以此法活人无穷
