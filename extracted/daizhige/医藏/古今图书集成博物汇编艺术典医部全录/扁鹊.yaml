  dilemmas:
  - 名显列国招嫉忌而仍坚持周游救人
  - 脉理幽微难明而欲以问答难经传道
  lesson: 察脉即察生气之原，守根本以决死生，见微知著治未病。
  summary_first_person: 吾本渤海秦越人，世号扁鹊，师长桑君得禁方，周游赵虢齐秦以脉诊决生死，独取寸口为大会，述八十一难以明经脉荣卫阴阳之变，愿后人因脉守神全形。
