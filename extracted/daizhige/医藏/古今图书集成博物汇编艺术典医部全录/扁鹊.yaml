  - 以诊脉为名藏透视之能，隐与显之难
  - 直陈君疾取祸与阿谀取容之难
  lesson: 精究色脉经络，兼修望闻问切，活人济世不计利害，方为良医
  summary_first_person: 吾姓秦名越人，渤海鄚人也，少为舍长，遇长桑君得禁方，饮上池水三十日而能见垣一方人，以此视病尽见五脏症结，周游齐赵虢秦，起虢太子于尸蹶，论赵简子之大梦，见秦武王而陈其疾，天下皆谓我能生死人
