endeavors:
- id: guji-扁鹊-endeavor-1
  title_zh: 列国行医立望闻问切之范
  description_zh: 师长桑君得术，周游赵虢齐秦，以脉诊及望色断疾，起虢太子之尸，言齐侯骨髓之病，名震天下。
  phases:
  - key: brewing
    name: 师长桑君学医
    labels:
      zh:
      - 学医
      - 渤海
    start_date: -0380
    highlight_event_id: guji-扁鹊-event-xueyi
  - key: breakthrough
    name: 诊赵简子虢太子而名显
    labels:
      zh:
      - 诊脉
      - 起死
    start_date: '-0370'
    highlight_event_id: guji-扁鹊-event-zhao
  - key: climax
    name: 望齐侯病入骨髓
    labels:
      zh:
      - 望诊
      - 治未病
    start_date: '-0357'
    highlight_event_id: guji-扁鹊-event-qi
  - key: closure
    name: 入秦遭忌被害
    labels:
      zh:
      - 入秦
      - 遇害
    start_date: '-0310'
    highlight_event_id: guji-扁鹊-event-death
  decisions:
  - date: '-0370'
    title_zh: 决意不仕一君周游救人
    rationale: 欲遍察列国风土病候，以广脉诊之验，不恋一国之禄。
  - date: '-0357'
    title_zh: 直言齐侯病深拂衣速去
    rationale: 见病在骨髓司命无奈何，知言不见信则祸至，故远避以全道。
- id: guji-扁鹊-endeavor-2
  title_zh: 述难经八十一难明脉理
  description_zh: 总结寸口独取大会之法，论十二经动脉荣卫周身五十度，辨尺寸浮沉太过不及覆溢，以问答体成八十一难。
  phases:
  - key: brewing
    name: 会通灵素定寸口大会
    labels:
      zh:
      - 脉学
      - 寸口
    start_date: '-0350'
    highlight_event_id: guji-扁鹊-event-zhao
  - key: breakthrough
    name: 立尺寸阴阳关格覆溢之辨
    labels:
      zh:
      - 尺寸
      - 关格
    start_date: '-0340'
    highlight_event_id: guji-扁鹊-event-nanjing-brewing
  - key: climax
    name: 著成八十一难
    labels:
      zh:
      - 著述
      - 难经
    start_date: '-0330'
    highlight_event_id: guji-扁鹊-event-nanjing
  - key: closure
    name: 以生气之原守邪传后
    labels:
      zh:
      - 命门
      - 传道
    start_date: '-0320'
    highlight_event_id: guji-扁鹊-event-nanjing
  decisions:
  - date: '-0340'
    title_zh: 独取寸口以决五脏吉凶
    rationale: 手太阴为百脉朝会始终，荣卫五十度复会于此，故舍诸部专察寸口。
  - date: '-0330'
    title_zh: 以设难问答统经络脏腑针法
    rationale: 脉经络荣卫杂病针刺散漫难求，故设八十一难以类相从，使学者易守。
events:
- id: guji-扁鹊-event-birth
  title_zh: 生于渤海郡郑
  date: '-0407'
  year_of: -407
  description_zh: 约战国初生于渤海，本姓秦名越人，少为舍长，邻长桑君授以医术。
- id: guji-扁鹊-event-xueyi
  title_zh: 师从长桑君得禁方
  date: -0380
  year_of: -380
  description_zh: 奉长桑君饮上池之水，洞见脏腑症结，尽传其禁方，始为医。
- id: guji-扁鹊-event-zhao
  title_zh: 诊赵简子及虢太子尸厥
  date: '-0370'
  year_of: -370
  description_zh: 为赵简子诊疾言血脉之病，复起虢太子尸厥，天下闻其能为起死回生。
- id: guji-扁鹊-event-qi
  title_zh: 望齐桓侯之疾去
  date: '-0357'
  year_of: -357
  description_zh: 四望齐侯由腠理至骨髓，言病深不治，侯不信，扁鹊去，侯果死。
- id: guji-扁鹊-event-nanjing-brewing
  title_zh: 考定寸尺关格覆溢之法
  date: '-0340'
  year_of: -340
  description_zh: 审一难至三难寸口大会尺寸阴阳之变，定覆溢为真脏死脉之候。
- id: guji-扁鹊-event-nanjing
  title_zh: 著难经八十一难
  date: '-0330'
  year_of: -330
  description_zh: 以经言设问作答，论脉经络荣卫脏腑诊法针刺，成医经脉学大要。
- id: guji-扁鹊-event-death
  title_zh: 入秦为李醯所杀
  date: '-0310'
  year_of: -310
  description_zh: 入秦为秦武王诊疾，秦太医令李醯自知不如，遣刺客杀之于郑道。
