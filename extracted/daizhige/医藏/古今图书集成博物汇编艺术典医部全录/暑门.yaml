person:
  qid: guji-暑门
  name_zh: 暑门
  names:
    zh: 暑门
    en: Shumen
  lifespan:
    birth:
      date: -2697-01-01
      precision: year
      is_circa: true
      raw: 托黄帝言暑之世
    death:
      date: 1725-12-31
      precision: year
      is_circa: true
      raw: 汇入古今图书集成医部全录而定型
  birth_date: -2697-01-01
  death_date: 1725-12-31
  era: 上古至清
  archetype: 医家
  dilemmas:
  - 动而中热与静而中暑之辨，劳役虚者补气清暑，外感寒遏者辛温发散，不可混同
  - 暑伤气而不伤形，宜清补顺天时，妄投温热则实实虚虚，妄用寒下则脱竭真阴
  lesson: 暑为阳邪喜伤心肺之气，辨动静虚实，顺夏养阳，清补兼渗，急救通窍为要
  summary_first_person: 我为暑门，托始于黄帝素问生气通天，历难经伤寒以至金元明清，言暑伤气汗喘烦渴，辨动静中暑中热，立白虎清暑香薷诸方，以告后人夏月保气调摄之道
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%9B%BE%E4%B9%A6%E9%9B%86%E6%88%90%E5%8D%9A%E7%89%A9%E6%B1%87%E7%BC%96%E8%89%BA%E6%9C%AF%E5%85%B8%E5%8C%BB%E9%83%A8%E5%85%A8%E5%BD%95/%E6%9A%91%E9%97%A8.html
endeavors:
- id: guji-暑门-endeavor-1
  title_zh: 暑病病机理论建构
  summary_zh: 自素问灵枢论暑汗开阖，难经定暑为心病正邪，五运六气推演炎暑大行，脉诀定虚脉身热为伤暑
  phases:
  - key: brewing
    name: 素问生气通天立论
    labels:
      zh: 阳邪伤气汗出而散
    start_date: -0350-01-01
    highlight_event_id: guji-暑门-event-theory
  - key: breakthrough
    name: 灵枢难经归心定脉
    labels:
      zh: 暑为心病脉虚身热
    start_date: -0150-01-01
    highlight_event_id: guji-暑门-event-theory
  - key: climax
    name: 运气大论炎暑推演
    labels:
      zh: 少阳少阴司天溽暑
    start_date: 0750-01-01
    highlight_event_id: guji-暑门-event-theory
  - key: closure
    name: 脉诀虚脉定型
    labels:
      zh: 脉虚身热自汗怔忡
    start_date: 0280-01-01
    highlight_event_id: guji-暑门-event-zhangji
  decisions:
  - date: -0350-01-01
    title_zh: 定暑为天之阳邪伤人阳气
    rationale: 因于暑汗烦喘体若燔炭，以汗出阴液而解，分别烦喘与静多言
  - date: -0150-01-01
    title_zh: 断伤暑为正邪属心恶臭
    rationale: 心主臭自入焦臭，身热烦心痛脉浮大而散，明本经自病
- id: guji-暑门-endeavor-2
  title_zh: 暑病辨治方剂体系
  summary_zh: 张机立太阳中暍三证，东垣分动静清暑益气，丹溪用黄连香薷白虎，戴氏立暑风痰火吐法急救
  phases:
  - key: brewing
    name: 伤寒金匮中暍三证
    labels:
      zh: 白虎瓜蒂五苓分治
    start_date: 0205-01-01
    highlight_event_id: guji-暑门-event-zhangji
  - key: breakthrough
    name: 东垣动静清暑益气
    labels:
      zh: 动伤气静伤湿补元气
    start_date: 1249-01-01
    highlight_event_id: guji-暑门-event-dongyuan
  - key: climax
    name: 丹溪香薷白虎分经
    labels:
      zh: 冒伤中分治分肉肺经
    start_date: 1347-01-01
    highlight_event_id: guji-暑门-event-dongyuan
  - key: closure
    name: 集成暑门汇录定法
    labels:
      zh: 夏月调摄禁冷水冷地
    start_date: 1725-01-01
    highlight_event_id: guji-暑门-event-death
  decisions:
  - date: 0205-01-01
    title_zh: 立白虎加人参主暍渴汗出
    rationale: 热伤气而不伤形，脉虚弱身热而渴，不可发汗温针数下
  - date: 1249-01-01
    title_zh: 制清暑益气补中除湿
    rationale: 饮食劳倦损脾胃乘暑，参芪归橘升葛黄柏五味救庚金，顺天时补元气
  - date: 1347-01-01
    title_zh: 用黄连香薷饮消暑蓄水
    rationale: 暑挟痰加半夏南星，虚加参芪，身热头疼加解毒白虎，暑风卒倒量虚实而吐
events:
- id: guji-暑门-event-birth
  title_zh: 托生于黄帝素问之世
  date: -2697-01-01
  year_of: -2697
  description_zh: 生气通天论言因于暑汗烦喘，体若燔炭汗出而散，开暑门之源
- id: guji-暑门-event-theory
  title_zh: 素问灵枢难经定暑病机
  date: -0350-01-01
  year_of: -350
  description_zh: 灵枢言暑则皮肤缓腠理开，难经言暑为心病属正邪，身热烦心痛脉浮大而散
- id: guji-暑门-event-zhangji
  title_zh: 汉张机立太阳中暑三证
  date: 0205-01-01
  year_of: 205
  description_zh: 太阳中热暍汗出恶寒身热而渴，中暍身重疼痛脉弦细芤迟，水行皮中瓜蒂五苓主之
- id: guji-暑门-event-dongyuan
  title_zh: 金元东垣丹溪辨动静治暑
  date: 1249-01-01
  year_of: 1249
  description_zh: 动而伤暑白虎加人参，静而伤暑白虎加苍术，清暑益气治饮食劳倦乘暑，黄连香薷治冒暑水泻
- id: guji-暑门-event-death
  title_zh: 汇入古今图书集成医部全录
  date: 1725-12-31
  year_of: 1725
  description_zh: 卷二百三十一暑门集素问至明清诸家论方，夏月调摄慎房室忌冷水洗面而定型
