    title_zh: 弃辛温崇滋阴
    rationale: 见世医滥用燥热耗阴，故专主养阴存血以保神明
  - date: 1347
    title_zh: 分惊有时悸无时而治
    rationale: 惊悸有时者以朱砂安神丸镇之，怔忡无时者以四物养血安之，痰火则豁痰清火
- id: guji-朱震亨-endeavor-2
  title_zh: 理心脾论健忘授徒济世
  summary: 论健忘由思忧过度损心伤脾，主以归脾养心兼化痰，使神宁意定
