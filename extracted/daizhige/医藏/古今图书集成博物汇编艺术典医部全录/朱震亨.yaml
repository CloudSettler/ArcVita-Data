  dilemmas:
  - title_zh: 痿作风治之误
    description: 世医混痿于中风妄用风药发表行湿戕伐阴血病久不愈当辨内外伤以救其失
  - title_zh: 滋阴与补阳之择
    description: 痿源阴血不足肺热叶焦相传五脏若悉用补阳补气则实实虚虚当滋阴降火以存生化之源
  lesson: 痿病无寒多属热审湿热痰瘀气血虚实而治独取阳明以润宗筋淡薄滋味以养阴血不可妄作风冷燔针艾火
  summary_first_person: 吾丹溪学医于罗知悌悟阳常有余阴常不足之旨见世人患痿软瘫痪误作风治滥用乌附乳没燔针艾火而转加沉困故立言痿证断不可作风治分湿热湿痰气虚血虚瘀血食积而治以苍朮黄蘗黄芩牛膝二陈四君四物补阴为法皆本内经肺热叶焦五痿独取阳明之意欲使后人不刃杀人以全宗筋束骨之用
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%9B%BE%E4%B9%A6%E9%9B%86%E6%88%90%E5%8D%9A%E7%89%A9%E6%B1%87%E7%BC%96%E8%89%BA%E6%9C%AF%E5%85%B8%E5%8C%BB%E9%83%A8%E5%85%A8%E5%BD%95/%E7%98%AB%E7%97%BF%E9%97%A8.html
