  archetype: 滋阴派医家
  dilemmas:
  - title_zh: 乳硬结核攻补之辨
    description: 见乳房结核当直攻破滞还是疏肝清胃顾护气血，攻伐太过恐伤脾胃，补托太过恐留邪毒
  - title_zh: 乳岩早期可救晚期难治之叹
    description: 见隐核不痛不痒而日渐增大，欲早灸早消又恐庸工妄用针刀引痛，欲静养解郁又恐病家忽略而至溃烂难收
  lesson: 调养心神疏肝清胃，乳疾初起即揉通疏滞，慎用针刀攻伐，宜保全气血脾胃
  summary_first_person: 我生元时，究阳有余阴不足之理，著格致余论言乳硬之源在厥阴不行阳明沸腾，主张青皮疏滞石膏清热甘草节行血，佐以少酒艾火，戒厚味忧怒，乳岩初起即劝清心静养以保全
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%9B%BE%E4%B9%A6%E9%9B%86%E6%88%90%E5%8D%9A%E7%89%A9%E6%B1%87%E7%BC%96%E8%89%BA%E6%9C%AF%E5%85%B8%E5%8C%BB%E9%83%A8%E5%85%A8%E5%BD%95/%E5%A6%87%E4%BA%BA%E8%AF%B8%E4%B9%B3%E7%96%BE%E9%97%A8.html
endeavors:
- id: guji-朱震亨-endeavor-1
  title_zh: 著格致余论阐乳硬源流
  description: 论乳房属阳明乳头属厥阴，怒忿郁闷厚味致厥阴不行阳明血沸，兼论小儿热气吹乳成核，立疏滞清热行血之法
  phases:
  - key: brewing
    name: 受业问道积累
    labels:
      zh: 求学
    start_date: '1311'
    highlight_event_id: guji-朱震亨-event-study
  - key: breakthrough
    name: 乳硬论成
    labels:
      zh: 立论
    start_date: '1347'
    highlight_event_id: guji-朱震亨-event-ruying
  - key: climax
    name: 滋阴学说广行
    labels:
      zh: 传道
    start_date: '1350'
    highlight_event_id: guji-朱震亨-event-ruying
  - key: closure
    name: 遗书惠后
    labels:
      zh: 成书
    start_date: '1358'
    highlight_event_id: guji-朱震亨-event-death
  decisions:
  - date: '1347'
    title_zh: 以青皮石膏甘草节为乳硬主方
    rationale: 疏厥阴之滞清阳明之热，行污浊之血消肿导毒，佐少酒助行，必忍痛揉软吮通
  - date: '1347'
    title_zh: 乳岩初起主心神调养不主针刀
    rationale: 隐核由忧怒积累而成，妄用针刀引惹抽痛，当先消释病根使心清神安再施治法
- id: guji-朱震亨-endeavor-2
  title_zh: 开滋阴养阴救治乳痈乳岩虚证
  description: 主张阳有余阴不足，乳痈久溃乳岩隐核多属肝脾郁怒气血亏损，戒攻伐而用养血清肝补益气血
  phases:
  - key: brewing
    name: 临证见庸工误治
    labels:
      zh: 观察
    start_date: '1330'
    highlight_event_id: guji-朱震亨-event-study
  - key: breakthrough
    name: 提出养阴保胃
    labels:
      zh: 转折
    start_date: '1347'
    highlight_event_id: guji-朱震亨-event-ruying
  - key: climax
    name: 艾火佐治乳肿
    labels:
      zh: 实践
    start_date: '1352'
    highlight_event_id: guji-朱震亨-event-ruying
  - key: closure
    name: 丹溪心法传世
    labels:
      zh: 总结
    start_date: '1358'
    highlight_event_id: guji-朱震亨-event-death
  decisions:
  - date: '1350'
    title_zh: 加艾火两三壮于肿处
    rationale: 助阳散结导毒，配合汤散其效尤捷，胜于轻用针刀
  - date: '1352'
    title_zh: 乳岩始生即劝解郁远厚味
    rationale: 脾气消沮肝气横逆则核渐大溃陷难治，早戒七情解郁结更以养血气之药可保全
