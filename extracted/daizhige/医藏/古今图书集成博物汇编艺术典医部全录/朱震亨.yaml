  decisions:
  - date: 1335
    title_zh: 黜小续命汤治痿
    rationale: 痿为内伤阴血不足火乘金位与外感风寒湿痹迥异用风药发表则耗血助火故禁之
  - date: 1347
    title_zh: 分六因以立方
    rationale: 湿热用健步丸加苍朮黄芩黄蘗牛膝湿痰用二陈加术芩蘗沥气虚用四君血虚用四物送补阴丸使临证有据
- id: guji-朱震亨-endeavor-2
  title_zh: 倡滋阴降火以治痿源
  summary: 以一水不胜二火立论主肺金受火制六叶皆焦相传四脏以滋肾水泻南方补北方独取阳明为治痿大法
  phases:
