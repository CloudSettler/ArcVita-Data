    labels:
      zh: 润养宗筋束骨
    start_date: 1347
    highlight_event_id: guji-朱震亨-event-theory
  - key: closure
    name: 戒恬淡以将理
    labels:
      zh: 淡食味守真气
    start_date: 1355
    highlight_event_id: guji-朱震亨-event-death
  decisions:
  - date: 1340
    title_zh: 以黄蘗为君滋肾清热
    rationale: 肾水衰少随火上炎髓竭筋弛非寒湿脚气当咸寒降火存阴以救生化之源
  - date: 1347
    title_zh: 独取阳明调五味
    rationale: 胃为水谷之海主润宗筋利机关五味和则精化髓充故治痿养胃阴淡食味而忌金石燥热久服化热
