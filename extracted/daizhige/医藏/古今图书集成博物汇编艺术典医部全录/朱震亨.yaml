    title_zh: 健忘兼理心脾不专补肾
    rationale: 思虑过度则心胞不清脾意不宁，故须心脾同治神意乃定
  - date: 1356
    title_zh: 著书授徒以广其传
    rationale: 欲使滋阴养血之法不坠，故令门人录丹溪心法以惠后学
