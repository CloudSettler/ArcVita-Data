endeavors:
- id: guji-李杲-endeavor-1
  title_zh: 立脾胃内伤饮食学说
  summary: 会通素问生气通天论与痹论饮食自倍之旨，辨饮与食，立内外伤辨惑之纲
  phases:
  - key: brewing
    name: 研习素问饮食伤腑之旨
    labels:
      zh: 仓廪为本
    start_date: 1205
    highlight_event_id: guji-李杲-event-study
  - key: breakthrough
    name: 分饮为气食为血两纲
    labels:
      zh: 饮伤气食伤血
    start_date: 1228
    highlight_event_id: guji-李杲-event-neishang
  - key: climax
    name: 著脾胃论阐温养元气
    labels:
      zh: 温养脾胃
    start_date: 1249
    highlight_event_id: guji-李杲-event-piwei
  - key: closure
    name: 垂戒妄吐妄下以全肠胃
    labels:
      zh: 十去其九
    start_date: 1250
    highlight_event_id: guji-李杲-event-piwei
  decisions:
  - date: 1228
    title_zh: 饮病分消食病分消下
    rationale: 大饮则气逆当发汗利小便上下分消，饱食筋脉横解当分寒热轻重内消除下，不可混治
  - date: 1249
    title_zh: 内伤三阴立温补禁大毒
    rationale: 先因饮食自伤复加药过则肠胃复伤，故遵大毒十去其六之戒以温养脾胃元气
- id: guji-李杲-endeavor-2
  title_zh: 正酒食病治法救妄下之失
  summary: 明酒为大热有毒无形阳物，只宜发散利小便，斥酒症丸及牵牛大黄误下之法
  phases:
  - key: brewing
    name: 察膏粱酒食留饮痞膈
    labels:
      zh: 酒食留饮
    start_date: 1220
    highlight_event_id: guji-李杲-event-neishang
  - key: breakthrough
    name: 明酒性大热已伤元气
    labels:
      zh: 酒伤元气
    start_date: 1235
    highlight_event_id: guji-李杲-event-neishang
  - key: climax
    name: 立解酲汤五苓散分消法
    labels:
      zh: 汗利分消
    start_date: 1247
    highlight_event_id: guji-李杲-event-piwei
  - key: closure
    name: 示芫花大戟甘遂慎用之限
    labels:
      zh: 重积乃下
    start_date: 1250
    highlight_event_id: guji-李杲-event-piwei
  decisions:
  - date: 1235
    title_zh: 病酒只汗利不妄下
    rationale: 无形元气受病反下有形阴血则乖误，故汗出或小便利则湿去而愈
  - date: 1247
    title_zh: 轻重分治寒热分消
    rationale: 伤寒物用半夏神曲干姜三棱广术，伤热物用枳实白术青皮陈皮麦糵黄连大黄，吐下皆不可过剂
events:
- id: guji-李杲-event-birth
  date: 1180
  year_of: 1180
  title_zh: 诞生于真定
  description: 金大定二十年生于真定府，受家学而志于医，研习素问灵枢仓廪之旨
- id: guji-李杲-event-study
  date: 1205
  year_of: 1205
  title_zh: 师事张元素会通洁古之学
  description: 从张洁古学，承活法机要内伤三阴之说，悟饮食过节肠胃不能胜气不及化之机
- id: guji-李杲-event-neishang
  date: 1228
  year_of: 1228
  title_zh: 著内外伤辨惑论辨饮与食
  description: 申阴阳应象论水谷寒热害六腑之说，立饮者无形之气食者有形之血，定汗吐下分消之法
- id: guji-李杲-event-piwei
  date: 1249
  year_of: 1249
  title_zh: 著脾胃论成内伤饮食大法
  description: 阐脾胃为仓廪之官五味出焉，酒大热有毒当发散利小便，斥牵牛大黄妄下，垂温养元气之训
- id: guji-李杲-event-death
  date: 1251
  year_of: 1251
  title_zh: 卒于元宪宗元年
  description: 晚年以脾胃温升之法惠及后世，饮食门引其内伤之论为医部全录所宗而卒
