  description: 金匮要略以防己黄芪汤主风水脉浮身重汗出恶风，以越婢汤主一身悉肿自汗出，以芪芍桂酒桂枝加黄芪治黄汗沾衣如蘗汁
  type: career
- id: guji-汗门-event-3
