  title_zh: 灵枢发明荣卫漏泄夺血无汗
  date: -0150-01-01
  year_of: -150
  description: 灵枢荣卫生会言卫气慓悍见开而出为漏泄，夺血者无汗夺汗者无血，大汗之后不可泻，热病得汗脉静者生
  type: career
- id: guji-汗门-event-2
  title_zh: 汉张机立风水黄汗历节汗法
  date: '0208-01-01'
