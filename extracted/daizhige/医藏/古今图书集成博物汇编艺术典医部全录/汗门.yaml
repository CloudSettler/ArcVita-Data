  dilemmas:
  - 自汗盗汗表里难辨，卫气固护与邪干孰为主
  - 头汗手足汗局部见症，全身热越与里热郁闭何分
  - 汗为心液不可妄泄，得汗则生与汗后脉躁死生何决
  lesson: 汗为水谷精气所化，察表里虚实而固津，全身遍润和缓为佳，偏沮漏泄皆须慎治
  summary_first_person: 吾为汗门，汇素问灵枢至金匮明理诸说，明五脏汗出之源，辨自汗盗汗头汗手足汗之异，愿后人知夺血无汗夺汗无血，不妄发泄而保精气
