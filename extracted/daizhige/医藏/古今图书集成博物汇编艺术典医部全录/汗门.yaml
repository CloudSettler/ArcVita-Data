  type: career
- id: guji-汗门-event-death
  title_zh: 清古今图书集成医部全录汗门刊定
  date: '1726-01-01'
  year_of: 1726
  description: 古今图书集成博物汇编艺术典医部全录卷二百七十八汇素问灵枢金匮中藏脉诀活人明理论为汗门，垂为汗证总纲
  type: death
