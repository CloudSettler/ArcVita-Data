  date: -0250-01-01
  year_of: -250
  description: 饮食饱甚汗出于胃惊夺精汗出于心持重远行汗出于肾疾走恐惧汗出于肝摇体劳苦汗出于脾，兼阳加于阴谓之汗，心为汗
  type: birth
