  decisions:
  - date: '0219-01-01'
    title_zh: 饮一溲一用肾气丸
    rationale: 小便反多属肾虚不能制水，当补肾水以制心火，不妄用燥热
  - date: '0652-01-01'
    title_zh: 立饮酒房室咸面三慎
    rationale: 酒热炙咸耗伤津液，不慎则三焦猛热，慎之虽不服药亦可自安
- id: guji-渴门-endeavor-2
  title_zh: 三焦分治与燥热寒温论争
  summary: 正伤寒分经与水之误，斥下冷暖补之谬，倡补肾水泻心火分上中肾消治之
  phases:
  - key: brewing
    name: 伤寒分经论渴
    labels:
      zh:
      - 太阳阳明
      - 少阳少阴
    start_date: '0652-01-01'
    highlight_event_id: guji-渴门-event-tang
  - key: climax
    name: 河间三消立说
    labels:
      zh:
      - 上消
      - 中消
      - 肾消
    start_date: '1186-01-01'
    highlight_event_id: guji-渴门-event-jin
  - key: closure
    name: 集成收录成门
    labels:
      zh:
      - 医部全录
      - 渴门
    start_date: '1725-01-01'
    highlight_event_id: guji-渴门-event-death
  decisions:
  - date: '1115-01-01'
    title_zh: 分经与水不妄投白虎五苓
    rationale: 太阳无汗不可与白虎，阳明多汗不可与五苓，得汗脉洪方可权变
  - date: '1186-01-01'
    title_zh: 补阴泻阳以平为期
    rationale: 消渴本湿寒阴衰燥热阳亢，更服燥热暖药则脾胃气竭，当润湿养津
events:
- id: guji-渴门-event-birth
  title_zh: 素问灵枢立消瘅消渴之名
  date: '-0400'
  year_of: -400
  summary: 黄帝岐伯少俞论二阳结为消，心移寒热为肺消膈消，定脉实大可治脉悬小难治之辨
- id: guji-渴门-event-han
  title_zh: 汉张机立消渴脉证治法
  date: '0219-01-01'
  year_of: 219
  summary: 寸口浮迟趺阳浮数辨虚劳气盛，制肾气丸治饮一溲一，五苓散白虎加人参汤分治水逆烦渴
- id: guji-渴门-event-tang
  title_zh: 唐孙思邈论积饮成渴与三慎
  date: '0652-01-01'
  year_of: 652
  summary: 言久饮酒炙咸致三焦猛热，戒酒色咸面，警消渴久必发大痈，禁百日后灸刺误伤
- id: guji-渴门-event-jin
  title_zh: 金刘完素分三焦三消论治
  date: '1186-01-01'
  year_of: 1186
  summary: 分上消膈消多饮少食，中消善食而瘦，肾消膏淋脂浊，主养血肃清辛甘润燥，斥下冷暖补之误
- id: guji-渴门-event-death
  title_zh: 清雍正朝收入古今图书集成
  date: '1725-01-01'
  year_of: 1725
  summary: 医部全录卷二百八十汇素灵金匮千金活人河间诸家，以渴门统摄消瘅消中肾消全文垂世
