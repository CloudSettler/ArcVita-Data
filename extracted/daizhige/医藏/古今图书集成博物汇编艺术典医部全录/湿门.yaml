endeavors:
- id: guji-湿门-endeavor-1
  title_zh: 素问灵枢湿论奠基
  summary: 以生气通天阴阳应象痹论痿论立湿纲，明湿伤于下，脾恶湿，诸湿肿满皆属于脾
  phases:
  - key: brewing
    name: 生气通天首如裹
    labels:
      zh: 素问生气通天论
    start_date: -2697-01-01
    highlight_event_id: guji-湿门-event-1
  - key: breakthrough
    name: 阴阳脾土定湿位
    labels:
      zh: 阴阳应象太阴阳明
    start_date: -0269-01-01
    highlight_event_id: guji-湿门-event-1
  - key: climax
    name: 着痹肉痿立形证
    labels:
      zh: 痹论痿论
    start_date: -0200-01-01
    highlight_event_id: guji-湿门-event-2
  - key: closure
    name: 运气湿变备化
    labels:
      zh: 气交变六元正纪
    start_date: -0100-01-01
    highlight_event_id: guji-湿门-event-2
  decisions:
  - date: -0269-01-01
    title_zh: 定伤于湿者下先受之
    rationale: 清湿地气必从足始，故候病在下在脾，与伤风上先受之相别
  - date: -0200-01-01
    title_zh: 定苦燥淡泄为治则
    rationale: 脾苦湿急食苦以燥之，湿淫于内以苦燥之以淡泄之，平以苦热
- id: guji-湿门-endeavor-2
  title_zh: 湿痹湿温方治集成
  summary: 自金匮湿痹风湿分治，经活人书中湿风湿湿温，至河间湿热论，而成利小便微汗之法
  phases:
  - key: brewing
    name: 金匮分湿痹风湿
    labels:
      zh: 金匮要略湿病
    start_date: 0200-01-01
    highlight_event_id: guji-湿门-event-3
  - key: breakthrough
    name: 活人书立中湿湿温
    labels:
      zh: 宋朱肱活人书
    start_date: 1108-01-01
    highlight_event_id: guji-湿门-event-4
  - key: climax
    name: 河间归湿热属脾
    labels:
      zh: 金刘完素河间六书
    start_date: 1180-01-01
    highlight_event_id: guji-湿门-event-4
  - key: closure
    name: 医部全录汇湿门
    labels:
      zh: 古今图书集成
    start_date: 1726-01-01
    highlight_event_id: guji-湿门-event-death
  decisions:
  - date: 0200-01-01
    title_zh: 湿痹但当利小便
    rationale: 关节疼痛脉沉细，小便不利大便反快，汗大出则风去湿在，故微微似汗则风湿俱去
  - date: 1108-01-01
    title_zh: 湿温不可发汗
    rationale: 常伤于湿复中暑，湿热相薄两胫逆冷胸满多汗，汗出则重暍耳聋，当以白虎加苍术治在太阴
events:
- id: guji-湿门-event-birth
  title_zh: 湿门始生于素问
  date: -2697-01-01
  year_of: -2697
  summary: 黄帝素问生气通天论言因于湿首如裹，中央生湿，地之湿气害皮肉筋脉，湿门始立
- id: guji-湿门-event-1
  title_zh: 素问灵枢定湿纲
  date: -0269-01-01
  year_of: -269
  summary: 阴阳应象言湿胜则濡泻，痹论言湿气胜者为着痹，痿论言渐于湿发为肉痿，灵枢言身半以下者湿中之
- id: guji-湿门-event-2
  title_zh: 难经言中湿为肾邪
  date: -0150-01-01
  year_of: -150
  summary: 扁鹊难经言中湿喜汗出不可止，身热小腹痛足胫寒逆，脉沉濡而大，得之为贼邪
- id: guji-湿门-event-3
  title_zh: 金匮辨湿痹风湿
  date: 0200-01-01
  year_of: 200
  summary: 汉张机立湿痹一身尽疼发热身黄，风湿一身疼痛日晡剧，以麻黄加术防己黄芪桂枝附子甘草附子等方分治
- id: guji-湿门-event-4
  title_zh: 宋金阐湿温湿热
  date: 1180-01-01
  year_of: 1180
  summary: 宋朱肱分中湿风湿湿温，金刘完素言诸湿肿满皆属脾土，诸痉强直体重胕肿皆属于湿，湿病多自热生
- id: guji-湿门-event-death
  title_zh: 医部全录集成湿门
  date: 1726-01-01
  year_of: 1726
  summary: 古今图书集成博物汇编艺术典医部全录卷二百三十三汇素问灵枢难经金匮活人河间诸说，湿门大成
