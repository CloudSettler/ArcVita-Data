  dilemmas:
  - 湿伤阳气当苦温燥湿还是苦寒清热
  - 风湿相搏当微汗俱去还是大汗发散
  - 湿淫在上当汗解还是在下当利小便
  lesson: 湿为阴邪伤下伤脾，治当燥脾利水，微汗淡渗，不可大发大下
  summary_first_person: 吾为湿门，始于素问生气通天之论，因于湿首如裹，历灵枢难经金匮，以至宋金，终集于古今图书集成，专主湿痹濡泻痿厥之辨
