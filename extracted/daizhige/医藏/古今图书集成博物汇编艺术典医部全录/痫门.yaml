  - 痫与癫狂同源而状异当分当合两难
  - 痰火惊虚实寒热错杂吐补攻守难决
  lesson: 痫本痰迷心窍火动风生当辨声象察脉审惊食分治吐清平补各得其宜
  summary_first_person: 吾为痫门历素问千金济生丹溪景岳诸家而立发则仆倒搐搦吐沫醒则如常以痰火惊为要以吐清镇补为法愿后学辨癫狂别阴阳不执一端而活人无穷
