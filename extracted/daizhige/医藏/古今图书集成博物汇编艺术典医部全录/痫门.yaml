    start_date: '1640-01-01'
    highlight_event_id: guji-痫门-event-4
  decisions:
  - date: '1347-01-01'
    title_zh: 立吐后清心平肝为大法
    rationale: 痰壅心窍非吐不开吐后不清则火不降故用黄连南星安神龙荟相继
  - date: '1640-01-01'
    title_zh: 虚证不禁补剂扶正祛痰并行
    rationale: 阴盛阳衰气血暴脱者概禁补则伤脾故用人参附子菖蒲健脾开心窍永不再发
events:
- id: guji-痫门-event-birth
  title_zh: 素问大奇论立痫厥
  date: -0300-01-01
  year_of: -300
  summary: 二阴急为痫厥心脉满大肝脉小急开后世水气乘心肝虚荣筋之说
- id: guji-痫门-event-1
  title_zh: 千金方列五癫属痫
  date: '0652-01-01'
  year_of: 652
  summary: 孙思邈分阳阴风湿马五癫正前人误列癫证厘定痫病发如死遗溺羊鸣口噤之状
- id: guji-痫门-event-2
  title_zh: 济生方立五痫应五脏及风惊食三因
  date: '1253-01-01'
  year_of: 1253
  summary: 严用和以马牛鸡猪羊应心肺胃肾脾论惊动脏气郁生涎闭塞诸经及母腹受惊饥饱逆气之源
- id: guji-痫门-event-3
  title_zh: 丹溪心法主痰吐治痫
  date: '1347-01-01'
  year_of: 1347
  summary: 朱震亨谓惊痰宜吐行痰为主分痰热多少用吐后安神平肝青黛柴胡龙荟星香加全蝎治叫吼吐沫
- id: guji-痫门-event-4
  title_zh: 景岳石室会通虚实补镇
  date: '1687-01-01'
  year_of: 1687
  summary: 张介宾合癫即痫辨无火不妄凉陈士铎创祛痰定癫汤参术茯芍加附子菖蒲开心窍治牛马羊癫一剂可愈
- id: guji-痫门-event-death
  title_zh: 石室秘箓集痫方大成
  date: '1690-01-01'
  year_of: 1690
  summary: 以人参白术健脾平肝桂附祛寒半夏消痰蜜丸先服永不再发为痫门阶段之结
