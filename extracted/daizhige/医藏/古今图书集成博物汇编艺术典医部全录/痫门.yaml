    title_zh: 列五癫入痫不入癫
    rationale: 病状异而病因同分癫痫以正名便于施治
  - date: '1253-01-01'
    title_zh: 摄诸痫归风惊食三因
    rationale: 十岁以下久成痼疾早治豁痰顺气以防郁闭
- id: guji-痫门-endeavor-2
  title_zh: 痰火惊吐清镇补集成
  summary: 自儒门事亲丹溪主吐至入门正传纲目景岳辨虚实再至石室参附归舍收摄大法
  phases:
  - key: breakthrough
    name: 吐法峻立
    labels:
