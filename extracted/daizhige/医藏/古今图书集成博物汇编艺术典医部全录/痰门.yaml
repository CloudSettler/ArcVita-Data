endeavors:
- id: guji-痰门-endeavor-1
  title_zh: 四饮留饮辨证立纲
  summary: 承素问灵枢论饮积水饮启源集汉唐方论分痰饮悬饮溢饮支饮留饮伏饮立法处方
  phases:
  - key: brewing
    name: 素问灵枢论饮积启源
    labels:
      zh: 太阴湿土饮发于中
    start_date: '-0475'
    highlight_event_id: guji-痰门-event-birth
  - key: breakthrough
    name: 仲景金匮分四饮立法
    labels:
      zh: 温药和饮分经论治
    start_date: '0205'
    highlight_event_id: guji-痰门-event-siyin
  - key: climax
    name: 千金详述留饮伏饮
    labels:
      zh: 留饮伏饮脉证方药
    start_date: '0652'
    highlight_event_id: guji-痰门-event-liuyin
  - key: closure
    name: 宋济生活人顺气分导
    labels:
      zh: 顺气分导温利为要
    start_date: '1100'
    highlight_event_id: guji-痰门-event-shunqi
  decisions:
  - date: '0205'
    title_zh: 分四饮温药和之
    rationale: 素盛今瘦水走肠间为痰饮胁下咳唾引痛为悬饮之类须温化分治不可一概攻补
  - date: '0652'
    title_zh: 详留饮脉证补方
    rationale: 胁下痛引缺盆短气渴历节痛之类补仲景未备以十枣苓桂大小青龙等分汗吐下温
- id: guji-痰门-endeavor-2
  title_zh: 攻逐吐法与痰随气治大成
  summary: 金元诸家明天人湿土之变力主留者攻之吐法涌越顺气化痰成痰门正宗
  phases:
  - key: brewing
    name: 河间论积饮湿土化痰
    labels:
      zh: 土湿积饮燥湿相济
    start_date: '1180'
    highlight_event_id: guji-痰门-event-jiyin
  - key: breakthrough
    name: 从政立五因攻逐吐法
    labels:
      zh: 留者攻之涌吐去疾
    start_date: '1220'
    highlight_event_id: guji-痰门-event-tufa
  - key: climax
    name: 丹溪明痰随气升降
    labels:
      zh: 善治痰者不治痰治气
    start_date: '1347'
    highlight_event_id: guji-痰门-event-suiqi
  - key: closure
    name: 痰门宗纲垂训后学
    labels:
      zh: 痰门大成垂范
    start_date: '1358'
    highlight_event_id: guji-痰门-event-death
  decisions:
  - date: '1220'
    title_zh: 废温补独主攻逐涌吐
    rationale: 愤郁困乏思虑痛饮伤冷皆致留饮补塞转增故用瓜蒂涌吐三花神佑攻下为先
  - date: '1347'
    title_zh: 以顺气化痰分风热湿酒食
    rationale: 痰无处不到随气升降故分风痰热痰湿痰酒痰食痰老痰以二陈苍朮青黛南星海石等分治吐下结合
events:
- id: guji-痰门-event-birth
  title_zh: 素问论饮积诞生
  date: '-0475'
  year_of: -475
  description: 黄帝素问言太阴在泉湿淫所胜民病饮积心痛太阴所至为积饮否隔开痰门之源
- id: guji-痰门-event-siyin
  title_zh: 仲景分四饮立法
  date: '0205'
  year_of: 205
  description: 汉张机金匮要略立痰饮悬饮溢饮支饮之目创苓桂朮甘十枣大小青龙诸方奠定辨治之基
- id: guji-痰门-event-liuyin
  title_zh: 千金详留饮伏饮
  date: '0652'
  year_of: 652
  description: 唐孙思邈千金方详留饮伏饮脉证背寒如掌缺盆马刀之状补苓桂十枣之法传五饮之说
- id: guji-痰门-event-shunqi
  title_zh: 济生倡顺气分导
  date: '1174'
  year_of: 1174
  description: 宋严用和济生方载六饮之名倡顺气为先分导次之气顺津液流通痰饮自小便而出
- id: guji-痰门-event-jiyin
  title_zh: 河间论积饮湿化
  date: '1180'
  year_of: 1180
  description: 金刘完素论积饮留饮不散水得燥消土湿主否酒热挟冷凝胸成痰宜吐后渗湿去痰
- id: guji-痰门-event-tufa
  title_zh: 从政立攻逐吐法
  date: '1220'
  year_of: 1220
  description: 元张从政论饮当去水温补转剧立愤郁困乏思虑痛饮伤冷五因创瓜蒂涌吐三花攻下之法
- id: guji-痰门-event-suiqi
  title_zh: 丹溪明痰随气治
  date: '1347'
  year_of: 1347
  description: 元朱震亨丹溪心法言痰随气升降无处不到善治痰不治痰治气分风热湿酒食老痰以二陈加减吐下兼施
- id: guji-痰门-event-death
  title_zh: 痰门宗纲告成
  date: '1358'
  year_of: 1358
  description: 会素问至丹溪诸家之说痰饮悬溢支留伏六饮脉因证治吐汗温下利顺气诸法大备痰门体系告成
