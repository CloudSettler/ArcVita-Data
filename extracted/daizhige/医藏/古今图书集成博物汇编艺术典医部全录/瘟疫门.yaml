events:
- id: guji-瘟疫门-event-birth
  title_zh: 托始素问论冬伤寒春病温
  date: -0269-01-01
  year_of: -269
  description: 黄帝素问阴阳应象大论言冬伤于寒春必病温藏精者春不病温为后世伏气温疫之祖
- id: guji-瘟疫门-event-huorenshu
  title_zh: 宋朱肱活人书立温疫天行
  date: '1108-01-01'
  year_of: 1108
  description: 朱肱言一岁长幼状相似为温疫四时皆有不正之气春责肝夏责心秋责肺冬责肾治热以寒治温以清
- id: guji-瘟疫门-event-rumen
  title_zh: 元张从政立时气解利禁忌
  date: '1228-01-01'
  year_of: 1228
  description: 张从政论春温夏热秋疟痢冬寒嗽为四时不正之气主辛凉解利立六禁戒车载马驮巴豆辛温
- id: guji-瘟疫门-event-danxi
  title_zh: 元朱震亨三法治瘟疫
  date: '1347-01-01'
  year_of: 1347
  description: 朱震亨言瘟疫众人一般病为天行时疫宜补宜散宜降冬温非时之气当补中带表
- id: guji-瘟疫门-event-datou
  title_zh: 明陶华辨大头时毒分经
  date: '1500-01-01'
  year_of: 1500
  description: 陶华论大头为天行疫毒阳明用普济消毒饮少阳用小柴胡加味太阳用荆防败毒散先缓后急
- id: guji-瘟疫门-event-yixuerumen
  title_zh: 明李梴医学入门分季治疫
  date: '1575-01-01'
  year_of: 1575
  description: 李梴分春升麻葛根夏调中秋白虎苍朮冬葳蕤表用败毒半表小柴胡里用大柴胡兼避秽以麻油雄黄
- id: guji-瘟疫门-event-yiguan
  title_zh: 明赵献可医贯论温病郁火
  date: '1617-01-01'
  year_of: 1617
  description: 赵献可言温病不恶寒而渴为火郁肾水枯不用麻桂以六味滋水柴胡舒木为一方代三方之法
- id: guji-瘟疫门-event-jingyue
  title_zh: 明张介宾景岳论疫汗法六要
  date: '1624-01-01'
  year_of: 1624
  description: 张介宾言冬伤于寒春必病温瘟疫即伤寒外邪当辨阴阳寒热以汗补温清吐下六要统之汗为主
- id: guji-瘟疫门-event-death
  title_zh: 瘟疫门汇编收束于明末
  date: '1640-01-01'
  year_of: 1640
  description: 自素问至景岳历代温疫寒疫时气之说汇为一门清房凉榻因证因时之法大备
