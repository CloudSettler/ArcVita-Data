    start_date: '1725-01-01'
    highlight_event_id: guji-目门-event-death
  decisions:
  - date: '0205-01-01'
    title_zh: 以补虚泻肝分治目黯目眩
    rationale: 内有干血两目黯黑则缓中补虚劳虚目瞑则温补而不妄泻
