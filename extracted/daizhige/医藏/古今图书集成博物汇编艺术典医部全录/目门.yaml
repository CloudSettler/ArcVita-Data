    start_date: '0282-01-01'
    highlight_event_id: guji-目门-event-2
  - key: climax
    name: 千金方详养目护目十六损
    labels:
      zh: 年四十后瞑目勿视肝劳闭目二年
    start_date: '0652-01-01'
    highlight_event_id: guji-目门-event-3
  - key: closure
    name: 集成医部全录目门一卷
    labels:
