    start_date: -2697-01-01
    highlight_event_id: guji-目门-event-birth
  - key: breakthrough
    name: 灵枢发明目系属脑
    labels:
      zh: 精阳气上走于目而为睛目系上属于脑
    start_date: -475-01-01
    highlight_event_id: guji-目门-event-1
  - key: climax
    name: 素问六气详目赤痛眦伤
    labels:
      zh: 六元正纪至真要详胜复目病
    start_date: -475-01-01
    highlight_event_id: guji-目门-event-1
  - key: closure
    name: 难经以目盲目瞑候阴阳绝
    labels:
      zh: 脱阴目盲三阴绝则目瞑
    start_date: -375-01-01
    highlight_event_id: guji-目门-event-1
  decisions:
  - date: -475-01-01
    title_zh: 定目为五脏六腑精注而合于阴阳
    rationale: 统骨筋血气肌肉之精以上注于目故诊目可候脏腑
  - date: -375-01-01
    title_zh: 以目瞑目盲断阴阳脱绝死候
    rationale: 阴竭则目无所见志先死故立死候以重目诊
- id: guji-目门-endeavor-2
  title_zh: 集汉唐目病诊治养护法
  description: 集张机华佗王叔和孙思邈目黯目赤目眩风水辨治及闭目养肝护目之训
  phases:
