events:
- id: guji-筋门-event-birth
  title_zh: 托生内经
  date: '-0400'
  year_of: -400
  description: 战国秦汉间黄帝内经素问灵枢渐成肝主筋诸筋属节之说肇端是为筋门之生
- id: guji-筋门-event-1
  title_zh: 素问陈筋病之要
  date: '-0300'
  year_of: -300
  description: 素问上古天真生气通天阴阳应象痿论痹论等篇论女子四七筋骨坚丈夫三八筋骨劲强大筋緛短小筋弛长酸走筋久行伤筋之旨
- id: guji-筋门-event-2
  title_zh: 灵枢详十二经筋
  date: '-0200'
  year_of: -200
  description: 灵枢经经筋篇详足太阳至少阳手太阳至少阳等十二经筋起止结聚转筋挛痛治在燔针劫刺以知为数以痛为俞兼论宗筋聚于阴器
- id: guji-筋门-event-3
  title_zh: 集成筋门定稿
  date: '1726'
  year_of: 1726
  description: 清古今图书集成博物汇编艺术典医部全录卷二百十四以筋门为题汇录素问灵枢全文及注成为筋学总汇
- id: guji-筋门-event-death
  title_zh: 数字转录传世
  date: 2018-11-26
  year_of: 2018
  description: 殆知阁据仓库文本转录筋门卷并注最后修改日旧刊形态收束以数字本继续流传
