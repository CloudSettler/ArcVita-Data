endeavors:
- id: guji-胁门-endeavor-1
  title_zh: 阐发胁痛经脉病机
  summary: 汇素问灵枢论肝胆少阳布胁肋主胁痛支满转侧不利
  phases:
  - key: brewing
    name: 素问奠基
    labels:
      zh:
      - 肝病两胁下痛引少腹
      - 少阳循胁胸胁痛耳聋
    start_date: -0200-01-01
    highlight_event_id: guji-胁门-event-1
  - key: breakthrough
    name: 灵枢明经
    labels:
      zh:
      - 足少阳是动胁痛不息
      - 肝脉布胁肋大包布胸胁
    start_date: -0150-01-01
    highlight_event_id: guji-胁门-event-2
  decisions:
  - date: -0200-01-01
    title_zh: 以肝主疏泄定胁痛纲领
    rationale: 肝脉布胁肋抵少腹寒客厥阴则血涩脉急故胁肋与少腹相引而痛当调肝和血
  - date: -0150-01-01
    title_zh: 以少阳为枢定转侧之辨
    rationale: 胆足少阳是动则心胁痛不能转侧邪客其络则胁痛不得息当和枢解郁
- id: guji-胁门-endeavor-2
  title_zh: 汇集胀满积聚治法
  summary: 汇奇病胀论难经论息贲息积血枯与痈疽胁发之治禁
  phases:
  - key: climax
    name: 积聚成形
    labels:
      zh:
      - 胁下满气逆息积
      - 右胁下覆杯息贲
    start_date: -0150-01-01
    highlight_event_id: guji-胁门-event-3
  - key: closure
    name: 全录汇编
    labels:
      zh:
      - 血枯胸胁支满
      - 胁痈名曰败疵
    start_date: '1726-01-01'
    highlight_event_id: guji-胁门-event-4
  decisions:
  - date: -0150-01-01
    title_zh: 定积病不可独用灸刺
    rationale: 息积二三岁不已不妨于食不可灸刺当导引服药并行药不能独治
  - date: '1726-01-01'
    title_zh: 汇胁门为医部专卷
    rationale: 胁痛胀满散见诸经当别立胁门以统肝胆肺脾少阳之证便后学检方
