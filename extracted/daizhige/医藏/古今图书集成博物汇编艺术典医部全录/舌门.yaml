endeavors:
- id: guji-舌门-endeavor-1
  title_zh: 内经阐发舌属脏腑经络
  summary: 以素问灵枢立心主舌脾连舌本肾挟舌本肝络舌本之大经、明舌为心官音声之机
  phases:
  - key: brewing
    name: 南方生热心主舌立论
    labels:
      zh: 阴阳应象心窍在舌
    start_date: -0077-01-01
    highlight_event_id: guji-舌门-event-1
  - key: breakthrough
    name: 经脉经别络舌本贯穿
    labels:
      zh: 脾肾肝心经系舌本
    start_date: -0077-01-01
    highlight_event_id: guji-舌门-event-1
  - key: climax
    name: 心和知味口问自啮辨气逆
    labels:
      zh: 心和知五味少阴啮舌
    start_date: -0077-01-01
    highlight_event_id: guji-舌门-event-1
  - key: closure
    name: 舌重十两长七寸定形
    labels:
      zh: 肠胃篇定舌形度
    start_date: -0077-01-01
    highlight_event_id: guji-舌门-event-1
  decisions:
  - date: -0077-01-01
    title_zh: 定心主舌为诊舌总纲
    rationale: 以心开窍于舌统五味五谷之辨、为后世舌诊之宗
  - date: -0077-01-01
    title_zh: 分经系舌以别病源
    rationale: 以脾肾肝心分系舌根舌旁舌本舌端、使舌卷舌强舌干各归其经
- id: guji-舌门-endeavor-2
  title_zh: 舌胎舌色辨证与舌病救治集成
  summary: 自伤寒金匮舌燥白胎黄胎治法、至千金疮疡儒门丹溪重舌木舌针药、终以入门类要十五舌验证集成
  phases:
  - key: brewing
    name: 伤寒金匮舌燥胎滑奠基
    labels:
      zh: 白虎陷胸小柴胡辨胎
    start_date: 0205-01-01
    highlight_event_id: guji-舌门-event-2
  - key: breakthrough
    name: 千金论舌五味疮缩救治
    labels:
      zh: 心主小肠候升麻煎调寒热
    start_date: 0652-01-01
    highlight_event_id: guji-舌门-event-3
  - key: climax
    name: 金元舌胀生刺肿胀清解
    labels:
      zh: 木舌莲花舌砭血清凉
    start_date: 1241-01-01
    highlight_event_id: guji-舌门-event-3
  - key: closure
    name: 明清十五舌图验证汇录
    labels:
      zh: 白胎黑尖里黑死现汇集成书
    start_date: 1725-01-01
    highlight_event_id: guji-舌门-event-4
  decisions:
  - date: 0205-01-01
    title_zh: 以舌胎定表里定攻下
    rationale: 邪在表无胎、入里生胎、白滑尚带表寒不可攻、黄燥黑坚则下之
  - date: 1241-01-01
    title_zh: 舌肿急刺泄毒缓服清解
    rationale: 木舌重舌满口塞杀人、先刺紫血泄毒、后以山栀黄连甘桔清心
  - date: 1725-01-01
    title_zh: 会十五舌色系危候
    rationale: 以红白黄黑星斑裂纹别君火热毒水克火、使观舌即知逆顺
events:
- id: guji-舌门-event-birth
  type: birth
  title_zh: 黄帝设舌官心主舌肇始
  date: -2697-01-01
  year_of: -2697
  description: 南方生热心主舌在窍为舌、心和则知五味之论肇始
- id: guji-舌门-event-1
  type: endeavor
  title_zh: 素问灵枢系舌于经
  date: -0077-01-01
  year_of: -77
  description: 脾上膈挟咽连舌本散舌下、肾循喉咙挟舌本、肝筋络舌本、手少阴系舌本、定舌卷舌强不能言之源
- id: guji-舌门-event-2
  type: endeavor
  title_zh: 伤寒金匮立舌燥白胎法
  date: 0205-01-01
  year_of: 205
  description: 太阳重汗下后舌上燥渴用大陷胸、热结在里舌上干燥烦渴用白虎加人参、胁硬呕而舌上白胎用小柴胡、舌黄未下者下之
- id: guji-舌门-event-3
  type: endeavor
  title_zh: 唐宋金元治重舌木舌莲花舌
  date: 1241-01-01
  year_of: 1241
  description: 千金论舌咸苦辛酸甘所伤及舌缩口噤、疮疡书辨木舌重舌重腭莲花舌针紫血加山栀、儒门以锐针砭木舌满口出血至斗、丹溪以百草霜芒硝敷木舌
- id: guji-舌门-event-4
  type: endeavor
  title_zh: 明清汇十五舌验证成书
  date: 1725-01-01
  year_of: 1725
  description: 入门分胎色紫黑吉凶、口齿类要列白胎将瘟中焙生斑红星黑尖里圈人裂虫碎里黑厥阴死现黄胎黑心十五舌、汇入医部全录卷一百五十八
- id: guji-舌门-event-death
  type: death
  title_zh: 舌门汇入医部全录告成
  date: 1725-12-31
  year_of: 1725
  description: 自黄帝素问至明清验证之舌论舌治咸归舌门、全录收卷而传后
