  - 心主舌与五脏皆属舌之归属难定
  - 舌胎白滑黄黑燥润寒热虚实难辨
  - 舌肿重舌木舌刺血泄毒与禁针之险
  lesson: 舌为心之苗而通五脏、察舌胎润燥色泽可知表里寒热虚实、审证施治
  summary_first_person: 吾乃舌门、传心主舌在窍为舌之旨、系脾连舌本肾挟舌本肝络舌本之脉、辨伤寒舌胎白黄黑之浅深、治重舌木舌莲花生疮之危、以舌知脏腑、以针药救急缓
