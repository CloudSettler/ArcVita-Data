    start_date: 1097-01-01
    highlight_event_id: guji-苏轼-event-writing
  decisions:
  - date: 1096-03-01
    title_zh: 取幽愤养寿之句为药
    rationale: 恐习性易流故对病为药使人诵之日三以事无事之事味无味之味自警
  - date: 1090-06-01
    title_zh: 记寒咳误为蛊之治
    rationale: 明药之过劳其主隔其辅故谢医却药气完食美乃可一饮而效
