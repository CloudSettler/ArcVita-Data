    start_date: 1095-01-01
    highlight_event_id: guji-苏轼-event-illness
  - key: climax
    name: 淡食清净胜病
    labels:
      zh: 自疗
    start_date: 1095-06-01
    highlight_event_id: guji-苏轼-event-cure
  - key: closure
    name: 病良已守淡食
    labels:
      zh: 收功
    start_date: 1096-01-01
    highlight_event_id: guji-苏轼-event-cure
  decisions:
  - date: 1095-03-01
    title_zh: 去滋味绝熏血
    rationale: 痔虫馆于后以滋味熏血自养主人枯槁则客自弃去故断其养源
  - date: 1095-04-01
    title_zh: 日食淡面辅胡麻茯苓
    rationale: 饮食之外不啖一吻以清净胜病无则已者与我无既
- id: guji-苏轼-endeavor-2
  title_zh: 作药诵盖公堂记言医理
  description: 以己病验医过取中散真人之言对病为药作药诵及记乡人误治之事明谢医却药进所嗜之理
  phases:
