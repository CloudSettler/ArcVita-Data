  - 采薇散发长吟养寿之志与祸患疾苦未遂之矛盾
  lesson: 对病为药割弃尘累因祸取福以清净胜滋味
  summary_first_person: 吾得罪迁岭表逾年知不死旧苦痔大作呻呼百日地无良医药亦不效道士教吾去滋味绝熏血旦夕食淡面以胡麻茯苓足之取嵇中散孙真人之言对病为药使人日诵三遍以自警省
