    description: 素问河间主热迫血溢而脉诀又言沉细易治浮大难治当以热盛补虚分证施治
  - title_zh: 止血与祛瘀之两难
    description: 伤寒瘀积吐血当用抵当桃仁逐瘀而亡血家又忌汗下恐重脱当审轻重先后
  lesson: 血随气行调气摄血为要热则清泄虚则温补瘀则逐而后养
  summary_first_person: 吾本素问灵枢论血之纲后世金匮千金活人济生河间递相增广以吐衄便溺分门以寒热虚实论治愿后学察脉辨色审表里而勿妄止妄攻
