    rationale: 太阳脉浮紧发烦目瞑剧必衄衄乃解自衄愈者勿再汗脉微者禁麻黄桂枝以防陷脱
  - date: 1108-01-01
    title_zh: 别阴阳衄血施犀地茅花
    rationale: 太阳阳重可解少阴强发蛋糕需凿岷减洛抽畏差牟还锚巩杠摸便血难治脉微用黄芩芍药犀角地黄不止用茅花汤渴烦先五苓次竹叶
