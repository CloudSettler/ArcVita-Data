    start_date: 1726-01-01
    highlight_event_id: guji-诸哽门-event-death
  decisions:
  - date: 1228-01-01
    title_zh: 以纸卷钩合取喉中钱
    rationale: 钩入钱窍以纸抵钩尖不碍肌肉轻提而出免推下之险
  - date: 1556-01-01
    title_zh: 哽后不与米汤米饭先吃羹数日
    rationale: 米粒易入疮口增痛以羹养喉兼用藏经咒治不因气动之外病
