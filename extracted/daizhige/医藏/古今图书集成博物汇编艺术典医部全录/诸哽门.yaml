  - date: 0652-01-01
    title_zh: 不以鸬鹚治骨哽各从其类
    rationale: 鱼骨针发各有其属以类相从方能相应通用唯竹篾薤白绵蜜诸法
  - date: 1556-01-01
    title_zh: 立涌吐为先忌久推下
    rationale: 刺深日久咽肿饮食消尽则无物推送早乘饮食上逆拔刺最顺
- id: guji-诸哽门-endeavor-2
  title_zh: 集单方验方与医案救绝
  description: 集鹿筋竹篾绵蜜薤白虎狸鸬鹚獭爪诸单方兼收神咒水法又以钩取钱钩绵裹糖取鸡骨诸案证验
  phases:
