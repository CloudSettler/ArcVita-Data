  lesson: 顺其出入以类从治吐为先勿令哽久肿深见机早救
  summary_first_person: 我以喉间诸物相哽立名承孙思邈以类治之之训立涌吐为先集鱼骨发针钱钗诸方兼收咒治又见戴人以钩取钱以珠抵钩诸案终汇入医部全录愿后人识顺逆早吐勿误
