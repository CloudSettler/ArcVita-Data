endeavors:
- id: guji-钱乙-endeavor-1
  title_zh: 立小儿脉面目三部诊视法
  description_zh: 据小儿直诀脉法面部证目部证，立弦急沉缓促结浮沉之候，分五部察色以定病机
  phases:
  - key: brewing
    name: 幼承家学候诊乳儿
    labels:
      zh: 蕴酿
    start_date: '1045'
    highlight_event_id: guji-钱乙-event-practice
  - key: breakthrough
    name: 参合三部五脉立脉法
    labels:
      zh: 突破
    start_date: '1075'
    highlight_event_id: guji-钱乙-event-pulse
  - key: climax
    name: 面目分部察色定脏
    labels:
      zh: 高潮
    start_date: '1090'
    highlight_event_id: guji-钱乙-event-face
  - key: closure
    name: 口授直诀传付后学
    labels:
      zh: 收束
    start_date: '1106'
    highlight_event_id: guji-钱乙-event-book
  decisions:
  - date: '1075'
    title_zh: 舍独凭寸口改参三部五脉
    rationale: 小儿惊则气散脉乱，一岁视虎口三关，一岁后以指辨寸口，兼按额前太冲并观面色虎口以定虚实
  - date: '1090'
    title_zh: 以左腮肝右腮肺额心鼻脾颏肾察赤定热
    rationale: 脉弦急主气不和沉缓主伤食促结主虚惊，面赤主热随证治之，目色分五脏虚实以施方
- id: guji-钱乙-endeavor-2
  title_zh: 五脏补泻立方治惊疳吐泻
  description_zh: 守真气夺则虚邪气胜则实之旨，虚补其母实泻其子，创导赤泻青泻黄泻白益黄地黄诸方
  phases:
  - key: brewing
    name: 行医乡里见惊药之弊
    labels:
      zh: 蕴酿
    start_date: '1050'
    highlight_event_id: guji-钱乙-event-practice
  - key: breakthrough
    name: 别虚实立补泻大法
    labels:
      zh: 突破
    start_date: '1075'
    highlight_event_id: guji-钱乙-event-pulse
  - key: climax
    name: 目证分治创五脏诸方
    labels:
      zh: 高潮
    start_date: '1090'
    highlight_event_id: guji-钱乙-event-face
  - key: closure
    name: 集药证直诀垂范幼科
    labels:
      zh: 收束
    start_date: '1106'
    highlight_event_id: guji-钱乙-event-book
  decisions:
  - date: '1090'
    title_zh: 目证分五脏虚实施补泻
    rationale: 目赤心实热用导赤散淡红心虚热用生犀散，青肝实热用泻青丸，淡青肝虚用地黄丸，黄脾实泻黄散微黄脾虚益黄散，白混肺实泻白散，无睛光肾虚用地黄丸
  - date: '1090'
    title_zh: 不妄攻惊守形病虚实
    rationale: 形病俱实当泻形病俱虚当补，实者病气实而形气虚，泻不定精神好大渴吹鼻不喷口干诸死证不治，慎守轻剂以全真气
