      - 幼科专精
    start_date: 1060-01-01
    highlight_event_id: guji-钱乙-event-practice
  - key: breakthrough
    name: 治愈皇子擢太医丞
    labels:
      zh:
      - 宫廷取信
      - 医名大振
    start_date: 1090-01-01
    highlight_event_id: guji-钱乙-event-court
  - key: climax
    name: 五脏寒热虚实用药大法确立
    labels:
      zh:
      - 五脏辨证
      - 四时用药
    start_date: 1100-01-01
    highlight_event_id: guji-钱乙-event-formula
  - key: closure
    name: 阎氏集录直诀刊行
    labels:
      zh:
      - 弟子集录
      - 典籍传世
    start_date: 1110-01-01
    highlight_event_id: guji-钱乙-event-book
  decisions:
  - date: 1092-01-01
    title_zh: 应诏入宫以小儿脉证进谏
    rationale: 不阿权贵，直陈病源在脾胃调护，治愈而辞厚赏，唯愿推其法以活幼稚
  - date: 1110-01-01
    title_zh: 授徒阎季忠整理遗论
    rationale: 恐毕生经验散佚，命门人笔录证治方剂，使小儿心腹痛等诸证有书可征
