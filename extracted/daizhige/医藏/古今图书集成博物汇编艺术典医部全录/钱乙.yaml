  archetype: 儿科医圣
  dilemmas:
  - 痘疹初起面燥腮赤乍凉乍热类伤寒，误投他药反夭横幼命，疑似之间何以辨证
  - 黑陷归肾十难救一，下则内虚归肾，不下则热毒内闭，进退两难何以决断
  lesson: 痘疹大要与痈疽无异，必辨表里虚实寒热，起发贯脓结痂皆赖脾胃荣养，不可妄投克伐
  summary_first_person: 吾钱乙字仲阳，专志小儿，察胎毒伏于命门，遇时热乳伤惊触而发，立五脏疮疹之候，以平和养胃全其真气，以百祥丸牛李膏救黑陷归肾，辨春夏为顺秋冬为逆，愿后人慎下慎发，不伤稚命
