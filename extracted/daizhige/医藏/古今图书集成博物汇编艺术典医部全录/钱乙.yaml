endeavors:
- id: guji-钱乙-endeavor-1
  title_zh: 开创小儿五脏疮疹辨证
  summary_zh: 究何脏所发察何因所起，立肝心脾肺肾疮疹纲领，守平和养胃之法
  phases:
  - key: brewing
    name: 幼承家学专志小儿
    labels:
      zh: 萌芽
    start_date: '1045'
    highlight_event_id: guji-钱乙-event-birth
  - key: breakthrough
    name: 立五脏各一证之法
    labels:
      zh: 突破
    start_date: '1079'
    highlight_event_id: guji-钱乙-event-wuzang
  - key: closure
    name: 小儿直诀传于后世
    labels:
      zh: 收束
    start_date: '1105'
    highlight_event_id: guji-钱乙-event-zhijue
  decisions:
  - date: '1079'
    title_zh: 究何脏所发察何因所起
    rationale: 初起面燥腮赤呵欠烦闷乍凉乍热咳嗽嚏喷难辨，主张辨肝水疱青小肺脓疱白大心斑赤小脾疹赤黄浅肾但见骩冷耳凉，令乳母节饮食慎风寒
  - date: '1085'
    title_zh: 始出无他证不可下
    rationale: 疮疹始出未有他证但用平和之药频与乳食不受风冷，三日不出不快则微发加药大发依次而进，脉平无证则止，不妄发以全真气
- id: guji-钱乙-endeavor-2
  title_zh: 救治黑陷归肾危证
  summary_zh: 辨顺逆轻重，黑紫干陷急下，不黑慎勿下，泻腑不泻脏以存肾气
  phases:
  - key: brewing
    name: 察顺逆轻重之候
    labels:
      zh: 观察
    start_date: '1088'
    highlight_event_id: guji-钱乙-event-wuzang
  - key: breakthrough
    name: 定百祥丸牛李膏下法
    labels:
      zh: 救逆
    start_date: '1092'
    highlight_event_id: guji-钱乙-event-heixian
  - key: climax
    name: 明脾土胜肾可治之机
    labels:
      zh: 决生死
    start_date: '1095'
    highlight_event_id: guji-钱乙-event-heixian
  - key: closure
    name: 示春夏顺秋冬逆之戒
    labels:
      zh: 垂训
    start_date: '1105'
    highlight_event_id: guji-钱乙-event-zhijue
  decisions:
  - date: '1092'
    title_zh: 黑紫干陷急以百祥丸下之
    rationale: 青干紫陷昏睡汗出烦躁热渴腹胀啼喘二便不通为困，身黄肿紫寒战咬牙皆热极归肾，下后身热气温饮水者脾土胜肾可治
  - date: '1095'
    title_zh: 不黑者慎勿下泻腑不泻脏
    rationale: 肾主虚不受泻故不泻肾而泻膀胱之腑，腑不实则脏不盛，二服不效反加寒者死，冬月肾旺盛寒变黑十难救一故尤慎
events:
- id: guji-钱乙-event-birth
  title_zh: 出生于吴越钱塘
  date: '1032'
  year_of: 1032
  description_zh: 宋明道元年出生，字仲阳，幼习医于姑丈，专志小儿科
- id: guji-钱乙-event-wuzang
  title_zh: 立五脏疮疹证治
  date: '1079'
  year_of: 1079
  description_zh: 论小儿在胎食五脏血秽伏于命门，遇天行时热乳食所伤惊恐所触而发，定肝水疱肺脓疱心斑脾疹肾骩冷耳凉，先脓疱后疹子先疹子后斑子为顺，反此为逆
- id: guji-钱乙-event-heixian
  title_zh: 定黑陷救治与顺逆轻重
  date: '1092'
  year_of: 1092
  description_zh: 辨里外微红为轻外黑里赤微重外白里黑大重，疮端里黑点如针孔势最剧，黑紫干陷用百祥丸牛李膏各三服，不愈者死，不黑者慎勿下，大抵属阳春夏为顺秋冬为逆
- id: guji-钱乙-event-zhijue
  title_zh: 小儿直诀成书传世
  date: '1105'
  year_of: 1105
  description_zh: 平生验方由门人阎孝忠集为小儿药证直诀，其五脏疮疹证治疮疹始出平和养胃之法载入痘疹门，为后世儿科宗范
- id: guji-钱乙-event-death
  title_zh: 逝世于东都
  date: '1113'
  year_of: 1113
  description_zh: 宋政和三年逝世，官至太医丞，儿科之圣之名传于后世
