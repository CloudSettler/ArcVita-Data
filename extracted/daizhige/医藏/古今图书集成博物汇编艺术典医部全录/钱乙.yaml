  - key: breakthrough
    name: 明辨腹痛虚寒与积痛
    labels:
      zh:
      - 脾土虚寒
      - 积滞辨证
    start_date: 1065-01-01
    highlight_event_id: guji-钱乙-event-practice
  - key: climax
    name: 益黄调中消积安虫成法
    labels:
      zh:
      - 立方垂范
      - 温补消导
    start_date: 1085-01-01
    highlight_event_id: guji-钱乙-event-formula
  - key: closure
    name: 小儿直诀腹痛虫痛垂训
    labels:
      zh:
      - 著述总结
      - 惠及幼科
    start_date: 1105-01-01
    highlight_event_id: guji-钱乙-event-book
  decisions:
  - date: 1070-01-01
    title_zh: 舍峻攻而主温养脾土
    rationale: 小儿脾常不足，口中气冷撮口利下者属虚寒，宜益黄散调中丸温补，不可妄用克滞
  - date: 1088-01-01
    title_zh: 积去之后继以调补胃气
    rationale: 大便酸臭多睡恶食者为积痛，下之以白饼子后必以白术散调补，虫痛亦先安后驱以全胃气
- id: guji-钱乙-endeavor-2
  title_zh: 宫廷行医与小儿药证直诀传世
  description_zh: 以善治小儿闻名京师，治皇子病愈授官，门人阎季忠集其论方成小儿药证直诀为儿科典范
  phases:
  - key: brewing
    name: 游学汴京声名渐起
    labels:
