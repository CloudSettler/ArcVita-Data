  archetype: 儿科鼻祖
  dilemmas:
  - 小儿腹痛虚寒积热虫痛形证相近而温清补泻相反时如何审口中冷暖面色便臭以别虚实
  - 面对攻伐峻猛可速去积虫与顾护脾胃恐伤正气之间如何先攻后补次第调理
  lesson: 小儿以脾胃为本，明辨虚寒积热虫痛，攻补有序，温养中气为要
  summary_first_person: 我字仲阳，专志小儿，观小儿体禀怯弱脾常不足，腹痛一证多从脾胃辨之，体瘦面晄白目无睛光口中气冷不思饮食或呕利撮口者乃脾土虚而寒水侮之以益黄散调中丸温补之，口中气温面色黄白多睡恶食大便酸臭者乃食积作痛以消积丸消之甚者以白饼子下之继以白术散调补胃气，口吐痰沫清水面晄白心腹痛有时者乃虫痛与痫相似而目不斜手不搐以安虫散主之，愿后人审寒热虚实虫积勿妄攻伐以全稚幼之气
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%9B%BE%E4%B9%A6%E9%9B%86%E6%88%90%E5%8D%9A%E7%89%A9%E6%B1%87%E7%BC%96%E8%89%BA%E6%9C%AF%E5%85%B8%E5%8C%BB%E9%83%A8%E5%85%A8%E5%BD%95/%E5%B0%8F%E5%84%BF%E5%BF%83%E8%85%B9%E7%97%9B%E9%97%A8.md
endeavors:
- id: guji-钱乙-endeavor-1
  title_zh: 开创小儿五脏辨证与脾胃温补法
  description_zh: 以五脏辨小儿病，以脾胃为本，分腹痛为虚寒积热虫痛三纲，立益黄散调中丸消积丸安虫散等方
  phases:
