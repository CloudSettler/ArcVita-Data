  dilemmas:
  - 气化在脾肺先见上部与精化在肝肾先见下部之辨，如何分汗解通利而不混治
  - 熏擦速愈贪效与绵绵结毒后患之择，如何守半年一载缓图而不贪速收
  lesson: 辨气化精化之源，行散攻利之后必补养收功，戒熏擦贪速，守正缓图方免结毒遗患
  summary_first_person: 吾陈实功南通业医，见杨梅绵花时疮及翻花天泡蔓延，立气化精化之辨，设九龙万灵攻利之法，著外科正宗以示先解内毒后点收口，宁缓图全愈不贪熏收速效
