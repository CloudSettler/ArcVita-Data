endeavors:
- id: guji-陈实功-endeavor-1
  person_qid: guji-陈实功
  title_zh: 杨梅疮气化精化辨治体系
  summary: 立形似杨梅绵花时疮之总论，分气化脾肺受毒与精化肝肾受毒，设万灵九龙攻利解散之序
  phases:
  - key: brewing
    name: 南通行医见时疮绵绵
    labels:
      zh:
      - 湿热邪火
      - 气化精化初辨
    start_date: 1575
    highlight_event_id: guji-陈实功-event-practice
  - key: breakthrough
    name: 立上下部分治之法
    labels:
      zh:
      - 万灵解表
      - 九龙通利
    start_date: 1590
    highlight_event_id: guji-陈实功-event-yangmei
  - key: climax
    name: 外科正宗总论成书
    labels:
      zh:
      - 升麻解毒
      - 归灵内托
    start_date: 1617
    highlight_event_id: guji-陈实功-event-book
  - key: closure
    name: 戒熏收守补养收功
    labels:
      zh:
      - 点药收口
      - 补养全愈
    start_date: 1620
    highlight_event_id: guji-陈实功-event-book
  decisions:
  - date: 1590
    title_zh: 气化用汗散精化用通利
    rationale: 气化毒在皮肤宜万灵丹洗浴发汗解散，精化毒在骨髓宜九龙丹通利二便泻骨中之毒，甚者兼服以分轻重
  - date: 1617
    title_zh: 行散后体实弱分补泻
    rationale: 行散后筋骨不疼疮根淡白方用点药，体实升麻解毒汤体弱归灵内托散，轻半年重一载不妄用熏擦以防后患
- id: guji-陈实功-endeavor-2
  person_qid: guji-陈实功
  title_zh: 翻花天泡外治收口实践
  summary: 治翻花头大蒂小流血与天泡心火脾湿上下之异，设扎缚敷裹渗湿凉血之法
  phases:
  - key: brewing
    name: 察翻花无疼流鲜血
    labels:
      zh:
      - 翻花头大蒂小
      - 久虚耗人
    start_date: 1585
    highlight_event_id: guji-陈实功-event-practice
  - key: breakthrough
    name: 立冰蛳扎缚落患法
    labels:
      zh:
      - 冰蛳散敷
      - 绵纸扎蒂
    start_date: 1595
    highlight_event_id: guji-陈实功-event-fanhua
  - key: climax
    name: 辨天泡上下风湿
    labels:
      zh:
      - 上体凉血散风
      - 下体渗湿为先
    start_date: 1617
    highlight_event_id: guji-陈实功-event-book
  - key: closure
    name: 珍珠收口防顽风紫癜
    labels:
      zh:
      - 珍珠散收口
      - 胡粉石珍珠搽
    start_date: 1620
    highlight_event_id: guji-陈实功-event-fanhua
  decisions:
  - date: 1595
    title_zh: 翻花十日落患不妄动
    rationale: 以唾调冰蛳散遍擦软纸包裹，蒂细扎紧蒂大面糊封二重，十日自落后掺珍珠散收口以保元气
  - date: 1605
    title_zh: 天泡分上下早治
    rationale: 上体风热多宜凉血散风，下体湿热多宜渗湿为先，外用胡粉散石珍珠散，不早治则变顽风紫癜难痊
