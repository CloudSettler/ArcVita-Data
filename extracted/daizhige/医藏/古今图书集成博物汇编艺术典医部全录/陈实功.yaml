    title_zh: 立干者凉心泻肝湿者清肺泻脾之纲
    rationale: 心火妄动三焦风热则干红作痒脾肺湿热则湿黄流水不可混治
  - date: 1617-01-01
    title_zh: 以化斑解毒胃苓柴胡清肝分经施治
    rationale: 腰胁缠腰属肝火妄动宜内外合治敷以金黄柏叶散内以清肝解毒
