  title_zh: 脉诀成五脏察色歌
  description: 王叔和总结心肝脾肺肾面色顺逆以瘀凝枯草炭煤枯骨痞黄决中风吉凶
- id: guji-面门-event-death
  type: death
  date: 2018-11-26
