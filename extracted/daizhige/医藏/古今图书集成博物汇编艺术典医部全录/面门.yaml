    title_zh: 明诸阳会于面故耐寒
    rationale: 气血津液皆上熏于面皮厚肉坚诸阳脉皆至头故头面多汗恶风为首风肾风面浮肿
  - date: 0198-01-01
    title_zh: 立察色合绝脉决死期
    rationale: 面青无右关面赤无右寸面白无左关面黄无左尺面黑无左寸皆绝为死故设死候以早避
events:
- id: guji-面门-event-birth
