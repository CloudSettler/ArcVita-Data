  title_zh: 素问定五色精微寿候
  description: 脉要精微五脏生成玉版诸篇辨五色生克面黄目青赤白黑不死无黄皆死
- id: guji-面门-event-lingshu
  type: career
  date: -0300-01-01
  year_of: -300
  title_zh: 灵枢明经脉上荣耐寒
  description: 邪气脏腑终始终经脉诸篇言血气上于面走空窍面热属阳明面黑为气绝木火土金水形分长锐圆方面
