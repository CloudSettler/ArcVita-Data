    title_zh: 以脏为阴以腑为阳
    rationale: 外阳内阴背阳腹阴脏藏精而不泻腑传化而不藏故当别阴阳守经隧
  - date: -2686
    title_zh: 立奇恒传化两腑之名
    rationale: 脑髓骨脉胆胞藏而不泻异于传化故名奇恒以别久留输泻之常腑
