      raw: 传说约公元前二五九七年崩
  birth_date: -2697
  death_date: -2597
  era: 上古传说
  reign_ref: 轩辕有熊氏
  archetype: 圣王
  dilemmas:
  - 欲通神明而守常经当何以合色脉阴阳四时五行
  - 欲远死近生而立治则当何以辨新久虚实死生之候
  lesson: 贵色脉以合神明察形气色泽脉之盛衰无后其时乃可万全
  summary_first_person: 吾为轩辕黄帝观天地阴阳以理民生使僦贷季理色脉而通神明与岐伯论五脏生成五色生死之候立望闻问切之外诊大法欲使后世远死近生長生道以成圣治
  source_urls:
