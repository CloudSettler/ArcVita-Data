    highlight_event_id: guji-黄帝-event-3
  decisions:
  - date: -2682
    title_zh: 先治未病传其所胜
    rationale: 病之且死必先传行至其所不胜故见肝病当先实脾以防相乘
  - date: -2678
    title_zh: 谨守经隧以行血气
    rationale: 五脏之道皆出经隧血气不和百病乃生故调治当守经隧以和血气
