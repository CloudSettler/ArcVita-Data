  lesson: 脏满而不实腑实而不满顺传则生逆传则死当治未病谨察阴阳表里
  summary_first_person: 吾居有熊见民病于四时水谷风湿之感乃问道于岐伯论脏腑阴阳形神九脏奇恒传化之别立五气五味五液五藏之纪欲使后世知满实顺逆之宜全形保命而已
