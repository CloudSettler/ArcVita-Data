    rationale: 东风南风湿燥寒分主五脏欲使人顺四时之正气避非位之邪贼
events:
- id: guji-黄帝-event-birth
  title_zh: 诞生于姬水
  date: '-2697'
  year_of: -2697
  description_zh: 黄帝生于姬水为有熊国君少典之子受国于有熊故号有熊氏
- id: guji-黄帝-event-1
  title_zh: 坐明堂问五运行大论
  date: '-2650'
  year_of: -2650
  description_zh: 黄帝坐明堂始正天纲临观八极考建五常请天师岐伯鬼臾区论五运相合六气主岁上下左右之位
- id: guji-黄帝-event-2
  title_zh: 问六微旨及五气合人化生
  date: '-2646'
  year_of: -2646
  description_zh: 黄帝叹天道远问六六之节盛衰之时得闻南面定位之法复问寒暑燥湿风火在人合之奈何万物何以化生岐伯以五方生风热湿燥寒合五脏五味对之
- id: guji-黄帝-event-death
  title_zh: 崩于荆山之阳
  date: '-2598'
  year_of: -2598
  description_zh: 黄帝在位百年垂衣裳明天运以治民疾后崩葬桥山万民追慕之
