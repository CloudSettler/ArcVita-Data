endeavors:
- id: guji-黄帝-endeavor-1
  title_zh: 使僦贷季理色脉通神明
  summary: 命师理色脉合于金木水火土四时八风六合观其变化相移以知精气盛衰
  phases:
  - key: brewing
    name: 上古问道求色脉之要
    labels:
      zh: 求道
    start_date: -2697
    highlight_event_id: guji-黄帝-event-1
  - key: breakthrough
    name: 色以应日脉以应月立阴阳大要
    labels:
      zh: 立法
    start_date: -2696
    highlight_event_id: guji-黄帝-event-1
  - key: climax
    name: 色变应四时之脉远死近生
    labels:
      zh: 合神
    start_date: -2695
    highlight_event_id: guji-黄帝-event-1
  - key: closure
    name: 治之要极无失色脉垂为大则
    labels:
      zh: 垂训
    start_date: -2694
    highlight_event_id: guji-黄帝-event-1
  decisions:
  - date: -2696
    title_zh: 以色脉为治要不惑于他术
    rationale: 色为气华脉为精液二者合则神明可通死生可决故独贵之
  - date: -2695
    title_zh: 合色脉于五行四时八风六合
    rationale: 人身不离天地常理必使诊法与四时相应方能变化相移而见妙要
- id: guji-黄帝-endeavor-2
  title_zh: 与岐伯论五脏生成外荣望诊
  summary: 发问五脏合脉皮筋肉骨荣色毛爪唇发之应辨五色生死及形气相得相失之候
  phases:
  - key: brewing
    name: 问五脏之合荣主以类推其象
    labels:
      zh: 发问
    start_date: -2694
    highlight_event_id: guji-黄帝-event-2
  - key: breakthrough
    name: 明五色生死如缟裹朱玉之喻
    labels:
      zh: 辨色
    start_date: -2693
    highlight_event_id: guji-黄帝-event-2
  - key: climax
    name: 合色脉以别小大滑濇浮沉万全无失
    labels:
      zh: 合诊
    start_date: -2692
    highlight_event_id: guji-黄帝-event-2
  - key: closure
    name: 察真脏脉见与夭色以决死期早治
    labels:
      zh: 决死
    start_date: -2691
    highlight_event_id: guji-黄帝-event-2
  decisions:
  - date: -2693
    title_zh: 能合色脉可以万全
    rationale: 脉可指别色可目察声可意识象可类推合之则新故虚实死生皆见
  - date: -2691
    title_zh: 见真脏夭色则予期日急治无后时
    rationale: 大骨枯槁大肉陷下真脏脉见者胃气已绝故当察形气色泽早决治守
events:
- id: guji-黄帝-event-birth
  title_zh: 诞生于有熊
  date: -2697
  year_of: -2697
  description: 传说轩辕生于有熊少典之子长而神灵为有熊国君
- id: guji-黄帝-event-1
  title_zh: 命僦贷季理色脉通神明
  date: -2696
  year_of: -2696
  description: 使师经理色脉合于五行四时八风六合立色以应日脉以应月之要垂移精变气之论
- id: guji-黄帝-event-2
  title_zh: 问岐伯五脏生成五色望诊
  date: -2693
  year_of: -2693
  description: 问对心合脉肺合皮肝合筋脾合肉肾合骨之应论五色见生见死及脉小大滑濇浮沉之别立外诊望法
- id: guji-黄帝-event-death
  title_zh: 崩逝传说鼎湖升天
  date: -2597
  year_of: -2597
  description: 在位百年传说铸鼎荆山崩后葬桥山垂圣王生道以长之治为后世医道宗祖
