events:
- id: guji-黄帝-event-birth
  type: birth
  title_zh: 生于轩辕之丘
  date: -2697
  year_of: -2697
  description: 姓公孙名轩辕有熊国君之子母附宝感大电绕北斗怀孕二十四月而生生而神灵弱而能言幼而徇齐长而敦敏
- id: guji-黄帝-event-ask-tianzhen
  type: career
  title_zh: 问天师上古天真
  date: -2670
  year_of: -2670
  description: 问上古百岁不衰今半百而衰之由得闻法阴阳和术数食饮有节起居有常避虚邪贼风恬惔虚无真气从之之教
- id: guji-黄帝-event-tiangui
  type: career
  title_zh: 论男女天癸生长壮老
  date: -2665
  year_of: -2665
  description: 明女子七岁更齿二七天癸至七七竭男子八岁更齿二八精溢八八衰极肾主水受五脏精老则材力尽而无子
- id: guji-黄帝-event-neijing
  type: career
  title_zh: 咨岐伯作成素问内经
  date: -2660
  year_of: -2660
  description: 察五气立五运洞性命纪阴阳与六臣问答成素问八十一篇复有灵枢八十一篇以九为数救万古民命
- id: guji-黄帝-event-death
  type: death
  title_zh: 成而登天
  date: -2599
  year_of: -2599
  description: 功成德全登天而去后世尊为医道之祖内经之作肇自羲黄
