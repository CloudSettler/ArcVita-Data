  title_zh: 诸家定肾虚胃热虫蛀之别
  description: 薛己王肯堂赵献可等总论动摇属肾虫疳肿秽属阳明，分别补肾清胃诛虫
- id: guji-齿门-event-death
  date: 1726-01-01
  year_of: 1726
  title_zh: 医部全录齿门汇成
  description: 古今图书集成汇素难灵枢及唐宋金元明论治于齿门一卷，体系遂定
