    rationale: 湿热被风寒郁闭而痛，内服辛凉散热，外用辛温擦漱，必从治而痛乃开
events:
- id: guji-齿门-event-birth
  date: -0259-01-01
  year_of: -259
  title_zh: 素问立论齿更
  description: 上古天真论言男女七八肾气盛衰而齿更生槁脱，立齿为骨余肾标之纲
- id: guji-齿门-event-1
  date: -0249-01-01
  year_of: -249
  title_zh: 灵枢明阳明入齿
  description: 手阳明支入下齿足阳明循鼻入上齿，天有列星人有牙齿，定上下龈络属
- id: guji-齿门-event-2
  date: 0652-01-01
  year_of: 652
  title_zh: 千金述盐汤叩齿固齿
  description: 孙思邈论龂宣露忌油枣，倡盐汤揩齿叩齿百遍以牢密口齿
- id: guji-齿门-event-3
  date: 1347-01-01
  year_of: 1347
  title_zh: 东垣丹溪分寒热治牙痛
  description: 李杲分上下龈寒热喜恶，朱震亨主湿热上龈被风冷郁，内外兼治从治用辛温
- id: guji-齿门-event-4
  date: 1570-01-01
