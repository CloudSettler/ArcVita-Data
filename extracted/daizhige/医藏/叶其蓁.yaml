events:
- id: guji-叶其蓁-event-birth
  title_zh: 出生于清康熙年间
  date: '1680'
  year_of: 1680
  description_zh: 生于清康熙年间，家贫好医，生平不详
  event_type: birth
- id: guji-叶其蓁-event-collect
  title_zh: 重价求书数十年拈出大全
  date: '1715'
  year_of: 1715
  description_zh: 不惜重价求妇人良方济阴纲目邯郸遗稿产宝外台秘要褚氏遗书等，数十年始得寓目，于大全书中逐一拈出参以己意
  event_type: endeavor
- id: guji-叶其蓁-event-compile
  title_zh: 编成调经胎前诸门歌论脉方
  date: '1720'
  year_of: 1720
  description_zh: 以带下为始尊扁鹊，辨七情六淫虚实痰气，先编歌诀使习诵，次析病因病机，次引历代大家治法方药
  event_type: endeavor
- id: guji-叶其蓁-event-publish
  title_zh: 雍正甲辰刊女科指掌
  date: '1724'
  year_of: 1724
  description_zh: 刊女科指掌于雍正甲辰春，分子培叶进京就试出尊人手著，成都张鹏翮五月为叙，凡例言删半就刻补回生丹资生汤安产藏衣法
  event_type: achievement
- id: guji-叶其蓁-event-death
  title_zh: 卒于雍正以后
  date: '1735'
  year_of: 1735
  description_zh: 刊书后欲以十三科各集次第问世，自叹不知此身还有几年，卒年不详
  event_type: death
