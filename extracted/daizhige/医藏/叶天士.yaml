    rationale: 读书临症之余备以广博览，未始无旁通之益，后学可深求精义而不致毫厘千里之失
  - date: 1740
    title_zh: 垂训葆真静养缓图
    rationale: 藏真不固血肉难克有形之阴，全赖自知利害屏除烦劳恼怒，切勿乱投药饵以保少阴
events:
