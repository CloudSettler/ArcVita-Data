  decisions:
  - date: 1700
    title_zh: 舍伤寒独尊而立温病纲领
    rationale: 见江南温热湿邪多从口鼻而入，伤寒六经难赅，遂立卫气营血以辨浅深
  - date: 1720
    title_zh: 坚持辨气分血分寒热
    rationale: 见疹色白赤、舌苔脉象之异，气分宜辛散宣通，血分宜凉润和络，不使气血相混
- id: guji-叶天士-endeavor-2
  title_zh: 晚年方案垂范后学
  summary: 晚年临证数案，务本脾胃，养胃阴通阳气，以平淡精纯之方教人下手
  phases:
  - key: brewing
    name: 中年劳嗽脾胃致损积验
    labels:
      zh: 积验酝酿
    start_date: 1715
    highlight_event_id: guji-叶天士-event-fame
  - key: breakthrough
    name: 悟后天荫庇先天之旨
    labels:
      zh: 脾胃突破
    start_date: 1735
    highlight_event_id: guji-叶天士-event-lateplan
  - key: climax
    name: 晚年方案随证精论广传
    labels:
      zh: 方案鼎盛
    start_date: 1740
    highlight_event_id: guji-叶天士-event-lateplan
  - key: closure
    name: 徐批真本托临证指南
    labels:
      zh: 付托收束
    start_date: 1746
    highlight_event_id: guji-叶天士-event-death
  decisions:
  - date: 1738
    title_zh: 阴虚不用滋腻而先养胃阴
    rationale: 见胃弱者受滋腻则泄泻，遂以沙参麦冬扁豆蔗汁养胃生津，津敷则肺肾自润
  - date: 1742
    title_zh: 痰饮哮喘坚持温药和之
    rationale: 遵仲景痰饮当以温药和之，不用天王补心寒凉，投桂苓甘味小青龙以通阳交阴
events:
- id: guji-叶天士-event-birth
  date: 1667
  year_of: 1667
  title_zh: 生于江苏吴县
  description: 康熙六年生于吴县医学世家，祖父父亲皆精医，幼聪慧强记博闻
- id: guji-叶天士-event-wenbing
  date: 1700
  year_of: 1700
  title_zh: 总结温病卫气营血辨证
  description: 游历四方访名师，博览素问灵枢伤寒，悟温邪传变有卫气营血层次，自成一家
- id: guji-叶天士-event-fame
  date: 1725
  year_of: 1725
  title_zh: 名重江南临证无数
  description: 以善辨寒热气血名噪大江南北，三致千金而隐德行善，门庭求诊者踵接
- id: guji-叶天士-event-lateplan
  date: 1740
  year_of: 1740
  title_zh: 晚年方案精论垂世
  description: 晚年临证更臻精纯，论劳嗽寒热瘕泄胀满诸案，阐填精益髓养胃通阳之法，门人录为真本
- id: guji-叶天士-event-death
  date: 1746
  year_of: 1746
  title_zh: 逝世于苏州
  description: 乾隆十一年逝世，享年八十，遗著由门人整理为临证指南温热论等传世
