    rationale: 不忍坐视斯人颠连，审病源虚实以调剂得平，明脉理精微以制治有要
  - date: 1730
    title_zh: 心小胆大创制新奇汤丸
    rationale: 症多怪异不可拘泥古方，按症酌方各有因心之妙，方能转枢天心而获效验
