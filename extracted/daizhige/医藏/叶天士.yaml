    start_date: 1746
    highlight_event_id: guji-叶天士-event-death
  decisions:
  - date: 1715
    title_zh: 中风主肝风阳亢不用祛风燥药
    rationale: 阴虚阳亢风自内起，以苦降辛泄少佐微酸柔润调肝，佐介属潜镇
  - date: 1730
    title_zh: 虚劳咳嗽主滋填肺肾不事攻补
    rationale: 劳损精亏肺燥阴伤，以有情之属填精，甘凉清润上供，忌温补辛散劫阴
