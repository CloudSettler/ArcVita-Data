  place_zh: 江苏苏州
  description_zh: 行医吴中，洞见病源，用药心小胆大，无远近染求治者日不暇给，每授汤丸无不效验
- id: guji-叶天士-event-2
  title_zh: 温病辨治大成门人汇方案
  date: 1735
  year_of: 1735
  place_zh: 江苏苏州
