  - 恪守仲景伤寒古法与另立温热新法之间的抉择
  - 温补扶阳与辛凉清透之间的用药权衡
  lesson: 辨阴阳表里虚实寒热之要，明标本传变之机，不泥日数，活泼应病，方为医之纲领。
  summary_first_person: 吾吴人也，少承家学，临证数十载，见伤寒温热混治误人，遂辨卫气营血，传心法于门人，述医效秘传以明六经标本阴阳表里之要，愿后学审脉验症，活泼用方。
