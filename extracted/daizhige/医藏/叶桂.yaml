endeavors:
- id: guji-叶桂-endeavor-1
  title_zh: 温病卫气营血体系创立
  summary: 久居江南，察温热与伤寒大异，立辛凉透表甘淡驱湿之法，辨营气血先后，成温病一派之宗。
  phases:
  - key: brewing
    name: 吴中临证积累
    labels:
      zh: 临证积累
    start_date: 1685
    highlight_event_id: guji-叶桂-event-birth
  - key: breakthrough
    name: 温邪上受首犯肺立论
    labels:
      zh: 立论突破
    start_date: 1725
    highlight_event_id: guji-叶桂-event-wenbing
  - key: climax
    name: 卫气营血辨治大成
    labels:
      zh: 体系大成
    start_date: 1735
    highlight_event_id: guji-叶桂-event-wenbing
  - key: closure
    name: 温热论授徒传世
    labels:
      zh: 传世收束
    start_date: 1745
    highlight_event_id: guji-叶桂-event-death
  decisions:
  - date: 1725
    title_zh: 舍伤寒汗下专法另立辛凉轻剂
    rationale: 温邪热变最速，留恋在表即化热，不可纯用麻桂承气，故用银翘桑菊之类透风于热外。
  - date: 1735
    title_zh: 定先气后营透斑为要之序
    rationale: 营分受热则斑疹神昏，急撤气药凉血透斑，以犀角竹叶花露金汁之属救阴护心。
- id: guji-叶桂-endeavor-2
  title_zh: 伤寒要旨传授与医效秘传成书
  summary: 述六经标本阴阳表里虚实寒热之要，定十六种正名，授后学吴金寿校订成医效秘传。
  phases:
  - key: brewing
    name: 研读仲景讲明脉症
    labels:
      zh: 研经讲脉
    start_date: 1690
    highlight_event_id: guji-叶桂-event-birth
  - key: breakthrough
    name: 标本虚实纲领明辨
    labels:
      zh: 纲领突破
    start_date: 1730
    highlight_event_id: guji-叶桂-event-yixiao
  - key: climax
    name: 口述要书分经论治
    labels:
      zh: 分经论治
    start_date: 1740
    highlight_event_id: guji-叶桂-event-yixiao
  - key: closure
    name: 后学校订医效秘传刊行
    labels:
      zh: 校订刊行
    start_date: 1746
    highlight_event_id: guji-叶桂-event-death
  decisions:
  - date: 1730
    title_zh: 不泥日数直攻见症之经
    rationale: 日数虽多有表症而脉浮者宜汗，日数虽少有里症而脉沉者宜下，见太阳直攻太阳，见少阴直攻少阴。
  - date: 1740
    title_zh: 定十六种正名以正传变之误
    rationale: 伤寒原无定体，发狂谵语结胸痞满皆传变所致，须定伤寒伤风湿温风温温毒等名，方论详审方无枉死。
events:
- id: guji-叶桂-event-birth
  date: 1667
  year_of: 1667
  title_zh: 出生吴中医药世家
  description: 康熙六年生于古吴，祖父子缄父阳生皆精医，自幼博览医籍，继家学而青出于蓝。
- id: guji-叶桂-event-wenbing
  date: 1735
  year_of: 1735
  title_zh: 总结温邪卫气营血辨治
  description: 察江南温热久羁一经不移之异，提出温邪上受首先犯肺逆传心包，以辛凉甘淡分气营血治之。
- id: guji-叶桂-event-yixiao
  date: 1740
  year_of: 1740
  title_zh: 口述伤寒要旨授徒编纂
  description: 述要书说六经图伤寒论十六种治法，明定名分经审症察脉之要，由吴金寿子音校订为医效秘传。
- id: guji-叶桂-event-death
  date: 1746
  year_of: 1746
  title_zh: 卒于苏州门人传其学
  description: 乾隆十一年卒，遗温热论等由门人整理传世，为清代温病四大家之首，江南医派之宗。
