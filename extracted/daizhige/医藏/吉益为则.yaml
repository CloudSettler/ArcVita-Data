  - title_zh: 常变之辨
    description_zh: 食医主养精随好恶，疾医主攻疾不避好恶，本草混常变为一当辨而正之
  - title_zh: 性功之争
    description_zh: 世以阴阳五行性寒热论药，我唯以试方考征求其主治旁治之功实
  lesson: 以天地人不异之则正古今论说之异，攻疾匪攻不克，养生匪性不得，常变不可混一
  summary_first_person: 吾从事扁鹊试方之法四十年，以量多少知所主治，视病所在知所旁治，参互考其征，始知药皆毒而攻病毒，作药征以明其功实
