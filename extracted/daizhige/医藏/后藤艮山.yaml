  dilemmas:
  - title_zh: 金元旧习与复古之争
    description: 近世古方囿于金元陋习流碎残极，当因循旧说抑或豪然崛起一洗弊风
  - title_zh: 正养与偏治之辨
    description: 谷肉果菜为正养以养精草木虫石为偏治以攻邪，若以药品补精气则误矣
  lesson: 不粗卤则过密者皆非，须虚心凝思先得一元气郁滞之大纲而治之
  summary_first_person: 我为后藤艮山，见一溪道三之后医术流碎残极，遂豪然崛起复转而古，一洗金元弊风，标正养偏治之旨，论肝胆气郁与癖毒按腹虚实，愿后生寻绎以至古人之域
