    start_date: '1680'
    highlight_event_id: guji-后藤艮山-event-study
  - key: breakthrough
    name: 豪然崛起立帜
    labels:
      zh: 中兴开端
    start_date: '1700'
    highlight_event_id: guji-后藤艮山-event-revival
  decisions:
  - date: '1700'
    title_zh: 弃金元陋习复转而古
    rationale: 医至一溪道三之门流碎残极唯复古可廓清，故不惧好奇之讥而力倡古方
- id: guji-后藤艮山-endeavor-2
  title_zh: 创气郁癖毒理疗垂范
  summary: 揭正性偏性大纲论治世人肝胆气郁多宜熊胆开郁，论癖聚任脉饵食养胃，门人私淑而传
  phases:
  - key: climax
    name: 气郁癖学大成
    labels:
      zh: 理法确立
    start_date: '1710'
    highlight_event_id: guji-后藤艮山-event-doctrine
  - key: closure
    name: 门人私淑传灯
    labels:
      zh: 垂范后世
    start_date: '1720'
    highlight_event_id: guji-后藤艮山-event-teach
  decisions:
  - date: '1710'
    title_zh: 以熊胆开郁以饵食养胃
    rationale: 廊颓厢敝则堂室狭不去癖则胃不振，故先驱癖以滋味养胃，外感主汤液内伤主饵食
