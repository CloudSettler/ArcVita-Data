endeavors:
- id: guji-后藤艮山-endeavor-1
  title_zh: 复兴古方一洗弊风
  summary: 继名古屋玄医并河天民之后豪然崛起，洗从前弊风，开享元复古与吾道中兴之先声
  phases:
  - key: brewing
    name: 研读仲景蓄势
