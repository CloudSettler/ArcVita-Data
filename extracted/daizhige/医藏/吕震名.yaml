  year_of: 1850
  title_zh: 道光庚戌冬撰成伤寒寻源自序
  description: 分为三编，首辨源流证法，次辨疑似，中卷未备，后疏制方精义，名曰伤寒寻源以示及门
- id: guji-吕震名-event-publish
  type: publish
  date: '1854-06-01'
  year_of: 1854
  title_zh: 咸丰甲寅潘遵祁校刊
  description: 潘遵祁从其子索遗箸得三卷，亟为检校以行于世，要论一卷尚俟续刊
- id: guji-吕震名-event-death
  type: death
  date: '1860'
  year_of: 1860
  title_zh: 卒于钱唐
  description: 咸丰以后卒于家，中卷尚有未备，盖未竟之作，卒月日不详
