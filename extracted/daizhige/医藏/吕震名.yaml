  - title_zh: 守仲景圆机还是从时俗简法
    description: 世人墨守叔和序例以时论病，又趋陶节庵简便之法，我当直追仲景渊源还是苟从易径
  - title_zh: 驳前贤还是全前贤
    description: 王叔和传书有功而序例误人，我当平心辨功过还是轻诋前贤
  lesson: 寻源穷理，见病知源，方能不眩于多岐
  summary_first_person: 余钱唐吕震名，究心仲景二十余年，辨风寒湿温热源流，正伤寒之名，分为三编以示及门，愿为读仲景之津梁
