  lesson: 研穷灵素以通经义，详求望闻问切以审证因，深悉气味阴阳以明药性，方能合离变化切中病情
  summary_first_person: 余乃澉水吴仪洛，字遵程，居硖川利济堂，悯近代时医舍经务方实实虚虚，因取吴鹤皋汪庵所辑而增改之，得古今良方千一百余首，禀经订证编为十三卷，名曰成方切用，欲使学者知受病之由达用药之意，因时制宜以济世
  source_urls:
