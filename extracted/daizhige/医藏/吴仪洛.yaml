  decisions:
  - date: 1755
    title_zh: 以明理为医之先务
    rationale: 理不明则证无从辨证不辨则药无所用，故首著一源必彻以斟酌经义
  - date: 1756
    title_zh: 以亲历折衷群言辨药性病情
    rationale: 天生一药济一病，偏驳之性皆可伤人，故互阐药性病情，注明气味经络功用主治忌用
