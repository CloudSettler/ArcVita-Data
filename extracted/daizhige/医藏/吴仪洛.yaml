  decisions:
  - date: 1755-01-01
    title_zh: 增补吴汪阙略广采新方
    rationale: 吴氏门多方少汪氏承讹袭愆且未录新方，故须扩充至千一百余首方足尽医疗之法
  - date: 1761-12-01
    title_zh: 标举切用以审时宜
    rationale: 今人禀薄元气渐衰，多宜调养温补痛戒寒凉克伐，故必切于时用切于病情而不执古法
- id: guji-吴仪洛-endeavor-2
  title_zh: 研经审证倡导通变济世
  summary_zh: 主张研穷灵素详求四诊深悉药性，以君臣奇偶缓急大小之制驭方，辨真假虚实寒热，反佐从治，以防轻病致重重病致死
  phases:
