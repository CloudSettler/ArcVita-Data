      - 重调养
    start_date: 1761-01-01
    highlight_event_id: guji-吴仪洛-event-preface
  - key: closure
    name: 栖利济堂施治训学
    labels:
      zh:
      - 合离变化
      - 迎刃中肯
    start_date: 1762-01-01
    highlight_event_id: guji-吴仪洛-event-practice
  decisions:
  - date: 1761-01-01
    title_zh: 痛戒寒凉专主温养
    rationale: 去宋元又远元气转薄，执成方尽剂罔顾本元则杀人多矣，故临证多事调养以存正
  - date: 1761-12-01
    title_zh: 授人以法而不授人以方
    rationale: 病有标本先后治有缓急逆从，唯通经审证达药性者方能神明推展比例善用
events:
- id: guji-吴仪洛-event-birth
  title_zh: 诞生于澉水吴氏
  date: 1700-01-01
  year_of: 1700
  place_zh: 澉水
  description_zh: 清康熙末年生于澉水，字遵程，后居硖川利济堂，少研灵素旁及仲景诸家
- id: guji-吴仪洛-event-study
  title_zh: 博览医经方论
  date: 1745-01-01
  year_of: 1745
  place_zh: 硖川
  description_zh: 取成无己吴鹤皋方中行喻嘉言周扬俊汪庵诸家之说，详求望闻问切气味阴阳，为辑方奠基
- id: guji-吴仪洛-event-compile
  title_zh: 增改吴汪旧辑广集良方
  date: 1755-01-01
  year_of: 1755
  place_zh: 硖川利济堂
  description_zh: 取吴氏汪氏所辑而增改之，得古今良方凡千一百余首，禀诸经以观其合订之证以发其微，分为十三卷
- id: guji-吴仪洛-event-preface
  title_zh: 乾隆辛巳冬月作序成书
  date: 1761-12-01
  year_of: 1761
  place_zh: 硖川利济堂
  description_zh: 书成题端曰成方切用，自序论舍奥旨务粗迹之弊，明切于时用切于病情之义，兼作凡例方制总义以训学者
- id: guji-吴仪洛-event-practice
  title_zh: 居利济堂行医训学
  date: 1762-01-01
  year_of: 1762
  place_zh: 硖川利济堂
  description_zh: 以调养温补为要，痛戒克伐寒凉，授学者以后间见详略不一之法，使神明推展善用成方
- id: guji-吴仪洛-event-death
  title_zh: 卒于乾隆后期
  date: 1780-01-01
  year_of: 1780
  place_zh: 硖川
  description_zh: 成方切用刊行后仍行医著述，卒年不详约在乾隆后期，遗书盛行海内为时医所宗
