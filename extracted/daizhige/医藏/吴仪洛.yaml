    title_zh: 半因仍半增改以求至当
    rationale: 备要采辑虽广而专信前人无折衷，不揣固陋折衷群言参以涉历以扩未尽
  - date: 1757
    title_zh: 削有名无药补纲目后新收
    rationale: 预知子之类有是名无是药则削去，燕窝之类纲目后新收则补入，并详注宜忌以免贻误
- id: guji-吴仪洛-endeavor-2
  title_zh: 撰医学十种明理辨证用药
  summary_zh: 以医学之要莫先明理其次辨证其次用药，著一源必彻四诊须详等十种，斟酌群言期于至当
