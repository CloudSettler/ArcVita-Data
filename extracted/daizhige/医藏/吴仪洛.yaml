  dilemmas:
  - title_zh: 因仍旧文还是参以涉历增改
    description_zh: 汪氏备要杂采无折衷而多承误，尽仍则误人，尽改则失据，故半仍半改旁掇旧文参以涉历
  - title_zh: 博洽与简切如何两全
    description_zh: 纲目集大成而稍繁，备要卷简而本非医家不临证，故削有是名无是药者，补纲目后新收如燕窝，以羽翼古人切时用
  lesson: 理不明则证不辨证不辨则药无所用，必注明主治之由当用之理并详忌用方能济众
  summary_first_person: 余澉水人，自髫年习制举即旁览先世所藏岐黄家言，四十年精绎，以明理辨证用药为要，取汪氏备要重订之，半仍半改，参以涉历，名曰本草从新，付梓以切时用
  source_urls:
