  name_zh: 吴又可
  names:
    zh: 吴又可
    en: Wu Youke
  lifespan:
    birth:
      date: 1582
      precision: year
      is_circa: true
      raw: 明万历十年左右
    death:
      date: 1652
      precision: year
      is_circa: true
      raw: 清顺治九年左右
  birth_date: 1582
  death_date: 1652
  era: 明末清初
  reign_ref: 崇祯
  archetype: 医家创论者
  dilemmas:
  - 伤寒成法具在而大疫横行不效，守旧法还是别立瘟疫一门
  - 世医口诵瘟疫而手仍用伤寒辛温发散，信书还是信证
  - 疫邪千变万化而表里难分，先解表还是先攻里清里
  lesson: 辨证当从气色脉舌神求实，不可因名混治，瘟疫自外别传，与伤寒同途异归
  summary_first_person: 吾吴又可，目击崇祯大疫，伤寒法治疫不效，遂贯串古今，独辟瘟疫一门，著时行瘟疫论，立膜原达原之说，使后人知疫非伤寒，不再误用辛温发散，横夭者少。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/广瘟疫论.md
  - https://daizhige.org/医藏/广瘟疫论.html
endeavors:
- id: guji-吴又可-endeavor-1
  title_zh: 独辟鸿蒙著瘟疫论
  summary: 融会仲景河间东垣诸法，贯串心得，专论时行瘟疫，揭日月于中天
  phases:
  - key: brewing
    name: 行医睹疫
    labels:
      zh:
      - 览伤寒诸条
      - 疑疫异于伤寒
    start_date: 1628
    highlight_event_id: guji-吴又可-event-1628
  - key: breakthrough
    name: 崇祯大疫参悟
    labels:
      zh:
      - 同途异归
      - 膜原邪伏
    start_date: 1641
    highlight_event_id: guji-吴又可-event-1641
  - key: climax
    name: 撰成瘟疫论
    labels:
      zh:
      - 立达原饮
      - 分汗下和解
    start_date: 1642
    highlight_event_id: guji-吴又可-event-1642
  - key: closure
    name: 刊行垂后
    labels:
      zh:
      - 救济生灵
      - 启戴氏广义
    start_date: 1644
    highlight_event_id: guji-吴又可-event-1642
  decisions:
  - date: 1641
    title_zh: 不拘伤寒法治疫
    rationale: 大疫发热头痛似伤寒而气色舌苔迥异，辛温发散必误，故舍伤寒另立疫论
  - date: 1642
    title_zh: 著专书直指瘟疫之名
    rationale: 古人详于辨证不详于立名，散见经条，欲人从证细辨不混治，故专著以明之
- id: guji-吴又可-endeavor-2
  title_zh: 立达原饮法辨表里传变
  summary: 以达原饮开达膜原，分表里半表半里，使清下和解各得其所
  phases:
  - key: brewing
    name: 察表证发热
    labels:
      zh:
      - 头痛项强
      - 舌白浓不滑
    start_date: 1641
    highlight_event_id: guji-吴又可-event-1641
  - key: breakthrough
    name: 悟里证蓄邪
    labels:
      zh:
      - 烦渴满便闭
      - 当清当下
    start_date: 1642
    highlight_event_id: guji-吴又可-event-1642
  - key: climax
    name: 制方施治
    labels:
      zh:
      - 达原饮透邪
      - 三承气攻里
    start_date: 1642
    highlight_event_id: guji-吴又可-event-1642
  - key: closure
    name: 辨夹证垂法
    labels:
      zh:
      - 夹血瘀脾肾虚
      - 但治疫旧病自已
    start_date: 1644
    highlight_event_id: guji-吴又可-event-1642
  decisions:
  - date: 1642
    title_zh: 制达原饮直达募原
    rationale: 疫邪客于募原传于太阴，非汗下可尽，故开郁透发使邪传变而解
  - date: 1642
    title_zh: 表不用辛温里速清下
    rationale: 疫气从中蒸达于外，初即臭触舌白浓，误散则剧，故表忌辛热里勿瞻顾迟回
events:
