  birth_date: 1582
  death_date: 1652
  era: 明末清初
  reign_ref: 崇祯
  archetype: 医家革新者
  dilemmas:
  - 遵伤寒古法与直面温疫今病之辨
  - 缓药守方与急证急攻逐邪之抉择
  lesson: 守古法不合今病，当静心穷理，格其所感之气与所入之门，早拔病根，开门祛贼。
  summary_first_person: 余姑苏洞庭吴有性，字又可，见崇祯大疫阖门传染，时师误以伤寒法治之多殆，乃悟温疫非风寒暑湿，乃天地异气疠气所感，舍于伏脊膜原，著温疫论以正鹿马之分。
  source_urls:
  - https://daizhige.org/医藏/温疫论.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/温疫论.md
  - https://ctext.org/wiki.pl?if=gb&res=693843
endeavors:
- id: guji-吴又可-endeavor-1
  title_zh: 创疠气膜原学说
  summary: 辨温疫非伤寒，立天地疠气之因，邪自口鼻入伏膜原，表里分传为纲。
  phases:
  - key: brewing
    name: 穷理格气
    labels:
      zh: 研伤寒较温疫
    start_date: 1635
    highlight_event_id: guji-吴又可-event-1641
  - key: breakthrough
    name: 立膜原疠气论
    labels:
      zh: 横连膜原半表半里
    start_date: 1641
    highlight_event_id: guji-吴又可-event-1641
  decisions:
  - date: 1641
    title_zh: 弃六经传经旧说
    rationale: 温疫传变与太阳传阳明迥别，当以膜原为据点论传变逆顺。
  - date: 1641
    title_zh: 以口鼻膜原立论
    rationale: 邪自口鼻入，不在脏腑经络，去表不远附近于胃，故当直达其巢。
- id: guji-吴又可-endeavor-2
  title_zh: 著温疫论救崇祯大疫
  summary: 亲历山东浙直大疫，创达原饮三消饮白虎承气诸法，急证急攻，逐邪为先。
  phases:
  - key: climax
    name: 大疫救治立法
    labels:
      zh: 达原逐邪早治
    start_date: 1642
    highlight_event_id: guji-吴又可-event-1642
  - key: closure
    name: 成书传世
    labels:
      zh: 崇祯壬午仲秋书成
    start_date: 1642-08
    highlight_event_id: guji-吴又可-event-1642
  decisions:
  - date: 1642
    title_zh: 创达原饮直达膜原
    rationale: 槟榔浓朴草果破结开门，佐知母芍药黄芩和营清热，不汗不下而溃伏邪。
  - date: 1642
    title_zh: 急证急攻用承气逐邪
    rationale: 承气本为逐邪而设非专为结粪，一日三变则一日行数日之法，勿拘下不厌迟。
events:
- id: guji-吴又可-event-birth
  date: 1582
  year_of: 1582
  title_zh: 生于姑苏洞庭
  description: 明万历十年生于苏州府吴县洞庭东山，名有性，字又可。
- id: guji-吴又可-event-1641
  date: 1641
  year_of: 1641
  title_zh: 目击崇祯辛巳大疫
  description: 山东浙省南北两直疫气流行至五六月益甚阖门传染，时师误治殆亡无数，遂静心穷理格气入门传变之体。
- id: guji-吴又可-event-1642
  date: 1642-08
  year_of: 1642
  title_zh: 温疫论成书
  description: 崇祯壬午仲秋书于淡淡斋，分上下卷述原病初起传变达原三消白虎承气诸法，发明九传紧要关节。
- id: guji-吴又可-event-death
  date: 1652
  year_of: 1652
  title_zh: 卒于清初
  description: 清顺治九年卒，一生以温疫疠气膜原之说开温病学先河，达原饮法为后世宗。
