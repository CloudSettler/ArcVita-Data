  date: 1628
  year_of: 1628
  title_zh: 行医览诸家瘟疫方
  description: 览仲景大青龙阳旦越婢柴胡承气及河间凉膈双解东垣羌活诸法，叹无专书特名
- id: guji-吴又可-event-1641
  date: 1641
  year_of: 1641
  title_zh: 崇祯辛巳大疫诊治
  description: 大疫盛行，发热头痛而气作尸气面垢晦舌白浓，知非伤寒，参悟膜原之邪
- id: guji-吴又可-event-1642
  date: 1642
  year_of: 1642
  title_zh: 著成时行瘟疫论
  description: 融以心得专论瘟疫，立达原饮及汗下和双解法，后戴天章据以广为广瘟疫论增辨气色脉舌神
- id: guji-吴又可-event-death
  date: 1652
  year_of: 1652
  title_zh: 逝世
  description: 明末清初之际殁，瘟疫之书至此折衷，后人媲美长沙之功
