endeavors:
- id: guji-吴师机-endeavor-1
  title_zh: 海陵乡居以膏药施治活人
  summary_zh: 奉母避乱居泰州俞家垛自制膏药施治贫病日治百人月治数千人
  phases:
  - key: brewing
    name: 避乱乡居制膏初试
    labels:
      zh: 避乱制膏
    start_date: 1856
    highlight_event_id: guji-吴师机-event-1
  - key: breakthrough
    name: 信任渐广远近求治
    labels:
      zh: 义诊渐广
    start_date: 1860
    highlight_event_id: guji-吴师机-event-2
  - key: climax
    name: 月治数千全活甚众
    labels:
      zh: 全活甚众
    start_date: 1863
    highlight_event_id: guji-吴师机-event-2
  - key: closure
    name: 总结施治经验成书
    labels:
      zh: 经验成书
    start_date: 1864
    highlight_event_id: guji-吴师机-event-3
  decisions:
  - date: 1856
    title_zh: 不用汤液专以薄贴施治
    rationale: 内服误人难收汤液之利用外治无禁制可补过观变以安其心
  - date: 1860
    title_zh: 坚持施膏不计资财
    rationale: 穷民无力延医欲阴行其德以膏济众不以财论
- id: guji-吴师机-endeavor-2
  title_zh: 著理瀹骈文立外治一门
  summary_zh: 博采灵素伤寒金匮以下诸家以骈文联缀众方发明内外殊涂同归之理
  phases:
  - key: brewing
    name: 博采约取集众方
    labels:
      zh: 集方立纲
    start_date: 1860
    highlight_event_id: guji-吴师机-event-2
  - key: breakthrough
    name: 提出膏纲药目三焦分治
    labels:
      zh: 立法分门
    start_date: 1863
    highlight_event_id: guji-吴师机-event-3
  - key: climax
    name: 骈文刊成老友作序
    labels:
      zh: 刊成有序
    start_date: 1864
    highlight_event_id: guji-吴师机-event-3
  - key: closure
    name: 补增略言以提其要
    labels:
      zh: 略言提要
    start_date: 1864
    highlight_event_id: guji-吴师机-event-4
  decisions:
  - date: 1863
    title_zh: 以骈文体联缀方论效酒经茶经之例
    rationale: 外治古无专书须分别立法示后使句句见法不徒贵症症有方
  - date: 1864
    title_zh: 增补浅近略言于卷首
    rationale: 俪体杂子史难通俗故撮大意为浅语使人人开卷了然
events:
- id: guji-吴师机-event-birth
  type: birth
  title_zh: 生于钱塘
  date: 1800-01-01
  year_of: 1800
  place_zh: 钱塘
  description: 清嘉庆末约生于浙江钱塘字尚先性好医负济世之志
- id: guji-吴师机-event-1
  type: practice
  title_zh: 避乱海陵东北乡制膏施治
  date: 1856-01-01
  year_of: 1856
  place_zh: 泰州俞家垛
  description: 奉母避乱居俞家垛自制膏药施病者下河数百里庄千五百余来求者日以百计
- id: guji-吴师机-event-2
  type: practice
  title_zh: 月治数千人薄贴以外治内
  date: 1863-01-01
  year_of: 1863
  place_zh: 海陵
  description: 以次呼问自述病因视色指部散给膏药兼加敷药洗熨月治数千人十全甚众
- id: guji-吴师机-event-3
  type: work
  title_zh: 理瀹骈文刊成
  date: 1864-04-01
  year_of: 1864
  place_zh: 海陵
  description: 集众方为骈文发明内外治殊涂同归之理许楣吴官业等为序称其专用薄贴以治内为伊古未有
- id: guji-吴师机-event-4
  type: work
  title_zh: 补增略言清阳散阴等膏方
  date: 1864-10-01
  year_of: 1864
  place_zh: 海陵
  description: 卷首补增略言提要并附清阳膏散阴膏金仙膏催生膏等验方示人自造之法
- id: guji-吴师机-event-death
  type: death
  title_zh: 卒于清同治后
  date: 1875-12-31
  year_of: 1875
  place_zh: 钱塘
  description: 施济有年著书行世后卒子孙守其膏方以保家济人
