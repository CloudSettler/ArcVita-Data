    title_zh: 立志辑录众家本草
    rationale: 见世传药论各执一词真伪难辨，欲并存神农岐黄诸家之言以便考证，故发愿辑录
  - date: '0225'
    title_zh: 以类相从详记形产
    rationale: 药之真伪系于形态产地采时，若不明记则误用害人，故于每药详书形状产地采收禁忌
