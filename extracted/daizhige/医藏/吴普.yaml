  reign_ref: 魏文帝黄初至晋武帝泰始
  archetype: 本草医家
  dilemmas:
  - 众说异辞如何折衷神农岐伯雷公扁鹊之论而存其真
  - 师承华佗之术当重养生却病还是重方药济世
  lesson: 博采诸家以核药性，详记形态产地以利后人辨用
  summary_first_person: 吾乃广陵吴普，少从华佗学医，习五禽之戏，究方药之性，惧本草散佚众说淆乱，故采神农黄帝岐伯雷公桐君扁鹊及李氏诸家之言，按玉石草木虫兽果菜米食分别部居，记其气味形态产地采时，以成一家之本草，愿后之医者得有所据而不惑于药
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%90%B4%E6%99%AE%E6%9C%AC%E8%8D%89.html
