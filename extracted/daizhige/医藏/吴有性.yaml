  decisions:
  - date: '1641'
    title_zh: 不从四时不正之气旧说改主天地厉气
    rationale: 见长幼病相似非寒热温凉常气所能尽，乃断为另有厉气自口鼻入伏膜原
  - date: '1642'
    title_zh: 立达原饮为初起主方不汗不下
    rationale: 邪在夹脊肠胃之间误汗伤表误下伤胃，故以槟榔厚朴草果直达其巢
