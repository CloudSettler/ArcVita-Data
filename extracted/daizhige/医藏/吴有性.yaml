  decisions:
  - date: '1641'
    title_zh: 表里分传先通其里不用先表后里旧次
    rationale: 里气结滞则阳不能达表，承气先通其里多自汗解，如缚足之鸟必先纵足
  - date: '1642'
    title_zh: 注意逐邪不拘结粪早下断源
    rationale: 承气本为逐邪而设非专为结粪，乘气血未乱早拔病根则变证不起
