  dilemmas:
  - 世医以伤寒法治瘟疫而多死，遵古则误人，立新说则犯众疑
  - 疫邪伏于膜原在不表不里之间，汗下温补皆非直达，抉择维艰
  - 崇祯辛巳南北大疫并作，救急与求本穷源难以两全
  lesson: 瘟疫自口鼻入伏膜原，与伤寒传经迥殊，须辨表里分传早逐邪毒，不可执伤寒成法
  summary_first_person: 余吴有性字又可震泽人也，见辛巳大疫以伤寒法治之不效，乃推求厉气自口鼻入舍于膜原之理，著瘟疫论二卷以立绳墨，辨九传之变与达原三消承气之法，愿后人知疫与伤寒异治
  source_urls:
