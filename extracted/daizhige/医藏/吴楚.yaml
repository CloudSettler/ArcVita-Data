endeavors:
- id: guji-吴楚-endeavor-1
  person_qid: guji-吴楚
  title_zh: 顺治康熙年间以医名世
  description: 承家学而不守一成之规，博览灵素及历代诸书，审脉辩症，以活人术行于顺治康熙之际
  phases:
  - key: brewing
    name: 博览穷源
    labels:
      zh: 酝酿
    start_date: 1650-01-01
    highlight_event_id: guji-吴楚-event-fame
  - key: breakthrough
    name: 以医名世
    labels:
      zh: 突破
    start_date: 1662-01-01
    highlight_event_id: guji-吴楚-event-fame
  decisions:
  - date: 1655-01-01
    title_zh: 不守师传口语遍读群书
    rationale: 仅恃倾耳听受必得偏失全得浅失深，须探讨灵素以下诸书悟其奥义方识高理透
  - date: 1662-01-01
    title_zh: 审脉辩寒热虚实再用药
    rationale: 审脉明则认症真认症真则用药当，可防大寒似热大虚似实反掌杀人之误
- id: guji-吴楚-endeavor-2
  person_qid: guji-吴楚
  title_zh: 撰述医医十病针砭医弊
  description: 忧医家心病丛生，作十病之论，陈不学无术脉症罔辩轻忽人命遵守时套药似对症曲顺人情轻药保名吝惜药料等弊，以广救生灵
  phases:
  - key: climax
    name: 十病成论
    labels:
      zh: 高潮
    start_date: 1680-01-01
    highlight_event_id: guji-吴楚-event-book
  - key: closure
    name: 广救期报
    labels:
      zh: 收束
    start_date: 1685-01-01
    highlight_event_id: guji-吴楚-event-book
  decisions:
  - date: 1680-01-01
    title_zh: 直陈十病不畏苦口暝眩
    rationale: 医病根于舍人利己之心，非细咀猛吞良剂荡涤邪秽不能超脱尘凡
  - date: 1685-01-01
    title_zh: 劝特立独行不曲顺人情
    rationale: 认症真用药当实能起沉疴救危命，何必随风倒舵唯唯诺诺以图主顾希荐举避谗谤
events:
- id: guji-吴楚-event-birth
  person_qid: guji-吴楚
  type: birth
