  title_zh: 出生于清初医家之族
  description: 约生于清初，为明代医家吴昆侄孙，字天士，号畹庵，少承家学留心医道
- id: guji-吴楚-event-fame
  person_qid: guji-吴楚
  type: career
  date: 1662-01-01
  year_of: 1662
  title_zh: 以医名于顺治康熙年间
  description: 博览灵素以下诸书，审脉辩症，不守时套，不用轻药应付，以起死回生之术名于顺治康熙之际，与徐灵胎张璐玉为同时代名医
- id: guji-吴楚-event-book
  person_qid: guji-吴楚
  type: career
  date: 1680-01-01
  year_of: 1680
  title_zh: 作医医十病序并成书
  description: 感医家利欲熏心轻忽人命遵守时套之害，作序立论，历陈不学无术脉症罔辩轻忽人命遵守时套药似对症曲顺人情轻药保名吝惜药料妒忌谗谤十病，以医医自警并广救生灵
- id: guji-吴楚-event-death
  person_qid: guji-吴楚
  type: death
  date: 1705-01-01
  year_of: 1705
  title_zh: 卒于康熙年间
  description: 行医著述之后卒于康熙年间，其医医十病之论与徐灵胎诸病源流论并称高妙，流传以广见闻
