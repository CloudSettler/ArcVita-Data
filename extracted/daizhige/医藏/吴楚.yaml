  reign_ref: 顺治至康熙
  archetype: 仁医针砭者
  dilemmas:
  - 心存济人还是心专利己
  - 博览穷理求真还是守一成之规趋时
  - 特立独行救人还是曲顺人情保名获利
  lesson: 欲医人先医医，心端方术精，博学穷理审脉辩症方能生人，舍人利己则十病丛生终伤阴骘
  summary_first_person: 我是吴楚，字天士，号畹庵，乃吴昆侄孙，以医名于顺治康熙年间。我谓人有病医亦有病，欲医人先医医，医病止在一心，心存济人则诸病不起，心专利己则诸病丛生。我遍读灵素以下诸书，审脉辩症，力戒不学无术与时套保名之弊，作医医十病以苦口之剂荡涤邪秽，愿广救生灵世受福报，不以蝇营狗苟病其心邀名图利。
  source_urls:
