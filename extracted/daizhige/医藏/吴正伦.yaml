  dilemmas:
  - 布衣应诏显技后如何全身而退
  - 同僚嫉能下毒时坦衷待人是否失防
  - 运气方土殊异下如何以验录济生利物
  lesson: 技高遭嫉自古皆然，惟著书传世可使功在一时者功在后世
  summary_first_person: 我字子叔，一作子叙，号春岩子，歙县人，幼失怙，家贫刻苦，弃儒专精医，壮游三吴齐鲁燕京，一剂愈宫廷危疾，竟为太医所忌置毒而殁，年仅四十，留脉症治方等书以传后
