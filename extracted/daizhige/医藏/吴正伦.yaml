  title_zh: 游医南北以布衣应诏愈宫廷危疾
  summary_zh: 幼失怙弃儒从医，游吴越齐鲁燕京，全活甚众，后以布衣应诏，一药愈穆宗贵妃及神宗幼疾，誉噪京师
  phases:
