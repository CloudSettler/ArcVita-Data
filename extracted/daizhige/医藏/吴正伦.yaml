      - 著述
    start_date: 1558
    highlight_event_id: guji-吴正伦-event-2
  - key: breakthrough
    name: 东游齐地著养生类要
    labels:
      zh:
      - 养生
      - 诏民
    start_date: 1565
    highlight_event_id: guji-吴正伦-event-2
  - key: climax
    name: 身阅南北著医验录脉症治方
    labels:
      zh:
      - 验录
      - 方治
    start_date: 1571
    highlight_event_id: guji-吴正伦-event-2
  - key: closure
    name: 遗书秘藏待后人校梓
    labels:
      zh:
      - 传家
      - 梓行
    start_date: 1673
    highlight_event_id: guji-吴正伦-event-death
  decisions:
  - date: 1565
    title_zh: 以六气四因为纲分门纂述
    rationale: 风寒暑湿燥火气血痰郁不越此纲，便于初学遵途上达
  - date: 1571
    title_zh: 辑古格言录师说而酌以己见
    rationale: 详于脉不略于症，详于方不略于治，井井有条意多辞简
events:
- id: guji-吴正伦-event-birth
  title_zh: 安徽歙县出生幼年丧父苦读
  date: 1532
  year_of: 1532
  place_zh: 安徽歙县
  summary_zh: 幼而失怙，家贫不能从师，畜鸡积卵购书读，弃儒专精医
- id: guji-吴正伦-event-1
  title_zh: 入京应诏愈神宗幼疾及穆宗贵妃病
  date: 1570
  year_of: 1570
  place_zh: 北京大内
  summary_zh: 穆宗贵妃善病困顿，太医院屡药不效，以布衣应诏诊脉呈方一药而愈，兼愈神宗襁褓不豫，沐奖谕赏赉，声闻大内
- id: guji-吴正伦-event-2
  title_zh: 撰成脉症治方养生类要等诸书
  date: 1571
  year_of: 1571
  place_zh: 燕京
  summary_zh: 感运气变迁方土殊异，撰医验录活人心鉴，复以脉症治三方为次編成脉症治方二百余幅，详脉审症论治立方
- id: guji-吴正伦-event-death
  title_zh: 被太医置毒酒后午夜大笑而殁
  date: 1572
  year_of: 1572
  place_zh: 北京
  summary_zh: 太医愧方不售又惧夺位，置毒卮中相饮尽欢，归枕午夜大笑数声，平明启衾僵卧物故，年仅四十，仲子居敬扶丧归
