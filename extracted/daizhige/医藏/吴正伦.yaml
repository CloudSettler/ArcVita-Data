      - 遇毒
    start_date: 1572
    highlight_event_id: guji-吴正伦-event-death
  decisions:
  - date: 1550
    title_zh: 弃儒业专精医道
    rationale: 不必登第仕宦方可济生利物，医道亦可达此志
  - date: 1570
    title_zh: 以布衣应诏入宫诊脉呈方
    rationale: 太医院屡药不效，愿以己方救急，不计位卑疏贱
- id: guji-吴正伦-endeavor-2
  title_zh: 分门论治撰脉症治方等书传世
  summary_zh: 以六气四因为纲，察脉审症论治立方，撰养生类要虚车录活人心鉴脉症治方等书，留稿待曾孙梓行
  phases:
  - key: brewing
    name: 师事陆声野著虚车录
    labels:
