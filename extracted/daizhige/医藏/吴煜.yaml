  - title_zh: 秘本真赝难定
    description: 陈氏家藏与樊氏抄本皆称竹林真传然未经女科良工校正不敢轻信
  - title_zh: 私录与济世之衡
    description: 未经主人许可携归抄录于义有亏然念济世利人则不容终秘
  lesson: 得秘方者当校订真伪而公之于世方不负先人济世之心
  summary_first_person: 余幼闻嫂氏屡致小产得竹林寺药而后有孕遂知竹林女科之名秋暮至襟丈樊元圃家得其抄录秘本条分缕晰遂袖归抄录校订并志欣幸之意于清晖书屋
