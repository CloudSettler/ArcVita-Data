    rationale: 真女科之秘要不可终秘故书年月于清晖书屋以示后来当求善于女科者再校而广传之
  - date: 1793-11-01
    title_zh: 存疑待校不妄行方
    rationale: 用药或有过不及真赝未定故俟良工别白校正若系良方乃传流以表济世微衷
