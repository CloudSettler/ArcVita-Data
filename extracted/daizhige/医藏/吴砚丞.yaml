  dilemmas:
  - 世谓治痘难治麻易，轻试草菅人命，当详麻以救枉折
  - 过用寒凉则遏伏内攻，妄用发散则耗散元气，当因时因人得平
  lesson: 悉先天之体，明后天之用，因时合宜，不实实虚虚，务使毒透表而余热清
  summary_first_person: 吾吴砚丞，字与九，号双溪，见壬子麻疫枉折甚众，采古人精言良法，汇为麻疹备要，辨阴阳部位虚实，合天时以施表托清养，付梓于神灸经纶之后以活幼
