    title_zh: 不略于麻而详论之
    rationale: 麻出六腑与痘出五脏不同，浅试轻尝多致夭折，故采精言立要法
  - date: 1853-01-01
    title_zh: 先表托后清养
    rationale: 初宜升发使毒达表，忌早用寒凉遏伏，出透当清利养血以保阴亏
