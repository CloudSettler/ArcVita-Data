    title_zh: 因时以辛凉辛寒辛温辛平发之
    rationale: 温暖用防风解毒，暄热用黄连解毒，大寒用桂枝麻黄，乍寒乍暖用升麻荆防，毋伐天和
  - date: 1853-06-01
    title_zh: 附神灸经纶后付梓
    rationale: 家君代刻神灸经纶，请附其后以广活幼心源，与明理者证之
