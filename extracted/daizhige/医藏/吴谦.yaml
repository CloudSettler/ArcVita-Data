  dilemmas:
  - 种痘口传心授恐湮没与纂辑成书垂千古之抉择
  - 水苗和平稳当与旱苗迅烈及痘衣痘浆取舍之两难
  lesson: 去险履平避危就安，审度精详调摄合宜以保赤子寿域
  summary_first_person: 我奉敕纂辑医宗金鉴，深考种痘源流，独取水苗为上，详列选苗蓄苗天时调摄禁忌可否，以为种痘津梁，冀咸登赤子于寿域。
