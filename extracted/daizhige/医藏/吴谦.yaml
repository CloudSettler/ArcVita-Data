  archetype: 医者
  dilemmas:
  - 医籍浩繁传授失真，如何删繁就简使初学有门径可守
  - 五轮八廓旧说脏腑混淆，如何厘清轮属脏廓属腑使临证有据
  lesson: 以简驭繁，以歌传心，轮廓分属，方证相应，惠及后学
  summary_first_person: 吾乃吴谦，歙县人，官太医院判，奉诏总修医宗金鉴，亲定眼科心法要诀，明目睛原始，立五轮八廓，分内障外障，作歌注方，愿后学按轮廓察病守正施治
  source_urls:
