    en: Wu Qian
  lifespan:
    birth:
      date: 1689
      precision: year
      is_circa: true
      raw: 清康熙年间生
    death:
      date: 1748
      precision: year
      is_circa: true
      raw: 乾隆十三年后卒
  birth_date: 1689
  death_date: 1748
  era: 清代
  reign_ref: 乾隆
  archetype: 太医院统修型国手
  dilemmas:
  - 古书错简传讹愈多而义愈晦当如何纠讹补漏以正轨
  - 寒热攻补各执成见当如何酌古准今以求征验
  lesson: 宗仲景之法而不泥于方参酌古今以立师范则医学昌明可寿民万世
  summary_first_person: 我是吴谦忝任太医院右院判奉谕总修医书先以余暇删订伤寒金匮既而会诸医分门聚类删驳杂采精粹成医宗金鉴九十卷以正医学以寿斯民
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%BE%A1%E7%BA%82%E5%8C%BB%E5%AE%97%E9%87%91%E9%89%B4.html
endeavors:
- id: guji-吴谦-endeavor-1
  title_zh: 总修订正伤寒论金匮要略
  summary_zh: 以张机二书为医宗正派先改正错讹注释以标证治正轨
  phases:
  - key: brewing
    name: 余暇删订旧稿
    labels:
      zh:
      - 筹备酝酿
    start_date: 1739-12-17
    highlight_event_id: guji-吴谦-event-fengyu
  - key: breakthrough
    name: 奉谕设馆总修
    labels:
      zh:
      - 开馆立纲
    start_date: 1740-03-01
    highlight_event_id: guji-吴谦-event-kaiguan
  - key: climax
    name: 纠讹补漏分注
    labels:
      zh:
      - 订正注释
    start_date: 1741-01-01
    highlight_event_id: guji-吴谦-event-dingzhu
  - key: closure
    name: 十七卷伤寒八卷金匮告成
    labels:
      zh:
      - 收束成编
    start_date: 1742-12-15
    highlight_event_id: guji-吴谦-event-gaocheng
  decisions:
  - date: 1739-12-17
    title_zh: 请先自张机书起订
    rationale: 以前之书有法无方伤寒金匮始有法有方为医门圣书故先改正以利天下时用
  - date: 1740-03-01
    title_zh: 以大内藏书及旧稿充用开馆
    rationale: 大内颁发医书详加参考已足纂修不必远取各省以速成完书
- id: guji-吴谦-endeavor-2
  title_zh: 删补方论诸科心法立师范
  summary_zh: 方论并载以明制方之意四脉运气诸科正骨皆图说歌诀以便初学诵读学成参考
  phases:
  - key: brewing
    name: 分门聚类采精粹
    labels:
      zh:
      - 纲目初定
    start_date: 1740-03-01
    highlight_event_id: guji-吴谦-event-kaiguan
  - key: breakthrough
    name: 方论并载发明君臣佐使
    labels:
      zh:
      - 方论阐发
    start_date: 1741-06-01
    highlight_event_id: guji-吴谦-event-dingzhu
  - key: climax
    name: 诸科心法正骨补遗
    labels:
      zh:
      - 诸科会通
    start_date: 1742-01-01
    highlight_event_id: guji-吴谦-event-gaocheng
  - key: closure
    name: 九十卷进呈钦定嘉名
    labels:
      zh:
      - 进呈钦定
    start_date: 1742-12-15
    highlight_event_id: guji-吴谦-event-gaocheng
  decisions:
  - date: 1741-06-01
    title_zh: 方论并载删繁摘要
    rationale: 病状相似而病本多殊必明制方之意而后能审病源进退加减故删补名医方论八卷
  - date: 1742-01-01
    title_zh: 增正骨心法图说歌诀
    rationale: 古有是术而无专门之书自薛已正体类要外当补其遗使学者易考求便诵习
events:
- id: guji-吴谦-event-birth
  title_zh: 出生
  date: 1689
  year_of: 1689
  description_zh: 清康熙年间生于安徽歙县少习儒兼通医学后入太医院
- id: guji-吴谦-event-fengyu
  title_zh: 奉谕修医书
  date: 1739-12-17
  year_of: 1739
  description_zh: 乾隆四年十一月十七日与王炳等奉上谕修医书以正医学遂条奏先订张机伤寒金匮请发大内医书集天下秘书纂修
- id: guji-吴谦-event-kaiguan
  title_zh: 太医院开馆充总修官
  date: 1740-03-01
  year_of: 1740
  description_zh: 乾隆五年二月和亲王议定即于太医院开馆以吴谦刘裕铎为总修兼纂修选医员文理分修协作
- id: guji-吴谦-event-dingzhu
  title_zh: 删订伤寒金匮方论
  date: 1741-06-01
  year_of: 1741
  description_zh: 总裁馆事订正伤寒论注十七卷金匮要略注八卷删补名医方论八卷辨脉运气以正证治轨范
- id: guji-吴谦-event-gaocheng
  title_zh: 九十卷告成进呈
  date: 1742-12-15
  year_of: 1742
  description_zh: 乾隆七年十二月十五日全书告成奉表恭进钦定嘉名医宗金鉴分十一科凡九十卷颁行天下
- id: guji-吴谦-event-death
  title_zh: 逝世
  date: 1748
  year_of: 1748
  description_zh: 书成之后仍供奉内廷以总修功加级纪录卒于乾隆中叶其书悬之九市宝之千秋
