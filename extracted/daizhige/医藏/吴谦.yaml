  decisions:
  - date: 1740
    title_zh: 合伤寒金匮为一书
    rationale: 林亿分二殊失先贤之意，故复其旧使后学知伤寒杂证原非有二
  - date: 1741
    title_zh: 立简易明显为注例
    rationale: 不事华辞支离，惟发挥经旨旁参互证，以启发后学足裨实用
