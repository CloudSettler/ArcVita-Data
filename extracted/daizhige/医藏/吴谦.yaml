  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%AE%A2%E6%AD%A3%E4%BB%B2%E6%99%AF%E5%85%A8%E4%B9%A6%E4%BC%A4%E5%AF%92%E8%AE%BA%E6%B3%A8.html
endeavors:
- id: guji-吴谦-endeavor-1
  title_zh: 奉敕纂修医宗金鉴
  description: 任太医院判奉乾隆敕主持编纂医宗金鉴九十卷，统摄伤寒金匮儿科外科诸门，颁行天下以为医门法程
  phases:
  - key: brewing
    name: 供奉太医院积验
    labels:
      zh: 太医院历练
    start_date: 1725
    highlight_event_id: guji-吴谦-event-taiyiyuan
  - key: breakthrough
    name: 开馆纂修定体例
    labels:
      zh: 开馆定例
    start_date: 1739
    highlight_event_id: guji-吴谦-event-jinjian-start
  - key: climax
    name: 金鉴告成颁行天下
    labels:
      zh: 金鉴告成
    start_date: 1742
    highlight_event_id: guji-吴谦-event-jinjian-done
  - key: closure
    name: 训迪后学广为流布
    labels:
      zh: 垂训后学
    start_date: 1743
    highlight_event_id: guji-吴谦-event-jinjian-done
  decisions:
  - date: 1739
    title_zh: 以仲景全书为准参校众本
    rationale: 旧本字有增减节有分合正误不一，须立善本为准参众家以昭画一
  - date: 1742
    title_zh: 别立正误存疑附卷末备考
    rationale: 全节文义不符难强解者另汇正误存疑，既不牵强注经又不没可采之句
- id: guji-吴谦-endeavor-2
  title_zh: 订正伤寒论注阐发经旨
  description: 复林亿分二书为一书，首六经次合病并病次坏病温病诸篇，注文简易明显，每方详君臣佐使煎服之宜，为群方之冠立通治百病之法
  phases:
  - key: brewing
    name: 博集伤寒注家精粹
    labels:
      zh: 博采注家
    start_date: 1739
    highlight_event_id: guji-吴谦-event-jinjian-start
  - key: breakthrough
    name: 分经列证出方立法
    labels:
      zh: 分经立法
    start_date: 1740
    highlight_event_id: guji-吴谦-event-shanghan-zhu
  - key: climax
    name: 桂枝麻黄青龙发明纲领
    labels:
      zh: 发明纲领
    start_date: 1742
    highlight_event_id: guji-吴谦-event-shanghan-zhu
  - key: closure
    name: 方解集解详煎服助药力法
    labels:
      zh: 方解垂法
    start_date: 1743
    highlight_event_id: guji-吴谦-event-jinjian-done
  decisions:
  - date: 1740
    title_zh: 仍方有执条辨而变通先后次序
    rationale: 千载遗书位置无常难以为法，不拘泥前人惟在启发后学融会贯通
  - date: 1742
    title_zh: 每方必解立方主治与服法
    rationale: 上古有法无方自仲景始有法有方，水火煎渍服之频顿各有适病之宜，前人置而不论者必备录详解
events:
- id: guji-吴谦-event-birth
  title_zh: 生于安徽歙县
  date: 1689
  year_of: 1689
  event_type: birth
  description: 吴谦生于歙县，字六吉，少习岐黄，后供奉京师
- id: guji-吴谦-event-taiyiyuan
  title_zh: 供奉太医院擢院判
  date: 1735
  year_of: 1735
  event_type: career
  description: 雍正乾隆之际供奉太医院，以医术精勤擢太医院判，总理院务
- id: guji-吴谦-event-jinjian-start
  title_zh: 奉敕开馆纂修医宗金鉴
  date: 1739
  year_of: 1739
  event_type: career
  description: 奉乾隆敕与刘裕铎等会同纂修，定凡例九条，以仲景全书为准，分经列门，博采注家
- id: guji-吴谦-event-shanghan-zhu
  title_zh: 订正仲景全书伤寒论注成
  date: 1742
  year_of: 1742
  event_type: career
  description: 伤寒论注卷一至卷末告成，首揭太阳提纲，发明桂枝汤解肌调和营卫为群方之冠，辨脉论愈，别正误存疑
- id: guji-吴谦-event-jinjian-done
  title_zh: 医宗金鉴告成颁行天下
  date: 1742
  year_of: 1742
  event_type: career
  description: 医宗金鉴九十卷成，乾隆御制序文颁行，订正仲景全书通行海内，启万世法程
- id: guji-吴谦-event-death
  title_zh: 卒于京师
  date: 1784
  year_of: 1784
  event_type: death
  description: 晚年训迪后学，医著广布，卒于乾隆四十九年左右
