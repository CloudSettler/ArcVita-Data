  reign_ref: 乾隆
  archetype: 御医纂修者
  dilemmas:
  - 遵古经文与变通次第之间如何启发后学
  - 博采百家注释与删繁就简之间如何裨益实用
  - 正误改补与存疑备考之间如何不没人善
  lesson: 博集众注采其精粹，正其错讹补其阙漏，以简易明显阐发微言，足裨实用
  summary_first_person: 吾吴谦，歙县人，供奉太医院，奉敕纂修医宗金鉴，复合伤寒金匮为仲景全书，以仲景全书为准参校众本，仍方有执条辨而变通次第，首经文次注释次集注次方药，于错简遗误详辨于本条之下，难解者别汇正误存疑二帙，务使大法微言昭于万世
  source_urls:
