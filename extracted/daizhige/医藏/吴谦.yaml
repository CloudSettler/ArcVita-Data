endeavors:
- id: guji-吴谦-endeavor-1
  title_zh: 奉敕编纂医宗金鉴幼科
  description: 考稽种痘源流，纂辑幼科种痘心法要旨，使良法有考不致湮没。
  phases:
  - key: brewing
    name: 考源立纲
    labels:
      zh: 筹备考稽
    start_date: 1739
    highlight_event_id: guji-吴谦-event-jinjian-start
  - key: breakthrough
    name: 审定种痘要旨
    labels:
      zh: 审度精详
    start_date: 1741
    highlight_event_id: guji-吴谦-event-zhongdou
  - key: climax
    name: 纂成幼科种痘篇
    labels:
      zh: 成书
    start_date: 1742
    highlight_event_id: guji-吴谦-event-zhongdou
  - key: closure
    name: 垂法津梁
    labels:
      zh: 刊布
    start_date: 1742
    highlight_event_id: guji-吴谦-event-zhongdou
  decisions:
  - date: 1739
    title_zh: 以种痘专列幼科心法
    rationale: 正痘险逆难测，种痘施于未病可去险履平，故当专篇考稽以存至理。
  - date: 1742
    title_zh: 细加研究纂辑成书
    rationale: 种痘多口传心授方书未载，恐相沿无考使神功湮没，故永垂千古为津梁。
- id: guji-吴谦-endeavor-2
  title_zh: 倡导水苗正法辨种痘四法
  description: 较水苗旱苗痘衣痘浆四法，独取水苗和平稳当，详定选苗蓄苗天时调摄禁忌。
  phases:
  - key: brewing
    name: 比较四法优劣
    labels:
      zh: 辨法
    start_date: 1741
    highlight_event_id: guji-吴谦-event-zhongdou
  - key: breakthrough
    name: 确立水苗为上
    labels:
      zh: 立法
    start_date: 1742
    highlight_event_id: guji-吴谦-event-zhongdou
  - key: climax
    name: 详定选蓄天时调摄
    labels:
      zh: 详定
    start_date: 1742
    highlight_event_id: guji-吴谦-event-zhongdou
  - key: closure
    name: 申明补种自出治法
    labels:
      zh: 善后
    start_date: 1742
    highlight_event_id: guji-吴谦-event-zhongdou
  decisions:
  - date: 1742
    title_zh: 独用水苗弃痘衣痘浆
    rationale: 水苗和平渐入百发百中，旱苗迅烈可斟酌施，痘衣多不应验痘浆残忍不仁故断不可从。
  - date: 1742
    title_zh: 严定可种不可种形气
    rationale: 面色神气骨肉脉息充实调顺者可种，青白黧黑五软五硬疳积惊痫及不知调摄者断不可种。
events:
- id: guji-吴谦-event-birth
  date: 1689
  year_of: 1689
  title_zh: 出生
  description: 康熙年间生于安徽歙县，少习岐黄，后入太医院。
- id: guji-吴谦-event-jinjian-start
  date: 1739
  year_of: 1739
  title_zh: 奉命纂修医宗金鉴
  description: 乾隆初奉敕为太医院判，总修医宗金鉴，考稽幼科诸法，始及种痘源流。
- id: guji-吴谦-event-zhongdou
  date: 1742
  year_of: 1742
  title_zh: 纂成幼科种痘心法要旨
  description: 审定水苗种法为上，详列选苗蓄苗天时择吉调摄禁忌五脏传送及补种自出，列于医宗金鉴幼科。
- id: guji-吴谦-event-death
  date: 1770
  year_of: 1770
  title_zh: 逝世
  description: 乾隆年间卒，遗书以种痘津梁垂后，咸登赤子于寿域。
