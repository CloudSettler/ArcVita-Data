  decisions:
  - date: 1730
    title_zh: 明桂枝为群方之冠
    rationale: 解肌发汗调和荣卫，见一二证即是，不必悉具，可通治百病
  - date: 1741
    title_zh: 删去皮二字存桂枝全功
    rationale: 桂枝气味辛甘全在皮，去皮则如枯木无解肌发汗之功
