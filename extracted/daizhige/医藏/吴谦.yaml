endeavors:
- id: guji-吴谦-endeavor-1
  title_zh: 奉诏总修医宗金鉴
  summary_zh: 任太医院判，总理编局，统筹体例，分科纂修，成九十卷进呈颁行
  phases:
  - key: brewing
    name: 奉诏开馆立纲
    labels:
      zh:
      - 筹备立馆
    start_date: 1739
    highlight_event_id: guji-吴谦-event-kaiguan
  - key: climax
    name: 全书告成颁行
    labels:
      zh:
      - 编纂告成
    start_date: 1742
    highlight_event_id: guji-吴谦-event-jinjian
  decisions:
  - date: 1739
    title_zh: 定删繁就简体例
    rationale: 医经浩繁，初学难入，故以歌诀总纲加注疏方药，令便于诵习临证
  - date: 1741
    title_zh: 分科专人校订
    rationale: 诸科病证方药各异，须分门纂修互相参校，方能义例一贯少有舛误
- id: guji-吴谦-endeavor-2
  title_zh: 厘定眼科心法要诀
  summary_zh: 明目睛原始，立五轮八廓，辨内障外障，定五风诸翳歌注方治
  phases:
  - key: brewing
    name: 搜辑眼科旧说
    labels:
      zh:
      - 搜辑整理
    start_date: 1740
    highlight_event_id: guji-吴谦-event-taiyi
  - key: breakthrough
    name: 厘清轮廓分属
    labels:
      zh:
      - 立论创新
    start_date: 1741
    highlight_event_id: guji-吴谦-event-yanke
  - key: climax
    name: 眼科要诀成篇
    labels:
      zh:
      - 著述成书
    start_date: 1742
    highlight_event_id: guji-吴谦-event-yanke
  decisions:
  - date: 1741
    title_zh: 改定轮脏廓腑
    rationale: 旧以五轮八廓混属脏腑无所适从，故定五轮主脏配五行，八廓主腑配八卦，使部位病机了然
  - date: 1741
    title_zh: 以歌括统方治
    rationale: 眼证名目繁多虚实相兼，故以内外因立论，以歌诀统证候方药，使学人易记易用
events:
- id: guji-吴谦-event-birth
  date: 1689
  year_of: 1689
  title_zh: 出生
  description_zh: 清康熙二十八年生于安徽歙县，少习儒兼通医学
- id: guji-吴谦-event-taiyi
  date: 1736
  year_of: 1736
  title_zh: 供奉太医院
  description_zh: 以医术精良供奉内廷，擢太医院右院判，总理医事阅历眼目诸疾
- id: guji-吴谦-event-kaiguan
  date: 1739
  year_of: 1739
  title_zh: 奉诏开馆修书
  description_zh: 乾隆四年奉诏设医宗金鉴馆，命为总修官，统筹规划全书体例分工
- id: guji-吴谦-event-yanke
  date: 1741
  year_of: 1741
  title_zh: 厘定眼科纲目
  description_zh: 审定目睛原始五轮八廓诸歌，辨内障五风圆冰滑涩等二十四证，注方治以成眼科心法要诀
- id: guji-吴谦-event-jinjian
  date: 1742
  year_of: 1742
  title_zh: 医宗金鉴告成
  description_zh: 乾隆七年九十卷告成进呈，得旨颁行，医学正宗由此大明，眼科卷列其中
- id: guji-吴谦-event-death
  date: 1748
  year_of: 1748
  title_zh: 逝世
  description_zh: 清乾隆十三年卒，遗书医宗金鉴行于世，眼科心法要诀为后世眼科圭臬
