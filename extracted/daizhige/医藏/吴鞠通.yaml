  - title_zh: 醫為仁術與醫為市利
    description: 不讀古書不察時變苟以醫為市戕賊生命，當以認證無差為階梯普濟時疫以全仁心
  lesson: 認證無差，多讀古書善察時變，辛涼護陰隨其所在而逐邪，方為醫門階梯
  summary_first_person: 吾淮陰吳瑭字鞠通，少罹父喪究心醫學，感時疫誤治橫夭，輯溫病條辨以承吳又可而啟後學，復以平生驗案釐為五卷，惟願認證無差不愆湯齊以全民生
