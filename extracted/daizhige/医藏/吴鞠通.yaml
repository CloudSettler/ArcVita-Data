endeavors:
- id: guji-吴鞠通-endeavor-1
  title_zh: 弃举从医遍考古今温病
  summary: 因父病不知医而发愤，历侄死之痛，游京检校四库，专学吴又可而遍考晋唐诸贤，十载进退与病谋心谋
  phases:
  - key: brewing
    name: 父丧伏读弃举学医
    labels:
      zh: 立志学医
    start_date: 1776
    highlight_event_id: guji-吴鞠通-event-father
  - key: breakthrough
    name: 侄死温病未得要领
    labels:
      zh: 初见温病之难
    start_date: 1780
    highlight_event_id: guji-吴鞠通-event-nephew
  - key: climax
    name: 京师检校得见温疫论
    labels:
      zh: 得法又可
    start_date: 1784
    highlight_event_id: guji-吴鞠通-event-beijing
  - key: closure
    name: 十年谋心不敢轻治
    labels:
      zh: 十载有得
    start_date: 1790
    highlight_event_id: guji-吴鞠通-event-guichou
  decisions:
  - date: 1776
    title_zh: 弃举子业专事方术
    rationale: 父病不知医愧恨难名，读长沙外逐荣势内忘身命之论而慨然改业
  - date: 1784
    title_zh: 专心学步温疫论兼考诸贤
    rationale: 见又可用心良苦而学术未精，晋唐诸贤珠璧而无美备，故进与病谋退与心谋
- id: guji-吴鞠通-endeavor-2
  title_zh: 癸丑治疫纂述条辨
  summary: 癸丑都下温疫大行而强起治坏病，存活数十人，遂采辑历代精微间附己意考验，汪瑟庵促成而戊午成书
  phases:
  - key: brewing
    name: 癸丑强起治温疫坏病
    labels:
      zh: 初试身手
    start_date: 1793
    highlight_event_id: guji-吴鞠通-event-guichou
  - key: breakthrough
    name: 有志采辑去驳取精
    labels:
      zh: 立志著述
    start_date: 1794
    highlight_event_id: guji-吴鞠通-event-guichou
  - key: climax
    name: 汪瑟庵促速成书济世
    labels:
      zh: 逢时促成
    start_date: 1798
    highlight_event_id: guji-吴鞠通-event-book
  - key: closure
    name: 戊午黾勉成章就正海内
    labels:
      zh: 条辨告成
    start_date: 1798
    highlight_event_id: guji-吴鞠通-event-book
  decisions:
  - date: 1793
    title_zh: 强起治疫救治坏病
    rationale: 诸友强起，都下已成坏病者多，幸存活数十人而见世俗杀人之害
  - date: 1798
    title_zh: 黾勉成书温病条辨
    rationale: 己未湿土温厉大行在即，不出则得失不见，出而就正海内或有益民生
events:
- id: guji-吴鞠通-event-birth
  date: 1758
  year_of: 1758
  title_zh: 生于江苏淮阴
  description: 乾隆二十三年生，名瑭，字鞠通
- id: guji-吴鞠通-event-father
  date: 1776
  year_of: 1776
  title_zh: 父病逝弃举从医
  description: 十九岁父病年余不起，伏读方书，弃举子业专事方术
- id: guji-吴鞠通-event-nephew
  date: 1780
  year_of: 1780
  title_zh: 犹子巧官病温发黄而死
  description: 初起喉痹误治，遍延时医不越双解败毒，温病治法茫然未闻
- id: guji-吴鞠通-event-beijing
  date: 1784
  year_of: 1784
  title_zh: 游京师检校四库得温疫论
  description: 来游京师检校四库全书，得吴又可温疫论，专心学步兼考晋唐诸贤
- id: guji-吴鞠通-event-guichou
  date: 1793
  year_of: 1793
  title_zh: 癸丑都下温疫治活数十人
  description: 都下温疫大行，诸友强起治坏病，幸存活数十人而叹死于医者无数
- id: guji-吴鞠通-event-book
  date: 1798
  year_of: 1798
  title_zh: 戊午成书温病条辨
  description: 汪瑟庵促速成书，采辑历代精微间附己意考验，黾勉成章就正海内
- id: guji-吴鞠通-event-death
  date: 1836
  year_of: 1836
  title_zh: 卒于道光十六年
  description: 温病三焦辨证传于后世，条辨为温病学宗
