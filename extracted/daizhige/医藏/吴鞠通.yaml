  birth_date: 1758
  death_date: 1836
  era: 清
  reign_ref: 乾隆至道光
  archetype: 温病学家
  dilemmas:
  - 生民不死于病而死于医，学医不精不如不学，是否敢轻易落笔传世
  - 以救人之心成书，恐获欺人之罪，转相仿效至于无穷，罪何自赎
  lesson: 精研古训去驳杂取精微，以三焦辨证守实阴补不足，留得一分正气便有一分生机
  summary_first_person: 我十九岁丧父，愧恨不知医，遂弃举业而专方术，十阅春秋而后有得，癸丑治疫存活数十人，遂采辑群贤间附己意，历六载而成温病条辨，愿就正海内以利民生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E6%B8%A9%E7%97%85%E6%9D%A1%E8%BE%A8.md
