endeavors:
- id: guji-周之千-endeavor-1
  title_zh: 阐发慎斋左右气血脉法大纲
  summary_zh: 明左血中之气右气中之血，定寸关尺心肝肾肺脾命之位
  phases:
  - key: brewing
    name: 习经研脉
    labels:
      zh: 左血右气
    start_date: '1620-01-01'
    highlight_event_id: guji-周之千-event-1
  - key: breakthrough
    name: 悟得气血周流相通
    labels:
      zh: 血气互根
    start_date: '1640-01-01'
    highlight_event_id: guji-周之千-event-1
  decisions:
  - date: '1640-01-01'
    title_zh: 首明左脉血中之气右脉气中之血
    rationale: 部位虽分列而气血未尝不相通，以解左属血反主外右属气反主内之疑
- id: guji-周之千-endeavor-2
  title_zh: 著医家秘奥脉法解以立补泻活法
  summary_zh: 辨旺微浮沉洪豁之虚实，立法用六味八味补中凉膈升阳诸方
  phases:
  - key: climax
    name: 笔削成编
    labels:
      zh: 旺虚补泻
    start_date: '1650-01-01'
    highlight_event_id: guji-周之千-event-2
  - key: closure
    name: 羽翼经文传世
    labels:
      zh: 针砭愚俗
    start_date: '1660-01-01'
    highlight_event_id: guji-周之千-event-2
  decisions:
  - date: '1650-01-01'
    title_zh: 旺脉反用滋阴补水不妄用苦寒降火
    rationale: 旺为中空无水焰火浮越，盏中添油则火自敛，降多必亡阴
  - date: '1660-01-01'
    title_zh: 微细虚脉一意用补用暖用引火归源
    rationale: 微为亡阳细为亡阴，尺微细则水火两虚非桂附不能奠厥攸居
