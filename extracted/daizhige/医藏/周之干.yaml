  decisions:
  - date: 1640-01-01
    title_zh: 独宗仲景不徇四家一体之偏
    rationale: 东垣温补河间清热丹溪滋阴戴人攻伐各得一体非轩歧正派故直求轩歧仲景精髓
  - date: 1650-01-01
    title_zh: 以扶阳纳气为要而兼顾真阴
    rationale: 阳能生阴一分阳气不到便生病然单事阳恶阴抑阴则非理故扶阳必顾阴扶阴以济阳
