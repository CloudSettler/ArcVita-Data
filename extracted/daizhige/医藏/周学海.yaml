  birth_date: '1856'
  death_date: '1906'
  era: 清末
  reign_ref: 光绪戊戌
  archetype: 会通经论的临床医者
  dilemmas:
  - 管蠡之见不敢妄测众病繁治，读书临诊所得当记不当记
  - 亲尝未遍不敢臆说药论，先治脉次治药的次第当如何坚守
  - 陈陈相因缺略琐碎的随笔，示人贻讥与藏拙备忘之间当如何抉择
  lesson: 温故以求新，备遗忘以待改，示燕石于人而求善悟能改
  summary_first_person: 吾建德周学海，字澄之，读书临诊之际随听见而记之，意在温故求新，不敢以一身尽历天下病变，粗为分类付之手民，虽蹇涩繁沓前后互见，亦愿效宋人悟燕石非宝、朱奉议得友指摘而改作，示人求正而已
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/读医随笔.md
  - https://daizhige.org/医藏/读医随笔.html
