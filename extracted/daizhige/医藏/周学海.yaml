  dilemmas:
  - 脉象万变而纸上之象难合指下之象临诊当以何为据
  - 卷帙浩繁而初学难贯当如何撮要以示简便
  lesson: 临诊当先辨位数形势再参微甚兼独会通主客方能不为假脉所惑
  summary_first_person: 余建德周学海也，幼承家学，博采百家而参以己说，先著脉义简摩等四书凡十二卷，后虑卷帙繁而脉络难贯，故撮其要简之又简，别为重订诊家直诀，愿后学由简入繁得脉之真机
