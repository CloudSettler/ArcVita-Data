    rationale: 三指总按缝隙难见接续真迹故创移指直压诸法以显寸关尺真象
  - date: 1895-01-01
    title_zh: 撮要为重订诊家直诀
    rationale: 专取一种则苦弗完兼习四种则难贯故撮其要简之又简以便后学
