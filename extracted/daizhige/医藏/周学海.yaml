    start_date: 1898-04
    highlight_event_id: guji-周学海-event-suibi-xu
  decisions:
  - date: '1890'
    title_zh: 先刻脉书缓著药书
    rationale: 亲尝未遍不敢臆说，守先治脉次治药之序，以诚阙疑
  - date: '1892'
    title_zh: 简摩明义直诀明法并行
    rationale: 脉理精微诊法实用并重，约以枕秘广以宏编之辅，利初学临诊
- id: guji-周学海-endeavor-2
  title_zh: 读医随笔撰述阐发证治
  summary_zh: 于读书临诊之际随记证治总论，以气血精神十二大纲统摄病变，分类付梓以备遗忘求正
  phases:
  - key: brewing
    name: 读书临诊随听随记
