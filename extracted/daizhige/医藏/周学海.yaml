    highlight_event_id: guji-周学海-event-qixue
  - key: breakthrough
    name: 立三气四精五神大纲
    labels:
      zh: 气血精神论总纲既立
    start_date: '1897'
    highlight_event_id: guji-周学海-event-qixue
  - key: climax
    name: 邵伯埭舟中自序付梓
    labels:
      zh: 戊戌暮春分类付手民
    start_date: 1898-04
    highlight_event_id: guji-周学海-event-suibi-xu
  - key: closure
    name: 示人求正期于能改
    labels:
      zh: 怀石示人不惮贻讥
    start_date: 1898-05
    highlight_event_id: guji-周学海-event-suibi-xu
  decisions:
  - date: 1898-04
    title_zh: 凌躐琐碎亦付手民
    rationale: 慕宋人悟燕石非宝之善悟，勉为朱奉议得指摘而改作之能改，非自炫亦非秘拙
  - date: '1898'
    title_zh: 以营卫为宰统摄十二
    rationale: 三气各有其本各行其道，四精各有功用，五神各有所主，必以营卫宰之则体不相离用不相胜
