  decisions:
  - date: 1885-01-01
    title_zh: 以位数形势立脉之四科
    rationale: 旧说浮沉迟数分纲义浅不备故合灵枢缓急大小滑濇与位数形势以赅百脉
  - date: 1892-01-01
    title_zh: 著脉义简摩等四种相承
    rationale: 卷帙虽繁而义实相承欲使脉络可贯故分四种备载指法象理
