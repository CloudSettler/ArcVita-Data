    start_date: '1890'
    highlight_event_id: guji-周学海-event-maixue
  - key: climax
    name: 脉书刊刻传诵同志
    labels:
      zh: 脉书刊刻同志传诵
    start_date: '1892'
    highlight_event_id: guji-周学海-event-maixue
