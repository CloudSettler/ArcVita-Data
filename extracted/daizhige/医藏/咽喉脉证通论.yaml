  title_zh: 咽喉脉证总论与十八证辨治
  summary: 以脉参证分有余不足立下气消痰清火凉血之序统领三十六法为十八证
  phases:
  - key: brewing
    name: 察脉辨虚实之酝酿
    labels:
      zh: 望闻问参脉
    start_date: 1760-01-01
    highlight_event_id: guji-咽喉脉证通论-event-1
  - key: breakthrough
    name: 总论立纲之突破
    labels:
      zh: 洪大实与浮软涩
    start_date: 1762-01-01
    highlight_event_id: guji-咽喉脉证通论-event-1
  - key: climax
    name: 十八证分论之极盛
    labels:
      zh: 锁喉乳蛾缠喉等
    start_date: 1765-01-01
    highlight_event_id: guji-咽喉脉证通论-event-2
  - key: closure
    name: 脉不与焉变通之收束
    labels:
      zh: 纯阴阳脉以病治病
    start_date: 1768-01-01
    highlight_event_id: guji-咽喉脉证通论-event-2
  decisions:
  - date: 1762-06-01
    title_zh: 先下气消痰次清火凉血
    rationale: 不分先后混乱用药贻害匪浅故定先后之序以防壅塞
  - date: 1765-08-01
    title_zh: 单蛾双蛾八九日后方针刺
    rationale: 未满十日毒气炽盛刺之出血反增破伤之重故戒妄刺
- id: guji-咽喉脉证通论-endeavor-2
  person_id: guji-咽喉脉证通论
  title_zh: 丸散吹噙方药创制与用药禁戒
  summary: 制牛黄解毒丸红内消散保命丹胆冰消毒散冰硼散玉屑散并申甘桔等五味之禁
  phases:
  - key: brewing
    name: 集吹噙丸散之酝酿
    labels:
      zh: 噙化吹掺内服
    start_date: 1766-01-01
    highlight_event_id: guji-咽喉脉证通论-event-2
  - key: breakthrough
    name: 保命红消并用之突破
    labels:
      zh: 煎药和服酒下
    start_date: 1768-01-01
    highlight_event_id: guji-咽喉脉证通论-event-2
  - key: climax
    name: 五味禁戒阐发之极盛
    labels:
      zh: 甘草桔梗升麻半夏老姜
    start_date: 1770-01-01
    highlight_event_id: guji-咽喉脉证通论-event-3
  - key: closure
    name: 老幼胎产变通之收束
    labels:
      zh: 年老小儿胎前产后经期
    start_date: 1772-01-01
    highlight_event_id: guji-咽喉脉证通论-event-3
  decisions:
  - date: 1768-05-01
    title_zh: 甘桔汤非喉证要剂
    rationale: 甘草补火桔梗引痰火上行如抱薪救火故特表禁戒
  - date: 1770-09-01
    title_zh: 疔疮根脚忌用红内消
    rationale: 用之反凶当加地丁草保命丹可服故另立法度
