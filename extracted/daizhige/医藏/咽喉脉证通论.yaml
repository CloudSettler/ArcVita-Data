  name_zh: 咽喉脉证通论
  names:
    zh: 咽喉脉证通论
    en: Yanhou Maizheng Tonglun
  lifespan:
    birth:
      date: 1720-01-01
      precision: year
      is_circa: true
      raw: 清代约生
    death:
      date: 1790-12-31
      precision: year
      is_circa: true
      raw: 清代约卒
  birth_date: 1720-01-01
  death_date: 1790-12-31
  era: 清
  archetype: 喉科医家
  dilemmas:
  - 业喉科者全不讲脉而治之鲜效当立脉证纲领以辨虚实
  - 甘桔升提辛燥之品易引火上壅当明禁戒以降气泄火为要
  lesson: 喉为气机门户须以望闻问参究脉理辨虚实痰火风寒热毒而以降气消痰清火凉血为序
  summary_first_person: 吾观喉科不讲脉故治鲜效乃论洪大实者为有余当散风下气清火消痰论洪大浮软弦缓涩者为不足当凉血生血滋润消痰更列锁喉至喉菌十七门及牛黄解毒丸红内消散保命丹诸方并申甘桔升麻半夏老姜之禁以冀临证有序不致抱薪救火
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%92%BD%E5%96%89%E8%84%89%E8%AF%81%E9%80%9A%E8%AE%BA.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%92%BD%E5%96%89%E8%84%89%E8%AF%81%E9%80%9A%E8%AE%BA.html
endeavors:
