      raw: 清咸丰元年左右
    death:
      date: 1908
      precision: year
      is_circa: true
      raw: 清光绪三十四年左右
  birth_date: 1851
  death_date: 1908
  era: 清末
  reign_ref: 光绪
  archetype: 济世良医
  dilemmas:
  - 先君吐血转下血群方罔效名宿无确见，守调停俟衰之法与穷经探源另悟之间如何抉择
  - 治血十愈七八已获补救之术，私为鸿宝自守与慨然传世救天下后世之间如何取舍
  lesson: 血证当从内难仲景探源，明水火气血脾胃之变，去瘀生新理足方效，方能补救当时垂惠后世
  summary_first_person: 吾因先君体羸善病早岁习方书，癸酉父患吐血转下血遍治罔效，遍览方书复寝馈内经仲景，触类旁通豁然有得，治血十愈七八，又以亲制方愈荆妻冯氏血疾，遂著血证论发明失血精微，唯憾悟道不早未能延父之寿，愿此书救天下后世
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%A1%80%E8%AF%81%E8%AE%BA.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%A1%80%E8%AF%81%E8%AE%BA.html
endeavors:
- id: guji-唐宗海-endeavor-1
  title_zh: 穷究内难仲景以疗血证
  summary: 因父病吐下血不愈发愤遍览方书，弃杨西山失血大法调停之治，专从内难仲景探源，明阴阳水火气血之理，治血多验
  phases:
  - key: brewing
    name: 早岁习方侍亲疾
    labels:
      zh: 侍疾习方
    start_date: 1865
    highlight_event_id: guji-唐宗海-event-birth
  - key: breakthrough
    name: 癸酉父病废然自返
    labels:
      zh: 探源内仲
    start_date: 1873-07
    highlight_event_id: guji-唐宗海-event-father-ill
  - key: climax
    name: 触类旁通治血多愈
    labels:
      zh: 十愈七八
    start_date: 1878
    highlight_event_id: guji-唐宗海-event-wife-cure
  - key: closure
    name: 立治血以脾为主宗旨
    labels:
      zh: 理足方效
    start_date: 1884
    highlight_event_id: guji-唐宗海-event-book
  decisions:
  - date: 1873-07
    title_zh: 弃调停之药专研内经仲景
    rationale: 诸书及乡先辈之法议论方药未能精详鲜效，唯内难仲景可悟言外之旨
  - date: 1880
    title_zh: 立治血必以脾为主兼参西法
    rationale: 水火两藏全赖于脾，中焦取汁变化而赤，滋脾阴开胃进食方能去瘀生新
- id: guji-唐宗海-endeavor-2
  title_zh: 著血证论八卷垂惠后世
  summary: 以心得验实分门别类条分缕析，发明男女气血经精之变及脏腑脉证用药宜忌，于光绪十年成书刊行
  phases:
  - key: brewing
    name: 遍览方书三致意于血证
    labels:
      zh: 遍览蓄疑
    start_date: 1873-07
    highlight_event_id: guji-唐宗海-event-father-ill
  - key: breakthrough
    name: 愈荆妻冯氏血疾自信方效
    labels:
      zh: 亲制获安
    start_date: 1882
    highlight_event_id: guji-唐宗海-event-wife-cure
  - key: climax
    name: 分卷论吐衄便尿经产瘀蓄痨瘵
    labels:
      zh: 条分缕析
    start_date: 1883
    highlight_event_id: guji-唐宗海-event-book
  - key: closure
    name: 光绪甲申重九后自序刊行
    labels:
      zh: 刊行补救
    start_date: 1884-10
    highlight_event_id: guji-唐宗海-event-book
  decisions:
  - date: 1882
    title_zh: 不吝一艺决意著书传世
    rationale: 大丈夫不能立功名于天下，苟有补救当时之术而吝不忍传则陋
  - date: 1884-10
    title_zh: 独从内难仲景发挥不采时贤影响之谈
    rationale: 时贤论血多影响，必伸古人欲言补前贤未备，务求实事实理有凭有验
events:
- id: guji-唐宗海-event-birth
  title_zh: 诞生于四川彭县号容川
  date: 1851
  year_of: 1851
  description: 清咸丰年间生，先君子体羸善病，故早岁即习方书侍疾调治
- id: guji-唐宗海-event-father-ill
  title_zh: 癸酉六月父骤得吐血转下血
  date: 1873-07
  year_of: 1873
  description: 查照各书施治罔效，延请名宿仍无确见，购求杨西山失血大法一览亦鲜成效，遂废然自返寝馈内经仲景
- id: guji-唐宗海-event-wife-cure
  title_zh: 亲制方剂治愈荆妻冯氏血疾
  date: 1882
  year_of: 1882
  description: 先君既逝荆妻又得血疾，以所悟水火气血之法亲制方剂竟获安全，益信理足方效
- id: guji-唐宗海-event-book
  title_zh: 光绪十年甲申重九后成血证论自序
  date: 1884-10-11
  year_of: 1884
  description: 将失血精微奥义一一发明，分八卷论阴阳男女脏腑脉证及诸般血证，成最便世用之书以救天下后世
- id: guji-唐宗海-event-death
  title_zh: 病逝于清末
  date: 1908
  year_of: 1908
  description: 以医名于时，血证论行世，后世奉为治血要籍
