person:
  qid: guji-唐宗海
  name_zh: 唐宗海
  names:
    zh: 唐宗海
    en: Tang Zonghai
  lifespan:
    birth:
      date: '1851'
      precision: year
      is_circa: false
      raw: 清咸丰元年
    death:
      date: '1908'
      precision: year
      is_circa: false
      raw: 清光绪三十四年
  birth_date: '1851'
  death_date: '1908'
  era: 清末
  reign_ref: 光绪
  archetype: 经方复兴者
  dilemmas:
  - 尊古与信今之争，世人信刘张朱李及温补诸家而疑仲景，骤夺所好，世所惊疑
  - 救危与避谤之难，杂法误人已深，欲以四逆白通回阳承气白虎存阴，须明言壁资乃敢施治
  - 专一与驳杂之辨，坊刻臆说朱紫相乱，入门稍参终成乡愿，去杂守约人所畏避
  lesson: 存津液以和营卫，调甘药以归胃气，经方神速有利无害，温故知新，专一不杂，推诚相与
  summary_first_person: 吾乃四川彭县唐宗海，字容川，临证三十余年，深悯病人困于药甚于桎梏，悟仲景一百一十三方以存津液为主，金匮一百四十三方以调以甘药为旨，桂枝柴胡皆神农上品，久服却病延年，时医芎苏羌独苦燥辛烈最伤阴气，补中归脾笼统浮泛待病自愈，吾故折算古今权衡，浅释经方，作劝读十则，愿同人知过必改，愈达愈上，共昌此道
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8A%9D%E8%AF%BB%E5%8D%81%E5%88%99.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8A%9D%E8%AF%BB%E5%8D%81%E5%88%99.html
endeavors:
- id: guji-唐宗海-endeavor-1
  title_zh: 尊仲景阐经方，注疏劝学明门径
  description_zh: 明药性始于神农本经，论病情始于灵素，以药治病始于伊尹汤液，至仲景集经方大成，著伤寒论金匮要略，考订本草剂量，作劝读十则以正时弊
  phases:
  - key: brewing
    name: 幼承儒医博览本经内经
    labels:
      zh: 积学
    start_date: '1865'
    highlight_event_id: guji-唐宗海-event-birth
  - key: breakthrough
    name: 悟存津液调甘药之大旨
    labels:
      zh: 顿悟
    start_date: '1884'
    highlight_event_id: guji-唐宗海-event-xuezheng
  - key: climax
    name: 注伤寒金匮折算权衡浅释
    labels:
      zh: 著述
    start_date: '1890'
    highlight_event_id: guji-唐宗海-event-quandu
  - key: closure
    name: 劝读十则成篇垂训后学
    labels:
      zh: 垂训
    start_date: '1892'
    highlight_event_id: guji-唐宗海-event-quandu
  decisions:
  - date: '1884'
    title_zh: 以读仲师书为第一劝
    rationale: 方如举业家四子书，神农灵素伊尹之传至仲景而备，不读则根由不明，浮泛误人
  - date: '1890'
    title_zh: 折算古今升斗浅释剂量
    rationale: 古衡仅今十之三，每剂分三服不过七八钱，较时方更轻，破畏大剂不敢试之疑，示道本中庸人皆可知能
  - date: '1892'
    title_zh: 以专一不杂和气可亲为劝
    rationale: 攻李东垣燥烈劫阴及李时珍薛立斋张景岳浮浅之失，又戒言激生谤，推诚相与使颖慧者悔而就学
- id: guji-唐宗海-endeavor-2
  title_zh: 临证三十年回阳存阴救危亡
  description_zh: 不用芎苏羌独二陈耗液涸汗之法，不靠人参，以桂枝汤小柴胡汤和营卫转枢机，以四逆白通承气白虎救阴阳之危，日间立方晚间以经方查对温故知新
  phases:
  - key: brewing
    name: 见闽中习气误人留邪生热
    labels:
      zh: 见弊
    start_date: '1875'
    highlight_event_id: guji-唐宗海-event-xuezheng
  - key: breakthrough
    name: 用桂枝汤万试万效柴胡取效
    labels:
      zh: 取验
    start_date: '1888'
    highlight_event_id: guji-唐宗海-event-quandu
  - key: climax
    name: 起死回生夺造化救十之二三
    labels:
      zh: 救危
    start_date: '1900'
    highlight_event_id: guji-唐宗海-event-clinic
  - key: closure
    name: 夜查经方神悟运针归胃气
    labels:
      zh: 化境
    start_date: '1905'
    highlight_event_id: guji-唐宗海-event-clinic
  decisions:
  - date: '1888'
    title_zh: 迸去先入为主重用桂枝柴胡
    rationale: 惑于春夏忌桂误用柴胡引入少阳及鳖血拌蒸不过二钱之说，实则二药列神农上品，长沙方柴胡用至八两，性醇可多服重用
  - date: '1900'
    title_zh: 医家束手则壁资施救不受谢
    rationale: 察为杂法所误，先说明壁其方资，照仲师法助枢运转针调和藏腑统归胃气，方能拯救危机不贪天功
events:
- id: guji-唐宗海-event-birth
  title_zh: 生于四川彭县
  date: '1851'
  year_of: 1851
  description_zh: 清咸丰元年生于四川彭县，字容川，幼承儒学，博览本草内经，志在经方
- id: guji-唐宗海-event-xuezheng
  title_zh: 血证论成书明经方之理
  date: '1884'
  year_of: 1884
  description_zh: 光绪十年左右成血证论，发明存津液调甘药之旨，辨薛立斋服三十余剂李士材备参五斤期三月之非，乃病衰自愈非药效
- id: guji-唐宗海-event-quandu
  title_zh: 撰成劝读十则
  date: '1892'
  year_of: 1892
  description_zh: 历陈十劝，自读仲师书知过必改疗效神速有利无害，至道本中庸去恶习，温故知新专一不杂和气可亲，力辟温补驳杂
- id: guji-唐宗海-event-clinic
  title_zh: 临证三十余年以经方救危
  date: '1900'
  year_of: 1900
  description_zh: 以桂枝汤治营卫不和万无一失，以小柴胡转枢，以四逆白通承气白虎回阳存阴，闽浙用至八九钱柴胡四钱皆效，不靠人参救十之二三
- id: guji-唐宗海-event-death
  title_zh: 逝世
  date: '1908'
  year_of: 1908
  description_zh: 清光绪三十四年卒，一生障川东流，阐扬仲景如儒家尊宣圣，功在后学
