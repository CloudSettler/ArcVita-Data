  dilemmas:
  - 中法艰奥难为初学所用而浅俗验方又源流未澈如何取舍
  - 西医东渐当拒当融如何不舍近求远不废正道而汇通
  - 久病投剂不中阴阳混乱如何使不知医者临证查对了然
  lesson: 医贵简明求实究源审阴阳别脏腑使初学一见能用以济世
  summary_first_person: 吾唐宗海字容川蜀之彭县人也感病家穷于医又穷于书故著血证论发明气血水火又著中西汇通医书五种及医学见能四卷专为初学与不知医者设见痛苦即查得分经辨证方必录验愿人子人父母各手一编以助生成
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/医学见能.md
  - https://daizhige.org/医学见能.html
