  era: 北宋
  reign_ref: 宋神宗元丰至宋哲宗元祐
  archetype: 本草学家
  dilemmas:
  - 旧本草传写舛误真赝难辨与救人性命不可误投之难
  - 旁摭经史百家博收宏富与去取谨严证类分明的难
  lesson: 以证类明药品真赝，以备急济世活人，博采而谨取方为医家之责也
  summary_first_person: 余蜀中华阳人也，业医济世，见开宝嘉祐图经诸本犹有漏略舛误，遂发愿旁摭经史仙道百家二百四十七家之说，证类药品君臣佐使寒热温凉之性，附以单方验方三千余首，集成备急本草，愿后之合和者得全效，饮饵者无疑也
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%AF%81%E7%B1%BB%E6%9C%AC%E8%8D%89.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%AF%81%E7%B1%BB%E6%9C%AC%E8%8D%89.md
endeavors:
- id: guji-唐慎微-endeavor-1
  title_zh: 编撰经史证类备急本草
  summary: 因嘉祐补注图经之漏略，博采经史方书证类药品，初成三十二卷备急本草
  phases:
  - key: brewing
    name: 博览旧本见漏略
    labels:
      zh: 酝酿
    start_date: 1070
    highlight_event_id: guji-唐慎微-event-start
  - key: breakthrough
    name: 立证类之法旁摭经史
    labels:
      zh: 突破
    start_date: 1076
    highlight_event_id: guji-唐慎微-event-start
  - key: climax
    name: 元丰五年初成全书
    labels:
      zh: 高潮
    start_date: 1082
    highlight_event_id: guji-唐慎微-event-complete
  - key: closure
    name: 大观政和刊行天下
    labels:
      zh: 收束
    start_date: 1108
    highlight_event_id: guji-唐慎微-event-publish
  decisions:
  - date: 1076
    title_zh: 不作新经而作证类
    rationale: 以开宝重定为正本，附经史方书为证，使真赝得辨而不没旧文也
  - date: 1082
    title_zh: 药方并载以备急用
    rationale: 审证制方因方见药，收载古今经效之方三千余首，使览者可以洞达而即用也
- id: guji-唐慎微-endeavor-2
  title_zh: 行医蜀中搜集验方济世
  summary: 业医成都华阳，采市贾山野所用效验，参以太医众论，补旧经所未备
  phases:
  - key: brewing
    name: 行医见市药真滥
    labels:
      zh: 酝酿
    start_date: 1072
    highlight_event_id: guji-唐慎微-event-start
  - key: breakthrough
    name: 以身验药辨产地时月
    labels:
      zh: 突破
    start_date: 1078
    highlight_event_id: guji-唐慎微-event-complete
  - key: climax
    name: 新补新定增条百数
    labels:
      zh: 高潮
    start_date: 1082
    highlight_event_id: guji-唐慎微-event-complete
  - key: closure
    name: 遗书付后学刊正流传
    labels:
      zh: 收束
    start_date: 1093
    highlight_event_id: guji-唐慎微-event-revise
  decisions:
  - date: 1078
    title_zh: 兼收俗称异名以易识
    rationale: 如蚤休曰紫河车假苏曰荆芥之类，注目录各条之下，使读者指掌斯见而不误用也
  - date: 1082
    title_zh: 疑者阙之以俟来哲
    rationale: 无所辨证者不敢以臆说附会，但阙不录，务求审慎而保全民生也
events:
- id: guji-唐慎微-event-birth
  title_zh: 生于蜀中成都华阳
  date: 1056
  year_of: 1056
  place_zh: 成都华阳
  description: 约北宋嘉祐元年，生于蜀中，以医术称于世
- id: guji-唐慎微-event-start
  title_zh: 开始博采群书编撰本草
  date: 1076
  year_of: 1076
  place_zh: 成都
  description: 因嘉祐补注本草行久漏略，取证类为模，旁摭经史二百四十七家，参以唐蜀诸本及医家效方，博采编撰
- id: guji-唐慎微-event-complete
  title_zh: 初成经史证类备急本草
  date: 1082
  year_of: 1082
  place_zh: 成都
  description: 元丰五年，集成经史证类备急本草三十二卷，凡千七百余种，附方三千余首，义明理博
- id: guji-唐慎微-event-death
  title_zh: 卒于元祐八年
  date: 1093
  year_of: 1093
  place_zh: 成都
  description: 北宋元祐八年卒，遗书未刊，藏于家塾，后学传习
- id: guji-唐慎微-event-publish
  title_zh: 大观初刊证类本草行世
  date: 1108
  year_of: 1108
  place_zh: 开封
  description: 大观二年，朝廷取其书刊梓，补以寇氏衍义，行于中州，养老慈幼之家家置一本
- id: guji-唐慎微-event-revise
  title_zh: 政和新修证类备用本草成书
  date: 1116
  year_of: 1116
  place_zh: 开封
  description: 政和六年，曹孝忠奉敕校正润色，删繁缉紊，正字画援引之误数千，成六十余万言，赐名政和新修经史证类备用本草
