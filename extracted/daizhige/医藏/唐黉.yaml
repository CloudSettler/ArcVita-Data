  dilemmas:
  - 素本不知医，乡僻施治恐误人性命，若坐视不救又失活人之心
  - 金鉴心法高深初学难入门，若辑众书简要又恐失其精义
  lesson: 愿作阶梯以近初学，先得入门而后升堂入室，既具活人之心亦得养生之半
  summary_first_person: 余昆山芹洲唐黉，素不知医，每于乡僻处敬遵御纂医宗金鉴施治，尤以外科心法为附应，已录要付梓，又恐初学未易入门，故于乾隆丙申秋辑外科正宗外科大成疡医准绳之简要易明者汇为二卷，名曰外科选要，附于外科心法之后
  source_urls:
