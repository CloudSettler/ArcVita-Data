  archetype: 医道求真者
  dilemmas:
  - 师承叔和旧编还是直溯仲景本源
  - 隐忍成说以避谤还是直言驳正以明道
  lesson: 振举大纲而后详明节目追溯圣源方能不为师说所惑
  summary_first_person: 吾喻昌字嘉言江西新建人也痛伤寒全书残缺难读皆由叔和编次之失与后人校注之误故作尚论篇以冬伤于寒为大纲重定六经次序辨温暑异气冀复仲景之旧观也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%B0%9A%E8%AE%BA%E7%AF%87.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%B0%9A%E8%AE%BA%E7%AF%87.html
endeavors:
- id: guji-喻昌-endeavor-1
  title_zh: 尚论伤寒重定仲景大纲
  summary_zh: 以冬伤于寒统春温夏暑辨叔和林亿成无已之失重振六经纲领
  phases:
  - key: brewing
    name: 潜心伤寒久探师说之惑
    labels:
      zh: 研读伤寒论辨脉序例之乱
    start_date: '1640'
    highlight_event_id: guji-喻昌-event-1
  - key: breakthrough
    name: 立冬伤寒大纲之说
    labels:
      zh: 以四时主病为纲举三百九十七法
    start_date: '1648'
    highlight_event_id: guji-喻昌-event-1
  - key: climax
    name: 驳正叔和序例脉法之误
    labels:
      zh: 驳序例辨温病分篇立论
    start_date: '1648'
    highlight_event_id: guji-喻昌-event-1
  - key: closure
    name: 尚论篇卷首成书示后学
    labels:
      zh: 成尚论篇以启升堂入室之门
    start_date: '1648'
    highlight_event_id: guji-喻昌-event-1
  decisions:
  - date: '1648'
    title_zh: 决意削序例而存驳正以尊经
    rationale: 不忍圣言蒙尘故存原文而逐条驳正使是非功罪自明
  - date: '1648'
    title_zh: 决以太阳为六经大纲重定篇目
    rationale: 大纲混于节目则书难读故先振举大纲后详节目
- id: guji-喻昌-endeavor-2
  title_zh: 著医门法律寓意草以惠后世
  summary_zh: 由伤寒推及杂病温疫立医门之法垂临床之案
  phases:
  - key: brewing
    name: 行医江南洞悉时医之弊
    labels:
      zh: 临证体认温暑误治之祸
    start_date: '1650'
    highlight_event_id: guji-喻昌-event-2
  - key: breakthrough
    name: 别立春温夏热大纲自名篇
    labels:
      zh: 明冬伤寒春伤温夏秋伤暑热之旨
    start_date: '1658'
    highlight_event_id: guji-喻昌-event-2
  - key: climax
    name: 医门法律寓意草相继成书
    labels:
      zh: 立法垂教记案寓意以传心
    start_date: '1658'
    highlight_event_id: guji-喻昌-event-2
  - key: closure
    name: 晚号西昌老人以医道自任
    labels:
      zh: 知我罪我不计而慰吾生
    start_date: '1660'
    highlight_event_id: guji-喻昌-event-death
  decisions:
  - date: '1658'
    title_zh: 决以伤寒法治温暑而错综用之
    rationale: 春夏秋虽时令不同而受外感则一可取伤寒法错综用之
  - date: '1658'
    title_zh: 决以著述明道不附和流俗
    rationale: 千古疑窦非直溯本源不能破故不惜得罪前贤之名
events:
- id: guji-喻昌-event-birth
  date: '1585'
  year_of: 1585
  title_zh: 生于江西新建
  description_zh: 明万历十三年生字嘉言后号西昌老人
- id: guji-喻昌-event-1
  date: '1648'
  year_of: 1648
  title_zh: 作尚论篇辨叔和编次之失
  description_zh: 于卷首尚论大意及先辨叔和编次林亿成无已校注之失驳正序例重定太阳阳明诸经纲领
- id: guji-喻昌-event-2
  date: '1658'
  year_of: 1658
  title_zh: 医门法律寓意草成书传世
  description_zh: 推尚论之旨而广之立法垂教分门论治为清初医林宗匠
- id: guji-喻昌-event-death
  date: '1664'
  year_of: 1664
  title_zh: 逝世
  description_zh: 清康熙三年卒享年约八十医道以尚论篇为不朽
