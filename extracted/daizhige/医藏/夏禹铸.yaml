  decisions:
  - date: 1685-08-01
    title_zh: 见青筋即灸以截病势
    rationale: 青筋自脐上指心口至心则难活，故早灸筋头以缩筋退病
  - date: 1692-04-01
    title_zh: 图定十三穴灯火
    rationale: 脐轮少商囟门眉心人中承浆皆要穴，图穴以使后人按穴灸之不迷
