person:
  qid: guji-天休子
  name_zh: 天休子
  names:
    zh: 天休子
    en: Tianxiuzi
  lifespan:
    birth:
      date: 1782
      precision: year
      is_circa: true
      raw: 清乾隆末年生道光丙午行揉時已六十餘年
    death:
      date: 1850
      precision: year
      is_circa: true
      raw: 道光後卒具體年月不詳
  birth_date: 1782
  death_date: 1850
  era: 清
  reign_ref: 道光
  archetype: 自病自試之醫道修身者
  dilemmas:
  - 守古方藥內消皮里膜內之積而藥力不到坐待乎對
  - 信手試揉吊動大積歷寒痛癢而堅持乎對
  - 畏難中止前功盡棄而求速效乎對
  - 窮一己獨善而緘口乎對普傳揉法利天下後生乎對
  lesson: 積由氣血停滯而成藥力不到惟以恆勤和柔之揉吊動經絡使清升濁降方能去病拔根以修身
  summary_first_person: 吾清道光間人自號天休子幼壯多病中晚積深面鼓項壅腰痛六十餘年醫藥罔效乃悟津液凝結非揉不消遂專揉夾車顴海底等處歷旬月寒痛癢而吊出頭脊肩脅大積如蛇如帶由結喉內消而得安因緝平生證驗為修崑崙證驗一卷示人人皆可自揉以贊化育
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E4%BF%AE%E6%98%86%E4%BB%91%E8%AF%81%E9%AA%8C.html
endeavors:
- id: guji-天休子-endeavor-1
  person_qid: guji-天休子
  title_zh: 自試揉夾車去積療宿疾
  summary: 苦自病而無師承專以揉夾車顴及海底吊動六陰六陽之積使由結喉內消退回臍胃而出以愈腰痛麻痹腫痛諸症
  phases:
  - key: brewing
    name: 積深病久悟藥難達
    labels:
      zh: 醖釀省悟
    start_date: 1844-01-01
    highlight_event_id: guji-天休子-event-1
  - key: breakthrough
    name: 初揉夾車吊動頭陽積
    labels:
      zh: 初試見效
    start_date: 1845-06-01
    highlight_event_id: guji-天休子-event-1
  - key: climax
    name: 新正脊腰大積湧消
    labels:
      zh: 高潮湧積
    start_date: 1846-02-07
    highlight_event_id: guji-天休子-event-1
  - key: closure
    name: 頭腰俱清守揉防復
    labels:
      zh: 收功善後
    start_date: 1846-03-07
    highlight_event_id: guji-天休子-event-2
  decisions:
  - date: 1845-06-01
    title_zh: 捨專恃藥轉以手揉為主
    rationale: 積在皮里膜內藥力不能到如瘿瘤外揉可散故決以揉代藥
  - date: 1846-02-07
    title_zh: 忍微寒專力揉腦後吊脊積
    rationale: 周身微寒知有大積將上雖粗大喉自能容故盡力吊消不使中止
  - date: 1846-03-07
    title_zh: 續揉海底疏通腿胯善後
    rationale: 下部六陰之積由足上行終歸夾車須揉囊莖海底以絕其根
- id: guji-天休子-endeavor-2
  person_qid: guji-天休子
  title_zh: 撰修崑崙證驗普傳揉法
  summary: 以終身證效為案列揉積論綜概及二十八節行消次第明尺宅寸田夾車人迎之要使人人易知易從不借人力不費己財
  phases:
  - key: brewing
    name: 縷述經驗起意忠告
    labels:
      zh: 發心著述
    start_date: 1846-01-01
    highlight_event_id: guji-天休子-event-3
  - key: breakthrough
    name: 草成揉積論綜概
    labels:
      zh: 立論成篇
    start_date: 1846-06-01
    highlight_event_id: guji-天休子-event-3
  - key: climax
    name: 丙午立秋書引丁未侯桐序
    labels:
      zh: 序引告成
    start_date: 1846-08-07
    highlight_event_id: guji-天休子-event-3
  - key: closure
    name: 以此冊為修身嚆矢示後
    labels:
      zh: 傳世勖後
    start_date: 1847-07-01
    highlight_event_id: guji-天休子-event-3
  decisions:
  - date: 1846-08-07
    title_zh: 作小引以修身為本統攝醫藥
    rationale: 本亂末治不治故以一言曰揉貫正心誠意與懲忿窒欲使未病已病皆有所修
  - date: 1847-07-01
    title_zh: 托錫山侯桐作序廣傳
    rationale: 欲利天下後生須借當世信士證其昭昭可案歷歷可稽以勸行
events:
- id: guji-天休子-event-birth
  person_qid: guji-天休子
  type: birth
  date: 1782
  year_of: 1782
  title_zh: 天休子生於乾隆末年
  description: 推其道光丙午已六十餘年腰痛積深故約生於乾隆末年幼稚本無積而後漸生
- id: guji-天休子-event-death
  person_qid: guji-天休子
  type: death
  date: 1850
  year_of: 1850
  title_zh: 天休子卒於道光後
  description: 書成於道光丁未後行揉有效精神健旺延年其卒年月不傳約計道光末咸豐初
- id: guji-天休子-event-1
  person_qid: guji-天休子
  type: career
  date: 1846-02-07
  year_of: 1846
  title_zh: 新正八日脊中大片湧出結喉內消
  description: 項左右並出二根後脊中湧出一大片中硬邊軟闊五六寸右旋入結喉數刻方完腰酸痛繼而周身汗出六十餘年腰痛之積分先後上消
- id: guji-天休子-event-2
  person_qid: guji-天休子
  type: career
  date: 1846-03-07
  year_of: 1846
  title_zh: 二月朔夜肩髀太陽大積揉消
  description: 兩肩髀骨埋入積中長闊尺餘揉大椎缺盆不動乃傍頸項揉吊使大蛇形積由鬢額頂下項後歷兩時許完而肩下之積一掃無餘喉中釋然
- id: guji-天休子-event-3
  person_qid: guji-天休子
  type: career
  date: 1847-07-01
  year_of: 1847
  title_zh: 修崑崙證驗告成侯桐作序
  description: 先於丙午六月立秋自書小引明如切如磋之揉義後成揉積論綜概二十八條至丁未六月上浣得錫山侯桐序稱其運心中之矩垂肘後之方證以終身
