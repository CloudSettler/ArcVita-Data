  - date: 1718-06-01
    title_zh: 不骤止而先引血归经
    rationale: 崩势如山崩不可遏，须先用引经药使血归十二经，后用黑药水制火势
  - date: 1720-06-01
    title_zh: 分气虚火动湿热论治
    rationale: 脾虚不统肝伤不藏相火迫血各异，故兼升举补益与清心凉血
