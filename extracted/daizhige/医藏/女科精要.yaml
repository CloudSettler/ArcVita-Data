  decisions:
  - date: 1705-06-01
    title_zh: 以脾胃立论统血
    rationale: 血生于脾土心统诸经之血，心脾平和则经候如常，故用甘温助阳生阴
  - date: 1710-06-01
    title_zh: 先问经别血滞血枯
    rationale: 血滞宜行血枯宜补，枯者大宜补养不可峻削，故详辨脉迟数虚实
- id: guji-女科精要-endeavor-2
  title_zh: 阐发崩漏门治法
  summary: 论悲哀劳倦七情动火冲任不摄，立塞流澄源补旧次第，录升阳除湿补气摄血之法
