  dilemmas:
  - title_zh: 寒热攻补之辨
    description: 妊娠漏下与崩带虚实夹杂，若误用寒凉则损胎气，若峻用温补则助胎火，进退两难
  - title_zh: 保胎活血之衡
    description: 跌仆凝血欲去瘀又恐动胎，欲守胎又恐留瘀为患，须先辨死生再定去留
  lesson: 调经以和为贵，安胎以固为要，产后以顾正为先，临证须脉证合参，不可执一法而废众理
  summary_first_person: 吾研妇科脉理，详辨经带胎产诸疾，立调经安胎产后三法，著为秘书以示后学，愿脉法明而母子俱安
