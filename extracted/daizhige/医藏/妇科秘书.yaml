  decisions:
  - date: 1675-03-01
    title_zh: 立行经三忌
    rationale: 经行感冒风寒不可骤汗，忌冷水冷饮与郁怒骤补，恐停瘀闭经伤肺，故俟经尽再解表
  - date: 1685-06-01
    title_zh: 别赤白带分治
    rationale: 瘦人多火肥人多痰，赤属热白属湿，年久补脾肾兼升提，不以涩利伤正，故用马毛龟鳖牡蛎化固兼施
- id: guji-妇科秘书-endeavor-2
  title_zh: 胎产安养秘书撰述
  summary: 论恶阻胞漏胎痛子悬诸症，兼产后三冲血晕发热诸疾，保胎产两全
