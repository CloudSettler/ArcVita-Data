  decisions:
  - date: 1692-08-01
    title_zh: 定三月前后养胎大法
    rationale: 三月前养脾胃，四月后壮腰肾，补血顺气佐清热，防三五七月按期小产，故预服胎元饮过七月
  - date: 1705-04-01
    title_zh: 定产后不宜汗下大戒
    rationale: 新产血脱气脱亡阳在即，汗下利小便更伤津气，故以生化汤缓行温养，三审虚实再议攻补
