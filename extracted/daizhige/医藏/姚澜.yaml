  dilemmas:
  - 本草卷帙浩繁艰于记诵而药性赋挂一漏百当何以简当便览
  - 备要从新但分草木虫鱼不辨所入经络而诛伐无过当何以经统药
  lesson: 以经络为纲以药品为目补和攻散寒热各从其类审经用药方能十全
  summary_first_person: 吾由明经需次广文非敢言医惟知某药入某经以经络为纲汇诸药为一编俾阅者豁然而不乱投杂进足矣
  source_urls:
  - https://daizhige.org
  - https://github.com/daizhige-org/daizhigev20
