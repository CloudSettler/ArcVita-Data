  decisions:
  - date: 1785-01-01
    title_zh: 遇病只问所入何经
    rationale: 非务详核而尚简当识经则药止数味而不杂进
  - date: 1800-01-01
    title_zh: 中年须发尽脱后按经服药自号维摩
    rationale: 明了众生病能断众生病以身证按经服药之明效
