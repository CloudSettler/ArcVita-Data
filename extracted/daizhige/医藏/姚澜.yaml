  decisions:
  - date: 1790-01-01
    title_zh: 不循草木虫鱼而以经统药
    rationale: 使阅者知某味为某经之药不致乱投杂进而收针芥相投之效
  - date: 1795-01-01
    title_zh: 一经之内再分补和攻散寒热
    rationale: 同经之药功用各异从其同中辨异依类取用较为便捷
- id: guji-姚澜-endeavor-2
  title_zh: 宾馆按经治疾践行经药之验
  summary: 需次广文寓居宾馆遇微病信手拈来药止数味效如桴鼓晚年按经服药精力不衰
  phases:
  - key: brewing
