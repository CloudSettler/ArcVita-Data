person:
  qid: guji-姚绍虞
  name_zh: 姚绍虞
  names:
    zh: 姚绍虞
    en: Yao Shaoyu
  lifespan:
    birth:
      date: 约1610
      precision: year
      is_circa: true
      raw: 约明末万历年间生
    death:
      date: 约1685
      precision: year
      is_circa: true
      raw: 约清康熙二十四年后卒
  birth_date: 约1610
  death_date: 约1685
  era: 清
  reign_ref: 康熙
  archetype: 儒医
  dilemmas:
  - 经文残缺讹舛脱误，当存疑阙疑还是强解傅会
  - 圣人经文当全存还是当斟酌损益而节去赘复
  - 守儒业还是去儒为医以拯救斯民
  lesson: 节以制度，损有余补不足，务使人人可读读即解解即明而施无不当
  summary_first_person: 余会稽姚绍虞，号止庵，老经生也，甲申乙酉后去儒为医，殚精内经十四年，节素问删赘复补脱误凡一百七十八所，又继成灵枢节解，愿后人涣然冰释不复畏难而临病得当
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%B4%A0%E9%97%AE%E7%BB%8F%E6%B3%A8%E8%8A%82%E8%A7%A3.html
endeavors:
- id: guji-姚绍虞-endeavor-1
  title_zh: 七年节解素问
  summary_zh: 参唐宋明诸注，删赘复阙疑补脱误订舛讹，节素问成内篇三卷外篇六卷，凡七年而成
  phases:
  - key: brewing
    name: 播迁去儒为医
    labels:
      zh: 酝酿
    start_date: 1644
    highlight_event_id: guji-姚绍虞-event-cong-yi
  - key: breakthrough
    name: 十年参断悟节法
    labels:
      zh: 突破
    start_date: 1652
    highlight_event_id: guji-姚绍虞-event-suwen-start
  - key: climax
    name: 壬寅至己酉删注成
    labels:
      zh: 高潮
    start_date: 1662-03
    highlight_event_id: guji-姚绍虞-event-suwen-done
  - key: closure
    name: 己未付梓刊行天下
    labels:
      zh: 收束
    start_date: 1679-10
    highlight_event_id: guji-姚绍虞-event-publish
  decisions:
  - date: 1662-03
    title_zh: 立斟酌损益节经之法
    rationale: 赘词重出则去之，残缺无味则阙之，脱误舛讹则补订之，颠倒错杂则更易之，赝托七篇则删削之，以归中正之节
  - date: 1669-12
    title_zh: 分内外篇复古九卷
    rationale: 阴阳治法为理宜精思，针灸岁运为数可记忆，内篇三卷外篇六卷合九卷，使肄习者心目豁然不眩乱
- id: guji-姚绍虞-endeavor-2
  title_zh: 继成灵枢节解
  summary_zh: 素问既成，又七年节解灵枢相继而成，通十四年从事内经，使读者可读可解可明
  phases:
  - key: brewing
    name: 素问既成转治灵枢
    labels:
      zh: 酝酿
    start_date: 1669-12
    highlight_event_id: guji-姚绍虞-event-suwen-done
  - key: breakthrough
    name: 会通大意补全旨
    labels:
      zh: 突破
    start_date: 1670
    highlight_event_id: guji-姚绍虞-event-lingshu-work
  - key: climax
    name: 又七年灵枢节解成
    labels:
      zh: 高潮
    start_date: 1676
    highlight_event_id: guji-姚绍虞-event-lingshu-done
  - key: closure
    name: 丁巳自序十四年志
    labels:
      zh: 收束
    start_date: 1677-05
    highlight_event_id: guji-姚绍虞-event-zixu
  decisions:
  - date: 1670
    title_zh: 以素问之法例节灵枢
    rationale: 灵枢且无注可读，更当钩深研赜割剥理解，去糠秕汰砂砾，使条条见颖点点见血
  - date: 1677-05
    title_zh: 作自序明节而不敢删圣言
    rationale: 原文具在王注具在，余所为亦云节焉而已，恐后人訾为狂惑，故自陈删六千余字之意以待君子
events:
- id: guji-姚绍虞-event-birth
  date: 约1610
  year_of: 1610
  title_zh: 生于明末
  description_zh: 会稽经生姚绍虞生，少治儒术，长为老经生
- id: guji-姚绍虞-event-cong-yi
  date: 1644
  year_of: 1644
  title_zh: 甲申乙酉去儒为医
  description_zh: 播迁之余无志当世，去儒而为医，医药之书靡不贯穿，而尤殚精于内经一编
- id: guji-姚绍虞-event-suwen-start
  date: 1662-03
  year_of: 1662
  title_zh: 康熙壬寅三月发愤作注
  description_zh: 参唐王冰宋校正及马元台王曰逵张景岳诸说十年，喟然知所以斟酌损益，始节素问
- id: guji-姚绍虞-event-suwen-done
  date: 1669-12
  year_of: 1669
  title_zh: 己酉十二月素问节解成
  description_zh: 凡七年成素问节解，得一百七十八所，计删六千六百八十六字，分内篇三卷外篇六卷
- id: guji-姚绍虞-event-lingshu-work
  date: 1670
  year_of: 1670
  title_zh: 转注灵枢
  description_zh: 素问既成，即以其法节解灵枢，以补无注之缺
- id: guji-姚绍虞-event-lingshu-done
  date: 1676
  year_of: 1676
  title_zh: 灵枢节解相继而成
  description_zh: 又七年灵枢节解成，从事内经凡十有四年
- id: guji-姚绍虞-event-zixu
  date: 1677-05
  year_of: 1677
  title_zh: 丁巳五月作自序
  description_zh: 会稽止庵姚绍虞谨序于五月望后二日，明节经之义例与凡例
- id: guji-姚绍虞-event-publish
  date: 1679-10
  year_of: 1679
  title_zh: 己未十月付剞劂
  description_zh: 门人秦子逸少介沈荃张岱作序弁首，特付刊刻，沈荃张岱皆称其可上溯轩岐拯世保身
- id: guji-姚绍虞-event-death
  date: 约1685
  year_of: 1685
  title_zh: 卒于清康熙年间
  description_zh: 素问灵枢节解既行于世后卒，举以治病恒立决于一诊间之名存于友朋之序
