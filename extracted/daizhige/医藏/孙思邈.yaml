  dilemmas:
  - 隐居保真修道与应诏出仕济世之间两难，一则全己之真，一则全苍生之命
  - 重汤药调形与重针祝摄神之间两难，形神俱病则当以诚敬定神为先
  lesson: 医患两相喜悦诚敬，定神正色祷神而后针，则百邪不侵而金针有灵
  summary_first_person: 吾乃孙思邈，京兆华原人也，幼多病而笃志于医，隐太白终南以求道，唐主屡召不仕，惟以千金方传世，临针必先愉悦定神，正色祷神，书符念咒，呵气咒针，愿从吾针后病不许复
