  reign_ref: 唐贞观至永淳朝
  archetype: 药王济世医者
  dilemmas:
  - 隐居修道保身与出仕行医济世之间如何取舍
  - 眼疾多生于热宜清心凉肝与世俗专恃点洗针割之间如何决断
  lesson: 眼为五脏精华，治以清心凉肝调血顺气为先，退翳先去障后清热，静坐澄神节欲惜目，不可轻用针割凉洗
  summary_first_person: 吾孙思邈，京兆华原人，幼善病而志于医，隐太白终南采药行医，集古今方成千金要翼，论五轮八廓七十二症，传银海精微以明眼科正法，愿人澄神息虑调食平药以全光明
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%93%B6%E6%B5%B7%E7%B2%BE%E5%BE%AE.md
