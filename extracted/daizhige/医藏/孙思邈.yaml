    title_zh: 不恋仕途以书代仕
    rationale: 恐古方失传疾苦无告，愿以著书传法代一时之官，利及后世
  - date: '670'
    title_zh: 食治养生并重药石
    rationale: 见人穷役耗神嗜欲伤脏，故立食治养老调和之法以防病于先
- id: guji-孙思邈-endeavor-2
  title_zh: 立五轮八廓传银海眼科
  description: 以五脏配五轮八卦配八廓，辨风热气血虚实七十二症，定清心凉肝退翳点洗节度之法
  phases:
