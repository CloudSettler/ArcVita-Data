endeavors:
- id: guji-孙思邈-endeavor-1
  title_zh: 博采经方集为千金要方
  summary_zh: 祖述农黄发明岐挚，采摭自文本之初至有隋之世经方，去众说未至而成书三十卷二百三十二门，以传圣贤拯民之法
  phases:
  - key: brewing
    name: 抱康时志博采众家
    labels:
      zh:
      - 博采经方
    start_date: '0610'
    highlight_event_id: guji-孙思邈-event-birth
  - key: breakthrough
    name: 会通针灸药食脉证
    labels:
      zh:
      - 会通诸法
    start_date: '0640'
    highlight_event_id: guji-孙思邈-event-qianjin
  - key: climax
    name: 总成三十卷纲领既立
    labels:
      zh:
      - 总成要方
    start_date: '0652'
    highlight_event_id: guji-孙思邈-event-qianjin
  - key: closure
    name: 遗法传百代以补遗阙
    labels:
      zh:
      - 传法补遗
    start_date: 0680
    highlight_event_id: guji-孙思邈-event-death
  decisions:
  - date: 0648
    title_zh: 集诸家秘要去众说未至
    rationale: 经是二圣二贤而能事毕，后学或知药不知灸针，必兼圣贤之长方为良医，故总集五千余首以求十全可验
  - date: '0652'
    title_zh: 首妇人次婴孺兼列食治养性
    rationale: 上医之道乃圣人之政，脏腑针艾脉证食治宜兼包，始妇孺先脚气而次中风水肿，方能阶近至远上识三皇之奥
- id: guji-孙思邈-endeavor-2
  title_zh: 倡先食后药撰食治养生篇
  summary_zh: 悯含气之类资食存生而不知成败，撰五味损益果实菜蔬诸篇，明五脏宜忌四时增损，使人以食排邪安脏腑悦神爽志
  phases:
  - key: brewing
    name: 慨百姓日用不知食宜
    labels:
      zh:
      - 察食存生
    start_date: '0645'
    highlight_event_id: guji-孙思邈-event-qianjin
  - key: breakthrough
    name: 明五味所走五脏所宜
    labels:
      zh:
      - 明辨五味
    start_date: '0650'
    highlight_event_id: guji-孙思邈-event-shizhi
  - key: climax
    name: 成食治果菜诸篇以启童稚
    labels:
      zh:
      - 成篇启蒙
    start_date: '0655'
    highlight_event_id: guji-孙思邈-event-shizhi
  - key: closure
    name: 立食禁存性药防命之训
    labels:
      zh:
      - 立训传后
    start_date: 0680
    highlight_event_id: guji-孙思邈-event-death
  decisions:
  - date: '0650'
    title_zh: 先以食治后乃命药
    rationale: 药性刚烈犹若御兵猛暴岂容妄发，食能排邪安脏腑资血气，若能用食平疴释情遣疾可谓良工长年之法
  - date: '0655'
    title_zh: 撰五味损益详录果菜宜忌
    rationale: 安身必资于食救疾必凭于药，不知食宜不足存生不明药忌不能除病，故录槟榔大枣葵韭等寒热温凉以示节俭有度
events:
- id: guji-孙思邈-event-birth
  title_zh: 生于京兆华原
  date: 0581
  year_of: 581
  place_zh: 京兆华原
  description: 隋开皇前后生于京兆华原，少以智器闻，抱康时之志而好医方养生之学
- id: guji-孙思邈-event-qianjin
  title_zh: 集方成千金要方三十卷
  date: '0652'
  year_of: 652
  place_zh: 长安太白山间
  description: 祖述农黄岐挚，掇扁鹊难仓公禁仲景黄素以至隋世诸家，成书三十卷目录一通，总二百三十二门合方论五千余首，脏腑针艾脉证食治兼备
- id: guji-孙思邈-event-shizhi
  title_zh: 撰五味损益食治篇
  date: '0655'
  year_of: 655
  place_zh: 山林庐中
  description: 因笔墨之暇撰食治篇，论五味走筋骨气血肉及四时省增，明果实菜蔬寒热宜忌，立先食后药安身之本以启童稚
- id: guji-孙思邈-event-death
  title_zh: 卒于长安
  date: 0682
  year_of: 682
  place_zh: 长安
  description: 唐永淳元年卒，遗千金要方翼方传世，后世尊为药王真人，宋校正医书局奉诏校雠补遗以传不朽
