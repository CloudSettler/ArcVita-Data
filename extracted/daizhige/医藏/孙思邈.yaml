      - 养生
      - 惜目
    start_date: '682'
    highlight_event_id: guji-孙思邈-event-death
  decisions:
  - date: '655'
    title_zh: 先退翳后退热不冰血
    rationale: 热极生翳若先去赤热则血冰翳不去，故先散障后清热以保瞳神
  - date: '675'
    title_zh: 慎针割节凉洗重调养
    rationale: 眼为轻膜裹水不可拘拘点洗，妄用针刀钩割多成终身之患，故以调血顺气静养为本
