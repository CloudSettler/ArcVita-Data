  era: 唐
  reign_ref: 唐太宗贞观至唐高宗永淳
  archetype: 济世真人良医
  dilemmas:
  - 以隐逸养志还是出仕佐时康济民瘼，上医之道当为王官一守还是山林自保
  - 先以食治养形还是径投刚烈之药，药如御兵妄发则损伤处众当如何权衡
  lesson: 药性刚烈犹若御兵不可妄发，先洞晓病源以食治之，食疗不愈然后命药，方能安身存性而济函灵
  summary_first_person: 吾乃河东孙思邈，生逢丧乱而志在康时，祖述农黄岐挚之学，博采扁鹊仓公仲景元化以来经方，集为千金要方三十卷，又悯百姓日用饮食而不知宜忌，故撰五味损益食治篇，欲使人先以食排邪安脏腑，释情遣疾以致长年，吾道纯正不尚险怪，惟愿圣政好生之治得行于永久
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8D%83%E9%87%91%E9%A3%9F%E6%B2%BB.html
