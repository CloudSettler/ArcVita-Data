endeavors:
- id: guji-孙文垣-endeavor-1
  title_zh: 游三吴以大方起沉疴
  summary_zh: 万历初游苕吴，以阴阳虚实辨症，一补一泻治目疾，解疫痘胎产诸危症，名动三吴
  phases:
  - key: brewing
    name: 初至双林治吴氏兄弟目疾
    labels:
      zh:
      - 初游立名
    start_date: 1574-10
    highlight_event_id: guji-孙文垣-event-muji
  - key: breakthrough
    name: 治沈中丞家痘疹胎产诸危
    labels:
      zh:
      - 大方显效
    start_date: 1574-11
    highlight_event_id: guji-孙文垣-event-shenzhongcheng
  - key: climax
    name: 治大头疫及痛风周痹重症
    labels:
      zh:
      - 起垂毙而生
    start_date: 1575-02
    highlight_event_id: guji-孙文垣-event-datouyi
  - key: closure
    name: 董宗伯门下诸案功成名著
    labels:
      zh:
      - 声闻公卿
    start_date: 1576-08
    highlight_event_id: guji-孙文垣-event-dongzongbo
  decisions:
  - date: 1574-10
    title_zh: 吴小峰兄弟一补一泻
    rationale: 辨阴阳虚实，实者正治，虚者从治，不拘目科成法
  - date: 1574-11
    title_zh: 妊腹痛昏厥投小承气
    rationale: 有故无殒，将解之胎当下则下，不可因妊废下
- id: guji-孙文垣-endeavor-2
  title_zh: 论医阐易纂案传后
  summary_zh: 以易明医，斥市利胶固之习，论痘疹伤寒胎产，纂三吴治验为孙文垣医案
  phases:
  - key: brewing
    name: 好易明理以易为医
    labels:
      zh:
      - 易医会通
    start_date: '1545'
    highlight_event_id: guji-孙文垣-event-birth
  - key: breakthrough
    name: 与吴江孙质庵论医隐之道
    labels:
      zh:
      - 医道立心
    start_date: '1584'
    highlight_event_id: guji-孙文垣-event-dongzongbo
  - key: climax
    name: 纂三吴治验成案
    labels:
      zh:
      - 纂案垂训
    start_date: '1607'
    highlight_event_id: guji-孙文垣-event-zhuanan
  - key: closure
    name: 医案流传惠及后学
    labels:
      zh:
      - 著述不朽
    start_date: '1612'
    highlight_event_id: guji-孙文垣-event-zhuanan
  decisions:
  - date: '1607'
    title_zh: 详录治验及发明
    rationale: 记成功亦记转折，使后人知变通之故，不蹈胶固
  - date: '1584'
    title_zh: 守为人而医不为己而医
    rationale: 古之医者为人，专精审慎，以救死扶生为心，不以市利为念
events:
- id: guji-孙文垣-event-birth
  kind: birth
  title_zh: 生于新安海阳
  date: '1522'
  year_of: 1522
  place_zh: 新安海阳
  summary_zh: 明嘉靖元年生于徽州海阳孙氏，后字文垣号东宿
- id: guji-孙文垣-event-muji
  kind: career
  title_zh: 治吴小峰小川目疾
  date: 1574-10
  year_of: 1574
  place_zh: 苕东双林
  summary_zh: 万历二年小春月游双林，一补一泻愈吴氏兄弟目疾，始以大方名三吴
- id: guji-孙文垣-event-shenzhongcheng
  kind: career
  title_zh: 治沈中丞家痘疹胎产
  date: 1574-11
  year_of: 1574
  place_zh: 苕城沈氏
  summary_zh: 以小无比散愈幼君痘疹，以小承气下妊腹痛昏厥，以小柴胡愈考功寒热，深契考功
- id: guji-孙文垣-event-datouyi
  kind: career
  title_zh: 治张后渠大头疫
  date: 1575-02
  year_of: 1575
  place_zh: 苕城张氏
  summary_zh: 大头疫头大如斗昏愦不知人，先柴胡退寒热，后贯众葛根消肿而愈
- id: guji-孙文垣-event-dongzongbo
  kind: career
  title_zh: 治董浔老脾胃及马厨疟痢
  date: 1576-08
  year_of: 1576
  place_zh: 苕城董氏
  summary_zh: 以辛温高良姜肉桂麝香愈宗伯瓜果寒湿胀痛，以混沌汤背水起马厨疟痢垂毙
- id: guji-孙文垣-event-zhuanan
  kind: career
  title_zh: 纂孙文垣医案
  date: '1607'
  year_of: 1607
  place_zh: 新安
  summary_zh: 会三吴治验，分卷录案附发明，吴江孙质庵作序，刊行于世
- id: guji-孙文垣-event-death
  kind: death
  title_zh: 卒于里第
  date: '1619'
  year_of: 1619
  place_zh: 新安海阳
  summary_zh: 明万历四十七年卒，享年九十八，遗医案赤水玄珠等惠后世
