events:
- id: guji-孙文胤-event-birth
  title_zh: 出生于休邑孙氏
  date: 1595
  year_of: 1595
  is_circa: true
  location_zh: 休邑
  description_zh: 世居新都之休邑，先君子以宅相目之，少治经史日课经生业
- id: guji-孙文胤-event-ill
  title_zh: 少颖敏而以孱质罹疾
  date: 1620
  year_of: 1620
  is_circa: true
  location_zh: 休邑
  description_zh: 自谓取青紫如拾芥，竟以孱质罹疾，久之二竖为祟
- id: guji-孙文胤-event-cure
  title_zh: 研灵枢内景揣摩获中病脱
  date: 1630
  year_of: 1630
  is_circa: true
  location_zh: 休邑
  description_zh: 探叩藏灵枢内景诸书，初览苓术味苦如帖括，渐入甘境揣摩获中病尽脱，悟五运六气温凉生克标本之方
- id: guji-孙文胤-event-jingkou
  title_zh: 行医京口所投辄治
  date: 1633
  year_of: 1633
  is_circa: true
  location_zh: 京口
  description_zh: 或劝少试，乃行之京口，所投辄治，问膏肓者踵相接
- id: guji-孙文胤-event-wu
  title_zh: 寓居古吴寄庐济物
  date: 1635
  year_of: 1635
  is_circa: true
  location_zh: 古吴
  description_zh: 性不耐纷避南北之冲，寓古吴寄庐，以济物之暇肆力仲景元素诸家秘旨
- id: guji-孙文胤-event-book
  title_zh: 仁寿堂自叙丹台玉案成
  date: 1637-05-08
  year_of: 1637
  is_circa: true
  location_zh: 古吳仁寿堂
  description_zh: 崇祯丁丑孟夏上浣八日对薇父书于仁寿堂，分六卷类论评脉主方，附先天脉镜异人秘授，戒贵五谷贱金石
- id: guji-孙文胤-event-preface
  title_zh: 杨卿雨花木末亭作序
  date: 1638-08-15
  year_of: 1638
  is_circa: true
  location_zh: 雨花木末亭
  description_zh: 崇祯戊寅仲秋知江宁县事杨卿作序，称其由国士移于国手，二十年苦心能以言传不可言传，期活亿万世生灵
- id: guji-孙文胤-event-death
  title_zh: 卒年未详
  date: 1650
  year_of: 1650
  is_circa: true
  location_zh: 古吴
  description_zh: 崇祯戊寅后事迹未详，外著螽斯秘宝录俟它日再镌，卒年未详
