  archetype: 由儒转医之博济医家
  dilemmas:
  - 少治经生业而久困孱弱宿疾，弃坟典而乞灵素难
  - 性不耐纷而问膏肓者踵接，欲济物活世而惧人恃药石忘真气
  lesson: 殚精皆可证圣，守胃气察阴阳升降，贵五谷宝真气以活人活世
  summary_first_person: 予世居新都之休邑，少苦攻经生业，久之二竖为祟，乃与名哲砥摩，探灵枢内景仲景元素之秘，揣摩获中而病脱，遂行医京口，寓居古吴，二十年精思剧解汇成丹台玉案以公同志，愿人贵五谷贱金石，宝真气陋参茸
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/丹台玉案.md
  - https://daizhige.org/医藏/丹台玉案.html
