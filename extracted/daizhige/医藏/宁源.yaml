person:
  qid: guji-宁源
  name_zh: 宁源
  names:
    zh: 宁源
    en: Ning Yuan
  lifespan:
    birth:
      date: 1420-01-01
      precision: year
      is_circa: true
      raw: 明代生年不详
    death:
      date: 1500-12-31
      precision: year
      is_circa: true
      raw: 明代卒年不详
  birth_date: 1420-01-01
  death_date: 1500-12-31
  era: 明
  reign_ref: 明代
  archetype: 医家
  dilemmas:
  - 一饮一食人所日用而多忽宜忌，博载则繁从简则漏，何以使摄生者易知易行
  - 食能延年亦能致疾，补益与动气耗血并存，何以劝人就益违损而不偏废
  lesson: 有益者就之，无益者违之，淡食为主，养生却病两有裨
  summary_first_person: 我是宁源，亦作宁原，明代食养医家，我以谷为首分菜瓜果味鸟兽鳞甲虫风寒暑湿燥气诸门，详记一物之宜忌冷热补泻，撰成食鉴本草，愿世人因食养生因食却病
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E9%A3%9F%E9%89%B4%E6%9C%AC%E8%8D%89.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%A3%9F%E9%89%B4%E6%9C%AC%E8%8D%89.md
endeavors:
- id: guji-宁源-endeavor-1
  title_zh: 编纂食鉴本草辨饮食宜忌
  description: 以谷为首次菜瓜果味鸟兽鳞甲虫，详录补泻寒热宜忌，使人知所取舍
  phases:
  - key: brewing
    name: 体察日用饮食得失
    labels:
      zh: 养生以谷食为主
    start_date: 1440-01-01
    highlight_event_id: guji-宁源-event-1
  - key: breakthrough
    name: 分门别类立体例
    labels:
      zh: 谷菜瓜果味鸟兽鳞甲虫
    start_date: 1460-01-01
    highlight_event_id: guji-宁源-event-1
  - key: climax
    name: 成书详陈宜忌
    labels:
      zh: 或延年或致疾条条是道
    start_date: 1470-01-01
    highlight_event_id: guji-宁源-event-1
  - key: closure
    name: 普传摄生者就益违损
    labels:
      zh: 养生却病两有裨
    start_date: 1480-01-01
    highlight_event_id: guji-宁源-event-2
  decisions:
  - date: 1460-01-01
    title_zh: 以谷食居首
    rationale: 人之养生全赖谷食为主，一日不食则饥饿难度，故先谷次蔬以明先后
  - date: 1470-01-01
    title_zh: 宜忌并陈不专言补
    rationale: 食有补腰补肾益脾滋阴，亦有动气动风损精耗血，必两陈使人知违就
- id: guji-宁源-endeavor-2
  title_zh: 设食疗方治风寒暑湿燥气
  description: 于风寒暑湿燥气诸门收葱粥苍耳粥绿豆粥薏苡粥地黄粥等，以米粥茶酒调药食同源
  phases:
  - key: brewing
    name: 搜集民间食方
    labels:
      zh: 药食同源简便验廉
    start_date: 1465-01-01
    highlight_event_id: guji-宁源-event-2
  - key: breakthrough
    name: 以六淫为纲系方
    labels:
      zh: 风寒暑湿燥气分治
    start_date: 1472-01-01
    highlight_event_id: guji-宁源-event-2
  - key: climax
    name: 示人粥茶酒用法
    labels:
      zh: 上床萝卜下床姜晨姜暮卜
    start_date: 1478-01-01
    highlight_event_id: guji-宁源-event-2
  decisions:
  - date: 1472-01-01
    title_zh: 以粥为方载体
    rationale: 粥能养胃通行药力，老人小儿皆宜，故风寒用葱粥暑用绿豆粥湿用薏苡粥燥用地黄粥
  - date: 1478-01-01
    title_zh: 戒忌与服食并重
    rationale: 如松精粉治疠风必戒荤腥油盐酒果，服药不守戒无益，故详示禁忌以全其效
events:
- id: guji-宁源-event-birth
  title_zh: 诞生
  date: 1420-01-01
  year_of: 1420
  description: 明代诞生，生年不详，约当明中叶前
- id: guji-宁源-event-1
  title_zh: 编成食鉴本草辨谷菜瓜果味
  date: 1470-06-01
  year_of: 1470
  description: 以粳米糯米黍稷麦豆为首，次蔓菁菠菜芥苋以至瓜果水盐酒茶，详注寒热补泻宜忌
- id: guji-宁源-event-2
  title_zh: 立风寒暑湿燥气食疗方
  date: 1478-08-01
  year_of: 1478
  description: 设葱粥治伤风，五合茶御风寒，绿豆粥解暑，薏苡粥去湿，地黄粥滋阴，橘饼开郁结
- id: guji-宁源-event-death
  title_zh: 逝世
  date: 1500-12-31
  year_of: 1500
  description: 明代逝世，卒年不详，其书后世流传，光绪九年兰庭逸史仍为之序而刊行
