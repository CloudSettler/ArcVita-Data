    rationale: 不明营卫三焦则血脉气化难通须持艺以游游愈远而艺愈进
  - date: 1896
    title_zh: 丙申出游以求知音
    rationale: 南北燥湿不同古今禀赋亦异须广览博采以待无穷之变
- id: guji-宝辉-endeavor-2
  title_zh: 著书医医救偏补弊
  summary_zh: 痛庸医杀人偏于攻补寒凉温热乃撮平生得悟著医医小草游艺志略易知录等阐无偏之旨以救偏补弊
  phases:
