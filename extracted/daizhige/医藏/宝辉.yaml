    rationale: 惩世庸医杀人有所不得已欲使后之业医者皆有所根据
  - date: 1901
    title_zh: 名编为医医小草明无偏
    rationale: 医学之难难于无偏仲景一人而已兹编欲化庸为明融会三者同归无偏
