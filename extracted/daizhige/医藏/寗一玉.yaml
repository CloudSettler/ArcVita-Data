      raw: 明末，卒年不详，暂系于明末
  birth_date: 1560
  death_date: 1640
  era: 明
  reign_ref: 明中晚期
  archetype: 医家考形辨经型
  dilemmas:
  - 形体部位浩繁细碎，若徒摹形则难记难用，故须以十二经脉统摄形体分部
  - 脏腑官窍精气之说玄远，若空谈玄理则不切临床，故须落实于骨肉孔窍分属以便辨证
  lesson: 析骨以辨形，分经以定属，形经相配执简驭繁，乃为医之纲纪
  summary_first_person: 我是明代绥安寗一玉，览医经而悯形经散漫，遂析一身头面颈项胸腹脊背四肢骨节肌窍脏腑，一一分属经络脏腑，撰成析骨分经一卷，愿后学按形索经，按经辨证，临证不再茫然
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E6%9E%90%E9%AA%A8%E5%88%86%E7%BB%8F.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E6%9E%90%E9%AA%A8%E5%88%86%E7%BB%8F.html
endeavors:
- id: guji-寗一玉-endeavor-1
  title_zh: 分部析骨系络撰述析骨分经形体篇
  summary_zh: 按头脑面目耳鼻口齿颈项背脊腰肩腋胁肋四肢骨肉，逐部考定经络归属，以经统形
  phases:
  - key: brewing
    name: 习医览经酝酿体例
    labels:
      zh: 研读酝酿
    start_date: 1590
    highlight_event_id: guji-寗一玉-event-birth
  - key: breakthrough
    name: 立析骨分经之法以经统形
    labels:
      zh: 体例初立
    start_date: 1605
    highlight_event_id: guji-寗一玉-event-compile
  - key: climax
    name: 详述头面躯干四肢分属告成
    labels:
      zh: 撰述告成
    start_date: 1615
    highlight_event_id: guji-寗一玉-event-compile
  - key: closure
    name: 付流传为医家验形之据
    labels:
      zh: 流传收录
    start_date: 1626
    highlight_event_id: guji-寗一玉-event-included
  decisions:
  - date: 1605
    title_zh: 以经络归属统摄形体
    rationale: 骨节肌窍繁多，必系以督任手足三阴阳经，方能提纲挈领，便于记忆施治
  - date: 1615
    title_zh: 详列孔窍内外分属
    rationale: 目眦耳颊唇龈舌咽喉皆各有所属脏腑经脉，辨明内外上下，临证方有据可依
- id: guji-寗一玉-endeavor-2
  title_zh: 阐发脏腑官窍精气血脉藏象篇
  summary_zh: 论肺心心包肝胆脾胃大小肠肾膀胱之形位功能，兼明皮肤肌肉血脉筋骨精气津液血脉之分属
  phases:
  - key: brewing
    name: 参合内难藏象学说
    labels:
      zh: 藏象参合
    start_date: 1595
    highlight_event_id: guji-寗一玉-event-birth
  - key: breakthrough
    name: 以官窍功能释脏腑之用
    labels:
      zh: 官窍释藏
    start_date: 1610
    highlight_event_id: guji-寗一玉-event-compile
  - key: climax
    name: 精气津液血脉筋骨体系阐明
    labels:
      zh: 精气阐微
    start_date: 1615
    highlight_event_id: guji-寗一玉-event-compile
  - key: closure
    name: 收入说郛续以广流传
    labels:
      zh: 收入说郛
    start_date: 1626
    highlight_event_id: guji-寗一玉-event-included
  decisions:
  - date: 1610
    title_zh: 以五官九窍配五脏以明用
    rationale: 鼻为肺窍口为脾窍目为肝窍耳为肾窍舌为心窍，配属分明则藏象之用可征于形
  - date: 1626
    title_zh: 听任陶珽编入说郛续
    rationale: 医技当公之于世，收入类书可与经史并传，惠及后学远胜私藏于家
