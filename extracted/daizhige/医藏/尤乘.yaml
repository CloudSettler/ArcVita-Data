endeavors:
- id: guji-尤乘-endeavor-1
  title_zh: 编著寿世青编立疗心之宗
  summary_zh: 考览内经仙经佛典，以疗心为本，撰勿药须知与养心诸说而成寿世青编
  phases:
  - key: brewing
    name: 博览医籍悟心病之源
    labels:
      zh: 悟道
    start_date: 1665-01-01
    highlight_event_id: guji-尤乘-event-birth
  - key: breakthrough
    name: 辑录勿药须知疗心法言
    labels:
      zh: 立宗
    start_date: 1680-01-01
    highlight_event_id: guji-尤乘-event-1
  - key: climax
    name: 撰成养心养肝脾肺肾诸说
    labels:
      zh: 成书
    start_date: 1690-01-01
    highlight_event_id: guji-尤乘-event-2
  - key: closure
    name: 刊行寿世青编垂训后世
    labels:
      zh: 垂训
    start_date: 1695-01-01
    highlight_event_id: guji-尤乘-event-2
  decisions:
  - date: 1680-01-01
    title_zh: 决定以疗心为卷首揭勿药须知
    rationale: 心为万法之宗，药只能治半病，故先立疗心以正其本
  - date: 1690-01-01
    title_zh: 决定兼采儒道佛格言明寡欲养神
    rationale: 会通素问老庄孙思邈诸家，欲使人未病先防不药而寿
- id: guji-尤乘-endeavor-2
  title_zh: 阐扬养生全生保精延年
  summary_zh: 论斋戒食饮居处寝寐，教人节饮食寡嗜欲以全精气神三宝
  phases:
  - key: brewing
    name: 体察世人酒色劳耗之害
    labels:
      zh: 察病
    start_date: 1675-01-01
    highlight_event_id: guji-尤乘-event-1
  - key: breakthrough
    name: 参合孙真人卫生歌定三戒
    labels:
      zh: 定戒
    start_date: 1685-01-01
    highlight_event_id: guji-尤乘-event-1
  - key: climax
    name: 详论食忌居处睡诀以卫生
    labels:
      zh: 卫生
    start_date: 1692-01-01
    highlight_event_id: guji-尤乘-event-2
  - key: closure
    name: 以惜命惜身惜气劝世修身
    labels:
      zh: 劝世
    start_date: 1695-01-01
    highlight_event_id: guji-尤乘-event-2
  decisions:
  - date: 1685-01-01
    title_zh: 决定力倡大怒大欲大醉三戒
    rationale: 三者最损真元，戒性则火不出而神自定故首揭卫生歌
  - date: 1692-01-01
    title_zh: 决定详述饮食居寝琐细为养生
    rationale: 安谷则昌，起居有常，细行不谨则风邪内入故须谆谆示人
events:
- id: guji-尤乘-event-birth
  title_zh: 诞生于清初
  date: 1640-01-01
  year_of: 1640
  description_zh: 尤乘约生于清初，少习儒医，博览内经仙释之书
- id: guji-尤乘-event-1
  title_zh: 辑成勿药须知与疗心法言
  date: 1680-01-01
  year_of: 1680
  description_zh: 标举病由心生心药医心之旨，引林鉴堂安心诗及素问恬淡虚无之训
- id: guji-尤乘-event-2
  title_zh: 撰成养心养五脏及养生诸说寿世青编成书
  date: 1695-01-01
  year_of: 1695
  description_zh: 论养心养肝养脾养肺养肾，兼及斋戒食忌居处睡诀，集成寿世青编卷上
- id: guji-尤乘-event-death
  title_zh: 逝世于康熙末年
  date: 1710-12-31
  year_of: 1710
  description_zh: 尤乘约卒于康熙末年，其书流传以疗心养生垂训后世
