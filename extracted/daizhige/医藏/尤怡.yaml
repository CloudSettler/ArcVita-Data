    rationale: 病从内生者宜内和藏气，审肝肾阴阳虚实，不以外夺卫气为功
  - date: 1745
    title_zh: 用药活泼随证温清并用
    rationale: 滋水清肝与肾气摄纳各随其证，温凉补通兼施，非旦夕急功可就
