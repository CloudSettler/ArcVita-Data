  birth_date: '1740'
  death_date: '1810'
  era: 清代
  reign_ref: 清乾隆至嘉庆间
  archetype: 医隐
  dilemmas:
  - title_zh: 奇疾难载经方
    description: 血壅眼胀气奔血溃等怪疾经方无载当存民间验方以救急
  - title_zh: 隐逸与济世之衡
    description: 身居山野不求闻达然不忍见病苦而笔录成书以传后
  lesson: 居山野而存济世心集验方以补经方之阙小方亦可活人
  summary_first_person: 我本山野居士不慕荣利每见乡里奇疾医者束手因遍访验方随得随记集成家秘一卷愿后人临证有所据而不失救治之机
  source_urls:
