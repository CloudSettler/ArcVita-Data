endeavors:
- id: guji-山野居士-endeavor-1
  title_zh: 山野采录奇疾验方
  summary_zh: 遍访乡里收集血壅眼胀气奔血溃等怪疾对症验方以淡豆豉羌活党参五灵脂等简便药救急
  phases:
  - key: brewing
    name: 游访听闻
    labels:
      zh: 采风访疾
    start_date: '1760'
    highlight_event_id: guji-山野居士-event-1
  - key: breakthrough
    name: 得方初验
    labels:
      zh: 试方存效
    start_date: '1770'
    highlight_event_id: guji-山野居士-event-1
  decisions:
  - date: '1770'
    title_zh: 记奇病必记主症兼记服法
    rationale: 血壅肉出如锥眼胀珠垂至鼻之状非记明则后人难辨故详症略理重方药分量服法
  - date: '1775'
    title_zh: 存俚俗简便药为主
    rationale: 山野无参茸以葱灰豆豉羌活党参为用使贫家可得而愈
- id: guji-山野居士-endeavor-2
  title_zh: 编纂验方家秘成书
  summary_zh: 将水臌气臌血臌腰痛便血等内外妇儿诸方分类编次成卷附徐灵胎论血臌等先贤说以传家
  phases:
  - key: climax
    name: 分类编次
    labels:
      zh: 编书成卷
    start_date: '1785'
    highlight_event_id: guji-山野居士-event-2
  - key: closure
    name: 付传后学
    labels:
      zh: 留秘济世
    start_date: '1790'
    highlight_event_id: guji-山野居士-event-2
  decisions:
  - date: '1785'
    title_zh: 以病为纲不泥经络
    rationale: 水臌气臌血臌看法不同猪肚鸡屎等法各异当以肿形按之起陷辨证使读者一望即用
  - date: '1790'
    title_zh: 兼收先贤效方并注按语
    rationale: 徐灵胎治血臌以肉桂黄连人参大黄五灵脂下瘀孙真人治虱症等皆注明出处以示征信
events:
- id: guji-山野居士-event-birth
  title_zh: 山野居士约生
  date: '1740'
  year_of: 1740
  description: 清乾隆初约生于山野隐逸之地长而好医喜访民间单验方
- id: guji-山野居士-event-1
  title_zh: 录得血壅眼胀等奇方
  date: '1770'
  year_of: 1770
  description: 采得血壅以赤皮葱灰淋洗兼豆豉汤眼胀以羌活煎服气奔以党参苦梗青盐细辛煎服等数十条
- id: guji-山野居士-event-2
  title_zh: 编成验方家秘一卷
  date: '1790'
  year_of: 1790
  description: 将内外妇儿水臌气臌血臌腰痛虫疾等方分类写定题名验方家秘自署山野居士以传于世
- id: guji-山野居士-event-death
  title_zh: 山野居士约卒
  date: '1810'
  year_of: 1810
  description: 清嘉庆间约卒于山野其书流传于医藏后人刊行不绝
