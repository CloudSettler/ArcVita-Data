  - title_zh: 治男专用热药之弊
    description: 时医治男子求子专用壮阳热药快一时之乐久之精血耗散致尿血痈毒翻胃之祸
  lesson: 葆仁以合先天察脉以和平阴阳守标本先后节宣养生方能转无为有转蠢为灵
  summary_first_person: 我是岳甫嘉自号妙一斋明人以种子广嗣为任著医学正印种子编论先天灵气交合有时养精炼精察脉调养戒偏热偏寒录四验以示标本先后
