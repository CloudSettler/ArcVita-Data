  - date: '1631'
    title_zh: 羊痫兼滑泄断房候发灌下逐痰
    rationale: 自幼顽痰窃气血操心肾之权上迷心下走肾须候痫将止痰将退灌牛黄丸服三子散大解积痰后固本种子
events:
- id: guji-岳甫嘉-event-birth
  title_zh: 岳甫嘉出生
  date: '1575-01-01'
  year_of: 1575
  description: 明万历前后出生孱弱博览医籍留心嗣育之道自号妙一斋
- id: guji-岳甫嘉-event-theory
  title_zh: 阐先天灵气交合有时之说
  date: '1625-06-01'
  year_of: 1625
  description: 立先天灵气存仁之本论交合必待败血去净新血初生子宫正开缊候一时逆取成丹顺施成胎养精以寡欲节劳惩怒戒醉慎味
- id: guji-岳甫嘉-event-case
  title_zh: 治四友无子皆得子
  date: '1631-10-01'
  year_of: 1631
  description: 治嗜酒好博壮年无子者以解肌解毒后种子得子治羊痫滑泄者以三子散逐半桶积痰后得子治脾虚茹素者以补中益气后河车种子得子治肠风下血阳痿者以温脾摄血聚精得子
- id: guji-岳甫嘉-event-book
  title_zh: 撰成妙一斋医学正印种子编
  date: '1633-03-01'
  year_of: 1633
  description: 汇先天交合养精炼精胎始父精母血脉息服药要领为正卷附柴葛解肌黄连解毒清心滋肾三子散安神补中益气八味八珍聚精等方及成效举略以助广嗣
- id: guji-岳甫嘉-event-death
  title_zh: 岳甫嘉逝世
  date: '1650-01-01'
  year_of: 1650
  description: 明末清初逝世种子编流传后世为求子调养之正印
