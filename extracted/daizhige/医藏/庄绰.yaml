  era: 宋
  reign_ref: 建炎
  archetype: 久病自灸而著书济众的士大夫
  dilemmas:
  - 膏之上肓之下针药不及当弃去还是借火气以彻之
  - 诸家取穴量寸坐立各异当何所适从以求得真穴
  lesson: 用心方便求得膏肓坐点坐灸消息补养则阳气康盛无疾不愈
  summary_first_person: 吾自许昌遭难荣卫衰耗得灸膏肓而康宁遂考千金铜人外台圣惠之异参以亲试分为十篇绘图以济众也
