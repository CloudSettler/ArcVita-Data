endeavors:
- id: guji-庄绰-endeavor-1
  title_zh: 汇考膏肓腧穴灸法成十篇
  description_zh: 考孙真人千金方王唯一铜人灸经之异参叶潘僧仲闻石藏用诸法量同身寸揣椎定穴绘图分为十篇
  phases:
  - key: brewing
    name: 久病思校医经
    labels:
      zh:
      - 虚损难愈
      - 针药不及
    start_date: 1127-08-01
    highlight_event_id: guji-庄绰-event-ill
  - key: breakthrough
    name: 参校量寸定穴
    labels:
      zh:
      - 同身寸
      - 揣骨求穴
    start_date: 1128-01-01
    highlight_event_id: guji-庄绰-event-cure
  - key: climax
    name: 分十篇绘图
    labels:
      zh:
      - 十篇成书
      - 绘图易解
    start_date: 1128-02-01
    highlight_event_id: guji-庄绰-event-book
  - key: closure
    name: 建炎作跋传世
    labels:
      zh:
      - 建炎二年
      - 济众仁心
    start_date: 1128-02-12
    highlight_event_id: guji-庄绰-event-book
  decisions:
  - date: 1128-01-10
    title_zh: 以圣惠同身寸为定
    rationale: 指节长短不一当取男左女右中指中节横纹为寸蜡纸篾量之以免失穴
  - date: 1128-02-01
    title_zh: 立坐点坐灸之法
    rationale: 胛骨覆穴动则差寸余故点时何如灸时亦何如方得火气入穴窍
- id: guji-庄绰-endeavor-2
  title_zh: 自灸膏肓补养康复推及他人
  description_zh: 自泗滨感疟至琴川误治肿胀气促得陈了翁家灸膏肓三百壮而愈后守武昌再增记见闻以劝世人
  phases:
  - key: brewing
    name: 遭难感疟虚耗
    labels:
      zh:
      - 许昌遭难
      - 荣卫衰耗
    start_date: 1127-08-01
    highlight_event_id: guji-庄绰-event-ill
  - key: breakthrough
    name: 灸膏肓三百壮
    labels:
      zh:
      - 胸中气平
      - 肿消食进
    start_date: 1127-10-01
    highlight_event_id: guji-庄绰-event-cure
  - key: climax
    name: 康宁能出谒
    labels:
      zh:
      - 再灸百壮
      - 疾证浸减
    start_date: 1128-01-15
    highlight_event_id: guji-庄绰-event-cure
  - key: closure
    name: 武昌增记见闻
    labels:
      zh:
      - 绍兴守武昌
      - 僧灸瘵疾愈
    start_date: 1139-01-01
    highlight_event_id: guji-庄绰-event-wuchang
  decisions:
  - date: 1127-10-05
    title_zh: 日灸五十壮累至数百
    rationale: 灸至数十壮后通热快畅当觉气下砻砻然方显下气治效
  - date: 1128-02-12
    title_zh: 灸讫消息补养
    rationale: 阳气乍盛当食温软忌生冷发风犯房室兼灸气海足三里以实下保平复
events:
- id: guji-庄绰-event-birth
  type: birth
  date: 1079
  year_of: 1079
  title_zh: 庄绰生于两浙
  description_zh: 北宋元丰前后生后以文资历官南渡前已宦游中原
- id: guji-庄绰-event-ill
  type: career
  date: 1127-08-01
  year_of: 1127
  title_zh: 许昌遭难泗滨感疟
  description_zh: 自许昌避金狄之难冒寒暑东下丁未八月抵泗滨感疟至琴川误治荣卫衰耗肿胀气促大便利足痿杖起
- id: guji-庄绰-event-cure
  type: career
  date: 1128-01-15
  year_of: 1128
  title_zh: 得灸膏肓俞而愈
  description_zh: 得陈了翁家法专灸膏肓俞积三百壮次日胸中气平肿胀俱损利止食进甲午已能肩舆出谒再灸百壮以至康宁
- id: guji-庄绰-event-book
  type: career
  date: 1128-02-12
  year_of: 1128
  title_zh: 建炎二年成炙膏肓腧穴法十篇
  description_zh: 考千金铜人外台圣惠同异参诸家取穴补养之说自分寸至补养为十篇绘身指坐立之图以都总管同干办公事记于建炎二年二月十二日
- id: guji-庄绰-event-wuchang
  type: career
  date: 1139-04-01
  year_of: 1139
  title_zh: 守武昌增记僧灸法
  description_zh: 守武昌时闻总领邵玉少病瘵得泉州僧伏栲栳按穴中指麻乃得一灸而愈遂增记于石藏用取穴别法之后
- id: guji-庄绰-event-death
  type: death
  date: 1149
  year_of: 1149
  title_zh: 绍兴末年卒
  description_zh: 绍兴中守武昌后事迹渐隐绍兴十九年前后卒平生著鸡肋编及此灸法以传
