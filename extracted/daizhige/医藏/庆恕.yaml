  birth_date: 1840
  death_date: 1915
  era: 清
  reign_ref: 光绪
  archetype: 儒宦兼通之济世良医
  dilemmas:
  - 以名儒为名宦之余如何兼济问诊寿民济世
  - 伤寒注家聚讼倒乱之中如何溯源澄清示人简易
  - 古方未备之杂证如何取时方而仍合古法一气贯通
  lesson: 酌古准今，提要钩元，削肤存液，以简易示人，方为渡津宝筏。
  summary_first_person: 余庆恕，号云阁，以儒入宦，公余术演轩岐，供职部曹及守郡之时，问方求诊者接踵，浸沉医理二十余年，考药性于神农，探病本于轩岐，采方于仲景，参以黄氏悬解，手辑医学摘粹，分伤寒十六证，按经认证，按证寻方，杂证专取古方，时方必合古法，晚年解组归来，忝充医学研究所名誉所长，授徒传道，付梓流布，愿为后学津梁，寿民济世而已。
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E5%AD%A6%E6%91%98%E7%B2%B9.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E5%AD%A6%E6%91%98%E7%B2%B9.md
endeavors:
- id: guji-庆恕-endeavor-1
  title_zh: 宦余究医辑成医学摘粹
  summary: 供职部曹及典郡期间公余研医，留心伤寒十余年，浸沉二十余年，按照黄氏悬解厘清六经纲领，分十六证类方，先论证后列方，节录方解，成寿民宝籍。
  phases:
  - key: brewing
    name: 部曹守郡问诊积验
    labels:
      zh:
      - 宦游积验
    start_date: 1880
    highlight_event_id: guji-庆恕-event-1894-duzhong
  - key: breakthrough
    name: 留心伤寒溯源探本
    labels:
      zh:
      - 溯源伤寒
    start_date: 1885
    highlight_event_id: guji-庆恕-event-1895-zishu
  - key: climax
    name: 乙未自叙类方成编
    labels:
      zh:
      - 类方成编
    start_date: 1895-02-06
    highlight_event_id: guji-庆恕-event-1895-zishu
  - key: closure
    name: 甘露饮愈守手刊示人
    labels:
      zh:
      - 手刊示人
    start_date: 1897-08-01
    highlight_event_id: guji-庆恕-event-1897-ganlu
  decisions:
  - date: 1895-02-06
    title_zh: 按经认证按证寻方分十六证
    rationale: 伤寒注家百余家聚讼抵牾篇章倒乱，徐氏类方未分表里寒热虚实，故立六经提纲，分专证兼证，分类列清，令人一目了然。
  - date: 1897-08-01
    title_zh: 择群书纯粹者示人以简易
    rationale: 医学如海茫无津涯，杂证专取古方，古方未备者取时方必合古法，与伤寒金匮一气贯通，务求明白简当，易则易知简则易能。
- id: guji-庆恕-endeavor-2
  title_zh: 解组讲学付梓济世
  summary: 解组归来后充中国医学研究所名誉所长，亲授学员，发明灵素取法长沙，学员急请重付枣梨，再三重印，为后学津梁。
  phases:
  - key: brewing
    name: 解组归里倡办研究所
    labels:
      zh:
      - 归里倡学
    start_date: 1912-01-01
    highlight_event_id: guji-庆恕-event-1913-suoxue
  - key: breakthrough
    name: 充名誉所长亲授门徒
    labels:
      zh:
      - 亲授门徒
    start_date: 1913-09-15
    highlight_event_id: guji-庆恕-event-1913-suoxue
  - key: climax
    name: 学员请梓重付枣梨
    labels:
      zh:
      - 付梓流布
    start_date: 1913-10-15
    highlight_event_id: guji-庆恕-event-1913-suoxue
  - key: closure
    name: 受业研求垂诸久远
    labels:
      zh:
      - 垂诸久远
    start_date: 1915-07-01
    highlight_event_id: guji-庆恕-event-1915-chongyin
  decisions:
  - date: 1913-10-15
    title_zh: 允将原书付梓作津梁
    rationale: 救世之心苦，医医之心切，传道之心殷，学员得叨钧诲如饮上池水，付梓可惠久远，俾后学按经认证头头是道。
  - date: 1913-09-15
    title_zh: 任名誉所长开示古今医理
    rationale: 后生不研求医术无以启迪，面谈古今恍如云开见月，示以渡津宝筏，可免望洋兴叹登山失径之虞。
events:
- id: guji-庆恕-event-birth
  title_zh: 出生
  date: 1840
  year_of: 1840
  summary: 生于清中晚期，与明保同乡，乡贯未详，以名儒入仕。
- id: guji-庆恕-event-death
  title_zh: 逝世
  date: 1915
  year_of: 1915
  summary: 民国初年讲学授徒后卒，具体卒年不详。
- id: guji-庆恕-event-1894-duzhong
  title_zh: 甲午都中诊友沉疴
  date: 1894-09-01
  year_of: 1894
  summary: 光绪甲午，张奎彬入都赴秋围，因友人疾造访，先生理方诊脉，投以刀圭，无不立瘥，显治疗之效。
- id: guji-庆恕-event-1895-zishu
  title_zh: 乙未自叙伤寒十六证类方成编
  date: 1895-02-06
  year_of: 1895
  summary: 光绪二十一年乙未二月六日自叙，卷首按黄氏伤寒悬解厘清六经纲领，后分十六证按证类方，先论证后列方，务求明白简当。
- id: guji-庆恕-event-1897-ganlu
  title_zh: 甘露饮愈明保龈烂唇肿
  date: 1897-08-01
  year_of: 1897
  summary: 光绪丁酉孟秋，明保以心肺胃三经火上冲致龈烂唇肿作脓作痛，先生投以甘露饮，一剂而轻，再剂而愈，遂以手刊摘粹见示。
- id: guji-庆恕-event-1913-suoxue
  title_zh: 任医学研究所名誉所长付梓授徒
  date: 1913-10-15
  year_of: 1913
  summary: 民国二年解组归来，倡办中国医学研究所，充名誉所长，学员得叨钧诲，范秩铭张奎彬等作序，学员请将原书付梓为后学津梁。
- id: guji-庆恕-event-1915-chongyin
  title_zh: 受业书铭研求重印流布
  date: 1915-07-01
  year_of: 1915
  summary: 民国四年七月，受业书铭朝夕研求伤寒杂证药性辨证四诊诸书，愿缀言简端，研究所重印是书，垂诸久远。
