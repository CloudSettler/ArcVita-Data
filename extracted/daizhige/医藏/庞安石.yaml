      raw: 约北宋庆历二年
    death:
      date: 1099
      precision: year
      is_circa: true
      raw: 约北宋元符二年
  birth_date: 1042
  death_date: 1099
  era: 北宋
  reign_ref: 北宋仁宗至哲宗朝
  archetype: 穷经审证的伤寒医家
  dilemmas:
  - 守仲景古方与因时因地加减之间如何权衡
  - 汗吐下温诸法生死攸关如何避免误治
  lesson: 治伤寒必审表里阴阳虚实与天时地宜而后施治方可保全生气
  summary_first_person: 吾少读素问及仲景书，悯世医执一不通，遂博采华佗叔和之说，辨六经传变与温热风湿之异，著总病论六卷，欲使后之临病者两审表里寒热，不致汗下之误以全天真
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E5%AF%92%E6%80%BB%E7%97%85%E8%AE%BA.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E5%AF%92%E6%80%BB%E7%97%85%E8%AE%BA.html
endeavors:
- id: guji-庞安石-endeavor-1
  title_zh: 统论伤寒六经传变著成总病论
  description_zh: 以冬寒闭藏立论，谓即病为伤寒，不即病藏于肌肤，至春夏变为温病热病，次第辨太阳至少阴厥阴传经，著方论以正汗下吐温之序
  phases:
  - key: brewing
    name: 读经酝酿
    labels:
      zh: 研读素问仲景华佗之法
    start_date: 1065
    highlight_event_id: guji-庞安石-event-1
  - key: breakthrough
    name: 立论成书
    labels:
      zh: 提出随时变病形态通谓伤寒
    start_date: 1080
    highlight_event_id: guji-庞安石-event-1
  - key: climax
    name: 六经证治大备
    labels:
      zh: 分叙太阳阳明少阳太阴少阴证治
    start_date: 1085
    highlight_event_id: guji-庞安石-event-1
  decisions:
  - date: 1080
    title_zh: 以随时变病统名伤寒
    rationale: 本于冬中寒毒藏于肌肤，春夏因温暑而变，故以大医通谓伤寒统之，使暑湿风温各有归属
  - date: 1085
    title_zh: 定六经传变先阳后阴之序
    rationale: 足太阳为诸阳主气先受病，依次传阳明少阳再入三阴，至厥阴则危殆，据此定汗下先后以救五死一生
- id: guji-庞安石-endeavor-2
  title_zh: 审地气时令论汗下加减行医济世
  description_zh: 论西北江淮用桂枝麻黄之异，夏至前后加黄芩知母石膏之法，辨阳虚阴盛可汗阳盛阴虚可下及阴阳毒之救治，兼论内伤七情与宿疾蒸变
  phases:
  - key: brewing
    name: 察方土异宜
    labels:
      zh: 辨山居积阴平居积阳及南北寒热
    start_date: 1088
    highlight_event_id: guji-庞安石-event-2
  - key: closure
    name: 垂训临病两审
    labels:
      zh: 戒粗工晓谕先审脏腑经络受病之所
    start_date: 1092
    highlight_event_id: guji-庞安石-event-2
  decisions:
  - date: 1088
    title_zh: 因时增损桂枝麻黄白虎诸方
    rationale: 江淮地暖夏令腠理疏，不可尽守西北古方，故春末加黄芩夏至加知母大青以取汗而驱表邪
  - date: 1092
    title_zh: 严别可汗可下与阴阳毒之治
    rationale: 阳虚阴盛误下则死，阳盛阴虚误汗则死，阴毒急灸温阳，阳毒针泄复阴，必观脉证而后行事
events:
- id: guji-庞安石-event-birth
  title_zh: 生于蕲水
  date: 1042
  year_of: 1042
  description_zh: 北宋庆历间生于蕲州蕲水，少颖悟嗜医书，博览素问难经及仲景伤寒论
- id: guji-庞安石-event-1
  title_zh: 著伤寒总病论叙论六经
  date: 1080
  year_of: 1080
  description_zh: 发冬为杀厉之气立论，论太阳受病传变脏腑，辨温病热病中风湿病风温所自来，成卷第一叙论
- id: guji-庞安石-event-2
  title_zh: 阐地域时令加减与汗下之禁
  date: 1088
  year_of: 1088
  description_zh: 论桂枝汤行于西北难同江淮，夏至前后须加减，详阳旦芍药甘草葛根黄芩及承气等方之用与误治之救
- id: guji-庞安石-event-death
  title_zh: 卒于蕲州
  date: 1099
  year_of: 1099
  description_zh: 晚年隐于蕲水行医著述，门人传其伤寒总病论六卷，后世奉为宋以前伤寒集大成之作
