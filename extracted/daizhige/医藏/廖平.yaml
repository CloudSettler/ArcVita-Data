  decisions:
  - date: 1908
    title_zh: 以补养宣导附于汤熨针石之后
    rationale: 汤熨针石别有正方，导引行气可补药石所不及，故分候附录以全治养之道
  - date: 1914
    title_zh: 以风病虚劳为纲先行成编
    rationale: 巢氏病源卷帙浩繁，先取风及虚劳诸候疏证，以便学者寻览持行
