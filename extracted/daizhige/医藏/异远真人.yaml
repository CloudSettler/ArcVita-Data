endeavors:
- id: guji-异远真人-endeavor-1
  title_zh: 循穴治伤开创少林伤科派
  description: 以经络穴位为纲，偏重手法，推崇循穴治伤，与薛已补派分庭抗礼，开少林派之源
  phases:
  - key: brewing
    name: 早年习医究经络
    labels:
      zh: 正德年间参究灵枢经脉与十四经穴道
    start_date: 1506-01-01
    highlight_event_id: guji-异远真人-event-study
  - key: breakthrough
    name: 立循穴治伤之说
    labels:
      zh: 以穴位论治别于八纲脏腑补益
    start_date: 1515-01-01
    highlight_event_id: guji-异远真人-event-study
  - key: climax
    name: 手法循穴疗跌打
    labels:
      zh: 诊偏身血道形色脉候，手法移掇推正
    start_date: 1520-01-01
    highlight_event_id: guji-异远真人-event-book
  - key: closure
    name: 少林派格局初成
    labels:
      zh: 后世奉为伤科少林派代表，与薛已补派并立
    start_date: 1523-01-01
    highlight_event_id: guji-异远真人-event-influence
  decisions:
  - date: 1515-01-01
    title_zh: 定以经络穴位为诊疗依据
    rationale: 跌打伤在筋骨形体，气血不流行当循经取穴，手法为先，不专恃补气血益肝肾
  - date: 1520-01-01
    title_zh: 重手法轻猛剂早治审证
    rationale: 半月后瘀血已固难为力，既表不可复表，须解衣谛视诊脉，青肿转红为愈候，牙关紧闭难治
- id: guji-异远真人-endeavor-2
  title_zh: 著成跌损妙方一卷
  description: 首列治法总论用药歌血头行走穴道歌，次列禁忌注论，再分七门载全身五十七穴方百五十二及骨折脱位治法
  phases:
  - key: brewing
    name: 采集验方辑治法总论
    labels:
      zh: 汇全身上下中三部汤方丹散酒药敷洗之法
    start_date: 1518-01-01
    highlight_event_id: guji-异远真人-event-study
  - key: breakthrough
    name: 嘉靖二年成书
    labels:
      zh: 著成跌损妙方一卷首列穴位论治与通用两大部分
    start_date: 1523-01-01
    highlight_event_id: guji-异远真人-event-book
  - key: climax
    name: 分七门载方百五十二
    labels:
      zh: 全身头面身中脊背腿足金疮通行七门五十七穴百五十二方
    start_date: 1523-06-01
    highlight_event_id: guji-异远真人-event-book
  - key: closure
    name: 辑骨折脱位与金疮技术
    labels:
      zh: 录十种骨折脱位处理及开放损伤治疗流传明清
    start_date: 1524-01-01
    highlight_event_id: guji-异远真人-event-influence
  decisions:
  - date: 1523-01-01
    title_zh: 按损伤部位分七门系方
    rationale: 头面身中脊背腿足金疮通行各有所属，便于随轻重用药及循穴加减
  - date: 1523-01-01
    title_zh: 裁去小儿骨以猴骨代之
    rationale: 以人治人残忍殊甚，见用小儿骨者悉行裁去，劝少用紫河车之类，存仁心
events:
- id: guji-异远真人-event-birth
  type: birth
  date: 1490-01-01
  year_of: 1490
  title_zh: 出生
  description: 生卒年限及何方人氏待考，约弘治末正德初出家为僧，即异远真人
- id: guji-异远真人-event-study
  type: career
  date: 1515-01-01
  year_of: 1515
  title_zh: 究经络立循穴治伤之宗
  description: 参究灵枢经脉滑氏十四经发挥等，立以经络穴位为依据偏重手法之说，别于薛已八纲脏腑补派
- id: guji-异远真人-event-book
  type: career
  date: 1523-01-01
  year_of: 1523
  title_zh: 嘉靖二年著成跌损妙方
  description: 全书一卷，首列治法总论用药歌血头行走穴道歌左右论药中禁忌，再分七门载全身五十七穴方百五十二，另辑骨折脱位十法
- id: guji-异远真人-event-influence
  type: career
  date: 1530-01-01
  year_of: 1530
  title_zh: 少林派奉为代表流传明清
  description: 明清骨伤鼎盛，两大学派并立，后世奉跌损妙方为伤科少林派代表，丰富中医伤科学术流派
- id: guji-异远真人-event-death
  type: death
  date: 1545-01-01
  year_of: 1545
  title_zh: 圆寂
  description: 卒年待考，约嘉靖中后期圆寂，著作流传为现存最早伤科少林派之书
