endeavors:
- id: guji-张三锡-endeavor-1
  title_zh: 纂辑经络考以明十二经脉循行
  summary_zh: 博采素难灵枢及滑氏发挥纂其最要自肺手太阴至心手少阴详述经脉所起所终是动所生诸病以正误药引邪之失
  phases:
  - key: brewing
    name: 研读素难灵枢考究营卫宗气
    labels:
      zh:
      - 研读经典
      - 考据源流
    start_date: 1550-01-01
    highlight_event_id: guji-张三锡-event-study
  - key: climax
    name: 自序立论成经络考初稿
    labels:
      zh:
      - 立论自序
      - 纂辑成书
    start_date: 1565-01-01
    highlight_event_id: guji-张三锡-event-preface
  decisions:
  - date: 1565-01-01
    title_zh: 以不读十二经络便错立纲
    rationale: 欲使仁人君子知病所在而慎用药故首揭脏腑阴阳四肢筋骨各有其经为主旨
  - date: 1566-01-01
    title_zh: 宗滑伯仁发挥而参素难灵枢
    rationale: 滑氏十四经发挥得起止正义而素难灵枢为源故纂其最要以便初学
- id: guji-张三锡-endeavor-2
  title_zh: 考定诸经穴名分寸歌诀
  summary_zh: 折衷徐氏滑氏歌诀阴经照滑阳经照徐重定手太阴十一穴手阳明二十穴足阳明四十五足太阴二十一等分寸以便记诵循经取穴
  phases:
  - key: breakthrough
    name: 折衷徐滑歌诀考定穴位起止
    labels:
      zh:
      - 考定穴名
      - 分寸立歌
    start_date: 1568-01-01
    highlight_event_id: guji-张三锡-event-songs
  - key: closure
    name: 图歌并载以传后学
    labels:
      zh:
      - 图文并茂
      - 传授后学
    start_date: 1570-01-01
    highlight_event_id: guji-张三锡-event-songs
  decisions:
  - date: 1568-01-01
    title_zh: 阴经照滑阳经照徐各从起止
    rationale: 徐氏自井荥而始非起止正义滑氏合起止而句法难读故折衷以便学人熟记
  - date: 1570-01-01
    title_zh: 斥大方脉不识穴为庸下
    rationale: 欲入轩岐正脉必熟穴名经脉之理自明故作诸穴歌及分寸歌以警俗医
events:
- id: guji-张三锡-event-birth
  title_zh: 出生于明中叶
  date: 1500-01-01
  year_of: 1500
  place_zh: 中原
  description_zh: 张三锡约生于明弘治正德间少习儒长究医尤留心素难灵枢经络之学
- id: guji-张三锡-event-study
  title_zh: 研读素难灵枢及滑氏发挥
  date: 1550-01-01
  year_of: 1550
  place_zh: 书斋
  description_zh: 遍考古今方书深究营气卫气宗气行于经隧之理考肺大肠胃脾诸经脉气所起所终及病候虚实
- id: guji-张三锡-event-preface
  title_zh: 作自序明经络考旨
  date: 1565-01-01
  year_of: 1565
  place_zh: 书斋
  description_zh: 自序言脏腑阴阳各有其经四肢筋骨各有所主举头痛腹痛眼病及东垣葛根引邪为例警世医留心经络
- id: guji-张三锡-event-songs
  title_zh: 定诸经穴歌及分寸歌并绘经络图
  date: 1570-01-01
  year_of: 1570
  place_zh: 书斋
  description_zh: 详定手太阴肺经中府至少商手阳明大肠经商阳至迎香足阳明胃经承泣至厉兑足太阴脾经隐白至大包诸穴歌分寸及仰人伏人尺寸图以传后学
- id: guji-张三锡-event-death
  title_zh: 卒于明万历前后
  date: 1585-01-01
  year_of: 1585
  place_zh: 里第
  description_zh: 晚年以经络考察校刊行医藏收录后世奉为明代经络考据要籍
