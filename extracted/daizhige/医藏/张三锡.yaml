  dilemmas:
  - 世人以经络为针灸家书而懵然罔究妄举妄谈当如何救正
  - 头痛腹痛眼病部位分经用药毫厘千里当如何明部定经
  lesson: 明其部以定经循其流以寻源慎勿轻议留心经络
  summary_first_person: 吾见世医不读十二经络开口动手便错故纂素问难经灵枢及滑伯仁十四经发挥最要者为经络考以决死生处百病调虚实
