      - 声名大著
    start_date: 1624
    highlight_event_id: guji-张介宾-event-leijing
  decisions:
  - date: 1584
    title_zh: 立志注经以明王冰未尽之义
    rationale: 见世医茫无定见，欲以类经发明灵素，深探义蕴以正宗风
  - date: 1624
    title_zh: 付梓类经以公海内
    rationale: 书历四十年而成，叶秉敬称为海内奇书，遂刊行以惠后学
- id: guji-张介宾-endeavor-2
  title_zh: 质疑辨误倡导温补
  summary: 辨伤寒无补、中风六经、见血无寒诸谬，重参附温养，主单方重剂活人无数
  phases:
  - key: brewing
    name: 目击寒凉之弊慨然立论
    labels:
      zh:
      - 批判
      - 温补
