    highlight_event_id: guji-张介宾-event-return
  decisions:
  - date: 1610
    title_zh: 力辨伤寒无补法之谬
    rationale: 见挟虚伤寒十居六七，守无补一言而滥攻杀人，故倡攻补兼施以救时弊
  - date: 1625
    title_zh: 作八阵八略以应病如应敌
    rationale: 以兵法喻医法，不离乎法而不泥乎法，使后人运用从心而不寄人篱下
events:
- id: guji-张介宾-event-birth
  type: birth
  date: 1563
  year_of: 1563
  title_zh: 生于越之山阴
  description: 父为定西侯客，介宾生于山阴张氏，天姿卓绝
- id: guji-张介宾-event-study
  type: career
  date: 1577
  year_of: 1577
  title_zh: 年十四从金梦石学医
  description: 从游京师，遍交侯门奇才异士，从金梦石尽得医传，悟先天无形元气之说
- id: guji-张介宾-event-practice
  type: career
  date: 1610
  year_of: 1610
  title_zh: 沿边行医单方重剂活人
  description: 沉思病原，单方重剂应手霍然，谒病者辐辏其门，沿边大帅皆以金币致之
- id: guji-张介宾-event-return
  type: career
  date: 1620
  year_of: 1620
  title_zh: 夜观乾象预言国变遂返越
  description: 在辽阳闻御马恶声预辽亡，观星知宫车将晏驾，神宗崩后果返越，年五十八
- id: guji-张介宾-event-leijing
  type: career
  date: 1624
  year_of: 1624
  title_zh: 类经成书
  description: 综核百家剖析微义凡数十万言历四十年而成，西安叶秉敬谓之海内奇书
- id: guji-张介宾-event-bazhen
  type: career
  date: 1625
  year_of: 1625
  title_zh: 作新方八阵及质疑诸论
  description: 以应病如应敌作新方八阵为八略以破之，并辨中风肝血失血三消诸谬
- id: guji-张介宾-event-death
  type: death
  date: 1640
  year_of: 1640
  title_zh: 卒于越地莞尔而逝
  description: 返越二十年始卒，卒日自题其像，召三子而诲之，门人叹其有不死者
