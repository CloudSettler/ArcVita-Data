    highlight_event_id: guji-张介宾-event-practice
  - key: breakthrough
    name: 应病如应敌作新方八阵
    labels:
      zh:
      - 立法
      - 破阵
    start_date: 1625
    highlight_event_id: guji-张介宾-event-bazhen
  - key: closure
    name: 返越著述自题像而逝
    labels:
      zh:
      - 归隐
      - 传道
