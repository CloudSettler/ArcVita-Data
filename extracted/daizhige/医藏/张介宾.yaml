  name_zh: 张介宾
  names:
    zh: 张介宾
    en: Zhang Jiebin
  lifespan:
    birth:
      date: 1563
      precision: year
      is_circa: false
      raw: 明嘉靖四十二年生于会稽
    death:
      date: 1640
      precision: year
      is_circa: false
      raw: 明崇祯十三年卒
  birth_date: 1563
  death_date: 1640
  era: 明末
  reign_ref: 明熹宗天启
  archetype: 宗经发明之仁医
  dilemmas:
  - 遵旧注顺文敷演还是尽易旧制从类分门以发明内经
  - 从众以寒凉治火盛还是独以参术桂附培命门之火治火衰
  - 为诸子百家所用还是主持内经而用诸子百家
  lesson: 法阴阳和术数以葆真，合灵枢素问而类分，转难为易，用古而不为古用
  summary_first_person: 我名介宾字会卿号景岳，会稽人，幼承寿峰公之教得观内经，确信天地人之理尽备于此，出而治病一以内经为主，小试小效大试大效，历三十年易稿数四，合灵素为一分十二类成类经三十二卷又图翼附翼，以启其秘而公于人
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%B1%BB%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E7%B1%BB%E7%BB%8F.md
endeavors:
- id: guji-张介宾-endeavor-1
  title_zh: 宗内经而临证济世
  summary_zh: 以内经为主治世之病，不为仲景叔和河间丹溪所用而用之，治叶秉敬久泻及叶母而显效
  phases:
  - key: brewing
    name: 幼禀明慧承家学经
    labels:
      zh: 潜修涵养
    start_date: 1570
    highlight_event_id: guji-张介宾-event-birth
  - key: breakthrough
    name: 出而治病无所不效
    labels:
      zh: 临证初效
    start_date: 1590
    highlight_event_id: guji-张介宾-event-meet-ye
  - key: climax
    name: 温补治火衰久泻全瘥
    labels:
      zh: 独断温补
    start_date: 1603
    highlight_event_id: guji-张介宾-event-meet-ye
  - key: closure
    name: 治太安人延寿八载
    labels:
      zh: 仁术延龄
    start_date: 1615
    highlight_event_id: guji-张介宾-event-cure-mother
  decisions:
  - date: 1603
    title_zh: 以火衰立论用参术桂附
    rationale: 叶秉敬病泄泻二十年众以为火盛，独断为命门火衰，培火而脾肾还元，服五年全瘥
  - date: 1610
    title_zh: 用诸家而不为诸家用
    rationale: 关格脉候病机传经诸说多误，当主持内经辨阴阳表里虚实，不沿袭难经脉经原病式之舛
- id: guji-张介宾-endeavor-2
  title_zh: 合灵素著类经图翼
  summary_zh: 遍索两经合为一，分十二类汇三十二卷，益以图翼附翼，于天启四年成书付梓
  phases:
  - key: brewing
    name: 究心内经为摘要自资
    labels:
      zh: 研经积绪
    start_date: 1595
    highlight_event_id: guji-张介宾-event-meet-ye
  - key: breakthrough
    name: 鉴扁鹊皇甫谧王冰滑寿而决意分类
    labels:
      zh: 决意从类
    start_date: 1610
    highlight_event_id: guji-张介宾-event-cure-mother
  - key: climax
    name: 分十二类汇三十二卷三百九十条
    labels:
      zh: 类分著述
    start_date: 1620
    highlight_event_id: guji-张介宾-event-leijing
  - key: closure
    name: 增图翼附翼天启甲子付梓
    labels:
      zh: 成书刊行
    start_date: 1624
    highlight_event_id: guji-张介宾-event-leijing
  decisions:
  - date: 1620
    title_zh: 尽易旧制从类分门
    rationale: 经文奥衍互见深藏不便检阅，唯合灵枢启素问之微，素问发灵枢之秘，分摄生阴阳藏象等十二类方能晰其韫
  - date: 1624
    title_zh: 驳正先贤不讳舛错
    rationale: 王注改明为名难经论无形命门之类掩质埋光，人心讹以传讹，辨之不力终无救正日，故补缺正讹发隐就明
events:
- id: guji-张介宾-event-birth
  title_zh: 生于会稽
  date: 1563
  year_of: 1563
  place_zh: 浙江会稽
  summary_zh: 明嘉靖四十二年生，名介宾字会卿号景岳，幼禀明慧，博考六经诸子百家，从寿峰公得观内经
- id: guji-张介宾-event-meet-ye
  title_zh: 癸卯交叶秉敬治久泻
  date: 1603
  year_of: 1603
  place_zh: 会稽
  summary_zh: 自癸卯与叶秉敬交，叶病泄泻二十年众言火盛，独断为火衰，用参术桂附培命门之火，服五年全瘥而脾肾还元
- id: guji-张介宾-event-cure-mother
  title_zh: 治叶母太安人延寿八载
  date: 1615
  year_of: 1615
  place_zh: 汴梁
  summary_zh: 叶秉敬官汴梁迎治其母太安人，调治延寿八载，时类经尚未竣，医名益著
- id: guji-张介宾-event-leijing
  title_zh: 类经成书请序付梓
  date: 1624-08-01
  year_of: 1624
  place_zh: 会稽峥嵘山下
  summary_zh: 历三十年易稿数四成类经三十二卷图翼十一卷附翼四卷，自会稽过姚水示叶秉敬，叶序之于天启四年甲子，合羲易内经而两相发明
- id: guji-张介宾-event-death
  title_zh: 卒于明末
  date: 1640
  year_of: 1640
  place_zh: 浙江会稽
  summary_zh: 明崇祯十三年卒，一生宗轩岐发明内经，著类经景岳全书等，启后学由堂入室之门
