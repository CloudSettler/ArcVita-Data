  reign_ref: 金世宗大定至金哀宗正大
  archetype: 攻邪医宗
  dilemmas:
  - 伤寒初觉疑似之间解表恐伤里攻里恐伤表当如何表里双解
  - 攻里当用寒凉发表当用热世人拘泥寒热当从病还是从司气时令
  - 汗法只知桂枝麻黄为热汗凉药亦能发汗当守温发还是用凉发
  lesson: 邪去则正安攻邪即所以扶正当审病机而汗吐下并施不拘寒热常法
  summary_first_person: 吾张从正字子和号戴人睢州考城人也师守真而主攻邪世畏寒凉而吾独以汗吐下祛邪为要作双解散法及伤寒心镜别集以明表里寒热之变愿后学穷理知几勿为人侮而后受制
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/伤寒心境别集.md
  - https://daizhige.org/医藏/伤寒心境别集.html
endeavors:
- id: guji-张从正-endeavor-1
  title_zh: 演双解散倡汗吐下攻邪
  summary_zh: 承刘完素双解散而增探吐酸辣投汗之法明凉药亦能发汗攻里必用寒凉以行攻邪三法
  phases:
  - key: brewing
    name: 师守真研习寒凉通圣益元
    labels:
      zh: 酝酿
    start_date: '1190'
    highlight_event_id: guji-张从正-event-birth
  - key: breakthrough
    name: 演双解煎饮半吐风痰半覆汗
    labels:
      zh: 突破
    start_date: '1205'
    highlight_event_id: guji-张从正-event-practice
  - key: climax
    name: 立论凉药发汗百无一损
    labels:
      zh: 高潮
    start_date: '1215'
    highlight_event_id: guji-张从正-event-book
  - key: closure
    name: 示人桂枝承气随病俱出
    labels:
      zh: 收束
    start_date: '1225'
    highlight_event_id: guji-张从正-event-book
  decisions:
  - date: '1205'
    title_zh: 增双解散为半饮探吐法
    rationale: 双解表里齐解而间有不解故先吐风痰再以酸辣近火覆汗以尽八九分之效
  - date: '1215'
    title_zh: 改温发为凉发辛甘发散
    rationale: 热药汗不出反益病凉药益元薄荷白粥葱食皆能汗故用凉发以全无损
- id: guji-张从正-endeavor-2
  title_zh: 考六经传变著心镜别集
  summary_zh: 辨伤寒只传足六经之逆传引阴阳杂合论及六气顺逆释攻里不远寒发表不远热并论挦衣撮空与亢害承制
  phases:
  - key: brewing
    name: 疑庞安常足经相生贼邪之凿
    labels:
      zh: 酝酿
    start_date: '1208'
    highlight_event_id: guji-张从正-event-practice
  - key: breakthrough
    name: 引杂合论证太阳至少阴逆传
    labels:
      zh: 突破
    start_date: '1218'
    highlight_event_id: guji-张从正-event-book
  - key: climax
    name: 撰别集七节论传经攻发
    labels:
      zh: 高潮
    start_date: '1222'
    highlight_event_id: guji-张从正-event-book
  - key: closure
    name: 以亢害承制诫人自侮受侮
    labels:
      zh: 收束
    start_date: '1226'
    highlight_event_id: guji-张从正-event-death
  decisions:
  - date: '1218'
    title_zh: 断伤寒逆传足六经
    rationale: 伤寒中风得之于阴又合厥阴至少阳六气逆序故不传手经而正传足经阴中之阴阳中之阴
  - date: '1222'
    title_zh: 释不远寒热为不远司气
    rationale: 严寒用寒药盛暑用热药不畏天时只问当攻当发以破世人疑攻里用寒发表用热之似是而非
