    rationale: 为长沙太守仍每月初一十五坐堂诊视，欲亲见脉证寒热虚实，使经方得验于时疫
  - date: '0205-01-01'
    title_zh: 分中风伤寒用桂枝麻黄
    rationale: 太阳中风脉浮缓自汗用桂枝解肌，伤寒脉浮紧无汗用麻黄发汗，审脉辨汗以定开阖，不可混施以致坏逆
