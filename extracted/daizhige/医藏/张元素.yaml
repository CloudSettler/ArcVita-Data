    rationale: 进士路断，不慕虚名，转求活人之术，以医明道济世
  - date: 1195
    title_zh: 往候刘完素伤寒并处方取效
    rationale: 审脉辨证知标本，不拘常法，以对证之药挽危证，遂立声名
