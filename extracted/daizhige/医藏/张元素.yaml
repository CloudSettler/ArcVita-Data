  - date: 1205
    title_zh: 摭内经之要分门立论
    rationale: 以原道明性命，以原脉决生死，以病机统百病之本，使理法方药相贯
  - date: 1208
    title_zh: 制双解通圣辛凉之剂不专峻用辛温
    rationale: 察五运六气世态居民之变，发表不远热攻里不远寒，免辛热致衂血发斑之祸
events:
- id: guji-张元素-event-birth
  date: 1151
  title_zh: 生于易州
  description_zh: 金皇统末生于易州，字洁古，幼颖悟，八岁即应童子举
- id: guji-张元素-event-child-exam
  date: 1159
  title_zh: 八岁应童子举
  description_zh: 幼年应童子举，稍长试进士，研习儒业，为转医前之积累
- id: guji-张元素-event-turn-medicine
  date: 1178
  title_zh: 二十七试进士犯讳下第去而学医
  description_zh: 二十七岁试进士以犯庙讳下第，乃去而学医，精通其术，遂以医显
- id: guji-张元素-event-cure-liu
  date: 1195
  title_zh: 治刘完素伤寒八日而愈遂显名
  description_zh: 刘完素病伤寒八日头痛脉紧呕逆不食， elements往候令服某药，大服如其言遂愈，自此显名，足以自成一家
- id: guji-张元素-event-book
  date: 1208
  title_zh: 撰成保命集三卷三十二门
  description_zh: 抒平生心得述为保命集，首原道原脉摄生阴阳察色伤寒病机诸论，次本草处方君臣佐使加减之法，于医理精蕴阐发深至
- id: guji-张元素-event-publish
  date: 1232
  title_zh: 金末杨威得本刊行后世辨归元素
  description_zh: 书初罕传播，金末杨威得其本于东原长清王庆先家刊行，初误题刘完素著，明初沿误并伪撰序，至李时珍作本草纲目始纠谬定为元素所作，四库特为改正并删伪序
- id: guji-张元素-event-death
  date: 1234
  title_zh: 卒于金末
  description_zh: 金天兴末卒，一生以医明道，其洁古之学经后人传述大行于世
