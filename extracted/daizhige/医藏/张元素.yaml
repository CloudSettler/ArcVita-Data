    title_zh: 舍守古方专究脏腑标本
    rationale: 以身体内外阴阳分标本以先后传变为标本先治其本后治其标急则治标定泻子补母之则
  - date: 1205
    title_zh: 以气味厚薄定升降浮沉补泻
    rationale: 以味薄升气薄降气厚浮味厚沉配四时肝心肺肾分辛甘酸苦咸归经使药各有所引
