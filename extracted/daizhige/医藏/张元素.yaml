  dilemmas:
  - 年少举业受挫后是固守儒途还是转而学医济世
  - 面对托名附会之风是借重权威还是坚持自成一家阐发真理
  lesson: 舍举业而专医道，审标本察病机，以清凉制风热，以寒胜热，著书立说以保命全生
  summary_first_person: 吾张元素，字洁古，易州人，八岁应童子举，二十七试进士以犯庙讳下第，乃去而学医，精研内经仲景之旨，抒平生心得撰保命集三卷三十二门，首原道原脉摄生阴阳，次病机本草处方用药，欲使后之医者审病机无失气宜，保命全生
  source_urls:
