    title_zh: 托云林作序广传海内
    rationale: 借先儒序跋以彰脉道之大致养命之功于共济
events:
- id: guji-张太素-event-birth
  title_zh: 出生号青城山人
  date: '1540'
  year_of: 1540
  description_zh: 明嘉靖末约生于青城通晓儒学渐精医道立志穷究性命造化之微
- id: guji-张太素-event-1
  title_zh: 摘内经研叔和以五行通变
  date: '1565'
  year_of: 1565
  description_zh: 摘录内经微旨深研王叔和脉理奥义以五行为说理之具分五阳五阴四营轻清重浊体一元而通变
- id: guji-张太素-event-2
  title_zh: 著成太素脉诀诸书
  date: '1585'
  year_of: 1585
  description_zh: 著成太素张神仙脉诀玄微纲领宗统及太素脉分卷上下论造化五行八卦七表八里以断贵贱寿夭祸福疾病
- id: guji-张太素-event-3
  title_zh: 龚廷贤作序付梓刊行
  date: '1595'
  year_of: 1595
  description_zh: 豫章云林龚廷贤读其脉诀叹得先天之正抉石室之珍特作序附剞劂以共海内
- id: guji-张太素-event-death
  title_zh: 逝世
  date: '1605'
  year_of: 1605
  description_zh: 明万历末约卒生平以脉学宗匠行世其书递相传抄不绝
- id: guji-张太素-event-4
  title_zh: 收入珍本医书集成更名流传
  date: '1936'
  year_of: 1936
  description_zh: 近代名医裘吉生将其收入珍本医书集成更名订正太素脉秘诀行于世为医藏要籍
