  archetype: 咽喉专科医家
  dilemmas:
  - 喉齿专科多挟技自珍索重价延时效而病者涩嗌须臾难忍当守秘牟利还是绘图述方公开以济众
  - 咽喉初起多风热火症而寒凉误投则上热未除中寒复生当峻用寒凉速退还是先涌痰发表后清解以保中气
  lesson: 咽喉为百节之关呼吸饮食之门虽小症而关生死医者当破密藏之私以图方公之于世使舟车仓猝亦可按症辨治
  summary_first_person: 吾张宋良专研咽喉与吴氏共参喉痹乳蛾缠喉诸症之源流观左右咽喉分属胃肺辨风寒火湿毒虚六因立先漱涌痰点刺吹药之法汇子丑寅卯巳申诸丹及煎方针穴绘图备症而成咽喉秘集愿后人不为巫匠之心而为活人之具
  source_urls:
