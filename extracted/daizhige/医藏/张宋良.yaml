  title_zh: 合张吴两家图说丹方成咽喉秘集
  summary: 采集吴氏二十四症歌诀及子丑寅卯辰巳午未申酉诸丹与回雪品雪喉科第一要药诸方并撰张氏七十二症图说如帘珠喉呛食哑喉内外肿喉风热喉紫色虚喉喉癣喉疳之属各述原处方外吹内煎使不习者亦可操药取效
