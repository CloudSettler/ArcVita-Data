      zh: 辨脓决泄
    start_date: 1914-01-01
    highlight_event_id: guji-张山雷-event-2
  - key: closure
    name: 垂教溃后辨脓水虚实
    labels:
      zh: 善后调治
    start_date: 1920-01-01
    highlight_event_id: guji-张山雷-event-2
  decisions:
  - date: 1914-01-01
    title_zh: 主张漫肿坚巨早辨脓早决泄
    rationale: 脓成三五日不决势必内溃日深穿肠破膜即为坏证早一日泄毒即少一步内攻
  - date: 1920-01-01
    title_zh: 分溃后脓水浓清辨虚实治之
    rationale: 脓水浓浓者毒未净为实宜清理脓水清澈者正不足为虚宜扶持托补
