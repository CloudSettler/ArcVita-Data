  decisions:
  - date: 1912-01-01
    title_zh: 否定以痈疽二字判阴阳
    rationale: 痈者壅也疽者沮也皆气血壅闭之意本为笼统之名无轩轻之别当从虚实浅深辨之
  - date: 1914-01-01
    title_zh: 以气血虚实病源浅深为辨证大纲
    rationale: 望色辨脉兼验舌苔从大处着想则为阴为阳属虚属实易辨若仅据地位形色则目光短浅
- id: guji-张山雷-endeavor-2
  title_zh: 详肿痛辨脓垂法救危亡
  summary: 以病源浅深缓急部位虚实险夷为纲详肿之聚散痛之源流痒之风湿酸楚顽木之虚实辨脓按诊提透早决之法以防内溃穿肠毒陷
  phases:
