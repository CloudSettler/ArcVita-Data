  dilemmas:
  - 守古方痈疽之名与求训诂本义难以两全
  - 执外形红肿硬软为据与察气血虚实病源浅深易生偏执
  lesson: 辨证必究源流审虚实浅深缓急不可拘于方寸形色
  summary_first_person: 吾名寿颐以字山雷行浙江嘉兴人也早岁攻经史旁究医理见世之治外科者宗王洪绪以高突红肿为痈为阳坚块不红为疽为阴拘于表面而不察虚实浅深遂发愤著疡科纲要正名辨义详论阴阳肿痛痒酸顽木辨脓之法愿后学融会贯通见微知著不贻误夭殃
  source_urls:
