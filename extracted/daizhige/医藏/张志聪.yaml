  reign_ref: 康熙
  archetype: 医经集注者
  dilemmas:
  - title_zh: 从成无己旧说还是返本灵素
    description_zh: 成氏风伤卫寒伤荣之说流传已久，随声附和则易，推倒重立以灵素经旨解仲景则劳而多谤
  - title_zh: 散注条文还是汇节分章
    description_zh: 旧注散叙平铺失其纲领，若汇数节为一章拈其总纲恐招僭越之讥，不为则本论终如断简残篇
  lesson: 注经须童习白首，日积月累，以灵素为本，汇节分章而后能明仲景无中生有之元机
  summary_first_person: 吾钱塘张志聪号隐庵，自童年习内经仲景之书，甲午以后二十年每旦焚香盥手开卷举笔，夜思昼录，庚子成伤寒初集，继成金匮素问灵枢诸注，复聚同学及门讲求参订而成二集，愿后人由仲景之门而登轩岐之岸
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E5%AF%92%E8%AE%BA%E9%9B%86%E6%B3%A8.md
