      raw: 康熙十三年左右卒
  birth_date: '1616'
  death_date: '1674'
  era: 明末清初
  reign_ref: 康熙
  archetype: 医经注疏家
  dilemmas:
  - 同者若异异者若同是否当辩
  - 遵黄岐圣经还是从后人异说
  - 好辩之名与阐圣纠讹之实如何自处
  lesson: 辩以明同异，知同所以异，知异所以同，同不为异，异不为同，则无事辩矣
  summary_first_person: 余家胥山之阴，峨嵋之麓，就石筑轩而坐卧其中几三十年，去冬素问成，慨既阐圣绪仍任习讹，遂错综尽蕴参伍考详，随类而辩，以明血气脏腑阴阳之同异
  source_urls:
