  birth_date: 1610-01-01
  death_date: 1674-01-01
  era: 明末清初
  reign_ref: 康熙
  archetype: 运气明性之医经注家
  dilemmas:
  - 只言治病袭其用与穷原明性知其体之辨
  - 遵神农本经运气正理与从后人臆说逐末之择
  - 补泻寒热升降皆归五运六气还是但凭经验试药之疑
  lesson: 知其性而用之则用之有本神变无方，袭其用而用之则窒碍难通
  summary_first_person: 余名志聪号隐庵钱塘人也，生于晚明长于鼎革，少习儒而转究岐黄，仰观天之六气俯察地之五行，惧后人不明本经但言某药治某病，遂集注素问灵枢伤寒金匮，又诠释神农本经著为崇原一书，端本五运六气辨五行五方五时五色五臭五味，以明寒热升降补泻之理，愿学人会悟格物致知三才合一之道
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/本草崇原.md
  - https://daizhige.org/医藏/本草崇原.html
endeavors:
- id: guji-张志聪-endeavor-1
  title_zh: 集注内经伤寒奠定运气医理
  summary: 会通素问灵枢伤寒金匮诸书，以五运六气三阴三阳为纲，删繁正讹，为后学立穷理尽性之基
  phases:
  - key: brewing
    name: 钱塘习儒转医
    labels:
      zh: 求道
    start_date: 1630-01-01
    highlight_event_id: guji-张志聪-event-xueyi
  - key: breakthrough
    name: 参悟运气合参脏腑经脉
    labels:
      zh: 悟道
    start_date: 1655-01-01
    highlight_event_id: guji-张志聪-event-neijing
  - key: climax
    name: 集注素问灵枢刊行于世
    labels:
      zh: 立言
    start_date: 1669-01-01
    highlight_event_id: guji-张志聪-event-neijing
  - key: closure
    name: 注伤寒金匮以全经方之学
    labels:
      zh: 传道
    start_date: 1670-01-01
    highlight_event_id: guji-张志聪-event-neijing
  decisions:
  - date: 1655-01-01
    title_zh: 舍举业而专攻岐黄
    rationale: 以天下病苦为念，欲以医明天地人身合一之理，不逐科名
  - date: 1669-01-01
    title_zh: 以运气为纲集注内经
    rationale: 以五运六气统摄脏腑经脉寒热虚实，使古奥之言了如指掌
- id: guji-张志聪-endeavor-2
  title_zh: 诠释本经著本草崇原以明药性
  summary: 阐发神农本草经三百六十五种上中下品之义，以五运六气辨药性之原，纠后世只言治病不探其原之弊
  phases:
  - key: brewing
    name: 辨白术苍术考产地气味
    labels:
      zh: 格物
    start_date: 1668-01-01
    highlight_event_id: guji-张志聪-event-bencao
  - key: breakthrough
    name: 立五运六气辨性纲领
    labels:
      zh: 明理
    start_date: 1670-01-01
    highlight_event_id: guji-张志聪-event-bencao
  - key: climax
    name: 逐味诠释上品以人参甘草为首
    labels:
      zh: 阐微
    start_date: 1672-01-01
    highlight_event_id: guji-张志聪-event-bencao
  - key: closure
    name: 成崇原一书屏斥讹谬臆说
    labels:
      zh: 正源
    start_date: 1673-01-01
    highlight_event_id: guji-张志聪-event-bencao
  decisions:
  - date: 1670-01-01
    title_zh: 端本五运六气诠释本经
    rationale: 天地万物不外五行五方五时五色五臭五味，非此不能明升降补泻
  - date: 1672-01-01
    title_zh: 概置后人逐末忘本臆说不录
    rationale: 后世但言某药治某病是药用非药性，当存其原而屏其谬
events:
- id: guji-张志聪-event-birth
  date: 1610-01-01
  year_of: 1610
  title_zh: 生于钱塘
  description: 明万历末年生于浙江钱塘，张氏望族，少聪慧习儒
  place: 钱塘
- id: guji-张志聪-event-xueyi
  date: 1645-01-01
  year_of: 1645
  title_zh: 鼎革后专志于医
  description: 明亡之后绝意仕进，究心黄帝内经神农本草，交游高士，考辨药物产地气味
  place: 杭州
- id: guji-张志聪-event-neijing
  date: 1669-01-01
  year_of: 1669
  title_zh: 黄帝内经集注成书
  description: 集注素问九卷灵枢九卷成书，以运气统六气三阴三阳，以五行统脏腑经脉，为清初医经注疏之宗
  place: 杭州
- id: guji-张志聪-event-bencao
  date: 1672-01-01
  year_of: 1672
  title_zh: 本草崇原诠释本经药性
  description: 诠释神农本草经，以人参甘草黄芪白术山药石斛等上品为首倡，明五运六气寒热温凉补泻之原，辨苍术白术之分，正酸枣仁气味之讹
  place: 杭州
- id: guji-张志聪-event-death
  date: 1674-01-01
  year_of: 1674
  title_zh: 卒于康熙十三年
  description: 注述既成，门人吕子宫等传其学，隐庵之学遂为浙派运气之源
  place: 杭州
