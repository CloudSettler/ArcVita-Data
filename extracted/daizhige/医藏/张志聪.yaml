  archetype: 医经集注者
  dilemmas:
  - 经传而经亡，精义失于粗守，后学沿习针传而昧理，救经当从本原诠释
  - 素问主病所由生以谨防其流，灵枢主病所由治以通其源，二者须贯通三才而不可偏废
  lesson: 以理会针，因针悟证，察阴阳血气之逆顺出入，合天地人三才之道，方能使圣经不灭而惠世长存
  summary_first_person: 余钱塘张志聪，字隐庵，悯圣经失传，惧后学沿习，殚心研虑，先成素问注疏，复藉同学举灵枢而诠释之，鸡鸣风雨未敢少休，愿后人读素问而严病所起，读灵枢而识病所瘳
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%BB%84%E5%B8%9D%E5%86%85%E7%BB%8F%E7%81%B5%E6%9E%A2%E9%9B%86%E6%B3%A8.md
