  decisions:
  - date: 1660
    title_zh: 驳正成氏风寒荣卫之谬
    rationale: 风寒皆先客皮毛后入肌腠，不可执风必伤卫寒必伤荣及麻黄桂枝分治之死法
  - date: 1671
    title_zh: 汇节分章拈总纲明大旨
    rationale: 本论三百八十一证散叙则如断简，合数节十余节为一章则理明义尽，读论者因证识正气因治知经脉
