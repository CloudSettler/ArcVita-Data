  description_zh: 与同学辨析阴阳寒暑五运六气，成黄帝内经素问集注，严病之所以起
- id: guji-张志聪-event-lingshu
  date: 1672
  year_of: 1672
  title_zh: 灵枢集注作序于西泠怡堂
  description_zh: 康熙壬子葵夏成黄帝内经灵枢集注八十一篇，论九针十二原营卫血气，明病之所以瘳
- id: guji-张志聪-event-death
  date: 1674
  year_of: 1674
  title_zh: 卒于清康熙十三年
  description_zh: 以医经注疏惠及后学，门人高士宗等续传其学，集注素问灵枢并行于世
