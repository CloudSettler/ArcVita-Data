endeavors:
- id: guji-张志聪-endeavor-1
  title_zh: 坐轩三十年集注素问
  summary_zh: 于侣山轩潜修博览群经贯通血气生始出入，至己酉秋完成内经注疏以阐圣绪
  phases:
  - key: brewing
    name: 胥山筑轩潜修
    labels:
      zh: 侣山潜修
    start_date: '1640'
    highlight_event_id: guji-张志聪-event-birth
  - key: breakthrough
    name: 博览群经得血气源流
    labels:
      zh: 悟道
    start_date: '1660'
    highlight_event_id: guji-张志聪-event-suwen
  - key: climax
    name: 己酉秋内经甫竣
    labels:
      zh: 素问成
    start_date: '1669'
    highlight_event_id: guji-张志聪-event-suwen
  - key: closure
    name: 素问渐次问世
    labels:
      zh: 刊行
    start_date: '1669'
    highlight_event_id: guji-张志聪-event-suwen
  decisions:
  - date: '1669'
    title_zh: 以圣经贯通三焦包络督脉
    rationale: 后人不通群经各执一偏，故归三焦部署于中胃上下，合包络于君相二火，考督脉分合于两肾，以正命门诸说之讹
  - date: '1669'
    title_zh: 竣成素问再发类辩之愿
    rationale: 既阐圣绪仍任习讹，譬比倒澜等同鸥泛，故当错综尽蕴随类而辩
- id: guji-张志聪-endeavor-2
  title_zh: 著侣山堂类辩明同异
  summary_zh: 自庚戌正阳月前成类辩上卷，辩血气两肾三焦包络督脉脏腑阴阳九窍七门及四时亢承脉法，以息数千年聚讼
  phases:
  - key: brewing
    name: 夜泛西泠闻三焦聚讼
    labels:
      zh: 聚讼
    start_date: '1669'
    highlight_event_id: guji-张志聪-event-suwen
  - key: breakthrough
    name: 立同异之辩例
    labels:
      zh: 立例
    start_date: '1670'
    highlight_event_id: guji-张志聪-event-leibian
  - key: climax
    name: 庚戌正阳月类辩书成
    labels:
      zh: 类辩成
    start_date: '1670'
    highlight_event_id: guji-张志聪-event-leibian
  - key: closure
    name: 岩池花阑自序以传后世
    labels:
      zh: 自序
    start_date: '1670'
    highlight_event_id: guji-张志聪-event-leibian
  decisions:
  - date: '1670'
    title_zh: 辩血分表里经隧以正吐血之误
    rationale: 俗谓吐血多从胃出属阳明多血，不知血生于中焦散于肤腠行于经隧，须审源流分经治之
  - date: '1670'
    title_zh: 辩两肾分合以黜命门居中之说
    rationale: 内经止言两肾配合三焦膀胱，一合包络为相火，一合膀胱为水脏，坎满之喻无离虚所配，故当潜心圣经不为异说所惑
events:
- id: guji-张志聪-event-birth
  date: '1616'
  year_of: '1616'
  title_zh: 生于杭州胥山之阴
  description_zh: 明末生于杭州，家近峨嵋麓石林，后筑侣山轩而居
- id: guji-张志聪-event-suwen
  date: '1669'
  year_of: '1669'
  title_zh: 己酉秋内经注成
  description_zh: 康熙己酉八月既望前完成素问集注，偕友夜泛西泠论三焦有形无形之旨
- id: guji-张志聪-event-leibian
  date: '1670'
  year_of: '1670'
  title_zh: 庚戌正阳月侣山堂类辩序成
  description_zh: 于岩池花阑自序类辩上卷，首明同异可辩之例，次辩血气肾焦包络督脉阴阳窍门时气脉法诸条
- id: guji-张志聪-event-death
  date: '1674'
  year_of: '1674'
  title_zh: 卒于清康熙年间
  description_zh: 类辩既传，医林奉为注经宗匠，卒后其侣山轩著述盛行于世
