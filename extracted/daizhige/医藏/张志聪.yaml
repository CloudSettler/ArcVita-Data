  decisions:
  - date: 1660
    title_zh: 先灵枢后素问之辨转为先成素问注疏
    rationale: 以素问示人维持防流，生患既微，方可藉灵枢通源开导，惠世之泽方长
  - date: 1669
    title_zh: 藉同学诸公共成疏义
    rationale: 经意深微一字一理，独力难穷三才之备，众研方能确有指归
- id: guji-张志聪-endeavor-2
  title_zh: 集注灵枢以识病所由瘳
  summary_zh: 诠释九针十二原营卫经脉之道路，起黄钟之数，合河图洛书，因九针悟证，使脏腑贯通经脉出入
  phases:
  - key: brewing
    name: 悯甲乙针经昧理而发愿重诠
    labels:
      zh: 酝酿
    start_date: 1669
    highlight_event_id: guji-张志聪-event-suwen
  - key: breakthrough
    name: 以理会针因针悟证研九针小针
    labels:
      zh: 突破
    start_date: 1670
    highlight_event_id: guji-张志聪-event-lingshu
  - key: climax
    name: 灵枢集注成书作序西泠怡堂
    labels:
      zh: 高潮
    start_date: 1672
    highlight_event_id: guji-张志聪-event-lingshu
  - key: closure
    name: 示三才九针同法以传后世
    labels:
      zh: 收束
    start_date: 1672
    highlight_event_id: guji-张志聪-event-lingshu
  decisions:
  - date: 1670
    title_zh: 驳专言针而昧理复立经纪终始
    rationale: 后世指灵枢为针传而忽之，经几为赘旒，必明为法令终不灭，易用难忘
  - date: 1672
    title_zh: 以八十一篇应九九合三才立九针小针之法
    rationale: 人与天地相参日月相应，始于一终于九以起黄钟之数，方能修身治国平天下
events:
