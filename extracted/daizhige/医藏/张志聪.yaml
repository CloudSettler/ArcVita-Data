  - date: 1654
    title_zh: 以灵素补仲景之未尽
    rationale: 仲祖撰论本灵素，必明撰论之原，玩索原序而后观集注始无间然
  - date: 1667
    title_zh: 会通六气而不泥形迹
    rationale: 三阳三阴乃人身经气，不可但指膀胱胃胆有形之腑，当明天人相参之大义
- id: guji-张志聪-endeavor-2
  title_zh: 集注伤寒金匮以明六气传变
  summary_zh: 先证后脉重编伤寒，汇节分章作集注，辨太阳阳明至少阴厥阴，兼成金匮要略注
