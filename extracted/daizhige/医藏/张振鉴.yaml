events:
- id: guji-张振鉴-event-birth
  title_zh: 出生于宝应
  date: 1838
  year_of: 1838
  description: 生于宝应原名醴泉字筱衫号惕厉子又号广文肆力岐黄
- id: guji-张振鉴-event-shoude
  title_zh: 丁亥夏受托得推拿秘诀
  date: 1887-06-01
  year_of: 1887
  description: 京江张心樵以族弟地山所遗推拿秘诀二册谆谆属余厘订
- id: guji-张振鉴-event-kaoding
  title_zh: 考定为周于蕃推拿要诀
  date: 1888-01-01
  year_of: 1888
  description: 自首至末五阅始悉乃明万历楚人周于蕃所著付梓者三次序错乱辞语鄙陋
- id: guji-张振鉴-event-bianzuan
  title_zh: 半载厘正编次绘图
  date: 1888-06-01
  year_of: 1888
  description: 汰重复删繁芜理颠倒易俚俗更采先哲名言外治良法辨证立法考穴绘图
- id: guji-张振鉴-event-kanke
  title_zh: 戊子冬刊刻厘正按摩要术
  date: 1888-12-01
  year_of: 1888
  description: 书成于邗上旅次冠以凡例绘厥原图醵资刊刻广惠婴孩家置一编
- id: guji-张振鉴-event-bolan
  title_zh: 城东行医博览方书
  date: 1880-01-01
  year_of: 1880
  description: 居城东远近就医户外履满室中医书数百分门别类审慎周详
- id: guji-张振鉴-event-zhiyi
  title_zh: 江北治疫邻里皆痊
  date: 1890-03-01
  year_of: 1890
  description: 庚寅春移家江北与邻结庐疫传几遍医治皆痊谈论极洽得读述古斋医书
- id: guji-张振鉴-event-huisheng
  title_zh: 审证制方回生起死
  date: 1890-06-01
  year_of: 1890
  description: 每治一症必审慎周详每出一方便回生起死以施济为念戒视人死如儿戏
- id: guji-张振鉴-event-zhushu
  title_zh: 述古斋医书三种传世
  date: 1891-02-01
  year_of: 1891
  description: 所著述古斋医书三种语不矜奇法皆师古辨证明晰制方变化以贻后世
- id: guji-张振鉴-event-death
  title_zh: 卒于清末
  date: 1905
  year_of: 1905
  description: 乐善不倦仁闻素昭后立按摩正传并痧喉痘疹诸续刻以活人传世
