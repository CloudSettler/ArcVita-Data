  dilemmas:
  - 治已疾之按摩与治未疾之保婴孰重，欲以防患未然补救于萌
  - 婴儿疾痛不能言汤药不肯服，乳母隐微致病而医家不知当如何究源
  lesson: 保婴必先保母，防患于未然，家置一编仿而行之以为宝筏
  summary_first_person: 余宝应惕厉子张振，原名醴泉筱衫甫，见婴儿由萌而夭折者不可胜数，饥饱寒燠调养禁忌失宜，遂簇书奥旨采先哲格言，系鬻婴提要说于厘正按摩要术之后，以治未疾为志，期家置一编保婴于未病
