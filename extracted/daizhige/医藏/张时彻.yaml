  archetype: 恤民济世的儒臣医家
  dilemmas:
  - 王政多缺而荒村窭户无医可迎当守官常还是推方济众
  - 时师误人反剂杀人而病家不敢讼言当缄默自保还是直陈救弊
  - 家藏验方屡试屡验当秘为家珍还是付梓广传黔细
  lesson: 以平易可致之药传简便可施之法使贫僻之人亦得自救此仁孝之实学也
  summary_first_person: 吾四明芝园主人张时彻也少举进士历官中外睹荒村病者待毙而京师多聚佳药遂以随身急救方附益新得删其讹舛付梓以传愿天下爱身及亲者得此一方免束手待毙之苦
  source_urls:
