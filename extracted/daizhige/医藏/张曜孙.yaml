person:
  qid: guji-张曜孙
  name_zh: 张曜孙
  names:
    zh: 张曜孙
    en: Zhang Yaosun
  lifespan:
    birth:
      date: 1800-01-01
      precision: year
      is_circa: true
      raw: 清嘉庆间生，生年不详
    death:
      date: 1870-01-01
      precision: year
      is_circa: true
      raw: 清同治间卒，卒年不详
  birth_date: 1800-01-01
  death_date: 1870-01-01
  era: 清
  reign_ref: 清嘉庆至同治
  archetype: 女科济世医家
  dilemmas:
  - 秘本珍藏自守与刊布广传济世之间难以两全
  - 恪守安胎饮生化汤成法与随症增补变通之间须审慎权衡
  lesson: 胎产存亡系于呼吸，当以简明切要之法示人，神明于法之中而不偏执，方能救危急起沉疴
  summary_first_person: 吾张曜孙清代医人，家承先伯祖素园公于康熙丙寅得自荆襄道署之胎产秘本，博览医书而独珍此编，以丹溪安胎饮主胎前，以生化汤主产后，随症加减，按病论治，增补缺略，移改错乱，辑成调经种子保胎临产产后八卷，名曰胎产指南，嘱子孙珍藏熟玩，广传济世，不敢以秘自珍
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%83%8E%E4%BA%A7%E6%8C%87%E5%8D%97.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%83%8E%E4%BA%A7%E6%8C%87%E5%8D%97.html
endeavors:
- id: guji-张曜孙-endeavor-1
  title_zh: 增补辑订胎产指南八卷
  goal: 以简明切要之法统摄调经种子保胎临产产后全程
  phases:
  - key: brewing
    name: 承家藏素园公手录秘本潜心研读
    labels:
      zh: 得秘本研读
    start_date: 1820-01-01
    highlight_event_id: guji-张曜孙-event-xuexi
  - key: breakthrough
    name: 参合丹溪立斋诸家以安胎饮生化汤为纲
    labels:
      zh: 立纲领
    start_date: 1835-01-01
    highlight_event_id: guji-张曜孙-event-ligang
  - key: climax
    name: 增补缺略移改次序成八卷体系
    labels:
      zh: 增补成书
    start_date: 1845-01-01
    highlight_event_id: guji-张曜孙-event-chengshu
  - key: closure
    name: 嘱子孙珍藏熟玩付抄传广济
    labels:
      zh: 垂训广传
    start_date: 1856-05-01
    highlight_event_id: guji-张曜孙-event-kanxing
  decisions:
  - date: 1840-01-01
    title_zh: 决定增补注明不敢混真
    rationale: 原本稍有缺略次序错乱，恐误后学，故增补处特注增补二字，类入禁忌以便查览，存真以昭信
  - date: 1845-01-01
    title_zh: 决定以指南为名昭示来学
    rationale: 周公作指南车赐越裳故事，读此本病症了然无异指南，故以胎产指南名书，使学者洞如观火
- id: guji-张曜孙-endeavor-2
  title_zh: 弘扬安胎生化随症论治普救危急
  goal: 使不知脉者亦能对症检方应手取效
  phases:
  - key: brewing
    name: 博览医书比较胎产诸家简约明允之法
    labels:
      zh: 博览比较
    start_date: 1830-01-01
    highlight_event_id: guji-张曜孙-event-ligang
  - key: breakthrough
    name: 倡胎前悉主安胎饮产后悉主生化汤随症加减
    labels:
      zh: 倡主方加减
    start_date: 1848-01-01
    highlight_event_id: guji-张曜孙-event-jiji
  - key: climax
    name: 详辨难产七因产后五急十九危救危起沉
    labels:
      zh: 救危起沉
    start_date: 1850-01-01
    highlight_event_id: guji-张曜孙-event-jiji
  - key: closure
    name: 经周丹忱序欧孔章陈彩盅梓行附女科医案广传
    labels:
      zh: 梓行广传
    start_date: 1856-10-01
    highlight_event_id: guji-张曜孙-event-kanxing
  decisions:
  - date: 1848-01-01
    title_zh: 决定力主生化汤为产后圣方兼行滞补虚
    rationale: 产后气血大虚且有瘀滞，诸症皆以末治，大补气血兼行滞者唯生化汤最切，故以之统产后全科
  - date: 1850-01-01
    title_zh: 决定痛斥瘦胎耗气及偏执落胎之弊
    rationale: 香附耗气瘦胎及妄议落胎救母皆害母损子，临产七日调护须神明于法，故明辨以正人心救存亡
events:
- id: guji-张曜孙-event-birth
  title_zh: 出生
  type: birth
  date: 1800-01-01
  year_of: 1800
  description: 清嘉庆间出生，承素园公家学，博览医书而专精胎产
- id: guji-张曜孙-event-xuexi
  title_zh: 得家藏秘本潜心研读
  type: career
  date: 1820-01-01
  year_of: 1820
  description: 得先伯祖素园公于康熙丙寅荆襄道署所得手录原本，熟玩胎前产后方论
- id: guji-张曜孙-event-ligang
  title_zh: 立安胎饮生化汤为纲领
  type: career
  date: 1835-01-01
  year_of: 1835
  description: 参合朱丹溪薛立斋诸家，定胎前以安胎饮为主产后以生化汤为主随症加减之宗旨
- id: guji-张曜孙-event-chengshu
  title_zh: 增补辑成胎产指南八卷
  type: career
  date: 1845-01-01
  year_of: 1845
  description: 增补调经种子保胎临产产后缺略，移改产忌食物乡俗十弊用药十误入卷五，成八卷体系
- id: guji-张曜孙-event-jiji
  title_zh: 详辨危症普救产厄
  type: career
  date: 1850-01-01
  year_of: 1850
  description: 详论难产七因子死腹中盘肠生产后五急十九危二十九症三十二症，使对症检方有径辙可循
- id: guji-张曜孙-event-kanxing
  title_zh: 周序梓行广传济世
  type: career
  date: 1856-10-01
  year_of: 1856
  description: 咸丰六年菊月周丹忱作序，欧孔章陈彩盅梓行胎产指南并附伊芳学曾女科医案，不以秘自珍而广其传
- id: guji-张曜孙-event-death
  title_zh: 逝世
  type: death
  date: 1870-01-01
  year_of: 1870
  description: 清同治间逝世，其书仍为枕中秘宝，后人奉为再造青囊济世灵药
