endeavors:
- id: guji-张曜孙-endeavor-1
  title_zh: 重订产孕集以明辨孕养孕
  summary_zh: 博采素问脉经千金诸家论脉辨孕之法详述十月分经养胎方药以正误孕误疾之失
  phases:
  - key: brewing
    name: 博采古方考辨孕脉
    labels:
      zh: 辨孕
    start_date: 1850
    highlight_event_id: guji-张曜孙-event-1
  - key: breakthrough
    name: 分月养胎集成方论
    labels:
      zh: 养孕
    start_date: 1855
    highlight_event_id: guji-张曜孙-event-2
  - key: closure
    name: 重订成书付梓流传
    labels:
      zh: 成书
    start_date: 1860
    highlight_event_id: guji-张曜孙-event-2
  decisions:
  - date: 1850
    title_zh: 以脉合证辨孕是非
    rationale: 脉象微妙易误为疾故以滑利和平合经闭恶阻诸候参验以免攻伐伤胎
  - date: 1855
    title_zh: 按月分经论养立补胎诸方
    rationale: 胎随月长各经主养故遵徐之才十月养胎之说分月调摄以安固胎元
- id: guji-张曜孙-endeavor-2
  title_zh: 立胎教孕宜孕忌以全母子
  summary_zh: 阐发母气育子胎教感化之理申明居处饮食情志禁忌兼论妊娠恶阻伤寒治法以护产孕
  phases:
  - key: brewing
    name: 推原祖气母气论胎教
    labels:
      zh: 胎教
    start_date: 1858
    highlight_event_id: guji-张曜孙-event-3
  - key: climax
    name: 详定孕忌孕疾护胎法
    labels:
      zh: 护胎
    start_date: 1862
    highlight_event_id: guji-张曜孙-event-4
  decisions:
  - date: 1858
    title_zh: 倡慎感养正以化胎气
    rationale: 子以母气为气母呼亦呼故慎视听言动和心志以转浊为清育贤寿之子
  - date: 1862
    title_zh: 戒交合劳役厚味以防堕难兼施有故无殒之治
    rationale: 摄养一乖即致堕落难产故立起居饮食情志诸忌而有疾则衰其大半而止以全母子
events:
- id: guji-张曜孙-event-birth
  type: birth
  title_zh: 诞生于清代
  date: 1800
  year_of: 1800
  description_zh: 清代医家张曜孙诞生生长于讲究妇人别治之世
- id: guji-张曜孙-event-1
  type: endeavor
  title_zh: 考订辨孕之法
  date: 1850
  year_of: 1850
  description_zh: 汇素问阴搏阳别脉经滑疾诸说参以雀脑芎艾汤验胎及分男女诸法以辨孕是非
- id: guji-张曜孙-event-2
  type: endeavor
  title_zh: 分月论养集成重订产孕集卷上
  date: 1860
  year_of: 1860
  description_zh: 按足厥阴起至足太阳十月分经养胎录补胎汤黄连汤茯神汤等方及达生散便产方以成重订产孕集
- id: guji-张曜孙-event-3
  type: endeavor
  title_zh: 阐发胎教孕宜之道
  date: 1858
  year_of: 1858
  description_zh: 引列女传太任胎教论祖气母气感化谓寝不侧坐不边目不视邪以育端正贤良之子
- id: guji-张曜孙-event-4
  type: endeavor
  title_zh: 申明孕忌孕疾治法
  date: 1862
  year_of: 1862
  description_zh: 首忌交合次戒登高作力暴喜暴怒厚味毒药并论恶阻橘皮茯苓汤伤寒芎苏饮等安胎治疾之法
- id: guji-张曜孙-event-death
  type: death
  title_zh: 逝世于清末
  date: 1890
  year_of: 1890
  description_zh: 清末医家张曜孙逝世所著重订产孕集流传以护产孕
