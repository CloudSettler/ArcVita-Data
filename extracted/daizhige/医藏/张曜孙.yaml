  dilemmas:
  - 误孕为疾而肆攻击与误疾为孕而养虎贻患之间难以明辨
  - 护胎固子与攻疾祛邪之间恐伤母子难以两全
  lesson: 产孕乃生人之始而保护乃产孕之始调摄贵在和平谨守胎教以全母子
  summary_first_person: 吾为清人张曜孙悯世人误孕为疾误疾为孕以致伤体伤生乃博采素问脉经千金诸说重订产孕集分辨孕养孕孕宜孕忌孕疾五章愿以摄养调摄之道护母安子
