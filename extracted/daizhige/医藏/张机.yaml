    highlight_event_id: guji-张机-event-death
  decisions:
  - date: 123
    title_zh: 直言王仲宣四十眉落之病令服五石汤
    rationale: 观其色候知病在腠理，若早服汤可免，惜其嫌言忤而不服，终如言而死，故知精诊贵在信医早治
  - date: 0208
    title_zh: 不竞荣势而留神医药坐堂断诊
    rationale: 痛凡医不念经旨按寸不及尺握手不及足相对斯须便处汤药，故以太守之身亲诊九候明堂阙庭以全生民
