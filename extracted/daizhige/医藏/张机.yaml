  dilemmas:
  - 举世竞逐荣势崇饰其末而轻生弃本与留神医药精究方术以上疗君亲下救贫贱中保身全生之抉择
  - 自恃才秀天赋难企与宿尚方术多闻博识勤求古训博采众方以精究之的进路
  lesson: 不竞荣势浮华而固根本，勤求古训博采众方，见病知源，方能济世全生
  summary_first_person: 余南阳张机，字仲景，宿尚方术，师事张伯祖，举孝廉，出守长沙，感建安以来宗族死亡三分有二伤寒居其七，伤横夭莫救，乃勤求古训博采众方，撰用素问九卷八十一难阴阳大论胎胪药录平脉辨证，合为伤寒杂病论十六卷，庶几见病知源，思过半矣
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/伤寒论辑义.md
