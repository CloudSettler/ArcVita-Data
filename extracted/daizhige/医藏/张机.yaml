    title_zh: 勤求古训博采众方
    rationale: 感往昔沦丧伤横夭莫救，不由古训无以承源，故广采素问九卷八十一难阴阳大论胎胪药录平脉辨证以立论
  - date: 136
    title_zh: 合伤寒杂病为十六卷
    rationale: 虽未能尽愈诸病，庶可使后人寻集思过半，见病知源，故不计毁誉而撰用成书
