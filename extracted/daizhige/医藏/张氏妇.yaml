endeavors:
- id: guji-张氏妇-endeavor-1
  title_zh: 调经广嗣和气血均寒热
  summary: 承神授女科首篇以调经为本察气盛血虚血盛气衰寒胜热胜之异立补血补气寒凉温暖诸法使月水如期子宫可摄以致无不育之妇
  phases:
  - key: brewing
    name: 神宿授书得女科卷
    labels:
      zh: 神授女科
    start_date: '0730-01-01'
    highlight_event_id: guji-张氏妇-event-shenshou
  - key: breakthrough
    name: 悟调经广嗣之法
    labels:
      zh: 调经广嗣
    start_date: '0735-01-01'
    highlight_event_id: guji-张氏妇-event-tiaojing
  - key: climax
    name: 立种子调经诸方传世
    labels:
      zh: 种子方传
    start_date: '0740-01-01'
    highlight_event_id: guji-张氏妇-event-tiaojing
  - key: closure
    name: 嘱好生勿秘公传医者
    labels:
      zh: 公传济世
    start_date: '0750-01-01'
    highlight_event_id: guji-张氏妇-event-taichan
  decisions:
  - date: '0735-01-01'
    title_zh: 气盛血衰不作血隔专主补血
    rationale: 月水不应期数月一至乃血不得聚子宫枯燥故慎勿破血宜补血使血配气孕乃成
  - date: '0736-01-01'
    title_zh: 血盛气衰不用养血重用参术补气
    rationale: 血随气动气衰不运积满则溢月水不月而至养血反活血益剧唯补气能配血
  - date: '0740-01-01'
    title_zh: 先期后期分寒热治种子加减
    rationale: 先期紫黑成块属热加芩连荆芥后期淡红痰多血少兼寒用二陈黑姜因寒热不均则不受孕
- id: guji-张氏妇-endeavor-2
  title_zh: 胎前安胎产后分期救危
  summary: 辨胎前以安胎为主条芩壳砂必用随症施治立逐月安胎主方辨产后二十日前破血为主二十日外补气血兼活血月外非杂症纠诸书之谬救血晕癫狂泄泻诸危
  phases:
  - key: brewing
    name: 察胎动母病不安之机
    labels:
      zh: 胎前安胎
    start_date: '0742-01-01'
    highlight_event_id: guji-张氏妇-event-taichan
  - key: breakthrough
    name: 定安胎逐月主方
    labels:
      zh: 逐月养胎
    start_date: '0745-01-01'
    highlight_event_id: guji-张氏妇-event-taichan
  - key: climax
    name: 救难产子死血晕危症
    labels:
      zh: 救产危症
    start_date: '0750-01-01'
    highlight_event_id: guji-张氏妇-event-taichan
  - key: closure
    name: 分产后月内外治法成书
    labels:
      zh: 产后分期
    start_date: '0755-01-01'
    highlight_event_id: guji-张氏妇-event-chuanfang
  decisions:
  - date: '0745-01-01'
    title_zh: 胎前患病先安胎后治病
    rationale: 受胎后气血有方胎不安则母病至胎动则病难治条芩壳砂阿胶为安胎要药
  - date: '0750-01-01'
    title_zh: 产后二十日前后异治
    rationale: 二十日前气血未定恶露未尽当破血为主二十日外气血已定归经络宜补气血兼活血月外作杂症者谬
  - date: '0752-01-01'
    title_zh: 产后干姜酒炒用芍药月外收功
    rationale: 产后冒风寒败血为祸干姜红花桃仁乌药肉桂山楂香附必少不得大热重用微热轻用芍药月外非忌能收功
