  dilemmas:
  - 家传秘术当隐而不发以保家门还是公传当世以免妇女大难
  - 胎前诸症当攻病为主还是以安胎为主稍有动则病难治
  - 产后诸症类伤寒杂症当作伤寒杂症治还是二十日前后分破血补气血治
  lesson: 得神授女科当存好生之心勿秘济世调经安胎产后前后辨明方免妇女大难
  summary_first_person: 吾乃慈邑张氏之妇白蒲岭张家妇人唐时神人借宿吾家授我女科一卷初言调经和气血均寒热以广嗣次言胎前补气血清痰火以安胎为上次言产后二十日前后不同以破血补气血为要此书隐而不发久矣我得医论十三篇辨明胎前产后与诸家大不同愿传当世医者存好生勿秘庶无不育之妇无难产之厄
  source_urls:
