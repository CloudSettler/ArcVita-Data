endeavors:
- id: guji-张璐-endeavor-1
  title_zh: 编纂张氏医通十六卷
  description: 自甲申至癸酉，汇灵素金匮，参近代名言，十易其稿，由医归而定名医通
  phases:
  - key: brewing
    name: 甲申播迁寄迹著书
    labels:
      zh: 流离著述
    start_date: '1644'
    highlight_event_id: guji-张璐-event-jiashen
  - key: breakthrough
    name: 己亥归园草创医归
    labels:
      zh: 归园辑稿
    start_date: '1659'
    highlight_event_id: guji-张璐-event-jihai
  - key: climax
    name: 癸酉十易成十六卷
    labels:
      zh: 十易成编
    start_date: '1693'
    highlight_event_id: guji-张璐-event-guiyou
  - key: closure
    name: 乙亥定名医通告成
    labels:
      zh: 定名刊行
    start_date: '1695'
    highlight_event_id: guji-张璐-event-yihai
  decisions:
  - date: '1659'
    title_zh: 以近代名言易往古晦义
    rationale: 往古传习多不能畅发其义，故以近代明畅之论代之，使吻合准绳而可施用
  - date: '1695'
    title_zh: 命子补辑目科痘疹足成全编
    rationale: 目科痘疹散失残编难行世，故命倬儿柔儿补辑，以全十六卷而通名
- id: guji-张璐-endeavor-2
  title_zh: 论中风汇通火气痰虚
  description: 首列灵素病机金匮治例，汇河间东垣丹溪喻嘉言诸说，辨真中类中内外虚实，立治按为法
  phases:
  - key: brewing
    name: 研读灵素金匮立准绳
    labels:
      zh: 溯源立纲
    start_date: '1644'
    highlight_event_id: guji-张璐-event-jiashen
  - key: breakthrough
    name: 伤寒缵绪二论先行问世
    labels:
      zh: 先行问世
    start_date: '1660'
    highlight_event_id: guji-张璐-event-shanghan
  - key: climax
    name: 中风门汇通诸家立论例治按
    labels:
      zh: 汇通立论
    start_date: '1693'
    highlight_event_id: guji-张璐-event-guiyou
  - key: closure
    name: 医通告成示由博返约
    labels:
      zh: 由博返约
    start_date: '1695'
    highlight_event_id: guji-张璐-event-yihai
  decisions:
  - date: '1660'
    title_zh: 以伤寒缵绪二论先行问世
    rationale: 草创未惬难以示人，先以伤寒二论问世以就正宇内，俟稿十易再成全编
  - date: '1693'
    title_zh: 详注灵素金匮冠诸论附治按为法
    rationale: 近世视素问迂远伤寒难用，从古立言止就一端，非详究治验不能识治法之奥
events:
- id: guji-张璐-event-birth
  title_zh: 出生于万历丁巳
  date: '1617'
  year_of: 1617
  description: 生于万历丁巳，时风俗虽漓古道未泯，业医者各擅专科
- id: guji-张璐-event-jiashen
  title_zh: 甲申世变播迁寄迹著书
  date: '1644'
  year_of: 1644
  description: 甲申世变黎庶奔亡，托迹灵威丈人故墟，赖医药种树之书消磨岁月，循十余载
- id: guji-张璐-event-jihai
  title_zh: 己亥赋归故园辑成医归
  date: '1659'
  year_of: 1659
  description: 己亥赋归故园，箧中辑得方书一通，因名医归，草创甫成
- id: guji-张璐-event-shanghan
  title_zh: 伤寒缵绪二论先行问世
  date: '1660'
  year_of: 1660
  description: 自揣草创未惬难以示人，仅以伤寒缵绪二论先行问世，颇蒙宇内许之
- id: guji-张璐-event-guiyou
  title_zh: 癸酉十易其稿成十六卷
  date: '1693'
  year_of: 1693
  description: 肇始甲申迄今癸酉岁逾五甲，稿凡十易，勒成一十六卷，务在由博返约
- id: guji-张璐-event-yihai
  title_zh: 乙亥季夏定名医通自序
  date: '1695'
  year_of: 1695
  description: 补辑目科痘疹足成全编，易以通名，康熙乙亥季夏自序，时年七十有九
- id: guji-张璐-event-death
  title_zh: 逝世
  date: '1699'
  year_of: 1699
  description: 乙亥定名医通后不久逝世，享年八十余，遗医通行世以挽医风之弊
