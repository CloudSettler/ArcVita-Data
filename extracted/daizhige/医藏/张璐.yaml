  dilemmas:
  - 专科混厕与医风三变难挽
  - 博采众论与由博返约难兼
  lesson: 通变而不失准绳，由博返约，临证审宜而用
  summary_first_person: 吾生万历丁巳，历甲申播迁，寄迹十余载以医药自娱，己亥归园辑医归，稿凡十易，补辑目科痘疹，定名医通十六卷，以挽医风之弊
