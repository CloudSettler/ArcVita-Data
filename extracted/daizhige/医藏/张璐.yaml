    title_zh: 决意宗本经主治为纲
    rationale: 以玉函金匮而外未闻宗本经者，故存羊存本以正朱紫之混
  - date: 1690
    title_zh: 决意旁系诸家治法
    rationale: 使学人得变通之用而不逾炎黄绳墨，足为上工之助
- id: guji-张璐-endeavor-2
  title_zh: 明水火土金石之用以垂上工之戒
  description: 谨汤液煎煮水火之宜，明土金石性用，戒妄恃己长苟得之利
  phases:
  - key: brewing
    name: 辨汤液必择水火
    labels:
      zh: 酿造
    start_date: 1650
    highlight_event_id: guji-张璐-event-study
  - key: breakthrough
    name: 参合内经仲景煎法
    labels:
      zh: 突破
    start_date: 1685
