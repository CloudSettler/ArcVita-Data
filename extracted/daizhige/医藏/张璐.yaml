  - 坦夷适时与峻剂攻邪之择，不为时师圈缋所拘
  lesson: 守炎黄绳墨以达变通，慎勿恃长苟得，常得中医方为上工
  summary_first_person: 余号石顽，生逢明清之际，慨医林舍本逐末，聊疏本经大义，系以诸家治法，愿学人左右逢原，不逾绳墨，跳出时师圈缋
