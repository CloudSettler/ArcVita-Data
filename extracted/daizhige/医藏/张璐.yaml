  - key: climax
    name: 论水火土部以示法度
    labels:
      zh: 高潮
    start_date: 1695
    highlight_event_id: guji-张璐-event-materia
  - key: closure
    name: 发有病不治常得中医之戒
    labels:
      zh: 收束
    start_date: 1695
    highlight_event_id: guji-张璐-event-preface
  decisions:
  - date: 1685
    title_zh: 决以文武缓急定煎法
    rationale: 补宜文火缓煎泻宜武火急煎，甘澜百劳各有攸宜故当明辨
  - date: 1695
    title_zh: 决以十全之戒饬医林
    rationale: 上工不能尽起白骨，故慎勿妄恃以希苟得之利以全苍生
events:
- id: guji-张璐-event-birth
  date: 1617
  year_of: 1617
  title_zh: 生于吴江
  description: 明万历四十五年生，字路玉，号石顽，长而业医
- id: guji-张璐-event-study
  date: 1644
  year_of: 1644
  title_zh: 精研灵素金匮千金
  description: 宗炎黄之道，究长沙一脉，独得千金之髓，慨濒湖舍本逐末
- id: guji-张璐-event-draft
  date: 1680
  year_of: 1680
  title_zh: 发凡疏本经大义
  description: 不自揣而聊陈鄙见，疏本经主治，旁采别录诸家以辨朱紫
- id: guji-张璐-event-preface
  date: 1695
  year_of: 1695
  title_zh: 康熙乙亥春书小引
  description: 年七十有九书于隽永堂，明绳墨变通之道，愿学人左右逢原
- id: guji-张璐-event-materia
  date: 1695
  year_of: 1695
  title_zh: 成水火土金石诸部
  description: 论诸水诸火诸土及金石性用，定煎煮服食之法度以诏后学
- id: guji-张璐-event-death
  date: 1699
  year_of: 1699
  title_zh: 卒于康熙末年
  description: 身后以本经逢原行于世，为清初宗本经之要籍
