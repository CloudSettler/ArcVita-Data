endeavors:
- id: guji-张璐-endeavor-1
  title_zh: 江城行医汇参仲景著张氏医通
  summary_zh: 署事江城多见奇疾，以察脉辨证辅虚祛实应如鼓桴，汇通伤寒金匮而成张氏医通
  phases:
  - key: brewing
    name: 江城治邑察脉辨证
    labels:
      zh:
      - 行医积累
    start_date: 1644
    highlight_event_id: guji-张璐-event-yitong
  - key: breakthrough
    name: 参透灵素伤寒金匮正眼
    labels:
      zh:
      - 经旨贯通
    start_date: 1680
    highlight_event_id: guji-张璐-event-yitong
  - key: climax
    name: 著成张氏医通行世
    labels:
      zh:
      - 著述垂世
    start_date: 1691
    highlight_event_id: guji-张璐-event-yitong
  decisions:
  - date: 1680
    title_zh: 弃俚诀而宗四经
    rationale: 伪诀药性易诵而误人，必以灵枢素问伤寒金匮为正法眼藏，方能审证确而下手辣
  - date: 1691
    title_zh: 汇刘张李朱而不偏
    rationale: 河间戴人东垣丹溪各执一偏，须因地因时迁变，培土清理补泻升沉各得其宜
- id: guji-张璐-endeavor-2
  title_zh: 别传心印专究色脉著诊宗三昧
  summary_zh: 感脉学自古无一家可宗，合仓公五色诊与太阴气口感胃气，别传三昧以涤尘见
  phases:
  - key: brewing
    name: 纵观万类悟营卫胃气
    labels:
      zh:
      - 脉理沉潜
    start_date: 1685
    highlight_event_id: guji-张璐-event-zhenzong
  - key: breakthrough
    name: 示假道候气与色脉合参
    labels:
      zh:
      - 色脉合参
    start_date: 1688
    highlight_event_id: guji-张璐-event-zhenzong
  - key: climax
    name: 著成诊宗三昧索序行世
    labels:
      zh:
      - 三昧垂训
    start_date: 1689
    highlight_event_id: guji-张璐-event-zhenzong
  decisions:
  - date: 1688
    title_zh: 斥七表八里而立法象
    rationale: 六部皆手太阴一脉假道行经气，须观弦钩缓毛之形与神色泽，圆机活泼比类而推
  - date: 1689
    title_zh: 请火伪诀而存胃气
    rationale: 高阳生俚诀与托名药性贻害无穷，宁愿祖龙举火，独守胃气和缓之平脉以决死生
