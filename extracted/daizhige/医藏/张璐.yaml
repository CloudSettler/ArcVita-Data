  - 专事温补与恣行削伐攻邪之间何以审证权变而不执一偏
  lesson: 审色合脉以胃气为本圆机活泼方为转日回天之道
  summary_first_person: 吾张璐字路玉号石顽老人，生于明季，长于江城，以医为任，痛时医株守俚诀与偏执温补攻伐之失，乃潜心灵素伤寒金匮，合色合脉，以胃气为宗，著医通与诊宗三昧，开教外别传，愿后学扫除积染，顿悟指下工夫，直承南阳先师一脉
