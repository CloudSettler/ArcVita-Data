    title_zh: 热入血室用逍遥散合暑法内外双解
    rationale: 暑湿入肝经事适至梦多谵语口苦似疟非疟恐缠绵变幻故不用峻攻而用柴胡当归白芍楝子元胡益元杏仁连翘银花
