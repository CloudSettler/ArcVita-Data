  decisions:
  - date: 1868-05-12
    title_zh: 十八龄咳血寒热用清金平木不用少阳柴胡法
    rationale: 暑风湿热久传入厥阴肋痛腹痛泻舌黄脉浮弦数故用杏仁桔梗贝母牡蛎青蒿鳖甲六一散薏苡通草
  - date: 1870-10-01
    title_zh: 汇集平生验案成张畹香医案卷上
    rationale: 病中走经变幻丛生非逍遥滋肺托邪前后调治不能全解特录的方以使后学腹中渊博有所持循
