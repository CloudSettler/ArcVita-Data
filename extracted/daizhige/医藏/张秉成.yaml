    description: 渡江求诸名医不得瘳，以己疾不治之痛立志操技治天下之疾
  - title_zh: 本草浩博初学难读
    description: 词旨奥衍累牍连篇记诵匪易，欲以简便排偶引进后学又恐失本真
  lesson: 先明药性味气质经络方能运用不乖，由易入难引进后学可补医林之缺
  summary_first_person: 余武进张秉成字兆嘉，少好读书，长而足疾不瘳，遂锐志学医朝夕研究，积十易寒暑编成本草便读五百八十余种，欲使初学由易入难玩而味之神而明之
