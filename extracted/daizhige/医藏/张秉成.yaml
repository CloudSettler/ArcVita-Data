  decisions:
  - date: 1887-05
    title_zh: 颜曰本草便读以示人以易
    rationale: 初学望洋观海无所折衷，仿指掌蒙筌之意将性味所入参差前后使无混淆难诵
  - date: 1898-03
    title_zh: 付刊公诸同好续出成方
    rationale: 蒙诸大雅赐序，尚有成方便读分类注疏当续出，欲使有志业医者守是编为楷模
events:
- id: guji-张秉成-event-birth
  title_zh: 诞生于武进
  date: '1840'
  year_of: 1840
  description: 清代江苏武进人，名秉成字兆嘉，少好读书，生年不详姑系清中晚期
- id: guji-张秉成-event-ill
  title_zh: 长而得足疾渡江求治不瘳
  date: '1860'
  year_of: 1860
  description: 及长得足疾渡江求诸名医不得瘳而家道中落，遂锐志学医早夕研究
- id: guji-张秉成-event-study
  title_zh: 同治甲子与程氏父子寻绎经论
  date: '1864'
  year_of: 1864
  description: 同治甲子程氏父宦闽乞归素邃于医，日相过从寻绎经论参酌古今
- id: guji-张秉成-event-cure
  title_zh: 治愈程福海怯证示手钞本
  date: '1888'
  year_of: 1888
  description: 程福海从事郑州工次几成怯证，请假归就治竟愈，出手钞本草便读两册嘱为订误
- id: guji-张秉成-event-preface
  title_zh: 光绪丁亥孟夏自序本草便读
  date: 1887-05
  year_of: 1887
  description: 学医二十余年积成五百余品，编为排偶俚言，自序于存诚堂颜曰本草便读
- id: guji-张秉成-event-praise
  title_zh: 吴恽盛诸公赐序称便
  date: 1890-12
  year_of: 1890
  description: 光绪庚寅吴炳作吴序，壬辰恽思赞作恽序，乙未盛康作盛序，皆称其简而要详而明便后学
- id: guji-张秉成-event-publish
  title_zh: 本草便读刊行鄂渚
  date: 1898-03
  year_of: 1898
  description: 始丁亥至戊戌十易寒暑，同里盛我彭刊行于鄂渚，程福海于戊戌春作程序广流传
- id: guji-张秉成-event-death
  title_zh: 逝世
  date: '1905'
  year_of: 1905
  description: 光绪乙未后事迹不详，卒年不详，余绪有成方便读待续出
