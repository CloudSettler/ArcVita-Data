    title_zh: 锐志学医治天下之疾
    rationale: 以己疾不治之苦转为救世之心，早夕研究操技治人
  - date: '1888'
    title_zh: 为程福海治怯证并示钞本
    rationale: 暑雨祈寒几成怯证，请假归就治竟愈，遂以手钞本草便读相示托订误
- id: guji-张秉成-endeavor-2
  title_zh: 编著本草便读引进后学
  summary: 学医二十余年购数十家本草朝夕研究，积五百余品删繁去复编为排偶俚言，自丁亥至戊戌十易寒暑成书刊行
