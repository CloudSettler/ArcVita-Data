  decisions:
  - date: 1125-06-01
    title_zh: 首立诸论以辨病名
    rationale: 世人呼阴毒伤寒为剧病，指带下为劳疾，病名混淆，故先作诸论别白言之
  - date: 1132-03-01
    title_zh: 坚持用古方存古意
    rationale: 近世医者多出新意不用古方，而古人方意有今人所不到者，故详录古方以存绳墨
- id: guji-张锐-endeavor-2
  title_zh: 临床论治脚气虚劳妇人产后
  summary: 以脚气为先，参孙思邈例，兼治虚劳七伤六极及妇人胎产诸疾
  phases:
  - key: brewing
    name: 临证察脚气风毒
