      - 突破
    start_date: 1128-01-01
    highlight_event_id: guji-张锐-event-clinic
  - key: climax
    name: 普治虚劳妇人产后
    labels:
      zh:
      - 高潮
    start_date: 1135-01-01
    highlight_event_id: guji-张锐-event-clinic
  - key: closure
    name: 垂训用药次叙
    labels:
      zh:
      - 收束
    start_date: 1142-01-01
    highlight_event_id: guji-张锐-event-bookdone
  decisions:
  - date: 1128-08-01
    title_zh: 叙百病先脚气先中风
    rationale: 法孙思邈著书必先中风先脚气之意，以风为百病之长而卑湿蒸郁最易中人
  - date: 1135-05-01
    title_zh: 产后先用黑神散童便调服
    rationale: 才产分解脏腑空虚，酒则引血迸入四肢，故禁酒而用童子小便调黑神散以定血运
