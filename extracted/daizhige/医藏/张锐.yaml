  dilemmas:
  - 近世医者喜出新意不用古方而古方深意难明之辨
  - 风劳伤寒妇人产后诸疾纷杂而须精辨虚实冷热之难
  lesson: 审脉辨证必准四时虚实，守古方绳墨以拯济生民
  summary_first_person: 吾乃宋人张锐，号鸡峰，观世医多喜新方而忽古意，遂集平生所学与秘笈经验，撰成鸡峰普济方，论诸风伤寒脚气虚劳妇人产后诸疾，愿以一书普济众生
