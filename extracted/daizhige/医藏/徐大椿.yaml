  decisions:
  - date: 1767
    title_zh: 增订刍言为慎疾刍言
    rationale: 统谈医学无惊心动魄之语不足开悟，须痛快剖悉补住外邪之害以令人豁然
  - date: 1767
    title_zh: 力主散邪清热反对蛮补
    rationale: 外感总以散热为治，邪补住则永不复出，故立浅近定法以救中风痨嗽胎产之死
