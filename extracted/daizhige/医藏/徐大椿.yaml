  dilemmas:
  - 道小任重而工贱，有志不屑为，无识不能窥，医道易坠
  - 正虚邪凑当先驱邪，中风误用纯补温热助邪，轻成偏枯重即死
  lesson: 医虽小道而义精任重，必寻本溯源，慎护元气，分经络脏腑而神明变化
  summary_first_person: 我是徐大椿，少有志穷经，因家人连病死亡略尽，博览方书寝食俱废，九折成医，感唐宋以来视为下业至理已失，书医学源流论于吴山半松书屋以全生人之术
