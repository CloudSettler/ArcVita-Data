  dilemmas:
  - title_zh: 守古法与徇时俗
    description: 世医废古书而专用温补，我若直言痛斥则孤立难容，若沉默则坐视枉死
  - title_zh: 救人与醒世
    description: 临证所救不过一人一时，著书立说方能挽回风气而绵斯道于一线
  lesson: 由浅入深守定法，对症用药驱邪为先，慎用温补以保生民之寿
  summary_first_person: 我弱冠时家多疾病，因翻阅家藏医书而入医门，十余年上追灵素下沿汉唐，注难经，注本草，作医学源流论与伤寒类方，批阅千卷泛览万卷，目击庸医以参附熟地误人，悲悯填胸而作慎疾刍言，愿以敬慎寡过以明哲保身
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E6%85%8E%E7%96%BE%E5%88%8D%E8%A8%80.md
