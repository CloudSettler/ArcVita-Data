  decisions:
  - date: 1733
    title_zh: 先注难经以立根基
    rationale: 学必由浅入深，不明经络本义则方无所据，故十年注经不求速效
  - date: 1753
    title_zh: 作源流论以统谈医学
    rationale: 世医各执一说莫能一致，须上追灵素下沿汉唐以辨源流得失
