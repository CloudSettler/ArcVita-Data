  decisions:
  - date: 1757
    title_zh: 先著医学源流论以清源流
    rationale: 不明源流则方论无据故先辨经方时方之得失而后立轨范
  - date: 1764-04
    title_zh: 断以仲景为宗止录隋唐而下取宋后之效者
    rationale: 唐以前方多精切可原本内经宋后多阴阳气血笼统之谈故严去取以存定法
- id: guji-徐大椿-endeavor-2
  title_zh: 辨疑似而诫误用以全民生
  summary_zh: 于每方下附注配合施用之宜标举耳食误用之戒使病者医者对症考证
