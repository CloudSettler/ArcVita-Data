  decisions:
  - date: '1710'
    title_zh: 弃经习医博览方书
    rationale: 家人疾病连年死亡略尽，非通医不能全生，故寝食俱废寻本溯源
  - date: '1715'
    title_zh: 以元气存亡决生死
    rationale: 病轻重不足凭，元气不伤虽重不死，元气伤虽轻亦死，故视元气不视病形
- id: guji-徐大椿-endeavor-2
  title_zh: 敷言著论振兴医道
  summary: 伤怀医道失传，书医学源流论，明经络脏腑表里阴阳，纠中风臌膈误治
