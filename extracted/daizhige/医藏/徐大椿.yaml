  decisions:
  - date: '1757'
    title_zh: 著论详辨虚实分合用人参法
    rationale: 病未去而用参则病根遂固故当分邪正相离者补虚以托邪合者专于攻散不可借参塞责
  - date: '1760'
    title_zh: 不就征召守隐士之节以著述济世
    rationale: 深求造化之微非通达者不可轻试故以笔代仕匡正宋元以来师心自用之谬
