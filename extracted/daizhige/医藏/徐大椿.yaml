endeavors:
- id: guji-徐大椿-endeavor-1
  title_zh: 择百种辨药性著神农本草经百种录
  summary: 就市中所见审形辨味以合经义取色形质气味之偏胜阐发百种药性之所以然
  phases:
  - key: brewing
    name: 考白字本经别名实审土产
    labels:
      zh:
      - 考据
      - 本草
    start_date: '1730'
    highlight_event_id: guji-徐大椿-event-1
  - key: breakthrough
    name: 以色形质味立说悟药性偏胜
    labels:
      zh:
      - 药性
      - 义蕴
    start_date: '1734'
    highlight_event_id: guji-徐大椿-event-1
  - key: climax
    name: 舟次扬子江题序成百种录
    labels:
      zh:
      - 著述
      - 百种录
    start_date: '1736'
    highlight_event_id: guji-徐大椿-event-1
  - key: closure
    name: 阙疑存慎以俟后君子悟全经
    labels:
      zh:
      - 阙疑
      - 传承
    start_date: '1736'
    highlight_event_id: guji-徐大椿-event-1
  decisions:
  - date: '1736'
    title_zh: 但择习见不疑者共得百种
    rationale: 耳目所及无多古今名实互异若必尽解全经不免昧心诬圣故阙疑而阐其所以然
  - date: '1736'
    title_zh: 依明重刻宋大观本白字本经为据
    rationale: 取其古胜于近刻以存朱书神农本经之旧而详辨药性主治之精微妙义
- id: guji-徐大椿-endeavor-2
  title_zh: 论医源流正时弊以医济世
  summary: 通经史精医理著医学源流论兰台轨范洄溪医案等纠人参熟地滥用之失以复仲景经方之义
  phases:
