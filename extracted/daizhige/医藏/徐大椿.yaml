    start_date: 1757-07
    highlight_event_id: guji-徐大椿-event-book
  decisions:
  - date: 1757-07
    title_zh: 书医学源流论于半松书屋
    rationale: 唐宋以来视为下业至理已失良法并亡，恐无生人之术，故不揣庸妄用敷厥言
  - date: 1757-07
    title_zh: 中风主驱风忌纯补温热
    rationale: 中风为急暴实邪风痰壅塞，纯补是将风火痰气补住，必先驱风继清痰火而后调气血
