  decisions:
  - date: 1764-04
    title_zh: 每病先叙病原每方必著主病
    rationale: 病必有主方方必有主药若但云主治某症而不言所以然则如雾里看花故详辨疑似出入
  - date: 1764-04
    title_zh: 凡例屏除秘传难识违禁之方
    rationale: 学务穷经志切师古不尚奇功只求实效故飞炼禁咒大药重剂一概不录
