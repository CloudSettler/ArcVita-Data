  archetype: 以经证经的医道阐释者
  dilemmas:
  - title_zh: 崇信旧注还是以经证经
    description: 难经注家数十皆无异议，习久渐见大可疑，当曲为解释还是摘而证之于内经
  - title_zh: 言医术还是明医道
    description: 晋唐以后支流愈分徒讲其术，当随俗言术还是溯源及流明医之道
  lesson: 溯流须寻源，源得而后及流，以经证经方能不惑
  summary_first_person: 吾徐大椿字灵胎，吴江松陵人，初崇信佩习难经，久而疑其或非，更习而信己必是，非信己，乃信难经必不可违内经，遂申述内经本意，随文诠释，别其异同，以经释难，以难释经，愿后世知难经为内经羽翼
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E9%9A%BE%E7%BB%8F%E7%BB%8F%E9%87%8A.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%9A%BE%E7%BB%8F%E7%BB%8F%E9%87%8A.md
endeavors:
- id: guji-徐大椿-endeavor-1
  title_zh: 内经为本诠释难经八十一难
  summary: 本发难之情申述内经本意，索条理随文诠释，别异同辨是否
  phases:
  - key: brewing
    name: 佩习难经渐生疑
    labels:
      zh: 溯流寻源
    start_date: 1715
    highlight_event_id: guji-徐大椿-event-study-nanjing
  - key: breakthrough
    name: 以内经之义疏证难经之疵
    labels:
      zh: 以经证经
    start_date: 1725
    highlight_event_id: guji-徐大椿-event-study-neijing
  - key: climax
    name: 撰成难经经释正文
    labels:
      zh: 以经释难
    start_date: 1727
    highlight_event_id: guji-徐大椿-event-nanjing-jingshi
  - key: closure
    name: 雍正五年自序明旨
    labels:
      zh: 羽翼内经
    start_date: 1727
    highlight_event_id: guji-徐大椿-event-nanjing-jingshi
  decisions:
  - date: 1727
    title_zh: 决定不曲徇旧注直证于经
    rationale: 以难视难则无可议，以内经视难则多疵，故当摘未洽者证之于经
  - date: 1727
    title_zh: 存别有师承者不强议可否
    rationale: 殊法异义不本内经而与内经相发明者，别有师承，不得执经议之
- id: guji-徐大椿-endeavor-2
  title_zh: 著述源流轨范明医之道
  summary: 由经释推及医道医术之辨，著医学源流论兰台轨范等以正学统
  phases:
  - key: brewing
    name: 感支流愈分去圣渐远
    labels:
      zh: 明道忧世
    start_date: 1730
    highlight_event_id: guji-徐大椿-event-nanjing-jingshi
  - key: breakthrough
    name: 论源流辨术道
    labels:
      zh: 正本清源
    start_date: 1757
    highlight_event_id: guji-徐大椿-event-yixue-yuanliu
  - key: climax
    name: 成兰台轨范辑方正俗
    labels:
      zh: 经方致用
    start_date: 1764
    highlight_event_id: guji-徐大椿-event-lantai-guifan
  - key: closure
    name: 晚年定论垂训后学
    labels:
      zh: 圣学之传
    start_date: 1770
    highlight_event_id: guji-徐大椿-event-death
  decisions:
  - date: 1757
    title_zh: 决定作医学源流论
    rationale: 徒讲其术不讲其道则去圣远矣，须论文言脉方药以返其本
  - date: 1764
    title_zh: 决定辑兰台轨范
    rationale: 方之是者当存，俗之非者当正，使后学得其宗而不惑于支流
