endeavors:
- id: guji-徐彦纯-endeavor-1
  title_zh: 会稽编纂玉机微义五十卷
  description: 门分类集素难金匮要略巢氏千金之论，条理病因证治，以元素一派为宗，旁采不倍此者
  phases:
  - key: brewing
    name: 博览素难金匮蓄志编摩
    labels:
      zh: 蓄志
    start_date: '1370'
    highlight_event_id: guji-徐彦纯-event-birth
  - key: breakthrough
    name: 初成中风痿证门类草稿
    labels:
      zh: 初稿
    start_date: '1388'
    highlight_event_id: guji-徐彦纯-event-compile
  - key: climax
    name: 五十卷门分类集成帙
    labels:
      zh: 成帙
    start_date: '1395'
    highlight_event_id: guji-徐彦纯-event-collab
  decisions:
  - date: '1388'
    title_zh: 定以素难金匮及元素派为宗
    rationale: 神农轩岐仲景之书万世所宗，元素得神授深造，李朱相续为正派，故立此为准绳
  - date: '1390'
    title_zh: 定中风痿证分门不混治
    rationale: 世以治风药通治痿者多误，风善行数变多实，痿起肺热传入五脏，故须各立条目源流
- id: guji-徐彦纯-endeavor-2
  title_zh: 与刘宗浓续增发明沟通南北医派
  description: 与吴陵刘宗浓续有增益，私淑朱彦修，会通北方张元素南方朱彦修，折衷河间东垣丹溪之论
  phases:
  - key: brewing
    name: 私淑彦修研习脾土养血之法
    labels:
      zh: 师承
    start_date: '1380'
    highlight_event_id: guji-徐彦纯-event-compile
  - key: closure
    name: 续增五十卷成得东里序引
    labels:
      zh: 序行
    start_date: '1405'
    highlight_event_id: guji-徐彦纯-event-preface
  decisions:
  - date: '1395'
    title_zh: 定分在经在腑在脏三治
    rationale: 中血脉有六经形证从小续命加减，中腑便溺阻隔宜三化通利，在经无表里证宜大秦艽汤养血通气
  - date: '1400'
    title_zh: 定续增卢王诸论以明真伪
    rationale: 因火因气因湿暴病类中风者须别出，真中风由风所致，西北折风东南湿痰各异，故备载以醒后人
events:
- id: guji-徐彦纯-event-birth
  title_zh: 会稽出生
  date: '1340'
  year_of: 1340
  kind: birth
  description: 元至正初生于会稽，少习儒业后明于医，私淑朱彦修之学
- id: guji-徐彦纯-event-compile
  title_zh: 初编玉机微义中风诸门
  date: '1388'
  year_of: 1388
  kind: career
  description: 取内经要略千金之文，集续命防风通圣大秦艽诸方，分发表攻里养血理气诸法，初成卷一中风门
- id: guji-徐彦纯-event-collab
  title_zh: 与刘宗浓续增五十卷
  date: '1395'
  year_of: 1395
  kind: career
  description: 洪武乙亥秋，与吴陵刘宗浓续有增益，增入卢砥镜王安道辨真中风类中风之论，合为五十卷门分类集
- id: guji-徐彦纯-event-preface
  title_zh: 东里杨士奇作序刊行
  date: '1405'
  year_of: 1405
  kind: career
  description: 明初东里杨士奇嘉其条理粲然详备，谓中医执此施治可成，病者知此不为庸误，作序而传其书
- id: guji-徐彦纯-event-death
  title_zh: 永乐间逝世
  date: '1420'
  year_of: 1420
  kind: death
  description: 明永乐间卒于会稽，所辑玉机微义通行于世，为医家王道养民之助
