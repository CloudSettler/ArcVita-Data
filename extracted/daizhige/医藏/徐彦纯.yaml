  death_date: '1420'
  era: 元末明初
  reign_ref: 明洪武永乐间
  archetype: 会稽医经汇通者
  dilemmas:
  - 外感真中风与火气湿痰类中风名实相紊何以分辨施治
  - 中风汗下调养三法轻重缓急何以权衡而不伤荣卫
  lesson: 辨真风与类风之异，宗素难金匮而不泥古，方能济人而不误人
  summary_first_person: 吾乃会稽徐彦纯，私淑丹溪朱彦修，会通张元素李明之王好古之法，与吴陵刘宗浓共辑玉机微义五十卷，门分类集，辨中风与痿湿火热之别，愿执此者施治可成，病者知此不为庸误
  source_urls:
