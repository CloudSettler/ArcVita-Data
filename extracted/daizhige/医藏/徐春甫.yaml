person:
  qid: guji-徐春甫
  name_zh: 徐春甫
  names:
    zh: 徐春甫
    en: Xu Chunfu
  lifespan:
    birth:
      date: 约1520
      precision: year
      is_circa: true
      raw: 新安人，少时学儒去学医，具体生年未详，约生于明正德嘉靖之际
    death:
      date: 约1590
      precision: year
      is_circa: true
      raw: 明万历前后卒，具体年月未详
  birth_date: 约1520
  death_date: 约1590
  era: 明
  reign_ref: 嘉靖
  archetype: 集医家大成之长者
  dilemmas:
  - 博采群书与独宗内经之衡，既综博千古又一准于经
  - 快捷趋简与穷源考索之辨，斥脉诀难经之谬而正诊候治法
  - 活一人与济天下之择，以百卷医统传道授人
  lesson: 下学可以言传，上达必由心悟，惟有恒者能综博守经而大济于民
  summary_first_person: 余新安徐春甫，少通儒学，去而攻医，潜心轩岐三十年，先调护后攻伐，不捷出以为奇。惧世医执方待病，惑于脉诀难经，遂远稽古哲近述名流，以内经为宗，厘为百卷，号曰古今医统，愿登斯民于春台寿域。
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%8C%BB%E7%BB%9F%E5%A4%A7%E5%85%A8.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8F%A4%E4%BB%8A%E5%8C%BB%E7%BB%9F%E5%A4%A7%E5%85%A8.md
endeavors:
- id: guji-徐春甫-endeavor-1
  title_zh: 编纂古今医统大全宗经正统
  summary: 上自太昊炎黄迄于我明，裒辑二百七十余家，以内经为宗，首内经要旨次脉候运气经穴针灸，继以内外妇儿养生本草，斥难经脉诀之谬，总百家以归内经
  phases:
  - key: brewing
    name: 潜心斯道博采方书
    labels:
      zh: 博采穷源
    start_date: 1540-01-01
    highlight_event_id: guji-徐春甫-event-study
  - key: breakthrough
    name: 立宗内经辨谬正脉
    labels:
      zh: 宗经辨谬
    start_date: 1550-01-01
    highlight_event_id: guji-徐春甫-event-neijing
  - key: climax
    name: 厘为百卷古今医统成书
    labels:
      zh: 集大成书
    start_date: 1556-12-22
    highlight_event_id: guji-徐春甫-event-complete
  - key: closure
    name: 诸公助梓广传济众
    labels:
      zh: 刊刻广传
    start_date: 1570-01-01
    highlight_event_id: guji-徐春甫-event-practice
  decisions:
  - date: 1550-01-01
    title_zh: 独宗内经斥难经脉诀
    rationale: 难经所引多非素问灵枢本文，脉诀误以大小肠属两寸，脉误则证治俱误，故违众发谬，一准于经
  - date: 1556-12-22
    title_zh: 类聚条分厘为百卷
    rationale: 厌繁者有所归，趋简者无少失，使议论有源治疗有法，一开卷而法制权衡如视诸掌
- id: guji-徐春甫-endeavor-2
  title_zh: 京师行医活人无算用法不胶
  summary: 为太医之官，客于成国公，遨游公卿间，治绵沉痼能终任之，以清痰发郁治少泉郝公郁厥奇验，病已辄自纪所以治而未尝胶方
  phases:
  - key: brewing
    name: 四方行医挟书满几
    labels:
      zh: 历试尝效
    start_date: 1545-01-01
    highlight_event_id: guji-徐春甫-event-study
  - key: breakthrough
    name: 客京师名动公卿
    labels:
      zh: 名重京师
    start_date: 1560-01-01
    highlight_event_id: guji-徐春甫-event-practice
  - key: climax
    name: 治少泉郁痹眩厥奇验
    labels:
      zh: 辨郁起死
    start_date: 1570-06-15
    highlight_event_id: guji-徐春甫-event-practice
  - key: closure
    name: 以法公人神在秋毫
    labels:
      zh: 法外得神
    start_date: 1580-01-01
    highlight_event_id: guji-徐春甫-event-practice
  decisions:
  - date: 1570-06-15
    title_zh: 舍从风治改清痰发郁
    rationale: 视诸医以风治左臂不和眩仆，断为郁烦不宣缘阳络逆攻于上，故清痰发郁而效
  - date: 1560-01-01
    title_zh: 先调护后攻伐不亟效
    rationale: 操术慎用志精，不捷出以为奇，不聚毒尽技，以有恒全活，取信于疑信半之病家
events:
- id: guji-徐春甫-event-birth
  title_zh: 生于新安少通儒学
  date: 约1520
  year_of: 1520
  description: 新安徐氏，少通儒学博综群籍，性高迈爽恺，去而学医，攻探研极究寻诸名家
- id: guji-徐春甫-event-study
  title_zh: 遍访坊肆裒辑方书
  date: 1545-01-01
  year_of: 1545
  description: 喜攻医术，古今方书裒辑甚备，未备则遍历坊肆访文献大家求之，挟书行四方，会国家大编摩聚方滋富
- id: guji-徐春甫-event-neijing
  title_zh: 撰内经要旨提注辨释
  date: 1557-03-15
  year_of: 1557
  description: 因滑氏钞目益以诸贤勾玄，提注详明辨释条达，名曰内经要旨，以契黄岐宏纲大旨
- id: guji-徐春甫-event-complete
  title_zh: 古今医统百卷成书自序
  date: 1556-12-22
  year_of: 1556
  description: 嘉靖丙辰仲冬长至日自序，按内经治验折衷诸子，搜求历世圣贤之旨合群书不遗，类聚条分共厘百卷
- id: guji-徐春甫-event-practice
  title_zh: 京师治郝少泉郁厥奇验
  date: 1570-06-15
  year_of: 1570
  description: 隆庆庚午，侍御郝少泉忽仆左臂不和眩呼弗省，诸医以风治弗验，徐春甫诊为含悲贮恸之郁，清痰发郁数日而愈
- id: guji-徐春甫-event-death
  title_zh: 卒于万历前后道传人人
  date: 约1590
  year_of: 1590
  description: 以一人之身行于一方以为未足，使其道传之人人，书由成国公朱希忠梓行，遍行于世济民无算而卒
