endeavors:
- id: guji-徐灵胎-endeavor-1
  title_zh: 辨中风闭脱匡正温补之误
  summary: 力辨虚邪贼风痰火充实之闭证与脱证之别以小续命泻心豁痰救封门金姓运使王公西门汪姓叔子静等危证
  phases:
  - key: brewing
    name: 目击时医治风不祧参桂附
    labels:
      zh: 积弊观察
    start_date: '1730'
    highlight_event_id: guji-徐灵胎-event-feng
  - key: breakthrough
    name: 去桂附加生军救运使王公
    labels:
      zh: 对证破局
    start_date: '1740'
    highlight_event_id: guji-徐灵胎-event-feng
  - key: climax
    name: 连救卒中口噤痰锯诸家
    labels:
      zh: 广救危证
    start_date: '1750'
    highlight_event_id: guji-徐灵胎-event-shu
  - key: closure
    name: 明闭忌温补脱方可用参附之戒
    labels:
      zh: 立训垂后
    start_date: '1760'
    highlight_event_id: guji-徐灵胎-event-shu
  decisions:
  - date: '1740'
    title_zh: 闭证去参附用小续命加生军
    rationale: 脉洪大面赤气粗乃痰火闭窍服参附立毙当辛凉开闭以救危亡
  - date: '1750'
    title_zh: 经络之痰不求速效全愈
    rationale: 形体之病过用重剂必伤正养血顺气调养可延年误投温补反速死
- id: guji-徐灵胎-endeavor-2
  title_zh: 治瘟暑时疫并成洄溪医案
  summary: 雍正十年赴昆山以清凉芳烈治瘟疫燥火盛暑以芳香通窍清暑养阴治暑闭暑脱撰案稿由门人传钞王士雄编刊
  phases:
  - key: brewing
    name: 昆山海啸后暑蒸尸气成疫
    labels:
      zh: 瘟疫初起
    start_date: '1732'
    highlight_event_id: guji-徐灵胎-event-wenyi
  - key: breakthrough
    name: 清凉芳烈解毒活二十四家
    labels:
      zh: 因证变法
    start_date: '1732'
    highlight_event_id: guji-徐灵胎-event-wenyi
  - key: climax
    name: 紫金锭通窍西瓜退伏暑参附回阳
    labels:
      zh: 暑证各治
    start_date: '1755'
    highlight_event_id: guji-徐灵胎-event-shu
  - key: closure
    name: 门人钞本王士雄编次刊行
    labels:
      zh: 垂鉴传世
    start_date: '1771'
    highlight_event_id: guji-徐灵胎-event-death
  decisions:
  - date: '1732'
    title_zh: 舍香燥升提用清凉芳烈治疫
    rationale: 湿极兼燥化加以瘟邪燥火执往年祛风逐湿之方则犯之即死
  - date: '1755'
    title_zh: 暑闭用芳香通灵暑脱回阳后即清暑
    rationale: 诸窍闭非紫金锭不通阳越非参附不回阳回而火炽非西瓜清暑不解
events:
