  summary: 以菖蒲泽兰薄荷青蒿芦根茅根兼辟邪解毒丸散治汪天成等二十七家愈二十四人
- id: guji-徐灵胎-event-feng
  title_zh: 救运使王叙揆痰火闭证
  date: '1740'
  year_of: 1740
