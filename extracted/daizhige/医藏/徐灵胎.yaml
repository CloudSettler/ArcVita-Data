  place_zh: 芦墟
  summary: 脉微欲绝遗尿谵语先以参附回阳醒后阳回火炽连啖西瓜数枚饮清暑养胃而愈
- id: guji-徐灵胎-event-death
  title_zh: 卒于乾隆三十六年
  date: '1771'
