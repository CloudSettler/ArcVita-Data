    highlight_event_id: guji-徐谦-event-teach
  - key: breakthrough
    name: 命葵删定去繁存精
    labels:
      zh:
      - 删定
      - 法门
    start_date: '1590'
    highlight_event_id: guji-徐谦-event-publish
  - key: climax
    name: 十六卷定稿附疹法
    labels:
      zh:
      - 十六卷
      - 治疹
    start_date: '1592'
    highlight_event_id: guji-徐谦-event-publish
  - key: closure
    name: 医林流传四库著录
    labels:
      zh:
      - 流传
      - 四库提要
    start_date: '1595'
    highlight_event_id: guji-徐谦-event-publish
  decisions:
  - date: '1590'
    title_zh: 托陈葵删定全书
    rationale: 痘科形色脉证繁多恐后学眩惑故令门人删繁就简条列方论以存平正之旨
  - date: '1592'
    title_zh: 末卷附治疹之法
    rationale: 疹与痘同源异流古多以防疹统痘故附其法以全小儿热病之治
events:
- id: guji-徐谦-event-birth
  date: '1550'
  year_of: 1550
  title_zh: 生于嘉兴
  description: 明嘉靖间生于嘉兴字仲光少习医专攻小儿痘疹
- id: guji-徐谦-event-origin
  date: '1575'
  year_of: 1575
  title_zh: 考痘源辨传经
  description: 考东晋建武胡虏南来疫疠触胎毒而为虏疮立自肾传肝心脾肺传经次序及经络时辰传注之法
- id: guji-徐谦-event-write
  date: '1585'
  year_of: 1585
  title_zh: 撰仁端录分论五脏形色
  description: 分别五脏经络观面部形色作原痘论赋及心肝脾肺肾五门症治条列方论治验
- id: guji-徐谦-event-teach
  date: '1590'
  year_of: 1590
  title_zh: 授陈葵删定
  description: 授门人嘉善陈葵荩夫命其删定全书去偏主攻补之弊守补脾救肾养阴济阳之常
- id: guji-徐谦-event-publish
  date: '1595'
  year_of: 1595
  title_zh: 仁端录十六卷成附治疹
  description: 书成十六卷专论治痘兼末卷附治疹之法后为四库全书收录称其平正通达为痘科法门
- id: guji-徐谦-event-death
  date: '1600'
  year_of: 1600
  title_zh: 卒
  description: 明万历前后卒于乡里其书经门人传刻流传于世
