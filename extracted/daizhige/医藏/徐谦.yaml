  decisions:
  - date: '1580'
    title_zh: 主胎毒内外相搏成痘
    rationale: 伤寒有不患者而痘人人免不得故以内染外感相搏立论以定防汗散邪之先机
  - date: '1582'
    title_zh: 正肾经有痘以补肾制火
    rationale: 淫火伏命门触疠而发耳骫冷乃常候变黑为归肾故立求属补肾之意以使血气相依化脓结痂
- id: guji-徐谦-endeavor-2
  title_zh: 授徒传业删定传世
  summary: 授嘉善陈葵荩夫以平正通达之法令其删定十六卷兼附治疹以惠后学
  phases:
  - key: brewing
    name: 设帐授业辨惑
