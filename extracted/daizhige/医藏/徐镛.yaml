events:
- id: guji-徐镛-event-birth
  date: 1775-01-01
  year_of: 1775
  title_zh: 徐镛约生于江苏松江
  description_zh: 清乾隆末生于松江府长而业医往来郡城乡镇行医
- id: guji-徐镛-event-1
  date: 1820-01-16
  year_of: 1820
  title_zh: 治谢凰鸣喘嗽以白虎犀角地黄愈
  description_zh: 谢凰鸣七十有四喘嗽痰涎不寐众作虚治余诊为误用辛温实火用大剂白虎参入犀角地黄坚服四十余日全愈
- id: guji-徐镛-event-2
  date: 1823-06-01
  year_of: 1823
  title_zh: 治杨熙宗子热厥以犀角地黄合大承气下愈
  description_zh: 南汇杨熙宗令郎烧香归忽发狂厥牙关紧闭余用犀角地黄合大承气强灌半剂大便即解前恙顿除
- id: guji-徐镛-event-3
  date: 1826-06-01
  year_of: 1826
  title_zh: 复书姚敬修论石膏清火撰成医学举要
  description_zh: 与姚敬修书论其女肝积肺寒冲逆喘嗽当用麻杏甘膏清燥救肺人参石膏同用清火分门汇集寒火疟痢胎产验案成医学举要一书
- id: guji-徐镛-event-death
