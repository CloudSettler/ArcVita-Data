  dilemmas:
  - 珍味奇品萃于内府而风土燥湿不宜，若不察性味而概进则致疾，当如何调和五味以保圣躬
  - 世人重药轻食贪爽口而忘避忌，当如何立食疗治未病之法以养口体养德
  lesson: 守中节饮，和五味以养形，顺四时慎起居以安心，此治未病之要
  summary_first_person: 吾为饮膳太医，延祐年间选充饮膳之职，久叨天禄，与赵国公普兰奚集累朝奇珍异馔汤膏煎造及本草方术成饮膳正要三卷，愿以燕闲鉴先圣保摄顺时弃虚取实而资圣寿
  source_urls:
