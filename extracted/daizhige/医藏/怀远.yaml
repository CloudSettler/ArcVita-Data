  birth_date: 1755-01-01
  death_date: 1815-01-01
  era: 清
  reign_ref: 嘉庆
  archetype: 医者
  dilemmas:
  - 不为相则为医，弃儒从医以全济世之志，抑守帖括以求仕进
  - 伤寒汗下易误，遵古方而泥于成法，抑参虚实而变通以存津液
  lesson: 医系性命，方不可执，法不可废，必审虚实表里而慎于汗下，方为活人之道。
  summary_first_person: 吾少治儒术，壮岁弃去，承家学隐于医三十年，活人无算，乃著古今医彻，明伤寒虚实表里，辨传经直中两感，兼及杂症女科，愿慎汗下以全生民。
  source_urls:
