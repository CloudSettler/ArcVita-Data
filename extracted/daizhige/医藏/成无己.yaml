    title_zh: 专守仲景不徇家技
    rationale: 观今之医各承家技不求经旨故独以仲景为师以汤液救伤寒十居其七之夭横
  - date: 1130-01-01
    title_zh: 以内经旁证伤寒
    rationale: 经络府俞阴阳会通非引内经不能明脉理表里故博采众说以阐其奥
