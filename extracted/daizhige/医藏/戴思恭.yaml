endeavors:
- id: guji-戴思恭-endeavor-1
  title_zh: 师承丹溪精研医道
  summary: 浦江从学朱震亨，究神农品尝之性，黄帝问答之旨，伊尹汤液之法，叔和诊视之要，精东垣补泻之秘，奠定一生医业之基
  phases:
  - key: brewing
    name: 浦江问道
    labels:
      zh:
      - 求学问道
    start_date: 1345
    highlight_event_id: guji-戴思恭-event-study
  - key: breakthrough
    name: 尽得补泻之秘
    labels:
      zh:
      - 精研丹溪
    start_date: 1355
    highlight_event_id: guji-戴思恭-event-study
  - key: climax
    name: 名扬浙中
    labels:
      zh:
      - 临证取效
    start_date: 1362
    highlight_event_id: guji-戴思恭-event-imperial
  - key: closure
    name: 应召入京
    labels:
      zh:
      - 入朝为医
    start_date: 1368
    highlight_event_id: guji-戴思恭-event-imperial
  decisions:
  - date: 1348
    title_zh: 决意师事朱震亨
    rationale: 慕丹溪明道不计功之心，欲究表里虚实浮沉滑数之理，故往从学，不执一方
  - date: 1368
    title_zh: 应诏赴洪武朝为御医
    rationale: 际遇明时遭逢圣主，惟以活人为念，故舍乡里之安，就太医院之任
- id: guji-戴思恭-endeavor-2
  title_zh: 总领太医院著书济世
  summary: 位总医流名扬四海，加减用药取效如神，尝著证治要诀及类方二册藏于箧笥，后经永乐僧缵西绪及御史陈嶷传录刊布，广济天下后世
  phases:
  - key: brewing
    name: 历事两朝总医流
    labels:
      zh:
      - 宫廷行医
    start_date: 1370
    highlight_event_id: guji-戴思恭-event-imperial
  - key: breakthrough
    name: 加减制方取效如神
    labels:
      zh:
      - 因病制宜
    start_date: 1380
    highlight_event_id: guji-戴思恭-event-imperial
  - key: climax
    name: 著成证治要诀类方
    labels:
      zh:
      - 著书立说
    start_date: 1395
    highlight_event_id: guji-戴思恭-event-book
  - key: closure
    name: 秘藏付梓广布流传
    labels:
      zh:
      - 济世寿域
    start_date: 1405
    highlight_event_id: guji-戴思恭-event-book
  decisions:
  - date: 1395
    title_zh: 著证治要诀类方藏箧
    rationale: 味论断出新意于法度之中，随病加减有据可依，故笔之于书以立规矩准绳
  - date: 1400
    title_zh: 以活人为念不谋利
    rationale: 有正谊不谋利明道不计功之心，不秘惜方术，愿转夭横而跻寿域，故许方外契交录藏以待后人
events:
- id: guji-戴思恭-event-birth
  title_zh: 出生于浦江
  date: 1324
  year_of: 1324
  description: 元泰定元年，生于婺州浦江戴氏，幼颖悟，志于医道
- id: guji-戴思恭-event-study
  title_zh: 师事朱震亨学医
  date: 1348
  year_of: 1348
  description: 往从金华朱丹溪学，得神农品尝黄帝问答汤液诊视之旨，精补泻之秘，医名日起
- id: guji-戴思恭-event-imperial
  title_zh: 洪武召入太医院
  date: 1370
  year_of: 1370
  description: 洪武初以荐召为御医，累官太医院使，位总医流，加减用药取效如神，虽扁鹊华佗不是过
- id: guji-戴思恭-event-book
  title_zh: 著成秘传证治要诀及类方
  date: 1395
  year_of: 1395
  description: 尝著证治要诀类方二册，论中风中气中寒中暑中湿中恶霍乱伤寒诸证及随病加减之妙，藏之箧笥，后为缵西绪所录，陈嶷得之欲锓梓广布
- id: guji-戴思恭-event-death
  title_zh: 永乐三年逝世
  date: 1405
  year_of: 1405
  description: 明永乐三年卒于京师，年八十有二，一生以活人为念，遗书济世，后人赖要诀而脱沉疴
