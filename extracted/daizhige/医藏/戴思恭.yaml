  - 秘方自珍与广布济世之间如何取舍
  - 温补攻泻与因病制宜之间如何权衡
  lesson: 医者意也，因病制宜，临机应变，惟以活人为念
  summary_first_person: 吾戴思恭字元礼，浦江人也，早岁师事丹溪，究问答汤液诊视之旨，洪武中召入太医院，历事两朝，总领医流，加减用药取效如神，尝著证治要诀类方藏于箧笥，惟愿后人因病制宜以全活人命
