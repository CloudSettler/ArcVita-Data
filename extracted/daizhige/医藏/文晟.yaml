person:
  qid: guji-文晟
  name_zh: 文晟
  names:
    zh: 文晟
    en: Wen Sheng
  lifespan:
    birth:
      date: 1800
      precision: year
      is_circa: true
      raw: 清代生人，生年不详
    death:
      date: 1880
      precision: year
      is_circa: true
      raw: 清代卒年不详
  birth_date: 1800
  death_date: 1880
  era: 清
  reign_ref: 清代
  archetype: 惠民医者
  dilemmas:
  - 急症猝至而乡野缺医缺药，如何以便方救急活人
  - 古方繁杂真伪参半，如何择验试确简便易行之法以惠众
  lesson: 救急贵在便简速验，平时采集成编，临事方能起死回生
  summary_first_person: 我生于清代，见自缢溺死冻死及五绝猝死与跌打金疮诸伤，仓猝无方多致夭枉，故遍集官桂汤控水法热土吸水法炒米熨心法鸭血蒜汁法野菊童便酒法七厘散等便验之方，编成急救便方一卷，愿人人可按方施救，全活生命
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/急救便方.md
  - https://daizhige.org/医藏/急救便方.html
endeavors:
- id: guji-文晟-endeavor-1
  title_zh: 编集五绝急救缢溺冻死便方
  summary: 汇集救自缢救溺死救冻死及中恶魇压惊坠等五绝卒死便方，以官桂汤倒驼控水热灰熨心鸭血蒜汁半夏吹鼻为要
  phases:
  - key: brewing
    name: 搜集缢溺冻死古方
    labels:
      zh: 酝酿搜集
    start_date: 1850
    highlight_event_id: guji-文晟-event-wujue-collect
  - key: breakthrough
    name: 厘定自缢溺死救法
    labels:
      zh: 突破成形
    start_date: 1855
    highlight_event_id: guji-文晟-event-wujue-collect
  - key: climax
    name: 完成五绝总治三方
    labels:
      zh: 高潮集成
    start_date: 1860
    highlight_event_id: guji-文晟-event-jijiu-chengshu
  - key: closure
    name: 刊定急救便方上卷
    labels:
      zh: 收束刊定
    start_date: 1862
    highlight_event_id: guji-文晟-event-jijiu-chengshu
  decisions:
  - date: 1855
    title_zh: 以缓抱解缢不用截绳
    rationale: 高悬自缢若截绳顿堕则气绝难返，故定法徐抱缓解放卧，正喉摩胸足，抵粪门存气，以官桂汤粥饮润喉
  - date: 1860
    title_zh: 以半夏皂角麝香为五绝总治
    rationale: 溺缢魇卒皆闭绝难醒，故立韭菜汁灌鼻生半夏纳鼻灸人中及足大趾三壮为通用捷法，心温者皆可治
- id: guji-文晟-endeavor-2
  title_zh: 汇集救诸伤金疮跌打骨折便方
  summary: 汇集跌打损伤金刃杀伤接骨续筋止血定痛诸方，以野菊童便酒七厘散花蕊石散牛角榆皮接骨法为核心
  phases:
  - key: brewing
    name: 搜集跌打金疮验方
    labels:
      zh: 酝酿搜集
    start_date: 1852
    highlight_event_id: guji-文晟-event-zhushang-collect
  - key: breakthrough
    name: 厘定七厘散为金疮第一方
    labels:
      zh: 突破确立
    start_date: 1858
    highlight_event_id: guji-文晟-event-zhushang-collect
  - key: climax
    name: 集成接骨续筋止血全法
    labels:
      zh: 高潮集成
    start_date: 1861
    highlight_event_id: guji-文晟-event-jijiu-chengshu
  - key: closure
    name: 刊定急救便方下卷
    labels:
      zh: 收束刊定
    start_date: 1862
    highlight_event_id: guji-文晟-event-jijiu-chengshu
  decisions:
  - date: 1858
    title_zh: 以七厘散为外伤常备
    rationale: 骨断筋折血流不止危在顷刻，故以朱砂麝香冰片乳香合制七厘散，酒冲内服调敷外伤，孕妇只敷不服
  - date: 1861
    title_zh: 以简便止血接骨法并收
    rationale: 乡野仓猝无药易致残死，故并收葱白砂糖敷龙眼核末敷柿饼涂接指蚕茧缚牛角榆皮缚及箭镞铅弹取出吞金吞针骨哽诸法，以全其形命
events:
- id: guji-文晟-event-birth
  date: 1800
  year_of: 1800
  type: birth
  title_zh: 生于清代
  description: 文晟生于清代，生平不详，以医道济世为志，留心民间急救验方
- id: guji-文晟-event-wujue-collect
  date: 1855
  year_of: 1855
  type: career
  title_zh: 搜集救缢溺冻及五绝方
  description: 搜集救自缢缓抱摩胸吹耳法官桂汤方，救溺死开口感水倒驼控水热土覆身竹管吹耳鼻法，救冻死炒米炒灰熨心法，及中恶惊魇压坠诸五绝以鸭血蒜汁韭菜汁半夏皂角吹鼻针刺唇泡艾灸涌泉等法
- id: guji-文晟-event-zhushang-collect
  date: 1858
  year_of: 1858
  type: career
  title_zh: 搜集救诸伤金疮跌打方
  description: 搜集跌打损伤野菊童便酒方苏木麻皮木耳方，刀械杀伤葱白炒敷三七敷方，血出不止降香锻石敷方，金疮肠出含水喷背缝合法，接骨断筋生地汁糯米皂角贴敷法，及箭镞竹刺吞金吞针骨哽取出法
- id: guji-文晟-event-jijiu-chengshu
  date: 1862
  year_of: 1862
  type: career
  title_zh: 编成急救便方一卷
  description: 将救自缢救溺死救冻死救五绝救诸伤诸门厘定成编，以便简速验为宗，使仓猝之间按方施救，多所全活
- id: guji-文晟-event-death
  date: 1880
  year_of: 1880
  type: death
  title_zh: 卒于清代
  description: 文晟卒于清代，卒年不详，所编急救便方流传于世，为民间救急常用之书
