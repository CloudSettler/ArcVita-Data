  reign_ref: 万历
  archetype: 医家
  dilemmas:
  - 宗师仲景经法与从俗铃锤活人类证之辨
  - 守六经纲纪统属与拘日拘经胶柱鼓瑟之惑
  - 用桂枝解肌固卫与误治伤寒发汗亡液之戒
  lesson: 道出于天而理在人心，守仲景六经之纲，辨风寒表里之变，不惑俗说，方能继往开来
  summary_first_person: 余新安方有执，字中行，号九山山人，有感俗说茅塞斯道，愤伤寒之不明，乃条隶三百九十七法于六经，各有纲纪统属，补方缺以便初学，万历己丑作序，癸巳作引，愿为后之有志仲景堂室者作级阶梯之助
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/伤寒论条辨.md
  - https://daizhige.org/医藏/伤寒论条辨.html
endeavors:
- id: guji-方有执-endeavor-1
  title_zh: 条辨伤寒论重定六经纲纪
  goal: 正叔和编次之乱，以三百九十七法条隶六经，使有定序，以便初学
  phases:
  - key: brewing
    name: 有感铃锤俗说茅塞立志宗经
    labels:
      zh: 酝酿
    start_date: 1570
    highlight_event_id: guji-方有执-event-1
  - key: breakthrough
    name: 万历己丑作序明条辨大义
    labels:
      zh: 突破
    start_date: 1589-03-01
    highlight_event_id: guji-方有执-event-1
  - key: climax
    name: 析表里阴阳定太阳阳明少阳太阴少阴阳明次序
    labels:
      zh: 高潮
    start_date: 1590
    highlight_event_id: guji-方有执-event-2
  - key: closure
    name: 万历癸巳作引补方定本垂后学
    labels:
      zh: 收束
    start_date: 1593-10-01
    highlight_event_id: guji-方有执-event-2
  decisions:
  - date: 1589-03-01
    title_zh: 作序自任条辨以开后学阶梯
    rationale: 七篇不作则杨墨横流，濂洛不传则道殊户异，故不辞僭越而条辨，以明本草素难伤寒一贯之天理
  - date: 1593-10-01
    title_zh: 改坊本漫布为六经纲纪统属并补桂枝附子去桂加术汤之缺
    rationale: 坊间法则平敷瀚布漫不可纪，方缺一而不全，故以纲纪维之使有定序，圈绝章句以便初学易读
- id: guji-方有执-endeavor-2
  title_zh: 行医阐道尊仲景为医圣
  goal: 辨风为百病之长与中风伤寒之异，活人济世，表章天人股肱素难
  phases:
  - key: brewing
    name: 受业经方精脉理识病穷理
    labels:
      zh: 酝酿
    start_date: 1540
    highlight_event_id: guji-方有执-event-birth
  - key: breakthrough
    name: 辨太阳中风桂枝解肌之奥义
    labels:
      zh: 突破
    start_date: 1589-03-01
    highlight_event_id: guji-方有执-event-1
  - key: climax
    name: 示桂枝禁例戒酒客湿热误投
    labels:
      zh: 高潮
    start_date: 1590
    highlight_event_id: guji-方有执-event-2
  - key: closure
    name: 立易简易知之教惠我后人
    labels:
      zh: 收束
    start_date: 1593-10-01
    highlight_event_id: guji-方有执-event-2
  decisions:
  - date: 1589-03-01
    title_zh: 明中风乃触犯天之八风非类中之风
    rationale: 诸家以阳气疾风为中风而不知卫中风之本义，李明之而后无人知此，故详辨以正其是非，使学人涵泳体认
  - date: 1593-10-01
    title_zh: 申桂枝本为解肌不可妄与浮紧无汗者
    rationale: 药有反对，病不对则禁，识解肌助药啜粥微汗之节制，方能荣卫和谐而不致吐脓血之变
events:
- id: guji-方有执-event-birth
  type: birth
  title_zh: 生于徽州新安
  date: 1523
  year_of: 1523
  description: 明嘉靖二年生于新安，名中行，以字有执行，号九山山人，少志经方之学
- id: guji-方有执-event-1
  type: achievement
  title_zh: 万历己丑春作伤寒论条辨序
  date: 1589-03-01
  year_of: 1589
  description: 万历己丑春三月朔作序，明医道肇始本草阐明素难大备伤寒，论仲景股肱素难功贤神皇轩岐，自任条辨为后学阶梯
- id: guji-方有执-event-2
  type: achievement
  title_zh: 万历癸巳秋作引重定六经辨太阳上编
  date: 1593-10-01
  year_of: 1593
  description: 万历癸巳阳月作引，辨仲景名机南阳长沙之事，定伤寒卒病论之名，作阳病在表阴病在里图说，首辨太阳中风桂枝汤六十六条方二十
- id: guji-方有执-event-death
  type: death
  title_zh: 卒于万历末年
  date: 1593
  year_of: 1593
  description: 条辨既成之后卒，遗书为诸方之祖，后世宗其说而称经方大师
