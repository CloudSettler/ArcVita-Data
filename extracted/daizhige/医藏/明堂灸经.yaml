  birth_date: 1190-01-01
  death_date: 1260-01-01
  era: 宋金
  reign_ref: 南宋理宗时
  archetype: 隐逸医家
  dilemmas:
  - 针灸并用易致误针与专立灸法保全之难
  - 明堂经脉图繁与侧伏正背人形详密之衡
  lesson: 舍针专灸以全生，绘图列穴以便用
  summary_first_person: 吾自题西方子，乡里名氏不传，见黄帝明堂偃侧遗法，又鉴王焘外台删针存灸之志，乃取铜人之外兼及侧伏，详列正人头面三十六穴及胸腹诸穴灸壮之数，主治禁灸，成明堂灸经八卷，刊于平阳，愿后人按图得穴，拔气蠲疾而已
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E6%98%8E%E5%A0%82%E7%81%B8%E7%BB%8F.html
