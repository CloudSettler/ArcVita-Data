endeavors:
- id: guji-明堂灸经-endeavor-1
  title_zh: 采明堂遗法专成灸经八卷
  summary_zh: 以黄帝十二经明堂偃侧人图为宗，参铜人针灸经，专论灸法不言针，详列头面胸腹诸穴位置壮数主治
  phases:
  - key: brewing
    name: 搜集明堂偃侧遗法
    labels:
      zh:
      - 搜集经络
      - 考订图形
    start_date: 1210-01-01
    highlight_event_id: guji-明堂灸经-event-1
  - key: breakthrough
    name: 定穴位灸壮主治
    labels:
      zh:
      - 定穴
      - 专灸
    start_date: 1220-01-01
    highlight_event_id: guji-明堂灸经-event-1
  - key: climax
    name: 八卷告成
    labels:
      zh:
      - 成书
    start_date: 1230-01-01
    highlight_event_id: guji-明堂灸经-event-1
  decisions:
  - date: 1220-01-01
    title_zh: 法王焘例删针专灸
    rationale: 鉴外台秘要力言误针之害，恐针误伤人，故只言灸不言针以保全
  - date: 1225-01-01
    title_zh: 兼绘侧伏补铜人不足
    rationale: 铜人惟有正背左右人形，用有未周，故兼及侧伏使取穴更详密
- id: guji-明堂灸经-endeavor-2
  title_zh: 平阳刊刻流传得四库著录
  summary_zh: 与铜人针灸经同刊于山西平阳府，流传民间，后经四库馆臣纪昀等校订著录于子部医家类
  phases:
  - key: climax
    name: 平阳刊行
    labels:
      zh:
      - 刊刻
      - 流传
    start_date: 1240-01-01
    highlight_event_id: guji-明堂灸经-event-2
  - key: closure
    name: 四库恭校著录
    labels:
      zh:
      - 校订
      - 著录
    start_date: 1781-12-01
    highlight_event_id: guji-明堂灸经-event-3
  decisions:
  - date: 1240-01-01
    title_zh: 就平阳与铜人并刊
    rationale: 借铜人盛行之势并刊，使灸法得与针经并传于世
  - date: 1781-12-01
    title_zh: 听四库存目辨明堂之义
    rationale: 依旧唐书经籍志明堂经脉别为一类，辨钱曾之说，正明堂为藏书授问之堂非偶人
events:
- id: guji-明堂灸经-event-birth
  date: 1190-01-01
  year_of: 1190
  title_zh: 生于宋金之际
  description_zh: 西方子生平不传，推为宋金间隐逸医者，乡里名氏无考
  place_zh: 山西平阳一带
- id: guji-明堂灸经-event-1
  date: 1230-01-01
  year_of: 1230
  title_zh: 撰成明堂灸经八卷
  description_zh: 成书八卷，首列正人头面三十六穴，次及胸腹手经诸穴，各详取穴分寸灸壮主治禁灸
  place_zh: 山西平阳
- id: guji-明堂灸经-event-2
  date: 1240-01-01
  year_of: 1240
  title_zh: 与铜人针灸经并刊于平阳
  description_zh: 与铜人针灸经俱刊于山西平阳府，以正背左右侧伏人形传布灸法
  place_zh: 山西平阳府
- id: guji-明堂灸经-event-3
  date: 1781-12-01
  year_of: 1781
  title_zh: 四库全书馆臣恭校著录
  description_zh: 乾隆四十六年十二月总纂官纪昀陆锡熊孙士毅总校官陆费墀恭校上，提要列入子部医家类
  place_zh: 北京四库馆
- id: guji-明堂灸经-event-death
  date: 1260-01-01
  year_of: 1260
  title_zh: 卒于金元之际
  description_zh: 卒年不详，书成刊行之后事迹无考，惟灸经八卷流传至今
  place_zh: 山西平阳一带
