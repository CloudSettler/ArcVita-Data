    start_date: 1830
    highlight_event_id: guji-曹仁伯-event-compilation
  decisions:
  - date: 1810
    title_zh: 补阳兼养阴驱寒化痰治臂痹
    rationale: 竹榻受寒阳气不宣屈伸不利，故以熟地归芍养血，参术苓夏化痰，附桂姜黄驱寒通络
  - date: 1820
    title_zh: 润燥互用运化中宫治胀满
    rationale: 脾虚生痰胃贮痰走膜外气道不清，故运中宫透膜外，佐以和养，不专攻伐
- id: guji-曹仁伯-endeavor-2
  title_zh: 撰述曹仁伯医案论垂教
  summary: 将藩署萧案卫道观头鸣德清嘉兴安徽诸案整理成论，详病机方药以示后学
  phases:
  - key: brewing
    name: 记录各家治验丸方
    labels:
      zh: 积累医案
    start_date: 1810
    highlight_event_id: guji-曹仁伯-event-jiaxing
  - key: breakthrough
    name: 阐发湿热先天后天之辨
    labels:
      zh: 立论湿热
    start_date: 1820
    highlight_event_id: guji-曹仁伯-event-anhui
  - key: climax
    name: 合虎潜清燥以治下虚上实
    labels:
      zh: 刚柔协济
    start_date: 1830
    highlight_event_id: guji-曹仁伯-event-compilation
  - key: closure
    name: 定稿刊行广传其法
    labels:
      zh: 成书流传
    start_date: 1832
    highlight_event_id: guji-曹仁伯-event-compilation
  decisions:
  - date: 1820
    title_zh: 舍助阳别无驱湿故主温通
    rationale: 湿热痰浊夹风夹疟，先化尽湿邪再和少阳，附子理中连理为定程
  - date: 1830
    title_zh: 清燥虎潜合方以治膏粱湿热
    rationale: 薄滋味远房帏不能守，膏粱嗜欲耗阴，外腑不清则内脏不安，故先清阳明再滋肝肾
