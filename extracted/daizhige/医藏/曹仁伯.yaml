- id: guji-曹仁伯-event-anhui
  title_zh: 论安徽程湿热阴虚证
  date: 1820
  year_of: 1820
  summary: 辨先天湿热牢不可破异于外感，戒火济火，主清燥虎潜润燥合宜之法
