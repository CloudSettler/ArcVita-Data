  summary_first_person: 吾蕲州李时珍，字东璧，号濒湖山人，三举不第，承父言闻之业，行医亲尝，病旧本草之舛误，立志重修，历二十七载，遍访湖广江西直隶诸地，亲采亲验，成纲目五十二卷，又著脉学奇经，以正医药，愿后人识草木之真，得用药之当耳
