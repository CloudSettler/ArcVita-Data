  decisions:
  - date: 1538
    title_zh: 承父言闻之教悬壶蕲州不慕荣利
    rationale: 民疾为重，临证最能验药，行医即是格物，不必以京官为荣
  - date: 1564
    title_zh: 简述脉学奇经以贻初学
    rationale: 脉理深奥而旧说纷纭，删繁就简作歌诀，使后学易记易用，诊先于药
