  decisions:
  - date: 1552
    title_zh: 弃举业专攻医药立志重修本草
    rationale: 旧本草品目混乱真伪莫辨，非亲验不能正，愿以一身任订正之责
  - date: 1556
    title_zh: 短任太医院判即归野采药
    rationale: 宫禁羁身难广见闻，不如访民间单验及山野所产，方能得草木之真
  - date: 1578
    title_zh: 纲目初成仍三易其稿不急求刊
    rationale: 芳草金石虫兽之名实尚须互证，宁缓刊以求真，不速成以传讹
- id: guji-李时珍-endeavor-2
  title_zh: 蕲州临证行医垂训脉学
  summary_zh: 世医行诊蕲黄之间，活人无数，又著濒湖脉学奇经八脉考，示后学诊脉辨证之要
