- id: guji-朱世扬-event-2
  title_zh: 阐发五疳及疟疾治法
  date: 1710
  year_of: 1710
  description: 分五脏论疳，以异功肥儿为纲，论疟忌刚燥截伐，主和养脾胃
- id: guji-朱世扬-event-death
  title_zh: 逝世
  date: 1735
  year_of: 1735
  description: 撰诚求集既成，卒于雍乾之际
