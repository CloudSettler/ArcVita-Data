endeavors:
- id: guji-朱世扬-endeavor-1
  title_zh: 撰诚求集明惊风虚实
  summary: 辨急慢惊脾风，立通关豁痰保脾之法
  phases:
  - key: brewing
    name: 临证积累
    labels:
      zh: 观察夜卧不宁啮齿为惊先兆
    start_date: 1690
    highlight_event_id: guji-朱世扬-event-1
  - key: breakthrough
    name: 立论截风定搐
    labels:
      zh: 先通关取吐嚏后清火定搐
    start_date: 1700
    highlight_event_id: guji-朱世扬-event-1
  - key: climax
    name: 参薛氏补脾宗旨
    labels:
      zh: 慢惊保脾土生金平木
    start_date: 1705
    highlight_event_id: guji-朱世扬-event-1
  - key: closure
    name: 成急慢惊风诸篇
    labels:
      zh: 附治验方论以诏后学
    start_date: 1710
    highlight_event_id: guji-朱世扬-event-1
  decisions:
  - date: 1700
    title_zh: 不用风药表散而清火截搐
    rationale: 内出之风由热极而生，疏散反助肝木，故只清火治惊
  - date: 1705
    title_zh: 慢惊专用温补保脾
    rationale: 久病吐泻耗伤中气，土虚木侮，不可再攻，宜六君固真以回阳
- id: guji-朱世扬-endeavor-2
  title_zh: 治疳疟全幼真元
  summary: 分五脏论疳，戒刚燥截疟，主和养脾胃
  phases:
  - key: brewing
    name: 察乳食伤脾成疳
    labels:
      zh: 辨心肝脾肺肾五疳冷热肥瘦
    start_date: 1702
    highlight_event_id: guji-朱世扬-event-2
  - key: breakthrough
    name: 立异功肥儿为纲
    labels:
      zh: 虚者补脾，积者磨积，有虫者化虫
    start_date: 1708
    highlight_event_id: guji-朱世扬-event-2
  - key: climax
    name: 论疟忌攻截
    labels:
      zh: 戒青皮常山刚燥，主小柴胡和解
    start_date: 1710
    highlight_event_id: guji-朱世扬-event-2
  - key: closure
    name: 成疳疟二门垂训
    labels:
      zh: 附疳疟治验以示去留缓急
    start_date: 1712
    highlight_event_id: guji-朱世扬-event-2
  decisions:
  - date: 1708
    title_zh: 疳久专用参苓白术补养
    rationale: 宿滞已去而气血耗损，再导则亡，故以补脾为大旨
  - date: 1710
    title_zh: 疟不妄用常山青皮截伐
    rationale: 正气益虚则邪愈深绵延变症，当和养脾胃移近汗解
events:
