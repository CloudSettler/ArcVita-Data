  - 急惊攻伐与顾护脾胃之衡
  - 俗执惊风二字而忽辨证之偏
  lesson: 治惊疳当辨虚实寒热，保脾为本，不执一端
  summary_first_person: 吾朱世扬，亲见幼科误以惊风概之，妄攻致夭，故采前贤及己验，撰诚求集，详急慢惊疳疟，愿后学诚求实证，保全幼小
