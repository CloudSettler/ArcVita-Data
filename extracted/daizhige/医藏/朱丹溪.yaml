  - date: 1347
    title_zh: 以格致余论自叙其学
    rationale: 医出格致之余，此物此知即修身之脉所衍，以理精医方能信今传后
  - date: 1356
    title_zh: 秘选手镜樵隐授后裔
    rationale: 手镜洞脏腑阴阳而文简质旨奥衍，秘惜以待其人而衍未尽之传
