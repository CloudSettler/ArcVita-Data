endeavors:
- id: guji-朱丹溪-endeavor-1
  title_zh: 著局方发挥辨风痿
  summary: 斥以治风药通治诸痿之误，引内经风论痿论及河间火论，立滋阴降火治痿之法
  phases:
  - key: brewing
    name: 质疑局方通治
    labels:
      zh: 读局方疑一方通治
    start_date: 1335
    highlight_event_id: guji-朱丹溪-event-fahui
  - key: breakthrough
    name: 辨风痿源流
    labels:
      zh: 分外感风与内伤痿热
    start_date: 1345
    highlight_event_id: guji-朱丹溪-event-fahui
  - key: climax
    name: 成书立论
    labels:
      zh: 著成局方发挥上卷
    start_date: 1347
    highlight_event_id: guji-朱丹溪-event-fahui
  - key: closure
    name: 垂法滋阴
    labels:
      zh: 取阳明泻南补北
    start_date: 1350
    highlight_event_id: guji-朱丹溪-event-ziyin
  decisions:
  - date: 1347
    title_zh: 不用脑麝金石治痿而用补养
    rationale: 诸痿皆起肺热，只宜补养，若以外感法治之必致实实虚虚
  - date: 1350
    title_zh: 取阳明泻南方补北方
    rationale: 肺热脾伤则四肢不用，清金降火则宗筋润机关利
- id: guji-朱丹溪-endeavor-2
  title_zh: 论气痰火热纠香燥
  summary: 斥治一切气例用辛香燥热及黑锡丹镇坠之误，主气病多火，痰饮多湿热，治以清养
  phases:
  - key: brewing
    name: 察气病用热之弊
    labels:
      zh: 审冷气滞气诸方
    start_date: 1340
    highlight_event_id: guji-朱丹溪-event-fahui
  - key: breakthrough
    name: 引仲景金匮为则
    labels:
      zh: 表里寒热分治
    start_date: 1346
    highlight_event_id: guji-朱丹溪-event-fahui
  - key: climax
    name: 明火极似水之理
    labels:
      zh: 自觉冷非真冷
    start_date: 1348
    highlight_event_id: guji-朱丹溪-event-ziyin
  - key: closure
    name: 示吞酸噎膈治法
    labels:
      zh: 粗食自养润燥养血
    start_date: 1352
    highlight_event_id: guji-朱丹溪-event-ziyin
  decisions:
  - date: 1348
    title_zh: 气升火炎不用丹剂硬降
    rationale: 相火厥阳之火随炎上，丹性热燥劫痰暂快而愈耗阴血
  - date: 1352
    title_zh: 吞酸噎膈主湿热养阴
    rationale: 郁久湿中生热从火化，宜黄连苍术茯苓和血润燥，淡薄食味以自养
events:
- id: guji-朱丹溪-event-birth
  title_zh: 出生于婺州
  date: 1281
  year_of: 1281
  description: 元至元十八年生于婺州义乌，名震亨，号丹溪
- id: guji-朱丹溪-event-fahui
  title_zh: 著成局方发挥
  date: 1347
  year_of: 1347
  description: 仿问答体斥局方一方通治，辨风痿内外，论气火痰饮，成书传世
- id: guji-朱丹溪-event-ziyin
  title_zh: 倡阳常有余阴常不足
  date: 1352
  year_of: 1352
  description: 明诸痿生于肺热，诸气逆属火，立滋阴降火，取阳明治痿之法
- id: guji-朱丹溪-event-death
  title_zh: 逝世
  date: 1358
  year_of: 1358
  description: 元至正十八年卒，一生批判局方，垂滋阴学派之教
