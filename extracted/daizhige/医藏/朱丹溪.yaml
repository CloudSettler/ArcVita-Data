  dilemmas:
  - title_zh: 局方定方与变通之择
    description_zh: 世守大观二百九十七方以定方应无穷之病，我择会通素难折衷仲景东垣戴人以求变通
  - title_zh: 出仕经世与托医而隐之择
    description_zh: 以才识可擘画世务一试于世，我择托医浮沉身名之间以阐医于道
  lesson: 以理精医，阳有余而阴不足，滋阴降火，变通攻补，方能济生传后
  summary_first_person: 我义乌朱震亨号丹溪，初游许谦门潜心理学得考亭之绪，后从罗知悌得刘守真之传，会通素难仲景东垣戴人而主气常有余血常不足，创滋阴降火之法，著格致余论局方发挥手镜樵隐以传后
  source_urls:
