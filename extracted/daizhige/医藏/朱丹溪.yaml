  - 遵局方简便通治与按经旨辨证适中之难
  - 求丹剂重坠暂快与养阴血治热升之本之难
  lesson: 一方难通治诸病，须辨内外虚实寒热，滋阴降火以求本
  summary_first_person: 吾婺州丹溪人，讳震亨，见世医守局方而以风药通治诸痿，以热药通治诸气，遂著局方发挥，辨风分内外，痿生于肺热，气病多火，倡养阴以治本
