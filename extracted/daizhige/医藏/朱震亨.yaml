  decisions:
  - date: 1308
    title_zh: 尽弃大观成方
    rationale: 故方新病难相值，泥方杀人，故求阴阳五行升降之理
  - date: 1311
    title_zh: 立罗知悌门终日不动
    rationale: 十往返不得通，唯以志诚动之，终得刘守真荆山浮屠一脉真传
- id: guji-朱震亨-endeavor-2
  title_zh: 立补阴论著格致余论济世
  summary: 见人多酗酒纵欲精竭火炽复用刚剂而毙，创阳常有余阴常不足之论，立补阴诸丸，著格致余论以箴饮食色欲
  phases:
