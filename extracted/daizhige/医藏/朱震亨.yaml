endeavors:
- id: guji-朱震亨-endeavor-1
  title_zh: 创滋阴学说别开医宗
  summary: 师事罗知悌，参悟刘完素朱肱之学，倡阳有余阴不足，创滋阴降火大法，与刘完素张从正李东垣并称金元四大家
  phases:
