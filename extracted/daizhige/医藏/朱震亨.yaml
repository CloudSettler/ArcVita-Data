    start_date: 1315
    highlight_event_id: guji-朱震亨-event-theory
  - key: climax
    name: 行道江浙名重一时
    labels:
      zh: 济世行医
    start_date: 1320
    highlight_event_id: guji-朱震亨-event-practice
  - key: closure
    name: 学说大成门人广传
    labels:
      zh: 传道授业
    start_date: 1340
    highlight_event_id: guji-朱震亨-event-teach
  decisions:
  - date: 1311
    title_zh: 弃举子业南游从罗知悌学医
    rationale: 母病求医有感，知经方不足恃，遂访名师穷究医理以明相火之秘
  - date: 1315
    title_zh: 倡阳有余阴不足专主滋阴降火
    rationale: 鉴世人多用辛温燥热耗伤真阴，故以养阴保真为大法，纠时医之偏
- id: guji-朱震亨-endeavor-2
  title_zh: 晚年删定治法心要垂范后世
  summary: 取格致余论局方发挥心法医要所未尽者，斟酌损益成定本，详论中风伤寒火郁等证，垂丹溪精神心术之微
  phases:
  - key: brewing
    name: 早年著述积累
