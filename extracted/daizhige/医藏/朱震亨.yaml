    labels:
      zh: 厘定旧说
    start_date: 1347
    highlight_event_id: guji-朱震亨-event-teach
  - key: climax
    name: 撰成治法心要定本
    labels:
      zh: 定本心要
    start_date: 1355
    highlight_event_id: guji-朱震亨-event-book
  - key: closure
    name: 高氏校刻流传海内
    labels:
      zh: 刊刻流传
    start_date: 1529
    highlight_event_id: guji-朱震亨-event-book
  decisions:
  - date: 1347
    title_zh: 取心法医要所未尽者另成心要
    rationale: 以二书尚有出入未备，欲存平生精神心术之微，使后人可求吾心而善其用
  - date: 1355
    title_zh: 以补阴降火贯通诸证治法
    rationale: 认诸病多因阴虚火动痰郁所致，故以养血清火化痰开郁为纲，垂万世法
events:
- id: guji-朱震亨-event-birth
  date: 1281
  year_of: 1281
  title_zh: 生于婺州义乌赤岸
  description: 元至元十八年生于儒医世家，幼习举子业，聪慧笃学，志在圣贤之道
- id: guji-朱震亨-event-study
  date: 1311
  year_of: 1311
  title_zh: 南游从罗知悌受医
  description: 年三十一弃举业南游，拜太无子罗知悌为师，尽得刘完素朱肱之传，医道大进
- id: guji-朱震亨-event-theory
  date: 1315
  year_of: 1315
  title_zh: 倡阳有余阴不足之论
  description: 作格致余论阐相火易动真阴难成之义，创滋阴降火大法，别开医宗
- id: guji-朱震亨-event-practice
  date: 1320
  year_of: 1320
  title_zh: 行医江浙声名大振
  description: 归乡悬壶，治中风痨瘵郁火等证屡获奇效，四方求治者日众，门人戴思恭等尽得其传
- id: guji-朱震亨-event-teach
  date: 1347
  year_of: 1347
  title_zh: 著述讲学门人日盛
  description: 先后著格致余论局方发挥伤寒辨疑等，授徒讲学，丹溪之学盛行江南
- id: guji-朱震亨-event-book
  date: 1355
  year_of: 1355
  title_zh: 晚年定治法心要之本
  description: 暮年取平生所著心法医要未尽者斟酌损益，成治法心要定本，为丹溪心术精备之作
- id: guji-朱震亨-event-death
  date: 1358
  year_of: 1358
  title_zh: 卒于故里
  description: 元至正十八年卒，年七十八，遗书经后人校刻流传，尊为滋阴派祖师
