- id: guji-朱震亨-event-teaching
  title_zh: 授徒传道心法成书
  date: 1350
  year_of: 1350
  description: 门人赵以德刘叔渊戴元礼翼其道，遗书传播，后人集为丹溪心法
- id: guji-朱震亨-event-death
  title_zh: 逝世
  date: 1358
  year_of: 1358
  description: 没后其传稍泯，近世儒者始好之，陕蜀相继刊行以广海内
