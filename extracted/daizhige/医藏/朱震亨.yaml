  - date: 1332
    title_zh: 独重滋阴降火
    rationale: 阳易动阴易亏，相火妄动则精走，故补阴以配阳，救刚剂杀人之弊
  - date: 1347
    title_zh: 应门人请著书名格致余论
    rationale: 医为儒者格物致知之一事，明其理以垂教生民，戒饮食色欲
events:
- id: guji-朱震亨-event-birth
  title_zh: 出生于婺州乌伤
  date: 1281
  year_of: 1281
  description: 金华人，名震亨字彦脩，早从许文懿公许谦游而闻道
- id: guji-朱震亨-event-abandon-formula
  title_zh: 抄习局方而尽弃去
  date: 1308
  year_of: 1308
  description: 手抄陈师文裴宗元大观二百九十七方昼夜习之，既而悟故方新病难值，尽弃去渡浙寻师
- id: guji-朱震亨-event-meet-luo
  title_zh: 十谒罗知悌得授其学
  date: 1311
  year_of: 1311
  description: 还杭拜太无罗知悌，十往返不得通，立其门终日不动，怜其志敷畅三家之旨，越数年悉受刘守真之学
- id: guji-朱震亨-event-return-home
  title_zh: 学成归乡群医大服
  date: 1315
  year_of: 1315
  description: 以所学归乡，群医方泥陈裴之学，闻言大惊已而大服，翕然共尊事之
- id: guji-朱震亨-event-yin-theory
  title_zh: 创阳常有余阴常不足论
  date: 1330
  year_of: 1330
  description: 谓天阳为气地阴为血，阴难成易亏，相火易动，立补阴诸丸，多有奇效
- id: guji-朱震亨-event-book
  title_zh: 格致余论成宋濂为序
  date: 1347-11-01
  year_of: 1347
  description: 徇门人张翼等请著书若干篇名格致余论，宋濂受而读之，至正七年冬南至书传学用功之所自于篇端
- id: guji-朱震亨-event-death
  title_zh: 卒于金华
  date: 1358
  year_of: 1358
  description: 年既高所见益粹精，年七十八卒，医特其一事而以医名，戴良为作丹溪翁传叙其始末
