  dilemmas:
  - 补泻之间如何祛邪而不伤正气
  - 尊古与创变之间如何以滋阴矫温燥之偏
  lesson: 阳常有余而阴常不足，养阴存正方能全天年，为医当守正不泥古，活人為本
  summary_first_person: 吾朱震亨，字彦修，号丹溪，婺州义乌人，少习儒业壮弃科举，师罗知悌而得医道正脉，倡阳有余阴不足之论，著金匮钩玄以提纲钩玄，愿后学以养阴保精为本，济世活人而心始安
