  - 局方成法流行而新病难值，守旧方恐杀人，弃成方则无所据
  - 世医喜温燥恶寒凉而病多阴亏火炽，立补阴之论恐遭群起而攻
  lesson: 阳常有余阴常不足，节饮食寡色欲以养阴，治病必求其本
  summary_first_person: 我名震亨字彦脩金华人，早从许谦闻道，手抄大观诸方而悟其弊，十谒罗知悌尽得刘守真之学，归以滋阴降火济世，著格致余论以明医乃儒者格物致知之余事
