  date: 1281
  year_of: 1281
  description: 婺之乌伤人，名震亨字彦修，元钜儒许文懿公高第弟子
- id: guji-朱震亨-event-study
  title_zh: 拜罗太无得刘张李之学
  date: 1325
  year_of: 1325
  description: 因母病脾刻志于医，遍游江湖无遇，还杭拜罗太无而得东垣河间之传以归
- id: guji-朱震亨-event-writing
