  archetype: 补土医圣
  dilemmas:
  - 外感伤寒与内伤脾胃杂病如何分辨施治
  - 寒凉攻伐盛行之时是否敢以温补脾胃立论
  - 药性寒热温平错杂如何使后学易知易用
  lesson: 脾胃为后天之本，内伤当以补益为先，养正方能祛邪，明标本缓急方能司人命
  summary_first_person: 吾乃真定李杲，号东垣老人，师事张元素，目睹战乱饥疫多归内伤，遂倡脾胃为元气之本，著脾胃论以补土救时，复分寒热温平以明药性，愿后学知标本缓急而善用之
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E7%8F%8D%E7%8F%A0%E5%9B%8A%E8%A1%A5%E9%81%97%E8%8D%AF%E6%80%A7%E8%B5%8B.md
