endeavors:
- id: guji-李东垣-endeavor-1
  title_zh: 开创脾胃内伤学派
  description_zh: 师承张元素，辨外感内伤，立补土温补之法，著脾胃论垂教后世
  phases:
  - key: brewing
    name: 少从张元素习医
    labels:
      zh: 尽得洁古之学
    start_date: 1196
    highlight_event_id: guji-李东垣-event-1
  - key: breakthrough
    name: 壬辰战乱悟内伤
    labels:
      zh: 饥疫内伤之辨
    start_date: 1232
    highlight_event_id: guji-李东垣-event-2
  - key: climax
    name: 脾胃论成书立说
    labels:
      zh: 元气脾胃之论
    start_date: 1249
    highlight_event_id: guji-李东垣-event-3
  - key: closure
    name: 授徒传道守正
    labels:
      zh: 罗谦甫等传业
    start_date: 1250
    highlight_event_id: guji-李东垣-event-4
  decisions:
  - date: 1232
    title_zh: 舍伤寒专论而主内伤脾胃
    rationale: 战后饥疫身热心烦多非外感，误用寒凉则殁，故以补益脾胃另立一途
  - date: 1249
    title_zh: 以升阳益气立补中益气诸方
    rationale: 脾胃虚则元气不足，温升甘补可使清阳上升，阴火自降
- id: guji-李东垣-endeavor-2
  title_zh: 分经明性撰珍珠囊药赋
  description_zh: 按寒热温平分药性，参图经方书，立引经报使与升降浮沉之纲
  phases:
  - key: brewing
    name: 博采本草图经
    labels:
      zh: 考药性之寒热
    start_date: 1235
    highlight_event_id: guji-李东垣-event-2
  - key: breakthrough
    name: 四性分类初定
    labels:
      zh: 寒热温平总括
    start_date: 1247
    highlight_event_id: guji-李东垣-event-4
  - key: climax
    name: 珍珠囊药性赋撰成
    labels:
      zh: 引经标本之法
    start_date: 1250
    highlight_event_id: guji-李东垣-event-4
  - key: closure
    name: 门人补遗流传
    labels:
      zh: 补遗药性之赋
    start_date: 1251
    highlight_event_id: guji-李东垣-event-death
  decisions:
  - date: 1247
    title_zh: 以四气五味升降浮沉统药
    rationale: 药有阴阳升降之能，分经用药方能使君臣佐使各归其经
  - date: 1250
    title_zh: 以赋体总括药性使易诵习
    rationale: 后学精神日月有限，知其概而付之专精者，故作简要药性赋以便记诵
events:
- id: guji-李东垣-event-birth
  date: 1180
  year_of: 1180
  title_zh: 诞生于真定
  description_zh: 金大定二十年生于真定，名杲字明之，晚号东垣老人
- id: guji-李东垣-event-1
  date: 1196
  year_of: 1196
  title_zh: 师事张元素
  description_zh: 捐千金从张洁古学医，尽得其术，兼通春秋礼记诸书
- id: guji-李东垣-event-2
  date: 1232
  year_of: 1232
  title_zh: 战乱后辨内伤外感
  description_zh: 壬辰汴京陷后饥疫并作，悟多系饮食劳倦内伤脾胃，非尽外感伤寒
- id: guji-李东垣-event-3
  date: 1249
  year_of: 1249
  title_zh: 脾胃论成书
  description_zh: 著脾胃论三卷，发明元气不足皆由脾胃，创补中益气等名方
- id: guji-李东垣-event-4
  date: 1250
  year_of: 1250
  title_zh: 珍珠囊药性分类垂世
  description_zh: 分寒热温平四赋以明药性，又论标本阴阳升降，门人补遗为珍珠囊补遗药性赋
- id: guji-李东垣-event-death
  date: 1251
  year_of: 1251
  title_zh: 卒于元初
  description_zh: 蒙古宪宗元年卒，年七十二，罗谦甫等传其补土之学
