  reign_ref: 明万历至清顺治
  archetype: 医家
  dilemmas:
  - 博涉全经与删繁就简之衡，为全内经则初学望涯而退，为知要则恐失全经之蕴
  - 出仕济世与退院守静之择，趋炎奔竞则寝食俱废，退隐著书则可守一传道
  lesson: 医道通乎仙道，守虚静执易简，明阴阳七损八益之机，治未病以尊生
  summary_first_person: 余云间李中梓，字念莪，晚号士材，少习儒而嗜医，遍览素问灵枢本草诸家，恐时师不及用功于鸡声灯影，故撮其至简至要，分为上下两卷，名曰内经知要，复著医宗必读以诏后学，愿由亲亲仁民以全尊生之道
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%86%85%E7%BB%8F%E7%9F%A5%E8%A6%81.md
