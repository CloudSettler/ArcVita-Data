  - key: climax
    name: 括要付剞劂寿世
    labels:
      zh: 刊布
    start_date: 1649
    highlight_event_id: guji-李中梓-event-kuoyao
  - key: closure
    name: 注疏仲景开晦蚀
    labels:
      zh: 注疏
    start_date: 1652
    highlight_event_id: guji-李中梓-event-kuoyao
  decisions:
  - date: 1649
    title_zh: 嘱许石子捐金付梓
    rationale: 独许石子一见颔之且汲汲寿世，欲指扶桑无舟莫适故藉刊刻以广流传
  - date: 1650
    title_zh: 悉遵古法不代轻剂
    rationale: 有是病则服是药如钥配锁，易以冲和轻剂则微奥隐故详别脉症以免妄投
