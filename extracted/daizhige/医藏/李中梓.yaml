    start_date: '1642'
    highlight_event_id: guji-李中梓-event-neijingzhiyao
  - key: closure
    name: 门人传抄后世重刊流布
    labels:
      zh: 收束流传
    start_date: '1643'
    highlight_event_id: guji-李中梓-event-neijingzhiyao
  decisions:
  - date: '1640'
    title_zh: 定上下两卷知要体例
    rationale: 卷帙繁多则时师望涯而退，惟至简至要方能有准则于胸中，故去枝叶存根柢
  - date: '1642'
    title_zh: 首揭道生阴阳四气调神为纲
    rationale: 不根于虚静即是邪术，不归于易简即是旁门，故以天真阴阳为首，明治未病之方
- id: guji-李中梓-endeavor-2
  person_qid: guji-李中梓
  title_zh: 行医授徒阐发医宗必读
  description: 诊疾活人于吴淞云间之间，授徒论药，著医宗必读伤寒括要诸书，辨虚实寒热气血脏腑之本
  phases:
  - key: brewing
    name: 吴中行医察时师得失
    labels:
      zh: 萌芽见闻
    start_date: '1615'
    highlight_event_id: guji-李中梓-event-yizongbidu
  - key: breakthrough
    name: 授徒讲论集成医宗必读
    labels:
      zh: 突破授徒
    start_date: '1637'
    highlight_event_id: guji-李中梓-event-yizongbidu
  - key: climax
    name: 辨阴阳虚实名动江南
    labels:
      zh: 高潮名显
    start_date: '1642'
    highlight_event_id: guji-李中梓-event-neijingzhiyao
  - key: closure
    name: 晚年退隐守静诏后学
    labels:
      zh: 收束归隐
    start_date: '1650'
    highlight_event_id: guji-李中梓-event-death
  decisions:
  - date: '1637'
    title_zh: 著医宗必读明治病求本
    rationale: 疑似之间混而弗明则实实虚虚贻祸，故洞察阴阳直穷病本以司命
  - date: '1650'
    title_zh: 退院不谈此道以全真守一
    rationale: 役医如吏藐医如工则道不行，不如退藏于密，存神葆真以终天年
