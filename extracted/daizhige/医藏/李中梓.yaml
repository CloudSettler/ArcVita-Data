  decisions:
  - date: 1645
    title_zh: 授珠十帙汇百家
    rationale: 伤寒千支万派须合符于仲景，非丹铅几遍髓竭心枯未易语故备纂以存义
  - date: 1649
    title_zh: 删授珠十之二为括要
    rationale: 多则惑少则得，后学苦繁故简邃选玄现丈六紫金俾入门径登高而无漏义
- id: guji-李中梓-endeavor-2
  title_zh: 著书授徒寿世济人
  description: 以医宗必读诊家正眼等开蒙后学，付梓刊刻以救夭枉，嘱门人许石子捐金寿世
  phases:
  - key: brewing
    name: 行医江左察色目
