  dilemmas:
  - 博备与简要之衡，授珠虽备而后学苦繁，当删繁去复以便入门
  - 守古与变通之难，悉遵仲景古法而须随地随时随人变通不敢胶柱
  lesson: 括义详而征词简，操通灵之法以应无穷之变，惟变取适而不胶于法
  summary_first_person: 吾李中梓字士材号尽凡居士，华亭人，发始燥便读仲景书，上下南阳易水间，纸败墨渝始成授珠十帙，乙酉毁于兵火，己丑删其繁复仅得十之二颜曰括要，欲使学人由径登高折衷千古，顺治六年上元识于尽凡
