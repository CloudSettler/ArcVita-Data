  - date: '1700-01-01'
    title_zh: 不揣愚鄙聊录一二付刊
    rationale: 他山之石可以攻玉狂夫之言圣人择或有道所取裁以广闻见
  - date: '1705-01-01'
    title_zh: 舍症取脉舍脉取症对症定方
    rationale: 一症有定论一方有万变非审脉验症不明定治何能斡旋造化
events:
- id: guji-李修之-event-birth
  date: '1650-01-01'
  year_of: 1650
  title_zh: 生于云间
  description: 清初生于江南云间家学渊源少研灵素考据百家
- id: guji-李修之-event-1
  date: '1680-08-01'
  year_of: 1680
  title_zh: 救邹邑侯子舍泄脱暴仆
  description: 子舍久泻眩晕仆地六脉全无议论纷纭独断脾元下脱用人参一两熟附二钱灌下夜半身暖神苏
- id: guji-李修之-event-2
  date: '1703-09-01'
  year_of: 1703
  title_zh: 治顾公鼎刀伤三十七刀
  description: 暮夜遭劫流血几干肉腐皮黑用养营汤大剂二十帖疮口尽敛百帖起坐越年却杖而行
- id: guji-李修之-event-3
  date: '1705-01-01'
  year_of: 1705
  title_zh: 门人辑成旧德堂医案付刊
  description: 及门唐廷翊立案记述上自公卿下逮贾竖怪病奇方自叙小叙阐发田华臣序而刊行
- id: guji-李修之-event-death
  date: '1720-01-01'
  year_of: 1720
  title_zh: 卒于云间
  description: 行医云间数十年后卒医案流传海上中医杂志选载裘吉生刊抄本以传
