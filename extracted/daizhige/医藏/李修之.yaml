    title_zh: 邹子舍暴仆用大剂参附回阳
    rationale: 泄久脾元下脱胃气上浮误认风寒发表则阳不可返急当温补培本
  - date: '1703-09-01'
    title_zh: 顾公鼎刀伤三十七刀用养营汤
    rationale: 血去卫散疮口不收滋阴反壅胃门当养营动阳火气周流自能收敛
- id: guji-李修之-endeavor-2
  title_zh: 授徒笔录刊行旧德堂医案
  description: 楮陈墨迹累案盈几及门二三子请付剞劂唐廷翊立案记述裘吉生刊行以副同道先睹之望
  phases:
