    title_zh: 以仿寓意草为名记何年月何病何效
    rationale: 方书多称神效而用之不验医案又语焉不详惟喻氏议论精辟彰彰可考故节录苦心历历可纪者以信而有征
  - date: 1835-09-27
    title_zh: 不泥古方不胶成见因心为用
    rationale: 药不执方相宜而用如补中益气加减治癃闭黄龙玉烛之意以补用下皆本气化虚热之理以神明之
