    title_zh: 痰闭肺窍用麻杏石甘汤以开提
    rationale: 壮热口渴而独喜热饮右寸独沉平素多痰五日不吐乃痰阻肺气上下不通非大辛大热麻黄不能搜肺鼓痰兼石膏清阳明之热
