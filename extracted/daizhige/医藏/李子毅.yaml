    title_zh: 以形色虎口为全书纲领
    rationale: 哑科脉难凭，面部分位五色与虎口三关最验，先立望诊以防误投峻剂
  - date: 1708
    title_zh: 保留异本校注不没众长
    rationale: 泰安汉阳诸本舔犊抵犊泄泻等异文并存，注中互见，俾后医有所据
