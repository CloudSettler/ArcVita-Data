events:
- id: guji-李珣-event-birth
  date: 0900
  year_of: 900
  title_zh: 诞生于前蜀世家
  description: 生于五代前蜀之际，家习诗文博物，长游岭南广地，习闻南海市舶药物。
- id: guji-李珣-event-survey
  date: 0930
  year_of: 930
  title_zh: 岭南南海访舶药
  description: 历广州交广诸番，访金线矾波斯白矾人参荜茇肉豆蔻沉香丁香诸舶药，采广州记南州记广志及胡人采验之说。
- id: guji-李珣-event-compile
  date: 0940
  year_of: 940
  title_zh: 撰成海药本草
  description: 别分玉石部草部木部三卷，载玉屑车渠金屑银屑琥珀沉香返魂香等，详形态性味主治验伪服法，是为海药本草。
- id: guji-李珣-event-death
  date: 0960
  year_of: 960
  title_zh: 逝世后世征引
  description: 殁后其书多为大观政和本草及纲目征引，玉屑车渠沉香丁香诸条列为舶药典据流传。
