  - title_zh: 随证与观证立法之辨
    description: 世医但知随证，不知观证有法，药能方验混为一谈，难入精义致用之境
  - title_zh: 古方今病之疑
    description: 晋唐以来束古方于伤寒门，疑古方不宜今病，致胸腹脐下动剧诸内候失治
  lesson: 精义入神以致用，稽古征今审药功，辨本性而通变
  summary_first_person: 吾乃肥后村井大年，笃信吉益东洞翁之学，治旧疾起废疾，幸得薄名，集药征所未载之品，稽古征今，审其功能，作续编以补其阙，愿后学观证有法，不混药能方验而得入神
  source_urls:
