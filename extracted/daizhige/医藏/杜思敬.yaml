  decisions:
  - date: '1290'
    title_zh: 引甄权成君绰等验案
    rationale: 以喉闭三日一针即愈等实案证针效，坚后学信心
  - date: '1300'
    title_zh: 针药并载不偏废
    rationale: 针主调气血，药主扶正祛邪，二者相济方能济生
