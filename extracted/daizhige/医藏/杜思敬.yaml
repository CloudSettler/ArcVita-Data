  decisions:
  - date: '1280'
    title_zh: 以气血多少为总纲
    rationale: 先明肝多血少气胃多气多血等差别，令学者用针前先知虚实
  - date: '1285'
    title_zh: 以是动所生分别气血病
    rationale: 动则言气变，所生言血变，气血分途则病机清晰
  - date: '1285'
    title_zh: 以井荥俞经合系穴治
    rationale: 每经举五输原穴并详刺灸分寸，执简而能驭繁
- id: guji-杜思敬-endeavor-2
  title_zh: 汇刊济生方书弘扬针道
  summary: 不仅节针经，更汇集诸家方论，编济生拔萃，令针药并重，惠及民间
