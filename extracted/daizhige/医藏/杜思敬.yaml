  - title_zh: 灵枢浩博初学难入
    description: 经文卷帙浩大义理散漫，欲存经旨又欲便于诵习，故决意删繁举要
  - title_zh: 针下有风险守补泻之戒
    description: 气血多少虚实各异，补虚泻实毫厘系命，故谨守部分经穴不敢妄施
  lesson: 删繁就简，执简驭繁，守经达变以利后学
  summary_first_person: 吾为元初医者，见灵枢针经义博难究，学者望洋，故节录十二经气血多少，是动所生诸病，以及各经井荥俞经合孔穴主治，成针经节要一编，愿后人按经取穴，调其气血，补虚泻实而全其生
