  lesson: 首察病原次辨药力由标本经络阴阳反畏以求随叩随应
  summary_first_person: 余宛陵仙源杜氏也，悯方书不可尽信而漫立局幸中者多，故察病原以补东垣之缺，辨药力以佐仲景之偏，论证由标本以及经络，审性由阴阳以及反畏，次第常用药味以便检阅，愿得此鉴者疗病审药无素问而达生无叔和而知脉
