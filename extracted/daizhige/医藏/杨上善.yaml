  summary_first_person: 我生逢隋唐之际少习医经久任朝列奉唐主之命取素问灵枢甲乙诸书编为太素三十卷复加注疏于摄生顺养六气九气之旨尤加详说愿后人藏而行之春夏养阳秋冬养阴不治已病治未病
