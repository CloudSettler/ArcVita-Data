  - title_zh: 沽名之讥与济人之志
    description: 始撰活人总括婴儿指要脉书反遭沽名之讥，敛肃自省，终以天授济人之心自勉
  - title_zh: 前哲未言与诸家已效之衡平
    description: 既剖前哲未言之蕴，又摘诸家已效之方，济以家传参之肘后，务使直而易晓
  lesson: 天予人以是物必使人有用是物，得之于天还以事天，方不自弃其天
  summary_first_person: 吾三山杨士瀛，字登父，号仁斋，福州人，天寓我以济人利物之心，资我以心通意晓之学，先撰活人总括婴儿指要脉书，又于景定甲子原证择方著为直指，愿读者对病识证因证得药，仁意周流同跻斯民于仁寿之域
