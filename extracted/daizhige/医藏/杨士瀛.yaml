    title_zh: 以景定甲子序刻遗世
    rationale: 天予是物必使有用是物，玉不毁椟中，愿仁意周流亹亹相续同跻仁寿
events:
- id: guji-杨士瀛-event-birth
  title_zh: 生于福州三山
  date: 1220-01-01
  year_of: 1220
  description: 杨士瀛字登父号仁斋，福州三山人，生年无考，约生于宋宁宗嘉定末前后
- id: guji-杨士瀛-event-early
  title_zh: 撰活人总括婴儿指要及脉书
  date: 1250-01-01
  year_of: 1250
  description: 先后撰活人总括婴儿指要及脉书一行，俗以沽名讥之，乃以天授济人之心自勉不辍
- id: guji-杨士瀛-event-zhizhi
  title_zh: 景定甲子序仁斋直指
  date: 1264-09-01
  year_of: 1264
  description: 景定甲子良月朔自序仁斋直指，先已有伤寒类书七卷，直指列二十八卷析七十九条，上自本草素难下及脉病证治，搜元剔诀灿若珠玑
- id: guji-杨士瀛-event-death
  title_zh: 卒于宋末
  date: 1280-01-01
  year_of: 1280
  description: 宋末人，次年即咸淳元年后事迹无考，卒年无考，约卒于宋末元初，其书赖嘉靖庚戌余锓朱崇正刻本流传
