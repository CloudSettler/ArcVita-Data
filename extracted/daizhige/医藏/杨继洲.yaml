  archetype: 医道集大成者
  dilemmas:
  - 家传秘要宜守藏或宜广传济世
  - 众书异同宜偏信一家或折衷总辑以归一
  lesson: 博采众方而守约施治以全针道之用
  summary_first_person: 吾三衢杨济时也，承家传针法，遍览素难铜人千金诸书，芟繁就简，总辑为针灸大成十卷，愿后学守约而致博，持针而活人。
  source_urls:
