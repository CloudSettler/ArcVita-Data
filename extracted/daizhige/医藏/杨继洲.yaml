endeavors:
- id: guji-杨继洲-endeavor-1
  title_zh: 总辑诸书编成针灸大成
  description: 汇集素问难经铜人明堂千金外台诸家针灸要旨，分类编次为针灸大成十卷，俾学人有守约之规。
  phases:
  - key: brewing
    name: 家传启蒙与博览
    labels:
      zh:
      - 家传
      - 博览
    start_date: '1540'
    highlight_event_id: guji-杨继洲-event-study
  - key: breakthrough
    name: 着手玄机秘要
    labels:
      zh:
      - 着述
      - 立纲
    start_date: '1570'
    highlight_event_id: guji-杨继洲-event-xuanji
  - key: climax
    name: 总辑成针灸大成
    labels:
      zh:
      - 总辑
      - 成书
    start_date: '1601'
    highlight_event_id: guji-杨继洲-event-dacheng
  - key: closure
    name: 靳贤校正刊行
    labels:
      zh:
      - 校正
      - 刊行
    start_date: '1601'
    highlight_event_id: guji-杨继洲-event-dacheng
  decisions:
  - date: '1575'
    title_zh: 先着玄机秘要以立家法
    rationale: 以家传心法为本，撰玄机秘要，验于临床而后推及众书，免空论无归。
  - date: '1601'
    title_zh: 总辑众书分为十卷
    rationale: 诸书浩瀚而异同相乱，必类聚源流经络腧穴治法，方能守约致博，垂惠后学。
  - date: '1601'
    title_zh: 委晋阳靳贤选集校正
    rationale: 借他人校雠以正误文缺义，使版行精善，广传天下。
- id: guji-杨继洲-endeavor-2
  title_zh: 传承针道临床济世
  description: 以针刺灸法导引按跷施治痈疡痹厥咳疟诸疾，辨经络虚实浅深，传徒授法以续医脉。
  phases:
  - key: brewing
    name: 习内经针道源流
    labels:
      zh:
      - 明经
      - 辨证
    start_date: '1545'
    highlight_event_id: guji-杨继洲-event-study
  - key: breakthrough
    name: 行医三衢以针显名
    labels:
      zh:
      - 行医
      - 立名
    start_date: '1560'
    highlight_event_id: guji-杨继洲-event-practice
  - key: climax
    name: 授徒传法广惠一方
    labels:
      zh:
      - 授徒
      - 济世
    start_date: '1585'
    highlight_event_id: guji-杨继洲-event-teach
  - key: closure
    name: 以书代口垂训后世
    labels:
      zh:
      - 立言
      - 垂训
    start_date: '1601'
    highlight_event_id: guji-杨继洲-event-dacheng
  decisions:
  - date: '1560'
    title_zh: 坚持针药并用因地因人施治
    rationale: 东方砭石西方毒药北方微针中央导引，各得其宜，不可偏废一法。
  - date: '1585'
    title_zh: 开门授徒传流注开阖之要
    rationale: 针道微妙存乎心手，独善不如众济，故以家传所授高洞阳一脉之法授诸生。
events:
- id: guji-杨继洲-event-birth
  title_zh: 生于三衢医家
  date: '1522'
  year_of: 1522
  place_zh: 浙江衢州
  description: 明嘉靖初年生于世医之家，少承家学，习素问难经及针灸诸图经。
- id: guji-杨继洲-event-study
  title_zh: 博览针灸诸书究源流
  date: '1555'
  year_of: 1555
  place_zh: 三衢
  description: 遍考素问难经子午铜人明堂千金翼方外台秘要金兰循经诸书，辨其源流得失，为日后总辑奠基。
- id: guji-杨继洲-event-practice
  title_zh: 行医用针以治热疟咳腰痛
  date: '1565'
  year_of: 1565
  place_zh: 江浙一带
  description: 以刺热刺疟刺咳刺腰痛诸法行世，审经络腧穴虚实补泻，活人甚众，声名渐起。
- id: guji-杨继洲-event-xuanji
  title_zh: 着玄机秘要成家传之学
  date: '1580'
  year_of: 1580
  place_zh: 三衢
  description: 总结家传经验撰成玄机秘要，论针道直指与用穴心法，为针灸大成之先声。
- id: guji-杨继洲-event-teach
  title_zh: 授徒传道名播南北
  date: '1590'
  year_of: 1590
  place_zh: 三衢
  description: 收徒讲授幽赋流注八穴指法及十四经发挥之旨，门人靳贤等相从问道。
- id: guji-杨继洲-event-dacheng
  title_zh: 总辑针灸大成十卷刊行
  date: '1601'
  year_of: 1601
  place_zh: 衢州
  description: 会通古今医统乾坤生意医学入门诸书中针灸部分，总辑为针灸大成十卷，委晋阳靳贤选集校正刊行于万历二十九年。
- id: guji-杨继洲-event-death
  title_zh: 卒于万历末年
  date: '1620'
  year_of: 1620
  place_zh: 浙江衢州
  description: 晚年以书传世而卒，后世奉针灸大成为针科圭臬，尊为针灸集大成之师。
