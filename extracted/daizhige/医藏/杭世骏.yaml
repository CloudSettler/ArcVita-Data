  lesson: 学必有范则，知人知时知脉，因势利导，方不杀生人
  summary_first_person: 吾乃仁和杭世骏，字大宗，号堇浦，以博学鸿词授编修，罢归后以经史文集终老，尝为魏玉横续名医类案作序，谓黄帝扁鹊虽死，类案即其书之旨，学者当以此为范则
