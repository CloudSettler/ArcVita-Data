endeavors:
- id: guji-杭世骏-endeavor-1
  title_zh: 博学鸿词入馆与经史著述
  summary: 早治经史，乾隆元年举博学鸿词授编修，纂修三礼诸史，罢官后著道古堂集
  phases:
  - key: brewing
    name: 仁和早年治经
    labels:
      zh: 潜心经史
    start_date: 1710
    highlight_event_id: guji-杭世骏-event-birth
  - key: breakthrough
    name: 鸿词授编修入馆
    labels:
      zh: 入馆纂修
    start_date: 1736
    highlight_event_id: guji-杭世骏-event-hongci
  - key: closure
    name: 罢归著述道古堂
    labels:
      zh: 罢官著述
    start_date: 1743
    highlight_event_id: guji-杭世骏-event-hongci
  decisions:
  - date: 1736
    title_zh: 应博学鸿词科
    rationale: 以经史之学应征，欲展所学于馆阁纂修
  - date: 1743
    title_zh: 罢官归里专事著述
    rationale: 朝局难容直言，不如归里考据成书以传后
- id: guji-杭世骏-endeavor-2
  title_zh: 为续名医类案作序论医
  summary: 观魏玉横广江瓘名医类案为六十卷，以黄帝扁鹊之旨立论，戒粗工误针杀人，劝学医者以类案为蒙求范则
  phases:
  - key: brewing
    name: 交游浙中名医
    labels:
      zh: 交游医家
    start_date: 1745
    highlight_event_id: guji-杭世骏-event-hongci
  - key: breakthrough
    name: 撰续名医类案序
    labels:
      zh: 作序阐医道
    start_date: 1755
    highlight_event_id: guji-杭世骏-event-preface
  - key: climax
    name: 立类案为学医范则
    labels:
      zh: 阐明范则
    start_date: 1755
    highlight_event_id: guji-杭世骏-event-preface
  decisions:
  - date: 1755
    title_zh: 以阴阳二十五人为纲论医杀人
    rationale: 见粗工遍满不读黄帝扁鹊之书而试其术，故托序以警世
  - date: 1755
    title_zh: 许魏玉横能读黄扁书而推其书
    rationale: 因其广集前哲之案而能发明书旨，足为伐柯之则，故乐为序引
events:
- id: guji-杭世骏-event-birth
  title_zh: 生于浙江仁和
  date: 1696
  year_of: 1696
  description: 康熙三十五年生于仁和杭氏，少治经史
- id: guji-杭世骏-event-hongci
  title_zh: 乾隆元年举博学鸿词授编修
  date: 1736
  year_of: 1736
  description: 以博学鸿词征入京，授翰林院编修，参与纂修，后罢归
- id: guji-杭世骏-event-preface
  title_zh: 为魏之琇续名医类案作序
  date: 1755
  year_of: 1755
  description: 应魏玉横之请作序，论粗工杀人之罪与上工类案之功，谓类案传即黄帝扁鹊不死，劝以此为学医范则
- id: guji-杭世骏-event-death
  title_zh: 卒于仁和
  date: 1773
  year_of: 1773
  description: 乾隆三十八年卒于里，年七十八，著有道古堂集传世
