    title_zh: 见汗下失度者主调胃存津不主攻邪
    rationale: 因太阳病汗下后表里俱虚之变悟妄汗亡阳妄下竭阴故以和为贵
  - date: 1715
    title_zh: 持六经皆有温病之说不拘冬寒春温
    rationale: 因见太阳温病不恶寒而渴知四时六经皆可病温以破拘泥伏寒之论
