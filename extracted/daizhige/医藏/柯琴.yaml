endeavors:
- id: guji-柯琴-endeavor-1
  title_zh: 考订六经著伤寒论翼
  description: 辨叔和编次之谬，明伤寒杂病合论，清理六经部位主治
  phases:
  - key: brewing
    name: 究心仲景博览医经
    labels:
      zh:
      - 研读
      - 考据
    start_date: 1685
    highlight_event_id: guji-柯琴-event-laisuji
  - key: breakthrough
    name: 悟合论大法立六经地面说
    labels:
      zh:
      - 立论
      - 明经
    start_date: 1719
    highlight_event_id: guji-柯琴-event-laisuji
  - key: climax
    name: 甲寅作序论翼成书
    labels:
      zh:
      - 著述
      - 传道
    start_date: 1734
    highlight_event_id: guji-柯琴-event-yi-xu
  - key: closure
    name: 全论大法六经正义垂后
    labels:
      zh:
      - 成书
      - 示人
    start_date: 1734
    highlight_event_id: guji-柯琴-event-yi-xu
  decisions:
  - date: 1719
    title_zh: 先著来苏集以开端
    rationale: 恐人未知合论之旨，先以杂病不足观为引，渐明原文
  - date: 1734
    title_zh: 直斥叔和林亿方氏之失
    rationale: 冠脉法序例于前集之举皆非本来，不辨则仲景之道不可得
- id: guji-柯琴-endeavor-2
  title_zh: 经方临床济世传法
  description: 以仲景方药为准绳，治伤寒杂病无二理，活人无算
  phases:
  - key: brewing
    name: 慈溪行医辨证施治
    labels:
      zh:
      - 行医
      - 实践
    start_date: 1685
    highlight_event_id: guji-柯琴-event-practice
  - key: breakthrough
    name: 经方得验名重江浙
    labels:
      zh:
      - 临床
      - 验方
    start_date: 1705
    highlight_event_id: guji-柯琴-event-practice
  - key: climax
    name: 以方药阐内经大法
    labels:
      zh:
      - 合参
      - 化育
    start_date: 1719
    highlight_event_id: guji-柯琴-event-laisuji
  - key: closure
    name: 遗书惠后学宗经方
    labels:
      zh:
      - 遗惠
      - 宗经
    start_date: 1735
    highlight_event_id: guji-柯琴-event-death
  decisions:
  - date: 1705
    title_zh: 坚持仲景活法不随时定剂
    rationale: 因症立方不拘四时汗吐下，寒热温凉随其攸利方能治变迁
  - date: 1719
    title_zh: 以著述代口传广拯时医
    rationale: 旁门歧路莫知适从，须笔之于书使参赞化育之书不归狐疑
events:
- id: guji-柯琴-event-birth
  date: 1662
  year_of: 1662
  title_zh: 生于浙江慈溪
  description: 清康熙元年生于慈溪柯氏，自幼力学，后专治医经
- id: guji-柯琴-event-practice
  date: 1705
  year_of: 1705
  title_zh: 行医江浙精研仲景
  description: 游历行医，以伤寒杂病合参，屡起沉疴，究心仲景有年
- id: guji-柯琴-event-laisuji
  date: 1719
  year_of: 1719
  title_zh: 著成伤寒来苏集
  description: 集平生心得著来苏集，为论翼先声，明经方之用
- id: guji-柯琴-event-yi-xu
  date: 1734
  year_of: 1734
  title_zh: 甲寅春作伤寒论翼自序
  description: 于慈溪作自序，斥补伤寒者百余家之失，立全论大法与六经正义
- id: guji-柯琴-event-death
  date: 1735
  year_of: 1735
  title_zh: 逝世
  description: 论翼成后不久即逝，遗书盛行于世，后人尊为经方大家
