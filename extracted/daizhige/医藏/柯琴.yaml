endeavors:
- id: guji-柯琴-endeavor-1
  title_zh: 考訂太陽麻桂桂枝湯麻黃湯主治
  summary: 以表虛表實定桂麻界限釐清有汗無汗脈弱脈緊之辨
  phases:
  - key: brewing
    name: 博覽傷寒注疏疑風寒分治
    labels:
      zh: 醞釀
    start_date: 1685
    highlight_event_id: guji-柯琴-event-1
  - key: breakthrough
    name: 悟麻黄治表實桂枝治表虛
    labels:
      zh: 突破
    start_date: 1700
    highlight_event_id: guji-柯琴-event-1
  - key: climax
    name: 詳論桂枝解肌麻黄開表
    labels:
      zh: 高潮
    start_date: 1706
    highlight_event_id: guji-柯琴-event-1
  - key: closure
    name: 成來蘇集太陽篇垂訓後學
    labels:
      zh: 收束
    start_date: 1708
    highlight_event_id: guji-柯琴-event-1
  decisions:
  - date: 1700
    title_zh: 不以中風傷寒分方以虛實分治
    rationale: 有汗脈弱用桂枝無汗脈緊用麻黄風寒俱有虛實淺深故也
  - date: 1706
    title_zh: 明桂枝解肌麻黄開竅各守其用
    rationale: 桂枝發營中汗麻黄出衛分邪汗後不解當轉桂枝不可再峻發也
- id: guji-柯琴-endeavor-2
  title_zh: 撰傷寒附翼駁大青龍鼎立說
  summary: 論青龍大小治裏寒熱之別正許叔微方氏三綱之誤
  phases:
  - key: brewing
    name: 考大小青龍葛根五苓諸加減
    labels:
      zh: 醞釀
    start_date: 1715
    highlight_event_id: guji-柯琴-event-2
  - key: breakthrough
    name: 識大青龍兩解表裏治風熱煩躁
    labels:
      zh: 突破
    start_date: 1725
    highlight_event_id: guji-柯琴-event-2
  - key: climax
    name: 著附翼太陽方總論批倒序誤解
    labels:
      zh: 高潮
    start_date: 1730
    highlight_event_id: guji-柯琴-event-2
  - key: closure
    name: 示石膏清裏麻黄發表相濟之法
    labels:
      zh: 收束
    start_date: 1732
    highlight_event_id: guji-柯琴-event-2
  decisions:
  - date: 1725
    title_zh: 定青龍大小在麻黄多少不在石膏
    rationale: 石膏但清中宮燔灼不能驅表風寒汗多亡陽過在麻黄也
  - date: 1730
    title_zh: 駁桂治風麻治寒大青龍鼎立之說
    rationale: 諸方皆麻桂加減因表實內外寒熱淺深而變不可鼎立也
