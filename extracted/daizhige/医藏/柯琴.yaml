  reign_ref: 康熙
  archetype: 医家
  dilemmas:
  - 王叔和编次失真而世人盲从伤寒专名
  - 伤寒杂病分门而六经大法不明莫知适从
  lesson: 伤寒杂病本合论，统于六经地面，见病知源，方不为编次所误
  summary_first_person: 吾乃慈溪柯琴，究心仲景有年，痛叔和改头换面分伤寒杂病为两书，致六经不明邪说锢世，故作论翼以明合论大法，愿人握六经枢机而尽愈诸病
  source_urls:
