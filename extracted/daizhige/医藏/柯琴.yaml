  dilemmas:
  - 泥於中風傷寒名目以分桂麻與憑脈辨虛實以施治之抉擇
  - 遵分經用藥成說與求仲景制方心法之抉擇
  lesson: 表有虛實當以有汗無汗脈弱脈緊為憑不拘風寒之名方能放膽用麻桂以解表
  summary_first_person: 吾柯琴字韻伯慈溪人也究心仲景太陽諸方辨麻黄治表實桂枝治表虛著來蘇集附翼以正三綱鼎立之誤願後人憑脈證虛實而施汗法勿為風寒所拘
  source_urls:
