  archetype: 温病考据医家
  dilemmas:
  - 伏气发温与新感温邪混称温病，临证何以分别施治
  - 喻昌分伏气为三纲，王叔和谓寒毒藏肌肤，旧说相违，何以归于一是
  lesson: 冬不藏精则寒伏少阴，春夏随生气外发为温暑，治宜养阴透邪，慎汗慎食，兼治未病
  summary_first_person: 余潜心灵素热论刺热诸篇，考冬伤于寒春必病温之义，知伏邪藏于少阴，随生气而动，著温热逢源以正喻王之偏，发明养阴存精与治未病之旨
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E6%B8%A9%E7%83%AD%E9%80%A2%E6%BA%90.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E6%B8%A9%E7%83%AD%E9%80%A2%E6%BA%90.md
endeavors:
- id: guji-柳宝诒-endeavor-1
  title_zh: 详注灵枢素问伏气化温诸条
  summary: 以灵枢论疾诊尺素问生气通天热论刺热诸篇为纲，辨随时伤寒与伏气发温之异，定温暑以热轻重随时变名之说
  phases:
  - key: brewing
    name: 博览内经温热经文
    labels:
      zh: 研经
    start_date: '1865'
    highlight_event_id: guji-柳宝诒-event-study
  - key: breakthrough
    name: 悟伏邪藏少阴随生气而动
    labels:
      zh: 立论
    start_date: '1880'
    highlight_event_id: guji-柳宝诒-event-study
  - key: climax
    name: 成温热逢源卷上注论
    labels:
      zh: 成书
    start_date: '1890'
    highlight_event_id: guji-柳宝诒-event-write
  - key: closure
    name: 示尺热脉躁与五脏热病治法
    labels:
      zh: 垂教
    start_date: '1895'
    highlight_event_id: guji-柳宝诒-event-write
  decisions:
  - date: '1880'
    title_zh: 断伏寒必藏少阴不容三纲分立
    rationale: 同一伏邪因肾气虚实有轻重深浅之异，理原一贯，故不从喻昌肌肤骨髓内外三分之说
  - date: '1890'
    title_zh: 定温暑同病异名兼挟时令之邪
    rationale: 春兼风夏兼暑，热轻曰温热重曰暑，夏至后汗多勿止，故分别温暑以明治禁
- id: guji-柳宝诒-endeavor-2
  title_zh: 发明治未病与病后防复防遗之法
  summary: 据见赤色刺之治未病与饮寒水寒衣居寒处之法，申论热病遗复食禁与阴阳交死证之辨
  phases:
  - key: brewing
    name: 考五脏热病先见于色
    labels:
      zh: 望诊
    start_date: '1882'
    highlight_event_id: guji-柳宝诒-event-study
  - key: breakthrough
    name: 明汗生于精邪胜精负之机
    labels:
      zh: 辨汗
    start_date: '1888'
    highlight_event_id: guji-柳宝诒-event-teach
  - key: climax
    name: 论遗复食禁与阴阳交
    labels:
      zh: 防变
    start_date: '1892'
    highlight_event_id: guji-柳宝诒-event-teach
  - key: closure
    name: 垂驱湿保脱与慎饮冷之戒
    labels:
      zh: 全生
    start_date: '1896'
    highlight_event_id: guji-柳宝诒-event-teach
  decisions:
  - date: '1888'
    title_zh: 主温病初发可用凉解不虑遏邪
    rationale: 久伏之热自内而发，治热以寒为定理，先饮寒水后刺泄，再辅寒衣寒处以逐热
  - date: '1892'
    title_zh: 严病后食肉多食之禁
    rationale: 病衰热藏得谷相搏两热相合则遗复，故只许清淡稀粥渐养，视虚实调逆从
events:
- id: guji-柳宝诒-event-birth
  title_zh: 生于清道光末年
  date: '1842'
  year_of: 1842
  description: 江南士人出身，少习经史，留意医学，尤究灵素伤寒温热之学
- id: guji-柳宝诒-event-study
  title_zh: 潜心内经伏气发温之学
  date: '1880'
  year_of: 1880
  description: 考冬伤于寒春必病温藏于精者春不病温诸条，参叶吴喻王诸家，悟伏邪在少阴之理
- id: guji-柳宝诒-event-write
  title_zh: 撰成温热逢源卷上
  date: '1890'
  year_of: 1890
  description: 详注灵枢素问伏气化温，论两感阴阳交五脏热病及阳明弃衣登高诸证，兼采章虚谷王梦隐之说
- id: guji-柳宝诒-event-teach
  title_zh: 阐发治未病与防遗复法
  date: '1892'
  year_of: 1892
  description: 示见赤色刺之治未病，汗后脉静躁生死之辨，热愈食禁与饮冷节度，并传驱湿保脱汤以防水脱
- id: guji-柳宝诒-event-death
  title_zh: 卒于民国初年
  date: '1922'
  year_of: 1922
  description: 晚年以温热逢源行世，后学奉为会通内经与叶吴温病之要籍
