  - 男子妇人杂病同而经血胎产独异庸医操一二方治众病不应则技穷当专汇妇人所独者以备其变
  - 女科准绳广搜博采而杂病概收分条不整序次无伦当汰去杂证门分类别纲下系目使览者因论识病因病取方
  lesson: 汰杂存专纲举目张因论识病因病取方而又神明变通不执方以尽术
  summary_first_person: 余究心妇科有年见准绳博而无统杂证混入难得其要故于公事之暇手为搜集专取经血胎产所独者门分类别纲下系目名曰济阴纲目庶使庸工亦可展卷提掌随手取效然医者意也愿学者神明变通以致斫轮承蜩之妙
