- id: guji-毛对山-event-study
  title_zh: 初读灵素望洋继而苦思渐通
  date: '1845-01-01'
  year_of: 1845
  kind: study
  description: 初读灵素觉经义渊深脉理错杂，并心壹志遍览注释镇日默坐苦思，渐通五运六气阴阳应象之理
- id: guji-毛对山-event-wu-prognosis
  title_zh: 诊巷邻吴某脉急如夺索断不越宿
  date: '1860-08-01'
  year_of: 1860
  kind: diagnosis
  description: 避兵乡里，对巷吴某晨起洒扫忽仆不语，按脉势急而锐肾气败，断危期不越宿，日未昃而气绝
- id: guji-毛对山-event-zhou-carbuncle
  title_zh: 诊布商周某心脉独坚预发脑后痈毒
  date: '1861-09-01'
  year_of: 1861
  kind: diagnosis
  description: 周某微疾按心脉独坚湿痰阻气，见脑后细疮累累若贯珠，嘱慎之，明春果以脑后毒发而死
- id: guji-毛对山-event-shen-cough
  title_zh: 沪斋诊沈子涵冬咳嘱静养不果
  date: '1867-03-01'
  year_of: 1867
  kind: diagnosis
  description: 丁未春沈子涵来沪见神色哀夺左坚细右关涩，断夏三月防失血，劝安闲静养，彼恃食补不药，后航海入都咳甚呕血卒于京
- id: guji-毛对山-event-yihua
  title_zh: 撰毛对山医话寄载医报
  date: '1885-01-01'
  year_of: 1885
  kind: work
  description: 或究症治或道经验搜罗丰富谈理玄妙，自言三折肱于是道，书载周雪樵医报由卢育和手录惠寄
- id: guji-毛对山-event-death
  title_zh: 逝世于清晚期
  date: '1890-12-31'
  year_of: 1890
  kind: death
