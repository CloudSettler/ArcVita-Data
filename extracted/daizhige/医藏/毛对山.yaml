  description_zh: 毛对山生于清中期，自言初读灵素觉经义渊深脉理错杂
- id: guji-毛对山-event-1
  date: 1860-06-01
  year_of: 1860
  title_zh: 按脉决吴某肾败不越宿
  description_zh: 避兵乡里诊对巷吴某忽仆不语，脉势急锐发如夺索，断肾气败危期不越宿，果日未昃而气绝，时人始信凭脉决症
- id: guji-毛对山-event-2
  date: 1885-03-01
  year_of: 1885
  title_zh: 撰成毛对山医话论脉症药
  description_zh: 成书究切脉辨症立方三要，辨虚损阴阳，论老人清通为用，记发瘕吐虫与赤藤杀虫等异症单方，阐医者意也之旨
- id: guji-毛对山-event-death
  date: 1900-01-01
