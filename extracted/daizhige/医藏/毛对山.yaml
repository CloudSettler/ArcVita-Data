  summary_first_person: 余初读灵素望洋意沮，并心壹志默坐苦思乃渐通五运阴阳，每调气度脉浪决生死亦时有验，遂知医必先询病察色而后按脉决疑，疏其血气以致和平，作医话以记症治经验示后学
