    title_zh: 舍门面医案专究脉理经义
    rationale: 切脉辨症立方为三要，脉明则辨症投药不难，不学和平活脱之术
  - date: 1870-01-01
    title_zh: 立先询病察色后按脉决疑之法
    rationale: 脉居四诊之末，不可离病就脉，若脉不合症更求其所以然 then 立方无出入
- id: guji-毛对山-endeavor-2
  title_zh: 述作医话惠寄医报垂教后学
  summary: 或究症治或道经验，论虚损阴阳胎产异症单方意治，搜罗丰富谈理玄妙，托卢育和手录载于周雪樵医报以益后学
