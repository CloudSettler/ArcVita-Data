    title_zh: 老人幼稚以清通为主不用纯温补
    rationale: 脾衰输化不清蒸变为痰气有余即是火，当以通为用疏血气致和平
  - date: '1885-01-01'
    title_zh: 系统追述医案以笔记益人神明
    rationale: 医话如儒家笔记最能益人，或究症治或道经验，足与冷庐存存斋相匹敌故惠寄医报
