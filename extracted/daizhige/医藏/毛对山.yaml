  archetype: 穷经研脉济世的名医
  dilemmas:
  - 脉理渊微难凭与临证必按脉决疑之间如何权衡取舍
  - 和平因循误人与偏执孟浪害人之间如何用药神速不迟疑
  lesson: 辨症明则用药定，脉症合参疏其血气令调达和平，不可因循守和平而贻误生死关头
  summary_first_person: 余初读灵素觉经义渊深脉理错杂望洋意沮，后并心壹志遍览前贤注释有所疑则镇日默坐苦思，乃渐通五运六气阴阳应象之理，每调气度脉浪决人生死亦时有验，遂笔为医话或究症治或道经验，愿与冷庐医话相匹敌，俾后学知脉居四诊之末不可离病就脉，用药如用兵贵乎神速戒因循和平之误
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E6%AF%9B%E5%AF%B9%E5%B1%B1%E5%8C%BB%E8%AF%9D.html
