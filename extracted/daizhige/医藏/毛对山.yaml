  title_zh: 研脉辨证临证济世
  summary: 遍览灵素贯通运气临证先询证察色后按脉决疑以速治实证
  phases:
  - key: brewing
    name: 遍览灵素苦参运气
    labels:
      zh: 读灵素明运气
    start_date: 1770
    highlight_event_id: guji-毛对山-event-birth
  - key: breakthrough
    name: 按脉决生死渐验
    labels:
      zh: 切脉决证初验
    start_date: 1795
    highlight_event_id: guji-毛对山-event-wu
  - key: climax
    name: 预断痈毒湿痰阻气
    labels:
      zh: 望脉参合断痈
    start_date: 1800
    highlight_event_id: guji-毛对山-event-zhou
  - key: closure
    name: 悟脉居四诊之末
    labels:
      zh: 舍脉就病合参
    start_date: 1810
    highlight_event_id: guji-毛对山-event-qi
  decisions:
  - date: 1795
    title_zh: 不专恃三部九候先问证察色后按脉
    rationale: 脉理微茫呼吸难明必胸有成见后按脉决疑方无出入
  - date: 1805
    title_zh: 老人幼稚以清通为主不用纯温补
    rationale: 老人脾衰化痰气郁成火当以六腑传化不藏以通为用
- id: guji-毛对山-endeavor-2
  title_zh: 著对山医话传道戒俗
  summary: 笔录怪证单方时病以正庸医三恶习传清通速治之法
  phases:
  - key: brewing
    name: 避兵乡里搜集杂说
    labels:
      zh: 搜集杂说验方
    start_date: 1815
    highlight_event_id: guji-毛对山-event-zhou
  - key: breakthrough
    name: 考辨胎产单方奇验
    labels:
      zh: 辨胎产录单方
    start_date: 1820
    highlight_event_id: guji-毛对山-event-sun
  - key: climax
    name: 笔成卷一论脉论补
    labels:
      zh: 成卷一批温补
    start_date: 1825
    highlight_event_id: guji-毛对山-event-book1
  - key: closure
    name: 笔成卷二养生服食
    labels:
      zh: 成卷二述养生
    start_date: 1828
    highlight_event_id: guji-毛对山-event-book2
  decisions:
  - date: 1825
    title_zh: 直斥写方狂草用药好奇不问病情之弊
    rationale: 医称司命当郑重常用数十味已足不可伪托脉理误人
  - date: 1828
    title_zh: 录野菊枕固齿方荷露佩兰除湿法
    rationale: 取其力专效速以意运药济寻常百姓淹缠之疾
events:
- id: guji-毛对山-event-birth
  date: 1750
  title_zh: 生于江南
  description: 清乾隆间生于江南乡里长而好读灵素究心运气脉理
  year_of: 1750
- id: guji-毛对山-event-wu
  date: 1795
  title_zh: 诊巷邻吴某仆地断不越宿
  description: 吴某晨起洒扫忽仆不语按脉急锐如夺索断肾气败危在旦夕日未昃而绝以此悟凭脉决证之验
  year_of: 1795
- id: guji-毛对山-event-zhou
  date: 1800
  title_zh: 诊布商周某心脉坚预发脑疽
  description: 周某微疾就诊按心脉独坚湿痰阻气脑后贯珠小疮劝慎明春果脑毒发而死
  year_of: 1800
- id: guji-毛对山-event-qi
  date: 1810
  title_zh: 诊戚某咳喘脉乱悟气塞脉变
  description: 戚某患咳月余脉至不定如火薪疑心精已夺赠金令安养霜后病痊悟行急气塞可乱脉不可臆断
  year_of: 1810
- id: guji-毛对山-event-sun
  date: 1820
  title_zh: 以菜油探吐治孙某误吞发瘕
  description: 剃工孙某误吞短发胸痛肢厥两手脉平令连饮菜油大吐出短黑虫无数病愈取法徐文伯油吐发瘕
  year_of: 1820
- id: guji-毛对山-event-book1
  date: 1825
  title_zh: 笔成对山医话卷一
  description: 论五气五色五声望诊切脉辨证立方戒温补因循述金坛王肯堂脾泄李士材下痰涎而愈
  year_of: 1825
- id: guji-毛对山-event-book2
  date: 1828
  title_zh: 笔成对山医话卷二
  description: 论服玉服气养生眼科单方湿热述宋老人节饮食全残年及荷露佩兰薏苡除暑湿之法
  year_of: 1828
- id: guji-毛对山-event-death
  date: 1830
  title_zh: 卒于乡里
  description: 晚年以医话传世后卒于乡里享年约八十
  year_of: 1830
