  era: 清
  reign_ref: 清乾隆至道光
  archetype: 济世良医
  dilemmas:
  - 脉理渊微难凭而世人独尊脉当舍脉言病还是合证按脉决疑
  - 和平因循耽误生机与偏执孟浪招险当守中还是速攻其实
  lesson: 审虚实察色声合脉证以通为用贵在神速而不因循
  summary_first_person: 我是毛对山清代医者早年遍览灵素遍参五运六气每按脉决生死而悟脉居四诊之末必先询证察色后按脉决疑晚年笔录临证得失为对山医话以戒因循温补之弊
  source_urls:
