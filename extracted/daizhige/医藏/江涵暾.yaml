    highlight_event_id: guji-江涵暾-event-publish
  decisions:
  - date: '1824-05-01'
    title_zh: 不轻用大补大攻猛药
    rationale: 量材力知一利即一弊，斟酌分量以免误杀，宁受众怨不轻情
  - date: '1824-05-01'
    title_zh: 述而不作参诸大家
    rationale: 大半采仲景东垣景岳钟龄之说，避繁赜言现病象系何脏腑作何治法
