  - title_zh: 官箴与救人之衡
    description: 服官东粤碍于官箴，欲引救庸医误人而不得直施
  - title_zh: 繁赜与简要之衡
    description: 卷帙浩繁人畏学医，欲以简驭繁立镜而不失脏腑阴阳之真
  lesson: 以形求理以简驭繁，明辨表里虚实寒热与脏腑阴阳，立品慎药以济众
  summary_first_person: 我是江涵暾，浙江归安人，中岁究心医学，往来江浙，后服官东粤，见医理不清病家误信，引退还山，撮要为笔花医镜，愿人人知医不为庸医所误
