    title_zh: 引退还山撮要镌编
    rationale: 欲使人人得简要之方，按对病情审脏腑阴阳，不授命于瞽
  - date: '1834-11-01'
    title_zh: 托友序引共诸同好
    rationale: 恐抄本久而遗忘，愿布告同人助医家一助
- id: guji-江涵暾-endeavor-2
  title_zh: 服官东粤见病思救
  summary: 服官东粤见医士理法未清病家信神鬼误治，久思引救而碍官箴乃决意引退
