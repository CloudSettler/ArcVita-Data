endeavors:
- id: guji-江考卿-endeavor-1
  title_zh: 构建伤科辨证体系
  description: 立断死证秘诀秘受不治法与受伤治法，详头顶华盖肺底等三十六大穴受伤治法，统跌打金疮之纲
  phases:
  - key: brewing
    name: 汇集跌打金疮经验
    labels:
      zh: 酝酿汇集
    start_date: 1765
    highlight_event_id: guji-江考卿-event-compile
  - key: breakthrough
    name: 立三十六穴加减通法
    labels:
      zh: 突破成法
    start_date: 1780
    highlight_event_id: guji-江考卿-event-compile
  - key: climax
    name: 著成伤科治法上卷
    labels:
      zh: 著述高峰
    start_date: 1790
    highlight_event_id: guji-江考卿-event-compile
  decisions:
  - date: 1780
    title_zh: 以加减汤七厘散夺命紫金为通法
    rationale: 三十六穴病异药同，立加减通法再随穴加味二味，简而能全，切戒错误
  - date: 1790
    title_zh: 明示不治以存真
    rationale: 天柱骨折脊断目损喉断心口青等必死之证直书不治，不欺人以邀功
- id: guji-江考卿-endeavor-2
  title_zh: 传授通用秘传方药
  description: 录解肌汤小柴胡汤十三味加减汤等通用方及君臣散至姜黄汤三十余秘传方，兼麻药膏酒洗熨接骨之法
  phases:
  - key: brewing
    name: 搜集通用接骨止血方
    labels:
      zh: 搜集通用
    start_date: 1770
    highlight_event_id: guji-江考卿-event-teach
  - key: climax
    name: 公开秘传三十余方
    labels:
      zh: 公开秘传
    start_date: 1795
    highlight_event_id: guji-江考卿-event-teach
  - key: closure
    name: 附验方以惠乡里
    labels:
      zh: 收束惠民
    start_date: 1800
    highlight_event_id: guji-江考卿-event-teach
  decisions:
  - date: 1795
    title_zh: 分上中下三部用药
    rationale: 头目臂为上，腰腹为中，二便足膝为下，皮未破多用串皮破血，皮破多用通利兼补
  - date: 1800
    title_zh: 麻药开割与贮药服忌并传
    rationale: 骨出碎骨需宝麻药后割治取骨填接，跌打药宜热服忌冷水冷物，瓷瓶收贮不使出气
events:
- id: guji-江考卿-event-birth
  type: birth
  title_zh: 出生于清中期
  date: 1750
  year_of: 1750
  description: 生于清中期，习医专攻跌打金疮，接骨止血，久历伤科实践
- id: guji-江考卿-event-compile
  type: career
  title_zh: 编成伤科治法与穴法治则
  date: 1790
  year_of: 1790
  description: 立断死证秘诀秘受不治法受伤治法，详定三十六大穴打中死期与加减汤七厘散夺命丹紫金丹治法
- id: guji-江考卿-event-teach
  type: career
  title_zh: 录通用方秘传方以传后学
  date: 1795
  year_of: 1795
  description: 录解肌小柴胡金疮吊药七厘夺命紫金回生膏等通用方，传君臣散桃花散宝麻药麝香象皮膏等三十余秘方，体仁子论血以明大要
- id: guji-江考卿-event-death
  type: death
  title_zh: 逝世
  date: 1820
  year_of: 1820
  description: 殁于清中期以后，遗江氏伤科学通行于世，惠及跌打损伤接骨续筋之治
