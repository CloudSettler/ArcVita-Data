  archetype: 伤科医家
  dilemmas:
  - 生死难辨而强治恐害命，舍治又恐弃可生之人，如何立断死证以决去留
  - 秘方多私藏而乡野缺药，尽泄恐误用，不传又无以救急，如何权衡保守与普济
  lesson: 跌打皆从血论，辨重轻浅深，皮未破多用串皮破血，皮已破多用通利兼补，不可一概而治
  summary_first_person: 我是江考卿，目见跌打金伤生死系于毫厘，遂立断死秘诀与不治之法，又集正骨接骨与三十六大穴治法及通用秘传诸方，编成伤科方书，愿后学详审血脉轻重，不妄治不误治，以全民命
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E7%A7%91%E6%96%B9%E4%B9%A6.html
