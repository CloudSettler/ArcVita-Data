  lesson: 跌打皆从血论，审重轻浅深，按部用药，不泥一方以活人
  summary_first_person: 吾为江考卿，集断死证秘受不治法与受伤治法，详三十六大穴治法，录通用秘传三十余方，著伤科学以救跌打金疮，愿后学详审血脉骨穴，热服忌冷，活用加减
