endeavors:
- id: guji-江考卿-endeavor-1
  title_zh: 立断死证与不治法以明去留
  summary: 采金伤验案作断死歌诀，列矢柱骨折两目损等十八不治危证，使医先辨生死
  phases:
  - key: brewing
    name: 搜集金伤危证验案
    labels:
      zh:
      - 搜集验案
    start_date: 1760-01-01
    highlight_event_id: guji-江考卿-event-1
  - key: breakthrough
    name: 归纳断死秘诀歌诀
    labels:
      zh:
      - 断死秘诀
    start_date: 1765-01-01
    highlight_event_id: guji-江考卿-event-1
  - key: climax
    name: 厘定十八种秘受不治法
    labels:
      zh:
      - 不治之法
    start_date: 1768-01-01
    highlight_event_id: guji-江考卿-event-1
  - key: closure
    name: 示人不可强治以全民生
    labels:
      zh:
      - 明示去留
    start_date: 1770-01-01
    highlight_event_id: guji-江考卿-event-1
  decisions:
  - date: 1765-01-01
    title_zh: 先辨生死再施治
    rationale: 金伤眼青气喘咆噎及人中满唇青者旦夕亡，不可妄用药以误人误己
  - date: 1768-01-01
    title_zh: 列不治以存医道
    rationale: 矢柱骨折脊断心胞紧痛孕妇犯胎等皆难救，明示不治则不害命亦不败名
- id: guji-江考卿-endeavor-2
  title_zh: 编伤科方书传正骨接骨与通用秘方
  summary: 分脑顶喉肩胁腹膝诸伤治法，详三十六大穴加减救治，录七厘夺命紫金诸方及君臣散等秘传十六方
  phases:
  - key: brewing
    name: 汇集跌打正骨验方
    labels:
      zh:
      - 汇集验方
    start_date: 1770-01-01
    highlight_event_id: guji-江考卿-event-2
  - key: breakthrough
    name: 分部定上中下三部用药
    labels:
      zh:
      - 分部用药
    start_date: 1773-01-01
    highlight_event_id: guji-江考卿-event-2
  - key: climax
    name: 详定三十六大穴治法
    labels:
      zh:
      - 大穴治法
    start_date: 1776-01-01
    highlight_event_id: guji-江考卿-event-2
  - key: closure
    name: 成书传世普济乡野
    labels:
      zh:
      - 成书普济
    start_date: 1780-01-01
    highlight_event_id: guji-江考卿-event-2
  decisions:
  - date: 1773-01-01
    title_zh: 分上中下部施方
    rationale: 头臂用川芎桂枝，腰腹用杜仲杏仁，二便闭用桔梗车前，随部施治方有准
  - date: 1780-01-01
    title_zh: 公开秘传以救急
    rationale: 山村无药铺则糯米酒姜葱熨之，秘方不藏私则远近跌打皆可得救，体仁子所谓皆从血论是也
