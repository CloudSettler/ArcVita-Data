  archetype: 折衷医家
  dilemmas:
  - 长女疫痢殇后恨西医无术而精神溃乱当何以自立
  - 举世竞矜欧美新医而中医不绝如缕当独扬汉方还是坐视其灭
  - 中西交讥各封故步当偏执一端还是融会舍短取长
  lesson: 以人体经验事实为先理论为后，以简御繁，专精仲景古方而活用之，方能振绝学而济民生
  summary_first_person: 我少奉亲命学西医于金泽医学专门学校，明治三十四年卒业而供职医院继而自设诊所，明治四十三年长女以疫痢殇，恨医无术而沮丧溃乱，偶读先师和田启十郎医界铁椎始发愤学中医，十八年流转四方穷困备至而不易其志，渐有悟入而知古方活用胜于新法，悯中医将绝而不忍终默，故以仲景伤寒金匮为基础网罗诸家论说治验撰为是书，以俟天下具眼之士
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%9A%87%E6%B1%89%E5%8C%BB%E5%AD%A6.html
