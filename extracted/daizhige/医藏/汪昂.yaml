endeavors:
- id: guji-汪昂-endeavor-1
  title_zh: 比类分次类纂两经
  description: 以素问为主灵枢为副除针灸不录分为九类存旧段落注出处
  phases:
  - key: brewing
    name: 衡泌养志见钞启思
