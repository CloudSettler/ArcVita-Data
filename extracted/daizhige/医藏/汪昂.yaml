  lesson: 近取譬以明方义，守中正和平以全司命之责
  summary_first_person: 吾乃休宁汪昂，字讱庵，晚号庵叟，目击方书繁而无解，遂取仲景为祖，集常用之方而训释之，愿后学按证寻方，不致尝试误人，守先圣慎疾之心以尽人事而已
