  dilemmas:
  - 古方浩繁而时医不辨证候不用汤头当何以立纲纪垂楷则
  - 汤名药味拘于平仄难叶而义须赅明当何以兼易知简从与理法兼备
  lesson: 以简驭繁提纲挈领门分义悉使初学易诵而临证触类旁通不失规矩
  summary_first_person: 吾休宁汪昂晚号庵老人少罹丧乱留意医籍见旧本汤头歌诀辞鄙义晦时医率意无法乃网罗前贤方论先成医方集解复束为歌诀二百首分二十门括病证治法于歌中以便行旅缓急之用愿后学神而明之变而通之以应无穷之变
