    start_date: 1655
    highlight_event_id: guji-汪昂-event-compiling
  - key: breakthrough
    name: 定九类纲目统摄病证脉候
    labels:
      zh: 定纲
    start_date: 1665
    highlight_event_id: guji-汪昂-event-compiling
  - key: climax
    name: 分缀编次素问灵枢相从
    labels:
      zh: 编缀
    start_date: 1675
    highlight_event_id: guji-汪昂-event-compiling
  - key: closure
    name: 康熙己巳夏定稿作序
    labels:
      zh: 定稿
    start_date: 1689
    highlight_event_id: guji-汪昂-event-preface
  decisions:
  - date: 1655
    title_zh: 以九类统两经而存旧段
    rationale: 随问条答茫无津涯故以类相从用便观览而不失原书面目
  - date: 1680
    title_zh: 素问为主灵枢为副删针灸
    rationale: 素问兼诸法说理详灵枢重针灸与医药不同故主素问而副灵枢
- id: guji-汪昂-endeavor-2
  title_zh: 参酌众注约注阐微
  description: 遵王马吴诸注十之七增鄙见十之三务令语简义明以启后学
  phases:
  - key: brewing
    name: 博览王马吴注辨得失
    labels:
      zh: 博览
    start_date: 1658
    highlight_event_id: guji-汪昂-event-compiling
  - key: breakthrough
    name: 参酌取舍节繁辨谬
    labels:
      zh: 参酌
    start_date: 1670
    highlight_event_id: guji-汪昂-event-compiling
  - key: climax
    name: 增注畅义详所未悉
    labels:
      zh: 阐义
    start_date: 1680
    highlight_event_id: guji-汪昂-event-compiling
  - key: closure
    name: 阅三十余年约注始就
    labels:
