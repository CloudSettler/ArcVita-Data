  decisions:
  - date: 1670
    title_zh: 遵七增三务令简明
    rationale: 旧注各有得失舛谬敷衍改经臆解皆不可从故节繁辨谬以明经旨
  - date: 1685
    title_zh: 存段落旧文注出处不敢参错
    rationale: 恐割裂穿贯疑误后学获罪先圣故虽删节而段落仍旧以取反约之意
