endeavors:
- id: guji-汪昂-endeavor-1
  title_zh: 编纂医方集解以明方义
  summary: 以仲景为祖，分门聚方，发明受病之因与经络脉证，使常用之方皆有解可寻
  phases:
  - key: brewing
    name: 览方书繁而慨无解
    labels:
      zh: 醖酿立志
    start_date: 1675
    highlight_event_id: guji-汪昂-event-study
  - key: breakthrough
    name: 定体例分门聚方
    labels:
      zh: 体例初定
    start_date: 1680
    highlight_event_id: guji-汪昂-event-compile
  - key: climax
    name: 康熙壬戌题序成书
    labels:
      zh: 集解告成
    start_date: 1682-10
    highlight_event_id: guji-汪昂-event-preface
  - key: closure
    name: 附救急勿药以全书
    labels:
      zh: 惠后收功
    start_date: 1683
    highlight_event_id: guji-汪昂-event-preface
  decisions:
  - date: 1680
    title_zh: 以补养为首分门定序
    rationale: 治病当治于未病故先补养，次及汗吐下表里诸法，条理井然便初学披寻
  - date: 1682
    title_zh: 正方系附方并加昂按
    rationale: 既省篇章又示加减之法，窃附鄙见则明加昂按二字，不敢师心自用
- id: guji-汪昂-endeavor-2
  title_zh: 述本草备要普及药性
  summary: 删繁就简明药性治法，使文墨之士亦可旁通，岐黄之家不致泛览为难
  phases:
  - key: brewing
    name: 悯村市误药而害人
    labels:
      zh: 悯俗醖酿
    start_date: 1685
    highlight_event_id: guji-汪昂-event-study
  - key: breakthrough
    name: 取诸家精要删润成编
    labels:
      zh: 删繁成要
    start_date: 1690
    highlight_event_id: guji-汪昂-event-materia
  - key: climax
    name: 本草备要刊行于世
    labels:
      zh: 备要刊行
    start_date: 1694
    highlight_event_id: guji-汪昂-event-materia
  - key: closure
    name: 医方本草互参寿世
    labels:
      zh: 寿世收功
    start_date: 1694
    highlight_event_id: guji-汪昂-event-death
  decisions:
  - date: 1690
    title_zh: 只载中正和平常用之品
    rationale: 厉剂虽存而必慎用，采古今相沿不可废者，去漫衍以限尺幅
  - date: 1694
    title_zh: 方解药解互见不相犯
    rationale: 方中已明药义则本草不复繁引，使篇章简要词理显明
