    rationale: 旧歌不分门类搜索殆遍且辞鄙义晦故分补益发表攻里等二十门使某病某汤举目易了
  - date: '1694-07-01'
    title_zh: 歌中兼括病证歌后详注制方本义
    rationale: 不以病名病而以药合证明乎因病施药故方后训释推明古人配合恰当之义使服习者有所根据
