events:
- id: guji-汪机-event-birth
  title_zh: 出生于祁门
  date: 1463
  year_of: 1463
  description_zh: 明天顺七年生于徽州祁门朴墅汪氏夙业儒后兼通医
- id: guji-汪机-event-ask
  title_zh: 客论凌李针法而有感
  date: 1520
  year_of: 1520
  description_zh: 客盛称姑苏凌汉章六合李千户之针一尚简略一尚谨密余论其须本素难察脉候气客莫能对因发搜罗之志
- id: guji-汪机-event-compile
  title_zh: 穷搜灵枢素难而笔录盈箧
  date: 1528
  year_of: 1528
  description_zh: 取灵枢素问难经及诸家针灸之书穷搜博览遇论针灸者日逐笔录积之盈箧
- id: guji-汪机-event-preface
  title_zh: 嘉靖庚寅冬自序针灸问对于朴墅
  date: 1530-12-22
  year_of: 1530
  description_zh: 序次所录之说设为问难以著明之装潢成帖名曰针灸问对以便老景检阅并请后之精者改而正之
- id: guji-汪机-event-publish
  title_zh: 嘉靖壬辰南涧程镔叙而劝刻
  date: 1532-09-15
  year_of: 1532
  description_zh: 南涧子程镔受读问对一册叹其粹赜则微旨邃而玄可使完天和溥仁术进技几道遂书刻针灸问对叙于菊月
- id: guji-汪机-event-death
  title_zh: 卒于祁门朴墅
  date: 1539
  year_of: 1539
  description_zh: 明嘉靖十八年卒于家平生所校集诸方书悉已有刻针灸问对并传于世
