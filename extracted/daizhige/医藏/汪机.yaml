endeavors:
- id: guji-汪机-endeavor-1
  title_zh: 穷搜博览编撰针灸问对
  summary: 积箧笔录序次问难以明针法灸法经络穴道
  phases:
  - key: brewing
    name: 客谈凌李有感
    labels:
      zh: 问凌汉章简略李千户谨密之得失
    start_date: '1525'
    highlight_event_id: guji-汪机-event-practice
  - key: breakthrough
    name: 搜览灵素笔录盈箧
    labels:
      zh: 取灵枢素难诸家针灸之书日逐笔录
    start_date: '1528'
    highlight_event_id: guji-汪机-event-practice
  - key: climax
    name: 嘉靖庚寅序次成帙
    labels:
      zh: 设为问难装潢成帙名曰针灸问对
    start_date: '1530'
    highlight_event_id: guji-汪机-event-compilation
  - key: closure
    name: 上中论针下论灸垂训
    labels:
      zh: 上中二卷论针下卷论灸及经络穴道
    start_date: '1530'
    highlight_event_id: guji-汪机-event-compilation
  decisions:
  - date: '1528'
    title_zh: 不废笔录序次问答
    rationale: 遇论针灸即录不忍废弃以便老景检阅兼补针灸万一
  - date: '1530'
    title_zh: 以问对体明简奥
    rationale: 语简而明设问难以著明灵素经义使学者易晓
- id: guji-汪机-endeavor-2
  title_zh: 辨虚实正针灸汤液之用
  summary: 明针治有余不能治不足辨虚邪实邪斥误针巧立名目
  phases:
  - key: brewing
    name: 察世变病殊
    labels:
      zh: 上古外凑经滞今世内虚耗汤液胜针灸
    start_date: '1520'
    highlight_event_id: guji-汪机-event-practice
  - key: breakthrough
    name: 立虚补实泻正解
    labels:
      zh: 指虚邪实邪辨内经虚补实泻
    start_date: '1529'
    highlight_event_id: guji-汪机-event-doctrine
  - key: climax
    name: 论误针误灸之害
    labels:
      zh: 斥不识脉不察形便针及巧立名目之诬
    start_date: '1530'
    highlight_event_id: guji-汪机-event-doctrine
  - key: closure
    name: 垂笃实之训
    labels:
      zh: 四库称其说笃实术家所讳而不肯言者皆言之
    start_date: '1530'
    highlight_event_id: guji-汪机-event-compilation
  decisions:
  - date: '1529'
    title_zh: 主针泻有余汤液补不足
    rationale: 劳瘵阴虚痿证肺热非针所能滋阴补水当以甘药调内
  - date: '1530'
    title_zh: 直陈误针成痼疾
    rationale: 专针者偶中便夸神妙故详辨逆顺五夺九不可刺以全真气
