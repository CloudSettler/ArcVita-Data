  decisions:
  - date: 1506
    title_zh: 主丹溪补阴而参以补气
    rationale: 营兼血气，参芪甘温亦能生血，不可专执苦寒以伤胃
  - date: 1520
    title_zh: 作论辨王氏明医杂著之失
    rationale: 株守丹溪过用苦寒则害胃，须因证处方方为得师之意
- id: guji-汪机-endeavor-2
  title_zh: 临证验案活人无数
  description: 治疟疫虚劳等证以补元气为主，弟子陈桷裒集验案成书传世
  phases:
  - key: brewing
    name: 乡里行医随试辄效
    labels:
