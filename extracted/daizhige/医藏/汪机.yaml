  dilemmas:
  - 局方温燥与河间寒凉各执一偏如何折中以安病人
  - 守丹溪补阴之说与滥用苦寒之弊如何辨明以因证处方
  lesson: 守正而不泥古，因证处方，补阴补气皆为补营，贵在识病之真
  summary_first_person: 我是祁门汪机，号石山，学医于丹溪戴元履一脉，著推求师意以明师意，临证不拘一格，弟子录我验案成石山医案三卷，愿后人识病之真而善用温凉
