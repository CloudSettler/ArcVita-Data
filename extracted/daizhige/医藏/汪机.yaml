    start_date: 1530
    highlight_event_id: guji-汪机-event-epidemic-1530
  - key: closure
    name: 门人集验成石山医案
    labels:
      zh: 集案传世
    start_date: 1538
    highlight_event_id: guji-汪机-event-collection
  decisions:
  - date: 1515
    title_zh: 久疟伤脾以参术升阳益胃
    rationale: 虚者补之，下陷者举之，不用攻下消克以重虚其虚
  - date: 1530
    title_zh: 疫兼内伤重者合补降二法
    rationale: 肾水亏而脐下痛不可利下，宜清暑益气加减以扶正达邪
events:
- id: guji-汪机-event-birth
  title_zh: 生于徽州祁门
  date: 1463
  year_of: 1463
  description: 明天顺七年生于祁门汪氏，字省之，号石山
- id: guji-汪机-event-study
  title_zh: 学医于同邑师承丹溪一脉
  date: 1478
  year_of: 1478
  description: 少习举业转而习医，由戴元履上溯朱震亨，专研内经丹溪之学
- id: guji-汪机-event-malaria-1515
  title_zh: 正德十年治久疟腹痛奇验
  date: 1515-04-01
  year_of: 1515
  description: 治形瘦色脆者四月八月疟作腹痛，以参苓白术散煎升麻汤调服月余而愈，不用承气消克
- id: guji-汪机-event-epidemic-1530
  title_zh: 嘉靖九年治冒风虚疟与疫证
  date: 1530-09-01
  year_of: 1530
  description: 嘉靖九年治冒风虚疟以参芪归术为主少加发散，又治疫兼两感以内伤重而用补降合治十余贴即安
- id: guji-汪机-event-tuishi
  title_zh: 著推求师意发明丹溪之旨
  date: 1531-01-01
  year_of: 1531
  description: 著推求师意及荣卫论，论文武相济补阴补营之义，并辨明医杂著过用苦寒之偏
- id: guji-汪机-event-collection
  title_zh: 门人裒集验案行世
  date: 1538-01-01
  year_of: 1538
  description: 门人陈桷取诸弟子所记治疗效验分门裒为三卷，附荣卫论答问及行状小传，是为石山医案
- id: guji-汪机-event-death
  title_zh: 卒于祁门
  date: 1539
  year_of: 1539
  description: 明嘉靖十八年卒，门人程鐈等录其参耆之论并行状传世，四库馆臣称其随试辄效
