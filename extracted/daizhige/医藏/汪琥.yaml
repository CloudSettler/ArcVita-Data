    start_date: '1665'
    highlight_event_id: guji-汪琥-event-birth
  - key: breakthrough
    name: 归正六经
    labels:
      zh: 辨叔和仲景之旧
    start_date: '1675'
    highlight_event_id: guji-汪琥-event-preface
  - key: climax
    name: 草成广注
    labels:
      zh: 自序广注立义
    start_date: '1680-10-02'
    highlight_event_id: guji-汪琥-event-preface
  - key: closure
    name: 刊行成书
    labels:
      zh: 付梓流传救误
    start_date: '1684'
    highlight_event_id: guji-汪琥-event-publish
  decisions:
  - date: '1675'
    title_zh: 不倒乱六经旧次
    rationale: 存羊爱礼恐新编尽失仲景妙义，只以附例重出例附后例疏通前后，不效方喻程倒乱原文
  - date: '1680'
    title_zh: 以愚按或问补成注
    rationale: 成注创始功大而时有自相矛盾，采方喻程及诸家必标姓氏，大半以鄙意补桂枝麻黄青龙等未发明者
- id: guji-汪琥-endeavor-2
  person_qid: guji-汪琥
  title_zh: 立伤寒非寒别中寒真寒论
  summary_zh: 主伤寒名寒实热皆传经，标出混入三阴之真寒另作中寒三卷，详四时气节针刺
  phases:
  - key: brewing
    name: 疑寒热错乱
    labels:
      zh: 考热病传经之状
    start_date: '1670'
    highlight_event_id: guji-汪琥-event-preface
  - key: breakthrough
    name: 提出非寒说
    labels:
      zh: 伤寒非寒病论
    start_date: '1680-10-02'
    highlight_event_id: guji-汪琥-event-preface
  - key: climax
    name: 别编中寒
    labels:
      zh: 真寒另立专卷
    start_date: '1682'
    highlight_event_id: guji-汪琥-event-publish
  - key: closure
    name: 备录时令针法
    labels:
      zh: 四时针穴并重
    start_date: '1684'
    highlight_event_id: guji-汪琥-event-publish
  decisions:
  - date: '1680-10-02'
    title_zh: 标出真寒不入热例
    rationale: 感真寒深入三阴特十之一二，证皆寒与热迥异，以重圈别记另作上中下三卷，使寒热阴阳判然
  - date: '1682'
    title_zh: 首卷列四时经脉五十九穴
    rationale: 病多由时气必传经络，详释八节二十四气七十二候兼图手足十二经，备录热病针穴以全汗下之外法
