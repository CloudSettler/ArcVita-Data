  reign_ref: 康熙
  archetype: 医家
  dilemmas:
  - title_zh: 从简还是从繁
    description_zh: 世医徒取节庵一编乐其简，我宁惮烦而补阙略订讹谬，务使每条解明不致医药有误
  - title_zh: 尊旧还是乱旧
    description_zh: 既尊仲景本于内经热论经脉，又不敢倒乱叔和六经旧次，存羊爱礼而以附例重出例疏通
  lesson: 伤寒名寒实热皆传经之热病，惟真寒入三阴者十仅一二当别论，须审脉证随时气汗下泄热，不可执名投热剂而毫芒误命
  summary_first_person: 我是长洲汪琥，字苓友，康熙间业医，痛世医乐简轻命，遂溯内经热论灵枢经脉为本，归正叔和错简，补成无己未发，草伤寒论辨证广注十四卷，立伤寒非寒之论，别真寒为中寒另编，愿后人读是书而疗变证有法
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E5%AF%92%E8%AE%BA%E8%BE%A9%E8%AF%81%E5%B9%BF%E6%B3%A8.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E5%AF%92%E8%AE%BA%E8%BE%A9%E8%AF%81%E5%B9%BF%E6%B3%A8.md
