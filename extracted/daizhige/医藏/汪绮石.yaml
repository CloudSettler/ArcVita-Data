  date: '1644'
  year_of: 1644
  title_zh: 集成理虚元鉴
  description_zh: 辨心肾不交五交劳嗽吐血骨蒸之候详脉法施治正药讹分卷上下以清金培土滋水为纲集成一书
- id: guji-汪绮石-event-death
  date: '1645'
  year_of: 1645
  title_zh: 书成身殁托付门人
  description_zh: 书成而殁易箦时谆谆以斯世之责属两世兄及赵何宗田武林君宾诸门下兼及伯儒东庵济明身丁丧乱受梓无人
