    title_zh: 弃棘闱潜心箕裘付仲君发明
    rationale: 会世变丧乱刊刻无人恐淹没先德故专付发明居多者以存医脉
  - date: '1645'
    title_zh: 嘱后之仁人登梨枣广传
    rationale: 不忍后世病虚者夭折莫救故托门下转求刊布以饮泽天下后世
