    rationale: 肺为五脏之天脾为百骸之母补肺滋源补脾建中胜于知柏熄火桂附助火
  - date: '1640'
    title_zh: 阴虚统于肺急清金保肺
    rationale: 劳嗽吐血骨蒸皆以肺为极则预护急清愈后终身护肺以杜传尸之渐
