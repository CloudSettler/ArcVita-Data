  - 寒热虚实真假错杂，误补犹可救，误攻则气散难挽
  lesson: 医者意也，会其神而不袭其迹，得鱼忘筌方能活人
  summary_first_person: 我家世业岐黄，留心活人术，博览灵素张朱刘李，审脉论证，酌古准今，不泥其词，会其神，著杂症会心录以贻后学
