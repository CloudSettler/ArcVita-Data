events:
- id: guji-汪蕴谷-event-birth
  title_zh: 生于休宁汪氏医家
  date: 1690
  year_of: 1690
  description: 生于徽州休宁，父十洲约齐翁，伯兄广期，世以名医鸣
- id: guji-汪蕴谷-event-1
  title_zh: 精岐黄名动远近贫者赠药
  date: 1745
  year_of: 1745
  description: 上溯灵素下窥景岳，每治必凭脉辨症，求者填门，贫乏则解囊赠参
- id: guji-汪蕴谷-event-2
  title_zh: 自叙杂症会心录成
  date: 1754-02-15
  year_of: 1754
  description: 乾隆十九年甲戌春王月上元，休宁自叙成杂症会心录，分上下卷辨中风虚实生死诸症
- id: guji-汪蕴谷-event-3
  title_zh: 程世法吴以镇侄存宽作序刊行
  date: 1755-11-01
  year_of: 1755
  description: 乾隆十九年小春程世法序，二十年孟冬吴以镇序，秋七月侄存宽序，付梓广传
- id: guji-汪蕴谷-event-death
  title_zh: 卒于休宁
  date: 1770
  year_of: 1770
  description: 乾隆中晚期卒于休宁，医道诗名并传，业由后学授受不绝
