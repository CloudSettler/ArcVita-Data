  date: 1615
  year_of: 1615
  place_zh: 安徽休宁
  summary_zh: 明万历四十三年生，字讱庵，号鹿亭，少逢明末乱离，留心医药
- id: guji-汪讱庵-event-bencao
  type: achievement
  title_zh: 先成医方集解本草备要
  date: 1682
  year_of: 1682
  place_zh: 徽州
  summary_zh: 祖洁古东垣之学，成汤头医方之书，为本草易读奠定折衷体例
- id: guji-汪讱庵-event-yidu
  type: achievement
  title_zh: 诠次本草易读附方于药
  date: 1688
  year_of: 1688
  place_zh: 徽州
  summary_zh: 即素日所珍诠次成编，折衷纲目，敛句便诵，精选轻淡切病之方附于各药之下，备亿兆疾痛之需
- id: guji-汪讱庵-event-death
  type: death
  title_zh: 卒于康熙年间秘本后传
  date: 1694
  year_of: 1694
  place_zh: 安徽休宁
  summary_zh: 清康熙三十三年卒，所著易读以秘本流传，后经清御医吴谦审定刊行
