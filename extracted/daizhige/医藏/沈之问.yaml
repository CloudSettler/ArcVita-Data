  dilemmas:
  - 风疠秽恶世医避忌而生民待救当立专书与否
  - 风水鬼神惑人当破迷妄而归气血正理与否
  lesson: 避贼风节嗜欲和气血，慎传染早驱虫，调荣卫于微时可免残形大害
  summary_first_person: 吾沈之问，悯风癞残害形质，采内经灵枢巢氏病源诸说，撰解围元薮，定风疠同源之论，列五因六部三十六症，欲使后人知避知防知治
