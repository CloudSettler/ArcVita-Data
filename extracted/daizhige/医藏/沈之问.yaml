    highlight_event_id: guji-沈之问-event-fenglai
  - key: climax
    name: 成卷一风癞论受病经络
    labels:
      zh: 高潮成书
    start_date: 1620-01-01
    highlight_event_id: guji-沈之问-event-complete
  decisions:
  - date: 1615-01-01
    title_zh: 断风疠本源同一
    rationale: 内驻曰风外著曰疠，风甚疠轻，久注脉络由风变疠，故合论以正名
  - date: 1620-01-01
    title_zh: 系病于手太阳足阳明先中
    rationale: 口鼻为气之门户，肺主皮毛脾主肌肉，故先明经络流注以导治
- id: guji-沈之问-endeavor-2
  title_zh: 列五因九虫九疰以防传染救治
  summary_zh: 列风水阴阳源流传染气秽蛊疰保养失度感冒积郁五条，参九虫九疰，示预防调摄之法
  phases:
  - key: brewing
    name: 搜集传染蛊疰医案
    labels:
