      zh: 高潮示法
    start_date: 1618-01-01
    highlight_event_id: guji-沈之问-event-five-causes
  - key: closure
    name: 垂训保养调摄
    labels:
      zh: 收束垂训
    start_date: 1620-01-01
    highlight_event_id: guji-沈之问-event-complete
  decisions:
  - date: 1618-01-01
    title_zh: 明源流胎传与触秽相染可预治
    rationale: 父母毒遗胚胎，口鼻厕秽相感，幼年未发先服药杀虫可断滋蔓
  - date: 1620-01-01
    title_zh: 存祝由破迷而归燮理阴阳
    rationale: 神煞妖祟不过因气血不正受邪，调气血清思虑则神正邪消，不可谄媚亦不可慢渎
