    start_date: 1785
    highlight_event_id: guji-沈又彭-event-study
  - key: climax
    name: 辨寒暑六入非六气之伪
    labels:
      zh: 辨伪存真
    start_date: 1790
    highlight_event_id: guji-沈又彭-event-study
  - key: closure
    name: 定十二经脉注络之法
    labels:
