  dilemmas:
  - title_zh: 经文传抄错乱何以存真
    description: 灵素难经传写多误奇经三焦卫气出路聚讼不休若从俗则失圣意若改经则惧僭妄
  - title_zh: 寒暑六入与六气当何从
    description: 世宗金元运气之说以六气解经而经旨本言五气从上下四旁而入去取之间关乎临证施治
  lesson: 治病如治贼必先识经络分界平人气象为本考订源流而后可言治
  summary_first_person: 吾沈又彭生长乾嘉之际潜心灵素不信运气附会独以经文互证考三焦为有形之管卫出上焦营出中焦辨六气为后人之伪汇为医经读平集以示来者
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/医经读.md
  - https://daizhige.org/医藏/医经读.html
endeavors:
