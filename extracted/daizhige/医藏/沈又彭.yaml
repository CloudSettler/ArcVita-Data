    start_date: 1795
    highlight_event_id: guji-沈又彭-event-write
  decisions:
  - date: 1785
    title_zh: 改卫出下焦为出上焦之误
    rationale: 水谷入胃阳蒸上腾如雾露之溉若出下焦则与便溺同出悖于生理故据经营卫生会篇校正
  - date: 1790
    title_zh: 断六气运气为后人伪造
    rationale: 经言寒暑六入谓五气从上下四旁而入非后世六气相火之说遵六元正纪五步以求五行各得其平
- id: guji-沈又彭-endeavor-2
  title_zh: 撰述医经读平集垂训
  summary: 会平人气象十二官六腑阴阳离合之旨以按语发明著为平集一卷
  phases:
  - key: brewing
    name: 汇集平人论治旧稿
    labels:
      zh: 汇稿
    start_date: 1795
    highlight_event_id: guji-沈又彭-event-write
  - key: breakthrough
    name: 立平集以不病为镜
    labels:
      zh: 立意
    start_date: 1798
    highlight_event_id: guji-沈又彭-event-write
  - key: climax
    name: 成医经读传抄讲授
    labels:
      zh: 成书
    start_date: 1800
    highlight_event_id: guji-沈又彭-event-write
  - key: closure
    name: 以识贼喻传授后学
    labels:
      zh: 传道
    start_date: 1810
    highlight_event_id: guji-沈又彭-event-teach
  decisions:
  - date: 1798
    title_zh: 以平人气象开卷立宗
    rationale: 医不知不病何由知病故取上古天真五营运六节藏象为纲使养生治病有据
  - date: 1800
    title_zh: 以按语存疑不没旧文
    rationale: 奇经八脉经文错乱系后人传写之误遵越人所述录其明晰而以彭按别之不敢混经与注
events:
- id: guji-沈又彭-event-birth
  title_zh: 生于清乾隆年间
  date: 1750
  year_of: 1750
  description: 约生于乾隆中叶江浙之地少而神慧长而好医
- id: guji-沈又彭-event-study
  title_zh: 精研灵素辨营卫三焦
  date: 1785
  year_of: 1785
  description: 考经营卫生会篇悟上焦如雾中焦如沤下焦如渎辨肉分腠理溪谷之会以行营卫
- id: guji-沈又彭-event-write
  title_zh: 著成医经读平集
  date: 1800
  year_of: 1800
  description: 汇十二经脉循行主病阴阳离合奇经为病之论加按发明成平集一卷
- id: guji-沈又彭-event-teach
  title_zh: 讲授经脉分界治病之法
  date: 1810
  year_of: 1810
  description: 以治病犹治贼必先识贼所在为喻授学者以十二经所辖省治分界之法
- id: guji-沈又彭-event-death
  title_zh: 卒于嘉道年间
  date: 1820
  year_of: 1820
  description: 晚年仍以校经为事卒后医经读传抄于世为医藏所收
