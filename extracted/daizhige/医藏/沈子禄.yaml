    title_zh: 从计偕赴京师求仕
    rationale: 欲以所学遇于时，故随计吏北上以求展布。
  - date: 1567
    title_zh: 无遇即决然南归
    rationale: 久留无益不欲虚耗，宁归守医道著述以待后。
events:
