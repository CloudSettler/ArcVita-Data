  reign_ref: 明嘉靖末至万历初
  archetype: 医家
  dilemmas:
  - 计偕北上求遇与归而著书立言之抉择
  - 引证繁复补益太过与删繁就简务求精要之权衡
  lesson: 治病必先寻经络以洞视脏腑，著书贵博而更贵精。
  summary_first_person: 吾沈子禄，字承之，明人，博治医经，一本内经及诸大家之说而时参己见，自巅放趾编成经脉分野，嘉靖末以编托友徐师曾订而序之，继而计偕北上居京师岁余无所遇而还，郁郁病卒，所著经徐伯鲁删校续以经络枢要，更名经络全书以传。
