  - date: 1560
    title_zh: 以内经为本兼采诸大家
    rationale: 欲使脏腑经络筋脉皆可洞视，故博治而不专一说。
  - date: 1565
    title_zh: 持编示徐师曾请订序
    rationale: 自知引证繁复补益太过，故托深于医者删校以传后学。
- id: guji-沈子禄-endeavor-2
  title_zh: 计偕北上求遇不果而还
  summary: 从计偕士赴京师居岁余无所遇，郁郁南还病卒。
  phases:
