  date: 1566
  year_of: 1566
  description: 从计偕士赴京师居岁余竟无所遇，郁郁不得志而南还。
- id: guji-沈子禄-event-death
  type: death
  title_zh: 南还后郁郁病卒
  date: 1571
  year_of: 1571
  description: 北还后郁郁病发以卒，所著经脉分野原编留待徐师曾受书卒业。
