    title_zh: 舍空言而载临症
    rationale: 既托空言不如载之临症深切著明，故搜罗奇症而以常理释之
  - date: 1780-01-01
    title_zh: 久不自信广加访求
    rationale: 未敢自信，故穷年咨诹，朋侪坐对风雨孤灯皆记录校订
- id: guji-沈源-endeavor-2
  title_zh: 以常理解奇症济世
  description_zh: 阐天文抒地理引人事旁及品类，引素问灵枢五行所属释头目诸怪症，冀医者证之了然
  phases:
  - key: breakthrough
