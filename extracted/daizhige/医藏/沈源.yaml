  - title_zh: 空言立说与临症载道之辨
    description_zh: 既托空言不如载之临症深切著明，故舍泛论而搜罗奇症
  - title_zh: 自信不足与穷年咨诹之难
    description_zh: 不敢自信，足迹所经靡不咨诹，句窜字易凡二十年
  lesson: 医者不良相即良医，以常理释奇症，穷年亲证方能寿世济人
  summary_first_person: 吾长水沈源，自号抱元子，资敏好学，钩河洛羲周之蕴而寓之于医，穷二十年搜罗奇症，阐天文抒地理引人事，以常理释之，愿后之操刀者得是书而了然，此吾作奇症汇之志也
  source_urls:
