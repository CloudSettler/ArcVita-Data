endeavors:
- id: guji-沈源-endeavor-1
  title_zh: 穷年搜罗奇症汇编
  description_zh: 足迹所经靡不咨诹，或得之朋侪坐对，或得之风雨孤灯，饮食梦寐胥是，句窜字易二十年而成汇
  phases:
