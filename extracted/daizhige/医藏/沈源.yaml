  date: 1725-01-01
  year_of: 1725
  is_circa: true
  description_zh: 清雍正前后生于长水，名裔之后，资敏学优，好著述
- id: guji-沈源-event-collect
  title_zh: 开始搜罗奇症
  date: 1766-01-01
  year_of: 1766
  description_zh: 发愿搜罗奇症，足迹所经靡不咨诹，朋侪坐对风雨孤灯皆笔录
- id: guji-沈源-event-annotate
  title_zh: 以常理释头目怪症
  date: 1775-01-01
  year_of: 1775
  description_zh: 以素问风气太阳阳明及五脏虫类之理，释顶疮肉人鸟鹊天白蚁诸症而加源按
- id: guji-沈源-event-publish
  title_zh: 李篪作序奇症汇行世
  date: 1786-03-01
  year_of: 1786
  description_zh: 乾隆丙午仲春，李篪作序于当湖，奇症汇付梨枣以附不朽
- id: guji-沈源-event-death
  title_zh: 乾隆末年逝世
  date: 1795-01-01
  year_of: 1795
  is_circa: true
  description_zh: 乾隆末前后逝世，遗奇症汇一编寿世，卢扁而韩董者也
