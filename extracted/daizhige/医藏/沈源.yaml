    start_date: 1786-03-01
    highlight_event_id: guji-沈源-event-publish
  decisions:
  - date: 1775-01-01
    title_zh: 引经释奇症加按
    rationale: 恐人视为怪异无据，故引轩岐阴阳五行经义作源按以明常理
  - date: 1786-03-01
    title_zh: 请序付梨枣公世
    rationale: 得姻亲李篪作序，愿操刀者得书证之若指诸掌，附于不朽之言
events:
- id: guji-沈源-event-birth
