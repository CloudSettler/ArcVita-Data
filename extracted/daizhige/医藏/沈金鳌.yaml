person:
  qid: guji-沈金鳌
  name_zh: 沈金鳌
  names:
    zh: 沈金鳌
    en: Shen Jinao
  lifespan:
    birth:
      date: 1717
      precision: year
      is_circa: true
      raw: 康熙五十六年
    death:
      date: 1776
      precision: year
      is_circa: true
      raw: 乾隆四十一年
  birth_date: 1717
  death_date: 1776
  era: 清
  reign_ref: 乾隆
  archetype: 医者
  dilemmas:
  - 妇女深居隐曲难达，翕忽之脉难凭，当何以取准而不贻祸
  - 医书聚讼纷繁，识见不卓则无把持，当何以抉择而归于一是
  lesson: 量病当如玉尺划寸，坚久不磨，按脉切症，调养气血，不妄揣攻伐，方得幽私隐曲之的当
  summary_first_person: 余无锡沈金鳌，字芊绿，号汲门老人，悯妇女情志郁结，隐曲难言，医多妄凭脉以测，遂参稽前贤，著妇科玉尺六卷，务求按脉切症，的当不磨，以为后世取准之尺
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%A6%87%E7%A7%91%E7%8E%89%E5%B0%BA.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%A6%87%E7%A7%91%E7%8E%89%E5%B0%BA.md
endeavors:
- id: guji-沈金鳌-endeavor-1
  title_zh: 参稽著述妇科玉尺
  summary: 察妇女经产崩带诸病，参稽诸家，著六卷九门，按脉切症，采录至精至粹之方，以玉尺取准为纲
  phases:
  - key: brewing
    name: 无锡行医察妇女郁结难诊
    labels:
      zh: 酝酿
    start_date: 1760
    highlight_event_id: guji-沈金鳌-event-practice
  - key: breakthrough
    name: 立玉尺取准按脉切症之法
    labels:
      zh: 突破
    start_date: 1770
    highlight_event_id: guji-沈金鳌-event-rhizhu
  - key: climax
    name: 分经闭崩带胎产九门成书六卷
    labels:
      zh: 高潮
    start_date: 1773
    highlight_event_id: guji-沈金鳌-event-yuchi
  - key: closure
    name: 乾隆甲午清明自序刊行
    labels:
      zh: 收束
    start_date: 1774-04-03
    highlight_event_id: guji-沈金鳌-event-yuchi
  decisions:
  - date: 1770
    title_zh: 以仓公鱼际诊女为法立玉尺之名
    rationale: 妇女幽私掩蔽难达，独凭脉则毫厘千里，故借玉尺坚久不磨为喻，强调分寸的当
  - date: 1774
    title_zh: 正文后采录前人至精之论及验效之方
    rationale: 医书聚讼须识精见卓确有把持，必再四考订性味分量，针对不爽方敢载笔，以免矛盾贻误
- id: guji-沈金鳌-endeavor-2
  title_zh: 汇通杂病源流以惠后学
  summary: 由妇科推及杂病，溯源流，别虚实，著杂病源流犀烛三十卷，与妇科玉尺互为表里，垂训乡里后进
  phases:
  - key: brewing
    name: 乡里诊治积累杂病经验
    labels:
      zh: 酝酿
    start_date: 1760
    highlight_event_id: guji-沈金鳌-event-practice
  - key: breakthrough
    name: 以源流为纲贯通内外妇儿
    labels:
      zh: 突破
    start_date: 1771
    highlight_event_id: guji-沈金鳌-event-rhizhu
  - key: climax
    name: 杂病源流犀烛三十卷告成
    labels:
      zh: 高潮
    start_date: 1773
    highlight_event_id: guji-沈金鳌-event-rhizhu
  - key: closure
    name: 以妇科续补杂病之缺垂训后世
    labels:
      zh: 收束
    start_date: 1774-04-03
    highlight_event_id: guji-沈金鳌-event-yuchi
  decisions:
  - date: 1773
    title_zh: 先成杂病源流再专精妇科
    rationale: 妇女病倍多于男子而原不外经产崩带，须先明杂病源流，方能充类至尽统摄妇科诸变
  - date: 1774
    title_zh: 谆嘱临时裁度不可拘泥成方
    rationale: 病变无方，运用之妙存乎一心，故凡例明言因势酌方，调养脾胃气血为本，不专事攻伐
events:
- id: guji-沈金鳌-event-birth
  date: 1717
  year_of: 1717
  title_zh: 出生于江苏无锡
  description: 康熙五十六年生于无锡，字芊绿，号汲门老人，少力学医，尤精内妇诸科
- id: guji-沈金鳌-event-practice
  date: 1760
  year_of: 1760
  title_zh: 无锡行医察妇女病
  description: 久诊乡里，见妇女情不畅识不开，忧思怨怒致气血乖争，又隐曲掩蔽难达，遂思以玉尺量准之法诊治
- id: guji-沈金鳌-event-rhizhu
  date: 1773
  year_of: 1773
  title_zh: 撰成杂病源流犀烛
  description: 汇通杂病源流，著书三十卷，溯病源，辨脉症，垂为医门津梁，与后之妇科著述相表里
- id: guji-沈金鳌-event-yuchi
  date: 1774-04-03
  year_of: 1774
  title_zh: 自序妇科玉尺六卷
  description: 乾隆甲午清明前二日自书序，成妇科玉尺六卷九门，论月经崩带胎产诸症，按脉切症，采录精粹效方，刊行于世
- id: guji-沈金鳌-event-death
  date: 1776
  year_of: 1776
  title_zh: 逝世于无锡
  description: 乾隆四十一年卒于里第，所著妇科玉尺与杂病源流犀烛并行于世，为清代妇科要籍
