  decisions:
  - date: 1745
    title_zh: 只言所明不明不言
    rationale: 明须得传授亲习其事而证理不差，浮光掠影臆测傅会之谈皆不著述
  - date: 1760
    title_zh: 先成伤寒杂病妇科三书
    rationale: 男妇大小脉症皆得亲受而晓然于手目，故一一笔之于书以示确凿可据
- id: guji-沈金鳌-endeavor-2
  title_zh: 辑幼科释谜阙痘待补
  summary: 分二十四门以四言韵语便诵习，删繁就简宗中和当病，独阙痘症以俟后贤
