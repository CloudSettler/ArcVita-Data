  death_date: 1776-01-01
  era: 清代
  reign_ref: 乾隆
  archetype: 医家方书编纂者
  dilemmas:
  - 历代药性书依草木金石分类读者易忘宣通补泻等十剂之性当如何使人晓然各有其性各有其用
  - 世尚险僻毒药取效一时而良药十痊八九当如何摒去险僻专录日用必需四百余品以全慎用之道
  lesson: 审药之体性以全其用去险僻而守平正临症方无背谬
  summary_first_person: 吾沈金鳌字芊绿号汭居乌程人也感时医制方相反错杂乃援徐之才十剂之目分要药四百余品为宣通补泻轻重滑涩燥湿等门首明主治次详归经参前贤议论标禁忌及炮制欲阅者晓然于药性而临症无失又推杂病源流著犀烛诸书以惠后学此吾一生之志也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%A6%81%E8%8D%AF%E5%88%86%E5%89%82.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%A6%81%E8%8D%AF%E5%88%86%E5%89%82.html
endeavors:
- id: guji-沈金鳌-endeavor-1
  title_zh: 以十剂分类编撰要药分剂
  description: 援徐之才宣通补泻轻重滑涩燥湿十剂分门录日用必需四百余品明主治归经禁忌炮制以正制方用药之失
  phases:
  - key: brewing
    name: 慨然有感于本草依类相次而忘十剂大体
    labels:
      zh: 酝酿
    start_date: 1765-01-01
    highlight_event_id: guji-沈金鳌-event-study-materia
  - key: breakthrough
    name: 定去寒热之目专守十剂以分门类
    labels:
      zh: 突破
    start_date: 1770-01-01
    highlight_event_id: guji-沈金鳌-event-yaoyao-complete
  - key: climax
    name: 要药分剂成书并作自序凡例
    labels:
      zh: 高潮
    start_date: 1773-01-01
    highlight_event_id: guji-沈金鳌-event-yaoyao-complete
  - key: closure
    name: 列入沈氏尊生书刊行流传
    labels:
      zh: 收束
    start_date: 1774-01-01
    highlight_event_id: guji-沈金鳌-event-zunsheng-publish
  decisions:
  - date: 1770-01-01
    title_zh: 摒险僻专录要药
    rationale: 良药治病十痊八九毒药治不一二故稍涉险僻者概摒去止存四百余品以慎用药
  - date: 1773-01-01
    title_zh: 恪守十剂不另立升降二门
    rationale: 宣轻兼升泻滑兼降诸药非升即降无不升不降者升降可概群药不得另立故仍以十剂统摄群品
- id: guji-沈金鳌-endeavor-2
  title_zh: 考杂病源流著犀烛以惠后学
  description: 由用药而推及杂病之源流汇历代治法为杂病源流犀烛三十卷与脉象诸书合为尊生之业
  phases:
  - key: brewing
    name: 行医见杂病散乱无纲博览本经别录纲目备要
    labels:
      zh: 酝酿
    start_date: 1760-01-01
    highlight_event_id: guji-沈金鳌-event-study-materia
  - key: breakthrough
    name: 以源流为纲析病因病机治法
    labels:
      zh: 突破
    start_date: 1771-01-01
    highlight_event_id: guji-沈金鳌-event-xizhu-complete
  - key: climax
    name: 杂病源流犀烛三十卷告成
    labels:
      zh: 高潮
    start_date: 1773-01-01
    highlight_event_id: guji-沈金鳌-event-xizhu-complete
  - key: closure
    name: 汇刊沈氏尊生书传于世
    labels:
      zh: 收束
    start_date: 1774-01-01
    highlight_event_id: guji-沈金鳌-event-zunsheng-publish
  decisions:
  - date: 1771-01-01
    title_zh: 首列本经次补别录兼采诸贤发明
    rationale: 用药依本经所治总无大错别录补其未备诸贤发明又备别录之缺故兼采以求画一精切
  - date: 1773-01-01
    title_zh: 尊仲淳经疏简误以定禁忌
    rationale: 经疏为本草第一精细之书其简误审量极至故禁忌一宗之以示详审不敢改窜前人之语
