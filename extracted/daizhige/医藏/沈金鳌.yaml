  era: 清
  reign_ref: 乾隆
  archetype: 儒医
  dilemmas:
  - title_zh: 痘症阙而不作
    description: 幼科以痘为微险百变之候，未得临症亲授则未能晓然于手目，故宁阙一门以待精业者，不肯妄言
  - title_zh: 食积攻补之偏
    description: 儿病多由食积亦有禀弱无积者，峻攻骤补专凉专热皆偏，须扶正使积自消，以中和当病为归
  lesson: 明必证于心手目，未明者阙如，守中和当病之法
  summary_first_person: '余性素拘，只言所明，不明不敢言。医传自孙庆曾先生，男女大小脉症皆得亲受，试之诊视罔弗取效，故伤寒纲目杂病源流妇科玉尺皆晓然于心手目而笔之于书。独痘症未获相随痘家亲聆教诲，虽深究钱陈曾万诸家而未能晓然于手目，故辑幼科释谜六卷二十四门而独阙痘症，庸有待于精其业者补之。

    '
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%B9%BC%E7%A7%91%E9%87%8A%E8%B0%9C.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%B9%BC%E7%A7%91%E9%87%8A%E8%B0%9C.html
