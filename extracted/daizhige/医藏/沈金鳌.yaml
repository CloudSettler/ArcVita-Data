    start_date: 1774-12
    highlight_event_id: guji-沈金鳌-event-youke
  decisions:
  - date: 1774-12
    title_zh: 独阙痘症庸有待
    rationale: 痘候险变化百出，未获相随痘家亲聆教诲，未能晓然于手目，故不敢妄言而阙之
  - date: 1774-12
    title_zh: 宗中和不偏攻补凉热
    rationale: 古人或专攻专补专凉专热皆有偏处，芽儿脏气未全不胜药力，故以中和当病为归
