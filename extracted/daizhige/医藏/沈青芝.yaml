  decisions:
  - date: 1881-08
    title_zh: 以一生心血卷授方燕昭
    rationale: 好学欲窥门径而不得偏治为害匪细故公之使初学入门高明指谬
  - date: 1890-11
    title_zh: 辞白镪购阅不受渔利
    rationale: 实非沽名渔利而设乃以延济人之诚心为救人之实筏故辞不受
- id: guji-沈青芝-endeavor-2
  title_zh: 邗江镇扬救治白喉风时疫
  description: 用清润解毒引热下行及针吐法救治朝发夕死之白喉十得七八
  phases:
  - key: brewing
    name: 研求张绍修十难龙虎二仙汤法
    labels:
      zh: 研法
    start_date: '1876'
    highlight_event_id: guji-沈青芝-event-1881-shoujuan
  - key: breakthrough
    name: 庚寅季春邗江白喉大行
    labels:
      zh: 时疫
    start_date: 1890-03
    highlight_event_id: guji-沈青芝-event-1890-zhibaihhou
  - key: climax
    name: 重剂龙虎汤加雄黄解毒丸起死
    labels:
      zh: 救治
    start_date: 1890-04
    highlight_event_id: guji-沈青芝-event-1890-zhibaihhou
  - key: closure
    name: 白退后清余毒养正调理
    labels:
      zh: 调理
    start_date: 1890-05
    highlight_event_id: guji-沈青芝-event-1890-zhibaihhou
  decisions:
  - date: 1890-04
    title_zh: 不用麻桂升提改用清润泻火下行
    rationale: 白喉乃肺金火毒熏蒸误服风燥辛温则毒涣散不可挽故除去升提酸涩专用清润
  - date: 1890-04
    title_zh: 危急用针刺吐法及厉剂夺关
    rationale: 喉闭不刺血喉风不吐痰皆非法缓治则死故刺少商放恶血服雄黄解毒丸下恶涎
events:
- id: guji-沈青芝-event-birth
  date: '1815'
  year_of: 1815
  title_zh: 生于溧阳
  description: 清道光初年左右生于溧阳自幼精习岐黄尤加讲习喉科
- id: guji-沈青芝-event-1881-shoujuan
  date: 1881-08
  year_of: 1881
  title_zh: 光绪辛巳授卷于方燕昭
  description: 以一生心血喉科卷授方伯融于邗上温翠轩同集三十六种喉科
- id: guji-沈青芝-event-1890-zhibaihhou
  date: 1890-04
  year_of: 1890
  title_zh: 邗江救治白喉风时疫
  description: 庚寅季春邗江白喉大行朝发夕死用龙虎二仙汤连服数剂镇扬来治者十得七八
- id: guji-沈青芝-event-1890-chengshu
  date: 1890-11
  year_of: 1890
  title_zh: 广陵橘井山房自序集腋
  description: 仲冬自序喉科集腋上下二卷列针法吐法用药禁忌及白喉喉痹诸方以公于世
- id: guji-沈青芝-event-death
  date: '1893'
  year_of: 1893
  title_zh: 没于广陵
  description: 成书后数年没于广陵橘井山房一生以活人之法不辞心劳力瘁
