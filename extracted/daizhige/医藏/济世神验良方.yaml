  birth_date: '1610-01-01'
  death_date: '1690-01-01'
  era: 明末清初
  reign_ref: 清初
  archetype: 医者
  dilemmas:
  - 噎膈翻胃虚实寒热难辨，辛香燥热暂快而久必结窠囊，用舍两难
  - 伤寒温疫时行难分，麻黄发表误投则祸大，守而不发亦误人
  lesson: 不治已病治未病，详辨虚实痰火，戒妄投香燥，清养脾胃以保津液
  summary_first_person: 吾为民间佚名医士，游历采方，见噎膈翻胃气痛及伤寒疫疠误治者众，故集神仙夺命丹与顺气和中汤等验方，详论痰火气血，戒香燥劫痰，冀后人合看脾胃诸气吞酸各门而济世活人
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/济世神验良方.md
  - https://daizhige.org/医藏/济世神验良方.html
endeavors:
- id: guji-济世神验良方-endeavor-1
  title_zh: 汇集噎膈翻胃气症验方
  summary: 采集噎隔翻胃气症诸方，论痰火气血虚实，成顺气和中等方论
  phases:
  - key: brewing
    name: 游历采验方
    labels:
      zh: 采方积累
    start_date: '1640-01-01'
    highlight_event_id: guji-济世神验良方-event-yege
  - key: breakthrough
    name: 辨噎膈翻胃一理
    labels:
      zh: 立论突破
    start_date: '1655-01-01'
    highlight_event_id: guji-济世神验良方-event-fanwei
  - key: climax
    name: 定顺气和中安中诸方
    labels:
      zh: 成方高峰
    start_date: '1660-01-01'
    highlight_event_id: guji-济世神验良方-event-fanwei
  - key: closure
    name: 戒香燥以收功保后
    labels:
      zh: 保后收功
    start_date: '1665-01-01'
    highlight_event_id: guji-济世神验良方-event-fanwei
  decisions:
  - date: '1655-06-01'
    title_zh: 以二陈四君四物分痰热气血虚实立法
    rationale: 戴氏龚氏皆主痰火，气虚不能运化而生痰，血虚不能滋润而生火，故分脉立法，气血未虚方可劫痰
  - date: '1660-08-01'
    title_zh: 戒辛香燥热并专列余论示翻胃危笃
    rationale: 噎膈失治则痰结为翻胃，翻胃后即膈死，初误认寒而服燥药者速其成，故详论于翻胃篇以儆世
- id: guji-济世神验良方-endeavor-2
  title_zh: 厘定伤寒中寒伤风疫疠治法
  summary: 分六经表里寒热虚实，集十神香苏败毒诸方，辨伤寒与时行瘟疫脚气伤暑之异
  phases:
  - key: brewing
    name: 临症辨六经脉证
    labels:
      zh: 辨证积累
    start_date: '1645-01-01'
    highlight_event_id: guji-济世神验良方-event-shanghan
  - key: breakthrough
    name: 悟伤寒与时疫之别
    labels:
      zh: 去伪存真
    start_date: '1658-01-01'
    highlight_event_id: guji-济世神验良方-event-shanghan
  - key: climax
    name: 会通三阳三阴总治法
    labels:
      zh: 会通成书
    start_date: '1668-01-01'
    highlight_event_id: guji-济世神验良方-event-shanghan
  - key: closure
    name: 录李君宾七方及四季感冒单方以便救人
    labels:
      zh: 普济收尾
    start_date: '1672-01-01'
    highlight_event_id: guji-济世神验良方-event-shanghan
  decisions:
  - date: '1658-03-01'
    title_zh: 有汗非伤寒不可遽用麻黄汤
    rationale: 春分后冬至前多为伤暑脚气时行瘟疫类伤寒者，最宜详辨，误发则亡阳，故抬出另治
  - date: '1668-10-01'
    title_zh: 不问表里先以败毒五积依时加味总治时行
    rationale: 得自明医斟酌三阴三阳，以便老少男女孕妇一同救急，再随经加减以全其变
events:
- id: guji-济世神验良方-event-birth
  title_zh: 生于明末民间
  date: '1610-01-01'
  year_of: 1610
  description: 生于明末，少习岐黄，游历民间采集验方，尤留意噎膈翻胃危症
- id: guji-济世神验良方-event-yege
  title_zh: 录噎隔门神仙夺命丹诸方
  date: '1650-05-01'
  year_of: 1650
  description: 录神仙夺命丹治噎食，蓝靛汁白术槿花陈皮生姜等单方，并辨噎气膈气痰火与翻胃之别
- id: guji-济世神验良方-event-fanwei
  title_zh: 成翻胃门顺气和中汤安中调气丸
  date: '1660-08-01'
  year_of: 1660
  description: 论翻胃四说气虚血虚痰热，定顺气和中汤加竹沥童便姜汁，安中调气丸养血助胃丸，并引龚氏牛乳为上策
- id: guji-济世神验良方-event-shanghan
  title_zh: 定伤寒六经及三阳三阴总治
  date: '1668-10-01'
  year_of: 1668
  description: 分太阳阳明少阳太阴少阴厥阴脉证，录十神汤香苏散人参败毒散五积散小柴胡汤，立三阳七十二证三阴七十二证总诀
- id: guji-济世神验良方-event-death
  title_zh: 卒于清初书成流传
  date: '1690-01-01'
  year_of: 1690
  description: 书成后隐名而终，济世神验良方以佚名流传，后人传抄刊刻以济世活人
