  - key: breakthrough
    name: 江南行医声先诸医
    labels:
      zh:
      - 突破
    start_date: 1352
    highlight_event_id: guji-滑寿-event-practice
  - key: climax
    name: 撰素问钞难经本义危素宋濂序之
    labels:
      zh:
      - 高潮
    start_date: 1366
    highlight_event_id: guji-滑寿-event-nanjing
  - key: closure
    name: 医道垂范后世以外科家业相传
    labels:
      zh:
      - 收束
    start_date: 1386
    highlight_event_id: guji-滑寿-event-death
  decisions:
  - date: 1352
    title_zh: 居江南以医济世兼治针药
    rationale: 针误施则戕贼人汤液亦必明何经中邪故须明经络而后补泻汗下无施不可
  - date: 1366
    title_zh: 纯以内经为本注疏不杂方药
    rationale: 世著医书繁多而以内经为本者鲜故钞素问注难经以发四家微辞秘旨继其垂范
events:
- id: guji-滑寿-event-birth
  title_zh: 诞生于许昌
  date: 1304
  year_of: 1304
  summary_zh: 元大德八年生于许昌字伯仁自号撄宁生博通经史诸家言为文温雅有法而尤深于医
- id: guji-滑寿-event-zixu
  title_zh: 至正初元自序十四经发挥
  date: 1341
  year_of: 1341
  summary_zh: 裒灵枢本输素问骨空等论得十二经加任督二脉考六百五十七穴图章训释缀韵语厘三卷名十四经发挥
- id: guji-滑寿-event-practice
  title_zh: 行医江南声先诸医
  date: 1352
  year_of: 1352
  summary_zh: 居江南行医博通经史贯通金元四家之学江南诸医未能或之先
- id: guji-滑寿-event-luxu
  title_zh: 吕复为十四经发挥作序
  date: 1364
  year_of: 1364
  summary_zh: 至正甲辰中秋四明吕复书序于鄞台山樵舍称其图章训释纲举目张为医门司南
- id: guji-滑寿-event-nanjing
  title_zh: 撰素问钞难经本义宋濂推重
  date: 1366
  year_of: 1366
  summary_zh: 著素问钞难经本义纯以内经为本贯通四家微旨金华宋濂序十四经发挥称其必将并传
- id: guji-滑寿-event-death
  title_zh: 卒于明初
  date: 1386
  year_of: 1386
  summary_zh: 明洪武十九年卒一生以发挥经络针药并重为志其书后经薛铠校刊广传
- id: guji-滑寿-event-reprint
  title_zh: 薛铠校刊盛应阳叙重刊
  date: 1528
  year_of: 1528
  summary_zh: 嘉靖戊子吴长洲薛铠校正刊梓以广其传前进士盛应阳书序于金陵官寓言其用心即伯仁之心
