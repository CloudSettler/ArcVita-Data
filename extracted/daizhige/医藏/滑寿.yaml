    title_zh: 以流注为序并列任督为十四经
    rationale: 任督包腹背而有专穴诸经满溢所归当与十二经常道并论以成六百五十七穴之全
  - date: 1341
    title_zh: 图注歌括并举以惠初学
    rationale: 灵枢辞旨简严难解故训字义释名物疏本旨正句读又联韵语附各经之后便记诵
- id: guji-滑寿-endeavor-2
  title_zh: 行医江南注疏素难继金元四家
  summary_zh: 博通经史贯通张元素刘完素张从正李杲之学行医江南撰素问钞难经本义振兴医道
  phases:
  - key: brewing
    name: 博通经史兼习金元四家
