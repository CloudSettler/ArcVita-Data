  lesson: 医必先求无过而后求有功，平稳淡泊足以全人免庸医药误
  summary_first_person: 余番禺潘名熊号兰坪，筑评琴书屋于西村，初虑从师羊城之儿侄辈风寒不慎饮食不节，订外感春温暑湿泻痢疟七症方与之，试之多效，遂增头心腰腹诸痛诸血诸症成三十三门七十七首，付梓公世，愿不知医者亦得自调，不为庸医所误
