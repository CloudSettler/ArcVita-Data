    rationale: 意谓挑灯而续其焰因脉及证因证及方融会平实切近使读者见如指掌
events:
- id: guji-潘楫-event-birth
  title_zh: 出生于武林
  date: 1604
  year_of: 1604
  place_zh: 武林城东
  description_zh: 先世三川人自中允扈建炎跸家武林十六世至楫父云乔子四举楫最后少以孝弟闻
- id: guji-潘楫-event-apprentice
  title_zh: 万历壬子负笈师事王绍隆
  date: 1612
  year_of: 1612
  place_zh: 武林土桥
  description_zh: 经同盟朱仲修相引朝暮随从王绍隆先命读灵素次本经难经伤寒金匮脉经随读随讲
- id: guji-潘楫-event-masterdeath
  title_zh: 受业师王绍隆西归
  date: 1624-02-01
  year_of: 1624
  description_zh: 先生仅五十有九道大行楫终身不忘师恩诸弟子事楫如楫事先生
- id: guji-潘楫-event-return
  title_zh: 游粤佐张将军幕后还里医隐
  date: 1644
  year_of: 1644
  place_zh: 粤东至武林
  description_zh: 角巾乌衣指麾方略夺隘后父母同夕逝丧毕复游粤值流氛败没病还里门自拟清凉居士卖药都市掉头不仕
- id: guji-潘楫-event-teach
  title_zh: 设帐授徒讲崔氏脉诀
  date: 1650
  year_of: 1650
  place_zh: 武林城东水竹间
  description_zh: 座下数十辈率一时名流受业者数百辈讲灵素难经仲景叔和河间东垣丹溪折衷终取紫虚真人四言举要节解
- id: guji-潘楫-event-book
  title_zh: 医灯续焰告竣春秋六十
  date: 1664
  year_of: 1664
  description_zh: 网罗群有剖析毫芒因脉及证因证及方陈朝辅与宗末之淇为序称其最精微最易简普照十方
- id: guji-潘楫-event-death
  title_zh: 寿七十四终于家
  date: 1677
  year_of: 1677
  place_zh: 武林家
  description_zh: 自壮及髦饮上池照不失尺寸三兄先死抚遗孤生分哺死归葬子杓灿苍与皆知名士没后三年门人益谨
