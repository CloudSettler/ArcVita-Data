  lesson: 不忘师恩以医隐全孝以平实传灯则道寿俱隆
  summary_first_person: 我名楫字硕甫号邓林武林人少以孝弟闻壮游粤佐幕后还里师事王绍隆尽得灵兰金匮之学晚以医隐授徒数百人因崔氏脉诀为张本注解师说附以方名医灯续焰以续师灯焰寿七十四终于家
