endeavors:
- id: guji-焦氏-endeavor-1
  title_zh: 喉咽诸症辨治集成
  summary: 集锁喉缠喉乳蛾喉痈喉疔喉单等图症辨色察肿定针药吹洗敷熏之法
  phases:
  - key: brewing
    name: 久诊喉症积累
    labels:
      zh: 审症绘图
    start_date: 1850
    highlight_event_id: guji-焦氏-event-1
  - key: breakthrough
    name: 条列治要成枕秘
    labels:
      zh: 参合证因
    start_date: 1865
    highlight_event_id: guji-焦氏-event-1
  - key: climax
    name: 针药并施定法
    labels:
      zh: 针石汤液并用
    start_date: 1867
    highlight_event_id: guji-焦氏-event-1
  decisions:
  - date: 1865
    title_zh: 定祛风豁痰解热开郁为总法
    rationale: 咽肿属痰喉风属火忌猝投辛散以防增肿腐灼失养阴阳之络
  - date: 1867
    title_zh: 定吹本行针秘收口之次第
    rationale: 麻药用于未针之前秘药用于既针之后红肿敷箍郁痰服水药以保蒂疔不犯
- id: guji-焦氏-endeavor-2
  title_zh: 枕秘传世济时
  summary: 以无副本传世托金保三孙云斋付梓应宝时作序以广民生之用
  phases:
  - key: brewing
    name: 金保三得书
    labels:
      zh: 吴中传得
    start_date: 1867
    highlight_event_id: guji-焦氏-event-2
  - key: breakthrough
    name: 孙云斋鸠资付梓
    labels:
      zh: 付剞劂广传
    start_date: 1868-01-01
    highlight_event_id: guji-焦氏-event-2
  - key: closure
    name: 应宝时序行于世
    labels:
      zh: 弁首流行
    start_date: 1868-02-01
    highlight_event_id: guji-焦氏-event-2
  decisions:
  - date: 1867
    title_zh: 以无副本而付梓公世
    rationale: 针石之法日微枕中鸿宝不胫而走方能有补民生有裨汤液
  - date: 1868-02-01
    title_zh: 请永康应宝时弁首明义
    rationale: 明喉咽通天地开阖之重申营卫脉理标本浅深之辨以诫善读书者
