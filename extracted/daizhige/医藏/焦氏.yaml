  dilemmas:
  - 喉风咽肿生死须臾当用辛散速攻还是祛风豁痰解热开郁以保阴阳之络
  - 针石日微汤液独盛当专守成方还是针石汤药并施审症绘图以济时用
  lesson: 喉咽纳气纳食关系生死审症辨阴阳察血色决生死针药并施缓急有度方能立起沉疴
  summary_first_person: 吾以喉科为业见咽肿属痰喉风属火世人猝投辛散煽动风火遂至腐灼难救故审症绘图条列针石汤药之法祛风豁痰解热开郁以存正伐邪愿后学识头尾明标本善读书而善用刀圭以补民生之用
