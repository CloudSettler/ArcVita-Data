  lesson: 舍形气言理则术肤浅，求实理于形气方能精切适于用
  summary_first_person: 吾江右安义熊笏叔陵，颇究心古圣之书，观诊病脉法经络营卫内景脏象皆与后世不同，乃详辨宗营卫三气与经络浅深，成中风论以就正高明
