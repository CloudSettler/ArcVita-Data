    labels:
      zh:
      - 传抄
      - 待刊
    start_date: 1822
    highlight_event_id: guji-熊笏-event-book
  decisions:
  - date: 1821
    title_zh: 详列形体实义附气血阴阳
    rationale: 后人舍形气言理故术肤浅，须先明脏象经络奇经方能论气
  - date: 1821
    title_zh: 以偏枯专属卫分立论
    rationale: 营行左右交通卫行左右分布，故中风偏枯独在卫分当从卫察浅深
- id: guji-熊笏-endeavor-2
  title_zh: 赴闽证学于陈修园
  description: 嘉庆季年不远千里赴闽证所学，下榻论学而秘不示撰述
  phases:
  - key: brewing
    name: 闻陈修园治疗名赴闽
