      - 相证
    start_date: 1819
    highlight_event_id: guji-熊笏-event-fujian
  - key: climax
    name: 簏中中风论被传钞
    labels:
      zh:
      - 秘稿
      - 传钞
    start_date: 1819
    highlight_event_id: guji-熊笏-event-copied
  - key: closure
    name: 束装归江右全集待刻
    labels:
      zh:
      - 东归
      - 待刻
    start_date: 1820
    highlight_event_id: guji-熊笏-event-copied
  decisions:
  - date: 1819
    title_zh: 不远千里证学修园
    rationale: 欲以古经内景之学证于当世名医以定是非
  - date: 1819
    title_zh: 深自谦秘不示人
    rationale: 学术浅陋恐按剑相诧，惟就正高明不欲轻出
