    highlight_event_id: guji-爱月庐医案-event-brain
  - key: breakthrough
    name: 扶正却邪标本兼顾初诊
    labels:
      zh: 裂缝来浆收束根盘
    start_date: 1730-07-01
    highlight_event_id: guji-爱月庐医案-event-brain
  - key: climax
    name: 以脉测郁怒肝火挟毒三诊
    labels:
      zh: 脉右少神左关弦数
    start_date: 1730-08-15
    highlight_event_id: guji-爱月庐医案-event-brain
  - key: closure
    name: 肾俞虚痰阴阳并补熬膏
    labels:
      zh: 乙癸同源有情生有形
    start_date: 1732-10-01
    highlight_event_id: guji-爱月庐医案-event-shenyu
  decisions:
  - date: 1730-07-01
    title_zh: 七旬偏脑疽不用苦寒滋腻而用参芪托补
    rationale: 年高正虚邪实，苦寒犯虚虚之戒，滋腻犯实实之忧，故扶正以却邪两不相害
  - date: 1732-10-01
    title_zh: 肾俞虚痰立阴阳并补参入精血有情
    rationale: 先天不足寒湿阻络，单投辛热耗阴液，单进寒凉脱元阳，必龟鹿二仙以生有形
events:
- id: guji-爱月庐医案-event-birth
  date: 1680-01-01
  year_of: 1680
  title_zh: 降生于清康熙年间
  description: 生于阴虚多病之世，少习内经难经，尤究外科喉科脉法，抄书避玄字讳
- id: guji-爱月庐医案-event-throat
  date: 1720-09-15
  year_of: 1720
  title_zh: 辨治喉风喉蛾 neck痈成案
  description: 治质本阴虚秋燥化火痰升喉风，以犀角元参石斛生地银花连翘清解，三诊喉蛾溃后养阴润肠
- id: guji-爱月庐医案-event-brain
  date: 1730-06-10
  year_of: 1730
  title_zh: 三诊偏脑疽以脉测症
  description: 七旬偏脑疽木硬漫肿根紫浆稀，三诊脓多疮塌红肿蔓延，诊得右部少神左关弦数，断为郁怒肝火挟毒，扶正却邪参以熄肝养胃
- id: guji-爱月庐医案-event-shenyu
  date: 1732-10-01
  year_of: 1732
  title_zh: 治肾俞虚痰附骨疽论阴阳怀抱
  description: 治肾俞漏卮清水连绵两足屈伸不利，论阴中有阳阳中有阴如太极分两仪，拟阴阳并补熬膏加龟鹿二仙胶，兼治附骨疽寒湿伏骨调养气血救胃阳
- id: guji-爱月庐医案-event-death
  date: 1750-01-01
  year_of: 1750
  title_zh: 卒于乾隆初年医案传抄
  description: 殁后遗稿以玄作元以弦缺笔传抄，载喉风颈痈发背汤火烂皮疔痔漏遗精吐血等三十余门，理法方药简练切用
