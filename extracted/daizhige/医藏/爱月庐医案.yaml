  decisions:
  - date: 1720-09-15
    title_zh: 喉风不用辛温轻清而用甘凉泻丙丁救壬癸
    rationale: 邪实正虚阴虚阳旺，辛温如抱薪救火，轻清如杯水车薪，必甘凉滋润救坎宫阴津
  - date: 1722-05-20
    title_zh: 喉蛾溃后养阴清热兼养胃润肠
    rationale: 阴液受伤肺胃余热未净，骤进滋腻恐余烬复燃，故清养与通腑并行
- id: guji-爱月庐医案-endeavor-2
  title_zh: 脑疽附骨疽肾俞痰扶正托毒著述
  description: 以脉测症治偏脑疽附骨疽肾俞虚痰，立扶正却邪阴阳并补调气养营之法
  phases:
  - key: brewing
    name: 偏脑疽正轻偏重体认
