      - 子烦
    start_date: 1618-01-01
    highlight_event_id: guji-产鉴-event-compile
  - key: climax
    name: 详列瘦胎达生保生无忧之法
    labels:
      zh:
      - 瘦胎
      - 易产
    start_date: 1618-06-01
    highlight_event_id: guji-产鉴-event-preface
