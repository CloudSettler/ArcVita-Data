  - key: breakthrough
    name: 陈社稷先后所系之重
    labels:
      zh:
      - 生道
      - 致敬
    start_date: 1618-08-01
    highlight_event_id: guji-产鉴-event-preface
  - key: climax
    name: 万历戊午中元日琅琊题序
    labels:
      zh:
      - 题序
      - 琅琊
    start_date: 1618-08-15
    highlight_event_id: guji-产鉴-event-preface
  - key: closure
    name: 许公四方广济施人
    labels:
      zh:
      - 刊布
      - 济世
    start_date: 1618-08-15
    highlight_event_id: guji-产鉴-event-spread
  decisions:
  - date: 1618-08-15
    title_zh: 定家一册时时检铎之法
    rationale: 闺帏秘密巧工不及急索轻用其愚故须女子自知患起与自全之道
  - date: 1618-08-15
    title_zh: 从客请以公四方
    rationale: 养笋与竹养犊与物皆关生养推妇人之仁可广救天下产难之命
