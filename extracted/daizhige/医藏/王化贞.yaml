      - 全生
    start_date: 1618-08-15
    highlight_event_id: guji-产鉴-event-preface
  decisions:
  - date: 1618-06-01
    title_zh: 不作寒病治恶阻以二陈保生为主
    rationale: 胃气怯弱中脘停痰脉和而择食嗜酸当养正安胎不可妄投寒剂伤胎
  - date: 1618-07-01
    title_zh: 八月进达生散而不滥用枳壳瘦胎
    rationale: 胎气本怯胞气肥实方可瘦之当安胎益气令子紧小无病以求易产
- id: guji-产鉴-endeavor-2
  title_zh: 作序刊布欲家置一册公之四方
  goal_zh: 明生子免身之幸与贻患终身之患劝家藏广传以救疾苦存性命
  phases:
  - key: brewing
    name: 感客难妇人之论
    labels:
      zh:
      - 序文
      - 立义
