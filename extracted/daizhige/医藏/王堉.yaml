events:
- id: guji-王堉-event-birth
  title_zh: 出生
  date: 1820-01-01
  year_of: 1820
  description_zh: 生于清嘉庆末少习儒业兼通医理后在京供职
- id: guji-王堉-event-yinre-mutong
  title_zh: 治郭鹤轩阴热目痛
  date: 1844-06-01
  year_of: 1844
  description_zh: 甲辰夏郭昌年自用黄连栀菊而剧诊沉数细弱黑珠起红点断为阴虚血热郁肝以杞菊地黄易生地三服而愈并论眼疾内外虚实之分
- id: guji-王堉-event-tanjie-chuan
  title_zh: 治杨星臣痰结肺胃咳喘晕绝
  date: 1846-03-01
  year_of: 1846
  description_zh: 杨星臣喘咳廿年服滋补罔效诊右寸关坚凝而滑断为顽痰结肺胃以礞石滚痰丸三钱下黑秽数碗宿疾若失雪阴亏不白之冤
- id: guji-王堉-event-yinxu-fare
  title_zh: 治星槎女阴虚内热身面皆赤
  date: 1835-06-01
  year_of: 1835
  description_zh: 乙卯夏侍御女发热身面皆赤众作瘟疫暑郁实火治不效问知午后转甚眼黑耳鸣口干断为阴虚内热以大剂归芍地黄加生地蝉蜕二服而愈
- id: guji-王堉-event-pishi-tanyun
  title_zh: 治祁寿阳相国脾湿痰晕
  date: 1850-08-01
  year_of: 1850
  description_zh: 相国头晕呕逆旋转久服参芪不去诊右滑缓带弦左寸独虚断为脾湿停痰以香砂六君加益智泽泻五服晕除后又以羌活胜湿治其冒风臂痛三进而安
- id: guji-王堉-event-pixu-bianbi
  title_zh: 治薛鹤亭夫人脾虚便闭
  date: 1852-06-01
  year_of: 1852
  description_zh: 甲寅夏夫人便闭投承气火麻平胃不效诊六脉微弱右关尤甚断为脾虚失运以四君平胃重用潞参一两一服即通释塞因寒用之义
- id: guji-王堉-event-book
  title_zh: 辑成醉花窗医案
  date: 1862-01-01
  year_of: 1862
  description_zh: 录书论及阴热痰结脾湿脾劳疟痧霍乱食积等验案成醉花窗医案以明辨证活人之旨
- id: guji-王堉-event-death
  title_zh: 去世
  date: 1870-01-01
  year_of: 1870
  description_zh: 内艰归家后与旧交函札往来卒年不详后世以医案传其学
