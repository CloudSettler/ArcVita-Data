  dilemmas:
  - 述而不作与独抒心得之间如何既存前贤中肯又不没己见
  - 伤寒温热暑湿疫证混淆之际如何使后学不眩惑而知取舍
  - 凉饮寒衣治热与固护脾胃之间如何把握节度而不致停饮脱证
  lesson: 该博淹贯而弃瑕录瑜，辨证明确而慎守温凉，方能息聚讼而全民生
  summary_first_person: 吾乃海宁王士雄，字孟英，号潜斋，隐居不仕而肆力于医，见温热暑湿误作伤寒治而夭札多矣，遂以轩岐仲景为经，叶薛诸家为纬，纂成温热经纬五卷，间附雄按以质通方，愿后学了然胸中而不失歧误
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/温热经纬.md
  - https://daizhige.org/温热经纬.html
