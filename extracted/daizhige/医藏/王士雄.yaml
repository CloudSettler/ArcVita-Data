  summary_first_person: 余王士雄字孟英系出安化侨居钱塘幼失怙携一砚泛江浮海三十余年以医活人著丛书十余种晚年归籍海昌艾溪结庐躬耕录归砚以明归游之本虽逢丧乱版毁故交凋零而济世之志不敢忘也
