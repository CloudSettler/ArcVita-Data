- id: guji-王大纶-event-practice
  title_zh: 行医见陋习而发愤
  date: 1550-01-01
  year_of: 1550
  description: 目击稳婆割舌下筋，罗平野辈推拿挑筋，芽儿受害，故立志著论纠谬
- id: guji-王大纶-event-compile
  title_zh: 编成婴童类萃
  date: 1565-01-01
  year_of: 1565
  description: 汇圣济总录五脏统论变蒸三关诸说，成婴童类萃上卷，立凡例调理护持之法
- id: guji-王大纶-event-death
  title_zh: 逝世
  date: 1585-01-01
  year_of: 1585
  description: 晚年以书垂训后学，嘱守经用权善养芽儿，终于明万历前后
