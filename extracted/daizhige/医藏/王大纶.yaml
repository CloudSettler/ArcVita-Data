  era: 明代
  reign_ref: 明嘉靖万历间
  archetype: 仁心济世之幼科医家
  dilemmas:
  - 幼科惊风难辨而误治丛生，当守经还是用权
  - 金石毒药镇惊速效而久服伤儿，当峻攻还是王道
  - 民间挑筋割舌陋习流行，当缄默还是直言禁绝
  lesson: 养儿当辨风土时令，守王道用药，慎护脾胃，禁绝挑筋割舌之谬，以保婴童性命
  summary_first_person: 余王大纶，目击芽儿误喂成积，误治为惊，及挑筋割舌之祸，不忍婴童枉夭，故稽圣济巢氏诸家，辨五脏变蒸三关，撰婴童类萃，立凡例九则，愿后人守经用权，以全慈幼之心
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%A9%B4%E7%AB%A5%E7%B1%BB%E8%90%83.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%A9%B4%E7%AB%A5%E7%B1%BB%E8%90%83.html
endeavors:
- id: guji-王大纶-endeavor-1
  title_zh: 编撰婴童类萃以立幼科纲纪
  summary_zh: 融合圣济总录巢氏千金诸家，论受气变蒸颅囟脉纹，成幼科入门专书
  phases:
  - key: brewing
    name: 目击芽儿误治萌编书志
    labels:
      zh: 幼科误治
    start_date: 1540-01-01
    highlight_event_id: guji-王大纶-event-practice
  - key: breakthrough
    name: 草创凡例辨风土时令
    labels:
      zh: 凡例九则
    start_date: 1555-01-01
    highlight_event_id: guji-王大纶-event-compile
  - key: climax
    name: 婴童类萃上卷告成
    labels:
      zh: 变蒸形证
    start_date: 1565-01-01
    highlight_event_id: guji-王大纶-event-compile
  - key: closure
    name: 刊传幼科以惠后学
    labels:
      zh: 刊行流传
    start_date: 1570-01-01
    highlight_event_id: guji-王大纶-event-compile
  decisions:
  - date: 1555-01-01
    title_zh: 立凡例首辨风土时令
    rationale: 北方辛热两广解毒，不因时地用药则不效，故先正其纲
  - date: 1560-01-01
    title_zh: 以王道为守毒剂为权
    rationale: 附子巴豆虽效而伤儿，故非慢惊不效不用，用则甘草佐之
- id: guji-王大纶-endeavor-2
  title_zh: 行医江浙纠正育婴陋俗
  summary_zh: 亲诊婴童，禁挑筋割舌滚地洗浴之谬，倡背肚足暖头胸凉五法
  phases:
  - key: brewing
    name: 乡间行医见挑筋之祸
    labels:
      zh: 挑筋之谬
    start_date: 1545-01-01
    highlight_event_id: guji-王大纶-event-practice
  - key: breakthrough
    name: 著论斥割舌滚地洗浴
    labels:
      zh: 慎护纠谬
    start_date: 1560-01-01
    highlight_event_id: guji-王大纶-event-practice
  - key: climax
    name: 倡调理五法择乳护持
    labels:
      zh: 调理护持
    start_date: 1568-01-01
    highlight_event_id: guji-王大纶-event-practice
  - key: closure
    name: 遗训后医以全婴童
    labels:
      zh: 仁心垂训
    start_date: 1580-01-01
    highlight_event_id: guji-王大纶-event-death
  decisions:
  - date: 1560-01-01
    title_zh: 作禁挑筋论以正视听
    rationale: 虎口三关如寸关尺不可挑，筋断纹绝则无凭治病，故力禁惑世之术
  - date: 1568-01-01
    title_zh: 定芽儿当下即下之法
    rationale: 食积胀热似惊而非惊，不下则痞块不救，小儿纯阳不畏暂下
events:
- id: guji-王大纶-event-birth
