    title_zh: 往师东垣老人李杲
    rationale: 欲求仲景汤液不传之妙，舍东垣别无真传，故受业尽学
  - date: 1240
    title_zh: 以洁古珍珠囊为宗守经达权
    rationale: 百载惟三老得长沙真意，当祖述而不泥古，方能变易治杂病
