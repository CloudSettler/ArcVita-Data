  dilemmas:
  - 旧本繁乱当从博考还是从简明以便初学
  - 师承东垣脾胃说当固守内伤还是兼通伤寒以活人
  lesson: 删繁就简以明阴阳升降，方技之书贵在功能易晓
  summary_first_person: 吾少习儒而转医学，师事东垣李公得脾胃内伤之旨，病世间本草繁乱难别，乃撰汤液本草以详气味阴阳升降，欲使初学不待参详而即悟，用药如将之抡才，去取精则存亡系之，此吾一生之志也
