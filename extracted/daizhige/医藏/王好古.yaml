    title_zh: 删繁就简另撰本草
    rationale: 陶氏日华子唐本蜀本重叠荐赘，衍义虽正而难别，故取确论附于治用之下
  - date: 1248
    title_zh: 法东垣详阴阳升降
    rationale: 药有阴阳配合升降浮沉，不明则用药无准，故于各品下分气味浓薄以明五行所禀
