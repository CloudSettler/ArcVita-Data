  birth_date: 1200-01-01
  death_date: 1264-01-01
  era: 金末元初
  reign_ref: 元世祖至元
  archetype: 医者
  dilemmas:
  - 受业张完素又私淑李杲，两家师承不同，如何融会易水与东垣之法
  - 金元鼎革旧稿散失，杜门养拙之际，如何凭记忆重缉十二卷以存医统
  lesson: 良医用药当如临阵用兵，须以成法统之，察标本轻重，守汗吐下之禁，斟酌变通而慎行
  summary_first_person: 吾赵州王好古，字进之，受业洁古老人，复从东垣李明之游，官本州教授，金末初成医垒元戎十二卷，丁酉岁被人阴取元稿，复杜门追记十得七八，统十二经伤寒杂证，以兵法喻药法，愿后人不以卤莽应仓卒
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E5%9E%92%E5%85%83%E6%88%8E.html
