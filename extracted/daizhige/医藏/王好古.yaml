endeavors:
- id: guji-王好古-endeavor-1
  title_zh: 承易水东垣之学守赵州教授之职
  summary: 受业张完素，复学于李杲，融长沙伤寒与易水东垣之法，职州庠以医教并行
  phases:
  - key: brewing
    name: 赵州从学
    labels:
      zh: 酝酿从师
    start_date: 1215-01-01
    highlight_event_id: guji-王好古-event-teacher
  - key: breakthrough
    name: 融会两家
    labels:
      zh: 突破融会
    start_date: 1225-01-01
    highlight_event_id: guji-王好古-event-professor
  - key: climax
    name: 职掌州庠
    labels:
      zh: 高峰任职
    start_date: 1240-01-01
    highlight_event_id: guji-王好古-event-professor
  - key: closure
    name: 杜门养拙
    labels:
      zh: 收束存道
    start_date: 1237-09-29
    highlight_event_id: guji-王好古-event-recompile
  decisions:
  - date: 1220-01-01
    title_zh: 既师洁古复从东垣
    rationale: 洁古为先师，东垣为时师，如同共受一经而互参，取长沙绪论而以易水之法通之
  - date: 1240-01-01
    title_zh: 居州教授不废医事
    rationale: 职在州庠而心在活人，虀盐之暇追述旧业，使医道不因鼎革而绝
- id: guji-王好古-endeavor-2
  title_zh: 撰述医垒元戎以兵法统药法
  summary: 以十二经为纲，首伤寒附杂证，录桂麻禁例与和剂变通，初成于辛卯，重缉于丁酉
  phases:
  - key: brewing
    name: 河南历患难察脉定方
    labels:
      zh: 酝酿历练
    start_date: 1228-01-01
    highlight_event_id: guji-王好古-event-first
  - key: breakthrough
    name: 辛卯初成十二卷
    labels:
      zh: 突破初成
    start_date: 1231-01-01
    highlight_event_id: guji-王好古-event-first
  - key: climax
    name: 元稿散失追记复完
    labels:
      zh: 高峰重缉
    start_date: 1237-09-29
    highlight_event_id: guji-王好古-event-recompile
  - key: closure
    name: 自序元戎传后
    labels:
      zh: 收束传世
    start_date: 1237-09-29
    highlight_event_id: guji-王好古-event-recompile
  decisions:
  - date: 1231-01-01
    title_zh: 立十二经纲统伤寒杂证
    rationale: 患多藏于细微，若无妙算深谋成法统之则倒戈败绩，故以经为纲门类品目具设
  - date: 1237-09-29
    title_zh: 散稿后凭记忆重缉
    rationale: 丁酉春稿被人阴取绝无余本，想像始终十得七八，试书首尾仅得复完，以存十万精锐之志
