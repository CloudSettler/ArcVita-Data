  decisions:
  - date: 1244
    title_zh: 不从玉石草木虫鱼分类改从十二经分类
    rationale: 欲使药品归经主病分明，临证便检，故破上中下三品旧例
  - date: 1246
    title_zh: 以伤寒剂改治杂病以汤为散丸
    rationale: 仲景本伊尹神农之法，变易百端而不越其源，故杂附金匮祖方以便权宜
