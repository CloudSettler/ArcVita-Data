endeavors:
- id: guji-王子接-endeavor-1
  title_zh: 研治仲景学立三方四制十剂之纲
  summary: 以用兵之法喻用药，辨五行生化时令虚实君臣佐使，明桂枝白虎四逆麻黄栀豉承气等为和寒温汗吐下祖方
  phases:
  - key: brewing
    name: 遍读灵素难经伤寒论
    labels:
      zh: 读周礼疾医轩岐汤液之学
    start_date: '1700'
    highlight_event_id: guji-王子接-event-weixu
  - key: breakthrough
    name: 悟方有矩法有规
    labels:
      zh: 以三方四制十剂衡百十三方
    start_date: '1725'
    highlight_event_id: guji-王子接-event-weixu
  - key: climax
    name: 标举和剂寒剂等祖方条目
    labels:
      zh: 列桂枝汤白虎汤四逆汤等为众方之祖
    start_date: '1731'
    highlight_event_id: guji-王子接-event-weixu
  decisions:
  - date: '1731'
    title_zh: 不参臆说专显古人未发之蕴
    rationale: 医之精义皆具于书，须疏通推阐而不敢别创新说
  - date: '1732'
    title_zh: 以兵法衡药法立变约之制
    rationale: 废孙吴之法不足言战，治三焦分大小处铢两分多寡以明矩法
- id: guji-王子接-endeavor-2
  title_zh: 厘为三卷成绛雪园古方选注
  summary: 上卷独明仲景百十三方三百九十七法，中下发明内外妇儿眼科杂方药性，得魏荔彤作序而刊行示来兹
  phases:
  - key: brewing
    name: 选注分类起草
    labels:
      zh: 选古方合于三方四制十剂者为之阐幽
    start_date: '1730'
    highlight_event_id: guji-王子接-event-weixu
  - key: climax
    name: 得魏荔彤季春作序
    labels:
      zh: 砭俗学示来兹以仲景功臣相期
    start_date: '1731-04-01'
    highlight_event_id: guji-王子接-event-weixu
  - key: closure
    name: 自序刊行三卷告成
    labels:
      zh: 雍正十年九月望后六日古吴自序
    start_date: '1732-10-21'
    highlight_event_id: guji-王子接-event-chengshu
  decisions:
  - date: '1731-04-01'
    title_zh: 请年家魏荔彤作序志别
    rationale: 借卓识之序明实学立言，以附古圣贤之末而传信将来
  - date: '1732-10-21'
    title_zh: 厘为上中下三卷末附杂方药性
    rationale: 上卷明仲景法度，中下广及各科，使质之古人不谬戾于疾医之旨
