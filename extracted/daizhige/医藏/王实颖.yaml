    title_zh: 以积德存仁为首义
    rationale: 博爱即仁不忍则绝生机故以回天意为种子第一法舍风水命卜之末
  - date: 1722-01-01
    title_zh: 以寡欲养气为要务
    rationale: 真精耗散则不能融结故戒酒分房少思绝色保养百日以固根本
- id: guji-王实颖-endeavor-2
  title_zh: 分治男女气血著书劝世
  summary: 分论男精女血辨五劳七损调脾胃生化之源集成五种以广嗣劝世
