  decisions:
  - date: 1724-06-01
    title_zh: 主补阴血以摄阳精
    rationale: 无子多由血少不足摄精故补脾和胃以生血忌秦桂热剂煎熬脏腑
  - date: 1730-03-01
    title_zh: 汇为五种备要刊行
    rationale: 欲使艰嗣者知回天尽人力之全功故集成心法选雌寡欲知窍疗治五种以传后
