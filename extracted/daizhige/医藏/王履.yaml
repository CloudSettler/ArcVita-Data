      raw: 明初约卒于昆山
  birth_date: 1332
  death_date: 1391
  era: 元末明初
  reign_ref: 明洪武
  archetype: 溯洄经旨之良医
  dilemmas:
  - 尊经与疑经之间如何不尽信书而得经旨
  - 守仲景法与变通温暑之治如何不混同施治
  lesson: 道在迩求诸近事在易求诸简轻轻平易方得经旨
  summary_first_person: 吾王履字安道晚号畸叟昆山人也平生好溯洄医经辨神农不必物物亲尝明亢则害承乃制之枢纽论四气所伤过时而发考仲景伤寒立法本为即病设不兼温暑欲使后人不泥必字不穿凿附会而得活法耳
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E7%BB%8F%E6%BA%AF%E6%B4%84%E9%9B%86.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E7%BB%8F%E6%BA%AF%E6%B4%84%E9%9B%86.html
endeavors:
- id: guji-王履-endeavor-1
  title_zh: 著医经溯洄集辨经旨
  summary_zh: 以溯洄为名逆流求源辨神农尝草亢则害承乃制四气所伤诸篇以正穿凿
  phases:
  - key: brewing
    name: 诵书生疑
    labels:
      zh:
      - 尽信书不如无书
    start_date: 1360
    highlight_event_id: guji-王履-event-1
  - key: breakthrough
    name: 推明亢制生化
    labels:
      zh:
      - 制则生化害则败乱
    start_date: 1375
    highlight_event_id: guji-王履-event-1
  - key: climax
    name: 辨四气过时而发
    labels:
      zh:
      - 因病逆推病原
    start_date: 1382
    highlight_event_id: guji-王履-event-2
  - key: closure
    name: 集而成编
    labels:
      zh:
      - 医经溯洄集告成
    start_date: 1388
    highlight_event_id: guji-王履-event-2
  decisions:
  - date: 1375
    title_zh: 断神农不必物物亲尝
    rationale: 生知之圣不待尝而知味可尝而气性行经不可尽尝故曰尝百草者举众而言耳
  - date: 1382
    title_zh: 以平易解四伤不作过深推求
    rationale: 四气伤人有即发过时久发消散不等惟因发动形诊昭著逆推方知其原不可预定必发何病
- id: guji-王履-endeavor-2
  title_zh: 考仲景伤寒立法为即病设
  summary_zh: 考伤寒温暑同源异类明仲景法方专为即病伤寒设以救委废太半之弊
  phases:
  - key: brewing
    name: 读仲景生疑
    labels:
      zh:
      - 求立法之意
    start_date: 1370
    highlight_event_id: guji-王履-event-3
  - key: breakthrough
    name: 分即病不即病
    labels:
      zh:
      - 即病为伤寒不即病为温暑
    start_date: 1380
    highlight_event_id: guji-王履-event-3
  - key: climax
    name: 正后人归咎委废之失
    labels:
      zh:
      - 溺井怨伯益之喻
    start_date: 1385
    highlight_event_id: guji-王履-event-3
  - key: closure
    name: 伤寒立法考成篇
    labels:
      zh:
      - 万世法存
    start_date: 1388
    highlight_event_id: guji-王履-event-3
  decisions:
  - date: 1380
    title_zh: 立即病不即病分称分治之纲
    rationale: 所受之原不殊而类殊故一以伤寒为称而施治不得相混以称混治则贻祸后人
  - date: 1385
    title_zh: 坚持仲景法方不可废
    rationale: 后人莫能越其矩度委废太半而逐简便则民生无籍故当表章立法之意使别白于世
events:
- id: guji-王履-event-birth
  title_zh: 诞生于昆山
  date: 1332
  year_of: 1332
  description_zh: 元末生于苏州昆山字安道后号畸叟
- id: guji-王履-event-1
  title_zh: 论亢则害承乃制
  date: 1375
  year_of: 1375
  description_zh: 读六微旨大论叹造化枢纽辨承为上奉防制之意正制则生化传写之误斥戴人母亢子承之谬
- id: guji-王履-event-2
  title_zh: 论四气所伤
  date: 1382
  year_of: 1382
  description_zh: 辨春伤风夏伤暑秋伤湿冬伤寒为过时而发因病逆推其原因病知原斥成无己海藏穿凿附会之说
- id: guji-王履-event-3
  title_zh: 作伤寒立法考
  date: 1388
  year_of: 1388
  description_zh: 明伤寒即病温暑不即病同源异治仲景专为即病设以正后人混治委废之失是为医经溯洄集要篇
- id: guji-王履-event-death
  title_zh: 逝世
  date: 1391
  year_of: 1391
  description_zh: 明初卒于昆山其说存于医经溯洄集中后人赖以知溯洄经旨之学
