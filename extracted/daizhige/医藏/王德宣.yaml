    highlight_event_id: guji-王德宣-event-1935
  decisions:
  - date: 1935-03
    title_zh: 以温病正宗备参考
    rationale: 校中已用沈啸谷改编温病全书为教程，须另撰辨正之稿以抒心得
  - date: 1935-08
    title_zh: 别温病瘟疫正伤寒广义
    rationale: 医学操人生杀之权，名不正言不顺，必阐气化哲理以挽狂澜
events:
- id: guji-王德宣-event-birth
  date: 1890
  title_zh: 出生
  description: 清末湘乡出生，字松如，号恬山人，生年不详约估
  year_of: 1890
- id: guji-王德宣-event-1926
  date: 1926
  title_zh: 任宁乡盐政兼军需军医
  description: 民国十五年秋识周守忠于芝城，长宁乡盐政，兼八军二十五团少校军需及同级军医，官兵民众请诊多奏奇效
  year_of: 1926
- id: guji-王德宣-event-1928
  date: 1928
  title_zh: 游江汉悬壶燕都
  description: 邀游江汉，悬壶燕都，达官显宦穷乡妇孺求诊，沉疴痼疾着手成春
  year_of: 1928
- id: guji-王德宣-event-1932
  date: 1932
  title_zh: 北平治猩红热全活甚众
  description: 民国二十一年北平猩红热流行猖獗，诸医束手，先生全活甚众，积案成帙，载誉而归
  year_of: 1932
- id: guji-王德宣-event-1935
  date: 1935-11
  title_zh: 任湖南国医专校教授著温病正宗
  description: 本年任湖南国医专科学校温病教授，搜罗古今医籍阐发奥蕴成温病正宗，周守忠十一月序，松如秋月自序
  year_of: 1935
- id: guji-王德宣-event-death
  date: 1960
  title_zh: 逝世
  description: 卒年不详，民国二十四年后逝世约估
