    highlight_event_id: guji-王德宣-event-1935
  - key: climax
    name: 穷源竟委综合成书
    labels:
      zh: 正名正宗
    start_date: 1935-08
    highlight_event_id: guji-王德宣-event-1935
  - key: closure
    name: 付梓备学生参考
    labels:
