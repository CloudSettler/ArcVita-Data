    labels:
      zh: 四方求诊
    start_date: 1927
    highlight_event_id: guji-王德宣-event-1928
  - key: climax
    name: 北平抗猩红热
    labels:
      zh: 全活甚众
    start_date: 1932
    highlight_event_id: guji-王德宣-event-1932
  - key: closure
    name: 载誉归湘
    labels:
      zh: 医名大振
    start_date: 1933
    highlight_event_id: guji-王德宣-event-1932
  decisions:
  - date: 1926
    title_zh: 兼任军需军医应诊不息
    rationale: 全部官兵与地方民众请诊户穿，须从容应接以奏奇效
  - date: 1932
    title_zh: 北平猩红热中挺身救治
    rationale: 诸医束手之际以博学深功不拘成法，全活为要
- id: guji-王德宣-endeavor-2
  title_zh: 执教国医专校与著温病正宗
  summary: 任湖南国医专科学校温病教授，感温病专书向无善本，搜罗古今阐发奥蕴，成温病正宗上下编
  phases:
  - key: brewing
    name: 承乏讲席教授温病
