    description: 叶氏临证指南语意高深且多治富贵膏粱久病重病初病贫贱者难以取法是守成法还是另辟易学之途
  - title_zh: 温邪多变恐泥人眼目
    description: 病多转变方难一定立案存案恐误学人弃之则心法不传是立方案以公同学还是恝置不录
  - title_zh: 湿温挟积虚实错杂
    description: 久病元虚又感湿温表里寒热虚实交错是急攻其邪还是先生津救液扶正达邪
  lesson: 对病书方因题立义溯脉证观变化以清轻灵变之法存津液通三焦使学人可践迹而入室
  summary_first_person: 我是王旭高字泰林无锡人久以临证治湿温温邪见长我不尚高深平淡而务清华灵变有矩多存复诊推究得失辑方案十卷以公同学愿后学观舌验神守津液而善转环
