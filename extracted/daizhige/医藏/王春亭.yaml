  summary_first_person: 余王春亭见胎产儿科呼吸生死乡僻不及延医多遭惨变故参观先贤经胎产幼诸说择至详至妥历验之法辑成六卷题曰济生集愿家置一编预防救急使产母婴儿同登寿域
