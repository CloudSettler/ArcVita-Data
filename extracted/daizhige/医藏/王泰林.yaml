    highlight_event_id: guji-王泰林-event-compile
  decisions:
  - date: 1840
    title_zh: 以伤寒类方为纲附金匮后世方
    rationale: 从流溯源使人知熔古化新之妙应变无穷
  - date: 1850
    title_zh: 作歌注而去取审慎不泥一家
    rationale: 虽宗仲圣而集仲圣以下医方之长注释明白便学人熟读精思
- id: guji-王泰林-endeavor-2
  title_zh: 苏浙行医授徒并著夜话录医案
  summary: 道咸之间享名苏浙以治案验方学临证撰西溪书屋夜话录环溪草堂医案医方歌诀串解等授门弟子惜无嗣而多散佚
