endeavors:
- id: guji-王清任-endeavor-1
  title_zh: 四十二年亲验脏腑改正古误
  description: 自疑古人脏腑论矛盾，赴义冢刑场亲视百人脏腑，考定膈膜气门津门诸形，绘亲见改正脏腑图
  phases:
  - key: brewing
    name: 立志更正脏腑
    labels:
      zh:
      - 酝酿立志
    start_date: 1788
    highlight_event_id: guji-王清任-event-birth
  - key: breakthrough
    name: 稻地镇观尸初验
    labels:
      zh:
      - 亲见突破
    start_date: 1797-04
    highlight_event_id: guji-王清任-event-daodi-guanzhi
  - key: climax
    name: 询恒公得膈膜确形绘全图
    labels:
      zh:
      - 考证高潮
    start_date: 1829-12-13
    highlight_event_id: guji-王清任-event-hengjing-zhengmo
  - key: closure
    name: 刊图记叙以示医林
    labels:
      zh:
      - 成书收束
    start_date: 1830-11
    highlight_event_id: guji-王清任-event-chengshu
  decisions:
  - date: 1797-04
    title_zh: 不避污秽晨赴义冢细视露脏
    rationale: 古人错论皆由未尝亲见，必多见为实，连视十日参看三十余人方知古图不合
  - date: 1829-12-13
    title_zh: 拜叩恒敬公细问膈膜形状
    rationale: 隔膜留心四十年未审斜正，必得镇守哈密多见诛戮者确示方能昭晰无疑
- id: guji-王清任-endeavor-2
  title_zh: 立气虚血瘀论创方著医林改错
  description: 于脏腑既明后，以血瘀气虚统杂病，创通窍活血汤血府逐瘀汤补阳还五汤诸方，上下二卷示人规矩
  phases:
  - key: brewing
    name: 以约治博审症立法
    labels:
      zh:
      - 临床积累
    start_date: 1800
    highlight_event_id: guji-王清任-event-daodi-guanzhi
  - key: breakthrough
    name: 悟半身不遂源于气亏血瘀
    labels:
      zh:
      - 立论突破
    start_date: 1825
    highlight_event_id: guji-王清任-event-hengjing-zhengmo
  - key: climax
    name: 定逐瘀补阳诸方救逆
    labels:
      zh:
      - 制方高潮
    start_date: 1830-11
    highlight_event_id: guji-王清任-event-chengshu
  - key: closure
    name: 著成上下卷刊布济世
    labels:
      zh:
      - 刊布收束
    start_date: 1830-11
    highlight_event_id: guji-王清任-event-chengshu
  decisions:
  - date: 1830-11
    title_zh: 以三方治五十种血瘀症以一方治半身不遂
    rationale: 外感内伤伤人何物必须有余不足见形状，约方统博症方由试验中来
  - date: 1830-11
    title_zh: 文义粗浅语句覆重示学者浅深互证
    rationale: 业医者学问有浅深，半身小儿六十种气亏形症必互考参观庶免谬误
events:
- id: guji-王清任-event-birth
  title_zh: 生于直隶玉田
  date: 1768
  year_of: 1768
  description: 乾隆三十三年生于直隶玉田，字勋臣
- id: guji-王清任-event-daodi-guanzhi
  title_zh: 滦州稻地镇义冢观尸验脏
  date: 1797-04
  year_of: 1797
  description: 嘉庆二年丁巳年三十，游滦州稻地镇，每晨赴义冢视瘟疹痢死群儿露脏，连视十日看全三十余人，始知古图件数形图全不相合
- id: guji-王清任-event-hengjing-zhengmo
  title_zh: 询恒敬公得膈膜确形访验四十二年成功
  date: 1829-12-13
  year_of: 1829
  description: 道光九年十二月十三夜于安定门恒宅，闻江宁布政司恒敬公镇守哈密多见逆尸知膈膜最悉，拜叩细问，脏腑昭晰绘成四十二件全图
- id: guji-王清任-event-chengshu
  title_zh: 著成医林改错上下卷刊行
  date: 1830-11
  year_of: 1830
  description: 道光庚寅孟冬书于京邸知一堂，卷上记脏腑创通窍活血血府逐瘀隔下逐瘀三方，卷下论半身不遂瘫痿抽风痘症创补阳还五诸方
- id: guji-王清任-event-death
  title_zh: 卒于道光年间
  date: 1831
  year_of: 1831
  description: 道光十一年卒，一生访验脏腑四十二年，遗书由张润坡刘必荣等序而刊布以公于世
