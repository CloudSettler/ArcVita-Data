  dilemmas:
  - 遵古经文与信亲眼所见相冲突，何去何从
  - 刊图叛经恐遭罪议，不刊则贻祸后世医者
  lesson: 亲见为实，考验四十二年始正千载脏腑之误，立法施治方能不失病本
  summary_first_person: 余玉田王清任，字勋臣，念古人脏腑图说自相矛盾，立志亲验，历稻地镇观瘟疫幼尸，历刑场验剐犯心肝，询恒敬公得膈膜确形，四十二年绘成全图，又以气虚血瘀立论，创血府逐瘀诸方，著医林改错以示后人
  source_urls:
