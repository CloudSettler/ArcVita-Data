  summary_first_person: 吾乃古越山阴王清源号馥原隐居梅溪小隐山房幼读鲁论知巫医不可无恒遂发愤于灵素内经伤寒金匮博采叔和士材天士路玉诸家尤详女科调经胎产数十年以毋自欺自励集得心应手之方为医方简义六卷以公同志愿存心济物随地见功而已
