    title_zh: 专主内经博观四子
    rationale: 内经如六经无所不备，四子如学庸语孟为阶梯，各发明一义而不可偏废
  - date: 1500-01-01
    title_zh: 集方而参以己见问答拟议
    rationale: 原方未尽变迁，须随症论气血痰郁，分别气血明白而不混淆
- id: guji-王纶-endeavor-2
  title_zh: 历官中外以医寿世
  summary_zh: 登第后历中外得人心，治疾皆验，践行良相良医之道
  phases:
  - key: brewing
    name: 秀才立言不得致君则寿世
