  date: 1502-01-01
  year_of: 1502
  place_zh: 鄞县
  description_zh: 集明医医方而参己见，论仲景东垣河间丹溪优劣，发热内外伤心腹痛产后诸篇，问答拟议本于医学纲目，刊行觉世济物
- id: guji-王纶-event-death
