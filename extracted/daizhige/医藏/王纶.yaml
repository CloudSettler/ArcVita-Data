    highlight_event_id: guji-王纶-event-death
  decisions:
  - date: 1481-01-01
    title_zh: 以医药寿斯世夭札
    rationale: 既存致君泽民之心，亦存济物之心，遇疾即治而不辞中外劳怨
  - date: 1502-01-01
    title_zh: 辞友请梓俟晚年增损
    rationale: 政余草集未成，不欲草率付梓，欲林下研覃再定，以免误人性命
events:
