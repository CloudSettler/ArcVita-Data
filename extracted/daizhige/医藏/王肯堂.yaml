  summary_first_person: 余发始燥慕范文正存心济物之志少好方书博探素难金匮甲乙以下诸家吴中自王光庵得戴元礼之秘医道大振余乃访求朱氏原本重加选择订正灵兰要览欲使证治有准后学有承不以秘帐中而以广济宇内
