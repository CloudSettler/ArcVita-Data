    title_zh: 请急归养重拾医业
    rationale: 备员史馆被口语终不振念二亲笃老善病乃复取岐黄家言肆力以尽定省全活之责
- id: guji-王肯堂-endeavor-2
  title_zh: 编撰证治准绳百二十卷成医家圭臬
  summary_zh: 先成杂病证治准绳八册分十三门附类方万历壬寅刊行后补伤寒疡医幼科女科仍以证治准绳为总名该博精详世竞传之
