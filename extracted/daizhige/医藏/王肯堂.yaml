endeavors:
- id: guji-王肯堂-endeavor-1
  person_qid: guji-王肯堂
  title_zh: 由儒入医博综经史立济世之志
  summary: 飞声翰苑而少好方书自素难金匮甲乙下逮诸子莫不精探渊奥以范文正存心济物为志转儒术为医道
  phases:
  - key: brewing
    name: 少好方书博览群经
    labels:
      zh: 博综启志
    start_date: 1560
    highlight_event_id: guji-王肯堂-event-birth
  - key: breakthrough
    name: 登进士入翰苑而不忘医
    labels:
      zh: 儒医兼修
    start_date: 1589
    highlight_event_id: guji-王肯堂-event-jinshi
  - key: climax
    name: 得吴中医派正脉究心证治
    labels:
      zh: 得承正脉
    start_date: 1595
    highlight_event_id: guji-王肯堂-event-study
  - key: closure
    name: 以医济世名重吴中
    labels:
      zh: 以医显名
    start_date: 1600
    highlight_event_id: guji-王肯堂-event-study
  decisions:
  - date: 1589
    title_zh: 不以翰苑自限兼究医经
    rationale: 以医重民生通天地阴阳之理须儒者博极方可穷其颐故兼治经史与方书
  - date: 1595
    title_zh: 宗王光庵戴元礼吴中正脉
    rationale: 见吴中自得元礼之秘再传启东诸贤医道大振故求师承原委不为卤莽无师之医
- id: guji-王肯堂-endeavor-2
  person_qid: guji-王肯堂
  title_zh: 重订灵兰要览选录证治以启后学
  summary: 鉴丹溪纂要非出丹溪手笔谬于选择乃命访求朱氏原本重订于中风疟痰喘诸门详辨虚实补泻以正时师执方之误
  phases:
  - key: brewing
    name: 病丹溪纂要谬选发重订之议
    labels:
      zh: 辨伪发愿
    start_date: 1602
    highlight_event_id: guji-王肯堂-event-study
  - key: breakthrough
    name: 访求朱氏原本斫轮游刃
    labels:
      zh: 访求原本
    start_date: 1606
    highlight_event_id: guji-王肯堂-event-compiling
  - key: climax
    name: 分门选录证治详论虚实
    labels:
      zh: 分门证治
    start_date: 1610
    highlight_event_id: guji-王肯堂-event-compiling
  - key: closure
    name: 书成刊布广济宇内
    labels:
      zh: 刊布济世
    start_date: 1612
    highlight_event_id: guji-王肯堂-event-book
  decisions:
  - date: 1606
    title_zh: 访求朱氏原本而重订
    rationale: 以现行纂要选择失当不足为法须得原本而后斫轮游刃臻妙如江海波澜山岳岭峰可为标帜
  - date: 1610
    title_zh: 详辨闭脱虚实不用执方
    rationale: 见时师以顺气疏风及南星半夏等执方治中风痰疟多致误故力主辨闭脱补真元以参术竹沥等变通治之
