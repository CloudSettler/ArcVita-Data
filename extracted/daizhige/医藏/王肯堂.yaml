  summary_first_person: 余发始燥闻范文正公愿为良医嘉靖丙寅母病阽危诸医言人人殊遂锐志学医起亡妹于垂死举乡试成进士备员史馆请急归养取岐黄家言肆力焉采取古今方论命高隐次第录之先成杂病论方各八巨袠名曰证治准绳后补伤寒疡医幼科女科以成全书愿后人因证检书得治法而勿以准绳为心目
  source_urls:
