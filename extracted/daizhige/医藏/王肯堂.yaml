  decisions:
  - date: 1590
    title_zh: 主内染外感相搏说不执胎毒一端
    rationale: 伤寒有不患再患者而痘人人免不得一出永不再出故以内伏触动外感传染立论
  - date: 1600
    title_zh: 疑似之间禁妄汗下虚实分治
    rationale: 妄汗虚表难成浆妄下虚里易倒陷须在表宜汗在里宜下补偏救弊转危为安
- id: guji-王肯堂-endeavor-2
  title_zh: 脉色药性临床考订汇编
  summary: 论望色明晦辨芤脉形考人参沙参阴阳论犀角水旱并记惊风误治以成卷中
  phases:
  - key: brewing
    name: 望色芤脉考订
    labels:
      zh:
      - 望色
      - 芤脉
    start_date: 1585
    highlight_event_id: guji-王肯堂-event-materia
  - key: breakthrough
    name: 人参沙参阴阳辨
    labels:
      zh:
      - 人参
      - 沙参
      - 补气
    start_date: 1595
    highlight_event_id: guji-王肯堂-event-materia
  - key: climax
    name: 犀角惊风论治
    labels:
      zh:
      - 犀角
      - 惊风
      - 杂记
    start_date: 1605
    highlight_event_id: guji-王肯堂-event-materia
  - key: closure
    name: 肯堂医论卷中告成
    labels:
      zh:
      - 著述
      - 医论
    start_date: 1608
    highlight_event_id: guji-王肯堂-event-materia
  decisions:
  - date: 1595
    title_zh: 用参必佐陈皮行气不杂温补
    rationale: 世人徒知参补不知壅塞不流通富贵之家杂入温补反致危殆故一钱参必加陈皮一分
  - date: 1605
    title_zh: 惊风忌妄投金石以清解安神为先
    rationale: 小儿搐掣多系热痰风郁非尽惊恐妄用附子全蝎脑麝反增他症故以导赤五苓宽气治之
events:
- id: guji-王肯堂-event-birth
  title_zh: 诞生于南直隶金坛
  date: 1549
  year_of: 1549
  description: 明嘉靖二十八年诞生于金坛王氏幼博览经史旁通医学
- id: guji-王肯堂-event-douyuan
  title_zh: 论痘疹溯源起于足太阳
  date: 1585
  year_of: 1585
  description: 考痘疹不见先秦而著于建武以后以胎毒为本疫厉为成断其自足太阳传变以欠嚏惊悸腮赤为候
- id: guji-王肯堂-event-yufang
  title_zh: 制代天宣化丸论预防
  date: 1595
  year_of: 1595
  description: 值天时不正痘疫盛发行于冬至修合以五运取君臣佐使预服凉血降火以减泄伏毒
- id: guji-王肯堂-event-hanxia
  title_zh: 论汗下虚实与惊风治法
  date: 1602
  year_of: 1602
  description: 立疑似禁妄汗下之戒以不食气促腹胀吐利为里虚以便秘喘渴谵狂为里实又斥惊风妄用金石之弊
- id: guji-王肯堂-event-materia
  title_zh: 论望色芤脉人参犀角成篇
  date: 1608
  year_of: 1608
  description: 论望色贵黄润明莹辨芤脉两头有中间无考人参补阳沙参补阴辨水犀为上并采梦溪笔谈杂记以成医论
- id: guji-王肯堂-event-death
  title_zh: 逝世
  date: 1613
  year_of: 1613
  description: 明万历四十一年逝世遗肯堂医论证治准绳等惠后学
