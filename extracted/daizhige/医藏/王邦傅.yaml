    start_date: '1780'
    highlight_event_id: guji-王邦傅-event-2
  decisions:
  - date: '1775'
    title_zh: 遵脉诀候五脏不拘上下
    rationale: 内经心疝寸口候足胫等证明不必拘上下，故心与小肠同候左寸等可法
