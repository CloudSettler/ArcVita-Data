endeavors:
- id: guji-王銮-endeavor-1
  title_zh: 研习幼科审脏腑虚实
  description: 以哑科最难为念，究钱氏五脏虚实补泻及色脉形证，参合丹溪东垣之论，奠定幼科辨证之基。
  phases:
  - key: brewing
    name: 受胎禀赋护养究心
    labels:
      zh:
      - 受胎
      - 护养
    start_date: 1505-01-01
    highlight_event_id: guji-王銮-event-study
  - key: breakthrough
    name: 五脏虚实纲领初得
    labels:
      zh:
      - 五脏
      - 虚实
    start_date: 1515-01-01
    highlight_event_id: guji-王銮-event-study
  - key: climax
    name: 色脉形证融会贯通
    labels:
      zh:
      - 色脉
      - 形证
    start_date: 1520-01-01
    highlight_event_id: guji-王銮-event-study
  - key: closure
    name: 幼科法度自成一家
    labels:
      zh:
      - 幼科
      - 法度
    start_date: 1525-01-01
    highlight_event_id: guji-王銮-event-compile
  decisions:
  - date: 1515-06-01
    title_zh: 宗钱仲阳而补其散亡
    rationale: 仲阳五脏之方深得内经之髓，门人辑录未尽本意，当参洁古刘宗浓以全生克制化之理。
  - date: 1520-06-01
    title_zh: 合色脉参诊不专切脉
    rationale: 小儿脉息未完问不能言，须望形色听声音切脉相参，方能辨寒热虚实寿夭。
- id: guji-王銮-endeavor-2
  title_zh: 编成幼科类萃刊布惠民
  description: 汇胎养乳哺胎毒护养及诸般小儿病证方论为类萃一书，经刘公白侠胡君刊刻，嘉靖十三年李濂作序而行于世。
  phases:
  - key: brewing
    name: 采集诸家方论
    labels:
      zh:
      - 采集
      - 类聚
    start_date: 1525-01-01
    highlight_event_id: guji-王銮-event-compile
  - key: breakthrough
    name: 分卷立论成书
    labels:
      zh:
      - 分卷
      - 立论
    start_date: 1528-01-01
    highlight_event_id: guji-王銮-event-compile
  - key: climax
    name: 序刊论定行世
    labels:
      zh:
      - 作序
      - 刊刻
    start_date: 1534-11-01
    highlight_event_id: guji-王銮-event-publish
  - key: closure
    name: 保婴活幼惠及一方
    labels:
      zh:
      - 保婴
      - 惠民
    start_date: 1535-01-01
    highlight_event_id: guji-王銮-event-publish
  decisions:
  - date: 1528-03-01
    title_zh: 以类相从不著名氏
    rationale: 近时医工所集诸家之说，以保婴活幼为功，不必自著姓名，但求推移变化与法相合。
  - date: 1534-11-01
    title_zh: 托中丞郡守刊布
    rationale: 得治河大中丞刘公命刊开封郡守白侠刊布宪副胡君赞助，方能广其传而济利民惠物之心。
events:
- id: guji-王銮-event-birth
  title_zh: 出生
  date: 1485-01-01
  year_of: 1485
  description: 王銮约生于明中期，禀中和之气，长而究心医学，尤专幼科哑科。
- id: guji-王銮-event-study
  title_zh: 究钱氏丹溪东垣幼科之学
  date: 1515-06-01
  year_of: 1515
  description: 研读钱仲阳五脏虚实补泻洁古子母虚实鬼贼微正之论，参丹溪胎毒乳哺东垣脾胃之说，审受胎禀赋护养之道。
- id: guji-王銮-event-compile
  title_zh: 编成幼科类萃
  date: 1528-03-01
  year_of: 1528
  description: 将论受胎妊妇禁忌下部热药护养乳哺下胎毒择乳母及五脏脉证色诊诸篇汇为类萃，分卷论小儿受胎禀赋胎毒乳哺五脏补泻之法。
- id: guji-王銮-event-publish
  title_zh: 嘉靖十三年作序刊行
  date: 1534-11-01
  year_of: 1534
  description: 治河大中丞松石刘公命开封郡守南宫白侠刊布，嵩渚李濂于嘉靖十三年甲午冬十一月朔作序，称其有保婴活幼之功。
- id: guji-王銮-event-death
  title_zh: 逝世
  date: 1550-12-31
  year_of: 1550
  description: 王銮约卒于嘉靖后期，其书流传后世，为明代幼科类书之要籍。
