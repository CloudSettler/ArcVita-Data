  - 小儿哑科难察与医者保婴之责
  - 诸家方论散杂与折中归一之难
  lesson: 保赤子者当谨胎养慎乳哺审脏腑虚实而勿妄投寒热
  summary_first_person: 吾王銮生于明中世，悯颅囟经亡而童孺多夭，遍览钱仲阳陈文中诸家幼科之说，参以丹溪东垣洁古之论，萃为幼科类萃，以期保婴活幼，惠及后人。
