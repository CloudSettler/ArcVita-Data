  - 幼科号称哑科难治与精神未漓易治之间何以抉择
  - 见小儿烧热啼哭当速用表攻与先审虚实护元气之间何以权衡
  lesson: 治幼贵先察元气浓薄虚实，不妄表妄攻，轻剂调治以全生
  summary_first_person: 余乃鱼泉王锡鑫，号亚拙，早年从事觉来先生有年，得先观元气之训，不敢自私，摘历来幼科善本切实认证之法，选当要历验之方，颜曰幼科切要，愿穷乡僻壤得见是篇，轻者不必求医，重者不为医误
  source_urls:
