    title_zh: 决意久随觉来问幼科
    rationale: 感哑科难易之辨，信小儿精神未漓易见功，欲得真传以全赤子
  - date: 1835
    title_zh: 恪守先观元气再酌方
    rationale: 见世医不审关纹浮沉概投表攻，胎婴元气微薄一误变证百出，故以护元为先
