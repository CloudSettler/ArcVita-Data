    rationale: 欲使穷乡僻壤见篇知医，轻者自调，重者不为庸医所误，终身知医
  - date: 1847
    title_zh: 应傅艾邱诸君付剞劂
    rationale: 幸遘同心倡助，先得我心之所同，冀广印布以补保赤，不负师训
