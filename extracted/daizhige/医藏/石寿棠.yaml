  birth_date: '1820'
  death_date: '1885'
  era: 清
  reign_ref: 咸丰
  archetype: 儒医济世者
  dilemmas:
  - 业医而不读书则终身由之而不知其道
  - 逐末忘原与高语内难而无实用的两歧之弊
  - 烽烟逼乡而兼顾团练保境与著书明原之责
  lesson: 明乎人身天地之原则用药轻重刚柔先后自明
  summary_first_person: 余家事医学历七世，朝儒夕医不敢忘先训，侍母疾而验方，值烽烟而办团练，于夜巡更阑汇前贤说成医原二十篇，但求无负先人以探阴阳五行人身之原
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E5%8E%9F.html
