endeavors:
- id: guji-石寿棠-endeavor-1
  title_zh: 七世家学儒医兼修
  summary_zh: 幼承父命儒医并读，朝儒夕医侍母疾而参诊剂，以孝证医探人身内景原委
  phases:
  - key: brewing
    name: 幼承庭训儒医并读
    labels:
      zh: 幼学蒙养
    start_date: '1826'
    highlight_event_id: guji-石寿棠-event-birth
  - key: breakthrough
    name: 侍疾参验颇得其效
    labels:
      zh: 侍疾悟医
    start_date: '1845'
    highlight_event_id: guji-石寿棠-event-shiji
  - key: climax
    name: 公车屡试不忘医业
    labels:
      zh: 儒医互证
    start_date: '1855'
    highlight_event_id: guji-石寿棠-event-shiji
  - key: closure
    name: 重述先子绪言汇前贤说
    labels:
      zh: 集思成原
    start_date: 1861-01
    highlight_event_id: guji-石寿棠-event-tuanlian
  decisions:
  - date: '1830'
    title_zh: 朝而儒夕而医立程课
    rationale: 业医而不读书则不知其道，为子不知医亦非孝，故数十年如一日兼修
  - date: '1845'
    title_zh: 侍母疾参以诊剂
    rationale: 母体弱多病，以亲身侍疾验方审寒热虚实，由孝入医以求实效
- id: guji-石寿棠-endeavor-2
  title_zh: 团练保境著述医原
  summary_zh: 烽烟逼乡应邀倡办团练，于夜巡稍暇四阅月成医原二十篇，明阴阳升降五行生克以寿世
  phases:
  - key: brewing
    name: 南北烽烟逼近乡里
    labels:
      zh: 时艰任事
    start_date: '1860'
    highlight_event_id: guji-石寿棠-event-tuanlian
  - key: breakthrough
    name: 夜巡人静重述医理
    labels:
      zh: 夜巡述原
    start_date: 1861-01
    highlight_event_id: guji-石寿棠-event-tuanlian
  - key: climax
    name: 四阅月成医原二十篇
    labels:
      zh: 著述明原
    start_date: 1861-03
    highlight_event_id: guji-石寿棠-event-yiyuan
  - key: closure
    name: 吴张作序付梓流传
    labels:
      zh: 付梓寿世
    start_date: 1861-06
    highlight_event_id: guji-石寿棠-event-yiyuan
  decisions:
  - date: 1860-10
    title_zh: 应邑候延请倡办团练
    rationale: 乡里危急如人身失和，需因地制宜随证立方，以医国之手保境安民
  - date: 1861-01
    title_zh: 夜巡之暇汇编医原而不言方
    rationale: 世医逐末守成方而昧于原，故先识内景营卫五行标本虚实，述药性有论无方以脱窠臼
events:
- id: guji-石寿棠-event-birth
  title_zh: 生于安东七世医学之家
  date: '1820'
  year_of: 1820
  is_circa: true
  location_zh: 安东
  description_zh: 石氏家事医学历七世，入塾略明句读即受医家言与四子书并读
- id: guji-石寿棠-event-shiji
  title_zh: 侍母疾参诊得效笃志于医
  date: '1848'
  year_of: 1848
  is_circa: true
  location_zh: 安东
  description_zh: 家慈体弱医药不离，每侍疾与医家参诊剂辄得效，自是三致意于医
- id: guji-石寿棠-event-tuanlian
  title_zh: 倡办团练夜巡著述
  date: 1861-01
  year_of: 1861
  location_zh: 涟城安东
  description_zh: 南北烽烟逼乡受邑候延请倡办团练，每夜巡稍暇人静更阑重述先子绪言汇前贤全说
- id: guji-石寿棠-event-yiyuan
  title_zh: 医原二十篇成书吴张作序
  date: 1861-06
  year_of: 1861
  location_zh: 留耕书屋
  description_zh: 凡四阅月得医原二十篇，分卷上下论人身小天地阴阳互根五行生克，咸丰十一年仲春自序夏月吴昆田张星亘作序付梓
- id: guji-石寿棠-event-death
  title_zh: 逝世
  date: '1885'
  year_of: 1885
  is_circa: true
  location_zh: 安东
  description_zh: 付梓后世业流传，光绪十七年张声驰再序称其书为原，卒年不详附系于光绪后
