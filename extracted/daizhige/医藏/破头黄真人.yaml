  - key: closure
    name: 傳針灸斷根與戒口全法
    labels:
      zh:
      - 針灸
      - 醫德
    start_date: 1710
    highlight_event_id: guji-破头黄真人-event-needle
  decisions:
  - date: 1695
    title_zh: 擇宮蘭翁姜白石付喉科秘訣
    rationale: 孤本世鮮能知非得其人不能傳必擇可付託者使心法有續
  - date: 1710
    title_zh: 傳范九思針灸男左女右灸斷喉風根
    rationale: 喉風連年復發者可灸大指本節後一寸斷根然須戒煎炒熱毒並先吹散風藥末後用針以全慎重
