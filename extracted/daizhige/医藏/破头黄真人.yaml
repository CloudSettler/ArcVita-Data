  archetype: 方外醫隱
  dilemmas:
  - 喉症危急欲奮力救人又恐不識其症妄施藥餌輕變為重之抉擇
  - 孤本罕傳欲公天下以活人又恐真法湮沒無傳之憂慮
  - 用針用藥當取則取不當取則止行陰騭與殺身之界線
  lesson: 辨內外二因明五行生克隨證化裁神聖功巧切於實用為初學入門喉科所資考
  summary_first_person: 吾不知何許人世稱破頭黃真人平生留心喉科喉科大要須辨內外二因明五行生克爰定神聖功巧四字隨證化裁又將喉風二十二症名目證治臚列傳與宮蘭翁姜白石再傳周詩諸君但願後學用心救人當取則取以全此孤本心血
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%96%89%E7%A7%91%E7%A7%98%E8%AF%80.md
