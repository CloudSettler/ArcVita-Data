  title_zh: 創立神聖功巧喉科體系
  summary: 辨外感六淫內傷飲食情志立神聖功巧四字化裁制玉華散通利散積雪膏定風針及風熱積熱痰熱虛熱辨方詳列二十二喉風
  phases:
