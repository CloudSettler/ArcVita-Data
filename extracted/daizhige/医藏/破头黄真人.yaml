  decisions:
  - date: 1682
    title_zh: 定神聖功巧四字隨證化裁
    rationale: 病有淺深虛實必究其因金克木則補肝木克土則補脾以活法御危急喉症
  - date: 1690
    title_zh: 分風熱積熱痰熱虛熱各立吹服針刺法
    rationale: 風熱屬肝膽積熱屬心三焦痰熱屬肺胃虛熱屬腎命門火不可一概吊吹針以免損津反害
- id: guji-破头黄真人-endeavor-2
  title_zh: 傳燈授徒續喉科心法
  summary: 傳授宮蘭翁姜白石周詩林杏黃春台李元禎一脈並傳范九思針灸斷根法與散風吊藥封口之法使孤本不湮沒
  phases:
  - key: brewing
    name: 授宮姜開宗傳脈
