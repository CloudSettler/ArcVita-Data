  birth_date: 1610
  death_date: 1680
  era: 清初
  reign_ref: 顺治
  archetype: 儒医静养济世者
  dilemmas:
  - 出仕守郡与弃官行医之间抉择济世之道
  - 有为导引与无为静功之间求直捷了当之旨
  lesson: 静以养心养身，仁以济己济众，医身不如医心
  summary_first_person: 吾祝登元号茹穹，清初人，尝守漳州，家至户诊，后弃五马，访道参静功，得无生子李华卿授诀，集古论验方成心医集以寿身寿世
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%BF%83%E5%8C%BB%E9%9B%86.html
endeavors:
- id: guji-祝登元-endeavor-1
  title_zh: 守漳行医弃官济世
  goal_zh: 悯沟瘠疾苦，家户诊疗，以医药践行仁者一体之学
  phases:
  - key: brewing
    name: 宦漳悯疾
    labels:
      zh: 酝酿
    start_date: 1648
    highlight_event_id: guji-祝登元-event-shouzhang
  - key: breakthrough
    name: 负囊户诊
    labels:
      zh: 突破
    start_date: 1650
    highlight_event_id: guji-祝登元-event-huzhen
  - key: climax
    name: 脱屣五马
    labels:
      zh: 高潮
    start_date: 1652
    highlight_event_id: guji-祝登元-event-qiguan
  - key: closure
    name: 游湘著验
    labels:
      zh: 收束
    start_date: 1656-08-15
    highlight_event_id: guji-祝登元-event-xuji
  decisions:
  - date: 1650
    title_zh: 郡篆在前药囊在后
    rationale: 不忍沟瘠困苦，决以亲诊遍及闾巷，视匹夫不被为己辜
  - date: 1652
    title_zh: 弃官云游
    rationale: 一身难遍天下，欲以集方纪验广布拯世，故脱屣官守而游潇水钤山
- id: guji-祝登元-endeavor-2
  title_zh: 参悟静功纂集成集
  goal_zh: 会儒释道静养之旨，辑闭息导引诸法，成心医集以传寿身寿世要道
  phases:
  - key: brewing
    name: 深林遇师
    labels:
      zh: 酝酿
    start_date: 1645
    highlight_event_id: guji-祝登元-event-yushi
  - key: breakthrough
    name: 参证诸家
    labels:
      zh: 突破
    start_date: 1650
    highlight_event_id: guji-祝登元-event-canzheng
  - key: climax
    name: 辑集静功妙药
    labels:
      zh: 高潮
    start_date: 1655
    highlight_event_id: guji-祝登元-event-jiji
  - key: closure
    name: 序行天下
    labels:
      zh: 收束
    start_date: 1656-08-15
    highlight_event_id: guji-祝登元-event-xuji
  decisions:
  - date: 1645
    title_zh: 拜授无生子坐功
    rationale: 信深林老者为高人，有夙缘，直捷了当胜于有为诸法，故下拜求教
  - date: 1655
    title_zh: 削玄存实編集刊布
    rationale: 七返九还之说易滋疑玄，闭息导引诸法多验，故去飞升蝉脱之谈，存清心寡欲养修之章
events:
- id: guji-祝登元-event-birth
  date: 1610
  year_of: 1610
  title_zh: 出生
  description_zh: 约明末生，幼习八股屡试冠军，后究心医理地理，游名山访高人
- id: guji-祝登元-event-yushi
  date: 1645
  year_of: 1645
  title_zh: 深林遇无生子授坐功
  description_zh: 入高巅深林投小草篷，遇老者授坐功，至半夜骨节俱响遍体快畅，自谓开关，后知即无生子李华卿
- id: guji-祝登元-event-shouzhang
  date: 1648
  year_of: 1648
  title_zh: 守漳州官
  description_zh: 守漳之日，痛悯沟瘠，郡篆在前，药囊在后，家至户诊
- id: guji-祝登元-event-huzhen
  date: 1650
  year_of: 1650
  title_zh: 家至户诊
  description_zh: 以济世利物为念，家至而户诊，刀圭立起痼疾，以践行天地万物一体之仁
- id: guji-祝登元-event-canzheng
  date: 1651
  year_of: 1651
  title_zh: 与葛郭冯陈参秘旨
  description_zh: 与葛屺瞻郭丹葵冯茂远陈白也相参秘旨，验闭息导引八段锦诸法，终以无生子诀为直捷
- id: guji-祝登元-event-qiguan
  date: 1652
  year_of: 1652
  title_zh: 脱屣五马云游
  description_zh: 脱屣五马无悔，游于潇水钤山之间，复寓湖南净寺得道者印证草篷即师
- id: guji-祝登元-event-jiji
  date: 1655
  year_of: 1655
  title_zh: 辑心医集静功妙药
  description_zh: 集考古名论出以心裁，辑闭息导引胎息胎食诸法，并著天文秘占地理确义，成心医集
- id: guji-祝登元-event-xuji
  date: 1656-08-15
  year_of: 1656
  title_zh: 熊文举序心医集而行
  description_zh: 顺治丙申秋七月既望，南州熊文举为心医集作序，大司马总制郎公为序以行，广布拯世
- id: guji-祝登元-event-death
  date: 1680
  year_of: 1680
  title_zh: 逝世
  description_zh: 约清康熙年间后卒，静功心医之学以集传世
