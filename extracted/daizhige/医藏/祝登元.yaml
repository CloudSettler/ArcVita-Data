person:
  qid: guji-祝登元
  name_zh: 祝登元
  names:
    zh: 祝登元
    en: Zhu Dengyuan
  lifespan:
    birth:
      date: 1610
      precision: year
      is_circa: true
      raw: 明末万历末前后约生
    death:
      date: 1680
      precision: year
      is_circa: true
