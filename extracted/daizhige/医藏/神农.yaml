events:
- id: guji-神农-event-birth
  title_zh: 诞生
  date: '-2737'
  year_of: -2737
  description: 神农生于姜水，号炎帝，肇兴农耕医药
- id: guji-神农-event-taste
  title_zh: 尝百草别药性
  date: '-2720'
  year_of: -2720
  description: 亲尝百草，一日而遇七十毒，辨其寒温甘苦，明其主治归经
- id: guji-神农-event-bencao
  title_zh: 定本草三卷三百六十五种
  date: '-2705'
  year_of: -2705
  description: 分上药百二十种为君，中药百二十种为臣，下药百二十五种为佐使，合三百六十五种法周天之度，是为神农本草经之源
- id: guji-神农-event-legacy
  title_zh: 本草为经泽被后世
  date: '-2700'
  year_of: -2700
  description: 汉书艺文志著录神农黄帝食禁，隋唐以降递相传注，孙星衍辑经，叶东卿作赞，王楚材有序，遂使神农之功不坠
- id: guji-神农-event-death
  title_zh: 逝世
  date: '-2698'
  year_of: -2698
  description: 神农崩，民怀其德，尊为药王，祀之不绝
