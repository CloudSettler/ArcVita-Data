    title_zh: 弃游猎而劝稼穑定居
    rationale: 谷食能养命而有节猎食不继且多疾故当教民树艺以安五脏
  - date: '-2718'
    title_zh: 察病之源先候病机而后用药
    rationale: 五脏未虚六腑未竭服药必活病已成可得半愈故当先察其源各随其宜
events:
- id: guji-神农-event-birth
