  date: '-2737'
  year_of: -2737
  kind: birth
  description: 传说炎帝神农生于姜水体察民瘼立志养命利民
- id: guji-神农-event-taste
  title_zh: 亲尝百草辨寒温五味
  date: '-2730'
  year_of: -2730
  kind: endeavor
  description: 遍尝草石骨肉辨酸咸甘苦辛五味寒热温凉四气及有毒无毒阴干暴干采治之法
- id: guji-神农-event-three-grades
  title_zh: 定上中下三品三百六十五种
  date: '-2720'
  year_of: -2720
  kind: endeavor
  description: 定上药一百二十种为君主养命下药一百二十种主治病中药一百二十种为臣主养性合三百六十五种以应岁
- id: guji-神农-event-farming
  title_zh: 教民稼穑始兴农事
  date: '-2724'
  year_of: -2724
  kind: endeavor
  description: 教民播种五谷制耒耜别土宜占时日使民有粒食而体渐康
- id: guji-神农-event-teach-use
  title_zh: 传君臣佐使服食之节
  date: '-2715'
  year_of: -2715
  kind: endeavor
  description: 传药有君臣佐使七情和合病在上者先食后服在下者先服后食毒药先起如黍粟病去即止之法
- id: guji-神农-event-death
  title_zh: 神农逝世
  date: '-2698'
  year_of: -2698
  kind: death
  description: 传说因尝百草遇毒而逝其法载于本草后人孙星衍等辑为神农本草经传世
