  - 以身试毒辨别百草寒温之性与保全自身性命之两难
  - 定君臣佐使三品分类以便后人施用与草石真伪陈新难辨之困
  - 教民稼穑定居养命与旧俗逐水草游猎之冲突
  lesson: 亲尝躬验以利天下立法度以传后世当不辞身险
  summary_first_person: 吾为神农见民多疾而食谷不康乃亲尝百草辨五味四气定上中下三品与君臣佐使之法又教民稼穑以养命愿后人察病之源用药有节久服不伤
