  name_zh: 秦之桢
  names:
    zh: 秦之桢
    en: Qin Zhizhen
  lifespan:
    birth:
      date: '1655'
      precision: year
      is_circa: true
      raw: 清初上海人，生年失载约估
    death:
      date: '1720'
      precision: year
      is_circa: true
      raw: 康熙后卒年失载约估
  birth_date: '1655'
  death_date: '1720'
  era: 清
  reign_ref: 康熙
  archetype: 仁医
  dilemmas:
  - 进则救民退则修己，无位可行其志，何以利济天下
  - 祖传旧稿精微难会，慎修与速传之间何以抉择
  - 外感内伤混治成弊，临症从症从脉何以立准绳
  lesson: 穷症因脉以立治，不计利而救人，述祖传而公天下
  summary_first_person: 我字皇士，上海人，少有济世志而不得位，遂研精岐黄三十年，见家伯祖景明公症因脉治旧稿，屏绝应酬潜心纂述十载，分外感内伤治之，赖施氏昆季捐资授梓，以公天下后世。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E7%97%87%E5%9B%A0%E8%84%89%E6%B2%BB.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%97%87%E5%9B%A0%E8%84%89%E6%B2%BB.html
endeavors:
- id: guji-秦之桢-endeavor-1
  title_zh: 潜心岐黄行医活人
  summary: 博通经史后转研医学，取岐黄要旨潜心三十年，临症穷本末轻重缓急，不论贫富救人，全活无算，名播四方。
  phases:
  - key: brewing
    name: 博通转医
    labels:
      zh:
      - 立志利济
      - 研精方书
    start_date: '1675'
    highlight_event_id: guji-秦之桢-event-study
  - key: breakthrough
    name: 医道甚明
    labels:
      zh:
      - 潜心三十年
      - 内省不疚
    start_date: '1685'
    highlight_event_id: guji-秦之桢-event-practice
  - key: climax
    name: 声称籍甚
    labels:
      zh:
      - 远迎求治
      - 起沉无数
    start_date: '1703'
    highlight_event_id: guji-秦之桢-event-fame
  - key: closure
    name: 退修济世
    labels:
      zh:
      - 不计利
      - 以医行志
    start_date: '1705'
    highlight_event_id: guji-秦之桢-event-fame
  decisions:
  - date: '1675'
    title_zh: 以医行志
    rationale: 无位可行其志，惟医可济人利物，遂潜心岐黄不求官
  - date: '1685'
    title_zh: 临症穷微
    rationale: 必力穷症之本末轻重缓急，期于内省不疚不精于医而精于仁
- id: guji-秦之桢-endeavor-2
  title_zh: 纂述症因脉治刊行天下
  summary: 发伯祖秦景明旧稿，参丹溪脉因证治及寓意草，屏绝应酬十载纂成，分症分因分脉分经络，施氏捐金镌刻公于世。
  phases:
  - key: brewing
    name: 得见旧稿
    labels:
      zh:
      - 家藏旧稿
      - 学浅未会
    start_date: '1675'
    highlight_event_id: guji-秦之桢-event-study
  - key: breakthrough
    name: 发愿纂述
    labels:
      zh:
      - 悟寓意草
      - 症分内外伤
    start_date: '1695'
    highlight_event_id: guji-秦之桢-event-compile
  - key: climax
    name: 书成十载
    labels:
      zh:
      - 对症用药
      - 无游移之惑
    start_date: '1703'
    highlight_event_id: guji-秦之桢-event-compile
  - key: closure
    name: 捐资授梓
    labels:
      zh:
      - 施氏刊刻
      - 公诸天下
    start_date: '1706'
    highlight_event_id: guji-秦之桢-event-publish
  decisions:
  - date: '1695'
    title_zh: 更名症因脉治
    rationale: 凭脉寻因难下手，以症为首再寻因脉治，节节可证法不谬施
  - date: '1703'
    title_zh: 分经络立法
    rationale: 先别十二经络何经主病，外感内伤各著一端，有余不足各分治法
events:
- id: guji-秦之桢-event-birth
  title_zh: 生于上海
  kind: birth
  date: '1655'
  year_of: 1655
  place_zh: 上海
  summary: 秦之桢字皇士生于上海秦氏，少博通经史，后转业医，生年失载系约估。
- id: guji-秦之桢-event-study
  title_zh: 幼见景明旧稿研医
  kind: study
  date: '1675'
  year_of: 1675
  place_zh: 上海
  summary: 幼业医见家伯祖景明公症因脉治稿，初学浅未会其趣，后读喻嘉言寓意草而悟纂述之旨。
- id: guji-秦之桢-event-practice
  title_zh: 潜心行医全活无算
  kind: practice
  date: '1685'
  year_of: 1685
  place_zh: 上海至海昌嘉禾
  summary: 潜心岐黄三十年医道甚明，终日孜孜不计利，富贵贫贱皆救，海昌去邑四百里而名如比屋。
- id: guji-秦之桢-event-fame
  title_zh: 嘉禾起沉名益洪
  kind: fame
  date: '1705'
  year_of: 1705
  place_zh: 嘉禾
  summary: 乙酉春赴嘉禾请起沉疴不计其数，四方贤士大夫闻风远迎，声益洪大。
- id: guji-秦之桢-event-compile
  title_zh: 纂成症因脉治
  kind: compile
  date: '1703'
  year_of: 1703
  place_zh: 上海
  summary: 屏绝应酬潜心纂述不十载而就，症分内外伤因分内外因脉分虚实治分经络，癸未冬书适成。
- id: guji-秦之桢-event-publish
  title_zh: 施氏捐资授梓自序
  kind: publish
  date: 1706-12-01
  year_of: 1706
  place_zh: 上海
  summary: 丙戌腊月自序成，施宇瞻及昆季葆文等捐金镌刻约五六百帙，沈宗敬查慎行作序，公于天下后世。
- id: guji-秦之桢-event-death
  title_zh: 卒于康熙后
  kind: death
  date: '1720'
  year_of: 1720
  place_zh: 上海
  summary: 书行于世后卒，卒年失载系约估，以医惠及四海九州为终。
