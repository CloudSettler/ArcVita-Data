endeavors:
- id: guji-程国彭-endeavor-1
  title_zh: 会通四家著医学心悟
  summary: 由举业转医，博览灵素难经及仲景河间东垣丹溪四家，潜心三十载，著医学心悟以教门徒
  phases:
  - key: brewing
    name: 弃儒习医潜心岐黄
    labels:
      zh: 研读灵素难经
    start_date: 1702
    highlight_event_id: guji-程国彭-event-study
  - key: breakthrough
    name: 贯穿四家折中会通
    labels:
      zh: 会通张刘李朱
    start_date: 1715
    highlight_event_id: guji-程国彭-event-study
  - key: climax
    name: 援笔成书名曰心悟
    labels:
      zh: 著书立教
    start_date: 1732-02-01
    highlight_event_id: guji-程国彭-event-book
  - key: closure
    name: 授徒付梓公之同志
    labels:
      zh: 付梓广传
    start_date: 1732-03-01
    highlight_event_id: guji-程国彭-event-publish
  decisions:
  - date: 1702
    title_zh: 舍举业专攻岐黄
    rationale: 家贫善养为务，性命攸关，非探奥窈不可轻试，故寻绎岐黄博览群言
  - date: 1732-02-01
    title_zh: 作凡例辨火辨八法
    rationale: 四子合则全分则偏，虚火实火相隔霄壤，故立子火贼火之辨及医门八法伤寒四字论以执简驭繁
- id: guji-程国彭-endeavor-2
  title_zh: 施医舍药济活贫病
  summary: 出而问世踵门无虚日，诊视不论贫富贵贱，散所得合膏散任人取携，兼言保生治未病
  phases:
  - key: brewing
    name: 出而问世踵门求治
    labels:
      zh: 细心处治
    start_date: 1712
    highlight_event_id: guji-程国彭-event-practice
  - key: breakthrough
    name: 诊视贫富咸得其济
    labels:
      zh: 审症用药必当
    start_date: 1720
    highlight_event_id: guji-程国彭-event-practice
  - key: climax
    name: 散财合膏散任人取
    labels:
      zh: 舍药济众
    start_date: 1728
    highlight_event_id: guji-程国彭-event-practice
  - key: closure
    name: 著百误歌保生四要
    labels:
      zh: 治未病保生
    start_date: 1732-02-01
    highlight_event_id: guji-程国彭-event-book
  decisions:
  - date: 1728
    title_zh: 所获即散合膏散
    rationale: 穷乡无药一服分饮亦验，膏去风毒贴肤消除，故效崔世明李庆嗣以实地济人
  - date: 1732-02-01
    title_zh: 首列百误保生人参果
    rationale: 上工治未病，弭患于未萌，故先言医病旁人药中之误及节饮慎风寒惜精神戒嗔怒以保生
events:
- id: guji-程国彭-event-birth
  title_zh: 生于天都
  date: 1682
  year_of: 1682
  description: 清康熙年间约生，名国彭，字钟龄，原字山龄，少攻举子业有声庠序，少多病而酷嗜医学
- id: guji-程国彭-event-study
  title_zh: 潜心玩索贯穿四家
  date: 1702
  year_of: 1702
  description: 以家贫善养为务，问取岐黄书寻绎往复，于张刘李朱四大家贯穿融会，昼夜追思历三十载
- id: guji-程国彭-event-practice
  title_zh: 出问世舍药济贫
  date: 1725
  year_of: 1725
  description: 出而问世踵门无虚日，远地信宿求治，诊视不论贫富贵贱，所得多合膏散任人取携投辄效
- id: guji-程国彭-event-book
  title_zh: 自序医学心悟成书
  date: 1732-02-01
  year_of: 1732
  description: 雍正十年孟春自序，名曰医学心悟以警门徒，首列医中百误歌保生四要治阴虚人参果诸篇，次及八法伤寒杂症妇人等论
- id: guji-程国彭-event-publish
  title_zh: 饶兆熊序而付梓
  date: 1732-03-01
  year_of: 1732
  description: 同学饶兆熊序于天宁禅院，称其洞见肺腑实地济人，从游者众，付之剞劂以公同志
- id: guji-程国彭-event-death
  title_zh: 约卒于乾隆年间
  date: 1750
  year_of: 1750
  description: 书成之后以拯救苍生为任，传道授徒，约卒于乾隆初年，遗书盛行于世
