  archetype: 儒医济世者
  dilemmas:
  - 攻举子业有声庠序，家贫养亲而转攻岐黄，弃儒就医是否为背正途
  - 张刘李朱四家各执一偏，攻补寒温轻重失宜，如何会通而不落门户
  lesson: 医贵专一沉潜，会通四家以适其用，存仁慈之心，治未病以拯苍生
  summary_first_person: 吾程国彭，字钟龄，原字山龄，号天都普明子，少攻举子业，因家贫养亲而转攻岐黄，酷嗜医学潜心玩索三十载，贯穿张刘李朱四家，折中以适其用，著医学心悟以教门徒，散所得合膏散以济贫病，惟愿以仁术拯救苍生，永杜夭札咸登仁寿
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E5%8C%BB%E5%AD%A6%E5%BF%83%E6%82%9F.md
