  summary_first_person: 吾乃武当淮河派第二十二代传人程定远，辑跌打紫金丹十宝丹红宝丹追风膏跌打汤骨折三期洗方夹板诸法，愿以丹丸膏散救跌打劳损骨折脱臼之苦，传之后世不使失传
