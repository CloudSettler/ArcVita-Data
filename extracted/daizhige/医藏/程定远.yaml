    title_zh: 紫金丹研极细末以凡士林调敷
    rationale: 为使消肿镇痛接骨而不伤皮肉，依新老伤损以麻油白糖蛋清酒糟米醋相救
  - date: 1988-01-01
    title_zh: 红宝丹配十宝服食并严限过量
    rationale: 红宝破淤散结力峻，过量则眩呕龈肿抽搐，故定解毒汤为备并戒毋过量
