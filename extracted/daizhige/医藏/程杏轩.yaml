  - date: 1826-03
    title_zh: 首载经语以示尊经
    rationale: 溯源灵素难经仲景，采菁华遗糟粕，归于治病于未病之先以全十全为上
events:
- id: guji-程杏轩-event-birth
  date: '1772'
  year_of: 1772
  title_zh: 生于歙县岩镇
  summary: 约乾隆间生于古歙，名文囿号观泉，弱冠即究心医道
- id: guji-程杏轩-event-liang
  date: 1807-05
  year_of: 1807
  title_zh: 客游大梁治疾取效
  summary: 嘉庆丁卯客游大梁，为使院病者进刀圭应手辄效，吴赓枚目击其能
- id: guji-程杏轩-event-ill
  date: '1818'
  year_of: 1818
  title_zh: 再至紫阳抱病示编
  summary: 己巳晤于新安，九年后再来紫阳果病，手一编示人惧病者多而治者误欲备临证参考
- id: guji-程杏轩-event-compile
  date: 1826-03
  year_of: 1826
  title_zh: 医述十六卷告成自序
  summary: 道光丙戌季春自序于古歙，首溯源次伤寒杂证女科幼科痘疹方药，共十六卷一百余门
- id: guji-程杏轩-event-praise
  date: 1827-12
  year_of: 1827
  title_zh: 朱钟等序推为宝筏
  summary: 道光丁亥朱钟得读医述诗钞医案，称其远绍旁搜博而能约足为后学津梁
- id: guji-程杏轩-event-death
  date: '1832'
  year_of: 1832
  title_zh: 道光后卒于乡
  summary: 成书后以仁心仁术活世寿世，道光后卒，光绪间徽医重刊其书流传益广
