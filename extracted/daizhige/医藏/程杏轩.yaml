endeavors:
- id: guji-程杏轩-endeavor-1
  title_zh: 岩镇业医集案成书
  summary: 自乾隆乙巳始至岩镇谭医，以得心应手之案日积月累，得鲍觉生江晋三等劝促，至嘉庆甲子编成初集付梓
  phases:
  - key: brewing
    name: 初至岩镇临证积累
    labels:
      zh: 岩镇起步
    start_date: 1785-06-01
    highlight_event_id: guji-程杏轩-event-xushi
  - key: breakthrough
    name: 疑难起死腾誉千里
    labels:
      zh: 声名渐著
    start_date: 1799-03-01
    highlight_event_id: guji-程杏轩-event-baojuesheng
  - key: climax
    name: 删存成编自序付梓
    labels:
      zh: 集案成书
    start_date: 1804-12-15
    highlight_event_id: guji-程杏轩-event-chengshu
  - key: closure
    name: 序跋并传请正高明
    labels:
      zh: 刊行问世
    start_date: 1805-05-01
    highlight_event_id: guji-程杏轩-event-chengshu
  decisions:
  - date: 1785-06-02
    title_zh: 录存应手之案以自验
    rationale: 凡应手之处录而存之，可以验学力浅深，不敢步薛立斋喻嘉言后尘而但道得心应手
  - date: 1804-12-15
    title_zh: 徇友请付剞劂刊行
    rationale: 所存之案日益多，太史鲍觉生称善，友人江晋三促梓，聊录一二以求海内君子进而教之
- id: guji-程杏轩-endeavor-2
  title_zh: 辨治产后感邪与内伤杂病
  summary: 主张以古为师间出新意，不执丹溪产后大补之常，审脉察舌辨阴阳寒热，重用清下养阴与补益心脾，救治产后郁热郁伤中脏等危殆
  phases:
  - key: brewing
    name: 产后感邪试方辨阴阳
    labels:
      zh: 辨证试法
    start_date: 1785-06-01
    highlight_event_id: guji-程杏轩-event-xushi
  - key: breakthrough
    name: 热深厥深釜底抽薪
    labels:
      zh: 重剂清下
    start_date: 1785-06-03
    highlight_event_id: guji-程杏轩-event-xushi
  - key: climax
    name: 郁伤心脾喜胜忧瘥
    labels:
      zh: 内伤调治
    start_date: 1799-03-01
    highlight_event_id: guji-程杏轩-event-baojuesheng
  - key: closure
    name: 中脏五绝扶元再生
    labels:
      zh: 危证回生
    start_date: 1800-06-01
    highlight_event_id: guji-程杏轩-event-baojuesheng
  decisions:
  - date: 1785-06-03
    title_zh: 产后郁热用白虎玉烛散下之
    rationale: 脉弦数舌苔黄转黑而润滑，非阴证焦干，乃邪无出路郁而为热，有故无殒，当扬汤不如抽薪
  - date: 1799-04-01
    title_zh: 郁伤类噎守逍遥归脾佐静养
    rationale: 病关情志心脾受伤，脾不能为胃行津液，内伤日久无速效，当内观静养兼喜能胜忧，不徒恃药力
events:
- id: guji-程杏轩-event-birth
  date: 1750-01-01
  year_of: 1750
  title_zh: 出生新安
  description: 清乾隆初年约生于新安，名文囿，号杏轩，性颖悟工诗，后隐于医
- id: guji-程杏轩-event-xushi
  date: 1785-06-01
  year_of: 1785
  title_zh: 治许静亭翁夫人产后感邪
  description: 乾隆乙巳仲夏岩镇首案，产后十二朝感邪郁热，先与柴胡饮试之，后用白虎汤加芩连及玉烛散下黑矢数枚，再以玉女煎调养经月而愈，遂开岩镇谭医之始
- id: guji-程杏轩-event-baojuesheng
  date: 1799-03-01
  year_of: 1799
  title_zh: 治鲍觉生郁伤心脾类噎隔
  description: 鲍宫詹未第游昆陵幕时郁伤心脾，通宵不寐食阻便干，仿逍遥归脾出入服百剂兼僧斋静养，因弄璋喜胜忧而瘳，更号觉生以庆殆而复生
- id: guji-程杏轩-event-chengshu
  date: 1804-12-15
  year_of: 1804
  title_zh: 自序医案初集成书
  description: 岁在甲子嘉平月既望自序，述以古为师间出新意，郑重不苟录存应手之案，刘权之鲍桂星程国仁等为序，嘉庆十年刊行
- id: guji-程杏轩-event-death
  date: 1815-01-01
  year_of: 1815
  title_zh: 逝世
  description: 嘉庆末年后约卒，行医岩镇徽地，遗程杏轩医案初集传世
