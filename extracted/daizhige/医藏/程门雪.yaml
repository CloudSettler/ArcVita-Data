  death_date: 1972-01-01
  era: 近现代
  reign_ref: 民国至中华人民共和国
  archetype: 经方医家
  dilemmas:
  - 泥于脏腑经络与但标病位之间何去何从
  - 固守仲景经方与融汇时疫温病之间如何权衡
  - 虚寒急证当温阳存阳与伏热实证当急下存阴之间如何明辨
  lesson: 辨病位以统脉证，合学识经验以通经旨，不拘泥亦不穿凿，设六经以赅众病
  summary_first_person: 余究心伤寒，谓素问六经是一病共具之六经，仲景六经是异病分部之六经，设六经以尽赅众病，辨表里寒热虚实而施桂麻柴承理中四逆诸法，愿后学朗若观星明如印月
  source_urls:
  - https://daizhige.org/医藏/伤寒辨要笺记.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/伤寒辨要笺记.md
endeavors:
- id: guji-程门雪-endeavor-1
  title_zh: 六经病位辨正
  summary_zh: 会通东瀛诸家六经考，辨素问经络与仲景病位之同异，立异病分部之说
  phases:
  - key: brewing
    name: 博览东瀛六经考
    labels:
      zh: 研读
    start_date: 1930-01-01
    highlight_event_id: guji-程门雪-event-liujing
  - key: breakthrough
    name: 拈出后条辨数语为纲
    labels:
      zh: 立论
    start_date: 1932-01-01
    highlight_event_id: guji-程门雪-event-liujing
  - key: climax
    name: 断六经借标病位而兼合脏腑
    labels:
      zh: 辨正
    start_date: 1934-01-01
    highlight_event_id: guji-程门雪-event-bianyao
  - key: closure
    name: 录浅田山田诸说以备考
    labels:
      zh: 成篇
    start_date: 1936-01-01
    highlight_event_id: guji-程门雪-event-bianyao
  decisions:
  - date: 1932-01-01
    title_zh: 不尽废脏腑经络亦不拘泥
    rationale: 六经病证与素问主病合者十九，当谓不必拘拘于脏腑经络则可，谓必不关脏腑则大谬
  - date: 1934-01-01
    title_zh: 宗程应旄异病分部之说
    rationale: 素问是因热病而原及六经，仲景是设六经以尽赅众病，一以贯之则同异了然
- id: guji-程门雪-endeavor-2
  title_zh: 三阴三阳分证施治
  summary_zh: 分辨太阳阳明少阳太阴少阴厥阴合病并病，定桂麻柴承理中四逆白通诸方正对之治
  phases:
  - key: brewing
    name: 遍记太阳篇方治得失
    labels:
      zh: 整理
    start_date: 1932-01-01
    highlight_event_id: guji-程门雪-event-liujing
  - key: breakthrough
    name: 明大小青龙大小柴胡大小承气为三阳大小邪主方
    labels:
      zh: 提纲
    start_date: 1934-01-01
    highlight_event_id: guji-程门雪-event-bianyao
  - key: climax
    name: 析少阴寒热虚闭与厥阴阴尽阳生之机
    labels:
      zh: 辨治
    start_date: 1935-01-01
    highlight_event_id: guji-程门雪-event-bianyao
  - key: closure
    name: 撰成伤寒辨要笺记示学
    labels:
      zh: 著述
    start_date: 1936-01-01
    highlight_event_id: guji-程门雪-event-bianyao
  decisions:
  - date: 1934-01-01
    title_zh: 太阳正病重在大青龙传证
    rationale: 麻黄外证而内见烦躁颇欲吐脉数急为传，来势鸱张当识正病副候之别
  - date: 1935-01-01
    title_zh: 少阴分寒闭虚寒急下存阴三途
    rationale: 白通治寒闭无脉，四逆治虚寒脉微欲绝，大承气治少阴伏热自利清水心下痛，不可混同
  - date: 1935-06-01
    title_zh: 厥阴重在物极必反阴变阳
    rationale: 先热后厥先厥后热当察厥热进退，热化则向愈，寒化则归少阴，不立空名而务实用
events:
- id: guji-程门雪-event-birth
  title_zh: 出生于江苏无锡
  date: 1908-01-01
  year_of: 1908
  place_zh: 江苏无锡
  description_zh: 程相字门雪，诞生于无锡，少习儒而究心医道
- id: guji-程门雪-event-liujing
  title_zh: 汇考东瀛六经病位诸说
  date: 1932-01-01
  year_of: 1932
  description_zh: 征引徐洄溪物茂仰贺屋恭藤本廉吉益猷浅田宗伯山田正珍诸家六经考，辨三阴三阳但假以分表里部位配脉证为统名之得失
- id: guji-程门雪-event-bianyao
  title_zh: 撰成伤寒辨要笺记
  date: 1936-01-01
  year_of: 1936
  description_zh: 次第辨六经太阳阳明少阳太阴少阴厥阴及合病并病，详大小青龙柴胡承气理中四逆白通乌梅諸方，发明正病副候缓下急下之例
- id: guji-程门雪-event-death
  title_zh: 逝世
  date: 1972-01-01
  year_of: 1972
  description_zh: 一代经方大家谢世，伤寒辨要笺记流传于世为后学所宗
