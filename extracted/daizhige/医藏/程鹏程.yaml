endeavors:
- id: guji-程鹏程-endeavor-1
  title_zh: 搜采经验方汇纂急救广生集
  summary: 数十年搜采内外治法得三千余方删去内治汤饮独存外治简便方一千五百余方分门别类益以慎疾法语为十卷
  phases:
