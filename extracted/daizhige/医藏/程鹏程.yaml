    labels:
      zh: 广传
    start_date: '1803-03-01'
    highlight_event_id: guji-程鹏程-event-publishing
  - key: closure
    name: 嘱好善君子翻刻补遗
    labels:
      zh: 补遗
    start_date: '1803-03-01'
    highlight_event_id: guji-程鹏程-event-publishing
  decisions:
  - date: '1803-03-01'
    title_zh: 付梓印布以备昏夜仓猝
    rationale: 穷乡僻壤病发昏夜延医不及展阅是编对症用药立能起死回生故不惮刊刻以广流传
  - date: '1803-03-01'
    title_zh: 邀同人钞授家藏简便方
    rationale: 一人搜罗有限古今丹方罄竹难尽愿得家藏易奏功之方续入补遗以全救苦婆心
