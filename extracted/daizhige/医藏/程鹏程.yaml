  dilemmas:
  - 内治汤饮一匕入口设不中病挽回无及当去当留难以决断
  - 脉理精微寒热虚实毫厘千里浅学之人貌为诊视颇多误事如何便民济世
  - 家业举制医药书不全备借阅录方即还不及覆核纰缪恐贻害于人
  lesson: 医人之身须先医己之心外治简便对证明白显易亦可起死回生广济穷乡僻壤
  summary_first_person: 我通清伏处匡庐躬逢盛世素不知医而心契经验丹方搜采数十年得三千余方删内治而存外治一千五百余方分门别类为十卷又刊劝戒类钞以警世但愿家国天下共臻仁寿
