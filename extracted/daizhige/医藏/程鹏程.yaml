    labels:
      zh: 搜采
    start_date: '1775'
    highlight_event_id: guji-程鹏程-event-collecting
  - key: breakthrough
    name: 删繁就简定外治之宗
    labels:
      zh: 取舍
    start_date: '1800'
    highlight_event_id: guji-程鹏程-event-collecting
  - key: closure
    name: 分门别类成十卷之编
    labels:
      zh: 成编
    start_date: '1803-03-01'
    highlight_event_id: guji-程鹏程-event-publishing
  decisions:
  - date: '1800'
    title_zh: 删去内治汤饮只存外治
    rationale: 内治一匕入口不中则挽回无及外治按证用方效捷而不效洗去尚无大害故专录外治以便仓猝
  - date: '1802'
    title_zh: 只录简便寻常日用之药
    rationale: 原为救急而设贵重浩繁之方贫家难购猝难办故概置不载以便穷乡僻壤对症用药
- id: guji-程鹏程-endeavor-2
  title_zh: 刊刻劝戒类钞广传济世
  summary: 先刊劝戒类钞以警聋觉次付广生集于剞劂印布流通劝人先医己心有力施药饵无力劝同人由近及远济天下
  phases:
  - key: brewing
    name: 同胞吾与刊劝戒类钞
    labels:
      zh: 劝善
    start_date: '1800'
