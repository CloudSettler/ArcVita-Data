person:
  qid: guji-穴道秘书
  name_zh: 穴道秘书
  names:
    zh: 穴道秘书
    en: Xuedao Mishu
  lifespan:
    birth:
      date: 1850-01-01
      precision: year
      is_circa: true
      raw: 清代民间抄本传人，生年不详
    death:
      date: 1900-01-01
      precision: year
      is_circa: true
      raw: 卒年不详
  birth_date: 1850-01-01
  death_date: 1900-01-01
  era: 清代
  archetype: 武医传人
  dilemmas:
  - 秘技可救人亦可伤人，传好人则济世，传歹人则祸害，当传与不传
  - 点穴手法百发百中，遇恶人相侵，忍让还是出手，恐伤人命折寿
  lesson: 医武同源，存善念多谋，慎用生死之术，方能济世而不祸世
  summary_first_person: 我承先师 affirm生死血道之诀，得杨成博点脉秘书，习三尖手法，明四季时辰与七十二穴，立誓不妄伤人命，以看症口诀四季方药救治跌打损伤，著此穴道秘书以传后世好人
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E7%A9%B4%E9%81%93%E7%A7%98%E4%B9%A6.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%A9%B4%E9%81%93%E7%A7%98%E4%B9%A6.html
endeavors:
- id: guji-穴道秘书-endeavor-1
  title_zh: 传承生死血道与三尖点穴
  description: 承先师付托，习杨成博点脉秘书，明四季十二时辰，练虎尖掌尖肩尖，识七十二穴
  phases:
  - key: brewing
    name: 习四季时辰与血道流注
    labels:
      zh:
      - 习艺
      - 明时
    start_date: 1865-01-01
    highlight_event_id: guji-穴道秘书-event-1
  - key: breakthrough
    name: 练成三尖手法识七十二穴
    labels:
      zh:
      - 突破
      - 识穴
    start_date: 1868-01-01
    highlight_event_id: guji-穴道秘书-event-1
  - key: climax
    name: 立誓慎用不妄伤人命
    labels:
      zh:
      - 立誓
      - 守善
    start_date: 1870-01-01
    highlight_event_id: guji-穴道秘书-event-1
  decisions:
  - date: 1870-01-01
    title_zh: 立誓非伤心之事不用点穴
    rationale: 遵先师叮嘱时存善念，恐强取不成功反折寿，故不妄出手
  - date: 1871-03-01
    title_zh: 遇恶人忍让非不得已不出手
    rationale: 出外偶遇恶人能忍则忍，子午须分明，以免祸害无辜
- id: guji-穴道秘书-endeavor-2
  title_zh: 著书济世传看症方药
  description: 总结看症口诀四季用药与跌打方剂，著穴道秘书，戒传歹人，专救好人
  phases:
  - key: brewing
    name: 总结看症三关与吹鼻回生
    labels:
      zh:
      - 总结
      - 看症
    start_date: 1875-01-01
    highlight_event_id: guji-穴道秘书-event-2
  - key: breakthrough
    name: 配定十二时血道十二方
    labels:
      zh:
      - 配药
      - 济世
    start_date: 1878-01-01
    highlight_event_id: guji-穴道秘书-event-2
  - key: closure
    name: 著成秘书戒传歹人
    labels:
      zh:
      - 著书
      - 戒传
    start_date: 1882-01-01
    highlight_event_id: guji-穴道秘书-event-2
  decisions:
  - date: 1880-06-01
    title_zh: 详录七香跌打丸回生丹以救跌打
    rationale: 见跌打损伤垂危者多，故录三十八味丸散洗方，使轻重皆可全愈
  - date: 1882-08-01
    title_zh: 书明只传好人不传歹人
    rationale: 此书可按部医人，亦可伤人，故嘱好人得之济世，歹人得之祸害，切不可乱传
