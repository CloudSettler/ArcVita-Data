    highlight_event_id: guji-窦材-event-quzhou
  decisions:
  - date: '1120'
    title_zh: 弃小技而师关中老医
    rationale: 自知所学非岐黄正派只能调小疾不能起大病故追随三年求正法
  - date: '1140'
    title_zh: 专主扶阳灸艾丹附
    rationale: 真气壮则人强真气脱则人死故以灼艾补接真气以丹附保元阳禁寒凉转下
- id: guji-窦材-endeavor-2
  title_zh: 集成扁鹊心书奏进颁行天下
  summary: 恐身填沟壑书失传遂集四十余年治验成书奏玉帝进朝廷愿颁行天下以救君亲济斯民
  phases:
