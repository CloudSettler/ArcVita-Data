    highlight_event_id: guji-窦材-event-quzhou
  - key: climax
    name: 集成医流正道成书
    labels:
      zh: 明经络识扶阳戒寒凉
    start_date: '1146'
    highlight_event_id: guji-窦材-event-writing
  - key: closure
    name: 奏表进书愿广其传
    labels:
      zh: 刊刻流传救万世夭枉
    start_date: '1146'
    highlight_event_id: guji-窦材-event-writing
  decisions:
  - date: '1146'
    title_zh: 不敢自私刊刻流传
    rationale: 恐遭天谴且虑身后失传故奏启上帝进表朝廷以求颁行天下
  - date: '1146'
    title_zh: 立重誓以质上帝
    rationale: 若一言不实甘受天殃若果益后世愿神天护佑广传以明救世婆心
