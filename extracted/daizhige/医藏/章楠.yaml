    start_date: 1833
    highlight_event_id: guji-章楠-event-lingsujiezhu
  - key: closure
    name: 道光甲午孟春自序
    labels:
      zh:
      - 类编
      - 自序
    start_date: 1834-02-01
    highlight_event_id: guji-章楠-event-lingsujiezhu
  decisions:
  - date: 1833
    title_zh: 决意节取分类以便学人
    rationale: 全经辞简义广管窥各异故就管中所见分门注明以明义理
  - date: 1834-02-01
    title_zh: 谨序付梓以俟高明
    rationale: 经旨渊玄恐未尽当故标旧注之名而不没其善以求赐教
