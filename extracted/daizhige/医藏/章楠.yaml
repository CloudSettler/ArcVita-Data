    highlight_event_id: guji-章楠-event-yimenbanghe
  decisions:
  - date: 1825
    title_zh: 决意著书警世
    rationale: 不忍见性命付诸庸手故直斥不仁之实以挽颓风
- id: guji-章楠-endeavor-2
  title_zh: 节注灵素类编以明经体
  summary_zh: 残息苟延而节取灵素要妙之文注解分类，分八门以示学人必读
