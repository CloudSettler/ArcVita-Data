  - 守仲景古法与因时因地变通之辨
  - 江南多湿热内虚而世尚温补燥剂之误
  lesson: 师仲景之意而不泥其法，因时因地寒凉清养以全人
  summary_first_person: 余不事王侯，幽栖自遂以保天年，搜辑医方精求药道以存利济，随试效而藏之，好事者传抄获验，遂增益群方至四百余品，详其修事，又增伤寒温病时疫治法，冀穷乡舟次按方施治以瘳疾苦
