    highlight_event_id: guji-缪希雍-event-preface
  decisions:
  - date: '1620'
    title_zh: 兼采本草详修事
    rationale: 穷乡僻邑乏明医，必详药性修事方能按方取验
  - date: '1622-12-15'
    title_zh: 自序明师意变法之义
    rationale: 千余年风气浇人物脆南北地殊，故师仲景意而损益其方以从时地
- id: guji-缪希雍-endeavor-2
  title_zh: 精辨江南中风伤寒活人
  goal_zh: 以清养寒凉救内热暗风温疫
  phases:
  - key: brewing
    name: 精求药道试效
    labels:
      zh: 搜辑医方随试随藏
    start_date: '1570'
    highlight_event_id: guji-缪希雍-event-compilation
  - key: breakthrough
    name: 别真假中风内外风
    labels:
      zh: 江南无刚猛风多湿热生痰
    start_date: '1621'
    highlight_event_id: guji-缪希雍-event-cure-zhu
  - key: climax
    name: 神医之名大显
    labels:
      zh: 苏子五钱立止膈病
    start_date: '1621'
    highlight_event_id: guji-缪希雍-event-cure-zhu
  - key: closure
    name: 以法垂训后医
    labels:
      zh: 熟读仲景即秘法戒妄汗下
    start_date: '1622-12-15'
    highlight_event_id: guji-缪希雍-event-preface
  decisions:
  - date: '1621'
    title_zh: 治膈病用苏子而不执成方
    rationale: 内热生风痰壅气道，当清热顺气开痰养阴，最忌风燥之剂
  - date: '1622'
    title_zh: 温病用竹叶石膏而不用葛根升散
    rationale: 阳明气逆呕渴热炽，石膏辛解肌镇坠下痰热，半夏温燥有毒非宜且呕家忌甘
events:
- id: guji-缪希雍-event-birth
  title_zh: 出生常熟字仲醇
  date: '1546'
  year_of: 1546
  place_zh: 常熟
  summary_zh: 明嘉靖二十五年生于常熟，精于医理，后以神医名
- id: guji-缪希雍-event-compilation
  title_zh: 丁元荐集先醒斋笔记梓行
  date: '1615'
  year_of: 1615
  place_zh: 长兴岩邑
  summary_zh: 长兴丁元荐取所用之方裒为一编命曰先醒斋笔记梓行，板留岩邑未便流通
- id: guji-缪希雍-event-expansion
  title_zh: 增益群方本草至四百余品
  date: '1620'
  year_of: 1620
  place_zh: 金沙
  summary_zh: 旅泊金沙与庄敛之过从，增益群方兼采本草常用药详其修事
- id: guji-缪希雍-event-cure-zhu
  title_zh: 天启辛酉治朱国祯膈病
  date: '1621'
  year_of: 1621
  place_zh: 京师
  summary_zh: 朱国祯患膈病上下如分两截中痛甚，用苏子五钱即止，足见其技之工
- id: guji-缪希雍-event-preface
  title_zh: 天启壬戌自序广笔记
  date: '1622-12-15'
  year_of: 1622
  place_zh: 金沙
  summary_zh: 天启二年仲冬既望自序，增入伤寒温病时疫治法，属庄季镂板流行以补于世
- id: guji-缪希雍-event-death
  title_zh: 逝世
  date: '1627'
  year_of: 1627
  place_zh: 常熟
  summary_zh: 明天启七年卒，与张介宾同时，一守法度尚温补，一善变化颇用寒凉各有所得
