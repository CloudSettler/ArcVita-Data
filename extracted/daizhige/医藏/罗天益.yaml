  reign_ref: 元世祖至元
  archetype: 仁医传道者
  dilemmas:
  - 师法与己意如何相济而不悖经旨
  - 攻补升降如何随证施治而不伐天和
  lesson: 参两间会一身，辨误择方纪验，守正传以济后学
  summary_first_person: 我幼承父训值危时而业方技，亲炙东垣十余年尽得其妙，集为卫生宝鉴，辨世误择精方纪实验，愿后人奉生而不伐天和
  source_urls:
  - https://daizhige.org/醫藏/衛生寶鑑.html
endeavors:
- id: guji-罗天益-endeavor-1
  title_zh: 亲炙东垣尽传其学
  summary: 谨修薄礼谒李杲，祁寒盛暑不少辍，十数年尽传私淑不传之妙
  phases:
  - key: brewing
    name: 幼承父训志求良师
    labels:
      zh: 求师立志
    start_date: '1225'
    highlight_event_id: guji-罗天益-event-apprentice
  - key: breakthrough
    name: 谒东垣得许列门墙
    labels:
      zh: 服劳亲炙
    start_date: '1240'
    highlight_event_id: guji-罗天益-event-apprentice
  - key: climax
    name: 真积力久会一身之理
    labels:
      zh: 参悟阴阳
    start_date: '1250'
    highlight_event_id: guji-罗天益-event-apprentice
  - key: closure
    name: 审药如敌升堂入室
    labels:
      zh: 尽得正传
    start_date: '1255'
    highlight_event_id: guji-罗天益-event-apprentice
  decisions:
  - date: '1240-03-01'
    title_zh: 谨启投师东垣
    rationale: 恐贻庸医之讥，常切求师之志，愿闻昧昧之思以尽性命之学
  - date: '1250-06-01'
    title_zh: 守东垣法参以己验
    rationale: 推穷所受根源，审药为攻，必取其效，不执一偏
- id: guji-罗天益-endeavor-2
  title_zh: 撰述卫生宝鉴垂训后世
  summary: 集辨误择方纪验为一书，采摭李氏精确间括己意，凡二十四卷补遗一卷
  phases:
  - key: brewing
    name: 惧二君之传久而泯没
    labels:
      zh: 发心集录
    start_date: '1270'
    highlight_event_id: guji-罗天益-event-book
  - key: breakthrough
    name: 辨春服宣药无病服药之误
    labels:
      zh: 辨误立论
    start_date: '1275'
    highlight_event_id: guji-罗天益-event-book
  - key: climax
    name: 铨次药误永鉴名方类集药类法象医验纪述
    labels:
      zh: 择方纪验
    start_date: '1281'
    highlight_event_id: guji-罗天益-event-book
  - key: closure
    name: 题名卫生宝鉴请序刊传
    labels:
      zh: 成书垂后
    start_date: '1283'
    highlight_event_id: guji-罗天益-event-book
  decisions:
  - date: '1275-02-01'
    title_zh: 以辨误首正世医差缪
    rationale: 世传宣药伐天和损脾胃，古方名实乖缪，故明其理之所自
  - date: '1281-12-22'
    title_zh: 合四部为卫生宝鉴
    rationale: 使临用如鉴之虚明，物来而应，无纤毫之差，冀后世必然之用
