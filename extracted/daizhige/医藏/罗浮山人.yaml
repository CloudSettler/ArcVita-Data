  birth_date: 1580-01-01
  death_date: 1650-01-01
  era: 明
  reign_ref: 明末
  archetype: 隐逸医家
  dilemmas:
  - 明理与执方之辨，恐后学以方论医失之浅
  - 全方与捷法之择，为僻壤穷乡持危济急故只志捷法
  - 取酬与施济之义，愿公诸海内毫不取酬
  lesson: 医期明理不贵执方，详注虚实寒热以济僻壤穷乡之急
  summary_first_person: 吾隐于罗浮，见僻壤穷乡仓卒无医，遂采古本师传，参互济人自济之说，增订为文堂集验方，只记捷法不列全方，详注虚实寒热，愿公诸海内不取酬，以持危济急
  source_urls:
