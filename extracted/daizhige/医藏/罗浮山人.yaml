endeavors:
- id: guji-罗浮山人-endeavor-1
  title_zh: 搜采增订集验成书
  description: 采古本师传极力搜采，参互济人自济一刻广为增订而成文堂集验方
  phases:
  - key: brewing
    name: 僻壤见急萌志搜采
    labels:
      zh: 萌志搜采
    start_date: 1620-01-01
    highlight_event_id: guji-罗浮山人-event-compiling
  - key: breakthrough
    name: 得济人自济先得我心
    labels:
      zh: 参互旧文
    start_date: 1630-01-01
    highlight_event_id: guji-罗浮山人-event-compiling
  - key: climax
    name: 广为增订谨志由来
    labels:
      zh: 增订成集
    start_date: 1635-01-01
    highlight_event_id: guji-罗浮山人-event-compiling
  - key: closure
    name: 纂辑甫竟待雠校
    labels:
      zh: 待校付梓
    start_date: 1638-01-01
    highlight_event_id: guji-罗浮山人-event-publishing
  decisions:
  - date: 1630-01-01
    title_zh: 定专志捷法不列全方
    rationale: 为僻壤穷乡持危济急，中风伤寒只取效捷易办之法，如传心方醋气熏鼻之类
  - date: 1635-01-01
    title_zh: 定参互济人自济增订
    rationale: 采古本师传终嫌挂漏，见济人自济颇觉先得我心，故广为增订谨志由来不掠美
- id: guji-罗浮山人-endeavor-2
  title_zh: 详注刊施利济穷乡
  description: 详注虚实寒热审慎用药，授梓公诸海内不取酬以利济
  phases:
  - key: brewing
    name: 鉴虚实未析虑误投
    labels:
      zh: 详注发愿
    start_date: 1636-01-01
    highlight_event_id: guji-罗浮山人-event-publishing
  - key: breakthrough
    name: 悉为详注审虚实用药
    labels:
      zh: 详注宜忌
    start_date: 1638-01-01
    highlight_event_id: guji-罗浮山人-event-publishing
  - key: climax
    name: 授梓公诸海内
    labels:
      zh: 授梓利济
    start_date: 1640-01-01
    highlight_event_id: guji-罗浮山人-event-publishing
  - key: closure
    name: 听同志印施不吝
    labels:
      zh: 印施不吝
    start_date: 1642-01-01
    highlight_event_id: guji-罗浮山人-event-publishing
  decisions:
  - date: 1638-01-01
    title_zh: 定虚实寒热缕析条分
    rationale: 行世方书或未缕析，偶尔轻投贻误，故兹刻悉为详注用者审诸，如中风中气身温身冷之辨
  - date: 1640-01-01
    title_zh: 定授梓不取酬公海内
    rationale: 原期利济公诸海内毫不取酬，同志欲印施概无所吝，以救穷乡持危之急
events:
- id: guji-罗浮山人-event-birth
  title_zh: 出生自号罗浮山人
  date: 1580-01-01
  year_of: 1580
  description: 生于明代，后隐于罗浮山，自号罗浮山人，留心医学
- id: guji-罗浮山人-event-compiling
  title_zh: 搜采古本师传增订成集
  date: 1635-01-01
  year_of: 1635
  description: 采古本传自良师，参互济人自济一刻广为增订，纂辑文堂集验方，专志中风类中风痫感冒伤寒等捷法
- id: guji-罗浮山人-event-publishing
  title_zh: 详注授梓公诸海内
  date: 1640-01-01
  year_of: 1640
  description: 于例言明医期明理不贵执方，详注虚实寒热，将文堂集验方授梓利济，公诸海内不取酬
- id: guji-罗浮山人-event-death
  title_zh: 逝世
  date: 1650-01-01
  year_of: 1650
  description: 终于明末清初之际，遗文堂集验方行于世
