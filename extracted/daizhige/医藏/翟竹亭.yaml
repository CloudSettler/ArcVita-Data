  - date: 1942
    title_zh: 集成案付梓公世
    rationale: 积四十年治验，类别门分详言病症治法，非炫名欲博济救人
events:
- id: guji-翟竹亭-event-birth
  date: 1879
  year_of: 1879
  title_zh: 生于杞县翟家
  description: 光绪乙卯生，祖籍洪洞洪武迁杞后徙长垣，咸丰壬子避河患复归杞，父患瘫痪，家贫负贩养亲
- id: guji-翟竹亭-event-learn
  date: 1894
  year_of: 1894
  title_zh: 甲午从游先耕学医
  description: 年十六遇通许医生游先耕悬壶隍庙，从习方脉针灸五年尽得其秘
- id: guji-翟竹亭-event-practice
  date: 1899
  year_of: 1899
  title_zh: 出而问世治温疫
  description: 从师五年后出世行医，善辨伤寒温疫，急证急攻，用大承气养阴清解治愈梁堂邢氏兄弟丁楼杜氏子及孕妇周氏等危症，活人无算
- id: guji-翟竹亭-event-book
  date: 1942
  year_of: 1942
  title_zh: 年六十四集成医案
  description: 汇四十年经验奇症作湖岳村叟医案二卷，温疫门二十三案首列总论，一时名宿竞为序跋题词，将付梓公世
- id: guji-翟竹亭-event-death
  date: 1943
  year_of: 1943
  title_zh: 六十四岁后去世
  description: 生于光绪乙卯至作传时年六十四，其后事迹失载，约民国三十二年后去世于杞县
