  dilemmas:
  - 家贫八口待养与矢志从师学医之难
  - 温疫误治变危当攻下逐邪与顾忌年老体弱之择
  - 孕妇染疫挟热下利保胎与通因通用大下存活之辨
  lesson: 人而无恒不可以作巫医，厄穷动忍有恒则孤寒亦可成国手
  summary_first_person: 我名青云字竹亭，自号湖岳村叟，先世洪洞迁杞，家贫养亲，十六岁从通许游先耕习方脉针灸，好问勤学，研灵素难经及濒湖景岳，行医四十载活人无算，集奇症为医案二卷以公于世
