      - 垂示后学
    start_date: 1572
    highlight_event_id: guji-翟良-event-theory
  decisions:
  - date: 1565
    title_zh: 先明形后明脉
    rationale: 先言脏腑联系贯串之形，后言气血流行之脉，则经络脏腑两得其详
  - date: 1570
    title_zh: 备载诸穴歌与分寸歌
    rationale: 穴不混淆方能定经络，故以歌诀详注分寸以便寻检
events:
- id: guji-翟良-event-birth
  type: birth
  title_zh: 出生
  date: 1520
  year_of: 1520
  description: 翟良生于明中期嘉靖前后，禀天地正气而生，后专研医经经络之学
- id: guji-翟良-event-compilation
  type: career
  title_zh: 汇成经络汇编统序
  date: 1565
  year_of: 1565
  description: 著经络统序，论十二经昼夜流行与壅滞传变之病，斥庸医不识经络妄用葛根汤等之误，勉仁人君子注意经络以济世
- id: guji-翟良-event-theory
  type: career
  title_zh: 详述脏腑经络图论
  date: 1570
  year_of: 1570
  description: 详述原始胎孕十月生成，咽喉气食二管，心肝脾肺肾五脏系脊之联系，以及手太阴肺经手阳明大肠经足阳明胃经等循行穴位分寸与歌诀
- id: guji-翟良-event-death
  type: death
  title_zh: 逝世
  date: 1590
  year_of: 1590
  description: 翟良卒于明晚期万历前后，其所汇经络之书以经络最晰使学人直寻病源而传于后
