endeavors:
- id: guji-翟良-endeavor-1
  title_zh: 汇编经络统序明辨病源
  summary: 统论经络流行昼夜流注，分辨十二经病证，纠正不分经络妄用药之弊
  phases:
  - key: brewing
    name: 观庸医之失而立志
    labels:
      zh:
      - 积弊观察
      - 立志汇编
    start_date: 1550
    highlight_event_id: guji-翟良-event-compilation
  - key: breakthrough
    name: 会通诸家成统序
    labels:
      zh:
      - 会通成编
      - 经络统序
    start_date: 1560
    highlight_event_id: guji-翟良-event-compilation
  - key: climax
    name: 经络最晰示人病源
    labels:
      zh:
      - 成书示人
      - 济世仁心
    start_date: 1565
    highlight_event_id: guji-翟良-event-compilation
  decisions:
  - date: 1560
    title_zh: 以经络统序开卷明义
    rationale: 不明十二经络则开口动手便错，故首立统序以正其本
  - date: 1565
    title_zh: 使学者因穴寻络因络寻经
    rationale: 穴易混淆而经络了然则病源可寻，用药无惑
- id: guji-翟良-endeavor-2
  title_zh: 详述脏腑联系与十二经脉流注
  summary: 详论口咽喉气食二管，五脏六腑系于脊之联系，以及手太阴肺经等十二经循行穴位分寸
  phases:
  - key: brewing
    name: 推原造化胎孕渐成
    labels:
      zh:
      - 原始推论
      - 脏腑生成
    start_date: 1560
    highlight_event_id: guji-翟良-event-theory
  - key: breakthrough
    name: 贯串脏腑联系分合
    labels:
      zh:
      - 脏腑贯串
      - 经脉流行
    start_date: 1565
    highlight_event_id: guji-翟良-event-theory
  - key: climax
    name: 分经详绘穴位分寸
    labels:
      zh:
      - 分经绘图
      - 穴位分寸
    start_date: 1570
    highlight_event_id: guji-翟良-event-theory
  - key: closure
    name: 以图论垂示后学
    labels:
      zh:
