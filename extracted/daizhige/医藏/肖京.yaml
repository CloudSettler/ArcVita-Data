person:
  qid: guji-肖京
  name_zh: 肖京
  names:
    zh: 肖京
    en: Xiao Jing
  lifespan:
    birth:
      date: '1600'
      precision: year
      is_circa: true
      raw: 明末生人，崇祯甲申成书时已宦游多年
    death:
      date: '1655'
      precision: year
      is_circa: true
      raw: 清初卒，子肖震守庐重刊遗书
  birth_date: '1600'
  death_date: '1655'
  era: 明末清初
  reign_ref: 崇祯
  archetype: 医隐
  dilemmas:
  - 科第功名与怀术隐医之间何从
  - 尊崇灵素正传与驳斥时医谬法而招尤之间何择
  - 列传方以便俗与存法于无方以待悟之间何守
  lesson: 医当先自救其道，守命门元气为本，辨阴阳水火虚实真假，不治病于五脏将绝而治病于未病，方为救正
  summary_first_person: 吾闽中通隐子肖京万舆也，髫龄苦学，因病遇黄州胡慎庵先生得轩岐秘典，又私淑立斋濒湖，入蜀参印群贤二十余载，归里目击时师昧本从标枉毙生灵，遂竭愚阐灵素之蕴，著轩岐救正论六卷九万字以救医之病，冀救天下后世无量人也
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%BD%A9%E5%B2%90%E6%95%91%E6%AD%A3%E8%AE%BA.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%BD%A9%E5%B2%90%E6%95%91%E6%AD%A3%E8%AE%BA.md
endeavors:
- id: guji-肖京-endeavor-1
  title_zh: 撰述轩岐救正论六卷以救正时医
  summary: 采集内经要旨，阐命门水火五气，明四诊药性，悬医鉴病鉴，驳高阳脉诀快捷方式之谬，不列成方而存方于心
  phases:
  - key: brewing
    name: 宦游楚蜀师承酝酿
    labels:
      zh: 师承濒湖立斋
    start_date: '1625'
    highlight_event_id: guji-肖京-event-study
  - key: breakthrough
    name: 目击庸医杀人立志救医
    labels:
      zh: 先救医病
    start_date: '1640'
    highlight_event_id: guji-肖京-event-vow
  - key: climax
    name: 崇祯甲申春成书九万字
    labels:
      zh: 六卷告成
    start_date: '1644-02-01'
    highlight_event_id: guji-肖京-event-book
  - key: closure
    name: 子震清初重刊行世
    labels:
      zh: 遗书再传
    start_date: '1660'
    highlight_event_id: guji-肖京-event-reprint
  decisions:
  - date: '1644-02-01'
    title_zh: 毅然驳高阳伪诀王径快捷方式之妄
    rationale: 痛念晚近医流守一家偏法忘本从标，虚实颠倒致丧其生，非明著贞邪不足挽狂澜
  - date: '1644-02-01'
    title_zh: 不列成方而阐运气脉旨病机本草之蕴
    rationale: 病多相类不可刻舟胶柱，得悟天人阴阳水火之微则千方万方便在方寸，专执方待病即是拘牵
- id: guji-肖京-endeavor-2
  title_zh: 临床扶元治本治验济世
  summary: 以元气为根察寒热真假，治本扶原而不见病治病，轻者不书重者必录，贫贱佣介亦存恻隐，死者亦书以垂车鉴
  phases:
  - key: brewing
    name: 从宦慈阳病愈得诀
    labels:
      zh: 衙斋三月获痊
    start_date: '1625'
    highlight_event_id: guji-肖京-event-study
  - key: breakthrough
    name: 入蜀参印颇得肯綮
    labels:
      zh: 二十载沉酣
    start_date: '1630'
    highlight_event_id: guji-肖京-event-vow
  - key: climax
    name: 归里诊视录治验医案上下卷
    labels:
      zh: 扶原正法
    start_date: '1644-02-01'
    highlight_event_id: guji-肖京-event-book
  - key: closure
    name: 悬医病两鉴以诫来者
    labels:
      zh: 贞邪从违
    start_date: '1644-02-01'
    highlight_event_id: guji-肖京-event-book
  decisions:
  - date: '1640'
    title_zh: 首纪年月隐前医姓名而揭错治
    rationale: 示明天时以便同患取印，存忠厚而垂车鉴，使学人阅已往之治为将来之式
  - date: '1644-02-01'
    title_zh: 贫贱重病亦录王侯轻病不书
    rationale: 父生母成官骸脏腑无贵贱一也，贫贱药饵难资更赖德医恻隐，不可轻忽其生死
events:
- id: guji-肖京-event-birth
  type: birth
  date: '1600'
  year_of: 1600
  title_zh: 肖京诞生于闽
  description: 萧使君之子，鹿阳先生姻家蒙嗣，髫龄弱禀质钝志劳，穷猎简编苦心诵著
- id: guji-肖京-event-study
  type: study
  date: '1625'
  year_of: 1625
  title_zh: 从宦游楚慈阳遇胡慎庵得传
  description: 婴疾梦遗百治莫瘳，邀学博胡慎庵于衙斋治之三月获痊，授轩岐秘典脉旨病机药性方法，又私淑立斋，嗣入蜀参印群贤
- id: guji-肖京-event-vow
  type: vow
  date: '1640'
  year_of: 1640
  title_zh: 归里目击时师枉毙立救正之志
  description: 见习医半属匪人，所习全非正法，专伤寒忽杂病，执成方逞臆说，颠倒妄行为轩岐乱臣贼子，叹医病实多当先救医
- id: guji-肖京-event-book
  type: achievement
  date: '1644-02-01'
  year_of: 1644
  title_zh: 崇祯甲申春著成轩岐救正论六卷
  description: 数月运腕计卷有六仅字九万，卷一医论命门水火五气，卷二四诊正法，卷三药性微蕴，卷四五治验医案，卷六医鉴病鉴，同志捐资鸠锓以公天下
- id: guji-肖京-event-death
  type: death
  date: '1655'
  year_of: 1655
  title_zh: 卒于里第遗书由子重刊
  description: 没后邻屋灾藏书散佚诸注不存，独救正论行世版亡，子肖震倚庐后春再授梓人卒业捧遗书告墓
- id: guji-肖京-event-reprint
  type: legacy
  date: '1660'
  year_of: 1660
  title_zh: 子肖震清初重刊救正论
  description: 肖震泣血题跋，明大指在医人当先医医，救一世在世世，存方于无方以待读者深思自得，现存清刻本日本刻本及影印本
