endeavors:
- id: guji-胡愔-endeavor-1
  title_zh: 搜罗管见撰黄庭内景五藏六府图
  summary_zh: 按据诸经先明藏府次说修行以图式开后学之门
  phases:
  - key: brewing
    name: 栖心淡泊览黄庭
    labels:
      zh: 穷碧简遗文志焦心碎
    start_date: '0750-01-01'
    highlight_event_id: guji-胡愔-event-study
  - key: breakthrough
    name: 考旧图辨色象神名
    labels:
      zh: 慨旧图指示未明异端斯起
    start_date: '0758-01-01'
    highlight_event_id: guji-胡愔-event-study
  - key: climax
    name: 按经为图式成五藏六府图
    labels:
      zh: 藏府修行病源吐纳并载
    start_date: '0765-01-01'
    highlight_event_id: guji-胡愔-event-compose
  - key: closure
    name: 稽首谨书以示后学
    labels:
      zh: 按图而修万品照然
    start_date: '0766-01-01'
    highlight_event_id: guji-胡愔-event-compose
  decisions:
  - date: '0758-01-01'
    title_zh: 不袭旧图略记之弊重为图式
    rationale: 旧图或示色象或略记神名致后学罕得其门须按据诸经罄竭管见重立图式
  - date: '0765-01-01'
    title_zh: 图后并引病源吐纳药理导引
    rationale: 庶使学者既明藏府又知修行除疾察色寻证自全其生
- id: guji-胡愔-endeavor-2
  title_zh: 立五藏存神修养吐纳导引之法
  summary_zh: 主张藏神养气保守坚贞以五气合体延年益算
  phases:
  - key: brewing
    name: 立五藏为神魂魄志意之主
    labels:
      zh: 心主神肝主魂肺主魄脾主意肾主精
    start_date: '0760-01-01'
    highlight_event_id: guji-胡愔-event-teach
  - key: breakthrough
    name: 定五方声色生旺病死之候
    labels:
      zh: 上应五星下应五岳模范天地
    start_date: '0762-01-01'
    highlight_event_id: guji-胡愔-event-teach
  - key: climax
    name: 授六字气补泻与四时存想
    labels:
      zh: 呬呵嘘呼吹分治五藏
    start_date: '0765-01-01'
    highlight_event_id: guji-胡愔-event-teach
  - key: closure
    name: 戒食忌察色以全内守
    labels:
      zh: 导引屈伸吐纳除疾旁通药理
    start_date: '0768-01-01'
    highlight_event_id: guji-胡愔-event-teach
  decisions:
  - date: '0762-01-01'
    title_zh: 主内守不假金丹玉液
    rationale: 五藏坚强则腥腐不侵疾病不损聪明纯粹却老延年当把握阴阳呼吸精神
  - date: '0765-01-01'
    title_zh: 以六气分补泻定吐纳导引
    rationale: 肺用呬心用呵肝用嘘脾用呼肾用吹配四时方位食禁导引方全修养之道
