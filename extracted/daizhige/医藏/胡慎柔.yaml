  dilemmas:
  - 儒释难两全寄育僧舍而本儒家子何以安身
  - 瘵疾几不起自救无门何以转危为医缘
  - 医道重师承了吾慎斋两师何以次第亲炙
  - 活人盈门而好施不蓄何以守贫而不倦
  lesson: 以身试病而后知医以施济人而后传道瘵起于耗心而愈于师承
  summary_first_person: 吾毗陵胡氏子也幼寄僧舍法名住想字慎柔嗜读书耗心血而得瘵几死幸遇查了吾先生于荆溪岁余获痊遂执贽事之十余年复往从太平周慎斋先生笔录口授归里治病辄应庚午以六剂愈熊鱼山夫人奇恙往来吴会壬申与友达曙论医自叹嗣者寥寥丙子仲夏授平生所著虚损痨瘵师训历例医案五种于友人数日而去得年六十五一生不蓄而遗书得传是吾愿也
  source_urls:
