  - title_zh: 古籍散佚难全
    description: 明末藏书分散，欲存绝学须广搜博采，耗费心力而难尽全
  - title_zh: 医道雅俗之辨
    description: 导引之术杂于方技，欲以雅正文字传养生之道，须去荒诞而存实用
  lesson: 汇集群书则绝学可传，录导引之法则身心可养，存书即所以存人
  summary_first_person: 吾胡文焕，明人也，好藏书，汇刻格致丛书二百余种，又辑养生导引法，述中风风痹导引行气之要，愿后人因书得养，因养得寿
