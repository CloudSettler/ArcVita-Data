  - title_zh: 秘方私藏与公世活人
    description_zh: 秘诀私藏可乘人急取利，公之于世则功广泽长而己无私利
  - title_zh: 家贫难梓与三世之志
    description_zh: 舌耕囊涩久使秘书为椟中之宝，欲酬先人付梓之愿待同志相助
  lesson: 不作良相便作良医，公跌打秘方于世可起死回生
  summary_first_person: 余先君子位卿公受叔祖启万公回生抄本分为上中下三集，余累年舌耕家贫不能付梓，丙辰馆灌城养翎书屋得同志解囊刊定，俾受伤者开卷了然而释先人九原之恨
