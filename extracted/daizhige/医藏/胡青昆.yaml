    labels:
      zh: 传世救人
    start_date: 1856-08
    highlight_event_id: guji-胡青昆-event-publish
  decisions:
  - date: 1856-01
    title_zh: 出抄本求同志助梓
    rationale: 一己能救人有限，人人能救人功广，传世能救人泽长
  - date: 1856-08
    title_zh: 定名回生集撰序付刊
    rationale: 使后受伤者开卷了然不受欺于庸医，亦可成功于己以慰先人
