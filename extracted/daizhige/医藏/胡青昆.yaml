    title_zh: 固请叔祖出抄本
    rationale: 跌打为医中急救而书多秘不可得，必得异授方能救乡里急难
  - date: 1840
    title_zh: 照抄分为三集守不私
    rationale: 叔祖嘱勿私能传犹吾传，当公之于世以济后人
