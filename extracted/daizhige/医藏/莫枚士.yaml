  - key: breakthrough
    name: 以方求病审证立法
    labels:
      zh:
      - 经方
      - 证原脉法
    start_date: 1865-01-01
    highlight_event_id: guji-莫枚士-event-practice
  - key: climax
    name: 辨温热脾胃瘴痧得法
    labels:
      zh:
      - 温热
      - 瘴痧
    start_date: 1871-08-01
    highlight_event_id: guji-莫枚士-event-compile
  - key: closure
    name: 老医善用犀羚垂训
    labels:
      zh:
      - 济世
      - 垂训
    start_date: 1879-04-01
    highlight_event_id: guji-莫枚士-event-spread
  decisions:
  - date: 1865-01-01
    title_zh: 不泥古不薄今酌用温热方
    rationale: 伤寒温热诊法药虽同而法有别，需平允论叶天士温热脾胃之精
  - date: 1871-08-01
    title_zh: 正瘴雾痧秽之混立挟寒挟热两纲
    rationale: 瘴属湿雾有别，痧本射工沙毒，混入治暑则增病，故审源立法
