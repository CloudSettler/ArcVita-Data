    highlight_event_id: guji-莫枚士-event-spread
  decisions:
  - date: 1862-01-01
    title_zh: 避寇海上转志为医
    rationale: 时疫盛行流民踵丧尽无以救，知医急于人，故辑众说考文析义
  - date: 1871-08-01
    title_zh: 以研经言属陆心源序
    rationale: 祧宋元檷汉唐之学需通人质正，故出所著请序以广其传
  - date: 1879-04-01
    title_zh: 以拙稿与陆懋修互校付刊
    rationale: 得遇识字之医方可免夭札，故先付此册于手民以公同好
- id: guji-莫枚士-endeavor-2
  title_zh: 避寇救疫济世行医
  summary_zh: 咸丰季海上救时疫，长夏湿温瘴痧虫劳辨证施治，不泥古不抹煞先贤
  phases:
  - key: brewing
    name: 海上见疫发心
    labels:
