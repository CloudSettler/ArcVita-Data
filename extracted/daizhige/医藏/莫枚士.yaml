  archetype: 训诂考据经方医家
  dilemmas:
  - 不乐仕进潜心国小与经世致用之两难
  - 泥古尊经与以经解经独标新义之张力
  lesson: 格物致知，审音训诂，以经解经，方无虚设，病无遁状
  summary_first_person: 余苕川迂叟，举于乡而不乐仕进，咸丰季避寇海上，见时疫盛行流民踵丧，始知医急于人，遂辑众说考文析义，校注伤寒金匮，集为研经言四卷，惟求切近平实，当于古人之义理，以待能者
  source_urls:
