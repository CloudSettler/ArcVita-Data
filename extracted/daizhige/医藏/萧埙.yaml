      - 传道
    start_date: 1712
    highlight_event_id: guji-萧埙-event-yixuejinglun
  decisions:
  - date: 1692
    title_zh: 弃举业而从医道
    rationale: 少习举子业无以济世不如潜心医经以活人为志故转治灵素及历代名家之书
  - date: 1705
    title_zh: 以经说统摄诸家立纂述大例
    rationale: 历代注疏纷繁不如以经文为纲详加阐发使条理清晰后学易入故定一百三十四卷之规模
- id: guji-萧埙-endeavor-2
  title_zh: 专明妇科撰女科经纶
  summary_zh: 谓妇女四诊难尽而月经胎产崩淋带下最重辨经病先后调气养血为妇科所推崇兼撰中风症
  phases:
  - key: brewing
    name: 察妇女四诊难尽之隐
    labels:
      zh:
      - 妇科
      - 观察
    start_date: 1710
    highlight_event_id: guji-萧埙-event-nvkejinglun
  - key: breakthrough
    name: 立经病先后调经去病之宗旨
    labels:
      zh:
      - 调经
      - 去病
    start_date: 1713
    highlight_event_id: guji-萧埙-event-nvkejinglun
  - key: climax
    name: 分月经嗣育胎前产后六卷成书
    labels:
      zh:
      - 分门
      - 论治
    start_date: 1715
    highlight_event_id: guji-萧埙-event-nvkejinglun
  - key: closure
    name: 撰中风症以补内科杂症
    labels:
      zh:
      - 补遗
      - 垂后
    start_date: 1722
    highlight_event_id: guji-萧埙-event-zhongfeng
  decisions:
  - date: 1713
    title_zh: 定因病致经不调则去病经自调之例
    rationale: 凡因病而经不调者病祛则经自调先经不调而后病者调其经则病自愈故调经莫先于去病
  - date: 1714
    title_zh: 定调经以顺气养血滋水补脾为要
    rationale: 经候不调多由忧思郁怒气滞血虚脾胃生化不足故先顺气开郁养心实脾而不专耗其气
