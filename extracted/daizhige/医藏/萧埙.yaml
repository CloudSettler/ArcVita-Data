  - 妇女经不调而后病与因病而经不调之间标本先后如何分辨
  lesson: 妇女经胎产之病当辨病与经之先后调气养血固脾胃生化之源去病即所以调经
  summary_first_person: 吾萧埙字赓六号慎斋檇李人少习举业后弃儒从医潜心灵素博采历代诸家尤长虚损劳瘵及妇科经胎崩带之证纂医学经纶一百三十四卷复撰女科经纶以明月经胎产之旨愿后学审气血虚实而不惑于攻补寒热之偏
