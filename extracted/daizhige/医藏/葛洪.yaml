endeavors:
- id: guji-葛洪-endeavor-1
  title_zh: 炼丹修道著抱朴子
  summary_zh: 师事鲍玄得炼丹法，南下勾漏罗浮炼丹修道，著抱朴子内外篇明神仙可学论
  phases:
  - key: brewing
    name: 少年好学穷览坟索
    labels:
      zh: 好学览索
    start_date: 0295-01-01
    highlight_event_id: guji-葛洪-event-birth
  - key: breakthrough
    name: 师事鲍玄得闻仙道
    labels:
      zh: 师鲍闻道
    start_date: 0306-01-01
    highlight_event_id: guji-葛洪-event-congjun
  - key: climax
    name: 求勾漏令南下求丹
    labels:
      zh: 南下求丹
    start_date: 0331-01-01
    highlight_event_id: guji-葛洪-event-goulou
  - key: closure
    name: 罗浮炼丹著述终老
    labels:
      zh: 罗浮终老
    start_date: 0340-01-01
    highlight_event_id: guji-葛洪-event-death
  decisions:
  - date: 0306-01-01
    title_zh: 师事鲍玄学炼丹房中之术
    rationale: 欲求长生之道，兼得济世方术，不止章句儒业
  - date: 0331-01-01
    title_zh: 自求勾漏令赴南方产丹砂处
    rationale: 南方多丹砂可炼，遂炼丹志愿，避朝仕羁绊，得以潜心著述
- id: guji-葛洪-endeavor-2
  title_zh: 选集玉函撰成肘后备急方
  summary_zh: 省仲景元化诸家近千卷之繁，选简要易得贱价之药，撰玉函百卷又撮要为肘后三卷以救卒暴备贫家野居之急
  phases:
  - key: brewing
    name: 从军见疾苦有医无药之困
    labels:
      zh: 见疾苦
    start_date: 0303-01-01
    highlight_event_id: guji-葛洪-event-congjun
  - key: breakthrough
    name: 删繁收拾奇异遗逸成玉函
    labels:
      zh: 集玉函
    start_date: 0331-01-01
    highlight_event_id: guji-葛洪-event-goulou
  - key: climax
    name: 撮要成肘后救卒三卷
    labels:
      zh: 成肘后
    start_date: 0340-01-01
    highlight_event_id: guji-葛洪-event-zhoushou
  - key: closure
    name: 验而后录流传后世补阙不绝
    labels:
      zh: 验录流传
    start_date: 0340-01-01
    highlight_event_id: guji-葛洪-event-death
  decisions:
  - date: 0340-01-01
    title_zh: 舍珍贵针经专取易得草石兼以灸
    rationale: 穷乡远地有病无医有方无药，针须明堂流注难晓，唯易得贱价之药与言分寸之灸可顾眄即具
  - date: 0340-01-01
    title_zh: 一方一论试而后录不徒简易
    rationale: 恐贵远贱近是古非今，必已试有效方可救人于死，方必已病如入和肆举皆美玉
events:
- id: guji-葛洪-event-birth
  title_zh: 出生丹阳句容葛氏
  kind: birth
  date: 0284-01-01
  year_of: 284
  place_zh: 丹阳句容
  description_zh: 晋武帝太康五年出生于丹阳句容，字稚川，自号抱朴子，少好神仙导养之法
- id: guji-葛洪-event-congjun
  title_zh: 从军讨石冰兼师事鲍玄
  kind: career
  date: 0303-01-01
  year_of: 303
  place_zh: 江南
  description_zh: 太安二年从军征石冰，见战乱疾疫夭折之多，旋师事南海太守鲍玄学炼丹术数，娶其女鲍姑为妻
- id: guji-葛洪-event-goulou
  title_zh: 自求勾漏令南下广州
  kind: career
  date: 0331-01-01
  year_of: 331
  place_zh: 勾漏
  description_zh: 闻交趾出丹砂，求为勾漏令，遂南下广州，潜心炼丹著述，绝意仕进
- id: guji-葛洪-event-zhoushou
  title_zh: 撰成玉函方与肘后备急方
  kind: career
  date: 0340-01-01
  year_of: 340
  place_zh: 罗浮山
  description_zh: 省千卷之繁选集玉函百卷，又采其要约为肘后救卒三卷，率多易得贱价之药，备卒死中恶客忤鬼击诸急，使家有此方不需医即可救急
- id: guji-葛洪-event-death
  title_zh: 卒于罗浮山炼丹之所
  kind: death
  date: 0364-01-01
  year_of: 364
  place_zh: 罗浮山
  description_zh: 晋哀帝兴宁二年卒于罗浮山，年八十一，遗书肘后方后经陶弘景补阙为百一方，利世极多
