endeavors:
- id: guji-董宿-endeavor-1
  title_zh: 编撰奇效良方
  summary: 以风门为首，汇集通治五脏正治诸方，成书以惠后学
  phases:
  - key: brewing
    name: 广集风方
    labels:
      zh: 汇集验方
    start_date: '1545'
    highlight_event_id: guji-董宿-event-fangji
  - key: breakthrough
    name: 立风门附论
    labels:
      zh: 立论辨风
    start_date: '1555'
    highlight_event_id: guji-董宿-event-fangji
  - key: climax
    name: 分门成书
    labels:
      zh: 分门成编
    start_date: '1565'
    highlight_event_id: guji-董宿-event-chengshu
  - key: closure
    name: 刊布奇效良方
    labels:
      zh: 刊布流传
    start_date: '1570'
    highlight_event_id: guji-董宿-event-chengshu
  decisions:
  - date: '1555'
    title_zh: 以风门居卷首详辨四风
    rationale: 风为百病之长，偏枯风痱风懿风痹易混，故先立论以正其源
  - date: '1565'
    title_zh: 分五脏中风另立方门
    rationale: 肝心脾肺肾受病各异，筋脉神志证候不同，故分脏立法以便对证
- id: guji-董宿-endeavor-2
  title_zh: 阐发中风中气辨治以活人
  summary: 明辨中风浮弦洪与中气沉伏之脉，戒妄用风药，主先顺气调气
  phases:
  - key: brewing
    name: 临证察脉
    labels:
      zh: 察脉辨证
    start_date: '1550'
    highlight_event_id: guji-董宿-event-bianzheng
  - key: climax
    name: 示人先顺气法
    labels:
      zh: 顺气活人
    start_date: '1560'
    highlight_event_id: guji-董宿-event-bianzheng
  - key: closure
    name: 垂训后学
    labels:
      zh: 垂训戒误
    start_date: '1575'
    highlight_event_id: guji-董宿-event-chengshu
  decisions:
  - date: '1560'
    title_zh: 主治风必先顺气后疏风
    rationale: 气顺则痰消络通，妄散反伤脾气虚邪愈盛，故立顺气为先
  - date: '1562'
    title_zh: 中气禁作风治宜调降
    rationale: 中气由七情郁结气闭所致，脉沉而伏，与风浮盛不同，故以苏合香丸开窍调气而不发散
events:
- id: guji-董宿-event-birth
  date: '1520'
  year_of: 1520
  title_zh: 出生
  description: 明中期约嘉靖前后生，长而习医，究心风证
- id: guji-董宿-event-fangji
  date: '1555'
  year_of: 1555
  title_zh: 立风门附论集通治方
  description: 按玉机真藏金匮内经之论，辨偏风脑风等八风及偏枯风痱风懿风痹四名，集人参顺气汤续命汤等风证通治诸方
- id: guji-董宿-event-bianzheng
  date: '1560'
  year_of: 1560
  title_zh: 明辨中风中气脉法
  description: 定浮盛弦速洪数为风，沉伏为中气，示中气先以苏合香丸姜汁开窍，次审虚实寒热补泻温清，戒一概作风治
- id: guji-董宿-event-chengshu
  date: '1570'
  year_of: 1570
  title_zh: 成奇效良方刊布
  description: 以风门领首，分肝脏心脏脾脏等五脏正治，详竹沥取法及丸散煎服之法，编成奇效良方以惠世
- id: guji-董宿-event-death
  date: '1585'
  year_of: 1585
  title_zh: 逝世
  description: 明万历前后卒，遗书奇效良方传于后世
