  birth_date: '1520'
  death_date: '1585'
  era: 明
  reign_ref: 明嘉靖万历间
  archetype: 医家
  dilemmas:
  - 风证多端中风中气相类，如何辨脉察形不误人性命
  - 诸方浩繁虚实寒热错杂，如何先顺气后疏风对证施治
  lesson: 辨脉为先，先顺气后疏风，对证用药方获奇效
  summary_first_person: 吾董宿，明人也，见世医不辨中风中气，妄投风药以伤脾气，遂痛心焉，乃广集风门诸方，参以玉机金匮内经之论，辨八风四名及五脏中风之候，成奇效良方，愿后人察脉观形，先顺气后疏风，活人无误
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%A5%87%E6%95%88%E8%89%AF%E6%96%B9.html
