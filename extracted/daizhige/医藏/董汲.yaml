  - date: '1115'
    title_zh: 以旅舍应猝为纲收方百余
    rationale: 宦游南北客涉道途冒触居多邪气易入方药备急尤当究心故证详法略使览者晓然可用
  - date: '1125'
    title_zh: 分十二类详证略法不用深奥
    rationale: 推圣人蠲疴济世之心取经效简易之方如小半夏汤五苓散无比香薷散皆切于仓卒救急
- id: guji-董汲-endeavor-2
  title_zh: 究小儿斑疹脚气及杂病医法
  summary: 撰小儿斑疹论脚气治法与产科小儿疮科杂伤诸方兼参钱乙诸家以凉药攻本以简方救急
