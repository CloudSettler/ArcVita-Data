  decisions:
  - date: '1120'
    title_zh: 专论小儿斑疹痘疹伏热
    rationale: 小儿肠胃柔脆斑疹惊疳喉痹走马急疳多由胃热毒入故制神仙紫雪利毒丸救生散以清热解毒
  - date: '1125'
    title_zh: 杂伤火毒不用冷沃以散救痛
    rationale: 火气本阳得水则阴薄内溃难痂故以救痛散涂贴背指散护疮口以御外风防痓厥
