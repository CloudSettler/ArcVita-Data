  birth_date: 1040
  death_date: 1100
  era: 北宋
  reign_ref: 熙宁至元祐
  archetype: 久病成良医
  dilemmas:
  - 风多湿少与湿多风少用药消息之难一概用药则难克奇效
  - 肾虚当补与风湿邪盛壅喘之难一向补益则秘结喘满一向疏下则藏虚酸削
  - 方药繁多求索难得与临病有据济众之愿
  lesson: 三折肱为良医循证按四时寒暑虚实治之轻者亦重得理者重亦轻
  summary_first_person: 我字及之东平人自少小病脚气约十余年熙宁年行大雪中为寒湿所乘十年凡七八发一旬之内变证不等遂博采素问灵枢甲乙太素巢氏千金外台圣惠小品删繁金匮玉函本草苏恭方论及针艾淋煠蒸熨导引食饮之宜分为一十九门名曰脚气治法总要不敢私隐庶几临病有所证据
  source_urls:
  - https://daizhige.org/脚气治法总要.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/脚气治法总要.md
endeavors:
- id: guji-董汲-endeavor-1
  title_zh: 久病穷源博采成书
  summary: 以身患脚气十年为基博求古方采摘要法集成十九门总要上卷论十二篇下卷方四十六首
  phases:
  - key: brewing
    name: 雪行感疾屡发究源
    labels:
      zh:
      - 久病自察
      - 变证斟酌
    start_date: 1068
    highlight_event_id: guji-董汲-event-ill
  - key: breakthrough
    name: 博采群书究极脉证
    labels:
      zh:
      - 采摭经方
      - 藏府脉辨
    start_date: 1078
    highlight_event_id: guji-董汲-event-compile
  - key: closure
    name: 集成十九门总要成帙
    labels:
      zh:
      - 删繁就简
      - 四时条法
    start_date: 1086
    highlight_event_id: guji-董汲-event-compile
  decisions:
  - date: 1078
    title_zh: 遍采素问灵枢千金外台而不专一家
    rationale: 脚气有干湿阴阳虚实冷热之别非一家之学可尽故凡古有是说者无不究极
  - date: 1086
    title_zh: 以四时月令统摄方药针灸淋煠
    rationale: 春夏宜汗利秋冬宜小补高卑老壮男女各异故谨序月令条法使服食有常而不发
- id: guji-董汲-endeavor-2
  title_zh: 以身试方四时调治济人
  summary: 先以自疗验效次以及崔直文思诸人分风湿虚实阴阳施治并重外治针灸淋煠
  phases:
  - key: brewing
    name: 自疗肿胀入腹危证
    labels:
      zh:
      - 亲尝汤散
      - 救急入腹
    start_date: 1070
    highlight_event_id: guji-董汲-event-selfcure
  - key: climax
    name: 以天门冬大煎愈人取效
    labels:
      zh:
      - 通治虚实
      - 四时不阙
    start_date: 1075
    highlight_event_id: guji-董汲-event-curecui
  - key: closure
    name: 以食前后丸金牙酒善后防发
    labels:
      zh:
      - 善后防复
      - 针药并施
    start_date: 1080
    highlight_event_id: guji-董汲-event-curewen
  decisions:
  - date: 1070
    title_zh: 肿气入腹心烦便闭急用防榔牵牛分服利水
    rationale: 毒势内攻入腹闷乱喘促不速下凑毒之药则三焦荣卫不通故以童便姜汁调末大利而消
  - date: 1075
    title_zh: 遇虚劳挛肿者用天门冬大煎通治而不惮品繁
    rationale: 此方通四时括众证虚实寒热率皆主对世人惮其难得而不修故详陈以劝有力者四时服之
events:
- id: guji-董汲-event-birth
  title_zh: 生于东平
  date: 1040
  year_of: 1040
  place_zh: 东平
  description: 字及之东平人始末未详钱乙尝序其防疹论
- id: guji-董汲-event-ill
  title_zh: 熙宁雪行感寒湿患脚气
  date: 1068
  year_of: 1068
  place_zh: 中原道途
  description: 熙宁年因行大雪中为寒湿冷气相乘遂成兹疾十年之间七八发动至春两脚赤肿疼痛痿弱不能行
- id: guji-董汲-event-selfcure
  title_zh: 自疗肿及通身入腹危证得差
  date: 1070
  year_of: 1070
  place_zh: 东平汶上间
  description: 自脚及通身肿气上入腹心烦腹满气促便闭以防榔诃子生牵牛童便姜汁分服大利而消后以天麻丸乌蛇丸陈元膏疗疮以木瓜丸食前后丸金牙酒复力
- id: guji-董汲-event-curecui
  title_zh: 以天门冬大煎愈崔直脚气肿弱
  date: 1075
  year_of: 1075
  place_zh: 须城沂州间
  description: 熙宁年间济南崔郎中直自川中病风经夏涉蒸湿脚肿弱挛痛作天门冬大煎服之即差永不发
- id: guji-董汲-event-curewen
  title_zh: 以食前后丸愈董文思以海桐皮散等愈梁吴冯诸家
  date: 1080
  year_of: 1080
  place_zh: 汶上
  description: 董文思驻泊汶上两脚赤肿以食前丸食后丸即差冬令作金牙酒并淋煠不复作又经验梁子谅吴琯冯宅女等案
- id: guji-董汲-event-compile
  title_zh: 元丰元祐间撰成脚气治法总要十九门
  date: 1086
  year_of: 1086
  place_zh: 东平
  description: 博采素问九墟灵枢甲乙太素巢元千金外台圣惠诸家分为一十九门通为一卷上卷论十二篇下卷方四十六首并针灸淋煠蒸熨月令条法
- id: guji-董汲-event-death
  title_zh: 约卒于哲徽之际
  date: 1100
  year_of: 1100
  place_zh: 东平
  description: 书录解题作一卷宋史艺文志亦同久无传本赖永乐大典所载排纂成帙传于后世
