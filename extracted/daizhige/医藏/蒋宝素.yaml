  - title_zh: 守经义与折衷诸家
    description: 原本经术参仲景东垣诸家，芟芜荟精，既守表里阴阳虚实之辨又因时制宜
  lesson: 为医等于为相，固护正气为先，辨伏邪审形神，方能济世全人
  summary_first_person: 我是镇江京口蒋宝素，父为椿田老人，师为王九峰，幼贫十四始识字，承家学师传锐志岐黄，有声大江南北，因家君医话业师医案著医略八十一卷，先刻六淫门十三卷以问世，愿天下明哲惠而教我
