  date: 1840-12-21
  year_of: 1840
  description: 道光二十年庚子冬至自序，因家君医话业师医案著医略八十一卷，先刻六淫门十三卷，详真中风三方及伏邪关格人迎之辨
- id: guji-蒋宝素-event-fame
  title_zh: 得阮元潘世恩等诸公作序盛赞
  date: 1848-03-01
  year_of: 1848
