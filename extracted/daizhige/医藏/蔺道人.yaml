  decisions:
  - date: 0844-01-01
    title_zh: 以最后一卷授彭不授全书
    rationale: 察彭氏可托而世人未可尽托，留精要以治损，藏玄妙以待缘
  - date: 0846-01-01
    title_zh: 拒观察使之邀飘然而去
    rationale: 久慕山中之乐不恋经世之荣，功成身退，全其高洁
events:
- id: guji-蔺道人-event-birth
  person_qid: guji-蔺道人
  type: birth
  title_zh: 生于长安
  date: 0697-01-01
  year_of: 697
  description: 约开元前后生于长安，自称蔺道者，后为头陀，年寿百四五十而风采不改
- id: guji-蔺道人-event-heal
  person_qid: guji-蔺道人
  type: career
  title_zh: 治愈彭子坠木折颈挫肱
  date: 0842-04-01
  year_of: 842
  description: 会昌间彭叟之子升木伐条坠地折颈挫肱，请视之，命买数品药亲制以饵，俄而痛定，数日如平时，始知能医
- id: guji-蔺道人-event-teach
  person_qid: guji-蔺道人
  type: career
  title_zh: 授理伤续断秘方于彭氏
  date: 0843-06-01
  year_of: 843
  description: 取方授彭，使自制者，且誓以无苟取毋轻售毋传非人，由是治损者宗彭氏，并传医治整理补接次第口诀及诸散丸丹方
- id: guji-蔺道人-event-death
  person_qid: guji-蔺道人
  type: death
  title_zh: 仙去失踪惟瓢存庵
  date: 0846-12-31
  year_of: 846
  description: 邓先生不至后自言已仙去，江西观察使遣人同彭叟邀之，至则行矣，惟椰瓢存壁间，廉使易其村曰巩以旌之
