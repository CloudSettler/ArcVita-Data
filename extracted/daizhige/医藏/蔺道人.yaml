    title_zh: 亲视彭子坠伤亲制药饵
    rationale: 见村氓急难，不忍坐视，以试平生接骨之效
  - date: 0843-06-01
    title_zh: 取方授彭立三誓
    rationale: 求者益众而厌烦扰，择朴诚之人授之，使无苟取轻售传非人，以保仁术不滥
- id: guji-蔺道人-endeavor-2
  person_qid: guji-蔺道人
  title_zh: 著书传世仙授秘方
  summary: 留书数篇，以最后一卷授彭氏，详载洗拔伸捺贴夹缚服药次第及黑龙散风流散诸方，江西观察使易村为巩以传之
  phases:
