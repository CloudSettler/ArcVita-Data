endeavors:
- id: guji-薛己-endeavor-1
  title_zh: 出入宫廷以医活人并录家居医案
  summary: 承父业入太医院累官院使以补益脾胃温养正气活人无数并将日间所治病原脉候方验录为家居医录
  phases:
  - key: brewing
    name: 吴中家学儒医并进
    labels:
      zh:
      - 家学
      - 儒医
    start_date: 1487
    highlight_event_id: guji-薛己-event-birth
  - key: breakthrough
    name: 入太医院以医名世
    labels:
      zh:
      - 宫廷
      - 名医
    start_date: 1520
    highlight_event_id: guji-薛己-event-taiyi
  - key: climax
    name: 日录所活汇成医录
    labels:
      zh:
      - 医案
      - 活人
    start_date: 1540
    highlight_event_id: guji-薛己-event-yilu
  - key: closure
    name: 得中丞刊布训世
    labels:
      zh:
      - 刊刻
      - 传世
    start_date: 1548
    highlight_event_id: guji-薛己-event-kanxing
  decisions:
  - date: 1540
    title_zh: 不秘方而示人以期人人成名医
    rationale: 以仁者之心破世医自秘自多之习欲寿斯民于无穷
  - date: 1548
    title_zh: 以补益脾胃为诸病纲领而不用峻攻
    rationale: 见妇人劳损多因脾胃先亏寒凉复伤生气故以四君归脾补中为收功之主
- id: guji-薛己-endeavor-2
  title_zh: 撮要女科立调经保产之法
  summary: 取历验女科诸症撮其精要分卷上下论经候带下胎产诸疾以肝脾肾立论重在补化源而慎伐肝
  phases:
  - key: brewing
    name: 广收经漏经闭崩带案验
    labels:
      zh:
      - 女科
      - 积案
    start_date: 1530
    highlight_event_id: guji-薛己-event-nvke-zhengji
  - key: breakthrough
    name: 悟脾统血肝藏血之要
    labels:
      zh:
      - 脾胃
      - 气血
    start_date: 1542
    highlight_event_id: guji-薛己-event-wu-spleen
  - key: climax
    name: 成女科撮要分经产两卷
    labels:
      zh:
      - 著述
      - 女科撮要
    start_date: 1548
    highlight_event_id: guji-薛己-event-book
  - key: closure
    name: 以加味逍遥归脾补中垂法后世
    labels:
      zh:
      - 方论
      - 垂训
    start_date: 1550
    highlight_event_id: guji-薛己-event-fanglun
  decisions:
  - date: 1548
    title_zh: 经候不调分肝脾虚实而主补
    rationale: 血生于脾土凡血病当用苦甘助阳生阴不轻用通经峻剂
  - date: 1550
    title_zh: 产后诸疾大补气血而不发散
    rationale: 产后亡血伤气元虚火动若投发散祸在反掌当以十全八珍固本
events:
