  name_zh: 薛己
  names:
    zh: 薛己
    en: Xue Ji
  lifespan:
    birth:
      date: 1487
      precision: year
      is_circa: false
      raw: 明成化二十三年
    death:
      date: 1559
      precision: year
      is_circa: false
      raw: 明嘉靖三十八年
  birth_date: 1487
  death_date: 1559
  era: 明
  reign_ref: 弘治至嘉靖
  archetype: 良医
  dilemmas:
  - 攻毒与托补之辨，庸医概用寒凉试方误人，当先辨有余不足主客缓急
  - 疮疡有形而本在气血营卫，须分经络虚实老弱时令，不可干扰余经
  lesson: 审虚实补气血为主，以托里消毒补接全生，慎用寒凉攻伐，推己及物以济穷乡
  summary_first_person: 吾薛己，号立斋，吴县人，承父铠家学精内外科，历任南京太医院判及太医院使，集治验分症成外科发挥，力主辨虚实托补而戒概用寒凉，愿锓梓以传穷乡下邑，措天下于仁寿之域
  source_urls:
  - https://daizhige.org/医藏/外科发挥.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/外科发挥.md
endeavors:
- id: guji-薛己-endeavor-1
  title_zh: 集验成外科发挥刊传济众
  summary: 承先君意萃随治验方，分症详辨虚实主客，成八卷外科发挥，锓梓以便穷乡无名医者
  phases:
  - key: brewing
    name: 承家学业医
    labels:
      zh: 家学酝酿
    start_date: 1487
    highlight_event_id: guji-薛己-event-birth
  - key: breakthrough
    name: 判院临证悟托补
    labels:
      zh: 临证突破
    start_date: 1515
    highlight_event_id: guji-薛己-event-nanjing
  - key: climax
    name: 外科发挥成书
    labels:
      zh: 成书高潮
    start_date: 1528-08-01
    highlight_event_id: guji-薛己-event-waikefahui
  - key: closure
    name: 锓梓流传穷乡
    labels:
      zh: 刊行收束
    start_date: 1528-08-01
    highlight_event_id: guji-薛己-event-waikefahui
  decisions:
  - date: 1528
    title_zh: 分症录既验专辨虚实
    rationale: 庸医未尝读书明理以方试人，故只录既验者，尤致详于虚实主客之宜
  - date: 1528
    title_zh: 立托里表散补接为主
    rationale: 血脉喜温恶寒，肿疡内外皆壅宜托里表散，溃疡内外皆虚宜补接，不可概用寒凉大黄香散
- id: guji-薛己-endeavor-2
  title_zh: 历任太医以补气血全生
  summary: 任南京太医院判及太医院使，以补脾胃气血治内外疮疡杂证，校订内科摘要外科枢要诸书
  phases:
  - key: brewing
    name: 随父诊视习方脉
    labels:
      zh: 随诊积学
    start_date: 1500
    highlight_event_id: guji-薛己-event-nanjing
  - key: breakthrough
    name: 南京判院扶困起废
    labels:
      zh: 判院立名
    start_date: 1520
    highlight_event_id: guji-薛己-event-nanjing
  - key: climax
    name: 太医院使参调护
    labels:
      zh: 入院鼎盛
    start_date: 1535
    highlight_event_id: guji-薛己-event-taiyiyuan
  - key: closure
    name: 著述校理传后学
    labels:
      zh: 著述善后
    start_date: 1550
    highlight_event_id: guji-薛己-event-taiyiyuan
  decisions:
  - date: 1535
    title_zh: 舍时从证权宜治热毒
    rationale: 证有主末治有权宜，热毒内蓄虽值季冬亦舍时用清解，不泥守常以免病势危甚
  - date: 1540
    title_zh: 脓成急针佐温补托里
    rationale: 脓熟不行针刺则毒蚀难疗，老弱紧要之处一有脓即针之，更以托里使气血平复免变证
events:
- id: guji-薛己-event-birth
  date: 1487
  year_of: 1487
  title_zh: 生于吴县医家
  description: 明成化二十三年生于苏州府吴县，父薛铠精医，少承家学兼通内外小儿诸科
  place: 吴县
- id: guji-薛己-event-nanjing
  date: 1520
  year_of: 1520
  title_zh: 任南京太医院判临证著心法
  description: 任南京太医院判，以外科心法精当切要扶困起废，临证详辨脉证虚实用托补消毒
  place: 南京
- id: guji-薛己-event-waikefahui
  date: 1528-08-01
  year_of: 1528
  title_zh: 外科发挥成书叙传
  description: 嘉靖戊子秋集随治验方成外科发挥八卷，张淮叙之，少宰李公标名，详肿疡溃疡虚实治法并附方锓梓以传
  place: 南京
- id: guji-薛己-event-taiyiyuan
  date: 1535
  year_of: 1535
  title_zh: 升太医院使校理诸书
  description: 升任太医院使，以补中益气十全大补调补气血治疮疡杂证，校理内科摘要外科枢要等书传于世
  place: 北京
- id: guji-薛己-event-death
  date: 1559
  year_of: 1559
  title_zh: 殁于嘉靖三十八年
  description: 明嘉靖三十八年殁，一生以孝亲仁物为心，遗书广传穷乡下邑，医林奉为立斋先生
  place: 吴县
