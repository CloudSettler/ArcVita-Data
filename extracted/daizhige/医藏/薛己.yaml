  - date: 1515
    title_zh: 舍克伐而用温补脾胃
    rationale: 肢体损外则气血伤内，行克伐则虚益虚滞益滞，补脾胃则瘀易溃肉易生
  - date: 1525
    title_zh: 重症先砭后补不妄下
    rationale: 瘀血当砭则砭，内虚则急固元气，妄下恐亡阴亡阳而致坏症
