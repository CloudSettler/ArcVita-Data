  decisions:
  - date: '1529'
    title_zh: 中风昏愦重用人参温补不用祛风寒凉
    rationale: 真气虚而风邪乘用三生饮必加人参两许驾邪辅正否则徒败元气
  - date: '1532'
    title_zh: 命门火衰补火生土不用苦寒泻火
    rationale: 饮食难化腹冷乃火衰不能生土当用八味丸壮火之源以消阴翳忌黄柏知母苦寒伤胃
- id: guji-薛己-endeavor-2
  title_zh: 著述医案传法后世
  summary: 辑毕生医案为内科摘要外科枢要等书详记辨证用药以正时医攻伐之弊
  phases:
  - key: brewing
