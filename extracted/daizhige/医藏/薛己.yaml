  date: 1540
  year_of: 1540
  description: 论疮疡当明本末虚实，肿高者解毒，漫肿者托里，反对妄汗妄下寒凉围药
- id: guji-薛己-event-theory
  title_zh: 系统论述二十六脉五善七恶针法
  date: 1550
  year_of: 1550
  description: 撰外科枢要卷一诸论，辨脉病相应，定呕痛生肌去腐之法，附治验
