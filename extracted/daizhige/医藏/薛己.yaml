  era: 明
  reign_ref: 嘉靖
  archetype: 通内外之良医
  dilemmas:
  - 内外分科绝不相通，我当以治本贯通经络阴阳还是随俗分治急效
  - 疠疡毒结脏腑气血俱伤，我当以攻伐速去其毒还是以调补固本徐图全愈
  lesson: 医犹理也，攻守有备，必以治本为第一义，不劳而病自愈
  summary_first_person: 吾薛己，号立斋，吴县人，承岐黄世业，旁通诸家，谓不知外科无以通经络，不精内经无以究阴阳，故内外同治，以补元气为守，以解利为权宜，著疠疡机要以验治效，愿后之业医者不滞不肤而得廓清之术
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E7%96%A0%E7%96%A1%E6%9C%BA%E8%A6%81.html
