endeavors:
- id: guji-薛己-endeavor-1
  title_zh: 贯通内外调补元气之医业
  summary: 承家学而历太医院，以补脾胃元气为本，兼治内科外科，救补偏攻伐之弊
  phases:
  - key: brewing
    name: 世医承学
    labels:
      zh: 吴县习医
    start_date: 1487
    highlight_event_id: guji-薛己-event-birth
  - key: breakthrough
    name: 以医显名入仕
    labels:
      zh: 御医任用
    start_date: 1520
    highlight_event_id: guji-薛己-event-imperial
  - key: climax
    name: 内外一贯著述宏大
    labels:
      zh: 内科摘要外科枢要
    start_date: 1529
    highlight_event_id: guji-薛己-event-writing
  - key: closure
    name: 晚年定论垂训
    labels:
      zh: 医案验效传后
    start_date: 1550
    highlight_event_id: guji-薛己-event-death
  decisions:
  - date: 1520
    title_zh: 坚持治本不求急效
    rationale: 见世医妄投燥热克伐致气血愈亏，故立补元气为守备完策，从容纾徐使病自愈
  - date: 1529
    title_zh: 内外合一不分科执守
    rationale: 悟经络阴阳原委相通，引越人一医三习与周官两职之义，破后世判为两途之蔽
- id: guji-薛己-endeavor-2
  title_zh: 疠疡专科辨治与机要撰述
  summary: 辨疠疡本症兼症变症类症，创砭刺汗下攻补之法，属友梓行疠疡机要
  phases:
  - key: brewing
    name: 察疠疡风土病因
    labels:
      zh: 淮闽岭南多患
    start_date: 1525
    highlight_event_id: guji-薛己-event-imperial
  - key: breakthrough
    name: 分经辨症立治法
    labels:
      zh: 本兼变类阴阳虚实
    start_date: 1530
    highlight_event_id: guji-薛己-event-writing
  - key: climax
    name: 机要成编梓行
    labels:
      zh: 嘉靖甲寅中秋成书
    start_date: 1534
    highlight_event_id: guji-薛己-event-liyang
  - key: closure
    name: 医案验效劝戒调摄
    labels:
      zh: 慎起居戒浓味房劳
    start_date: 1535
    highlight_event_id: guji-薛己-event-liyang
  decisions:
  - date: 1530
    title_zh: 外砭内泄表里俱治
    rationale: 毒在外非遍刺出血不散，毒蕴于脏非荡涤不痊，故上体用醉仙散下体用再造散兼针刺泄毒
  - date: 1534
    title_zh: 以医案验治效属友梓传
    rationale: 以己意订古方，以调补为守以解利为权宜，托沈启原刊行，使业医者不病于滞而不通不病于肤而无本
events:
- id: guji-薛己-event-birth
  date: 1487
  year_of: 1487
  title_zh: 生于吴县岐黄世家
  description: 明成化二十三年生，承父业习医，旁通诸家，究心内经经络阴阳
- id: guji-薛己-event-imperial
  date: 1520
  year_of: 1520
  title_zh: 以医术显名历事宫廷
  description: 以精通内外治本之术著称，累任太医院，治劳伤气血虚损多用补中益气六味地黄诸方取效
- id: guji-薛己-event-writing
  date: 1529
  year_of: 1529
  title_zh: 撰内科摘要外科枢要诸书
  description: 发明真气夺则虚邪气胜则实之旨，明内外殊科其揆一，为疠疡机要奠定调补守备之理论
- id: guji-薛己-event-liyang
  date: 1534-09-01
  year_of: 1534
  title_zh: 疠疡机要成编刊行
  description: 嘉靖甲寅中秋，沈启原作序梓行，分上卷本症兼症变症类症治法及治验，主张辨脏腑受毒砭刺泄毒而以养血补气收功
- id: guji-薛己-event-death
  date: 1559
  year_of: 1559
  title_zh: 卒于嘉靖三十八年
  description: 晚年以医而通于理名重一时，所传机要及医案为后世外科疠疡调补学派之宗
