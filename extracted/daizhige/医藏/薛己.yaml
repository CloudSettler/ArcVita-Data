  - key: breakthrough
    name: 内科摘要成书刊行
    labels:
      zh: 成书刊行
    start_date: '1529'
    highlight_event_id: guji-薛己-event-neike
  - key: climax
    name: 外科枢要续成广传
    labels:
      zh: 广传补土
    start_date: '1540'
    highlight_event_id: guji-薛己-event-late
  - key: closure
    name: 校订全书托付后学
    labels:
      zh: 托付后学
    start_date: '1555'
    highlight_event_id: guji-薛己-event-late
  decisions:
  - date: '1529'
    title_zh: 以医案体例著内科摘要明辨虚实
    rationale: 空谈经义易误后学惟据实案示补中益气六味八味之验方能使人信温补之功
  - date: '1540'
    title_zh: 坚持温补立论不附和攻伐时习
    rationale: 时医喜用搜风天麻愈风寒凉败毒致人夭枉必当力排众议独守扶正保元之道
events:
- id: guji-薛己-event-birth
  date: '1487'
  year_of: 1487
  title_zh: 生于吴郡薛氏医家
  description: 明成化二十三年生于南直隶吴县父薛铠精医传家学自幼习内经难经及东垣丹溪之书
- id: guji-薛己-event-study
  date: '1505'
  year_of: 1505
  title_zh: 承家学研习补土之法
  description: 青年承父业博览李杲脾胃论朱震亨诸说渐悟脾胃亏损命门火衰为内伤百病之源
- id: guji-薛己-event-taiyiyuan
  date: '1520'
  year_of: 1520
  title_zh: 历任太医院治验日著
  description: 以医征入京历太医院院判治车驾王用之卒中州判蒋大用中满等症皆以温补获效名重朝野
- id: guji-薛己-event-neike
  date: '1529'
  year_of: 1529
  title_zh: 撰成内科摘要阐发温补
  description: 辑元气亏损饮食劳倦脾肾虚寒命门火衰诸门医案力陈补中益气八味地黄之用以救寒凉攻伐之弊
- id: guji-薛己-event-late
  date: '1550'
  year_of: 1550
  title_zh: 晚年订书垂训保元气
  description: 晚年家居订正外科枢要女科撮要等书屡戒后学养气血节饮食远帏幕勿轻服搜风寒凉以预防中风
- id: guji-薛己-event-death
  date: '1559'
  year_of: 1559
  title_zh: 卒于嘉靖三十八年
  description: 明嘉靖三十八年卒享年七十三遗书盛行后世尊为温补学派大家明代名医之冠
