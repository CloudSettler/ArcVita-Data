  date: 1548-01-15
  year_of: 1548
  place_zh: 畿辅
  summary: 嘉靖戊申春大司马中丞览家居医录而善之授梓以传范庆作前序
- id: guji-薛己-event-fanglun
  title_zh: 以逍遥归脾补中垂法女科
  date: 1550
  year_of: 1550
  place_zh: 吴中
  summary: 以加味逍遥散归脾汤补中益气汤八珍六味为女科常用垂训后学当求其心
- id: guji-薛己-event-death
  title_zh: 卒于嘉靖年间
  date: 1559
  year_of: 1559
  place_zh: 吴县
  summary: 行医著述一生以仁心医术寿世而终所著女科撮要等书传于后世
