  decisions:
  - date: 1525
    title_zh: 舍寒凉攻伐而用参归术托里
    rationale: 漫肿微痛脓清稀者元气已虚，寒凉则凝滞气血，补胃方能起发收敛
  - date: 1540
    title_zh: 脓成先补后针虚者禁妄泄
    rationale: 气血虚者针泄则气无依附，先补脾胃脓出自退，保全生气
- id: guji-薛己-endeavor-2
  title_zh: 撰述外科枢要垂范后学
  summary: 补陶节庵齐院令之缺，论脉论呕痛生肌去腐，附治验以示指南
