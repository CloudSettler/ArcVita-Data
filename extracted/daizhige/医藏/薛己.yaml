  - 正体科重手法轻脉理，内外如何兼顾贯通
  - 伤科习用寒凉克伐，温补固本如何抉择坚守
  lesson: 肢损于外则气血伤于内，当审虚实而施补泻，预培脾胃以生新肉。
  summary_first_person: 吾名己字新甫，以痈疽承家而贯通诸科，见正体科独无其书，著枢要与类要，立补泻大法，愿学人勿以专门自诿。
