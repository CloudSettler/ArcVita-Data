  - key: closure
    name: 从子师颜守家学雠订刊行
    labels:
      zh:
      - 世家传承
      - 刊刻流布
    start_date: 1571
    highlight_event_id: guji-薛己-event-book
  decisions:
  - date: 1550
    title_zh: 以胃气立论统摄生肌收敛去腐
    rationale: 肌肉脾胃所主，脓溃敛皆由胃气腐化荣养，纯补脾胃胜泛敷生肌
  - date: 1550
    title_zh: 详补五善七恶治法方药
    rationale: 宋齐陶氏有状无因有方未悉，故备人参黄汤十全大补等以全真气
