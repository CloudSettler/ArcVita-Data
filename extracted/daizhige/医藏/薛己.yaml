  date: 1520
  year_of: 1520
  place_zh: 京师
  summary: 承家学入太医院累官院使雅近于儒以活人多而名重一时
- id: guji-薛己-event-nvke-zhengji
  title_zh: 广治妇人经带胎产诸疾
  date: 1530
  year_of: 1530
  place_zh: 吴中
  summary: 诊治经候不调经漏经闭崩带乳痈产后诸症积累大量案验
- id: guji-薛己-event-yilu
  title_zh: 日录所施活者为家居医录
  date: 1540
  year_of: 1540
  place_zh: 吴中
  summary: 将日间所活者述病原详脉候著其方验有所得辄录积汇成帙
- id: guji-薛己-event-wu-spleen
  title_zh: 立补益脾胃调补气血之宗
  date: 1542
  year_of: 1542
  place_zh: 吴中
  summary: 悟脾统血肝藏血之理主张凡下血症须用四君收功慎用寒凉
- id: guji-薛己-event-book
  title_zh: 著成女科撮要上下两卷
  date: 1548
  year_of: 1548
  place_zh: 吴中
  summary: 上卷论经候带下乳痈诸疾下卷论保胎小产保产产后诸疾并附方注
- id: guji-薛己-event-kanxing
