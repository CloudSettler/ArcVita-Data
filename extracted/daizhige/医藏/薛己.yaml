    title_zh: 以贯通之道统诸科
    rationale: 秦越人随俗为变而道无不贯，贯通方能决生死，不囿于专门
  - date: 1532
    title_zh: 先著枢要复刻类要
    rationale: 用心勤而术无不通，备一家言以诏后学，勿以粗工而莫讲
events:
- id: guji-薛己-event-birth
  title_zh: 出生于吴县医家
  date: 1487
  year_of: 1487
  description_zh: 成化二十三年生于苏州吴县，父薛铠精医，承家学尤精痈疽
- id: guji-薛己-event-practice
  title_zh: 贯通诸科治扑伤坠跌
  date: 1515
  year_of: 1515
  description_zh: 正德年间行医，治扑伤坠跌金伤，创先清肝养血次壮脾健胃之法，救血脱烦躁气虚不溃诸危症
- id: guji-薛己-event-book
  title_zh: 著外科枢要与正体类要
  date: 1531
  year_of: 1531
  description_zh: 嘉靖初年著外科枢要，复辑正体主治大法与上下卷治验方药，由陆师道序而刊行
- id: guji-薛己-event-death
  title_zh: 逝世
  date: 1559
  year_of: 1559
  description_zh: 嘉靖三十八年卒，一生处方立论决生定死，固不出调补元气之外
