  name_zh: 薛巳
  names:
    zh: 薛巳
    en: Xue Ji
  lifespan:
    birth:
      date: 1487
      precision: year
      is_circa: false
      raw: 明成化二十三年
    death:
      date: 1559
      precision: year
      is_circa: false
      raw: 明嘉靖三十八年
  birth_date: 1487
  death_date: 1559
  era: 明代
  reign_ref: 成化至嘉靖
  archetype: 温补派医宗
  dilemmas:
  - 温补固本与攻伐祛邪之间如何权衡而不伤正气
  - 家传旧本舛误流传与亲加订正存真之间如何取舍
  lesson: 治病务求本原，直补真阴真阳以滋化源，用古方加减在一味间见神明变化
  summary_first_person: 吾吴县人也，字立斋，本以疡医起家，后以内科得名，平生务求本原，以六味八味补中益气滋化源，校订十六种为七十七卷以惠后学，老竟以疡卒而是非任后人评说
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%96%9B%E6%B0%8F%E5%8C%BB%E6%A1%88.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%96%9B%E6%B0%8F%E5%8C%BB%E6%A1%88.md
endeavors:
- id: guji-薛巳-endeavor-1
  title_zh: 由疡入内开温补一派
  summary: 由疡医转以内科得名，倡元气亏损本原之论，善用参芪归术与六味八味
  phases:
  - key: brewing
    name: 承父铠家学精研疡科
    labels:
      zh: 家学疡科
    start_date: 1500
    highlight_event_id: guji-薛巳-event-birth
  - key: breakthrough
    name: 以内科温补治验显名擅补脾肾
    labels:
      zh: 内科成名
    start_date: 1520
    highlight_event_id: guji-薛巳-event-neike
  - key: climax
    name: 著内科摘要外科枢要阐发本原
    labels:
      zh: 著述立宗
    start_date: 1531
    highlight_event_id: guji-薛巳-event-neike
  - key: closure
    name: 晚年以疡卒留温补得失之辨
    labels:
      zh: 以疡而终
    start_date: 1559
    highlight_event_id: guji-薛巳-event-death
  decisions:
  - date: 1525
    title_zh: 舍攻伐从温补直补化源
    rationale: 目击误用寒凉攻伐伤败胃气，故以补中益气六味八味固根本
  - date: 1531
    title_zh: 守古方加减一味求神明
    rationale: 多用古方出入加减，在一味间权变寒热虚实以存生气
- id: guji-薛巳-endeavor-2
  title_zh: 校订辑刻薛氏医案传真
  summary: 自著九种订旧附说七种，合父铠保婴撮要等成七十七卷，辨坊刻伪益
  phases:
  - key: brewing
    name: 订定王履陈自明钱氏等旧本附己说
    labels:
      zh: 订旧存真
    start_date: 1528
    highlight_event_id: guji-薛巳-event-jike
  - key: breakthrough
    name: 辑自著内科女科保婴口齿正体等九种
    labels:
      zh: 自著集成
    start_date: 1532
    highlight_event_id: guji-薛巳-event-jike
  - key: climax
    name: 合十六种成七十七卷秀水沈氏初刻
    labels:
      zh: 医案初刻
    start_date: 1540
    highlight_event_id: guji-薛巳-event-jike
  - key: closure
    name: 四库收录子部医家类辨伪存原书
    labels:
      zh: 四库定评
    start_date: 1779
    highlight_event_id: guji-薛巳-event-death
  decisions:
  - date: 1535
    title_zh: 附己说于旧本而不没原人
    rationale: 恐旧法舛误误人，故存原书而以己验注其旁以明得失
  - date: 1540
    title_zh: 拒坊贾增入十四经发挥等书
    rationale: 坊本滥益以新耳目，故但存原书十六种以全真面
events:
- id: guji-薛巳-event-birth
  title_zh: 出生吴县医家
  date: 1487
  year_of: 1487
  place: 苏州吴县
  description: 明成化二十三年生，父铠为医官，少承家学由疡科入手
- id: guji-薛巳-event-neike
  title_zh: 以内科温补得名撰内科摘要
  date: 1531
  year_of: 1531
  place: 太医院任所
  description: 由疡医转以内科得名，撰内科摘要二卷，治元气亏损内伤外感诸症，善用补中益气六味八味直补真阴真阳
- id: guji-薛巳-event-jike
  title_zh: 辑校薛氏医案十六种七十七卷
  date: 1540
  year_of: 1540
  place: 吴县寓所
  description: 自著内科女科保婴原机启微口齿正体外科枢要疠疡机要九种，订定王履陈自明敖氏钱氏及父铠陈文仲七种，合十六种七十七卷付梓
- id: guji-薛巳-event-death
  title_zh: 晚年以疡卒
  date: 1559
  year_of: 1559
  place: 吴县
  description: 明嘉靖三十八年卒，平生本以疡医起家，老竟以疡卒，后人论温补之弊而纪昀等谓不可归罪立斋
