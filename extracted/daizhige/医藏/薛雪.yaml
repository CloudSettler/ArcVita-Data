    start_date: 1765
    highlight_event_id: guji-薛雪-event-shire
  decisions:
  - date: 1740
    title_zh: 治病必求于本
    rationale: 病或在表里寒热皆不外阴阳二气须知重阳必阴重阴必阳之变
  - date: 1754
