  dilemmas:
  - title_zh: 守伤寒古法还是创湿热新论
    description_zh: 吴中湿热为患而古方多宗伤寒若泥古则误人若创新则招谤何去何从
  - title_zh: 求功名还是业医济世
    description_zh: 家世清贵而己身羸弱弃举业而专攻医当以活人为己任不慕荣利
  lesson: 审天时地气察人体质不泥古方以轻清宣透治湿热以活人为归
  summary_first_person: 吾薛雪字生白号一瓢吴县人也少羸多病遂弃儒而究医深察吴中湿热之气著湿热病篇与叶天士齐名门人吴金寿辑吾临证为一瓢医案以存实录
  source_urls:
