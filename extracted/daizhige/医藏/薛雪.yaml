    start_date: 1754
    highlight_event_id: guji-薛雪-event-yijing
  decisions:
  - date: 1750
    title_zh: 不为类经而割裂删述
    rationale: 既非圣经贤传何妨割裂去华存实以便初学熟读精思
  - date: 1754
    title_zh: 广集诸家约取张氏间缀己见
    rationale: 不敢创新立异而义理未畅处须补愚见以畅经旨
- id: guji-薛雪-endeavor-2
  title_zh: 辨治湿热倡导养阴保真
  summary_zh: 以四时阴阳为万物根本春夏养阳秋冬养阴论七损八益与重阴重阳之变别湿热温病以纠时医流弊
  phases:
