  summary_first_person: 吾乃江都袁开昌亦名昌龄幼秉至性以孝友闻弱冠勤学手不释卷湛深经术旁通诸子尤究心岐黄师古而不泥古以活人为怀辑医门辑要著养生三要传家学于子树珊愿后人寡欲慎起居却病延年
