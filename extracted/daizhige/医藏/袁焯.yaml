  lesson: 先议病后议药，详审风土时令体质病因，断证明确而后立法遣方
  summary_first_person: 余江都袁焯字桂生，幼睹亲病危殆庸医误断，遂承伯父昌龄公及家君之学，朝夕研诵参证中西，丁未戊申应试优等后侨寓京口行医，择十年治验仿喻氏体例成丛桂草堂医草，愿以先议病后议药之法振坠绪而存国粹
