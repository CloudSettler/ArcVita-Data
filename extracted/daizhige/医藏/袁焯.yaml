  title_zh: 编成丛桂草堂医草自序于京口
  description: 甲寅夏应家弟济生及知交之请，择平时治验不分门类编次，仿卢氏芷园臆草喻氏寓意草，题曰丛桂草堂医草以供研究
- id: guji-袁焯-event-death
  date: 1945
  year_of: 1945
  type: death
  title_zh: 卒年未详
  description: 行医著述之后事迹未详，约卒于二十世纪中叶，医草流传为后学借镜
  is_circa: true
