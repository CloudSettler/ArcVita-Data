  description: 约生于清光绪年间江都，伯父昌龄公肆力于医，家君继之，家庭忧患坚其习医之志
  is_circa: true
- id: guji-袁焯-event-exam1907
  date: 1907
  year_of: 1907
  type: career
  title_zh: 丁未应两淮盐运使司考试获最优等
  description: 丁未年与友人陈瑞辰等观光医学考试，谬获最优等证书，稍稍为人医治渐有会心
- id: guji-袁焯-event-exam1908
  date: 1908
  year_of: 1908
  type: career
  title_zh: 戊申应两江总督考试获优侨寓京口行医
  description: 戊申年再试优等，遂侨寓京口以医问世，四方人士竞来延诊，益有所考镜
- id: guji-袁焯-event-practice
  date: 1910
  year_of: 1910
  type: career
  title_zh: 京口治温暑霍乱肿胀诸重症
  description: 治陶氏妇肿胀呕吐以三子养亲合二陈加麝香通肺饮，治温病作汗用三黄石膏合陷胸，治霍乱暑厥用白虎合香薷饮，皆先议病后议药而愈
