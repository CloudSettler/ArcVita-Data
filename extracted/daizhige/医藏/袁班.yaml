    name: 得异人授以疲癃为己任
    labels:
      zh:
      - 立志济世
    start_date: 1620
    highlight_event_id: guji-袁班-event-study-medicine
  - key: climax
    name: 折衷诸家随笔记录成心传
    labels:
      zh:
      - 著述心传
    start_date: 1640
    highlight_event_id: guji-袁班-event-complete-xinzhuan
  - key: closure
    name: 史可法阅勘序刊以饷习医者
    labels:
