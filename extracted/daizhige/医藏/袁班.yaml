    start_date: 1643-08
    highlight_event_id: guji-袁班-event-shi-preface-1643
  decisions:
  - date: 1620
    title_zh: 不求仕进专以医济物
    rationale: 才不适于用而济人利物之心不去怀故以天下疲癃为己任运筹之暇医门著述满箧
  - date: 1640
    title_zh: 不摭拾牙慧而折衷发挥
    rationale: 憾今医籍割裂补窜博名无所得故参临证于疑似难明者发挥奥蕴以待质正
- id: guji-袁班-endeavor-2
  title_zh: 临证辨证挽温补之弊济危殆
  summary_zh: 以望闻问切看舌苔为准辨阴阳表里虚实寒热审四时用大剂急下存津以救大实有羸状误补之失
  phases:
  - key: brewing
    name: 叹捷为工立审慎为本
    labels:
      zh:
      - 审慎四诊
    start_date: 1625
    highlight_event_id: guji-袁班-event-study-medicine
  - key: breakthrough
    name: 以舌苔为准悟急下存津
    labels:
      zh:
      - 舌苔下法
    start_date: 1635
    highlight_event_id: guji-袁班-event-complete-xinzhuan
  - key: climax
    name: 明春温冬温秋燥治法历验不爽
    labels:
      zh:
      - 四时温燥
    start_date: 1641
    highlight_event_id: guji-袁班-event-complete-xinzhuan
  - key: closure
    name: 和盘托出心法以挽夭扎
    labels:
      zh:
      - 公布济世
    start_date: 1643-08
    highlight_event_id: guji-袁班-event-shi-preface-1643
  decisions:
  - date: 1635
    title_zh: 见黄腻无津浊苔即用下法
    rationale: 脉有皮苔无皮显而易见大实有羸状惑于假虚误于温补故据浊苔进退以知邪净
  - date: 1641
    title_zh: 大病必用大剂不以轻药代
    rationale: 邪踞里如贼踞畿辅须操必胜之权大黄至一两石膏至五两附子至六钱方克转危为安
