  archetype: 济世良医
  dilemmas:
  - 温补盛行误人多而直斥时弊恐招尤当明言还是隐言之间如何抉择
  - 里实急下可存津转危为安而用兵凶战危之法当守慎审还是求捷之间如何权衡
  - 才如五石之瓠不适于用而欲以医济天下疲癃当幕宾著述还是仕进之间如何自处
  lesson: 明阴阳虚实标本以舌苔为准审慎辨证大实急下存津挽温补之弊方为寿世济人之道
  summary_first_person: 吾居珠湖喜读书达通塞才不适于用早年侍亲疾博究方书深得异人授遂以疲癃为己任折衷诸家参以临证随笔记录成证治心传以明虚实别标本挽温补之失愿后进得之于心应之于手免杀人之名而成生人之术
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%AF%81%E6%B2%BB%E5%BF%83%E4%BC%A0.md
