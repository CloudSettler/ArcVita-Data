  dilemmas:
  - 显贵驸马与潜心医道之间如何自处
  - 运气旧说盛行时敢辨伪存真如何取信于世
  lesson: 邃于医而慎于术，以简切之理卫生济人，功在后世
  summary_first_person: 吾乃河南阳翟褚澄，字彦道，宋武帝甥，仕宋自驸马都尉遍历清显，入齐至侍中领右军将军，少善医术，传杨淳秘方，治豫章王嶷及吴郡李道念鸡子奇疾皆愈，尝答建平王求男之问，晚年笔成遗书十篇论受形本气平脉精血之旨，殁于永明元年，书殉石椁而后因盗发流传于世
  source_urls:
