    labels:
      zh: 临床屡验
    start_date: '0470'
    highlight_event_id: guji-褚澄-event-jianping
  - key: climax
    name: 笔成十篇遗书
    labels:
      zh: 著书立言
    start_date: 0482
    highlight_event_id: guji-褚澄-event-book
  - key: closure
    name: 石椁殉藏复传
    labels:
      zh: 石刻流传
    start_date: 0483
    highlight_event_id: guji-褚澄-event-book
  decisions:
  - date: '0470'
    title_zh: 答建平王求男定向阴阳婚龄
    rationale: 惩早婚阴伤之弊，主三十而娶二十而嫁以全气血，兼访多男妇人以助孕育
  - date: 0482
    title_zh: 辩五运六气托名黄岐之伪
    rationale: 察气变仓猝难预，方说当求理义，不泥甲子运气，欲使后学因言识变观典求鱼
events:
- id: guji-褚澄-event-birth
  date: '0435'
  year_of: 435
  title_zh: 生于河南阳翟褚氏
  description_zh: 宋武帝甥，尚书左仆射湛之子，庐江公主所生，褚渊之弟，少而颖悟，究心医术
- id: guji-褚澄-event-jianping
  date: '0470'
  year_of: 470
  title_zh: 答建平王问子传六男之效
  description_zh: 陈男女交合当其年之法，戒未笄近色之害，王用其言未再期生六男
- id: guji-褚澄-event-yu-wang
  date: 0478
  year_of: 478
  title_zh: 治愈豫章王嶷受擢宠
  description_zh: 齐高帝爱子嶷自江陵赴都疾笃，澄以杨淳秘方召治立愈，帝喜擢为尚书以宠之
- id: guji-褚澄-event-wujun
  date: 0481
  year_of: 481
  title_zh: 守吴郡诊李道念鸡子奇疾
  description_zh: 遥望即知非冷疾乃多食鸡子所致，令煮苏一斗服之吐十三枚鸡雏翅距具而能走，疾乃瘳
- id: guji-褚澄-event-book
  date: 0482
  year_of: 482
  title_zh: 著成褚氏遗书十篇
  description_zh: 成受形本气平脉津润分体精血除疾审微辩书问子诸篇，明形气血脉痰积虚实之理，自言初决其秘发悟后人
- id: guji-褚澄-event-death
  date: 0483
  year_of: 483
  title_zh: 卒于南齐永明元年
  description_zh: 官至侍中领右军将军而卒，其女后为东昏侯皇后追赠金紫光禄大夫，遗书刻石殉葬，后经盗发萧广护石传世
