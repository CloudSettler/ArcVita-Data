  decisions:
  - date: 0478
    title_zh: 应召以杨淳秘方治豫章王嶷
    rationale: 疾亟赦天下之际挺身施治，全活宗室以报知遇，亦验平生所学
  - date: 0481
    title_zh: 守吴郡勤察民疾
    rationale: 居郡不废望色辨证，欲以一方一诊惠及百姓
- id: guji-褚澄-endeavor-2
  title_zh: 究心医道笔成遗书
  summary_zh: 探形气血脉津润精血之本，辨五运六气之妄，著受形本气平脉等十篇，死后以石刻殉葬，后世因萧氏护石僧录锓梓而传
  phases:
  - key: brewing
    name: 承家学究杨淳方
    labels:
