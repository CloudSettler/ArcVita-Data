person:
  qid: guji-西方子
  name_zh: 西方子
  names:
    zh: 西方子
    en: Xifangzi
  lifespan:
    birth:
      date: 约1270
      precision: year
      is_circa: true
      raw: 元初约生
    death:
      date: 约1340
      precision: year
      is_circa: true
      raw: 元末约卒
  birth_date: 约1270
  death_date: 约1340
  era: 元代
  reign_ref: 元世祖至元前后
  archetype: 灸医经师
  dilemmas:
  - 明堂旧经传写异同当如何考订取舍
  - 可灸不可灸之禁当如何明示以全性命
  lesson: 审穴分经，明灸壮禁数，方能以小炷济大患而不伤人。
  summary_first_person: 吾西方子，元时业医，考明堂铜人之旧，绘正人头面胸腹之图，定三十六穴及胸膺腹肚诸穴灸壮禁宜，以传后人。
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%A5%BF%E6%96%B9%E5%AD%90%E6%98%8E%E5%A0%82%E7%81%B8%E7%BB%8F.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%A5%BF%E6%96%B9%E5%AD%90%E6%98%8E%E5%A0%82%E7%81%B8%E7%BB%8F.md
endeavors:
- id: guji-西方子-endeavor-1
  title_zh: 编定正人头面三十六穴灸法
  summary: 考头部中行及面部五行诸穴，主治头风目眩鼻衄口僻，明灸壮多寡与禁忌。
  phases:
  - key: brewing
    name: 搜集明堂旧文考订头面穴位
    labels:
      zh: 酝酿
    start_date: 1290
    highlight_event_id: guji-西方子-event-1
  - key: breakthrough
    name: 定头面三十六穴分行取法
    labels:
      zh: 突破
    start_date: 1295
    highlight_event_id: guji-西方子-event-1
  - key: climax
    name: 详定各穴壮数主治成篇
    labels:
      zh: 高潮
    start_date: 1300
    highlight_event_id: guji-西方子-event-1
  - key: closure
    name: 附西方子曰禁灸之论付传
    labels:
      zh: 收束
    start_date: 1302
    highlight_event_id: guji-西方子-event-1
  decisions:
  - date: 1300
    title_zh: 太阳穴断为不可灸
    rationale: 铜人云可灸二壮，恐伤目损神，故断言不可灸以全人
  - date: 1301
    title_zh: 承浆多灸设限防伤阳明
    rationale: 灸多恐伤阳明脉断风不差，故限四十九壮停四五日
- id: guji-西方子-endeavor-2
  title_zh: 编定胸膺腹肚灸经图说
  summary: 绘胸膺腹肚正图，定任脉及旁行诸穴，主咳喘呕逆水肿疝瘕，明禁灸宜灸。
  phases:
  - key: brewing
    name: 考任脉巨阙中脘气海诸穴源流
    labels:
      zh: 酝酿
    start_date: 1303
    highlight_event_id: guji-西方子-event-2
  - key: breakthrough
    name: 分胸博四行腹中三行列穴
    labels:
      zh: 突破
    start_date: 1305
    highlight_event_id: guji-西方子-event-2
  - key: climax
    name: 大定水肿蛊胀淋闭灸法壮数
    labels:
      zh: 高潮
    start_date: 1310
    highlight_event_id: guji-西方子-event-2
  - key: closure
    name: 标鸠尾建里禁灸女子不灸成书
    labels:
      zh: 收束
    start_date: 1312
    highlight_event_id: guji-西方子-event-2
  decisions:
  - date: 1308
    title_zh: 水病专灸水分气海大剂量
    rationale: 水肿鼓胀非大壮不温阳利水，故定七壮至四百壮三百壮
  - date: 1310
    title_zh: 明示鸠尾禁灸石门女子不灸
    rationale: 上关元气下关子嗣，误灸则害命绝育，故特书禁例
events:
- id: guji-西方子-event-birth
  title_zh: 出生于元初
  type: birth
  date: 约1270
  year_of: 1270
  place_zh: 中原
  summary: 西方子约生于元世祖时，少习医方，尤精针灸明堂之学。
- id: guji-西方子-event-1
  title_zh: 撰成卷一头面三十六穴
  type: career
  date: 1300
  year_of: 1300
  place_zh: 中原
  summary: 定头部中行四穴至面部五行五穴，详灸壮主治，辨太阳不可灸。
- id: guji-西方子-event-2
  title_zh: 撰成胸膺腹肚图经
  type: career
  date: 1310
  year_of: 1310
  place_zh: 中原
  summary: 成胸博中央七穴至四行及腹中十五穴诸图，明天突璇玑至会阴灸法禁宜。
- id: guji-西方子-event-death
  title_zh: 卒于元末
  type: death
  date: 约1340
  year_of: 1340
  place_zh: 中原
  summary: 书成流传于世，撰者名氏不详，后世但称西方子明堂灸经。
