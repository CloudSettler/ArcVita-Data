    description_zh: 山居数十年怡然自乐不欲自炫然良善之家式微婴孩疾痛时医束手不得不应请施治
  - title_zh: 著书求名与备遗忘不问世
    description_zh: 广集考证五易其稿非敢问世聊以备遗忘然恐久而失传又愿付剞劂以质世之精医理者
  lesson: 医乃仁术审阴阳顾胃气不执霸剂不炫名目以二十余年亲验活人为实学济世而不求闻达
  summary_first_person: 余名克昌字伦声和州国学生性好医少从东台周舒轩先生深究十余年继增定痘证麻科二书皆已梓行后续成故友毕苍霖未竞之外科证治历试二十余年诊视送药无不获效集成五卷以备遗忘不求闻达但愿穷荒僻壤咸庆生全
