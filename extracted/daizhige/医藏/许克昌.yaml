    title_zh: 续成苍霖未竞之业
    rationale: 苍霖阐发透彻于外证大有裨益甫两卷而卒书成废帙故不敏续成以竟良友之志
  - date: 1810
    title_zh: 以阴阳虚实为端禁霸剂顾胃气
    rationale: 业外科者概用寒凉漫施攻伐伤脾胃而毙命故初起审证消之成脓因势逐之毒尽益不足敛之先顾胃气
  - date: 1831
    title_zh: 存稿不私任借抄刊刻
    rationale: 书成不独擅美必推善于创始之良友若仍携归恐久失传故借副本付剞劂以质世之精医理者
