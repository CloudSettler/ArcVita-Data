  decisions:
  - date: 1765
    title_zh: 往从周舒轩学医
    rationale: 外证痘证生死反掌非比内证可延迟待治闻其精医术故往从学十余年稍知梗概
  - date: 1785
    title_zh: 增著删繁补痘麻二书
    rationale: 郑氏痘证必读虽集腋成裘耿氏麻科明镜残缺过半故分列四篇便于习学以活婴孩
- id: guji-许克昌-endeavor-2
  title_zh: 续补外科证治全书济世
  summary_zh: 因同人毕苍霖著外科证治甫两卷而卒广集诸名家考证访求效方历试二十余年分别阴阳脏腑经络认证医治增内景外因奇证蛊证中毒及应验方共成五卷山居济人四远就医岁无虚日
