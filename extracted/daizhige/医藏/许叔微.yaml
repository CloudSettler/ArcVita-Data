      raw: 宋高宗绍兴二十四年约卒
  birth_date: 1079-01-01
  death_date: 1154-01-01
  era: 宋
  reign_ref: 北宋元祐至南宋绍兴
  archetype: 良医著述者
  dilemmas:
  - 庸医滥用天雄附子燥药补肾而不知护脾全谷气之害
  - 秘验之方私藏自用与公之于世广利众生之抉择
  lesson: 护脾胃以全谷气为治虚之本，集亲验传方而不私藏以利众生
  summary_first_person: 我是许叔微，字知可，真州白沙人，登绍兴进士而精于医，我以谷气生气血为纲，主先补脾胃后调气血，反对妄用燥热补肾，积平生亲验著类证普济本事方前后续集，愿与好事共传
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E6%9C%AC%E4%BA%8B%E6%96%B9%E7%BB%AD%E9%9B%86.md
