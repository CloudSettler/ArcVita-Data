      raw: 约元祐五年前后
    death:
      date: 1154
      precision: year
      is_circa: true
      raw: 约绍兴二十四年
  birth_date: 1080
  death_date: 1154
  era: 宋
  reign_ref: 绍兴
  archetype: 仁心济世良医
  dilemmas:
  - 古人以救人而天畀其道后人以射利而天啬其术立心当在救物还是射利
  - 风证虚实寒热错杂热药愈助风冷药愈伤气如何守中和以抑肝补脾安魂定魄
  lesson: 以救物为心则通神明夺造化验方载其本事方能养生全身利天下与来世
  summary_first_person: 吾年十一百日之间父以时疫母以气中并失怙恃痛里无良医束手待尽及长刻意方书誓以救物为心绍兴待次四明诊董生卧则魂扬断为肝经受邪非心病处真珠丸龙齿安魂而愈戊午在新安亲患风寒湿痹如在空中三服二生散而起每见气中涎潮昏塞急化苏合香丸灌醒然后调治遂集平生验方为普济本事方以普惠含灵
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/普济本事方.md
  - https://daizhige.org/医藏/普济本事方.html
endeavors:
- id: guji-许叔微-endeavor-1
  title_zh: 立志学医以救物为心
  summary: 幼遭家祸痛无良医长而刻意方书临证辨肝魂肺魄亲验诸风而活人
  phases:
  - key: brewing
    name: 幼孤立志
    labels:
      zh: 酿造
    start_date: 1090
    highlight_event_id: guji-许叔微-event-birth
  - key: breakthrough
    name: 四明辨肝魂
    labels:
      zh: 突破
    start_date: 1133
    highlight_event_id: guji-许叔微-event-shaoxing
  - key: climax
    name: 新安自疗取效
    labels:
      zh: 高潮
    start_date: 1138
    highlight_event_id: guji-许叔微-event-wuwu
  - key: closure
    name: 普惠含灵
    labels:
      zh: 收束
    start_date: 1150
    highlight_event_id: guji-许叔微-event-book
  decisions:
  - date: 1133
    title_zh: 断董生为肝经受邪不用心病方
    rationale: 脉见肝虚邪袭肝藏魂卧则魂不得归故扬若离体当入肝安魂而非镇心
  - date: 1138
    title_zh: 亲服二生散并戒煎不熟有大毒
    rationale: 体虚受寒湿身如在空中非汗不解以身试方取效方敢授人
- id: guji-许叔微-endeavor-2
  title_zh: 撰集普济本事方传验于世
  summary: 集家传师授及躬验之方详记病因脉理治验成书十卷以利天下与来世
  phases:
  - key: brewing
    name: 搜集本事
    labels:
      zh: 酿造
    start_date: 1133
    highlight_event_id: guji-许叔微-event-shaoxing
  - key: breakthrough
    name: 立龙齿安魂虎睛定魄之论
    labels:
      zh: 突破
    start_date: 1138
    highlight_event_id: guji-许叔微-event-wuwu
  - key: climax
    name: 编成普济本事方
    labels:
      zh: 高潮
    start_date: 1150
    highlight_event_id: guji-许叔微-event-book
  - key: closure
    name: 医藏流传
    labels:
      zh: 收束
    start_date: 1154
    highlight_event_id: guji-许叔微-event-death
  decisions:
  - date: 1150
    title_zh: 每方必记本事病因治验
    rationale: 空方不足信惟载何人何证何脉何效后学可议可质可守
  - date: 1150
    title_zh: 辨气中不同中风不用大通峻下
    rationale: 母氏气厥被作中风大下而殁故见涎潮昏塞牙噤先以苏合香丸开闭后随虚实寒热调之
events:
- id: guji-许叔微-event-birth
  date: 1080
  year_of: 1080
  title_zh: 生于真州白沙
  description: 约元祐年间生年十一连遭家祸父以时疫母以气中百日并失怙恃
- id: guji-许叔微-event-shaoxing
  date: 1133
  year_of: 1133
  title_zh: 绍兴癸丑待次四明治董生魂扬
  description: 董生卧则魂飞离体惊悸无寐众作心病治不效断为肝经因虚受邪处真珠丸龙齿为佐服月余悉除立安魂定魄之论
- id: guji-许叔微-event-wuwu
  date: 1138
  year_of: 1138
  title_zh: 戊午在新安自患风证服二生散愈
  description: 体虚受寒湿身如在空得张医博士二生散生附子生南星姜煎三服愈并识煎不熟则大毒发肿
- id: guji-许叔微-event-book
  date: 1150
  year_of: 1150
  title_zh: 编成普济本事方
  description: 以救物为心集真珠丸独活汤星附散二生散稀涎散胜金丸续命排风诸方详述中风肝胆筋骨之理序言通神明夺造化普济含灵
- id: guji-许叔微-event-death
  date: 1154
  year_of: 1154
  title_zh: 卒于绍兴年间
  description: 生平以方书救物遗书列于医藏后世奉为验方本事之宗
