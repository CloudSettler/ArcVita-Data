endeavors:
- id: guji-许叔微-endeavor-1
  title_zh: 由儒入医编撰本事方
  summary: 由科举转习医，积累医案，晚岁成类证普济本事方十卷
  phases:
  - key: brewing
    name: 母病惊悸早年习医
    labels:
      zh: 早年习医
    start_date: 1090-01-01
    highlight_event_id: guji-许叔微-event-motherill
  - key: breakthrough
    name: 绍兴进士儒医兼济
    labels:
      zh: 进士及第
    start_date: 1132-01-01
    highlight_event_id: guji-许叔微-event-jinshi
  - key: climax
    name: 四明治董生肝魂案
    labels:
      zh: 验案渐丰
    start_date: 1133-01-01
    highlight_event_id: guji-许叔微-event-dongcase
  - key: closure
    name: 晚岁集成事证方
    labels:
      zh: 成书济世
    start_date: 1150-01-01
    highlight_event_id: guji-许叔微-event-book
  decisions:
  - date: 1133-01-01
    title_zh: 辨肝虚魂散不用心病方
    rationale: 肝藏魂，肝虚受邪则卧魂飞扬，以真珠母入肝为君，龙齿同类安魂，龙齿安魂虎睛定魄各从其类
  - date: 1150-01-01
    title_zh: 集已试方记事实名本事方
    rationale: 取本事诗为例，属词简雅不谐于俗，记医案以证方效，广络原野以冀一获
- id: guji-许叔微-endeavor-2
  title_zh: 精研伤寒诊治传法
  summary: 诊治精诣论救弊笃论，著伤寒相关诸书传法
  phases:
  - key: brewing
    name: 研习仲景脉法伤寒
    labels:
      zh: 研习仲景
    start_date: 1110-01-01
    highlight_event_id: guji-许叔微-event-jinshi
  - key: breakthrough
    name: 中风证治分腑脏经络
    labels:
      zh: 分证明治
    start_date: 1133-01-01
    highlight_event_id: guji-许叔微-event-dongcase
  - key: climax
    name: 著拟伤寒歌治法等书
    labels:
      zh: 著述传法
    start_date: 1145-01-01
    highlight_event_id: guji-许叔微-event-book
  - key: closure
    name: 诸书散佚独存本事方
    labels:
      zh: 存佚流传
    start_date: 1150-01-01
    highlight_event_id: guji-许叔微-event-book
  decisions:
  - date: 1133-01-01
    title_zh: 风中腑宜汗而解久病大剂久效
    rationale: 风中脉则口眼歪斜，中腑则肢体废，中脏则性命危，积习久病非三五盏可攻，须大剂久服加灸取效
  - date: 1145-01-01
    title_zh: 作拟伤寒歌百篇及治法脉图翼仲景
    rationale: 以歌括治法脉图辨类翼伤寒论，便后学持守，惜明以来不甚传布多散佚
events:
- id: guji-许叔微-event-birth
  title_zh: 生于真州
  date: 1080-01-01
  year_of: 1080
  description: 约元祐初生于真州，一说毘陵，一说他州，曾敏行独醒杂志作真州人
- id: guji-许叔微-event-motherill
  title_zh: 元祐庚午母氏气厥见中气之祸
  date: 1090-01-01
  year_of: 1090
  description: 母氏食素气血羸弱，因忧恼气厥牙噤涎潮，里医误作中风下大通丸而殁，遂痛恨中风中气不分杀人，常用苏合香丸先醒后调
- id: guji-许叔微-event-jinshi
  title_zh: 绍兴二年登张九成榜进士第六人
  date: 1132-01-01
  year_of: 1132
  description: 获乡荐春闱不利归舟次平望梦感后更精医，登绍兴二年进士第六人，世称许学士，不知所历何官
- id: guji-许叔微-event-dongcase
  title_zh: 绍兴癸丑待次四明治董生魂飞扬
  date: 1133-01-01
  year_of: 1133
  description: 董生卧则魂离体惊悸无寐众作心病，独诊为肝经因虚受邪，以真珠丸佐龙齿一月而愈，明龙齿安魂虎睛定魄之类
- id: guji-许叔微-event-book
  title_zh: 晚岁成类证普济本事方十卷
  date: 1150-01-01
  year_of: 1150
  description: 取平生已试之方并记事实，兼载经验诸方医案，丸作圆如汉张机旧例，另有拟伤寒歌治法脉图等今多散佚
- id: guji-许叔微-event-death
  title_zh: 卒于绍兴年间
  date: 1154-01-01
  year_of: 1154
  description: 晚岁以本事方行世，诊治之术最为精诣，属词简雅，卒后其书从宋椠钞传
