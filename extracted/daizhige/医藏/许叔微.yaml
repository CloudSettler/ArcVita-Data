endeavors:
- id: guji-许叔微-endeavor-1
  title_zh: 立补脾护胃生血气之法
  summary: 以荣卫脏腑皆出自谷气为宗，主夜半子时肾水旺极偿肾收摄，先补脾开胃进食，后生血化精，制戊巳圆卫真汤等方
  phases:
  - key: brewing
    name: 少时体弱察虚冷之源
    labels:
      zh:
      - 体察
      - 脾胃
    start_date: 1095-01-01
    highlight_event_id: guji-许叔微-event-birth
  - key: breakthrough
    name: 自诊虚证服半夏橘桂而愈
    labels:
      zh:
      - 自疗
      - 悟虚
    start_date: 1110-01-01
    highlight_event_id: guji-许叔微-event-cure-self
  - key: climax
    name: 治十年翻胃妇人及段妇热病取效
    labels:
      zh:
      - 积验
      - 活人
    start_date: 1125-01-01
    highlight_event_id: guji-许叔微-event-cure-cases
  - key: closure
    name: 论定先补脾胃后调气血二法
    labels:
      zh:
      - 立论
      - 传方
    start_date: 1132-01-01
    highlight_event_id: guji-许叔微-event-front
  decisions:
  - date: 1125-01-01
    title_zh: 不补肾燥药而补脾护胃
    rationale: 肾属北方水喜湿恶燥，妄用燥药不能补肾，唯全谷气则气血生而丹田固
  - date: 1132-01-01
    title_zh: 公开戊巳圆卫真汤等方
    rationale: 不欲私为己有，欲传好事以全胃气生肌肉进饮食顺荣卫
- id: guji-许叔微-endeavor-2
  title_zh: 集亲验撰本事方前后续集
  summary: 积三十余医不效之危证与至人所传之方，撰类证普济本事方前集十卷，又续集十卷以补遗，详载虚热风证诸方
  phases:
  - key: brewing
    name: 广收至人秘方累试有验
    labels:
      zh:
      - 搜方
      - 试效
    start_date: 1120-01-01
    highlight_event_id: guji-许叔微-event-cure-cases
  - key: breakthrough
    name: 撰成前集十卷为叶天士所重
    labels:
      zh:
      - 著述
      - 前集
    start_date: 1132-01-01
    highlight_event_id: guji-许叔微-event-front
  - key: climax
    name: 续得暑毒头风中风大风诸方
    labels:
      zh:
      - 补遗
      - 续集
    start_date: 1145-01-01
    highlight_event_id: guji-许叔微-event-sequel
  - key: closure
    name: 续集十卷东传日本得保存
    labels:
      zh:
      - 传世
      - 翻印
    start_date: 1150-01-01
    highlight_event_id: guji-许叔微-event-sequel
  decisions:
  - date: 1132-01-01
    title_zh: 以本事为名记亲验
    rationale: 非空言立论，必言悉试悉验乃载，幸毋忽以取信后医
  - date: 1150-01-01
    title_zh: 前集未载者附于续集与众共之
    rationale: 得之不易不能广利一切则为私，谨附续集使明医叹赏共济
events:
- id: guji-许叔微-event-birth
  type: birth
  date: 1079-01-01
  year_of: 1079
  title_zh: 生于真州白沙
  description: 宋哲宗元祐年间生于真州白沙，字知可，号近泉，后登绍兴进士
- id: guji-许叔微-event-cure-self
  type: career
  date: 1110-01-01
  year_of: 1110
  title_zh: 少年自疗脐腹疗痛
  description: 少年患脐腹疗痛遍服诸家药无效，自诊为虚证，合半夏生姜橘皮桂吴茱萸方，一剂未半顿然痊瘥
- id: guji-许叔微-event-cure-cases
  type: career
  date: 1128-01-01
  year_of: 1128
  title_zh: 治翻胃妇人与热病牙宣诸验
  description: 以人参茯苓附子牡蛎方治四十余妇十年翻胃五七日顿安，以大黄栀子朴硝等方治大侄段妇热病欲死一服立效，以地黄犀角方治仆牙宣口臭二服立愈
- id: guji-许叔微-event-front
  type: career
  date: 1132-01-01
  year_of: 1132
  title_zh: 撰成类证普济本事方前集
  description: 集治诸虚积热风证亲验之方成前集十卷，市上流传为后世研究医学得力之书
- id: guji-许叔微-event-sequel
  type: career
  date: 1150-01-01
  year_of: 1150
  title_zh: 撰成本事方续集十卷
  description: 以前集未载之补脾护胃生血气及暑毒头风中风大风诸方，撰续集十卷，详备过前集，后中土失传而日本刻本存
- id: guji-许叔微-event-death
  type: death
  date: 1154-01-01
  year_of: 1154
  title_zh: 卒于绍兴年间
  description: 南宋高宗绍兴二十四年左右卒，一生以医济世，遗著由裘吉生得日本刻本翻印以饷同道
