endeavors:
- id: guji-许恩普-endeavor-1
  title_zh: 客京十年辨虚实以验案明活法
  summary_zh: 自己丑入京畿诊视巨卿名公以脉舌辨虚实真假不用成方硬套以人参竹叶石膏汤小续命饮十全大补汤等扶正逐邪积累逐年验案刊为许氏医案
  phases:
  - key: brewing
    name: 初入京畿以虚热立信
    labels:
      zh: 初涉京师
    start_date: '1829'
    highlight_event_id: guji-许恩普-event-1829-hudaiqing
  - key: breakthrough
    name: 疑难产症伤寒连起沉疴
    labels:
      zh: 声名渐著
    start_date: '1830'
    highlight_event_id: guji-许恩普-event-1834-lixingruo
  - key: climax
    name: 名公巨卿随手而愈
    labels:
      zh: 誉满京师
    start_date: '1834'
    highlight_event_id: guji-许恩普-event-1834-lixingruo
  - key: closure
    name: 刊许氏医案示人活法
    labels:
      zh: 刊案垂法
    start_date: '1835'
    highlight_event_id: guji-许恩普-event-1835-huoluan
  decisions:
  - date: '1829'
    title_zh: 胡贷青舌黑谵语舍大承气用人参竹叶石膏汤
    rationale: 脉洪而无力不渴姜擦舌即淡乃伤寒化为虚热非实热实结若误攻下则死生反掌故扶正清热引火归原
  - date: '1834'
    title_zh: 李星若夫人腹痛如绞舍寒凉用附子理中加润导
    rationale: 脉沉细系虚寒气结兼九结秘结不可攻下先温中扶阳后加润导通便再灸章门三里以开闭厥
- id: guji-许恩普-endeavor-2
  title_zh: 著辨瘟霍乱论救乙未大疫
  summary_zh: 有感霍乱转筋倾刻无救撰辨瘟论霍乱论以行气活血针刮诸法施散数十万张乙未夏京师大疫救活无算并及小妾家仆皆如法得活
  phases:
  - key: brewing
    name: 撰辨瘟霍乱论明治法
    labels:
      zh: 著论明法
    start_date: '1834'
    highlight_event_id: guji-许恩普-event-1834-lixingruo
  - key: breakthrough
    name: 乙未京师霍乱施救
    labels:
      zh: 大疫施救
    start_date: '1835'
    highlight_event_id: guji-许恩普-event-1835-huoluan
  - key: closure
    name: 施散方论数十万张活人无算
    labels:
      zh: 广施济世
    start_date: '1835'
    highlight_event_id: guji-许恩普-event-1835-huoluan
  decisions:
  - date: '1835'
    title_zh: 乙未大疫不行攻补专行气活血针刮
    rationale: 霍乱转筋急症倾刻无救非寻常寒热虚实可比当开闭通阳行气活血佐针刮以逐秽故刊论施散以救仓猝
  - date: '1835'
    title_zh: 救后戒食米食以防复发
    rationale: 救活之后脾胃大伤谷气难化若早进米粥易致复发不治故严戒饮食以养胃气
events:
- id: guji-许恩普-event-birth
  date: '1780'
  year_of: 1780
  title_zh: 许恩普生于乾隆年间
  description_zh: 清乾隆年间许恩普生后习内难甲乙及仲景后贤诸书尤究名家医案以变化为用
- id: guji-许恩普-event-1829-hudaiqing
  date: '1829'
  year_of: 1829
  title_zh: 己丑治胡贷青虚热伤寒
  description_zh: 己丑京畿道胡贷青舌黑谵语不省人事众拟大承气汤许诊脉洪无力以姜擦舌即淡断为虚热用人参竹叶石膏汤一服见效后舌退铁甲一壳以阴亏调养而愈
- id: guji-许恩普-event-1834-lixingruo
  date: '1834'
  year_of: 1834
  title_zh: 甲午治李星若夫人绞痛垂绝
  description_zh: 甲午戎部李星若夫人腹痛如绞九日不便齿脉俱闭许以虚寒秘结用附子理中加润导通便又风触发厥灸章门虎口三里启齿呷药而苏后小产又以生化加参芪去旧生新而安
- id: guji-许恩普-event-1835-huoluan
  date: '1835-06-01'
  year_of: 1835
  title_zh: 乙未京师霍乱刊论施救
  description_zh: 乙未夏京师霍乱转筋一月死者十数万人许以所刊辨瘟论霍乱论行气活血针刮诸法施散数十万张救活无算小妾亦如法得活惟龚鲁卿不戒米食而亡
- id: guji-许恩普-event-death
  date: '1845'
  year_of: 1845
  title_zh: 许恩普卒于道光后期
  description_zh: 行医京师十年名公巨卿随手而愈者数十家验案刊行后卒于道光后期医案流传为后学楷模
