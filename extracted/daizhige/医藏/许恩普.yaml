  birth_date: '1780'
  death_date: '1845'
  era: 清
  reign_ref: 道光
  archetype: 京师名医
  dilemmas:
  - 众医咸主实热攻下时敢否独断虚热用人参竹叶石膏汤
  - 虚人外感年老气衰时敢否开门逐盗用和解发散而不用温补固守
  - 墨守成法执方临病与广阅验案以明变化之间如何取舍
  lesson: 断证如折狱处方若用兵必先辨虚实寒热不可执方临病当以活法应无穷之变
  summary_first_person: 吾客京十年以辨虚实为要见舌黑谵语而不妄攻见中风痰闭而不妄凉见产后血晕而不作肝风见霍乱转筋而行气活血针刮并施刊验案一卷及辨瘟霍乱之论以示后学以活法
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%AE%B8%E6%B0%8F%E5%8C%BB%E6%A1%88.md
