  summary_first_person: 吾武进费伯雄字晋卿少读灵素伤寒金匮及金元四大家叠遭兵火见老成凋残初学无师承奉医方集解为枕秘漫无别择故先刊医醇剩义标一醇字复就集解所选逐方评论作此医方论但为初学定范围愿学人澹谋利之欲发救人之心行远自迩不惑他歧而已
