    labels:
      zh: 高潮
    start_date: 1865-10
    highlight_event_id: guji-费伯雄-event-2
  - key: closure
    name: 同治四年题序示训
    labels:
      zh: 收束
    start_date: 1865-10
    highlight_event_id: guji-费伯雄-event-2
  decisions:
  - date: 1865-10
    title_zh: 专就集解评论不旁及
    rationale: 乡曲之士奉集解为枕秘故但载一方一论归于简便以便对看自明
  - date: 1865-10
    title_zh: 劝澹利心发救人心
    rationale: 易地以观痛痒相关故以救人为鹄使良心现而畏心生不敢掉以轻心
