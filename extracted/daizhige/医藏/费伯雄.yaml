    rationale: 非但求无过要在义理的当峻能救人即是醇以正初学躐等求奇之弊
  - date: '1864'
    title_zh: 重脾胃守正宗
    rationale: 学难躐等法有正宗先后共途故宗仲景及金元四家为立法之本
- id: guji-费伯雄-endeavor-2
  title_zh: 作医方论评集解正初学
