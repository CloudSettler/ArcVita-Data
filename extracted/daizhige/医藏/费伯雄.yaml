endeavors:
- id: guji-费伯雄-endeavor-1
  title_zh: 弃儒究医参观诸家明和缓
  summary_zh: 束发习举子业无成决然舍去究心灵素自张长沙下迄时彦皆参观求纯粹以精不失和缓者
  phases:
  - key: brewing
    name: 束发习举业
    labels:
      zh: 习举子业东涂西抹
    start_date: 1807
    highlight_event_id: guji-费伯雄-event-birth
  - key: breakthrough
    name: 舍举究心灵素
    labels:
      zh: 决然舍去参观众说
    start_date: 1820
    highlight_event_id: guji-费伯雄-event-study-medicine
  decisions:
  - date: 1820
    title_zh: 决然舍去举业专究医学
    rationale: 东涂西抹迄无所成不如究心灵素以和缓济世
  - date: 1830
    title_zh: 参观仲景以下诸家取醇正
    rationale: 各有专长亦各有偏执求纯粹以精不失和缓之意者不过数人
- id: guji-费伯雄-endeavor-2
  title_zh: 执简驭繁著医醇剩义
  summary_zh: 都数十年所得为医醇二十四卷分六门刻本付祝融后足废追忆十之二三改题医醇剩义付梓
  phases:
  - key: climax
    name: 著成医醇二十四卷
    labels:
      zh: 脉症治理法意执简驭繁
    start_date: 1860
    highlight_event_id: guji-费伯雄-event-yichun
  - key: closure
    name: 追忆残稿成剩义付梓
    labels:
      zh: 左足偏废追忆付梓见一斑
    start_date: 1863-03-01
    highlight_event_id: guji-费伯雄-event-shengyi
  decisions:
  - date: 1860
    title_zh: 辑数十年所得名曰医醇
    rationale: 医学芜杂喜新厌故惟执简驭繁明白指示使后学归于醇正
  - date: 1863-03-01
    title_zh: 从门下请改题医醇剩义付梓
    rationale: 虽非全豹亦见一斑若并此湮没则大负医尚和缓苦心
