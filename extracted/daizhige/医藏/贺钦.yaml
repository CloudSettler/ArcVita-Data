person:
  qid: guji-贺钦
  name_zh: 贺钦
  names:
    zh: 贺钦
    en: He Qin
  lifespan:
    birth:
      date: 1437
      precision: year
      is_circa: true
      raw: 正统二年生世为定海人后以戎籍隶辽东义州卫
    death:
      date: 1510
      precision: year
      is_circa: true
      raw: 正德五年卒年七十四乡人祠之凌溪钓台
  birth_date: 1437
  death_date: 1510
  era: 明
  reign_ref: 成化
  archetype: 笃实行己之理学师儒
  dilemmas:
  - 出仕行道济世与养病守制终养老母难两全
  - 静中涵养为己与躬行化导乡俗救时难偏废
  lesson: 为学不必求高远在主敬以收放心循本然之理而力行久久纯熟心迹相应
  summary_first_person: 余少好学读近思录而大悟作圣之功在反身实践成化登进士为户科给事中见白沙论学即解官执弟子礼归肖像事之杜门医闾十余年以静养端倪弘治辞陕西参议而陈真儒贤才内官礼乐四事屏居四十年以小学家礼教人正德谕散乱卒以全城人皆信服
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/医闾先生集.md
  - https://daizhige.org/医藏/医闾先生集.html
endeavors:
- id: guji-贺钦-endeavor-1
  title_zh: 谏垣悟道师事白沙而归隐
  summary_zh: 由科第入谏垣因读近思录白沙论学而悟为己遂解官师事陈献章归隐医闾静养十余年而得实理
  phases:
  - key: brewing
    name: 少读近思录登成化丙戌进士为户科给事中
    labels:
      zh: 下学省悟
    start_date: 1466
    highlight_event_id: guji-贺钦-event-jinshi
  - key: breakthrough
    name: 见白沙论学叹至性不显而决意求道
    labels:
      zh: 师事白沙
    start_date: 1467
    highlight_event_id: guji-贺钦-event-cong-baisha
  - key: climax
    name: 别白沙归闾山构小斋肖像事之静坐体验
    labels:
      zh: 归隐静养
    start_date: 1468
    highlight_event_id: guji-贺钦-event-guiyin
  - key: closure
    name: 杜门十余年见实理充塞以主敬收放心为宗
    labels:
      zh: 得道守约
    start_date: 1478
    highlight_event_id: guji-贺钦-event-wudao
  decisions:
  - date: 1467
    title_zh: 即日解官执弟子礼事陈献章
    rationale: 世即用我而我奚以为用锋芒当养为深沉和平先求为己端默之实
  - date: 1468
    title_zh: 谢病归隐医闾山下杜门不出
    rationale: 从静中坐养出端倪方有商量自治不赡何暇及人须深造自得
- id: guji-贺钦-endeavor-2
  title_zh: 医闾讲学化俗辞辟全城
  summary_zh: 隐居医闾以躬行小学家礼教人弘治辞陕西参议陈四事正德谕散义州乱卒全城以盛德见信
  phases:
  - key: brewing
    name: 屏居授徒以小学四书躬行为本乡人兴行义
    labels:
      zh: 化导乡里
    start_date: 1480
    highlight_event_id: guji-贺钦-event-jiangxue
  - key: breakthrough
    name: 弘治改元以阁臣荐起陕西参议因母丧恳辞
    labels:
      zh: 荐起恳辞
    start_date: 1488
    highlight_event_id: guji-贺钦-event-cishou
  - key: climax
    name: 上万言疏陈真儒经筵贤才内官祖训礼乐化俗
    labels:
      zh: 陈言四事
    start_date: 1488
    highlight_event_id: guji-贺钦-event-sishi
  - key: closure
    name: 正德括田变起往谕乱卒罗拜解散城赖以全
    labels:
      zh: 全城盛德
    start_date: 1509
    highlight_event_id: guji-贺钦-event-dingluan
  decisions:
  - date: 1488
    title_zh: 以母死守制旧疾未愈上疏恳辞陕西参议
    rationale: 计年较劳浅薄骤升方面义实难安当守礼终丧不敢冒进而及时进言以报恩
  - date: 1509
    title_zh: 扶往东街谕乱卒毋杀人以待原宥
    rationale: 尔等既知悔即不杀人犹可解以诚意动人保里闬全城活命为上
events:
- id: guji-贺钦-event-birth
  date: 1437
  year_of: 1437
  title_zh: 生于定海后隶义州卫
  description: 世居定海后以戎籍隶辽之义州卫遂为辽西人幼岐嶷好学喜读近思录
- id: guji-贺钦-event-jinshi
  date: 1466
  year_of: 1466
  title_zh: 成化二年举进士授户科给事中
  description: 年少好学中乡试第二成化丙戌登进士任户科给事中外官馈遗一概峻却
- id: guji-贺钦-event-cong-baisha
  date: 1467
  year_of: 1467
  title_zh: 师事陈献章解官去
  description: 见陈白沙论学叹至性不显即日解官执弟子礼受教养使深沉和平
- id: guji-贺钦-event-guiyin
  date: 1468
  year_of: 1468
  title_zh: 归隐医闾山下构小斋事白沙像
  description: 别白沙归闾山肖其像夙夜读书随事体验白沙贻书教从静中坐养端倪
- id: guji-贺钦-event-wudao
  date: 1478
  year_of: 1478
  title_zh: 杜门十余年见实理以主敬为宗
  description: 杜门不出十余年乃见实理充塞化机显行为臣尽忠为子尽孝推行冠婚葬祭本然之理
- id: guji-贺钦-event-jiangxue
  date: 1480
  year_of: 1480
  title_zh: 隐居讲学断自小学始
  description: 非吊丧问疾不出日与友生游钓凌溪教人自小学始不愿读小学者无留馆下乡邑兴行义
- id: guji-贺钦-event-cishou
  date: 1488
  year_of: 1488
  title_zh: 弘治改元荐授陕西参议以母忧恳辞
  description: 大学士刘吉等交章荐举授陕西参议抚治商洛母没部檄适至上疏恳辞允辞
- id: guji-贺钦-event-sishi
  date: 1488
  year_of: 1488
  title_zh: 上疏陈经筵真儒荐贤内官礼乐四事
  description: 疏凡万言请博访真儒起陈献章参大政任经筵遵祖训处内官兴礼乐革教坊俗乐报闻
- id: guji-贺钦-event-dingluan
  date: 1509
  year_of: 1509
  title_zh: 正德四年谕散义州乱卒全城
  description: 刘瑾括田守臣贪横民变劫掠相戒毋惊贺黄门钦往谕以不杀人可宥众罗拜解散城中不伤一人边将杀虏报功见钦即吐实不忍欺
- id: guji-贺钦-event-death
  date: 1510
  year_of: 1510
  title_zh: 卒年七十四乡人祠凌溪钓台称医闾先生
  description: 卒后乡人祠之凌溪钓台辽人无老少贵贱至今称医闾先生子士谘乡贡士终身不仕
