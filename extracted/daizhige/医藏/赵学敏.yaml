  - date: 1755
    title_zh: 立拾遗之例不袭纲目
    rationale: 物生既久种类愈繁，近变之产过时罔识，故另立水火诸部以补其阙
  - date: 1765-08
    title_zh: 以答客问为小序
    rationale: 明濒湖虽博犹有可补，烟草燕窝简误之功可证，以塞骈疣之讥
- id: guji-赵学敏-endeavor-2
  title_zh: 博采土俗西法验方
  description: 收春水天萝水诸水，阳火阴火强水刀创水诸火，及诸药露蒸取之法，皆亲询试验乃录
  phases:
