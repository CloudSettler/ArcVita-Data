  decisions:
  - date: 1760
    title_zh: 外来之物验后乃收
    rationale: 强水鼻冲水刀创水虽出西洋，确有拔疔敛创发汗之效，故取其气用以广识
  - date: 1765-08
    title_zh: 凡敏按必究物理
    rationale: 如春水鸣涸扶正，天萝水治肺痈，皆原于土为母露为阴，以明生害必生救之理
events:
- id: guji-赵学敏-event-birth
  date: 1719
  year_of: 1719
  title_zh: 生于钱塘
  description: 清康熙五十八年，生于浙江钱塘，双砚草堂后之主人
- id: guji-赵学敏-event-start
  date: 1750
  year_of: 1750
  title_zh: 发愿拾遗询访土俗
  description: 延天下医流，遍询土俗，远穷僻壤之产，险探仙麓之华，积十余年
- id: guji-赵学敏-event-collect
  date: 1760
  year_of: 1760
  title_zh: 搜得春水天萝诸品
  description: 得鹤庆春水祛疾，丝瓜天萝水治蛾消痰，及金银薄荷玫瑰诸露蒸法，皆验录之
- id: guji-赵学敏-event-preface
  date: 1765-08
  year_of: 1765
  title_zh: 题小序于双砚草堂
  description: 乾隆乙酉八月，以答客问为序，论丁藤吉利禽虫汤液皆待后人补，明拾遗非赘
- id: guji-赵学敏-event-publish
  date: 1775
  year_of: 1775
  title_zh: 拾遗十卷刊传医林
  description: 水火土金诸部分卷著录，附敏按发明，缪氏经疏简误之功并显，医家奉为圭臬
- id: guji-赵学敏-event-death
  date: 1805
  year_of: 1805
  title_zh: 卒于嘉庆年间
  description: 嘉庆十年前后卒，一生拾遗补阙之志，垂惠后世本草学
