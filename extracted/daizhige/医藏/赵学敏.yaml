  - title_zh: 拾遗是否骈疣之赘
    description: 世谓濒湖博极无遗，余当论物生渐繁土产日变，非继者不能宏其用
  - title_zh: 新物土俗当信古还是从今
    description: 霍山石斛于潜白术已变，烟草燕窝强水并至，当亲验色味方敢书之
  lesson: 物久则种繁，医者贵在拾遗补阙，审土俗察色味以救人
  summary_first_person: 余钱塘赵学敏，字恕轩，感濒湖之书虽博而近产日增，故发愿拾遗，延医询俗，辨水火土金诸品，成纲目拾遗十卷以贻后人
