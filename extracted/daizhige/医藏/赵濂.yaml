person:
  qid: guji-赵濂
  name_zh: 赵濂
  names:
    zh: 赵濂
    en: Zhao Lian
  lifespan:
    birth:
      date: 1840-01-01
      precision: year
      is_circa: true
      raw: 清道光末年生人，竹泉其号
    death:
      date: 1905-01-01
      precision: year
      is_circa: true
      raw: 光绪后卒
  birth_date: 1840-01-01
  death_date: 1905-01-01
  era: 清
  reign_ref: 光绪
  archetype: 良医
  dilemmas:
  - 外科多秘术自珍以射利传家，公开则失独得，不公则误生人
  - 医书繁征博引专执一偏，简明则恐人轻，繁博则治多不验
  lesson: 以数十年心瘁搜求前贤义蕴，结合临症经历，化出诸法，务求言显法活方纯，以简治验寿世济人
  summary_first_person: 余不惮数十年心瘁，搜求前贤义蕴，并所历各症情形，更将师传以后化出诸法，汇辑成帙，要使阅者了然心目，未必于医林无小补
  source_urls:
  - https://daizhige.org/医藏/医门补要.html
endeavors:
- id: guji-赵濂-endeavor-1
  title_zh: 外科刀针火针艾针实践
  summary_zh: 得异传银丝艾针与披刀火针之法，治痞块阴疽痈肿喉症耳鼻诸症，慎用火针，活血通络
  phases:
  - key: brewing
    name: 得异传习针灸
    labels:
      zh: 外科实践
    start_date: 1865-01-01
    highlight_event_id: guji-赵濂-event-1
  - key: breakthrough
    name: 化裁银丝艾针火针
    labels:
      zh: 器法创新
    start_date: 1875-01-01
    highlight_event_id: guji-赵濂-event-1
  - key: climax
    name: 广治痈疽喉痹诸症
    labels:
      zh: 临症取验
    start_date: 1885-01-01
    highlight_event_id: guji-赵濂-event-1
  - key: closure
    name: 定刀针施用禁例
    labels:
      zh: 垂戒后人
    start_date: 1895-01-01
    highlight_event_id: guji-赵濂-event-2
  decisions:
  - date: 1875-01-01
    title_zh: 制银丝艾针灸寒湿痹痛
    rationale: 寒湿侵入经络肢体走串酸痛，非针不效，故制银丝灸法以开通气血
  - date: 1885-01-01
    title_zh: 阳痈宜披刀斜刺阴疽宜火针烙
    rationale: 阳痈脓成当泄，阴疽坚肿难脓当温散回阳，故分阴阳而施刀火，误用则闭毒助火
- id: guji-赵濂-endeavor-2
  title_zh: 汇辑医门补要寿世
  summary_zh: 搜求前贤义蕴并历症情形，汇内科外科妇儿时疫诸法，务求简明验便，付梓寿世
  phases:
  - key: brewing
    name: 博览灵素长沙千金外台
    labels:
      zh: 博学精研
    start_date: 1870-01-01
    highlight_event_id: guji-赵濂-event-2
  - key: breakthrough
    name: 师传化出诸法历症验证
    labels:
      zh: 化裁取验
    start_date: 1888-01-01
    highlight_event_id: guji-赵濂-event-2
  - key: climax
    name: 著成医门补要示马培之
    labels:
      zh: 著书寿世
    start_date: 1897-08-01
    highlight_event_id: guji-赵濂-event-2
  - key: closure
    name: 马培之序付剞劂刊行
    labels:
      zh: 刊行流布
    start_date: 1897-08-01
    highlight_event_id: guji-赵濂-event-2
  decisions:
  - date: 1890-01-01
    title_zh: 破外科秘方自珍之例尽泄其法
    rationale: 外科多秘术藏方以射利传家，误人匪浅，故不惮心瘁尽搜奇方手法以灾枣梨
  - date: 1897-08-01
    title_zh: 弃深文绮语务求老妪能解
    rationale: 书多而无补生人之用即谓无书，故撷经之腴搜方之秘，言简治验，使阅者了然心目
events:
- id: guji-赵濂-event-birth
  date: 1840-01-01
  year_of: 1840
  title_zh: 出生
  description_zh: 清道光末年生人，号竹泉，业医三折肱，淹贯灵素越人长沙千金外台及元明诸家
- id: guji-赵濂-event-1
  date: 1875-06-01
  year_of: 1875
  title_zh: 得异传行银丝艾针火针
  description_zh: 得异传制五寸银丝针灸痞块阴疽风寒湿痹，又定披刀泄脓火针烙阴疽之法，活人甚众
- id: guji-赵濂-event-2
  date: 1897-08-01
  year_of: 1897
  title_zh: 著成医门补要马培之作序
  description_zh: 以所著医门补要示孟河马培之，培之读之如诵白香山诗，叹为医林宝筏，属付剞劂，光绪二十三年秋八月作序
- id: guji-赵濂-event-death
  date: 1905-01-01
  year_of: 1905
  title_zh: 逝世
  description_zh: 光绪后卒，遗书医门补要分卷上下，载内外妇儿时疫温病治法方药，流传寿世
