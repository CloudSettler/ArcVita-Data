    title_zh: 外心言道立命门为君
    rationale: 心有形可见非真君，命门无形乃生死之关，故别十二官平等而尊命门
  - date: '1617'
    title_zh: 命书名为医贯
    rationale: 仙炼为丹释传为灯儒明为德皆是一火，一以贯之故名医贯
