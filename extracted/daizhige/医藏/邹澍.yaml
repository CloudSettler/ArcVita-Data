    title_zh: 固辞山林隐逸之举
    rationale: 德薄能鲜长为乡人，抗迹丘园钓弋华誉非所愿
  - date: 1841-01-01
    title_zh: 以序例统诸证主疗
    rationale: 一病一方一药相承，审证用药审药定方必先明主治
