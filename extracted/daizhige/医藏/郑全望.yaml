  decisions:
  - date: '1602-10-01'
    title_zh: 舍汗吐下补益而用温中镇下正气法
    rationale: 瘴为上热下寒外热内寒，汗吐下及升散闭汗皆重虚致死，故遵李法温中镇下且攻且守
  - date: '1609-10-01'
    title_zh: 不秘方而谋梓广传指南
    rationale: 以人命为公，惧告同业不能遍，故详辨证用药宜忌以俟后君子
