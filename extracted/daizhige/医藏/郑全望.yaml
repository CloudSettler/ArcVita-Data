    title_zh: 以伤寒内伤范围自信行医
    rationale: 妄意凡病不出仲景东垣范围而取验一时
- id: guji-郑全望-endeavor-2
  title_zh: 辨治大疫撰瘴疟指南
  summary_zh: 壬寅秋疫疠大作而伤寒内伤疟法治之皆逝，乃得宋李待制瘴疟卫生方而活人无算，万历三十七年编成瘴疟指南谋梓广传
  phases:
