- id: guji-郑全望-event-study-1595
  date: '1595-01-01'
  year_of: 1595
  title_zh: 博览经论自疗内伤瘳
  description_zh: 丁年患内伤诸药罔效，悉取内经难经甲乙经东垣十书伤寒六书及薛氏等书，殊国僻壤奇方怪疾皆沿波溯源推详考索，不知其已瘳已
  place_zh: 信州
  is_circa: true
  raw: 迨丁年尤甚悉取诸书而瘳
- id: guji-郑全望-event-epidemic-1602
  date: '1602-08-01'
  year_of: 1602
  title_zh: 壬寅秋大疫辨证得瘴疟法
  description_zh: 壬寅秋天热入冬不寒四方疫疠大作，证似疟似伤寒似内伤而皆非，以伤寒内伤疟法治者先后逝，惟得宋李待制瘴疟卫生方论证周详用药简易，以一及十百随手应心
  place_zh: 信州乡曲
  raw: 壬寅秋疫疠大作有宋李待制之书在也
- id: guji-郑全望-event-guide-1609
  date: '1609-10-01'
  year_of: 1609
  title_zh: 万历三十七年撰成瘴疟指南
  description_zh: 次瘴疟源委附鄙见，别伤寒内伤诸疟形似，详药饵宜用宜禁验病色可治弗治，编曰瘴疟指南，岁次己酉十月朔撰成谋梓广之
  place_zh: 信州
  raw: 万历三十七年岁次己酉十月朔撰
- id: guji-郑全望-event-death
  date: '1620-01-01'
  year_of: 1620
  title_zh: 万历后卒
  description_zh: 撰成指南梓行后卒于明万历末前后，遗书以辨瘴疟五脏俱病上热下寒之旨传世
  place_zh: 信州
  is_circa: true
  raw: 指南成后卒
