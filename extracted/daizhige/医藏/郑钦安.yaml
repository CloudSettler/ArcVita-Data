  dilemmas:
  - 用药易而识症难，识症易而识阴阳难，似是而非之间稍有不察即误人性命
  - 世医见虚火上冲便滋阴降火，雪地加霜杀人无算，欲挽千古流弊而恐言之不信
  lesson: 识得坎离一阳一阴之真，人身立命之根在先天真阳，扶阳抑阴方为活人之要
  summary_first_person: 余蜀南临邛人也，迁居成都，学医于止唐刘太老夫子，沉潜内经易理仲景之法二十余载，始知阴阳合一之道，愿以扶阳之见补修园之未逮，志在活人
