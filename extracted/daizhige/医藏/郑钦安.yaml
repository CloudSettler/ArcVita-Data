    labels:
      zh:
      - 刊行
      - 活人
    start_date: 1869-12-01
    highlight_event_id: guji-郑钦安-event-book
  decisions:
  - date: 1868-01-01
    title_zh: 决意著书明仲景苦心
    rationale: 诸家言病不道其所以然，言方不探其所以妙，修园虽明透而略有未详，须详言以补其缺
  - date: 1869-10-01
    title_zh: 不揣鄙陋直陈扶阳之见
    rationale: 因志在活人，虽知言妄而不敢隐，愿高明谅之以救庸手雪地加霜之祸
