  decisions:
  - date: 1824-01-01
    title_zh: 迁居成都学医于刘止唐
    rationale: 欲得内经易理仲景真传，非明师指示太极立法之旨不可
  - date: 1845-01-01
    title_zh: 舍滋阴降火专主扶阳抑阴
    rationale: 见虚火上冲实由君火弱阴气僭上，滋阴更助阴盛，惟桂附姜雄烈火方能消阴复阳
- id: guji-郑钦安-endeavor-2
  title_zh: 著医理真传补修园未逮，垂扶阳活人之法
  summary_zh: 以管窥之见详言乾坤化育性命立极气机盈缩阴阳虚实，阐君相二火三焦五运，立辨认阳虚阴虚外感内伤诸篇，同治己巳菊月自序成书
