  title_zh: 师事止唐潜心二十载，悟人身阴阳合一之道
  summary_zh: 迁居成都师从刘止唐，得指示内经周易太极仲景立法之旨，博览医书七十余种，参酌陈修园十三书，专究坎离真阳真阴
