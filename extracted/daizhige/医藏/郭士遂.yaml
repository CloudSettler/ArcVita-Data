endeavors:
- id: guji-郭士遂-endeavor-1
  title_zh: 推原痧脹著玉衡立三法
  summary: 由燕都疫痧見聞而起，遍閱仲景東垣丹溪，搜高曾遺秘，悟刮放藥三法，甲寅成書乙卯刊行
  phases:
  - key: brewing
    name: 遍覽訪道
    labels:
      zh: 求學
    start_date: '1650'
    highlight_event_id: guji-郭士遂-event-travel
  - key: breakthrough
    name: 悟得大綱
    labels:
      zh: 悟道
    start_date: '1673'
    highlight_event_id: guji-郭士遂-event-write
  - key: climax
    name: 甲寅著書
    labels:
      zh: 著述
    start_date: '1674'
    highlight_event_id: guji-郭士遂-event-write
  - key: closure
    name: 乙卯刊行
    labels:
      zh: 刊刻
    start_date: '1675'
    highlight_event_id: guji-郭士遂-event-publish
  decisions:
  - date: '1674'
    title_zh: 以三法兼備定救痧綱
    rationale: 痧在肌膚當刮，在血肉當放，在腸胃經絡當藥，單用一法不能絕根，故立三法以全生
  - date: '1675'
    title_zh: 不秘遺言公諸世
    rationale: 前人無專籍致多坐視其死，恐貽禍無窮，故乙卯自序刊於裕賢堂以廣救
- id: guji-郭士遂-endeavor-2
  title_zh: 續刻補遺治隱伏兼痧
  summary: 玉衡行後兩年痧變隱伏別病，傷人最多，乃偕同人參訂，采異驗續刻以絕復毒
  phases:
  - key: brewing
    name: 異驗搜采
    labels:
      zh: 驗症
    start_date: '1675'
    highlight_event_id: guji-郭士遂-event-publish
  - key: breakthrough
    name: 辨隱伏痧
    labels:
      zh: 辨症
    start_date: '1677'
    highlight_event_id: guji-郭士遂-event-sequel
  - key: climax
    name: 戊午續刻
    labels:
      zh: 續書
    start_date: '1678'
    highlight_event_id: guji-郭士遂-event-sequel
  - key: closure
    name: 傳示四方
    labels:
      zh: 流布
    start_date: '1678'
    highlight_event_id: guji-郭士遂-event-sequel
  decisions:
  - date: '1678'
    title_zh: 續補隱伏兼痧諸驗
    rationale: 兩年來痧隱伏別病中為前書未及，若不續記則醫者仍誤治本病，故略采異驗為集
  - date: '1678'
    title_zh: 戒食熱湯米食以絕根
    rationale: 在表已刮在中已放在內少未消，一吃米飯熱湯即復攻表裏，故立前後禁忌以防復毒
events:
- id: guji-郭士遂-event-birth
  date: '1630'
  year_of: 1630
  title_zh: 生於明末經術之家
  description: 高曾以經術起家，少列宮牆，讀惠鮮懷保而有濟世志
- id: guji-郭士遂-event-travel
  date: '1650'
  year_of: 1650
  title_zh: 鼎革播遷浪遊江淮吳越
  description: 鼎革後羈留武水跋涉秦溪，旅食江淮浪遊吳越，見時行痧脹被禍，造問杏林松隱，參考冊籍
- id: guji-郭士遂-event-write
  date: '1674'
  year_of: 1674
  title_zh: 甲寅歲著玉衡一書
  description: 返棹搜高曾遺秘，推原小兒痧疹之理，日夕究心悟痧脹變端，甲寅偕同人參訂成書
- id: guji-郭士遂-event-publish
  date: '1675'
  year_of: 1675
  title_zh: 乙卯燈月自序刊行
  description: 乙卯燈月自序於裕賢堂，王庭重陽作序，立刮放藥三法，辨表裏涼熱經絡唇舌痧筋
- id: guji-郭士遂-event-sequel
  date: '1678'
  year_of: 1678
  title_zh: 戊午季秋續刻
  description: 兩年痧變更隱伏別病，采異驗續刻，囑西北加倍用藥，飲湯帶冷，大小便宜通
- id: guji-郭士遂-event-death
  date: '1685'
  year_of: 1685
  title_zh: 約卒於康熙後期
  description: 續刻後事蹟不詳，約卒於康熙後期，遺書流傳救百千萬人命
