  dilemmas:
  - 前人未論痧脹之疑與目擊懸命須臾不忍不救之責
  - 刮放速效與內服湯藥孰先孰後之擇
  lesson: 視人如己，推原痧本，刮放藥三法兼備以絕其根
  summary_first_person: 余少列宮牆，慨然有恫恤生民之志，鼎革後播遷江淮吳越，見時行痧脹被禍甚眾，遍訪杏林先輩，參透靈素甲乙以展仲景之意，悟痧脹大綱，著玉衡以公天下，願為愁者解困危者蘇命
  source_urls:
