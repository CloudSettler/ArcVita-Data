  dilemmas:
  - title_zh: 仲景杂病论亡佚当否补述
    description: 前人所述已备而己见疏略，若不速成则道绝，若妄言则误后，故以有所本得于心为断并发愿后贤正其失
  - title_zh: 浅学能否径用仲景峻剂
    description: 桂枝麻黄青龙承气陷胸峻切，明识不逮则须择轻者防误，精深则当一从仲景，权衡在审断而不在苟且
  lesson: 标本相得方能服邪，伤寒入经传变如风驰，贵在明断审三者俱全，守经考源补亡而不欺后
  summary_first_person: 吾河南郭雍，号白云，晚居长阳深山，幼从仲兄子言得闻仲景之书，老而笃好，感其杂病论亡而伤寒理未贯，乃集岐黄迄近代论辨证治千五百余条，分七十余门为补亡论二十卷方药五卷，愿后之君子怜我衰晚而正其失
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E4%BB%B2%E6%99%AF%E4%BC%A4%E5%AF%92%E8%A1%A5%E4%BA%A1%E8%AE%BA.md
