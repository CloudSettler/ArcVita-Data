    highlight_event_id: guji-郭雍-event-compile
  decisions:
  - date: 1180
    title_zh: 尽去世俗妄论唯本上心得中
    rationale: 一言一事上必有所本中必得于心，如天地父母临上，不用欺惑之术
  - date: 1181-03-01
    title_zh: 不逾年略举大纲速成以垂世
    rationale: 行年八十日暮途远，前人述已备，继踵不过书札之力，宁存疏牾以俟后正，不使再亡
- id: guji-郭雍-endeavor-2
  title_zh: 明辨经络证脉守汗下之戒
  summary: 倡经络为先证脉为次，戒妄汗妄下，详两感阴阳交易痉等以补仲景残缺
  phases:
  - key: brewing
    name: 辨伤寒五名与时行岁露
    labels:
      zh: 别中风伤寒湿温热病温病
    start_date: 1180
    highlight_event_id: guji-郭雍-event-teach
  - key: breakthrough
    name: 立汗下先后虚实之法
    labels:
      zh: 先解表乃可下阴阳虚实交错至微
    start_date: 1180-06-01
    highlight_event_id: guji-郭雍-event-teach
  - key: climax
    name: 详两感阴阳交易垂训
    labels:
      zh: 发前人未发令读者心目一清
    start_date: 1181-03-01
    highlight_event_id: guji-郭雍-event-compile
  - key: closure
    name: 长阳医书经朱詹流布
    labels:
      zh: 朱熹跋雠正刊补闽帅广传
    start_date: 1195-05-01
    highlight_event_id: guji-郭雍-event-spread
  decisions:
  - date: 1180-06-01
    title_zh: 初学浅识不用峻剂绝口青龙承气
    rationale: 脉证或误须预为防，思其轻者用之，得不失大意，妄攻则烂胃发斑吉凶在须臾
  - date: 1181-03-01
    title_zh: 治伤寒先识经络后切脉问证
    rationale: 不识经络如冥行，病在太阳反攻少阴则真气受弊，问外证切寸口足以知所在
events:
- id: guji-郭雍-event-birth
  date: 1101
  year_of: 1101
  title_zh: 生于河南
  description: 北宋末生于河南中州，郭氏兄弟后为名医，号白云晚称长阳冲晦
- id: guji-郭雍-event-study
  date: 1140
  year_of: 1140
  title_zh: 从仲兄子言悟仲景学
  description: 仲兄子言通守夷陵秭归，及见常器之康醇道而深得仲景论，雍初闻未领略渐磨至老笃好
- id: guji-郭雍-event-teach
  date: 1180-06-01
  year_of: 1180
  title_zh: 立明断审与汗下先后之训
  description: 言伤寒毒入大经传变如疾风骏马，工在明日传豫判审新故，戒两感并攻神丹甘遂合饮之谬，戒日满自瘥拱手待毙
- id: guji-郭雍-event-compile
  date: 1181-03-01
  year_of: 1181
  title_zh: 淳熙八年暮春自序补亡论成
  description: 集岐黄至近代论辨问答证治千五百余条五万言，分七十余门为论说二十卷方药五卷，辨伤寒名例叙论治法脉法，详两感阴阳交易诸论
- id: guji-郭雍-event-death
  date: 1187
  year_of: 1187
  title_zh: 卒于隐居
  description: 自序后隐于深山穷谷啜菽饮水，约淳熙末卒，后明万历刘世延及清道光徐锦重刻补亡论十九卷存世
- id: guji-郭雍-event-spread
  date: 1195-05-01
  year_of: 1195
  title_zh: 朱熹跋长阳医书闽中刊布
  description: 朱熹道过新喻得谢昌国所藏长阳医书历书，属王汉伯方士繇雠正，闽帅詹元善刊补流布，称分别部居易见可家藏人诵
