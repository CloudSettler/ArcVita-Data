    start_date: 1368-06-01
    highlight_event_id: guji-金疮秘传禁方-event-1
  - key: climax
    name: 十四法治定
    labels:
      zh:
      - 洗拔捺贴夹缚完备
    start_date: 1369-01-01
    highlight_event_id: guji-金疮秘传禁方-event-1
  - key: closure
    name: 采录禁中藏秘
    labels:
      zh:
      - 刘青田集录秘于家
    start_date: 1370-01-01
    highlight_event_id: guji-金疮秘传禁方-event-1
  decisions:
  - date: 1368-06-01
    title_zh: 定一煎洗二相度先后之序
    rationale: 伤有轻重先后失序则气血逆乱，故先洗后拔伸捺正再敷贴
  - date: 1369-01-01
    title_zh: 脑骨破伤禁见风水
    rationale: 水风入脑必发破伤风不可治，故绢片包裹不见风着水
- id: guji-金疮秘传禁方-endeavor-2
  title_zh: 毒箭火毒禁方流布与接骨口诀附益
  summary_zh: 立追毒神楼散箭吸筒药无价千金散生肌寻痛等方，附叶保太仙授接骨临症口诀而外传于世
  phases:
  - key: brewing
    name: 箭火毒变酝酿
    labels:
      zh:
      - 倒须箭火毒走痛
    start_date: 1371-01-01
    highlight_event_id: guji-金疮秘传禁方-event-2
  - key: breakthrough
    name: 追毒吸筒突破
    labels:
      zh:
      - 神楼散配苦竹筒吸毒
    start_date: 1372-01-01
    highlight_event_id: guji-金疮秘传禁方-event-2
  - key: climax
    name: 生肌接骨会通
    labels:
      zh:
      - 生肌散寻痛散五通并立
    start_date: 1375-01-01
    highlight_event_id: guji-金疮秘传禁方-event-3
  - key: closure
    name: 豹斑外传成篇
    labels:
      zh:
      - 文武后裔青囊讨论付梓
    start_date: 1640-01-01
    highlight_event_id: guji-金疮秘传禁方-event-death
  decisions:
  - date: 1372-01-01
    title_zh: 毒箭急服追毒散兼筒吸
    rationale: 毒气入肉必死，内服连翘知母等以托毒，外用竹筒吸出方免内陷
  - date: 1375-01-01
    title_zh: 骨折尖锋必锉平再入
    rationale: 利锋不去则新肉复掀伤口不合流清水脓血，故麻定后锉去再扎缚
events:
- id: guji-金疮秘传禁方-event-birth
  date: 1368-01-01
  year_of: 1368
  title_zh: 太祖命选屡验者采录禁中
  description_zh: 太祖扫荡腥膻亲冒矢石，选中山等随伤制方起死回生者录入禁中为生民立命
  event_type: birth
- id: guji-金疮秘传禁方-event-1
  date: 1369-01-01
  year_of: 1369
  title_zh: 刘青田集禁方定接骨十四法
  description_zh: 定煎洗相度拔伸捺正黑龙散通风流散填夹缚服药再洗再缚之序，详脑骨头骨肩胛金井跨骨手足断续治法
  event_type: endeavor
- id: guji-金疮秘传禁方-event-2
  date: 1372-01-01
  year_of: 1372
  title_zh: 立追毒神楼散箭吸筒药无价千金散
  description_zh: 治毒药箭入肉急服追毒神楼散，更另煎药竹筒吸毒，火燎苦竹枪火毒服无价千金散配香辛散洗生肌散敷
  event_type: endeavor
- id: guji-金疮秘传禁方-event-3
  date: 1375-01-01
  year_of: 1375
  title_zh: 集成生肌寻痛五通及叶仙接骨口诀
  description_zh: 定生肌散加减乳香没药血竭白芨之式，寻痛散治折断，五通治血瘀闷胀，附肠出喉断坠落脱臼颅裂临症巧法
  event_type: endeavor
- id: guji-金疮秘传禁方-event-death
  date: 1644-01-01
  year_of: 1644
  title_zh: 文武后裔与青囊辈讨论外传成篇
  description_zh: 民间罕得传写，幸文武公后裔仰体如天之仁，与业青囊者讨论轩岐，日积月累成帙，开卷先示源流不敢轻滥
  event_type: death
