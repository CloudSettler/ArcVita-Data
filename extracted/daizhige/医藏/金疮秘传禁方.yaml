  title_zh: 禁中金疮接骨体系创立
  summary_zh: 随伤轻重制方，定洗拔伸捺贴缚之序，集成黑龙散风流散等军阵救伤法
  phases:
  - key: brewing
    name: 矢石疮痍酝酿
