  dilemmas:
  - 幼年孤苦寻父尽孝与发愤学医立身之难
  - 小儿脉微难凭外证多变与简易精审辨虚实之难
  - 晚年秘方不轻传与博爱幼幼广惠后世之择
  lesson: 幼幼存仁，辨脏腑虚实寒热，简易精审，不妄汗下攻伐，以保全小儿生气
  summary_first_person: 余钱乙字仲阳，幼孤养于吕氏，学医以自立，五六返寻父迎归奉养，始以颅囟方著山东，后入翰林为医学，专治小儿惊疳吐泻疮疹，括古今而多自得，晚年授方于亲旧，愿幼者免横夭之苦
  source_urls:
  - https://daizhige.org/医藏/小儿药证直诀.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/小儿药证直诀.md
