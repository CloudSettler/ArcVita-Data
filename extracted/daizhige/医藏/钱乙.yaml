  - date: 1065
    title_zh: 积岁迎父归郓奉养
    rationale: 父匿名东游海上不返，虽幼失养，必返迹迎归以全人子之道
  - date: 1082
    title_zh: 受诏治贵主不恃禁方妄下
    rationale: 小儿脏腑柔弱易虚易实，须凭外证辨寒热虚实，不可因贵而峻攻
events:
- id: guji-钱乙-event-birth
  date: 1032
  year_of: 1032
  title_zh: 生于郓州钱塘钱氏
  description: 上世钱塘人与吴越王有属随北家郓，三岁母亡依姑于医吕氏
- id: guji-钱乙-event-yingfu
  date: 1065
  year_of: 1065
  title_zh: 五六返寻父迎归奉养
  description: 年三十余得父所在海上，积岁迎归，乡人感泣赋诗，后七年父寿终丧葬如礼
- id: guji-钱乙-event-hanlin
  date: 1082
  year_of: 1082
  title_zh: 治长公主女授翰林医学赐绯
  description: 元丰中长公主女有疾召视有功，奏授翰林医学，以小儿脉证治法名于时
- id: guji-钱乙-event-wannian
  date: 1110
  year_of: 1110
  title_zh: 晚年传方阎季忠参校集成
  description: 大观前后说证数十条杂方渐传，阎季忠次先后削重复正讹谬，分上中下三卷成小儿药证直诀
- id: guji-钱乙-event-death
  date: 1113
  year_of: 1113
  title_zh: 寿终传术无穷
  description: 以儿科圣手终，吕君无嗣为收葬嫁孤女岁时祭享，遗书惠及幼小
