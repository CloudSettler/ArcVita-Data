    title_zh: 舍成人针砭专攻小儿
    rationale: 目见庸医妄施方药杀儿十常四五，欲以简易精审之法保全幼小
  - date: 1110
    title_zh: 晚年始传说证杂方
    rationale: 年老技益妙，不忍秘藏，欲广博爱幼幼之惠，使后学有纪律可据
- id: guji-钱乙-endeavor-2
  title_zh: 寻父尽孝行医活人立身
  summary: 三岁失怙，三十余五六返寻父迎归，事生母之姑与吕君如亲，丧葬祭享尽礼，以孝义行医取信天下
