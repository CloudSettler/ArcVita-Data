  summary_first_person: 吾吴兴钱峻幼好辑方中年患失血咯血承母命舍功名而矢志医业十余年重购奇方对症亲试积得八百余方癸未旧患复发自料不起遂与友徐芸遍采汇编发愿公世托沈子翁等广施劝布以承先人好善之嘱以全与人为善之志
