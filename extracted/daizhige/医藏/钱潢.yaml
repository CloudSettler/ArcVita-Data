  dilemmas:
  - title_zh: 墨守叔和成注还是直溯仲景原文
    description: 叔和编次舛错无己注释混淆，苟同则误人性命，辨正则得罪前贤
  - title_zh: 以身活千人还是以书传后世
    description: 年老力衰愿大难盈，以有限之身济众，不如阐发圣经令业医者皆能辨疑处方
  lesson: 以素问为经以仲景为纬，辨阴阳分六经，明立法用药之因，方能全天地大德拯生民危殆
  summary_first_person: 余虞山钱潢字天来，承家学而业医，中年犯伤寒续得痛痹九死重生，遂誓活千人，三十年风尘后发箧苦读，先注素问廿篇，再发仲景书钩玄索隐，分经辨证，每方立论，著伤寒溯源集二十二篇，直溯源流，以俟英贤继起
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E4%BC%A4%E5%AF%92%E6%BA%AF%E6%BA%90%E9%9B%86.html
