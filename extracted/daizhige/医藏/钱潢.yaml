endeavors:
- id: guji-钱潢-endeavor-1
  title_zh: 承家学研灵素奠定伤寒根柢
  summary: 童年聆训，罹疾重生后昼夜揣摩，先注素问廿篇以求阴阳发病之本
  phases:
  - key: brewing
    name: 童年承训家学渊源
    labels:
      zh:
      - 家学传承
      - 灵枢素问
    start_date: 1660-01-01
    highlight_event_id: guji-钱潢-event-birth
  - key: breakthrough
    name: 知非罹疾矢愿活人
    labels:
      zh:
      - 伤寒痛痹
      - 矢愿活千人
    start_date: 1690-01-01
    highlight_event_id: guji-钱潢-event-illness-vow
  - key: climax
    name: 注素问廿篇钩玄索隐
    labels:
      zh:
      - 披罗经传
      - 潜心探索
    start_date: 1700-01-01
    highlight_event_id: guji-钱潢-event-zhusu
  decisions:
  - date: 1690-06-01
    title_zh: 病愈立誓治疗千人以报重生
    rationale: 两世食德九死重生，唯活人乃可云酬，故立功报称
  - date: 1700-03-01
    title_zh: 先注素问廿篇然后再读仲景
    rationale: 恐未得经旨，故以素问为经求阴阳发病之本，再发仲景书以明证治
- id: guji-钱潢-endeavor-2
  title_zh: 辨正编次撰成伤寒溯源集
  summary: 以素问为经仲景为纬，摘谬释疑，分太阳三篇阳明三篇，归少阳散乱诸条，考坏病温病治法，共二十二篇仍分十卷
  phases:
  - key: brewing
    name: 发箧陈书奋志苦读
    labels:
      zh:
      - 寒暑无间
      - 爬罗剔抉
    start_date: 1701-01-01
    highlight_event_id: guji-钱潢-event-zhusu
  - key: breakthrough
    name: 辨正六经剖明立法制方
    labels:
      zh:
      - 分经辨证
      - 每方立论
    start_date: 1705-01-01
    highlight_event_id: guji-钱潢-event-shanghan
  - key: closure
    name: 康熙丁亥录存以俟英贤
    labels:
      zh:
      - 直溯源流
      - 编次目录
    start_date: 1707-11-18
    highlight_event_id: guji-钱潢-event-shanghan
  decisions:
  - date: 1705-06-01
    title_zh: 不守成注以仲景之言辨成注之失
    rationale: 道为天下公器民命所系，不直则道不见，故援古证今分经辨证
  - date: 1707-10-01
    title_zh: 仍分十卷共二十二篇并编次目录
    rationale: 旧注杂乱无纪茫然无措，今据仲景原文理清次序，以便寻讨启蒙发覆
