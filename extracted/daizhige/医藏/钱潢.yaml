  title_zh: 康熙丁亥著成伤寒溯源集
  description: 以素问为经仲景为纬，合者择之谬者摘之，共二十二篇仍分十卷，十月既望识于虞山
- id: guji-钱潢-event-death
  type: death
  date: 1725-12-31
  year_of: 1725
  title_zh: 卒于虞山
  description: 以医生人复以书告天下后世之生人者而终
