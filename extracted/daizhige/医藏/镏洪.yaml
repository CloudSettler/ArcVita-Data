  reign_ref: 金世宗至金宣宗
  archetype: 医家
  dilemmas:
  - title_zh: 汗下太过与养阴存命之辨
    description: 伤寒三下热不退，下亦死，不下亦死，须以凉膈解毒养阴退阳，不可妄投温燥。
  - title_zh: 师古方与简便普救之衡
    description: 古方浩繁难用，故撮双解白虎承气凉膈等十七方三十九味，以求百发百中，活人于指掌。
  lesson: 表里寒热当辨缓急，汗吐下须守次第，养阴存阴方能起沉疴。
  summary_first_person: 吾镏洪，绍述河间之学，观伤寒误汗误下多致危殆，故集心要论及余论，约方简治，欲使后学详脉辨证，不失人命。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/河间伤寒心要.md
  - https://daizhige.org/医藏/河间伤寒心要.html
endeavors:
- id: guji-镏洪-endeavor-1
  title_zh: 绍述河间纂集伤寒心要论
  summary: 宗刘完素火热论，定前三日汗后三日下之大法，合小柴胡凉膈天水诸方为和解之宗。
  phases:
  - key: brewing
    name: 究心伤寒博览河间诸书
    labels:
      zh: 河间火热
    start_date: '1185'
    highlight_event_id: guji-镏洪-event-1
  - key: breakthrough
    name: 提纲三法立表里和解
    labels:
      zh: 汗吐下
    start_date: '1195'
    highlight_event_id: guji-镏洪-event-2
  - key: closure
    name: 成书授徒慎宝流传
    labels:
      zh: 心要论成
    start_date: '1200'
    highlight_event_id: guji-镏洪-event-2
  decisions:
  - date: '1195'
    title_zh: 定前汗后下中和解之序
    rationale: 矫误下太早致结胸发黄之弊，以平和宣散为先，防表热乘虚入里。
  - date: '1200'
    title_zh: 以十七方统伤寒全变
    rationale: 撮双解凉膈白虎承气陷胸茵陈栀豉等要方，使学人易辨易用。
- id: guji-镏洪-endeavor-2
  title_zh: 简方活人普救风暑痢疮
  summary: 推伤寒法治暑湿斑黄痢疾疮疡妇人小儿诸证，示白虎加苍术人参及凉膈合四物等变通。
  phases:
  - key: brewing
    name: 察暑湿阳厥似阴之误
    labels:
      zh: 阳厥辨惑
    start_date: '1198'
    highlight_event_id: guji-镏洪-event-3
  - key: climax
    name: 著余论通治杂病妇儿
    labels:
      zh: 余论普惠
    start_date: '1205'
    highlight_event_id: guji-镏洪-event-3
  decisions:
  - date: '1202'
    title_zh: 阳厥极深只用凉膈解毒养阴
    rationale: 身冷脉微乃蓄热怫郁阴耗阳竭，寒热俱不可投，须待脉生汗出再下。
  - date: '1205'
    title_zh: 增余论及病后四方妇儿诸法
    rationale: 汗下后呕咳胃虚及妊娠产后小儿夜啼皆须调理，使伤寒之法旁通众科。
events:
- id: guji-镏洪-event-birth
  title_zh: 降生金世
  date: '1150'
  year_of: 1150
  description: 大定年间生于北方，少长习儒兼嗜医，慕河间刘完素之名。
- id: guji-镏洪-event-1
  title_zh: 师法河间究心伤寒
  date: '1185'
  year_of: 1185
  description: 遍读宣明直格诸书，明五运六气亢害承制之理，专以伤寒汗吐下三法为业。
- id: guji-镏洪-event-2
  title_zh: 纂成河间伤寒心要论
  date: '1200'
  year_of: 1200
  description: 定伤寒心要论寒风暑结胸发黄等篇，列双解小柴胡凉膈大柴胡解毒承气瓜蒂白虎五苓陷胸茵陈栀豉诸方，发明表里次第。
- id: guji-镏洪-event-3
  title_zh: 著余论广及妇儿杂病
  date: '1205'
  year_of: 1205
  description: 作伤寒心要余论，论失下阳厥救阴之法，及白虎加参术止汗虚热，并及痢疾疮疡破伤风妇人玉烛三和诸方小儿益元之用。
- id: guji-镏洪-event-death
  title_zh: 卒于金末
  date: '1220'
  year_of: 1220
  description: 晚年以书授后学，嘱慎宝详辨脉证而用，卒后心要流传不绝。
