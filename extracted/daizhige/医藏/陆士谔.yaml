  place_zh: 江苏青浦
- id: guji-陆士谔-event-riben
  title_zh: 记日本汉医复兴与引地博士来华访道
  date: 1934
  year_of: 1934
  description: 日本解除禁令皇汉医勃兴引地兴五郎来沪苏访道笔录素问灵枢伤寒金匮传真之学论菌与气血壅滞之辨
  place_zh: 上海苏州
- id: guji-陆士谔-event-yao
  title_zh: 姚名达问病记
  date: 1935-04-30
  year_of: 1935
  description: 姚名达为夫人头痛求诊历述西医误断肺病强令打胎终至目昏不治痛陈分经辨证之要以存前车之鉴
  place_zh: 上海霞飞路女子书店及宁波同乡会
- id: guji-陆士谔-event-mafeng
  title_zh: 论麻疯疠风传染与验治法
  date: 1935
  year_of: 1935
  description: 复吕一狂函辨麻疯属恶风疠风蛊风类当有传染详列鼻柱坏皮肤疡溃之源并述验疯纸及土法减轻之术
  place_zh: 上海
- id: guji-陆士谔-event-xiaoshuo
  title_zh: 作小说新中国等启蒙之作
  date: 1910
  year_of: 1910
  description: 以小说预言未来盛世兼以金钢钻报医论鼓吹国医与文学相辅而行
  place_zh: 上海
- id: guji-陆士谔-event-xu
  title_zh: 序国医军阵伤科学概要集成医话
  date: 1936-01-04
  year_of: 1936
  description: 为董志仁王一仁伤科书作序分内因外因不内外因明伤科秘传公世遂成士谔医话之收束
  place_zh: 上海沪寓
- id: guji-陆士谔-event-death
  title_zh: 逝世
  date: 1944
