  dilemmas:
  - 温为寒伏与精亏之争，当从藏精立论还是从伏邪立论
  - 初起似伤寒，当用辛温升散还是辛凉清解
  lesson: 藏精以御温，辛凉清解而预顾阴液
  summary_first_person: 吾为崇明陆延珍，字子贤，体冬藏之旨，辨春温六因，列三十条以示同道，戒辛温升散，主辛凉清解而顾阴液
