endeavors:
- id: guji-陆子贤-endeavor-1
  title_zh: 撰述春温条辨三十条
  description: 辨冬不藏精春必病温，立辛凉清解纲领，分营卫气血论治春温
  phases:
  - key: brewing
    name: 体察冬藏立论
