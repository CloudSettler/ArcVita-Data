    start_date: 1780-01-01
    highlight_event_id: guji-陆子贤-event-chunwen
  - key: breakthrough
    name: 区分温寒营卫
    labels:
      zh: 辨温非伤寒
    start_date: 1790-01-01
    highlight_event_id: guji-陆子贤-event-chunwen
  - key: climax
    name: 列条分治成篇
    labels:
      zh: 三十条成
    start_date: 1800-01-01
    highlight_event_id: guji-陆子贤-event-chunwen
  - key: closure
    name: 垂戒辛温顾阴
    labels:
      zh: 辛凉顾液
    start_date: 1801-01-01
    highlight_event_id: guji-陆子贤-event-chunwen
  decisions:
  - date: 1790-01-01
    title_zh: 弃伏寒邪说从藏精说
    rationale: 肾为生命之本，寒为杀厉中即病，不可伏至春发，故以精亏化火解春温
  - date: 1800-01-01
    title_zh: 初起用辛凉清解不用羌柴升散
    rationale: 木火炙中微寒袭外，宜葛根薄荷大力透表合芩连清里，断太阳入阳明之路
- id: guji-陆子贤-endeavor-2
  title_zh: 构建六因体系付校刊行
  description: 以六因统春温伏暑诸证，撰卷上下，经理校重订以传同道
  phases:
  - key: brewing
    name: 统摄六因纲要
    labels:
      zh: 六因统病
    start_date: 1800-01-01
    highlight_event_id: guji-陆子贤-event-liuyin
  - key: breakthrough
    name: 参合伏暑湿温
    labels:
      zh: 推及伏暑
    start_date: 1805-01-01
    highlight_event_id: guji-陆子贤-event-liuyin
  - key: climax
    name: 著成六因条辨
    labels:
      zh: 全书告成
    start_date: 1810-01-01
    highlight_event_id: guji-陆子贤-event-liuyin
  - key: closure
    name: 付表诗新昀重校
    labels:
      zh: 校刊流传
    start_date: 1815-01-01
    highlight_event_id: guji-陆子贤-event-liuyin
  decisions:
  - date: 1805-01-01
    title_zh: 以藏精奉时贯通四时五脏
    rationale: 奉藏则生长收藏递运无偏，故春温伏暑皆责藏精疏泄，立法在固密
  - date: 1810-01-01
    title_zh: 不揣谫陋列条公世
    rationale: 临症制宜对症发药方不愧司命，故请同道订正罪我以存司命之心
