  decisions:
  - date: 1788-08-01
    title_zh: 水疫施方不拘一家
    rationale: 悯民患寒疫采神农内经难经仲景千金外台诸家精华以时俗浅近语出之起夭札福苍生
  - date: 1803-02-01
    title_zh: 举八脉八证以示易
    rationale: 忧道弗明举显证可见者为据线索在手操纵自如使有病之家胸有成竹可与医周旋辨贤否
- id: guji-陈修园-endeavor-2
  title_zh: 归田授徒刊刻公世
  description_zh: 己卯归田后从游请梓恐过于平易开简便之门每证后节录内经原文以溯源命长孙心典尽刻遗书先刻女科要旨续雕实在易八卷
