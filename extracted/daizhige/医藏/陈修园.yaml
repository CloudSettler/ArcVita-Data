    highlight_event_id: guji-陈修园-event-book
  decisions:
  - date: 1822
    title_zh: 约数十万取一二方约数百言括一二言
    rationale: 畏难者中阻，欺人者分门，取共奉八家名言方治，参他氏斟酌至当
  - date: 1822
    title_zh: 以从治名从众录
    rationale: 知医士受病已深入格不入，不若从其所能从，防其不可从
