    highlight_event_id: guji-陈修园-event-annotation
  decisions:
  - date: 1821
    title_zh: 作金匮要略浅注十卷
    rationale: 叹后学检方茫无涯际，故以浅注明通达，阐五行虚实传变，令业医者有津梁
  - date: 1823
    title_zh: 命子传业并作歌括
    rationale: 遵庭训以韵语便记诵，附行于世，成济世利物之志
