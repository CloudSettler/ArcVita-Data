    start_date: 1815
    highlight_event_id: guji-陈修园-event-death
  decisions:
  - date: 1805
    title_zh: 坚持仲景用药悉遵本经
    rationale: 近世以朱张王李杂说愈疾误人故以经方验本经专长
  - date: 1810
    title_zh: 附会张隐庵叶天士而正其失
    rationale: 隐庵蹈虚天士肤浅取其精实超脱以补己所不敏
