  - date: 1792
    title_zh: 出宰畿辅不废医事
    rationale: 以医佐政，在官在乡皆以活人为心，不为官废医
- id: guji-陈修园-endeavor-2
  title_zh: 归里著书阐金匮要略
  summary: 晚归里中，刊医书数十种，作金匮要略浅注十卷以明通达
