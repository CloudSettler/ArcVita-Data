    start_date: 1822-01-01
    highlight_event_id: guji-陈修园-event-kanke
  decisions:
  - date: 1819-08-01
    title_zh: 每证加录内经原文
    rationale: 恐书过于平易转开简便之门故穷流溯源为中人以上说法学问与年俱进以为难非难以为易非易
  - date: 1821-03-01
    title_zh: 命子尽刻遗书公世
    rationale: 著作甚富不宜私秘承先志福苍生以有待不如无待次第付梓先女科后实在易
events:
- id: guji-陈修园-event-birth
  title_zh: 生于福建长汀
  date: 1753-01-01
  year_of: 1753
  description_zh: 乾隆十八年生于福建长汀名念祖字修园少为秀才即以天下苍生为己任三十余年从事于医
- id: guji-陈修园-event-shiling
  title_zh: 辛酉试令畿辅戊辰再到
  date: 1781-05-01
  year_of: 1781
  description_zh: 辛酉孟夏试令畿辅次年秋回籍读礼戊辰仲春再到畿辅除办公外静坐读书思以医道公于人
- id: guji-陈修园-event-jiyi
  title_zh: 恒山大水寒疫施方全活
  date: 1788-08-01
  year_of: 1788
  description_zh: 任畿辅时恒山大水后民患寒疫施方全活者不少以浅近语按证用药丝毫不爽
- id: guji-陈修园-event-chengshu
  title_zh: 保阳官舍两旬成实在易得汪稼门许可
  date: 1803-02-01
  year_of: 1803
  description_zh: 再到畿辅于保阳官舍两旬成医学实在易八卷举八脉为提纲八证为主仿金匮体例道过江苏中丞汪稼门阅而许可传于海内
- id: guji-陈修园-event-guitian
  title_zh: 己卯归田从游请梓增录内经
  date: 1819-01-01
  year_of: 1819
  description_zh: 己卯归田后从游诸子屡请付梓每证后节录内经原文以示穷流必溯其源与前着迥殊
- id: guji-陈修园-event-kanke
  title_zh: 命子心典开雕实在易
  date: 1821-01-01
  year_of: 1821
  description_zh: 岁辛丑先刻女科要旨四卷续检遗稿命长孙心典缮本开雕医学实在易凡八卷余编嗣出
- id: guji-陈修园-event-death
  title_zh: 卒于道光初年遗书续刊
  date: 1823-01-01
  year_of: 1823
  description_zh: 道光三年卒平生著述十余种伤寒论浅注金匮浅注女科要旨实在易等次第刊行以公于世
