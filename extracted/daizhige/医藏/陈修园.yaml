  dilemmas:
  - 见痰治痰见血治血辈徇时好而害道当何以明道而救苍生
  - 示人以易恐开简便之门守繁难则人不肯读当何以执易归实溯源内经
  lesson: 以八脉定八证病有定名方有定法药有专能易而不苟溯源内经使人开卷了然可辨医贤否
  summary_first_person: 吾陈念祖字修园福建长汀人少以苍生为任辛酉试令畿辅戊辰再到值恒山大水寒疫施方全活遂于保阳官舍两旬成医学实在易八卷举浮沉迟数细大小短长为脉纲表里寒热虚实盛衰为证纲以浅近语示人以易晚年归田命子刊刻以公于世
