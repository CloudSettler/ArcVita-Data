    title_zh: 痛斥纲目杂说独尊本经
    rationale: 纲目泛引无当反掩经旨欲使学人焚去杂书方与言医
  - date: 1803
    title_zh: 遴选常用百余种从所以然发挥
    rationale: 上品多服食之品攻邪须取专长故阙不常用者以便切用
