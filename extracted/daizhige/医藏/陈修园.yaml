    start_date: 1805
    highlight_event_id: guji-陈修园-event-shanghan
  - key: climax
    name: 重订柯注活人百问及金匮浅注
    labels:
      zh: 高峰著述
    start_date: 1810
    highlight_event_id: guji-陈修园-event-shanghan
  - key: closure
    name: 伤寒读金匮读医约医诀成一家言
    labels:
