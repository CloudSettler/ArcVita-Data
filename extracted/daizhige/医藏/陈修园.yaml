    title_zh: 采时方百余首刊示医者
    rationale: 疾疫大作，不恃己术，取时用便方，导众医有法可从，以全活为先
  - date: 1802
    title_zh: 如法延医施治
    rationale: 使受治者不戕其性，必先使治者不谬其方
