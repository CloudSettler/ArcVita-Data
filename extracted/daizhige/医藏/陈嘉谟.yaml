  title_zh: 撰成本草蒙筌十二卷
  description_zh: 嘉靖四十四年前后成书，首列总论发明出产收采藏贮贸易咀片制造气味君臣四气五味七情七方十剂五用修合之要，次分条释药以蒙养初学
