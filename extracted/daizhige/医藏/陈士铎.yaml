  decisions:
  - date: 1687
    title_zh: 述而不作托师传以传世
    rationale: 自谓尼山弟子不敢轻言著作闻二先生教述之而已以避矜奇欺世之嫌而存救世婆心
  - date: 1688
    title_zh: 辨证不辨脉专言易知
    rationale: 辨脉难知不若辨证易知取今人所不敢言古人所未及言者畅辨之使学人易识而治病益精
- id: guji-陈士铎-endeavor-2
  title_zh: 亲试行医济世寿物
  summary: 以亲试过半友朋传诵过三之方救庸医误人之祸临证加减不拘定方以全活人命
  phases:
  - key: brewing
    name: 见庸医误人立志
