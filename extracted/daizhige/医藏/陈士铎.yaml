  dilemmas:
  - 脉理精微而世医不察，用药寡效，何以使人人易知而深入
  - 脏腑兼病而切脉难兼顾，独言五脏可否统摄七腑而治
  lesson: 守约以御繁，辨脏以统腑，察脉合症，乃可起死回生
  summary_first_person: 吾山阴陈士铎，字敬之，号远公，遇异人于燕市，得脉诀之约传，惟愿以三十八字之简，括万病之变，使后学不迷于繁而得其神也
