endeavors:
- id: guji-陈士铎-endeavor-1
  title_zh: 玉河遇岐伯尽传石室秘录
  description: 康熙丁卯客游玉河辨难内经，遇岐天师授秘录抄录一通，又逐门辨难一月尽得一百二十八法
  phases:
  - key: brewing
    name: 少习岐黄遍历宇内
    labels:
      zh:
      - 好游求道
      - 博览医书
    start_date: 1650
    highlight_event_id: guji-陈士铎-event-birth
  - key: breakthrough
    name: 玉河辨难得见秘录
    labels:
      zh:
      - 遇师
      - 得书
    start_date: 1687
    highlight_event_id: guji-陈士铎-event-yuhe-1687
  - key: climax
    name: 袖中传书逐法参悟
    labels:
      zh:
      - 抄录
      - 心悟
    start_date: 1687
    highlight_event_id: guji-陈士铎-event-yuhe-1687
  - key: closure
    name: 辨难内经一月贯通
    labels:
      zh:
      - 贯通
      - 立志著书
    start_date: 1687
    highlight_event_id: guji-陈士铎-event-yuhe-1687
  decisions:
  - date: 1687
    title_zh: 慨然以著书为己任
    rationale: 见秘录而知天地之大，欲变古今向导以救天下，故不辞惊愕而存笥考稽
  - date: 1687
    title_zh: 请益岐伯仲景吕祖华君
    rationale: 恐旨意深邃方法过奇人不信，故求诸真人发明质正异同以归于正
- id: guji-陈士铎-endeavor-2
  title_zh: 阐扬青囊注素问刊布寿世
  description: 以石室秘录即青囊之术决奥阐幽，大壮文澜注素问内经，又不乐自秘而请序刊布以活万世
  phases:
  - key: brewing
    name: 决奥阐幽注素问
    labels:
      zh:
      - 注经
      - 阐幽
    start_date: 1688
    highlight_event_id: guji-陈士铎-event-kanbu-1689
  - key: breakthrough
    name: 吕祖召师同游燕市罄传
    labels:
      zh:
      - 会真
      - 尽传
    start_date: 1688
    highlight_event_id: guji-陈士铎-event-kanbu-1689
  - key: climax
    name: 得一百二十八门具在
    labels:
      zh:
      - 成书
      - 请序
    start_date: 1688
    highlight_event_id: guji-陈士铎-event-kanbu-1689
  - key: closure
    name: 金孝芑等序而刊布海内
    labels:
      zh:
      - 刊布
      - 寿世
    start_date: 1689
    highlight_event_id: guji-陈士铎-event-kanbu-1689
  decisions:
  - date: 1688
    title_zh: 不秘一世而公之万世
    rationale: 习医救一人不如救一世，救一世不如救万世，故存书以待好善如己者
  - date: 1689
    title_zh: 以秘录佐至治寿民
    rationale: 圣人在上轸念疾苦，家户诵而试效，则仰佐至治而灾疠自息
events:
- id: guji-陈士铎-event-birth
  date: 1627
  year_of: 1627
  title_zh: 生于浙江山阴
  description: 明末生于浙绍山阴陈氏，字敬之，号远公，又号海蟾主人，幼读班马长习黄岐
- id: guji-陈士铎-event-yuhe-1687
  date: 1687
  year_of: 1687
  title_zh: 康熙丁卯玉河遇岐天师得石室秘录
  description: 过玉河辨难内经，岐伯出秘录示之，袖中尽传，抄录一通，又辨难一月，兼得仲景张公吕道人发明
- id: guji-陈士铎-event-kanbu-1689
  date: 1689
  year_of: 1689
  title_zh: 康熙己巳得序刊布石室秘录
  description: 戊辰请序于吕道人，己巳仲秋金以谋题序于义乌，谓青囊未焚之书复传，刊布海内以寿世寿民
- id: guji-陈士铎-event-death
  date: 1707
  year_of: 1707
  title_zh: 卒于清康熙四十六年
  description: 晚年以注素问辨证诸书行世，石室秘录与辨证录等并传，后世奉为青囊嫡传之仁医
