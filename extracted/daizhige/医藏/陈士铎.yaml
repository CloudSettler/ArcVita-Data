endeavors:
- id: guji-陈士铎-endeavor-1
  title_zh: 托岐伯问答撰外经微言
  summary: 以黄帝岐伯伯高雷公等问答，探阴阳颠倒顺逆之原，立五行生克水火既济之旨
  phases:
  - key: brewing
    name: 博览内经留心命根
    labels:
      zh:
      - 积学岐黄
    start_date: 1650
    highlight_event_id: guji-陈士铎-event-study
  - key: breakthrough
    name: 悟得颠倒顺逆之旨
    labels:
      zh:
      - 立论阴阳
    start_date: 1675
    highlight_event_id: guji-陈士铎-event-waijing
  - key: closure
    name: 勒成外经微言九卷
    labels:
      zh:
      - 成书传世
    start_date: 1687
    highlight_event_id: guji-陈士铎-event-waijing
  decisions:
  - date: 1675
    title_zh: 以帝师问答体发微
    rationale: 内经奥义难明，托黄帝问而岐伯答，使至道易入，臣工共闻
  - date: 1687
    title_zh: 首揭颠倒回天生育救母
    rationale: 世人顺生不知逆生，男女无子半由人事，故先论命根天癸以回天命
- id: guji-陈士铎-endeavor-2
  title_zh: 临床辨治调水火济世活人
  summary: 以温补脾肾通肝解郁为纲，治男子九病女子十病及经闭无子诸疾，兼戒红铅纵欲
  phases:
  - key: brewing
    name: 行医江浙验方存心
    labels:
      zh:
      - 临证积累
    start_date: 1660
    highlight_event_id: guji-陈士铎-event-practice
  - key: climax
    name: 辨天癸经闭救母活人
    labels:
      zh:
      - 救母保婴
    start_date: 1680
    highlight_event_id: guji-陈士铎-event-jiumu
  decisions:
  - date: 1680
    title_zh: 治经闭重通肝胆不徒补血
    rationale: 经闭乃肾气郁闭关乎心肝脾，徒补则郁不宣，徒散则气益微，故主疏肝解郁
  - date: 1685
    title_zh: 辨红铅慎欲延寿纵欲丧躯
    rationale: 首经全阴阳之气可益男而损女，必戒纵欲方士之采，方能接命而不害命
events:
- id: guji-陈士铎-event-birth
  date: 1627
  year_of: 1627
  title_zh: 生于山阴
  description: 明末生于浙江绍兴府山阴陈氏，字敬之，号远公，幼多疾而志于医
  type: birth
- id: guji-陈士铎-event-study
  date: 1650
  year_of: 1650
  title_zh: 博览内经探命根养生
  description: 入清以后博览内经，究心精气神与水火既济，悟抱神以静保精之要
  type: career
- id: guji-陈士铎-event-practice
  date: 1660
  year_of: 1660
  title_zh: 行医江浙辨生育诸病
  description: 往来江浙行医，辨男子九不生子之病，女子十不生子之病，以温脾肾通肝郁取效
  type: career
- id: guji-陈士铎-event-jiumu
  date: 1680
  year_of: 1680
  title_zh: 立救母论辨天癸经闭
  description: 论天癸壬癸水火，辨经水非血乃肾气所化，揭肝胆郁闭致经断之机，以解郁救万世之母
  type: career
- id: guji-陈士铎-event-waijing
  date: 1687
  year_of: 1687
  title_zh: 撰成外经微言九卷
  description: 托黄帝岐伯伯高雷公容成问答，成阴阳颠倒顺逆探原回天生育诸篇，勒为外经微言传世
  type: career
- id: guji-陈士铎-event-death
  date: 1707
  year_of: 1707
  title_zh: 卒于康熙年间
  description: 晚年以医著行世，撰述既成，卒于清康熙四十六年前后，遗书惠及后学
  type: death
