    en: Chen Shiduo
  lifespan:
    birth:
      date: 1627
      precision: year
      is_circa: true
      raw: 明崇祯末年生于山阴
    death:
      date: 1707
      precision: year
      is_circa: true
      raw: 清康熙四十六年卒
  birth_date: 1627
  death_date: 1707
  era: 清初
  reign_ref: 康熙
  archetype: 济世医家
  dilemmas:
  - 辨脉幽微难识与辨证显易当以何者为先
  - 师传奇方甚富与临证加减权变当如何守经达权
  - 年过六旬精神衰迈与记忆师传数十万言当如何成帙传世
  lesson: 先辨证候虚实寒热再议方药攻补兼施不拘成方贵在变通
  summary_first_person: 余讳士铎字敬之号远公又号朱华子越之山阴人也，少留心方书本草，壮游五岳喜访异人，丁卯秋客燕市得遇二老尽闻绪论，退而记忆合以亲试，日书数则遂成辨证录十二卷，以辨证不辨脉阐灵素所未备，愿后学触类而长毋按图索骥刻舟求剑也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%BE%A8%E8%AF%81%E5%BD%95.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%BE%A8%E8%AF%81%E5%BD%95.html
