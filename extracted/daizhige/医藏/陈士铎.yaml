  - key: closure
    name: 晚年搜辑求正
    labels:
      zh:
      - 搜辑
      - 求正
    start_date: 1700
    highlight_event_id: guji-陈士铎-event-death
  decisions:
  - date: 1688
    title_zh: 攻补兼施不拘贵药
    rationale: 粤东庸医不论形气擅用桂附参茸杀人故立清补温散下利诸法随节气方舆脉证投药以救偏弊
  - date: 1700
    title_zh: 广搜医籍欲笺外经
    rationale: 恐辨证未备药有轻重方有大小又备载异传诸方并欲笺释外经决寿夭阐生克以益人命
events:
- id: guji-陈士铎-event-birth
  title_zh: 出生山阴好方术之家
  date: 1627
  year_of: 1627
  type: birth
  place_zh: 浙江山阴
  description: 明末生于越中祖父素好方术藏有家传秘本少即留心方书本草不轻服药
- id: guji-陈士铎-event-zhuangyou
  title_zh: 壮游五岳逢异人传书
  date: 1660
  year_of: 1660
  type: achievement
  place_zh: 五岳道途
  description: 壮游五岳每逢异人传刀圭之书颇富兼采越中蒋子羽姚复庵诸先生及亲友余论以备采择
- id: guji-陈士铎-event-yanshi
  title_zh: 丁卯秋燕市遇二老得授
  date: 1687
  year_of: 1687
  type: achievement
  place_zh: 燕市大雅堂
  description: 丁卯秋客燕市黄菊初放遇衣冠伟甚二老共晨夕五月尽闻岐伯仲景辨脉辨证绪论乃可出而著书
- id: guji-陈士铎-event-chengshu
  title_zh: 成辨证录十二卷九十一门
  date: 1688
  year_of: 1688
  type: achievement
  place_zh: 大雅堂
  description: 退而记忆合以所试方日书数则久乃成帙辨论证候均出新裁阐扬灵素所未备亲试过半皆立取奇验
- id: guji-陈士铎-event-death
  title_zh: 晚年勤著述而卒
  date: 1707
  year_of: 1707
  type: death
  place_zh: 山阴
  description: 年过六旬精神衰迈犹勤著述广搜医籍欲笺外经后书由门人余子庵携出得年希尧黄晟等捐俸付梓广行于世
