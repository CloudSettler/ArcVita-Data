  dilemmas:
  - 阐发岐黄幽微而托言岐伯问答，如何使俗医信而好学
  - 论红铅天癸近于方术，如何辨慎欲延寿与纵欲丧躯
  lesson: 顺逆互根，水火相济，守神保精为主，通郁健脾为要，修德以回天命
  summary_first_person: 吾乃山阴陈士铎，字敬之，号远公，早年多病而留心岐黄，托岐伯问答撰外经微言诸书，辨阴阳颠倒顺逆之原，明生育天癸救母之法，欲使世人节欲保精，调水火而全天命
  source_urls:
