person:
  qid: guji-陈复正
  name_zh: 陈复正
  names:
    zh: 陈复正
    en: Chen Fuzheng
  lifespan:
    birth:
      date: 1685
      precision: year
      is_circa: true
      raw: 康熙年间岭南人，以乾隆十五年临证四十余载逆推
    death:
      date: 1760
      precision: year
      is_circa: true
      raw: 乾隆十五年后卒年不详，约为乾隆中叶
  birth_date: 1685
  death_date: 1760
  era: 清
  reign_ref: 乾隆
  archetype: 医者
  dilemmas:
  - 守古成方与因时制宜薄弱时病何从
  - 辟前人惊风谬说与存其精要何以两全
  - 学仙好道出世与借医药济世入世何以自处
  lesson: 正名辨证以活婴幼，删毒劣劫夺之方，因禀赋浓薄制宜，慈幼即为仁术
  summary_first_person: 余陈复正，号飞霞，岭南罗浮学道之人。幼禀亏多病，究心色脉，得仙师授性命之秘，瓢笠云游，借医药济世。痛世医以伤寒杂病误作惊风，妄治夭札婴稚，乃参订幼科诸书，合四十余载临证心得，以搐字易惊字，立误搐类搐非搐三纲，附胎孕乳哺痘麻疮疡火功，汇为六卷，名幼幼集成，愿家置一册，对证调治，以全无辜赤子。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/幼幼集成.md
  - https://daizhige.org/医藏/幼幼集成.html
