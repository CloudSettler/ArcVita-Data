  - key: breakthrough
    name: 以搐易惊立三纲正名
    labels:
      zh: 突破
    start_date: 1740
    highlight_event_id: guji-陈复正-event-theory
  - key: climax
    name: 六卷十万言乾隆十五年成书
    labels:
      zh: 高潮
    start_date: 1750
    highlight_event_id: guji-陈复正-event-book
  - key: closure
    name: 付梓刊行家置一册利人
    labels:
      zh: 收束
    start_date: 1750
    highlight_event_id: guji-陈复正-event-book
  decisions:
  - date: 1745
    title_zh: 以搐字概惊字分三则
    rationale: 伤寒病痉杂病致搐竭脱各异，必正名方可不惑治疗
  - date: 1748
    title_zh: 删毒劣劫夺易以平正
    rationale: 芽嫩之姿不胜霸方，侥幸得生亦耗真元，故去毒劣存仲阳所长
  - date: 1750
    title_zh: 并入伤寒痘疹火功成全璧
    rationale: 幼科本有伤寒痘证，火功为济急第一要务，不可分门遗弃
- id: guji-陈复正-endeavor-2
  title_zh: 罗浮学道云游济世活婴
  summary_zh: 慕道罗浮洞悟性命瓢笠行医贫富不移起垂绝之证
  phases:
  - key: brewing
    name: 少慕冲举学道罗浮
    labels:
      zh: 醸酿
    start_date: 1700
    highlight_event_id: guji-陈复正-event-tao
  - key: breakthrough
    name: 瓢笠云游借医济世
    labels:
      zh: 突破
    start_date: 1710
    highlight_event_id: guji-陈复正-event-wander
  - key: climax
    name: 起他医垂绝之证多奇效
    labels:
      zh: 高潮
    start_date: 1735
    highlight_event_id: guji-陈复正-event-cure
  - key: closure
    name: 以长生妙道作保赤灵丹
    labels:
      zh: 收束
    start_date: 1750
    highlight_event_id: guji-陈复正-event-book
  decisions:
  - date: 1720
    title_zh: 遇窭人不受谢更施参术
    rationale: 天真疏放不随俗俯仰，急病让夷方合老氏慈宝
  - date: 1740
    title_zh: 异授神火绘图作歌公世
    rationale: 旧传火功犯关门逐盗之戒，反有害，故公开正法以回春顷刻
  - date: 1748
    title_zh: 纠阳有余阴不足滥用寒凉
    rationale: 今禀十有九虚，古方今病龃龉，肆用寒凉伤脾败胃，故因时制宜
