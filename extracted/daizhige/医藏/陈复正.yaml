  date: 1710
  year_of: 1710
  title_zh: 瓢笠云游临证
  description: 竹杖芒鞋行方几半，随录方便，临证救治之多非笔楮所能罄，精研指纹三关与面色相参
  place_zh: 海岳内外
- id: guji-陈复正-event-theory
  date: 1745
  year_of: 1745
  title_zh: 立误搐类搐非搐之说
  description: 判伤寒病痉杂病致搐竭脱为三则，以搐字易惊字，彻底揭破惊风谬传
- id: guji-陈复正-event-cure
  date: 1735
  year_of: 1735
  title_zh: 云游起垂绝婴疾
  description: 他医治之垂绝，言可生服药无不活，窭人疗之不受谢，贵富不合招之不可致
- id: guji-陈复正-event-book
  date: 1750-02-01
  year_of: 1750
  title_zh: 幼幼集成成书付梓
  description: 大清乾隆十五年庚午孟春，书于番禺种杏草堂，汇六卷计数十万言，自胎元火功以至杂证麻痘汤火疮疡无不周备
  place_zh: 番禺种杏草堂
- id: guji-陈复正-event-death
  date: 1760
  year_of: 1760
  title_zh: 逝世
  description: 乾隆中叶游情方外而终，具体年不详，遗书行世以保赤
