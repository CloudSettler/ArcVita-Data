    rationale: 儿体属湿土稚阳未充少火赖以生恣用苦寒必伐胃汁致痉厥故当详寒热虚实而适可而止
  - date: 1928-06-01
    title_zh: 决意笔之于书以正视听
    rationale: 儿科专集缺而不全杂而不纯父母唯恐饥寒而致过饱过暖医者误证误药牵缠不解故须举经验之应如桴鼓者成编
