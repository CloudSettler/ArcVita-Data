  decisions:
  - date: '0442-01-01'
    title_zh: 仅取十卷可承案者
    rationale: 方集数百卷多经后人增损伪异，恐畏恶相犯潜害，不如精取十卷临疾可看增损所宜
  - date: '0443-01-01'
    title_zh: 先习短剧后看大品
    rationale: 僮幼始学与居家无师者难解根本经法，先习短剧开悟有渐可速验，后乃渐通大品
- id: guji-陈延之-endeavor-2
  title_zh: 正药性犯禁立随宜变通决
  summary: 发明十七条相反畏恶相犯及合药分两土地人情强弱之决，使临病能去留增损
  phases:
  - key: brewing
    name: 详校旧方犯禁
    labels:
