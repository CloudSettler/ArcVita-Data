      - 辨药
      - 纠谬
    start_date: '0440-01-01'
    highlight_event_id: guji-陈延之-event-pharma
  - key: breakthrough
    name: 立增损合药法度
    labels:
      zh:
      - 制法
      - 因人
    start_date: '0444-01-01'
    highlight_event_id: guji-陈延之-event-pharma
  - key: closure
    name: 垂训后学防急
    labels:
      zh:
      - 教化
      - 济众
    start_date: '0445-01-01'
    highlight_event_id: guji-陈延之-event-pharma
  decisions:
  - date: '0444-01-01'
    title_zh: 却除犯禁药物
    rationale: 如栝蒌恶干姜茯苓恶白蔹甘草反海藻甘遂大戟芫花之类，久服潜伤五内，当据药性去留一种
  - date: '0444-06-01'
    title_zh: 随强弱新久单省重复
    rationale: 病剧久病衰老虚人不胜药宜单省，病轻新病少壮盛气胜药宜重复，江南北江东岭南温凉用温分两亦异，不可一概
events:
