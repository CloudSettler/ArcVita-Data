  place_zh: 中原江南
  description: 晋末丧乱之际降生，少长见民间疾苦无医，遂志于经方本草之学
- id: guji-陈延之-event-collect
  title_zh: 案目搜集诸家旧方
  date: '0430-06-01'
  year_of: 430
  place_zh: 建康秘阁内外
  description: 检秘阁四部书目所载华佗张仲景黄素葛氏阮氏辽东备急杨氏杂方及元嘉中新安羊氏秦氏要方，参以贵家所集，考其源流得失
- id: guji-陈延之-event-pharma
  title_zh: 发明用药犯禁决与合药法
  date: '0444-03-01'
  year_of: 444
  place_zh: 建康
  description: 略举旧方犯经禁十七条，如寒食散栝蒌恶干姜镇心丸茯苓恶白蔹之类，授以去留代用法，又定半夏洗滑乌头炮坼麻黄去节沫及分两准绳与看方救急缓急之要
- id: guji-陈延之-event-compile
  title_zh: 撰成经方短剧小品方十二卷
  date: '0445-08-01'
  year_of: 445
  place_zh: 建康
  description: 撰取十卷可承案旧方，加本草药性要物一卷灸法要穴一卷，合十二卷为一部，首列三焦胸痹痰冷心腹胀满下利咳逆奔豚水肿诸方，以备居家野间临急即用
- id: guji-陈延之-event-death
  title_zh: 辞世留方传后
  date: '0460-01-01'
  year_of: 460
  place_zh: 江南
  description: 晚年以短剧授后学而终，其书后世称小品方，为隋唐经方家所宗
