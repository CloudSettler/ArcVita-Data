  era: 东晋南朝宋之交
  reign_ref: 晋宋元嘉
  archetype: 医经辑验者
  dilemmas:
  - title_zh: 信方说还是究药性
    description: 旧方相承神验之说盛行，然异乡殊气男女长少耐受不同，一概投方多不验，须抉择是直信方说还是深究药性寒温补泻随宜处方
  - title_zh: 博集多方还是精取可案
    description: 自神农黄帝至汉张仲景葛氏范氏诸家方卷浩繁，增损伪异畏恶相犯甚多，须抉择是尽录多方还是删伪存真仅取十卷可承案者以备仓卒
  lesson: 治病终归以药为方，须案经识脉察体，辨寒温补泻，究土地温凉人与气血，随宜增损，方说相应而药物随宜乃可久验
  summary_first_person: 吾观古旧方皆当疾诊候根据药性处方奏为旧典，后人唯信方说不究药性土地长少四时食饮之变，故一概投之多不验，吾乃详诸古方取可承案者十卷，更加本草药性一卷灸法一卷，合为经方短剧十二卷，以开僮幼后学，以备居家野间无师处临急即用
  source_urls:
  - https://daizhige.org/医藏/小品方.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/小品方.md
