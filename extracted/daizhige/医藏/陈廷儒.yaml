  - key: breakthrough
    name: 参天人酌今古成体系
    labels:
      zh:
      - 医学可观
      - 天人参治
    start_date: 1896-01-01
    highlight_event_id: guji-陈廷儒-event-book
  - key: closure
    name: 丁酉付梓广传寿世
    labels:
      zh:
      - 付梓
      - 寿世
    start_date: 1897-09-01
    highlight_event_id: guji-陈廷儒-event-book
  decisions:
  - date: 1896-01-01
    title_zh: 痛斥庸腐不避言过甚
    rationale: 医虽小道性命攸关，不比寻常细故可以含混粉饰，故明知过甚不能自己
  - date: 1897-09-01
    title_zh: 先刊举隅一助后学反三
    rationale: 读一案可贯通寒热虚实同证各病，医学可观未遑删繁，先公一隅之举
events:
- id: guji-陈廷儒-event-birth
  title_zh: 生于阳湖医家
  date: 1850-01-01
  year_of: 1850
  kind: birth
  summary: 清同治初年间生于江苏阳湖，陈氏医家，名廷儒，字匊生
- id: guji-陈廷儒-event-tianjin-rehe
  title_zh: 客天津治张君热病垂危而愈
  date: 1890-07-01
  year_of: 1890
  kind: career
  summary: 庚寅夏客天津，金陵张君病二旬神昏谵语拒按，合白虎承气加元参花粉竹叶芦根急下，服至六十余剂饮西瓜三石而痊
- id: guji-陈廷儒-event-shanghai-chunwen
  title_zh: 客上海治凌母春温夹滞而愈
  date: 1895-03-01
  year_of: 1895
  kind: career
  summary: 乙未春客上海，凌少遗之母年近花甲患春温两旬垂危，诊为邪入营室兼脘中积滞，用羚羊清营汤加枳实继以复脉温补而愈
- id: guji-陈廷儒-event-book
  title_zh: 著成诊余举隅录二卷
  date: 1897-09-01
  year_of: 1897
  kind: career
  summary: 光绪二十三年丁酉仲秋，于倦游之室自记成书，陈允颐柯铬作叙，上卷四时感冒虚脱等，下卷中风痿疟水肿及妇儿诸证
- id: guji-陈廷儒-event-death
  title_zh: 卒于清末
  date: 1905-01-01
  year_of: 1905
  kind: death
  summary: 光绪后卒于乡里，生平以胆大心小知圆行方自励，披窍导窾嘘枯吹生
