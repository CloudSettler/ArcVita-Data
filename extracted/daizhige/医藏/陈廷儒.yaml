    highlight_event_id: guji-陈廷儒-event-tianjin-rehe
  - key: climax
    name: 上海滋阴挽回伏暑
    labels:
      zh:
      - 春温
      - 伏暑
    start_date: 1895-03-01
    highlight_event_id: guji-陈廷儒-event-shanghai-chunwen
  decisions:
  - date: 1890-07-01
    title_zh: 热结拒按急用白虎承气合清下
    rationale: 大热中有结粪，不通下窍则上中二焦清亦无功，迫不得已行釜底抽薪
  - date: 1895-03-01
    title_zh: 春温邪入营室用羚羊清营加枳实
    rationale: 脉虚细而疾苔腻黄，中气未败，救弊补偏，先清营后复脉温补
- id: guji-陈廷儒-endeavor-2
  title_zh: 著述诊余举隅阐发医理
  summary: 诊余偶举一二证引申其说，为后学愤悱启发，痛斥庸腐陋习，成二卷举隅之录
  phases:
  - key: brewing
    name: 观缕往迹随诊札记
    labels:
