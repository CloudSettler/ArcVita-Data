  - 时医守方浅陋而灵素仲景经旨晦而不明
  - 女科难言易谬而室女经闭多转为劳瘵
  lesson: 医者意也，以脾胃统摄血海之信，温通调平以复其常
  summary_first_person: 吾长乐陈念祖字修园，幼读岐黄，穷时医之非而归于至正，以科举出宰邑境，以四诊佐抚字，不秘活人方，手刊群书，晚年殚精于女科，以脾胃论月信之信，独推金匮温经汤为调经神剂，遗命子孙付梓以利世人
