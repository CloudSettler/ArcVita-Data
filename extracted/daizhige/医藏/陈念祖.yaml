endeavors:
- id: guji-陈念祖-endeavor-1
  title_zh: 调经立信撰女科要旨
  summary: 以任通冲盛月信有时为纲，专主脾胃统血，参以阴阳虚实寒热，分调经种子胎前产后杂病，精选古今方而独尊温经汤
  phases:
  - key: brewing
    name: 幼读岐黄穷时医之非
    labels:
      zh:
      - 儒医
      - 穷非归正
    start_date: 1765
    highlight_event_id: guji-陈念祖-event-birth
  - key: breakthrough
    name: 以脾胃释月信得悟调经大法
    labels:
      zh:
      - 月信
      - 脾胃
    start_date: 1790
    highlight_event_id: guji-陈念祖-event-serve
  - key: climax
    name: 讲学井上草堂阐发温经汤妙用
    labels:
      zh:
      - 温经汤
      - 女科讲学
    start_date: 1805
    highlight_event_id: guji-陈念祖-event-teach
  - key: closure
    name: 遗稿授子孙校刻女科要旨
    labels:
      zh:
      - 女科要旨
      - 付梓济世
    start_date: 1820
    highlight_event_id: guji-陈念祖-event-compile
  decisions:
  - date: 1790
    title_zh: 以信字括月事立脾胃为统主
    rationale: 心生血肝藏血而生化在水谷，故虚实用六君平胃，阴阳偏胜以四物加减为纲
  - date: 1805
    title_zh: 独尊金匮温经汤通治闭崩带下
    rationale: 阳明为主寒燥并调，无逐瘀之品而能通能止能育，故不论虚实老少皆可化裁
  - date: 1820
    title_zh: 删繁精选仅存十九方示学人
    rationale: 内经伤寒金匮方始可称方，浅陋之方徒汇药品，故取习用而精炼以复神农伊圣之法
- id: guji-陈念祖-endeavor-2
  title_zh: 注疏伤寒金匮惠泽后学
  summary: 命子侄分注伤寒论浅注金匮要略浅注，剖晰详明，又手刊诸书广行于世，以四诊活人于燕南赵北
  phases:
  - key: brewing
    name: 由儒入医兼通科举吏治
    labels:
      zh:
      - 儒而为医
      - 科举
    start_date: 1775
    highlight_event_id: guji-陈念祖-event-birth
  - key: breakthrough
    name: 出宰邑境以四诊佐抚字
    labels:
      zh:
      - 抚字
      - 四诊活人
    start_date: 1791
    highlight_event_id: guji-陈念祖-event-serve
  - key: climax
    name: 命子侄分注伤寒金匮示来者
    labels:
      zh:
      - 伤寒论浅注
      - 金匮要略浅注
    start_date: 1800
    highlight_event_id: guji-陈念祖-event-teach
  - key: closure
    name: 手刊群书遗属尽刻所著
    labels:
      zh:
      - 刊书济人
      - 家学相承
    start_date: 1815
    highlight_event_id: guji-陈念祖-event-compile
  decisions:
  - date: 1791
    title_zh: 以医道佐吏治不秘活人方
    rationale: 儒者以济人为心，若独知俯视则济人不广，故刊书传方令世利赖
  - date: 1800
    title_zh: 令伯父叔父分任伤寒金匮注疏
    rationale: 伤寒为前集金匮为后集，剖晰详明方能正时医之失而开后学之蒙
  - date: 1815
    title_zh: 嘱后人次第刊行存心济人
    rationale: 先志未竟则为子孙之责，校付攻木以成善承家学之功
