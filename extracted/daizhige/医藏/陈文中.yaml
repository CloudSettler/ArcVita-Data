  - title_zh: 疑似难辨投药恐害
    description: 痘疹初起类伤寒憎寒壮热身痛若误投他药不惟无益抑又害之父母爱子急于救疗医者失察鲜有不夭横者
  - title_zh: 世尚清凉反伤脾胃
    description: 痘出不快多属虚寒若妄用宣利清凉消毒则脏腑受冷荣卫涩滞不能起发充满后不结实多致危殆
  lesson: 痘疹须先分表里虚实寒热虚则温补托里实则清解疏透慎用宣利寒凉以全活幼之心
  summary_first_person: 吾为和安郎判太医局兼翰林良医每思小儿痘疹疑似难辨误治夭横恻然于心故取家藏已验之方集为一卷名曰小儿痘疹方论刻梓流布以广活幼之意
