endeavors:
- id: guji-陈文中-endeavor-1
  title_zh: 集验成书小儿痘疹方论
  summary: 取家藏已验之方参合临证治验论受病之由与表里虚实治要成一卷而刻梓流布
  phases:
  - key: brewing
    name: 蓄方怀恻
    labels:
      zh: 收家藏已验方
    start_date: '1150'
    highlight_event_id: guji-陈文中-event-collect
  - key: breakthrough
    name: 立论辨源
    labels:
      zh: 明三秽液毒之由
    start_date: '1160'
    highlight_event_id: guji-陈文中-event-theory
  - key: climax
    name: 成书刻梓
    labels:
      zh: 方论一卷告成
    start_date: '1170'
    highlight_event_id: guji-陈文中-event-book
  - key: closure
    name: 广传活幼
    labels:
      zh: 流布天下救误治
    start_date: '1175'
    highlight_event_id: guji-陈文中-event-spread
  decisions:
  - date: '1160'
    title_zh: 首论三秽液毒明受病之由
    rationale: 小儿在胎受母五脏液所养母纵浓味辛酸毒物传于胞胎故立五脏六腑秽毒皮膜筋肉秽毒之说并戒葱薤蒜醋酒盐酱腥荤
  - date: '1165'
    title_zh: 立先分表里虚实纲领
    rationale: 表里俱实则易出易靥俱虚反是表实里虚易出难靥故定里虚用木香散表虚用异功散表里俱虚兼用之法
- id: guji-陈文中-endeavor-2
  title_zh: 太医局任职救治痘疹危候
  summary: 以和安郎判太医局兼翰林良医临证救治倒靥泻渴腹胀气促灰白陷伏诸逆候
  phases:
  - key: brewing
    name: 入局历练
    labels:
      zh: 任和安郎判太医局
    start_date: '1145'
    highlight_event_id: guji-陈文中-event-office
  - key: breakthrough
    name: 专治痘疹
    labels:
      zh: 以温补救虚寒
    start_date: '1155'
    highlight_event_id: guji-陈文中-event-cure
  - key: climax
    name: 救逆起废
    labels:
      zh: 表里俱虚用异功散
    start_date: '1165'
    highlight_event_id: guji-陈文中-event-rescue
  - key: closure
    name: 垂训后学
    labels:
      zh: 戒妄用宣利凉药
    start_date: '1172'
    highlight_event_id: guji-陈文中-event-teach
  decisions:
  - date: '1158'
    title_zh: 里虚泻渴腹胀急用木香散
    rationale: 已出未出之间泻渴腹胀气促属里虚真气夺则虚若误用清凉消毒则谷食去多津液枯渴多死故急温补脾肾
  - date: '1168'
    title_zh: 表里俱虚用异功散送肉豆蔻丸
    rationale: 不光泽不起发不红活兼腹胀泻渴气促者属阴阳表里俱虚非大剂温补不能起发红活贯脓结痂
