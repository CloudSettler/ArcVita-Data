  birth_date: '1580'
  death_date: '1660'
  era: 明末清初
  reign_ref: 明末
  archetype: 医者
  dilemmas:
  - 幼科初生危症丛杂而古法散乱何以立简便可守之诀
  - 食积惊疳温清攻补孰先何以不伤脾胃津液
  lesson: 初生护养为先食积乃疳之母以温化和磨为主慎用峻攻寒凉
  summary_first_person: 吾见初生秽毒内蕴而撮口噤风脐风最急惊风疳积吐泻多由食积痰热故以外用益母桃枝沐浴涤形内以茯苓小红小黑抱龙牛黄为纲录成幼科秘诀以全幼稚
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E9%99%88%E6%B0%8F%E5%B9%BC%E7%A7%91%E7%A7%98%E8%AF%80.html
endeavors:
- id: guji-陈氏-endeavor-1
  title_zh: 初生护养与脐风撮噤论治
  summary: 立初生涤秽沐浴之法辨噤风撮口脐风气闭啼哭诸候制小红小黑抱龙牛黄诸方
  phases:
  - key: brewing
    name: 初生见闻积累
    labels:
      zh: 初生沐浴
    start_date: '1600'
    highlight_event_id: guji-陈氏-event-care-primary
  - key: breakthrough
    name: 脐风撮噤法立
    labels:
      zh: 噤风撮口脐风
    start_date: '1620'
    highlight_event_id: guji-陈氏-event-care-primary
  - key: climax
    name: 气闭啼哭治定
    labels:
      zh: 气闭啼哭
    start_date: '1630'
    highlight_event_id: guji-陈氏-event-care-primary
  - key: closure
    name: 初生篇成诀
    labels:
      zh: 初生篇
    start_date: '1640'
    highlight_event_id: guji-陈氏-event-care-primary
  decisions:
  - date: '1620'
    title_zh: 以疏利温化治撮口脐风不用峻攻
    rationale: 里气郁结壅闭不通当疏利开磨兼用小红抱龙以散风化痰全生为要
  - date: '1630'
    title_zh: 气闭七处吸气散毒后方用药
    rationale: 胎毒郁闭腹满不通先以外治行气散毒后以小黑葱白当归散调里
- id: guji-陈氏-endeavor-2
  title_zh: 惊风疳积吐泻食积体系
  summary: 论伤风咳嗽疟吐吐泻霍乱积痢疳惊痫诸症以消食行气开痰化血为纲制肥儿消积芩连芍药等方
  phases:
  - key: brewing
    name: 伤风咳嗽疟吐观察
    labels:
      zh: 伤风咳嗽
    start_date: '1625'
    highlight_event_id: guji-陈氏-event-care-pediatric
  - key: breakthrough
    name: 食积为疳母说立
    labels:
      zh: 积疳
    start_date: '1635'
    highlight_event_id: guji-陈氏-event-care-pediatric
  - key: climax
    name: 惊风吐泻霍乱痢治备
    labels:
      zh: 惊风吐泻霍乱痢
    start_date: '1645'
    highlight_event_id: guji-陈氏-event-care-pediatric
  - key: closure
    name: 幼科秘诀全书成
    labels:
      zh: 幼科秘诀
    start_date: '1650'
    highlight_event_id: guji-陈氏-event-care-pediatric
  decisions:
  - date: '1635'
    title_zh: 未成疳只用温和化开不用寒凉
    rationale: 食积为疳积之根未至疳时用胡黄连银柴胡芦荟反伤脾胃只宜小黑肥儿温化
  - date: '1645'
    title_zh: 痢先下后调气血不用涩药早止
    rationale: 滞下属湿热气滞先以小黑下积后以芩连芍药行血调气久虚方补涩
