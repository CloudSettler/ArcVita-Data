- id: guji-陈直-endeavor-2
  title_zh: 辑养老奉亲书开老年医学
  summary_zh: 集四时调摄食治备急之法分十五篇二百三十三条首创食医先药以饮食调治为本后为邹铉续增合为寿亲养老新书
