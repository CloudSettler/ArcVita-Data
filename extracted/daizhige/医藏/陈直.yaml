    labels:
      zh: 体察老疾
    start_date: 约1075
    highlight_event_id: guji-陈直-event-office
  - key: climax
    name: 留意食治
    labels:
      zh: 以食代药
    start_date: 约1080
    highlight_event_id: guji-陈直-event-book
  - key: closure
