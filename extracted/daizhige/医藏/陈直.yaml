    labels:
      zh: 前守述书
    start_date: 约1085
    highlight_event_id: guji-陈直-event-book
  decisions:
  - date: 约1078
    title_zh: 以养老为政务留意老人饮食起居
    rationale: 老人多病而厌药喜食若能知食性调而用之则倍胜于药故守土者当先察民食
  - date: 约1082
    title_zh: 决意博采方书以成一家养老之法
    rationale: 世无专为老人设食治之书故当采众家法馔以补其阙为子孙奉亲立式
- id: guji-陈直-endeavor-2
  title_zh: 撰养老奉亲书倡食治养老
  summary: 分上籍下籍上籍列食治诸方下籍论调治摄养四时用药集宋代食疗大成开食养老年医学先河
  phases:
  - key: brewing
    name: 博采众书
