  archetype: 仁孝食治医者
  dilemmas:
  - 老人厌药喜食而世医重药轻食当以何法养老治疾
  - 守令政繁而著述养老需博采众书当如何兼顾奉亲济世
  lesson: 善治病不如善慎疾善治药不如善治食先食治后命药
  summary_first_person: 余守兴化见老人之性厌药喜食而其疾慎于吐痢遂采食医心镜食疗本草诠食要法及太平圣惠方诸法类成养老奉亲书分上籍食治下籍摄养愿为人子者知食性而调用之以奉亲养老
