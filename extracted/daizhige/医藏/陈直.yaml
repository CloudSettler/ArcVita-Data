  archetype: 循吏医家养老奉亲之祖
  dilemmas:
  - 礼经养老之文备而医药调治之法缺为人子当何以尽心
  - 高年气血衰弱攻病峻药易危当扶持还是当攻治
  lesson: 养老不在丰厚而在调饮食适寒温慎医药以全天年孝在平时将护
  summary_first_person: 余陈直元丰时为泰州兴化令见世人养老但知奉饮食而不知调摄医药故辑养老奉亲书分十五篇二百三十三条自饮食形证医药以至四时食治备急欲使人子知奉亲养老之要也
