    labels:
      zh: 食治益气诸方
    start_date: 约1083
    highlight_event_id: guji-陈直-event-book
  - key: climax
    name: 论著下籍
    labels:
      zh: 摄养扶持保福
    start_date: 约1085
    highlight_event_id: guji-陈直-event-book
  - key: closure
    name: 书成垂训
    labels:
      zh: 为人子留意奉亲
    start_date: 约1086
    highlight_event_id: guji-陈直-event-book
  decisions:
  - date: 约1083
    title_zh: 立先食治后命药为养老大法
    rationale: 老人之疾慎于吐痢凡有患宜先食治食治未愈然后命药此为养老保真之要
  - date: 约1085
    title_zh: 以五行阴阳统摄食性分门列方
    rationale: 食之五色五味冷热补泻皆禀阴阳五行与药无殊顺逆补泻得法则食胜于药故须分门以治诸疾
