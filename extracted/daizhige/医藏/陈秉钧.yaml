endeavors:
- id: guji-陈秉钧-endeavor-1
  title_zh: 风痹类中肝风临床诊疗
  summary: 青浦行医，诊治中风类中肝风历节游风肩风等，以和养搜风化痰为要法
  phases:
  - key: brewing
    name: 青浦习医初行
    labels:
