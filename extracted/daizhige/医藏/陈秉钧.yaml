      - 习医
      - 行医
    start_date: 1840-01-01
    highlight_event_id: guji-陈秉钧-event-birth
  - key: breakthrough
    name: 立和养搜风之法
    labels:
      zh:
      - 和养
      - 搜风
    start_date: 1850-01-01
    highlight_event_id: guji-陈秉钧-event-practice
  - key: climax
    name: 疑难风瘫从容调治
    labels:
      zh:
      - 风瘫
      - 调治
    start_date: 1858-01-01
    highlight_event_id: guji-陈秉钧-event-tong-case
  - key: closure
    name: 验案积累成法
    labels:
      zh:
      - 验案
      - 成法
    start_date: 1865-01-01
    highlight_event_id: guji-陈秉钧-event-compilation
  decisions:
  - date: 1850-01-01
    title_zh: 以和养为主治风入络
    rationale: 营虚生风气虚生痰，风窜经隧，故不用峻攻而和养营络兼化痰湿
  - date: 1858-01-01
    title_zh: 童案主张间日服药缓针
    rationale: 肝肾两虚兼痰湿当夏令，滋腻温补难进凉解亦忌，故月针一二次从容调治
- id: guji-陈秉钧-endeavor-2
  title_zh: 撰述陈莲舫先生医案
  summary: 汇集平生风劳温热杂病验案，分卷编次，详记脉症方药以传后世
  phases:
  - key: brewing
    name: 随诊记录医案
    labels:
      zh:
      - 随诊
      - 记录
    start_date: 1850-01-01
    highlight_event_id: guji-陈秉钧-event-practice
  - key: breakthrough
    name: 分门别类编次
    labels:
      zh:
      - 分门
      - 编次
    start_date: 1860-01-01
    highlight_event_id: guji-陈秉钧-event-tong-case
  - key: climax
    name: 撰成莲舫医案
    labels:
      zh:
      - 撰述
      - 成书
    start_date: 1865-01-01
    highlight_event_id: guji-陈秉钧-event-compilation
  - key: closure
    name: 医案流传后学
    labels:
      zh:
      - 流传
      - 示学
    start_date: 1870-01-01
    highlight_event_id: guji-陈秉钧-event-death
  decisions:
  - date: 1860-01-01
    title_zh: 以风痹类中为首列卷
    rationale: 风善行数变最防瘫痪，故首载中风类中肝风以明和养之法
  - date: 1865-01-01
    title_zh: 详录复诊加减以存变法
    rationale: 如童案三诊随舌苔纳食而变，欲使后学知因证化裁不执一方
events:
- id: guji-陈秉钧-event-birth
  title_zh: 降生青浦
  date: 1820-01-01
  year_of: 1820
  description: 清代青浦陈氏子，名秉钧，号莲舫甫，生年不详，约生于十九世纪前期
- id: guji-陈秉钧-event-practice
  title_zh: 青浦行医治风劳
  date: 1850-01-01
  year_of: 1850
  description: 行医青浦，治三疟后口眼歪斜、寒热后风湿入络、产前受风半身不遂等，多以香独活海风藤桑寄生丝瓜络等和养搜风
- id: guji-陈秉钧-event-tong-case
  title_zh: 辨治童姓风痹偏枯案
  date: 1858-01-01
  year_of: 1858
  description: 治六十一岁童姓足弛腰软手颤案，辨为肝肾两虚兼痰湿，力主间日一服从容调治，反对急求速效之熟地附子与凉化清解
- id: guji-陈秉钧-event-compilation
  title_zh: 撰成莲舫医案
  date: 1865-01-01
  year_of: 1865
  description: 汇平生验案分上中下卷，上治风痹温热，中治痢疟淋胀，下治咽喉疮疡胎产崩漏等，详载方药加减而成陈莲舫先生医案
- id: guji-陈秉钧-event-death
  title_zh: 医名传后而卒
  date: 1880-01-01
  year_of: 1880
  description: 卒于清末，卒年不详，所著医案流传于世，为后世研治风证杂病所宗
