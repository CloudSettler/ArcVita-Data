person:
  qid: guji-陈笏庵
  name_zh: 陈笏庵
  names:
    zh: 陈笏庵
    en: Chen Huan
  lifespan:
    birth:
      date: 1735
      precision: year
      is_circa: true
      raw: 清乾隆初年左右生人
    death:
      date: 1812
      precision: year
      is_circa: true
      raw: 嘉庆年间卒
  birth_date: 1735
  death_date: 1812
  era: 清代
  reign_ref: 乾隆至嘉庆
  archetype: 济世医家
  dilemmas:
  - 胎产至危而治甚难，失之毫厘则谬以千里，当如何保卫调护而不误人命
  - 乡间钱氏与竹林寺僧独擅其道而方书秘不示人，当守秘自利还是公之天下以济众生
  - 达生篇虽善而何症作何治尚未详备，当如何补其缺而立尽善尽美之宝鉴
  lesson: 医道利天下者当与天下共之，辨症立方务求详确精良，刊刻流传使家置一本则安者不危危者可安
  summary_first_person: 我自成童即留心胎产，于受业师陈勿庵家得珍藏秘本，见其分胎前临产产后三门并附保婴要诀，别类详论症确立方精，远胜达生篇，遂知钱氏及竹林寺僧所擅者皆出于此。我于乾隆乙卯游幕楚南与陈百楼同馆，在岳阳郡署付梓公世，后历粤西黔滇以方治病无不神效，又于皖江得好善诸公助而重镌，愿此书自迩迄远转相镌刻，人人得济。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%83%8E%E4%BA%A7%E7%A7%98%E4%B9%A6.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%83%8E%E4%BA%A7%E7%A7%98%E4%B9%A6.html
endeavors:
- id: guji-陈笏庵-endeavor-1
  title_zh: 撰述胎产秘书总汇胎前产后诸症
  summary_zh: 得陈勿庵秘本细加披阅，析胎前三十四症临产四症产后四十七症，复附保婴要诀，成二卷胎产秘书又名胎产金针
  phases:
  - key: brewing
    name: 成童留心受业得本
    labels:
      zh: 求师得秘本
    start_date: 1750
    highlight_event_id: guji-陈笏庵-event-study
  - key: breakthrough
    name: 分门别类拟方论症
    labels:
      zh: 别类详确立方精
    start_date: 1780
    highlight_event_id: guji-陈笏庵-event-compile
  - key: climax
    name: 定稿胎产秘书宝鉴
    labels:
      zh: 较达生篇尽善尽美
    start_date: 1790
    highlight_event_id: guji-陈笏庵-event-compile
  decisions:
  - date: 1780
    title_zh: 以补气血为主顺气清凉为佐立安胎常法
    rationale: 因孕妇脾胃健旺则胎安产顺，禀不足者不得不资药力，故宗丹溪以参术芩芎归地为纲而戒茯苓香附误用
  - date: 1790
    title_zh: 分胎前临产产后三门并附保婴要诀
    rationale: 因子悬子烦子痫子肿转脬等去邪保胎总诀不同，不便临期酌用，故析数十方以便验证
- id: guji-陈笏庵-endeavor-2
  title_zh: 刊刻流传济世利人
  summary_zh: 乾隆乙卯楚南岳阳郡署初刻，历粤西黔滇以方治病神效，嘉庆十四年皖江重镌广布海内
  phases:
  - key: brewing
    name: 游幕楚南同馆议刻
    labels:
      zh: 岳阳郡署付梓
    start_date: 1795
    highlight_event_id: guji-陈笏庵-event-first-publish
  - key: breakthrough
    name: 星沙藏板历试神效
    labels:
      zh: 粤西黔滇验证
    start_date: 1796
    highlight_event_id: guji-陈笏庵-event-practice
  - key: closure
    name: 皖江重镌广为流传
    labels:
      zh: 利天下与众共之
    start_date: 1809
    highlight_event_id: guji-陈笏庵-event-reprint
  decisions:
  - date: 1795
    title_zh: 公之于世付岳阳郡署剞劂
    rationale: 因秘方藏板星沙不得遍行海内心中未惬，利一身者独行利天下者当共之，故与陈百楼议刻济众
  - date: 1809
    title_zh: 复遇好善诸公皖江重镌
    rationale: 初刻本出以与人根据方治病无不神效，终以未遍海内为憾，故借皖江善助转相镌刻俾人人而济
events:
- id: guji-陈笏庵-event-birth
  date: 1735
  year_of: 1735
  title_zh: 出生
  description_zh: 约生于清乾隆初年，自成童即留心胎产之学
- id: guji-陈笏庵-event-study
  date: 1750
  year_of: 1750
  title_zh: 师从陈勿庵得珍藏秘本
  description_zh: 于受业师陈勿庵家得珍藏秘本，细加披阅，知钱氏及萧山竹林寺僧擅医独步之方皆出于此
- id: guji-陈笏庵-event-compile
  date: 1790
  year_of: 1790
  title_zh: 撰成胎产秘书
  description_zh: 内分胎前临产产后三门复附保婴要诀，载胎前三十四症临产四症产后四十七症及难产救治调护各法，别类详论症确立方精
- id: guji-陈笏庵-event-first-publish
  date: 1795
  year_of: 1795
  title_zh: 乾隆乙卯楚南初刻
  description_zh: 游幕楚南与陈百楼同馆，于岳阳郡署付剞劂公之于世，刊本后称胎产金针有二卷三卷四卷诸本
- id: guji-陈笏庵-event-practice
  date: 1796
  year_of: 1796
  title_zh: 历粤西黔滇验方神效
  description_zh: 旋赴粤西又之黔之滇，以所镌刻本出以与人，根据方治病无不神效，然藏板星沙未得遍行海内
- id: guji-陈笏庵-event-reprint
  date: 1809-07
  year_of: 1809
  title_zh: 嘉庆十四年皖江重镌
  description_zh: 游皖江复遇好善乐施诸公重镌广传，古虞杏园何荣于七月既望作序，愿自迩迄远转相镌刻人人得济
- id: guji-陈笏庵-event-death
  date: 1812
  year_of: 1812
  title_zh: 逝世
  description_zh: 嘉庆年间卒，后世存三十余种清刻本及石印铅印本流传，产后部分与傅青主产后编文字大致相同
