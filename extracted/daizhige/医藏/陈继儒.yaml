    highlight_event_id: guji-陈继儒-event-teaching
  - key: breakthrough
    name: 会通气神精论成编
    labels:
      zh: 著述成书
    start_date: 1620
    highlight_event_id: guji-陈继儒-event-book
  decisions:
  - date: 1610
    title_zh: 以肤语浅说示人摄生
    rationale: 以简浅警语破贪多务浓之习，令人易知易行以全生
  - date: 1620
    title_zh: 主静黜丹石服食
    rationale: 见服食金石多致死，惟以内养精气神为长生要方故专言调心寡欲
