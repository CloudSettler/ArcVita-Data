  decisions:
  - date: 1587
    title_zh: 焚衣断仕隐居佘山
    rationale: 见仕途劳形损神，不如岩居水饮无求无竞以却老全真
  - date: 1605
    title_zh: 却征召不就官职
    rationale: 恐富贵累心为害，守无欲恬淡以保全性命之真
