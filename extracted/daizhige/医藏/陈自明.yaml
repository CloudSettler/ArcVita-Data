      raw: 约嘉泰二年
    death:
      date: '1270-12-31'
      precision: year
      is_circa: true
      raw: 约咸淳六年
  birth_date: '1190-01-01'
  death_date: '1270-12-31'
  era: 南宋
  reign_ref: 宋理宗景定
  archetype: 世医集验惠民的方脉良医
  dilemmas:
  - title_zh: 庸俗割补惑众与明理次序救生之辨
    description_zh: 下甲庸俗不通文理厌弃繁文，妄投排脓内补十宣散于未溃之初，轻者转重，重者致死，守经效次序者方能救生。
  - title_zh: 内消托里与峻利攻伐之辨
    description_zh: 痈疽未溃脏腑蓄毒忌毫末热药，已溃脏腑既亏忌毫末冷药，当先助胃壮气固本，次行经活血泄毒，早治可内消，失序则枉夭。
  lesson: 疗痈疽如御草寇不可守礼，先服紧要经效之药把定脏腑外施针灸泄毒，势定再详察虚实冷热对证用药毋失先后。
  summary_first_person: 吾良甫，世业大方脉，每见痈疽十存一二，痛庸俗误人，遂采李嗣之伍起予曾孚先辈及上古得效方论，削繁取要立先后次序，著妇人大全良方与外科精要，愿临病有所主，不致渴而穿井斗而铸兵。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/医藏/外科精要.md
  - https://daizhige.org/医藏/外科精要.html
endeavors:
- id: guji-陈自明-endeavor-1
  title_zh: 集妇产方论成妇人大全良方
  summary_zh: 家世大方脉，博采群言编妇人经产诸疾要诀，嘉熙年间成书二十四卷，惠及后世。
  phases:
  - key: brewing
    name: 世医见闻酝酿
    labels:
      zh: 家世方脉
    start_date: '1205-01-01'
    highlight_event_id: guji-陈自明-event-birth
  - key: breakthrough
    name: 博采摭拾立纲
    labels:
      zh: 采摭群言
    start_date: '1230-01-01'
    highlight_event_id: guji-陈自明-event-furen-1237
  - key: climax
    name: 嘉熙成书刊行
    labels:
      zh: 妇人大全良方
    start_date: '1237-01-01'
    highlight_event_id: guji-陈自明-event-furen-1237
  - key: closure
    name: 救产厄惠民收效
    labels:
      zh: 经效流传
    start_date: '1240-01-01'
    highlight_event_id: guji-陈自明-event-furen-1237
  decisions:
  - date: '1230-01-01'
    title_zh: 不守秘方以变通济众
    rationale: 见确执一二方全无变通改名惑众者为含灵巨贼，故公开经效取言简意尽纲领不紊。
  - date: '1237-01-01'
    title_zh: 先固本后攻病成书
    rationale: 积毒在脏腑当先助胃壮气使根本坚固，次佐行经活血，依经络时令使毒外泄，故以此为内托之旨统全书。
- id: guji-陈自明-endeavor-2
  title_zh: 采疡科得效法著外科精要
  summary_zh: 暇日采李嗣之伍起予陈无择诸家灸法方论，自立要领分先后次序，景定癸亥孟秋成外科精要三卷。
  phases:
  - key: brewing
    name: 目击痈疽酷烈
    labels:
      zh: 痈疽杂病之先
    start_date: '1245-01-01'
    highlight_event_id: guji-陈自明-event-furen-1237
  - key: breakthrough
    name: 得灸法拔毒之要
    labels:
      zh: 隔蒜骑竹马灸
    start_date: '1255-01-01'
    highlight_event_id: guji-陈自明-event-waike-1263
  - key: climax
    name: 景定厘序成书
    labels:
      zh: 外科精要
    start_date: '1263-08-01'
    highlight_event_id: guji-陈自明-event-waike-1263
  - key: closure
    name: 正十宣散误用垂训
    labels:
      zh: 先后不失序
    start_date: '1263-08-01'
    highlight_event_id: guji-陈自明-event-waike-1263
  decisions:
  - date: '1255-01-01'
    title_zh: 主灸泄毒辅以内托
    rationale: 痈疽如盗入室当开户逐之，未溃拔引郁毒已溃补接阳气，故首重骑竹马隔蒜灸足三里泄毒而不用敷贴闭毫孔。
  - date: '1263-08-01'
    title_zh: 辨十宣散用在溃后
    rationale: 十宣散乃破后排脓内补之药，洪内翰妄序致误天下，故断在第四节溃后用，初起禁用以正视听。
events:
- id: guji-陈自明-event-birth
  date: '1190-01-01'
  year_of: 1190
  title_zh: 生于临川世医之家
  description_zh: 家世大方脉，少习素难杂病方论，长而专究痈疽妇产，立志探赜索隐不做对病阅方之医。
- id: guji-陈自明-event-furen-1237
  date: '1237-01-01'
  year_of: 1237
  title_zh: 成妇人大全良方二十四卷
  description_zh: 广采上古得效方论要诀，成妇产集大成之作，行于世而活人甚众。
- id: guji-陈自明-event-waike-1263
  date: '1263-08-01'
  year_of: 1263
  title_zh: 景定癸亥孟秋序外科精要
  description_zh: 自立要领分卷上卷中卷下，首论发背灸法用药，次论备论灸法骑竹马隔蒜寻头諸法，厘先后次序使览者如指诸掌。
- id: guji-陈自明-event-death
  date: '1270-12-31'
  year_of: 1270
  title_zh: 卒后书入医藏流传
  description_zh: 其书经元明薛己等补注厘为四卷，灸法托补之旨为后世疡科圭臬，至今存于医藏。
