events:
- id: guji-陈葆善-event-birth
  date: 1855-01-01
  year_of: 1855
  title_zh: 生於瓯郡
  summary_zh: 约清同治年间生於温州，字栗庵，后为医院院医
- id: guji-陈葆善-event-1893-illness
  date: 1893-03-01
  year_of: 1893
  title_zh: 癸巳春阖门四人患白喉
  summary_zh: 壬辰冬燥盛春寒外加而大发，长女以大辛凉合甘咸寒获效，次女愈而少子夭，始发藏书穷究旨要
- id: guji-陈葆善-event-1894-awakening
  date: 1894-10-01
  year_of: 1894
  title_zh: 甲午秋少女伏暑顿悟标本传变
  summary_zh: 少女身热痉厥痰喘，以西洋参石膏大辛凉法痰喘顿止，恍然悟白喉标本传变及前此得失
- id: guji-陈葆善-event-1897-compilation
  date: 1897-07-01
  year_of: 1897
  title_zh: 丁酉夏作白喉条辨十五条
  summary_zh: 汇集众长证以经谊参以阅历，先作订正论一卷呈政蛰庐，退而仿吴鞠通例作条辨十五条
- id: guji-陈葆善-event-1898-publication
  date: 1898-05-01
  year_of: 1898
  title_zh: 光绪二十四年医报刊行条辨
  summary_zh: 陈虬弁言于天津紫竹林，胡鑫诠次随医报刊行，书成远近仿治多所全活
- id: guji-陈葆善-event-death
  date: 1915-01-01
  year_of: 1915
  title_zh: 卒
  summary_zh: 民国初年后卒，白喉之源至其始有专书，喉科方法悉寓其中
