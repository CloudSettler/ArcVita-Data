  - 长女几殆少子夭折，于张郑旧法得失之间疑团难破
  - 当仁不让指摘前贤，又念非三先生开先河无以集其成
  lesson: 医以切实适用为要，贵会其通，辨明燥火本标，举一反三以推六淫百病
  summary_first_person: 余陈葆善字栗庵，为医院院医，癸巳阖门患白喉而悟此证悉属燥火伏肺，参沈喻吴诸家，证以经谊阅历，作订正论复仿温病例为条辨十五条，嘱门人诠次随医报刊行，愿后学阐发微旨以活苍生
  source_urls:
