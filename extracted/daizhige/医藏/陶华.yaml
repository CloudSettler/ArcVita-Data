    highlight_event_id: guji-陶华-event-suoyan
  decisions:
  - date: 1445
    title_zh: 作琐言剖露仲景不传之妙
    rationale: 非有师承口诀不能融会贯通故言简意到补温暑无方之亡以升高梯阶
  - date: 1445
    title_zh: 戒子敬慎行医勿以道杀人
    rationale: 药能生人亦能杀人存心有恒则为君子忍贪则轻人命故以达为良相不达为良医训之
