    start_date: '0520'
    highlight_event_id: guji-陶弘景-event-death
  decisions:
  - date: 0492
    title_zh: 上表辞官隐居茅山
    rationale: 不欲以声色富贵劳神损形，欲游心虚静以全道守生，故舍显职而就山林。
  - date: '0502'
    title_zh: 虽隐仍以书疏决国事
    rationale: 梁武雅相信重，隐居亦可济物护生，故以道佐时而不累其心。
- id: guji-陶弘景-endeavor-2
  title_zh: 集养生医药著述济世延命
  summary: 披览张湛翟平等养生要集，删繁取要类聚成养性延命录，又集注神农本草经，阐啬神爱气导引饮食之要。
  phases:
  - key: brewing
    name: 止观之暇披览要集
    labels:
      zh:
