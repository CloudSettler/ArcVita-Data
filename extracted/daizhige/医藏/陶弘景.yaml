  date: '0456'
  year_of: 456
  place_zh: 丹阳秣陵
  description: 宋孝建三年生，少聪敏博学，好道术养生，涉猎经史百家。
- id: guji-陶弘景-event-resign
  title_zh: 辞奉朝请隐居茅山
  date: 0492
  year_of: 492
  place_zh: 茅山华阳
  description: 齐永明十年上表辞官，隐居茅山，自号华阳隐居，修上清道法，行导引服饵。
- id: guji-陶弘景-event-counsel
  title_zh: 梁武帝礼敬参决国事
  date: '0502'
  year_of: 502
  place_zh: 茅山与建康
  description: 梁代禅后，武帝屡以书问咨访朝政军国大事，时人称为山中宰相，虽隐而心系苍生。
- id: guji-陶弘景-event-compile
  title_zh: 编成养性延命录与本草集注
  date: '0515'
  year_of: 515
  place_zh: 茅山
  description: 披览养生要集，略取要法分为教戒食戒等篇，号为养性延命录，又成神农本草经集注真诰真灵位业图等，以补助于有缘。
- id: guji-陶弘景-event-death
  title_zh: 卒于茅山谥贞白先生
  date: '0536'
  year_of: 536
  place_zh: 茅山
  description: 梁大同二年羽化于茅山，遗命薄葬，朝廷谥贞白先生，其养生啬神爱气之说流传后世。
