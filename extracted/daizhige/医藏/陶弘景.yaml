  dilemmas:
  - 出仕辅政显达与辞官入山求道之间的进退两难
  - 服饵丹药求长生与啬神爱气节饮食之间的损益权衡
  lesson: 游心虚静啬神爱气，节饮食慎起居导引，以道守生方能延命济物。
  summary_first_person: 我少好道术博学多识，仕宋齐为诸王侍读奉朝请而心在林泉，遂辞官隐居茅山自号华阳隐居，承上清经法撰真诰与真灵位业图，梁武帝信重而书问参决国事，晚年披览养生要集删繁取要而成养性延命录，又集注本草以疗疾济世，但愿形神相守不以外物戕生。
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%85%BB%E6%80%A7%E5%BB%B6%E5%91%BD%E5%BD%95.html
