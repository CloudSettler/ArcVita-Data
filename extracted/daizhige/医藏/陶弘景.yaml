    start_date: 0495
    highlight_event_id: guji-陶弘景-event-resign
  - key: breakthrough
    name: 集注本草辨明药性
    labels:
      zh:
      - 本草集注
    start_date: '0500'
    highlight_event_id: guji-陶弘景-event-compile
  - key: climax
    name: 类聚成书养性延命录
    labels:
      zh:
      - 著书延命
    start_date: '0515'
    highlight_event_id: guji-陶弘景-event-compile
  - key: closure
    name: 教戒流传补助于有缘
    labels:
      zh:
      - 济物垂训
    start_date: '0530'
    highlight_event_id: guji-陶弘景-event-death
  decisions:
  - date: '0500'
    title_zh: 先注本草后谈养生
    rationale: 服饵虽能延年，若不知养性之术亦难长生，故必形神药食兼摄。
  - date: '0515'
    title_zh: 删弃繁芜类聚篇题
    rationale: 前彦所集卷帙浩繁，取其有益养生无损后患者为教戒食戒等篇，以济有缘。
events:
