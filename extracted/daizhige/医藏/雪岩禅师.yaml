endeavors:
- id: guji-雪岩禅师-endeavor-1
  title_zh: 分龄论经撰女科卷一
  summary_zh: 自十三四至五十一二按龄列经症，配八物和气诸方，提挈调经止带之要
  phases:
  - key: brewing
    name: 采方辨龄
    labels:
      zh: 酝酿
    start_date: 1680
    highlight_event_id: guji-雪岩禅师-event-jing
  - key: climax
    name: 旨要成卷
    labels:
      zh: 高潮
    start_date: 1688
    highlight_event_id: guji-雪岩禅师-event-jing
  decisions:
  - date: 1682
    title_zh: 以年龄分经症立纲
    rationale: 妇人经水随年而变，逐年立症可使后学按龄索方，不致杂投
  - date: 1686
    title_zh: 以八物四物为底加减化裁
    rationale: 气血为经水之本，用八珍四物温补调和，再随寒热虚实加减，守正而不泥方
- id: guji-雪岩禅师-endeavor-2
  title_zh: 按月养胎及产后调护撰卷二卷三
  summary_zh: 论十月胎形胎症，制罩胎安胎诸方，兼论产后败血攻心发热诸症，以全母子
  phases:
  - key: breakthrough
    name: 按月立论
    labels:
      zh: 突破
    start_date: 1690
    highlight_event_id: guji-雪岩禅师-event-tai
  - key: closure
    name: 产后收功
    labels:
      zh: 收束
    start_date: 1695
    highlight_event_id: guji-雪岩禅师-event-chan
  decisions:
  - date: 1691
    title_zh: 初月即用罩胎保胎
    rationale: 胎初如露珠不稳，禀薄病后尤危，早保可防误作阻经而损胎
  - date: 1694
    title_zh: 临产备活命无忧散与乌金丸
    rationale: 横逆瘀搏仓卒难治，预备活血催生之剂，可救母子于顷刻
events:
- id: guji-雪岩禅师-event-birth
  title_zh: 生于清初
  date: 1650
  year_of: 1650
  summary_zh: 约生于清初，出家为僧，法号雪岩，留心医道尤重妇科
- id: guji-雪岩禅师-event-jing
  title_zh: 成妇女逐年经症卷一
  date: 1688
  year_of: 1688
  summary_zh: 分十三四至五十一二论经水不调崩带诸症，录八物汤和气散调经丸乌鸡丸等方
- id: guji-雪岩禅师-event-tai
  title_zh: 成按月受胎形症卷二
  date: 1692
  year_of: 1692
  summary_zh: 论初月至十月胎形胎症，制罩胎方安胎和气散瘦胎饮保生如圣散活命无忧散等
- id: guji-雪岩禅师-event-chan
  title_zh: 成诊产后证论卷三
  date: 1696
  year_of: 1696
  summary_zh: 论产后败血入脏狂言发热恶寒诸症，录乌金散逍遥散乌金汤等以调气血祛邪
- id: guji-雪岩禅师-event-death
  title_zh: 示寂于康熙末年
  date: 1722
  year_of: 1722
  summary_zh: 撰女科旨要三卷行世后示寂，医僧之慈惠及后学
