endeavors:
- id: guji-雷斆-endeavor-1
  title_zh: 著雷公炮炙论立炮制规范
  summary: 遍考三百余种药物，详辨真伪，录炮熬煮炙之法，成书以正药制
  phases:
  - key: brewing
    name: 遍识药材辨别真伪
    labels:
      zh:
      - 辨伪存真
      - 君臣相制
    start_date: '0440'
    highlight_event_id: guji-雷斆-event-1
  - key: breakthrough
    name: 试炼炮炙得制药要法
    labels:
      zh:
      - 炮熬煮炙
      - 以制去毒
    start_date: '0450'
    highlight_event_id: guji-雷斆-event-1
  - key: climax
    name: 分卷录方著成上卷
    labels:
      zh:
      - 朱砂云母钟乳
      - 修事详录
    start_date: '0460'
    highlight_event_id: guji-雷斆-event-2
  - key: closure
    name: 海集参校传示后人
    labels:
      zh:
      - 直录炮制
      - 贻之后世
    start_date: '0465'
    highlight_event_id: guji-雷斆-event-2
  decisions:
  - date: '0450'
    title_zh: 以甘草紫背天葵五方草制朱砂
    rationale: 朱砂生服有毒，须香水浴研煮三伏再煅，方能伏火而可服入药
  - date: '0460'
    title_zh: 直录炮熬煮炙分为三卷
    rationale: 圣法难穷微，略陈药饵功能，专列药制之方，使后人有据可依
- id: guji-雷斆-endeavor-2
  title_zh: 阐药性配伍传炮炙心法
  summary: 明君臣相制之理，辨相恶相反之宜，授后学使药之功
  phases:
  - key: brewing
    name: 观察药情异同
    labels:
      zh:
      - 药有情异
      - 相制相成
    start_date: '0445'
    highlight_event_id: guji-雷斆-event-1
  - key: breakthrough
    name: 总结服食宜忌
    labels:
      zh:
      - 服食禁忌
      - 宜忌分明
    start_date: '0455'
    highlight_event_id: guji-雷斆-event-2
  - key: climax
    name: 示百种病药之功
    labels:
      zh:
      - 对症使药
      - 百种皆验
    start_date: '0462'
    highlight_event_id: guji-雷斆-event-2
  - key: closure
    name: 序论君臣以诏来者
    labels:
      zh:
      - 世人使药
      - 既辨君臣
    start_date: '0466'
    highlight_event_id: guji-雷斆-event-2
  decisions:
  - date: '0455'
    title_zh: 首辨真伪再言修治
    rationale: 如黄精勿用钩吻，防葵勿用狼毒，若误用则害人，故必先审真伪
  - date: '0462'
    title_zh: 详书当归头尾蕤子生熟之异
    rationale: 头止血尾破血，生熟睡寐不同，若不分别则效用全乖，故须明示
events:
- id: guji-雷斆-event-birth
  date: '0420'
  year_of: 420
  title_zh: 降生于刘宋之世
  description: 生于南北朝刘宋初年，自幼习医，博览药书，立志明辨药物真伪
- id: guji-雷斆-event-1
  date: '0450'
  year_of: 450
  title_zh: 精研炮炙修事朱砂钟乳
  description: 于静室焚香斋沐，以东流水甘草紫背天葵煮朱砂三伏，以五香水甘草汁制钟乳，尽得伏火飞研之法
- id: guji-雷斆-event-2
  date: '0460'
  year_of: 460
  title_zh: 著成雷公炮炙论三卷
  description: 略陈药饵功能，直录炮熬煮炙，列药制方，分为上中下三卷，详载三百余味修事之法，世称炮炙之祖
- id: guji-雷斆-event-death
  date: 0480
  year_of: 480
  title_zh: 卒于刘宋末年
  description: 殁后其书盛行于世，后人尊为雷公，所传炮炙之法永为医家圭臬
