  dilemmas:
  - 古人约于品而详于法今人侈于品而疏于法当从俭还是从靡
  - 豪家秘方自珍还是梓行公世以续食经
  lesson: 约于品而详于法珍方公世乃不负口腹之外别有大道
  summary_first_person: 吾吴郡韩奕字公望见当世极靡三吴尤甚而食经未有闻遂效豪家所珍之方治酝造脯鲊蔬菜笼造炉造诸法浓不瞒胃淡不忤舌屡以食客称善乃作叙梓行以公于世托名易牙遗意欲使后人不厌精细而知戒
