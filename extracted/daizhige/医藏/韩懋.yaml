events:
- id: guji-韩懋-event-birth
  date: 1475
  year_of: 1475
  title_zh: 出生
  description: 生于明成化年间，胎中因母病疟受累，生来羸弱多病
- id: guji-韩懋-event-1
  date: 1501
  year_of: 1501
  title_zh: 辛酉病作席舍死而复苏
  description: 病痰席舍死而复苏，遂罢生员业走家难，以医给旅重游南北
- id: guji-韩懋-event-3
  date: 1510
  year_of: 1510
  title_zh: 救治兄嫂沉痼危证
  description: 以清燥汤愈兄奇邪之疾，以盐煮大附子救嫂亡阳昏脱，后得二子
- id: guji-韩懋-event-2
  date: 1522-06
  year_of: 1522
  title_zh: 嘉靖壬午自序韩氏医通
  description: 补葺旧草分九章九十五则为上下二卷，于六月朔自序明中和之道
- id: guji-韩懋-event-4
  date: 1522
  year_of: 1522
  title_zh: 悬壶著三子养亲汤等方
  description: 创三子养亲汤奉高年，以霞天膏攻沉痼，以五瘟丹救楚地春瘟
- id: guji-韩懋-event-death
  date: 1535
  year_of: 1535
  title_zh: 逝世
  description: 卒于明嘉靖年间，悬壶半生后归隐，确年不详
