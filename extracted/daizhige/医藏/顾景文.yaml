  - date: 1746-08-01
    title_zh: 舌绛入营透热凉血，斑疹外露急透为要
    rationale: 营受热则夜甚斑隐，用犀角竹叶花露凉血透斑，斑出神清为顺，昏陷则内闭难救，故先安未受邪之地
events:
- id: guji-顾景文-event-birth
  date: 1700-01-01
  year_of: 1700
  title_zh: 生于吴中
  description_zh: 生于吴中，吴地湿邪害人最广，习医而留意温热，与叶桂同时相从
- id: guji-顾景文-event-record
  date: 1745-06-01
  year_of: 1745
  title_zh: 随侍叶桂笔录温热口授
  description_zh: 亲承叶桂口授，录温邪上受首先犯肺逆传心包之旨，定卫后言气营后言血，在卫汗之到气清气入营透热转气入血凉血散血之法
- id: guji-顾景文-event-compile
  date: 1746-12-01
  year_of: 1746
  title_zh: 整理温热论并成三时伏气外感篇
  description_zh: 汇温热论为篇，详流连气分战汗，三焦分消，阳明轻下，苦泄开泄之别，验舌之白黄黑绛紫，验齿之燥润焦垢，辨斑疹之宜见不宜多见，并论春温风温暑病秋燥治肺为急
- id: guji-顾景文-event-death
  date: 1780-01-01
  year_of: 1780
  title_zh: 卒于吴中
  description_zh: 卒于吴中，遗篇藉门人刊行，后世奉温热论为温病学开山纲要，与叶桂并称
