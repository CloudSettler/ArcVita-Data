endeavors:
- id: guji-顾锡-endeavor-1
  title_zh: 南北行医以眼科名世
  summary: 走南北数千里治目积案盈千累万侨寓松郡远近争趋以审本原补泻得宜起沉疴
  phases:
  - key: brewing
    name: 桐乡习医通素问灵枢
    labels:
      zh: 习医穷经
    start_date: 1770-01-01
    highlight_event_id: guji-顾锡-event-birth
  - key: breakthrough
    name: 乾隆庚戌愈朱氏伯兄目疾
    labels:
      zh: 湿热壅滞投剂即痊
    start_date: 1790-01-01
    highlight_event_id: guji-顾锡-event-cure-1790
  - key: climax
    name: 侨寓松郡名震南北
    labels:
      zh: 赖我而存几废复明
    start_date: 1800-01-01
    highlight_event_id: guji-顾锡-event-fame-1800
  - key: closure
    name: 授徒传学口讲指画
    labels:
      zh: 授门人芬等
    start_date: 1807-01-01
    highlight_event_id: guji-顾锡-event-compile-1807
  decisions:
  - date: 1790-01-01
    title_zh: 断为湿热壅滞不用温凉补泻乱投
    rationale: 审手足肿痛不能运动知湿热壅滞以法疗之至易而诸医轻投温凉反几瞽故守病源不从众方
  - date: 1800-01-01
    title_zh: 戒钩割炮烙力主补泻温凉
    rationale: 见针挑舌舔热攻凉熨及钩割拨障多贻害终身故严辨正邪养精血为先不贪顷刻之功
- id: guji-顾锡-endeavor-2
  title_zh: 著银海指南四卷广传
  summary: 集已验诸症编为二卷更著六淫七情杂病兼症及五脏六腑主病守正辟邪论轮廓运气以指南后学
  phases:
  - key: brewing
    name: 积案盈千累万惧散失
    labels:
      zh: 积案成编
    start_date: 1807-03-01
    highlight_event_id: guji-顾锡-event-compile-1807
  - key: breakthrough
    name: 春集成编门人请梓
    labels:
      zh: 六淫七情轮廓详辨
    start_date: 1807-11-01
    highlight_event_id: guji-顾锡-event-compile-1807
  - key: climax
    name: 丁卯芬跋己巳朱张作序
    labels:
      zh: 付梓广传
    start_date: 1809-05-01
    highlight_event_id: guji-顾锡-event-publish-1809
  - key: closure
    name: 示人按症索方不致再误
    labels:
      zh: 医林圭臬
    start_date: 1809-12-01
    highlight_event_id: guji-顾锡-event-publish-1809
  decisions:
  - date: 1807-03-01
    title_zh: 集验案编二卷兼著总论
    rationale: 惧多而散失欲存医案准治法之宜使后人按症索方不至一误再误故宗景岳守之才参古抒己见
  - date: 1809-05-01
    title_zh: 出指南示人不尚异矜奇
    rationale: 病源看得透则补泻兼行各得其道以复光明之体故以救世之心公之同志不存秘奇
events:
- id: guji-顾锡-event-birth
  date: 1750-01-01
  year_of: 1750
  title_zh: 生于桐乡
  description: 清乾隆间生于桐乡字养吾少习素问灵枢与朱氏先大夫为莫逆交
- id: guji-顾锡-event-cure-1790
  date: 1790-01-01
  year_of: 1790
  title_zh: 乾隆庚戌愈朱氏伯兄目疾手足肿痛
  description: 朱氏伯兄目疾半载兼手足肿痛诸医温凉补泻轻投几瞽顾锡笑断为湿热壅滞如法而痊知其于医无不通治目其绪余
- id: guji-顾锡-event-fame-1800
  date: 1800-01-01
  year_of: 1800
  title_zh: 以眼科名于时远近争趋
  description: 侨寓松郡以来病目者远近争趋或赖以存或微之几废人称医目如神然问其源必先澈六淫七情之源而后施补泻温凉
- id: guji-顾锡-event-compile-1807
  date: 1807-11-01
  year_of: 1807
  title_zh: 集验案编银海指南门人芬作跋
  description: 嘉庆丁卯冬集已验诸症编二卷更著守正辟邪轮廓运气六气脏腑脉舌方药诸论受业门人芬口讲指画请付梓以公同志
- id: guji-顾锡-event-publish-1809
  date: 1809-05-01
  year_of: 1809
  title_zh: 嘉庆己巳朱方增张起鳞作序刊行
  description: 海盐朱方增叙其起沉疗痼辨轮廓戒钩割之功海昌张起鳞序其不尚异矜奇看透病源之学银海指南四卷遂广传于世
- id: guji-顾锡-event-death
  date: 1820-12-31
  year_of: 1820
  title_zh: 卒于松郡寓所后
  description: 嘉庆后卒生前以眼科全力济世所著指南为医林圭臬门人奉为至宝
