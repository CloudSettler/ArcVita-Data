  - 目瞽于病者半瞽于医者亦半守补泻温凉正法或遭求速效者疑
  - 世医多窃方点药矜为专科不究轮廓经络欲著书辟邪恐末学难信
  lesson: 辨轮廓明经络审虚实守正辟邪不贪钩割速效则光明可复
  summary_first_person: 吾桐乡顾锡字养吾悯天下目受盲医之祸参古大家之论辨五轮八廓六淫七情著银海指南四卷以守正辟邪为要愿医者不瞽其心病者不瞽其目
