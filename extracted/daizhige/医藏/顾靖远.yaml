person:
  qid: guji-顾靖远
  name_zh: 顾靖远
  names:
    zh: 顾靖远
    en: Gu Jingyuan
  lifespan:
    birth:
      date: '1655'
      precision: year
      is_circa: true
      raw: 清初吴门约生
    death:
      date: '1725'
      precision: year
      is_circa: true
      raw: 康熙末后卒
  birth_date: '1655'
  death_date: '1725'
  era: 清
  reign_ref: 康熙
  archetype: 儒医
  dilemmas:
  - 明经就选而屡试数奇，是恋栈功名还是转济苍生以成良医之志
  - 世医宗温补而概投参附桂姜，是从众容身还是力辨寒热以挽时俗之弊
  - 家贫剞劂难克自任，是独善藏稿还是倡导刊刻以广寿世之仁
  lesson: 为人子不可不知医，学必洞彻炎黄仲景而广征百家，用必审时地虚实寒热而变通经方，不泥温补，不畏白虎，方能起沉疴而济群生
  summary_first_person: 吾吴门顾靖远，号松园，少游庠序而屡试不第，痛先人热症误投参附而枉死，遂矢志岐黄，三十年焚膏继晷，辑医镜十六卷以明灵素脉法本草症方，辨温热宜用白虎而戒滥投桂附，愿挽颓风而跻斯民于寿域
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%A1%BE%E6%9D%BE%E5%9B%AD%E5%8C%BB%E9%95%9C.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E9%A1%BE%E6%9D%BE%E5%9B%AD%E5%8C%BB%E9%95%9C.html
endeavors:
- id: guji-顾靖远-endeavor-1
  title_zh: 痛亲误药发愤研习岐黄
  summary: 因先人热症误用参附而殁，诵灵素读金匮，渔猎方书医案二十余年，考辨伤寒温热时地之异，力主清解白虎以救阳明实热
  phases:
  - key: brewing
    name: 髫龄游庠屡试数奇
    labels:
      zh:
      - 早年儒业
    start_date: '1668'
    highlight_event_id: guji-顾靖远-event-birth
  - key: breakthrough
    name: 丁艰误药矢志学医
    labels:
      zh:
      - 痛定立志
    start_date: '1689'
    highlight_event_id: guji-顾靖远-event-vow
  - key: climax
    name: 面壁九年心得三昧
    labels:
      zh:
      - 临症奇中
    start_date: '1698'
    highlight_event_id: guji-顾靖远-event-practice
  - key: closure
    name: 积习通弊论成一家言
    labels:
      zh:
      - 明道救弊
    start_date: '1715'
    highlight_event_id: guji-顾靖远-event-mirror
  decisions:
  - date: '1689'
    title_zh: 舍举业而择岐黄
    rationale: 感庸医薰莸莫辨致亲枉死，思不为良相当作良医，遂殚炎黄之奥究仲景之秘以起后世沉疴
  - date: '1698'
    title_zh: 宗仲景法而不泥仲景方
    rationale: 悟南北时地古今元气不同，南方温热只宜辛温轻剂辛凉辛寒，不可恣用辛热重剂以害人
  - date: '1710'
    title_zh: 力主白虎解惑救阳明
    rationale: 见世医畏石膏如虎而喜附桂，致温热斑狂厥呃者千中千死，故表章白虎生津止渴回生之功
- id: guji-顾靖远-endeavor-2
  title_zh: 供职御医院归养纂医镜
  summary: 以医名供职御医院，因亲老告假归吴，闭户分纂本草脉法内景灵素格言症方十六卷，谋刊刻以济万人
  phases:
  - key: brewing
    name: 以明经就选入太医院
    labels:
      zh:
      - 医名渐著
    start_date: '1705'
    highlight_event_id: guji-顾靖远-event-practice
  - key: breakthrough
    name: 以亲老归养下帷著述
    labels:
      zh:
      - 归吴纂书
    start_date: '1710'
    highlight_event_id: guji-顾靖远-event-mirror
  - key: climax
    name: 医镜十六卷删繁存精
    labels:
      zh:
      - 简明约该
    start_date: '1715'
    highlight_event_id: guji-顾靖远-event-mirror
  - key: closure
    name: 托婿钞撮俟公卿刊刻
    labels:
      zh:
      - 寿世婆心
    start_date: '1719'
    highlight_event_id: guji-顾靖远-event-mirror
  decisions:
  - date: '1710'
    title_zh: 供职未久即告假归养
    rationale: 亲老需养不恋御医院荣利，愿淡于势利下帷诵读以全孝思而成著述
  - date: '1715'
    title_zh: 以岐黄仲景为经诸子为纬
    rationale: 恶庸浅不学与好高偏执之杀人等，故采金石摘珠玑，使庸浅易领好高难施险僻
  - date: '1719'
    title_zh: 属嗣婿速录成书济东省
    rationale: 家贫不能自刻，冀借官廨家邮广传，俟有识有力名公卿赞成刊刻以活万人
events:
- id: guji-顾靖远-event-birth
  date: '1655'
  year_of: 1655
  title_zh: 生于吴门巨族
  description: 颖异天生，年方舞勺即铮铮黉序，髫龄游庠，累试未第而苦攻举业，身多羸疾已有志学医
- id: guji-顾靖远-event-vow
  date: '1689'
  year_of: 1689
  title_zh: 先人热症误药而矢志
  description: 先人患热症，众医或主补或主泻或主热或主寒，误投参附而枉死，遂诵灵素读金匮究百家菁英以偿百身莫赎之罪
- id: guji-顾靖远-event-practice
  date: '1705'
  year_of: 1705
  title_zh: 临症奇中户外屦满
  description: 临症投剂与俗悬殊，遇险怪症拱手请质，往往起沉疴而生之，曾以医名供职御医院，旋以亲老归养
- id: guji-顾靖远-event-mirror
  date: 1719-07
  year_of: 1719
  title_zh: 医镜成书婿序求刻
  description: 闭户辑医镜十六卷，分本草必用脉法删繁内景图解灵素摘要格言汇纂症方发明，得冯勖徐秉义品题，嗣婿程简于康熙五十八年七月序于山东官廨，力谋刊刻济世，并以白虎大剂治愈汪缵功阳明时疾而名重吴中
- id: guji-顾靖远-event-death
  date: '1725'
  year_of: 1725
  title_zh: 卒于吴门身后书传
  description: 晚年以医书惠苍生，持添精填髓峻补其阴以治老人，戒纯阳桂附劫阴之祸，书成后卒，遗愿刊刻以跻斯民寿域
