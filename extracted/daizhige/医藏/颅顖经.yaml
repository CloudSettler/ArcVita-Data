  decisions:
  - date: -0973
    title_zh: 丹毒一也随大小分别外涂
    rationale: 十岁以上为毒以下为丹伊火神灶尿灶等各有起处猪粪茅灰鸡子白等随证涂之万无一差
  - date: 1079
    title_zh: 以秘方授后学而不私藏
    rationale: 杂证多秘方非俗医可及钱乙得之视长公主女疾有效故当显其源使幼科有承
events:
- id: guji-颅顖经-event-birth
  title_zh: 师巫崆峒得金文传说生世
  date: -0976
  year_of: -976
  description_zh: 相传周穆王贤士师巫于崆峒山得王母金文黄帝内经余绪而释为颅顖经
- id: guji-颅顖经-event-1
  title_zh: 叙胎养十月化成并定脉法
  date: -0975
  year_of: -975
  description_zh: 序一月胚二月胎三魂四魄至十月气足立三岁以下一寸呼吸定息三至为平和
- id: guji-颅顖经-event-2
  title_zh: 成惊痫疳痢证治上卷
  date: -0974
  year_of: -974
  description_zh: 论鹅口撮噤夜啼乳痢诸候制牛黄丸虎睛丸保童丸紫雪圆等治惊疳
- id: guji-颅顖经-event-3
  title_zh: 列火丹十五种及杂证下卷
  date: -0973
  year_of: -973
  description_zh: 借黄帝问歧伯分丹毒绘图伊火神灶天火鬼火等各有涂治兼录平和饮子柴胡引子等
- id: guji-颅顖经-event-4
  title_zh: 永乐四库辑佚钱乙承术显名
  date: 1781-09-01
  year_of: 1781
  description_zh: 宋志著师巫颅顖经二卷钱乙以此著名永乐大典载之四库据以褒辑厘为二卷纪昀等恭校
- id: guji-颅顖经-event-death
  title_zh: 托名师巫失考传世
  date: -0946
  year_of: -946
  description_zh: 本人世系失考疑唐末宋初人托名师巫其书独赖永乐大典以传
