  - date: -0975
    title_zh: 舍大人五至取小儿七至候风冷
    rationale: 小儿纯阳呼吸急促须以呼吸十五至为纲浮如张弓为风七至以下为冷以免误下生惊
  - date: -0974
    title_zh: 定六十日一变蒸遇珠子只用退热饮子
    rationale: 骨节长来发热不下食乳乃常候上唇粟粒为验不宜别施攻伐以防枉损
