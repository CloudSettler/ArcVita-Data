  decisions:
  - date: 1865
    title_zh: 定疔毒走黄内陷急清解毒之法
    rationale: 疔毒走散最易内陷故立地丁银花连翘黄芩为主之化疔解毒以防毒气走黄
  - date: 1875
    title_zh: 对乳岩石疽坚肿主张养阴清肝缓图消化
    rationale: 岩症多由郁怒思虑肝脾两伤气火夹痰而成攻伐太过反伤正气故以柔肝化坚为要
  - date: 1885
    title_zh: 骨槽风久溃牙关不开守中和汤不增不减
    rationale: 阳明多气多血久病脉虚温补过施恐偏故遵古方补托养血清化并行
