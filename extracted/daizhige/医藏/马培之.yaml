    start_date: 1840
    highlight_event_id: guji-马培之-event-1
  - key: breakthrough
    name: 专精外科
    labels:
      zh: 擅长疡科
    start_date: 1855
    highlight_event_id: guji-马培之-event-1
  - key: climax
    name: 辑方成集
    labels:
      zh: 传薪集成
    start_date: 1870
    highlight_event_id: guji-马培之-event-2
  - key: closure
    name: 刊传后世
    labels:
      zh: 薪火流传
    start_date: 1885
    highlight_event_id: guji-马培之-event-2
  decisions:
  - date: 1855
    title_zh: 舍内科而专外科
    rationale: 以外科多秘方而少全书，愿以专精补医林之缺
  - date: 1870
    title_zh: 详载方药加减用法
    rationale: 恐后学执方而昧变，故于阳和西黄金龙诸方备载煎服引经及老幼剂量
- id: guji-马培之-endeavor-2
  title_zh: 悬壶孟河授徒传薪
  summary: 坐诊孟河，以外科活人无数，并授徒星伯等使传薪集广布江南
  phases:
  - key: brewing
    name: 乡里行医
    labels:
      zh: 初设诊
    start_date: 1850
    highlight_event_id: guji-马培之-event-1
  - key: breakthrough
    name: 名重江南
    labels:
      zh: 征君之名
    start_date: 1865
    highlight_event_id: guji-马培之-event-1
  - key: climax
    name: 授徒星伯
    labels:
      zh: 嫡传授业
    start_date: 1880
    highlight_event_id: guji-马培之-event-3
  - key: closure
    name: 许恒转传周氏
    labels:
      zh: 辗转得书
    start_date: 1895
    highlight_event_id: guji-马培之-event-3
  decisions:
  - date: 1880
    title_zh: 收邓氏星伯为徒倾囊相授
    rationale: 以外科非口传心授不能得其妙，择谨厚者传之可保薪火不坠
  - date: 1890
    title_zh: 许门人录方外传不秘
    rationale: 以济人利物为心，不以家技自珍，任其假录流布以广活人
events:
- id: guji-马培之-event-birth
  title_zh: 生于孟河医家
  date: 1820
  year_of: 1820
  place_zh: 江苏孟河
  summary: 清道光初生于江苏孟河，少习医籍，长而独究外科
- id: guji-马培之-event-1
  title_zh: 精擅外科名重江南
  date: 1865
  year_of: 1865
  place_zh: 江苏孟河
  summary: 以善治痈疽发背瘰疬疔疮闻，人称孟河马培之征君，擅长外科
- id: guji-马培之-event-2
  title_zh: 辑成外科传薪集
  date: 1870
  year_of: 1870
  place_zh: 江苏孟河
  summary: 集冰梅丸阳和丸西黄丸金龙丸金黄散阳和解凝膏诸方，备载主治修制服法，成外科传薪集
- id: guji-马培之-event-3
  title_zh: 授徒星伯辗转传书
  date: 1880
  year_of: 1880
  place_zh: 江苏孟河
  summary: 授业于邓羹和胞侄星伯，星伯再传许恒，周镇伯华得而录藏，丁酉以其方疗母背疽获痊
- id: guji-马培之-event-death
  title_zh: 卒于孟河
  date: 1903
  year_of: 1903
  place_zh: 江苏孟河
  summary: 清光绪二十九年卒，外科诸方赖传薪集得以流传后世
