  decisions:
  - date: 1885
    title_zh: 辨肝痈非肝气立化肝消毒等八方
    rationale: 肝痈初起易误作肝气而用辛香耗气以致贻误故详脉象弦数弦涩弦滑之别分期论治
  - date: 1895
    title_zh: 以案载方存真不饰效验
    rationale: 岩疽失荣多属难治之症据实录存活与不治之案使后学者知进退不自恃万能
