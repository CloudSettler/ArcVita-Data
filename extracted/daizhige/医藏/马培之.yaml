  summary_first_person: 吾马培之籍属无锡专攻外科疡科一生诊治疔毒痈疽乳岩舌岩骨槽风肝痈诸症以养阴清肝化痰解毒为要晚年录医案以示后学但愿审脉辨证勿以肝气轻视胁痈
