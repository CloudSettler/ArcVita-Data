  archetype: 外科传薪者
  dilemmas:
  - 内科显学而外科被视为小道，如何坚守外科正脉
  - 家传秘方宜藏宜传之间，如何传薪后学而不失其真
  lesson: 外科虽在皮肉筋骨，其理与内科一贯，贵在辨阴阳寒热，收方传后则薪火不灭
  summary_first_person: 余马培之，孟河人也，世业医而独专外科，集诸家疡科方论，辑为传薪集，阳和西黄金龙诸丸散膏丹并载，以期后之学者按症检方，化重为轻，薪传不绝
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E5%A4%96%E7%A7%91%E4%BC%A0%E8%96%AA%E9%9B%86.html
