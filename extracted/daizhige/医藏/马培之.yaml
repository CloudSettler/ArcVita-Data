endeavors:
- id: guji-马培之-endeavor-1
  title_zh: 精研疡科辑成传薪集
  summary: 博采外科丸散膏丹，辨寒热阴阳，辑成外科传薪集以惠后学
  phases:
  - key: brewing
    name: 孟河积学
