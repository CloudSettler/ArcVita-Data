    title_zh: 不雷同隐庵别名直解
    rationale: 集注义意艰深而晦，欲直捷明白可合正文诵读，故更注颜曰直解
  - date: 1695-03-01
    title_zh: 信诸吾心质轩岐而梓
    rationale: 诸刻纷坛是非难辨，不冀人之知，但信吾心质轩岐俟后君子，故付剞劂
