    rationale: 素问论阴阳血气而无治法，必先以伤寒集注明识证施治之法，故先梓以问世
  - date: 约1695
    title_zh: 经论俱成而后梓真传
    rationale: 圣贤经论犹布帛菽粟，必经论俱成方可为衣可食以利人，故姑待而后梓
