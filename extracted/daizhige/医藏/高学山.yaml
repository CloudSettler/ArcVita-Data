  birth_date: 1680
  death_date: 1755
  era: 清
  reign_ref: 康熙至乾隆
  archetype: 医经注家
  dilemmas:
  - title_zh: 遵经还是泥经
    description: 面对旧本错简与经旨相背处，是否敢于移篇断句，以义理正文字
  - title_zh: 补泻顺逆之惑
    description: 内经以逆为补与仲景以顺为补不同，如何以气血神志分疏而两全
  lesson: 珍重元真以治未病，审色脉天时以知机，注经当以义理通文字
  summary_first_person: 吾乃高学山，承仲景金匮之学，观旧本篇首错简，特移腠理条于卷首，以元真通畅为一十七条大纲，又申治未病实脾之妙，辨色脉四时之变，愿后学养慎元真而先治其未病
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%AB%98%E6%B3%A8%E9%87%91%E5%8C%AE%E8%A6%81%E7%95%A5.md
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E9%AB%98%E6%B3%A8%E9%87%91%E5%8C%AE%E8%A6%81%E7%95%A5.html
endeavors:
- id: guji-高学山-endeavor-1
  title_zh: 高注金匮要略成书
  summary: 以义理校旧本，移腠理条于篇首，逐条疏解脏腑经络先后病脉证治
  phases:
  - key: brewing
    name: 潜心仲景
    labels:
      zh:
      - 研读金匮
    start_date: 1705
    highlight_event_id: guji-高学山-event-study
  - key: breakthrough
    name: 移篇定纲
    labels:
      zh:
      - 移腠理条于篇首
    start_date: 1725
    highlight_event_id: guji-高学山-event-gang
  - key: climax
    name: 逐条高注
    labels:
      zh:
      - 注十七条
    start_date: 1735
    highlight_event_id: guji-高学山-event-zhu
  - key: closure
    name: 刊行流传
    labels:
      zh:
      - 高注刊行
    start_date: 1745
    highlight_event_id: guji-高学山-event-publish
  decisions:
  - date: 1725
    title_zh: 移腠理条于篇首立纲
    rationale: 玩其文义确是开章语气，内因外因不内外因三条总纲后文，故僭移以正旧本之失
  - date: 1735
    title_zh: 以元真通畅为治病养生之要
    rationale: 元真充则经络不受邪，血脉不壅塞，故以此统摄二十五篇及本篇十七条
- id: guji-高学山-endeavor-2
  title_zh: 阐发治未病与色脉天时之学
  summary: 申见肝传脾先实脾之要妙，会顺补逆补之别，合色脉四时与甲子气运以助上工
  phases:
  - key: brewing
    name: 考辨补脾
    labels:
      zh:
      - 治未病
    start_date: 1730
    highlight_event_id: guji-高学山-event-weibing
  - key: breakthrough
    name: 辨顺逆补泻
    labels:
      zh:
      - 气血神志分疏
    start_date: 1736
    highlight_event_id: guji-高学山-event-weibing
  - key: climax
    name: 合参色脉闻息
    labels:
      zh:
      - 望闻切合参
    start_date: 1740
    highlight_event_id: guji-高学山-event-semai
  - key: closure
    name: 推明天时气运
    labels:
      zh:
      - 甲子温和
    start_date: 1743
    highlight_event_id: guji-高学山-event-tianshi
  decisions:
  - date: 1736
    title_zh: 以顺为补论仲景实脾法
    rationale: 内经逆为补以补神志，仲景顺为补以补气血，木喜阳和而畏寒雪，故酸苦甘各有所归
  - date: 1740
    title_zh: 合望色闻声切脉以决上工
    rationale: 鼻头五色分水饮亡血，语声寂寂啾啾分上下焦，寸口浮沉分表里，故非三诊合参不能治未病
events:
- id: guji-高学山-event-birth
  date: 1680
  year_of: 1680
  title_zh: 降生
  description: 清康熙年间生，少承内经难经，壮而专治仲景
- id: guji-高学山-event-study
  date: 1705
  year_of: 1705
  title_zh: 研读金匮旧本
  description: 遍考金匮旧本，疑脏腑经络先后病篇第二条实为开章语气，立志正其错简
- id: guji-高学山-event-gang
  date: 1725
  year_of: 1725
  title_zh: 移腠理条立三因大纲
  description: 移腠者三焦通会元真之处条于篇首，发明经络受邪为内因，四肢九窍壅塞为外因，房室金刃虫兽为不内外因，以元真通畅为养慎之要
- id: guji-高学山-event-zhu
  date: 1735
  year_of: 1735
  title_zh: 高注逐条疏解
  description: 就厥阳独行实气相抟脉脱浸淫疮阳病十八阴病十八等条，辨入脏即死入腑即愈之机
- id: guji-高学山-event-weibing
  date: 1736
  year_of: 1736
  title_zh: 注治未病见肝传脾
  description: 疏见肝之病当先实脾，四季脾王不受邪，肝虚用酸苦甘调之，实则不在用，兼明虚虚实实补不足损有余之义
- id: guji-高学山-event-semai
  date: 1740
  year_of: 1740
  title_zh: 论鼻色语声息脉
  description: 释鼻头青黑黄白赤主腹痛水气胸寒亡血，语声寂然啾啾分骨节心膈头中，息摇肩引胸张口分心中坚咳肺痿，寸口脉动因王时而动
- id: guji-高学山-event-tianshi
  date: 1743
  year_of: 1743
  title_zh: 发明天时未至而至之变
  description: 释冬至后甲子少阳起，温和早迟大寒太过皆为乖舛，上工当知天时补救色脉之偏
- id: guji-高学山-event-publish
  date: 1745
  year_of: 1745
  title_zh: 高注金匮要略刊行
  description: 高注全书告成，以脏腑经络先后病第一为纲领，流传医林
- id: guji-高学山-event-death
  date: 1755
  year_of: 1755
  title_zh: 辞世
  description: 清乾隆年间卒，注本独以义理胜，后世习金匮者多宗之
