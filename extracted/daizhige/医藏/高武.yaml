  birth_date: 1485
  death_date: 1560
  era: 明
  reign_ref: 明世宗嘉靖
  archetype: 医家
  dilemmas:
  - 伤寒热入血室与闪挫诸疾非药饵可愈当弃针灸还是针药并施
  - 诸家针赋变法日繁似易乱易当守素难古法还是从俗变法
  lesson: 治病如对垒攻守奇正并用，溯原穷流，以素难折衷诸家，方能去取得宜以收十全之功
  summary_first_person: 我是四明梅孤子高武，见医者弃针灸不讲遇刺疾则束手无策，遂研精素问难经旁究诸家，先集节要一书，后于嘉靖己丑纂成针灸聚英，以经络腧穴病证类聚，折衷古今，使司命者知所去取
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E9%92%88%E7%81%B8%E8%81%9A%E8%8B%B1.md
