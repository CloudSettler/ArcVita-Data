  - title_zh: 清修恬淡与繁华交游之衡
    description: 生于繁华之地而慕山林清修，既喜宾朋清赏又恐耗神，当立出入中道
  - title_zh: 博采旧方与亲验真伪之辨
    description: 养生方术汗牛充栋真伪杂糅，若尽信则误身，若尽弃则失传，当以格物亲试别之
  lesson: 养生先养心，起居有节，饮食有度，交游有则，清赏怡情，方能延年安乐
  summary_first_person: 吾乃钱塘高濂字深甫号瑞南道人，生逢嘉靖万历之世，慕清修而厌纷扰，博览医藏道典，集四时调摄延年起居之法，成遵生八笺八卷，又作玉簪传奇以寄幽情，愿世人安乐颐养各得其所
