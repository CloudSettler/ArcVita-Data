  archetype: 删繁就简之温病良医
  dilemmas:
  - 温病与伤寒水火冰炭不相入而世人袭伤寒法治温抱薪救火何以挽之
  - 温病条辨卷帙繁重穷乡僻壤难以研索每遇温病仍沿旧法何以广布
  lesson: 遵内经辛凉咸寒之旨分三焦气血施治删繁就简使僻壤穷乡咸知信守方能仁寿斯民
  summary_first_person: 余客豫数十年目击温病误投麻桂辛温杀人如操刃心伤久拟别辑简编乃命门人萧吉甫博采吴叶薛王章诸家删繁就简成温病指南两卷冀广布穷乡永无夭札
  source_urls:
