    description: 葛氏肘后千金仁斋直指陈氏诸说纷杂，参会众说自成一家
  - title_zh: 署名难考何以传信
    description: 相传为鲁氏之学而无左验，唯以百问问答预答来问
  lesson: 保婴须保元气，预为堤防，薄衣节乳，见风日以刚血气
  summary_first_person: 吾悯婴童气未定而疾易感，集钱氏遗意及诸家方论，以百问立名，每问浚源表证对疗，愿全其元气以保其生
