endeavors:
- id: guji-黄元御-endeavor-1
  title_zh: 疏解伤寒金匮撰长沙药解
  summary: 以中气升降释仲景方药，以甘草白术人参大枣等培土养中，发明经方本义
  phases:
  - key: brewing
    name: 目病转医博览仲景
