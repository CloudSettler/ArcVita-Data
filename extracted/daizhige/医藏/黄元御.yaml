  decisions:
  - date: '1730'
    title_zh: 弃举业专究岐黄
    rationale: 目疾难应科场，转以医道济世，宗法轩岐仲景以立根基
  - date: '1753'
    title_zh: 以土德统摄四象药性
    rationale: 见甘草得土中和能交媾精神气血，遂以培中土为诸方纲领而著书明之
- id: guji-黄元御-endeavor-2
  title_zh: 阐发四圣心源立一气周流之旨
  summary: 融素问灵枢难经伤寒金匮为一气周流土枢四维之学，行医京师并传道后学
  phases:
  - key: brewing
    name: 草堂讲学辨水火土枢
    labels:
      zh:
      - 左升右降
      - 水火交济在土
    start_date: '1748'
    highlight_event_id: guji-黄元御-event-1
  - key: closure
    name: 入京行医著述传后
    labels:
      zh:
      - 四圣心源
      - 悬解伤寒金匮
    start_date: '1754'
    highlight_event_id: guji-黄元御-event-3
  decisions:
  - date: '1753'
    title_zh: 作四圣心源总提医纲
    rationale: 为使升降之理有所统摄，先立一气周流之论再分疏诸经方药
  - date: '1754'
    title_zh: 应召入京以医进身
    rationale: 借京师行医验方救人，广传中气之学以补时医滋阴攻伐之偏
