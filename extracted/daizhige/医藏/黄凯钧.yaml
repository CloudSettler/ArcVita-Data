      - 读神农本草
      - 览纲目
      - 蓄短长疑
    start_date: 1850-01-01
    highlight_event_id: guji-黄凯钧-event-zhuzuo
  - key: breakthrough
    name: 辨参芪得要
    labels:
      zh:
      - 辨人参
      - 辨黄芪白术
      - 悟补土生金
    start_date: 1860-01-01
    highlight_event_id: guji-黄凯钧-event-zhuzuo
  - key: climax
    name: 辑成药笼小品
    labels:
      zh:
      - 辑各论
      - 明宜忌
      - 付圈校
    start_date: 1865-01-01
    highlight_event_id: guji-黄凯钧-event-zhuzuo
  - key: closure
    name: 付校流传
    labels:
      zh:
      - 鄞县圈校
      - 序以传意
      - 惠后学
    start_date: 1870-01-01
    highlight_event_id: guji-黄凯钧-event-zhuzuo
  decisions:
  - date: 1860-06-01
    title_zh: 以人才喻药性立辨药纲领
    rationale: 尧舜善治而不如童子驱羊秦武举鼎而有绝脰之患故参芪虽贵不可滥恃蛇床虽贱用当则长当详辨宜忌以正浪服之弊
  - date: 1865-03-01
    title_zh: 详书人参产价变迁以戒虚耗
    rationale: 国初大参易得今则价十倍而力薄见倾资服参反肿无济故备书记时价参力倡少用的当续以西党代之之法
- id: guji-黄凯钧-endeavor-2
  person_id: guji-黄凯钧
  title_zh: 临证治肺咳哮喘立三参玉屏之法
  summary: 以补土生金固表之理治肺虚久咳哮喘创三参饮与玉屏风合异功为丸之验方
  phases:
  - key: brewing
    name: 临证察肺虚
    labels:
      zh:
      - 察肺虚咳嗽
      - 究补土生金
      - 试异功散意
    start_date: 1868-01-01
    highlight_event_id: guji-黄凯钧-event-sancan
  - key: breakthrough
    name: 创三参饮获效
    labels:
      zh:
      - 用党参元参北沙参
      - 兼降气消痰
      - 多获效
    start_date: 1870-01-01
    highlight_event_id: guji-黄凯钧-event-sancan
  - key: climax
    name: 玉屏防哮复发
    labels:
      zh:
      - 玉屏风固表
      - 合异功加杏苏
      - 为丸令服
    start_date: 1872-01-01
    highlight_event_id: guji-黄凯钧-event-yuping
  - key: closure
    name: 笔之小品示人
    labels:
      zh:
      - 记验于药条
      - 示肺邪忌补
      - 传后防发
    start_date: 1875-01-01
    highlight_event_id: guji-黄凯钧-event-yuping
  decisions:
  - date: 1870-08-01
    title_zh: 定三参饮治肺虚咳嗽
    rationale: 肺虚宜淡补忌邪滞用人参党参元参北沙参轻清润补兼降气消痰则土旺金生咳可平故立为常法并戒肺邪未清者勿施
  - date: 1872-10-01
    title_zh: 定玉屏合异功丸防哮喘
    rationale: 哮喘愈后表虚易发用黄芪白术防风固表合异功补土加杏仁苏子降气为丸久服多致不发故以防为治示固本之意
