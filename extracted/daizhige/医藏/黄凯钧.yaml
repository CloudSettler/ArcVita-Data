endeavors:
- id: guji-黄凯钧-endeavor-1
  person_id: guji-黄凯钧
  title_zh: 辑著药笼小品辨群药性味
  summary: 博览本草纲目辨参芪术草升降补泻之宜忌以贱显贵以偏补全成一家辨药之学
  phases:
  - key: brewing
    name: 蓄疑览本草
    labels:
