  dilemmas:
  - 参芪为上药有时亦能流弊蛇床为下品用当亦擅其长当如何权衡短长
  - 时人倾资浪服贵参反致浮肿无济当如何劝其用的确当
  lesson: 药如人才各有短长用当则少亦有功浪服则多亦无益
  summary_first_person: 吾乃嘉善退庵黄凯钧也览神农本草至时珍纲目药味浩繁而性味所主学者昧于取舍故或据前人已言或本心得所辨参芪术草之宜忌辑为药笼小品冀汇通其意以助措手
