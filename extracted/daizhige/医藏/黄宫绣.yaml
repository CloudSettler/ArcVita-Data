  lesson: 去肤廓化裁尽变，以胃气和缓为本，临症变活为要
  summary_first_person: 我考先哲脉论，见有牵引时令敷衍满幅，有就脉就症毫无变换，遂缀精聚华另为篇帙，先明部位脉象，后层层剥进诊脉大要，以求声色俱泯活泼通变
