  decisions:
  - date: '1765'
    title_zh: 以气味相类编次不以草木昆虫为纲
    rationale: 气味同则性能近，依类合观方能毫厘不谬，便于临症披阅
  - date: '1768'
    title_zh: 删牵引混说从实阐发
    rationale: 桑白皮枳壳桔梗等义蕴难明处逐一详解，不随声附和致眩耳目
- id: guji-黄宫绣-endeavor-2
  title_zh: 行医垂训济世活人
  summary_zh: 以温补甘温为正，分辨虚实阴阳，诰诫宜忌以免临症歧亡
  phases:
  - key: brewing
    name: 临症体认虚实
    labels:
      zh: 酝酿
    start_date: '1750'
    highlight_event_id: guji-黄宫绣-event-practice
  - key: climax
    name: 示人参黄耆当归白术之用
    labels:
      zh: 高潮
    start_date: '1769'
    highlight_event_id: guji-黄宫绣-event-practice
  - key: closure
    name: 申明宜忌以训后学
    labels:
      zh: 收束
    start_date: '1775'
    highlight_event_id: guji-黄宫绣-event-publish
  decisions:
  - date: '1766'
    title_zh: 参耆须辨虚实而用不畏发热
    rationale: 参以补虚非以填实，元气素虚者佐参领邪外出，虚实分辨则用无误
  - date: '1770'
    title_zh: 既明其宜复诰其忌
    rationale: 药有宜即有忌，喜忌并知方无临症岐亡之弊
events:
- id: guji-黄宫绣-event-birth
  title_zh: 出生
  date: '1720'
  year_of: 1720
  description_zh: 约生于清康熙末年，浙江士人，潜心医学本草
- id: guji-黄宫绣-event-draft
  title_zh: 起稿考订诸家本草
  date: '1765'
  year_of: 1765
  description_zh: 遍绎诸书，考订形质气味经络，立凡例辨补泻阴阳气血
- id: guji-黄宫绣-event-publish
  title_zh: 本草求真成书刊刻
  date: '1769'
  year_of: 1769
  description_zh: 以补火滋水散寒泻热为类分卷成书，详人参黄耆当归白术等温中补剂，另附草木金石篇目
- id: guji-黄宫绣-event-practice
  title_zh: 以补益之法活人垂训
  date: '1775'
  year_of: 1775
  description_zh: 持甘温补脾为正，论白术人参黄耆之用，分辨表里虚实，申喜忌以教后学
- id: guji-黄宫绣-event-death
  title_zh: 逝世
  date: '1811'
  year_of: 1811
  description_zh: 约卒于清嘉庆年间，本草求真流传后世为医家辨药要籍
