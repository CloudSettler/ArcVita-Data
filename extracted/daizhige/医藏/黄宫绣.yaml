  - title_zh: 泥古与求真
    description_zh: 本经传言多肤廓，当尊古存疑还是从实考辨以求真
  - title_zh: 补泻混指之弊
    description_zh: 诸书补泻不分阴阳气血，当附会旧说还是直指形质气味归经
  lesson: 辨药须核形质气味经络，不泥古不徇今，理与病符药与病对
  summary_first_person: 余黄宫绣，见诸书理道不明补泻混指，遂搜剔考订，删牵引混说，编成本草求真，惟求真处悉见，不眩人耳目
