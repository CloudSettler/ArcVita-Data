- id: guji-黄宫绣-event-study
  title_zh: 遍考内经脉经诸家脉学
  date: '1765'
  year_of: 1765
  summary: 考王叔和脉经太素濒湖脉学诊宗三昧等，辨其拾经杂毒刻舟求剑之失
- id: guji-黄宫绣-event-xinfa
  title_zh: 撰成新著脉法心要部位胃气浮沉迟数诸论
  date: '1780'
  year_of: 1780
  summary: 明左右寸关尺候脏腑上下，立气口气口胃气为终身之占，辨浮沉数迟长短大小洪微实虚诸脉有力无力
- id: guji-黄宫绣-event-publish
  title_zh: 脉理求真卷一成书刊行
  date: '1785'
  year_of: 1785
  summary: 以鄙句缀精聚华去肤廓化裁尽变，弁首示人毋取脉象部位而置后幅变活要义于不审
- id: guji-黄宫绣-event-death
  title_zh: 逝世
  date: '1800'
  year_of: 1800
  summary: 清嘉庆初年约卒，脉理求真传于医藏后世奉为诊要切语
