endeavors:
- id: guji-黄宫绣-endeavor-1
  title_zh: 撰著脉理求真卷一新著脉法心要
  summary: 考订王叔和以下诸家得失，重立部位胃气纲要，辨浮沉迟数长短大小洪微实虚诸脉
  phases:
  - key: brewing
    name: 考诸先哲缀精聚华
    labels:
      zh:
      - 考据
      - 脉学
    start_date: '1765'
    highlight_event_id: guji-黄宫绣-event-study
  - key: breakthrough
    name: 另立部位胃气纲要
    labels:
      zh:
      - 立纲
    start_date: '1770'
    highlight_event_id: guji-黄宫绣-event-xinfa
  - key: climax
    name: 详辨二十余种脉象
    labels:
      zh:
      - 辨脉
    start_date: '1778'
    highlight_event_id: guji-黄宫绣-event-xinfa
  - key: closure
    name: 弁首成卷一心要
    labels:
      zh:
      - 成书
    start_date: '1785'
    highlight_event_id: guji-黄宫绣-event-publish
  decisions:
  - date: '1770'
    title_zh: 不守寸关尺另为篇帙
    rationale: 俗传脉诀词鄙非叔和本书，守部位测病甚非，故另立活泼化裁篇帙
  - date: '1778'
    title_zh: 以胃气和缓统六脉吉凶
    rationale: 元气来则和缓邪气至则劲急，谷食减少即胃气将绝，故舍时令生克独标和缓微弦微洪
- id: guji-黄宫绣-endeavor-2
  title_zh: 临症推行诊脉变活要义
  summary: 主张六部浮中沉分候表里中，外以候外里以候里，头痛淋遗等不拘上下，审有力无力有神无神分虚实寒热
  phases:
  - key: brewing
    name: 审浮沉表里错见
    labels:
      zh:
      - 临症
    start_date: '1772'
    highlight_event_id: guji-黄宫绣-event-study
  - key: breakthrough
    name: 提出有力无力为纲
    labels:
      zh:
      - 提纲
    start_date: '1780'
    highlight_event_id: guji-黄宫绣-event-xinfa
  - key: climax
    name: 数迟真假寒热互参
    labels:
      zh:
      - 辨证
    start_date: '1783'
    highlight_event_id: guji-黄宫绣-event-xinfa
  - key: closure
    name: 示人先观脉象后究变活
    labels:
      zh:
      - 示教
    start_date: '1785'
    highlight_event_id: guji-黄宫绣-event-publish
  decisions:
  - date: '1780'
    title_zh: 总以有力无力有神无神区别
    rationale: 浮数沉迟皆有真假虚实，不越有力无力，故不概指表热里寒
  - date: '1783'
    title_zh: 数主寒迟主热互参合症审察
    rationale: 阴盛逼阳可数，热邪壅结可迟，必合兼症兼脉举按虚实乃定温清攻补
events:
