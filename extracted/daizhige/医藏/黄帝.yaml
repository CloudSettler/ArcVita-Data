    highlight_event_id: guji-黄帝-event-2
  decisions:
  - date: -2600
    title_zh: 必先诊脉视气剧易
    rationale: 五脏气绝而反实其内外则重竭逆厥而死，故审血脉存亡
  - date: -2598
    title_zh: 春夏秋冬各有所取
    rationale: 气之所处病之所舍不同，故络脉俞合井荥各随四时浅深
events:
- id: guji-黄帝-event-birth
  title_zh: 轩辕诞生为黄帝
  date: -2697
  year_of: -2697
  summary: 生于姬水之滨，立为五帝之首，子万民而养百姓
- id: guji-黄帝-event-1
  title_zh: 问岐伯论九针十二原
  date: -2603
  year_of: -2603
  summary: 问于岐伯愿闻针道，论小针守神知机，制九针形制，明补泻迎随虚实，定十二原治五脏六腑
- id: guji-黄帝-event-2
  title_zh: 问本输通经络俞穴
  date: -2599
  year_of: -2599
  summary: 问十二经络终始五俞六合，考肺心肝脾肾膀胱胆胃三焦小肠大肠所出所入，定四时取穴及色脉尺相应之法
- id: guji-黄帝-event-death
  title_zh: 黄帝崩
  date: -2597
  year_of: -2597
  summary: 功成制经传后世，寿终而崩，针经灵枢之学流传不绝
