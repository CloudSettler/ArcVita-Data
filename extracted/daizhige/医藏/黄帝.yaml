  dilemmas:
  - 子万民而哀其不给多疾，如何养民而不伤民
  - 欲勿使被毒药无用砭石，如何以微针通经调气
  - 经络表里终始繁杂，如何立纲纪传后世而不灭
  lesson: 守神知机明逆顺，以微针调血气，别表里立经纪以济众生
  summary_first_person: 余子万民养百姓而收租税，哀其不给而多疾病，欲勿使被毒药无用砭石，以微针通经脉调血气荣逆顺出入之会，先立针经令传后世终而不灭
