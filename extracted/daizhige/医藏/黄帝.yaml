    title_zh: 欲以微针通经脉
    rationale: 不欲使民被毒药用砭石，故求易用难忘之法调血气
  - date: -2602
    title_zh: 取十二原治五脏有疾
    rationale: 四关主治五脏，禀三百六十五节气味，故明其原睹其应
