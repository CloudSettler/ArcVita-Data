  decisions:
  - date: 1732-01-01
    title_zh: 放浪自省广购眼科方书
    rationale: 文战不利双睛不利虚度岁月为赘物故以自治治人功效验而立志从医
  - date: 1736-01-01
    title_zh: 备礼拜培风山人为师
    rationale: 内障头风针砭未窥其秘闻山人工是术故倾囊相从夙夜谨事以求十全
  - date: 1739-01-01
    title_zh: 游历豫吴湖海行医济世
    rationale: 家口二十余贫不较利藉医自活兼广证眼症以实证补方书之不足
- id: guji-黄庭镜-endeavor-2
  title_zh: 汇辑笔乘编著目经大成
  description: 检多年笔乘分症治方汇成目经阐五轮八廓内景经络兼收针割钩烙得冢宰魏定国赏识付梓以与天下共之
  phases:
