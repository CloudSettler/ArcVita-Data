  decisions:
  - date: 1741-01-01
    title_zh: 春雨旬日检乘成卷署名目经大成
    rationale: 目为至宝书无佳本授受不得其人故博古尚论汇论症方各为上下卷以垂后
  - date: 1742-01-01
    title_zh: 承魏定国序出书与天下共之
    rationale: 冢宰钜乡大儒言论不苟既悦服为序即遵嘱付梓不作燕石自藏
  - date: 1745-01-01
    title_zh: 藏家学以授子孙不轻授人
    rationale: 立志远大秘不轻传恐妄庸窜易贻祸无穷故藏诸家以待嫡孙校刊
events:
