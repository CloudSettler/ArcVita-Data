  lesson: 以儒通医以诚感师以书传道目明由心明养德即养生
  summary_first_person: 余濉川不尘子黄庭镜也少习儒业文战不利又哀毁伤目遂广购方书自治治人复师事培风山人尽得内障针砭之秘游艺湖海藉眼医活口二十余检平生笔乘汇为目经大成愿与天下共之使盲者复明后学有宗足矣
