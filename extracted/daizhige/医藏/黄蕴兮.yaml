  summary_first_person: 吾乃石阳黄蕴兮究心脉学已久以轩岐为宗采诸贤可信之理证之于经复出己意旁探博求著脉确一书删繁定为二十三脉惟恐识见有限自以为确而未必能确愿高明校正以利后学
