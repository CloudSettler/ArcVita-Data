    title_zh: 以经为主兼采诸贤
    rationale: 医凭乎脉脉衷乎理于诸贤论脉采其的然可信者据以为确未的则证之于经复出己意旁探博求
  - date: 1744-01-01
    title_zh: 删七名定二十三脉
    rationale: 脉以候病名目愈多脉理愈晦删弱革牢疾大小七名以弱附细革附芤牢附沉疾即数大小即洪细使脉名精确不游疑无主
- id: guji-黄蕴兮-endeavor-2
  title_zh: 行医淮真以脉济世
  description: 应延赴淮治程母出示脉确稿晚年学益进得山阳李铸九真洲李乔年折服称许拟附伤寒论翼后刊行表里印证
