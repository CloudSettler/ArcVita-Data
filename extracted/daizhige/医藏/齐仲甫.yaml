  - 妇人隐疾难言而医者欲明辨证治之两难
  - 守古方之繁而创问答之简之权衡
  lesson: 以问答体化繁为简专明女科天癸经带胎产之要使后学易晓
  summary_first_person: 吾齐仲甫生于南宋，专志女科，悯妇人众阴所集感病倍于男子，遂以问答体撰女科百问上下二卷凡百问，上卷五十问明天癸经候血分经带，下卷五十问明妊娠胎产，刊于嘉定十三年，语言洗练说理清晰，愿后之学者按问索因调和气血以全慈幼之道
