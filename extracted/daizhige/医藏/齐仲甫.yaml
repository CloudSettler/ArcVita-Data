endeavors:
- id: guji-齐仲甫-endeavor-1
  title_zh: 撰女科百问上卷明经候血带
  summary: 以五十问论天癸经候经闭崩漏带下虚劳垂问作答并附当归饮七物汤温经汤等方
  phases:
  - key: brewing
    name: 搜辑经候诸证
    labels:
      zh: 天癸经候
    start_date: 1210
    highlight_event_id: guji-齐仲甫-event-shangjuan
  - key: climax
    name: 问答成编上卷
    labels:
      zh: 血分经带
    start_date: 1218
    highlight_event_id: guji-齐仲甫-event-kanxing
  decisions:
  - date: 1215
    title_zh: 立问答体统摄女科
    rationale: 妇科证多而杂故设为问以提纲答以释因使经候先后多寡有阴阳可辨
  - date: 1218
    title_zh: 以和阴阳调气血为大法
    rationale: 阴胜则寒凝经后而少阳胜则热溢经前而多故不专攻血而兼调营卫
- id: guji-齐仲甫-endeavor-2
  title_zh: 撰女科百问道下卷明胎产
  summary: 以五十问论妊娠胎气胎动难产产后诸疾避毒药全两命示妊娠将摄之宜
  phases:
  - key: breakthrough
    name: 推演妊娠胎产
    labels:
      zh: 妊娠胎产
    start_date: 1218
    highlight_event_id: guji-齐仲甫-event-xiajuan
  - key: closure
    name: 百问刊行传世
    labels:
      zh: 刊行济世
    start_date: 1220
    highlight_event_id: guji-齐仲甫-event-kanxing
  decisions:
  - date: 1219
    title_zh: 妊娠避毒存胎为先
    rationale: 妊娠挟病治法与丈夫同而独避毒药恐伤胎元故择平和之剂
  - date: 1220
    title_zh: 上下合为百问刊布
    rationale: 上卷言经带下卷言胎产合为百问使室女妇人妊娠产后各得其所宗故付梓行世
events:
- id: guji-齐仲甫-event-birth
  title_zh: 诞生于南宋
  date: 1180
  year_of: 1180
  place: 南宋境内
  description: 约南宋中叶生，赋禀习医，久视妇科，立志专攻女科一门
- id: guji-齐仲甫-event-shangjuan
  title_zh: 草创上卷五十问
  date: 1218
  year_of: 1218
  place: 南宋医肆
  description: 首论精血分男女本源次论婚嫁避年天癸经候及闭绝崩漏腹痛诸证，参合内经巢氏之说附以诸方
- id: guji-齐仲甫-event-xiajuan
  title_zh: 续成下卷五十问
  date: 1219
  year_of: 1219
  place: 南宋医肆
  description: 专论妊娠胎产诸病证治，明冲任养胎之理，戒峻毒，示保产之法，与上卷合为百问
- id: guji-齐仲甫-event-kanxing
  title_zh: 女科百问刊行
  date: 1220
  year_of: 1220
  place: 南宋嘉定十三年刊
  description: 二卷百问刊行于世，上卷五十问论天癸经候血分经带，下卷五十问论妊娠胎产，语言洗练针对性强，后收入珍本医书集成
- id: guji-齐仲甫-event-death
  title_zh: 卒于南宋后
  date: 1230
  year_of: 1230
  place: 南宋
  description: 撰书既成行于世后卒，其书以问答明妇产大要，为后世妇科专书之先导
