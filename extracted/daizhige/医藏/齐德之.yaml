  dilemmas:
  - 疮科多不诊脉专治其外，我若独倡诊候恐被讥为迂远
  - 古今方论浩繁芜杂，我若删繁举要恐挂一漏万
  lesson: 疮肿皆由阴阳不和气血凝滞，必合色脉诊候以决逆从成败
  summary_first_person: 吾齐德之，见疮科不诊脉而甘居浅陋，遂采素问难经以至千金外台圣惠总录之说，简编类次成外科精义，首载诊候入式，次明荣卫色脉，欲使临疾者察逆从决成败如黑白之分
