    start_date: '1330'
    highlight_event_id: guji-齐德之-event-study
  - key: climax
    name: 著成诊候入式与脉法
    labels:
      zh: 著成精义
    start_date: '1335'
    highlight_event_id: guji-齐德之-event-compile
  decisions:
  - date: '1335'
    title_zh: 首载诊候入式次论荣卫色脉
    rationale: 疮科灭裂于诊候，非明阴阳勇怯气血聚散不足以知逆从，故首立入式以正其本
- id: guji-齐德之-endeavor-2
  title_zh: 倡导疮肿诊脉将护虚实决治
  summary: 明二十六脉主病持手三部诀肺疽肺痿辨脓将护忌慎与虚实补泻，使疮医临疾决成败
  phases:
  - key: breakthrough
    name: 立二十六脉逆从之法
    labels:
      zh: 脉法决证
    start_date: '1335'
    highlight_event_id: guji-齐德之-event-compile
  - key: closure
    name: 垂将护虚实以全生
    labels:
      zh: 将护全生
    start_date: '1336'
    highlight_event_id: guji-齐德之-event-teach
  decisions:
  - date: '1336'
    title_zh: 详载将护饮食禁忌与虚实补泻
    rationale: 疮疽托命庸医则筋骨败遗穿通脏腑，惟良医择用清静调摄补虚托里方可保痊，故备载忌慎以诫后人
events:
