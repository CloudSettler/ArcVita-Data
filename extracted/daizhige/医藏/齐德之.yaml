- id: guji-齐德之-event-study
  date: '1330'
  year_of: 1330
  title_zh: 博览素问难经千金外台圣惠总录
  description: 历观古今治疗疮肿方书诊候略而未详，遂取素问难经灵枢甲乙叔和仲景扁鹊华佗千金外台圣惠总录诸家方论简编类次
- id: guji-齐德之-event-compile
  date: '1335'
  year_of: 1335
  title_zh: 著成外科精义论诊候脉法
  description: 首载诊候入式次论荣卫色脉参应，后明二十六脉名状所主及三部脏腑病证并肺疽肺痿诊法，谓览此则逆从成败如黑白易分
- id: guji-齐德之-event-teach
  date: '1336'
  year_of: 1336
  title_zh: 垂将护忌慎虚实之训
  description: 申将护忌慎择用良医清静恬淡调以粥药，备载畜兽飞禽菜蔬果木所忌及虚实补泻托里之法，诫脓血结聚则十死八九
- id: guji-齐德之-event-death
  date: '1350'
  year_of: 1350
  title_zh: 卒于元末
  description: 齐德之卒，外科精义流行于世为疮科诊候准绳
