endeavors:
- id: guji-齐德之-endeavor-1
  title_zh: 汇编古今诊候成外科精义上卷
  summary: 取黄帝素问难经灵枢甲乙及叔和仲景扁鹊华佗千金外台圣惠总录诸家诊候疮肿之说简编类次贯成篇帙
  phases:
