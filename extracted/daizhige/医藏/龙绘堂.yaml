  birth_date: 1800-01-01
  death_date: 1880-01-01
  era: 清
  reign_ref: 道光至光绪
  archetype: 乡野良医
  dilemmas:
  - 守古方与适今气运之间如何抉择
  - 穷脉理精微与训蒙医浅近之间如何兼顾
  lesson: 参透人情天理，守药性脉理之真，不泥古方乃能应变治病
  summary_first_person: 吾乃阳夏龙绘堂，字之章，自号蠢子，以医学启蒙后学，谓药性熟则心定，脉理精则如镜，不泥汤头歌，不拘古方，推气运论脉，主一贯贯穿，以濟今人之病
  source_urls:
  - https://daizhige.org/%E5%8C%BB%E8%97%8F/%E8%A0%A2%E5%AD%90%E5%8C%BB.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8C%BB%E8%97%8F/%E8%A0%A2%E5%AD%90%E5%8C%BB.md
endeavors:
- id: guji-蠢子医-endeavor-1
  title_zh: 著蠢子医阐药性脉理主药
  summary_zh: 作学医真诠诊脉下药诗治病主药诸篇，明温凉补泻，定六经虚实主药，戒后学泥汤头歌
  phases:
  - key: brewing
    name: 熟读药性初学脉
    labels:
      zh:
      - 学药性
      - 习脉理
    start_date: 1830-01-01
    highlight_event_id: guji-蠢子医-event-1
  - key: breakthrough
    name: 悟主药立提纲
    labels:
      zh:
      - 立主药
      - 定提纲
    start_date: 1845-01-01
    highlight_event_id: guji-蠢子医-event-1
  - key: climax
    name: 作真诠下药诗
    labels:
      zh:
      - 著真诠
      - 传下药诗
    start_date: 1850-01-01
    highlight_event_id: guji-蠢子医-event-1
  - key: closure
    name: 付印训蒙医
    labels:
      zh:
      - 付印
      - 训蒙
    start_date: 1860-01-01
    highlight_event_id: guji-蠢子医-event-2
  decisions:
  - date: 1845-01-01
    title_zh: 不泥汤头歌
    rationale: 古方治古病，今气运已变，须得脉理细审主药，不可抄方治今病
  - date: 1850-01-01
    title_zh: 每症必立主药
    rationale: 治病一定有主药，一药或二药为君，佐使随之，则胸中有把柄，下笔入圣
- id: guji-蠢子医-endeavor-2
  title_zh: 推气运一贯之法临证济世
  summary_zh: 以气运为主，言午会火极真气上薄，脉出本位，须上下推寻，以一贯贯穿周身治上中下诸病
  phases:
  - key: brewing
    name: 察气运验脉位
    labels:
      zh:
      - 推气运
      - 验脉位
    start_date: 1855-01-01
    highlight_event_id: guji-蠢子医-event-3
  - key: breakthrough
    name: 悟上下旁取之妙
    labels:
      zh:
      - 病在上取下
      - 病在下取上
    start_date: 1865-01-01
    highlight_event_id: guji-蠢子医-event-3
  - key: climax
    name: 立贯穿周身大法
    labels:
      zh:
      - 贯穿周身
      - 调燮中州
    start_date: 1870-01-01
    highlight_event_id: guji-蠢子医-event-3
  - key: closure
    name: 示人情天理为药
    labels:
      zh:
      - 参人情
      - 合天理
    start_date: 1875-01-01
    highlight_event_id: guji-蠢子医-event-3
  decisions:
  - date: 1865-01-01
    title_zh: 三部以上下亦须细审
    rationale: 今脉出本位，只看三部不中，须上下推寻方知虚实寒热
  - date: 1870-01-01
    title_zh: 以一贯贯通治病
    rationale: 周身骨节毛窍无不贯穿则气血周流，治上从下治下从上，治中旁取，无不利
events:
- id: guji-蠢子医-event-birth
  title_zh: 生于阳夏龙氏
  date: 1800-01-01
  year_of: 1800
  place_zh: 阳夏
  description_zh: 嘉庆道光间生于阳夏，名绘堂，字之章，少习儒兼通医理，立志以浅近言训蒙医
- id: guji-蠢子医-event-1
  title_zh: 撰学医真诠驳泥古方
  date: 1850-01-01
  year_of: 1850
  place_zh: 阳夏
  description_zh: 作学医真诠及汤头歌不可泥诸篇，言药性温凉补泻，脉理虚实寒热，主补中益气六味地黄为提纲，戒抄古方
- id: guji-蠢子医-event-2
  title_zh: 作诊脉下药诗定主药
  date: 1860-01-01
  year_of: 1860
  place_zh: 阳夏
  description_zh: 作诊脉下药诗及治病皆有主药篇，分肺心胃肝命肾六部虚实风火风寒，各定主药佐使，以开蒙医
- id: guji-蠢子医-event-3
  title_zh: 阐气运一贯贯穿法
  date: 1870-01-01
  year_of: 1870
  place_zh: 阳夏
  description_zh: 作医道以气运为主及医道从一贯得来金匮石室小脉案诸篇，言七情生火上下中三焦分治，以贯穿周身为要
- id: guji-蠢子医-event-death
  title_zh: 卒于乡里书付子侄刊行
  date: 1880-01-01
  year_of: 1880
  place_zh: 阳夏
  description_zh: 光绪初卒于乡，遗稿蠢子医由侄金门侄孙睿川等付印，杭州董志仁校刊，流传于世
