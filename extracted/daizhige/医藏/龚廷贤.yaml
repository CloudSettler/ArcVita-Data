endeavors:
- id: guji-龚廷贤-endeavor-1
  title_zh: 著书立说普济群生
  summary_zh: 博览医籍，厘繁就简，先后著成古今医鉴万病回春寿世保元仙方神彀等，不用切脉，问病投剂，药性平和，使穷檐小民亦可按症施治
  phases:
