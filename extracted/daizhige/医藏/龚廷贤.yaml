    start_date: 1592-01-01
    highlight_event_id: guji-龚廷贤-event-work2
  decisions:
  - date: 1587-01-01
    title_zh: 删繁就简分门析类著书
    rationale: 使不习脉者亦能问症投剂，以广济贫乏
  - date: 1590-01-01
    title_zh: 以平和稳妥之方刊布天下
    rationale: 弗忍私秘，欲起天下疲癃之民咸跻仁寿
- id: guji-龚廷贤-endeavor-2
  title_zh: 应聘鲁藩治妃辑禁方
  summary_zh: 癸巳秋应鲁王书币之聘，自大梁至鲁府，投一二剂辄效，历冬迨春而张妃鼓胀潜瘳，受题医林状元，将藩藏秘方与素蕴珍奇厘为四卷曰鲁府禁方
  phases:
  - key: brewing
    name: 海内访医荐金溪龚子
    labels:
