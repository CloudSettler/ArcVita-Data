    labels:
      zh:
      - 突破取效
    start_date: 1593-10-01
    highlight_event_id: guji-龚廷贤-event-work3
  - key: climax
    name: 受奖医林状元匾额
    labels:
      zh:
      - 高峰旌誉
    start_date: 1594-01-01
    highlight_event_id: guji-龚廷贤-event-work3
  - key: closure
    name: 厘定四卷刊布济世
    labels:
      zh:
      - 收束传方
    start_date: 1594-03-01
    highlight_event_id: guji-龚廷贤-event-work3
  decisions:
  - date: 1593-10-01
    title_zh: 赴藩投治鼓胀重症
    rationale: 究其方脉超迈群识，以一二剂先取奇效再图渐愈
  - date: 1594-03-01
    title_zh: 以验方推而广之付梓
    rationale: 施药限于一方，传方布于天下，以慰济人利物素志
