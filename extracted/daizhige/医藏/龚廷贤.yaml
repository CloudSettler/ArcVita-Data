  decisions:
  - date: 1560
    title_zh: 定志辑录内府民间验方
    rationale: 内府秘方藏之深宫则及人者寡，民间验方散而无统则传之不远，故当兼收并蓄以备刊布
  - date: 1615
    title_zh: 刊刻寿世保元等医书
    rationale: 年事已高，惧平生所学随身而没，不如付梓以寿世，使后学有所依据
- id: guji-龚廷贤-endeavor-2
  title_zh: 专女科集经验以传内府秘法
  summary: 以妇人经带胎产为专务，分卷论述月经调经安胎产后诸症，撰成内府秘传经验女科，详脉法方药加减，垂为女科绳墨
  phases:
  - key: brewing
