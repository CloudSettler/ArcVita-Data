  - key: climax
    name: 撰成内府秘传经验女科
    labels:
      zh:
      - 女科成书
    start_date: 1587
    highlight_event_id: guji-龚廷贤-event-nvke
  - key: closure
    name: 女科方论传习后世
    labels:
      zh:
      - 传习后学
    start_date: 1619
    highlight_event_id: guji-龚廷贤-event-death
  decisions:
  - date: 1575
    title_zh: 以女科单列成书
    rationale: 妇人以血为本，经带胎产各有专治，若附于杂病则隐微难明，故当专卷详论以便检用
  - date: 1587
    title_zh: 直书脉症方药不隐秘传
    rationale: 内府经验本为宫中所重，然妇疾多羞于启齿，医者不明则误人性命，不如和盘托出以全活为心
events:
- id: guji-龚廷贤-event-birth
  title_zh: 出生于江西金溪医家
  date: 1522
  year_of: 1522
  description: 明嘉靖元年左右生于江西金溪，父龚信为名医，著古今医鉴，幼而习医
- id: guji-龚廷贤-event-taiyiyuan
  title_zh: 入太医院任吏目
  date: 1552
  year_of: 1552
  description: 承家学入太医院供职为吏目，博观内府方籍，兼治内外妇儿诸科，尤精女科
- id: guji-龚廷贤-event-nvke
  title_zh: 撰成内府秘传经验女科
  date: 1587
  year_of: 1587
  description: 集月经经闭崩漏带下安胎恶阻产后诸论及脉法方药，撰成内府秘传经验女科三卷以传世
- id: guji-龚廷贤-event-shoushi
  title_zh: 刊刻寿世保元等书
  date: 1615
  year_of: 1615
  description: 晚年刊刻寿世保元万病回春等巨著，将平生内外妇儿各科经验汇为完书，风行海内
- id: guji-龚廷贤-event-death
  title_zh: 寿终
  date: 1619
  year_of: 1619
  description: 明万历年间寿终，一生以纂述济世为业，遗书多为后世医家所宗
