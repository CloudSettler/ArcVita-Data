  archetype: 救时社稷之臣
  dilemmas:
  - 社稷与君主孰重：拥立郕王以安社稷，埋下夺门杀身之祸
  - 直言抗权与同僚倾轧：威令严密裁抑侥幸，为石亨等所忌
  lesson: 铁骨担社稷，两袖怀清风
  summary_first_person: 我于谦字廷益，钱唐人。土木之变后，我力排南迁之议，整军守京师，拥立景帝社稷得全；然夺门之变中以迎立外藩之诬屈死东市，家无余赀，唯上赐之物而已。
  source_urls:
  - 名卿绩纪·王世贞（明）
