- id: guji-yunruo-endeavor-1
  title_zh: 天台教观研习与弘阐
  title_en: Study and Propagation of Tiantai Doctrine
  description_zh: 自云门出家后历谒大山恢与湛堂澄，精究四教仪、金錍、十不二门及止观诸部，辨思清兼业、昭圆异说、齐润党邪、仁岳背正之非，嗣法湛堂，列钱塘四依，为一时讲席领袖
  phases:
