person:
  qid: guji-yunruo
  name_zh: 允若
  names:
    zh: 允若
    en: Yunruo
  lifespan:
    birth:
      date: '1280'
      precision: year
      is_circa: true
      raw: 约元世祖至元十七年，相里人，九岁通春秋
    death:
      date: '1359-02-29'
      precision: day
      is_circa: false
      raw: 元至正十九年二月二十九日遇贼被害
  birth_date: '1280'
  death_date: '1359-02-29'
  era: 元
  reign_ref: 元仁宗至顺帝至正
  archetype: 解义高僧·天台宗匠
  dilemmas:
  - 兼通儒典与专志出世之间的身份抉择
  - 盛世弘法与乱世守寺不去之间的节义抉择
  - 辨析异说与持正不党之间的宗脉抉择
  lesson: 穷研教观以明宗极，守道不迁以全节义，学足以辩邪正，行足以厉顽懦
  summary_first_person: 吾少习春秋而慕出世，十五祝发于云门，遍历杭越师事大山恢公与湛堂澄公，尽究止观不二门之旨，察思清昭圆诸家是非。后奉命住昌源净圣兴复颓刹，又主兴化上竺，泉以锡祷而再来，道与钱塘四依并峙。晚归云门修法华三昧，值海内大乱，贼至而众欲拥去，吾独危坐不屈，遂以身殉法，冀后学知法门之重逾于生死。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E6%98%8E%E9%AB%98%E5%83%A7%E4%BC%A0.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E6%98%8E%E9%AB%98%E5%83%A7%E4%BC%A0.html
