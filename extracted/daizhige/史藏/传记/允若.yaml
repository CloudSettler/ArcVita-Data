  - key: climax
    name: 祷泉再来
    labels:
      zh: 高峰
    start_date: '1345'
    highlight_event_id: guji-yunruo-event-spring
  - key: closure
    name: 危坐殉法
    labels:
      zh: 收束
    start_date: '1358'
    highlight_event_id: guji-yunruo-event-death
  decisions:
  - date: '1324'
    title_zh: 领昌源净圣辟芜葺室
    rationale: 院颇颓弊，田芜室圮，力为经度三年成巨刹，以安学者
  - date: '1345'
    title_zh: 持锡祷岩祈缨终泉涌
    rationale: 验缘在是否，言讫泉涌，人号再来泉，以显愿力感通
  - date: '1359-02-28'
    title_zh: 贼至不避危坐待酬
    rationale: 众欲拥避，斥难可茍免，吾对将至待以酬之，示僧节不可屈
events:
- id: guji-yunruo-event-birth
  title_zh: 生于相里
  date: '1280'
  year_of: '1280'
  description_zh: 相里人，号浮休又号若耶，九岁能通春秋大义，稍长翛然有绝尘之趣
- id: guji-yunruo-event-ordination
  title_zh: 依云门元和尚祝发
  date: '1295'
  year_of: '1295'
  description_zh: 十五岁祝发为大僧，随渡涛江首谒杭之兴福大山恢法师，授四教仪金錍十不二门等一见知大旨
- id: guji-yunruo-event-teaching
  title_zh: 依湛堂澄公精究教观
  date: '1315'
  year_of: '1315'
  description_zh: 往依南竺湛堂澄公，究法智阴观别理随缘六即等文，辨思清昭圆齐润仁岳是非，甚为湛堂器重俾司宾客
- id: guji-yunruo-event-changyuan
  title_zh: 出住昌源净圣院中兴
  date: '1324'
  year_of: '1324'
  description_zh: 元至治初湛堂奉诏入燕奏举其行业锡慈光圆照号，命出住昌源，辟芜田葺圮室三年成巨刹
- id: guji-yunruo-event-four-masters
  title_zh: 与天岸我庵等并称钱塘四依
  date: '1332'
  year_of: '1332'
  description_zh: 泰定中复主杭之兴化，与天岸济我庵无玉庭罕道望并峙湖上，世称钱塘四依
- id: guji-yunruo-event-abbot
  title_zh: 历主圆通上天竺
  date: '1340'
  year_of: '1340'
  description_zh: 退居云门后又与断江恩等称云门三高，至正中住越之圆通迁上天竺弘法
- id: guji-yunruo-event-spring
  title_zh: 祷得再来泉
  date: '1345'
  year_of: '1345'
  description_zh: 上竺旧有缨终泉涸，持锡叩岩祷云茍吾缘在是泉当为我一来，言讫泉涌，尚书贡师泰命曰再来泉比慈云重荣桧
- id: guji-yunruo-event-death
  title_zh: 云门殉道白乳溢地
  date: '1359-02-29'
  year_of: '1359'
  description_zh: 退隐云门修法华三昧，会天下大乱贼入其舍独危坐不屈辞色俱厉，为贼挥刃所害白乳溢出，世寿八十僧腊六十有五，荼毗舍利如菽无算，赵孟俯称僧中御史
