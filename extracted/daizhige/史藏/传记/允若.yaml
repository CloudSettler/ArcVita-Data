  decisions:
  - date: '1295'
    title_zh: 舍儒从释谒大山恢习天台
    rationale: 以春秋世法为泡聚，遂挟册渡江求出世法，欲得教观正脉
  - date: '1310'
    title_zh: 往依湛堂澄公精研不二门
    rationale: 凡法智阴观别理随缘六即等文靡不精究，以察诸家是非而得正解
  - date: '1324'
    title_zh: 受锡慈光圆照出住昌源
    rationale: 湛堂奉诏入燕校藏奏举其行业，遂领徒中兴颓弊以试其学
- id: guji-yunruo-endeavor-2
  title_zh: 住持兴复与乱世殉节
  title_en: Abbotship, Temple Restoration and Martyrdom
  description_zh: 历主持昌源净圣、杭之兴化、越之圆通及上天竺，以锡祷得再来泉，晚退隐云门筑室修法华三昧，至正末年干戈纷扰中坚坐不去，以身殉道
  phases:
  - key: brewing
