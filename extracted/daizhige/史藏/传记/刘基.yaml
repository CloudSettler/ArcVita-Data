      - 谓惟庸小犊偾辕破犁
      - 自陈疾恶太甚不耐繁剧
    start_date: '1370'
    highlight_event_id: guji-刘基-event-lunxiang
  - key: climax
    name: 遭构饮药
    labels:
      zh:
      - 淡洋设巡司为惟庸所诬
      - 入朝不敢归
      - 惟庸挟医进药
      - 胸中积如卷石
    start_date: '1375'
    highlight_event_id: guji-刘基-event-yinyao
  - key: closure
    name: 驰驿归里，身后昭雪
    labels:
      zh:
      - 敕归一月而卒
      - 遗命焚尸扬灰
      - 追封太师谥文忠
    start_date: '1375'
    highlight_event_id: guji-刘基-event-death
  decisions:
  - date: '1368'
    title_zh: 奏按李彬当死，即日斩之
    rationale: 中书省都事李彬侮法，善长为解不听，执法以肃朝纲
  - date: '1370'
    title_zh: 论相皆言不可，自辞相位
    rationale: 宪有相才无相器必败；广洋褊浅；惟庸小犊将偾辕破犁；且自陈疾恶太甚、不耐繁剧，恐孤大恩
  - date: '1371'
    title_zh: 求放归田里
    rationale: 善长以他事诉于上，知为权臣所忌，陛辞犹言凤阳非置都地、王保保未易下，后验
  - date: '1375'
    title_zh: 饮惟庸所进药
    rationale: 淡洋事为惟庸旧怨构奏，入朝不敢归，丞相挟医视疾，饮药觉胸中积如卷石，白于上而弗省
