  decisions:
  - date: '1358'
    title_zh: 即日弃官，隐青田山中
    rationale: 讨方国珍之策见沮，前后功以国珍故不录，反左授总管府判，知时事不可为，遂归隐着郁离子
  - date: '1360'
    title_zh: 慨然散众，束身应聘金陵
    rationale: 忆西湖所望王气应在金陵，太祖走使来聘，此其人也，遂上时务十八策以效忠
  - date: '1363'
    title_zh: 力主先取陈氏（楚）
    rationale: 士诚守土虏耳；楚据上流窃名号，乃心无日忘我，宜先，遂定先汉后吴之计
  - date: '1368'
    title_zh: 奏立军卫法
    rationale: 开国当务，立军卫法以饬兵制，进拜御史中丞
- id: guji-刘基-endeavor-2
