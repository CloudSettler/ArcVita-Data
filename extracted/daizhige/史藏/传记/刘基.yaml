person:
  qid: guji-刘基
  name_zh: 刘基
  names:
    zh: 刘基（字伯温，封诚意伯，谥文忠）
    en: Liu Ji (Liu Bowen)
  lifespan:
    birth:
      date: '1311'
      precision: year
      is_circa: true
      raw: 传文未载生年，据「卒年六十五」逆推，约生于元皇庆年间
    death:
      date: '1375'
      precision: year
      is_circa: false
      raw: 洪武八年三月敕驰驿归，归一月卒，年六十五
  birth_date: '1311'
  death_date: '1375'
  era: 元末明初
  reign_ref: 元至正；明洪武
  archetype: 开国谋臣
  dilemmas:
  - 仕元与去就——讨方国珍主剿之策不行，反遭羁管、前功不录，愤而弃官隐青田
  - 择主之大节——太祖遣使来聘，慨然散其部众，束身以从
  - 直道与自全——即日斩李彬、力言杨宪胡惟庸不可相，为权相所衔
  - 功高与祸福——进封诚意伯而赐老，犹以淡洋设司被诬，饮药疾笃而卒
  lesson: 诚与才合，谋以忠运，斯为骏猷、不愧国器；然疾恶太甚、不耐繁剧，筹策纵横而出处大节终不得全，可为辅臣处进退者之鉴
  summary_first_person: 吾刘基，字伯温，处州青田人。元末举进士，宰高安以廉节着，屡忤上官，终弃官隐青田山中，着郁离子。太祖定金陵走使来聘，吾散众以从，上时务十八策，朝夕侍帷幄——谏主战伏兵大破陈友谅，彭蠡大战手挽御舟以脱难，力主先汉后吴以定进取。洪武元年奏立军卫法，拜御史中丞，执法斩李彬，进封诚意伯，寻赐老归山。既为丞相胡惟庸所构，饮其药而疾笃，敕归一月而卒，遗命焚尸扬灰。后追封太师，谥文忠。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%90%8D%E5%8D%BF%E7%BB%A9%E7%BA%AA.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%90%8D%E5%8D%BF%E7%BB%A9%E7%BA%AA.md
