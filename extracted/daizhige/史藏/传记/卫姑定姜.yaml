person:
  qid: guji-卫姑定姜
  name_zh: 卫姑定姜
  names:
    zh: 卫姑定姜、定姜
    en: Ding Jiang, Duchess Consort of Duke Ding of Wey
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 春秋时期
    death:
      precision: unknown
      is_circa: true
  birth_date: ''
  death_date: ''
  era: 春秋时期
  reign_ref: 卫定公夫人
  archetype: 慈姑与贤内助
  dilemmas:
  - 虽厌恶孙林父，但为免亡国而劝定公忍恶召回宗卿之后
  - 献公暴虐慢侮于己，仍以三条罪状教其只告亡而不告无罪
  - 欲立贤公子鱄为君而不能得，叹卫将败
  lesson: 恩爱慈惠而聪明远识，能以文辞和谏言消弭祸患
  summary_first_person: 我是卫定公夫人定姜。儿媳丧夫三年孝满归家，我送她至野，赋《燕燕》之诗挥泣而望。孙林父奔晋，我劝定公忍恶许其归国以安民免患。献公不哀不孝而暴虐，我数其三罪，教他告亡勿告无罪。郑师侵卫，我释兆断其可追，卒获皇耳。君子谓我慈厚而达于事情，能以辞教。
  source_urls:
  - lienuzhuanyi/卷一之七-卫姑定姜
endeavors:
- id: guji-卫姑定姜-endeavor-1
  name_zh: 送妇赋诗，尽显慈姑之厚
  phases:
  - key: breakthrough
    name_zh: 归妇送野
    labels:
      zh:
      - 慈姑
      - 诗教
    highlight_event_id: guji-卫姑定姜-event-return bride
  decisions:
  - title_zh: 亲自送归无子之妇至野
    rationale: 儿媳丧夫守丧三年，虽无子，定姜感其恩爱哀思，自送至野而赋《燕燕》之诗
- id: guji-卫姑定姜-endeavor-2
  name_zh: 谏诤卫国，远虑消患
  phases:
  - key: brewing
    name_zh: 劝复孙林父
    labels:
      zh:
      - 远患
      - 安民
    highlight_event_id: guji-卫姑定姜-event-recall
  - key: climax
    name_zh: 数献公之罪、释兆御寇
    labels:
      zh:
      - 以辞教
      - 达于事情
    highlight_event_id: guji-卫姑定姜-event-three crimes
  decisions:
  - title_zh: 劝定公召回孙林父
    rationale: 是先君宗卿之嗣，大国以为请，不许将亡；忍恶愈于亡国
  - title_zh: 教献公告亡勿告无罪
    rationale: 神不可诬，有罪告无罪则欺天；数其舍大臣谋小臣、蔑冢卿、暴妾三罪
  - title_zh: 释兆进言追击郑师
    rationale: 征者丧雄，正是御寇之利，劝大夫图之，遂获皇耳于犬丘
events:
- id: guji-卫姑定姜-event-birth
  title_zh: 定姜出生
  type: birth
  place_zh: 齐（姜姓之女）
  summary_zh: 卫姑定姜约生于春秋时期，姜姓，后为卫定公夫人。
- id: guji-卫姑定姜-event-return bride
  title_zh: 送归妇至野并赋《燕燕》
  type: endeavor
  place_zh: 卫国
  summary_zh: 公子死，其妇无子，毕三年之丧，定姜归其妇，自送至于野，挥泣垂涕，赋'燕燕于飞'之诗。
- id: guji-卫姑定姜-event-recall
  title_zh: 谏定公召回孙林父
  type: endeavor
  place_zh: 卫国
  summary_zh: 孙林父奔晋，晋侯使郄犨为请还，定姜劝定公忍恶许之，以免亡国，定公遂复之。
- id: guji-卫姑定姜-event-duke ding death
  title_zh: 卫定公卒，献公立
  type: milestone
  place_zh: 卫国
  summary_zh: 定公卒，立敬姒之子衎为君，是为献公；献公居丧而慢，定姜叹其将败卫。
- id: guji-卫姑定姜-event-three crimes
  title_zh: 数献公三罪，教其告亡勿告无罪
  type: endeavor
  place_zh: 卫国边境
  summary_zh: 献公被逐出亡至境，欲告无罪于庙，定姜数其三罪，谓神不可诬，只可告亡；后赖鱄力献公得返国。
- id: guji-卫姑定姜-event-pursuit
  title_zh: 释兆助卫追获皇耳
  type: endeavor
  place_zh: 卫国犬丘
  summary_zh: 郑皇耳侵卫，孙文子卜追之献兆于定姜，定姜释兆为御寇之利，卫人追之，获皇耳于犬丘。
- id: guji-卫姑定姜-event-death
  title_zh: 定姜去世
  type: death
  place_zh: 卫国
  summary_zh: 定姜卒年不可考，颂曰其聪明远识，丽于文辞。
