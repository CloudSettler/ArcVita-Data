  - date: '1644-06-15'
    title_zh: 力主调和四镇不拥兵自重
    rationale: 以国家为重不以私兵自固欲合诸将协力北伐虽知骄将难制仍竭诚抚驭
  - date: '1644-09-10'
    title_zh: 上疏定策立君规正伦序
    rationale: 时艰当以大义安人心虽处嫌疑之地仍直言匡正以明臣节
