  dilemmas:
  - 四镇骄悍难制与朝廷孤弱并存何以合众御敌
  - 南北和议存亡之机与战守大义何以抉择
  - 援绝城危之际偷生图存与舍生取义何以自处
  lesson: 疾风劲草板荡忠贞支撑残局终以一死明臣节
  summary_first_person: 余史可法字宪之号道邻河南祥符人也中崇祯进士历南京兵部尚书督师江北节制四镇值国家板荡之际以孤忠支撑残局知扬州必不可守而守之城破之日誓不屈节以身殉国得遂初心而已
