person:
  qid: guji-韩琦
  name_zh: 韩琦
  names:
    zh: 韩琦
    en: Han Qi
  lifespan:
    birth:
      date: '1008'
      precision: year
      is_circa: true
      raw: 生于北宋，天圣五年（1027）甫冠擢进士甲科，倒推约生于1008年
    death:
      date: '1075'
      precision: year
      is_circa: false
  birth_date: '1008'
  death_date: '1075'
  era: 北宋
  reign_ref: 宋仁宗、宋英宗、宋神宗
  archetype: 定策元勋·出将入相的社稷之臣
  dilemmas:
  - 边帅议攻守：力主攻策而朝廷不用，后仍受命周旋西事
  - 定策立嗣：仁宗无嗣，冒危机首请立宗室子，荣辱难料
  - 陕西籍义勇：违众议强行点籍，以一身任数万民兵之事
  - 永洛城之争：主张城可废而罪不可贷，与同僚郑戬意见相左
  lesson: 功高不矜、位大不骄，临大事、决大疑而气色不动
  summary_first_person: 我韩琦出自相州韩氏，弱冠登第，历谏职、帅陕右，久在西边御夏。仁宗末年，我首倡立嗣，与同僚定策立英宗；英宗疾平，又奉先帝顾命立神宗，故我死后得号两朝顾命定策元勋。官至首相，进人多而不私亲旧，身殁之日星陨于厩，天子亲作碑文旌我。
  source_urls:
  - https://zh.wikipedia.org/wiki/韩琦
