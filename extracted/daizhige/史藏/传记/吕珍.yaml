      raw: 卒年不详·至正二十六年（1366）湖州之败降徐达后事迹无载
  birth_date: 约1300
  death_date: 约1367
  era: 元末
  reign_ref: 元顺帝妥懽帖睦尔·至正（1341–1368）
  archetype: 守城统帅·骁勇抚民
  dilemmas:
  - title_zh: 持重与身先
    tension_zh: 耆老泣请一城之命悬于公愿无轻出·而大军初至其势方锐·不挫其锋则无人肯出力
    resolution_zh: 连日出战身先士卒以示无复忧畏·同时诫诸将勿躁进·以逸待劳与之持久
  - title_zh: 杀俘与纵释
    tension_zh: 连日获至俘囚·尽戮则失仁·尽释则纵恶
    resolution_zh: 鞫问果杀人者方加戮·余胁从并释不问仍给衣食·后擒获多不杀纵还·再犯亦释
  - title_zh: 民心与敌谍
    tension_zh: 大军扬言城中民约举火为内应·夜半民有火炬·上下益相疑惧
    resolution_zh: 吾不负民民岂负我·改鼓点察市巷·民皆安寝如常·间不得入
  - title_zh: 旧主与晚节
    tension_zh: 至正二十六年湖州之败·吴势已去·抗则城破民罹兵祸
    resolution_zh: 乃降于徐达·虽初事非主晚节不终·而守绍兴之功乡人记之
  lesson: 以寡御众·以逸待劳·民为城之本——身可保孤城·节难全乱世
  summary_first_person: 我吕珍以至正十八年冬以浙江等处行枢密院副使来镇绍兴·先增濠筑月城·迁民清野·次年春胡大海大军三路压城·我以寡御众·以逸待劳·跃马陷阵·攩杈擒其舍命大王·亲督各门分守·每胜即赏·止禁钟以安民·释胁从以结心·护耕种以足食·筑堰断敌·凡三月大小数十战·城卒不拔·绍兴由是保守八年·惜乎至正二十六年湖州兵败·大势既去·我降于徐达·晚节不终·然守越之功·载在保越录
  source_urls:
