    labels:
      zh: 僭帝改元
    start_date: '1673-12-28'
    highlight_event_id: guji-吴三桂-event-fanluan
  - key: closure
    name: 湖南僵持老死衡州
    labels:
      zh: 败亡粉骨
    start_date: '1678-03-01'
    highlight_event_id: guji-吴三桂-event-chengdi
  decisions:
  - date: '1660-06-01'
    title_zh: 创西选以藩府批授天下官
    rationale: 以龙凤批广植私党使督抚皆畏藩府，财马商税皆入幕府为异日举事之资
  - date: '1673-11-15'
    title_zh: 诈病卧榻激怒诸将杀抚臣举事
    rationale: 欲反而恐众不从，故以使者凌辱激变，使军士自执抚臣以祭旗，遂成骑虎之势
  - date: '1678-03-17'
    title_zh: 衡山告天即皇帝位改元利用
    rationale: 久据湖南不得渡江，欲以正名号召天下，然僭制先施反致耿尚郑氏解体离心
events:
- id: guji-吴三桂-event-birth
  title_zh: 生于辽东将门
  date: '1612-06-08'
  year_of: '1612'
  precision: day
  is_circa: false
  raw: 明万历四十年五月初八
  place_zh: 辽东高邮籍
  description_zh: 提督京营吴襄子，幼试武举出华亭董其昌门下，以父荫得官累至大总戎
- id: guji-吴三桂-event-songshan
  title_zh: 松山会战夜遁获镌秩
  date: '1641-09-01'
  year_of: '1641'
  precision: month
  is_circa: true
  raw: 崇祯十四年
  place_zh: 松山
  description_zh: 蓟辽总督洪承畴会八镇兵于宁远战于松山，杨国柱败没，三桂与王朴等夜遁仅镌秩，旋镇宁远为北门锁钥
- id: guji-吴三桂-event-qingshi
  title_zh: 山海关薙发乞师定盟
  date: '1644-04-22'
  year_of: '1644'
  precision: day
  is_circa: false
  raw: 崇祯十七年三月二十二日
  place_zh: 山海关外清九王大营
  description_zh: 得父书欲降闯而闻爱妾陈沅被夺大愤，袭杀闯守关兵后潜诣清营，经洪承畴祖大寿引见摄政九王薙发称臣，约合师讨贼
- id: guji-吴三桂-event-zhuiji
  title_zh: 一片石大败李自成
  date: '1644-04-28'
  year_of: '1644'
  precision: day
  is_circa: false
  raw: 崇祯十七年四月二十八日
  place_zh: 山海关一片石
  description_zh: 为清前锋与闯战，九王铁骑绕右急击，刘宗敏重伤闯军大败走永平，三桂追至京师城下屡设伏夺太子不得，自成斩吴襄焚宫西遁
- id: guji-吴三桂-event-miechuangs
  title_zh: 西征灭闯追至罗公山
  date: '1645-03-01'
  year_of: '1645'
  precision: month
  is_circa: true
  raw: 顺治二年春
  place_zh: 西安武关荆襄
  description_zh: 统大兵入山西败自成于平阳，复西伐三秦合数十万战破之，自成出武关走荆襄死于罗公山，闯贼遂灭以功晋平西亲王
- id: guji-吴三桂-event-pingdian
  title_zh: 三路入滇擒永历
  date: '1661-12-01'
  year_of: '1661'
  precision: month
  is_circa: true
  raw: 顺治十五年至十八年
  place_zh: 云南昆明阿瓦
  description_zh: 与洪承畴赵布太分三路入滇，永历走永昌遁入缅甸呵瓦，辛丑冬檄取缢于贵阳，遂总统全师镇守云南留子尚主为质
- id: guji-吴三桂-event-xixuan
  title_zh: 经营藩镇西选遍天下
  date: '1668-01-01'
  year_of: '1668'
  precision: year
  is_circa: true
  raw: 康熙初年
  place_zh: 云南五华山
  description_zh: 设西选以藩府咨部授官几满天下，选西马岁三千、禁私参设官榷鬻、授黄石武侯阵法于将校，兵财甲盛伪为恭敬人心翕附
- id: guji-吴三桂-event-fanluan
  title_zh: 诈病杀抚臣举兵反清
  date: '1673-12-28'
  year_of: '1673'
  precision: day
  is_circa: false
  raw: 康熙十二年十一月二十一日
  place_zh: 云南昆明
  description_zh: 诏移藩关东，三桂大会诸将祭明陵易汉服，郊阅示武，称疾诱使者凌辱致诸将裹甲杀贵州抚臣囚使者祭旗，传檄四方前队在荆楚皆反，贵州李本深陕西王辅臣王屏藩响应
- id: guji-吴三桂-event-chengdi
  title_zh: 衡山僭号大周改元利用
  date: '1678-03-17'
  year_of: '1678'
  precision: day
  is_circa: false
  raw: 康熙十七年三月
  place_zh: 湖南衡山
  description_zh: 至湖南改常德为行宫筑坛衡山下告天即皇帝位建国大周改元利用，受贺时大风卷席骤雨如注，旋以婿胡国柱等攻湖南广西广东并招耿精忠郑经，天下旋解体
- id: guji-吴三桂-event-death
  title_zh: 忧愤病死衡州军中
  date: '1678-10-02'
  year_of: '1678'
  precision: day
  is_circa: false
  raw: 康熙十七年八月十九日
  place_zh: 湖南衡州
  description_zh: 王师四集复湖南，秦蜀失守胡国柱谋归顺闻而气噎仆地遽绝，年七十有五，孙世璠嗣立于成都筑园寝后为王师发冢粉骨，构逆凡五年而败
