  birth_date: '1612-06-08'
  death_date: '1678-10-02'
  era: 明末清初
  reign_ref: 崇祯至康熙
  archetype: 权藩枭雄
  dilemmas:
  - 君父并陷时忠孝难两全当降贼尽孝还是借兵尽忠
  - 既得滇蜀重镇当效忠新朝以功名善终还是拥兵割据以谋不轨
  - 撤藩诏下当奉诏内徙保家族富贵还是举兵抗命搏天下
  lesson: 始以复仇借兵终以拥兵自重，借外力者终为外力所制，割据图王终致众叛亲离而粉骨
  summary_first_person: 余辽东将门子，少举武科冠诸军，守宁远为北门锁钥。甲申国变父执妾夺，进退无据乃薙发乞师九王，借清兵破闯贼复京师，自谓报君父仇。既而平蜀定滇坐镇云贵，广西选、蓄马士、开矿榷参，渐怀异志。及朝廷议撤藩，徘徊再三终以祭陵易服鼓众而反，僭号衡山建曰大周，然天命已去将士离心，五载而败卒死衡州，遗骸竟至发冢扬灰，可不戒哉。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%90%B4%E8%80%BF%E5%B0%9A%E5%AD%94%E5%9B%9B%E7%8E%8B%E5%85%A8%E4%BC%A0.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%90%B4%E8%80%BF%E5%B0%9A%E5%AD%94%E5%9B%9B%E7%8E%8B%E5%85%A8%E4%BC%A0.html
  - https://ctext.org/library.pl?if=gb&file=wb436882
