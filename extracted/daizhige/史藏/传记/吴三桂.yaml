  decisions:
  - date: '1644-04-22'
    title_zh: 获父书及妾夺后决计乞师清营
    rationale: 既知父命难违又愤闯夺妾，度单力难敌闯众，借清十万铁骑可复仇全军并保关门实力
  - date: '1644-04-30'
    title_zh: 京师火起分兵追贼不救宫阙
    rationale: 料自成必弃京西走，夺其辎重财帛可犒三军，示摄政王以追贼效忠姿态
- id: guji-吴三桂-endeavor-2
  title_zh: 镇滇擅藩与举兵僭周
  goal_zh: 经营云南为根基图割据，撤藩之际据滇蜀窥中原
  phases:
  - key: brewing
