person:
  qid: guji-wuqi
  name_zh: 吴起
  names:
    zh: 吴起
    en: Wu Qi
  lifespan:
    birth:
      date: 约-440
      precision: decade
      is_circa: true
      raw: 约前440年
    death:
      date: -381
      precision: year
      is_circa: false
      raw: 前381年
  birth_date: 约-440
  death_date: -381
  era: 战国
  reign_ref: 魏文侯、魏武侯、楚悼王
  archetype: 变法名将
  dilemmas:
  - 功名与孝义：母死不归，啮臂之盟在先，为曾子所绝
  - 功名与伦常：齐人攻鲁，杀妻以明不与齐而求为将
  - 信任与猜忌：鲁君疑之、魏武侯疑之，惧罪去魏奔楚
  - 变法与宗室：废公族疏远者以抚养战斗之士，招楚贵戚之怨
  lesson: 在德不在险：山河之固不足恃，国以德兴，兵以德附；善用兵而不知修德者，虽强必败，舟中之人尽为敌国。
  summary_first_person: 我叫吴起，卫国人，好用兵。我杀谤己者三十余人，与母啮臂盟誓出卫求仕；事曾子，母死不归，被绝而转学兵法。齐人攻鲁，我杀妻明志求为将，大破齐军；鲁君疑我，我遂奔魏，为将击秦拔五城，任西河守，与士卒同衣食、为病卒吮疽，秦兵不敢东向。武侯泛舟中流，我直言在德不在险。后遭谗惧罪去魏，楚悼王相我，我明法审令、废公族疏远者以抚养战斗之士，南平百越、北并陈蔡、却三晋、西伐秦，诸侯患楚之强；悼王一薨，宗室大臣作乱，我死于乱箭。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8D%81%E4%B8%83%E5%8F%B2%E7%99%BE%E5%B0%86%E4%BC%A0.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8D%81%E4%B8%83%E5%8F%B2%E7%99%BE%E5%B0%86%E4%BC%A0.html
  - https://ctext.org/wiki.pl?if=gb&ctp=wb193716
endeavors:
- id: guji-wuqi-endeavor-1
  person_id: guji-wuqi
  name_zh: 事鲁破齐
  description: 吴起去卫游仕，事曾子被绝后转学兵法，以鲁将大破齐军而崭露头角。
  phases:
  - key: brewing
    name: 破家游仕
    labels:
      zh: 啮臂盟誓·东出卫郭门
    start_date: 约-430
    highlight_event_id: guji-wuqi-event-oath
  - key: breakthrough
    name: 弃儒学兵
    labels:
      zh: 事曾子·母死不归
    start_date: 约-425
    highlight_event_id: guji-wuqi-event-zengzi
  - key: climax
    name: 为鲁将破齐
    labels:
      zh: 杀妻求将·大破齐军
    start_date: -412
    highlight_event_id: guji-wuqi-event-lu-defeats-qi
  - key: closure
    name: 鲁君谢遣
    labels:
      zh: 谗言疑起
    start_date: 约-410
    highlight_event_id: guji-wuqi-event-lu-dismissal
  decisions:
  - date: 约-425
    title_zh: 母死不归，弃儒学兵
    rationale: 与母啮臂而盟，起不为卿相不复入卫；功名未就遂不奔丧，为曾子所绝，乃之鲁学兵法。
  - date: -412
    title_zh: 杀妻以明不与齐
    rationale: 齐人攻鲁，鲁疑起妻为齐女；起欲就名，遂杀妻自明，鲁卒以为将，将而攻齐大破之。
- id: guji-wuqi-endeavor-2
  person_id: guji-wuqi
  name_zh: 仕魏守西河
  description: 吴起闻魏文侯贤而奔魏，为将击秦拔五城，任西河守拒秦韩，与士卒同苦而秦兵不敢东向。
  phases:
  - key: brewing
    name: 奔魏投贤
    labels:
      zh: 文侯问李克
    start_date: 约-410
    highlight_event_id: guji-wuqi-event-to-wei
  - key: breakthrough
    name: 为将击秦
    labels:
      zh: 拔五城
    start_date: -409
    highlight_event_id: guji-wuqi-event-wei-qin-cities
  - key: climax
    name: 守西河励士
    labels:
      zh: 吮疽同苦·在德不在险
    start_date: 约-408
    highlight_event_id: guji-wuqi-event-xihe
  - key: closure
    name: 遭谗去魏
    labels:
      zh: 公叔设谋·武侯疑之
    start_date: 约-390
    highlight_event_id: guji-wuqi-event-leave-wei
  decisions:
  - date: 约-410
    title_zh: 去鲁奔魏
    rationale: 鲁君疑之而谢吴起；起闻魏文侯贤，欲事之，遂西入魏。
  - date: 约-395
    title_zh: 直言在德不在险
    rationale: 武侯浮西河叹山河之固为魏国之宝；起举三苗、夏桀、商纣之亡以对，谓若君不修德，舟中之人尽为敌国。
- id: guji-wuqi-endeavor-3
  person_id: guji-wuqi
  name_zh: 相楚变法
  description: 吴起入楚为悼王相，明法审令、捐不急之官、废公族疏远者以强兵，南平百越、北却三晋、西伐秦，终死于楚贵戚之乱。
  phases:
  - key: brewing
    name: 入楚为相
    labels:
      zh: 悼王素闻其贤
    start_date: 约-390
    highlight_event_id: guji-wuqi-event-join-chu
  - key: breakthrough
    name: 明法审令
    labels:
      zh: 废公族疏远者
    start_date: 约-386
    highlight_event_id: guji-wuqi-event-chu-reform
  - key: climax
    name: 拓地强楚
    labels:
      zh: 南平百越·西伐秦
    start_date: 约-384
    highlight_event_id: guji-wuqi-event-chu-expansion
  - key: closure
    name: 死于宗室之乱
    labels:
      zh: 贵戚作乱
    start_date: -381
    highlight_event_id: guji-wuqi-event-death
  decisions:
  - date: 约-386
    title_zh: 明法审令以强兵
    rationale: 捐不急之官，废公族疏远者，以抚养战斗之士，要在强兵，破驰说之言纵横者。
  - date: 约-383
    title_zh: 不避贵戚之怨，力行变法
    rationale: 楚之贵戚尽欲害吴起，起知其怨而不改弦，以强楚为先。
