  summary_zh: 尝作《太极图》《易说》《易通》数十篇，为宋世道学宗派立言之始。
  related_endeavor: guji-周敦颐-endeavor-2
- id: guji-周敦颐-event-wanganshi-dialogue
  type: scholarly
  date: 约1058
  precision: year
