  title_zh: 南安司理力争王逵，委告身而去
  summary_zh: 南安狱有囚法不当死，转运使王逵欲深治之；先生独力争，不听则置手板归取告身委之而去，囚得不死，逵亦感悟。
  quote_zh: 如此尚可仕乎？杀人以媚人，吾不为也。
  related_endeavor: guji-周敦颐-endeavor-1
- id: guji-周敦颐-event-ercheng-study
  type: scholarly
  date: 约1046
  precision: year
  is_circa: true
  year_of: 1046
  title_zh: 程珦使二子往受学
  summary_zh: 程珦摄南安通守事，视其气貌非常，与为友，使二子往受学；每令寻仲尼颜子乐处，所乐何事。二程后为河南二先生，再见茂叔后吟风弄月以归。
  related_endeavor: guji-周敦颐-endeavor-2
- id: guji-周敦颐-event-liping-teaching
  type: scholarly
  date: 约1049
  precision: year
  is_circa: true
  year_of: 1049
  title_zh: 郴州为郡守李初平说《易》
  summary_zh: 郡守李初平欲读书，曰“公老无及矣，某也请得为公言之”；初平日听语二年果有得。卒而子幼，护其丧归葬并经纪其家，始终不懈。
  related_endeavor: guji-周敦颐-endeavor-2
- id: guji-周敦颐-event-taiji-writings
