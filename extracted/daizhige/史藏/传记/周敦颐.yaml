    title_zh: 抗上不枉法，委告身而去
    rationale_zh: “杀人以媚人，吾不为也”；宁弃官职，不徇上意。
  - date: 约1049
    title_zh: 郡守李初平卒，护丧归葬并经纪其家
    rationale_zh: 子幼无依，始终不懈，不以生死改其义。
  - date: 约1063
    title_zh: 权邵州时迁建新学以教其人
    rationale_zh: 为政以兴学为先，教化与刑名并举。
  - date: 约1071
    title_zh: 求南康军以归，上印绶分司南京
    rationale_zh: 病且水齧先墓，遂挂冠；赵抃复奏起用而朝命及门不复应。
