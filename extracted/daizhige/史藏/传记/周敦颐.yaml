  related_endeavor: guji-周敦颐-endeavor-1
- id: guji-周敦颐-event-lianxi-hermitage
  type: scholarly
  date: 约1071
  precision: year
  is_circa: true
  year_of: 1071
  title_zh: 自号濂溪，筑书堂于庐山之麓
  summary_zh: 庐山之麓有溪发源莲华峰下，洁清绀寒；濯缨而乐之，因寓濂溪之号而筑书堂于其上。黄庭坚称其人品甚高，胸中洒落如光风霁月。
  related_endeavor: guji-周敦颐-endeavor-2
- id: guji-周敦颐-event-death
  type: death
