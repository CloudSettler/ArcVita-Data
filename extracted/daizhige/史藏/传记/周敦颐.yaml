  year_of: 1070
  title_zh: 提点广南东路刑狱，荒崖绝岛必缓视徐按
  summary_zh: 熙宁初用赵抃、吕公著荐，为广南东路转运判官，改提点刑狱公事；不惮出入之勤、瘴毒之侵，务以洗冤泽物为己任。
  related_endeavor: guji-周敦颐-endeavor-1
- id: guji-周敦颐-event-retirement
  type: career
  date: 约1071
