  summary_zh: 王安石为江东提点刑狱时已号通儒；先生遇之，与语连日夜，荆公退而精思，至忘寝食。
  related_endeavor: guji-周敦颐-endeavor-2
- id: guji-周敦颐-event-shaozhou-school
  type: career
  date: 约1063
  precision: year
  is_circa: true
  year_of: 1063
  title_zh: 权邵州，新学校以教其人
  summary_zh: 权发遣邵州事，迁建学校以教其民；先在郴、桂阳皆有治绩。
  related_endeavor: guji-周敦颐-endeavor-1
- id: guji-周敦颐-event-lingnan-justice
