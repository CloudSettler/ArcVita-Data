  - date: 约1046
    title_zh: 受程珦所托，授二程之学
    rationale_zh: 每令寻仲尼颜子乐处，所乐何事；遂开洛学渊源。
  - date: 约1049
    title_zh: 为郡守李初平说《易》
    rationale_zh: “公老无及矣，某也请得为公言之”；不以位之上下而辞。
  - date: 约1058
    title_zh: 与王安石连日夜论学
    rationale_zh: 遇之无所芥蒂；荆公退而精思，至忘寝食。
  - date: 约1071
    title_zh: 寓濂溪之号，筑书堂于庐山之麓
    rationale_zh: 溪发源莲华峰下，洁清绀寒；濯缨而乐之，志乡关在目中。
