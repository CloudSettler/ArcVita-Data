person:
  qid: guji-周敦颐
  name_zh: 周敦颐
  names:
    zh: 周敦颐
    en: Zhou Dunyi
  lifespan:
    birth:
      date: 约1017
      precision: year
      is_circa: true
      raw: 宋真宗天禧元年（文中未载生辰，据卒年享年五十七逆推）
    death:
      date: '1073-07-14'
      precision: day
      is_circa: true
      raw: 宋神宗熙宁六年六月七日
  birth_date: 约1017
  death_date: '1073-07-14'
  era: 北宋
  reign_ref: 历真宗天禧、仁宗朝至神宗熙宁间（熙宁六年卒）
  archetype: 理学开山之儒而兼严明循吏
  dilemmas:
  - situation_zh: 南安狱有囚法不当死，转运使王逵苛刻欲深治之，吏无敢与相可否
    choice_zh: 独力争之，不听则置手板、归取告身委之而去
    rationale_zh: “如此尚可仕乎？杀人以媚人，吾不为也。”
  - situation_zh: 使岭表则出入之勤、瘴毒之侵，荒崖绝岛人迹所不至
    choice_zh: 不惮勤瘴，必缓视徐按
    rationale_zh: 务以洗冤泽物为己任
  - situation_zh: 病亟且水齧其先墓，而赵抃再奏起用，朝命及门
    choice_zh: 上印绶分司南京，不复出仕
    rationale_zh: 襟怀旷然，妻子粥或不给亦不以为意
  lesson: “杀人以媚人，吾不为也”——以名节自砥砺，洗冤泽物为己任；位可弃，法与道不可屈。
  summary_first_person: 吾本名惇实，后避英宗旧讳改惇颐，字茂叔，世家道州营道县濂溪之上。以舅氏龙图阁学士郑向奏授洪州分宁县主簿，历南安军司理参军、郴与桂阳令、大理寺丞、知南昌县、签书合州判官、通判虔州、权发遣邵州，熙宁初用赵抃、吕公著荐为广南东路转运判官，改提点刑狱。尝于分宁一讯决久狱；于南安抗王逵而委告身去，囚得不死。程珦使二子从吾受学，每令寻仲尼颜子乐处。郡守李初平听吾言二年果有得。晚年病归，上印绶分司南京，寓濂溪之号，筑书堂于庐山之麓，尝作太极图易说易通数十篇。熙宁六年六月七日卒，年五十七，葬江州德化县清泉社。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%BC%8A%E6%B4%9B%E6%B8%8A%E6%BA%90%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%BC%8A%E6%B4%9B%E6%B8%8A%E6%BA%90%E5%BD%95.md
  - https://ctext.org/library.pl?if=gb&res=wb833912
