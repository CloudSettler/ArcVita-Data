  birth_date: '1058'
  death_date: '1121'
  era: 北宋
  reign_ref: 仁宗嘉祐至徽宗政和
  archetype: 词乐宗匠
  dilemmas:
  - 疏隽少检与典重礼乐之衡：性落魄不羁而欲预大晟雅乐议礼
  - 州县簿书与长短句清蔚之衡：欲以弦歌为政而民讼浩穰
  - 京华显宦与羁旅行役之衡：久滞庐溧隆明而词心常系荆吴
  lesson: 以博学音律通古今之调，以赋学典雅济词体之柔，虽滞州县而能以清蔚立一朝词宗
  summary_first_person: 吾钱塘周邦彦字美成，嘉祐戊戌生，少疏隽博涉百家，妙解音律。元丰献汴都赋为太学正，历庐州教授、溧水令、秘书正字、校书郎、考功卫尉宗正少卿、议礼局检讨、大晟府制撰及隆德明州守。平生增演慢引、移宫换羽为三犯四犯，制词多应月律，自号清真居士。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/清真居士年谱.md
  - https://daizhige.org/史藏/传记/清真居士年谱.html
