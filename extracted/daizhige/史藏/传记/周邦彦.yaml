  title_zh: 大观元年兼议礼局检讨
  description: 以宗正少卿兼议礼局检讨，预修五礼新仪，欲以知龙图阁知河中府徽宗留使毕书
  year_of: '1107'
- id: guji-周邦彦-event-suzhou
  date: '1109'
  title_zh: 大观三年过吴饮蔡峦席作点绛唇
  description: 归自京师过姑苏太守蔡峦席上见营妓岳楚云妹作点绛唇辽鹤归来，绕佛阁浪飐春灯皆此行作
