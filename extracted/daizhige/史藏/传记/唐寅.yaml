      precision: day
      is_circa: false
      raw: 嘉靖二年十二月初二
  birth_date: '1470-03-06'
  death_date: '1524-01-07'
  era: 明
  reign_ref: 明·成化至嘉靖
  archetype: 风流才子
  dilemmas:
  - 才高恃放与礼法检束之冲突
  - 科场骤显与谤祸暗伏之抉择
  - 仕途摧折后隐逸卖文与济世立言之矛盾
  lesson: 恃才放浪易罹祸，守正自持方全名节，困而著述亦可托不朽
  summary_first_person: 吾吴县吴趋唐寅，字伯虎，少负俊才，博习骈骊，中弘治十一岁解元而名动南都，不意持帛谒座主遂陷科场之狱，身贯三木，功名摧折，归而休妻放浪， self 号江南第一风流才子，以诗画寄慨，欲效古人困而著书，托笔札以自见
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/吴郡二科志.md
endeavors:
- id: guji-唐寅-endeavor-1
  title_zh: 科举仕进
  description: 自诸生以俊才为曹凤梁储所赏，中弘治十一年应天解元，后因会试谒程敏政被诬泄题下诏狱，罢归绝仕
  phases:
  - key: brewing
    name: 诸生负才
    labels:
      zh: 博习属文
    start_date: '1485'
    highlight_event_id: guji-唐寅-event-1
  - key: breakthrough
    name: 乡试夺魁
    labels:
      zh: 解元
    start_date: 1498-09
    highlight_event_id: guji-唐寅-event-2
  - key: climax
    name: 会试罹祸
    labels:
      zh: 科场案
    start_date: 1499-04
    highlight_event_id: guji-唐寅-event-3
  - key: closure
    name: 罢归绝意
    labels:
      zh: 绝仕
    start_date: '1500'
    highlight_event_id: guji-唐寅-event-4
  decisions:
  - date: 1499-03
    title_zh: 持帛谒程敏政求文饯行
    rationale: 感梁储荐引欲藉座主声援显才名，不料因此被指受题招谤
  - date: '1500'
    title_zh: 拒就部邮小吏
    rationale: 既以科场受辱不愿再辱，谓士可杀不可再辱，宁放浪自全
- id: guji-唐寅-endeavor-2
  title_zh: 诗画文艺
  description: 放浪吴中以诗文书画自娱，诗婉丽学刘禹锡，骈骊尤绝，与祝允明文徵明并骋吴中
  phases:
  - key: brewing
    name: 吴趋习艺
    labels:
      zh: 博学
    start_date: '1490'
    highlight_event_id: guji-唐寅-event-5
  - key: breakthrough
    name: 以文见知
    labels:
      zh: 奇伟见赏
    start_date: '1495'
    highlight_event_id: guji-唐寅-event-1
  - key: climax
    name: 自号风流才子
    labels:
      zh: 图石明志
    start_date: '1505'
    highlight_event_id: guji-唐寅-event-6
  - key: closure
    name: 困而著述
    labels:
      zh: 立言
    start_date: '1510'
    highlight_event_id: guji-唐寅-event-7
  decisions:
  - date: '1505'
    title_zh: 刻江南第一风流才子印
    rationale: 明功名无望欲以风流自解，以艺术自见，不复屑屑于荣进
  - date: '1510'
    title_zh: 欲櫽括旧闻总统百氏成一家言
    rationale: 法墨翟孙子马迁困而著书，托笔札传后，不以人废言
events:
- id: guji-唐寅-event-birth
  title_zh: 出生吴县吴趋里
  date: '1470-03-06'
  year_of: '1470'
  description: 唐寅生于苏州吴县吴趋里，字伯虎一字子畏，少有俊才博习多识
- id: guji-唐寅-event-1
  title_zh: 作书劝衡山文林
  date: '1495'
  year_of: '1495'
  description: 文林自太仆出知温州意殊不得，寅作书劝之文甚奇伟，为新蔡曹凤所奇赏
- id: guji-唐寅-event-2
  title_zh: 中弘治十一年应天乡试第一
  date: 1498-09
  year_of: '1498'
  description: 洗马梁储校卷叹曰士固有若是奇者耶，寅遂以第一中解元名动南都
- id: guji-唐寅-event-3
  title_zh: 会试涉程敏政案被逮下狱
  date: 1499-04
  year_of: '1499'
  description: 寅持帛谒主考程敏政求文饯行，遂被诬泄题，天子震怒名捕诏狱身贯三木
- id: guji-唐寅-event-4
  title_zh: 罢归吴中缘故去妻
  date: '1500'
  year_of: '1500'
  description: 寅罢归朝臣多叹惜，归无几缘故去其妻，作怅怅诸诗叹功名遭逢
- id: guji-唐寅-event-5
  title_zh: 与祝允明文徵明切磋诗文
  date: '1490'
  year_of: '1490'
  description: 与祝允明等吴中才子往还，骈骊歌诗婉丽尤绝，为时所推
- id: guji-唐寅-event-6
  title_zh: 自图石曰江南第一风流才子
  date: '1505'
  year_of: '1505'
  description: 感慨枯木朽枺无所建立，乃图其石曰江南第一风流才子以慷慨自遣
- id: guji-唐寅-event-7
  title_zh: 作诗论行藏欲托著述
  date: '1510'
  year_of: '1510'
  description: 作拥鼻行吟等诗检校行藏，欲如墨翟孙子马迁困而著书传于好事
- id: guji-唐寅-event-death
  title_zh: 卒于吴中
  date: '1524-01-07'
  year_of: '1524'
  description: 晚年卖画自给贫病交加，卒于苏州，年五十四
