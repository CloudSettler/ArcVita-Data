  birth_date: '1642'
  death_date: '1681-08-18'
  era: 清
  reign_ref: 康熙
  archetype: 宗室儒将
  dilemmas:
  - 速战求功与持重待时的抉择，诸将屡请速战而己坚持坚壁待时
  - 剿抚并用中区分胁从与真贼的宽严之度，贷胁从以得民心
  lesson: 镇静抚民为先，谋定而后动，方能转危为安
  summary_first_person: 吾乃饶余郡王阿巴泰次子，袭固山贝子，授宁海将军，奉命讨耿逆于浙东，莅台州见城围粮绝民困，乃倍饷固垒，禁掘坟伐木，捐赈煮粥，整军练舟，密复仙居以通粮道，间道抄黄岩之后，迫曾养性夜遁，追至温州而解台围，幸赖圣主洪福与台道杨应魁协赞，得安辑一方
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/宁海将军固山贝子功绩录.md
