  decisions:
  - date: '1674-12-10'
    title_zh: 倍饷犒赏坚壁不战
    rationale: 察山营饥寒怀乡，即令倍给月饷，椎牛酾酒，令诸军按甲固垒以待时，不许轻举
  - date: '1675-02-01'
    title_zh: 密遣乡导克复仙居
    rationale: 仙居据则天台粮道断，与杨应魁郑录勋密议别径，遣大军一举复城
  - date: '1675-08-01'
    title_zh: 择秋密师由茅坪抄后
    rationale: 暑酷不兴师，待凉遣穆赫林等由仙居茅坪岭间道抵黄岩尾后，迫贼自溃
- id: guji-喇布-endeavor-2
  name_zh: 整军抚民善后
  description: 申军纪，禁扰民，赈荒，练水师，宽宥胁从以固根本
  phases:
  - key: brewing
    name: 正纪安葬
    labels:
      zh: 整饬
    start_date: '1674-12-12'
    highlight_event_id: guji-喇布-event-discipline
  - key: breakthrough
    name: 赈济练舟
    labels:
      zh: 抚练
    start_date: '1674-12-02'
    highlight_event_id: guji-喇布-event-relief
  - key: climax
    name: 宽宥胁从
    labels:
      zh: 招抚
    start_date: '1675-02-04'
    highlight_event_id: guji-喇布-event-amnesty
  - key: closure
    name: 通商务农
    labels:
      zh: 安业
    start_date: '1675-06-04'
    highlight_event_id: guji-喇布-event-trade
  decisions:
  - date: '1674-12-12'
    title_zh: 禁掘坟伐木给运骸骨
    rationale: 见营濠暴露朽骨，下令禁摊掘民莹砍伐松楸，违者军法，给费遣子弟舁骨归葬
  - date: '1674-12-02'
    title_zh: 发银煮粥赈饥
    rationale: 岁逼年饥米价腾涌，自捐银四百两偕道守劝捐，于天宁寺煮粥活民至岁尽
  - date: '1675-02-04'
    title_zh: 赦仙居胁从妇女免屠
    rationale: 明谕能预降者免诛，仙民被贼迫胁尤悯，查明妇女许本夫至亲赎回，全活数万
events:
- id: guji-喇布-event-birth
  title_zh: 诞生
  date: '1642'
  year_of: '1642'
  location_zh: 盛京
  description: 饶余郡王阿巴泰次子，生于崇德七年，初封辅国公后晋固山贝子
- id: guji-喇布-event-appointment
  title_zh: 授宁海将军
  date: '1674-11-01'
  year_of: '1674'
  location_zh: 京师
  description: 康熙十三年秋奉命为宁海将军，领满汉兵赴浙东讨耿精忠之乱
- id: guji-喇布-event-arrival
  title_zh: 莅台抚军
  date: '1674-12-10'
  year_of: '1674'
  location_zh: 台州府
  description: 十一月初四提师至台，百姓顶香跪迎六七里，慰谕坚壁固垒，倍饷犒军，军容肃然
- id: guji-喇布-event-discipline
  title_zh: 整军纪葬枯骨
  date: '1674-12-12'
  year_of: '1674'
  location_zh: 台州营盘
  description: 见营盘濠沟暴露朽骨，传谕禁掘民莹伐松楸，给运费令舁阵亡骸骨归葬首丘
- id: guji-喇布-event-relief
  title_zh: 捐赈煮粥
  date: '1674-12-02'
  year_of: '1674'
  location_zh: 台州天宁寺
  description: 以岁饥米贵自捐银四百两，偕监司杨应魁等劝捐，于天宁寺煮粥救济至岁尽
- id: guji-喇布-event-xianju
  title_zh: 克复仙居
  date: '1675-02-01'
  year_of: '1675'
  location_zh: 仙居县
  description: 与杨应魁郑录勋密谋，遣满汉兵以郑录勋为乡导一举克复仙居，通天台粮道
- id: guji-喇布-event-amnesty
  title_zh: 宥胁从免屠
  date: '1675-02-04'
  year_of: '1675'
  location_zh: 仙居
  description: 谕能预降者免诛，仙民被胁非甘心从贼，查明妇女许本夫至亲赎回
- id: guji-喇布-event-trade
  title_zh: 许割辫民贸易
  date: '1675-06-04'
  year_of: '1675'
  location_zh: 台州
  description: 令割辫民听往来入城贸易不许盘诘，远近负戴入市，斗米尺布流通，城中大有起色
- id: guji-喇布-event-huangyan
  title_zh: 间道收复黄岩
  date: '1675-09-15'
  year_of: '1675'
  location_zh: 黄岩
  description: 遣穆赫林等密从仙居茅坪岭经凉篷宁溪乌岩抄贼后，贼恐八月初七夜拔营遁
- id: guji-喇布-event-wenzhou
  title_zh: 追至温州解台围
  date: '1675-09-27'
  year_of: '1675'
  location_zh: 黄岩至温州
  description: 八月初八尽提台郡满汉兵追至拗岭黄岩乐清温州，台州围解，浙东戡定
- id: guji-喇布-event-death
  title_zh: 逝世
  date: '1681-08-18'
  year_of: '1681'
  location_zh: 京师
  description: 康熙二十年七月卒于京，年四十，以宗室将功追叙
