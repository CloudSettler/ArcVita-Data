  birth_date: '1612-11-17'
  death_date: '1650-12-31'
  era: 清初
  reign_ref: 崇德至顺治
  archetype: 摄政奠基
  dilemmas:
  - 摄政专擅见忌与忠事幼主之进退
  - 扫荡流寇急切与经画创制久远之权衡
  lesson: 功在定鼎一统，忠在尊君亲上，虽一時蒙诬而实录可徵，公道自在人心
  summary_first_person: 予为太祖第十四子，蒙太宗特异恩育。值中原鼎沸，首统众入关扫荡贼氛肃清宫禁，分遣诸王追歼流寇抚定疆陲，奉迎世祖定鼎燕京以成一统。尝集诸王明言当尊崇皇上而勿谄媚于予，且曰昔太宗升遐众议推戴予誓死不从以奉皇上，足明本心。摄政秉公持正，虽以威福见忌，身后竟遭苏克萨哈等构陷除封，然实录具在皆有大功而无叛迹，惟冀后世昭雪此屈。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/钦定宗室王公功绩表传.md
