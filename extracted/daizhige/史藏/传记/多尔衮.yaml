  description: 以阿济格谎报李自成死不候旨班师及胁释道员擅至鄂尔多斯取马等罪遣员斥责夺亲王爵降为郡王
- id: guji-多尔衮-event-death
  title_zh: 薨于喀喇城
  date: '1650-12-31'
  year_of: 1650
  place: 喀喇城
  description: 狩猎塞外薨于喀喇城，年三十九，初封睿亲王摄政王
- id: guji-多尔衮-event-posthumous-purge
  title_zh: 身后被构除封
  date: '1651-03-12'
  year_of: 1651
  place: 燕京
  description: 殁后为苏克萨哈等所构属人首告以敛服僣用明黄龙衮为觊觎证诸王定罪除封时世祖尚在冲龄未尝亲政
- id: guji-多尔衮-event-rehabilitation
  title_zh: 乾隆追复睿亲王忠号配享太庙
  date: '1778-02-06'
  year_of: 1778
  place: 燕京
  description: 乾隆四十三年正月初十谕以实录校核王皆有大功而无叛迹复还睿亲王封号追谥曰忠补入玉牒补继袭封修茔墓春秋致祭补置牌位配享太庙并命国史馆据实录增补功绩表传
