  - key: breakthrough
    name: 入关克京
    labels:
      zh: 入关
    start_date: '1644-04-25'
    highlight_event_id: guji-多尔衮-event-enter-beijing
  - key: climax
    name: 分遣追歼
    labels:
      zh: 经略
    start_date: '1644-06-01'
    highlight_event_id: guji-多尔衮-event-dispatch-princes
  - key: closure
    name: 奉迎定都
    labels:
      zh: 定鼎
    start_date: '1644-09-01'
    highlight_event_id: guji-多尔衮-event-welcome-shunzhi
  decisions:
  - date: '1644-04-15'
    title_zh: 决计统众入关
    rationale: 明祚已移流寇据京，吴三桂迎师，正可扫荡贼氛抚定民心以成定鼎之机
  - date: '1644-06-01'
    title_zh: 分遣诸王追歼流寇
    rationale: 京畿虽清而流寇散扰疆陲不一鼓荡平则中原不安故遣豫王等多路穷追
  - date: '1644-09-15'
    title_zh: 奉迎世祖车驾入都
    rationale: 宫禁既肃疆陲渐定当亟定国都以正统绪而安天下
- id: guji-多尔衮-endeavor-2
  title_zh: 摄政辅政与昭雪复封
  summary: 摄政有年经画一切创制规模，集诸王诫以尊崇皇上斥谄媚，持正议降同母兄阿济格之罪，虽身后被构以敛服僣用谋逆除封，乾隆四十三年据实录昭雪复睿亲王忠号补入玉牒配享太庙
  phases:
  - key: brewing
