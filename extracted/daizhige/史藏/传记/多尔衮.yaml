- id: guji-多尔衮-endeavor-1
  title_zh: 统众入关肃清定鼎
  summary: 顺治元年首统众入关扫荡李自成贼氛肃清宫禁，分遣诸王追殱流寇抚定疆陲，创制规模迎世祖定都北京以成一统之业
  phases:
  - key: brewing
    name: 整军俟时
    labels:
