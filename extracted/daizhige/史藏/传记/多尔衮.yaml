    start_date: '1645-02-01'
    highlight_event_id: guji-多尔衮-event-reprimand-ajige
  - key: climax
    name: 身后构陷
    labels:
      zh: 蒙冤
    start_date: '1651-03-01'
    highlight_event_id: guji-多尔衮-event-posthumous-purge
  - key: closure
    name: 追复忠号配享
    labels:
      zh: 昭雪
    start_date: '1778-02-06'
    highlight_event_id: guji-多尔衮-event-rehabilitation
  decisions:
  - date: '1644-05-10'
    title_zh: 诫诸王尊崇皇上
    rationale: 摄政当危疑之际宜明君臣大义斥但知谄媚于予而不敬皇上者以正人心
  - date: '1645-03-01'
    title_zh: 议降阿济格为郡王
    rationale: 阿济格追捕流寇谎报李自成身死违令不候班师又胁释道员擅取鄂尔多斯马匹当秉公持正以肃军纪
  - date: '1644-10-01'
    title_zh: 辞众议推戴以奉幼主
    rationale: 太宗升遐时英豫二王跪请予即尊位予誓死不从既以死固辞岂复有异志当以忠荩昭示宗盟
events:
