  year_of: 1644
  place: 燕京
  description: 集诸王贝勒大臣喩曰但知谄媚于予未见尊崇皇上者予岂能容并述昔辞英豫二王推戴事以明忠荩
- id: guji-多尔衮-event-reprimand-ajige
