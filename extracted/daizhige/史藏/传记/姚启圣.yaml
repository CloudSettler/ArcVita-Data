person:
  qid: guji-姚启圣
  name_zh: 姚启圣
  names:
    zh: 姚启圣
    en: Yao Qisheng
  lifespan:
    birth:
      date: '1624'
      precision: year
      is_circa: true
      raw: ''
    death:
      date: '1683'
      precision: year
      is_circa: true
      raw: ''
  birth_date: '1624'
  death_date: '1683'
  era: 清康熙年间
  reign_ref: 康熙
  archetype: 平定海疆的闽浙总督
  dilemmas:
  - 招抚郑锦与武力进剿之间的方略之争
  - 与施琅关于进兵时机及路线（北风或南风）的分歧
  lesson: 平定叛乱既需招抚离间之谋，亦需果断用兵之力，二者相济方能功成。
  summary_first_person: 我姚启圣以总督之职经略福建，先败海寇刘国轩于蜈蚣山，复同安，又献策赦刘国轩、吴淑之罪以离间郑锦。康熙十九年我会师水陆并进，克厦门、金门，海上诸岛渐平。后请展界复业，并与施琅协力进剿台湾，促成郑克塽归降，台湾入我朝版图。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷八十
endeavors:
- id: guji-姚启圣-endeavor-1
  name_zh: 平定闽海郑氏之乱
  phases:
