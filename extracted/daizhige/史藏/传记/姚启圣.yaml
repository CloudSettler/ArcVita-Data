  related_entities:
  - 吴兴祚
  - 郑克塽
  - 施琅
  summary_zh: 康熙二十二年前后，启圣与兴祚疏请展界俾沿海民复业；后国轩请降，启圣奏闻，上敕谕郑克塽等，台湾入版图。
