    name_zh: 出师会剿
    labels:
      zh: 会剿漳州泉州
    start_date: 1678-04
    highlight_event_id: guji-姚启圣-event-1
  - key: breakthrough
    name_zh: 蜈蚣山大捷
    labels:
      zh: 大破刘国轩
    start_date: 1678-08
    highlight_event_id: guji-姚启圣-event-2
  - key: climax
    name_zh: 克复厦门金门
    labels:
      zh: 水陆会师克二岛
    start_date: '1680'
    highlight_event_id: guji-姚启圣-event-3
  - key: closure
    name_zh: 台湾归降与展界
    labels:
      zh: 促成郑氏纳降、请展界复业
    start_date: '1683'
    highlight_event_id: guji-姚启圣-event-4
  decisions:
  - date: 1678-08
    title_zh: 出安溪败国轩于长泰
    rationale: 泉州被围，奉命会同诸道军会剿解围。
  - date: 1679-10
    title_zh: 疏请赦刘国轩、吴淑以离间郑锦
    rationale: 认为郑锦据台湾必不降，若二将解体投诚，则锦势孤，海上可立平。
  - date: 1683-10
    title_zh: 奏闻郑克塽乞降并转呈康熙敕谕
    rationale: 克塽遣官乞降，启圣据实奏闻，奉旨开谕招抚。
- id: guji-姚启圣-endeavor-2
  name_zh: 协饷济师支持施琅平台湾
  phases:
  - key: brewing
    name_zh: 议师期不合
    labels:
      zh: 与施琅议北风南风之别
    start_date: 1680-11
    highlight_event_id: guji-姚启圣-event-4
  - key: breakthrough
    name_zh: 留厦门济饷
    labels:
      zh: 督臣守厦门济饷
    start_date: '1682'
    highlight_event_id: guji-姚启圣-event-4
  - key: climax
    name_zh: 澎湖大捷后招抚
    labels:
      zh: 奏请招抚郑氏
    start_date: 1683-06
    highlight_event_id: guji-姚启圣-event-4
  - key: closure
    name_zh: 台湾设府县
    labels:
      zh: 台湾入版图
    start_date: 1683-08
    highlight_event_id: guji-姚启圣-event-4
  decisions:
  - date: 1680-11
    title_zh: 请展界让沿海民复业
    rationale: 迁界久困民生，与吴兴祚疏请展界，朝廷从之。
  - date: '1682'
    title_zh: 接受施琅先取澎湖之议
    rationale: 琅请独任讨击，启圣留厦门济饷，协调文武分工。
