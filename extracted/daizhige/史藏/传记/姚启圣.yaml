  summary_zh: 康熙十九年，正色败敌于海坛，启圣会师水陆进趋玉洲，遂克厦门、金门，余党遁还台湾。
- id: guji-姚启圣-event-4
  event_type: endeavor_event
  name_zh: 请展界复业并促成招抚
  date: 1683-01
  year_of: 1683
  precision: year
  participants:
