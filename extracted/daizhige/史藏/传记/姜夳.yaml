  decisions:
  - date: 1176-12
    title_zh: 作扬州慢志黍离
    rationale: 过维扬目睹荠麦青青废池乔木，不直抒衰飒而以清远寄慨，奠定不减清真而高处过之的词风
  - date: 1181
    title_zh: 从萧千岩学诗
    rationale: 客长沙师事萧德藻，取其裁云缝月、敲金戛玉之法，舍轻靡而就雅健，为词诗互证之基
- id: guji-姜夔-endeavor-2
  title_zh: 书学乐律与文献考订
  summary: 晚得笔法于单丙文，考绛帖、作续书谱、议大乐、著诗说，以考据复旧而以著录传后
  phases:
  - key: brewing
    name: 学书三十年
    labels:
