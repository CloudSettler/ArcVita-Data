  dilemmas:
  - title_zh: 困踬场屋与寄食清高
    description: 自淳熙甲午连应州试不第，赖张平甫等知交周旋，于依人门客与布衣自持间求尊严与生计平衡
  - title_zh: 师古与自度
    description: 精研兰亭、续书谱、绛帖与大乐考据，于复古法度与自度新腔、自制曲度之间抉择
  lesson: 以清真为脉而以野云孤飞自立，寄托黍离之悲而不堕颓唐，书乐词三绝皆以考据证创作
  summary_first_person: 余鄱阳姜夔，字尧章，号白石道人。少随先人宦于汉阳沔上，蚤岁孤贫归居箬坑丁山。困踬场屋而受知于梁内翰、萧千岩、张平甫诸公，遂以诗词、书法、律吕自托江湖。尝雪中过维扬作扬州慢以志黍离，客长沙从千岩学诗，晚与白石洞天为邻，辑续书谱、绛帖平、大乐议、诗说及白石歌曲。平生无立锥而喜宾客，以布衣终老湖山，惟愿词如野云孤飞、书若合契。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/白石道人年谱.md
  - https://daizhige.org/史藏/传记/白石道人年譜.html
