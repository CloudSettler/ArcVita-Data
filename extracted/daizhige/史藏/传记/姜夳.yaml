  - key: climax
    name: 乐书进御
    labels:
      zh: 高峰
    start_date: 1195
    highlight_event_id: guji-姜夔-event-1195-yueshu
  - key: closure
    name: 帖考谱成
    labels:
      zh: 收束
    start_date: 1203
    highlight_event_id: guji-姜夔-event-1203-jiangtie
  decisions:
  - date: 1185
    title_zh: 自制曲以审律吕
    rationale: 善吹箫、多自制曲，以律吕考古证今乐，不为俗耳迁就，为白石歌曲自度腔奠基
  - date: 1203
    title_zh: 定续书谱与绛帖平
    rationale: 以王献之保母志等刻为证，合笔法与考据，存六卷绛帖平与一卷续书谱，示学书有法而非徒摹
events:
- id: guji-姜夔-event-birth
  date: 1158-09
  title_zh: 绍兴戊寅九月生于鄱阳
  description: 生于饶州鄱阳姜氏，系出九真唐相姜公辅后，父姜噩绍兴三十年进士，时家饶信间
  location: 饶州鄱阳
- id: guji-姜夔-event-1167-guimian
  date: 1167
  title_zh: 十岁随父官古沔
  description: 干道三年随父姜噩宰汉阳，居古沔女须家沔之山阳左白湖右云梦，始见沔鄂山水
  location: 汉阳沔阳
- id: guji-姜夔-event-1170-dingyou
  date: 1170
  title_zh: 丁父忧奉丧归葬读书箬坑丁山
  description: 干道六年父噩卒于汉阳任，扶丧归德兴箬坑丁山，隐居读书，家无立锥而藏书翰墨甚富
  location: 饶州德兴箬坑丁山
- id: guji-姜夔-event-1170-xueshu
  date: 1170
  title_zh: 始学书
  description: 自干道九年癸巳计至嘉泰癸亥三十一年学书，晚得笔法于单丙文，始有合契之悟
  location: 鄱阳
- id: guji-姜夔-event-1174-yingshi
  date: 1174
  title_zh: 秋应州试报罢西游省姊
  description: 淳熙元年甲午秋应饶州试不第，西游古沔省视女须姊家，始结沔中郑仁举辛泌杨大昌姚刚中等石友
  location: 古沔九真山阳
- id: guji-姜夔-event-1176-yangzhou
  date: 1176-12-22
  title_zh: 冬至过维扬作扬州慢
  description: 淳熙三年冬下大江留鳌背洲十日，雪霁下扬子至日过维扬，作扬州慢淳熙丙申以黍离之悲名世，梁内翰称长短句妙天下
  location: 扬州
- id: guji-姜夔-event-1181-changsha
  date: 1181
  title_zh: 客长沙从萧千岩学诗谒辛稼轩
  description: 淳熙八年客潭州从萧德藻学诗，时辛弃疾知潭州兼湖南安抚，深服其长短句，兼初习兰亭
  location: 潭州长沙
- id: guji-姜夔-event-1181-xiti
  date: 1181
  title_zh: 初习兰亭帖
  description: 淳熙八年始习兰亭，于帖学用功，为后作续书谱、绛帖平张本
  location: 长沙
- id: guji-姜夔-event-1195-yueshu
  date: 1195
  title_zh: 进大乐议琴瑟考古图
  description: 庆元间以乐书准解，为白石道人献大乐议一卷琴瑟考古图一卷于朝，见宋史乐志
  location: 临安
- id: guji-姜夔-event-1202-qugao
  date: 1202
  title_zh: 白石道人歌曲定稿
  description: 暮年删窜嘉泰壬戌六卷本定为白石道人歌曲五卷，后陶南村钞本合为四卷，附诗说别集等
  location: 吴兴苕溪白石洞天
- id: guji-姜夔-event-1203-jiangtie
  date: 1203
  title_zh: 跋王献之保母志明学书本末
  description: 嘉泰三年癸亥跋保母志云予学书三十年晚得笔法于单丙文，证嘉泰本与家藏定本之别
  location: 湖州
- id: guji-姜夔-event-death
  date: 1221
  title_zh: 卒于杭
  description: 约嘉定十四年卒于杭州，依陈思谱系卒年约六十四，前人以绍定辛卯为误，二姜辨析亦据此
  location: 杭州
