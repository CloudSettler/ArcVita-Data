person:
  qid: guji-娥皇
  name_zh: 娥皇
  names:
    zh: 娥皇
    en: Ehuang
  lifespan:
    birth:
      date: 约-2100
      precision: era
      is_circa: true
      raw: 帝尧之女，居于虞舜之世
    death:
      date: 约-2030
      precision: era
      is_circa: true
      raw: 二妃死于江湘之间
  birth_date: 约-2100
  death_date: 约-2030
  era: 上古唐虞之际
  reign_ref: 舜
  archetype: 贤后
  dilemmas:
  - 尊为天子之女而下嫁耕亩，是否骄盈
  - 夫家屡谋害舜，助夫避祸与孝养公婆如何两全
  - 夫死于苍梧，殉节江湘
  lesson: 以尊事卑、谦恭贞仁，虽历险难而妇道不亏
  summary_first_person: 我乃帝尧长女，与妹女英同嫁于舜。虽出天家，却谦恭勤俭，事舜于畎亩。每当瞽叟与象谋害，我与妹共助舜脱险涂廪、浚井、解酒醉。舜即天子位，我为后，妹为妃。舜崩于苍梧，我哭于江湘之间而死，世称湘君。
  source_urls:
  - https://zh.wikisource.org/wiki/新刊古列女传
