  decisions:
  - date: 约-2070
    title_zh: 许舜涂廪而不阻其孝
    rationale: 舜孝于父母，二女不违其志，唯预为脱险之备。
  - date: 约-2070
    title_zh: 教舜药浴解酒以防速饮之杀
    rationale: 以智化解瞽叟醉杀之谋，使其终日饮酒不醉。
events:
- id: guji-娥皇-event-birth
  date: 约-2100
  year_of: -2100
  type: birth
  title_zh: 帝尧长女娥皇出生
  description: 有虞二妃者，帝尧之二女也，长娥皇，次女英。
- id: guji-娥皇-event-marriage
  date: 约-2080
  year_of: -2080
  type: marriage
  title_zh: 尧妻之以二女，观其内
  description: 四岳荐舜于尧，尧乃妻以二女。二女承事舜于畎亩之中，不以天子之女故而骄盈，谦谦恭俭。
- id: guji-娥皇-event-granary
  date: 约-2070
  year_of: -2070
  type: rescuе
  title_zh: 谋助舜脱涂廪焚身之难
  description: 瞽叟使舜涂廪而焚之，舜飞出；二人又谋浚井掩之，舜潜出；后欲醉而杀之，二女与舜药浴，舜终日饮酒不醉。
- id: guji-娥皇-event-empress
  date: 约-2050
  year_of: -2050
  type: succession
  title_zh: 舜即帝位，娥皇为后
  description: 舜既嗣位升为天子，娥皇为后，女英为妃；天下称二妃聪明贞仁。
- id: guji-娥皇-event-death
  date: 约-2030
  year_of: -2030
  type: death
  title_zh: 二妃殉舜，死于江湘之间
  description: 舜陟方死于苍梧，二妃死于江湘之间，俗谓之湘君。
