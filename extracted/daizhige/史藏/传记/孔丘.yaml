person:
  qid: guji-孔子
  name_zh: 孔丘
  names:
    zh: 孔子（名丘，字仲尼）
    en: Confucius (Kong Qiu, styled Zhongni)
  lifespan:
    birth:
      date: -551-09-28
      precision: day
      is_circa: false
      raw: 周灵王二十一年己酉岁（鲁襄公二十二年）冬十月庚子日，即夏正十月二十一日；公羊作襄公二十一年十一月庚子，谷梁作二十一年十月庚辰朔庚子，书末考异以节气定为襄公二十二年
    death:
      date: -479-04-18
      precision: day
      is_circa: false
      raw: 周敬王四十一年（鲁哀公十六年）夏四月乙丑日，考异定为四月十八日；左氏作己丑，本文以为先儒之误
  birth_date: -551-09-28
  death_date: -479-04-18
  era: 春秋末期（东周）
  reign_ref: 周灵王、周敬王之世；鲁襄公、鲁昭公、鲁定公、鲁哀公
  archetype: 至圣先师、素王、万世师表
  dilemmas:
  - 有德无位，素王之身而楚王莫封、鲁公不用，栖迟旅人，干禄行道还是退而立言
  - 麟见道穷，西狩获麟而天告将亡之证，泣涕沾襟，绝笔以寄褒贬还是强聒于世
  - 泰山其颓，梦坐奠于两楹之间自知将终，从容歌而入还是忧惧问疾
  lesson: 道不行于当世，则修经立教以垂万世；岁不我与，而弦歌不辍
  summary_first_person: 丘，殷商微子启之后，子姓孔氏，生于鲁之陬邑。相传吾生之夕，二龙绕室，五老降庭，母颜氏之房闻钧天之乐，空中声言天感生圣子。吾年十九娶于宋亓官氏。尝仕鲁为大司寇，然楚王莫封、鲁公不用，栖迟旅人于列国。哀公十四年西狩大野获麟，吾视之曰麟也胡为来哉，反袂拭面，泣涕沾襟，系角之绂犹存，麟见而天告吾将亡之证。晚而因鲁史修《春秋》，就太师正《雅》《颂》。一晨负手曳杖，逍遥于门而歌曰泰山颓乎梁木坏乎哲人萎乎，告子贡以两楹之梦，自谓殷人殡于两楹之间，殆殷人也，后七日而终，年七十三。没后哀公立庙于旧宅，汉追谥褒成宣尼公，唐封文宣王，宋加号至圣文宣王，庙食阙里，为亿载之师表。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%9C%E5%AE%B6%E6%9D%82%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%9C%E5%AE%B6%E6%9D%82%E8%AE%B0.md
  - https://ctext.org/wiki.pl?if=gb&res=wb225913
endeavors:
- id: guji-孔子-endeavor-1
  name_zh: 杏坛设教
  description: 开私学之先，睹臧文仲誓盟之坛而命琴设教，弦歌讲授不辍
  phases:
  - key: brewing
    name: 志于学
    labels:
      zh:
      - 十有五而志于学
    start_date: 约-536
  - key: breakthrough
    name: 开坛杏下
    labels:
      zh:
      - 车从出国东门，观杏坛，历级而上
    start_date: 约-500
    highlight_event_id: guji-孔子-event-xingtan
  - key: climax
    name: 讲诵洙泗
    labels:
      zh:
      - 归鲁之后，弟子会集，弦歌不辍
    start_date: 约-484
  - key: closure
    name: 身殁道存
    labels:
      zh:
      - 哀公立庙，教泽被于百世
    start_date: -479
    highlight_event_id: guji-孔子-event-death
  decisions:
  - date: 约-532
    title_zh: 十九而娶于宋亓官氏
    rationale: 既冠成家，为立身行道之始
  - date: 约-500
    title_zh: 即臧文仲誓盟之坛设教
    rationale: 睹物思人，历级而上，以坛为讲习礼乐之所
- id: guji-孔子-endeavor-2
  name_zh: 仕鲁栖迟列国
  description: 仕鲁为司寇而行道于邦，道不行则周游干世，终归于鲁
  phases:
  - key: brewing
    name: 出仕司寇
    labels:
      zh:
      - 鲁大司寇，资大圣之才行道于父母之邦
    start_date: 约-501
    highlight_event_id: guji-孔子-event-sikou
  - key: breakthrough
    name: 去鲁周游
    labels:
      zh:
      - 栖迟旅人
    start_date: 约-497
  - key: climax
    name: 干列国而道不行
    labels:
      zh:
      - 楚王莫封，鲁公不用，想乘桴而永叹
    start_date: 约-489
  - key: closure
    name: 归鲁
    labels:
      zh:
      - 因获麟而兴感，反鲁修经正乐
    start_date: 约-484
    highlight_event_id: guji-孔子-event-kanlin
  decisions:
  - date: 约-501
    title_zh: 出仕鲁为司寇
    rationale: 欲以礼乐刑政行道于当世
  - date: 约-497
    title_zh: 去鲁而栖迟列国
    rationale: 道不同不相为谋，周游以寻求行道之君
  - date: 约-484
    title_zh: 归鲁不复求仕
    rationale: 大道终不行于列国，退而托之简册
- id: guji-孔子-endeavor-3
  name_zh: 素王修经
  description: 退考五代之礼，修素王之事，因鲁史而制春秋，就太师而正雅颂
  phases:
  - key: brewing
    name: 正雅颂
    labels:
      zh:
      - 就太师而正雅颂，考三古、襃一言
    start_date: 约-501
  - key: breakthrough
    name: 因鲁史修《春秋》
    labels:
      zh:
      - 就鲁史旧文而制《春秋》
    start_date: 约-483
  - key: climax
    name: 获麟绝笔
    labels:
      zh:
      - 麟见而天告将亡，反袂拭面
    start_date: -481
    highlight_event_id: guji-孔子-event-kanlin
  - key: closure
    name: 素王垂范
    labels:
      zh:
      - 亿载之师表，立庙崇封于历代
    start_date: -478
    highlight_event_id: guji-孔子-event-limiao
  decisions:
  - date: 约-501
    title_zh: 就太师正雅颂
    rationale: 礼乐之务败坏于衰周，正之以便垂教后世
  - date: 约-481
    title_zh: 见获麟而绝笔
    rationale: 麟出见获，天告素王将亡之证，故托褒贬于一笔
