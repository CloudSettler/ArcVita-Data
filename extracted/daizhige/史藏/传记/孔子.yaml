    name: 问官郯子学鸟名之制
    labels:
      zh: 问学
    start_date: -525-01-01
    highlight_event_id: guji-孔子-event-xueyu-tanzi
  - key: breakthrough
    name: 适周问礼于老耼访乐于苌弘
    labels:
      zh: 问道
    start_date: -518-01-01
    highlight_event_id: guji-孔子-event-wenli-zhou
  - key: climax
    name: 居鲁大兴私学授徒三千
    labels:
      zh: 讲学
    start_date: -501-01-01
