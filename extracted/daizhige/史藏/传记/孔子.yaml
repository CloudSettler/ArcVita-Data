  - key: closure
    name: 晚年删述六经以传圣道
    labels:
      zh: 述作
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-shanshu-liujing
  decisions:
  - date: -525-01-01
    title_zh: 见郯子而学
    rationale: 闻天子失官学在四夷，郯子能言少皞鸟官之制，亲往学之以明古制，叹学在四夷犹信
  - date: -518-01-01
    title_zh: 适周问礼
    rationale: 受孟僖子属子学礼之托，欲考先王遗制明堂郊社庙朝之度，请于鲁君得车马与南宫敬叔入周
- id: guji-孔子-endeavor-2
  title_zh: 周游列国与为政行道
  phases:
  - key: brewing
    name: 鲁乱适齐为高昭子家臣
    labels:
      zh: 适齐
    start_date: -517-01-01
    highlight_event_id: guji-孔子-event-shiqi-wenshao
  - key: breakthrough
    name: 对景公论君臣节财之政
    labels:
      zh: 论政
    start_date: -516-01-01
    highlight_event_id: guji-孔子-event-lunzheng-qijing
  - key: climax
    name: 归鲁为司寇堕三都行教化
    labels:
      zh: 为政
    start_date: -500-01-01
    highlight_event_id: guji-孔子-event-sikou-lu
  - key: closure
    name: 道不行周游列国而归
    labels:
      zh: 周游
    start_date: -497-01-01
    highlight_event_id: guji-孔子-event-zhouyou-lieiguo
  decisions:
  - date: -517-01-01
    title_zh: 去鲁适齐
    rationale: 季氏攻昭公鲁乱，欲通齐景公以行君君臣臣父父子子之道，并观齐政得失
  - date: -497-01-01
    title_zh: 周游列国
    rationale: 齐不能用鲁不能行其道，欲求明君以行仁政，虽困厄绝粮而不改其志
events:
- id: guji-孔子-event-birth
  title_zh: 生于鲁陬邑
  date: -551-09-28
  year_of: '-551'
  description: 鲁襄公二十二年庚戌生于平乡陬邑，祷于尼丘而生故名丘字仲尼，为儿嬉戏常陈俎豆设礼容
  place: 鲁陬邑
- id: guji-孔子-event-hezanfang
  title_zh: 合葬父母于防
  date: -527-01-01
  year_of: '-527'
  description: 母颜征在卒，少孤不知父墓殡于五父之衢，问于陬曼父之母得合葬于防，封之崇四尺曰古也墓而不坟
  place: 防山
- id: guji-孔子-event-xueyu-tanzi
  title_zh: 见郯子而学鸟官
  date: -525-01-01
  year_of: '-525'
  description: 郯子来朝言少皞氏以鸟纪官之制，孔子往见而学之，告人曰天子失官学在四夷犹信
  place: 鲁
- id: guji-孔子-event-wenli-zhou
  title_zh: 适周问礼于老耼
  date: -518-01-01
  year_of: '-518'
  description: 鲁昭公二十四年奉孟僖子遗命学礼，偕南宫敬叔至周问礼于老耼访乐于苌弘，历郊社明堂庙朝观金人铭
  place: 周都洛邑
- id: guji-孔子-event-shiqi-wenshao
  title_zh: 适齐闻韶
  date: -517-01-01
  year_of: '-517'
  description: 鲁昭公二十五年季氏逐昭公，孔子适齐为高昭子家臣，闻韶三月不知肉味叹不图为乐之至于斯
  place: 齐
- id: guji-孔子-event-lunzheng-qijing
  title_zh: 对齐景公论政
  date: -516-01-01
  year_of: '-516'
  description: 答景公问政曰君君臣臣父父子子，又曰政在节财，景公善之而晏婴谏不可用儒遂行
  place: 齐
- id: guji-孔子-event-sikou-lu
  title_zh: 仕鲁为司寇
  date: -500-01-01
  year_of: '-500'
  description: 定公时由中都宰进为司空大司寇，行教化正礼乐，欲堕三都以强公室
  place: 鲁
- id: guji-孔子-event-zhouyou-lieiguo
  title_zh: 周游列国
  date: -497-01-01
  year_of: '-497'
  description: 自鲁去历卫宋陈蔡楚等地，厄于匡陈绝粮而弦歌不辍，弟子从游弥坚
  place: 列国
- id: guji-孔子-event-sishu-lu
  title_zh: 居鲁授徒讲学
  date: -501-01-01
  year_of: '-501'
  description: 自周归鲁弟子稍益进，射于矍相之圃观礼设教，以诗书礼乐授徒三千
  place: 鲁
- id: guji-孔子-event-shanshu-liujing
  title_zh: 晚年删述六经
  date: -484-01-01
  year_of: '-484'
  description: 周游归鲁后删诗定书系易作春秋修礼乐，以传先王之道于后世
  place: 鲁曲阜
- id: guji-孔子-event-death
  title_zh: 卒于鲁
  date: -479-04-11
  year_of: '-479'
  description: 鲁哀公十六年卒于鲁，弟子服丧三年如丧父，葬于曲阜泗上
  place: 鲁曲阜
