    en: Confucius
  lifespan:
    birth:
      date: -551-09-28
      precision: day
      is_circa: true
      raw: 鲁襄公二十二年庚戌生于陬邑
    death:
      date: -479-04-11
      precision: day
      is_circa: true
      raw: 鲁哀公十六年卒于鲁
  birth_date: -551-09-28
  death_date: -479-04-11
  era: 春秋
  reign_ref: 鲁襄公至鲁哀公
  archetype: 至圣先师
  dilemmas:
  - 礼崩乐坏之世当从周复礼还是因时损益
  - 出仕行道与退而授徒孰能弘道
  - 为政当以宽济猛还是以猛济宽
  lesson: 克己复礼为仁，以忠恕行道，学不厌教不倦，虽道不行而志不改
  summary_first_person: 吾名丘字仲尼，祷于尼丘而生，少也贱故多能鄙事，十五志于学，三十而立，问官于郯子，问道于老耼，闻韶于齐，三月不知肉味，周游列国欲行君君臣臣父父子子之道而不得，退而删诗书定礼乐系易作春秋，授徒三千以仁礼传后世
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%AD%94%E5%AD%90%E7%BC%96%E5%B9%B4.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%AD%94%E5%AD%90%E7%BC%96%E5%B9%B4.html
