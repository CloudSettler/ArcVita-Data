    title_zh: 父老吊贺之诫敬受勿骄
    rationale: 父老言身贵而骄则民去、位高擅权则君恶、禄厚不知足则患随，遂再拜受命以自警，定廉俭持身之基
  - date: -0598
    title_zh: 乘栈车衣羖裘不受华服
    rationale: 闻君子服美益恭、小人服美益倨，自无德堪华服，欲以俭约示民，不以位移其守
- id: guji-孙叔敖-endeavor-2
  title_zh: 寝丘遗训以廉遗后
  summary_zh: 将死戒子不受利地，择楚越间恶名不争之寝丘，以无欲求长有，保祀十世
  phases:
  - key: brewing
    name: 家无积蓄布衣蔬食
