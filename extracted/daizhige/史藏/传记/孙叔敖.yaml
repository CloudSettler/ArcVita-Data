  archetype: 廉吏
  dilemmas:
  - 位高禄厚与布衣蔬食之自持，权可擅而心不移
  - 三得相位不喜、三失相位不悔，得失非我之辨
  - 利地可封与恶名寝丘之取舍，为子孙长久计
  lesson: 以无欲为本，服美益恭，位去留不系于心，则廉可守而家可久
  summary_first_person: 吾艾猎也，楚之下里人，性本无欲。蒙虞丘子举荐得相楚，三得相而不喜，三去相而不悔。为令尹常乘栈车、衣羖羊裘，妻不衣帛，马不食粟，非恶富也，恐失德也。将死惟戒吾子勿受利地，请寝丘以存祀，愿以廉俭遗后。
