  - key: climax
    name: 王封善地辞而请寝丘
    labels:
      zh: 让封
    start_date: -0593
    highlight_event_id: guji-孙叔敖-event-qinqiu
  - key: closure
    name: 得邑四百祀延十世
    labels:
      zh: 长有
    start_date: -0593
    highlight_event_id: guji-孙叔敖-event-qinqiu
  decisions:
  - date: -0594
    title_zh: 戒子必请寝丘
    rationale: 知楚人鬼、越人禨，寝丘地恶名不美，人所不争，可长有，欲以不争之利保家族久安
  - date: -0593
    title_zh: 辞善地就薄邑
    rationale: 亟封不受利地，以无欲避祸，效前日三得三去不以得失为我之志
events:
- id: guji-孙叔敖-event-birth
  title_zh: 生于楚下里
  date: '-0630'
  year_of: -630
  description: 孙叔敖字艾猎，荆鄙下里人，少秃羸多能，性无欲，以廉俭闻于乡里
- id: guji-孙叔敖-event-appointed
  title_zh: 虞丘子举荐代为令尹
  date: '-0601'
  year_of: -601
  description: 楚庄王锐于立功，令尹虞丘子自陈久妨贤路，举孙叔敖，王以车迎之，遂代为令尹
- id: guji-孙叔敖-event-governance
  title_zh: 为令尹躬行廉俭
  date: '-0600'
  year_of: -600
  description: 为相时吏民皆贺，独父老衣粗衣白冠来吊，诫以贵骄、擅权、厚禄之患，叔敖再拜受命，遂妻不衣帛、马不食粟，常乘栈车、衣羖羊裘
- id: guji-孙叔敖-event-three-times
  title_zh: 三得相不喜三去不悔
  date: -0595
  year_of: -595
  description: 在楚三得相而不喜，三去相而不悔，言其来不可却、其去不可止，得失非我，无悔而已
- id: guji-孙叔敖-event-lastwords
  title_zh: 将死遗戒勿受利地
  date: -0594
  year_of: -594
  description: 将死戒其子曰我死王必封汝，必无受利地，楚越间有寝丘地薄名恶可长有
- id: guji-孙叔敖-event-qinqiu
  title_zh: 子请寝丘祀延十世
  date: -0593
  year_of: -593
  description: 叔敖卒，王果以善地封其子，子不受而请寝丘，王与之四百邑，其祀后十世不绝
- id: guji-孙叔敖-event-death
  title_zh: 卒于楚
  date: -0593
  year_of: -593
  description: 孙叔敖卒，楚王念其功，欲厚封其后，卒用其遗计保全家族
