person:
  qid: guji-孙沔
  name_zh: 孙沔
  names:
    zh: 孙沔
    en: Sun Mian
  lifespan:
    birth:
      date: '0996-01-01'
      precision: year
      is_circa: true
      raw: 宋太祖开宝九年
    death:
      date: '1066-04-01'
      precision: year
      is_circa: true
      raw: 宋英宗治平三年
  birth_date: '0996-01-01'
  death_date: '1066-04-01'
  era: 北宋
  reign_ref: 宋仁宗皇祐
  archetype: 儒将
  dilemmas:
  - 受命平贼而朝堂掣肘、请宣抚与兵马多不允，孤军当盛贼何以不败
  - 功成名忌与将相争功之间，甘居副贰、密输计于狄青以成军无二令
  lesson: 有备固当示镇静，无备而示镇静乃危亡之本；将相心和谋协，虽狂寇必诛
  summary_first_person: 予自徐徙秦，道闻岭贼横行，力陈于仁宗前而受命安抚四路。虚声安定荆湖，遣李定扼宾阳，创刀斧以破蛮牌，与狄宣抚协谋出昆仑，破贼于归仁铺。贼遁后更戍法、开归仁门、赎鬻子女，惟愿朝廷有备而生民少瘴死耳，谥曰威敏岂予所求
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%AD%99%E5%A8%81%E6%95%8F%E5%BE%81%E5%8D%97%E5%BD%95.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%AD%99%E5%A8%81%E6%95%8F%E5%BE%81%E5%8D%97%E5%BD%95.html
  - https://ctext.org/library.pl?if=gb&file=78054&page=1
endeavors:
- id: guji-孙沔-endeavor-1
  title_zh: 受命岭南与战前筹划
  description_zh: 皇祐四年闻杨畋蒋偕败于白田，力驳鲍轲衰息之奏，奏请宣抚事权与兵马钱帛，虚声安荆湖，遣将扼守宾象，备长刀大斧以制蛮牌，为全军制胜奠基
  phases:
  - key: brewing
    name: 陛见陈贼势
    labels:
      zh: 力谏
    start_date: '1052-08-15'
    highlight_event_id: guji-孙沔-event-audience
  - key: breakthrough
    name: 虚声定荆湖
    labels:
      zh: stabilization
    start_date: '1052-09-01'
    highlight_event_id: guji-孙沔-event-xusheng
  - key: climax
    name: 制器破蛮牌
    labels:
      zh: 备战
    start_date: '1052-11-01'
    highlight_event_id: guji-孙沔-event-beizhi
  - key: closure
    name: 留长沙候狄青
    labels:
      zh: 候会
    start_date: '1052-12-01'
    highlight_event_id: guji-孙沔-event-huidi
  decisions:
  - date: '1052-08-15'
    title_zh: 陛对极言贼盛，乞得宣抚事权
    rationale: 广州宝货亿万为贼所得、官军未尝胜，若以衰息不备必败，须得专制四路之权以应军需
  - date: '1052-09-01'
    title_zh: 飞檄荆湖南北虚声置营
    rationale: 虑贼窥湖南人心摇动，先声言大兵将至、多建营垒储犒赏，使贼不敢越岭北犯
  - date: '1052-10-10'
    title_zh: 遣李定守宾州严令不妄战
    rationale: 龙将贪功易为桂帅所使而败，约束斩一家以全宾象，果保二州不失
- id: guji-孙沔-endeavor-2
  title_zh: 归仁铺决战与邕州善后
  description_zh: 与狄青协谋出昆仑关，于归仁铺以刀斧破牌枪、奇兵绕后大破侬智高，夜定惊营、论赏安众，后留邕更戍法、开归仁门、置博易务、赎还被掠子女
  phases:
  - key: brewing
    name: 集军宾州
    labels:
      zh: 聚兵
    start_date: '1052-11-01'
    highlight_event_id: guji-孙沔-event-beizhi
  - key: breakthrough
    name: 昆仑关出师
    labels:
      zh: 出奇
    start_date: '1053-01-20'
    highlight_event_id: guji-孙沔-event-kunlun
  - key: climax
    name: 归仁铺破贼
    labels:
      zh: 决战
    start_date: '1053-02-08'
    highlight_event_id: guji-孙沔-event-guiren
  - key: closure
    name: 抚定邕城
    labels:
      zh: 善后
    start_date: '1053-02-10'
    highlight_event_id: guji-孙沔-event-shanhou
  decisions:
  - date: '1052-11-15'
    title_zh: 多备长刀大斧以制蛮牌捻枪
    rationale: 贼长技为牌蔽身、枪夹杀如堵，弓矢莫加，须以重刃斫牌方能破阵
  - date: '1052-12-15'
    title_zh: 献三策而自请密输计于狄青
    rationale: 料贼必出下计与我战，军中不可有二令，己为副当身下主帅以全大局
  - date: '1053-02-08'
    title_zh: 申明队伍、夜呼者斩
    rationale: 行军前后不属、夜惊易溃，下严令止喧哗，遂使贼空壁遁而我军不动
  - date: '1053-03-01'
    title_zh: 请一年更戍、开归仁门、约赎鬻券
    rationale: 旧戍三年瘴死七八，改番休一年以乐戍；开北门向阙示归怀；一年折券赎还因贼被卖子女以安民
events:
- id: guji-孙沔-event-birth
  title_zh: 出生
  date: '0996-01-01'
  year_of: 0996
  place_zh: 会稽
  description_zh: 生于北宋初，字元忠，后谥威敏
- id: guji-孙沔-event-audience
  title_zh: 枢密直学士陛见论岭贼
  date: '1052-08-15'
  year_of: 1052
  place_zh: 京师
  description_zh: 自徐州徙帅秦道谒仁宗，驳广东使鲍轲衰息之奏，陈贼据刘王山、得广州亿万之财、众万余不可轻视，得授江南西路荆湖南路安抚使
- id: guji-孙沔-event-xusheng
  title_zh: 虚声飞报荆湖安定人心
  date: '1052-09-01'
  year_of: 1052
  place_zh: 荆湖南北
  description_zh: 未行先传檄言大兵即至，令多建营垒、盛储赏犒，人心稍定，侬智高不敢过岭北犯
- id: guji-孙沔-event-beizhi
  title_zh: 集军宾州备破牌之器
  date: '1052-11-15'
  year_of: 1052
  place_zh: 宾州
  description_zh: 集军得钱帛百万，察蛮牌捻枪之长，多备长刀大斧，又备燥湿瘴疠之具以待狄青
- id: guji-孙沔-event-huidi
  title_zh: 长沙候狄青献三策
  date: '1052-12-20'
  year_of: 1052
  place_zh: 长沙
  description_zh: 留长沙一月待狄青宣抚至，与议料贼上中下三策，断其必出战，自请密输计而军无二令，狄大喜
- id: guji-孙沔-event-kunlun
  title_zh: 大军出昆仑关
  date: '1053-01-20'
  year_of: 1053
  place_zh: 昆仑关
  description_zh: 与狄青合军四万人出关，行三日部曲不属，申命队伍以备卒遇贼
- id: guji-孙沔-event-guiren
  title_zh: 归仁铺大破侬智高
  date: '1053-02-08'
  year_of: 1053
  place_zh: 归仁铺
  description_zh: 遇贼于归仁铺，以左右翼孙节祝贵及三百奇兵绕后，用刀斧斫牌枪，杀伤数千，贼遁保邕城；夜下令敢呼叫者斩，贼闻惊呼以为大军至遂空壁去
- id: guji-孙沔-event-shanhou
  title_zh: 留邕善后更戍抚民
  date: '1053-03-10'
  year_of: 1053
  place_zh: 邕州
  description_zh: 狄青先还，留邕计事，改三年一戍为一年番休，新开归仁门向阙，置博易务通诸蛮，约一年折券赎还因贼卖为奴婢之男女，所全活数十百千人；后加秩擢枢密副使
- id: guji-孙沔-event-death
  title_zh: 逝世
  date: '1066-04-01'
  year_of: 1066
  place_zh: 杭州
  description_zh: 治平三年卒于杭，赠太尉，谥威敏，后人录其征南事为孙威敏征南录
