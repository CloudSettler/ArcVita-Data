  date: 0996
  year_of: 0996
  precision: year
  is_circa: false
  place_zh: 会稽
  description_zh: 孙沔字元规，会稽人，后徙越州，宋太宗至道二年生
- id: guji-孙沔-event-105208-gengchen
  title_zh: 八月庚辰对仁宗驳衰息议
  date: '1052-08-15'
  year_of: '1052'
  precision: month
  is_circa: false
  place_zh: 京师
  description_zh: 徐州徙帅秦陛辞，仁宗以广东使者鲍轲奏贼衰息，孙沔力陈贼破邕至广得舶货亿万、聚万余人未尝败，非衰息也
  endeavor_ref: guji-孙沔-endeavor-1
- id: guji-孙沔-event-105209-anfu
  title_zh: 除江南西路荆湖南路安抚使
  date: '1052-09-05'
  year_of: '1052'
  precision: month
  is_circa: false
  place_zh: 京师
  description_zh: 翌日闻张忠蒋偕败于白田，上留议，戊子再对请得宣抚便宜及马万人等，虽屡沮仅得人马军七百人、文臣四人，遂兼广南东西路安抚使南行
  endeavor_ref: guji-孙沔-endeavor-1
- id: guji-孙沔-event-105209-bingxiang
  title_zh: 虚声安荆湖遣李定守宾象
  date: '1052-09-20'
  year_of: '1052'
  precision: month
  is_circa: false
  place_zh: 荆湖南北道宾州如和关
  description_zh: 先为虚声飞报荆湖广建营垒，又遣裨将李定七父子屯宾象，戒妄战，桂帅使之出战不听，贼至引去，宾象得完而陈崇义他军果败
  endeavor_ref: guji-孙沔-endeavor-1
- id: guji-孙沔-event-105211-chubei
  title_zh: 集百万缗制刀斧备瘴具
  date: '1052-11-15'
  year_of: '1052'
  precision: month
  is_circa: false
  place_zh: 长沙桂象间
  description_zh: 十一月集军费钱帛百万，针对蛮牌捻枪多备长刀大斧，又备燥湿瘴疠之具百计以待狄青大军
  endeavor_ref: guji-孙沔-endeavor-1
- id: guji-孙沔-event-105212-huiyi
  title_zh: 与狄青长沙会议料敌三计
  date: '1052-12-20'
  year_of: '1052'
  precision: month
  is_circa: false
  place_zh: 长沙
  description_zh: 狄青为宣抚使过岭南来，孙沔以三防料贼必出下计与我战，约遇事密输计于狄而军中无二令，狄大喜听之
  endeavor_ref: guji-孙沔-endeavor-2
- id: guji-孙沔-event-105301-kunlun
  title_zh: 出昆仑关整饬行伍
  date: '1053-01-25'
  year_of: '1053'
  precision: month
  is_circa: false
  place_zh: 昆仑关朝天驿
  description_zh: 明年正月大军及辎重四万人出昆仑关，行三日部曲不属，孙沔申命诸校各有队伍，为翌日归仁之战定纪律
  endeavor_ref: guji-孙沔-endeavor-2
- id: guji-孙沔-event-105302-guirenpu
  title_zh: 归仁铺破侬智高
  date: '1053-02-08'
  year_of: '1053'
  precision: day
  is_circa: false
  place_zh: 归仁铺
  description_zh: 遇贼于归仁铺，偏将孙节争地形小衄死，祝贵军复振，以刀斧斫牌响震山谷，三百奇兵出山背突后，前军乘之杀伤数千，贼遁保邕城遂空壁夜遁
  endeavor_ref: guji-孙沔-endeavor-2
- id: guji-孙沔-event-105302-yongzhou
  title_zh: 邕州定赏活胁从更戍筑门
  date: '1053-02-15'
  year_of: '1053'
  precision: month
  is_circa: false
  place_zh: 邕州
  description_zh: 入邕议赏以安忷忷众心，治附贼者主张先诘送廷下乃可杀，全活数千人；改三岁一易为一年番休，新作北门号归仁门示归阙，又表置博易务通诸蛮
  endeavor_ref: guji-孙沔-endeavor-2
- id: guji-孙沔-event-death
  title_zh: 孙沔卒
  date: '1066'
  year_of: '1066'
  precision: year
  is_circa: false
  place_zh: 开封
  description_zh: 治平三年卒，谥章敏一作宣懿，历官枢密直学士至枢密副使，有古名臣之风
