person:
  qid: guji-孙沔
  name_zh: 孙沔
  names:
    zh: 孙沔
    en: Sun Mian
  lifespan:
    birth:
      date: 0996
      precision: year
      is_circa: false
      raw: 宋太宗至道二年
    death:
      date: '1066'
      precision: year
      is_circa: false
      raw: 宋英宗治平三年
  birth_date: 0996
  death_date: '1066'
  era: 北宋
  reign_ref: 宋仁宗皇祐
  archetype: 经略安抚·谦让功臣
  dilemmas:
  - 朝议以贼衰息欲示镇静无备，我坚持有备而后能静，冒沮议而力求应副
  - 文臣与武帅并重，欲成大功须身下狄青、密输计而让美名，功名与济事何择
  - 贼势方盛而官军屡败，急躁邀功必败，持重虚声、储备待时何安人心边圉
  lesson: 有备方能镇静，协和方能破强，破敌在器利计密，安民在活胁从、恤戍卒、通有无
  summary_first_person: 吾本徐秦帅臣，皇祐四年闻侬智高破邕围广、非衰息也，面奏仁宗请自将；朝议沮我马兵宣抚之请，犹以七百人先行，虚声振荆湖以遏贼逾岭；既与狄青会，长沙定三计，密以谋输青而军无二令；昆仑归仁以刀斧破蛮牌、奇兵绕后而大溃贼众；克邕之后不尽诛胁从，更戍筑归仁门，愿功成致仕而已
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%BE%81%E5%8D%97%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%BE%81%E5%8D%97%E5%BD%95.md
  - https://ctext.org/library.pl?if=gb&file=289770
endeavors:
- id: guji-孙沔-endeavor-1
  title_zh: 请缨南征与筹备待时
  summary_zh: 皇祐四年秋闻广源蛮破邕围广，孙沔于京师驳衰息之报，力请南行并求宣抚便宜与马兵金帛；虽屡为执政所沮，仅得四穷州之应，仍先声安荆湖、遣李定守宾象不与战、集百万缗帛、制刀斧备瘴具以制蛮牌
  phases:
  - key: brewing
    name: 京师驳议请行
    labels:
      zh: 驳议
    start_date: '1052-08-01'
    highlight_event_id: guji-孙沔-event-105208-gengchen
  - key: breakthrough
    name: 力争宣抚便宜
    labels:
      zh: 争备
    start_date: '1052-09-01'
    highlight_event_id: guji-孙沔-event-105209-anfu
  - key: climax
    name: 荆湖宾象经营
    labels:
      zh: 经营
    start_date: '1052-09-15'
    highlight_event_id: guji-孙沔-event-105209-bingxiang
  - key: closure
    name: 储饷制器待狄
    labels:
      zh: 储待
    start_date: '1052-11-01'
    highlight_event_id: guji-孙沔-event-105211-chubei
  decisions:
  - date: '1052-08-01'
    title_zh: 面斥衰息奏以实告
    rationale: 鲍轲报贼衰息，实则贼据刘王山取广舶亿万之货、众逾万人，必以有备示静而非无备示静，故力陈于仁宗前
  - date: '1052-09-01'
    title_zh: 坚乞宣抚使与马兵金帛
    rationale: 南贼去朝远，无素具必败；非宣抚不能调四路，非马不能追击，故虽执政屡沮仍以致仕为请而求独断
  - date: '1052-09-15'
    title_zh: 遣李定守宾象戒勿妄战
    rationale: 恐桂帅贪功使偏师轻出致败，预戒妄出斩一家，坚守如和关遂保宾象不失
- id: guji-孙沔-endeavor-2
  title_zh: 会狄破贼与邕后善政
  summary_zh: 十二月会狄青于长沙，以三计料贼必出下计战，约密输计而让军令归一；明年正月整饬行伍出昆仑，经归仁铺以刀斧破牌、奇兵突后大破智高；遂入邕州定赏罚、活胁从数千、更三岁一戍为一年番休、筑归仁门示归阙之意
  phases:
  - key: brewing
    name: 长沙会议定计
    labels:
      zh: 定计
    start_date: '1052-12-01'
    highlight_event_id: guji-孙沔-event-105212-huiyi
  - key: breakthrough
    name: 昆仑整军而进
    labels:
      zh: 整军
    start_date: '1053-01-15'
    highlight_event_id: guji-孙沔-event-105301-kunlun
  - key: climax
    name: 归仁铺破牌
    labels:
      zh: 破敌
    start_date: '1053-02-01'
    highlight_event_id: guji-孙沔-event-105302-guirenpu
  - key: closure
    name: 邕州善后安戍
    labels:
      zh: 善后
    start_date: '1053-02-10'
    highlight_event_id: guji-孙沔-event-105302-yongzhou
  decisions:
  - date: '1052-12-01'
    title_zh: 身下狄青密输计
    rationale: 欲军中无二令，凡处置皆令称孙密学擘画而由狄行之，二公心和乃能诛狂寇
  - date: '1053-02-01'
    title_zh: 以刀斧制蛮牌遣奇兵绕后
    rationale: 贼长技为牌捻枪如堵，弓矢莫加，故备长刀大斧斫牌，以三百骑出山背突后，前后夹击而溃之
  - date: '1053-02-10'
    title_zh: 不尽诛胁从更戍法
    rationale: 附贼者多胁从，若尽诛则失人心，宜先诘送廷下乃可杀；旧戍三岁瘴死七八，改为择善地番休一年，人人乐戍
events:
- id: guji-孙沔-event-birth
