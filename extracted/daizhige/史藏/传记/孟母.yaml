  decisions:
  - date: 约-366
    title_zh: 一迁：去墓傍之舍
    rationale: 筑埋踊跃之嬉非吾子所宜，居处之渐不可不慎。
  - date: 约-364
    title_zh: 二迁：去市傍之舍
    rationale: 市贾炫卖近于趋利，恐子习染商贾之气。
  - date: 约-362
    title_zh: 三迁：定居学宫之傍
    rationale: 俎豆揖让进退之仪正可以居吾子，遂不复迁。
  - date: 约-355
    title_zh: 断织警学
    rationale: 子之废学若断斯织，中道而废则不免厮役、离于祸患，示之为学贵恒。
- id: guji-mengmu-end-2
  person: guji-mengmu
  name_zh: 以礼持家·佐子行道
  domain: 家礼与母仪
  phases:
