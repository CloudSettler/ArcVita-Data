      - 母仪垂范
    start_date: 约-317
    highlight_event_id: guji-mengmu-event-death
  decisions:
  - date: 约-344
    title_zh: 谕礼留妇
    rationale: 将入门问孰存、上堂声必扬、入户视必下；子不察于礼而责礼于人，不可遣妇。
  - date: 约-320
    title_zh: 放子行义
    rationale: 妇人有三从，少从父母、嫁从夫、夫死从子；子行乎子义，吾行乎吾礼。
