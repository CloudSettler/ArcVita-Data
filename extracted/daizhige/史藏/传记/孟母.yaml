person:
  qid: guji-mengmu
  name_zh: 孟母
  names:
    zh: 孟母（邹孟轲之母）
    en: Mother of Mencius
  lifespan:
    birth:
      date: 约-400
      precision: 世纪
      is_circa: true
      raw: 史无明文，据孟子生年（约前372）上推约三十年
    death:
      date: 约-317
      precision: 年代
      is_circa: true
      raw: 卒于孟子游齐之际，孟子自齐扶柩归鲁
  birth_date: 约-400
  death_date: 约-317
  era: 战国
  reign_ref: 约当鲁穆公、齐威王至齐宣王之世
  archetype: 贤母·教子垂范
  dilemmas:
  - 择邻与安土：三迁耗财劳力，仍坚持为子择善渐之境
  - 恒心与生计：断机示警，宁失一织不使子废学
  - 礼法与人情：子责妇失礼，她反以礼正子而留妇，全姑妇之恩
  - 母道与子志：道不用于齐而母老，自任三从之礼，放子行义
  lesson: 环境渐染重于耳提面命，为学贵有恒；母之明礼与适时放手，方能成全子女之德。
  summary_first_person: 我乃邹人孟轲之母，世称孟母。为使吾子免于墓间、市井之习，我三迁其舍，定居学宫之傍；见其学有所怠，断机以警，责其废学如断织。其后以礼谕子，留妇全家；孟子游齐而道不行，我以三从之礼自任，许其行义。孟子终成大儒，为当世冠，此吾母道之所毕。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%88%97%E5%A5%B3%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%88%97%E5%A5%B3%E4%BC%A0.md
  - https://zh.wikisource.org/wiki/%E5%88%97%E5%A5%B3%E5%82%B3
  - https://ctext.org/lie-nv-zhuan
