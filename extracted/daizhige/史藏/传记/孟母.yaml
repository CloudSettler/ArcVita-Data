  era: 战国
  reign_ref: 约周安王至周赧王之世
  archetype: 贤母师表
  dilemmas:
  - 断机严教恐伤爱子之心，纵之则恐其废学沦为厮役
  - 子欲去齐行义而母已老，三从之礼与成人之义两难
  lesson: 择邻渐化、断织喻学，母教之要在防微杜渐与当机立断
  summary_first_person: 吾乃邹人孟轲之母，号孟母。为子三迁其居，自墓间徙市傍，终居学宫之侧；子废学则以刀断织，喻学不可中废；子责妇则引入门问存、上堂扬声、入户下视之礼以教之；老而居齐，申三从之义，勉子行乎其义。卒使孟轲成天下之名儒，后世列为母仪之范。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8F%A4%E5%88%97%E5%A5%B3%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8F%A4%E5%88%97%E5%A5%B3%E4%BC%A0.md
endeavors:
- id: guji-mengmu-endeavor-1
  title_zh: 教子成儒
  description: 以居处渐染与断机励学之教，育孟轲成天下名儒。
  phases:
  - key: brewing
    name: 三迁择邻
    labels:
      zh: 三迁择邻
    start_date: '-365'
    highlight_event_id: guji-mengmu-event-sanqian
  - key: breakthrough
    name: 断机励学
    labels:
      zh: 断机励学
    start_date: '-350'
    highlight_event_id: guji-mengmu-event-duanji
  - key: climax
    name: 勉子行义
    labels:
      zh: 勉子行义
    start_date: '-316'
    highlight_event_id: guji-mengmu-event-mianzi
  - key: closure
    name: 子成名儒
    labels:
      zh: 子成名儒
    start_date: '-300'
  decisions:
  - date: '-365'
    title_zh: 三迁定居学宫之侧
    rationale: 近墓则子习筑埋之事，近市则子习衒卖之言，唯学宫之侧使子设俎豆、习揖让进退，故三迁以渐化其习。
  - date: '-350'
    title_zh: 断织示警
    rationale: 子学无所进而自若，则以刀断织，喻中道废学如断其织，终不免厮役祸患，激其旦夕勤学、师事子思。
  - date: '-316'
    title_zh: 勉子去齐行义
    rationale: 子忧道不行于齐、欲行而念母老，吾申三从之义而自安于礼，令其无牵于私、专行其义。
- id: guji-mengmu-endeavor-2
  title_zh: 明礼齐家
  description: 以礼法持家，训子留妇，为母仪姑道之则。
  phases:
  - key: brewing
    name: 躬修妇仪
    labels:
      zh: 躬修妇仪
    start_date: '-355'
  - key: breakthrough
    name: 训礼留妇
    labels:
      zh: 训礼留妇
    start_date: '-345'
    highlight_event_id: guji-mengmu-event-liufu
  - key: climax
    name: 别男女之礼
    labels:
      zh: 别男女之礼
    start_date: '-320'
  - key: closure
    name: 垂为母仪
    labels:
      zh: 垂为母仪
    start_date: '-300'
  decisions:
  - date: '-345'
    title_zh: 引礼留其妇
    rationale: 子不察于礼而责礼于人，几出其妇；引将入门问孰存、将上堂声必扬、将入户视必下之礼教子，遂留妇而全家。
events:
- id: guji-mengmu-event-birth
  date: '-400'
  precision: year
  is_circa: true
  year_of: -400
  title_zh: 孟母约生
  description: 邹人，孟轲之母，生年史无明文，约当战国中期。
  source_ref: 古列女传·卷一之十一·邹孟轲母
- id: guji-mengmu-event-sanqian
  date: '-365'
  precision: year
  is_circa: true
  year_of: -365
  title_zh: 孟母三迁
  description: 其舍近墓，孟子嬉为墓间筑埋之事；徙市傍，复为贾人衒卖之戏；再徙学宫之傍，孟子乃设俎豆、习揖让进退，孟母遂定居焉。
  endeavor_id: guji-mengmu-endeavor-1
  source_ref: 古列女传·卷一之十一·邹孟轲母
- id: guji-mengmu-event-duanji
  date: '-350'
  precision: year
  is_circa: true
  year_of: -350
  title_zh: 断机教子
  description: 孟子学而归，问所学自若，孟母方绩，以刀断其织，喻废学如断织、终不免厮役祸患；孟子惧，旦夕勤学不息，师事子思，遂成天下名儒。
  endeavor_id: guji-mengmu-endeavor-1
  source_ref: 古列女传·卷一之十一·邹孟轲母
- id: guji-mengmu-event-liufu
  date: '-345'
  precision: year
  is_circa: true
  year_of: -345
  title_zh: 训礼留妇
  description: 孟子见妇袒而在内，不悦遂去不入，妇辞而求归；孟母召孟子教之曰：将入门问孰存，将上堂声必扬，将入户视必下，责其不察于礼而责礼于人；孟子谢，遂留其妇。
  endeavor_id: guji-mengmu-endeavor-2
  source_ref: 古列女传·卷一之十一·邹孟轲母
- id: guji-mengmu-event-mianzi
  date: '-316'
  precision: year
  is_circa: true
  year_of: -316
  title_zh: 齐地勉子行义
  description: 孟子处齐，忧道不得用而欲行，以母老为念；孟母申妇人三从之义，曰：今子成人也，而我老矣。子行乎子义，吾行乎吾礼。遂解其忧，成其去就之节。
  endeavor_id: guji-mengmu-endeavor-1
  source_ref: 古列女传·卷一之十一·邹孟轲母
- id: guji-mengmu-event-death
  date: '-300'
  precision: year
  is_circa: true
  year_of: -300
  title_zh: 孟母约卒
  description: 卒年不详，孟子游齐时尚健在，约卒于此后，教子之事后世传为母仪典范。
  source_ref: 古列女传·卷一之十一·邹孟轲母
