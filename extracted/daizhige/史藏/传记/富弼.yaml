events:
- id: guji-yanzhu-event-birth
  date: 0991
  year_of: 0991
  title_zh: 晏殊生于抚州临川
  summary: 世籍临川，七岁知学问，乡里号为神童；早岁未详
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-shentong
  date: 1004
  year_of: 1004
  title_zh: 十四岁以神童廷试，赐同进士出身
  summary: 真宗召见，千余人廷中，晏殊神气不动，操笔立成；其后又自陈赋题尝私习，以诚见重
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-donggong
  date: 1017
  year_of: 1017
  title_zh: 以太子舍人等官辅翼皇太子，得方寸小纸密书咨访，参预机密
  summary: 真宗每所咨访多以小纸细书问之，凡所对必以其藁进示，不泄机密
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-chuilian
  date: 1022
  year_of: 1022
  title_zh: 干兴元年建言垂帘听政之制
  summary: 真宗遗诏太后权听军国事，晏殊建言群臣奏事太后垂帘听之，皆毋得独见，议遂定
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-xingxue
  date: 1028
  year_of: 1028
  title_zh: 罢南京留守，大兴学校以教诸生
  summary: 忤太后坐笏击仆误折齿罢留守南京，大兴学校；自五代以来天下学废，兴自公始
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-xiangwei
  date: 1043-03
  year_of: 1043
  title_zh: 庆历三年三月以刑部尚书居相位
  summary: 充集贤殿大学士兼枢密使；请罢监军、不以阵图授诸将、制财用出入之要，悉见施行；进用范仲淹、韩琦、富弼
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-wenzhang
  date: 1017
  year_of: 1017
  title_zh: 登馆阁掌书命，文章为天下所宗
  summary: 奉敕修士训及真宗实录，集古今文章为集选二百卷，有文集二百四十卷
  participants:
  - guji-yanzhu
- id: guji-yanzhu-event-death
  date: 1055-02
  year_of: 1055
  title_zh: 薨于京师，赠司空兼侍中，谥元献
  summary: 至和二年正月丁亥病笃薨；天子震悼，特辍视朝二日，以子承裕为崇文院检讨，季葬许州阳翟县
  participants:
  - guji-yanzhu
