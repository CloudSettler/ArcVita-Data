  reign_ref: 清·天聪/崇德/顺治/康熙
  archetype: 藩镇降将
  dilemmas:
  - 旧明边将降清后世代镇守一方，恭顺与实力之间的平衡难保
  - 三藩之乱中身处叛乱诸藩之间，忠于朝廷则父子嫌隙，附逆则身败名裂
  lesson: 久镇之权终为主上所忌；晚节守忠未必能保全家族之安。
  summary_first_person: 我尚可喜，本明朝辽东边将，后归附本朝，以战功封平南王，镇守广东。康熙十三年三藩乱起，耿精忠据福建叛应吴三桂，我奉上命发兵援救漳州，始终未从叛逆。然我子尚之信乘势夺权从我反侧，我忧愤而终。
  source_urls:
  - https://zh.wikisource.org/wiki/清史列傳
