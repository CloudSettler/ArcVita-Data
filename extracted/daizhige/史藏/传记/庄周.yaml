    start_date: -0295
    highlight_event_id: guji-庄周-event-author
  decisions:
  - date: -0318
    title_zh: 辞楚威王千金聘相愿曳尾泥中
    rationale: 庙堂牺牲虽荣不如泥中曳尾之乐，不以爵禄易真性
  - date: -0295
    title_zh: 著内外篇明道不求显达
    rationale: 以文载道，养生全真，贫而乐道胜于富而累形
