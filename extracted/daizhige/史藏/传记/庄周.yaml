    title_zh: 以鲋鱼之喻拒监河侯三百金
    rationale: 斗升之水可活，夸许难济急，耻因贫而受侈诺以全贫士之操
- id: guji-庄周-endeavor-2
  title_zh: 隐居著书辞聘不仕
  description: 隐于漆园，辞诸侯之聘，著内外篇阐逍遥齐物之道，终身不仕
