  summary_first_person: 吾庄周宋之蒙人也，家贫往贷粟于监河侯，耻受三百金之夸许，以鲋鱼斗升之喻明志，愿为泥中曳尾之龟不为庙堂之牺，隐于漆园著内外篇以明逍遥齐物之道，终身不仕而全其真。
