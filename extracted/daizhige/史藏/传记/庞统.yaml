  name_zh: 庞统
  names:
    zh: 庞统
    en: Pang Tong
  lifespan:
    birth:
      date: 0179
      precision: year
      is_circa: true
      raw: 汉光和二年左右生于襄阳
    death:
      date: '0214'
      precision: year
      is_circa: false
      raw: 建安十九年围雒县中矢卒年三十六
  birth_date: 0179
  death_date: '0214'
  era: 东汉末三国
  reign_ref: 汉献帝建安
  archetype: 军师谋臣
  dilemmas:
  - 欲兴风俗而美谈过实，名声与实才何以平衡
  - 伐国为乐与仁者不为，霸业与仁义何以两全
  lesson: 拔十得五犹可崇教，然过誉失实终误大事，谋国当以攻心为上、务实为本
  summary_first_person: 余襄阳庞士元，少蒙德公见重，水镜一言遂得凤雏之号，先主定荆始以耒阳令试之，虽免官而得鲁肃一荐为治中，劝主西取益州，涪会直谏见怒，雒城进围中矢而殒，未竟经略，唯负知人之叹
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/襄阳耆旧记.md
  - https://daizhige.org/史藏/传记/襄阳耆旧记.html
  - https://ctext.org/library.pl?if=gb&file=94849&by_title=%E8%A5%84%E9%98%B3%E8%80%86%E6%97%A7%E8%AE%B0&page=1
endeavors:
- id: guji-庞统-endeavor-1
  title_zh: 凤雏得名扬于荆州
  description: 依德公门下受知，借司马德操品题而成南州冠冕，为刘备所访用
  phases:
  - key: brewing
    name: 德公器重少未知名
    labels:
      zh: 师承
    start_date: 0179
    highlight_event_id: guji-庞统-event-birth
  - key: breakthrough
    name: 年十八谒水镜彻夜品题
    labels:
      zh: 品题
    start_date: 0197
    highlight_event_id: guji-庞统-event-shuijing
  - key: climax
    name: 先主访世事得荐卧龙凤雏
    labels:
      zh: 荐举
    start_date: 0208
    highlight_event_id: guji-庞统-event-tuijian
  - key: closure
    name: 并用为军师中郎将
    labels:
      zh: 入幕
    start_date: '0210'
    highlight_event_id: guji-庞统-event-rumu
  decisions:
  - date: 0197
    title_zh: 奉德公命往谒司马德操自昼达夜
    rationale: 欲借水镜清鉴印证德公知人之明，以一夕深谈破少无识者之疑而显名
  - date: 0208
    title_zh: 许人以美谈过其实以劝世励志
    rationale: 世乱道颓善少恶多，欲以美谈长道业使有志者自励，虽拔十失五犹得其半
- id: guji-庞统-endeavor-2
  title_zh: 佐刘备取蜀殒于雒城
  description: 由耒阳不治见免，经鲁肃荐举复起，劝先主入益州，涪会争谏，雒城攻战中矢而卒
  phases:
  - key: brewing
    name: 守耒阳令在县不治见免
    labels:
      zh: 试吏
    start_date: '0210'
    highlight_event_id: guji-庞统-event-leiyang
  - key: breakthrough
    name: 鲁肃遗书称非百里才复用为治中
    labels:
      zh: 复起
    start_date: '0211'
    highlight_event_id: guji-庞统-event-lusu
  - key: climax
    name: 劝先主入益州涪会以乐为谏
    labels:
      zh: 劝进
    start_date: '0212'
    highlight_event_id: guji-庞统-event-fuhui
  - key: closure
    name: 进围雒县中矢而卒
    labels:
      zh: 殒命
    start_date: '0214'
    highlight_event_id: guji-庞统-event-death
  decisions:
  - date: '0211'
    title_zh: 受鲁肃荐为治中从事展骥足
    rationale: 耒阳百里非所展，欲得治中别驾之任方尽其才，故受荐而就先主
  - date: '0212'
    title_zh: 劝先主西入益州并于涪会直谏伐国为乐非仁
    rationale: 料益州可取以成霸业，然伐人之国以为乐非仁者所为，欲正君以仁义
events:
- id: guji-庞统-event-birth
  title_zh: 生于襄阳庞德公从子
  date: 0179
  precision: year
  is_circa: true
  raw: 汉光和二年左右
  description: 襄阳庞氏子弟，德公从子，少未有识者惟德公重之
  year_of: 0179
- id: guji-庞统-event-shuijing
  title_zh: 年十八谒司马德操自昼达夜
  date: 0197
  precision: year
  is_circa: true
  raw: 年十八时
  description: 奉德公命谒司马德操，与语自昼达夜，德操叹曰德公诚知人此实盛德必南州冠冕由是显名
  year_of: 0197
- id: guji-庞统-event-tuijian
  title_zh: 德操荐卧龙凤雏于先主
  date: 0208
  precision: year
  is_circa: true
  raw: 建安十三年前后先主访世事于德操时
  description: 先主访世事于司马德操，德操曰识时务者在乎俊杰此间有卧龙凤雏谓诸葛孔明与庞士元也
  year_of: 0208
- id: guji-庞统-event-rumu
  title_zh: 并用为军师中郎将
  date: '0210'
  precision: year
  is_circa: true
  raw: 赤壁后先主领荆州时
  description: 先主后并用诸葛亮与庞统为军师中郎将，统每称咏多过其才以励风俗
  year_of: '0210'
- id: guji-庞统-event-leiyang
  title_zh: 以从事守耒阳令在县不治免官
  date: '0210'
  precision: year
  is_circa: true
  raw: 先主领荆州时
  description: 以从事守耒阳令在县不治遂免官，时论犹未尽其用
  year_of: '0210'
- id: guji-庞统-event-lusu
  title_zh: 鲁肃遗书荐为治中从事
  date: '0211'
  precision: year
  is_circa: true
  raw: 建安十六年前后
  description: 吴将鲁肃遗先主书曰庞士元非百里才使处治中别驾之任始当展其骥足，先主大器之以为治中从事
  year_of: '0211'
- id: guji-庞统-event-fuhui
  title_zh: 劝入益州涪会直谏
  date: '0213'
  precision: year
  is_circa: true
  raw: 建安十八年先主向成都于涪大会时
  description: 劝先主入益州所向辄中，于涪大会先主曰今日之会可为乐矣统曰伐人之国而以为乐非仁者所为先主醉怒以武王伐纣前歌后舞为对
  year_of: '0213'
- id: guji-庞统-event-death
  title_zh: 进围雒县中矢卒年三十六
  date: '0214'
  precision: year
  is_circa: false
  raw: 建安十九年
  description: 进围雒县统率众攻城为流矢所中所卒时年三十六，先主痛惜之
  year_of: '0214'
