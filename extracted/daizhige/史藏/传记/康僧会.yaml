  name_zh: 康僧会
  names:
    zh: 康僧会
    en: Kang Senghui
  lifespan:
    birth:
      date: 0193
      precision: year
      is_circa: true
      raw: 约汉末三国初交趾年十余岁二亲并终
    death:
      date: 0280-09
      precision: month
      is_circa: false
      raw: 晋武帝太康元年九月
  birth_date: 0193
  death_date: 0280-09
  era: 三国·吴
  reign_ref: 吴赤乌十年至晋太康元年
  archetype: 弘法译经高僧
  dilemmas:
  - 初至江左疑为矫异如何取信帝王使大法得立
  - 淫祠盛行君主昏暴如何以近事劝化而不伤正理
  lesson: 至诚可感神明法化贵在随根不滞玄谈
  summary_first_person: 吾先世康居世居天竺父贾交趾吾少孤出家厉行好学杖锡东游以吴赤乌十年达建邺舍利感应而建初寺兴遂使江左大法遂行虽逢孙皓昏暴犹以报应之说开其心译经注疏冀弘大道
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/高僧传.md
  - https://zh.wikisource.org/wiki/梁高僧傳
  - https://daizhige.org/史藏/传记/高僧传.html
endeavors:
- id: guji-康僧会-endeavor-1
  title_zh: 江左弘法感舍利建初寺
  description: 欲使道振江左兴立图寺以舍利神验取信吴主孙权遂建建初寺为江左佛寺之始
  phases:
  - key: brewing
    name: 杖锡东游
    labels:
