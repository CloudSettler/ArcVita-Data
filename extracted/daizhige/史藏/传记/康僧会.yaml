    labels:
      zh: 高峰
    start_date: '0255'
    highlight_event_id: guji-康僧会-event-yijing
  - key: closure
    name: 塔毁重修像传不绝
    labels:
      zh: 遗泽
    start_date: '0300'
    highlight_event_id: guji-康僧会-event-death
  decisions:
  - date: '0250'
    title_zh: 译小品六度集杂譬喻等妙得经体
    rationale: 辞旨文雅不加华饰务使圣义允正便于江左诵习
  - date: '0255'
    title_zh: 注安般法镜道树并制经序
    rationale: 以禅数之学导初机以序文明宗趣使义旨微密可传
events:
- id: guji-康僧会-event-birth
  title_zh: 生于交趾少孤出家
  date: 0193
  year_of: 0193
  description: 先康居人世居天竺父因商贾移交趾会年十余岁二亲并终至孝服毕出家励行甚峻明解三藏博览六经
- id: guji-康僧会-event-jiangye
  title_zh: 杖锡东游初达建邺
  date: '0247'
  year_of: '0247'
  description: 吴赤乌十年初达建邺营立茅茨设像行道有司以容服非恒奏检孙权召诘灵验
- id: guji-康僧会-event-qili
  title_zh: 洁斋祈请感得舍利
  date: '0247'
  year_of: '0247'
  description: 共洁斋静室以铜瓶加几烧香礼请三七日暮五更瓶中枪然有声果获舍利五色光炎照耀瓶上权试以火烧杵击皆不能损
- id: guji-康僧会-event-jianchu
  title_zh: 孙权建建初寺
  date: '0247'
  year_of: '0247'
  description: 权大叹服即为建塔以始有佛寺故号建初寺因名其地为佛陀里由是江左大法遂兴
- id: guji-康僧会-event-hao
  title_zh: 孙皓时对辩护法并受戒
  date: 0268
  year_of: 0268
  description: 皓欲毁佛寺遣张昱诘会会对辩纵横昱不能屈皓迎会问善恶报应会陈积善余庆之说皓悟迎像悔过受五戒于会所疾瘳
- id: guji-康僧会-event-yijing
  title_zh: 建初寺译经注经
  date: '0255'
  year_of: '0255'
  description: 于建初寺译出阿难念弥镜面王梵皇经小品六度集杂譬喻等又注安般守意法镜道树三经并制经序传泥洹呗声清靡哀亮
- id: guji-康僧会-event-death
  title_zh: 示寂太康元年
  date: 0280-09
  year_of: 0280
  description: 吴天纪四年四月皓降晋九月会遘疾而终是岁晋武太康元年也至成帝咸和中苏峻焚塔何充更修赵诱见光生信
