    start_date: '0247'
    highlight_event_id: guji-康僧会-event-qili
  - key: climax
    name: 舍利放光建寺
    labels:
      zh: 高潮
    start_date: '0247'
    highlight_event_id: guji-康僧会-event-jianchu
  - key: closure
    name: 皓朝护法
    labels:
      zh: 收束
    start_date: 0268
    highlight_event_id: guji-康僧会-event-hao
  decisions:
  - date: '0247'
    title_zh: 请期七七日洁斋祈舍利
    rationale: 法之兴废在此一举不以王刑为惧以誓死至诚感通为验
  - date: 0268
    title_zh: 对张昱及孙皓略说报应不陈玄妙
    rationale: 皓性凶粗不及妙义唯叙善恶近事以开其心
- id: guji-康僧会-endeavor-2
  title_zh: 译经注疏制呗传法
  description: 于建初寺译出小品六度集等并注安般守意等经制泥洹呗声为一代模式
  phases:
  - key: brewing
    name: 博览三藏
    labels:
      zh: 积学
    start_date: '0240'
    highlight_event_id: guji-康僧会-event-jiangye
  - key: breakthrough
    name: 建初译经
    labels:
      zh: 开译
    start_date: '0250'
    highlight_event_id: guji-康僧会-event-yijing
  - key: climax
