  decisions:
  - date: 1743-12-01
    title_zh: 命满洲大学士会同福敏徐元梦详查姓氏归顺情由
    rationale: 八旗姓氏众多向无汇载难于稽考，若不征载籍稽图谱则世德无征，故专任大臣纂成卷帙以备久远
  - date: 1745-01-05
    title_zh: 亲制序文定谱牒之义非炫博闻
    rationale: 周官定系世汉律定姓名，谱牒本以联涣维漓，恐后人以族望相高作膏梁阀阅，故明言敦朴旧俗以劝忠实勤劳
- id: guji-弘历-endeavor-2
  title_zh: 继祖休养煦植以成盛世
  goal_zh: 承累朝休养煦植之泽，抚绥辽燕八旗万姓使永世滋大
