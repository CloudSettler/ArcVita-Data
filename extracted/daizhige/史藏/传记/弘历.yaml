  dilemmas:
  - 族姓日繁生聚蕃衍，如何明章统系使后人知世德所自而不忘祖勤
  - 谱牒之学易流为炫博附会，如何以敦朴为本戒膏梁阀阅之尚而归于笃忠勤
  lesson: 木有根而枝附水有源而流出，谱牒所以联涣维漓，嗣守者当率祖攸行世笃忠贞以无忝厥绪
  summary_first_person: 朕缵承祖宗天命，念熊罴旧臣龙凤从附者百五六十年蕃衍万亿，恐代远族繁不识所自，特发金匮石室稽图谱考归顺，命儒臣分地系名厘然成帙，亲制序文以示非炫阀阅而在率祖考攸行，冀食旧德者永念忠勤以昭前烈
