    highlight_event_id: guji-弘历-event-preface
  - key: closure
    name: 蕃衍永固
    labels:
      zh: 收束
    start_date: 1750-01-01
    highlight_event_id: guji-弘历-event-governance
  decisions:
  - date: 1736-02-01
    title_zh: 申休养之政重农桑宽赋役
    rationale: 辽左燕畿旗民生聚已久，若不继修令绪则德泽不延，故以煦植鞠保为先使时万时亿
  - date: 1744-12-08
    title_zh: 定世职汉名改正并存档册为凭
    rationale: 精骑尼哈番等旧译参差易致沿误，且谱牒仅略书梗概，必以部档为据方不执谱为讼
