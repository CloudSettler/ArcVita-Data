endeavors:
- id: guji-徐孚远-endeavor-1
  title_zh: 几社结社与古文复兴
  summary_zh: 崇祯初与夏允彝周立勋彭宾陈子龙杜麟征共倡几社，取知几其神之义，与复社对峙，主简严，月课举业古文，刊几社会义及壬申文选诸刻，领袖云间文坛，培植后进百人
  phases:
  - key: brewing
    name: 家学砥砺
    labels:
      zh: 沈敏力学
    start_date: 1605
    highlight_event_id: guji-徐孚远-event-birth
  - key: breakthrough
    name: 几社创立
    labels:
      zh: 六子会义
    start_date: 1629
    highlight_event_id: guji-徐孚远-event-jishe
  - key: climax
    name: 文选盛行
    labels:
      zh: 古学复兴
    start_date: 1632
    highlight_event_id: guji-徐孚远-event-nanyuan
  - key: closure
    name: 南园讲艺
    labels:
      zh: 月旦宗师
    start_date: 1635
    highlight_event_id: guji-徐孚远-event-nanyuan
  decisions:
  - date: 1629
    title_zh: 共倡几社自立名义
    rationale: 不欲并称复社以避朋党广大利名之嫌，取友会文，尽其实而寓知几之义，主简严以图尺寸进取
  - date: 1632
    title_zh: 主持月课评阅后进
    rationale: 以古今业为标准，仿昭明文选体裁课艺百人，培养华亭子弟，为古文一脉立宗师
- id: guji-徐孚远-endeavor-2
  title_zh: 鼎革全节与海上避地
  summary_zh: 明亡后矢志不事二姓，入海依海上抗清势力，遍历钦州越南毗连及崇明舟山厦门诸海道，晚岁遁居广东饶平山中，全发以终，蔬果之名与伯夷陶潜并垂
  phases:
  - key: brewing
    name: 孤忠自誓
    labels:
      zh: 百折不回
    start_date: 1644
    highlight_event_id: guji-徐孚远-event-righteous
  - key: breakthrough
    name: 入海周历
    labels:
      zh: 戈船往来
    start_date: 1645
    highlight_event_id: guji-徐孚远-event-righteous
  - key: climax
    name: 潮海遁居
    labels:
      zh: 钦越程途
    start_date: 1650
    highlight_event_id: guji-徐孚远-event-exile
  - key: closure
    name: 全发以终
    labels:
      zh: 饶平蔬果
    start_date: 1660
    highlight_event_id: guji-徐孚远-event-death
  decisions:
  - date: 1645
    title_zh: 拒薙发入海从郑氏
    rationale: 以孤忠亮节光耀汗青，不仕清朝，通权达变如郑成功吴六奇之伦而守纯忠之本，图存明祀
  - date: 1653
    title_zh: 定居饶平不返华亭
    rationale: 远避薙发之令，遁居潮海山中，耕读授徒，保发全节，使西薇东菊同垂芬于天壤
events:
- id: guji-徐孚远-event-birth
  date: 1599-11-25
  year_of: 1599
  title_zh: 生于华亭南门内河曲
  description: 明万历二十七年己亥十一月二十五日生于江南华亭，名孚远字闇公，晚号复斋，世家华亭小蒸，曾祖徐陟官至南刑部右侍郎
  location: 江南华亭南门
- id: guji-徐孚远-event-jishe
  date: 1629
  year_of: 1629
  title_zh: 与夏允彝等倡立几社
  description: 崇祯二年己巳与夏允彝杜麟征周立勋彭宾陈子龙倡为几社，有六子会义之刻，与张溥张采复社对峙，主简严，立约月课，自陈慨然流涕言百折不回死而后已
  location: 华亭云间
- id: guji-徐孚远-event-nanyuan
  date: 1635
  year_of: 1635
  title_zh: 读书南园倡古文奇逸
  description: 崇祯八年乙亥春与陈子龙读书陆氏南园，创为时艺闳肆奇逸，一时靡然向风，并主持几社月课为后进宗师，刊壬申文选及六子诗三百六十首
  location: 华亭陆氏南园
- id: guji-徐孚远-event-righteous
  date: 1645
  year_of: 1645
  title_zh: 明亡入海坚持抗清
  description: 甲申鼎革后不薙发不仕清，入海历崇明舟山厦门诸海道及钦州越南毗连之境，与何腾蛟瞿式耜陈子龙等同守纯忠，亦通权达变周旋海上
  location: 东南沿海
- id: guji-徐孚远-event-exile
  date: 1655
  year_of: 1655
  title_zh: 晚岁遁居潮海饶平
  description: 晚岁遁居广东潮州府饶平山中，课徒著述，植蔬果自给，全发以终，其地蔬果遂以闇公得名，卓然与首阳西薇栗里东菊并垂
  location: 广东饶平
- id: guji-徐孚远-event-death
  date: 1665
  year_of: 1665
  title_zh: 卒于饶平
  description: 清康熙四年五月卒于饶平寓居，享年六十七，孤忠亮节光耀汗青，后人刊钓璜堂集以传
  location: 广东饶平
