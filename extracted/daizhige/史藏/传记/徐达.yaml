  decisions:
  - date: '1355'
    title_zh: 以身为人质，换回太祖
    rationale: 太祖为孙德崖军所执，郭子兴方系德崖，达以身易太祖归，由是宠信日隆
  - date: '1367'
    title_zh: 围姑苏筑长围、架木塔置炮
    rationale: 诸门分军筑长围困城，架木塔与城中浮屠等，置襄阳炮所击辄破，城中大震，卒擒张士诚
- id: guji-徐达-endeavor-2
  name: 北伐中原与镇守北平
  phases:
  - key: brewing
