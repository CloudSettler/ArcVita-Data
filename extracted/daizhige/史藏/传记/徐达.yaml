    highlight_event_id: guji-徐达-event-1368-克元都
  - key: climax
    name: 夜袭太原、平定关陇
    labels:
      zh: 批亢捣虚、临洮之议
    start_date: '1368'
    highlight_event_id: guji-徐达-event-1368-太原夜袭
  - key: closure
    name: 改封魏国公，岁镇北平
    labels:
      zh: 功第一、镇北平
    start_date: '1370'
    highlight_event_id: guji-徐达-event-1370-封魏国公
  decisions:
  - date: '1368'
    title_zh: 批亢捣虚，直趋太原
    rationale: 库库特穆尔出雁门远攻北平，太原必空虚；乘其不备直捣巢穴，彼进不得战、退无所依，兵法所谓批亢捣虚
  - date: '1369'
    title_zh: 力主先取临洮
    rationale: 诸将欲先取庆阳，达以庆阳城险兵悍未易猝拔；临洮西通番夷北界河湟，得人足备战、得地足共军储，临洮既克旁郡自下
events:
- id: guji-徐达-event-birth
  type: birth
  date: 约1332
  year_of: 1332
  title_zh: 徐达生于濠州
  description: 濠州人，生年传文未载，约当元至正初（约1332）。
- id: guji-徐达-event-1353-归附
  type: military
  date: '1353'
  year_of: 1353
  title_zh: 与太祖同隶滁阳王，授镇抚
  description: 元至正癸巳，郭子兴据濠州，达与太祖高皇帝以兵属焉；达委心事太祖，勇略冠军，位诸将上，授镇抚。
  raw_date: 元至正十三年（癸巳）
- id: guji-徐达-event-1355-易主
  type: military
  date: '1355'
  year_of: 1355
  title_zh: 身为人质换回太祖，渡江克采石
  description: 太祖为孙德崖军所执，达以身易太祖归，由是宠信日隆；同年从渡江下采石、太平。
  raw_date: 元至正十五年（乙未）
- id: guji-徐达-event-1356-拜大将军
  type: military
  date: '1356'
  year_of: 1356
  title_zh: 从入建康拜大将军，克京口
  description: 从入建康拜大将军，浮江而下大破元军，克京口，授镇江翼元帅府统军大元帅。
  raw_date: 元至正十六年（丙申）
- id: guji-徐达-event-1360-池州设伏
  type: military
  date: '1360'
  year_of: 1360
  title_zh: 池州设伏破陈友谅
  description: 陈友谅寇池州，达设伏大破之；同年张士诚陷宜兴，达攻复之。
  raw_date: 元至正二十年（庚子）
- id: guji-徐达-event-1363-鄱阳湖
  type: military
  date: '1363'
  year_of: 1363
  title_zh: 鄱阳湖之战先驱陷阵
  description: 友谅复寇豫章，太祖督诸将征之，师次彭蠡湖；达先驱陷阵，俘其军，友谅军夺气，我军乘胜鏖战，竟殱友谅。
  raw_date: 元至正二十三年（癸卯）
- id: guji-徐达-event-1365-拜将伐吴
  type: military
  date: '1365'
  year_of: 1365
  title_zh: 拜大将军伐张士诚
  description: 太祖下令伐张士诚，拜达为大将军、常遇春为副，帅师东下，大破士诚军，下吴兴、湖州，进围姑苏。
  raw_date: 元至正二十五年（乙巳）
- id: guji-徐达-event-1367-擒张士诚
  type: military
  date: '1367'
  year_of: 1367
  title_zh: 姑苏城破，擒张士诚
  description: 筑长围困姑苏，架木塔与城中浮屠等，置襄阳炮所击辄破；城破擒张士诚送建康，得兵二十五万。
  raw_date: 元至正二十七年（丁未）
- id: guji-徐达-event-1367-封信国公
  type: political
  date: '1367'
  year_of: 1367
  title_zh: 师还封信国公
  description: 平吴师还，封信国公，赏赐冠诸将。
  raw_date: 元至正二十七年（丁未）
- id: guji-徐达-event-1367-北征拜将
  type: military
  date: '1367'
  year_of: 1367
  title_zh: 拜北征大将军，出师伐中原
  description: 拜北征大将军遂伐中原；太祖谕诸将，能持重有纪律、战胜攻取得将体者莫如大将军达，宜专主中军；进取沂州、益都、兖州、济南。
  raw_date: 元至正二十七年（丁未）冬
- id: guji-徐达-event-1368-克元都
  type: military
  date: '1368'
  year_of: 1368
  title_zh: 克复元都
  description: 洪武元年进右丞相；由临清趋德州、直沽，水陆并进克通州；元顺帝及后妃走漠北，遂入元都，封府库图籍宝物，禁士卒侵暴，分徇保定、真定诸郡。
  raw_date: 明洪武元年（戊申）
- id: guji-徐达-event-1368-太原夜袭
  type: military
  date: '1368'
  year_of: 1368
  title_zh: 批亢捣虚，夜袭太原破库库特穆尔
  description: 库库特穆尔出雁门攻北平，达乘其太原空虚引兵径趋之；敌还军自救，达选精兵夜袭其营，库库遁去，遂克太原，得兵马甚众。
  raw_date: 明洪武元年冬（约1368）
- id: guji-徐达-event-1369-临洮之议
  type: military
  date: '1369'
  year_of: 1369
  title_zh: 力主先取临洮，平定关陇
  description: 议师所向，诸将主先取庆阳，达以庆阳城险兵悍未易猝拔，力主先克临洮；遣冯宗异征临洮，李思齐不战出降，寻拔庆阳，尽定陕西。
  raw_date: 明洪武二年（1369）
- id: guji-徐达-event-1370-封魏国公
  type: political
  date: '1370'
  year_of: 1370
  title_zh: 破王保保于定西，改封魏国公
  description: 破王巴拜军于定西，西平吐蕃；是冬大封功臣，达功第一，授太傅、中书右丞相，改封魏国公，赐诰命铁劵，赐第京师大功坊。
  raw_date: 明洪武三年（1370）
- id: guji-徐达-event-1384-召还
  type: political
  date: '1384'
  year_of: 1384
  title_zh: 太阴数犯上将，召还京师
  description: 达久镇北平，十七年太阴数犯上将，太祖心恶之，召达还京师。
  raw_date: 明洪武十七年（1384）
- id: guji-徐达-event-death
  type: death
  date: '1385'
  year_of: 1385
  title_zh: 薨，追封中山王，谥武宁
  description: 明年薨，追封中山王，谥武宁，赐塟钟山之阴；太祖亲为制神道碑文，命配享太庙，塑像功臣庙位皆第一。
  raw_date: 明洪武十八年（1385）
