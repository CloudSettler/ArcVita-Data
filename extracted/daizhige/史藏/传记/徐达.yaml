  decisions:
  - date: '1368-03-01'
    title_zh: 所过安民辑兵守御足食不扰
    rationale: 北伐非徒克城当以安民为本所得壮士即帅而徂征规画守御足食使兵不扰民则中原自定
  - date: '1368-07-01'
    title_zh: 遣冯胜拔潼关据关而守分兵北下河内
    rationale: 潼关为关陕咽喉拔之则可据关守险分道由邺下趋赵州抵临清直捣燕都使元无险可守
