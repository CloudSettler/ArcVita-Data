    rationale: 新附二万叛入城四面营垒溃其三独固守南面拒敌以待开平自外来援内外夹攻可破张氏援兵
  - date: '1366-11-01'
    title_zh: 皁林生擒六万不杀尽遣赴京
    rationale: 张氏以重兵聚吴兴若屠戮则人心不附尽俘不杀可瓦解吴军而收其众为己用彰我不屠之令
