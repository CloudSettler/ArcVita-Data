person:
  qid: guji-徐达
  name_zh: 徐达
  names:
    zh: 徐达
    en: Xu Da
  lifespan:
    birth:
      date: 约1332
      precision: year
      is_circa: true
      raw: 传文未载，约1332年生（濠州人）
    death:
      date: '1385'
      precision: year
      is_circa: false
      raw: 明洪武十八年（1385）
  birth_date: 约1332
  death_date: '1385'
  era: 元末明初
  reign_ref: 元至正（1353—1367）、明洪武（1368—1385）
  archetype: 开国第一名将，功高不矜的儒帅
  dilemmas:
  - 君命与专断：军中诸事悉禀命而行，抑或临机便宜行事，得太祖「将在外君不御乃古道」之勅，始专断军事
  - 功高震主：位冠诸将、平中原功居第一，惟恪遵法守、不自矜伐，以保善终而世享爵号
  lesson: 将才遇明主，功成而不居、恪守法度，方能位冠元臣、世代享爵。
  summary_first_person: 我徐达，濠州人，至正十三年与太祖同隶滁阳王郭子兴麾下，委心事之；渡江克采石、下建康，西破陈友谅、东擒张士诚，复以北征大将军伐中原、克复元都；洪武三年大封功臣，我功居第一，进封魏国公，寻岁镇北平。我不自矜伐，恪遵法守，薨后追封中山王，谥武宁，配享太庙。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%BB%8A%E7%8C%AE%E5%A4%87%E9%81%97.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%BB%8A%E7%8C%AE%E5%A4%87%E9%81%97.html
