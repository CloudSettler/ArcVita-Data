  dilemmas:
  - 攻城克敌时当屠城立威还是秋毫无犯以收人心
  - 功高位极时当居功自矜还是谦退不伐以保始终
  - 北定中原时当急进追虏还是安民足食以固根本
  lesson: 言简虑精令出不二攻城不屠与人不戏财色不动乃可统大军成大功而全始终
  summary_first_person: 余凤阳农家子年二十二从太祖于濠梁周旋二载即命为帅首代主为质渡江定采石镇溧水克镇江围毗陵独守南垒破张士诚援兵生擒张九六后克常州宁国池州诸郡率二十余万鏖战皁林生擒六万不戮一人围克姑苏平浙西洪武元年拜征北大将军率二十五万北定齐鲁下汴洛拔潼关八月三日入元都西定晋冀收秦陇封魏国公后镇燕藩十七年太阴犯上将召还明年薨于第年五十有四太祖亲制神道碑以彰功烈
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/明名臣琬琰录.md
  - https://daizhige.org/史藏/传记/明名臣琬琰录.html
