  lesson: 以年为经以人为纬，纵经横纬职志在存信史以昭忠义，史笔与臣节合一
  summary_first_person: 吾徐鼒字舜邻号星伯浙江德清人，道光庚戌充实录馆纂修官，恭读列圣实录遵纯庙分注明福王年号撮叙唐桂本末之谕为小腆纪年二十卷，更采旧闻以人纬事草创小腆纪传六十五卷纪七列传五十八，东南寇盗起初捍桑梓继守福建福宁登陴尽瘁，弥留命子弟编定遗稿，半生精力尽付二书冀存南明兴亡之真
  source_urls:
