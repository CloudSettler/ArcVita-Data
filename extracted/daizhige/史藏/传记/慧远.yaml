person:
  qid: guji-慧远
  name_zh: 慧远
  names:
    zh: 慧远（远公）
    en: Huiyuan
  lifespan:
    birth:
      date: 约334
      precision: year
      is_circa: true
      raw: 以义熙十二年（416）卒、年八十三逆推
    death:
