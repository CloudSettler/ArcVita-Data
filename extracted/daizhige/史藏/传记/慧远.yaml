      precision: day
      is_circa: true
      raw: 义熙十二年（416年）八月初六
  birth_date: 约334
  death_date: 416-09-12
  era: 东晋
  reign_ref: 晋孝武帝太元（376—396）、晋安帝义熙（405—418）
  archetype: 净土宗初祖·庐山高僧
  dilemmas:
  - 沙门应否致敬王者——桓玄复申礼敬沙门之议，力主「袈裟非朝宗之服、钵盂非廊庙之器」，著《沙门不敬王者论》五篇以明僧格
  - 乱世求道之抉择——年二十一欲渡江从范宁问学而值石虎暴死、南路梗塞，遂舍世学投释道安出家，以身许佛
  - 经律残缺与求法之难——江东经卷未备、禅法无闻、律藏多阙，遣弟子远越葱岭冒死求取梵本
  lesson: 心不逐境、道不媚权；以念佛一门之愿摄毕生之行，则乱世与荣宠皆不能夺其志。
  summary_first_person: 我本雁门楼烦贾氏子，少习六经庄老，年二十一闻《般若》豁然开悟，遂与弟慧持投道安师受业。襄阳兵乱，分张徒属，我南适荆州、止于上明寺。太元六年入庐山结庵龙泉，桓伊为建东林，我居山三十年，迹不入俗；率十八贤暨百二十三人建斋立誓，同修净土。遣法净、法领西越葱岭求取梵本，请提婆重译《阿毗昙心论》，与罗什通好、请出《十诵律》；著《法性论》《沙门不敬王者论》以明至极之理与僧格。义熙十二年七晦定起见佛，自知七日后当生安养，遂制遗诫、露骸松林，顺寂于东林。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%9C%E6%9E%97%E5%8D%81%E5%85%AB%E9%AB%98%E8%B4%A4%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%9C%E6%9E%97%E5%8D%81%E5%85%AB%E9%AB%98%E8%B4%A4%E4%BC%A0.md
endeavors:
