  decisions:
  - date: 约381
    title_zh: 入庐山结庵龙泉
    rationale: 见庐山间旷可以息心，遂立精舍；以去水远举杖扣地祈泉，清流涌出，因名龙泉精舍。
  - date: '386'
    title_zh: 应请建东林道场
    rationale: 学侣寝众，慧永请刺史桓伊为建刹，神运殿成，以居西林之东故号东林，自此不他往。
  - date: 约402
    title_zh: 结社立誓同修净土
    rationale: 率十八贤暨百二十三人造西方三圣像、建斋立誓，令刘遗民著发愿文，专志安养之业。
- id: guji-慧远-endeavor-2
  name_zh: 弘法译经·护教著述
  summary_zh: 求经译论、通好什师、抗礼王者，以译业与著述立江东法幢、明出家僧格。
  phases:
  - key: brewing
    name_zh: 随师南游·分张徒属
