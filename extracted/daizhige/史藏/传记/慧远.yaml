  - key: breakthrough
    name_zh: 遣使西行·重译经论
    labels:
      zh: 求法译经
    start_date: 约390
    highlight_event_id: guji-慧远-event-seek-scriptures
  - key: climax
    name_zh: 通好罗什·著论抗礼
    labels:
      zh: 护教明道
    start_date: 约402
    highlight_event_id: guji-慧远-event-sandalu-treatise
  - key: closure
    name_zh: 临终遗诫·遗德流布
    labels:
      zh: 遗德传世
    start_date: '416'
    highlight_event_id: guji-慧远-event-final-testament
  decisions:
  - date: 约390
    title_zh: 遣法净、法领远越葱岭求经
    rationale: 以江东经卷未备、禅法无闻、律藏多阙，故命弟子西行，旷岁来还皆获梵本。
  - date: 约402
    title_zh: 遣书通好鸠摩罗什
    rationale: 闻罗什入关即遣书通好，什答书称其善弘其道；又著《法性论》，什叹其未见经而暗与理合。
  - date: 约403
    title_zh: 答桓玄书，著《沙门不敬王者论》
    rationale: 袈裟非朝宗之服，尘外之客不应致敬王者；著论五篇，明泥洹不变、形尽神不灭之义。
events:
- id: guji-慧远-event-birth
  type: birth
  date: 约334
  year_of: 334
  is_circa: true
  title_zh: 生于雁门楼烦
  description_zh: 姓贾氏，幼而好学；年十三随舅令狐氏游学许洛，博综六经，尤善庄老。
  place_zh: 雁门楼烦（今山西原平一带）
- id: guji-慧远-event-ordination
  type: milestone
  date: 约354
  year_of: 354
  is_circa: true
  title_zh: 闻《般若》开悟，与慧持投道安受业
  description_zh: 年二十一欲度江从范宁学，值石虎暴死、南路梗塞；时释道安建刹太行常山，闻安师讲《般若经》豁然开悟，叹九流异议皆糠秕，遂与母弟慧持投簪受业。二十四岁引庄子之说释实相之惑，安师许令不废外典。
  place_zh: 太行恒山
  endeavor_id: guji-慧远-endeavor-1
- id: guji-慧远-event-xiangyang-split
  type: milestone
  date: 约379
  year_of: 379
  is_circa: true
  title_zh: 随道安南游襄阳，遇秦寇分张徒属
  description_zh: 随安师南游襄阳，值秦将符丕为寇，安公分张徒属；师独不闻一言而跪请，安师慰之。乃与弟子数十人南适荆州，居上明寺。
  place_zh: 襄阳、荆州上明寺
  endeavor_id: guji-慧远-endeavor-2
- id: guji-慧远-event-longquan
  type: endeavor
  date: '381'
  year_of: 381
  title_zh: 太元六年入庐山，立龙泉精舍
  description_zh: 至寻阳见庐山间旷可以息心，乃立精舍；以去水犹远举杖扣地曰若此可居当使朽壤抽泉，言毕清流涌出。寻阳亢旱，读《海龙王经》而神蛇出池、须臾大雨，岁竟有秋。
  place_zh: 庐山
  endeavor_id: guji-慧远-endeavor-1
- id: guji-慧远-event-donglin
  type: endeavor
  date: '386'
  year_of: 386
  title_zh: 桓伊为建东林寺，神运殿成
  description_zh: 慧永谓刺史桓伊「远公方富弘道，而贫道所栖隘不可处」；桓伊感山神之异与雷雨开林之瑞，为建刹，殿曰神运，以在永师舍东故号东林，时太元十一年。
  place_zh: 庐山
  endeavor_id: guji-慧远-endeavor-1
- id: guji-慧远-event-seek-scriptures
  type: endeavor
  date: 约390
  year_of: 390
  is_circa: true
  title_zh: 遣法净、法领远越葱岭求取梵本
  description_zh: 以大教流行江东而经卷未备、禅法无闻、律藏多阙，命弟子远越葱岭，旷岁来还，皆获梵本。
  place_zh: 庐山—葱岭
  endeavor_id: guji-慧远-endeavor-2
- id: guji-慧远-event-abhidharma
  type: endeavor
  date: 约391
  year_of: 391
  is_circa: true
  title_zh: 请僧伽提婆重译《阿毗昙心论》《三法度论》并制序
  description_zh: 昔道安在关中请昙摩难提出《阿毗昙心论》，以未善晋言颇多疑滞；僧伽提婆至，即请重译，二论乃兴，师制序以贻学者。
  place_zh: 庐山
  endeavor_id: guji-慧远-endeavor-2
- id: guji-慧远-event-lotus-society
  type: endeavor
  date: 约402
  year_of: 402
  is_circa: true
  title_zh: 结社立誓，同修净土
  description_zh: 与慧永、慧持、道生、昙顺、僧睿、刘程之、张野、周续之、张诠、宗炳、雷次宗等结社念佛，世号十八贤；复率众至百二十三人，造西方三圣像，建斋立誓，令刘遗民著发愿文，王乔之等为念佛三昧诗以见志。
  place_zh: 庐山东林寺
  endeavor_id: guji-慧远-endeavor-1
- id: guji-慧远-event-kaushika-letter
  type: endeavor
  date: 约402
  year_of: 402
  is_circa: true
  title_zh: 遣书通好鸠摩罗什，著《法性论》获叹赏
  description_zh: 闻鸠摩罗什入关遣书通好，什答书谓末代东方有护法菩萨、钦哉仁者善弘其道。以泥洹常住之义著《法性论》十四篇，什叹曰边方未见经便暗与理合；又应秦主之请，抄《大智度论》百卷之要为二十卷而为之序。
  place_zh: 庐山
  endeavor_id: guji-慧远-endeavor-2
- id: guji-慧远-event-sandalu-treatise
  type: endeavor
  date: 约403
  year_of: 403
  is_circa: true
  title_zh: 拒出虎溪，答桓玄书并著《沙门不敬王者论》
  description_zh: 桓玄征殷仲堪要师出虎溪，称疾不往；玄入山见师不觉屈膝，问难不敢发，劝令登仕而师正辞拒之。玄欲沙汰众僧、复申沙门应敬王者之议，师答书谓袈裟非朝宗之服，乃著《沙门不敬王者论》五篇，明求宗不顺化、形尽神不灭。及玄篡位，下书许道人勿复致礼。
  place_zh: 庐山
  endeavor_id: guji-慧远-endeavor-2
- id: guji-慧远-event-vinaya
  type: endeavor
  date: 约404
  year_of: 404
  is_circa: true
  title_zh: 遣昙邕请出《十诵律》，复请佛驮跋陀罗出禅数诸经
  description_zh: 昙摩流支入秦，遣弟子昙邕请于关中出《十诵律》，流传晋国；其后佛驮跋陀罗至，即请出禅数诸经，禅戒之典出自庐山几至百卷。
  place_zh: 庐山
  endeavor_id: guji-慧远-endeavor-2
- id: guji-慧远-event-final-testament
  type: milestone
  date: '416'
  year_of: 416
  title_zh: 般若台东龛定起见佛，制遗诫
  description_zh: 居山三十年，初十一年澄心系想、三睹圣相；后十九年七月晦夕于般若台东龛从定起，见阿弥陀佛身满虚空，告曰汝后七日当生我国，且见先逝诸贤在佛之侧前揖。遂制遗诫，命露骸松林之下、即岭为坟，无土木同状。
  place_zh: 庐山东林寺般若台
  endeavor_id: guji-慧远-endeavor-1
- id: guji-慧远-event-death
  type: death
  date: 416-09-12
  year_of: 416
  is_circa: true
  title_zh: 义熙十二年八月初六顺寂，累石为塔
  description_zh: 至期始顺寂，寿八十三；弟子不忍露尸，与寻阳太守阮侃奉全躯葬于西岭，累石为塔，谢灵运立碑以铭，宗炳复立碑寺门表德。唐宣宗追谥辩觉大师，南唐升元三年追谥正觉，宋太宗追谥圆悟大师。
  place_zh: 庐山东林寺西岭
  endeavor_id: guji-慧远-endeavor-1
