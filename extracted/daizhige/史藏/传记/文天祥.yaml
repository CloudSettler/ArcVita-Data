    title_zh: 散尽家赀起兵勤王
    rationale: 以臣子不息之心赴国难，知不可为而为之，欲以孤忠搘拄纲常
  - date: '1278-12-20'
    title_zh: 被执不降
    rationale: 宁死不事二姓，欲以一死证道，存三百年纲常于不坠
  - date: '1283-01-09'
    title_zh: 大都从容就义
    rationale: 以身殉道，正气长存，使后世睹姓名而凛然生敬
