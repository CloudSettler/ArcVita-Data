    rationale: 溯无极太极阴阳五行本体，主张以不息之心立体达用，回应理宗志勤道远之疑
  - date: '1256-05-24'
    title_zh: 不辞直言以求亲擢
    rationale: 宁以危微精一之论触忌，不为激泛，冀以正学感动上心而得行道之阶
