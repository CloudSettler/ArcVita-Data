  death_date: '1283-01-09'
  era: 南宋
  reign_ref: 宋理宗宝祐四年
  archetype: 忠烈状元
  dilemmas:
  - 道之迂远与功化迟速之间如何持守不息
  - 国祚倾覆之际当存身隐忍抑或以死明道
  - 施仁义与杂刑霸之间如何不改初心
  lesson: 道以不息为体，守之以诚，行之以久，虽无速效终成大化，虽处败局犹当以一心不息而证纲常
  summary_first_person: 吾庐陵文天祥也，宝祐四年以廷对策论不息之道蒙理宗亲擢第一，王应麟称吾忠肝如铁石；自此以不息自勉，历仕临安，国难至则散财勤王，转战颠沛，被执不屈，终于大都柴市以死殉道，以明此心之不息也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/宋宝祐四年登科录.md
  - https://daizhige.org/史藏/传记/宋宝祐四年登科录.html
