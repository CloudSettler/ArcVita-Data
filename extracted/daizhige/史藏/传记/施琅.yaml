person:
  qid: guji-shilang
  name_zh: 施琅
  names:
    zh: 施琅
    en: Shi Lang
  lifespan:
    birth:
      precision: unknown
      is_circa: false
    death:
      precision: unknown
      is_circa: false
  era: 清初（顺治—康熙年间）
  archetype: 海疆统帅·由降将复起而平台
  dilemmas:
  - 郑氏旧部身份与父弟之仇的忠义两难
  - 用兵主张屡遭廷议搁置（“风涛险、制胜难必”）、战略信任的等待与复起
  lesson: 忍辱蓄志、因地制宜（用南风、先取澎湖），终以一战定海疆
  summary_first_person: 我本郑成功部将，投诚之后父弟遇害；经黄梧举荐复起，以水师屡破郑军。康熙二十年再任水师提督，力主先取澎湖；二十二年六月澎湖一战焚沈敌舟、纳降万余，八月入台湾受郑克塽降，遂使台湾入版图、设府三县。
  source_urls:
  - 清史列传选（卷八十「逆臣传」相关）
endeavors:
- id: guji-shilang-endeavor-1
  name_zh: 由降将复起、剿抚海郑与平台定疆
  phases:
  - key: brewing
    name_zh: 投诚起复
