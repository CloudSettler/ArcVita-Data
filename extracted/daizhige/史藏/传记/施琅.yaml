    highlight_event_id: guji-shilang-event-fujiang
  - key: breakthrough
    name_zh: 攻取厦门金门铜山
    labels:
      zh: 破厦门·克金门·拔铜山
    start_date: 1663-10
    highlight_event_id: guji-shilang-event-kenmen
  - key: climax
    name_zh: 澎湖大捷·受降台湾
    labels:
      zh: 澎湖之战·入台受降
    start_date: 1683-06
    highlight_event_id: guji-shilang-event-penghu
  - key: closure
    name_zh: 台湾入版图
    labels:
