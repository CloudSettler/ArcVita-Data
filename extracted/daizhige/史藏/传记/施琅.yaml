    start_date: 1683-08
    highlight_event_id: guji-shilang-event-rutai
  decisions:
  - date: 1664
    title_zh: 密奏宜速击郑锦、勿使养痈
    rationale: 见郑锦与沿海民互市接济，虑坐大难制
  - date: 1681-05
    title_zh: 复任水师提督、力主进剿
    rationale: 郑氏内乱，机不可失
  - date: 1682
    title_zh: 请独任讨击、先取澎湖
    rationale: 不破澎湖，台湾断无取理；愿督臣留厦门济饷
  - date: 1683-06
    title_zh: 用南风、由铜山进兵
    rationale: 与姚启圣议不协，坚持以南潮乘风攻澎湖
- id: guji-shilang-endeavor-2
  name_zh: 屡遭搁置的取台方略与复起
  phases:
  - key: brewing
    name_zh: 召京陈取台状
    labels:
      zh: 陈台湾可取状
    start_date: 1667
    highlight_event_id: guji-shilang-event-chenzhuang
  - key: breakthrough
    name_zh: 特授靖海将军
    labels:
      zh: 谙海疆军务
    start_date: 1664-07
    highlight_event_id: guji-shilang-event-jinghai
  decisions:
  - date: 1667
    title_zh: 上台湾可取状
    rationale: 郑锦阴接济沿海，宜乘机平之；下部议以风涛险寝其事
events:
- id: guji-shilang-event-fujiang
  date: 1657-03
  year_of: 1657
  kind: career
  title_zh: 黄梧荐施琅，擢副将
  detail_zh: 黄梧知琅智勇，故荐之；琅初为郑成功部将，后投诚，父及弟侄均被杀。
- id: guji-shilang-event-guxiamen
  date: 1663-10
  year_of: 1663
  kind: battle
  title_zh: 大军克厦门，琅以水师会同荷兰众进击
- id: guji-shilang-event-kenmen
  date: 1663-10
  year_of: 1663
  kind: battle
  title_zh: 乘胜克金门及浯屿，斩千余级
- id: guji-shilang-event-batongshan
  date: 1664-03
  year_of: 1664
  kind: battle
  title_zh: 琅、梧先后以兵出八尺门，拔铜山焚之
- id: guji-shilang-event-jinghai
  date: 1664-07
  year_of: 1664
  kind: appointment
  title_zh: 特授靖海将军，命进击台湾；会阻风不得进
- id: guji-shilang-event-chenzhuang
  date: 1667
  year_of: 1667
  kind: memorial
  title_zh: 召来京，上台湾可取状；下部议，寝其事
- id: guji-shilang-event-futi
  date: 1681-05
  year_of: 1681
  kind: appointment
  title_zh: 郑锦病死，仍命琅为水师提督，同姚启圣克期进剿
- id: guji-shilang-event-duren
  date: 1682
  year_of: 1682
  kind: memorial
  title_zh: 请简水师二万、战舰三百独任讨击，先取澎湖；允之
- id: guji-shilang-event-penghu
  date: 1683-06
  year_of: 1683
  kind: battle
  title_zh: 澎湖大捷：大鸟船五十六分八队奋击，沈敌船二百，斩伪官三百余、兵万余；国轩窜去，余众悉降
- id: guji-shilang-event-rutai
  date: 1683-08
  year_of: 1683
  kind: milestone
  title_zh: 率大军入鹿耳门至台湾，郑克塽、刘国轩、冯锡范率伪文武官迎降；设府一曰台湾，县三曰台湾、凤山、诸罗
