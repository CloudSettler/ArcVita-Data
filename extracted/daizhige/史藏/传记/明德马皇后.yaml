person:
  qid: guji-mingde-ma-huanghou
  name_zh: 明德马皇后
  names:
    zh: 明德马皇后
    en: Empress Ma Mingde
  lifespan:
    birth:
      date: 约39
      precision: year
      is_circa: true
      raw: 后时年十岁干理家事，十三岁选入太子宫，逆推约生于建武年间
    death:
      date: 79-06
      precision: month
      is_circa: false
      raw: 建初四年六月崩，在位二十三年，年四十余，合葬显节陵
  birth_date: 约39
  death_date: 79-06
  era: 东汉
  reign_ref: 汉明帝、汉章帝（永平、建初年间）
  archetype: 贤后母仪（德教型）
  dilemmas:
  - 身为皇太后，封舅则袭西京外戚败亡之祸，不封则负亲恩，两难之间固守国体
  - 无子而奉命养育贾氏所生之肃宗，须劳悴过于所生以安宫闱
  - 侍执之际言及政事多所毗补，又不欲以家私干欲，进谏与守分之间自处
  lesson: 谦俭率下、抑损外戚，母仪天下者以身为度，不徇私恩方成德教
  summary_first_person: 我是明德马皇后，伏波将军马援之幼女。十岁干理家事，十三岁入太子宫，奉承阴后、礼则修备；奉命抚养肃宗，劳悴过于所生。永平三年正位中宫，愈自谦肃，常衣大练。及尊为皇太后，自撰起居注削去兄防参医药事，建初元年、二年两却封爵诸舅，又曾进言降宥楚狱系囚。建初四年诸舅受封而退位归第，是年六月崩，在位二十三年，年四十余，合葬显节陵。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8F%A4%E4%BB%8A%E5%88%97%E5%A5%B3%E4%BC%A0.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8F%A4%E4%BB%8A%E5%88%97%E5%A5%B3%E4%BC%A0.html
endeavors:
- id: guji-mingde-ma-huanghou-endeavor-1
  name_zh: 入宫正位·德冠后宫
  summary: 自东宫贵人至正位中宫，谦肃俭素，德冠后宫而及于临朝
  phases:
  - key: brewing
    name: 干理家事·入侍东宫
    labels:
      zh: 入宫
    start_date: 约52
    highlight_event_id: guji-mingde-ma-huanghou-event-enter-palace
  - key: breakthrough
    name: 正位中宫
    labels:
      zh: 册后
    start_date: 约60
    highlight_event_id: guji-mingde-ma-huanghou-event-become-empress
  - key: climax
    name: 尊为皇太后·临朝辅政
    labels:
      zh: 临朝
    start_date: 约75
    highlight_event_id: guji-mingde-ma-huanghou-event-become-dowager
  - key: closure
    name: 寝疾而崩
    labels:
      zh: 崩逝
    start_date: 79-06
    highlight_event_id: guji-mingde-ma-huanghou-event-death
  decisions:
  - date: 约60
    title_zh: 正位后身服大练、裙不加缘
    rationale: 此缯特宜染色故用之；朔望诸姬朝请望其袍疏粗反以为绮縠，六宫莫不叹息从化
  - date: 约70
    title_zh: 乘间进言，降宥楚狱系囚
    rationale: 楚狱连年不决、坐系者甚众，虑其多滥；帝感悟夜起彷徨，卒多有所降宥
- id: guji-mingde-ma-huanghou-endeavor-2
  name_zh: 抑损外戚·却封舅氏
  summary: 削私恩于起居注，两却诸舅封爵，既全亲恩又不使外戚预机权
  phases:
  - key: brewing
    name: 尽心抚育肃宗·荐达左右不私
    labels:
      zh: 治内
    start_date: 约57
    highlight_event_id: guji-mingde-ma-huanghou-event-adopt-heir
  - key: breakthrough
    name: 削兄参医药事于起居注
    labels:
      zh: 削录私恩
    start_date: 约75
    highlight_event_id: guji-mingde-ma-huanghou-event-cut-record
  - key: climax
    name: 建初年间两拒封爵诸舅
    labels:
      zh: 却封
    start_date: 76
    highlight_event_id: guji-mingde-ma-huanghou-event-refuse-enfeoff-1
  - key: closure
    name: 舅氏受封而退位归第
    labels:
      zh: 归第
    start_date: 79
    highlight_event_id: guji-mingde-ma-huanghou-event-uncles-retire
  decisions:
  - date: 约75
    title_zh: 削去兄防参医药事
    rationale: 不欲令后世闻先帝数亲后宫之家，故起居注不著
  - date: 76
    title_zh: 拒封爵诸舅
    rationale: 马氏无功于国、岂得与阴郭中兴之后等；富贵之家禄位重叠，犹再实之木其根必伤
  - date: 77
    title_zh: 大旱之岁复固拒封爵
    rationale: 引王氏五侯、田蚡窦婴倾覆之祸为鉴，遵先帝防慎舅氏之防；身服大练欲身率下
  - date: 79
    title_zh: 许封三舅而令退位归第
    rationale: 天下丰稔帝遂封廖防光为列侯；太后叹老志不从，廖等不得已受封爵而退位归第
events:
- id: guji-mingde-ma-huanghou-event-birth
  type: birth
  title_zh: 出生，为伏波将军马援幼女
  date: 约39
  year_of: 39
  is_circa: true
  description: 明德马皇后讳某，伏波将军援之小女也
- id: guji-mingde-ma-huanghou-event-household
  type: 家庭变故
  title_zh: 少丧父母，十岁干理家事
  date: 约49
  year_of: 49
  is_circa: true
  description: 母蔺夫人悲伤疾恍惚而亡；后年十岁，敕制僮御，内外谘禀，事同成人
- id: guji-mingde-ma-huanghou-event-enter-palace
  type: career
  title_zh: 选入太子宫
  date: 约52
  year_of: 52
  is_circa: true
  description: 时年十三，奉承阴后，傍接同列，礼则修备，遂见宠异常
- id: guji-mingde-ma-huanghou-event-adopt-heir
  type: career
  title_zh: 奉命养育皇子刘炟（后之肃宗）
  date: 约57
  year_of: 57
  is_circa: true
  description: 后无子，帝命养贾氏所生肃宗，谓人未必当自生子但患爱养不至；后尽心抚育，劳悴过于所生
- id: guji-mingde-ma-huanghou-event-noble
  type: career
  title_zh: 显宗即位，立为贵人
  date: 约57
  year_of: 57
  is_circa: true
  description: 显宗即位，以后为贵人，永平中见宠不衰，尝荐达左右以广皇嗣
- id: guji-mingde-ma-huanghou-event-become-empress
  type: career
  title_zh: 永平三年春，立为皇后
  date: 约60
  year_of: 60
  is_circa: true
  description: 有司奏立长秋宫，皇太后曰马贵人德冠后宫即其人也；遂正位宫闱，愈自谦肃，常衣大练
- id: guji-mingde-ma-huanghou-event-chu-prison
  type: career
  title_zh: 楚狱进言，多所降宥
  date: 约70
  year_of: 70
  is_circa: true
  description: 楚狱连年不决，囚相证引坐系者甚众；后虑其多滥，乘间恻然言之，帝感悟，卒多有所降宥
- id: guji-mingde-ma-huanghou-event-become-dowager
  type: career
  title_zh: 帝崩，尊为皇太后
  date: 约75
  year_of: 75
  is_circa: true
  description: 显宗崩，肃宗即位，尊后曰皇太后；诸贵人当徙居南宫，太后感析别之怀，各赐王赤绶、安车驷马
- id: guji-mingde-ma-huanghou-event-cut-record
  type: career
  title_zh: 自撰起居注，削去兄防参医药事
  date: 约75
  year_of: 75
  is_circa: true
  description: 帝请录黄门舅旦夕供养之勤劳，太后曰不欲令后世闻先帝数亲后宫之家，故不著
- id: guji-mingde-ma-huanghou-event-refuse-enfeoff-1
  type: career
  title_zh: 建初元年，拒封爵诸舅
  date: 76
  year_of: 76
  is_circa: false
  description: 建初元年欲封爵诸舅，太后不听；帝重请，太后以无功不得与阴郭中兴之后等报之
- id: guji-mingde-ma-huanghou-event-refuse-enfeoff-2
  type: career
  title_zh: 大旱之岁，复固拒封爵
  date: 77
  year_of: 77
  is_circa: false
  description: 明年夏大旱，言事者以为不封外戚之故；太后诏曰吾为天下母而身服大练欲身率下，重袭西京败亡之祸，固不许
- id: guji-mingde-ma-huanghou-event-uncles-retire
  type: career
  title_zh: 封三舅为列侯，退位归第
  date: 79
  year_of: 79
  is_circa: false
  description: 四年天下丰稔，帝遂封三舅廖防光为列侯；太后叹万年之日长恨矣，廖等不得已受封爵而退位归第
- id: guji-mingde-ma-huanghou-event-death
  type: death
  title_zh: 寝疾而崩，合葬显节陵
  date: 79-06
  year_of: 79
  is_circa: false
  description: 太后其年寝疾，不信巫祝小医，数敕绝祷祀，至六月崩，在位二十三年，年四十余，合葬显节陵
