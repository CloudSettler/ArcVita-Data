person:
  qid: guji-晏婴
  name_zh: 晏婴
  names:
    zh: 晏婴
    en: Yan Ying
  lifespan:
    birth:
      date: -0578
      precision: year
      is_circa: true
      raw: 约公元前578年
    death:
      date: '-0500'
      precision: year
      is_circa: true
      raw: 约公元前500年
  birth_date: -0578
  death_date: '-0500'
  era: 春秋
  reign_ref: 齐灵公、齐庄公、齐景公
  archetype: 贤相
  dilemmas:
  - 犯颜直谏或阿意曲从，忠君与保身如何两全
  - 辞让封邑甘守菲薄或接受厚赏惠及宗族如何取舍
  - 显言田氏将代齐而动君疑或默观其变而待天命如何处之
  lesson: 以忠信节俭事君，以礼义廉正安民，一心可以事百君，毋变尔俗，毋失尔行。
  summary_first_person: 吾晏婴，字平仲，齐之夷维人也。事灵、庄、景三君，居社稷之任，不敢以君之过为不谏，不以民之饥为不振。谏庄公之矜勇，救景公之奢僭，治阿而振贫，辞邑而尚俭；使楚不辱，使晋不隐，知齐德衰而田氏归民，唯守忠退不失行而已。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/晏子春秋集释.md
  - https://daizhige.org/史藏/传记/晏子春秋集释.html
  - https://ctext.org/library.pl?if=gb&res=262915
endeavors:
- id: guji-晏婴-endeavor-1
  title_zh: 谏上匡君与辅政治齐
  description: 历事三朝，以谲谏绳正君过，治阿显政，节欲中听，稳定齐国朝局。
  phases:
  - key: brewing
    name: 初仕与见庄公矜勇
    labels:
      zh: 初仕谏庄
    start_date: '-0565'
    highlight_event_id: guji-晏婴-event-jian-zhuang
  - key: breakthrough
    name: 崔杼之乱明社稷臣节
    labels:
      zh: 不死节
    start_date: -0548
    highlight_event_id: guji-晏婴-event-cui-luan
  - key: climax
    name: 相景公屡谏奢僭
    labels:
      zh: 相景屡谏
    start_date: '-0547'
    highlight_event_id: guji-晏婴-event-zhi-a
  - key: closure
    name: 辞邑尚俭以终
    labels:
      zh: 辞邑守俭
    start_date: '-0510'
    highlight_event_id: guji-晏婴-event-ci-yi
  decisions:
  - date: '-0550'
    title_zh: 谏庄公矜勇力不顾行义
    rationale: 勇力当以行礼义弭暴除乱，若徒尚勇力则国危家残，故必荐善引过以正君道
  - date: -0548
    title_zh: 崔庆劫盟不与而申社稷之义
    rationale: 劫盟非义，死节非忠，社稷臣当进不失忠退不失行，以存齐祀
  - date: '-0520'
    title_zh: 再治阿而显政辞平阴槁邑
    rationale: 治民在节欲爱民而非厚敛，辞封所以明廉政长久、绝君以利诱之端
- id: guji-晏婴-endeavor-2
  title_zh: 使不辱命与折冲尊俎
  description: 使晋、使鲁、使吴、使楚，观礼折谋，以辞令存齐，以先见预言田氏代齐。
  phases:
  - key: brewing
    name: 使晋论政与结好
    labels:
      zh: 使晋
    start_date: '-0545'
    highlight_event_id: guji-晏婴-event-shi-jin
  - key: breakthrough
    name: 使楚不辱橘化为枳
    labels:
      zh: 使楚
    start_date: -0538
    highlight_event_id: guji-晏婴-event-shi-chu
  - key: climax
    name: 使鲁吴论礼论治
    labels:
      zh: 使鲁吴
    start_date: '-0535'
    highlight_event_id: guji-晏婴-event-shi-wu
  - key: closure
    name: 对叔向言田氏代齐
    labels:
      zh: 预言代齐
    start_date: -0518
    highlight_event_id: guji-晏婴-event-yu-tian
  decisions:
  - date: -0538
    title_zh: 使楚入狗门与橘枳之对
    rationale: 使狗国者入狗门，使人国者入人门，因橘逾淮为枳以喻齐民善而入楚化为盗在于水土，折辱存尊
  - date: '-0535'
    title_zh: 对叔向言齐德衰民归田氏
    rationale: 公室奢僭失民，田氏厚施得民，民归有德，政将移家，当以民为本自守正行
  - date: '-0530'
    title_zh: 赠言曾子与解骖赎越石父
    rationale: 贤不可失，士当以信相知，赎贱隶显其贤亦所以养世君子之道
events:
- id: guji-晏婴-event-birth
  title_zh: 晏婴生于齐夷维
  date: -0578
  year_of: -578
  description: 晏婴生于齐国莱地夷维，世为齐卿，父晏弱为齐大夫。
- id: guji-晏婴-event-jian-zhuang
  title_zh: 谏庄公矜勇力不顾行义
  date: '-0550'
  year_of: -550
  description: 庄公奋勇力不顾行义，贵戚不荐善，逼迩不引过，晏婴进谏以夏推侈大戏、殷费仲恶来为鉴，言勇力当以行礼义。
- id: guji-晏婴-event-cui-luan
  title_zh: 崔杼弑庄公晏婴不与盟
  date: -0548
  year_of: -548
  description: 齐庄公为崔杼所弑，庆氏劫齐将军大夫盟，晏婴不与，申明社稷臣死生以义，崔庆畏其义而不敢害。
- id: guji-晏婴-event-shi-jin
  title_zh: 使晋对晋平公叔向论齐政
  date: '-0545'
  year_of: -545
  description: 使晋见晋平公、叔向，言齐德衰民归田氏，进不失忠退不失行，预见齐政将归田氏。
- id: guji-晏婴-event-shi-chu
  title_zh: 使楚不辱命橘化为枳
  date: -0538
  year_of: -538
  description: 使楚，楚王为小门欲辱之，晏婴称使狗国入狗门；又以橘生淮南为橘逾淮为枳对楚王指齐人为盗之辱，全节而归。
- id: guji-晏婴-event-zhi-a
  title_zh: 再治阿见信景公任以国政
  date: '-0525'
  year_of: -525
  description: 再治阿邑，务节俭爱民，上计景公迎贺而晏婴辞，景公遂任以国政，齐国以治。
- id: guji-晏婴-event-shi-wu
  title_zh: 使吴使鲁问答论礼
  date: '-0535'
  year_of: -535
  description: 使吴答吴王保威强之问以先民后身，使鲁见鲁昭公言化民为一心，仲尼称其知礼。
- id: guji-晏婴-event-ci-yi
  title_zh: 辞平阴槁邑与景公赐邑不受
  date: '-0512'
  year_of: -512
  description: 景公欲以平阴槁邑、千金之裘、更宅赐晏婴，晏婴以足欲则亡、近市得求、固辞不受，显廉政长久之节。
- id: guji-晏婴-event-yu-tian
  title_zh: 预言田氏将践有齐
  date: -0518
  year_of: -518
  description: 对景公及叔向言后世践有齐者田氏也，以田氏厚施而公室厚敛，民归田氏，终如其言。
- id: guji-晏婴-event-death
  title_zh: 晏婴卒景公驰往哭之
  date: '-0500'
  year_of: -500
  description: 晏婴病将死，命凿楹纳书示子壮，言毋变尔俗；卒后景公驰往哭哀，叹莫复陈吾过者。
