person:
  qid: guji-曹学佺
  name_zh: 曹学佺
  names:
    zh: 曹学佺
    en: Cao Xuequan
  lifespan:
    birth:
      date: 1574
      precision: year
      is_circa: true
      raw: 明万历二年约生，侯官人
    death:
      date: 1646-09-18
      precision: day
      is_circa: false
      raw: 隆武二年九月十八日缢于福州西峰里第，年七十四
  birth_date: 1574
  death_date: 1646-09-18
  era: 明末
  reign_ref: 万历
  archetype: 循吏儒宗与忠节殉国者
  dilemmas:
  - 行税赢羡抵坐税以纾民困，触怒贪吏侧目当否
  - 直书梃击本末著野史纪略，忤逆权阉当削籍毁版当否
  - 家居献海防九策与儒藏大业，仕隐之间何以经世
  - 隆武草创赞成水师北伐，明知不可为而捐饷力主当否
  lesson: 经世在勤民核实，著述在汇通儒藏，出处在守正不阿，存亡在舍生取义
  summary_first_person: 吾南人也，少对策以舟战论车战，遂为张位所奇。历户部、大理、蜀藩、桂藩，赈饥发帑、抵税除弊、修驿清钱，皆以实惠及民。野史直笔获谴，家居欲集儒藏以补二氏之缺。国变投池不死，及事隆武，参决庶务，纂修实录，捐万金以图水师。城陷之明日，沐浴整冠，从容就缢，留句生前一管笔、死后一条绳而已。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/福建通志列传选.md
  - https://daizhige.org/史藏/传记/福建通志列传选.html
  - https://ctext.org/library.pl?if=gb&file=208440
endeavors:
- id: guji-曹学佺-endeavor-1
  title_zh: 蜀桂循吏与赈济经世
  summary: 历户部、四川、广西，以便宜转饷、赈饥、厘税、清钱局、治猺獞与海防议，践行经世致用
  phases:
  - key: brewing
    name: 策对舟战初入户部
    labels:
      zh: 乙未进士
    start_date: 1595
    highlight_event_id: guji-曹学佺-event-1595-jinshi
  - key: breakthrough
    name: 蜀参政赈荒理税
    labels:
      zh: 蜀道赈饥
    start_date: 1610
    highlight_event_id: guji-曹学佺-event-1611-zhenji
  - key: climax
    name: 桂藩厘运清钱禁私铸
    labels:
      zh: 桂藩善治
    start_date: 1622
    highlight_event_id: guji-曹学佺-event-1622-guangxi
  - key: closure
    name: 忤阉削籍家居献九策
    labels:
      zh: 削籍家居
    start_date: 1626
    highlight_event_id: guji-曹学佺-event-1626-xueji
  decisions:
  - date: 1611
    title_zh: 以行税赢羡抵坐税、却蜀王府七十万重建费
    rationale: 岁饥民流，坐税无出，取赢羡抵追比以纾民；宗藩当循条例，不可虚费以困全蜀
  - date: 1622
    title_zh: 桂林粮艘亲诣驿兑、清钱局立程度、严捕私铸
    rationale: 省仓费而军得实惠，核侵渔而岁利增，清窟穴以息奸风
  - date: 1630
    title_zh: 条陈海防九事、屯梅花双龟、编居民守堡
    rationale: 弭盗安民当扼要塞、严会哨、稽海船、训车炮，搜人才以备缓急
- id: guji-曹学佺-endeavor-2
  title_zh: 石仓著述与儒藏殉节
  summary: 构石仓园聚书讲学，采撷四库欲修儒藏；隆武参赞纂实录，力主水师，终以身殉
  phases:
  - key: brewing
    name: 石仓园讲学肆力著述
    labels:
      zh: 石仓聚书
    start_date: 1612
    highlight_event_id: guji-曹学佺-event-1612-shicang
  - key: breakthrough
    name: 萌议修儒藏分纂四库
    labels:
      zh: 儒藏之志
    start_date: 1635
    highlight_event_id: guji-曹学佺-event-1635-rucang
  - key: climax
    name: 隆武入闽参决纂实录赞水师
    labels:
      zh: 隆武参赞
    start_date: 1645-07
    highlight_event_id: guji-曹学佺-event-1645-longwu
  - key: closure
    name: 福州陷后从容就义
    labels:
      zh: 西峰殉节
    start_date: 1646-09-18
    highlight_event_id: guji-曹学佺-event-death
  decisions:
  - date: 1626-09
    title_zh: 直书梃击著野史纪略不悔
    rationale: 国史是非当直笔，宁削籍毁版不为饰非附阉
  - date: 1644
    title_zh: 甲申闻变投池殉国为救不死而待
    rationale: 君亡当死，然儒藏未就、实录可修，天若祚明则以笔报国
  - date: 1646-08
    title_zh: 力赞张肯堂水师由海道趋吴淞、捐饷万金趣速发
    rationale: 徼天之幸在此一举，乘风疾发犹可联夏允彝诸军，阻于郑芝龙亦尽臣节
  - date: 1646-09-18
    title_zh: 沐浴整衣冠缢于西峰里第
    rationale: 城陷君败，实录无可就，老臣惟一死报国，存生前一管笔、死后一条绳之志
events:
- id: guji-曹学佺-event-birth
  title_zh: 生于侯官
  date: 1574
  year_of: 1574
  description: 侯官人，约生于明万历二年，后以舟战策对知名
  location: 福州府侯官县
- id: guji-曹学佺-event-1595-jinshi
  title_zh: 万历乙未进士对策舟战
  date: 1595
  year_of: 1595
  description: 会试策问车战，对以臣南人不谙车战请以舟战论，详陈舟战法，为张位所奇，初拟第一改第十，授户部主事
  location: 京师
- id: guji-曹学佺-event-1611-zhenji
  title_zh: 四川参政赈饥发帑修驿
  date: 1611
  year_of: 1611
  description: 为四川右参政，岁大饥设厂煮粥绘图请得帑金三百万赈之，以行税赢羡抵坐税，蜀邸毁援例却七十万费，搜羡修道途舆梁，三十九年进按察使
  location: 四川
- id: guji-曹学佺-event-1612-shicang
  title_zh: 归构石仓园讲学著述
  date: 1612
  year_of: 1612
  description: 中察典归里，构石仓园有池馆林木之胜，肆力于学，闽中文风为盛自其倡之
  location: 福州石仓园
- id: guji-曹学佺-event-1622-guangxi
  title_zh: 起广西参议厘粮运清钱局治猺獞
  date: 1622
  year_of: 1622
  description: 天启二年起广西右参议，执法抑宗室横暴，亲诣驿兑粮艘勒石为令，清钱局年获利五千，严捕私铸，约戢哨军禁入峒骚扰，平乐饥时以严静便宜假饷买运安众
  location: 桂林
- id: guji-曹学佺-event-1626-xueji
  title_zh: 著野史纪略忤魏忠贤削籍毁版
  date: 1626-09
  year_of: 1626
  description: 迁陕西副使未行，因梃击狱著野史纪略直书本末，为附阉刘廷元所劾私撰国史，削籍毁版，羁七十日，欲毁漓水书院为宗室士民赎存
  location: 广西
- id: guji-曹学佺-event-1635-rucang
  title_zh: 萌修儒藏采撷四库
  date: 1635
  year_of: 1635
  description: 谓二氏有藏吾儒何独无，家居与子弟采撷四库因类分缉，十余年功未竣；又屡献海防九策、塞龙腰、毁淫祠、浚河建洪山等三桥
  location: 福州
- id: guji-曹学佺-event-1645-longwu
  title_zh: 隆武授礼部侍郎纂崇祯实录赞水师
  date: 1645-07
  year_of: 1645
  description: 唐王至闽称隆武，王称海内鸿儒授太常卿，与黄道周参决庶务，迁礼部侍郎兼侍讲学士纂修崇祯实录，力赞张肯堂水师由海道抵吴淞、捐饷万金趣发，为郑芝龙所阻
  location: 福州
- id: guji-曹学佺-event-death
  title_zh: 清兵入闽沐浴缢死西峰
  date: 1646-09-18
  year_of: 1646
  description: 隆武二年八月唐王败于汀州，九月十七日清兵入福州城，次日沐浴整衣冠缢于西峰里第，年七十四，匣留生前一管笔、死后一条绳句，乾隆十一年赐谥忠节
  location: 福州西峰里第
