  death_date: 1872-03-12
  era: 清
  reign_ref: 嘉庆至同治
  archetype: 理学经世名臣
  dilemmas:
  - 以程朱主敬穷理自持与兼采汉学考据词章经世之学的门户调和
  - 词垣清贫自守与赡族济贫周济同乡穷困的生计张力
  - 求阙慎满戒盈与名位渐显门祚鼎盛的持盈之难
  lesson: 以日课十二条自绳，有恒立志，主敬克己，日知所亡月无忘所能，求阙慎满以持家国
  summary_first_person: 余嘉庆辛未生于湘乡白杨坪，自幼受学于庭，赖星冈公督课、竹亭公训诱。道光十四年肄业岳麓中乡试，屡困会试，十八年始成进士改庶吉士入词垣。自此慨然以澄清天下为志，师事唐镜海专力程朱，日课自省，历检讨侍讲至内阁学士，名斋求阙以戒盈满，期以礼经世而济斯民。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/曾文正公年谱.md
  - https://daizhige.org/史藏/传记/曾文正公年谱.html
  - https://ctext.org/library.pl?if=gb&file=wb77208
