  decisions:
  - date: 1842-07-15
    title_zh: 师事唐鉴专治程朱
    rationale: 既详鉴前史求经世，复以义理为日课，定主敬静坐等十二条以痛自刻责
  - date: 1845-12-22
    title_zh: 名书舍为求阙斋
    rationale: 名位渐显堂上重庆，以盈满为戒，求阙于他事而求全于亲
- id: guji-曾国藩-endeavor-2
  title_zh: 典试校理经世历练
  summary: 散馆授检讨后历国史协修、四川正考官、文渊阁校理及教习庶吉士，校典核礼、甄拔人才，奠定经世治事之基
