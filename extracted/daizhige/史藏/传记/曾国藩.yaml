    title_zh: 扶暑病入蜀典试
    rationale: 保定病暑仍扶病西行，西安就医稍愈即入川，尽典试育才之职
  - date: 1844-08-28
    title_zh: 器重江忠源期以节义
    rationale: 见江忠源任侠不检而独赏其才，谓必立功名以节义死，遂结师友之谊
