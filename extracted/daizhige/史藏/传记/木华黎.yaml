person:
  qid: guji-木华黎
  name_zh: 木华黎
  names:
    zh: 木华黎
    en: Muqali
  alt_names_zh:
  - 穆呼哩
  - 札剌尔氏木华黎
  lifespan:
    birth:
      date: '1170'
      precision: year
      is_circa: true
      raw: 癸未（1223）薨年五十四，逆推约生于此年；生于鄂诺水之东
    death:
      date: '1223'
      precision: year
      is_circa: false
      raw: 癸未春三月，薨于闻喜县，年五十四
  birth_date: '1170'
  death_date: '1223'
  era: 大蒙古国开国至伐金时期
  reign_ref: 元太祖成吉思汗
  archetype: 开国名将·首任太师国王·方面统帅
  dilemmas:
  - 北京举城而降，欲坑降众以立威，恐绝后来归附之心；纳萧爱新之谏，抚摩以慰众望，留降帅镇抚
  - 兵过中原，纵兵抄掠以饱军资，还是吊民伐罪收拾人心；纳史天倪之谏，敢擅剽掠者以军法从事，老幼咸归遣之
  - 汴京未下而身已疾笃，是勉强再战，还是托付后事；召弟岱逊嘱之，遗恨汴京而终
  lesson: 攻坚以死力，收人心以仁恕；从谏如流者，方能不战而定中原
  summary_first_person: 我是木华黎，札剌尔氏，又译穆呼哩，生于鄂诺水之东。我以忠勇佐太祖，与博尔术等同号四杰。丙寅太祖即帝位，拜我为左万户；辛未南伐金国，我策马横戈大破金军四十万于野狐岭；甲戌受诏专征辽西，抚定降城；丁丑以佐命功封太师国王都行省承制行事，建行省于云燕，太行之南悉归我经略。我东征西讨垂四十年，癸未春三月病笃于闻喜，惟恨汴京未下，遗命诸弟勉之。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%85%83%E5%90%8D%E8%87%A3%E4%BA%8B%E7%95%A5.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%85%83%E5%90%8D%E8%87%A3%E4%BA%8B%E7%95%A5.md
endeavors:
- id: guji-木华黎-endeavor-1
  name: 佐命建元，从太祖统一漠北
  role_zh: 掇里班曲律（四杰）之一，左万户
  start_date: '1199'
  end_date: '1217'
  summary_zh: 从讨漠北诸部，救王可汗、雪夜张毡蔽太祖、溪谷三发三殪，以忠勇冠一时；太祖即位立为左万户，南伐破金为佐命首功，终于受封太师国王。
  phases:
  - key: brewing
    name: 从讨漠北诸部，护卫太祖
    labels:
      zh: 帐前骁将
    start_date: '1199'
    highlight_event_id: guji-木华黎-event-1199-救王可汗
  - key: breakthrough
    name: 太祖即位，立为左万户
    labels:
      zh: 佐命元勋
    start_date: '1206'
    highlight_event_id: guji-木华黎-event-1206-拜左万户
  - key: climax
    name: 南伐破金，野狐岭陷阵
    labels:
      zh: 摧锋破敌
    start_date: '1211'
    highlight_event_id: guji-木华黎-event-1211-野狐岭大捷
  - key: closure
    name: 以佐命功封太师国王
    labels:
      zh: 裂土建牙
    start_date: '1217'
    highlight_event_id: guji-木华黎-event-1217-封太师国王
  decisions:
  - date: '1211'
    title_zh: 抗言死战，策马横戈陷野狐岭之阵
    rationale: 今敌众我寡，弗致死力未易破也；身先士卒以夺金人精锐，麾诸军齐进，日未午大破之
  - date: '1214'
    title_zh: 奉诏专征，移师经略辽西
    rationale: 金弃山后诸郡移兵山前，正可乘虚专征辽西诸郡，为异日建行省以图中原张本
- id: guji-木华黎-endeavor-2
  name: 太师国王经略中原，专征金国
  role_zh: 太师国王·都行省承制行事
  start_date: '1214'
  end_date: '1223'
  summary_zh: 受命太行之南专征，抚定辽西，建行省于云燕，下山东、定河东、兵锋及关陕，以仁恕收中原之心，病笃闻喜而薨。
  phases:
  - key: brewing
    name: 专征辽西，抚定北京降众
    labels:
      zh: 抚降定辽
    start_date: '1214'
    highlight_event_id: guji-木华黎-event-1214-北京受降
  - key: breakthrough
    name: 封太师国王，建行省于云燕
    labels:
      zh: 开府承制
    start_date: '1217'
    highlight_event_id: guji-木华黎-event-1217-封太师国王
  - key: climax
    name: 纳谏整军，略定河北山东，兵锋及关陕
    labels:
      zh: 中原略定
    start_date: '1220'
    highlight_event_id: guji-木华黎-event-1220-纳谏禁剽掠
  - key: closure
    name: 病笃闻喜，遗恨汴京
    labels:
      zh: 鞠躬尽瘁
    start_date: '1223'
    highlight_event_id: guji-木华黎-event-death
  decisions:
  - date: '1214'
    title_zh: 纳萧爱新之谏，不坑北京降众
    rationale: 北京为辽西重镇，始降而即坑之，后讵有降者乎；遂以伊都呼权北京留守，留军镇抚
  - date: '1216'
    title_zh: 设奇饵敌，夜驰神水夹击张致
    rationale: 致兵精且依险为阻，欲设奇饵之；遣兵急攻溜石诱其出援，出其不意断其归路，一战擒之
  - date: '1220'
    title_zh: 纳史天倪之谏，严禁剽掠
    rationale: 王为天下除暴，岂可效抄掠所为；敢擅剽掠者以军法从事，老幼咸归遣之，军中肃然吏民大悦，武贵等望风来降
  - date: '1220'
    title_zh: 属严实以东平，戒入城勿苦郡县
    rationale: 我料东平粮尽必弃城走，若然汝即入城绥辑安慰之，勿苦郡县以败乃事；次年守将果遁，严实入城建行省，山东略定
events:
- id: guji-木华黎-event-birth
  title_zh: 生于鄂诺水之东
  date: '1170'
  precision: year
  is_circa: true
  raw_date: 据癸未薨年五十四逆推
  summary_zh: 王生于鄂诺水之东，生时白气充帐，神巫见而异之曰此非常儿也；及长身长七尺，虎首虬须，黑面多谋略，雄勇冠一时。
- id: guji-木华黎-event-1199-救王可汗
  title_zh: 引兵救克哷王可汗，殱乃曼于按台
  date: '1199'
  precision: year
  is_circa: true
  raw_date: 太祖起兵之初，约在此年前后
  summary_zh: 克哷王可汗为乃曼氏所困，其子亦被创求援；太祖遣王与博尔术、博勒呼等引兵救之，殱其众于按台之下，获甲仗辎重以还；其后王可汗合札木哈潜袭不克走死，诸部悉平。
  endeavor_id: guji-木华黎-endeavor-1
- id: guji-木华黎-event-1206-拜左万户
  title_zh: 太祖即帝位，立为左万户
  date: '1206'
  precision: year
  is_circa: false
  raw_date: 岁丙寅
  summary_zh: 太祖即皇帝位，从容谓今国内平定多汝等之力，我之与汝犹车之辕犹身之臂；乃立王及博尔术为左右万户，各以其属翊卫宸极，仪位一如诸侯王。
  endeavor_id: guji-木华黎-endeavor-1
- id: guji-木华黎-event-1211-野狐岭大捷
  title_zh: 野狐岭大破金军四十万
  date: '1211'
  precision: year
  is_circa: false
  raw_date: 岁辛未
  summary_zh: 大举南入，云中九原诸郡皆下，进围抚州；金军号四十万陈于野狐岭之北，王抗言敌众我寡弗致死力未易破，即策马横戈大呼陷阵，日未午大破之，乘胜追至浍河，僵尸百余里，金兵精锐咸尽。
  endeavor_id: guji-木华黎-endeavor-1
- id: guji-木华黎-event-1213-围中都
  title_zh: 出紫荆口，进逼中都
  date: '1213'
  precision: year
  is_circa: false
  raw_date: 岁癸酉
  summary_zh: 我师至居庸关壁坚不得入，统兵趋紫荆口，金左监军来拒不胜遂溃，进逼中都围之；分三道徇略赵晋齐鲁，金主献公主请和，王略地益都滨棣皆克之。
  endeavor_id: guji-木华黎-endeavor-1
- id: guji-木华黎-event-1214-北京受降
  title_zh: 受诏专征辽西，抚定北京
  date: '1214'
  precision: year
  is_circa: false
  raw_date: 岁甲戌
  summary_zh: 诏王统诸军专征辽西诸郡；金守将伊木沁率众二十万来拒，遇于花道，王逆击败走之，北京举城降；王怒欲坑之，纳萧爱新之谏抚摩以慰众望，以伊都呼权北京留守；兴中府石天应、锦州张鲸相继来降。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-1216-锦州破张致
  title_zh: 神水夹击破张致，克锦州
  date: '1216'
  precision: year
  is_circa: false
  raw_date: 岁丙子
  summary_zh: 张致陷兴中府，王以其兵精且依险为阻欲设奇饵之，遣兵急攻溜石诱其出援，别屯永徳以伺；夜半引军疾驰抵神水，前后夹击大破之，斩首虏万三千；进围锦州月余，伪监军高益缚致出降，致伏诛。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-1217-封太师国王
  title_zh: 封太师国王都行省，承制行事
  date: '1217'
  precision: year
  is_circa: false
  raw_date: 岁丁丑
  summary_zh: 以佐命功诏封太师国王都行省承制行事，赐誓券子孙传国；分鸿吉哩等十军及乌伊尔契丹蕃汉等军隶麾下，谕曰太行之北朕自经略，太行之南卿其勉之；遂建行省于云燕以图中原，南攻遂城蠡州，东定临淄登莱潍密诸州。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-1220-纳谏禁剽掠
  title_zh: 纳史天倪之谏，军中肃然；下济南围东平
  date: '1220'
  precision: year
  is_circa: false
  raw_date: 岁庚辰
  summary_zh: 由中都徇赵至满城，武仙举城降；史天倪谏今中原已粗定，所过犹纵抄掠非王者吊民伐罪意，王曰善，下令敢擅剽掠者以军法从事，老幼咸归遣之，军中肃然吏民大悦；轻骑入济南受严实之谒，以轻兵五百破黄陵冈金兵二十万，克楚丘，围东平。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-1221-延安设伏
  title_zh: 涉河入葭州，设伏延安破合达
  date: '1221'
  precision: year
  is_circa: false
  raw_date: 辛巳冬十月
  summary_zh: 由东胜州涉河而西，夏主惧遣使馈方物且以兵五万属焉；由云中入葭州，以石天应权行台，击绥徳破马蹄寨，进至延安；令蒙古不哈佯弃旗鼓诱敌，王出伏乘其后，追斩七千级获马八百匹；围延安十余日不下，南徇洛川鄜州，北京权帅擒金枭将张铁枪送王所，王义其忠欲释之。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-1222-兵锋及关陕
  title_zh: 渡河攻关陕，围凤翔不克
  date: '1222'
  precision: year
  is_circa: false
  raw_date: 岁壬午
  summary_zh: 令蒙古不哈引游骑出秦陇为声势，王率大军回云中；冬十月过晋至绛，荣州汾东诸堡望风归附；以石天应权河东南北路陕右关西行台，节制平阳太原吉隰诸帅府；引兵渡河攻同州下蒲城，入关径至长安，城坚不克，留军六千屯守，断潼关；西击凤翔月余不克，军于渭水之南。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-death
  title_zh: 病笃闻喜，遗恨汴京而薨
  date: '1223'
  precision: year
  is_circa: false
  raw_date: 癸未春三月
  summary_zh: 春三月王至闻喜县疾笃，召弟岱逊曰我为国家助成大业，事干戈垂四十年，东征西讨无复遗恨，所恨者汴京未下耳，汝等勉之；言讫薨，年五十四。
  endeavor_id: guji-木华黎-endeavor-2
- id: guji-木华黎-event-1230-帝念其功
  title_zh: 太祖亲攻凤翔，追念王之功
  date: '1230'
  precision: year
  is_circa: false
  raw_date: 岁庚寅冬
  summary_zh: 帝亲攻凤翔不克，对诸将数王之功，因曰使穆呼哩在，不令朕至此也。
  endeavor_id: guji-木华黎-endeavor-2
