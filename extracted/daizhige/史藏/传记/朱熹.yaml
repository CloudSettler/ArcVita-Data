    highlight_event_id: guji-朱熹-event-jinshi
  - key: breakthrough
    name: 同安莅政
    labels:
      zh: 初仕
    start_date: 1153-07-01
    highlight_event_id: guji-朱熹-event-tongan
  - key: climax
    name: 均役兴学
    labels:
      zh: 试政
    start_date: 1154-01-01
    highlight_event_id: guji-朱熹-event-tongan
  - key: closure
    name: 乞祠归学
    labels:
      zh: 归养
    start_date: 1156-04-01
    highlight_event_id: guji-朱熹-event-resign
  decisions:
  - date: 1148-04-17
    title_zh: 登第后不求京华清要而请州县亲民之官
    rationale: 欲于簿书赋役间体认天理在人事之显处，非徒章句可得
  - date: 1153-09-01
    title_zh: 在同安建经史阁正乡校规条并请均赋抑吏
    rationale: 为政当先正人心厚风俗，兴学明伦乃治本
- id: guji-朱熹-endeavor-2
  name_zh: 集注四书与书院讲学
  summary_zh: 师延平而上承二程，注四书订纲目，立白鹿洞规，会鹅湖辨朱陆，开闽学一脉
  phases:
  - key: brewing
    name: 师事延平问道
    labels:
      zh: 问学
    start_date: 1150-06-01
    highlight_event_id: guji-朱熹-event-xue-li
  - key: breakthrough
    name: 四书集注始成
    labels:
      zh: 立言
    start_date: 1172-01-01
    highlight_event_id: guji-朱熹-event-sishu
  - key: climax
    name: 鹅湖会讲与白鹿复兴
    labels:
      zh: 会讲
    start_date: 1175-06-01
    highlight_event_id: guji-朱熹-event-ehu
  - key: closure
    name: 考亭精舍晚年定论
    labels:
      zh: 成书
    start_date: 1190-10-01
    highlight_event_id: guji-朱熹-event-kaoting
  decisions:
  - date: 1175-06-01
    title_zh: 赴鹅湖与陆九渊九龄辨无极太极与为学之方
    rationale: 欲明理一分殊与心即理之分际，为后学定趋归
  - date: 1180-10-01
    title_zh: 奏复白鹿洞书院并颁白鹿洞揭示
    rationale: 学以明人伦辅治道，当立规条以束身实践而非徒记诵
events:
- id: guji-朱熹-event-birth
  title_zh: 生于尤溪
  date: 1130-10-18
  year_of: 1130
  place_zh: 建州尤溪
  description_zh: 建炎四年九月十五日生于尤溪，后随父朱松寓建阳，幼颖悟力学
- id: guji-朱熹-event-jinshi
  title_zh: 绍兴十八年登进士第
  date: 1148-04-17
  year_of: 1148
  place_zh: 临安集英殿
  description_zh: 宋高宗御试策问，王佐榜进士三百三十人，朱熹以建州建阳县群玉乡三桂里籍列第五甲第九十人，时年十九，见同年小录
- id: guji-朱熹-event-xue-li
  title_zh: 师事李侗延平先生
  date: 1150-06-01
  year_of: 1150
  place_zh: 延平
  description_zh: 执弟子礼于李侗，得闻二程心法，专务静中体认天理
- id: guji-朱熹-event-tongan
  title_zh: 授同安主簿莅任
  date: 1153-07-01
  year_of: 1153
  place_zh: 泉州同安
  description_zh: 初仕亲民，建经史阁，兴乡校，请均赋役，抑豪吏，实践格物致知于政事
- id: guji-朱熹-event-resign
  title_zh: 任满乞祠归建阳侍亲讲学
  date: 1156-04-01
  year_of: 1156
  place_zh: 建阳
  description_zh: 同安任满不复求进，归筑室讲学，潜心著述
- id: guji-朱熹-event-sishu
  title_zh: 四书章句集注成编
  date: 1177-12-01
  year_of: 1177
  place_zh: 建阳武夷
  description_zh: 集大学中庸论语孟子章句或问并成，以理一分殊贯通群经，立程朱理学之基
- id: guji-朱熹-event-ehu
  title_zh: 鹅湖之会
  date: 1175-06-01
  year_of: 1175
  place_zh: 信州鹅湖寺
  description_zh: 与吕祖谦、陆九渊、陆九龄会讲，论为学工夫异同，朱主格物穷理，陆主发明本心，遂分朱陆两途
- id: guji-朱熹-event-bailudong
  title_zh: 重修白鹿洞书院颁揭示
  date: 1180-10-01
  year_of: 1180
  place_zh: 江州庐山白鹿洞
  description_zh: 奏请复兴白鹿洞书院，亲定学规五教之目，揭示立学明人伦之旨
- id: guji-朱熹-event-kaoting
  title_zh: 筑考亭精舍晚年定论
  date: 1190-10-01
  year_of: 1190
  place_zh: 建阳考亭
  description_zh: 筑考亭书院，四方从学者众，晚年订定近思录、楚辞集注、周易本义等，学统大备
- id: guji-朱熹-event-death
  title_zh: 卒于考亭
  date: 1200-04-23
  year_of: 1200
  place_zh: 建宁府建阳考亭
  description_zh: 庆元六年三月甲寅卒，年七十一，后谥文，世称朱文公，从祀孔庙
