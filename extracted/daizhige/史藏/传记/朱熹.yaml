person:
  qid: guji-朱熹
  name_zh: 朱熹
  names:
    zh: 朱熹
    en: Zhu Xi
  lifespan:
    birth:
      date: 1130-10-18
      precision: day
      is_circa: false
      raw: 建炎四年九月十五日
    death:
      date: 1200-04-23
      precision: day
      is_circa: false
      raw: 庆元六年三月甲寅
  birth_date: 1130-10-18
  death_date: 1200-04-23
  era: 南宋
  reign_ref: 宋高宗绍兴十八年
  archetype: scholar
  dilemmas:
  - 州县亲民实政与山林讲学明道之间当以何为重
  - 鹅湖之会后理分殊与心即理两途何者更近圣学正脉
  - 庆元党禁诬为伪学时当守正不屈还是退藏全身
  lesson: 穷理以致知，居敬以立本，读书与立身不可判为二事
  summary_first_person: 余幼失怙，力学于建阳，绍兴十八年以十九岁忝登王佐榜第五甲第九十人，始知科第非学问之极。初仕同安主簿，兴学均役，欲以天理见诸人事；中年师事李延平，退而注四书、订纲目、规白鹿、会鹅湖，辨朱陆之异，欲为后学定趋向。虽晚罹伪学之禁，毁誉不移穷理居敬之志，愿学者以实理为归。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E7%BB%8D%E5%85%B4%E5%8D%81%E5%85%AB%E5%B9%B4%E5%90%8C%E5%B9%B4%E5%B0%8F%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E7%BB%8D%E5%85%B4%E5%8D%81%E5%85%AB%E5%B9%B4%E5%90%8C%E5%B9%B4%E5%B0%8F%E5%BD%95.md
  - https://ctext.org/library.pl?if=gb&file=180731&page=1
endeavors:
