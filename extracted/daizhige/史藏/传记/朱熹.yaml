  - https://kanripo.org/KR2g0016/WYG
  - https://ctext.org/library.pl?if=gb&file=wb293163
endeavors:
- id: guji-朱熹-endeavor-1
  title_zh: 理学集大成与经籍注疏
  summary_zh: 承周程邵张之学，折衷群儒，注四书作章句集注，解周易作本义启蒙，辨太极西铭，重修仪礼经传通解，集诸儒大成以明道统
  phases:
  - key: brewing
    name: 家学韦斋与刘胡启蒙
    labels:
      zh: 庭训启蒙
    start_date: 1130-09-15
    highlight_event_id: guji-朱熹-event-birth
  - key: breakthrough
    name: 师事延平得静中体验
    labels:
      zh: 延平得悟
    start_date: 1153-01-01
    highlight_event_id: guji-朱熹-event-follow-yanping
  - key: climax
    name: 四书集注及易学礼学大成
    labels:
      zh: 注疏大成
    start_date: 1172-01-01
    highlight_event_id: guji-朱熹-event-sishu-jizhu
  - key: closure
    name: 晚年重订定论与遗训昭明
    labels:
      zh: 晚年定论
    start_date: 1194-01-01
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1153-06-01
    title_zh: 决计师事延平李侗
    rationale: 韦斋遗命父事三君子，独延平得龟山杨时河洛真传，遂舍辞章举业而专心为己之学，敛华就实、反博归约
  - date: 1172-03-01
    title_zh: 撰次四书章句集注与或问
    rationale: 以大学中庸为入德门户，论语孟子为日用切要，推明演绎以闲先圣之道，使学者由近及远、由显入微
  - date: 1182-01-01
    title_zh: 不附姚江弥缝而辨朱陆异同
    rationale: 深病晚年定论调和之说窜乱旧谱，必辨为学次第与天理人欲之分，以正闽学流弊
- id: guji-朱熹-endeavor-2
  title_zh: 书院讲学与仕宦经世
  summary_zh: 以南康白鹿洞、建阳考亭为讲舍，聚徒授学、订立学规，与张栻吕祖谦同心协力而辨鹅湖，同时屡膺守令、条陈荒政、劾唐仲友、辞伪学之禁，以行道济民
  phases:
  - key: brewing
    name: 屏山籍溪抚教与科第入仕
    labels:
      zh: 科第入仕
    start_date: 1143-03-24
    highlight_event_id: guji-朱熹-event-father-death
  - key: breakthrough
    name: 鹅湖之会与南轩东莱合流
    labels:
      zh: 鹅湖论学
    start_date: 1175-06-01
    highlight_event_id: guji-朱熹-event-ehu
  - key: climax
    name: 知南康修复白鹿洞书院
    labels:
      zh: 白鹿洞规
    start_date: 1179-03-01
    highlight_event_id: guji-朱熹-event-bailudong
  - key: closure
    name: 庆元党禁与考亭讲学终老
    labels:
      zh: 党禁讲学
    start_date: 1195-01-01
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1175-06-01
    title_zh: 赴鹅湖与陆九渊兄弟辨无极太极
    rationale: 欲明道器一致、精粗合一，力斥简易径捷之弊，虽异同不合亦以论学切要语存其真
  - date: 1179-03-01
    title_zh: 奏请修复白鹿洞书院并颁学规
    rationale: 以古昔射饮读法之礼移于书院，立君师之教，使学者知为学有序、居敬穷理
  - date: 1181-09-01
    title_zh: 劾奏知台州唐仲友
    rationale: 以正名教、明纲纪，即触权幸亦不敢避，虽招忌而自信益笃
events:
- id: guji-朱熹-event-birth
  date: 1130-09-15
  year_of: 1130
  title_zh: 建炎四年九月十五日生于南剑尤溪
  place_zh: 南剑州尤溪郑氏馆舍
  description_zh: 吏部韦斋朱松因仕入闽寓尤溪，时馆于郑氏，先生以是日午时生，后遂家建之崇安五夫里、考亭
- id: guji-朱熹-event-father-death
  date: 1143-03-24
  year_of: 1143
  title_zh: 十四岁丁父韦斋忧禀学刘胡三先生
  place_zh: 建州
  description_zh: 绍兴十三年三月二十四日辛亥韦斋卒于建州城南寓舍，遗命父事刘子羽、刘子翚、胡宪，遂奉母迁居并从三君子受学，刘致中以女妻之
- id: guji-朱熹-event-jinshi
  date: 1148-04-15
  year_of: 1148
  title_zh: 绍兴十八年登进士第
  place_zh: 临安
  description_zh: 年十九擢进士第，初授同安主簿，虽为举子业不经意，而厉志圣贤之学已见端倪
- id: guji-朱熹-event-follow-yanping
  date: 1153-06-01
  year_of: 1153
  title_zh: 师事延平李侗问学
  place_zh: 延平
  description_zh: 遵韦斋师承渊源，从李延平问河洛之学，闻龟山所传不传之遗意，日诵大学中庸用力于致知诚意，长进静中涵养工夫
- id: guji-朱熹-event-ehu
  date: 1175-06-01
  year_of: 1175
  title_zh: 鹅湖之会与陆象山辨学
  place_zh: 信州鹅湖寺
  description_zh: 淳熙二年会陆九渊九韶及吕祖谦于鹅湖，论为学次第，朱主格物致知、陆主发明本心，异同遂分，后成朱陆之辨
- id: guji-朱熹-event-sishu-jizhu
  date: 1177-01-01
  year_of: 1177
  title_zh: 四书章句集注初成
  place_zh: 建阳考亭
  description_zh: 推明演绎大学中庸论语孟子，悉为章句集注，又成周易本义启蒙及太极图说通书西铭解义，理学体系大备
- id: guji-朱熹-event-bailudong
  date: 1179-10-01
  year_of: 1179
  title_zh: 知南康军修复白鹿洞书院
  place_zh: 南康军白鹿洞
  description_zh: 淳熙六年知南康，奏复白鹿洞书院，订立洞规，聚徒讲学，与张栻会讲，其教法为后世书院之式
- id: guji-朱熹-event-death
  date: 1200-04-23
  year_of: 1200
  title_zh: 庆元六年三月初九日卒于考亭
  place_zh: 建阳考亭
  description_zh: 晚罹庆元党禁被诬为伪学，闲居考亭讲学著述不辍，卒年七十一，门人黄干作行状，宋理宗后谥文、封徽国公，从祀孔庙
