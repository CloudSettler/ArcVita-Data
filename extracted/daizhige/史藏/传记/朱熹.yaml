      date: 1130-09-15
      precision: day
      is_circa: false
      raw: 建炎四年九月十五日午时生于南剑尤溪郑氏馆舍
    death:
      date: 1200-04-23
      precision: day
      is_circa: false
      raw: 庆元六年三月初九日
  birth_date: 1130-09-15
  death_date: 1200-04-23
  era: 南宋
  reign_ref: 宋高宗建炎至宋宁宗庆元
  archetype: 理学家
  dilemmas:
  - 博学穷理与静中涵养孰为入道先后
  - 朱陆异同与晚年定论真伪之辨
  - 出仕行道济世与退处讲学著述之衡
  - 尊经崇注与空谈心性之别
  lesson: 格物致知以穷天理，居敬持志以立本体，博约兼进、知行互发，方能承孔孟而集周程之大成
  summary_first_person: 吾讳熹字元晦一字仲晦，婺源朱氏而生于尤溪，五龄入小学，十四而孤禀学于刘胡三先生，二十四师延平李侗而得河洛不传之绪，中年与张吕讲切、会鹅湖以辨朱陆，晚更学禁而注四书、解易诗、修礼书、兴白鹿洞以教天下，虽穷而在下，窃欲立师道以接洙泗之传
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E6%9C%B1%E5%AD%90%E5%B9%B4%E8%B0%B1.html
