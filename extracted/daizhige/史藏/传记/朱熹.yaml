  dilemmas:
  - 义理之辨：朱陆异同博约与简易之争当持穷理循序还是直指本心
  - 出处之衡：屡辞召命与出守拯民兴学之间欲守道学纯粹又不废经世之责
  - 著述之择：注疏六经传承道统与斥佛辟异之锋芒如何兼顾
  lesson: 循序渐进居敬穷理格物致知以明人伦日用之道知行相资方能立教垂世
  summary_first_person: 吾朱熹字仲晦号晦庵幼承韦斋庭训十四而孤托学于刘屏山胡籍溪诸君子绍兴十八年登进士第然志在穷经讲学中年筑室考亭注四书解易诗辑近思录定学规于白鹿洞与张吕切磋与陆氏辨鹅湖晚更庆元党禁而笃信不移欲以文字昭道统使学者知为学次第性命之微庶几孔孟周程之传不坠
  source_urls:
