  summary_zh: 李善长出生，约元延祐元年，濠州定远人。
- id: guji-李善长-event-join
  type: career_start
  date: 1354
  year_of: 1354
  summary_zh: 于明太祖起兵之初归附，为幕府谋主，专掌文翰粮饷调度。
- id: guji-李善长-event-chancellor
  type: appointment
  date: 1368
  year_of: 1368
  summary_zh: 洪武元年明太祖即位，李善长以开国首功出任丞相，位极人臣。
- id: guji-李善长-event-fengyang
  type: political_career
  date: 1369
  year_of: 1369
  summary_zh: 车驾幸凤阳时，与刘基等同居守中书省；其间都事李彬侮法当死，善长为之求情，刘基不听而即日斩之，善长大恚恨，以他事诉于上，二人隙深。
- id: guji-李善长-event-dismiss
  type: demotion
  date: 1371
  year_of: 1371
  summary_zh: 丞相李善长被罢免，次相人选议及杨宪、汪广洋、胡惟庸，刘基力言诸人皆不堪相任。
- id: guji-李善长-event-death
  type: death
  date: 1390
  year_of: 1390
  summary_zh: 洪武二十三年，李善长以牵连胡惟庸党被处死，时年七十七，家属多被株连。
