  summary_first_person: 我是李善长，安徽定远人，追随明太祖起兵，以调度粮饷、调和诸将之功任丞相，位比萧何。我虽屡建勋劳，然因庇护犯法的李彬等事渐失帝心，终被罢相，晚年以坐胡惟庸党论死，是功高震主、不能善终的典型。
