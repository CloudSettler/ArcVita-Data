    death:
      date: '0830-06-08'
      precision: day
      is_circa: false
      raw: 大和四年六月遇害，年六十七
  birth_date: '0764'
  death_date: '0830-06-08'
  era: 唐
  reign_ref: 唐宪宗元和
  archetype: 诤臣
  dilemmas:
  - 直言极谏易忤宦竖权幸，欲匡主德则必冒雷霆之威
  - 藩镇跋扈当恩威并济，姑息则纲纪不振，急讨则激变
  - 持正不阿致众谤交集，全身远祸与守道殉节难以两全
  lesson: 正身励己、远佞进忠，守直道以事君，虽罹祸而可为后世法
  summary_first_person: 余字深之，赞皇李氏，擢进士宏辞，由渭南尉入翰林知制诰。宪宗问何以庶几太宗玄宗之盛，余以正身远邪、进直斥佞对，蒙采纳而张连屏于便坐。屡论李锜赀产宜代浙西租赋、赦书不宜遣中使裒敛、安国寺不当立圣德碑，皆得罢行。及拜中书侍郎同平章事，料魏博必推素所爱者立，请推诚即授田兴节度并厚赐其军，六州遂归。尝论朋党谓君子同道非党、小人趋利为朋，请分神策隶本道以一号令。晚节镇山南西道，值监军构乱握节登陴不去而死，所论万余言付蒋偕为七篇，惟求无愧谥号不为宗庙羞而已。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E6%9D%8E%E7%9B%B8%E5%9B%BD%E8%AE%BA%E4%BA%8B%E9%9B%86.html
  - https://zh.wikisource.org/wiki/%E6%9D%8E%E7%9B%B8%E5%9C%8B%E8%AB%96%E4%BA%8B%E9%9B%86
endeavors:
- id: guji-李绛-endeavor-1
  title_zh: 翰林论事匡主
  summary: 元和初入翰林，以制诰为职极论得失，纠财赋、赦令、立碑等事，开纳谏之路
  phases:
  - key: brewing
    name: 筮仕入台
    labels:
      zh: 渭南尉至监察御史
    start_date: 0785
    highlight_event_id: guji-李绛-event-807-hanlin
  - key: breakthrough
    name: 直入内署
    labels:
      zh: 翰林学士知制诰
    start_date: 0807
    highlight_event_id: guji-李绛-event-807-hanlin
  - key: climax
    name: 极谏显名
    labels:
      zh: 驳赦使与罢碑立
    start_date: 0808
    highlight_event_id: guji-李绛-event-809-bei
  - key: closure
    name: 声动宸衷
    labels:
      zh: 焚稿俟罪得眷遇
    start_date: 0809
    highlight_event_id: guji-李绛-event-809-bei
  decisions:
  - date: 0807
    title_zh: 请以李锜家赀代浙西百姓租赋
    rationale: 锜诛求六州怨入骨髓，若复辇其财入京非遏乱绥困之义，请悉赐本道代租以慰人心
  - date: 0808-03
    title_zh: 请以急递付度支盐铁传送赦书
    rationale: 中使散遣必受馈遗以裒财，改付有司急递既疾速又息求取之弊，不可循旧
  - date: 0809
    title_zh: 上疏罢安国寺圣德碑
    rationale: 大人与天地合德岂文字可尽，尧舜至文武不立碑而秦皇刻峄山为后世笑，游观崇饰非政宜故请罢
- id: guji-李绛-endeavor-2
  title_zh: 宰辅经略藩镇
  summary: 拜相后筹划魏博淮西河中诸镇，厘朋党、节进献、练兵制，持重抚纳以收藩镇
  phases:
  - key: brewing
    name: 户部理财
    labels:
      zh: 户部侍郎判本司
    start_date: 0810
    highlight_event_id: guji-李绛-event-811-zaixiang
  - key: breakthrough
    name: 初秉国钧
    labels:
      zh: 同中书门下平章事
    start_date: 0811
    highlight_event_id: guji-李绛-event-811-zaixiang
  - key: climax
    name: 抚定魏博
    labels:
      zh: 推诚授田兴节钺
    start_date: 0812
    highlight_event_id: guji-李绛-event-812-tianxing
  - key: closure
    name: 谤兴历藩
    labels:
      zh: 罢相历镇至山南西道
    start_date: 0814
    highlight_event_id: guji-李绛-event-830-jianan
  decisions:
  - date: 0812
    title_zh: 主张即授田兴节度使并厚赐六州军
    rationale: 魏博久外王化，一日挈六州归当推诚抚纳，若持节往探则制在彼，厚赏可激人心破两河胆
  - date: 0811
    title_zh: 论朋党以别君子小人
    rationale: 君子同道非党，小人趋利为朋，借朋党以锢善将如汉末党锢亡天下，宜察而任贤
  - date: 0813
    title_zh: 请分隶神策镇兵于本道
    rationale: 京西北神策坐仰衣食不使战，临事禀中尉失机，分隶本道则号令齐一可应变
events:
- id: guji-李绛-event-birth
  title_zh: 生于赞皇李氏
  date: '0764'
  year_of: 764
  description: 李绛字深之，本贯赞皇，后擢进士及宏辞科
  location_zh: 赞皇
- id: guji-李绛-event-807-hanlin
  title_zh: 授翰林学士知制诰论李锜财赋
  date: 0807
  year_of: 807
  description: 元和二年授翰林学士俄知制诰，会李锜诛，与裴垍谏请以籍没财物代浙西贫民租赋，宪宗从之
  location_zh: 长安
- id: guji-李绛-event-809-bei
  title_zh: 上疏罢安国寺圣德碑
  date: 0809
  year_of: 809
  description: 吐突承璀盛修安国寺请立碑纪圣德并欲遗钱千万求文，绛言圣德无分限、秦碑为失道之戒，宪宗悟命百牛倒石
  location_zh: 长安
- id: guji-李绛-event-811-zaixiang
  title_zh: 拜中书侍郎同中书门下平章事
  date: 0811
  year_of: 811
  description: 元和六年罢学士迁户部侍郎，帝欲相之，承璀忌毁被出为淮南监军，翌日拜相封高邑男
  location_zh: 长安
- id: guji-李绛-event-812-tianxing
  title_zh: 决策抚纳田兴复魏博六州
  date: 0812
  year_of: 812
  description: 田季安死子怀谏弱，众议讨伐，绛料其必推宽厚素爱者立，请即授田兴节度并斥禁钱百五十万缗赐其军，魏博遂归命
  location_zh: 长安
- id: guji-李绛-event-830-jianan
  title_zh: 山南西道节度使遇害
  date: '0830-06-08'
  year_of: 830
  description: 文宗大和四年奉诏募兵千人赴蜀御南蛮，监军杨叔元遣人讹言收募直而还为民致军乱，绛握节登陴不肯缒城而免，与牙将王景延同死，年六十七，赠司徒谥贞
  location_zh: 兴元府
- id: guji-李绛-event-death
  title_zh: 卒于兴元军乱
  date: '0830-06-08'
  year_of: 830
  description: 同上，遇害后谏官列冤，追赠司徒，宝历初图形凌烟阁独留中，大中初甥夏侯孜授蒋偕次论事为七篇
  location_zh: 兴元府
