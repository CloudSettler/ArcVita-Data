      raw: 约武宗会昌初卒
  birth_date: 约772
  death_date: 约841
  era: 唐（中晚唐）
  reign_ref: 历贞元至会昌间诸朝，序自署开成五年（840，文宗之末年）
  archetype: 古文家·笔记史家（旧题《卓异记》作者）
  dilemmas:
  - 名姓三题，或题李翱、或作陈翱、又作陈翰，真伪难定
  - 序署开成五年而书内两称武宗，序年月疑后人妄加
  - 以卓异名中宗、昭宗废而复辟之事，扬善与史识相悖
  - 神仙鬼怪末得谛言，姑存其说以谓无害于教化
  lesson: 守道不挠，立言行己，真贯白日；记事须核实名与年月，扬善亦当有识。
  summary_first_person: 吾翱所撰《卓异记》，纪皇唐帝功瓌特奇伟、臣下盛事超绝殊常者，自广随所闻见，杂载其事，不以次第；开成五年七月十一日，予在檀溪，序而志之，不俟繁书，以见意。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8D%93%E5%BC%82%E8%AE%B0.html
