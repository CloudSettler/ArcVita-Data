    title_zh: 七龄即诗以忧世自期
    rationale: 自七岁缀诗笔不为雕虫而以观民风为志奠定诗史根基
  - date: '0751'
    title_zh: 献三大礼赋以求用世
    rationale: 值天宝盛世借礼赋陈雅正冀得君行道而非徒事声律
  - date: '0767'
    title_zh: 夔州期以律细写艰难
    rationale: 居夔三百余作转以严律细刻民生寓国忧于咏物更臻老严之境
