  - date: '0746'
    title_zh: 天宝六载下第不附权门
    rationale: 李林甫试皆下之而诳称野无遗贤不肯附势苟进守白衣以待真用
  - date: '0757'
    title_zh: 上疏救房琯触怒肃宗
    rationale: 明知直谏见忌而以义救荐主不惜贬逐以全君臣之谊
  - date: 0759
    title_zh: 关辅饥弃华州司功西去
    rationale: 干元饥荒官卑禄薄不忍尸素遂度陇入秦同谷转入蜀以存家族
  - date: '0762'
    title_zh: 辞京兆功曹就严武幕府
    rationale: 再辟剑南参谋可得庇蜀中而距朝争遣家眷获暂安遂受检校工部员外郎
