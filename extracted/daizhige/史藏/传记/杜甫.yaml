  dilemmas:
  - 仕隐之间欲致君尧舜而屡试不第当献赋求官还是退而立言
  - 乱世漂泊中当依附节镇以求安稳还是扁舟江湖以保气节
  - 诗歌当追逐绮丽以媚时流还是直书时艰以存史实
  lesson: 文章千古事当以忧国恤民为根不以一时得失易其志
  summary_first_person: 吾杜甫字子美号少陵野老生于开元癸丑少学诗赋壮游齐赵天宝献三大礼赋而授官逢安史陷贼复归拜拾遗弃官漂泊入蜀营草堂于成都后依严武为剑南参谋晚自夔峡出荆湘以诗存史白首不移今回顾一生时危而笔不辍道穷而志愈坚
  source_urls:
