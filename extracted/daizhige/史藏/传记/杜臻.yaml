  decisions:
  - date: '1684-01-05'
    title_zh: 首图次粤次闽后附澎台
    rationale: 巡历由广达闽为序，台湾未亲履则据咨访附录，以存体例之真
  - date: '1684-04-01'
    title_zh: 据目见不拾舆记
    rationale: 缕列形势兵制得其要领，并考山水题咏以资博览，迥别摭拾
events:
- id: guji-杜臻-event-birth
  title_zh: 出生
  date: '1633'
  description: 约崇德八年生于浙江秀水，少力学登进士入仕
- id: guji-杜臻-event-1683-mission
  title_zh: 奉命巡视粤闽
  date: '1683-10-22'
  description: 兵部议请开界，旨令差部院堂官会督抚详察防守，杜臻以工部尚书与内阁学士石柱受命往粤闽
- id: guji-杜臻-event-1684-yue-start
  title_zh: 抵粤勘界招垦
  date: '1684-01-05'
  description: 正月抵广州，与总督吴兴祚巡抚李士桢会商，出示晓谕原主归业、无主听垦、三年起科，并议沿海三路防汛
- id: guji-杜臻-event-1684-min-inspection
  title_zh: 入闽会勘海防
  date: '1684-03-15'
  description: 粤事粗定即赴福建，会将军施烺等议定投诚安置与海坛金厦诸戍，复核汛墩台兵额
- id: guji-杜臻-event-1684-closure
  title_zh: 巡视竣事
  date: '1684-05-01'
  description: 自上年十一月戊寅陛辞启程至是年五月事竣，沿海形势营伍多寡俱得要领，驿疏具奏
- id: guji-杜臻-event-1684-book
  title_zh: 成《粤闽巡视纪略》六卷
  date: '1684-05-15'
  description: 以所经理大略为书，首沿海总图，次粤略三卷、闽略二卷、附纪澎湖台湾一卷，乾隆四十五年收入四库全书
- id: guji-杜臻-event-death
  title_zh: 逝世
  date: '1692'
  description: 康熙三十一年卒，历官工部尚书，以奉使经略海疆及纪略传世
