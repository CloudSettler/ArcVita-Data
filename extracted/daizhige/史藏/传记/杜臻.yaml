  decisions:
  - date: '1683-11-01'
    title_zh: 奏请随勘随垦
    rationale: 恐逾春耕，急宣德意令有司即招民承佃，三年后起科，不待覆旨
  - date: '1683-11-11'
    title_zh: 先粤后闽以不误农时
    rationale: 粤地先熟且闽方安置投诚，错时并进可两不相妨，闽土节候稍迟
  - date: '1684-01-05'
    title_zh: 分遣诸臣分路查阅
    rationale: 沿海三千七百里广袤，分西路钦廉至东路潮碣以详核营伍与田亩
- id: guji-杜臻-endeavor-2
  title_zh: 编纂《粤闽巡视纪略》存海防要领
  description: 将巡历所见沿海形势、营伍制度、兵数多寡、山川古迹排日记载，绘总图列粤略三卷闽略二卷并附澎台一卷，以备周爰咨诹
