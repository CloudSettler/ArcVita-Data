    highlight_event_id: guji-杨士奇-event-1403-ru-ge
  - key: breakthrough
    name: 侍讲春坊
    labels:
      zh: 东宫讲学
    start_date: '1404'
    highlight_event_id: guji-杨士奇-event-1404-shi-jiang
  - key: climax
    name: 论道正学
    labels:
      zh: 焚邪显正
    start_date: '1405'
    highlight_event_id: guji-杨士奇-event-1405-lun-xue
  - key: closure
    name: 辅贰监国
    labels:
      zh: 巡狩留辅
    start_date: '1406'
    highlight_event_id: guji-杨士奇-event-1406-fu-jian-guo
  decisions:
  - date: '1404'
    title_zh: 请焚朱季友诋毁濓洛之书
    rationale: 恐邪说惑众，惑乱士心，请即焚毁以一学术
  - date: '1409'
    title_zh: 据实奏对太子孝敬可托社稷
    rationale: 成祖问东宫所行及高煦夺嫡，直陈太子事宗庙谨祭祀知过能改，得解疑忌
- id: guji-杨士奇-endeavor-2
  title_zh: 历事四朝匡定国是
  summary_zh: 洪熙进华盖殿大学士赐绳愆纠缪印，宣德谏阻袭赵王、力主弃交阯、荐顾佐振台纲，正统以少师同知经筵为朝廷耆定
  phases:
  - key: brewing
    name: 洪熙受顾
    labels:
      zh: 绳愆密疏
    start_date: '1424'
    highlight_event_id: guji-杨士奇-event-1424-hongxi
  - key: breakthrough
    name: 宣德定难
    labels:
      zh: 全赵弃交
    start_date: '1426'
    highlight_event_id: guji-杨士奇-event-1426-xuande
  - key: climax
    name: 举贤恤民
    labels:
      zh: 振纪宽诏
    start_date: '1428'
    highlight_event_id: guji-杨士奇-event-1428-jian-xian
  - key: closure
    name: 正统元老
    labels:
      zh: 少师经筵
    start_date: '1435'
    highlight_event_id: guji-杨士奇-event-1435-shao-shi
  decisions:
  - date: '1426'
    title_zh: 执不可袭赵王
    rationale: 太宗三子惟赵王在，上亲叔也，有罪不可赦无罪当加厚，以慰在天
  - date: '1427'
    title_zh: 议弃交阯郡县
    rationale: 交阯荒服外唐虞三代所不有，十余年兵民困弊，体祖宗初心弃之乃盛德事
events:
- id: guji-杨士奇-event-birth
  date: '1365'
  year_of: '1365'
  title_zh: 生于江西泰和
  description: 名寓以字行，曾祖景行元待制，幼孤力学，浮章贡登鄂渚黄鹤，与蒋隐溪游，有幽人贞士之志
  era: 明
  reign_ref: 洪武
- id: guji-杨士奇-event-1403-ru-ge
  date: '1403'
  year_of: '1403'
  title_zh: 简入文渊阁为编修
  description: 成祖履极擢国史编修，简入文渊阁预机务，转侍讲兼春坊左中允，预撰文华殿讲义
  era: 明
  reign_ref: 永乐
- id: guji-杨士奇-event-1404-shi-jiang
  date: '1404'
  year_of: '1404'
  title_zh: 侍东宫撰进周易直指
  description: 命侍东宫讲学，撰易本义要旨以进，皇太子悦赐名周易直指，又校正真德秀文章正宗
  era: 明
  reign_ref: 永乐
- id: guji-杨士奇-event-1405-lun-xue
  date: '1405'
  year_of: '1405'
  title_zh: 论尧典大学并请焚邪书
  description: 对成祖论尧典一章具大学全书，次年朱季友献书诋訾濓洛，请焚其书毋使惑众
  era: 明
  reign_ref: 永乐
- id: guji-杨士奇-event-1406-fu-jian-guo
  date: '1406'
  year_of: '1406'
  title_zh: 扈从巡狩辅监国
  description: 永乐六年冬车驾巡狩北京，命辅皇太子监国南京，后于右顺门奏陈太子孝敬及高煦留守南京之意
  era: 明
  reign_ref: 永乐
- id: guji-杨士奇-event-1424-hongxi
  date: '1424-09-07'
  year_of: '1424'
  title_zh: 进太子少傅兼华盖殿大学士赐绳愆纠缪印
  description: 仁宗继统进礼部侍郎兼华盖殿大学士，赐银章曰绳愆纠缪，许密疏言事，屡谏减香炭赋、罢释服用乐等皆见纳
  era: 明
  reign_ref: 洪熙
- id: guji-杨士奇-event-1426-xuande
  date: '1426'
  year_of: '1426'
  title_zh: 谏止袭赵王并议弃交阯
  description: 宣宗亲征高煦平，陈山请乘胜袭赵王，持不可得免；廷议黎利请立陈氏后，力主弃交阯郡县以息民
  era: 明
  reign_ref: 宣德
- id: guji-杨士奇-event-1428-jian-xian
  date: '1428'
  year_of: '1428'
  title_zh: 荐顾佐振台纪草宽恤诏
  description: 都御史刘观下狱，举通政使顾佐代之台纪遂振；宣德五年草宽恤诏多所裨益，夜谏微行获盗验
  era: 明
  reign_ref: 宣德
- id: guji-杨士奇-event-1435-shao-shi
  date: '1435'
  year_of: '1435'
  title_zh: 进少师同知经筵
  description: 正统初进少师同知经筵事，赐牙章曰贞一，展墓还乡，子稷坐事逮系，英宗赐玺书慰以礼自处
  era: 明
  reign_ref: 正统
- id: guji-杨士奇-event-death
  date: '1444'
  year_of: '1444'
  title_zh: 卒年八十赠太师谥文贞
  description: 卒于官，年八十，赠特进光禄大夫左柱国太师谥文贞，官其子穟为尚宝丞，著有沙羡稿石台稿东里集等
  era: 明
  reign_ref: 正统
