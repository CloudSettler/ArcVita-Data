  reign_ref: 永乐至正统
  archetype: 阁辅重臣
  dilemmas:
  - title_zh: 靖难后出处抉择
    description: 约与周是修殉节故主，终择出仕新朝以存身行道，授王府审理后入翰林
  - title_zh: 高煦夺嫡与赵王保全
    description: 面对汉王觊觎储位及宣宗欲乘胜执赵王，当直言匡正并保全宗亲
  lesson: 持正守直以事四朝，绳愆纠缪，讷言敏行，方为社稷之臣
  summary_first_person: 余泰和杨寓以字行，少孤力学，初授王府审理，靖难后简入文渊阁，由编修历侍讲、谕德，侍东宫讲易，辅监国南京，历事成祖、仁宗、宣宗、英宗四朝，赐绳愆纠缪印以密疏言事，谏止重赋，靖高煦之乱而全赵邸，议弃交阯以息兵民，终进少师华盖殿大学士
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/殿阁词林记.md
  - https://daizhige.org/史藏/传记/殿阁词林记.html
  - https://ctext.org/wiki.pl?if=gb&res=563326
