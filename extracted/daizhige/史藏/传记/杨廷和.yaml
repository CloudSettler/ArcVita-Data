person:
  qid: guji-杨廷和
  name_zh: 杨廷和
  names:
    zh: 杨廷和
    en: Yang Tinghe
  lifespan:
    birth:
      date: '1459'
      precision: year
      is_circa: false
      raw: 天顺三年生于四川新都
    death:
      date: 1529-07
      precision: month
      is_circa: false
      raw: 嘉靖八年六月卒
  birth_date: '1459'
  death_date: 1529-07
  era: 明
  reign_ref: 嘉靖
  archetype: 定策首辅
  dilemmas:
  - 权阉刘瑾、钱宁、江彬迭擅威福，是委曲弥缝以存国体，还是直言抗争以蹈祸
  - 武宗无嗣晏驾，迎立兴世子与诛除江彬手握重兵，是速定大策以安社稷，还是循常以避嫌疑
  - 嘉靖大礼议中，循孝宗继统之正与顺新君生恩之私如何抉择
  - 首辅权位极重，是专断以成事，还是退让以全大臣之体
  lesson: 居相位者当以宗社为重，临大变则定策如山，持大礼则守经不回，虽宠辱異势而是非自有定论
  summary_first_person: 余介夫，新都人也。少负公辅之望，入翰林事孝宗、武宗，值刘瑾窃柄，委蛇其间以济时艰，擒安化、讨流贼、制钱宁。武宗崩，与蒋冕等定策迎兴世子，诛江彬，革正德蠹政十四万余人。世宗欲考兴献而去本生之称，余持兄终弟及、继统不继嗣之礼，封还御批三十余疏，终不合而乞归。相业虽以大礼见黜，然定国本、清阉祸，庶几无愧于古大臣云。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%98%89%E9%9D%96%E4%BB%A5%E6%9D%A5%E9%A6%96%E8%BE%85%E4%BC%A0.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%98%89%E9%9D%96%E4%BB%A5%E6%9D%A5%E9%A6%96%E8%BE%85%E4%BC%A0.html
  - https://ctext.org/library.pl?if=gb&file=wb494928
endeavors:
- id: guji-杨廷和-endeavor-1
  title_zh: 危朝辅政与定策靖难
  summary_zh: 正德间入阁参机，弥缝刘瑾之祸，平定藩贼与流寇，武宗崩后定策迎立、诛江彬、革蠹政，以镇静持重安天下
  phases:
  - key: brewing
    name: 入直文渊
    labels:
      zh: 酝酿
    start_date: 1507-08
    highlight_event_id: guji-杨廷和-event-ruge
  - key: breakthrough
    name: 弥缝救剂
    labels:
      zh: 突破
    start_date: 1510-09
    highlight_event_id: guji-杨廷和-event-pingzei
  - key: climax
    name: 定策迎立诛彬
    labels:
      zh: 高潮
    start_date: 1521-03
    highlight_event_id: guji-杨廷和-event-dingce
  - key: closure
    name: 厘革新政
    labels:
      zh: 收束
    start_date: 1521-05
    highlight_event_id: guji-杨廷和-event-gexin
  decisions:
  - date: 1510-10
    title_zh: 安化王乱中请擢仇钺离贼党
    rationale: 借贼中将领反正，不以大兵速剿而以计擒首恶
  - date: 1512-02
    title_zh: 荐陆完、彭泽代马中锡平流贼
    rationale: 文士不可将兵，易以知兵之臣方能平河南、河北群盗
  - date: '1521-04-14'
    title_zh: 袖祖训迎兴世子并密谋诛江彬
    rationale: 以兄终弟及定国本，以分屯京营、诱彬入西华门一举除肘腋大患
  - date: '1521-05-01'
    title_zh: 拒削诏草厘革正德蠹政
    rationale: 不从司礼删去关内政条目，悉革锦衣冒滥、皇店、豹房诸弊以正国法
- id: guji-杨廷和-endeavor-2
  title_zh: 持礼抗议与引退
  summary_zh: 嘉靖初主持大礼议，坚称当后孝宗而以兴献为皇叔考，与张璁、桂萼新贵相持，累谏织造斋醮，终以不合致仕
  phases:
  - key: brewing
    name: 礼议初起
    labels:
      zh: 酝酿
    start_date: 1521-07
    highlight_event_id: guji-杨廷和-event-dali-yiqi
  - key: breakthrough
    name: 封还御批
    labels:
      zh: 突破
    start_date: 1521-09
    highlight_event_id: guji-杨廷和-event-fenghuan
  - key: climax
    name: 织造斋醮之争
    labels:
      zh: 高潮
    start_date: 1523-06
    highlight_event_id: guji-杨廷和-event-zhizao
  - key: closure
    name: 三疏乞休
    labels:
      zh: 收束
    start_date: 1524-02
    highlight_event_id: guji-杨廷和-event-qixiu
  decisions:
  - date: '1521-07-15'
    title_zh: 定兴献王为皇叔考兴国太王
    rationale: 以继统不继嗣、后孝宗为天子之义，防以小宗入大宗之乱
  - date: '1523-10-01'
    title_zh: 拒撰苏杭织造敕
    rationale: 以民困财竭、洪武无织造为例，谓恩幸不可复开
  - date: '1524-02-20'
    title_zh: 累疏乞骸骨归新都
    rationale: 言路劾而上意已移，知大礼不可挽，不如全大臣去就之节
events:
- id: guji-杨廷和-event-birth
  title_zh: 生于四川新都
  date: '1459'
  year_of: 1459
  description: 天顺三年生，美风姿，性沈静详审，十二举乡试，十九成进士，改庶吉士，以考究掌故民瘼边事负公辅望
  location_zh: 四川新都
- id: guji-杨廷和-event-ruge
  title_zh: 召入文渊阁参预机务
  date: 1507-08
  year_of: 1507
  description: 武宗初自南京户部尚书召还，兼文渊阁大学士参预机务，委曲于刘瑾、焦芳之间小有救剂
  location_zh: 北京文渊阁
- id: guji-杨廷和-event-pingzei
  title_zh: 荐将平定刘六刘七及河南赵鐩之乱
  date: 1511-06
  year_of: 1511
  description: 劾罢马中锡，荐陆完、彭泽分讨流贼，复预策擒安化王朱寘鐇，贼渐平，加少师太子太师华盖殿大学士
  location_zh: 京师及河南
- id: guji-杨廷和-event-dingce
  title_zh: 武宗崩定策迎兴世子并诛江彬
  date: '1521-04-14'
  year_of: 1521
  description: 正德十六年三月武宗晏驾于豹房，袖皇明祖训示兄终弟及，与蒋冕、毛纪、司礼魏彬、张永合谋分兵守九门，诱江彬入西华门缚之下诏狱，使梁储迎兴世子于安陆
  location_zh: 北京豹房及紫禁城
- id: guji-杨廷和-event-gexin
  title_zh: 草登极诏厘革正德蠹政
  date: '1521-05-01'
  year_of: 1521
  description: 草新天子即位诏，拒司礼删改，尽革锦衣内监旗校工役十四万八千七百人，减漕粮百五十余万石，革钱宁、江彬党羽，正王琼等罪
  location_zh: 北京奉天殿
- id: guji-杨廷和-event-dali-yiqi
  title_zh: 大礼议起持继统不继嗣
  date: '1521-07-10'
  year_of: 1521
  description: 上欲加隆兴献王与蒋妃，廷和议当后孝宗称皇考，献王为皇叔考兴国太王，兴国太妃，别立崇仁王奉祀，与张璁继统不继嗣之说相持
  location_zh: 北京内阁
- id: guji-杨廷和-event-fenghuan
  title_zh: 三封还御批力争称考
  date: '1521-10-01'
  year_of: 1521
  description: 前后执奏几三十疏，封还御批者四，廷和持不可者三，上以桂萼、张璁疏骤迁其官，礼部执奏不听
  location_zh: 北京文渊阁
- id: guji-杨廷和-event-zhizao
  title_zh: 谏止斋醮与苏杭织造
  date: 1523-08
  year_of: 1523
  description: 上留意斋醮，廷和引梁武、宋徽为喻；中贵请遣官督苏杭织造，廷和不奉撰敕，极言民困财竭，洪武无此例
  location_zh: 北京
- id: guji-杨廷和-event-qixiu
  title_zh: 乞休致仕归新都
  date: '1524-02-20'
  year_of: 1524
  description: 累疏乞休，上责以因辞归咎，赐玺书续廪邮护，给锦衣卫指挥使荫子，蒋冕代为首辅
  location_zh: 北京至四川新都
- id: guji-杨廷和-event-death
  title_zh: 卒于新都家
  date: 1529-07
  year_of: 1529
  description: 嘉靖七年以明伦大典成被诬削职为民，明年卒，年七十，隆庆初赠太保谥文忠，子慎戍云南
  location_zh: 四川新都
