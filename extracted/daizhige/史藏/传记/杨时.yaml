person:
  qid: guji-杨时
  name_zh: 杨时
  names:
    zh: 杨时
    en: Yang Shi
  lifespan:
    birth:
      date: '1053'
      precision: year
      is_circa: true
      raw: 熙宁九年二十四岁推算约生于1053年
    death:
      date: 1135-04
      precision: month
      is_circa: false
      raw: 绍兴五年四月卒
  birth_date: '1053'
  death_date: 1135-04
  era: 宋
  reign_ref: 熙宁至绍兴
  archetype: 道南理学宗师
  dilemmas:
  - 浮沉禄仕四十九载与杜门讲学传道之间如何取舍
  - 晚年七十余应召入朝救时与明哲保身之间如何抉择
  - 王氏新学盛行取科之际坚持程氏正学而见辟于众如何自处
  lesson: 道南一脉在乎师承不绝与躬行实践，立朝则以正君心收人心为本，传学则以静中体认大本为要
  summary_first_person: 吾本将乐杨氏子，少弃科宦而师事明道伊川，得闻理一分殊之旨。程门立雪不敢少懈，归闽杜门讲授，推明中庸大学之道。晚岁载道入朝，论祖宗法度、辟王氏邪说、排靖康和议，虽仅九十日谏垣而知无不言。及归林泉，惟以著书讲学为事，庶几延津一脉不坠耳。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%97%BD%E4%B8%AD%E7%90%86%E5%AD%A6%E6%B8%8A%E6%BA%90%E8%80%83.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%97%BD%E4%B8%AD%E7%90%86%E5%AD%A6%E6%B8%8A%E6%BA%90%E8%80%83.html
endeavors:
- id: guji-杨时-endeavor-1
  name_zh: 师事二程载道南来
  description: 自熙宁弃官不赴，遍历颍昌洛阳师事明道伊川，得道南真传，归闽讲学开一代理学先河
  phases:
  - key: brewing
    name: 颍昌谒明道
    labels:
      zh: 弃官求道
    start_date: '1081'
    highlight_event_id: guji-杨时-event-study-mingdao
  - key: breakthrough
    name: 洛阳事伊川立雪
    labels:
      zh: 程门立雪
    start_date: '1092'
    highlight_event_id: guji-杨时-event-lixue
  - key: climax
    name: 杜门著述阐发师说
    labels:
      zh: 归闽授徒
    start_date: '1098'
    highlight_event_id: guji-杨时-event-return-min
  - key: closure
    name: 道南脉络大明
    labels:
      zh: 龟山讲席
    start_date: '1100'
    highlight_event_id: guji-杨时-event-teaching-guishan
  decisions:
  - date: '1081'
    title_zh: 辞徐州司法不赴而师事明道
    rationale: 不求禄仕以明道学，谓仕不足以行道必先得圣贤心传
  - date: '1092'
    title_zh: 年四十复师事伊川于洛侍立雪中
    rationale: 闻西铭理一分殊之旨未透，必亲炙伊川而后豁然
  - date: '1098'
    title_zh: 归将乐杜门不仕沈潜经书
    rationale: 推广二程之说务极其趣，待学成而后出以淑後进
- id: guji-杨时-endeavor-2
  name_zh: 浮沉州县晚岁谏垣匡国
  description: 历知浏阳余杭萧山诸县有惠政，政和末以秘书郎召为迩英说书，靖康间擢右谏议大夫兼国子祭酒，力辟王氏驳和议
  phases:
  - key: brewing
    name: 历任州县
    labels:
      zh: 循吏之治
    start_date: '1094'
    highlight_event_id: guji-杨时-event-zhiliuyang
  - key: breakthrough
    name: 召入迩英
    labels:
      zh: 经筵说书
    start_date: '1116'
    highlight_event_id: guji-杨时-event-mishulang
  - key: climax
    name: 靖康谏议
    labels:
      zh: 谏垣九十日
    start_date: '1126'
    highlight_event_id: guji-杨时-event-jianyi
  - key: closure
    name: 告老归隐著书
    labels:
      zh: 林泉讲学
    start_date: '1127'
    highlight_event_id: guji-杨时-event-retire
  decisions:
  - date: '1116'
    title_zh: 应诏以秘书郎入对论祖宗法度
    rationale: 欲条举祖宗宜今之法一趋于中以弭熙丰党祸
  - date: '1126'
    title_zh: 上疏力排割三镇和议并请出师
    rationale: 河朔为京师藩篱不可弃，宜命将出师不可专守和议
  - date: '1126'
    title_zh: 请追夺王安石王爵毁配享
    rationale: 安石学术邪说启靖康之祸必正其学术以端士习
events:
- id: guji-杨时-event-birth
  title_zh: 生于将乐
  date: '1053'
  year_of: '1053'
  description: 其先京兆人五世祖唐末入闽寓南剑将乐遂家焉，推熙宁九年二十四岁计约生于1053年
  location: 南剑州将乐
- id: guji-杨时-event-study-mingdao
  title_zh: 谒程明道于颍昌
  date: '1081'
  year_of: '1081'
  description: 元丰四年授徐州司法不赴，以师礼谒见程明道先生于颍昌，明道送之谓人曰吾道南矣
  location: 颍昌
- id: guji-杨时-event-lixue
  title_zh: 程门立雪事伊川
  date: '1092'
  year_of: '1092'
  description: 元祐八年年四十师事伊川于洛，一日伊川瞑坐与游定夫侍立不去及觉门外雪深一尺，始闻理一分殊豁然无疑
  location: 洛阳
- id: guji-杨时-event-zhiliuyang
  title_zh: 知浏阳县
  date: '1094'
  year_of: '1094'
  description: 绍圣元年知浏阳县，期满寓浏阳，历官所至皆有惠政
  location: 浏阳
- id: guji-杨时-event-return-min
  title_zh: 归闽杜门讲学
  date: '1098'
  year_of: '1098'
  description: 元符二年归家杜门不仕者累年沈浸经书推广师说，沙阳陈渊投书问学四方从游者称龟山先生
  location: 将乐
- id: guji-杨时-event-teaching-guishan
  title_zh: 讲学龟山德望日重
  date: '1107'
  year_of: '1107'
  description: 政和初待次毘陵萧山间讲学，四方之士不远千里从游德望日重
  location: 余杭毘陵
- id: guji-杨时-event-mishulang
  title_zh: 以秘书郎召为迩英说书
  date: '1116'
  year_of: '1116'
  description: 政和六年以秘书郎召迁著作郎入对陈熙丰更法之弊，徽宗首肯除迩英殿说书陈论时政十余条
  location: 开封
- id: guji-杨时-event-jianyi
  title_zh: 靖康擢右谏议大夫兼国子祭酒
  date: '1126'
  year_of: '1126'
  description: 钦宗即位擢右谏议大夫，极言和议之非请罢免夫花石之害，论三镇不可割，驳王氏经学请夺王安石配享，谏官冯澥诋之遂罢为给事中请祠去
  location: 开封
- id: guji-杨时-event-retire
  title_zh: 高宗朝告老致仕
  date: '1130'
  year_of: '1130'
  description: 高宗即位除工部侍郎兼侍讲劝上典学纳谏，寻以龙图阁直学士予祠归家优游林泉著书讲学
  location: 将乐
- id: guji-杨时-event-death
  title_zh: 卒于家
  date: 1135-04
  year_of: '1135'
  description: 绍兴五年四月卒年八十三，赠左中大夫后赠少师谥文靖，所著有三经义辨龟山文集等，明成化从祀孔庙国朝康熙赐额程氏正宗
  location: 将乐
