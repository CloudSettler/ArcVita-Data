  lesson: 守正持宽、勤敏不怠，抚民绥边重信义，方能辅四朝而全令名
  summary_first_person: 余初名子荣，起自建安诸生，入翰林典机密四十年，历事四圣，掌制草、总裁实录、扈从北征，知边将强弱、民情休戚，务以宽恕抚绥为先，虽贵盛不敢弛敬慎，惟冀后人以仁厚辅国
