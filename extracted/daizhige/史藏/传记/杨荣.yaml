  title_zh: 内阁辅政总裁史典
  summary: 永乐初入内阁典机密，侍四朝，掌制敕、经筵、总裁太祖以下实录及性理大全，兼掌翰林、春坊，决大政
  phases:
  - key: brewing
    name: 翰林初入
    labels:
      zh: 编修侍讲
    start_date: '1402'
    highlight_event_id: guji-杨荣-event-1402-ruge
  - key: breakthrough
    name: 入阁典密
    labels:
      zh: 七人内阁
    start_date: '1403'
    highlight_event_id: guji-杨荣-event-1405-gansu
  - key: climax
    name: 扈从北征掌军务
    labels:
      zh: 帐殿参决
    start_date: '1421'
    highlight_event_id: guji-杨荣-event-1421-beizheng
  - key: closure
    name: 三朝辅弼进少师
    labels:
      zh: 文敏致荣
    start_date: '1435'
    highlight_event_id: guji-杨荣-event-death
  decisions:
  - date: '1403'
    title_zh: 谏止褒奖韩观急进兵
    rationale: 吉安奏已复业，计韩观尚在中道，未可遽褒，当核实而后赏罚以安民
  - date: '1418'
    title_zh: 谏寝复征江西旧民兵
    rationale: 复业已二十年复征失信，且亲藩所奏不可轻信，止之以存国信
  - date: '1418'
    title_zh: 密陈十弊指斥五府六部
    rationale: 朝臣狎恩多纵，欲以抗直纠缪而清政本
- id: guji-杨荣-endeavor-2
  title_zh: 绥边抚寇经略四裔
  summary: 奉使甘肃议边、处置降部封宁远侯，论饷道险阻罢陕西出师，抚谕闽浙山寇以代大兵
  phases:
  - key: brewing
    name: 初使甘肃察守备
    labels:
      zh: 议边察防
    start_date: '1405'
    highlight_event_id: guji-杨荣-event-1405-gansu
  - key: breakthrough
    name: 持节封赏来归
    labels:
      zh: 册封宁远
    start_date: '1409'
    highlight_event_id: guji-杨荣-event-1409-fenghou
  - key: climax
    name: 论罢陕西剿寇
    labels:
      zh: 止兵恤饷
    start_date: '1414'
    highlight_event_id: guji-杨荣-event-1414-bashu
  - key: closure
    name: 招抚闽浙山寇
    labels:
      zh: 单使抚谕
    start_date: '1422'
    highlight_event_id: guji-杨荣-event-1422-fuyu
  decisions:
  - date: '1414'
    title_zh: 奏请罢李彬陕西剿娄达罕
    rationale: 饷道险阻冱寒人疲马瘠，边地不足烦王师，宜旋师待其自归
  - date: '1422'
    title_zh: 请遣一敕使抚谕丽水政和山寇
    rationale: 愚民为有司所苦而出不得已，兵出则良民先被害，单使抚谕足定
  - date: '1421'
    title_zh: 奏定番王额森图罕来归之议
    rationale: 审酌降情议定以安西陲，奏称旨而定边
