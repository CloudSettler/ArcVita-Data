endeavors:
- id: guji-linbu-endeavor-1
  title_zh: 孤山结庐隐居
  description: 放游江淮后归钱塘，结庐西湖孤山，二十年不入城市，以隐操自守，朝廷屡旌而不仕
  phases:
  - key: brewing
    name: 游学归隐
    labels:
      zh: 游历
    start_date: 0985
    highlight_event_id: guji-linbu-event-study
  - key: breakthrough
    name: 孤山定居
    labels:
      zh: 结庐
    start_date: '1008'
    highlight_event_id: guji-linbu-event-hermitage
  - key: climax
    name: 朝廷旌礼
    labels:
      zh: 赐帛
    start_date: '1010'
    highlight_event_id: guji-linbu-event-imperial_gift
  - key: closure
    name: 终老孤山
    labels:
      zh: 善终
    start_date: '1028'
    highlight_event_id: guji-linbu-event-death
  decisions:
  - date: '1008'
    title_zh: 决不入仕坚守孤山
    rationale: 真宗闻名赐粟帛诏州县岁时劳问，仍以林泉为志不就征辟以全隐节
  - date: '1015'
    title_zh: 不娶无子以梅鹤为伴
    rationale: 恐家累妨志，托情梅鹤，绝欲守清，得以专一于诗道
- id: guji-linbu-endeavor-2
  title_zh: 诗学著述与弃稿
  description: 善行草，为诗孤峭澄淡，稿就辄弃，耻于求名，后人辑为林和靖集，临终明志无封禅书
  phases:
  - key: brewing
    name: 刻志为学
    labels:
      zh: 习学
    start_date: 0980
    highlight_event_id: guji-linbu-event-study
  - key: breakthrough
    name: 诗风形成
    labels:
      zh: 成风
    start_date: '1015'
    highlight_event_id: guji-linbu-event-poetry
  - key: climax
    name: 封禅遗议
    labels:
      zh: 遗诗
    start_date: 1028-10
    highlight_event_id: guji-linbu-event-final_poem
  - key: closure
    name: 身后谥和靖
    labels:
      zh: 易名
    start_date: 1028-11
    highlight_event_id: guji-linbu-event-posthumous
  decisions:
  - date: '1015'
    title_zh: 作诗辄弃不录以传
    rationale: 以终志林泉不欲取名于时更不欲求名于后世故藏拙守淡任其散佚
  - date: 1028-10
    title_zh: 临终明志无封禅书
    rationale: 作诗言茂陵他日求遗草犹喜曾无封禅书示一生不媚权贵以清节自终
