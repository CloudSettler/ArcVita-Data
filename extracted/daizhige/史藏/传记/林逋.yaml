  birth_date: 0967
  death_date: '1028'
  era: 宋
  reign_ref: 宋真宗至仁宗
  archetype: 隐逸诗人
  dilemmas:
  - 仕隐之择：应诏出仕还是坚守孤山林泉之志
  - 名实之辨：诗文传世求名与自弃稿不欲取名于时的矛盾
  lesson: 守志不迁以梅鹤自适方得身后清名
  summary_first_person: 吾少孤力学，放游江淮归隐西湖孤山，不娶不仕，以梅为妻以鹤为子，真宗赐粟帛不就，二十年足迹不入城市，诗成辄弃，终老湖山而无愧，临终犹喜平生无封禅书以媚时。
  source_urls:
