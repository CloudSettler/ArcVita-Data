    title_zh: 与同里诸子创十二翁月课自为风气
    rationale: 不欲为时俗所移，欲以砥砺相规，自见其学
  - date: '1625-01-01'
    title_zh: 拒乡达舆访裹面不见
    rationale: 自以学未工，恐释己就人，必自守乃有所立
  - date: '1645-01-01'
    title_zh: 甲申后闭门不仕以讲学著述自晦
    rationale: 以门户藏身，不以危疑荒废初业，存身而存道
