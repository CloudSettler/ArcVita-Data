  - date: '1660-01-01'
    title_zh: 分经术与词章轻重专以表章自任
    rationale: 不居道德之名，而以著述有用为归，入情入理以见圣贤生面
events:
- id: guji-查继佐-event-birth
  date: '1601-07-04'
  year_of: '1601'
  title_zh: 生于海宁东山
  description: 明万历二十九年辛丑秋七月初四酉时生于浙江海宁龙山之西审山下，世居东山，遂称东山先生
  is_birth: true
- id: guji-查继佐-event-gezhi
  date: '1610-01-01'
  year_of: '1610'
  title_zh: 幼悟格致反复水浒与国策
  description: 十岁时借阅水浒有悟，母以桑条去皮火壮启之，遂每事求理，留心格致，读国策悟水浒所出
- id: guji-查继佐-event-xianshi
  date: '1618-01-01'
  year_of: '1618'
  title_zh: 应县试名继佑误作佐遂称继佐
  description: 戊午年十八应县试，本名继佑，以册误书佐遂仍之，初字三秀更字支三号伊璜，别号钓史钓玉与斋
- id: guji-查继佐-event-monthly
  date: '1622-01-01'
  year_of: '1622'
  title_zh: 创十二翁月课
  description: 壬戌年二十二与许效翁祝天孙沈闻大等同里诸子创月课号十二翁，衣冠异俗，讲学自立风气
- id: guji-查继佐-event-qiuwei
  date: '1627-09-01'
  year_of: '1627'
  title_zh: 秋闱受知马腾仲几夺浙首
  description: 丁卯年二十七赴秋闱，房师马腾仲拟以其卷领浙首，为主司抑置第二，马称宁落为后科第一人
- id: guji-查继佐-event-yimin
  date: '1645-01-01'
  year_of: '1645'
  title_zh: 明亡隐居讲学著史
  description: 甲申后不仕，惧祸藏身，以讲席授徒，闭门著鲁春秋国寿录罪惟录东山国语等，以私史存文献
- id: guji-查继佐-event-writing
  date: '1655-01-01'
  year_of: '1655'
  title_zh: 诸著区分先甲后甲等身有余
  description: 所著分先甲集后甲集，兼及说外说造说难诸编及通鉴严辑八卷，讲录洗发精义，为诸儒所向
- id: guji-查继佐-event-death
  date: '1676-01-01'
  year_of: '1676'
  title_zh: 卒于家
  description: 清康熙十五年卒，墓在海宁袁镇南十一庄慎字号黄泥潭南岸旧居之南，生圹原在八字桥，今称新坟
  is_death: true
