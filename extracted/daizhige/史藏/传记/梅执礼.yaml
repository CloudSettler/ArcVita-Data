  location: 浦阳
  description: 先世吴兴人五代讳耸始迁浦阳，家故贫幼丧父，母胡氏教以读书
- id: guji-梅执礼-event-jinshi
  title_zh: 登崇宁五年进士第
  date: '1106'
  year_of: '1106'
  precision: year
  is_circa: false
  raw: 中崇宁五年进士第
  location: 汴京
  description: 调常山尉未赴，以荐为详定三司敕令删定官，俄迁九域志编修官，秩满除武学博士亲挟弧矢为诸生率
- id: guji-梅执礼-event-bibu
  title_zh: 为比部员外郎辨茶券诈伪
  date: '1110'
  year_of: '1110'
  precision: year
  is_circa: true
  raw: 比部勾稽时事
  location: 汴京
  description: 苑吏持茶券三百万以杨戬矫旨迫取，执礼一阅知妄欲白长贰疑不敢乃独列上果诈
- id: guji-梅执礼-event-chuzhou
  title_zh: 知滁州蠲炭盐惠民
  date: '1124'
  year_of: '1124'
  precision: year
  is_circa: true
  raw: 以显谟阁待制徙知滁州后
  location: 滁州
  description: 奏免淮南代输洛炭谓滁林亦尽经四十年洛都当复，又请减抑配盐额二十万，滁人德之绘像祠焉
- id: guji-梅执礼-event-hubu
  title_zh: 拜户部尚书省内廷浮费
  date: 1126-11
  year_of: '1126'
  precision: month
  is_circa: false
  raw: 钦宗立后自镇江召改户部时
  location: 汴京
  description: 请禁内钱隶有司六宫廪给由度支，小黄门持中批御封不用玺取钱者奏责典宝夫人杖黄门，月省浮费三十万
- id: guji-梅执礼-event-quanqinzheng
  title_zh: 劝钦宗亲征请宫眷出避
  date: 1126-12
  year_of: '1126'
  precision: month
  is_circa: true
  raw: 金人抵阙时
  location: 汴京
  description: 劝帝亲征而请太上帝后皇后太子皆出避，用事者沮之
- id: guji-梅执礼-event-gensuo
  title_zh: 主根索结军法拒金帅要索
  date: 1127-01
  year_of: '1127'
  precision: month
  is_circa: false
  raw: 金人质帝于营邀金缯数百千万时
  location: 汴京金营
  description: 与陈知质程振安扶主根索，哀民力已困议以军法结罪窒其求，宦者告金帅城中七百万户可索，金帅怒杖胡舜陟等百
- id: guji-梅执礼-event-jieyijun
  title_zh: 密结军民十余万谋夺万胜门
  date: '1127-02-10'
  year_of: '1127'
  precision: day
  is_circa: true
  raw: 被害前旬日内
  location: 汴京
  description: 以母属兄弟，与吴革宗室子昉以振给为名团结军民不旬日得十余万，王时雍徐秉哲使范琼泄其谋
- id: guji-梅执礼-event-death
  title_zh: 被金人挝杀枭首殉国
  date: 1127-02
  year_of: '1127'
  precision: month
  is_circa: false
  raw: 靖康二年二月
  location: 汴京金营门外
  description: 金帅呼下马挝杀之枭其首，是日天宇昼冥士庶陨涕，后高宗赠通奉大夫端明殿学士加资政殿学士谥节愍，著文集十五卷
