person:
  qid: guji-梅执礼
  name_zh: 梅执礼
  names:
    zh: 梅执礼
    en: Mei Zhili
  lifespan:
    birth:
      date: '1079'
      precision: year
      is_circa: true
      raw: 靖康二年二月卒年四十九逆推约生于元祐末
    death:
      date: 1127-02
      precision: month
      is_circa: false
      raw: 靖康二年二月被金帅挝杀枭首
  birth_date: '1079'
  death_date: 1127-02
  era: 北宋
  reign_ref: 宋徽宗崇宁至宋钦宗靖康
  archetype: 忠义死节之臣
  dilemmas:
  - 以人言而得必以人言而失，不往谒宰相以求自立，甘处冷局
  - 金帅索金缯无艺极，以军法结罪窒求则必蹈死，不结则民力尽空
  - 母训忠孝难两全，主辱臣死当刳心上报与顾全老母冲突
  lesson: 仕宦当以公义驳正为职，临财不妄，临难不苟，忠义一激虽鼎镬在后亦必得死而后安
  summary_first_person: 余幼孤贫赖母胡氏教以读书，幸登崇宁进士，自删定武学历比部度支给事以至户部，见权幸矫旨则独奏其诈，见民困则请蠲炭盐，至二帝蒙尘金人无度要索，余与同列结军法以塞命，又与吴革辈密结十余万众欲夜捣万胜门迎二帝归，事泄见杀，虽枭首亦无恨，惟求无愧君亲而已
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/浦阳人物记.md
  - https://daizhige.org/史藏/传记/浦阳人物记.html
endeavors:
- id: guji-梅执礼-endeavor-1
  title_zh: 中央历官厘奸与郡邑惠政
  role: 删定官至户部尚书
  summary: 自崇宁五年进士起历三司敕令武学国子比部度支给事礼部，驳正林摅等权幸，辨茶券诈伪，知滁州蠲炭减盐，入户部归禁内钱于有司月省三十万
  phases:
  - key: brewing
    name: 初入删定武学砺节
