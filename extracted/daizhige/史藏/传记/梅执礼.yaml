      zh: 萌芽
    start_date: '1106'
    highlight_event_id: guji-梅执礼-event-jinshi
  - key: breakthrough
    name: 比部辨诈给事封驳
    labels:
      zh: 突破
    start_date: '1110'
    highlight_event_id: guji-梅执礼-event-bibu
  - key: climax
    name: 知滁蠲赋绘像祠祀
    labels:
      zh: 高潮
    start_date: '1123'
    highlight_event_id: guji-梅执礼-event-chuzhou
  - key: closure
    name: 户部统度支革内廷滥取
    labels:
      zh: 收束
    start_date: 1126-11
    highlight_event_id: guji-梅执礼-event-hubu
  decisions:
  - date: '1110'
    title_zh: 辨茶券诈取三百万
    rationale: 一阅知杨戬矫旨为妄，长贰疑不敢，独列上果诈，杜滥取以护邦财
  - date: '1118'
    title_zh: 驳林摅孟昌龄杨戬张佑
    rationale: 以给事中封驳不使僣赏夺民庐留役肆奸得行，虽触权要亦不行制敕
  - date: '1124'
    title_zh: 奏免代输洛炭减盐二十万
    rationale: 察滁林已尽且历四十年洛林当复，赋盐倍粟民不堪，请损额以苏民困
- id: guji-梅执礼-endeavor-2
  title_zh: 靖康抗金谋迎与死节
  role: 户部尚书主根索兼密结义军
  summary: 金人抵阙质钦宗邀金缯数百千万，与陈知质程振安扶结军法窒求，劝帝亲征请宫眷出避，密与吴革宗室子昉结军民十余万欲夺万胜门夜捣敌营迎二帝，为王时雍徐秉哲范琼泄谋被害
  phases:
  - key: brewing
    name: 劝亲征请宫眷出避
    labels:
      zh: 萌芽
    start_date: 1126-11
    highlight_event_id: guji-梅执礼-event-quanqinzheng
  - key: breakthrough
    name: 主根索结军法拒索
    labels:
      zh: 突破
    start_date: 1127-01
    highlight_event_id: guji-梅执礼-event-gensuo
  - key: climax
    name: 密结十余万图夜袭万胜门
    labels:
      zh: 高潮
    start_date: '1127-02-05'
    highlight_event_id: guji-梅执礼-event-jieyijun
  - key: closure
    name: 金营挝杀枭首殉国
    labels:
      zh: 收束
    start_date: 1127-02
    highlight_event_id: guji-梅执礼-event-death
  decisions:
  - date: 1126-12
    title_zh: 劝帝亲征请太上帝后太子出避
    rationale: 欲全宗社示死守之志，不为和议所沮，使金人不敢轻图
  - date: 1127-01
    title_zh: 与同列结军法以绝金索
    rationale: 民力已困铜铁亦不能给，不如以死塞命，不妄取于民
  - date: '1127-02-10'
    title_zh: 以母属兄弟起兵图迎二帝
    rationale: 母言忠孝难两全受国厚恩宜刳心上报，遂决计团结军民夜捣敌营
