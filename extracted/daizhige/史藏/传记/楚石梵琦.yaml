  decisions:
  - date: 1365
    title_zh: 作西斋净土诗一卷
    rationale: 明唯心净土自性弥陀 如有个弥陀在自心 以诗偈显般若 令禅者不浅视净土 生决定信愿
  - date: 1368
    title_zh: 示众以禅机显净土
    rationale: 知学人根器不一 举古德公案评唱 痛斥空解倡真修 以念佛摄禅 以禅显净 令学者即生死而证菩提
events:
- id: guji-楚石梵琦-event-birth
  title_zh: 生于宁波象山朱氏
  date: 1296
  location: 宁波府象山县
  description: 元贞二年生 姓朱氏 年九岁授经于讷翁谟公
- id: guji-楚石梵琦-event-ordination
  title_zh: 十六剃染阅楞严有省
  date: 1311
  location: 象山
  description: 年十六剃染为僧 阅楞严经有省 发心参究大事
- id: guji-楚石梵琦-event-awakening
  title_zh: 随元叟入京闻鼓开悟
  date: 1325
  location: 京师
  description: 随元叟端公入京 闻西楼鼓声汗如雨下 作偈捉得红炉一点雪却是黄河六月冰 见元叟得许可
- id: guji-楚石梵琦-event-abbot
  title_zh: 勉赴报恩寺住持
  date: 1335
  location: 报恩寺
  description: 报恩虚席以待 勉赴住持 举扬正法无愧妙喜 形躯短小神观精朗
- id: guji-楚石梵琦-event-xizhai
  title_zh: 筑室西斋为终焉计
  date: 1360
  location: 报恩寺西斋
  description: 于报恩寺筑室西斋扁曰西斋 为退隐净修之所 后以此弘阐净土法门
- id: guji-楚石梵琦-event-pureland-poems
  title_zh: 作西斋净土诗
  date: 1365
  location: 西斋
  description: 作西斋净土诗一卷 如有个弥陀在自心才生一念隔千岑 阐明唯心净土自性弥陀 袾宏誉为本朝第一流宗师
- id: guji-楚石梵琦-event-teaching-pureland
  title_zh: 上堂普说示众禅净
  date: 1368
  location: 报恩寺
  description: 上堂小参普说示众 举僧问干峰及云门拄杖等公案评唱 以禅机显净土 以净土摄禅 呵斥空解倡真修
- id: guji-楚石梵琦-event-yulu
  title_zh: 六会语录行世
  date: 1370
  location: 报恩寺
  description: 平生上堂示众普说拈颂题咏等结为六会语录流通 后世奉为明初禅净典范
- id: guji-楚石梵琦-event-death
  title_zh: 示寂于洪武三年
  date: 1370
  location: 报恩寺
  description: 世寿七十五僧腊六十三示寂 生于元示寂于本朝 袾宏特录为皇明名僧之首
