  archetype: 禅净兼弘宗师
  dilemmas:
  - 禅悟与净土归向如何圆融不二
  - 住持名刹弘法与筑室西斋退隐如何抉择
  lesson: 禅净不二 自心即弥陀 悟后犹须真修实证 看破生死无常 方得自在往生
  summary_first_person: 吾名梵琦字楚石 象山朱氏子 九岁授经十六剃染 阅楞严有省 随元叟端公入京闻西楼鼓声汗如雨下 作偈捉得红炉一点雪却是黄河六月冰 得元叟许可 勉赴报恩住持 筑室西斋为终焉计
    形虽短小神观精朗 举扬正法无愧妙喜 作西斋净土诗一卷 六会语录行世 愿学者直下承当莫空度此生
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/皇明名僧辑略.md
  - https://daizhige.org/史藏/传记/皇明名僧辑略.html
