  era: 北宋
  reign_ref: 宋太宗、宋真宗（相我二宗、三相必首）
  archetype: 直言敢谏、以德事君的贤相
  dilemmas:
  - 坚守用人成命与触怒君主之间的冲突
  - 直谏灾异与个人安危荣辱之间的取舍
  - 辞让荫恩与家族利益之间的抉择
  lesson: 为臣者以守法度、存大体、不媚上意为本，进则以道，退必以礼。
  summary_first_person: 我以进士入仕，三度为相。帝怒投我奏书于地，我拾笏纳书而不易所选之人；上元观灯帝称盛世，我以城外饥寒谏之；西北兵事，我用汉武、唐文之悔止其议。子荫官制，我恳辞而改为着例。熈陵役作，我衰绖哭于境上，出私钱助营陵。晚年罢相归洛，琴觞自肆，终被两朝绝等之眷遇。
  source_urls:
  - 名臣碑传琬琰之集
