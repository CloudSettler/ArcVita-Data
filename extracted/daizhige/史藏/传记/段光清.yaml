      raw: 同治八年后
  birth_date: '1798'
  death_date: '1869'
  era: 清
  reign_ref: 道光
  archetype: 循吏
  dilemmas:
  - 催科征缓与灾荒存恤之间如何达民情而不激变
  - 乡宦名片请托与狱讼曲直之间是否徇情
  - 巡段声势扰民与安静清勤之间何者得民心
  - 邪巫猖兵惑众与正理救人之间如何以法破术
  lesson: 通达民情为居官第一要，安静不扰、以正治邪，狱讼必原情而断，不以势徇
  summary_first_person: 余镜湖段光清，太湖人，嘉庆庚辰后历睹旱水与挨风，悟天灾人治相因。道光间以大挑一等分发浙江，自武林门外清勤夜巡不扰民，不凭乡宦名片枉法，清厘严州监狱不取程仪；乡里则惩贼诬陋习置经费田，碎猖兵狱罐以救童魂。一生以达民情、守安静为用，撰年谱以自省示后。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%95%9C%E6%B9%96%E8%87%AA%E6%92%B0%E5%B9%B4%E8%B0%B1.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%95%9C%E6%B9%96%E8%87%AA%E6%92%B0%E5%B9%B4%E8%B0%B1.html
  - https://ctext.org/library.pl?if=gb&file=wb3587100
endeavors:
- id: guji-段光清-endeavor-1
  title_zh: 浙省候补与亲民治狱
  summary: 以大挑入浙，历武林巡段、钱塘问案、清厘监狱至署理建德，以安静清勤、不徇私情为治
  phases:
  - key: brewing
    name: 大挑一等分发浙江
    labels:
      zh: 赴浙候补
    start_date: '1844-05-01'
    highlight_event_id: guji-段光清-event-1844-fenfa
  - key: breakthrough
    name: 武林门外清勤夜巡
    labels:
      zh: 安静巡段
    start_date: '1845-07-01'
    highlight_event_id: guji-段光清-event-1845-xunduan
  - key: climax
    name: 不徇名片讯断轿夫案
    labels:
      zh: 不徇情面
    start_date: '1845-08-01'
    highlight_event_id: guji-段光清-event-1845-wenan
  - key: closure
    name: 清厘严州监狱署建德
    labels:
      zh: 署县任事
    start_date: '1846-05-01'
    highlight_event_id: guji-段光清-event-1846-jianyu
  decisions:
  - date: '1845-07-01'
    title_zh: 拒用差役地保自提灯步巡
    rationale: 察差役地保借巡段索娼赌陋规扰民，故弃马椅刑杖仅携常随步行至五更以安静换民信
  - date: '1845-08-01'
    title_zh: 不以乡宦名片定罪释放轿夫
    rationale: 狱讼当据原委断曲直若凭名片则屈平民，故明其无奸拐情实仅索工钱顶撞不予责罚
  - date: '1846-05-01'
    title_zh: 清厘六县监狱不收程仪
    rationale: 奉抚宪为太夫人祈福而清狱当体祈福之心以洁净禁狱、禁需索自修福，不取陋例程仪
- id: guji-段光清-endeavor-2
  title_zh: 乡里救荒正俗与破邪救人
  summary: 自幼睹旱荒挨风，立救荒园，革除嘱贼诬赃与相验扰民旧弊，亲破猖兵狱罐救人以正治邪
  phases:
  - key: brewing
    name: 睹旱荒与挨风之变
    labels:
      zh: 救荒萌念
    start_date: '1820-05-01'
    highlight_event_id: guji-段光清-event-1820-hanhuang
  - key: breakthrough
    name: 议给捕役经费禁诬扳
    labels:
      zh: 革除恶习
    start_date: '1837-09-01'
    highlight_event_id: guji-段光清-event-1837-wuzang
  - key: climax
    name: 碎狱罐救效篁破猖兵
    labels:
      zh: 以正治邪
    start_date: '1843-10-01'
    highlight_event_id: guji-段光清-event-1843-changbing
  - key: closure
    name: 自撰年谱以示后鉴
    labels:
      zh: 存史鉴
    start_date: '1868-01-01'
    highlight_event_id: guji-段光清-event-1868-nianpu
  decisions:
  - date: '1837-09-01'
    title_zh: 集乡敛经费畀捕役并置田永济
    rationale: 佃人被嘱贼诬赃类嘉庆验尸扰民恶习，宜以岁给数千使勤缉而戒诬，既救眼前亦绝后患
  - date: '1843-10-01'
    title_zh: 收符书碎狱罐救人
    rationale: 石姓武生聚众猖兵招读书人生魂致效篁危殆，须以送官究治相迫缴回十余狱罐尽碎以活人并警乡里
events:
- id: guji-段光清-event-birth
  title_zh: 出生
  date: '1798'
  year_of: '1798'
  location: 安徽太湖
  description: 段光清生于嘉庆三年，字明俊号镜湖，太湖段氏子弟
- id: guji-段光清-event-1820-hanhuang
  title_zh: 监割见荒命家啜粥
  date: '1820-05-01'
  year_of: '1820'
  location: 太湖佃庄
  description: 嘉庆二十五年大旱秋成无收，奉父命往佃庄监割，见农家捞水草掘土虾充饥，归告父，家遂岁以粥应灾
- id: guji-段光清-event-1837-wuzang
  title_zh: 捕役嘱贼诬赃议经费
  date: '1837-09-01'
  year_of: '1837'
  location: 太湖救荒园
  description: 佃人邻里被诬接贼赃，上溯嘉庆初验尸扰民旧弊，请集绅衿议岁给捕役经费以禁诬扳，后置田数十亩，邑尊叹作官之难
- id: guji-段光清-event-1840-jingshi
  title_zh: 进京会试经芜湖巢县
  date: '1840-01-01'
  year_of: '1840'
  location: 芜湖、巢县柘皋
  description: 道光二十年进京会试迂道巢县清理木账，观芜湖税关木商会馆之盛，后为贼燹所毁
- id: guji-段光清-event-1843-changbing
  title_zh: 破猖兵碎狱罐救效篁
  date: '1843-10-01'
  year_of: '1843'
  location: 祈雨山、救荒园老学堂
  description: 石姓武庠生聚众抬龙王神猖兵招魂，致侄效篁病危，余收巫符书以送官相迫得狱罐十余尽碎而愈，乡里称活多人
- id: guji-段光清-event-1844-fenfa
  title_zh: 大挑一等分发浙江
  date: '1844-04-01'
  year_of: '1844'
  location: 北京圆明园
  description: 道光二十四年大挑列一等，经惠亲王奏训、圆明园引见，分发浙江候补
- id: guji-段光清-event-1845-xunduan
  title_zh: 武林门外总巡安静夜巡
  date: '1845-07-01'
  year_of: '1845'
  location: 杭州武林门外法华庵
  description: 奉首府委武林门外总巡，独用常随二人自提灯步行至五更，不用差役地保马椅刑杖，不索娼赌陋规，民称未见如此清勤安静
- id: guji-段光清-event-1845-wenan
  title_zh: 问轿夫案不徇乡宦名片
  date: '1845-08-01'
  year_of: '1845'
  location: 杭州钱塘县署
  description: 赵姓绅士夹名片诬轿夫奸拐婢女，余讯无实释放不责，后首府亲提亦不得异供，遂不复以夹名片案相委
- id: guji-段光清-event-1846-jianyu
  title_zh: 清厘严州六县监狱
  date: '1846-05-01'
  year_of: '1846'
  location: 严州府六县
  description: 奉抚臬委清厘监狱，力求清洁严禁看役需索，不收县送程仪以体抚宪为太夫人祈福之意
- id: guji-段光清-event-1868-nianpu
  title_zh: 自撰年谱至同治七年
  date: '1868-01-01'
  year_of: '1868'
  location: 太湖镜湖
  description: 年谱记事至同治七年戊辰，备载灾荒、吏治、科场、狱讼诸弊与亲历治绩以示后人
- id: guji-段光清-event-death
  title_zh: 逝世
  date: '1869'
  year_of: '1869'
  location: 安徽太湖
  description: 同治年间卒于乡，年谱后未续，享年七十余
