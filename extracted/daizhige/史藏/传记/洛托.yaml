endeavors:
- id: guji-洛托-endeavor-1
  title_zh: 宗室从征与早期军历
  description: 自天聪八年从上征明至崇德八年以罪削爵幽禁，随诸王转战明、朝鲜及松锦前线
  phases:
  - key: brewing
    name: 初从征明
    labels:
      zh: 从征启程
    start_date: 1634-09
    highlight_event_id: guji-洛托-event-1634
  - key: breakthrough
    name: 封贝子与征朝鲜
    labels:
      zh: 封爵扬名
    start_date: 1636-12
    highlight_event_id: guji-洛托-event-1636
  - key: climax
    name: 松锦决战
    labels:
      zh: 横击溃军
    start_date: 1642-08
    highlight_event_id: guji-洛托-event-1642
  - key: closure
    name: 失律获罪幽禁
    labels:
      zh: 削爵幽禁
    start_date: 1643-08
    highlight_event_id: guji-洛托-event-1643
  decisions:
  - date: 1636-12
    title_zh: 从多铎围南汉山城歼朝鲜援兵
    rationale: 乘明朝鲜联动之机，以围城打援挫敌，保证征朝鲜之役速决
  - date: 1642-08
    title_zh: 塔山横击洪承畴溃军
    rationale: 太宗亲征松山大捷后，截击溃退明军以扩大战果、奠定锦州合围
- id: guji-洛托-endeavor-2
  title_zh: 宁南靖寇与安南征海寇
  description: 顺治八年复爵后领镶蓝旗都统，以宁南靖寇将军定黔湘、以安南将军破郑成功于江南，复振宗室军功
  phases:
  - key: brewing
    name: 复爵领旗
    labels:
      zh: 复起都统
    start_date: 1651-03
    highlight_event_id: guji-洛托-event-1651
  - key: breakthrough
    name: 宁南入黔湘
    labels:
      zh: 经略荆湘
    start_date: 1657-04
    highlight_event_id: guji-洛托-event-1657
  - key: climax
    name: 会师贵阳定黔
    labels:
      zh: 收复贵阳
    start_date: 1658-03
    highlight_event_id: guji-洛托-event-1658
  - key: closure
    name: 安南破郑功成
    labels:
      zh: 大破海寇
    start_date: 1660-07
    highlight_event_id: guji-洛托-event-1660
  decisions:
  - date: 1657-04
    title_zh: 受命宁南靖寇驻荆州与洪承畴商剿抚
    rationale: 当孙可望李定国据黔扰湘、明桂王授爵纷扰之际，择剿抚并用、先取巴东隘口以分化可望部众
  - date: 1660-07
    title_zh: 为安南将军偕车克达素征郑成功
    rationale: 海寇犯江宁既退，顺势渡江追击、合东南诸军扼海口以绝郑氏北犯
events:
- id: guji-洛托-event-birth
  title_zh: 诞生
  date: '1616'
  year_of: 1616
  description: 显祖宣皇帝曾孙、追谥和硕贝勒寨桑古第一子，约生于1616年，康熙四年卒年五十逆推
  place_zh: 盛京
- id: guji-洛托-event-1634
  title_zh: 天聪八年八月从上征明献俘
  date: 1634-09
  year_of: 1634
  description: 从太宗征明有功，籍所俘献于大同南西冈御营，初显军功
  place_zh: 大同南西冈
- id: guji-洛托-event-1636
  title_zh: 崇德元年封贝子并征朝鲜围南汉山
  date: 1636-12
  year_of: 1636
  description: 封固山贝子；十二月同贝勒多铎围南汉山城，歼朝鲜援兵八千、又败援兵五千
  place_zh: 南汉山城
- id: guji-洛托-event-1642
  title_zh: 松山塔山横击洪承畴溃军
  date: 1642-08
  year_of: 1642
  description: 太宗征松山大败洪承畴，洛托于塔山横击溃军；后复围锦州、克塔山
  place_zh: 塔山
- id: guji-洛托-event-1643
  title_zh: 以阴事讦发削爵幽禁
  date: 1643-08
  year_of: 1643
  description: 家人都塔里讦其阴事勘实，太宗以悖乱违法重挞之、削爵幽禁
  place_zh: 盛京
- id: guji-洛托-event-1651
  title_zh: 顺治八年复封三等镇国将军
  date: 1651-03
  year_of: 1651
  description: 顺治八年三月复封三等镇国将军，十三年五月补授镶蓝旗满洲都统
  place_zh: 京师
- id: guji-洛托-event-1657
  title_zh: 拜宁南靖寇将军驻荆州
  date: 1657-04
  year_of: 1657
  description: 命为宁南靖寇将军驻防荆州，与经略洪承畴商度剿抚，取心潭隘、渡巴东，降赵世超等
  place_zh: 荆州
- id: guji-洛托-event-1658
  title_zh: 会师常德收复黔湘贵阳
  date: 1658-03
  year_of: 1658
  description: 十五年三月会洪承畴师于常德，收沅陵泸溪等县，进沅州，守贵阳；十六年二月凯旋晋一等镇国将军加云骑尉
  place_zh: 贵阳
- id: guji-洛托-event-1660
  title_zh: 为安南将军大破郑成功
  date: 1660-07
  year_of: 1660
  description: 十七年七月命为安南将军同车克达素索浑征海寇郑成功，大破贼众，十一月师还
  place_zh: 江宁
- id: guji-洛托-event-death
  title_zh: 逝世
  date: 1665-04
  year_of: 1665
  description: 康熙四年四月卒，年五十
  place_zh: 京师
