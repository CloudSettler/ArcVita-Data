  name_zh: 剿抚流贼王左挂
  description: 崇祯二年，流贼王左挂掠宜川城堡，承畴剿之，俘斩三百余人。
  endeavor_id: guji-洪承畴-endeavor-1
- id: guji-洪承畴-event-governor-shaanxi
  date: '1631'
  year_of: 1631
  type: promotion
  name_zh: 擢陕西三边总督
  description: 崇祯四年，擢陕西三边总督，继续剿贼。
  endeavor_id: guji-洪承畴-endeavor-1
- id: guji-洪承畴-event-da-bai-zi-cheng
  date: '1636'
  year_of: 1636
  type: military
  name_zh: 大败李自成于渭南临潼
  description: 承畴率兵蹑自成，大败之于渭南、临潼；高迎祥旋被擒。
  endeavor_id: guji-洪承畴-endeavor-1
- id: guji-洪承畴-event-ji-liao
  date: '1642'
  year_of: 1642
  type: appointment
  name_zh: 授蓟辽总督
  description: 崇祯十二年，授蓟辽总督，与清军对峙于锦州、宁远一线。
  endeavor_id: guji-洪承畴-endeavor-1
- id: guji-洪承畴-event-song-shan-bei-fu
  date: '1642'
  year_of: 1642
  type: capture
  name_zh: 松山兵败被俘降清
  description: 松锦之战明军败绩，洪承畴困守松山，城破被俘，后降清，受清太宗礼遇。
  endeavor_id: guji-洪承畴-endeavor-2
- id: guji-洪承畴-event-jing-lue-jiang-nan
  date: '1645'
  year_of: 1645
  type: appointment
  name_zh: 奉命经略江南
  description: 顺治二年，以太子太保、兵部尚书兼右副都御史，总督军务，招抚江南各省。
  endeavor_id: guji-洪承畴-endeavor-2
- id: guji-洪承畴-event-jing-lue-xi-nan
  date: '1653'
  year_of: 1653
  type: appointment
  name_zh: 经略湖广云贵
  description: 顺治十年，受命经略湖南、广东、广西、云南、贵州，督师进剿南明抗清势力。
  endeavor_id: guji-洪承畴-endeavor-2
- id: guji-洪承畴-event-death
  date: '1665'
  year_of: 1665
  type: death
  name_zh: 洪承畴卒
  description: 康熙四年卒於京师，谥文襄；乾隆时被列入《贰臣传》。
