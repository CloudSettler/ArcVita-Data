person:
  qid: guji-王勃
  name_zh: 王勃
  names:
    zh: 王勃
    en: Wang Bo
  lifespan:
    birth:
      date: '0650'
      precision: year
      is_circa: true
      raw: 唐贞观二十四年，太原人，王通诸孙，六岁善辞章
    death:
      date: '0676'
      precision: year
      is_circa: false
      raw: 唐上元三年，省父赴交趾，舟入洋海溺死，年二十九
  birth_date: '0650'
  death_date: '0676'
  era: 唐
  reign_ref: 唐高宗麟德至上元年间
  archetype: 恃才傲物而英年早逝的悲剧才子
  dilemmas:
  - 才高锋芒与持重守官的冲突，恃才陵藉而见嫉于僚吏
  - 欲建功立业与放旷剑南山水的进退两难
  lesson: 绮丽恃才可惊座，然不精思慎行则易蹈祸机，才与命相惜方能久远
  summary_first_person: 吾王勃字子安，太原人也，文中子通之诸孙。六岁善辞章，对策高第，沛王府中戏檄斗鸡而见斥，流寓剑南，登山怀古。才虽绮丽而磨墨酣卧成腹稿，终以省父南海，道经洪州滕王阁，一挥而就落霞秋水之篇，岂料舟覆洋海，秀而不实，命也如何。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/唐才子传.md
  - https://ctext.org/library.pl?if=gb&file=97056&page=1
endeavors:
- id: guji-王勃-endeavor-1
  title_zh: 初唐四杰诗文革新
  summary_zh: 与杨炯卢照邻骆宾王齐名海内四杰，变徐庾绮靡余风，以绮丽雄壮之文开唐诗新格，称金帛盈积、笔耕衣织之才名
  phases:
  - key: brewing
    name: 幼敏成章
    labels:
      zh: 神童授官
    start_date: '0656-01-01'
    highlight_event_id: guji-王勃-event-duice
  - key: breakthrough
    name: 四杰齐名
    labels:
      zh: 雄踞文坛
    start_date: '0665-01-01'
    highlight_event_id: guji-王勃-event-sijie
  - key: climax
    name: 腹稿立就
    labels:
      zh: 磨墨酣饮
    start_date: '0670-01-01'
    highlight_event_id: guji-王勃-event-fugao
  - key: closure
    name: 集传后世
    labels:
      zh: 三十卷行世
    start_date: '0676-01-01'
    highlight_event_id: guji-王勃-event-jichuan
  decisions:
  - date: '0664-01-01'
    title_zh: 倚才作檄戏讽诸王斗鸡
    rationale: 少年恃才陵藉，不顾朝廷忌讳，以文才游戏王府，遂召高宗震怒见斥
  - date: '0670-01-01'
    title_zh: 自言人子不可不知医，求补虢州参军
    rationale: 闻虢州多药草，欲得秘方济世兼自全，乃托医术以谋出路
- id: guji-王勃-endeavor-2
  title_zh: 仕宦浮沉与滕王阁绝唱
  summary_zh: 由朝散郎至沛王府修撰见废，客居剑南，匿官奴杀之几至死罪，因父左迁交趾而往省，途经南昌一序成千古
  phases:
  - key: brewing
    name: 入府修撰
    labels:
      zh: 沛王召署
    start_date: '0664-06-01'
    highlight_event_id: guji-王勃-event-duice
  - key: breakthrough
    name: 废居剑南
    labels:
      zh: 登山怀古
    start_date: '0667-01-01'
    highlight_event_id: guji-王勃-event-kebi
  - key: climax
    name: 腾阁挥毫
    labels:
      zh: 落霞秋水
    start_date: '0675-09-09'
    highlight_event_id: guji-王勃-event-tengwangge
  - key: closure
    name: 洋海溺没
    labels:
      zh: 省父而殒
    start_date: '0676-10-01'
    highlight_event_id: guji-王勃-event-death
  decisions:
  - date: '0667-01-01'
    title_zh: 匿死罪官奴而后杀之灭口
    rationale: 涉法徇情，恐事泄而行险，终致当诛逢赦除名，连累父左迁
  - date: '0675-09-09'
    title_zh: 滕王阁大会应请即席操觚
    rationale: 都督阎公欲婿作记夸盛，知吾才而相试，遂不让而文不加点以显才名
events:
- id: guji-王勃-event-birth
  title_zh: 生于太原王氏
  date: '0650-01-01'
  year_of: '0650'
  location_zh: 太原
  description_zh: 王通诸孙，六岁善辞章，时人目为神童
- id: guji-王勃-event-duice
  title_zh: 麟德初对策高第授朝散郎
  date: '0664-03-01'
  year_of: '0664'
  location_zh: 长安
  description_zh: 刘祥道表其材，对策高第，未冠授朝散郎，召署沛王府修撰
- id: guji-王勃-event-kebi
  title_zh: 斥出府客居剑南
  date: '0667-01-01'
  year_of: '0667'
  location_zh: 剑南
  description_zh: 为文檄英王鸡为高宗所怒斥出府，既废登山旷望，思诸葛之功赋诗见情
- id: guji-王勃-event-sijie
  title_zh: 与杨炯卢照邻骆宾王并称四杰
  date: '0670-01-01'
  year_of: '0670'
  location_zh: 长安
  description_zh: 效之者风靡，海内称四才子亦曰四杰，炯尝云耻居王后
- id: guji-王勃-event-fugao
  title_zh: 磨墨酣卧作腹稿
  date: '0672-01-01'
  year_of: '0672'
  description_zh: 属文先磨墨数升，酣饮覆面卧，寤即援笔成篇不易一字，金帛盈积以笔耕为食
- id: guji-王勃-event-tengwangge
  title_zh: 滕王阁作序
  date: '0675-09-09'
  year_of: '0675'
  location_zh: 洪州南昌滕王阁
  description_zh: 省父交趾途过南昌，会都督阎公九月九日大会，令婿作记，勃欣然对客操觚顷刻而就，落霞与孤鹜齐飞，秋水共长天一色，满座大惊，帅赠百缣
- id: guji-王勃-event-jichuan
  title_zh: 著集三十卷及舟中纂序
  date: '0675-12-01'
  year_of: '0675'
  description_zh: 有集三十卷及舟中纂序五卷行于世，时人谓之腹稿，才长命短有异人相其脑骨亏陷
- id: guji-王勃-event-death
  title_zh: 赴交趾省父溺死洋海
  date: '0676-10-01'
  year_of: '0676'
  location_zh: 洋海赴交趾途中
  description_zh: 父福畤坐匿官奴事左迁交趾令，勃往省觐，即举帆去至炎方舟入洋海溺死，时年二十九
