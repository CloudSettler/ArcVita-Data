  dilemmas:
  - 契丹入犯时扈从真宗亲征澶州，留守东京而城中暴疾，临危受命
  - 寇准求为使相，拒绝私请后又暗中荐举，遭怨恨而不自辨
  - 日者占问吉凶案中真宗盛怒欲穷治朝士，以身自请下狱救免众人
  lesson: 为相务行故事、慎所改作；用人必求其实，不以名誉；受人谤则引咎自归而不辨
  summary_first_person: 我王旦，字子明，大名莘人。太平兴国五年进士及第，历大理评事、知制诰、翰林学士，咸平三年知枢密院事，次年参知政事，景德三年拜相。当契丹请盟、二边罢兵之际，我务行祖宗故事，慎于改作，进退赏罚必当，真宗言无不听。用人必求其实，荐士众多而不令人知；寇准怨我，我为奏其贤使之愧服。蝗灾百官欲贺，我独以为不可；刘承规求节度使，我执不可。祥符间屡以疾请罢，真宗手自和药赐我，临终荐可为大臣者十余人。天禧元年薨于家，享年六十有一，谥文正。
  source_urls:
  - 名臣碑传琬琰之集·王文正公旦全德元老之碑（欧阳修）
