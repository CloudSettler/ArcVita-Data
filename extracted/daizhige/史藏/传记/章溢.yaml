  - title_zh: 请斩降将黄宗云等以徇
    rationale: 温别将先附后叛，按法当诛以伸军纪
  - title_zh: 力谏不宜调乡兵北伐
    rationale: 乡兵本为农民，曾许闽事平即归农，复调之则失信于民
  - title_zh: 建议籍勇农代乡兵从军
    rationale: 处州有归抚之趫勇好农者可用，既解北伐之需又不失信
