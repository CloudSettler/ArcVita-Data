  dilemmas:
  - 忠于新政与保全乡里乡兵信诺之间的冲突
  - 按法诛杀贼帅与招抚安民之间的权衡
  lesson: 言信行义，临难不苟，能以信义聚众、以谋略安民
  summary_first_person: 我章溢，字三益，龙泉人。元末乱世中我舍身救侄，募兵破贼；明太祖聘我出山，我以「不嗜杀人者能一之」进言，先后经营垦田、镇守处州、平定叛乱，官至御史中丞兼太子赞善大夫，最终因籍兵事操劳成疾而逝。
