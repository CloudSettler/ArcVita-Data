  description: 温之茗阳叛据险遮商旅，溢遣子存道破斩之；造海舟，籍渔户精锐得舟师千人戍青田，后诛败将任堆渊，再遣何世明击贼平之
  location_zh: 温州、青田
- id: guji-章溢-event-10
  person_id: guji-章溢
  type: endeavor
  precision: unknown
  description: 屏人议伐闽，对以李文忠取道建宁之策；闽平后拜御史中丞寻兼太子赞善大夫；力谏勿调乡兵北伐，复归籍觿勇农兵万五千以代，母卒后趣籍兵，竟以劳毁得疾而死
