person:
  qid: guji-mifu
  name_zh: 米芾
  names:
    zh: 米芾
    en: Mi Fu
  lifespan:
    birth:
      date: 约1051
      precision: year
      is_circa: true
      raw: 本传不载生年，据卒年五十七逆推，约当皇祐三年
    death:
      date: '1107'
      precision: year
      is_circa: false
      raw: 知淮扬军后弥年疡生其首而卒，年五十七，葬黄鹤山
  birth_date: 约1051
  death_date: '1107'
  era: 北宋
  reign_ref: 历仁宗至徽宗朝，皇祐、元丰、元祐、崇宁、大观间
  archetype: 痴绝翰墨、行止异常的书画全才
  dilemmas:
  - 率职与越法之间：至官率职不苟，时亦越法有所纵舍，吏道与性情相犯
  - 异行与官仪之间：冠服效唐人、居辄置水数颒自洁，雅不欲与人同，故为时论所忌
  - 艺名与禄位之间：尺缣寸纸一经品题价增数倍，而屡以言者论罢
  lesson: 痴于艺者当以职守自持——超然可成一家，越法终致罢黜；寄情山水翰墨，方能全其始终
  summary_first_person: 我米元章，自言黻即芾，太原人，父尝家襄阳，未几迁丹徒，国史遂书曰吴人。生而颖秀，六岁日读律诗百首，过目成诵；刻意文词，不剽袭前人，作字遒劲，晚更沉着，杂有晋唐风流。山水人物自成一家，精于鉴裁，一经品题价增数倍。元丰初以诗编贽见王安石，东坡尤爱重我。以母恩入仕，补校书郎、含光尉，知雍丘、涟水，入为太常博士，出知常州不赴，除知无为军，逾年召为书画学博士，擢礼部员外郎，旋以言者罢知淮扬军。家故饶财，既仕悉以分族人。过润爱其江山，遂定居焉，作宝晋斋，北固既火，结庵城东号海岳庵，日吟哦其间。弥年疡生其首而卒，年五十七，葬黄鹤山，诏赙其家百缣，仍官其子。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%BA%AC%E5%8F%A3%E8%80%86%E6%97%A7%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%BA%AC%E5%8F%A3%E8%80%86%E6%97%A7%E4%BC%A0.md
