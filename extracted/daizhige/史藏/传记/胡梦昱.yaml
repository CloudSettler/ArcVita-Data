    en: Hu Mengyu
  lifespan:
    birth:
      date: '1188'
      precision: year
      is_circa: true
      raw: 约吉水，嘉定丁丑进士推约生年
    death:
      date: 1227-07
      precision: month
      is_circa: true
      raw: 宝庆三年丙戌夏秋间卒于象州羁管所
  birth_date: '1188'
  death_date: 1227-07
  era: 宋
  reign_ref: 嘉定-宝庆
  archetype: 直谏忠臣
  dilemmas:
  - 位卑言高犯颜直谏与全身远祸的进退
  - 君臣分义当明与兄弟友爱当全的根本冲突
  - 沽名避谤缄默自保与恪守所学尽言的操守抉择
  lesson: 立国根本在孝友而非刑诛，讳言则危亡立至，友爱一念断续关乎天理人心与宗社安危
  summary_first_person: 吾吉水胡梦昱，字季昭，号竹林愚隐，嘉定丁丑进士，官大理评事。宝庆乙酉奉诏求直言，吾以济王赠典反汗为忧，历引周公待管蔡、太宗待秦邸为法，谓友爱不终必伤立国之本，痛陈济邸本心可矜、冤抑不散将召祸变，指望陛下与丞相回心补过。言既出，台谏以狂悖党逆劾之，遂追毁出身除名，羁管象州，复徙钦州，弟利用从行病殁，吾亦瘴殁象台。气节虽摧，天理人心终不可泯。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E8%B1%A1%E5%8F%B0%E9%A6%96%E6%9C%AB.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E8%B1%A1%E5%8F%B0%E9%A6%96%E6%9C%AB.html
  - https://ctext.org/library.pl?if=gb&file=wb721699
  - https://www.kanripo.org/text/KR2g0011/WYG
endeavors:
- id: guji-胡梦昱-endeavor-1
  title_zh: 孤贫力学与棘寺平狱
  summary_zh: 先世早丧，母织衽课读，嘉定丁丑登第后入棘寺为评事，披阅案牍以平恕为心，为后来的济邸直言积蓄法理与道义底蕴。
  phases:
  - key: brewing
    name: 惸惸茹苦力学
    labels:
      zh: 家贫课读
    start_date: '1188'
    highlight_event_id: guji-胡梦昱-event-birth
  - key: breakthrough
    name: 嘉定丁丑登第
    labels:
      zh: 进士及第
    start_date: '1217'
    highlight_event_id: guji-胡梦昱-event-jinshi
  - key: climax
    name: 棘寺断狱
    labels:
      zh: 明法恤刑
    start_date: '1224'
    highlight_event_id: guji-胡梦昱-event-pingshi
  - key: closure
    name: 阅济邸案生恻隐
    labels:
      zh: 恳忧发端
    start_date: 1225-08
    highlight_event_id: guji-胡梦昱-event-fengshi
  decisions:
  - date: '1217'
    title_zh: 赴试求第以振门户
    rationale: 践母训振家声，以科第为得君行道之阶
  - date: '1224'
    title_zh: 就职大理评事专心刑狱
    rationale: 以法官持平恕，欲以阅实案牍伸冤抑而培国本
  - date: '1225-08-15'
    title_zh: 决意披案草封事
    rationale: 见谢周卿等狱词知济王非本心，不忍畏祸缄默，作而复辍终欲冒死一鸣
- id: guji-胡梦昱-endeavor-2
  title_zh: 论济邸友爱与象台殉节
  summary_zh: 宝庆乙酉应诏上封事并书史弥远，力陈友爱为立国根本，请复追赠襃崇、存亡继绝以慰天心人心，遂触怒权要遭台谏连劾，贬死象州，其气节成南宋直臣典范。
  phases:
  - key: brewing
    name: 封事酝酿
    labels:
      zh: 稽古参法
    start_date: '1225-08-15'
    highlight_event_id: guji-胡梦昱-event-fengshi
  - key: breakthrough
    name: 乙酉封事上闻
    labels:
      zh: 直犯忌讳
    start_date: '1225-08-22'
    highlight_event_id: guji-胡梦昱-event-fengshi
  - key: climax
    name: 台谏连劾窜岭海
    labels:
      zh: 追毁羁管
    start_date: '1225-09-03'
    highlight_event_id: guji-胡梦昱-event-bianzhe
  - key: closure
    name: 象州祭弟殒身
    labels:
      zh: 瘴乡殉节
    start_date: '1227-05-23'
    highlight_event_id: guji-胡梦昱-event-death
  decisions:
  - date: '1225-08-22'
    title_zh: 上封事论济王追赠反汗
    rationale: 以祖宗友爱家法、齐威唐太宗为鉴，谓君臣各尽其责，宥过厚恩可安人心而消祸变
  - date: '1225-08-23'
    title_zh: 上书丞相史弥远申至亲之义
    rationale: 望执政以立爱惟亲立敬惟长开导上心，补过而非文过，推一家之友爱于天下
  - date: '1225-09-10'
    title_zh: 甘受追毁贬象不悔
    rationale: 席藁俟命，斧钺在前甘之如饴，不以祸福易所学
events:
- id: guji-胡梦昱-event-birth
  title_zh: 诞生吉水
  date: '1188'
  year_of: '1188'
  precision: year
  is_circa: true
  location_zh: 吉州吉水
  summary_zh: 约生于宋孝宗末至光宗时，父早世，母躬织衽课读，与兄梦弼弟利用共守家法。
- id: guji-胡梦昱-event-jinshi
  title_zh: 嘉定丁丑登进士第
  date: '1217'
  year_of: '1217'
  precision: year
  location_zh: 临安
  summary_zh: 嘉定十年丁丑进士，授官，号竹林愚隐，后入大理寺为评事。
- id: guji-胡梦昱-event-pingshi
  title_zh: 除大理评事披阅狱案
  date: '1224'
  year_of: '1224'
  precision: year
  location_zh: 临安大理寺
  summary_zh: 官大理评事，与少卿徐瑄同寅，阅谢周卿等诏狱案及京府沈伯括等案，知济王迫胁非本心。
- id: guji-胡梦昱-event-fengshi
  title_zh: 宝庆乙酉应诏上封事论济王
  date: '1225-08-22'
  year_of: '1225'
  precision: day
  location_zh: 临安
  summary_zh: 诏求直言，八月二十二日上封事数千言，以周公待管蔡、太宗待秦邸为法，请复追赠襃崇、降存亡继绝之诏散冤抑；复以副本上史弥远书论立爱立敬。
- id: guji-胡梦昱-event-bianzhe
  title_zh: 台谏劾奏追毁羁管象州
  date: '1225-09-03'
  year_of: '1225'
  precision: day
  location_zh: 临安至象州
  summary_zh: 监察御史李知孝劾为狂悖党逆，诏追毁出身以来文字除名勒停送象州羁管；次年司谏梁成大再劾，移送钦州编管，徐瑄亦连坐。
- id: guji-胡梦昱-event-jidi
  title_zh: 象州祭弟利用行
  date: '1227-05-23'
  year_of: '1227'
  precision: day
  location_zh: 象州
  summary_zh: 宝庆三年五月丁丑祭弟利用行十八，弟从贬岭海，为庸医治痔出血过多而死，梦昱同室异寝月余，悲痛撰文祭之。
- id: guji-胡梦昱-event-death
  title_zh: 卒于象州
  date: 1227-07
  year_of: '1227'
  precision: month
  is_circa: true
  location_zh: 象州
  summary_zh: 贬死象州瘴乡，宝庆元年追赠员外郎，咸淳三年追谥刚简，子知柔辑其奏疏遗文为象台首末五卷以传。
