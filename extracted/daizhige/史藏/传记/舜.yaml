  birth_date: 约-2233
  death_date: 约-2135
  era: 上古传说时代（尧舜时期）
  reign_ref: 嗣尧位为天子
  archetype: 至孝圣君
  dilemmas:
  - 父母与弟弟多次设计谋害自己，是报复疏远还是继续孝悌不怨
  - 身为平民受尧举荐试任百揆，能否在家庭仇怨与天下公义之间保持德行
  lesson: 遭遇至亲之恶而能谐柔孝敬、笃厚不怠，终以德行登于帝位
  summary_first_person: 我生于顽父嚚母之家，屡遭焚廪浚井之害而不怨，以孝德闻于四岳，受尧二女与百揆之试，终嗣帝位，封弟象于有庳，死葬苍梧。
  source_urls:
  - 新刊古列女传卷一之一·有虞二妃（刘向）
