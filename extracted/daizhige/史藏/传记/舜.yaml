  decisions:
  - date: 约-2180
    title_zh: 受四岳之荐，妻以二女而观其内
    rationale: 尧欲通过嫁女与历试百揆、宾四门、入大麓，考察舜的德行与才干。
  - date: 约-2160
    title_zh: 嗣位后封弟象于有庳，仍事瞽叟如初
    rationale: 不怨旧恶、笃厚不怠，以孝悌化天下。
events:
- id: guji-舜-event-birth
  date: 约-2233
  date_is_circa: true
  year_of: -2233
  type: birth
  title_zh: 舜生于顽父嚚母之家
  detail: 父号瞽叟，母憎舜而爱弟象。
- id: guji-舜-event-death
  date: 约-2135
  date_is_circa: true
  year_of: -2135
  type: death
  title_zh: 舜陟方，死于苍梧
  detail: 号曰重华，二妃死于江湘之间，俗谓之湘君。
- id: guji-舜-event-1
  date: 约-2230
  date_is_circa: true
  year_of: -2230
  type: endeavor
  title_zh: 承事瞽叟以孝，屡遭谋害而不怨
  detail: 父母使涂廪、焚廪，使浚井而掩之，与二女相谋得脱；终日饮酒不醉赖药浴之助；往于田号泣呼旻天，思慕不已。
- id: guji-舜-event-2
  date: 约-2180
  date_is_circa: true
  year_of: -2180
  type: breakthrough
  title_zh: 尧试之以百方
  detail: 纳于百揆、宾于四门、选于林木、入于大麓，每事常谋于二女。
- id: guji-舜-event-3
  date: 约-2160
  date_is_circa: true
  year_of: -2160
  type: climax
  title_zh: 舜嗣尧位升为天子
  detail: 娥皇为后，女英为妃。
- id: guji-舜-event-4
  date: 约-2140
  date_is_circa: true
  year_of: -2140
  type: endeavor
  title_zh: 封象于有庳
  detail: 事瞽叟犹若焉，天下称二妃聪明贞仁。
