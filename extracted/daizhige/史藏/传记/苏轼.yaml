  decisions:
  - date: 1061
    title_zh: 应中制科入第三等，授大理评事、凤翔府签判
    rationale: 制策入第三等，为仁宗朝所罕，遂正式释褐；十二月赴凤翔任，与子由别，马上赋诗。
  - date: 1071
    title_zh: 乞外任避祸，除通判杭州
    rationale: 王荆公欲变科举，先生献三言而其党不悦；御史以杂事诬奏过失，未尝一言自辩，乞外任避之，十一月至杭州任。
  - date: 1074
    title_zh: 求为东州守，移知密州
    rationale: 以子由在济南，求为东州守，得请高密；九月二十日别钱塘南北山道友，自赴胶西。
  - date: 1079
    title_zh: 自徐州移知湖州
    rationale: 三月自彭城移守吴兴，四月二十九日到任；旋以《湖州到任谢表》被指为谤，七月二十八日中使皇甫遵到湖追摄，遂有乌台之狱。
- id: guji-苏轼-endeavor-2
  name: 诗文著述
  labels:
    zh: 诗·词·文·经解
  start_date: 1043
  phases:
  - key: brewing
    name: 童蒙力学
    labels:
      zh: 七岁知读书，八岁入小学师张易简，十岁作《夏侯太初论》
    start_date: 1043
    highlight_event_id: guji-苏轼-event-school
  - key: breakthrough
    name: 南行与凤翔之咏
    labels:
      zh: 侍父舟行适楚编《南行集》；凤翔作《石鼓》《凤翔八观》《思治论》
    start_date: 1059
    highlight_event_id: guji-苏轼-event-nanxing
  - key: climax
    name: 密徐黄盛期
    labels:
      zh: 密州中秋作《水调歌头》；徐州筑黄楼、作《河复》；黄州著《易传》《论语》说
    start_date: 1076
    highlight_event_id: guji-苏轼-event-shuidiao
  - key: closure
    name: 岭海文章
    labels:
      zh: 惠州、儋州贬所笔耕不辍，和陶诗成，垂老而文愈淡远
    start_date: 1094
    highlight_event_id: guji-苏轼-event-death
  decisions:
  - date: 1080
    title_zh: 谪居黄州，覃思《易》《论语》
    rationale: 到黄州无所用心，覃思经义，作《易传》九卷、《论语》五卷，必始于是岁。
  - date: 1082
    title_zh: 就东坡筑雪堂，自号东坡居士
    rationale: 日以困匮，故人马正卿为请故营地使躬耕其中；大雪中筑雪堂，绘雪于四壁，自书东坡雪堂四字榜之，世称东坡居士自此始。
events:
- id: guji-苏轼-event-birth
  date: 1037-01-08
  year_of: 1037
  title_zh: 生于眉州眉山
  description: 景祐三年十二月十九日乙卯时生；先生《送沈逵》诗云嗟我与君皆丙子，议者谓丙子癸亥水向东流，故才思汗漫而澄清。
- id: guji-苏轼-event-school
  date: 1043
  year_of: 1043
  title_zh: 八岁入小学，师道士张易简
  description: 庆历三年入乡校，以道士张易简为师，师独称先生与陈太初；从旁窃观《庆历圣德诗》，欲知韩范诸君子之为人。
- id: guji-苏轼-event-dengdi
  date: 1057
  year_of: 1057
  title_zh: 进士及第，旋丁母忧
  description: 二十二岁赴礼部试，欧阳文忠公得《刑赏忠厚之至论》以为异人，置第二；复以《春秋》对义居第一，殿试章衡榜中进士乙科。四月丁太夫人武阳君程氏忧，归蜀。
- id: guji-苏轼-event-nanxing
  date: 1059-12
  year_of: 1059
  title_zh: 服除，侍老苏舟行适楚
  description: 己亥之岁十二月服除，侍老苏舟行适楚；舟中无事，杂然有触于中而发于咏叹，与父弟之作编为《南行集》。
- id: guji-苏轼-event-zhike
  date: 1061
  year_of: 1061
  title_zh: 制科入第三等，授凤翔签判
  description: 二十六岁应中制科入第三等，授大理评事、凤翔府签判；十二月赴凤翔任，与子由别，马上赋诗，有《石鼓》诗及《凤翔八观》。
- id: guji-苏轼-event-hangzhou
  date: 1071-11
  year_of: 1071
  title_zh: 通判杭州
  description: 熙宁四年，御史以杂事诬奏，先生未尝一言自辩，乞外任避之，除通判杭州；十一月到任，有《初到杭州寄子由》两绝。
- id: guji-苏轼-event-mizhou
  date: 1074-09
  year_of: 1074
  title_zh: 移知密州
  description: 以子由在济南，求为东州守，得请高密；九月二十日来别南北山道友，自钱塘赴胶西，道与杨元素、陈令举、张子野同舟，松江垂虹亭置酒。
- id: guji-苏轼-event-shuidiao
  date: 1076
  year_of: 1076
  title_zh: 密州中秋作《水调歌头》
  description: 熙宁九年丙辰中秋欢饮达旦，作《水调歌头》怀子由；又作《超然台记》《表忠观碑》《刻秦篆记》。
- id: guji-苏轼-event-xuzhou-flood
  date: 1077
  year_of: 1077
  title_zh: 徐州抗洪保城
  description: 熙宁十年四月赴徐州任；七月十七日河决澶州曹村埽，八月二十一日水及徐州城下，先生治水有功，十月五日水渐退城以全，朝廷降诏奖谕。
- id: guji-苏轼-event-wutai
  date: 1079
  year_of: 1079
  title_zh: 乌台诗案系狱
  description: 言事者以《湖州到任谢表》为谤；七月二十八日中使皇甫遵到湖追摄，八月十八日赴台狱，狱中寄子由诗二首；系狱逾百日，十二月二十九日责授黄州团练副使本州安置。子由上书乞纳官赎罪，贬筠州酒官。
- id: guji-苏轼-event-huangzhou
  date: 1080
  year_of: 1080
  title_zh: 谪居黄州
  description: 元丰三年二月一日至黄州，寓居定惠院，后迁临皋亭；到黄定居后覃思《易》《论语》，作《易传》九卷、《论语》五卷。
- id: guji-苏轼-event-xuetang
  date: 1082
  year_of: 1082
  title_zh: 躬耕东坡，筑雪堂自号东坡居士
  description: 元丰四年请故营地之东名之以东坡；五年躬耕东坡，大雪中筑雪堂，绘雪于四壁，自书东坡雪堂四字，自此自号东坡居士。
- id: guji-苏轼-event-death
  date: 1101-08-24
  year_of: 1101
  title_zh: 卒于常州
  description: 建中靖国元年七月二十八日卒于常州，年六十六。
