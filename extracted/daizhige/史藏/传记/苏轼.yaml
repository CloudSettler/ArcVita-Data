      raw: 建中靖国元年七月二十八日，公历1101年8月24日
  birth_date: 1037-01-08
  death_date: 1101-08-24
  era: 北宋
  reign_ref: 生于仁宗景祐三年，历仁宗、英宗、神宗、哲宗、徽宗五朝，卒于徽宗建中靖国元年
  archetype: 文坛盟主·贬谪实干家
  dilemmas:
  - 直言论事与党争倾轧相搏：献言新法之弊遭御史诬奏，乌台诗案系狱逾百日几乎杀身，终不改其志
  - 用世济民与贬谪困顿并存：外任四州勤于治水赈灾，谪居无俸则躬耕东坡，于儒家用世与佛老旷达之间自处
  lesson: 才高致谤而不废直言，身陷逆境而以旷达利民；黄州困厄反成文章与人格之巅峰。
  summary_first_person: 吾苏轼，字子瞻，眉州眉山人，生于景祐三年十二月十九日。嘉祐二年进士及第，欧阳文忠公得吾《刑赏忠厚之至论》，以为异人，置第二；又应制科入第三等，授大理评事、凤翔府签判。历通判杭州、知密州、徐州、湖州，徐州河决，吾率民守城，卒全其城，朝廷降诏奖谕。元丰二年以诗文被谤，系御史台狱逾百日，责授黄州团练副使；躬耕东坡，筑雪堂，自号东坡居士。文名冠世而宦海多舛，晚岁远谪惠州、儋州，建中靖国元年卒于常州。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%9C%E5%9D%A1%E5%85%88%E7%94%9F%E5%B9%B4%E8%B0%B1.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%9C%E5%9D%A1%E5%85%88%E7%94%9F%E5%B9%B4%E8%B0%B1.md
