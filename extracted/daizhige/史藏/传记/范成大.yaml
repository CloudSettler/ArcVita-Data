    rationale: 夏旱支江涸，遣郡丞冯俌祷离堆增堰，以济沃野，不专抑羊税而以诚感神
  - date: 1177-05-29
    title_zh: 舍陆取水程赴阙
    rationale: 自合江亭登舟由岷江入峡东下，虽滩险而可观风俗古迹，兼载文献而归
