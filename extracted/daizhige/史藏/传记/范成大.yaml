  - date: 1177-06-20
    title_zh: 登峨眉光相访圣灯佛光
    rationale: 亲验兜罗绵云与圆光摄身，辨丹药草木与龙神诸说，存实录以广异闻
  - date: 1177-08-01
    title_zh: 录继业西域行程补史阙
    rationale: 于牛心寺得三藏继业贝叶行记，详录伊吾高昌至天竺诸国道里，以备国史
events:
- id: guji-fan-chengda-event-birth
  title_zh: 诞生吴郡
  date: 1126-06-26
  year_of: 1126
  place_zh: 平江府吴县
  description: 宋宣和八年生于吴郡范氏，后以进士显
- id: guji-fan-chengda-event-jin-mission
  title_zh: 使金不辱命
  date: 1170-08-15
  year_of: 1170
  place_zh: 金中都
  description: 乾道六年奉命使金，争正受书礼，不辱使命，归拜中书舍人
- id: guji-fan-chengda-event-sichuan
  title_zh: 制置四川
  date: 1175-03-01
  year_of: 1175
  place_zh: 成都府
  description: 淳熙二年以敷文阁待制为四川制置使，镇蜀数载，治都江堰、摄水祷雨，岁获丰稔
- id: guji-fan-chengda-event-wuchuan
  title_zh: 离成都作吴船录
  date: 1177-05-29
  year_of: 1177
  place_zh: 成都合江亭
  description: 淳熙丁酉五月戊辰离成都，自万里桥下岷江东下，至十月己巳抵临安，途中日记为吴船录二卷
- id: guji-fan-chengda-event-emei
  title_zh: 登峨眉睹佛光
  date: 1177-07-10
  year_of: 1177
  place_zh: 峨眉山光相寺光明岩
  description: 登峨眉绝顶，于光明岩睹圆光摄身光及金桥清现，详记山顶草木禽虫与七十二雷洞异闻
- id: guji-fan-chengda-event-death
  title_zh: 逝世石湖
  date: 1193-10-08
  year_of: 1193
  place_zh: 平江石湖
  description: 绍熙四年卒于石湖别墅，谥文穆，后人辑其诗为石湖集
