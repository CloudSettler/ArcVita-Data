  birth_date: 1126-06-26
  death_date: 1193-10-08
  era: 南宋
  reign_ref: 宋孝宗淳熙丁酉
  archetype: 循吏纪游家
  dilemmas:
  - 久镇四川图治与急奉召还朝之间的出处进退
  - 沿途据实考证与避忌时讳之间的秉笔分寸
  lesson: 以舟楫丈量山川，以日记存形胜考证，使宦游即成史料
  summary_first_person: 余范成大，字至能，号石湖居士，吴郡人，淳熙丁酉自四川制置使召还，自成都合江亭登舟，水程东归临安，随日纪所阅历为吴船录二卷，欲使后人知山川古迹与民瘼风俗
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/吴船录.md
  - https://daizhige.org/史藏/传记/吴船录.html
  - https://ctext.org/library.pl?if=gb&file=460298
