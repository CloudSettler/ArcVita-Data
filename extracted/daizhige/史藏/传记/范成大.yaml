  - date: '1173-01-22'
    title_zh: 辨浯溪中兴颂排黄庭坚刻论
    rationale: 以忠厚之旨论文，不以苛论掩前人，存诗人雅正
  - date: '1173-01-22'
    title_zh: 以竹册石幢疑钱氏用杨吴宝大年号
    rationale: 亲见仰山孚忠庙杨吴宝大竹册及吴江石幢纪年，存两证以俟考，虽后议为伪亦阙疑
