  lesson: 审时度势，知进退存亡，功成身退而保全
  summary_first_person: 吾本居楚宛五户之墟，师事计倪而入越。佐越王句践卧薪尝胆，持盈定倾，审阴阳蓄积之要，终灭吴而霸。既成，念盛名难居，遂浮海出齐，变名陶朱公，三致千金而散之，知天道盈亏之理也。
