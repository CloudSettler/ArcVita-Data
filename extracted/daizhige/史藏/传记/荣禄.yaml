      is_circa: false
      raw: 道光十六年三月二十一日
    death:
      date: 1903-04-11
      precision: day
      is_circa: false
      raw: 光绪二十九年癸卯春
  birth_date: 1836-04-06
  death_date: 1903-04-11
  era: 清
  reign_ref: 光绪
  archetype: 权奸
  dilemmas:
  - 效忠光绪新政还是效忠慈禧旧权之间抉择
  - 拳乱中纵容排外与暗保使馆以自保之间首鼠两端
  - 以媚结权与以才自立之间取舍
  lesson: 以依附得权，以机巧自保，终以被依附者所弃，权幸之术不可久恃
  summary_first_person: 吾以西后内侄、载沣外舅起家，由北洋而入军机，戊戌密谋复垂帘，夜入独对幽光绪于瀛台，诛六君子而揽大权，庚子嗾成拳祸以媚后党，复暗济使馆以留退路，自谓两面周全，终以忤后抑郁而殁，撤乐复奏，冷落收场，方知傀儡之主终不容弄权之臣
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/奴才小史.md
  - https://ctext.org/wiki.pl?if=gb&res=912554
