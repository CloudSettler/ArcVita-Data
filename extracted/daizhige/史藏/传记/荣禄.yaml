    rationale: 以拳民为工具助载漪刚毅等宣威，顺后意以固军机独揽之权
  - date: 1900-06-25
    title_zh: 佯遣人告使馆慎防并资粮食
    rationale: 预为议和时外人索惩罪魁之免死筹码，首鼠两端以自全
events:
- id: guji-荣禄-event-birth
  title_zh: 出生
  date: 1836-04-06
  year_of: 1836
  description: 生于北京瓜尔佳氏，为慈禧太后内侄、摄政王载沣外舅
- id: guji-荣禄-event-beiyang
  title_zh: 授北洋大臣
  date: 1898-04-28
  year_of: 1898
  description: 光绪戊戌四月奉命为北洋大臣，赆翁同龢千金而执手呜咽，时人已识其李林甫之术
- id: guji-荣禄-event-wuxu
  title_zh: 策动戊戌政变幽光绪
  date: 1898-09-21
  year_of: 1898
  description: 夜分入京密请独对，翌晨谋围颐和园，光绪被幽瀛台，谭嗣同刘光第等六君子骈戮菜市
- id: guji-荣禄-event-gengzi
  title_zh: 嗾成庚子拳祸并暗保使馆
  date: 1900-06-20
  year_of: 1900
  description: 入军机后提倡纵容载漪刚毅徐桐等用拳排外，复于德使被戕后佯救使馆资其粮食，故李鸿章议和时外人独不及己
- id: guji-荣禄-event-death
  title_zh: 逝世
  date: 1903-04-11
  year_of: 1903
  description: 癸卯春忤慈禧意抑郁而死，初循例撤乐，慈禧怫然命复奏乐，极尽冷落收场
