person:
  qid: guji-蕅益大师
  name_zh: 蕅益大师
  names:
    zh: 蕅益大师
    en: Ouyi Zhixu
  lifespan:
    birth:
      date: '1599-06-04'
      precision: day
      is_circa: false
      raw: 明万历二十七年己亥五月三日亥时
    death:
      date: '1655-02-28'
      precision: day
      is_circa: false
      raw: 清顺治十二年乙未正月二十一日
  birth_date: '1599-06-04'
  death_date: '1655-02-28'
  era: 明末清初
  reign_ref: 明万历
  archetype: 净土宗祖师与律学中兴者
  dilemmas:
  - 儒学自任与佛法毁谤之间的信解抉择
  - 宗门顿悟与性相教理矛盾如何和会
  - 重兴戒律作真声闻与随俗作假大乘的持守抉择
  - 宗乘匡救与一意西归净土的归向抉择
  lesson: 痛禅病在绝无正知见与不重戒律，非多知见与著戒相，故以教律匡禅，以占察忏法求净戒，以净土为归，著述讲演皆为下圆顿种
  summary_first_person: 吾姓钟名际明，吴之木渎人，母梦大士送子而生，七岁茹素，十二学儒谤佛，十七读竹窗随笔而焚辟佛论，二十诠颜渊问仁废寝三昼夜而悟孔颜心学，二十四从雪岭峻师剃度名智旭，径山大悟知此身当处出生随处灭尽性相本无矛盾，三阅律藏知时弊多端，拈阄私淑天台，晚年退为但三归人，一意求生净土，著梵网合注、弥陀要解等以待再来
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/蕅益大师年谱.md
  - https://daizhige.org/史藏/传记/蕅益大师年谱.html
  - https://ctext.org/library.pl?if=gb&file=wb424950
endeavors:
- id: guji-蕅益大师-endeavor-1
  title_zh: 宗乘参究与律学重治
  summary: 自儒入佛，径山大悟后抹倒禅字，力以戒教匡救，三阅律藏，重治毗尼事义集要，拈阄受菩萨沙弥戒，勤礼占察以求清净轮相
  phases:
  - key: brewing
    name: 儒禅疑闷期
    labels:
      zh: 参仁疑觉
    start_date: '1618-01-01'
    highlight_event_id: guji-蕅益大师-event-ordination
  - key: breakthrough
    name: 径山大悟期
    labels:
      zh: 刹那透彻
    start_date: '1623-06-01'
    highlight_event_id: guji-蕅益大师-event-awakening
  - key: climax
    name: 三阅律藏期
    labels:
      zh: 毗尼甄别
    start_date: '1625-01-01'
    highlight_event_id: guji-蕅益大师-event-full-ordination
  - key: closure
    name: 退作沙弥期
    labels:
      zh: 占察求戒
    start_date: '1632-08-01'
    highlight_event_id: guji-蕅益大师-event-retreat-sramanera
  decisions:
  - date: '1622-08-01'
    title_zh: 从雪岭峻师剃度出家
    rationale: 听楞严世界在空空生大觉而闷绝，决意体究大事，三梦憨山示以向上志，遂舍俗从憨翁门人雪岭剃染
  - date: '1624-12-22'
    title_zh: 受菩萨戒后立志遍阅律藏
    rationale: 虽已受大戒仍以重楼喻谓下级不可废，痛像季戒律不明，乃录毗尼事义要略以正讹
  - date: '1631-06-01'
    title_zh: 拈阄私淑天台不立门户
    rationale: 为通宗教四阄问佛得天台阄，究心台部而不肯为台家子孙，欲和会禅教贤首慈恩诸家
- id: guji-蕅益大师-endeavor-2
  title_zh: 教观著述与净土归仰
  summary: 九华阅藏著梵网合注，温陵述楞严玄文，金陵后一意西驰，撰弥陀要解、周易禅解、占察疏等，晚年专修净土忏法，示居士念佛法要
  phases:
  - key: brewing
    name: 九华阅藏期
    labels:
      zh: 阅藏著述
    start_date: '1635-03-01'
    highlight_event_id: guji-蕅益大师-event-fanwang
  - key: breakthrough
    name: 闽粤讲演期
    labels:
      zh: 楞严玄义
    start_date: '1638-11-01'
    highlight_event_id: guji-蕅益大师-event-lengyan
  - key: climax
    name: 要解撰述期
    labels:
      zh: 弥陀要解
    start_date: '1647-09-01'
    highlight_event_id: guji-蕅益大师-event-mituo
  - key: closure
    name: 灵峰西归期
    labels:
      zh: 但三归人
    start_date: '1644-01-01'
    highlight_event_id: guji-蕅益大师-event-retreat-sramanera
  decisions:
  - date: '1637-08-01'
    title_zh: 于九子别峰述梵网合注
    rationale: 为如是昉师请讲梵网以资冥福，心华开发义泉沸涌，遂成玄义一卷合注七卷
  - date: '1638-11-01'
    title_zh: 应温陵诵帚请撰大佛顶玄文
    rationale: 感知己坚请兼理夙愿，于小开元撰玄义二卷文句十卷以阐佛顶要旨
  - date: '1647-09-01'
    title_zh: 述阿弥陀经要解
    rationale: 会归性相以明持名妙行，欲以圆顿教观摄末世钝根，示一心不乱即生净土
events:
- id: guji-蕅益大师-event-birth
  title_zh: 生于吴中木渎钟氏
  date: '1599-06-04'
  year_of: '1599'
  description: 明万历二十七年己亥五月三日亥时生，俗姓钟名际明字振之，父讳之凤母金氏大莲，以父持白衣大悲咒十年梦大士送子
  location_zh: 江苏苏州木渎
- id: guji-蕅益大师-event-ordination
  title_zh: 从雪岭峻师剃度
  date: '1622-03-01'
  year_of: '1622'
  description: 壬戌二十四岁三梦憨山大师，遂从其门人雪岭峻师剃度命名智旭，字蕅益又字素华，发三愿三拌不收徒不登座不化缘
  location_zh: 曹溪系雪岭
- id: guji-蕅益大师-event-awakening
  title_zh: 径山坐禅大悟
  date: '1623-07-01'
  year_of: '1623'
  description: 癸亥二十五岁夏坐禅径山逼拶功极身心世界忽皆消殒，知此身当处出生随处灭尽为妄想影，性相二宗一齐透彻
  location_zh: 浙江径山
- id: guji-蕅益大师-event-full-ordination
  title_zh: 云栖受四分戒及菩萨戒
  date: '1624-12-21'
  year_of: '1624'
  description: 甲子二十六岁腊月初八冒雪至云栖从古德贤法师为阇梨于莲池像前受四分戒，后一日受菩萨戒，发心看律藏
  location_zh: 杭州云栖
- id: guji-蕅益大师-event-retreat-sramanera
  title_zh: 拈阄得菩萨沙弥戒退为但三归人
  date: '1632-08-15'
  year_of: '1632'
  description: 癸酉三十五岁结夏西湖寺自恣日然顶香拈阄问戒体，得菩萨沙弥阄，自后自称菩萨沙弥，甲申四十六岁复退作但三归依人勤礼占察获清净轮相
  location_zh: 杭州西湖寺
- id: guji-蕅益大师-event-fanwang
  title_zh: 九华述梵网合注
  date: '1637-09-01'
  year_of: '1637'
  description: 丁丑三十九岁居九子别峰为如是昉师等敷演梵网，成玄义一卷合注七卷，洎后刊板于金陵古林庵
  location_zh: 安徽九华山
- id: guji-蕅益大师-event-lengyan
  title_zh: 温陵撰大佛顶玄义文句
  date: '1639-06-01'
  year_of: '1639'
  description: 己卯四十一岁住温陵小开元，应诵帚昉师请撰大佛顶经玄义二卷文句十卷，板藏甘露戒坛
  location_zh: 福建泉州开元寺
- id: guji-蕅益大师-event-mituo
  title_zh: 撰阿弥陀经要解
  date: '1647-09-01'
  year_of: '1647'
  description: 丁亥四十九岁九月述弥陀要解，以华严一乘圆教释持名念佛，会事理直指一心
  location_zh: 石城祖堂
- id: guji-蕅益大师-event-death
  title_zh: 示寂于灵峰
  date: '1655-02-28'
  year_of: '1655'
  description: 清顺治十二年乙未正月二十一日示寂于北天目灵峰，世寿五十七，僧腊三十三，塔于灵峰
  location_zh: 浙江北天目灵峰寺
