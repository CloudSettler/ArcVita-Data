    title_zh: 遁耕中岳颍水之阳
    rationale: 尧知贤人之利天下而不知其贼天下，远而避之以全道
  - date: '-2317'
    title_zh: 终身无经天下色
    rationale: 不以庖代尸祝，守一枝满腹之分
