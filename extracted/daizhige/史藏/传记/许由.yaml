  reign_ref: 尧
  archetype: 隐逸高士
  dilemmas:
  - 受天下之让与守一枝满腹之志的抉择
  - 名为实宾与尸祝越俎的义利之辨
  - 高岸深谷自晦与浮游求名的清浊之别
  lesson: 名者实之宾，不以天下易其介，守志箕颍以厉贪竞
  summary_first_person: 吾许由字武仲居沛泽箕颍之间，据义履方邪席不坐，尧以天下让吾，吾对以鹪鹩一枝偃鼠满腹不受而逃，复召为九州长则洗耳颍滨，遁耕中岳箕山之下，终身无经天下色，愿以一节激浊世
