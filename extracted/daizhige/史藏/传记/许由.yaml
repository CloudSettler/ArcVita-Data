  - key: closure
    name: 箕山公神
    labels:
      zh: 显节
    start_date: '-2250'
    highlight_event_id: guji-xuyou-event-death
  decisions:
  - date: '-2317'
    title_zh: 辞让天下而逃去
    rationale: 天下既治而代之将为名，名者实之宾不为宾而易实
  - date: '-2317'
    title_zh: 恶闻九州长而洗耳
    rationale: 不欲闻召命之声，洗耳以自洁并示巢父
events:
- id: guji-xuyou-event-birth
  person_id: guji-xuyou
  title_zh: 生于阳城槐里
  date: '-2350'
  year_of: -2350
  is_circa: true
  location: 阳城槐里
  description: 许由字武仲为人据义履方邪席不坐邪膳不食，后隐于沛泽之中
- id: guji-xuyou-event-rangtianxia
  person_id: guji-xuyou
  title_zh: 尧让天下固辞
  date: '-2317'
  year_of: -2317
  is_circa: true
  location: 沛泽
  description: 尧曰日月出而爝火不息请致天下，由曰鹪鹩巢林不过一枝偃鼠饮河不过满腹归休乎君不受而逃去
- id: guji-xuyou-event-xier
  person_id: guji-xuyou
  title_zh: 洗耳颍水见巢父
  date: '-2317'
  year_of: -2317
  is_circa: true
  location: 颍水滨
  description: 尧又召为九州长由不欲闻洗耳于颍水滨，友巢父牵犊上流饮之曰污吾犊口，遂终身不相见
- id: guji-xuyou-event-jishan
  person_id: guji-xuyou
  title_zh: 遁耕箕山颍阳
  date: '-2317'
  year_of: -2317
  is_circa: true
  location: 中岳颍水之阳箕山之下
  description: 由于是遁耕于中岳颍水之阳箕山之下，终身无经天下色
- id: guji-xuyou-event-death
  person_id: guji-xuyou
  title_zh: 没葬箕山配祀五岳
  date: '-2250'
  year_of: -2250
  is_circa: true
  location: 箕山之巅许由山
  description: 许由没葬箕山之巅亦名许由山在阳城南十余里，尧因就其墓号曰箕山公神以配食五岳世世奉祀至今不绝
