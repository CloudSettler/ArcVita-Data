person:
  qid: guji-诸葛亮
  name_zh: 诸葛亮
  names:
    zh: 诸葛亮
    en: Zhuge Liang
  lifespan:
    birth:
      date: 0181
      precision: year
      is_circa: false
      raw: 汉灵帝光和四年辛酉
    death:
      date: 0234-08
      precision: month
      is_circa: false
      raw: 蜀汉建兴十二年八月卒于五丈原军中
  birth_date: 0181
  death_date: 0234-08
  era: 三国
  reign_ref: 蜀汉建兴
  archetype: 忠武智相
  dilemmas:
  - 隐居隆中躬耕自守与出山辅佐明主以济苍生之择
  - 联吴抗曹共御强敌与坐观成败自保荆州之辨
  - 受遗托孤可自取而坚守臣节辅佐嗣主之决
  - 北伐兴复屡败屡战与休养生息闭关治蜀之衡
  lesson: 审天下大势定三分之策，尽臣节鞠躬尽瘁，时艰势弱亦当以忠义谋成败，非以成败论忠义
  summary_first_person: 吾本琅琊阳都诸葛氏，少孤寄荆襄，躬耕隆中，每自比管乐而时人不许。先主三顾，吾以隆中之策许以王业，遂联吴破曹于赤壁，入蜀定益州，受章武托孤于永安。南征平夷越而七擒孟获，北伐出秦川而六出祁山，治蜀以法检调御，欲兴复汉室还于旧都。然时为之也，祚短力微，卒于五丈原，年五十有四，鞠躬尽瘁而已。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E8%AF%B8%E8%91%9B%E5%BF%A0%E6%AD%A6%E4%B9%A6.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E8%AF%B8%E8%91%9B%E5%BF%A0%E6%AD%A6%E4%B9%A6.html
endeavors:
- id: guji-诸葛亮-endeavor-1
  name_zh: 隆中定策与鼎足三分
  description: 自躬耕隆中至辅备取荆益，联吴抗曹，奠定蜀汉鼎足之势
  phases:
  - key: brewing
    name: 躬耕陇亩
    labels:
      zh: 隐居待时
    start_date: 0197
    highlight_event_id: guji-诸葛亮-event-birth
  - key: breakthrough
    name: 隆中对策
    labels:
      zh: 三顾定策
    start_date: '0207'
    highlight_event_id: guji-诸葛亮-event-longzhong
  - key: climax
    name: 联吴破曹
    labels:
      zh: 赤壁鏖兵
    start_date: 0208-07
    highlight_event_id: guji-诸葛亮-event-chibi
  - key: closure
    name: 入蜀建基
    labels:
      zh: 成都为治
    start_date: '0214'
    highlight_event_id: guji-诸葛亮-event-rushu
  decisions:
  - date: '0207'
    title_zh: 应先主三顾出山定隆中之策
    rationale: 审曹操不可争、孙权可为援、荆益可资，定跨有荆益西和诸戎外结孙权之大略
  - date: 0208-10
    title_zh: 奉命使吴说孙权共抗曹操
    rationale: 事急不断祸至无日，言明鼎足成败之机在于今日，促成孙刘联盟破操于赤壁
  - date: '0214'
    title_zh: 留关羽守荆州自率张飞赵云溯江定蜀
    rationale: 成都为天府之土，须速定以成帝业根基，足食足兵以图北伐
- id: guji-诸葛亮-endeavor-2
  name_zh: 托孤治蜀与北伐兴复
  description: 受永安遗诏辅佐后主，南征定南中，北伐出祁山，鞠躬尽瘁图兴复汉室
  phases:
  - key: brewing
    name: 白帝受遗
    labels:
      zh: 托孤辅政
    start_date: 0223-04
    highlight_event_id: guji-诸葛亮-event-tuogu
  - key: breakthrough
    name: 南征定乱
    labels:
      zh: 七擒孟获
    start_date: 0225-03
    highlight_event_id: guji-诸葛亮-event-nanzheng
  - key: climax
    name: 北伐出师
    labels:
      zh: 出师二表
    start_date: 0228-03
    highlight_event_id: guji-诸葛亮-event-beifa1
  - key: closure
    name: 五丈殒星
    labels:
      zh: 鞠躬尽瘁
    start_date: 0234-02
    highlight_event_id: guji-诸葛亮-event-death
  decisions:
  - date: 0223-05
    title_zh: 受遗为武乡侯领益州牧政事皆决于亮
    rationale: 嗣子可辅辅之不可则自取之言示以忠贞，惟竭股肱以安国定大事
  - date: 0225-05
    title_zh: 率众南征攻心为上七擒七纵孟获
    rationale: 务农殖谷闭关息民必先平南中叛乱，乃可北伐无后顾之忧
  - date: 0228-03
    title_zh: 上出师表率众北伐据汉中伐魏
    rationale: 汉贼不两立王业不偏安，兴复汉室还于旧都，虽街亭有败亦请自贬再举
events:
- id: guji-诸葛亮-event-birth
  title_zh: 生于琅琊阳都
  date: 0181
  year_of: 0181
  place_zh: 琅琊阳都
  description: 汉灵帝光和四年辛酉生，司隶校尉诸葛丰之后，父珪为泰山郡丞，早孤从叔父玄依刘表寓襄阳隆中
- id: guji-诸葛亮-event-longzhong
  title_zh: 隆中对策三顾定交
  date: '0207'
  year_of: '0207'
  place_zh: 南阳隆中
  description: 先主屯新野，徐庶荐为卧龙，先主三往乃见，亮陈三分天下之计，遂与情好日密如鱼得水
- id: guji-诸葛亮-event-chibi
  title_zh: 使吴联孙破曹于赤壁
  date: 0208-12
  year_of: 0208
  place_zh: 柴桑赤壁
  description: 奉命求救于孙权，舌战说权与周瑜鲁肃协规同力，以三万水军大破曹操于赤壁，遂收江南为军师中郎将
- id: guji-诸葛亮-event-rushu
  title_zh: 入蜀定益州为军师将军
  date: '0214'
  year_of: '0214'
  place_zh: 成都
  description: 刘璋迎先主击张鲁，亮与张飞赵云分定郡县，成都平后署左将军府事，常镇守足食足兵劝先主即帝位
- id: guji-诸葛亮-event-tuogu
  title_zh: 永安受遗托孤辅政
  date: 0223-04
  year_of: '0223'
  place_zh: 永安白帝城
  description: 章武三年先主病笃召亮于成都，诏曰君才十倍曹丕嗣子可辅辅之不才可自取，亮涕泣受命策为丞相武乡侯
- id: guji-诸葛亮-event-nanzheng
  title_zh: 南征平定雍闿孟获
  date: 0225-05
  year_of: '0225'
  place_zh: 南中
  description: 建兴三年率众南征斩雍闿七擒孟获平定朱褒高定之叛，务农殖谷闭关息民安定后方
- id: guji-诸葛亮-event-beifa1
  title_zh: 上出师表北伐围祁山
  date: 0228-03
  year_of: 0228
  place_zh: 汉中祁山
  description: 建兴五年上前出师表率众伐魏，建兴六年违节度马谡败于街亭自贬为右将军，斩王双，复拜丞相
- id: guji-诸葛亮-event-beifa2
  title_zh: 木牛流马再出祁山
  date: '0231'
  year_of: '0231'
  place_zh: 祁山
  description: 建兴九年以木牛运围祁山大败司马懿获甲首三千，粮尽退军斩追将张合；建兴十二年以流马运屯田渭南与司马懿相持百余日
- id: guji-诸葛亮-event-death
  title_zh: 卒于五丈原军中
  date: 0234-08
  year_of: '0234'
  place_zh: 五丈原
  description: 建兴十二年八月丞相亮卒于军中年五十四，遗命退军节度，与汉献帝同生辛酉同殁甲寅，谥忠武后世称武侯
