person:
  qid: guji-赵复
  name_zh: 赵复
  names:
    zh: 赵复
    en: Zhao Fu
  lifespan:
    birth:
      date: 约1200
      precision: decade
      is_circa: true
      raw: 不详
    death:
      date: 约1280
      precision: decade
      is_circa: true
      raw: 不详（竟不受官而终）
  birth_date: 约1200
  death_date: 约1280
  era: 元（由宋入元）
  reign_ref: 元太宗（太子阔出征德安）至元世祖（潜邸召见）
  archetype: 遗民传道者
  dilemmas:
  - 殉节还是存道：九族俱残欲投水殉国，姚枢晓以徒死无益、存则传绪百世，遂忍生北行
  - 忠义之守：世祖潜邸问取宋可导之乎，答宋吾父母国也，未有引他人以伐吾父母者
  - 故土与新境：燕居不忘故土，而尽录程朱之书北传，以斯文为重
  lesson: 徒死无益，存身乃可传道；一士之生，系百世斯文之绪。
  summary_first_person: 我是德安赵复，字仁甫，学者称江汉先生。德安城破，九族俱残，我本欲投水殉国，姚枢先生救我，说徒死无益，存则斯文或可传绪百世，我随他北上，把所记程朱诸书尽录付之。其后与杨惟中、姚枢建太极书院，立周子祠，选遗书八千余卷讲授其中，作传道图、伊洛发挥、师友图、希贤录，为学者示求端用力之方。世祖在潜邸召见，问我可否导之取宋，我答宋是吾父母国，不肯引他人伐父母，因此终身不受官。北方知有程朱之学，实自我始，许衡、郝经、刘因皆得其书而尊信之。
  source_urls:
  - https://daizhige.org/史藏/传记/元儒考略.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/元儒考略.md
  - https://ctext.org/library.pl?if=gb&res=wb515223
