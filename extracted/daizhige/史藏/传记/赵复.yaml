  decisions:
  - date: 1235
    title_zh: 从姚枢北行，舍殉节以存道
    rationale: 徒死无益，汝存则子孙或可以传绪百世，随吾而北可必无他
  - date: 约1251
    title_zh: 拒导世祖伐宋
    rationale: 宋吾父母国也，未有引他人以伐吾父母者；世祖悦，因不强之仕
- id: guji-赵复-endeavor-2
  title_zh: 撰传道图、伊洛发挥、师友图、希贤录
