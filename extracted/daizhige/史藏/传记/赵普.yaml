person:
  qid: guji-赵普
  name_zh: 赵普
  names:
    zh: 赵普
    en: Zhao Pu
  lifespan:
    birth:
      date: 0922
      precision: year
      is_circa: false
      raw: 后唐天成二年幽州
    death:
      date: '0992-08-14'
      precision: day
      is_circa: false
      raw: 宋太宗淳化三年七月十四日
  birth_date: 0922
  death_date: '0992-08-14'
  era: 北宋初
  reign_ref: 宋太祖赵匡胤、宋太宗赵光义
  archetype: 开国谋相
  dilemmas:
  - 节镇太重君弱臣强，如何稍夺其权而安天下不致激变
  - 君怒裂奏之时，当曲从还是执奏坚守刑赏之公
  - 昭宪顾命以次传弟，如何以一纸盟书安宗社与太祖子嗣
  lesson: 安天下之功在谋虑深长，稍夺权制钱谷收精兵以强干弱枝，刑赏以天下为公
  summary_first_person: 余赵普字则平幽州人，佐太祖太宗而成宋业，建隆初献稍夺其权制其钱谷收其精兵三策以定强干弱枝之制，佐成杯酒释兵权，置瓮焚书以广言路，三入中书虽裂奏犹补缀再进，奉昭宪命署金匮盟书以定国本，晚年手不释卷以吏道而务学
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/宋名臣言行录.md
  - https://ctext.org/library.pl?if=gb&res=475467
endeavors:
- id: guji-赵普-endeavor-1
  title_zh: 献策平藩强干弱枝
  summary: 针对唐季五代藩镇跋扈君弱臣强之弊，进稍夺其权制其钱谷收其精兵三策，促成杯酒释兵权及置转运使通判收精兵宿卫之制
  phases:
  - key: brewing
    name: 滁州幕府见知
    labels:
      zh: 全活盗囚
    start_date: 0955
    highlight_event_id: guji-赵普-event-chuzhou
  - key: breakthrough
    name: 建隆奏对献三策
    labels:
      zh: 稍夺其权
    start_date: 0960
    highlight_event_id: guji-赵普-event-sance
  - key: climax
    name: 杯酒释兵权定议
    labels:
      zh: 释去兵权
    start_date: 0961
    highlight_event_id: guji-赵普-event-beijiu
  - key: closure
    name: 置转运转通判收精兵
    labels:
      zh: 强干弱枝
    start_date: 0962
    highlight_event_id: guji-赵普-event-zhuanyun
  decisions:
  - date: 0960
    title_zh: 进稍夺其权制其钱谷收其精兵
    rationale: 唐季战乱非他故节镇太重所致，无奇巧惟分其权制钱谷收精兵则天下自安
  - date: 0961
    title_zh: 劝太祖以田宅歌舞安抚石守信王审琦等释兵权
    rationale: 人生如白驹过隙富贵不过积金娱老荫子，两无猜嫌上下相安方为可生之涂
- id: guji-赵普-endeavor-2
  title_zh: 三入中书匡弼两朝
  summary: 历太祖太宗两朝三度拜相，裂奏复进以争刑赏之公，屏后置瓮焚利害文字以广言路，署金匮盟书以定储贰
  phases:
  - key: brewing
    name: 初拜中书独断
    labels:
      zh: 不知印押班
    start_date: 0964
    highlight_event_id: guji-赵普-event-bai_xiang
  - key: breakthrough
    name: 金匮署书定国本
    labels:
      zh: 昭宪顾命
    start_date: 0961
    highlight_event_id: guji-赵普-event-jingui
  - key: climax
    name: 罢相守藩复召为相
    labels:
      zh: 河阳再相
    start_date: 0973
    highlight_event_id: guji-赵普-event-fuxiang
  - key: closure
    name: 晚年劝学手不释卷
    labels:
      zh: 寡学术而力学
    start_date: 0981
    highlight_event_id: guji-赵普-event-duxue
  decisions:
  - date: 0968
    title_zh: 裂奏复进坚请迁赏
    rationale: 刑赏天下之刑赏非陛下喜怒所得专，当以功过酬之，虽上怒裂奏亦拾补再进终悟用之
  - date: 0961
    title_zh: 于昭宪榻前自署金匮盟书
    rationale: 奉太后汝万岁后当以次传二弟则并汝子亦获安之训，自署臣普书藏金匮以安宗社
  - date: 0970
    title_zh: 置二大瓮于宰府屏后焚利害文字
    rationale: 广言路而防壅蔽，满即焚于通衢示不匿人言而决于公议
events:
- id: guji-赵普-event-birth
  title_zh: 生于幽州
  date: 0922
  year_of: 0922
  description: 后唐天成二年生于幽州，字则平，少吏事以吏道闻
- id: guji-赵普-event-chuzhou
  title_zh: 滁州判官全活盗囚为太祖所奇
  date: 0955
  year_of: 0955
  description: 为滁州判官，太祖与语奇之，获盗百余将就死，启太祖更讯全活十七八
- id: guji-赵普-event-sance
  title_zh: 建隆初进平藩三策
  date: 0960
  year_of: 0960
  description: 太祖问息兵建长久计，对以稍夺其权制其钱谷收其精兵，太祖曰卿勿复言吾已谕矣
- id: guji-赵普-event-beijiu
  title_zh: 议成杯酒释兵权
  date: 0961
  year_of: 0961
  description: 太祖夜饮石守信王审琦等，谕以黄袍加身之患，劝以释兵权择田宅歌儿舞女以终天年，翌日诸将称疾解军权
- id: guji-赵普-event-zhuanyun
  title_zh: 置转运使通判收诸镇精兵宿卫
  date: 0962
  year_of: 0962
  description: 分遣使者选择精兵补禁军聚京师厚粮赐躬自训练，诸镇兵力非京师敌莫敢异心
- id: guji-赵普-event-jingui
  title_zh: 昭宪太后顾命署金匮盟书
  date: 0961
  year_of: 0961
  description: 昭宪疾笃戒太祖万岁后以次传二弟，召普于榻前为约誓书普于纸尾自署臣普书藏金匮命谨密宫人掌之
- id: guji-赵普-event-bai_xiang
  title_zh: 初拜相专决置瓮焚书
  date: 0964
  year_of: 0964
  description: 拜相事无大小一决于王，薛居正吕余庆参知政事但奉行制书，置二大瓮于屏后纳利害文字满即焚之
- id: guji-赵普-event-fuxiang
  title_zh: 被谮出守河阳得金匮复相
  date: 0981
  year_of: 0981
  description: 为卢多逊所谮出守河阳，太宗发金匮得盟书大悟急召之，普惶恐遗书家人别而后行既至复为相
- id: guji-赵普-event-duxue
  title_zh: 太祖劝学晚年手不释卷
  date: 0985
  year_of: 0985
  description: 性深沉少学术，太祖劝以读书遂晚年手不释卷，以天下为己任沈毅果断当世无与为比
- id: guji-赵普-event-death
  title_zh: 卒于淳化三年
  date: '0992-08-14'
  year_of: 0992
  description: 宋太宗淳化三年七月十四日卒，年七十一，赠韩国忠献王配享太祖庙庭，子孙至今享福禄
