  summary_first_person: 余以宗室受知枢密当光宁授受之际遣韩侂胄通意慈福而定宁宗继而拜右丞相广召朱熹彭龟年等一新庶政不料分界不严近习窃柄侂胄引京镗何澹等为鹰犬指正人为伪党余遂以庆元元年罢相谪衡州而殁至今方知揖盗开门之失足为万世炯戒
