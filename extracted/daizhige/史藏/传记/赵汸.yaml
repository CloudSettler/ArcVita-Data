  date: '1338'
  year_of: 1338
  place_zh: 九江
  description: 往见黄泽禀学，尽得六经疑义千余条，授以楚杀得臣与姜氏如齐师内外书法之辨
- id: guji-赵汸-event-wuxue
  title_zh: 究明春秋笔削与易象
  date: '1345'
  year_of: 1345
  place_zh: 淳安临川
  description: 质夏氏先天易说于虞集，合杜考陈悟传注得失，作左氏传补注
- id: guji-赵汸-event-bilang
  title_zh: 避地古朗山覃思
  date: '1360'
  year_of: 1360
  place_zh: 星溪古朗山
  description: 结茅星溪古朗山高寒深阻，虽疾病隐约而覃思日进超诣
- id: guji-赵汸-event-zhushu
  title_zh: 成春秋属辞与集传
  date: '1366'
  year_of: 1366
  place_zh: 东山精舍
  description: 集诸家合经者为春秋集传十五卷，离经析义八类为属辞，二书相表里本旨复明
- id: guji-赵汸-event-xiushi
  title_zh: 征修元史
  date: '1369-02-01'
  year_of: 1369
  place_zh: 南京史局
  description: 洪武二年诏征山林隐逸预修元史，书成赐金绮
- id: guji-赵汸-event-guishi
  title_zh: 辞归筑精舍教授
  date: '1369-09-01'
  year_of: 1369
  place_zh: 休宁东山
  description: 不愿仕还，筑东山精舍奉母，以议礼再征皆辞，教授生徒
- id: guji-赵汸-event-death
  title_zh: 卒于家
  date: '1369'
  year_of: 1369
  place_zh: 休宁
  description: 归未几卒，年五十二，时论以为本朝儒林春秋第一
