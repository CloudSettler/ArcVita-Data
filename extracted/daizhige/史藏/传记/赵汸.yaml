  name_zh: 赵汸
  names:
    zh: 赵汸
    en: Zhao Fang
  lifespan:
    birth:
      date: '1319'
      precision: year
      is_circa: true
      raw: 元延祐六年推算，洪武二年卒年五十二
    death:
      date: '1369'
      precision: year
      is_circa: false
      raw: 洪武二年预修元史后卒
  birth_date: '1319'
  death_date: '1369'
  era: 元末明初
  reign_ref: 洪武
  archetype: 经学宗师
  dilemmas:
  - 经说纷纭中何以确立春秋笔削本旨与经世大义之统一
  - 征辟与隐居之间何以守志不仕而存师道传承
  lesson: 精思慎思以得笔削之权，不舍史论事不离传求经，完养而后发
  summary_first_person: 吾少受四书多疑，负笈九江师黄楚望得春秋书法内外之辨，久而思之悟笔削之权；合杜考陈著属辞集传以明圣人经世之旨，又参先天后天以通易象；元季避地古朗山覃思著述，洪武征修元史书成辞归，筑东山精舍教授以终。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E6%98%8E%E5%84%92%E8%A8%80%E8%A1%8C%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E6%98%8E%E5%84%92%E8%A8%80%E8%A1%8C%E5%BD%95.md
endeavors:
- id: guji-赵汸-endeavor-1
  title_zh: 春秋笔削经学体系创立
  description: 师事黄泽得春秋书法要旨，博考陈杜诸家合经会传，离经析义作属辞与集传
  phases:
  - key: brewing
    name: 负笈九江师事黄泽
    labels:
      zh: 求学
    start_date: '1338'
    highlight_event_id: guji-赵汸-event-huangze
  - key: breakthrough
    name: 悟得内外书法与笔削权衡
    labels:
      zh: 领悟
    start_date: '1345'
    highlight_event_id: guji-赵汸-event-wuxue
  - key: climax
    name: 著春秋属辞集传
    labels:
      zh: 著述
    start_date: '1360'
    highlight_event_id: guji-赵汸-event-zhushu
  - key: closure
    name: 本旨焕然以传后学
    labels:
      zh: 定论
    start_date: '1366'
    highlight_event_id: guji-赵汸-event-zhushu
  decisions:
  - date: '1340'
    title_zh: 遵完养慎思毋轻发
    rationale: 黄泽戒当完养而慎思毋轻发，故久思二三年以求一事之通
  - date: '1360'
    title_zh: 离经析义分为八类作属辞
    rationale: 恐学者梏于旧闻因陋就简，乃析交互之义使笔削之权详著
- id: guji-赵汸-endeavor-2
  title_zh: 避乱隐居与元史征聘
  description: 元末辅汪同保乡避地古朗山覃思，洪武征修元史书成力辞不仕筑精舍授徒
  phases:
  - key: brewing
    name: 辅兵保乡结茅避兵
    labels:
      zh: 隐遁
    start_date: '1355'
    highlight_event_id: guji-赵汸-event-bilang
  - key: breakthrough
    name: 古朗山覃思超诣
    labels:
      zh: 精思
    start_date: '1360'
    highlight_event_id: guji-赵汸-event-bilang
  - key: climax
    name: 征修元史
    labels:
      zh: 征聘
    start_date: '1369-02-01'
    highlight_event_id: guji-赵汸-event-xiushi
  - key: closure
    name: 辞禄归隐筑东山精舍
    labels:
      zh: 归隐
    start_date: '1369-09-01'
    highlight_event_id: guji-赵汸-event-guishi
  decisions:
  - date: '1355'
    title_zh: 辅汪同保乡不入仕途
    rationale: 痛赏罚不明浪战无策，固守乡井以全民而不求智勇将权
  - date: '1369-09-01'
    title_zh: 书成赐金绮而力辞不仕
    rationale: 志在经学传承不慕利禄，筑东山精舍奉母教授为归宿
events:
- id: guji-赵汸-event-birth
  title_zh: 出生休宁
  date: '1319'
  year_of: 1319
  place_zh: 徽州休宁
  description: 生于休宁，字子常，少受四书即多疑问夜取朱子大全等书自解
