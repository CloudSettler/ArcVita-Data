events:
- id: guji-轩辕黄帝-event-birth
  title_zh: 寿丘诞生
  date: '-2717'
  location: 寿丘
  description: 母西桥氏女附宝瞑见电绕北斗枢星感而有娠怀二十四月生轩辕于寿丘龙颜日角河目隆颡始学于项长于姬水
- id: guji-轩辕黄帝-event-invention
  title_zh: 制衣冠舟车宫室
  date: '-2698'
  location: 有熊
  description: 取伏羲卦象作八索命曹胡造衣伯余造裳于则造履共鼓化狄作舟楫观转蓬作车作灶釜甑代茹毛饮血筑宫室重门击柝以待暴客
- id: guji-轩辕黄帝-event-calendar
  title_zh: 作文字历律
  date: '-2695'
  location: 玄扈洛水
  description: 凤鸟衔图置帝前天老辨为麟凤仓颉沮诵观鸟兽作文字代结绳大挠作甲子十二辰六旬伶伦采嶰谷竹作黄钟十二律容成隶首作历数权量
- id: guji-轩辕黄帝-event-zhulu
  title_zh: 涿鹿之战杀蚩尤
  date: '-2670'
  location: 涿鹿之野
  description: 蚩尤兄弟八十一人铜头铁额作雾三日帝令风后作指南车玄女授三宫秘略灵宝五符遁甲遂请风伯雨师天女祓破之杀蚩尤于凶黎之谷弃械化枫林画其形于旗
- id: guji-轩辕黄帝-event-banquan
  title_zh: 阪泉之战克榆罔
  date: '-2662'
  location: 阪泉之野
  description: 与神农后榆罔争天下以雕鹗为旗熊罴虎为前驱三战克之又北逐獯鬻凡五十二战天下大定诸侯共尊为天子
- id: guji-轩辕黄帝-event-fengshan
  title_zh: 合宫明堂封禅昆仑
  date: '-2660'
  location: 昆仑之墟西山
  description: 画野分州以云纪官作合宫明堂驾象车六龙会神灵于西山奏清角致丰祭西王母献玉环玄鹤翔舞立轩辕台
- id: guji-轩辕黄帝-event-death
  title_zh: 荆山崩逝
  date: '-2599'
  location: 荆山
  description: 在位百年以土德王天下旁行万里得百里之国万区既定制乃崩葬荆山群臣号帝鸿氏归藏氏
