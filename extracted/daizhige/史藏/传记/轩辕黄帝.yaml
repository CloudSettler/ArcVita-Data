  - 结绳朴治与书契文明何以代之
  lesson: 以土德居中而制四方观法天地制器济不通垂衣而治兼以武功定乱文武合一始见华夏大同
  summary_first_person: 吾姓公孙名轩辕有熊少典之子生于寿丘长于姬水十五而受国有熊以土德王号黄帝观蓬旋转而作车观浮叶而作舟命仓颉观鸟迹作文字令伶伦取竹作律吕大挠作甲子以定历尝百草作内外经问道西王母封禅昆仑昔蚩尤作雾涿鹿不克得风后力牧玄女授符乃擒杀之又三战克榆罔于阪泉遂合诸侯为天子旁行天下画野分州以云纪官天下大定
  source_urls:
