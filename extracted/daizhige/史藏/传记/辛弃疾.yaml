  - date: 1161-08-01
    title_zh: 劝耿京决策南向
    rationale: 金亮南寇中原蜂起，审南北顺逆之势，唯南向归宋方可凝忠义而图恢复
  - date: 1162-03-10
    title_zh: 约王世隆马全福缚张安国
    rationale: 安国杀京降金大变已成，若不立讨无以复命朝廷，遂以五十骑直入五万众中取逆
- id: guji-辛弃疾-endeavor-2
  title_zh: 经略淮防与词政相济
  goal: 陈恢复方略练民兵守淮，并于州郡宽征招流苏民而寓兵于民
  phases:
