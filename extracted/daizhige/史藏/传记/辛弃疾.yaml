    labels:
      zh: 美芹九议
    start_date: 1165-01-01
    highlight_event_id: guji-辛弃疾-event-meiqin
  - key: climax
    name: 滁州宽赋创奠枕楼
    labels:
      zh: 奠枕楼
    start_date: 1172-01-01
    highlight_event_id: guji-辛弃疾-event-dianzhen
  - key: closure
    name: 江东参议佐叶衡筹边
    labels:
      zh: 参议江东
    start_date: 1173-02-01
    highlight_event_id: guji-辛弃疾-event-jiangdong
  decisions:
  - date: 1162-06-01
    title_zh: 上论阻江为险须藉两淮疏
    rationale: 江为天险而须以两淮为藩篱，淮不守则江不可保，故请重淮防
  - date: 1165-05-01
    title_zh: 进美芹十论应对延和
    rationale: 和议方定而虞允文当国锐意恢复，因极论顺逆消长地形技长，欲以劲直之论挽回国是
  - date: 1172-03-01
    title_zh: 滁州宽征薄赋教民兵议屯田
    rationale: 州罹兵烬井邑凋残，非宽负贷屋教阅屯田无以聚流亡而实边圉
events:
- id: guji-辛弃疾-event-birth
  title_zh: 出生于历城
  date: 1140-05-11
  year_of: 1140
  place: 历城
  description: 宋高宗绍兴十年庚申五月十一日卯时生，字幼安，齐之历城人，称稼轩先生
- id: guji-辛弃疾-event-yanshan
  title_zh: 随计吏抵燕山谛观形势
  date: 1157-01-01
  year_of: 1157
  place: 燕山
  description: 两随计吏抵燕山，谛观金国形势，师事蔡松年与党怀英同学号辛党，并游大房山上方山一百八盘狭路
- id: guji-辛弃疾-event-gengjing
  title_zh: 聚众隶耿京为掌书记
  date: 1161-08-01
  year_of: 1161
  place: 山东济南
  description: 金主亮南寇豪杰并起，鸠众二千隶天平节度使耿京为掌书记，与图恢复，共籍兵二十五万，劝京决策南向
- id: guji-辛弃疾-event-fengbiao
  title_zh: 奉表归宋授承务郎
  date: 1162-02-01
  year_of: 1162
  place: 建康
  description: 绍兴三十二年奉耿京表入奏行在，高宗劳师建康召见嘉纳，授承务郎天平节度掌书记
- id: guji-辛弃疾-event-fuzhang
  title_zh: 缚张安国献俘行在
  date: 1162-03-15
  year_of: 1162
  place: 海州金营
  description: 张安国邵进杀耿京降金，还至海州约王世隆马全福径趋金营于众中缚安国以归，献俘行在斩于市
- id: guji-辛弃疾-event-jiangyin
  title_zh: 授江阴佥判上淮防二疏
  date: 1162-04-01
  year_of: 1162
  place: 江阴
  description: 改差江阴佥判，上论阻江为险须藉两淮疏及议练民兵守淮疏，言江淮唇齿之势
- id: guji-辛弃疾-event-meiqin
  title_zh: 进美芹十论及九议应对延和
  date: 1165-05-01
  year_of: 1165
  place: 建康
  description: 官司农寺主簿时召对延和殿论南北形势，陈美芹十论与九议并应问三篇，持论劲直以和议方定不行
- id: guji-辛弃疾-event-dianzhen
  title_zh: 知滁州创奠枕楼繁雄馆
  date: 1172-04-01
  year_of: 1172
  place: 滁州
  description: 知滁州宽征薄赋释负钱五百八十万，陶瓦贷民新屋，招流散教民兵议屯田，创奠枕楼使民岁时登临
- id: guji-辛弃疾-event-jiangdong
  title_zh: 辟江东安抚司参议官
  date: 1173-02-01
  year_of: 1173
  place: 建康
  description: 辟江东安抚司参议官，留守叶衡雅重之，为赋菩萨蛮金陵赏心亭诸词佐筹边
- id: guji-辛弃疾-event-death
  title_zh: 逝世
  date: 1207-10-03
  year_of: 1207
  place: 铅山
  description: 开禧三年秋卒于铅山，终年六十八，谥忠敏，后世以豪放词宗与爱国名将并称
