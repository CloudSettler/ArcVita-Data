      raw: 开禧三年九月十日
  birth_date: 1140-05-11
  death_date: 1207-10-03
  era: 南宋
  reign_ref: 绍兴
  archetype: 儒将词宗
  dilemmas:
  - 沦陷遗民当委质金廷以存身抑或裂帻南归以图恢复
  - 主战恢复之志与偏安和议之朝局如何自处
  - 儒将经略与词人悲慨何以并行不悖
  lesson: 以身践志不以成败论忠义，词与剑俱可报国，存高远而务实功
  summary_first_person: 吾幼安也，历城人，生于沦陷，祖训不忘国雠。金亮南寇，吾鸠众二千隶耿京图恢复，奉表归宋，缚逆安国于五万众中。后历江阴建康滁州，屡陈美芹九议，欲练民兵守淮以图进取。虽和议既定，偃蹇州郡，然登高望远之心未尝已，唯以词鸣其志耳。
  source_urls:
