person:
  qid: guji-郑成功
  name_zh: 郑成功
  names:
    zh: 郑成功
    en: Koxinga
  lifespan:
    birth:
      date: 1624-08-27
      precision: day
      is_circa: false
      raw: 明天启四年七月十四生于日本平户
    death:
      date: 1662-06-23
      precision: day
      is_circa: false
      raw: 永历十六年五月初八卒于台湾承天府
  birth_date: 1624-08-27
  death_date: 1662-06-23
  era: 明末清初
  reign_ref: 隆武永历
  archetype: 孤忠统帅
  dilemmas:
  - 父降清以全家富贵相招与君臣大义之抉择
  - 受招抚得侯爵安居与孤悬海上坚持抗清之抉择
  - 北伐金陵直捣腹心与东取台湾建立根基之抉择
  lesson: 忠孝难两全当以大义为先，不为利诱所动，因时制宜以海为家方能延续大业
  summary_first_person: 吾初名森，字大木，父芝龙早年宦海沉浮，吾七岁自日本归国，读书颖敏。隆武帝见而奇之，赐姓朱讳成功，授御营中军都督，人称国姓。父欲降清，吾泣谏不从，焚儒服于文庙，纠合九十余人起于南澳，踞金厦两岛，抗清十余载。曾率师北伐至金陵，惜败而还，后决计东征，驱逐荷兰，复我台湾，以为反清复明之基。孤臣一念，至死不渝。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%83%91%E6%88%90%E5%8A%9F%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%83%91%E6%88%90%E5%8A%9F%E4%BC%A0.md
  - https://ctext.org/wiki.pl?if=gb&res=905224
endeavors:
- id: guji-郑成功-endeavor-1
  title_zh: 海上举义与金厦立基
  summary_zh: 自隆武赐姓后，力谏父芝龙不降清，焚服起兵，南澳收众，经营厦门金门，屡败清军，坚守海澄，分镇设官，以海为国，支撑东南抗清局面。
  phases:
  - key: brewing
    name: 焚服起兵
    labels:
      zh: 孤忠明志
    start_date: 1646-10-01
    highlight_event_id: guji-郑成功-event-fenfu
  - key: breakthrough
    name: 合并两岛
    labels:
      zh: 夺厦并军
    start_date: 1651-08-15
    highlight_event_id: guji-郑成功-event-bingliangdao
  - key: climax
    name: 坚守海澄
    labels:
      zh: 固守反击
    start_date: 1656-05-01
    highlight_event_id: guji-郑成功-event-haicheng
  - key: closure
    name: 经略东南
    labels:
      zh: 建制储贤
    start_date: 1658-01-01
    highlight_event_id: guji-郑成功-event-jianzhi
  decisions:
  - date: 1646-09-01
    title_zh: 拒绝随父降清焚服明志
    rationale: 父以闽粤总制相诱，贝勒书招，吾以为北朝无信，忠臣不事二主，宁为孤臣不可为贰臣
  - date: 1651-08-15
    title_zh: 智取厦门并郑联军
    rationale: 两岛乃卧榻之侧不可容人鼾睡，必先一统内部方能对外抗清，故诈邀郑联而收其众四万
  - date: 1656-05-01
    title_zh: 亲立雉堞死守海澄
    rationale: 金固山大军攻城坏百丈，若弃则门户尽失，唯有亲临敌楼激励士气方可转危为安
- id: guji-郑成功-endeavor-2
  title_zh: 北伐金陵与东复台湾
  summary_zh: 永历晋封延平王后，与张煌言合谋大举北伐，虽克镇江围南京而功败，又审时拒清廷海澄公诱封，转而东征，驱逐荷兰殖民者，收复台湾，开府置县，为汉人拓土。
  phases:
  - key: brewing
    name: 会师北伐
    labels:
      zh: 兴师北上
    start_date: 1659-07-01
    highlight_event_id: guji-郑成功-event-nanjing
  - key: breakthrough
    name: 渡海东征
    labels:
      zh: 决取台湾
    start_date: 1661-04-30
    highlight_event_id: guji-郑成功-event-futai
  - key: climax
    name: 围赤嵌城
    labels:
      zh: 驱荷复土
    start_date: 1661-05-01
    highlight_event_id: guji-郑成功-event-chixian
  - key: closure
    name: 开台守业
    labels:
      zh: 承天建制
    start_date: 1662-02-01
    highlight_event_id: guji-郑成功-event-death
  decisions:
  - date: 1659-07-01
    title_zh: 决议大举入寇金陵
    rationale: 永历策动西南，李定国大捷，东南人心震动，此时合兵北上可成犄角，直捣留都以摇清本
  - date: 1661-03-01
    title_zh: 拒绝海澄公封决计取台湾
    rationale: 叶阿二使来议抚，授海澄公同安侯，吾知此羁縻之术，唯台湾沃野千里可为根基，不可受封而自缚
  - date: 1661-04-30
    title_zh: 率师横渡黑水沟围攻赤嵌
    rationale: 南京败后元气未复，清军迁界困我，唯有夺荷兰之台湾以为粮饷屯垦之地，方能久持
events:
- id: guji-郑成功-event-birth
  title_zh: 生于日本平户
  date: 1624-08-27
  year_of: 1624
  place_zh: 日本平户
  description_zh: 郑芝龙娶倭妇田川氏，是夜万火齐明，生郑森，小名福松，风仪整秀，甫数岁而归国
- id: guji-郑成功-event-cixing
  title_zh: 隆武赐姓授国姓
  date: 1645-10-01
  year_of: 1645
  place_zh: 福州
  description_zh: 隆武帝奇其才，抚背曰惜无一女配卿，赐姓朱改名成功，封御营中军都督赐尚方剑，自是中外称国姓
- id: guji-郑成功-event-fenfu
  title_zh: 焚儒服南澳起兵
  date: 1646-12-01
  year_of: 1646
  place_zh: 南澳
  description_zh: 父芝龙挟北去，母死于清兵，力谏不从，携儒巾襕衫赴文庙焚之，四拜先师，高揖而去，与陈辉施琅等九十余人断缆入海，称忠孝伯招讨大将军
- id: guji-郑成功-event-bingliangdao
  title_zh: 智并厦门金门两岛
  date: 1651-08-15
  year_of: 1651
  place_zh: 厦门
  description_zh: 自揭阳扬帆中秋抵厦，郑联醉于万石岩，成功诈邀借军，麾军并其众，可四万余人，海上军皆属焉
- id: guji-郑成功-event-haicheng
  title_zh: 海澄大战击退金固山
  date: 1656-05-15
  year_of: 1656
  place_zh: 海澄
  description_zh: 金固山攻海澄城坏百余丈，成功亲立雉堞指挥自若，令持斧待敌登城而砍，填壕大捷，固山宵遁，厮养卒立功拜都督
- id: guji-郑成功-event-jianzhi
  title_zh: 设六官储贤馆建制思明州
  date: 1658-01-01
  year_of: 1658
  place_zh: 厦门
  description_zh: 分所部为七十二镇，设吏户礼兵刑工六官，立储贤储材馆察言宾客司，改中左所为思明州，奉鲁王宁靖王于金门，礼待王忠孝徐孚远等名士
- id: guji-郑成功-event-nanjing
  title_zh: 会张煌言北伐金陵
  date: 1659-07-01
  year_of: 1659
  place_zh: 南京
  description_zh: 永历晋封延平王，成功以黄廷为前提督留守，部署铁甲力士，自崇明北上克瓜洲镇江围南京，惜功败垂成而还
- id: guji-郑成功-event-futai
  title_zh: 率师东渡围台湾
  date: 1661-04-30
  year_of: 1661
  place_zh: 台湾鹿耳门
  description_zh: 率将士自金厦横渡，破荷兰水师，登陆围赤嵌城，断其援道，屯田围困
- id: guji-郑成功-event-chixian
  title_zh: 荷兰投降收复台湾
  date: 1662-02-01
  year_of: 1662
  place_zh: 热兰遮城
  description_zh: 荷兰揆一力竭而降，成功收台湾全岛，改赤嵌为承天府，设天兴万年二县，置屯垦，台湾复为汉土
- id: guji-郑成功-event-death
  title_zh: 卒于承天府
  date: 1662-06-23
  year_of: 1662
  place_zh: 台湾承天府
  description_zh: 经略台湾未久，闻父芝龙被戮于北京，忧愤成疾，卒年三十九，子郑经嗣延平王位，葬于台南，及后归葬南安
