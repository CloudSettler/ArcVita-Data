  summary_zh: 博洛班师携芝龙入京，诏隶汉军正黄旗。
- id: guji-郑芝龙-event-peerage
  type: career
  title_zh: 叙投诚功授三等子爵
  date: 1648
  precision: year
  is_circa: false
  year_of: 1648
  raw: 顺治五年，叙芝龙投诚功，授三等子爵
  summary_zh: 朝廷叙其投诚之功，授三等子爵。
- id: guji-郑芝龙-event-tongan-earl
  type: career
  title_zh: 封同安伯，奉命招谕郑成功
  date: 1653
  precision: year
  is_circa: false
  year_of: 1653
  raw: 顺治十年，诏封芝龙同安伯、成功海澄伯、鸿逵奉化伯
  summary_zh: 命芝龙以手书谕成功及鸿逵降，许赦罪授官；诏封同安伯，而成功不受封，扰如故。
- id: guji-郑芝龙-event-arrest
  type: career
  title_zh: 龚鼎孳疏劾，革爵下狱
  date: 1655
  precision: year
  is_circa: false
  year_of: 1655
  raw: 顺治十二年，龚鼎孳疏劾……诏革芝龙爵，下狱
  summary_zh: 左都御史龚鼎孳劾其家仆通海、子弄兵而父高枕都下；巡抚佟国器又获其与成功私书。诏革爵下狱。
- id: guji-郑芝龙-event-exile
  type: career
  title_zh: 流徙宁古塔
  date: 1657
  precision: year
  is_circa: false
  year_of: 1657
  raw: 顺治十四年，梧具揭兵部，请速翦芝龙以绝盗根；诏流芝龙及其家属于宁古塔
  summary_zh: 黄梧以不杀芝龙则成功之心不死为言，诏流芝龙及其家属于宁古塔。
- id: guji-郑芝龙-event-death
  type: death
  title_zh: 与子世恩、世荫、世默等伏诛
  date: 约1661-12
  precision: month
  is_circa: true
  year_of: 1661
  raw: 顺治十八年……是冬，芝龙及子世恩、世荫、世默等俱伏诛
  summary_zh: 郑成功入据台湾后，是冬芝龙及其子世恩、世荫、世默等俱伏诛。
