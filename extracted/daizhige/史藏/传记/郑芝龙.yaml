person:
  qid: guji-郑芝龙
  name_zh: 郑芝龙
  names:
    zh: 郑芝龙
    en: Zheng Zhilong
  lifespan:
    birth:
      date: 约1604
      precision: year
      is_circa: true
      raw: 生年传未详；据传成功于顺治三年年二十三上推，史传约一六〇四
    death:
      date: 约1661-12
      precision: month
      is_circa: true
      raw: 顺治十八年冬伏诛
  birth_date: 约1604
  death_date: 约1661-12
  era: 明末清初
  reign_ref: 明万历至崇祯、南明隆武；清顺治
  archetype: 海上枭雄而降臣
  dilemmas:
  - 忠奸之择：阳奉唐王隆武之爵，阴与同乡清使洪承畴、黄熙允通款密谋归款，两头下注终致两头落空
  - 父子之义：奉旨手书谕降郑成功，子拒不受封、不肯薙发，父在京师反成朝廷质子与革爵之因
  - 家族存续：举家入京、请改隶镶红旗、遣子入充侍卫以示归诚无贰，仍不免阖门下狱流徙之祸
  lesson: 首鼠两端者，进不能全忠，退不能保族；降人的富贵只系于新主一时的利用之价，价尽则族灭。
  summary_first_person: 我郑芝龙，福建南安人。明末亡命海上，入颜思齐党为盗，又曾至日本娶倭妇，生子成功；后受明廷招抚，累官总兵。乙酉之岁，弟鸿逵与黄道周拥立唐王于福建，封我南安伯、晋平国公，然聿键之立非我本意。我因同乡洪承畴、黄熙允通音问、密归款，博洛贝勒兵至，即率所部降于军门，隶汉军正黄旗，叙功授三等子爵，后封同安伯。无奈成功年二十三，谏阻不从，遁入海踞厦门抗清十余年；我以父嫌为龚鼎孳所劾，革爵下狱，流宁古塔，顺治十八年冬与子世恩、世荫、世默等俱伏诛。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8F%B0%E6%B9%BE%E6%96%87%E7%8C%AE%E6%B8%85%E5%8F%B2%E5%88%97%E4%BC%A0%E9%80%89.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%8F%B0%E6%B9%BE%E6%96%87%E7%8C%AE%E6%B8%85%E5%8F%B2%E5%88%97%E4%BC%A0%E9%80%89.md
endeavors:
- id: guji-郑芝龙-endeavor-1
  name_zh: 海上起家与南明拥立
  summary_zh: 由海盗而明总兵，由明平国公而暗谋降清，一生以海上势力为注，两头观望。
  phases:
  - key: brewing
    name: 亡命海上入颜思齐党
    labels:
      zh:
      - 海上
      - 颜思齐党
    start_date: 约1625
    highlight_event_id: guji-郑芝龙-event-piracy
  - key: breakthrough
    name: 受抚累官总兵
    labels:
      zh:
      - 招抚
      - 总兵
    start_date: 约1628
    highlight_event_id: guji-郑芝龙-event-pacify
  - key: climax
    name: 拥立唐王晋平国公
    labels:
      zh:
      - 隆武
      - 平国公
    start_date: 1645
    highlight_event_id: guji-郑芝龙-event-enthronement
  - key: closure
    name: 率所部降清
    labels:
      zh:
      - 博洛
      - 归款
    start_date: 约1646
    highlight_event_id: guji-郑芝龙-event-surrender
  decisions:
  - date: 约1628
    title_zh: 弃盗受明廷招抚
    rationale: 由盗而官，藉招抚得总兵之位与海上经略之便，为郑氏海业奠基。
  - date: 1645
    title_zh: 虚与唐王政权周旋
    rationale: 聿键之立非己意，日与文臣忤，阳受隆武爵命而阴存观望。
  - date: 约1646
    title_zh: 密谋归款出降
    rationale: 同乡洪承畴、黄熙允奉使招抚，通音问既久；见明祚将尽，博洛以书相招，遂降以保家业。
- id: guji-郑芝龙-endeavor-2
  name_zh: 北上恩宠与族诛之祸
  summary_zh: 降清后爵至同安伯，然子成功据海不降，父嫌日深，终由下狱、流徙而阖门伏诛。
  phases:
  - key: brewing
    name: 隶汉军正黄旗
    labels:
      zh:
      - 汉军正黄旗
    start_date: 1647
    highlight_event_id: guji-郑芝龙-event-banner
  - key: breakthrough
    name: 叙功授三等子爵
    labels:
      zh:
      - 三等子爵
    start_date: 1648
    highlight_event_id: guji-郑芝龙-event-peerage
  - key: climax
    name: 封同安伯手谕招子
    labels:
      zh:
      - 同安伯
      - 招抚郑成功
    start_date: 1653
    highlight_event_id: guji-郑芝龙-event-tongan-earl
  - key: closure
    name: 下狱流徙至伏诛
    labels:
      zh:
      - 革爵下狱
      - 宁古塔
    start_date: 1655
    highlight_event_id: guji-郑芝龙-event-death
  decisions:
  - date: 约1651
    title_zh: 举家入京、请改隶镶红旗
    rationale: 请留弟芝豹及子世恩守祖墓，母妻诸子随入京，并请改隶镶红旗汉军，以示归诚无贰。
  - date: 1653
    title_zh: 手书谕成功出降
    rationale: 奉旨以父子之情招抚，许赦罪授官、听驻原地防剿海寇并管洋船，冀消海上之患以自固。
  - date: 1657
    title_zh: 无可自辩而就流徙
    rationale: 黄梧具揭谓不杀芝龙则成功之心不死、海上诸将投诚之意不决，遂诏流宁古塔，恩宠既移，无可挽回。
