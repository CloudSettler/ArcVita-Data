  - 降清求富贵与故国忠义之间的抉择
  - 功高赏薄，愤而举兵反正
  lesson: 依违于两大势力之间的武将，终难自全，覆亡于朝秦暮楚。
  summary_first_person: 我本明将，降清后以功取江西，然刻核凌侮终使我愤而反正归明，兵败南昌，身死城破。
  source_urls:
  - 清史列传·卷八十·逆臣传（金声桓）
