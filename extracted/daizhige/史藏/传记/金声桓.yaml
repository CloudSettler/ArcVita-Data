events:
- id: guji-金声桓-event-birth
  event_type: birth
  date: ''
  year_of: ''
  summary_zh: 生年不详，辽东人，明末为总兵左良玉部将。
- id: guji-金声桓-event-join-ming
  event_type: endeavor-start
  date: ''
  year_of: 1643
  summary_zh: 隶左良玉麾下为将，随军驻武昌。
- id: guji-金声桓-event-surrender
  event_type: decision
  date: '1645'
  year_of: 1645
  summary_zh: 顺治二年，随左梦庚降清，移师江西。
- id: guji-金声桓-event-conquer-jiangxi
  event_type: achievement
  date: '1645'
  year_of: 1645
  summary_zh: 自请进兵，连克南昌等江西诸郡，实以己力定江西，授总兵，镇南昌。
- id: guji-金声桓-event-grudge
  event_type: turning-point
  date: '1647'
  year_of: 1647
  summary_zh: 巡抚董学成、按察使成大业凌侮掣肘，诛其部将王得仁之谋事者，嫌怨日深。
- id: guji-金声桓-event-rebellion
  event_type: decision
  date: '1648'
  year_of: 1648
  summary_zh: 顺治五年正月，与王得仁举兵反正，杀巡抚以下官，奉南明永历年号。
- id: guji-金声桓-event-nanchang-siege
  event_type: conflict
  date: '1648'
  year_of: 1648
  summary_zh: 反正后遣兵攻略州郡，旋遭清定时征南大将军谭泰等围攻南昌，久困孤城。
- id: guji-金声桓-event-death
  event_type: death
  date: '1649'
  year_of: 1649
  summary_zh: 顺治六年正月，南昌城破，声桓身中矢投水死。（或城陷自尽）
