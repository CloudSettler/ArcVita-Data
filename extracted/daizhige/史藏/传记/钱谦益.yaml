  dilemmas:
  - 出仕新朝还是守节明室：南明弘光朝覆亡后降清，身后在《清史列传》中入贰臣之列
  lesson: 鼎革之际，出处一念之间，名节与功业难以两全
  summary_first_person: 我是钱谦益，明清易代之际的文坛领袖。于明末历仕万历至崇祯诸朝，弘光时在南京任职；江南既定，我归顺本朝，后罢归。我这出处进退的抉择，留给后人无尽的评说。
  source_urls:
  - https://zh.wikisource.org/wiki/清史列傳
