  reign_ref: 历高宗、孝宗、光宗、宁宗四朝，本记所涉为隆兴、乾道、嘉泰年号
  archetype: 工文之行的旅行作家与舆地考据家（日记体行纪之范式）
  dilemmas:
  - 志切中原恢复而言事见黜、久沉下僚，远佐夔郡，进退之际不能无概然
  - 乾道五年冬久病未堪远役，谋以夏初离乡；王命所系，仍须携家冒暑溯江数千里
  lesson: 行万里路以证有字之书：亲历山川与金石诗文互勘，遇疑不苟，方能订正千古之讹
  summary_first_person: 我陆游，字务观，号放翁，越州山阴人，佃之孙、宰之子。初以恩荫补登仕郎，隆兴初赐进士出身，嘉泰初官至宝谟阁待制。乾道五年十二月六日得报差通判夔州，方久病未堪远役，谋以夏初离乡；六年闰五月十八日自山阴启行，由运河入江，溯流西上，十月二十七日抵夔州。沿途于山川风土叙次雅洁，于考订古迹尤所留意——证丹阳皇业寺即皇基寺、李白所咏新丰酒非长安之新丰、甘露寺狠石与多景楼皆非故迹、保大九年祭悟空禅师文乃南唐元宗非后主等，因述道路所经，以为《入蜀记》四卷。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%85%A5%E8%9C%80%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%85%A5%E8%9C%80%E8%AE%B0.md
