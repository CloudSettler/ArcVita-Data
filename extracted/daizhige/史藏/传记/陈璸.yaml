  decisions:
  - date: '1709-03-01'
    title_zh: 督学二载纤毫不取陋规
    rationale: 学政为士风所系一开苞苴则士术坏故立意一切陋规悉革
  - date: '1714-12-01'
    title_zh: 陛见奏取一钱即为伤廉
    rationale: 贪不在多取一钱已堕名检故以此自矢亦以此上白天听坚清操之志
  - date: '1716-02-01'
    title_zh: 以巡抚公用及俸钱筑雷州洋田海堤
    rationale: 堤逼大海潮汐倾圮民事为重不以公项自私用以永固海防
