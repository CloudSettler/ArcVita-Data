  - 封疆节钺重寄与布素寒约自持如何始终不渝
  lesson: 取一钱即为伤廉一介不苟方谓不贪清操不在多取而在一念之严
  summary_first_person: 吾雷州海康人也自幼孤贫从学举业康熙三十三年成进士由古田令历台湾治以廉能闻简督学蜀中杜绝苞苴分守台厦三万例金悉屏不受幸蒙圣祖知遇谓为国家祥瑞由偏沅而抚闽一生惟以茹蘖饮水持己以大纲不苛为治筑雷州洋田海堤以存公项俸钱修之终以布素终身得谥清端无愧四知之守
  source_urls:
