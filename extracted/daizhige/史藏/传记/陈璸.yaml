    rationale: 初膺百里自誓一文不取即足用不以穷苦易廉隅
- id: guji-陈璸-endeavor-2
  title_zh: 廉节风轨与封疆节钺
  summary_zh: 督学四川杜绝苞苴分守台厦却三万例金特擢偏沅福建巡抚举大纲不尚烦苛却署督规例以公项筑雷州万顷洋田海堤圣祖称为苦行老僧国家祥瑞
