    start_date: '1602-01-01'
    highlight_event_id: guji-陈第-event-1606-maoshikao
  - key: climax
    name: 再著屈宋古音义成体系
    labels:
      zh: 高峰
    start_date: '1606-06-01'
    highlight_event_id: guji-陈第-event-1606-maoshikao
  - key: closure
    name: 晚年遍游五岳两粤以诗存游草
    labels:
      zh: 收束
    start_date: '1610-01-01'
    highlight_event_id: guji-陈第-event-1610-wuyue
  decisions:
  - date: '1595-01-01'
    title_zh: 就焦竑谈经借读所未见书
    rationale: 欲明风雅汉魏之音，不以先人之说锢灵府，须博览秘籍以求古音之变
  - date: '1606-01-01'
    title_zh: 撰成毛诗古音考
    rationale: 以今音读古诗多不协，遂考三代秦汉之音，立古音学之宗，为后世吴才老以降之先河
  - date: '1610-03-01'
    title_zh: 弃箪瓢而作五岳两粤之游
    rationale: 母殁后无中馈之牵，欲穷山川之胜，效霞客之前踪，以游历广闻见而证诗文
events:
- id: guji-陈第-event-birth
  date: '1541-03-03'
  year_of: '1541'
  title_zh: 生于连江化龙桥北
  place: 连江西郊化龙桥北
  description: 嘉靖二十年辛丑三月三日生，父木山公时年三十二，母杨孺人三十一，梦雷震而生，隆准方瞳，游僧谓声出丹田必成远器
- id: guji-陈第-event-1562-meet-qi
  date: '1562-08-01'
  year_of: '1562'
  title_zh: 晤戚继光献平倭策
  place: 连江马鼻
  description: 嘉靖四十一年戚继光征倭至连江，第首仗剑从游，定平倭策，秘军声作八音以通语，创土板以行泥淖，选壮士演狼筅必字阵，大破倭寇于横屿牛田
- id: guji-陈第-event-1573-study-yu
  date: '1573-09-01'
  year_of: '1573'
  title_zh: 从俞大猷学兵法
  place: 连江
  description: 万历元年癸酉九月下帷家居，俞大猷过而聘之，授以韬钤方略尽得其传，大猷喜曰子当为名将非书生也，谭纶亦谓真俞戚之流亚
- id: guji-陈第-event-1580-gubeikou
  date: '1580-01-01'
  year_of: '1580'
  title_zh: 守古北口绥靖蓟门
  place: 古北口
  description: 受大司马谭纶荐守古北口要地，在蓟十年，调和文武敦睦兵民，筑城创桥兴学讲武，使边民乐业行旅不惊，以鲠忤总督遂拂衣归
- id: guji-陈第-event-1595-jiaohong
  date: '1595-01-01'
  year_of: '1595'
  title_zh: 就金陵焦竑谈经
  place: 金陵
  description: 归里杜门读书后，就焦弱侯谈经，借读所未见书，博稽三代秦汉韵书，始有意于古音之考
- id: guji-陈第-event-1606-maoshikao
  date: '1606-01-01'
  year_of: '1606'
  title_zh: 成毛诗古音考与屈宋古音义
  place: 连江
  description: 著毛诗古音考二卷及屈宋古音义，为发明中国古音第一人，焦竑称其弃将握重兵而为野衲为三异之一，启清代古音学之大备
- id: guji-陈第-event-1610-wuyue
  date: '1610-03-01'
  year_of: '1610'
  title_zh: 晚年遍游五岳两粤
  place: 五岳两粤
  description: 母殁后出游名山大川，足迹遍海内，作五岳游草及两粤游草，山川风物出以吟咏，与徐霞客并为明代大旅行家
- id: guji-陈第-event-death
  date: '1617'
  year_of: '1617'
  title_zh: 卒于里第
  place: 连江
  description: 万历四十五年卒，年七十七，遗有寄心集、五岳游草等，一斋全集传世，为名将兼硕儒之典范
