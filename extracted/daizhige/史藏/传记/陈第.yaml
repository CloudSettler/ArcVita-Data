- id: guji-陈第-endeavor-1
  title_zh: 御倭守边与蓟门经略
  summary: 自诸生而为俞大猷、戚继光幕中参谋，献平倭策，学得韬钤，守古北口要地，调和文武，筑城兴学，后以鲠忤总督拂衣归里
