  archetype: 儒将兼古音学家
  dilemmas:
  - 以书生而谈兵，欲以武功报国与以著述明道之间的出处抉择
  - 以名将身份握重兵守边与拂衣归隐杜门著述、遍游名山的去就之辨
  lesson: 投笔从戎可安边，解甲归儒可传学；文武合一而后能兼济边民与学术
  summary_first_person: 吾少颖悟，喜谈兵法，得俞大猷授以韬钤，参戚继光幕以定平倭策，守古北口使边民乐业；后忤总督而归，杜门读书，就焦竑谈经，考三代之音，著毛诗古音考与屈宋古音义为古音学先河；晚年遍游五岳两粤，吟咏自适，不以穷達易其志。
