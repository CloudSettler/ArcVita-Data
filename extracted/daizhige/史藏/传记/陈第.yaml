    highlight_event_id: guji-陈第-event-1580-gubeikou
  decisions:
  - date: '1562-08-01'
    title_zh: 仗剑从戚继光献平倭策
    rationale: 倭寇陷连江诸县，欲以书生意气济实用，乃仿乘橇作土板、秘军声作八音以助官军破横屿牛田之巢
  - date: '1573-09-01'
    title_zh: 下帷从俞大猷受兵法
    rationale: 慕俞公为明师，得其方略，遂由诸生转为名将之亚，为后日守边奠基
  - date: '1585-01-01'
    title_zh: 以鲠忤总督拂衣归里
    rationale: 不阿权贵，知武功难展于掣肘之局，遂弃官归，转向经术与著述
- id: guji-陈第-endeavor-2
  title_zh: 古音学开创与著述游历
  summary: 就金陵焦竑谈经借览秘籍，发明古音之学，著毛诗古音考、屈宋古音义，为明清古音学先河；晚年出游五岳两粤，诗纪山川，兼为大旅行家
  phases:
  - key: brewing
    name: 归里读书就焦竑问学
