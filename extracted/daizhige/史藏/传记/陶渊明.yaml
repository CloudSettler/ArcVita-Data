  era: 东晋刘宋
  reign_ref: 晋哀帝兴宁三年至宋文帝元嘉四年
  archetype: 隐逸诗宗
  dilemmas:
  - 出仕羁役与归返自然之抉择
  - 贫病交迫与守节不渝之坚忍
  - 世家勋阀期待与个人高风独立之冲突
  lesson: 不为五斗米折腰，委心任化，守真安贫
  summary_first_person: 余生于浔阳柴桑，少怀高尚，误落尘网，历州郡镇军之役，终以彭泽一令决计归田，躬耕南亩，寄情诗酒，纵浪大化中，不喜亦不惧。
  source_urls:
