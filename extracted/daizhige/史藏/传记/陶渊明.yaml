  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E7%BB%8D%E9%99%B6%E5%BD%95.html
endeavors:
- id: guji-陶渊明-endeavor-1
  title_zh: 仕宦羁旅与归去来辞
  summary: 自州祭酒主簿而至镇军建威参军，以至彭泽令，屡出屡归，终作归去来辞，决去官守，息交绝游，定居柴桑。
  phases:
  - key: brewing
    name: 初为州郡吏
    labels:
      zh: 州祭酒主簿
    start_date: 0393
    highlight_event_id: guji-陶渊明-event-zhouji
  - key: breakthrough
    name: 参镇军建威
    labels:
      zh: 镇军建威参军
    start_date: '0400'
    highlight_event_id: guji-陶渊明-event-zhenjun
  - key: climax
    name: 出宰彭泽
    labels:
      zh: 彭泽令
    start_date: 0405-08
    highlight_event_id: guji-陶渊明-event-pengze
  - key: closure
    name: 归去来兮
    labels:
      zh: 归隐柴桑
    start_date: 0405-11
    highlight_event_id: guji-陶渊明-event-guiqulai
  decisions:
  - date: 0394
    title_zh: 不堪州吏复归田园居
    rationale: 以园林诗书为夙好，不堪樊笼劳役，暂解职归，复得返自然
  - date: 0405-08
    title_zh: 求为彭泽令
    rationale: 亲老家贫，公田足以为酒，且去家百里，可兼奉养与眷然之情
  - date: 0405-11
    title_zh: 不为五斗米折腰而辞官
    rationale: 风波未定，心惮远役，质性自然，非矫厉所得，遂尽介然之分，拂衣归田里
- id: guji-陶渊明-endeavor-2
  title_zh: 耕读自资与田园诗开宗
  summary: 归田后躬耕西畴下潠，杂诗饮酒，采菊东篱，创田园一体，确立隐逸人格与诗学正宗。
  phases:
  - key: brewing
    name: 南村西畴之营
    labels:
      zh: 移居南村
    start_date: 0405-12
    highlight_event_id: guji-陶渊明-event-guiqulai
  - key: breakthrough
    name: 耕织艰贞
    labels:
      zh: 耕稼自给
    start_date: '0406'
    highlight_event_id: guji-陶渊明-event-gengxi
  - key: climax
    name: 诗酒畅情
    labels:
      zh: 饮酒咏怀
    start_date: '0410'
    highlight_event_id: guji-陶渊明-event-yinjiu
  - key: closure
    name: 安化委运
    labels:
      zh: 临化如归
    start_date: '0427'
    highlight_event_id: guji-陶渊明-event-death
  decisions:
  - date: '0406'
    title_zh: 迁居南村躬耕
    rationale: 素心友朋相呼有酒，闻多素心人乐与数晨夕，故恋南村甚坚，不复他适
  - date: '0414'
    title_zh: 谢绝征召著作郎
    rationale: 已洞知进退之分，纵览大化，不喜不惧，应尽便须尽，无复独多虑
  - date: '0427'
    title_zh: 作自祭文拟挽歌
    rationale: 律中无射，视化如归，临凶若吉，不复祷药，寄寓逆旅，委心自然
events:
- id: guji-陶渊明-event-birth
  title_zh: 生于浔阳柴桑
  date: '0365'
  year_of: '0365'
  description: 兴宁三年乙丑生于浔阳柴桑，父轶，母孟嘉女，陶侃之后裔
  kind: birth
- id: guji-陶渊明-event-zhouji
  title_zh: 初为州祭酒主簿复归
  date: 0393
  year_of: 0393
  description: 太元末年始为州祭酒，不堪而解归，作归田园居，言误落尘网久在樊笼复得返自然
  kind: career
- id: guji-陶渊明-event-zhenjun
  title_zh: 参镇军建威衔命往来江陵
  date: 0400-05
  year_of: '0400'
  description: 隆安四年庚子参镇军，自都还阻风规林，往来浔阳江陵之间，诗书为好而厌远役
  kind: career
- id: guji-陶渊明-event-pengze
  title_zh: 为彭泽令八十余日
  date: 0405-08
  year_of: '0405'
  description: 义熙元年乙巳为建威参军使都，后为彭泽令，去家百里，公田足以酿酒
  kind: career
- id: guji-陶渊明-event-guiqulai
  title_zh: 作归去来辞辞官归隐
  date: 0405-11
  year_of: '0405'
  description: 义熙元年十一月自彭泽免归，作归去来辞，言风波未定心惮远役，自此断不他适，定居柴桑
  kind: career
- id: guji-陶渊明-event-gengxi
  title_zh: 耕西田下潠
  date: '0406'
  year_of: '0406'
  description: 归后耕西田下潠，平畴交远风，良苗怀新，虽饥窘而躬耕不辍，有乞食诸诗
  kind: career
- id: guji-陶渊明-event-yinjiu
  title_zh: 饮酒咏怀成什
  date: '0415'
  year_of: '0415'
  description: 义熙末至元嘉初，作饮酒二十首及杂诗，言僶俛四十年立年多耻，寄趣琴觞，采菊东篱
  kind: career
- id: guji-陶渊明-event-death
  title_zh: 卒于柴桑
  date: '0427'
  year_of: '0427'
  description: 元嘉四年丁卯杪秋下世，年六十三，作自祭文拟挽歌，颜延之诔曰视化如归临凶若吉，颜色如常
  kind: death
