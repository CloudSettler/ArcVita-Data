person:
  qid: guji-韩琦
  name_zh: 韩琦
  names:
    zh: 韩琦
    en: Han Qi
  lifespan:
    birth:
      date: 约1008
      precision: year
      is_circa: true
      raw: 神宗御制碑称其薨于熙宁八年（1075年）六月甲寅、享年六十八，逆推当生于约1008年
    death: 约1075-07
  birth_date: 约1008
  death_date: 约1075-07
  era: 北宋
  reign_ref: 宋仁宗·宋英宗·宋神宗
  archetype: 出将入相·两朝顾命的定策元勋
  dilemmas:
  - 对夏攻守之择——主并兵一道以攻元昊之骄惰，朝廷持重难之，任福违节度败殁，独被夺官之责，进取与持重难以两全
  - 建言立嗣之险——仁宗春秋高而皇嗣未立，群臣顾避退缩莫敢言，冒触讳之险直谏与保身缄默之间的取舍
  - 籍义勇之两难——司马光力争其扰民而陕西戍兵常不足，强兵实边与恤民减负相持，遂自任以一身救数万之命
  - 绥州弃守之悖——朝命以馈饷难继废城，而城扼贼冲不可失，遵敕与守土相悖，抗议便宜固守以任其咎
  lesson: 临大事、决大疑而辞气雍容；谋国当先社稷之远，不以一身毁誉避事；功高不矜，位大不骄，禄富不侈。
  summary_first_person: 我姓韩名琦，字稚圭，相州安阳人。天圣五年甫冠举进士甲科，为谏官时连疏中书，一日罢四执政。元昊叛，驰抚陕西，与范仲淹并称韩范，同除枢密副使。后帅定州、并州、大名府，募弓箭手垦田九千六百顷，辽使以韩丞相之故特书名。仁宗无嗣，我乘间力请择宗室之贤，遂诏立皇子；嘉祐八年三月壬申奉仁宗顾命立英宗，既而请太后还政、督籍陕西义勇十四万，治平四年正月庚戌复被顾命立今上。晚岁固请出外，历判相州、永兴军、大名府，抗诏保绥州，揭榜招横山之羌而功不就。熙宁八年六月甲寅薨，年六十八，赠尚书令，谥忠献，上制碑曰两朝顾命定策元勋。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%90%8D%E8%87%A3%E7%A2%91%E4%BC%A0%E7%90%AC%E7%90%B0%E9%9B%86.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E5%90%8D%E8%87%A3%E7%A2%91%E4%BC%A0%E7%90%AC%E7%90%B0%E9%9B%86.html
endeavors:
- id: guji-韩琦-endeavor-1
  name_zh: 靖边御夏
  description_zh: 自谏官出帅陕西，与范仲淹共御元昊，名重天下；后历帅定州、并州、大名，籍义勇、垦边田，谋复横山故地。
  phases:
  - key: brewing
    name: 临危抚边
    labels:
      zh:
      - 陕西经略安抚使
      - 御夏
    start_date: 约1040
    highlight_event_id: guji-韩琦-event-yanzhou
  - key: breakthrough
    name: 韩范并称
    labels:
      zh:
      - 枢密副使
      - 攻守二策
    start_date: 约1043
    highlight_event_id: guji-韩琦-event-shumi-fushi
  - key: climax
    name: 断和籍勇
    labels:
      zh:
      - 大顺城问罪
      - 义勇十四万
    start_date: 约1064
    highlight_event_id: guji-韩琦-event-yiyong
  - key: closure
    name: 招羌拓横山志不就
    labels:
      zh:
      - 绥州固守
      - 功卒不就
    start_date: 约1067
    highlight_event_id: guji-韩琦-event-hengshan
  decisions:
  - date: 约1040
    title_zh: 力主以攻策伐夏
    rationale: 元昊以区区数州之地而志气骄惰，宜并兵一道鼓行而前可无坚敌；朝廷难之，遂持攻守二策以决于上
  - date: 约1041
    title_zh: 识诈和而令诸将日夜戒严
    rationale: 无约而请和者谋也，方召兵瓦亭而贼已寇山外，故下令诸将日夜戒严，坚壁以伺其弊
  - date: 约1053
    title_zh: 募弓箭手垦潘美所空禁地
    rationale: 敌日加侵而失耕是将遗敌，乃募弓箭手四千户垦田九千六百顷，边实而民利
  - date: 约1064
    title_zh: 督籍陕西义勇十四万
    rationale: 昔籍民兵涅面为官军而父母妻子环顾以泣，今愿以一身救数万之命，得实边之兵而不改民籍
  - date: 约1066
    title_zh: 议停岁赐问罪谅祚
    rationale: 谅祚狂童非有元昊之智计而边备大过昔日，诘之其心必服；英宗用其策遣使赍诏，谅祚惧而以表谢
  - date: 约1067
    title_zh: 抗诏保绥州
    rationale: 绥州扼贼冲、横据山界，毁之则失延州形援，遂以便宜檄边固守，城卒得存，为延州东北形势之障
- id: guji-韩琦-endeavor-2
  name_zh: 定策两朝
  description_zh: 仁宗无嗣，群臣避而不言，琦乘间建言立宗室之贤；奉英宗、神宗相继践祚，请太后还政，成两朝顾命定策元勋之名。
  phases:
  - key: brewing
    name: 忧皇嗣之议
    labels:
      zh:
      - 乘间进言
      - 择宗室之贤
    start_date: 约1061
    highlight_event_id: guji-韩琦-event-liansi
  - key: breakthrough
    name: 立皇子之诏
    labels:
      zh:
      - 名分既定
      - 英宗入居庆宁宫
    start_date: 约1062
    highlight_event_id: guji-韩琦-event-lihuangzi
  - key: climax
    name: 奉英宗践祚
    labels:
      zh:
      - 仁宗山陵使
      - 太后还政
    start_date: 约1063-04
    highlight_event_id: guji-韩琦-event-yingzong-jihuo
  - key: closure
    name: 顾命立神宗
    labels:
      zh:
      - 英宗山陵使
      - 定策元勋之碑
    start_date: 约1067-01
    highlight_event_id: guji-韩琦-event-shenzong-jihuo
  decisions:
  - date: 约1061
    title_zh: 乘间建言早定皇嗣
    rationale: 皇嗣系天下安危，自古祸乱之起由策不早定；引汉成帝立定陶王事，谓帝之聪明睿智不宜久不决
  - date: 约1062
    title_zh: 以名分之说促立皇子
    rationale: 英宗始判宗正寺而辞让未受，琦曰名分未定故去就难，帝悟遂诏立皇子，琦复稽首曰事定矣
  - date: 约1064
    title_zh: 请垂帘太后还政
    rationale: 皇躬已康，请乘舆具素仗出祈雨，都人瞻仰天日之表识新天子，太后闻之喜，即下令还政
  - date: 约1067
    title_zh: 固请罢相出守
    rationale: 神宗既立，引故事愿罢相避权，虽虚上宰位待之，固请乃以节度使兼侍中判相州，又辞两镇之命
