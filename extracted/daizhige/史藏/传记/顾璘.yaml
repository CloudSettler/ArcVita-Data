  decisions:
  - date: '1536-11-01'
    title_zh: 辑李梦阳以下十三人各为传赞存其人不存其文之多寡
    rationale: 感子期惠施先逝邦国殄瘁不可使才宝湮没故略官业之大者而录名字爵里行业以表友道
  - date: '1536-12-01'
    title_zh: 纳门人议更亡友录为国宝新编
    rationale: 国家得才为宝朋友资才为泽欲彰人才为国宝之义不止私录故更名以广其传
