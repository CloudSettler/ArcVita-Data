  - 质胜文则野文胜质则史如何以文辅治而不堕浮靡
  - 交游凋谢邦国殄瘁独存者当以何道存亡友之风烈
  lesson: 文章与时高下而变通存乎其人文质彬彬乃君子之道当以醇厚济才华以道义重交游
  summary_first_person: 余华玉吴中人也少举弘治丙辰进士历仕中外至刑部尚书生当弘治文治极盛之时与李何徐唐诸君驰驱文苑晚居金陵林下睹亡友凋谢乃检遗文而为国宝新编冀以片言存才宝之用心使后之览者按文思才不忘邦国之瘁
