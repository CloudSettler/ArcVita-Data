    title_zh: 师古而不泥古博采汉魏以立体
    rationale: 初入仕即以文章经国为念不追六代卑靡而上规黄虞秦汉为弘治文变张本
  - date: '1520'
    title_zh: 以宽济严慎刑恤狱
    rationale: 历刑曹以明慎用刑不以苛刻立威欲使政理与教化并兴
