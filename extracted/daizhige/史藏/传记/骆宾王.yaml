  description: 调任临海丞，为官有文名，后以事获罪屡遭幽絷
- id: guji-骆宾王-event-lingyin
  title_zh: 游灵隐寺题诗
  date: '0679-08-01'
  year_of: 679
  kind: career
  place_zh: 杭州灵隐寺
  description: 作鹫岭郁岧嶤一诗，宋之问夜吟得首联迟明访之不见，寺僧云此骆宾王也，遂传为诗坛佳话
- id: guji-骆宾王-event-yinghuo
  title_zh: 作萤火赋抒愤
  date: '0680-07-15'
  year_of: 680
  kind: career
  place_zh: 幽絷中
  description: 以明时久遭幽絷见萤自明，作赋曰类君子之有道入暗室而不欺，感慨覆盆难照
- id: guji-骆宾王-event-xi
  title_zh: 为徐敬业作讨武后檄
  date: '0684-09-20'
  year_of: 684
  kind: career
  place_zh: 扬州
  description: 敬业举义于广陵，宾王为作檄曰伪临朝武氏者性非和顺地实寒微，传檄天下喑呜则山岳崩颓
- id: guji-骆宾王-event-death
  title_zh: 徐敬业败后亡命失踪
  date: '0684-12-01'
  year_of: 684
  kind: death
  place_zh: 扬州广陵后不知所终
  description: 传称广陵起义不捷遁逃，将帅求类二人者函首献，故敬业为衡山僧，宾王亦落发遍游名山，蜀本集序云不捷遁逃
