    start_date: '0684-07-01'
    highlight_event_id: guji-骆宾王-event-xi
  - key: climax
    name: 檄文传天下
    labels:
      zh: 高峰
    start_date: '0684-09-20'
    highlight_event_id: guji-骆宾王-event-xi
  - key: closure
    name: 兵败亡命
    labels:
      zh: 收束
    start_date: '0684-11-01'
    highlight_event_id: guji-骆宾王-event-death
  decisions:
  - date: '0684-09-20'
    title_zh: 为徐敬业作讨武后檄
    rationale: 斥武氏性非和顺地实寒微，历数弑君鸩母窥窃神器之罪，以大义号召天下勤王，欲以文檄代鼓角
  - date: '0684-11-01'
    title_zh: 随敬业败后遁迹为僧
    rationale: 广陵起义不捷，将帅虑罪求类二人者函首，遂与敬业俱亡命，或云落发遍游名山以全节而避祸
events:
