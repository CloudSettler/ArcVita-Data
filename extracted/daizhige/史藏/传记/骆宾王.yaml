- id: guji-骆宾王-endeavor-1
  title_zh: 初唐诗赋与文名开拓
  summary_zh: 以七岁能诗起家，尤工五言，灵隐诸作为初唐山水宫体向绮丽雄浑过渡之代表，萤火赋等抒幽愤寄托深远
