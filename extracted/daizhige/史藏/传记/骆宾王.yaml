  decisions:
  - date: '0670'
    title_zh: 上吏部裴侍郎书陈情养亲
    rationale: 不汲汲于荣名，以亲老丁忧为由力辞辟召，欲全孝道而求谅于执政，见其重名教轻仕进之志
  - date: 0678
    title_zh: 以诗寄托幽愤作萤火赋
    rationale: 久遭幽絷感时自广，借萤火自明不欺暗室之义，类君子有道，宣泄覆盆难照之愤
- id: guji-骆宾王-endeavor-2
  title_zh: 匡复义举与讨武檄文
  summary_zh: 感憤武后临朝称制，依徐敬业于扬州举义，作讨武曌檄传檄天下，以雄文鼓动三河，事败后亡命不知所终
  phases:
  - key: brewing
    name: 仕唐观变
    labels:
      zh: 酝酿
    start_date: 0679
