      raw: 约唐贞观十四年义乌
    death:
      date: 0684
      precision: year
      is_circa: true
      raw: 约武后光宅元年徐敬业败后亡命失踪
  birth_date: '0640'
  death_date: 0684
  era: 唐
  reign_ref: 唐高宗至武后
  archetype: 初唐四杰之诗文侠士
  dilemmas:
  - 久困卑位与诗名远扬之间的落差
  - 效忠李唐正统与武后临朝专权之间的去就
  - 以文章显节与以兵事殉义之间的抉择
  lesson: 文章可动天地然徒以笔锋匡复难挽时势当审进退以全节义
  summary_first_person: 余义乌人也，少以诗赋显，仕至临海丞，屡遭幽絷而气不少衰；尝游灵隐，诗惊老僧，后为徐敬业作檄讨武氏，言辞激烈天下震动，事败亡命，或云落发为僧，遍游名山而终
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/敬乡录.md
  - https://ctext.org/library.pl?if=gb&file=80226
