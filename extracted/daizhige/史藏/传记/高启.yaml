  dilemmas:
  - 才名显达与全身远祸之两难
  - 出仕效用与隐居保节之抉择
  lesson: 恃才矜名易以文贾祸，辞荣知止方能保节而传诗
  summary_first_person: 余长洲人也，少以诗为饶介所称，遂隐青丘以自全。洪武初以史事被征，辞户部侍郎而归，终以魏观案牵连而卒，唯遗诗文在耳。
