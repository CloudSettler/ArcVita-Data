  name_zh: 高士奇
  names:
    zh: 高士奇
    en: Gao Shiqi
  lifespan:
    birth:
      date: 1645
      precision: year
      is_circa: false
      raw: 顺治二年
    death:
      date: 1704
      precision: year
      is_circa: false
      raw: 康熙四十二年
  birth_date: 1645
  death_date: 1704
  era: 清
  reign_ref: 康熙
  archetype: 内廷词臣
  dilemmas:
  - 近侍帷幄与外廷清议之间的进退之难，得君宠渥则易招忌妒，疏远则失启沃之责
  - 扈从纪事详核与宫闱讳饰之间的笔墨之难，既欲备书乘舆巡幸与山川形胜以彰圣德，又须谨守禁中密勿不泄
  - 以布衣词臣驰驱关塞的劳瘁与珥笔赋咏的文责并重，疲顿中仍须考据山经地志残碑断碣以求证信
  lesson: 遭逢圣主、当以诚敬珥笔亲近不忘谨畏，纪事则以核实为重、铺陈典则，方能既光君美亦传信于简册
  summary_first_person: 余高士奇，字澹人，钱塘人。康熙十六年十二月与张英同入直内廷南书房，日侍銮舆，赐马给膳。二十一年春奉命扈从圣祖东巡，告成功于永陵福陵昭陵，历山海关、松花混同、白山黑水，目睹文皇帝松杏鏖兵故垒，夜随行殿秉烛珥笔，白日则马上赓和御诗，归来以日录上下二卷纪八旬万里之盛，陈廷敬、张玉书、汪懋麟、朱彝尊诸公为之序，窃幸以一书生得预豹尾之班，托翰墨以彰孝思武略耳。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/扈从东巡日录.md
  - https://daizhige.org/史藏/传记/扈从东巡日录.html
  - https://ctext.org/library.pl?if=gb&file=52470
endeavors:
- id: guji-高士奇-endeavor-1
  title_zh: 扈从东巡珥笔纪事
  summary: 康熙二十一年春以翰林侍讲供奉内廷扈从康熙东巡谒三陵、巡边塞、讲春蒐，往返八旬万余里，随行殿赓和御制，考山川阨塞与辽金故迹，归撰扈从东巡日录上下二卷以进
  phases:
  - key: brewing
    name: 内廷供奉待命扈跸
    labels:
      zh: 酝酿
    start_date: 1677-12-17
    highlight_event_id: guji-高士奇-event-nanshufang
  - key: breakthrough
    name: 奉命扈从自京师东发
    labels:
      zh: 突破
    start_date: 1682-03-24
    highlight_event_id: guji-高士奇-event-dongxun-chufa
  - key: climax
    name: 遍历盛京白山黑水赓和纪胜
    labels:
      zh: 高潮
    start_date: 1682-04-05
    highlight_event_id: guji-高士奇-event-liaoshen-jisheng
  - key: closure
    name: 归京撰录成编诸公序跋
    labels:
      zh: 收束
    start_date: 1682-05-25
    highlight_event_id: guji-高士奇-event-chengshu
  decisions:
  - date: 1682-03-24
    title_zh: 辞南书房安逸随豹尾驰驱关塞
    rationale: 君命扈从告成陵寝、省览关塞形胜，儒臣得以近览祖宗创业艰难与圣武远略，不辞鞍马劳瘁珥笔随行
  - date: 1682-04-10
    title_zh: 每驻跸即访故老考碑志证史地
    rationale: 辽左文献无征，山川同名多歧，必就见闻所逮参以前史山经地志，摩挲残碑断碣，方能辨物核事不至失真
  - date: 1682-05-25
    title_zh: 以日录体逐日成编兼载御制赓和
    rationale: 外廷不及见行宫帐殿顾问赓载与昼览章疏夜披翰札之勤，必一一珥笔详记，铺陈帝业艰难与民风勤苦，以彰君美备史家之采
- id: guji-高士奇-endeavor-2
  title_zh: 南书房密勿与词垣史职
  summary: 以布衣以词赋受知，入翰林为侍讲，供奉南书房凡五载，朝夕上前陈说诗书、淋漓笔札，兼参明史纂修与词章应制，在宠渥与清议之间以恭慎自持
  phases:
  - key: brewing
    name: 布衣入翰林
    labels:
      zh: 酝酿
    start_date: 1677-12-17
    highlight_event_id: guji-高士奇-event-nanshufang
  - key: breakthrough
    name: 密勿深严得预帷幄
    labels:
      zh: 突破
    start_date: 1678-01-01
    highlight_event_id: guji-高士奇-event-neiting-miwu
  - key: climax
    name: 扈从与制诰并隆恩遇之极
    labels:
      zh: 高潮
    start_date: 1682-03-24
    highlight_event_id: guji-高士奇-event-dongxun-chufa
  - key: closure
    name: 晚年罢归著述传后
    labels:
      zh: 收束
    start_date: 1690-01-01
    highlight_event_id: guji-高士奇-event-bagui-zhushu
  decisions:
  - date: 1677-12-17
    title_zh: 受直南书房以词翰备顾问
    rationale: 圣主亲近儒臣引之密勿，非以章句为饰，欲资腹心启沃谟猷，当以经义史事陈说几筵，不言宫中草木而重筹边治体
  - date: 1682-04-06
    title_zh: 关门清晏之际论险不足恃
    rationale: 山海关为畿辅雄关，前代恃关为门户而党锢兵虚终不守，今内外一家，当以修德为本，面奏以鉴前失
  - date: 1698-01-01
    title_zh: 引退后以著述存文献
    rationale: 宠荣易招议，盛满当知止，退而辑录见闻、校理藏书，以文字证盛世而全晚节
events:
- id: guji-高士奇-event-birth
  title_zh: 生于钱塘
  date: 1645
  year_of: 1645
  description: 高士奇生于浙江钱塘，清顺治二年生，字澹人，号江村
  location: 浙江钱塘
- id: guji-高士奇-event-nanshufang
  title_zh: 与张英同入直大内南书房
  date: 1677-12-17
  year_of: 1677
  description: 康熙十六年十二月十七日与张英同时入直大内南书房，自此接步随肩供奉内廷五年，晨夕无间
  location: 北京紫禁城南书房
- id: guji-高士奇-event-neiting-miwu
  title_zh: 供奉内廷侍讲密勿
  date: 1678-03-01
  year_of: 1678
  description: 以翰林侍讲供奉内廷，朝夕上前不离马首，遇山川扼塞立马论议，陈说诗书，笔札淋漓上袍袖
  location: 北京
- id: guji-高士奇-event-dongxun-chufa
  title_zh: 扈从东巡自京师发銮
  date: 1682-03-24
  year_of: 1682
  description: 康熙二十一年二月十五日癸巳扈从康熙率皇太子辞两宫由东直门出，自京师经通州孤山、三河、蓟州、玉田、丰润、滦河、山海关东巡谒三陵
  location: 北京东直门外至山海关
- id: guji-高士奇-event-liaoshen-jisheng
  title_zh: 历松山杏山吕翁山和御制纪战迹
  date: 1682-04-10
  year_of: 1682
  description: 随驾过宁远、锦县杏山，目睹太宗文皇帝崇德六年破洪承畴十三万众于吕翁山沟壕壁垒，恭和御制过吕翁山诗，考证三路克敌遗迹
  location: 辽西松山杏山吕翁山
- id: guji-高士奇-event-chengshu
  title_zh: 撰成扈从东巡日录并自序
  date: 1682-05-25
  year_of: 1682
  description: 扈从归后以见闻所逮约略志之，总时物参前史，逐日成编上下二卷，康熙二十一年壬戌五月望日自序题曰扈从东巡日录，陈廷敬张玉书等为之序
  location: 北京
- id: guji-高士奇-event-bagui-zhushu
  title_zh: 罢归后辑书传后
  date: 1698-06-01
  year_of: 1698
  description: 以谤议罢官归里，筑江村别业，藏书校刊，著述甚富，日录与金鳌退食笔记等并行于世
  location: 浙江钱塘江村
- id: guji-高士奇-event-death
  title_zh: 卒于里第
  date: 1704
  year_of: 1704
  description: 康熙四十二年卒，年六十，谥文恪，后追论南书房旧劳
  location: 浙江钱塘
