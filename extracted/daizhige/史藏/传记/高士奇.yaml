  - key: breakthrough
    name: 出关纪胜
    labels:
      zh: 出喜峰口
    start_date: 1681-05-06
    highlight_event_id: guji-高士奇-event-xifengkou
  - key: climax
    name: 历览塞山
    labels:
      zh: 考宽城黄土崖
    start_date: 1681-05-07
    highlight_event_id: guji-高士奇-event-xifengkou
  - key: closure
    name: 成书流传
    labels:
      zh: 撰松亭行纪
    start_date: 1681-05-20
    highlight_event_id: guji-高士奇-event-wenquan
  decisions:
  - date: 1681-03-29
    title_zh: 详辨滦河与濡水及温泉源流
    rationale: 见诸说纷纭，引水经注及一统志实地参验，不袭唐庚臆说，务求山川脉络有据
  - date: 1681-05-06
    title_zh: 出塞即事直笔记载虎啸边备
    rationale: 既入塞上，即以目所亲历记长城险要、风物殊异，虽虎啸岩谷不避，以存边徼实录备后来考证
events:
- id: guji-高士奇-event-birth
  title_zh: 诞生于钱塘
  date: 1645
  year_of: 1645
  precision: year
  is_circa: false
  raw: 顺治二年
  location_zh: 浙江钱塘
  description_zh: 高士奇生于浙江钱塘，后以康熙十年进士入仕
- id: guji-高士奇-event-panshan
  title_zh: 奉旨游盘山并作记赋诗
  date: 1681-03-22
  year_of: 1681
  precision: day
  is_circa: false
  raw: 康熙二十年三月乙亥
  location_zh: 蓟州盘山
  description_zh: 扈从至三河，上念其耽林壑命同侍卫往游盘山，穷历李靖庵、云罩寺、上盘舍利塔、古中盘正法禅院，夜二鼓始归，后作赐游盘山记及诗十首
- id: guji-高士奇-event-luanhe
  title_zh: 扈从驻跸滦河侍宴赐杯
  date: 1681-03-27
  year_of: 1681
  precision: day
  is_circa: false
  raw: 康熙二十年三月己卯
  location_zh: 迁安滦河岸
  description_zh: 驻跸滦河，上率侍卫操舟捕鱼以奉太皇太后，晚张宴岸侧，赐紫金杯酒，论滦河形胜及源流，士奇恭赋侍宴诗纪恩
- id: guji-高士奇-event-wenquan
  title_zh: 随谒孝陵观遵化温泉
  date: 1681-03-29
  year_of: 1681
  precision: day
  is_circa: false
  raw: 康熙二十年三月辛巳
  location_zh: 遵化福泉山温泉
  description_zh: 奉太皇太后至温泉宫，随上谒孝陵及二后陵，赐观汤泉，考其沸源与寒泉并出，辨石硫黄诸说，同扈从诸臣应制赋诗
- id: guji-高士奇-event-xifengkou
  title_zh: 扈从出喜峰口宿白台
  date: 1681-05-06
  year_of: 1681
  precision: day
  is_circa: false
  raw: 康熙二十年四月庚寅
  location_zh: 喜峰口外白台
  description_zh: 驾出喜峰口，士奇扈从以松亭关即喜峰口考其沿革，过九狐岭、黄土崖、宽城遗址，夜宿白台闻虎啸，赋诗纪塞外山川险要
- id: guji-高士奇-event-death
  title_zh: 逝世
  date: 1703
  year_of: 1703
  precision: year
  is_circa: false
  raw: 康熙四十二年
  location_zh: 平湖
  description_zh: 晚年以詹事府詹事致仕归里，卒于康熙四十二年，著有松亭行纪、塞北小钞等
