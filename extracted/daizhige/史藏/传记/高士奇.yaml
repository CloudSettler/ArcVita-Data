  archetype: 近侍词臣
  dilemmas:
  - 淡泊林壑之本志与禁近侍从之宦责如何两全
  - 扈从纪行当据实载山川形胜与避忌粉饰之间如何秉笔
  lesson: 以恭恪承君恩以朴实纪行役，得宠不居，淡泊自守，方能以翰墨小技长期自全
  summary_first_person: 余钱塘高士奇，号江村，少耽泉石，幸以翰墨待诏禁近。康熙二十年春，蒙恩扈从圣祖奉太皇太后幸温泉、巡塞外，历蓟州盘山、景忠山、滦河、遵化汤泉，又出喜峰口至塞外宽城、黄土崖诸处。沿途奉命载笔，或赐游、或侍宴、或进诗记，皆亲见亲历。余不敢以虚美溢辞，惟据实纪山川关隘、风俗形胜，既以颂圣孝圣德，亦以存舆地考证，不负豹尾载笔之职
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/松亭行纪.md
  - https://daizhige.org/史藏/传记/松亭行纪.html
