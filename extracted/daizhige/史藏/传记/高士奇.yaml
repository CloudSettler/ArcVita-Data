  decisions:
  - date: 1681-03-22
    title_zh: 奉旨独游盘山穷览幽邃
    rationale: 既承上命谓盘山林泉尤胜，即当穷一日之力尽历上盘中盘净业诸胜，不敢以道远艰险辞，以副垂问
  - date: 1681-04-03
    title_zh: 录盘山记及十诗进呈
    rationale: 上尝垂问游况并命至温泉录出，遂删芜存实，进呈御览，以明淡泊之志而答君恩
- id: guji-高士奇-endeavor-2
  title_zh: 塞外山川纪述与松亭行纪之业
  summary_zh: 随銮舆出喜峰口，考松亭关、滦河源流、温泉脉理及塞外遗址，撰松亭行纪二卷以资考证
  phases:
  - key: brewing
