  - key: climax
    name: 贵德轻货
    labels:
      zh: 高峰期
    start_date: '0633-05-01'
    highlight_event_id: guji-魏徵-event-zhuyu
  - key: closure
    name: 遗言以仁义为本
    labels:
      zh: 收束期
    start_date: '0643-01-01'
    highlight_event_id: guji-魏徵-event-death
  decisions:
  - date: '0628-04-01'
    title_zh: 谏止复用贪吏厖相寿
    rationale: 以私情赦贪还任则为善者惧，不可偏徇一府恩泽而坏四海之法
  - date: '0632-07-01'
    title_zh: 谏罢虢州采银
    rationale: 珠玉珍奇积则仁义损，劳卫士与民争利无德可示，不如投璧于山
  - date: '0633-05-10'
    title_zh: 谏止西域市马
    rationale: 借立可汗为名市马则蕃人不怀恩反生怨，马不求自至何必以利劳中国
events:
- id: guji-魏徵-event-birth
  title_zh: 生于钜鹿下曲阳
  date: 0580
  year_of: 0580
  kind: birth
  summary: 隋开皇二十年生于钜鹿下曲阳，少孤贫力学善属文，隋末先后从李密窦建德后入太子建成幕府
  location: 钜鹿下曲阳
- id: guji-魏徵-event-jian-zuyou
  title_zh: 谏诏免租赋又令输纳无信
  date: '0627-08-15'
  year_of: '0627'
  kind: advice
  summary: 太宗初即位诏免关中二年租赋关东一年复敕令已役已纳者明年准折，魏徵谏以诚信为治本不可二言失四时大信
  location: 长安
- id: guji-魏徵-event-pangxiangshou
  title_zh: 谏止徇私复用贪吏厖相寿
  date: '0628-04-01'
  year_of: 0628
  kind: advice
  summary: 濮州刺史厖相寿以贪浊解任自陈幕府旧恩太宗欲赐绢复任，魏徵谏以赦贪厚赏还任则为善者惧，太宗乃止
  location: 长安
- id: guji-魏徵-event-fengang
  title_zh: 谏罢发兵讨击冯盎
  date: '0630-02-01'
  year_of: '0630'
  kind: advice
  summary: 岭南诸州告冯盎反太宗欲发江岭数十州兵讨之，魏徵言反形未成山川瘴疠兵运难继，只宜遣使晓谕怀德而来自至，太宗从之盎遣子入朝岭表遂定
  location: 长安
- id: guji-魏徵-event-changle
  title_zh: 谏止优加长乐公主礼数逾制
  date: '0631-06-10'
  year_of: '0631'
  kind: advice
  summary: 长乐公主皇后所生将出降太宗欲倍永嘉公主礼，魏徵引汉明帝半楚淮阳故事言长公主礼不可逾，太宗纳谏文德皇后嘉赏绢四百匹
  location: 长安
- id: guji-魏徵-event-caiyin
  title_zh: 谏罢虢州采银
  date: '0632-07-01'
  year_of: '0632'
  kind: advice
  summary: 虢州统军奏山有银矿请遣卫士百姓采之，魏徵以尧舜投璧珠于山谷为喻言珍奇积则仁义损与下争利无德可示，太宗即令停废
  location: 虢州
- id: guji-魏徵-event-zhuyu
  title_zh: 谏国家爱珠如胡贾惑物
  date: '0633-05-10'
  year_of: '0633'
  kind: advice
  summary: 使者言奚契丹最爱肉珠太宗哂之，魏徵讽国家亦重珠玉如西域贾劈肌藏宝，太宗悟言我今重此与彼何异安可不思
  location: 长安
- id: guji-魏徵-event-death
  title_zh: 病逝长安谥文贞
  date: '0643-02-11'
  year_of: '0643'
  kind: death
  summary: 贞观十七年正月十七日病逝于长安年六十四，太宗痛惜罢朝五日谥曰文贞陪葬昭陵
  location: 长安
