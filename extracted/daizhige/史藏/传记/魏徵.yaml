  reign_ref: 贞观
  archetype: 直谏诤臣
  dilemmas:
  - 直言极谏易忤君心与阿谀取容失臣节之择
  - 以仁义诚信治国与以财利威刑聚敛之辨
  - 守法均平与徇私施恩之冲突
  lesson: 兼听则明偏信则暗，君以诚信示天下，臣以直谏匡君失，仁义为本节用爱民
  summary_first_person: 余魏徵钜鹿下曲阳人也，隋末辗转从李密窦建德后入太子建成幕，贞观初蒙太宗不计旧嫌擢为谏议大夫秘书监侍中参预朝政，遂以犯颜直谏为己任。凡诏免租赋而复追纳、中男滥点、赦贪复任、劳师岭南、逾礼厚赐、采银市马重珠诸事，皆据义力争，冀君存诚信崇仁义守法度薄赋敛，成贞观之治。虽数忤龙鳞终蒙纳用，愿后世以兼听纳谏为明，以诚信仁义为治本。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%AD%8F%E9%83%91%E5%85%AC%E8%B0%8F%E5%BD%95.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E9%AD%8F%E9%83%91%E5%85%AC%E8%B0%8F%E5%BD%95.html
  - https://zh.wikisource.org/wiki/%E9%AD%8F%E9%84%AD%E5%85%AC%E8%AB%AB%E9%8C%84
