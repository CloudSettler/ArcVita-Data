  decisions:
  - date: '0627-08-15'
    title_zh: 谏止失信追征租赋
    rationale: 关中已诏免租而复令折纳，有损诚信，虽小益财利大损德义，力谏以存国信
  - date: '0627-09-01'
    title_zh: 固执不署简点中男之敕
    rationale: 竭泽而渔明年无鱼，滥点中男则租徭无所出，精兵以礼遇则勇不在多取
  - date: '0630-02-01'
    title_zh: 谏罢发兵讨冯盎
    rationale: 反形未成瘴疠阻深劳师远讨恐生疾疫，只需遣使晓谕怀之以德可不战而定
- id: guji-魏徵-endeavor-2
  title_zh: 守法均平与节用厚本
  summary: 谏止徇私复用贪吏滥采银矿厚爱珠玉重敛市马逾礼封赏等事，主张守法均平节用爱民贵本抑末
  roles:
