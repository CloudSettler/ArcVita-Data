  date: '0626-08-01'
  year_of: '0626'
  description: 初事李建成建成败太宗不计前嫌擢为谏议大夫直言不讳
- id: guji-魏徵-event-627-debate
  title_zh: 贞观初廷辩政化得失驳封德彝
  date: '0627'
  year_of: '0627'
  description: 太宗论大乱之后造次不可致化魏徵对以危困思化易教圣哲施化不疾而速力驳封德彝人渐浇讹之说太宗深纳
- id: guji-魏徵-event-632-prison
  title_zh: 论隋日禁囚滥杀以劝宽厚
  date: '0632'
  year_of: '0632'
  description: 陈隋士澄捕盗疑即拷掠枉承二千人同日斩决张元济覆验多冤犹并杀劝太宗宽厚慎刑致囹圄空虚
- id: guji-魏徵-event-633-jian
