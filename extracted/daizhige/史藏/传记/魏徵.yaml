  summary_first_person: 余以寒儒逢隋乱尝事隐太子既归太宗蒙不世之遇展尽底蕴前后二百余奏无所隐皆剀切当帝心每论大乱之后易化劝行帝王之道驳封德彝浇讹之说以仁义道徳切磋君上幸致贞观华夏安宁远夷宾服惟愿君臣同心终始不怠
