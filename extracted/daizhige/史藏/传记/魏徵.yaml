  date: '0633'
  year_of: '0633'
  description: 太宗论通西域魏徵举汉武置敦煌张掖隋炀开岭西白骨狼籍劝以二主为殷鉴与群臣共理百姓
- id: guji-魏徵-event-death
  title_zh: 逝世
  date: '0643-02-11'
  year_of: '0643'
  description: 卒于长安太宗痛惜罢朝五日赠司空谥文贞后谏录五卷由王綝集续录由翟思忠补摭
