    title_zh: 逐文伯于食鳖慢客之后
    rationale: 先子有言祭养尸、飨养上宾，慢宾失礼虽微必惩，君子谓之慎微。
events:
- id: guji-鲁季敬姜-event-birth
  event_type: birth
  date: -384
  year_of: -384
  date_precision: approximate
  summary_zh: 鲁季敬姜生于春秋时期（生年不详，约公元前六世纪）
- id: guji-鲁季敬姜-event-lesson
  event_type: endeavor
  date: -376
  year_of: -376
  date_precision: approximate
  summary_zh: 文伯自诩成人，敬姜举武王结袜、桓公举过、周公吐哺之事数之，文伯谢罪，遂择严师贤友而事之，君子谓敬姜备于教化。
- id: guji-鲁季敬姜-event-loom
  event_type: endeavor
  date: -368
  year_of: -368
  date_precision: approximate
  summary_zh: 文伯见母犹绩而惧干季孙之怒，敬姜叹鲁其亡乎，陈圣王处民于瘠土、民劳则思之义，并喻机杼诸部件为将相百官之职，文伯再拜受教，仲尼闻之曰季氏之妇不淫矣。
- id: guji-鲁季敬姜-event-exile
  event_type: endeavor
  date: -365
  year_of: -365
  date_precision: approximate
  summary_zh: 文伯宴南宫敬叔以露堵父为客，羞鳖太小致客怒而出，敬姜怒其慢宾，遂逐文伯；五日后鲁大夫为之辞请而复之，君子谓敬姜慎微。
- id: guji-鲁季敬姜-event-mourning
  event_type: endeavor
  date: -320
  year_of: -320
  date_precision: approximate
  summary_zh: 文伯卒，敬姜戒妾毋哀毁失度，毋瘠色、毋挥涕、毋陷膺，从礼而静以昭子之令德；处丧朝哭穆伯、暮哭文伯，仲尼谓其知礼、爱而无私。
- id: guji-鲁季敬姜-event-conduct
  event_type: endeavor
  date: -0495
  year_of: -0495
  date_precision: approximate
  summary_zh: 敬姜如季氏，康子与之言不应，及寝门而入，谕以内外朝职分、妇人治内之义；祭悼子时酢不受、彻俎不燕，仲尼谓敬姜别于男女之礼。
- id: guji-鲁季敬姜-event-death
  event_type: death
  date: -320
  year_of: -320
  date_precision: approximate
  summary_zh: 鲁季敬姜卒（卒年不详，约在文伯卒后）
