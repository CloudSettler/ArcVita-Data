  era: 春秋
  reign_ref: 鲁国
  archetype: 慈母贤妇
  dilemmas:
  - 居寡守绩而不废先人之业，还是自安享逸
  - 逐子以警其慢宾失礼，还是姑息护短
  - 处丧哭夫与哭子有章，如何爱而无私、上下有节
  lesson: 劳则生善，逸则生恶；匡子过失，教以法理，德行方能光明。
  summary_first_person: 我乃莒国之女，号戴巳，公父穆伯之妻、文伯之母。我博达知礼，守教养子，以织绩喻治国之要，以劳逸之训戒子勿怠。子慢宾我逐之，子亡我戒妾毋哀以昭其德，处丧、男女之礼皆分明有章，仲尼闻而贤之，列我为慈母。
  source_urls:
  - https://zh.wikisource.org/wiki/古列女傳/卷一
