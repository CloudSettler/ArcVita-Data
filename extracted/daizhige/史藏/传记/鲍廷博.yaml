  summary_first_person: 余歙人而家于浙，少以父嗜书而遍购善本，积为巨藏。四库开馆献书六百余种蒙赐图书集成等以旌之，唐阙史复蒙御题。遂刊知不足斋丛书公诸海内，使承学有所观摩，虽至八十有六犹以未竣为念，遗命子士恭续成之。
