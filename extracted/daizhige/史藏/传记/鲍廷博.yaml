    rationale: 铭记御题之荣，使善本藉雕版广传，承学得所观摩
  - date: '1814'
    title_zh: 临终遗命子士恭继志续刊
    rationale: 丛书未竣不可中辍，以家族之力续完三十二集令孤编不绝
events:
- id: guji-鲍廷博-event-birth
  title_zh: 生于歙籍家于浙
  date: '1728'
  year_of: '1728'
  summary: 鲍廷博生于安徽歙县，字以文号渌饮，后家于浙江
- id: guji-鲍廷博-event-collecting
  title_zh: 为养亲志遍购善本成大藏书家
  date: '1750'
  year_of: '1750'
  summary: 以父嗜读书历购前人旧籍，所得益多且精，裒然为大藏书家，补县学生
- id: guji-鲍廷博-event-present
  title_zh: 乾隆三十八年进呈家藏六百余种于四库馆
  date: '1773'
  year_of: '1773'
  summary: 诏开四库馆采访天下遗书，命子士恭由浙进呈六百余种，既著录复诏还原书
- id: guji-鲍廷博-event-honor
  title_zh: 获赐图书集成等及御题唐阙史
  date: '1774'
  year_of: '1774'
  summary: 赐古今图书集成伊犁得胜图金川图，其中唐阙史及武经总要并御制诗题之
- id: guji-鲍廷博-event-start-congshu
  title_zh: 刊刻知不足斋丛书以唐阙史冠首
  date: '1776'
  year_of: '1776'
  summary: 自谓诸生无可报称惟有多刊善本公诸海内，刊丛书即以唐阙史冠首以志荣遇
- id: guji-鲍廷博-event-juren
  title_zh: 嘉庆十八年进第二十六集赏给举人
  date: '1813'
  year_of: '1813'
  summary: 方受畴抚浙以续刊第二十六集进，奉旨赏给举人，时年逾八十
- id: guji-鲍廷博-event-death
  title_zh: 卒于家丛书至二十七集未竣遗命续刊
  date: '1814'
  year_of: '1814'
  summary: 年八十六卒，尚遗命子士恭继志续刊，今存共三十二集，秘册孤编率赖以传
