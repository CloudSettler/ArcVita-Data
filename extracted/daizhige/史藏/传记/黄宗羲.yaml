  death_date: 1695-08-12
  era: 明末清初
  reign_ref: 明万历至清康熙
  archetype: 遗民史家
  dilemmas:
  - 明亡之后仕清与拒仕守节之义利之辨
  - 朱陆异同与王学流弊当主一途还是会通万殊之辨
  lesson: 盈天地皆心，万殊即一心之万殊，必以慎独修德为本，虚心体察，不执门户成局，方能穷理归一
  summary_first_person: 余幼遭家难，师事蕺山刘子，得闻慎独宗旨。甲申而后不仕清廷，屏居南雷，穷源竟委，分明儒为诸学案，别其源流，备载语录，欲使后学随质所近浸灌滋溉，万派同归于海，不以黄茅白苇蔽道。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/明儒学案.md
  - https://daizhige.org/史藏/传记/明儒学案.html
  - https://ctext.org/wiki.pl?if=gb&res=870769
