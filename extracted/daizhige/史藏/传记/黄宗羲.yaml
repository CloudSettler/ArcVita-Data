    highlight_event_id: guji-黄宗羲-event-1690-history
  decisions:
  - date: 1645-07-01
    title_zh: 明亡不仕清
    rationale: 父仇国难在身，持忠孝大节，隐居著述以存文化命脉，不以功利借学自树门户
  - date: 1667-03-01
    title_zh: 设馆授徒明慎独
    rationale: 心无本体功力所至即本体，必以慎独修德而后可讲学，纠王学末流空谈之弊
