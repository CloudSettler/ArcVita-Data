  birth_date: '1610-09-24'
  death_date: '1695-08-18'
  era: 明末清初
  reign_ref: 崇祯至康熙
  archetype: 遗民儒宗
  dilemmas:
  - 气节激烈与深造自得之间何以取舍
  - 出仕新朝显名与守节著述存史之间何以自处
  - 心性空谈与六经实学之间何以正学脉
  lesson: 读书必以六经为根以史事证理之变化，以心体之方不为俗学亦不堕空谈
  summary_first_person: 余太冲，姚江黄氏，忠端长子。十九岁袖锥诣阙为父复仇，锥许显纯拔崔应元须，手刃二卒以祭先君。既归，发藏书而尽读之，钞钮氏世学楼、祁氏澹生堂、黄氏千顷斋、钱氏绛云楼之书，建续钞堂承东发之绪。师蕺山刘子，辟陶奭龄援儒入释之弊，与弟宗炎宗会称东浙三黄。国变后纠世忠营画江守浙，颁鲁监国大统历，西渡潭山，入四明结寨，从亡海上授左副都御史，乞师日本不遂。度事不可为，乃奉母归里，拒博学鸿儒之征，毕力著述，明儒学案六十二卷以综三百年儒林，易象数论以辨河洛之非，明夷待访留书以存三代之治。虽不赴征车，而历志、史议必咨于余，此生惟欲以著述存故国、以穷经开后学耳。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/清先正事略选.md
  - https://daizhige.org/史藏/传记/清先正事略选.html
  - https://ctext.org/library.pl?if=gb&file=376743
