  decisions:
  - date: '1666-01-01'
    title_zh: 定学案体例以代列传
    rationale: 欲使一师一派本末具见，学者易考源流得失，免门户之争
  - date: '1676-01-01'
    title_zh: 以安定泰山冠卷首
    rationale: 推原宋学之盛始于庆历师儒，安定沈潜泰山高明，皆为先河，不可不首述
- id: guji-黄宗羲-endeavor-2
  title_zh: 著述明夷待访录倡天下为主
  title_en: Writing Mingyi Daifang Lu to Advocate People as Master
  description: 因明亡而深究君臣治乱之故，作《明夷待访录》立君客民主、学校、取士、财计诸论，开清初经世致用与启蒙先声
  phases:
