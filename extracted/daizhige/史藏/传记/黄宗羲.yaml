  birth_date: '1610-09-24'
  death_date: '1695-08-12'
  era: 明末清初
  reign_ref: 明万历至清康熙
  archetype: 经世学者
  dilemmas:
  - 明亡后出仕新朝与坚守遗民气节之抉择
  - 尊朱子道统与辨朱子得失之衡平
  - 考据实学与义理空谈之间何者为治学正途
  lesson: 以学案体别源流、定得失，使道统可考；为学当兼考据与义理，且以经世致用为归
  summary_first_person: 吾余姚黄宗羲，字太冲，号梨洲，少师刘宗周，亲历甲申鼎革，遂不仕清，以著述自任。尝仿朱子渊源录而作《明儒学案》，又草创《宋元学案》，立安定、泰山为先河，次及濂溪、明道、伊川、横渠，以存宋元学脉。又作《明夷待访录》，论君为客、天下为主、学校、财计，欲以实学救末世。学案虽未竟，幸全祖望踵成之，斯道或可不坠。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/宋元学案.md
  - https://daizhige.org/史藏/传记/宋元学案.html
  - https://ctext.org/wiki.pl?if=gb&res=370460
