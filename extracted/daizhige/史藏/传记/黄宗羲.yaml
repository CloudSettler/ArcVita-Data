    title_zh: 对簿锥击许显纯崔应元
    rationale: 父死阉狱，不手刃仇雠无以祭忠魂，虽陷死地亦必彰直臣之冤
  - date: '1632-01-01'
    title_zh: 奉遗命师事刘宗周辟姚江之弊
    rationale: 越中援儒入释坏姚江正脉，若不约同志摧其说则蕺山心性之传将坠
- id: guji-黄宗羲-endeavor-2
  title_zh: 浙东抗清与遗民著述
  summary_zh: 甲申南渡画江而守，号世忠营颁大统历，四明结寨海上从亡，乞师日本；海上既倾，拒清廷鸿博之征，以著述存明史续儒统
