  - date: '1645-07-01'
    title_zh: 以布衣纠乡兵号世忠营从鲁监国
    rationale: 家国同难，忠臣子弟不当独存，虽数百人亦欲效画江之守
  - date: '1678-01-01'
    title_zh: 固辞博学鸿儒与明史聘
    rationale: 身为故国列卿，岂可因征车而为叠山九灵之杀身，惟以抄述送京师存三百年史事
events:
- id: guji-黄宗羲-event-birth
  title_zh: 生于余姚
  date: '1610-09-24'
  year_of: 1610
  location_zh: 浙江余姚
  description_zh: 明御史黄尊素长子，字太冲号梨洲，生于万历三十八年
- id: guji-黄宗羲-event-1628-cone
  title_zh: 袖锥廷鞫复父仇
  date: '1628-09-01'
  year_of: 1628
  location_zh: 北京都察院狱
  description_zh: 庄烈帝即位年十九袖长锥讼狱，廷鞫许显纯崔应元锥击流血拔须，又锥杀牢卒叶咨颜仲文以祭忠端，曹钦程贿三千金求勿质发其事，狱门设祭哭声达禁中，帝叹忠义孤儿
- id: guji-黄宗羲-event-1630-study
  title_zh: 建续钞堂遍钞四大藏书师蕺山
  date: '1630-01-01'
  year_of: 1630
  location_zh: 余姚南雷 蕺山
  description_zh: 尽发家藏不足则钞同里钮氏世学楼祁氏澹生堂及黄氏千顷斋钱氏绛云楼，建续钞堂承黄震东发之绪，奉父遗命师事刘宗周，与弟宗炎宗会并称东浙三黄
- id: guji-黄宗羲-event-1635-piyi
  title_zh: 力辟陶奭龄援儒入释
  date: '1635-01-01'
  year_of: 1635
  location_zh: 越中
  description_zh: 越中承周汝登绪余援儒入释，石梁陶奭龄为魁，约吴越高材生力摧其说，佐蕺山维系正学，与祁彪佳章正宸为四友御侮
- id: guji-黄宗羲-event-1640-xiangshu
  title_zh: 以律历象数证开物成务
  date: '1640-01-01'
  year_of: 1640
  location_zh: 余姚
  description_zh: 谓漳浦黄道周兼象数如邵雍之于程子，乃出律历诸书相质证，自教二弟象纬律吕之学
- id: guji-黄宗羲-event-1645-shizhong
  title_zh: 浙东起世忠营
  date: '1645-06-15'
  year_of: 1645
  location_zh: 浙东余姚 会稽
  description_zh: 大兵下南都得免逮，与孙嘉绩熊汝霖画江守，纠里中子弟数百人号世忠营，以布衣授职方郎改御史，作监国鲁元年大统历颁浙东
- id: guji-黄宗羲-event-1646-dutong
  title_zh: 谋决江决战与西渡潭山
  date: '1646-03-01'
  year_of: 1646
  location_zh: 钱塘江 潭山
  description_zh: 遗书王之仁请沈舟决战直趋浙西，定查继佐军乱掣以西，与陈潜夫由海道入太湖约孙奭内应，江上溃后入四明山结寨驻杖锡寺，山民焚寨部将茅瀚江涵死
- id: guji-黄宗羲-event-1651-japan
  title_zh: 海上从亡与日本乞师
  date: '1651-06-01'
  year_of: 1651
  location_zh: 健跳 翁洲 长崎
  description_zh: 己丑赴监国授左副都御史，健跳被围置靴刀待命，与冯京第副使赴日本长崎乞师不得请，归而东迁西徒浙中大索通海者
- id: guji-黄宗羲-event-1679-jubo
  title_zh: 辞博学鸿儒荐抄述送史局
  date: '1679-01-01'
  year_of: 1679
  location_zh: 余姚 海宁
  description_zh: 康熙戊午叶方霭拟荐陈锡嘏止之，徐元文以礼敦遣修明史固辞，诏抄著述送京师，遣子百家及门人万斯同万言任纂修，戏谓如首阳二老托孤尚父
- id: guji-黄宗羲-event-death
  title_zh: 卒于故里营生圹
  date: '1695-08-18'
  year_of: 1695
  location_zh: 余姚
  description_zh: 康熙乙亥秋年八十六卒，预营生圹于忠端墓旁置石床无椁作葬制或问，遗命无违，所著明儒学案易象数论授书随笔明夷待访录等凡四十卷，南雷文定行世
