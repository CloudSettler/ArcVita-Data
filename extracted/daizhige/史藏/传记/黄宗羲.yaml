  - date: 1676-03-01
    title_zh: 不主一说并录异同
    rationale: 道体无尽，学术不同正见其大，若必出于一途则美灵根化为焦芽，故分源别派兼收而虚心体察
  - date: 1680-06-01
    title_zh: 以语录为案眼
    rationale: 叙传纪行，语录列言，使学者得见其竭心万殊之功力，不以懵懂精神冒人糟粕
- id: guji-黄宗羲-endeavor-2
