  decisions:
  - date: '1661-01-01'
    title_zh: 拒清征辟专事著述
    rationale: 以遗民自守，不以仕隐易节，冀以立言存夏统于文字
  - date: '1663-01-01'
    title_zh: 立天下为主君为客之论
    rationale: 欲破家天下之私，以学校公议、工商皆本矫王学末流与专制之弊
events:
- id: guji-黄宗羲-event-birth
  title_zh: 生于余姚黄竹浦
  date: '1610-09-24'
  year_of: '1610'
  description: 生于浙江余姚黄竹浦，为御史黄尊素子，少负气节，从刘宗周学性命之学
  location: 浙江余姚
- id: guji-黄宗羲-event-kangqing
  title_zh: 组织世忠营抗清
  date: '1645-06-15'
  year_of: '1645'
  description: 弘光败后，与弟宗炎等募兵浙东，奉鲁王抗清，屡败屡起，终知事不可为而归隐
  location: 浙江余姚
- id: guji-黄宗羲-event-mingruxuean
  title_zh: 《明儒学案》成书
  date: '1666-12-01'
  year_of: '1666'
  description: 历十余年搜采，仿渊源录体成《明儒学案》六十二卷，立学案体史学范式
  location: 浙江余姚
- id: guji-黄宗羲-event-songyuanxuean-start
  title_zh: 草创《宋元学案》并作序录
  date: '1676-01-01'
  year_of: '1676'
  description: 承明儒学案之后，着手整理宋元诸儒，定安定、泰山、高平等二十余案纲目，作序录以辨源流
  location: 浙江余姚
- id: guji-黄宗羲-event-mingyidaifanglu
  title_zh: 《明夷待访录》定稿
  date: '1663-01-01'
  year_of: '1663'
  description: 成《明夷待访录》二十一篇，提出原君原臣学校原法诸篇，为经世大论
  location: 浙江余姚
- id: guji-黄宗羲-event-jiangxue
  title_zh: 主讲蕺山书院与南雷书院
  date: '1670-01-01'
  year_of: '1670'
  description: 隐居讲学，授万斯大、万斯同、邵晋涵等，讲经史实学，开浙东学派
  location: 浙江绍兴
- id: guji-黄宗羲-event-quan-revise
  title_zh: 嘱后学补成学案
  date: '1687-01-01'
  year_of: '1687'
  description: 年逾七旬，宋元学案仅成十余案原本，自知未竟，属望后学全祖望踵成补定
  location: 浙江余姚
- id: guji-黄宗羲-event-death
  title_zh: 卒于余姚
  date: '1695-08-12'
  year_of: '1695'
  description: 卒于家，年八十六，遗命薄葬，遗书由子百家及门人传刻
  location: 浙江余姚
