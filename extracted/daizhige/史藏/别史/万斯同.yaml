    name: 四库著录五十三卷
    labels:
      zh: 定论
    start_date: 1702
    highlight_event_id: guji-万斯同-event-butable
  decisions:
  - date: 1658
    title_zh: 弱冠先补后汉表
    rationale: 后汉有志无表列传虽详兴废拜罢难稽故先作诸王功臣外戚宦官将相九卿表以立例
  - date: 1675
    title_zh: 遍补三国晋宋以下
    rationale: 三国志表并无南北诸朝皆无表故仿年经国纬之法一方镇一大事皆为作表以备史家之事
- id: guji-万斯同-endeavor-2
  title_zh: 以布衣襄修明史
  description: 熟于明室典故防修明史当事咨其博洽入徐乾学幕参史局修郡乘辨官迁岁月并作明史诸王功臣将相年表十三篇
  phases:
  - key: brewing
    name: 精览明代文献
    labels:
      zh: 积学
    start_date: 1665
    highlight_event_id: guji-万斯同-event-buhan
  - key: breakthrough
