  - 凭残籍断简定千载世次岁月考辨之难
  - 宗史汉旧例与创方镇大事新表之衡
  lesson: 表以年经国纬系世纪年补阙厘然方助成学而镜得失
  summary_first_person: 吾鄞县万斯同字季野少承家学弱冠读二十一史慨后汉以下多阙表乃先补后汉诸王功臣外戚宦官及将相九卿四篇遂遍补三国晋宋齐梁陈魏齐周隋至五代凡六十篇又熟明朝典故以布衣襄修明史惟愿览者阅文便睹举目可详此吾补表之志也
