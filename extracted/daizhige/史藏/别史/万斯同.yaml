    start_date: 1679
    highlight_event_id: guji-万斯同-event-mingshi
  - key: climax
    name: 作明季功臣将相年表
    labels:
      zh: 佐史
    start_date: 1690
    highlight_event_id: guji-万斯同-event-mingshi
  - key: closure
    name: 修乡郡乘覆验不爽
    labels:
      zh: 垂范
    start_date: 1700
    highlight_event_id: guji-万斯同-event-mingshi
  decisions:
  - date: 1679
    title_zh: 不就征辟以布衣佐史
    rationale: 守故国之节不署衔而以博洽供采录方得深思深考成一家之书
  - date: 1690
    title_zh: 作开国至监国行朝大臣年表
    rationale: 明史本纪列传未备以年表系开国功臣将相内外大臣迁免岁月以备史官采录
events:
- id: guji-万斯同-event-birth
  title_zh: 生于浙江鄞县
  date: 1638
  year_of: 1638
  description: 崇祯十一年生于鄞县万氏为履安先生少子季野读书五行并下尤熟典故
- id: guji-万斯同-event-buhan
  title_zh: 弱冠补后汉四篇
  date: 1658
  year_of: 1658
  description: 年二十慨后汉书无表补作诸王功臣世表外戚宦官侯表及将相大臣九卿年表凡四篇自此遍作历代表
- id: guji-万斯同-event-mingshi
  title_zh: 以布衣襄修明史
  date: 1679
  year_of: 1679
  description: 明史馆开以博洽被咨入徐乾学幕佐修明史并作明史表十三篇修乡郡乘随览随判迁代岁月
- id: guji-万斯同-event-butable
  title_zh: 补历代史表六十篇成
  date: 1692
  year_of: 1692
  description: 康熙壬申遍补三国晋宋齐梁陈魏齐周隋下及五代僭伪诸国凡六十篇黄宗羲朱彝尊序之称为不朽盛事
- id: guji-万斯同-event-death
  title_zh: 卒于康熙四十一年
  date: 1702
  year_of: 1702
  description: 以布衣终康熙四十一年卒所补五十三卷后入四库别史类纪昀等称其网罗繁富过一功十
