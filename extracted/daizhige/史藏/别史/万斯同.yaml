endeavors:
- id: guji-万斯同-endeavor-1
  title_zh: 补历代史表六十篇
  description: 以十七史自后汉至五代唯新唐书有表乃宗史汉作世表年表宗唐书作方镇表并创宦者侯表大事年表共五十三卷六十篇
  phases:
