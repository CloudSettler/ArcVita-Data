    highlight_event_id: guji-何桂清-event-1859-chaotai2
  decisions:
  - date: 1859-10-06
    title_zh: 船钞一节代为乞恩再奏
    rationale: 通商章程须各国一律，惟船钞或可先请加恩，与潮台事分别办理
  - date: 1859-10-24
    title_zh: 船钞与两港一并速奏俟旨
    rationale: 既称欣然乐从缓开新章不过迟早之别，今美使坚请，故一并奏请以便通行各口遵办
