    highlight_event_id: guji-努尔哈赤-event-maerdun
  - key: breakthrough
    name: 率四百兵大战玛尔墩取城
    labels:
      zh:
      - 复仇
      - 奋勇
    start_date: 1584-06
    highlight_event_id: guji-努尔哈赤-event-maerdun
  - key: climax
    name: 雪夜围齐吉达负重伤而还
    labels:
      zh:
      - 冒险
      - 挫折
    start_date: 1584-09
    highlight_event_id: guji-努尔哈赤-event-donge
  - key: closure
    name: 复克翁鄂洛宥鄂尔果尼洛科而用之
    labels:
      zh:
      - 宽宥
      - 得人
    start_date: 1585-02
    highlight_event_id: guji-努尔哈赤-event-wengelu
  decisions:
  - date: 1584-09
    title_zh: 乘栋鄂自乱不顾谏阻进兵
    rationale: 若不先发待其重相和睦必加兵于我故先发制人
  - date: 1585-02
    title_zh: 释射伤我之鄂尔果尼洛科授牛录厚养
    rationale: 锋镝之下各为其主此等人死于锋镝尤当惜之后必为我用命
events:
- id: guji-努尔哈赤-event-birth
  date: 1559
  year_of: 1559
  title_zh: 太祖诞生于赫图阿拉
  description: 己未岁明嘉靖三十八年孕十三月生凤眼大耳面如冠玉龙行虎步有圣人出勘乱之谣
- id: guji-努尔哈赤-event-tulun
  date: 1583-05
  year_of: 1583
  title_zh: 初举兵下图伦复攻嘉班
  description: 癸未岁夏五月年二十五以遗甲十三副结诺密纳起兵兵不满百克图伦秋八月再攻嘉班尼堪外兰逃至抚顺边外
- id: guji-努尔哈赤-event-sarhu
  date: 1583-10
  year_of: 1583
  title_zh: 计杀诺密纳鼐喀达取萨尔浒
  description: 阳与诺密纳合攻巴尔达阴夺其器械执杀兄弟二人遂取萨尔浒城还其逃散妻孥
- id: guji-努尔哈赤-event-lidai
  date: 1584-01
  year_of: 1584
  title_zh: 雪夜凿岭征理岱宥而养之
  description: 甲申岁正月大雪凿噶哈岭为磴鱼贯而上克城宥理岱之死而养之以服同姓
- id: guji-努尔哈赤-event-maerdun
  date: 1584-06
  year_of: 1584
  title_zh: 大战玛尔墩为噶哈善复仇
  description: 率兵四百攻纳木占萨木占以战车并进冒飞石当前射杀纳申等四人绝汲跣足登山袭破之
- id: guji-努尔哈赤-event-donge
  date: 1584-09
  year_of: 1584
  title_zh: 攻栋鄂齐吉达及翁鄂洛负伤
  description: 九月率五百兵围齐吉达焚楼会大雪以十二人伏击后助逊扎秦光衮攻翁鄂洛首项中两箭血流至足犹弯射不已
- id: guji-努尔哈赤-event-wengelu
  date: 1585-02
  year_of: 1585
  title_zh: 疮愈复克翁鄂洛宥射我者
  description: 乙酉年疮愈复攻翁鄂洛城克之众欲杀鄂尔果尼洛科太祖谓各为其主赐牛录厚养之
- id: guji-努尔哈赤-event-death
  date: 1626-09-30
  year_of: 1626
  title_zh: 太祖崩于天命十一年
  description: 自癸未起兵削平诸部攻克辽东诸城至天命十一年八月崩传业后金
