      - 兼并
    start_date: 1583-10
    highlight_event_id: guji-努尔哈赤-event-sarhu
  - key: closure
    name: 硕翁科罗败哈达兵宥养理岱定基
    labels:
      zh:
      - 巩固
      - 怀柔
    start_date: 1584-01
    highlight_event_id: guji-努尔哈赤-event-lidai
  decisions:
  - date: 1583-05
    title_zh: 结萨尔浒四部盟誓起兵
    rationale: 与其仰望明边不如投爱新觉罗共报仇以聚众
  - date: 1583-10
    title_zh: 阳合诺密纳阴夺其兵而诛之
    rationale: 诺密纳暗通尼堪外兰又阻边路若不先破必附敌而散我众
- id: guji-努尔哈赤-endeavor-2
  title_zh: 征栋鄂翁鄂洛削平呼伦左右诸部
  goal: 为妹夫噶哈善复仇乘栋鄂自乱进取一方恩威并服诸部
  phases:
  - key: brewing
    name: 噶哈善遇害族人同谋相阻
    labels:
      zh:
      - 内忧
      - 忍辱
