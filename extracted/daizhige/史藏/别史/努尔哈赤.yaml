  title_zh: 十三副甲起兵复仇兼并苏克素护河部
  goal: 报古埒祖父之仇破尼堪外兰兼并图伦嘉班萨尔浒以立国基
  phases:
  - key: brewing
    name: 古埒丧亲乞执仇人
