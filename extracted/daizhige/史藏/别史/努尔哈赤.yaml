person:
  qid: guji-努尔哈赤
  name_zh: 努尔哈赤
  names:
    zh: 努尔哈赤
    en: Nurhaci
  lifespan:
    birth:
      date: 1559
      precision: year
      is_circa: false
      raw: 大明嘉靖三十八年己未岁厄墨气孕十三月所生
    death:
      date: 1626-09-30
      precision: day
      is_circa: false
      raw: 天命十一年八月
  birth_date: 1559
  death_date: 1626-09-30
  era: 明末清初
  reign_ref: 后金天命汗
  archetype: 开创雄主
  dilemmas:
  - 祖父塔石与曾祖觉常刚为明兵误杀于古勒城，明廷仅以敕书马匹抚慰，是忍辱受抚还是起兵复仇
  - 同族六祖子孙立誓欲杀我而归尼康外郎，哈达又助敌，是先安内还是先攘外
  - 兵不满百甲仅三十，是依附强邻苟存还是以十三副遗甲孤军举事
  lesson: 恩威并行，顺者以德服，逆者以兵临，忍小衅以全大局，积小胜以成大业
  summary_first_person: 我姓爱新觉罗，名布库里英雄之后，天女佛古伦苗裔，嘉靖己未生于黑秃阿喇，十岁丧母，十九分居，唯遗甲十三。祖父父为尼康外郎所构陷没于明兵，我不甘为编氓，结撒儿湖四酋祭天起兵，先诛诺米纳，再克秃隆甲板，征李岱，复仇刚哈鄯，战东果瓮哥落，虽身被二创而不退，终削平诸部以立满洲之基。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%A4%AA%E7%A5%96%E6%AD%A6%E7%9A%87%E5%B8%9D%E5%AE%9E%E5%BD%95.html
endeavors:
- id: guji-努尔哈赤-endeavor-1
  title_zh: 十三副甲起兵复仇并统一建州
  summary: 以祖父仇为旗，诛诺米纳，逐尼康外郎，收撒儿湖，败宗室暗害，奠定建州共主之势
  phases:
  - key: brewing
    name: 祭天结盟举事
    labels:
