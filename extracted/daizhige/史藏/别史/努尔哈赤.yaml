  - key: breakthrough
    name: 诛叛取撒儿湖
    labels:
      zh:
      - 智取
      - 立威
    start_date: 1583-08
    highlight_event_id: guji-努尔哈赤-event-saherhu
  - key: climax
    name: 夜袭凿山克李岱
    labels:
      zh:
      - 攻坚
      - 宽宥
    start_date: 1584-01
    highlight_event_id: guji-努尔哈赤-event-lidai
  - key: closure
    name: 厚葬妹夫震慑宗室
    labels:
      zh:
      - 收心
      - 守成
    start_date: 1584-02
    highlight_event_id: guji-努尔哈赤-event-lidai
  decisions:
  - date: 1583-05
    title_zh: 不附尼康外郎孤军起兵
    rationale: 百岁不死之人无有，附逆则失人心，不如以遗甲十三正名复仇
  - date: 1583-08
    title_zh: 阳合阴取先夺诺米纳器械
    rationale: 刚哈鄯等已离心，若不先破诺米纳则众将叛散，故借合攻之名收其甲仗而诛之
  - date: 1584-01
    title_zh: 雪夜凿山必攻李岱
    rationale: 同姓引外人劫我寨，若不惩则效尤者众，虽山险有备亦不可还师
- id: guji-努尔哈赤-endeavor-2
  title_zh: 忍刺扩张恩威服众
  summary: 数遇夜刺而不妄杀，纵贼以避衅，远围绝汲以克马儿墩，乘东果自乱而攻阿亥，战瓮哥落重伤而不弃城
  phases:
  - key: brewing
    name: 屡脱暗杀而隐忍
    labels:
      zh:
      - 隐忍
      - 保全
    start_date: 1583-06
    highlight_event_id: guji-努尔哈赤-event-cisha
  - key: breakthrough
    name: 围绝汲路克马儿墩
    labels:
      zh:
      - 复仇
      - 攻城
    start_date: 1584-06
    highlight_event_id: guji-努尔哈赤-event-maerdun
  - key: climax
    name: 乘乱攻东果阿亥
    labels:
      zh:
      - 乘衅
      - 远袭
    start_date: 1584-09
    highlight_event_id: guji-努尔哈赤-event-dongguo
  - key: closure
    name: 身被重创仍克瓮哥落
    labels:
      zh:
      - 苦战
      - 不屈
    start_date: 1584-10
    highlight_event_id: guji-努尔哈赤-event-wenggeluo
  decisions:
  - date: 1584-05
    title_zh: 擒贼不杀纵之而去
    rationale: 贼必有主，杀则授以兴兵之名，我粮少器不足，纵贼则无衅可乘
  - date: 1584-06
    title_zh: 为刚哈鄯复仇远攻纳木张
    rationale: 妹夫被杀宗室同谋，若不往寻尸厚葬则人心尽失，故披甲横冈以慑族人
  - date: 1584-09
    title_zh: 趁东果自乱先发制人
    rationale: 彼若重相和睦必加兵于我，不如乘乱往攻，胜则拓地，不胜亦挫其锋
events:
- id: guji-努尔哈赤-event-birth
  date: 1559
  year_of: 1559
  title_zh: 生于黑秃阿喇
  description: 嫡母奚塔喇氏厄墨气孕十三月生太祖，凤眼大耳，体貌雄伟，时有大贤出戡乱之谣
- id: guji-努尔哈赤-event-qibing
  date: 1583-05
  year_of: 1583
  title_zh: 十三副甲起兵攻尼康外郎
  description: 结诺米纳等祭天盟誓，以遗甲十三起兵，诺米纳背约，太祖兵不满百克秃隆而回
- id: guji-努尔哈赤-event-saherhu
  date: 1583-08
  year_of: 1583
  title_zh: 诛诺米纳取撒儿湖
  description: 阳与诺米纳合兵攻城，收其器械，执诺米纳奈哈答杀之，遂取撒儿湖城
- id: guji-努尔哈赤-event-cisha
  date: 1583-06
  year_of: 1583
  title_zh: 宗室连夜行刺得脱
  description: 六祖子孙誓杀太祖，六月晦夜登城，九月拔栅潜入，赖犬吠持刀喝退，后电光擒贼复纵之
- id: guji-努尔哈赤-event-lidai
  date: 1584-01
  year_of: 1584
  title_zh: 雪夜凿山攻克李岱
  description: 大雪凿刚哈岭为磴系马而上，虽城中有备督兵即克，宥李岱之死而养之
- id: guji-努尔哈赤-event-maerdun
  date: 1584-06
  year_of: 1584
  title_zh: 围马儿墩报刚哈鄯仇
  description: 率兵四百攻纳木张沙木张，以战车并进，射中内申面颊，绝汲三日跣足登山袭破之
- id: guji-努尔哈赤-event-dongguo
  date: 1584-09
  year_of: 1584
  title_zh: 攻东果阿亥奇吉答城
  description: 乘东果自乱率兵五百围奇吉答，焚楼屋，会大雪罢攻，伏兵斩获而回
- id: guji-努尔哈赤-event-wenggeluo
  date: 1584-10
  year_of: 1584
  title_zh: 战瓮哥落重伤克城
  description: 助孙扎七光滚攻瓮哥落，登屋射敌，首中鹅儿古尼箭，项中老科箭，血流至足昏仆，疮愈复攻克之，赦射己者各为其主
- id: guji-努尔哈赤-event-death
  date: 1626-09-30
  year_of: 1626
  title_zh: 驾崩于叆福陵前
  description: 自天命元年建国称汗，削平诸部攻克辽东，后因旧创病重而崩，庙号太祖武皇帝
