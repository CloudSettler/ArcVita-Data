  archetype: 开国创业之主
  dilemmas:
  - 以十三副遗甲起兵复仇与节制杀伐安抚降部之间如何取舍
  - 恪守明朝羁縻旧制与自立国号称汗公开伐明之间如何决断
  lesson: 审时蓄力以小并大，先内后外，先安众心后图进取。
  summary_first_person: 我起自建州，以十三副遗甲收服近部，次第平定辉发乌拉及东海诸路，又灭叶赫而统一诸申，天命元年称英明汗建国，颁军令，屯田储粮，访贤立法，继以七大恨告天伐明，于萨尔浒破明三路大军，取沈阳辽阳，迁都辽东，为后继大业奠基。
  source_urls:
  - https://daizhige.org/史藏/别史/满文老档.html
