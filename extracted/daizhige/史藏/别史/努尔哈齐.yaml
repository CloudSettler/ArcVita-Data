    labels:
      zh: 厉兵秣马
    start_date: 1618-01-01
    highlight_event_id: guji-努尔哈齐-event-1619-saerhu
  - key: climax
    name: 萨尔浒大破明三路军
    labels:
      zh: 萨尔浒之战
    start_date: 1619-04-14
    highlight_event_id: guji-努尔哈齐-event-1619-saerhu
  - key: closure
    name: 取沈阳辽阳迁都安民
    labels:
      zh: 经略辽东
    start_date: 1621-05-11
    highlight_event_id: guji-努尔哈齐-event-1621-shenyang
  decisions:
  - date: 1616-02-17
    title_zh: 尊为英明汗定国号立法屯田
    rationale: 以汗号统摄贝勒大臣，以牛录屯田储粮访贤，使国人有常法可守。
  - date: 1618-05-01
    title_zh: 告天七大恨兴师伐明
    rationale: 明助叶赫庇逃人，索还无果，须以大义聚众，凭界藩筑城步步推进。
  - date: 1621-05-11
    title_zh: 克沈阳辽阳后禁毁屋安抚汉民
    rationale: 得城即得民，禁抢掠，设官守台，迎福晋定居，以辽东为根本。
events:
- id: guji-努尔哈齐-event-birth
  title_zh: 出生于建州赫图阿拉
  date: 1559-05-14
  year_of: 1559
  kind: birth
  description: 明嘉靖三十八年四月初八生于建州，显祖之子，幼历艰辛，承十三副遗甲家业。
- id: guji-努尔哈齐-event-1607-huifa
  title_zh: 灭辉发部攻克乌拉宜罕山城
  date: 1607-01-01
  year_of: 1607
  kind: career
  description: 丁未至庚戌年间发兵灭辉发，攻克乌拉宜罕山城，收其户编牛录，威震海西。
- id: guji-努尔哈齐-event-1616-khan
  title_zh: 天命元年正月尊为英明汗建国
  date: 1616-02-17
  year_of: 1616
  kind: career
  description: 天命元年正月诸贝勒大臣尊为英明汗，建国定政，命收东海遗户，屯田 Train 兵立法。
- id: guji-努尔哈齐-event-1619-saerhu
  title_zh: 萨尔浒大破明杨镐三路军并灭叶赫
  date: 1619-04-14
  year_of: 1619
  kind: career
  description: 天命四年三月明广宁都堂杨镐分三路来攻，我军凭界藩萨尔浒连破之，八月征灭叶赫部。
- id: guji-努尔哈齐-event-1621-shenyang
  title_zh: 攻克沈阳辽阳定都辽东
  date: 1621-05-11
  year_of: 1621
  kind: career
  description: 天命六年三月发兵攻克沈阳，继克辽阳，犒赏官兵，安抚海州复州金州汉民，迎众福晋入辽阳定居。
- id: guji-努尔哈齐-event-death
  title_zh: 病逝于叆鸡堡外
  date: 1626-09-30
  year_of: 1626
  kind: death
  description: 天命十一年八月十一日病逝，终年六十八，葬福陵，子皇太极嗣位。
