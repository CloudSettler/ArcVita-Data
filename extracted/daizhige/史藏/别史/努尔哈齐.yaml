  decisions:
  - date: 1607-01-01
    title_zh: 先灭辉发再图乌拉
    rationale: 避两线受敌，各个击破海西强部，以收降户编牛录扩兵。
  - date: 1613-01-01
    title_zh: 灭乌拉后暂抚叶赫联姻蒙古
    rationale: 借科尔沁扎鲁特联姻稳定西线，集中兵力收取东海散户，积粮训兵。
- id: guji-努尔哈齐-endeavor-2
  title_zh: 建后金称汗伐明经略辽东
  summary: 天命元年称汗建国，立法屯田，厉兵秣马，萨尔浒破明，取沈阳辽阳定都。
  phases:
  - key: brewing
