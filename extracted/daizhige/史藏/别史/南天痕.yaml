  dilemmas:
  - 弘光隆武永曆播遷三所而野史散佚九百餘種當如何網羅訂訛以補正史之缺
  - 舊國舊教望之悵然而興朝已定鼎當如何直書忠佞賢奸而不諱以存大義
  lesson: 網羅散佚刪繁歸雅以存南土興滅血痕而勸忠義
  summary_first_person: 吾西亭凌雪也以南天痕名編蓋取文信國南天之意網羅綏寇紀略明季遺聞南疆逸史諸書凡九百七十四種合而訂之首紀略次列傳以存弘光隆武永曆三朝興滅之實而補正史附入懷宗之缺
