  dilemmas:
  - 羈縻許市可暫安而紅夷築城日固終成腹心之疾
  - 渡彭搗巢勞師費餉而官兵憚涉汪洋勝負難必眾議紛紜
  lesson: 據島築城之寇不可許市養癰必決計渡洋搗巢復疆兼施善後方能肅清海氛
  summary_first_person: 吾南居益於天啟三年撫閩見紅夷據彭湖築城要市三載不去遂排眾議募兵買船三番接應築營鎮海絕其汲道迫令拆城遠遁東番復我疆土獻俘奏捷海波乃平
