  title_zh: 生於陝西渭南
  description: 明隆慶五年左右生於渭南舉萬曆進士歷藩臬後撫閩
- id: guji-南居益-event-fumin
  type: career
  date: 1623-10-22
  year_of: 1623
  title_zh: 以右副都御史巡撫福建陳驅夷策
  description: 天啟三年八月二十九日到任奏紅夷十一舟泊風櫃修城勾連咬𠺪吧大泥斷言互市不可苟從請嚴戰守列艦渡彭
- id: guji-南居益-event-dupeng
  type: career
  date: 1624-02-20
  year_of: 1624
  title_zh: 遣師自吉貝突入鎮海築城為營
  description: 天啟四年正月初二日選委王夢熊等開駕渡彭且擊且築壘石城於鎮海屢出奮攻各有斬獲夷退守風櫃一城
- id: guji-南居益-event-weifenggui
  type: career
  date: 1624-08-24
  year_of: 1624
  title_zh: 圍風櫃絕汲道迫夷白旗乞降拆城
  description: 七月十一日夷豎白旗願降十三日自西北起拆銃城二十八日盡毀門樓十三舟遁往東番寄泊邊鄙無聳
- id: guji-南居益-event-fupeng
  type: career
  date: 1624-11-29
  year_of: 1624
  title_zh: 破走紅夷焚城獻俘奏捷
  description: 天啟四年十月十八日福建官兵破走紅夷搗其巢焚其城解生夷十二名獻俘恢復百年疆土舒廟堂南顧之憂
- id: guji-南居益-event-death
  type: death
  date: 1629
  year_of: 1629
  title_zh: 卒於明崇禎初年
  description: 彭湖功成後歷官兵部尚書等職崇禎二年左右卒諡忠潔後人思其靖海之功
