  - date: 1623-10-22
    title_zh: 力主渡彭搗巢不許互市
    rationale: 彭湖去漳泉僅四五十里若許互市即宋襄陽榷場故事必成敵國故排眾議定渡海正剿之策
  - date: 1624-06-15
    title_zh: 誓師先攻夷舟後攻夷城
    rationale: 風櫃三面臨海惟一線可通夷舟列守不破其舟城必不守故斷汲道逼城分水陸齊進
- id: guji-南居益-endeavor-2
  title_zh: 經理閩海善後防夷
  phases:
  - key: brewing
    name: 核軍實嚴營寨
    labels:
      zh: 整飭水陸營制
    start_date: 1623-10-22
    highlight_event_id: guji-南居益-event-fumin
  - key: breakthrough
    name: 請留節省庫銀充餉
    labels:
      zh: 籌餉募兵造銃
    start_date: 1623-11-15
    highlight_event_id: guji-南居益-event-dupeng
  - key: climax
    name: 分佈水陸連營設防
    labels:
      zh: 連營防突善後
    start_date: 1624-08-24
    highlight_event_id: guji-南居益-event-weifenggui
  - key: closure
    name: 嚴守彭湖議設鎮戍
    labels:
      zh: 留鎮守彭備火舟
    start_date: 1624-11-29
    highlight_event_id: guji-南居益-event-fupeng
  decisions:
  - date: 1623-11-15
    title_zh: 奏留什一節省銀以佐軍興
    rationale: 濱海數千里額兵不及二萬額餉僅三十二萬又解遼餉無餉則無兵故請還故物以備戰守
  - date: 1624-11-29
    title_zh: 復地不窮追議守彭建制
    rationale: 狡夷求市之念未歇驅去恐復來故備火舟制大砲嚴守彭湖來則急擊去勿窮追使進無所獲退無巢可依
events:
- id: guji-南居益-event-birth
