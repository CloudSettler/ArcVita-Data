    rationale: 营建宅兆恐伤地灵故先设酒馔祝文以求保佑俾无后艰
  - date: 1850-04-10
    title_zh: 行三虞卒哭明日即祔于祖
    rationale: 神既归室当有依故奉主入庙递迁世次以全追远之情
