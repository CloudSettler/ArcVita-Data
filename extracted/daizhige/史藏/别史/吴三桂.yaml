  era: 明末清初
  reign_ref: 清圣祖康熙
  archetype: 封疆宿将
  dilemmas:
  - 明清鼎革之际固守山海还是引兵入关复仇之两难
  - 出边征缅擒故明永历之时忠义旧谊与开国功名之抉择
  - 久镇云贵功高位极之时急流勇退还是久握重兵之权衡
  lesson: 乘时势可成一时之功，失大义终累身名，持衡守正方为久安之道
  summary_first_person: 吾本辽东将门之后，值天下板荡，镇山海而引军入关，自谓借兵复仇，遂封平西。继镇秦蜀，绥辑滇黔，奉命与爱星阿会师木邦，直抵缅城，擒永历，降文选，蒙恩进为亲王，节制云贵。半生戎马，功过皆系时势，愿后人鉴吾得失
  source_urls:
