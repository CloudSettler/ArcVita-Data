endeavors:
- id: guji-吴三桂-endeavor-1
  title_zh: 会师木邦征缅擒永历
  summary_zh: 奉命统满汉大兵与定西将军爱星阿两路出边，会师木邦，直抵缅城，擒朱由榔，降白文选，平定滇南
  phases:
  - key: brewing
    name: 受命筹划两路出边
    labels:
      zh: 谋划进兵
    start_date: 1661-11-08
    highlight_event_id: guji-吴三桂-event-zhengmian
  - key: breakthrough
    name: 会师木邦临江造筏追击
    labels:
      zh: 长驱追击
    start_date: 1661-12-01
    highlight_event_id: guji-吴三桂-event-zhengmian
  - key: climax
    name: 直抵缅城缅酋献永历
    labels:
      zh: 擒获永历
    start_date: 1661-12-01
    highlight_event_id: guji-吴三桂-event-zhengmian
  - key: closure
    name: 凯旋奏捷告祭颁诏
    labels:
      zh: 荡平告捷
    start_date: 1662-02-26
    highlight_event_id: guji-吴三桂-event-zhengmian
  decisions:
  - date: 1661-11-08
    title_zh: 两路进兵会师木邦
    rationale: 永历窜缅遗孽未靖，须分路合击使李定国白文选不能相顾，直捣巢穴
  - date: 1661-12-01
    title_zh: 传谕缅酋令执送永历
    rationale: 先礼后兵以慑缅酋，若不献则兵临城下，使其震惧而献，可免攻城之损
- id: guji-吴三桂-endeavor-2
  title_zh: 镇守秦蜀滇黔进封亲王
  summary_zh: 镇守秦蜀绥辑滇黔之后以征缅大功进封亲王，总制云贵，招抚李定国余部，奠定西南格局
  phases:
  - key: brewing
    name: 镇守秦蜀绥辑滇黔
    labels:
      zh: 镇守抚辑
    start_date: 1662-03-12
    highlight_event_id: guji-吴三桂-event-fengwang
  - key: breakthrough
    name: 以征缅大功进封亲王
    labels:
      zh: 加恩进封
    start_date: 1662-05-11
    highlight_event_id: guji-吴三桂-event-fengwang
  - key: climax
    name: 云贵督抚听王节制
    labels:
      zh: 节制云贵
    start_date: 1663-02-18
    highlight_event_id: guji-吴三桂-event-jiezhi
  - key: closure
    name: 招抚李嗣兴等余部归诚
    labels:
      zh: 招抚余部
    start_date: 1663-06-19
    highlight_event_id: guji-吴三桂-event-jiezhi
  decisions:
  - date: 1662-05-11
    title_zh: 受亲王殊礼仍镇西南
    rationale: 既蒙殊恩，当继续绥辑滇黔抚顺剿逆，使国威远播疆圉底定
  - date: 1663-02-18
    title_zh: 请云贵督抚听王节制
    rationale: 西南初定事权不一，须统一节制方能布置堤防弹压地方招徕降附
events:
- id: guji-吴三桂-event-birth
  title_zh: 诞生于辽东高邮
  date: 1612-06-08
  year_of: 1612
  type: birth
  description: 明万历四十年五月初八诞生于辽东将门，後为山海关总兵，值明清鼎革
- id: guji-吴三桂-event-zhengmian
  title_zh: 会师木邦擒永历降文选
  date: 1662-02-26
  year_of: 1662
  type: achievement
  description: 与爱星阿会师木邦，直抵缅城，缅酋执朱由榔献军前，白文选率官兵家口全军归降，滇南平，奏捷告祭颁诏天下
- id: guji-吴三桂-event-fengwang
  title_zh: 以征缅大功进封亲王
  date: 1662-05-11
  year_of: 1662
  type: achievement
  description: 以镇守秦蜀绥辑滇黔及出边擒永历降文选之功，奉旨进封为亲王，示眷酬殊礼
- id: guji-吴三桂-event-jiezhi
  title_zh: 云贵督抚听王节制
  date: 1663-02-18
  year_of: 1663
  type: achievement
  description: 疏请云贵二省总督巡抚敕书撰入听王节制四字，获准，总制西南，并招抚李嗣兴等归诚
- id: guji-吴三桂-event-death
  title_zh: 病逝于衡州称帝之後
  date: 1678-10-02
  year_of: 1678
  type: death
  description: 康熙十七年八月十七病逝于衡州，起兵反清称周帝後五月而殁，三藩之乱旋平
