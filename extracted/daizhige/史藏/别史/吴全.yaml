endeavors:
- id: guji-吴全-endeavor-1
  person_id: guji-吴全
  title_zh: 廖氏兄弟母利银追讨
  summary_zh: 光绪癸未借出母银三十元与廖勤廖戆九，积欠母利百余元，经保认宽限仍抗不还，呈控恒春县，和息五十元销案
  phases:
  - key: brewing
    name: 借出母银约定月利
    labels:
      zh:
      - 放贷生息
    start_date: 1883-06-08
    highlight_event_id: guji-吴全-event-loan-liao
  - key: breakthrough
    name: 呈控恒春县请追血本
    labels:
      zh:
      - 经官追讨
    start_date: 1888-12-15
    highlight_event_id: guji-吴全-event-lawsuit-1888
  - key: climax
    name: 饬传原被告讯究
    labels:
      zh:
      - 票传讯究
    start_date: 1888-12-24
    highlight_event_id: guji-吴全-event-summons-1888
  - key: closure
    name: 和息五十元批销了案
    labels:
      zh:
      - 和息结案
    start_date: 1889-02-22
    highlight_event_id: guji-吴全-event-settlement-1889
  decisions:
  - date: 1888-12-15
    title_zh: 呈状控廖勤兄弟骗延
    rationale: 血本无归屡讨不给，不得已沥情乞官饬提讯追断还
  - date: 1889-02-22
    title_zh: 允和息五十元清楚
    rationale: 经总理劝处两造甘愿，备还母利五十元以免讼累
- id: guji-吴全-endeavor-2
  person_id: guji-吴全
  title_zh: 李辉二黄新春胎借出借追讨
  summary_zh: 光绪十一年十二年先后胎借五十元与李辉二，出借三十元与黄增福，积欠利银货银甚巨，呈控恒春县，官以四分三分违律饬依一本一利理处，终断结清账
  phases:
  - key: brewing
    name: 胎借出借立字生息
    labels:
      zh:
      - 胎借立字
    start_date: 1885-12-25
    highlight_event_id: guji-吴全-event-loan-li
  - key: breakthrough
    name: 再借黄家积欠利货
    labels:
      zh:
      - 出借积欠
    start_date: 1886-08-10
    highlight_event_id: guji-吴全-event-loan-huang
  - key: climax
    name: 呈控李黄霸抗骗延
    labels:
      zh:
      - 严提究还
    start_date: 1893-07-16
    highlight_event_id: guji-吴全-event-lawsuit-1893
  - key: closure
    name: 传讯断减息清账
    labels:
      zh:
      - 断结清账
    start_date: 1893-10-22
    highlight_event_id: guji-吴全-event-settlement-1893
  decisions:
  - date: 1893-07-16
    title_zh: 粘单呈控李辉二黄新春
    rationale: 典借契据俱在而骗限不吐，非蒙严究不足儆效尤而安商弱
  - date: 1893-10-11
    title_zh: 服从一本一利理处
    rationale: 官批取利四分三分与定律不符，愿由总理原中查照定律妥处
  - date: 1893-10-22
    title_zh: 允减免利银以器具抵还
    rationale: 念黄家寒苦父债子完无力，断减利银以家存器具抵四十元了结
events:
- id: guji-吴全-event-birth
  person_id: guji-吴全
  title_zh: 出生
  date: 1866
  year_of: 1866
  description: 约生于同治五年，恒春城街人，后为本城铺户漳发号即吴全
- id: guji-吴全-event-death
  person_id: guji-吴全
  title_zh: 逝世
  date: 1930
  year_of: 1930
  description: 卒年未详，约推于民国初年后辞世
- id: guji-吴全-event-loan-liao
  person_id: guji-吴全
  title_zh: 借出母银与廖氏兄弟
  date: 1883-06-08
  year_of: 1883
  description: 光绪癸未五月初四日，廖动与其弟廖戆九借去母银三十元，言明每元每日贴回利钱五十文
- id: guji-吴全-event-lawsuit-1888
  person_id: guji-吴全
  title_zh: 呈控廖勤兄弟抗欠
  date: 1888-12-15
  year_of: 1888
  description: 光绪十四年十一月十三日呈状，母利统欠百二十余元，托保宽限仍分文不给，乞饬提讯追
- id: guji-吴全-event-summons-1888
  person_id: guji-吴全
  title_zh: 恒春县饬传讯究
  date: 1888-12-24
  year_of: 1888
  description: 署恒春县正堂高批钱债收息不过三分，票饬差传原告吴漳发被告廖勤廖戆九带借券赴县讯究
- id: guji-吴全-event-settlement-1889
  person_id: guji-吴全
  title_zh: 和息五十元销案
  date: 1889-02-22
  year_of: 1889
  description: 经总理余恒泰等劝处，廖戆九备还母利银五十元清楚，两造甘愿具结，正堂吕批销案
- id: guji-吴全-event-loan-li
  person_id: guji-吴全
  title_zh: 李辉二胎借瓦店
  date: 1885-12-25
  year_of: 1885
  description: 光绪十一年十一月廿日，李喜辉二以城内大街瓦店为胎借六八银五十元，每元月息四分
- id: guji-吴全-event-loan-huang
  person_id: guji-吴全
  title_zh: 黄增福出借银货
  date: 1886-08-10
  year_of: 1886
  description: 光绪十二年七月初一日，新春号黄增福借六八银三十元，每月纳息一元，另欠店货二十余千
- id: guji-吴全-event-lawsuit-1893
  person_id: guji-吴全
  title_zh: 再控李黄欠利不还
  date: 1893-07-16
  year_of: 1893
  description: 光绪十九年六月初三日，年二十七岁，粘单呈控李辉贰欠利九十六元黄新春欠利货百元，乞严提究还
- id: guji-吴全-event-settlement-1893
  person_id: guji-吴全
  title_zh: 断李黄减息清账
  date: 1893-10-22
  year_of: 1893
  description: 九月初二初十三日断李辉二限十冬还清，黄知高以器具抵银四十元减免利银清账，契券存候查销
