  dilemmas:
  - 天时短促风猛雨淋而仍须招农开垦
  - 蕃社逼近酬应繁费而须抚绥保障两全
  - 官给口粮易养惰而截支口粮又恐流散
  lesson: 度地量人随时变通始能垦辟成业民蕃相安
