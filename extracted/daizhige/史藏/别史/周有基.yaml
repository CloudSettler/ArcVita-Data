endeavors:
- id: guji-周有基-endeavor-1
  title_zh: 南路恒春查勘招佃与凉伞埔开圳
  summary: 光绪二年查覆南路天时地势人情招农之难并为林廷仪等请垦凉伞埔开圳给牛具立庄起凤
  phases:
  - key: brewing
    name: 查覆南路开垦工本情形
    labels:
      zh: 踏勘禀复
    start_date: 1876-08-16
    highlight_event_id: guji-周有基-event-1
  - key: breakthrough
    name: 招佃凉伞埔自开报效
    labels:
      zh: 招佃请垦
    start_date: 1876-11-05
    highlight_event_id: guji-周有基-event-2
  - key: climax
    name: 包开水圳给发牛具草厝谷种
    labels:
      zh: 给本兴工
    start_date: 1876-11-05
    highlight_event_id: guji-周有基-event-2
  - key: closure
    name: 结厝为庄名曰起凤以待成熟
    labels:
      zh: 结厝为庄
    start_date: 1877-01-01
    highlight_event_id: guji-周有基-event-2
  decisions:
  - date: 1876-08-16
    title_zh: 具禀南路风雨人情与中路互异请量为变通
    rationale: 南路可作期短蕃社逼近招农难非优厚工资与变通不能集事
  - date: 1876-11-05
    title_zh: 为林廷仪等转禀不领口粮请减租至二成并给牛具谷种
    rationale: 佃愿自开报效则减租给本以示体恤可速开成水田十余甲
- id: guji-周有基-endeavor-2
  title_zh: 巴郎卫卑南垦务经理与报销移交
  summary: 光绪三年至五年经理南路后山各庄垦民口粮牛具支发造具四柱清册请委员勘丈以应裁局归县
  phases:
  - key: brewing
    name: 领经费设局安置垦民
    labels:
      zh: 领款安屯
    start_date: 1877-12-06
    highlight_event_id: guji-周有基-event-3
  - key: breakthrough
    name: 分段开垦给发口粮农具耕牛
    labels:
      zh: 分段开垦
    start_date: 1878-01-01
    highlight_event_id: guji-周有基-event-3
  - key: climax
    name: 查存人数田亩汇造清册报销
    labels:
      zh: 造册报销
    start_date: 1879-11-17
    highlight_event_id: guji-周有基-event-4
  - key: closure
    name: 请派弓手勘丈以待升科移交厅县
    labels:
      zh: 勘丈移交
    start_date: 1879-11-17
    highlight_event_id: guji-周有基-event-4
  decisions:
  - date: 1877-12-06
    title_zh: 收领海防经费银两分别济应垦民安置
    rationale: 无经费则牛种农具口粮无措必先核收分发方能开工
  - date: 1879-11-17
    title_zh: 查明收支存剩汇造四柱清册请委员勘丈
    rationale: 口粮年限将满裁局归县必先册报分明方能核实升科
