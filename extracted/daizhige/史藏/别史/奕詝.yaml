events:
- id: guji-奕詝-event-birth
  date: 1831-07-17
  year_of: 1831
  title_zh: 诞生于御园湛静斋
  description: 道光十一年六月初九丑时诞生生有圣德神智内充发音铿洪六龄就傅受书于杜受田
- id: guji-奕詝-event-secret
  date: 1846-08-07
  year_of: 1846
  title_zh: 密建为皇储屡命恭代行礼
  description: 丙午六月十六宣宗遵密建家法亲书上名缄置秘函豫立储贰后命恭代祈谷北郊东陵太庙之礼圣眷日隆
- id: guji-奕詝-event-accession
  date: 1850-02-25
  year_of: 1850
  title_zh: 奉朱谕立为皇太子宣宗宾天即位
  description: 道光三十年正月丁未宣宗召宗令御前军机等宣示朱谕立皇四子为皇太子午刻升遐上哭临奉灵驾进城成服举哀以倚庐居丧
- id: guji-奕詝-event-enthronement
  date: 1850-03-09
  year_of: 1850
  title_zh: 登极颁诏奉移殡宫
  description: 依钦天监吉日本月二十六己未举行登极颁诏典礼定二月初二奉移梓宫于圆明园正大光明殿议丧服尊谥之礼
- id: guji-奕詝-event-death
  date: 1861-08-22
  year_of: 1861
  title_zh: 崩于热河行宫
  description: 咸丰十一年七月十七日崩于热河避暑山庄烟波致爽殿在位十一年庙号文显谥号协天翊运执中垂谟懋德振武圣孝渊恭端仁宽敏显皇帝
