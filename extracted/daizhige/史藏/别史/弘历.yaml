events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  type: birth
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生于雍亲王府为雍正第四子母熹贵妃钮祜禄氏
- id: guji-弘历-event-ascend
  title_zh: 登极改元乾隆
  type: career
  date: 1735-10-08
  year_of: 1735
  description: 雍正十三年八月二十三日雍正崩遗诏传位于弘历九月即皇帝位于太和殿翌年改元乾隆是为乾隆元年实录自此始纪
- id: guji-弘历-event-western
  title_zh: 平定准部回部一统西域
  type: career
  date: 1759-08-01
  year_of: 1759
  description: 乾隆二十四年平定大小和卓收复天山南北路设伊犁将军府新疆遂入版图与前此平准部合为十全武功之大者
- id: guji-弘历-event-abdicate
  title_zh: 禅位嘉庆仍训政
  type: career
  date: 1796-02-09
  year_of: 1796
  description: 乾隆六十年正月初一日传位于皇太子颙琰改元嘉庆仍称太上皇帝训政于养心殿临御实凡六十一年
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  type: death
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日崩于养心殿寿八十九谥纯皇帝庙号高宗乾隆实录至此而终
