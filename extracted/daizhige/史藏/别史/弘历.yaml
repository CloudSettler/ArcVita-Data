    rationale: 内地番民一视同仁台湾丁银加倍民力竭蹶故酌中减则并饬督抚晓谕严查滥征
  - date: 1737-02-05
    title_zh: 番饷照民丁例每丁二钱余悉裁减
    rationale: 番黎亦吾赤子所输番饷即百姓丁银故一体减免务令均沾实惠并及澎湖淡水两厅
