    rationale: 鹿耳门为全台重地商船出入易藏奸宄故以游击轮防并详查籍贯年貌以重海口
  - date: 1737-11-04
    title_zh: 准归还番地禁班兵扰累禁私娶番妇文武互举
    rationale: 私占番地与班兵入社滋扰最易启衅故画清界址勒归番地钤束班兵文武一体稽察以安番众靖地方
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  summary_zh: 康熙五十年八月十三日生为雍亲王胤禛第四子后即清高宗年号乾隆
- id: guji-弘历-event-1735-ascend
  title_zh: 即皇帝位于太和殿
  date: 1735-10-08
  year_of: 1735
  place_zh: 北京太和殿
  summary_zh: 雍正十三年九月初三日己亥即位谕赈台湾被风难民并戒粉饰严饬加意抚绥定台湾水师升衔留任例
- id: guji-弘历-event-1736-luermen
  title_zh: 准鹿耳门拨防稽商船
  date: 1736-04-12
  year_of: 1736
  place_zh: 台湾鹿耳门
  summary_zh: 准台协三营游击分年拨防鹿耳门商船出口详查舵工水手籍贯年貌以固全台重地海防
- id: guji-弘历-event-1736-dingyin
  title_zh: 减台湾四县丁银
  date: 1736-09-13
  year_of: 1736
  place_zh: 台湾府四县
  summary_zh: 以台湾每丁征银四钱七分加耗至五钱有零倍于内地故悉照内地例每丁征银二钱永为例并饬访察滥征
- id: guji-弘历-event-1736-xiongtu
  title_zh: 諭究番案并擒新港加志阁凶番
  date: 1736-11-01
  year_of: 1736
  place_zh: 台湾北路
  summary_zh: 台湾土番射死兵民巡台御史奏擒新港加志阁凶番上谕拏凶犯严审亦究弁兵生事并诘总兵马骥迟报之过
- id: guji-弘历-event-1737-fanxiang
  title_zh: 减台湾番饷及澎淡丁银
  date: 1737-02-05
  year_of: 1737
  place_zh: 台湾九十六社澎湖淡水
  summary_zh: 番社番饷有多至二两一两不等者照民丁例每丁二钱余悉裁减澎粮淡防两厅丁银亦照台湾四县例行
- id: guji-弘历-event-1737-shanhou
  title_zh: 准巡台御史台湾善后四条
  date: 1737-11-04
  year_of: 1737
  place_zh: 台湾府
  summary_zh: 准白起图条奏归还私占番地画清界址禁班兵偷入番社禁民私娶番妇文武互举究治以安民生靖海防
- id: guji-弘历-event-1738-mianshexiang
  title_zh: 免台凤社饷减番地贴饷
  date: 1738-11-12
  year_of: 1738
  place_zh: 台湾凤山诸罗彰化
  summary_zh: 免台凤等厅县额征社饷粟折银八千余两及鹿皮折价减征台属各县番地贴饷一半并饬海外赈恤从优周详
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京养心殿
  summary_zh: 嘉庆四年正月初三日崩在位六十年禅位后训政三年为清代御宇最久之帝庙号高宗谥纯皇帝
