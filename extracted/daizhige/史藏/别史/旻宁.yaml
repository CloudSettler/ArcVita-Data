  year_of: 1820
  title_zh: 滦阳奉遗诏缵承大统
  description_zh: 嘉庆二十五年七月二十五仁宗崩于避暑山庄烟波致爽殿御前军机大臣启鐍匣宣嘉庆四年密建朱谕奉皇太后懿旨即正尊位举哀成服以倚庐居丧
- id: guji-旻宁-event-death
