  title_zh: 癸酉禁中手枪平寇
  description_zh: 嘉庆十八年九月十五逆匪越墙入宫于养心门外持鸟枪连毙二贼护卫圣母神御会同王大臣搜捕余党宫禁肃清
- id: guji-旻宁-event-1820-jicheng
