  - 彭赵专权粗暴之下隐忍事郭与别立基业之抉择
  - 得众之后严纪律收人心与纵下徼赏之取舍
  lesson: 拨乱在收人心成军在立纪律创业在勤俭持守以除暴救民为本方能混一四海
  summary_first_person: 我本濠州钟离布衣，父母俱丧后入皇觉寺，值元乱投濠从郭子兴，救主难，募义兵，略定远取滁阳，以纪律练军，以仁义收众，遂渡江定鼎金陵，扫群雄驱胡虏，混一四海，制礼作乐，立法创制，以勤俭贻谋子孙
