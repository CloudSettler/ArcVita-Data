events:
- id: guji-朱元璋-event-birth
  type: birth
  date: 1328-09-21
  year_of: 1328
  title_zh: 生于钟离灵迹乡
  description: 戊辰年生于旰台县灵迹乡土地庙夜有神光烛天自叙朱氏出自金陵句容朱巷先考世珍迁泗州钟离
  place_zh: 钟离灵迹乡
- id: guji-朱元璋-event-dujiang
  type: career
  date: 1355-06-01
  year_of: 1355
  title_zh: 自和州渡江取太平驻兵
  description: 率师渡江駐兵太平初至采石驻薛妪家问砻床仁饭皆吉语后取滁和访朱巷宗族以金陵太平为基本
  place_zh: 太平
- id: guji-朱元璋-event-poyang
  type: career
  date: 1363-08-01
  year_of: 1363
  title_zh: 鄱阳湖征陈友谅被围解围
  description: 征陈友谅于鄱阳湖被围甚急介士韩成服龙袍投水解围复见空中萧王甲兵辅战遂大败之平汉
  place_zh: 鄱阳湖康郎山
- id: guji-朱元璋-event-pingwu
  type: career
  date: 1366-05-21
  year_of: 1366
  title_zh: 谕平伪周张士诚八罪
  description: 数张士诚私贩盐货诈降于元僭号改元占据江浙十年不贡等八罪命中书左相国徐达总率马步舟师分道并进
  place_zh: 姑苏浙西
- id: guji-朱元璋-event-beifa
  type: career
  date: 1367-10-01
  year_of: 1367
  title_zh: 北伐传檄中原
  description: 以中国居内制夷狄为言斥元废坏纲常谕中原之民兵至勿避归我者永安中华背我者自窜塞外
  place_zh: 中原
- id: guji-朱元璋-event-jiwei
  type: career
  date: 1368-01-23
  year_of: 1368
  title_zh: 告祭天地即皇帝位国号大明
  description: 吴元年正月初四告祭天地于钟山之阳即皇帝于南郊定有天下之号曰大明以吴元年为洪武元年追尊四代立后建储
  place_zh: 金陵钟山南郊
- id: guji-朱元璋-event-dashe
  type: career
  date: 1368-09-23
  year_of: 1368
  title_zh: 筑金陵城颁洪武元年大赦
  description: 筑京城以石灰秫粥锢外最为坚固洪武元年八月十一日大赦天下恤军士蠲租税垦荒田安新附以与民更始
  place_zh: 金陵
- id: guji-朱元璋-event-death
  type: death
  date: 1398-06-24
  year_of: 1398
  title_zh: 崩于京师
  description: 在位三十一年混一区宇立纲陈纪而崩葬孝陵
  place_zh: 京师
