endeavors:
- id: guji-朱元璋-endeavor-1
  title_zh: 濠州从戎救主立信
  summary: 自皇觉避兵卜决从雄，投濠得郭子兴亲任，彭赵执郭时挺身营救，全恩义以立信于众
  phases:
  - key: brewing
    name: 皇觉避兵卜从雄
    labels:
      zh: 待机审势
    start_date: 1352-03-01
    highlight_event_id: guji-朱元璋-event-joinhao
  - key: breakthrough
    name: 投濠见郭受知遇
    labels:
      zh: 托身立足
    start_date: 1352-04-14
    highlight_event_id: guji-朱元璋-event-joinhao
  - key: climax
    name: 驰归破械救郭难
    labels:
      zh: 全义立威
    start_date: 1352-10-01
    highlight_event_id: guji-朱元璋-event-rescueguo
  - key: closure
    name: 联姻受任得人心
    labels:
      zh: 成家任事
    start_date: 1352-11-01
    highlight_event_id: guji-朱元璋-event-rescueguo
  decisions:
  - date: 1352-04-14
    title_zh: 闰三月决计投濠从郭
    rationale: 四境逼迫讹言日甚，独处田野难自保，不如从雄以御乱而图后昌
  - date: 1352-10-01
    title_zh: 闻难不避驰救郭子兴
    rationale: 郭公于我恩厚，有难不救非义，冒执见之危往诉彭帅以解其缚，可全恩义收部属心
- id: guji-朱元璋-endeavor-2
  title_zh: 定远滁阳募练成军
  summary: 以七百人还乡募兵授镇抚，独与徐达等二十四人南略定远，收驴牌寨三千众，破横涧降七万，下滁阳而号令严明，自成一军
  phases:
  - key: brewing
    name: 归乡募兵得七百
    labels:
      zh: 初聚义从
    start_date: 1352-07-01
    highlight_event_id: guji-朱元璋-event-mubing
  - key: breakthrough
    name: 独率二十四人南行
    labels:
      zh: 独立营军
    start_date: 1353-06-01
    highlight_event_id: guji-朱元璋-event-dingyuan
  - key: climax
    name: 智取驴牌破横涧
    labels:
      zh: 以智胜众
    start_date: 1353-07-01
    highlight_event_id: guji-朱元璋-event-dingyuan
  - key: closure
    name: 会李善长下滁阳
    labels:
      zh: 立基滁阳
    start_date: 1353-08-01
    highlight_event_id: guji-朱元璋-event-quchuyang
  decisions:
  - date: 1353-06-01
    title_zh: 以七百属他将独率二十四人南略定远
    rationale: 观彭赵驭下无道恐祸及己，留旧部避嫌疑，率亲信别开局面方能自全立功
  - date: 1353-07-01
    title_zh: 病中请往招驴牌寨并设计缚其帅
    rationale: 孤军乏食无属正可收用，机不可失，以言谕不服则以计取之，既得其众又焚其垒以绝反复
events:
- id: guji-朱元璋-event-birth
  type: birth
  date: 1328-10-21
  year_of: 1328
  title_zh: 生于濠州钟离东乡
  description: 元天历元年戊辰九月十八日子丑生，父仁祖讳世珍，母陈太后，红光满室，邻里异之
- id: guji-朱元璋-event-joinhao
  type: career
  date: 1352-04-14
  year_of: 1352
  title_zh: 闰三月朔抵濠投郭子兴
  description: 避兵无所，卜从雄吉，抵濠见郭子兴，状貌奇伟得留置左右，寻命长九夫参谋攻讨
- id: guji-朱元璋-event-rescueguo
  type: career
  date: 1352-10-01
  year_of: 1352
  title_zh: 破械救郭子兴脱难
  description: 赵均用与孙德崖等执郭子兴械于孙氏，驰归与子兴二子诉于彭早住，发屋破械负以归，郭得免
- id: guji-朱元璋-event-mubing
  type: career
  date: 1352-07-01
  year_of: 1352
  title_zh: 归乡募兵授镇抚
  description: 濠城元兵退后归乡募兵得七百余人以还，郭喜授镇抚，复以盐易米赡郭家
- id: guji-朱元璋-event-dingyuan
  type: career
  date: 1353-07-01
  year_of: 1353
  title_zh: 略定远收驴牌寨破横涧
  description: 率费聚等十人入宝公河营，缚其帅驱众还得壮士三千，夜袭横涧降民兵七万得精壮二万，加以训练明纪律
- id: guji-朱元璋-event-quchuyang
  type: career
  date: 1353-08-01
  year_of: 1353
  title_zh: 会李善长攻下滁阳
  description: 道遇李善长留掌书记，戒以协诸将毋效群雄毁左右者，遂与俱攻滁阳下之，军容整肃郭阅而大悦
- id: guji-朱元璋-event-death
  type: death
  date: 1398-06-24
  year_of: 1398
  title_zh: 崩于金陵宫中
  description: 在位三十余年，制礼作乐立法创制既备，升遐万方哀悼，实录宝训成于永乐十六年以垂宪万世
