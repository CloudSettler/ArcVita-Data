  dilemmas:
  - title_zh: 国本之争处危疑而不惊
    description: 年幼居长而郑贵妃宠盛，三皇子并封之议起，外庭拥护与内廷窥伺交织，唯小心谨畏以全孝友
  - title_zh: 三旬御宇万几丛决而圣躬违和
    description: 哀毁在疚之际欲践遗诏撤税起废，用药用人之议纷起，速效与保养难以两全
  lesson: 处危以定，临政以宽，守孝弟之本以奠国基
  summary_first_person: 吾为神宗长子，母恭妃王氏，幼处震撼而小心孝谨，历国本纠纷十余年而得立为太子，居慈庆二十载潜心讲读，及登极仅一月，遵遗诏撤矿税发内帑起废臣释系囚，冀与群臣共为尧舜，不幸哀劳成疾，龙驭遽升，惟愿后人鉴我初心
  source_urls:
