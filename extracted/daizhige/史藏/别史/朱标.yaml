  place_zh: 太平陈迪家
  description: 元乙未九月生于太平陈迪家，为吴王世子，从宋濂受经
- id: guji-朱标-event-lichu
  title_zh: 洪武元年立为皇太子
  date: 1368-01
  year_of: 1368
  place_zh: 应天
  description: 正月立皇太子，以李善长徐达常遇春等兼领东宫官，又选梁贞王仪等为宾客谕德，建大本堂教太子诸王
- id: guji-朱标-event-tingzheng
  title_zh: 政事启太子处分后奏闻
  date: 1377-07
  year_of: 1377
  place_zh: 京师
  description: 十年六月令自今政事并启太子处分后奏闻，日临群臣听断诸司启事，讲太学衍义以练习国政
- id: guji-朱标-event-xunshan
  title_zh: 奉敕巡抚陕西相宅献图
  date: 1391-09
  year_of: 1391
  place_zh: 陕西
  description: 二十四年八月敕巡抚陕西相宅欲都陕西，既行渡江雷起东南，还献陕西图遂病
- id: guji-朱标-event-death
  title_zh: 病卒祔葬孝陵东谥懿文
  date: 1392-05-17
  year_of: 1392
  place_zh: 京师孝陵东
  description: 二十五年四月丙子卒，太祖恸哭议丧礼，八月祔葬孝陵东，赐谥懿文，后追尊孝康皇帝庙号兴宗
