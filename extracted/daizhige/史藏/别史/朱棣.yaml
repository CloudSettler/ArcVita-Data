events:
- id: guji-朱棣-event-birth
  title_zh: 降生南京光气满室
  date: 1360-05-02
  year_of: 1360
  description: 太祖第四子母孝慈高皇后初生光气五色满室经日不散太祖与后心异之独钟爱焉
- id: guji-朱棣-event-fengyan
  title_zh: 洪武三年受封燕王
  date: 1370-12-01
  year_of: 1370
  description: 太祖封建诸子以燕旧京且近北虏择可镇服者遂以封王聪睿仁孝勤学好问虚己纳善
- id: guji-朱棣-event-jiuguo
  title_zh: 洪武十三年之国北平
  date: 1380-04-11
  year_of: 1380
  description: 三月壬寅之国北平貌奇伟兼备文武度量恢廓任贤使能威震朔漠虏不敢近塞抚民节俭年谷屡丰道不拾遗
- id: guji-朱棣-event-jingnan
  title_zh: 建文元年奉天靖难起兵
  date: 1399-08-06
  year_of: 1399
  description: 建文委政黄子澄齐泰连削诸王调护卫精锐屯开平遣谢贵张昺觇察王府逼迫日急遂起兵北平号奉天靖难
- id: guji-朱棣-event-dengji
  title_zh: 登极南京改元永乐
  date: 1402-07-17
  year_of: 1402
  description: 三年靖难入京师登大宝奠安宗社君主华夷礼乐文明弘被远迩建官授爵德威广被
- id: guji-朱棣-event-death
  title_zh: 永乐二十二年崩于榆木川
  date: 1424-08-12
  year_of: 1424
  description: 亲征漠北班师至榆木川崩在位二十二年文治光昭武烈弘靖规模宏远卓冠百王
