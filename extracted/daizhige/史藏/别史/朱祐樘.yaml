  decisions:
  - date: 1475-12-01
    title_zh: 冲幼受册后深自潜晦不自炫露
    rationale: 感慕生母孝穆早崩，知万贵妃专宠之祸，韬晦以全身，静待储位巩固。
  - date: 1479-01-01
    title_zh: 九岁出阁进学专心受讲严守礼度
    rationale: 以讲学修德为立国之本，背诵不误，纠正讲官误字，祁寒盛暑不辍，涵养坚定。
- id: guji-朱祐樘-endeavor-2
  title_zh: 弘治守成理政与善终托孤
  summary: 奉遗诏三辞而即位，在位十八年郊庙尽礼，孝奉两宫，纳谏惜才，省刑慎赏，渐图厘革，临崩托付东宫守祖宗成法。
  phases:
  - key: brewing
