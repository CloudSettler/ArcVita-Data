    start_date: 1488-01-01
    highlight_event_id: guji-朱祐樘-event-enthroned
  - key: climax
    name: 久任明习博访厘弊
    labels:
      zh: 渐复旧制
    start_date: 1500-01-01
    highlight_event_id: guji-朱祐樘-event-entrust
  - key: closure
    name: 大渐召辅托孤遗诏
    labels:
      zh: 善终付托
    start_date: 1505-06-07
    highlight_event_id: guji-朱祐樘-event-entrust
  decisions:
  - date: 1487-09-22
    title_zh: 遵先帝遗诏勉从群请早正大位
    rationale: 天下不可一日无君，为安宗社慰列圣，抑哀继统，以善继述为孝。
  - date: 1505-06-07
    title_zh: 病中手授遗命择配东宫托付辅臣
    rationale: 自知不起，以守祖宗成法孝奉两宫进学修德任贤使能为训，确保国本无忧。
events:
- id: guji-朱祐樘-event-birth
  person_qid: guji-朱祐樘
  type: birth
  date: 1470-07-30
  year_of: 1470
  title_zh: 成化六年七月三日生于西宫
  description: 宪宗第三子，母孝穆纪氏有娠逊居西宫乃生，是日有雷风之异，隆准高额俨如龙形。
- id: guji-朱祐樘-event-crowned
  person_qid: guji-朱祐樘
  type: career
  date: 1475-12-01
  year_of: 1475
  title_zh: 成化十一年十一月册立为皇太子
  description: 六岁育于太皇太后宫中，会乾清宫灾宪宗命怀恩谕内阁拟名，孝穆崩后册立，诏下天下欣然称君有子，出阁进学容仪严整讲读不误。
- id: guji-朱祐樘-event-enthroned
  person_qid: guji-朱祐樘
  type: career
  date: 1487-09-22
  year_of: 1487
  title_zh: 成化二十三年奉遗诏三辞而即皇帝位
  description: 大行皇帝宾天颁遗诏，百官三奉笺劝进，皇太子再辞后勉从所请，正宝位改元弘治，时年十八。
- id: guji-朱祐樘-event-entrust
  person_qid: guji-朱祐樘
  type: career
  date: 1505-06-07
  year_of: 1505
  title_zh: 弘治十八年五月初六庚寅召阁臣托孤
  description: 上大渐御乾清宫东暖阁，自序即位始末，命书东宫长成择配举行婚礼，执刘健手嘱常常请东宫出来读书辅导做个好人，次日召皇太子面谕守祖宗成法。
- id: guji-朱祐樘-event-death
  person_qid: guji-朱祐樘
  type: death
  date: 1505-06-08
  year_of: 1505
  title_zh: 弘治十八年五月初七辛卯崩于乾清宫
  description: 午刻旋风四塞云端若有人骑龙上升而崩，遗诏皇太子厚照即位，丧礼以日易月祭用素羞，六月上尊谥建天明道诚纯中正圣文神武至仁大德敬皇帝，庙号孝宗，十月葬泰陵，掩圹有五色云见，在位十八年寿三十六。
