  dilemmas:
  - 冲幼潜晦自保与早显储位招忌之难
  - 宽仁含洪与痛革积弊复祖宗旧制之难
  - 独尊一帝一后之礼与追崇生母孝穆之恩义两尽之难
  lesson: 涵养诚笃守法度，渐图厘革而不骤，孝亲敬天任贤纳谏可致太平。
  summary_first_person: 吾为宪宗第三子，母纪氏，生于西宫而六岁始显，蒙太皇太后育养，十一月立为皇太子，早朝夕讲学修德，嗣位十有八年，敬天法祖，孝奉两宫，爱惜人才，重惜人命，欲渐复祖宗之旧，今年三十有六遘疾不起，以皇太子托付辅臣，惟愿守成法保宗社而已。
