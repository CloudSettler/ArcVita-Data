  - date: 1552-01-01
    title_zh: 风雨不辍听讲经义
    rationale: 注目敛容听受儒臣进说，以养纯王之学，韬光以待天命
  - date: 1566-12-25
    title_zh: 三辞后勉从劝进
    rationale: 以终天之恨固辞再三，群臣以宗社为重义正词恳，乃遵遗诏祗告天地宗庙社稷即位
- id: guji-朱载垕-endeavor-2
  person_qid: guji-朱载垕
  title_zh: 隆庆新政宽民靖边
  description: 即位颁大赦，复旧礼，罢斋醮，召恤言官，蠲逋赋，减织造采买，省刑慎罚，属任大臣，留心边务，海内翕然称太平
  phases:
