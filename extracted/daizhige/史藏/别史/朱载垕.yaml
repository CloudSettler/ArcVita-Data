  dilemmas:
  - title_zh: 承精核之后当宽厚还是操切
    description: 世宗明断英武之后，海内疲于纷更，务在和宁还是继续精核操切，关系天下安危
  - title_zh: 国哀在疚当固辞还是即位
    description: 皇考上宾哀痛在疚不忍即位，而宗社不可久虚，群臣三请劝进，进退两难
  lesson: 守画一戒纷更，宽厚以养民，乾刚以运权，张弛并用乃可致太平
  summary_first_person: 我是朱载垕，世宗第三子，母杜氏，嘉靖十六年诞生，周岁抓取龙旗见奇，旋册封裕王，出阁讲读，大婚居潜邸十余年，韬光养晦，亲礼文儒，备知闾阎疾苦边境安危，庄敬太子薨后继序已定，嘉靖四十五年十二月由王邸入践大位，改元隆庆，在位六年宽赋省刑，停斋醮，召用言事得罪诸臣，整边务，明黜陟，海内称为太平天子
  source_urls:
