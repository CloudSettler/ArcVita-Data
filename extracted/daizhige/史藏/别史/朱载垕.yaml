  decisions:
  - date: 1567-02-04
    title_zh: 停斋醮革方士正刑章
    rationale: 遵遗诏悉停斋醮工作，拿问妄进药物者，革真人高士名号，以清宫禁正视听
  - date: 1567-02-04
    title_zh: 蠲逋赋改折漕粮以苏民困
    rationale: 天下军民十分穷困，特免隆庆元年漕运改折及起存本折之半，蠲嘉靖四十三年以前拖欠，以沾实惠接济边用
  - date: 1567-02-04
    title_zh: 召用建言得罪诸臣
    rationale: 存者召用殁者恤录，以开言路慰人心，辅新政行画一之治
