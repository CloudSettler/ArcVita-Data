  dilemmas:
  - 久居东宫欲言宫市之弊又恐疑于收人心之嫌
  - 风疾失语欲行革新又不得不倚重王伾王叔文与宦官
  - 即位日浅身疾国忧当速建储以安社稷还是力疾亲政
  lesson: 仁孝可保其身而革弊需得其人失其制衡则善政亦酿祸
  summary_first_person: 朕为德宗长子慈孝守东宫久矣见宫市夺民五坊横暴延龄聚敛而父皇不察故每进见候颜色极言其不可及即位风疾不能言犹禁宫市罢月进放宫人召还陆贽阳城辈欲以新政慰天下然疾亟不能临朝唯早册广陵王为太子以承宗庙此朕一生之志与恨也
