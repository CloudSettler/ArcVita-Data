endeavors:
- id: guji-沈葆桢-endeavor-1
  title_zh: 福州船政创办与续造轮船固海防
  summary: 接办船政教习造船分派闽厂轮船驻防南北洋台湾澎湖以救不敷调遣力争续造兵船以利海防
  phases:
  - key: brewing
    name: 接办船政教习匠徒初成规模
    labels:
