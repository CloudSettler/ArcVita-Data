      - 船政初创
    start_date: 1867-01-01
    highlight_event_id: guji-沈葆桢-event-1873-award
  - key: breakthrough
    name: 闽厂成船分驻南北洋与台湾澎湖操防
    labels:
      zh:
      - 轮船分防
    start_date: 1873-10-03
    highlight_event_id: guji-沈葆桢-event-1874-propose
  - key: climax
    name: 会奏轮船不敷调遣恳请续造兵船获准
    labels:
      zh:
      - 续造兵船
    start_date: 1874-09-11
    highlight_event_id: guji-沈葆桢-event-1874-approval
  - key: closure
    name: 养船经费并入台防统报统支以免歧出
    labels:
      zh:
      - 饷需统筹
    start_date: 1875-01-29
    highlight_event_id: guji-沈葆桢-event-1875-wire
  decisions:
  - date: 1874-09-11
    title_zh: 会奏闽厂轮船不敷调遣应行添造
    rationale: 现成水缸机器木料俱备匠徒驾轻就熟多造一船即多收一船之效购致权操于人不如自造
  - date: 1875-01-29
    title_zh: 拟将养船经费并入台防项下统支
    rationale: 各船为台防而集仰给养船经费万分不敷若侵用船政月款则造船窒碍宜向台湾领支以免歧出
- id: guji-沈葆桢-endeavor-2
  title_zh: 钦差办理台防开山抚番筹办电线
  summary: 钦命赴台督办海防自设官办电线以便文报抚定狮头社并筹福厦电线购归官办拒外人举办
  phases:
  - key: brewing
    name: 钦差赴台驻府行馆会筹防务
    labels:
      zh:
      - 台防筹始
    start_date: 1874-06-01
    highlight_event_id: guji-沈葆桢-event-1874-propose
  - key: breakthrough
    name: 自设福州至闽江口电线专便台防文报
    labels:
      zh:
      - 官办电线
    start_date: 1874-09-13
    highlight_event_id: guji-沈葆桢-event-1874-approval
  - key: climax
    name: 筹抚狮头社并议福厦电线购归官办
    labels:
      zh:
      - 抚番筹线
    start_date: 1875-04-07
    highlight_event_id: guji-沈葆桢-event-1875-wire
  - key: closure
    name: 内调两江保举船政替人以图久远
    labels:
      zh:
      - 交代后任
    start_date: 1875-08-01
    highlight_event_id: guji-沈葆桢-event-1875-wire
  decisions:
  - date: 1874-09-13
    title_zh: 自设福州至闽江口电线不准外国举办
    rationale: 现因办理台湾紧要事件专为往来便捷均由中国官为经理费用官发各处碍难准外人开办
  - date: 1875-04-07
    title_zh: 福厦电线应购归官办并平抚狮头社
    rationale: 电线系防务咽喉必官办方能自主番社未靖则台防未固须恩威并施以靖地方而通文报
