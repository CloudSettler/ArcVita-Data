  birth_date: 1820
  death_date: 1879
  era: 清
  reign_ref: 同治至光绪
  archetype: 洋务经略型封疆大臣
  dilemmas:
  - 台洋险绝而消息不通，欲设电线自办，又虑洋人借机侵夺路权
  - 台防吃紧而饷绌兵单，欲开矿裕饷以固防，又虑创始维艰瘴疠阻道
  lesson: 台事必以通消息裕饷源为先，轮路矿务电线相辅而行方能久固海疆
  summary_first_person: 吾以钦差办台海防，历琅峤倭扰，深感台洋隔绝非电线不能通消息，非开煤采矿不能裕台饷，故奏设闽台电线并开台北煤矿，奖用洋将以练水陆，皆为固东南尾闾之计
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AD%A3%E5%8F%B0%E6%B9%BE%E6%B4%8B%E5%8A%A1%E5%8F%B2%E6%96%99.html
endeavors:
- id: guji-沈葆桢-endeavor-1
  title_zh: 钦差会筹台湾海防并奏设闽台电线
  summary: 同治十三年以钦差办台防务，会筹台湾大概，奏请由福州陆路至厦门再水路至台湾设电线以通消息，后经总理衙门议请饬办
  phases:
  - key: brewing
    name: 倭扰琅峤奉命渡台
    labels:
      zh:
      - 海防
      - 钦差
    start_date: 1874-04-01
    highlight_event_id: guji-沈葆桢-event-1
  - key: breakthrough
    name: 会筹大概奏请电线
    labels:
      zh:
      - 电线
      - 奏议
    start_date: 1874-04-29
    highlight_event_id: guji-沈葆桢-event-1
  - key: climax
    name: 奉旨迅速办理交涉
    labels:
      zh:
      - 交涉
      - 自办
    start_date: 1874-05-01
    highlight_event_id: guji-沈葆桢-event-2
  - key: closure
    name: 移交闽浙督臣续办
    labels:
      zh:
      - 移交
      - 闽台
    start_date: 1875-01-23
    highlight_event_id: guji-沈葆桢-event-2
  decisions:
  - date: 1874-04-29
    title_zh: 会筹台湾大概奏请设电线
    rationale: 台洋之险甲诸海疆，消息常通断不可无电线，拟由福州至厦门至台湾分陆水设线以便军情
  - date: 1875-01-10
    title_zh: 请奖洋将博郎等以励台防
    rationale: 倭事方兴台防吃紧，洋将教练安抚军及水师洋枪出力，宜分别加衔给星以示鼓励
- id: guji-沈葆桢-endeavor-2
  title_zh: 奏开台北煤矿并奠基台地矿务
  summary: 于办台海防任内奏请开采台北基隆煤矿，派洋匠踩勘立约购办机器，为后人叶文澜夏献纶督办煤厂及硫磺磺油樟脑茶务之先声
  phases:
  - key: brewing
    name: 踏勘台北煤苗
    labels:
      zh:
      - 矿务
      - 踏勘
    start_date: 1874-06-01
    highlight_event_id: guji-沈葆桢-event-3
  - key: breakthrough
    name: 奏请开采立约购机
    labels:
      zh:
      - 开煤
      - 购机
    start_date: 1874-12-01
    highlight_event_id: guji-沈葆桢-event-3
  - key: climax
    name: 洋匠到台机器运到
    labels:
      zh:
      - 机器
      - 洋匠
    start_date: 1876-08-24
    highlight_event_id: guji-沈葆桢-event-3
  - key: closure
    name: 煤厂垂成以裕台饷
    labels:
      zh:
      - 煤厂
      - 裕饷
    start_date: 1876-12-16
    highlight_event_id: guji-沈葆桢-event-3
  decisions:
  - date: 1874-12-01
    title_zh: 奏请开采台北煤矿
    rationale: 台利自米糖外以煤为大宗，煤兴则饷裕防固，且可杜洋人觊觎垂涎之心
  - date: 1875-06-01
    title_zh: 派洋匠踩勘购办机器
    rationale: 台山初辟精华未泄，非用机器洋法不能深取厚获，故立约购机为创始之基
events:
- id: guji-沈葆桢-event-birth
  title_zh: 出生于福建侯官
  date: 1820
  year_of: 1820
  place_zh: 福建侯官
  description: 清嘉庆二十五年出生于福建侯官沈氏，后登进士入翰林，历任船政大臣
- id: guji-沈葆桢-event-1
  title_zh: 会筹台湾大概奏设电线
  date: 1874-04-29
  year_of: 1874
  place_zh: 台湾
  description: 以钦差大臣会筹台湾大概情形，奏称台洋之险甲诸海疆，计由福州陆路至厦门由厦门水路至台湾设电线以通消息
- id: guji-沈葆桢-event-2
  title_zh: 片奏请奖洋将博郎哥嘉都布阿
  date: 1875-01-10
  year_of: 1875
  place_zh: 台湾
  description: 以倭事方兴台防吃紧，洋将博郎随潘霨教练安抚军，哥嘉管驾凌风轮驻澎湖，都布阿教习洋枪队，请分别议叙加衔
- id: guji-沈葆桢-event-3
  title_zh: 奏请开采台北基隆煤矿
  date: 1874-12-01
  year_of: 1874
  place_zh: 台北鸡笼
  description: 奏请开采台北煤矿，由总理衙门派洋匠到台踩勘立约购办机器，为八斗老寮坑开井之始
- id: guji-沈葆桢-event-death
  title_zh: 病逝于两江总督任内
  date: 1879
  year_of: 1879
  place_zh: 江宁
  description: 光绪五年病逝，台煤电线诸务由丁日昌叶文澜夏献纶等接办，遗绪启后人统筹轮路矿务之议
