endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 奉母西巡五台省方施惠
  description_zh: 乾隆十五年二月恭奉皇太后西巡五台，经畿辅入晋，戒践青苗，蠲免钱粮，赐宴随从官吏
  phases:
  - key: brewing
    name: 起銮留养
    labels:
