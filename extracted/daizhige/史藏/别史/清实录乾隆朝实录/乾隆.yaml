  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清乾隆朝
  reign_ref: 乾隆四十八年癸卯冬十月
  archetype: 守成敷文奋武帝王
  dilemmas:
  - 台湾孤悬海外民风健悍，当以严刑惩创还是以整饬吏治徐图绥靖
  - 陕北边鄙成灾徐属水潦未涸，当如何兼顾国用而加赈展赈以活贫黎
  lesson: 孤悬之地非竭力整顿难以绥辑，边鄙灾黎当有加无已赈恤，方协明刑弼教辟以止辟之义
  summary_first_person: 我是弘历，年号乾隆，乾隆四十八年冬十月，我在行在览奏台湾彰化黄璇殴死廖老一案人犯众多，知上年大加惩创之后风未稍戢，乃弃瑕录用杨廷桦以按察使衔补台湾道，许其具摺奏事，谕以三四年整饬观效，又饬富勒浑雅德时刻查察毋得诿卸，同月我念榆林绥德八州县秋禾成灾边民生计拮据，特拨地丁银四万两赈济并分别蠲缓，又展赈徐属铜山丰沛邳低洼之地五月，复嘉兰第锡黄河大堤种柳禁取土之奏，督挑济宁南北运河淤沙，以保明岁重运遄行，此皆我绥海疆恤灾黎重河防之实心也
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷1190.html
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 台湾械斗后整饬海疆吏治
  summary_zh: 因彰化械斗人犯众多，擢任杨廷桦专任台湾道并严饬督抚稽察，以三四年责成观效
  phases:
  - key: brewing
    name: 台湾民风健悍械斗频仍
    labels:
      zh:
      - 海疆治理
    start_date: 1783-11-25
    highlight_event_id: guji-乾隆-event-1
  - key: breakthrough
    name: 弃瑕录用杨廷桦专任台湾道
    labels:
      zh:
      - 驭吏任人
    start_date: 1783-11-25
    highlight_event_id: guji-乾隆-event-1
  - key: climax
    name: 传谕富勒浑雅德转饬实力整饬
    labels:
      zh:
      - 整饬吏治
    start_date: 1783-11-25
    highlight_event_id: guji-乾隆-event-1
  - key: closure
    name: 以三四年起色另加恩以观后效
    labels:
      zh:
      - 责成观效
    start_date: 1783-11-25
    highlight_event_id: guji-乾隆-event-1
  decisions:
  - date: 1783-11-25
    title_zh: 加恩杨廷桦以按察使衔补台湾道令具摺奏事
    rationale: 台湾距省遥远政务废弛已久，非得专员实心实力整饬，三四年后难有起色，故弃瑕录用以励自效
  - date: 1783-11-25
    title_zh: 谕富勒浑雅德时刻留心查察毋因有杨廷桦稍诿卸
    rationale: 孤悬之地易于聚众滋事，若督抚诿卸则再有械斗难当其罪，故须层层稽察以收绥辑之效
- id: guji-乾隆-endeavor-2
  title_zh: 陕北徐淮水旱加赈兼重河防漕运
  summary_zh: 拨银赈榆林八州县并展赈徐属四县，同时嘉准黄河种柳禁取土并督挑运河淤沙
  phases:
  - key: brewing
    name: 榆林八州县秋禾失时徐属低洼未涸
    labels:
      zh:
      - 赈恤灾黎
    start_date: 1783-11-27
    highlight_event_id: guji-乾隆-event-2
  - key: breakthrough
    name: 拨地丁银四万两解往陕北备用
    labels:
      zh:
      - 蠲缓加赈
    start_date: 1783-11-27
    highlight_event_id: guji-乾隆-event-2
  - key: climax
    name: 照山东例展赈徐属被灾较重之地五月
    labels:
      zh:
      - 展赈春麦
    start_date: 1783-11-27
    highlight_event_id: guji-乾隆-event-2
  - key: closure
    name: 准兰第锡种柳禁取土督挑运河保重运
    labels:
      zh:
      - 河防漕运
    start_date: 1783-11-26
    highlight_event_id: guji-乾隆-event-3
  decisions:
  - date: 1783-11-27
    title_zh: 榆林绥德八州县分别蠲缓并拨银米赈济
    rationale: 边民生计拮据殊堪悯恻，若俟查明请旨往返需时贫民无以糊口，故先拨后核以副轸恤边氓有加无已之意
  - date: 1783-11-26
    title_zh: 嘉准黄河大堤两傍留地种柳并申严近堤取土之禁
    rationale: 河工全恃大堤为保障，柳根草丛盘结则堤坚，近堤取土则害滋甚，兰第锡胸中有定见，故令巡抚帮同办理以重河防
events:
- id: guji-乾隆-event-birth
  type: birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生于雍亲王府
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后嗣位年号乾隆
- id: guji-乾隆-event-death
  type: death
  date: 1799-02-07
  year_of: 1799
  title_zh: 高宗崩于紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩，享年八十有九，庙号高宗，谥纯皇帝
- id: guji-乾隆-event-1
  type: career
  date: 1783-11-25
  year_of: 1783
  title_zh: 谕整饬台湾颁示杨廷桦三四年责成
  description_zh: 据雅德奏台湾彰化黄璇殴死廖老一案人犯众多，谕以台湾孤悬海外政务废弛已久，令杨廷桦在台实力整饬，富勒浑雅德时刻查察，再有械斗恐不能当其罪
- id: guji-乾隆-event-2
  type: career
  date: 1783-11-27
  year_of: 1783
  title_zh: 赈榆林八州县展赈徐属四县
  description_zh: 据毕沅奏榆林怀远葭州神木绥德米脂吴堡府谷成灾五六七八九分不等，拨地丁银四万两赈济并蠲缓钱粮，据萨载奏铜山丰沛邳低洼未涸，照山东例加恩展赈五月
- id: guji-乾隆-event-3
  type: career
  date: 1783-11-26
  year_of: 1783
  title_zh: 嘉兰第锡河堤种柳禁取土并督挑运河
  description_zh: 兰第锡奏黄河大堤两傍各留十丈种柳护堤并禁临河二十丈堤后十丈取土，朱批大慰朕怀，复谕明兴何裕城帮办，并令督挑济宁南北运河淤沙以利明岁重运北上
