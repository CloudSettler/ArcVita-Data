    highlight_event_id: guji-乾隆-event-1777-yuebing
  - key: breakthrough
    name: 祈谷南郊昭告承天
    labels:
      zh: 祈谷承天
    start_date: 1777-02-20
    highlight_event_id: guji-乾隆-event-1777-qigu
  - key: climax
    name: 敕谕阿布赉释疑定边
    labels:
      zh: 敕谕远人
    start_date: 1777-02-16
    highlight_event_id: guji-乾隆-event-1777-abulai
  - key: closure
    name: 严查喇嘛出口收束边卡
    labels:
      zh: 严边收束
    start_date: 1777-02-16
    highlight_event_id: guji-乾隆-event-1777-abulai
  decisions:
  - date: 1777-02-15
    title_zh: 御阅武楼大阅八旗火器营
    rationale: 新灭金川，外藩朝正，借大阅示武绥远，行赏如例
  - date: 1777-02-16
    title_zh: 驳回塔什罕献纳并敕谕阿布赉
    rationale: 阿布赉假献纳以假天朝威力取邻地，多疑试探，须剖晰开谕，令善保游牧结好邻邦
  - date: 1777-02-16
    title_zh: 严禁化缘喇嘛出新疆边卡
    rationale: 新疆近哈萨克布噜特及俄罗斯境，游方喇嘛易生关碍，须核查路引实力禁止
events:
- id: guji-乾隆-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日弘历生，即后之高宗纯皇帝
- id: guji-乾隆-event-1777-gansu-zhen
  title_zh: 加恩展赈甘肃被灾州县
  date: 1777-02-08
  year_of: 1777
  place_zh: 圆明园
  description: 因皋兰金县安定等处夏禾被旱，加恩各展赈一月，续报镇番中卫一体展赈，余处酌借耔种口粮
- id: guji-乾隆-event-1777-gansu-mian
  title_zh: 豁免甘肃民借积欠银两
  date: 1777-02-08
  year_of: 1777
  place_zh: 圆明园
  description: 将乾隆二十三年至三十五年民借折色未完银八十四万余两概予豁免，免其追呼，以纾积歉边黎
- id: guji-乾隆-event-1777-yuebing
  title_zh: 御阅武楼阅兵赐宴外藩
  date: 1777-02-15
  year_of: 1777
  place_zh: 阅武楼
  description: 命王公大臣及蒙古回部哈萨克金川土司从观，枪炮连环，藤牌舞进，礼成行赏，幸九洲清晏侍皇太后晚膳
- id: guji-乾隆-event-1777-abulai
  title_zh: 敕谕哈萨克阿布赉
  date: 1777-02-16
  year_of: 1777
  place_zh: 圆明园
  description: 鄂托尔齐请献塔什罕三万户，斥其侥幸觊觎，宣示一视同仁，开释屏逐之疑，令保守游牧毋构祸邻国
- id: guji-乾隆-event-1777-qigu
  title_zh: 祈谷于上帝
  date: 1777-02-20
  year_of: 1777
  place_zh: 南郊
  description: 以祈谷斋戒三日，诣南郊斋宫斋宿，亲诣行礼，幸圆明园，奉皇太后同乐园侍膳
- id: guji-乾隆-event-death
  title_zh: 驾崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日太上皇帝崩，寿八十九，谥纯皇帝，庙号高宗
