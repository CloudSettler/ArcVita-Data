endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 直鲁旱歉赈恤与雨泽核实
  summary_zh: 乾隆五十九年六月因直隶保定山东东昌武定等府麦收歉薄缺雨加恩赏借口粮截留漕米并亲查顺天保定河间天津及山东雨泽播种情形
  phases:
  - key: brewing
    name: 旱歉初现请借口粮
    labels:
      zh: 赈恤
    start_date: 1794-06-27
    highlight_event_id: guji-乾隆-event-jilu
  - key: breakthrough
    name: 加恩赏借截漕备用
    labels:
      zh: 截漕
    start_date: 1794-06-28
    highlight_event_id: guji-乾隆-event-zhenji
  - key: climax
    name: 巡幸途中核验雨泽
    labels:
      zh: 核实
    start_date: 1794-06-28
    highlight_event_id: guji-乾隆-event-yuze
  - key: closure
    name: 普得透雨酌量接济
    labels:
      zh: 收成
    start_date: 1794-07-05
    highlight_event_id: guji-乾隆-event-puyu
  decisions:
  - date: 1794-06-27
    title_zh: 加恩赏给山东五十州县贫民口粮
    rationale: 山东历城章邱等五十一州县麦收仅二分大田未种民力拮据故赏鳏寡孤独口粮余乏食者借给一月以副轸恤
  - date: 1794-07-01
    title_zh: 宽免昌平等州县革职从宽交部察议
    rationale: 该员回护原报意在称灾非讳灾若即革职恐州县转致讳饰不报故核实持平示惩
- id: guji-乾隆-endeavor-2
  title_zh: 吏工钱漕整顿
  summary_zh: 乾隆五十九年六月驻跸热河查办巴宁阿监修安远庙瓦落事严究贪黩并议京城及各省钱价过贱调剂与漕船趱运截留事宜
  phases:
  - key: brewing
    name: 热河工程瓦落败露
    labels:
      zh: 工程
    start_date: 1794-06-29
    highlight_event_id: guji-乾隆-event-baninga
  - key: breakthrough
    name: 严查监修谕查两淮
    labels:
      zh: 吏治
    start_date: 1794-06-29
    highlight_event_id: guji-乾隆-event-baninga
  - key: climax
    name: 议京省钱价调剂鼓铸
    labels:
      zh: 钱法
    start_date: 1794-07-07
    highlight_event_id: guji-乾隆-event-qianfa
  - key: closure
    name: 卫河长水漕船趱行酌截
    labels:
      zh: 漕运
    start_date: 1794-07-04
    highlight_event_id: guji-乾隆-event-caoyun
  decisions:
  - date: 1794-06-29
    title_zh: 革去巴宁阿翎褂交内务府严查并谕奇丰额查两淮贪黩
    rationale: 安远庙新竣大殿琉璃瓦脱落数十陇砸损檐层显系偷减浮冒面奏亲查之言皆虚饰故深究并清查扬州任内营私
  - date: 1794-07-07
    title_zh: 议以银满支兵饷料价减卯局钱并令各省陈调剂钱价之法
    rationale: 京城及云贵川湖广江浙钱价过贱小钱充斥商民折耗故欲使银钱流通两平杜绝私铸偷减之弊
events:
- id: guji-乾隆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: birth 出生于北京
  description_zh: 康熙五十年八月十三日生即后之高宗纯皇帝
  location_zh: 北京
- id: guji-乾隆-event-jilu
  date: 1794-06-27
  year_of: 1794
  title_zh: 谕赏直隶山东饥民口粮
  description_zh: 以保定等府麦收四分以下山东济南东昌武定临清等府麦收二分有余大田未种加恩赏给山东五十州县卫所贫民六月一月口粮余酌借一月
  location_zh: 喀喇河屯行宫
- id: guji-乾隆-event-yuze
  date: 1794-06-28
  year_of: 1794
  title_zh: 巡幸热河查丰山口雨泽不实
  description_zh: 经怀柔丰山口内外见道旁田地积水询昌平顺义怀柔州县称得雨二寸而村民称五寸深透命梁肯堂查原禀仅称一寸回护显然复命苏凌阿等赴三处查居官声名赈济侵扣据实具奏
  location_zh: 热河道中丰山口
- id: guji-乾隆-event-zhenji
  date: 1794-07-01
  year_of: 1794
  title_zh: 据梁肯堂报普得透雨截漕备用
  description_zh: 顺天保定河间天津得雨二寸至五六寸顺德广平等亦得雨请先截漕十万石存贮谕以秋禾勃发可冀有秋仍当敬慎不可满足
  location_zh: 避暑山庄
- id: guji-乾隆-event-baninga
  date: 1794-06-29
  year_of: 1794
  title_zh: 查办巴宁阿热河监修安远庙瓦落
  description_zh: 以巴宁阿叠擢侍郎总管内务府大臣赐花翎黄褂专司热河三庙换木揭瓦工初到热河值雨安远庙新竣大殿前坡琉璃瓦脱落数十陇砸损下檐革去翎褂交内务府严查并谕江苏巡抚奇丰额查其两淮盐政任内贪黩
  location_zh: 热河避暑山庄
- id: guji-乾隆-event-qianfa
  date: 1794-07-07
  year_of: 1794
  title_zh: 谕议京省钱价过贱调剂之法
  description_zh: 以京城钱价过贱议拨库帑易钱或以银满支八旗兵饷工程料价减卯局钱并钞寄谕旨令云贵四川湖广江浙等督抚查地方情形奏收买小钱停减鼓铸使银钱两平
  location_zh: 热河避暑山庄
- id: guji-乾隆-event-caoyun
  date: 1794-07-04
  year_of: 1794
  title_zh: 览卫河长水漕船趱行谕酌截留
  description_zh: 据李奉翰奏卫河长水四尺五寸重运遄进祭谢河神疑豫省河北雨泽所报不实命穆和蔺据实具奏令李奉翰速回豫工巡防伏汛除截留临清南米十四万石外与梁肯堂管干珍商酌截留
  location_zh: 热河避暑山庄
- id: guji-乾隆-event-puyu
  date: 1794-07-05
  year_of: 1794
  title_zh: 览直鲁续得透雨谕妥办夏灾
  description_zh: 据梁肯堂福宁奏直隶通省普渥山东迤东迤南调匀东昌武定济宁亦陆续得雨大田可补种谕若有未能沾足处即速查办夏灾毋讳饰毋使一夫失所
  location_zh: 热河避暑山庄
- id: guji-乾隆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: death 崩于北京
  description_zh: 嘉庆四年正月初三日崩寿八十九岁谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  location_zh: 北京
