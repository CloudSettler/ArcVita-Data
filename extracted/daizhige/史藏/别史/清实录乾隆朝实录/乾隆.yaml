events:
- id: guji-乾隆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 出生于雍亲王府
  description_zh: 康熙五十年八月十三日生即后之高宗纯皇帝
- id: guji-乾隆-event-buchu
  date: 1785-01-16
  year_of: 1785
  title_zh: 丁亥召见谕永不建储
  description_zh: 乾隆四十九年十二月丁亥召见皇子大学士军机大臣历陈理密及唐太子瑛事申明不立储命补载古今储贰金鉴
- id: guji-乾隆-event-taobing
  date: 1785-01-19
  year_of: 1785
  title_zh: 庚寅谕金川逃兵处分加恩
  description_zh: 乾隆四十九年十二月庚寅以督缉不力原罚养廉准支一半仍分年带扣并通谕实力查缉毋蹈海捕具文
- id: guji-乾隆-event-tuntian
  date: 1785-01-18
  year_of: 1785
  title_zh: 谕新疆重定屯田分数
  description_zh: 据福康安奏新疆屯田虚报分数兵力竭蹶命伊犁将军等查明需粮实收酌定分数本年不及分数者免议处
- id: guji-乾隆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description_zh: 嘉庆四年正月初三日崩寿八十九岁
