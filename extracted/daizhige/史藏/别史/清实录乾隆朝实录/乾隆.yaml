endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 审办井陉聚众抗官案并罢斥袒庇总督周元理
  phases:
  - key: brewing
    name: 井陉劣生敛钱聚众抗官殴差酿变
    labels:
      zh:
      - 吏治
      - 民变
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-jingxing
  - key: breakthrough
    name: 特派福隆安覆审查出知县短发谷价属实
    labels:
      zh:
      - 覆审
      - 得实
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-jingxing
  - key: climax
    name: 斩决枭示梁进文等并罢斥周元理司道府
    labels:
      zh:
      - 正法
      - 处分
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-jingxing
  - key: closure
    name: 通谕中外明刑弼教使家喻户晓
    labels:
      zh:
      - 通谕
      - 教化
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-jingxing
  decisions:
  - date: 1779-03
    title_zh: 特派福隆安赴正定彻底查讯不定于总督旧审
    rationale: 初派未能得实且梁绿野等供出派累，若姑容袒庇则各省效尤吏治不可问，故另派重臣定真伪以明政体官方。
  - date: 1779-03
    title_zh: 奸民劣员分案办理先重惩抗官再另参酿事之官
    rationale: 若同时并办则启刁风使奸民藉端抗官，故先将起意奸徒重加惩创，再将袒护劣员之督抚司道分别罢斥效力，以剪奸顽全善类。
- id: guji-乾隆-endeavor-2
  title_zh: 查禁悖逆诗文刊刻并筹备班禅觐祝绥服藩部
  phases:
  - key: brewing
    name: 冯王孙五经简咏狂悖不避庙讳发觉
    labels:
      zh:
      - 文教
      - 查禁
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-fengwangcun
  - key: breakthrough
    name: 严定大逆凌迟缘坐并尽缴刷印板片销毁
    labels:
      zh:
      - 正法
      - 销毁
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-fengwangcun
  - key: climax
    name: 申禁刊刻朱批奏疏并分别黄检尹嘉铨之是非
    labels:
      zh:
      - 刊刻
      - 明辨
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-fengwangcun
  - key: closure
    name: 允班禅庚子觐祝并谕陕甘晋豫备接待事宜
    labels:
      zh:
      - 藩部
      - 绥服
    start_date: 1779-03
    highlight_event_id: guji-乾隆-event-banzhan
  decisions:
  - date: 1779-03
    title_zh: 冯王孙按大逆严讯片纸不留一并解京销毁
    rationale: 该犯久在学校且有复明削清之语悖逆显然，若具文了事则人心不正，故照大逆迅速问拟以正人心伸法纪。
  - date: 1779-03
    title_zh: 允班禅前来祝寿并召陕甘晋督抚来京面谕
    rationale: 班禅远自后藏来觐事关绥服黄教，若不豫备则沿途疏失，故令留保住面商行程并令该督抚妥办以示怀柔。
events:
- id: guji-乾隆-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生，是为弘历，后即位年号乾隆。
- id: guji-乾隆-event-death
  title_zh: 驾崩于养心殿
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日崩，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝。
- id: guji-乾隆-event-jingxing
  title_zh: 审办井陉抗官案并罢斥周元理
  date: 1779-03
  year_of: 1779
  description: 直隶井陉梁进文等敛钱聚众抗官殴差，覆审得知县周尚亲短发谷价属实，将奸民分别斩决枭示，罢斥总督周元理发往军台并于隆兴寺庙工效力，革治臬司文禄等，并通谕聚众抗官必严惩。
- id: guji-乾隆-event-fengwangcun
  title_zh: 严办冯王孙悖逆诗文案
  date: 1779-03
  year_of: 1779
  description: 兴国州候选训导冯王孙所著五经简咏狂悖不避庙讳且有复明削清语，命照大逆凌迟缘坐迅速问拟，刷印各本尽行查缴销毁，并申禁刊刻朱批奏疏之陋习。
- id: guji-乾隆-event-banzhan
  title_zh: 允班禅庚子觐祝并部署沿途接待
  date: 1779-03
  year_of: 1779
  description: 允班禅额尔德尼于庚子年前来祝寿，班禅拟本年六月自藏起程驻塔尔寺，明年由青海西宁至热河，谕留保住赴后藏面商，召陕甘晋督抚来京面谕豫备事宜。
