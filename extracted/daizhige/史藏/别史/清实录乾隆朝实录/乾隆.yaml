      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆
  archetype: 勤政守成之君
  dilemmas:
  - 两江异涨迥非寻常，如何兼顾保堤泄洪与上下河民生而不专罪河臣
  - 灾区罢市闹官劣衿指使，如何既加意抚恤又严惩倡率以正人心风俗
  lesson: 敬天勤民，和衷共济，赈恤与河防并重，恩威并施以安天下
  summary_first_person: 朕即位七年，宵旰焦劳，值山东叠灾与两江异涨，降旨缓征旧欠，举行恤刑散赈，晓谕督抚河臣屏除私意和衷治水，并严惩罢市倡闹劣生，以固河防而安民生
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70173.html
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 两江异涨赈济与洪泽湖河工统筹
  description_zh: 乾隆七年上下两江被水非常年可比，统筹散赈恤刑与高堰天然坝高邮三坝启闭，协调督抚河臣和衷办理
  phases:
  - key: brewing
    name: 两江被水奏报与南苑廑心
    labels:
      zh:
      - 察灾
    start_date: 1742-09-01
    highlight_event_id: guji-乾隆-event-3
  - key: breakthrough
    name: 降旨恤刑与拣员赴赈
    labels:
      zh:
      - 恤刑
    start_date: 1742-09-03
    highlight_event_id: guji-乾隆-event-3
  - key: climax
    name: 晓谕督抚河臣和衷治水
    labels:
      zh:
      - 治河
    start_date: 1742-09-06
    highlight_event_id: guji-乾隆-event-4
  - key: closure
    name: 交议水利善后长策
    labels:
      zh:
      - 善后
    start_date: 1742-09-08
    highlight_event_id: guji-乾隆-event-4
  decisions:
  - date: 1742-09-03
    title_zh: 因灾举行恤刑减等完结
    rationale: 周礼荒政有缓刑之条，举行矜恤亦感召和气之一端，故令详阅秋审分别妥议
  - date: 1742-09-06
    title_zh: 不以水灾专罪河臣并令速报水势
    rationale: 今岁水灾乃上天垂象，河臣力小任重，若遇异涨亦难万全，督抚当谅之助之，不可各持意见妨公
  - date: 1742-09-08
    title_zh: 德沛水利条奏交大学士议奏
    rationale: 治水当长计远虑，通顺尾闾使易赴壑，束水归海之议需审高下酌通塞，故付廷议
- id: guji-乾隆-endeavor-2
  title_zh: 山东叠灾缓征与江南士风整饬
  description_zh: 针对山东历城等县叠被灾伤民力未苏，展缓旧欠带征，并严处高邮宝应淮安罢市闹官及劣生指使以儆刁风
  phases:
  - key: brewing
    name: 山东秋收丰稔查民力
    labels:
      zh:
      - 蠲缓
    start_date: 1742-09-01
    highlight_event_id: guji-乾隆-event-1
  - key: breakthrough
    name: 缓征十三县旧欠口粮籽种
    labels:
      zh:
      - 纾民
    start_date: 1742-09-01
    highlight_event_id: guji-乾隆-event-1
  - key: climax
    name: 严查高邮宝应淮安罢市
    labels:
      zh:
      - 正俗
    start_date: 1742-09-04
    highlight_event_id: guji-乾隆-event-2
  - key: closure
    name: 议处学政教官约束族人
    labels:
      zh:
      - 整饬
    start_date: 1742-09-04
    highlight_event_id: guji-乾隆-event-2
  decisions:
  - date: 1742-09-01
    title_zh: 缓征历城等十三县四五年旧欠至癸亥麦收
    rationale: 叠灾之区虽获有秋而民力未苏，新旧并纳未免拮据，故除现年及六年米豆外概缓分年完纳
  - date: 1742-09-04
    title_zh: 严处指使罢市劣生朱恺士等
    rationale: 绅衿读书明理却倡率棍徒挟制官长，为法所不容，若姑息则恶习复萌，故秉公执法以儆其余
  - date: 1742-09-04
    title_zh: 学政教官董率不严交部察议
    rationale: 自皇考整饬以来恶习渐改，江南复现劣生，学政教官所司何事，当议处为戒
events:
- id: guji-乾隆-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生，是为弘历，后即皇帝位，年号乾隆
  location_zh: 北京雍亲王府
- id: guji-乾隆-event-1
  title_zh: 谕缓山东历城等县旧欠
  date: 1742-09-01
  year_of: 1742
  description_zh: 驻跸南苑，谕将历城章邱等十三县及五县卫地应征四五年旧欠与借出籽种概缓至癸亥麦收后分年完纳，齐河等四县一例办理
  location_zh: 南苑
- id: guji-乾隆-event-2
  title_zh: 谕查高邮宝应淮安罢市闹官
  date: 1742-09-04
  year_of: 1742
  description_zh: 两江总督德沛奏高邮宝应淮安被水地方聚众罢市擡神鬨闹公堂，谕劣生朱恺士及刘师恕族人指使最为可恶，令秉公严处，学政教官一并查参
  location_zh: 南苑
- id: guji-乾隆-event-3
  title_zh: 谕两江秋审因灾恤刑
  date: 1742-09-03
  year_of: 1742
  description_zh: 以今年上下两江被水非常年可比，思周礼荒政缓刑之条，令大学士会同刑部详阅江苏安徽秋审招册减等完结
  location_zh: 南苑
- id: guji-乾隆-event-4
  title_zh: 传谕德沛完颜伟陈大受和衷办河务
  date: 1742-09-06
  year_of: 1742
  description_zh: 奉皇太后自南苑还宫，针对天然坝高邮三坝启闭之争，谕督抚与河臣屏除私意，令完颜伟速报洪湖水势，并令高斌周学健同观
  location_zh: 北京紫禁城
- id: guji-乾隆-event-death
  title_zh: 驾崩于养心殿
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩，年八十九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  location_zh: 北京紫禁城养心殿
