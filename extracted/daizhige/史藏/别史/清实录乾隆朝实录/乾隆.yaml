  - key: breakthrough
    name: 发京西行
    labels:
      zh: 奉母启行
    start_date: 1750-03-09
    highlight_event_id: guji-乾隆-event-xunxing
  - key: climax
    name: 蠲赋恤民
    labels:
      zh: 省方加恩
    start_date: 1750-03-15
    highlight_event_id: guji-乾隆-event-xunxing
  - key: closure
    name: 驻跸顶礼
    labels:
      zh: 菩萨顶赐宴
    start_date: 1750-03-22
    highlight_event_id: guji-乾隆-event-xunxing
  decisions:
  - date: 1750-03-09
    title_zh: 严饬扈从毋践踏秋麦
    rationale: 时届春融麦含滋润，令派兵看守，违者拏送参处，以重农时
  - date: 1750-03-20
    title_zh: 蠲免经过州县本年额赋十分之三
    rationale: 安营除道资民力，照木兰及前次五台旧例加恩，务令民沾实惠
- id: guji-乾隆-endeavor-2
  title_zh: 从权羁縻处置西藏噶隆之争
  description_zh: 珠尔默特车布登与弟那木扎勒构衅兴兵，忽报病故，权衡劳师远征之弊，姑予宽免，令驻藏大臣密察
  phases:
  - key: brewing
    name: 兄弟阋墙
    labels:
      zh: 藏中告变
    start_date: 1750-01-15
    highlight_event_id: guji-乾隆-event-zang
  - key: breakthrough
    name: 忽报病故
    labels:
      zh: 虚实难明
    start_date: 1750-03-10
    highlight_event_id: guji-乾隆-event-zang
  - key: climax
    name: 从权宽免
    labels:
      zh: 加恩抚恤
    start_date: 1750-03-14
    highlight_event_id: guji-乾隆-event-zang
  - key: closure
    name: 留臣密察
    labels:
      zh: 驻守观变
    start_date: 1750-03-15
    highlight_event_id: guji-乾隆-event-zang
  decisions:
  - date: 1750-03-14
    title_zh: 许那木扎勒办理兄丧并抚养兄子，宽免其罪
    rationale: 念其父颇罗鼐始终宣力，既已请罪，明知可疑亦姑置不问，免先启彼疑
  - date: 1750-03-15
    title_zh: 令傅清拉布敦暂驻藏密商妥办
    rationale: 纪山受愚失体不可倚任，令因事就事详慎办理，不轻发亦不坐失事机
events:
- id: guji-乾隆-event-birth
  title_zh: 生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三生，为雍亲王胤禛第四子，母熹妃钮祜禄氏
  place_zh: 北京雍亲王府
- id: guji-乾隆-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三崩，在位六十年，禅位后训政四年而终
  place_zh: 北京紫禁城养心殿
- id: guji-乾隆-event-xunxing
  title_zh: 奉皇太后西巡五台蠲免畿晋钱粮
  date: 1750-03-09
  year_of: 1750
  description_zh: 自京师启行，驻跸黄新庄涿州保定至五台菩萨顶，谕扈从毋践青苗，蠲直隶山西经过州县额赋十分之三，赏晋省公项银一万两办差
  place_zh: 京师至五台山
- id: guji-乾隆-event-zang
  title_zh: 降旨从权办理珠尔默特车布登身故善后
  date: 1750-03-14
  year_of: 1750
  description_zh: 据纪山奏车布登举兵后于上年十二月病故，那木扎勒请办丧抚侄并请罪，降旨念颇罗鼐旧劳宽免，令其安辑被兵人等，以傅清拉布敦暂驻藏察酌赈恤
  place_zh: 西藏阿里克及前后藏
