    labels:
      zh:
      - 金刃伤人
      - 黏签候定
    start_date: 1782-10-09
    highlight_event_id: guji-乾隆-event-jinren
  - key: climax
    name: 严责四川改驳十四起
    labels:
      zh:
      - 四川臬司
      - 改驳
    start_date: 1782-10-10
    highlight_event_id: guji-乾隆-event-chuan
  - key: closure
    name: 立谳狱权衡之训
    labels:
      zh:
      - 辟以止辟
      - 通谕中外
    start_date: 1782-10-12
    highlight_event_id: guji-乾隆-event-jinren
  decisions:
  - date: 1782-10-08
    title_zh: 传谕刑部详覆情实增多之故
    rationale: 上届合两年总数而本年仅减数十名，实为增多，须查明系生齿日繁抑改驳增多，以昭核实
  - date: 1782-10-09
    title_zh: 金刃伤人不得一概入情实
    rationale: 情直伤轻图脱无心者与逞凶叠戳不同，须核曲直与伤痕多寡，黏签候亲定，久系亦可儆惕
  - date: 1782-10-12
    title_zh: 四川臬司孙嘉乐交部严议
    rationale: 九卿改驳至十四起之多，足见办理草率，覆谳不慎之督臣亦须议处，以重秋谳大典
- id: guji-乾隆-endeavor-2
  title_zh: 河漕塘工与省方节俭
  summary: 以海塘余银供行宫黏补而不增饰，以恩豁处置沉溺漕米，以派员会勘豫东河工引河土方
  phases:
  - key: brewing
    name: 东豫引河分工查明
    labels:
      zh:
      - 引河土方
      - 豫东协办
    start_date: 1782-10-09
    highlight_event_id: guji-乾隆-event-hegong
  - key: breakthrough
    name: 海塘余银赏作行宫
    labels:
      zh:
      - 海塘
      - 行宫黏补
    start_date: 1782-10-08
    highlight_event_id: guji-乾隆-event-haitang
  - key: climax
    name: 赣帮沉船豁米打捞
    labels:
      zh:
      - 漕运
      - 豁免打捞
    start_date: 1782-10-12
    highlight_event_id: guji-乾隆-event-caochuan
  - key: closure
    name: 派员赴豫会勘申饬漕抚
    labels:
      zh:
      - 会勘河工
      - 申饬
    start_date: 1782-10-13
    highlight_event_id: guji-乾隆-event-hegong
  decisions:
  - date: 1782-10-08
    title_zh: 海塘余银留作南巡黏修不许增饰
    rationale: 上届行宫倍增点缀有违省方问俗之意，将来止许略加黏补，以节靡费而体俭德
  - date: 1782-10-12
    title_zh: 沉溺漕米豁免一半分年带还
    rationale: 暴风巨浪人力难施非丁失所致，加恩纾力，捞起湿米搭配放赈，兼顾漕政与赈务
  - date: 1782-10-13
    title_zh: 派福长安喀宁阿赴豫会勘
    rationale: 豫东引河土方归还与河尾工程均须趱紧兴挑，钦差会同督臣亲勘方能明白奏办
events:
- id: guji-乾隆-event-birth
  title_zh: 诞生
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日诞生于雍亲王府，是为弘历，后即位改元乾隆
- id: guji-乾隆-event-death
  title_zh: 驾崩
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日驾崩于养心殿，享年八十有九，庙号高宗
- id: guji-乾隆-event-qiusheng
  title_zh: 谕究秋审情实增多
  date: 1782-10-08
  year_of: 1782
  description: 行围途中览云贵川广闽秋审情实较上两年实增，传谕刑部堂官详晰据实覆奏，生齿改驳两故并陈
- id: guji-乾隆-event-jinren
  title_zh: 驳正云南金刃四案
  date: 1782-10-09
  year_of: 1782
  description: 亲核郑起黄禹鼎三保罗士朝四案，斥不权轻重一概入情实之拘泥，令未进招册再核黏签候定，通谕中外
- id: guji-乾隆-event-chuan
  title_zh: 处分四川秋谳草率
  date: 1782-10-10
  year_of: 1782
  description: 四川九卿改入情实十四起，臬司孙嘉乐交部严加议处，督臣福康安一并议处，复核宋模赵子闻二起过当
- id: guji-乾隆-event-haitang
  title_zh: 海塘余银赏作行宫黏补
  date: 1782-10-08
  year_of: 1782
  description: 续估鱼鳞石塘余银三十九万两留浙，赏作南巡黏修行宫之用，诫不得踵事增华更滋繁饰
- id: guji-乾隆-event-caochuan
  title_zh: 豁免赣帮沉溺漕米
  date: 1782-10-12
  year_of: 1782
  description: 赣州等卫十六只漕船遭风沉于南阳湖新挑河，漂没米石豁免一半，俟开运分年带还，令雇夫打捞搭配放赈
- id: guji-乾隆-event-hegong
  title_zh: 派员赴豫会勘河工
  date: 1782-10-13
  year_of: 1782
  description: 命福长安喀宁阿驰驿赴河南会同阿桂查看河工，并谕明豫东省引河土方曾否咨移之故，申饬漕督鄂宝抚臣明兴
