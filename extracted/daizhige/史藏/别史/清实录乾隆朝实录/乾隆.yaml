endeavors:
- id: guji-乾隆-endeavor-1
  person_qid: guji-乾隆
  title_zh: 畿輔江浙糧運調劑
  description_zh: 因畿輔秋收米價未平，加恩駐防兵米折色，移湖南搭運通倉米濟浙，留江西搭運米於江蘇水次，以裒多益寡。
  phases:
  - key: brewing
    name: 預籌通倉
    labels:
      zh: 預備
    start_date: 1759-07-01
    highlight_event_id: guji-乾隆-event-1759-bingmi
  - key: breakthrough
    name: 加恩兵米
    labels:
      zh: 體恤
    start_date: 1759-12-07
    highlight_event_id: guji-乾隆-event-1759-bingmi
  - key: climax
    name: 兌運濟浙
    labels:
      zh: 調劑
    start_date: 1759-12-09
    highlight_event_id: guji-乾隆-event-1759-diaoyun
  - key: closure
    name: 留米備撥
    labels:
      zh: 收束
    start_date: 1759-12-10
    highlight_event_id: guji-乾隆-event-1759-diaoyun
  decisions:
  - date: 1759-12-07
    title_zh: 加恩霸州等十處兵米折色
    rationale: 明春青黃不接，兵丁糴買拮据，每石加銀三錢以示體恤。
  - date: 1759-12-09
    title_zh: 以楚省搭運米兌交浙省運回備用
    rationale: 近畿有收無需用，浙有偏災需接濟，省往來購運之煩，不致踊貴。
- id: guji-乾隆-endeavor-2
  person_qid: guji-乾隆
  title_zh: 西域屯田安邊經理
  description_zh: 凱旋後經理伊犁屯田，議辟展托克三烏嚕木齊收穫建倉，籌糧運路線，安插多倫回眾，整台站以待使臣。
  phases:
  - key: brewing
    name: 屯田收穫具奏
    labels:
      zh: 墾殖
    start_date: 1759-12-10
    highlight_event_id: guji-乾隆-event-1759-tuntian
  - key: breakthrough
    name: 建倉築堡積貯
    labels:
      zh: 積貯
    start_date: 1759-12-11
    highlight_event_id: guji-乾隆-event-1759-tuntian
  - key: climax
    name: 會議伊犁驻兵屯田
    labels:
      zh: 經略
    start_date: 1759-12-12
    highlight_event_id: guji-乾隆-event-1759-tuntian
  - key: closure
    name: 整飭台站迎使
    labels:
      zh: 觀瞻
    start_date: 1759-12-09
    highlight_event_id: guji-乾隆-event-1759-tuntian
  decisions:
  - date: 1759-12-12
    title_zh: 命會商伊犁屯田不急多派官兵回眾
    rationale: 來年次第辦理，不必一時安插，糧運當由正路會商妥議。
  - date: 1759-12-09
    title_zh: 飭哈密以外整備台站馬匹
    rationale: 巴達克山霍罕使臣入覲，整理妥協以壯觀瞻而速郵傳。
