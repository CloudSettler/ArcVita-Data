  - key: breakthrough
    name: 豁免鎮府處分並令速赴天津
    labels:
      zh: 寬免督責
    start_date: 1793-07-08
    highlight_event_id: guji-乾隆-event-yingshi-mianyi
  - key: climax
    name: 諭知探船去留並飭津冀接應
    labels:
      zh: 懷柔曉諭
    start_date: 1793-07-14
    highlight_event_id: guji-乾隆-event-yingshi-zhaoyu
  - key: closure
    name: 定熱河一體宴賚之禮
    labels:
      zh: 禮宴遠人
    start_date: 1793-07-14
    highlight_event_id: guji-乾隆-event-yingshi-rehe
  decisions:
  - date: 1793-07-08
    title_zh: 免定海鎮總兵馬瑀等察議
    rationale: 以其巡哨留心迅速咨報故寬其前次不待咨覆遽聽開行之咎以勵海防
  - date: 1793-07-14
    title_zh: 命梁肯堂徵瑞迎護貢使赴津並曉諭探船
    rationale: 因海洋風順貢船已北上須換撥小船轉運貢物又須安探船夷官之心故詳晰曉諭聽其去留以副懷柔
- id: guji-乾隆-endeavor-2
  title_zh: 核銷廓爾喀軍需並定藏務善後
  summary_zh: 廓爾喀之役道險雪深運送維艱朕念將士勞苦特准烏拉馬價等項照請全銷嗣後不為例並獎和琳督辦之功
  phases:
  - key: brewing
    name: 孫士毅等會奏請銷烏拉馬價
    labels:
      zh: 會奏請銷
    start_date: 1793-07-12
    highlight_event_id: guji-乾隆-event-kuoerka-baoxiao
  - key: breakthrough
    name: 格外加恩准其全數報銷
    labels:
      zh: 加恩准銷
    start_date: 1793-07-12
    highlight_event_id: guji-乾隆-event-kuoerka-baoxiao
  - key: climax
    name: 加賞和琳世職以勵督辦
    labels:
      zh: 獎勵督辦
    start_date: 1793-07-11
    highlight_event_id: guji-乾隆-event-helin-shang
  - key: closure
    name: 命孫士毅會同惠齡稽核東路銷算
    labels:
      zh: 稽核東路
    start_date: 1793-07-12
    highlight_event_id: guji-乾隆-event-kuoerka-jihe
  decisions:
  - date: 1793-07-12
    title_zh: 准廓爾喀軍需照請報銷且嗣後不為例
    rationale: 因藏道險遠迥異金川且福康安孫士毅等皆親信大臣無虛浮之理故格外加恩以恤艱勞而防援例
  - date: 1793-07-11
    title_zh: 賞和琳世襲雲騎尉令子承襲
    rationale: 以和琳鼓舞唐古忒雇覓烏拉親身催趲始得軍糧接續故加恩世職以示獎勵
events:
- id: guji-乾隆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生於圓明園
  description_zh: 康熙五十年八月十三日生為雍親王第四子後承大統年號乾隆
- id: guji-乾隆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩於養心殿
  description_zh: 嘉慶四年正月初三日崩壽八十有九葬裕陵諡純皇帝
- id: guji-乾隆-event-yingshi-dinghai
  date: 1793-07-05
  year_of: 1793
  title_zh: 英咭唎貢船抵定海
  description_zh: 五月二十七日夷船自南駛至定海內洋總兵馬瑀迎詢知為進貢船隻即咨報巡撫長麟
- id: guji-乾隆-event-yingshi-mianyi
  date: 1793-07-08
  year_of: 1793
  title_zh: 免馬瑀克什納察議
  description_zh: 以該鎮巡哨留心探詢明確迅速咨報尚屬留心特免其前次遽聽探船開行之察議
- id: guji-乾隆-event-yingshi-zhaoyu
  date: 1793-07-14
  year_of: 1793
  title_zh: 諭令津冀迎護並曉諭探船
  description_zh: 命梁肯堂徵瑞俟貢使抵津妥為應付護送並飛飭沿海曉諭探船夷官聽其回國或偕赴天津
- id: guji-乾隆-event-yingshi-rehe
  date: 1793-07-14
  year_of: 1793
  title_zh: 定熱河宴賚貢使之禮
  description_zh: 以貢使至熱河已在七月二十以外恰值演劇之際命與蒙古王公緬甸等使一體宴賚
- id: guji-乾隆-event-helin-shang
  date: 1793-07-11
  year_of: 1793
  title_zh: 賞和琳世襲雲騎尉
  description_zh: 以和琳督辦軍務雇覓烏拉催趲糧饷軍器接續運到奮勉妥協加恩給世職令子良輔承襲
- id: guji-乾隆-event-kuoerka-baoxiao
  date: 1793-07-12
  year_of: 1793
  title_zh: 准銷廓爾喀軍需
  description_zh: 孫士毅等奏烏拉加給回空守候牽夫口糧馬價等項因道險價昂請准銷特照所請准其報銷嗣後不為例
- id: guji-乾隆-event-kuoerka-jihe
  date: 1793-07-12
  year_of: 1793
  title_zh: 命會核東路銷算
  description_zh: 以察木多迤東軍需皆孫士毅經理命其會同惠齡挨站覆查詳晰稽核俟大局明楚再回京供職
