  title_zh: 春泽加赈甘肃蠲免积欠
  summary_zh: 乾隆四十二年正月因甘肃夏秋被旱，展赈皋兰等处一月，并豁免乾隆二十三年至三十五年民借未完银八十四万余两，以纾边黎拮据
  phases:
