    title_zh: 以盻雨未得降旨省刑查洋盜濫殺
    rationale: 恐督撫為升擢充數購求頂凶或因仇誣指部臣無由覆核致有冤屈干和故須反躬省政
  - date: 1792-06-01
    title_zh: 定真正首盜即正夥黨把風接贓仍按常例
    rationale: 黃泳林劫殺十二命者重典肅紀快人心瞿套兒竊賊越獄者祇應入情實故須分別情真罪當不得有意從嚴株連
- id: guji-乾隆-endeavor-2
