endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 整饬镇远府关税
  summary: 因苏墧侵肥案后归官试收驳裴宗锡添设税口之请以安商民
  phases:
  - key: brewing
    name: 苏墧侵税案发归官试收
    labels:
      zh: 清厘税课
    start_date: 1776-01-01
    highlight_event_id: guji-乾隆-event-1
  - key: breakthrough
    name: 裴宗锡以不敷请添税口
    labels:
      zh: 据实核驳
    start_date: 1776-11-01
    highlight_event_id: guji-乾隆-event-1
  - key: climax
    name: 户部驳议交部严加议处
    labels:
      zh: 严饬督抚
    start_date: 1776-12-07
    highlight_event_id: guji-乾隆-event-1
  - key: closure
    name: 裴宗锡自陈荒唐姑宽儆后
    labels:
      zh: 宽严得中
    start_date: 1776-12-10
    highlight_event_id: guji-乾隆-event-1
  decisions:
  - date: 1776-12-07
    title_zh: 驳添设镇远税口严议裴宗锡
    rationale: 苏墧浮收尚有多余归公反称不足必无是理添口必苦累商民故交部严处
  - date: 1776-12-10
    title_zh: 敕裴宗锡明白回奏后姑宽
    rationale: 念其平日认真偶一荒唐令其按月通年汇核以定章程不再创增
- id: guji-乾隆-endeavor-2
  title_zh: 预定御名避讳永法
  summary: 以永绵常用难避改后嗣之名为颙旻以便天下臣民
  phases:
  - key: brewing
    name: 御极初定缺笔存义之例
    labels:
      zh: 敬存其义
    start_date: 1736-01-01
    highlight_event_id: guji-乾隆-event-2
  - key: breakthrough
    name: 宗支蕃衍永绵取名渐多
    labels:
      zh: 体察民便
    start_date: 1776-11-01
    highlight_event_id: guji-乾隆-event-2
  - key: climax
    name: 庚辰谕改永为颙绵为旻
    labels:
      zh: 垂法后世
    start_date: 1776-12-22
    highlight_event_id: guji-乾隆-event-2
  - key: closure
    name: 交阁封存令阿哥恭贮敬识
    labels:
      zh: 敬谨存记
    start_date: 1776-12-23
    highlight_event_id: guji-乾隆-event-2
  decisions:
  - date: 1776-12-22
    title_zh: 改后嗣永绵为颙旻免臣民改避
    rationale: 与其改众人之名以避一人之名莫若改一人之名使众无可避且颙旻非常用缺笔亦易
  - date: 1776-12-23
    title_zh: 谕军机存记归政后再宣示
    rationale: 恐后來臣工妄请改避无可适从故豫示折衷封存内阁以垂法守
events:
- id: guji-乾隆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 出生于雍亲王府
  description: 康熙五十年八月十三日生为雍正帝第四子后即位年号乾隆
- id: guji-乾隆-event-1
  date: 1776-12-07
  year_of: 1776
  title_zh: 驳裴宗锡添设镇远税口
  description: 乾隆四十一年十一月丁丑户部驳贵州巡抚请添税口之咨朕依议将裴宗锡交部严加议处并五百里传谕令明白回奏
- id: guji-乾隆-event-2
  date: 1776-12-22
  year_of: 1776
  title_zh: 颁定御名避讳折衷之法
  description: 乾隆四十一年十一月庚辰谕以将来继体当以永作颙绵作旻清文仍旧奕字以下推此意遵行并令军机存记封存
- id: guji-乾隆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 归政后为太上皇帝嘉庆四年正月初三日崩寿八十有九
