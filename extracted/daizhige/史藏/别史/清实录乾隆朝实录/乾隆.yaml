person:
  qid: guji-乾隆
  name_zh: 乾隆
  names:
    zh: 乾隆
    en: Qianlong Emperor
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆四十七年
  archetype: 勤政矜慎之圣君
  dilemmas:
  - 辟以止辟与矜慎庶狱之间如何权衡宽严不至失入失出
  - 金刃伤人一概入情实与核情论曲直伤痕多寡之间如何避免拘泥
  - 南巡省方问俗与行宫增饰糜费之间如何以俭率下
  lesson: 谳狱须准酌情理无枉无纵，河漕塘工须核实经理，省方行宫止许黏补不许增华，方能刑期无刑而民力得纾
  summary_first_person: 朕于乾隆四十七年九月行围塞外，驻安巴究和罗昂阿诸营，览秋审各省情实增多，深忧生齿日繁而问刑或涉拘泥，特谕刑部九卿详覆增多之故，亲核云南郑起黄禹鼎诸金刃案，四川宋模赵子闻诸案，斥深文周内之失，令未进招册再核黏签候定，并将草率之臬司孙嘉乐交部严议。又以浙省海塘余银赏作南巡行宫黏补，严诫不得踵事增华。闻赣州卫漕船十六只遭风沉于南阳湖新挑河一带，特恩豁米石一半，分年带还，令打捞搭配放赈，严饬漕督鄂宝抚臣明兴等失察，并派福长安喀宁阿赴豫会同阿桂查勘河工
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71164.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71164.md
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 秋审矜慎与辟以止辟
  summary: 针对云贵川广闽秋审情实遽增，亲加详核，纠金刃一概入情实之拘泥，立皋陶尧舜宥杀权衡之论
  phases:
  - key: brewing
    name: 稽核情实增多
    labels:
