  description_zh: 乾隆二十四年十一月己巳至前後，定長奏屯田收穫建倉，命楊應琚會同舒赫德定長講求互調耕作，會商伊犁駐兵屯田糧運正路。
  raw: 乾隆二十四年十一月己巳
