  reign_ref: 乾隆
  archetype: 帝王
  dilemmas:
  - 小钱呈缴若不给价则愚民观望藏匿，若给价则恐奸民销大钱私铸图利
  - 边疆内地交涉若偏护内地则寒外藩之心，若秉公则须重惩命官以慰众心
  - 江淮积欠若概令次年带徵则逢丰仍困催科，若分年宽免则须防吏胥影射侵渔
  lesson: 抚民须使小民不致赔累，抚藩须秉公断不可稍存偏护，施恩须密访严查使实惠均沾
  summary_first_person: 朕君临天下五十六年，于辛亥秋七月，厘小钱收兑鼓铸，蠲缓江淮积欠，督全漕早抵早卸，秉公惩守备苏世义以慰回众，奖永保不护内地以明大方，谕晋省盐课筹议务使商民交便，海塘新沙增长则虔祭酬神，雨泽田禾则廑念奏报，皆欲使闾阎饶裕边陲宁谧
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71382.html
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 厘定小钱收铸蠲缓积欠督漕
  description_zh: 降旨小钱呈缴酌给银两并专责额设匠役鼓铸，分四年带徵江淮积欠并宽免一半，奖全漕早抵早卸议叙出力员弁
  phases:
  - key: brewing
    name: 小钱例禁收缴酝酿
