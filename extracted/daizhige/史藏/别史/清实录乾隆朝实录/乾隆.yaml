  - 宽严得中以整饬吏治之难
  - 加恩赈恤与节制国用之衡
  - 一视同仁以绥服藩部之道
  lesson: 敬天勤民宽严相济加恩而不滥施恩而不私方能永固人心
  summary_first_person: 朕即位四十有六年祗膺天命勤求治理当辛丑春正月朝正受贺祈谷南郊之余念直隶豫皖苏甘等省水旱偏灾青黄不接屡降旨加赈展赈借粜耔种务使穷檐均沾又念喀尔喀等旧属功勋一体议给世袭罔替以昭一视又饬海塘石柴之议盐课积欠之赔漕兑督催之期与山东吏治宽严之度皆欲实心经理不事虚文朕以天下为家惟愿灾黎安全藩服辑宁吏治清明以仰副上天庇佑之恩
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷1122.md
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 辛丑春正月加赈抚绥各省灾区
  description: 乾隆四十六年正月因直隶河南江苏安徽甘肃等省上年水旱成灾正赈将毕青黄不接连降谕旨展赈借粜接济春耕
  phases:
  - key: brewing
    name: 查灾定赈之酝酿
    labels:
      zh:
      - 水旱勘报
      - 正赈将毕
    start_date: 1781-01-26
    highlight_event_id: guji-乾隆-event-relief-zhili
  - key: breakthrough
    name: 连诏加赈之决断
    labels:
      zh:
      - 加赈展赈
      - 轸恤穷黎
    start_date: 1781-01-27
    highlight_event_id: guji-乾隆-event-relief-zhili
  - key: climax
    name: 分省施恩之推行
    labels:
      zh:
      - 分省区别
      - 借粜兼施
    start_date: 1781-01-28
    highlight_event_id: guji-乾隆-event-relief-henan
  - key: closure
    name: 督饬妥办之收束
    labels:
      zh:
      - 董率属员
      - 春耕接济
    start_date: 1781-01-29
    highlight_event_id: guji-乾隆-event-relief-henan
  decisions:
  - date: 1781-01-26
    title_zh: 命直隶二十州县加赈一月
    rationale: 东作方兴青黄不接截漕拨米拨银之后再加一月以资糊口并令无庸加赈处酌量借粜
  - date: 1781-01-26
    title_zh: 命河南考城商邱等县按灾分加赈两月一月
    rationale: 连年被水芝麻庄漫口之后正赈外按十分九分八分灾之极次贫分别加赈以敷春泽
  - date: 1781-01-27
    title_zh: 命甘肃皋兰等九州县展赈一月江苏安徽灾州县加赈一月
    rationale: 夏禾被灾较重与郭家渡黄水漫溢黄淮交涨之后开春民食拮据须借给耔种口粮以劝春耕
- id: guji-乾隆-endeavor-2
  title_zh: 厘定藩部世袭与整饬塘工盐务吏治
  description: 乾隆四十六年春谕定喀尔喀青海杜尔伯特等王公世袭罔替并饬浙江海塘柴石之勘盐课积欠之赔漕运督催与山东宽严之戒
  phases:
  - key: brewing
    name: 内外扎萨克异同之察
    labels:
      zh:
      - 蒙古旧属
      - 世袭减削
    start_date: 1781-01-29
    highlight_event_id: guji-乾隆-event-mongol
  - key: breakthrough
    name: 一体给与世袭之诏
    labels:
      zh:
      - 一视同仁
      - 延赏子孙
    start_date: 1781-01-30
    highlight_event_id: guji-乾隆-event-mongol
  - key: climax
    name: 塘工盐漕弊端之核
    labels:
      zh:
      - 海塘柴石
      - 盐课积欠
    start_date: 1781-02-02
    highlight_event_id: guji-乾隆-event-seawall
  - key: closure
    name: 宽严适中之申饬
    labels:
      zh:
      - 吏治宽严
      - 警惕改悔
    start_date: 1781-02-03
    highlight_event_id: guji-乾隆-event-seawall
  decisions:
  - date: 1781-01-30
    title_zh: 命军机会同理藩院清查喀尔喀等封爵原委议给世袭罔替
    rationale: 内扎萨克皆世袭罔替喀尔喀投诚百年亦旧属不宜久而减削当一体办理以副抚育旧属之心
  - date: 1781-02-02
    title_zh: 命阿桂履勘海塘柴石坦水并查办差费船只盐课著赔
    rationale: 富勒浑李质颖所奏石塘外坦水柴塘岁修互异盐课旧欠摊扣现任不平须秉公查核分别著赔以归核实
  - date: 1781-02-03
    title_zh: 传谕国泰知所警惕宽严适中
    rationale: 据于易简面询国泰驭下过严致属员畏惧虽无别项劣迹然过犹不及须痛加改悔方能长受国恩
events:
- id: guji-乾隆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于北京雍亲王府
  description: 康熙五十年八月十三日雍亲王胤禛第四子生母熹贵妃钮祜禄氏后即帝位年号乾隆
- id: guji-乾隆-event-relief-zhili
  date: 1781-01-26
  year_of: 1781
  title_zh: 春正月谕直隶加赈展赈
  description: 乾隆四十六年正月以霸州保定文安等二十州县低洼被淹正赈后加赈一月余令察看借粜以济青黄不接
- id: guji-乾隆-event-relief-henan
  date: 1781-01-26
  year_of: 1781
  title_zh: 谕河南江苏安徽甘肃分灾加赈
  description: 以考城商邱睢宁泗州皋兰等处水旱成灾按十分九分八分之极次贫分别加赈两月一月并借给耔种口粮
- id: guji-乾隆-event-mongol
  date: 1781-01-30
  year_of: 1781
  title_zh: 谕定喀尔喀等一体世袭罔替
  description: 以内扎萨克皆世袭罔替喀尔喀青海杜尔伯特土尔扈特等亦当一体清查首先投诚著有军功晋封者给与世袭罔替并给汗爵册诰
- id: guji-乾隆-event-seawall
  date: 1781-02-02
  year_of: 1781
  title_zh: 谕查浙江海塘盐课漕兑并饬山东吏治
  description: 命阿桂公同履勘石塘柴塘坦水之孰是核实差费船只商捐盐课分别裴宗锡图思德等著赔定漕船督催新例并传谕国泰宽严适中
- id: guji-乾隆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于北京紫禁城养心殿
  description: 嘉庆四年正月初三日太上皇帝崩年八十有九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝庙号高宗葬裕陵
