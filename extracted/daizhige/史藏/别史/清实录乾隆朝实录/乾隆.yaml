  decisions:
  - date: 1777-02-08
    title_zh: 加恩展赈皋兰等八处及镇番中卫一月
    rationale: 春正赈毕青黄不接，边省积歉，轸恤边氓，用敷春泽
  - date: 1777-02-08
    title_zh: 豁免甘肃民借折色未完银八十四万余两
    rationale: 新旧并征输将拮据，乘春布泽，俾免追呼，共享升平
- id: guji-乾隆-endeavor-2
  title_zh: 阅武祈谷绥抚哈萨克
  summary_zh: 正月御阅武楼大阅，祈谷南郊，同时驳回阿布赉献纳塔什罕之请，敕谕开释其疑惧，严防化缘喇嘛出边，安定新疆边防
  phases:
  - key: brewing
    name: 紫光赐宴阅武酝酿声威
    labels:
