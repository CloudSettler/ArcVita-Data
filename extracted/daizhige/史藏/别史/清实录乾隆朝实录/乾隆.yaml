    title_zh: 准偏師攻聶拉木大兵由濟咙直搗陽布
    rationale: 賊據要隘抵死抗拒非勍敵偏師牽制可使顧此失彼望風膽落故鼓勇先登一舉集事
  - date: 1792-06-02
    title_zh: 命惠齡專辦濟咙以外糧運不必隨軍前進
    rationale: 軍行糧隨裹帶不過一月枵腹則眾心觀望和琳鄂輝祇能辦濟咙以內故用惠齡所長呼應轉輸將來轉輸之功與戰勝無異
