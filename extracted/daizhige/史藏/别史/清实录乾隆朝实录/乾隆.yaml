  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆
  archetype: 明刑弼教的整饬之君
  dilemmas:
  - 抚绥良善与严惩聚众抗官之间如何两全而不启刁风
  - 怜惜年老总督与整顿吏治废法姑容之间如何取舍
  lesson: 爱民必先明法，抚绥良善则必剪除奸顽，整顿吏治则必不徇私姑容，方能辟以止辟而风淳俗厚。
  summary_first_person: 朕临御以来一秉大公至正，惠爱良善而严惩纠众抗官，怜惜老臣而不能废法姑容，查禁悖逆诗文以正人心，筹备班禅觐祝以绥藩部，皆为明罚敕法使黎元安享盈宁。
  source_urls:
