  dilemmas:
  - 西藏遥远虚实难明，兴师问罪耗费无益与姑且从权羁縻之间的权衡
  - 巡幸省方以慰民心与安营除道劳民践苗之间的兼顾
  lesson: 因事就事，详慎而不豫设成见，远可安边陲，近可恤民生
  summary_first_person: 朕于十五年二月恭奉皇太后西巡五台，所过戒践麦苗，蠲免额赋，及闻藏中噶隆兄弟阋墙，车布登忽故，朕权其轻重，姑从宽免，留大臣密察，以图安静
