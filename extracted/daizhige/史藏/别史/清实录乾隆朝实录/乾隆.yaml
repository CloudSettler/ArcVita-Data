  decisions:
  - date: 1791-08-02
    title_zh: 令缴小钱多者酌给银两并毋另募人夫
    rationale: 恐愚民观望藏匿复行使，又恐新募人夫学成出局私铸，故酌给以劝缴并专责额设炉户砂丁
  - date: 1791-08-07
    title_zh: 江淮积欠分四年带徵每年宽免一半
    rationale: 闵鹗元笼统概令次年开徵致逢丰仍困催科，故分年纾力加恩宽免并刊刻誊黄防吏侵渔
- id: guji-乾隆-endeavor-2
  title_zh: 秉公抚驭边疆慰服外藩
  description_zh: 重惩守备苏世义袒护殴辱伯克以慰回众，奖永保不护偷马贼并奖哈萨克诚笃，准阿奇木伯克设清文学校并赏缎，奖缅甸王资送内地人民
  phases:
  - key: brewing
    name: 回疆内地交涉积弊
    labels:
      zh:
      - 酝酿
      - 边情
    start_date: 1791-08-02
    highlight_event_id: guji-乾隆-event-huijiang
  - key: breakthrough
    name: 惩苏世义奖秀林秉公
    labels:
      zh:
      - 突破
      - 惩护
    start_date: 1791-08-02
    highlight_event_id: guji-乾隆-event-huijiang
  - key: climax
    name: 正法窃马贼奖哈萨克
    labels:
      zh:
      - 高潮
      - 怀柔
    start_date: 1791-08-05
    highlight_event_id: guji-乾隆-event-huijiang
  - key: closure
    name: 准设清文学奖缅甸王
    labels:
      zh:
      - 收束
      - 外藩
    start_date: 1791-08-11
    highlight_event_id: guji-乾隆-event-huijiang
  decisions:
  - date: 1791-08-02
    title_zh: 将苏世义革职重责枷号示众通谕回疆
    rationale: 向来驻劄大臣多袒护内地民人必致寒心，非抚恤外藩之意，故从重办理通行晓谕断不许偏护
  - date: 1791-08-05
    title_zh: 正法窃哈萨克马贼并奖图伯特记名富桑阿
    rationale: 新疆大臣往往偏护内地之人，永保秉公眼同正法晓谕杭和卓，外夷求息事诚笃，故示大方并加恩奖赏
events:
- id: guji-乾隆-event-birth
  title_zh: 乾隆诞生
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生于雍亲王府，为雍正帝第四子弘历
  location_zh: 北京雍亲王府
- id: guji-乾隆-event-death
  title_zh: 乾隆驾崩
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩于紫禁城养心殿，享年八十九岁
  location_zh: 北京紫禁城
- id: guji-乾隆-event-xiaoqian
  title_zh: 谕鄂辉小钱酌给银两专匠鼓铸
  date: 1791-08-02
  year_of: 1791
  description_zh: 因鄂辉请立限收禁小钱免罪不给价，续降谕旨令缴多者按觔两酌给银两，并仿其议专责额设炉户砂丁鼓铸毋另募人夫
  location_zh: 北京紫禁城
- id: guji-乾隆-event-jianghuai
  title_zh: 蠲缓江淮五府州积欠
  date: 1791-08-07
  year_of: 1791
  description_zh: 据长麟奏将四十八年至五十四年积欠银八十一万余两米麦豆十七万余石分四年带徵每年宽免一半，当年拖欠本年开徵者亦宽免一半
  location_zh: 北京紫禁城
- id: guji-乾隆-event-huijiang
  title_zh: 惩苏世义慰回众奖永保怀远
  date: 1791-08-02
  year_of: 1791
  description_zh: 据秀林奏守备苏世义袒护余丁殴辱伯克，将其革职重责四十枷号三月通谕回疆，又奖永保正法窃哈萨克马贼不偏护内地
  location_zh: 北京紫禁城
- id: guji-乾隆-event-quancao
  title_zh: 奖全漕早抵早卸议叙
  date: 1791-08-11
  year_of: 1791
  description_zh: 南粮全漕六月三十日抵通七月初九日起卸完竣较上年早十七日，将总漕巡漕仓场侍郎坐粮厅及押运催漕员弁交部议叙
  location_zh: 北京紫禁城
