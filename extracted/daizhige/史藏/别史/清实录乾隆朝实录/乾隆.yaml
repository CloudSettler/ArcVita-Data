  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆
  archetype: 乾刚独断的开拓之君
  dilemmas:
  - 廷臣狃于久安畏葸持重与乘准噶尔内乱机不可失之间的决断之难
  - 满洲旧俗尚朴实骑射与近日薰染汉习唱和结社之间的整饬之难
  lesson: 揆情度势乘时会决策，不徇浮论不以持重文退缩，方能迅奏肤功底定遐荒
  summary_first_person: 朕承皇祖皇考未竟之绪，纳车凌等内附，力排众议两路兴师，不及半载抚定伊犁，加封将士告祭陵庙，惟感上苍福佑列祖贻庥，与廷臣益加儆勖
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 两路兴师平定准噶尔抚定伊犁
  description: 因准噶尔篡夺相寻人心瓦解，纳阿睦尔撒纳等内附为前驱，排众议进兵，直抵伊犁抚定全部并加封酬庸
  phases:
  - key: brewing
    name: 热河召见内附台吉筹谋进兵
    labels:
      zh: 谋定两路
    start_date: 1754-08-01
    highlight_event_id: guji-乾隆-event-ili-jie
  - key: breakthrough
    name: 大兵直抵伊犁沿途欢迎耕牧如常
    labels:
      zh: 直抵伊犁
    start_date: 1755-05-18
    highlight_event_id: guji-乾隆-event-ili-jie
  - key: climax
    name: 抚定贼巢加封将士告捷中外
    labels:
      zh: 凯捷加封
    start_date: 1755-05-19
    highlight_event_id: guji-乾隆-event-ili-feng
  - key: closure
    name: 告祭天地陵寝议加徽号纂方略
    labels:
      zh: 礼成勒石
    start_date: 1755-05-20
    highlight_event_id: guji-乾隆-event-ili-feng
  decisions:
  - date: 1754-10-01
    title_zh: 协大学士傅恒赞画断在必行
    rationale: 准噶尔一日不定来归日益众非得其地无以处之，机不容失不徇浮论
  - date: 1755-05-19
    title_zh: 不举祃牙推毂而迅赏亲王公爵双俸
    rationale: 师行未及半载无血刃之劳，宜速酬庸以劝奋勉并示乾断家法
- id: guji-乾隆-endeavor-2
  title_zh: 正鄂昌党逆案并禁满洲汉习
  description: 因广西巡抚鄂昌与胡中藻唱和怨望，廷鞫赐自尽，史贻直休致，通行晓谕禁满洲攻汉文较同年
  phases:
  - key: brewing
    name: 查获塞上吟诗稿书札唱和悖逆
    labels:
      zh: 察觉党逆
    start_date: 1755-05-10
    highlight_event_id: guji-乾隆-event-echang
  - key: breakthrough
    name: 廷鞫鄂昌俯首并鞫史贻直请托
    labels:
      zh: 廷鞫明常
    start_date: 1755-05-15
    highlight_event_id: guji-乾隆-event-echang
  - key: climax
    name: 宽赐鄂昌自尽史贻直原品休致
    labels:
      zh: 明正官常
    start_date: 1755-05-16
    highlight_event_id: guji-乾隆-event-echang
  - key: closure
    name: 通谕八旗以清语骑射为务禁唱和
    labels:
      zh: 整饬旗风
    start_date: 1755-05-17
    highlight_event_id: guji-乾隆-event-manzhou
  decisions:
  - date: 1755-05-16
    title_zh: 鄂昌本应肆市宽赐自尽
    rationale: 负恩党逆丧心已极，念其一一供认并发明史贻直书词以明官常故从宽
  - date: 1755-05-16
    title_zh: 满洲须以清语骑射为务
    rationale: 弃旧业攻汉文未造堂奥反为窃笑，且效汉人呼伯父较同年卑鄙须痛惩
events:
- id: guji-乾隆-event-birth
  type: birth
  title_zh: 弘历生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  raw: 康熙五十年八月十三日
  place_zh: 北京
  description: 圣祖皇考筹办准噶尔未竟之绪时，弘历降生，后嗣大统
- id: guji-乾隆-event-ili-jie
  type: career
  title_zh: 西师大捷克定伊犁奏闻畅春园问安
  date: 1755-05-18
  year_of: 1755
  raw: 乾隆二十年五月壬辰
  place_zh: 北京畅春园
  description: 定边左副将军阿睦尔撒纳奏大兵直抵伊犁厄鲁特回子牵羊携酒迎叩，抚定贼巢渡河北务擒达瓦齐
- id: guji-乾隆-event-ili-feng
  type: career
  title_zh: 加封阿睦尔撒纳班第萨喇勒等并议告祭加徽号
  date: 1755-05-19
  year_of: 1755
  raw: 乾隆二十年五月癸巳甲午间
  place_zh: 北京
  description: 赏阿睦尔撒纳亲王双俸班第诚勇公萨喇勒超勇公，命告祭三陵桥山，议上皇太后徽号颁诏勒石太学纂方略
- id: guji-乾隆-event-echang
  type: career
  title_zh: 谕鄂昌负恩党逆赐自尽史贻直休致
  date: 1755-05-16
  year_of: 1755
  raw: 乾隆二十年五月庚寅
  place_zh: 北京
  description: 鄂昌在广西与胡中藻唱和见大逆不愤反引同调，查塞上吟怨望，廷鞫俯首，故赐自尽，史贻直不实陈奏着原品休致
- id: guji-乾隆-event-manzhou
  type: career
  title_zh: 通谕八旗禁与汉人唱和较同年
  date: 1755-05-17
  year_of: 1755
  raw: 乾隆二十年五月庚寅
  place_zh: 北京
  description: 以鄂昌效汉习呼史贻直为伯父为戒，谕满洲以清语骑射为务，翰林备考而已，违者决不宽贷
- id: guji-乾隆-event-death
  type: death
  title_zh: 太上皇崩于养心殿
  date: 1799-02-07
  year_of: 1799
  raw: 嘉庆四年正月初三日
  place_zh: 北京紫禁城
  description: 平定准噶尔回部两金川后禅位为太上皇，寿终，终成十全武功之业
