endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 應接英咭唎國貢使北上瞻覲
  summary_zh: 英使嗎嘎爾呢等乘貢船由南洋北上經定海天津轉赴熱河朕令沿海及直隸妥為護送宴賚以彰懷柔
  phases:
  - key: brewing
    name: 定海探報與收口
    labels:
      zh: 海防探詢
