person:
  qid: guji-乾隆
  name_zh: 乾隆
  names:
    zh: 弘历
    en: Qianlong
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆
  archetype: 勤政抚民之圣君
  dilemmas:
  - 灾赈屡加而吏胥侵冒难防，当宽大与严察之间如何两全
  - 盐课帑银那移而督抚隐饰，当保全大臣与彻底清厘之间如何抉择
  - 蕃部朝贡柔服而边衅易起，当怀柔姑息与振威示法之间如何权衡
  lesson: 敬天勤民在实心经理，清厘积弊在破情面彻底根究，柔远安边在恩威并施
  summary_first_person: 朕御极五十有八，值新正朝会祈谷之时，首念畿辅河南陕西山东灾黎青黄不接，再加展赈借粜。盐务那移，福崧柴桢通同婪索，朕命庆桂长麟彻底严办，并改杭州织造为盐政以专稽察。外藩回部朝鲜安南廓尔喀来朝，皆赐宴颁赉，敕谕霍罕安南守土睦邻，以副朕敷锡春祺一视同仁之意。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71420.html
endeavors:
- id: guji-乾隆-endeavor-1
  title_zh: 正月加赈抚恤四省灾黎
  summary_zh: 乾隆五十八年正月因上年河南陕西直隶山东旱灾，正赈已毕青黄不接，降旨展赈借粜加赈口粮，命督抚实心经理。
  phases:
  - key: brewing
    name: 上年截留漕粮分别赈济
    labels:
      zh: 酝酿截漕
    start_date: 1792-08-15
    highlight_event_id: guji-乾隆-event-1
  - key: breakthrough
    name: 正月初二谕河南陕西展赈
    labels:
      zh: 突破展赈
    start_date: 1793-02-13
    highlight_event_id: guji-乾隆-event-1
  - key: climax
    name: 直隶山东加赈借粜并举
    labels:
      zh: 高潮普惠
    start_date: 1793-02-15
    highlight_event_id: guji-乾隆-event-2
  - key: closure
    name: 饬督抚实心经理防侵冒
    labels:
      zh: 收束防弊
    start_date: 1793-02-16
    highlight_event_id: guji-乾隆-event-2
  decisions:
  - date: 1793-02-13
    title_zh: 河南五县展赈十一县借粮
    rationale: 正赈已毕青黄不接，恐小民口食拮据，故加恩展赈一月借给口粮以资接济
  - date: 1793-02-15
    title_zh: 直隶二十一州县极贫加赈两月
    rationale: 顺德广平等府被旱，截留漕粮之外再加赈，俾灾黎均沾渥泽不使一夫失所
  - date: 1793-02-15
    title_zh: 山东旱重十州县赏两月口粮
    rationale: 德州济南一带收成歉薄，已蠲缓给赈，复念糊口无资，故赏给口粮并酌借耔种平粜
- id: guji-乾隆-endeavor-2
  title_zh: 严办盐课那移整饬鹾政
  summary_zh: 因柴桢那移扬州帑课填补浙江交代，牵出福崧婪索，命庆桂长麟赴浙严审，并改设盐政运司以清厘章程。
  phases:
  - key: brewing
    name: 全德参奏柴桢那移课银
    labels:
      zh: 酝酿发觉
    start_date: 1792-12-20
    highlight_event_id: guji-乾隆-event-3
  - key: breakthrough
    name: 庆桂长麟扬州提审得供
    labels:
      zh: 突破得供
    start_date: 1793-02-14
    highlight_event_id: guji-乾隆-event-3
  - key: climax
    name: 革职拏问福崧带犯赴浙质审
    labels:
      zh: 高潮严办
    start_date: 1793-02-15
    highlight_event_id: guji-乾隆-event-3
  - key: closure
    name: 改织造为盐政改盐道为运司
    labels:
      zh: 收束立制
    start_date: 1793-02-17
    highlight_event_id: guji-乾隆-event-4
  decisions:
  - date: 1793-02-14
    title_zh: 申饬庆桂责成长麟严切究办
    rationale: 庆桂行走迟延办事素软，若存作好人之见必致掣肘，故明示责成长麟彻底严办不许将就完事
  - date: 1793-02-14
    title_zh: 诘问全德失察隐匿
    rationale: 柴桢分四次送浙已非一日，全德直至书吏陈浩告知始参，若非告发竟无闻见，故须据实覆奏毋得回护
  - date: 1793-02-17
    title_zh: 设盐政专管以巡抚纠察相维
    rationale: 巡抚兼管出纳无人稽察易滋弊，故改杭州织造为盐政兼管织造，盐道改运司，南北关税归巡抚，钱粮出入令抚纠参
- id: guji-乾隆-endeavor-3
  title_zh: 朝正宴赉柔远抚蕃
  summary_zh: 正月御殿赐宴蒙古王公回部朝鲜安南暹罗霍罕廓尔喀使臣，敕谕霍罕伯克及安南国王，并召屯土出力将弁入觐奖赉。
  phases:
  - key: brewing
    name: 元旦御殿受朝颁宴
    labels:
      zh: 酝酿朝会
    start_date: 1793-02-12
    highlight_event_id: guji-乾隆-event-5
  - key: breakthrough
    name: 紫光阁山高水长赐宴外藩
    labels:
      zh: 突破宴赉
    start_date: 1793-02-20
    highlight_event_id: guji-乾隆-event-5
  - key: climax
    name: 敕谕霍罕安南申睦邻守土
    labels:
      zh: 高潮敕谕
    start_date: 1793-02-21
    highlight_event_id: guji-乾隆-event-5
  - key: closure
    name: 召穆塔尔等屯土将弁入觐
    labels:
      zh: 收束奖励
    start_date: 1793-02-24
    highlight_event_id: guji-乾隆-event-5
  decisions:
  - date: 1793-02-21
    title_zh: 准霍罕通使嘉谕诚敬和睦
    rationale: 那尔巴图追悔释放萨木萨克之愆表文恭顺，故俯准通使赉蟒缎，令感恩约束所属安居乐业勿妄滋事
  - date: 1793-02-22
    title_zh: 敕戒安南睦邻修好勿黩武
    rationale: 阮光平内扫残黎外降万众，适廓尔喀输款之时，故褒其恭顺而戒佳兵，令康乐和亲保世滋大
  - date: 1793-02-24
    title_zh: 特召廓尔喀随征屯土入觐
    rationale: 穆塔尔等登山陟险出力，已赏副都统巴图鲁，虽非年班之期亦令入觐宴赉，以示奖励并永定五年之期
events:
- id: guji-乾隆-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，母钮祜禄氏。
  location_zh: 北京雍亲王府
- id: guji-乾隆-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩，年八十有九，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝。
  location_zh: 北京紫禁城养心殿
- id: guji-乾隆-event-1
  title_zh: 谕河南陕西展赈借粮
  date: 1793-02-13
  year_of: 1793
  description_zh: 以今春正赈已毕青黄不接，加恩河南林县等五县展赈一月，十一县借一月口粮，陕西醴泉展赈两月，兴平等七县展赈一月。
  location_zh: 北京紫禁城
- id: guji-乾隆-event-2
  title_zh: 谕直隶山东加赈口粮
  date: 1793-02-15
  year_of: 1793
  description_zh: 命直隶保定文安等二十一州县极贫加赈两月，山东德州平原等十州县赏两月口粮，十州县赏一月，余酌借耔种减价平粜。
  location_zh: 北京紫禁城
- id: guji-乾隆-event-3
  title_zh: 命庆桂长麟严审柴桢福崧案
  date: 1793-02-14
  year_of: 1793
  description_zh: 庆桂长麟扬州提讯柴桢，供出在浙江盐道任内福崧婪索十一万五千余两，谕彻底严办，申饬庆桂，责成长麟，并诘全德失察。
  location_zh: 扬州舟次
- id: guji-乾隆-event-4
  title_zh: 改设浙江盐政运司整饬盐务
  date: 1793-02-17
  year_of: 1793
  description_zh: 改杭州织造为盐政兼管织造，盐道改为运司，南北关归巡抚，全德降郎中调补盐政，穆腾额调两淮，徵瑞补长芦。
  location_zh: 北京紫禁城
- id: guji-乾隆-event-5
  title_zh: 宴外藩敕谕霍罕安南召土弁
  date: 1793-02-21
  year_of: 1793
  description_zh: 御紫光阁山高水长赐蒙古回部朝鲜安南暹罗霍罕廓尔喀宴，敕谕那尔巴图阮光平睦邻守土，召穆塔尔等屯土将弁入觐，加恤廓尔喀阵亡屯练降番。
  location_zh: 北京紫光阁
