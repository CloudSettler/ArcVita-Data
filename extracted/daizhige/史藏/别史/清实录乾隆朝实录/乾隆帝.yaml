  - date: 1779-07-10
    title_zh: 催趱堵合沁水民埝并启洪湖信坝
    rationale: 水过易合则借司库速办洪湖来源过盛则酌开坝宣泄以减清口压力
- id: guji-乾隆帝-endeavor-2
