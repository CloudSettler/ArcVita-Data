  - 奉養皇太后恭謁祖陵與長途安營除道勞民之間如何兩全
  - 京倉充裕而直隸被旱各省倉儲告急之間如何調劑漕運而不援例
  lesson: 敬天法祖以盡孝，安民恤農以盡仁，凡興大典必先蠲賑，凡調倉儲必戒常例
  summary_first_person: 朕即位八年，秋七月奉皇太后恭謁盛京祖陵，祗告奉先殿而啟鑾，經直隸蠲免錢糧，撥通倉米五十萬石以賑天津河間之旱，截留六省漕糧以實倉儲，緩徵河南被水州縣，停秋審勾決，務使展孝不忘恤民
  source_urls:
