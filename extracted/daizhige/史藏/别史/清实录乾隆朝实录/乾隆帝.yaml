    start_date: 1757-06-06
    highlight_event_id: guji-乾隆帝-event-ceshi
  decisions:
  - date: 1757-06-06
    title_zh: 命裘曰修驰驿勘山东河南上江积水
    rationale: 积潦千庄非大动帑项不能奏效故宽以时日通盘筹算不分疆域以登民衽席
  - date: 1757-06-05
    title_zh: 亲颁策问询官方士习风俗河务
    rationale: 欲使华士诎而真儒出并得疏瀹合宜堤防巩固之实心方略
