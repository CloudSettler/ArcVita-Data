    title_zh: 谕唐喀禄先赴额尔齐斯搜剿乌梁海
    rationale: 恐阿逆窜入那林郭勒故令北路兵先到尽灭余部并加意侦探堵截
  - date: 1757-05-30
    title_zh: 申饬兆惠随富德后亲往奋勇进剿
    rationale: 主帅不可坐视偏师涉险且贼势已蹙正可并力歼灭首恶以振军威
- id: guji-乾隆帝-endeavor-2
  title_zh: 南巡阅河兼策士求治
  summary: 亲莅黄运分委诸臣疏筑并策试贡士咨询风俗河务以求实治
