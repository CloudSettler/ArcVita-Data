endeavors:
- id: guji-乾隆帝-endeavor-1
  title_zh: 整饬直隶吏治与督办河运
  summary_zh: 以孙嘉淦署理直隶，奖其纠参宗室，饬禁烧锅添设佐贰，会同总河办永定河，并据清水入运之奏核查宝应以下淤垫
  phases:
  - key: brewing
    name: 闻烧锅禁弛与八沟辽阔
    labels:
      zh:
      - 访闻
      - 饬察
    start_date: 1738-12-12
    highlight_event_id: guji-乾隆帝-event-1
  - key: breakthrough
    name: 嘉奖孙嘉淦秉公参贝勒
    labels:
      zh:
      - 执法
      - 议叙
    start_date: 1738-12-12
    highlight_event_id: guji-乾隆帝-event-1
  - key: climax
    name: 会办永定河与核查运河淤垫
    labels:
      zh:
      - 河务
      - 漕运
    start_date: 1738-12-14
    highlight_event_id: guji-乾隆帝-event-2
  - key: closure
    name: 兼管河工旧例与速查办理
    labels:
      zh:
      - 定制
      - 催办
    start_date: 1738-12-21
    highlight_event_id: guji-乾隆帝-event-2
  decisions:
  - date: 1738-12-12
    title_zh: 谕令孙嘉淦留心稽察烧锅并议添八沟佐贰
    rationale: 烧锅有妨民食不可因乡里瞻顾而弛禁，八沟地广案繁需协办以免顾此失彼
  - date: 1738-12-12
    title_zh: 交刑部严审王宰投献案并交宗人府议处允祜
    rationale: 履任伊始能秉公执法即当议叙以劝，以肃宗室受献之风
  - date: 1738-12-21
    title_zh: 命高斌确查宝应高邮以下淤垫宜挑即挑
    rationale: 高斌等报清水大五尺与外奏淤垫不符，当以实测为准勿使浅涩误漕
- id: guji-乾隆帝-endeavor-2
  title_zh: 厘定八旗佐领根原与规范贡举恩例
  summary_zh: 因佐领家谱办理未详不画一，特派慎郡王等详定拟正拟陪拟备，兼定各省主考路费与休致食俸之例
  phases:
  - key: brewing
    name: 佐领家谱进呈未详
    labels:
      zh:
      - 清查
      - 旧弊
    start_date: 1738-12-20
    highlight_event_id: guji-乾隆帝-event-3
  - key: breakthrough
    name: 指出勋旧世管优异办理不一
    labels:
      zh:
      - 辨析
      - 正名
    start_date: 1738-12-20
    highlight_event_id: guji-乾隆帝-event-3
  - key: climax
    name: 派王大臣详定拟正拟陪章程
    labels:
      zh:
      - 定例
      - 画一
    start_date: 1738-12-20
    highlight_event_id: guji-乾隆帝-event-3
  - key: closure
    name: 定主考路费与休致食俸永例
    labels:
      zh:
      - 礼制
      - 俸例
    start_date: 1738-12-18
    highlight_event_id: guji-乾隆帝-event-4
  decisions:
  - date: 1738-12-20
    title_zh: 命慎郡王讷亲等详定佐领应入谱与贴签之例
    rationale: 若不详查酌定画一章程，日后必至争讼不息，管旗大臣亦难遵行
  - date: 1738-12-18
    title_zh: 酌定云南至山东各省主考路费永著为例
    rationale: 道途远近不一，馈送多寡无规，当酌量定数不得增减以均轻重
  - date: 1738-12-11
    title_zh: 定原品休致文武大臣食俸例
    rationale: 自行奏请加恩准致者给全俸半俸有差，特旨致仕者不给，以昭劝惩
events:
- id: guji-乾隆帝-event-birth
  title_zh: 生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即帝位年号乾隆
- id: guji-乾隆帝-event-1
  title_zh: 嘉奖孙嘉淦参贝勒允祜
  date: 1738-12-12
  year_of: 1738
  description_zh: 署直隶总督孙嘉淦参贝勒允祜滥受西宁县民投献房地，谕交刑部严审宗人府议处，并交部议叙孙嘉淦以劝执法
- id: guji-乾隆帝-event-2
  title_zh: 谕查运河宝应以下淤垫并命总督兼管河工
  date: 1738-12-14
  year_of: 1738
  description_zh: 据高斌那苏图报清水畅流入运大五尺有余，复据另奏宝应高邮以下水缓难刷，传谕高斌确查宜挑即动库募工，并命孙嘉淦仍照旧例兼管河工
- id: guji-乾隆帝-event-3
  title_zh: 饬详定八旗佐领世职家谱
  date: 1738-12-20
  year_of: 1738
  description_zh: 览八旗议定家谱勋旧世管办理未详不画一，派慎郡王公讷亲等详加斟酌分别拟正拟陪拟备，并详定入谱贴签章程
- id: guji-乾隆帝-event-4
  title_zh: 定各省主考路费与原品休致食俸例
  date: 1738-12-18
  year_of: 1738
  description_zh: 以主考差往各省馈送无定，酌定云南八百两至山东四百两永为例，又定大学士尚书及一二品武职原品休致给全俸半俸之例
- id: guji-乾隆帝-event-death
  title_zh: 崩于嘉庆四年正月初三日
  date: 1799-02-07
  year_of: 1799
  description_zh: 内禅嘉庆后为太上皇，嘉庆四年正月初三日崩，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
