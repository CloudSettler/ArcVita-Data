endeavors:
- id: guji-乾隆帝-endeavor-1
  title_zh: 奉皇太后東巡恭謁盛京祖陵
  description: 乾隆八年秋奉皇太后由京師啟鑾，經密雲古北至熱河，恭謁祖陵，沿途蠲免除道擾累，詳定迎送奏樂之禮
  phases:
  - key: brewing
    name: 祗告奉先殿定議東巡
    labels:
      zh:
      - 孝思
      - 禮制
    start_date: 1743-08-23
    highlight_event_id: guji-乾隆帝-event-1743-gao
  - key: breakthrough
    name: 奉皇太后啟鑾北上
    labels:
      zh:
      - 啟鑾
      - 省方
    start_date: 1743-08-24
    highlight_event_id: guji-乾隆帝-event-1743-luan
  - key: climax
    name: 駐蹕熱河避暑山莊
    labels:
      zh:
      - 駐蹕
      - 綏遠
    start_date: 1743-08-31
    highlight_event_id: guji-乾隆帝-event-1743-rehe
  - key: closure
    name: 蠲免經過州縣錢糧
    labels:
      zh:
      - 蠲免
      - 恤民
    start_date: 1743-08-24
    highlight_event_id: guji-乾隆帝-event-1743-juan
  decisions:
  - date: 1743-08-23
    title_zh: 先期祗告奉先殿恭謁祖陵
    rationale: 發祥之地根本攸關，必先告廟以申孝敬，再啟鑾以昭鄭重
  - date: 1743-08-24
    title_zh: 經過州縣查明蠲免本年錢糧
    rationale: 安營除道不免資民力，宜蠲租以示體恤，不令絲毫擾累
  - date: 1743-08-22
    title_zh: 每日迎送不必奏樂至熱河乃奏樂
    rationale: 需日甚久迎送頻繁，省樂以節勞，至熱河乃奏樂以存禮
- id: guji-乾隆帝-endeavor-2
  title_zh: 賑濟直隸調劑漕倉安輯流民
  description: 直隸天津河間夏旱米貴，撥通倉米五十萬石分貯賑恤，截留六省漕糧各十萬石並撥閩粵，緩徵河南被水州縣，停秋審勾決，飭安輯流民毋許攔禁
  phases:
  - key: brewing
    name: 直隸被旱米貴議賑
    labels:
      zh:
      - 賑恤
      - 民食
    start_date: 1743-08-24
    highlight_event_id: guji-乾隆帝-event-1743-zhen
  - key: breakthrough
    name: 再撥通倉米四十萬石赴津
    labels:
      zh:
      - 撥倉
      - 備賑
    start_date: 1743-08-24
    highlight_event_id: guji-乾隆帝-event-1743-zhen
  - key: climax
    name: 截留六省漕糧實倉備用
    labels:
      zh:
      - 留漕
      - 濟閩粵
    start_date: 1743-08-27
    highlight_event_id: guji-乾隆帝-event-1743-cao
  - key: closure
    name: 緩徵停勾安輯流民
    labels:
      zh:
      - 緩徵
      - 好生
    start_date: 1743-08-31
    highlight_event_id: guji-乾隆帝-event-1743-huan
  decisions:
  - date: 1743-08-24
    title_zh: 撥通倉米四十萬石運津備冬賑
    rationale: 被旱成災冬賑需米必多，先撥十萬石不敷，再撥四十萬石八月內運津就近挽運
  - date: 1743-08-27
    title_zh: 六省漕糧各留十萬石並撥閩粵各十萬石
    rationale: 京倉充裕而各省倉儲需米孔亟，偶爾變通兩益，格外之恩不得援例
  - date: 1743-08-23
    title_zh: 河南被水六縣及太康民欠一例停緩
    rationale: 既被水淹秋收自減，勘不成災亦當加恩停緩，十月後再徵以紓民力
events:
- id: guji-乾隆帝-event-birth
  title_zh: 生於雍親王府
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生，是為弘曆，後即位為高宗純皇帝
- id: guji-乾隆帝-event-death
  title_zh: 崩於養心殿
  date: 1799-02-07
  year_of: 1799
  description: 嘉慶四年正月初三日崩，年八十有九，廟號高宗
- id: guji-乾隆帝-event-1743-gao
  title_zh: 以恭謁祖陵先期祗告奉先殿
  date: 1743-08-23
  year_of: 1743
  description: 乾隆八年七月丁亥，以詣盛京恭謁祖陵，先期祗告奉先殿，幸圓明園，命整肅京師夜禁
- id: guji-乾隆帝-event-1743-luan
  title_zh: 奉皇太后啟鑾巡幸盛京
  date: 1743-08-24
  year_of: 1743
  description: 戊子奉皇太后啟鑾，詣行宮問安，駐蹕南石槽，次日駐懷柔密雲，申命河防搶護速辦
- id: guji-乾隆帝-event-1743-juan
  title_zh: 諭蠲免經過州縣錢糧
  date: 1743-08-24
  year_of: 1743
  description: 以安營除道資民力，命直隸總督順天府尹查明經過地方本年應徵數目請旨蠲免
- id: guji-乾隆帝-event-1743-zhen
  title_zh: 撥通倉米五十萬石賑直隸旱災
  date: 1743-08-24
  year_of: 1743
  description: 天津河間夏旱米貴，先撥十萬石外再撥四十萬石，八月內運津分發水次，就近挽運接濟冬賑
- id: guji-乾隆帝-event-1743-cao
  title_zh: 截留六省漕糧並撥運閩粵
  date: 1743-08-27
  year_of: 1743
  description: 江蘇安徽浙江江西湖北湖南各留十萬石於本省，江浙各運十萬石赴福建，江西運十萬石赴廣東，以備緩急
- id: guji-乾隆帝-event-1743-rehe
  title_zh: 至熱河駐蹕避暑山莊
  date: 1743-08-31
  year_of: 1743
  description: 乙未至熱河，詣皇太后行宮問安，駐蹕避暑山莊，諭今年朝審秋審情實人犯停止勾決
- id: guji-乾隆帝-event-1743-huan
  title_zh: 緩徵河南停倉工飭安輯流民
  date: 1743-08-23
  year_of: 1743
  description: 緩徵河南被水六縣及太康民欠，停建倉廒，諭各省安插災民毋得攔禁阻其謀生，並飭八旗敦睦止訟
