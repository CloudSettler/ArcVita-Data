  - 黄运积潦蔓延数百里当惜费因循还是大动帑金彻底疏筑
  lesson: 宵旰忧劳不敢暇逸军务河务皆亲临指授方收实效
  summary_first_person: 朕缵承大统临御二十二年以来兢兢业业惟恐一夫失所西陲则督令兆惠富德奋勇擒逆河防则亲莅徐邳分委重臣疏导策试多士以求真儒济世皆出于痌瘝一体之心
