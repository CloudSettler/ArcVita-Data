      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清朝
  reign_ref: 乾隆三年
  archetype: 励精守成之君
  dilemmas:
  - 宽严之间如何既体恤大臣又秉公执法以肃纲纪
  - 河工海塘赈恤繁重如何核实钱粮又不失拯民之速
  - 八旗佐领世职争讼不息如何清查根原以垂永久定例
  lesson: 秉公执法与核实根原方能使恩泽有节而政令可行
  summary_first_person: 朕即位三年以来，朝夕以吏治河务民生为念，直督孙嘉淦能参宗室以执法，朕嘉而议叙之，黄运清水畅刷朕心稍慰，而八旗佐领根原不清，主考路费无制，皆当立为定例以绝后争，此朕乾隆三年十一月之所亲理也
  source_urls:
