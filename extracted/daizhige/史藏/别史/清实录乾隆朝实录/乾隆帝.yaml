    title_zh: 传谕兰第锡李奉翰敬慎巡防
    rationale: 彰德卫辉涨水注入大河秋汛方长堤埽在在紧要故先事防范并查奏水志尺寸
  - date: 1794-08-10
    title_zh: 永定河南岸上紧堵筑加镶边埽
    rationale: 漫工易办但秋汛在即不可欲速草率故督令认真镶做以臻巩固
  - date: 1794-08-11
    title_zh: 发藏香御书扁祀谢河神
    rationale: 大溜开行化险为平皆赖河神默佑故虔诚祀谢悬匾灵昭翕顺以答神贶
