    title_zh: 零陵祁阳坍房加两倍赏给
    rationale: 虽可补种有收但房屋坍损民力拮据故加恩两倍俾各安栖止
  - date: 1794-08-10
    title_zh: 豫省三府坍房加倍给费秋粮概免
    rationale: 田庐多淹贫民口食尚艰故民堰工料作正开销秋粮概免以沾实惠
  - date: 1794-08-07
    title_zh: 保定正定低洼处派道分查赈恤
    rationale: 毋以偏灾即存大意见被淹即酌加赈恤以防一夫失所
- id: guji-乾隆帝-endeavor-2
  title_zh: 河工巡防祀谢河神
  summary_zh: 伏汛已过秋汛方长饬南北河臣加意巡防永定河赶紧堵合黄河化险为平则虔祀致谢以邀显佑
