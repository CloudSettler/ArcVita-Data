  - 恩眷日隆与廉隅自守之难
  - 枢廷承旨勤慎与主持甘省捐监之误
  lesson: 宠眷愈重愈当慎廉隅，一有营私则身后盛典亦难保全。
  summary_first_person: 余久侍内廷枢廷，蒙高宗优眷勤慎供职，然力主甘省捐监，酿成王亶望等侵欺大案，身故后终被彻出贤良祠以昭儆戒。
