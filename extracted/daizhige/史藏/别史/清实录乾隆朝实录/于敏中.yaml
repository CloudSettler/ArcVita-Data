endeavors:
- id: guji-于敏中-endeavor-1
  title_zh: 内廷供职枢廷承旨
  description: 由翰林入直内廷，久任军机，恩眷优渥，声势渐张而暗受苞苴。
  phases:
  - key: brewing
    name: 翰林养望
    labels:
      zh: 养望
    start_date: '1737'
    highlight_event_id: guji-于敏中-event-birth
  - key: breakthrough
    name: 入直军机
    labels:
      zh: 受知
    start_date: '1766'
    highlight_event_id: guji-于敏中-event-1
  - key: climax
    name: 恩眷声势渐张
    labels:
      zh: 专宠
    start_date: '1773'
    highlight_event_id: guji-于敏中-event-1
  - key: closure
    name: 身故饰终入祠
    labels:
      zh: 饰终
    start_date: '1779'
    highlight_event_id: guji-于敏中-event-death
  decisions:
  - date: '1766'
    title_zh: 安于枢廷承旨书谕
    rationale: 自以勤慎供职可保恩眷，未能严绝依附杜绝苞苴，终致物议。
- id: guji-于敏中-endeavor-2
  title_zh: 主持甘省捐监酿案身后褫祠
  description: 舒赫德请停甘省捐监，力言应开以致勒尔谨王亶望通同侵欺，身后事发被彻出贤良祠。
  phases:
  - key: brewing
    name: 舒赫德请停捐监
    labels:
      zh: 议停
    start_date: '1774'
    highlight_event_id: guji-于敏中-event-2
  - key: breakthrough
    name: 力主捐监应开
    labels:
      zh: 主持
    start_date: '1775'
    highlight_event_id: guji-于敏中-event-2
  - key: climax
    name: 甘肃折收侵欺酿成大案
    labels:
      zh: 酿祸
    start_date: '1781'
    highlight_event_id: guji-于敏中-event-3
  - key: closure
    name: 览严嵩传彻出贤良祠
    labels:
      zh: 褫祠
    start_date: '1786'
    highlight_event_id: guji-于敏中-event-4
  decisions:
  - date: '1775'
    title_zh: 于御前力言甘省捐监应开
    rationale: 谓部省两便闾阎得粜贩之利，以一举两得说动上听，实开侵欺之门。
  - date: '1781'
    title_zh: 身故后免深究子孙
    rationale: 已属身故，高宗曲示矜全不治子孙，然盛典攸关终须彻祠儆戒。
events:
- id: guji-于敏中-event-birth
  title_zh: 出生
  date: '1714'
  year_of: 1714
  description: 生于康熙五十三年，江苏金坛人，乾隆朝入仕。
- id: guji-于敏中-event-1
  title_zh: 任军机大臣进大学士
  date: '1773'
  year_of: 1773
  description: 久直枢廷承旨书谕，恩眷稍优，外间依附声势略张。
- id: guji-于敏中-event-2
  title_zh: 主持甘肃捐监议准通行
  date: '1775'
  year_of: 1775
  description: 舒赫德请停甘省捐监，于敏中力言应开，遂准行，勒尔谨王亶望通同一气肥橐殃民。
- id: guji-于敏中-event-death
  title_zh: 病故饰终入贤良祠
  date: '1779'
  year_of: 1779
  description: 病故，高宗加恩饰终准入贤良祠以全终始。
- id: guji-于敏中-event-3
  title_zh: 甘肃捐监折收案败露
  date: '1781'
  year_of: 1781
  description: 乾隆四十六年王亶望等侵欺贪黩事败，追论于敏中主持贿谢之罪，若尚在必严加惩治。
- id: guji-于敏中-event-4
  title_zh: 彻出贤良祠昭示儆戒
  date: '1786-03-07'
  year_of: 1786
  description: 乾隆五十一年二月壬午，高宗览严嵩传触动鉴戒，谕彻于敏中出贤良祠，明彰瘅以昭后世。
