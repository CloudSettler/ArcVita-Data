  era: 清
  reign_ref: 乾隆
  archetype: 外戚经略
  dilemmas:
  - 身为大学士国戚临危经略，既要速进立功，又要保全满汉新旧兵力不可轻用
  - 前任讷亲畏缩老师坐守贻误军机，我若迟回不断则重蹈覆辙，若冒进则驿站车马军需难继
  lesson: 受恩深重者当亲临督战乘机速进，以实心任事洗刷畏缩观望之习
  summary_first_person: 我是傅恒，孝贤皇后之弟。乾隆十三年十月金川军务糜烂，讷亲畏缩获罪，我受命为经略，沿途开看军营摺匣，酌定京兵与船厂黑龙江兵分起进发，督办驿站车马，至军即督率前进，次年受莎罗奔之降而班师。后复经略云南征缅，积劳而卒。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70327.html
endeavors:
- id: guji-傅恒-endeavor-1
  title_zh: 经略金川受降班师
  summary: 乾隆十三年十月代讷亲为经略，整顿分起兵制与驿站军需，督率岳钟琪傅尔丹等乘机进剿，次年平定大金川。
  phases:
  - key: brewing
    name: 临危受命择日启程
    labels:
      zh: 酝酿
    start_date: 1748-10
    highlight_event_id: guji-傅恒-event-jinchuan-start
  - key: breakthrough
    name: 沿途开匣豫办军情
    labels:
      zh: 突破
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-jinchuan-start
  - key: climax
    name: 分起速进督战攻碉
    labels:
      zh: 高潮
    start_date: 1748-12
    highlight_event_id: guji-傅恒-event-jinchuan-victory
  - key: closure
    name: 莎罗奔乞降班师论功
    labels:
      zh: 收束
    start_date: 1749-04
    highlight_event_id: guji-傅恒-event-jinchuan-victory
  decisions:
  - date: 1748-10
    title_zh: 请分京兵船厂黑龙江兵为大起进发
    rationale: 原议每起三百名旷日持久，改为每起五百名，京兵分四起，船厂黑龙江兵每起五百，以速抵金川乘破竹之势
  - date: 1748-10
    title_zh: 奉旨沿途开看军营摺匣
    rationale: 傅尔丹岳钟琪班第等奏报皆投递经略行在开看，应办者豫办，应奏者查奏，俾备悉现在情形不致悬隔
- id: guji-傅恒-endeavor-2
  title_zh: 晚年再经略云南征缅
  summary: 乾隆三十四年复以大学士经略云南，督满汉兵进剿缅甸，议和班师后病发而卒，配享太庙。
  phases:
  - key: brewing
    name: 缅事久拖再膺经略
    labels:
      zh: 酝酿
    start_date: 1769-01
    highlight_event_id: guji-傅恒-event-myanmar-go
  - key: breakthrough
    name: 冒瘴深入老官屯议围
    labels:
      zh: 突破
    start_date: 1769-04
    highlight_event_id: guji-傅恒-event-myanmar-go
  - key: climax
    name: 水陆并进迫缅乞和
    labels:
      zh: 高潮
    start_date: 1769-11
    highlight_event_id: guji-傅恒-event-myanmar-go
  - key: closure
    name: 班师回京积劳病卒
    labels:
      zh: 收束
    start_date: 1770-07
    highlight_event_id: guji-傅恒-event-death
  decisions:
  - date: 1769-04
    title_zh: 亲赴军前督战不遥观
    rationale: 鉴于金川时大员择障蔽处遥观督战之恶习，必亲临督率以励偏裨士卒
  - date: 1769-11
    title_zh: 权许缅酋纳款撤兵
    rationale: 瘴疠兵疲粮运艰难，久持无益，不如因其乞和收军保全国力，再图后举
events:
- id: guji-傅恒-event-birth
  type: birth
  date: '1720'
  year_of: 1720
  title_zh: 生于富察氏家
  description: 康熙五十九年生，孝贤皇后之弟，少以恩荫入仕，洊至军机户部。
- id: guji-傅恒-event-jinchuan-start
  type: career
  date: 1748-10
  year_of: 1748
  title_zh: 受命经略金川择日起程
  description: 乾隆十三年十月，讷亲张广泗贻误获罪，命傅恒为经略，奏定京兵一千七百分四起，船厂黑龙江兵三千分起，每起五百，令直隶河南西安四川速备驿站车马，并于沿途开看军营摺匣。
- id: guji-傅恒-event-jinchuan-victory
  type: career
  date: 1749-04
  year_of: 1749
  title_zh: 金川莎罗奔乞降班师
  description: 督率岳钟琪傅尔丹等奋力进剿，夺碉擒斩，大金川土司莎罗奔乞降，军务告竣，班师论功封一等忠勇公。
- id: guji-傅恒-event-myanmar-go
  type: career
  date: 1769-04
  year_of: 1769
  title_zh: 经略云南督师征缅
  description: 乾隆三十四年再为经略赴云南，督兵深入缅地，水陆并进，缅酋乞和，乃许其纳款撤兵。
- id: guji-傅恒-event-death
  type: death
  date: 1770-07
  year_of: 1770
  title_zh: 病卒于京师
  description: 乾隆三十五年六月以征缅积劳瘴疾发，卒于京师，谥文忠，配享太庙。
