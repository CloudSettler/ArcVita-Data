    highlight_event_id: guji-傅恒-event-1748-shouming
  - key: breakthrough
    name: 途中开看奏匣相商机务
    labels:
      zh: 驰驱筹画
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-tuzou
  - key: climax
    name: 相度卡撒党坝定分进之策
    labels:
      zh: 两路并进
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-tuzou
  - key: closure
    name: 整顿纪律筹粮以图进取
    labels:
      zh: 壁垒一新
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-chouban
  decisions:
  - date: 1748-11
    title_zh: 先至卡撒详看情形再定分兵
    rationale: 卡撒已克色底双碉扫清山梁若守而不攻则贼专力死拒党坝故须亲勘再定统大兵进剿与添兵助岳钟琪之策
  - date: 1748-11
    title_zh: 劾断张广泗藉寇赍粮之失
    rationale: 甲索乃绰斯甲巢穴仅驻兵千人而欲以存粮六千石交其看守必启贼觊觎且缺额不补兵数日少故须确访覆奏以肃军纪
- id: guji-傅恒-endeavor-2
  title_zh: 参赞枢机持平论政
  summary_zh: 在京参赞军机事务，于安宁浒关余银案及满汉兵饷棉甲肉食诸务持论公当，佐高宗伸赏罚大权
  phases:
  - key: brewing
    name: 在京分晰关税旧例
    labels:
      zh: 持平陈奏
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-anqing
  - key: breakthrough
    name: 辨明坐赃成狱之失
    labels:
      zh: 明罚至公
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-anqing
  - key: climax
    name: 筹画满兵棉甲糇粮
    labels:
      zh: 体恤士卒
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-chouban
  - key: closure
    name: 佐成赏罚以励忠勤
    labels:
      zh: 感激图报
    start_date: 1748-11
    highlight_event_id: guji-傅恒-event-1748-chouban
  decisions:
  - date: 1748-11
    title_zh: 为安宁关余杂银分辨不以重罪定拟
    rationale: 关务杂项余银历任支用赏给家人者多若据此坐赃成狱不足服心且其罪浮于讷亲者轻重须毫厘不爽故以内廷仆隶事末减拘禁
  - date: 1748-11
    title_zh: 请颁棉甲晒肉以济深入山径
    rationale: 满兵深入险地或米粮不敷无暇造饭则棉甲御寒乾肉充饥于临阵征战有益故酌量分给骁勇绿旗以振军气
events:
- id: guji-傅恒-event-birth
  date: 1720
  year_of: 1720
  title_zh: 出生
  description_zh: 康熙五十九年生于富察氏家，後以戚畹勋臣膺高宗眷注
- id: guji-傅恒-event-death
  date: 1770
  year_of: 1770
  title_zh: 病逝
  description_zh: 乾隆三十五年七月病逝于京师，宣力有年恪勤素著
- id: guji-傅恒-event-1748-shouming
  date: 1748-10
  year_of: 1748
  title_zh: 受命经略金川驰赴军营
  description_zh: 乾隆十三年十月受命为经略大学士赴四川金川，高宗命旺扎勒随后阅看碉卡路径，期以明岁二月回京备陈军营大概
- id: guji-傅恒-event-1748-tuzou
  date: 1748-11
  year_of: 1748
  title_zh: 途中奏陈两路机宜劾张广泗
  description_zh: 十一月途中开看傅尔丹岳钟琪奏匣，谓岳钟琪偏主党坝直捣勒乌围而置卡撒于守地未妥，拟先至卡撒详看若可进即统大兵进剿另派员助党坝，并劾张广泗大言不惭勾通蒙蔽
- id: guji-傅恒-event-1748-chouban
  date: 1748-11
  year_of: 1748
  title_zh: 筹办粮饷棉甲肉食整顿纪律
  description_zh: 十一月奉旨筹画军粮棉甲，高宗以广储司棉甲二千余副分起给兵，又议以牛羊肉割条晒乾为深入糇粮，并饬经略在后指挥督率大员亲身督战而不可轻涉危险
- id: guji-傅恒-event-1748-anqing
  date: 1748-11
  year_of: 1748
  title_zh: 在京分晰安宁浒关余银案
  description_zh: 经略在京时分晰陈奏安宁檀用浒关杂项余银本系赏给家人历任支用之项，若坐赃成狱不足服心，高宗韪其公当之论遂末减拘禁另候谕旨
