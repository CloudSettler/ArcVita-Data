  reign_ref: 乾隆
  archetype: 外戚经略
  dilemmas:
  - 以外戚近臣领经略重任，恩宠与功名自立之衡
  - 金川碉坚粮艰，速战与持重善后之择
  lesson: 不恃恩宠而以实心任事，礼敬宫闱而经略边徼，方能保全始终
  summary_first_person: 吾富察傅恒，以外戚事高宗，领军机，任经略，平大金川，筹缅事，复以大学士持节册封宫闱，一生以实心报效，不敢以恩自恃
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0820.html
endeavors:
- id: guji-傅恒-endeavor-1
  title_zh: 经略大金川
  summary_zh: 以大学士授经略，督川陕官兵，分路攻碉，平定莎罗奔，善后班师
  phases:
  - key: brewing
    name: 受命筹边
    labels:
      zh: 酝酿
    start_date: '1747'
    highlight_event_id: guji-傅恒-event-jinchuan-1
  - key: breakthrough
    name: 分路进剿
    labels:
      zh: 突破
    start_date: '1748'
    highlight_event_id: guji-傅恒-event-jinchuan-1
  - key: climax
    name: 勒乌围受降
    labels:
      zh: 高潮
    start_date: '1749'
    highlight_event_id: guji-傅恒-event-jinchuan-2
  - key: closure
    name: 善后班师
    labels:
      zh: 收束
    start_date: '1749-06-01'
    highlight_event_id: guji-傅恒-event-jinchuan-2
  decisions:
  - date: '1748-04-01'
    title_zh: 请授经略亲往督战
    rationale: 前督张广泗玩误，以碉攻碉非重臣督办不能济，故自请往以一事权
  - date: '1749-02-01'
    title_zh: 纳莎罗奔乞降不屠
    rationale: 碉寨已破，番众畏威，若屠则结怨藏边，不如受降以示天朝宽大，永靖西陲
- id: guji-傅恒-endeavor-2
  title_zh: 军机辅政与宫闱礼使
  summary_zh: 领军机大臣佐理朝政，筹滇缅军务，复以正使持节册封庆贵妃，秉礼敬以襄内治
  phases:
  - key: brewing
    name: 赞机务筹缅
    labels:
      zh: 酝酿
    start_date: '1767'
    highlight_event_id: guji-傅恒-event-cefeng
  - key: breakthrough
    name: 持节册封
    labels:
      zh: 突破
    start_date: '1768-11-08'
    highlight_event_id: guji-傅恒-event-cefeng
  - key: climax
    name: 再议缅饷
    labels:
      zh: 高潮
    start_date: '1769'
    highlight_event_id: guji-傅恒-event-cefeng
  - key: closure
    name: 病中辅政
    labels:
      zh: 收束
    start_date: '1770'
    highlight_event_id: guji-傅恒-event-death
  decisions:
  - date: '1768-11-08'
    title_zh: 以大学士为正使册封庆妃为贵妃
    rationale: 宫闱懿亲，需重臣秉礼，襄化理而昭恩光，故敬承皇太后慈谕持节行礼
  - date: '1769-01-01'
    title_zh: 议滇省进兵从简不按人筹饷
    rationale: 绿营糜饷畏缩，不如满洲轻装简从，减夫马以速行，省转输以纾民力
