endeavors:
- id: guji-傅恒-endeavor-1
  title_zh: 金川经略督师进剿
  summary_zh: 乾隆十三年受命为经略大学士驰赴金川，相度卡撒党坝形势，定两路并进之策，整顿壁垒纪律，调度满汉大兵粮饷以图肤功
  phases:
