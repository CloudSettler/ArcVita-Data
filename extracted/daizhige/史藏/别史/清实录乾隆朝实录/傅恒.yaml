  lesson: 行兵贵因粮于敌而撙节盈缩，攻心解散党羽胜于专恃兵力
  summary_first_person: 余奉命经略征缅，驻节滇边，改裹带之法以驮骡分日支粮，增设台马以通要路，又晓谕摆夷以散缅匪羽翼，务期大兵直抵阿瓦。
