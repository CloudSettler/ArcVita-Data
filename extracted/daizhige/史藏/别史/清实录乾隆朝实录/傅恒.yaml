  archetype: 经略辅臣
  dilemmas:
  - 缅地水土恶劣病损多，大军久驻难支，彻兵结局与穷兵致远之间两难
  - 云贵战守均摊安逸无别，激劝振作与体恤员兵生计之间两难
  - 滇省设镇太多冗员冗兵，裁撤节饷与极边要地防守无缺之间两难
  lesson: 经略边事当衡时度势善结此局，整顿营制贵在核实激劝裁冗补要，不可因循姑息贻误大局
  summary_first_person: 吾傅恒承命经略滇缅，值老官屯瘴疠疾疫难以久驻，赞成彻兵姑允投诚以结此局，又留心边禁贸易以扼缅酋肯綮；念及云贵战守均摊不足示激劝，滇镇冗设糜饷，奏请分照马战守例支给拔补，裁永北曲寻楚姚三镇及督提抚标冗兵以实顺云腾越龙陵极边，惟愿实心筹边不负委任
  source_urls:
