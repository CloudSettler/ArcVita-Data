  dilemmas:
  - 远征转饷浩繁与内地民力之间如何节制以不困闾阎
  - 瘴疠马乏与钦命刻期进剿之间如何保全士马以待秋期
  lesson: 军兴首在人和马力，餧养核实重于催迫，庙算当以实济为归
  summary_first_person: 余以戚畹受知高宗，久赞中枢，晚以经略受敕印而南征，力筹滇马军需，务使膘壮可战，虽瘴乡道远，不敢以饰词塞责，惟愿秋期一举永靖边圉
