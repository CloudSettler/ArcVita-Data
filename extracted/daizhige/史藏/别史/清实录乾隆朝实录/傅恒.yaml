endeavors:
- id: guji-傅恒-endeavor-1
  title_zh: 征缅粮运驮骡与台站改革
  summary_zh: 鉴于前次征缅以牛裹带三月粮迟滞多失，改用驮骡并数日一支，又增设永昌腾越铜壁诸路台马
  phases:
  - key: brewing
    name: 反思牛驮裹带之失
    labels:
      zh: 粮运反思
    start_date: 1769-05-01
    highlight_event_id: guji-傅恒-event-1769-liangyun
  - key: breakthrough
    name: 奏定骡运分支出粮法
    labels:
      zh: 军需变法
    start_date: 1769-06-06
    highlight_event_id: guji-傅恒-event-1769-liangyun
  - key: climax
    name: 增设滇边要路台马
    labels:
      zh: 台站增设
    start_date: 1769-06-07
    highlight_event_id: guji-傅恒-event-1769-taima
  - key: closure
    name: 获旨嘉悦施行
    labels:
      zh: 施行定局
    start_date: 1769-06-08
    highlight_event_id: guji-傅恒-event-1769-taima
  decisions:
  - date: 1769-06-06
    title_zh: 改牛裹带为驮骡分日支领
    rationale: 牛行迟而一毙则六斗粮俱失，骡捷轻便可视盈缩撙节，并派专员经管获粮
  - date: 1769-06-07
    title_zh: 增设永昌至腾越盏达芒市诸站台马
    rationale: 大兵进剿要路马匹不敷，须足数添设以利转运进兵
- id: guji-傅恒-endeavor-2
  title_zh: 晓谕摆夷解散缅匪羽翼
  summary_zh: 缅匪恃犭罢夷养子波竜等为羽翼，拟于进兵前遍行晓谕使知罪在缅酋，并留本进忠于腾越以备差委
  phases:
  - key: brewing
    name: 查明缅恃摆夷为羽翼
    labels:
      zh: 审势
    start_date: 1769-05-20
    highlight_event_id: guji-傅恒-event-1769-gaoshi
  - key: breakthrough
    name: 商酌告示晓谕夷众
    labels:
      zh: 攻心
    start_date: 1769-06-05
    highlight_event_id: guji-傅恒-event-1769-gaoshi
  - key: climax
    name: 请留本进忠于腾越备用
    labels:
      zh: 留镇调遣
    start_date: 1769-06-03
    highlight_event_id: guji-傅恒-event-1769-benjinzhong
  - key: closure
    name: 得旨依议相机进剿
    labels:
      zh: 待机而发
    start_date: 1769-06-05
    highlight_event_id: guji-傅恒-event-1769-gaoshi
  decisions:
  - date: 1769-06-05
    title_zh: 进兵前遍行晓谕摆夷
    rationale: 使知大兵进讨罪在缅酋，明利害者自散，可解散党羽而不使有备
  - date: 1769-06-03
    title_zh: 留云南提督本进忠于腾越大营
    rationale: 落卓一路只须分贼势无关紧要，腾越大营需人甚多不宜远遣普洱
events:
- id: guji-傅恒-event-birth
  title_zh: 生于富察氏
  date: 1720-01-01
  year_of: 1720
  place_zh: 京师
  summary_zh: 康熙五十九年生，满洲镶黄旗富察氏，孝贤纯皇后之弟
- id: guji-傅恒-event-1769-liangyun
  title_zh: 奏改征缅裹带粮法用驮骡分日支给
  date: 1769-06-06
  year_of: 1769
  place_zh: 永昌腾越军前
  summary_zh: 与经略同奏前次每兵给粮六斗牛一只多失，改派武职专司驮骡数日一支，获旨此方是行兵之道嘉悦览之
- id: guji-傅恒-event-1769-taima
  title_zh: 奏增永昌腾越铜壁芒市诸路台马
  date: 1769-06-07
  year_of: 1769
  place_zh: 滇边
  summary_zh: 永昌至腾越每站添足八十匹，黄菓树至盏达添足四十匹，芒市至宛顶添足十五匹，得旨如所议行
- id: guji-傅恒-event-1769-gaoshi
  title_zh: 商酌告示晓谕摆夷以散缅党
  date: 1769-06-05
  year_of: 1769
  place_zh: 军前
  summary_zh: 以缅匪恃犭罢夷养子波竜为羽翼，拟进兵前遍行晓谕使知罪在缅酋，得旨好但不可太早使彼有备
- id: guji-傅恒-event-1769-benjinzhong
  title_zh: 奏请留本进忠于腾越差委
  date: 1769-06-03
  year_of: 1769
  place_zh: 腾越大营
  summary_zh: 奏云南提督本进忠或留腾越或遣普洱，请旨后得旨留腾越差委，落卓一路另遣阿思哈伊勒图内一人
- id: guji-傅恒-event-death
  title_zh: 卒于京师
  date: 1770-07-01
  year_of: 1770
  place_zh: 京师
  summary_zh: 乾隆三十五年七月卒于征缅凯旋后，谥文忠，配享太庙
