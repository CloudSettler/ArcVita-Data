    start_date: 1742-12-02
    highlight_event_id: guji-允禄-event-1
  decisions:
  - date: 1742-12-02
    title_zh: 请笙用八箫笛各用四歌工增为四名
    rationale: 金革二音独出众乐之上余并不扬故损益随宜以求克谐
- id: guji-允禄-endeavor-2
  title_zh: 丹陛大乐趋退节次厘定
  summary_zh: 以旧例仅于叩头时用乐为时太迫奏请分五节以一节为趋进三节为三跪九叩一节为趋退
  phases:
  - key: brewing
    name: 奉命更改丹陛乐章音节
    labels:
