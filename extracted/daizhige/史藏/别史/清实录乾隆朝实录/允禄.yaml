      - 比谱
    start_date: 1742-11-01
    highlight_event_id: guji-允禄-event-2
  - key: climax
    name: 议定五节趋退之制
    labels:
      zh:
      - 礼仪
      - 奏定
    start_date: 1742-12-06
    highlight_event_id: guji-允禄-event-2
  - key: closure
    name: 预令乐部演习冬至举行
    labels:
      zh:
      - 演习
      - 颁行
    start_date: 1742-12-06
    highlight_event_id: guji-允禄-event-2
  decisions:
  - date: 1742-12-06
    title_zh: 请于赞排班后乐作赞退趋至仗末乐止
    rationale: 礼行乐奏必趋进趋退协其节庶礼与乐相比附乐与礼相终始
