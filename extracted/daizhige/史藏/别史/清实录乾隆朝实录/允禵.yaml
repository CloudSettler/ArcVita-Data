  dilemmas:
  - 身为皇子而领大军在外，忠君报国与储位之争难以两全
  - 战功显赫而新君猜忌，锋芒与自保难以兼得
  - 晚年复起而恭谨自守，昔日雄心与余生安分难以调和
  lesson: 功名权势皆过眼，唯恭谨自守方能保全晚节
  summary_first_person: 我是康熙第十四子，曾拜抚远大将军，远征青海西藏，克复拉萨。后因储位之事被革爵圈禁多年，幸蒙宽释，复封恂郡王，晚年恭谨供职，至乾隆二十年正月病逝，蒙上亲临奠酒，此生起落皆已看淡
  source_urls:
