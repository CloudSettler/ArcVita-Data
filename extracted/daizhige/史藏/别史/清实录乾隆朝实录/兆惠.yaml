    highlight_event_id: guji-兆惠-event-3
  decisions:
  - date: 1758-03-12
    title_zh: 酌留索伦兵不尽数拨付南路
    rationale: 北路机宜在剿南路机宜在抚当权其多寡以免追剿兵力空虚
  - date: 1758-03-18
    title_zh: 录奏北路战况寄示雅尔哈善
    rationale: 使南路知贼众溃散之势乘机招抚伯克霍集斯以速成功
