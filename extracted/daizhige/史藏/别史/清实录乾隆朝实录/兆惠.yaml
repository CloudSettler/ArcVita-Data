    highlight_event_id: guji-兆惠-event-1
  - key: climax
    name: 与富德约会沙喇伯勒
    labels:
      zh: 会合策应
    start_date: 1758-08
    highlight_event_id: guji-兆惠-event-1
  - key: closure
    name: 肃清余贼回赴伊犁
    labels:
      zh: 回军待命
    start_date: 1758-09
    highlight_event_id: guji-兆惠-event-1
  decisions:
  - date: 1758-07
    title_zh: 自造哈至和尔岱分道搜捕
    rationale: 与回部相近之地先行穷搜以免余孽勾连哈萨克复扰后路且便就近南下会合雅尔哈善
  - date: 1758-08
    title_zh: 约富德由沙喇伯勒回转会合
    rationale: 西哈萨克边界遥远兵少穷追可虞令车布登扎布策应合力搜捕吹沙喇伯勒余贼以求稳妥
- id: guji-兆惠-endeavor-2
  title_zh: 驰援库车合军进剿霍集占
  summary_zh: 霍集占亲援库车被雅尔哈善击败奉旨速赴回部合军乘胜追剿不令坐困库车务擒渠魁以定各城
  phases:
  - key: brewing
    name: 接旨罢搜捕就近南下
