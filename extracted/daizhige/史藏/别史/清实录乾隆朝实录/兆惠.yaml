  type: career
  title_zh: 奉旨彻兵释哈萨克俘虏晓谕擒逆
  date: 1756-10
  year_of: 1756
  location_zh: 伊犁军营
  description: 乾隆二十一年十月奉军机谕彻回西北两路大兵，酌派兵袭阿布赉，释放俘获哈萨克人等给粮赏缎，传谕锡喇尼玛等晓谕察罕拜巴图尔归诚
- id: guji-兆惠-event-taizhan-1756
  type: career
  title_zh: 奏设台站屯田安插厄鲁特
  date: 1756-10
  year_of: 1756
  location_zh: 巴里坤伊犁一带
  description: 奏请每台设察哈尔兵厄鲁特绿旗兵种地，驰驿有节，停厄鲁特供粮，留三都克所属暂居巴里坤给粮待春授耔种耕种
- id: guji-兆惠-event-huibu-1756
  type: career
  title_zh: 遣使晓谕回部相机绥靖
  date: 1756-10
  year_of: 1756
  location_zh: 叶尔羌阿克苏库车
  description: 遣侍卫提奇图晓谕布拉呢敦霍集占，饬阿敏道与宰桑巴桑公议进兵绥靖阿克苏库车，察霍集占遣使投诚虚实
- id: guji-兆惠-event-death
  type: death
  title_zh: 病卒于京师
  date: 1764-12-10
  year_of: 1764
  location_zh: 北京
  description: 乾隆二十九年十一月十八日以功封一等武毅谋勇公后病卒，谥文襄，配享紫光阁
