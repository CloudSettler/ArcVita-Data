  dilemmas:
  - 分兵搜捕厄鲁特余孽与合军进剿回部之间兵力单薄难以兼顾
  - 穷追哈萨克锡喇等逃寇与顾惜马力俟来年再举之间进退难决
  - 远道援救库车与坐困孤城之间机宜稍纵即失
  lesson: 用兵西陲贵在审时合众乘胜而前不可坐失机会亦须酌量马力
  summary_first_person: 余兆惠早从军旅奉命经略西域先平准噶尔余部复与雅尔哈善合军进剿回部霍集占大小伯克当库车告急之时余分兵搜捕厄鲁特玛哈沁复星夜驰赴回部以会合雅尔哈善东西夹击务擒渠魁以安西陲一生驰驱不敢惜身但愿各城望风归命边氓乐业而已
  source_urls:
