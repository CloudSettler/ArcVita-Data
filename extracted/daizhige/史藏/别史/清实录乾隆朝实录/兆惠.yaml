  archetype: 军功经略型大臣
  dilemmas:
  - 晚年以协办大学士亲勘河工，军功之身如何以治水细务服人
  - 微山湖水大则淹民田水小则滞漕运，如何以一闸兼顾蓄洩
  lesson: 以经略勤慎移于河务，亲勘实测，随时启闭，方能兼全漕民
  summary_first_person: 我是兆惠，早年随军平定准部回部，晚年协办大学士，乾隆二十九年五月与方观承勘收直隶淀河海河，又议韩庄滚坝改闸，欲以闸代坝，利漕保民，未几病卒，惟愿所议双闸得行
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70711.html
endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 直隶淀河海河塌河淀工程勘收
  summary_zh: 会同直隶总督由淀河子牙河至天津海河叠道闸座分段勘收，分别开堤放水与开闸灌溉
  phases:
  - key: brewing
    name: 奉命出勘淀河
    labels:
      zh: 奉命出勘
    start_date: 1764-05-01
    highlight_event_id: guji-兆惠-event-1
  - key: breakthrough
    name: 勘收子牙河青县十里洼
    labels:
      zh: 分段勘收
    start_date: 1764-05-10
    highlight_event_id: guji-兆惠-event-1
  - key: climax
    name: 勘收塌河淀西堤海河叠道闸
    labels:
      zh: 闸堤并核
    start_date: 1764-05-15
    highlight_event_id: guji-兆惠-event-1
  - key: closure
    name: 分别办理放水灌溉复奏
    labels:
      zh: 复奏候旨
    start_date: 1764-05-20
    highlight_event_id: guji-兆惠-event-1
  decisions:
  - date: 1764-05-12
    title_zh: 定议应开堤放水与开闸引水灌溉分别办理
    rationale: 因闸下引河淤塞与农田需水并存，须因地制宜以防水旱偏废
  - date: 1764-05-20
    title_zh: 自老黄河赴宁津南皮景州广平等地接续勘验
    rationale: 为贯通南北水系，须全线核验牛尾河石闸瀑河石坝以保运道民生
- id: guji-兆惠-endeavor-2
  title_zh: 韩庄滚坝改建闸座筹议
  summary_zh: 以微山湖水大小不齐倡议于滚坝以北改建闸座，后成湖口双闸之议以济漕保田
  phases:
  - key: brewing
    name: 巡视韩庄滚坝石堤拆口
    labels:
      zh: 巡视倡议
    start_date: 1764-04-01
    highlight_event_id: guji-兆惠-event-2
  - key: breakthrough
    name: 奏请滚坝以北拆开处改建闸座
    labels:
      zh: 以闸代坝
    start_date: 1764-05-01
    highlight_event_id: guji-兆惠-event-2
  - key: climax
    name: 交尹继善叶存仁会同相度
    labels:
      zh: 会勘相度
    start_date: 1764-05-15
    highlight_event_id: guji-兆惠-event-2
  - key: closure
    name: 定议湖口双闸启闭随时得旨允行
    labels:
      zh: 定议允行
    start_date: 1764-05-25
    highlight_event_id: guji-兆惠-event-2
  decisions:
  - date: 1764-05-01
    title_zh: 倡议滚坝以北拆开石堤处改建闸座
    rationale: 因滚坝引渠不能随时启闭，水大则淹民田，水小则滞漕运，须建闸以人力节制
  - date: 1764-05-15
    title_zh: 赞同于滚坝以南湖口闸以北添建一闸为双闸
    rationale: 因以北河身窄而河底高于湖底不便建闸，改于南段并列可使金门宽深如旧而蓄洩由人
events:
- id: guji-兆惠-event-birth
  date: 1708-01-01
  year_of: 1708
  title_zh: 生于满洲正黄旗乌雅氏家
  desc_zh: 康熙四十七年生，字和甫，后以笔帖式入仕，累迁至协办大学士
- id: guji-兆惠-event-1
  date: 1764-05-01
  year_of: 1764
  title_zh: 会同方观承勘收直隶淀河至天津海河工程
  desc_zh: 由淀河一带至子牙河青县十里洼，勘收塌河淀西堤及海河叠道闸座，分别开堤放水与开闸灌溉，又赴宁津南皮景州广平勘牛尾河石闸等
- id: guji-兆惠-event-2
  date: 1764-05-20
  year_of: 1764
  title_zh: 陈奏韩庄滚坝以北改建闸座引发湖口双闸之议
  desc_zh: 前奏韩庄滚坝以北拆开石堤处应改建闸座，奉旨交尹继善叶存仁相度，议于滚坝以南湖口闸以北添石闸一座，是为湖口双闸，得旨允行
- id: guji-兆惠-event-death
  date: 1764-12-10
  year_of: 1764
  title_zh: 病卒于京师
  desc_zh: 乾隆二十九年十一月病卒，谥文襄，追封武毅谋勇一等公，配享太庙
