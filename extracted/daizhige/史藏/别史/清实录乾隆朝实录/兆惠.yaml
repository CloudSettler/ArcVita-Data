    labels:
      zh: 驻防
    start_date: 1756-09-14
    highlight_event_id: guji-兆惠-event-3
  - key: climax
    name: 环卫厄鲁特游牧之外
    labels:
      zh: 布防
    start_date: 1756-09-16
    highlight_event_id: guji-兆惠-event-3
  - key: closure
    name: 裁汰坐台留察哈尔安台
    labels:
      zh: 节制
    start_date: 1756-09-16
    highlight_event_id: guji-兆惠-event-3
  decisions:
  - date: 1756-09-14
    title_zh: 请于游牧之外周围驻兵
    rationale: 大兵为保护厄鲁特而设，不泥定一地，遇警即行抵敌方合机宜
  - date: 1756-09-16
    title_zh: 裁厄鲁特坐台留察哈尔设台
    rationale: 彻兵后坐台宜汰，厄鲁特还各游牧，酌派察哈尔不足再添绿旗以省费而通邮
events:
- id: guji-兆惠-event-birth
  title_zh: 生于京师乌雅氏家
  date: 1708-01-01
  year_of: 1708
  description: 康熙四十七年生，满洲正黄旗人，字和甫，后由笔帖式起家入军机
- id: guji-兆惠-event-1
  title_zh: 奏请莽噶里克编旗封公
  date: 1756-09-04
  year_of: 1756
  description: 乾隆二十一年八月癸丑谕，兆惠奏吐鲁番回人莽噶里克恳请编旗佐领，得旨施恩封公，照额敏和卓例办理，並赏擒贼有功宰桑等
- id: guji-兆惠-event-2
  title_zh: 议定吐鲁番疆界借种纳粮设台
  date: 1756-09-12
  year_of: 1756
  description: 军机大臣议覆兆惠奏，定额敏和卓管东界辟展至喀喇和卓，莽噶里克管西界伊拉里克至阿斯塔克，借麦千石分年交纳，设托里布拉克等五处台站
- id: guji-兆惠-event-3
  title_zh: 奏定彻兵驻防崆吉斯安济海
  date: 1756-09-16
  year_of: 1756
  description: 八月辛酉谕，兆惠奏大兵自哈萨克彻回拟驻崆吉斯安济海，上命驻于众厄鲁特游牧之外周围布置，裁汰厄鲁特坐台，酌派察哈尔安设台站
- id: guji-兆惠-event-death
  title_zh: 卒于京师谥文襄
  date: 1764-06-10
  year_of: 1764
  description: 乾隆二十九年五月十一卒于京师，追封武毅谋勇一等公，谥文襄，配享太庙，图形紫光阁
