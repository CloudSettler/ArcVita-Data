  decisions:
  - date: 1756-09-04
    title_zh: 保举莽噶里克封公编旗
    rationale: 感戴归诚当优叙以励众回，仿额敏和卓例编旗分佐领以齐制
  - date: 1756-09-12
    title_zh: 议借麦种分年交纳并设台
    rationale: 借种助耕按年纳贮以实边仓，设兵驰递以通声息，划界以止争
- id: guji-兆惠-endeavor-2
  title_zh: 哈萨克彻兵后驻防与台站裁设
  description: 大兵自哈萨克彻回后，筹驻崆吉斯安济海，护卫厄鲁特游牧，裁汰坐台酌留察哈尔安设
  phases:
  - key: brewing
    name: 商议彻兵驻劄处所
