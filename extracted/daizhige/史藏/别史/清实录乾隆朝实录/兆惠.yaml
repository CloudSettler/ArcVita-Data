endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 率军抵叶尔羌围城断粮
  summary_zh: 自乌什横渡戈壁千五百里抵叶尔羌城下以兵单马乏不能合围乃分兵搜村掘窖断刍牧樵采请调绿旗兵马接济以困贼众
  phases:
  - key: brewing
    name: 远涉戈壁抵辉齐阿里克
    labels:
      zh: 远征劳乏
    start_date: 1758-11-02
    highlight_event_id: guji-兆惠-event-yeerqiang
  - key: breakthrough
    name: 侦得城内虚实分兵搜村
    labels:
      zh: 断粮困敌
    start_date: 1758-11-11
    highlight_event_id: guji-兆惠-event-yeerqiang
  - key: climax
    name: 请调库车赛哩木绿旗兵马匹
    labels:
      zh: 请援接济
    start_date: 1758-11-15
    highlight_event_id: guji-兆惠-event-qingyuan
  - key: closure
    name: 严截南路要卡待春再举
    labels:
      zh: 持重待机
    start_date: 1758-11-20
    highlight_event_id: guji-兆惠-event-qingyuan
  decisions:
  - date: 1758-11-11
    title_zh: 不急攻坚城改行断樵汲之策
    rationale: 兵仅四千马皆疲乏围城则力单贼易冲突逃走不如断其村粮窖粟牛羊使其自生内变
  - date: 1758-11-15
    title_zh: 奏请调库车等地绿旗兵送马三千
    rationale: 围城持久非马壮兵足不可故请内地兵马接济并严守痕都斯坦等逃路不使渠魁漏网
- id: guji-兆惠-endeavor-2
  title_zh: 离间布霍二酋抚慰归附伯克
  summary_zh: 乘布拉呢敦怨霍集占妄动之机持原降敕书往谕晓示霍集斯被杀真相抚慰阿布都瓜布以收回众之心分化贼党
  phases:
  - key: brewing
    name: 审知布拉呢敦怨霍集占各守一城
    labels:
      zh: 审机离间
    start_date: 1758-11-11
    highlight_event_id: guji-兆惠-event-yeerqiang
  - key: breakthrough
    name: 持敕往谕布拉呢敦晓示真相
    labels:
      zh: 奉敕招抚
    start_date: 1758-11-16
    highlight_event_id: guji-兆惠-event-zhaofu
  - key: climax
    name: 传旨抚慰阿布都瓜布加赏用其商办军务
    labels:
      zh: 加恩收用
    start_date: 1758-11-18
    highlight_event_id: guji-兆惠-event-zhaofu
  - key: closure
    name: 分化回众使含怨者内应以待官军进取
    labels:
      zh: 分化待取
    start_date: 1758-11-22
    highlight_event_id: guji-兆惠-event-zhaofu
  decisions:
  - date: 1758-11-16
    title_zh: 持原降敕书往谕布拉呢敦
    rationale: 布拉呢敦与霍集占已约各守一城相为声援乘其嫌隙往谕可使其悔附不与霍集占并力死守
  - date: 1758-11-18
    title_zh: 抚慰阿布都瓜布赏缎商办军务
    rationale: 霍集斯降附心诚其弟被霍集占拘禁正可加恩收用破霍集占诳言大兵尽剿回人之说以安众心
events:
- id: guji-兆惠-event-birth
  title_zh: 出生
  date: 1708-01-01
  year_of: 1708
  description_zh: 康熙四十七年生于苏完瓜尔佳氏家后以军功起家为定边将军
- id: guji-兆惠-event-death
  title_zh: 逝世
  date: 1764-06-10
  year_of: 1764
  description_zh: 乾隆二十九年病逝于京师谥忠毅追封武毅谋勇一等公
- id: guji-兆惠-event-yeerqiang
  title_zh: 兵抵叶尔羌城下侦得贼情
  date: 1758-11-11
  year_of: 1758
  description_zh: 十月初三日领马步四千至辉齐阿里克距叶尔羌四十里擒获回人供称霍集占移众粮入城布拉呢敦驻当噶勒齐城大难合围
- id: guji-兆惠-event-qingyuan
  title_zh: 奏请调兵送马严截逃路
  date: 1758-11-15
  year_of: 1758
  description_zh: 以行戈壁千五百里马皆疲乏奏请调库车赛哩木拜等处绿旗兵并送马三千于痕都斯坦巴达克山等要卡驻兵堵截上命永贵舒赫德阿里衮速运接济
- id: guji-兆惠-event-zhaofu
  title_zh: 奉旨招谕布拉呢敦抚慰伯克
  date: 1758-11-18
  year_of: 1758
  description_zh: 遵旨持原降敕书往谕布拉呢敦晓示伯克霍集斯被杀真相传旨抚慰阿布都瓜布赏缎六端商办军营事宜以离间贼党
