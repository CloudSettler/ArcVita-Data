  death_date: 1764-10-26
  era: 清乾隆朝
  reign_ref: 乾隆二十二年
  archetype: 开边经略之武臣
  dilemmas:
  - 驻兵候命以待确信与分兵合击以赴机宜之两难
  - 招降姑息以安反侧与严行剿杀以靖地方之抉择
  - 北路南路畛域分兵与通融接济协同进剿之权衡
  lesson: 用兵当以歼厥渠魁为要，不可姑息养奸，亦不可分彼此畛域，须候命守重与乘机进剿相济，方能靖边宁谧。
  summary_first_person: 我是兆惠，满洲正黄旗人，久历西陲军务，乾隆二十二年秋驻兵巴雅尔郭勒，候遣往哈萨克使臣回营，并探阿睦尔撒纳确信，筹划与永贵会合或赴成衮扎布军营，协力擒剿巴图尔乌巴什与哈萨克锡喇诸贼，复议过冬驻守与台站接济，以期一举荡平准部余孽。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70546.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70546.html
endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 巴雅尔郭勒驻兵候命与筹划合击
  summary: 驻兵巴雅尔郭勒，候哈萨克使臣回营与富德处探报，筹划过博罗塔拉与永贵会合或前赴成衮扎布军营，以定进剿方略。
  phases:
  - key: brewing
    name: 驻兵候信
    labels:
      zh:
      - 驻兵候命
      - 侦探确信
    start_date: 1757-10-14
    highlight_event_id: guji-兆惠-event-bayar
  - key: breakthrough
    name: 奏陈两途
    labels:
      zh:
      - 分兵筹划
      - 会合永贵
    start_date: 1757-10-15
    highlight_event_id: guji-兆惠-event-bayar
  - key: climax
    name: 候命防推诿
    labels:
      zh:
      - 协同进剿
      - 严饬伊犁
    start_date: 1757-10-16
    highlight_event_id: guji-兆惠-event-joint
  - key: closure
    name: 定议速奏
    labels:
      zh:
      - 回奏定夺
      - 地方宁谧
    start_date: 1757-10-18
    highlight_event_id: guji-兆惠-event-joint
  decisions:
  - date: 1757-10-15
    title_zh: 驻兵巴雅尔郭勒候使臣与探报
    rationale: 使臣未归与阿睦尔撒纳确信未定，轻进则粮马不继，守候则可审势合击，故暂驻以待。
  - date: 1757-10-16
    title_zh: 拟分兵过博罗塔拉或赴北路军营
    rationale: 贼首巴图尔乌巴什等窜聚未定，须视确信所在，或与永贵会合，或赴成衮扎布军营，以求全师制胜。
- id: guji-兆惠-endeavor-2
  title_zh: 协同擒剿渠魁与筹议驻守过冬
  summary: 遵旨以全师擒剿巴图尔乌巴什与哈萨克锡喇为先，通融接济北路援兵，不分畛域，并筹议济尔哈朗与额林哈毕尔噶驻守过冬及台站口粮。
  phases:
  - key: brewing
    name: 接济援兵
    labels:
      zh:
      - 通融办给
      - 并队行走
    start_date: 1757-10-18
    highlight_event_id: guji-兆惠-event-tongrong
  - key: breakthrough
    name: 全师制胜
    labels:
      zh:
      - 歼厥渠魁
      - 不分兵搜缉
    start_date: 1757-10-20
    highlight_event_id: guji-兆惠-event-joint
  - key: climax
    name: 严剿余党
    labels:
      zh:
      - 严行剿杀
      - 勿以姑息养奸
    start_date: 1757-10-22
    highlight_event_id: guji-兆惠-event-joint
  - key: closure
    name: 筹议过冬
    labels:
      zh:
      - 驻守过冬
      - 台站接济
    start_date: 1757-10-25
    highlight_event_id: guji-兆惠-event-winter
  decisions:
  - date: 1757-10-19
    title_zh: 通融接济瑚尔起所部马力口粮
    rationale: 北路援兵三百马疲粮竭，若分畛域则追缉中断，通融办给并队行走，方能协力擒贼。
  - date: 1757-10-25
    title_zh: 议于济尔哈朗等处驻兵过冬
    rationale: 进剿未竟而冬近跋涉艰难，若遽彻回巴里坤则来岁重劳，豫筹驻守与台站口粮马匹，方为长策。
events:
- id: guji-兆惠-event-birth
  title_zh: 出生
  date: 1708-01-01
  year_of: 1708
  description: 约康熙四十七年生于满洲正黄旗乌雅氏家，少长从军，后累任要职。
  place_zh: 京师
- id: guji-兆惠-event-bayar
  title_zh: 驻兵巴雅尔郭勒候命
  date: 1757-10-14
  year_of: 1757
  description: 驻兵巴雅尔郭勒，候遣往哈萨克使臣回营及富德处所探阿睦尔撒纳确信，奏陈分兵过博罗塔拉与永贵会合或前赴成衮扎布军营两途。
  place_zh: 巴雅尔郭勒
- id: guji-兆惠-event-joint
  title_zh: 筹议合剿巴图尔乌巴什等贼
  date: 1757-10-18
  year_of: 1757
  description: 奉旨协同成衮扎布与舒赫德速抵伊犁，严拏巴图尔乌巴什与哈萨克锡喇等，以全师制胜，毋得推诿。
  place_zh: 伊犁周边
- id: guji-兆惠-event-tongrong
  title_zh: 接济北路援兵协力追缉
  date: 1757-10-19
  year_of: 1757
  description: 瑚尔起带兵三百接应图伦楚进剿哈萨克锡喇，谕令如相会即并队行走，马力疲乏者通融办给，不分畛域。
  place_zh: 塔尔巴哈台一带
- id: guji-兆惠-event-winter
  title_zh: 议驻守过冬与台站接济
  date: 1757-10-25
  year_of: 1757
  description: 以进剿未竟，议于济尔哈朗与额林哈毕尔噶等处驻劄过冬，豫筹安设台站与口粮马匹接济，并拟彻兵后来京筹办机宜。
  place_zh: 济尔哈朗
- id: guji-兆惠-event-death
  title_zh: 逝世
  date: 1764-10-26
  year_of: 1764
  description: 乾隆二十九年十月初二卒于任，谥文襄，配享太庙，图形紫光阁。
  place_zh: 京师
