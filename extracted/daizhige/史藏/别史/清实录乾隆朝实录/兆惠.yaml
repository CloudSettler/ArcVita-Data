  date: '1758-03-09'
  year_of: 1758
  place: 巴里坤军营
  description: 乾隆二十三年二月朔上以兆惠固执原派兵数候顺德讷数百人同进又坐待青草谕令带兵进发或缓行养马力不得再驻候并将顺德讷兵追回
- id: guji-兆惠-event-yixu
  type: career
