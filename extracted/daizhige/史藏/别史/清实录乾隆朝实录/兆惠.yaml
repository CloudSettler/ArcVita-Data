    title_zh: 秉公审理巴图济尔噶勒马匹隐匿之奏
    rationale: 若徇私曲庇则不能感服厄鲁特人心故须毫无偏袒详悉审拟
- id: guji-兆惠-endeavor-2
  title_zh: 协同南路经营回部
  description: 与靖逆将军雅尔哈善分任剿抚调剂索伦兵力以速定库车乌什诸城
  phases:
  - key: brewing
