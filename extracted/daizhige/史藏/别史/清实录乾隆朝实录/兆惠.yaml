  description: 兆惠等奏军营口粮不敷官兵以马为食上令巴图济尔噶勒等送马暂分厂牧放俟至伊犁再分并严查盗窃
- id: guji-兆惠-event-suolun
  type: career
  title_zh: 索伦缺保送之议被申饬
  date: '1758-03-15'
  year_of: 1758
  place: 军营
  description: 兆惠等请索伦缺于保荐军前一等人员内拣补并令伊灵阿等兼管二等侍卫上斥其错谬申饬仍照常于军前及在家人员内酌补
