  date: '1758-03-12'
  year_of: 1758
  place: 军营
  description: 兆惠富德将去年出兵未经查出侍卫官员分别功次补请议叙并声明罗布藏多尔济等功次上斥其繁琐沽名姑如所请并令查珠勒都斯一路效力人员一并奏闻
- id: guji-兆惠-event-liangma
