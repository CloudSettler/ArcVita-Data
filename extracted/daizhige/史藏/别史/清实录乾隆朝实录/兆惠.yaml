    start_date: 1759-09-24
    highlight_event_id: guji-兆惠-event-2
  decisions:
  - date: 1759-09-20
    title_zh: 胁从遣回阿克苏沙雅尔库车旧地安插
    rationale: 迫胁同行者可遣回本处安插以安生业，久住伊犁亲信者不可轻信须留心防范
  - date: 1759-09-24
    title_zh: 军营马匹加意牧养兼换购布噜特回人马
    rationale: 来年进兵巴达克山马匹最要，不可因内地解马遂不加筹，当尽心自办以资接济
