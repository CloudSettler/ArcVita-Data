endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 吐鲁番回部编旗与屯种善后
  description: 奏办莽噶里克归诚编旗封公，划定与额敏和卓疆界，借给麦种分年交纳，添设台站驰递
  phases:
