  dilemmas:
  - 远征绝域索贼既须示威又须防劳师糜饷之难
  - 旧部被掠偷生留恋妻室当以军法惩创以肃纪纲之难
  lesson: 进兵索贼当谋定后动军纪不肃则开拓无本后勤豫备则凯旋可期
  summary_first_person: 吾兆惠苏完瓜尔佳氏出身内大臣久历西陲乾隆二十四年奉命往英吉沙尔策应富德由斡罕进兵向巴达克山索取逆贼又查出旧日被掠满洲留恋敌境奏请正法并行文豫备凯旋口粮一生以平定准部回部开辟新疆为志
  source_urls:
  - https://daizhige.org/history/qingshilu-qianlong/0599.html
endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 策应富德由斡罕进兵向巴达克山索取逆贼
  summary_zh: 乾隆二十四年秋冬富德请由斡罕一路进兵索贼奉旨令往英吉沙尔策应若今岁未竣富德回叶尔羌办事仍遵旨筹划以期次第进兵使巴达克山畏惧献俘
  phases:
  - key: brewing
    name: 受命筹策应之谋
    labels:
      zh: 筹划
    start_date: 1759-09-01
    highlight_event_id: guji-兆惠-event-ceying
  - key: breakthrough
    name: 分道进兵示威域外
    labels:
      zh: 进兵
    start_date: 1759-10-20
    highlight_event_id: guji-兆惠-event-ceying
  - key: climax
    name: 遣使索贼次第压境
    labels:
      zh: 索贼
    start_date: 1759-10-25
    highlight_event_id: guji-兆惠-event-ceying
  - key: closure
    name: 筹凯旋去留以待圣裁
    labels:
      zh: 候旨
    start_date: 1759-11-01
    highlight_event_id: guji-兆惠-event-kouxian
  decisions:
  - date: 1759-10-25
    title_zh: 亲往英吉沙尔策应富德
    rationale: 以一路进兵孤悬域外非有重臣策应则声援不接故往英吉沙尔会商进止以壮声威
  - date: 1759-11-01
    title_zh: 若岁内未竣则遵旨来京富德回叶尔羌
    rationale: 以大兵久驻绝域糜饷劳人故遵预定部署分驻待命以纾众力而全大局
- id: guji-兆惠-endeavor-2
  title_zh: 整肃军纪查办被掠遗众兼筹凯旋粮运
  summary_zh: 令齐凌扎布清查随军旧档访出康熙雍正年间被掠满洲费雅纳等忍耻偷生留恋妻室不行投回奏请正法以肃军纪又行文军营豫备凯旋官兵口粮羊只以裕归途
  phases:
  - key: brewing
    name: 行查旧档访被掠下落
    labels:
      zh: 稽查
    start_date: 1759-09-15
    highlight_event_id: guji-兆惠-event-chaban
  - key: breakthrough
    name: 得费雅纳等留恋实迹
    labels:
      zh: 得实
    start_date: 1759-10-20
    highlight_event_id: guji-兆惠-event-chaban
  - key: climax
    name: 奏请正法家口充赏
    labels:
      zh: 正法
    start_date: 1759-10-26
    highlight_event_id: guji-兆惠-event-chaban
  - key: closure
    name: 行文豫备凯旋口粮羊只
    labels:
      zh: 善后
    start_date: 1759-10-27
    highlight_event_id: guji-兆惠-event-kouxian
  decisions:
  - date: 1759-10-26
    title_zh: 奏请将费雅纳都什格即行正法
    rationale: 以满洲世仆被掠不归反留恋妻室情罪可恶若不执法惩创则军纪驰懈故请正法以昭炯戒
  - date: 1759-10-27
    title_zh: 行文豫备凯旋官兵口粮羊只
    rationale: 以大功将成官兵凯旋在即非豫储牛羊口粮则归途乏食故先期行文沿途豫备以裕军行
events:
- id: guji-兆惠-event-birth
  date: 1708
  year_of: 1708
  title_zh: 兆惠生于康熙四十七年
  description_zh: 苏完瓜尔佳氏出身内大臣之家少以笔帖式入仕后历任内大臣副都统渐膺重任
- id: guji-兆惠-event-death
  date: 1764
  year_of: 1764
  title_zh: 兆惠卒于乾隆二十九年
  description_zh: 以平定准噶尔回部功封一等武毅谋勇公 pictures 定西将军卒后配享紫光阁赐谥文襄
- id: guji-兆惠-event-ceying
  date: 1759-10-25
  year_of: 1759
  title_zh: 奉命往英吉沙尔策应富德索贼
  description_zh: 乾隆二十四年十月富德奏由斡罕一路进兵向巴达克山索取逆贼奉旨令兆惠往英吉沙尔策应若岁内未竣富德回叶尔羌兆惠仍遵旨来京以待凯奏
- id: guji-兆惠-event-chaban
  date: 1759-10-26
  year_of: 1759
  title_zh: 奏查被掠满洲费雅纳等留恋不归请正法
  description_zh: 据齐凌扎布查出随西安马甲闲散都什格于康熙五十七年在噶斯被掠镶红旗护军费雅纳等于雍正九年在和通呼尔哈被掠忍耻偷生留恋妻室不行投回奏请奉旨即行正法家口充赏
- id: guji-兆惠-event-kouxian
  date: 1759-10-27
  year_of: 1759
  title_zh: 行文豫备凯旋官兵口粮羊只
  description_zh: 与军营行文令五吉等豫备凯旋官兵口粮羊只朝廷以军营需马仍急饬加意趱解毋以彻兵在即而从缓观望
