  - key: breakthrough
    name: 请封公爵仿例编旗
    labels:
      zh: 建制
    start_date: 1756-09-04
    highlight_event_id: guji-兆惠-event-1
  - key: climax
    name: 划界借种设台递
    labels:
      zh: 经制
    start_date: 1756-09-12
    highlight_event_id: guji-兆惠-event-2
  - key: closure
    name: 定纳粮贮所与赏赉
