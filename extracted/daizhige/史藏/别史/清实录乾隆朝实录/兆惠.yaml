    start_date: 1759-08-25
    highlight_event_id: guji-兆惠-event-2
  - key: climax
    name: 甄别乌沙克亲信与胁从遣回本处
    labels:
      zh: 甄别
    start_date: 1759-09-15
    highlight_event_id: guji-兆惠-event-2
  - key: closure
    name: 牧养换购马匹待来年进兵
