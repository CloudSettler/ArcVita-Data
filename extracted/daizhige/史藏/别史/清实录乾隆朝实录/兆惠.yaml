      zh: 奉旨南驰
    start_date: 1758-08
    highlight_event_id: guji-兆惠-event-2
  - key: breakthrough
    name: 领索伦精兵会合雅尔哈善
    labels:
      zh: 合军库车
    start_date: 1758-08
    highlight_event_id: guji-兆惠-event-2
  - key: climax
    name: 分兵另取一城乘胜追袭
    labels:
      zh: 乘胜穷追
    start_date: 1758-09
    highlight_event_id: guji-兆惠-event-2
  - key: closure
    name: 直取叶尔羌喀什噶尔
    labels:
      zh: 直捣巢穴
    start_date: 1758-10
    highlight_event_id: guji-兆惠-event-2
  decisions:
  - date: 1758-08
    title_zh: 即领兵与雅尔哈善会合
    rationale: 库车满洲兵少不敷调遣坐失擒贼机会须合军以厚兵力断不可坐困孤城
  - date: 1758-09
    title_zh: 分兵另取一城换马进剿
    rationale: 贼远道来援以逸待劳若迫其入沙雅尔阿克苏则与直取叶尔羌无异故当分兵并力攻击以获渠魁
events:
- id: guji-兆惠-event-birth
  date: 1708
  year_of: 1708
  title_zh: 兆惠出生
  description: 康熙四十七年出生于满洲正黄旗后以笔帖式从军累迁至定边将军
- id: guji-兆惠-event-1
  date: 1758-07
  year_of: 1758
  title_zh: 分兵擒剿厄鲁特余孽
  description: 乾隆二十三年秋与富德分兵自造哈至和尔岱海喇巴特搜捕厄鲁特余孽并侦探哈萨克锡喇信息约会于沙喇伯勒
- id: guji-兆惠-event-2
  date: 1758-08
  year_of: 1758
  title_zh: 奉旨速赴回部合剿库车
  description: 雅尔哈善库车击败霍集占后奉旨就近领索伦兵二千余与雅尔哈善会合不得坐困库车须分兵另取一城乘胜追擒渠魁
- id: guji-兆惠-event-death
  date: 1764-12-10
  year_of: 1764
  title_zh: 兆惠病逝京师
  description: 平定准回两部功成封一等武毅谋勇公后以劳瘁病逝于京师乾隆亲临奠醊谥文襄配享紫光阁首位
