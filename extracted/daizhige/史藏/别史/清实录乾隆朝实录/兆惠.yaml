  decisions:
  - date: 1759-09-18
    title_zh: 暂收杂粮一千四百帕特玛谋生户一万二千腾格
    rationale: 霍集占额外科敛又抢掠后民生甚艰，暂轻其赋以苏民力，俟辛巳年再定永则
  - date: 1759-09-18
    title_zh: 以和什克伯克署阿奇木素赉璊办商伯克
    rationale: 叶尔羌大伯克存者甚少，择奋勉旧人署理以系人心，收入官地亩园林以充公用
- id: guji-兆惠-endeavor-2
  title_zh: 协剿穷追与甄别安插降众
  summary: 配合富德追霍集占至巴达克山界，收降回厄万余，安插胁从于旧地，防范亲信旧党，预筹马匹
  phases:
