      raw: 乾隆二十九年十一月十八日卒
  birth_date: 1708
  death_date: 1764-12-10
  era: 清代
  reign_ref: 乾隆
  archetype: 经略西陲之名将
  dilemmas:
  - 穷追阿睦尔撒纳入哈萨克与隆冬彻兵休养士马之两难
  - 严防厄鲁特游牧通贼与加恩养赡以安众心之权衡
  - 对霍集占加兵威剿与准其纳贡投诚之抉择
  lesson: 体上意而慎边计，以恩威并用绥远，以屯台耕守固本，功成不居劳而不伐
  summary_first_person: 余兆惠受高宗知遇，领兵定边，追擒阿逆于哈萨克，隆冬奉旨彻兵，释放俘虏以示怀柔，设台置屯，安插厄鲁特，遣使晓谕回部，惟愿边陲永靖，士马得休，不敢贪功生事
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70524.html
endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 彻兵哈萨克追擒阿睦尔撒纳
  summary: 乾隆二十一年秋冬领定边右副将军事，奉旨隆冬彻兵，留兵袭扰阿布赉，释哈萨克俘虏，晓谕擒献阿逆
  phases:
  - key: brewing
    name: 大兵临哈萨克索逆
    labels:
      zh:
      - 追擒
      - 晓谕
    start_date: 1756-07
    highlight_event_id: guji-兆惠-event-chebing-1756
  - key: breakthrough
    name: 两败哈萨克迎敌之众
    labels:
      zh:
      - 进剿
      - 威服
    start_date: 1756-09
    highlight_event_id: guji-兆惠-event-chebing-1756
  - key: climax
    name: 奉旨彻兵释俘加恩
    labels:
      zh:
      - 彻兵
      - 怀柔
    start_date: 1756-10
    highlight_event_id: guji-兆惠-event-chebing-1756
  - key: closure
    name: 通饬鄂拓克防哈萨克待明岁索取
    labels:
      zh:
      - 防范
      - 待机
    start_date: 1756-10
    highlight_event_id: guji-兆惠-event-chebing-1756
  decisions:
  - date: 1756-10
    title_zh: 酌派兵袭阿布赉使其不得宁处
    rationale: 彻兵之后不可使贼安居，故留精兵袭扰兼饬各鄂拓克防范
  - date: 1756-10
    title_zh: 释放哈萨克俘虏给粮赏缎
    rationale: 原无得罪天朝，施恩释放可使众哈萨克感戴而擒献阿逆
- id: guji-兆惠-endeavor-2
  title_zh: 安插厄鲁特设台屯田绥靖回部
  summary: 奏设台站种地章程，安置赴巴里坤厄鲁特给粮耔种，并遣使晓谕布拉呢敦霍集占相机定回部贡赋
  phases:
  - key: brewing
    name: 厄鲁特生计艰难赴巴里坤就食
    labels:
      zh:
      - 赈济
      - 安插
    start_date: 1756-10
    highlight_event_id: guji-兆惠-event-taizhan-1756
  - key: breakthrough
    name: 奏定每台兵马口粮种地章程
    labels:
      zh:
      - 台站
      - 屯田
    start_date: 1756-10
    highlight_event_id: guji-兆惠-event-taizhan-1756
  - key: climax
    name: 遣侍卫晓谕回部饬阿敏道进兵
    labels:
      zh:
      - 晓谕
      - 进兵
    start_date: 1756-10
    highlight_event_id: guji-兆惠-event-huibu-1756
  - key: closure
    name: 明春给耔种耕廋集秋收后回游牧
    labels:
      zh:
      - 耕种
      - 归牧
    start_date: 1757-03
    highlight_event_id: guji-兆惠-event-taizhan-1756
  decisions:
  - date: 1756-10
    title_zh: 留巴里坤厄鲁特给口粮待春种地
    rationale: 若遣回游牧所给口粮仅延数日，不如留养授种自食其力并免流为盗
  - date: 1756-10
    title_zh: 令阿敏道公同商议速定阿克苏库车
    rationale: 霍集占反复无常不立贡赋，须相机进兵绥靖以杜后患
