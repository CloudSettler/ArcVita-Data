endeavors:
- id: guji-兆惠-endeavor-1
  title_zh: 轻骑驻扎巴里坤总办西路军需
  summary: 奉旨由北路速赴西路驻扎巴里坤，办理马匹口粮催督台站及管辖达什达瓦属人与新降厄鲁特众
  phases:
  - key: brewing
    name: 北路无事西路孔急
    labels:
      zh:
      - 筹备军需
      - 巴里坤紧要
    start_date: 1755-11-01
    highlight_event_id: guji-兆惠-event-barlikun
  - key: breakthrough
    name: 奉旨轻骑速赴
    labels:
      zh:
      - 毋庸带兵
      - 驰赴驻扎
    start_date: 1755-12-28
    highlight_event_id: guji-兆惠-event-barlikun
  - key: climax
    name: 兼管台站至额林哈毕尔噶
    labels:
      zh:
      - 总办台站
      - 督办粮马
    start_date: 1755-12-29
    highlight_event_id: guji-兆惠-event-courier
  - key: closure
    name: 斟酌缓急分别办理
    labels:
      zh:
      - 整饬驿递
      - 不得拘泥
    start_date: 1756-01-05
    highlight_event_id: guji-兆惠-event-courier
  decisions:
  - date: 1755-12-28
    title_zh: 毋庸带领兵丁轻骑前往
    rationale: 西路需干员料理马粮台站而非增兵，轻骑速进方能及时接办，不误军行
  - date: 1756-01-05
    title_zh: 分别事务缓急办驿递
    rationale: 前此和起等不计缓急概行驿递致奉饬，今须斟酌分别，既不壅滞应奏，亦不滥用驿传
- id: guji-兆惠-endeavor-2
  title_zh: 经营北路台站成规并交接
  summary: 与富德等在北路办出台站成规，奉旨交由阿思哈接办，以专心西路巴里坤事务
  phases:
  - key: brewing
    name: 北路台站初创
    labels:
      zh:
      - 会办台站
      - 渐具规模
    start_date: 1755-06-01
    highlight_event_id: guji-兆惠-event-north
  - key: breakthrough
    name: 办有成规可为法守
    labels:
      zh:
      - 成规既定
      - 行之有效
    start_date: 1755-12-28
    highlight_event_id: guji-兆惠-event-north
  - key: climax
    name: 交由阿思哈接办
    labels:
      zh:
      - 交接北路
      - 专办西路
    start_date: 1755-12-29
    highlight_event_id: guji-兆惠-event-north
  - key: closure
    name: 两路分任各有专责
    labels:
      zh:
      - 分路责成
      - 军邮通畅
    start_date: 1756-01-10
    highlight_event_id: guji-兆惠-event-courier
  decisions:
  - date: 1755-12-28
    title_zh: 北路台站交阿思哈接办
    rationale: 北路现在无事且已有成规，交人接办可使专力西路要地，免分心两顾
  - date: 1755-12-29
    title_zh: 富德专管额林哈毕尔噶以西
    rationale: 台站绵长须分段责成，自巴里坤至额林哈毕尔噶归己管理，其西仍由富德管理，界限分明
events:
- id: guji-兆惠-event-birth
  date: 1708-01-01
  year_of: 1708
  title_zh: 兆惠出生
  description: 康熙四十七年生于满洲正黄旗乌雅氏家，後以笔帖式入仕累迁军机要职
- id: guji-兆惠-event-barlikun
  date: 1755-12-28
  year_of: 1755
  title_zh: 奉旨速赴西路驻扎巴里坤办事
  description: 乾隆以巴里坤办理马匹口粮催督台站及管辖达什达瓦属人并新降众为紧要，命兆惠毋庸带领兵丁轻骑前往驻扎，并管理自巴里坤至额林哈毕尔噶台站
- id: guji-兆惠-event-north
  date: 1755-12-28
  year_of: 1755
  title_zh: 北路台站成规交阿思哈接办
  description: 乾隆谕北路台站事务经富德兆惠等办有成规，著阿思哈接办，兆惠专赴西路
- id: guji-兆惠-event-courier
  date: 1756-01-05
  year_of: 1756
  title_zh: 奉谕斟酌驿递分别办理
  description: 乾隆以前此和起等概行驿递致饬，命兆惠到日斟酌事务分别办理不得过于拘泥，应奏之事不得迟缓
- id: guji-兆惠-event-death
  date: 1764-12-10
  year_of: 1764
  title_zh: 兆惠病逝于京
  description: 乾隆二十九年冬以定边将军功封一等武毅谋勇公後病逝，谥文襄，入祀贤良祠
