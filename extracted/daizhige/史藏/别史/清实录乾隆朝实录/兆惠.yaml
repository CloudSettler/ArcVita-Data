      zh: 留兵备用
    start_date: 1758-03-10
    highlight_event_id: guji-兆惠-event-3
  - key: climax
    name: 通报进剿胜况促南路及时进取
    labels:
      zh: 军情互通
    start_date: 1758-03-18
    highlight_event_id: guji-兆惠-event-3
  - key: closure
