- id: guji-兆惠-event-birth
  type: birth
  title_zh: 诞生于满洲正黄旗
  date: 1708
  year_of: 1708
  location_zh: 北京
  description: 康熙四十七年约生于满洲正黄旗吴雅氏家，袭父职入仕内务府
