  lesson: 君臣家人之语不可轻泄，躁进觊觎反失其位，谨默守分方能久安
  summary_first_person: 我以先臣之子行走内廷，协办大学士有年，只因将上年在热河论及嵇璜曹文埴去留之闲语转告同列，遂被斥为言语不谨躁进，失却实授之机，一生以清慎自持，方悟守拙为安
