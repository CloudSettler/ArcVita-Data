endeavors:
- id: guji-刘墉-endeavor-1
  title_zh: 太原知府任上牵连阳曲亏空案
  summary_zh: 任山西太原府知府期间，因阳曲县知县段成功侵蚀库项逾万，上司巡抚和其衷徇纵，藩司文绶及我扶同容隐，事发被议斩监候
  phases:
  - key: brewing
    name: 出守太原
    labels:
      zh:
      - 守土亲民
      - 钱粮稽核
    start_date: '1762'
    highlight_event_id: guji-刘墉-event-1762-taizhi
  - key: breakthrough
    name: 阳曲亏空发觉
    labels:
      zh:
      - 亏空败露
      - 属员帮补
    start_date: '1766-04-01'
    highlight_event_id: guji-刘墉-event-1766-lianlei
  - key: climax
    name: 特派审拟定罪
    labels:
      zh:
      - 从严惩创
      - 整饬吏治
    start_date: '1766-04-15'
    highlight_event_id: guji-刘墉-event-1766-lianlei
  - key: closure
    name: 改拟军台效力
    labels:
      zh:
      - 宽免死罪
      - 效力赎罪
    start_date: '1766-05-01'
    highlight_event_id: guji-刘墉-event-1766-juntai
  decisions:
  - date: '1766-04-01'
    title_zh: 不举劾隐饰阳曲亏空
    rationale: 迫于上司和其衷徇纵之势，失于举劾，以致扶同容隐获罪
  - date: '1766-04-15'
    title_zh: 服罪听勘不复文饰
    rationale: 库项亏缺属实，帮补弥缝已成积习，惟静候部议以明法纪
- id: guji-刘墉-endeavor-2
  title_zh: 发往军台效力赎罪图新
  summary_zh: 蒙高宗宽恩免死，发往军台效力，在边任劳任怨，以赎前愆，为日后复起清正名臣之基
  phases:
  - key: brewing
    name: 奉旨宽免
    labels:
      zh:
      - 法外施恩
      - 以功赎罪
    start_date: '1766-05-01'
    highlight_event_id: guji-刘墉-event-1766-juntai
  - key: breakthrough
    name: 赴军台效力
    labels:
      zh:
      - 边地劳役
      - 砥砺自新
    start_date: '1766-06-01'
    highlight_event_id: guji-刘墉-event-1766-juntai
  - key: climax
    name: 勤慎供职
    labels:
      zh:
      - 恪守法度
      - 不辞劳瘁
    start_date: '1767-01-01'
    highlight_event_id: guji-刘墉-event-1766-juntai
  - key: closure
    name: 赎罪复用之基
    labels:
      zh:
      - 改过自新
      - 复邀甄录
    start_date: '1769-01-01'
    highlight_event_id: guji-刘墉-event-death
  decisions:
  - date: '1766-06-01'
    title_zh: 甘赴军台效力不辞
    rationale: 既蒙宽典免死，惟当效力边台，以实际劳绩洗刷容隐之咎
  - date: '1767-01-01'
    title_zh: 在台恪守廉慎
    rationale: 目击山西吏治渎坏之祸，深戒贪黩那移，立志以清廉复进
