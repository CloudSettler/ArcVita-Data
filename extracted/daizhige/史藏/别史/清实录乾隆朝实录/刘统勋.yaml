  - key: breakthrough
    name: 简任尚书综理刑工
    labels:
      zh: 执掌部务
    start_date: '1750-01-01'
    highlight_event_id: guji-刘统勋-event-1724-jinshi
  - key: climax
    name: 协办大学士赞理军国
    labels:
      zh: 入赞枢机
    start_date: '1757-01-01'
    highlight_event_id: guji-刘统勋-event-1761-fuyu
  - key: closure
    name: 病逝任所赐谥文正
    labels:
      zh: 盖棺定论
    start_date: '1773-01-29'
    highlight_event_id: guji-刘统勋-event-1773-death
  decisions:
  - date: '1757-06-01'
    title_zh: 严核河工疏防分别议处议叙
    rationale: 非人力所能预备者原情，甫经修理辄决者惩疏防，保护平稳者劝有功
  - date: '1761-08-06'
    title_zh: 实心实力查勘不因钦差观望
    rationale: 地方大员不得坐守待钦差，必先行相度筹办，有成局即当河流复旧
