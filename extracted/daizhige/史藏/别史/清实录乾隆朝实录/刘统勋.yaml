  - key: closure
    name: 随时酌减
    labels:
      zh:
      - 柴价渐平则减
      - 永资捍御
    start_date: 1762-04-08
    highlight_event_id: guji-刘统勋-event-tashan
  decisions:
  - date: 1762-04-07
    title_zh: 议加柴价至每百斤一钱
    rationale: 非河工秫苇可比，原定九分不敷购办，加一分则民乐售而工易固
  - date: 1762-04-08
    title_zh: 塔山尖山坝宜随时防护
    rationale: 石坝横截海中直逼大溜为扼要关键，涨沙未远则加镶防护，远则改筑条石
