  summary_first_person: 吾乃刘统勋山东诸城人心存直道以清勤自砺乾隆十八年冬奉命与策楞舒赫德会办江南铜山漫口相度溜势主开引河去湾取直复归故道并会查罗伦黄煊等亏空勒限追赔平生以实心任事不饰不挠为念此卷所载即吾在徐淮堤工效力之始末也
