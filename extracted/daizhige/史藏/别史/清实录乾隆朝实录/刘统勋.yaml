    start_date: '1761-08-06'
    highlight_event_id: guji-刘统勋-event-1761-fuyu
  - key: breakthrough
    name: 会勘杨桥夺溜
    labels:
      zh: 相度水势
    start_date: '1761-08-20'
    highlight_event_id: guji-刘统勋-event-1761-fuyu
  - key: climax
    name: 督率抢筑引溜归槽
    labels:
      zh: 堵筑疏浚
    start_date: '1761-09-01'
    highlight_event_id: guji-刘统勋-event-1761-fuyu
  - key: closure
    name: 会商东省善后
    labels:
      zh: 协济善后
    start_date: '1761-10-01'
    highlight_event_id: guji-刘统勋-event-1761-fuyu
  decisions:
  - date: '1761-08-06'
    title_zh: 不待汇册随查随赈
    rationale: 水灾猝至室庐一空，若待造册核定必致失所，故分乡设厂就近糊口
  - date: '1761-09-01'
    title_zh: 选调南河熟练弁兵协济豫工
    rationale: 豫省谙练桩埽者少，必借南河熟手方能及时堵筑，故会同尹继善高晋挑选调往
- id: guji-刘统勋-endeavor-2
  title_zh: 历任部曹登庸宰辅整饬吏治
  summary: 由进士历任刑工吏部尚书协办大学士东阁大学士，以清正综核佐理军国
  phases:
  - key: brewing
    name: 进士入仕历练部曹
