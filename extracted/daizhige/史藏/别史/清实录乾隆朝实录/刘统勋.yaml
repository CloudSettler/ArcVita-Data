  - 直陈大学士与尚书之失，恐被指为幸进攻讦，有伤风俗人心
  - 欲革封章代作与中军营私积弊，又恐操切扰动，反致官员无所措手
  lesson: 秉公直言当存国体，整饬积弊当审缓急轻重
  summary_first_person: 我是刘统勋，官左都御史，于乾隆六年冬屡疏言事，主张禁胥吏代作封章，整饬督抚提镇中军奔走营私之风，直陈张廷玉亲族盈满与讷亲职繁任锐之虞，并别议浙省海塘缓急，蒙上谕发明并付部议行
