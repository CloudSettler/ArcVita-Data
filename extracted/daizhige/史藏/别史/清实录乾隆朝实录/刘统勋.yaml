  decisions:
  - date: '1741-12-05'
    title_zh: 奏请定胥吏代作封章处分
    rationale: 封章代作则易生挟嫌报复与招摇漏泄，故请照漏泄与作奸例议处书吏并官员
  - date: '1741-12-06'
    title_zh: 奏请禁革中军奔走营私
    rationale: 中军本为营务领袖，不应充私役经营宴会并引援伶优，故请禁付托米盐并严参营私者
- id: guji-刘统勋-endeavor-2
  person_qid: guji-刘统勋
  title_zh: 劾抑权要并议海塘缓急
  summary_zh: 以张姚两姓居官众多恐致盈满，请停升转三年，以讷亲兼务太多任事过锐请裁度训示，并别议浙塘改建缓急，请遣大臣覆勘
  phases:
  - key: brewing
    name: 察知盈满专务之象
    labels:
      zh:
      - 察访
      - 舆论
    start_date: '1741-12-06'
    highlight_event_id: guji-刘统勋-event-1741-hezou
  - key: breakthrough
    name: 两疏并陈权要
    labels:
      zh:
      - 直谏
      - 弹劾
    start_date: '1741-12-07'
    highlight_event_id: guji-刘统勋-event-1741-hezou
  - key: climax
    name: 别议海塘缓急
    labels:
      zh:
      - 海塘
      - 工程
    start_date: '1741-12-10'
    highlight_event_id: guji-刘统勋-event-1741-haitang
  - key: closure
    name: 发摺明谕付勘议
    labels:
      zh:
      - 覆勘
      - 定议
    start_date: '1741-12-11'
    highlight_event_id: guji-刘统勋-event-1741-haitang
  decisions:
  - date: '1741-12-07'
    title_zh: 请裁抑张姚亲族升转并省减讷亲事务
    rationale: 大名之下当慎晚节，亲族多则易生瞻顾，兼务繁则易致旷废，故请停转与裁度以保福禄事功
  - date: '1741-12-10'
    title_zh: 请缓草塘改建先固南北要塘
    rationale: 草塘平稳可待水归再筹，海盐仁钱及南岸诸塘逼近残缺更急，故请会勘防护堵筑以安衽席
