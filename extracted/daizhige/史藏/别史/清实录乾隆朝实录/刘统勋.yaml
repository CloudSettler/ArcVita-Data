  dilemmas:
  - 督抚监守与藩库亏空既已数十万而漫无觉察当严参还是留办追赃
  - 书吏畏刑妄认与奏报库存互异当以刑求定案还是以朱簿实存滚算核实
  - 大案发觉已逾月而无头绪当专责督抚还是别遣大臣驰驿会审
  lesson: 钱粮出纳必以朱簿实存与收放案据滚算比较不可单以奏报较对定侵蚀大案必拘齐人犯速得实情会同审讯方能杜窳弊而服人心
  summary_first_person: 我刘统勋以协办大学士奉命驰驿江南会同查办江苏藩库耗羡存公亏空七十余万一案深知督抚盘库出结具文蠹吏侵蚀必有别故惟当逐款核对拘齐人犯根究实情不以严刑勒认为了事庶钱粮得清而国法得伸
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0619.html
