    rationale: 正溜直趋力大难径堵惟取直引溜东归故道堵筑方易为力故力主疏导为先
  - date: 1753-10-15
    title_zh: 请以徐属灾民开挖充工代赈
    rationale: 灾黎嗷嗷待哺开河需夫孔多以工代赈一举两得既速集人力又全活民生
- id: guji-刘统勋-endeavor-2
