endeavors:
- id: guji-刘统勋-endeavor-1
  title_zh: 驰赴豫省督办贾鲁河夺溜归槽
  summary: 乾隆二十六年秋豫省祥符黑堽口漫溢黄溜夺趋贾鲁河，奉命星速驰驿督率查办堵筑疏浚
  phases:
  - key: brewing
    name: 星速驰驿赴豫
    labels:
