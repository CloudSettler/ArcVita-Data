events:
- id: guji-刘统勋-event-birth
  title_zh: 出生于山东诸城
  date: '1700'
  year_of: 1700
  description: 康熙三十九年生于山东诸城刘氏后登雍正二年进士入仕
- id: guji-刘统勋-event-1
  title_zh: 驻巴里坤筹马被申饬
  date: '1755-10-05'
  year_of: 1755
  description: 乾隆二十年九月戊子奉旨速筹马五六千供西路北路夹攻阿睦尔撒纳又因听信永常檄调甘肃绿营被旨斥张皇失措令速办马驼口粮即日进发
- id: guji-刘统勋-event-2
  title_zh: 以乖谬贻误革职拿解
  date: '1755-10-13'
  year_of: 1755
  description: 乾隆二十年九月丙申上以其奏请退哈密不问班第声息糜费钱粮马不适用且歧视满汉不可宽恕著革职拿解来京治罪子刘墉并革职交刑部
- id: guji-刘统勋-event-death
  title_zh: 卒于京师
  date: '1773-01-27'
  year_of: 1773
  description: 复起后历任宰辅以清廉勤慎著称乾隆三十七年十二月卒谥文正
