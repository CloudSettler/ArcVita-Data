      - 酌量议加
    start_date: 1762-04-06
    highlight_event_id: guji-刘统勋-event-chaijia
  - key: climax
    name: 议定加价
    labels:
      zh:
      - 百斤加至一钱
      - 报销有准
    start_date: 1762-04-07
