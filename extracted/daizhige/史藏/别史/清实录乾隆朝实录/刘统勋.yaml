  decisions:
  - date: 1762-04-04
    title_zh: 断石工断难措手
    rationale: 柴塘沙性涩汕桩下动摇，内移数十丈则毁斥田庐，不忍卫民而先殃民
  - date: 1762-04-05
    title_zh: 定力缮柴塘补偏救弊
    rationale: 潮趋北大亹关海宁钱塘利害，惟定岁修固塘根增坦水石篓可尽人事
- id: guji-刘统勋-endeavor-2
  title_zh: 协办朝政核议柴价
  summary_zh: 与傅恒等会同督抚议加柴价，俾民乐运售官易集事，并随时酌减
