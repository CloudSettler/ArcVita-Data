    rationale: 使邮递迅速大军遄行有据
  - date: 1792-01-05
    title_zh: 增给余马二百余以资替换
    rationale: 口外站远草枯马易疲乏到营即可得战马
- id: guji-勒保-endeavor-2
  title_zh: 抚循青海番众酌议管束
  summary: 议蒙古边界番众归并西宁兼管请暂仍旧化导俟孚再授职衔
  phases:
  - key: brewing
    name: 议番归西宁兼管
    labels:
      zh: 体察
    start_date: 1791-11-01
    highlight_event_id: guji-勒保-event-3
  - key: breakthrough
    name: 查明生番游牧难设头目
    labels:
      zh: 查明
    start_date: 1791-12-01
    highlight_event_id: guji-勒保-event-3
  - key: climax
    name: 奏请暂仍其旧广为化导
    labels:
      zh: 奏陈
    start_date: 1792-01-01
    highlight_event_id: guji-勒保-event-3
  - key: closure
    name: 俟情孚再授千户百户
    labels:
      zh: 绥远
    start_date: 1792-01-15
    highlight_event_id: guji-勒保-event-3
  decisions:
  - date: 1792-01-15
    title_zh: 生番暂不设头目仍旧化导
    rationale: 番居深山搬移无定语言不通骤设恐惊扰俟钦服再授衔管束
  - date: 1792-01-10
    title_zh: 青海扎萨克牧马以待索伦兵
    rationale: 索伦达呼尔兵新正下旬到宁先期牧放临期传调不误
