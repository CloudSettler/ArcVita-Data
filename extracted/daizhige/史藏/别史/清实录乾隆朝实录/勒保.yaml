  title_zh: 驻西宁筹办援藏驼马台站
  summary: 驻劄西宁筹备驼马口粮柴薪并安设口外台站以通青海赴藏孔道
  phases:
  - key: brewing
    name: 受命赴宁筹边
    labels:
      zh: 筹备
    start_date: 1791-10-01
    highlight_event_id: guji-勒保-event-1
  - key: breakthrough
    name: 储备驼马口粮齐备
    labels:
      zh: 储备
    start_date: 1791-11-15
    highlight_event_id: guji-勒保-event-1
  - key: climax
    name: 福康安出塞无误
    labels:
      zh: 转输
    start_date: 1791-12-01
    highlight_event_id: guji-勒保-event-1
  - key: closure
    name: 台站分派巡查就绪
    labels:
      zh: 善后
    start_date: 1792-01-01
    highlight_event_id: guji-勒保-event-2
  decisions:
  - date: 1791-12-01
