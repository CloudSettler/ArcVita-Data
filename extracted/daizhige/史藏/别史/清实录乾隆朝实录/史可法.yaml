    title_zh: 就督师江北不居中枢
    rationale: 知马阮当国难有为，愿出外任劳以系江北人心
  - date: 1645-04-18
    title_zh: 拒降死守扬州
    rationale: 兵顿饷竭无可为，唯有一死以报国以全臣节
