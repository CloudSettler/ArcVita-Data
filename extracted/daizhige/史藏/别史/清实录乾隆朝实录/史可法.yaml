  title_zh: 乾隆御制褒忠勒石梅花岭祠
  date: 1777-07-09
  year_of: 1777
  place_zh: 扬州梅花岭史可法祠
  summary: 乾隆得复书原书于内阁，亲制诗文题像，命弆卷于梅花岭祠并勒石祠壁以垂久远
