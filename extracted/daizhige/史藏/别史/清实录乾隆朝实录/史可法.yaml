    highlight_event_id: guji-史可法-event-qianlong-honor
  decisions:
  - date: 1645-01-01
    title_zh: 复书不断然诟谇
    rationale: 心折于正理而不得不强辞以辩，仍存明臣尊明之义
  - date: 1777-07-09
    title_zh: 请以诗文画像札槁勒石
    rationale: 乾隆以为不必讳亦不可讳，当以忠迹励臣节慎君纲
events:
- id: guji-史可法-event-birth
  title_zh: 生于河南祥符
  date: 1601
  year_of: 1601
  place_zh: 河南开封祥符
  summary: 明万历二十九年生，崇祯初登进士，历仕至南都兵部尚书
- id: guji-史可法-event-dushi
  title_zh: 拥立弘光督师江北
  date: 1644-06-15
  year_of: 1644
  place_zh: 南京扬州
  summary: 拥立福王即位弘光，进大学士督师江北，分镇四镇，驻节扬州筹饷练兵
- id: guji-史可法-event-fushu
  title_zh: 复书睿亲王多尔衮
  date: 1645-01-01
  year_of: 1645
  place_zh: 扬州军前
  summary: 答睿亲王致书，引春秋大义斥偏安之非，语多不屈而无诟谇之言
- id: guji-史可法-event-death
  title_zh: 扬州城破殉国
  date: 1645-05-20
  year_of: 1645
  place_zh: 扬州
  summary: 清军破扬州，不屈遇害，四月二十五日殉国，葬梅花岭
