  dilemmas:
  - 拥立福王后权奸掣肘，知江北难守而不能退避，唯以一死报国
  - 面对睿亲王招降大义与保全生灵两难，强辞复书以明臣节而不失体面
  lesson: 孤忠不可恃而臣节不可亏，君纲慎则忠迹显
  summary_first_person: 我幼慕大义，历仕明朝，督师江北，知福王不惠而兵饷已竭，唯守扬州以死报国，复书睿亲王以明尊明之义，幸得后世不讳吾言，勒石维扬，千秋可鉴
