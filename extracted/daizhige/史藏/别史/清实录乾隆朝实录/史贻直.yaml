  dilemmas:
  - 封疆任重与朝阙需才之间何去何从
  - 守正持重与迎合时趋之间如何自处
  lesson: 历事三朝以谨慎勤勉持身，老成谋国終得完节。
  summary_first_person: 吾溧阳史贻直，起家翰林，历抚江南，总督漕运，入阁辅政，惟以清慎自持，身后得祀乡贤，差慰平生。
