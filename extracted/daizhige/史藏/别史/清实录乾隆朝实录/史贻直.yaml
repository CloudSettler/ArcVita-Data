endeavors:
- id: guji-史贻直-endeavor-1
  title_zh: 科第起家与江南封疆
  summary_zh: 由进士入翰林，外任道府，擢巡抚江苏，总督江南，治水赈荒，清查亏空，为入阁辅政之基。
  phases:
  - key: brewing
    name: 进士入翰林
    labels:
      zh: 读书入仕
    start_date: 1700
    highlight_event_id: guji-史贻直-event-jinshi
  - key: breakthrough
    name: 外任道府历练
    labels:
      zh: 外放治民
    start_date: 1715
    highlight_event_id: guji-史贻直-event-jinshi
  - key: climax
    name: 抚吴督漕治水赈灾
    labels:
      zh: 封疆担当
    start_date: 1728
    highlight_event_id: guji-史贻直-event-daxueshi
  - key: closure
    name: 还朝入部候大用
    labels:
      zh: 内迁养望
    start_date: 1733
    highlight_event_id: guji-史贻直-event-daxueshi
  decisions:
  - date: 1728
    title_zh: 在江南清查亏空整饬吏治
    rationale: 先国计民生而后私情，宁拂属员情面也要澄清积弊
  - date: 1733
    title_zh: 还朝历任工部户部尚书
    rationale: 由外入内通晓钱谷工程，为参赞机务积累阅历
- id: guji-史贻直-endeavor-2
  title_zh: 入阁辅政与身后哀荣
  summary_zh: 雍正末参赞机务，乾隆朝拜文渊阁大学士，历兼各部，老成谋国，告老予养，身后入祀乡贤。
  phases:
  - key: brewing
    name: 参赞机务
    labels:
      zh: 枢廷历练
    start_date: 1733
    highlight_event_id: guji-史贻直-event-daxueshi
  - key: breakthrough
    name: 拜文渊阁大学士
    labels:
      zh: 入阁辅政
    start_date: 1739
    highlight_event_id: guji-史贻直-event-daxueshi
  - key: climax
    name: 老成谋国兼摄部务
    labels:
      zh: 重臣倚毗
    start_date: 1745
    highlight_event_id: guji-史贻直-event-death
  - key: closure
    name: 告老身后祀乡贤
    labels:
      zh: 完节令终
    start_date: 1763
    highlight_event_id: guji-史贻直-event-xiangxian
  decisions:
  - date: 1739
    title_zh: 受命入阁不树朋党
    rationale: 以孤立守正避权相之嫌，全朝廷和衷之局
  - date: 1763
    title_zh: 年老引退保全晚节
    rationale: 见机而作不恋位权，以退让为三朝老臣立榜样
events:
- id: guji-史贻直-event-birth
  date: 1682
  year_of: 1682
  kind: birth
  title_zh: 生于江苏溧阳
  description_zh: 康熙二十一年生于溧阳史氏诗书之家，少颖敏力学。
- id: guji-史贻直-event-jinshi
  date: 1700
  year_of: 1700
  kind: career
  title_zh: 中康熙三十九年进士
  description_zh: 庚辰科进士，选庶吉士入翰林，由检讨累迁侍讲，开启仕途。
- id: guji-史贻直-event-daxueshi
  date: 1739
  year_of: 1739
  kind: career
  title_zh: 拜文渊阁大学士辅政
  description_zh: 由封疆入枢廷，授文渊阁大学士兼管户工诸部，老成谋国为乾隆倚重。
- id: guji-史贻直-event-death
  date: 1763
  year_of: 1763
  kind: death
  title_zh: 卒于京师
  description_zh: 乾隆二十八年卒于京，年八十二，赠太保，谥文靖，赐祭葬。
- id: guji-史贻直-event-xiangxian
  date: 1765
  year_of: 1765
  kind: honor
  title_zh: 入祀江苏乡贤祠
  description_zh: 乾隆三十年十二月壬子，巡抚明德请，允故大学士史贻直入祀江苏乡贤祠，昭彰耆勋完节。
