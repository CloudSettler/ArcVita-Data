    start_date: 1798-09-09
    highlight_event_id: guji-和珅-event-fenggong
  - key: closure
    name: 定议一等世袭
    labels:
      zh: 世袭罔替
    start_date: 1798-09-15
    highlight_event_id: guji-和珅-event-shixi
  decisions:
  - date: 1798-09-08
    title_zh: 承旨书谕一手经理剿捕机宜
    rationale: 秉承太上皇帝训谕随时指示勒保调度以速奏扫穴擒渠之功
  - date: 1798-09-15
    title_zh: 会吏部议定一等公世袭
    rationale: 援平定黔苗通侯旧例请定世袭之秩以显殊恩而定人心
- id: guji-和珅-endeavor-2
  title_zh: 总理乾清宫工程兼办九旬庆典
  summary: 总理重建乾清宫交泰殿工程速成告竣复奉派总办太上皇帝庚申九旬万寿庆典经理仪文
  phases:
  - key: brewing
    name: 总理宫殿重建
    labels:
      zh: 兴工监修
    start_date: 1798-01-01
    highlight_event_id: guji-和珅-event-qianqing
  - key: breakthrough
    name: 秋仲告成复观
    labels:
      zh: 规模宏整
    start_date: 1798-11-01
    highlight_event_id: guji-和珅-event-qianqing
  - key: climax
    name: 奉派总办庆典
    labels:
      zh: 九旬万寿
    start_date: 1798-12-01
    highlight_event_id: guji-和珅-event-wanshou
  - key: closure
    name: 筹备恩科乡会试
    labels:
      zh: 衍庆推恩
    start_date: 1798-12-02
    highlight_event_id: guji-和珅-event-wanshou
  decisions:
  - date: 1798-11-01
    title_zh: 不费采购速办宫殿工程
    rationale: 趁春融兴工秋仲告成以复旧观而不滋糜费仰慰太上皇帝嘉悦之心
  - date: 1798-12-01
    title_zh: 总办九旬庆典不加增华靡
    rationale: 遵照康熙六十年及乾隆五十五年典例备办以副孝养胪欢又体节俭之意
events:
- id: guji-和珅-event-birth
  date: 1750-07-01
  year_of: 1750
  title_zh: 生于正红旗钮祜禄氏家
  description: 乾隆十五年六月初一生于京师后由侍卫起家
- id: guji-和珅-event-fenggong
  date: 1798-09-08
  year_of: 1798
  title_zh: 因川匪军功晋封公爵
  description: 勒保奏扫荡安乐坪生擒首逆王三槐太上皇帝以我在军机襄赞机宜承旨书谕加恩晋封公爵
- id: guji-和珅-event-shixi
  date: 1798-09-15
  year_of: 1798
  title_zh: 定为一等公世袭罔替
  description: 吏部奏请定爵秩奉旨俱作为一等照例承袭我与勒保俱为一等公福长安为侯爵
- id: guji-和珅-event-qianqing
  date: 1798-11-01
  year_of: 1798
  title_zh: 重建乾清宫告成受恩免议叙
  description: 同皇帝阅视乾清宫交泰殿工程规模宏整因已有军功加恩毋庸议叙命分别等第议叙在工人员
- id: guji-和珅-event-wanshou
  date: 1798-12-01
  year_of: 1798
  title_zh: 奉派总办九旬万寿庆典
  description: 皇帝率王大臣吁请庚申年举行太上皇帝九旬庆典奉派我与王杰苏凌阿刘墉福长安彭元瑞总办并定己未庚申恩科乡会试
- id: guji-和珅-event-death
  date: 1799-02-22
  year_of: 1799
  title_zh: 嘉庆四年正月赐死于狱
  description: 太上皇帝驾崩后嘉庆皇帝亲政以专权误国之罪赐死家产籍没
