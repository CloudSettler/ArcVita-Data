  - 主眷愈重而群谤愈积，如何保全始终
  - 家人借势营生与清廉名节，如何约束门户
  lesson: 恩宠恃盛而门户不饬，终以细隙酿大祸，慎独与束下同样紧要
  summary_first_person: 我起自寒微而骤蒙高宗信重，兼管崇文门税务诸要差，家人全儿稍有积蓄而起屋数十间，乾隆五十一年御史曹锡宝以服用完美参我招摇，我自辩未敢交接官员，高宗命王大臣履勘比较，虽一时得免，然众怨已集，可为后鉴
