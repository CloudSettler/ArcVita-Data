  decisions:
  - date: 1780-01-01
    title_zh: 令家人全儿襄办税务
    rationale: 以亲信家人代主经管税课，图其便捷可靠，不料久而积蓄起屋，授人口实
  - date: 1786-07-26
    title_zh: 面诘全儿并向朝廷自辩
    rationale: 闻御史以服用完美参奏，即诘问全儿并陈奏从不敢招摇交接官员，以房屋器具为常情自解
- id: guji-和珅-endeavor-2
  title_zh: 应对曹锡宝弹劾风波
  summary: 乾隆五十一年六月御史曹锡宝参家人全儿服用奢侈疑招摇撞骗，高宗命留京王大臣详查，自辩待勘并经履勘比较而暂免
  phases:
  - key: brewing
