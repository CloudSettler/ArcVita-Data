  - 迎合上意以固宠信与直陈积弊以任怨谤之难
  lesson: 正本方能清源，钱法之坏坏在监守，徒禁民间而不停滥铸则弊不绝
  summary_first_person: 吾和珅出身钮祜禄氏，侍乾隆左右，以敏干得信，尝奉命往滇审案，见小钱风行而参奏停铸之议，后总军机佐理庶政，至钱法积弊复被援引，荣宠极而身后衰，可为戒
