    labels:
      zh:
      - 突破
    start_date: 1786-07-26
    highlight_event_id: guji-和珅-event-quaner-chucao
  - key: climax
    name: 传询对质履勘
    labels:
      zh:
      - 高潮
    start_date: 1786-07-28
    highlight_event_id: guji-和珅-event-quaner-fukan
  - key: closure
    name: 比较众家以明真伪
    labels:
      zh:
      - 收束
    start_date: 1786-07-28
    highlight_event_id: guji-和珅-event-quaner-fukan
  decisions:
  - date: 1786-07-26
    title_zh: 供称全儿未见曹御史亦未交接官员
    rationale: 以一面之词辩其房屋宽敞器具完美容或有之，但非可挟以出外之物，房屋非目睹不能知，借此指奏词无根
  - date: 1786-07-28
    title_zh: 静候王大臣履勘比较
    rationale: 不自行回护，听命于带同曹锡宝履勘全儿住屋并周历查看阿桂等管家住处，以比较明越制与否
events:
