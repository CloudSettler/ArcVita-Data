  title_zh: 襄赞川楚教匪军机晋封公爵
  summary: 嘉庆初年川楚教匪不靖我在军机处承旨书谕经理剿捕因勒保扫荡安乐坪生擒王三槐而得加恩晋封一等公
  phases:
