endeavors:
- id: guji-和珅-endeavor-1
  title_zh: 乾隆四十五年赴滇审案参奏小钱
  summary_zh: 奉命赴云南审案，目击小钱风行，具摺参奏，请严办并停鼓铸，以杜滥铸之源
  phases:
  - key: brewing
    name: 奉命出按云南
    labels:
      zh: 审案出差
    start_date: 1780-01-01
    highlight_event_id: guji-和珅-event-1
  - key: breakthrough
    name: 目击小钱风行具摺参奏
    labels:
      zh: 参奏钱弊
    start_date: 1780-08-01
    highlight_event_id: guji-和珅-event-1
  - key: climax
    name: 朝议滇省钱法整顿
    labels:
      zh: 廷议整顿
    start_date: 1780-10-01
    highlight_event_id: guji-和珅-event-1
  - key: closure
    name: 留案为后日停铸之据
    labels:
      zh: 存案待后
    start_date: 1781-01-01
    highlight_event_id: guji-和珅-event-2
  decisions:
  - date: 1780-10-01
    title_zh: 赴滇审案兼察钱法具摺参奏
    rationale: 见滇省小钱充斥源于局铸不谨，若不参奏严办则蔓延他省，故直陈停铸整饬
  - date: 1780-12-01
    title_zh: 主张严办滥铸并议停鼓铸
    rationale: 察知民间私铸十之二三，局员减小多铸十之七八，须正本清源，故请停铸以绝弊源
- id: guji-和珅-endeavor-2
  title_zh: 军机佐理总揽钱局鼓铸之议
  summary_zh: 居军机首辅佐理户工钱局，赞成核定额铜、酌停云贵川局铸，督抚实力查禁小钱
  phases:
  - key: brewing
    name: 入直军机总理户工
    labels:
      zh: 枢臣理财
    start_date: 1785-01-01
    highlight_event_id: guji-和珅-event-2
  - key: breakthrough
    name: 核定额铜以限多铸
    labels:
      zh: 核铜限铸
    start_date: 1790-01-01
    highlight_event_id: guji-和珅-event-2
  - key: climax
    name: 赞成永远停铸云贵川局
    labels:
      zh: 停铸清源
    start_date: 1794-07-01
    highlight_event_id: guji-和珅-event-2
  - key: closure
    name: 饬令督抚查禁白役扰累
    labels:
      zh: 慎禁扰民
    start_date: 1794-07-15
    highlight_event_id: guji-和珅-event-2
  decisions:
  - date: 1794-07-01
    title_zh: 议请云贵四川永远停铸
    rationale: 以滇黔产铜取携甚便，川省近边沿用小钱皆由滇流入，多铸则积压充斥，故当永远停止以清其源
  - date: 1794-07-10
    title_zh: 查禁小钱须防胥役藉端勒索
    rationale: 禁小钱易滋番役捕快扰累商民，欲去一弊而转滋十弊，故须定章妥办使商民两便
