- id: guji-和珅-event-2
  title_zh: 乾隆五十九年谕旨援引旧奏议停云贵川鼓铸
  event_type: career
  date: 1794-07-12
  year_of: 1794
  place_zh: 京师热河
  summary_zh: 乾隆五十九年六月论禁小钱，谕及乾隆四十五年和珅往滇审案已参奏小钱风行，今决计云贵四川永远停止鼓铸，湖北多停数年，严饬福康安等实力查禁
- id: guji-和珅-event-death
