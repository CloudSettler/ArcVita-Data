- id: guji-和珅-event-quaner-chucao
  title_zh: 曹锡宝参家人全儿奢侈奉旨交查
  type: career
  date: 1786-07-26
  year_of: 1786
  description: 乾隆五十一年六月戊子，御史曹锡宝奏和珅家人全儿服用奢侈器具完美疑招摇撞骗，高宗谕留京王大臣详悉访查询问，令纪昀知之，并谕若无实据不可空言入人罪
- id: guji-和珅-event-quaner-fukan
  title_zh: 传询曹锡宝命履勘比较众家
  type: career
  date: 1786-07-28
  year_of: 1786
  description: 乾隆五十一年六月庚寅，曹锡宝供称不识全儿仅路过兴化寺街留心察看，高宗以其自相予盾命再行详询，并命都察院堂官会同绵恩派员带曹锡宝履勘全儿住屋，再周历查看阿桂等管家住处以比较真伪
