  summary_first_person: 吾起家寒素，历仕三朝，以敢言自任，乾隆初任刑部尚书，见禁烧锅于丰年有害无益，遂奏请歉岁宜禁丰年宜弛，蒙上交廷议，吾但愿实惠及民，不徇上意
