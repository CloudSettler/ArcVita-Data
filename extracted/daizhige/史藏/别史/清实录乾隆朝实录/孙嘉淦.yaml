    title_zh: 严饬所属绝盗源
    rationale: 长垣东明久为盗薮，若有司平日加意整顿，何至蔓延数省，当倍加留意，毋以获结稍存疏忽
  - date: 1740-08-01
    title_zh: 化导游惰协同安民
    rationale: 盗生于惰，化导游民使各寻生理，则丰年多善类，歉岁少流民，缉盗与养民并行
