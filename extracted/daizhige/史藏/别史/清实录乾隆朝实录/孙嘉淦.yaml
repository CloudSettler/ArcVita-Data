  title_zh: 出生于山西太原
  date: 1683
  year_of: 1683
  description: 康熙二十二年生于山西太原府兴县，家贫苦学，康熙五十二年成进士
- id: guji-孙嘉淦-event-shangshu
  title_zh: 授刑部尚书
  date: 1736-09-01
  year_of: 1736
  description: 乾隆元年擢任刑部尚书，总理刑名，以敢谏持正见称于朝
- id: guji-孙嘉淦-event-shaoguo
  title_zh: 奏论烧锅之禁宜分丰歉
  date: 1737-06-09
  year_of: 1737
  description: 乾隆二年五月丙午奏称烧锅之禁无益盖藏有损生计，止宜于歉岁不宜于丰年，上命总理王大臣会同九卿和衷定议，不必曲从朕旨
- id: guji-孙嘉淦-event-death
  title_zh: 病卒于官
  date: 1753-12-01
  year_of: 1753
  description: 乾隆十八年冬病卒，谥文定，以清节直声传于世
