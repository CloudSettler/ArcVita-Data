events:
- id: guji-孙嘉淦-event-birth
  title_zh: 出生于山西兴县
  date: '1683'
  year_of: 1683
  description: 康熙二十二年生于山西太原府兴县，康熙五十二年登进士，以敢谏直言著称
- id: guji-孙嘉淦-event-tianjin-water
  title_zh: 会勘天津叠道引河奏准
  date: 1739-06
  year_of: 1739
  description: 与河臣会勘天津东门外至咸水沽叠道及贺家口等六道引河，估银三万两，请于司库地丁内支给，部议速行
- id: guji-孙嘉淦-event-guangchang-troops
  title_zh: 奏添广昌营矾山堡官兵
  date: 1739-06
  year_of: 1739
  description: 据泰宁镇请添广昌营矾山堡马步兵使各足百名，移彻官座岭口汛兵补之，不敷者招募，并添额外外委千总
- id: guji-孙嘉淦-event-capture-locust
  title_zh: 奏报得雨捕蝗查河淀
  date: 1739-06
  year_of: 1739
  description: 奏各属得雨沾足，饬捕蝗渐尽，请亲查河淀关键及漳河归复故道情形，并请恤长垣被水一月口粮
- id: guji-孙嘉淦-event-chaoli-shengyuan
  title_zh: 参奏昌黎生员抗法
  date: 1739-06
  year_of: 1739
  description: 奏昌黎生员赵汝楫捏告知县劣款，审虚后邀众欲垒县门，朝廷据此通饬各省训饬士习
- id: guji-孙嘉淦-event-death
  title_zh: 逝世于京师
  date: '1753'
  year_of: 1753
  description: 乾隆十八年卒于官，历刑部尚书直隶总督等，谥文定，入祀贤良祠
