    rationale: 朝政得失系于人心风俗，不敢以一身祸福易天下公议，愿以直言报主知
  - date: 1741-02-01
    title_zh: 以刑部尚书兼理学政水利
    rationale: 法以辅教，学以养士，水利以厚生，三者皆安民之本，当实力奉行不饰虚文
