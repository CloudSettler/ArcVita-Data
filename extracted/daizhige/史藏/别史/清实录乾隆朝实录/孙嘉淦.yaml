endeavors:
- id: guji-孙嘉淦-endeavor-1
  title_zh: 直隶总督筹边口外停增独石口官兵请勘屯垦
  summary: 乾隆六年任直隶总督，察独石口寒苦不宜建营驻兵，奏停添副都统一员兵七百名，并请简大臣会勘张家口外兴和开平等处可耕之田
  phases:
  - key: brewing
    name: 初任直隶访察口外边情
    labels:
      zh: 访察边情
    start_date: '1741-01-01'
    highlight_event_id: guji-孙嘉淦-event-huguang-1735
  - key: breakthrough
    name: 奏停独石口增设副都统官兵
    labels:
      zh: 奏停增兵
    start_date: '1741-06-05'
    highlight_event_id: guji-孙嘉淦-event-zhili-1741
  - key: climax
    name: 请勘兴和开平川原可耕之田
    labels:
      zh: 请勘屯垦
    start_date: '1741-06-10'
    highlight_event_id: guji-孙嘉淦-event-zhili-1741
  - key: closure
    name: 奉旨交王大臣会同总管详勘
    labels:
      zh: 会勘定议
    start_date: '1741-07-01'
    highlight_event_id: guji-孙嘉淦-event-zhili-1741
  decisions:
  - date: '1741-06-05'
    title_zh: 决请停止独石口添兵设官
    rationale: 独石口气候甚寒不能建盖营房，添兵徒费钱粮而无实益，不如因旧制以省烦扰
  - date: '1741-06-05'
    title_zh: 决请特简王大臣踏勘口外沃野
    rationale: 张家口外兴和开平等处川原甚广，未知收获足供民食与否，又近牧厂易淆疆界，须详勘再定屯驻招垦
- id: guji-孙嘉淦-endeavor-2
  title_zh: 历事三朝直谏整饬吏治民生
  summary: 自康熙进士起，雍正朝以直谏闻名，乾隆朝历任湖广总督直隶总督，整饬吏治，兴水利，清漕弊，恤民力
  phases:
  - key: brewing
    name: 康熙进士观政砥砺直道
    labels:
      zh: 进士砥砺
    start_date: '1713-04-01'
    highlight_event_id: guji-孙嘉淦-event-jinshi-1713
  - key: breakthrough
    name: 雍乾之际上疏直陈得失
    labels:
      zh: 直谏闻名
    start_date: '1730-01-01'
    highlight_event_id: guji-孙嘉淦-event-huguang-1735
  - key: climax
    name: 督湖广兴修水利整饬营伍
    labels:
      zh: 封疆整饬
    start_date: '1735-09-01'
    highlight_event_id: guji-孙嘉淦-event-huguang-1735
  - key: closure
    name: 晚年入直上书房教习淳谨
    labels:
      zh: 晚年淳谨
    start_date: '1750-01-01'
    highlight_event_id: guji-孙嘉淦-event-death-1753
  decisions:
  - date: '1730-05-01'
    title_zh: 决不以祸福易直言之节
    rationale: 君有过则谏，政有阙则陈，虽谪戍而志不移，方不负读书报国之初心
  - date: '1735-09-01'
    title_zh: 决以兴利除弊并举治湖广
    rationale: 水利不修则民饥，营伍不整则民扰，必勤访察严甄别，方能吏治民生兼得
