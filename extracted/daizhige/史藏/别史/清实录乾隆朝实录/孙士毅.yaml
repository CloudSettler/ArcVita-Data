  decisions:
  - date: 1788-05-06
    title_zh: 奏报会匪勾引情形请严拏尽法惩治
    rationale: 若不及早搜拏则日聚日多，趁逆匪荡平兵威丕振时严拏可期奸徒敛迹而不虑惊疑
  - date: 1788-05-06
    title_zh: 严查闽省形迹可疑船只分别治罪
    rationale: 保无逆犯夥党混迹其中，即系偷越海洋亦应按律治罪，毋致疏纵
