    rationale: 官兵远渡涉险又遇风漂泊堪悯，查明未经得赏者一体赏给以示格外轸恤
  - date: 1788-05-12
    title_zh: 会同孙永清确查粤西粮价稍增之故
    rationale: 粤西雨水调匀而粮价反增，或因奸商囤积或农政渐弛，须据实具奏不得回护
