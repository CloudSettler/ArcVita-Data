    title_zh: 痛斥阮惠假立黎维某之请
    rationale: 黎维某痴呆易于愚弄，实为诓回黎眷戕害之计，须名正义直以丧贼胆
  - date: 1788-12-21
    title_zh: 密留许昌义等勿任妄言惑众
    rationale: 军行全在气盛，贼中大船巨炮之说多系缓兵之计，不可宣于众致士气馁
events:
- id: guji-孙士毅-event-birth
  title_zh: 出生于浙江仁和
  date: 1720-01-01
  year_of: 1720
  description: 雍正年间生于浙江仁和，乾隆十九年进士，累督两广
- id: guji-孙士毅-event-chuguan
  title_zh: 督大兵出关进剿安南
  date: 1788-12-14
  year_of: 1788
  description: 大兵甫出关外，土兵土夫感激思奋，沿边晴明军行顺利，奉旨嘉奖并盼年内捷报
- id: guji-孙士毅-event-bianwei
  title_zh: 辨破阮惠诈请罢兵
  date: 1788-12-21
  year_of: 1788
  description: 阮惠送回把总许昌义等诡称当立黎维某请罢兵，经询陪臣知其痴呆受愚弄，即向通事痛加呵斥，所办名正义直
- id: guji-孙士毅-event-liangdao
  title_zh: 筹两路夹攻并受收复中策
  date: 1788-12-22
  year_of: 1788
  description: 奉旨与乌大经滇兵由宣光进攻会合夹击，并遵谕以生擒阮惠为上，收复黎城扶立黎维祁即撤为中，不久驻炎荒
- id: guji-孙士毅-event-death
  title_zh: 卒于嘉庆元年
  date: 1796-01-01
  year_of: 1796
  description: 征安南后晋公爵督直隶，嘉庆元年卒，谥文靖
