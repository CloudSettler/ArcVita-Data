  - 慈爱孺慕与国体礼制之衡
  lesson: 以仁孝恭俭母仪天下，合万国之欢以养亲，垂遗诰以戒悲戚，示后世以安社稷为孝之大义
  summary_first_person: 予以薄德，仰荷昊苍眷佑，诞育帝躬，母仪尊养四十二年，三晋徽称，三举庆典，五世同堂，寿八十有六，考终无憾，惟愿皇帝节哀视事，以宗社为重，勿过悲毁
  source_urls:
