  decisions:
  - date: 1751-03-01
    title_zh: 许皇帝掖辇巡幸
    rationale: 体皇帝以天下养之诚，乘康强时节出巡，协夏凊宴赏之情，慰亿兆尊亲之愿
  - date: 1777-03-02
    title_zh: 留遗诰戒令节哀
    rationale: 自知大数垂尽，恐皇帝过毁，特谕以福寿考终无憾，令以社稷为重，丧制从俭
events:
- id: guji-孝圣宪皇后-event-birth
  title_zh: 诞生钮祜禄氏家
  date: 1692-11-05
  year_of: 1692
  description: 康熙三十一年十月初二生，后入雍亲王府邸，为熹妃，诞育弘历即乾隆皇帝
- id: guji-孝圣宪皇后-event-honored
  title_zh: 乾隆元年尊为崇庆皇太后
  date: 1735-10-03
  year_of: 1735
  description: 乾隆即位，尊生母熹贵妃为崇庆皇太后，居慈宁宫，始四十二年母仪尊养
- id: guji-孝圣宪皇后-event-eighty
  title_zh: 八旬万寿三举庆典
  date: 1771-11-25
  year_of: 1771
  description: 乾隆三十六年太后八十圣寿，推恩中外，三举庆典，五世同堂，史册罕比，海宇乂宁以娱晚景
- id: guji-孝圣宪皇后-event-death
  title_zh: 崩于长春仙馆并颁遗诰
  date: 1777-03-02
  year_of: 1777
  description: 乾隆四十二年正月二十三丑时，太后偶遘寒疾沈疴，崩于长春仙馆，寿八十有六，皇帝擗踊哭奠，奉梓宫于慈宁宫，颁遗诰戒谕节哀
