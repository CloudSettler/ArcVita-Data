    title_zh: 安居慈宁以正母仪
    rationale: 新君即位，首定宫闱之尊，以仁孝垂则，不干外政，以安朝野之心
  - date: 1771-11-25
    title_zh: 俯俞庆典以慰孝诚
    rationale: 年跻八旬，俯从皇帝与臣民之请，举行庆典，使天下共瞻慈寿，而示俭约之德
- id: guji-孝圣宪皇后-endeavor-2
  title_zh: 随驾巡幸颐和晚景
  description: 晨夕视膳问安，随驾巡幸避暑南巡，以天下养怡乐康强，晚景著平定两金川之慰
