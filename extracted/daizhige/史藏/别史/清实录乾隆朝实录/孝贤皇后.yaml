  - date: 1740-06-01
    title_zh: 屏绝奢靡躬行布素
    rationale: 以身作则，节俭以裕内治，使宫中府中习知敬慎。
  - date: 1747-10-01
    title_zh: 佐行仁政轸念民瘼
    rationale: 佐忧勤而出治，助赈济以全民命，成圣慈孝贤之名。
events:
- id: guji-孝贤皇后-event-birth
  date: 1712-03-28
  year_of: 1712
  type: birth
  title_zh: 生于富察勋族
  description: 康熙五十一年二月二十二日生，德钟勋族，教秉名宗。
- id: guji-孝贤皇后-event-difu
  date: 1727-08-18
  year_of: 1727
  type: endeavor
  title_zh: 册为宝亲王嫡福晋
  description: 雍正五年册为宝亲王嫡福晋，作配乾隆藩邸，敬慎持躬。
- id: guji-孝贤皇后-event-huanghou
  date: 1738-01-18
  year_of: 1738
  type: endeavor
  title_zh: 册立为皇后正位中宫
  description: 乾隆二年十二月册立为皇后，正位中宫十三年，佐忧勤而敷化。
- id: guji-孝贤皇后-event-bengshi
  date: 1748-04-08
  year_of: 1748
  type: endeavor
  title_zh: 随驾东巡崩于德州舟次
  description: 乾隆十三年三月十一日崩逝于东巡回銮舟次，梓宫奉移通州芦殿入长春宫，上亲临举哀。
- id: guji-孝贤皇后-event-death
  date: 1748-04-08
  year_of: 1748
  type: death
  title_zh: 崩逝
  description: 乾隆十三年三月十一日崩逝，在位中宫十三年，享年三十七。
- id: guji-孝贤皇后-event-shiyi
  date: 1748-04-13
  year_of: 1748
  type: endeavor
  title_zh: 加谥为孝贤皇后
  description: 乾隆谕礼部以圣慈深忆孝宫壸尽称贤亲定谥为孝贤皇后，昭茂典于千秋。
