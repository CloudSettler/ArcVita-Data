    title_zh: 受册中宫敬承祀事
    rationale: 以坤顺承乾，肃内则以佐外治，协图史贤明之颂。
  - date: 1748-03-01
    title_zh: 随驾东巡省方问俗
    rationale: 陪扈巡省以尽内助之职，体察民艰而佐宽仁之政。
- id: guji-孝贤皇后-endeavor-2
  title_zh: 崇俭仁下垂范六宫
  description: 崇节俭以禔躬，覃宽仁以逮下，屏奢靡之饰，助赈恤之仁，播遗芬于奕禩。
