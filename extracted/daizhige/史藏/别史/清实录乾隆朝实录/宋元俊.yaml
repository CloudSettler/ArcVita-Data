  decisions:
  - date: '1772'
    title_zh: 以山险无路为词退回迁延不援
    rationale: 惟图自全，称须由布拉克底革布什咱取道，实迁延未往，坐视薛琮覆没
  - date: 1772-05
    title_zh: 与阿尔泰会参桂林乖张欺罔
    rationale: 墨垄沟贻误后恐日久显露，为先发制人之举，宣言不参倒桂林必带狭甘兵同薛琮一样，胁迫改供
events:
- id: guji-宋元俊-event-birth
  title_zh: 出生
  date: '1720'
  year_of: 1720
  description_zh: 生年不详，绿营武弁出身，久在川省，稍悉番情
- id: guji-宋元俊-event-mingzheng
  title_zh: 克复明正侵地擢总兵
  date: '1771'
  year_of: 1771
  description_zh: 小金川用兵之初率众前往克复明正侵地，尚知奋勉，由游击洊擢总兵用示鼓励
- id: guji-宋元俊-event-molong
  title_zh: 墨垄沟贻误换帽避枪
  date: '1772'
  year_of: 1772
  description_zh: 墨垄沟贻误，平日临阵换戴小帽以避贼人枪击，险诈性成，不实心自效
- id: guji-宋元俊-event-xuecong
  title_zh: 坐视薛琮被困二千余人覆没
  date: '1772'
  year_of: 1772
  description_zh: 桂林派令带兵赍粮星夜赴援薛琮，以山势陡险难进为词迁延不进，若由原路急进贼必解散，竟甘心膜视致官兵二千余命覆没
- id: guji-宋元俊-event-canguilin
  title_zh: 会参桂林胁供串证败露革问
  date: 1772-05
  year_of: 1772
  description_zh: 上年五月与阿尔泰会参桂林乖张欺罔，福隆安审讯多属捏饰，向王万邦恐吓改供教令串写字帖，革职拏问查抄任所原籍家产，后以习番地留总兵带罪自效给还原籍家产
- id: guji-宋元俊-event-death
  title_zh: 病毙后追抄二子拏部
  date: 1773-02
  year_of: 1773
  description_zh: 贯盈罚亟自行病毙，乾隆三十八年二月谕以使其尚在立行正法不足谢捐躯者，命高晋拏解二子守山咢宋鲁赴刑部治罪，严密查抄原籍任所赀财，通谕川省军营
