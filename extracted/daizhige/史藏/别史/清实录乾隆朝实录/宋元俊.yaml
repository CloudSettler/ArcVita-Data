    rationale: 以绿营武弁久驻川省之熟，乘小金川初起奋勉自效，以求鼓励擢用
  - date: '1771'
    title_zh: 受总兵擢任而存取巧之心
    rationale: 自以既叨委任，不实心自效，惟图自全，为后墨垄沟逗遛之兆
- id: guji-宋元俊-endeavor-2
