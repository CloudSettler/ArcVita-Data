  name_zh: 宋元俊
  names:
    zh: 宋元俊
    en: Song Yuanjun
  lifespan:
    birth:
      date: '1720'
      precision: year
      is_circa: true
      raw: 生年不详，约雍正乾隆间绿营武弁
    death:
      date: 1773-02
      precision: month
      is_circa: true
      raw: 乾隆三十八年二月谕前自行病毙
  birth_date: '1720'
  death_date: 1773-02
  era: 清
  reign_ref: 乾隆
  archetype: 诡怯误公之武弁
  dilemmas:
  - 实心自效与取巧自全之抉择
  - 救援友军与坐视膜视之界限
  - 倾陷主帅先发制人与据实任过之取舍
  lesson: 临阵苟全坐视不救，又设词倾陷，其身虽暂逃显戮，身后必追罚以儆军行
  summary_first_person: 我本绿营武弁，久在川省稍悉番情，小金川初起时率众克复明正侵地，由游击洊擢总兵，遂意存取巧，墨垄沟贻误，薛琮告急不救，临阵换戴小帽以避枪击，又与阿尔泰会参桂林，胁迫王万邦改供串证，福隆安审出捏饰，革职拏问查抄，蒙恩留任带罪自效，不知感悔，旋病毙，死后罪状尽出，二子被拏治罪，家产被抄，以为诡怯者戒
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷0927.md
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0927.html
