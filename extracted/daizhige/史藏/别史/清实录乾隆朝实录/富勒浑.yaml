    title_zh: 点派口岸摊缴银两备赔关税
    rationale: 令书吏摊缴银一万九千六百余两收入署中，欲以先敛后吐掩饰短少
  - date: 1786-08-01
    title_zh: 被讯时咆哮剖辩
    rationale: 身为大臣不自安分待罪，悖戾形于词色，致自取绑赴市曹之辱
events:
- id: guji-富勒浑-event-birth
  title_zh: 出生
  date: 1720
  year_of: 1720
  description_zh: 富勒浑生于雍正末乾隆初前后，历仕至封疆大臣。
- id: guji-富勒浑-event-liangguang
  title_zh: 由闽浙调用两广总督
  date: 1784
  year_of: 1784
  description_zh: 以闽浙总督资格较深调用两广，委以海疆繁剧重任，期其将来胜任陕甘。
- id: guji-富勒浑-event-ancha
  title_zh: 孙士毅密查奏家人婪索
  date: 1786-05-01
  year_of: 1786
  description_zh: 舒常穆胜额先后奏其掺守平常不能约束家人，密谕孙士毅查奏纵容殷士俊等关通婪索及摊缴关税先侵后吐。
- id: guji-富勒浑-event-mian-gou
  title_zh: 训饬免勾牢固监禁
  date: 1786-10-18
  year_of: 1786
  description_zh: 朝审勾到，以其咆哮剖辩本应随众囚绑赴市曹，念非卖官鬻爵且有金川粮务微劳，从宽免其勾决仍牢固监禁，并通谕封疆以儆贪纵。
- id: guji-富勒浑-event-death
  title_zh: 监禁中卒
  date: 1787
  year_of: 1787
  description_zh: 免勾之后待罪囹圄，愧悔思过，卒于监禁之中。
