  dilemmas:
  - 慰留旧仆家人与严加约束之两难
  - 关亏先行摊补后奏与据实豫先奏明之抉择
  lesson: 慢藏诲盗，失察即为溺职，封疆当整躬洁己严肃驭下
  summary_first_person: 余由闽浙调用两广，委以海疆繁剧，自谓宣力有年，金川督办粮务亦有微劳，然声名掺守平常，不能约束家人，致殷士俊等关通婪索，又于关税先侵后吐，终致败露待罪，蒙恩免勾监禁，愧悔思过。
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷1267.html
