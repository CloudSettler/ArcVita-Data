events:
- id: guji-富察氏-event-birth
  title_zh: 生于富察勋族
  date: 1712-03-28
  year_of: 1712
  place_zh: 京师
  description_zh: 康熙五十一年二月二十二日生，钟祥勋族秉教名宗，自幼娴图史之规
- id: guji-富察氏-event-fujin
  title_zh: 选为宝亲王嫡福晋
  date: 1727-09-01
  year_of: 1727
  place_zh: 京师
  description_zh: 以秀毓华门礼娴内则选为嫡妃，问安鸡鸣毓庆麟趾，著宜家之助
- id: guji-富察氏-event-empress
  title_zh: 册立为皇后
  date: 1737-12-25
  year_of: 1737
  place_zh: 紫禁城太和殿
  description_zh: 乾隆二年十二月初四日，遣鄂尔泰海望持节赍册宝，告天地太庙社稷，册立嫡妃富察氏为皇后，次日颁诏天下覃恩
- id: guji-富察氏-event-huihao
  title_zh: 同奉恭上皇太后徽号之礼
  date: 1737-12-30
  year_of: 1737
  place_zh: 慈宁宫
  description_zh: 乾隆二年十二月十一日，率王公群臣恭奉册宝，加上崇庆慈宣皇太后徽号，行庆贺礼颁诏天下
- id: guji-富察氏-event-death
  title_zh: 崩逝于东巡途中
  date: 1748-04-08
  year_of: 1748
  place_zh: 德州舟次
  description_zh: 乾隆十三年三月十一日随驾东巡崩逝，谥孝贤，祔奉长陵地宫，以恭俭仁惠垂范后世
