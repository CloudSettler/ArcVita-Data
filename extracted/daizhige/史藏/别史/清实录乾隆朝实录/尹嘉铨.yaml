  dilemmas:
  - 为父显名之私情与朝廷名器公典之冲突
  - 讲学明礼之自任与安分守分之臣节之抉择
  lesson: 以私情干公典必遭反噬，孝在守礼安分，不在妄求谥祀
  summary_first_person: 我本以孝自任，遣子为父求谥又求从祀孔庙，自谓行孝，实则妄干国宪，终以狂妄革职治罪，方知孝当以礼节情，不可丧心病狂
