events:
- id: guji-尹嘉铨-event-birth
  date: 1711
  precision: year
  type: birth
  title_zh: 出生于直隶博野
  description: 康熙五十年生于博野，为尹会一子，少承家学以孝谨闻
  year_of: 1711
- id: guji-尹嘉铨-event-office
  date: 1736
  precision: year
  type: office
  title_zh: 登第历官后休致讲学
  description: 登第入仕历官中外，后休致归博野讲学，以道德礼义训导乡里
  year_of: 1736
- id: guji-尹嘉铨-event-qingshi
  date: 1781-04-05
  precision: day
  type: petition
  title_zh: 遣子至行在为父尹会一请谥
  description: 乾隆四十六年三月辛卯，遣子至保定行在奏请为父赐谥，高宗批为狂妄妄求，念为父私情姑免治罪
  year_of: 1781
- id: guji-尹嘉铨-event-congsi
  date: 1781-04-05
  precision: day
  type: petition
  title_zh: 再奏请父从祀孔庙并附五人
  description: 同日第二摺请以父配享孔庙，并请汤斌范文程李光地顾八代张伯行从祀，自称父蒙御诗褒嘉已在德行之科，高宗斥为狂吠丧心病狂
  year_of: 1781
- id: guji-尹嘉铨-event-zhizui
  date: 1781-04-05
  precision: day
  type: punishment
  title_zh: 革去顶带拿交刑部并抄家
  description: 高宗明谕革去顶带拿交刑部从重治罪，批示二摺交大学士九卿阅看通谕中外，并令袁守侗查抄博野赀财，英廉查抄京师房屋家属
  year_of: 1781
- id: guji-尹嘉铨-event-death
  date: 1790
  precision: year
  type: death
  title_zh: 卒于家
  description: 获罪后家居博野，乾隆五十五年卒，终以妄干名器为士林之戒
  year_of: 1790
