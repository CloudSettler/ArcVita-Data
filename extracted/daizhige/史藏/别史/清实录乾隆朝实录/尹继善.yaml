  title_zh: 出生
  date: '1695'
  year_of: 1695
  description_zh: 康熙三十四年出生于满洲镶黄旗
- id: guji-尹继善-event-1
  title_zh: 奏陈两淮盐务缉私章程
  date: 1743-08
  year_of: 1743
  description_zh: 署两江总督协办河务任内奏明三十场透漏由分司督查，毗连各邑责成文武，江宁安徽常镇三巡道总理，得旨实力妥协
- id: guji-尹继善-event-2
  title_zh: 办理江西抢夺闹堂并奏报秋收
  date: 1743-08
  year_of: 1743
  description_zh: 奏称江西民情渐安，所获抢夺为首按律定拟，闹堂辱官提审究拟，兼察武弁溺职，并奏报秋收偏灾须加意抚恤
- id: guji-尹继善-event-death
  title_zh: 去世
  date: '1771'
  year_of: 1771
  description_zh: 乾隆三十六年去世，历任封疆干济著称
