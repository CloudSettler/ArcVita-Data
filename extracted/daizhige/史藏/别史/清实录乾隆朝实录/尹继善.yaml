endeavors:
- id: guji-尹继善-endeavor-1
  title_zh: 整饬两淮盐政缉私
  summary_zh: 查明三十盐场透漏根源，奏定分司场官地方文武层层责成，兼管江宁安徽常镇缉私
  phases:
  - key: brewing
    name: 查明透漏根源
    labels:
      zh:
      - 查场访私
    start_date: 1743-08
    highlight_event_id: guji-尹继善-event-1
  - key: breakthrough
    name: 奏定责成章程
    labels:
      zh:
      - 分段责成
    start_date: 1743-08
    highlight_event_id: guji-尹继善-event-1
  - key: climax
    name: 分道协同承缉
    labels:
      zh:
      - 协同缉私
    start_date: 1743-08
    highlight_event_id: guji-尹继善-event-1
  decisions:
  - date: 1743-08
    title_zh: 以三十场缉私责成三分司
    rationale: 兴贩私盐皆由盐场透漏，须督场官力查灶户尽交商坦
  - date: 1743-08
    title_zh: 以关坝营汛责成地方文武与三巡道总理
    rationale: 永丰大伊泰州关坝为锁钥，三江青山营汛为出没区，须联络哨捕协同承缉
- id: guji-尹继善-endeavor-2
  title_zh: 安抚江西灾后民情与秋收
  summary_zh: 江西渐安而刁横难贷，分别抢夺为首为从及闹堂辱官定拟，并奏报秋收加意抚恤偏灾
  phases:
  - key: brewing
    name: 查访江西民情
    labels:
      zh:
      - 安帖察奸
    start_date: 1743-08
    highlight_event_id: guji-尹继善-event-2
  - key: climax
    name: 分别惩抚具题
    labels:
      zh:
      - 惩刁抚灾
    start_date: 1743-08
    highlight_event_id: guji-尹继善-event-2
  - key: closure
    name: 奏报秋收安慰
    labels:
      zh:
      - 秋成抚恤
    start_date: 1743-08
    highlight_event_id: guji-尹继善-event-2
  decisions:
  - date: 1743-08
    title_zh: 抢夺为首按律定拟为从枷号重责
    rationale: 民情渐安而刁横断难宽贷，须分别首从以儆效尤
  - date: 1743-08
    title_zh: 闹堂辱官提审穷究并察武弁袖手
    rationale: 辱官兼有专汛武弁不救护溺职幸灾，更难轻纵须痛加处治
events:
