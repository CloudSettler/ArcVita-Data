  - date: '1751-09-01'
    title_zh: 主张宽严并用化导民风
    rationale: 江南文伪滋事，刁顽需严而善良需保，若一味从严则惊疑滋多，故持平恕以靖地方
events:
- id: guji-尹继善-event-birth
  type: birth
  date: '1695'
  year_of: 1695
  title_zh: 生于满洲正黄旗尹氏家
  description_zh: 康熙三十四年出生，父尹泰官至川陕总督，自幼力学，雍正元年中进士
  place_zh: 京师
- id: guji-尹继善-event-1
  type: career
  date: '1751-10-11'
  year_of: 1751
  title_zh: 密疏参奏和其衷徇私改供
  description_zh: 乾隆十六年九月壬午，尹继善奏获官贵震捏造孙嘉淦本稿及刘宏谟密札，参和其衷准泰通同瞻徇删改刘恒发供词，朝旨将和其衷革职拿问交刑部
  place_zh: 两江总督衙门
- id: guji-尹继善-event-2
  type: career
  date: '1751-10-13'
  year_of: 1751
  title_zh: 会同舒赫德查办伪稿案
  description_zh: 乾隆十六年九月甲申，上命尚书舒赫德驰驿江南会同尹继善查办伪稿传播事件，复谕将恒文所奏天一堂传寄年月钞寄二人阅看穷究
  place_zh: 江南
- id: guji-尹继善-event-3
  type: career
  date: '1737-01-01'
  year_of: 1737
  title_zh: 授两江总督总理江南事务
  description_zh: 乾隆二年起授两江总督，此后屡任两江云贵四川陕甘总督，经理河工赈务盐政，政尚宽大，保全地方
  place_zh: 江宁
- id: guji-尹继善-event-death
  type: death
  date: '1771'
  year_of: 1771
  title_zh: 卒于陕甘总督任上
  description_zh: 乾隆三十六年卒于任，谥文端，入祀贤良祠，追念封疆老成之绩
  place_zh: 兰州
