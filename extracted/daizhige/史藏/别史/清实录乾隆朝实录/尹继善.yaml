    title_zh: 请筑官湖堤路建桥通水
    rationale: 官湖低洼逼近运河，雨溢则沟塞路阻，筑堤建桥可兼利行旅宣泄
  - date: 1744-03
    title_zh: 请浚沐河乌沙河建涵筑堰
    rationale: 民堰残缺河底过高涵口过窄，必帮筑挑浚改宽方能束水济运
