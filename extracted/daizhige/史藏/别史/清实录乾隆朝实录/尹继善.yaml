    title_zh: 前奏李如柏不宜边地
    rationale: 其人才虽健明白，然边地需沉稳谙边情者，人地未宜故据实预陈
  - date: 1744-03
    title_zh: 应诏据实覆奏调补事
    rationale: 既奉寄信询问，当据实覆奏不徇情面以全国家边圉之计
