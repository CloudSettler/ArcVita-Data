endeavors:
- id: guji-尹继善-endeavor-1
  title_zh: 经略肃州节制准部互市
  summary: 在陕甘总督任内主持准噶尔夷目来肃交易挑收货物立议单限数核价以防虚擡贪得
  phases:
  - key: brewing
    name: 宽挑收而观夷情
    labels:
      zh: 互市酝酿
    start_date: 1750-11-01
    highlight_event_id: guji-尹继善-event-1
  - key: breakthrough
    name: 立议单以定限额
    labels:
      zh: 节制初立
    start_date: 1751-02-01
    highlight_event_id: guji-尹继善-event-1
  - key: closure
    name: 核实价以请训示
    labels:
      zh: 收束请旨
    start_date: 1751-02-01
    highlight_event_id: guji-尹继善-event-2
  decisions:
  - date: 1750-11-01
    title_zh: 从宽挑收而分发领销
    rationale: 夷货携来较多若峻拒则启衅故先挑收再按例匀发以安其心而保商路
  - date: 1751-02-01
    title_zh: 限羊马数并立议单带回
    rationale: 羊只皮张不得过三万马牛共不得过一千以实数六万两为约用裁抑得寸进寸之弊
- id: guji-尹继善-endeavor-2
  title_zh: 察吏甄别直陈提督不胜任
  summary: 遵旨查奏甘肃提督成元震为人为官据实考语不以同镇一方而瞻顾
  phases:
  - key: brewing
    name: 奉旨察看武职
    labels:
      zh: 受命体察
    start_date: 1751-01-01
    highlight_event_id: guji-尹继善-event-3
  - key: climax
    name: 直陈猷为不足
    labels:
      zh: 秉公上陈
    start_date: 1751-02-01
    highlight_event_id: guji-尹继善-event-3
  - key: closure
    name: 听候简调以安边镇
    labels:
      zh: 静候处分
    start_date: 1751-02-01
    highlight_event_id: guji-尹继善-event-death
  decisions:
  - date: 1751-02-01
    title_zh: 奏称成元震诚实有余猷为不足
    rationale: 提督统辖全省责任綦重非才短年老者可任故据实直陈以免贻误边疆而自任举荐之责
  - date: 1751-02-01
    title_zh: 自陈陕甘各镇无可举荐
    rationale: 非才短即年老与其滥举不如阙如以示留心公论而候圣裁
events:
- id: guji-尹继善-event-birth
  title_zh: 出生于满洲镶黄旗尹氏
  date: 1695-01-01
  year_of: 1695
  description: 康熙三十四年出生为尹泰之子少以文行著称后入仕途历封疆
- id: guji-尹继善-event-1
  title_zh: 奏报准夷来肃交易挑收情形
  date: 1751-02-01
  year_of: 1751
  description: 奏称准噶尔夷目来肃交易携货较多已从宽挑收挑存羊牛等项作价银十八万六千二百余两兑给绸缎茶线等项并给现银一万八千八百余两去冬十一月事竣回巢
- id: guji-尹继善-event-2
  title_zh: 奏请立议单裁抑夷人贪得
  date: 1751-02-01
  year_of: 1751
  description: 奏称已与写立议单嗣后羊只皮张不得过三万马牛共不得过一千约虚数七八万两实数六万两乞令料理夷使大臣明切晓谕奉旨嘉其所办是
- id: guji-尹继善-event-3
  title_zh: 遵旨查奏成元震难胜提督
  date: 1751-02-01
  year_of: 1751
  description: 遵旨查奏甘肃提督成元震诚实有余猷为不足难胜提督之任陕甘各镇非才短即年老亦无可举荐奉旨称其所奏皆公论足见留心
- id: guji-尹继善-event-death
  title_zh: 病卒于乾隆三十六年
  date: 1771-01-01
  year_of: 1771
  description: 久历云贵陕甘江南封疆以清勤干济著称乾隆三十六年卒于官谥文端
