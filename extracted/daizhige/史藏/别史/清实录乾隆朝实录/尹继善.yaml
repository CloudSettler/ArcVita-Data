  archetype: 封疆治水能臣
  dilemmas:
  - 兴大工以除水患与惜民力以固邦本如何兼顾
  - 保漕运盐运国计与护民田民生如何两全
  - 上游宣洩与下游容受之间如何权衡启闭
  lesson: 治水即治民，必亲察地形，兼顾上下游，官修民修相济，方能久安
  summary_first_person: 我本满洲镶黄旗世家子，蒙恩历任封疆，督理两江多年，惟以踏勘水道，疏浚筑堰，安民足食为念，愿使民田无淹没之苦，漕盐无阻滞之患，实心行实政而已
