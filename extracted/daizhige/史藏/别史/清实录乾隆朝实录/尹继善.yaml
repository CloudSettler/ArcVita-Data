endeavors:
- id: guji-尹继善-endeavor-1
  title_zh: 江淮秋汛赈抚与徐州流民安辑
  summary: 乾隆十年夏秋黄水盛长，淮徐海续被淹浸，徐州贫民流移豫东，确勘轻重分别加赈，借种修屋，咨送回籍入赈
  phases:
  - key: brewing
    name: 水发查勘
    labels:
      zh:
      - 查勘
      - 安顿
    start_date: 1745-08-15
    highlight_event_id: guji-尹继善-event-jianghuai-zhenxu
  - key: climax
    name: 分别加赈
    labels:
      zh:
      - 赈恤
      - 复业
    start_date: 1745-09-12
    highlight_event_id: guji-尹继善-event-jianghuai-zhenxu
  decisions:
  - date: 1745-09-12
    title_zh: 先将被灾较重处赈一月口粮再定加赈
    rationale: 灾有轻重，先急后缓，俾灾黎得食而有次序，不致失所
  - date: 1745-09-12
    title_zh: 流至商邱虞城曹单贫民咨送回籍一体入赈
    rationale: 流移虽出谋食，本籍加意抚绥则陆续回里，未回者送回方能核实赈给
- id: guji-尹继善-endeavor-2
  title_zh: 海洋巡哨整饬与陈家浦遥堤会商
  summary: 以下江苏松崇明门户论巡哨之弊，请严参偷安将弁，设小哨船驻小羊山，又会同河臣相度陈家浦漫口筑遥堤束水
  phases:
  - key: breakthrough
    name: 条陈巡哨
    labels:
      zh:
      - 海防
      - 巡哨
    start_date: 1745-09-18
    highlight_event_id: guji-尹继善-event-haixun-shaochuan
  - key: closure
    name: 遥堤束水
    labels:
      zh:
      - 河工
      - 会商
    start_date: 1745-09-20
    highlight_event_id: guji-尹继善-event-haixun-shaochuan
  decisions:
  - date: 1745-09-18
    title_zh: 请设小哨船二只驻泊小羊山弹压商渔
    rationale: 大船不能入岙稽查不亲切，小船常川驻泊方能密报搜擒，秋底渔船进口一并彻回
  - date: 1745-09-18
    title_zh: 风顺而巡查不力者严参
    rationale: 立法已备，行之须实力，若以守口为借任意偷安则门户空虚
events:
- id: guji-尹继善-event-birth
  title_zh: 出生
  date: 1695
  year_of: 1695
  description: 生于满洲正黄旗尹氏之家，少力学而入仕途，历任封疆
- id: guji-尹继善-event-jianghuai-zhenxu
  title_zh: 奏报江淮秋汛被水并筹赈抚
  date: 1745-09-12
  year_of: 1745
  description: 奏陈黄河南岸陈家浦漫溢及上下江凤颍泗淮徐海夏秋两被水灾情形，请委员确勘分别赈抚，借给麦种，修葺房屋
- id: guji-尹继善-event-haixun-shaochuan
  title_zh: 奏请整饬海洋巡哨
  date: 1745-09-18
  year_of: 1745
  description: 以崇明为全省门户，高廖汇头危险，将弁畏难停泊，请风顺偷安者严参，并设小哨船驻小羊山弹压商渔缉捕奸匪
- id: guji-尹继善-event-death
  title_zh: 去世
  date: 1771
  year_of: 1771
  description: 久任封疆勤于抚绥河务，卒于乾隆三十六年，谥号文端，入祀贤良
