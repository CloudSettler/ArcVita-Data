  decisions:
  - date: 1743-10-01
    title_zh: 到任首重水利民田
    rationale: 江淮地卑水聚，必先通河道，复民田积水有出路，而后农功可兴，漕赋可裕
  - date: 1746-03-15
    title_zh: 海州盐河设滚水坝兼利民田盐运
    rationale: 盐河筑坝济运则民田被淹，设石滚水坝以高于河底五尺低于民田一尺为度，水满则滚，水平则止，运田两全
events:
- id: guji-尹继善-event-birth
  title_zh: 生于京师满洲镶黄旗尹氏家
  date: 1694-01-01
  year_of: 1694
  place_zh: 京师
  summary_zh: 康熙三十三年生，为尹泰子，自幼读书，入仕后历巡抚总督
- id: guji-尹继善-event-zongdu
  title_zh: 督理两江综治封疆
  date: 1743-10-01
  year_of: 1743
  place_zh: 江宁
  summary_zh: 任两江总督，综理江苏安徽江西民政漕盐，巡察水道，筹议兴修，为乾隆十一年会奏水利之本
- id: guji-尹继善-event-shuili
  title_zh: 会奏上下两江水利疏浚改挑诸工
  date: 1746-03-15
  year_of: 1746
  place_zh: 江宁
  summary_zh: 与河道等会奏，洪沟河筑子堰补沈家堤，濉河挑浚改天然闸尾闾，五湖谢家沟挑挖归洪泽，淝河宋汤河挑浚建桥，六塘河补堰建涵洞挑港河分水，山阳等六邑挑河建闸，沭河青伊湖蔷薇河挑筑建闸，得旨依议交高斌核议速行
- id: guji-尹继善-event-death
  title_zh: 卒于京师
  date: 1771-01-01
  year_of: 1771
  place_zh: 京师
  summary_zh: 乾隆三十六年卒，历事三朝，久督封疆，以治水安民著称，谥文端
