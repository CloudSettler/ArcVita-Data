  - 直陈属吏徇隐与顾全官场体统之两难
  - 穷究谣谤根株与避免株连无辜之两难
  lesson: 以实心任事，以公慎持躬，见徇隐必陈，遇谣言必究，而不滥及无辜
  summary_first_person: 吾自雍正初入官，历巡抚总督，出入江河之间，惟知实心办事，公以待人，此次伪稿流布数省，吾密拏官贵震，参劾和其衷徇私改供，不敢少存瞻顾，惟愿根株得究而良善得安也
