endeavors:
- id: guji-尹继善-endeavor-1
  title_zh: 铜山合龙后加戗开引化险为平
  summary: 铜山漫口合龙后堤身单薄，黄溜南趋顶冲新堤，奉谕驰赴铜山按图会商，加戗卫堤并开引分溜
  phases:
  - key: brewing
