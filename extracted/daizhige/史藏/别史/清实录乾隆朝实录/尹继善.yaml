  decisions:
  - date: 1743-03
    title_zh: 驰驿赴任悉心讲论再加商酌
    rationale: 江南紧要，赈恤河防头绪繁多，已有定议不可轻改，须会同陈世倌高斌周学健讲论定局
  - date: 1743-04
    title_zh: 协同白钟山料理河务
    rationale: 督抚与河臣事本相因，河防不固则赈无止境，须同心经画，兼顾东作与民食
- id: guji-尹继善-endeavor-2
  title_zh: 早年抚苏治云贵川陕历练封疆
  summary_zh: 自雍正朝抚江苏、督云贵、制川陕，整饬吏治，兴修水利，筹划边储，为后来总制江淮奠定经世之能。
