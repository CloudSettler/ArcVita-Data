    labels:
      zh:
      - 按图详议
      - 妥协商酌
    start_date: 1754-02
    highlight_event_id: guji-尹继善-event-tongshan-hearing
  - key: climax
    name: 加戗卫堤开引分溜
    labels:
      zh:
      - 加宽里戗
      - 开浚引河
    start_date: 1754-02
    highlight_event_id: guji-尹继善-event-tongshan-memorial
  - key: closure
    name: 会奏陈明候旨办理
    labels:
      zh:
      - 化险为平
      - 以工代赈
    start_date: 1754-02
    highlight_event_id: guji-尹继善-event-tongshan-memorial
  decisions:
  - date: 1754-02
    title_zh: 里戗再加宽六丈并镶防风
    rationale: 大堤虽合龙里戗尚单薄，堤后有戗戗外有防风方可御夏秋盛涨
  - date: 1754-02
    title_zh: 兜水坝南岸展宽引河吸川
    rationale: 黄溜湾曲南趋顶冲新堤，惟分溜直流北徙方可化险为平，并借引河工作赈济淮徐灾黎
- id: guji-尹继善-endeavor-2
  title_zh: 历督云贵川陕江南整饬吏治河务
  summary: 久任封疆，历督云贵广西四川陕甘江南，整饬报销积案，督修江防水利，核吏治赈务
  phases:
  - key: brewing
    name: 初膺节钺历试封疆
    labels:
      zh:
