  - date: 1737-08
    title_zh: 督云贵重储蓄严考核
    rationale: 滇黔山瘠兵多，惟预筹仓储、核实开垦，方能足食足兵，边陲永固
events:
- id: guji-尹继善-event-birth
  date: 1696
  year_of: 1696
  title_zh: 出生于满洲正黄旗
  description_zh: 康熙三十五年出生，满洲正黄旗人，尹泰之子，雍正元年进士出身。
- id: guji-尹继善-event-jiangsu-1729
  date: 1729
  year_of: 1729
  title_zh: 授江苏巡抚整饬吏治水利
  description_zh: 雍正七年任江苏巡抚，整顿官方，兴修水利，清查钱粮，声绩大著，继督云贵川陕。
- id: guji-尹继善-event-liangjiang-1743
  date: 1743-03
  year_of: 1743
  title_zh: 署理两江总督会办河赈
  description_zh: 乾隆八年二月庚子奉旨，因德沛未能胜任，驰驿署理两江，会同陈世倌高斌周学健商酌定局，协同白钟山料理河务。
- id: guji-尹继善-event-death
  date: 1771
  year_of: 1771
  title_zh: 病逝于两江总督任上
  description_zh: 乾隆三十六年卒于两江总督任内，谥文端，追赠太保，入祀贤良祠。
