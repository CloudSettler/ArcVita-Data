  summary_zh: 会奏洪沟河筑子堰修沈家堤，濉河挑淤建涵洞斗门，淝河宋汤河挑挖建桥，六塘河港河建闸分水，沭河青伊湖蔷薇河挑筑诸工，交高斌核议
  role_zh: 江南总督
