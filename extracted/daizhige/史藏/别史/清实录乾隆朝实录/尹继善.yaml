  dilemmas:
  - 准部互市利边民而易贪得寸进尺如何立限以节制
  - 旧将诚实而猷为不足如何直陈以不误封疆
  lesson: 通商情而严节制存忠厚而秉至公方能不亏国帑不误戎机
  summary_first_person: 余尹继善久历封疆现督陕甘于肃州互市立议单以限羊马之数核实价以省虚糜于甘肃提督成元震直陈其诚实有余猷为不足惟愿以公忠体国不以姑息贻误
