  decisions:
  - date: 1746-03-15
    title_zh: 会奏上下两江疏浚改挑筑堰建闸全案
    rationale: 上江濉淝卑洼易溢，下江六塘沭河宣洩不及，必分段挑浚，筑子堰以束水，建涵洞闸座以启闭，方能田漕两利
  - date: 1746-03-16
    title_zh: 请分官修民修督率经理
    rationale: 大工官办，小港圩埝令民自理，地方官督率，分别管理，方能经久无弊，不致糜费纷扰
- id: guji-尹继善-endeavor-2
  title_zh: 总督两江安民察吏
  summary_zh: 久任江苏巡抚两江总督，兴学校端士习，课农桑修水利，察吏安民，兼理漕盐河务，务使封疆宁谧
  role_zh: 两江总督
