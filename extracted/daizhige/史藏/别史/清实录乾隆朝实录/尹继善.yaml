endeavors:
- id: guji-尹继善-endeavor-1
  title_zh: 江淮运河水涨灾赈与海州善后
  description: 乾隆十一年伏秋大汛，邳宿桃清安东及海州赣沭被淹，奏请确勘先赈，会办河工善后与仓储采买
  phases:
  - key: brewing
    name: 六月大雨运河受涨
    labels:
      zh:
      - 水灾
      - 运河
    start_date: '1746-07-01'
    highlight_event_id: guji-尹继善-event-1
  - key: breakthrough
    name: 委员确勘先行抚恤
    labels:
      zh:
      - 赈恤
      - 确勘
    start_date: '1746-08-01'
    highlight_event_id: guji-尹继善-event-1
  - key: climax
    name: 会商防秋与海州筹画
    labels:
      zh:
      - 会办
      - 海州善后
    start_date: '1746-08-15'
    highlight_event_id: guji-尹继善-event-3
  - key: closure
    name: 拨银米接济并筹仓储
    labels:
      zh:
      - 积贮
      - 善后
    start_date: '1746-09-01'
    highlight_event_id: guji-尹继善-event-3
  decisions:
  - date: '1746-08-01'
    title_zh: 水漫州县先赈后勘
    rationale: 灾黎连年困于沈灾，若待确勘始赈则失所者众，故先抚后核以安民心
  - date: '1746-08-15'
    title_zh: 会同高斌顾琮筹防秋
    rationale: 运河伏汛虽过秋汛踵至，湖黄攸关紧要，须合议加培堤堰疏浚河道以减来岁水患
  - date: '1746-09-01'
    title_zh: 于丰稔地方采买补仓
    rationale: 本境灾地买麦徒增时价无益于民，故于上江丰收处采买麦谷以充淮徐海仓储
- id: guji-尹继善-endeavor-2
  title_zh: 参劾属吏与缉拿大乘教匪党
  description: 参奏沭阳知县庇役致死生员被训饬，同时核查川省供出江南邪教诸犯并缉获究审
  phases:
  - key: brewing
    name: 沭阳衙役殴死生员案发
    labels:
      zh:
      - 命案
      - 吏治
    start_date: '1746-08-01'
    highlight_event_id: guji-尹继善-event-2
  - key: breakthrough
    name: 参奏知县罗士瓒革职
    labels:
      zh:
      - 参劾
      - 士习
    start_date: '1746-08-20'
    highlight_event_id: guji-尹继善-event-2
  - key: climax
    name: 缉获王徐氏吴时济党羽
    labels:
      zh:
      - 邪教
      - 缉捕
    start_date: '1746-09-01'
    highlight_event_id: guji-尹继善-event-3
  - key: closure
    name: 核查川供名单分别定拟
    labels:
      zh:
      - 会审
      - 定案
    start_date: '1746-09-10'
    highlight_event_id: guji-尹继善-event-3
  decisions:
  - date: '1746-08-20'
    title_zh: 以庇役无能参革罗士瓒
    rationale: 县令纵役殃民改换姓名徇庇，自有处分定例，故据法参奏以饬吏治
  - date: '1746-09-01'
    title_zh: 对邪教党羽实力缉审速定
    rationale: 大乘教勾结多省声气广通，若不彻底澄清则为从者可继起为害，故搜获妖书封号即解苏会核分别定议
events:
- id: guji-尹继善-event-birth
  title_zh: 出生于满洲镶黄旗尹氏
  date: '1695-01-01'
  year_of: 1695
  place_zh: 京师
  description: 康熙三十四年生，后由科举入仕，历任封疆
- id: guji-尹继善-event-death
  title_zh: 卒于乾隆三十六年
  date: '1771-06-22'
  year_of: 1771
  place_zh: 京师
  description: 乾隆三十六年五月初十卒，谥文端，久督两江江南江北军民多所惠
- id: guji-尹继善-event-1
  title_zh: 奏报江北运河水漫请赈
  date: '1746-08-01'
  year_of: 1746
  place_zh: 邳州宿迁桃源清河安东
  description: 六月初旬大雨兼东省上游汇注，运河宣洩不及，邳宿桃清安东村庄被漫，凤台滨河低田亦淹，奏请委员确勘先行抚恤，得旨加意赈恤遴委妥员料理
- id: guji-尹继善-event-2
  title_zh: 参奏沭阳知县罗士瓒被训
  date: '1746-08-20'
  year_of: 1746
  place_zh: 沭阳
  description: 以沭阳衙役殴死生员王焕，县令庇役无能请革职，疏中屡言作养斯文凌辱士子，上以人命自有明条不因士民区别，斥其好名务虚启不肖士子故习，令痛改务实办理
- id: guji-尹继善-event-3
  title_zh: 会办海州赈济并获邪教多犯
  date: '1746-09-01'
  year_of: 1746
  place_zh: 海州苏州
  description: 会同高斌陈大受议海州善后，乏食户口先赈一月，拨江苏库银十三万两仓谷米接济。又据川省刘奇供出名单，查获黄忠清邱立先张理正夏天佑等，续获姚君茂杜玉梁等党羽并起获妖书，解苏会核提讯
