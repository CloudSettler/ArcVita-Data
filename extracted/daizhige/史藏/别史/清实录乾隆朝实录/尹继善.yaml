      - 吏治
    start_date: 1737-01
    highlight_event_id: guji-尹继善-event-governor
  - key: breakthrough
    name: 总督两江董理河赈
    labels:
      zh:
      - 河务
      - 赈济
    start_date: 1753-01
    highlight_event_id: guji-尹继善-event-governor
  - key: climax
    name: 会办铜山江防海塘
    labels:
      zh:
      - 江防
      - 会商
    start_date: 1754-02
    highlight_event_id: guji-尹继善-event-tongshan-memorial
  - key: closure
    name: 协理军需保固后路
    labels:
      zh:
      - 军需
      - 久远之计
    start_date: 1755-01
    highlight_event_id: guji-尹继善-event-governor
  decisions:
  - date: 1754-01
    title_zh: 速结报销积案不容拖累
    rationale: 报销往返驳诘尘案累积官吏迭更，符例者速准应驳者三次后核减追赔，务令克期速结
  - date: 1754-02
    title_zh: 亲勘险工不托属员具文
    rationale: 游手归农具文无实与河工虚报同弊，必亲至铜山按图量水定议，一面办理一面速奏
events:
- id: guji-尹继善-event-birth
  date: 1695
  year_of: 1695
  title_zh: 出生
  description: 康熙三十四年生于满洲正黄旗尹氏，为尹泰之子
- id: guji-尹继善-event-death
  date: 1771
  year_of: 1771
  title_zh: 逝世
  description: 乾隆三十六年卒于任上，谥文端，久历封疆以治河理财见称
- id: guji-尹继善-event-tongshan-hearing
  date: 1754-02
  year_of: 1754
  title_zh: 奉谕驰赴铜山按图会商
  description: 乾隆十九年正月辛未，上以铜山新工月堤积水浸润堤根，黄溜顶冲可虑，命军机郎中阿思哈带图驰驿，传谕尹继善即至铜山按图详议妥协商酌
- id: guji-尹继善-event-tongshan-memorial
  date: 1754-02
  year_of: 1754
  title_zh: 会奏加戗开引化险为平
  description: 尹继善会同白钟山奏陈大堤合龙后赶筑里戗尚单薄请再加宽六丈并镶防风，兜水坝东南引河南岸加宽河头北展以纳溜吸川，望大汛开放北徙化险为平
- id: guji-尹继善-event-governor
  date: 1753-06
  year_of: 1753
  title_zh: 总督两江董理河赈吏治
  description: 再任两江总督，督办江南水利报销积案与江防赈务，为乾隆十九年驰赴铜山会办之本任
