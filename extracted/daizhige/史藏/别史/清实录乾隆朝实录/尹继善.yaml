    title_zh: 会同巡抚学政查明长洲童生贿嘱传递事
    rationale: 学政既已查出而不参处，自当分别降罚以明劝惩
  - date: 1759-07-01
    title_zh: 饬属严防科场包揽传递积弊
    rationale: 不肖书吏包揽传递屡禁不止，须从失察处分入手以儆效尤
