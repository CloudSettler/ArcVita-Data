  birth_date: 1695
  death_date: 1771
  era: 清
  reign_ref: 乾隆
  archetype: 勤宣抚绥之封疆大臣
  dilemmas:
  - 灾广而力绌时先救流移还是先核灾等奏报以实
  - 海疆辽阔而将弁畏难时立法周密与实力奉行如何兼顾
  lesson: 治水先安民，奏报贵据实，不以取和讳饰，加意抚绥，方能转流移为复业
  summary_first_person: 我尹继善署理两江，总办河务，逢乾隆十年秋汛黄淮并涨，徐淮遍被水淹，贫民流至豫东谋食，我即飞饬安顿，委员确勘，分别加赈一月，借给耔种，修葺房屋，又为海洋巡哨请设小哨船驻泊小羊山，以弹压商渔缉捕奸匪，惟愿实力妥办，不负倚任
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70247.html
