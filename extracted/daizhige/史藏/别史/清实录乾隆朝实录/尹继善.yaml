  birth_date: '1695-01-01'
  death_date: '1771-06-22'
  era: 清朝
  reign_ref: 乾隆
  archetype: 封疆大臣
  dilemmas:
  - 灾广粮缺之时，先行抚恤以救燃眉，与确勘户口以防冒领之间难两全
  - 参劾属吏以明法纪，与维护士子体面以存教化之间分寸难握
  lesson: 经世在务实经理河漕仓储与民瘼，不在市恩士子以博虚声
  summary_first_person: 我是尹继善，满洲镶黄旗人，久任两江总督。乾隆十一年夏秋，江北大雨，运河宣洩不及，邳宿桃清安东及海州赣沭并被水漫，我亲奏确勘先赈，会同高斌顾琮陈大受筹办海州善后，拨银米接济。又因沭阳知县罗士瓒纵役殴死生员王焕一疏，措辞多言作养斯文，为上所训，谓我好名务虚，令我痛改务实。同年复督缉大乘教川省供出江南诸犯，分别拏获究审，不敢疏忽。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70270.html
