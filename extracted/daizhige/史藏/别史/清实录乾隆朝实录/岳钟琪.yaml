  birth_date: 1686
  death_date: 1754
  era: 清
  reign_ref: 乾隆
  archetype: 持重老将
  dilemmas:
  - 与总督张广泗同办军务，直陈兵少碉坚则恐掣肘，缄默则误大事
  - 汉兵不满千人土兵怯懦难用，欲裁土兵调楚兵又恐动摇番情
  lesson: 用兵贵精不贵多，奇正并用，直捣贼巢方能溃其坚碉
  summary_first_person: 吾以罪废再起，领兵党坝，目击兵单运艰碉坚难拔，唯据实奏陈兵数道里奇正之策，以求速平金川安靖边疆
  source_urls:
  - https://zh.wikisource.org/wiki/清實錄/大清高宗純皇帝實錄/卷之三百二十二
endeavors:
- id: guji-岳钟琪-endeavor-1
  person_qid: guji-岳钟琪
  title_zh: 党坝单路力攻勒乌围
  summary: 领兵党坝直面勒乌围贼巢，运道皆贼出没之所，兵止七千余，请并兵合力速捣巢穴
  phases:
  - key: brewing
    name: 驻守党坝查明贼势
    labels:
      zh:
      - 查勘地形
      - 兵单运艰
    start_date: 1748-03-01
    highlight_event_id: guji-岳钟琪-event-dangba
  - key: breakthrough
    name: 攻夺水泉插入贼地
    labels:
      zh:
      - 夺泉立营
      - 孤军深入
    start_date: 1748-07-01
    highlight_event_id: guji-岳钟琪-event-dangba
  - key: climax
    name: 请并四路夹攻巢穴
    labels:
      zh:
      - 请增楚兵
      - 首尾夹攻
    start_date: 1748-08-01
    highlight_event_id: guji-岳钟琪-event-dangba
  decisions:
  - date: 1748-09-01
    title_zh: 奏请增兵三千并归党坝
    rationale: 党坝至勒乌围仅五六十里，破康八达即可直捣，分兵刮耳崖则延误时日纵贼远逃
  - date: 1748-09-01
    title_zh: 请遣回唐古忒兵另募新兵
    rationale: 唐古忒兵但长驰射不宜涉险，留之糜饷无益，不如以其饷就近募勇
- id: guji-岳钟琪-endeavor-2
  person_qid: guji-岳钟琪
  title_zh: 条陈汉土兵制与出奇之策
  summary: 历陈各路土兵怯懦无用及小金川良尔吉通贼之患，请裁土兵万余调湖广官兵并出奇兵捣勒乌围
  phases:
  - key: brewing
    name: 历验各路土兵优劣
    labels:
      zh:
      - 辨别忠怯
      - 察访内奸
    start_date: 1747-06-01
    highlight_event_id: guji-岳钟琪-event-tubing
  - key: breakthrough
    name: 密陈良尔吉通贼当诛
    labels:
      zh:
      - 揭发通贼
      - 请绝内患
    start_date: 1748-08-01
    highlight_event_id: guji-岳钟琪-event-tubing
  - key: closure
    name: 请裁土兵行奇正之道
    labels:
      zh:
      - 裁汰老弱
      - 奇兵捣巢
    start_date: 1748-09-01
    highlight_event_id: guji-岳钟琪-event-tubing
  decisions:
  - date: 1748-09-01
    title_zh: 请裁土兵一万调湖广官兵
    rationale: 新旧土兵二万惟革布什咱沃日可用，余皆怯懦疲猾，减彻无用之众方可收实效
  - date: 1748-09-01
    title_zh: 请由卡里山固噶沟出奇兵
    rationale: 刮耳崖地险碉多难攻，勒乌围路径甚多路不甚险，破勒乌围则四路自溃
