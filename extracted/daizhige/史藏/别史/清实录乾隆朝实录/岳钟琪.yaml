  dilemmas:
  - 剿与抚之间如何既速奏肤功又不致激变全蜀土司
  - 改土归流之后如何划界设汛以保永宁而不开兼并之疑
  lesson: 边疆用兵不厌详慎，抚剿兼施，成功之后更须持重守界，不可恃侥幸而贪功生事
  summary_first_person: 我出身将门，久镇川陕，此番与策楞会剿杂谷苍旺，直捣杂谷脑，招抚百余寨四万余口，枭示首恶忠中，复进图松冈，但愿边境永宁无事，不敢更生冀幸
  source_urls:
