  description: 乾隆十三年八月再奏征勦年余未克系土兵怯懦及良尔吉通贼请裁土兵调楚兵由卡里山出奇
- id: guji-岳钟琪-event-death
  person_qid: guji-岳钟琪
  title_zh: 病卒于成都
  date: 1754
  year_of: 1754
  type: death
  description: 乾隆十九年病卒，历康雍乾三朝，晚年复起督兵金川，以老成持重称
