  archetype: 边帅良将
  dilemmas:
  - 抚剿并用时如何既除川民之害又不酿成后患
  - 久镇边陲重兵在握如何始终取信于君
  lesson: 治边当辨情罪轻重而行宽严，任事愈久愈当谨慎自持以全始终。
  summary_first_person: 我起自行伍，久镇川陕，屡办边务。乾隆十四年任四川提督，奏请将为害川民之啯噜子自首免罪分别安插，又请川兵衣帽改归兵自制以养锐，并面承密旨筹备藏事。我知恩重任大，惟以不纵不苛、实心供职为报。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70351.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70351.html
endeavors:
- id: guji-岳钟琪-endeavor-1
  title_zh: 安插啯噜子与整饬川兵
  role: 四川提督
  start_date: 1749-10
  end_date: 1749-10
  summary: 奏请将扰害川民之啯噜子自首免罪分别安插回籍，并请川兵衣帽改官办为兵自制，由提督不时查点。
  phases:
  - key: brewing
    name: 察知啯噜子为川民之害
    labels:
      zh: 察害
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-1
  - key: breakthrough
    name: 奏准自首免罪分别安插
    labels:
      zh: 奏准安插
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-1
  - key: climax
    name: 严谕怙恶不悛者尽法重惩
    labels:
      zh: 严惩怙恶
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-1
  - key: closure
    name: 定川兵衣帽改归兵自制
    labels:
      zh: 整饬戎装
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-2
  decisions:
  - date: 1749-10
    title_zh: 请啯噜子自首免罪分别安插回籍
    rationale: 若徒事姑息必酿后患，宽以自首安插，严以拒捕正法，方能屏迹潜踪
  - date: 1749-10
    title_zh: 请川兵应差衣帽改令兵自制
    rationale: 官办扣银长短难随身且易滋扣克，兵自制而由提督查点洁净整齐，更得实用
- id: guji-岳钟琪-endeavor-2
  title_zh: 面承密旨会商西藏防务
  role: 四川提督
  start_date: 1749-10
  end_date: 1749-10
  summary: 在京面聆谕旨筹备藏事，缓程回川后与赴藏都统傅清在成都密商，会同纪山策楞合筹防范珠尔默特那木扎勒。
  phases:
  - key: brewing
    name: 在京面承筹藏密旨
    labels:
      zh: 面承密旨
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-3
  - key: breakthrough
    name: 缓程回任坐镇近藏
    labels:
      zh: 回镇四川
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-3
  - key: climax
    name: 与傅清在成都密行会商
    labels:
      zh: 成都会商
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-3
  - key: closure
    name: 四人合一有备无患
    labels:
      zh: 合筹有备
    start_date: 1749-10
    highlight_event_id: guji-岳钟琪-event-4
  decisions:
  - date: 1749-10
    title_zh: 领会密旨不先发制人亦不苟幸无事
    rationale: 藏地关系甚要，远夷善疑，须存有备无患，川省可朝发夕至故当预为筹备
  - date: 1749-10
    title_zh: 约傅清过成都时密商藏事
    rationale: 驻藏需旧人新任相济，川藏毗连，合纪山策楞傅清四人合为一人方不负倚任
events:
- id: guji-岳钟琪-event-birth
  title_zh: 出生于四川成都
  date: 1686
  year_of: 1686
  location: 四川成都
  description: 康熙二十五年出生，字东美，号容斋，後以军功起家川陕。
- id: guji-岳钟琪-event-1
  title_zh: 奏请安插惩创川民之啯噜子
  date: 1749-10
  year_of: 1749
  location: 四川
  description: 与策楞合奏安插啯噜子，得旨依议，令自首免罪分别安插回籍，怙恶不悛者擒拏正法，不得有意苛求。
- id: guji-岳钟琪-event-2
  title_zh: 议定川兵衣帽改归兵自制
  date: 1749-10
  year_of: 1749
  location: 四川
  description: 据称川兵衣帽向系扣银官办，长短难随身且恐扣克，应令兵自制，提督不时查点务使洁净整齐，他省仿此者俱改。
- id: guji-岳钟琪-event-3
  title_zh: 面承藏事密旨缓程回川
  date: 1749-10
  year_of: 1749
  location: 京师至四川
  description: 因珠尔默特那木扎勒情性乖张，在京面聆有备无患密旨，缓程回任，以备朝发夕至策应西藏。
- id: guji-岳钟琪-event-4
  title_zh: 子岳沺岳淓特授蓝翎侍卫
  date: 1749-10
  year_of: 1749
  location: 京师
  description: 以四川提督岳钟琪子，特授岳沺、岳淓为蓝翎侍卫，示怀远酬庸推恩之意。
- id: guji-岳钟琪-event-death
  title_zh: 卒于四川提督任后
  date: 1754
  year_of: 1754
  location: 四川
  description: 乾隆十九年卒，结束久镇川陕戎马生涯。
