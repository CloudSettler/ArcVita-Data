endeavors:
- id: guji-常青-endeavor-1
  title_zh: 赴台督师剿捕林爽文庄大田
  summary_zh: 代黄仕简督师台湾初以抚恤调拨见称继因分兵守营错失南北会攻致诸罗被围受严饬待代
  phases:
  - key: brewing
    name: 受命渡海抚恤整备
    labels:
      zh: 抚绥整军
    start_date: 1787-05-01
    highlight_event_id: guji-常青-event-dushi
  - key: breakthrough
    name: 山猪毛翻山攻南潭联络可成
    labels:
      zh: 南路联络
    start_date: 1787-07-10
    highlight_event_id: guji-常青-event-nantan
  - key: climax
    name: 诸罗告急分兵往援失利
    labels:
      zh: 分兵之误
    start_date: 1787-08-28
    highlight_event_id: guji-常青-event-zhuluo
  - key: closure
    name: 株守府城奉旨申饬待福康安代
    labels:
      zh: 待罪交代
    start_date: 1787-09-02
    highlight_event_id: guji-常青-event-daiban
  decisions:
  - date: 1787-07-15
    title_zh: 仅派五百兵接应南潭瑚图里
    rationale: 惜兵守营不亲统大兵夹攻庄大田致失肃清南路良机
  - date: 1787-08-28
    title_zh: 派魏大斌千五百兵援诸罗又分守盐水港
    rationale: 兵力益单遇贼不能抵敌收回鹿仔草仍不能前抵诸罗
  - date: 1787-08-28
    title_zh: 留广东庄义民随营助剿
    rationale: 使义民恋室悬心村庄被焚家属被戮寒招徕之望有驱之从贼之虞
- id: guji-常青-endeavor-2
  title_zh: 府城调度粮饷火药招徕义民
  summary_zh: 在府城经理调遣解送粮饷火药招抚义勇初井井有条后因咨缉逸匪纷扰数省坐失事机
  phases:
  - key: brewing
    name: 到营鼓励义勇抚恤难民
    labels:
      zh: 招徕抚恤
    start_date: 1787-06-01
    highlight_event_id: guji-常青-event-dushi
  - key: breakthrough
    name: 调拨将备解送粮饷颇有条理
    labels:
      zh: 调拨粮饷
    start_date: 1787-06-20
    highlight_event_id: guji-常青-event-nantan
  - key: climax
    name: 远咨直省海口查拏逸匪滋扰商旅
    labels:
      zh: 舍本逐末
    start_date: 1787-08-15
    highlight_event_id: guji-常青-event-zhuluo
  - key: closure
    name: 与恒瑞意见未协老师糜饷待查
    labels:
      zh: 将帅未和
    start_date: 1787-09-02
    highlight_event_id: guji-常青-event-daiban
  decisions:
  - date: 1787-08-15
    title_zh: 以高文麟供词远咨天津等处海口缉捕
    rationale: 一正贼未获而用心无用之地致商贩裹足百货腾贵不知轻重
  - date: 1787-09-02
    title_zh: 与恒瑞分营株守坐待添兵
    rationale: 各处派拨分投堵御大营兵日单屡请添兵而不亲往会合搜捕
events:
- id: guji-常青-event-birth
  title_zh: 常青出生
  date: 1725
  year_of: 1725
  place_zh: 京师
  summary_zh: 生年不详约乾隆初年出生满洲伊尔根觉罗氏家后以军功历任将军
- id: guji-常青-event-dushi
  title_zh: 就近派赴台湾督办剿捕
  date: 1787-05-01
  year_of: 1787
  place_zh: 台湾府城
  summary_zh: 以黄仕简任承恩贻误事机奉命赴台鼓励义勇抚恤难民调拨粮饷初称井井有条
- id: guji-常青-event-nantan
  title_zh: 瑚图里自山猪毛翻山攻南潭请应援
  date: 1787-07-15
  year_of: 1787
  place_zh: 南潭山猪毛
  summary_zh: 瑚图里久困山猪毛藉广东庄义民助粮翻山进攻南潭声势可联络仅得五百兵接应失夹攻庄大田之机
- id: guji-常青-event-zhuluo
  title_zh: 加派官兵应援诸罗失利受严饬
  date: 1787-08-28
  year_of: 1787
  place_zh: 诸罗鹿仔草盐水港
  summary_zh: 柴大纪守诸罗被贼断粮道派魏大斌田蓝玉零星往援不能前进又留广东庄义民随营所办著著皆错被严行申饬
- id: guji-常青-event-daiban
  title_zh: 召福康安陛见命赴台更换常青
  date: 1787-09-02
  year_of: 1787
  place_zh: 热河行在台湾
  summary_zh: 以常青恒瑞茫无主见一错百错命福康安来行在面授机宜领侍卫章京由驿赴台督办并询李侍尧常青恒瑞能否和衷集事
- id: guji-常青-event-death
  title_zh: 常青病卒
  date: 1793
  year_of: 1793
  place_zh: 京师
  summary_zh: 台湾事后内调未久至乾隆五十八年卒终以台湾分兵株守为时论所惜
