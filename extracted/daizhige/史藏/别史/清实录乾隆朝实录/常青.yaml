  reign_ref: 乾隆
  archetype: 守城持重却失机之督师将领
  dilemmas:
  - 南北分兵堵御与合力会攻之两难
  - 株守府城保全根本与亲赴诸罗解围之两难
  - 留义民守庄自卫与调义民随营助剿之两难
  lesson: 用兵贵合不贵分主将贵断不贵守株坐待必致老师糜饷寒义民之心
  summary_first_person: 我本以调拨粮饷抚恤义民见知及督师台湾讨林爽文庄大田我未能亲统大兵直赴南潭诸罗合力夹攻反零星派拨又留广东庄义民随营致其家室被戮终以措置错谬上厪南顾命福康安代我此我一生之鉴也
  source_urls:
