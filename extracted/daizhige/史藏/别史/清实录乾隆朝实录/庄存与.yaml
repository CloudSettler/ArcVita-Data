  title_zh: 条奏乡试官卷酌减中额
  summary_zh: 奏请各直省乡试官卷酌减，引发裁官卷归民卷之廷议
  phases:
  - key: brewing
    name: 观察官卷偏袒积弊
    labels:
      zh: 察弊酝酿
    start_date: 1757-06-01
