  decisions:
  - date: 1758-03-09
    title_zh: 考试严密不许传递
    rationale: 满洲根本在朴实，欲革外省怀挟陋习，故宁严毋宽
  - date: 1758-03-10
    title_zh: 君前含混未据实奏
    rationale: 思卸失察小过致面欺大罪，事后自悔当以诚对
