    highlight_event_id: guji-庄存与-event-guanjuan
  - key: climax
    name: 蒋溥奏请裁官卷归民卷
    labels:
      zh: 廷议扩大
    start_date: 1758-03-01
    highlight_event_id: guji-庄存与-event-guanjuan
  - key: closure
    name: 交大学士九卿议奏定夺
    labels:
      zh: 付议定夺
