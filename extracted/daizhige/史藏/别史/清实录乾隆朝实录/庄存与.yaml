    highlight_event_id: guji-庄存与-event-guanjuan
  decisions:
  - date: 1758-01-01
    title_zh: 条奏官卷酌减中额
    rationale: 欲防大臣子弟偏袒，又不妨孤寒进取，故请酌减以昭慎重
  - date: 1758-03-20
    title_zh: 听候九卿会议不固争
    rationale: 科制沿自圣祖谕旨，当付公议以求防弊与育才两全
