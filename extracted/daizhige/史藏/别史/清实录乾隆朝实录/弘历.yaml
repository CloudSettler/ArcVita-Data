endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 严办湖北松滋盐枭夺犯殴差案
  summary: 针对李曰万等贩私夺犯打伤兵丁之事连降严旨令现获速审尽法惩治未获上紧缉拿以儆凶顽而靖地方
  phases:
  - key: brewing
    name: 私盐越卡潜行被获
    labels:
      zh: 缉获私盐
    start_date: 1765-10-01
    highlight_event_id: guji-弘历-event-1765-yanxiao
  - key: breakthrough
    name: 纠众夺犯殴差砍缆放船
    labels:
      zh: 夺犯殴差
    start_date: 1765-10-02
    highlight_event_id: guji-弘历-event-1765-yanxiao
  - key: climax
    name: 降旨从重审拟毋存姑息
    labels:
      zh: 严旨惩枭
    start_date: 1765-10-05
    highlight_event_id: guji-弘历-event-1765-yanxiao
  - key: closure
    name: 现获速结未获严缉
    labels:
      zh: 分别惩治
    start_date: 1765-10-06
    highlight_event_id: guji-弘历-event-1765-yanxiao-xuban
  decisions:
  - date: 1765-10-05
    title_zh: 谕令将现获各犯从重审讯定拟
    rationale: 恶枭不法已极若不严加处治无以儆凶顽而靖地方故令毋得稍存姑息并密派兵役多方躧缉逸犯
  - date: 1765-10-06
    title_zh: 谕令就现获三十名速审治罪不必俟夥犯齐全
    rationale: 既已弋获多人应作速究审以示严惩使奸徒知警畏若待齐全恐稽延时日别生疏虞故分别尽法惩治未获者仍上紧严拿
- id: guji-弘历-endeavor-2
  title_zh: 加恩抚恤水旱偏灾并经画屯田边储
  summary: 于直隶浙江甘肃山东湖北等地偏灾分别蠲缓借贷赏给并添屯田兵筹巴里坤秋成奖赏以惠养黎元而固边防
  phases:
  - key: brewing
    name: 各省奏报偏灾歉收
    labels:
      zh: 奏报偏灾
    start_date: 1765-10-03
    highlight_event_id: guji-弘历-event-1765-zhenxu
  - key: breakthrough
    name: 命查明加恩覆奏候旨
    labels:
      zh: 查明覆奏
    start_date: 1765-10-05
    highlight_event_id: guji-弘历-event-1765-zhenxu
  - key: climax
    name: 加恩赏给齐齐哈尔呼兰银谷口粮
    labels:
      zh: 加恩赏给
    start_date: 1765-10-12
    highlight_event_id: guji-弘历-event-1765-zhenxu
  - key: closure
    name: 派兵屯田议叙巴里坤秋成
    labels:
      zh: 屯田奖赏
    start_date: 1765-10-15
    highlight_event_id: guji-弘历-event-1765-tuntian
  decisions:
  - date: 1765-10-05
    title_zh: 谕令详查天台等县旱灾及甘肃巩昌地动加恩事宜
    rationale: 来岁春收尚远青黄不接之际山僻穷黎生计艰窘故令详查覆奏候朕酌量降旨使小民不致失所
  - date: 1765-10-12
    title_zh: 加恩将齐齐哈尔呼兰请借银谷全行赏给免偿
    rationale: 该处既被水灾若借贷仍令偿还旗户索伦不无拮据故全行赏给并借给官屯口粮耔种豁免应交额粮
  - date: 1765-10-15
    title_zh: 派绿旗兵一千名赴乌噜木齐乌什屯田并奖巴里坤有功将弁
    rationale: 边地屯田既裕军储又化荒为熟故添派屯田兵管屯将弁交部议叙兵丁赏盐菜以示鼓励
events:
- id: guji-弘历-event-birth
  type: birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于圆明园
  description: 康熙五十年八月十三日生为雍亲王第四子后即皇帝位年号乾隆
- id: guji-弘历-event-death
  type: death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩寿八十有九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
- id: guji-弘历-event-1765-yanxiao
  type: career
  date: 1765-10-05
  year_of: 1765
  title_zh: 降旨严办李曰万盐枭夺犯殴差案
  description: 湖北松滋盐枭李曰万等船载私盐越卡贩卖被获后纠众三十余乘夜打伤兵丁砍缆夺船并推下巡役哨船朕连谕吴达善李因培将现获从重审拟未获多方躧缉
  endeavor_ref: guji-弘历-endeavor-1
- id: guji-弘历-event-1765-yanxiao-xuban
  type: career
  date: 1765-10-06
  year_of: 1765
  title_zh: 谕就现获三十名速审尽法惩治
  description: 据奏先后获犯已三十名尚有戈大德等十一名未获朕谕毋庸俟夥犯齐全始结案即将现获严加审究分别尽法惩治未获者上紧严拿毋使漏网
  endeavor_ref: guji-弘历-endeavor-1
- id: guji-弘历-event-1765-zhenxu
  type: career
  date: 1765-10-12
  year_of: 1765
  title_zh: 加恩赏给齐齐哈尔呼兰水灾银谷
  description: 据富僧阿奏齐齐哈尔呼兰田禾被水请借旗户谷一万二千余石索伦银一千七百余两及官屯口粮耔种朕加恩全行赏给不必偿还并豁免应交额粮
  endeavor_ref: guji-弘历-endeavor-2
- id: guji-弘历-event-1765-tuntian
  type: career
  date: 1765-10-15
  year_of: 1765
  title_zh: 派兵屯田并奖叙巴里坤秋成
  description: 准伊犁将军明瑞等请著杨应琚派绿旗兵一千名前往乌噜木齐乌什屯田巴里坤屯田秋成管屯将弁交部议叙兵丁赏一月盐菜效力废员分别发伊犁回旗回籍
  endeavor_ref: guji-弘历-endeavor-2
