endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 督办永定河北岸漫口引河合龙
  summary: 大雨后河水陡涨新埽被掀，朕谕暂让其锋，先于老坎斜镶软坝，更开引河归旧，详绘全图，确查灾赈，以期十一日合龙
  phases:
  - key: brewing
    name: 大雨漫口初报
    labels:
      zh:
      - 永定河
      - 漫口初险
    start_date: 1770-06-23
    highlight_event_id: guji-弘历-event-yongding-chu
  - key: breakthrough
    name: 暂让其锋另开引河
    labels:
      zh:
      - 软坝挑溜
      - 引河归旧
    start_date: 1770-06-25
    highlight_event_id: guji-弘历-event-yongding-chu
  - key: climax
    name: 软坝引河并进
    labels:
      zh:
      - 合龙在即
      - 灾赈核查
    start_date: 1770-07-02
    highlight_event_id: guji-弘历-event-yongding-he
  - key: closure
    name: 十一日合龙保民
    labels:
      zh:
      - 合龙
      - 抚恤
    start_date: 1770-07-03
    highlight_event_id: guji-弘历-event-yongding-he
  decisions:
  - date: 1770-06-23
    title_zh: 谕暂让汹涌先挑引河
    rationale: 盛涨溜急非人力可强争，先避其锋，俟流缓施工，引河速成则合龙易集事
  - date: 1770-06-25
    title_zh: 谕详绘全图确查被水成灾
    rationale: 漫溢若出遥堤必损民田庐舍，须按原图方向较准远近湾直，分别借种修费，毋使小民失所
- id: guji-弘历-endeavor-2
  title_zh: 筹划缅事以扰制狡兼正边刑
  summary: 缅匪拘留苏尔相欲激我大举，朕断不可堕其以逸待劳之术，令选精兵千名相机往击蹂躏其地，同时正焦喜财伦常之狱以明刑弼教
  phases:
  - key: brewing
    name: 缅匪食言陆梁
    labels:
      zh:
      - 缅甸
      - 边情
    start_date: 1770-06-28
    highlight_event_id: guji-弘历-event-mian
  - key: breakthrough
    name: 断不容大举进兵
    labels:
      zh:
      - 勿堕敌术
      - 以扰制狡
    start_date: 1770-07-02
    highlight_event_id: guji-弘历-event-mian
  - key: climax
    name: 分路惊扰贼匪
    labels:
      zh:
      - 海兰察
      - 哈国兴
    start_date: 1770-07-02
    highlight_event_id: guji-弘历-event-mian
  - key: closure
    name: 明刑正伦以靖内安边
    labels:
      zh:
      - 焦喜财案
      - 明刑弼教
    start_date: 1770-07-03
    highlight_event_id: guji-弘历-event-jiaoan
  decisions:
  - date: 1770-06-23
    title_zh: 加等定拟老赵氏发伊犁为奴
    rationale: 幼主无辜而忍心绝嗣，不可以寻常尊长律蔽辜，须通谕中外以示惩创
  - date: 1770-07-02
    title_zh: 令阿桂彰宝选兵相机蹂躏
    rationale: 大举即堕贼计徒伤士卒，置之不办又任其猖獗，宜使贼不得休息且可退出，务期惊扰而不深入
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  summary: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即位为乾隆皇帝
- id: guji-弘历-event-jiaoan
  title_zh: 钦断焦喜财老赵氏伦常之狱
  date: 1770-06-23
  year_of: 1770
  place_zh: 北京紫禁城
  summary: 乾隆三十五年六月乙亥朔，谕刑部以雇工人谋死家长律将焦喜财凌迟，老赵氏发往伊犁给厄鲁特为奴，通谕中外
- id: guji-弘历-event-yongding-chu
  title_zh: 谕德成杨廷璋办永定河漫口
  date: 1770-06-23
  year_of: 1770
  place_zh: 直隶永定河
  summary: 六月二十八日大雨河涨新埽被掀，谕暂让汹涌，于老坎斜镶软坝，开河引溜归旧，并查遥堤内外被水成灾分别抚恤
- id: guji-弘历-event-mian
  title_zh: 谕阿桂彰宝相机进剿缅匪
  date: 1770-07-02
  year_of: 1770
  place_zh: 云南边外
  summary: 甲申谕以缅匪狡猾激我进兵断不可大举，令选精兵千名交海兰察哈国兴等相机往击，常保住长青带兵策应
- id: guji-弘历-event-yongding-he
  title_zh: 引河软坝告成十一日合龙
  date: 1770-07-03
  year_of: 1770
  place_zh: 直隶永清东安固安
  summary: 德成杨廷璋奏引河已九分软坝已八分，十一日可以合龙，被灾户口缺种借给义仓，淹损酌给修费
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  summary: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
