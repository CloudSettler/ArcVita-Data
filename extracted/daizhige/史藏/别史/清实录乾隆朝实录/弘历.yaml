    title_zh: 却群臣以日易月之请定行三年丧
    rationale: 受皇考顾复深恩昊天罔极且朝章具备守成可行故素服斋居亲诣奠献以稍尽子臣之谊
  - date: 1735-10-09
    title_zh: 上大行皇帝尊谥宪皇帝庙号世宗
    rationale: 皇考敬天勤民善继善述功德隆盛宜备显号徽称以昭垂万世故集廷臣详慎公议
  - date: 1735-10-10
    title_zh: 严饬张照苗疆奏陈乖谬及申饬僧徒
    rationale: 张照巧词揣度自相矛盾有亏大臣之义僧徒借端夸耀有坏宗风故须申饬以正纲纪
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三日生为雍亲王第四子自幼蒙圣祖抚育宫中钟爱逾常
- id: guji-弘历-event-accession
  title_zh: 太和殿即皇帝位改元乾隆
  date: 1735-10-03
  year_of: 1735
  place_zh: 北京太和殿
  description_zh: 雍正十三年九月初三祭告天地宗庙社稷即皇帝位于太和殿颁诏天下以明年为乾隆元年并敷恩三十余条
- id: guji-弘历-event-mourning-rite
  title_zh: 奉移梓宫雍和宫并定三年丧制
  date: 1735-10-05
  year_of: 1735
  place_zh: 北京雍和宫
  description_zh: 步行随梓宫送至雍和宫定百日内亲诣奠献定庙讳以允正避书写却以日易月之请
- id: guji-弘历-event-posthumous-title
  title_zh: 议上世宗宪皇帝尊谥庙号
  date: 1735-10-09
  year_of: 1735
  place_zh: 北京宫中
  description_zh: 率王大臣公议上大行皇帝尊谥敬天昌运建中表正文武英明宽仁信毅大孝至诚宪皇帝庙号世宗并上皇太后尊号追崇孝敬皇后
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京养心殿
  description_zh: 嘉庆四年正月初三日崩在位六十年禅位后训政三年为清代享国最久之帝
