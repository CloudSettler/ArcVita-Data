endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 整饬言路釐正台风
  description: 因言官摭拾浮嚣而饬甄别科道复止通行甄别以存广开言路之本意
  phases:
  - key: brewing
    name: 言路浮嚣渐成风气
    labels:
      zh:
      - 言路
      - 台垣
      - 整饬
    start_date: 1746-11-02
    highlight_event_id: guji-弘历-event-yanlu
  - key: climax
    name: 止甄别而饬改悔复旧制
    labels:
      zh:
      - 宽严相济
      - 考选旧制
    start_date: 1746-11-06
    highlight_event_id: guji-弘历-event-kaoxuan
  decisions:
  - date: 1746-11-02
    title_zh: 仅将李兆钰宜兆罴交部议处
    rationale: 以朕向来优容含纳所致若因一人纰缪而通行甄别非兼收并包本意故祗惩首过以示警
  - date: 1746-11-02
    title_zh: 停止通行甄别恢复保举考试引见旧例
    rationale: 甄别若出于勉强则苟且塞责未必允当不如饬现任科道省察改悔复旧制保举考试以清其源
- id: guji-弘历-endeavor-2
  title_zh: 郊祀展诚叠赈灾黎
  description: 冬至亲祀圜丘并于山东江南直隶等处水旱叠沛恩赈以济民食
  phases:
  - key: brewing
    name: 山东江南水旱成灾
    labels:
      zh:
      - 赈恤
      - 仓储
      - 民生
    start_date: 1746-11-05
    highlight_event_id: guji-弘历-event-jiazhen
  - key: breakthrough
    name: 冬至斋戒亲祀圜丘
    labels:
      zh:
      - 郊祀
      - 敬天
      - 礼制
    start_date: 1746-11-08
    highlight_event_id: guji-弘历-event-jiaoji
  decisions:
  - date: 1746-11-05
    title_zh: 山东八州县极次贫再加赈两月一月
    rationale: 岁内赈粮尚可糊口来春去麦收尚远故于例赈之外再加赈于二三月按月给发以济青黄不接
  - date: 1746-11-08
    title_zh: 动浙江永济仓谷十万石协济江南
    rationale: 江南上下江加赈需米甚多恐仓储不敷而浙江连年丰稔故就近拨运以济急需
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 诞生于雍亲王府
  description: 康熙五十年八月十三日生为雍亲王胤禛第四子母孝圣宪皇后钮祜禄氏
  place_zh: 北京雍亲王府
- id: guji-弘历-event-yanlu
  date: 1746-11-02
  year_of: 1746
  title_zh: 谕止科道通行甄别
  description: 以近来言官摭拾浮嚣本欲令大学士九卿甄别科道复以广开言路本意祗将李兆钰交部议处宜兆罴交部察议并停止通行甄别
  place_zh: 北京紫禁城
- id: guji-弘历-event-jiazhen
  date: 1746-11-05
  year_of: 1746
  title_zh: 加赈山东八州县贫民
  description: 寿光乐安博兴金乡鱼台汶上济宁东平等八州县被灾较重于例赈外极贫再加赈两月次贫再加赈一月
  place_zh: 山东
- id: guji-弘历-event-kaoxuan
  date: 1746-11-06
  year_of: 1746
  title_zh: 复御史考选旧制
  description: 准吏部所奏御史仍复考选旧制由各衙门堂官秉公保举咨送考试引见记名补用
  place_zh: 北京
- id: guji-弘历-event-jiaoji
  date: 1746-11-11
  year_of: 1746
  title_zh: 冬至亲祀天于圜丘
  description: 以冬至祀天斋戒三日诣南郊斋宫斋宿壬寅日亲诣圜丘行礼并遣官祭诸陵及端慧皇太子园寝
  place_zh: 北京天坛圜丘
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 龙驭上宾于养心殿
  description: 嘉庆四年正月初三日崩年八十有九庙号高宗谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  place_zh: 北京紫禁城养心殿
