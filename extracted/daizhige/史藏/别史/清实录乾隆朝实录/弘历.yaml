  decisions:
  - date: 1748-03-10
    title_zh: 加赈天津等十五州县厅一月
    rationale: 停赈将届而麦秋尚远，被灾较重者恐乏接济，故就北仓漕粮动拨以普沾惠泽
  - date: 1748-03-14
    title_zh: 截留南漕六十万石补东省仓储
    rationale: 山东被水州县多，将来需借粜接济，故豫筹补仓并额外赏旗丁月粮以恤运丁
