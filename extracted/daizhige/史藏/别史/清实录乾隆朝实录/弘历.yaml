  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆
  archetype: 励治守成之君
  dilemmas:
  - 回教旧经久传中外，若严查则安分回众无所措手足，若置之不问又恐邪教惑众敛钱滋事难辨
  - 缅酋骨肉相残内衅自乱，若兴师问罪则师出无名且水土不宜，若置之化外又恐边衅窜扰须严守边界
  lesson: 宽严须权其轻重，军务须知己知彼，静镇守成方合堂堂正正之体
  summary_first_person: 朕继绪四十余载，年逾古稀，犹日理万几，夙夜兢业，恐吏治日久废弛，民生尚有苦累。是以于回经旧教则谕令省释安抚，毋庸苛求滋扰，于缅酋内讧则谕令静镇守边，无庸兴师，皆筹之已熟，务使安分者得安本业，边圉得以镇静无事
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷1159.md
