  - 番夷跳梁当怀德畏威以休息还是乘胜进剿以邀功
  - 营兵聚噪当查明首从严肃军纪还是姑息回护以安兵心
  lesson: 绥靖边圉贵知大体不可贪功启衅整饬武备贵得实情不可畏懦取巧
  summary_first_person: 我以藐躬继统守成乾隆十八年春谒泰陵尽孝在杂谷既平之后诫川督慎重善后置郭罗克于不问在延安兵噪之后严察马乾畏懦以肃戎行惟愿偃武修文使民气得以休息
  source_urls:
