  decisions:
  - date: 1776-03-20
    title_zh: 以足民无逸垂训
    rationale: 常存百姓不足之心以无逸为所，令各省无匿灾伤亟赈恤缓贷
  - date: 1776-03-26
    title_zh: 准专谥通谥刊录停访
    rationale: 以明史辑览一统志为断得三千六百余人，刊胜朝殉节诸臣录，驳再访以免混淆滋扰
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  type: birth
  title_zh: 生于雍亲王府
  description: 康熙五十年八月十三日生，即后之高宗纯皇帝
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  type: death
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩，寿八十有九
- id: guji-弘历-event-jingyan-1776
  date: 1776-03-20
  year_of: 1776
  type: 事业
  title_zh: 仲春经筵进讲论语书经
  description: 御文华殿听讲百姓足君孰与不足及君子所其无逸，宣御论垂训赐茶宴本仁殿
- id: guji-弘历-event-jinchuan-1776
  date: 1776-03-21
  year_of: 1776
  type: 事业
  title_zh: 谕阿桂速攻贼巢通筹军粮
  description: 以攻围逾月粮石有限，令上紧炮轰旬日奏功酌减兵数赶运军食，盼红旗驰奏
- id: guji-弘历-event-tusi-1776
  date: 1776-03-19
  year_of: 1776
  type: 事业
  title_zh: 定土司轮班入觐
  description: 准阿桂等奏令各土司十一月起身岁内到京，与蒙古土尔扈特回部伯克同与朝正
- id: guji-弘历-event-sheji-1776
  date: 1776-03-24
  year_of: 1776
  type: 事业
  title_zh: 亲祭大社大稷议风雨移奉
  description: 戊申亲诣行礼，以祭日遇风雨神位露设不安，命议移奉拜殿临祭十刻前值风雨即移设殿内致祭
- id: guji-弘历-event-xunji-1776
  date: 1776-03-26
  year_of: 1776
  type: 事业
  title_zh: 定胜朝殉节诸臣录
  description: 准大学士九卿议分专谥通谥忠烈忠节节愍烈愍，入忠义祠悬榜刊录颁行停直省再访
- id: guji-弘历-event-fangjian-1776
  date: 1776-03-26
  year_of: 1776
  type: 事业
  title_zh: 申饬受降严防
  description: 以索诺木或诣营乞降恐随行暗藏袖枪，再谕阿桂等设法严防慎之又慎六百里加紧传谕
