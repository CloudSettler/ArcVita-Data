  lesson: 养民以厚其生制蛮以审其势事缓则静以听之民困则厚以济之
  summary_first_person: 朕御极二十七年值京师夏潦收减即分厂平粜采买接济并豫支百官俸米以平市价金川郎卡扰党坝朕不令官兵轻动惟谕以蛮攻蛮静以听之直豫水潦则劝开沟洫以资宣泄灌溉直东灾后则预筹展赈以接青黄惟愿民食充而边衅宁也
