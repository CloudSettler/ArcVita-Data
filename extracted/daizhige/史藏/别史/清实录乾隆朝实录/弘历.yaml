  - key: closure
    name: 蓋屋養貧
    labels:
      zh:
      - 養貧
      - 籌屋
    start_date: 1737-03-07
    highlight_event_id: guji-弘历-event-kuanmian-shangqian
  decisions:
  - date: 1737-03-04
    title_zh: 長蘆欠銀分十二年徵收
    rationale: 眾商舊欠十六萬餘兩及王至德欠內務府十萬兩皆遠年積累，非現年額課可比，若新舊並完則商力竭蹷，故分年徵收以示優恤
  - date: 1737-03-06
    title_zh: 入官旗地因地定租曉諭辦理
    rationale: 旗地租輕而百姓仍納重租致吏胥中飽，須派員秉公更定，豐歉酌量減補，一視同仁，毋使愚民疑為增賦
