endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 赈济直豫旱灾缓徵截漕
  description: 乾隆五十七年春夏直隶顺德广平等府与河南彰德卫辉怀庆三府缺雨麦歉，先期截留漕米，加恩缓徵，清理庶狱以祈甘霖
  phases:
  - key: brewing
    name: 春夏缺雨奏报渐至
    labels:
