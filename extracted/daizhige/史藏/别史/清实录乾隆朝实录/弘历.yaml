  date: 1763-01-25
  year_of: 1763
  type: career
  title_zh: 正月降旨展赈直隶山东灾民
  description: 以青黄不接加恩将直隶被灾较重十七州县极次贫及稍轻二十八州县极贫展赈一月又将山东齐河等三十州县卫极贫加赈并及次贫拨通仓稄米十二万石命方观承阿尔泰实力奉行
- id: guji-弘历-event-yili
  person_id: guji-弘历
  date: 1763-01-26
  year_of: 1763
  type: career
  title_zh: 谕筹伊犁移驻官兵城屋粮饷及开采煤窑
  description: 令明瑞于乌哈尔里克新城与固勒扎回城之间择高阜筑大城给凉州庄浪移驻官兵七千余间屋计粮至丁亥麦收可支三年并增屯田兵一千五百名又令索伦察哈尔仍游牧约束采煤兵民
- id: guji-弘历-event-dayue
