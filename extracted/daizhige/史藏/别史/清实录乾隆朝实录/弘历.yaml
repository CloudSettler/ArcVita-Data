  - 明刑弼教与尊长常律之间如何加惩惨毒以正伦常风化
  - 永定河盛涨难争与迅速合龙保全民田庐舍之间如何相机进退
  - 缅匪激我大举与官兵不服水土劳师远涉之间如何以扰制狡
  lesson: 明刑所以弼教，治河贵在相机，驭夷宜审劳逸，不可逞忿堕术
  summary_first_person: 朕弘历，继统守成，躬亲庶政，此卷所记乾隆三十五年六月事，朕亲断焦喜财老赵氏之狱以正风化，督永定河漫口先开引河以待合龙，饬直豫搜捕飞蝗，复筹缅事令以扰制狡，凡谕旨往复，皆朕斟酌宽严劳逸之心
