  dilemmas:
  - 江淮积歉之后蠲税恤商与国用常供之间如何权衡
  - 荒年劝谕富户出粜与勒令强夺伤风之间如何化导
  - 远谒奉天祖陵与京师政务不致稽迟之间如何委任
  lesson: 恤民须通有无之源远行须托得人之重方能恩泽下究而根本不摇
  summary_first_person: 朕即位八年江淮徐海屡被水灾商贩不通民力艰难故宽免二十三州县旧欠杂税豁免临清铜补商补又以川米接济江南截留江西并饬化导富户乐输严惩抢夺朕恭奉皇太后谒奉天祖陵命宗王大学士在京总理缮写列朝实录尊藏盛京皆所以敬天法祖而安苍生也
