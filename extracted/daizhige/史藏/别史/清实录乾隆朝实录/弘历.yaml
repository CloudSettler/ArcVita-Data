  dilemmas:
  - title_zh: 风闻言事与扰累地方之两难
    description_zh: 欲以来言官纠察奉行善否，又恐一利即有一弊，长骄悍而不畏官长，故令指实具奏以归确实
  - title_zh: 国威远扬与民力物命之权衡
    description_zh: 金川负固既已兴师，若弃不图无以威蛮服番，若久顿大兵又伤财动众，故密筹班师柔远之上策
  lesson: 为君行政当用中，不因噎废食，不以明珠抵鹊，事事归于确实而以民力为念
  summary_first_person: 朕以藐躬承大统，夙夜以民事边务为怀，考翰林以正文衡，阅金川以惜民力，凡诏令皆欲情理至当，不存成见
  source_urls:
