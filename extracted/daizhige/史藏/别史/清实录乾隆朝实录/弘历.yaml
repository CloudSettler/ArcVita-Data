  summary_first_person: 朕即位五十有七年，夙夜廑念民瘼边防，直豫北数府春夏缺雨，朕先期截留漕米三十万石，复加恩缓徵新旧钱粮谷石，饬地方实力经理使小民均沾实惠，廓尔喀侵藏负固，朕命福康安等统兵声罪致讨，预授机宜或直捣贼巢或慑威纳款，必令畏威服罪永不犯藏，始为完善
