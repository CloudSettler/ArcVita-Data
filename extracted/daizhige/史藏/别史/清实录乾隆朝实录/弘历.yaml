  person_id: guji-弘历
  title_zh: 东巡恭谒祖陵锡宴颁恩
  summary_zh: 奉皇太后东巡，依次大飨永陵福陵昭陵，莅盛京受贺锡宴，作世德舞辞，颁恩诏覃惠旗民
  phases:
