  decisions:
  - date: 1751-03-01
    title_zh: 增取江苏安徽浙江岁试文童名额
    rationale: 三吴两浙人文所萃，法祖巡幸嘉惠胶庠，覃敷教泽，拔取真才
  - date: 1751-03-05
    title_zh: 加赈兰山郯城宿迁清河桃源并豁免耔种盐价
    rationale: 清跸所经见民气逊于他处，加赈一月，免借出耔种及两淮灶户折价，使穷黎均沾实惠
- id: guji-弘历-endeavor-2
  title_zh: 巡河阅堤兴工保民兼饬吏治边务
  summary_zh: 渡黄阅埽，视高家堰，命建淮安石工，修高堰坝工，奖叙河员，同时严处亏空，审理驻藏，防范准噶尔通藏
  phases:
  - key: brewing
    name: 渡黄阅埽祭河淮
    labels:
      zh:
