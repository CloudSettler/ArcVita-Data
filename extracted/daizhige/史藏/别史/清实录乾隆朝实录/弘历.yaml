  date: 1737-03-04
  year_of: 1737
  place_zh: 北京紫禁城乾清門
  description: 乾隆二年二月諭總理事務王大臣，長蘆眾商舊欠分十二年徵收，王至德欠帑分十三年完交，惠養商民
