  - key: breakthrough
    name: 廷论用人权衡
    labels:
      zh: 得人任事
    start_date: 1746-09-27
    highlight_event_id: guji-弘历-event-1746-liyuanliang
  - key: climax
    name: 严饬假公济私
    labels:
      zh: 饬谕科道
    start_date: 1746-09-27
    highlight_event_id: guji-弘历-event-1746-liyuanliang
  - key: closure
    name: 署理户部事务
    labels:
      zh: 兼理部务
    start_date: 1746-09-28
    highlight_event_id: guji-弘历-event-1746-wanshou
  decisions:
  - date: 1746-09-27
    title_zh: 留李元亮不准开缺守制
    rationale: 汉军与满洲无异都统例不开缺且侍郎乏人可代当因才权宜
  - date: 1746-09-27
    title_zh: 严饬周礼并晓谕科道
    rationale: 借守礼博敢言之名行门户徇私之实断不可长防明季言官之患
  - date: 1746-09-28
    title_zh: 令蒋溥署理户部侍郎兼理部务
    rationale: 户部事务繁多吕炽出学差须重臣兼理以免旷废
