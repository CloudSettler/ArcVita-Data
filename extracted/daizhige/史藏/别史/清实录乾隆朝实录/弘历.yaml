      - 除弊
    start_date: 1745-11-05
    highlight_event_id: guji-弘历-event-qinzhen
  - key: closure
    name: 议捐监本折兼收裕积贮
    labels:
      zh:
      - 积贮
      - 课吏
    start_date: 1745-11-11
    highlight_event_id: guji-弘历-event-qinzhen
  decisions:
  - date: 1745-11-05
    title_zh: 申饬南河河臣白钟山勿惜小费误大工
    rationale: 河工关系重大与别项不同，先事豫防所费少而决口赈济所费多，须一心担承不得过紧综核
  - date: 1745-11-05
    title_zh: 谕各督抚灾重地方可以亲往者亲往查察
    rationale: 地方辽阔水旱时有，有司奉行易生侵克，亲往董率则弊端减少闾阎得沾实惠
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，母熹贵妃钮祜禄氏
- id: guji-弘历-event-death
  title_zh: 崩于北京紫禁城养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城
  description: 嘉庆四年正月初三日崩，传位嘉庆后为太上皇帝，谥纯皇帝，庙号高宗
- id: guji-弘历-event-juanmian
  title_zh: 蠲免川省丙寅年杂赋贡马
  date: 1745-11-04
  year_of: 1745
  place_zh: 北京紫禁城
  description: 以川省民番杂处米豆杂粮折征夷赋贡马未沾地丁蠲恩，特命宁远叙州建昌龙安松潘等处一例蠲免
- id: guji-弘历-event-hegong
  title_zh: 访闻饬戒南河河臣白钟山
  date: 1745-11-05
  year_of: 1745
  place_zh: 北京圆明园
  description: 闻陈家浦越堤漫决二百余丈及河臣发帑过紧工员观望，谕以钱粮宜省而河工须权轻重不得幸灾观望
- id: guji-弘历-event-qinzhen
  title_zh: 谕督抚亲往灾重处查赈禁赌
  date: 1745-11-05
  year_of: 1745
  place_zh: 北京圆明园
  description: 以赈务侵渔扣克在所不免，命灾重处督抚亲往董率稽查，又以山西赌博致命案多饬严查禁赌
- id: guji-弘历-event-jieliu
  title_zh: 截留江浙漕粮备江淮春赈
  date: 1745-11-07
  year_of: 1745
  place_zh: 北京圆明园
  description: 以凤颍泗淮徐海秋被水灾，命截留上江漕粮五万石下江漕粮十万石，以备明春赈粜平粜之用
