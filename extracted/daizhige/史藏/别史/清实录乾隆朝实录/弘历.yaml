- id: guji-弘历-event-death
  title_zh: 逝世
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日崩于养心殿终年八十九岁
- id: guji-弘历-event-1
  title_zh: 七月癸亥训诸臣公忠体国
  date: 1741-08-12
  year_of: 1741
  description: 谕鄂善喀尔钦等案皆准情酌理而办饬诸臣矢公忠去观望以成宽大之治
- id: guji-弘历-event-2
  title_zh: 甲子谕断宝泉局案喀尔钦正法
  date: 1741-08-13
  year_of: 1741
  description: 依议科断炉头扣克行贿案并命喀尔钦贿卖生童解部即行正法以肃国法
- id: guji-弘历-event-3
  title_zh: 乙丑谕整顿闽广械斗殴官刁风
  date: 1741-08-14
  year_of: 1741
  description: 因屏南殴典史仙游辱知县漳泉械斗等事命闽广江西督抚化导整顿怙过不悛者置法
- id: guji-弘历-event-4
  title_zh: 丁卯禁滥建生祠察核去留
  date: 1741-08-16
  year_of: 1741
  description: 因郝玉麟卢焯在闽滥建生祠书院命通行各省秉公察核慎勿瞻徇以昭激劝
- id: guji-弘历-event-5
  title_zh: 庚午训饬营伍废弛虚冒空粮
  date: 1741-08-19
  year_of: 1741
  description: 以抚标废弛尤甚空粮屡禁不止命督抚提镇力为振刷一二年后派员校验优劣
