endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 重刻五朝册宝尊藏太庙并诫子孙
  summary: 以和阗良玉重造五朝册宝全分孟冬时享供奉太庙旧宝送盛京尊藏并编庙字喜字二号永为定制谆诫后世敬天勤民
  phases:
  - key: brewing
    name: 平定伊犁回部辟疆
    labels:
      zh: 平伊犁定回部辟疆二万里
    start_date: 1759-01-01
    highlight_event_id: guji-弘历-event-cebao
  - key: breakthrough
    name: 选择精璆董率敬造
    labels:
      zh: 选精璆敬造五朝册宝全分
    start_date: 1782-01-01
    highlight_event_id: guji-弘历-event-cebao
  - key: climax
    name: 孟冬时享礼成入庙
    labels:
      zh: 恭奉入庙玉检金绳对越
    start_date: 1782-11-04
    highlight_event_id: guji-弘历-event-cebao
  - key: closure
    name: 面命耳提永存无疆之恤
    labels:
      zh: 录旨三通存内阁尚书房内务府
    start_date: 1782-11-04
    highlight_event_id: guji-弘历-event-admonish
  decisions:
  - date: 1782-11-04
    title_zh: 以今岁孟冬时享供奉新宝旧宝送盛京太室
    rationale: 玉色长短未能一律须以精璆画一以昭祖宗功德之成
  - date: 1782-11-04
    title_zh: 编余玉为庙字喜字二号永为定制
    rationale: 备后世册宝归政尊崇之用使子孙凛天命知守成不易
- id: guji-弘历-endeavor-2
  title_zh: 加赈江淮山东水灾并严治贪墨抽换
  summary: 江苏山东河南安徽偏灾加恩截漕赈恤展赈并彻底根究陈辉祖抽换王亶望赃物及浙省经手诸员舞弊
  phases:
  - key: brewing
    name: 查明偏灾酌借口粮耔种
    labels:
      zh: 沛丰铜邳等处加恩赈恤
    start_date: 1782-11-08
    highlight_event_id: guji-弘历-event-zhenxu
  - key: breakthrough
    name: 截留漕粮以资接济
    labels:
      zh: 截留江属成熟州县漕粮八万石
    start_date: 1782-11-10
    highlight_event_id: guji-弘历-event-zhenxu
  - key: climax
    name: 彻底根究抽换抵兑
    labels:
      zh: 革职拿问王士干等严讯陈辉祖
    start_date: 1782-11-06
    highlight_event_id: guji-弘历-event-zhachao
  - key: closure
    name: 整饬吏治申饬封疆
    labels:
      zh: 饬各省甄别四库议叙庸碌之员
    start_date: 1782-11-12
    highlight_event_id: guji-弘历-event-zhachao
  decisions:
  - date: 1782-11-10
    title_zh: 准截留漕粮八万石赈徐淮海属灾重地
    rationale: 下游漫水连被灾祲需米较多就近截留以免运送之烦
  - date: 1782-11-06
    title_zh: 将经手造册诸员革职拿问彻底根究
    rationale: 底册未造者百宗添入者八十九宗显系通同舞弊不可丝毫遁饰
