  date: 1748-07-12
  year_of: 1748
  place_zh: 北京乾清宫
  description_zh: 乾隆十三年六月庚申亲试翰林詹事，定齐召南李因培王际华为一等升学士，余分二三四等升降休致罚俸有差，并升满洲翰詹世贵永世等
  related_endeavor_id: guji-弘历-endeavor-1
