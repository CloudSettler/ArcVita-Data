  decisions:
  - date: 1783-02-06
    title_zh: 交部议叙黄仕简杨廷桦
    rationale: 嘉其闻报即带兵渡台查办妥速匪党解散民情宁帖故示嘉奖以劝奋勉
  - date: 1783-02-09
    title_zh: 革职拿问苏泰冷震金金蟾桂等
    rationale: 以其立意主和姑息养奸因循怠惰致蔓延三月必严惩以戒贻误地方
- id: guji-弘历-endeavor-2
  title_zh: 乾隆四十八年正月华北江淮春赈加恩
  summary: 以江苏山东河南安徽上年漫水淹浸正赈已毕青黄不接，再加恩展赈一月至两月，并酌借耔种口粮，董率督抚实力妥办以溥春祺
  phases:
