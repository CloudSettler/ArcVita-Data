endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 整饬楚北健讼与督责速结积案
  summary: 据毕沅奏楚北讼风最甚，谕令管押原告速审速结，逾限销案并严参纵逃之官
  phases:
  - key: brewing
    name: 楚北讼风积案酿成
    labels:
      zh: 吏治废弛
    start_date: 1790-11-01
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 谕令押审速结突破
    labels:
      zh: 管押速断
    start_date: 1791-01-05
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 申饬毕沅怠缓之咎
    labels:
      zh: 督责封疆
    start_date: 1791-01-05
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 立两月不到销案定例
    labels:
      zh: 立规儆惧
    start_date: 1791-01-05
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1791-01-05
    title_zh: 谕令控案即押原告迅速审断
    rationale: 原告规避则情虚可知，必立时管押勿令远扬株连，逾两月不到即销案缉获重治以儆刁风
  - date: 1791-01-05
    title_zh: 谴责毕沅两载不清厘之咎
    rationale: 到任两载未实力整顿致尘案累积告讦成风，虽此次稍有良心仍难辞怠缓，须督率所属毋得疲玩
- id: guji-弘历-endeavor-2
  title_zh: 驳斥尹壮图论罚项亏空并派员遍查
  summary: 针对尹壮图奏督抚藉罚项派累致亏空，派庆成带同赴晋直鲁江南盘验并质询书麟长麟
  phases:
  - key: brewing
    name: 尹壮图建白罚项亏空
    labels:
      zh: 捕风建白
    start_date: 1790-12-01
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 大同藩库盘验无亏
    labels:
      zh: 逐库弹兑
    start_date: 1791-01-07
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 驳斥巧诈并命遍查质询
    labels:
      zh: 烛照情伪
    start_date: 1791-01-13
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 定滇铜长运专责章程
    labels:
      zh: 专责慎重
    start_date: 1791-01-16
    highlight_event_id: guji-弘历-event-4
  decisions:
  - date: 1791-01-07
    title_zh: 命庆成带尹壮图顺道遍查直鲁江南
    rationale: 大同一府无亏不足服其心，既自请盘查且指各省皆亏，自当遍历详查不拘省城府县以昭核实
  - date: 1791-01-13
    title_zh: 命面向书麟长麟质询罚项生法
    rationale: 尹壮图称廉俸除用度外何处生法以完罚项，书麟长麟即有罚项之人，令其据实登答以折服空言
  - date: 1791-01-16
    title_zh: 定滇铜仍长运到京并沿途派员照料
    rationale: 重庆汉口仪徵递运交替必盘秤勒索稽延误限，不如滇员长运专责，沿途鄂辉冯光熊等派道府照料护送
events:
- id: guji-弘历-event-birth
  title_zh: 诞生于圆明园
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京圆明园
  description: 康熙五十年八月十三日生，是为高宗纯皇帝
- id: guji-弘历-event-1
  title_zh: 谕饬毕沅整顿楚北讼风速结积案
  date: 1791-01-05
  year_of: 1791
  place_zh: 北京紫禁城
  description: 据毕沅奏结过千五百余件，谕以原告管押速断，两月不到销案缉获重治，并申饬吏治废弛
- id: guji-弘历-event-2
  title_zh: 驳斥尹壮图逞臆妄谈命再盘查
  date: 1791-01-07
  year_of: 1791
  place_zh: 北京紫禁城
  description: 大同府库弹兑丈量并无短少，斥尹壮图捕风捉影沽名渔利，命庆成带同再赴正定保定山东江南遍查
- id: guji-弘历-event-3
  title_zh: 命质询书麟长麟罚项并体察民情
  date: 1791-01-13
  year_of: 1791
  place_zh: 太原至济南道途
  description: 令尹壮图回太原面向书麟询问罚项生法，见长麟亦照此询问，兼察途中州县小民有无蹙额兴叹
- id: guji-弘历-event-4
  title_zh: 御门听政定滇铜长运专责章程
  date: 1791-01-16
  year_of: 1791
  place_zh: 北京乾清门
  description: 否费淳分段递运之议，仍令滇员长运到京，四川湖南湖北两江山东直隶各派大员会同照料押运
- id: guji-弘历-event-death
  title_zh: 殂于北京
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城
  description: 嘉庆四年正月初三日殂，在位六十年，谥纯皇帝
