endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 整办甘肃捏灾冒赈侵吞监粮案
  description: 自王亶望倡率通省冒赈折色侵蚀公帑命阿桂李侍尧彻底查办分别斩决斩候并查封家产以振法纪
  phases:
  - key: brewing
    name: 发觉酝酿
    labels:
      zh: 捏灾冒赈
    start_date: 1781-10-18
    highlight_event_id: guji-弘历-event-gansu-yu
  - key: breakthrough
    name: 查实定罪
    labels:
      zh: 查封审拟
    start_date: 1781-10-20
    highlight_event_id: guji-弘历-event-gansu-ni
  - key: climax
    name: 分等正法
    labels:
      zh: 二万两区分
    start_date: 1781-10-23
    highlight_event_id: guji-弘历-event-gansu-xing
  - key: closure
    name: 通谕收束
    labels:
      zh: 不为已甚
    start_date: 1781-10-24
    highlight_event_id: guji-弘历-event-gansu-xun
  decisions:
  - date: 1781-10-18
    title_zh: 通谕中外权衡审慎办理
    rationale: 既不能道之以德不得不齐之以刑但须避免株连苛求别生枝节只使贪黩知所炯戒
  - date: 1781-10-20
    title_zh: 按赃数分别斩决斩候
    rationale: 一千两以上一律斩候区别不明人数太多故以二万两以上斩决以下斩候另计仓廒侵蚀从重归案
- id: guji-弘历-endeavor-2
  title_zh: 搜捕川楚啯匪整顿地方刑政
  description: 川省啯匪纠夥抢劫文绶姑息养奸命福康安刘墉李本严密搜截彻底根究使断绝根株
  phases:
  - key: brewing
    name: 访缉酝酿
    labels:
      zh: 交结包庇
    start_date: 1781-10-19
    highlight_event_id: guji-弘历-event-guo-bandit
  - key: breakthrough
    name: 协同搜捕
    labels:
      zh: 跨省协缉
    start_date: 1781-10-21
    highlight_event_id: guji-弘历-event-guo-bandit
  - key: climax
    name: 从重严办
    labels:
      zh: 断绝根株
    start_date: 1781-10-22
    highlight_event_id: guji-弘历-event-guo-li
  - key: closure
    name: 整顿收束
    labels:
      zh: 畏法安民
    start_date: 1781-10-23
    highlight_event_id: guji-弘历-event-guo-li
  decisions:
  - date: 1781-10-19
    title_zh: 命各省实力擒捕彻底根究
    rationale: 匪徒忽合忽分书役勾通包庇为地方之害必须时刻访察有犯即惩不可姑息了事
  - date: 1781-10-21
    title_zh: 革文绶命福康安竭力整顿
    rationale: 川省秋审情实至二百余名刑政废弛由来已久须督饬属员严搜务使将来总无啯匪名色
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于圆明园
  description: 康熙五十年八月十三日生为雍亲王第四子母孝圣宪皇后
- id: guji-弘历-event-gansu-yu
  date: 1781-10-18
  year_of: 1781
  title_zh: 九月庚子朔谕办甘肃冒赈
  description: 行围乌兰哈达谕甘肃捏灾冒赈通省联为一气朋分公帑命查封赀财通谕中外权衡办理
- id: guji-弘历-event-gansu-ni
  date: 1781-10-20
  year_of: 1781
  title_zh: 谕核赈粮脚价提讯王廷赞
  description: 据阿桂奏适中脚价银汇交首府托辞办公命留京王大臣提讯王廷赞逐一供明
- id: guji-弘历-event-gansu-xing
  date: 1781-10-23
  year_of: 1781
  title_zh: 命阿扬阿赴甘监视行刑
  description: 核拟冒赈二万两以上即正典刑命阿扬阿驰驿赴甘会同李侍尧监视行刑勿先洩漏
- id: guji-弘历-event-gansu-xun
  date: 1781-10-24
  year_of: 1781
  title_zh: 谕改王廷赞斩决为绞候再讯
  description: 王廷赞踵弊效尤私收折色加收心红本拟斩决念守城微劳改绞候续查脚价再行提讯
- id: guji-弘历-event-guo-bandit
  date: 1781-10-19
  year_of: 1781
  title_zh: 谕办广东陆丰匪棍及川省啯匪
  description: 据巴延三奏林广参纠众抢劫包庇书役命从重定拟通行各省整顿又谕李国梁福康安严办啯匪
- id: guji-弘历-event-guo-li
  date: 1781-10-21
  year_of: 1781
  title_zh: 谕刘墉福康安严缉啯匪余党
  description: 刘墉获罗添富等成都省会已有匪夥命福康安督饬阖属躧拏务获飞咨各省协同严缉
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于紫禁城养心殿
  description: 嘉庆四年正月初三日崩年八十九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
