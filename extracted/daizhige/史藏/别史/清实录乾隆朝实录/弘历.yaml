  date: 1762-11
  year_of: 1762
  precision: month
  place_zh: 四川金川党坝
  description: 乾隆二十七年十一月丙子以郎卡滋扰党坝斥开泰等先事调停之见传谕断不可派官兵协剿致涉张皇听邻番协力剿除分有其地静以听之候据实奏闻再酌办
- id: guji-弘历-event-3
  title_zh: 推豫省沟洫法谕直隶仿行并筹直东展赈
  date: 1762-11
  year_of: 1762
  precision: month
  place_zh: 直隶山东河南
  description: 乾隆二十七年十一月甲申至乙酉嘉胡宝瑔办豫省民田道路沟洫命钞寄方观承仿行并谕方观承阿尔泰查明直属东省被灾极次贫民于明年正二月停赈青黄不接时加恩展赈
