  - title_zh: 孝养与勤政
    description: 奉皇太后驻跸畅春园颐养，自居圆明园理政，须不劳民力而政务不辍
  - title_zh: 国用与民惠
    description: 平余本出耗羡，解部与留省皆为公用，须杜绝借端需索而使小民沾实惠
  lesson: 藏富于民而慎用民力，奉养尽孝而勤政不怠，方能承先志而安天下
  summary_first_person: 朕于乾隆三年元正受朝宴藩，祈谷配享，轸念果亲王疾，停解平余以惠民，减闽省三县丁银，定圆明园轮班如旧，葺旧苑奉养皇太后而不敢暇逸
