    en: Qianlong Emperor
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆
  archetype: 励精勤政之守成君主
  dilemmas:
  - 灾广恩重与吏蠹克扣之间如何使实惠均沾穷乡
  - 邪教蔓延多省与地方办理迟速之间如何既速办又不滋扰
  - 远国慕化来朝与体制礼仪之间如何怀柔而不拘泥
  lesson: 爱民如子则赈恤宜从厚，靖乱安民则查拏宜从速，怀柔远人则包容宜从宽。
  summary_first_person: 朕绍承大统五十有九载，惟以民依为重。是年直鲁豫水发，叠沛恩膏，豁免缓带钱粮，奖叙出力赈员。川楚豫陕邪教案起，命福宁等严拏首伙，分别定拟，务绝根株。荷兰慕化远来，准其进京叩祝，与诸藩同沐恩宴。此皆朕惠养黎元，整饬吏治，怀柔远人之本心。
  source_urls:
