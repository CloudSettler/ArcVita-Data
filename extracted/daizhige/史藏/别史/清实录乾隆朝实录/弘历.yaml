  decisions:
  - date: 1768-07-14
    title_zh: 谕令山东江浙严拏割辫匪犯尽法惩治
    rationale: 邪术迷人行踪诡秘大为闾阎之害，不可不痛绝根株以安良善
  - date: 1768-07-19
    title_zh: 谕令直隶解送被害民人进京询问并饬江浙速获首恶吴元
    rationale: 奸匪已蔓延数省夥党甚多，渠魁不获则余党闻风远扬，须分路侦缉毋令漏网
- id: guji-弘历-endeavor-2
  title_zh: 惩办广西学政梅立本逼命案
  summary_zh: 广西学政梅立本按试郁林州勒索供应凌辱陆川县知县杨梿致其忿恨自刎，降旨革职拏问查抄赀财并赶入秋审情实
  phases:
