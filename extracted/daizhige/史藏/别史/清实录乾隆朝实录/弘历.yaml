    title_zh: 留孙宗夏以挫悍卒刁风
    rationale: 不因不法兵丁抗官即调离管官，严查市恩漠视之弁以挽颓习
events:
- id: guji-弘历-event-birth
  title_zh: 弘历出生
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即帝位年号乾隆
- id: guji-弘历-event-xingwei
  title_zh: 温都尔华巴颜沟诸处行围
  date: 1749-09-12
  year_of: 1749
  place_zh: 塞外温都尔华巴颜沟默尔根乌里雅苏台
  description: 乾隆十四年八月丁丑朔后连日行围，诣皇太后行幄问安，赐扈从蒙古王公宴
- id: guji-弘历-event-yingwu
  title_zh: 饬查洞庭协哗缴械及滇省余丁书识案
  date: 1749-09-14
  year_of: 1749
  place_zh: 北京行在
  description: 谕舒赫德详查洞庭协兵丁聚众缴械情节，留孙宗夏原任以抑刁风，另谕密查滇省余丁名粮冒食及书识定额情弊
- id: guji-弘历-event-heba
  title_zh: 议覆临黄临运二坝善后
  date: 1749-09-24
  year_of: 1749
  place_zh: 北京行在
  description: 详察图说，指高斌添筑二坝阻滞黄流之误，令黄廷桂筹截漕留运及由杨家庄转口入运之永远可行策
- id: guji-弘历-event-death
  title_zh: 弘历逝世
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩，享年八十九岁，为清朝高宗纯皇帝
