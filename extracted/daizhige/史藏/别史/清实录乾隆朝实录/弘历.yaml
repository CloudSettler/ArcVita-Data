    rationale: 惩凶儆众防积久生玩使执两用中权衡不爽
  - date: 1749-11-13
    title_zh: 职官实罪秋朝审另为一册进呈
    rationale: 官犯与常犯有别以示廉耻生杀之柄断不下移
