  decisions:
  - date: 1772-02-05
    title_zh: 加赈直隶二十四州县一月
    rationale: 畿辅青黄不接小民待哺宜再沛恩膏使口食有资安心力作
  - date: 1772-02-05
    title_zh: 加赈甘肃安定等六州县一月
    rationale: 河东频年歉收专待夏田糊口当青黄不接之际宜加恩接济
  - date: 1772-02-06
    title_zh: 加赈江苏安徽成灾八九分贫民
    rationale: 正赈将停灾重贫黎待哺宜概行加赈并酌借口粮资耕种
