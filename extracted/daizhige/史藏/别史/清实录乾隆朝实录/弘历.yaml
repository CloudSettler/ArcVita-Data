  description_zh: 康熙五十年八月十三日生为雍亲王第四子母孝圣宪皇后钮祜禄氏
- id: guji-弘历-event-ascend
  title_zh: 议行元年元旦朝贺与尊崇典礼
  date: 1735-12-05
  year_of: 1735
  kind: 事业
  description_zh: 雍正十三年十一月朔谕王大臣元旦升殿朝贺照常举行并议尊崇皇太后徽称与册封皇后典礼
- id: guji-弘历-event-pingyun
