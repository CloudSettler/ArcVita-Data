    en: Hongli Qianlong Emperor
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆
  archetype: 勤政经制之君
  dilemmas:
  - 恩赈频施与国帑节制之间如何兼顾民瘼与久长
  - 边将畏怯敷衍与深悉朕意之间如何整饬用人
  - 积欠蠲贷之惠与刁风滋长之间如何化瘠为腴
  lesson: 预立定额以备赈、面谕深悉以整边、移民实边以纾内困、方为久长之治
  summary_first_person: 朕临御三十六年正月、于正大光明殿行事、因直隶无存公备赈之款谕杨廷璋通筹定额、因豫省河北雨雪愆期谕永德速查麦收民情、因彰宝办理缅务未能得要领召其来京面谕并令德福署理云贵、又因甘肃借欠积至数百万谕明山劝民移屯新疆以裕久长
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70877.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 畿辅豫省赈备经制
  description_zh: 针对直隶无存公备用银及豫省河北雨雪愆期麦收可虞、立定额、速拨帑、饬查粜借以先事经画
  phases:
  - key: brewing
    name: 畿辅无备豫省望泽
    labels:
      zh: 酝酿
    start_date: 1771-02-15
    highlight_event_id: guji-弘历-event-zhili-beizhen
  - key: breakthrough
    name: 拨帑二十万速发并筹定额
    labels:
      zh: 突破
    start_date: 1771-02-15
    highlight_event_id: guji-弘历-event-zhili-beizhen
  - key: climax
    name: 饬永德查雨雪麦价妥办接济
    labels:
      zh: 高潮
    start_date: 1771-02-15
    highlight_event_id: guji-弘历-event-henan-yuxue
  - key: closure
    name: 嘉奖河北普沾不需加赈之奏
    labels:
      zh: 收束
    start_date: 1771-03-01
    highlight_event_id: guji-弘历-event-henan-yuxue
  decisions:
  - date: 1771-02-15
    title_zh: 谕杨廷璋通筹存公定额留贮藩库
    rationale: 畿辅要地遇赈必仰部拨、解运稍需时日、故须预立定额永为备借之用
  - date: 1771-02-15
    title_zh: 谕永德速奏雨雪麦收及粜借事宜
    rationale: 豫省以麦收为重、元气未复、若膏泽不沾则民力拮据、须勿存回护先事经理
- id: guji-弘历-endeavor-2
  title_zh: 云贵更调与缅务整饬兼筹甘屯
  description_zh: 以彰宝未悉朕意措置舛误、召其陛见面谕、调阿尔泰回川令德福署滇严查边隘、并筹甘肃积欠与新疆屯垦移民相济
  phases:
  - key: brewing
    name: 彰宝随阿桂敷衍未得窾要
    labels:
      zh: 酝酿
    start_date: 1771-02-17
    highlight_event_id: guji-弘历-event-zhangbao-rujing
  - key: breakthrough
    name: 召彰宝来京德福署理云贵
    labels:
      zh: 突破
    start_date: 1771-02-17
    highlight_event_id: guji-弘历-event-zhangbao-rujing
  - key: climax
    name: 面谕深悉以备冬初掩袭
    labels:
      zh: 高潮
    start_date: 1771-02-17
    highlight_event_id: guji-弘历-event-zhangbao-rujing
  - key: closure
    name: 劝甘民乐迁新疆以化瘠为腴
    labels:
      zh: 收束
    start_date: 1771-02-27
    highlight_event_id: guji-弘历-event-gansu-yimin
  decisions:
  - date: 1771-02-17
    title_zh: 令彰宝俟德福到滇即驰驿来京陛见
    rationale: 彰宝未曾面聆讲论故无定见、须面为指示俾深悉朕心、回滇尚可如期赶办掩袭
  - date: 1771-02-27
    title_zh: 谕明山详议劝导甘民移屯新疆并清厘欠项
    rationale: 甘肃地瘠民贫积欠数百万、而新疆膏沃屯丰商民辐辏已成乐土、移食于外即少耗内地之粟可裕盖藏
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生于北京雍亲王府
  description_zh: 康熙五十年八月十三日生、即后之高宗纯皇帝
  place_zh: 北京
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 弘历崩于北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩、寿八十有九、庙号高宗
  place_zh: 北京
- id: guji-弘历-event-zhili-beizhen
  date: 1771-02-15
  year_of: 1771
  title_zh: 谕杨廷璋部拨二十万两供赈并筹存公定额
  description_zh: 乾隆三十六年正月、因直隶惟封贮军需银十六万余两而无存公之项、谕于部库拨银二十万两速发、并令通盘筹画应需存公银数留贮藩库永为定额
  place_zh: 北京
- id: guji-弘历-event-henan-yuxue
  date: 1771-02-15
  year_of: 1771
  title_zh: 谕永德查河北雨雪麦收速办接济
  description_zh: 据永德奏河北三府两月无雨雪、谕令速查是否需加赈或开仓平粜酌借耔种口粮、后据奏正月二十一日得雨麦收无虞得旨嘉奖
  place_zh: 北京
- id: guji-弘历-event-zhangbao-rujing
  date: 1771-02-17
  year_of: 1771
  title_zh: 谕彰宝来京陛见令德福署理云贵总督
  description_zh: 以彰宝办理缅务随阿桂敷衍全未得窾要、令彰宝俟德福到滇交代后驰驿来京面谕一切、阿尔泰仍回四川、德福由川驰驿赴滇兼署、严查边隘不纵奸民偷越
  place_zh: 北京
- id: guji-弘历-event-gansu-yimin
  date: 1771-02-27
  year_of: 1771
  title_zh: 谕明山劝甘民移屯新疆并清厘积欠
  description_zh: 据杨景素奏甘省民借耔种口粮积欠仓粮四百余万石折银百余万两、谕明山设法劝导贫民乐迁安西辟展乌噜木齐膏沃之地耕种实边、并定逐渐徵完调剂之法
  place_zh: 北京
