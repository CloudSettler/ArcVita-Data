    title_zh: 谕江浙督抚许士子呈明到阁钞阅
    rationale: 颁书本为沾溉艺林若有司过为珍秘则束之高阁违搜辑本意故开阁以广见闻
  - date: 1790-06-21
    title_zh: 许翰林院底本就近检录不得勒阻
    rationale: 文渊等阁禁地森严士人不便进内故借翰林底本以便诵习互为传录而成右文盛事
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历誕生于雍亲王府
  description: 康熙五十年八月十三日生即后之高宗纯皇帝
- id: guji-弘历-event-1
  date: 1790-06-17
  year_of: 1790
  title_zh: 革江苏按察使王士棻严审高邮冒徵案
  description: 以王士棻于高邮州书吏假印冒徵置若罔闻革职交书麟福崧严审以陈奉兹调补江苏按察使李涛补授河南按察使
- id: guji-弘历-event-3
  date: 1790-06-21
  year_of: 1790
  title_zh: 谕四库全书许士子到阁钞阅
  description: 以江浙三阁应贮全书陆续颁发谕督抚俟排架齐集后许士子呈明钞阅翰林院底本亦许就近检录不得勒阻留难
- id: guji-弘历-event-2
  date: 1790-06-24
  year_of: 1790
  title_zh: 严谕闵鹗元句容侵那案问以重辟
  description: 以句容粮书拆封侵那闵鹗元仅批饬查办加之高邮前案切责其养尊处优徇情骩法敕大学士九卿定拟时问以重辟并饬福崧彻底清厘
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 弘历崩于紫禁城
  description: 嘉庆四年正月初三日崩寿八十有九谥纯皇帝庙号高宗
