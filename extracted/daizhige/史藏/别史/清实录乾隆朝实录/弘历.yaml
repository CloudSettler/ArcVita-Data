  archetype: 励精图治之守成帝王
  dilemmas:
  - 归政在即而吏治懈弛，如何振作以付后人
  - 施恩免欠与国课充盈之间，如何权衡推恩而不启幸心
  - 苗民滋事起于客民欺凌，如何既惩首恶又安抚余众而不激变
  - 邪教要犯久缉未获，如何督责封疆而不致推诿迟延
  lesson: 临御六十年惟以诚敬典学为本，事事秉公振作，施恩则孚惠无疆，治吏则赏罚分明，方能中外整肃以付嗣君
  summary_first_person: 朕临御六十年，惟日孜孜，典学懋修，衷诸圣教，普免积欠以锡福，严缉邪教以靖民，明辨苗衅以安边，倍加振作以期付托于嗣皇帝
