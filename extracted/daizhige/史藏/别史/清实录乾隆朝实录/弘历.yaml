  description: 乾隆二十七年十一月甲戌以京师夏雨收减自春徂冬分厂平粜命豫东采买麦石十余万运京赏给八旗闰月甲米复准三品以下满汉文武豫支半年俸米于京仓支放明后年春秋分扣
- id: guji-弘历-event-2
