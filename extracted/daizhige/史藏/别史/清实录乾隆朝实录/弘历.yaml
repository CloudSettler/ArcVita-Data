endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 苏松崇明风潮加赈蠲免
  summary: 乾隆十二年七月苏松沿海风潮，崇明受灾最重，坍屋漂民逾万，屡谕缓徵加赈截漕，复特沛殊恩给赀修屋借种豁免钱粮
  role_zh: 皇帝决策抚恤
  phases:
  - key: brewing
    name: 风潮初报缓徵加赈
    labels:
      zh: 勘灾接济
    start_date: 1747-08-15
    highlight_event_id: guji-弘历-event-chongming-relief
  - key: breakthrough
    name: 命高斌留南查办截漕
    labels:
      zh: 截漕查办
    start_date: 1747-09-01
    highlight_event_id: guji-弘历-event-chongming-relief
  - key: climax
    name: 特谕崇明加赈豁免
    labels:
      zh: 殊恩蠲免
    start_date: 1747-10-09
    highlight_event_id: guji-弘历-event-chongming-relief
  - key: closure
    name: 推及宝山镇洋酌议赈恤
    labels:
      zh: 推恩善后
    start_date: 1747-10-10
    highlight_event_id: guji-弘历-event-chongming-relief
  decisions:
  - date: 1747-10-09
    title_zh: 谕崇明房屋加赈借种豁免明年地丁
    rationale: 灾民无栖身之所且届严冬，来春播种关系綦重，须从容措办以复元气
  - date: 1747-09-01
    title_zh: 命查雍正十年潮灾旧例仿照施恩
    rationale: 非常之灾非寻常可比，须稽旧典酌加殊恩以苏民困
- id: guji-弘历-endeavor-2
  title_zh: 金川督剿与准夷熬茶豫防
  summary: 闻大金川碉坚难克奏报前后不一，詰问庆复张广泗，又以准噶尔新台吉进藏熬茶近青海，密令豫防而勿露形迹
  role_zh: 皇帝总揽军机
  phases:
  - key: brewing
    name: 连破番寨望捷
    labels:
      zh: 进剿观望
    start_date: 1747-09-20
    highlight_event_id: guji-弘历-event-jinchuan-qa
  - key: breakthrough
    name: 火攻奏凯需时詰问异同
    labels:
      zh: 詰问督臣
    start_date: 1747-10-16
    highlight_event_id: guji-弘历-event-jinchuan-qa
  - key: climax
    name: 究班滚潜逃勾结汪结瞻对旧案
    labels:
      zh: 穷究衅端
    start_date: 1747-10-17
    highlight_event_id: guji-弘历-event-jinchuan-qa
  - key: closure
    name: 令庆复暂住陕西密筹青海防务
    labels:
      zh: 密防准夷
    start_date: 1747-10-11
    highlight_event_id: guji-弘历-event-zhungar-guard
  decisions:
  - date: 1747-10-16
    title_zh: 傳旨詢問慶復張廣泗前後奏報不一
    rationale: 相隔数日情事各异且未会奏，须明实在情形以便辦理
  - date: 1747-10-11
    title_zh: 令慶復暫住陝西暗為備辦勿令泄漏
    rationale: 准夷素詭詐且近青海，不可張皇致疑，亦不可無備，務宜慎密先籌
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后嗣位为乾隆皇帝
  type: birth
- id: guji-弘历-event-chongming-relief
  date: 1747-10-09
  year_of: 1747
  title_zh: 谕崇明潮灾加赈蠲免
  description: 以崇明坍塌漂没最重，谕拨仓谷给赀修屋借给耔种，豁免明年地丁，停缓本年未完及带徵，赏绿旗兵一月钱粮，并令高斌会督抚酌议宝山镇洋
  type: endeavor
- id: guji-弘历-event-jinchuan-qa
  date: 1747-10-16
  year_of: 1747
  title_zh: 詰問大金川火攻需時及班滾踪迹
  description: 据张广泗火攻奏报谓奏凯需时，与前报去刮耳崖仅二十里不符，又据供词究班滚未死潜逃及汪结暗通声息，傳旨詢問
  type: endeavor
- id: guji-弘历-event-zhungar-guard
  date: 1747-10-11
  year_of: 1747
  title_zh: 密饬豫防准夷熬茶窥边
  description: 以准噶尔使至塔里木河水大愆期且探兵驻情形，虑其藉熬茶窥边或谋袭青海，令玉保会地方密商，庆复暂住陕西暗备
  type: endeavor
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  type: death
