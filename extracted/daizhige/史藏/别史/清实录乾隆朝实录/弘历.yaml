    labels:
      zh: 革抚严究
    start_date: 1751-09-24
    highlight_event_id: guji-弘历-event-zhuntai
  - key: climax
    name: 通谕各省密拏渠魁
    labels:
      zh: 严缉逆党
    start_date: 1751-09-24
    highlight_event_id: guji-弘历-event-zhuntai
  - key: closure
    name: 遣高斌赴豫堵口
    labels:
      zh: 治河救民
    start_date: 1751-09-24
    highlight_event_id: guji-弘历-event-hegong
  decisions:
  - date: 1751-09-24
    title_zh: 革山东巡抚准泰拿问严查
    rationale: 身任封疆见诬谤悖逆之词忍心隐匿更谕属不必牵涉前案置君臣大义于不问国法不可容故遣侍郎兆惠驰驿查办
  - date: 1751-09-24
    title_zh: 命大学士高斌速赴阳武相度堵筑
    rationale: 阳武漫口水深难合鄂容安已调山东顾琮独力难胜故令深谙水性之高斌亲往相度另开引河分势刻期合龙
events:
- id: guji-弘历-event-birth
  person_id: guji-弘历
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生为雍亲王胤禛第四子母熹贵妃钮祜禄氏
- id: guji-弘历-event-death
  person_id: guji-弘历
  title_zh: 驾崩于紫禁城养心殿
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日崩享年八十九岁葬裕陵庙号高宗
- id: guji-弘历-event-zhezhen
  person_id: guji-弘历
  title_zh: 截留江浙漕粮八十万石大赈浙东
  date: 1751-09-14
  year_of: 1751
  description: 自避暑山庄回銮驻喀喇河屯谕截留浙江漕粮五十万石复截江苏漕粮三十万石运浙备赈粜并饬督抚董率实办
- id: guji-弘历-event-shujun
  person_id: guji-弘历
  title_zh: 谕浚萧山会稽河道以工代赈
  date: 1751-09-23
  year_of: 1751
  description: 以南巡亲见浙河浅窄旱涸舟楫难行米价顿昂命督抚相度估计以工代赈开通深广垂永久之利
- id: guji-弘历-event-jinling
  person_id: guji-弘历
  title_zh: 谕修金朝陵寝躬亲展奠
  date: 1751-09-16
  year_of: 1751
  description: 以金太祖世宗陵寝在房山岁久榛芜命直隶总督方观承前往相度增修除治工竣躬亲展奠以昭敬礼前朝
- id: guji-弘历-event-zhuntai
  person_id: guji-弘历
  title_zh: 革山东巡抚准泰严究伪造孙嘉淦奏稿逆案
  date: 1751-09-24
  year_of: 1751
  description: 据按察使和其衷奏四月已获伪稿准泰勾抹发还改为拾自途中拟杖完结复谕不必牵涉前案故革职拿问遣兆惠驰驿彻底确查以鄂容安调补山东
- id: guji-弘历-event-hegong
  person_id: guji-弘历
  title_zh: 命高斌赴河南阳武堵筑漫口
  date: 1751-09-24
  year_of: 1751
  description: 豫省阳武漫口水深二丈大坝水深四丈鄂容安调任山东命大学士总河高斌速赴工次相度另开引河分势并赈商邱等十四县被淹贫民
