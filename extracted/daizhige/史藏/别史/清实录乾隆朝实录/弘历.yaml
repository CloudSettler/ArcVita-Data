    title_zh: 催速攻并通筹粮运
    rationale: 围攻逾月粮石有限，令上紧轰击酌减兵数，饬富勒浑等赶运无误
  - date: 1776-03-26
    title_zh: 严防乞降藏奸
    rationale: 逆酋诡诈受降如受敌，令将军参赞领队严防袖枪施放以成全美
