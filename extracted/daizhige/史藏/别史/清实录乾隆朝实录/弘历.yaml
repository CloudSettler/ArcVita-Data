  archetype: 省方观民勤政守成之君
  dilemmas:
  - 省方巡幸欲观民察吏，又恐烦扰地方糜费民力，如何示惠而不累民
  - 吏治宽严之间，惩贪墨与防胥役刁恶挟制，如何因公酌情以全实力办公之道
  lesson: 省方即是观民，崇儒必先安民，宽严皆归于养民察吏，方为久安之道
  summary_first_person: 朕以乾隆四十九年春南巡省方，由直隶入山东，历德州曲陆李刘诸行宫，登岱庙谒少昊陵，至曲阜谒先师庙行释奠酹酒，加恩耆年观光生员为举人，奖河臣李奉翰抢护青龙冈之劳，饬定州县因公责毙之例，皆欲以省方而观民风吏治，崇儒而惠农务本也
