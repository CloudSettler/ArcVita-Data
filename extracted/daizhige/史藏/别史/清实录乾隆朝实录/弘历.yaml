  - key: breakthrough
    name: 春季加恩展赈
    labels:
      zh: 赈恤灾荒
    start_date: '1788-02-09'
    highlight_event_id: guji-弘历-event-zhenxu-jiazhen
  - key: climax
    name: 漳泉等府蠲缓钱粮
    labels:
      zh: 赈恤灾荒
    start_date: '1788-02-10'
    highlight_event_id: guji-弘历-event-zhenxu-juanmian
  - key: closure
    name: 借籽平粜核实经理
    labels:
      zh: 赈恤灾荒
    start_date: '1788-02-12'
    highlight_event_id: guji-弘历-event-zhenxu-juanmian
  decisions:
  - date: '1788-02-09'
    title_zh: 加赈归德亳州皋兰等属极次贫民
    rationale: 正赈已毕青黄不接民食拮据故分别极次加赈一两月并缓征借籽以资接济
  - date: '1788-02-10'
    title_zh: 蠲免缓征福建漳泉等府州县钱粮
    rationale: 台湾军兴闽省差务繁重资用民力故于春祺普锡之时分别蠲免三成两成及缓征以示优恤
events:
- id: guji-弘历-event-birth
  title_zh: 弘历出生于雍亲王府
  date: '1711-09-25'
  year_of: 1711
  place_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三日生为雍亲王胤禛第四子后承大统年号乾隆
- id: guji-弘历-event-death
  title_zh: 太上皇弘历龙御归天
  date: '1799-02-07'
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩寿八十有九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
- id: guji-弘历-event-taiwan-duban
  title_zh: 询福康安进剿诸罗情形饬查恒瑞普吉保观望之罪
  date: '1788-02-08'
  year_of: 1788
  place_zh: 北京紫禁城
  description_zh: 据李侍尧奏及洋面商客之信闻林爽文就擒未确谕福康安亲统骁兵痛剿杀进诸罗并查元长庄营盘畏葸不进之咎
- id: guji-弘历-event-taiwan-qinshu
  title_zh: 得奏擒获林爽文父母家属
  date: '1788-02-12'
  year_of: 1788
  place_zh: 北京紫禁城
  description_zh: 福康安十二月十三日奏至仅获逆首父母家属首逆未获未足为快沿途误递红旗并饬查驿站迟误之咎
- id: guji-弘历-event-taiwan-cuqin
  title_zh: 严旨督催福康安速擒林爽文移兵南路
  date: '1788-02-15'
  year_of: 1788
  place_zh: 北京紫禁城
  description_zh: 谕福康安勿过持重当勒兵直入内山搜捕速获林爽文即移兵南路搜捕庄大田以免旷日持久养痈遗患
- id: guji-弘历-event-zhenxu-jiazhen
  title_zh: 加赈河南归德安徽亳州甘肃皋兰等属
  date: '1788-02-09'
  year_of: 1788
  place_zh: 北京紫禁城
  description_zh: 念及正赈已毕青黄不接命商邱宁陵等六州县亳州蒙城等十州县皋兰金县等三县极次贫民加赈一两月
- id: guji-弘历-event-zhenxu-juanmian
  title_zh: 蠲免缓征福建漳泉等府钱粮优恤军兴民力
  date: '1788-02-10'
  year_of: 1788
  place_zh: 北京紫禁城
  description_zh: 台湾军务漳泉等府应付官兵粮饷差务繁重命晋江南安等八县蠲三成浦城崇安等十二县蠲两成福鼎等七县缓至来年麦熟后征收
