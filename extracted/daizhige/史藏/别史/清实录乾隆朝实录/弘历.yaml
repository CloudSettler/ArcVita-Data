      - 大飨礼
    start_date: 1743-10-18
    highlight_event_id: guji-弘历-event-yongling
  - key: climax
    name: 盛京受贺锡宴
    labels:
      zh:
      - 盛京
      - 筵宴
    start_date: 1743-10-26
    highlight_event_id: guji-弘历-event-shengjing
  - key: closure
    name: 颁诏覃恩
    labels:
      zh:
      - 恩诏
      - 宽免
    start_date: 1743-10-27
    highlight_event_id: guji-弘历-event-shengjing
  decisions:
  - date: 1743-10-26
    title_zh: 作世德舞辞赐宴盛京群臣
    rationale: 追述祖烈以系人心，示守成之志
  - date: 1743-10-27
    title_zh: 颁东巡恩诏宽免奉天赋税罪罚
    rationale: 报本覃恩，惠养旗民，巩固根本之地
- id: guji-弘历-endeavor-2
  person_id: guji-弘历
  title_zh: 驳限田议饬恤刑典
  summary_zh: 否决顾琮三十顷限田之请，晓谕停止试行，批饬陈大受灾区减刑之谬，重申恤刑本意
  phases:
