    labels:
      zh: 勘灾
    start_date: 1743-06-01
    highlight_event_id: guji-弘历-event-kuanmian
  - key: breakthrough
    name: 宽免杂税米税
    labels:
      zh: 蠲恤
    start_date: 1743-06-23
    highlight_event_id: guji-弘历-event-kuanmian
  - key: climax
    name: 截米化导通有无
    labels:
      zh: 通粜
    start_date: 1743-07-05
    highlight_event_id: guji-弘历-event-quancui
  decisions:
  - date: 1743-06-23
    title_zh: 宽免二十三州县乾隆七年未完杂税
    rationale: 积歉之余新旧并征民力艰难须体恤商民使商贩流通地方有起色
  - date: 1743-07-05
    title_zh: 饬各省化导富户劝粜严惩抢夺
    rationale: 周急出于义举不可勒令视为官法致长刁风当劝谕乐从而尽法惩强暴
- id: guji-弘历-endeavor-2
  title_zh: 恭谒奉天敬守发祥之地
  summary_zh: 乾隆八年七月恭奉皇太后谒盛京三陵预命留京总理缮写实录尊藏并慎安銮驾
  phases:
  - key: brewing
    name: 预定谒陵留京总理
    labels:
      zh: 筹备
    start_date: 1743-06-28
    highlight_event_id: guji-弘历-event-yeling
  - key: closure
    name: 实录尊藏銮驾安奉
    labels:
      zh: 尊藏
    start_date: 1743-06-30
    highlight_event_id: guji-弘历-event-yeling
  decisions:
  - date: 1743-06-28
    title_zh: 命履亲王平郡王鄂尔泰张廷玉在京总理诸务
    rationale: 往来约计四月文武大选验看等事不可稽迟须重臣留京即行办理
  - date: 1743-06-30
    title_zh: 命缮写满汉文列朝实录送奉天尊藏
    rationale: 奉天为发祥之地列朝实录俱应尊藏以昭敬守之意
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  kind: birth
  title_zh: 弘历出生
  description_zh: 康熙五十年八月十三日生于雍亲王府后即位为高宗乾隆皇帝
- id: guji-弘历-event-kuanmian
  date: 1743-06-23
  year_of: 1743
  kind: career
  title_zh: 谕免江淮二十三州县杂税及临清铜补商补
  description_zh: 己亥谕以江淮扬徐海被灾贸易稀少宽免山阳清河泰州沛县海州等二十三州县乾隆七年未完牙行杂税又豁免山东临清关铜补商补船料以示体恤商民
- id: guji-弘历-event-quancui
  date: 1743-07-05
  year_of: 1743
  kind: career
  title_zh: 谕化导富户出粜并截留川米济江西
  description_zh: 以湖北湖南江西福建广东多有勒令蠲粜强夺之案寄谕督抚密饬化导劝谕欣然乐从违者尽法严惩又允尹继善截留川米十万石济江西
- id: guji-弘历-event-yeling
  date: 1743-06-30
  year_of: 1743
  kind: career
  title_zh: 部署恭谒盛京三陵及实录尊藏
  description_zh: 定本年七月恭奉皇太后往奉天叩谒祖陵命履亲王平郡王鄂尔泰张廷玉在京总理命缮满汉文实录送奉天尊藏并议銮驾安放大清门内楼上
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  kind: death
  title_zh: 弘历去世
  description_zh: 嘉庆四年正月初三日崩于养心殿谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
