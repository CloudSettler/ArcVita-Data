  dilemmas:
  - 讲官颂扬过盛而箴规不足当如何扭转虚美文风
  - 边将粉饰报捷而隐匿挫衄当如何严明赏罚以振军气
  - 海防承平废弛而战船亏缺侵冒当如何彻底整顿
  lesson: 执中须有权衡为政务去虚文粉饰以实心行实政方能安边固本
  summary_first_person: 朕弘历承皇考之业临御天下乾隆五年秋于文华殿行仲秋经筵亲宣中庸尚书御论以明执两用中建中立极之道复面饬讲官剀切敷陈期裨政治学问勿尚铺张溢美又因粤西义宁苗事览马尔泰等粉饰之奏深斥其姑息倒置严旨申饬令洗涤肺肠实心效力并饬沿海督抚严查战船缺额侵冒租赁之弊朕惟愿君臣咨儆务实去华使吏治边防皆归核实耳
