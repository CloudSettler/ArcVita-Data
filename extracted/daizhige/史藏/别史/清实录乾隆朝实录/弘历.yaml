  title_zh: 颁敕抚绥霍罕拔达克山等部
  date: 1760-03-08
  year_of: 1760
  location_zh: 京师紫禁城
  summary: 乾隆二十五年二月丙子朔，赐霍罕额尔德尼伯克及拔达克山素勒坦沙等敕书，加恩召见来使，频申宴赉，谕约束所部永享无疆之福
- id: guji-弘历-event-mokan-1760
  title_zh: 处理磨勘参劾分别议处
  date: 1760-03-09
  year_of: 1760
  location_zh: 京师紫禁城
  summary: 御史朱丕烈参奏覆勘试卷大臣秦蕙田等瞻徇不公，派大臣覆核朱墨卷，查无确据，将疏漏之秦蕙田等与所奏不实之朱丕烈并交部议处
- id: guji-弘历-event-junxu-1760
  title_zh: 派员清查甘肃军需那用案
  date: 1760-03-10
  year_of: 1760
  location_zh: 甘肃
  summary: 因巡抚吴达善为崔应阶之子崔琇赎罪置辩，支离乖谬，派侍郎裘曰修驰驿赴甘，会同吴达善按籍逐一清查各州县军需，候旨再降谕旨
- id: guji-弘历-event-death
  title_zh: 龙驭上宾于养心殿
  date: 1799-02-07
  year_of: 1799
  location_zh: 北京紫禁城养心殿
  summary: 嘉庆四年正月初三日崩，年八十九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
