  decisions:
  - date: 1793-08-08
    title_zh: 谕以抄产赏给达赖喇嘛充番兵口食
    rationale: 以公济公，使养赡宽余而不烦商上增补
  - date: 1793-08-08
    title_zh: 命驻藏大臣核明动用余剩分报户部理藩院
    rationale: 防左右浮开冒销通同染指，俾后任循谨自守率由旧章
- id: guji-弘历-endeavor-2
  title_zh: 接待英咭唎贡使厘定礼贡
  description: 英咭唎使臣航海祝寿纳赆，谕梁肯堂徵瑞筵宴犒赏，分拨贡品大小件留京赴热河，教导跪叩朝仪
  phases:
  - key: brewing
