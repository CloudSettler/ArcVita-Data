      - 研判
    start_date: 1754-09-08
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 命萨喇勒等掩其不备分路进攻
    labels:
      zh:
      - 进兵
      - 擒渠
    start_date: 1754-09-10
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 收获牲畜数万并擒宰桑车根等
    labels:
      zh:
      - 捷闻
      - 赏功
    start_date: 1754-09-12
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 分别安置宰桑属众并备马进取巴朗玛木特
    labels:
      zh:
      - 安置
      - 善后
    start_date: 1754-09-14
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1754-09-10
    title_zh: 许便宜进兵不拘暂停前旨
    rationale: 乌梁海玛木特巴朗相接连，可一鼓成事，不必拘泥，务取机宜
  - date: 1754-09-12
    title_zh: 所获属众牲畜分别给还赏赉
    rationale: 班珠尔阿睦尔撒纳属下俱令给还，余赏效力人，驼马用心牧养以备来岁之用
  - date: 1754-09-14
    title_zh: 抗拒者正法归顺者内徙安置
    rationale: 使宰桑得木齐内徙或就卡安置，举可约束者留管，使其不至逃避
