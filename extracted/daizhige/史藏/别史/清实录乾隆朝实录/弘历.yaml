      - 民买
    start_date: 1738-03-03
    highlight_event_id: guji-弘历-event-qimin
  - key: closure
    name: 免临清天津米豆税及落地税以通商
    labels:
      zh:
      - 通商
      - 惠民
    start_date: 1738-03-15
    highlight_event_id: guji-弘历-event-tongshang
  decisions:
  - date: 1738-03-03
    title_zh: 旗买民地已入公产者准民照估置买
    rationale: 原系彼此乐从若一概定为公产不准民买非轸恤畿辅之怀故欲旗民两便
  - date: 1738-03-15
    title_zh: 免临清天津米豆船税及落地税
    rationale: 畿辅歉薄米价昂贵商船渐至故免税以踊跃贩运俟二麦收成米价平减再徵
events:
- id: guji-弘历-event-birth
  title_zh: 生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生母孝圣宪皇后嗣即大位年号乾隆
- id: guji-弘历-event-yeling
  title_zh: 谒泰陵恸哭步入行礼躬奠
  date: 1738-03-03
  year_of: 1738
  description: 乾隆三年二月戊戌未至碑亭即降舆恸哭步入隆恩门诣宝城前行礼躬奠王以下随行礼
- id: guji-弘历-event-jingyan
  title_zh: 首举经筵御文华殿进讲论语尚书
  date: 1738-03-12
  year_of: 1738
  description: 以首举经筵告祭奉先殿御文华殿听讲道之以德及食哉惟时并宣御论明德礼政刑一而二二而一
- id: guji-弘历-event-qingeng
  title_zh: 亲飨先农躬耕耤田加一推
  date: 1738-03-14
  year_of: 1738
  description: 乾隆三年二月辛亥亲飨先农躬执鞭扶犁三推三返复加一推命王公九卿五推九推如仪御庆成宫受贺
- id: guji-弘历-event-qimin
  title_zh: 谕旗买民地入官者准旗民照估变卖
  date: 1738-03-03
  year_of: 1738
  description: 除原圈官地为旗人世业不容民买外其自置有粮民地现在入官者准照原估变卖交司库生息分给旗人
- id: guji-弘历-event-tongshang
  title_zh: 免临清天津米豆税及通州落地税
  date: 1738-03-15
  year_of: 1738
  description: 以畿辅歉薄米价昂贵闻商贾米船渐至故免二关米豆船税及米豆杂粮落地税以通商惠民并禁官吏需索
- id: guji-弘历-event-death
  title_zh: 崩于嘉庆四年正月初三日
  date: 1799-02-07
  year_of: 1799
  description: 太上皇帝崩享年八十有九遗诏嘉庆亲政实录归入高宗纯皇帝实录
