  date: 1748-07-13
  year_of: 1748
  place_zh: 圆明园军机处
  description_zh: 乾隆十三年六月辛酉以军需已及四百万两，大兵久顿难图全胜，密谕讷亲熟思审处，或迅奏肤功，或班师柔远，并谕班滚无足轻重不必穷追
  related_endeavor_id: guji-弘历-endeavor-2
