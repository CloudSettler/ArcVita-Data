  description_zh: 甲午谕以洪承畴传于故明唐王加伪字为未协引宋末景炎祥兴为例命衷于至公以昭史法
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩寿八十九岁庙号高宗谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
