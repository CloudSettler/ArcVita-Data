  dilemmas:
  - 宽大养望与振纲肃纪之间如何因物付物而不存成心
  - 革除观望迎合之习与保全大臣体面之间如何兼顾激劝
  - 移风易俗整顿营伍与与众休息初愿之间如何渐次化导
  lesson: 因物付物惟正斯中宽严皆归于一是公忠体国方能成宽大之治
  summary_first_person: 朕即位六年本欲减去烦苛与众休息然鄂善婪赃喀尔钦贿卖生童卢焯受贿皆不得不按法惩治又见诸臣趋宽趋严务为迎合故于乾隆六年七月明谕公忠体国去观望之私同时整顿闽广械斗殴官之刁风严禁滥建生祠申饬营伍虚冒空粮期吏治肃而风俗淳以成真正宽大之治
