endeavors:
- id: guji-弘历-endeavor-1
  person_qid: guji-弘历
  title_zh: 恤灾劝农饬禁指荒
  summary: 针对报荒后不许种莳以待查验致坐废耕时之弊，饬令督抚及时劝种秋禾并推广散赈一体之制
  phases:
  - key: brewing
    name: 闻指荒废耕之弊
    labels:
      zh: 恤民察弊
    start_date: 1740-07-05
    highlight_event_id: guji-弘历-event-zhihuang
  - key: breakthrough
    name: 降旨饬劝赶种秋禾
    labels:
      zh: 劝农保收
    start_date: 1740-07-05
    highlight_event_id: guji-弘历-event-zhihuang
  - key: closure
    name: 命散赈一体无遗漏
    labels:
      zh: 赈济周详
    start_date: 1740-07-06
    highlight_event_id: guji-弘历-event-zhenji
  decisions:
  - date: 1740-07-05
    title_zh: 谕禁指荒待勘误耕
    rationale: 春灾全赖秋禾接济，若因查灾误耕，则有司之罪不可逭，故严饬督抚躬亲督劝
  - date: 1740-07-06
    title_zh: 准贫民一体与赈
    rationale: 无田闲散若不与赈必致流移，故令通省阖属贫民均行赈济并早示安众
- id: guji-弘历-endeavor-2
  person_qid: guji-弘历
  title_zh: 整饬吏治振肃纲纪
  summary: 用鄂容安以示栽者培之，饬岳浚以儆怠忽，惩革员僭戴以正章服，严缉衙署剧盗以靖地方
  phases:
  - key: brewing
    name: 察江西吏治懒惰
    labels:
      zh: 察吏安民
    start_date: 1740-07-22
    highlight_event_id: guji-弘历-event-yuejun
  - key: breakthrough
    name: 量才擢用并申饬封疆
    labels:
      zh: 奖勤儆惰
    start_date: 1740-07-06
    highlight_event_id: guji-弘历-event-erongan
  - key: climax
    name: 正章服缉剧盗肃纪
    labels:
      zh: 正名靖盗
    start_date: 1740-07-07
    highlight_event_id: guji-弘历-event-yangshi
  decisions:
  - date: 1740-07-06
    title_zh: 擢鄂容安为詹事不准固辞
    rationale: 用人秉至公量才加恩，世臣子弟能守家声者当培之，故谕鄂尔泰不得以己意固辞
  - date: 1740-07-22
    title_zh: 严饬江西巡抚岳浚
    rationale: 办理事务懒惰迟延且不奏吏治贤否，若仍怠忽则封疆难保，故寄信严饬以示儆
  - date: 1740-07-07
    title_zh: 交办杨凯杨谦僭戴案
    rationale: 革职滥用命官顶带系违越制度不安本分，故交督抚照例拟罪并通行申禁
events:
- id: guji-弘历-event-birth
  person_qid: guji-弘历
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于雍亲王府
  description: 康熙五十年八月十三日生，是为后之高宗纯皇帝
  place_zh: 北京雍亲王府
- id: guji-弘历-event-death
  person_qid: guji-弘历
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩，传位已三年，仍训政，寿八十九岁
  place_zh: 北京紫禁城养心殿
- id: guji-弘历-event-zhihuang
  person_qid: guji-弘历
  date: 1740-07-05
  year_of: 1740
  title_zh: 谕禁指荒废耕
  description: 乾隆五年六月丙戌谕各省督抚，报灾后不许以待勘废种，务躬亲督劝赶种秋禾
  place_zh: 畅春园
- id: guji-弘历-event-zhenji
  person_qid: guji-弘历
  date: 1740-07-06
  year_of: 1740
  title_zh: 议准散赈一体加赈
  description: 乾隆五年六月允九卿议，州县散赈通省贫民均赈，并饬及时开仓及资送流民回籍之制
  place_zh: 北京紫禁城
- id: guji-弘历-event-erongan
  person_qid: guji-弘历
  date: 1740-07-06
  year_of: 1740
  title_zh: 补鄂容安为詹事
  description: 乾隆五年六月丁亥谕吏部，鄂容安补詹事，谕鄂尔泰不得固辞，以示量才培植世臣之意
  place_zh: 北京紫禁城
- id: guji-弘历-event-yuejun
  person_qid: guji-弘历
  date: 1740-07-22
  year_of: 1740
  title_zh: 申饬江西巡抚岳浚
  description: 乾隆五年六月甲午以岳浚懒惰迟延命盗条陈逾年未覆且未奏贤否，寄信严饬悛改
  place_zh: 北京紫禁城
- id: guji-弘历-event-yangshi
  person_qid: guji-弘历
  date: 1740-07-07
  year_of: 1740
  title_zh: 谕惩杨凯杨谦僭越
  description: 乾隆五年六月戊子闻原任提督杨凯总兵杨谦革职仍戴红顶花翎，交督抚照例拟罪并通行禁约
  place_zh: 北京紫禁城
