      zh: 查办
    start_date: 1774-10-06
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 谕令减价勒粜
    labels:
      zh: 决断
    start_date: 1774-10-06
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 枷责奸商贱粜利民
    labels:
      zh: 惩儆
    start_date: 1774-10-07
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 警畏远近不敢效尤
    labels:
      zh: 收束
    start_date: 1774-10-08
    highlight_event_id: guji-弘历-event-3
  decisions:
  - date: 1774-10-06
    title_zh: 不入官而令减价出粜
    rationale: 若查封入官恐缺流通碍民食，不如照时价减二钱勒粜使奸商无利且受惩
  - date: 1774-10-06
    title_zh: 杖责枷号以示惩儆
    rationale: 囤积居奇为病民之蠹，须身受刑责方使垄断之徒闻风警畏
- id: guji-弘历-endeavor-2
  title_zh: 督调各路会剿寿张临清逆匪
  description_zh: 寿张堂邑阳谷贼扰临清，调京兵健勇南北合围，严明军纪奖劝杀贼士民，断桥防窜直隶
  phases:
  - key: brewing
    name: 贼扰三县奏报军情
    labels:
      zh: 酝酿
    start_date: 1774-10-07
    highlight_event_id: guji-弘历-event-4
  - key: breakthrough
    name: 调兵南北合围部署
    labels:
      zh: 部署
    start_date: 1774-10-08
    highlight_event_id: guji-弘历-event-4
  - key: climax
    name: 正法退怯将领奖杀贼义民
    labels:
      zh: 决战
    start_date: 1774-10-09
    highlight_event_id: guji-弘历-event-5
  - key: closure
    name: 断浮桥定期会剿防窜
    labels:
      zh: 合围
    start_date: 1774-10-10
    highlight_event_id: guji-弘历-event-5
  decisions:
  - date: 1774-10-07
    title_zh: 传旨正法惟一格图肯
    rationale: 临阵退往东昌不保新城更不捐躯，若宽贷无以励众用兵，故当众讯问正法示众
  - date: 1774-10-09
    title_zh: 加衔赏银奖馆陶杀贼士民
    rationale: 王建基张灏赵之枚等率众歼贼深明大义，当优加赏录以使闾阎观感奋勉
