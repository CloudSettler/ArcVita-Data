    start_date: 1780-08-31
    highlight_event_id: guji-弘历-event-jinpaixi
  - key: breakthrough
    name: 通谕禁革
    labels:
      zh: 正己率属大法小廉
    start_date: 1780-08-31
    highlight_event_id: guji-弘历-event-jinpaixi
  - key: climax
    name: 申饬沽名侵权
    labels:
      zh: 饬德隆严守职分
    start_date: 1780-08-31
    highlight_event_id: guji-弘历-event-chide
  - key: closure
    name: 年终奏闻考成
    labels:
      zh: 发觉重治永为戒
    start_date: 1780-08-31
    highlight_event_id: guji-弘历-event-jinpaixi
  decisions:
  - date: 1780-08-31
    title_zh: 通谕禁督抚派首府首县承办宴会演戏
    rationale: 督抚酬酢当出赀自办若派属员则藉端要结赔累扰民大有关吏治官方
  - date: 1780-08-31
    title_zh: 传旨严饬德隆强附文人干誉侵权
    rationale: 粮道署司当守本任书院调补各有专责沽名侵权限权妄奏不可长
- id: guji-弘历-endeavor-2
  title_zh: 七旬万寿持盈自警
  summary_zh: 七旬万寿受贺赐宴却金器禁繁文以古稀说化颂为规戒满持盈
  phases:
  - key: brewing
    name: 万寿受贺
    labels:
      zh: 避暑山庄庆贺赐宴
    start_date: 1780-09-11
    highlight_event_id: guji-弘历-event-wanshou
  - key: breakthrough
    name: 却金返璞
    labels:
      zh: 发还金器金锭申饬
    start_date: 1780-09-05
    highlight_event_id: guji-弘历-event-quejin
  - key: climax
    name: 古稀说示意
    labels:
      zh: 以颂为规临深履薄
    start_date: 1780-09-11
    highlight_event_id: guji-弘历-event-wanshou
  - key: closure
    name: 简文柔远
    labels:
      zh: 停朝鲜陈谢附贡以实不以文
    start_date: 1780-09-10
    highlight_event_id: guji-弘历-event-wanshou
  decisions:
  - date: 1780-09-05
    title_zh: 发还郑大进金器金锭并申饬
    rationale: 节次谕禁金珠进呈万寿亦不过照常例联情备赏金锭不成事体当返璞
  - date: 1780-09-11
    title_zh: 奖彭元瑞九颂而作古稀说以颂为规
    rationale: 颂不忘规若洋洋自满则失全当充歉然不足之意敬天法祖勤民奋武
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历出生
  description_zh: 康熙五十年八月十三日生于雍亲王府后即帝位建元乾隆
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 弘历逝世
  description_zh: 嘉庆四年正月初三日崩于宁寿宫终年八十九岁
- id: guji-弘历-event-jinpaixi
  date: 1780-08-31
  year_of: 1780
  title_zh: 通谕禁派属员承办筵席演戏
  description_zh: 谕以外省督抚庆典年节及钦差过境令首府首县承办宴会演戏派累扰民概行禁革年终奏闻违者重治
- id: guji-弘历-event-chide
  date: 1780-08-31
  year_of: 1780
  title_zh: 传旨严饬德隆沽名侵权
  description_zh: 以德隆请颁御制全集及自请联衔核详州县调补为鄙陋乖谬传旨严行申饬以为道员署司者戒
- id: guji-弘历-event-quejin
  date: 1780-09-05
  year_of: 1780
  title_zh: 发还郑大进金器金锭
  description_zh: 以郑大进贡物金器甚多复有备赏金锭一千两为非酌留一件供佛余俱发还并申饬
- id: guji-弘历-event-wanshou
  date: 1780-09-11
  year_of: 1780
  title_zh: 万寿节受贺作古稀说
  description_zh: 己未万寿御澹泊敬诚殿受扈从王公蒙古回部朝鲜等庆贺赐宴奖江苏学政彭元瑞九颂作古稀说化颂为规
