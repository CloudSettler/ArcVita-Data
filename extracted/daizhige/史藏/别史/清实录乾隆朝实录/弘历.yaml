    highlight_event_id: guji-弘历-event-qiushengou
  decisions:
  - date: 1786-10-27
    title_zh: 命车臣汗等分年入围并由库伦乌里雅苏台分领习围
    rationale: 以两部落游牧距围场路远体恤人马往返劳顿且便操演
  - date: 1786-10-27
    title_zh: 定乾清门侍卫先由闲散侍卫引见补放之令
    rationale: 以升阶有别鼓舞勋旧察哈尔诸部出色黾勉者
- id: guji-弘历-endeavor-2
  title_zh: 督办台湾会匪与大名邪教案
  summary_zh: 针对诸罗杨功懋兄弟立会夺犯杀官及大名段文经徐克展纠众杀官窜逸，严谕审办正法并饬各省密缉
  phases:
  - key: brewing
    name: 据奏会匪邪教滋事
