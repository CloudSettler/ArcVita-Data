  description: 太上皇帝弘历崩于北京紫禁城养心殿，葬裕陵，谥纯皇帝
- id: guji-弘历-event-xiyu
  title_zh: 谕办霍罕巴达克山事体申明恩威并用
  date: 1763-04-13
  year_of: 1763
  raw: 乾隆二十八年三月癸酉
  description: 据永贵等奏拖穆齐图晓示霍罕，额尔德尼伯克交还阿济比鄂斯等处，降旨嘉其恭顺，赏素勒坦沙缎八端，并谕纳世通驾驭外藩当恩威并用
- id: guji-弘历-event-tuntian
  title_zh: 命叶尔羌换防并伊犁屯田照给耔种
  date: 1763-04-17
  year_of: 1763
  raw: 乾隆二十八年三月丁丑至丙戌
  description: 命副都统额尔景额由驿赴叶尔羌更换新柱，议准索伦察哈尔移驻伊犁给牛羊盐菜口粮设昂吉佐领，来岁播种照常官给耔种
- id: guji-弘历-event-lizhi
  title_zh: 展赈粥厂并严议蔡观澜袒护之奏
  date: 1763-04-18
  year_of: 1763
  raw: 乾隆二十八年三月戊寅
  description: 准御史蔡观澜所请添给各粥厂米石，然斥其为巴延三等迟到辩护系官官相护交弹互击之习，交部严加议处并通谕中外
- id: guji-弘历-event-zhenji
  title_zh: 饬办遵化鬨堂与巴塘番喇嘛案
  date: 1763-04-27
  year_of: 1763
  raw: 乾隆二十八年三月丁亥兼己卯谕开泰
  description: 以直隶展赈优渥谕观音保星速将遵化借仓聚众鬨堂为首数犯从权正法，又申饬开泰办理巴塘番民喇嘛抢掠失宜，命严拏堪布审讯请旨
