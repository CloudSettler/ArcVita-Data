endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 普免正赋缓徵耗羡并恩恤刑狱
  summary: 即位十年颁旷典分三年普免天下正赋，又令蠲赋之年缓徵耗羡，并减等刑部及各省监禁人犯，以省刑薄赋与民休息
  phases:
  - key: brewing
    name: 普免正赋酝酿
    labels:
      zh:
      - 仁政
      - 蠲赋
    start_date: 1745-08-01
    highlight_event_id: guji-弘历-event-taxmitigate
  - key: breakthrough
    name: 恩恤减等施行
    labels:
      zh:
      - 钦恤
      - 省刑
    start_date: 1746-02-03
    highlight_event_id: guji-弘历-event-clemency
  - key: climax
    name: 缓徵耗羡定议
    labels:
      zh:
      - 养民
      - 息扰
    start_date: 1746-02-04
    highlight_event_id: guji-弘历-event-taxmitigate
  decisions:
  - date: 1746-02-03
    title_zh: 命大学士会同刑部减等发落监禁人犯
    rationale: 不忍囹圄淹滞，分别轻重减等，令同沾肆赦勉图自新，以副协中钦恤
  - date: 1746-02-04
    title_zh: 命蠲赋之年耗羡缓至开徵之年完纳
    rationale: 使终岁不闻催科，免两次伺候公庭之扰，藏富于民而兼顾公用拨抵
- id: guji-弘历-endeavor-2
  title_zh: 钦定祭祀中和乐章并亲行大祀
  summary: 钦定圜丘方泽祈谷雩祭太庙社稷日月等坛庙乐章名，元旦朝贺上帝，孟春享太庙，南郊祈谷，整饬礼乐以昭敬天法祖
  phases:
  - key: brewing
    name: 斋戒定制乐章
    labels:
      zh:
      - 礼乐
      - 钦定
    start_date: 1746-02-03
    highlight_event_id: guji-弘历-event-music
  - key: climax
    name: 亲诣祈谷大祀
    labels:
      zh:
      - 祈谷
      - 亲祀
    start_date: 1746-02-24
    highlight_event_id: guji-弘历-event-praygrain
  - key: closure
    name: 朝正宴赉礼成
    labels:
      zh:
      - 朝贺
      - 怀柔
    start_date: 1746-02-25
    highlight_event_id: guji-弘历-event-praygrain
  decisions:
  - date: 1746-02-03
    title_zh: 钦定各坛庙迎神奠帛初亚终献等乐章名
    rationale: 明礼乐之正，使圜丘方泽太庙社稷各有平丰之节，以肃祀典
  - date: 1746-02-24
    title_zh: 斋宿南郊亲行祈谷礼
    rationale: 以农事为重，敬天祈年，斋戒三日亲诣行礼以昭诚敬
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 诞生
  description: 康熙五十年八月十三日诞生于雍亲王府，为雍正帝第四子
  place: 北京雍亲王府
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 驾崩
  description: 嘉庆四年正月初三日崩于养心殿，寿八十有九，庙号高宗
  place: 北京紫禁城养心殿
- id: guji-弘历-event-clemency
  date: 1746-02-03
  year_of: 1746
  title_zh: 恩恤刑狱分别减等
  description: 以临御十年海宇乂安，特沛旷典，命大学士会同刑部将已结案监禁人犯分别轻重减等发落，军流徒杖以下一并减等完结
  place: 北京紫禁城
- id: guji-弘历-event-taxmitigate
  date: 1746-02-04
  year_of: 1746
  title_zh: 命蠲赋之年缓徵耗羡
  description: 以普免正赋而耗羡照旧输纳仍有追呼之扰，特谕蠲赋之年应徵耗羡缓至开徵之年完纳，并令部议公用拨抵之法
  place: 北京紫禁城
- id: guji-弘历-event-music
  date: 1746-02-03
  year_of: 1746
  title_zh: 钦定祭祀中和乐章名
  description: 钦定圜丘始平景平以下，方泽祈谷太庙社稷朝日夕月文庙先农等各坛庙迎神奠帛初亚终献彻馔送神乐章名，颁行遵用
  place: 北京紫禁城
- id: guji-弘历-event-praygrain
  date: 1746-02-24
  year_of: 1746
  title_zh: 祈谷于上帝
  description: 孟春斋戒三日，前诣南郊斋宫斋宿，亲诣祈谷坛行礼，是日立春进土牛，次日赐外藩宴于箭亭
  place: 北京南郊祈年殿
