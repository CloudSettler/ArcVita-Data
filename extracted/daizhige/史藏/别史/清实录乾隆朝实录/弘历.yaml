  description_zh: 乾隆十七年正月召见准噶尔使臣图卜济尔哈朗赐宴后针对延请呼图克图进藏设忏不限使人数肃州贸易发还逃人萨喇尔诸请逐条驳斥降敕令使赍归晓以和好大义与旧章不可渎
