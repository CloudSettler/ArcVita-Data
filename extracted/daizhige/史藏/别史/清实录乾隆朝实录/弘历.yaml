    start_date: 1785-02-20
    highlight_event_id: guji-弘历-event-qiansou
  - key: breakthrough
    name: 新正肇庆合开筵
    labels:
      zh: 庆典
    start_date: 1796-02-09
    highlight_event_id: guji-弘历-event-qiansou
  - key: climax
    name: 皇极殿赐宴三千人
    labels:
      zh: 养老
    start_date: 1796-02-12
    highlight_event_id: guji-弘历-event-qiansou
  - key: closure
    name: 赏诗章寿杖银牌加顶戴
    labels:
      zh: 敷锡
    start_date: 1796-02-12
    highlight_event_id: guji-弘历-event-qiansou
  decisions:
  - date: 1796-02-12
    title_zh: 举行千叟宴广邀耆老贡使
    rationale: 庞眉皓首盈廷实为吉祥盛事，欲以教孝教忠合中外之欢，同昭继体守文之治
  - date: 1796-02-12
    title_zh: 加恩百岁老民授顶戴
    rationale: 京畿旗籍兵民踊跃预典，百六岁百岁者属升平人瑞，故赏六品七品顶戴以示养老寿祺
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  location_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，母钮祜禄氏，后即乾隆皇帝
- id: guji-弘历-event-abdication
  title_zh: 太和殿传位嗣皇帝
  date: 1796-02-09
  year_of: 1796
  location_zh: 北京太和殿
  description: 嘉庆元年正月初一戊申朔，御太和殿亲授皇帝之宝于皇太子，皇太子即皇帝位，尊为太上皇帝，颁传位诏覃恩三十一款，军国重务仍亲理
- id: guji-弘历-event-qiansou
  title_zh: 皇极殿开千叟宴
  date: 1796-02-12
  year_of: 1796
  location_zh: 北京宁寿宫皇极殿
  description: 辛亥日奉太上皇帝御皇极殿举千叟宴，赐亲王大臣年六十以上兵民年七十以上者三千人宴，九十以上召至御座亲赐卮酒，加恩百六岁熊国沛等授顶戴
- id: guji-弘历-event-death
  title_zh: 驾崩于养心殿
  date: 1799-02-07
  year_of: 1799
  location_zh: 北京养心殿
  description: 嘉庆四年正月初三日崩，年八十九，归政三年后升遐，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
