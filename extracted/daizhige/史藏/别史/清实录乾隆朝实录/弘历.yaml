      zh: 高潮
    start_date: 1757-07-23
    highlight_event_id: guji-弘历-event-pengduan
  - key: closure
    name: 饬水师本地任官湔除旧习约束操防
    labels:
      zh: 收束
    start_date: 1757-07-20
    highlight_event_id: guji-弘历-event-pengduan
  decisions:
  - date: 1757-07-17
    title_zh: 革恒文职拏问并禁金器进贡
    rationale: 大臣簠簋不饬藉进献勒派属员殊玷官箴须立禁以绝口实
  - date: 1757-07-23
    title_zh: 宽减彭家屏斩决为监候而重惩段昌绪
    rationale: 藏书既毁罪疑惟轻可从宽监候然悖逆之风不可长须明谕晓示
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 出生于雍亲王府
  description: 康熙五十年八月十三日生为雍亲王胤禛第四子后即位年号乾隆
  location: 北京
- id: guji-弘历-event-gansu-mian
  date: 1757-07-18
  year_of: 1757
  title_zh: 普免甘肃二十三年地丁钱粮
  description: 念甘肃承办军需民劳特加恩将通省二十三年应徵地丁钱粮概予蠲免并饬董率属员实心查办
  location: 甘肃
- id: guji-弘历-event-yudong-zhen
  date: 1757-07-19
  year_of: 1757
  title_zh: 蠲赈豫东被水州县
  description: 将夏邑商邱虞城永城四县二十三年地丁概免并命刘慥等速查鄢陵扶沟睢州等处积水疏消抚恤借种补种晚禾
  location: 河南归德
- id: guji-弘历-event-hengwen
  date: 1757-07-17
  year_of: 1757
  title_zh: 革问恒文并禁督抚金器贡献
  description: 据刘统勋查实恒文买金短价纵仆收礼即革职拏问并因金炉进贡口实谕督抚除食品外概不得丝毫贡献
  location: 北京
- id: guji-弘历-event-pengduan
  date: 1757-07-23
  year_of: 1757
  title_zh: 审断段昌绪彭家屏逆书案
  description: 段昌绪钞录伪檄评赞改为斩决彭家屏钞藏野史烧毁改为斩监候家产入官余田分赏贫民并通行晓谕
  location: 北京
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于嘉庆四年
  description: 太上皇帝崩年八十九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  location: 北京
