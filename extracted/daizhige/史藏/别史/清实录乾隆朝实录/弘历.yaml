  - key: closure
    name: 饬督抚实力妥办春耕接济
    labels:
      zh: 董率所属均沾实惠
    start_date: 1782-02-15
    highlight_event_id: guji-弘历-event-jiangzhen
  decisions:
  - date: 1782-02-13
    title_zh: 加赈安徽江苏山东河南直隶湖北陕西甘肃贫民
    rationale: 正赈已毕尚届青黄不接民食拮据故加恩展赈并借粜耔种以普春祺
  - date: 1782-02-13
    title_zh: 截留漕粮动帑备赈
    rationale: 崇明徐州被灾较重准截漕十万石五万石拨银一百五十万两以资赈济平粜之用
- id: guji-弘历-endeavor-2
  title_zh: 严办甘肃冒赈饬诫陈辉祖闵鹗元毕沅
  summary_zh: 因王亶望蒋全迪通同捏灾冒赈发觉追究封疆大吏知而不举降调停俸停贡并派员赴乌鲁木齐查办粮价浮冒
  phases:
  - key: brewing
    name: 风闻徘徊致询端倪
    labels:
      zh: 道德齐礼引为己愧
    start_date: 1781-06-01
    highlight_event_id: guji-弘历-event-chizhi
  - key: breakthrough
    name: 和盘托出根究甘肃全省积弊
    labels:
      zh: 层层致询显露捏饰
    start_date: 1782-02-10
    highlight_event_id: guji-弘历-event-chizhi
  - key: climax
    name: 廷谕五伦君臣大义降调停俸
    labels:
      zh: 大义灭亲不得曲贷
    start_date: 1782-02-14
    highlight_event_id: guji-弘历-event-chizhi
  - key: closure
    name: 派喀宁阿赴乌鲁木齐会审粮价并饬西宁厂马案
    labels:
      zh: 不动声色严切根究
    start_date: 1782-02-16
    highlight_event_id: guji-弘历-event-wulumuqi
  decisions:
  - date: 1782-02-14
    title_zh: 陈辉祖闵鹗元降为三品顶带留任停俸停贡
    rationale: 二人以胞弟在甘捏灾冒赈知而不举复支吾欺饰颠倒君臣大义姑念乏员加恩免交部仍须洗心涤虑以赎前罪
  - date: 1782-02-13
    title_zh: 派喀宁阿驰驿赴乌鲁木齐会同明亮查办捏报粮价
    rationale: 索诺木策凌奎林任内采买价值与时价不符显有浮开冒销若非收受馈送岂肯受其冒销故须解任严鞫毋存瞻徇
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于圆明园
  description_zh: 康熙五十年八月十三日生为雍亲王第四子母熙嫔钮祜禄氏
  place_zh: 圆明园
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description_zh: 嘉庆四年正月初三日崩年八十九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  place_zh: 紫禁城养心殿
- id: guji-弘历-event-jiangzhen
  date: 1782-02-13
  year_of: 1782
  title_zh: 正月连谕加赈诸省灾民
  description_zh: 乾隆四十七年正月以正赈已毕青黄不接谕加赈安徽凤阳泗州河南仪封考城山东曹县金乡江苏邳睢崇明直隶天津静海湖北潜江江陵陕西朝邑甘肃宁朔平罗等处极次贫民一两月并酌借耔种口粮截漕拨帑
  place_zh: 紫禁城乾清宫
- id: guji-弘历-event-chizhi
  date: 1782-02-14
  year_of: 1782
  title_zh: 通谕饬诫陈辉祖闵鹗元毕沅知而不举
  description_zh: 以陈辉祖弟陈严祖闵鹗元弟闵鹓元在甘捏灾冒赈馈送王亶望二人知而不举始终掩饰特谕五伦莫重君父大义灭亲将其降为三品顶带留任永停职俸养廉停进贡物以示惩创
  place_zh: 圆明园
- id: guji-弘历-event-wulumuqi
  date: 1782-02-16
  year_of: 1782
  title_zh: 命喀宁阿赴乌鲁木齐会审浮冒粮价
  description_zh: 据明亮奏乌鲁木齐采买粮价与时价不符命侍郎喀宁阿驰驿会同明亮将各州县解任严鞫并谕索诺木策凌在任十年必有收受毋得将就瞻徇兼办西宁厂马缺额案
  place_zh: 圆明园山高水长
