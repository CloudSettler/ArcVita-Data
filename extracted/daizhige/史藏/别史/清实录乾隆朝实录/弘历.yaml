  dilemmas:
  - 滇兵怯懦溃散，当严惩还是调剂养锐
  - 内地节俭与裕民养商，如何权衡盈虚
  lesson: 整军须通情实，恤功严纪并行，方能化无用为有用
  summary_first_person: 朕即位三十三年，滇缅军兴，见滇营怯懦，京兵远戍，故停补滇缺以养劲旅，又罢尤拔世拘俭之谕以通商情，恤明瑞诸臣以励忠勇，此皆朕权衡调剂之心
  source_urls:
