  - 羁縻远藩与坚守旧章大义之权衡
  lesson: 惠政贵在豫筹落实贵在坚守大义
  summary_first_person: 余弘历承继大统十七年当春和之始念京师米价未平即拨京仓四万石分局平粜以惠兵民又览准噶尔台吉喇嘛达尔扎所请以呼图克图断不可往进藏亦无定例贸易使人数皆有旧章遂降敕驳斥而示和好之正道守成中寓经略之心
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0406.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 京仓拨米平粜惠养兵民
  summary_zh: 乾隆十七年正月因京师米价未平于春令之始豫筹接济拨京仓米四万石分给左右翼米局酌减时价平粜以抑居奇而养兵民
  phases:
  - key: brewing
    name: 春和察访米价未平
    labels:
      zh: 民食视察
    start_date: 1752-02-13
    highlight_event_id: guji-弘历-event-pingdiao
  - key: breakthrough
    name: 降旨拨京仓四万石
    labels:
      zh: 仓储调拨
    start_date: 1752-02-13
    highlight_event_id: guji-弘历-event-pingdiao
  - key: climax
    name: 左右翼分局酌减平粜
    labels:
      zh: 平粜施行
    start_date: 1752-02-14
    highlight_event_id: guji-弘历-event-pingdiao
  - key: closure
    name: 妥协经理惠养落实
    labels:
      zh: 惠政收束
    start_date: 1752-02-15
    highlight_event_id: guji-弘历-event-pingdiao
  decisions:
  - date: 1752-02-13
    title_zh: 拨京仓米四万石分给左右翼米局
    rationale: 春令首和闾阎日给正长豫筹接济使近利者不得居奇以副惠养兵民之意
  - date: 1752-02-13
    title_zh: 命仿照时价酌减妥协经理
    rationale: 既济民食又不坏市价须王大臣妥办使实惠均沾而不致扰市
- id: guji-弘历-endeavor-2
  title_zh: 敕驳准噶尔请呼图克图与进藏
  summary_zh: 准噶尔台吉喇嘛达尔扎遣使图卜济尔哈朗进贡请于呼图克图三人内延请一人并请遣人轻骑进藏设忏及放宽使人数贸易诸事皇帝引前旨旧章逐条驳斥降敕令使赍归以明黄教大义与和好体制
  phases:
  - key: brewing
    name: 使臣来贡陈请诸事
    labels:
      zh: 藩部来使
    start_date: 1752-02-20
    highlight_event_id: guji-弘历-event-chi
  - key: breakthrough
    name: 宴赉使臣览奏核旧章
    labels:
      zh: 核章审奏
    start_date: 1752-02-21
    highlight_event_id: guji-弘历-event-chi
  - key: climax
    name: 降敕驳请呼图克图进藏
    labels:
      zh: 降敕申饬
    start_date: 1752-02-22
    highlight_event_id: guji-弘历-event-chi
  - key: closure
    name: 使臣赍敕归藩示大义
    labels:
      zh: 怀柔收束
    start_date: 1752-02-23
    highlight_event_id: guji-弘历-event-chi
  decisions:
  - date: 1752-02-22
    title_zh: 不准请呼图克图往准噶尔
    rationale: 中国呼图克图各有教习学艺大事不可遣往已选藏中喇嘛十人待请而彼不遵前旨故今亦不遣以观真心
  - date: 1752-02-22
    title_zh: 不准无定例屡遣人进藏设忏
    rationale: 无袭位一次进藏一次追报辗转渎请之理必守旧章以杜繁琐渎奏
  - date: 1752-02-22
    title_zh: 使人数仍以五十为准贸易仍照旧例
    rationale: 使事携卖渐增不可不限贸易乃小人谋利之事琐屑不屑深办守哈柳定议为准
  - date: 1752-02-22
    title_zh: 逃人萨喇尔不给回
    rationale: 以生成众生为本逃生者不忍置之死地既往不究来者不受守天下大皇帝之体
