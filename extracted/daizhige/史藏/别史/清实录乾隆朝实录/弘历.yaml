  dilemmas:
  - 宽严之间既欲警觉士风又恐吹求太过致典试者尽干吏议
  - 军需浩繁既不靳帑金又须彻底清厘以杜侵肥中饱之弊
  - 藩部归诚既加恩抚恤又须约束所部以防启衅邻封
  lesson: 乾纲独揽而权衡宽严，事必水落石出，方能肃清朝宁而绥远安近
  summary_first_person: 朕以法天立极居位，削平准回，藩部慕化来归则颁敕加恩抚恤，科场磨勘纷起则亲核朱墨以示惩劝，甘肃军需糜费数千万则派员彻底清查，务使中外洞知朕意，永享无疆之福
  source_urls:
