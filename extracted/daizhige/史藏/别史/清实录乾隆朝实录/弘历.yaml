endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 周甲归政亲授宝玺
  summary: 践阼初元默吁周甲传位，癸巳南郊默奏嗣子之名，嘉庆元年正月上日太和殿亲授皇帝之宝，颁传位诏沛恩泽而仍亲理庶政
  phases:
