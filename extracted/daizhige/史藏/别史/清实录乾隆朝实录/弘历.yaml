  decisions:
  - date: 1765-03-28
    title_zh: 蠲免江浙经过地方本年额赋十分之三
    rationale: 入疆伊始宜敷恺泽，已豁免积欠，仍加恩蠲赋以昭盛典，令督抚实力妥办
  - date: 1765-03-30
    title_zh: 加免宿迁桃源清河铜山四县地丁十分之五
    rationale: 宿迁滨河沮洳土瘠，陆路洒扫勤勚，嘉百姓踊跃赴公，加惠以资盖藏复元气
- id: guji-弘历-endeavor-2
  title_zh: 阅河饬吏整饬吏治
  summary: 南巡途中申明藩臬奏事保举之责，亲阅清口木龙添建，经理运河河湖，以兼顾吏治河务
