      - 养廉
    start_date: 1735-10-08
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 七月癸亥明谕公忠体国
    labels:
      zh:
      - 训谕
      - 吏治
    start_date: 1741-08-12
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 科断贪墨贿卖以正国法
    labels:
      zh:
      - 惩贪
      - 肃纪
    start_date: 1741-08-13
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 确立因物付物惟正斯中之准
    labels:
      zh:
      - 政体
      - 激劝
    start_date: 1741-08-18
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1741-08-12
    title_zh: 七月癸亥谕诸臣公忠体国痛改观望
    rationale: 若以迎合为能上则宽成姑息严成苛刻故须明示因物付物以正视听
  - date: 1741-08-13
    title_zh: 命喀尔钦解部即行正法
    rationale: 学政贿卖生童纵仆营私不置于法则国法无所施故以振纲纪儆官邪
- id: guji-弘历-endeavor-2
  title_zh: 整顿闽广民风营伍禁滥建生祠
  description: 针对闽省械斗殴官潮阳罢市生祠滥建及各省营伍废弛空粮等弊通行化导整顿
  phases:
  - key: brewing
    name: 闽广械斗殴官积习难移
    labels:
      zh:
      - 民风
      - 吏治
    start_date: 1741-08-14
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 谕令闽广江西化导整顿迁善革非
    labels:
      zh:
      - 教化
      - 刑政
    start_date: 1741-08-14
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 严禁现任生祠通行察核去留
    labels:
      zh:
      - 激扬
      - 礼制
    start_date: 1741-08-16
    highlight_event_id: guji-弘历-event-4
  - key: closure
    name: 申饬营伍废弛虚冒以励戎行
    labels:
      zh:
      - 武备
      - 核饷
    start_date: 1741-08-19
    highlight_event_id: guji-弘历-event-5
  decisions:
  - date: 1741-08-16
    title_zh: 通行各省察核生祠以定去留
    rationale: 生祠多出逢迎敛费非出舆论同好若不核禁则旌扬不明故须秉公去留
  - date: 1741-08-19
    title_zh: 训饬营伍废弛虚冒限期振刷
    rationale: 抚标废弛尤甚空粮阳奉阴违平居无事不可虚冒故须派员校验严加处分
