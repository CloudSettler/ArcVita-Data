endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 经略金川决意尽剿以靖全蜀
  summary: 针对大金川围攻沃日热笼及绰斯甲反覆之事斥招抚之议决毁穴焚巢并添兵添饷通盘经画边陲
  phases:
  - key: brewing
    name: 沃日解围奏报未明
    labels:
      zh: 察情
    start_date: 1747-05-10
    highlight_event_id: guji-弘历-event-jinchuan
  - key: breakthrough
    name: 斥招抚务尽剿灭
    labels:
      zh: 决谋
    start_date: 1747-05-15
    highlight_event_id: guji-弘历-event-jinchuan
  - key: climax
    name: 增兵添饷压攻速捷
    labels:
      zh: 用兵
    start_date: 1747-05-20
    highlight_event_id: guji-弘历-event-addtroop
  - key: closure
    name: 命熟筹长策永为不叛之臣
    labels:
      zh: 绥远
    start_date: 1747-05-25
    highlight_event_id: guji-弘历-event-jinchuan
  decisions:
  - date: 1747-05-15
    title_zh: 不许招徕绰斯甲务尽行剿灭毋俾易种
    rationale: 以瞻对袁士弼一意招抚致孽党效尤为鉴欲震慑诸蛮收一劳永逸之利
  - date: 1747-05-20
    title_zh: 再拨银二十万并添调川黔兵各二千
    rationale: 念军营粮饷务须充裕重兵压攻易于速捷而本省贴防亦需周备
- id: guji-弘历-endeavor-2
  title_zh: 整饬吏治教养万民以正风俗
  summary: 以祈雨省刑赈济截漕定举贤自代新例并晓谕化导纠正普免加赈后民气渐骄抗官之风
  phases:
  - key: brewing
    name: 京师望霖省刑祈雨
    labels:
      zh: 省刑
    start_date: 1747-05-05
    highlight_event_id: guji-弘历-event-prayrain
  - key: breakthrough
    name: 定举贤自代新例
    labels:
      zh: 求贤
    start_date: 1747-05-12
    highlight_event_id: guji-弘历-event-juxian
  - key: climax
    name: 山西教案晓谕化导
    labels:
      zh: 教化
    start_date: 1747-05-18
    highlight_event_id: guji-弘历-event-jiaomin
  - key: closure
    name: 截漕赈济山东河南
    labels:
      zh: 惠民
    start_date: 1747-05-22
    highlight_event_id: guji-弘历-event-zhenji
  decisions:
  - date: 1747-05-05
    title_zh: 命清理徒杖轻罪并查缓决重犯以召天和
    rationale: 以清理刑狱亦感召天和之一端故减轻罪酌重囚以祈甘霖苏大田
  - date: 1747-05-12
    title_zh: 禁本省举本省官著为例
    rationale: 以杨嗣璟举同乡官献瑶鄂昌举李锡秦等瞻顾党同为戒必待猷为特达者而后称
  - date: 1747-05-18
    title_zh: 遍谕州县化导愚民敬畏官长
    rationale: 以普免加赈而民不感反咆哮挟制官长故引为己失教之过而先教后刑
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place: 北京
  description: 康熙五十年八月十三日生为雍亲王第四子即后之高宗纯皇帝
- id: guji-弘历-event-prayrain
  title_zh: 诣黑龙潭祈雨并命清理刑狱
  date: 1747-05-06
  year_of: 1747
  place: 黑龙潭
  description: 以京师入春未沾足麦秋望霖故虔诚祈祷并命刑部速减徒杖轻罪会查缓决重犯
- id: guji-弘历-event-jinchuan
  title_zh: 谕庆复张广泗尽剿金川毋事招抚
  date: 1747-05-15
  year_of: 1747
  place: 北京
  description: 因马良柱解热笼沃日之围而奏报未晰故令详查调度并斥绰斯甲报效之请命毁穴焚巢通盘计度全蜀
- id: guji-弘历-event-addtroop
  title_zh: 命添调川黔兵并拨饷二十万协济川省
  date: 1747-05-20
  year_of: 1747
  place: 北京
  description: 以汉土兵不甚得力意在重兵压攻故添调川营二千黔省二千贴防并令户部拨银以备支用
- id: guji-弘历-event-juxian
  title_zh: 定举贤自代例禁本省举本省
  date: 1747-05-12
  year_of: 1747
  place: 北京
  description: 以诸臣所举瞻顾党同如杨嗣璟举官献瑶鄂昌举李锡秦等故定例不许举本省官员
- id: guji-弘历-event-zhenji
  title_zh: 截漕赈济山东并问河南麦收
  date: 1747-05-22
  year_of: 1747
  place: 山东德州
  description: 以兰山安邱诸城等处被旱歉收故再截尾帮漕十万石留贮德仓并令速赈贫民毋致失所
- id: guji-弘历-event-jiaomin
  title_zh: 下谕化导万民论民气渐骄
  date: 1747-05-18
  year_of: 1747
  place: 北京
  description: 因山西万泉安邑聚众抗官及闽鲁苏粤罢市拒捕之事自引失教之过命督抚率州县谆切化导使知尊亲大义
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place: 北京紫禁城
  description: 嘉庆四年正月初三日崩年八十有九遗诏传位嘉庆而以太上皇训政之期告终
