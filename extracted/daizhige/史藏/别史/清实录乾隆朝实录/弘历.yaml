  date: 1741-04-24
  year_of: 1741
  place_zh: 山西
  description_zh: 据喀尔吉善参奏山西布政使萨哈谅加平入己纵仆宣淫学政喀尔钦贿卖生员买有夫妇为妾命革职命杨嗣璟赴晋会审拟以俞鸿图例
- id: guji-弘历-event-1741-xunchi
