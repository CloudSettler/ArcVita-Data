  summary_first_person: 朕弘历即位五年，夏旱忧劳，虔诚祈祷，清理刑狱，筹麦运直，见闽抚贪墨则革职严审，见楚苗猖獗则专任巡抚剿抚并用，惟愿吏清民安边疆永靖
