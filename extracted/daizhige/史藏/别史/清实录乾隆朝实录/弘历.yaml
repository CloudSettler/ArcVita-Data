  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆
  archetype: 大一统守成之君
  dilemmas:
  - 漕运要津发生回空粮船被劫奇案既要速获严惩以儆效尤又要整饬地方文武讳饰废弛之弊
  - 打箭炉山洪冲城与甘省久旱湖南湖北水发叠至既要急赈抚绥不使失所又要核实灾情不为浮饰所误
  - 严言曾妄议宫闱离间父子既要明正典刑以示与众共弃又要不株连蔓引不以无稽之言概疑臣工
  lesson: 遇非常之案当亲临督缉明正显戮以安良善遇水旱当实力抚恤择地久远审断必依实据不以疑似滥及无辜
  summary_first_person: 朕临御四十一年一秉至公丙申七月闻夏津油坊回空漕船黑夜被劫深为骇异屡谕杨景素玛尔清阿周元理严缉务获赏能吏李涛以励缉捕又以打箭炉洪水冲城甘省亢旱湘鄂水发命文绶勒尔谨敦福等实力赈恤清理帑械相度移建至于严言曾造逆词诬蔑离间则交九卿三法司会审明刑以遏邪说
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71013.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 督办夏津油坊漕船被劫案
  summary_zh: 常州府白粮帮回空船在夏津油坊被纠众持械劫掠亲降严旨交杨景素玛尔清阿周元理会缉惩讳饰之县令武弁旌赏缉获盗首之临清知州李涛枭示正法以靖通津
  phases:
