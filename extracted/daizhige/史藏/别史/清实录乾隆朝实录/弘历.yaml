endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 归政前夕普免积欠锡福推恩
  summary_zh: 乾隆六十年降旨普免天下积欠，覆准广东陕西奏报，加恩全行豁免，以示孚惠无疆
  phases:
  - key: brewing
    name: 颁旨普免令查
    labels:
      zh: 施恩肇始
    start_date: 1795-01-01
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 粤省查明豁免
    labels:
      zh: 粤欠蠲除
    start_date: 1795-03-01
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 陕省查明豁免
    labels:
      zh: 秦欠蠲除
    start_date: 1795-03-03
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 推恩无疆旨定
    labels:
      zh: 锡福中外
    start_date: 1795-03-04
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1795-03-01
    title_zh: 豁免广东民欠缓徵银米
    rationale: 保昌等州县民欠及被水缓徵赏借口粮，查明全行豁免以惠灾黎
  - date: 1795-03-03
    title_zh: 豁免陕西带徵缓徵银粮
    rationale: 五十七九年带徵耗羡及仓粮缓借积欠，俱系年清年款之外，加恩豁免以符体制
- id: guji-弘历-endeavor-2
  title_zh: 严缉邪教安抚苗疆整饬吏治
  summary_zh: 因刘之协脱逃久缉未获革治陈用敷，饬令亲往督缉，又因黔楚苗民仇杀饬查衅源，安抚苗众，重惩欺凌客民，并以经筵释奠明政统
  phases:
  - key: brewing
    name: 邪教要犯脱逃严缉
    labels:
      zh: 缉捕失机
    start_date: 1795-03-01
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 革治陈用敷示惩
    labels:
      zh: 整饬封疆
    start_date: 1795-03-02
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 谕办苗民滋事
    labels:
      zh: 安抚苗疆
    start_date: 1795-03-04
    highlight_event_id: guji-弘历-event-4
  - key: closure
    name: 经筵释奠临雍明道
    labels:
      zh: 重道崇儒
    start_date: 1795-03-05
    highlight_event_id: guji-弘历-event-5
  decisions:
  - date: 1795-03-02
    title_zh: 革陈用敷交刑部治罪
    rationale: 究出樊城踪迹不先驰奏，不亲往查拏，坐待会奏，颠倒推诿，故重惩以儆玩误
  - date: 1795-03-04
    title_zh: 令福宁福康安查明苗衅妥办
    rationale: 苗民素安静畏法，必系客民侵占欺凌激变，须擒首恶，安余众，重惩肇衅客民，查参失察官员
  - date: 1795-03-05
    title_zh: 亲诣经筵文庙临幸辟雍
    rationale: 以典学懋修为行政之本，广额士林，表章经学，示心传政传于皇子大臣
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生于圆明园
  date: 1711-09-25
  year_of: 1711
  kind: birth
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后嗣位为乾隆皇帝
- id: guji-弘历-event-death
  title_zh: 太上皇崩于养心殿
  date: 1799-02-07
  year_of: 1799
  kind: death
  description_zh: 嘉庆四年正月初三日崩，临御六十年，归政三年而崩，寿八十九岁
- id: guji-弘历-event-1
  title_zh: 豁免广东积欠银米
  date: 1795-03-01
  year_of: 1795
  kind: 施恩
  description_zh: 据长麟等覆奏，保昌等州县民欠及高要等县缓徵赏借银七万余两米万九千余石，加恩全行豁免
- id: guji-弘历-event-2
  title_zh: 豁免陕西带徵缓徵银粮
  date: 1795-03-03
  year_of: 1795
  kind: 施恩
  description_zh: 据秦承恩覆奏，五十七九年带徵耗羡银五十万余两及仓粮四十七万余石，加恩全行豁免
- id: guji-弘历-event-3
  title_zh: 革陈用敷严缉刘之协
  date: 1795-03-02
  year_of: 1795
  kind: 整饬
  description_zh: 陈用敷究出刘之协逃往樊城苏明宽家不即奏不亲缉，仅委知县，降旨革职交刑部，并饬福宁亲往督缉
- id: guji-弘历-event-4
  title_zh: 谕办黔楚苗民滋事
  date: 1795-03-04
  year_of: 1795
  kind: 安边
  description_zh: 松桃大塘石柳邓及永绥黄瓜寨石三保纠众仇杀，谕福宁驻劄，福康安会办，查明客民欺凌衅源，安抚苗众
- id: guji-弘历-event-5
  title_zh: 仲春经筵释奠临雍
  date: 1795-03-05
  year_of: 1795
  kind: 崇儒
  description_zh: 御文华殿经筵，释奠文庙，临幸辟雍阅石经，御制诗章，广额士林，晋赠福敏蔡世远以崇师儒
