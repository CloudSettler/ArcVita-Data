- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 太上皇龙御归天
  description: 嘉庆四年正月初三日崩于养心殿寿八十九岁
- id: guji-弘历-event-copper
  date: 1793-08-19
  year_of: 1793
  title_zh: 谕查沉溺铜铅打捞之弊
  description: 谕惠龄严饬水摸打捞务期全获并密查盗卖铺户窝家惩一儆百
- id: guji-弘历-event-relief
  date: 1793-08-23
  year_of: 1793
  title_zh: 缓征山东被旱州县旧欠
  description: 德州等二十七处及毗连十六州县旧欠钱粮仓谷分两年带征并缓漕粮采买
- id: guji-弘历-event-school
  date: 1793-08-26
  year_of: 1793
  title_zh: 申禁坊间删本经书
  description: 饬各督抚查缴删本解京销毁三年汇奏一次以端士习崇实学
- id: guji-弘历-event-tribute-setup
  date: 1793-08-18
  year_of: 1793
  title_zh: 命安设英贡天文地理表
  description: 命于正大光明殿安设留京贡品八件并令西洋人太监眼同学习安装之法
- id: guji-弘历-event-macartney
  date: 1793-08-30
  year_of: 1793
  title_zh: 定议英咭唎贡船先回
  description: 以贡使称船内人众不服水土准其在定海候信先回本国并严饬徵瑞等糊涂具奏
