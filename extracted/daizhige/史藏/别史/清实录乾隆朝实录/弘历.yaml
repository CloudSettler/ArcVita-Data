      - 赏赉
      - 分等
    start_date: 1778-01-08
    highlight_event_id: guji-弘历-event-tour
  - key: climax
    name: 严拣勤慎派出
    labels:
      zh:
      - 拣选
      - 训饬
    start_date: 1778-01-08
    highlight_event_id: guji-弘历-event-tour
  - key: closure
    name: 饬管大臣亲给查禁糜费
    labels:
      zh:
      - 核实
      - 禁糜费
    start_date: 1778-01-08
    highlight_event_id: guji-弘历-event-tour
  decisions:
  - date: 1778-01-08
    title_zh: 加恩御前侍卫等各赏银有差
    rationale: 恐照前例帮银购办行李尚不敷用，故按等次优加赏赉以资备办
  - date: 1778-01-08
    title_zh: 不拘班次择勤慎者派出
    rationale: 欲得力扈从，不使滥竽充数，故令管大臣认真拣选并亲给银两
- id: guji-弘历-endeavor-2
  title_zh: 饬河州逆案缉缅边禁赈旱灾
  summary_zh: 申饬勒尔谨通达办案核功过，严缅甸边禁不许通市，赈恤甘肃旱灾，缉盐枭朝鲜余党
  phases:
  - key: brewing
    name: 饬勒尔谨通达事体
    labels:
      zh:
      - 申饬
      - 核案
    start_date: 1778-01-09
    highlight_event_id: guji-弘历-event-leerjin
  - key: breakthrough
    name: 核河州杀贼功罪是非
    labels:
      zh:
      - 军纪
      - 辨功
    start_date: 1778-01-19
    highlight_event_id: guji-弘历-event-leerjin
  - key: climax
    name: 严缅边禁稽察偷漏
    labels:
      zh:
      - 边禁
      - 防缅
    start_date: 1778-01-17
    highlight_event_id: guji-弘历-event-myanmar
  - key: closure
    name: 赈甘肃旱灾祈雪恤民
    labels:
      zh:
      - 赈恤
      - 祈雪
    start_date: 1778-01-13
    highlight_event_id: guji-弘历-event-relief
  decisions:
  - date: 1778-01-09
    title_zh: 再传旨申饬勒尔谨毋拘泥干咎
    rationale: 谢恩迟误奏报不明，办理奋勉而迂拙，故须饬其通达以任封疆
  - date: 1778-01-17
    title_zh: 缅事付之不理惟严边禁不许通市
    rationale: 匪酋游移不可差人探听居奇，惟严查关隘使窘惧方为正办
  - date: 1778-01-13
    title_zh: 赈恤甘肃三十二厅州县旱灾民
    rationale: 被旱成灾已深，须按册散给刻榜晓示，防短发索诈以活民命
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生，是为弘历，后即皇帝位年号乾隆
- id: guji-弘历-event-tour
  title_zh: 谕明年巡幸盛京谒陵加恩赏赉
  date: 1778-01-08
  year_of: 1778
  description_zh: 乾隆四十二年十二月戊申谕，明年巡幸盛京恭谒祖陵，御前侍卫赏银一百二十两以下按等加恩，令管大臣亲给备办衣服鞍辔
- id: guji-弘历-event-leerjin
  title_zh: 申饬勒尔谨查办河州逆匪案
  date: 1778-01-09
  year_of: 1778
  description_zh: 己酉谕军机大臣，斥勒尔谨谢恩迟误拘泥不达事理，嗣后办理一切事务须通达事体，后复饬其妄记马兵谢崇文拔补之非
- id: guji-弘历-event-myanmar
  title_zh: 谕李侍尧严缅甸边禁稽察偷漏
  date: 1778-01-17
  year_of: 1778
  description_zh: 丁巳谕军机大臣，缅匪进贡还人事付不理，惟严查关隘不许通市，奸民越隘牟利者严拏重处，管守怠忽者参奏
- id: guji-弘历-event-relief
  title_zh: 赈恤甘肃旱灾及祫祭太庙
  date: 1778-01-20
  year_of: 1778
  description_zh: 癸丑赈恤皋兰等三十二厅州县被旱灾民，庚申祫祭太庙亲诣行礼，遣官祭诸陵太岁
- id: guji-弘历-event-death
  title_zh: 崩于嘉庆四年
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
