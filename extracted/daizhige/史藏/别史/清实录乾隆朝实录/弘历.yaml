  dilemmas:
  - 念旧臣勤敏而徇庇欺饰当宽贷以全恩还是正典刑以儆官邪
  - 秘阁珍藏当谨守以防污损还是广传以嘉惠士林
  lesson: 代天养民惟敬惟诚吏治不清则民瘼难苏文治不广则士心不振故于蠹吏必严惩于典籍必广传方为长治之道
  summary_first_person: 吾临御五十有五年兢兢以敬天爱民为念江苏高邮句容两案皆关民食国赋闵鹗元坐享丰腴徇隐废弛吾不得不革员严审以肃吏治四库全书既已蒇工吾欲使江浙士子得赴阁钞阅翰林底本亦许就近检录俾石渠之藏家弦户诵以昭右文盛事
