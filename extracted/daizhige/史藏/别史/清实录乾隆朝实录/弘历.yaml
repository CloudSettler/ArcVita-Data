      - 祭祀
    start_date: 1751-03-08
    highlight_event_id: guji-弘历-event-yuehe
  - key: breakthrough
    name: 阅高家堰视淮安水势
    labels:
      zh:
      - 巡堤
      - 勘估
    start_date: 1751-03-11
    highlight_event_id: guji-弘历-event-yuehe
  - key: climax
    name: 命建淮安石工修高堰坝
    labels:
      zh:
      - 石工
      - 保障
    start_date: 1751-03-12
    highlight_event_id: guji-弘历-event-shigong
  - key: closure
    name: 奖叙河兵饬吏防边
    labels:
      zh:
      - 议叙
      - 整饬
    start_date: 1751-03-13
    highlight_event_id: guji-弘历-event-chili
  decisions:
  - date: 1751-03-12
    title_zh: 改建淮安城北土堤为石工并兴修高堰倒卸段
    rationale: 城北内外皆水，人烟凑集，异涨难堪，亟应改建石工以资保障，坝工及时兴修
  - date: 1751-03-13
    title_zh: 严饬改拟图尔炳阿斩监候并会审纪山严防藏路
    rationale: 封疆瞻徇欺隐侵贪不察不可轻纵，驻藏泄言纳贿必研讯，准噶尔通藏道路展放卡座严加防范
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  type: birth
  title_zh: 弘历诞生
  description: 康熙五十年八月十三日生于雍亲王府邸
- id: guji-弘历-event-xuee
  date: 1751-03-01
  year_of: 1751
  type: career
  title_zh: 南巡加恩三省学额
  description: 二月己巳朔谕江苏安徽浙江本年岁试府学州县大学增取五名中学四名小学三名举行一次
- id: guji-弘历-event-zhenmian
  date: 1751-03-03
  year_of: 1751
  type: career
  title_zh: 加赈鲁苏蠲免耔种盐价
  description: 加赈兰山郯城峄县等七州县，免宿迁清河桃源被灾贫民耔种银，豁免两淮灶户乾隆二年至十四年未完折价
- id: guji-弘历-event-yuehe
  date: 1751-03-08
  year_of: 1751
  type: career
  title_zh: 渡黄河阅堤堰
  description: 御舟渡黄河至天妃闸阅下埽，祭河渎淮渎，阅高家堰堤，加一级高斌顶带张师载
- id: guji-弘历-event-shigong
  date: 1751-03-12
  year_of: 1751
  type: career
  title_zh: 命建淮安石工
  description: 见淮安城北内外皆水，命总河高斌会同总督黄廷桂确勘详估及时建筑石工以资保障
- id: guji-弘历-event-chili
  date: 1751-03-13
  year_of: 1751
  type: career
  title_zh: 饬吏治边务
  description: 斥刑部避重就轻改拟云南巡抚图尔炳阿斩监候，命会审纪山驻藏泄言馈银事，谕策楞等严防准噶尔由叶尔羌通藏道路
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  type: death
  title_zh: 弘历驾崩
  description: 嘉庆四年正月初三日崩于北京紫禁城养心殿
