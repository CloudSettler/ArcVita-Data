  - key: breakthrough
    name: 驳斥遽议迁建
    labels:
      zh: 疏浚正办
    start_date: 1766-06-03
    highlight_event_id: guji-弘历-event-yifeng
  - key: climax
    name: 示以邳州临淮明验
    labels:
      zh: 化潴为田
    start_date: 1766-06-05
    highlight_event_id: guji-弘历-event-yifeng
  - key: closure
    name: 准议停修培壅完固
    labels:
      zh: 因地定议
    start_date: 1766-07-01
    highlight_event_id: guji-弘历-event-yifeng
  decisions:
  - date: 1766-06-01
    title_zh: 谕阿思哈亲往查办勿遽迁建
    rationale: 三城非全为水占城堤坚厚可御外水宜先疏消内潦或挖湖潴蓄或开沟归宿
  - date: 1766-06-05
    title_zh: 以另建之费供疏浚化膏壤
    rationale: 迁徙工程浩大衙署改建为难居人安土重迁邳州临淮迁后民仍聚旧地故以疏浚为事半功倍
- id: guji-弘历-endeavor-2
  title_zh: 国史馆明季唐桂诸王正名
  summary_zh: 因新纂列传洪承畴传于唐王加伪字特谕持平正名嘉予明末殉节诸臣
  phases:
  - key: brewing
    name: 进呈新纂列传阅定
    labels:
      zh: 阅定史馆
    start_date: 1766-06-10
    highlight_event_id: guji-弘历-event-guoshiguan
  - key: breakthrough
    name: 指出唐王加伪为未协
    labels:
      zh: 正名辨伪
    start_date: 1766-06-12
    highlight_event_id: guji-弘历-event-guoshiguan
  - key: climax
    name: 以宋末昰昺播迁为比
    labels:
      zh: 比事徵实
    start_date: 1766-06-12
    highlight_event_id: guji-弘历-event-guoshiguan
  - key: closure
    name: 明示大中至正为准绳
    labels:
      zh: 垂为法戒
    start_date: 1766-06-13
    highlight_event_id: guji-弘历-event-guoshiguan
  decisions:
  - date: 1766-06-12
    title_zh: 命唐桂诸王不得概从贬斥为伪
    rationale: 明至甲申统虽亡福王在江宁如宋南渡唐桂转徙如昰昺播迁皆明室子孙非异姓僭窃草贼可比
  - date: 1766-06-12
    title_zh: 命嘉予黄道周史可法等节义不目为伪臣
    rationale: 当时抗拒王师诛戮所必及今平情而论各为其主节义不容掩当权衡至公笔削持平
