endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 督师北路擒治青滚杂卜安定喀尔喀
  summary: 伊犁底定后青滚杂卜背叛煽惑喀尔喀，命成衮扎布为定边左副将军，多路会剿并晓谕安抚
  phases:
  - key: brewing
    name: 叛迹初著晓示利害
    labels:
      zh:
      - 侦察安抚
    start_date: 1756-09-05
    highlight_event_id: guji-弘历-event-1756-anfu
  - key: breakthrough
    name: 简任大将军督师会剿
    labels:
      zh:
      - 简任统帅
    start_date: 1756-09-15
    highlight_event_id: guji-弘历-event-1756-qingg bazaar
  - key: climax
    name: 多路调兵预备策应
    labels:
      zh:
      - 预备调度
    start_date: 1756-09-22
    highlight_event_id: guji-弘历-event-1756-diaobing
  - key: closure
    name: 明谕喀尔喀毋堕奸计
    labels:
      zh:
      - 收束善后
    start_date: 1756-09-16
    highlight_event_id: guji-弘历-event-1756-anfu
  decisions:
  - date: 1756-09-15
    title_zh: 授成衮扎布为定边左副将军
    rationale: 旧任将军威望素著，以喀尔喀亲王剿喀尔喀叛逆，可服众心并速集兵
  - date: 1756-09-22
    title_zh: 预调绥远吉林阿拉善兵马而不张皇
    rationale: 先事豫防以备不虞，又恐惊扰藩部，故密办赏需马价以待调遣
- id: guji-弘历-endeavor-2
  title_zh: 整顿江南河务严惩侵冒
  summary: 江南河工整顿后复发孙廷钺舒超通同侵冒案，从重正法并议处河臣以示警
  phases:
  - key: brewing
    name: 整顿河工申明法纪
    labels:
      zh:
      - 整饬河务
    start_date: 1755-01-01
    highlight_event_id: guji-弘历-event-1756-hewu
  - key: breakthrough
    name: 审实侵冒大案
    labels:
      zh:
      - 审讯定案
    start_date: 1756-09-08
    highlight_event_id: guji-弘历-event-1756-hewu
  - key: climax
    name: 正法首犯警示官邪
    labels:
      zh:
      - 明刑振纪
    start_date: 1756-09-08
    highlight_event_id: guji-弘历-event-1756-hewu
  - key: closure
    name: 宽减河臣注册存任
    labels:
      zh:
      - 恩威并用
    start_date: 1756-09-09
    highlight_event_id: guji-弘历-event-1756-hewu
  decisions:
  - date: 1756-09-08
    title_zh: 孙廷钺舒超依拟即行正法
    rationale: 整顿之后愍不畏法通同侵冒，若不从重惩创无以示警
  - date: 1756-09-09
    title_zh: 富勒赫从宽免革任仍注册
    rationale: 专司河务失察应革，但念河务需人，故宽其革任以观后效
