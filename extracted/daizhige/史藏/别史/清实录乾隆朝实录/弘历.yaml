  title_zh: 大赈浙东旱灾并兴修水利
  summary: 南巡亲见萧绍河浅复闻浙东夏旱即截留江浙漕粮八十万石备赈粜平粜并谕以工代赈疏浚河道训饬督抚和衷实办
