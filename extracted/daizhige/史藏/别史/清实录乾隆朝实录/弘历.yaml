  decisions:
  - date: 1735-10-03
    title_zh: 即位改元乾隆并大赦天下
    rationale: 神器不可久虚须早定名号安中外之心并以恩泽固人心
  - date: 1735-10-04
    title_zh: 解任高起宪德整饬兵刑二部
    rationale: 二人乖张昏愦废弛部务不容以不胜任者为表率故命鄂尔泰果亲王总理以经理得人
  - date: 1735-10-04
    title_zh: 停罢各省进献方物
    rationale: 方值大丧哀恸方深不忍受贡故概行停止以明孝思俟三年后再旨
