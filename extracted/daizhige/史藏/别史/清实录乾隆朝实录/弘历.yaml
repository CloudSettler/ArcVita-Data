    highlight_event_id: guji-弘历-event-chongru
  - key: closure
    name: 兼祀少昊
    labels:
      zh:
      - 祭陵
      - 溯源
    start_date: 1748-03-15
    highlight_event_id: guji-弘历-event-chongru
  decisions:
  - date: 1748-03-15
    title_zh: 分遣大臣奉香帛祭四贤专庙
    rationale: 四贤配享殿庭而故里各有专庙，宜分祭以展诚敬而昭崇重
  - date: 1748-03-15
    title_zh: 以御制四贤赞勒石并亲祀少昊陵
    rationale: 少昊旧都陵在曲阜，道法渊源所自，躬亲祀事以示溯源仰止之意
