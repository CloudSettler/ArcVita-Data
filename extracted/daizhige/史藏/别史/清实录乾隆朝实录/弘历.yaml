  dilemmas:
  - 对外藩一味姑息必致骄肆与恩威并用方能豫弭事端之抉择
  - 灾赈加恩展限与国用常例约束之权衡
  - 台谏官官相护交弹互击与杜渐防微正人心之整饬
  lesson: 驾驭内外当恩威并用，先示所惧而后施所感，赈恤则从优而吏治则从严
  summary_first_person: 我于乾隆二十八年三月经略西陲，既嘉额尔德尼伯克之恭顺，又谕以恩威并用不可姑息，并命伊犁屯田安插如旧给发耔种，同时于畿辅展赈、整饬御史党护之习、严办遵化鬨堂与巴塘番案，以示勤政爱民而纪纲不弛
