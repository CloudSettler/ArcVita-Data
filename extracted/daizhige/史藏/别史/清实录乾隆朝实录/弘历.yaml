    title_zh: 谕禁督抚收受土宜
    rationale: 悬鱼留犊为美谈，鞭鞾不已必及珠玉，养廉已定即不容丝毫授受，方能举劾出于公心
  - date: 1736-12-08
    title_zh: 明定访闻参劾严加议处
    rationale: 若因些微土产稍干物议则非远嫌之道，必以簠簋不饬为戒方能守皇考澄清之规
