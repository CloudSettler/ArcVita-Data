endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 弛禁回经安抚回众
  summary: 朱椿飞咨各省查办回经，萨载转饬搜押，朕以旧教经典自唐宋流传，与僧道无异，降旨省释给还，通谕毋庸查办
  phases:
  - key: brewing
    name: 广西咨会起衅
    labels:
      zh:
      - 旧教经典
      - 各省咨拏
    start_date: 1782-06-01
    highlight_event_id: guji-弘历-event-huijing
  - key: breakthrough
    name: 降旨停止查办
    labels:
      zh:
      - 申饬朱椿
      - 通谕停办
    start_date: 1782-07-01
    highlight_event_id: guji-弘历-event-huijing
  - key: climax
    name: 省释萨载所拏诸人
    labels:
      zh:
      - 省释安抚
      - 给还书版
    start_date: 1782-07-10
    highlight_event_id: guji-弘历-event-huijing
  - key: closure
    name: 晓谕各安本业
    labels:
      zh:
      - 晓谕回民
      - 毋致惊惶
    start_date: 1782-07-15
    highlight_event_id: guji-弘历-event-huijing
  decisions:
  - date: 1782-07-01
    title_zh: 谕朱椿荒唐错谬严行申饬
    rationale: 旧教回经家喻户晓，非白莲敛钱聚众作乱可比，过为搜求则安分守法者不能自安
  - date: 1782-07-10
    title_zh: 谕萨载矜张可鄙仍予省释
    rationale: 回民饮食作息与平民相等，旧教回民曾协同官兵出力剿捕，皆吾赤子，不可歧视，书版给还出示晓谕
- id: guji-弘历-endeavor-2
  title_zh: 缅酋内讧静镇守边
  summary: 赘角牙被杀孟陨自立，骨肉辗转袭杀，朕以得地不足守且前已许其纳款乞宥，谕令静镇守边，不乘危进讨
  phases:
  - key: brewing
    name: 腾越探报更换
    labels:
      zh:
      - 骨肉相残
      - 边情探报
    start_date: 1782-07-01
    highlight_event_id: guji-弘历-event-miandian
  - key: breakthrough
    name: 决计无庸办理
    labels:
      zh:
      - 静镇守边
      - 师出无名
    start_date: 1782-07-05
    highlight_event_id: guji-弘历-event-miandian
  - key: climax
    name: 交廷臣公议覆奏
    labels:
      zh:
      - 咨阿桂阅看
      - 大学士九卿详议
    start_date: 1782-07-08
    highlight_event_id: guji-弘历-event-miandian
  - key: closure
    name: 严守关隘安插遣还
    labels:
      zh:
      - 严守边界
      - 输诚即奏
    start_date: 1782-07-12
    highlight_event_id: guji-弘历-event-miandian
  decisions:
  - date: 1782-07-05
    title_zh: 谕富纲静镇不可张皇
    rationale: 缅地瘴疠水土非宜，得地不足守，非新疆可耕屯巩固可比，乘危进讨非堂堂正正之义，且似为造恶之懵驳父子报复
  - date: 1782-07-08
    title_zh: 谕新酋输诚即准叩关
    rationale: 前已赦其前罪许其罢兵，若孟陨恭顺虔修职贡即据情入奏准其输诚，窜入头人多则远处安插少则遣还
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place: 北京雍亲王府
  description: 康熙五十年八月十三日生，是为弘历，后即位建元乾隆
- id: guji-弘历-event-death
  title_zh: 太上皇崩逝
  date: 1799-02-07
  year_of: 1799
  place: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，谥纯皇帝，庙号高宗
- id: guji-弘历-event-huijing
  title_zh: 降旨回经毋庸查办并省释
  date: 1782-07-01
  year_of: 1782
  place: 热河行在
  description: 因广西朱椿咨会查办回经、江苏萨载搜押改绍贤等，降旨以旧教经典与僧道无异，申饬朱椿萨载，概予省释，给还书版，通谕各省一例停止
- id: guji-弘历-event-miandian
  title_zh: 谕缅酋内讧无庸办理静镇守边
  date: 1782-07-05
  year_of: 1782
  place: 热河行在
  description: 据富纲奏赘角牙被孟鲁杀害、孟陨又杀孟鲁自立，降旨以天理不容无庸天朝致讨，令富纲静镇守边，阿桂及大学士九卿公议覆奏，新酋输诚即准入奏
