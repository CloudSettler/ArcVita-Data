  decisions:
  - date: '1788-02-15'
    title_zh: 申饬福康安勿事持重速擒林爽文
    rationale: 北路牵缀南路复扰恐首逆由内山窜合庄大田故令悬赏招番勒兵入山分路搜捕以成破竹之势
  - date: '1788-02-16'
    title_zh: 谕擒获陈泮勒限不符即行拿解究办
    rationale: 贼目自请限期擒献逾限未获其留质入山难信恐其透漏军情助逆远窜故不容姑息
- id: guji-弘历-endeavor-2
  title_zh: 乾隆五十三年春普赈灾区
  summary_zh: 河南安徽甘肃陕西直隶山西等省上年水旱成灾正赈已毕青黄不接再沛恩旨展赈缓征借籽平粜以惠穷黎
