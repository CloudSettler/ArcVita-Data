    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清乾隆朝
  reign_ref: 乾隆
  archetype: 励精图治之君
  dilemmas:
  - 金川碉坚难攻而罢兵示弱不可为，进剿迟迟又当如何制胜
  - 常平积谷太多则留民者少，减额出粜又恐备荒不足
  lesson: 用兵当核实粮道险要与田禾资食，养民当权衡官储民食之聚散，不可偏执一端
  summary_first_person: 朕即位十三年，值金川用兵之际，一面详诘粮运彻营之故，一面亲练云梯以备攻碉，又以米价腾贵而厘定直省仓额出粜，赈恤畿辅山东水旱，夙夜筹维不敢自暇
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70319.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 金川军务督问与云梯练兵
  summary_zh: 因大小金川碉楼险固进剿迟滞，详查马良柱彻营遗械缘由，连谕讷亲张广泗奏报粮运田禾，并选八旗劲旅演习云梯以备攻坚
  phases:
  - key: brewing
    name: 解送马良柱问彻营遗械
    labels:
      zh: 彻营究因
    start_date: 1748-08-04
    highlight_event_id: guji-弘历-event-jinchuanliang
  - key: breakthrough
    name: 选八旗勇健演习云梯
    labels:
      zh: 云梯练兵
    start_date: 1748-08-05
    highlight_event_id: guji-弘历-event-yunti
  - key: climax
    name: 连谕军前奏报田禾晴雨
    labels:
      zh: 诘问田禾
    start_date: 1748-08-12
    highlight_event_id: guji-弘历-event-jinchuanliang
  - key: closure
    name: 留马良柱在京协同演习候调
    labels:
      zh: 留将候用
    start_date: 1748-08-13
    highlight_event_id: guji-弘历-event-jinchuanliang
  decisions:
  - date: 1748-08-05
    title_zh: 派大臣练八旗云梯数百人
    rationale: 金酋恃碉险固可用云梯破敌，亦满洲武艺所当训练，故择少壮勇健者按期操练以备遣用
  - date: 1748-08-12
    title_zh: 留马良柱暂不问罪令量度贼碉
    rationale: 其在川二十余年熟悉地方且曾奋勇解围，若粮阻半月属实则仓皇拔营情可别论，故令协同演习立功赎罪
- id: guji-弘历-endeavor-2
  title_zh: 常平仓储厘定与水旱赈恤
  summary_zh: 以近年米价日增推究官储太多之弊，谕定直省常平悉准康雍旧额加贮以次出粜，并赈恤直隶山东江苏被灾贫民
  phases:
  - key: brewing
    name: 思官储民食聚散之理
    labels:
      zh: 米贵推因
    start_date: 1748-08-06
    highlight_event_id: guji-弘历-event-cangchu
  - key: breakthrough
    name: 谕定仓额准康雍旧额
    labels:
      zh: 仓额改弦
    start_date: 1748-08-06
    highlight_event_id: guji-弘历-event-cangchu
  - key: climax
    name: 命大学士会部查定拨运之法
    labels:
      zh: 会议拨补
    start_date: 1748-08-06
    highlight_event_id: guji-弘历-event-cangchu
  - key: closure
    name: 赈恤直鲁苏被旱水州县
    labels:
      zh: 加恩赈恤
    start_date: 1748-08-10
    highlight_event_id: guji-弘历-event-zhenxu
  decisions:
  - date: 1748-08-06
    title_zh: 加贮谷石以次出粜至原额止
    rationale: 生谷止有此数聚官太多则留民必少，捐监增入常平实碍民食，故改弦悉复旧额不足者邻省拨补
  - date: 1748-08-10
    title_zh: 赈恤三省二十余州县贫民
    rationale: 京师甘霖之后系念山东积歉及直隶江苏水旱，恐收成有减故蠲缓贷赈兼施以安灾黎
events:
- id: guji-弘历-event-birth
  type: birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生于雍亲王府
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即帝位年号乾隆
- id: guji-弘历-event-death
  type: death
  date: 1799-02-07
  year_of: 1799
  title_zh: 太上皇帝崩于养心殿
  description_zh: 嘉庆四年正月初三日崩，年八十九，遗诏归政嘉庆，庙号高宗纯皇帝
- id: guji-弘历-event-yunti
  type: career
  date: 1748-08-05
  year_of: 1748
  title_zh: 谕选八旗前锋护军演习云梯
  description_zh: 乾隆十三年七月以金川碉固及满洲武艺久废，命上三旗每旗五十人下五旗每旗三十人择少壮勇健者演习云梯，派哈达哈等管领训练
- id: guji-弘历-event-cangchu
  type: career
  date: 1748-08-06
  year_of: 1748
  title_zh: 命定直省仓贮悉准康雍旧额
  description_zh: 以米价日增推原采买过多之弊，谕直省常平悉复康熙雍正旧额，加贮者以次出粜，命大学士会部查定拨运存粜之法
- id: guji-弘历-event-jinchuanliang
  type: career
  date: 1748-08-12
  year_of: 1748
  title_zh: 详询马良柱曾达彻营粮阻事
  description_zh: 张广泗解送总兵马良柱到京，自称驻曾达时粮为雪阻半月士卒煮皮铠而食，谕令讷亲秉公确查粮运是否阻滞，并诘问金川田禾何以不能蹂躏焚烧
- id: guji-弘历-event-zhenxu
  type: career
  date: 1748-08-10
  year_of: 1748
  title_zh: 赈恤直隶山东江苏被灾贫民
  description_zh: 赈直隶二十九卅县旱灾贫民及山东二十九县旱水雹虫贫民，并恤江苏山阳等六州县被雹贫民缓徵漕赋
