  year_of: 1741
  place_zh: 北京勤政殿
  description_zh: 谕九卿谨慎自守多勇往任事少汉尚书可信不过一二人嗣后当体公忠扩充器识交相劝勉成大法小廉之治
- id: guji-弘历-event-death
  title_zh: 驾崩
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩年八十九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
