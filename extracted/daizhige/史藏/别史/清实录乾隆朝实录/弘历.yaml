endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 南巡江浙省方问俗加恩士民
  summary_zh: 法祖南巡，过鲁入淮，普加学额，赈灾蠲欠，恤灶户河兵随从，以示育才养民
  phases:
