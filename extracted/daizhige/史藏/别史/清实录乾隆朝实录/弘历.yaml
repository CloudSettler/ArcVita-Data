endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 京畿亢旱省愆祈雨
  summary_zh: 乾隆九年五月京师雨泽愆期朕亲诣畅春园问安之际感母后步祷之诚遂定旱雩斋期亲制风神祭文并亲祭方泽以祈甘霖
  phases:
  - key: brewing
    name: 春夏不雨忧形于心
    labels:
      zh:
      - 忧旱
      - 省愆
    start_date: 1744-06-13
    highlight_event_id: guji-弘历-event-hanqi
  - key: breakthrough
    name: 却节令议定斋期致祭
    labels:
      zh:
      - 旱雩
      - 太庙祈祷
    start_date: 1744-06-14
    highlight_event_id: guji-弘历-event-hanyu
  - key: climax
    name: 亲制祭文祷于风神方泽
    labels:
      zh:
      - 祭风神
      - 方泽亲祭
    start_date: 1744-06-17
    highlight_event_id: guji-弘历-event-fengshen
  - key: closure
    name: 步祷母后前自责谢罪晓谕臣工
    labels:
      zh:
      - 步祷
      - 敬孝
    start_date: 1744-06-22
    highlight_event_id: guji-弘历-event-fangze
  decisions:
  - date: 1744-06-14
    title_zh: 不以端阳改斋期即行祈祷
    rationale: 天时亢旱不可间于节令且恐拂母后忧民圣心故仍定初五斋戒初八致祭悉照典礼行
  - date: 1744-06-17
    title_zh: 亲制告风神文遣王代祷
    rationale: 风霾时作庆散于风故虔祷风神收暴致雨并自陈不德以感召天和救济禾黍
- id: guji-弘历-endeavor-2
  title_zh: 畿辅水利备荒经略
  summary_zh: 因柴潮生奏请兴修河间天津水利朕命大学士九卿速议复密谕两江豫备米麦令顺天府分厂平粜并调盛京仓豆接济京畿以备歉岁
  phases:
  - key: brewing
    name: 御史奏兴畿辅水利
    labels:
      zh:
      - 水利
      - 畿辅
    start_date: 1744-06-19
    highlight_event_id: guji-弘历-event-shuili
  - key: breakthrough
    name: 分设四厂平粜济民
    labels:
      zh:
      - 平粜
      - 济民
    start_date: 1744-06-21
    highlight_event_id: guji-弘历-event-pingcai
  - key: climax
    name: 密谕两江豫备米麦
    labels:
      zh:
      - 备荒
      - 截漕
    start_date: 1744-06-25
    highlight_event_id: guji-弘历-event-mimi
  - key: closure
    name: 调盛京仓豆运京接济
    labels:
      zh:
      - 仓储
      - 转运
    start_date: 1744-06-25
    highlight_event_id: guji-弘历-event-yundou
  decisions:
  - date: 1744-06-19
    title_zh: 命大学士会同九卿速议水利疏
    rationale: 生齿日繁民食渐绌舍兴水利无以消旱潦故先就直隶为端俟效次第举行
  - date: 1744-06-25
    title_zh: 密令上下江各备米麦十数万石
    rationale: 河间天津连年歉收近京缺雨恐将来民食艰难故豫备于丰收之地不声张以待调用
