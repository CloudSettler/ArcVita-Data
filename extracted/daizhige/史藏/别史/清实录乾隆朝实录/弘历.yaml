    rationale: 善后关系紧要须厚集兵力壮声势若遽彻兵必贻后患
  - date: 1772-02-11
    title_zh: 平定后相度善地设镇驻兵
    rationale: 既费帑兴师二万余名必求一劳永逸不为迁就苟完之计
