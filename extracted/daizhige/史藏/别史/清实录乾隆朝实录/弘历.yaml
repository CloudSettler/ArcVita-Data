  date: 1735-12-22
  year_of: 1735
  kind: 事业
  description_zh: 封崇庆皇太后父凌柱为一等公晋允祎等生母为嫔追封大阿哥八阿哥为亲王
- id: guji-弘历-event-zhaogao
