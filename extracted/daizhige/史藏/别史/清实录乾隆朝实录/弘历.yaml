  dilemmas:
  - 手足私恩与君臣大义之间孰重孰轻
  - 频频加赈施恩与撙节国帑之间如何两全
  - 道德齐礼与明刑饬法之间何时不得不重治贪墨
  lesson: 为君当以轸恤穷檐为本以大义灭亲饬吏治纵私恩则酿成奇贪异弊
  summary_first_person: 朕临御四十有七年以养民教民为己任是岁春正赈期已毕犹念青黄不接再加恩直豫鲁苏皖鄂陕甘诸省展赈借粜至甘肃冒赈一案内外缄默陈辉祖等以弟故知而不举朕引为道德未孚之愧而不得不齐之以刑降调停俸以示惩创
