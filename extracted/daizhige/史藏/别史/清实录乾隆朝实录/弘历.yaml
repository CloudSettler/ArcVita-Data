endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 指授进剿回部经略
  summary: 围攻库车相持之际，授雅尔哈善与兆惠相机缓急分兵略地之策，并为彻兵后攻心安众预作部署
  phases:
  - key: brewing
    name: 围困库车断水草
    labels:
      zh: 围城相持
    start_date: 1758-07-09
    highlight_event_id: guji-弘历-event-kuche
  - key: breakthrough
    name: 诫急迫许分兵略地
    labels:
      zh: 相机行事
    start_date: 1758-07-09
    highlight_event_id: guji-弘历-event-kuche
  - key: climax
    name: 谋取叶尔羌擒二酋
    labels:
      zh: 直捣擒酋
    start_date: 1758-07-13
    highlight_event_id: guji-弘历-event-yeerqiang
  - key: closure
    name: 彻兵释俘示谕攻心
    labels:
      zh: 攻心安众
    start_date: 1758-07-13
    highlight_event_id: guji-弘历-event-yeerqiang
  decisions:
  - date: 1758-07-09
    title_zh: 谕雅尔哈善勿急迫攻城宜分兵取乌什
    rationale: 恐诸将以延缓获咎而轻进，故明示迟速惟在相机，分兵蹂禾以困贼而全军力
  - date: 1758-07-13
    title_zh: 谕兆惠审信进止并于彻兵时纵俘传檄
    rationale: 若叶尔羌喀什噶尔一时难克，则以擒获二酋为专责，以来年再举蹂践田禾之势动摇回众，使悔罪归诚
- id: guji-弘历-endeavor-2
  title_zh: 督治中州河漕与边饷储备
  summary: 因豫省水患命浚支干诸河，颁碑文以垂久远而禁建亭糜费，复为明岁添兵预筹二万官兵一岁口粮
  phases:
  - key: brewing
    name: 履勘豫省支干河道
    labels:
      zh: 相度原委
    start_date: 1758-07-12
    highlight_event_id: guji-弘历-event-zhongzhou
  - key: breakthrough
    name: 纤道告竣议叙河臣
    labels:
      zh: 工成议叙
    start_date: 1758-07-16
    highlight_event_id: guji-弘历-event-zhongzhou
  - key: climax
    name: 御制治河碑垂示守修
    labels:
      zh: 勒石垂训
    start_date: 1758-07-12
    highlight_event_id: guji-弘历-event-zhongzhou
  - key: closure
    name: 预筹甘省军粮转运哈密
    labels:
      zh: 未雨绸缪
    start_date: 1758-07-15
    highlight_event_id: guji-弘历-event-junliang
  decisions:
  - date: 1758-07-12
    title_zh: 颁中州治河碑文禁建万岁亭
    rationale: 建亭祝嘏徒费民财无益，惟纪治水始末使后之司土者知修守勿替方为实惠
  - date: 1758-07-15
    title_zh: 命黄廷桂速筹二万兵一岁口粮运存哈密巴里坤
    rationale: 回部若岁内未靖则明岁必添兵，口粮关系紧要，宜于今冬料理齐备以免临事周章
events:
- id: guji-弘历-event-birth
  title_zh: 出生于圆明园
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京圆明园
  description: 康熙五十年八月十三日生，为雍亲王第四子，后承大统年号乾隆
- id: guji-弘历-event-kuche
  title_zh: 谕雅尔哈善相机攻守库车
  date: 1758-07-09
  year_of: 1758
  place_zh: 京师
  description: 乾隆二十三年六月丁巳，闻官军围库车断水草，敕以迟速惟在相机，若未克则分兵略乌什阿克苏，蹂禾彻兵亦可
- id: guji-弘历-event-yeerqiang
  title_zh: 谕兆惠雅尔哈善彻兵攻心之策
  date: 1758-07-13
  year_of: 1758
  place_zh: 京师
  description: 乾隆二十三年六月辛酉，谕两路进兵若岁内不能克叶尔羌喀什噶尔，则于彻兵时纵俘传示只擒二酋与众无涉，来年再举以动摇其心
- id: guji-弘历-event-zhongzhou
  title_zh: 御制中州治河碑文颁示
  date: 1758-07-12
  year_of: 1758
  place_zh: 京师
  description: 乾隆二十三年六月庚申，因胡宝瑔等浚豫省支干河工告成，御制碑文纪水土之政，禁建万岁亭以节民财
- id: guji-弘历-event-junliang
  title_zh: 敕筹二万官兵一岁口粮
  date: 1758-07-15
  year_of: 1758
  place_zh: 京师
  description: 乾隆二十三年六月癸亥，谕黄廷桂就甘省旧贮及川省近甘州县广为购运，务足二万官兵一岁之需，今冬运至巴里坤哈密存贮
- id: guji-弘历-event-death
  title_zh: 逝世于紫禁城养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城
  description: 嘉庆四年正月初三日逝世，归政后为太上皇帝，享年八十九，谥纯皇帝庙号高宗
