  decisions:
  - date: 1763-04-13
    title_zh: 嘉谕额尔德尼伯克并训纳世通恩威并用
    rationale: 若一味姑息外藩必致骄肆，须先知所惧而后感益深，以豫弭滋事之端
  - date: 1763-04-17
    title_zh: 命额尔景额赴叶尔羌更换新柱
    rationale: 新柱久驻应代，若巴达克山索还游牧事竣即交代起程，否则会同商办以慎大体
  - date: 1763-04-26
    title_zh: 命伊犁厄鲁特来年照常官给耔种
    rationale: 新经安插生计未裕，不便以余粮足敷为由停给官种
- id: guji-弘历-endeavor-2
  title_zh: 畿辅赈济与吏治整饬
  summary: 展赈京师粥厂与文武俸扣，加恩兵丁官员，并严饬御史党护、遵化鬨堂及巴塘番案
  phases:
  - key: brewing
    name: 天津积水误耕议罚
    labels:
      zh: 儆职守示创惩
