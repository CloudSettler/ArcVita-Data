  lesson: 不以一时翦除为功当以经久绥靖为要秉公酌理方能永除后患
  summary_first_person: 朕于乾隆十二年六月行围在即遥制金川分路进剿既望指日殄灭更虑善后经制复于畿辅巡幸中抚恤铜沛雹灾整饬河南聚众及山东营伍务使吏民各得其理蛮众永就约束
