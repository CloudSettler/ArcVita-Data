    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 识破名实不副
    labels:
      zh: 戒矜张
    start_date: 1766-11-02
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 传谕节制论功
    labels:
      zh: 节制论功
    start_date: 1766-11-02
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 缓徵蠲赈
    labels:
      zh: 恤灾纾民
    start_date: 1766-11-10
    highlight_event_id: guji-弘历-event-3
  decisions:
  - date: 1766-11-02
    title_zh: 生番案如此完结不张大论功
    rationale: 仅斩凶番一名毁寮舍而回，未多所斩获，毁社寮示惩已足昭炯戒，只可酌量在外奖赏
  - date: 1766-11-10
    title_zh: 缓山东历城等五十九州县卫钱粮至麦熟
    rationale: 毗连灾地收成稍歉，照常徵输闾阎拮据，加恩缓徵以纾民力
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 出生于雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即帝位年号乾隆
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 驾崩于养心殿
  description: 嘉庆四年正月初三日崩于养心殿，庙号高宗，葬裕陵
- id: guji-弘历-event-1
  date: 1766-11-02
  year_of: 1766
  title_zh: 谕斥苏昌生番案夸张失实
  description: 乾隆三十一年十月壬子谕军机大臣，谓官兵仅追斩凶番一名焚寮舍而回，余番奔逃，戒勿张大论功，只可酌量在外奖赏
- id: guji-弘历-event-2
  date: 1766-11-03
  year_of: 1766
  title_zh: 降斥史奕昂不安分回籍读书
  description: 乾隆三十一年十月癸丑谕，以史奕昂恃谕侵权放恣怨望轻率，降为三品卿衔回籍闭户读书，彭启丰降补兵部侍郎，并宣谕中外
- id: guji-弘历-event-3
  date: 1766-11-10
  year_of: 1766
  title_zh: 缓徵山东历城等处钱粮赈灾
  description: 乾隆三十一年十月庚申谕，以历城等五十九州县卫毗连灾地收歉，命本年应徵钱粮及民借银谷一体缓至明岁麦熟后徵收，并蠲缓直隶安徽水旱州县额赋
