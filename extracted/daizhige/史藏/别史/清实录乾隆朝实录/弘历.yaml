  lesson: 敬天勤民联内外以同心方保无疆之庥
  summary_first_person: 朕承苍眷列圣垂庥平伊犁定回部辟疆二万余里选精璆重造五朝册宝尊藏太庙年逾古稀犹日孜孜不敢不敬天不敢不勤民以凝承鸿贶为念
  source_urls:
