    start_date: 1778-09-18
    highlight_event_id: guji-弘历-event-kuanmian
  decisions:
  - date: 1778-09-16
    title_zh: 蠲免奉天四十四年地丁正项
    rationale: 留都士庶忠爱可嘉，连年不事输将以享盈宁，兼示不忘根本之意
  - date: 1778-09-16
    title_zh: 减等军流以下宽免祥刑
    rationale: 俗厚风淳狱讼衰息，借礼成行庆敷恺泽以昭肆眚施惠
- id: guji-弘历-endeavor-2
  title_zh: 仪封漫口堵筑与豫皖赈恤
  summary_zh: 豫省仪封考城黄河漫溢，淮流骤涨致安徽亳寿等州县水旱并灾，督高晋等昼夜进埽挑挖引河，截留漕粮拨运盐课银，缓徵粟豆麦以纾民力
  phases:
  - key: brewing
    name: 漫工奏报酝酿
