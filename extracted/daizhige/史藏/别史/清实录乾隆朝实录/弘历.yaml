endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 督理兩金川征剿调度
  summary_zh: 增調勁旅查辦木果木失事議進兵道路議敘轉輸以圖迅奏膚功
  phases:
  - key: brewing
    name: 增兵備用
    labels:
      zh: 派健銳火器吉林索倫駐防赴川
    start_date: 1773-09-01
    highlight_event_id: guji-弘历-event-huoluan
  - key: breakthrough
    name: 究詰潰敗
    labels:
      zh: 詰問溫福海蘭察富勒渾劉秉恬失察之咎
    start_date: 1773-10-03
    highlight_event_id: guji-弘历-event-jinchuan
  - key: climax
    name: 議定進剿
    labels:
      zh: 命阿桂豐昇額候機分路深入
    start_date: 1773-10-05
    highlight_event_id: guji-弘历-event-jinchuan
  - key: closure
    name: 議敘轉輸
    labels:
      zh: 議敘帶兵督撫藩臬及台站州縣
    start_date: 1773-10-07
    highlight_event_id: guji-弘历-event-jinchuan
  decisions:
  - date: 1773-10-01
    title_zh: 派京營及駐防精銳赴川備用
    rationale: 綠旗不足恃須勁旅彈壓以期迅速蕆事
  - date: 1773-10-03
    title_zh: 傳詢海蘭察富勒渾劉秉恬匿不上聞之故
    rationale: 降番密告夾壩掠人事前已知而不奏貽誤戎機必窮究以儆效尤
  - date: 1773-10-05
    title_zh: 命豐昇額守宜喜牽掣西路聽阿桂酌辦
    rationale: 不宜孟浪輕進須候信息分路妥辦以全師制勝
- id: guji-弘历-endeavor-2
  title_zh: 釐正秋審慎刑之政
  summary_zh: 勾到各省情實申飭督撫寬縱重定械鬥故殺之擬以昭平允
  phases:
  - key: brewing
    name: 密記重案
    labels:
      zh: 存記陳輝祖梁國治海成等疑案俟秋審提奏
    start_date: 1773-08-01
    highlight_event_id: guji-弘历-event-qiushen
  - key: breakthrough
    name: 駁正緩決
    labels:
      zh: 九卿改緩決入情實所改甚是
    start_date: 1773-10-02
    highlight_event_id: guji-弘历-event-qiushen
  - key: climax
    name: 傳旨申飭
    labels:
      zh: 飭陳輝祖梁國治海成裴宗錫姑息沽名
    start_date: 1773-10-04
    highlight_event_id: guji-弘历-event-qiushen
  - key: closure
    name: 勾到定讞
    labels:
      zh: 御行殿勾到陝西奉天湖廣浙江等省情實
    start_date: 1773-10-06
    highlight_event_id: guji-弘历-event-qiushen
  decisions:
  - date: 1773-10-02
    title_zh: 改張登潮王永德鍾克聲等入情實
    rationale: 逞凶圍毆妒姦殺命火器殺人必抵償方合情法之平
  - date: 1773-10-04
    title_zh: 嚴飭裴宗錫私鑄聚眾殺父子等案失當
    rationale: 秋讞大典不容姑息沽名須詳慎推勘以重民命
  - date: 1773-10-06
    title_zh: 親御行殿勾到停決若干餘予勾
    rationale: 詳核斬絞分別停決以示欽恤
