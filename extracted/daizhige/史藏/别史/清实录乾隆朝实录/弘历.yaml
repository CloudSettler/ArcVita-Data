    rationale: 成周因事郊祀不必定在二至，我朝旧制尽孝尽诚，来年升祔后夏至前选吉恭奉配享方为隆备
events:
- id: guji-弘历-event-birth
  person_id: guji-弘历
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于康熙朝
  description: 康熙五十年八月十三日生，为雍亲王第四子，后即位为高宗纯皇帝
- id: guji-弘历-event-1
  person_id: guji-弘历
  date: 1736-12-08
  year_of: 1736
  title_zh: 谕禁督抚受土宜
  description: 乾隆元年十二月癸亥谕总理事务王大臣，闻督抚间有收受属员土宜者，此风断不可长，特申诫谕，违者访闻参劾严加议处
- id: guji-弘历-event-3
  person_id: guji-弘历
  date: 1736-12-06
  year_of: 1736
  title_zh: 停次年元旦升殿受贺
  description: 乾隆元年十二月壬戌以明年元旦尚在二十七月之内不忍升殿受贺，皇太后前照例行礼，后奉懿旨并停王大臣赴慈宁宫行礼
- id: guji-弘历-event-2
  person_id: guji-弘历
  date: 1736-12-11
  year_of: 1736
  title_zh: 谕议世宗配享郊坛
  description: 乾隆元年十二月丙寅以世宗德并高深宜配享郊坛，命礼部会同王大臣内阁九卿详议，定二年三月升祔后夏至前选吉配享圜丘方泽
- id: guji-弘历-event-death
  person_id: guji-弘历
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于嘉庆四年
  description: 嘉庆四年正月初三日崩，庙号高宗，谥纯皇帝，葬裕陵
