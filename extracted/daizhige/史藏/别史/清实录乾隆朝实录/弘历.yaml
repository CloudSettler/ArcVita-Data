  era: 清代
  reign_ref: 乾隆三十三年
  archetype: 敬天法祖勤政肃纪的中兴守成之君
  dilemmas:
  - 严惩割辫邪术以靖闾阎与避免株连惊扰之间如何权衡
  - 优给学政养廉以全体制与严惩勒索逼命以肃纲纪之间如何抉择
  - 缅甸边衅当速进剿灭以扬威与暂缓用兵以蓄实力之间如何决断
  lesson: 敬天勤民明察秋毫，于邪术则务除根株，于贪墨则必正纲纪，于边务则权衡缓急，宽严并济方能长治久安
  summary_first_person: 朕临御三十三年，夙夜敬勤不敢自逸，闻山东直隶有割辫妖术迷惑良善，即饬各督抚严密根缉务绝根株，见广西学政梅立本勒索供应逼死县令杨梿，即革职拏问付秋审以昭炯戒，于滇缅军营则筹马添兵驻守要隘，凡以安百姓而肃纪纲也
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0813.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷0813.md
