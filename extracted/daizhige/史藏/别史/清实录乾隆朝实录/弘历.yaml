  title_zh: 饬吏整风禁派累宴席
  summary_zh: 因德隆条奏与访闻积习通谕禁坐省家人与督抚派首府首县办宴演戏以正官风
  phases:
  - key: brewing
    name: 访闻恶习
    labels:
