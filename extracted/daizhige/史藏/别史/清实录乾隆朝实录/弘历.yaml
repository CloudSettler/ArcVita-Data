  date: 1763-02-01
  year_of: 1763
  type: career
  title_zh: 大阅于畅春园西厂赐宴加赏兵丁
  description: 御甲胄亲阅前锋护军骁骑火器藤牌诸队九进枪炮命回部中亚使臣从观礼成加恩大阅兵丁每人赏半月钱粮余亦赏其半
- id: guji-弘历-event-chiyu
  person_id: guji-弘历
  date: 1763-02-02
  year_of: 1763
  type: career
  title_zh: 赐敕书于爱乌罕巴达克山霍罕哈萨克诸部
  description: 宴赉入觐使臣申中外一视赏善罚恶命素勒坦沙归博罗尔土地人民命额尔德尼归额德格讷所掠命各部遵喀什噶尔叶尔羌大臣节制和协邻封休养部落
