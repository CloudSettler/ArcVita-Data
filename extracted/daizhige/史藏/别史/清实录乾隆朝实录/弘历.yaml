endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 仪封黄河引河堵口督办
  summary_zh: 乾隆四十四年五月连谕阿桂等相机开放引河，掣动全溜，赶汛前合龙，并筹王家庄新引河及两岸堤工培缮
  phases:
  - key: brewing
    name: 盼望开引河
    labels:
      zh:
      - 盼望
      - 筹划
    start_date: 1779-06-09
    highlight_event_id: guji-弘历-event-yifeng
  - key: breakthrough
    name: 引溜沟启放见效
    labels:
      zh:
      - 引溜
      - 试放
    start_date: 1779-06-13
    highlight_event_id: guji-弘历-event-yifeng
  - key: climax
    name: 风涨冲塌再筹新河
    labels:
      zh:
      - 挫折
      - 改道
    start_date: 1779-06-20
    highlight_event_id: guji-弘历-event-yifeng
  - key: closure
    name: 留阿桂始终其事御汛
    labels:
      zh:
      - 留任
      - 善后
    start_date: 1779-06-25
    highlight_event_id: guji-弘历-event-yifeng
  decisions:
  - date: 1779-06-14
    title_zh: 六百里加紧谕相机拆坝启放
    rationale: 引溜已畅须得西南风以掣全溜，故令速奏风势水势，务汛前赶完，不可草率亦不可迟误
  - date: 1779-06-25
    title_zh: 命阿桂留工始终办理毋即回京
    rationale: 袁守侗新任未谙河务，须阿桂履勘两岸堤工并会勘涡河疏浚，以御大汛而保善后
- id: guji-弘历-endeavor-2
  title_zh: 沈大绶逆书查办与川省军需加恩
  summary_zh: 照徐述夔例戮尸沈大绶并严讯作序传钞各犯而不株连无辜，又尽豁川省民欠商欠及专赔分赔以恤官民
  phases:
  - key: brewing
    name: 湖南呈缴逆书
    labels:
      zh:
      - 访查
      - 缴书
    start_date: 1779-06-14
    highlight_event_id: guji-弘历-event-shendashou
  - key: breakthrough
    name: 定戮尸严讯之旨
    labels:
      zh:
      - 定性
      - 严讯
    start_date: 1779-06-15
    highlight_event_id: guji-弘历-event-shendashou
  - key: climax
    name: 分省追缴板片销毁
    labels:
      zh:
      - 追缴
      - 销毁
    start_date: 1779-06-18
    highlight_event_id: guji-弘历-event-shendashou
  - key: closure
    name: 川省军需尽豁施恩
    labels:
      zh:
      - 豁免
      - 施恩
    start_date: 1779-06-22
    highlight_event_id: guji-弘历-event-chuanxiao
  decisions:
  - date: 1779-06-14
    title_zh: 谕照徐述夔例戮尸沈大绶
    rationale: 举人知县心怀怨谤肆其狂吠，虽伏冥诛亦当戮尸以伸国法快人心，并严讯作序同谋毋姑息
  - date: 1779-06-22
    title_zh: 加恩尽豁川省民欠商欠赔项
    rationale: 金川用帑六千余万不以累民，民欠摊派有加赋之嫌，养廉扣半至五十年不成事，故一体豁免以安吏治民力
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于雍亲王府
  description_zh: 康熙五十年八月十三日生，是为弘历，后即位建元乾隆
  location_zh: 北京
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于北京
  description_zh: 嘉庆四年正月初三日崩，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  location_zh: 北京
- id: guji-弘历-event-yifeng
  date: 1779-06-14
  year_of: 1779
  title_zh: 连谕阿桂开放仪封引河
  description_zh: 据阿桂奏引溜沟启放奔腾下达，谕以六百里加紧令奏风势水势及何日开放引河掣动全溜，并筹口门下埽合龙及王家庄新引河
  location_zh: 北京及河南仪封
- id: guji-弘历-event-shendashou
  date: 1779-06-15
  year_of: 1779
  title_zh: 办沈大绶硕果录逆书案
  description_zh: 据陈用敷奏武生沈荣英呈缴其父沈大绶刊刻硕果录介寿辞语多狂悖，谕照徐述夔例戮尸，不准以自首论，作序之陈湄余永观等一并严讯，分咨湖北江西查缴板片解京销毁
  location_zh: 湖南临湘及江西永新
- id: guji-弘历-event-chuanxiao
  date: 1779-06-22
  year_of: 1779
  title_zh: 豁免川省金川军需民欠赔项
  description_zh: 户部议覆富勒浑奏销军需，谕将民欠津贴站夫口粮一百九十六万余两及无著商欠专赔分赔二百八十三万余两粮米十五万余石尽行豁免，毋扣通省养廉
  location_zh: 北京
