  - key: breakthrough
    name: 粥厂展赈与御史迟到之争
    labels:
      zh: 不以人废言
    start_date: 1763-04-18
    highlight_event_id: guji-弘历-event-lizhi
  - key: climax
    name: 严议蔡观澜交弹互击
    labels:
      zh: 杜渐防微正人心
    start_date: 1763-04-18
    highlight_event_id: guji-弘历-event-lizhi
  - key: closure
    name: 遵化借粮鬨堂与巴塘番民案饬办
    labels:
      zh: 惩一儆百明示炯戒
    start_date: 1763-04-27
    highlight_event_id: guji-弘历-event-zhenji
  decisions:
  - date: 1763-04-14
    title_zh: 区别革职之天津道府等发往效力试看
    rationale: 那亲阿日睹积水漠不关心罪无可逭，额尔登布额尔登额情稍可原，量为区别以儆职守
  - date: 1763-04-18
    title_zh: 准添粥厂米石而交部严议蔡观澜
    rationale: 厂务应先事妥办不以人废言，然其袒护同官诋呵台长关乎政体，须惩儆以彰国纪
  - date: 1763-04-27
    title_zh: 谕观音保从权正法遵化为首数犯并严拏巴塘喇嘛番民
    rationale: 沛泽频仍之后纠众鬨堂属不逞之尤，渠魁法在必行，番案亦须严拏按律以昭炯戒
events:
- id: guji-弘历-event-birth
