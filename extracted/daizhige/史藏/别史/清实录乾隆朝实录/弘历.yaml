    highlight_event_id: guji-弘历-event-jiazhen-1783
  decisions:
  - date: 1783-02-02
    title_zh: 江苏邳铜丰宿等处加赈两月
    rationale: 念今春正赈已毕青黄不接民食拮据故于常赈之外概行加赈以资接济
  - date: 1783-02-03
    title_zh: 山东兖曹济宁七八分灾加赈一月
    rationale: 以一县高低不等七八分不在常赈之内今春民食未免拮据故加恩普济灾黎
