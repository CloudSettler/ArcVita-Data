    rationale: 所犯止于撞骗财物，按律斩候已足蔽辜，不可以观望迎合而畸重
  - date: 1754-05-25
    title_zh: 纠聚劫犯辱官贪蚀重犯停勾不缓
    rationale: 人心风俗所关，若久稽显戮则百姓渐忘，非以肃刑章示炯戒
