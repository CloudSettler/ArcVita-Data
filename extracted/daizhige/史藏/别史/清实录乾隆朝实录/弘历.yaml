  - date: 1755-09-07
    title_zh: 令尹继善径赴热河同入筵宴商略南巡事宜
    rationale: 若俟回京陛见再赴江南则办理不裕，值嘉会可壮观瞻增色外藩
  - date: 1755-09-20
    title_zh: 谕闽浙督抚详绘海塘坍卸图贴说具奏
    rationale: 所奏不甚明晰，南塘北塘冲刷情形须详悉查勘加筑以保民田
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生于圆明园
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京圆明园
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即位为乾隆皇帝
- id: guji-弘历-event-death
  title_zh: 太上皇弘历崩逝
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京养心殿
  description_zh: 嘉庆四年正月初三日崩，年八十九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
- id: guji-弘历-event-mulan
  title_zh: 奉皇太后自避暑山庄启銮幸木兰
  date: 1755-09-06
  year_of: 1755
  place_zh: 承德避暑山庄至木兰围场
  description_zh: 乾隆二十年八月丁丑，奉皇太后启銮，诣行宫问安，驻跸中关波罗河屯张三营，逐日行围
- id: guji-弘历-event-yinjishan
  title_zh: 传谕尹继善径赴热河入宴面商南巡
  date: 1755-09-07
  year_of: 1755
  place_zh: 木兰阿贵图大营
  description_zh: 以明岁南巡河防秋汛事宜，令两江总督尹继善径赴热河，同宴准噶尔台吉，面加训谕，厚重有体可壮观瞻
- id: guji-弘历-event-zhungar-system
  title_zh: 议定准噶尔封爵俸禄分旗之制
  date: 1755-09-08
  year_of: 1755
  place_zh: 海拉苏台大营
  description_zh: 谕班第等将四卫拉特台吉照内扎萨克分封汗贝勒贝子公扎萨克，给俸分立八旗，晓谕编设旗分佐领为授官起见
- id: guji-弘历-event-amursana
  title_zh: 密谕擒治阿睦尔撒纳党羽安抚游牧
  date: 1755-09-10
  year_of: 1755
  place_zh: 敦达乌拉岱大营
  description_zh: 先谕哈达哈俟阿玉锡到后会同纳木扎勒擒乌巴什锡哈玛和通等十人，余众不办，传谕罪止其身安居乐业，并防阿睦尔撒纳中途逗留迁移逃窜
- id: guji-弘历-event-hetang
  title_zh: 批覆浙省海塘坍卸抢筑情形
  date: 1755-09-15
  year_of: 1755
  place_zh: 巴颜沟大营
  description_zh: 据喀尔吉善周人骥奏七月风潮海盐山阴等县塘工坍卸，谕速绘图贴说详奏，南塘帮宽加厚，北塘拆底重修加筑坦水备塘
