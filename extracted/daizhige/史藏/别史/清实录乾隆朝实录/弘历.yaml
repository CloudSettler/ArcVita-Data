endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 金川土司羁縻处置
  summary: 九土司会攻金川相持数载，谕令阿尔泰岳钟璜亲赴开导，明示祸福，不轻用兵
  phases:
  - key: brewing
    name: 土司观望相持
    labels:
      zh: 羁縻远夷
    start_date: 1766-07-08
    highlight_event_id: guji-弘历-event-jinchuan
  - key: climax
    name: 亲往申谕祸福
    labels:
      zh: 明示进止
    start_date: 1766-07-08
    highlight_event_id: guji-弘历-event-jinchuan
  decisions:
  - date: 1766-07-08
    title_zh: 谕阿尔泰岳钟璜亲赴金川地开导九土司
    rationale: 金川未犯内地，用兵无名，莫若晓以利害，察其梗概以定进止
  - date: 1766-07-08
    title_zh: 不许绿营虚诞掩饰，豫筹厚集以待不靖
    rationale: 潜递消息设誓吁恩无实济，若敢作不靖则一举殄灭，以全盛之势慑服群蛮
- id: guji-弘历-endeavor-2
  title_zh: 慎刑察吏整饬官方
  summary: 驳斥督抚苛劾，平反平遥知县，饬求实迹以培励群材
  phases:
  - key: breakthrough
    name: 体察谳牍得实
    labels:
      zh: 慎刑恤民
    start_date: 1766-08-01
    highlight_event_id: guji-弘历-event-lidaixin
  - key: closure
    name: 通谕督抚爱惜人才
    labels:
      zh: 惩劝得平
    start_date: 1766-08-01
    highlight_event_id: guji-弘历-event-lidaixin
  decisions:
  - date: 1766-08-01
    title_zh: 发还彰宝参案昭雪李玳馨
    rationale: 比验伤痕讯得实情，删减谎供非妄改初供，不可以微眚斥能吏
  - date: 1766-07-12
    title_zh: 饬行刘天成空言荐举之奏
    rationale: 贤能本一，治人重于治法，摭拾空言无补实政，当求实迹课吏
