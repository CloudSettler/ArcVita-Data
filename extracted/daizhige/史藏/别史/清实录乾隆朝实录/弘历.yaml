  dilemmas:
  - 耗羡本非正供催征过急则病民宽免过滥则吏胥侵蚀如何两全
  - 独子斗殴留养施仁与驯其桀骜维系法纪如何兼顾
  - 藏地兄弟构衅添兵则动疑撤兵则失援轻发有损国体如何慎重
  lesson: 宽仁施政必以严核吏治为表里方能使实惠及民
  summary_first_person: 朕以乾隆十五年正月受朝祈谷念直省耗羡未完民力拮据故加恩蠲免又定独子留养秋审矜减之例于藏事则戒轻发而务持重惟愿仁政与国体并全
