    title_zh: 謁泰陵躬祭奠哀
    rationale: 以孝治天下故未至碑亭即降舆步入隆恩门以示哀恸之诚
  - date: 1738-03-12
    title_zh: 举行经筵大典并宣御论
    rationale: 欲以德礼为本兼行政刑故讲论语尚书而明纯王之心以昭万世
- id: guji-弘历-endeavor-2
  title_zh: 旗民两便与畿辅通商惠民
  summary: 辨旗圈官地与自置民地准民照估承买复免漕税谷息以济歉岁民生
  phases:
  - key: brewing
    name: 清查八旗入官田房酝酿给还
    labels:
      zh:
      - 清查
      - 给还
    start_date: 1738-03-04
    highlight_event_id: guji-弘历-event-qimin
  - key: breakthrough
    name: 准旗买民地入官者照估变卖生息
    labels:
      zh:
