  lesson: 慎修防专责成以安漕运民生加恩怀柔以固中外一统
  summary_first_person: 朕临御四十八年夙夜以河漕民生为念漕弊牢不可破则严定处分以专责成河工若实用实销则加恩准销秋汛平稳则欣慰加勉外藩效顺则优眷嘉奖
