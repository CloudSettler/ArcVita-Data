  decisions:
  - date: 1753-09-09
    title_zh: 亲宣御论明察人之道
    rationale: 圣学在自尽其力而不存成见，故丁宁知人则哲之难。
  - date: 1753-09-09
    title_zh: 以体仁释体元长民
    rationale: 仁贯四端元包四德，教养兼筹方为长民之本。
- id: guji-弘历-endeavor-2
  title_zh: 高宝水灾截漕赈济
  summary: 高邮宝应湖河异涨堤坝漫溢，命截留漕粮四十万石并留部拨银以备赈粜。
