endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 两路合剿金川直捣勒乌围
  summary: 乾隆四十年五月以阿桂明亮分路进压，攻克下巴木通基木斯丹当噶茹寨等地，部署临河搭桥会合夹攻勒乌围并直捣噶喇依，兼施招降与防诈
  phases:
  - key: brewing
    name: 分路进压连克碉卡
    labels:
      zh: 蓄势进压
    start_date: 1775-06-28
    highlight_event_id: guji-弘历-event-qianbing
  - key: breakthrough
    name: 临河截出麦田尽得
    labels:
      zh: 突破临河
    start_date: 1775-07-03
    highlight_event_id: guji-弘历-event-zhaoxiang
  - key: climax
    name: 会合夹攻勒乌围
    labels:
      zh: 高潮合围
    start_date: 1775-07-04
    highlight_event_id: guji-弘历-event-zhaoxiang
  - key: closure
    name: 网开一面慎防诈降
    labels:
      zh: 收束善后
    start_date: 1775-07-04
    highlight_event_id: guji-弘历-event-zhaoxiang
  decisions:
  - date: 1775-07-03
    title_zh: 穷蹙乞命仍从宽免死
    rationale: 体上天好生，番众为酋舍命亦颇足取，故网开一面以散贼党，若怙终不悛则玉石俱焚
  - date: 1775-07-04
    title_zh: 逆酋兄弟虽降断不可恕惟诱擒之
    rationale: 贼番狡诈恐假装投降暗藏叵测，将军不可轻出营相见，当受降如受敌，慎之又慎以蒇扫穴擒渠之功
- id: guji-弘历-endeavor-2
  title_zh: 整饬凤阳关亏缺与筹固高堰湖堤
  summary: 乾隆四十年五月因凤阳关自三十七年后年亏一年，命密查狄咏箎徵多报少情弊，同时筹度洪湖高堰加高培筑与仁义礼三坝分洩，以卫淮扬民生
  phases:
  - key: brewing
    name: 凤阳关年亏发觉
    labels:
      zh: 发觉亏缺
    start_date: 1775-06-23
    highlight_event_id: guji-弘历-event-fengyang
  - key: breakthrough
    name: 密派大员查访狄咏箎
    labels:
      zh: 突破查访
    start_date: 1775-06-23
    highlight_event_id: guji-弘历-event-fengyang
  - key: climax
    name: 筹议高堰加高与减洩
    labels:
      zh: 高潮筹河
    start_date: 1775-07-01
    highlight_event_id: guji-弘历-event-gaoyan
  - key: closure
    name: 酌定智信封土仁义礼分洩
    labels:
      zh: 收束定议
    start_date: 1775-07-01
    highlight_event_id: guji-弘历-event-gaoyan
  decisions:
  - date: 1775-06-23
    title_zh: 密行查访不稍徇饰
    rationale: 狄咏箎颟顸而滑，署任三十八日短少七千余两难信水浅之说，恐有徵多报少捏称缺短，须防渐杜弊
  - date: 1775-07-01
    title_zh: 不惜百余万筹保危堤
    rationale: 高堰为淮扬保障，若湖水过长风浪汕掣则一线危堤难当，虽费巨帑亦当加高疏浚以永资巩固
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 康熙五十年生于雍亲王府
  description: 康熙五十年八月十三日生，是为弘历，后即皇帝位，年号乾隆
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 嘉庆四年崩于养心殿
  description: 太上皇帝崩，寿八十有九，谥纯皇帝，庙号高宗
- id: guji-弘历-event-fengyang
  date: 1775-06-23
  year_of: 1775
  title_zh: 谕查凤阳关亏短密访狄咏箎
  description: 乾隆四十年五月初一日谕军机大臣，凤阳关连年短收，狄咏箎署任三十八日短少七千余两，命高晋密派诚干大员查访徵多报少情弊
- id: guji-弘历-event-qianbing
  date: 1775-06-29
  year_of: 1775
  title_zh: 加赏贵州赴川兵丁家属半月钱粮
  description: 乾隆四十年五月初七日轸念黔兵征剿金川得力，加恩赏给家属半月钱粮，并谕窦瑸韦谦恒慎守苗疆不动声色
- id: guji-弘历-event-zhaoxiang
  date: 1775-07-03
  year_of: 1775
  title_zh: 网开一面预谕降者免死并防诈降
  description: 乾隆四十年五月十一日谕将军等进兵时豫宣畏罪出降者免死，次日再谕逆酋兄弟虽降不可恕，须诱擒之，受降如受敌，慎防鬼蜮伎俩
- id: guji-弘历-event-gaoyan
  date: 1775-07-01
  year_of: 1775
  title_zh: 筹度洪湖高堰加筑与宣洩
  description: 乾隆四十年五月初九日谕高晋吴嗣爵筹度高堰堤工，或酌定减洩水志，或加高尺余，虽费百余万亦所不惜，期永无后患
