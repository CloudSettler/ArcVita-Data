  - key: closure
    name: 修葺房屋宁居
    labels:
      zh: 加赏缮葺
    start_date: 1746-09-24
    highlight_event_id: guji-弘历-event-1746-jianghuai-relief
  decisions:
  - date: 1746-09-18
    title_zh: 命大员董率赈恤山东被水州县
    rationale: 沿河被水非大员稽查不能妥协须防灾民失所
  - date: 1746-09-19
    title_zh: 借口粮麦本缓徵被淹地亩钱粮
    rationale: 歉薄之余晚禾失收须助播种秋麦纾解民力
  - date: 1746-09-24
    title_zh: 照七年例加赏上下江坍塌房屋
    rationale: 积歉之余再罹水患定例之外加赏方得及时宁居
- id: guji-弘历-endeavor-2
  title_zh: 权衡守制留任申饬科道
  summary_zh: 御史周礼请令户部侍郎李元亮开缺守制皇帝以得人为重留任李元亮严饬周礼假公济私並晓谕科道
