- id: guji-弘历-event-1742-sijiao
  date: 1742-06-21
  year_of: 1742
  title_zh: 議定大祀陳設齋戒之制
  description_zh: 大學士議奏圜丘祈穀方澤俎豆豫陳贊引恭導皇上恭舉進俎罷廚役舁進及官員拱捧香爐燈幾親詣則別殿齋戒二日齋宮一日得旨依議
- id: guji-弘历-event-1742-pingcai
  date: 1742-06-25
  year_of: 1742
  title_zh: 訓飭平糶多減官價申明常平之法
  description_zh: 諭以荒歲平糶非減價一錢可濟貧困令確奏應減若干並諭常平倉存七糶三乃無事時出陳易新之法米少價貴則當多糶以濟民食
- id: guji-弘历-event-1742-yuji
  date: 1742-07-04
  year_of: 1742
  title_zh: 定雩祭仍行圜丘不建專壇
  description_zh: 大學士會禮部考歷代雩壇狹卑無殿奉神牌奏請仍在圜丘舉行雩祭不更建崇雩壇得旨從之並定內廷丹陛樂章名為雍平
- id: guji-弘历-event-1742-dili
  date: 1742-07-06
  year_of: 1742
  title_zh: 訓督撫董率州縣經畫地利
  description_zh: 引周禮九職任萬民諭督撫因地制宜保護已墾疏闢荒墟積水禁竭澤焚林侵盜俾地無遺利民無餘力以惠養斯民
