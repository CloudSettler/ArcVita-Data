  - date: 1755-05-13
    title_zh: 停止哈密至乌噜木齐运粮
    rationale: 成功甚速大兵自带口粮足用若急遽运粮反使兵丁不加撙节摇动众心且断不能如期运到故以收取达瓦齐牲畜及茶叶换易为用
  - date: 1755-05-17
    title_zh: 令齐木库尔同往军前效力
    rationale: 大兵深入无阻屯田易办无须贝勒留守弹压故允其请同阿睦尔撒纳进兵屯田交台吉克伯克协同办理
