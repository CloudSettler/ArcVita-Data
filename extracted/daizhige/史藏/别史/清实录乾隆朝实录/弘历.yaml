  summary_first_person: 朕御极四十六年遇甘肃苏四十三煽乱占河州逼兰州朕遣阿桂和珅督办调陕甘官兵会剿奖王廷赞固守之功究勒尔谨贻误之咎胁从分别宽贷必尽绝根株以靖地方
