  dilemmas:
  - 万寿庆典惠泽普被与京师米价腾贵需平粜安民之两难
  - 各省偏灾当从严核灾加赈与防地方讳饰粉饰之两难
  - 功过大臣当念旧宽贷与整饬吏治严明赏罚之两难
  lesson: 遇庆典则推恩施惠遇偏灾则亲勘速赈遇吏弊则宽严并济方能安黎庶而固邦本
  summary_first_person: 朕年届八旬普天同庆召见藩部使臣赐宴推恩又发京仓粟米平粜以裕民食逢直隶山东安徽江苏水发即命大吏履勘加赈毋使一夫失所于废弛吏治则严参治罪以儆效尤
