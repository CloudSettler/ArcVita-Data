  title_zh: 平定准噶尔与处置阿睦尔撒纳
  summary_zh: 乾隆二十年秋围木兰期间密筹擒治阿睦尔撒纳党羽，安抚其游牧，议定准部爵秩俸禄与八旗之制
  phases:
