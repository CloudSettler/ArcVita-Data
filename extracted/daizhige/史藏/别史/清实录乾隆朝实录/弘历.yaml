  dilemmas:
  - 追远谒陵隆礼与轸念民力之间的权衡
  - 限田均贫之名与滋扰无补之实如何抉择
  - 灾年恤刑弭灾与防诱民犯法之间如何把握
  lesson: 名虽正而难行之事须审实效，不以虚文扰民，方能保全治体
  summary_first_person: 朕以眇躬缵承大统，秋奉皇太后东巡谒陵，瞻仰桥山，锡宴盛京，颁恩诏以覃敷德泽，驳限田以免滋扰，饬恤刑以防纵弛，惟愿恪遵祖烈，养育兵民，永保淳朴之风
