endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 饬禁贡献崇俭黜华
  summary_zh: 因各省督抚及在京王公大臣内廷翰林借庆节购觅古玩珠绣象牙以充贡，习为夸多斗靡，恐累吏治而失淳朴，守皇考家法，饬禁土贡外一切进献
  phases:
  - key: brewing
    name: 任土作贡踵事增华
    labels:
      zh:
      - 观察积弊
    start_date: 1776-11-11
    highlight_event_id: guji-弘历-event-xiangmiao
  - key: breakthrough
    name: 洞悉市侩居奇逢迎之害
    labels:
      zh:
      - 明辨吏治
    start_date: 1776-11-13
    highlight_event_id: guji-弘历-event-jingong
  - key: climax
    name: 通谕饬禁土贡外进献
    labels:
      zh:
      - 颁旨禁绝
    start_date: 1776-11-13
    highlight_event_id: guji-弘历-event-jingong
  - key: closure
    name: 守家法还淳朴以示殿最
    labels:
      zh:
      - 垂训封疆
    start_date: 1776-11-13
    highlight_event_id: guji-弘历-event-jingong
  decisions:
  - date: 1776-11-13
    title_zh: 饬禁督抚除土贡外毋得复献
    rationale: 古玩饥不可食寒不可衣，各省购觅则市侩高价居奇，属员代办以多报少，逢迎结纳大有关吏治，故以奉职程殿最而不以进贡衡短长
  - date: 1776-11-13
    title_zh: 在京王公大臣翰林一体遵禁
    rationale: 京官踵呈庆祝贡品，相率效尤，徒增繁冗可憎，宫中服御从不用珠绣巧饰，故并禁象牙织簟珠绣之类以还淳朴
- id: guji-弘历-endeavor-2
  title_zh: 厘定宗室袭爵永制
  summary_zh: 鉴宋史宗室再传即同齐庶，念恩封诸王若无等差则亿万年后愈积愈多而至冗滥，定亲王至镇国公、郡王至辅国公而止、公爵世袭罔替，录示阿哥书房以昭久远
  phases:
  - key: brewing
    name: 披阅宋史宗室世系表
    labels:
      zh:
      - 稽古鉴今
    start_date: 1776-11-14
    highlight_event_id: guji-弘历-event-xijue
  - key: breakthrough
    name: 酌定军功恩封之别
    labels:
      zh:
      - 区分等差
    start_date: 1776-11-14
    highlight_event_id: guji-弘历-event-xijue
  - key: climax
    name: 降旨定递降世袭之限
    labels:
      zh:
      - 立制定制
    start_date: 1776-11-14
    highlight_event_id: guji-弘历-event-xijue
  - key: closure
    name: 录示书房晓谕宗室
    labels:
      zh:
      - 垂裕后昆
    start_date: 1776-11-14
    highlight_event_id: guji-弘历-event-xijue
  decisions:
  - date: 1776-11-14
    title_zh: 定亲王郡王递降以公爵为限
    rationale: 若不定等差则王爵愈积愈多而冗滥，亲王以次递降至镇国公而止，郡王至辅国公而止，其公爵均世袭罔替，厚于宋制而得久远之道
  - date: 1776-11-14
    title_zh: 以身作则不滥封皇子
    rationale: 皇长子皇五子皆因病剧始封亲王，皇四子皇六子以出嗣得袭郡王，余未特封，非沽名薄待已子，正因理当然以示子孙遵守勿替
events:
- id: guji-弘历-event-birth
  type: birth
  title_zh: 弘历诞生
  date: 1711-09-25
  year_of: 1711
  place_zh: 雍亲王府
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即帝位，年号乾隆
- id: guji-弘历-event-death
  type: death
  title_zh: 弘历驾崩
  date: 1799-02-07
  year_of: 1799
  place_zh: 紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩，享年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
- id: guji-弘历-event-xiangmiao
  type: career
  title_zh: 冬享太庙颁时宪书
  date: 1776-11-11
  year_of: 1776
  place_zh: 太庙
  description_zh: 乾隆四十一年十月己亥朔，亲诣太庙行礼，遣官祭诸陵，颁乾隆四十二年时宪书
- id: guji-弘历-event-jingong
  type: career
  title_zh: 饬禁各省及京官贡献
  date: 1776-11-13
  year_of: 1776
  place_zh: 紫禁城
  description_zh: 以督抚购觅古玩充贡，京官踵以为常，市侩居奇，吏治攸关，谕除土贡外毋得复献，在京王公头品大臣内廷翰林一体遵照，并通谕知之
- id: guji-弘历-event-xijue
  type: career
  title_zh: 酌定诸王袭爵世袭之制
  date: 1776-11-14
  year_of: 1776
  place_zh: 紫禁城
  description_zh: 谕军功封晋者世袭罔替，恩封者以次递降，亲王至镇国公止，郡王至辅国公止，公爵世袭罔替，录示阿哥书房并谕宗室王公
- id: guji-弘历-event-pingfan
  type: career
  title_zh: 平反英山诬枉改发伊犁
  date: 1776-11-21
  year_of: 1776
  place_zh: 懋勤殿
  description_zh: 审拟已革英山知县倪存谟诬拟尸子杜如意凌迟，杖徒不足蔽辜，改发伊犁永远不准回籍，擢直隶州倪廷模送部引见，并定知府直隶州平反生死大案送部引见为例
