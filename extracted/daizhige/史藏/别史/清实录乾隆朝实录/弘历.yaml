      - 关税
    start_date: 1776-07-26
    highlight_event_id: guji-弘历-event-zhenxu
  - key: closure
    name: 相度移建修葺城垣
    labels:
      zh:
      - 营建
      - 久远
    start_date: 1776-08-01
    highlight_event_id: guji-弘历-event-zhenxu
  decisions:
  - date: 1776-07-25
    title_zh: 谕文绶亲往打箭炉清理抚恤
    rationale: 炉城存贮钱粮军火关税紧要系通藏冲途当查明抚恤捞取湿米搭放速修仓库营房并择高地移建以避顶冲
  - date: 1776-07-27
    title_zh: 谕勒尔谨实力赈济毋存讳饰
    rationale: 七月初得雨补种晚禾边地霜早难成有名无实当董率各属妥为抚绥赈恤务使灾黎均沾实惠
  - date: 1776-08-01
    title_zh: 谕敦福陈辉祖确勘湘鄂水灾
    rationale: 耒阳永兴水涌入城郧西蛟水冲房毙命当详细确勘损伤人口田亩仓谷分别抚恤勿致失所
events:
