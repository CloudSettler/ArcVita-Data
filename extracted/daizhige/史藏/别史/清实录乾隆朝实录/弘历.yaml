    title_zh: 令策楞刘统勋就近确查
    rationale: 较乾隆七年孰轻孰重须目击亲勘，防讳饰亦防张大中饱。
  - date: 1753-09-14
    title_zh: 截留江苏漕粮四十万石
    rationale: 灾民荡析离居艰于糊口，预贮漕米部银方能无滥无遗。
- id: guji-弘历-endeavor-3
  title_zh: 邪教案宽严得中完结
  summary: 邢台山西冯进京王会邪教案，命杖毙首恶胁从分别枷责，不穷治株连。
  phases:
