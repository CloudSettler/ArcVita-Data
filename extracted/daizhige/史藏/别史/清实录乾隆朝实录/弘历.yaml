  summary_first_person: 朕以乾隆九年八月亲祭社稷斋居听政见顺天乡试头场搜出怀挟二十一人丧心至此痛自悛改屡谕不悛故严交父师监试并令各省照京师例严搜具奏又念台民远戍及天津河间徽宁水旱叠见故加惠垦赋拨米发帑务使小民无失所此皆朕整饬大典加惠边方之本心也
