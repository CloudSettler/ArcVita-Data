  - date: 1753-04-05
    title_zh: 亲诣先农坛躬耕三推复加一推
    rationale: 以天子躬耕示天下重农劝本赏赉耆老农夫以成礼
  - date: 1753-04-06
    title_zh: 增马甲一千匀饷广恩
    rationale: 八旗生齿日繁用度拮据于月饷匀出五钱以增缺再赏缺使十人皆沾恩而不顿减旧饷
events:
- id: guji-弘历-event-birth
  title_zh: 诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生为雍亲王第四子即后之高宗纯皇帝
- id: guji-弘历-event-death
  title_zh: 龙御归天于养心殿
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日崩年八十有九谥曰纯庙号高宗
- id: guji-弘历-event-435-1
  title_zh: 耕耤诣先农坛躬耕
  date: 1753-04-05
  year_of: 1753
  description: 乙亥上耕耤诣先农坛行礼躬耕三推复加一推命王公九卿各五推九推率农夫终亩赏赉如例
- id: guji-弘历-event-435-2
  title_zh: 谕整顿参革发审稽迟
  date: 1753-04-01
  year_of: 1753
  description: 谕督抚参劾属员请旨革审多稽迟悬搁甚至二三年不结交吏部严立限期不得延玩致滋弊端
- id: guji-弘历-event-435-3
  title_zh: 加恩增马甲养育兵
  date: 1753-04-06
  year_of: 1753
  description: 谕为旗人筹生计加恩增马甲一千名归健锐营养育兵月饷匀出以广缺命军机大臣会八旗核议分缺补放
- id: guji-弘历-event-435-4
  title_zh: 钦定参案新限为两月四月
  date: 1753-04-10
  year_of: 1753
  description: 因吏部议钦部事件限四月兼管二省限六月得旨六月者改为四月四月者改为两月逾限不奏展者不准扣除
