  title_zh: 恭奉皇太后巡幸津淀阅河
  summary: 乾隆三十七年九月回銮后允周元理所请，定明春奉皇太后自京经涿州至赵北口登舟巡幸津淀，专为民生利病，严戒行宫点缀糜费
