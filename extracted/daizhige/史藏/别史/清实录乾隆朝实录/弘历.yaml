    rationale: 达赖虔修庙宇恭祝万寿阐扬梵教福佑群生宜加殊礼永镇法门以广善缘
  - date: 1783-08-15
    title_zh: 谕查豫鲁得雨秋禾情形并赈贷湖北被水州县卫
    rationale: 辉县等四县及曹兖雨泽短少不可讳饰湖北八州县三卫被水即赈贷缓徵以安民生
events:
- id: guji-弘历-event-birth
