    title_zh: 再传谕闽省督抚督率属员实力抚循被水灾黎
    rationale: 虽系一隅偏灾必使灾黎各安生理以副廑念民依之意
  - date: 1749-07-19
    title_zh: 定满洲与满洲殴杀秋审俱入情实不再概为缓决
    rationale: 立法与其狎而易犯不若使知所畏而不敢蹈以全好生至意
