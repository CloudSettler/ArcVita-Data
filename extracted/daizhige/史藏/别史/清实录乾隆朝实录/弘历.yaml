  - title_zh: 宽严并用之衡
    description: 对台湾地方官姑息养奸必严惩以儆效尤与对奋勉知过者仍加恩议叙之间权衡宽严
  - title_zh: 加赈恤民与国储节制之衡
    description: 江苏山东河南安徽连年水旱青黄不接屡下加赈借种与仓储调拨之间兼顾民食与国用
  lesson: 治官当严而恤民当厚，始勤终怠则积弊难返，故整饬吏治与加恩灾黎并行不悖
  summary_first_person: 朕弘历以藩邸嗣承大统，在位励精图治，勤于郊庙朝仪，严于吏治废弛，怜于水旱灾黎，此卷所见正月加赈数省并督办台湾械斗，皆朕宽严相济轸念民依之实心也
