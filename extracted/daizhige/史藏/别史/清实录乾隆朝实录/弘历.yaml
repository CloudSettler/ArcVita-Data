  decisions:
  - date: 1761-02-19
    title_zh: 宽免巴鲁克巴图尔拏送治罪申饬守界
    rationale: 以天下共主念其恭顺改过姑予矜全若再越境盗窃必发兵问罪不可妄图侥幸
  - date: 1761-02-18
    title_zh: 以舒赫德代海明办喀什噶尔事务
    rationale: 海明姑息不能奋发有为喀什噶尔通安集延接布噜特情形紧要必得精明果断之人方能妥协
