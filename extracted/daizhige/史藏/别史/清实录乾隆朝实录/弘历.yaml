      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清乾隆
  reign_ref: 乾隆二十九年甲申春正月
  archetype: 勤政恤民的守成大君
  dilemmas:
  - 春荒青黄不接时加恩展赈与节制帑费的权衡
  - 运河挑浚省费便漕与彻底疏浚的抉择
  - 西域初定后抚绥武功与严明军纪的取舍
  lesson: 敬天法祖勤政爱民方能保承平久安
  summary_first_person: 朕于乾隆二十九年正月受朝祈谷奉养皇太后，加恩山东甘肃直隶展赈缓征，会同兆惠高晋等勘办荆山桥水利，停挑运河以省民力，整饬伊犁叶尔羌军纪，务使灾黎得所漕运通畅边陲肃清。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70702.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 春正加恩三省展赈缓征
  summary_zh: 念及山东水淹甘肃偏灾直隶歉薄，于春月例赈将停之际加恩展赈缓征以接青黄。
  phases:
  - key: brewing
    name: 山东湖河并涨奏报
    labels:
      zh: 恤民展赈
    start_date: 1764-02-12
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 加恩济宁等七州县卫展赈
    labels:
      zh: 有加无已
    start_date: 1764-02-12
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 加恩甘肃皋兰等属展赈
    labels:
      zh: 爱养黎元
    start_date: 1764-02-12
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 缓征直隶十三州县钱粮
    labels:
      zh: 纾解民力
    start_date: 1764-02-15
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1764-02-12
    title_zh: 山东济宁等七州县卫展赈一月
    rationale: 东作方兴麦秋尚远，例赈将停恐民食拮据，故无论极次贫民一体展赈。
  - date: 1764-02-12
    title_zh: 甘肃永昌等三县展赈两月余十九厅州县展赈一月
    rationale: 该省土瘠民贫春和课农之时，若饔飧不继无以尽力田畴，故分别展赈资接济。
  - date: 1764-02-15
    title_zh: 直隶通州等十三州县缓征二十八年钱粮至秋成
    rationale: 去年蝗蝻秋收歉薄，虽勘不成灾，遽令新旧并输民食不充，故缓至秋成后征收。
- id: guji-弘历-endeavor-2
  title_zh: 勘办荆山桥罢挑运河整饬边纪
  summary_zh: 命兆惠高晋叶存仁崔应阶会勘荆山桥掣消湖水，罢挑运河以省费便漕，并传谕凉州庄浪移驻整饬西域军纪。
  phases:
  - key: brewing
    name: 德成请挑运河崔应阶持异
    labels:
      zh: 河漕相度
    start_date: 1764-02-14
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 叶存仁崔应阶议罢挑浚
    labels:
      zh: 省费便漕
    start_date: 1764-02-15
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 会同兆惠高晋勘办荆山桥
    labels:
      zh: 掣消湖水
    start_date: 1764-02-23
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 谕查叶尔羌掠妇严饬军纪
    labels:
      zh: 边陲肃清
    start_date: 1764-02-23
    highlight_event_id: guji-弘历-event-4
  decisions:
  - date: 1764-02-14
    title_zh: 命兆惠顺便相度运河挑浚事宜
    rationale: 德成新莅漕差亟筹经理，崔应阶在东年久见闻更稔，故令会同妥议具奏。
  - date: 1764-02-15
    title_zh: 肯定叶存仁等罢挑运河之议
    rationale: 挑土数百万方费重且误漕运，荆山桥挑深后湖水自消，故无庸加挑运河。
  - date: 1764-02-23
    title_zh: 重治西域掠获妇女严饬各城
    rationale: 全部平定后驻兵不可蹈前辙，一经察出即重治其罪，以正军纪恤回众。
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  summary_zh: 康熙五十年八月十三日生，后即位为高宗乾隆皇帝。
- id: guji-弘历-event-death
  title_zh: 太上皇崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  summary_zh: 嘉庆四年正月初三日崩，年八十有九，谥纯皇帝。
- id: guji-弘历-event-1
  title_zh: 正月加恩展赈缓征
  date: 1764-02-12
  year_of: 1764
  place_zh: 北京紫禁城
  summary_zh: 以春月青黄不接，加恩山东七州县卫甘肃各厅州县展赈，直隶十三州县缓征，董率有司实心经理。
- id: guji-弘历-event-2
  title_zh: 南郊祈谷奉亲侍宴
  date: 1764-02-19
  year_of: 1764
  place_zh: 北京南郊斋宫天坛
  summary_zh: 斋戒三日亲诣祈谷于上帝，奉皇太后居长春仙馆同乐园侍膳，御太和殿受朝赐宴。
- id: guji-弘历-event-3
  title_zh: 谕勘荆山桥罢挑运河
  date: 1764-02-15
  year_of: 1764
  place_zh: 北京圆明园
  summary_zh: 览叶存仁崔应阶奏，以挑运河费巨误漕，命兆惠高晋会同勘办荆山桥挑深掣消湖水济鱼洼地。
- id: guji-弘历-event-4
  title_zh: 整饬西域军纪查办掠妇
  date: 1764-02-23
  year_of: 1764
  place_zh: 叶尔羌伊犁
  summary_zh: 据额尔景额奏查出索伦兵额伊勒木保掠回妇事，拟绞监候秋审入情实，解送妇女赏厄鲁特为妻，严饬各城嗣后重治。
