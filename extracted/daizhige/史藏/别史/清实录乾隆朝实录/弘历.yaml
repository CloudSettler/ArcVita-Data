  decisions:
  - date: 1737-03-04
    title_zh: 農時護民不擾南畝
    rationale: 送梓宮所過州縣恐妨農作，禁先期派民灑道清塵，禁蹂躪麥苗，以惠愛農民
  - date: 1737-03-14
    title_zh: 親詣奠獻不從間日之請
    rationale: 王大臣請間日一往以節哀勞，朕以心安為重，仍每日親詣梓宮前奠獻，盡哀慕之忱
- id: guji-弘历-endeavor-2
  title_zh: 優恤商民釐定旗地租賦
  summary: 念商力竭蹷命遠年欠課分年帶徵，又命直督曉諭釐定入官旗地租額，以昭惠養
  phases:
