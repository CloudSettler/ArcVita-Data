      - 叩拜
    start_date: 1793-08-13
    highlight_event_id: guji-弘历-event-british
  - key: closure
    name: 热河瞻觐叩祝
    labels:
      zh:
      - 瞻觐
      - 叩祝
    start_date: 1793-08-14
    highlight_event_id: guji-弘历-event-british
  decisions:
  - date: 1793-08-13
    title_zh: 谕天文地理大表等需时七件留京安设
    rationale: 安装需一月，运赴山庄劳费且过万寿之期，不如就近留京呈览
  - date: 1793-08-13
    title_zh: 谕教使臣遵行三跪九叩礼
    rationale: 藩封进贡觐光皆行此礼，松解扎缚暂行亦便，不可拘泥国俗贻笑
