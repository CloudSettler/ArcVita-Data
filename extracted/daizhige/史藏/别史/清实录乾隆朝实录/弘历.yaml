    highlight_event_id: guji-弘历-event-wangsui-1781
  - key: breakthrough
    name: 革职拿问查抄赃产二十余万严讯来源
    labels:
      zh: 追赃根究
    start_date: 1781-04-01
    highlight_event_id: guji-弘历-event-wangsui-1781
  - key: climax
    name: 定二千二百丈条块石塘速兴工老盐仓仍旧
    labels:
      zh: 海塘工程
    start_date: 1781-04-01
    highlight_event_id: guji-弘历-event-wangsui-1781
  - key: closure
    name: 追夺卞三元官秩谥法诰敕仆毁碑文
    labels:
      zh: 彰瘅肃纪
    start_date: 1781-03-25
    highlight_event_id: guji-弘历-event-wangsui-1781
  decisions:
  - date: 1781-03-24
    title_zh: 革王燧职拿问令阿桂严密访查交通
    rationale: 道员养廉不过数千而积财二十余万必系婪索侵蚀须彻底根究兼察王亶望李质颖通同与否
  - date: 1781-04-01
    title_zh: 准条块石塘法上紧兴工
    rationale: 鱼鳞塘费大工缓条块功省效速仿嵇曾筠旧法即可垂久老盐仓沙涩难桩只宜存旧
