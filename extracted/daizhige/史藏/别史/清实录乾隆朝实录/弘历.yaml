  decisions:
  - date: 1754-09-06
    title_zh: 命建贤王祠合祀开国诸王
    rationale: 盛京为龙兴重地，诸王功烈懋著，宜崇祀以酬旧勋而示来许
  - date: 1754-09-06
    title_zh: 定春秋致祭移碑亭于正中
    rationale: 永昭宗功元祀之钜典，使典礼可久，观瞻有肃
- id: guji-弘历-endeavor-2
  title_zh: 经营准部收抚乌梁海
  goal_zh: 乘机进取，安置降众，备来岁大举
  phases:
  - key: brewing
    name: 乌梁海驱逐后复扰游牧
    labels:
