    rationale: 贼众无能不值久驻，久则唐古忒供应乏市价昂，须速剿收复即彻
  - date: 1788-11-03
    title_zh: 饬巴忠晓谕给价勿累番众
    rationale: 办粮照数给价余剩给还，使知爱护体恤，勿存苟安轻和之心
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生于雍亲王府，是为后之乾隆皇帝
- id: guji-弘历-event-death
  title_zh: 弘历驾崩
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩于养心殿，终年八十有九
- id: guji-弘历-event-jingzhou
  title_zh: 谕阿桂详报荆州修建安辑
  date: 1788-10-28
  year_of: 1788
  description_zh: 庚寅谕军机，诘阿桂未报兵民房屋修建舆情，命据实奏闻，并查熊泗年龄饷鞘及后藏军情
- id: guji-弘历-event-annam
  title_zh: 命孙士毅出关进剿安南
  date: 1788-10-29
  year_of: 1788
  description_zh: 辛卯谕，以黎维祇聚义于谅山，命孙士毅亲督出关直抵黎城督饬擒渠，一劳永逸
- id: guji-弘历-event-zang
  title_zh: 谕鄂辉成德速剿巴勒布
  date: 1788-11-02
  year_of: 1788
  description_zh: 乙未谕，贼退萨喀不足信，命大兵速进痛剿收复聂拉木，再设誓定界，续调驻炉之兵概彻
