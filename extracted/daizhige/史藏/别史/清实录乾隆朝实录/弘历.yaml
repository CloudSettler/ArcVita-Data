  - date: 1753-09-11
    title_zh: 定王会为罪魁立毙
    rationale: 散给合同勾引多在顺德彰德，首恶不除不足以儆乡愚。
  - date: 1753-09-14
    title_zh: 被诱乡愚不再穷治
    rationale: 人心风俗所系应办不姑息，不必办理亦不忍寻枝数叶辗转株连。
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生于雍亲王府
  description: 康熙五十年八月十三日生，后即位为高宗纯皇帝。
- id: guji-弘历-event-jingyan
  date: 1753-09-09
  year_of: 1753
  title_zh: 御文华殿行仲秋经筵礼
  description: 甲申听讲论语视其所以章与易经体仁长人句，宣御论赐讲官侍班宴。
- id: guji-弘历-event-xiejiao
  date: 1753-09-11
  year_of: 1753
  title_zh: 谕处冯进京王会邪教案
  description: 丙戌谕方观承等将王会杖毙示众，现获各犯分别杖责枷号，未获者不必穷治。
- id: guji-弘历-event-zhenji
  date: 1753-09-14
  year_of: 1753
  title_zh: 截漕四十万石赈高宝水灾
  description: 己丑以淮扬高宝被水，命截留江苏漕粮运贮灾地，多留户部秋拨银以备赈粜。
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 弘历崩于养心殿
  description: 嘉庆四年正月初三日崩，年八十九，谥纯皇帝。
