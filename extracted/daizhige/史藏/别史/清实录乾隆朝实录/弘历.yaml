  decisions:
  - date: 1755-09-08
    title_zh: 谕定准部王公扎萨克一体给俸并分立八旗
    rationale: 以内扎萨克之制收其心，使授官有秩，养赡有资，不致复乱
  - date: 1755-09-10
    title_zh: 密谕哈达哈阿玉锡擒乌巴什等党恶十人余众不问
    rationale: 罪止渠魁以安胁从，周密慎密以防泄漏，抚绥慰谕以定游牧
  - date: 1755-09-12
    title_zh: 谕以官茶四万封赈给极贫并劝富相赈勤耕牧禁盗窃
    rationale: 准部久乱困穷，若不加筹画必至阽危，故恩养与法禁并行
- id: guji-弘历-endeavor-2
  title_zh: 秋狝木兰并筹明岁南巡
  summary_zh: 奉皇太后幸木兰行围，于热河筵宴外藩之际召尹继善面商南巡河务海塘事宜
