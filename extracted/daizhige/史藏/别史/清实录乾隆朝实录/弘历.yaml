    highlight_event_id: guji-弘历-event-meiliben-1
  - key: climax
    name: 密查原籍赀财严审定拟抵偿
    labels:
      zh: 严审定罪
    start_date: 1768-07-16
    highlight_event_id: guji-弘历-event-meiliben-2
  - key: closure
    name: 赶入秋审情实以昭炯戒
    labels:
      zh: 秋审正法
    start_date: 1768-07-16
    highlight_event_id: guji-弘历-event-meiliben-2
  decisions:
  - date: 1768-07-15
    title_zh: 将梅立本革职拏问交鄂宝严审并查封赀财
    rationale: 身任学政不知洁己奉公反勒索凌虐致酿命案，情甚可恶必严惩以肃法纪
  - date: 1768-07-16
    title_zh: 谕令严审定案赶入本年秋审情实并密查原籍赀财
    rationale: 若本身治罪而家属安享余赀何以示儆，须问拟抵偿并尽发平日婪赃以昭炯戒
events:
- id: guji-弘历-event-birth
  title_zh: 诞生于圆明园狮子洲
  date: 1711-09-25
