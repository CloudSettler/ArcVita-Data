    title_zh: 交孙士毅一手承办出关
    rationale: 与其驻境糜费护送，不如建旗出关捣穴，呼应更灵蒇功自速
  - date: 1788-10-29
    title_zh: 趣潘启德土目协同前驱
    rationale: 该国人心尚思黎氏，督臣亲往声势壮盛，更易集事
