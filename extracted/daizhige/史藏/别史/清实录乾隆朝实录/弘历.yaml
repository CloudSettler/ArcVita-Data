  dilemmas:
  - 剿抚之间如何既示天威又体上天好生
  - 整饬亏空如何既彻底清查又防扰累地方
  - 河湖保障如何既求一劳永逸又惜帑费民力
  lesson: 威信并用，宽严得中，方能远慑边陲近安闾阎
  summary_first_person: 朕临御四十年，金川逆竖久抗王师，朕督饬阿桂明亮两路合剿，既期迅扫勒乌围噶喇依，又念番众穷蹙可悯而网开一面，内则清查凤阳关亏短以儆贪滑，外则筹高堰洪湖宣洩以卫淮扬，此皆朕爱民勤政之苦心也
