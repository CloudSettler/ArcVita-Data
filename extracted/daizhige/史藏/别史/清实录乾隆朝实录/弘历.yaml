  title_zh: 处置西藏叛逆并羁縻准噶尔
  description_zh: 因珠尔默特那木扎勒勾通准噶尔私立假号伏诛后追认傅清拉布敦尽忠加恩班第正法叛妻子于藏中并正法失职之董恭又以敕书驳准噶尔赴藏熬茶延喇嘛之请并定肃州贸易成数
