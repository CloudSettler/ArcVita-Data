  dilemmas:
  - 荆州水灾帑赈与核实安辑之衡
  - 安南出关进剿与持重候机之择
  - 藏边速剿速彻与久驻供亿之虑
  lesson: 赈灾必亲勘实报，边事必乘机痛剿以求一劳永逸，不以将就了局贻患
  summary_first_person: 朕于戊申冬十月享太庙御门听政，念荆州水淹兵民荡析，特发帑金命阿桂查勘抚绥修建城堤，又因阮惠让城而嗣孙未安，命孙士毅督兵出关直捣黎城擒渠，更因巴勒布犯藏，饬鄂辉成德速赴后藏剿杀定界，皆务实办速蒇以恤民靖边
  source_urls:
