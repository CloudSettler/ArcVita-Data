    description_zh: 逆案既发须尽法严治以儆顽梗，又须嘉奖急公良民以靖人心
  - title_zh: 任人与责成
    description_zh: 书生督抚不娴军旅则贻误机宜，提督专责征剿又不可推诿缄默，须严明黜陟
  lesson: 力挽官官相护之颓风，严纪纲而安良善，方能澄清吏治绥靖边疆
  summary_first_person: 朕于丙戌二月据熊学鹏奏鄞县吴家山逆犯制旗习拳拒捕杀人，即谕严缉吴尔康石廷扬根究符书嘉奖良民，又以刘藻办理莽匪畏葸乖谬达启缄默自安而革职效力赔补，复以庄有恭徇纵段成功瞻徇举主而置之典刑，皆欲使锢习一清人心知儆
