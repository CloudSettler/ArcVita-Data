events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 出生于圆明园
  description_zh: 康熙五十年八月十三日生为雍亲王第四子后即位年号乾隆
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description_zh: 嘉庆四年正月初三日崩寿八十有九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
- id: guji-弘历-event-shenwu
  date: 1794-04-06
  year_of: 1794
  title_zh: 降旨酌定吉林参务章程豁免夫欠
  description_zh: 军机会同户部议奏福康安所定吉林参务八条加恩豁免夫欠责成将军宝琳副都统秀林妥办
- id: guji-弘历-event-juanmian
  date: 1794-04-14
  year_of: 1794
  title_zh: 蠲免天津府属本年钱粮十分之三
  description_zh: 以巡幸天津降旨经过地方及天津阖府所属本年应徵钱粮蠲免十分之三
- id: guji-弘历-event-humian
  date: 1794-04-15
  year_of: 1794
  title_zh: 豁免直隶经过州县及天津府属缓带积欠
  description_zh: 将大兴宛平等十三州县节年缓带银蠲免十分之四天津府属缓带地粮银十三万余两普行豁免
- id: guji-弘历-event-xunxing
  date: 1794-04-17
  year_of: 1794
  title_zh: 自圆明园启銮巡幸天津
  description_zh: 庚子日启銮当日驻跸黄新庄行宫次日驻跸涿州行宫
- id: guji-弘历-event-haiping
  date: 1794-04-11
  year_of: 1794
  title_zh: 批办海陵炮台把总图诈杀良案
  description_zh: 把总陈耀祥图诈妄拏放枪毙命拟斩立决兵丁蔡胜雄等从重拟斩传谕各督抚提镇严束弁兵
