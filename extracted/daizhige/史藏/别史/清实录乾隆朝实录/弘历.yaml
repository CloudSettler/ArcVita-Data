  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城養心殿
  description: 嘉慶四年正月初三日崩，年八十九，廟號高宗，諡法天隆運至誠先覺體元立極敷文奮武孝慈神聖純皇帝
