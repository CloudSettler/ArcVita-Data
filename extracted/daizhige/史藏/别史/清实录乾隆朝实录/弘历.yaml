  title_zh: 步诣社稷坛祈雨
  date: 1759-06-15
  year_of: 1759
  kind: career
  summary_zh: 京师雨泽愆期斋戒三日戴雨缨冠素服步行至坛御制祝文为民请命并定荐玉之礼载入会典
