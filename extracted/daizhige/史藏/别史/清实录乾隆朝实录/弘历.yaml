    start_date: 1796-02-09
    highlight_event_id: guji-弘历-event-abdication
  - key: closure
    name: 颁诏覃恩中外
    labels:
      zh: 敷泽
    start_date: 1796-02-09
    highlight_event_id: guji-弘历-event-abdication
  decisions:
  - date: 1795-10-15
    title_zh: 明定储位以丙辰为嘉庆元年
    rationale: 践阼初曾默吁周甲传位，不敢仰希皇祖增载，故盛京告祖颁朔定储豫议归政典礼
  - date: 1796-02-09
    title_zh: 亲授宝玺仍亲理军国重务
    rationale: 天生民立君以司牧，授受不敢不兢，康强未至倦勤，故部院各省题奏悉遵前旨亲理以保泰
- id: guji-弘历-endeavor-2
  title_zh: 皇极殿重开千叟宴
  summary: 归政新正初御皇极殿举千叟宴，召亲王大臣官兵耆民及四国贡使赐宴，亲赐高年卮酒，加恩百岁人瑞以教孝教忠
  phases:
  - key: brewing
