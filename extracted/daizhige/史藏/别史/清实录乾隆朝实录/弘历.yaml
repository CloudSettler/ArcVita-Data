person:
  qid: guji-弘历
  name_zh: 弘历
  names:
    zh: 弘历
    en: Hongli
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日生于雍亲王府
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三日崩于养心殿
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清乾隆
  reign_ref: 乾隆三十七年壬辰
  archetype: 励精开拓的守成之君
  dilemmas:
  - 既欲速擒僧格桑靖边徼又虑六七千里外遥制失宜当如何授权温福桂林相机进剿
  - 既欲全复革布什咱内地土司旧地又虑索诺木党恶助逆当止于传檄招抚还是乘胜直捣金川以绝后患
  - 既倚重封疆司道大员又屡发贪墨巨案当如何彻底严究以肃纲纪而不株连迟滞边务
  lesson: 用兵当先发制人恩威并示，吏治当天网恢恢彻底严究，遥制万里惟在授权得人与后路饷道万全
  summary_first_person: 朕弘历承世宗付托，临御三十七年，宵衣旰食以靖边安民为念。小金川僧格桑负恩抗拒，金川索诺木侵占革布什咱内地，朕命温福阿桂由西路攻资哩阿喀木雅，命桂林分兵先发制人收复木巴拉博租诸寨，并谕以擒获罪魁为主，恩威并示筹划善后。又云南藩司钱度数年不给养廉而寄银数万，信言地窖夹壁藏埋，朕深骇其负恩败检，严谕袁守侗李湖彻底刑讯从重定拟，并令高晋萨载严封两处家产，务使纲纪肃清。朕于军机遥颁方略，于贪墨必惩不贷，惟愿一劳永逸，长保昇平。
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0905.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷0905.md
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 分路进剿大小金川并收复革布什咱
  summary: 以温福阿桂攻小金川资哩阿喀木雅为主，以桂林分兵收复被金川侵占之革布什咱木巴拉博租诸地为奇，恩威兼施谋一劳永逸
  phases:
  - key: brewing
    name: 分兵筹划先复革部
    labels:
      zh:
      - 筹边分路
      - 先发制人
    start_date: 1772-04-04
    highlight_event_id: guji-弘历-event-jinchuan-1
  - key: breakthrough
    name: 木巴拉博租克复军威大振
    labels:
      zh:
      - 克复碉寨
      - 招抚番民
    start_date: 1772-04-04
    highlight_event_id: guji-弘历-event-jinchuan-1
  - key: climax
    name: 资哩阿喀木雅连破深入贼巢
    labels:
      zh:
      - 乘胜捣巢
      - 速擒罪魁
    start_date: 1772-04-06
    highlight_event_id: guji-弘历-event-jinchuan-2
  - key: closure
    name: 恩威并示筹议金川善后
    labels:
      zh:
      - 传檄招抚
      - 防范后路
    start_date: 1772-04-09
    highlight_event_id: guji-弘历-event-jinchuan-2
  decisions:
  - date: 1772-04-04
    title_zh: 嘉奖桂林分兵收复革布什咱交部议叙
    rationale: 索诺木侵占内地党恶助逆情殊可恶，桂林不坐待专攻墨垄沟而分兵克期攻复，兵气奋扬足褫贼魄，当示劝励以坚进取之心
  - date: 1772-04-06
    title_zh: 谕温福阿桂桂林乘胜速捣并防抄袭后路
    rationale: 贼弃坚碉仓皇惊窜或系金川彻兵自卫人心离异，亦恐其暂避锋锐另由间道断饷道军台，故既令乘胜急攻使贼措备不及，又令加意慎防联络策应务求万全
  - date: 1772-04-09
    title_zh: 议以传檄索诺木退地谢罪为完局之策
    rationale: 若僧格桑就擒而革部渐复，可谕索诺木退还侵地立誓守土则宥其已往，若其不擒献而逃匿金川则断难中止以贻后患，故恩威并示以观其从违再定剿抚
- id: guji-弘历-endeavor-2
  title_zh: 严办云南藩司钱度贪墨寄赃案
  summary: 因朱一深揭报及江西德化截获寄银二万九千两，朱批骇异负恩败检，严令滇省刑讯家产严封从重定拟以肃纲纪
  phases:
  - key: brewing
    name: 揭报截赃事发
    labels:
      zh:
      - 截获寄银
      - 搜得亲笔家信
    start_date: 1772-04-08
    highlight_event_id: guji-弘历-event-qiandu-1
  - key: breakthrough
    name: 六百里严谕滇省刑讯
    labels:
      zh:
      - 彻底严究
      - 追问赃源
    start_date: 1772-04-08
    highlight_event_id: guji-弘历-event-qiandu-1
  - key: climax
    name: 两处家产严封细搜
    labels:
      zh:
      - 常州江宁封产
      - 究讯家属
    start_date: 1772-04-08
    highlight_event_id: guji-弘历-event-qiandu-1
  - key: closure
    name: 从重定拟明正典刑并追赔
    labels:
      zh:
      - 另案重办
      - 严防自戕
    start_date: 1772-04-10
    highlight_event_id: guji-弘历-event-qiandu-2
  decisions:
  - date: 1772-04-08
    title_zh: 命袁守侗李湖严刑讯鞫钱度父子及家丁王寿
    rationale: 数年不给养廉而积银数万并纵子售赈簿盈万，若非婪索多赃安得如许积聚，且谋地窖夹壁藏埋肺腑可恨，当逐一据实供出否则严加刑讯亦不足惜
  - date: 1772-04-08
    title_zh: 命高晋萨载严封常州江宁两处财产细搜
    rationale: 既有藏埋狡窟之语则从前诡秘隐匿定复不少，多营狡窟更可概见，当严行究讯毋使稍有藏匿寄顿，否则惟封查大员是问
  - date: 1772-04-10
    title_zh: 钱度另案从重速办并严防畏罪自戕追完赔项
    rationale: 赃私狼藉已非一日罪无可贷，不必俟朱一深全案审明一并完结，应赔银两反为肥橐更属罪不容逭，当严加看守明正典刑以肃官常国宪
events:
- id: guji-弘历-event-birth
  type: birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生于雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后承大统年号乾隆
- id: guji-弘历-event-jinchuan-1
  type: achievement
  date: 1772-04-04
  year_of: 1772
  title_zh: 嘉奖桂林收复木巴拉博租萨玛多坚藏布觉
  description: 乾隆三十七年三月壬子谕，桂林分遣将备攻复革布什咱地方七十余里收复碉寨招抚番民，头人旺勒丹内应出力，将桂林宋元俊及在事将备交部议叙并赏蓝翎银两
- id: guji-弘历-event-jinchuan-2
  type: achievement
  date: 1772-04-06
  year_of: 1772
  title_zh: 嘉奖温福阿桂攻克资哩并筹攻阿喀木雅
  description: 乾隆三十七年三月乙卯谕，温福阿桂调度有方攻克资哩贼寨歼贼甚多，现攻围阿喀木雅，谕乘胜迅捣擒获僧格桑并筹议传檄索诺木退地谢罪之善后方略
- id: guji-弘历-event-qiandu-1
  type: governance
  date: 1772-04-08
  year_of: 1772
  title_zh: 闻江西截获钱度寄银严谕彻底刑讯
  description: 乾隆三十七年三月丙辰丁巳谕，据海明奏德化县获钱度家丁王寿等携银二万九千余两并亲笔家信谋地窖夹壁藏埋，深骇负恩败检，六百里谕袁守侗李湖严讯钱度父子王寿并令高晋萨载严封家产
- id: guji-弘历-event-qiandu-2
  type: governance
  date: 1772-04-10
  year_of: 1772
  title_zh: 饬缉钱度之子钱酆解滇审讯
  description: 乾隆三十七年三月戊午谕，据报钱酆携货售卖多赃久住常德陈长钧家未获，传谕梁国治密委大员锁拏解赴滇省与钱度案一并严审
- id: guji-弘历-event-death
  type: death
  date: 1799-02-07
  year_of: 1799
  title_zh: 太上皇帝弘历崩于养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，遗诏传位嘉庆，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
