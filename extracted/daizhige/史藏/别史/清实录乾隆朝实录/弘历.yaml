endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 喀尔喀防秋筹边安边
  summary_zh: 准夷卡兵彻回而虑秋复借堵逃为名驻牧窥伺命舒赫德等密议逐回备御清野坚壁以保喀尔喀四部
  phases:
  - key: brewing
    name: 彻兵示和心存警惕
    labels:
      zh: 筹边警惕
    start_date: 1752-04-15
    highlight_event_id: guji-弘历-event-fangqiu
  - key: breakthrough
    name: 传谕密议逐回备御
    labels:
      zh: 密议方略
    start_date: 1752-04-15
    highlight_event_id: guji-弘历-event-fangqiu
  - key: climax
    name: 清野集兵锡喇乌苏待敌
    labels:
      zh: 坚壁待劳
    start_date: 1752-04-16
    highlight_event_id: guji-弘历-event-fangqiu
  - key: closure
    name: 定约逐回护守卡座
    labels:
      zh: 安边定约
    start_date: 1752-04-18
    highlight_event_id: guji-弘历-event-fangqiu
  decisions:
  - date: 1752-04-15
    title_zh: 传谕舒赫德玉保成衮扎布密议防秋
    rationale: 虽目前彻兵无事恐外示和好秋复驻兵须预筹如何逐回如何备御使喀尔喀不致被累
  - date: 1752-04-16
    title_zh: 准成衮扎布清野移牧厚集坚兵之奏
    rationale: 贼深入必恃掳掠游牧以接力我行清野又以逸待劳厚集塔密尔鄂尔坤之兵自居必胜
- id: guji-弘历-endeavor-2
  title_zh: 勤农重漕肃吏振饬科场
  summary_zh: 以漕粮盗卖乡试草率浙东饥流台湾番杀为鉴亲耕耤田展赈稽漕宽期阅卷彻查番案以养民求真
  phases:
  - key: brewing
    name: 漕弊科促灾流番衅并见
    labels:
      zh: 内政多艰
    start_date: 1752-04-12
    highlight_event_id: guji-弘历-event-zhezhen
  - key: breakthrough
    name: 饬漕督查盗卖饬抚查流民
    labels:
      zh: 饬查整饬
    start_date: 1752-04-14
    highlight_event_id: guji-弘历-event-zhezhen
  - key: climax
    name: 亲耕耤田展赈彻查番案
    labels:
      zh: 亲民求真
    start_date: 1752-04-24
    highlight_event_id: guji-弘历-event-gengji
  - key: closure
    name: 定内帘工匠揭晓始放立规
    labels:
      zh: 立规防弊
    start_date: 1752-04-26
    highlight_event_id: guji-弘历-event-taiwan
  decisions:
  - date: 1752-04-14
    title_zh: 谕瑚宝会同巡漕御史严查漕粮盗卖
    rationale: 漕粮重运盘验紧要运官不能弹压致帮丁私卖一经降旨即发韩大远之案须实力督察否则惟总漕是问
  - date: 1752-04-18
    title_zh: 谕雅尔哈善查明浙东灾流并展赈加赈
    rationale: 浙东被灾特重饥民流入省城河道浅阻米价久昂须豫筹接济资送还乡借给籽种以待秋成
  - date: 1752-04-24
    title_zh: 命喀尔吉善秉公确查彰化番杀兵民案并饬巡台御史据实入告
    rationale: 文武各执熟番生番之词互异若诿化外了事贻患更大须究察实在情形不可隐讳朦混
