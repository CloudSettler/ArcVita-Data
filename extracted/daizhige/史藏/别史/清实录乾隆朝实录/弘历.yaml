- id: guji-弘历-event-1790-audience
  title_zh: 御卷阿胜境万树园召见使臣蒙古王公赐宴
  type: career
  date: 1790-08-10
  year_of: 1790
  place_zh: 热河避暑山庄卷阿胜境及万树园
  description: 七月甲午起召见朝鲜正使黄仁点副使徐浩修及蒙古王贝勒回部王公安南缅甸南掌使臣土司生番赐食戊戌赐呼图克图蒙古王公宴赉壬寅回銮驻喀喇河屯
- id: guji-弘历-event-1790-grain
  title_zh: 发京仓稄米三万石平粜并推恩宗室耆民
  type: career
  date: 1790-09-01
  year_of: 1790
  place_zh: 京师五城仓
  description: 以八旬庆典京师人数实众米价稍增发稄米三万石照时价减粜派胡季堂等每城二人监粜并放出圈禁宗室平住等七口赏赉八十以上五世同堂耆民寿妇
- id: guji-弘历-event-1790-flood
  title_zh: 谕令查赈永平天津锦州山东宿州徐州水灾
  type: career
  date: 1790-08-15
  year_of: 1790
  place_zh: 永平府天津锦州平原禹城宿州砀山萧县
  description: 因六月下旬至七月霪雨河涨滦州乐亭大凌河马颊河濉河黄河漫溢田禾庐舍被淹命梁肯堂长麟周樽朱圭福崧分往履勘给口粮修费疏消积水毋存讳饰
- id: guji-弘历-event-1790-personnel
  title_zh: 处置句容高邮漕粮侵蚀及坝工玉石各案
  type: career
  date: 1790-08-16
  year_of: 1790
  place_zh: 北京紫禁城
  description: 以江苏句容高邮粮书侵蚀银米累万将总督书麟革职拏问发伊犁巡抚闵鹗元定以重辟李世杰原品休致司道府革降有差何堂革职留任赔缴张殿魁偷换官玉即行绞决福崧宽宥申饬
