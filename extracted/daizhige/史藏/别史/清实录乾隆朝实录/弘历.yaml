endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 进剿回部擒获霍集占
  summary: 雅尔哈善顿兵库车纵脱霍集占朕更命兆惠驰往整饬纪律剿抚并用以图一举荡平
  phases:
  - key: brewing
    name: 库车顿兵纵贼
    labels:
      zh: 纵贼坐失事机
    start_date: 1758-08-01
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 更命兆惠驰往
    labels:
      zh: 易帅整军
    start_date: 1758-08-15
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 申明纪律进剿
    labels:
      zh: 剿抚并用
    start_date: 1758-08-20
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 拏解雅尔哈善治罪
    labels:
      zh: 罚帅肃纪
    start_date: 1758-09-01
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1758-08-15
    title_zh: 命兆惠速赴库车办理回部
    rationale: 雅尔哈善坐视贼酋窜逸军纪废弛非易得力大臣不能挽回故令兆惠就近前往以擒获霍集占为要
  - date: 1758-08-20
    title_zh: 革雅尔哈善哈宁阿顺德讷职拏解来京
    rationale: 身任元戎指麾乖方奏报矛盾惟图诿过不置于法则国宪安在故明正其罪以肃军纪
- id: guji-弘历-endeavor-2
  title_zh: 厘剔河工核实旧料济运
  summary: 南河旧料积弊丛生漕运杨庄浅阻朕饬按年盘查实力办理并会勘湖口诸闸引水济运毋轻言引黄
  phases:
  - key: brewing
    name: 河工旧料奏请变法
    labels:
      zh: 旧料折耗生弊
    start_date: 1758-08-01
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 饬循白钟山成法盘查
    labels:
      zh: 按年核实用旧
    start_date: 1758-08-05
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 会勘湖口闸济运
    labels:
      zh: 上游筹水济运
    start_date: 1758-08-25
    highlight_event_id: guji-弘历-event-4
  - key: closure
    name: 调剂杨庄口门水势
    labels:
      zh: 酌量收蓄清流
    start_date: 1758-09-01
    highlight_event_id: guji-弘历-event-4
  decisions:
  - date: 1758-08-05
    title_zh: 钞寄白钟山摺令张师载循旧妥办河工旧料
    rationale: 与其筹画于年久折耗之后种种生弊何如按年实力办理不令折耗并戒墨守成规当实心厘剔
  - date: 1758-08-25
    title_zh: 饬白钟山等亲往湖口闸会同相度毋轻引黄入运
    rationale: 黄水多挟泥沙易致淤垫当先于微山诸湖及骆马湖筹水济运以清抵黄方为经久之计
