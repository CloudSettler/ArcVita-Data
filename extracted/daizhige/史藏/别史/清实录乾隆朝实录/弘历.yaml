  archetype: 勤政守成之君
  dilemmas:
  - 念旧臣劳绩与正国法惩贪纵之间当如何权衡
  - 施恩喀尔喀与谨守卡界不令侵占准部隙地之间当如何划界
  - 望雨祈泽与课吏治民之间当如何兼顾天人
  lesson: 以李侍尧为炯戒整饬吏治，以祈雨勤民为本，宽严相济，方能保泰持盈
  summary_first_person: 朕临御四十有五年，幸海宇乂安，夙夜祗惧，巡省祈雨，察吏安民，遇贪黩则痛自警省，遇疆界则谨守旧章，惟愿时泽普沾，倉庾常盈，吏治澄清，以迓延洪之福
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71106.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 查办李侍尧贪纵案整饬滇省吏治
  summary: 因李侍尧婪索属员赃私狼藉，降旨改拟斩决，通谕督抚自省，并饬福康安清厘仓库铜务钱法
  phases:
  - key: brewing
    name: 风闻滇省贪黩吏治废弛
    labels:
      zh: 酝酿
    start_date: 1780-01-01
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 和珅等核议原拟斩候进呈
    labels:
      zh: 突破
    start_date: 1780-06-01
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 改拟斩决通谕中外引为炯戒
    labels:
      zh: 高潮
    start_date: 1780-06-09
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 饬福康安清厘仓库铜政钱法
    labels:
      zh: 收束
    start_date: 1780-06-12
    highlight_event_id: guji-弘历-event-3
  decisions:
  - date: 1780-06-09
    title_zh: 将李侍尧由斩候改为斩决并颁原摺令督抚各抒己见
    rationale: 贪黩逾闲荡检若仅监候不足以警封疆故从重改拟以昭炯戒
  - date: 1780-06-12
    title_zh: 令福康安逐加查察各属仓库如有亏空即行严参
    rationale: 钱粮关系国帑定例綦严须彻底清厘方能肃清官方
- id: guji-弘历-endeavor-2
  title_zh: 南巡回跸祈雨经略疆界河塘
  summary: 自江南旋跸经山东直隶见田土乾燥屡谕祈雨，同时驳喀尔喀展牧之请，筹浙江海塘石工与保山民变处置
  phases:
  - key: brewing
    name: 沿途见山东直隶乾燥江省亦望雨
    labels:
      zh: 酝酿
    start_date: 1780-05-01
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 谕萨载吴坛陈辉祖查雨虔祷
    labels:
      zh: 突破
    start_date: 1780-06-04
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 駁巴图展牧之请派博清额勘界
    labels:
      zh: 高潮
    start_date: 1780-06-03
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 定城守尉班次核海塘柴塘并存
    labels:
      zh: 收束
    start_date: 1780-06-11
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1780-06-03
    title_zh: 驳回巴图移旗展牧之请交部议处并派博清额秉公勘界
    rationale: 扎萨克图汗已展至苏木卡若再展占将尽属喀尔喀故当存案严禁守界
  - date: 1780-06-04
    title_zh: 谕萨载吴坛查明各属得雨与否速奏并率属设坛祈祷
    rationale: 时届莳插高阜盼雨弥切须得时泽普沾方庆有秋以慰廑念
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 出生于雍亲王府
  description: 康熙五十年八月十三日生，是为后之高宗纯皇帝
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 龙御归天于养心殿
  description: 嘉庆四年正月初三日崩，享寿八十有九，庙号高宗
- id: guji-弘历-event-1
  date: 1780-06-03
  year_of: 1780
  title_zh: 乾隆四十五年五月朔谕驳喀尔喀展牧
  description: 据巴图等请展扎萨克图汗游牧，斥其瞻徇偏袒，交部严议，派博清额赴乌里雅苏台勘界绘画标志
- id: guji-弘历-event-2
  date: 1780-06-09
  year_of: 1780
  title_zh: 核议李侍尧贪纵营私改拟斩决
  description: 大学士九卿核议和珅等所拟，将李侍尧由斩候改为斩决，颁摺通谕督抚引为炯戒并陈买办之弊
- id: guji-弘历-event-3
  date: 1780-06-04
  year_of: 1780
  title_zh: 旋跸途中以旱谕令祈雨
  description: 自江南旋跸经山东直隶见田土乾燥，谕萨载陈辉祖吴坛查明各属得雨情形，虔诚设坛祈祷以资灌溉
