  type: death
- id: guji-弘历-event-buhuang
  date: 1752-07-14
  year_of: 1752
  title_zh: 降旨切责江南督抚捕蝗不力
  description: 以丰沛铜山萧砀飞蝗来往系地方怠缓所致将江南督抚交部议处并通谕各省严饬扑捕违者从重治罪
  type: career
- id: guji-弘历-event-shanhou
  date: 1752-07-20
  year_of: 1752
  title_zh: 谕直隶搜刨蝗子抚恤被水村庄
  description: 令方观承等分管村庄往复搜寻乘初生殄除并令履勘永定河埝内村庄给价迁移借给口粮妥查抚恤
  type: career
- id: guji-弘历-event-kaohan
  date: 1752-07-16
  year_of: 1752
  title_zh: 正大光明殿考试翰詹
  description: 亲阅翰林詹事文字分四等汪廷玙窦光鼐杨述曾列一等分别升授侍讲学士等劣者降调休致罚俸
  type: career
- id: guji-弘历-event-hegong
  date: 1752-07-19
  year_of: 1752
  title_zh: 批驳顾琮蒋炳开挖引河之请
  description: 谓加高培厚不如取直去湾引河不能容受盛汛止令不可缓之工一面办理余令详细绘图贴说具奏
  type: career
- id: guji-弘历-event-ni an
  date: 1752-07-12
  year_of: 1752
  title_zh: 饬解奸僧慧照赴楚质审严缉马朝柱
  description: 南阳盘获慧照供涉马朝柱令多派员弁解往楚省严讯沿途防范毋致疏虞并嘉奖庄有信谢锽缉获之功
  type: career
