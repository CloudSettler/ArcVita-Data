  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生母孝圣宪皇后是为后之高宗纯皇帝
- id: guji-弘历-event-cao
  title_zh: 批准漕运佥丁津贴新例传谕有漕督抚实力查察
  date: 1783-08-02
  year_of: 1783
  place_zh: 热河行在
  description: 户部议覆漕督毓奇所奏限期佥解查验造册变产赔补违限参奏降调津贴照正项催解依议速行复传谕有漕督抚如仍怠玩惟督抚是问
- id: guji-弘历-event-he
  title_zh: 准销运河南河抢修银并谕秋汛防护黄河新工
  date: 1783-08-04
  year_of: 1783
  place_zh: 热河行在
  description: 据福康安奏运河南河抢修均实用实销准开销济宁以南及南河银两万余复据萨载兰第锡奏黄河畅消木龙冲失及睢州仪封抢镶情形谕加意防护俟安澜议叙
- id: guji-弘历-event-fan
  title_zh: 临幸盛京受朝鲜贺寿锡寿宁寺名锡达赖玉册玉宝
  date: 1783-08-12
  year_of: 1783
  place_zh: 热河澹泊敬诚殿
  description: 以恭谒祖陵过万寿受朝鲜陪臣迎驾修贡加恩赏赉申饬礼部赏藏地新建寺名寿宁寺亲书祥轮普护锡达赖玉册玉宝供奉普陀宗乘之庙
- id: guji-弘历-event-zhen
  title_zh: 询问豫鲁雨泽赈贷湖北水灾
  date: 1783-08-15
  year_of: 1783
  place_zh: 热河行在
  description: 以豫省辉浚新延四县及山东曹兖雨泽短少传谕何裕城明兴迅速查奏赈贷湖北黄梅广济等八州县三卫被水灾民并予缓徵
- id: guji-弘历-event-death
  title_zh: 龙御归天于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩年八十有九太上皇帝大行遗诏传位嘉庆守成开拓之业垂于史册
