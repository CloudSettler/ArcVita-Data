  dilemmas:
  - 以蛮攻蛮难责实效与大兵进剿师出无名之间如何权衡
  - 整饬官常需严明黜陟与爱惜能吏勿以微眚遽弃之间如何兼顾
  lesson: 务实迹而黜空言，权祸福以定进止，察吏必求功过之平
  summary_first_person: 朕临御三十一年，金川土司相仇数载，朕不欲无名用兵，命阿尔泰等亲往开导，晓以祸福利害，平遥令李玳馨勘谳得实而被劾，朕亲加体察为之昭雪，盖治天下惟求实迹，吏治民生系焉
