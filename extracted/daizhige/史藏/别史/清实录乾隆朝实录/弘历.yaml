endeavors:
- id: guji-弘历-endeavor-1
  person_qid: guji-弘历
  title_zh: 整饬盛京旗员解犯玩忽
  summary_zh: 针对佐领杨玉琯不亲押解副领催马进福纵容脱逃及翼长车木布仰药自毙严旨惩处并申饬署理将军朝铨以肃满洲臣仆纲纪
  phases:
  - key: brewing
    name: 发觉解犯脱逃
    labels:
      zh: 萌发
    start_date: 1762-09-18
    highlight_event_id: guji-弘历-event-shengjing
  - key: breakthrough
    name: 重惩杨玉琯等
    labels:
      zh: 突破
    start_date: 1762-09-18
    highlight_event_id: guji-弘历-event-shengjing
  - key: climax
    name: 申饬朝铨疏忽
    labels:
      zh: 高潮
    start_date: 1762-09-21
    highlight_event_id: guji-弘历-event-chemu
  - key: closure
    name: 通谕盛京各城
    labels:
      zh: 收束
    start_date: 1762-09-21
    highlight_event_id: guji-弘历-event-chemu
  decisions:
  - date: 1762-09-18
    title_zh: 革杨玉琯枷号示众发马进福等往伊犁
    rationale: 盛京满洲臣仆倍应奋勉今毫无法纪非从重不足示惩也
  - date: 1762-09-21
    title_zh: 交朝铨议处并严行申饬
    rationale: 既署将军事务较繁即应谨慎防范致罪犯自毙属张皇失措也
- id: guji-弘历-endeavor-2
  person_qid: guji-弘历
  title_zh: 清厘江南织造闰月银丝觔
  summary_zh: 因苏州织造金辉奏闰月银扣留及江宁苏州丝觔部价核减赔累命萨载尹继善查接收支以清织造帑项宿弊
  phases:
  - key: brewing
    name: 金辉奏闰月银扣留
    labels:
      zh: 萌发
    start_date: 1762-09-23
    highlight_event_id: guji-弘历-event-zhizao
  - key: breakthrough
    name: 命萨载照奏催解
    labels:
      zh: 突破
    start_date: 1762-09-23
    highlight_event_id: guji-弘历-event-zhizao
  - key: climax
    name: 究丝觔赔补通融之法
    labels:
      zh: 高潮
    start_date: 1762-09-23
    highlight_event_id: guji-弘历-event-zhizao
  - key: closure
    name: 接收贡物抵补归款
    labels:
      zh: 收束
    start_date: 1762-09-24
    highlight_event_id: guji-弘历-event-zhizao
  decisions:
  - date: 1762-09-23
    title_zh: 闰月银照十三月奏解并催清旧欠
    rationale: 织造盈余既有成额遇闰扣留易滋侵隐当归公奏解也
  - date: 1762-09-23
    title_zh: 命查织造采买不致赔垫之法
    rationale: 市价部价原难画一年年赔补织造无此赀力必有通融之法当详查也
events:
- id: guji-弘历-event-birth
  person_qid: guji-弘历
  title_zh: 生于圆明园
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生为雍亲王第四子即后之高宗也
- id: guji-弘历-event-death
  person_qid: guji-弘历
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩年八十有九也
- id: guji-弘历-event-shengjing
  person_qid: guji-弘历
  title_zh: 谕惩盛京玩忽解犯官兵
  date: 1762-09-18
  year_of: 1762
  description_zh: 乾隆二十七年八月辛卯朔以佐领杨玉琯不亲解犯副领催马进福纵犯脱逃下旨革职枷号发伊犁充当苦差并通谕盛京各城也
- id: guji-弘历-event-chemu
  person_qid: guji-弘历
  title_zh: 谕究车木布自毙申饬朝铨
  date: 1762-09-21
  year_of: 1762
  description_zh: 乾隆二十七年八月甲午以被劾翼长车木布解送盛京仰药而死将署将军朝铨交部议处并严行申饬也
- id: guji-弘历-event-zhizao
  person_qid: guji-弘历
  title_zh: 谕清织造闰月银丝觔价差
  date: 1762-09-23
  year_of: 1762
  description_zh: 乾隆二十七年八月丙申据金辉奏苏州织造闰月银扣留及丝觔部价赔累命萨载催解接收并谕尹继善查明设法办理之由也
