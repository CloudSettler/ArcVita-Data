- id: guji-弘历-event-jiangjie
  date: 1776-07-20
  year_of: 1776
  title_zh: 降旨严缉油坊劫漕案
  description_zh: 乾隆四十一年七月乙酉据阿思哈奏常州白粮帮回空船在夏津油坊被劫传谕周元理杨景素玛尔清阿严饬文武上紧查拏申饬玛尔清阿督催不力
  raw: 乾隆四十一年七月乙酉
- id: guji-弘历-event-zhenxu
  date: 1776-07-25
  year_of: 1776
  title_zh: 谕抚恤打箭炉水灾
  description_zh: 据文绶奏打箭炉明正司海子山水发冲倒南门衙署兵房化为石滩淹毙兵民命亲往查办抚恤清理钱粮军火相度城垣移建
  raw: 乾隆四十一年七月
- id: guji-弘历-event-shanglitao
  date: 1776-08-02
  year_of: 1776
  title_zh: 赏临清知州李涛知府衔
  description_zh: 李涛查获盗赃盘获王二沈二并躧获盗首段老等九名赏给知府衔仍留临清任命将现获各犯审明不分首从斩决枭示
  raw: 乾隆四十一年七月丙申
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 弘历驾崩
  description_zh: 嘉庆四年正月初三日崩于紫禁城养心殿终年八十九岁谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
