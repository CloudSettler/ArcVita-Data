  archetype: 守成励治之君
  dilemmas:
  - 联上下之情与防逢迎糜费之两难
  - 施宗室延恩与防爵禄冗滥之权衡
  - 慎刑恤民与严惩滥刑诬枉之兼顾
  lesson: 崇俭黜华以清吏治，定等差以昭久远，慎刑平反以安良善
  summary_first_person: 朕即位四十有一载，冬享太庙，颁来岁时宪，见督抚京官借万寿年节购觅古玩珠绣以充贡，恐市侩居奇、属员代办而累吏治，遂饬禁土贡外一切进献，又念宗室袭爵若无等差则愈积愈多，遂定亲王递降至镇国公、郡王递降至辅国公而止、公爵世袭罔替之制，复亲勾各省秋审，平反英山诬枉重案，以昭示子孙遵守勿替
  source_urls:
