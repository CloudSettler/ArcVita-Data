  date: 1799-02-07
  year_of: 1799
  place_zh: 北京养心殿
  description_zh: 嘉庆四年正月初三日崩年八十九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝庙号高宗
