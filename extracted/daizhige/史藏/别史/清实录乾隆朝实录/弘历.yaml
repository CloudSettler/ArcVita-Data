- id: guji-弘历-event-birth
  type: birth
  title_zh: 弘历出生
  date: 1711-09-25
  year_of: 1711
  place_zh: 雍亲王府
  description_zh: 康熙五十年八月十三日生为雍亲王胤禛第四子后即位为高宗纯皇帝
- id: guji-弘历-event-hanqi
  type: career
  title_zh: 畅春园忧旱自责
  date: 1744-06-13
  year_of: 1744
  place_zh: 畅春园
  description_zh: 一春以来雨泽稀少二麦黄萎朕诣畅春园问安见皇太后步祷龙神惶恐战栗即刻请安谢罪并谕内外臣工知之
- id: guji-弘历-event-hanyu
  type: career
  title_zh: 定旱雩斋期不避端阳
  date: 1744-06-14
  year_of: 1744
  place_zh: 紫禁城
  description_zh: 礼部奏请以端阳改斋期朕以甘霖为急不间节令著仍于初五斋戒初八致祭太庙祈祷
- id: guji-弘历-event-fengshen
  type: career
  title_zh: 制文遣王祷风神庙
  date: 1744-06-17
  year_of: 1744
  place_zh: 风神庙
  description_zh: 京师风霾时作朕亲制告风神文遣平郡王福彭虔祷于风神庙愿敕飞廉收暴油云作雨
- id: guji-弘历-event-shuili
  type: career
  title_zh: 纳柴潮生议兴水利
  date: 1744-06-19
  year_of: 1744
  place_zh: 紫禁城
  description_zh: 山西道御史柴潮生奏请遣大臣赍帑经理河间天津水利疏浚河渠淀泊开井建闸朕命大学士会同九卿速议具奏
- id: guji-弘历-event-pingcai
  type: career
  title_zh: 顺天府分设四厂平粜
  date: 1744-06-21
  year_of: 1744
  place_zh: 顺天府
  description_zh: 天时亢旱粮价日昂准府尹蒋炳奏于通州卢沟桥沙河黄村分设四厂发米平粜并遣御前侍卫稽查
- id: guji-弘历-event-fangze
  type: career
  title_zh: 夏至亲祭地于方泽
  date: 1744-06-22
  year_of: 1744
  place_zh: 方泽
  description_zh: 夏至祭地于方泽上亲诣行礼时正祈雨不乘辇不设卤簿并仍在宫内斋宫住宿以恤扈从
- id: guji-弘历-event-mimi
  type: career
  title_zh: 密谕两江豫备米麦
  date: 1744-06-25
  year_of: 1744
  place_zh: 紫禁城
  description_zh: 谕军机大臣密寄信与上下江督抚各豫备米麦十数万石此时不必声张俟直隶需用信到即运
- id: guji-弘历-event-yundou
  type: career
  title_zh: 准运盛京仓豆接济京畿
  date: 1744-06-25
  year_of: 1744
  place_zh: 盛京至天津
  description_zh: 准盛京户部侍郎双喜奏锦州义州辽阳仓豆运至海口囤贮俟船到即运天津转运京师接济
- id: guji-弘历-event-death
  type: death
  title_zh: 弘历逝世
  date: 1799-02-07
  year_of: 1799
  place_zh: 紫禁城养心殿
  description_zh: 嘉庆四年正月初三日太上皇帝崩年八十九谥纯皇帝庙号高宗葬裕陵
