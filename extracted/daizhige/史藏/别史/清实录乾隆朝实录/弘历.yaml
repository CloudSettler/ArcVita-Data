  dilemmas:
  - 赈灾欲从厚而虑吏胥中饱张大事端
  - 治邪教欲惩首恶而虑株连蔓引骚扰乡愚
  lesson: 抚恤在速更在实，刑罚在当更在止，一秉至公而兼听并观。
  summary_first_person: 朕弘历，仲秋御文华殿讲论语易经，阐视察观人之义与体仁长人之道，高宝猝被水患则截漕留银亲遣大员履勘，邢台山西邪教案则但毙首恶而不穷治胁从，惟愿无一夫失所、无一事株连。
