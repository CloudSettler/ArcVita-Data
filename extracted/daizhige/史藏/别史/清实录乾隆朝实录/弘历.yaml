  dilemmas:
  - 仪封合龙求速与埽工求稳之两难
  - 逆书伸国法与毋株连无辜之权衡
  - 川省军需从严核销与加恩豁免之抉择
  lesson: 治河宜因势利导顺水性，驭下宜严而不苛，核销宜顾大体恤民力
  summary_first_person: 朕以昼夜悬切之心督阿桂等办仪封引河，盼西南风以掣全溜，又于沈大绶逆书严伸国法而不令株连匡姓，于川省军需加恩尽豁民欠商欠专赔分赔以安官民，此皆朕勤政爱民之苦心
