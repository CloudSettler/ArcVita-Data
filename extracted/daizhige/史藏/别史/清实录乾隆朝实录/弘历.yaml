endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 遣重臣督师平定甘肃苏四十三之乱
  summary_zh: 逆回占河州逼兰州之际速遣阿桂和珅驰赴甘肃调陕甘京兵会剿围困龙尾山梁以期一鼓歼擒
  phases:
