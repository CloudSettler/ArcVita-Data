  - title_zh: 速战与持重
    description: 金川贼巢穷蹙迁延，既欲旬日奏功以省粮糜费，又恐受降藏奸官兵疏懈
  - title_zh: 褒忠与传信
    description: 欲旌胜朝殉节以风励臣节，又虑文献无徵真伪混淆滋扰里闾
  lesson: 以无逸为所常存足民之心，受降如受敌慎之又慎，褒忠以正史为断以传信垂远
  summary_first_person: 予临御四十一年仲春经筵，以百姓足君孰与不足、无逸为训，宵旰祈年不匿灾伤；金川围攻逾月，予夜不成寐盼红旗，催速攻筹粮减彻，定土司轮班朝正，严防乞降藏奸；亲祭社稷议风雨移奉，定胜朝殉节专谥通谥刊录颁行，以昭妥侑以励臣节
