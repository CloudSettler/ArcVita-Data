      - 善后
    start_date: 1745-11-08
    highlight_event_id: guji-弘历-event-jieliu
  decisions:
  - date: 1745-11-04
    title_zh: 命蠲宁远叙州建昌龙安松潘等处米豆夷赋贡马
    rationale: 条粮虽异于地丁皆系民力所出，边方寒苦宜普沾惠泽以示优恤
  - date: 1745-11-07
    title_zh: 命截留上江漕粮五万石下江漕粮十万石
    rationale: 江淮秋被水灾所贮未必充余，明春青黄不接须豫筹官米赈粜接济
- id: guji-弘历-endeavor-2
  title_zh: 饬河防课吏治清赈弊
  summary: 因黄河陈家浦决口申饬河臣权衡轻重，又以赈务弊多命督抚亲往查察，并饬禁赌严察官马
  phases:
  - key: brewing
    name: 黄河盛涨陈家浦决口
    labels:
