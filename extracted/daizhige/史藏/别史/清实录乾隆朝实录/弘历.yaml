  decisions:
  - date: 1788-10-28
    title_zh: 传谕阿桂详报房屋舆情
    rationale: 轸念灾区无时或释，必查明修建几分及是否安辑，据实奏闻
  - date: 1788-10-30
    title_zh: 谕阿桂毕沅会勘潜江
    rationale: 潜江两度被水补种复淹，情殊可悯，须查积水疏消并酌加抚恤
- id: guji-弘历-endeavor-2
  title_zh: 安南扶黎讨阮出关进剿
  summary_zh: 阮惠让出黎城而嗣孙未稳，许世亨原议驻兵护送，改命孙士毅亲督出关捣穴擒渠
  phases:
