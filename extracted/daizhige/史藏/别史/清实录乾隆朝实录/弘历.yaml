endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 督遣重臣平定台湾林爽文庄大田之乱并经理善后
  summary: 洞烛几先命福康安海兰察由鹿仔港进兵，速平南北两路，擒获首逆，奖功恤兵，查办柴大纪，经理营制城建赈恤
  phases:
  - key: brewing
    name: 恒瑞请多兵因循误事
    labels:
      zh:
      - 台湾
      - 林爽文
      - 恒瑞
    start_date: 1787-11-01
    highlight_event_id: guji-弘历-event-chaban
  - key: breakthrough
    name: 福康安星往救嘉义破贼巢
    labels:
      zh:
      - 鹿仔港
      - 嘉义
    start_date: 1787-12-01
    highlight_event_id: guji-弘历-event-pingtai
  - key: climax
    name: 擒获首逆全郡荡平论功行赏
    labels:
      zh:
      - 擒获
      - 封赏
    start_date: 1788-02-01
    highlight_event_id: guji-弘历-event-pingtai
  - key: closure
    name: 查办柴大纪整顿营制赈恤善后
    labels:
      zh:
      - 善后
      - 营制
      - 赈恤
    start_date: 1788-04-11
    highlight_event_id: guji-弘历-event-chaban
  decisions:
  - date: 1788-04-11
    title_zh: 不准添兵十余万而命福康安海兰察速进
    rationale: 若交常青恒瑞统大兵守候配渡需时，嘉义郡城俱不可守，故坚持定见由鹿仔港前进以收速效
  - date: 1788-04-11
    title_zh: 录功宥过加赏福康安海兰察紫缰金黄腰带朝珠
    rationale: 福康安调度有方海兰察奋勇擒获庄大田家属，功大过小，故录功宥袒护恒瑞之咎以示优异
  - date: 1788-04-11
    title_zh: 命福康安会同徐嗣曾彻底查办柴大纪并留台经理善后
    rationale: 柴大纪贪黩敛怨酿变捏词守城冒恩，不可使幸逃重戾，故逐款严查营制城垣叛产赈务一手经理完竣再内渡
- id: guji-弘历-endeavor-2
  title_zh: 振饬士风整顿科举盐务漕运
  summary: 因叶栋献集诗册捉刀事通谕崇实黜华，申严科场防弊召试殿试朝考，并饬楚省缉私疏销淮盐积压，催东省漕船严办洋盗
  phases:
  - key: brewing
    name: 叶栋献诗查卷破露捉刀
    labels:
      zh:
      - 士风
      - 科举
    start_date: 1788-04-08
    highlight_event_id: guji-弘历-event-shifeng
  - key: breakthrough
    name: 通谕崇实黜华申严防弊
    labels:
      zh:
      - 通谕
      - 防弊
    start_date: 1788-04-08
    highlight_event_id: guji-弘历-event-shifeng
  - key: climax
    name: 饬湖广川省缉私疏销淮盐积压
    labels:
      zh:
      - 盐务
      - 缉私
    start_date: 1788-04-09
    highlight_event_id: guji-弘历-event-yanyun
  - key: closure
    name: 催东省漕船严办闽洋盗案恤失风军米
    labels:
      zh:
      - 漕运
      - 海盗
      - 恤赏
    start_date: 1788-04-06
    highlight_event_id: guji-弘历-event-yanyun
  decisions:
  - date: 1788-04-08
    title_zh: 不赏叶栋而通谕士子务本力学
    rationale: 所献系集御制诗他人代倩，原卷赋失韵诗砌凑，若遽奖恐竞尚浮华钻营舞弊，故明载道之文以振士风
  - date: 1788-04-09
    title_zh: 仍照新例严办福建海洋盗案五年后再照旧例
    rationale: 闽民风奸悍劫案不一，大功告竣未便遽宽，故留严例以期盗风渐戢
  - date: 1788-04-09
    title_zh: 命舒常姜晟李世杰实力缉私议历任盐政罪
    rationale: 淮盐积压百余万由楚吏巡缉不力川私充斥口岸匣费繁重所致，故严清境界年清年款并查议延玩
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 弘历诞生于雍亲王府
  description: 康熙五十年八月十三日生，后即位为高宗纯皇帝，年号乾隆
  place_zh: 北京雍亲王府
- id: guji-弘历-event-shifeng
  date: 1788-04-08
  year_of: 1788
  title_zh: 御勤政殿因叶栋献诗捉刀通谕振饬士风
  description: 查叶栋应试赋失押诗砌凑，断为代倩，谕士子湛深经术坐言起行，申严殿试朝考散馆大考防弊
  place_zh: 北京紫禁城勤政殿
- id: guji-弘历-event-pingtai
  date: 1788-04-11
  year_of: 1788
  title_zh: 论平定台湾功加赏福康安海兰察和珅义民兵丁
  description: 未及三月屡破贼巢擒林爽文，全境荡平，加赏紫缰金黄腰带朝珠，奖罗前荫曾中立等义民，赏湖南贵州广西四川屯练及留台粤兵每名银二两
  place_zh: 北京紫禁城
- id: guji-弘历-event-chaban
  date: 1788-04-11
  year_of: 1788
  title_zh: 谕福康安徐嗣曾彻底查办柴大纪经理台湾善后
  description: 查抄家产供出任内得五六万金，命解任严讯卖官鬻爵虚粮冒饷，查拿陈泮吴钦林石庄天畏，酌改营制换防募义民，勘建凤山嘉义彰化淡水城垣，以入官叛产贴补换班兵丁
  place_zh: 台湾府至北京
- id: guji-弘历-event-yanyun
  date: 1788-04-09
  year_of: 1788
  title_zh: 饬盐政漕运洋面并恤运米失风淹毙
  description: 淮南纲盐积压命提出六十万道五年带运，饬湖广四川缉私，催东省帮船过津，福建洋盗仍照新例严办五年，失风淹毙照漕船例赏恤，蔡永胜等发往伊犁乌鲁木齐充苦差
  place_zh: 直隶至闽浙两广洋面
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 高宗崩于紫禁城宁寿宫
  description: 嘉庆四年正月初三日崩，传位嘉庆后训政，实录凡三千余卷记其政教
  place_zh: 北京紫禁城宁寿宫
