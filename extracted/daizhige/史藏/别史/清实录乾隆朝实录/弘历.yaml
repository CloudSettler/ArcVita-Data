  decisions:
  - date: 1776-07-20
    title_zh: 六百里谕杨景素玛尔清阿周元理严缉
    rationale: 回空漕船被劫从来未有油坊为南北通津目无法纪必须尽法究治毋使一名漏网并防窜匿直隶
  - date: 1776-07-24
    title_zh: 革范君僎王培进枷号汛兵
    rationale: 夏津知县删改供词抑令事主自认妄报非寻常讳盗可比汛兵不支更不追捕玩弛可恨当重惩以儆绿营积习
  - date: 1776-08-02
    title_zh: 赏李涛知府衔就地正法盗首
    rationale: 李涛查获原赃盘获多犯兼获盗首能事可嘉当奖励干员现获各犯不分首从问拟斩决枭示失事地方不必解省稽时
- id: guji-弘历-endeavor-2
  title_zh: 抚恤打箭炉水灾与甘湘鄂旱水
  summary_zh: 打箭炉海子山水发冲城湖南耒阳永兴湖北郧西水发甘肃皋兰等属夏禾被旱命亲往查办清理钱粮军火赈济灾黎相度城垣移建高地
  phases:
  - key: brewing
