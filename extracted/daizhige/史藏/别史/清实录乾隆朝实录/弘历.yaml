events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于圆明园
  description: 康熙五十年八月十三生为雍亲王第四子母熹贵妃
- id: guji-弘历-event-goujue
  date: 1785-11-04
  year_of: 1785
  title_zh: 御懋勤殿勾到河南等省情实
  description: 甲午勾到河南情实停决斩绞余予勾戊戌庚子甲辰复勾山东山西直隶慎刑平允
- id: guji-弘历-event-lishiyao
  date: 1785-11-04
  year_of: 1785
  title_zh: 释李侍尧出狱家居
  description: 李侍尧办逆回案玩误因循已监禁两年加恩释放引罪家居扪心自愧
- id: guji-弘历-event-cheweihan
  date: 1785-11-04
  year_of: 1785
  title_zh: 车为翰推跌叔案再议
  description: 云南革举人车为翰推跌小功服叔致死初拟斩立决以情急可原再交九卿议奏
- id: guji-弘历-event-qingeng
  date: 1785-11-07
  year_of: 1785
  title_zh: 谕定亲耕亲莅遣官之例
  description: 以年逾七十五恐步履稍逊定六十以内年年躬耕逾六十先期题请著为令
- id: guji-弘历-event-huodi
  date: 1785-11-07
  year_of: 1785
  title_zh: 豁除郑州废地钱粮
  description: 开封郑州堤压水冲不能耕种地百五十顷钱粮千二百余两加恩概予豁除
- id: guji-弘历-event-jiexiang
  date: 1785-11-12
  year_of: 1785
  title_zh: 谕五省灾地营兵借饷
  description: 河南山东江苏安徽湖北被旱米贵被灾较重者借两月饷稍轻者借一月明年扣还
- id: guji-弘历-event-yongzhi
  date: 1785-11-16
  year_of: 1785
  title_zh: 永芝案改缓决严办家奴
  description: 已革镇国公元芝令护卫责打致死改缓决三达子问绞候刘三于伊犁正法并议处堂官督抚
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三崩寿八十有九庙号高宗谥纯皇帝
