    labels:
      zh:
      - 截漕
      - 筹备
    start_date: 1792-04-28
    highlight_event_id: guji-弘历-event-relief-1792
  - key: climax
    name: 加恩缓徵二十一县及直隶诸州县
    labels:
      zh:
      - 缓徵
      - 恤民
    start_date: 1792-05-05
    highlight_event_id: guji-弘历-event-relief-1792
  - key: closure
    name: 饬查吏弊兼理祈雨庶狱
    labels:
      zh:
      - 核查
      - 祈雨
    start_date: 1792-05-10
    highlight_event_id: guji-弘历-event-relief-1792
  decisions:
  - date: 1792-05-05
    title_zh: 缓徵豫省河北二十一县新旧钱粮仓谷
    rationale: 麦收已属无望民情拮据，缓至秋后以纾民力，并饬实力查察毋任吏胥滋弊
  - date: 1792-05-06
    title_zh: 截留南粮漕米三十万石分运直豫
    rationale: 未报歉收之前先事绸缪，酌量户口灾分接济河北三府及顺德等属，免致临渴掘井
- id: guji-弘历-endeavor-2
  title_zh: 指授福康安进剿廓尔喀
  description: 廓尔喀据险设碉拒守，谕令福康安海兰察惠龄合一路自济咙直前，或扫穴擒渠或慑威受降，并筹粮运善后
  phases:
  - key: brewing
    name: 贼据要隘添设碉卡
    labels:
      zh:
      - 边衅
      - 观瞻
    start_date: 1792-04-15
    highlight_event_id: guji-弘历-event-gurkha-1792
  - key: breakthrough
    name: 定济咙一路并力会攻
    labels:
      zh:
      - 定策
      - 合兵
    start_date: 1792-05-06
    highlight_event_id: guji-弘历-event-gurkha-1792
  - key: climax
    name: 歼戮慑威准酌情纳款
    labels:
      zh:
      - 军威
      - 招抚
    start_date: 1792-05-07
    highlight_event_id: guji-弘历-event-gurkha-1792
  - key: closure
    name: 筹粮运程站及留兵防守
    labels:
      zh:
      - 粮运
      - 善后
    start_date: 1792-05-08
    highlight_event_id: guji-弘历-event-gurkha-1792
  decisions:
  - date: 1792-05-07
    title_zh: 令福康安海兰察惠龄同路由济咙直进
    rationale: 分兵则声势较单难相策应，合一路则势成破竹，聂拉木一带令成德等分驻策应
  - date: 1792-05-08
    title_zh: 准将计就计受降但必先慑以声威
    rationale: 必大加歼戮使十分畏惧穷蹙乞哀，始准投诚，且断不许给银两，永远不犯藏界方为完善
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即位为乾隆皇帝
- id: guji-弘历-event-relief-1792
  title_zh: 降旨缓徵直豫钱粮截漕赈旱
  date: 1792-05-05
  year_of: 1792
  place_zh: 北京圆明园
  description: 因河北彰德卫辉怀庆及顺德广平大名缺雨，谕将安阳等二十一县与邢台元城等州县新旧钱粮仓谷缓至秋后，并截留漕米三十万石运豫接济
- id: guji-弘历-event-gurkha-1792
  title_zh: 预授进剿廓尔喀机宜
  date: 1792-05-07
  year_of: 1792
  place_zh: 北京圆明园
  description: 谕福康安等或直捣贼巢给地各部落，或歼贼慑威后准其悔罪投诚，断不许给银两，增定粮运程站，令成德等驻守聂拉木策应
- id: guji-弘历-event-death
  title_zh: 崩于紫禁城养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城
  description: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
