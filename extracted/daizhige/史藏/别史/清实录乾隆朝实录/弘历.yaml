  dilemmas:
  - 恭奉皇太后巡幸津淀以洽慈欢，与禁绝踵事增华糜费物力之间如何两全
  - 川滇金川军务馈运劳民，与加恩宽恤转输及严督进剿速靖之间如何兼顾
  lesson: 以孝奉亲而不劳民，以实任事而戒虚文，军国大计务实质不务粉饰
  summary_first_person: 朕自避暑山庄回銮，恭奉圣母居畅春园。明春欲奉安舆巡幸津淀阅视河工，一惟民生利病是系，已谕周元理不得点缀繁缛。川省金川军务方殷，朕已加恩给南路站夫回空口粮，并谕温福等用炮轰摧路顶宗碉寨，督丰昇额兼程进剿兜乌。
