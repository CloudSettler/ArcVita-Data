  - title_zh: 石塘柴塘孰为久远
    description_zh: 已费千万帑金改建石塘又须岁修柴塘坦水则前功虚掷不修则恐潮患损民朕愧懑难决
  - title_zh: 河臣获咎与倚任两难
    description_zh: 萨载李奉翰筹办河务错谬当谴然其愧惧劳瘁致疾又不忍重罚惟复顶戴以观后效
  lesson: 保障民生之巨工必求一劳永逸之实若依违迁就不亲勘实陈则帑金虚掷而累及商民
  summary_first_person: 朕弘历五十一年春巡幸五台省方展敬于灵鹫峰文殊寺制诗建幢以昭崇信时以黄运河务海塘石柴之争宵旰焦劳既斥福崧商借之非复遣曹文埴履勘又以萨载溘逝轸惜优恤调李世杰速赴两江冀河防民生两得其安
