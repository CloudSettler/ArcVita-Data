endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 接待英咭唎贡使及处置贡船贡品
  summary: 乾隆五十八年英咭唎贡使航海祝嘏，朕谕令徵瑞金简等照料进京，酌定贡船去留，安设天文地理表等物于正大光明殿，并令西洋人太监学习安装之法
  phases:
  - key: brewing
    name: 贡使由津进京
    labels:
      zh: 照料起旱
    start_date: 1793-08-01
    highlight_event_id: guji-弘历-event-macartney
  - key: breakthrough
    name: 贡品安设圆明园
    labels:
      zh: 安设学习
    start_date: 1793-08-18
    highlight_event_id: guji-弘历-event-tribute-setup
  - key: climax
    name: 申饬照料大臣
    labels:
      zh: 严饬糊涂
    start_date: 1793-08-29
    highlight_event_id: guji-弘历-event-macartney
  - key: closure
    name: 定议贡船先回
    labels:
      zh: 听其自便
    start_date: 1793-08-30
    highlight_event_id: guji-弘历-event-macartney
  decisions:
  - date: 1793-08-29
    title_zh: 饬徵瑞金简伊龄阿会衔速奏
    rationale: 三人推诿观望不据实奏报安装之法故严饬令明日详细覆奏
  - date: 1793-08-30
    title_zh: 准英咭唎贡船先回本国
    rationale: 船内人众不服水土久泊定海供应浩繁听其自便方合怀柔体恤之道
- id: guji-弘历-endeavor-2
  title_zh: 赈恤水旱清理庶狱端正士习
  summary: 因热河久旱京师溽暑，清理徒罪以下以迓甘霖，缓征山东被旱州县旧欠漕粮，抚恤河南河内武陟水灾及江西南昌诸县水患，严饬打捞沉溺铜铅之弊，申禁删本经书以端士习
  phases:
  - key: brewing
    name: 望泽轸民
    labels:
      zh: 祈霖恤民
    start_date: 1793-08-22
    highlight_event_id: guji-弘历-event-relief
  - key: breakthrough
    name: 分别蠲缓抚恤
    labels:
      zh: 蠲缓赈济
    start_date: 1793-08-23
    highlight_event_id: guji-弘历-event-relief
  - key: climax
    name: 严查铜铅盗捞
    labels:
      zh: 除弊务尽
    start_date: 1793-08-19
    highlight_event_id: guji-弘历-event-copper
  - key: closure
    name: 申禁删本整饬士风
    labels:
      zh: 崇实端士
    start_date: 1793-08-26
    highlight_event_id: guji-弘历-event-school
  decisions:
  - date: 1793-08-19
    title_zh: 谕惠龄严缉水摸盗卖铜铅
    rationale: 铜贵铅贱捞获铅多铜少显系私捞盗卖须躧缉铺户窝家惩一儆百
  - date: 1793-08-23
    title_zh: 缓征山东二十七州县旧欠分年带征
    rationale: 上年歉收之后民鲜盖藏新旧并征未免拮据故加恩分年以纾民力
events:
