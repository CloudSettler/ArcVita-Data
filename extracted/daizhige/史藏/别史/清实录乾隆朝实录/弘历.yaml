endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 正月加恩蠲免直省耗羡未完
  description: 以巡幸所至加恩豁免直隶山西河南浙江全免江苏安徽山东六成严饬核实防侵蚀
  phases:
  - key: brewing
    name: 酝酿加恩
    labels:
      zh:
      - 酝酿
    start_date: 1750-02-08
    highlight_event_id: guji-弘历-event-1750-haoxian
  - key: climax
    name: 降旨蠲免
    labels:
      zh:
      - 高潮
    start_date: 1750-02-09
    highlight_event_id: guji-弘历-event-1750-haoxian
  decisions:
  - date: 1750-02-09
    title_zh: 命豁免四省耗羡未完并蠲三省六成
    rationale: 有正供而后有耗羡输将拮据故因巡幸加恩以纾民力
  - date: 1750-02-09
    title_zh: 饬督抚确查实数防吏胥挪抵侵蚀
    rationale: 恐正耗混淆朦混滋弊故以上司徇隐并议处为戒使闾阎沾实惠
- id: guji-弘历-endeavor-2
  title_zh: 定独子留养秋审矜减之例
  description: 矜恤鳏寡茕独于斗殴情轻无次丁侍养者准减等发落著为例
  phases:
  - key: brewing
    name: 轸恤无告
    labels:
      zh:
      - 酝酿
    start_date: 1750-02-09
    highlight_event_id: guji-弘历-event-1750-liuyang
  - key: closure
    name: 定例矜减
    labels:
      zh:
      - 收束
    start_date: 1750-02-09
    highlight_event_id: guji-弘历-event-1750-liuyang
  decisions:
  - date: 1750-02-09
    title_zh: 命查明现存祖父母父母无次丁者以可矜减等请旨
    rationale: 本非谋故重情拘系已足驯桀骜故量为末减俾得自新侍养
  - date: 1750-02-09
    title_zh: 命嗣后秋审朝审声明九卿照此核办著为例
    rationale: 昭轸恤无告之意防淹禁囹圄而孤孀无倚
- id: guji-弘历-endeavor-3
  title_zh: 筹酌驻藏添兵并敕谕准噶尔
  description: 就珠尔默特那木扎勒兄弟构衅戒轻发持重命傅清拉布敦会酌驻兵并驳准噶尔岁遣人赴藏之请
  phases:
  - key: breakthrough
    name: 持重筹边
    labels:
      zh:
      - 推进
    start_date: 1750-02-21
    highlight_event_id: guji-弘历-event-1750-zang
  - key: climax
    name: 敕谕羁縻
    labels:
      zh:
      - 高潮
    start_date: 1750-02-25
    highlight_event_id: guji-弘历-event-1750-zhungar
  decisions:
  - date: 1750-02-21
    title_zh: 命拉布敦抵藏会同傅清详酌添驻与否据实陈奏
    rationale: 五百官兵何足以资防范已彻复往必动彼疑故须明告利害慎重国体
  - date: 1750-02-25
    title_zh: 驳准噶尔每年遣人赴藏请准择少年来京学经
    rationale: 前已两次熬茶大事俯从今无故岁往必滋多增之请且藏王曾请停止故以京师学经助行黄教为两全
