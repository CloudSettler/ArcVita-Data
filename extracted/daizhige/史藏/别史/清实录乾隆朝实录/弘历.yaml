  archetype: 勤政爱民权衡情理之圣君
  dilemmas:
  - 惩治讳灾封疆与安抚灾黎防长刁风之间如何两全
  - 穷治悖逆人心与不因数人获罪而恝视穷黎之间如何并行
  lesson: 赏罚毫无成见惟随时顺应以协乎情理之至当方能得民心而正风俗
  summary_first_person: 朕即位二十余年惟日兢兢以爱养百姓为念巡省至徐闻豫省夏邑等四县积歉密遣访查得实加赈豁欠仍办河工以图补种虽获吴逆伪檄不废抚恤于西陲则命将进兵截哈萨克回部之路擒拿余孽安插归顺并处置喇嘛以靖边圉
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0537.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 经理豫鲁水灾赈恤
  summary: 巡省闻夏邑商邱虞城永城及济宁等州县水灾密访确查惩讳灾加恩赈豁并勘荆山桥河道
  phases:
  - key: brewing
    name: 密访豫省灾情
    labels:
      zh: 密访确查
    start_date: 1757-05-11
