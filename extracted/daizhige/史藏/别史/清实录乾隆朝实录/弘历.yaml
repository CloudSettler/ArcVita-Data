  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆三十四年
  archetype: 勤政肃吏之君
  dilemmas:
  - 前线粮马难继而国体攸关是严催进剿还是量力退守
  - 外任大员染汉习耽逸养尊是姑容历练还是立黜以儆效尤
  - 水旱偏灾叠见而帑藏民力有限是加赈缓徵还是恐滋冒滥
  lesson: 勤察细务始能洞鉴欺饰，进退皆须相机而不过执一端
  summary_first_person: 朕御极三十四年，亲享太庙以承祧，黜汉化之臬司，鞫贿渎之守令，督滇缅之粮马，复以彗星示警而密谕傅恒知难而退，加赈水灾而浚南湖以利农，惟恐一事之疏忽致负苍生
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70844.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 整饬吏治肃清贪渎结纳
  summary: 召见广东臬司富松而黜其汉化耽逸，革审肃宁令王汝木贿嘱减租案，严查贵州威宁亏空铜铅案，拿问江西藩司揆义结纳属员案，正法呈贡令杨家驹科派案
  phases:
  - key: brewing
    name: 召见察言黜富松
    labels:
      zh: 察言观习
    start_date: 1769-10-29
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 革审王汝木及家人押解直隶
    labels:
      zh: 逮问质审
    start_date: 1769-10-30
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 拿问揆义黄肇隆严查亏空
    labels:
      zh: 封产会审
    start_date: 1769-11-02
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 正法杨家驹更定解员失鞘例
    labels:
      zh: 明例正法
    start_date: 1769-11-04
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1769-10-29
    title_zh: 留富松在京另用调补四省臬司
    rationale: 奏对全用汉语深染汉习，久任道员养尊处优忘满洲旧风，不可仍居外任
  - date: 1769-11-02
    title_zh: 革王汝木永泰马元烈派富察善赴黔会审
    rationale: 减租夺佃牵串通贿嘱，威宁亏铜本脚价及少铅七百余万斤，巡抚漫无觉察须封产严究
  - date: 1769-11-03
    title_zh: 革揆义侍卫衔拿解刑部治罪
    rationale: 藩司任内发银代雇优童受馈滥荐违例借养廉，又冒湖北盘获盗犯，已难承恩效力
- id: guji-弘历-endeavor-2
  title_zh: 调度缅事赈恤水利并举
  summary: 命傅恒由戛鸠直抵猛拱长驱深入，申饬阿思哈怯懦催明德彰宝协济粮马，因彗星复见密谕相机进退可守老官屯，加赈江浙湖广水灾命永德履勘浚南湖
  phases:
  - key: brewing
    name: 经略深入猛拱买粮于夷
    labels:
      zh: 长驱筹粮
    start_date: 1769-11-01
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 申饬阿思哈催趱粮马
    labels:
      zh: 严饬接济
    start_date: 1769-11-02
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 彗星复见密谕谨慎进退
    labels:
      zh: 观象慎进
    start_date: 1769-11-03
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 加赈水灾浚南湖利农
    labels:
      zh: 赈恤兴修
    start_date: 1769-11-05
    highlight_event_id: guji-弘历-event-4
  decisions:
  - date: 1769-11-02
    title_zh: 严饬阿思哈协同明德彰宝急运粮马
    rationale: 师行当就地发价购买乃至掠取充用，不可尽待内地接济藉口阻挠，国体所系功过共任
  - date: 1769-11-03
    title_zh: 密谕傅恒防后路相机退守老官屯
    rationale: 彗星复见光照非常，深入险阻须防贼袭其后，若懵驳难获或逃暹罗则不必穷追，当知难而退
  - date: 1769-11-05
    title_zh: 谕各省查勘明春加赈借籽命浚南湖
    rationale: 安徽湖广江西江苏浙江等省被水歉薄，青黄不接恐民食拮据，南湖淤占致杭嘉湖易涝须挑浚宽深
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王第四子，后承大统年号乾隆
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，遗诏传位嘉庆
- id: guji-弘历-event-1
  date: 1769-10-29
  year_of: 1769
  title_zh: 十月朔亲享太庙黜富松
  description: 乾隆三十四年十月己酉朔亲诣太庙行礼，召见广东按察使富松以奏对尽用汉语染汉习，留京候旨以阿扬阿等调补四省臬司
- id: guji-弘历-event-2
  date: 1769-11-02
  year_of: 1769
  title_zh: 革治王汝木刘标揆义杨家驹诸案
  description: 命押解革职肃宁令王汝木及家人赴直隶质审，派富察善会审贵州威宁亏空铜铅十余万两案，拿革职效力之揆义交刑部，正法科派军需之杨家驹
- id: guji-弘历-event-3
  date: 1769-11-03
  year_of: 1769
  title_zh: 申饬军粮密谕缅进退
  description: 以阿思哈奏粮马不敷为怯懦阻挠严行申饬，令明德彰宝协济多运，又以彗星复见密谕傅恒防贼袭后相机攻取阿瓦不成则守老官屯
- id: guji-弘历-event-4
  date: 1769-11-05
  year_of: 1769
  title_zh: 加赈水灾命勘浚南湖
  description: 谕安徽湖广江西江苏浙江等被水州县查勘明春加赈借籽种牛具，缓徵四十九州县八卫额赋漕粮，命永德履勘余杭南湖挑浚宽深永杜水患
