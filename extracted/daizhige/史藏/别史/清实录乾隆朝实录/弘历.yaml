endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 饬部务黜史奕昂以肃吏治
  summary: 念史贻直旧勋擢其子史奕昂为兵部侍郎，察其侵权放恣怨望轻率，降为三品卿回籍读书，并贬彭启丰以儆模棱
  phases:
