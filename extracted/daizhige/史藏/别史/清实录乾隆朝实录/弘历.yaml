  title_zh: 弘历驾崩
  description: 嘉庆四年正月初三日崩于养心殿
- id: guji-弘历-event-qiuxian
  type: career
  date: 1786-10-22
  year_of: 1786
  title_zh: 九月辛未朔行围启銮
  description: 上行围驻跸乌兰哈达伊逊河布敦昂阿阿贵图诸营，谕换各省学政及办台湾会匪案
- id: guji-弘历-event-taiwan
  type: career
  date: 1786-10-22
  year_of: 1786
  title_zh: 谕办诸罗杨功懋兄弟立会杀官案
  description: 以杨功懋杨功宽争财立会纠众夺犯杀把总陈和，命常青黄仕简审明将首要重犯正法示众，恤陈和议叙柴大纪永福
- id: guji-弘历-event-bishu
  type: career
  date: 1786-10-29
  year_of: 1786
  title_zh: 驻跸避暑山庄
  description: 自张三营波罗河屯中关至避暑山庄驻跸，办秋审勾到及宁夏渠工凉州河州总兵对调事
- id: guji-弘历-event-daming
  type: career
  date: 1786-10-28
  year_of: 1786
  title_zh: 严缉大名段文经徐克展邪教案
  description: 以二犯纠众杀官窜往馆陶东北，谕刘峨明兴及盛京各省按薙改面貌密缉焦风德等教首党羽
- id: guji-弘历-event-qiushengou
  type: career
  date: 1786-10-31
  year_of: 1786
  title_zh: 御依清旷勾到秋审官犯
  description: 驻跸山庄勾决秋审，申饬直隶报销延宕及全德伊龄阿失察妄言生事之失
