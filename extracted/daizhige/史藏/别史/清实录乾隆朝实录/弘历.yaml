    title_zh: 令金梁管领伊犁屯田
    rationale: 乌噜木齐屯田已就绪不比伊犁初办金梁兼管贸易可致哈萨克驱牲赴屯
  - date: 1760-11-21
    title_zh: 裁三留七并彻回冗员
    rationale: 新定之区安静无事驻兵无须太多以现有之兵食彼处之粮方为长久
