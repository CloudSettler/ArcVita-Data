  - key: breakthrough
    name: 革斥讳灾封疆
    labels:
      zh: 整饬官方
    start_date: 1757-05-11
    highlight_event_id: guji-弘历-event-gezhi
  - key: climax
    name: 加赈豁欠抚绥
    labels:
      zh: 加恩抚绥
    start_date: 1757-05-12
    highlight_event_id: guji-弘历-event-huanmian
  - key: closure
    name: 获逆檄留任仍办赈
    labels:
      zh: 权衡情理
    start_date: 1757-05-13
    highlight_event_id: guji-弘历-event-liuren
  decisions:
  - date: 1757-05-11
    title_zh: 革图勒炳阿职发往乌里雅苏台效力
    rationale: 初不据实奏报复回护查办玩视民瘼以为讳灾者戒
  - date: 1757-05-12
    title_zh: 豁免四县历年旧欠加赈补给
    rationale: 连年积歉困敝已久不忍因数人悖逆恝视灾黎务使实惠均沾
  - date: 1757-05-13
    title_zh: 因获吴逆伪檄留图勒炳阿孙默等原任
    rationale: 缉邪功大讳灾罪小赏罚随时顺应至当仍令妥办灾务不存成见
- id: guji-弘历-endeavor-2
  title_zh: 追剿准噶尔余部靖边
  summary: 命兆惠等进兵擒贼截哈萨克回部之路晓谕两和卓木协擒并处置喇嘛奖效力台吉
  phases:
  - key: brewing
    name: 命进兵赏效力恤阵亡
    labels:
      zh: 进兵犒赏
    start_date: 1757-05-09
    highlight_event_id: guji-弘历-event-jinbing
  - key: breakthrough
    name: 截哈萨克回部之路
    labels:
      zh: 截路晓谕
    start_date: 1757-05-09
    highlight_event_id: guji-弘历-event-jielu
  - key: climax
    name: 擒获逃窜加恩有功
    labels:
      zh: 擒拿加恩
    start_date: 1757-05-13
    highlight_event_id: guji-弘历-event-qinlu
  - key: closure
    name: 处置准噶尔喇嘛安插归顺
    labels:
      zh: 安抚整饬
    start_date: 1757-05-09
    highlight_event_id: guji-弘历-event-lama
  decisions:
  - date: 1757-05-09
    title_zh: 截哈萨克之路晓谕叶尔羌喀什噶尔协擒
    rationale: 防噶勒藏多尔济逃入哈萨克或投奔回地务令协力查拿毋容留
  - date: 1757-05-09
    title_zh: 不复准噶尔库伦锡哷等名号
    rationale: 准噶尔作孽深重福泽已尽仅留未助恶年老喇嘛酌补管辖不留鄂拓克
  - date: 1757-05-13
    title_zh: 加恩察达克尼玛等亲属编旗安插
    rationale: 感戴奋勇首告报信有劳应加赏翎缎茶及品级以示奖励
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于雍亲王府
  description: 康熙五十年八月十三日生即后之高宗纯皇帝
- id: guji-弘历-event-mifang
  date: 1757-05-11
  year_of: 1757
  title_zh: 密遣观音保访夏邑等四县灾情得实
  description: 巡省至徐闻豫东与徐沛接壤遣员微服密查得积歉流离收买童男持券回奏
- id: guji-弘历-event-gezhi
  date: 1757-05-11
  year_of: 1757
  title_zh: 革图勒炳阿及夏邑永城知县议处司道
  description: 以讳灾回护玩视民瘼革抚发军营效力知县革职拏问管管道府交议
- id: guji-弘历-event-huanmian
  date: 1757-05-12
  year_of: 1757
  title_zh: 豁免豫鲁被水州县旧欠加赈补种
  description: 豁夏邑等四县历年旧欠及济宁等五州县民欠仓谷耔种并命鹤年勘荆山桥疏浚补种晚禾
- id: guji-弘历-event-liuren
  date: 1757-05-13
  year_of: 1757
  title_zh: 因获吴逆伪檄留图勒炳阿等原任仍办赈
  description: 夏邑生员段昌绪家搜出伪檄圈点赞赏以缉邪功大留抚县原任仍命方观承会同根究逆党抚恤灾黎不废
- id: guji-弘历-event-jinbing
  date: 1757-05-09
  year_of: 1757
  title_zh: 谕赏兆惠军前效力及阵亡人员
  description: 进兵两次擒贼奋勇争先者查明赏银准戴翎阵亡查明赐恤
- id: guji-弘历-event-jielu
  date: 1757-05-09
  year_of: 1757
  title_zh: 谕截哈萨克之路晓谕两和卓木协擒
  description: 防噶勒藏多尔济逃窜令成衮扎布派兵往截并饬五十六等赴叶尔羌喀什噶尔晓谕协力查拿
- id: guji-弘历-event-qinlu
  date: 1757-05-13
  year_of: 1757
  title_zh: 擒获德济特等加恩察达克等
  description: 辉特贼人惧罪逃窜分道弋获察达克授内大臣其子补蓝翎侍卫余加赏翎缎茶台吉赏品级
- id: guji-弘历-event-lama
  date: 1757-05-09
  year_of: 1757
  title_zh: 处置准噶尔喇嘛迁热河安插归顺
  description: 达什达瓦部落喇嘛迁热河寺居住准噶尔喇嘛不复库伦名号尼玛等亲属编入察哈尔安插
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于北京紫禁城
  description: 嘉庆四年正月初三日崩享年八十有九
