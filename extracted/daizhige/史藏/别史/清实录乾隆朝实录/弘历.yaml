events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三日雍亲王胤禛第四子弘历生母熹贵妃钮祜禄氏后即乾隆皇帝
- id: guji-弘历-event-qingkou
  title_zh: 谕高晋李宏速办清口防汛
  date: 1771-07-21
  year_of: 1771
  place_zh: 圆明园至清口河工
  description_zh: 戊寅日据李宏奏黄水骤长毛城铺已放仍未消退朕谕高晋已赴清口者悉心妥速办理筑坝防护相度清水黄水消长并令迅速奏闻水势
- id: guji-弘历-event-gansu
  title_zh: 加恩甘省夏灾照秋灾赈恤
  date: 1771-07-24
  year_of: 1771
  place_zh: 北京至甘肃各州县厅
  description_zh: 辛巳日据文绶奏甘省得雨迟者晚禾不能复种朕加恩照秋灾例查明赈恤分别蠲缓拨陕库银二百万及秦甘肃安仓粮并议拨乌鲁木齐屯粮劝流民赴新疆
- id: guji-弘历-event-death
  title_zh: 太上皇弘历崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日太上皇帝弘历崩年在位六十年禅位三年寿八十有九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
