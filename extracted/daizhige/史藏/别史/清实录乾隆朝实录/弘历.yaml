  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆三十八年
  archetype: 励治守成之君
  dilemmas:
  - 朝会大典省时与藩汉分班明等威之间如何权衡
  - 军兴动帑不累民与经过州县民力勤劳之间如何加恩
  - 乘胜穷追金川与严守后路粮台之间如何调度
  lesson: 礼明则分定，恩溥则民安，军谋贵乘机进取而严守后路
  summary_first_person: 朕临御三十八年，元旦受贺察高丽安南陪臣缀朝臣末班，深责礼部颟顸，小金川既平即加恩川陕甘滇黔湖广经过州县缓徵带徵，并拨帑五百万命三路分进再剿金川，务使典礼正而闾阎安，军需充而边患靖
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70924.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 饬正元旦朝会藩臣班礼
  summary_zh: 正旦朝贺见藩使杂于朝臣班末鸣鞭，诘责礼部以仪注塞责，命回奏察议，定诸藩统列一班以明等威
  phases:
  - key: brewing
    name: 藩使缀班含混载入仪注
    labels:
      zh: 礼制松弛
    start_date: 1772-12-01
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 临朝察觉鸣鞭舛误询礼部
    labels:
      zh: 亲察典礼
    start_date: 1773-01-30
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 降旨诘责令礼部回奏察议
    labels:
      zh: 正名定分
    start_date: 1773-01-31
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 定藩部统列一班以存等威
    labels:
      zh: 礼归于正
    start_date: 1773-02-01
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1773-01-31
    title_zh: 谕礼部堂官明白回奏交部察议
    rationale: 元旦大礼关中外瞻视，藩臣不可杂于朝臣之末，仪注常行不可朦胧增损，必专摺请旨以存钜典
  - date: 1773-01-31
    title_zh: 命诸藩于朝臣班外统列一班
    rationale: 既存藩服朝宗之礼，又免一一分班需时，以省时与明分兼顾
- id: guji-弘历-endeavor-2
  title_zh: 小金川荡平后加恩缓徵再剿金川
  summary_zh: 小金川全境荡平后加恩川陕甘滇黔湖广经过州县缓徵分年带徵，并拨银五百万命温福阿桂丰昇额三路分进直捣噶拉依勒乌围
  phases:
  - key: brewing
    name: 小金川荡平民力劳勩当恤
    labels:
      zh: 体恤民劳
    start_date: 1772-12-25
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 加恩缓徵川陕甘滇黔湖广
    labels:
      zh: 普沛春祺
    start_date: 1773-01-31
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 三路分进部署直捣腹心
    labels:
      zh: 乘胜进剿
    start_date: 1773-02-01
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 拨银五百万严守后路粮台
    labels:
      zh: 军需后防
    start_date: 1773-02-02
    highlight_event_id: guji-弘历-event-3
  decisions:
  - date: 1773-01-31
    title_zh: 缓徵四川陕甘等省经过州县钱粮分年带徵
    rationale: 军兴虽动公帑不累闾阎，然趋事奉公积有勤劳，当普新春膏泽使从容输纳永免追呼
  - date: 1773-02-02
    title_zh: 拨部库银五百万解川并命三路分进
    rationale: 小金川既灭当乘胜翦除金川后患，宽储军需严守营盘粮台防贼抄截，使贼技无所施而一举荡平
