    highlight_event_id: guji-弘历-event-ziguangge
  - key: breakthrough
    name: 富虎擒获抢台贼党乌默尔比就获
    labels:
      zh: 突破
    start_date: 1761-02-17
    highlight_event_id: guji-弘历-event-chiyu-hasake
  - key: climax
    name: 敕谕哈萨克阿布赉宽免巴鲁克巴图尔
    labels:
      zh: 高潮
    start_date: 1761-02-19
    highlight_event_id: guji-弘历-event-chiyu-hasake
  - key: closure
    name: 命舒赫德赴喀什噶尔海明赴阿克苏
    labels:
