    name: 逆乱初闻持重调度
    labels:
      zh: 酝酿调度
    start_date: 1781-05-23
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 遣阿桂和珅星夜督办
    labels:
      zh: 遣员督师
    start_date: 1781-05-24
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 厚集陕甘官兵围剿龙尾山
    labels:
      zh: 合围进剿
    start_date: 1781-05-31
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 收复河州击退兰州之围
    labels:
      zh: 初捷收束
    start_date: 1781-05-28
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1781-05-24
    title_zh: 命阿桂由河南驰赴甘肃总统剿务
    rationale: 勒尔谨平日不能约束酿成事端须得熟习军旅重臣悉心筹画尽绝根株
  - date: 1781-05-24
    title_zh: 命和珅海兰察等先行驰往调遣并调京兵四千
    rationale: 甘省急需重臣督办刻不容缓先以和珅星夜兼程俟阿桂到后接办
  - date: 1781-05-31
    title_zh: 留伍弥泰专司领兵勒尔谨仍总理调度
    rationale: 和珅阿桂未到之前使事权归一调度军需粮饷皆有章程
- id: guji-弘历-endeavor-2
  title_zh: 奖功筹饷究咎并分别善后
  summary_zh: 奖守城会剿之功筹拨部库军饷究起衅根由胁从分别宽贷重罪从重治罪以靖边陲
  phases:
  - key: brewing
    name: 奖守兰州收复河州
    labels:
      zh: 奖功励勇
    start_date: 1781-05-28
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 拨饷百万停调客兵省糜费
    labels:
      zh: 筹饷节调
    start_date: 1781-05-29
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 究养痈贻害与新旧教首从
    labels:
      zh: 究咎辨首从
    start_date: 1781-06-04
    highlight_event_id: guji-弘历-event-4
  - key: closure
    name: 恤关厢居民解犯赴热河示儆
    labels:
      zh: 抚恤善后
    start_date: 1781-06-04
    highlight_event_id: guji-弘历-event-4
  decisions:
  - date: 1781-05-28
    title_zh: 加赏王廷赞毕沅仁和等并赏戴花翎顶戴
    rationale: 王廷赞固守省城先诛马明心仁和收复河州毕沅调度合宜皆当优叙以励众心
  - date: 1781-05-24
    title_zh: 再拨部库银一百万两解甘济用
    rationale: 甘省需用紧要春拨八十万两恐不敷须邻省递拨迅速济用
  - date: 1781-06-04
    title_zh: 胁从愚民宽贷出仕从贼者从重治罪
    rationale: 州民被胁情可宽生监草茅可贷惟出仕回籍甘心从贼不顾名义者法无可恕
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  type: birth
  title_zh: 弘历诞生于雍亲王府
  description_zh: 康熙五十年八月十三日生母孝圣宪皇后是为后之高宗纯皇帝
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  type: death
  title_zh: 弘历驾崩于紫禁城
  description_zh: 嘉庆四年正月初三日崩年八十九谥纯皇帝庙号高宗
- id: guji-弘历-event-1
  date: 1781-05-24
  year_of: 1781
  type: career
  title_zh: 闻逆回逼兰州遣阿桂和珅驰赴甘肃
  description_zh: 四月乙巳因毕沅奏逆回焚烧兰州关厢命阿桂由河南星赴甘肃命和珅拉旺多尔济海兰察额森特驰驿前往调健锐火器营兵四千并谕勒尔谨持重和衷共济
- id: guji-弘历-event-2
  date: 1781-05-28
  year_of: 1781
  type: career
  title_zh: 奖王廷赞守城收复河州并优叙仁和等
  description_zh: 四月己酉据奏贡楚达尔截归路收复河州德宁等渡黄河击退逆匪王廷赞固守兰州先诛新教主马明心皆从优议叙赏顶戴花翎荷包
- id: guji-弘历-event-3
  date: 1781-05-31
  year_of: 1781
  type: career
  title_zh: 命厚集兵力围剿龙尾山停调京川客兵
  description_zh: 四月壬子至甲寅逆匪占省城龙尾山梁华林寺仅千余人陕甘兵已及万谕勒尔谨四面围剿停发未起京兵及四川河南山西援兵已出境者各归本营
- id: guji-弘历-event-4
  date: 1781-06-04
  year_of: 1781
  type: career
  title_zh: 谕究起衅根由分别首从抚恤善后
  description_zh: 四月丙辰谕阿桂和珅彻底根究勒尔谨贻误及苏四十三马明心新旧教情节胁从分别办理抚恤兰州河州被蹂居民获犯严解热河如王伦案示儆
