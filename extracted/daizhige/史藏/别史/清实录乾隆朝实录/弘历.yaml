  summary_first_person: 朕弘历即位五年二月亲祭大社大稷复颁敕于噶尔丹策零定阿尔台山梁与扎卜堪之界许其熬茶贸易又申饬喀尔喀守界习武同月革退推诿之魏廷珍以振九卿实心嘉奖河南巡抚雅尔图捕盗整营之勤勉此皆阐教安民之意也
