endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 征缅整军筹饷
  summary: 针对云南绿营怯懦溃散，停补缺额，以旷缺银米供京兵，加给运粮脚价以鼓舞夫马
  phases:
  - key: brewing
    name: 察滇兵怯懦之弊
    labels:
      zh:
      - 整饬
    start_date: 1768-04-03
    highlight_event_id: guji-弘历-event-dianbing
  - key: breakthrough
    name: 定以旷缺养京兵
    labels:
      zh:
      - 调剂
    start_date: 1768-04-03
    highlight_event_id: guji-弘历-event-dianbing
  - key: climax
    name: 加恩运粮脚价
    labels:
      zh:
      - 恤民
    start_date: 1768-04-12
    highlight_event_id: guji-弘历-event-jiajia
  - key: closure
    name: 敕永昌会筹储备
    labels:
      zh:
      - 储备
    start_date: 1768-04-12
    highlight_event_id: guji-弘历-event-jiajia
  decisions:
  - date: 1768-04-03
    title_zh: 停补滇营名粮以供京兵
    rationale: 滇兵不堪用，不复招募子弟糜饷，以所减银米赡八旗劲旅，化无用为有用
  - date: 1768-04-12
    title_zh: 加给运粮夫马银两
    rationale: 进剿需内地接递，加脚价以示鼓舞，使小民均沾实惠
- id: guji-弘历-endeavor-2
  title_zh: 饬吏恤功严纪
  summary: 申饬尤拔世拘俭之谬，彻回晓谕，恤明瑞等阵亡大臣，严究荆门逆犯以靖地方
  phases:
  - key: brewing
    name: 驳节俭教商之谬
    labels:
      zh:
      - 裕商
    start_date: 1768-04-02
    highlight_event_id: guji-弘历-event-youba
  - key: breakthrough
    name: 申饬尤拔世停谕
    labels:
      zh:
      - 饬吏
    start_date: 1768-04-02
    highlight_event_id: guji-弘历-event-youba
  - key: climax
    name: 恤明瑞扎拉丰阿等
    labels:
      zh:
      - 恤忠
    start_date: 1768-04-06
    highlight_event_id: guji-弘历-event-xugong
  - key: closure
    name: 严办荆门逆犯立威
    labels:
      zh:
      - 靖乱
    start_date: 1768-04-06
    highlight_event_id: guji-弘历-event-xugong
  decisions:
  - date: 1768-04-02
    title_zh: 罢尤拔世节俭晓谕
    rationale: 殷商厚赀费用无碍，禁遏则自封，于酌盈剂虚无当，故令停止彻回
  - date: 1768-04-06
    title_zh: 赐恤明瑞谥果烈并严究逆犯
    rationale: 忠勇殒身当祭葬予谥以励军心，奸民谋逆当尽法骈诛以戢奸宄
events:
- id: guji-弘历-event-birth
  title_zh: 出生
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生于雍亲王府，为雍正帝第四子
- id: guji-弘历-event-death
  title_zh: 逝世
  date: 1799-02-07
  year_of: 1799
  description: 嘉庆四年正月初三日崩于紫禁城养心殿，庙号高宗
- id: guji-弘历-event-youba
  title_zh: 申饬尤拔世罢节俭教商
  date: 1768-04-02
  year_of: 1768
  description: 以尤拔世谆谕商人节俭为鄙迂，令停止彻回，并传旨申饬
- id: guji-弘历-event-dianbing
  title_zh: 谕停补滇兵以养京兵
  date: 1768-04-03
  year_of: 1768
  description: 以滇省绿营恇怯溃散，令停补名粮，以旷缺银米供给京派满兵，饬阿里衮等不动声色妥办
- id: guji-弘历-event-jiajia
  title_zh: 加恩运粮脚价
  date: 1768-04-12
  year_of: 1768
  description: 暂停进兵之际加给运送粮石夫马银两，每石每日给银三钱，擡送军装照黔例给发
- id: guji-弘历-event-xugong
  title_zh: 恤明瑞等赐谥祭葬
  date: 1768-04-06
  year_of: 1768
  description: 赐恤受伤身殒之将军明瑞谥果烈，阵亡都统扎拉丰阿谥昭节，自尽参赞珠鲁讷予祭葬世职
