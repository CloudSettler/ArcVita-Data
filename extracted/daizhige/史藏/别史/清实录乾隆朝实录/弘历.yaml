  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆
  archetype: 勤政恤民守成之君
  dilemmas:
  - 遇旱祈祷与修省实政之间如何兼顾感格天心与吏治民生
  - 藏务远驭当镇静持重还是严切问罪之间如何避免激变生事
  - 督抚参劾属员当即令离任整顿还是俟部覆到日之间如何防踞缺营私
  lesson: 敬天法祖勤政爱民，以实心行实政，镇静持重以绥远，整饬纲纪以澄源
  summary_first_person: 朕即位十五年夏，值京畿久旱，麦秋待泽，虔诣黑龙潭祈雨，斋居方泽减陈仪卫，并諭刑部清理徒杖以下减等发落，速结寻常案件，犹令九卿科道直陈阙失，以实意应天，藏主珠尔默特那木扎勒移营萨海调兵运炮，朕详諭傅清拉布敦镇静持重，听其自行自止，俟其积疑冰释，复定督抚题参革职休致降调即行收印署事清查钱粮之例，奉安列祖列后圣容于寿皇殿岁朝合祭，以申追远之诚
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70364.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70364.md
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 畿辅祈雨恤刑修省
  summary_zh: 乾隆十五年夏京师久旱，麦收已减，大田待泽，亲祷清理刑狱减仪斋居，并求直言修省，以实政祈时和
  phases:
  - key: brewing
    name: 入夏不雨轸念麦秋
    labels:
      zh:
      - 久旱轸念
    start_date: 1750-05-05
    highlight_event_id: guji-弘历-event-pray-rain
  - key: breakthrough
    name: 亲诣黑龙潭祈雨虔祷
    labels:
      zh:
      - 虔祷求泽
    start_date: 1750-05-09
    highlight_event_id: guji-弘历-event-pray-rain
  - key: climax
    name: 諭刑部清理徒杖速结恤民
    labels:
      zh:
      - 恤刑祈泽
    start_date: 1750-05-11
    highlight_event_id: guji-弘历-event-clear-prison
  - key: closure
    name: 方泽减仪斋居遇月食修省
    labels:
      zh:
      - 修省应天
    start_date: 1750-05-13
    highlight_event_id: guji-弘历-event-clear-prison
  decisions:
  - date: 1750-05-05
    title_zh: 查照定例敬谨祈雨
    rationale: 二三月得甘霖入夏微雨未沾足，麦秋待泽甚殷，宜申虔祷以慰农望
  - date: 1750-05-11
    title_zh: 照乾隆十年例清理徒杖以下减等发落
    rationale: 清理刑狱亦祈求雨泽一端，速结完案，毋得稽延滋累，并令直隶一体办理
  - date: 1750-05-13
    title_zh: 夏至祭方澤不乘辇不设卤簿并諭九卿科道直陈
    rationale: 值炎燥忧劳又逢望月食既，垂象示儆，当省愆修政，以实不以文，仰格天心
- id: guji-弘历-endeavor-2
  title_zh: 镇静绥藏与整饬吏治参劾
  summary_zh: 针对珠尔默特那木扎勒移营萨海调兵疑有异志，坚持镇静持重释疑绥远，同时针对督抚摺参代题与属员待覆踞缺营私，定题本参劾即令离任清查新例
  phases:
  - key: brewing
    name: 藏报移营萨海调兵运炮
    labels:
      zh:
      - 远驭生疑
    start_date: 1750-05-05
    highlight_event_id: guji-弘历-event-tibet-edict
  - key: breakthrough
    name: 详諭傅清拉布敦释疑镇静
    labels:
      zh:
      - 持重绥远
    start_date: 1750-05-06
    highlight_event_id: guji-弘历-event-tibet-edict
  - key: climax
    name: 定参劾即收印署事清查钱粮
    labels:
      zh:
      - 澄叙官方
    start_date: 1750-05-11
    highlight_event_id: guji-弘历-event-censor-rule
  - key: closure
    name: 缓召班第待纪山陛见再往
    labels:
      zh:
      - 静待自定
    start_date: 1750-05-16
    highlight_event_id: guji-弘历-event-shouhuang-hall
  decisions:
  - date: 1750-05-06
    title_zh: 諭傅清拉布敦镇静持重静待回藏
    rationale: 藏主富贵声势皆藉中朝，利无可图害无可避，据藏不举转至萨海必无异谋，急令释疑转多纠扰，不如听其自行自止
  - date: 1750-05-11
    title_zh: 定督抚参劾概用题本即委员收印署事
    rationale: 昏惰之员留一日即误一日之事，待部覆二三月至半载易乘机舞弊，须即离任清查钱粮以整顿地方
  - date: 1750-05-06
    title_zh: 召纪山来京陛见班第冬间再往藏
    rationale: 频遣大臣前往足致猜疑，前旨令班第往换拉布敦未免过速，宜缓以释积疑
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生
  date: 1711-09-25
  year_of: 1711
  place_zh: 京师雍亲王府
  summary_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即位为乾隆皇帝
- id: guji-弘历-event-pray-rain
  title_zh: 京师祈雨轸念麦秋
  date: 1750-05-05
  year_of: 1750
  place_zh: 京师
  summary_zh: 入夏雨未沾足麦秋已减，降旨查照定例敬谨祈雨，亲诣黑龙潭祈祷，轸念大田待泽
- id: guji-弘历-event-tibet-edict
  title_zh: 詳諭傅清拉布敦镇静绥藏
  date: 1750-05-06
  year_of: 1750
  place_zh: 西藏萨海
  summary_zh: 珠尔默特那木扎勒前往萨海调兵运炮，降旨谓其或自为防范或心怀疑畏，必无异谋，令镇静持重听其自行自止，静待回藏再奏
- id: guji-弘历-event-clear-prison
  title_zh: 諭刑部清理刑狱速结祈泽
  date: 1750-05-11
  year_of: 1750
  place_zh: 京师
  summary_zh: 以清理刑狱为祈雨一端，令刑部将徒杖以下查明释放减等发落，寻常案件速结，并令直隶总督一体办理
- id: guji-弘历-event-censor-rule
  title_zh: 定参劾属员即离任新例
  date: 1750-05-11
  year_of: 1750
  place_zh: 京师
  summary_zh: 以摺奏代题参于体制未协，申饬准泰等，定嗣后参劾革职休致降调概用题本，一面收印署事清查钱粮，著为令
- id: guji-弘历-event-shouhuang-hall
  title_zh: 重修寿皇殿奉安列祖列后圣容
  date: 1750-05-16
  year_of: 1750
  place_zh: 京师寿皇殿
  summary_zh: 寿皇殿增修告成，恭迎太祖太宗世祖及列后圣容奉安，岁朝悬供献笾豆，躬诣行礼，以申追远逮事之诚
- id: guji-弘历-event-death
  title_zh: 弘历驾崩
  date: 1799-02-07
  year_of: 1799
  place_zh: 京师紫禁城养心殿
  summary_zh: 嘉庆四年正月初三日崩，传位嘉庆后为太上皇，谥纯皇帝，庙号高宗
