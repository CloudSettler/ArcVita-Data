    title_zh: 会同大学士清理监禁人犯
    rationale: 雨泽愆期欲感召天和，清理刑狱减等速决可纾民困
  - date: 1740-06-23
    title_zh: 责成冯光裕杜恺就近部署剿抚
    rationale: 总督远隔重湖文移担阁，事贵迅速，须就近围捣竹岔山，剿坚抚胁以振兵威
events:
- id: guji-弘历-event-birth
  date: 1711-09-25
  year_of: 1711
  type: birth
  title_zh: 生于圆明园
  description: 康熙五十年八月十三日生，为雍亲王第四子，后即皇帝位，年号乾隆
- id: guji-弘历-event-death
  date: 1799-02-07
  year_of: 1799
  type: death
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩，寿八十九岁，庙号高宗，谥纯皇帝
- id: guji-弘历-event-qiyu
  date: 1740-06-06
  year_of: 1740
  type: governance
  title_zh: 以旱谕刑部清理刑狱
  description: 乾隆五年五月以雨泽愆期，命大学士军机大臣会同刑部详加分别减等速行发落，并问山东雨水，筹河南买麦运直以裒多益寡
- id: guji-弘历-event-wangshiren
  date: 1740-06-14
  year_of: 1740
  type: governance
  title_zh: 革福建巡抚王士任命严审
  description: 据闽浙总督德沛列款参奏王士任纳贿婪赃，又据御史朱续晫奏其阻挠会审交通郝玉麟，即革职交督臣会同将军严审，并将郝玉麟交部严议
- id: guji-弘历-event-miaojiang
  date: 1740-06-22
  year_of: 1740
  type: military
  title_zh: 命剿抚城步竹岔山苗猺
  description: 据湖南巡抚冯光裕奏城步沈老野等据险劫掳，命冯光裕杜恺就近部署围捣竹岔山，剿擒首逆，抚胁从，革靖协副将姜煓曾靖州知州刘尚质留军前效力
