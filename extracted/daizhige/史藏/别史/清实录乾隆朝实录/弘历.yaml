  - key: closure
    name: 开缺来京防议论纷呶之渐
    labels:
      zh: 收束
    start_date: 1760-11-18
    highlight_event_id: guji-弘历-event-1760-fengchengxiu
  decisions:
  - date: 1760-11-08
    title_zh: 存是斥非定取士章程
    rationale: 禁割截牵搭以崇经义停童试卷磨勘以省烦扰去诗复武之说必不可通
  - date: 1760-11-08
    title_zh: 开缺冯成修来京供职
    rationale: 识见卑诈借事纷纭侈腾口说不可仍令司铎须防明季党援门户恶习
- id: guji-弘历-endeavor-2
  title_zh: 经营伊犁屯田边戍长久之计
  summary_zh: 调乌噜木齐绿营兵赴伊犁屯田命金梁管领兼顾哈萨克贸易节制叶尔羌等城兵额钱粮务食彼处所获不费内地
  phases:
