  decisions:
  - date: 1751-09-14
    title_zh: 再截留江苏漕粮三十万石运浙
    rationale: 浙省被灾较重原留五十万石尚恐不足故再截江漕以资接济并补仓储
  - date: 1751-09-23
    title_zh: 谕浚萧山会稽河道以工代赈
    rationale: 亲见浙河浅窄旱则舟楫不通米价顿昂乘灾兴工可垂永久之利并资贫民糊口
- id: guji-弘历-endeavor-2
  person_id: guji-弘历
  title_zh: 整饬封疆严究伪稿并堵筑豫省河口
  summary: 因滇省传播伪造孙嘉淦奏稿逆词蔓延山东江南即革职拿问隐匿之山东巡抚准泰命鄂容安调补并遣大学士高斌驰赴河南阳武堵筑漫口
  phases:
