  summary_zh: 康熙五十年八月十三日生為雍親王胤禛第四子即後之高宗純皇帝
- id: guji-弘历-event-drought
  title_zh: 諭總理王大臣交警修省
  date: 1737-05-10
  year_of: 1737
  place_zh: 北京紫禁城
  summary_zh: 以天久不雨廷臣奏事甚稀科道少所建白特諭君臣交警直陳民生疾苦時政得失以踐畏天憫民之實
- id: guji-弘历-event-pingdiao
  title_zh: 命發通倉米平糶緩徵
  date: 1737-05-11
  year_of: 1737
  place_zh: 北京京倉五城廠
  summary_zh: 以雨澤愆期米價稍長命每城撥老米二千石減價發糶並議緩徵截漕以備賑濟
- id: guji-弘历-event-maochengpu
  title_zh: 獨斷開浚毛城鋪引河
  date: 1737-05-15
  year_of: 1737
  place_zh: 北京紫禁城
  summary_zh: 披閱河圖召高斌趙宏恩面奏斥夏之芳等惑於浮言革甄之璜鍾衡職命慶復會同高斌確估開浚並曉諭淮揚士民
- id: guji-弘历-event-bailiang
  title_zh: 改減江南浙江白糧
  date: 1737-05-15
  year_of: 1737
  place_zh: 北京紫禁城
  summary_zh: 以白糧費用繁重命王公百官俸米減半以粳抵給餘十二萬石改徵漕糧以紓江浙民力
- id: guji-弘历-event-qiyu
  title_zh: 祈祭天地並清理滯獄
  date: 1737-05-15
  year_of: 1737
  place_zh: 北京天壇地壇刑部
  summary_zh: 以亢旱逾旬虔誠祈禱命禮部太常查典致祭天神地祇並覆勘秋審朝審可原者減等省釋輕罪
- id: guji-弘历-event-death
  title_zh: 崩於養心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城養心殿
  summary_zh: 嘉慶四年正月初三日崩在位六十年禪位後訓政享年八十九諡法天隆運至誠先覺體元立極敷文奮武孝慈神聖純皇帝
