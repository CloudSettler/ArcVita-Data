endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 加恩赈恤浙鲁豫水旱偏灾
  summary_zh: 乾隆十六年秋浙省旱歉米贵鲁豫河涨被淹分别借饷豁免缓徵动仓采买以纾民力
  phases:
  - key: brewing
    name: 浙省宁绍旱歉米价昂贵
    labels:
      zh:
      - 旱灾
      - 米贵
    start_date: 1751-09-22
    highlight_event_id: guji-弘历-event-relief
  - key: breakthrough
    name: 借给浙兵米石季饷接济穷兵
    labels:
      zh:
      - 借饷
      - 体恤兵丁
    start_date: 1751-09-23
    highlight_event_id: guji-弘历-event-relief
  - key: climax
    name: 豁免贵州故兵浮支缓徵豫鲁漕粮
    labels:
      zh:
      - 豁免
      - 缓徵
    start_date: 1751-09-25
    highlight_event_id: guji-弘历-event-relief
  - key: closure
    name: 命鄂容安陈宏谋等通盘筹赈务令得所
    labels:
      zh:
      - 通筹赈务
      - 交代接办
    start_date: 1751-10-01
    highlight_event_id: guji-弘历-event-relief
  decisions:
  - date: 1751-09-22
    title_zh: 豁免贵州故兵家口夏季以前浮支半饷
    rationale: 兵丁效命戎行遗属生计艰难不忍再行追缴故加恩豁免以示优恤
  - date: 1751-09-23
    title_zh: 再借浙江通省兵丁一季饷银明夏分季扣还
    rationale: 旱灾稍重米粮昂贵隆冬穷兵拮据借饷接济并严饬营弁毋侵克
  - date: 1751-09-25
    title_zh: 缓徵豫省被水州县漕项滩地粮银并筹山东赈法
    rationale: 猝遭异涨闾阎拮据米粮为急故缓漕缓滩令通盘计算或给米折或动仓储
- id: guji-弘历-endeavor-2
  title_zh: 申饬各省严查伪造奏稿传播案
  summary_zh: 针对滇黔起抄写传播伪造孙嘉淦奏稿事分别轻重查拏申饬山东湖南山西滇省督抚实力缉办
  phases:
  - key: brewing
    name: 滇黔发觉伪稿移咨湖北查获多犯
    labels:
      zh:
      - 伪稿
      - 传抄
    start_date: 1751-09-26
    highlight_event_id: guji-弘历-event-falsecase
  - key: breakthrough
    name: 直隶山东湖广古北口续获重犯
    labels:
      zh:
      - 根究
      - 提拏质讯
    start_date: 1751-09-28
    highlight_event_id: guji-弘历-event-falsecase
  - key: climax
    name: 研问准泰涂抹发还申饬杨锡绂阿思哈
    labels:
      zh:
      - 严诘
      - 申饬督抚
    start_date: 1751-10-03
    highlight_event_id: guji-弘历-event-falsecase
  - key: closure
    name: 定分别轻重之刑恒文办理可嘉为例
    labels:
      zh:
      - 区别处分
      - 刑协于中
    start_date: 1751-10-05
    highlight_event_id: guji-弘历-event-falsecase
  decisions:
  - date: 1751-09-28
    title_zh: 命兆惠逐条研问准泰涂抹原稿不发之心
    rationale: 和其衷已据实奏闻而准泰始终含糊希图苟且故须诘其发还何意以服其心
  - date: 1751-10-05
    title_zh: 定抄写布散枷示愚懵私抄责惩不必概置典刑
    rationale: 情节种种不同须分别轻重发落既不可宽纵长刁风亦不可概律以大逆
  - date: 1751-10-06
    title_zh: 申饬杨锡绂所办拙谬阿思哈虚应故事令加紧缉办
    rationale: 多派微员改装更名必致泄漏远窜空言搪塞必致疏纵故以准泰前车为戒
