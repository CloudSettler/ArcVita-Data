  decisions:
  - date: 1772-10-06
    title_zh: 谕淀河沿岸不得复滋繁费
    rationale: 明春临幸专为民生利病，与庆典之年不同，水乡清嘉足承慈豫，何藉靡文虚饰耗民力
  - date: 1772-10-12
    title_zh: 定明岁由黄新庄涿州至赵北口登舟
    rationale: 俯循舆望恭请慈谕，取水程安适以洽慈欢，并令各衙门照例敬谨豫备
- id: guji-弘历-endeavor-2
  title_zh: 督办金川军务转输进剿
  summary: 针对小金川路顶宗碉坚地险及南路站夫挽运艰辛，分别施以炮轰进剿与加恩给回空口粮，督温福丰昇额分路速进
  phases:
