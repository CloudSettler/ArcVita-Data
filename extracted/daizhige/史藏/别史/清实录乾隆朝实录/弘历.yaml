endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 木兰秋狝行围与塞外经略
  summary_zh: 乾隆五十一年九月启銮行围经乌兰哈达至避暑山庄，厘定喀尔喀入围习围与侍卫挑补之制
  phases:
