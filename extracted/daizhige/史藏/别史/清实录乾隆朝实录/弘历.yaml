  decisions:
  - date: 1753-04-01
    title_zh: 谕令另立严限
    rationale: 被参之员羁候年久赀产耗竭志气隳颓不可不速结以防好恶之私
  - date: 1753-04-10
    title_zh: 钦改限期为两月四月
    rationale: 原议六月四月仍宽故改为四月两月以示敏干豫奏展限者宽其议处逾旧限者查参
- id: guji-弘历-endeavor-2
  title_zh: 躬耕劝农加恩旗人固本
  summary: 以耕耤躬亲劝农桑以增马甲养育兵调剂旗人生计以固邦本
