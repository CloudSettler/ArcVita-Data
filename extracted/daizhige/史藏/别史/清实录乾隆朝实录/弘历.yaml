  dilemmas:
  - 亢旱之下尽人事还是专恃祈祷
  - 遇灾蠲赈与兴修水利孰为长久之策
  - 宽慰母后慈心与自责省愆如何两全
  lesson: 敬天必先修人事救荒须兼顾眼前赈济与久远水利方能转灾为利
  summary_first_person: 吾即位九年逢京畿亢旱二麦黄萎朕宵旰忧劳省愆祈祷亲制祭文告于风神与方泽又纳御史柴潮生之议经理畿辅水利密令两江豫备米麦分厂平粜以济民食惟愿感召天和不累苍生慈亲
