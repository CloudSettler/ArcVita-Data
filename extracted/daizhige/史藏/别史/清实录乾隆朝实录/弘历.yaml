  - 优容言路与整饬浮嚣之间如何兼顾广纳与政体
  - 灾岁加赈与国用有节之间如何既惠黎元又不糜帑藏
  lesson: 宽严得中方能肃台风而安民生兼收并包亦须明政体以正人心
  summary_first_person: 朕弘历即位十一年于言路浮嚣则止通行甄别而饬改悔于山东江南水旱则叠沛加赈而协济仓谷复于冬至亲祀圜丘以展诚敬惟愿宽严相济以成中治
