  title_zh: 秋审勾决与缘坐幼童新例
  summary: 勾决湖广山东等省情实，于灭门六命缘坐稚子改骈诛为例外监禁，复决曾志广谋叔案以正伦常。
  phases:
  - key: brewing
    name: 湖广山东秋审呈进
    labels:
      zh:
      - 秋审
    start_date: 1779-11-07
    highlight_event_id: guji-弘历-event-clemency-1779
  - key: breakthrough
    name: 矜恤童稚未予勾决
    labels:
      zh:
      - 矜恤
    start_date: 1779-11-08
    highlight_event_id: guji-弘历-event-clemency-1779
  - key: climax
    name: 改定十岁以下永远监禁例
    labels:
      zh:
      - 定例
    start_date: 1779-11-08
    highlight_event_id: guji-弘历-event-clemency-1779
  - key: closure
    name: 通谕内外问刑衙门遵行
    labels:
      zh:
      - 通谕
    start_date: 1779-11-11
    highlight_event_id: guji-弘历-event-clemency-1779
  decisions:
  - date: 1779-11-08
    title_zh: 王喜娃冯大甫冯二甫免勾另议
    rationale: 犯事时仅数岁尚在童稚无知，若概予骈诛究觉不忍，仰体上天好生毋宁失之厚。
  - date: 1779-11-10
    title_zh: 曾志广谋产杀叔拟凌迟即行
    rationale: 期亲胞叔用石殴毙情罪极为可恶，争继酿命者二房三房均不准继立以昭伦纪。
- id: guji-弘历-endeavor-2
  title_zh: 水旱赈恤河防与南巡经略
  summary: 念豫皖甘鄂直苏水雹偏灾谕令查勘加赈缓徵，察河防运河水势，预定南巡日期安民。
  phases:
  - key: brewing
    name: 各省秋成丰稔中察偏灾
    labels:
      zh:
      - 蠲赈
    start_date: 1779-11-08
    highlight_event_id: guji-弘历-event-relief-1779
  - key: breakthrough
    name: 谕令督抚覆奏明春加赈
    labels:
      zh:
      - 加赈
    start_date: 1779-11-08
    highlight_event_id: guji-弘历-event-relief-1779
  - key: climax
    name: 核办河南江苏缓徵豁免
    labels:
      zh:
      - 缓徵
    start_date: 1779-11-11
    highlight_event_id: guji-弘历-event-relief-1779
  - key: closure
    name: 定计南巡江浙启銮日期
    labels:
      zh:
      - 南巡
    start_date: 1779-11-13
    highlight_event_id: guji-弘历-event-tour-1779
  decisions:
  - date: 1779-11-08
    title_zh: 传谕豫皖甘鄂直苏酌奏加赈借种
    rationale: 明春正赈已毕届青黄不接，贫民口食维艰，宜于新正再降恩旨接济。
  - date: 1779-11-13
    title_zh: 明岁正月十二日启銮巡幸江浙
    rationale: 经行山东江南浙江将军等今年停其年班来京陛见，以省迎送而重巡视。
events:
- id: guji-弘历-event-birth
  type: birth
  title_zh: 弘历诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即位为乾隆皇帝。
- id: guji-弘历-event-clemency-1779
  type: career
  title_zh: 改定缘坐幼童永远监禁新例
  date: 1779-11-08
  year_of: 1779
  place_zh: 北京乾清门
  description: 勾决湖广王成山东冯吉各杀一家六命案，其缘坐稚子王喜娃冯大甫冯二甫未予勾，谕嗣后十岁以下拟斩候永远监禁遇赦不释。
- id: guji-弘历-event-relief-1779
  type: career
  title_zh: 谕赈豫皖甘等省水旱偏灾
  date: 1779-11-11
  year_of: 1779
  place_zh: 北京懋勤殿
  description: 以仪封考城堵口未蒇亳州蒙城黄水未涸甘肃雹水虫伤等，谕督抚查勘覆奏加赈，并赈河南十九州县被水灾民缓徵。
- id: guji-弘历-event-tour-1779
  type: career
  title_zh: 预定南巡江浙启銮之期
  date: 1779-11-13
  year_of: 1779
  place_zh: 北京
  description: 谕明岁正月十二日启銮临幸江浙，经行山东江南浙江将军副都统城守尉今年停年班陛见。
- id: guji-弘历-event-death
  type: death
  title_zh: 弘历崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩，年八十九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝。
