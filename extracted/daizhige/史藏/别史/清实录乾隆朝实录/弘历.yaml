  dilemmas:
  - 准部初定而阿睦尔撒纳反复难测，当急诛还是当缓抚以安众心
  - 南巡在即而河工海塘多事，当亲临指挥还是委任封疆以专其责
  lesson: 威德并施而机断为先，抚众以安其业，擒渠以遏其萌，方能拓地而不生衅
  summary_first_person: 朕以藩服初定，人心未安，既欲全准噶尔生灵，又不容奸回煽乱，故密筹擒治渠党，酌定封爵俸禄，赈其贫乏，教其耕牧，同时召尹继善赴热河面谕南巡河务，期以恩威兼济，成一统之业。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70495.md
endeavors:
