  dilemmas:
  - 欲行三年之丧稍尽子臣之谊与群臣请以日易月之制相持
  - 即位之初欲更张兵刑二部而又须安定中外人心
  - 苗疆剿抚两歧前谕与张照奏陈乖谬之取舍
  lesson: 敬天勤民善继善述持孝尽诚方能负荷丕基
  summary_first_person: 朕自冲龄蒙皇祖抚育宫中深恩钟爱又承皇考顾复恩勤朝夕牖迪雍正十三年九月初三祭告天地宗庙社稷即皇帝位于太和殿以明年为乾隆元年丕布新恩议上皇考尊谥庙号并却群臣以日易月之请欲行三年之丧勉守成规不敢自懈
