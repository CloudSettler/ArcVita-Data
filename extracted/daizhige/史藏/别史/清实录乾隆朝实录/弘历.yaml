  dilemmas:
  - 践阼初愿周甲传位与不敢仰希皇祖增载之守约
  - 归政颐养与军国重务不敢自逸仍亲理之权衡
  lesson: 创业守文在敬天勤政，授受之际当信守初愿而仍系念生民，以保泰持盈终始不懈
  summary_first_person: 朕御极六十年，平定伊犁回部大小金川，扩土开疆，十全纪功，普免漕粮地丁，践阼初即默吁上苍若纪年周甲当传位嗣子，今幸符初愿，于丙辰正月上日亲御太和殿授宝于皇太子，即皇帝位，朕为太上皇帝，仍亲理军国重务，开千叟宴于皇极殿以教孝教忠，期与万邦黎献同跻仁寿
  source_urls:
