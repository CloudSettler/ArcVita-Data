  date: 1739-11-01
  year_of: 1739
  place_zh: 南红门行宫
  description_zh: 十一月甲辰朔诣永慕寺行礼行围，驻跸南红门行宫
- id: guji-弘历-event-shudi
  title_zh: 谕议旗地赎回两便
  date: 1739-11-02
  year_of: 1739
  place_zh: 紫禁城
  description_zh: 谕户部会同八旗议公产地价赎回典卖旗地，令直隶总督孙嘉淦详议务令旗人有益民人不扰
- id: guji-弘历-event-dayue
  title_zh: 南苑初行大阅
  date: 1739-11-03
  year_of: 1739
  place_zh: 南苑晾鹰台
  description_zh: 丙午初行大阅，躬擐甲胄连发五矢皆中，亲阅八旗队伍枪炮鹿角阵，定三年一阅并加恩赏赉
- id: guji-弘历-event-xunxingwei
  title_zh: 训饬荆州越境行围
  date: 1739-11-06
  year_of: 1739
  place_zh: 紫禁城乾清门
  description_zh: 以荆州将军衮泰越境赴湖南行围及巡抚冯光裕出示晓谕均未妥协，特行训谕各省将军督抚共知
- id: guji-弘历-event-bafu
  title_zh: 解尹会一河南巡抚任
  date: 1739-11-07
  year_of: 1739
  place_zh: 紫禁城
  description_zh: 以御史宫焕文参奏抚豫谳狱弭盗赈恤未善，解尹会一任来京另用，以兵部侍郎雅尔图补授，嘉宫焕文公直交部议叙
- id: guji-弘历-event-chuanlu
  title_zh: 太和殿传胪武举
  date: 1739-11-15
  year_of: 1739
  place_zh: 太和殿
  description_zh: 戊午御太和殿传胪，赐一甲朱秋魁哈国龙罗英笏武进士及第，二甲刘德成等十人出身，三甲钱夔元等九十八人同出身
