  - date: 1784-03-31
    title_zh: 亲诣曲阜先师庙行释奠诣孔林酹酒
    rationale: 敷文重道，躬行释奠以明崇儒守成，风示士林
- id: guji-弘历-endeavor-2
  title_zh: 奖河工整吏治敷文慎罚
  summary_zh: 奖李奉翰抢护青龙冈金门之劳赏世职，定州县因公按法责毙议处著为令，核四库校对装潢，饬年终汇奏考核，以核实办公
