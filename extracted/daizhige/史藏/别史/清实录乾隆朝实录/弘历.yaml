endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 南巡江浙蠲赈施惠
  summary_zh: 奉皇太后南巡前颁恩谕，蠲免江浙积欠并加赈淮徐灾区
  phases:
  - key: brewing
    name: 酝酿南巡恩典
    labels:
      zh: 问俗省方
    start_date: 1757-02-20
    highlight_event_id: guji-弘历-event-nanxun-juanmian
  - key: climax
    name: 普沛渥恩
    labels:
      zh: 蠲欠加赈
    start_date: 1757-02-21
    highlight_event_id: guji-弘历-event-huaixu-jiazhen
  decisions:
  - date: 1757-02-20
    title_zh: 蠲免江浙二十一年以前积欠地丁
    rationale: 念天时不齐非尽小民之过，新旧并输民力拮据，故概予蠲免以示怀保
  - date: 1757-02-21
    title_zh: 加赈淮徐海属灾区极贫次贫
    rationale: 念连年积歉东作方兴口食拮据，故分别加赈两月三月以资接济
- id: guji-弘历-endeavor-2
  title_zh: 西路平准部署进剿
  summary_zh: 授成衮扎布为定边将军，定期三月内由巴里坤进剿巴雅尔等叛贼
  phases:
  - key: brewing
    name: 简任将军筹兵
    labels:
      zh: 授任定边
    start_date: 1757-02-20
    highlight_event_id: guji-弘历-event-shoujiang-dingbian
  - key: breakthrough
    name: 分路进剿定策
    labels:
      zh: 两路会剿
    start_date: 1757-02-26
    highlight_event_id: guji-弘历-event-qigu-shangdi
  decisions:
  - date: 1757-02-20
    title_zh: 授成衮扎布定边将军领索伦兵赴巴里坤
    rationale: 其熟悉蒙古事务诚心报效，贼势穷蹙易于擒剿，故专任进兵并示体恤
  - date: 1757-02-26
    title_zh: 定两路进兵以成衮扎布为首
    rationale: 军机须相时而动，将帅和衷共济方能成功，故同路则以成衮扎布为首，需分路则兆惠专领一军
events:
- id: guji-弘历-event-birth
  title_zh: 出生
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，是为弘历，后即位为高宗纯皇帝
- id: guji-弘历-event-nanxun-juanmian
  title_zh: 南巡前蠲免江浙积欠
  date: 1757-02-20
  year_of: 1757
  place_zh: 北京乾清宫
  description: 以奉皇太后南巡江浙，谕将江苏安徽浙江乾隆二十一年以前积欠未完地丁概予蠲免，并严饬胥吏毋侵蚀中饱
- id: guji-弘历-event-shoujiang-dingbian
  title_zh: 授成衮扎布定边将军进剿西路
  date: 1757-02-20
  year_of: 1757
  place_zh: 北京
  description: 谕授成衮扎布定边将军，带索伦兵由阿济必济赴巴里坤，舒赫德富德等为参赞，三月内进剿巴雅尔等
- id: guji-弘历-event-huaixu-jiazhen
  title_zh: 加赈淮徐海属偏灾
  date: 1757-02-21
  year_of: 1757
  place_zh: 北京
  description: 念江南淮徐海属连年积歉，谕将清河桃源等十二州县卫极贫加赈三月次贫两月，安东等州县一体加赈
- id: guji-弘历-event-qigu-shangdi
  title_zh: 祈谷于上帝
  date: 1757-02-27
  year_of: 1757
  place_zh: 北京南郊
  description: 辛丑日亲诣南郊祈谷于上帝，斋戒三日后行礼如仪，以祈农事丰稔
- id: guji-弘历-event-death
  title_zh: 逝世
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥纯皇帝
