  - 查灾核实与不误农时之两难
  - 敦叙世臣与秉公用人之权衡
  lesson: 重农必惜农时，整吏先饬大吏，施仁不废法度
  summary_first_person: 朕御极五年，夙夜祗惧，诣畅春园问安之余，留心民瘼吏治，饬禁指荒以劝耕，申饬封疆以振怠，裁抑僭越以正名器，务使恩泽下究而纲纪肃然
  source_urls:
