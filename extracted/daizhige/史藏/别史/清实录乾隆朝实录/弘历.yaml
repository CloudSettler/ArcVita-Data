  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆二十一年
  archetype: 勤政恤民省方观民之君
  dilemmas:
  - 銮舆巡幸省方观民与不以供顿安营累及闾阎之衡
  - 西陲用兵擒逆急切与安抚归顺部落收拾人心之衡
  - 察吏安民欲大厘佐杂积弊与恐扰动官常之衡
  lesson: 省方务动正项蠲赈并行，军务务明辨功罪恩威并施，吏治务上自道府下及佐杂一体稽察，方能溥沾实惠。
  summary_first_person: 朕以乾隆二十一年东巡，谒泰陵祭告阙里，瞻拜少昊陵周公元圣祠，所过直鲁蠲粮，江浙加赈展赈，军流减等，官兵加赏，西陲则督擒唐古忒阿逆，安插厄鲁特，河务则疏浚东西湾入江入河诸道，惟愿不累小民，咸沾庆惠。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷0507.md
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 东巡阙里省方施惠
  description: 以祭告阙里恭谒祖陵东巡省方，严饬供顿动用正项，蠲免直鲁钱粮，加赈江浙灾民场灶，军流减等兵丁加赏
  phases:
  - key: brewing
    name: 启銮谒陵
    labels:
      zh: 谒泰陵驻跸行宫
    start_date: 1756-03-01
    highlight_event_id: guji-弘历-event-patrol
  - key: breakthrough
    name: 颁恩蠲赋
    labels:
      zh: 蠲免直鲁钱粮
    start_date: 1756-03-02
    highlight_event_id: guji-弘历-event-remit
  - key: climax
    name: 祭圣谒陵
    labels:
      zh: 祭告先师瞻拜陵祠
    start_date: 1756-03-15
    highlight_event_id: guji-弘历-event-qufu
  - key: closure
    name: 覃恩收惠
    labels:
      zh: 加赈减等溥惠
    start_date: 1756-03-20
    highlight_event_id: guji-弘历-event-relief
  decisions:
  - date: 1756-03-02
    title_zh: 蠲免直隶山东经过地方钱粮
    rationale: 銮舆所至虽动正项，然安营除道终资民力，故加恩蠲免十分之三，歉收者蠲免十分之五，严饬属员使小民沾实惠
  - date: 1756-03-18
    title_zh: 山东军流以下减等发落
    rationale: 省方观民恩膏叠霈，不忍有罪者不得自新，故广庆惠以昭矜恤
- id: guji-弘历-endeavor-2
  title_zh: 经略西陲兼饬河务吏治
  description: 督策楞等追擒唐古忒与阿睦尔撒纳，晓谕哈萨克锡喇，安插厄鲁特游牧，兼定江南河道疏浚章程并申饬佐杂吏治
  phases:
  - key: brewing
    name: 调度追擒
    labels:
      zh: 命堵截唐古忒
    start_date: 1756-03-05
    highlight_event_id: guji-弘历-event-west
  - key: breakthrough
    name: 明辨安抚
    labels:
      zh: 晓谕哈萨克锡喇
    start_date: 1756-03-06
    highlight_event_id: guji-弘历-event-west
  - key: climax
    name: 疏河察吏
    labels:
      zh: 定芒稻闸水志饬佐杂
    start_date: 1756-03-10
    highlight_event_id: guji-弘历-event-river
  - key: closure
    name: 录用施恩
    labels:
      zh: 复用张师载恤魏廷珍
    start_date: 1756-03-12
    highlight_event_id: guji-弘历-event-river
  decisions:
  - date: 1756-03-06
    title_zh: 晓谕哈萨克锡喇唐古忒诬陷之罪
    rationale: 唐古忒造言哈萨克锡喇依附阿逆，若不明谕恐生疑虑，故当众指出其诈以坚归附之心
  - date: 1756-03-10
    title_zh: 申饬各省督抚稽察佐杂
    rationale: 佐杂秩卑与胥吏相近，最易因批委词讼舞弊害民，不可以恶小而姑容，故通行传谕加意厘剔
events:
- id: guji-弘历-event-birth
  title_zh: 出生
  date: 1711-09-25
  year_of: 1711
  location_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，母孝圣宪皇后钮祜禄氏
- id: guji-弘历-event-death
  title_zh: 驾崩
  date: 1799-02-07
  year_of: 1799
  location_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩，寿八十九，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
- id: guji-弘历-event-patrol
  title_zh: 谒泰陵启巡东省
  date: 1756-03-01
  year_of: 1756
  location_zh: 泰陵及涿州紫泉赵北口一带行宫
  description: 乾隆二十一年二月甲寅谒泰陵，降舆恸哭步入隆恩门行礼，旋驻跸秋澜涿州紫泉赵北口诸行宫，开启祭告阙里之行
- id: guji-弘历-event-remit
  title_zh: 蠲免直鲁钱粮加赈江浙
  date: 1756-03-05
  year_of: 1756
  location_zh: 直隶山东江苏浙江
  description: 谕免直隶山东经过地方本年钱粮十分之三，歉收者免十分之五，又展赈江苏淮属泰属通属场灶灾丁，加赈浙江仁和等十三州县二场及东省沂州府属，拨藩库盐库闲款接办煮赈
- id: guji-弘历-event-west
  title_zh: 督擒唐古忒阿逆安抚厄鲁特
  date: 1756-03-08
  year_of: 1756
  location_zh: 伊犁珠勒都斯哈布塔克拜达克特讷格尔
  description: 命策楞派兵堵截逃往哈布塔克拜达克之唐古忒，详查阿睦尔撒纳是否就擒，命萨喇勒驻特讷格尔协办，晓谕哈萨克锡喇，安插班禅旧人于柴达木，封图们为贝勒，恤玛木特晋封纳噶察贝子
- id: guji-弘历-event-qufu
  title_zh: 祭告阙里瞻拜陵祠
  date: 1756-03-15
  year_of: 1756
  location_zh: 曲阜阙里少昊陵周公元圣祠
  description: 躬诣阙里祭告先师，礼成后亲诣少昊金天氏之陵及周公元圣祠瓣香瞻拜，并谕扈从及德州青州驻防派差兵丁赏给两月钱粮
- id: guji-弘历-event-river
  title_zh: 定河道宣泄章程饬吏治
  date: 1756-03-10
  year_of: 1756
  location_zh: 洪泽湖东西湾芒稻闸范堤一带
  description: 准尹继善等奏挑宽邵伯下东西湾及金湾坝壁虎桥凤凰桥引河芒稻闸下诸河，定水长逾志即开芒稻等闸之例，复申谕督抚稽察佐杂，起用张师载为兵部侍郎，优恤予告尚书魏廷珍
