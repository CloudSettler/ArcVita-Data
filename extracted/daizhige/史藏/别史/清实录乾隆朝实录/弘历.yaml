endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 盛京恭谒祖陵行庆施恩
  summary_zh: 乾隆四十三年秋由山海关至陪京，恭谒永陵福陵昭陵，行大飨礼，阅兴京，蠲免奉天钱粮，宽宥刑狱，加恩旗庄士子耆老
  phases:
  - key: brewing
    name: 启銮东巡酝酿
