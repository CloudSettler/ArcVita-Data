endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 决计再举平定准噶尔擒捕阿睦尔撒纳
  summary: 伊犁初定而阿逆逃窜勾结哈萨克煽惑旧部朕暂令彻兵休息仍明谕必擒调集三路以图一劳永逸
  phases:
  - key: brewing
    name: 伊犁初定阿逆叛窜
    labels:
      zh: 酿势观变
    start_date: 1755-10-01
    highlight_event_id: guji-弘历-event-1756-bice-huangtinggui
  - key: breakthrough
    name: 明谕必剿晓示群臣
    labels:
      zh: 明志定议
    start_date: 1756-12-05
    highlight_event_id: guji-弘历-event-1756-bice-huangtinggui
  - key: climax
    name: 调集三路进剿巴里坤
    labels:
      zh: 进剿正酣
    start_date: 1756-12-08
    highlight_event_id: guji-弘历-event-1756-balikun-zengbing
  - key: closure
    name: 永靖荒服一劳永逸
    labels:
      zh: 收局靖边
    start_date: 1757-02-01
    highlight_event_id: guji-弘历-event-1756-balikun-zengbing
  decisions:
  - date: 1756-12-05
    title_zh: 谕黄廷桂明示必擒阿逆之意
    rationale: 叛贼一日不获则伊犁一日不安边陲一日不靖须使大臣共晓然于已成之功不可挠将来之患不可贻
  - date: 1756-12-08
    title_zh: 命兆惠回师巴里坤协同进剿
    rationale: 巴雅尔等背叛边要需重兵弹压移兵进剿以安反侧而靖荒服计日可定
- id: guji-弘历-endeavor-2
  title_zh: 加赈江苏水灾并整饬州县改教吏治
  summary: 江苏铜沛等州县被水成灾朕预拨邻省银两收贮备用并驳正学政请停改教之议以存因材器使之意
  phases:
  - key: brewing
    name: 江淮被水奏报成灾
    labels:
      zh: 酿势察灾
    start_date: 1756-10-01
    highlight_event_id: guji-弘历-event-1756-jiangsu-zhenxu
  - key: breakthrough
    name: 预拨邻省银两备用
    labels:
      zh: 拨帑加赈
    start_date: 1756-12-02
    highlight_event_id: guji-弘历-event-1756-jiangsu-zhenxu
  - key: climax
    name: 谕斥停改教之请严甄别
    labels:
      zh: 饬吏劝学
    start_date: 1756-12-02
    highlight_event_id: guji-弘历-event-1756-gaizhi-xunchi
  - key: closure
    name: 命邻省本省通融接济
    labels:
      zh: 通融收局
    start_date: 1756-12-06
    highlight_event_id: guji-弘历-event-1756-gaizhi-xunchi
  decisions:
  - date: 1756-12-02
    title_zh: 拨安徽浙江山东河南银一百六十万两赴江苏
    rationale: 将来仍有应行接济之处自宜先期筹画收贮藩库以备加赈不致临时匮乏
  - date: 1756-12-02
    title_zh: 驳谢溶生停州县改教之请
    rationale: 改教原系爱惜人才因材器使学政自当随时纠劾甄别不可以职业废弛尽归咎于改教之例
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  type: birth
  description: 康熙五十年八月十三日生为雍亲王胤禛第四子后承大统年号乾隆
- id: guji-弘历-event-1756-jiangsu-zhenxu
  title_zh: 谕拨邻省银加赈江苏水灾
  date: 1756-12-02
  year_of: 1756
  type: career
  description: 江苏铜沛等州县被水成灾谕于安徽浙江山东河南酌拨银一百六十万两岁内运交江苏藩库备用
- id: guji-弘历-event-1756-gaizhi-xunchi
  title_zh: 谕驳停改教之议申饬学政
  date: 1756-12-02
  year_of: 1756
  type: career
  description: 学政谢溶生请停州县才力不及改教之例朕以因材器使驳之通行传谕并论佐贰亦属地方官不可降补
- id: guji-弘历-event-1756-bice-huangtinggui
  title_zh: 传谕黄廷桂明示必擒阿逆
  date: 1756-12-05
  year_of: 1756
  type: career
  description: 谕黄廷桂阿睦尔撒纳负恩逃窜罪在必诛准噶尔乃皇祖皇考未竟之绪今伊犁已隶版图断无中止之理令来京面谕军需
- id: guji-弘历-event-1756-balikun-zengbing
  title_zh: 命增兵防守巴里坤筹进剿
  date: 1756-12-08
  year_of: 1756
  type: career
  description: 以莽噶里克尼玛等背叛围攻和起命雅尔哈善定安辑巴里坤派安西绿旗兵及吉林察哈尔索伦兵驰赴听调令兆惠回师剿灭
- id: guji-弘历-event-death
  title_zh: 太上皇帝崩于养心殿
  date: 1799-02-07
  year_of: 1799
  type: death
  description: 嘉庆四年正月初三日崩享年八十有九归政后仍训政三年始付嘉庆亲政
