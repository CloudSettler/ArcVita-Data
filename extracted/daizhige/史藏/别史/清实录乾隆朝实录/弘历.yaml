  lesson: 藏务当以抄产济公而以稽核垂久，远贡当以优赉示恩而以礼制正诚
  summary_first_person: 朕御极五十有八年，藏事初定，以沙玛尔巴抄产赏给达赖喇嘛充如绷番兵养赡，命驻藏大臣岁核报部，俾后人循章不弛，英咭唎航海祝嘏，朕令大件贡表留京安设，小件赴热河呈进，并教以三跪九叩之礼，恩礼并施，以昭天朝体恤怀柔之至意
