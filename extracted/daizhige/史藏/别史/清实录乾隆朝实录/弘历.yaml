  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71462.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 直鲁豫三省水灾赈恤蠲豁
  goal_zh: 安置水灾黎民，豁免积欠钱粮，使灾民口食有资不离其乡
  phases:
  - key: brewing
    name: 雨水涨发降旨赈恤
    labels:
      zh:
      - 赈恤
      - 察灾
    start_date: 1794-10-24
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 豁免河南九县缓带银粮
    labels:
      zh:
      - 蠲免
      - 河南
    start_date: 1794-10-25
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 豁免山东八州县二卫积欠
    labels:
      zh:
      - 蠲免
      - 山东
    start_date: 1794-10-25
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 奖叙出力员弁查参侵扣
    labels:
      zh:
      - 奖惩
      - 晓谕
    start_date: 1794-10-24
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1794-10-24
    title_zh: 谕奖叙办赈出力之员并查参克扣
    rationale: 三省虽被水而小民均沾实惠，故当奖出力惩贪懈以示彰瘅
  - date: 1794-10-25
    title_zh: 加恩全豁豫鲁节年缓带银粮
    rationale: 灾区生计拮据，仅免一半未能免追呼，故逾格全免以遂含哺之乐
- id: guji-弘历-endeavor-2
  title_zh: 川楚豫陕甘邪教案查办
  goal_zh: 严拏邪教首伙，究明传教敛钱根株，分别定拟以靖地方
  phases:
  - key: brewing
    name: 来凤抢犯案发饬拏
    labels:
      zh:
      - 缉捕
      - 湖北
    start_date: 1794-10-26
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 嘉奖福宁并令帮办河南
    labels:
      zh:
      - 奖叙
      - 会办
    start_date: 1794-10-26
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 究出甘肃刘松为老教主
    labels:
      zh:
      - 究治
      - 甘肃
    start_date: 1794-10-28
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 分省定拟解襄阳归案
    labels:
      zh:
      - 审拟
      - 归案
    start_date: 1794-10-31
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1794-10-26
    title_zh: 赏福宁玉搬指荷包令审办湖北现获各犯
    rationale: 福宁督饬迅速全获抢犯，故加奖并令趁严办整顿楚省吏治民风
  - date: 1794-10-31
    title_zh: 谕勒保查拏刘松父子并令安徽查拏刘之协
    rationale: 宋之清供词狡猾隐匿上线，既究出刘松刘之协敛钱传教，故须跨省严缉归案
events:
- id: guji-弘历-event-birth
  title_zh: 诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三日生，为雍亲王胤禛第四子，后即位为乾隆皇帝
- id: guji-弘历-event-death
  title_zh: 崩于北京
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城
  description_zh: 嘉庆四年正月初三日崩，享寿八十九岁，庙号高宗
- id: guji-弘历-event-1
  title_zh: 谕豁豫鲁被水州县节年银粮
  date: 1794-10-25
  year_of: 1794
  place_zh: 北京乾清门
  description_zh: 因直鲁豫水灾，将河南汲县等九县及山东临清等八州县二卫节年未完地丁漕粮仓谷全行豁免，并令遍贴誊黄晓谕穷乡
  endeavor_ref: guji-弘历-endeavor-1
- id: guji-弘历-event-2
  title_zh: 奖谕福宁严办邪教抢犯案
  date: 1794-10-26
  year_of: 1794
  place_zh: 北京
  description_zh: 来凤邪教被抢人犯及纠抢匪徒全获，嘉奖福宁，赏玉搬指荷包，令审明湖北现获各犯并帮同河南查拏，究出甘肃刘松为老教主
  endeavor_ref: guji-弘历-endeavor-2
- id: guji-弘历-event-3
  title_zh: 准荷兰国使进京叩祝六旬万寿
  date: 1794-11-01
  year_of: 1794
  place_zh: 北京
  description_zh: 据长麟奏荷兰遣使赍表纳贡，谕不必深论表文体制，准其来京瞻觐，令沿途照料如期到京与宴赉
  endeavor_ref: guji-弘历-endeavor-2
