- id: guji-弘历-event-death
  date: 1799-02-07
  precision: day
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  place: 北京紫禁城养心殿
- id: guji-弘历-event-1765-juanmian
  date: 1765-03-28
  precision: day
  year_of: 1765
  title_zh: 蠲免江浙经过地方额赋十分之三
  description: 乾隆三十年二月癸未，恭奉皇太后四巡江浙，入疆伊始，已豁免缓贷，复蠲江南浙江水陆经过地方本年额赋十分之三
  place: 龙泉庄大营
- id: guji-弘历-event-1765-panxi
  date: 1765-03-29
  precision: day
  year_of: 1765
  title_zh: 申谕藩臬奏事保举之责
  description: 乾隆三十年二月甲申，以豫省河阴归并罢市案为例，谕藩臬遇地方紧要事即专摺奏闻，将来保举知府会同参核
  place: 顺河集行宫
- id: guji-弘历-event-1765-suqian
  date: 1765-03-30
  precision: day
  year_of: 1765
  title_zh: 加免宿迁等四县地丁十分之五
  description: 乾隆三十年二月乙酉，念宿迁桃源清河铜山滨河贫瘠，陆路洒扫勤勚，加恩将四县本年地丁蠲免十分之五
  place: 林家庄大营
- id: guji-弘历-event-1765-yuehe
  date: 1765-04-02
  precision: day
  year_of: 1765
  title_zh: 渡河阅清口谕添木龙
  description: 乾隆三十年二月戊子，奉皇太后渡河，阅清口东坝木龙惠济闸，谕于四龙下一百九十丈添建木龙一架，挑溜冲刷陶庄积土
  place: 淮安清口
