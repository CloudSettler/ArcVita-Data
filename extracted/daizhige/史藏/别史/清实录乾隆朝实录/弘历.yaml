  decisions:
  - date: 1766-11-03
    title_zh: 降史奕昂为三品卿衔回籍读书
    rationale: 器小易盈独侵事权且操守不可信，本应重惩，念老臣子姑宽令闭户变化气质
  - date: 1766-11-03
    title_zh: 命彭启丰降补兵部侍郎
    rationale: 学问虽优而模棱不据实奏对，失大臣之体，当贬以示儆
- id: guji-弘历-endeavor-2
  title_zh: 核生番案戒夸张并赈恤灾民
  summary: 驳苏昌剿番夸张之奏，令酌量外奖不张大论功，复缓徵山东历城等县及直隶被灾州县钱粮以纾民力
  phases:
  - key: brewing
    name: 苏昌奏捷
