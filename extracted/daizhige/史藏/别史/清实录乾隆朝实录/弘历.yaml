  - key: breakthrough
    name: 降旨正法议恤议叙
    labels:
      zh:
      - 正法示众
      - 议恤
    start_date: 1786-10-22
    highlight_event_id: guji-弘历-event-taiwan
  - key: climax
    name: 严饬直鲁缉捕首犯
    labels:
      zh:
      - 缉捕
      - 申饬
    start_date: 1786-10-25
    highlight_event_id: guji-弘历-event-daming
  - key: closure
    name: 通谕沿海各省防脱逃
    labels:
      zh:
      - 海口
      - 严防
    start_date: 1786-10-28
    highlight_event_id: guji-弘历-event-daming
  decisions:
  - date: 1786-10-22
    title_zh: 命将杨功懋等五十三犯审明即行正法示众
    rationale: 以衅起家庭而敢私立会名结党夺犯杀官实属不法须儆效尤
  - date: 1786-10-25
    title_zh: 申饬刘峨明兴上紧躧缉段文经徐克展
    rationale: 以二犯杀官后潜匿多日安然远扬皆地方疏缓所致不可久稽显戮
  - date: 1786-10-28
    title_zh: 谕盛京直隶山东江南等一体按面貌密访海口关隘
    rationale: 防二犯薙须改貌由登莱青海道窜往盛京或邻省潜藏
events:
- id: guji-弘历-event-birth
  type: birth
  date: 1711-09-25
