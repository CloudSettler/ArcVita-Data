      raw: 嘉庆四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清
  reign_ref: 乾隆三十三年
  archetype: 励精守成型帝王
  dilemmas:
  - 持盈保泰与远征缅夷之间如何敬畏天心以应满损之儆
  - 委任封疆与鞭长不及之间如何不委过臣下而深自引咎
  lesson: 席丰履顺之时更当倍增寅畏，边事必察真伪，任人必计始终，不以苟且了事。
  summary_first_person: 朕承累世全盛而缅事棘手，明瑞殉国朕痛自引咎，遂暂缓进兵，先令阿里衮等秋冬肃清普洱九龙江外召散余党，内则整饬考差教职，外则严捕漳浦逆匪，惟以持盈保泰为念。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70808.html
endeavors:
- id: guji-弘历-endeavor-1
  person_id: guji-弘历
  title_zh: 暂缓征缅先靖普洱边外
  goal_zh: 辨缅乞降真伪不苟且了事，集京旅秋冬先除九龙江外么小以壮后图
  phases:
  - key: brewing
    name: 察缅乞降试探之诈
    labels:
      zh:
      - 察伪
      - 筹边
    start_date: 1768-05-16
    highlight_event_id: guji-弘历-event-mianlun
  - key: breakthrough
    name: 明谕暂缓进兵之断
    labels:
      zh:
      - 止兵
      - 待时
    start_date: 1768-05-18
    highlight_event_id: guji-弘历-event-mianlun
  - key: climax
    name: 秋冬进剿九龙江外召散余党
    labels:
      zh:
      - 翦羽
      - 振威
    start_date: 1768-05-22
    highlight_event_id: guji-弘历-event-mianlun
  - key: closure
    name: 核贸易米粮以备再举
    labels:
      zh:
      - 核饷
      - 备进
    start_date: 1768-05-23
    highlight_event_id: guji-弘历-event-mianlun
  decisions:
  - date: 1768-05-16
    title_zh: 缅使乞降不代奏不折看
    rationale: 大头人不至仅托被擒兵丁带书牵率土司为辞，显系试探，故驳回以观其急，俟亲来或遣大头人方代奏。
  - date: 1768-05-22
    title_zh: 明瑞殉事深自引咎并暂缓进兵
    rationale: 额勒登额迁延误援致明瑞殿后捐躯，京兵未集瘴气未退，宜先以劲旅翦普洱零匪，净尽根株再图阿瓦。
- id: guji-弘历-endeavor-2
  person_id: guji-弘历
  title_zh: 整饬考差教职并速靖漳浦奸匪
  goal_zh: 正乡试考差体例，清教职积弊，严法惩漳浦聚众图劫以靖地方
  phases:
  - key: brewing
    name: 乡试试差拣选引见
    labels:
      zh:
      - 抡才
      - 正体
    start_date: 1768-05-16
    highlight_event_id: guji-弘历-event-chanqiu
  - key: breakthrough
    name: 饬詹事府都察院瞻徇之失
    labels:
      zh:
      - 饬官
      - 议处
    start_date: 1768-05-17
    highlight_event_id: guji-弘历-event-chanqiu
  - key: climax
    name: 定教职甄别暂署之例
    labels:
      zh:
      - 澄铎
      - 补缺
    start_date: 1768-05-19
    highlight_event_id: guji-弘历-event-mianlun
  - key: closure
    name: 漳浦获逆务尽根株从重惩治
    labels:
      zh:
      - 靖乱
      - 儆奸
    start_date: 1768-05-20
    highlight_event_id: guji-弘历-event-mianlun
  decisions:
  - date: 1768-05-19
    title_zh: 督抚考验教职从严二等举人暂署悬缺
    rationale: 临期考验积成具文，迟到悬缺废弛督课，故令详慎甄别严参迟逾，以候选二等举人挨次暂署，一举两得。
  - date: 1768-05-20
    title_zh: 漳浦助逆骈诛不存姑息
    rationale: 卢茂造悖逆诗词聚众图劫县城，虽已多获而余党尚多，若仅诛首恶不足戢奸，故令悉力擒捕按律骈诛毋漏网。
events:
- id: guji-弘历-event-birth
  person_id: guji-弘历
  type: birth
  title_zh: 弘历诞生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  location_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三日诞生，即后之高宗纯皇帝，开乾隆全盛之局。
- id: guji-弘历-event-chanqiu
  person_id: guji-弘历
  type: career
  title_zh: 南郊斋宿亲行常雩祀天
  date: 1768-05-18
  year_of: 1768
  location_zh: 南郊斋宫圜丘圆明园
  description_zh: 乾隆三十三年四月初三庚申亲诣圜丘行常雩礼，前后问皇太后安驻跸圆明园静宜园，肃躬郊祀以昭寅畏。
- id: guji-弘历-event-mianlun
  person_id: guji-弘历
  type: career
  title_zh: 勤政殿论缅事自咎暂缓进兵
  date: 1768-05-22
  year_of: 1768
  location_zh: 北京勤政殿
  description_zh: 乾隆三十三年四月初七甲子御勤政殿听政，明切宣谕明瑞深入殉国始末，深咎轻视缅匪未早简大臣代额勒登额，令阿里衮舒赫德鄂宁暂缓进兵，秋冬先剿九龙江外召散余党，并详查茂隆厂十三版纳蛮暮贸易米粮诸情。
- id: guji-弘历-event-death
  person_id: guji-弘历
  type: death
  title_zh: 太上皇崩于养心殿
  date: 1799-02-07
  year_of: 1799
  location_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩，享年八十有九，结束六十三年乾隆之治，归政未久而升遐。
