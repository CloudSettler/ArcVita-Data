  decisions:
  - date: 1751-03-10
    title_zh: 命将珠尔默特那木扎勒妻子即在藏中诛戮并正法董恭
    rationale: 叛逆之罪既显当照叛逆之律办理以为众戒文员临事退缩贻笑番邦亦非立置重典无以示戒故宣谕中外
  - date: 1751-03-16
    title_zh: 驳赴藏熬茶请限定肃州贸易以十三年数为准
    rationale: 既无追报先人之大事则断不可屡派官兵照管贸易屡增无厌则将来必至驳回故明切晓谕永远遵照以平其心而有节制
events:
- id: guji-弘历-event-birth
  title_zh: 生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三生为雍亲王胤禛第四子后承大统为高宗纯皇帝
- id: guji-弘历-event-nanxun
  title_zh: 南巡驻跸苏州阅兵行庆
  date: 1751-03-08
  year_of: 1751
  place_zh: 苏州府行宫灵岩山行宫
  description_zh: 乾隆十六年二月南巡驻跸苏州诣皇太后行宫问安阅兵赐扈从及准噶尔使食颁训饬去奢崇实之谕
- id: guji-弘历-event-jiangnan-huimin
  title_zh: 蠲豁江南漕赋役租并试士子
  date: 1751-03-10
  year_of: 1751
  place_zh: 苏州
  description_zh: 豁免武进阳湖开抵役租分作三年带徵淮徐八州县一卫灾漕豁免兴化积欠并命傅恒等会试江浙献诗士子
- id: guji-弘历-event-xizang-chuzhi
  title_zh: 谕处珠尔默特那木扎勒妻子并正法董恭
  date: 1751-03-10
  year_of: 1751
  place_zh: 北京行在苏州
  description_zh: 据班第奏珠尔默特那木扎勒勾通准夷逆迹已露追认傅清拉布敦奋不顾身尽忠报国命将叛妻子即在藏诛戮并将畏葸扣饷之泸州州同董恭即于藏中正法示众
- id: guji-弘历-event-zhungeer-chishu
  title_zh: 赐准噶尔台吉喇嘛达尔扎敕书定贸易成数
  date: 1751-03-16
  year_of: 1751
  place_zh: 嘉兴石门
  description_zh: 驳其遣人赴藏熬茶之请准延高等喇嘛教习之请待抒诚具奏再遣并定肃州贸易毋过乾隆十三年之数来使以尼玛来数为准
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三崩寿八十有九归政训政后以太上皇帝崩谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
