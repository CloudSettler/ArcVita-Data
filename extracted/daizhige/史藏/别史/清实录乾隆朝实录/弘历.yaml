  summary_first_person: 余以眇躬缵承大统念皇祖六巡东南之盛典故于辛未春省方江浙所至观民察吏叠沛恩膏蠲豁漕赋试拔士类训以去奢崇实又因珠尔默特那木扎勒勾通准夷背逆伏诛即明正国法以彰众戒并以敕书定准噶尔贸易成数使远人知敬谨遵行庶几教养兼施中外乂安
