- id: guji-弘历-event-weigao
  title_zh: 七月丁亥宽宥吴进义并严究伪稿
  date: 1752-08-23
  year_of: 1752
  description: 以吴进义见伪稿不奏又捏饰拟斩候，念其封疆年老革职免罪，仍令各督抚严究首恶毋委病故
- id: guji-弘历-event-death
