    title_zh: 高堰告竣交部议叙
    rationale: 石工半载告竣，运道民生均资利益，当奖勤劳以劝效力
  - date: 1754-05-27
    title_zh: 侵帑逾限即正法并著落高斌张师载代赔
    rationale: 劣员任意侵蚀贻害民生，屡谕法在必行，断不容侥幸延玩
