- id: guji-弘历-event-3
  title_zh: 命兆惠进兵叶尔羌并赏巴图鲁
  date: 1759-06-12
  year_of: 1759
  kind: career
  summary_zh: 闻霍集占于叶尔羌附近耕种命加意备办攩牌大炮云梯严截逃路赏吉林索伦奋勇十四人巴图鲁号优恤脱出兵丁
