- id: guji-弘历-event-tibet
  person_qid: guji-弘历
  title_zh: 谕以沙玛尔巴抄产赏给达赖喇嘛并令稽核
  date: 1793-08-08
  year_of: 1793
  type: career
  description: 乾隆五十八年七月初二谕军机大臣，和琳奏抄产估变银六万四千余两赏给达赖喇嘛充如绷番兵养赡，命驻藏大臣岁核动用余剩分报户部理藩院
- id: guji-弘历-event-british
  person_qid: guji-弘历
  title_zh: 谕办英咭唎贡品留京与演习朝仪
  date: 1793-08-13
  year_of: 1793
  type: career
  description: 乾隆五十八年七月谕徵瑞梁肯堂，大件天文地理音乐表等留京安设于圆明园，余件赴热河呈进，并教使臣习跪叩遵天朝礼节
- id: guji-弘历-event-river
  person_qid: guji-弘历
  title_zh: 谕督办黄沁河工抢护平稳
  date: 1793-08-09
  year_of: 1793
  type: career
  description: 乾隆五十八年七月谕书麟等黄河水涨抢护平稳，饬秋汛倍加敬慎防范，俟安澜议叙
- id: guji-弘历-event-death
  person_qid: guji-弘历
  title_zh: 弘历驾崩
  date: 1799-02-07
  year_of: 1799
  type: death
  description: 嘉庆四年正月初三日驾崩于紫禁城养心殿
