    title_zh: 谕路顶宗宜用炮轰击兜乌兼程速进
    rationale: 地险碉坚不宜徒攻，以炮摧坚最要，兜乌虽搭桥筑卡，必亲身督办方有益
  - date: 1772-10-09
    title_zh: 照进剿金川例给回空口粮
    rationale: 南路食物较昂站夫负戴远行仅堪果腹，加恩炉内日折银五分炉外八分使挽运倍加出力
