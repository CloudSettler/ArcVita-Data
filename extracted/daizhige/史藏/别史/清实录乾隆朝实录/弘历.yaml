endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 羁縻川边杂谷善后
  summary_zh: 瞻对金川用兵之后杂谷苍旺就擒诫川督黄廷桂等慎重善后不究既往置郭罗克远番于不问以安边圉
  phases:
  - key: brewing
    name: 瞻对金川频年用兵民气未复
    labels:
      zh: 边务蓄势
    start_date: 1752-09-01
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 杂谷进剿苍旺就擒奏捷
    labels:
      zh: 乘胜奏捷
    start_date: 1753-03-04
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 降旨诘问攻坚奏报自相矛盾
    labels:
      zh: 明辨功罪
    start_date: 1753-03-04
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 命黄廷桂确查善后置郭罗克不问
    labels:
      zh: 休息安边
    start_date: 1753-03-04
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1753-03-04
    title_zh: 姑念事竣不究策楞等但令留心善后
    rationale: 番酋恃险而官兵长驱无阻奏报矛盾若深求必获重谴不如予以休息以安众心
  - date: 1753-03-04
    title_zh: 斥岳钟琪请赴松潘擒捕郭罗克之谬
    rationale: 不知出师杂谷之非而欲用兵徼外远番将致他番惊骇非绥辑边圉之道
- id: guji-弘历-endeavor-2
  title_zh: 整饬营伍巡谒泰陵尽孝
  summary_zh: 延安营兵聚众塞署而总兵马乾畏懦取巧交部严察议革同时启銮谒泰陵躬奠哀恸以申孝思
  phases:
  - key: brewing
    name: 延安兵丁因扣饷制装起衅
    labels:
      zh: 营伍积弊
    start_date: 1753-03-05
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 马乾亲赴延城一宿遽返未讯首从
    labels:
      zh: 畏懦暴露
    start_date: 1753-03-05
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 交部严察议奏革职马乾以儆戎行
    labels:
      zh: 严肃军纪
    start_date: 1753-03-06
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 启銮谒泰陵步入隆恩门躬奠
    labels:
      zh: 巡谒尽孝
    start_date: 1753-03-13
    highlight_event_id: guji-弘历-event-3
  decisions:
  - date: 1753-03-06
    title_zh: 将延绥镇总兵马乾交部严察议奏
    rationale: 身总戎行遇兵丁滋事不率先弹压严拏详究而避罪取巧实属有玷职守
  - date: 1753-03-13
    title_zh: 未至碑亭即降舆恸哭步谒泰陵
    rationale: 追慕皇考恩深以身先尽孝使臣民观感知礼
