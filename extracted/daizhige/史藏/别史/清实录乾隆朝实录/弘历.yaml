endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 免堤租革余平兼赈豫灾
  description: 乾隆二年闰九月免江南河堤屋租禁增建，革川省耗羡外余平，并赈恤河南被水州县
  phases:
  - key: brewing
    name: 体恤堤居贫民
    labels:
      zh: 免租恤贫
    start_date: 1737-10-24
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 革除川省余平
    labels:
      zh: 清弊止扰
    start_date: 1737-10-24
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 加恩豫省灾民
    labels:
      zh: 缓赋赈济
    start_date: 1737-11-01
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 敕部速议施行
    labels:
      zh: 施惠务实
    start_date: 1737-11-01
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1737-10-24
    title_zh: 永停堤房租银并禁添建
    rationale: 念茅檐贫户输公追呼之苦，欲固河防而兼存体恤，故豁欠停徵并禁将来增盖
  - date: 1737-10-24
    title_zh: 永革川省余平提解
    rationale: 火耗报官本以杜贪，若耗外再提则层层剥削，故于存公耗羡内支给以杜需索
  - date: 1737-11-01
    title_zh: 缓豫省额赋并加赈两月
    rationale: 西华等四县被水稍宽已赈三月，仍虑催科艰难，故缓至麦熟后徵，八县乏食者冬春加赈
- id: guji-弘历-endeavor-2
  title_zh: 止苗田屯军定武职休致
  description: 乾隆二年闰九月停止贵州古州苗田屯军另筹布置，并定八旗年老武职休致给俸之例
  phases:
  - key: brewing
    name: 筹议苗田安屯
    labels:
      zh: 经理苗疆
    start_date: 1737-11-04
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 询得拨换未妥实情
    labels:
      zh: 明辨利害
    start_date: 1737-11-04
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 速谕停止屯军慰苗众
    labels:
      zh: 安人心息争
    start_date: 1737-11-04
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 定年老武职给俸全末路
    labels:
      zh: 优恤武弁
    start_date: 1737-11-02
    highlight_event_id: guji-弘历-event-4
  decisions:
  - date: 1737-11-04
    title_zh: 即行停止古州苗田屯军
    rationale: 经理苗疆原期宁辑化导而非利其土，拨换难免以瘠易肥，故止屯彻官熟筹万妥以安苗众
  - date: 1737-11-04
    title_zh: 特颁谕旨晓谕苗众
    rationale: 既宥叛罪革除粮额，若再收其田产则轻重失宜，故明示不夺故业令其悔过安分
  - date: 1737-11-02
    title_zh: 定年老武职留任休致给俸例
    rationale: 武员效力有军功者若概以年老摈斥情属可悯，故精力未衰者留任或调简缺，衰惫者分别给全俸半俸
events:
- id: guji-弘历-event-birth
  title_zh: 出生
  date: 1711-09-25
  year_of: 1711
  description: 生于北京雍亲王府，为雍正帝第四子，母为孝圣宪皇后
- id: guji-弘历-event-death
  title_zh: 驾崩
  date: 1799-02-07
  year_of: 1799
  description: 在北京紫禁城养心殿逝世，传位嘉庆后以太上皇训政，享年八十九岁
- id: guji-弘历-event-1
  title_zh: 免河堤屋租并禁耗羡外余平
  date: 1737-10-24
  year_of: 1737
  description: 乾隆二年闰九月谕免江南五州县堤房租银并豁欠，禁将来增建，又永革川省每百两提解六钱之余平
- id: guji-弘历-event-2
  title_zh: 赈恤河南被水州县
  date: 1737-11-01
  year_of: 1737
  description: 以西华浚县等四县被水稍宽，已赈三月，特缓本年额赋至明年麦熟后徵，永城等八县乏食者冬春加赈两月
- id: guji-弘历-event-3
  title_zh: 停止贵州古州苗田屯军
  date: 1737-11-04
  year_of: 1737
  description: 以张广泗办理逆苗绝产安设屯军拨换未妥，速谕停止彻官，另筹布置，并颁旨晓谕苗众安业
- id: guji-弘历-event-4
  title_zh: 定八旗武职年老休致给俸例
  date: 1737-11-02
  year_of: 1737
  description: 以荆州将军请议年老佐领，谕九卿会议，定出兵效力者留任或给全俸半俸，分别办理以全末路
