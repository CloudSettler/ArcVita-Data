  summary_first_person: 朕继统以来仰承皇祖皇考之业准噶尔为西北宿患垂四百年今乘其携离平定伊犁虽阿逆叛窜屡生事端朕必期擒获以靖荒服至江淮水旱朕先期拨帑加赈惟愿吏治澄清民生安乐不以好大喜功为心而以永除后患为务
