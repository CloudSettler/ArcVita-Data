      - 引河挑挖
    start_date: 1778-09-09
    highlight_event_id: guji-弘历-event-mangong
  - key: breakthrough
    name: 川米淮漕调剂突破
    labels:
      zh:
      - 川省碾米运楚
      - 截留漕粮赈粜
    start_date: 1778-09-09
    highlight_event_id: guji-弘历-event-zhenxu
  - key: climax
    name: 昼夜进埽合龙高潮
    labels:
      zh:
      - 一日四丈
      - 九月内外完竣
    start_date: 1778-09-10
    highlight_event_id: guji-弘历-event-mangong
  - key: closure
    name: 缓徵优恤收束
    labels:
      zh:
      - 缓徵粟豆
      - 平粜煮赈
    start_date: 1778-09-18
    highlight_event_id: guji-弘历-event-huanzheng
  decisions:
  - date: 1778-09-09
    title_zh: 令高晋昼夜进埽迅速合龙
    rationale: 天气连晴料物趱运，当乘时跟镶以慰悬注，兼查淤垫分别疏浚或留作外护
  - date: 1778-09-18
    title_zh: 缓仪封等县本年粟米豆麦至次年秋后
    rationale: 被灾较重贫民拮据，既拨帑截漕赈恤，再缓输将以纾民力
events:
- id: guji-弘历-event-birth
  title_zh: 生于圆明园牡丹台
  date: 1711-09-25
  year_of: 1711
  place: 圆明园
  description: 康熙五十年八月十三日生，为雍亲王胤禛第四子，母熹贵妃钮祜禄氏
- id: guji-弘历-event-dongxun
  title_zh: 自山海关启銮东巡陪京
  date: 1778-08-20
  year_of: 1778
  place: 山海关至盛京
  description: 时当秋获丰登，跸路所经村村殷阜，老幼扶携欢迎，办差官员加级，免所过地方钱粮十分之三
- id: guji-弘历-event-yongling
  title_zh: 恭谒永陵福陵躬奠哀恸
  date: 1778-09-12
  year_of: 1778
  place: 永陵福陵
  description: 未至碑亭即降舆恸哭，步入启运门隆恩门，诣宝城前行礼躬奠，王以下文武大臣随行礼
- id: guji-弘历-event-mangong
  title_zh: 谕高晋堵筑仪封漫工
  date: 1778-09-09
  year_of: 1778
  place: 仪封考城
  description: 东西坝台已筑成，令俟料敷接手昼夜进埽跟镶，以一日四丈计五十二日完竣，分段挑挖引河筑拦河坝
- id: guji-弘历-event-zhenxu
  title_zh: 命萨载闵鹗元赈恤亳寿水旱灾民
  date: 1778-09-10
  year_of: 1778
  place: 亳州蒙城寿州凤台
  description: 亳蒙被水十分之八九，怀远宿州凤阳灵璧五河洼地被淹，令动仓设厂平粜，先给一月口粮，调川米江西漕米接济
- id: guji-弘历-event-zhaoling
  title_zh: 恭谒昭陵行大飨礼
  date: 1778-09-16
  year_of: 1778
  place: 昭陵
  description: 诣昭陵行大飨礼，遣官祭寿康太妃宸妃等园寝及克勤郡王武勋王等墓，祭长白山辽河浑河松花江诸神
- id: guji-弘历-event-kuanmian
  title_zh: 蠲免奉天钱粮宽宥旗庄
  date: 1778-09-18
  year_of: 1778
  place: 盛京
  description: 通行蠲免奉天四十四年地丁正项，免盛京户部庄头仓粮万余石，十五处旗地米豆草束免徵一半，加恩科考广额优老
- id: guji-弘历-event-huanzheng
  title_zh: 缓徵豫省被灾州县粟豆麦
  date: 1778-09-18
  year_of: 1778
  place: 仪封考城商邱宁陵睢州祥符陈留杞县
  description: 将八州县本年应徵粟米三万余石豆五千余石及祥符等六州县麦一千余石，一并缓至次年秋后徵还
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place: 紫禁城养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
