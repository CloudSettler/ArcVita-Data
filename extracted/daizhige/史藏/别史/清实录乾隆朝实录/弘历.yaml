    title_zh: 自乾隆三年停解减半平余
    rationale: 平余出自民力，留贮司库备荒赈济，杜绝外吏借端需索
  - date: 1738-02-28
    title_zh: 命督抚议减平和清流永安丁银
    rationale: 三县田少丁重，较别邑加倍，须酌量裁减以一体沾恩
