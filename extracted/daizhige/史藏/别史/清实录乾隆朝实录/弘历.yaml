    start_date: 1757-07-17
    highlight_event_id: guji-弘历-event-hengwen
  - key: breakthrough
    name: 命刘统勋定长查实革职拏问恒文
    labels:
      zh: 突破
    start_date: 1757-07-17
    highlight_event_id: guji-弘历-event-hengwen
  - key: climax
    name: 禁金器贡献并审断段彭逆书案
