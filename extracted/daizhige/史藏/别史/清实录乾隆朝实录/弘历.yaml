  dilemmas:
  - 金川叛服靡常剿抚之间何以一劳永逸而不黩武
  - 普免加赈而民气渐骄聚众抗官何以教养兼施
  - 令大臣举贤自代而瞻顾党同何以得真材而杜私援
  lesson: 德威并施教养兼尽方能靖边安民而致久治
  summary_first_person: 朕临御至十二年夏值京师望霖金川煽乱山东歉收山西刁抗之会乃省刑祈雨增饷进剿定举代之例颁化导之谕思以尽剿靖边以惠恤怀民以课吏正俗
