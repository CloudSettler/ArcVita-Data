  - 赈恤治水与迁建城垣之间如何兼顾国费与安土重迁之民情
  - 国史褒贬予夺之间如何持平天理人情以垂纲常法戒
  lesson: 治水先察地宜勿轻纷更以扰民修史必衷至公以正名分
  summary_first_person: 朕弘历即位三十一年于仪封夏邑考城百年积潦不忍驱民他徙令疏泄化为膏壤于国史洪承畴传唐王加伪字特加厘正务使名分秩然以昭大中至正
  source_urls:
