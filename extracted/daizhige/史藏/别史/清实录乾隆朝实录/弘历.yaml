endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 调兵援藏讨廓尔喀
  summary: 巴勒布廓尔喀抢掠济咙聂拉木，谕四川调屯练驻防绿营三千赴藏，筹粮饷火药，檄谕令退地悔罪
  phases:
  - key: brewing
    name: 闻警调拨
    labels:
      zh: 调兵筹饷
    start_date: 1788-09-09
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 筹粮晓谕
    labels:
      zh: 就近采买
    start_date: 1788-09-10
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 明降檄文
    labels:
      zh: 恩威并施
    start_date: 1788-09-12
    highlight_event_id: guji-弘历-event-3
  - key: closure
    name: 布置堵剿
    labels:
      zh: 慎密办理
    start_date: 1788-09-13
    highlight_event_id: guji-弘历-event-3
  decisions:
  - date: 1788-09-09
    title_zh: 不用巴塘里塘番众续调驻防屯练
    rationale: 巴塘里塘惯放夹坝久未檄调，恐其滋事，宁用驻防旗兵绿营及屯练降番以昭慎重
  - date: 1788-09-10
    title_zh: 令李世杰派员分段经理口外粮运
    rationale: 打箭炉出口距藏五千里，粮饷火药须分段经理并派兵护送，兼于藏内就近采买以免缓不济急
  - date: 1788-09-12
    title_zh: 译写番字檄谕廓尔喀令献还两处
    rationale: 先礼后兵，示以金川准噶尔台湾前事，若早退兵可曲邀宽宥，否则大兵歼戮无遗
- id: guji-弘历-endeavor-2
  title_zh: 助剿安南兼抚恤畿甸灾赈
  summary: 许阮辉宿回国寻嗣助剿，令孙士毅四路进兵广传檄谕，并抚恤江西湖南水灾及督办漕粮北上
  phases:
  - key: brewing
    name: 许陪臣归国
    labels:
      zh: 声援安南
    start_date: 1788-09-12
    highlight_event_id: guji-弘历-event-4
  - key: breakthrough
    name: 檄示镇目
    labels:
      zh: 四路助剿
    start_date: 1788-09-12
    highlight_event_id: guji-弘历-event-4
  - key: climax
    name: 抚赈江楚
    labels:
      zh: 查赈缓征
    start_date: 1788-09-14
    highlight_event_id: guji-弘历-event-5
  - key: closure
    name: 督漕抵通
    labels:
      zh: 军国兼顾
    start_date: 1788-09-12
    highlight_event_id: guji-弘历-event-5
  decisions:
  - date: 1788-09-12
    title_zh: 令阮辉宿等即日启程带檄回国传播
    rationale: 天朝派员统兵四路助剿之意须广为传播以壮声援，不可滞留以待旨致失机宜
  - date: 1788-09-14
    title_zh: 华容安乡被水缓征并借给耔种口粮
    rationale: 低洼田亩被淹补种不及，当疏消借本缓征下半年钱粮，使贫民均沾实惠不致失所
  - date: 1788-09-12
    title_zh: 准雇铜船民船起拨南粮迅速抵通
    rationale: 卫河水裕粮船衔尾而来，军船北上拥塞，宜就近雇船起运以免误回空
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，是为弘历，后即皇帝位年号乾隆
  related_endeavor_id: guji-弘历-endeavor-1
- id: guji-弘历-event-1
  title_zh: 谕调屯练驻防赴藏堵剿
  date: 1788-09-09
  year_of: 1788
  place_zh: 热河行在
  description: 据李世杰等奏挑屯练降番一千二百合驻防绿营共三千分起赴藏，谕宁续拨驻防绿营不用巴塘里塘番众，并派道府分段经理口外军行
  related_endeavor_id: guji-弘历-endeavor-1
- id: guji-弘历-event-2
  title_zh: 谕筹藏内粮食接济援兵
  date: 1788-09-10
  year_of: 1788
  place_zh: 热河行在
  description: 以前后藏存粮不足供五百兵，添调三千必缺食，谕庆麟雅满泰动帑增价采买，晓谕唐古忒黄黑番众踊跃出售米面糌粑牛羊，并议取达赖班禅商上存粮
  related_endeavor_id: guji-弘历-endeavor-1
- id: guji-弘历-event-3
  title_zh: 缮发番字檄谕廓尔喀
  date: 1788-09-12
  year_of: 1788
  place_zh: 热河行在
  description: 以廓尔喀抢掠聂拉木济咙，谕庆麟钤印选派能员持檄交夷目，令速退兵献还两处，否则如金川准噶尔例尽行荡除，并补叙叶棱雅木布纳贡本末添入檄内
  related_endeavor_id: guji-弘历-endeavor-1
- id: guji-弘历-event-4
  title_zh: 谕孙士毅遣阮辉宿归国助剿
  date: 1788-09-12
  year_of: 1788
  place_zh: 热河行在
  description: 嘉阮辉宿等寻觅嗣孙帮同恢复之志，令即日启程带天朝四路助剿之旨及晓示各镇目檄谕回国传播，并令孙永清早储粮饷接济边隘大兵
  related_endeavor_id: guji-弘历-endeavor-2
- id: guji-弘历-event-5
  title_zh: 抚恤江西湖南水灾并督漕
  date: 1788-09-14
  year_of: 1788
  place_zh: 热河行在
  description: 据何裕城浦霖奏南昌饶州及华容安乡被淹，谕加意抚绥借给耔种缓征钱粮，又据苏凌阿奏准雇铜船民船起拨杨村粮石迅速抵通
  related_endeavor_id: guji-弘历-endeavor-2
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
  related_endeavor_id: guji-弘历-endeavor-2
