    title_zh: 亲定一二三四等分别办理
    rationale: 以文字优劣定劝惩，使翰詹知所激劝，不致图安逸而荒笔墨
  - date: 1748-07-12
    title_zh: 升齐召南李因培王际华为学士中允
    rationale: 奖拔文优者为经筵讲官及学士，以风示馆阁，砺士习而重文衡
- id: guji-弘历-endeavor-2
  title_zh: 金川军需浩繁密筹班师柔远
  summary_zh: 因大兵云集川西日费不赀，已拨及四百万两，密谕经略讷亲统计全蜀熟思审处，筹不顿大兵而使狡寇帖服之上策
