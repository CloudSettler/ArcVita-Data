  - date: 1783-08-10
    title_zh: 嘉奖朝鲜遣使迎驾祝寿并饬礼部传谕优眷
    rationale: 外藩勤修职贡恭顺可嘉非常贡可比特于常例外加恩赏赉并申饬糊涂渎奏
  - date: 1783-08-12
