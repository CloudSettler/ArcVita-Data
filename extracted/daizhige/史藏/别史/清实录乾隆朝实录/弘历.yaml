  decisions:
  - date: 1785-03-08
    title_zh: 普赈五县借籽缓征
    rationale: 春麦待播民生拮据，普赈两月借给耔种，缓征仓谷以纾民力
  - date: 1785-03-10
    title_zh: 全豁带征缓征民欠
    rationale: 感荷天恩得雪盈尺，推恩敛福令农民安心耕作，共享盈宁以副轸念
events:
- id: guji-弘历-event-birth
  title_zh: 诞生
  date: 1711-09-25
  year_of: 1711
  kind: birth
  description: 康熙五十年八月十三生於圆明园，为雍亲王第四子
- id: guji-弘历-event-death
  title_zh: 龙御归天
  date: 1799-02-07
  year_of: 1799
  kind: death
  description: 嘉庆四年正月初三崩於养心殿，传位嘉庆后仍训政
- id: guji-弘历-event-piyong
  title_zh: 释奠临雍讲学告成
  date: 1785-03-09
  year_of: 1785
  kind: 事业
  description: 乙巳二月初七诣文庙释奠，御彝伦堂更服临新建辟雍，讲大学止善与易天行健，御制碑记讲学诗及三老记，广顺天乡试皿字号十五名
- id: guji-弘历-event-zhenji
  title_zh: 豁免卫辉带征缓征
  date: 1785-03-10
  year_of: 1785
  kind: 事业
  description: 因京畿得雪盈尺推恩，谕将汲县等五县及延津等九县带征缓征民欠仓谷全行豁免，饬速晓谕劝耕
