endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 厘定祈谷上辛郊祀典礼
  summary_zh: 驳礼部改用次辛之议命廷臣详议立春后上辛并定古稀躬祀之典
  phases:
  - key: brewing
    name: 驳改次辛仍用上辛
    labels:
      zh: 祈谷礼制
    start_date: 1781-03-24
    highlight_event_id: guji-弘历-event-qigu-1781
  - key: breakthrough
    name: 命大学士九卿详议立春后得辛之义
    labels:
      zh: 廷议礼制
    start_date: 1781-03-24
    highlight_event_id: guji-弘历-event-qigu-1781
  - key: climax
    name: 亲祭社稷定降舆近便之仪
    labels:
      zh: 躬亲昭事
    start_date: 1781-03-28
    highlight_event_id: guji-弘历-event-sheji-1781
  - key: closure
    name: 通谕子孙古稀亦岁岁躬行垂裕万年
    labels:
      zh: 垂裕后昆
    start_date: 1781-03-26
    highlight_event_id: guji-弘历-event-sheji-1781
  decisions:
  - date: 1781-03-24
    title_zh: 仍用上辛命廷臣斟酌古今详议
    rationale: 孟春祈谷所以迓阳气兆农祥当以立春后上辛为正兼避隔年斋戒与祫祭相妨
  - date: 1781-03-26
    title_zh: 准由皇乾殿西墙门外降舆
    rationale: 仰体上天眷爱年逾古稀步履稍逊以近便之仪存躬亲昭事之诚
- id: guji-弘历-endeavor-2
  title_zh: 整饬江浙吏治督办海塘
  summary_zh: 革拿杭嘉湖道王燧追赃严讯督定条块石塘并追夺卞三元官谥以肃纲纪
  phases:
  - key: brewing
