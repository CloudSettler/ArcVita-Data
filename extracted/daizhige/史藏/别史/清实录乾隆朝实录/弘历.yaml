  description_zh: 康熙五十年八月十三日生，为雍亲王第四子，母熹贵妃钮祜禄氏
- id: guji-弘历-event-death
  title_zh: 崩于紫禁城养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城
  description_zh: 嘉庆四年正月初三日崩，庙号高宗，谥纯皇帝，葬裕陵
- id: guji-弘历-event-jiebian-1
  title_zh: 初闻割辫传言降旨严缉
  date: 1768-07-14
  year_of: 1768
  place_zh: 北京紫禁城
  description_zh: 乾隆三十三年六月壬申闻山东江浙有偷割发辫之事，谕令各督抚专派妥员严密查拏尽法惩治以绝根株
- id: guji-弘历-event-jiebian-2
  title_zh: 富尼汉奏获蔡廷章靳贯子饬审根究
  date: 1768-07-14
  year_of: 1768
  place_zh: 山东邹县峄县
  description_zh: 山东巡抚富尼汉奏拏获翦辫匪犯蔡廷章靳贯子，供称首恶为浙江僧人吴元江南僧人玉石，谕令彻底根究毋令潜藏外逸并传谕江浙一体躧缉
- id: guji-弘历-event-jiebian-3
  title_zh: 直隶景州亦现割辫案饬解京询问
  date: 1768-07-19
  year_of: 1768
  place_zh: 直隶景州
  description_zh: 据方观承奏景州民人孟士会等被割发辫，谕令将二人解京交军机大臣询问，并饬江浙速获为首要犯吴元等毋得疏纵迟延
- id: guji-弘历-event-meiliben-1
  title_zh: 据奏梅立本逼死杨梿降旨革职拏问
  date: 1768-07-15
  year_of: 1768
  place_zh: 广西郁林州陆川县
  description_zh: 乾隆三十三年六月癸酉据鄂宝奏学政梅立本逼索供应凌辱陆川县知县杨梿致忿恨自刎，降旨革职拏问交鄂宝严审定拟并查封任所赀财
- id: guji-弘历-event-meiliben-2
  title_zh: 谕令严拟抵偿赶入秋审情实
  date: 1768-07-16
  year_of: 1768
  place_zh: 北京紫禁城
  description_zh: 乾隆三十三年六月甲戌谕以梅立本恣睢纵肆庭跪凌虐致令自尽理应问拟抵偿，著严审定案赶入本年秋审情实并密委大员查究原籍赀财
