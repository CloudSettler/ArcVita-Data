  decisions:
  - date: 1783-04-15
    title_zh: 诏复辟雍圜水之制
    rationale: 北京都会教化所先，有学无雍名实未称，汲井绠水可成人为，物给价工给值不劳民
  - date: 1785-03-09
    title_zh: 亲临辟雍讲大学易义
    rationale: 明文王五伦止善与君子法天自强，令圜桥多士及朝鲜使臣共聆，以正文教而戒徒炫虚名
- id: guji-弘历-endeavor-2
  title_zh: 赈济卫辉旱灾劝耕
  summary: 因卫辉属亢旱雪泽短少，加恩展赈借籽缓征终至全豁，以安春耕
  phases:
