endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 西路筹剿沙喇斯玛呼斯及来年大举部署
  goal_zh: 截拏阿睦尔撒纳余党，安设卡隘，整马驼粮运，来春合兵进剿
  phases:
  - key: brewing
    name: 乌鲁木齐过冬整军
    labels:
      zh: 蓄势
    start_date: 1757-11-01
    highlight_event_id: guji-弘历-event-xibei
  - key: breakthrough
    name: 满福殉节抚恤查拏叛人
    labels:
      zh: 明罚
    start_date: 1758-01-13
    highlight_event_id: guji-弘历-event-xibei
  - key: climax
    name: 塔尔巴哈台爱呼斯设卡堵截
    labels:
      zh: 合围
    start_date: 1758-01-16
    highlight_event_id: guji-弘历-event-xibei
  - key: closure
    name: 檄调屯田绿旗增兵待发
    labels:
      zh: 待发
    start_date: 1758-01-17
    highlight_event_id: guji-弘历-event-xibei
  decisions:
  - date: 1758-01-13
    title_zh: 命阿里衮事竣即回巴里坤来春再进剿
    rationale: 冬寒兵乏不可轻进，保巴里坤转运要地以待来年
  - date: 1758-01-16
    title_zh: 命和硕齐唐喀禄驻额尔齐斯转赴塔尔巴哈台设卡
    rationale: 杜贼窜俄罗斯之路，截其逃线再聚而歼之
  - date: 1758-01-17
    title_zh: 谕黄廷桂雅尔哈善抽屯田兵随征并购驼三千
    rationale: 以屯田之余益军营声势，壮马驼以利长驱
- id: guji-弘历-endeavor-2
  title_zh: 东省伊河运河疏浚与漕运民生整饬
  goal_zh: 伊河开坝放水涸地利民，运河挑浚纤道涵洞闸坝整修以利漕运
  phases:
  - key: brewing
    name: 鹤年张师载履勘挑挖伊河运河
    labels:
      zh: 履勘
    start_date: 1757-10-01
    highlight_event_id: guji-弘历-event-hegong
  - key: breakthrough
    name: 伊河开坝放水水势消退露堤
    labels:
      zh: 放水
    start_date: 1758-01-14
    highlight_event_id: guji-弘历-event-hegong
  - key: climax
    name: 交部议叙鹤年裘曰修梦麟并整饬怠玩
    labels:
      zh: 奖惩
    start_date: 1758-01-14
    highlight_event_id: guji-弘历-event-hegong
  - key: closure
    name: 命阿尔泰守成规办河工护送鹤年丧
    labels:
      zh: 守成
    start_date: 1758-01-15
    highlight_event_id: guji-弘历-event-hegong
  decisions:
  - date: 1758-01-14
    title_zh: 嘉奖开坝放水命鹤年张师载裘曰修等交部议叙
    rationale: 在工诸臣悉心筹画涸地甚广，当示鼓劝以成善政
  - date: 1758-01-14
    title_zh: 种经怠玩革职留工自备资斧效力
    rationale: 要工怠玩仅予革职不足示惩，当令赎罪以儆急公
  - date: 1758-01-15
    title_zh: 命阿尔泰补山东巡抚守鹤年成规
    rationale: 河工要务当感动天良守其成规，善办护丧以全始终
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  description_zh: 康熙五十年八月十三日生，为雍亲王第四子，后承大统年号乾隆
- id: guji-弘历-event-hegong
  title_zh: 东省伊河放水奏捷加恩议叙
  date: 1758-01-14
  year_of: 1758
  place_zh: 山东运河伊河工次
  description_zh: 癸亥谕伊河开坝放水积水渐消涸地甚广，命鹤年张师载裘曰修梦麟交部议叙，黜怠玩之种经，鹤年病故后加恩赠恤命阿尔泰继任
- id: guji-弘历-event-xibei
  title_zh: 西路部署设卡抚恤满福谕来年进剿
  date: 1758-01-16
  year_of: 1758
  place_zh: 巴里坤乌鲁木齐额尔齐斯塔尔巴哈台
  description_zh: 以满福被诱阵亡照阵亡例议恤，命阿里衮回巴里坤，和硕齐唐喀禄赴塔尔巴哈台设卡堵截，檄调屯田绿旗兵马驼以待来春进剿沙喇伯勒及回部，严拏敦多克哈什哈等叛人
- id: guji-弘历-event-death
  title_zh: 龙驭上宾于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  description_zh: 嘉庆四年正月初三日崩，享年八十有九，庙号高宗，谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
