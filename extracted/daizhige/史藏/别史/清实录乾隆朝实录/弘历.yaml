endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 八旬万寿庆典推恩中外
  summary: 乾隆五十五年八旬大庆召见朝鲜蒙古回部安南缅甸等使臣土司赐食赐宴发京仓米平粜赦减圈禁宗室加恩耆民寿妇以示行庆施惠
  phases:
  - key: brewing
    name: 降旨止远道耆民进京以安老引年
    labels:
      zh:
      - 万寿
      - 恤老
    start_date: 1790-08-01
    highlight_event_id: guji-弘历-event-1790-audience
  - key: breakthrough
    name: 避暑山庄召见各国使臣土司赐食
    labels:
      zh:
      - 觐见
      - 怀柔
    start_date: 1790-08-10
    highlight_event_id: guji-弘历-event-1790-audience
  - key: climax
    name: 发京仓稄米三万石减价平粜以平市价
    labels:
      zh:
      - 平粜
      - 惠民
    start_date: 1790-09-01
    highlight_event_id: guji-弘历-event-1790-grain
  - key: closure
    name: 赦放情节可原圈禁宗室并赏赉耆民寿妇
    labels:
      zh:
      - 施恩
      - 旌表
    start_date: 1790-09-05
    highlight_event_id: guji-弘历-event-1790-grain
  decisions:
  - date: 1790-08-12
    title_zh: 不准各省耆民踵事进京祝嘏
    rationale: 恐年老之人长途劳顿或水土不服生疾已有恩诏赉以粟布银两故谕令晓谕阻止以体恤高年
  - date: 1790-09-01
    title_zh: 发京仓米减粜裕民食
    rationale: 庆典点缀商匠云集京城米价稍增而京仓充盈故发稄米三万石照时价减粜以平市价
  - date: 1790-08-14
    title_zh: 放出情节可原圈禁宗室觉罗七名口
    rationale: 逢八旬大庆寰宇普被恩膏故于永远圈禁人等中择情节可原者放出交族长约束以示加恩
- id: guji-弘历-endeavor-2
  title_zh: 督理畿辅山东江淮水灾赈恤并整饬吏治
  summary: 因六七月霪雨河涨永平天津锦州山东平原禹城宿州徐州萧砀被水即命梁肯堂长麟周樽朱圭福崧履勘疏消加赈给口粮修费并严处失察浮冒各官
  phases:
  - key: brewing
    name: 闻永平天津朝阳河水陡发民房坍塌命分道查勘
    labels:
      zh:
      - 水灾
      - 查勘
    start_date: 1790-08-10
    highlight_event_id: guji-弘历-event-1790-flood
  - key: breakthrough
    name: 大凌河漫溢锦州旗民被水赏给两月口粮并申饬拘泥请贷
    labels:
      zh:
      - 赈济
      - 申饬
    start_date: 1790-08-11
    highlight_event_id: guji-弘历-event-1790-flood
  - key: climax
    name: 山东平原禹城临邑陵县及宿州濉河徐州漫溢命抚藩亲往抚恤疏消
    labels:
      zh:
      - 抚恤
      - 河务
    start_date: 1790-08-15
    highlight_event_id: guji-弘历-event-1790-flood
  - key: closure
    name: 核办句容高邮侵蚀案及坝工浮报玉石偷换案以肃吏治
    labels:
      zh:
      - 吏治
      - 刑赏
    start_date: 1790-08-16
    highlight_event_id: guji-弘历-event-1790-personnel
  decisions:
  - date: 1790-08-11
    title_zh: 锦州九关台旗民一体赏给两月口粮即赈勿贷
    rationale: 穷檐口食不继理宜急速救援故一面赈发一面具奏不准暂贷秋后追偿并令嵩椿宜兴亲往查办
  - date: 1790-08-20
    title_zh: 令朱圭驰驿速赴安徽查办宿州水灾
    rationale: 宿州濉河漫溢黄水汇注堤埝民庐田禾被淹而朱圭新任巡抚尚在京随班故令即日驰驿亲往勘赈修补
  - date: 1790-08-16
    title_zh: 革问书麟闵鹗元并宽严有别处分李世杰何堂福崧
    rationale: 句容高邮书吏侵蚀累万盈千总督失察巡抚知情不举故分别革职拏问正法而念旧功年老疾病及因公情由者分别休致留任赔缴申饬以示惩劝
