- id: guji-弘历-event-1743-jizhen
  title_zh: 缓征营饷赈济江淮水灾
  type: achievement
  date: 1743-05-28
  year_of: 1743
  description: 命淮徐扬凤颍泗营兵所借一季饷缓至秋成后扣还，赈济凤阳淮安等府饥民并免安徽湖北额赋
