endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 加赈湖南淮扬豁免甘省兵借以纾民力
  summary_zh: 乾隆二十六年正月以湖南七州县偏灾淮扬徐海水灾例赈将毕青黄不接加恩再赈并以甘省连岁军需豁免各营豫借银两以示轸恤
  phases:
  - key: brewing
    name: 湖南七州县夏旱偏灾例赈将毕
    labels:
      zh: 酝酿
    start_date: 1761-02-05
    highlight_event_id: guji-弘历-event-jiazhen-hunan
  - key: breakthrough
    name: 降旨湖南七州县加赈一月再加一月
    labels:
      zh: 突破
    start_date: 1761-02-08
    highlight_event_id: guji-弘历-event-jiazhen-hunan
  - key: climax
    name: 淮扬七州县加赈两月六州县加赈一月
    labels:
      zh: 高潮
    start_date: 1761-02-08
    highlight_event_id: guji-弘历-event-huanmian-gansu
  - key: closure
    name: 甘省各营豫借银九十余万悉予豁免
    labels:
      zh: 收束
    start_date: 1761-02-06
    highlight_event_id: guji-弘历-event-huanmian-gansu
  decisions:
  - date: 1761-02-08
    title_zh: 湖南零陵等七州县无论极次贫民再加赈
    rationale: 例赈既毕尚属青黄不接之时恐灾民生计拮据故叠加恩赈以资接济务使得沾实惠
  - date: 1761-02-06
    title_zh: 甘省满汉各营豫借马匹银两悉予豁免
    rationale: 连岁承办军需兵民出力坐扣俸饷必致艰窘大功既蒇宜宣惠恺以体恤兵力
- id: guji-弘历-endeavor-2
  title_zh: 紫光阁会宴怀柔哈萨克整饬回部事务
  summary_zh: 以紫光阁落成大宴功臣蒙古回部哈萨克使藏纛军器以彰武功敕谕哈萨克宽免巴鲁克巴图尔申饬游牧越境调舒赫德往喀什噶尔更代海明以肃边政
  phases:
  - key: brewing
    name: 紫光阁落成宴赉功臣外藩
