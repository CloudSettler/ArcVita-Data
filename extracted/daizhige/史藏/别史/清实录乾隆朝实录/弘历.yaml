      - 召见
      - 和好
    start_date: 1744-02-01
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 颁敕辨正前旨
    labels:
      zh:
      - 敕谕
      - 正误
    start_date: 1744-02-02
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 赍敕归部永遵
    labels:
      zh:
      - 永遵
      - 安乐群生
    start_date: 1744-02-03
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1744-02-01
    title_zh: 召见图尔都申谕和好以信为本
    rationale: 使臣往返言语繁多易生舛错须面谕台吉以谕旨为定永远奉行不爽
  - date: 1744-02-02
    title_zh: 颁敕噶尔丹策零准肃州贸易
    rationale: 甘凉地褊商贾无多于交易无益只准肃州与京师年分贸易以示施恩有节而虑久远
- id: guji-弘历-endeavor-2
  title_zh: 轸念民食整顿仓储赈济
  summary_zh: 因停买致仓谷缺少晓谕督抚相机采买赈济直隶灾民缓徵江淮钱粮纵流民出口就食
  phases:
  - key: brewing
    name: 停买省事仓空
    labels:
      zh:
      - 常平
      - 仓储空虚
    start_date: 1743-10-01
    highlight_event_id: guji-弘历-event-3
  - key: breakthrough
    name: 晓谕相机采买
    labels:
      zh:
      - 平粜
      - 因时制宜
    start_date: 1744-02-02
    highlight_event_id: guji-弘历-event-3
  - key: climax
    name: 蠲缓赈恤并行
    labels:
      zh:
      - 蠲缓
      - 赈济
    start_date: 1744-02-05
    highlight_event_id: guji-弘历-event-4
  - key: closure
    name: 变通关禁活民
    labels:
      zh:
      - 流民
      - 就食口外
    start_date: 1744-02-08
    highlight_event_id: guji-弘历-event-5
  decisions:
  - date: 1744-02-02
    title_zh: 晓谕各省应买则买应停则停
    rationale: 常平不特备荒亦藉平粜不可因停买之令任仓谷缺少致将来粜借无资
  - date: 1744-02-08
    title_zh: 密谕山海关稍弛稽察放穷民出关
    rationale: 直隶灾民迫于荒歉与平时不同若稽察过严将阻谋生之路故变通放行而不声张
events:
- id: guji-弘历-event-birth
  title_zh: 生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  place_zh: 北京雍亲王府
  summary_zh: 康熙五十年八月十三日生为雍亲王胤禛第四子母熹贵妃钮祜禄氏
- id: guji-弘历-event-1
  title_zh: 召见准噶尔使臣图尔都
  date: 1744-02-01
  year_of: 1744
  place_zh: 京师内廷
  summary_zh: 乾隆九年正月召见图尔都三四次谕以贸易事竣即起行归告噶尔丹策零以谕旨为定和好以信为本
- id: guji-弘历-event-2
  title_zh: 颁敕谕噶尔丹策零
  date: 1744-02-02
  year_of: 1744
  place_zh: 京师
  summary_zh: 就吹纳木喀误传甘凉兰州西安贸易之语辨正前旨仍准肃州与来京年分贸易并赐佛像缎匹器物
- id: guji-弘历-event-3
  title_zh: 晓谕各省经理仓储
  date: 1744-02-02
  year_of: 1744
  place_zh: 京师
  summary_zh: 以各省视为省事任仓谷缺少特颁谕旨令督抚斟酌情形应买则买应停则停不可胶执希图省事
- id: guji-弘历-event-4
  title_zh: 恭谒泰陵躬奠哀恸
  date: 1744-02-05
  year_of: 1744
  place_zh: 泰陵隆恩门宝城前
  summary_zh: 乾隆九年正月奉皇太后自圆明园启銮谒泰陵未至碑亭即降舆恸哭步入行礼躬奠
- id: guji-弘历-event-5
  title_zh: 密谕放流民出口就食
  date: 1744-02-08
  year_of: 1744
  place_zh: 山海关及各隘口
  summary_zh: 以直隶河南山东被灾穷民挈眷赴口外八沟及出山海关就食密令守关大臣查明实系穷民即行放出不必盘诘声张
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京紫禁城养心殿
  summary_zh: 嘉庆四年正月初三日崩年八十有九已禅位为太上皇帝仍训政葬裕陵
