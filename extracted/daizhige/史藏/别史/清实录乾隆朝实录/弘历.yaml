  date: 1738-03-01
  year_of: 1738
  place_zh: 圆明园正大光明殿
  description: 奉皇太后居畅春园，自居圆明园，谕大学士等轮班奏事照旧，有事即奏
- id: guji-弘历-event-1738-jianding
  title_zh: 谕减福建三县丁银
  date: 1738-02-28
  year_of: 1738
  place_zh: 北京紫禁城
  description: 以平和清流永安田少丁多，每粮一两征丁四五钱，命督抚悉心定议裁减
- id: guji-弘历-event-death
  title_zh: 崩于嘉庆四年
  date: 1799-02-07
  year_of: 1799
  place_zh: 北京养心殿
  description: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥纯皇帝
