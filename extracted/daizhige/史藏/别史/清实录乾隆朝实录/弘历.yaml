  date: 1735-12-06
  year_of: 1735
  kind: 事业
  description_zh: 以戴瀚科场案拟罪失平命王大臣覆加详审申明毋执成见毋挟偏私以襄祥刑之治
- id: guji-弘历-event-sangzang
  title_zh: 谕禁民间丧葬聚饮演戏
  date: 1735-12-06
  year_of: 1735
  kind: 事业
  description_zh: 闻外省丧葬侈靡闹丧演戏命各省督抚通行晓谕违者按律究处
- id: guji-弘历-event-sengdao
  title_zh: 谕甄别僧道清查房头应付
  date: 1735-12-10
  year_of: 1735
  kind: 事业
  description_zh: 以僧道多不守戒律耗民财溷民俗命直省按籍稽查愿还俗者听守寺院者给牒不许招徒余产归公养济穷民
- id: guji-弘历-event-zunshi
  title_zh: 恭上世宗宪皇帝尊谥
  date: 1735-12-21
  year_of: 1735
  kind: 事业
  description_zh: 于雍和宫行恭上尊谥礼奉册宝上尊谥曰敬天昌运建中表正文武英明宽仁信毅大孝至诚宪皇帝庙号世宗
- id: guji-弘历-event-qinen
