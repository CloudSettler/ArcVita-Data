    start_date: 1757-07-19
    highlight_event_id: guji-弘历-event-yudong-zhen
  - key: closure
    name: 饬核田逾十顷不蠲并督疏浚补种
    labels:
      zh: 收束
    start_date: 1757-07-20
    highlight_event_id: guji-弘历-event-yudong-zhen
  decisions:
  - date: 1757-07-18
    title_zh: 普免甘肃二十三年地丁
    rationale: 边省为军需总汇小民急公趋事当格外施恩以固根本
  - date: 1757-07-18
    title_zh: 蠲夏邑等四县二十三年地丁而田逾十顷者不蠲
    rationale: 穷黎宜惠鲜富族不应附益旷典须防分寄滥邀使实惠归贫
- id: guji-弘历-endeavor-2
  title_zh: 严吏治正风俗以清纲纪
  description: 革问恒文买金短价纵仆收礼之罪禁督抚金器贡献断段昌绪彭家屏逆书之案饬福建水师本地任用瞻徇之弊
  phases:
  - key: brewing
    name: 郭一裕参奏恒文买金等款
