  date: 1774-10-09
  year_of: 1774
  place_zh: 要亭行宫
  description_zh: 奖王建基张灏赵之枚等杀贼授衔赏银，令阿思哈迎徐绩合兵，断临清浮桥防贼西窜直隶定期会剿
