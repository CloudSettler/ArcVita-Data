  archetype: 勤政恤民之君
  dilemmas:
  - 施恩恤民与巩固河防慎重国用之间如何两全
  - 经理苗疆分布屯军与不夺苗业安定众心之间如何抉择
  lesson: 治国当以恤民为本，施恩务使下逮，经理边疆贵在安人心而不利其土
  summary_first_person: 朕即位之初，念黄运两河堤工民居之苦，特免租豁欠并禁添建，又革川省耗羡外余平以杜扰累，以豫省偏灾而缓赋加赈，以苗田拨换未妥而速停屯军另筹布置，皆欲使恩泽下究而边民安业，文武得所
