  era: 清代
  reign_ref: 乾隆
  archetype: 勤政守成之君
  dilemmas:
  - 凶犯缘坐稚子当骈诛还是当好生留禁
  - 各省偏灾既经题赈明春青黄不接是否再加恩
  lesson: 准情之中仍不废法灾后宜预筹接济方慰生死
  summary_first_person: 朕即弘历，乾隆四十四年十月御门听政，勾决河南山东山西直隶及朝审人犯，于王成冯吉灭家六命稚子缘坐特施法外之仁，改定十岁以下永远监禁遇赦不释之令，并念豫皖甘鄂直苏水旱偏灾屡谕加赈缓徵，又定明岁正月十二日南巡江浙，皆欲刑协平允民得安养。
  source_urls:
