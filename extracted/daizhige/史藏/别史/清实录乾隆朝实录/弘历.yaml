    rationale: 凶谋已遂与已杀无异，缘情权衡以惩逆伦而昭大公至正
events:
- id: guji-弘历-event-birth
  title_zh: 生于圆明园
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生，为世宗第四子，母孝圣宪皇后
- id: guji-弘历-event-dongxun
  title_zh: 奉皇太后登岱谒孔施恩山东
  date: 1771-04-14
  year_of: 1771
  description_zh: 乾隆三十六年三月朔恭奉圣母登礼岱宗，诣曲阜释奠先师，谒孔林，临复圣庙，赏衍圣公合族，加山东学额，减军流人犯，颁古铜器于庙庭，蠲恤灶地盐课
- id: guji-弘历-event-shenpan
  title_zh: 谕审纳逊特古斯谋毒亲兄案
  date: 1771-04-15
  year_of: 1771
  description_zh: 因土默特案召见色布腾巴勒珠尔等，究纳逊特古斯谋毒兄吹扎布及妻格格事，命尹继善等严讯巴尔丹格隆济兰泰，谕以杀兄重罪拟凌迟，先正赛哈赖以成信谳
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩，年八十有九，庙号高宗，谥纯皇帝，归政训政而实操威柄
