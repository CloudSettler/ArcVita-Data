    title_zh: 蠲免江苏安徽浙江因灾积欠钱粮米谷
    rationale: 因灾停缓非玩户抗延可比成熟地亩自能输将而灾歉逋负宜一体邀恩方协情理
  - date: 1765-01-28
    title_zh: 展赈甘省灾重稍重厅县及鄂省被水州县
    rationale: 青黄不接之时例赈将停麦秋未逮展赈一两月并借耔种以资耕作务使贫民均沾实惠
