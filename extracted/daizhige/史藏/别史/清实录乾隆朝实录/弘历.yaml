  place_zh: 北京雍亲王府
  description: 康熙五十年八月十三日生，系雍亲王胤禛第四子，母钮祜禄氏
- id: guji-弘历-event-1738-yuanzheng
  title_zh: 初举元正朝贺御太和受朝
  date: 1738-02-19
  year_of: 1738
  place_zh: 北京太和殿
  description: 率王大臣诣寿康宫贺皇太后，御太和殿受朝，赐王大臣蒙古朝鲜琉球使臣宴
- id: guji-弘历-event-1738-tingpingyu
  title_zh: 谕停各省平余解部
  date: 1738-02-26
  year_of: 1738
  place_zh: 北京紫禁城
  description: 以平余出自耗羡，自乾隆三年停解留省，遇荒歉裨益民生事奏明动用
- id: guji-弘历-event-1738-yuanmingyuan
