endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 審斷豐順朱阿姜結盟謀逆案
  summary_zh: 李侍堯等審擬豐順奸民結盟潛謀不軌，嚴處失察文武，並將逆屬從重正法以儆愚頑
  phases:
  - key: brewing
    name: 地方養奸釀變
    labels:
      zh: 地方怠玩
    start_date: 1770-10-01
    highlight_event_id: guji-弘历-event-1
  - key: breakthrough
    name: 海陽令風聞緝獲
    labels:
      zh: 迅速就獲
    start_date: 1770-11-15
    highlight_event_id: guji-弘历-event-1
  - key: climax
    name: 三法司核擬緣坐
    labels:
      zh: 從重定罪
    start_date: 1770-12-05
    highlight_event_id: guji-弘历-event-1
  - key: closure
    name: 通諭中外知畏
    labels:
      zh: 除惡務盡
    start_date: 1770-12-06
    highlight_event_id: guji-弘历-event-1
  decisions:
  - date: 1770-12-01
    title_zh: 將豐順失察文武革職拏問交部治罪
    rationale: 地方有逆犯糾黨兩月不能先期訪獲，幾致釀變，僅革職不足示儆
  - date: 1770-12-06
    title_zh: 朱阿姜池亨會嫡子即行處斬不留遺孽
    rationale: 此案描刻符印製造軍器殺死捕役，罪大惡極，非尋常可比，須除惡務盡使愚頑知畏
- id: guji-弘历-endeavor-2
  title_zh: 籌度緬甸進剿與漕船避泊
  summary_zh: 令阿桂等據實籌緬路糧運兵力，不墮賊計，並定豫東漕船避泊章程申饬高晉拘泥
  phases:
  - key: brewing
    name: 緬匪恃險拘使
    labels:
      zh: 邊釁初起
    start_date: 1770-11-01
    highlight_event_id: guji-弘历-event-2
  - key: breakthrough
    name: 阿桂請由猛密攻剿
    labels:
      zh: 請兵進取
    start_date: 1770-12-08
    highlight_event_id: guji-弘历-event-2
  - key: climax
    name: 詰問兵糧籌畫虛實
    labels:
      zh: 務求實濟
    start_date: 1770-12-11
    highlight_event_id: guji-弘历-event-2
  - key: closure
    name: 定漕船暫避章程
    labels:
      zh: 漕運不誤
    start_date: 1770-12-06
    highlight_event_id: guji-弘历-event-2
  decisions:
  - date: 1770-12-11
    title_zh: 傳諭阿桂哈國興據實覆奏緬路辦理之法
    rationale: 去歲大兵未克，今僅綠營力薄，糧運未明，不可含糊嘗試，須籌晝妥協
  - date: 1770-12-06
    title_zh: 依瓦爾達議令漕船暫泊俟駕北上申饬高晉
    rationale: 春兌改夏兌有礙漕務，南巡已有成例可循，不可更張貽誤
