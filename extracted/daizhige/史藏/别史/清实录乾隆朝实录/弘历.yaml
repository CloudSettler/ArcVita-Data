  title_zh: 普蠲甘肃豫东钱粮以纾民力
  description: 因甘肃承办军需小民出力繁多及豫东夏邑永城等县积潦成灾普免二十三年地丁并饬疏消积水补种抚恤严防吏弊
  phases:
