  decisions:
  - date: 1790-06-17
    title_zh: 革王士棻以陈奉兹李涛调补
    rationale: 臬司有奏事之责见抚藩通同徇隐不参奏亲提即系迎合袒护故革职严审以肃风纪
  - date: 1790-06-24
    title_zh: 敕大学士九卿将闵鹗元问以重辟
    rationale: 高邮句容两案皆累百姓闵鹗元沽誉徇私昧良负恩若因庆典宽恕则封疆效尤故必严惩以儆官邪
- id: guji-弘历-endeavor-2
  title_zh: 颁贮四库全书许士子钞阅嘉惠艺林
  summary_zh: 四库全书既经讐校蒇工谕令江浙文宗文汇文澜三阁排架齐集后许士子呈明到阁钞阅不得携归翰林院底本亦许就近检录以广传播
