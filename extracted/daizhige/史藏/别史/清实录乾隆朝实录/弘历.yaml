  dilemmas:
  - 参革发审既要速结以免屈抑又要核实以防枉纵如何立限兼顾
  - 旗人生齿日繁用度拮据加恩增饷又恐糜费如何调剂变通
  - 躬耕劝农为礼典大政万机繁冗如何以身先示天下
  lesson: 吏治贵在限程督实旗务贵在调剂均恩农事贵在躬行以劝方为久安长治之道
  summary_first_person: 吾践阼十有八年三月躬耕耤田以劝农事因参革案件多迁延悬搁特严立限期以整饬陋习又以八旗生齿日繁加恩增马甲养育兵以筹生计凡事务求实际不尚虚文
