    highlight_event_id: guji-弘历-event-jinchuanmiyu
  decisions:
  - date: 1748-07-13
    title_zh: 密谕讷亲统计情形详悉密奏
    rationale: 身在军前所见亲切，必能善会柔远止乱之意，筹无顿大兵而帖服之策为上
  - date: 1748-07-13
    title_zh: 班滚置之不问不必穷追
    rationale: 俘一游魂不足示武，伤财动众得不偿失，为民力物命起见不如置之不问
