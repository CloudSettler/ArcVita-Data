  - 赈恤蠲缓施恩与国计民生如何兼顾
  - 整饬吏治弊端与倚任臣工如何平衡
  lesson: 御众以宽而立法以严，怀远以德而制事以实
  summary_first_person: 朕即弘历，继位六十余载，勤批览而重农恤民，本年当英咭唎贡使远来，既示怀柔，亦正体统，又饬打捞铜铅之弊，缓征山东河南之欠，禁删本以端士习，清理庶狱以迓甘霖，皆朕轸念民艰整饬吏治之心
