  - key: breakthrough
    name: 申饬藩臬奏事
    labels:
      zh: 明奏事之责
    start_date: 1765-03-29
    highlight_event_id: guji-弘历-event-1765-panxi
  - key: climax
    name: 亲阅清口木龙
    labels:
      zh: 阅河定策
    start_date: 1765-04-02
    highlight_event_id: guji-弘历-event-1765-yuehe
  - key: closure
    name: 派员经理运河
    labels:
      zh: 调剂河湖
    start_date: 1765-04-03
    highlight_event_id: guji-弘历-event-1765-yuehe
  decisions:
  - date: 1765-03-29
    title_zh: 命藩臬遇紧要事件专摺奏闻并会同保举知府
    rationale: 藩臬不可仅以空言塞责，亦不可瞻徇督抚，需防欺朦骩法，公慎举人并同担咎
  - date: 1765-04-02
    title_zh: 谕于陶庄积土对岸添建木龙一架
    rationale: 亲阅清口四架木龙，令挑溜全趋北岸冲刷积土，收清黄并流之效，赶伏汛前竣工
events:
