    start_date: 1785-03-08
    highlight_event_id: guji-弘历-event-zhenji
  - key: climax
    name: 得雪推恩全豁
    labels:
      zh: 渥泽蠲免
    start_date: 1785-03-10
    highlight_event_id: guji-弘历-event-zhenji
  - key: closure
    name: 晓谕安心南亩
    labels:
      zh: 劝耕收束
