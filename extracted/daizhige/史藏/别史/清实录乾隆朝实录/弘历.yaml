  archetype: 巡守谒陵施恩之君
  dilemmas:
  - 河工求速合龙与灾民亟待赈济之轻重权衡
  - 盛京根本重地施恩蠲赋与国用有节之兼顾
  - 外藩恭顺羁縻与天朝体统严明之分寸拿捏
  lesson: 敬天法祖以收人心，河务赈务并举方能安社稷
  summary_first_person: 朕以眇躬缵承大统，念辽沈为鸿业肇基之地，故于乾隆四十三年秋恭谒永陵福陵昭陵，蠲赋肆眚以敷渥泽，又值豫省仪封漫口、黄淮并涨，朕宵旰忧勤，督臣工昼夜进埽、截漕发帑、平粜煮赈，务使灾黎不致失所，边藩不失羁縻，此皆朕法祖勤民之苦心也
  source_urls:
