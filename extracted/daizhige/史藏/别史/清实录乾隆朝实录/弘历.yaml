  dilemmas:
  - 旗地赎回既欲恤旗贫又恐扰民业
  - 武备操演既要农隙讲武又忌越境惊民
  - 关税厘剔既欲革除加派又恐亏减盈余
  lesson: 敬遵祖制定三年大阅以整武备，恤旗爱民务求两便，整饬吏治关税以实求治
  summary_first_person: 朕即位四年，于南苑初行大阅，亲试射连中，定三年一阅之制而加恩将士，又谕议旗地赎回务令于旗人有益于民人不扰，厘龙江关税，罢不职之豫抚以整封疆。
