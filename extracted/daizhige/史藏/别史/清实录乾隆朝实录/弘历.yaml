  decisions:
  - date: 1743-10-19
    title_zh: 断止顾琮限田之法不准试行
    rationale: 名虽正而难行，分户析产即可规避，查对滋扰且于贫民无补
  - date: 1743-10-20
    title_zh: 饬陈大受错会恤刑之意
    rationale: 赦非善政，明定期限减刑必诱民为非，须慎守感召天和本意
