  decisions:
  - date: 1741-04-17
    title_zh: 申谕科道仍准风闻言事
    rationale: 关税定议后不许渎奏与言官风闻本不相侔若因错会而塞言路则非集思广益之怀故当明辨训示
  - date: 1741-04-18
    title_zh: 准挑挖五工以下淤高河唇
    rationale: 永定水性靡常惟在因势利导顾琮身任河务确有所见且开河非二三年不能蒇事试行亦不害若无益再改新河未迟
