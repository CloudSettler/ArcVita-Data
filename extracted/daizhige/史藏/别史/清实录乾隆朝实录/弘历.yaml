    title_zh: 谕毕沅查勘淮源并致祭淮渎
    rationale: 淮水微弱则难以敌黄故自桐柏发源详查淤塞浚发泉流以助清敌黄
events:
- id: guji-弘历-event-birth
  title_zh: 弘历诞生
  date: 1711-09-25
  year_of: 1711
  description_zh: 康熙五十年八月十三日生于雍亲王府即后之高宗纯皇帝
- id: guji-弘历-event-tongcang
  title_zh: 派员赴通督办漕粮收兑
  date: 1785-09-01
  year_of: 1785
  description_zh: 头二进帮船共装米一百六十万七千余石仓场仅计收一百三十万石故派曹文埴伊龄阿赴通抽兑露囤速办回空
- id: guji-弘历-event-zhenji
  title_zh: 缓解关税以备安徽赈济
  date: 1785-09-02
  year_of: 1785
  description_zh: 安庆庐州等三十三州县秋禾被旱准将凤阳芜湖二关正额盈余暂缓起解就近动拨赈济
- id: guji-弘历-event-qingkou
  title_zh: 谕查清口淤浅筹办济运
  date: 1785-09-04
  year_of: 1785
  description_zh: 清口黄水盛涨倒漾淤沙梗阻饬萨载李奉翰据实陈明迎知阿桂履勘并令毕沅查淮源浚发
- id: guji-弘历-event-death
  title_zh: 弘历驾崩
  date: 1799-02-07
  year_of: 1799
  description_zh: 嘉庆四年正月初三日崩于紫禁城养心殿太上皇帝归政后训政
