  archetype: 励治整饬之君
  dilemmas:
  - 甘省通省朋分公帑若罚不及众则纪纲不振若尽法则斩候太多朕心不忍
  - 查抄贪吏家产若过严则株连苛求滋生窃议若过宽则隐匿寄顿无所炯戒
  lesson: 治贪须权衡审慎以刑齐吏以德化俗不为已甚而断绝根株
  summary_first_person: 朕在位四十六年秋行围塞外见甘肃捏灾冒赈通省联为一气川楚啯匪肆劫地方废弛痛心世道浇薄故谕阿桂李侍尧严核赈案谕福康安刘墉实力搜捕又加意河工抚恤厚往暹罗只欲励官常振法纪使小民不失所
