- id: guji-弘历-event-qishe
  title_zh: 七月甲戌谕饬骑射武备
  date: 1752-08-10
  year_of: 1752
  description: 以旗人图安逸不习骑射，谕领侍卫内大臣八旗都统等，令升转承袭引见及章京侍班官皆射箭
