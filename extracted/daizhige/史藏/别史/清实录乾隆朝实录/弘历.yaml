endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 江淮蠲税通粜安民
  summary_zh: 乾隆八年五月因江淮扬徐海积歉贸易稀少宽免杂税截留川米并饬劝谕富户以通商惠民
  phases:
  - key: brewing
