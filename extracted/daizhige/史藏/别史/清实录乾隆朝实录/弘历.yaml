  dilemmas:
  - 词华载道之间何以崇实黜华而不启士子竞尚浮华
  - 功过赏罚之间何以录功宥过而成全勋臣又不纵骫法营私
  - 赈恤便民之间何以给口粮实惠而不容官吏借折赈浮冒
  lesson: 好载道之文不好虚车之文，录大功而必究贪纵，赈必给实粮以杜侵渔，方为久安之道
  summary_first_person: 朕临御五十三年，台湾逆匪林爽文庄大田既平，朕录福康安海兰察调度之功而宥其前过，加恩义民屯练，严查柴大纪贪纵酿变，并因叶栋献诗剽窃事通谕士子务本力学，砥行立名，饬盐缉私赈济以廑念民生，期一劳永逸
  source_urls:
