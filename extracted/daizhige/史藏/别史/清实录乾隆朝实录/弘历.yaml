  - 科场积弊久存宽纵则士习坏从严则取怨
  lesson: 河工必亲督核实相机分办科场必严惩首恶以清弊源
  summary_first_person: 朕临御四十五年以河务民生为急以抡才士习为重豫省考城芝麻庄既合龙复有张家油房掣溜南河郭家渡亦正吃紧朕命李奉翰留豫会同国泰妥办令陈辉祖督率南河克期合龙顺天乡试传递顶冒朕必重惩陈七等以儆效尤并通谕各省实力稽察务使闱弊肃清
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷1114.html
endeavors:
- id: guji-弘历-endeavor-1
  title_zh: 督办豫南黄河漫口抢堵合龙
  summary_zh: 乾隆四十五年秋豫省考城芝麻庄及张家油房漫口南河睢宁郭家渡漫工并发谕令李奉翰国泰杨魁驻豫筹办陈辉祖督办南河分路趱筑以期克日合龙
  phases:
  - key: brewing
    name: 考城芝麻庄漫口抢护合龙
    labels:
      zh: 河工抢险
    start_date: 1780-10-05
    highlight_event_id: guji-弘历-event-hegong1
  - key: breakthrough
    name: 张家油房掣溜挑水御溜
    labels:
      zh: 分溜挑御
    start_date: 1780-10-06
    highlight_event_id: guji-弘历-event-hegong2
  - key: climax
    name: 郭家渡东西坝并进吃紧督催
    labels:
      zh: 南北分办
    start_date: 1780-10-08
    highlight_event_id: guji-弘历-event-hegong2
  - key: closure
    name: 议叙奖劝并命速奏合龙日期
    labels:
      zh: 奖劝核验
    start_date: 1780-10-11
    highlight_event_id: guji-弘历-event-hegong1
  decisions:
  - date: 1780-10-05
    title_zh: 谕李奉翰杨魁等交部议叙
    rationale: 芝麻庄挂缆合龙办理迅速宜加奖励以劝在工员弁尽力
  - date: 1780-10-11
    title_zh: 谕李奉翰留豫会同国泰办张家油房陈辉祖督办郭家渡
    rationale: 考城工程较南河紧要南河水落溜缓可期李奉翰当安心在工相机堵筑不可兼顾贻误
- id: guji-弘历-endeavor-2
  title_zh: 整肃顺天乡试科场舞弊
  summary_zh: 顺天乡试拿获誊录陈七包揽传递及恒泰等顶名代倩从重改拟发遣并通谕各省巡抚实力稽察以清闱弊
  phases:
  - key: brewing
    name: 搜检王大臣拿获传递顶冒
    labels:
      zh: 访查拿获
    start_date: 1780-10-11
    highlight_event_id: guji-弘历-event-kechang1
  - key: breakthrough
    name: 从重改拟陈七等罪名
    labels:
      zh: 从重定拟
    start_date: 1780-10-11
    highlight_event_id: guji-弘历-event-kechang1
  - key: climax
    name: 命陈七入秋审情实即予勾决
    labels:
      zh: 明刑儆众
    start_date: 1780-10-11
    highlight_event_id: guji-弘历-event-kechang1
  - key: closure
    name: 通谕各省大比实力稽察为例
    labels:
      zh: 通谕立法
    start_date: 1780-10-14
    highlight_event_id: guji-弘历-event-kechang2
  decisions:
  - date: 1780-10-11
    title_zh: 谕陈七拟绞候恒泰等发伊犁为奴勒善等革职
    rationale: 包揽得赃藐法无忌若不力为整顿舞弊营私将无底止必严惩以昭炯戒
  - date: 1780-10-14
    title_zh: 谕各省巡抚大比实力稽察引旨覆奏著为例
    rationale: 外省惟以无弊塞责模棱市誉不肯认真任怨必令防闲严密查获究治以振士习
events:
- id: guji-弘历-event-birth
  title_zh: 出生于雍亲王府
  date: 1711-09-25
  year_of: 1711
  summary_zh: 康熙五十年八月十三日生即后之高宗纯皇帝
- id: guji-弘历-event-death
  title_zh: 崩于养心殿
  date: 1799-02-07
  year_of: 1799
  summary_zh: 嘉庆四年正月初三日崩年八十九谥纯皇帝
- id: guji-弘历-event-hegong1
  title_zh: 谕奖考城芝麻庄坝工合龙
  date: 1780-10-05
  year_of: 1780
  summary_zh: 据李奉翰杨魁奏八月二十九日挂缆合龙览奏欣慰交部议叙并饬查在工员弁一体议叙
- id: guji-弘历-event-hegong2
  title_zh: 谕分办张家油房郭家渡两工
  date: 1780-10-11
  year_of: 1780
  summary_zh: 张家油房掣溜紧要命李奉翰仍驻考城会同国泰杨魁筑坝挑水陈辉祖督率郭家渡昼夜趱堵务于十五以前合龙
- id: guji-弘历-event-kechang1
  title_zh: 从重办理陈七传递顶冒案
  date: 1780-10-11
  year_of: 1780
  summary_zh: 刑部拟陈七绞候恒泰等发乌噜木齐改命恒泰等发伊犁为奴勒善等革职陈七入本年秋审情实即予勾决储椿年方大中严缉
- id: guji-弘历-event-kechang2
  title_zh: 通谕各省严查乡试怀挟传递
  date: 1780-10-14
  year_of: 1780
  summary_zh: 以顺天尚有弊窦况外省稽察不密命各省巡抚大比实力稽察查获重办每科引旨覆奏著为例
