  dilemmas:
  - 远道援藏需厚集兵力与粮运艰难不可久顿之两难
  - 廓尔喀小丑当剿当抚与威信必立之权衡
  lesson: 用兵首在粮饷有备，远夷当恩威并施，先檄谕后进剿，务使师出有名而民不重困
  summary_first_person: 朕闻廓尔喀侵扰济咙聂拉木，即调川省屯练驻防绿营赴藏，并令李世杰分段经理口外粮台，就近采买，又檄谕祸福，务保达赖班禅与卫藏安宁
