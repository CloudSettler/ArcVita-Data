  title_zh: 奉丧尽孝与尊崇显亲
  summary_zh: 奉移梓宫于雍和宫亲诣奠献议上世宗宪皇帝尊谥庙号定庙讳避书写上皇太后尊号追崇孝敬皇后并申饬苗疆僧务以善继善述
