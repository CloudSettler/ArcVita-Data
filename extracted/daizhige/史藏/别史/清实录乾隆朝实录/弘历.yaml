  lesson: 爱养黎元须有加无已而经略边远须宽严并济以游牧养锐以法度柔远方能内外俱安
  summary_first_person: 吾即位二十八年春念直隶山东去岁雨水偏灾例赈将停而东作未兴故再加恩展赈加赈并拨通仓稄米以资接济又以伊犁既筑城屯田日增命筹建城屋粮饷并令索伦察哈尔仍以游牧为本复大阅于畅春园西厂以振军容复敕谕爱乌罕巴达克山霍罕哈萨克诸部令其守分和睦遵驻劄大臣节制冀中外同享太平
  source_urls:
