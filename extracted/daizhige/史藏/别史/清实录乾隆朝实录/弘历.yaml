  dilemmas:
  - 旗人世业祖制与民人乐买两便之权衡
  - 蠲免加息通商惠民与国课不匮之拿捏
  - 尽孝展谒与勤政亲耕经筵并举之劳逸
  lesson: 舍德礼而求政刑必成杂霸即政刑而寓德礼乃见纯王之心
  summary_first_person: 朕即位三年谒泰陵恸哭步入以尽孝思首举经筵亲耕耤田以明德礼为本复准旗买民地免漕税谷息以求旗民两便闾阎沾泽
