endeavors:
- id: guji-弘曆-endeavor-1
  title_zh: 整飭閩浙吏治正典刑以戒封疆
  summary: 因桐鄉聚眾鬧漕倉穀虧空武備廢弛審明陳輝祖姑息養奸王燧朋比婪索分別賜令自盡即行處斬通諭中外
  phases:
