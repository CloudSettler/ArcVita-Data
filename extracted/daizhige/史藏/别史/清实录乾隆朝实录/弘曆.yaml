    start_date: 1783-03-10
    highlight_event_id: guji-弘曆-event-wangsui
  decisions:
  - date: 1783-03-05
    title_zh: 由監候改為賜陳輝祖自盡
    rationale: 前僅抽換王亶望入官財物故貸一死今查其任總督惟務營私於鬧漕浮收倉虧武弛漠不關心實與勒爾謹王亶望無異故不能再曲貸然念辦海塘無誤故免肆市賜自盡以存體面而昭炯戒
  - date: 1783-03-05
    title_zh: 將王燧由秋審緩決改為即行處斬
    rationale: 王燧倚恃王亶望於杭嘉湖道府任內浮收南米折色粜價勒索屬縣得贓數萬擾害百姓迥非素爾方阿僅以廠課嬴餘逢迎上司可比自應即正典刑以為監司朋比殃民者戒
- id: guji-弘曆-endeavor-2
  title_zh: 隆國學建辟雍昭文明教澤
  summary: 以國學為人文薈萃之地而辟雍之制自元明闕如乃於釋奠禮成後命德保劉墉德成度地鳩工興建以備臨雍大典
  phases:
  - key: brewing
    name: 釋奠禮成念規制宜隆
    labels:
      zh:
      - 禮成起意
    start_date: 1783-03-08
    highlight_event_id: guji-弘曆-event-biyong
  - key: breakthrough
    name: 詔度地鳩工仿禮經舊制
    labels:
      zh:
      - 詔建定案
    start_date: 1783-03-09
    highlight_event_id: guji-弘曆-event-biyong
  - key: climax
    name: 進圖式派大臣總司其事
    labels:
      zh:
      - 圖式敬辦
    start_date: 1783-03-09
    highlight_event_id: guji-弘曆-event-biyong
  - key: closure
    name: 預定落成舉行臨雍典禮
    labels:
      zh:
      - 久道化成
    start_date: 1783-03-09
    highlight_event_id: guji-弘曆-event-biyong
  decisions:
  - date: 1783-03-09
    title_zh: 命於太學增建辟雍
    rationale: 稽古天子曰辟雍所以行禮樂宣德化昭文明流教澤國學規制宜隆而元明以來典尚闕如故應增建以臻美備
  - date: 1783-03-09
    title_zh: 派德保劉墉德成敬謹承辦
    rationale: 既定仿禮經舊制度地營建自應擇通禮熟工之臣總司其事敬謹從事以光盛典而待落成臨雍
events:
- id: guji-弘曆-event-birth
  title_zh: 生於雍親王府
  date: 1711-09-25
  year_of: 1711
  event_type: birth
  description: 康熙五十年八月十三日生為雍親王胤禛第四子母孝聖憲皇后鈕祜祿氏
- id: guji-弘曆-event-death
  title_zh: 崩於養心殿
  date: 1799-02-07
  year_of: 1799
  event_type: death
  description: 傳位十五載後以太上皇帝崩於北京紫禁城養心殿壽八十有九諡法天隆運至誠先覺體元立極敷文奮武孝慈神聖純皇帝
- id: guji-弘曆-event-tongxiang
  title_zh: 因桐鄉鬧漕倉虧詰責陳輝祖
  date: 1783-03-05
  year_of: 1783
  event_type: career
  description: 乾隆四十八年二月初三據福崧奏桐鄉聚眾鬧漕富勒渾奏倉穀虧空黃仕簡奏台灣械鬥命軍機刑部會詢陳輝祖得其自認姑息養奸因循贻誤之供遂定即行正法之讞
- id: guji-弘曆-event-chenhuizu
  title_zh: 賜閩浙總督陳輝祖自盡
  date: 1783-03-05
  year_of: 1783
  event_type: career
  description: 以陳輝祖前抽換王亶望入官財物已改監候今復查其於漕弊鬧漕倉虧武弛一味營私隱匿回護贻誤地方加恩免其肆市派福長安穆精阿往監視賜令自盡通諭中外以為封疆廢弛者戒
- id: guji-弘曆-event-wangsui
  title_zh: 命即行處斬杭州府王燧
  date: 1783-03-05
  year_of: 1783
  event_type: career
  description: 查明王燧在杭嘉湖道府任內串通王亶望粜省倉米侵蝕浮收南米折色短報粜價勒索屬縣得贓數萬俯首認罪遂照軍機刑部所擬即行處斬派穆精阿監刑以戒監司朋比婪索殃民
- id: guji-弘曆-event-biyong
  title_zh: 詔建辟雍於太學
  date: 1783-03-09
  year_of: 1783
  event_type: career
  description: 乾隆四十八年二月初七戊辰以釋奠禮成念國學人文薈萃規制宜隆命禮部尚書德保工部尚書劉墉侍郎德成閱視度地鳩工仿禮經舊制營建辟雍以待臨雍典禮
