events:
- id: guji-弘曆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生于雍亲王府
  description: 康熙五十年八月十三日生是为弘曆后即位年号乾隆
- id: guji-弘曆-event-tour
  date: 1790-04-11
  year_of: 1790
  title_zh: 巡幸山东谒孔林
  description: 乾隆五十五年三月丙申谒孔林墓前北面跪三酹行三拜驻跸长庆屯济宁登舟
- id: guji-弘曆-event-limit
  date: 1790-04-12
  year_of: 1790
  title_zh: 以直隶建昌盗案山东金乡城工谕定例限
  description: 命大学士九卿科道会议内外办理要務限期劫盗承审四月提省一月部查二十日以清玩延
- id: guji-弘曆-event-pray
  date: 1790-04-18
  year_of: 1790
  title_zh: 东省望雨派员祈祷饬查雨泽
  description: 派乾清门侍卫庆成往济南虔诚祈祷传谕梁肯堂闵鹗元设坛祈祷据实奏报毋讳饰
- id: guji-弘曆-event-amnesty
  date: 1790-04-21
  year_of: 1790
  title_zh: 万寿蠲免并豁乌噜木齐地粮
  description: 八旬寿辰普蠲地丁外加恩豁免乌噜木齐所属州县户民额徵地粮七万余石三分之一
- id: guji-弘曆-event-yugong
  date: 1790-04-18
  year_of: 1790
  title_zh: 谕彭元瑞纪昀再考禹贡徐州贡道
  description: 浮于淮泗达于河群言淆乱命再加绎考订明确详悉毋曲为附会
- id: guji-弘曆-event-frontier
  date: 1790-04-22
  year_of: 1790
  title_zh: 处松筠俄案明亮回案保宁弓箭
  description: 斥松筠孟浪自专革侍郎副都统留办效力正法巴喇特等八犯申饬伊犁自制弓箭
- id: guji-弘曆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩于养心殿
  description: 嘉庆四年正月初三日崩寿八十有九谥法天隆运至诚先觉体元立极敷文奋武孝慈神圣纯皇帝
