  decisions:
  - date: 1770-02-10
    title_zh: 选派贵州兵二千分驻永昌要隘
    rationale: 滇省绿营恇怯不堪，黔兵较可用且毗连易调，协同戍守以防缅匪窥伺，不动声色为善后计
  - date: 1770-02-05
    title_zh: 于本年秋举行恩科乡试来岁春会试
    rationale: 朕六十诞辰、皇太后八旬万寿前后相望，申锡无疆，汇征叶吉以彰行庆作人
