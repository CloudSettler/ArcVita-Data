    start_date: 1783-10-20
    highlight_event_id: guji-弘曆-event-2
  - key: climax
    name: 蠲免地丁旗租加恩
    labels:
      zh: 敷恩留都
    start_date: 1783-10-25
    highlight_event_id: guji-弘曆-event-2
  - key: closure
    name: 改建石牌肆眚行庆
    labels:
