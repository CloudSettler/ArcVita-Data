  - 先擒首逆與並辦回部之緩急權衡
  - 大兵窮追與駐劄過冬待機之進退抉擇
  lesson: 先定首務再圖餘事，擒逆務盡而不以小利分兵，方能澄清西陲。
  summary_first_person: 朕以剿滅厄魯特賊眾為先，屢飭兩路大兵會合搜捕阿逆，不許以辦回部自諉，又念淮徐水災飭甄別守令借給耔種，並嚴訓八旗操練武備以復舊風。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70539.html
endeavors:
- id: guji-弘曆-endeavor-1
  title_zh: 專剿厄魯特追擒阿逆
  summary_zh: 以擒拏阿逆為要務，飭兩路會合徹底搜捕，暫緩回部，堵截哈薩克竄匪，籌駐軍過冬之局。
  phases:
  - key: brewing
    name: 明定先後專以擒逆為要
    labels:
      zh:
      - 定策
      - 申飭
    start_date: 1757-06-09
    highlight_event_id: guji-弘曆-event-1
  - key: breakthrough
    name: 嚴督追擊不許退諉
    labels:
      zh:
      - 督戰
      - 追捕
    start_date: 1757-06-14
    highlight_event_id: guji-弘曆-event-2
  - key: climax
    name: 兩路夾攻堵截竄匪
    labels:
      zh:
      - 合圍
      - 截拏
    start_date: 1757-06-13
    highlight_event_id: guji-弘曆-event-3
  - key: closure
    name: 駐軍過冬俟明歲再籌
    labels:
      zh:
      - 持重
      - 善後
    start_date: 1757-06-15
    highlight_event_id: guji-弘曆-event-1
  decisions:
  - date: 1757-06-09
    title_zh: 駁成袞扎布亟辦回部之請專令搜捕阿逆
    rationale: 阿逆未擒而深入回部必顧此失彼，故令兩路合力擒首惡餘賊徐辦
  - date: 1757-06-16
    title_zh: 嚴飭永貴三格奮勇追擒扎那噶爾布尼瑪
    rationale: 既已追及賊眾不得以水草為辭遠離賊營，必須奮勇擒拏毋得疏縱
- id: guji-弘曆-endeavor-2
  title_zh: 軫恤淮徐整飭吏治武備
  summary_zh: 趕種秋糧甄別徐淮守令，詳勘歸德積水麥收，通諭整飭八旗將軍訓練技藝以復滿洲舊風。
  phases:
  - key: brewing
    name: 督令甄別守令借給耔種
    labels:
      zh:
      - 救荒
      - 吏治
    start_date: 1757-06-12
    highlight_event_id: guji-弘曆-event-4
  - key: breakthrough
    name: 飭查歸德諱災確勘積水
    labels:
      zh:
      - 踏勘
      - 核實
    start_date: 1757-06-13
    highlight_event_id: guji-弘曆-event-4
  - key: climax
    name: 通諭武臣訓練操練技藝
    labels:
      zh:
      - 訓誡
      - 武備
    start_date: 1757-06-11
    highlight_event_id: guji-弘曆-event-5
  - key: closure
    name: 定署理印務永為令式
    labels:
      zh:
      - 定制
      - 垂訓
    start_date: 1757-06-11
    highlight_event_id: guji-弘曆-event-5
  decisions:
  - date: 1757-06-12
    title_zh: 再諭尹繼善愛必達速辦甄別調補並借耔種
    rationale: 被水地方全賴趕種秋糧接濟，去留守令早定一日則民早受一日之益
  - date: 1757-06-11
    title_zh: 通諭各省將軍副都統盡心教訓操練技藝
    rationale: 近來徒務虛文廢弛正業，必重騎射訓練以復淳樸勇往之舊俗
events:
- id: guji-弘曆-event-birth
  date: 1711-09-25
  year_of: 1711
  title_zh: 生於雍親王府
  description_zh: 康熙五十年八月十三日生，是為弘曆，後即皇帝位年號乾隆
- id: guji-弘曆-event-death
  date: 1799-02-07
  year_of: 1799
  title_zh: 崩於紫禁城養心殿
  description_zh: 嘉慶四年正月初三日崩，壽八十有九，廟號高宗
- id: guji-弘曆-event-1
  date: 1757-06-09
  year_of: 1757
  title_zh: 丁未諭以擒阿逆為要勿急辦回部
  description_zh: 駁成袞扎布等辦理回部之請，令兩路會合竭力搜捕阿逆，霍集占俟平定厄魯特後從容辦理
- id: guji-弘曆-event-2
  date: 1757-06-16
  year_of: 1757
  title_zh: 甲寅飭永貴追擒扎那噶爾布尼瑪
  description_zh: 以移駐薩哩克巴哩克遠離賊營為非，嚴飭奮勇擒拏毋得退諉
- id: guji-弘曆-event-3
  date: 1757-06-13
  year_of: 1757
  title_zh: 辛亥命夾攻和博克薩哩哈薩克錫喇
  description_zh: 派唐喀祿車木楚克扎布領兵擒拏，並令成袞扎布派兵會合兩路夾攻，一併查拏逆賊桑濟
- id: guji-弘曆-event-4
  date: 1757-06-12
  year_of: 1757
  title_zh: 庚戌諭速甄別徐淮守令借給耔種
  description_zh: 以淮徐被水涸出十之七八，令尹繼善等嚴行甄別調補，借給耔種趕種晚田雜糧
- id: guji-弘曆-event-5
  date: 1757-06-11
  year_of: 1757
  title_zh: 己酉通諭整飭八旗武備並論車布登偷生之罪
  description_zh: 以旗僕車布登投逆更服詢兵情凌遲處死為戒，通諭將軍大臣訓練官兵操練技藝武備
