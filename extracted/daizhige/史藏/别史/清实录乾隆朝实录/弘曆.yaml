  description: 由热河取道九关台赴盛京，恭谒永陵福陵，蠲免奉天地丁旗地，改建下马石牌，肆眚施惠
  phases:
  - key: brewing
    name: 启銮取道九关台
    labels:
      zh: 巡幸启程
    start_date: 1783-09-01
