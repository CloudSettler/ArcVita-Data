    start_date: 1783-11-01
    highlight_event_id: guji-弘曆-event-2
  decisions:
  - date: 1783-10-25
    title_zh: 豁免奉天府州县次年地丁
    rationale: 缅维祖泽留贻，见老扶幼挈爱戴悃忱，故渥泽以享盈宁
  - date: 1783-10-26
    title_zh: 改下马木牌为五体石牌
    rationale: 昭一统同文之盛，以尊陵寝体制
- id: guji-弘曆-endeavor-2
  title_zh: 守例柔远处置边藩朝贡
  description: 驳海宁收留俄罗斯之请谕令给费遣回交恰克图，加赏朝鲜国王陪臣并赐诗，示柔惠远人
  phases:
  - key: brewing
    name: 科布多俄罗斯来投奏请
    labels:
      zh: 边境投诚
    start_date: 1783-10-06
    highlight_event_id: guji-弘曆-event-1
  - key: breakthrough
    name: 降旨晓谕给费遣回
    labels:
      zh: 守例遣回
    start_date: 1783-10-07
    highlight_event_id: guji-弘曆-event-1
  - key: climax
    name: 加赏米石宣谕悯恤
    labels:
      zh: 加恩宣谕
    start_date: 1783-10-12
    highlight_event_id: guji-弘曆-event-1
  - key: closure
    name: 优眷朝鲜加倍赏赉赐诗
    labels:
      zh: 柔惠东藩
    start_date: 1783-10-20
    highlight_event_id: guji-弘曆-event-3
  decisions:
  - date: 1783-10-06
    title_zh: 不许收留俄罗斯五十余人
    rationale: 定例不得隐匿逃人，若自我破例何以服俄罗斯之心，且背叛之人断无容纳之理
  - date: 1783-10-20
    title_zh: 加倍赏朝鲜陪臣赐国王诗
    rationale: 朝鲜忠贞世笃迎銮祝寿守候日久，宜示柔惠有加无已
