    title_zh: 定師徒各招一人之現制
    rationale: 教流已久人數繁眾難驟禁，先准現牒核定師徒之數，使目前有所稽而將來可減
  - date: 1739-07-07
    title_zh: 密寄督撫徐徐留心日漸減少
    rationale: 外省循文敷衍未喻本意，須不取必一時以歲月漸化，又防官吏奉行擾累
