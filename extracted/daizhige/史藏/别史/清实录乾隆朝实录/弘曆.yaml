    title_zh: 諭軍機大臣飭豫省嚴緝積盜
    rationale: 未發之先必有窩藏糾合，翦除淨盡則盜風自息，須先事豫防而非徒事後緝拏
  - date: 1739-07-06
    title_zh: 申戒諱盜之弊過更不可逭
    rationale: 恐因嚴旨而啟諱盜粉飾，故明示疏縱嚴參與諱飾重過，使撫鎮不敢怠玩
