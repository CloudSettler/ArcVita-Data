person:
  qid: guji-弘曆
  name_zh: 弘曆
  names:
    zh: 愛新覺羅弘曆
    en: Hongli Qianlong Emperor
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉慶四年正月初三日
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代
  reign_ref: 乾隆
  archetype: 開拓守成之君
  dilemmas:
  - 窮兵開邊與守成安民之衡
  - 以武戡亂與以文終治之序
  - 天眷自承與敬天保民之惕
  lesson: 以非常之功終歸於敬天愛民與持盈保泰，武以定亂，文以安眾。
  summary_first_person: 余以眇躬寅紹丕基，勤求懷保，初無開創之心。然準夷既平，回酋偝德，不得已而興師。歷五年艱阻，賴上天助順，將士効力，遂定葉爾羌喀什噶爾，開地二萬里。既告成太學，勒銘西陲，惟以持盈慎旃，永保丕基為念。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70600.html
endeavors:
- id: guji-弘曆-endeavor-1
  title_zh: 平定回部開拓西域
  summary: 因大小和卓叛亂戕使，命兆惠富德等三路進兵，歷黑水固守遠援，終追至巴達克山獻馘，西域悉定。
  phases:
  - key: brewing
    name: 釋囚撫回轉而生變
    labels:
      zh:
      - 釋放二酋
      - 撫綏舊屬
    start_date: 1755-01-01
    highlight_event_id: guji-弘曆-event-pingding
  - key: breakthrough
    name: 易將進兵圍困黑水
    labels:
      zh:
      - 克庫車定阿克蘇
      - 黑水築堡固守
    start_date: 1758-01-01
    highlight_event_id: guji-弘曆-event-pingding
  - key: climax
    name: 遠援解圍窮追獻馘
    labels:
      zh:
      - 夜搗賊營解圍
      - 窮追巴達克山
    start_date: 1759-01-01
    highlight_event_id: guji-弘曆-event-zhuifeng
  - key: closure
    name: 頒詔中外告成天下
    labels:
      zh:
      - 頒詔覃恩
      - 設官定賦
    start_date: 1759-12-23
    highlight_event_id: guji-弘曆-event-pingding
  decisions:
  - date: 1758-06-01
    title_zh: 命兆惠旋師定回部
    rationale: 以兆惠習知西事，搜剿準夷餘黨既定，遂令直壓回疆，以收事半功倍之效。
  - date: 1759-12-23
    title_zh: 以平定回部頒詔覃恩
    rationale: 罪人既得，絕徼永清，當宣慶典，沛恩澤以安中外，並昭敬天告祖之誠。
- id: guji-弘曆-endeavor-2
  title_zh: 郊廟禮文與勒石紀功
  summary: 當長至親祀圜丘，告祭方澤社稷太廟，復御製太學及葉爾羌諾爾碑文，以武始以文終，垂訓後世。
  phases:
  - key: brewing
    name: 齋戒郊宮敬天事神
    labels:
      zh:
      - 冬至祀天圜丘
      - 遣祭陵寢先師
    start_date: 1759-12-18
    highlight_event_id: guji-弘曆-event-jiaoji
  - key: breakthrough
    name: 太學立碑敘天助順
    labels:
      zh:
      - 御製告成碑文
      - 歷數八助順事
    start_date: 1759-12-23
    highlight_event_id: guji-弘曆-event-taixue
  - key: climax
    name: 西陲勒銘昭示臣民
    labels:
      zh:
      - 勒銘葉爾羌
      - 勒石諾爾紀耆定
    start_date: 1759-12-24
    highlight_event_id: guji-弘曆-event-taixue
  - key: closure
    name: 凱旋郊勞持盈保泰
    labels:
      zh:
      - 凱旋郊勞
      - 訓勉持盈慎旃
    start_date: 1760-01-01
    highlight_event_id: guji-弘曆-event-taixue
  decisions:
  - date: 1759-12-23
    title_zh: 增祝冊備肆類並告太廟
    rationale: 念上天佑順列祖垂休集此大勳，當以郊廟大典昭謝鴻庥，益增寅惕。
  - date: 1759-12-24
    title_zh: 御製三碑以文終武
    rationale: 以定回非夙願，賴天運斡旋，故勒石太學西陲，明不得已用兵之意，勉後世以仁撫眾。
events:
- id: guji-弘曆-event-birth
  title_zh: 弘曆誕生
  date: 1711-09-25
  year_of: 1711
  description: 康熙五十年八月十三日生於雍親王府，是為後之乾隆皇帝。
- id: guji-弘曆-event-jiaoji
  title_zh: 冬至親祀圜丘
  date: 1759-12-21
  year_of: 1759
  description: 乾隆二十四年冬至，上親詣圜丘行禮，次日詣壽康宮慶賀皇太后，並御太和殿受賀。
- id: guji-弘曆-event-pingding
  title_zh: 以平定回部頒詔中外
  date: 1759-12-23
  year_of: 1759
  description: 大小和卓既殲，葉爾羌喀什噶爾悉入版圖，遂頒詔天下，開列覃恩諸條，將軍大臣各封賞有差。
- id: guji-弘曆-event-taixue
  title_zh: 御製平定回部告成太學碑文
  date: 1759-12-24
  year_of: 1759
  description: 敘五年兩定之艱，歷數天恩助順八事，繫以銘文，立碑太學，又勒銘葉爾羌及諾爾，以示終武以文之意。
- id: guji-弘曆-event-zhuifeng
  title_zh: 富德窮追至巴達克山獻馘
  date: 1759-10-15
  year_of: 1759
  description: 副將軍富德等窮追二酋至巴達克山界，降眾萬人，霍集占殞傷，布拉呢敦斃於眾怒，遂獻馘班師。
- id: guji-弘曆-event-death
  title_zh: 弘曆駕崩
  date: 1799-02-07
  year_of: 1799
  description: 嘉慶四年正月初三日，太上皇帝崩於養心殿，終年八十有九，廟號高宗。
