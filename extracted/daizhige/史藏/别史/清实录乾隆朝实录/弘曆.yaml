  decisions:
  - date: 1770-02-04
    title_zh: 降旨普免正赋一次分三年轮免
    rationale: 府库充羡，与其多聚左藏，不如使茅檐蔀屋自为流通，且逢庆典，协天心而彰国庆
  - date: 1770-02-08
    title_zh: 谕令业户照免粮银四分减佃租
    rationale: 有田业户既广被恩膏，食力佃农亦应分沾渥泽，正供既免则食德宜均
- id: guji-弘曆-endeavor-2
  title_zh: 缅甸撤兵后边防筹画与恩科行庆
  summary: 彻兵后虑缅酋观望迟回，留贵州兵协守永昌沿边，扼通商以待奉表，同时以诞寿庆典开恩科乡会试
  phases:
  - key: breakthrough
