endeavors:
- id: guji-弘曆-endeavor-1
  title_zh: 乾隆三十五年普免天下钱粮
  summary: 以六十诞辰与皇太后八旬万寿为庆，自乾隆三十五年始通行蠲免各省正赋，分三年轮免，并令业户减佃户租四分
