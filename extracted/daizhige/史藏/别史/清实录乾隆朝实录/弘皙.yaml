  dilemmas:
  - 安分承受亲亲之恩与借父系旧东宫名分结党觊觎
  - 朋比庄亲王以图声势与循理守分以保宗室
  - 听信妖言问国运寿算以求升腾与敬畏国法不萌异心
  lesson: 以废太子之子而怀异志，结党信邪，终自陷大逆，纵蒙宽贷亦身死圈禁，守分畏法方为宗室保全之道
  summary_first_person: 我为理密亲王胤礽之子，圣祖之孙，雍正朝袭理亲王，乾隆初革爵，复以交通庄亲王，听信安泰妖言，问准噶尔能否到京，天下太平与否，妄测圣寿与自身升腾，事发论大逆，从宽留命，圈禁景山东果园，子孙革宗室给红带，终老禁所，此皆自作之孽
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0106.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷0106.md
