  - 出嗣果邸后本生与嗣父两全之难
  - 亲贵守分与朝政避嫌之难
  - 病重托孤与幼子家务处置之难
  lesson: 亲贵以安分守成为安，病托幼子得君恩保全家业
  summary_first_person: 我是弘瞻，雍正第六子，出嗣果亲王为嗣。乾隆南巡途中闻我病重，特加恩晋封郡王以慰我心，期我速痊。不料三月初八申刻我即薨逝，皇上闻讣深为惋悼，命一切丧事照亲王例办，遣六阿哥成服，又派大臣料理王府家务以护我二幼子。
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0732.html
