events:
- id: guji-张廷玉-event-birth
  title_zh: 出生于桐城
  date: 1672
  year_of: 1672
  description: 康熙十一年生于安徽桐城张氏相门，为张英之子
- id: guji-张廷玉-event-1
  title_zh: 乞休得允并蒙许配享
  date: 1749-12-01
  year_of: 1749
  description: 乾隆十四年许原官致仕回籍，面求配享一言为券得允，又赐诗为券，谢恩不至经廷议停配享而仍蒙宽留
- id: guji-张廷玉-event-2
  title_zh: 乾隆十五年四月被议罢配享
  date: 1750-04-01
  year_of: 1750
  description: 因侍郎伍龄安奏配享位次事发，览配享名单，谕责其无德业猷为、漠视君父大义，令自量应否配享，大学士九卿议请停罢，奉旨罢其配享，宽免革去大学士职衔
- id: guji-张廷玉-event-death
  title_zh: 病逝于京邸
  date: 1755-04-30
  year_of: 1755
  description: 乾隆二十年三月十九日卒于京，年八十四，终以罢配享定论
