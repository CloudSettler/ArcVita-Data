  - 以君恩保全与公论劝惩之间的名实之辨
  lesson: 功在开疆帷幄者方可侑食太庙，仅以文字谨慎事君而无经国大节者，终不可幸窃非分之荣
  summary_first_person: 我历事康雍乾三朝，以缮写谕旨入军机，旅进旅退十余年，蒙世宗遗诏配享太庙，上年乞休复求一言为券得允，不料今春以漠视君恩、悖于大义被议罢配享，方知无汗马经国之功者，不当滥厕元勋之列
  source_urls:
  - https://daizhige.org
