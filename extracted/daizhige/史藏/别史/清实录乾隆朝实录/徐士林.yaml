events:
- id: guji-徐士林-event-birth
  title_zh: 出生
  date: 1690-01-01
  year_of: 1690
  description: 生于江苏长洲自幼力学以忠孝廉能自砺登科入仕
- id: guji-徐士林-event-1
  title_zh: 任江苏巡抚理苏政
  date: 1740-05-01
  year_of: 1740
  description: 任江苏巡抚留心政务察钱价抚水灾理漕运颇著声绩
- id: guji-徐士林-event-2
  title_zh: 疏请宝苏局铸钱搭饷获准
  date: 1741-09-01
  year_of: 1741
  description: 疏称宝苏局铸出青钱除工料岁得饷钱七万余串请自秋起兵饷每两搭钱八十文户部议准行
- id: guji-徐士林-event-3
  title_zh: 抱病解组回籍侍母
  date: 1741-09-15
  year_of: 1741
  description: 身抱沉疴蒙恩命回籍调摄力疾旋里以图侍奉耄母鞠氏
- id: guji-徐士林-event-death
  title_zh: 逝世追祀京师贤良祠
  date: 1741-10-11
  year_of: 1741
  description: 溘逝于家遗疏劝忧盛危明奉旨入祀京师贤良祠赐祭一坛赏给御书匾额旌闾
