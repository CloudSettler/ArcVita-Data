  summary_first_person: 余桐城方观承，久任直隶总督，值乾隆十五年夏清河永定河并涨，州县田庐被淹，辄奏请借给耔种麦种，加赈口粮，蒙恩赏给不还仓，至今感戴，惟以不使一民失所为念
