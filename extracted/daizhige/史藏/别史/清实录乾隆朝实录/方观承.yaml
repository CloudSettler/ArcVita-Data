  - date: 1749-09
    title_zh: 以河工民生并重定督直方略
    rationale: 畿辅近水州县恒被淹，非堤固民安不可久治，故堤赈兼筹
  - date: 1760-07
    title_zh: 水大年分别成灾与否按例办赈
    rationale: 非一律蠲缓，必查明被水轻重疏防议处与抚恤并行，防胥吏滋弊
