    highlight_event_id: guji-方观承-event-1750-laoting
  decisions:
  - date: 1750-07-25
    title_zh: 分别给麦种银乘时播种秋麦
    rationale: 荍麦已晚不能补种者急筹秋麦以为明春之计
  - date: 1750-07-18
    title_zh: 乐亭潮灾先加赈一月并给房银
    rationale: 潮过成卤碱沙压成滩，灾重待哺，宜先安顿再核分数豁粮
events:
- id: guji-方观承-event-birth
  date: 1698-01-01
  year_of: 1698
  title_zh: 出生于安徽桐城
  description: 康熙三十七年生，桐城方氏，后以进士入仕历任封疆
- id: guji-方观承-event-1750-jiezhong
  date: 1750-07-04
  year_of: 1750
  title_zh: 奏报清河永定河淹田请借耔种奉旨赏给
  description: 奏新城雄县永清霸州武清十九村等被淹请借耔种来年免息还仓，得旨加恩赏给不必还仓速办
- id: guji-方观承-event-1750-laoting
  date: 1750-07-18
  year_of: 1750
  title_zh: 奏报乐亭海潮漫进请赈
  description: 奏乐亭杨家庄等三十六村海潮乘汛漫进田成卤碱，请加赈一月给口粮房银查豁钱粮
- id: guji-方观承-event-1750-yongding
  date: 1750-07-25
  year_of: 1750
  title_zh: 永定河月堤漫口抢筑筹麦种口粮
  description: 月堤漫刷抢筑未合龙，奉旨分别给麦种银播种秋麦，十一月起分别赈给口粮，毗连州县一体查办
- id: guji-方观承-event-death
  date: 1768-09-20
  year_of: 1768
  title_zh: 卒于直隶总督任上
  description: 乾隆三十三年秋卒，累任直隶总督治河赈济著绩，谥悫敏
