    title_zh: 亲勘下口两埝水道村庄被淹
    rationale: 不凭属员禀报，亲行察看被淹轻重，分别额赋滩租酌办
  - date: 1767-09
    title_zh: 援旧例请埝内粮地酌予缓徵
    rationale: 下口埝内虽系有粮之地，然村民以水过淤停化瘠为腴，恳请缓徵以安民情
