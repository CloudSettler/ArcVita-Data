      - 筹议
    start_date: 1754-08-20
    highlight_event_id: guji-方观承-event-yongding
  - key: climax
    name: 上紧开挖堵筑
    labels:
      zh:
      - 抢护
      - 施工
    start_date: 1754-08-25
    highlight_event_id: guji-方观承-event-yongding
  - key: closure
    name: 自请议处肃河防
    labels:
      zh:
      - 任过
      - 整饬
    start_date: 1754-09-01
    highlight_event_id: guji-方观承-event-yongding
  decisions:
  - date: 1754-08-20
    title_zh: 议开旧河身掣溜归流
    rationale: 漫口刷深口外难挖，惟开上口旧河七八里引全河入新河，下口接堤，方可施工
  - date: 1754-08-18
    title_zh: 自请交部严加议处
    rationale: 职司河务不能先事预防，甘受处分以明慎重河防之戒
- id: guji-方观承-endeavor-2
  title_zh: 蓟运还乡滹沱等河水灾查勘抚恤
  summary_zh: 奉旨查勘永定蓟运等河附近洼地水长被淹情形，核蓟州玉田丰润宁河乐亭晋州藁城束鹿武清等地灾分，分别堵筑抚恤
  phases:
  - key: brewing
    name: 滨河民埝漫渍
    labels:
