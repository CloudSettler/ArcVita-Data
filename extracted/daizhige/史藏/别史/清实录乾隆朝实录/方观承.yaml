endeavors:
- id: guji-方观承-endeavor-1
  title_zh: 山东劝输义仓储备养民
  summary: 署理山东巡抚期间体察北省易办上摺劝输义仓为直隶山东及三晋豫省倡行储备之议
  phases:
  - key: brewing
    name: 灾后体察仓储空虚
    labels:
      zh: 体察筹议
    start_date: 1746-11-01
    highlight_event_id: guji-方观承-event-yicang
  - key: breakthrough
    name: 上摺力陈北省易办
    labels:
      zh: 奏陈倡行
    start_date: 1747-01-10
    highlight_event_id: guji-方观承-event-yicang
  - key: climax
    name: 军机寄摺令各省查议
    labels:
      zh: 推行各省
    start_date: 1747-01-15
    highlight_event_id: guji-方观承-event-yicang
  - key: closure
    name: 直省议行义仓成例
    labels:
      zh: 定议储备
    start_date: 1747-02-01
    highlight_event_id: guji-方观承-event-yicang
  decisions:
  - date: 1747-01-10
    title_zh: 劝输义仓专主北省先行
    rationale: 因北省民情近实且屡经水灾宜先储备以备凶荒故请自直隶山东始次及山陕河南
  - date: 1747-01-15
    title_zh: 不立迫捐唯事劝输
    rationale: 恐官吏借端滋扰故以劝输为名使绅民乐输而仓谷自充养民而不累民
- id: guji-方观承-endeavor-2
  title_zh: 东省平粜借种安集湖田垦辟
  summary: 山东上年被水之后奏请早开平粜借给口粮耔种处置兰山聚借之变并查勘安山湖地招民垦种升科
  phases:
  - key: brewing
    name: 被水之后粮价昂贵
    labels:
      zh: 查明粮价
    start_date: 1746-12-01
    highlight_event_id: guji-方观承-event-pingyao
  - key: breakthrough
    name: 奏请减价平粜早粜
    labels:
      zh: 平粜接济
    start_date: 1747-01-20
    highlight_event_id: guji-方观承-event-pingyao
  - key: climax
    name: 兰山聚借严查首从
    labels:
      zh: 弹压查办
    start_date: 1747-02-05
    highlight_event_id: guji-方观承-event-lanshan
  - key: closure
    name: 安山湖拨地认垦升科
    labels:
      zh: 垦田养生
    start_date: 1747-02-15
    highlight_event_id: guji-方观承-event-anshan
  decisions:
  - date: 1747-01-20
    title_zh: 酌减粜价并提前于二月初开粜
    rationale: 灾区贫民待食甚殷若待二月下旬则恐失所故市价六七钱至八钱者减价一钱八钱以上者以七钱出粜并准借口粮秋后以米二谷还仓
  - date: 1747-02-05
    title_zh: 兰山聚众不讳饰据实参办
    rationale: 南乡借粮北乡蜂拥至府县垒塞仪门若讳饰则长刁风故饬司道严拏张怀敬等首从并查文武弹压失职之咎
  - date: 1747-02-15
    title_zh: 安山湖低洼地许民垦麦升科
    rationale: 湖地宽阔雨水调匀则秋禾可收涸后种麦收足抵秋禾每亩徵银二三分至轻故拨给贫民认垦既保运道分水又全民田生计
events:
- id: guji-方观承-event-birth
  date: 1698
  year_of: 1698
  title_zh: 生于安徽桐城
  description: 康熙三十七年生于桐城方氏家学渊源少习经世之务后由部曹出任封疆
- id: guji-方观承-event-yicang
  date: 1747-01-15
  year_of: 1747
  title_zh: 署山东巡抚劝输义仓
  description: 乾隆十二年正月上摺陈北省尤称易办直隶山东现在议行请将摺寄山陕河南督抚查明仿照覆奏
- id: guji-方观承-event-pingyao
  date: 1747-01-20
  year_of: 1747
  title_zh: 奏请东省减价平粜借粮
  description: 以东省被水米谷缺乏商贩价增请市价六七钱以上者酌减一钱八钱以上者以七钱出粜截留漕粮赈剩米先尽减粜并准借口粮二月初即开粜奉旨甚妥实力奉行
- id: guji-方观承-event-lanshan
  date: 1747-02-05
  year_of: 1747
  title_zh: 兰山县民聚众借粮案
  description: 沂州兰山北乡因南乡准借仓粮正月初四聚集多人赴县借领蜂拥至府副将衙门并有垒塞仪门打伤差役情事未据府县报到奉旨交阿里衮严查办理
- id: guji-方观承-event-anshan
  date: 1747-02-15
  year_of: 1747
  title_zh: 查勘安山湖拨地垦种升科
  description: 东平州安山湖地宽阔低洼藉以分减运河涨水查明涸后宜种二麦湖田沃壤麦收足抵秋禾拟拨贫民认垦每亩额徵银二三分
- id: guji-方观承-event-death
  date: 1768
  year_of: 1768
  title_zh: 卒于直隶总督任上
  description: 乾隆三十三年秋卒于直隶总督任内生前督治畿辅水利赈济多有实政朝廷赐恤如例
