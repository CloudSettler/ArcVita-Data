  - key: breakthrough
    name: 奏请借耔种还仓
    labels:
      zh: 奏请
    start_date: 1750-07-04
    highlight_event_id: guji-方观承-event-1750-jiezhong
  - key: climax
    name: 奉旨加恩赏给不还
    labels:
      zh: 施恩
    start_date: 1750-07-05
    highlight_event_id: guji-方观承-event-1750-jiezhong
  - key: closure
    name: 速办均沾实惠
    labels:
      zh: 落实
    start_date: 1750-07-10
    highlight_event_id: guji-方观承-event-1750-jiezhong
  decisions:
  - date: 1750-07-04
    title_zh: 查明无力贫户酌借耔种
    rationale: 水已涸出正可补种荍麦，以资力作，不使失种
  - date: 1750-07-05
    title_zh: 遵旨赏给不还仓速行查办
    rationale: 补种仅系杂粮资糊口，加恩赏给方能均沾实惠
- id: guji-方观承-endeavor-2
  title_zh: 永定河漫口善后兼乐亭潮灾抚恤
  summary: 永定河月堤漫刷抢筑未合龙，筹麦种口粮以备秋麦明春，兼乐亭海潮卤碱加赈修房豁粮
  phases:
  - key: brewing
    name: 月堤漫刷抢筑
    labels:
