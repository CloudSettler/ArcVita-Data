  - 河工迁村安民生与束水防洪两难
  - 边地积豆留本地平粜与运京备用的两难
  - 粮贵封缸节费与虚禁滋弊的两难
  lesson: 办事当屏斥虚文，因时制宜，于成法中寓稽察撙节之道，以求实济
