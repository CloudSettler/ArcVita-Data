    rationale: 陕甘营驿屡调马缺须宽裕备用前解西安马走井陉山西恐拥挤故另由磁州河南分路既保膘力又裕军营而南巡改折价雇备不误差务
events:
- id: guji-方观承-event-birth
  title_zh: 出生
  date: 1698
  year_of: 1698
  description: 直隶桐城人康熙三十七年生后以翰林出任封疆久督直隶
- id: guji-方观承-event-1
  title_zh: 奏宣化解驼改道
  date: 1756-12-22
  year_of: 1756
  description: 奏称宣化解驼往山西有内地边地两路内地关沟崎岖迂远山西购驼系归化城一带若由宣化解大同转解便捷已咨商晋抚南巡需驼改用车骡咨商武备院奉旨好悉心办理总以妥速为要不可拘例
- id: guji-方观承-event-2
  title_zh: 奏设车马迎察哈尔吉林兵
  date: 1756-12-27
  year_of: 1756
  description: 奏称察哈尔吉林兵到京前后陆续起程于良乡以南四大站每站安设大车两班足供千兵吉林未到则暂令州县带回将到前二日齐集沿途多备住宿酌备车辆接济疲马奉旨诸凡甚妥
- id: guji-方观承-event-3
  title_zh: 挑南巡官马解西安资军
  date: 1757-01-05
  year_of: 1757
  description: 奉谕于豫备南巡马内再挑五千解送西安以供陕甘更调赴军营奏称南巡官马共一万二千五百八十余匹内挑五千另带余马改由磁州河南赴西安分路免拥挤奉旨甚妥
- id: guji-方观承-event-death
  title_zh: 逝世
  date: 1768
  year_of: 1768
  description: 乾隆三十三年卒于直隶总督任上谥恭勤
