endeavors:
- id: guji-方观承-endeavor-1
  title_zh: 永定河下口改由六工出水并迁安置
  summary: 奏改下口由六工出水，勘定七村迁移，拨给庄基房价，定汛员经管，立案放淤久远循行
  phases:
  - key: brewing
    name: 查勘下口淤决
    labels:
      zh: 勘河
    start_date: 1751-05
    highlight_event_id: guji-方观承-event-1
  - key: breakthrough
    name: 奏请改由六工
    labels:
      zh: 改口
    start_date: 1751-06
    highlight_event_id: guji-方观承-event-1
  - key: climax
    name: 七村愿迁给价建房
    labels:
      zh: 迁置
    start_date: 1751-06
    highlight_event_id: guji-方观承-event-1
  - key: closure
    name: 定名立案循行
    labels:
      zh: 立案
    start_date: 1751-06
    highlight_event_id: guji-方观承-event-1
  decisions:
  - date: 1751-06
    title_zh: 不愿移旧河滩地改自择高阜给价建房
    rationale: 顺民情自择秉教村李家铺等高阜拨给庄基，查明旗民给价拨补，免水患再扰
  - date: 1751-06
    title_zh: 南埝上汛兼管旧下口移驻牛眼
    rationale: 下口迁后二十里乏员管理，移汛就近经管堤身柳株，分别名目造册存案
- id: guji-方观承-endeavor-2
  title_zh: 宣化屯豆粜运与烧缸节制
  summary: 奏请宣化余豆及时粜卖，以半留本地平粜半由旗马带运进京，并查定缸户额数以节糜耗
  phases:
  - key: brewing
    name: 宣府积豆七万余石奏粜
    labels:
      zh: 积豆
    start_date: 1751-06
    highlight_event_id: guji-方观承-event-2
  - key: breakthrough
    name: 酌留一半平粜一半带运
    labels:
      zh: 分运
    start_date: 1751-06
    highlight_event_id: guji-方观承-event-2
  - key: climax
    name: 查定缸户牙帖定额定量
    labels:
      zh: 节烧
    start_date: 1751-06
    highlight_event_id: guji-方观承-event-3
  - key: closure
    name: 口袋借用漕后通仓议运
    labels:
      zh: 济京
    start_date: 1751-08
    highlight_event_id: guji-方观承-event-2
  decisions:
  - date: 1751-06
    title_zh: 三处余豆二万一千余石半留半运
    rationale: 酌盈剂虚，保安宣化万全余豆留半备本地平粜，余半俟八旗马回京零星分带以省脚价
  - date: 1751-06
    title_zh: 不概行封缸免税另筹定额节烧
    rationale: 免税封缸易致潜烧居奇胥吏需索，宜明定缸户之数及每日烧粮定数以裕盖藏
