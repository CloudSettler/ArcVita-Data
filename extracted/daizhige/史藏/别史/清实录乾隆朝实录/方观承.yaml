    title_zh: 奏请外来群羊赴津属荒洼牧放
    rationale: 近京秋麦最忌牧羊外贩千百为群假荒草为名潜食麦苗拦阻即殴毙村民不得不分别本处外来严加禁约
  - date: 1764-11-01
    title_zh: 请禁私带绳鞭锤棍并令营汛阻回
    rationale: 羊贩恃众持械方敢攒殴卫农须从器械与通道两端断其凭恃使违禁者一露即惩
