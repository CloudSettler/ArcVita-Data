  - key: climax
    name: 筹麦种赈口粮加赈乐亭
    labels:
      zh: 赈济
    start_date: 1750-07-25
    highlight_event_id: guji-方观承-event-1750-laoting
  - key: closure
    name: 查分数豁钱粮抚绥
    labels:
