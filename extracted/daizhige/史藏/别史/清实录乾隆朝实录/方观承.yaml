  era: 清
  reign_ref: 乾隆
  archetype: 治河抚民之督抚
  dilemmas:
  - 让地与水与与水争利之衡，小民占滩耕种与河道行水相争
  - 埝内粮地缓徵与上游滩地免租之间，旧例与实情当如何分晰
  - 抚恤从宽则耗费国帑，从严则穷黎失所
  lesson: 治河先分内外，抚民先核名实，让水得行则民得安
  summary_first_person: 我督直多年，深知永定无定，埝内之地本当让水，下口滩地熟则徵租荒则免租，惟据实分晰缓徵免赋，方不负朝廷轸恤之心
  source_urls:
