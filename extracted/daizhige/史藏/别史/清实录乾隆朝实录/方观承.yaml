      - 巡察
      - 民瘼
    start_date: 1754-08-15
    highlight_event_id: guji-方观承-event-jiyun
  - key: breakthrough
    name: 分地查勘灾分
    labels:
      zh:
      - 查勘
      - 核灾
    start_date: 1754-08-22
    highlight_event_id: guji-方观承-event-jiyun
  - key: climax
    name: 蓟州最重先赈
    labels:
      zh:
      - 抚恤
      - 堵筑
    start_date: 1754-08-28
    highlight_event_id: guji-方观承-event-jiyun
  - key: closure
    name: 余县续查办理
    labels:
      zh:
      - 续办
      - 奏报
    start_date: 1754-09-05
    highlight_event_id: guji-方观承-event-jiyun
  decisions:
  - date: 1754-08-22
    title_zh: 先勘蓟州照例抚恤
    rationale: 蓟州被水最重，丰润宁河亦被淹浸，急赈以安民心，再及滹沱滦河沿岸
  - date: 1754-08-28
    title_zh: 蓟运还乡漫口赶紧堵筑
    rationale: 民埝漫溢有妨秋成，非速堵不能御淹田之患，故勘赈与堵筑并举
events:
- id: guji-方观承-event-birth
  title_zh: 方观承出生
  date: 1698
  year_of: 1698
  description: 直隶桐城人，康熙三十七年生，後以翰林出任封疆，督直隶多年
- id: guji-方观承-event-yongding
  title_zh: 奏报永定河漫堤并议堵筑
  date: 1754-08-20
  year_of: 1754
  description: 六月廿九至七月初二昼夜大雨，永定上游骤长丈余，温开东西老堤百六十余丈，奏请开旧河掣溜堵筑，被水户口查明抚恤
- id: guji-方观承-event-jiyun
  title_zh: 查勘蓟运还乡滹沱水灾
  date: 1754-08-28
  year_of: 1754
  description: 查蓟州蓟运玉田还河漫溢，丰润宁河村庄被淹，滦河滹沱涨发，蓟州最重先行抚恤，余县查明办理，漫口赶紧堵筑
- id: guji-方观承-event-death
  title_zh: 方观承去世
  date: 1768
  year_of: 1768
  description: 乾隆三十三年卒於直隶总督任上，治直隶凡十余年，以治水赈恤勤慎著称
