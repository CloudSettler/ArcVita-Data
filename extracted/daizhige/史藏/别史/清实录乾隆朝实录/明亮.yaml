    rationale: 先买耔种不敷散给，须拨仓补运以劝番耕
  - date: '1776-09-15'
    title_zh: 内地采麦千石解美诺勒乌围
    rationale: 新附番地缺粮，预筹口食方能安辑屯种
- id: guji-明亮-endeavor-2
  title_zh: 郭罗克勒缉凶犯边务
  description_zh: 会同文绶桂林舒常，督委阿林等勒拏杀害青海公礼塔尔之吹斯枯尔拉布坦等，坐彻兵宽限受严饬
