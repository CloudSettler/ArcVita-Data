    rationale: 意谓纵之适以擒之，使贼回旧巢便于分头密捕
  - date: '1776-10-01'
    title_zh: 奉严旨仍勒限务获
    rationale: 姑息必致群番效尤，须以威严惩一儆百永靖边徼
