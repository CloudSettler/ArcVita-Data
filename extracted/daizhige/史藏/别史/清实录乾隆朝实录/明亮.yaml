  description_zh: 雍正十四年生，满洲正黄旗人，后以军功起家
- id: guji-明亮-event-death
  title_zh: 逝世
  type: death
  date: '1822'
  year_of: 1822
  description_zh: 道光二年卒，历乾隆嘉庆道光三朝，官至将军大学士
- id: guji-明亮-event-1776-tuntian
  title_zh: 奏报番地屯种采买事
  type: achievement
  date: '1776-10-15'
  year_of: 1776
  description_zh: 乾隆四十一年九月辛未，与文绶等奏采买耔种四十余石复拨仓五百石，采麦千石，买牛二千余头，雇匠打造农具，准兵丁带盐接济
- id: guji-明亮-event-1776-guoluoke
  title_zh: 郭罗克缉凶彻兵受申饬
  type: setback
  date: '1776-10-24'
  year_of: 1776
  description_zh: 乾隆四十一年九月己卯，因委员阿林等轻信土司虚语彻兵宽限，与文绶桂林舒常同被传谕严饬，责令一年内勒缉凶犯务获
