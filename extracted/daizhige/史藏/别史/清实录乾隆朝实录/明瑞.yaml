    labels:
      zh:
      - 宣猷效績
    start_date: 1759-08-01
    highlight_event_id: guji-明瑞-event-xichui
  - key: climax
    name: 陛見受命節制雲貴
    labels:
      zh:
      - 受命專征
    start_date: 1767-09-01
    highlight_event_id: guji-明瑞-event-manjie
  - key: closure
    name: 軍前查核激勵將士
    labels:
      zh:
      - 嚴明賞罰
    start_date: 1768-02-02
    highlight_event_id: guji-明瑞-event-fengjue
  decisions:
  - date: 1767-09-01
    title_zh: 整頓軍營悉心籌畫
    rationale: 前督調度失宜士氣不振，須明紀律、通糧道、聯聲援，方可深入致討
  - date: 1768-02-02
    title_zh: 請查額勒登額逗留實情
    rationale: 西路圍攻老官屯曠日無功，須破阿瓦後詳查奮勉虛實，以明功罪而振軍紀
