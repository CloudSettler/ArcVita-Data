endeavors:
- id: guji-明瑞-endeavor-1
  title_zh: 滇黔提镇整顿与缅甸进剿调度
  summary_zh: 针对自木邦退回后将士离心与提调非所长，奏劾怠玩之索柱并请谭五格扬宁对调以资臂指
  phases:
