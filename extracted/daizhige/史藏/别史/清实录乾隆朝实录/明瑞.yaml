    title_zh: 密令绰克托回守伊犁并商堵截
    rationale: 大军既出防后路空虚，又恐逆回外逃，当分兵扼要使无从得食而自溃
events:
- id: guji-明瑞-event-birth
  date: 1730
  year_of: 1730
  title_zh: 出生
  description: 约乾隆初年生于富察氏满洲家门，少长习武从军
- id: guji-明瑞-event-1
  date: 1765-04-15
  year_of: 1765
  title_zh: 伊犁惠远怀顺城工告竣请名
  description: 与部属奏报伊犁河满洲驻防新城及哈什回人新城告竣，得赐名惠远怀顺及四门嘉名
- id: guji-明瑞-event-2
  date: 1765-04-06
  year_of: 1765
  title_zh: 闰二月初五自伊犁起程援乌什
  description: 除爱隆阿巡边及观音保援兵外，另派满洲索伦察哈尔千一百余名及回兵二百名往援乌什，并檄德福纳世通会商堵截布噜特方向
- id: guji-明瑞-event-3
  date: 1765-04-20
  year_of: 1765
  title_zh: 奏请存记讷苏鄂斯璊等剿贼功次
  description: 乌什军前管队侍卫及库车等城伯克奋勉进剿，请于平定后一体交部议叙
- id: guji-明瑞-event-death
  date: 1768-05-01
  year_of: 1768
  title_zh: 卒于征缅军中
  description: 后以定边将军征缅甸，师劳瘴地，卒于军中，朝廷优恤
