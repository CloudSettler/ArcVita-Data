endeavors:
- id: guji-明瑞-endeavor-1
  title_zh: 伊犁屯田筑城安回
  summary: 迁求伊犁回人三千二十户分屯诸处，勘定巴尔托辉泉甘土肥，奏请筑一大城以驻回众，空出水泉以供满洲兵屯田
  phases:
  - key: brewing
    name: 安插回众初定屯所
    labels:
      zh:
      - 屯田安插
    start_date: 1763-10-01
    highlight_event_id: guji-明瑞-event-yili
  - key: breakthrough
    name: 勘定巴尔托辉筑城之议
    labels:
      zh:
      - 筑城联络
    start_date: 1764-03-01
    highlight_event_id: guji-明瑞-event-yili
  - key: climax
    name: 奏请移驻二千一百二十户
    labels:
      zh:
      - 分驻经营
    start_date: 1764-05-05
    highlight_event_id: guji-明瑞-event-yili
  - key: closure
    name: 先造住房明年筑城
    labels:
      zh:
      - 农隙兴工
    start_date: 1764-06-01
    highlight_event_id: guji-明瑞-event-yili
  decisions:
  - date: 1764-05-05
    title_zh: 以巴尔托辉为总汇筑大城
    rationale: 伊犁哈什二水之间筑城驻回众则声势联络，又可空出摩垓图阿里玛图水泉为满洲兵屯田之用
  - date: 1764-05-05
    title_zh: 河南河北回户分驻调配
    rationale: 回人情愿出力，留固勒扎海努克部分户守旧屯，余户并呼伦贝尔兵户俱驻巴尔托辉，以利耕作与防卫
- id: guji-明瑞-endeavor-2
  title_zh: 抚绥厄鲁特严饬军纪
  summary: 办理察哈尔厄鲁特官员俸饷分别给发以安生计，处置屯田回人逃亡失当受申饬，整顿伊犁军纪恩威并施
  phases:
  - key: brewing
    name: 察哈尔厄鲁特官员协办伊犁
    labels:
      zh:
      - 俸饷安置
    start_date: 1763-08-01
    highlight_event_id: guji-明瑞-event-shenchi
  - key: breakthrough
    name: 新派厄鲁特半俸之争
    labels:
      zh:
      - 格外加恩
    start_date: 1764-04-01
    highlight_event_id: guji-明瑞-event-shenchi
  - key: climax
    name: 端索丕逃亡遣归失当
    labels:
      zh:
      - 军纪申饬
    start_date: 1764-05-08
    highlight_event_id: guji-明瑞-event-shenchi
  - key: closure
    name: 发伊犁给兵丁为奴示惩
    labels:
      zh:
      - 昭示炯戒
    start_date: 1764-05-10
    highlight_event_id: guji-明瑞-event-shenchi
  decisions:
  - date: 1764-04-01
    title_zh: 请厄鲁特办事世职官分别给俸
    rationale: 新派厄鲁特俱归附有年情愿效力，不应止给半俸，照察哈尔例分别给发于伊犁生计更有裨益
  - date: 1764-05-08
    title_zh: 回人补缺顶替处置
    rationale: 屯田回人端索丕中途逃走即以阿布都喇伊木补缺，本欲存屯田之额，然遣逃人归故土遂其本意，有失惩儆
events:
- id: guji-明瑞-event-birth
  title_zh: 生于富察氏
  date: 1730-01-01
  year_of: 1730
  place_zh: 京师
  summary: 富察氏子弟出身，袭承勋旧，少以骁勇闻，后擢任伊犁将军经略西陲
- id: guji-明瑞-event-yili
  title_zh: 奏请巴尔托辉筑大城安置回众
  date: 1764-05-05
  year_of: 1764
  place_zh: 伊犁巴尔托辉
  summary: 会同奏称迁求伊犁回人三千二十户已交阿奇木公茂萨分屯，巴尔托辉泉甘土肥回人愿出力筑大城，请移驻二千一百二十户先造住房明年筑城，得旨报闻
- id: guji-明瑞-event-shenchi
  title_zh: 因逃人处置未协受申饬兼议俸饷
  date: 1764-05-08
  year_of: 1764
  place_zh: 伊犁
  summary: 因将逃亡回人端索丕发回叶尔羌本籍，被议不足示惩，奉旨发往伊犁给兵丁为奴，传旨申饬，又奉旨将厄鲁特五百户办事世职官照察哈尔例分别给俸
- id: guji-明瑞-event-death
  title_zh: 征缅力战殉国
  date: 1768-05-10
  year_of: 1768
  place_zh: 缅甸小猛育
  summary: 由伊犁将军调任云贵总督领兵征缅，深入敌境，转战万里，粮尽援绝，力战自戕殉国，谥果烈
