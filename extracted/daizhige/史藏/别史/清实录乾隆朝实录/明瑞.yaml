    highlight_event_id: guji-明瑞-event-work-2
  decisions:
  - date: 1767-07-15
    title_zh: 奏劾曲寻镇总兵索柱革职
    rationale: 索柱于查勘军情要务怠玩不前耽逸用诈若不严参无以肃军纪故请革职留滇效力
  - date: 1767-07-15
    title_zh: 奏请谭五格扬宁对调提督
    rationale: 扬宁于提调非所长且自木邦退回不能服众谭五格久任滇中谙习情形且与黔兵相习易于用命故请就近对调
- id: guji-明瑞-endeavor-2
  title_zh: 严核军需粮石与覆奏木邦夷情
  summary_zh: 严参永昌知府采买军粮舞弊以肃粮道，并覆奏木邦瓮团线五格始末以定招抚进剿之据
  phases:
