  - key: closure
    name: 安辑夷民肃清粮道
    labels:
      zh:
      - 招抚夷民
      - 军食无误
    start_date: 1767-07-25
    highlight_event_id: guji-明瑞-event-work-4
  decisions:
  - date: 1767-07-18
    title_zh: 奏参永昌知府陈大吕克价浮收
    rationale: 军粮最关紧要奉旨宽裕给值乃该府派令额外浮交纵容家人胥吏串同舞弊非寻常扰累可比故请革职拏问
  - date: 1767-07-22
    title_zh: 会奏木邦瓮团线五格情形
    rationale: 须辨明瓮团受宣慰司原委及线五格被挟逃出未助贼匪之实以定招抚进剿方略并安夷众之心
