- id: guji-明瑞-event-death
  title_zh: 阵亡于缅甸蛮结
  date: 1768-03-17
  year_of: 1768
  place_zh: 缅甸蛮结
  description_zh: 征缅深入粮尽援绝突围力战阵亡，乾隆惜之优恤赠谥果烈
