  dilemmas:
  - 身先行陣奮勇陷堅與持重保帥不可輕冒之兩難
  - 孤軍深入直搗阿瓦與糧乏退守宋賽木邦以圖再舉之兩難
  lesson: 奮勇足以摧堅振威，然絕域孤軍無繼則勇亦危，須勇略與糧援並重
  summary_first_person: 吾乃明瑞，承恩公家，歷西陲以身先著績，節制雲貴而進剿緬夷，蠻結冒矢破十六寨，渡天生橋直逼宋賽，目傷猶戰，誓掃賊巢，雖殁無悔
  source_urls:
