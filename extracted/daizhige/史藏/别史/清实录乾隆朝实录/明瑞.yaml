  decisions:
  - date: 1768-01-20
    title_zh: 冒霧衝寨身先破堅
    rationale: 審度蠻結密箐險寨久持無益，須先破中堅以奪氣，故親冒槍炮奮身直入
  - date: 1768-01-28
    title_zh: 繞道渡河奪天生橋
    rationale: 大路橋毀路絕不可強渡，遣偏師牽制而由水源淺處涉渡，佔據山梁以通大軍
- id: guji-明瑞-endeavor-2
  title_zh: 西陲宣猷歷練為將
  summary_zh: 早年隨征西陲每身先士卒，以純誠幹濟受知，擢伊犁領兵，遂膺雲貴節制之任
  phases:
  - key: brewing
