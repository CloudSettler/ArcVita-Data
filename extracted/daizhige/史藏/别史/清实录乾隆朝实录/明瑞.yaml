  place_zh: 京师
  description_zh: 富察氏子，孝贤皇后族侄，约雍正末生，少以勋戚入侍卫行走
- id: guji-明瑞-event-huosikuluke
  title_zh: 霍斯库鲁克岭以寡破众
  date: 1759-09-22
  year_of: 1759
  place_zh: 霍斯库鲁克岭
  description_zh: 率到队九百人整阵奋勇鏖战三时，阵斩逆贼五百余生擒男妇三十余获驼马百余，贼越岭逃窜，得旨交部从优议叙
- id: guji-明瑞-event-san-dui-huihe
