  place_zh: 行在軍機處奉旨
  summary_zh: 以連破賊壘殲賊因糧特沛恩施，原襲承恩公令弟奎林承襲，並賞黃帶子紅寶石頂
- id: guji-明瑞-event-death
  date: 1768
  year_of: 1768
  title_zh: 明瑞殁於緬甸軍中
  place_zh: 緬甸宋賽軍營
  summary_zh: 深入力戰糧援不繼，病傷交迫殁於軍，緬役遂敗，清廷深惜之
