endeavors:
- id: guji-曹文埴-endeavor-1
  title_zh: 履勘浙江柴石海塘
  summary_zh: 自章家庵至乌龙庙履勘塘线区分顶冲急工与涨沙缓工议以柴塘作坦水并筹岁修经费
  phases:
  - key: brewing
    name: 奉命前往海塘履勘
    labels:
      zh: 受命踏勘
    start_date: 1786-03-01
    highlight_event_id: guji-曹文埴-event-1
  - key: breakthrough
    name: 查明顶冲受水最重地段
    labels:
      zh: 查明险要
    start_date: 1786-04-01
    highlight_event_id: guji-曹文埴-event-1
  - key: climax
    name: 奏分急缓并议坦水做法
    labels:
      zh: 区分急缓
    start_date: 1786-05-10
    highlight_event_id: guji-曹文埴-event-1
  - key: closure
    name: 定岁修经费六万两归部核销
    labels:
      zh: 筹定经费
    start_date: 1786-05-12
    highlight_event_id: guji-曹文埴-event-1
  decisions:
  - date: 1786-05-10
    title_zh: 章家庵至范公塘列急工范公塘西列缓工
    rationale: 顶冲回溜逼塘根非石塘不能永固涨沙护塘之处暂缓以节巨费
  - date: 1786-05-12
    title_zh: 以柴塘为坦水并拨余存银五十万生息作岁修
    rationale: 石塘另建坦水需百数十万劳费以柴工为坦水拾取碎石事简工易不与民争柴
- id: guji-曹文埴-endeavor-2
  title_zh: 彻底清查浙江仓库亏缺
  summary_zh: 会同地方官分投府县盘查仓谷亏空不就抚藩开报之数完事务究原亏续缺及那移情弊
  phases:
  - key: brewing
    name: 初据开报三十三万余两入奏
    labels:
      zh: 初查开报
    start_date: 1786-04-15
    highlight_event_id: guji-曹文埴-event-2
  - key: breakthrough
    name: 奉旨抚藩离任后严查勿瞻徇
    labels:
      zh: 奉旨严查
    start_date: 1786-05-15
    highlight_event_id: guji-曹文埴-event-2
  - key: climax
    name: 查照嘉兴海盐平阳巨亏及杭嘉湖无谷可粜等款逐一盘查
    labels:
      zh: 逐款根究
    start_date: 1786-05-18
    highlight_event_id: guji-曹文埴-event-2
  - key: closure
    name: 晓谕各属据实呈照分别定议严办
    labels:
      zh: 定议严办
    start_date: 1786-06-01
    highlight_event_id: guji-曹文埴-event-2
  decisions:
  - date: 1786-05-15
    title_zh: 分投各府清查不就案完事
    rationale: 抚藩已离任属员无所回护正可和盘托出底里毕露
  - date: 1786-05-18
    title_zh: 先就嘉兴海盐平阳三县巨亏彻底盘查
    rationale: 三县每处逾十万合数已逾通省所报之数必先得确数方能破瞻徇颟顸
