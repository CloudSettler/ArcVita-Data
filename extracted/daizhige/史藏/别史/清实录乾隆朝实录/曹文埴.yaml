  dilemmas:
  - 海塘石工需费百余万与恤民节费之间如何权衡
  - 浙江亏空积玩已久与彻底清厘不徇情面之间如何抉择
  lesson: 塘工以保障民生为先经费以据实核销为要亏空必彻底根究方能儆玩吏
  summary_first_person: 我奉命查勘浙塘与清厘仓库以急缓分工以坦水省费并会同督抚逐仓盘查务得实在亏数
  source_urls:
