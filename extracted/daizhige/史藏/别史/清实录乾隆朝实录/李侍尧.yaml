  - 抚恤兵艰与节制帑项之难
  lesson: 核实军装以强武备，体恤兵艰以固根本，严防边外以杜渐。
  summary_first_person: 余以勋裔膺两广总督，值乾隆四十年夏，在任查验绿营军装，剔相沿旧坏之弊，请核实办理，广州霖雨水浸兵丁房倒五百余户，请借帑修葺，复筹安南边外民人械斗，议立互市稽察之防，期于武备民生边防三者并举。
