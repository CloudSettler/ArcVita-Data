  archetype: 封疆能臣
  dilemmas:
  - 剿抚之间当速歼首恶还是暂抚胁从以安旧教
  - 整饬冲途滥应当严参亏空还是体恤差繁以全大局
  lesson: 治边当抚良惩顽并用，查弊当防微杜渐，不可姑息养奸，亦不可张皇滋扰
  summary_first_person: 吾督陕甘，值乾隆四十九年固原小山田五复倡新教，聚众攻堡，吾亲驰会剿，围截化山鸡窝山，抚安旧教，务歼根株，又奉旨严查冲途州县滥应亏空，以清台站积弊
  source_urls:
