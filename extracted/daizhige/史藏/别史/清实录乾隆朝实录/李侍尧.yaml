endeavors:
- id: guji-李侍尧-endeavor-1
  title_zh: 审拟巡检王日新滥刑毙命案
  summary: 巡检王日新受贿拘讯甲长李殿瞻，滥刑加枷致死，李侍尧以故者拟抵而将巡检拟流，被旨斥为轻纵并令回奏
  phases:
  - key: brewing
