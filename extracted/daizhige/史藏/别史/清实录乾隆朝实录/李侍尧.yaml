  related_endeavor_id: guji-李侍尧-endeavor-2
- id: guji-李侍尧-event-1
  title_zh: 奏请甘肃冲途州县酌增养廉
  date: 1783-05
  year_of: 1783
  description: 李侍尧以甘省边要土瘠兼新疆孔道差使络绎，奏请最冲次冲州县分别加增养廉，换班官员出口往还通融亦请酌议。
  related_endeavor_id: guji-李侍尧-endeavor-1
- id: guji-李侍尧-event-2
  title_zh: 奉谕增廉依议并严防滥应
  date: 1783-05
  year_of: 1783
  description: 军机大臣会同户部酌减议准加增，高宗特谕毋视为泛常议覆，令时刻留心严加查察滥支滥应，违者严参尽法惩治。
  related_endeavor_id: guji-李侍尧-endeavor-1
- id: guji-李侍尧-event-3
  title_zh: 谕令区隔撒拉尔九工旧教与内地回民
  date: 1783-05
  year_of: 1783
  description: 以撒拉尔止十二工，逆党止三工新教，其余九工旧教隶循化厅，高宗谕李侍尧回任饬属留心体察，令内地回民勿与撒拉尔往来联络，自为婚配，不动声色以渐移风，并防黑帐房番人滋事。
  related_endeavor_id: guji-李侍尧-endeavor-2
