- id: guji-李侍尧-event-2
  title_zh: 奏报广州大雨兵房倒塌请帑修葺
  date: 1775-06-23
  year_of: 1775
  place_zh: 广州省城
  description: 六月二十三四连日大雨水深数尺兵房倒塌五百八十九户请以马价银内每户借给三两修葺得旨一半赏给一半坐扣
- id: guji-李侍尧-event-3
  title_zh: 筹办安南星厂民人械斗与边禁互市
