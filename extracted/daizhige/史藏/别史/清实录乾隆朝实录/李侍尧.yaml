  decisions:
  - date: 1777-10-04
    title_zh: 仿广东召商定额设省局验放
    rationale: 各营自差弁采挖不报核易致采多报少故归文员召商岁有定额汇价归款
  - date: 1777-10-05
    title_zh: 缅宁腾越逼近缅地永行封禁
    rationale: 边地硝磺逼近外境恐资敌故永封交文武严密稽查以固边防
- id: guji-李侍尧-endeavor-2
  title_zh: 秉公参劾整饬吏治军纪
  description: 不徇尚书之子嵇承豫不宥金川有功总兵刘国梁据实参奏以肃纲纪
