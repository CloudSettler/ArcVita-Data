endeavors:
- id: guji-李侍尧-endeavor-1
  title_zh: 督剿固原田五新教之变
  summary: 亲赴固原会同刚塔围剿小山新教匪众，安抚旧教，搜除根株
  phases:
  - key: brewing
    name: 小山倡教攻堡
    labels:
      zh:
      - 新教滋事
    start_date: 1784-05-08
    highlight_event_id: guji-李侍尧-event-tianwu
  - key: breakthrough
    name: 驰往会剿围截
    labels:
      zh:
      - 会剿围截
    start_date: 1784-05-10
    highlight_event_id: guji-李侍尧-event-tianwu
  - key: climax
    name: 分路堵截化山搜捕
    labels:
      zh:
      - 搜捕净尽
    start_date: 1784-05-11
    highlight_event_id: guji-李侍尧-event-huashan
  - key: closure
    name: 抚安旧教密防营伍
    labels:
      zh:
      - 善后防变
    start_date: 1784-05-12
    highlight_event_id: guji-李侍尧-event-huashan
  decisions:
  - date: 1784-05-10
    title_zh: 驰往固原会同刚塔相机进剿
    rationale: 明切晓谕慰安旧教，集中兵力四面围截，不使蔓延滋事
  - date: 1784-05-11
    title_zh: 奖赏首告旧教回民并授虚衔
    rationale: 以坚旧教向化之心，离间新教党与，使凶顽孤立
  - date: 1784-05-12
    title_zh: 暂置营伍回兵疑似从教者不问
    rationale: 免临阵张皇误事，俟事定半年后再密查，务净绝新教名目
- id: guji-李侍尧-endeavor-2
  title_zh: 清查冲途州县滥应亏空
  summary: 奉旨严查甘肃冲途州县滥支滥应亏那库项，整顿口外台站
  phases:
  - key: brewing
    name: 乌噜木齐冒销案发
    labels:
      zh:
      - 亏空败露
    start_date: 1784-05-02
    highlight_event_id: guji-李侍尧-event-chachu
  - key: climax
    name: 严查甘肃冲途滥应
    labels:
      zh:
      - 整饬亏空
    start_date: 1784-05-03
    highlight_event_id: guji-李侍尧-event-chachu
  - key: closure
    name: 整顿口外台站定例
    labels:
      zh:
      - 台站定例
    start_date: 1784-05-04
    highlight_event_id: guji-李侍尧-event-chachu
  decisions:
  - date: 1784-05-03
    title_zh: 严查冲途州县滥支滥应亏那
    rationale: 部给勘合车马皆有定数，额外多索大干禁例，当随时尽法惩治，免复酿大案
  - date: 1784-05-04
    title_zh: 禁止自效人员沿途索取车马
    rationale: 获咎自效之员若仍安然就道，是市情邀誉而亏公项，断不可开此例
events:
- id: guji-李侍尧-event-birth
  date: 1726-01-01
  year_of: 1726
  title_zh: 生于汉军镶黄旗李氏
  description: 雍正四年出生，字钦斋，后以荫生入仕，历封疆
- id: guji-李侍尧-event-chachu
  date: 1784-05-02
  year_of: 1784
  title_zh: 奉旨严查冲途州县滥应亏空
  description: 因乌噜木齐扬桑阿等冒销侵亏案发，奉旨严察甘肃冲途各州县滥支滥应及口外台站
- id: guji-李侍尧-event-tianwu
  date: 1784-05-10
  year_of: 1784
  title_zh: 驰往固原会剿田五新教
  description: 小山回民田五私立新教，戳伤百姓衙役，占据西安州营土堡，亲赴会同刚塔调兵进剿
- id: guji-李侍尧-event-huashan
  date: 1784-05-11
  year_of: 1784
  title_zh: 堵截化山鸡窝山搜捕余匪
  description: 贼匪窜匿化山并逸往鸡窝山沙沟一带，督兵堵截擒拏，抚安旧教，奖赏首告李应得等
- id: guji-李侍尧-event-death
  date: 1788-10-15
  year_of: 1788
  title_zh: 卒于乾隆五十三年秋
  description: 以陕甘总督屡任封疆，办理军需吏治，至乾隆五十三年九月卒于任
