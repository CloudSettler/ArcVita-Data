endeavors:
- id: guji-李侍尧-endeavor-1
  title_zh: 整饬绿营军装积弊
  summary: 针对保固册注旧坏名实不符相沿登注之弊请饬镇将亲验核实
  phases:
  - key: brewing
    name: 查验发现册实不符
    labels:
      zh: 查验
    start_date: 1775-06-01
    highlight_event_id: guji-李侍尧-event-1
  - key: breakthrough
    name: 驳册另查督饬镇将亲验
    labels:
      zh: 整饬
    start_date: 1775-06-05
    highlight_event_id: guji-李侍尧-event-1
  - key: climax
    name: 得旨钞寄各省一体仿照办理
    labels:
      zh: 推行
    start_date: 1775-06-06
    highlight_event_id: guji-李侍尧-event-1
  - key: closure
    name: 各省核实保题以实武备
    labels:
      zh: 落实
    start_date: 1775-07-01
    highlight_event_id: guji-李侍尧-event-1
  decisions:
  - date: 1775-06-01
    title_zh: 奏陈军装旧坏相沿登注之弊
    rationale: 若不亲验核实则侵渔暴殄之弊难除岁底保题徒具虚文
  - date: 1775-06-05
    title_zh: 驳回册籍饬镇将亲验禀覆
    rationale: 以近省标营现皆完好为例证旧坏系造册积习必实力整饬
- id: guji-李侍尧-endeavor-2
  title_zh: 赈恤广州水灾兵房并筹边防
  summary: 广州大雨水浸八旗住房倒塌借帑修葺并禁内地民人擅越安南生事
  phases:
  - key: brewing
    name: 省城霖雨兵房被浸
    labels:
      zh: 水灾
    start_date: 1775-06-23
    highlight_event_id: guji-李侍尧-event-2
  - key: breakthrough
    name: 查明倒塌借帑修葺
    labels:
      zh: 赈恤
    start_date: 1775-06-25
    highlight_event_id: guji-李侍尧-event-2
  - key: climax
    name: 安南星厂民人械斗议立边禁
    labels:
      zh: 筹边
    start_date: 1775-06-26
    highlight_event_id: guji-李侍尧-event-3
  - key: closure
    name: 定地互市稽察偷越处分章程
    labels:
      zh: 定制
    start_date: 1775-07-10
    highlight_event_id: guji-李侍尧-event-3
  decisions:
  - date: 1775-06-25
    title_zh: 请以马价银借给兵丁修房一半赏给一半坐扣
    rationale: 兵丁眷口无依无力者若非官办必致失所借帑分年扣还可兼顾国帑与兵艰
  - date: 1775-06-26
    title_zh: 议禁商民擅越安南酌定通市日期派官弹压
    rationale: 内地游手越境日多久必滋衅立法严防中外定地互市可顺夷情而杜奸宄
