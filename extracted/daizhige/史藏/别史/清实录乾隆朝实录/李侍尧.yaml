  decisions:
  - date: 1777-10-02
    title_zh: 参奏嵇承豫扣留脚价四百余两
    rationale: 运夫误运即扣价未发是否买补仅凭粮书一面之词须彻底严究不因系尚书之子瞻徇
  - date: 1777-10-02
    title_zh: 附参总兵刘国梁姑息营弁
    rationale: 总兵有督率之责守备萧抡第畏考诈称目盲该镇先姑息后回护理宜附参以儆绿营恶习
