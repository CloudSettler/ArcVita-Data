  date: 1726-01-01
  year_of: 1726
  title_zh: 李侍尧出生
  description: 雍正四年出生于汉军镶黄旗李氏之家，后以荫生入仕，历任封疆
- id: guji-李侍尧-event-death
  date: 1788-01-01
  year_of: 1788
  title_zh: 李侍尧去世
  description: 乾隆五十三年去世，生前历任两广总督、武英殿大学士等，谥恭毅
- id: guji-李侍尧-event-wangrixin
  date: 1770-08-03
  year_of: 1770
  title_zh: 王日新滥刑案定拟被驳
  description: 乾隆三十五年七月，刑部议驳李侍尧审拟巡检王日新受贿滥刑毙命拟流一本，上以贪酷不法与故勘无异而斥为轻纵，令明白回奏
- id: guji-李侍尧-event-wudingzhen
  date: 1770-08-09
  year_of: 1770
  title_zh: 吴定振受贿纵私案定拟被驳
  description: 乾隆三十五年七月戊辰，刑部议驳李侍尧审拟把总吴定振索银卖放拟流改遣一本，上以兵丁听其指使不得专坐擅杀，斥其轻纵并传旨申饬令回奏
