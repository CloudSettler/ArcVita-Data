endeavors:
- id: guji-李侍尧-endeavor-1
  title_zh: 奏请甘肃冲途州县分别酌增养廉
  summary_zh: 以甘省土瘠民贫兼新疆孔道差使络绎，冲途州县办公竭蹷，奏请分最冲次冲加银，并议换班官员通融，奉旨酌减依议而严防滥应。
  phases:
  - key: brewing
    name: 察知冲途竭蹷
    labels:
      zh:
      - 酝酿察访
    start_date: '1782'
    highlight_event_id: guji-李侍尧-event-1
  - key: breakthrough
    name: 具奏分别加增
    labels:
      zh:
      - 具奏酌增
    start_date: 1783-05
    highlight_event_id: guji-李侍尧-event-1
  - key: climax
    name: 军机户部酌减依议
    labels:
      zh:
      - 酌减定议
    start_date: 1783-05
    highlight_event_id: guji-李侍尧-event-2
  - key: closure
    name: 奉谕严察滥应
    labels:
      zh:
      - 防微杜渐
    start_date: 1783-05
    highlight_event_id: guji-李侍尧-event-2
  decisions:
  - date: 1783-05
    title_zh: 分最冲次冲议加养廉
    rationale: 最冲九州县拟加银六百两，次冲十一厅州县拟加银四百两，东乐县丞加银二百两，以纾办公而防藉差科派
  - date: 1783-05
    title_zh: 严饬道府稽查滥支滥应
    rationale: 既增养廉之后恐任情滥应肆意需索，须不时稽查严参治罪，免日久复致竭蹷派累
- id: guji-李侍尧-endeavor-2
  title_zh: 区隔撒拉尔旧教九工与内地回民防范滋事
  summary_zh: 以撒拉尔十二工中新旧有别，苏四十三乱后旧教九工畏惧守法，主张自为婚配不令内地回民杂入，并兼察黑帐房番人，以渐移易风俗。
  phases:
  - key: brewing
    name: 体察新旧种类之别
    labels:
      zh:
      - 体察种类
    start_date: '1783'
    highlight_event_id: guji-李侍尧-event-3
  - key: breakthrough
    name: 奏陈旧教安分情形
    labels:
      zh:
      - 陈奏安分
    start_date: 1783-05
    highlight_event_id: guji-李侍尧-event-3
  - key: climax
    name: 议定自为婚配不杂
    labels:
      zh:
      - 区隔婚配
    start_date: 1783-05
    highlight_event_id: guji-李侍尧-event-3
  - key: closure
    name: 不动声色以渐移风
    labels:
      zh:
      - 以渐移风
    start_date: 1783-05
    highlight_event_id: guji-李侍尧-event-3
  decisions:
  - date: 1783-05
    title_zh: 令九工旧教自为婚配
    rationale: 撒拉尔另居各为一种，内地回民不得杂入联络，防日久滋事
  - date: 1783-05
    title_zh: 兼察黑帐房番人分教之争
    rationale: 番回种类本殊各奉一教，素有恃强凌弱，须随时访察防闲使各安居守业
