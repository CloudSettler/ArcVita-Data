events:
- id: guji-李侍尧-event-birth
  date: 1726-01-01
  year_of: 1726
  title_zh: 出生
  description_zh: 雍正四年出生于汉军镶蓝旗李氏家，父李元亮，少以荫生入仕
- id: guji-李侍尧-event-1
  date: 1760-05-19
  year_of: 1760
  title_zh: 奏请虎门水师一体巡洋
  description_zh: 乾隆二十五年四月甲午，任两广总督，奏称碣石南澳二镇按班期出洋会哨，虎门左翼总兵惟驻海口，请一体定期巡洋，得旨照所请行
- id: guji-李侍尧-event-2
  date: 1760-05-20
  year_of: 1760
  title_zh: 奏陈贵县獞民案劾知县石崇先
  description_zh: 乾隆二十五年四月乙未，奏明贵县獞民韦志刚滋事系经面谕体勘方查出通详，石崇先姑息养奸，奉旨革职拿问归案审拟，并宣示惩劝
- id: guji-李侍尧-event-death
  date: 1788-11-16
  year_of: 1788
  title_zh: 病逝
  description_zh: 乾隆五十三年十月十九日病逝于京，谥恭毅，入祀贤良祠
