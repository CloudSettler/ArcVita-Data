  - 秉公参劾尚书之子与有功武将与顾全情面如何抉择
  lesson: 军中利器必归文员召商定额设局验放，纠劾不徇私情方能肃吏治而固边防
  summary_first_person: 吾李侍尧督云贵，见滇营火药听各营自煎不报不核恐致走私，故仿粤例奏请召商定额设省局给照领买，又将嵇承豫扣留脚价与刘国梁姑息营弁据实参奏，蒙上嘉许公正，此吾持身治军之道也
