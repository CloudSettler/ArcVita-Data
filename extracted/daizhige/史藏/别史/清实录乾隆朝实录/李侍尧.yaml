  archetype: 封疆执法者
  dilemmas:
  - 封疆定谳当从严惩贪酷还是曲徇情面轻纵
  - 受贿主使与听命行凶之罪如何区分首从以协情罪
  - 曾任刑部堂官而定拟舛谬当如何自处以对君命
  lesson: 办理庶狱当一秉至公，情罪允协，受贿滥刑不可轻纵，封疆定拟须深明律例，据实定谳，毋得颟顸错谬
  summary_first_person: 吾为李侍尧，久任封疆，曾掌刑部，乾隆三十五年审拟广东巡检王日新滥刑毙命及把总吴定振受贿纵私二案，皆以轻纵被刑部议驳，奉旨申饬，令明白回奏，方知定谳稍有偏徇即乖至公之道，终身以情罪允协为戒
