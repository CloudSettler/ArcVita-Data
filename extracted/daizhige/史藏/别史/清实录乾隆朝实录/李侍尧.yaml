    start_date: 1770-06-01
    highlight_event_id: guji-李侍尧-event-wangrixin
  - key: climax
    name: 刑部议驳奉旨申饬回奏
    labels:
      zh: 议驳申饬
    start_date: 1770-08-03
    highlight_event_id: guji-李侍尧-event-wangrixin
  - key: closure
    name: 自省律例错谬之咎
    labels:
      zh: 反省定谳
    start_date: 1770-08-10
    highlight_event_id: guji-李侍尧-event-wangrixin
  decisions:
  - date: 1770-06-01
    title_zh: 以窃贼张亚五拟抵而巡检仅拟流
    rationale: 误以知情受嘱拷讯致死为例，未究受贿滥刑故勘之实，遂致轻纵贪酷
  - date: 1770-08-03
    title_zh: 奉谕明白回奏定拟舛谬之由
    rationale: 既为封疆且曾任刑部，不应不谙律例，须据实陈明以承申饬
- id: guji-李侍尧-endeavor-2
  title_zh: 审拟把总吴定振受贿卖放案
  summary: 把总吴定振领兵巡哨殴毙水手又索银卖放私米，李侍尧将行凶兵丁拟绞而把总仅拟流改遣，再被驳为轻纵并申饬
  phases:
  - key: brewing
    name: 承审吴定振巡洋殴毙卖放案
    labels:
      zh: 承审查验
    start_date: 1770-02-01
    highlight_event_id: guji-李侍尧-event-wudingzhen
  - key: breakthrough
    name: 兵丁拟抵而把总计赃拟遣
    labels:
      zh: 区分首从
    start_date: 1770-07-01
    highlight_event_id: guji-李侍尧-event-wudingzhen
  - key: climax
    name: 刑部议驳奉旨申饬回奏
    labels:
      zh: 再被议驳
    start_date: 1770-08-09
    highlight_event_id: guji-李侍尧-event-wudingzhen
  - key: closure
    name: 覆检原案据实覆奏
    labels:
      zh: 据实覆奏
    start_date: 1770-09-01
    highlight_event_id: guji-李侍尧-event-wudingzhen
  decisions:
  - date: 1770-07-01
    title_zh: 莫裕扬拟绞而吴定振拟流改遣新疆
    rationale: 以吴定振无主使喝令且持械登船为查匪专责，其罪在得钱卖放，故从重于流上改遣，而擅殴致毙者正与擅杀例符
  - date: 1770-08-09
    title_zh: 奉申饬再核主使纵私之实
    rationale: 年力壮盛而屡拟舛谬，渐不如前认真，须覆检供证，再四酌核以明贪纵不法之情
events:
