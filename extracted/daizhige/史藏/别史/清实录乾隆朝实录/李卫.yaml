  decisions:
  - date: 1738-10-15
    title_zh: 严饬地方妥办天津赈济
    rationale: 有地之家易查，无业穷民易漏，必留心确查方不失所
  - date: 1738-10-20
    title_zh: 转饬所属严禁烧锅酒贩
    rationale: 歉岁储谷裕民，烧锅耗米，禁之可平谷价濟饥
- id: guji-李卫-endeavor-2
  title_zh: 直隶屯田清赋与纠劾河臣
  summary: 奏请比照民粮科则减免直属屯田重额，又参奏总河朱藻挟诈欺公贪残虐民，请革职治罪以整河务。
