    title_zh: 请按民粮科则酌减屯田钱粮
    rationale: 宣化永平蓟协屯赋重于民田，减之以苏民困而便耕
  - date: 1738-10-25
    title_zh: 列款参劾总河朱藻
    rationale: 河工关乎民生，见其欺公虐民，不劾则贻患地方
events:
- id: guji-李卫-event-birth
  title_zh: 生于江南铜山
  date: 1688
  year_of: 1688
  description: 康熙二十七年生于江苏丰沛间，家以捐纳入仕，勇敏任事
- id: guji-李卫-event-tuntian
  title_zh: 奏请减免直属屯田粮额
  date: 1738-10-16
  year_of: 1738
  description: 奏称宣化永平蓟协屯田编徵重于民田，请分别科则造册送部核议减免，得旨依议速行
- id: guji-李卫-event-zhenji
  title_zh: 奉命严查天津水灾赈济
  date: 1738-10-15
  year_of: 1738
  description: 天津居九河下游，雨水多田禾被淹，上谕以有司奉行不善，命李卫留心确查，使被水户口及无业贫民均沾恩泽
- id: guji-李卫-event-mishui
  title_zh: 覆奏米税开徵与停徵事
  date: 1738-10-18
  year_of: 1738
  description: 前因米价昂宽免临清天津诸处米税，后麦收复徵，今沿河被水米价复昂，仍暂停徵收以鼓舞商贩济畿辅民食
- id: guji-李卫-event-canzou
  title_zh: 参奏总河朱藻革职候审
  date: 1738-10-25
  year_of: 1738
  description: 参奏总河朱藻挟诈欺公贪残虐民各款，请革职治罪，得旨朱藻解任，命讷亲孙嘉淦往审，总河印务由顾琮管理
- id: guji-李卫-event-death
  title_zh: 卒于直隶总督任上
  date: 1738-10-25
  year_of: 1738
  description: 在直隶总督任上经理赈济清赋河务后病卒，乾隆加恩优恤，谥敏达
