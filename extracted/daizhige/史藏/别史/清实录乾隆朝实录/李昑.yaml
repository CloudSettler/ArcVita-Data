    title_zh: 并举三事奏请停罢
    rationale: 并引康熙土门江、雍正莽牛哨卡座、乾隆二年中江互市三事皆蒙准罢，以见情词恳切
  - date: 1746-07
    title_zh: 单指莽牛哨轻重相悬
    rationale: 言设屯垦土比土门中江等事轻重相悬，若驻兵西岸难免犬牙相错，故请降旨停罢
events:
- id: guji-李昑-event-birth
  title_zh: 诞生于汉阳
  date: 1694-10-31
  year_of: 1694
  place_zh: 朝鲜汉阳昌德宫
  description_zh: 肃宗二十年九月十三日诞生，为肃宗第四子，后入承大统，是为英祖
- id: guji-李昑-event-1
  title_zh: 奏请停止凤凰城展栅垦土
  date: 1746-07
  year_of: 1746
  place_zh: 汉阳经由北京兵部
  description_zh: 乾隆十一年七月，闻奉天将军议凤凰城展栅开垦，奏称栅外旷地百余里禁人居住以免混杂，请降旨停罢
- id: guji-李昑-event-2
  title_zh: 奏请停止莽牛哨添设屯兵
  date: 1746-07
  year_of: 1746
  place_zh: 汉阳经由北京兵部
  description_zh: 同月奏称熊岳副都统来中江查阅，欲于莽牛哨添设屯兵巡查，援雍正九年停设卡座旧准，恳请停罢以保隔截
- id: guji-李昑-event-3
  title_zh: 得旨停展栅并候勘莽牛哨
  date: 1746-08-07
  year_of: 1746
  place_zh: 北京紫禁城
  description_zh: 乾隆帝以加恩朝鲜优渥，准凤凰城展栅之处照请停止，莽牛哨一节命兵部尚书班第驰驿率什勒扪详加察勘，中国界内则设汛，犬牙相错则另候谕旨
- id: guji-李昑-event-death
  title_zh: 薨于庆熙宫
  date: 1776-04-22
  year_of: 1776
  place_zh: 朝鲜汉阳庆熙宫
  description_zh: 英祖五十二年三月初五日薨逝，在位五十余年，守藩事大之局以终
