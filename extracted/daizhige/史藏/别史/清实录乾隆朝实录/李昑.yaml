  dilemmas:
  - title_zh: 设汛肃边与混杂相通之忧
    description_zh: 天朝欲于莽牛哨添兵巡查以杜奸宄，于藩属则恐衣带之水不足以限，往来易通而滋扰
  - title_zh: 屡请停止与仰体柔远之难
    description_zh: 援康熙雍正旧例恳请停罢，既欲守栅外百里空地旧制，又虑屡渎天听有亏国体
  lesson: 守界当援旧制诚恳陈情，以内外隔截为据，方能动上听而存空地
  summary_first_person: 余即朝鲜国王李昑，承藩守社稷，以事大交邻为重，闻凤凰城欲展栅垦土、莽牛哨欲添兵设汛，恐栅外旷地人烟辏集、彼此混杂，遂援土门江雍正旧案具表恳请，幸蒙俯准停展栅一事，莽牛哨一事候勘定夺，守藩之心差可自慰
