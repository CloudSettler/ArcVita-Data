    title_zh: 援康熙五十三年土门江旧例上奏
    rationale: 以圣祖曾准彻毁江岸庐舍禁止种田为例，证栅外留空为旧制可行
  - date: 1746-07
    title_zh: 以内外隔截免混杂立论
    rationale: 言若垦土设屯则人烟辏集，衣带之水不足以限，故请仍留旷地百余里
