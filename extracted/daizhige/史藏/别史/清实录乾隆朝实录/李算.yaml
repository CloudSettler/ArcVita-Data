  - key: climax
    name: 颁诏册封
    labels:
      zh: 册封袭位
    start_date: 1776-08-28
    highlight_event_id: guji-李算-event-enthronement
  - key: closure
    name: 妃同受命
    labels:
      zh: 安位守藩
    start_date: 1776-08-28
    highlight_event_id: guji-李算-event-enthronement
  decisions:
  - date: 1776-03-01
    title_zh: 由王妃金氏代奏请立
    rationale: 以宗统继序为重，借国人愿戴之舆情，恳请大皇帝俯顺册立，以正名分
  - date: 1776-08-28
    title_zh: 祗受诰命彩币谨守藩职
    rationale: 蒙恩封王及妃同受诰命，唯有永矢靖共作屏翰以答天恩，方能安内外之心
- id: guji-李算-endeavor-2
  title_zh: 为生父故世子李緈请追爵谥
  summary_zh: 以继统之故为早逝之父故世子李緈陈请追赐封爵谥号及母诰命，礼部以与例不符议驳，终蒙乾隆念其继序之情加恩照准
  phases:
  - key: brewing
    name: 父早逝未袭
    labels:
      zh: 未袭早逝
    start_date: 1762-07-12
    highlight_event_id: guji-李算-event-birth
  - key: breakthrough
    name: 援继序列请
    labels:
      zh: 陈情请显
    start_date: 1776-07-01
    highlight_event_id: guji-李算-event-father-honor
  - key: climax
    name: 特恩追赐
    labels:
      zh: 追爵赐谥
    start_date: 1776-08-28
    highlight_event_id: guji-李算-event-father-honor
  - key: closure
    name: 显亲全孝
    labels:
      zh: 显亲承统
    start_date: 1776-08-28
    highlight_event_id: guji-李算-event-enthronement
  decisions:
  - date: 1776-07-01
    title_zh: 并请追赐故世子爵谥诰命
    rationale: 虽与常例不符，然以宗统继序为请，情词恳切，揆之礼制可行，故并陈以全孝道
  - date: 1776-08-28
    title_zh: 祗领追封恪愍之命以安宗祏
    rationale: 得恩追赐爵谥，既显亲又不紊继统之序，可慰国人而示优恤藩封之意
events:
- id: guji-李算-event-birth
  title_zh: 出生于汉城昌庆宫
  date: 1752-10-28
  year_of: 1752
  description: 乾隆十七年九月二十二日出生，为故世子李緈之子，后为世孙，聪睿仁孝为国人所愿戴
- id: guji-李算-event-succession
  title_zh: 王妃金氏奏请以世孙袭封
  date: 1776-03-01
  year_of: 1776
  description: 祖王李昑薨逝，王妃金氏奏称世孙李算自幼聪明性敦仁孝夙有长人之德，请册承袭，礼部初以与例不符议驳
- id: guji-李算-event-father-honor
  title_zh: 请追赐故世子李緈爵谥得旨加恩
  date: 1776-07-01
  year_of: 1776
  description: 朝鲜王妃并为故世子李緈请追赐爵谥及世子妇赵氏诰命，乾隆念其以宗统继序为请情词恳切，特加恩照所请给与爵谥诰命，追封谥恪愍
- id: guji-李算-event-enthronement
  title_zh: 遣官赐祭故王并颁诏册封为朝鲜国王
  date: 1776-08-28
  year_of: 1776
  description: 乾隆四十一年七月甲申遣散秩大臣觉罗万福等赐祭故朝鲜国王李昑谥庄顺，颁敕谕封世孙李算为朝鲜国王继理国政，并封妻金氏为国王妃赐诰命彩币
- id: guji-李算-event-death
  title_zh: 薨逝于昌德宫
  date: 1800-06-28
  year_of: 1800
  description: 嘉庆五年五月二十八日薨逝，在位二十四年，守藩靖共，致力内治文教，终谥正宗
