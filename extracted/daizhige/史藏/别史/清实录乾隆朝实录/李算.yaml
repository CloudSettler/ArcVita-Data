endeavors:
- id: guji-李算-endeavor-1
  title_zh: 以世孙承统请袭朝鲜国王
  summary_zh: 祖王李昑薨逝，由王妃金氏具奏称其聪睿仁孝为国人愿戴，请以世孙袭封，经礼部初议不合而得乾隆特允，遣官颁诏袭位
  phases:
  - key: brewing
    name: 世孙养望
