events:
- id: guji-李质颖-event-birth
  date: 1725-01-01
  year_of: 1725
  title_zh: 出生
  description: 约生于雍正年间后登乾隆十七年进士入仕
- id: guji-李质颖-event-guangdong-miji
  date: 1780-03-01
  year_of: 1780
  title_zh: 春间密传广州府商办沙湾盗
  description: 在粤署督抚任内见报获多系沙湾茭塘之犯密传知府李天培面询访得梁亚香莫绍开纠众行劫设法擒拿旋调赴浙未及奏办
- id: guji-李质颖-event-changhua-escape
  date: 1780-08-15
  year_of: 1780
  title_zh: 奏昌化监犯脱逃疏防处分
  description: 昌化军犯王仲流犯汪德朋扳断木栅踰墙逸获后奏请革典史交部议知县饬提从重定拟
- id: guji-李质颖-event-huizou-shawan
  date: 1780-09-12
  year_of: 1780
  title_zh: 奉钞摺回奏沙湾盗起事年月
  description: 遵旨将凌大头蓉等潜住纠劫起自乾隆三十七年及四十二年分系李侍尧德保杨景素及已任内事据实陈奏奉旨且俟之
- id: guji-李质颖-event-zhuji-flood
  date: 1780-09-18
  year_of: 1780
  title_zh: 奏诸暨山水骤发请赈
  description: 诸暨山水骤发淹损民田庐舍先给口粮葺屋银萧山嵊县等六县被水较轻一并查明酌办
- id: guji-李质颖-event-haitang
  date: 1780-09-20
  year_of: 1780
  title_zh: 奏仁和海宁海塘稳固接建
  description: 大汛已过工程稳固调字号矬蛰备料霜降赶砌暑字号加镶面柴藏字号续下竹篓签钉关桩八月内完竣
- id: guji-李质颖-event-death
  date: 1784-01-01
  year_of: 1784
  title_zh: 卒
  description: 抚浙办赈治塘后数年卒于官乾隆四十九年前后
