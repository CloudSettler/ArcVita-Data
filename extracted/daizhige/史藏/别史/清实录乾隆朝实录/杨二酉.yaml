  lesson: 治河蓄洩当守经久旧制不可因一时涸出膏壤而废水柜济运保堤大计
  summary_first_person: 吾抚山东值运河大挑工竣见南旺湖麦仁庄长沟诸水放入运河水势充盛涸出膏壤二百余顷遂奏请载入河规永为成法上疑吾归美史奕昂命顾琮覆核方知水柜蓄洩自有旧章非可轻改吾深悟治漕当因水制宜守久远无弊之义
