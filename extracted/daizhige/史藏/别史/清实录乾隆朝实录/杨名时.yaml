  birth_date: 1661-01-01
  death_date: 1736-10-10
  era: 清康熙至乾隆
  reign_ref: 乾隆元年
  archetype: 理学直臣
  dilemmas:
  - 以程朱气节立身与官场圆融保位之两难
  - 以直谏纠绳为职与君恩保全为念之两难
  - 以晚年复起报国与衰病溘逝不及为用之遗憾
  lesson: 守正学以立身，虽一时罢斥而终得圣世表章，直道未尝负人
  summary_first_person: 吾少治程朱之学，中进士后提学江南，务先德行而后文艺，继而历抚畿辅云贵，直言无隐，虽获罪罢归而此心无愧，今蒙新君召为礼部，方期致用而病不能支，惟愿后人守醇正之学，端方之行而已
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70026.html
endeavors:
- id: guji-杨名时-endeavor-1
  title_zh: 提学江南倡明理学
  summary_zh: 以检讨提督江南学政，黜浮华崇德行，讲学江阴，士风为之一变
  phases:
  - key: brewing
    name: 庶常馆砥砺气节
    labels:
      zh: 读书养正
    start_date: 1700-06-01
    highlight_event_id: guji-杨名时-event-jinshi
  - key: breakthrough
    name: 督学江南
    labels:
      zh: 兴学育才
    start_date: 1716-01-01
    highlight_event_id: guji-杨名时-event-jiangnan
  - key: climax
    name: 疏陈学政得失
    labels:
      zh: 直陈教化
    start_date: 1720-01-01
    highlight_event_id: guji-杨名时-event-jiangnan
  - key: closure
    name: 以学行闻于朝野
    labels:
      zh: 士林归仰
    start_date: 1722-01-01
    highlight_event_id: guji-杨名时-event-zongdu
  decisions:
  - date: 1716-03-01
    title_zh: 赴江南提学不徇请托
    rationale: 欲以程朱之教正士习，故严条约黜奔竞，虽得罪权要而不顾
  - date: 1720-08-01
    title_zh: 上疏论科场浮华
    rationale: 见士子驰鹜词章而忽德行，故请先行谊后文艺，以挽颓风
- id: guji-杨名时-endeavor-2
  title_zh: 历任封疆晚蒙礼遇
  summary_zh: 雍正朝历任巡抚总督，以清正敢言罢斥，乾隆初召为礼部尚书，未至而卒，赠恤入祠
  phases:
  - key: brewing
    name: 入抚畿辅
    labels:
      zh: 抚民察吏
    start_date: 1724-01-01
    highlight_event_id: guji-杨名时-event-zongdu
  - key: breakthrough
    name: 总督云贵
    labels:
      zh: 边疆绥抚
    start_date: 1725-06-01
    highlight_event_id: guji-杨名时-event-zongdu
  - key: climax
    name: 直谏获罪罢归
    labels:
      zh: 守正见黜
    start_date: 1726-01-01
    highlight_event_id: guji-杨名时-event-bazhe
  - key: closure
    name: 乾隆召用礼部
    labels:
      zh: 晚节褒荣
    start_date: 1736-08-01
    highlight_event_id: guji-杨名时-event-zhaoyong
  decisions:
  - date: 1725-10-01
    title_zh: 在云贵坚持减耗羡严贪墨
    rationale: 念边民困苦，故不阿上官而以恤民为急，虽孤立亦不改
  - date: 1736-08-15
    title_zh: 病中奉召北上遗疏谢恩
    rationale: 仰体皇考遗意及新君眷注，扶病就道，以死报国，临终上遗疏
