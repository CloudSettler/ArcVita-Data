  dilemmas:
  - 直陈丧师失地则立获重谴还是粉饰捷报以徼幸居功
  - 亲赴沿边督办已失事机还是坐镇永昌遥制诸将
  - 严参畏葸总兵以明军法还是姑息回护以掩己调度之失
  lesson: 封疆握兵当以诚实任事为本，调度失宜又饰词欺罔，终致丧师辱国而自罹重罪
  summary_first_person: 我受恩督云贵，初以剿除莽匪为易，遂轻视缅夷，调赵宏榜往新街受降，及新街小挫又调度乖方，致贼窜盏达户腊撒陇川木邦诸处，我复以乞降杀贼万余饰奏，终为圣上烛破，革去大学士交部严议，负恩贻误，悔无及矣
