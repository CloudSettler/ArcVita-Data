  - key: breakthrough
    name: 整欠孟艮请定赋
    labels:
      zh: 纳土输粮
    start_date: '1766-08-02'
    highlight_event_id: guji-杨应琚-event-menggen
  - key: climax
    name: 谕令斟酌进止
    labels:
      zh: 慎重边徼
    start_date: '1766-08-03'
    highlight_event_id: guji-杨应琚-event-mubang
  - key: closure
    name: 缓征加恩与投顺安置
    labels:
      zh: 优恤边黎
    start_date: '1766-08-04'
    highlight_event_id: guji-杨应琚-event-menggen
  decisions:
  - date: '1766-08-01'
    title_zh: 为木邦土司请俟天兵擒献缅匪监视之人
    rationale: 其地辽远须相机调发，若不至大需兵力则乘时集事，否则不可张皇劳师
  - date: '1766-08-02'
    title_zh: 请整欠孟艮仿普洱十三土司例定赋并缓至戊子年起征
    rationale: 连年经莽匪扰害元气未复，遽责输将恐夷民生计拮据，加恩缓征以示优恤
events:
- id: guji-杨应琚-event-birth
  date: '1702'
  year_of: 1702
  precision: year
  title_zh: 杨应琚生
  description_zh: 汉军正白旗人，生年不详，约生于康熙末年，早年入仕历任封疆
- id: guji-杨应琚-event-pingliao
  date: '1766-08-01'
  year_of: 1766
  precision: day
  title_zh: 奏报滇省粮价昂贵并筹平粜
  description_zh: 乾隆三十一年七月奏云南府白米红米每石至四两一二钱，请通盘筹画裕源节流，复议安宁等十州县改征本色运省平粜并禁稻米烧锅，秋成约八九分米价各减五钱有差
- id: guji-杨应琚-event-mubang
  date: '1766-08-02'
  year_of: 1766
  precision: day
  title_zh: 奏木邦土司愿附并请索召散
  description_zh: 乾隆三十一年七月奏木邦土司遭缅酋残刻情愿归附，请俟天兵擒献监视缅匪，并行文索取逃往缅甸之召散，得旨须详审熟筹以定进止
- id: guji-杨应琚-event-menggen
  date: '1766-08-03'
  year_of: 1766
  precision: day
  title_zh: 请新定整欠孟艮酌定赋额缓征
  description_zh: 乾隆三十一年七月奏整欠孟艮附入版图愿输粮赋，请仿普洱边外例酌中定赋，得旨加恩缓至戊子年入额征收，并奏补哈猛撒头目投顺解献莽匪
- id: guji-杨应琚-event-death
  date: '1766'
  year_of: 1766
  precision: year
  title_zh: 杨应琚卒
  description_zh: 大学士管云贵总督任内因滇缅军务贻误获罪，乾隆三十一年赐死
