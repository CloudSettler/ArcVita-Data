  decisions:
  - date: '1766-08-01'
    title_zh: 据实奏报滇省粮价与雨水
    rationale: 僻处边陲难资邻省接济，必先陈明贵至三四两实情以冀熟筹
  - date: '1766-10-01'
    title_zh: 议定近省十州县改征本色赴省平粜并禁烧锅
    rationale: 以额粮多寡酌改本折运仓平粜，禁以稻米烧锅，裕源节流以永资利赖
- id: guji-杨应琚-endeavor-2
  title_zh: 滇缅边外土司内附与进止权衡
  summary_zh: 招抚木邦整欠孟艮猛撒等处，解献莽匪请定赋入额，于缅酋用兵审慎权衡进止
  phases:
