    rationale: 误信蛮暮投诚机有可乘，欲速定以居功，致轻进失据
  - date: 1766-11
    title_zh: 调刘德成至盏达而令朱仑自西尾追
    rationale: 东西更调舍近就远，漫无定见，欲分路堵截却致避贼 عرض
  - date: 1767-01
    title_zh: 以缅酋乞降求赏新附之地入奏
    rationale: 欲将就了事掩饰丧师失地，冀朝廷允罢兵以卸责
