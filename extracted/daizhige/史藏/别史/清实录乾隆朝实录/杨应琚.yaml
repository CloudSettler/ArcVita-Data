  era: 清代
  reign_ref: 乾隆
  archetype: 受降开边而善后失据的封疆大臣
  dilemmas:
  - 受降之后如何抚驭绥靖以永隶版图还是给还故地以图息事
  - 瘴险兵疲之际是奋勇长驱以扬国威还是暂听乞降以求完局
  lesson: 受降必豫筹抚驭善后之策，若粉饰虚词将就了局，则视国事如儿戏，终致偾事误国
  summary_first_person: 余以大学士管云贵总督，值缅匪骚动，木邦蛮暮相率投诚，奏请发兵保护，亲往受降，自谓实心体国，及蛮暮新街交锋小挫，兵退楞木，又据绿营禀报，以缅目遣散乞降赏给贸易入告，遂奉严旨斥为大不是，命审机妥办，方悟可行则行可止则止之要领未得，进退皆误，空言尝试，愧负天恩耳
  source_urls:
  - https://github.com/daizhige-org/daizhigev20
