    title_zh: 不凭通判一禀即委员确勘抢筑
    rationale: 运河涨发最盛宣泄之路较少必确查漫口分段专派大员上紧堵筑速令完固
  - date: 1771-07-15
    title_zh: 加意催趱漕船弥补迟延一月
    rationale: 今岁全帮过济宁较往年迟约一月若回空太晚有碍明岁漕务必严催北上
