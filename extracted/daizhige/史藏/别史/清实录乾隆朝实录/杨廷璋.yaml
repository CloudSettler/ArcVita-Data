    title_zh: 不待道厅禀报即亲往确勘
    rationale: 正当伏秋大汛水势消长须时刻相通待报则缓不及事必亲勘方能上紧护防
  - date: 1771-07-08
    title_zh: 留驻河工不赴迎驾
    rationale: 河防最关紧要堤固方为根本秋巡道路已有专员经理俟工竣再赴行在不迟
- id: guji-杨廷璋-endeavor-2
  title_zh: 北运河南运河宣泄与漕运催趱
  summary_zh: 北运河王甫庄甘露寺漫溢张湾积水南运河侯家园漫溢分别抢护筹议筐儿港王家务减水展放并加意催趱漕船北上以济明岁漕务
