- id: guji-杨廷璋-event-yongding-1771
  date: 1771-07-06
  year_of: 1771
  kind: career
  title_zh: 奏报卢沟桥漫口并赴勘
  description_zh: 据永定河道满保禀七月初二卢沟桥水发南岸漫口七十余丈北岸漫口百余丈外兼断堤十五处即飞往确勘查堤外田庐受伤成灾与否
  place_zh: 卢沟桥永定河工
- id: guji-杨廷璋-event-duzhu-1771
  date: 1771-07-08
  year_of: 1771
  kind: career
