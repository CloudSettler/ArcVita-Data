  description_zh: 侍郎德成驰驿至工会同督趱工料人夫克期修筑完固漫口渐次消涸中溜仅存二三十丈水趋淀河
  place_zh: 永定河漫口工次
- id: guji-杨廷璋-event-beiyun-1771
  date: 1771-07-10
  year_of: 1771
  kind: career
  title_zh: 北运河南运河漫溢抢护
  description_zh: 北运河王甫庄甘露寺刷开堤工数十丈马头张湾积水南运河侯家园姜家井漫溢分段抢护稳固并议秋冬会同裘曰修相度展放筐儿港王家务减水
  place_zh: 北运河南运河沿岸
- id: guji-杨廷璋-event-caoyun-1771
  date: 1771-07-15
  year_of: 1771
  kind: career
  title_zh: 催趱漕船北上
  description_zh: 今岁漕船过济宁较往年迟约一月奉旨会同周元理加意催趱使全帮过临清严催北上以免回空太晚有碍明岁漕务
  place_zh: 运河临清至通州一线
- id: guji-杨廷璋-event-bijiao-1771
  date: 1771-07-22
  year_of: 1771
  kind: career
  title_zh: 比较上年水势收成奏闻
  description_zh: 将本年水势与上年比较南运河赖减河畅泄可保无虞北运河漫口减少永定漫口俱已断流被水十七州县收成虽略减而子粒饱满实胜去年
  place_zh: 直隶各州县
