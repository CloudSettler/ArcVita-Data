  decisions:
  - date: 1793-11-06
    title_zh: 严词拒绝留京学艺之请
    rationale: 贡使欲照俄罗斯例留人在京学艺，实属妄行干渎不知足，必须严词驳饬以存国体
  - date: 1793-11-10
    title_zh: 驳宁波以洋货兑换茶叶丝觔
    rationale: 宁波向无洋行无从交易，且不能为其特调粤洋行远赴浙省，应令赴粤门黄埔交易
  - date: 1793-11-13
    title_zh: 俯准分道由广东行走
    rationale: 贡使称定海止存一舟人多拥挤易生疾病，语出至诚难于拒绝，姑从所请以示体恤，仅费沿途供支
- id: guji-松筠-endeavor-2
  title_zh: 嘉庆初年经略伊犁屯政边防
  summary: 抚戍西陲，整肃营伍，兴修屯垦水利，安置移民，以固边圉而裕军食
  phases:
  - key: brewing
