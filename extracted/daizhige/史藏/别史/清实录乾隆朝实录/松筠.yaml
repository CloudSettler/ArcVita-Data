  description_zh: 乙卯松筠奏贡使祗领恩赏奶饼感激欢忭奉旨令其传谕仍赴浙乘坐原船倘藉称船少迁延即严辞斥驳并密谕澳门夷商勿为所惑
- id: guji-松筠-event-3
  person_id: guji-松筠
  type: career
  date: 1793-10-18
  year_of: 1793
  title_zh: 奏准贡使改道广东定海分载开船
  description_zh: 己未松筠奏贡使称行李人多拥挤易病恳仍由广东行走奉旨格外施恩准携随身行李走广东沉重物件分拨从人由定海上船松筠到浙会同吉庆照料开船后回京长麟带同贡使由水路赴粤附搭便船回国
