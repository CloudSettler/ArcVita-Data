  - date: 1803-03-01
    title_zh: 奏请开浚惠远一带渠工以广屯种
    rationale: 伊犁地广水丰而不治则荒，兴水利可增谷石以省内地转输之费
  - date: 1807-06-01
    title_zh: 严定卡伦巡查以禁私越贸易
    rationale: 边外部落往来无度则易生事端，稽察有制方能兵民相安
