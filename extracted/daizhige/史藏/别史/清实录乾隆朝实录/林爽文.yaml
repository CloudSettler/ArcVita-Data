      - 保巢
  - key: breakthrough
    name: 柴坑仔马鸣山堵御官兵
    start_date: '1787-03-05'
    highlight_event_id: guji-林爽文-event-daliyi
    labels:
      zh:
      - 阻击
      - 游斗
  - key: climax
    name: 内山分寨相持官兵观望
    start_date: '1787-06-01'
    highlight_event_id: guji-林爽文-event-daliyi
