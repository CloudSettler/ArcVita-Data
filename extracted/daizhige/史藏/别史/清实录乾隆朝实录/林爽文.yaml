  birth_date: '1756'
  death_date: 1788-04
  era: 清代
  reign_ref: 乾隆
  archetype: 民变领袖
  dilemmas:
  - 官吏苛索与天地会牵连之下起兵自保还是束手就缚
  - 攻陷县城之后称王建号以聚众还是仅以复仇为名以避僭逆重罪
  - 大军压境之时分散据守以保乡土还是合兵一处以决死战
  lesson: 仓猝纠众虽能乘虚一时，然无饷无械又分路自守，终难当大军四路会剿，胁从愈多则败亡愈速
  summary_first_person: 吾本漳州农户，流寓台湾大里杙以垦田为生，官府逼索，会党牵连，不得已攻彰化据诸罗，与官兵周旋 year 余，终因兵分势散被擒解京，累及万余乡亲，身死而族灭，悔以僭号自误也
  source_urls:
