      - 相持
  - key: closure
    name: 巢破被擒解京伏法
    start_date: '1788-02-10'
    highlight_event_id: guji-林爽文-event-captured
    labels:
      zh:
      - 覆灭
      - 就擒
  decisions:
  - date: '1787-02-22'
    title_zh: 领众绕回内山保大里杙
    rationale: 恐根本失去则众心散，故舍彰化外围而以内山险阻自固，以待官兵疲敝
  - date: '1787-06-01'
    title_zh: 分散庄寨各自为战
    rationale: 以乡土人多分守要口，欲使官兵零星打仗不得深入，然合则强分则弱反授官兵各个击破之机
events:
- id: guji-林爽文-event-birth
  title_zh: 生于福建漳州平和
  date: '1756'
  year_of: 1756
  place_zh: 福建漳州府平和
  description: 乾隆二十一年生于闽南农家，后随众渡台，垦田于彰化大里杙一带
- id: guji-林爽文-event-zhanghua
  title_zh: 纠众攻陷彰化起事
  date: '1787-01-27'
  year_of: 1787
  place_zh: 台湾彰化县城
  description: 率众攻彰化，戕官据城，旋陷诸罗竹堑，自称盟主，分授廖东侯辰等伪将军军师名号
- id: guji-林爽文-event-daliyi
  title_zh: 回守大里杙柴坑仔抵御官兵
  date: '1787-03-05'
  year_of: 1787
  place_zh: 台湾大里杙柴坑仔马鸣山埔心庄
  description: 闻鹿港有援兵至，领众绕回内山保大里杙，与任承恩黄仕简所部在柴坑仔马鸣山一带枪炮对战，杀伤互见
- id: guji-林爽文-event-captured
  title_zh: 老五庄被擒台湾平定
  date: '1788-02-10'
  year_of: 1788
  place_zh: 台湾老五庄
  description: 大里杙巢破后窜匿内山，被官兵搜获生擒，连同党目解京，其众或阵亡或乞降发遣
- id: guji-林爽文-event-death
  title_zh: 解京审明凌迟正法
  date: 1788-04
  year_of: 1788
  place_zh: 京师
  description: 与庄大田等一同解京，审明纠众戕官僭立名号之罪，寸磔示众，台湾林爽文案以此告结
