  - date: '1787-01-27'
    title_zh: 攻彰化杀知县起事
    rationale: 以官府缉拏会党为由先发制人，藉杀官夺城以号召胁从，速成声势
  - date: '1787-02-15'
    title_zh: 颁给将军军师等伪职分守各庄
    rationale: 以伪爵笼络头目，使各据一方以牵制官兵，然亦坐实僭逆之罪
- id: guji-林爽文-endeavor-2
  title_zh: 退守内山与大里杙固守
  summary_zh: 闻鹿港官兵将至，绕回内山保大里杙巢穴，分路抵御黄仕简任承恩南北两路，终因兵散被围而败
  phases:
  - key: brewing
    name: 闻警回救大里杙
