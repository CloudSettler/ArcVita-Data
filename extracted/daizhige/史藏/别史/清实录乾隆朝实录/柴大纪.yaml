endeavors:
- id: guji-柴大纪-endeavor-1
  title_zh: 保卫郡城复死守诸罗连破林爽文
  summary_zh: 前保台湾郡城继驻诸罗当大里杙贼巢之南两月屡御贼首林爽文分路侵扰斩获甚多
  phases:
  - key: brewing
    name: 受命保卫郡城
    labels:
