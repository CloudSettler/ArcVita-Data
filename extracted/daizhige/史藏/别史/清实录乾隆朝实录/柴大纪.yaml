      - 守郡
      - 筹防
    start_date: 1787-01-01
    highlight_event_id: guji-柴大纪-event-shou-zhuluo
  - key: breakthrough
    name: 移守诸罗初御贼锋
    labels:
      zh:
      - 驻诸罗
      - 迎捕堵杀
    start_date: 1787-03-15
    highlight_event_id: guji-柴大纪-event-shou-zhuluo
  - key: climax
    name: 万贼围攻连日血战大捷
    labels:
      zh:
      - 以寡敌众
      - 义民番壮协力
    start_date: 1787-05-27
    highlight_event_id: guji-柴大纪-event-shou-zhuluo
  - key: closure
    name: 蒙嘉奖议叙赏赉
    labels:
      zh:
      - 奋勉出力
      - 破格拔擢义民
    start_date: 1787-06-15
    highlight_event_id: guji-柴大纪-event-jiajiang
  decisions:
  - date: 1787-03-15
    title_zh: 驻守诸罗不轻进捣巢
    rationale: 诸罗为南北要冲若轻离则前后受敌故固守以牵缀贼势待大兵会剿
  - date: 1787-05-27
    title_zh: 督官兵义民出城迎捕
    rationale: 贼众虽多皆乌合胁从惟奋勇截杀争先方能挫其锋而保城池
- id: guji-柴大纪-endeavor-2
  title_zh: 整肃军律赏罚严明以振士气
  summary_zh: 识破内应奸匪张慎徽等尽行正法并将临阵退缩及强取民物兵丁立正典刑与郝壮猷怯懦形成对照载入营伍训谕
  phases:
  - key: brewing
    name: 绿营积习怯退扰民
    labels:
      zh:
      - 军纪废弛
      - 临阵畏葸
    start_date: 1787-04-01
    highlight_event_id: guji-柴大纪-event-su-junji
  - key: breakthrough
    name: 识破假充义民内应
    labels:
      zh:
      - 擒献吴聪为凭信
      - 密饬擒获审实
    start_date: 1787-06-01
    highlight_event_id: guji-柴大纪-event-su-junji
  - key: climax
    name: 正法退缩及扰民弁兵
    labels:
      zh:
      - 王命正法刘钦等
      - 衣物给还原主
    start_date: 1787-05-27
    highlight_event_id: guji-柴大纪-event-su-junji
  - key: closure
    name: 用法严明载入训谕
    labels:
      zh:
      - 信赏必罚
      - 通谕各营伍
    start_date: 1787-06-16
    highlight_event_id: guji-柴大纪-event-jiajiang
  decisions:
  - date: 1787-05-27
    title_zh: 恭请王命正法退缩弁兵
    rationale: 行军纪律贵在严明不诛退缩无以昭军令而令人人用命
  - date: 1787-06-01
    title_zh: 密擒奸细张慎徽等三十九名即行正法
    rationale: 形迹可疑假效军前必为内应若不先发必里应外合为害故立断诛之
events:
- id: guji-柴大纪-event-birth
  title_zh: 出生浙江江山
  date: 1730
  year_of: 1730
  place_zh: 浙江江山
  description_zh: 生年不详约乾隆初年出身行伍累迁台湾总兵
- id: guji-柴大纪-event-shou-zhuluo
  title_zh: 驻守诸罗屡破林爽文万余贼众
  date: 1787-06-15
  year_of: 1787
  place_zh: 台湾诸罗县城
  description_zh: 二月十二至四月十二间贼首林爽文纠夥万余分路侵扰督游击杨起麟守备邱能成及义民番壮出城迎捕枪炮歼贼数千生擒正法五十余名割献首级夺获器械
- id: guji-柴大纪-event-su-junji
  title_zh: 正法内应奸匪及退缩扰民弁兵
  date: 1787-05-27
  year_of: 1787
  place_zh: 诸罗军前
  description_zh: 擒获假充义民内应张慎徽等三十九名审实正法又将临阵惧怯不放枪炮逃回之外委刘钦兵丁程忠吴森恭请王命正法示众并将强取民衣之陈恩成审明正法衣物给主
- id: guji-柴大纪-event-jiajiang
  title_zh: 蒙嘉奖交部议叙赏荷包
  date: 1787-06-16
  year_of: 1787
  place_zh: 台湾诸罗
  description_zh: 以保卫郡城及驻守诸罗始终奋勉深荷嘉奖交部议叙赏大荷包一对小荷包二对并令查明出力将备分散赏给阵亡受伤弁兵义民番民加倍恤赏武举陈宗器等拔补千总署县陈良翼实授
- id: guji-柴大纪-event-death
  title_zh: 台湾事竣后以罪伏诛
  date: 1788
  year_of: 1788
  place_zh: 京师
  description_zh: 林爽文平定后以驻守诸罗冒功及贪纵等罪乾隆五十三年赐死于狱一说正法于京师
