  - key: climax
    name: 督湖广兼兴文教
    labels:
      zh: 刊书育才
    start_date: 1788-04-01
    highlight_event_id: guji-毕沅-event-transfer-huguang
  - key: closure
    name: 江汉安澜士民归心
    labels:
      zh: 政成民和
