    start_date: 1793-12-13
    highlight_event_id: guji-毕沅-event-kaiken-jianshi
  - key: closure
    name: 定则安辑成例
    labels:
      zh: 永为定例
    start_date: 1794-01-01
    highlight_event_id: guji-毕沅-event-kaiken-jianshi
  decisions:
  - date: 1791-06-01
    title_zh: 宽限招垦不急升科
    rationale: 流民初集元气未复，若急征则复逃，宽其年限方能久住成业
  - date: 1793-12-13
    title_zh: 据实奏报五十六年分成熟地
    rationale: 开垦多少必丈量核实具奏，不虚增不隐漏，方杜吏胥侵蚀之弊
- id: guji-毕沅-endeavor-2
  title_zh: 历抚晋豫秦楚兴学治水
  summary: 先后抚河南陕西，督湖广，赈灾蠲缓，浚堤治水，兴书院，刊经籍，以文治佐武功
  phases:
