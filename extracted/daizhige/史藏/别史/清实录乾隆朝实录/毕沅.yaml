    title_zh: 请缓征被灾州县钱粮
    rationale: 连岁歉收小民输将维艰，缓带以苏民力，严查吏蚀以清积欠
  - date: 1790-03-01
    title_zh: 主修书局刊布经史
    rationale: 楚地文风宜振，刊经籍以嘉惠士林，使吏治文章并进
events:
- id: guji-毕沅-event-birth
  date: 1730-01-01
  year_of: 1730
  title_zh: 生于江苏镇洋
  description: 雍正八年生于镇洋，少力学，乾隆二十五年成进士，入翰林
- id: guji-毕沅-event-death
  date: 1797-07-16
  year_of: 1797
  title_zh: 卒于湖广总督任上
  description: 嘉庆二年六月廿三卒于武昌任所，谥庄恪，著有经训堂集诸书
- id: guji-毕沅-event-transfer-huguang
  date: 1788-04-01
  year_of: 1788
  title_zh: 授湖广总督兼署湖北巡抚
  description: 由陕西巡抚调督湖广，总制鄂湘，首察户口荒田，议招辑开垦
- id: guji-毕沅-event-fu-henan
  date: 1785-06-01
  year_of: 1785
  title_zh: 历任河南陕西巡抚治赈
  description: 分别抚豫抚秦，疏陈灾缓带征积欠宜核民欠吏蚀，浚治河堤赈济饥民
