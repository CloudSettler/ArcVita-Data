events:
- id: guji-毕沅-event-birth
  kind: birth
  date: '1730'
  year_of: 1730
  title_zh: 毕沅出生
  description: 雍正八年生于江苏镇洋，字纕蘅，号秋帆
- id: guji-毕沅-event-dingyou
  kind: career
  date: 1779-12
  year_of: 1779
  title_zh: 陕西巡抚任上丁忧奉旨回籍
  description: 乾隆四十四年十二月谕陕西巡抚员缺紧要，著刘秉恬前往署理，毕沅即应回籍守制
- id: guji-毕沅-event-houjia
  kind: career
  date: 1780-03
  year_of: 1780
  title_zh: 谕明春南巡回銮至苏候驾
  description: 谕毕沅南巡经苏州时尚在百日内未便接驾，计回銮三月望后百日期满在彼伺候接驾
- id: guji-毕沅-event-jina
  kind: career
  date: 1779-12
  year_of: 1779
  title_zh: 奏报缉拿进剿金川潜逃绿旗兵丁
  description: 悉心设法悬赏实力缉捕，节年拿获四十名正法，本年又获二名审明治罪，仍饬属严拿务期全获
- id: guji-毕沅-event-zhenan
  kind: career
  date: 1779-12
  year_of: 1779
  title_zh: 镇安县李生花家被劫案审拟具奏
  description: 首盗冯老三纠夥十余人明火执仗劫财，九月被劫至十二月始审拟斩决，交三法司核拟并谕刘秉恬查明迟延缘由
- id: guji-毕沅-event-jiaoxie
  kind: career
  date: 1779-12
  year_of: 1779
  title_zh: 交卸陕西巡抚由刘秉恬署理
  description: 以丁忧去任，陕西巡抚员缺著刘秉恬署理，不必来京请训
- id: guji-毕沅-event-death
  kind: death
  date: '1797'
  year_of: 1797
  title_zh: 毕沅去世
  description: 嘉庆二年卒于官，谥文慎，著述宏富，抚陕治绩与缉逃整军并称
