  - key: breakthrough
    name: 奏请截漕
    labels:
      zh: 截漕备荒
    start_date: 1785-04
    highlight_event_id: guji-毕沅-event-1
  - key: climax
    name: 奉旨加截三十万石
    labels:
      zh: 得旨加拨
    start_date: 1785-04
    highlight_event_id: guji-毕沅-event-1
  - key: closure
    name: 雇船递运备用
    labels:
      zh: 转运接济
    start_date: 1785-05
    highlight_event_id: guji-毕沅-event-1
  decisions:
  - date: 1785-04
    title_zh: 请截豫省六帮米豆并截山东粟米凑足二十万石
    rationale: 河北仓储因连年积歉蠲缓散给存贮无多而别府不通水路挽运维艰须就近截漕雇民船速运
  - date: 1785-04
    title_zh: 遵旨于豫东两省竟给三十万石不足则拨南粮凑足
    rationale: 卫辉被旱已久穷黎口食维艰雨后尚须借给耔种口粮非宽储不能应赈贷之需
- id: guji-毕沅-endeavor-2
  title_zh: 覆陈宝陕局鼓铸章程
  summary_zh: 在陕抚任内查明宝陕局高七低三旧例覆奏滇省低铜未到时权宜全用高铜配铅锡以免停炉
  phases:
  - key: brewing
    name: 查定旧例
    labels:
      zh: 钱法稽查
    start_date: 1785-01
    highlight_event_id: guji-毕沅-event-2
  - key: breakthrough
    name: 通融配铸
    labels:
      zh: 权宜鼓铸
    start_date: 1785-04
    highlight_event_id: guji-毕沅-event-2
  - key: climax
    name: 覆奏成本无多
    labels:
      zh: 核算成本
    start_date: 1785-04
    highlight_event_id: guji-毕沅-event-2
  - key: closure
    name: 请俟滇铜到仍照旧例
    labels:
      zh: 归复旧章
    start_date: 1785-04
    highlight_event_id: guji-毕沅-event-2
  decisions:
  - date: 1785-04
    title_zh: 暂行全用高铜配铅锡鼓铸
    rationale: 滇省低铜未到若拘旧例则停炉歇卯权宜全用高铜仍属低铜钱文且省低铜加耗无私销之利
  - date: 1785-04
    title_zh: 十三运滇铜到局仍照高七低三鼓铸
    rationale: 权宜不可为常俟来料充裕即复旧例以符定章而杜弊窦
