  title_zh: 生于宫中为皇四子
  description: 乾隆四年正月十四日生母淑嘉皇贵妃金佳氏于兄弟中次序最长秉性醇良
- id: guji-永珹-event-adopt
  date: 1763-11-01
  year_of: 1763
  title_zh: 出嗣履懿亲王允祹为孙
  description: 乾隆二十八年奉旨过继为履懿亲王后离开本生列入宗藩承继香火
- id: guji-永珹-event-invest
  date: 1764-01-01
  year_of: 1764
  title_zh: 封履郡王掌本府事务
  description: 承嗣后晋封履郡王持府端谨不预朝政深得乾隆嘉许为诸子中持重者
- id: guji-永珹-event-rite
  date: 1777-03-01
  year_of: 1777
  title_zh: 奉命与六弟捧帛献爵
  description: 大行皇太后尊谥大祭礼部请用宗室侍卫捧献乾隆特命四阿哥永珹与六阿哥永瑢捧献以示殊恩
- id: guji-永珹-event-illness
  date: 1777-04-05
  year_of: 1777
  title_zh: 上临西花园视疾
  description: 乾隆四十二年二月甲子日永珹遘疾乾隆亲临西花园视其疾是日薨逝
- id: guji-永珹-event-death
  date: 1777-04-05
  year_of: 1777
  title_zh: 履郡王永珹薨
  description: 以疾不起而终乾隆谕以秉性醇良持躬端谨派八阿哥永璇穿孝与金简办理丧仪
- id: guji-永珹-event-mourn
  date: 1777-04-06
  year_of: 1777
  title_zh: 上临第赐奠加亲王仪
