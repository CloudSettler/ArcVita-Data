    title_zh: 奏明旗民挟嫌行架数案严饬究治
    rationale: 省会重地兵民互殴关系地方必严查渠魁惩创以靖地方
  - date: '1751-08-15'
    title_zh: 督同两司审明闹粜罢市各案并究办理不善之官
    rationale: 开仓出粜原为宁谧若道府牧令实力奉行何致劣衿奸棍屡滋事必严惩玩法刁徒不存姑息
events:
- id: guji-永贵-event-birth
  title_zh: 出生
  date: '1706-01-01'
  year_of: 1706
  description: 康熙四十五年生于满洲正白旗拜杜氏
- id: guji-永贵-event-1
  title_zh: 奏请楚省拨谷碾米二十万石协浙
  date: '1751-07-01'
  year_of: 1751
  description: 浙江巡抚永贵奏浙省现资粜赈请湖广拨谷碾米协济得旨允准令浙江委员赴汉口接运赴浙
- id: guji-永贵-event-2
  title_zh: 杭州兵民互殴罢市奉旨严查
  date: '1751-07-12'
  year_of: 1751
  description: 杭州兵丁因角口与民斗殴报复抢夺铺户至罢市并衢属常山米贵抢夺谕令永贵据实查奏实力整顿不得偏袒旗人
- id: guji-永贵-event-3
  title_zh: 奏请江闽通商暂驰海禁免米税
  date: '1751-08-01'
  year_of: 1751
  description: 永贵奏杭嘉湖得雨浙东八府未得透雨请江闽运米商贩赴温台宁处四府暂开海禁得旨允准并免徵米税
- id: guji-永贵-event-4
  title_zh: 奏报金华遂昌等闹粜罢市缉获审办
  date: '1751-08-15'
  year_of: 1751
  description: 闰五月金华刁民鬨闹公堂挟制罢市太平乡民请粜鬨闹遂昌刁民鬨闹塞署罢市汤溪江山鬨闹米厂陆续缉获数十名督同两司审拟
- id: guji-永贵-event-death
  title_zh: 逝世
  date: '1783-01-01'
  year_of: 1783
  description: 乾隆四十八年卒历任浙江巡抚闽浙总督大学士等职
