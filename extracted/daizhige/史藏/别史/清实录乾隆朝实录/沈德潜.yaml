  era: 清
  reign_ref: 乾隆
  archetype: 耆儒诗宗
  dilemmas:
  - 早年屡困场屋，是坚守诗古文辞之业还是专趋举业求速达
  - 晚遇为东南缙绅领袖，是守温柔敦厚以存诗教还是犯颜直谏以尽臣节
  lesson: 绩学工诗以待时，温厚持正以保晚节，诗教身教皆可化人
  summary_first_person: 吾确士，吴中布衣，早困科场，中年始以博学鸿词遇主，由翰林洊擢侍郎，命授读尚书房，年高归田，蒙加尚书衔晋太子太傅在籍食俸，南巡屡蒙存问，寿跻九十七，以诗接后学，以谨厚自守，今溘逝，惟愿诗宗不坠，乡里知劝
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70843.html
