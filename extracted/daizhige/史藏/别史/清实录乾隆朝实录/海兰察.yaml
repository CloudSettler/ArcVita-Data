    title_zh: 请以巴图鲁健锐为先锋
    rationale: 台湾山深路险，非精锐不能速决，故请调索伦健锐以摧锋
  - date: 1788
    title_zh: 分路合围不予贼喘息
    rationale: 贼众乌合久战必溃，宜南北夹击一鼓荡平，以绝海疆后患
