    rationale: 廓尔喀恃险劫掠，若不深入痛剿则藏卫永无宁日，故冒雪穷追
  - date: 1792
    title_zh: 受降班师保全边民
    rationale: 敌已屈膝纳贡，宜见好就收，立章程以久安西陲，勿糜饷劳师
