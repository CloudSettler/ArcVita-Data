  title_zh: 率全部东归投诚
  summary: 以俄罗斯征调不息索子入质且异教相压遂密谋挈三万余户自额济勒启行绕巴勒喀什诺尔戈壁抵伊犁沙拉伯勒归顺
  phases:
  - key: brewing
