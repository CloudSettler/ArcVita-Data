  decisions:
  - date: '1770-12-01'
    title_zh: 弃额济勒挈全部东归
    rationale: 不忍子孙入质异域且欲息肩黄教之地虽涉万里亦投中国
  - date: '1771-07-30'
    title_zh: 直抵伊犁界纳款不劫掠
    rationale: 示诚顺以取抚纳免进退无据沦为寇仇
- id: guji-渥巴锡-endeavor-2
  title_zh: 入觐受封安置部众
  summary: 奉命选台吉由驿入觐随围观猎于山庄燕赉受封爵朝廷发帑市畜赈赡分地安居计长久
  phases:
