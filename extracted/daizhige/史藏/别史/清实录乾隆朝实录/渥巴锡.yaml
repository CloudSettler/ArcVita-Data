person:
  qid: guji-渥巴锡
  name_zh: 渥巴锡
  names:
    zh: 渥巴锡
    en: Ubashi Khan
  lifespan:
    birth:
      date: 1742
      precision: year
      is_circa: true
      raw: 约乾隆七年生于伏尔加
    death:
      date: 1775
      precision: year
      is_circa: false
      raw: 乾隆四十年卒于京师
  birth_date: 1742
  death_date: 1775
  era: 清代
  reign_ref: 乾隆
  archetype: 归义之君
  dilemmas:
  - 留居伏尔加忍受异俗压迫与率部万里东归冒死求生之抉择
  - 舍楞观望离异可能分裂部众与独力承担全族安危之两难
  - 归顺后受朝廷指地安插与保全部落旧俗生计之权衡
  lesson: 心向故土则万里可归，审时归顺则全族得存，疑忌离心则事必败
  summary_first_person: 吾为阿玉奇汗之后，久居俄罗斯伏尔加，不堪异俗相扰，遂与族人盟誓，率八九万众摆脱追兵，历沙漠戈壁而东归，蒙大皇帝恩抚安插于额尔齐斯博罗塔拉等地，保全黄教旧俗，得以入觐施恩，终全归义之名。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70887.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70887.html
endeavors:
- id: guji-渥巴锡-endeavor-1
  title_zh: 率部摆脱俄罗斯万里东归
  summary: 因不从俄罗斯之俗，与舍楞等密谋，率土尔扈特部众自沙喇伯勒一路逸出，东归伊犁投诚。
  phases:
  - key: brewing
    name: 伏尔加隐忍待机
    labels:
      zh:
      - 隐忍
      - 联络诸台吉
    start_date: 1770-10-01
    highlight_event_id: guji-渥巴锡-event-depart
  - key: breakthrough
    name: 盟誓逸出东行
    labels:
      zh:
      - 决断东归
    start_date: 1771-01-05
    highlight_event_id: guji-渥巴锡-event-depart
  - key: climax
    name: 跋涉万里抵伊犁
    labels:
      zh:
      - 艰苦跋涉
      - 力穷投诚
    start_date: 1771-06-01
    highlight_event_id: guji-渥巴锡-event-arrive
  - key: closure
    name: 遣使请安归顺
    labels:
      zh:
      - 遣使
      - 投诚属实
    start_date: 1771-06-25
    highlight_event_id: guji-渥巴锡-event-arrive
  decisions:
  - date: 1771-01-05
    title_zh: 乘冬寒率众逸出伏尔加
    rationale: 久居异域教俗不合，与其坐困受制，不如冒死东归承受天朝抚绥以存黄教旧俗
  - date: 1771-06-01
    title_zh: 不顾舍楞在后观望坚持前行投诚
    rationale: 若因一人犹豫耽误全族，则前功尽弃，须晓示部众同心前赴伊犁以明归顺之诚
- id: guji-渥巴锡-endeavor-2
  title_zh: 接受抚绥安插与入觐施恩
  summary: 抵伊犁后听候色布腾巴勒珠尔舒赫德等迎抚，接受指地于额尔齐斯博罗塔拉等处安居，并遣策伯克多尔济等赴热河朝觐。
  phases:
  - key: brewing
    name: 伊犁迎抚查验
    labels:
      zh:
      - 迎抚
      - 查验户口
    start_date: 1771-07-08
    highlight_event_id: guji-渥巴锡-event-arrive
  - key: breakthrough
    name: 奏请指地安插
    labels:
      zh:
      - 指地
      - 接济
    start_date: 1771-08-01
    highlight_event_id: guji-渥巴锡-event-resettle
  - key: climax
    name: 遣头目热河朝觐
    labels:
      zh:
      - 入觐
      - 施恩
    start_date: 1771-09-15
    highlight_event_id: guji-渥巴锡-event-audience
  - key: closure
    name: 分部驻牧就赈
    labels:
      zh:
      - 安插
      - 抚绥
    start_date: 1771-10-01
    highlight_event_id: guji-渥巴锡-event-audience
  decisions:
  - date: 1771-08-01
    title_zh: 听从指居塔尔巴哈台东科布多西
    rationale: 沙喇伯勒近边易逃，乌噜木齐近卡路不便，居额尔齐斯等处既远边防又便管束，可长久安居
  - date: 1771-09-15
    title_zh: 先遣策伯克多尔济等入觐避暑山庄
    rationale: 远人来归宜速明臣节，遣大头人朝觐得沛殊恩，并安众心，且舍楞亦可一体免罪招徕
events:
- id: guji-渥巴锡-event-birth
  title_zh: 生于伏尔加土尔扈特汗族
  date: 1742
  year_of: 1742
  description: 阿玉奇汗之嗣，袭为土尔扈特台吉，居俄罗斯伏尔加一带，崇信黄教。
- id: guji-渥巴锡-event-depart
  title_zh: 率户口数万自俄罗斯逸出东归
  date: 1771-01-05
  year_of: 1771
  description: 与舍楞等率部自沙喇伯勒一路逸出，脱离俄罗斯，向伊犁进发，行程万里，死伤过半。
- id: guji-渥巴锡-event-arrive
  title_zh: 抵达伊犁投诚请安
  date: 1771-07-08
  year_of: 1771
  description: 先遣策伯克多尔济遣格隆等至伊犁请安，伊勒图舒赫德等奏报投诚属实，朝廷遣色布腾巴勒珠尔迎接，议赏银接济马匹牲畜。
- id: guji-渥巴锡-event-resettle
  title_zh: 奉旨指地额尔齐斯博罗塔拉安插
  date: 1771-08-01
  year_of: 1771
  description: 谕令土尔扈特绰罗斯等居塔尔巴哈台东科布多西之额尔齐斯博罗塔拉额密勒斋尔等处，拨银二十万两分贮安西巴里坤乌噜木齐接济。
- id: guji-渥巴锡-event-audience
  title_zh: 遣策伯克多尔济等赴热河朝觐
  date: 1771-09-15
  year_of: 1771
  description: 交舒赫德派出乌尔图纳逊带领策伯克多尔济等赴避暑山庄，九月中旬入觐，与车凌等一例施恩，舍楞亦许免罪一体加恩。
- id: guji-渥巴锡-event-death
  title_zh: 卒于京师
  date: 1775
  year_of: 1775
  description: 东归后封汗留京，年余因病卒，部众留居新疆繁衍，终成乾隆朝归义盛事。
