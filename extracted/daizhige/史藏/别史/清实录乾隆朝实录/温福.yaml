    en: Wenfu
  lifespan:
    birth:
      date: 1728
      precision: year
      is_circa: true
      raw: 雍正年间生，具体生年无考
    death:
      date: 1773-07-03
      precision: day
      is_circa: false
      raw: 乾隆三十八年六月阵亡于木果木
  birth_date: 1728
  death_date: 1773-07-03
  era: 清乾隆朝
  reign_ref: 乾隆三十六年辛卯
  archetype: 奋勇经略之军功将帅
  dilemmas:
  - 南路迂远与西路险固之间，何者为正兵决战方向
  - 兵力单薄与三路分进牵制之间，如何调黔陕援兵速济军需
  - 碉卡坚固难攻与越道捣虚奇袭之间，如何避坚击虚一举集事
  lesson: 审度地形以定正奇，分兵牵制以夺腹背，添兵务足而急攻弗懈，方能破坚碉而捣巢穴
  summary_first_person: 吾温福受命为定边右副将军，十月抵成都，审小金川形势，以西路巴朗拉最近贼巢，遂决意亲统劲旅由西路进剿，复调黔兵陕甘兵以厚兵力，务期三路夹攻，直捣美诺，以报国恩
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70896.html
endeavors:
- id: guji-温福-endeavor-1
  title_zh: 审定西路为正兵进剿小金川
  summary_zh: 以南路迂远非正路，断以西路福昌巴朗拉直捣美诺为正兵，南路章谷牵制，董天弼尧碛夹击，使贼腹背受敌
  phases:
  - key: brewing
    name: 抵成都询各路情形
    labels:
      zh: 察看形势
    start_date: 1771-10-18
    highlight_event_id: guji-温福-event-1
  - key: breakthrough
    name: 断西路为进兵正路
    labels:
      zh: 定策正奇
    start_date: 1771-10-28
    highlight_event_id: guji-温福-event-1
  - key: climax
    name: 改赴西路亲统进攻
    labels:
      zh: 亲往督战
    start_date: 1771-11-02
    highlight_event_id: guji-温福-event-2
  - key: closure
    name: 会合董天弼福昌夹击美诺
    labels:
      zh: 部署会剿
    start_date: 1771-11-10
    highlight_event_id: guji-温福-event-2
  decisions:
  - date: 1771-10-28
    title_zh: 舍南就西以西路为正兵
    rationale: 南路章谷距贼巢迂远本非正路，西路巴朗拉最近美诺，当前后夹攻使贼首尾不顾
  - date: 1771-11-02
    title_zh: 不往章谷直趋西路
    rationale: 桂林已赴章谷南路有重兵，董天弼已破甲金达，西路兵弱而关要害，不可稽迟，须亲率劲旅往攻
- id: guji-温福-endeavor-2
  title_zh: 调黔陕援兵厚集西路兵力
  summary_zh: 以西路仅七千兵在在坚碉口隘需分兵，带贵州兵三千续调二千，请备陕甘兵二三千，兼办皮衣军械以御天寒
  phases:
  - key: brewing
    name: 查西路兵仅七千单薄
    labels:
      zh: 核计兵力
    start_date: 1771-10-28
    highlight_event_id: guji-温福-event-3
  - key: breakthrough
    name: 飞调黔兵径赴西路
    labels:
      zh: 调黔兵赴川
    start_date: 1771-11-01
    highlight_event_id: guji-温福-event-3
  - key: climax
    name: 请备陕甘强壮兵备用
    labels:
      zh: 借陕甘兵
    start_date: 1771-11-05
    highlight_event_id: guji-温福-event-3
  - key: closure
    name: 拨川北标兵协守赏给寒衣
    labels:
      zh: 恤兵备寒
    start_date: 1771-11-08
    highlight_event_id: guji-温福-event-3
  decisions:
  - date: 1771-11-01
    title_zh: 黔兵三千径往西路兼豫备二千
    rationale: 西路坚碉口隘多须分布，三路并进不可待时，令黔兵速赴军营接续进剿
  - date: 1771-11-05
    title_zh: 请选备陕甘兵二三千听调
    rationale: 揆度事势尚须添兵，陕甘兵强壮且毗连川省，可添拨备用以期一举集事
events:
- id: guji-温福-event-birth
  title_zh: 生于雍正年间
  date: 1728
  year_of: 1728
  place_zh: 京师
  description_zh: 费莫氏满洲镶白旗人，雍正年间生，少以官学生授职，累迁至尚书
- id: guji-温福-event-1
  title_zh: 抵成都审定西路正兵之策
  date: 1771-10-18
  year_of: 1771
  place_zh: 成都
  description_zh: 十月十八日抵成都，询知桂林赴打箭炉，阿尔泰久驻章谷，董天弼改由木坪，遂奏以西路为正兵，南北夹攻，使贼腹背受敌
- id: guji-温福-event-2
  title_zh: 改赴西路巴朗拉督兵进攻
  date: 1771-11-02
  year_of: 1771
  place_zh: 清溪至西路军营
  description_zh: 闻董天弼攻破甲金达，不拘前奏仍往章谷，即率已到官兵前往西路，调成都满兵川北标兵齐赴西路，督率福昌部夹击达木巴宗直捣美诺
- id: guji-温福-event-3
  title_zh: 调黔兵备寒衣请陕甘兵备用
  date: 1771-11-08
  year_of: 1771
  place_zh: 成都西路军中
  description_zh: 调贵州兵三千由汶川出口，奏请皮挂皮帽按名给发赏给不扣饷，并请文绶密备陕甘兵二三千及军械听候调拨
- id: guji-温福-event-death
  title_zh: 阵亡于木果木
  date: 1773-07-03
  year_of: 1773
  place_zh: 小金川木果木
  description_zh: 乾隆三十八年六月督兵进剿金川，于木果木军营遇贼袭击，力战阵亡，谥忠毅
