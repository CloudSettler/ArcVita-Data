    title_zh: 上三方布置疏
    rationale: 辽局已坏，非广集兵马、固守要害、联络朝鲜不能图存，故直陈方略以定守战
  - date: '1619-10-01'
    title_zh: 坚持守关练兵不轻战
    rationale: 敌锋方锐，我军新集，惟有浚壕筑堡、核将练兵，方可持久，故不从躁进之议
