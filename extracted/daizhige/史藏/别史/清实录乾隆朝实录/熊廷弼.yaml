  decisions:
  - date: '1621-03-01'
    title_zh: 复任仍守封疆不避嫌怨
    rationale: 国事孔棘，虽知朝闇难为，然受恩当效命，不忍委辽民而去
  - date: '1625-01-01'
    title_zh: 系狱不屈直道以待罪
    rationale: 所奏皆忠鲠为国之言，无可增饰，惟听公论于后世
