endeavors:
- id: guji-王亶望-endeavor-1
  title_zh: 海宁石塘改建督办
  summary: 丁忧夺情回浙，主持老盐仓一带柴土塘改建石塘，坚持可下桩处一律改石以求永逸，与李质頴岁修保守之议相左，致大学士阿桂覆勘。
  phases:
  - key: brewing
    name: 夺情受命
    labels:
      zh: 丁忧督工
    start_date: 1779-06-01
    highlight_event_id: guji-王亶望-event-haitang
  - key: breakthrough
    name: 驻浙赶筑
    labels:
      zh: 改建石塘
    start_date: 1780-06-01
    highlight_event_id: guji-王亶望-event-haitang
  - key: climax
    name: 意见分歧
    labels:
      zh: 石塘柴塘之争
    start_date: 1780-12-20
    highlight_event_id: guji-王亶望-event-fenqi
  - key: closure
    name: 覆勘定夺
    labels:
      zh: 阿桂会勘
    start_date: 1781-01-02
    highlight_event_id: guji-王亶望-event-gezhi
  decisions:
  - date: 1780-06-01
    title_zh: 主张可下桩处一律改石塘
    rationale: 以为一劳永逸，不必岁岁修补柴塘土塘，难下桩处不过数里
  - date: 1780-12-20
    title_zh: 拟以留工人员署地方印务并令商造海船
    rationale: 以工需人手船只为由便宜调剂，致李质頴参奏掣肘
- id: guji-王亶望-endeavor-2
  title_zh: 丁忧守制与革职效力
  summary: 父丧丁忧不令家属回籍守制，安然聚处杭州，为李质頴面奏揭发，觸孝為百行之首之訓，被革职仍留塘工自备资斧效力赎罪。
  phases:
  - key: brewing
    name: 治丧起复
    labels:
      zh: 驰驿治丧
    start_date: 1779-06-01
    highlight_event_id: guji-王亶望-event-haitang
  - key: breakthrough
    name: 眷留省城
    labels:
      zh: 忘亲越礼
    start_date: 1780-10-01
    highlight_event_id: guji-王亶望-event-fenqi
  - key: climax
    name: 面询揭发
    labels:
      zh: 李质頴入告
    start_date: 1780-12-20
    highlight_event_id: guji-王亶望-event-fenqi
  - key: closure
    name: 革职留工
    labels:
      zh: 效力赎罪
    start_date: 1781-01-02
    highlight_event_id: guji-王亶望-event-gezhi
  decisions:
  - date: 1780-10-01
    title_zh: 家属仍住杭州不回本籍守制
    rationale: 托词公务需人照料，实则安然聚处，失大臣表率
  - date: 1781-01-02
    title_zh: 革职后自备资斧留塘工效力
    rationale: 奉旨赎罪图效，若再怨望不实心自效必重治其罪
events:
- id: guji-王亶望-event-birth
  date: 1730-01-01
  year_of: 1730
  title_zh: 出生
  description: 王师之子，生于乾隆初年，读书入仕，历任至浙江巡抚
- id: guji-王亶望-event-haitang
  date: 1779-06-01
  year_of: 1779
  title_zh: 丁忧夺情督办海宁石塘
  description: 以曾任浙抚且肯担当，命在服中驰驿回浙督办海宁改建石塘，不令与地方之务
- id: guji-王亶望-event-fenqi
  date: 1780-12-20
  year_of: 1780
  title_zh: 与李质頴石塘柴塘意见不合被揭眷留杭州
  description: 李质頴来京召对奏改建石塘后柴土塘仍须岁修，并奏王亶望家属不回原籍守制及派署印务令商造船事
- id: guji-王亶望-event-gezhi
  date: 1781-01-02
  year_of: 1781
  title_zh: 以忘亲越礼革职留塘工效力
  description: 乾隆以孝为百行之首谕斥王亶望大节有亏，革职仍留塘工自备资斧效力赎罪，命阿桂会同富勒浑覆勘
- id: guji-王亶望-event-death
  date: 1781-07-01
  year_of: 1781
  title_zh: 逝世
  description: 海塘效力后因甘肃冒赈案发，乾隆四十六年赐死
