  lesson: 公务担当不可废名教大节，忘亲越礼则功不掩过
  summary_first_person: 余以浙抚丁忧，蒙夺情督办海宁石塘，本当感恩实心筹办，一劳永逸；乃与李质頴意见不合，又留眷杭州不回籍守制，自谓公务起见，实亏大节，致革职留工，自备资斧效力，方知忠孝不可偏废，名教攸关不可苟且。
