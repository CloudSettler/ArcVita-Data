events:
- id: guji-班滚-event-birth
  title_zh: 出生于瞻对番部
  date: 1700
  year_of: 1700
  description: 生于瞻对，为众酋头目，渐据了鲁如郎丫鲁一带，恃碉自雄
- id: guji-班滚-event-rulang-escape
  title_zh: 弃如郎寨携家逃往丫鲁
  date: 1746-04-14
  year_of: 1746
  description: 钦差班第努三提督李质粹至军营赴如郎，班滚与其弟恶木劳丁携妻子先逃，土守备汪结及降人俄木丁指称必逃母舅沙加邦妻兄姜错太处
- id: guji-班滚-event-yalu-transfer
  title_zh: 匿沙加邦复移泥日寨
  date: 1746-04-17
  year_of: 1746
  description: 班滚逃赴沙加邦家住三日，以寨小难久匿，由姜错太接赴泥日寨藏匿，官兵追至丫鲁烧毁碉楼四十余座
- id: guji-班滚-event-death
  title_zh: 烧毙于泥日寨碉楼
  date: 1746-04-23
  year_of: 1746
  description: 四月二十日官兵围攻泥日寨，二十三日夜齐扑碉门施放地雷，连烧大小战碉五十余座，班滚并家口恶木劳丁姜错太等俱烧毙碉内，形骸难辨，惟认出随身鸟枪铜椀等物，余众畏威投诚
