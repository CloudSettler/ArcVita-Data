  description: 生年不详约康熙末年出身满洲镶黄旗世家早年由宿卫历任要职
- id: guji-班第-event-1
  date: 1754-10-01
  year_of: 1754
  title_zh: 北路进兵擒乌梁海三宰桑收户口千余
  description: 自到军营遵旨相度机宜奋勇进兵擒获阿尔台以内乌梁海宰桑三人收厄鲁特户口千余与策楞舒赫德畏缩阻挠者迥异
- id: guji-班第-event-2
  date: 1754-11-15
  year_of: 1754
  title_zh: 越索勒毕岭擒两玛木特奉旨赏世袭子爵
  description: 遣萨喇勒等越岭进至布拉罕察罕托辉额贝和硕擒库克新玛木特通玛木特悉获扎哈沁兵百余名未伤损一人奉旨赏给世袭子爵补正黄旗领侍卫内大臣赏银千两
- id: guji-班第-event-death
  date: 1755-09-20
  year_of: 1755
  title_zh: 殉事于北路征准噶尔军中
  description: 乾隆二十年定北将军进取伊犁后以阿睦尔撒纳叛乱变起仓猝力尽殉国朝廷惜其忠勇前劳追念前此乌梁海玛木特之功
