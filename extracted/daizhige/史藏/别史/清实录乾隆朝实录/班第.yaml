  era: 清乾隆朝
  reign_ref: 乾隆十九年甲戌
  archetype: 奋勇开边之将帅
  dilemmas:
  - 奉命治军当持重自全以避咎还是冒险冲寒深入以图功
  - 对所获厄鲁特降俘当严羁以绝患还是释回骨肉完聚以传檄招怀
  lesson: 相度机宜实心奋勉调遣合宜方能转畏缩之局而成奇功
  summary_first_person: 我自到北路军营以来遵旨相度机宜先取阿尔台以内乌梁海三宰桑收户口千余继遣萨喇勒越索勒毕岭擒两玛木特收厄鲁特兵百五十人不损一人蒙恩赐世袭子爵补领侍卫内大臣此皆圣主威福昊苍默佑所致也
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0475.html
endeavors:
- id: guji-班第-endeavor-1
  title_zh: 北路抚定乌梁海收阿尔台内户口
  summary: 到军营后遵旨进兵擒获阿尔台以内居住准噶尔乌梁海三宰桑收户口二千余户奠定北路进取之基
  phases:
  - key: brewing
    name: 到营视师审度形势
    labels:
      zh:
      - 视师审势
    start_date: 1754-09-01
    highlight_event_id: guji-班第-event-1
  - key: breakthrough
    name: 进兵阿尔台擒三宰桑
    labels:
      zh:
      - 进兵擒获
    start_date: 1754-10-01
    highlight_event_id: guji-班第-event-1
  - key: climax
    name: 收户口二千余户抚定游牧
    labels:
      zh:
      - 收户抚定
    start_date: 1754-10-15
    highlight_event_id: guji-班第-event-1
  - key: closure
    name: 奏捷奉旨嘉奖定策再进
    labels:
      zh:
      - 奏捷受赏
    start_date: 1754-11-15
    highlight_event_id: guji-班第-event-2
  decisions:
  - date: 1754-10-01
    title_zh: 不从策楞舒赫德畏缩之议奋勇进兵乌梁海
    rationale: 畏缩则坐失机宜奋勉则可收户口以孤准夷羽翼故违众而进
  - date: 1754-10-15
    title_zh: 奏请开示恩德量加赏赉以安新附
    rationale: 以恩信结喀尔喀官兵及乌梁海新户为来年大举进兵之用
- id: guji-班第-endeavor-2
  title_zh: 越索勒毕岭擒获两玛木特
  summary: 询知玛木特居址遣萨喇勒班珠尔等越岭抄后路擒库克新玛木特通玛木特悉获扎哈沁噶勒杂特兵百余名
  phases:
  - key: brewing
    name: 遣使询问玛木特游牧居址
    labels:
      zh:
      - 侦讯居址
    start_date: 1754-10-20
    highlight_event_id: guji-班第-event-2
  - key: breakthrough
    name: 拣派精兵给马粮命萨喇勒率领越岭
    labels:
      zh:
      - 拣兵越岭
    start_date: 1754-11-01
    highlight_event_id: guji-班第-event-2
  - key: climax
    name: 进至察罕托辉额贝和硕悉行擒获
    labels:
      zh:
      - 奇袭擒获
    start_date: 1754-11-10
    highlight_event_id: guji-班第-event-2
  - key: closure
    name: 释回胁从遣解首犯奉旨晋爵
    labels:
      zh:
      - 释胁晋爵
    start_date: 1754-11-15
    highlight_event_id: guji-班第-event-2
  decisions:
  - date: 1754-11-01
    title_zh: 令萨喇勒班珠尔齐木库尔等抄后路往拏
    rationale: 玛木特近边游牧闻风易遁惟出其不意越岭抄后路可不致一名漏网
  - date: 1754-11-15
    title_zh: 所获厄鲁特百五十余名释回完聚得木齐等解京
    rationale: 悯其只身被获父母妻子分离释回可互相传播感戴圣恩于来年进兵大有裨益
events:
