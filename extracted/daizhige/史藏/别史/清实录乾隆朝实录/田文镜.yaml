  - key: closure
    name: 身后贤良祠去留之议
    labels:
      zh:
      - 身后之名
      - 贤良祠议
    start_date: '1740-05-10'
    highlight_event_id: guji-田文镜-event-xianliang-dispute
  decisions:
  - date: '1729'
    title_zh: 直隶水利营田并举
    rationale: 畿辅水患频仍，惟疏浚河渠兼行营田方能裕民足食固根本
  - date: '1730'
    title_zh: 以疾仍任事不求退避
    rationale: 受世宗殊遇，当以身许国，鞠躬尽瘁不以病废公事
