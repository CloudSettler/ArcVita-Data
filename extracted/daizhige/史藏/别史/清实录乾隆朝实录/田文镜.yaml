  decisions:
  - date: '1724'
    title_zh: 彻底清查河南亏空
    rationale: 亏空不去则国课不充，必以严法核追，虽致怨亦不稍贷
  - date: '1727'
    title_zh: 坚持严核不徇情面
    rationale: 吏治废弛由于姑息，惟严惩怠玩贪纵方能振纲纪裕国课
- id: guji-田文镜-endeavor-2
  title_zh: 督直畿总理庶政
  summary_zh: 总督直隶兼管水利营田，入为大学士总理事务，佐世宗推行新政
