endeavors:
- id: guji-田文镜-endeavor-1
  title_zh: 抚豫整顿钱粮吏治
  summary_zh: 雍正初抚河南，清亏空，核田赋，整顿属吏，以严厉精核著称
  phases:
  - key: brewing
    name: 初抚河南清查亏空
