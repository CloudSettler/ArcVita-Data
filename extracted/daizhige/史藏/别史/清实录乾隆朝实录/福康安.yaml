  - key: closure
    name: 贡使改由川陕赴热河瞻觐
    labels:
      zh: 贡使改道
    start_date: 1795-06-01
    highlight_event_id: guji-福康安-event-3
  decisions:
  - date: 1795-05-23
    title_zh: 饬令彭廷栋等严堵山僻要隘
    rationale: 黔系起事之处党与尚多，若任首逆乘间窜入复行勾结，则粮饷阻梗苟延残喘，故须严行堵截
  - date: 1795-05-28
    title_zh: 请缅甸南掌贡使改由川陕一路进京
    rationale: 辰沅一带正办军务，改道川陕可俾沿途仰睹天朝富庶，复赶赴热河与蒙古王公同与锡宴，以副向化之诚
events:
- id: guji-福康安-event-birth
  title_zh: 出生于满洲镶黄旗富察氏家
  date: 1754-01-01
  year_of: 1754
  description: 乾隆十九年生，大学士傅恒之侄，孝贤皇后族侄，少以荫补官，历练戎务
- id: guji-福康安-event-1
  title_zh: 分兵攻克苗寨奏捷
  date: 1795-05-23
  year_of: 1795
  description: 会同和琳奏连日分兵攻克苗寨打仗杀贼情形，奉旨嘉奖，谕令直捣巢穴按名生致首恶，并严防窜入黔省后路
- id: guji-福康安-event-2
  title_zh: 滚牛坡大捷奏叙有功将弁
  date: 1795-05-28
  year_of: 1795
  description: 攻打滚牛坡贼众舍死抗拒经官兵奋力剿杀歼戮甚众，开具侍卫章京汉屯将备名单进呈，加等升赏巴图鲁名号花翎蓝翎有差
- id: guji-福康安-event-3
  title_zh: 永绥乘胜进剿兼筹贡使改道
  date: 1795-06-01
  year_of: 1795
  description: 一抵楚境连次克捷复将永绥贼匪剿杀乘胜进剿直捣贼巢，并奏缅甸南掌遣使祝厘请由川陕一路进京，奉旨令于七月望前后赶赴热河
- id: guji-福康安-event-death
  title_zh: 病卒于军中
  date: 1796-07-02
  year_of: 1796
  description: 乾隆六十一年剿办苗匪未竣积劳病卒于军，谥文襄，追封嘉勇郡王，配享太庙
