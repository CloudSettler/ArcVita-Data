endeavors:
- id: guji-福康安-endeavor-1
  title_zh: 驰抵藏边廓清后路统劲旅捣穴擒渠
  description: 乾隆五十七年三月驰抵卫藏边界，檄令布鲁克巴等部落牵制廓尔喀，奖赏收复哲孟雄之番众，整饬济咙聂拉木防务，统屯土索伦劲旅深入贼巢。
  phases:
