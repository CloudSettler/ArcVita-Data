  decisions:
  - date: 1789-01-08
    title_zh: 到省后不以宁谧自懈仍留心察访
    rationale: 台湾虽定而善良感服不肖畏惧之机不可失当默化潜移以固根本
  - date: 1789-01-15
    title_zh: 以仓库报销营伍为目前要务悉心查核
    rationale: 仓库为民命所系营伍为海防所系必先清核积弊方能永靖地方
- id: guji-福康安-endeavor-2
  title_zh: 闽省祈泽补种与平粜安民
  summary: 闽省冬晴二麦未齐地瓜待泽率属祈祷筹议开仓平粜以防市价腾昂
