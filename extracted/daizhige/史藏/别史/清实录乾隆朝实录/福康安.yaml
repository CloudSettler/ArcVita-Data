  summary_first_person: 我是福康安，累任将军总督，乾隆五十七年统兵廓尔喀，克复藏地，甲尔古拉集木集夺隘攻坚，奏调松潘川北镇将，议恤阵亡官兵，会同孙士毅惠龄和琳经理藏务善后，受廓尔喀头人扎什伦布谢罪，翊卫班禅，以振兴黄教永定边陲为任。
