      - 联络
      - 牵制
    start_date: 1792-03-30
    highlight_event_id: guji-福康安-event-2
  - key: climax
    name: 廓清后路
    labels:
      zh:
      - 廓清
      - 奖赉
    start_date: 1792-03-30
    highlight_event_id: guji-福康安-event-2
  - key: closure
    name: 统劲旅深入
    labels:
      zh:
      - 深入
      - 捣穴
    start_date: 1792-04-01
    highlight_event_id: guji-福康安-event-2
  decisions:
  - date: 1792-03-30
    title_zh: 檄谕布鲁克巴作木朗披楞发兵攻贼
    rationale: 藉不睦之部落牵缀贼势而非恃其捣穴，须待大兵深入再约期夹攻
  - date: 1792-04-01
    title_zh: 定计统五六千劲旅深入捣穴
    rationale: 贼巢小兵无多，攻其腹心中坚则不攻自溃，不可零星分兵置有用之兵于无用之地
- id: guji-福康安-endeavor-2
  title_zh: 筹集藏地军资严办徇隐整饬军纪
  description: 到藏采办硝磺铅斤添买良马，收缴布达拉火药铅子炮位马匹并请给价体恤，审讯保泰雅满泰许银说合徇隐不奏请重责枷号。
  phases:
