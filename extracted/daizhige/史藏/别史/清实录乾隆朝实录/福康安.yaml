endeavors:
- id: guji-福康安-endeavor-1
  title_zh: 赴滇查办钱法
  description: 乾隆五十九年冬抵云南省城，履勘局铸官钱成色分量，核小钱渊薮之源，筹停铸后调剂银钱之法
  phases:
  - key: brewing
    name: 初抵省城察览
    labels:
      zh:
      - 履勘
      - 钱法
    start_date: 1794-12
    highlight_event_id: guji-福康安-event-yunnan
  - key: climax
    name: 筹定调剂章程
    labels:
      zh:
      - 调剂
      - 流通
    start_date: 1794-12
    highlight_event_id: guji-福康安-event-yunnan
  decisions:
  - date: 1794-12
    title_zh: 详查官局私铸源流
    rationale: 云南为小钱渊薮，须究官局克减与私铸搀杂之别，方能清源
  - date: 1794-12
    title_zh: 设法调剂使银钱得平
    rationale: 每银一两换钱二千五百余文，价贱壅滞，惟流通调剂可便商民
- id: guji-福康安-endeavor-2
  title_zh: 照会安南裁抑繁文
  description: 接安南阮光缵呈文土仪，谕以人臣无境外之交，未便收受，省酬答往返之烦以安藩心
  phases:
  - key: brewing
    name: 接藩呈文土仪
    labels:
      zh:
      - 安南
      - 恭顺
    start_date: 1794-12
    highlight_event_id: guji-福康安-event-annan
  - key: closure
    name: 缮照会发还物件
    labels:
      zh:
      - 大义
      - 简节
    start_date: 1794-12
    highlight_event_id: guji-福康安-event-annan
  decisions:
  - date: 1794-12
    title_zh: 不收土物以明大义
    rationale: 未曾接见而受礼则须酬答，稠叠往来无底，不如明白示以未便收受
  - date: 1794-12
    title_zh: 缮照会安藩心省繁节
    rationale: 既鉴其恳肫恭顺，又免往返之烦，可收两便之效
events:
- id: guji-福康安-event-birth
  date: 1754
  year_of: 1754
  title_zh: 生于京师
  description: 乾隆十九年生，富察氏，大学士傅恒之子
- id: guji-福康安-event-yunnan
  date: 1794-12
  year_of: 1794
  title_zh: 行抵云南省城查办钱法
  description: 奏报省城及附近州县纯用局铸大钱而银一两换钱二千五百余文，奉旨妥定调剂章程
- id: guji-福康安-event-annan
  date: 1794-12
  year_of: 1794
  title_zh: 照会安南发还土仪
  description: 阮光缵递呈文并送肉桂犀角，议以人臣无境外之交，照会晓谕毋庸备送，原物发还
- id: guji-福康安-event-xiushan
  date: 1794-12
  year_of: 1794
  title_zh: 奏请秀山设专学
  description: 任四川总督时奏以松潘茂汶保四学裁额拨秀山，定文武学额廪增，以振文风
- id: guji-福康安-event-death
  date: 1796-06-25
  year_of: 1796
  title_zh: 卒于军中
  description: 嘉庆元年五月督师征湖南苗疆，病卒于军，谥文襄，追封嘉勇郡王
