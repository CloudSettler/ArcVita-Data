endeavors:
- id: guji-福康安-endeavor-1
  title_zh: 驰驿山东会勘黄运岁抢工程
  summary: 乾隆四十八年六月奉旨驰驿赴山东，会同萨载履勘何裕城题销之乾隆四十七年黄运两河岁抢修工程，辨虚实浮冒以闻
  phases:
  - key: brewing
    name: 奉旨简派
    labels:
      zh: 朝命查河
    start_date: '1783-06-04'
    highlight_event_id: guji-福康安-event-1
  - key: breakthrough
    name: 驰驿东省
    labels:
      zh: 星驰履勘
    start_date: '1783-06-10'
    highlight_event_id: guji-福康安-event-1
  - key: climax
    name: 会同萨载详勘
    labels:
      zh: 会勘核实
    start_date: '1783-06-20'
    highlight_event_id: guji-福康安-event-2
  - key: closure
    name: 据实具奏核销
    labels:
      zh: 据实奏销
    start_date: '1783-07-01'
    highlight_event_id: guji-福康安-event-2
  decisions:
  - date: '1783-06-04'
    title_zh: 带同司员驰驿赴鲁
    rationale: 钦奉谕旨会同萨载公干，带随带司员一并驰驿，以速勘验，不致拖延河帑之案
  - date: '1783-06-20'
    title_zh: 韩庄一带详悉履勘
    rationale: 黄运堤岸有在水底无从抢修之疑，必亲履韩庄湖河相连之地，分别应修与浮报，以定核减与交勘
- id: guji-福康安-endeavor-2
  title_zh: 前任四川总督经画川边屯务
  summary: 前任四川总督任内请设顺庆府分驻四合镇督捕同知并给关防，整饬川北捕务，兼理军需积存硫磺义谷之分贮支用
  phases:
  - key: brewing
    name: 督川察吏安民
    labels:
      zh: 总督四川
    start_date: '1778-01-01'
    highlight_event_id: guji-福康安-event-3
  - key: breakthrough
    name: 请设四合镇督捕同知
    labels:
      zh: 建官分驻
    start_date: '1782-01-01'
    highlight_event_id: guji-福康安-event-3
  - key: climax
    name: 铸给关防分驻缉捕
    labels:
      zh: 铸印分防
    start_date: '1783-06-06'
    highlight_event_id: guji-福康安-event-3
  - key: closure
    name: 交卸入京别膺钦差
    labels:
      zh: 交卸奉差
    start_date: '1783-06-04'
    highlight_event_id: guji-福康安-event-1
  decisions:
  - date: '1782-01-01'
    title_zh: 奏请分驻顺庆督捕同知
    rationale: 川北四合镇地冲事繁，原驻同知不足弹压，故请分驻专官以清盗源而重关防
  - date: '1783-06-04'
    title_zh: 交卸川务北上备差
    rationale: 川事粗定即遵旨北归，以备驰驿查河之用，不以封疆自重而辞劳怨
