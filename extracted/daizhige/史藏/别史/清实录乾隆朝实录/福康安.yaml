  decisions:
  - date: 1795-05-23
    title_zh: 分兵直捣巢穴聚族歼擒
    rationale: 贼匪交集一处并力抵御，正可聚而歼之，按名生致首恶，以儆顽梗而快人心
  - date: 1795-05-28
    title_zh: 开单奏叙出力将弁以示鼓励
    rationale: 侍卫章京汉屯将备不辞劳瘁勇争先，加等赏赉巴图鲁名号，方能鼓锐气而图大功
- id: guji-福康安-endeavor-2
  title_zh: 严防黔省后路兼筹贡使改道
  description: 恐穷蹙苗匪窜入黔省铜仁等处煽诱牵掣粮饷，饬令彭廷栋等严堵要隘，并筹缅甸南掌贡使改由川陕入京赴热河祝厘
  phases:
  - key: brewing
