endeavors:
- id: guji-福康安-endeavor-1
  person_qid: guji-福康安
  title_zh: 廓尔喀进剿与边镇调补
  description_zh: 自绒辖济咙分路进剿，攻克甲尔古拉集木集，奏调熟悉番情将领补松潘川北镇，议恤阵亡将士。
  phases:
  - key: brewing
    name: 驻军绒辖分路筹进
    labels:
      zh: 驻军筹边
    start_date: 1792-09-01
    highlight_event_id: guji-福康安-event-songpan
  - key: breakthrough
    name: 攻克甲尔古拉集木集
    labels:
      zh: 攻坚夺隘
    start_date: 1792-10-01
    highlight_event_id: guji-福康安-event-jiagu
  - key: climax
    name: 夺隘阵亡优恤定议
    labels:
      zh: 优恤励忠
    start_date: 1792-12-14
    highlight_event_id: guji-福康安-event-jiagu
  - key: closure
    name: 边镇得人凯旋有期
    labels:
      zh: 调镇安边
    start_date: 1792-12-20
    highlight_event_id: guji-福康安-event-zhashilunbu
  decisions:
  - date: 1792-12-14
    title_zh: 保举诸神保调补松潘镇彭承尧补川北镇
    rationale: 诸神保在川年久熟悉番情且带兵赴绒辖奋勉出力，彭承尧领土兵亦出力，边镇需得力之人弹压。
  - date: 1792-12-15
    title_zh: 奏请照例议恤台斐英阿等阵亡官兵
    rationale: 身临行阵夺隘攻坚冲锋中枪阵亡殊堪悯惜，宜分别照都统副都统例议恤以慰忠魂而励三军。
- id: guji-福康安-endeavor-2
  person_qid: guji-福康安
  title_zh: 藏务善后与振兴黄教
  description_zh: 抵前藏会商善后，定军需销算分界，暂缓商上分润，筹金奔巴瓶签掣章程，受降安藏。
  phases:
  - key: brewing
    name: 抵前藏会商善后
    labels:
      zh: 会商善后
    start_date: 1792-10-15
    highlight_event_id: guji-福康安-event-shanhou
  - key: breakthrough
    name: 定商上军需调剂之议
    labels:
      zh: 核实军需
    start_date: 1792-12-18
    highlight_event_id: guji-福康安-event-jinbenba
  - key: climax
    name: 筹金奔巴瓶签掣章程
    labels:
      zh: 革弊兴教
    start_date: 1792-12-22
    highlight_event_id: guji-福康安-event-jinbenba
  - key: closure
    name: 扎什伦布受降安藏
    labels:
      zh: 受降安藏
    start_date: 1792-12-26
    highlight_event_id: guji-福康安-event-zhashilunbu
  decisions:
  - date: 1792-12-22
    title_zh: 暂缓分给扎什伦布商上羡余于前藏番兵
    rationale: 商上经兵燹后回不如前元气未复，不必强其分给，彼一时此一时，俟恢复再行调剂。
  - date: 1792-12-24
    title_zh: 请先以金奔巴瓶于寻常呼毕勒罕试行签掣
    rationale: 不必俟大呼图克图转世方用，先行签掣数次定为章程，使僧俗共奉，革除私相传袭积弊。
events:
- id: guji-福康安-event-birth
  person_qid: guji-福康安
  title_zh: 生于京师勋戚之家
  date: 1753
  year_of: 1753
  place_zh: 京师
  description_zh: 乾隆十八年生，孝贤皇后侄，富察氏，少以勋戚子弟入侍卫，洊擢将军总督。
- id: guji-福康安-event-songpan
  person_qid: guji-福康安
  title_zh: 奏调诸神保彭承尧补松潘川北镇
  date: 1792-12-14
  year_of: 1792
  place_zh: 廓尔喀境内济咙军营
  description_zh: 张芝元触瘴病故于济咙，所遗松潘镇请以诸神保调补，以彭承尧补川北镇，朱射斗留川候补。
- id: guji-福康安-event-jiagu
  person_qid: guji-福康安
  title_zh: 进攻甲尔古拉集木集议恤阵亡
  date: 1792-12-15
  year_of: 1792
  place_zh: 甲尔古拉集木集
  description_zh: 前此进攻甲尔古拉集木集，台斐英阿阿满泰英贵棍德依中枪身故，奏请照都统副都统例分别议恤。
- id: guji-福康安-event-shanhou
  person_qid: guji-福康安
  title_zh: 会商藏务善后与军需销算
  date: 1792-12-20
  year_of: 1792
  place_zh: 前藏
  description_zh: 十月中旬抵前藏，与孙士毅惠龄和琳商办善后，定察木多以西三人会核以东二人会办，和琳兼办报销就近查察藏务。
- id: guji-福康安-event-jinbenba
  person_qid: guji-福康安
  title_zh: 筹定金奔巴瓶签掣章程
  date: 1792-12-22
  year_of: 1792
  place_zh: 前后藏
  description_zh: 请颁金奔巴瓶不必待大呼图克图转世，先于寻常呼毕勒罕试行签掣数次定为章程，兼管萨嘉焚修及达赖亲族管事严禁滋弊。
- id: guji-福康安-event-zhashilunbu
  person_qid: guji-福康安
  title_zh: 扎什伦布受降班禅谢恩
  date: 1792-12-26
  year_of: 1792
  place_zh: 扎什伦布
  description_zh: 珠尔杭阿领廓尔喀头人噶箕第乌达特塔巴等于九月二十日至扎什伦布谢罪，班禅谕以永矢恭顺，专差进表贡谢恩。
- id: guji-福康安-event-death
  person_qid: guji-福康安
  title_zh: 病故于军中
  date: 1796-07-02
  year_of: 1796
  place_zh: 军中
  description_zh: 嘉庆元年五月二十八日以征苗劳瘁病故于军中，追封嘉勇郡王，谥文襄，入祀贤良祠。
