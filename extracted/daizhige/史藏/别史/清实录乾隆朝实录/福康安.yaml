  dilemmas:
  - 洋面辽阔而兵船迟缓，如何以民船之捷补战船之拙
  - 沿海贫民生计无着而易为盗援，如何清查窝留又不致扰民失所
  lesson: 海疆肃清在整饬章程与体恤生民并行，兵民相维方能久安
  summary_first_person: 吾出自勋戚，久任封疆，督两广而兼理海防，奏捕盗章程以清洋面，报耆年旌表以彰仁化，但愿海隅不惊，民生乐业，以副君恩
