    start_date: 1791-06-10
    highlight_event_id: guji-福康安-event-3
  - key: breakthrough
    name: 阮光平派吴文楚为水军都督分布巡缉
    labels:
      zh: 恭顺调度
    start_date: 1791-06-20
    highlight_event_id: guji-福康安-event-3
  - key: climax
    name: 短棉农耐地名查无婉词嘉奖
    labels:
      zh: 体恤外藩
    start_date: 1791-07-08
    highlight_event_id: guji-福康安-event-3
  - key: closure
    name: 专饬内地根拏不再令安南协捕
    labels:
      zh: 内外有别
    start_date: 1791-07-09
    highlight_event_id: guji-福康安-event-4
  decisions:
  - date: 1791-07-08
    title_zh: 嘉奖阮光平吴文楚不责短棉农耐无获
    rationale: 外洋岛屿地名渺茫，又系阮岳所管呼应难灵，不可以内地挨查之法苛求
  - date: 1791-07-09
    title_zh: 未获何起文等专责内地文武根拏
    rationale: 抚驭外藩当得体，内地十六名夥盗及孙维斌另案只须严饬内地务获
