    start_date: 1788-01-09
    highlight_event_id: guji-福康安-event-report-chai
  - key: climax
    name: 圣训令坦怀略短取长
    labels:
      zh:
      - 奉谕持平
    start_date: 1788-01-12
    highlight_event_id: guji-福康安-event-report-chai
  - key: closure
    name: 拣员补镇协办善后
    labels:
      zh:
      - 拣补整顿
    start_date: 1788-01-15
    highlight_event_id: guji-福康安-event-douliumen
  decisions:
  - date: 1788-01-09
    title_zh: 直揭柴蔡虚报之短
    rationale: 柴大纪报枋车炮击与油籸充食多饰词，蔡攀龙无打通道路实绩，为肃军实不得不据实奏闻
  - date: 1788-01-12
    title_zh: 奉谕后外示优容共事
    rationale: 圣谕以柴蔡困守半载有功不可泯，且统辖水陆呼应攸关，须坦怀相待不露词色以全大功
