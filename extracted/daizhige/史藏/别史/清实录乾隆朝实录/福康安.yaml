    name: 严缉西洋李姓并筹藩库
    labels:
      zh: 缉传教内应核库银足敷
    start_date: 1784-09-05
    highlight_event_id: guji-福康安-event-5
  decisions:
  - date: 1784-09-01
    title_zh: 公正复查马家河不回护前奏
    rationale: 高宗以回民守堡三日拒捕事关赵继鼎生死出入故须据实详查曾否帮贼拒捕不可轻信胁从之供
