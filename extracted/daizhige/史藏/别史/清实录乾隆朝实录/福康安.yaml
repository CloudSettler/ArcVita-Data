  - key: breakthrough
    name: 两路会合直趋县城
    labels:
      zh:
      - 长驱救援
    start_date: 1787-12-15
    highlight_event_id: guji-福康安-event-rescue-jiayi
  - key: climax
    name: 进抵县城追杀夺车
    labels:
      zh:
      - 解围破贼
    start_date: 1788-01-08
    highlight_event_id: guji-福康安-event-rescue-jiayi
  - key: closure
    name: 会合固守转入进剿
    labels:
      zh:
      - 围解转剿
    start_date: 1788-01-10
    highlight_event_id: guji-福康安-event-douliumen
  decisions:
  - date: 1788-01-08
    title_zh: 不株守盐水港速进嘉义
    rationale: 鉴于普吉保恒瑞观望不进致县城粮尽危急，须统满汉精锐速进，直捣贼巢以解围
  - date: 1788-01-10
    title_zh: 乘胜趋斗六门要隘
    rationale: 斗六门为南北要隘久为贼占，围解之后须乘胜攻其外围中林大埔尾诸庄以开南北通道
- id: guji-福康安-endeavor-2
  person_qid: guji-福康安
  title_zh: 查奏柴蔡功过整顿台营
  summary: 就柴大纪蔡攀龙守城打仗情形据实查询入告，拣选军营出力副将补汀州镇，协调水陆提镇以备善后
  phases:
