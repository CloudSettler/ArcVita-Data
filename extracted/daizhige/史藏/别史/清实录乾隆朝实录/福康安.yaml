  - date: 1796-01-07
    title_zh: 请以臬司进补藩司
    rationale: 川省转运紧要，非得力大员表率全省不可
events:
- id: guji-福康安-event-birth
  date: 1754-01-01
  year_of: 1754
  title_zh: 生于富察氏勋门
  description_zh: 乾隆十九年生，大学士傅恒子，袭三等嘉勇男，授御前侍卫，历任要职。
- id: guji-福康安-event-baomu-linjun
  date: 1796-01-07
  year_of: 1796
  title_zh: 保奏林俊补授四川布政使
  description_zh: 丁酉谕，林俊在川省秀山筹办苗匪军粮井井有条，福康安和琳以勤能得力专摺保奏，加恩补授四川布政使，杨揆补授四川按察使。
- id: guji-福康安-event-gaodou-attack
  date: 1796-01-19
  year_of: 1796
  title_zh: 抢占高斗山梁擒斩贼目
  description_zh: 乙巳谕，福康安和琳于积雪未化时分路进攻抢占高斗山梁，扑入苗寨纵火焚烧，擒获廖老慕陇老西正法，深可嘉尚。
- id: guji-福康安-event-death
  date: 1796-06-13
  year_of: 1796
  title_zh: 军中病逝于苗疆
  description_zh: 嘉庆元年五月初八病逝于军营，追封嘉勇郡王，谥文襄，配享太庙。
