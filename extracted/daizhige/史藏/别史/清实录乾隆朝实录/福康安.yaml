  dilemmas:
  - 受重恩当秉公履勘与旧僚情面之间的两难
  - 河工岁抢虚实难辨与仓促定谳易误国计之间的权衡
  lesson: 受恩愈重愈当以实勘报国，不徇情面，不饰浮费，方全干臣之节
  summary_first_person: 吾以世家子蒙恩擢用，督川抚边之后，復奉命驰驿东省，会勘黄运岁抢之工，惟以踏勘得实、核帑归真为念，不敢以恩私废公义
