events:
- id: guji-福康安-event-birth
  title_zh: 出生于满洲镶黄旗富察氏家
  date: 1754
  year_of: 1754
  description: 乾隆十九年生长于京师大学士傅恒家为其侄后袭云骑尉世职
- id: guji-福康安-event-1792-yangbu
  title_zh: 克复藏界直抵阳布廓尔喀乞降
  date: 1792-10-01
  year_of: 1792
  description: 统兵逾大雪山连克济咙聂拉木等直压阳布廓尔喀悔罪请降诏许纳贡罢兵
- id: guji-福康安-event-1793-pileng
  title_zh: 奏报披楞恭顺不助廓尔喀
  date: 1793-04-22
  year_of: 1793
  description: 乾隆五十八年三月奏称前檄披楞协剿今接回禀称却廓尔喀求救并戒令与唐古忒修好极为恭顺请无庸差人前来
- id: guji-福康安-event-1793-gongxiang
  title_zh: 奏廓尔喀贡象马绕道前藏餧养
  date: 1793-04-20
  year_of: 1793
  description: 奏称廓尔喀进贡象马因哲孟雄道险绕由巴尔底萨杂哩部落行走布鲁克巴等护送供支请暂留前藏俟四月冰融由青海西宁进口
- id: guji-福康安-event-1793-shangtun
  title_zh: 奏请赏彻回屯练降番
  date: 1793-04-15
  year_of: 1793
  description: 上年进剿所调屯练降番冒险攻碉俱已彻回归屯奉旨每名各赏银三两以示格外施恩
- id: guji-福康安-event-death
  title_zh: 病卒于军中追封嘉勇郡王
  date: 1793-07-02
  year_of: 1793
  description: 乾隆五十八年五月十二因劳瘁病卒于征苗凯旋途次追封郡王谥文襄配享太庙
