  description: 乾隆十九年生于富察氏家，大学士傅恒之子，孝贤皇后侄，自幼蒙恩养宫中
- id: guji-福康安-event-1
  type: endeavor
  date: '1783-06-04'
  year_of: 1783
  title_zh: 派赴山东会同萨载查河
  description: 乾隆四十八年六月丙子谕派工部尚书福康安驰驿前往东省，会同萨载查勘何裕城题销黄运两河岁抢修工程，随带司员一并驰驿
- id: guji-福康安-event-2
  type: endeavor
  date: '1783-06-08'
  year_of: 1783
  title_zh: 工部驳议与加派履勘核销
  description: 工部议驳河东总河何裕城所销乾隆四十七年工程浮多，复谕萨载带印由江赴山东韩庄一带俟福康安到日会同详悉履勘据实具奏，并及江南李奉翰淮徐抢修一并详核
- id: guji-福康安-event-3
  type: endeavor
