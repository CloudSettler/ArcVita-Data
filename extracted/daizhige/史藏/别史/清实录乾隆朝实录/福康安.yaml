events:
- id: guji-福康安-event-birth
  date: 1754-01-01
  year_of: 1754
  title_zh: 生于京师富察氏家
  description: 乾隆十九年生大学士傅恒子少袭云骑尉累擢至领侍卫内大臣
- id: guji-福康安-event-1
  date: 1792-12-10
  year_of: 1792
  title_zh: 奏定唐古忒番兵三千章程
  description: 请前后藏各设兵一千定日江孜各五百设戴绷如绷甲绷定绷递管给青稞口粮免徭役授军器火药
- id: guji-福康安-event-2
  date: 1792-12-12
  year_of: 1792
  title_zh: 奏请江孜定日添汛鼓铸银钱
  description: 请江孜设守备外委带兵二十名定日设守备把总外委带兵四十名并由商上鼓铸一钱五分一钱五分重宝藏银钱
- id: guji-福康安-event-3
  date: 1792-12-15
  year_of: 1792
  title_zh: 奏清查叛产归商上蠲免租赋
  description: 请查索诺木旺扎尔沙玛尔巴仲巴等田庄赀产归入达赖喇嘛商上充经费并免被扰边界租赋蠲全藏积欠
- id: guji-福康安-event-death
  date: 1796-07-02
  year_of: 1796
  title_zh: 卒于征苗军中
  description: 乾隆六十一年征苗回师病卒于军谥文襄追封嘉勇郡王配享太庙
