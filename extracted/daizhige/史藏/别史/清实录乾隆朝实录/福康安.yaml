    title_zh: 首夥分别正法余犯押省审办
    rationale: 首恶拒捕戕官必正法以儆海疆，夥犯解省复审以成信谳
  - date: 1791-07-09
    title_zh: 查明缉获员弁开单咨部议叙
    rationale: 有功必赏方能鼓励文武认真躧缉不使一人漏网
- id: guji-福康安-endeavor-2
  title_zh: 照会安南协缉洋匪抚驭外藩
  summary: 咨会阮光平派吴文楚统率海艘协缉，婉词嘉奖恭顺，不以无据地名苛求
  phases:
  - key: brewing
