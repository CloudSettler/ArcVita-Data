events:
- id: guji-福康安-event-birth
  title_zh: 生于乾隆十九年
  date: '1754'
  year_of: 1754
  description: 富察氏生于京师后袭三等嘉勇侯成长于军功世家
- id: guji-福康安-event-miao1
  title_zh: 连克苏麻西梁大乌草河苗寨
  date: '1795-05-20'
  year_of: 1795
  description: 乾隆六十年五月与和琳分路进剿重山骤雨中连克大小苗寨六十余处木城四座石卡三十五处
- id: guji-福康安-event-miao2
  title_zh: 安插龙鼻嘴十二寨降众
  date: '1795-05-28'
  year_of: 1795
  description: 石兆元等携男妇五百余人诣营乞降饬妥为安插并随时防范优恤阵亡受伤将弁兵丁
- id: guji-福康安-event-junxu
  title_zh: 会奏请拨军需银百万两
  date: '1795-05-27'
  year_of: 1795
  description: 与贵州巡抚冯光熊奏黔省现存军需少不敷用恳于湖北江西近省拨银一百万两迅解黔备支得旨允行
- id: guji-福康安-event-mindian
  title_zh: 调任闽浙总督俟剿苗奏捷赴任
  date: '1795-05-29'
  year_of: 1795
  description: 因闽省仓库亏缺诸事废弛奉旨由钦差调任闽浙总督命魁伦姚棻先行查办俟苗疆奏捷即赴闽任
- id: guji-福康安-event-death
  title_zh: 卒于军中
  date: '1796-06-28'
  year_of: 1796
  description: 剿捕逆苗奏捷后未及赴闽病卒于军赐谥文襄追封嘉勇郡王
