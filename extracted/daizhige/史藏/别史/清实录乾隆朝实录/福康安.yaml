  decisions:
  - date: 1790-09-15
    title_zh: 不代奏非礼之求但联衔驳谕
    rationale: 若以无根之言遽索土地则两国纷争无底故以诏氏旧地相安年久为据严正抚驭
  - date: 1790-10-01
    title_zh: 托称札商意见相同以全属国之体
    rationale: 避免属国窥知奏闻候旨致失取信故云不敢上渎以剀切晓谕服其心
- id: guji-福康安-endeavor-2
  title_zh: 绥辑安南全黎氏骨肉以绝后患
  description_zh: 因黎维祁弃国入关眷属留滞安南恐人心藉以为名滋扰故经略阮光平令送黎氏亲属至镇南关以全两得
