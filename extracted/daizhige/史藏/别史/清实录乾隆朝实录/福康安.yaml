    title_zh: 请毁涠洲斜阳草寮递回原籍
    rationale: 孤岛荒地易为盗窟，烧寮递籍以绝勾通
  - date: 1789-08
    title_zh: 请渔船编列字号连环保结
    rationale: 以互保连坐之法使渔户互相稽察，不敢接济洋盗
  - date: 1789-08
    title_zh: 请留巡船熟手并改造船式
    rationale: 轮班更换则生手误事，战船笨重则追捕不及，故请留任并仿民船改造
