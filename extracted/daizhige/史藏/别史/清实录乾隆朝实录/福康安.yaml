    rationale: 报销未竣阮光显出关光平进京皆资经理抚臣不宜遽离
  - date: 1789-09-02
    title_zh: 若黎维祇穷蹙投内则与黎维祁一同收留安插
    rationale: 黎氏备列藩封百余年并无得罪天朝穷投当纳又不扶持复国以全大公
events:
- id: guji-福康安-event-birth
  date: 1754-01-01
  year_of: 1754
  title_zh: 出生
  description: 乾隆十九年生于满洲镶黄旗富察氏家
- id: guji-福康安-event-yanwu
  date: 1789-09-01
  year_of: 1789
  title_zh: 奏查禁私贩红盐请拨纲本买运
  description: 陈粤东煎晒盐觔商力疲不能及时收买请动纲本银十万两令局商赴场赶紧买运并严禁夹带透漏
- id: guji-福康安-event-jisi
  date: 1789-09-02
  year_of: 1789
  title_zh: 奉谕尽收电茂等场盐并严缉楚粤接壤
  description: 得旨电茂博茂等出盐最旺之场尽数收买使场丁随煎获利不流为盗并于水陆及沿海楚省接壤一体缉私
- id: guji-福康安-event-liusun
  date: 1789-09-03
  year_of: 1789
  title_zh: 奏请孙永清暂缓陛见留粤经理
  description: 以报销军需款项料理阮光显出关及豫备明春阮光平进京俱资经理奏准俟照料出关后再启程陛见
- id: guji-福康安-event-annan
  date: 1789-09-04
  year_of: 1789
  title_zh: 奏报黎维祇潜匿保乐纠兵被剿
  description: 报黎维祁弟黎维祇潜匿保乐与黄文熥纠聚攻打牧马被阮光平手下杀败并陈将来穷投则收留安插之宜
- id: guji-福康安-event-death
  date: 1796-01-01
  year_of: 1796
  title_zh: 逝世
  description: 嘉庆元年征苗军中病逝
