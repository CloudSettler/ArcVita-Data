endeavors:
- id: guji-福康安-endeavor-1
  person_qid: guji-福康安
  title_zh: 统兵渡台速进解嘉义之围
  summary: 统领巴图鲁侍卫章京及绿营兵由鹿仔港进兵，会合南北两路，直抵嘉义县城，追杀贼匪，夺获攻城大车，解半年之围
  phases:
  - key: brewing
    name: 受命调兵筹饷渡海
