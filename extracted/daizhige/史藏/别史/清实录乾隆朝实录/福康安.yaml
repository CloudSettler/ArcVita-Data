  decisions:
  - date: 1790-10-06
    title_zh: 令阮光平送黎氏妻妾弟妹并可疑旧臣出关
    rationale: 既全黎氏骨肉团聚又使反侧之辈无从藉名滋事为阮氏计亦万全之策
  - date: 1790-10-06
    title_zh: 附赐蜜饯果乾示家人父子之恩
    rationale: 国王进京祝嘏备荷殊施当以优眷坚其向化而不必具表谢恩以简途次
