  dilemmas:
  - 云南钱贱银少而鼓铸当停当调之两难
  - 藩邦恭顺稠叠往来而裁抑酬答以存大体之两难
  lesson: 治钱贵在流通得平，抚藩贵在得体省繁，任事当察本源而守大体
  summary_first_person: 吾起自勋戚，历任封疆，督滇黔川粤诸省，抵滇则察官铸成色以筹银钱调剂，接安南则鉴恭顺悃忱以省往返繁文，惟愿钱流边安，不负委任
