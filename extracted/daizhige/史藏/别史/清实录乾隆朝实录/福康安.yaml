  - 屡立大功受殊恩优渥之时如何守廉慎以全终始
  - 远征绝域体恤屯番士卒与维护军纪国体之间如何兼顾
  lesson: 位极人臣更当慎微，私托营利虽小必损大节，唯以公忠体国方能仰答殊恩
  summary_first_person: 我是福康安，傅恒子，幼蒙圣恩豢养，屡奉命征剿，平定台湾生擒林爽文庄大田，封一等忠锐嘉勇公，复经略安南招抚阮惠，乾隆五十四年因托李天培购办桅木一事上烦圣虑，蒙曲全成全，愧悚交并，唯誓以廉勤自励效力疆场以赎前愆
  source_urls:
