  year_of: 1783
  title_zh: 前请铸给顺庆督捕同知关防得旨允行
  description: 以前任四川总督福康安请，铸给四川顺庆府分驻四合镇督捕同知关防，以专驻防缉捕之责
- id: guji-福康安-event-death
  type: death
  date: '1796-05-27'
  year_of: 1796
  title_zh: 病卒于军中
  description: 嘉庆元年征苗凯旋途中病卒，谥文襄，追封嘉勇郡王，配享太庙
