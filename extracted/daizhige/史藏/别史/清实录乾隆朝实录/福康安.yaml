    start_date: 1792-03-31
    highlight_event_id: guji-福康安-event-3
  decisions:
  - date: 1792-03-31
    title_zh: 收缴达赖喇嘛库火药铅子炮位马匹
    rationale: 行兵要用就近取资，济咙呼图克图等奋勉交出宜分别赏赉并酌给价值以示体恤
  - date: 1792-03-30
    title_zh: 请将保泰再责四十板另制重枷枷号
    rationale: 保泰雅满泰早闻许银说合且见贼禀提及竟徇隐不奏厥罪维均须重惩炯戒
events:
- id: guji-福康安-event-birth
  title_zh: 出生
  date: 1754-01-01
  year_of: 1754
  description: 乾隆十九年生于富察氏家，大学士傅恒之子，后袭爵成长于军功勋戚之家。
- id: guji-福康安-event-2
  title_zh: 檄令布鲁克巴等部落攻贼并奖赏收复哲孟雄番众
  date: 1792-03-30
  year_of: 1792
  description: 乾隆五十七年三月初九日奏称檄令附近廓尔喀之布鲁克巴作木朗披楞三部落发兵攻贼，又帕克哩边外哲孟雄宗木等部落与廓尔喀打仗奋回远年被占之地，俱加奖赏并请再行赏赉。
- id: guji-福康安-event-3
  title_zh: 到藏采办火药铅丸收缴布达拉炮位马匹
  date: 1792-03-31
  year_of: 1792
  description: 乾隆五十七年三月初十日奏到藏采办火药铅丸，据济咙呼图克图及扎萨克堪布噶布伦等交出布达拉现存火药二千四百余斤铅子二万八千斤大小炮三十余位及健壮马一百匹先送军营，奉旨查明酌给价值赏赉缎疋。
- id: guji-福康安-event-4
  title_zh: 审讯保泰许银说合徇隐请重责枷号
  date: 1792-03-30
  year_of: 1792
  description: 乾隆五十七年三月初九日讯问保泰供称许银说合之事到藏时原有所闻，与贼禀相符而保泰雅满泰徇隐不奏，奏请将保泰再重责四十板另制重枷枷号，雅满泰照例枷责，并改保泰名为俘习浑以避裕亲王讳。
- id: guji-福康安-event-death
  title_zh: 病逝军中
  date: 1796-07-02
  year_of: 1796
  description: 嘉庆元年五月征剿苗疆时病逝于军中，追封嘉勇郡王，谥文襄，入祀昭忠祠贤良祠。
