    rationale: 因马见几先投后遣家属密禀贼谋黑夜潜逃故先为预备以期按名生擒不使漏网
  - date: 1784-08-15
    title_zh: 会参赵继鼎滥杀请革职发伊犁
    rationale: 见洮岷协副将不问是贼与否遇回即戮致死二百余人故据实参奏以明军纪慎刑杀
- id: guji-福康安-endeavor-2
