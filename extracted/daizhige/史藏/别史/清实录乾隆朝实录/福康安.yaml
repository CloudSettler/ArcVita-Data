  dilemmas:
  - 台湾初定之后以威服为重还是以抚恤整顿为重
  - 闽省久晴待泽之时以上奏待命为安还是以开仓平粜为急
  lesson: 威既立则当以安民养民收功不可徒恃声威而忽于仓廪吏治之实政
  summary_first_person: 我自台湾戡定而还受命督闽与徐嗣曾同心整顿营伍仓库察访闾阎疾苦遇冬晴麦艰即率属祈祷筹议平粜惟愿海疆永靖民食有资以副圣主委任之重
