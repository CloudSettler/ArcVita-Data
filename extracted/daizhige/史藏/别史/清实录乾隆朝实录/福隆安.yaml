  birth_date: 1746-01-01
  death_date: 1784-04-01
  era: 清乾隆朝
  reign_ref: 乾隆四十八年十一月
  archetype: 勋戚宽纵型大臣
  dilemmas:
  - 家人倚势逞凶而病弱失察，何以齐家以免累公
  - 堂司瞻徇故旧而不加驳诘，何以正法以免枉纵
  lesson: 治家不严必致殃及公事，执法稍存瞻顾即成枉纵，勋戚愈当自畏自省。
  summary_first_person: 我为傅恒次子，承恩柄用，署理步军统领，方谓门户可保。不料管事家人富礼善主使责打夫役张二致死，赵文达挺身顶凶，刑部堂司瞻我情面，朦胧定案，几至误杀无辜。幸朝审时阿桂疑而复讯，水落石出，方免枉纵。我虽病中不知情，亦以平素恃恩致人畏罪，罚俸革留，予假调理，愧悔交并。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71193.html
endeavors:
- id: guji-福隆安-endeavor-1
  title_zh: 署步军统领任内家奴殴命顶凶
  summary_zh: 署理步军统领期间，家人富礼善喝打夫役张二致死，移送刑部初供尚存其名，定案时赵文达直认顶凶，匠役附和，堂司不加严诘，酿成枉纵之错。
  phases:
  - key: brewing
    name: 家奴逞凶移送
    labels:
      zh:
      - 勋戚家法松弛
      - 步军统领移送
    start_date: 1783-01-01
    highlight_event_id: guji-福隆安-event-ouming
  - key: breakthrough
    name: 顶凶朦胧定案
    labels:
      zh:
      - 顶凶直认
      - 刑部瞻徇
    start_date: 1783-10-01
    highlight_event_id: guji-福隆安-event-dingan
  - key: climax
    name: 朝审疑窦复讯
    labels:
      zh:
      - 朝审勾到生疑
      - 研鞫得实
    start_date: 1783-12-10
    highlight_event_id: guji-福隆安-event-fushen
  decisions:
  - date: 1783-01-01
    title_zh: 原咨移送刑部未加约束
    rationale: 初供已载富礼善喝打，而病后疏于管束，未能揭明主使，致家人得以瞒哄脱身。
  - date: 1783-10-01
    title_zh: 听任改供不加驳正
    rationale: 赵文达改称卸罪谎供后未加深求，纵容司官取巧，终致富礼善之名见删于招册。
- id: guji-福隆安-endeavor-2
  title_zh: 病中被参罚俸革留予假
  summary_zh: 案情究明后以平素恃恩致人畏罪被罚公俸十年，后改为革职留任，复以病体未愈予假调理，和珅充文渊阁提举阁事，门户声势顿衰。
  phases:
  - key: climax
    name: 明谕切责罚俸
    labels:
      zh:
      - 明降谕旨示惩
      - 罚俸十年
    start_date: 1783-12-12
    highlight_event_id: guji-福隆安-event-fafeng
  - key: closure
    name: 革留予假调理
    labels:
      zh:
      - 革职留任
      - 予假调理
    start_date: 1783-12-16
    highlight_event_id: guji-福隆安-event-geliu
  decisions:
  - date: 1783-12-12
    title_zh: 俯首认过不辩不知情
    rationale: 虽实被家人瞒哄无见闻，然刑部瞻徇即由平素恃恩所致，惟有认咎以谢朝廷。
  - date: 1783-12-16
    title_zh: 病中请假静养避位
    rationale: 气力不能支持，精神虚弱，不敢恋栈妨务，惟冀调理少全晚节。
events:
- id: guji-福隆安-event-birth
  title_zh: 生于勋戚富察氏家
  date: 1746-01-01
  year_of: 1746
  place_zh: 京师
  description_zh: 傅恒次子，承勋戚余荫入仕，洊至御前大臣，署理步军统领。
- id: guji-福隆安-event-ouming
  title_zh: 家人富礼善主使殴死夫役张二
  date: 1783-01-01
  year_of: 1783
  place_zh: 京师步军统领衙门
  description_zh: 管事家人富礼善主使责打夫役张二身死，步军统领衙门初供载有富礼善喝打之语并移送刑部。
- id: guji-福隆安-event-dingan
  title_zh: 赵文达顶凶刑部朦胧定案
  date: 1783-10-01
  year_of: 1783
  place_zh: 刑部
  description_zh: 赵文达挺身直认，匠役随同指证，司官不加严诘，堂官瞻顾福隆安，招册删去富礼善之名定案。
- id: guji-福隆安-event-fushen
  title_zh: 朝审复讯究出顶凶实情
  date: 1783-12-10
  year_of: 1783
  place_zh: 京师
  description_zh: 乾隆四十八年十一月丙午至庚戌，阿桂奏疑，派阿桂和珅福康安刘墉会同刑部覆讯，研鞫再三究明富礼善主使，赵文达听从动手属实。
- id: guji-福隆安-event-fafeng
  title_zh: 被罚公俸交部议处
  date: 1783-12-12
  year_of: 1783
  place_zh: 京师
  description_zh: 以平素恃恩致人畏罪被罚公俸十年，仍交部严加议处，并明谕中外刑部堂司瞻徇之咎。
- id: guji-福隆安-event-geliu
  title_zh: 改为革职留任予假调理
  date: 1783-12-16
  year_of: 1783
  place_zh: 京师
  description_zh: 加恩改罚俸为革职留任，复以病体未愈予假调理，和珅以原衔充文渊阁提举阁事。
- id: guji-福隆安-event-death
  title_zh: 病卒于京师
  date: 1784-04-01
  year_of: 1784
  place_zh: 京师
  description_zh: 乾隆四十九年三月病卒，勋戚一生以家奴一案声名大损而终。
