endeavors:
- id: guji-秦承恩-endeavor-1
  title_zh: 署理陕西巡抚经略兴安巡防与军需转饷
  summary: 在陕年久熟悉地方情形与军需总理兴安一带巡防当川楚教匪未靖之时保供亿无缺
  phases:
  - key: brewing
    name: 久任陕西熟悉地方军需
    labels:
      zh:
      - 地方治理
    start_date: 1796-01-01
    highlight_event_id: guji-秦承恩-event-1
  - key: climax
    name: 兴安巡防军务紧要
    labels:
      zh:
      - 军务巡防
    start_date: 1798-01-01
    highlight_event_id: guji-秦承恩-event-2
  - key: closure
    name: 未便易生手暂留陕抚
    labels:
      zh:
      - 留任责成
    start_date: 1798-02-11
    highlight_event_id: guji-秦承恩-event-2
  decisions:
  - date: 1798-02-11
    title_zh: 坚持兴安一带亲往巡防不遽易生手
    rationale: 陕地情形军需头绪惟久任者能悉若遽易新人必误军行故以熟悉者专任
  - date: 1798-02-11
    title_zh: 以军需供亿皆由内帑为念撙节爱养
    rationale: 川楚军务方殷善后抚恤仍须转饷当体恤国用不累闾阎
- id: guji-秦承恩-endeavor-2
  title_zh: 丁母忧墨绖从戎在任守制
  summary: 例应离任守制因军务非常奉旨留署陕抚素服视事寓中持服典礼用吉服者不与
  phases:
  - key: brewing
    name: 丁内艰例应回籍成服
    labels:
      zh:
      - 丁忧守制
    start_date: 1798-02-01
    highlight_event_id: guji-秦承恩-event-2
  - key: breakthrough
    name: 奉旨墨绖从戎留署
    labels:
      zh:
      - 夺情留任
    start_date: 1798-02-11
    highlight_event_id: guji-秦承恩-event-2
  - key: closure
    name: 素服视事寓中持服停擢直隶
    labels:
      zh:
      - 公私两尽
    start_date: 1798-02-11
    highlight_event_id: guji-秦承恩-event-2
  decisions:
  - date: 1798-02-11
    title_zh: 遵旨留署陕西在任守制
    rationale: 古有墨绖从戎之例守礼者亦不敢以私废公军务非常例可拘故权宜留任
  - date: 1798-02-11
    title_zh: 安于陕抚不求调任升擢直隶
    rationale: 留任出于地方军务需人若调任他省尚不可行岂宜再加升擢故止留陕西以全进退
