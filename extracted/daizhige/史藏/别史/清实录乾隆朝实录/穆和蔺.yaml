  lesson: 封疆须先察吏，於邪教萌蘖即严密访缉，不可姑容庸闇以致要犯脱逃自罹重典
  summary_first_person: 吾抚豫无状，於刘松刘之协倡教不能先期访拏，又以扶沟令刘清鼐庸闇姑容在任，致关提要犯乘间脱逃，终被革职发往乌鲁木齐效力，此皆平日废弛所致，愧负圣恩
