    rationale: 于额琳沁归顺徘徊之际既不善加抚驭令为前驱又不速行剿取其牲只以资前进致人众四散仅得老惫一人
events:
- id: guji-策楞-event-birth
  title_zh: 策楞出生
  date: 1695-01-01
  year_of: 1695
  kind: birth
  description: 喀尔喀蒙古出身康熙末年左右生后历任将军
- id: guji-策楞-event-xuanbu
  title_zh: 拣选扎尔呼齐
  date: 1756-07-09
  year_of: 1756
  kind: career
  description: 乾隆二十一年六月初三与同官拣选堪补扎尔呼齐之宰桑达什车凌巴桑图布慎等开列请旨得授
- id: guji-策楞-event-yili
  title_zh: 留镇伊犁办事
  date: 1756-07-15
  year_of: 1756
  kind: career
  description: 平定伊犁后奉命镇守其地安插厄鲁特降众筹办粮运牲只
- id: guji-策楞-event-anzha
  title_zh: 奏授特楞古特宰桑
  date: 1756-07-15
  year_of: 1756
  kind: career
  description: 以原任定西将军奏请授达瓦固英哈什哈等为特楞古特宰桑羁縻新附
- id: guji-策楞-event-zhuijiao
  title_zh: 追剿阿睦尔撒纳失机
  date: 1756-07-16
  year_of: 1756
  kind: career
  description: 阿睦尔撒纳被哈萨克抢掠仅带二三人逃窜官军已抵哈萨克疆界而策楞逡巡不前坐失擒获之机
- id: guji-策楞-event-elinqin
  title_zh: 办理额琳沁乖谬
  date: 1756-07-17
  year_of: 1756
  kind: career
  description: 额琳沁挺身前赴军营本有归顺之意不善抚驭令为前驱又不速取其辎重牲只任其疑畏四散仅得老惫病毙无济于事
- id: guji-策楞-event-geerban
  title_zh: 办理古尔班和卓纵寇
  date: 1756-07-17
  year_of: 1756
  kind: career
  description: 办理古尔班和卓仅得其牲只老弱渠魁仍复窜逸与巴禄星驰擒获阿巴噶斯之奋勇形成对比
- id: guji-策楞-event-huishou
  title_zh: 奉命不进哈萨克回伊犁
  date: 1756-07-16
  year_of: 1756
  kind: career
  description: 奉谕令不必进兵哈萨克即回伊犁办事恐其获罪难逭仍行前进另谕达勒当阿取其将军印信
- id: guji-策楞-event-nawen
  title_zh: 种种贻误革职拿解
  date: 1756-07-17
  year_of: 1756
  kind: career
  description: 以身任戎行种种乖谬贻误交副将军兆惠佩印并将策楞拿解来京治罪晓谕哈萨克头人
- id: guji-策楞-event-death
  title_zh: 策楞去世
  date: 1757-01-01
  year_of: 1757
  kind: death
  description: 拿解治罪后不久去世乾隆二十二年左右卒
