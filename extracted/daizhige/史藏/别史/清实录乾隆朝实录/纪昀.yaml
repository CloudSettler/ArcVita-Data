    highlight_event_id: guji-纪昀-event-1
  decisions:
  - date: 1791-08-11
    title_zh: 认咎详校失察
    rationale: 卷首空二行显而易见而未寓目，确系漫不经心，甘受议处以明职守
  - date: 1791-08-12
    title_zh: 请亲核补正御制文
    rationale: 御制扬雄法言未弁于卷首，须亲往补录以全敬慎之体
- id: guji-纪昀-endeavor-2
  title_zh: 巡核文渊文源文津三阁藏书
  description_zh: 带同详校各官抽查三阁全书，填补扬子法言空行并缮录御制文，遍检他书类此脱误
  phases:
  - key: brewing
    name: 奉旨复查北阁藏书
    labels:
      zh: 酝酿受命
    start_date: 1791-08-11
    highlight_event_id: guji-纪昀-event-2
  - key: breakthrough
    name: 抽阅法言核对次卷
    labels:
      zh: 查缺突破
    start_date: 1791-08-12
    highlight_event_id: guji-纪昀-event-2
  - key: climax
    name: 缮写讹错不一而足再被严谴
    labels:
      zh: 再谴高峰
    start_date: 1791-08-16
    highlight_event_id: guji-纪昀-event-2
  - key: closure
    name: 亲赴二阁抽查填改
    labels:
      zh: 填补收束
    start_date: 1791-08-17
    highlight_event_id: guji-纪昀-event-2
  decisions:
  - date: 1791-08-16
    title_zh: 再认虚应故事之咎
    rationale: 余书恐多类此错误，前次核勘全未寓目，唯有悉心详检以赎前愆
  - date: 1791-08-17
    title_zh: 带员抽阅一体填改
    rationale: 若再不详检经上看出必加倍治罪，当亲检卷首及他书以防再误
events:
- id: guji-纪昀-event-birth
  date: 1724-07-26
  year_of: 1724
  title_zh: 纪昀生于直隶献县
  description_zh: 雍正二年六月十五生于献县崔尔庄纪氏宦学之家，少敏而博览
- id: guji-纪昀-event-1
  date: 1791-08-11
  year_of: 1791
  title_zh: 文津阁法言脱二行初交部议处
  description_zh: 高宗偶阅文津阁四库全书扬子法言卷一首篇空白二行，系脱晋唐及宋人注释名氏，又未补录御制文，谕将纪昀及详校官庄通敏交部分别议处，并命军机大臣填补缮录
- id: guji-纪昀-event-2
  date: 1791-08-16
  year_of: 1791
  title_zh: 讹错众多再交部议处并命亲核三阁
  description_zh: 军机大臣详阅法言一书缮写讹错不一而足，高宗以从前核勘虚应故事，谕纪昀庄通敏再交部议处，命纪昀亲赴文渊文源二阁检出此书冠御制文于简端，带员抽查卷首及他书一体填改，否则加倍治罪
- id: guji-纪昀-event-death
  date: 1805-03-14
  year_of: 1805
  title_zh: 纪昀卒于京师
  description_zh: 嘉庆十年二月十四卒于京师，谥文达，遗阅微草堂笔记等行世
