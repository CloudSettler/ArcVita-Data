  - date: 1777-05-08
    title_zh: 安于纂修不干外转
    rationale: 知遇在文字，守馆阁以竟全书之功。
events:
- id: guji-纪昀-event-birth
  type: birth
  title_zh: 生于直隶献县
  date: 1724-07-26
  year_of: 1724
  description: 雍正二年六月十五生于直隶献县纪氏宦学之家。
- id: guji-纪昀-event-siku
  type: career
  title_zh: 四库馆进呈经义考钞本奉御制题诗
  date: 1777-05-14
  year_of: 1777
  description: 四库馆钞本朱彝尊经义考进呈，上亲制诗题识卷首，谕询浙江藏板之家添冠刊刻，阐崇经学。
- id: guji-纪昀-event-jiaokan
  type: career
  title_zh: 总核书籍讹错议处加意校勘
  date: 1777-05-10
  year_of: 1777
  description: 军机大臣奏正月至三月办书错误，总裁纂修覆校分校分别察议，饬嗣后悉心校阅，发还各省进书原本。
- id: guji-纪昀-event-jingcha
  type: career
  title_zh: 京察验看准列一等
  date: 1777-05-08
  year_of: 1777
  description: 吏部带领京堂引见，陈孝泳江兰褚廷璋陆锡熊德昌纪昀陆费墀准泰俱准一等，余者降调休致有差。
- id: guji-纪昀-event-death
  type: death
  title_zh: 卒于京师
  date: 1805-03-14
  year_of: 1805
  description: 嘉庆十年二月十四卒于京师，谥文达。
