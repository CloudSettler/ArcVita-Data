  lesson: 校书如治学须亲核卷首细处方能补脱正讹以臻完善
  summary_first_person: 我少习经史以文名进身，蒙高宗擢为四库全书总纂，昼夜校勘，终因文津阁扬子法言脱去注家名氏二行及缮写讹错屡见，未能亲加订正，两遭交部议处，此生愧于虚应故事之讥，愿后人以精诚补我之疏忽
