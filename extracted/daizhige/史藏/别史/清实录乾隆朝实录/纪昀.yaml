  dilemmas:
  - 以文章考据立身而处馆阁衡文之严当如何自守
  - 获罪遣戍西域而复起总纂大典当如何处宠辱进退
  lesson: 以实学养望以谨慎全身，荣辱不惊而终以文业报国
  summary_first_person: 吾少治经史，登第入翰林，尝于乾隆二十三年大考列二等，候升馆阁，后虽获谴戍边，复起总纂四库，毕生以读书校书为事，不敢以才自矜，惟求无负所学
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70559.html
endeavors:
- id: guji-纪昀-endeavor-1
  title_zh: 翰林大考列二等候升
  summary_zh: 自乾隆十九年登进士入翰林，至乾隆二十三年正大光明殿试翰詹，列二等，奉旨遇缺题奏，开启馆阁迁转之途
  phases:
  - key: brewing
    name: 登第入馆积学养望
    labels:
      zh:
      - 进士及第
      - 翰林修撰
      - 校雠养望
    start_date: 1754-05-01
    highlight_event_id: guji-纪昀-event-jinshi
  - key: breakthrough
    name: 正大光明殿试列二等
    labels:
      zh:
      - 殿试衡文
      - 二等列名
    start_date: 1758-04-07
    highlight_event_id: guji-纪昀-event-kaohe1758
  - key: climax
    name: 奉旨遇缺题奏候升
    labels:
      zh:
      - 候升留记
      - 储才待用
    start_date: 1758-04-08
    highlight_event_id: guji-纪昀-event-kaohe1758
  - key: closure
    name: 馆阁累迁渐展文业
    labels:
      zh:
      - 侍读学士
      - 文翰进阶
    start_date: 1763-01-01
    highlight_event_id: guji-纪昀-event-shidu
  decisions:
  - date: 1758-04-07
    title_zh: 以平实经义应对大考
    rationale: 不务新奇险怪，以经史根柢见长，故得列二等而存厚重之名
  - date: 1758-04-08
    title_zh: 安于候升不亟躁进
    rationale: 既奉旨遇缺题奏，当静待馆阁缺出，以学行服众，不营竞奔走
- id: guji-纪昀-endeavor-2
  title_zh: 遣戍乌鲁木齐复起总纂四库
  summary_zh: 以盐政漏言获罪遣戍乌鲁木齐，赦还后以学识复用，于乾隆三十八年任四库全书馆总纂，综理典籍，成就一代文治
  phases:
  - key: brewing
    name: 盐政案发遣戍边塞
    labels:
      zh:
      - 漏言获罪
      - 遣戍自省
    start_date: 1768-06-01
    highlight_event_id: guji-纪昀-event-xiyu
  - key: breakthrough
    name: 赦还内用重入文职
    labels:
      zh:
      - 赦回授官
      - 复起修书
    start_date: 1771-01-01
    highlight_event_id: guji-纪昀-event-huanhuan
  - key: climax
    name: 任四库馆总纂综理群书
    labels:
      zh:
      - 四库全书
      - 总纂校订
    start_date: 1773-02-01
    highlight_event_id: guji-纪昀-event-siku
  - key: closure
    name: 书成加官以文名终
    labels:
      zh:
      - 文渊阁直
      - 协办大学士
    start_date: 1787-01-01
    highlight_event_id: guji-纪昀-event-siku
  decisions:
  - date: 1768-06-01
    title_zh: 戍边绝意怨尤专事著述
    rationale: 既以言获罪，当闭门省愆，以读书纪闻自遣，不生怨望以全晚节
  - date: 1773-02-01
    title_zh: 受命总纂以提要统其纲
    rationale: 群书浩繁必先定凡例，作提要辨章学术，以使四库有统而学者有据
events:
- id: guji-纪昀-event-birth
  date: 1724-08-03
  year_of: 1724
  title_zh: 生于直隶献县
  description_zh: 雍正二年六月十五生于直隶献县崔尔庄纪氏宦学之家
  location_zh: 直隶献县
- id: guji-纪昀-event-jinshi
  date: 1754-05-01
  year_of: 1754
  title_zh: 乾隆十九年登进士入翰林
  description_zh: 乾隆十九年成进士，选庶吉士，授翰林院编修，入馆阁肄业
  location_zh: 北京
- id: guji-纪昀-event-kaohe1758
  date: 1758-04-07
  year_of: 1758
  title_zh: 正大光明殿试翰詹列二等
  description_zh: 乾隆二十三年三月戊申，上于正大光明殿考试翰詹，亲定等次，纪昀与钱大昕等同列二等，奉旨遇应升缺出具名题奏
  location_zh: 北京圆明园正大光明殿
- id: guji-纪昀-event-shidu
  date: 1763-01-01
  year_of: 1763
  title_zh: 累迁侍读学士等馆职
  description_zh: 大考后历迁翰林侍讲侍读，晋侍读学士，充日讲起居注，渐为上所知
  location_zh: 北京
- id: guji-纪昀-event-xiyu
  date: 1768-06-01
  year_of: 1768
  title_zh: 以两淮盐政漏言事遣戍乌鲁木齐
  description_zh: 因两淮盐政卢见曾案失察漏言，褫职发遣乌鲁木齐效力赎罪，居边塞仍勤于纪闻
  location_zh: 乌鲁木齐
- id: guji-纪昀-event-huanhuan
  date: 1771-01-01
  year_of: 1771
  title_zh: 赦还授翰林编修复用
  description_zh: 遇赦内渡，仍授编修，充四库全书馆纂修，复开文治之局
  location_zh: 北京
- id: guji-纪昀-event-siku
  date: 1773-02-01
  year_of: 1773
  title_zh: 任四库全书馆总纂官
  description_zh: 开四库馆，命为总纂，与陆锡熊等综理海内进献遗书，撰校提要，总其成而名垂学林
  location_zh: 北京
- id: guji-纪昀-event-death
  date: 1805-03-14
  year_of: 1805
  title_zh: 卒于京师
  description_zh: 嘉庆十年二月十四卒于京，年八十二，谥文达，著有阅微草堂笔记等传世
  location_zh: 北京
