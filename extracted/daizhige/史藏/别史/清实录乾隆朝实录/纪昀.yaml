  dilemmas:
  - 直言参劾监赈失职者，与顾全京僚情面之衡
  - 总纂群书博闻多识，与亲理粥厂细务救民之衡
  lesson: 学问文章须济以实心任事，见玩视民瘼者必举，方不负读书报国之志
  summary_first_person: 吾为纪昀，直隶献县人，久历文翰，總纂四庫。乾隆五十七年京南大旱，流民就食京師，吾奉命察看粥廠，見增壽寺廠領飯者二千餘人而無人監放，給事中孫家賢竟不到廠，吾親身代為監放，並據實參奏，惟願賑務核實，貧民得沾實惠
  source_urls:
