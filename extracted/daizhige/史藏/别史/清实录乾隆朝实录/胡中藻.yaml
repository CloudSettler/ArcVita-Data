  title_zh: 江西新建出生
  description: 江西新建人，字懋堂，少治经史，文尚奇涩而操守硁硁
- id: guji-胡中藻-event-shaanxi
  date: 1744
  year_of: 1744
  title_zh: 陕西学政任满奏分陕甘
  description: 陕西学政任满奏请分设陕甘学政，经奉不必添设之旨仍复率意具奏，本应交部议处，姑念考校无谬调任广西
- id: guji-胡中藻-event-guangxi
  date: 1749-07
  year_of: 1749
  title_zh: 广西学政恋栈被饬来京
  description: 以少詹事裁缺俟满补用为由带衔奏事，牵引前在通政事辩解，乾隆以恋栈鄙薄谴之，命不必俟任满立即来京候补并交部严察议处
- id: guji-胡中藻-event-death
