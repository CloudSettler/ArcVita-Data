  dilemmas:
  - 清操自守与恋栈陈奏之间的进退失据
  - 奇涩为文与士子表率之间的文道冲突
  - 直陈缺次与君臣分义之间的言行逾越
  lesson: 操守硁硁而识量偏狭，挟私渎奏则终失君心，文士当以通达持重为戒
  summary_first_person: 吾江西新建胡中藻，丙辰进士出身，历陕西广西学政，自谓操守硁硁，考校尚勤，然文尚奇涩，识见偏滞，乾隆十四年以裁缺候补事辗转陈奏，恋栈渎请，奉旨不必俟任满即来京候补，并交部严察议处，终以文祸罹难，追思实由器小沽名所致
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0343.html
