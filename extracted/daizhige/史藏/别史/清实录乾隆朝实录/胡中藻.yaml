  name_zh: 胡中藻
  names:
    zh: 胡中藻
    en: Hu Zhongzao
  lifespan:
    birth:
      date: '1712'
      precision: year
      is_circa: false
      raw: 康熙五十一年
    death:
      date: '1755'
      precision: year
      is_circa: false
      raw: 乾隆二十年
  birth_date: '1712'
  death_date: '1755'
  era: 清代
  reign_ref: 乾隆
  archetype: 文苑恃才罹網型
  dilemmas:
  - 以風雅自命抒懷與君臣大義恪守之衝突
  - 師友推重刊刻傳播與文字譏訕禍機之兩難
  - 直道自許不合時宦與全身保家之權衡
  lesson: 言語吟詠繫於人心風化，臣子立身當以尊親大義為本，不可借典故牢騷以洩不平，否則累及師友身家
  summary_first_person: 吾胡中藻字懋堂自號堅磨生，廣西人也，雍正末舉於鄉，乾隆元年成進士入翰林，洊擢卿貳，督學秦中及粵西，平生以詩自遣，題所著曰堅磨生詩鈔，門生故舊為之序而刊布，不意一語觸網，乾隆二十年三月天子震怒，摘鈔中一世無日月諸句以為大逆，吾與鄂昌酬唱並花單蒂諸作亦成死證，遂以身殉筆墨，嗟乎文人結習誤身誤友，後之覽吾筆者當知戒懼
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0484.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/别史/清实录乾隆朝实录/卷0484.md
