      - 筆墨招尤
    start_date: '1753'
    highlight_event_id: guji-胡中藻-event-shichao
  - key: breakthrough
    name: 張泰開序刻事發被參
    labels:
      zh:
      - 師門牽連
    start_date: 1755-03
    highlight_event_id: guji-胡中藻-event-faan
  - key: climax
    name: 乾隆三月連降嚴旨羅織定逆
    labels:
      zh:
      - 天威震怒
    start_date: 1755-04
    highlight_event_id: guji-胡中藻-event-faan
  - key: closure
    name: 棄市結案垂為世戒
    labels:
      zh:
      - 身殉筆墨
    start_date: '1755'
    highlight_event_id: guji-胡中藻-event-death
  decisions:
  - date: '1753'
    title_zh: 聽任門生刊刻詩集不加刪削
    rationale: 重師門情誼而罔顧大義，致悖逆之語傳播中外
  - date: '1754'
    title_zh: 與鄂昌往復酬詠孝賢皇后之喪等事
    rationale: 以晉人自況放言無忌，自謂風雅，實觸犯國憲
  - date: 1755-04
    title_zh: 事發後未能痛自引咎據實供明
    rationale: 猶存僥倖推諉，致罪上加罪，無可寬宥
events:
- id: guji-胡中藻-event-birth
  title_zh: 出生於廣西
  date: '1712'
  year_of: 1712
  description_zh: 康熙五十一年生於廣西，字懋堂，後自號堅磨生，少治舉業工詩
- id: guji-胡中藻-event-jinshi
  title_zh: 乾隆元年成進士入翰林
  date: '1736'
  year_of: 1736
  description_zh: 丙辰科進士，選庶吉士，授編修，歷侍講侍讀，洊擢清華
- id: guji-胡中藻-event-duxue
  title_zh: 督陝西廣西學政
  date: '1748'
  year_of: 1748
  description_zh: 以翰林督陝西學政，復調廣西，屢司文柄，門生為刊堅磨生詩鈔
- id: guji-胡中藻-event-neige
  title_zh: 擢內閣學士刑部侍郎
  date: '1752'
  year_of: 1752
  description_zh: 累遷內閣學士刑部侍郎，旋以與鄂昌酬詠等事罷職
- id: guji-胡中藻-event-baguan
  title_zh: 罷官待罪
  date: '1754'
  year_of: 1754
  description_zh: 乾隆十九年罷官，詩鈔中一世無日月等句已招物議
- id: guji-胡中藻-event-shichao
  title_zh: 堅磨生詩鈔刊布
  date: '1753'
  year_of: 1753
  description_zh: 自編堅磨生詩鈔，張泰開為作序編次刊刻，流傳京師
- id: guji-胡中藻-event-faan
  title_zh: 乾隆二十年三月詩案發
  date: 1755-04
  year_of: 1755
  description_zh: 本卷所載甲申丙戌諭旨，皇帝召大學士九卿等，摘鈔中論濁清謁羅池廟南北鬥孝賢皇后喪諸詩為大逆，命王大臣會同阿里袞嚴鞫張泰開，俟胡中藻拿到另降諭旨
- id: guji-胡中藻-event-death
  title_zh: 以詩案棄市
  date: '1755'
  year_of: 1755
  description_zh: 乾隆二十年以大逆論斬，詩集追繳銷毀，鄂昌張泰開等牽連問罪，為乾隆朝文字之獄重案之一
