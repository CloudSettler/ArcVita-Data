  decisions:
  - date: '1736'
    title_zh: 以進士選庶吉士留館
    rationale: 欲以文學致身清華，故潛心制藝吟詠，結習漸深
  - date: '1748'
    title_zh: 受命督學陝西復調廣西
    rationale: 以翰林清望司一方文柄，自謂直道獎士，不知收斂鋒芒
  - date: '1752'
    title_zh: 自號堅磨生著詩鈔
    rationale: 借魯論磨涅自況堅貞，縱筆譏時，貽禍而不自覺
- id: guji-胡中藻-endeavor-2
  title_zh: 堅磨生詩鈔文字之獄
  summary_zh: 所著堅磨生詩鈔經張泰開作序刊刻，乾隆二十年三月被摘悖逆譏訕諸條，皇帝親諭王大臣嚴鞫，與鄂昌酬詠並論，遂論斬
  phases:
  - key: brewing
    name: 詩鈔流傳門生序刻
    labels:
