events:
- id: guji-舒赫德-event-birth
  date: 1710
  year_of: 1710
  title_zh: 舒赫德出生
  description: 康熙四十九年生于满洲舒穆禄氏，后入仕历任军机要职
  place_zh: 京师
- id: guji-舒赫德-event-1768-fudian
  date: 1768-03
  year_of: 1768
  title_zh: 受命赴滇整顿滇兵
  description: 以滇省绿营恇怯退避逃散，奉旨赴滇专任整顿，俟京兵到齐会同阿里衮鄂宁查办
  place_zh: 云南永昌
- id: guji-舒赫德-event-1768-qianbing
  date: 1768-04
  year_of: 1768
  title_zh: 会议黔省募兵顶补滇缺
  description: 良卿奏黔省已选年力精壮五千备调滇充补，议给马粮以劝乐赴，并令阿里衮通融满洲兵抵补旧案
  place_zh: 贵州
- id: guji-舒赫德-event-1768-nangzhan
  date: 1768-04
  year_of: 1768
  title_zh: 奏报查得囊占下落并请招服
  description: 据郭荣礼等称宫里雁妻囊占自焚烧孟连后居景戛坝复奔猛叭山已嫁鬼家，请招服，被谕不必俟秋间随宜剿办
  place_zh: 普洱边外猛叭山
- id: guji-舒赫德-event-1768-michen
  date: 1768-04
  year_of: 1768
  title_zh: 与鄂宁密陈粮马艰难请招致缅匪
  description: 计满兵千名需马三千九百，四万兵需马十万，永昌米运需夫百万，又称瘴疠险隘无胜算，请密行招致
  place_zh: 云南永昌
- id: guji-舒赫德-event-1768-shenchi
  date: 1768-04
  year_of: 1768
  title_zh: 密摺被斥为无耻乖谬传旨申饬
  description: 高宗以拘泥成数张皇恐吓，欲效宋明掩耳盗铃，令停止钱度哈国兴密办追回遣缅之人，严行申饬
  place_zh: 北京紫禁城
- id: guji-舒赫德-event-1768-huijing
  date: 1768-04
  year_of: 1768
  title_zh: 与鄂宁一同驰驿来京面受机宜
  description: 以留滇无益，奉旨即速来京，整顿滇兵及秋冬进剿事交阿里衮明德并俟鄂宁回任再办
  place_zh: 北京
- id: guji-舒赫德-event-death
  date: 1777
  year_of: 1777
  title_zh: 舒赫德病逝
  description: 乾隆四十二年卒于官，结束历康雍乾三朝经略筹边生涯
  place_zh: 京师
