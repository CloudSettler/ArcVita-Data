endeavors:
- id: guji-舒赫德-endeavor-1
  title_zh: 西路协办进剿失机获罪
  summary: 乾隆二十二年春起用赴西路襄助成衮扎布，招服游牧而不收马匹，纵贼叛逃，往来疲兵，被诘责革职
  phases:
  - key: brewing
    name: 加恩起用传谕赴军营协办
    labels:
      zh: 受命襄助
    start_date: 1757-03
    highlight_event_id: guji-舒赫德-event-1757-fuxi
  - key: breakthrough
    name: 招服克哷特乌噜特等游牧
    labels:
      zh: 招服失驭
    start_date: 1757-08
    highlight_event_id: guji-舒赫德-event-1757-zhaofu
  - key: climax
    name: 任屯驻山中致贼叛逃疲兵往返
    labels:
      zh: 失机被责
    start_date: 1757-11
    highlight_event_id: guji-舒赫德-event-1757-shiji
  - key: closure
    name: 从宽免死革职为兵丁效力赎罪
    labels:
      zh: 革职赎罪
    start_date: 1757-12
    highlight_event_id: guji-舒赫德-event-1757-gezhi
  decisions:
  - date: 1757-08
    title_zh: 招服后不行收马任其屯驻
    rationale: 昧于收马益兵以制贼之道，致贼有余力，大兵过后即叛
  - date: 1757-11
    title_zh: 不详示谕旨而东遮西露疲马力
    rationale: 怯懦文过，不尽心襄助主帅，动失机宜
- id: guji-舒赫德-endeavor-2
  title_zh: 革后效力赎罪渐图复用
  summary: 革职留军营自备资斧当兵效力，其子舒常亦革退发往黑龙江，惟以后劳冀复恩用
  phases:
  - key: brewing
    name: 革职留营自备资斧当兵
    labels:
