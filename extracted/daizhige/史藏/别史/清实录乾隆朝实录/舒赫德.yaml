    start_date: 1757-12
    highlight_event_id: guji-舒赫德-event-1757-gezhi
  - key: breakthrough
    name: 鲁克察克筹办军务随营行走
    labels:
      zh: 随营赎罪
    start_date: 1758-01
    highlight_event_id: guji-舒赫德-event-1758-xiaoli
  - key: climax
    name: 以赎罪勤勉渐蒙宽宥复用
    labels:
      zh: 渐复任用
    start_date: 1759-06
    highlight_event_id: guji-舒赫德-event-1759-fuqi
  - key: closure
    name: 晚年历任要职以功名终
    labels:
      zh: 以功保全
    start_date: 1777
    highlight_event_id: guji-舒赫德-event-death
  decisions:
  - date: 1757-12
    title_zh: 甘当兵丁在军营效力赎罪
    rationale: 以不死之恩自励，惟奋勉行走可赎前罪，不敢诿过于成衮扎布
  - date: 1758-01
    title_zh: 随营筹办鲁克察克事务
    rationale: 熟悉西路粮运屯田，愿以后方勤勉补前方失算
