  - key: climax
    name: 上疑沽名交查
    labels:
      zh:
      - 质疑年限
      - 交大臣核覆
    start_date: 1780-05-05
    highlight_event_id: guji-荣柱-event-hegong
  - key: closure
    name: 定调离豫观效
    labels:
      zh:
      - 调任盛京
    start_date: 1780-05-07
    highlight_event_id: guji-荣柱-event-diaoshengjing
  decisions:
  - date: 1780-05-04
    title_zh: 奏加价银分年均匀摊派徵还
    rationale: 先发司库加价购料工程紧急分年带徵以补帑项
  - date: 1780-05-04
    title_zh: 奏引河土方摊扣免扣微员扣还大员
    rationale: 丞倅佐杂廉饷无多免坐扣州县厅官以上每年扣还以示体恤
- id: guji-荣柱-endeavor-2
  title_zh: 民借耔种口粮请另旨豁免获谴
  summary_zh: 以民借未完数多年近请另降特旨全蠲被斥献勤取巧沽名市恩交部议处
  phases:
  - key: brewing
    name: 灾后抚民请蠲
    labels:
      zh:
      - 民欠
      - 请旨豁免
    start_date: 1780-05-06
    highlight_event_id: guji-荣柱-event-minqian
  - key: climax
    name: 被斥取巧议处
    labels:
      zh:
      - 恩诏已蠲
      - 交部议处
    start_date: 1780-05-06
    highlight_event_id: guji-荣柱-event-minqian
  - key: closure
    name: 器小难胜改调
    labels:
      zh:
      - 抚豫失职
      - 外调观效
    start_date: 1780-05-07
    highlight_event_id: guji-荣柱-event-diaoshengjing
