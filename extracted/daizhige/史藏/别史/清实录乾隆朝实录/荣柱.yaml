  - date: 1780-05-06
    title_zh: 奏民借耔种口粮牛具另降特旨豁免
    rationale: 恩诏虽颁年分近而数目多欲慎重钱粮另请特旨全蠲
  - date: 1780-05-07
    title_zh: 受谴后交印待杨魁到任赴盛京
    rationale: 器小易盈不知大体俟新抚到任再起程以观后效
events:
- id: guji-荣柱-event-birth
  kind: birth
  title_zh: 出生
  date: 1730-01-01
  year_of: 1730
  description_zh: 约雍正年间出生后入仕累至河南巡抚
- id: guji-荣柱-event-hegong
  kind: career
  title_zh: 奏大工加价摊扣归款
  date: 1780-05-04
  year_of: 1780
  description_zh: 奏大工加价银一百二万余两每年徵解六万两均匀摊派又奏引河土方摊扣七十七万余两州县厅官以上每年扣还四万两上令阿桂查明覆奏
- id: guji-荣柱-event-minqian
  kind: career
  title_zh: 请另旨豁免民借被交部议处
  date: 1780-05-06
  year_of: 1780
  description_zh: 奏各属民借耔种口粮牛具虽奉恩诏请另降特旨全蠲上斥欲沽名市恩献勤取巧交部议处
- id: guji-荣柱-event-diaoshengjing
  kind: career
  title_zh: 改授盛京刑部侍郎
  date: 1780-05-07
  year_of: 1780
  description_zh: 上以其器小易盈难胜河南灾后抚民之任调杨魁补河南巡抚荣柱补授盛京刑部侍郎观其后效俟杨魁到任再赴盛京
- id: guji-荣柱-event-death
  kind: death
  title_zh: 逝世
  date: 1795-01-01
  year_of: 1795
  description_zh: 约乾隆末年卒于盛京刑部侍郎任后
