endeavors:
- id: guji-袁崇焕-endeavor-1
  title_zh: 镇守宁锦抗击后金
  description: 以文官守宁远，筑坚城，设西炮，取得宁远大捷与宁锦大捷，振奋辽左人心
  phases:
  - key: brewing
    name: 初历辽事筑城
    labels:
      zh:
      - 筑城守边
    start_date: 1622-01-01
    highlight_event_id: guji-袁崇焕-event-ningyuan
  - key: breakthrough
    name: 宁远大捷扬威
    labels:
      zh:
      - 以少御多
    start_date: 1626-02-24
    highlight_event_id: guji-袁崇焕-event-ningyuan
  - key: climax
    name: 宁锦再捷固防
    labels:
      zh:
      - 坚守待援
    start_date: 1627-05-01
    highlight_event_id: guji-袁崇焕-event-ningjin
  - key: closure
    name: 去镇候命引忌
    labels:
      zh:
      - 功高见忌
    start_date: 1627-08-01
    highlight_event_id: guji-袁崇焕-event-ningjin
  decisions:
  - date: 1626-02-24
    title_zh: 孤城固守宁远
    rationale: 敌众我寡援绝，唯有凭坚城大炮挫其锋锐，以安人心
  - date: 1627-05-01
    title_zh: 分守宁锦拒皇太极
    rationale: 料敌必攻锦州，以宁远为后劲，坚壁清野，不与野战
- id: guji-袁崇焕-endeavor-2
  title_zh: 督师蓟辽蒙冤殉国
  description: 平台召对称五年复辽，督师蓟辽，己巳勤王守京，却被下狱磔杀，乾隆朝始得昭雪后裔
  phases:
  - key: brewing
    name: 平台召对复起
    labels:
      zh:
      - 五年复辽
    start_date: 1628-07-01
    highlight_event_id: guji-袁崇焕-event-pingtai
  - key: breakthrough
    name: 督师蓟辽整军
    labels:
      zh:
      - 整军屯守
    start_date: 1628-08-01
    highlight_event_id: guji-袁崇焕-event-pingtai
  - key: climax
    name: 己巳勤王守京
    labels:
      zh:
      - 千里勤王
    start_date: 1629-12-01
    highlight_event_id: guji-袁崇焕-event-jisi
  - key: closure
    name: 蒙冤殉国恤裔
    labels:
      zh:
      - 忠而见疑
    start_date: 1630-09-22
    highlight_event_id: guji-袁崇焕-event-qianlongzhao
  decisions:
  - date: 1628-07-01
    title_zh: 奏陈五年复辽方略
    rationale: 欲以坚守屯田和议互市渐图进取，先固京师再复辽土
  - date: 1629-12-01
    title_zh: 率辽军入关勤王
    rationale: 后金绕道蓟门逼京，京师空虚，必星夜赴援以保社稷
events:
- id: guji-袁崇焕-event-birth
  type: birth
  date: 1584-06-06
  year_of: 1584
  title_zh: 生于广东东莞
  description: 万历十二年生于东莞袁氏，后中万历四十七年进士，授邵武知县
- id: guji-袁崇焕-event-ningyuan
  type: career
  date: 1626-02-24
  year_of: 1626
  title_zh: 宁远大捷
  description: 天启六年正月，努尔哈赤攻宁远，我凭坚城西炮击退之，辽人始安
- id: guji-袁崇焕-event-ningjin
  type: career
  date: 1627-05-01
  year_of: 1627
  title_zh: 宁锦大捷
  description: 天启七年，皇太极攻锦州，我分守宁锦，坚守不战，敌引退
- id: guji-袁崇焕-event-pingtai
  type: career
  date: 1628-07-15
  year_of: 1628
  title_zh: 平台召对督师蓟辽
  description: 崇祯元年召对平台，奏五年复辽，拜兵部尚书兼右副都御史，督师蓟辽
- id: guji-袁崇焕-event-jisi
  type: career
  date: 1629-12-01
  year_of: 1629
  title_zh: 己巳勤王守广渠门
  description: 己巳之变，后金入塞逼京，我率九千骑星夜入关，守广渠门力战退敌
- id: guji-袁崇焕-event-death
  type: death
  date: 1630-09-22
  year_of: 1630
  title_zh: 被杀于北京
  description: 崇祯三年八月十六日，以通敌谋叛罪名下狱磔杀，督师之业中废，深可悯恻
- id: guji-袁崇焕-event-qianlongzhao
  type: career
  date: 1783-06-14
  year_of: 1783
  title_zh: 乾隆谕查后裔授官
  description: 乾隆四十八年五月戊申，谕查袁崇焕有无子孙，命以五世孙袁炳照熊廷弼裔孙例授职，以示褒忠
