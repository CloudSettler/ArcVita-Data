  lesson: 以真性情运实政，以诗文之活法济吏治之穷，仕隐皆可惠人
  summary_first_person: 吾钱塘人也，少负才名，乾隆四年登进士，入翰林散馆，改发江苏为知县，历治溧水江宁沭阳江浦，勤于听断，赈灾兴学，后解组归金陵筑随园，倡性灵之说，著诗文以传，终老林下
