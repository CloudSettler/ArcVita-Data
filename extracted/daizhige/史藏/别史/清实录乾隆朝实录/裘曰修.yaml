  dilemmas:
  - 近水居民与水争地而潴蓄日蹙之难
  - 既理河工又兼仓场军需之难
  lesson: 治河先让人于水，存宽深以资潴蓄，禁占垦横堤，方能安澜济运
  summary_first_person: 我久任河工，验永定河而见淀泊被占，堤埝直插水中，请禁报垦升科以存潴蓄，又兼管仓场以济军兴，惟愿实心经理不为具文
