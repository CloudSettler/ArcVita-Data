    highlight_event_id: guji-裘曰修-event-yongding
  - key: closure
    name: 通谕直省杜将来
    labels:
      zh:
      - 通谕
      - 河务
    start_date: 1772-07-15
    highlight_event_id: guji-裘曰修-event-yongding
  decisions:
  - date: 1772-07-01
    title_zh: 请禁淀泊报垦升科
    rationale: 淀泊利在宽深，水退占耕则蓄水日减，潦涨漫溢，故请存已往杜将来
  - date: 1772-07-01
    title_zh: 请禁横加堤埝
    rationale: 堤埝直插水中，被淹更甚，有司见不及远，故须明切晓谕违者治罪
- id: guji-裘曰修-endeavor-2
  person_id: guji-裘曰修
  title_zh: 兼管仓场以济川滇军需
  description: 西路军兴派侍郎刘秉恬专办粮运，仓场侍郎事务令裘曰修暂行兼管来往行走
  phases:
