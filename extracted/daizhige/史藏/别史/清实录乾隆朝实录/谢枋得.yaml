    title_zh: 固辞程钜夫首荐及留魏辟召
    rationale: 宋臣之义不事二君，宁隐忍而死不以遗民应征
  - date: 1289-03-01
    title_zh: 在京绝食以殉故国
    rationale: 既见迫至京不欲屈节偷生，以一死明阖门忠节
events:
- id: guji-谢枋得-event-birth
  date: 1226-03-23
  year_of: 1226
  title_zh: 出生于信州弋阳
  description: 宋理宗宝庆二年生于信州弋阳，少颖悟好直言
- id: guji-谢枋得-event-1
  date: 1275-06-01
  year_of: 1275
  title_zh: 授江东提刑江西招谕使守饶信抚
  description: 以直言忤贾似道后起用，督军守饶州信州抚州，与元兵力战
- id: guji-谢枋得-event-2
  date: 1283-01-01
  year_of: 1283
  title_zh: 隐于闽拒元征辟
  description: 宋亡隐于闽中，程钜夫以宋遗民为首荐之固辞，留梦炎辟召不赴，魏天祐累荐不为礼，妻李氏自经弟侄及女瘐毙于建康狱
- id: guji-谢枋得-event-3
  date: 1289-03-01
  year_of: 1289
  title_zh: 强致京师问瀛国公恸哭
  description: 被强致北至京师，问瀛国公所在再拜恸哭，居悯忠寺
- id: guji-谢枋得-event-death
  date: 1289-04-25
  year_of: 1289
  title_zh: 卒于京师悯忠寺
  description: 居悯忠寺不食而死，阖门忠节，明谥文节奉祀弋阳，清乾隆朝议附祀阖门诸烈并造入防护册
