    title_zh: 受江西招谕使守三郡
    rationale: 国事孔急受命招集忠义以捍江东不辞艰险
  - date: 1278-01-01
    title_zh: 不降而隐于闽
    rationale: 城陷力竭不屈膝事人存发以待时守宋臣之节
