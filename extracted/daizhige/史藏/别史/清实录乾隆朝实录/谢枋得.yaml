  summary_first_person: 吾弋阳谢枋得，直言忤贾似道而不悔，受命守饶信抚以抗元兵，宋亡隐于闽而不仕，及被强致京师，问瀛国公而恸哭，居悯忠寺绝食以死，阖门忠烈，唯求无愧于君父
