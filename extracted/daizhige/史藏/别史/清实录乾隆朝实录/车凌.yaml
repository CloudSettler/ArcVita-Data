  - date: 1754-07-03
    title_zh: 领宴赏誓效忠诚
    rationale: 身受银五千两及部众分赏，唯以教养所属遵循训旨为报，不敢懈怠
events:
- id: guji-车凌-event-birth
  person_id: guji-车凌
  date: 1705-01-01
  year_of: 1705
  title_zh: 出生
  description: 杜尔伯特部台吉，生年不详，约生于康熙末雍正初准噶尔部
- id: guji-车凌-event-guiyi
  person_id: guji-车凌
  date: 1753-12-01
  year_of: 1753
  title_zh: 率万余众归附大清
  description: 与车凌乌巴什等率杜尔伯特万余人倾心来归，朝廷令驻牧喀尔喀，赏给羊只大麦耔种接济生计
- id: guji-车凌-event-fengwang
  person_id: guji-车凌
  date: 1754-07-02
  year_of: 1754
  title_zh: 封杜尔伯特亲王授扎萨克
  description: 乾隆十九年五月谕封车凌为亲王，车凌乌巴什为郡王以下分封贝勒贝子公台吉，均授扎萨克，命玉保麒麟保办理编旗佐领
- id: guji-车凌-event-cibanquet
  person_id: guji-车凌
  date: 1754-07-03
  year_of: 1754
  title_zh: 避暑山庄召见赐宴赏银
  description: 高宗御澹泊敬诚殿召见新封亲王车凌等赐宴，赏车凌银五千两，随从百余人各赏银有差
- id: guji-车凌-event-bianqi
  person_id: guji-车凌
  date: 1754-07-04
  year_of: 1754
  title_zh: 部众编旗分佐领安生
  description: 所部人户编次旗分佐领补放官职，约束教养安分谋生，为后分驻游牧众建分势之先声
- id: guji-车凌-event-death
  person_id: guji-车凌
  date: 1775-01-01
  year_of: 1775
  title_zh: 逝世
  description: 卒年不详，乾隆中后期去世，亲王世系由部众承袭安牧北路
