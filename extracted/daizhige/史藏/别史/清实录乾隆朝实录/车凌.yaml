    rationale: 不忍部众陷于达瓦齐与诸宰桑构衅糜烂，慕大清德化，率万众以求生全
  - date: 1754-07-01
    title_zh: 赴山庄诚心朝觐听命编旗
    rationale: 既已来归即以诚信取信朝廷，愿受扎萨克约束，换取牲畜耔种长久安生
