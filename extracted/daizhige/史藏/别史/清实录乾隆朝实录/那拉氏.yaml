  description: 康熙五十七年二月初十日生，系佐领讷尔布之女，早毓名门，素娴内则
- id: guji-那拉氏-event-qiandi
  title_zh: 赐从潜邸为侧福晋
  type: career
  date: 1734-08-01
  year_of: 1734
  place: 宝亲王邸
  description: 早侍弘历潜邸，久昭婉顺之仪，佐肃雍之化
- id: guji-那拉氏-event-jinfei
  title_zh: 乾隆十年晋封娴贵妃
  type: career
  date: 1745-05-01
  year_of: 1745
  place: 紫禁城
  description: 乾隆十年与纯贵妃同进册宝，王妃命妇俱未行礼，协雅度于珩璜
- id: guji-那拉氏-event-shegong
  title_zh: 册为皇贵妃摄六宫事
  type: career
  date: 1749-05-12
  year_of: 1749
  place: 太和殿及慈宁宫
  description: 乾隆十四年四月初五奉皇太后慈命，以册宝封娴贵妃那拉氏为皇贵妃摄六宫事，来保为正使，海望为副使，照十年例免王妃命妇行礼
- id: guji-那拉氏-event-huibao
  title_zh: 佐成恭上皇太后徽号
  type: career
  date: 1749-05-14
  year_of: 1749
  place: 慈宁宫
  description: 恭上崇庆慈宣康惠皇太后徽号，颁诏天下，永敬奉徽音以穆宣壸政
- id: guji-那拉氏-event-death
  title_zh: 薨逝
  type: death
  date: 1766-08-19
  year_of: 1766
  place: 京师
  description: 乾隆三十一年七月十四日薨，谥为孝仪纯皇后，终年四十九岁
