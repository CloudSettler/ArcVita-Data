endeavors:
- id: guji-那拉氏-endeavor-1
  title_zh: 摄六宫事统理内政
  summary: 由潜邸侧福晋累晋至娴贵妃，乾隆十四年册为皇贵妃摄六宫事，总持阃职，肃雍掖庭
  phases:
  - key: brewing
    name: 潜邸婉顺积望
    labels:
      zh: 潜邸承恩
    start_date: 1734-01-01
    highlight_event_id: guji-那拉氏-event-qiandi
  - key: breakthrough
    name: 晋封娴贵妃
    labels:
      zh: 晋位贵妃
    start_date: 1745-01-01
    highlight_event_id: guji-那拉氏-event-jinfei
  - key: climax
    name: 册摄六宫事
    labels:
      zh: 统摄六宫
    start_date: 1749-05-12
    highlight_event_id: guji-那拉氏-event-shegong
  - key: closure
    name: 肃雍垂范椒涂
    labels:
      zh: 壸仪垂范
    start_date: 1749-05-13
    highlight_event_id: guji-那拉氏-event-shegong
  decisions:
  - date: 1749-04-09
    title_zh: 祇承慈命接受册宝
    rationale: 虚位中宫之际奉皇太后慈谕而进位，以安圣母之心而定内廷之序
  - date: 1749-05-12
    title_zh: 循十年旧例辞王妃命妇行礼
    rationale: 由妃晋封者仪节酌减，不与初封贵妃同礼，以协差等而昭谦冲
- id: guji-那拉氏-endeavor-2
  title_zh: 奉养崇庆皇太后尽孝
  summary: 随侍问安兰殿，配合上徽号庆典，承欢致孝以广慈恩
  phases:
  - key: brewing
    name: 早侍深宫问安
    labels:
      zh: 奉养储孝
    start_date: 1735-01-01
    highlight_event_id: guji-那拉氏-event-jinfei
  - key: breakthrough
    name: 佐成册封与徽号同举
    labels:
      zh: 庆典佐成
    start_date: 1749-05-12
    highlight_event_id: guji-那拉氏-event-shegong
  - key: climax
    name: 永康门恭献奏书致颂
    labels:
      zh: 归美慈恩
    start_date: 1749-05-14
    highlight_event_id: guji-那拉氏-event-huibao
  - key: closure
    name: 内外同颂慈惠
    labels:
      zh: 慈惠覃敷
    start_date: 1749-05-15
    highlight_event_id: guji-那拉氏-event-huibao
  decisions:
  - date: 1749-05-14
    title_zh: 率六宫恭上徽号奏书
    rationale: 西川绥靖肤功既建，宜显扬母德以教孝天下，合外廷喜颂同上崇徽
  - date: 1749-05-12
    title_zh: 接册宝即诣慈宁行礼
    rationale: 先诣皇太后前行礼后还宫，示内治本于孝道，不以荣封而后慈恩
events:
