  - 恪尽孝道以承圣母慈眷与性情改常难以自持之冲突
  - 保全皇后名号以受恩礼与举动乖违难复旧观之冲突
  lesson: 福分浅薄而失欢长辈则纵居中宫亦难善终，唯敬慎有常方能长承恩礼
  summary_first_person: 我自潜邸侧福晋起家，历娴妃贵妃而摄六宫，终正位中宫十余载，去年春随驾南巡江浙，至杭州举动失常，遂先程回京调摄，经年病剧，今七月十四溘逝，饰终止照皇贵妃例，实堪悲叹
