  dilemmas:
  - title_zh: 子弟保举当避嫌疑
    description_zh: 同官保举吾子为学正，虽云按例亦难免瞻徇之嫌，知而不止即与请托同科
  - title_zh: 供奉受知与谨守臣节
    description_zh: 以花鸟写生供奉内廷愈受知遇，愈当戒满持盈以全晚节
  lesson: 保举子弟必先避嫌，知情不止即是徇私，守拙藏锋方能全身
  summary_first_person: 吾无锡小山，康熙进士，历官礼部尚书，以写生花卉供奉内廷。乾隆十九年张泰开保吾子为学正，吾未即阻止，遂与张氏一并交部议处，蒙恩降三级留任，终身以此为警
