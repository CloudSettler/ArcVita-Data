  - key: breakthrough
    name: 官至宗伯
    labels:
      zh: 礼部任事
    start_date: 1750-01-01
    highlight_event_id: guji-邹一桂-event-3
  - key: closure
    name: 著谱垂训
    labels:
      zh: 守正传后
    start_date: 1754-03-18
    highlight_event_id: guji-邹一桂-event-2
  decisions:
  - date: 1750-01-01
    title_zh: 坚持写生正派不事邪媚
    rationale: 画虽小道亦关风化，当以居敬穷理为本，不逐时好
  - date: 1754-03-18
    title_zh: 降罚后益加敛退
    rationale: 既蒙宽典留任，更当以淡泊自持，用画学警子弟远避嫌疑
