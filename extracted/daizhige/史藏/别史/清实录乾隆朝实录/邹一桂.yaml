  role_zh: 礼部尚书兼内廷供奉画家
  goal_zh: 以写生正派垂训后学并谨守臣节
  summary_zh: 久直内廷工花鸟写生，受高宗知遇，著小山画谱，晚年益以淡泊守正自持
  phases:
  - key: brewing
    name: 以画受知
    labels:
      zh: 内廷供奉
    start_date: 1728-01-01
