  title_zh: 另议降三级从宽留任
  description_zh: 乾隆十九年二月己酉，吏部另议张泰开革职，邹一桂照不应重律降三级调用，上命邹一桂降三级从宽留任
  place_zh: 北京
- id: guji-邹一桂-event-3
