endeavors:
- id: guji-邹一桂-endeavor-1
  title_zh: 学正保举牵连议处案
  role_zh: 被保举子之父兼同官
  goal_zh: 辨明无请嘱情弊以求轻议留任
  summary_zh: 张泰开保吾子为学正，部议以降调徇庇，上命严议，终以不应重律降三级留任
  phases:
