    start_date: 1754-03-18
    highlight_event_id: guji-邹一桂-event-2
  decisions:
  - date: 1754-03-04
    title_zh: 未即阻止保举
    rationale: 恃按例保举心存侥幸，未念同官共事岂能诿为不知，遂坐瞻徇
  - date: 1754-03-18
    title_zh: 俯首承降级留任之罚
    rationale: 既无请嘱实据，惟有认不行阻止之咎，戴罪供职以赎前愆
- id: guji-邹一桂-endeavor-2
