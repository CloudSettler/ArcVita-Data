- id: guji-鄂善-event-career
  title_zh: 出任提督深蒙倚用
  date: 1738
  year_of: 1738
  description_zh: 以满洲大臣出任提督，为高宗倚用之重臣，非新用小臣可比
- id: guji-鄂善-event-bribe
  title_zh: 张鸣钧案中受贿千两
  date: 1741
  year_of: 1741
  description_zh: 张鸣钧发掘银两案内，俞长庚妻父孟鲁瞻转托范毓馪说合，送银属其照拂，家人过付后得银一千两是实
- id: guji-鄂善-event-impeach
  title_zh: 御史仲永檀风闻参奏
  date: 1741
  year_of: 1741
  description_zh: 御史仲永檀密奏参其得俞姓银万两及侍郎吴家骐得银事，高宗特派怡亲王和亲王大学士鄂尔泰张廷玉等七人秉公查审
- id: guji-鄂善-event-confess
  title_zh: 召对御前直认受贿
  date: 1741
  year_of: 1741
  description_zh: 和亲王鄂尔泰讷亲来保同进见，初犹抵饰，经开谕后熟思直认从家人手中得银一千两
- id: guji-鄂善-event-death
  title_zh: 赐自尽
  date: 1741
  year_of: 1741
  description_zh: 乾隆六年三月庚寅，以婪赃负国按律当绞，高宗垂泪谕以礼待大臣，容其自尽，王大臣议无过刻，遂伏法
