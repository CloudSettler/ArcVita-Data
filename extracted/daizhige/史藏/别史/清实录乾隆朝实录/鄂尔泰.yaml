endeavors:
- id: guji-鄂尔泰-endeavor-1
  title_zh: 会同九卿议覆钱法疏通铜源
  summary: 乾隆三年领大学士会同九卿科道，议覆陶正靖等钱法条奏，驳添设铜行经纪之请，准朱凤英疏通洋铜之议，以足民铜而平钱价
  phases:
  - key: brewing
    name: 条奏纷陈酝酿
    labels:
      zh:
      - 酝酿筹议
    start_date: 1738-06-10
    highlight_event_id: guji-鄂尔泰-event-qianfa
  - key: breakthrough
    name: 会议驳正定议
    labels:
      zh:
      - 会议驳议
    start_date: 1738-06-18
    highlight_event_id: guji-鄂尔泰-event-qianfa
  - key: climax
    name: 疏通铜源足民
    labels:
      zh:
      - 疏通足民
    start_date: 1738-06-20
    highlight_event_id: guji-鄂尔泰-event-qianfa
  - key: closure
    name: 奉旨允行收束
    labels:
      zh:
      - 奉旨施行
    start_date: 1738-06-22
    highlight_event_id: guji-鄂尔泰-event-qianfa
  decisions:
  - date: 1738-06-18
    title_zh: 驳添设铜行经纪定官价之请
    rationale: 货物贵贱悬殊，定官价必亏商本，且启强买争端，于钱价无益，故不准行
  - date: 1738-06-20
    title_zh: 准商民过洋购铜听其售卖不必官收
    rationale: 官价与民价悬殊则商不赴洋，惟除弊禁需索，令官民铜觔俱足，钱价自平
- id: guji-鄂尔泰-endeavor-2
  title_zh: 厘定仓储斛式整饬部院吏治
  summary: 乾隆三年遵旨议覆仓斛及部院积弊，奏请制铁斛颁仓以绝大小，申饬部院推诿染指之习，以清仓储而肃官箴
  phases:
  - key: brewing
    name: 仓斛讼异起议
    labels:
      zh:
      - 查仓酝酿
    start_date: 1738-06-12
    highlight_event_id: guji-鄂尔泰-event-tiehu
  - key: breakthrough
    name: 议制造铁斛为式
    labels:
      zh:
      - 立式破局
    start_date: 1738-06-19
    highlight_event_id: guji-鄂尔泰-event-tiehu
  - key: climax
    name: 申饬部院奉公洁己
    labels:
      zh:
      - 整饬吏治
    start_date: 1738-06-26
    highlight_event_id: guji-鄂尔泰-event-tiehu
  - key: closure
    name: 定用印存案稽查
    labels:
      zh:
      - 定制收束
    start_date: 1738-06-28
    highlight_event_id: guji-鄂尔泰-event-tiehu
  decisions:
  - date: 1738-06-19
    title_zh: 请制铁斛给发各仓以木斛对量
    rationale: 木斛年久渐异旧式，惟铁为式可绝大小，放米派员质对，量米遵用木荡平量
  - date: 1738-06-26
    title_zh: 晓谕部院洁己奉公严察推诿染指
    rationale: 部院因循推诿，升迁钱粮工程未尽平允，若不严察参处，则宽大流于废弛
