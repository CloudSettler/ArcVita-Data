  dilemmas:
  - title_zh: 改土归流之剿抚权衡
    description: 西南土司世袭顽固，若专事招抚则政令不行，若一意进剿则糜费骚动，需在恩威之间求得长治
  - title_zh: 中枢集权与边地因俗之衡
    description: 朝廷欲收权归流，而苗瑶杂处习俗各异，推行新制过急易激变，过缓则功亏，需审时而动
  lesson: 治边先治吏，安民先安土，恩威并济方能久远
  summary_first_person: 吾乃鄂尔泰，西林觉罗氏，历康熙雍正乾隆三朝，由翰林而任江苏布政使，继督云贵，力主改土归流，继入军机辅政，参赞西北军务，毕生以靖边安民为任
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70158.html
endeavors:
- id: guji-鄂尔泰-endeavor-1
  title_zh: 云贵经略与改土归流
  description: 任云贵广西总督期间，主持滇黔桂改土归流，裁革土司，设府置县，清查户口田赋，平定苗瑶叛乱，奠定西南一体之局
  phases:
