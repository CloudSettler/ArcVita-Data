endeavors:
- id: guji-鄂尔泰-endeavor-1
  title_zh: 议覆归化绥远防缉事宜
  summary: 会同大学士等核议宝全条奏，定分饬稽查驱逐与冬设卡哨之制
  phases:
  - key: brewing
    name: 受命核议边奏
    labels:
      zh: 受命
    start_date: 1744-10-01
    highlight_event_id: guji-鄂尔泰-event-1
  - key: breakthrough
    name: 厘定互察驱逐之例
    labels:
      zh: 议定
    start_date: 1744-10-05
    highlight_event_id: guji-鄂尔泰-event-1
  - key: closure
    name: 奏准通行边城
    labels:
      zh: 定议
    start_date: 1744-10-08
    highlight_event_id: guji-鄂尔泰-event-1
  decisions:
  - date: 1744-10-08
    title_zh: 蒙汉仍各饬稽查不令互察
    rationale: 若令十家长乡长互察必致妄生事端，故仍各自稽查并责成佐领骁骑校察究
  - date: 1744-10-08
    title_zh: 黄河冬冻设卡会哨春融即彻
    rationale: 鄂尔多斯匪人每冬偷渡窃马，故沿河设卡每日会哨，春融即彻交渡口官兵看守
- id: guji-鄂尔泰-endeavor-2
  title_zh: 议覆湖南苗疆治理事宜
  summary: 会同部臣核议蒋溥条奏，守定例禁私交并严饬兵役慎选义学之师
  phases:
  - key: brewing
    name: 承蒋溥条奏苗事
    labels:
      zh: 承奏
    start_date: 1744-10-06
    highlight_event_id: guji-鄂尔泰-event-2
  - key: climax
    name: 坚持苗地禁汉往来旧例
    labels:
      zh: 守例
    start_date: 1744-10-10
    highlight_event_id: guji-鄂尔泰-event-2
  - key: closure
    name: 定取结慎选以整饬苗疆
    labels:
      zh: 整饬
    start_date: 1744-10-12
    highlight_event_id: guji-鄂尔泰-event-2
  decisions:
  - date: 1744-10-12
    title_zh: 苗地仍照例禁汉人私相授受
    rationale: 苗性愚顽易致蠢动，若许当官交易买产借债，奸民必藉端欺占，故仍照例遵行
  - date: 1744-10-12
    title_zh: 文武取结并慎选训诲之人
    rationale: 兵役擅入苗地多借端骚扰，故令每月取具不敢扰苗结状送督抚查考，并慎选方正之人化导
events:
