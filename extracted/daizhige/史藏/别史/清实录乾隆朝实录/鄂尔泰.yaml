  title_zh: 大学士会同九卿议覆钱法条奏
  description: 乾隆三年六月，鄂尔泰会同九卿科道，议覆陶正靖李世倬朱凤英等钱法之奏，驳添设铜行之请，准疏通洋铜，奉旨允行
- id: guji-鄂尔泰-event-tiehu
  date: 1738-06-22
  year_of: 1738
  title_zh: 遵旨议奏仓斛改制铁斛为式
  description: 乾隆三年六月，鄂尔泰等议覆参领鄂托所奏米斛渐小之弊，请制铁斛颁发各仓，派员质对平量，奉旨允行
- id: guji-鄂尔泰-event-death
  date: 1745
  year_of: 1745
  title_zh: 卒于乾隆十年
  description: 乾隆十年卒，谥文端，配享太庙，为雍正乾隆两朝顾命辅政之臣
