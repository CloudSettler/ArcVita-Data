  summary_zh: 康熙十九年生于西林觉罗氏，隶镶蓝旗满洲
- id: guji-鄂尔泰-event-1
  title_zh: 议覆陕省标营新兵轮补章程
  date: 1738-05-03
  year_of: 1738
  summary_zh: 乾隆三年四月辛丑，大学士鄂尔泰等议覆查郎阿疏，定陕省标营马步守兵缺出以子弟新兵相间轮补，抚标守兵照例裁扣，得旨允行
- id: guji-鄂尔泰-event-2
  title_zh: 会同九卿议覆李贤经条奏
  date: 1738-05-04
  year_of: 1738
  summary_zh: 乾隆三年四月壬寅奉旨，鄂尔泰会同九卿阅看御史李贤经条奏，议定考绩保举仓储营制等均遵成例无庸议，得旨从之
- id: guji-鄂尔泰-event-death
  title_zh: 病卒
  date: 1745
  year_of: 1745
  summary_zh: 乾隆十年四月病卒于京师，谥文端，配享太庙
