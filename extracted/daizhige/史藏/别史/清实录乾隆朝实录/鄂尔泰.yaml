endeavors:
- id: guji-鄂尔泰-endeavor-1
  title_zh: 整顿陕省标营兵缺补制
  summary_zh: 针对陕省标营事故缺出顶补无序，议覆仍管川陕总督查郎阿所请，定本兵子弟优先新兵轮补之序，以清营伍而省召募
  phases:
  - key: brewing
    name: 会察川陕总督条陈
