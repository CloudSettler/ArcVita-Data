    start_date: 1729-01-01
    highlight_event_id: guji-鄂尔泰-event-yifu-junxu
  - key: breakthrough
    name: 乾隆初年顾命辅政
    labels:
      zh: 辅政大学士
    start_date: 1735-10-01
    highlight_event_id: guji-鄂尔泰-event-yifu-junxu
  - key: climax
    name: 议覆补熙备兵备驼奏
    labels:
      zh: 筹边议覆
    start_date: 1742-02-01
    highlight_event_id: guji-鄂尔泰-event-yifu-junxu
  - key: closure
    name: 病中仍虑边事殁于位
    labels:
      zh: 殁于辅位
    start_date: 1745-01-01
    highlight_event_id: guji-鄂尔泰-event-death
  decisions:
  - date: 1742-02-15
    title_zh: 议覆补熙请备马驼棉甲
    rationale: 自杀虎口至额尔德尼昭道远三千里，临期调集不及，宜就近豫备喀尔喀马驼，并以备用棉甲拨给，方可应期策应
  - date: 1742-02-15
    title_zh: 定内地扎萨克两队应援之制
    rationale: 首队四千五百兵一月可集，二队六千五百继进，内外相维，军威壮盛，足以抵御准噶尔窥伺
events:
- id: guji-鄂尔泰-event-birth
  title_zh: 生于西林觉罗氏
  date: 1680-01-01
  year_of: 1680
  description: 康熙十九年生于满洲镶蓝旗，项龄入仕，初授内阁中书，继入翰林
- id: guji-鄂尔泰-event-gaituiguiliu
  title_zh: 主持云贵改土归流
  date: 1726-04-01
  year_of: 1726
  description: 任云贵总督，上疏力主改土归流，裁乌蒙镇沅等土司，设府县，收其赋役，西南大定
- id: guji-鄂尔泰-event-yifu-junxu
  title_zh: 与大学士议覆补熙军需奏
  date: 1742-02-15
  year_of: 1742
  description: 乾隆七年正月，与诸臣议覆将军补熙奏请豫备额尔德尼昭沿途马驼及绥远右卫炮驼棉甲，并定归化察哈尔备兵起行银两之制，事见乾隆实录卷一百五十八
- id: guji-鄂尔泰-event-death
  title_zh: 病逝于京师
  date: 1745-05-16
  year_of: 1745
  description: 乾隆十年四月病逝于京，谥文端，配享太庙，追封忠襄伯
