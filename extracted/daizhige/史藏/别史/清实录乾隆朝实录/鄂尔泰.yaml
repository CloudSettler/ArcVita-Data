    labels:
      zh:
      - 定制
    start_date: 1738-05-03
    highlight_event_id: guji-鄂尔泰-event-1
  decisions:
  - date: 1738-05-03
    title_zh: 议覆准查郎阿新兵轮补之请
    rationale: 马步守兵各有次序，先尽子弟以系兵心，无子弟方以新兵递补，庶缺不滥补而营伍得清
- id: guji-鄂尔泰-endeavor-2
  title_zh: 会议言官条奏酌定因革
  summary_zh: 针对御史李贤经条奏裁减细务双俸仓粟用人韬略诸款，会同九卿阅看定拟，守成例而不纷更，以安大局
  phases:
  - key: brewing
    name: 奉旨会同九卿阅看条奏
    labels:
      zh:
      - 守成
      - 参赞
    start_date: 1738-05-04
    highlight_event_id: guji-鄂尔泰-event-2
  - key: closure
    name: 定议无庸更张具奏
    labels:
      zh:
      - 定议
    start_date: 1738-05-04
    highlight_event_id: guji-鄂尔泰-event-2
  decisions:
  - date: 1738-05-04
    title_zh: 议驳岁擢韬略科诸请守成例
    rationale: 考绩保举军功仓储皆有成例，韬略难凭空言试验，纷更徒生百弊，不如率由旧章
