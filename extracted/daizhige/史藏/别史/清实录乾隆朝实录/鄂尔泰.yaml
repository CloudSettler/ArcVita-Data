  title_zh: 病逝于京师
  date: 1745
  year_of: 1745
  description: 乾隆十年病逝于京师，谥文端，配享太庙
- id: guji-鄂尔泰-event-1
  title_zh: 会议覆归化绥远条奏
  date: 1744-10-08
  year_of: 1744
  description: 乾隆九年九月会同大学士议覆宝全条奏，定蒙汉各饬稽查，驱逐寄寓扎萨克蒙古及容留他处喇嘛，黄河冬设卡会哨
- id: guji-鄂尔泰-event-2
  title_zh: 会议覆湖南苗疆事宜
  date: 1744-10-12
  year_of: 1744
  description: 乾隆九年九月会同大学士议覆蒋溥苗疆条奏，守汉人不得往来苗地旧例，不许将弁兼理，严饬取结并慎选义学之师
