  - key: climax
    name: 进兵镇压乌蒙镇沅叛土司
    labels:
      zh: 用兵西南
    start_date: 1727-06-01
    highlight_event_id: guji-鄂尔泰-event-gaituiguiliu
  - key: closure
    name: 设官置守功成加衔
    labels:
      zh: 经略告成
    start_date: 1731-01-01
    highlight_event_id: guji-鄂尔泰-event-gaituiguiliu
  decisions:
  - date: 1726-03-01
    title_zh: 疏请云贵大举改土归流
    rationale: 以流官代土司可统一赋役司法，绝土司割据之患，虽一时费兵，然可收万世之利
  - date: 1727-08-01
    title_zh: 乌蒙进剿先抚后剿
    rationale: 叛酋煽动胁从甚众，若并诛则激众怒，先示招抚分别首从，再以重兵进剿，方能速定
- id: guji-鄂尔泰-endeavor-2
  title_zh: 军机辅政与筹划西北边防
  description: 雍正末入军机处，乾隆初为首席大学士，参赞西北喀尔喀及准噶尔军务，议覆调兵备饷事宜，维持西陲稳定
  phases:
  - key: brewing
