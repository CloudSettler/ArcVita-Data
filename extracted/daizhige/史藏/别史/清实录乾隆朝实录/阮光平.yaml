  dilemmas:
  - 新造之邦亟需册封正名与义安城工方兴之两难
  - 途中染病需留调治与克期驰赴黎城祇迎之两难
  - 重臣慕义愿随赴阙祝厘与国内无人居守经理之两难
  lesson: 事大以存国，恭顺出至诚，闻命即趋，抱病不避，方得天朝体恤加恩，永固藩服
  summary_first_person: 余奄有安南，初建新邦，闻天朝遣使捧敕书御诗宣封，即停义安城工，驰赴黎城，途中染病暂留义安调摄，遣幼子光垂率陪臣迎候，病痊即起程，约月半赶到黎城，蠲吉祇迎锡命，永矢向化恭顺之诚
