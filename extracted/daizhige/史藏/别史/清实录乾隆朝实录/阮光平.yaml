person:
  qid: guji-阮光平
  name_zh: 阮光平
  names:
    zh: 阮光平
    en: Nguyen Quang Binh
  lifespan:
    birth:
      date: 1753-01-01
      precision: year
      is_circa: true
      raw: 约乾隆十八年
    death:
      date: 1792-09-16
      precision: day
      is_circa: false
      raw: 乾隆五十七年八月初一日
  birth_date: 1753-01-01
  death_date: 1792-09-16
  era: 清乾隆朝
  reign_ref: 乾隆五十四年
  archetype: 悔罪归诚者
  dilemmas:
  - 复据安南之后是继续对抗天朝还是悔罪乞降以保国人
  - 误伤天朝提镇之后是以武力固守还是收养迷失官兵以示诚敬
  lesson: 知天朝不可敌则亟收锋敛迹，以诚悔罪乞封，方能转危为安而长保藩国
  summary_first_person: 吾本广南起兵之人，乘黎氏庸昏而复据安南，正月率众至黎城理论，值黑夜不辨衣色，误伤天朝提镇，自知罪重，惧干天讨，乃收养迷失官兵，陆续送出，三次叩关乞降，遣亲侄光显代我赴热河瞻觐，进表纳贡，蒙恩免讨，封为安南国王，许我明年亲诣阙祝嘏，此皆悔过抒诚所致也
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71335.html
endeavors:
- id: guji-阮光平-endeavor-1
  title_zh: 复据安南与黎城误伤官兵
  summary: 乘黎维祁庸懦复据安南，正月初间率众突至黎城，与留守未彻之官兵黑夜交战，误伤提镇，遂致天朝调兵声讨之局
  phases:
  - key: brewing
    name: 广南聚众北上
    labels:
      zh:
      - 安南内乱
      - 兴灭继绝
    start_date: 1788-12-01
    highlight_event_id: guji-阮光平-event-licheng
  - key: breakthrough
    name: 正月赴黎城理论
    labels:
      zh:
      - 黎城对峙
      - 大兵未彻
    start_date: 1789-02-01
    highlight_event_id: guji-阮光平-event-licheng
  - key: climax
    name: 黑夜混战误伤提镇
    labels:
      zh:
      - 黑夜误伤
      - 一提二镇殉难
    start_date: 1789-02-05
    highlight_event_id: guji-阮光平-event-licheng
  - key: closure
    name: 据城自守待变
    labels:
      zh:
      - 全师相持
      - 声讨将至
    start_date: 1789-03-01
    highlight_event_id: guji-阮光平-event-licheng
  decisions:
  - date: 1789-02-01
    title_zh: 亲率人众突至黎城理论
    rationale: 见大兵尚在未彻，欲乘黎氏已灭之势迫其退让，不料迎截打仗，夜暗不辨，遂成误伤大错
- id: guji-阮光平-endeavor-2
  title_zh: 悔罪乞降受封安南国王
  summary: 自知罪重惧讨，收养送还迷失官兵，三次叩关驳回不准，复于福康安抵镇南关后恳乞，遣亲侄阮光显入觐热河，进表纳贡请封，得恩免讨封王
  phases:
  - key: brewing
    name: 惧讨收养官兵
    labels:
      zh:
      - 悔罪抒诚
      - 收养送还
    start_date: 1789-04-01
    highlight_event_id: guji-阮光平-event-qijiang
  - key: breakthrough
    name: 三次叩关乞降
    labels:
      zh:
      - 叩关吁恳
      - 孙士毅驳回
    start_date: 1789-05-01
    highlight_event_id: guji-阮光平-event-qijiang
  - key: climax
    name: 遣侄代叩镇南关
    labels:
      zh:
      - 遣侄叩关
      - 福康安据情奏闻
    start_date: 1789-07-01
    highlight_event_id: guji-阮光平-event-rujin
  - key: closure
    name: 入觐受封许明年祝嘏
    labels:
      zh:
      - 热河瞻觐
      - 封安南国王
    start_date: 1789-08-29
    highlight_event_id: guji-阮光平-event-fengwang
  decisions:
  - date: 1789-05-01
    title_zh: 差人叩关三次乞降
    rationale: 明知误伤非出有心，唯有屡次悔罪抒诚，善养送出迷失官兵，方可冀天朝宽宥免讨
  - date: 1789-07-01
    title_zh: 遣亲侄阮光显代赴镇南关再四吁恳
    rationale: 国内未能宁谧不能遽离，以亲侄代行示信，进表纳贡请藉天朝封号镇抚国人，并请明年亲诣阙祝寿
events:
- id: guji-阮光平-event-birth
  title_zh: 出生于广南
  date: 1753-01-01
  year_of: 1753
  place_zh: 安南广南
  description: 西山起兵首领之家，约乾隆十八年生，后称阮惠，又名阮光平
- id: guji-阮光平-event-licheng
  title_zh: 黎城理论误伤天朝提镇
  date: 1789-02-05
  year_of: 1789
  place_zh: 安南黎城
  description: 本年正月初间率广南人众突至黎城，大兵迎截，黑夜衣服不能辨别，误伤提镇，孙士毅全师未归，许世亨左右保全而还
- id: guji-阮光平-event-qijiang
  title_zh: 收养官兵三次叩关乞降
  date: 1789-05-15
  year_of: 1789
  place_zh: 镇南关外
  description: 将迷失官兵善为收养陆续送出，经孙士毅驳回不准，复于福康安抵镇南关后又差人恳乞，仍不允准
- id: guji-阮光平-event-rujin
  title_zh: 遣阮光显等入觐热河行在
  date: 1789-08-29
  year_of: 1789
  place_zh: 热河卷阿胜境
  description: 遣亲侄正使阮光显副使阮有晭等护送前来行在瞻觐，适值开宴行贺，随蒙古王公文武大臣后入座观剧，分别赏赉玉如意缎盒等物
- id: guji-阮光平-event-fengwang
  title_zh: 受封安南国王
  date: 1789-08-30
  year_of: 1789
  place_zh: 热河行在
  description: 以措词诚实得体小心恭谨，蒙恩免其进讨，封为安南国王，贡物赏收，敕谕守土各官改称安南国王，并许明年亲自诣阙叩祝万寿
- id: guji-阮光平-event-death
  title_zh: 病逝于富春
  date: 1792-09-16
  year_of: 1792
  place_zh: 安南富春
  description: 受封后三年病逝，未及亲来祝嘏，遗命归诚天朝
