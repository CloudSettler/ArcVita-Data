    title_zh: 以吴文楚等愿明年随同进京叩祝上闻
    rationale: 表向化瞻就之忱，借祝厘以通诚信
  - date: 1789-12-05
    title_zh: 遵旨留吴文楚居守俟下次进贡再觐
    rationale: 新造之邦诸事资整饬，得力之臣若偕行则居守无人，仰体优恩多方体恤
events:
- id: guji-阮光平-event-birth
  title_zh: 诞生
  date: 1753-01-01
  year_of: 1753
  place_zh: 安南归仁
  summary_zh: 乾隆十八年生，西山旧部，后奄有安南
- id: guji-阮光平-event-yian
  title_zh: 义安筑城闻封停工
  date: 1789-09-15
  year_of: 1789
  place_zh: 义安
  summary_zh: 八月在义安筑城，接到檄会知已封为安南国王，即停工起身，行至东城县因病暂留调治
- id: guji-阮光平-event-jiajie
  title_zh: 嘉橘遣子迎候
  date: 1789-11-10
  year_of: 1789
  place_zh: 安南嘉橘
  summary_zh: 九月二十三日成林行抵嘉橘，阮光平遣子光垂率员目百数十人恭递呈文，禀病展期受封，另遣文目黎春材率卫士五百护从龙亭仪仗
- id: guji-阮光平-event-qicheng
  title_zh: 病痊自义安起程赴黎城
  date: 1789-11-24
  year_of: 1789
  place_zh: 义安至黎城
  summary_zh: 十月初三日病稍减自义安起程，约月半前后赶到黎城，成林定于二十前诹吉成礼，并奏吴文楚愿明年随同进京叩祝
- id: guji-阮光平-event-shoufeng
  title_zh: 黎城宣封成礼蒙恩赉
  date: 1789-12-05
  year_of: 1789
  place_zh: 黎城
  summary_zh: 赶赴黎城祇迎恩命，蠲吉宣封，大皇帝嘉慰，特赐珊瑚朝珠御用荷包，并谕吴文楚俟下次进贡再觐
- id: guji-阮光平-event-death
  title_zh: 薨逝
  date: 1792-09-16
  year_of: 1792
  place_zh: 升龙皇城
  summary_zh: 受封后三年薨，子光缵嗣立，国祚终归阮福映一统
