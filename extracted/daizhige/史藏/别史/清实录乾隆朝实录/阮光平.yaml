events:
- id: guji-阮光平-event-birth
  title_zh: 诞生于归仁
  date: 1753
  year_of: 1753
  place_zh: 安南归仁
  description_zh: 乾隆十八年生于归仁，西山兄弟之二弟，后统一安南。
- id: guji-阮光平-event-1
  title_zh: 赴避暑山庄瞻觐祝厘
  date: 1790-08-26
  year_of: 1790
  place_zh: 热河避暑山庄
  description_zh: 乾隆五十五年亲赴热河祝八旬万寿，瞻觐蒙嘉奖，受封安南国王。
- id: guji-阮光平-event-2
  title_zh: 南旋后具表谢恩蒙寄信开示
  date: 1791-04-10
  year_of: 1791
  place_zh: 安南至广西镇南关
  description_zh: 乾隆五十六年三月接奉朱批御书大寿字荷包玉器具表恭谢，谢恩使缓程北行，陈用敷拘泥追回被训饬，高宗寄信详谕体恤远藩，令直书督抚名姓。
