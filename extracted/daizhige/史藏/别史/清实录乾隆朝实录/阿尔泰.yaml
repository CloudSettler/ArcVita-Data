      raw: 乾隆三十八年伏诛
  birth_date: 1710-01-01
  death_date: 1773-01-01
  era: 清
  reign_ref: 乾隆
  archetype: 封疆督抚
  dilemmas:
  - 抚绥地方安民察吏与兴师边衅静边抚驭之权衡
  - 军粮飞挽呼应不灵与年衰昏愦图置身事外之两难
  - 受恩任事尽力督办与饰言自累倚老负恩之取舍
  lesson: 受恩膺封疆重寄，当与士卒同甘苦，以国事为念，上紧筹办粮运，毋饰诈避事，贻误军机自取罪戾。
  summary_first_person: 我本由御前行走出任封疆，前在山东巡抚任内察吏安民，蒙恩擢授四川总督，复以采办楠木解京议叙。及小金川事起，经理不善，罢斥后复蒙恩赏散秩大臣衔专办粮务。然南路军粮节次迟误，绰斯甲布一路催趱逾月无运到者，又以年衰请革职留营效力，图置身事外，遂以有心贻误革职拿问交文绶看守候讯。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70913.html
endeavors:
- id: guji-阿尔泰-endeavor-1
  title_zh: 抚鲁督川与采办楠木
  summary_zh: 山东巡抚察吏安民，擢四川总督认真地方政务，购解天坛灯竿楠木受赏，复奉旨停解。
  phases:
  - key: brewing
    name: 抚鲁察吏安民
    labels:
      zh: 山东巡抚
    start_date: 1765-01-01
    highlight_event_id: guji-阿尔泰-event-shandong
  - key: breakthrough
    name: 擢授四川总督
    labels:
      zh: 督川认真
    start_date: 1768-01-01
    highlight_event_id: guji-阿尔泰-event-shandong
  - key: climax
    name: 采办楠木解京议叙
    labels:
      zh: 楠木采运
    start_date: 1771-01-01
    highlight_event_id: guji-阿尔泰-event-nanmu
  - key: closure
    name: 简任纶扉仍膺封疆
    labels:
      zh: 加恩赏赉
    start_date: 1771-12-01
    highlight_event_id: guji-阿尔泰-event-nanmu
  decisions:
  - date: 1771-01-01
    title_zh: 捐养廉购解楠木料件
    rationale: 因解送灯竿之便顺带木植，以养廉三千两捐办，初出悃忱留备工程，后奉旨停止购解。
  - date: 1768-01-01
    title_zh: 枕上办公认真督抚事
    rationale: 偶尔卧疾亦于枕上办公，以副察吏安民之任，遂蒙嘉许擢任。
- id: guji-阿尔泰-endeavor-2
  title_zh: 金川军粮督办与贻误获罪
  summary_zh: 散秩大臣专办粮务，署理督篆帮办南路，奏议余丁长夫，终以绰斯甲布一路粮运迟误革职拿问。
  phases:
  - key: brewing
    name: 散秩专办粮务
    labels:
      zh: 专办粮运
    start_date: 1771-12-01
    highlight_event_id: guji-阿尔泰-event-yuding
  - key: breakthrough
    name: 南路帮同赶运
    labels:
      zh: 南路径僻站长
    start_date: 1772-07-15
    highlight_event_id: guji-阿尔泰-event-yuding
  - key: climax
    name: 余丁长夫筹议
    labels:
      zh: 川黔兵余丁
    start_date: 1772-07-30
    highlight_event_id: guji-阿尔泰-event-yuding
  - key: closure
    name: 贻误革职拿问
    labels:
      zh: 革职候讯
    start_date: 1772-08-07
    highlight_event_id: guji-阿尔泰-event-gezhi
  decisions:
  - date: 1772-07-30
    title_zh: 奏请多带余丁裁减长夫
    rationale: 以余丁可备拔补兵额，长夫祇供樵汲费多，请每兵百名以三十名为率定余丁，无余丁者长夫减十名。
  - date: 1772-08-07
    title_zh: 以年衰昏愦请革职留营效力
    rationale: 自言运粮不能胜任，请革职留军营效力俟告竣另当差，实图置身事外，遂坐有心贻误被拿问。
events:
- id: guji-阿尔泰-event-birth
  date: 1710-01-01
  year_of: 1710
  title_zh: 出生
  description_zh: 生年未详，满洲正蓝旗人，约生于康熙末雍正初。
- id: guji-阿尔泰-event-shandong
  date: 1768-01-01
  year_of: 1768
  title_zh: 抚鲁擢督川
  description_zh: 前在山东巡抚任内实心察吏安民，克副任使，擢授四川总督，地方政务仍认真办理，卧疾亦枕上办公。
- id: guji-阿尔泰-event-nanmu
  date: 1771-01-01
  year_of: 1771
  title_zh: 采办楠木解京议叙
  description_zh: 天坛灯竿需楠木，前任未办，到任后购得委员解京，议叙加赏，捐养廉三千两顺带料件，后奉旨停解。
- id: guji-阿尔泰-event-yuding
  date: 1772-07-30
  year_of: 1772
  title_zh: 奏议余丁长夫事宜
  description_zh: 以协理粮饷散秩大臣奏此次调川黔兵未带余丁改用长夫费多，请飞咨各省备带余丁，每兵百名给夫三十名定率，无余丁者减十名，奉旨交温福就军营实情妥筹速奏。
- id: guji-阿尔泰-event-gezhi
  date: 1772-08-07
  year_of: 1772
  title_zh: 南路粮误革职拿问
  description_zh: 丁巳谕以专办粮务呼应不灵，南路绰斯甲布一路催趱逾月无运到，有心贻误，又以年衰请革职留营，倚老负恩，著革职拿问交文绶派员看守候讯。
- id: guji-阿尔泰-event-death
  date: 1773-01-01
  year_of: 1773
  title_zh: 逝世
  description_zh: 以金川军务贻误罪，于乾隆三十八年伏诛。
