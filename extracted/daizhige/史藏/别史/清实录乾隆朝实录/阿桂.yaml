  - key: breakthrough
    name: 辨明改小無益反損之理
    labels:
      zh: 條陳利弊
    start_date: 1785-10-01
    highlight_event_id: guji-阿桂-event-cao-1
  - key: climax
    name: 定議仍舊立限防私增
    labels:
      zh: 定限守舊
    start_date: 1785-11-01
    highlight_event_id: guji-阿桂-event-cao-1
  - key: closure
    name: 江浙江廣船式著為定例
    labels:
      zh: 著為令式
    start_date: 1785-11-15
    highlight_event_id: guji-阿桂-event-cao-1
  decisions:
  - date: 1785-11-01
    title_zh: 請漕船仍舊毋庸改造
    rationale: 運河行走全恃水足水淺則大小俱滯改小一丈無濟反使旗丁土宜不敷京師物價騰貴故不如守舊
  - date: 1785-11-15
    title_zh: 請立江浙江廣船式吃水限制
    rationale: 既守舊則須立定長深吃水之度使旗丁不得私增尺寸例外多帶遇淺亦可少滯而足敷灑帶
- id: guji-阿桂-endeavor-2
  title_zh: 查辦清口淤淺與運河鹽場水道
  summary: 欽差查奏清口兩岸淤船推挽南下及運河戽水立限並通泰海場灶河引潮濟運諸務
