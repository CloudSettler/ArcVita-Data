    title_zh: 将帑藏充盈再拨五六百万亦不惜之旨遍晓官兵土练
    rationale: 使满汉官兵及土司土练一体闻知朝廷宽然有余，坚其持久必灭之心
  - date: 1775-02-07
    title_zh: 定计不冒险扑碉亦不迁延坐待
    rationale: 冒险或致挫误，过慎则失雨雪前良机，惟妥酌利害上紧筹办方可破竹而入
