    start_date: 1772-03-10
    highlight_event_id: guji-阿桂-event-zili
  - key: climax
    name: 密陈将帅龃龉以图和衷
    labels:
      zh: 和衷匡救
    start_date: 1772-03-12
    highlight_event_id: guji-阿桂-event-mizou
  decisions:
  - date: 1772-03-05
    title_zh: 受参赞之命即赴温福军营
    rationale: 以参赞协同进剿小金川当速会合共图灭贼之故
  - date: 1772-03-12
    title_zh: 据实密奏军营和衷情形
    rationale: 将帅不睦必误大事当屏去嫌疑据实上陈之故
- id: guji-阿桂-endeavor-2
  title_zh: 再定两金川成名受封
  summary_zh: 襄定小金川后复与温福等会剿金川索诺木，直捣美诺勒乌围，奏凯晋封一等诚谋英勇公
  phases:
  - key: breakthrough
    name: 两路会合直捣美诺
    labels:
      zh: 扫穴犁庭
    start_date: 1776-02-01
    highlight_event_id: guji-阿桂-event-pingding
  - key: closure
    name: 奏凯班师论功受封
    labels:
      zh: 功成受封
    start_date: 1776-04-15
    highlight_event_id: guji-阿桂-event-pingding
  decisions:
  - date: 1773-08-01
    title_zh: 请并力声讨藏匿罪酋之金川
    rationale: 索诺木勾通僧格桑助逆且侵地不退不可不并剿之故
  - date: 1776-04-15
    title_zh: 以要隘设镇控制金川善后
    rationale: 既定小金川当择要驻兵以制大金川永靖边徼之故
