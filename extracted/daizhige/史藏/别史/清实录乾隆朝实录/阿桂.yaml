    start_date: 1779-03-20
    highlight_event_id: guji-阿桂-event-2
  decisions:
  - date: 1779-03-15
    title_zh: 决意舍旧引河另于十堡新挑引河
    rationale: 旧河距口太近不得势不能引溜当通盘筹核不存省费守株之见
  - date: 1779-03-17
    title_zh: 定以极宽极深建瓴挑挖并培筑宽厚拦黄坝
    rationale: 非宽深不能掣动大溜坝单薄则闪挫虽费浮原估亦不靳惜求一举集事
