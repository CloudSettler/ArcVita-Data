      - 赶种
    start_date: 1783-04-16
    highlight_event_id: guji-阿桂-event-reward
  - key: climax
    name: 交部议叙优奖在事诸臣
    labels:
      zh:
      - 议叙
      - 优奖
    start_date: 1783-04-16
    highlight_event_id: guji-阿桂-event-reward
  - key: closure
    name: 重修惠安观昭妥侑
    labels:
      zh:
      - 崇奉
      - 答庥
    start_date: 1783-04-16
    highlight_event_id: guji-阿桂-event-reward
  decisions:
  - date: 1783-04-16
    title_zh: 以北岸涸出地易南岸占用地
    rationale: 若任民自占则豪强多占膏腴贫民失所，官为丈量照数拨给，多余召募佃种收租备河工公用
  - date: 1783-04-16
    title_zh: 请鸠工重修惠安观颁扁致祭
    rationale: 要工合龙全赖河神默佑，宜益伸崇奉仰答神庥肃观瞻而昭妥侑
events:
- id: guji-阿桂-event-birth
  date: 1717
  year_of: 1717
  title_zh: 降生
  description: 康熙五十六年生于章佳氏家，后袭云骑尉，历军机重臣
- id: guji-阿桂-event-open-river
  date: 1783-04-02
  year_of: 1783
  title_zh: 开放兰阳新河大溜全掣
  description: 督同将弁逐步进做，初一日开放新河，奔腾掣溜，全黄复故道直达归海
- id: guji-阿桂-event-close-dragon
  date: 1783-04-14
  year_of: 1783
  title_zh: 金门断流合龙庆成
  description: 十三日辰刻挂缆堵合，十四日辰刻金门一带俱已断流，坝前渐次澄淤，黄流顺轨
- id: guji-阿桂-event-reward
  date: 1783-04-16
  year_of: 1783
  title_zh: 交部议叙加赏受命善后
  description: 以办理得宜交部议叙加赏荷包，查明在工文武分别等第议叙，请修惠安观候颁扁额，受命丈量拨换民地
- id: guji-阿桂-event-death
  date: 1797-10-10
  year_of: 1797
  title_zh: 逝世
  description: 嘉庆二年八月十八日卒于京师，谥文成，配享太庙
