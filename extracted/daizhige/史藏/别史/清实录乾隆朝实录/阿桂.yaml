  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70961.md
endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 定西将军分路进剿直取勒乌围
  summary_zh: 乾隆三十八年至四十一年任定西将军，主持第二金川之役，由谷噶党坝分路压勒乌围，以冲天炮摧碉，终平大小金川
  phases:
