    labels:
      zh: 夜袭破碉
    start_date: 1774-07-12
    highlight_event_id: guji-阿桂-event-1774-lewuwai
  - key: climax
    name: 压境勒乌围炮摧坚碉
    labels:
      zh: 炮火压境
    start_date: 1775-01-01
    highlight_event_id: guji-阿桂-event-1776-pingjinchuan
  - key: closure
    name: 噶尔崖荡平凯旋论功
    labels:
      zh: 荡平凯旋
    start_date: 1776-03-01
    highlight_event_id: guji-阿桂-event-1776-pingjinchuan
  decisions:
  - date: 1774-07-15
    title_zh: 斥僧格桑诈死不受其献
    rationale: 揭破贼酋以献尸缓兵之诡计，明告必擒索诺木兄弟以绝番众侥幸，聚力攻坚不动摇
  - date: 1774-07-20
    title_zh: 请铸冲天炮运木样赴营就近成造
    rationale: 石碉墙厚常炮难透，以西瓜炮坠碉烘发最为得力，就近铸造以速行程而利攻坚
- id: guji-阿桂-endeavor-2
  title_zh: 抚远大将军渡海平定林爽文
  summary_zh: 乾隆五十一年末台湾天地会林爽文庄大田起事，命为抚远大将军渡海督师，冒风驰援府城，南北会剿，海疆底定
  phases:
  - key: brewing
    name: 奉命渡海筹划进剿
    labels:
      zh: 临危受命
    start_date: 1787-11-01
    highlight_event_id: guji-阿桂-event-1788-taiwan
  - key: breakthrough
    name: 冒风登陆驰援府城
    labels:
      zh: 渡海解围
    start_date: 1787-12-01
    highlight_event_id: guji-阿桂-event-1788-taiwan
  - key: climax
    name: 分路会剿南北并进
    labels:
      zh: 分进合击
    start_date: 1788-01-10
    highlight_event_id: guji-阿桂-event-1788-taiwan
  - key: closure
    name: 生擒二逆献俘凯旋
    labels:
      zh: 献俘叙功
    start_date: 1788-04-01
    highlight_event_id: guji-阿桂-event-1788-taiwan
  decisions:
  - date: 1787-12-15
    title_zh: 亲统劲旅冒风横渡
    rationale: 府城被围经年救兵如救火，不候风色转顺即率巴图鲁侍卫先渡以定军心民心
  - date: 1788-02-01
    title_zh: 南北分兵并举不专攻一隅
    rationale: 林爽文踞大里杙庄大田踞凤山南北相距遥远，若逐次攻剿必顾此失彼，须同时并举使贼不相救
