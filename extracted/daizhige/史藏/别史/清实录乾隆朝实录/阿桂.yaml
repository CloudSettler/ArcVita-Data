  lesson: 治河当顺水性恤民力，敬天祀神，谋定而后动，方能一举蒇功永庆安澜
  summary_first_person: 吾乃阿桂，钦差督办豫省曲家楼漫口，于兰阳另筑新堤疏挑引渠，展限至桃汛开放，大溜全掣，金门断流，黄流复归故道，仰邀天佑神助，幸得蒇工，惟愿拨地安民，漕运遄行
