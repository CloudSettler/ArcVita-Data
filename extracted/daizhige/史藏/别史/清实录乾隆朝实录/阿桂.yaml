      zh: 因俗善用
    start_date: 1773-07-28
    highlight_event_id: guji-阿桂-event-1
  decisions:
  - date: 1773-07-27
    title_zh: 谕杂谷头人如五福派调土兵即听调拨
    rationale: 土司恭顺令其攻夺碉卡必听从出力可助官军分剿
  - date: 1773-07-28
    title_zh: 议以攻而有利饵土兵争先
    rationale: 番性贪得勇于私斗官派兼派内地兵反分兵势不如许以利令其踊跃
