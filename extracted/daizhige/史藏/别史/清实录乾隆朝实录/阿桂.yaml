    highlight_event_id: guji-阿桂-event-trade
  - key: closure
    name: 奏停内地购办
    labels:
      zh: 停办省费
    start_date: 1761-04-01
    highlight_event_id: guji-阿桂-event-stopbuy
  decisions:
  - date: 1761-04-01
    title_zh: 奏请停购内地牛驴
    rationale: 内地一牛可值马四疋一驴可值马二疋今贸易马多且可耕作故请除现办外嗣后陕甘哈密巴里坤不必购办
  - date: 1761-04-05
    title_zh: 请留骒马孳生群牧
    rationale: 所换骒马一二年即成大群留于本地牧放可永资屯田
- id: guji-阿桂-endeavor-2
  title_zh: 阿克苏诸城马匹就近拨补
  summary: 舒赫德咨取马二千以伊犁乌鲁木齐所得就近拨送免巴里坤远解
  phases:
  - key: brewing
    name: 舒赫德咨取军马
    labels:
      zh: 咨取军马
    start_date: 1761-02-01
    highlight_event_id: guji-阿桂-event-alloc
  - key: breakthrough
    name: 筹议就近拨送
    labels:
      zh: 就近拨补
    start_date: 1761-03-15
    highlight_event_id: guji-阿桂-event-alloc
  - key: climax
    name: 拣选屯田足用外马匹分送
    labels:
      zh: 分送阿克苏
    start_date: 1761-03-20
    highlight_event_id: guji-阿桂-event-alloc
  decisions:
  - date: 1761-03-20
    title_zh: 以伊犁马选送阿克苏
    rationale: 与其自巴里坤解送不如于伊犁所得除屯田足用外挑选一千送往阿克苏其余自乌鲁木齐办送以省道远
  - date: 1761-03-22
    title_zh: 巴里坤马匹仍本地牧放
    rationale: 伊犁所换已足则巴里坤等处马匹不必远调仍本地牧放以保膘壮
