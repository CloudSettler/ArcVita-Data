  title_zh: 奏准就近拨马赴阿克苏并留牧巴里坤
  date: 1761-03-20
  year_of: 1761
  description: 乾隆二十六年三月奏称准舒赫德咨取马二千请于伊犁所得除屯田足用外选一千送阿克苏余自乌鲁木齐办送巴里坤马仍本地牧放得旨照行并授内大臣
