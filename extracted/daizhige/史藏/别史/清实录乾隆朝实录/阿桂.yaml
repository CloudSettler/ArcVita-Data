  decisions:
  - date: 1782-10-07
    title_zh: 不存回护首疑陈辉祖
    rationale: 王站柱供称金四千数百两银二三万两底册三分存浙与进呈不符非督抚主使不能为故据实覆奏
  - date: 1782-10-08
