  reign_ref: 乾隆四十六年辛丑六月
  archetype: 钦差经略重臣
  dilemmas:
  - 围困垂毙之贼宜耐心待毙以全官兵，抑或速攻以解宵旰之急
  - 陶庄引河既开而江南年年漫溢，宜直陈格碍以担干系，抑或回护前议以求无过
  - 甘肃监粮折色积弊通省染指，宜彻底根究以清流弊，抑或顾全大局以免罚及众人
  lesson: 围困以断水筑台为要，河防以履勘求实为要，钱粮以彻底较勘为要，皆不可存回护姑息之见
  summary_first_person: 我奉命钦差甘肃会同李侍尧剿办华林山逆回，四面围困，断绝水道，分路进扑，立栅筑台，耐心待毙，又会勘南河陶庄沈家窰诸工，查魏家庄漫溢之因，并奉旨彻底清查甘肃监粮私收折色冒销积弊，不敢稍存瞻徇
  source_urls:
