  title_zh: 仪封漫口引河堵合
  summary: 乾隆四十四至四十五年赴豫经理仪封决口，大展引河宽深，接做挑水坝逼溜北趋，乾隆四十五年二月十一日金门断流合龙
  phases:
  - key: brewing
    name: 展宽引河蓄势
    labels:
      zh: 展宽引河
    start_date: 1780-02-10
    highlight_event_id: guji-阿桂-event-yinhe
  - key: breakthrough
    name: 放溜顺风掣动
    labels:
      zh: 放溜掣溜
    start_date: 1780-03-10
    highlight_event_id: guji-阿桂-event-yinhe
  - key: climax
    name: 金门断流合龙
    labels:
      zh: 合龙断流
    start_date: 1780-03-15
    highlight_event_id: guji-阿桂-event-helong
  - key: closure
    name: 加镶外护候稳
    labels:
      zh: 镶压巩固
    start_date: 1780-03-16
    highlight_event_id: guji-阿桂-event-helong
  decisions:
  - date: 1780-03-10
    title_zh: 引河大展宽深接做挑水坝
    rationale: 屡成复毁皆因溜势南趋，故展宽引河逼溜北趋，以复故道
  - date: 1780-03-15
    title_zh: 趁顺风进埽收窄金门
    rationale: 连值顺风大溜掣至八分以上，机不可失，故南坝进埽一举堵合
- id: guji-阿桂-endeavor-2
  title_zh: 老坝堵筑善后核销
  summary: 合龙后督筑十六堡漫口大堤与老坝，涸出坝内余水填筑实土，查核钱粮，酌借牛具耔种，安置涸出地亩
  phases:
  - key: brewing
    name: 留工筹划善后
    labels:
      zh: 筹划善后
    start_date: 1780-03-16
    highlight_event_id: guji-阿桂-event-shanhou
  - key: breakthrough
    name: 赶筑漫口大堤
    labels:
      zh: 赶筑大堤
    start_date: 1780-03-18
    highlight_event_id: guji-阿桂-event-shanhou
  - key: climax
    name: 督修老坝过半
    labels:
      zh: 督修老坝
    start_date: 1780-03-25
    highlight_event_id: guji-阿桂-event-shanhou
  - key: closure
    name: 核销钱粮交代迎觐
    labels:
      zh: 核销迎觐
    start_date: 1780-04-01
    highlight_event_id: guji-阿桂-event-shanhou
  decisions:
  - date: 1780-03-16
    title_zh: 暂留工次不急赴行在
    rationale: 功已垂成更须巩固，老坝未固积水未涸，不可急急离工
  - date: 1780-03-20
    title_zh: 准奏销不议赔并究疏防
    rationale: 此番与寻常漫决不同，经手竭力，故准奏销，惟姚立德徐绩防护不慎须著落岁修赔补以示惩儆
