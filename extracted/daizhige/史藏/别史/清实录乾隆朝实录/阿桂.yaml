  title_zh: 伊犁乌鲁木齐贸易马匹以资屯耕
  summary: 经营伊犁屯田以哈萨克贸易马匹代内地购办牛驴省经费而足耕用
  phases:
  - key: brewing
    name: 经画伊始内地办送牲只
    labels:
      zh: 屯田经始
    start_date: 1760-06-01
