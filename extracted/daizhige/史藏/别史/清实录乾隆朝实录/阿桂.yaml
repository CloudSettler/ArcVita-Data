  archetype: 征伐经略型名将
  dilemmas:
  - 瘴疠久围与速退保全之间如何权衡国体与士卒性命
  - 经略病重难主事时副帅当专擅迁就还是据实候旨
  lesson: 退兵一速则示弱于敌善后迁就则养痈贻患当持重渐退并严守信约
  summary_first_person: 我随经略傅恒副领征缅之师老官屯围困值瘴疠盛行人力难施我率领队诸臣具结请彻及缅使乞降遂即日全彻班师未料反为缅酋窥破虚实致后续索土司贡约稽迟遂致上严切申饬此我急于自了之过也
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0859.html
