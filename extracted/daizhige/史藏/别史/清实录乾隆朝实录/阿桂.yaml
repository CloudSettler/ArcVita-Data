events:
- id: guji-阿桂-event-birth
  title_zh: 出生于勋戚之家
  date: 1717-09-07
  year_of: 1717
  type: birth
  description: 康熙五十六年七月初二生于京师，父阿克敦官至大学士，家学渊源而膺荫入仕
- id: guji-阿桂-event-1769
  title_zh: 老官屯围困后罢兵议款
  date: 1769-12-01
  year_of: 1769
  type: 事业
  description: 大军攻围老官屯，水土恶劣官兵损伤，奉旨彻兵，缅酋遣人纳款，遂允降班师，埋下反复之因
- id: guji-阿桂-event-1771
  title_zh: 奏请大举征缅被严饬交部
  date: 1771-05-06
  year_of: 1771
  type: 事业
  description: 乾隆三十六年三月己巳前奏请本年大举进剿并请来京面陈，又列马骡粮石六条，高宗以其取巧畏事空言塞责，严饬交部议处，令明白回奏，晓谕中外
- id: guji-阿桂-event-1776
  title_zh: 督师平定大小金川
  date: 1776-03-01
  year_of: 1776
  type: 事业
  description: 接办第二阶段金川之役，持重而进，攻克勒乌围噶喇依，大功告成，晋封一等公，入为武英殿大学士军机大臣
- id: guji-阿桂-event-death
  title_zh: 病逝于京师
  date: 1797-10-10
  year_of: 1797
  type: death
  description: 嘉庆二年八月二十日卒于京师，谥文成，配享太庙，为乾隆朝武功柱石之终
