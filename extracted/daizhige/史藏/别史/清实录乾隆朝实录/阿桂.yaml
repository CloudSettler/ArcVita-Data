  decisions:
  - date: 1788-09
    title_zh: 断窖金洲为受病之源请抄治萧姓
    rationale: 众口一词且履勘属实，贪植芦苇壅遏江流致溃决，必须严治以儆效尤
  - date: 1788-09-15
    title_zh: 议土堤加高培厚毋庸改建石工
    rationale: 江水深数丈难以措手，土堤坚实硪筑已足保障，不必糜费改石
