    highlight_event_id: guji-阿桂-event-nazhamu
  decisions:
  - date: 1773-05-11
    title_zh: 以瘟死离心为灭亡兆仍主进剿
    rationale: 群逆罪恶贯盈自取灭亡，更当努力深入，不可因此稍有延缓
  - date: 1773-05-22
    title_zh: 预判窘迫时献僧格桑而不中止攻势
    rationale: 屡奉谕旨甚明，胸有定见，使献俘解免之谋不得苟延
