endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 小金川参赞襄办资哩之战
  summary_zh: 乾隆三十七年授参赞大臣赴西路军营，会同温福伍岱攻剿资哩，筹议绕取木南坝并密陈和衷事宜
  phases:
  - key: brewing
