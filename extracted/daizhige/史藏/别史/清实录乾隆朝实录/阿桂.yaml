- id: guji-阿桂-event-1
  date: 1781-03-05
  year_of: 1781
  title_zh: 查抄王燧审办浙江贪墨案
  description: 赴浙查抄杭嘉湖道王燧赀产二十余万两，查已故知府陈虞盛置买房产田产，参奏其藉办差侵蚀并究商办官捐款项
  place_zh: 浙江杭州
- id: guji-阿桂-event-2
  date: 1781-03-10
  year_of: 1781
  title_zh: 审拟王燧发遣被斥轻纵申饬
  description: 与陈辉祖审拟王燧照不枉法论发往伊犁永远充当苦差，上以勒买民女房屋夥开银号与枉法无异批交刑部从重改拟绞候并传旨申饬
  place_zh: 浙江杭州
- id: guji-阿桂-event-3
