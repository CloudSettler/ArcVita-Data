  birth_date: 1717-09-07
  death_date: 1797-08-10
  era: 清代
  reign_ref: 乾隆
  archetype: 经略靖难名将
  dilemmas:
  - 碉卡险坚须以重炮摧坚而山路转运维艰，当持重缓进还是分路急攻
  - 土兵前驱奋勇而满洲索伦不可落人后，当专仗土兵还是满土并用以全军誉
  - 贼酋诈称僧格桑已死以献尸缓兵，当派人验看受降还是斥其诡诈直捣巢穴
  lesson: 审地料敌不为浮言所惑，以正合以奇胜，炮火摧坚与满土协力并举方能荡平险巢
  summary_first_person: 我是章佳阿桂，承父阿克敦家学入仕，历准部回部军功，晚以定西将军主持金川之役。乾隆三十九年六月，我与丰昇额、色布腾巴勒珠尔分驻谷噶，督五福等夜袭穆尔津冈，焚碉歼贼，又斥僧格桑诈死之计，晓谕必擒索诺木兄弟，并请以冲天炮就近铸造摧坚，终至勒乌围噶尔崖荡平。后又渡海平林爽文，老而不息，惟知以国事为家事
  source_urls:
