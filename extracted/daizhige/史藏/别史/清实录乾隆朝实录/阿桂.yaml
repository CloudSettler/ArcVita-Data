    title_zh: 以婉言拟檄催索
    rationale: 欲催缅送还内地之人而措词迁就无严厉之语反列好生允准班师
  - date: 1770-05-20
    title_zh: 奏称缅不敢扰边
    rationale: 恃巧言掩饰断言必无侵扰欲冀无事冀治去彰宝自任总督
