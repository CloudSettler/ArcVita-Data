  date: 1780-03-10
  year_of: 1780
  kind: career
  description: 乾隆四十五年二月初六开放引河，日见畅达，连值顺风，大溜掣至八分以上
- id: guji-阿桂-event-helong
  title_zh: 仪封金门断流合龙
  date: 1780-03-15
  year_of: 1780
  kind: career
  description: 乾隆四十五年二月十一日午刻两坝拢合，金门断流，大溜全入新河，徐州长水丈余，溜势湍激，全黄复归故道
- id: guji-阿桂-event-shanhou
  title_zh: 督筑老坝核销善后
  date: 1780-03-25
  year_of: 1780
  kind: career
  description: 合龙后督催堵筑十六堡漫口大堤与老坝，设法涸出余水填筑实土，会同李奉翰陈辉祖筹善后查钱粮，俟固后赴江南途次迎觐
