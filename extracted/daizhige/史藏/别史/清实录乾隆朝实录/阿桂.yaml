  decisions:
  - date: 1779-05-15
    title_zh: 请先借两月口粮耔种
    rationale: 若五月合龙高阜秋禾可收若稽延大汛则低地愈淹故先借粮种以资接济待秋徵前再分别具奏
  - date: 1779-08-20
    title_zh: 迅查高阜田禾不必待秋徵
    rationale: 七月中旬漫工未合沁水涨发汇河漫注倍多大局已定当即查明速奏候旨加赈
