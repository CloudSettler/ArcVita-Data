    labels:
      zh: 淤船搭解
    start_date: 1785-10-15
    highlight_event_id: guji-阿桂-event-qingkou-1
  - key: climax
    name: 議定戽水四尺立樁之限
    labels:
      zh: 戽水立限
    start_date: 1785-11-05
    highlight_event_id: guji-阿桂-event-qingkou-1
  - key: closure
    name: 會奏場河引潮濟運通順
    labels:
      zh: 場河濟運
    start_date: 1785-11-10
    highlight_event_id: guji-阿桂-event-qingkou-1
  decisions:
  - date: 1785-10-15
    title_zh: 淤阻漕米通融搭解明歲灑帶
    rationale: 張福口已築壩淤船須明春啟壩拉出本年不能回空則以江西浙江二千漕船分搭二萬餘石新漕不致遲誤
  - date: 1785-11-05
    title_zh: 沿河分段立樁限戽水灌田
    rationale: 農田車戽耗水易致漕淺故照衛河例水深四尺外許戽消存四尺即禁以保運河浮送以兼農漕
