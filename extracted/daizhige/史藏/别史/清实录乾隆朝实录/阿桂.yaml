  decisions:
  - date: 1782-09-01
    title_zh: 请展限至春间桃汛开放
    rationale: 堤渠并举需夫多，邻省助夫非便，令豫省夫役从容如式，俾黄水刷河得力
  - date: 1783-04-02
    title_zh: 定期开放引河建瓴下注
    rationale: 于迤南一带设法利导，趁桃汛和平通盘筹画，一举成功复黄故道
- id: guji-阿桂-endeavor-2
  title_zh: 善后拨地赈恤崇奉河神
  summary: 丈量南北岸地亩照数换给，议叙在工人员，重修惠安观
  phases:
  - key: brewing
    name: 查勘南北岸地亩空实
    labels:
