endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 南路牵制进剿小金川
  summary: 受命专办南路，由东山梁觅间进兵，得卡歼贼后以粮运艰难暂还，转为驻守牵掣以缀贼势
  start_date: 1772-04-01
  highlight_event_id: guji-阿桂-event-1
  phases:
  - key: brewing
    name: 受命督办南路
    labels:
      zh:
      - 筹划驻守
  - key: breakthrough
    name: 东山梁攻卡杀贼
    labels:
      zh:
      - 进攻得卡
  - key: climax
    name: 路险粮艰彻回
    labels:
      zh:
      - 持重暂还
  - key: closure
    name: 驻守牵掣待机
    labels:
      zh:
      - 牵制西路之敌
  decisions:
  - date: 1772-08-06
    title_zh: 东山梁得卡后不冒进而彻回
    rationale: 山高路险且不敢冞入，兼之粮食接济艰难，冒险轻进恐致覆败，故暂还以保兵气
  - date: 1772-08-10
    title_zh: 议留兵牵制以助西路
    rationale: 南路进取颇难而西路攻打正紧，若得僻路绕过僧格宗则夹攻，否则留兵牵掣亦可分贼势助西路并力
- id: guji-阿桂-endeavor-2
  title_zh: 整顿南路军纪兵制
  summary: 纠正前督桂林以侍卫章京为宾客之失，令其与绿营领兵官同住领队，朝夕相习以期调度得宜
  start_date: 1772-07-01
  highlight_event_id: guji-阿桂-event-2
  phases:
  - key: brewing
    name: 察南路积习
    labels:
      zh:
      - 体察情形
  - key: breakthrough
    name: 侍卫章京分发领队
    labels:
      zh:
      - 整顿编制
  - key: climax
    name: 同住同行合心
    labels:
      zh:
      - 官兵相习
  - key: closure
    name: 相机进剿不懈
    labels:
      zh:
      - 守中待进
  decisions:
  - date: 1772-08-08
    title_zh: 令侍卫章京与绿营官同住
    rationale: 亲驻其地方能体察攻剿情形并知兵丁出力与否，临阵方能调度合一，改宾客相待之错谬
  - date: 1772-08-12
    title_zh: 时刻察探以乘虚攻捣
    rationale: 贼因西路吃紧彻南路之贼往援西路，南路守拒必疏，当觅间冞入，不可日久生懈坐失良机
