  - key: breakthrough
    name: 加紧挑挖引溜沟并疏浚正引河
    labels:
      zh: 挑浚引河引沟
    start_date: 1779-05-12
    highlight_event_id: guji-阿桂-event-yinhe-kaifang
  - key: climax
    name: 专由南坝进埽逼溜北入引河
    labels:
      zh: 南坝进埽逼溜
    start_date: 1779-05-15
    highlight_event_id: guji-阿桂-event-nanba-jinsao
  - key: closure
    name: 开放引河引沟掣动大溜以待合龙
    labels:
      zh: 开放引河待合龙
    start_date: 1779-05-18
    highlight_event_id: guji-阿桂-event-yinhe-kaifang
  decisions:
  - date: 1779-05-12
    title_zh: 议定南坝多做逼向北首
    rationale: 北坝屡冲臌裂难站唯南坝多做如挑水坝式逼溜北入引河尚为得势
  - date: 1779-05-18
    title_zh: 定于四月二十六日开放引河引沟
    rationale: 引溜沟及正引河加倍宽深告竣须乘西南风顺掣动全溜畅注东北以利进埽合龙
- id: guji-阿桂-endeavor-2
  title_zh: 会勘豫皖漫水灾地请赈蠲接济
  description: 会同袁守侗陈辉祖查明仪封以下汪洋未消州县及亳州蒙城等处请借口粮耔种加恩蠲免
  phases:
  - key: brewing
    name: 奉旨查明漫水未消不能耕作州县
    labels:
      zh: 奉旨查勘灾地
    start_date: 1779-05-06
    highlight_event_id: guji-阿桂-event-zhenxu-qingmian
  - key: breakthrough
    name: 奏称涸出之地听民耕种旧河淤垫成沃壤无庸复还故道
    labels:
      zh: 分别涸出淤垫
    start_date: 1779-05-10
    highlight_event_id: guji-阿桂-event-zhenxu-qingmian
  - key: climax
    name: 请于麦收工竣后查明无力者借给两月口粮
    labels:
      zh: 请借口粮耔种
    start_date: 1779-05-14
    highlight_event_id: guji-阿桂-event-zhenxu-qingmian
  - key: closure
    name: 统俟秋徵前查明实在情形分别请旨蠲免
    labels:
      zh: 秋徵分别蠲免
    start_date: 1779-05-16
    highlight_event_id: guji-阿桂-event-zhenxu-qingmian
  decisions:
  - date: 1779-05-10
    title_zh: 涸出沃壤听民垦种
    rationale: 惠济河水已归槽时和驿漫地涸出新冲河外旧河淤垫成沃壤可乘时耕种以资生计
  - date: 1779-05-14
    title_zh: 被淹户口借给口粮耔种
    rationale: 仪封以下汪洋一片经年淹浸无由补种贫民拮据照夏灾例借两月口粮工竣涸出可赶种者再借耔种
