  summary_first_person: 吾章佳阿桂，久历戎行，奉命为定西将军，深入两金川五年，荡平逆酋，振旅凯旋，蒙郊劳饮至之荣，又以富德在途不法滥应夫马据实奏闻，只知持重镇静以安西陲
