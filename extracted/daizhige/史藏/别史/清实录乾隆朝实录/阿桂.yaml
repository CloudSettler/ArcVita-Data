      zh: 勘察筹议
    start_date: 1760-03-01
    highlight_event_id: guji-阿桂-event-yili
  - key: breakthrough
    name: 奏陈增派回人千户屯田
    labels:
      zh: 屯田增垦
    start_date: 1760-09-01
    highlight_event_id: guji-阿桂-event-yili
  - key: climax
    name: 议定增兵驻防马步配额
    labels:
      zh: 驻防定额
    start_date: 1760-10-01
    highlight_event_id: guji-阿桂-event-yili
  - key: closure
    name: 规划海努克察罕乌苏固勒扎筑城
    labels:
      zh: 筑城设治
    start_date: 1760-10-15
    highlight_event_id: guji-阿桂-event-yili
  decisions:
  - date: 1760-10-01
    title_zh: 请增派屯田回人至一千户
    rationale: 伊犁收获可敷千户之食分批遣发既不致竭蹶又可节省粮石
  - date: 1760-10-01
    title_zh: 请分春秋调兵驻防屯田
    rationale: 以收获多寡定官兵四五千之额随时出派可不烦内地之力
- id: guji-阿桂-endeavor-2
  title_zh: 西陲军务历练与参赞筹边
  summary: 早年随军西北熟悉台站军需后以参赞大臣身份经理边务查办要事
  phases:
  - key: brewing
    name: 随军熟悉西路台站军需
