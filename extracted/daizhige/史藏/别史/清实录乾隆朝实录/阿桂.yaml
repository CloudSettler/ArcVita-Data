  - key: climax
    name: 持械妇女一并正法
    labels:
      zh: 严惩拒敌
    start_date: 1765-10-01
    highlight_event_id: guji-阿桂-event-aftermath
  - key: closure
    name: 肃清乌什以安西陲
    labels:
      zh: 定乱安边
    start_date: 1765-12-01
    highlight_event_id: guji-阿桂-event-aftermath
  decisions:
  - date: 1765-08-10
    title_zh: 请分妇女幼童送伊犁与拒敌者正法
    rationale: 贼众穷蹙仍怙恶不悛，连妇女亦敢抗拒，若姑息则不足以儆凶顽
  - date: 1765-10-01
    title_zh: 克复后彻底查讯持械妇女
    rationale: 以死拒守者自应剿杀，须核实拒敌实迹而后行法以示痛恨
events:
- id: guji-阿桂-event-birth
  date: 1717-09-07
  year_of: 1717
  title_zh: 出生于章佳氏家
  description: 康熙五十六年八月初二生，阿克敦之子，後以军功起家
- id: guji-阿桂-event-wushi-siege
  date: 1765-08-01
  year_of: 1765
  title_zh: 奏报乌什贼食将尽
  description: 乾隆三十年七月，阿桂奏乌什贼众抗拒，擒获妇女，贼食将尽，俟调兵一至即可攻围，并言已毁其粮食
- id: guji-阿桂-event-reprimand
  date: 1765-08-05
  year_of: 1765
  title_zh: 与明瑞同受申饬须一体协办
  description: 高宗以其未能力战，掘堑围城迂谬，东西分营各存畛域，严加申饬，命功过同之，一心协办
- id: guji-阿桂-event-aftermath
  date: 1765-08-10
  year_of: 1765
  title_zh: 奉命克复后严办拒敌妇女
  description: 奉谕克复乌什后查讯贼人妇女内曾经持械拒敌者一并正法，毋得姑息
- id: guji-阿桂-event-death
  date: 1797-10-10
  year_of: 1797
  title_zh: 卒于京师
  description: 嘉庆二年八月十八卒，谥文成，图形紫光阁，列功臣之一
