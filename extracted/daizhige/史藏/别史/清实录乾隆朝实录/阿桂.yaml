endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 谷噶了口破险深入直指勒乌围
  summary: 乾隆三十九年由谷噶了口攻克险隘，乘胜深入，为合攻勒乌围打开局面。
  phases:
  - key: brewing
    name: 探查了口路径积粮待进
    labels:
      zh:
      - 谷噶
      - 察看地形
      - 筹粮
    start_date: 1774-01-15
    highlight_event_id: guji-阿桂-event-1774-liaokou
  - key: breakthrough
    name: 攻克了口乘晴深入
    labels:
      zh:
      - 了口
      - 攻坚
      - 深入
    start_date: 1774-02-10
    highlight_event_id: guji-阿桂-event-1774-liaokou
  - key: climax
    name: 候援并力会攻勒乌围
    labels:
      zh:
      - 勒乌围
      - 会剿
      - 候援
    start_date: 1774-02-25
    highlight_event_id: guji-阿桂-event-1774-lewuwei
  - key: closure
    name: 安设后路防兵以固根本
    labels:
      zh:
      - 后路
      - 分防
      - 固守
    start_date: 1774-03-01
    highlight_event_id: guji-阿桂-event-1774-lewuwei
  decisions:
  - date: 1774-02-10
    title_zh: 遣熟番策旺往丰昇额营作向导
    rationale: 凯立叶进兵艰涩，借熟识路径之人引导绕道，冀与谷噶之兵会合夹击。
  - date: 1774-02-25
    title_zh: 请以新到川鄂兵换出旧防兵充攻剿
    rationale: 川省绿营守有余而战不足，以新兵分防，换旧防精兵赴前敌攻坚，兵力方得实济。
- id: guji-阿桂-endeavor-2
  title_zh: 统筹西路粮运调度南北策应
  summary: 督理布朗郭宗僧格宗粮道，协调丰昇额明亮南北两路，使军粮人夫源源接济攻剿。
  phases:
  - key: brewing
    name: 留富勒浑督办西路粮务
    labels:
      zh:
      - 粮务
      - 西路
      - 留督
    start_date: 1774-02-01
    highlight_event_id: guji-阿桂-event-1774-liangyun
  - key: breakthrough
    name: 楸砥新路修通转运渐捷
    labels:
      zh:
      - 楸砥
      - 新路
      - 转运
    start_date: 1774-02-15
    highlight_event_id: guji-阿桂-event-1774-liangyun
  - key: climax
    name: 调成都驻防及鄂川兵分拨两路
    labels:
      zh:
      - 调兵
      - 南路
      - 北路
    start_date: 1774-02-20
    highlight_event_id: guji-阿桂-event-1774-lewuwei
  - key: closure
    name: 派王进泰守僧格宗扼要护运
    labels:
      zh:
      - 僧格宗
      - 护粮
      - 驻守
    start_date: 1774-03-01
    highlight_event_id: guji-阿桂-event-1774-liangyun
  decisions:
  - date: 1774-02-15
    title_zh: 奏留富勒浑随大营督办一切
    rationale: 西路深入之后粮务最重，非专员随营就近筹运不可，轻离则转运必误。
  - date: 1774-02-20
    title_zh: 催湖北绿营千名速赴南路协剿
    rationale: 明亮南路兵少，卡卡角初下正需添助，以鄂兵驰往奎林一路，可壮声援速定马尔邦。
events:
- id: guji-阿桂-event-birth
  title_zh: 出生于京师章佳氏家
  date: 1717-09-07
  year_of: 1717
  description: 康熙五十六年八月初三生，满洲正蓝旗人，后由军功洊至大学士将军。
- id: guji-阿桂-event-1774-liaokou
  title_zh: 谷噶了口攻克乘势深入
  date: 1774-02-10
  year_of: 1774
  description: 乾隆三十九年正月率兵由谷噶了口攻入，克险之后天气放晴，官兵进剿得势，上盼捷音甚切。
- id: guji-阿桂-event-1774-lewuwei
  title_zh: 筹合丰昇额明亮并攻勒乌围
  date: 1774-02-25
  year_of: 1774
  description: 乾隆三十九年二月议令丰昇额由凯立叶或赴谷噶助剿，并调川鄂新兵分拨南北，以壮攻勒乌围之师。
- id: guji-阿桂-event-1774-liangyun
  title_zh: 督理布朗郭宗军粮转运
  date: 1774-02-15
  year_of: 1774
  description: 乾隆三十九年二月督办西路粮务，楸砥新路修竣，布朗郭宗积粮趱运，人夫出力，军食渐充。
- id: guji-阿桂-event-death
  title_zh: 病逝于京师
  date: 1797-10-10
  year_of: 1797
  description: 嘉庆二年八月二十日卒，谥文成，配享太庙，为乾隆朝武功重臣之首。
