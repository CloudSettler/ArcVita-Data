  era: 清乾隆朝
  reign_ref: 乾隆三十七年壬辰
  archetype: 持重奋勉的统帅型名将
  dilemmas:
  - 南路山高路险，冒进则粮绝兵危，坐守则有名无实，如何权衡牵制与进取
  - 西路需并力而南路亦需留兵，兵力有限之下如何分配新到昭通湖广之兵
  lesson: 遇险不轻进，持重待机而动，整顿官兵同住同行方能上下一心，牵制亦是进取之助
  summary_first_person: 我是阿桂，章佳氏子，久历戎行。此番督办南路小金川之役，东山梁得卡而畏险暂还，我知路险粮难，不敢冞入。我将侍卫章京分发领队，与绿营同住，亲察兵情，并筹绕过僧格宗前后夹攻之策，若无可乘之隙，宁愿留兵牵缀贼势以助西路，静待可进之机再行捣穴。
  source_urls:
