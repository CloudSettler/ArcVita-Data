  decisions:
  - date: 1781-08-02
    title_zh: 会同萨载李奉翰覆勘陶庄格碍据实入告
    rationale: 自开陶庄新河江南连岁冲溢，郭家渡魏家庄相继漫决，必按实情讲求审度，不存回护方慰廑念
  - date: 1781-08-03
    title_zh: 四面较勘王亶望王廷赞折色供词不涉颟顸
    rationale: 定数五十五两收银交首府总办，既称谷多又年年报赈，必有短价勒买虚开冒销，故严查道府结报指名参奏
events:
- id: guji-阿桂-event-birth
  title_zh: 阿桂出生
  date: 1717-09-07
  year_of: 1717
  description: 康熙五十六年出生，满洲正蓝旗人，后为乾隆朝大学士公钦差经略重臣
- id: guji-阿桂-event-siege
  title_zh: 四面围困华林山断水立栅筑台
  date: 1781-08-01
  year_of: 1781
  description: 会同李侍尧将逆回贼营四面围困断绝水道，贼夜缒水磨沟华林寺后刨泉盗水，官兵中路进扑屯练降番攀磡上扑，填塞旧井，南面拏立木栅接筑炮台，解萧德福赴热河审办，饬存记仁和罗江鳞
- id: guji-阿桂-event-river
  title_zh: 会勘南河魏家庄漫口陶庄引河
  date: 1781-08-02
  year_of: 1781
  description: 李奉翰报邳睢魏家庄六月初一日未时漫溢，朱笔点记沈家窰塌崖木龙挑水坝诸处，奉旨会同萨载李奉翰绘图贴说驰奏，详究自开陶庄引河以来年年漫溢有无纡回格碍，饬豫东实力防护
- id: guji-阿桂-event-grain
  title_zh: 奉旨彻底查办甘肃监粮折色案
  date: 1781-08-03
  year_of: 1781
  description: 王廷赞供私收折色定数五十五两改归首府收捐，王亶望供通融办理捐多谷多，奉旨会同李侍尧详悉查明短价勒买冒销分肥及道府捏结，指名参奏，兼议兰州展城跨山临水善后
- id: guji-阿桂-event-death
  title_zh: 阿桂病逝
  date: 1797-10-10
  year_of: 1797
  description: 嘉庆二年八月十九病逝，历乾隆朝金川甘肃台湾诸役，晋一等诚谋英勇公，配享太庙
