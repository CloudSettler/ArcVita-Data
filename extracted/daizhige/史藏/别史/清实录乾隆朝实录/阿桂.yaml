  decisions:
  - date: 1765-08-01
    title_zh: 奏报贼食将尽俟调兵攻围
    rationale: 贼据城死守，城外水磨粮石已毁，以待生力合围可减少伤亡
  - date: 1765-08-05
    title_zh: 遵旨消除畛域与明瑞一体筹办
    rationale: 乌什非大城东西相隔不远，分营各守必蹈覆辙，功过同之故须协力
- id: guji-阿桂-endeavor-2
  title_zh: 克复善后查办持械拒敌者
  summary_zh: 奉命克复后严查妇女中持械抗拒者正法，不稍姑息，以儆怙恶
  phases:
  - key: brewing
