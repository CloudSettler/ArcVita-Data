  summary_first_person: 我为阿桂出身满洲章佳氏早年参赞军机后督川陕抚边疆乾隆二十九年值绰斯甲布九土司与郎卡相攻我奏请虚衷体察不必急办蒙上谕以鼠斗穴中为戒令我巡边审察待阿尔泰回川会商又值金川在藏学经喇嘛请回我请留置成都以察郎卡情形一生以安详镇定守边大体为要
