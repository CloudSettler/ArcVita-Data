    highlight_event_id: guji-阿桂-event-2
  decisions:
  - date: 1779-03-14
    title_zh: 抵工即与袁守侗等公同商酌可成之策
    rationale: 大工屡办未就多一人心思有益须亲勘实形再奏不为迎合
  - date: 1779-03-15
    title_zh: 断定顺堤拦黄坝激溜为患请酌拆以杀南岸溜势
    rationale: 大溜至坝不能下注激回逼口与其与漫口大溜争胜不如急则治标
- id: guji-阿桂-endeavor-2
  title_zh: 十堡另挑宽深引河掣溜归槽
  description: 审定旧引河近而不得势移向十堡依朱笔标示另挑宽深引河筑宽厚拦黄坝由西南向东北挑溜逼向引河
  phases:
  - key: brewing
