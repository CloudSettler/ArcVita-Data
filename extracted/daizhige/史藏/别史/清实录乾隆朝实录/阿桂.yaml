    title_zh: 奏明撒拉尔十二工新旧教仇杀缘由
    rationale: 马明心潜传新教贺麻六乎另立礼拜寺争教酿衅地方官逐而不究养痈贻患须据实严办以净根株
  - date: 1781-05-19
    title_zh: 请事平后趁兵威痛惩扎筏济贼诸处并添兵添官
    rationale: 洪济桥唐家川六处回子素附马明心且济贼渡河罪不容诛甘省驻兵太少临事远调不济须多添官兵时常操演以资镇压
events:
- id: guji-阿桂-event-birth
  date: 1717-09-07
  year_of: 1717
  title_zh: 出生
  description_zh: 章佳氏阿桂生於京师，满洲正蓝旗人，后袭一等武毅谋勇公。
- id: guji-阿桂-event-1
  date: 1781-04-29
  year_of: 1781
  title_zh: 自豫河工抵兰州接办剿捕
  description_zh: 乾隆四十六年四月二十一日续到兰州，与和珅联衔入告后经画措置始有条理，奉旨令和珅回京，剿捕善后俱交阿桂专办。
- id: guji-阿桂-event-2
  date: 1781-05-09
  year_of: 1781
  title_zh: 五月初二日进剿华林山贼
  description_zh: 官兵鱼贯攀崖进剿尚好而未快意，上谕以两金川为例促上紧妥速剿捕。
- id: guji-阿桂-event-3
  date: 1781-05-12
  year_of: 1781
  title_zh: 奏明新旧教起衅酿毒本末
  description_zh: 查明韩哈济总掌教与贺麻六乎另造新寺争教，马明心潜入撒拉尔传经，苏四十三戕害杨士玑新柱，勒尔谨措置乖方激变。
- id: guji-阿桂-event-4
  date: 1781-05-19
  year_of: 1781
  title_zh: 围困贼山筹议断水添兵
  description_zh: 贼困守山梁乏食，奉旨严守隘口昼夜巡查毋使一贼窜逸，占守山下水沟杜饮汲，并筹安定撒拉尔裁革掌教添驻官兵数千。
- id: guji-阿桂-event-death
  date: 1797-10-10
  year_of: 1797
  title_zh: 病卒於京师
  description_zh: 嘉庆二年八月二十日卒，谥文成，配享太庙。
