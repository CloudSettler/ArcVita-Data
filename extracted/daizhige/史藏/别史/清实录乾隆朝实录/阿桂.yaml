  - 大举速决以雪耻与持重待机以惜费之间如何抉择
  - 思家求退之私情与封疆待罪之公义之间如何自处
  lesson: 知天时地利之限则不妄动，服主上之严饬则能持重，方保晚节以成大功
  summary_first_person: 余出身勋戚，久历戎行，南征缅甸，备知瘴疠险远难为大举，乾隆三十六年春奏请筹备大进，实欲从容待机，反蒙严饬，乃知为将者当体国惜费，偏师扰边以疲敌，静候可乘，终以持重收功
