    title_zh: 奏请虚衷体察不必急急办理
    rationale: 土司仇衅相寻如鼠斗穴中宜先体勘确情再斟酌措置方得控驭大体
  - date: 1764-07-20
    title_zh: 部署巡边审察以待会商
    rationale: 藉巡边审动静一切安详镇定坦然行所无事待阿尔泰回任商搉可免张大事端
