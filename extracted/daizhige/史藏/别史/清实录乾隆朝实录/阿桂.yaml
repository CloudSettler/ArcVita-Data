endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 谷噶凯立叶分路合攻
  summary: 由谷噶绕越格鲁瓦觉断援，由凯立叶据萨尔赤鄂罗顺山而下，会期正月初十并发进逼勒乌围
  phases:
  - key: brewing
    name: 躧探谷噶凯立叶山形筹合攻
    labels:
      zh:
      - 筹划
      - 探路
    start_date: 1774-01-31
    highlight_event_id: guji-阿桂-event-1774-guge
  - key: breakthrough
    name: 定初十日各路同时并发
    labels:
      zh:
      - 会期
      - 进剿
    start_date: 1774-02-09
    highlight_event_id: guji-阿桂-event-1774-joint
  decisions:
  - date: 1774-01-31
    title_zh: 绕越第二道山梁抢据格鲁瓦觉三寨
    rationale: 第二道碉卡严密难仰攻，绕越断其来援则不攻自溃，可据高临下直取勒乌围
  - date: 1774-02-09
    title_zh: 拨三杂谷土兵健锐营索伦西安兵助丰昇额
    rationale: 凯立叶兵单力薄，增劲旅限初十直取萨尔赤鄂罗，方能截断康巴达与穆尔津冈之通
- id: guji-阿桂-endeavor-2
  title_zh: 严防后路拒纳诈降督剿
  summary: 分驻大员严守宜喜党坝诸要隘，不遣人往验，不通文檄纳降，上紧进剿以防贼缓兵
  phases:
  - key: climax
    name: 严斥献俘往验之请
    labels:
      zh:
      - 拒降
      - 督战
    start_date: 1774-02-09
    highlight_event_id: guji-阿桂-event-1774-refuse
  - key: closure
    name: 酌定防兵分驻上紧进剿
    labels:
      zh:
      - 防守
      - 合围
    start_date: 1774-02-09
    highlight_event_id: guji-阿桂-event-1774-joint
  decisions:
  - date: 1774-02-09
    title_zh: 斥回丹巴沃咱尔等献僧格桑往验之请
    rationale: 天朝断无遣人至贼境之理，恐系缓兵奇货，严斥不理仍督兵进剿
  - date: 1774-02-09
    title_zh: 酌定统领防兵大员分驻长清等处
    rationale: 克期进兵须守要隘不断后路，不必逐步围堵，空劳兵力反分势弱
events:
- id: guji-阿桂-event-birth
  date: 1717-09-07
  year_of: 1717
  title_zh: 阿桂出生
  description: 康熙五十六年八月初二生于京师，满洲正蓝旗人，大学士阿克敦子
  place_zh: 京师
- id: guji-阿桂-event-1774-guge
  date: 1774-01-31
  year_of: 1774
  title_zh: 陈谷噶凯立叶合攻之策
  description: 奏称谷噶第一道碉少第二道碉密，拟绕越抢据格鲁瓦觉断援，凯立叶占据萨尔赤鄂罗截断康巴达，绰斯甲布愿添派番兵夺梁助剿
  place_zh: 谷噶军营
- id: guji-阿桂-event-1774-joint
  date: 1774-02-09
  year_of: 1774
  title_zh: 定正月初十各路同时并发
  description: 与丰昇额明亮等约期并力合攻，官兵裹带乾粮不许举火，彻赴底木达，僧格宗章谷留总兵英泰驻守
  place_zh: 谷噶军营
- id: guji-阿桂-event-1774-refuse
  date: 1774-02-09
  year_of: 1774
  title_zh: 拒贼目请验献俘
  description: 贼目丹巴沃咱尔等喊禀欲献僧格桑请派兵往验，经土目严斥，天朝断无遣人至贼境之理，饬卡兵严斥不理
  place_zh: 谷噶卡伦
- id: guji-阿桂-event-death
  date: 1797-10-10
  year_of: 1797
  title_zh: 阿桂逝世
  description: 嘉庆二年八月二十日病逝于京师，谥文成，配享太庙
  place_zh: 京师
