  birth_date: 1717-09-07
  death_date: 1797-10-10
  era: 清乾隆朝
  reign_ref: 乾隆三十六年辛卯
  archetype: 智勇督师而以饰词获罪之重臣
  dilemmas:
  - 大举深入瘴险必困与偏师久疲亦难竟功之间进退两难
  - 直陈无功以待罪与饰词自全以求罢之间心存侥幸遂失臣节
  lesson: 为大臣当视国事如己事，以悃忱自效，勿逞小智饰非，否則功墮罪加並累子孫
  summary_first_person: 我阿桂出身將門，早年隨軍平準回，頗蒙主知，後督師滇緬無功，又以請罷大舉及畏葸之說迭次飾奏，乾隆三十六年五月乙巳奉嚴旨革任留營在兵丁上行走效力，子孫亦坐遣，自知咎無可逭，唯冀後效贖罪
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70884.html
endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 督辦滇緬軍務請罷大舉獲罪
  summary: 奉命赴滇督師征緬，謂瘴險不宜深入，請停大舉，改以偏師襲擾久疲賊力，迭次奏辯忤旨，乾隆三十六年五月革任留營效力
  phases:
  - key: brewing
    name: 受命督滇籌邊觀勢
    labels:
      zh: 受命視師
    start_date: 1769-04-01
    highlight_event_id: guji-阿桂-event-1769-fudian
  - key: breakthrough
    name: 奏請停罷大舉改用偏師
    labels:
      zh: 奏陳機宜
    start_date: 1771-03-01
    highlight_event_id: guji-阿桂-event-1771-gezhi
  - key: climax
    name: 乙巳嚴旨切責革任留營
    labels:
      zh: 嚴譴革留
    start_date: 1771-06-16
    highlight_event_id: guji-阿桂-event-1771-gezhi
  - key: closure
    name: 在兵丁上行走效力贖罪
    labels:
      zh: 留營贖罪
    start_date: 1771-06-17
    highlight_event_id: guji-阿桂-event-1771-lianzi
  decisions:
  - date: 1771-03-01
    title_zh: 奏請大舉斷不可行
    rationale: 以緬恃險瘴及轉輸勞民為辭，欲罷大舉以就安逸，實昧天時地利之實而逞小智
  - date: 1771-05-01
    title_zh: 再陳偏師襲擾賊必躲避擾邊之說
    rationale: 謂賊性狡猾我往掩襲彼將窺伺土司，以荒誕之說掩怯懦畏葸之心，遂觸震怒
- id: guji-阿桂-endeavor-2
  title_zh: 早年平準回贊樞贊軍致位大學士
  summary: 早年隨軍西陲，參與平定準噶爾及回部，洊歷伊犁將軍軍機大臣，以明練勇幹致位樞輔，為滇緬督師之資
  phases:
  - key: brewing
    name: 初入軍機司員學習行走
    labels:
      zh: 入值樞廷
    start_date: 1752-01-01
    highlight_event_id: guji-阿桂-event-birth
  - key: breakthrough
    name: 從軍西陲平準定回建功
    labels:
      zh: 西陲建功
    start_date: 1755-01-01
    highlight_event_id: guji-阿桂-event-1769-fudian
  - key: climax
    name: 洊擢伊犁將軍參贊軍務
    labels:
      zh: 膺寄封疆
    start_date: 1767-01-01
    highlight_event_id: guji-阿桂-event-1769-fudian
  - key: closure
    name: 內授協辦大學士專倚邊事
    labels:
      zh: 位列樞輔
    start_date: 1768-01-01
    highlight_event_id: guji-阿桂-event-1769-fudian
  decisions:
  - date: 1755-06-01
    title_zh: 請從西師深入犁庭
    rationale: 以年少銳氣願自效邊功，乘準部內潰之機建功名
  - date: 1768-10-01
    title_zh: 受命經略滇邊緬事
    rationale: 以夙著幹練為朝廷倚任，遂膺雲貴督師重寄而不知瘴險難為功
events:
- id: guji-阿桂-event-birth
  title_zh: 出生於章佳氏將門
  date: 1717-09-07
  year_of: 1717
  description: 大學士阿克敦之子，襲雲騎尉，後以筆帖式入仕，開啟樞廷邊帥之途
- id: guji-阿桂-event-1769-fudian
  title_zh: 赴滇督辦緬匪軍務
  date: 1769-04-15
  year_of: 1769
  description: 奉命赴雲南督師征緬，經年毫無端緒，徒以水土惡劣險阻難進為辭，未能制勝
- id: guji-阿桂-event-1771-gezhi
  title_zh: 乙巳以飾奏革任留營效力
  date: 1771-06-16
  year_of: 1771
  description: 乾隆三十六年五月乙巳，上以其請罷大舉及襲擾必致擾邊之說荒誕怯懦，降旨照部議革任，仍留軍營在兵丁上行走，命溫福馳驛署理副將軍事並宣諭通諭
- id: guji-阿桂-event-1771-lianzi
  title_zh: 子阿迪斯等坐罪發遣
  date: 1771-06-16
  year_of: 1771
  description: 同日上諭止坐罪一人不足蔽辜，命其子阿迪斯發遣廣西右江鎮，阿彌達發遣廣東雷瓊鎮，即日發遣
- id: guji-阿桂-event-death
  title_zh: 病逝於京師
  date: 1797-10-10
  year_of: 1797
  description: 後復起用平定金川回疆，圖形紫光閣，官至武英殿大學士，以老病逝，諡文成
