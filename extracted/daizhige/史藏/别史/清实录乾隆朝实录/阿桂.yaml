    rationale: 供词是否虚捏需押赴浙省对质若属实则其无罪可免查办以明根究彻底
- id: guji-阿桂-endeavor-2
  title_zh: 留豫督办河工善后兼密议漕督人选
  summary_zh: 豫省河工办有章程将次完竣之际密奏毓奇才具可否胜任漕运总督以代办事迂缓之鄂宝
