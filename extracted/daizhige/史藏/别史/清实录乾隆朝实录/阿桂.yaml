  - date: 1781-08-01
    title_zh: 断水填泉加兵防范不急于夺营
    rationale: 贼已穷蹙负嵎死守，若强攻徒伤官兵，故以填筑土石断其盗水，分路埋伏相机进剿
  - date: 1781-08-02
    title_zh: 脱回老教剿后按律正法不留姑息
    rationale: 脱回者久从逆贼打仗伤官，非真旧教早窜，故暂留招致贼夥，事毕明示正法以儆胁从
  - date: 1781-08-03
    title_zh: 存记仁和罗江鳞疎玩以观后效
    rationale: 贼两次下沟盗水皆营卡防范不严，本省提督呼应自灵而玩忽更重，故事毕严参以肃军纪
