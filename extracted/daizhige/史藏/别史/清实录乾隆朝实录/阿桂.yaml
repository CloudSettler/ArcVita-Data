    labels:
      zh: 参赞驰赴
    start_date: 1759-08-01
    highlight_event_id: guji-阿桂-event-xibei
  - key: climax
    name: 会办追捕台站窃马玛哈沁
    labels:
      zh: 肃清台路
    start_date: 1760-09-20
    highlight_event_id: guji-阿桂-event-xibei
  - key: closure
    name: 预备屯田兵马驼只转运
    labels:
      zh: 预备转运
    start_date: 1760-10-10
    highlight_event_id: guji-阿桂-event-yili
  decisions:
  - date: 1760-09-20
    title_zh: 请饬辟展乌鲁木齐协捕窃马贼匪
    rationale: 台路为军需命脉虽追袭迷踪料贼不能远遁必严饬各站查拏务获
  - date: 1760-10-10
    title_zh: 请市易哈萨克马备屯田驼运
    rationale: 增派绿旗屯田兵千名必须马驼以乌鲁木齐市马及现有驼只拣选解送牧放转运
