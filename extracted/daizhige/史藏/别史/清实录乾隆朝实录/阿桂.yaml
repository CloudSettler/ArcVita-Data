      - 分驻
    start_date: 1770-08-05
    highlight_event_id: guji-阿桂-event-2
  - key: closure
    name: 彻兵仓皇获谴留任
    labels:
      zh:
      - 撤兵
      - 议罪
    start_date: 1770-08-11
    highlight_event_id: guji-阿桂-event-2
  decisions:
  - date: 1770-08-05
    title_zh: 减留三千七百名停调仅拨千四驻要隘
    rationale: 原请稍多酌留昭通东川督标兵协同旧兵驻守以省糜费
  - date: 1770-08-11
    title_zh: 彻兵后明白回奏自效
    rationale: 既干仓皇取巧之谴惟革职留任办副将军事以赎前愆
