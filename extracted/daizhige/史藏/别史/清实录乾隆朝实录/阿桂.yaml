  decisions:
  - date: 1770-08-05
    title_zh: 主张暂停兴工俟二三年米平再办
    rationale: 永昌购粮不易若再鸠工兴作米价必更昂故请缓办以纾民食
  - date: 1770-08-06
    title_zh: 遵旨会同彰宝再行通盘详筹
    rationale: 省城设营或竟停办皆可据实定议不可两人异词令上参悟
- id: guji-阿桂-endeavor-2
  title_zh: 缅事撤兵善后与滇边分驻整顿
  summary_zh: 请减调兵五千五百名分驻虎踞盏达三台山等处其后以彻兵办理仓皇巧饰被部议革任留任自效
  phases:
