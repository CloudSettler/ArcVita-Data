    title_zh: 于第一第七碉正面接拏卡栅东西分扑
    rationale: 使贼人无从揣度，正办攻坚，步步为营以夺要隘
  - date: 1773-05-11
    title_zh: 乘大雨雪雾夜袭，不因天寒稍缓
    rationale: 夏令渐暄雪渐消化，当乘时努力，否则群逆久稽显戮
- id: guji-阿桂-endeavor-2
  title_zh: 讯俘察疫分化群逆
  description: 讯革布什咱脱出番人得勒乌围噶拉依人畜瘟死，又得小金川番人供称百姓视僧格桑为祸根，研判索诺木等久蓄献出僧格桑自解之心，仍坚持穷追不稍延缓
