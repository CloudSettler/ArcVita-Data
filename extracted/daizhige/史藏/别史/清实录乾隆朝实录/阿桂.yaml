    title_zh: 言明豫工无需亲在经理
    rationale: 河工已有章程将次完竣并无必需在彼经理事件故可即行驰驿赴浙不误两事
  - date: 1782-10-10
    title_zh: 据实密奏毓奇为人
    rationale: 毓奇曾任银库郎中事简才具未尽见然奋勉向前为人爽直漕务不繁似尚能胜任且毋稍回护
