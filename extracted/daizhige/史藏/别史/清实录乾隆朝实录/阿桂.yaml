  - 小金川易复而金川难克，先易后难还是多路并进
  - 贼情狡恶诱以缚献僧格桑，当信抚还是决心剿灭
  lesson: 审贼情而不游移，先收小金川再分路进剿，方能永除后患
  summary_first_person: 我阿桂受命征剿两金川，深知缚献之说不足信，惟当先复小金川，再择凯立叶等要路分兵进剿，严办叛逆以肃军纪，不惜时日费用以成永定之功
