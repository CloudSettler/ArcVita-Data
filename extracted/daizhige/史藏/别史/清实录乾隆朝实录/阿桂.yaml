  date: 1772-08-06
  year_of: 1772
  title_zh: 东山梁进攻得卡后彻回
  description: 阿桂从东山梁进攻，虽得数卡并歼戮贼番及其头目，兵气稍振，然以路险山高不敢冞入，旋即彻回，仍属有名无实
- id: guji-阿桂-event-2
  type: career
  date: 1772-08-08
  year_of: 1772
  title_zh: 奏陈南路侍卫章京分发领队
  description: 阿桂奏称南路侍卫章京俱令与绿营领兵官同住，所办甚是，得旨嘉许并令西路温福一体照办，以收官兵合心之效
