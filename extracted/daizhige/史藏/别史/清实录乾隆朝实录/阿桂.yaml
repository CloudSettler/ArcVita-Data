    title_zh: 抽拨汉土官兵分路绕进菑则大海
    rationale: 贼于荣噶尔博山梁沿河死守，正面仰攻难克，故由萨斯嘉赤沟绕路南下出其不意
  - date: 1775-01-24
    title_zh: 督率官兵施放大炮轰击康萨尔寨墙
    rationale: 贼凭碉卡 Wall 堵御枪炮石块齐下，惟以重炮摧其墙垣方可杀伤穷迫其众
- id: guji-阿桂-endeavor-2
  title_zh: 钦奉谕旨妥速筹办迅扫贼巢
  summary_zh: 领受上谕妥速并举之训，宣布帑藏充盈军需无缺，坚定满汉土兵之心，统筹各路以图一举荡平
