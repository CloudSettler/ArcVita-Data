endeavors:
- id: guji-阿桂-endeavor-1
  title_zh: 督办仪封漫口引河堵合工程
  description: 乾隆四十四年四月督办仪封十堡漫口挑挖引溜沟疏浚引河相机开放掣溜进埽合龙
  phases:
  - key: brewing
    name: 查勘十堡南高北低定计归北注
    labels:
      zh: 勘定堵口方略
    start_date: 1779-05-06
