  date: 1755-05-01
  year_of: 1755
  description: 率辉特人众归附，封亲王，随军助平达瓦齐，定伊犁，旋授定边左副将军
- id: guji-阿睦尔撒纳-event-rebel
  type: career
  title_zh: 八月作乱围杀班第鄂容安
  date: 1755-09-28
  year_of: 1755
  description: 乾隆二十年八月二十四日煽动克什木作乱，围困班第鄂容安于哈斯河察罕白新，二臣力竭自尽，萨喇勒突围后被执
- id: guji-阿睦尔撒纳-event-toromt
