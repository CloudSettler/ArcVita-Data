  decisions:
  - date: 1755-02-10
    title_zh: 奏请汗哈屯乌梁海照旧游牧连界安置
    rationale: 使新旧所收之人彼此连界，易于照管，不致离散生变
  - date: 1755-02-15
    title_zh: 奏请迁游牧于乌里雅苏台并换管牧大臣
    rationale: 避旧地纷扰，就近军营展放卡伦，得耕种渔猎以安生计
- id: guji-阿睦尔撒纳-endeavor-2
  title_zh: 充北路先锋迅进伊犁
  summary: 以达瓦齐势蹙哈萨克入伊犁抢掠为机，奏请度马力速进，另遣察达克等为哨探前队，图先擒达瓦齐
