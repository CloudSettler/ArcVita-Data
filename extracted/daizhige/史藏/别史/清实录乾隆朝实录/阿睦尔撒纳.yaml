  year_of: 1755
  type: career
  description: 遣回纳噶察传言阿巴噶斯约苏图等宁剖腹而死不事他人，试探班第，叛迹益著
- id: guji-阿睦尔撒纳-event-death
  title_zh: 病死于俄境
  date: 1757-09-21
