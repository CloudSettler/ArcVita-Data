  dilemmas:
  - zh: 欲独领准噶尔四部为汗与朝廷分封四汗制衡之两难
  - zh: 欲抢先独进伊犁擒达瓦齐与两路合进听节制之两难
  lesson: 恃险邀功图擅则失信义，归顺立业尤当守分知止
  summary_first_person: 吾本辉特台吉，率众内附，蒙授定边左副将军，会青滚杂卜招抚乌梁海，安插包沁扎哈沁，请迁牧乌里雅苏台，复请速进伊犁以擒达瓦齐，惟冀早奏肤功耳
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0481.html
