  archetype: 反复无信的枭雄叛将
  dilemmas:
  - 借大兵复仇自立与受封安守藩臣之间如何抉择
  - 兵少势孤时是束手请罪还是劫杀经略割据伊犁
  - 众台吉会兵来擒时是困守博罗塔拉还是远窜哈萨克俄境
  lesson: 恃诈反复终失人心，顺逆之分不在一时得失而在诚信大义。
  summary_first_person: 我本辉特台吉，率众内附，蒙恩封王，随大兵助平达瓦齐，却因觊觎总领四卫拉特而起异心，劫杀班第鄂容安，窜据博罗塔拉，致伊犁众台吉会兵来擒，终众叛亲离，逃死异域。
  source_urls:
  - https://daizhige.org/史藏/别史/清实录乾隆朝实录/卷0503.html
