  date: '1755-12-03'
  year_of: 1755
  place_zh: 京师及乌里雅苏台军营
  description_zh: 乾隆以其人奸诈，谕扎拉丰阿等如遣人前来即擒获，如诈降亦断不可信，务拏问解送京师以彰国法
