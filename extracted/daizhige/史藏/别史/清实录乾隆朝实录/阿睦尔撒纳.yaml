  summary_first_person: 我本辉特台吉，为达瓦齐所迫，率众归附大清，蒙封定边左副将军，襄赞班第等两路进兵，议会于博罗塔拉以定伊犁，又筹擒达瓦齐事宜，然朝廷密防我专擅，令诸台吉先觐而留我定规模，我心不甘，终至决裂。
