  title_zh: 窜据博罗塔拉众台吉会兵来擒
  date: 1755-12-11
  year_of: 1755
  description: 与额琳沁舍楞等窜居博罗塔拉道都托罗垓，萨喇勒会同诺尔布敦多克等分两路进兵，于十一月初九会集托和木图擒献
- id: guji-阿睦尔撒纳-event-death
