    highlight_event_id: guji-阿睦尔撒纳-event-death
  decisions:
  - date: 1755-02-12
    title_zh: 据阿克珠勒所告奏请速进
    rationale: 达瓦齐终日饮酒事务皆废，博罗塔拉以外已被抢掠，若不速进必致哈萨克幸获其利
  - date: 1755-02-15
    title_zh: 请以察达克图伦楚另作一队哨探在前
    rationale: 大队在后持重跟进，前后相维，方有裨益而可克日成功
