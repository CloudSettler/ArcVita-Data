events:
- id: guji-阿睦尔撒纳-event-birth
  title_zh: 生于准噶尔辉特部
  date: 1723
  year_of: 1723
  place_zh: 准噶尔
  description_zh: 辉特台吉之子，生于准噶尔部族离乱之际，幼随部众游牧。
- id: guji-阿睦尔撒纳-event-1
  title_zh: 率部归清导兵平伊犁
  date: 1755-06-01
  year_of: 1755
  place_zh: 伊犁
  description_zh: 率辉特部归附大清，为北路大兵向导，直取伊犁，达瓦齐就擒，准噶尔悉定。
- id: guji-阿睦尔撒纳-event-2
  title_zh: 封和硕亲王后萌异志
  date: 1755-09-01
  year_of: 1755
  place_zh: 伊犁
  description_zh: 受封和硕亲王，不满分封诸部之制，欲总领四卫拉特，遂与清廷离心。
- id: guji-阿睦尔撒纳-event-3
  title_zh: 伊犁叛逃裹众西窜
  date: 1756-03-01
  year_of: 1756
  place_zh: 伊犁至登努勒台
  description_zh: 乘大兵凯旋之际叛逃伊犁，裹胁克什木等，抢掠牲只，向哈萨克方向逃窜。
- id: guji-阿睦尔撒纳-event-4
  title_zh: 清将误报就擒实窜哈萨克
  date: 1756-05-07
  year_of: 1756
  place_zh: 库陇癸岭至哈萨克
  description_zh: 策楞等误听俄罗斯之传妄报擒获，玉保仅令乌勒登追至库陇癸岭而返，策楞遽返伊犁，阿睦尔撒纳得携阿布赉之弟岳勒博罗斯窜入哈萨克界，清廷严谴并命达勒当阿玉保等往索。
- id: guji-阿睦尔撒纳-event-death
  title_zh: 病死于俄罗斯托博尔斯克
  date: 1757-09-21
  year_of: 1757
  place_zh: 俄罗斯托博尔斯克
  description_zh: 为哈萨克所不容，转投俄罗斯，病死于托博尔斯克，清廷追索乃止。
