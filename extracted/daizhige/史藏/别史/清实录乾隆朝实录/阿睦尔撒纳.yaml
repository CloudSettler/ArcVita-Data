  year_of: 1755
  place_zh: 伊犁及乌噜木齐
  description_zh: 据诺海奇齐克萨喇勒自伊犁来告，阿睦尔撒纳疑惧未往伊犁，彼地欲内附者甚众，与之党恶者仅阿巴噶斯哈丹等数人
- id: guji-阿睦尔撒纳-event-death
  title_zh: 兵败西窜病殁异域
  date: '1757-09-21'
  year_of: 1757
  place_zh: 托博尔斯克
  description_zh: 清军两路进剿穷追，其众离散，逃入哈萨克复窜俄罗斯境，患痘病殁，清廷索得其尸
