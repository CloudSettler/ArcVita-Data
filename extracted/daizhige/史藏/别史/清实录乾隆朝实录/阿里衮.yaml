events:
- id: guji-阿里衮-event-birth
  title_zh: 出生于勋戚之家
  date: 1719
  year_of: 1719
  place_zh: 北京
  description_zh: 满洲镶黄旗鄂尔泰长子少袭勋爵历部院封疆以大学士协办军务
- id: guji-阿里衮-event-1
  title_zh: 会奏普洱九龙江边外贼匪情形
  date: 1768-06-06
  year_of: 1768
  place_zh: 永昌军营
  description_zh: 会同舒赫德覆奏车里即古车里缅甸分支十二土司内附后屡被滋扰召散分扰打乐九龙江整欠召教召渊勾缅攻破猛合追逐叭先捧请秋瘴退亲往普洱思茅确勘剿杀
- id: guji-阿里衮-event-2
  title_zh: 筹议停剿九龙江断绝通缅贸易
  date: 1768-06-07
  year_of: 1768
  place_zh: 永昌军营
  description_zh: 奉谕九龙江零星不成事体停其专剿惟议臼小选京兵二千躏禾牵掣并严饬各隘口禁绝铁布黄丝针线及腾越马匹透漏始终实力稽察
- id: guji-阿里衮-event-3
  title_zh: 查办锡箔葫芦口木邦逃兵正法四十四人
  date: 1768-06-07
  year_of: 1768
  place_zh: 永昌
  description_zh: 严饬立柱哈国兴将各队官兵齐集质证彻底详查得首先败走者四十四名即行正法以申纪律仍被旨斥姑息了事
- id: guji-阿里衮-event-4
  title_zh: 限缉余逃汰滇补黔议裁兵额
  date: 1768-06-13
  year_of: 1768
  place_zh: 云南
  description_zh: 奉限三月缉获在逃三百余人尽法惩处并汰滇省疲玩无能之兵以贵州抚提标精壮五千顶补马粮另议裁滇额一万以赡满洲兵逃兵子弟不准入伍
- id: guji-阿里衮-event-death
  title_zh: 病卒于征缅军中
  date: 1769
  year_of: 1769
  place_zh: 云南军营
  description_zh: 以副将军会办傅恒征缅军务积劳病卒于军追念经略滇缅之劳赐恤如例
