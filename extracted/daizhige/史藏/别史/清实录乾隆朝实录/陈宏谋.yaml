  summary_first_person: 余起家广西雍正五年进士历事三朝抚陕督直以劝垦兴学水利教化为务乾隆十一年抚陕时为蓝钦奎陈情调赣就近迎养窃以为全孝道即所以厚风俗安民必先安吏也一生不言生财而言养民惟愿田畴垦辟士习端正吏治澄清而已
