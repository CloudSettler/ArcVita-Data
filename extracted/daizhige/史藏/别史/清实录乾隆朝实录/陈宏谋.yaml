  - key: climax
    name: 李冠春再献狂悖被拿
    labels:
      zh:
      - 狂悖论衣冠
      - 闽督抚奏斩
    start_date: 1754-12-01
    highlight_event_id: guji-陈宏谋-event-rebuke
  - key: closure
    name: 奉旨申饬痛改掩饰
    labels:
      zh:
      - 严行申饬
      - 痛改前非
    start_date: 1754-12-07
    highlight_event_id: guji-陈宏谋-event-rebuke
  decisions:
  - date: 1752-05-01
    title_zh: 对李冠春初次呈稿婉词批发
    rationale: 以其当时稿中尚无服色河决诸逆说，意在息事戒饬，不欲张扬，遂酿后患
  - date: 1754-12-07
    title_zh: 奉申饬后自陈引咎整饬言路
    rationale: 既承上谕指陈沽名邀誉掩饰之弊，当严加戒饬生员上书，杜绝妄谈国是
- id: guji-陈宏谋-endeavor-2
  title_zh: 督抚西南湖广劝农兴学
  goal_zh: 历任黔滇陕川湖广，劝农开垦，兴学育才，赈恤养民，务为经久之计
  phases:
  - key: brewing
