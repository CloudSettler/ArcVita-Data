  lesson: 护农本以厚生，渐禁以安业，法行而民不困
  summary_first_person: 吾起家临桂，历抚江西诸省，见种烟耗肥壤而妨谷，深以农本为忧，故请城外概禁，以甲子为始，渐改蔬谷，愿垄亩尽艺谷而民有余蓄。
