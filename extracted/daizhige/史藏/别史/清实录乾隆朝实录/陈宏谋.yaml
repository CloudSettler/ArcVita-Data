    start_date: 1769-01-01
    highlight_event_id: guji-陈宏谋-event-death
  decisions:
  - date: 1760-09-01
    title_zh: 在湖广广设义学社仓
    rationale: 以楚地户口殷繁，非劝学勤农无以厚生养正，故力主兴学劝垦并举
  - date: 1763-04-01
    title_zh: 奏请蠲缓与修水利并行
    rationale: 水旱频仍，惟预备仓储疏浚堤堰，方能使民有恒业而不为邪言所动
events:
- id: guji-陈宏谋-event-birth
  date: 1696
  year_of: 1696
  type: birth
  title_zh: 生于江西临川
  description_zh: 康熙三十五年出生，雍正元年举人，雍正二年进士，选庶吉士，开启仕途
- id: guji-陈宏谋-event-fujian
  date: 1752-03-01
  year_of: 1752
  type: career
  title_zh: 任福建巡抚接李冠春初呈
  description_zh: 乾隆十七年任福建巡抚，仙游生员李冠春曾呈济时十策原稿，彼时稿中尚无服色河决诸说，婉词批发未加严惩治罪
- id: guji-陈宏谋-event-rebuke
  date: 1754-12-07
  year_of: 1754
  type: career
  title_zh: 因李冠春狂悖案被旨申饬
  description_zh: 乾隆十九年十二月辛亥，闽浙总督喀尔吉善巡抚钟音奏李冠春拦舆献策妄议衣冠请斩，上谕以陈宏谋当日不行举发隐忍姑息致犯益肆妄谈，传旨严行申饬
- id: guji-陈宏谋-event-huguang
  date: 1760-08-01
  year_of: 1760
  type: career
  title_zh: 总督湖广劝农兴学
  description_zh: 历抚黔滇陕川后总督湖广，大兴义学社仓，劝垦修水利，以养民育才为务，时称贤督抚
- id: guji-陈宏谋-event-death
  date: 1771
  year_of: 1771
  type: death
  title_zh: 卒于京师谥文恭
  description_zh: 乾隆三十六年卒，年七十六，赠太子太傅，谥文恭，入祀贤良祠
