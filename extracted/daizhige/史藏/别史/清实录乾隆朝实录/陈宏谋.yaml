    title_zh: 请截留滇铜供鼓铸
    rationale: 京铜虽关辇下钱法但江西钱贵特甚不得不权宜截铜济用他省不得援例
  - date: 1742-07
    title_zh: 承诺赴滇采买补项
    rationale: 以外省采买补解京局示不亏京项而全事体
