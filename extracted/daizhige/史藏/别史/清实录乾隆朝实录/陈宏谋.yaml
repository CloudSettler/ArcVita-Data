  phases:
  - key: brewing
    name: 察种烟妨农
    labels:
      zh: 察访农功
    start_date: '1743-01-01'
    highlight_event_id: guji-陈宏谋-event-jinyan
  - key: breakthrough
    name: 奏请城外概禁
    labels:
      zh: 条奏请禁
