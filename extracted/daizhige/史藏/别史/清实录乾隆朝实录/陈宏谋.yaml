    name: 预晓谕以甲子为始
    labels:
      zh: 晓谕渐禁
    start_date: '1744-01-01'
    highlight_event_id: guji-陈宏谋-event-yizhun
  decisions:
  - date: '1743-06-01'
    title_zh: 请城外乡野概不许种烟
    rationale: 烟废可耕肥壤，收后半载土气可复，改种蔬谷无不宜，以保农功
  - date: '1743-06-01'
    title_zh: 请以甲子年为始预晓谕渐禁
    rationale: 已种者骤拔则失业，预谕定时可使转业从容，不致困民
- id: guji-陈宏谋-endeavor-2
  title_zh: 历抚封疆勤绥辑
