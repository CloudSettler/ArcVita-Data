    rationale: 今日耗农功妨地利者莫如种烟，当急救谷土日耗，以固民食之源
  - date: '1750-01-01'
    title_zh: 勤于抚绥劝农兴学
    rationale: 地方起色在尽心经理，劝农足食兼兴教化，方能辑宁生民
