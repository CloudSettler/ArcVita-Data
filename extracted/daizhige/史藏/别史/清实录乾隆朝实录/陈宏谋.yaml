      - 守制
    start_date: 1761-07
    highlight_event_id: guji-陈宏谋-event-zou
  - key: closure
    name: 谙轻重守常制
    labels:
      zh:
      - 持重
      - 循例
    start_date: 1761-08
    highlight_event_id: guji-陈宏谋-event-hongze
  decisions:
  - date: 1761-07
    title_zh: 以驿马四百里驰奏审案补官
    rationale: 意在速达天听不料寻常事件无涉河工地方紧要反失轻重之辨遂致申饬
  - date: 1761-08
    title_zh: 此后非要务照常遣人赍进详慎体例
    rationale: 封疆奏报当衡缓急大事不辞驰驿小事不扰驿马方合敬慎之义
events:
- id: guji-陈宏谋-event-birth
  type: birth
  date: 1696
  year_of: 1696
  title_zh: 生于广西临桂
  description: 康熙三十五年生成长力学以理学经世致用闻名
- id: guji-陈宏谋-event-zou
  type: career
  date: 1761-07
  year_of: 1761
  title_zh: 会高晋驰奏阎大镛案被申饬
  description: 乾隆二十六年七月与高晋以四百里驰驿奏审拟阎大镛及调补知府上以不知轻重传旨申饬并询江南雨水低洼情形
- id: guji-陈宏谋-event-hongze
  type: career
  date: 1761-08
  year_of: 1761
  title_zh: 奏洪泽湖加高封土保下河丰收
  description: 七月以来洪泽湖水加长五坝过水汇归高宝湖于封土上加高二尺使下注迟过一日下河田亩得收上嘉其担当
- id: guji-陈宏谋-event-fengyu
  type: career
  date: 1761-08
  year_of: 1761
  title_zh: 高邮甘泉六汛风雨冲卸请罪
  description: 七月十九二十日风雨骤猛高邮甘泉等六汛石面冲卸漫溢过水具摺请交部治罪奉旨交尹继善高晋陈宏谋会同修筑抚恤查明水势消减以闻
- id: guji-陈宏谋-event-death
  type: death
  date: 1771
  year_of: 1771
  title_zh: 卒于京师
  description: 乾隆三十六年卒于官历抚极边督直省以勤恤爱民清慎著称谥文恭入祀贤良
