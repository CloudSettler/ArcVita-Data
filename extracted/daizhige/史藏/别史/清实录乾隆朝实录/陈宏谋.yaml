    highlight_event_id: guji-陈宏谋-event-jinyan
  - key: climax
    name: 屡迁封疆督抚经理
    labels:
      zh: 懋著循声
    start_date: '1750-01-01'
    highlight_event_id: guji-陈宏谋-event-xunfu
