  decisions:
  - date: 1761-08
    title_zh: 封土上再加高二尺迟过水一日
    rationale: 下河正值刈获早稻迟放一日则田可丰收不忍早泄以淹民食故冒风险以全大局
  - date: 1761-08
    title_zh: 风汛冲卸即请交部治罪并请修赈
    rationale: 堤工漫溢虽因风水暴至然司事难辞疎防之责惟速修速赈方能安灾黎固堤防
- id: guji-陈宏谋-endeavor-2
  title_zh: 审案铨补与封疆奏报之慎
  summary: 会同高晋审拟阎大镛案并调补知府因四百里驰驿轻重失宜被旨申饬自此益慎奏报体例
  phases:
