  birth_date: 1730-01-01
  death_date: 1783-02-01
  era: 清
  reign_ref: 乾隆
  archetype: 贪渎封疆
  dilemmas:
  - 公忠体国与营私牟利之抉择
  - 事发后自首吐实与支饰掩盖之抉择
  - 徇私交好故旧与严守查封法度之抉择
  lesson: 利欲熏心则必至抽换侵蚀，饰词遮掩终难逃水落石出，身败名裂以警后人
  summary_first_person: 吾受恩督抚浙闽，本当整饬吏治，靖地方而饬武备，乃于王亶望抄产之际，见利而起抽换之心，以佳者易常物，以私情给皮衣，又以金银寄舅营运，自谓慎密无人知，岂知王站柱识认，刘大吕供出，阿桂等彻底根究，遂至押解来京，万悔贪念一萌，国法无贷
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B71168.html
endeavors:
- id: guji-陈辉祖-endeavor-1
  title_zh: 督浙期间侵蚀王亶望抄产
  summary: 任浙江总督查办王亶望案时，于抄产玉器字画朝珠皮衣等物多方抽换侵蚀，并以添换佳朝珠掩人耳目
  phases:
  - key: brewing
    name: 交好徇私
    labels:
      zh: 营私
    start_date: 1781-10-01
    highlight_event_id: guji-陈辉祖-event-1
  - key: breakthrough
    name: 抽换抄物
    labels:
      zh: 侵蚀
    start_date: 1782-03-01
    highlight_event_id: guji-陈辉祖-event-1
  - key: climax
    name: 识认败露
    labels:
      zh: 败露
    start_date: 1782-12-05
    highlight_event_id: guji-陈辉祖-event-2
  - key: closure
    name: 严讯押解
    labels:
      zh: 就擒
    start_date: 1782-12-06
    highlight_event_id: guji-陈辉祖-event-3
  decisions:
  - date: 1782-03-01
    title_zh: 抽换玉蕉叶花觚等抄产佳器
    rationale: 利欲熏心，靦颜偷换佳者以饱私囊
  - date: 1782-05-01
    title_zh: 添换朝珠故作加厚之语
    rationale: 欲以添换佳者之名掩盖偷换佳者之实，遮掩耳目
  - date: 1782-06-01
    title_zh: 擅自给王亶望起解时抄封皮衣十六件
    rationale: 既与王亶望交好，徇私情而蔑法度，擅动查封之物
- id: guji-陈辉祖-endeavor-2
  title_zh: 寄顿金银营运与闽浙废弛获罪
  summary: 将银三万两交妻舅申兆仑开典生息，又将杂色金千余两嘱其易银营运，嘱令慎密勿言，复以浙闽武备废弛地方多事连带获谴
  phases:
  - key: brewing
    name: 寄银开典
    labels:
      zh: 寄顿
    start_date: 1782-10-01
    highlight_event_id: guji-陈辉祖-event-2
  - key: breakthrough
    name: 寄金嘱密
    labels:
      zh: 密营
    start_date: 1782-10-15
    highlight_event_id: guji-陈辉祖-event-2
  - key: climax
    name: 供词支饰
    labels:
      zh: 究讯
    start_date: 1782-12-09
    highlight_event_id: guji-陈辉祖-event-3
  - key: closure
    name: 交部定拟
    labels:
      zh: 定罪
    start_date: 1782-12-10
    highlight_event_id: guji-陈辉祖-event-death
  decisions:
  - date: 1782-10-01
    title_zh: 交申兆仑银三万两开典铺生息
    rationale: 假托生息以藏赃，图利 long 久而避查
  - date: 1782-10-15
    title_zh: 交杂色金千余两嘱易银营运并令勿言
    rationale: 明知金两非分所应有，行踪诡秘以图隐匿
  - date: 1782-12-09
    title_zh: 供称金两系家中旧有支饰不吐
    rationale: 冀以一面之词搪塞究问，延宕罪责
events:
- id: guji-陈辉祖-event-birth
  title_zh: 出生
  date: 1730-01-01
  year_of: 1730
  summary: 生于雍正末乾隆初，生年不详，此系约计
- id: guji-陈辉祖-event-1
  title_zh: 抽换王亶望抄产玉器字画朝珠
  date: 1782-03-01
  year_of: 1782
  summary: 于查抄王亶望案内抽换抵兑，王站柱认出玉蕉叶花觚等件，刘大吕供出其事，陈辉祖自行承认部分
- id: guji-陈辉祖-event-2
  title_zh: 以银金交申兆仑营运事发
  date: 1782-12-09
  year_of: 1782
  summary: 经何裕城奏陈辉祖交妻舅申兆仑银三万两开典及杂色金千余两营运，嘱令慎密，阿桂等究讯未得确情
- id: guji-陈辉祖-event-3
  title_zh: 阿桂严讯押带进京审办
  date: 1782-12-06
  year_of: 1782
  summary: 奉旨令阿桂再加严讯朝珠皮衣金两诸节，并令福长安押带陈辉祖国栋及经手各犯迅速来京，就物质讯定拟
- id: guji-陈辉祖-event-death
  title_zh: 伏法
  date: 1783-02-01
  year_of: 1783
  summary: 案经彻底根究后伏法，终以贪渎侵蚀之罪正法
