endeavors:
- id: guji-陈辉祖-endeavor-1
  title_zh: 仁和西塘头围引河与鱼鳞石塘工程
  description: 于江海交接冲啮最险处顺溜开切引河，引大溜直趋以刷沙畅潮，为南坍北涨之关键一治。
  phases:
  - key: brewing
    name: 履勘头围险势
    labels:
      zh:
      - 踏勘
      - 讲论水势
    start_date: 1782-03-01
    highlight_event_id: guji-陈辉祖-event-yinhe
  - key: breakthrough
    name: 开挖七百五十丈引河
    labels:
      zh:
      - 开切
      - 以水攻沙
    start_date: 1782-04-10
    highlight_event_id: guji-陈辉祖-event-yinhe
  - key: climax
    name: 大溜直趋潮汐畅顺
    labels:
      zh:
      - 奏捷
      - 受赏
    start_date: 1782-06-14
    highlight_event_id: guji-陈辉祖-event-yinhe
  - key: closure
    name: 议萧山阴沙地龙刷沙
    labels:
      zh:
      - 续办
      - 试行
    start_date: 1782-06-20
    highlight_event_id: guji-陈辉祖-event-fuhuan
  decisions:
  - date: 1782-04-10
    title_zh: 不待奏闻即督办开河
    rationale: 头围挺出海滩正当溜行直往处，机不可失，督同藩司等实力妥办以收刷沙之效
  - date: 1782-06-20
    title_zh: 阴沙拟用地龙法借水刷沙
    rationale: 河庄一带阴沙坍宽四百余丈致潮流纡回，欲掣引潮溜直趋向东，试行地龙以观其效
- id: guji-陈辉祖-endeavor-2
  title_zh: 闽浙总督兼抚浙江的封疆荣辱
  description: 由获咎降级复起督闽浙，兼管浙江巡抚，以海塘功复还原品顶带，旋以工费冒销事败获罪。
  phases:
  - key: brewing
    name: 授闽浙总督兼管浙江
    labels:
      zh:
      - 封疆
      - 兼抚
    start_date: 1781-10-01
    highlight_event_id: guji-陈辉祖-event-jianfu
  - key: breakthrough
    name: 督率司道悉心治塘
    labels:
      zh:
      - 任使
      - 协力
    start_date: 1782-05-01
    highlight_event_id: guji-陈辉祖-event-yinhe
  - key: climax
    name: 复还总督原品顶带
    labels:
      zh:
      - 嘉奖
      - 议叙
    start_date: 1782-06-15
    highlight_event_id: guji-陈辉祖-event-fuhuan
  - key: closure
    name: 海塘冒销案败赐死
    labels:
      zh:
      - 核销
      - 获罪
    start_date: 1783-06-01
    highlight_event_id: guji-陈辉祖-event-death
  decisions:
  - date: 1782-05-12
    title_zh: 以内河义桥转运赴工保平稳
    rationale: 南岸萧山英家湾背湾停淤，由义桥经内河运料较海道平稳，以济头围要工
  - date: 1782-06-15
    title_zh: 恳将开河工费作正开销
    rationale: 工程浩大皆为公事，奏准开销以安在工人员之心，不意日后核销牵出冒领之弊
events:
- id: guji-陈辉祖-event-birth
  title_zh: 出生
  date: 1732-01-01
  year_of: 1732
  description: 出生于官宦之家，以荫生入仕，历任地方大员。
- id: guji-陈辉祖-event-jianfu
  title_zh: 任闽浙总督兼管浙江巡抚
  date: 1781-10-01
  year_of: 1781
  description: 授闽浙总督兼管浙江巡抚事，综理闽浙军民及浙江海塘钱粮诸务。
- id: guji-陈辉祖-event-yinhe
  title_zh: 开浚头围引河江潮畅顺
  date: 1782-06-14
  year_of: 1782
  description: 奏报仁和西塘头围江海交接无工程处，开挖引河七百五十丈宽二十丈深七尺，适逢山水涨发大溜直趋，两岸冲宽至九十余丈深二三丈，绝无停淤，南岸萧山英家湾委员查勘由义桥内河转运。
- id: guji-陈辉祖-event-fuhuan
  title_zh: 复还总督原品顶带受嘉奖
  date: 1782-06-15
  year_of: 1782
  description: 乙卯谕以所办合机宜切中南坍北涨窾要，著复还总督原品顶带，藩司盛住以下交部议叙，开河工费准作正开销，同日并复富勒浑李侍尧现任品级顶带以示至公惩劝，复谕令详勘对面阴沙红点处可否一并开切。
- id: guji-陈辉祖-event-death
  title_zh: 以海塘冒销获罪赐死
  date: 1783-08-04
  year_of: 1783
  description: 次年海塘工费浮冒婪索事发，与王亶望案牵连议罪，乾隆四十八年闰六月被赐自尽于浙江，家产抄没。
