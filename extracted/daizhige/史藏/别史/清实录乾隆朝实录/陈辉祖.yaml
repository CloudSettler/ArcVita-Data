  era: 清乾隆朝
  reign_ref: 乾隆
  archetype: 干济邀功而贪误自败的封疆督抚
  dilemmas:
  - 未奏先办以抢险与奏准后行以守制之间如何取舍
  - 迎合圣意速成引河奇功与核实钱粮严防冒销之间如何兼顾
  lesson: 以实心办实工可邀一时之赏，以虚销冒领营私则功不能掩罪
  summary_first_person: 我以荫途入仕，督抚闽浙兼抚浙江，见仁和西塘头围江海交接、南坍北涨，遂不待奏闻即督率司道开切引河，幸得大溜直趋、潮汐畅顺，蒙复还总督原品顶带，一时荣宠备至，然治河糜费核销不实，终致身败，方知功过自分、至公难欺。
