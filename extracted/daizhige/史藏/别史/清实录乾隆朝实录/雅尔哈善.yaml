  archetype: 顿兵失机之西征统帅
  dilemmas:
  - 围库车当速攻擒渠与坐守困敌之间如何取舍
  - 统兵大帅当亲履前敌相度与委责偏裨分任之间如何持衡
  lesson: 为将当身先士卒严防疏脱，若高坐帐中委责他人，虽得空城亦无功而罹国法
  summary_first_person: 我初在巴里坤办沙克都尔曼济事奋勉获擢，及授将军进剿库车，以八千兵围弹丸三月，不亲追霍集占，不躬相掘城事，致渠魁潜出潜入、阿布都克哷木夜遁，仅余老弱出降而得空城，终被拿解来京治罪，咎在懈弛因循不亲其事
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70569.html
