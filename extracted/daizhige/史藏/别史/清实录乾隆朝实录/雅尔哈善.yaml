    rationale: 审机而动以靖边陲冀立功自效
  - date: '1758-03-01'
    title_zh: 受命为将军进兵回部
    rationale: 膺讨逆之任当倍加勇往以擒获叛贼
- id: guji-雅尔哈善-endeavor-2
  title_zh: 围攻库车顿兵失机
  summary_zh: 以八九千兵围库车三月坐守军营，委责顺德讷堵截马得胜掘城，致霍集占潜入潜出阿布都克哷木夜遁，仅得空城贻误军机被拿问
  phases:
  - key: brewing
    name: 顿兵库车久围不克
    labels:
      zh: 坐守糜饷
    start_date: '1758-05-01'
    highlight_event_id: guji-雅尔哈善-event-kuchewei
  - key: climax
    name: 贼首夜遁余众出降得空城
    labels:
      zh: 疏脱获罪
    start_date: '1758-08-15'
    highlight_event_id: guji-雅尔哈善-event-kuchengong
  - key: closure
    name: 拿解来京治罪
    labels:
      zh: 国法必罚
    start_date: '1758-09-01'
    highlight_event_id: guji-雅尔哈善-event-najie
  decisions:
  - date: '1758-06-16'
    title_zh: 以堵截之责委顺德讷而不亲往追擒霍集占
    rationale: 图逸避难就易致贼潜入潜出无所措置
  - date: '1758-07-20'
    title_zh: 掘城事全听马得胜不躬行相度兼候顺德讷回营再进兵
    rationale: 因循疏懈高坐帐中致横开一沟伤兵且纵贼兔脱
