    name: 两处决口获罪罢职
    labels:
      zh: 获罪
    start_date: 1753
    highlight_event_id: guji-高斌-event-death
  - key: climax
    name: 身后公论瑕瑜并陈
    labels:
      zh: 论定
    start_date: 1757-03-05
    highlight_event_id: guji-高斌-event-3
  - key: closure
    name: 南巡谕祀与河臣并列
    labels:
      zh: 配享
    start_date: 1757-03-05
    highlight_event_id: guji-高斌-event-3
  decisions:
  - date: 1753
    title_zh: 果于自信轻视岁修终致决溢
    rationale: 自信过甚而年迈志满、疎忽厅汛填筑之功、以致孙家集一带隐贻河患
  - date: 1757-03-05
    title_zh: 后人当以功过相抵为鉴
    rationale: 功在生民不可泯、过亦当治、并祀以昭念旧酬功并使司河者知所激劝
events:
- id: guji-高斌-event-birth
  title_zh: 出生
  date: 1683
  year_of: 1683
  place_zh: 奉天
  description: 高斌生于康熙二十二年、隶内务府、后洊历卿贰
- id: guji-高斌-event-1
  title_zh: 设徐州水志节制毛城铺分洩
  date: 1741
  year_of: 1741
  place_zh: 徐州毛城铺
  description: 立徐州水志至七尺方开毛城铺、以分洩黄流、后人不用其法遂致黄弱沙淤
- id: guji-高斌-event-2
  title_zh: 岁筑支河并坚持堵闭三滚坝
  date: 1746
  year_of: 1746
  place_zh: 高堰三滚坝
  description: 每岁冬季督率厅汛填筑黄河两岸汕刷支河、坚持堵闭三滚坝洩洪湖盛涨、数年下游州县屡获丰收
- id: guji-高斌-event-3
  title_zh: 乾隆南巡命与靳辅等并祀
  date: 1757-03-05
  year_of: 1757
  place_zh: 清江浦
  description: 乾隆二十二年二月丁卯谕念高斌前在南河懋著劳绩、命与靳辅齐苏勒嵇曾筠一并祠祀、以昭念旧酬功
- id: guji-高斌-event-death
  title_zh: 病卒
  date: 1755
  year_of: 1755
  place_zh: 京师
  description: 高斌卒于乾隆二十年、前以张家马路及运河二闸之决获罪、身后得谥文定并入祀河臣祠
