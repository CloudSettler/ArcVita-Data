endeavors:
- id: guji-高斌-endeavor-1
  person_id: guji-高斌
  title_zh: 厘正江南埽坝规制禁绝无故生工
  summary: 以黄河入江南两堤夹束奏陈包滩下埽之弊请敕河臣悉心经画使抢护合宜埽坝实用
  phases:
  - key: brewing
    name: 察觉堤外包滩迎溜之弊
    labels:
      zh: 察弊
    start_date: 1746-06-19
    highlight_event_id: guji-高斌-event-1
  - key: breakthrough
    name: 奏陈埽坝规宜请禁生工
    labels:
      zh: 奏陈
    start_date: 1746-06-19
    highlight_event_id: guji-高斌-event-1
  - key: climax
    name: 得旨敕河臣悉心经画
    labels:
      zh: 俞允施行
    start_date: 1746-06-19
    highlight_event_id: guji-高斌-event-1
  - key: closure
    name: 切嘱顾琮详慎妥办已做毋废未做细察
    labels:
      zh: 善后经画
    start_date: 1746-06-20
    highlight_event_id: guji-高斌-event-1
  decisions:
  - date: 1746-06-19
    title_zh: 奏请已下埽者毋庸废易未下埽者详慎妥办
    rationale: 若听任意生工则两堤在在生工迄无底止故分别已未做以惜费而保堤
  - date: 1746-06-19
    title_zh: 切嘱总河顾琮细察情形不得仍前任意生工
    rationale: 固不可玩工惜费亦不可无故生工糜帑故须详慎妥办使做必如式
- id: guji-高斌-endeavor-2
  person_id: guji-高斌
  title_zh: 酌定黄淮闸坝启闭水则
  summary: 以黄淮为川泽归宿详勘河湖水势奏定老坝口及各闸坝启闭水志使黄水宜合清水宜蓄
  phases:
  - key: brewing
    name: 通勘黄淮河湖水势盈亏之机
    labels:
      zh: 通勘
    start_date: 1746-06-20
    highlight_event_id: guji-高斌-event-2
  - key: breakthrough
    name: 以乾隆七年最大水志连底一丈四尺七寸为准奏定则例
    labels:
      zh: 定则
    start_date: 1746-06-20
    highlight_event_id: guji-高斌-event-2
  - key: climax
    name: 分定毛城铺王家山峰山竹络等各坝启闭尺寸
    labels:
      zh: 分定启闭
    start_date: 1746-06-20
    highlight_event_id: guji-高斌-event-2
  - key: closure
    name: 请立古沟龙门坝等水志并奏报水色清浑以垂久远
    labels:
      zh: 立志垂久
    start_date: 1746-06-20
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1746-06-20
    title_zh: 酌定老坝口水志为准各闸坝较量启闭
    rationale: 过蓄则盈过泄则亏惟以水志较量方有遵循故以徐城石堤洪湖山盱滚坝为验
  - date: 1746-06-20
    title_zh: 主张黄水宜合不宜分清水宜蓄不宜泄
    rationale: 分泄太过则民田受淹湖水受亏运河水浑故须收小口门非异涨不得开放
