  dilemmas:
  - 圣旨停修与工段实应修补之间如何据实勘奏
  - 河员以汕掣冒帑与实在风损之间如何核实澄清
  - 遵旨回护与冒罪直陈之间如何秉虚公以对
  lesson: 办理河工毫无成见惟以亲勘实测为准不以迎合上意为功
  summary_first_person: 余高斌起自内务府久任河务江南两淮皆吾责也高堰山盱为淮扬保障停修岁修皆系民生运道所关乾隆十七年冬奉旨查勘汕掣虽吾一时误会圣意牵就回护而终以实勘定应修与否吾一生治河惟知实勘实力不饰虚言以此自任而已
