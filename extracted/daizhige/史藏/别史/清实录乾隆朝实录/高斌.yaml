  - key: climax
    name: 十月半前圖謀合龍
    labels:
      zh: 合龍安瀾
    start_date: 1742-10-04
    highlight_event_id: guji-高斌-event-1
  decisions:
  - date: 1742-10-04
    title_zh: 奏報進埽情形請速消積水以播春麥
    rationale: 水口不堵則湖河倒灌民田難涸故先堵決後勸種以接青黃
- id: guji-高斌-endeavor-2
  title_zh: 欽差江南會辦截漕賑濟
  summary_zh: 會同周學健查災請截留漕米百萬石並增賑續被水九縣極次貧口糧
  phases:
  - key: breakthrough
