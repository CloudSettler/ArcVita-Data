endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 畿辅麦收察报与请赈补种
  summary_zh: 乾隆七年夏京师雨泽愆期，高斌连日奏报直隶麦收分数，于磁州等八州县歉薄处请赈一月并借给耔种、平粜仓谷
  start_date: 1742-06-09
  end_date: 1742-06-09
