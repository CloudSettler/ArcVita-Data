    labels:
      zh: 截漕備賑
    start_date: 1742-10-11
    highlight_event_id: guji-高斌-event-2
  - key: closure
    name: 增賑續災九縣口糧
    labels:
      zh: 加賑恤貧
    start_date: 1742-10-15
    highlight_event_id: guji-高斌-event-3
  decisions:
  - date: 1742-10-11
    title_zh: 會奏截留下江漕糧八十萬石濟賑
    rationale: 災廣米缺漕近災輕重緩急宜就近截留以省轉運稽遲
  - date: 1742-10-15
    title_zh: 請將次貧增賞一月口糧與極貧一體恤
    rationale: 續被湖河並漲貧民交困稍有差別即致失所故一視同仁
