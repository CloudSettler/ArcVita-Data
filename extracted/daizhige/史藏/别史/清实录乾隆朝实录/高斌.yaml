endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 直隶旱后通奉天米济民食
  summary: 乾隆八年直隶天津河间夏旱歉收，奏请弛奉天海禁，准商贩运米谷接济天津，设印票回照稽查，以防私出外洋
  phases:
  - key: brewing
    name: 夏旱赈后米价仍昂
    labels:
      zh:
      - 旱灾
      - 米贵
    start_date: 1743-07
    highlight_event_id: guji-高斌-event-1743-haimi
  - key: breakthrough
    name: 奏请弛海禁通商贩米
    labels:
      zh:
      - 通商
      - 平粜
    start_date: 1743-10
    highlight_event_id: guji-高斌-event-1743-haimi
  - key: closure
    name: 开禁至次年秋收米流通
    labels:
      zh:
      - 流通
      - 惠民
    start_date: 1743-11
    highlight_event_id: guji-高斌-event-1743-haimi
  decisions:
  - date: 1743-10
    title_zh: 奏请弛奉天海禁贩米济直隶
    rationale: 奉天丰收米贱，直隶歉收米贵，裒多益寡，准商贩运，接济天津等处民食
  - date: 1743-10
    title_zh: 请给印票回照沿海稽查
    rationale: 既开海运之禁，须防私出外洋，令奉天将军府尹查验，沿海官弁稽查，使需谷者得食而粜贩者获利
- id: guji-高斌-endeavor-2
  title_zh: 灾区赈后以口外余米平粜接青黄不接
  summary: 灾区藉赈资生，赈毕即青黄不接，奏请将采买口外多余米石运至被灾各属减价平粜，以平米价
  phases:
  - key: brewing
    name: 赈毕将届青黄不接
    labels:
      zh:
      - 赈济
      - 青黄不接
    start_date: 1743-09
    highlight_event_id: guji-高斌-event-1743-pingdi
  - key: breakthrough
    name: 奏请运口外余米平粜
    labels:
      zh:
      - 平粜
      - 接济
    start_date: 1743-10
    highlight_event_id: guji-高斌-event-1743-pingdi
  - key: closure
    name: 减价平粜米价渐平
    labels:
      zh:
      - 平价
      - 安民
    start_date: 1743-11
    highlight_event_id: guji-高斌-event-1743-pingdi
  decisions:
  - date: 1743-10
    title_zh: 请运口外余米赴灾区平粜
    rationale: 采买口外米有多余，运至被灾各属减价出粜，可济赈后之穷，平市价之昂
  - date: 1743-10
    title_zh: 城垣残缺劝民农隙修复
    rationale: 经过丰润见城垣残缺，守土官平时漫不经心，请饬大吏督率，于农隙酌拨民夫渐次粘补，以卫民生
events:
- id: guji-高斌-event-birth
  title_zh: 出生于奉天
  date: '1683'
  year_of: 1683
  description: 康熙二十二年生于奉天，高佳氏，内务府包衣出身，后由内务府补官入仕
- id: guji-高斌-event-1743-haimi
  title_zh: 奏请弛奉天海禁济直隶旱灾
  date: 1743-10
  year_of: 1743
  description: 奏称天津河间夏旱赈后米贵，闻奉天丰收，请弛海禁俾商贩运米谷流通，奉旨准至次年秋收，设印票回照稽查
- id: guji-高斌-event-1743-pingdi
  title_zh: 请以口外余米平粜灾区
  date: 1743-10
  year_of: 1743
  description: 奏称灾区藉赈资生，赈毕即青黄不接，请将采买口外多余米石运至被灾各属减价平粜，奉旨允行
- id: guji-高斌-event-death
  title_zh: 病逝于直隶总督任上
  date: '1755'
  year_of: 1755
  description: 乾隆二十年卒于任，谥文定，追念治河赈济通商惠民之功
