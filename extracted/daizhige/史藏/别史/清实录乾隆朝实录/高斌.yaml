      raw: 康熙二十三年
    death:
      date: '1755'
      precision: year
      is_circa: false
      raw: 乾隆二十年
  birth_date: '1684'
  death_date: '1755'
  era: 清乾隆朝
  reign_ref: 乾隆九年甲子
  archetype: 封疆济时之臣
  dilemmas:
  - 赈济欲广而仓储有限，欲狭而穷民待哺，宽严之间如何使实惠均沾
  - 开井欲速以济农时，劝课欲缓以休民力，督率之间如何使踊跃而不扰
  lesson: 以实心行实政，赈荒务核实，加赈务接济有续，农功水利用心经营，方不负畿辅封疆之托
  summary_first_person: 我忝任直隶总督，值天津河间深州等处歉收春旱，奏请加赈一月，动通仓米三十万石赴通请领，又试行开土井二万余口以资浇灌，劝植树木以备薪爨，密缉匪类以靖地方，但求穷民得所而农功有备
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70211.html
endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 直隶灾区加赈接济
