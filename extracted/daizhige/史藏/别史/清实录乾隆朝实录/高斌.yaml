  - key: brewing
    name: 酝酿体察灾情
    labels:
      zh:
      - 勘灾
      - 体察
    start_date: '1744-02-01'
    highlight_event_id: guji-高斌-event-jiazhen
  - key: breakthrough
    name: 奏请加赈月分
    labels:
      zh:
      - 奏请
      - 加赈
    start_date: '1744-03-01'
    highlight_event_id: guji-高斌-event-jiazhen
  - key: climax
    name: 动通仓米转运
    labels:
      zh:
      - 转运
      - 实惠均沾
    start_date: '1744-03-08'
    highlight_event_id: guji-高斌-event-jiazhen
  - key: closure
    name: 道府亲赴督办
    labels:
      zh:
      - 督办
      - 核实
    start_date: '1744-03-15'
    highlight_event_id: guji-高斌-event-jiazhen
  decisions:
  - date: '1744-03-08'
    title_zh: 次贫极贫分别加赈一月
    rationale: 次贫原赈至二月止极贫赈至三月止，今春雨未降麦收难必，若不加赈则青黄不接之际穷民乏食，故分别加赈使接续至四月
  - date: '1744-03-08'
    title_zh: 请发通仓米三十万石全给本色
    rationale: 全给本色更于民食有益，令被灾州县自雇船赴通请领，水脚照例报销，可速济饥而无折色之弊
- id: guji-高斌-endeavor-2
  title_zh: 畿辅开井浇灌与植树备薪
  phases:
  - key: brewing
    name: 商酌开井试行
    labels:
      zh:
      - 试行
      - 商酌
    start_date: '1744-03-01'
    highlight_event_id: guji-高斌-event-jing
  - key: breakthrough
    name: 保定先开土井二万余口
    labels:
      zh:
      - 开井
      - 浇灌
    start_date: '1744-03-06'
    highlight_event_id: guji-高斌-event-jing
  - key: climax
    name: 推行天津河间栽柳植树
    labels:
      zh:
      - 植树
      - 备薪
    start_date: '1744-03-06'
    highlight_event_id: guji-高斌-event-jing
  - key: closure
    name: 查验议叙以劝久远
    labels:
      zh:
      - 查验
      - 议叙
    start_date: '1744-03-10'
    highlight_event_id: guji-高斌-event-jing
  decisions:
  - date: '1744-03-06'
    title_zh: 趁农时踊跃开井浇灌
    rationale: 清明农事方殷亟需浇灌，一井仅费银一二两，民间踊跃从事则天津河间可次第办理，小民又可佣工糊口
  - date: '1744-03-06'
    title_zh: 照河工例劝植树木议叙
    rationale: 天津河间柴草稀少民间为苦，多种树木可供炊爨广地利厚民生，官员栽柳五千至二万株分别纪录加级，次年查验活数造册，收效在数年之后故需劝勉
events:
- id: guji-高斌-event-birth
  date: '1684'
  year_of: 1684
  title_zh: 诞生
  description: 高斌生于康熙二十三年，满洲镶黄旗人，后历任封疆，督理直隶河道漕运诸务
- id: guji-高斌-event-jing
  date: '1744-03-06'
  year_of: 1744
  title_zh: 奏报开井种树
  description: 乾隆九年二月遵旨商酌蒋炳开井之奏，奏称保定已开成土井二万二千余口，天津河间以次办理，并请照河工栽柳例劝种树木以备柴薪
- id: guji-高斌-event-jiazhen
  date: '1744-03-08'
  year_of: 1744
  title_zh: 直隶加赈接济穷民
  description: 乾隆九年二月因天津河间深州等处被灾较重春雨未降，奏请次贫极贫各加赈一月，动通仓米三十万石令州县雇船赴通请领，饬道府亲赴督率务使均沾实惠
- id: guji-高斌-event-suijing
  date: '1744-03-08'
  year_of: 1744
  title_zh: 留心稽察绥靖地方
  description: 乾隆九年二月奉旨以河间天津收成歉薄或有贫民勾结匪类，留心稽察访缉瓜贼余党，绥靖地方以安穷民
- id: guji-高斌-event-death
  date: '1755'
  year_of: 1755
  title_zh: 逝世
  description: 高斌卒于乾隆二十年，历督直隶江南河道，治水赈荒农功并举，谥文定
