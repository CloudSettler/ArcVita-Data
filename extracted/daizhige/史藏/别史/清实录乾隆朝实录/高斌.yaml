  title_zh: 直隶河间天津被灾缓徵养民
  summary_zh: 乾隆九年秋奏请将河间天津被灾州县新旧钱粮缓徵并请拨杂粮赈济庆云贫民得旨加恩缓至明年
  phases:
  - key: brewing
    name: 灾后奏请停比
    labels:
      zh: 奏请缓徵
    start_date: 1744-08-09
    highlight_event_id: guji-高斌-event-1
  - key: breakthrough
    name: 加恩缓至明年
    labels:
      zh: 得旨缓徵
    start_date: 1744-08-09
    highlight_event_id: guji-高斌-event-1
  - key: closure
    name: 庆云拨粮散给免还
    labels:
      zh: 散粮接济
    start_date: 1744-08-09
    highlight_event_id: guji-高斌-event-1
  decisions:
  - date: 1744-08-09
    title_zh: 请将灾重十六州县新旧钱粮缓至明年再徵
    rationale: 灾重歉后元气未复若秋后即徵则输将竭蹶故请视收成再开徵以宽民力
  - date: 1744-08-09
    title_zh: 请拨河南杂粮二千石散给庆云穷民免秋收还仓
    rationale: 庆云地僻民贫商贩罕至米粮缺乏故援大城借口粮例散给接济而不责偿
- id: guji-高斌-endeavor-2
  title_zh: 直隶通省雨雹歉收勘报与开垦
  summary_zh: 乾隆九年夏秋详查顺天保定等百馀州县卫二麦歉收及冰雹伤禾借给耔种并报开垦水旱荒地以备秋后勘分
  phases:
  - key: brewing
