    title_zh: 请增建智信二坝以资宣泄
    rationale: 天然坝一开下游州县胥被其患增三为五而限水则可节宣盛涨又不病民
  - date: 1751-04-10
    title_zh: 请南滚坝以南改建石工甎甃
    rationale: 旧用土工有首无尾形势不称必首尾完固方屹如金汤永为淮扬利赖
