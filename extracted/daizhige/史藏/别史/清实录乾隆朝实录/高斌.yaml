    highlight_event_id: guji-高斌-event-1
  - key: breakthrough
    name: 陈磁州等八县歉薄
    labels:
      zh: 指陈歉区
    start_date: 1742-06-09
    highlight_event_id: guji-高斌-event-1
  - key: climax
    name: 请旨加恩赈济
    labels:
      zh: 请赈
    start_date: 1742-06-09
    highlight_event_id: guji-高斌-event-1
  - key: closure
    name: 借种平粜接济
    labels:
      zh: 补种平粜
    start_date: 1742-06-09
    highlight_event_id: guji-高斌-event-1
  decisions:
  - date: 1742-06-09
    title_zh: 据实陈报麦收分数
    rationale: 丰歉不齐不敢讳饰，俾上得以及时加恩体恤
  - date: 1742-06-09
    title_zh: 请以六月内赈济穷民一月
    rationale: 去夏田收获尚远贫民糊口维艰，非格外加恩恐致失所
- id: guji-高斌-endeavor-2
  title_zh: 张家独石口外定界具奏
  summary_zh: 高斌将李质粹所拟张家独石二口外与蒙古交界事宜具摺奏闻，因摺内沿用来文称蒙古为夷人，奉旨训谕令改正并晓谕属员
  start_date: 1742-06-15
  end_date: 1742-06-15
