  - date: 1753-09-01
    title_zh: 遵旨留工堵筑漫口分赔欠项
    rationale: 负恩溺职事败，惟效力补过，勒限赔完以赎罪
events:
- id: guji-高斌-event-birth
  date: 1683
  year_of: 1683
  title_zh: 诞生
  description: 满洲镶黄旗人，康熙二十二年生，后由内务府历任河道
- id: guji-高斌-event-nanhe
  date: 1748-01-01
  year_of: 1748
  title_zh: 督理南河总督河道
  description: 受命总督南河，兼管河务，号称通晓，然冲决漫淹叠见，稽核废弛
- id: guji-高斌-event-mouth
  date: 1753-07-01
  year_of: 1753
  title_zh: 二闸被冲物料亏空
  description: 通判周冕应办物料全无贮备，二闸被冲束手无策，仅彻回另委不据实题参
- id: guji-高斌-event-exposed
  date: 1753-08-01
  year_of: 1753
  title_zh: 南河九万亏空败露
  description: 富勒赫奏发，查出亏空九万余两，高斌张师载知情不参，听河员自为弥缝，钦差策楞刘统勋奉命彻底清查
- id: guji-高斌-event-dismissed
  date: 1753-09-01
  year_of: 1753
  title_zh: 革职留工效力赎罪
  description: 乾隆十八年八月谕旨，以故纵溺职将高斌张师载俱革职，留工效力，策楞署理南河总督，富勒赫协办，亏帑勒限一年完缴
- id: guji-高斌-event-death
  date: 1755
  year_of: 1755
  title_zh: 卒于工次
  description: 乾隆二十年卒于南河工次，效力未竟，生前亏赔牵扯高斌张师载及上司分赔
