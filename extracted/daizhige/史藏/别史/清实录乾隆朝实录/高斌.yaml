  - 数年办理南河虽有成效而江工每年仍有坍卸之患当如何筹善后长策
  - 直隶河道须总督兼理以一事权当如何相度机宜并察河员河兵去留以杜冒滥
  lesson: 河工机宜在亲履相度事权归一，善后则与新任商酌指示，次第奏闻，方于河务民生均有裨益
  summary_first_person: 我久习河务在江南多年颇见成效，乾隆六年奉命调补直隶总督兼理河道，仍系念南河江工，愿与完颜伟商酌善后，以保运道民生无虞
