endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 陵糈供运与口外采买之议
  summary_zh: 陵糈米本由豫东轮供，后因拨蓟粮赈江南改在古北口采买及拨漕，我任直隶总督时议年岁丰歉难齐毋庸豫定每年采买，乾隆十二年再议热河八沟采买留贮及以之接济蒙古赈恤
  phases:
  - key: brewing
    name: 豫东轮供改拨之酝酿
    labels:
      zh: 轮供改拨
    start_date: 1743-01-01
    highlight_event_id: guji-高斌-event-1
  - key: breakthrough
    name: 条奏口外采买之突破
    labels:
      zh: 临时奏请
    start_date: 1744-01-01
    highlight_event_id: guji-高斌-event-1
  - key: climax
    name: 节年改拨与部议之高潮
    labels:
      zh: 拨漕并采买
    start_date: 1747-09-01
    highlight_event_id: guji-高斌-event-1
  - key: closure
    name: 留贮备用接济蒙古之收束
    labels:
      zh: 留贮接济
    start_date: 1747-09-10
    highlight_event_id: guji-高斌-event-1
  decisions:
  - date: 1744-01-01
    title_zh: 议陵糈毋庸豫定每年采买
    rationale: 年岁丰歉难齐，必须临时奏请，在口外采买虽有节省而豫东供应仍须运至通仓且须现拨正项，未见大裨益
  - date: 1747-09-10
    title_zh: 赞成八沟所买谷留贮备用以济蒙古
    rationale: 口外买运节省无多，不如留该处备用，且苏尼特蒙古被旱正需接济，洵为有益
- id: guji-高斌-endeavor-2
  title_zh: 江南苏松海潮大灾会办赈恤
  summary_zh: 乾隆十二年七月十四夜苏松沿海飓风大雨海潮泛溢，崇明宝山最重，我奉旨由江南亲赴灾区会同督抚，不拘常例竭力抚恤，并截留上下两江漕粮二十万石及拨成熟州县仓谷协济
  phases:
  - key: brewing
    name: 风潮骤至之酝酿
    labels:
      zh: 潮灾骤发
    start_date: 1747-08-01
    highlight_event_id: guji-高斌-event-2
  - key: breakthrough
    name: 兵民一体查恤之突破
    labels:
      zh: 一体查恤
    start_date: 1747-09-01
    highlight_event_id: guji-高斌-event-2
  - key: climax
    name: 奉命会办截留漕粮之高潮
    labels:
      zh: 会办截漕
    start_date: 1747-09-29
    highlight_event_id: guji-高斌-event-2
  - key: closure
    name: 成熟州县协济续办之收束
    labels:
      zh: 协济续赈
    start_date: 1747-10-01
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1747-09-29
    title_zh: 亲赴被灾之处会同督抚悉心筹办
    rationale: 风潮昏夜骤至非寻常水旱可比，灾黎栖身无所糊口无资，须亲临督率有司实力查办务使不致失所
  - date: 1747-10-01
    title_zh: 主张截留漕粮并拨成熟州县仓谷协济
    rationale: 救荒无奇策惟在转移区画，别属可望丰收则量拨米石前往灾属，截留明岁漕粮以备赈粜方能济急
