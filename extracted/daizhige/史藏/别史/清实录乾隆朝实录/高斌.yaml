  - 身有残疾不能亲督河工而河务责重
  - 居心忠厚易信属员而河弊丛生国法难宽
  lesson: 忠厚须兼明察亲躬督率方能成事否则易为属员所愚而致偾事
  summary_first_person: 我以忠厚勤慎起家历内务府两淮盐政江南河道晚年以河工偾事戴罪河干二载未及蒙恩而逝唯愿后人以我为戒敦朴亲躬明察属员方不负国恩
