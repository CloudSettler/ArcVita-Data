endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 直隶百余州县旱歉借种缓徵
  summary_zh: 乾隆十年直隶大旱，奏报百十二州县厅借给籽种口粮，俟秋收勘分办理蠲赈
  phases:
  - key: brewing
    name: 春夏察旱酌借
    labels:
      zh:
      - 查灾
      - 借种
    start_date: 1745-08-01
    highlight_event_id: guji-高斌-event-1
  - key: climax
    name: 秋收前缓徵待勘
    labels:
      zh:
      - 缓徵
      - 待勘
    start_date: 1745-08-02
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1745-08-01
    title_zh: 请借籽种口粮并及时布种秋禾
    rationale: 二麦被旱兼雹伤，若不借种口粮则秋禾失时，来岁接济更难
  - date: 1745-08-02
    title_zh: 请宛平等六十四州县厅缓徵新旧钱粮
    rationale: 六月未得透雨，八月开徵在即，先缓徵以安民心，俟秋收再分别办理
- id: guji-高斌-endeavor-2
  title_zh: 畿辅庆云成灾赈借与预筹接济
  summary_zh: 庆云旱象已成，委道府查勘拨漕米赈借，会商在京王大臣预筹借赈平粜之法
  phases:
  - key: breakthrough
    name: 庆云拨漕赈借
    labels:
      zh:
      - 赈借
      - 漕米
    start_date: 1745-08-02
    highlight_event_id: guji-高斌-event-2
  - key: closure
    name: 会商预筹借赈平粜
    labels:
      zh:
      - 预筹
      - 平粜
    start_date: 1745-08-05
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1745-08-02
    title_zh: 庆云拨领漕米作赈借之用
    rationale: 庆云旱象已成，不可拘泥秋后勘分，须即拨漕米救急以防流离
  - date: 1745-08-05
    title_zh: 会同王大臣那苏图预筹接济方略
    rationale: 畿辅雨泽不匀，或借或赈或平粜宜预定，运密云古北粮石就近办理最速
