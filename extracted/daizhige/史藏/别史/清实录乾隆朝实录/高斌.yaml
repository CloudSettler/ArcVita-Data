endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 督築石林水口搶險合龍
  summary_zh: 乾隆七年秋冬督率進埽堵築石林水口以遏湖河並漲並籌高寶低窪洩水以利春麥
  phases:
