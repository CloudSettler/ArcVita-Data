  - key: closure
    name: 冬季岁修支河防夺溜
    labels:
      zh: 岁修
    start_date: 1748
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1741
    title_zh: 设徐州水志七尺方开毛城铺
    rationale: 以水志节制分洩黄流、使黄强可刷沙、免河身渐高之患
  - date: 1746
    title_zh: 坚持堵闭三滚坝不轻开
    rationale: 洩洪湖盛涨则下游州县被淹、堵闭则数年屡获丰收、权衡民生为重
- id: guji-高斌-endeavor-2
  title_zh: 晚年获罪与身后配享河臣祠
  summary: 以癸酉张家马路及运河二闸之决获罪、乾隆南巡追念前劳、命与靳辅齐苏勒嵇曾筠并祀以示激劝
  phases:
  - key: brewing
    name: 年迈自信疎于防范
    labels:
      zh: 守成
    start_date: 1752
    highlight_event_id: guji-高斌-event-death
