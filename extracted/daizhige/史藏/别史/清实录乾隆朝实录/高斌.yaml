    title_zh: 据李质粹来文具奏定界
    rationale: 边界面议须上闻裁定，故即据文转奏以候部议
  - date: 1742-06-15
    title_zh: 奉训后改正夷人之称
    rationale: 内扎萨克乃朝廷臣仆不可以夷称，当刊正并告属员知之
