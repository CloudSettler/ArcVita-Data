events:
- id: guji-高斌-event-birth
  title_zh: 诞生
  date: 1683
  year_of: 1683
  description_zh: 高斌生于康熙年间后以内务府出身累擢至直隶总督
- id: guji-高斌-event-haifang
  title_zh: 疏议天津等处海汛营房
  date: 1745-05
  year_of: 1745
  description_zh: 乾隆十年五月直隶总督高斌疏天津静海沧州盐山庆云南皮六州县沿海汛拨墩台营房烟墩及四党口守备把总衙署改建事部议准建营房告示房马棚外委不准建衙署
- id: guji-高斌-event-jiji
  title_zh: 奉谕筹备直隶接济防蝗
  date: 1745-05
  year_of: 1745
  description_zh: 乾隆十年五月因京师雨泽愆期麦收歉薄谕令高斌密筹平粜接济协商山东河南采买麦石存贮并转饬州县防范蝗蝻
- id: guji-高斌-event-death
  title_zh: 逝世
  date: 1755
  year_of: 1755
  description_zh: 高斌卒于乾隆二十年累官文渊阁大学士总督直隶江南河道以勤敏干济称
