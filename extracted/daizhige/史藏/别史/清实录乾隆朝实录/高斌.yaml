  - key: climax
    name: 开垦荒地报升科
    labels:
      zh: 开垦荒地
    start_date: 1744-08-21
    highlight_event_id: guji-高斌-event-3
  - key: closure
    name: 请秋后确勘分数另题
    labels:
      zh: 秋后确勘
    start_date: 1744-08-18
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1744-08-18
    title_zh: 汇报错定等百馀州县卫春夏雨泽愆期二麦歉收及雹伤情形
    rationale: 先行报明被灾梗概并已借给耔种俟秋收后确勘分数另题以便分别蠲缓
  - date: 1744-08-21
    title_zh: 造报开垦八府州属水旱荒地百馀顷
    rationale: 招民垦复荒地以广生计而增赋额故据实丈报升科
