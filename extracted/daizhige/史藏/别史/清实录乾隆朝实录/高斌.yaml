  - key: climax
    name: 修城实赈
    labels:
      zh:
      - 代赈
      - 养民
    start_date: 1744-05-08
    highlight_event_id: guji-高斌-event-2
  - key: closure
    name: 安插流民
    labels:
      zh:
      - 安插
      - 勿驱
    start_date: 1744-05-12
    highlight_event_id: guji-高斌-event-2
  decisions:
  - date: 1744-05-08
    title_zh: 覆奏陆秩治道浚河均无庸议坚持修城代赈
    rationale: 治道费少所济无多运河当因地制宜无一劳永逸之策故以修城十数万两实赈为宜
  - date: 1744-05-12
    title_zh: 密饬所属安插外来就食贫民毋驱出境
    rationale: 穷民失种外出佣工糊口若驱之出境即失所故令善为安插不急资送
