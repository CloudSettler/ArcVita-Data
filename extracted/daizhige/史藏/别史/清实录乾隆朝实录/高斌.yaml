    highlight_event_id: guji-高斌-event-death
  decisions:
  - date: 1748-03
    title_zh: 以淮为纲兼顾黄运湖河
    rationale: 高堰为淮扬屏障必岁修坚固方能御黄保漕不可因一时停修之议废万世保障之功
  - date: 1752-12
    title_zh: 不以圣旨停修为回护借口
    rationale: 凡奉谕停修工段若实系汕掣倒卸仍当据实奏请修补不可概不许禀修以误修防大事
events:
- id: guji-高斌-event-birth
  date: '1684'
  year_of: 1684
  title_zh: 高斌诞生
  description: 康熙二十三年生于满洲镶黄旗内务府高氏家为文忠公李荣保之侄后累官至总督大学士
- id: guji-高斌-event-hed督
  date: 1748-03
  year_of: 1748
  title_zh: 授江南河道总督经略淮黄
  description: 授江南河道总督主持高堰归仁堤工及黄运治理兼筹两淮盐务以裕河帑而保漕运
- id: guji-高斌-event-fengshan
  date: 1752-12
  year_of: 1752
  title_zh: 覆奏高堰山盱被风汕掣
  description: 乾隆十七年十二月覆奏高堰山盱砖石尾土等工被风汕掣牵入停修误会圣旨奉谕毫无成见惟以实勘合机宜为准
- id: guji-高斌-event-fuzou
  date: 1753-01
  year_of: 1753
  title_zh: 奏定高堰山盱亟修高涧毋庸修
  description: 奏称高堰山盱二厅工段倒卸实应亟加修补高涧等处掣卸外越埽坝原属停修毋庸修补奉旨仍有牵就回护之意
- id: guji-高斌-event-death
  date: '1755'
  year_of: 1755
  title_zh: 高斌卒于河督任上
  description: 乾隆二十年卒于官谥文定追念其终身勤于河务治淮保运之功
