  archetype: 治水济民之臣
  dilemmas:
  - 口外采买虽有节省而仍须现拨正项，是否值得每年豫定
  - 海潮暴至非寻常水旱可比，赈恤当拘常例还是竭力从权转移协济
  lesson: 节省须计全盘出入，救荒须亲临随事区画方能使灾黎均沾实惠
  summary_first_person: 我是高斌，曾任直隶总督议陵糈米口外采买毋庸豫定，后以大学士在江南奉命会办苏松海潮大灾， 알고深知仓储调拨与赈恤皆须因时因地权衡办理
  source_urls:
