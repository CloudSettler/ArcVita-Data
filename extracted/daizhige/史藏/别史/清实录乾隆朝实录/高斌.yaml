- id: guji-高斌-event-1
  title_zh: 议陵糈口外采买毋庸豫定
  date: 1747-09-01
  year_of: 1747
  place_zh: 直隶热河八沟及蓟州遵化丰润
  description_zh: 大学士公讷亲覆奏陵糈节年改拨之由，引我任直隶总督时所议，年岁丰歉难齐必须临时奏请毋庸豫定每年采买，那苏图复请八沟采买留贮备用以济蒙古
- id: guji-高斌-event-2
  title_zh: 奉命会办苏松潮灾赈恤
  date: 1747-09-29
  year_of: 1747
  place_zh: 江南苏州松江崇明宝山上海镇洋
  description_zh: 苏松沿海七月十四夜飓风海潮漂没田庐，奉旨令我在江南亲赴灾区会同督抚悉心筹办赈恤，截留上下两江漕粮二十万石，并令安宁于成熟州县拨仓谷协济崇明镇洋宝山等县
