  decisions:
  - date: 1744-05-14
    title_zh: 奏请缓徵三十三州县新旧钱粮至秋后
    rationale: 上年既歉今岁未得雨民无力完纳故请暂缓以纾民力
  - date: 1744-05-14
    title_zh: 请借贮备米三万六千石赈十二州县灾民且秋后豁免
    rationale: 灾民口粮告急仓谷可济眉急秋收未必即纾故请赐予不还仓
- id: guji-高斌-endeavor-2
  title_zh: 修城代赈安插流民经理
  summary_zh: 驳陆秩治道浚河之议以修城代赈并安插外出就食贫民
  phases:
  - key: brewing
    name: 接奉密谕
