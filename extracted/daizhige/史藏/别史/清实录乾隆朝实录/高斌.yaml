    title_zh: 奏报淮扬大雨江工情形请筹善后
    rationale: 数年成效可保无虞惟江工尚有坍卸须悉心筹画一面奏闻一面指示接任以期妥协
  - date: 1741-08-01
    title_zh: 与完颜伟商酌共经理南河要务
    rationale: 新任于要务有不能自决者当与旧任商酌，旧任有见闻即示知新任，方能经理妥协
- id: guji-高斌-endeavor-2
  title_zh: 调补直隶总督兼理河道
  summary: 以熟悉河务调补直隶总督，奉旨河工机宜俱相度办理，并查察河员河兵效力人员去留定额
