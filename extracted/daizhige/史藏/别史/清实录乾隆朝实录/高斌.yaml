  decisions:
  - date: 1752-12
    title_zh: 覆奏风损并参淮扬道混禀
    rationale: 以打坏船只系由汕掣为非实情形请将接连汕掣混行具禀之李奇龄查明参奏以肃河规
  - date: 1753-01
    title_zh: 奏分高堰山盱应修与高涧停修
    rationale: 高堰山盱倒卸实应亟加修补高涧等处外越埽坝原属停修毋庸修补以分别缓急杜绝冒帑
- id: guji-高斌-endeavor-2
  title_zh: 总督江南河道治淮保运
  summary: 历任江南河道总督直隶总督筹办淮黄交汇高堰归仁诸堤兼顾漕运盐务以保障黄运湖河安澜
  phases:
  - key: brewing
