  dilemmas:
  - 蓄水保堤与开坝洩水之间守则一时侥幸开则下游年年为壑两难抉择
  - 身历其境之经验与朝堂聚讼之空言之间是非难明浮言不足信
  - 顾此失彼之调度只在瞬息之间二闸与铜山不能兼顾则溃败不救
  lesson: 治河贵得机要而忌固执成见昔日守坝侥幸之功不足偿今日壅溃之失
  summary_first_person: 我是高斌久任南河二十年以工务为事乾隆十一二年水盛时谨守车逻等坝侥幸无事下游获丰收遂执为成效不悟酿成壅溃之患铜山兵役彻往二闸张家马路委人失当溜势南徙以致溃决灵虹睢宿胥受其灾如今获重罪留与舒赫德尹继善逐条详酌冀赎前愆方知耕当问奴织当问婢身历者方知机要
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70449.html
endeavors:
- id: guji-高斌-endeavor-1
  title_zh: 久任南河蓄洩守堤
  description: 久任南河总督二十年专以工务为事习见熟闻以蓄水保工为上策于闸坝堤埝多所经理亦多姑容之失
  phases:
  - key: brewing
    name: 初领南河熟悉堤闸
    labels:
      zh: 熟悉河务
    start_date: 1736-01-01
    highlight_event_id: guji-高斌-event-shou-ba
  - key: breakthrough
    name: 水盛谨守侥幸无事
    labels:
      zh: 蓄水保工
    start_date: 1746-01-01
    highlight_event_id: guji-高斌-event-shou-ba
  - key: climax
    name: 固执成效闭毛城铺
    labels:
      zh: 固执成见
    start_date: 1748-01-01
    highlight_event_id: guji-高斌-event-shou-ba
  - key: closure
    name: 受工员欺蔽亏帑误工
    labels:
      zh: 姑容贻误
    start_date: 1752-01-01
    highlight_event_id: guji-高斌-event-tongshan-breach
  decisions:
  - date: 1746-01-01
    title_zh: 乾隆十一二年尽力谨守车逻等坝不开启
    rationale: 当时水盛谨守侥幸无事下游竟获丰收遂以为己有成效可法后遂不肯洩水
  - date: 1748-01-01
    title_zh: 自闭毛城铺减水闸
    rationale: 以为溜势既分恐无以刷沙遂闭铺以束水攻沙不料外间反以开毛城铺为其罪其实乃其所闭久而益见浮言不足信
- id: guji-高斌-endeavor-2
  title_zh: 铜山溃决戴罪堵筑
  description: 铜山堤工漫决东注洪湖高堰束水堤亦被冲汕二闸疏虞顾此失彼致灵虹睢宿被灾奉旨重治其罪留工与钦差督臣逐条详酌赎愆
  phases:
  - key: brewing
    name: 二闸疏虞分兵抢修
    labels:
      zh: 顾此失彼
    start_date: 1753-07-01
    highlight_event_id: guji-高斌-event-tongshan-breach
  - key: breakthrough
    name: 铜山漫决洪湖受涨
    labels:
      zh: 溃败不救
    start_date: 1753-08-01
    highlight_event_id: guji-高斌-event-tongshan-breach
  - key: climax
    name: 重治其罪留工议奏
    labels:
      zh: 戴罪图赎
    start_date: 1753-10-01
    highlight_event_id: guji-高斌-event-dai-zui
  - key: closure
    name: 与尹继善等屏去成见妥酌
    labels:
      zh: 改图赎愆
    start_date: 1753-11-01
    highlight_event_id: guji-高斌-event-dai-zui
  decisions:
  - date: 1753-08-01
    title_zh: 将铜山兵役彻往二闸并力抢修
    rationale: 欲保二闸而以张家马路委之衰老无能之同知守备溜势南徙坐视不报终致溃败
  - date: 1753-10-01
    title_zh: 就逐条河务细心参酌冀赎前愆
    rationale: 身获重罪不敢固执己见含糊认罪须就蓄洩闸坝堤埝海口等宜屏去成见妥协详酌使黄淮顺轨安澜
events:
- id: guji-高斌-event-birth
  title_zh: 出生
  date: 1683-01-01
  year_of: 1683
  description: 康熙二十二年生满洲镶黄旗人后历任河务大员
- id: guji-高斌-event-shou-ba
  title_zh: 乾隆十一二年守车逻等坝下游丰收
  date: 1746-01-01
  year_of: 1746
  description: 水盛之时尽力谨守车逻等坝不开启侥幸无事下游获丰收遂固执为成效后竟酿壅溃之患
- id: guji-高斌-event-tongshan-breach
  title_zh: 铜山张家马路溃决洪湖高堰受害
  date: 1753-08-01
  year_of: 1753
  description: 铜山河堤漫决东注洪湖灵虹睢宿被淹洪河受涨高堰下游束水堤冲汕决口不塞则湖水不减二闸不能堵筑
- id: guji-高斌-event-dai-zui
  title_zh: 乾隆十八年十月被重治留工详酌
  date: 1753-10-01
  year_of: 1753
  description: 以久任南河姑容欺蔽亏帑误工及调度失宜致溃被重治其罪奉旨与舒赫德尹继善等逐条细阅是否合宜一一指陈屏去成见赎愆
- id: guji-高斌-event-death
  title_zh: 逝世
  date: 1755-01-01
  year_of: 1755
  description: 乾隆二十年卒一生以河工见知亦以河工获咎而终
