endeavors:
- id: guji-gaojin-endeavor-1
  title_zh: 苏松水利海防改制
  summary_zh: 奏请裁金山同知改设苏州海防同知，归并土塘水利捕务，专司常昭土塘太厂船工稽查海口
  phases:
  - key: brewing
    name: 查勘土塘水利兼管纷杂
    labels:
      zh: 酝酿查勘
    start_date: '1770-07-01'
    highlight_event_id: guji-gaojin-event-haifang
  - key: breakthrough
    name: 奏请柘林川沙分管水利捕务
    labels:
      zh: 奏请分管
    start_date: '1770-08-01'
    highlight_event_id: guji-gaojin-event-haifang
  - key: climax
    name: 裁金山同知改海防同知驻常熟
    labels:
      zh: 裁改专司
    start_date: '1770-09-23'
    highlight_event_id: guji-gaojin-event-haifang
  - key: closure
    name: 部议准行在外拣选调补
    labels:
      zh: 定制补官
    start_date: '1770-09-24'
    highlight_event_id: guji-gaojin-event-haifang
  decisions:
  - date: '1770-08-01'
    title_zh: 请以土塘工程归柘林通判兼管
    rationale: 金山同知所管土塘散而多，归并通判可事权归一，华亭金山水利捕务亦并理之
  - date: '1770-09-23'
    title_zh: 请裁金山同知改为海防同知
    rationale: 常熟昭文土塘紧要兼太厂船工海口稽查，需专官驻常熟，在外拣选调补以得人
- id: guji-gaojin-endeavor-2
  title_zh: 江西屯租核减与舒城贪案审办
  summary_zh: 会勘南昌九江等卫所屯田缺田租重奏减，兼审办舒城知县龚海婪索仓谷盐商命案
  phases:
  - key: brewing
    name: 清丈南昌九江等卫缺田租重
    labels:
      zh: 清丈核租
    start_date: '1770-06-01'
    highlight_event_id: guji-gaojin-event-tuntian
  - key: breakthrough
    name: 奏减缺田租重银二万余两
    labels:
      zh: 奏减苏佃
    start_date: '1770-09-01'
    highlight_event_id: guji-gaojin-event-tuntian
  - key: climax
    name: 奉旨会审龚海革职拿问
    labels:
      zh: 严审贪令
    start_date: '1770-09-18'
    highlight_event_id: guji-gaojin-event-gonghai
  - key: closure
    name: 严讯有名人犯定拟具奏
    labels:
      zh: 定拟具奏
    start_date: '1770-10-01'
    highlight_event_id: guji-gaojin-event-gonghai
  decisions:
  - date: '1770-09-01'
    title_zh: 屯缺田租重请减不加征催比
    rationale: 格外之租佃力不能完，徒增苦累于军丁无实济，每船所少运费有限不致拮据
  - date: '1770-09-18'
    title_zh: 龚海革职拿问严审定拟
    rationale: 分派富户代买勒收帮买价银数千两，婪索盐商命案得银，大干法纪必彻底根究
events:
- id: guji-gaojin-event-birth
  title_zh: 出生
  date: '1713'
  year_of: 1713
  place_zh: 京师
  description_zh: 满洲镶黄旗高斌之子，少长京师，入仕内务府理藩
- id: guji-gaojin-event-haifang
  title_zh: 奏准苏松水利海防改制
  date: '1770-09-23'
  year_of: 1770
  place_zh: 两江苏州松江
  description_zh: 两江总督任内奏请金山土塘归柘林通判，青浦水利归川沙同知，裁金山同知改苏州海防同知驻常熟，部议从之
- id: guji-gaojin-event-tuntian
  title_zh: 会奏江西屯田减租
  date: '1770-09-15'
  year_of: 1770
  place_zh: 江西南昌九江赣州等卫所
  description_zh: 会勘江西各帮屯田，查明缺田六十余顷租则过重，奏减银二万八百九十六两零，免格外加征病佃
- id: guji-gaojin-event-gonghai
  title_zh: 审办舒城知县龚海贪墨案
  date: '1770-09-18'
  year_of: 1770
  place_zh: 安徽舒城
  description_zh: 奉旨将革职拿问之舒城知县龚海与案内有名人犯严审，分派买谷勒索帮买价银及婪索盐商命案得赃，定拟具奏
- id: guji-gaojin-event-death
  title_zh: 逝世
  date: '1778'
  year_of: 1778
  place_zh: 两江任所
  description_zh: 历任两江总督等，卒于乾隆四十三年，谥文端
