endeavors:
- id: guji-高晋-endeavor-1
  title_zh: 审明两淮运使大堂失鞘案
  description: 两淮运库饷银于二月十二日装齐堆贮运使大堂，次日失去一鞘，运使边廷抡仅令速缉迟则揭参，解员陈文栋与库大使宋炎知事刘天焘私凑赔银抛井捏报捞获，高晋审明参奏请革职严审并议处运使，奉旨饬令彻底根究正贼起出原赃
  phases:
  - key: brewing
    name: 堆贮大堂失鞘
    labels:
      zh: 酝酿
    start_date: 1776-03-01
    highlight_event_id: guji-高晋-event-1
  - key: breakthrough
    name: 审出赔银捏报
    labels:
      zh: 突破
    start_date: 1776-07-17
    highlight_event_id: guji-高晋-event-1
  - key: climax
    name: 参奏运使议处
    labels:
      zh: 高潮
    start_date: 1776-07-17
    highlight_event_id: guji-高晋-event-1
  - key: closure
    name: 奉旨彻底究贼起赃
    labels:
      zh: 收束
    start_date: 1776-07-18
    highlight_event_id: guji-高晋-event-1
  decisions:
  - date: 1776-07-17
    title_zh: 参革解员库官并附参运使边廷抡
    rationale: 大堂近地失银不能预为防范又不能究出实情，赔银捏报装点欺诈，必须革职提审分别定拟，运使交部严加议处
  - date: 1776-07-18
    title_zh: 遵旨另行彻底根究正贼原赃
    rationale: 前报王天荣钱玉情节支离难成信谳，须起获正贼追出原鞘，审明定拟，不以前套揭报语开脱
- id: guji-高晋-endeavor-2
  title_zh: 覆奏河工卓异知府能否胜道员
  description: 河南怀庆知府陈锡钺由山安河务同知卓异升任，皇帝召见询其在工出力与河务熟谙情形，能否堪胜河工道员，交高晋据实覆奏
  phases:
  - key: brewing
    name: 河员卓异升府
    labels:
      zh: 酝酿
    start_date: 1776-07-24
    highlight_event_id: guji-高晋-event-2
  - key: breakthrough
    name: 召见垂询在工出力
    labels:
      zh: 突破
    start_date: 1776-07-24
    highlight_event_id: guji-高晋-event-2
  - key: climax
    name: 交谕据实核奏
    labels:
      zh: 高潮
    start_date: 1776-07-24
    highlight_event_id: guji-高晋-event-2
  - key: closure
    name: 候覆以定道员之用
    labels:
      zh: 收束
    start_date: 1776-07-25
    highlight_event_id: guji-高晋-event-2
  decisions:
  - date: 1776-07-24
    title_zh: 奉谕查明陈锡钺河工履历据实覆奏
    rationale: 该员既由河务同知卓异升府，须核其曾否出力及于河务一切是否熟谙，将来能否堪胜道员，不可泛保
