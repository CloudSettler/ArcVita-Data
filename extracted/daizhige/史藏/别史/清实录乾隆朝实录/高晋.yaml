  dilemmas:
  - 苏松土塘水利海防分辖庞杂，裁并与专管之衡
  - 江西屯租养运与恤佃苏困，加征与减免之衡
  - 舒城知县贪墨骫法，严审定拟与自任失察之责
  lesson: 经制贵在核实平时，养运不以病民，见贪必参不存护短
  summary_first_person: 吾忝督两江，厘苏松水利海防之制，核江西屯田租则，审舒城贪令龚海，惟愿军运无缺而佃民不困，工程钱粮各有专司耳
