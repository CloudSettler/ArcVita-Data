  dilemmas:
  - 循外省揭报宽免陋习为属员开脱，还是据实查办不徇情面
  - 河工道员重用资历出身，还是核其在工实绩与熟谙情形
  lesson: 查库银失鞘须究正贼起原赃，参大员不容空言饬吓与捏报，荐河员须据实覆奏
  summary_first_person: 吾备位两江，值两淮运使大堂失鞘，解员库官赔银掷井捏称捞获，吾审明参奏革职严审，不敢以揭报套语为运使宽免，复奉旨覆奏河员陈锡钺能否胜道员，惟据实在工出力情形上闻，方为封疆之责。
