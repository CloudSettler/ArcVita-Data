endeavors:
- id: guji-高晋-endeavor-1
  title_zh: 两江总督整饬河漕湖防
  summary_zh: 督两江兼管河务，蓄泄洪泽，展浚清口，兼保漕运与民生
  phases:
  - key: brewing
    name: 受命督两江兼管河务
    labels:
      zh:
      - 驻节江宁
      - 兼筹河漕
    start_date: '1768-01-01'
    highlight_event_id: guji-高晋-event-liangjiang
  - key: breakthrough
    name: 畅浚清口宣泄淮水
    labels:
      zh:
      - 展拆东坝
