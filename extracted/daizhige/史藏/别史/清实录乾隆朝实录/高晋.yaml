    start_date: '1778-08-01'
    highlight_event_id: guji-高晋-event-qingkou
  - key: climax
    name: 高宝潴蓄分泄洪泽
    labels:
      zh:
      - 启智字坝
      - 高宝受水
    start_date: '1778-08-20'
    highlight_event_id: guji-高晋-event-qingkou
  - key: closure
    name: 勘赈亳州六州县水灾
    labels:
      zh:
      - 确勘田庐
      - 照例抚恤
    start_date: '1778-09-01'
    highlight_event_id: guji-高晋-event-liangjiang
  decisions:
  - date: '1778-08-20'
    title_zh: 展拆清口东坝至五十丈
    rationale: 洪泽湖清水续长，湖面虽宽足资容纳，仍须展拆宣泄得宜，藉刷马头嫩滩，保淮扬运河畅通
  - date: '1778-09-01'
    title_zh: 确勘亳州等六州县水灾赈恤
    rationale: 豫省漫水下注致上江低洼田庐被淹，秋获失收，贫民易失业，须速委妥员会同州县确勘实力妥办
- id: guji-高晋-endeavor-2
  title_zh: 星驰赴豫堵筑仪封漫口
  summary_zh: 乾隆四十三年仪封决口夺溜，带谙习河工将备赴工，改引河移坝抢筑合龙
  phases:
  - key: brewing
    name: 奉命带将备驰赴仪封
    labels:
      zh:
      - 选带将备
      - 星驰赴工
    start_date: '1778-07-10'
    highlight_event_id: guji-高晋-event-yifeng
  - key: breakthrough
    name: 七月二十四兴工进埽
    labels:
      zh:
      - 分路运料
      - 赶做坝台
    start_date: '1778-08-15'
    highlight_event_id: guji-高晋-event-yifeng
  - key: climax
    name: 改拟引河拦河坝移上
    labels:
      zh:
      - 分段挑挖
      - 挑溜得力
    start_date: '1778-09-05'
    highlight_event_id: guji-高晋-event-yifeng
  - key: closure
    name: 秋分后赶埽盼合龙
    labels:
      zh:
      - 日下多埽
      - 寒露前合龙
    start_date: '1778-09-22'
    highlight_event_id: guji-高晋-event-yifeng
  decisions:
  - date: '1778-09-05'
    title_zh: 改拟引河并将拦河坝移上
    rationale: 引河分段陆续挑挖成功可速，拦坝移上挑溜更为得力，贴坝底水尚浅施工省力，收口后溜急底深再图坠埽之法
  - date: '1778-09-10'
    title_zh: 加价购料分路催趱并试锚坠埽
    rationale: 阴雨运艰麦收歉薄，正价九分不敷，百斤加价五分寓赈于工，水路多备船陆路修车道，口门收小时仿杨桥系锚直坠之法以收一埽一益之效
events:
- id: guji-高晋-event-birth
  title_zh: 出生
  date: '1707-01-01'
  year_of: 1707
  description_zh: 康熙四十六年出生，满洲镶黄旗人，后由进士历任封疆，久谙河漕盐政
- id: guji-高晋-event-liangjiang
  title_zh: 督两江兼办亳州水灾勘赈
  date: '1778-09-01'
  year_of: 1778
  description_zh: 任两江总督期间，因豫省漫溢致亳州等六州县河水骤涨田庐被淹，奏请确勘抚恤，勿使一夫失所
- id: guji-高晋-event-qingkou
  title_zh: 议展清口东坝宣泄洪泽清水
  date: '1778-08-20'
  year_of: 1778
  description_zh: 洪泽湖清水续长，饬将清口东坝陆续展拆至五十丈，并豫开山旴智字坝分泄，水归高宝诸湖潴蓄
- id: guji-高晋-event-yifeng
  title_zh: 赴仪封堵筑黄河漫口进埽
  date: '1778-08-15'
  year_of: 1778
  description_zh: 仪封口门宽二百二十七丈水深至三丈五尺，于七月二十四日兴工，分路运料赶做坝台，改引河移拦坝，秋汛顶冲中加紧下埽以图迅速合龙
- id: guji-高晋-event-death
  title_zh: 逝世
  date: '1778-12-01'
  year_of: 1778
  description_zh: 乾隆四十三年十一月卒于任所，劳瘁河工一生，以治河抚灾勤勉著称
