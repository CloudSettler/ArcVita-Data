      raw: 康熙四十六年生
    death:
      date: 1778
      precision: year
      is_circa: false
      raw: 乾隆四十三年卒
  birth_date: 1707
  death_date: 1778
  era: 清朝
  reign_ref: 乾隆朝
  archetype: 老成诚悫之治河封疆
  dilemmas:
  - 南河防汛初竣而永定河连年漫溢，是安守本任还是交印北上会勘
  - 河工估销动辄数十万两，是图节省沽名还是务实根治不惜帑金
  - 督抚原不准来京祝嘏，是恪守成例还是因勘河蒇事恭与大庆
  lesson: 治河不在惜费沽名而在老成诚悫实心任事，方能杜后患而膺倚任
  summary_first_person: 我高晋久任河务，以实心任事见知，乾隆三十六年南河汛竣，奉命将两江印务交萨载暂署，北赴行在面承训示，会同裘曰修等履勘永定河及北运河，绘图贴说以筹减洩长策，事竣恭与圣母八旬大庆再回本任，惟愿不糜国帑不沽虚名，以成一劳永逸之局
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E6%B8%85%E5%AE%9E%E5%BD%95%E4%B9%BE%E9%9A%86%E6%9C%9D%E5%AE%9E%E5%BD%95/%E5%8D%B70891.html
endeavors:
- id: guji-高晋-endeavor-1
  title_zh: 总督两江督办南河防汛
  summary_zh: 久任两江，娴习河防机宜，乾隆三十六年南河防汛武场事竣，恳请赴京恭祝圣母万寿，持重待命
  phases:
  - key: brewing
    name: 防汛在任恳请祝嘏
    labels:
      zh: 恪守封圻
    start_date: 1771
    highlight_event_id: guji-高晋-event-nanhe
  - key: breakthrough
    name: 南河汛竣可交卸北上
    labels:
      zh: 汛竣待命
    start_date: 1771
    highlight_event_id: guji-高晋-event-nanhe
  - key: climax
    name: 交印萨载起身赴行在
    labels:
      zh: 交印北上
    start_date: 1771
    highlight_event_id: guji-高晋-event-yongding
  - key: closure
    name: 庆典后仍回两江本任
    labels:
      zh: 仍回本任
    start_date: 1771
    highlight_event_id: guji-高晋-event-shouqing
  decisions:
  - date: 1771
    title_zh: 防汛竣后奏请来京祝寿
    rationale: 外任大员虽有本任专责，然圣母八旬大庆，情切抒诚，循例陈请以尽臣节
  - date: 1771
    title_zh: 遵旨交印萨载即行北上
    rationale: 永定河务需老成主持，南河既竣，当舍本任小安就全局大计，速赴行在面训
- id: guji-高晋-endeavor-2
  title_zh: 会勘永定河及北运河筹长策
  summary_zh: 奉特旨会同裘曰修杨廷璋履勘永定河漫口淤高堤薄之患，兼办北运河减洩预防，绘图贴说通盘筹画
  phases:
  - key: brewing
    name: 永定河连年涨溢淤高堤薄
    labels:
      zh: 水患频仍
    start_date: 1771
    highlight_event_id: guji-高晋-event-yongding
  - key: breakthrough
    name: 特简老成面请训示
    labels:
      zh: 特膺简命
    start_date: 1771
    highlight_event_id: guji-高晋-event-yongding
  - key: climax
    name: 逐一履勘绘图贴说
    labels:
      zh: 履勘筹画
    start_date: 1771
    highlight_event_id: guji-高晋-event-yongding
  - key: closure
    name: 勘蒇恭与庆典再定章程
    labels:
      zh: 定章董办
    start_date: 1771
    highlight_event_id: guji-高晋-event-shouqing
  decisions:
  - date: 1771
    title_zh: 不惜帑金以求根治
    rationale: 河身淤高非二十万可塞，断无为省钱粮而苟且，虽至二百万亦当据实估办
  - date: 1771
    title_zh: 永定北运一并通筹
    rationale: 两河连年漫溢皆关畿辅安澜，就便一并查办减洩预防，方为一劳永逸
events:
- id: guji-高晋-event-birth
  title_zh: 出生
  date: 1707
  year_of: 1707
  description_zh: 康熙四十六年生，长而娴习河防，后督两江以治水见知
- id: guji-高晋-event-nanhe
  title_zh: 南河防汛事竣奏请祝寿
  date: 1771
  year_of: 1771
  description_zh: 乾隆三十六年秋南河防汛武场事竣，奏恳赴京恭祝圣母皇太后八旬万寿，未蒙允准，仍在任待命
- id: guji-高晋-event-yongding
  title_zh: 奉命交印北上会勘永定河
  date: 1771
  year_of: 1771
  description_zh: 特旨以其明练河防老成诚悫，令将总督印务交萨载兼署，赴行在面训，会同裘曰修杨廷璋履勘永定河及北运河，绘图贴说具奏
- id: guji-高晋-event-shouqing
  title_zh: 勘蒇领袖班联恭与大庆
  date: 1771
  year_of: 1771
  description_zh: 查勘蒇事适届圣母大庆，遂朝拜之忱，以满洲大学士领袖班联恭与庆典，礼成仍回两江总督之任
- id: guji-高晋-event-death
  title_zh: 病逝
  date: 1778
  year_of: 1778
  description_zh: 乾隆四十三年卒于任，累著河绩，以老成实办为世所称
