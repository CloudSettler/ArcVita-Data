  date: 1753-03-20
  year_of: 1753
  title_zh: 疏请同州改府移驻千总
  description_zh: 陕甘总督黄廷桂疏称同州改府治原驻把总兵单，请将华州潼关协千总移驻同郡，拨兵足四十名，抽回羌白镇等汛兵归城，兵部议覆应如所请
  place_zh: 同州府
- id: guji-黄廷桂-event-huanglong
  date: 1753-03-28
  year_of: 1753
  title_zh: 疏请黄龙山设州同专管捕务
  description_zh: 黄廷桂疏称洛川黄龙山深在万山盗案需专员稽察，请以华州州同移驻改为直隶鄜州州同兼管三县捕务，抽拨民壮缉捕，吏部议覆应如所请
  place_zh: 洛川黄龙山
