endeavors:
- id: guji-黄廷桂-endeavor-1
  title_zh: 筹添陕甘驿马备西师凯旋与再进
  summary: 会同陕西巡抚陈宏谋奏请添补府谷至定边驿马并奉旨于巴里坤再备战马以资调拨
  phases:
  - key: brewing
    name: 察陕道崎岖马力不敷
    labels:
      zh: 踩勘
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-yima
  - key: breakthrough
    name: 奏请照甘省例添马六十匹
    labels:
      zh: 奏请
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-yima
  - key: climax
    name: 得旨如所请行并筹巴里坤战马
    labels:
      zh: 奉准
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-beima
  - key: closure
    name: 变价还项牧养备调
    labels:
      zh: 收束
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-beima
  decisions:
  - date: 1757-03
    title_zh: 请添陕站驿马并动公费先支
    rationale: 陕站介于甘晋之间道远山险原额马少不足供凯旋大差故请暂添足额事后变价还款
  - date: 1757-03
    title_zh: 于巴里坤再备马三四千匹
    rationale: 西路大兵已进剿马匹耗损多须豫备于后方以资调拨并派兵牧养
- id: guji-黄廷桂-endeavor-2
  title_zh: 复查三达色附逆疑案
  summary: 奉旨就三达色是否为莽噶里克侦探及哈密官兵收没金珠等情逐一确查并解送人证进京
  phases:
  - key: brewing
    name: 接军机大臣传谕查案
    labels:
      zh: 承旨
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-sandase
  - key: breakthrough
    name: 核供词与军营原摺异同
    labels:
      zh: 核供
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-sandase
  - key: climax
    name: 查金珠收没与寄金是否属实
    labels:
      zh: 追赃
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-sandase
  - key: closure
    name: 押解周士儒进京质对
    labels:
      zh: 解质
    start_date: 1757-03
    highlight_event_id: guji-黄廷桂-event-sandase
  decisions:
  - date: 1757-03
    title_zh: 传讯赛沙布核寄金之事
    rationale: 三达色称托赛沙布寄金五两与其母须查实以辨哈密官兵收金之供是否捏饰
  - date: 1757-03
    title_zh: 将周士儒差押至京质问
    rationale: 周士儒与三达色一路同行最悉行踪解京质对方可秉公定案不存回护
