    start_date: 1753-05
    highlight_event_id: guji-黄廷桂-event-huanglong
  decisions:
  - date: 1753-03-28
    title_zh: 请以华州州同移驻黄龙山改为鄜州州同
    rationale: 黄龙山在万山之中，仅有外委巡防不干民事，华州事务不繁，移其州同以专查弹压最为相宜
  - date: 1753-03-28
    title_zh: 请兼管三县捕务并抽拨民壮
    rationale: 兼管洛川宜君中部三县捕务，于白水澄城韩城郃阳联界听其查移就近查办，抽拨民壮十名以资缉捕
events:
