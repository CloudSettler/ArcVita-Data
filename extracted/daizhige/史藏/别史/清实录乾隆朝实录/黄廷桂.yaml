  dilemmas:
  - 大兵西征在即与陕甘驿道疲敝之间如何兼顾急递与民力
  - 军营告发与旧部供词矛盾之间如何秉公查实而不回护
  lesson: 军需无小事必豫备于先案狱无偏听必核实于后
  summary_first_person: 吾黄廷桂兼管陕甘总督值西师进剿之际添驿马备战马以通军邮奉旨复查三达色一案以明功罪惟以实心办实事不敢惜费亦不敢枉人
