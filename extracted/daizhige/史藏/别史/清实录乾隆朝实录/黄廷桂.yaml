    rationale: 旧仓一百余间年久损坏恐误积贮宜及时修理以备支放
  - date: 1745-12-07
    title_zh: 请移建肃州潮塌仓于大仓东北高燥处
    rationale: 原址卑湿屡建生潮借贮寺庙民房非计不如择高燥之地妥协建造永固
