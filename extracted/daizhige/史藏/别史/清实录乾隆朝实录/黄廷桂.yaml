endeavors:
- id: guji-黄廷桂-endeavor-1
  title_zh: 筹备南巡江浙河路船只
  description: 乾隆十五年奉命在江省豫筹南巡御舟及随带船只，务使江浙一水可通，省节通州带船之费
  phases:
  - key: brewing
    name: 受命在江办差
    labels:
      zh: 受命筹备
    start_date: 1750-09-11
    highlight_event_id: guji-黄廷桂-event-nanxun
  - key: breakthrough
    name: 条奏江省足用
    labels:
      zh: 体察实情
    start_date: 1750-09-12
    highlight_event_id: guji-黄廷桂-event-nanxun
  - key: climax
    name: 蒙询是否妥协
    labels:
      zh: 候旨询问
    start_date: 1750-09-13
    highlight_event_id: guji-黄廷桂-event-nanxun
  - key: closure
    name: 省节通州多备
    labels:
      zh: 省费便民
    start_date: 1750-09-14
    highlight_event_id: guji-黄廷桂-event-nanxun
  decisions:
  - date: 1750-09-11
    title_zh: 先期敬谨筹备御舟
    rationale: 恭奉巡幸大事在先，不敢临期贻误，故先在江省办理
  - date: 1750-09-13
    title_zh: 如已妥协则奏明无庸多备
    rationale: 南省一水可通，自江至浙无须递换，以省糜费而宽民力
- id: guji-黄廷桂-endeavor-2
  title_zh: 两江勘灾赈恤与靖盗安民
  description: 督理两江查勘江西水灾分别赈恤，并缉办奉贤南汇等地猛将会聚众结盟之事
  phases:
  - key: brewing
    name: 江西被水奏报
    labels:
      zh: 查勘灾情
    start_date: 1750-09-18
    highlight_event_id: guji-黄廷桂-event-jiangxi
  - key: breakthrough
    name: 分别赈恤抚绥
    labels:
      zh: 赈恤灾民
    start_date: 1750-09-19
    highlight_event_id: guji-黄廷桂-event-jiangxi
  - key: climax
    name: 缉获猛将会首
    labels:
      zh: 缉捕首要
    start_date: 1750-09-20
    highlight_event_id: guji-黄廷桂-event-mengjianghui
  - key: closure
    name: 重处示警余党究办
    labels:
      zh: 靖安地方
    start_date: 1750-09-21
    highlight_event_id: guji-黄廷桂-event-mengjianghui
  decisions:
  - date: 1750-09-18
    title_zh: 成灾处善为赈恤不成灾亦加抚恤
    rationale: 使被灾者均沾实惠，毋致失所，以固民依
  - date: 1750-09-20
    title_zh: 对猛将会首重处示警毋姑息
    rationale: 聚众百余结盟殴辱为害地方，若姑息则滋蔓难图，故须严办以儆效尤
events:
- id: guji-黄廷桂-event-birth
  date: 1691
  year_of: 1691
  title_zh: 出生
  description: 康熙三十年生于汉军镶红旗之家
- id: guji-黄廷桂-event-nanxun
  date: 1750-09-11
  year_of: 1750
  title_zh: 奉旨询问南巡船只筹备
  description: 总理行营议奏南巡随带船只，奉谕以黄廷桂在江办差已筹御舟，若已妥协则通州无庸多备，江浙一水可通无须递换
- id: guji-黄廷桂-event-jiangxi
  date: 1750-09-18
  year_of: 1750
  title_zh: 奏报江西各县被水并勘办
  description: 两江总督任内奏江西被水情形及勘办缘由，奉旨成灾处善为赈恤使沾实惠，不成灾处亦宜抚恤毋致失所
- id: guji-黄廷桂-event-mengjianghui
  date: 1750-09-20
  year_of: 1750
  title_zh: 缉办奉贤猛将会聚众结盟
  description: 奉贤人李如岗等纠合南汇上海松江嘉定百余人名为猛将会，角殴捉辱民人，现获首要李如冈徐鸿表等严审并缉拿余党，奉旨重处示警毋姑息
- id: guji-黄廷桂-event-death
  date: 1759
  year_of: 1759
  title_zh: 逝世
  description: 乾隆二十四年卒于川陕总督任上，谥文襄
