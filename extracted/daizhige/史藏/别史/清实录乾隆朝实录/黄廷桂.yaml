  - date: 1753-03-20
    title_zh: 请以潼关协千总移驻同郡
    rationale: 同州已改府治，原设把总兵单，分防后存城仅七名，不足弹压，故就近移驻千总并拨兵足额
  - date: 1753-03-20
    title_zh: 请抽羌白镇等四汛兵归城并置买营房
    rationale: 归并散汛以厚府城守备，粮饷仍随潼关厅仓支领，营房马厩操场另行置买，以垂久远
- id: guji-黄廷桂-endeavor-2
  title_zh: 黄龙山设官专管捕务弹压
  goal_zh: 于洛川黄龙山深山要地设专员稽察盗窃命案兼管三县捕务
