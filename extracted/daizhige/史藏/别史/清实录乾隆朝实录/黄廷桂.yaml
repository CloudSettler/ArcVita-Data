  - date: 1745-04
    title_zh: 据实疏报垦成顷亩
    rationale: 屯垦贵实不贵虚，核渠户成田奏闻方能定额征而杜隐冒
  - date: 1745-04
    title_zh: 以垦成地归入年报奏销
    rationale: 边地渠户初垦易荒，逐年核实奏报可使版籍清楚而边储有稽
