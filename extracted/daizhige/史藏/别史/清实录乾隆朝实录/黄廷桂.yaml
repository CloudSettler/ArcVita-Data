  decisions:
  - date: 1745-04
    title_zh: 请豁平罗耔种口粮带徵
    rationale: 黄河冲决居民半回原籍，无籍可归者谋食维艰，带徵徒存虚数，不如豁免以施实恩
  - date: 1745-04
    title_zh: 请豁宁夏水涌荒地额粮
    rationale: 地震水涌数载积水万难垦种，若仍系额征则累官累民，照数豁除方为核实
