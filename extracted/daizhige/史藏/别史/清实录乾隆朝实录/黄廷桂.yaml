  - 同州新改府治而存城兵仅七名，如何调剂营制而不增糜费
  - 黄龙山深在万山而盗窃命案难治，如何设官弹压而兼顾联界缉捕
  lesson: 因地移官驻兵，专责缉捕弹压，方能固边防而安民生
  summary_first_person: 吾久任陕甘，留意武备捕务，同州改府则请移潼关协千总以充守备，黄龙山僻远则请移华州州同专管捕务，惟求兵民相安，地方靖谧。
