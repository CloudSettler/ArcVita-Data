    title_zh: 会奏豁免缓徵水冲沙压及缓带旧欠
    rationale: 边地贫民接济维艰分别豁免缓带分作五年带徵还仓方能纾解拮据
events:
- id: guji-黄廷桂-event-birth
  title_zh: 生于康熙三十年
  date: 1691
  year_of: 1691
  kind_zh: 出生
  description_zh: 黄廷桂生于康熙三十年汉军镶黄旗人后累官至陕甘总督
- id: guji-黄廷桂-event-zhupao
  title_zh: 奏请赶铸大神炮
  date: 1758-06-08
  year_of: 1758
  kind_zh: 军务
  description_zh: 以甘肃现存炮位年久不堪用雇觅良工趱造大神炮二三十位请交松阿哩监造就近演放转解
- id: guji-黄廷桂-event-zhenji
  title_zh: 奏报甘省旱雹已借耔种口粮
  date: 1758-06-10
  year_of: 1758
  kind_zh: 赈济
  description_zh: 奏称河东河西各府属间有被旱被雹已酌借耔种口粮无虑失所奉旨令豫为经理毋俟勘灾已成始议赈粜
- id: guji-黄廷桂-event-yunliang
  title_zh: 拨哈密存粮抢运巴里坤五万石
  date: 1758-06-20
  year_of: 1758
  kind_zh: 转运
  description_zh: 以两路大军及屯田台站每月口粮不下二三千石又奉添派二万豫备一岁口粮故先从哈密存粮米面兼拨务于九月前运足巴里坤
- id: guji-黄廷桂-event-shangyin
  title_zh: 以办理粮饷妥协蒙赏银一万两
  date: 1758-06-25
  year_of: 1758
  kind_zh: 恩赏
  description_zh: 以连年办理军需无误今岁转运粮饷复甚妥协勤劳懋著加恩于军需正项内支银一万两以示体恤
- id: guji-黄廷桂-event-huanmian
  title_zh: 甘肃水冲沙压地亩豁赋缓徵
  date: 1758-06-25
  year_of: 1758
  kind_zh: 蠲恤
  description_zh: 免甘肃各属乾隆十六年至二十年民欠水冲沙压地亩额赋甘凉肃三府州安西五卫皋兰县二十二年地丁银米并予缓徵
- id: guji-黄廷桂-event-death
  title_zh: 卒于乾隆二十四年
  date: 1759
  year_of: 1759
  kind_zh: 逝世
  description_zh: 黄廷桂以后勤劳勚卒于乾隆二十四年赠谥勤襄入祀贤良祠
