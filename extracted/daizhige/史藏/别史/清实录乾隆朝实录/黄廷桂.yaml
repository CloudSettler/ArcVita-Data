  year_of: 1745
  description: 疏称靖远会宁安定夏秋连旱请分别初赈加赈蠲缓银草借粮又请于宁夏四堆子冯家庙至五堆子筑遥堤一道加培六堆子以下旧堤并展挖惠农尾梢渠道以防水患护屯田
