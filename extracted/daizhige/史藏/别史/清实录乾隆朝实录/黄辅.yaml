events:
- id: guji-黄辅-event-birth
  title_zh: 出生
  date: 1710-01-01
  year_of: 1710
  description: 生年不详，约当雍正乾隆之际，籍隶安徽，后入盐政为官
- id: guji-黄辅-event-1
  title_zh: 到任黑井提举
  date: 1764-10-01
  year_of: 1764
  description: 乾隆二十九年九月到黑井提举任，掌黑井盐课行销存贮及薪本
- id: guji-黄辅-event-2
  title_zh: 任内亏缺盐斤薪本
  date: 1768-01-01
  year_of: 1768
  description: 任内逐渐亏缺存仓监盐四百四十四万余觔，已发薪本堕煎余盐二百四十六万余觔，又亏缺薪本银一万五千余两，照常造册未露
- id: guji-黄辅-event-death
  title_zh: 病故于任
  date: 1770-07-01
  year_of: 1770
  description: 乾隆三十五年闰五月病故，委知县徐应衡署黑井事，交代未清
- id: guji-黄辅-event-3
  title_zh: 身后亏空被劾查封
  date: 1770-12-01
  year_of: 1770
  description: 云南巡抚诺穆亲查明亏空据实纠劾，奉旨提其子黄京荣及家人书吏严审，任所及安徽原籍赀产一并查封
