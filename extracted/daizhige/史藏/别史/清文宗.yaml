  archetype: 海疆御夷守成之君
  dilemmas:
  - 内忧外患交迫下固守成约与筹防海疆之两难
  - 整饬闽浙营伍盐务积弊与体恤官民疲困之两难
  lesson: 固结民心外抚内防，力行实政方能保海疆安堵
  summary_first_person: 朕以道光三十年正月入承大统，国事多艰，英人觊觎台湾鸡笼煤炭并欲换港口，朕密谕闽浙粤督抚严词拒绝加意筹防，又饬整顿闽浙营伍盐务保甲，迅平台湾洪纪等匪乱，惟愿以实心行实政，保封疆无虞
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E5%8F%B0%E6%B9%BE%E8%B5%84%E6%96%99%E6%B8%85%E6%96%87%E5%AE%97%E5%AE%9E%E5%BD%95%E9%80%89%E8%BE%91.html
endeavors:
- id: guji-清文宗-endeavor-1
  title_zh: 拒英采煤换口并筹防台湾
  summary: 咸丰初英官文翰求购鸡笼煤炭并谋换台湾为口岸，坚执五口成约正词驳斥，密饬两广闽浙严密防备
  phases:
  - key: brewing
    name: 英人请采鸡笼煤炭
    labels:
      zh: 采煤照会
    start_date: 1850-08-31
    highlight_event_id: guji-清文宗-event-1850-taiwan-mei
  - key: breakthrough
    name: 正词拒绝并密饬防备
    labels:
      zh: 拒止防备
    start_date: 1850-09-01
    highlight_event_id: guji-清文宗-event-1850-taiwan-fang
  - key: climax
    name: 侦悉欲换台湾为港口
    labels:
      zh: 换口阴谋
    start_date: 1850-09-02
    highlight_event_id: guji-清文宗-event-1850-taiwan-port
  - key: closure
    name: 坚执成约镇静绝其妄念
    labels:
      zh: 守约镇静
    start_date: 1850-10-07
    highlight_event_id: guji-清文宗-event-1850-taiwan-port
  decisions:
  - date: 1850-08-31
    title_zh: 谕刘韵珂徐继畬拒绝采煤
    rationale: 台湾为悬海要区，不应违约，正词拒绝并密饬文武加意防备
  - date: 1850-09-01
    title_zh: 密谕闽粤严防换口窥伺
    rationale: 成约五口本无台湾，断难允准，飞咨粤省正词驳斥，慎勿游移贻患
- id: guji-清文宗-endeavor-2
  title_zh: 整饬闽浙营盐保甲并平定台湾匪乱
  summary: 饬查闽浙营伍空粮盐务浮费保甲废弛，督剿台湾嘉义洪纪等结盟竖旗之乱，擒斩首要搜捕余匪
  phases:
  - key: brewing
    name: 闽浙营盐积弊上闻
    labels:
      zh: 访查整顿
    start_date: 1850-06-15
    highlight_event_id: guji-清文宗-event-1851-yanwu
  - key: breakthrough
    name: 饬除浮费裁汰陋规
    labels:
      zh: 除弊兴利
    start_date: 1851-06-19
    highlight_event_id: guji-清文宗-event-1851-yanwu
  - key: climax
    name: 台湾洪纪聚众谋逆
    labels:
      zh: 台湾剿匪
    start_date: 1852-03-15
    highlight_event_id: guji-清文宗-event-1852-taiwan-fei
  - key: closure
    name: 审拟定案议叙出力员弁
    labels:
      zh: 论功搜捕
    start_date: 1852-05-26
    highlight_event_id: guji-清文宗-event-1852-taiwan-ping
  decisions:
  - date: 1851-06-19
    title_zh: 谕季芝昌王懿德通筹盐务
    rationale: 缉私裁费为紧要关键，不筹变通徒请停减无裨大局
  - date: 1852-03-15
    title_zh: 谕严捕洪纪余党勿漏网
    rationale: 甫经蠢动即行扑灭仍须遍行搜捕，务须有犯必惩续报出力者
