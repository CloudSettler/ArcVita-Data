  description: 闻英官文翰欲换台湾为港口，谕刘韵珂等督率镇道严密布置，据理斥驳飞咨粤省
  endeavor_ref: guji-清文宗-endeavor-1
- id: guji-清文宗-event-1850-taiwan-port
