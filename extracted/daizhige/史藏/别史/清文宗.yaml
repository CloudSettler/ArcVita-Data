  endeavor_ref: guji-清文宗-endeavor-2
- id: guji-清文宗-event-death
  title_zh: 崩于承德避暑山庄
  date: 1861-08-22
  year_of: 1861
  place: 承德避暑山庄
  description: 咸丰十一年七月十七日崩，在位十一年，庙号文宗显皇帝
  endeavor_ref: guji-清文宗-endeavor-2
