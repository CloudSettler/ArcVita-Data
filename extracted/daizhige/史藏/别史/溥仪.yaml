endeavors:
- id: guji-溥仪-endeavor-1
  title_zh: 奉懿旨入承大统兼祧两宫
  summary_zh: 光绪三十四年十月二十一日大行皇帝龙驭上宾且未有储贰，奉慈禧懿旨以载沣之子承继穆宗并兼承大行之祧，入承大统为嗣皇帝
  phases:
  - key: brewing
    name: 储贰未定
    labels:
      zh: 大行弥留储位虚悬
    start_date: 1908-11-13
    highlight_event_id: guji-溥仪-event-succession
  - key: breakthrough
    name: 懿旨定策
    labels:
      zh: 慈禧降旨以载沣子为嗣
    start_date: 1908-11-14
    highlight_event_id: guji-溥仪-event-succession
  - key: climax
    name: 缵承大统
    labels:
      zh: 嗣皇帝抢地呼天受遗诏
    start_date: 1908-11-14
    highlight_event_id: guji-溥仪-event-succession
  - key: closure
    name: 布告天下
    labels:
      zh: 颁遗诏抚辑臣民
    start_date: 1908-11-16
    highlight_event_id: guji-溥仪-event-proclaim
  decisions:
  - date: 1908-11-14
    title_zh: 钦遵懿旨入承大统
    rationale: 神器至重亟宜传付得人，钦承慈训兼祧穆宗与大行以定人心
  - date: 1908-11-14
    title_zh: 命摄政王监国秉训裁政
    rationale: 嗣皇帝尚在冲龄宜专心典学，军国政事悉由监国裁度以度时艰
- id: guji-溥仪-endeavor-2
  title_zh: 连遭大丧持服守制并建元宣统
  summary_zh: 十月二十二日太皇太后崩，钦奉遗诰以国事为重，敬行三年之丧，议上尊谥庙号，钦定建元年号曰宣统
  phases:
  - key: brewing
    name: 两宫大丧相继
    labels:
      zh: 二十一日帝崩二十二日后崩
    start_date: 1908-11-14
    highlight_event_id: guji-溥仪-event-double-mourning
  - key: breakthrough
    name: 议丧制
    labels:
      zh: 请仍二十七日而除与敬行三年之争
    start_date: 1908-11-17
    highlight_event_id: guji-溥仪-event-double-mourning
  - key: climax
    name: 尊谥议礼
    labels:
      zh: 上大行皇帝尊谥庙号及列后尊崇
    start_date: 1908-11-17
    highlight_event_id: guji-溥仪-event-double-mourning
  - key: closure
    name: 建元宣统
    labels:
      zh: 钦定明年为宣统元年
    start_date: 1908-11-18
    highlight_event_id: guji-溥仪-event-era-name
  decisions:
  - date: 1908-11-15
    title_zh: 敬行三年之丧以申哀慕
    rationale: 虽遗诰命二十七日而除，于心实有不忍，敬循古制持服三年而祀典不废
  - date: 1908-11-18
    title_zh: 钦定建元年号曰宣统
    rationale: 缵承大统宜正纪元以示维新，期与臣庶共享升平克终未竟之志
events:
- id: guji-溥仪-event-birth
  date: 1906-02-07
  year_of: 1906
  title_zh: 生于北京醇亲王府为载沣之子
  description_zh: 光绪三十二年正月十四生，摄政王载沣之子，后被择定入承大统
  place_zh: 北京醇亲王府
- id: guji-溥仪-event-succession
  date: 1908-11-14
  year_of: 1908
  title_zh: 奉慈禧懿旨入承大统为嗣皇帝
  description_zh: 光绪三十四年十月二十一日酉刻大行皇帝龙驭上宾，钦奉懿旨以摄政王载沣之子承继穆宗为嗣并兼承大行之祧，嗣皇帝抢地呼天缵统
  place_zh: 紫禁城
- id: guji-溥仪-event-double-mourning
  date: 1908-11-15
  year_of: 1908
  title_zh: 太皇太后崩连遭大丧并命监国裁政
  description_zh: 十月二十二日未刻慈禧太皇太后仙驭升遐，遗命军国政事均由监国摄政王裁定，嗣皇帝穿孝百日并敬行三年之丧
  place_zh: 紫禁城
- id: guji-溥仪-event-proclaim
  date: 1908-11-16
  year_of: 1908
  title_zh: 恭视大小殓奉安梓宫颁遗诏
  description_zh: 恭视大行皇帝及大行太皇太后大小殓，奉安乾清宫与皇极殿，颁大行遗诏布告天下抚辑臣民豫备立宪
  place_zh: 乾清宫皇极殿
- id: guji-溥仪-event-era-name
  date: 1908-11-18
  year_of: 1908
  title_zh: 钦定建元年号曰宣统
  description_zh: 丁丑钦定明年为宣统元年，明示缵统改元，御名下一字敬缺一撇书作仪字
  place_zh: 紫禁城
- id: guji-溥仪-event-death
  date: 1967-10-17
  year_of: 1967
  title_zh: 卒于北京
  description_zh: 末代皇帝退位后历经民国诸变，一九六七年病卒于北京
  place_zh: 北京
