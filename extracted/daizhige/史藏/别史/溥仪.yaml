  archetype: 冲龄继统之守成末帝
  dilemmas:
  - 以三岁冲龄兼祧两宫，既承穆宗又承大行，名分之重与蒙昧之年相违
  - 国遭大丧而立宪在即，守丧尽哀与以国事为重两难
  lesson: 幼冲缵统全赖顾命与监国，哀戚之际更当恪遵典礼以安人心固邦基
  summary_first_person: 余以摄政王载沣之子，蒙大行太皇太后懿旨入承大统，兼祧穆宗毅皇帝与大行皇帝，既悲两宫大丧，又惧付托之重，惟勉节哀思，敬循古制持服，专心典学，以待亲裁政事
  source_urls:
