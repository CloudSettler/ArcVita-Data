  description_zh: 顺治十一年三月十八日生，为第三子，后即皇帝位年号康熙
- id: guji-玄烨-event-1705-nanxun
  title_zh: 南巡得龚士炯年表
  date: 1705-03-01
  year_of: 1705
  place_zh: 江苏吴地行在
  description_zh: 康熙四十四年春南巡，儒生龚士炯进所编历代年表起陶唐终于隋，惜其勤而业未竟
- id: guji-玄烨-event-1707-xuxiu
  title_zh: 命周清原王之枢续修
  date: 1707-01-01
  year_of: 1707
  place_zh: 北京内阁
  description_zh: 命侍郎周清原内阁学士王之枢续修讫元至正之末凡百卷，王之枢自康熙四十六年奉命设局编集
- id: guji-玄烨-event-1712-jincheng
  title_zh: 王之枢进呈百卷
  date: 1712-05-11
  year_of: 1712
  place_zh: 北京畅春园
  description_zh: 康熙五十一年四月初七王之枢表随进，屡蒙乙夜亲览载损载增，天时统上有伦人事纪中不淆
- id: guji-玄烨-event-1715-yuxu
  title_zh: 御制历代纪事年表序
  date: 1715-04-24
  year_of: 1715
  place_zh: 北京翰林院
  description_zh: 康熙五十四年四月二十四日御序，论尚书春秋体与史记年表变例，命马豫锓板告竣
- id: guji-玄烨-event-death
  title_zh: 崩于畅春园
  date: 1722-12-20
  year_of: 1722
  place_zh: 北京畅春园清溪书屋
  description_zh: 康熙六十一年十一月十三日崩，在位六十一年，御定诸书后付刊行垂为盛典
