  - title_zh: 表多缺而史繁如何提要
    description_zh: 历代之史具而表多缺，代远文繁观者易忘，需别为一体以提其要而致详
  - title_zh: 初稿勤而业未竟如何成全帙
    description_zh: 龚士炯所进年表起陶唐终于隋用心虽勤而辑未成，需命廷臣续讫元末并亲加裁定
  lesson: 以表提史以要御繁，历世久远则别立一体，同条共贯使数十年如一篇
  summary_first_person: 朕南巡吴中得儒生龚士炯所编历代年表，惜其用心勤而业未竟，乃命周清原王之枢续讫元至正之末，亲加裁定复考正三元甲子列诸简端，成百卷以备史一体
