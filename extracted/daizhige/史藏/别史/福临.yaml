  - key: breakthrough
    name: 致书史可法晓谕大义
    labels:
      zh:
      - 谕南中
      - 讨贼复仇
    start_date: 1644-07-27
    highlight_event_id: guji-福临-event-yushi
  - key: climax
    name: 命豫亲王定国南征
    labels:
      zh:
      - 声罪江南
      - 渡河进剿
    start_date: 1644-10-15
    highlight_event_id: guji-福临-event-nanzheng
  - key: closure
    name: 渡河定河南窥江南
    labels:
      zh:
      - 孟津渡河
      - 经略东南
    start_date: 1644-12-14
    highlight_event_id: guji-福临-event-nanzheng
  decisions:
  - date: 1644-07-27
    title_zh: 令多尔衮致书史可法劝归藩
    rationale: 明我师得燕京于闯贼非取于明，劝削号归藩永绥福禄，先礼后兵以占大义
  - date: 1644-10-15
    title_zh: 授多铎定国大将军征江南
    rationale: 南中擅立福王拥兵自扰，天人共愤，须以仁义之师声罪致讨，一统南北
  - date: 1645-02-08
    title_zh: 趋豫亲王破贼后即取南京
    rationale: 潼关西安既下，大业已成，宜乘胜联兵河朔东征，不令南中坐享渔利
events:
- id: guji-福临-event-birth
  title_zh: 出生于盛京
  date: 1638-03-15
  year_of: 1638
  place_zh: 盛京清宁宫
  description: 崇德三年二月初七日生，为皇太极第九子，后即位为清世祖
- id: guji-福临-event-shanhaiguan
  title_zh: 山海关合兵大破李自成
  date: 1644-04-22
  year_of: 1644
  place_zh: 山海关一片石至燕京道
  description: 摄政睿亲王统师至山海关，吴三桂开门迎降，对阵大风止后奋击，大败李自成二十余万众，追杀四十里，进吴三桂为平西王
- id: guji-福临-event-dingding
  title_zh: 定鼎燕京亲诣南郊即位
  date: 1644-10-01
  year_of: 1644
  place_zh: 燕京南郊
  description: 五月初二入燕京，秋毫无犯，以礼葬明崇祯帝后，十月初一以定鼎燕京亲诣南郊告祭天地即皇帝位
- id: guji-福临-event-zhaofu
  title_zh: 遣官招抚山东河南
  date: 1644-06-04
  year_of: 1644
  place_zh: 山东济南青州河南开封一带
  description: 令王鳌永招抚山东河南，荐谢升等旧臣，抚定济南东昌青州临清，衡王上降书，平定霸州沧州德州
- id: guji-福临-event-yushi
  title_zh: 谕史可法议讨贼复仇
  date: 1644-07-27
  year_of: 1644
  place_zh: 燕京致书金陵
  description: 摄政王致书史可法，陈得燕京于闯非取于明，拟秋高西征传檄江南联兵河朔同报君国之仇，劝削号归藩，可法报书多不屈
- id: guji-福临-event-nanzheng
  title_zh: 命豫亲王南征渡河定河南
  date: 1644-10-15
  year_of: 1644
  place_zh: 孟津黄河河南一带
  description: 命多铎为定国大将军声三罪征江南，十二月兵至孟津图赖先渡河，十五寨堡归顺，许定国李际遇来降，大军向潼关进发
- id: guji-福临-event-death
  title_zh: 崩于北京紫禁城
  date: 1661-02-05
  year_of: 1661
  place_zh: 北京紫禁城养心殿
  description: 顺治十八年正月初七日崩，年二十四，在位十八年，奠清入关一统之基
