      - 联吴破贼
    start_date: 1644-04-22
    highlight_event_id: guji-福临-event-shanhaiguan
  - key: climax
    name: 入燕京定鼎安民
    labels:
      zh:
      - 定鼎燕京
      - 秋毫无犯
    start_date: 1644-05-02
    highlight_event_id: guji-福临-event-dingding
  - key: closure
