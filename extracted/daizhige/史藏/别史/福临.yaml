      - 礼葬崇祯
      - 兴灭继绝
    start_date: 1644-05-20
    highlight_event_id: guji-福临-event-dingding
  decisions:
  - date: 1644-04-08
    title_zh: 授多尔衮奉命大将军便宜从事
    rationale: 冲龄难亲戎行，倚宿将代统大军定中原，以殊礼系诸王贝勒之心
  - date: 1644-04-22
    title_zh: 纳吴三桂归顺封平西王合击李自成
    rationale: 借守关精锐夹击流贼，既报君父之仇，又收关宁之力为己用
  - date: 1644-05-20
    title_zh: 以帝礼葬崇祯及后妃
    rationale: 示兴灭继绝之义，以仁义服明官民之心，稳燕京初定之局
- id: guji-福临-endeavor-2
  title_zh: 命将南征经营河南江南
  summary: 命豫亲王为定国大将军声罪南征，渡黄河定河南，招抚山东河南旧将，致书史可法劝削号归藩，奠定东南经略之基
  phases:
  - key: brewing
    name: 招抚山东河南署官安民
    labels:
      zh:
      - 招抚山东
      - 分官署事
