endeavors:
- id: guji-福临-endeavor-1
  title_zh: 摄政入关定鼎燕京
  summary: 顺治元年授多尔衮奉命大将军印，联合吴三桂山海关破李自成，入燕京告祭定鼎，以礼葬崇祯，抚定畿辅山东河南
  phases:
