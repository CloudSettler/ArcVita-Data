events:
- id: guji-管仲-event-birth
  title_zh: 颍上出生少困遇鲍叔知
  date: '-0725'
  year_of: -725
  kind: birth
  description_zh: 管夷吾生于颍上早年困穷与鲍叔牙交善鲍叔知其贤而不以贫贱弃之分财让功始终相知
- id: guji-管仲-event-xiangqi
  title_zh: 鲁槛送齐鲍叔荐为相
  date: -0685
  year_of: -685
  kind: career
  description_zh: 桓公立后鲍叔牙力言非管夷吾不可桓公佯召而实欲用之管仲自鲁至堂阜脱桎齐祓见桓公遂拜上卿为仲父修国政
- id: guji-管仲-event-kemeng
  title_zh: 柯之盟劝桓守信归汶阳
  date: -0681
  year_of: -681
  kind: career
  description_zh: 齐桓与鲁庄为柯之盟曹刿劫盟请汶阳田管仲劝桓公许而不倍以信服诸侯翕然归齐霸业自此兴
- id: guji-管仲-event-death
  title_zh: 病卒于齐桓公四十一年
  date: '-0645'
  year_of: -645
  kind: death
  description_zh: 管仲相齐历年兴鱼盐通商旅定国政助桓公成霸业至前六四五年卒桓公悲之失左右手
