  title_zh: 会勘尼布楚永定和好条约
  summary: 以内大臣身份赴尼布楚与俄使会议划界， Anten 定逃人送还及禁越界之例，为后世中俄边界交涉立纲。
  phases:
  - key: brewing
    name: 受命筹边
    labels:
      zh: 筹划出使
    start_date: 1688-06-01
    highlight_event_id: guji-索额图-event-nerchinsk
  - key: breakthrough
    name: 两国会议定约
    labels:
      zh: 划界定约
    start_date: 1689-08-01
    highlight_event_id: guji-索额图-event-nerchinsk
  - key: closure
    name: 条约颁行守边
    labels:
      zh: 颁约守边
    start_date: 1689-09-07
    highlight_event_id: guji-索额图-event-nerchinsk
  decisions:
  - date: 1689-09-07
    title_zh: 议定逃人各归本国
    rationale: 仿照和好之义，杜绝边地容纳叛逃致生兵端，故立明条互相送还。
  - date: 1689-09-07
    title_zh: 以格尔必齐河额尔古纳河为界拆毁雅克萨
    rationale: 以山水分野明疆域，以拆城止争，使商旅通行而不驻兵相逼。
- id: guji-索额图-endeavor-2
  title_zh: 总理俄使商队接待与边界理赔
  summary: 居内廷总管大臣任内，接俄国西伯利亚衙门及伊尔库次克来函，办理商队入京贸易给照护送，并督蒙古台吉追还劫掠牲畜人口。
  phases:
  - key: brewing
    name: 受俄函请给贸易便利
    labels:
      zh: 互市接待
    start_date: 1695-04-01
    highlight_event_id: guji-索额图-event-trade-1695
  - key: climax
    name: 查办蒙古劫掠交涉
    labels:
      zh: 理赔缉逃
    start_date: 1695-11-10
    highlight_event_id: guji-索额图-event-border-1695
  - key: closure
    name: 定例护送商队往还
    labels:
      zh: 通商定例
    start_date: 1699-02-11
    highlight_event_id: guji-索额图-event-trade-1699
  decisions:
  - date: 1695-08-02
    title_zh: 准洛巴诺夫商队入境自由买卖拨馆安顿
    rationale: 钦遵和好条约许两国人民自由营商，故给栈院护照以示信，以利互通有无。
  - date: 1695-11-10
    title_zh: 饬蒙古台吉查还劫掠牲畜逃人
    rationale: 据俄使清册及班第尚书查办之诺，必追还方全条约之信，又严禁再入俄界为盗以免败盟。
events:
- id: guji-索额图-event-birth
  title_zh: 生于赫舍里家
  date: 1636
  year_of: 1636
  summary: 生于辽东赫舍里氏家，索尼之子，后以国舅亲臣入侍康熙。
  place_zh: 盛京
- id: guji-索额图-event-nerchinsk
  title_zh: 会定尼布楚条约
  date: 1689-09-07
  year_of: 1689
  summary: 以领侍卫内大臣赴尼布楚，与俄使戈洛文会议，划定东段边界，立逃人送还各守汛地之条。
  place_zh: 尼布楚
- id: guji-索额图-event-border-1695
  title_zh: 接伊尔库次克函办蒙古劫畜案
  date: 1695-11-10
  year_of: 1695
  summary: 接萨威洛夫经佘斯塔科夫专使来函，涉一六九一至一六九四年蒙古台吉劫掠俄边牲畜人口，饬阿列罕巴官员查还并禁再犯。
  place_zh: 北京
- id: guji-索额图-event-trade-1695
