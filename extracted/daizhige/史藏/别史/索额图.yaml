  date: 1695-08-02
  year_of: 1695
  summary: 接萨威洛夫函请准商人洛巴诺夫携俄货入中国自由买卖，依条约给栈院照料并护送归国。
  place_zh: 北京
- id: guji-索额图-event-trade-1699
  title_zh: 定勃科夫商队自嫩江护送入京例
  date: 1699-02-11
  year_of: 1699
  summary: 接西伯利亚衙门委尼尤斯函，准商人勃科夫携国库钱款货物自嫩江给马粮向导入京自由贸易。
  place_zh: 北京
- id: guji-索额图-event-death
  title_zh: 卒于京师
  date: 1703
  year_of: 1703
  summary: 以议政大臣坐事圈禁，卒于康熙四十二年，终结辅政议约一生。
  place_zh: 北京
