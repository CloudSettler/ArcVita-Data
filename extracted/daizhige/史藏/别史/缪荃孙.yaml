    title_zh: 金石别出单行先刊
    rationale: 通志浩大观成需时金石最易散佚宜先成一志刊行以存实物文字不待全书告成
  - date: 1911-06-01
    title_zh: 沿尹志而参新例详录题名
    rationale: 木本水源不掩前善而碑碣系一方信史必详考年月名氏以备人物职官选举之据
events:
