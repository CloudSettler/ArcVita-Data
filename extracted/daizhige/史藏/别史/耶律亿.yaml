  - date: 0916
    title_zh: 建牙开府筑城处汉人
    rationale: 使汉人各安生业有配偶垦田，以农桑之利养兵，以城郭之固控蕃汉
  - date: 0917
    title_zh: 纳卢文进率众来奔并发兵救围幽州
    rationale: 因晋内乱收其边将以壮势，乘势取燕地以通河北，纵不利亦扬威河朔
events:
- id: guji-耶律亿-event-birth
  title_zh: 生于契丹迭剌部
  date: 0872
  year_of: 872
  place_zh: 契丹迭剌部
  description_zh: 德祖长子，生而拓落多智，壮而雄健勇武，所寝夜有光，部落畏服
- id: guji-耶律亿-event-907-enthroned
  title_zh: 丁卯正月即皇帝位国号大契丹
  date: 0907
  year_of: 907
  place_zh: 契丹牙帐
  description_zh: 哈陶津可汗殂群臣奉遗命立之，正月庚寅即位，立舒噜氏为后，上尊号天皇帝地皇后，通好于梁晋
- id: guji-耶律亿-event-916-shence
  title_zh: 神册元年建牙开府上尊号
  date: 0916
  year_of: 916
  place_zh: 上京一带
  description_zh: 群臣属国上尊号大明大圣天皇帝，用韩延徽谋，建牙开府筑城郭立里市，使汉人安业垦田，兵势益强
- id: guji-耶律亿-event-death
  title_zh: 天显元年秋七月崩
  date: 0926
  year_of: 926
  place_zh: 扶余
  description_zh: 改元天显未几，秋七月崩，在位二十年，自丁卯开国至此，契丹始大，子德光嗣立
