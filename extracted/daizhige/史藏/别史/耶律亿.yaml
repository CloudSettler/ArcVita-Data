  decisions:
  - date: 0905
    title_zh: 不肯受代传旗鼓自守古汉城
    rationale: 以汉人众多为本，避七部劫盟之锋，保存实力待时并合
  - date: 0907
    title_zh: 奉遗命三让后即皇帝位建元
    rationale: 承哈陶津可汗遗命以正名分，立尊号后妃以成国体，永绝代立之制
- id: guji-耶律亿-endeavor-2
  title_zh: 建牙开府经略燕云
  summary_zh: 得韩延徽为谋主，筑城郭立里市垦莱田，通好梁晋，救卢文进围幽州，声播河朔
  phases:
