events:
- id: guji-胤禛-event-birth
  date: 1678-12-13
  year_of: 1678
  title_zh: 康熙十七年十月三十日诞生
  description_zh: 圣祖第四子，母孝恭仁皇后吴雅氏，诞生之夕祥光煜爚，天表奇伟，大智夙成
- id: guji-胤禛-event-succession
  date: 1722-12-20
  year_of: 1722
  title_zh: 畅春园奉大行遗诏继位
  description_zh: 圣祖宾天，宣谕皇四子人品贵重深肖朕躬必能克承大统，著继登基，亲为圣祖更衣，奉梓宫还宫安奉乾清宫
- id: guji-胤禛-event-grain
  date: 1722-12-23
  year_of: 1722
  title_zh: 饬修仓廒通米谷平米价
  description_zh: 遵奉圣祖原下之旨，命修补添建仓廒，准口外米谷进口，禁开设烧锅，并议云南四川鼓铸以平钱价
- id: guji-胤禛-event-enthronement
  date: 1722-12-27
  year_of: 1722
  title_zh: 太和殿即皇帝位颁诏改元雍正
  description_zh: 素服告受命于梓宫前，易礼服御太和殿升座受贺，颁诏大赦，以明年为雍正元年，永遵圣祖成宪
- id: guji-胤禛-event-death
  date: 1735-10-08
  year_of: 1735
  title_zh: 临御十有三载崩逝
  description_zh: 抚驭臣民乂安中外，刊颁训谕昭布章程，临御十有三载，垂裕亿万斯年
