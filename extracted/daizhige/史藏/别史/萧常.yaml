  - key: climax
    name: 必大作序
    labels:
      zh: 公论合证
    start_date: '1200-02-15'
    highlight_event_id: guji-萧常-event-present
  - key: closure
    name: 音义续补
    labels:
      zh: 音义义例传世
    start_date: 1200-03
    highlight_event_id: guji-萧常-event-present
  decisions:
  - date: 1200-02
    title_zh: 以纪表传载记四十二卷随表上进
    rationale: 小道或可观以备乙夜之观，论次十年仅足厕兔园之列
  - date: 1200-03
    title_zh: 成书后续辑补入音义四卷义例一卷
    rationale: 释裴松之遗恨，正音训明凡例，使后人可守其法
events:
- id: guji-萧常-event-birth
  date: '1150'
  year_of: 1150
  title_zh: 生于庐陵
  description: 庐陵人，乡贡进士，父寿朋病陈寿三国志帝魏黜蜀欲更定而未成
- id: guji-萧常-event-compile-start
  date: '1180'
  year_of: 1180
  title_zh: 潜心史学始著续后汉书
  description: 谓班固史为汉书范晔史为后汉书，乃起章武元年辛丑尽炎兴元年癸未，积勤二十年
- id: guji-萧常-event-compile-done
  date: '1200'
  year_of: 1200
  title_zh: 续后汉书四十二卷成
  description: 成帝纪年表各二卷列传十八卷吴载记十一卷魏载记九卷，别为义例音义
- id: guji-萧常-event-present
  date: '1200-02-15'
  year_of: 1200
  title_zh: 进续后汉书表周必大序
  description: 庆元六年庚申二月望缮写八册随表上进，周必大合习凿齿苏轼之论而证旧志之非作序
- id: guji-萧常-event-death
  date: '1205'
  year_of: 1205
  title_zh: 进书后卒
  description: 成书表进后卒于家，具体卒年失载，四库馆臣称其义例精审颇得史法
