  decisions:
  - date: '1185'
    title_zh: 以昭烈为正统附吴魏为载记
    rationale: 质古揆公一切反之于正，斥帝魏黜蜀之谬，还天理人心之正
  - date: '1195'
    title_zh: 增废传例多取裴注并别孝友忠义隐逸方技
    rationale: 追记英贤宪章于后，体本晋书，书法不在事实而在大防
