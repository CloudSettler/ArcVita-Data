  decisions:
  - date: 1875-01-12
    title_zh: 奉遗诏入承大统
    rationale: 穆宗大渐未有储贰，统绪至重，奉两宫懿旨承继文宗为子以续大统
  - date: 1875-01-13
    title_zh: 諭改御名缺笔以示避讳
    rationale: 钦遵宣宗二名不偏讳之成宪，上一字仍旧，下一字缺末笔作湉以昭尊亲
- id: guji-载湉-endeavor-2
  title_zh: 倚庐守制典学开局
  summary_zh: 以冲龄居丧持服三年，孝养两宫，请垂帘以禀承裁决，命儒臣直毓庆宫启沃，停三海工程罢贡献以示俭约
  phases:
  - key: brewing
    name: 倚庐寝苫
    labels:
      zh:
      - 守制尽哀
    start_date: 1875-01-13
    highlight_event_id: guji-载湉-event-succession
  - key: breakthrough
    name: 请谕垂帘
    labels:
      zh:
      - 垂帘禀承
    start_date: 1875-01-13
    highlight_event_id: guji-载湉-event-regency
  - key: climax
    name: 毓庆典学
    labels:
      zh:
      - 缉熙典学
    start_date: 1875-01-14
    highlight_event_id: guji-载湉-event-regency
  - key: closure
    name: 俭约开局
    labels:
      zh:
      - 俭约恤民
    start_date: 1875-01-15
    highlight_event_id: guji-载湉-event-reignname
  decisions:
  - date: 1875-01-13
    title_zh: 敬行三年之丧
    rationale: 虽遗诏令二十七日而除，心实不忍，恪遵古制持服三年以尽哀慕
  - date: 1875-01-13
    title_zh: 恭请两宫垂帘听政
    rationale: 尚在冲龄且时事多艰，不能无所禀承，不得已请垂帘，一俟典学有成即行归政
events:
- id: guji-载湉-event-birth
  date: 1871-08-14
  year_of: 1871
  title_zh: 诞生于太平湖邸第
  description_zh: 同治十年六月二十八日子时，醇亲王嫡福晋叶赫那拉氏生载湉于太平湖邸第，生而岐嶷，屡膺珍赐
  place_zh: 太平湖醇亲王邸第
- id: guji-载湉-event-succession
  date: 1875-01-12
  year_of: 1875
  title_zh: 奉懿旨承继文宗入承大统
  description_zh: 同治十三年十二月甲戌穆宗宾天，奉两宫懿旨以醇亲王子承继文宗为子入承大统，由潜邸进宫即正尊位，翦发成服举哀
  place_zh: 紫禁城养心殿乾清宫
- id: guji-载湉-event-reignname
  date: 1875-01-14
  year_of: 1875
  title_zh: 朱笔圈定建元光绪
  description_zh: 同治十三年十二月戊寅朱笔圈出建元年号用光绪二字，昭告中外以新纪元
  place_zh: 紫禁城
- id: guji-载湉-event-regency
  date: 1875-01-13
  year_of: 1875
  title_zh: 王大臣请两宫垂帘听政
  description_zh: 以嗣皇帝冲龄时事多艰，王公大学士六部九卿奏请垂帘，两宫姑如所请，命议垂帘章程，谕安摺三分呈递
  place_zh: 紫禁城
- id: guji-载湉-event-death
  date: 1908-11-14
  year_of: 1908
  title_zh: 光绪三十四年崩于瀛台
  description_zh: 在位三十四年，器用服御不敝不改，孝事宫闱，秉承慈谟，开宪政文明之局，崩于北京瀛台
  place_zh: 北京瀛台
