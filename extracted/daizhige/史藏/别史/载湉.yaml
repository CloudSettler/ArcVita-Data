  archetype: 冲龄继统守成之君
  dilemmas:
  - 以冲龄承继文宗入承大统，继统之序与本生之亲两难全
  - 两宫垂帘而时事多艰，恪守成宪与开创新猷两难兼
  lesson: 以幼冲托付艰大，惟孝养两宫，勤勉典学，仰承慈谟以守成图治
  summary_first_person: 朕名载湉，醇亲王之子，同治十年生于太平湖邸第，甫胜衣即膺锡圭，同治十三年冬奉两宫懿旨承继文宗入承大统，建元光绪，席地寝苫以终穆宗之丧，敬行三年，典学毓庆，惟赖慈谟以厘百工熙庶绩
  source_urls:
  - https://daizhige.org/史藏/别史/清實錄光緒朝實錄.html
