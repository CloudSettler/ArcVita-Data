    title_zh: 以严办汉奸为首务彻底根究水师包庇
    rationale: 汉奸一日不除则夷船一日不绝必先治己后治人访拏晋惠施姓等奸首根究弁兵收规代运情弊
  - date: 1840-05-16
    title_zh: 一见夷船奋力攻击不许以驱逐空言延宕
    rationale: 责令缴土具结即是许其停泊盘诘交犯反招迁延惟水师环击陆路炮台夹攻方能驱绝
- id: guji-邓廷桢-endeavor-2
  title_zh: 筹议水陆巡防炮墩关津清弊
  summary_zh: 会同抚提筹划陆路添兵把守海口水师分帮梭巡拦截易炮台为炮墩稽查商渔船只与关津丁役以清弊源
