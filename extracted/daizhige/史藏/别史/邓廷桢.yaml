  - 汉奸勾引夷船不除则夷船不绝当先治内还是水陆并举
  - 夷船窜至仅驱逐了事还是奋力轰击恐开边衅与纵寇之权衡
  - 沿海大姓通夷积重文武包庇当彻底根究还是持重姑容
  lesson: 治人必先治己内密然后外严严办汉奸方能永杜夷船来闽
  summary_first_person: 吾以闽浙总督会同钦差查办闽海夷务深知夷船由汉奸勾引而来故以严办汉奸为首务水师奋力攻击陆路把守口岸添兵设墩清查关津必使巡逻周密夷船不得阑入汉奸无从勾串以靖海疆
