  - date: 1840-05-16
    title_zh: 易炮台为炮墩并严编商渔船号悬赏围拏
    rationale: 控制海口最重炮台变通为墩较为稳妥商船给照亲诣稽查渔船编立字号澳甲按日稽查人船并获即赏
  - date: 1840-05-16
    title_zh: 调拨本地营弁严究关津贿纵以清弊源
    rationale: 水陆营弁多由本地兵丁拔补与囤户贩徒熟习分肥浦城分水关等通浙赣孔道必量为调拨定案根究经过关津
