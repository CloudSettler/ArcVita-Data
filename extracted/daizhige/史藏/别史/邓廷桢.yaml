  summary_zh: 历陈嘉庆十九年以来夷船由南澳铜山厦门蔓延至默林深沪衙口大坠围头皆由汉奸勾引奏报去冬今春陈化成窦振彪程恩高等开炮轰击情形并派刘耀椿李昭美督办武攀凤向思璜驻守筑墩安炮新购炮位配船亲赴泉州督办
