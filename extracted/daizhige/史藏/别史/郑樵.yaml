person:
  qid: guji-郑樵
  name_zh: 郑樵
  names:
    zh: 郑樵
    en: Zheng Qiao
  lifespan:
    birth:
      date: 1104
      precision: year
      is_circa: false
      raw: 宋崇宁三年福建莆田
    death:
      date: 1162
      precision: year
      is_circa: false
      raw: 宋绍兴三十二年临安
  birth_date: 1104
  death_date: 1162
  era: 宋
  reign_ref: 宋高宗
  archetype: 通博史家
  dilemmas:
  - 会通千古与精密考证难以两全，博则多失，约则难通
  - 继司马迁通史之法与救班固断代之弊，去从两难
  lesson: 会通所以极古今之变，博雅所以尽天下之书，然多而不能无失，著述者当知所惧
  summary_first_person: 吾为郑樵，字渔仲，莆田人也，隐于夹漈，三十年搜书著述，仿历代史例采正史及百家杂录为纪为谱为略，成通志二百卷，以二十略为菁华，总天下之大学术，欲通古今而归于一，虽自信卓然，亦知著述之难不敢自掩也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E9%80%9A%E5%BF%97.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%88%AB%E5%8F%B2/%E9%80%9A%E5%BF%97.html
endeavors:
- id: guji-郑樵-endeavor-1
  title_zh: 隐居夹漈搜书著述
  description: 游历四方搜访遗书，隐居夹漈山中三十年，囊括贯串为通志奠基
  phases:
  - key: brewing
    name: 游学搜书
    labels:
      zh:
      - 访书
      - 积学
    start_date: 1127
    highlight_event_id: guji-郑樵-event-seclusion
  - key: breakthrough
    name: 定通史之例
    labels:
      zh:
      - 立法
    start_date: 1140
    highlight_event_id: guji-郑樵-event-seclusion
  - key: climax
    name: 二十略初具
    labels:
      zh:
      - 纂略
    start_date: 1150
    highlight_event_id: guji-郑樵-event-present
  - key: closure
    name: 通志成编
    labels:
      zh:
      - 成书
    start_date: 1161
    highlight_event_id: guji-郑樵-event-present
  decisions:
  - date: 1140
    title_zh: 弃断代而取通史
    rationale: 以周秦不相因古今成间隔为弊，效司马迁通黄帝至于秦汉之意，贯二帝三王而通为一家
  - date: 1150
    title_zh: 总大学术为二十略
    rationale: 以志为宪章所系，非老于典故不能为，故增氏族六书七音都邑草木昆虫五略，析礼艺文为子目，以尽学者能事
- id: guji-郑樵-endeavor-2
  title_zh: 献通志创图谱校雠之学
  description: 以通志进于朝授右迪功郎，申明左图右书记有记无之法，黜五行谶纬之妄
  phases:
  - key: brewing
    name: 校雠图谱
    labels:
      zh:
      - 校雠
    start_date: 1145
    highlight_event_id: guji-郑樵-event-seclusion
  - key: breakthrough
    name: 削五行作灾祥
    labels:
      zh:
      - 辨妄
    start_date: 1155
    highlight_event_id: guji-郑樵-event-present
  - key: climax
    name: 献书授官
    labels:
      zh:
      - 献书
    start_date: 1161
    highlight_event_id: guji-郑樵-event-present
  - key: closure
    name: 书传后世列三通
    labels:
      zh:
      - 传世
    start_date: 1162
    highlight_event_id: guji-郑樵-event-death
  decisions:
  - date: 1155
    title_zh: 削洪范五行传而作灾祥略
    rationale: 以一虫一物皆绳以五行及牵合附会为巫瞽之学，不足以明天人之变，故直书灾祥以存真
  - date: 1161
    title_zh: 进通志二百卷于朝
    rationale: 以葵藿之心期于盛世，欲广考索之助，使后之秉史笔者知会通之道，不专事褒贬言语
events:
- id: guji-郑樵-event-birth
  title_zh: 出生于兴化莆田
  date: 1104
  year_of: 1104
  kind: birth
  description: 宋崇宁三年生于兴化军莆田，字渔仲，少负淹博，有闳通之志
- id: guji-郑樵-event-seclusion
  title_zh: 隐居夹漈著书
  date: 1140
  year_of: 1140
  kind: career
  description: 南渡后不求仕进，隐居夹漈山中，搜罗旧籍参以新意，日夜纂述，二十略之业始基
- id: guji-郑樵-event-present
  title_zh: 献通志授右迪功郎
  date: 1161
  year_of: 1161
  kind: career
  description: 以通志二百卷进于朝，凡帝纪十八卷后妃列传二卷年谱四卷略五十一卷列传一百二十五卷，授右迪功郎枢密院编修官
- id: guji-郑樵-event-death
  title_zh: 卒于临安
  date: 1162
  year_of: 1162
  kind: death
  description: 宋绍兴三十二年卒，通志与杜佑通典马端临文献通考并称三通，资后世考镜
