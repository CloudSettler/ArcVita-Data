  year_of: 1663
  title_zh: 癸卯六月初六日被郑锦诱骗羁禁厦门
  description: 被郑锦诱骗至厦门羁禁，部曲郑鸣骏等逃生投诚
- id: guji-郑泰-event-death
  type: death
  date: 1663-06-10
  year_of: 1663
  title_zh: 癸卯六月初十日自缢死
  description: 羁禁四日后自缢死于厦门，郑锦驾船抄其家
