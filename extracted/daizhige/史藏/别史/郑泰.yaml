  description: 壬寅年正月为郑成功拘拿，招贼兵五千人自卫，富有五百万而拥众海上
- id: guji-郑泰-event-1
  type: career
  date: 1662-08-24
  year_of: 1662
  title_zh: 永历十六年八月二十四日连名移咨归命
  description: 与洪旭黄廷具咨靖南王及总督李率泰，缴敕三道公侯伯印六颗州县印十五颗，造报官兵四十一万余船五千余人口三百余万，请以台湾安插
- id: guji-郑泰-event-3
