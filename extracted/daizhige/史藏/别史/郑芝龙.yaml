    title_zh: 拥唐王即皇帝位以福建为福京
    rationale: 借拥立之功取爵位兵权，以闽自保而观天下变
  - date: 1645-09-01
    title_zh: 以饷绌为辞令鸿逵郑彩出关而不进
    rationale: 恐精兵出关闽地空虚，不愿为他人作嫁且与清暗通款
events:
- id: guji-郑芝龙-event-birth
  type: birth
  date: 1604-04-16
  year_of: 1604
  title_zh: 生于泉州南安
  description: 明万历三十二年生于福建泉州府南安，少年走海往来倭吕宋之间
- id: guji-郑芝龙-event-1628
  type: career
  date: 1628-09-01
  year_of: 1628
  title_zh: 降于巡抚熊文灿
  description: 海寇郑芝龙受招降于福建巡抚熊文灿，既降受责报效，先后击擒李魁奇，蹙钟斌投海，海警遂息
- id: guji-郑芝龙-event-1635
  type: career
  date: 1635-04-01
  year_of: 1635
  title_zh: 田尾远洋击灭刘香
  description: 合粤兵击刘香老于田尾远洋，香势蹙自焚溺死，康承祖等脱归，其属降于温处
- id: guji-郑芝龙-event-1640
  type: career
  date: 1640-08-01
  year_of: 1640
  title_zh: 加署福建总兵
  description: 既俘刘香海氛颇息，又以海利交通朝贵，加署总兵浸以大显
- id: guji-郑芝龙-event-1645
  type: career
  date: 1645-08-01
  year_of: 1645
  title_zh: 拥唐王即位封平国公
  description: 奉唐王聿键入闽即皇帝位于福州，改元隆武，芝龙封平虏侯寻晋平国公，子森赐国姓改名成功
- id: guji-郑芝龙-event-1646
  type: career
  date: 1646-03-01
  year_of: 1646
  title_zh: 拥驾不前驻延平
  description: 唐王将出汀入赣，芝龙使军民遮道拥驾不得行，不得已驻札延平，郑彩弃广信奔入关
- id: guji-郑芝龙-event-death
  type: death
  date: 1661-11-24
  year_of: 1661
  title_zh: 卒于北京
  description: 隆武败后降清入京，后以子成功抗清不已，被杀于北京
