  summary_first_person: 我生长泉州，少年走海，聚众数万，横行闽浙，后受巡抚熊文灿招抚，为朝廷平李魁奇、钟斌、刘香诸盗，遂总镇福建，拥立唐王于福京，进封平国公，专制闽事，然犹豫不出关，终致隆武败亡
  source_urls:
