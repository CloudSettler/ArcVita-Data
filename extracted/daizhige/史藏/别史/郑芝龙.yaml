    title_zh: 接受熊文灿招抚
    rationale: 知官军可利用而海寇难久，借招安得名位以图大展
  - date: 1635-04-01
    title_zh: 合粤兵击刘香于田尾远洋
    rationale: 刘香连犯闽广，不灭之则己不得专海利与军功
- id: guji-郑芝龙-endeavor-2
  title_zh: 拥立隆武制闽
  summary: 甲申国变后拥唐王聿键即位于福州，兄弟子侄尽封伯侯，专掌兵饷而逗留不出关
