- id: guji-郝经-event-counsel
  title_zh: 藩府进议拜翰林侍读
  date: 1260
  year_of: 1260
  place_zh: 燕京
  description_zh: 以学行入忽必烈王府进立政议中统元年拜翰林侍读学士
- id: guji-郝经-event-embassy
  title_zh: 充国信使使宋
  date: 1260
  year_of: 1260
  place_zh: 宿州
  description_zh: 中统元年充国信使告即位至宿州遣副使请入国日期宋方匿鄂州请和事不报
- id: guji-郝经-event-detained
  title_zh: 被贾似道拘留真州
  date: 1260
  year_of: 1260
  place_zh: 真州忠勇军营
  description_zh: 贾似道恐泄露鄂州称臣纳币之谋拘于真州上表请入见数上书论和战皆不报遂留十六年
- id: guji-郝经-event-writing
  title_zh: 羁馆著续后汉书成
  date: 1272
  year_of: 1272
  place_zh: 真州新馆
  description_zh: 于使馆著书七种此为其一凡九十卷实一百三十卷升昭烈为纪黜魏吴为传作八录补志书佐苟宗道为注壬申岁作序时不知中统改为至元
- id: guji-郝经-event-release
  title_zh: 宋败放归至燕京
  date: 1275
  year_of: 1275
  place_zh: 燕京
  description_zh: 至元十二年宋事败得放归国至燕京不久病卒赠昭文馆大学士谥文忠追封冀国公所著与陵川集延祐戊午官为刊行
- id: guji-郝经-event-death
  title_zh: 病卒
  date: 1275
  year_of: 1275
  place_zh: 燕京
  description_zh: 至元十二年归国后病卒一生困苦艰辛不肯少屈读其书可以想见其为人
