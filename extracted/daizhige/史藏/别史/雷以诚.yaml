  - 军需孔急与不扰民不累商之间如何两全
  - 富家捐输有尽而商贾转运无穷如何经久便民
  lesson: 取之有方则细水长流征于无形而民不觉
  summary_first_person: 余守江宁值粤匪窜扰饷绌兵单乃仿一文愿之法于里下河米行试行捐厘每石五十文取于买卖所入商民相安遂推广各行铺以济军需
  source_urls:
  - https://daizhige.org/史藏/别史/台湾私法商事编.html
endeavors:
- id: guji-雷以诚-endeavor-1
  title_zh: 里下河劝捐练壮勇保守东路
  description: 咸丰初粤匪窜扰江北饷绌于仙女庙邵伯宜陵张纲沟等镇劝谕米行捐厘练勇守御
  phases:
  - key: brewing
    name: 里下河察访米多价贱可捐厘
    labels:
      zh: 筹划劝捐
    start_date: 1853-09-01
    highlight_event_id: guji-雷以诚-event-1
  - key: breakthrough
    name: 仙女庙数镇米行每石捐钱五十试行
    labels:
      zh: 试行见效
    start_date: 1853-09-15
    highlight_event_id: guji-雷以诚-event-1
  - key: climax
    name: 数月捐至二万贯商民相安如同无事
    labels:
      zh: 商民相安
    start_date: 1854-01-01
    highlight_event_id: guji-雷以诚-event-1
  - key: closure
    name: 推及里下河各州县米行大行铺户一律照捐
    labels:
      zh: 推广收束
    start_date: 1854-03-10
    highlight_event_id: guji-雷以诚-event-2
  decisions:
  - date: 1853-09-01
    title_zh: 仿林则徐一文愿法于米行劝捐厘金
    rationale: 每升仅捐半文于民生毫无关碍而聚之则多不扰民不累商
  - date: 1854-03-10
    title_zh: 推行里下河各州县大行铺户百分捐一分
    rationale: 富家捐输有尽商贾转运无穷视买卖所入为断细水长流源远不竭
- id: guji-雷以诚-endeavor-2
  title_zh: 试行捐厘助饷奏请通省推广裕储
  description: 以里下河办有成效刊刻章程奏请江南北督抚河臣分委廉明之员一体劝办军务告竣再停
  phases:
  - key: brewing
    name: 书夜思求无损于民有益于饷经久便民之法
    labels:
      zh: 变通捐输
    start_date: 1853-12-01
    highlight_event_id: guji-雷以诚-event-1
  - key: breakthrough
    name: 上奏试行捐厘助饷业有成效开列章程呈览
    labels:
      zh: 奏陈成效
    start_date: 1854-03-10
    highlight_event_id: guji-雷以诚-event-2
  - key: climax
    name: 奉谕怡良许乃钊杨以增就江南北情形妥速商酌
    labels:
      zh: 奉谕商办
    start_date: 1854-04-01
    highlight_event_id: guji-雷以诚-event-2
  - key: closure
    name: 各府州县城市镇集大行铺户一律劝办小铺手艺概免
    labels:
      zh: 体恤推广
    start_date: 1854-05-01
    highlight_event_id: guji-雷以诚-event-2
  decisions:
  - date: 1854-03-10
    title_zh: 奏请江苏督抚河臣分地推广捐厘
    rationale: 里下河仅弹丸一隅江南北未办尚多若一体劝办军需可期大有接济
  - date: 1854-03-10
    title_zh: 小铺户手艺人概行蠲免并声明军务竣即停
    rationale: 藉资民力之中仍寓勤恤民隐轻而易举绝无苦累众擎易举
