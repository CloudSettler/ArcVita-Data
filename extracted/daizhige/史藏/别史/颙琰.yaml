    title_zh: 谕按口计食严查渔船夹带
    rationale: 盗船淡水食米必取自沿海渔船接济，查多带粮米则盗匪无所得食不能久住洋面
  - date: 1796-07-04
    title_zh: 赏獭窟舵守备蓝翎令出洋缉捕
    rationale: 逾格施恩使感激奋勉报效，以熟悉水道者攻盗，事竣宜散不宜聚免故智复萌
  - date: 1797-09-13
    title_zh: 命林发枝来京安置余党分省安插
    rationale: 有名盗首不可仍留闽省防勾结，送京量加安插余伙远发不近海洋省分方妥
- id: guji-颙琰-endeavor-2
  title_zh: 整饬台湾营伍吏治赈灾安民
  summary_zh: 针对台湾书役刊刻图章图谋械斗营兵造逆旗吓诈及千总失炮等案，分别惩奖明法纪，又值台湾飓风损晚稻民居，命查明蠲缓拨藩库赈恤劝种地瓜杂粮并豫筹台米接济内地
  phases:
