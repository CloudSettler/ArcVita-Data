  decisions:
  - date: 1796-03-05
    title_zh: 命嗣后纠人谋逆首犯即凌迟处死
    rationale: 台湾远隔重洋民俗刁悍，仅正法不足惩创，虽纠伙未成亦不得轻纵以昭法纪
  - date: 1797-03-16
    title_zh: 营兵为从加等治罪把总戴鹏以千总用
    rationale: 巡查是专责反从奸民造旗吓诈，所办尚轻，当连坐家属以儆而破案者当赏以劝
  - date: 1797-12-05
    title_zh: 命动藩库赈台湾风灾劝种杂粮
    rationale: 台湾全藉晚收资口食福兴漳泉夙藉台米，坍房给修费米谷禁酿酒豫备明岁民食
