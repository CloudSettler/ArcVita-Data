    start_date: 1796-03-05
    highlight_event_id: guji-颙琰-event-1796-taiwan-an
  - key: climax
    name: 淡水逆旗案严惩营兵奖励把总
    labels:
      zh:
      - 嘉庆二年二月谕
      - 革退失察家属治罪
    start_date: 1797-03-16
    highlight_event_id: guji-颙琰-event-1796-taiwan-an
  - key: closure
