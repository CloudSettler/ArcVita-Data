    name: 直书曲笔之辨
    labels:
      zh: 品藻鉴识
    start_date: 456
    highlight_event_id: guji-刘知几-event-shitong
  - key: climax
    name: 忤时不移
    labels:
      zh: 申正史法
    start_date: 457
    highlight_event_id: guji-刘知几-event-mishujian
  - key: closure
    name: 留后东都全身守道
    labels:
      zh: 不遑启处而终
    start_date: 465
    highlight_event_id: guji-刘知几-event-death
  decisions:
  - date: 456
    title_zh: 立直书曲笔鉴识诸篇
    rationale: 言事相兼烦省合理方能救史汉恢博之失，故明褒贬以显国统
  - date: 457
    title_zh: 专知史事不避权贵
    rationale: 宁为忤时之论不作谀时之文，以存不刊之言著将来之法
events:
- id: guji-刘知几-event-birth
  date: 433
  year_of: 433
  title_zh: 生于彭城
  description: 唐高宗龙朔元年，生于彭城刘氏，字子玄，少博学能文
- id: guji-刘知几-event-xiushi
  date: 450
  year_of: 450
  title_zh: 长安二年入史馆兼修国史
  description: 以著作佐郎兼修国史，寻迁左史于门下撰起居注，后兼中书舍人史任，历事两京遍居司籍之曹
- id: guji-刘知几-event-shitong
  date: 456
  year_of: 456
  title_zh: 景龙四年成史通二十卷
  description: 以载削余暇商榷史篇，区分类聚编次内篇外篇，论六家二体载言纪传，定名曰史通
- id: guji-刘知几-event-mishujian
  date: 457
  year_of: 457
  title_zh: 迁秘书少监专知史事
  description: 今上即位后除著作郎太子中允率更令兼修史，大驾还京后驿征入京专知史事，仍迁秘书少监
- id: guji-刘知几-event-death
  date: 465
  year_of: 465
  title_zh: 开元九年卒
  description: 守直道以终，卒于唐玄宗开元九年，其史通为后世史评开山
