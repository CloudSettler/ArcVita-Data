  dilemmas:
  - 显先人之功与守君实付托之嘱如何两全
  - 质疑通鉴凡例是非予夺与尊重大义如何不以小言害道
  lesson: 显亲之善而不讳己失，以质直传信，使后世有考而不以小道害大道
  summary_first_person: 我是高安秘书丞刘恕长子，幼侍父疾备闻通鉴论议，父殁后痛其预修之功不彰，纂集父与司马君实往复问难为通鉴问疑，又以八事问范祖禹得答而悔前非，具载问答以示后世
