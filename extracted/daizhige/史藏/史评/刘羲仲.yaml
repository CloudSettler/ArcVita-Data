  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%8F%B2%E8%AF%84/%E9%80%9A%E9%89%B4%E9%97%AE%E7%96%91.html
endeavors:
- id: guji-刘羲仲-endeavor-1
  title_zh: 纂集通鉴问疑显先人功
  summary_zh: 伤父刘道原预修通鉴功不彰，集其与司马光往还论难三国至南北朝史事而成一卷
  phases:
  - key: brewing
    name: 幼侍家庭备闻余论
    labels:
      zh: 侍疾闻论
    start_date: 1070-01-01
    highlight_event_id: guji-刘羲仲-event-father-death
  - key: climax
    name: 纂集往复问难成书
    labels:
      zh: 纂集问疑
    start_date: 1084-01-01
    highlight_event_id: guji-刘羲仲-event-tongjian-dingben
  decisions:
  - date: 1084-01-01
    title_zh: 痛先人不及见成书乃纂集问难
    rationale: 恐后世不知秘书丞于通鉴尝预有力，故录正统名号崩薨历法均田诸辩使有考
  - date: 1084-06-01
    title_zh: 受君实定本传家守嘱
    rationale: 君实以道原遗言求定本乃付其家，嘱若欲传录但传予本，故守信传录不私增损
- id: guji-刘羲仲-endeavor-2
  title_zh: 八疑问范祖禹求明凡例
  summary_zh: 以通鉴取舍凡例是非予夺之故书问范纯夫，得答剖析而悔难，深惧小言破言故具载之
  phases:
  - key: breakthrough
    name: 列八事致书质疑
    labels:
      zh: 八事问疑
    start_date: 1085-01-01
    highlight_event_id: guji-刘羲仲-event-question-fan
  - key: closure
    name: 得答悔误具载自省
    labels:
      zh: 得答悔载
    start_date: 1085-06-01
    highlight_event_id: guji-刘羲仲-event-question-fan
  decisions:
  - date: 1085-01-01
    title_zh: 以屈原孟荀取舍正统符谶等八事问纯夫
    rationale: 不及见君实不备知凡例是非予夺所以然，故就尝预修之范氏求解，以解诸儒之疑
  - date: 1085-06-01
    title_zh: 悔诘难之误具载答书
    rationale: 得祖禹剖析始知所疑之失，自言恐复有小言害道如己所云，故载之使后世有考
events:
- id: guji-刘羲仲-event-birth
  title_zh: 生于高安刘氏为刘恕长子
  date: 1052-01-01
  year_of: 1052
  place_zh: 高安
  description_zh: 秘书丞高安刘恕长子，幼侍疾家庭备闻通鉴余论
- id: guji-刘羲仲-event-father-death
  title_zh: 父刘道原捐馆论次未成
  date: 1078-01-01
  year_of: 1078
  description_zh: 刘恕以直不容于世，欲论次一家之书为万世传而书未及成捐弃馆舍，羲仲伤其功不彰
- id: guji-刘羲仲-event-tongjian-dingben
  title_zh: 通鉴成得君实所付定本
  date: 1084-12-01
  year_of: 1084
  description_zh: 通鉴成于熙宁以后，司马光以道原遗言求定本乃付其家，嘱他日传录但传予本
- id: guji-刘羲仲-event-question-fan
  title_zh: 致书范祖禹问凡例八事得答
  date: 1085-03-01
  year_of: 1085
  description_zh: 书所疑问屈原取舍孟荀传论南北朝称帝称主符谶神怪褒贬疑以示疑八事，祖禹具为剖析，羲仲悔难而具载之
- id: guji-刘羲仲-event-death
  title_zh: 卒于北宋末
  date: 1120-01-01
  year_of: 1120
  description_zh: 既成通鉴问疑一卷传世，使后世知刘道原考证差谬之精与其绍统之论，卒后其书入四库史评
