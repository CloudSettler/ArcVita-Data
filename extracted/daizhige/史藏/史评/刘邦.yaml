  - key: closure
    name: 垓下围楚天下悉定
    labels:
      zh:
      - 垓下之围
      - 天亡项羽
    start_date: -0202-12
    highlight_event_id: guji-刘邦-event-gaixia-miechu
  decisions:
  - date: -0206-10
    title_zh: 纳樊哙张良谏还军霸上
    rationale: 为天下除残贼宜缟素为资，始入秦即安其乐则失人心而启楚忿，故急还霸上以全大义
  - date: -0205-04
    title_zh: 为义帝发丧合诸侯伐楚
    rationale: 项羽放杀其主天下之贼，明其为贼敌乃可服，故举哀发使以大义号召四海
  - date: -0204-04
    title_zh: 出黄金行反间疑楚君臣
    rationale: 项王意忌信谗骨鲠之臣不过数人，间其君臣以疑其心则可举兵攻而破之
- id: guji-刘邦-endeavor-2
  title_zh: 西都长安立汉家制度
  summary: 入关得秦图籍知天下阨塞，纳娄敬张良策西都长安，以礼服鲁，以宽厚立法，垂汉家四百年之基
  phases:
  - key: brewing
    name: 收秦图籍知天下阨塞
    labels:
      zh:
      - 萧何收图籍
      - 具知户口强弱
    start_date: -0206-10
    highlight_event_id: guji-刘邦-event-ruguan-yuefa
  - key: breakthrough
    name: 纳策西都长安
    labels:
      zh:
      - 金城千里
      - 天府之国
    start_date: -0202-02
    highlight_event_id: guji-刘邦-event-dingdu-changan
  - key: climax
    name: 礼服守义之鲁
    labels:
      zh:
      - 弦诵不废
      - 守礼义国
    start_date: -0202-02
    highlight_event_id: guji-刘邦-event-dingdu-changan
  - key: closure
    name: 崩于长乐传祚后世
    labels:
      zh:
      - 约法为祖
      - 汉祚初定
    start_date: -0195-04
    highlight_event_id: guji-刘邦-event-death
  decisions:
  - date: -0202-02
    title_zh: 用娄敬张良策定都关中
    rationale: 洛阳虽固而小薄四面受敌，关中阻三面制诸侯河渭漕挽给京师，故即日西都长安
  - date: -0202-02
    title_zh: 持项王头示鲁以礼降之
    rationale: 鲁闻弦诵守礼义为主死节，引天下兵欲屠之则悖，故以礼服而全其节义之名
events:
- id: guji-刘邦-event-birth
  date: '-0256'
  year_of: -256
  title_zh: 生于沛丰邑
  description: 秦昭襄王五十一年生于沛县丰邑，素宽大长者，见秦苛法而志扶义
- id: guji-刘邦-event-ruguan-yuefa
  date: -0206-10
  year_of: -206
  title_zh: 西入咸阳约法三章
  description: 元年冬十月沛公西入咸阳，还军霸上，悉召父老约法三章杀人者死伤人及盗抵罪，秦民大喜汉祚始定
  endeavor_ref: guji-刘邦-endeavor-1
- id: guji-刘邦-event-pengcheng-zhibai
  date: -0205-04
  year_of: -205
  title_zh: 为义帝发丧伐楚败于彭城
  description: 二年为义帝发丧袒而大哭，率五十六万人入彭城收货宝美人置酒高会，为项王三万人晨击大破，睢水为之不流
  endeavor_ref: guji-刘邦-endeavor-1
- id: guji-刘邦-event-xingyang-fanjian
  date: -0204-04
  year_of: -204
  title_zh: 荥阳相持以反间疑范增
  description: 四年楚围汉于荥阳急，出黄金四万斤与陈平行反间，宣言钟离昧等欲与汉合，项王疑亚父不肯听其急攻，亚父怒归疽发而死
  endeavor_ref: guji-刘邦-endeavor-1
- id: guji-刘邦-event-gaixia-miechu
  date: -0202-12
  year_of: -202
  title_zh: 垓下破楚楚地悉定
  description: 五年项王至垓下兵少食尽，汉及诸侯围之数重，项王夜溃围至东城自刎，楚地悉定独鲁持头示之乃降
  endeavor_ref: guji-刘邦-endeavor-1
- id: guji-刘邦-event-dingdu-changan
  date: -0202-02
  year_of: -202
  title_zh: 纳娄敬张良策西都长安
  description: 娄敬言秦地四塞可都，群臣争言洛阳，张良言洛阳非用武之国关中金城千里天府之国，上即日车驾西都长安
  endeavor_ref: guji-刘邦-endeavor-2
- id: guji-刘邦-event-death
  date: -0195-06-01
  year_of: -195
  title_zh: 崩于长乐宫
  description: 汉十二年四月甲辰崩于长乐宫，在位十二年，以约法宽大开汉家基业，太子盈嗣立
