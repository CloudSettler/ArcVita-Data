endeavors:
- id: guji-刘邦-endeavor-1
  title_zh: 扶义入关楚汉争雄定天下
  summary: 自怀王约先入关者王之，西入咸阳约法三章，还军霸上，经彭城之败，荥阳相持用反间，卒垓下灭楚而定天下
  phases:
  - key: brewing
    name: 扶义西入约法三章
