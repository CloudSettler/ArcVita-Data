  dilemmas:
  - 入秦宫室之乐茍安一时与还军霸上图天下之远略
  - 为义帝缟素讨贼之大义与入彭城收宝货美人置酒高会之私欲
  - 太公置俎上分杯羹之忍与顾家徇私而殒身丧国之险
  - 捐关东之地笼络韩信彭越英布与天无二日虑叛臣终叛之忧
  lesson: 以宽大扶义得人心，以能忍能诎胜粗暴，收拾群雄而归于一统
  summary_first_person: 吾起自沛上，以宽大长者扶义而西，与父老约法三章，忍小忿于汉中，还定三秦，缟素为义帝伐楚，虽彭城大败而不馁，卒以荥阳相持垓下破楚而定天下，西都长安，与民更始
  source_urls:
