  dilemmas:
  - 宽严治体当如何使仁意流行于纪纲整肃之中
  - 革弊当修举大纲还是尽变祖宗成法以趋急功
  lesson: 仁意须藉纪纲以达于下，革弊当修大纲而不尽变其法，否则宽流于纵弛严流于惨刻
  summary_first_person: 我字时可，晋江人，淳佑中进士，官国子监丞兼崇政殿说书，后徙肇庆教授，平日以讲贯发明本朝圣君贤相之心，著宋大事记讲义二十三卷，以治体制度国势三论统摄列朝大事，欲使后学审其根源而不惑于熙丰更变之说
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/史评/宋大事记讲义.md
  - https://daizhige.org/史藏/史评/宋大事记讲义.html
