    start_date: '1255'
    highlight_event_id: guji-吕中-event-jiangshu
  - key: climax
    name: 直陈宽严纪纲仁意并行
    labels:
      zh: 直陈治体
    start_date: '1258'
    highlight_event_id: guji-吕中-event-jiangshu
  - key: closure
    name: 徙肇庆教授讲学一方
    labels:
      zh: 外转授业
    start_date: '1265'
