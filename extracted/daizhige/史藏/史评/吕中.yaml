    start_date: '1260'
    highlight_event_id: guji-吕中-event-jiangshu
  decisions:
  - date: '1248'
    title_zh: 以三论统摄全书
    rationale: 治体观修短，制度观治乱，国势观强弱，先明大义而后考源委，使言近而指远
  - date: '1252'
    title_zh: 年记大事随朝分类随事通释
    rationale: 不徒编年，考求源委显微阐幽，论朝廷归君心，论官僚归宰辅，论良法归美意，外患归自治
- id: guji-吕中-endeavor-2
  title_zh: 国子监进讲转任肇庆教授
  summary: 以进士入太学为国子监丞兼崇政殿说书，进讲宋朝家法，后徙肇庆教授，以师说育才
  phases:
  - key: brewing
