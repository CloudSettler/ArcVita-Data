  decisions:
  - date: '1255'
    title_zh: 以本朝仁意纪纲进讲君前
    rationale: 鉴熙丰尽变祖宗之失，欲正君心于纪纲整肃之中行仁意，使制度不坏于急政
  - date: '1265'
    title_zh: 安于外转以讲学续志
    rationale: 朝论难久安，愿与学者审其是，以讲论稿本付门人编次，垂亿万年无疆之休
