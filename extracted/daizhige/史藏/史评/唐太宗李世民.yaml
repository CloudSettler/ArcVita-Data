  reign_ref: 唐太宗，武德九年八月即位
  archetype: 拨乱之主
  dilemmas:
  - 晋阳起兵前 '胁父臣虏'：恐高祖不听而设谋迫其起兵，又称臣突厥以求援，济世之志与行正之义难以两全
  - 与太子建成兄弟相争，功高而位居藩王，终以兵变杀兄屠弟而得储位
  lesson: 拨乱之才与济世之志须以义佐之；创业之不正，子孙则而象之，影响必应
  summary_first_person: 我太宗李世民，隋大业末知隋必亡，阴结豪杰，谋动太原义兵，戮佞人高德儒以明赏罚。武德中功盖天下，为太子建成所忌，屡遭倾轧。武德九年六月，我于玄武门诛建成、元吉，立为皇太子，总决军国庶事，八月受高祖传位，遂启贞观之治。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=5924
