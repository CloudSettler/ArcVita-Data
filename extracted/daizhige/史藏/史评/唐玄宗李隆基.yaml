  dilemmas:
  - 早年助父平定韦后之乱、位非嫡长而依功得立
  - 晚年怠政崇道、宠信佞臣致安史之乱
  lesson: 明皇崇老子而扇方士之说，虽开元致治，然怠于正家与言路，终兆天宝之乱
  summary_first_person: 我李隆基，即唐明皇。史臣谓我祖高宗、明皇扇崇老之风，跻老子于上帝；我以开元之治显于前，以天宝之乱败于后，功过俱在唐鉴论断之中。
