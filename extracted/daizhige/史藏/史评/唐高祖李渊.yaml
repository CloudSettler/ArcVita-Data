  title_zh: 平江陵斩萧铣
  summary: 赵郡王孝恭、李靖围江陵，萧铣降而数其罪斩于都市，范祖禹讥其为淫刑。
- id: guji-李渊-event-abdicate
  date: 626-08
  year_of: '626'
  type: endeavor
  person: guji-李渊
  title_zh: 传位于李世民
  summary: 六月秦王世民杀皇太子建成、齐王元吉，八月高祖传位于太子。
