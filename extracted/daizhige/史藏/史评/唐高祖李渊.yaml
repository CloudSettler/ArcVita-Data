  decisions:
  - date: '617'
    title_zh: 卑辞推奨以骄李密
    rationale: 州密妄自尊大，遽绝之则更生一敌，不如卑辞推奉以骄其志，乘虚席卷入关。
  - date: 618-05
    title_zh: 却九锡殊礼而受禅
    rationale: 自加宠锡乃谄谀者所为，历魏晋之迹为欺天罔人；但改丞相府为相国府，九锡殊礼归之有司。
  - date: 618-05
    title_zh: 录用隋之子孙
    rationale: 隋蔡王智积等子孙量才选用，不诛前代亲族，自汉以来最为忠厚。
