      is_circa: true
      raw: 隋唐之际
    death:
      date: '635'
      precision: year
      is_circa: true
      raw: 太上皇
  birth_date: '566'
  death_date: '635'
  era: 隋末唐初
  reign_ref: 武德（618-626）
  archetype: 开国之君
  dilemmas:
  - 起兵反隋：以不正之谋胁迫之举大业，被范祖禹讥其纳侮突厥、受宫女之计
  - 立储之争：立长建成抑或有功之世民，终酿玄武门之祸
  - 诛降之疑：萧铣无罪而降、完府库归唐，高祖却斩之，被讥为淫刑
  lesson: 创业之始所行不正，则子孙效之，戎狄猾夏、家法不立皆由此始；取舍之际当以至诚，不可欺天罔人。
  summary_first_person: 我李渊，隋大业十三年为太原留守。因知天下将乱之机，起兵晋阳，称臣突厥以为助，招降李密之傲而卑辞骄之，乘虚入关。武德元年受隋恭帝禅让即位，改九锡殊礼归之有司，首辟言路纳孙伏伽之谏，定均田租庸调之法，录隋之子孙最为忠厚。然建成元吉与世民相倾，武德九年世民杀太子齐王，我传位于太子，禅位而终。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=唐鉴
