    start_date: -489-01-01
    highlight_event_id: guji-孔子-event-travel
  - key: closure
    name: 反鲁归老
    labels:
      zh:
      - 归鲁
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-return
  decisions:
  - date: -496-01-01
    title_zh: 去鲁周游
    rationale: 鲁君不能用礼治，权臣乱政，道不行则去，故适列国以求明君。
  - date: -484-01-01
    title_zh: 归鲁不复求仕
    rationale: 明知不可为而为之既毕，归而授徒修书，以传道统于万世。
events:
- id: guji-孔子-event-birth
  title_zh: 生于鲁国陬邑
  date: -551-09-28
  year_of: -551
  place_zh: 鲁国陬邑
  description: 名丘字仲尼，父叔梁纥，母颜氏，生而有圣德之姿。
- id: guji-孔子-event-study
  title_zh: 问礼习学志于周文
  date: -536-01-01
  year_of: -536
  place_zh: 周都洛邑
  description: 少习礼乐，问礼于老聃，学乐于师襄，博考王官六艺之学。
- id: guji-孔子-event-teach
  title_zh: 设教洙泗弟子三千
  date: -521-01-01
  year_of: -521
  place_zh: 鲁国洙泗
  description: 开私学倡有教无类，以诗书礼乐教授颜回曾参子路子贡等贤弟子。
- id: guji-孔子-event-serve-lu
  title_zh: 出仕鲁国摄行相事
  date: -500-01-01
  year_of: -500
  place_zh: 鲁国
  description: 为中都宰司空大司寇，修礼正法，齐人惧而归侵地，权臣阻而行遂废。
- id: guji-孔子-event-travel
  title_zh: 周游列国厄于陈蔡
  date: -496-01-01
  year_of: -496
  place_zh: 卫陈蔡楚宋
  description: 率弟子历游列国十四年，困于匡围于蒲绝粮陈蔡，弦歌不辍守仁不移。
- id: guji-孔子-event-return
  title_zh: 反鲁修经
  date: -484-01-01
  year_of: -484
  place_zh: 鲁国
  description: 归鲁不复仕，删诗定书赞周易修春秋，教授门人以弘道统。
- id: guji-孔子-event-edit
  title_zh: 晚年修春秋定礼乐
  date: -481-01-01
  year_of: -481
  place_zh: 鲁国
  description: 感麟而作春秋，寄王法褒贬谨严，为后世儒学大宗之所宗。
- id: guji-孔子-event-death
  title_zh: 卒于鲁国
  date: -479-04-11
  year_of: -479
  place_zh: 鲁国
  description: 鲁哀公十六年四月己丑卒，弟子服丧三年，葬鲁城北泗上。
