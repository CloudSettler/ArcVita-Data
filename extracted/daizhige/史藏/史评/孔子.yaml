endeavors:
- id: guji-孔子-endeavor-1
  title_zh: 设教洙泗整理六艺
  description: 以诗书礼乐易春秋为教，开私人讲学之风，弟子三千，整理周代王官之学以传圣道。
  phases:
  - key: brewing
    name: 少习周礼
    labels:
      zh:
      - 积学
    start_date: -536-01-01
    highlight_event_id: guji-孔子-event-study
  - key: breakthrough
    name: 开门授徒
    labels:
      zh:
      - 设教
    start_date: -521-01-01
    highlight_event_id: guji-孔子-event-teach
  - key: climax
    name: 以礼为教
    labels:
      zh:
      - 成教
    start_date: -500-01-01
    highlight_event_id: guji-孔子-event-teach
  - key: closure
    name: 晚年修经
    labels:
      zh:
      - 成书
    start_date: -484-01-01
    highlight_event_id: guji-孔子-event-edit
  decisions:
  - date: -521-01-01
    title_zh: 有教无类广收弟子
    rationale: 欲以教育化民成德，不论贵贱皆可受业，故开私学以传周文。
  - date: -484-01-01
    title_zh: 退而修诗书礼乐
    rationale: 道不行于当时，则托空言以待后世，故删诗定书赞易修春秋。
- id: guji-孔子-endeavor-2
  title_zh: 周游列国问道行道
  description: 为行仁政复周礼，率弟子周游卫陈蔡楚宋诸国，虽困厄而不改其志。
  phases:
  - key: brewing
    name: 出仕鲁国
    labels:
      zh:
      - 求仕
    start_date: -500-01-01
    highlight_event_id: guji-孔子-event-serve-lu
  - key: breakthrough
    name: 去鲁适卫
    labels:
      zh:
      - 去国
    start_date: -496-01-01
