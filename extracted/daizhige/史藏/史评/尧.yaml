endeavors:
- id: guji-尧-endeavor-1
  title_zh: 宽仁刑赏成比屋可封之治
  description: 承三皇道德之化以俭让和敬化平阳遗风以疑赏从重疑罚从轻行忠厚之政致比屋可封
  phases:
  - key: brewing
    name: 平阳遗风俭让和敬
    labels:
      zh:
      - 俭啬足用
      - 温恭克让
      - 和而不怒
    start_date: -2336
    highlight_event_id: guji-尧-event-yifeng
  - key: breakthrough
    name: 待民以君子长者之道
    labels:
      zh:
      - 赏疑从与
      - 罚疑从去
    start_date: -2330
    highlight_event_id: guji-尧-event-xingshang
  - key: climax
    name: 比屋可封忠厚之至
    labels:
      zh:
      - 忠厚
      - 比屋可封
    start_date: -2325
    highlight_event_id: guji-尧-event-xingshang
  - key: closure
    name: 垂衣裳而天下治
    labels:
      zh:
      - 无为而化
      - 垂拱
    start_date: -2315
    highlight_event_id: guji-尧-event-yifeng
  decisions:
  - date: -2330
    title_zh: 皋陶执法坚而吾宥之以宽
    rationale: 天下畏执法之坚而乐用刑之宽使民相率归于君子长者之道
  - date: -2328
    title_zh: 罪疑惟轻功疑惟重
    rationale: 过乎仁不失为君子过乎义则流于忍人故以忠厚立法贵严而责人贵宽
- id: guji-尧-endeavor-2
  title_zh: 治水求贤与禅位试舜
  description: 水患不可久留而知治水者莫如鲧故屈于四岳而试之让天下于许由不就则历试舜而授大位
  phases:
  - key: brewing
    name: 咨群臣孰能治水
    labels:
      zh:
      - 水患方殷
      - 求贤
    start_date: -2295
    highlight_event_id: guji-尧-event-zhishui
  - key: breakthrough
    name: 屈于四岳试用鲧
    labels:
      zh:
      - 试鲧九年
      - 不得已而用
    start_date: -2294
    highlight_event_id: guji-尧-event-zhishui
  - key: climax
    name: 让许由不就历试舜
    labels:
      zh:
      - 让贤
      - 历试
    start_date: -2287
    highlight_event_id: guji-尧-event-rangxian
  - key: closure
    name: 以权授舜举元去凶
    labels:
      zh:
      - 禅位
      - 权授
    start_date: -2280
    highlight_event_id: guji-尧-event-rangxian
  decisions:
  - date: -2294
    title_zh: 知鲧方命而姑试之
    rationale: 在廷之臣可治水者惟鲧水害不可一日不治弃而不试则不仁故从四岳之举
  - date: -2287
    title_zh: 不遽授舜而历试以观德
    rationale: 四岳十二牧未尽服九州岛四海未尽蒙泽故留八凯八元四凶以俟舜举去而成其功
events:
- id: guji-尧-event-birth
  title_zh: 陶唐出生
  date: -2356
  year_of: -2356
  description: 帝尧生于陶唐以温恭克让之德渐著于平阳
- id: guji-尧-event-yifeng
  title_zh: 平阳遗风俭让和敬
  date: -2336
  year_of: -2336
  description: 都平阳有茅茨土型之度师锡畴咨之道民至今俭啬善让好谋而深和而不怒此尧之遗风
- id: guji-尧-event-xingshang
  title_zh: 宽仁刑赏比屋可封
  date: -2330
  year_of: -2330
  description: 以君子长者之道待天下赏疑从与罚疑从去皋陶曰杀之三则宥之三致尧之民比屋可封
- id: guji-尧-event-zhishui
  title_zh: 咨岳试鲧治水
  date: -2294
  year_of: -2294
  description: 咨孰能治水四岳皆曰鲧虽方命圯族而群臣莫及舜禹未见故屈于众议而试之九年
- id: guji-尧-event-rangxian
  title_zh: 让许由不就而禅舜
  date: -2287
  year_of: -2287
  description: 让天下于许由由不受而逃隐乃妻舜以二女历试以百揆终授以大位
- id: guji-尧-event-death
  title_zh: 陟方而崩
  date: -2255
  year_of: -2255
  description: 在位多年以天下授舜后陟方乃死遗风垂于万世
