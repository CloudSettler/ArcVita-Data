  decisions:
  - date: 1781-01-01
    title_zh: 大书隋大业十四年元至正二十八年明崇祯十七年
    rationale: 国之统系于君君在即大统归之此圣主大公至正非臣下所敢拟议
  - date: 1781-01-01
    title_zh: 于贾充褚渊沈约书死狄仁杰迁拜书周严臣节大防
    rationale: 正书法以扶名教抉奥致精永垂法戒为万古史家指南
