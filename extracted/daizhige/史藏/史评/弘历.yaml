    rationale: 历朝臣各私其君发明书法已失执中效而为之者更甚故一归大公至正
  - date: 1767-09-01
    title_zh: 亲依皇祖例自述所见据事以书
    rationale: 批论十之三自述七出儒臣拟而经笔削涂乙以昭万世法戒
- id: guji-弘历-endeavor-2
  title_zh: 圣裁御批汇为评鉴阐要
  summary: 辑览中特笔评论发幽阐微多至数千条命大学士刘统勋等专录亲御毫翰及改定馆臣拟批按代胪列为十二卷
  phases:
