  birth_date: 1130-10-18
  death_date: 1200-04-23
  era: 南宋
  reign_ref: 宋孝宗乾道年间
  archetype: 会通经史的理学集大成者
  dilemmas:
  - 通鉴本书太详而目录太简举要未成，如何表岁著统以领其要而及其详
  - 正统列国僭国无统错综，如何立褒贬进退之防而不失春秋谨严
  - 温公旧例胡氏补遗义有未安，如何折衷损益以明监戒防微
  lesson: 表岁以首年而天道明，统正于下而人道定，大纲概举而监戒昭，众目毕张而防微著
  summary_first_person: 我受温公资治通鉴与胡氏举要补遗之启发，自病记识弗彊，遂与同志别为义例，增损栉括而成纲目，以大书提要分注备言，岁周统正以昭监戒，愿后之君子默识两公之志
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%8F%B2%E8%AF%84/%E5%BE%A1%E6%89%B9%E8%B5%84%E6%B2%BB%E9%80%9A%E9%89%B4%E7%BA%B2%E7%9B%AE.html
endeavors:
- id: guji-朱熹-endeavor-1
  title_zh: 折衷两公纂述通鉴纲目
  summary: 因司马光通鉴胡安国举要补遗而折衷之，大书为纲分注为目，乾道壬辰自序成编
  phases:
  - key: brewing
    name: 伏读两公四书自病弗彊
    labels:
      zh: 读史萌志
    start_date: 1165-01-01
    highlight_event_id: guji-朱熹-event-birth
  - key: breakthrough
    name: 别立义例增损栉括
    labels:
      zh: 立例纂述
    start_date: 1168-01-01
    highlight_event_id: guji-朱熹-event-gangmu-1172
  - key: climax
    name: 乾道壬辰夏四月自序成书
    labels:
      zh: 成书自序
    start_date: 1172-05-01
    highlight_event_id: guji-朱熹-event-gangmu-1172
  - key: closure
    name: 藏之巾笥以俟后君子
    labels:
      zh: 藏笥待后
    start_date: 1173-01-01
    highlight_event_id: guji-朱熹-event-fanli-1180
  decisions:
  - date: 1168-03-01
    title_zh: 表岁首年因年著统
    rationale: 岁周于上则天道明，统正于下则人道定，故逐年上书甲子，正统大书国号谥号年号
  - date: 1170-06-01
    title_zh: 大书提要分注备言
    rationale: 始终兴废灾祥革易特书其大，追原遂终详陈备载以备其言，使久近离合详略通贯如指诸掌
- id: guji-朱熹-endeavor-2
  title_zh: 明凡例正统书法以继春秋
  summary: 详定统系岁年名号即位改元诸例，商订论定，采折衷之语以阐明褒贬进退之防
  phases:
  - key: brewing
    name: 讲学考亭慨然有感于致知格物
    labels:
      zh: 讲学明道
    start_date: 1175-01-01
    highlight_event_id: guji-朱熹-event-fanli-1180
  - key: breakthrough
    name: 与赵师渊商订分注论定
    labels:
      zh: 商订分注
    start_date: 1178-01-01
    highlight_event_id: guji-朱熹-event-fanli-1180
  - key: climax
    name: 详慎精密定褒贬进退之防
    labels:
      zh: 定例谨严
    start_date: 1180-01-01
    highlight_event_id: guji-朱熹-event-fanli-1180
  - key: closure
    name: 凡例纲目并行发明书法相续
    labels:
      zh: 例传后世
    start_date: 1190-01-01
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: 1180-02-01
    title_zh: 黜魏系汉用习凿齿程子说
    rationale: 自建安二十五年以后黜魏年而系汉统，以正名分而存道统之公
  - date: 1182-08-01
    title_zh: 采近世大儒折衷之语附于其间
    rationale: 温公所立之言胡氏所收之说有遗，则采两公所遗与折衷之语，以备稽考而垂监戒
events:
- id: guji-朱熹-event-birth
  title_zh: 出生于建炎四年
  date: 1130-10-18
  year_of: 1130
  description: 建炎四年九月十五日生于尤溪，后成长于闽学，潜心经史为纂述纲目奠基
- id: guji-朱熹-event-gangmu-1172
  title_zh: 乾道壬辰自序初成纲目
  date: 1172-05-01
  year_of: 1172
  description: 与同志因温公胡氏四书别为义例，表岁首年因年著统，大书提要分注备言，凡若干卷成编自序于新安
- id: guji-朱熹-event-fanli-1180
  title_zh: 商订分注详定凡例书法
  date: 1180-01-01
  year_of: 1180
  description: 属天台赵师渊成分注之目，往复手书商订论定，详定统系岁年名号即位褒贬诸例，阐明进退之防
- id: guji-朱熹-event-death
  title_zh: 卒于庆元六年
  date: 1200-04-23
  year_of: 1200
  description: 庆元六年三月初九日卒，纲目凡例并行于世，后有发明书法考异集览考证相续，御批百余条以垂奕禩
