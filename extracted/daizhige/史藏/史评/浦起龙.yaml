    title_zh: 定训正六别刊讹四别之例
    rationale: 趣乖者法宜训正，疵积者道在刊讹，以释按证三法通其义，以字句节简四法正其文
  - date: 1745
    title_zh: 存旧本刊误不没旧文
    rationale: 刊去者仍注见之不没旧本，冀览者辨之，深恶聪明改头面得罪古人
