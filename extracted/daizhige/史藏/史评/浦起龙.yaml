    title_zh: 以通释为例教授后学
    rationale: 史通牢笼群史吐纳全书，非明辨通否不足以治史，故以自注为讲授之本
  - date: 1760
    title_zh: 守拙存真不求速效
    rationale: 耗磨晚节甘苦中人，贵当必无憾然后即安，不以一评一注炫于时
