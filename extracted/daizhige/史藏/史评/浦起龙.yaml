  reign_ref: 康熙至乾隆
  archetype: 考据注疏型史评家
  dilemmas:
  - 通与不通之辨：旧注相高厌心，于通处荐荆榛，于不可通处积疵，当如何训正刊讹
  - 存旧与改窜之度：校勘欲精核详明，又戒聪明改头面失详慎，当如何去非趋是
  lesson: 注书戒自我作故，须推心置腹考辞赴义，去非趋是方能通古人之意而成一家之言
  summary_first_person: 我字二田，无锡人，历康熙乾隆之世，病旧注史通递相增损互有短长，遂立训正刊讹二科十别，耗磨晚节通释二十卷，冀阐发刘氏本意，虽不免疏漏而大致精核可观
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%8F%B2%E8%AF%84/%E5%8F%B2%E9%80%9A%E9%80%9A%E9%87%8A.html
