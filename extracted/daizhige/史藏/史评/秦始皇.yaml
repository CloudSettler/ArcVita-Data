endeavors:
- id: guji-秦始皇-endeavor-1
  title_zh: 并吞六国建立一统
  summary: 自秦王政即位至灭六国称皇帝，完成天下一统
  phases:
  - key: brewing
    name: 即位蓄势
    labels:
      zh: 秦国积势
    start_date: -246
    highlight_event_id: guji-秦始皇-event-accession
  - key: breakthrough
    name: 连灭韩赵魏
    labels:
      zh: 横扫三晋
    start_date: -230
    highlight_event_id: guji-秦始皇-event-unify
  - key: climax
    name: 一统称帝
    labels:
      zh: 并天下称皇帝
    start_date: -221
    highlight_event_id: guji-秦始皇-event-unify
  - key: closure
    name: 巡守定鼎
    labels:
      zh: 奠定帝业
    start_date: -220
    highlight_event_id: guji-秦始皇-event-unify
  decisions:
  - date: -221
    title_zh: 称皇帝并天下
    rationale: 疆弱相噬战国不靖，唯有一统方能息兵安民，故并六国而称始皇帝
- id: guji-秦始皇-endeavor-2
  title_zh: 罢侯置守推行郡县
  summary: 废分封置郡县，以守令治理天下，行大公之制
  phases:
  - key: brewing
    name: 廷议封建郡县
    labels:
      zh: 两端争胜
    start_date: -221
    highlight_event_id: guji-秦始皇-event-junxian
  - key: breakthrough
    name: 分国为郡县
    labels:
      zh: 罢侯置守
    start_date: -221
    highlight_event_id: guji-秦始皇-event-junxian
  - key: climax
    name: 选人尹民
    labels:
      zh: 才者居民上
    start_date: -220
    highlight_event_id: guji-秦始皇-event-junxian
  - key: closure
    name: 私心行大公
    labels:
      zh: 天假其私
    start_date: -219
    highlight_event_id: guji-秦始皇-event-tuoguo
  decisions:
  - date: -221
    title_zh: 罢侯置守
    rationale: 封建必滥必激而战国之祸不息，郡县可使才者长民而黜陟苏困，故虽出私心而合天下之公
  - date: -210
    title_zh: 托国赵高
    rationale: 好谀而不知人，以赵高托胡亥，终致宗社倾覆，此为失人之鉴
