  era: 战国末至秦朝
  reign_ref: 秦王政及始皇帝
  archetype: 一统开创之君
  dilemmas:
  - 封建世及安稳与郡县选贤大公之间如何取舍
  - 以私心有天下与以公心为天下之间如何自处
  - 好谀托非人与审慎择托孤之臣之间如何辨人
  lesson: 罢侯置守本出私心而天假以行大公，然好谀不知人而托国非人则短祚，公私之辨与知人之明不可偏废
  summary_first_person: 朕并六国罢侯置守，以为子孙万世之私，却被天假其私以行郡县之大公，然朕好谀不知人，托国赵高而致扶苏自杀胡亥乱亡，此朕之大戒也
  source_urls:
