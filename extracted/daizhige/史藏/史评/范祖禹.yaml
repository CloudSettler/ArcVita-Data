  lesson: 探本寻源以明治乱之由，虽得罪君子亦所不辞
  summary_first_person: 我是范祖禹，字淳甫（一作纯甫），华阳人。嘉祐八年进士，曾入司马光书局编修《资治通鉴》，分掌唐史，据其所得撰《唐鉴》十二卷。元祐元年我以著作佐郎表上此书，后经吕祖谦注析为二十四卷。程颐称三代以后无此议论，朱熹虽讥其议论弱而亦有取焉。
  source_urls:
  - https://www.ctext.org/
