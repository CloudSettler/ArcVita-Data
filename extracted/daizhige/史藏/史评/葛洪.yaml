  decisions:
  - date: 1195
    title_zh: 不为欺诳而献史论
    rationale: 微官布衣多以已见求进而讫无他说，我不敢为欺，故温史立论以献
  - date: 1196
    title_zh: 以举烛喻赖融明精说
    rationale: 所笔诚略，望庙朝因略而精之，如燕相因举烛而举贤，以成治功
