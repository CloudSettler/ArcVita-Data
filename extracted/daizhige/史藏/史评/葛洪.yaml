  reign_ref: 孝宗淳熙至理宗宝庆
  archetype: 以史论政的宰执之臣
  dilemmas:
  - 微官布衣求进多托已见为欺，我当随俗取容还是据史直献
  - 相权宜重宜轻，防宦官掣肘与防奸臣擅权如何兼顾
  - 选举专用停年格以求简便，还是参酌群议以别贤愚能否
  lesson: 温绎历代史以裨庙论，不敢为欺，以正人格君心之非，以吉士充朝廷之选
  summary_first_person: 我字容甫，自号蟠室老人，婺州东阳人，淳熙十一年进士，比以忧居温绎历代史，随笔二十六篇以献庙论，后嘉定间至参知政事，加观文殿学士，持论和平，愿借史事以正君心
  source_urls:
