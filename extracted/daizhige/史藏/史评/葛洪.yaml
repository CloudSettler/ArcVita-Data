    start_date: 1225
    highlight_event_id: guji-葛洪-event-death
  decisions:
  - date: 1214
    title_zh: 持论和平不为苛刻
    rationale: 鉴胡寅读史管见之苛刻偏驳，故以和平立论，以辅正君相为务
  - date: 1215
    title_zh: 重相权而戒权臣擅命
    rationale: 由申屠嘉责邓通而明相权宜重，然宋无奄竖掣肘而患奸臣权重，故当戒专擅以保国家
