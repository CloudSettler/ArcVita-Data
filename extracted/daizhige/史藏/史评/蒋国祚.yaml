endeavors:
- id: guji-蒋国祚-endeavor-1
  title_zh: 互校两汉纪宋明清诸刻本
  summary: 访求祥符绍兴宋刻明高陵黄姬水刻及万历南京监本互校正讹阙疑
  phases:
  - key: brewing
    name: 访求宋绍兴汝阴王铚校本及明清传钞本
    labels:
      zh:
      - 搜集访求
    start_date: '1690'
    highlight_event_id: guji-蒋国祚-event-1
  - key: breakthrough
    name: 以黄姬水刻与万历监本互勘得差善之本
    labels:
      zh:
      - 比勘异同
    start_date: '1700'
    highlight_event_id: guji-蒋国祚-event-1
  - key: climax
    name: 逐卷校字句引汉书后汉书证是非
    labels:
      zh:
      - 考订正讹
    start_date: '1705'
    highlight_event_id: guji-蒋国祚-event-2
  - key: closure
    name: 讹者正疑者缺定稿授梓于钱唐
    labels:
      zh:
      - 定稿付梓
    start_date: '1710'
    highlight_event_id: guji-蒋国祚-event-2
  decisions:
  - date: '1700'
    title_zh: 取诸本互校不专主一本
    rationale: 两纪再刻于宋历元明传钞各异当参互考之乃得其真
  - date: '1705'
    title_zh: 讹者正疑者缺不敢率改
    rationale: 字句舛讹无确证者宁从阙文以俟后之君子合于王铚校雠之意
- id: guji-蒋国祚-endeavor-2
  title_zh: 撰成两汉纪字句异同考附卷末
  summary: 将校勘所得若干条分前汉后汉六十卷胪列并引史汉注疏案语附考
  phases:
  - key: brewing
    name: 分经前汉三十卷立条目收异文
    labels:
      zh:
      - 分卷立目
    start_date: '1705'
    highlight_event_id: guji-蒋国祚-event-2
  - key: breakthrough
    name: 以汉书史记证荀纪如武信君长史欣奉常诸条
    labels:
      zh:
      - 引书取证
    start_date: '1706'
    highlight_event_id: guji-蒋国祚-event-2
  - key: climax
    name: 续考后汉三十卷自光武至孝献辨脱衍
    labels:
      zh:
      - 续考后纪
    start_date: '1708'
    highlight_event_id: guji-蒋国祚-event-2
  - key: closure
    name: 作识语论五百年五刻显晦之数成书
    labels:
      zh:
      - 作识成书
    start_date: '1710'
    highlight_event_id: guji-蒋国祚-event-2
  decisions:
  - date: '1706'
    title_zh: 引汉书师古注为断不妄增
    rationale: 如孝惠保林良使诸条诸本增减不一疑有脱字姑从旧本不敢遽增
  - date: '1710'
    title_zh: 存阙文附案语于后
    rationale: 如孝平渭北立庙孝灵许生越王诸段上下文不可接姑从阙以存疑
