  dilemmas:
  - 以经术辅导少主还是以权略智术对病用药
  - 吴僭称尊当绝交正名还是存联盟待教而后诛
  - 祁山得众后当迁众自保还是引咎谢遣以系陇右人心
  lesson: 药无善恶要以对病为妙人君以知略为先处大事当外歌舞而内以丧礼居之迁众伤民虽边鄙之常亦足惜
  summary_first_person: 吾躬耕隆中说先主跨有荆益保岩阻和戎抚夷结吴修政待天下有变则一军向宛洛一军出秦川章武托孤后吾写申韩管子六韬以补后主权略之短建兴五年出屯汉中祁山三郡响应惜马谡败而不能守拔西县千余家还师吾负于民不敢忘也
