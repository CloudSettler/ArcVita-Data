  - 封疆簿书尘冗与亲加讨论校订之衡
  lesson: 以廉洁自持而勤于文献，则仓促亦可成信史之基。
  summary_first_person: 吾于成龙，备员督抚两江，奉部檄与余国柱、徐国相等开局江宁，延聘儒臣，六阅月创修江南通志七十六卷，冀备一统之采择而不敢自诩良史，惟以慎核详确自勉，卒以鞠躬尽瘁终于官。
