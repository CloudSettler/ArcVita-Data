    rationale: 江南事繁而江西相隔千里，分任编摩而会定于江宁方能兼顾详确
  - date: 1684
    title_zh: 以簿书之暇亲为讨论
    rationale: 山川建置人物易淆，若不亲校则恐舛误遗佚有负乙夜披览
