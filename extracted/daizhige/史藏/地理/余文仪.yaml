  name_zh: 余文仪
  names:
    zh: 余文仪
    en: Yu Wenyi
  lifespan:
    birth:
      date: '1717'
      precision: year
      is_circa: true
      raw: 浙江诸暨人康熙末年左右生
    death:
      date: '1789'
      precision: year
      is_circa: true
      raw: 乾隆晚年卒
  birth_date: '1717'
  death_date: '1789'
  era: 清乾隆朝
  reign_ref: 乾隆
  archetype: 循吏志家
  dilemmas:
  - 旧志所见异词所闻异词当并存还是折衷
  - 海外初辟文献不足如何博访核实
  - 守土绥靖与导扬文治孰为重心
  lesson: 守土必先知地，核实旧闻以备施政，方能久道化成
  summary_first_person: 我是古越余文仪，字宝冈，浙江诸暨人，以乾隆庚辰来守台湾，询省旧闻，参核高刘诸志，博访故老，亲履山川夷隘，荟萃成续修台湾府志十二类二十六卷，三载报政后历观察臬司内召司寇，复抚福建，愿后之君子增饰鸿模以补职方
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E7%BB%AD%E4%BF%AE%E5%8F%B0%E6%B9%BE%E5%BA%9C%E5%BF%97.html
