  date: '1717'
  year_of: 1717
  place_zh: 浙江诸暨
  description: 古越人，字宝冈，进士出身，后以知府治台
- id: guji-余文仪-event-taiwan
  title_zh: 乾隆庚辰来守台湾府
  date: '1760'
  year_of: 1760
  place_zh: 台湾府
  description: 来守兹郡，询省旧闻得高拱干志及刘良璧补葺之书，患其未备乃博访纂修
- id: guji-余文仪-event-gazetteer
  title_zh: 续修台湾府志成书付梓
  date: '1774'
  year_of: 1774
  place_zh: 福州榕城
  description: 始封域讫艺文为类十二卷二十六，甲午冬属钟音作序，复加校阅授剞劂
- id: guji-余文仪-event-promotion
  title_zh: 三载报政晋观察臬司内召司寇
  date: '1763'
  year_of: 1763
  place_zh: 台湾转内地
  description: 三载报政旋膺观察，继晋臬事内召司寇，期间亦端斧钺靖鹿耳鲲身之险
- id: guji-余文仪-event-fujian
  title_zh: 巡抚福建建牙榕阴荔圃
  date: '1776'
  year_of: 1776
  place_zh: 福建福州
  description: 以兵部侍郎兼右副都御史巡抚福建提督军务兼理粮饷，回首旧游手校此编
- id: guji-余文仪-event-death
  title_zh: 卒于乾隆晚年
  date: '1789'
  year_of: 1789
  place_zh: 内地
  description: 宦历守令观察臬司司寇至封疆，以志乘传后
