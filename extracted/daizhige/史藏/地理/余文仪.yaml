    title_zh: 合新旧二志增损为纲十二目九十二
    rationale: 高志草创失略，刘志体例未合，故重立纲目以求有条不紊
  - date: '1762'
    title_zh: 亲历罗汉门鹿耳门补山川海防
    rationale: 形胜险要守土不可不知，故采使槎录语详识道里港要
- id: guji-余文仪-endeavor-2
  title_zh: 历臬司司寇巡抚福建
  summary: 三载报政膺观察晋臬事内召司寇，复建牙榕城抚闽绥靖海疆
