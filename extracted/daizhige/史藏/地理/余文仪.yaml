    labels:
      zh: 突破
    start_date: '1766'
    highlight_event_id: guji-余文仪-event-promotion
  - key: climax
    name: 建牙榕荔巡抚福建
    labels:
      zh: 高潮
    start_date: '1776'
    highlight_event_id: guji-余文仪-event-fujian
  - key: closure
    name: 退食从容手编溯洄竹城赤嵌
