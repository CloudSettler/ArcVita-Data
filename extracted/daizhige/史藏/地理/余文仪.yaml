    start_date: '1778'
    highlight_event_id: guji-余文仪-event-fujian
  decisions:
  - date: '1763'
    title_zh: 报政后仍校阅旧稿不废
    rationale: 八历重洋因循未付梓，必待校阅精审方可传后
  - date: '1776'
    title_zh: 以抚闽兼顾台湾谘览依据
    rationale: 使守兹土者得所依据从容就理，以副一道同风之治
events:
