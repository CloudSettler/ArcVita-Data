endeavors:
- id: guji-佚名-endeavor-1
  title_zh: 汇记乾隆朝各营迁驻与卡防巡边之制
  summary: 自乾隆二十八年至三十年记满营锡伯索伦额鲁特绿营迁驻丁口官兵之数及喀什噶尔塔尔巴哈台戍守与春秋巡逻布鲁特哈萨克边界并三十六卡伦三十六巡哨之分辖
  phases:
  - key: brewing
    name: 搜集迁驻档册
    labels:
      zh: 满营锡伯索伦额鲁特
    start_date: 1763-01-01
    highlight_event_id: guji-佚名-event-qianlong-camps
  - key: breakthrough
    name: 厘定官兵丁口额数
    labels:
      zh: 惠远惠宁巴彦岱屯驻
    start_date: 1765-06-01
    highlight_event_id: guji-佚名-event-qianlong-camps
  - key: climax
    name: 分系五营卡伦巡哨
    labels:
      zh: 卡伦巡防换防之制
    start_date: 1766-01-01
    highlight_event_id: guji-佚名-event-qianlong-camps
  - key: closure
    name: 成略志营制卡防篇
    labels:
      zh: 伊犁巡防成篇
    start_date: 1770-01-01
    highlight_event_id: guji-佚名-event-tunliang
  decisions:
  - date: 1765-12-01
    title_zh: 以迁驻先后为纲分营具列官兵家口
    rationale: 各营来源年月不同唯分营直书方不相淆
  - date: 1766-03-01
    title_zh: 以领队大臣分辖系属卡伦巡哨
    rationale: 巴彦岱锡伯索伦察哈尔额鲁特各有专管系之方见责成
- id: guji-佚名-endeavor-2
  title_zh: 汇记屯田仓储税饷及工矿军械之政
  summary: 记回子八千户纳粮开渠水路运粮官兵马匹倒毙屯田征银征税饷缎茶布铅铜铁木火药军械之事兼补道光八年裁侍卫及道光二十年后增户开渠
  phases:
  - key: brewing
    name: 检核屯粮仓储册
    labels:
      zh: 回屯漕运仓粮
    start_date: 1772-01-01
    highlight_event_id: guji-佚名-event-tunliang
  - key: breakthrough
    name: 厘定税饷工矿额数
    labels:
      zh: 牲税饷银铅铜厂
    start_date: 1776-01-01
    highlight_event_id: guji-佚名-event-tunliang
  - key: climax
    name: 补录道光改制增垦
    labels:
      zh: 裁侍卫开渠增户
    start_date: 1828-01-01
    highlight_event_id: guji-佚名-event-daoguang
  - key: closure
    name: 成略志食货武备篇
    labels:
      zh: 略志告成
    start_date: 1843-01-01
    highlight_event_id: guji-佚名-event-daoguang
  decisions:
  - date: 1772-06-01
    title_zh: 以纳粮运粮为先详书户数石数船数
    rationale: 伊犁孤悬转输为命故备载水陆仓储之实
  - date: 1843-01-01
    title_zh: 增补道光裁设开渠以续旧志
    rationale: 侍卫既裁回户递增若不补记则前后不相接续
events:
- id: guji-佚名-event-birth
  title_zh: 出生
  date: 1735-01-01
  year_of: 1735
  place: 内地
  summary: 清乾隆初年生今阙其详
- id: guji-佚名-event-qianlong-camps
  title_zh: 记乾隆二十八年至三十年各营迁驻伊犁
  date: 1765-12-01
  year_of: 1765
  place: 伊犁惠远惠宁
  summary: 陆续记庄浪凉州热河西安盛京黑龙江口北等地满营锡伯索伦额鲁特绿营迁驻官兵丁口额数及戍守喀什噶尔塔尔巴哈台春秋巡逻之制
- id: guji-佚名-event-tunliang
  title_zh: 记屯田仓储税章及铅铜铁火药诸厂
  date: 1772-06-01
  year_of: 1772
  place: 伊犁
  summary: 记回子六千户纳粮水路运粮马匹倒毙则例屯田征银牲畜税章饷银缎茶布疋及铅厂铜厂铸炼铁木火药军械诸局之设
- id: guji-佚名-event-daoguang
  title_zh: 补记道光八年裁侍卫及道光二十年后开渠增户
  date: 1843-01-01
  year_of: 1843
  place: 伊犁
  summary: 补记道光八年裁撤各卡侍卫改由满营锡伯索伦派官戴翎驻守及道光二十年至二十三年塔什土比三道湾阿尔布孜开渠增置回子二千户三棵树等地垦田征粮征银之事
- id: guji-佚名-event-death
  title_zh: 逝世
  date: 1845-01-01
  year_of: 1845
  place: 伊犁
  summary: 略志成后卒于伊犁今阙其详
