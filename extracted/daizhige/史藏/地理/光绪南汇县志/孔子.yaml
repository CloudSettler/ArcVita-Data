  lesson: 有教无类，学而不厌，诲人不倦，仁以为己任
  summary_first_person: 吾十五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲不逾矩，一生述而不作，信而好古，以仁传道，以礼正世
