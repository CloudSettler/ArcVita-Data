  title_zh: 仕鲁摄相周游列国
  date: -496-01-01
  year_of: -496
  place_zh: 卫陈蔡楚宋诸国
  description_zh: 由鲁中都宰至司寇摄相，夹谷会盟堕三都，去鲁周游十四年，厄于陈蔡而不改其乐
- id: guji-孔子-event-death
