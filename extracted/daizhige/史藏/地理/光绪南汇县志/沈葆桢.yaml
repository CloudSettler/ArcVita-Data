    title_zh: 允顧思賢請為南滙志序
    rationale: 見南滙戶口日滋而積儲溝洫未備故以防弊未然之義進勉守令
  - date: 1878-06
    title_zh: 以庶富教次第立言自勵
    rationale: 先不私於己而後能不私於人故書數語兼以自勵以身作則
