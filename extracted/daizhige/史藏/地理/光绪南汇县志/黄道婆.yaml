  - date: 1298
    title_zh: 公开传授不私藏
    rationale: 棉利可活一乡贫民，公之于众则松江数邑皆受其惠
  - date: 1310
    title_zh: 因地制宜教织
    rationale: 浦东宜棉，教民种收轧弹织相承，使男耕女织各得其所
