    rationale: 教有始卒童蒙之养不可废先正蒙养方可渐进大学格致之功
  - date: 1296-08-01
    title_zh: 决定礲石刊护学圣旨于礼殿前
    rationale: 使海洲诸生晨薰对越知圣朝崇儒之意而自修其身不负菁莪之造
