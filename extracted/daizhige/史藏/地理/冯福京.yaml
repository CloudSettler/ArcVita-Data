    start_date: 1298-07-01
    highlight_event_id: guji-冯福京-event-gazetteer
  decisions:
  - date: 1296
    title_zh: 决定刊削浮词不徇夸美
    rationale: 旧志以寡为多以险为夷若按图责贡必流毒故宁存阙文不存伪饰
  - date: 1298-07-01
    title_zh: 决定分八门系以叙州叙赋山水物产官人士祠
    rationale: 备天子史官采录须简而有要使境土赋役险要虚实可稽
