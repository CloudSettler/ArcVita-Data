  archetype: 州佐修志型循吏
  dilemmas:
  - 旧志浮夸不实若全存则按图责贡贻害苍生若尽削则文献不足无所稽考
  - 海岛州学逼仄颓圮环学皆水若不修则教化不兴若修则经费无出处须集众力
  lesson: 作史传信贵在刊削浮词务实核验方能便民垂久
  summary_first_person: 余潼川人来佐昌国首访图经叹文献不足乃于里民购得旧籍见其以寡为多以无为有属学官郭荐等捃摭芟正审定为七卷图志又率诸生新州学及育德堂刊护学诏以俟采录
  source_urls:
