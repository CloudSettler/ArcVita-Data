  dilemmas:
  - 台湾旧志修于康熙乙亥至今四十余年阙略失传而时异势殊日新月盛若不重修无以信今传后
  - 修志之难同于作史而台湾僻处重洋文献无征又须旁搜远采详而不秽简而不略务为实录
  lesson: 久任则熟习掌故敬勤和衷以宣上德达下情而后山川奠定贡赋输将方志可成海疆可固
  summary_first_person: 余衡阳刘良璧由令守久任台疆蒙荐擢分巡兹土见郡志缺修四十余年遂同郡守钱洙请于列宪开馆延绅分汇纂辑躬自商榷甲乙始事庚申十月竣事辛酉五月八阅月而成二十卷以备輶轩之采外史之传愿后之官斯土者展卷纲举目张知台为闽粤转输沿海保障以佐一道同风之化
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/地理/重修福建台湾府志.md
  - https://daizhige.org/史藏/地理/重修福建台湾府志.html
