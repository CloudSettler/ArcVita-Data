endeavors:
- id: guji-刘铭传-endeavor-1
  title_zh: 光绪五年淡水新竹分治定界
  summary_zh: 承淡水厅旧治，划淡水新竹两县分管堡甲，以奏销册权代鱼鳞册定旧粮旧丁之界
  phases:
  - key: brewing
    name: 淡水厅旧额稽查
    labels:
      zh:
      - 旧额稽考
    start_date: 1878-01-01
    highlight_event_id: guji-刘铭传-event-1
  - key: breakthrough
    name: 两县划界分治
    labels:
      zh:
      - 划界分治
    start_date: 1879-01-01
    highlight_event_id: guji-刘铭传-event-1
  - key: climax
    name: 按堡分算粮丁
    labels:
      zh:
      - 按堡分粮
    start_date: 1879-06-01
    highlight_event_id: guji-刘铭传-event-1
  - key: closure
    name: 奏销册登明立案
    labels:
      zh:
      - 登明立案
    start_date: 1880-01-01
    highlight_event_id: guji-刘铭传-event-1
  decisions:
  - date: 1879-01-01
    title_zh: 淡新划界以堡分管
    rationale: 淡水原系厅治无鱼鳞可分，惟按堡分计算粮额丁饷以便分治
  - date: 1879-06-01
    title_zh: 暂照奏销册造旧额
    rationale: 所分各堡田园若干无从查分，先照旧额奏销存案以待清丈
- id: guji-刘铭传-endeavor-2
  title_zh: 光绪十四年淡新凤三县清丈改一条鞭
  summary_zh: 主持全台清丈，于淡水十堡新竹诸堡实测田园沙田沙园，分别上中下下四则及沙田沙园三等，改行一条鞭新赋
  phases:
  - key: brewing
    name: 清丈筹备定则
    labels:
