      - 清丈筹备
    start_date: 1887-01-01
    highlight_event_id: guji-刘铭传-event-2
  - key: breakthrough
    name: 实测田园分甲编字
    labels:
      zh:
      - 实测编字
    start_date: 1888-01-01
    highlight_event_id: guji-刘铭传-event-2
  - key: climax
    name: 沙田沙园酌定三等
    labels:
      zh:
      - 沙田定等
    start_date: 1888-06-01
    highlight_event_id: guji-刘铭传-event-2
  - key: closure
    name: 一条鞭奏咨立案
    labels:
      zh:
      - 一条鞭立案
    start_date: 1889-01-01
    highlight_event_id: guji-刘铭传-event-2
  decisions:
  - date: 1888-01-01
    title_zh: 改照新定赋则征收
    rationale: 旧供粟丁饷耗羡纷杂无册可凭，改归新粮一条鞭以简赋则
  - date: 1888-06-01
    title_zh: 沙田沙园配定三等征银
    rationale: 沿山沿海沿溪沙田收成微薄难按则科，参同安不配米例酌拟等则以昭平允
