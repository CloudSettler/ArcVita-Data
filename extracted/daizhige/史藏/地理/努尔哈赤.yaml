endeavors:
- id: guji-努尔哈赤-endeavor-1
  title_zh: 十三甲起兵统一女真
  description: 以遗甲十三副起兵报仇，兼并建州海西，破九部联军，建国后金，年号天命
  phases:
  - key: brewing
    name: 图伦蓄势起兵
    labels:
      zh: 蓄势待发
    start_date: 1583-05-01
    highlight_event_id: guji-努尔哈赤-event-qibing
  - key: breakthrough
    name: 古勒山破九部联军
    labels:
      zh: 以少胜多
    start_date: 1593-09-01
    highlight_event_id: guji-努尔哈赤-event-jiubu
  - key: climax
    name: 赫图阿拉建国称汗
    labels:
      zh: 建国正名
    start_date: 1616-01-01
    highlight_event_id: guji-努尔哈赤-event-jianguo
  - key: closure
    name: 抚顺清河连捷经略辽东
    labels:
      zh: 经略辽沈
    start_date: 1618-04-01
    highlight_event_id: guji-努尔哈赤-event-fushun
  decisions:
  - date: 1583-05-01
    title_zh: 以十三甲起兵收众
    rationale: 父祖殁于古勒寨，若不奋起则部众离散，故以遗甲起事以系人心
  - date: 1616-01-01
    title_zh: 建国后金定年号天命
    rationale: 诸部略定，非建号称汗不足以正名统众立法度，故即位以立纪纲
- id: guji-努尔哈赤-endeavor-2
  title_zh: 营建兴京辽沈定都开基
  description: 相土兴京，营东京辽阳沈阳，设八旗议政十亭，成盛京陪都规制之始
  phases:
  - key: brewing
    name: 相土赫图阿拉营兴京
    labels:
      zh: 卜居建城
    start_date: 1603-01-01
    highlight_event_id: guji-努尔哈赤-event-xingjing
  - key: breakthrough
    name: 迁都辽阳建东京城
    labels:
      zh: 定都辽沈
    start_date: 1621-04-01
    highlight_event_id: guji-努尔哈赤-event-qianliaoyang
  - key: climax
    name: 迁都沈阳控建瓴之势
    labels:
      zh: 控扼要冲
    start_date: 1625-04-01
    highlight_event_id: guji-努尔哈赤-event-qianshenyang
  - key: closure
    name: 议政十亭制度初成
    labels:
      zh: 立制垂统
    start_date: 1625-08-01
    highlight_event_id: guji-努尔哈赤-event-qianshenyang
  decisions:
  - date: 1621-04-01
    title_zh: 迁都辽阳以图进取
    rationale: 赫图偏僻难制辽沈，辽阳居中沃野，故迁都以控全辽便于进战
  - date: 1625-04-01
    title_zh: 再迁沈阳建盛京之基
    rationale: 沈阳形胜西通辽河东扼浑河，故徙居于此以成王气盘纡之都会
events:
- id: guji-努尔哈赤-event-birth
  type: birth
  title_zh: 生于赫图阿拉
  date: 1559-05-14
  year_of: 1559
  description: 明嘉靖三十八年生于建州左卫赫图阿拉，为显祖之子
- id: guji-努尔哈赤-event-qibing
  type: career
  title_zh: 十三甲起兵
  date: 1583-05-01
  year_of: 1583
  description: 以祖父遗甲十三副起兵于图伦，誓报古勒寨之仇，始兼并邻部
- id: guji-努尔哈赤-event-jiubu
  type: career
  title_zh: 古勒山大破九部联军
  date: 1593-09-01
  year_of: 1593
  description: 九部三万兵来攻，以少击众大破之，声威大震，诸部慑服
- id: guji-努尔哈赤-event-xingjing
  type: career
  title_zh: 营建赫图阿拉兴京城
  date: 1603-01-01
  year_of: 1603
  description: 相土赫图阿拉筑城建宫，定为兴京，立国本之规
- id: guji-努尔哈赤-event-jianguo
  type: career
  title_zh: 赫图阿拉建国称天命汗
  date: 1616-01-01
  year_of: 1616
  description: 即汗位于赫图阿拉，国号后金，建元天命，设八旗议政
- id: guji-努尔哈赤-event-fushun
  type: career
  title_zh: 克抚顺清河破明开原铁岭
  date: 1618-04-01
  year_of: 1618
  description: 誓师伐明，连克抚顺清河，逾铁岭长驱，辽沈震动
- id: guji-努尔哈赤-event-qianliaoyang
  type: career
  title_zh: 迁都辽阳营东京
  date: 1621-04-01
  year_of: 1621
  description: 克辽阳沈阳，迁都辽阳，营建东京，以图经略全辽
- id: guji-努尔哈赤-event-qianshenyang
  type: career
  title_zh: 迁都沈阳议政十亭
  date: 1625-04-01
  year_of: 1625
  description: 迁都沈阳，建宫阙设议政十亭，成盛京千里建瓴之势
- id: guji-努尔哈赤-event-death
  type: death
  title_zh: 殁于叆鸡堡
  date: 1626-09-30
  year_of: 1626
  description: 天命十一年征宁远弗克，病殁于叆鸡堡，葬沈阳福陵
