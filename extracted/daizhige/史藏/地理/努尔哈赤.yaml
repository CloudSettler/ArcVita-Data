  dilemmas:
  - 以十三副遗甲起事，如何在强敌环伺中求存立威
  - 如何统合建州海西诸部并营建都城以成王业正统
  lesson: 审时蓄力，以小并大，建号定都立制乃能开万世之基
  summary_first_person: 吾承祖父遗甲十三副起自图伦，破九部，收抚顺，建后金于赫图阿拉，再营兴京东京而定辽沈，开盛京王迹之始
