  - key: climax
    name: 著成上下两卷刊行
    labels:
      zh: 高潮
    start_date: 1672-06-01
    highlight_event_id: guji-南怀仁-event-kunyu
  - key: closure
    name: 图说行世启迪后学
    labels:
      zh: 收束
    start_date: 1674-01-01
    highlight_event_id: guji-南怀仁-event-kunyu
  decisions:
  - date: 1672-01-01
    title_zh: 撮略旧籍益以新论
    rationale: 先贤所未发者以后贤实测补之务使地圆经纬之理明白易晓
  - date: 1672-06-01
    title_zh: 易圆为平以五色别州
    rationale: 入图不便不得不以经纬线化球为平面令中土士人便览万国
