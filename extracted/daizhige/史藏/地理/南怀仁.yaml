  decisions:
  - date: 1669-04-01
    title_zh: 奏请较验历法是非
    rationale: 以实测较验代替空辩惟日月交食躔度可征方能取信于朝廷
  - date: 1674-01-01
    title_zh: 坚持新法不附旧说
    rationale: 宁以测验为准不以附会徇人故历法得以归正
- id: guji-南怀仁-endeavor-2
  title_zh: 撰坤舆图说阐大地圆球之理
  summary: 撮利玛窦艾儒略诸家旧论益以后贤新说论地形地圆五大洲经纬昼夜潮汐地震以开中土舆地新观
  phases:
  - key: brewing
    name: 采集西士舆地旧说
    labels:
      zh: 酝酿
    start_date: 1670-01-01
    highlight_event_id: guji-南怀仁-event-director
  - key: breakthrough
