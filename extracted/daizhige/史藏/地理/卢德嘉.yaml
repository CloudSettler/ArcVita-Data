  - key: breakthrough
    name: 受命主稿
    labels:
      zh: 专责主稿
    start_date: 1893-11-10
    highlight_event_id: guji-卢德嘉-event-1893-shouming
  - key: climax
    name: 疆域田园并进
    labels:
      zh: 先行造送
    start_date: 1893-05-21
    highlight_event_id: guji-卢德嘉-event-1893-jiangyu
  - key: closure
    name: 补造获嘉
    labels:
      zh: 补造简明
    start_date: 1893-07-25
    highlight_event_id: guji-卢德嘉-event-1893-buzhao
  decisions:
  - date: 1892-12-01
    title_zh: 商请饬传总保庄耆按月查报
    rationale: 外里诸绅置之不理坐候数月寂无一事，唯藉官饬基层查报方得疆域田园之材
  - date: 1893-11-10
    title_zh: 腼颜就任在局主稿
    rationale: 屡辞不获诸君怂恿许匡所不逮，必设主稿之人方能专责速成以塞严催
- id: guji-卢德嘉-endeavor-2
  title_zh: 总成凤山采访册甲至癸十部
  description: 以采访所得讨论修饰，每稿就正同人佥可而后发钞，钞讫校读装订由县缴送，以为县志张本兼备省志采择
  phases:
  - key: brewing
    name: 分责讨论
    labels:
      zh: 讨论修饰
    start_date: 1893-11-10
    highlight_event_id: guji-卢德嘉-event-1893-shouming
  - key: breakthrough
    name: 就正同人
    labels:
      zh: 刊谬订讹
    start_date: 1894-03-01
    highlight_event_id: guji-卢德嘉-event-1893-buzhao
  - key: climax
    name: 发钞校读
    labels:
      zh: 钞校装订
    start_date: 1894-10-01
    highlight_event_id: guji-卢德嘉-event-1895-chengshu
  - key: closure
    name: 缴送成书
    labels:
      zh: 自序缘起
    start_date: 1895-01-14
    highlight_event_id: guji-卢德嘉-event-1895-chengshu
  decisions:
  - date: 1894-03-01
    title_zh: 每一稿脱必先就正诸君
    rationale: 自愧鸦涂獭祭，必待佥以为可然后发钞，以免贻笑大方且日受教益
  - date: 1894-10-01
    title_zh: 钞讫必校读一过然后装订
    rationale: 采访贵在详慎考核毋任罣漏，校读方能补四至里数延袤之缺以备编纂
events:
- id: guji-卢德嘉-event-birth
  date: 1865
  year_of: 1865
  title_zh: 出生
  description: 约生于清同治年间凤山，后补凤山县廪生
- id: guji-卢德嘉-event-1892-sheju
  date: 1892-12-01
  year_of: 1892
  title_zh: 凤山采访局设局举办
  description: 光绪十八年十一月奉李明府谕设局，卢德祥陆日翔总办，周熙清王春华帮办，卢德嘉与焉
- id: guji-卢德嘉-event-1893-jiangyu
  date: 1893-05-21
  year_of: 1893
  title_zh: 造报疆域册田园册
  description: 光绪十九年五月二十一日造报疆域册一本，七月二十日造报田园清册一本，由李邑侯申送通志总局
- id: guji-卢德嘉-event-1893-buzhao
  date: 1893-07-25
  year_of: 1893
  title_zh: 补造全县四至简明册
  description: 奉总局批令补造全县东西南北四至界址延袤及距府城里数，七月二十五日补造申送
- id: guji-卢德嘉-event-1893-shouming
  date: 1893-11-10
  year_of: 1893
  title_zh: 受谕在局主稿
  description: 光绪十九年十月初二奉李明府谕，以品学兼优委任在局主稿，每月给薪水洋银十六元
- id: guji-卢德嘉-event-1895-chengshu
  date: 1895-01-14
  year_of: 1895
  title_zh: 采访册成自序缘起
  description: 光绪二十年甲午腊月既望，采访册甲至癸十部稿成，卢德嘉自序其设局采报主稿校钞始末由县缴送
- id: guji-卢德嘉-event-death
  date: 1905
  year_of: 1905
  title_zh: 逝世
  description: 生卒年失载，约卒于光绪末后，采访册存以传其志业
