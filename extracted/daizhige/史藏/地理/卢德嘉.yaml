  lesson: 采访修志贵在实核博采，就正同人刊谬订讹而后发钞，方能信今传后
  summary_first_person: 吾凤山廪生卢德嘉，光绪十八年入采访局，与卢德祥陆日翔周熙清王春华共事，十九年受李明府谕命主稿，先成疆域田园二册，继就正同人而成甲至癸十部之书，于甲午腊月既望谨识缘起以俟通志采择
