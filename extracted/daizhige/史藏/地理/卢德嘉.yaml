  title_zh: 受命主稿先成疆域田园二册
  description: 光绪十八年设局候事寥寥，十九年受命在局主稿，商请饬传总保庄耆查报，陆续造送疆域田园以应总局之催
  phases:
  - key: brewing
    name: 设局候事
