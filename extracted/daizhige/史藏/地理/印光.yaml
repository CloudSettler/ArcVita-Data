  decisions:
  - date: 1922-01-01
    title_zh: 请陶在东王雅三主持重修山志
    rationale: 山志能由信向而改恶迁善，为挽回世道人心根本要务，非官方绅衲合力不成
  - date: 1923-01-01
    title_zh: 以大士颂托付许止净居士撰述
    rationale: 颂须遍阅大藏备考群籍，自己目疾无暇，许君因缘契合堪任此任
events:
- id: guji-印光-event-birth
  title_zh: 诞生于陕西郃阳赵氏
  date: 1861-01-11
  year_of: 1861
  place_zh: 陕西郃阳
  summary: 咸丰十一年冬诞生，少读儒书，目疾悟世无常，渐倾向佛典
- id: guji-印光-event-study
  title_zh: 北京红螺山资福寺出家受具
  date: 1881-01-01
  year_of: 1881
  place_zh: 直隶红螺山
  summary: 投龙泉寺莲如出家，次年受具，习教参禅后归心净土
- id: guji-印光-event-putuo
  title_zh: 赴南海普陀法雨寺掩关阅藏
  date: 1893-01-01
  year_of: 1893
  place_zh: 浙江普陀山法雨寺
  summary: 应化闻和尚请入藏经楼，掩关潜修三十余年，深入大藏兼修念佛
- id: guji-印光-event-wenchao
  title_zh: 印光文钞刊行天下景仰
  date: 1918-01-01
  year_of: 1918
  place_zh: 普陀山
  summary: 徐蔚如等募刊文钞，信札开示遍布中外，奠定净土宗师之位
- id: guji-印光-event-xinzhi
  title_zh: 倡修普陀洛迦新志并撰序托颂
  date: 1924-09-01
  year_of: 1924
  place_zh: 普陀山
  summary: 与陶在东开如等商定重修体例，托许止净撰大士本迹颂，自作流通序以明感应之理
- id: guji-印光-event-death
  title_zh: 示寂于苏州灵岩山寺
  date: 1940-12-02
  year_of: 1940
  place_zh: 江苏吴县灵岩山寺
  summary: 掩关念佛，端坐西逝，荼毗得五色舍利，塔于灵岩
