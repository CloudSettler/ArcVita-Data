      raw: 民国二十九年十一月初四
  birth_date: 1861-01-11
  death_date: 1940-12-02
  era: 清末民初
  reign_ref: 咸丰至民国
  archetype: 净土弘法高僧
  dilemmas:
  - 隐居自修以了生死与现身尘劳以度众生之间如何抉择
  - 专提念佛简易直捷与通途讲筵博洽多闻之间如何权衡
  - 恪守传统山志体例与创立本迹感应以显圣德之间如何取舍
  lesson: 以至诚恭敬为入道之本，以深信因果念佛求生为出苦要道，复以弘法利生为践行悲愿之实
  summary_first_person: 我俗姓赵，陕西郃阳人，寄食普陀法雨三十余年，深愧业重智浅，唯以净土自励励人，倡修山志以显观音本迹，付嘱大士颂以流通天下，愿见闻者同生西方，共证寂光
  source_urls:
  - https://daizhige.org/史藏/地理/普陀洛迦新志.html
  - https://tripitaka.cbeta.org/B0164
