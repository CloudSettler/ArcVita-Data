  - date: 1918-01-01
    title_zh: 许徐蔚如印行文钞以代讲筵
    rationale: 以文字般若代口说流通，令不见面者亦蒙法润，广摄钝根末机
- id: guji-印光-endeavor-2
  title_zh: 倡修新志托撰大士颂
  summary: 病旧志遗主志宾，倡议补述观音本迹感应，托许止净撰颂并别行流通以挽世道人心
