    title_zh: 区区方隅姑有待推广
    rationale: 古杭事繁不遽广为成书，先就东园见闻掌录为茗椀谈资以待后
  - date: '1730'
    title_zh: 略于古而详于今系以小传
    rationale: 舆记已详古迹而近事易湮，故详今存征引以备修志乘者采择
