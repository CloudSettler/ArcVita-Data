endeavors:
- id: guji-台湾府舆图纂要-endeavor-1
  title_zh: 订正府志重纂台湾府总图总册
  summary: 针对乾隆二十九年府志山川支分道里差错及厅县界限淆混详细采访逐一订正汇列疆域坊里山水城池营制屯番道里成总图总册
  phases:
  - key: brewing
    name: 例言立纲
    labels:
      zh: 立例
    start_date: 1835-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-1
  - key: breakthrough
    name: 采访订正
    labels:
      zh: 采访
    start_date: 1836-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-1
  - key: climax
    name: 总图告成
    labels:
      zh: 成图
    start_date: 1838-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-2
  - key: closure
    name: 册说备览
    labels:
      zh: 成册
    start_date: 1840-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-2
  decisions:
  - date: 1835-06-01
    title_zh: 删桥梁古井补屯番戍兵
    rationale: 桥梁古井纷繁与险要无关故删削屯番与戍兵相辅必须补入以资守御
  - date: 1836-03-01
    title_zh: 不载淡水噶玛兰虚设隘寮
    rationale: 番性日驯隘丁隘寮名存实废各属未全录故不载以从实
- id: guji-台湾府舆图纂要-endeavor-2
  title_zh: 分纂七县三厅舆图险要分册
  summary: 分台湾凤山嘉义彰化四县淡水噶玛兰澎湖三厅各立表册详载四至广袤坊里村庄山水分水守御险要及水陆道里
  phases:
  - key: brewing
    name: 分域定界
    labels:
      zh: 定界
    start_date: 1836-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-1
  - key: breakthrough
    name: 山水分水考定
    labels:
      zh: 考山水
    start_date: 1837-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-2
  - key: climax
    name: 海防险要总说
    labels:
      zh: 明险要
    start_date: 1839-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-2
  - key: closure
    name: 内山附论志要
    labels:
      zh: 附内山
    start_date: 1841-01-01
    highlight_event_id: guji-台湾府舆图纂要-event-2
  decisions:
  - date: 1837-09-01
    title_zh: 以西向内地定山水分水脉络
    rationale: 台山蜿蜒渡海水出于山西向归海故以西向定郡邑村落水口以正形势
  - date: 1839-05-01
    title_zh: 内山界外附论存要
    rationale: 分界禁垦乃一时权宜今日厅县即昔日禁地故附论以志要为后日开辟留据
events:
- id: guji-台湾府舆图纂要-event-birth
  title_zh: 起纂
  date: 1835-01-01
  year_of: 1835
  description: 道光十五年因府志失详道里差错及新改隶村庄遂立例采访起纂台湾府舆图
- id: guji-台湾府舆图纂要-event-1
  title_zh: 详访四县三厅疆域坊里
  date: 1836-06-01
  year_of: 1836
  description: 遍访台湾凤山嘉义彰化淡水噶玛兰澎湖核定四至广袤坊里保庄村社澳社之数
- id: guji-台湾府舆图纂要-event-2
  title_zh: 考定山水分水与海防险要成图册
  date: 1840-08-01
  year_of: 1840
  description: 考定大乌草山分水仑三重屏障及黑水二沟鹿耳门港道并总说鸡笼八里坌鹿港旗后东港对渡形势图册告成
- id: guji-台湾府舆图纂要-event-death
  title_zh: 纂要告成
  date: 1842-12-31
  year_of: 1842
  description: 台湾府舆图纂要总图总册及各属图册既成备载山川方向道里保属以便观览守御
