  archetype: 循吏型邊陲守令
  dilemmas:
  - 岫邑建置未久經史無考而大憲檄催續修通志，如何在七月速成與信史之間取捨
  - 採訪多出偏見親故標榜，如何堅守詢謀僉同與蓋棺論定以全風化
  lesson: 僻邑亦有文獻可徵，及時考訂直書，方不負朝廷諄諄望治之意
  summary_first_person: 余台隆阿，號湘湄，紅帶子，以岫岩鳳凰城海防通判守此邊陲，咸豐丁巳奉大憲檄修志，集都人士，屬李翰穎秉筆，閱七月而稿成，分門別類據事直書，願後之繼者捃摭益富，使豐編照物歷久彌光
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%B2%AB%E5%B2%A9%E5%BF%97%E7%95%A5.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%B2%AB%E5%B2%A9%E5%BF%97%E7%95%A5.html
endeavors:
- id: guji-台隆阿-endeavor-1
  title_zh: 監修岫岩志略成一邑文獻之徵
  description: 咸豐丁巳奉檄倡修岫岩志，延李翰穎纂修，分十卷，廣採通志與採訪，七月粗就，自為序以望後繼
  phases:
  - key: brewing
    name: 奉檄議修
    labels:
