    start_date: 1857-04
    highlight_event_id: guji-台隆阿-event-1
  - key: breakthrough
    name: 集士屬筆開局
    labels:
      zh: 開局
    start_date: 1857-05
    highlight_event_id: guji-台隆阿-event-1
  - key: climax
    name: 分門纂輯粗就
    labels:
      zh: 纂輯
    start_date: 1857-07
    highlight_event_id: guji-台隆阿-event-2
  - key: closure
    name: 作序刊傳望後
    labels:
      zh: 成帙
    start_date: 1857-12
    highlight_event_id: guji-台隆阿-event-2
  decisions:
  - date: 1857-04
    title_zh: 集都人士告以修志之意
    rationale: 恐芳蹤湮沒於荒煙蔓草，欲及時考訂以廣流傳，不負上台望治之意
  - date: 1857-05
    title_zh: 屬李翰穎秉筆專任纂修
    rationale: 築室道傍三年弗成，催符屢下，須專人負責方能據事直書戒煩無溢美
- id: guji-台隆阿-endeavor-2
  title_zh: 任岫岩鳳凰城海防通判守邊撫民
  description: 以通判兼領岫岩鳳凰城，治事之暇理疆界田賦訟獄，修城池公署倉庫祠祀，察民風物產以庶富而教之
  phases:
  - key: brewing
    name: 專城而治畫疆以理
    labels:
