    start_date: 1856-01
    highlight_event_id: guji-台隆阿-event-1
  - key: breakthrough
    name: 察封疆形勝閭巷歌謠
    labels:
      zh: 巡察
    start_date: 1857-04
    highlight_event_id: guji-台隆阿-event-1
  - key: climax
    name: 興廢舉墜養民事神
    labels:
      zh: 經營
    start_date: 1857-06
    highlight_event_id: guji-台隆阿-event-2
  - key: closure
    name: 望後善於其後者
    labels:
      zh: 垂後
    start_date: 1857-12
    highlight_event_id: guji-台隆阿-event-2
  decisions:
  - date: 1857-06
    title_zh: 以營建為養民事神之本
    rationale: 城池公署倉庫祠祀皆政令所出，廢者修墜者舉乃營建至計
  - date: 1857-12
    title_zh: 詳載戶口田賦以今較昔
    rationale: 徭役省訟獄平必先明經界賦則，故查現在冊檔開列其詳以為憑
