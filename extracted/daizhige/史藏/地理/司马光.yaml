endeavors:
- id: guji-司马光-endeavor-1
  title_zh: 历朝直谏与熙宁抗新法
  description: 自馆阁至御史谏院以直闻，熙宁中力争新法不便，乞外补以存谏节
  phases:
  - key: brewing
    name: 馆阁养望
    labels:
      zh: 直谏养望
    start_date: 1038-01-01
    highlight_event_id: guji-司马光-event-jinshi
  - key: breakthrough
    name: 谏院抗疏
    labels:
      zh: 朝堂论政
    start_date: 1060-01-01
    highlight_event_id: guji-司马光-event-jianyi
  - key: climax
    name: 力争新法
    labels:
      zh: 熙宁争法
    start_date: 1069-04-01
    highlight_event_id: guji-司马光-event-xining
  - key: closure
    name: 退居洛阳
    labels:
      zh: 退居著述
    start_date: 1071-01-01
    highlight_event_id: guji-司马光-event-luoyang
  decisions:
  - date: 1069-04-01
    title_zh: 上疏论青苗法不便
    rationale: 以祖宗之法不可骤变，利民当以安静为本，不以理财扰民
  - date: 1070-01-01
    title_zh: 乞外补判永兴军
    rationale: 言不用则去就以全谏臣之节，退而著史以存天下之公
- id: guji-司马光-endeavor-2
  title_zh: 主持编修资治通鉴
  description: 奉诏置局编历代君臣事迹，十九年成二百九十四卷，以资人君治道
  phases:
  - key: brewing
    name: 进通志乞置局
    labels:
      zh: 立志著史
    start_date: 1064-01-01
    highlight_event_id: guji-司马光-event-tongzhi
  - key: breakthrough
    name: 置书局聚众修
    labels:
      zh: 开局纂修
    start_date: 1066-01-01
    highlight_event_id: guji-司马光-event-shuju
  - key: climax
    name: 进呈资治通鉴
    labels:
      zh: 进书成典
    start_date: 1084-12-01
    highlight_event_id: guji-司马光-event-jincheng
  - key: closure
    name: 元祐拜相行旧法
    labels:
      zh: 晚年执政
    start_date: 1086-06-01
    highlight_event_id: guji-司马光-event-baixiang
  decisions:
  - date: 1064-01-01
    title_zh: 进历代君臣事迹乞置局
    rationale: 以鉴前世之兴衰，考当今之得失，非编年通史不足以资治
  - date: 1071-01-01
    title_zh: 以著史为己任不受利诱
    rationale: 宁退居独修一书，不以政争废千秋之业，直书褒贬以信后世
