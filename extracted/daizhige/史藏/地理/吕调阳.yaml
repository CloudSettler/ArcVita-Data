endeavors:
- id: guji-吕调阳-endeavor-1
  title_zh: 考订西藏方舆舆地道里
  summary: 自打箭炉起考八十七塘站及前后藏山川要隘成书以明边形势
  phases:
  - key: brewing
    name: 随宦见闻积累
    labels:
      zh: 宦游见闻
    start_date: 1870
    highlight_event_id: guji-吕调阳-event-study
  - key: breakthrough
    name: 汇考塘站山川
    labels:
      zh: 舆地考订
    start_date: 1890
    highlight_event_id: guji-吕调阳-event-book
  - key: climax
    name: 撰成西藏方舆
    labels:
      zh: 成书示警
    start_date: 1895
    highlight_event_id: guji-吕调阳-event-book
  decisions:
  - date: 1895
    title_zh: 以炉为始总计塘站道里
    rationale: 明昌都为西藏门户拉里玉树为咽喉工布长江为保障非考道里不能言守
  - date: 1895
    title_zh: 详记雅鲁布江雪山五峰及江卡江孜孔道
    rationale: 英人由大吉岭孟加拉铁路逼藏不惜重款开路故须先明要隘所在
- id: guji-吕调阳-endeavor-2
  title_zh: 筹藏防批驳与英密约
  summary: 言英俄虎视三藏不可独与英密当结好廓尔喀并于江孜定日设防
  phases:
  - key: brewing
    name: 察英俄经营印度阿富汗
    labels:
      zh: 审察列强
    start_date: 1890
    highlight_event_id: guji-吕调阳-event-memorial
  - key: climax
    name: 论喇嘛与英国密约之害
    labels:
      zh: 批驳密约
    start_date: 1895
    highlight_event_id: guji-吕调阳-event-memorial
  - key: closure
    name: 建言固屏藩谨边备
    labels:
      zh: 筹边设防
    start_date: 1898
    highlight_event_id: guji-吕调阳-event-memorial
  decisions:
  - date: 1895
    title_zh: 主张与廓尔喀结好不与英独密
    rationale: 廓尔喀地险民勇足为西藏保障密英则喜一国而怒一国终致瓜分
  - date: 1898
    title_zh: 请于江孜定日帕克里顿防务
    rationale: 济咙聂拉木旧隘为防廓夷而设今轻重异势须防英由南路渐进
