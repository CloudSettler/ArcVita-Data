  reign_ref: 光绪朝
  archetype: 边疆舆地筹防之士
  dilemmas:
  - 三藏之地介于英俄两强之间事英乎事俄乎独密约一国反滋他族之忌
  - 名则通商实则据要隘撒屏藩与英密约求旦夕之安还是与廓尔喀结好以坚内附
  lesson: 密约隐晦非显明不足恃屏藩险要不可撤须设险屯防得地利以顺天时安边塞
  summary_first_person: 我生清末随父宦游曾在古匡州署与英国通事往来因而留心边事考西藏纵横道里塘站山川及英由大吉岭孟加拉经营藏地之谋撰为西藏方舆力言廓尔喀为西藏保障不可轻与英密约当于江孜定日帕克里等处谨防务以杜后患
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E8%A5%BF%E8%97%8F%E6%96%B9%E8%88%86.html
