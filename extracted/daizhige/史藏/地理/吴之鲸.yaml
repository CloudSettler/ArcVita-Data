    rationale: 春官难登不可虚耗岁月当以著述自见并为入仕后经世之资
  - date: '1615'
    title_zh: 谒选就浮梁知县尽心民事
    rationale: 科第既蹭蹬则以亲民之官行志不以小邑而怠职守
- id: guji-吴之鲸-endeavor-2
  title_zh: 博考乘牒编纂武林梵志
  description: 以杭州梵刹盛于南宋至明残废者多恐遗迹渐湮博考乘牒分城内外南北山及属县成十二卷之志
  phases:
