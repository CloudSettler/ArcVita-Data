    start_date: '1622'
    highlight_event_id: guji-吴之鲸-event-wulin
  decisions:
  - date: '1615'
    title_zh: 以仙林寺为首按城内外南北山及属县分派
    rationale: 旧志体例便观览当仍之依次分派使四百余刹井然有条
  - date: '1620'
