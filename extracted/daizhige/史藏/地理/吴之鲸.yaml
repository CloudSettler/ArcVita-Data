      raw: 卒于浮梁知县任上
  birth_date: '1575'
  death_date: '1626'
  era: 明
  reign_ref: 万历
  archetype: 方志编纂者
  dilemmas:
  - 屡上春官不第是继续科举求进还是转以著述存史自见
  - 杭城梵刹残废遗迹渐湮是任其泯没还是博考乘牒分地系存
  lesson: 一第不足尽人而文献足传远守土尽职之外尤当为乡邦存旧闻以补史阙
  summary_first_person: 我是吴之鲸字伯裔钱塘人与吴大山并称江皋二俊万历中举于乡数上春官不第后谒选得浮梁知县卒于官我恐杭州梵刹自南宋之盛至明残废遗迹渐湮故博考乘牒按城内外南北山及属县得寺院四百二十六所详其创建始末山川形胜又分天朝宠锡宰官护持古德机缘历代勋绩为四门以纪名流胜迹高僧支派遂成武林梵志十二卷以存武林旧事
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/地理/武林梵志.md
  - https://daizhige.org/史藏/地理/武林梵志.html
