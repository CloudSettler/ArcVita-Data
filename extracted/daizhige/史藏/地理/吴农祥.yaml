endeavors:
- id: guji-吴农祥-endeavor-1
  title_zh: 撰西湖水利考辨唐宋胜国湖政得失
  summary: 考李泌六井白居易石函苏轼石堰之利论胜国侵占三难驳不便浚湖之议以定复湖之论
  phases:
  - key: brewing
    name: 溯唐宋引湖为源旧制
    labels:
      zh:
      - 考据旧制
    start_date: 1670
    highlight_event_id: guji-吴农祥-event-1
  - key: breakthrough
    name: 明积习国赋国费三难
    labels:
      zh:
      - 析难
    start_date: 1671
    highlight_event_id: guji-吴农祥-event-1
  - key: climax
    name: 驳湖滨生计湖高城卑诸谬说
    labels:
      zh:
      - 立论
    start_date: 1672
    highlight_event_id: guji-吴农祥-event-1
  - key: closure
    name: 成水利考定复湖之议
    labels:
      zh:
      - 成书
    start_date: 1673
    highlight_event_id: guji-吴农祥-event-1
  decisions:
  - date: 1671
    title_zh: 以营卫肠胃立论明湖为一郡命脉
    rationale: 非止眉目清扬乃系水谷通塞故须力主开浚
  - date: 1672
    title_zh: 举全郡对三百户以决去取
    rationale: 惜小户则害大郡为一郡计须复唐宋之旧
- id: guji-吴农祥-endeavor-2
  title_zh: 作水利续考主疏支排干以图久远
  summary: 别唐夺湖于江宋分湖于江胜国利湖之开本朝利疏支排干之异策官浚屯河时撩泉葑并及南湖为西湖之祖
  phases:
  - key: brewing
    name: 察本朝三河淤塞百脉不通
    labels:
      zh:
      - 察病
    start_date: 1674
    highlight_event_id: guji-吴农祥-event-2
  - key: breakthrough
    name: 陈疏支排干体轻气达之法
    labels:
      zh:
      - 立法
    start_date: 1675
    highlight_event_id: guji-吴农祥-event-2
  - key: climax
    name: 策官浚屯河时撩阴沙泉眼
    labels:
      zh:
      - 设策
    start_date: 1676
    highlight_event_id: guji-吴农祥-event-2
  - key: closure
    name: 推南湖为祖通一郡与数郡
    labels:
      zh:
      - 推本
    start_date: 1678
    highlight_event_id: guji-吴农祥-event-2
  decisions:
  - date: 1675
    title_zh: 主官自浚屯河不委之戍满即归者
    rationale: 屯居非土著授受苟且必致复塞故须官计道里均作
  - date: 1676
    title_zh: 定时撩与随时撩兼行徙马肆于江干
    rationale: 葑弱易生泉灿如星马浊水色故须循环疏通远秽
