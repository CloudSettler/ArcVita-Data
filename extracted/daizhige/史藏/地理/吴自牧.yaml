  lesson: 往事殆如黄粱一梦唯直笔记载可传后人
  summary_first_person: 余钱塘吴自牧也，昔人一炊而事业遍历觉则依然故吾，时异事殊城池风俗焉保如畴昔，缅怀往事殆犹梦也，故录临安旧事名曰梦粱录
