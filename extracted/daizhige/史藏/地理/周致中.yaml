  - date: 1330-06-01
    title_zh: 以徐福东渡说系联日本国源流
    rationale: 商舶所传与旧史相合，取其可考者以定国始，便于读者寻源
  - date: 1333-03-01
    title_zh: 并存扶桑长生诸异闻不删
    rationale: 虽涉荒诞然流传已久，存录以备一说，不以臆断去之
