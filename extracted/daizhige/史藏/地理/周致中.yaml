    title_zh: 以种类风俗分列鞑靼诸部
    rationale: 北漠诸部名号繁多风俗略同，分条列名以存其别而总其同
  - date: 1338-05-01
    title_zh: 保留龙涎飞头鸟葬诸异俗
    rationale: 志在存异，不以中土常理裁之，故详录其俗以见天地之广
