    title_zh: 增筑寅宾东门并葺天井峧门楼雉堞
    rationale: 县据太行要途北虏可入旧城单薄水冲必因险筑隘方可保障
  - date: '1546'
    title_zh: 改建敬一亭建名宦乡贤二祠
    rationale: 学宫规制乃政教之本表名宦乡贤足以昭劝进修仰止
