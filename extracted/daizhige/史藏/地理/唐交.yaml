    rationale: 旧草出于臆见文鄙事疏必稽载籍采舆论方可信史一方
  - date: '1546'
    title_zh: 命陈玮等分掌采访编次
    rationale: 列国掌记不存郡邑之志作非合众搜采不能备古今心迹之微
- id: guji-唐交-endeavor-2
  title_zh: 修城固隘兴学崇祀卫民
  summary_zh: 继熊瑶砖城加葺理增建寅宾东门重修天井峧隘改建固镇巡检司新敬一亭名宦乡贤祠及八蜡城隍诸庙以固保障以振文教
