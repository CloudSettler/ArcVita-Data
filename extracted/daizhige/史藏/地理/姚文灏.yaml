  decisions:
  - date: 1495
    title_zh: 以开江置闸围岸为首务
    rationale: 太湖绵亘受诸山之水散注淀山经松江黄浦入海围田掩遏塘港湮塞故泛溢须开江置闸围岸以发泄水势
  - date: 1497
    title_zh: 河道田围兼修不专恃一法
    rationale: 海塘南障三江北折今势与古小异若欲尽同古法则劳大功微须兼修河道及田围而斟酌形势
- id: guji-姚文灏-endeavor-2
  title_zh: 编纂浙西水利书三卷
  summary: 辑宋至明初浙西水利议论四十七篇笔削去取详单锷任古之是略郏亶之凿为后人实验之资
  phases:
