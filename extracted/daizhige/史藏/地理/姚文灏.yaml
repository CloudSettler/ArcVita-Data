  - key: climax
    name: 成书三卷上序刊行
    labels:
      zh: 成书
    start_date: 1497-10-01
    highlight_event_id: guji-姚文灏-event-book
  - key: closure
    name: 申明有书不尽于书
    labels:
      zh: 垂训
    start_date: 1497-10-01
    highlight_event_id: guji-姚文灏-event-book
  decisions:
  - date: 1496
    title_zh: 不录宋郏氏诸议
    rationale: 郏亶七里纵浦十里横塘大指失之凿故不得而录其可取者已见朱长文等篇智者自辨
  - date: 1497
    title_zh: 详单锷任都水而略其非
    rationale: 单锷吴中水利书任古水利议答深究吴江岸阻水江尾湮塞之害故详其是略其非及重言复出者
