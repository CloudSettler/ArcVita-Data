  - key: breakthrough
    name: 考成籍作十二舆图
    labels:
      zh:
      - 考成籍
      - 翼图叙纪
    start_date: '1542'
    highlight_event_id: guji-姚虞-event-yutu
  - key: climax
    name: 系叙纪明沿革利病
    labels:
      zh:
      - 沿革形势
      - 兵食地里
    start_date: '1542-08-01'
    highlight_event_id: guji-姚虞-event-yutu
  - key: closure
    name: 胡凤梓行湛若水序
    labels:
      zh:
      - 梓行广传
      - 简而要
    start_date: '1542-09-04'
    highlight_event_id: guji-姚虞-event-yutu
  decisions:
  - date: '1542'
    title_zh: 凡例先行随事起义
    rationale: 诸图不盈方尺故未尽者载诸叙叙或遗者载诸纪凡以翼图故先之以凡例
  - date: '1542-09-04'
    title_zh: 属胡守凤梓以告守土
    rationale: 昕夕顾諟以警惕厥衷观象考文沿时揆事实为备预不虞之善经
- id: guji-姚虞-endeavor-2
  title_zh: 出守淮安抚民生息
  summary: 由御史出为淮安府知府以足食足兵为要振作户口田粮整饬军卫民壮以复乐土之治
