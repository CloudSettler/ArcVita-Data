  dilemmas:
  - 旧界河山已入俄版图而图说当详旧界以存国史还是避讳以就现状
  - 边地旗民生计维艰而招徕流民开垦与固守旗界之间如何权衡
  lesson: 以舆图存疆域之真以考据挽利权之失经世致用即在方寸图版之间
  summary_first_person: 吾为屠寄武进人也光绪举人入幕黑龙江遍履南北兴安谙山川屯站之实欲以一图一说存旧界备边防虽国势日蹙而史笔不可夺也
