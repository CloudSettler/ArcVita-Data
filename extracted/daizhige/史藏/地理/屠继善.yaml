    start_date: 1890
    highlight_event_id: guji-屠继善-event-arrive
  - key: breakthrough
    name: 司鸠来恒佐恒春民牧
    labels:
      zh:
      - 来恒
    start_date: 1892
    highlight_event_id: guji-屠继善-event-arrive
  - key: climax
    name: 兼领志役孤诣苦心
    labels:
      zh:
      - 兼志
    start_date: 1893
    highlight_event_id: guji-屠继善-event-interview
  - key: closure
    name: 乐观厥成以待润色
    labels:
      zh:
      - 守成
    start_date: 1894
    highlight_event_id: guji-屠继善-event-complete
  decisions:
  - date: 1892
    title_zh: 俭就省局颁费而成志
    rationale: 地方贫乏不能醵资，固难斥俸，故从其俭而成一方之守以裨采访上贡
  - date: 1893
    title_zh: 存学校义塾分门别类
    rationale: 学校为人才荟萃与训蒙乡里不同，边防外患与凶番梗化轻重不等，故分纪以示体例
