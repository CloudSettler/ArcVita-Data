  birth_date: 1850
  death_date: 1905
  era: 清
  reign_ref: 光绪
  archetype: 采风存史之良佐
  dilemmas:
  - 荒徼无征而欲存一邑规模，案牍飘零，掌故无求
  - 简繁之间愿从繁入手，有纲有目以待后人删削
  lesson: 新辟荒邑不可无史，博访周咨参究无疑以备考核
  summary_first_person: 吾会稽明经，佐豫章而司鸠来恒，总采访成恒春县志二十二卷，网罗散佚，孤诣苦心，愿后之英材厘订润色以光一邑
