    highlight_event_id: guji-屠继善-event-complete
  decisions:
  - date: 1892
    title_zh: 以辟县为始阙凤山旧文
    rationale: 恒春昔隶凤山鞭长莫及，旧无事可志，故断自设县详为缔造以挈纲领
  - date: 1893
    title_zh: 有闻必书无见不录从繁入手
    rationale: 草创新书地系番界民尽招徕，由繁而简则易，由偏而全则难，故载录原禀以待裁决
- id: guji-屠继善-endeavor-2
  title_zh: 佐豫章贰尹司鸠来恒
  role: 佐贰司鸠
  place: 豫章至恒春
  start_date: 1890
  end_date: 1894
  summary: 以明经佐豫章贰尹，以司鸠来恒，佐民牧料理招徕抚绥兼理志役
  phases:
  - key: brewing
    name: 明经佐豫章贰尹
    labels:
