  lesson: 都邑之实赖方志以传，考据当以实证正俗说
  summary_first_person: 吾乃吴兴乌程山谦之，生当宋初，长于文史，尝佐著作，复丞丹阳，亲历京邑山川津亭，考慈母之竹，辨烈洲之津，录蒋山石城新亭之形胜，成丹阳记三卷，愿以一方之志存京都之实
