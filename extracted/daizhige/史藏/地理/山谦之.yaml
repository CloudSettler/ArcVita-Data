    title_zh: 由文史入地理
    rationale: 非徒抄前史，必亲核石头城因山为城因江为池之形胜，及蒋山隆崛峻异若龙之状，方能得地志之真
  - date: '0443'
    title_zh: 以尹丞之便询访耆旧
    rationale: 蒋陵为吴大帝陵，张侯桥为张子布宅处，皆须访求旧基故实，系之于京师南北之格局中
