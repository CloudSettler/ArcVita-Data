    rationale: 慈母山俗呼鼓吹山，当录其竹圆致异于众处以明乐府所给之实，不没俗说亦不徇俗名
  - date: '0442'
    title_zh: 系旧津古亭于沿革
    rationale: 烈洲为吴旧津，新亭为吴旧亭移创于隆安，必书其变迁与避风泊船之用，方见地名之由来
