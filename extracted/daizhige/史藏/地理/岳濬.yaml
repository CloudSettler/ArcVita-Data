  - date: 1729-01-01
    title_zh: 访延名宿次第采厘
    rationale: 通志体大，非博采方舆掌故不足以备文献，故广延通儒分任采辑分校
  - date: 1735-09-01
    title_zh: 因郡邑分置再三改订后付梓
    rationale: 疆域既易条目亦更，必更改订再三至雍正乙卯九月方可付梓以传信
  - date: 1736-03-15
    title_zh: 首列典谟弁王言作序
    rationale: 志中所陈皆经累圣裁成，首以典谟为训行之始，以昭显承之美
