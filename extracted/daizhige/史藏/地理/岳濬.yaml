  - 旧志简略失据而郡邑屡分疆域屡易，何以厘定体例以成一统之信志
  - 圣乡阙里崇隆与山川田赋兵防河漕并重，何以审详略别异同以显山东特异
  - 沿袭避忌讹谬相沿，何以正字体书法信古择善而传信将来
  lesson: 访延名宿，次第采厘，沿创订增务臻醇备，方可以一方之志昭谟烈而襄治理
