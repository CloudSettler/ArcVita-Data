    title_zh: 重运道海疆与金堤保障
    rationale: 东省扼襟喉控水陆，黄河如带青社维垣，必详河漕海疆制度以固圉安民
  - date: 1735-01-01
    title_zh: 隆阙里首重岱宗
    rationale: 山东特异在圣人之乡与巡方首重岱宗，故彚辑阙里一志以崇儒重道
  - date: 1736-03-15
    title_zh: 扬扢王灵昭示来兹
    rationale: 普声教于东渐，敬扬谟烈，使立政宜民有所稽考，永永无极
events:
- id: guji-岳濬-event-birth
  title_zh: 岳濬诞生
  kind: birth
  date: 1690-01-01
  year_of: 1690
  description_zh: 生年未详，约康熙晚期，清代官员，后官至山东巡抚
- id: guji-岳濬-event-compile-start
  title_zh: 奉诏增修山东通志开局采辑
  kind: career
  date: 1729-01-01
  year_of: 1729
  description_zh: 世宗宪皇帝御极七年诏增修一统志及各省通志，岳濬承乏二东访延名宿次第采厘
- id: guji-岳濬-event-print
  title_zh: 四稿改订雍正乙卯九月付梓
  kind: career
  date: 1735-09-01
  year_of: 1735
  description_zh: 会东省郡邑屡有分置疆域既易，更改订再三历七载四稿而成，至雍正乙卯九月付梓，全志三十六卷
- id: guji-岳濬-event-preface
  title_zh: 乾隆元年三月作山东通志序进呈
  kind: career
  date: 1736-03-15
  year_of: 1736
  description_zh: 乾隆元年岁次丙辰三月中浣，巡抚山东都察院右都御史岳濬拜手为序，表巡方重岱宗崇圣隆阙里之义
- id: guji-岳濬-event-death
  title_zh: 岳濬去世
  kind: death
  date: 1755-01-01
  year_of: 1755
  description_zh: 卒年未详，约乾隆中期，前后总裁山东通志，职名列总裁首位
