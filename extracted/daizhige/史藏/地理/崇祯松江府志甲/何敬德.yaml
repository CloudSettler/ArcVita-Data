  decisions:
  - date: 1307-06-01
    title_zh: 集善士夜煮寘甕晝施
    rationale: 懲沸糜急食仆死之弊，夜煮晝施虛前行粥以全活
  - date: 1308-03-01
    title_zh: 求破衣集眾收瘞遺骸
    rationale: 不忍枯胔暴露，聚數十萬具而瘗之以安亡者
events:
- id: guji-何敬德-event-birth
  date: 1251
  year_of: 1251
  title_zh: 生於上海浦東民家
  description: 樸謹不妄語，善會計，布衣蔬食之本
- id: guji-何敬德-event-1
  date: 1295
  year_of: 1295
  title_zh: 為張瑄筦庫贏羨不私而亟辭
  description: 事張瑄行舶筦庫，贏羨莫勝數，一髮不自私，瑄父子倚任而亟辭，勸母嗜進厚藏，後瑄敗獨免
- id: guji-何敬德-event-2
  date: 1307-06-01
  year_of: 1307
  title_zh: 大德十一年菩提寺施粥七十日
  description: 杭大饑官粥多殍，請善士五七人夜煮寘大甕明旦列施，日煮米七八石至十石，六月至八月凡七十日饑民無死者
- id: guji-何敬德-event-3
  date: 1308-03-01
  year_of: 1308
  title_zh: 明春收瘞遺骸數十萬具
  description: 求破衣集好善者收聚遺骸枯胔數十萬具而瘗之，夏復為粥如昨歲
- id: guji-何敬德-event-death
  date: 1308-06-06
  year_of: 1308
  title_zh: 再施粥三十六日後殁年五十七
  description: 自五月朔再施粥逾三十六日而殁，終年五十七，以施貧賑乏終身
