  - key: climax
    name: 見貴盛亟辭勸戒母嗜進
    labels:
      zh: 亟辭勸戒
    start_date: 1300
    highlight_event_id: guji-何敬德-event-1
  - key: closure
    name: 瑄敗夷戮籍沒獨免無累
    labels:
      zh: 遠禍獨免
    start_date: 1303
    highlight_event_id: guji-何敬德-event-1
  decisions:
  - date: 1295
    title_zh: 贏羨不私亟求辭去
    rationale: 不以一髮自私，恐久倚任厚藏速禍，故守廉引退
  - date: 1300
    title_zh: 布衣蔬食勸瑄父子節進
    rationale: 以施貧賑乏為務，勸其母嗜進厚藏以避禍敗
- id: guji-何敬德-endeavor-2
  title_zh: 杭城施粥瘞骸活人
  summary: 大德十一年杭大饑，集善士於菩提寺夜煮寘甕晝施，日煮米七八石至十石，七十日全活饑民，明春瘞遺骸數十萬，次夏再施粥而殁
  phases:
  - key: brewing
