      zh: 夜煮晝施
    start_date: 1307-06-01
    highlight_event_id: guji-何敬德-event-2
  - key: climax
    name: 七十日全活兼瘞遺骸數十萬
    labels:
      zh: 全活瘞骸
    start_date: 1308-03-01
    highlight_event_id: guji-何敬德-event-3
  - key: closure
    name: 次夏再施粥三十六日而殁
    labels:
      zh: 再施善終
