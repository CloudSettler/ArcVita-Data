  dilemmas:
  - 贏羨莫數與一髮不私之間的廉守之擇
  - 張氏貴盛佩金符與布衣蔬食施貧之間的進退之擇
  lesson: 忠信篤行，為善無近名，廉以遠禍，仁以活人
  summary_first_person: 吾浦東民家子，樸謹不妄語，以會計事張瑄行舶筦庫，贏羨不私而亟辭，勸其母嗜進厚藏，瑄敗吾獨免，大德杭饑，吾集善士於菩提寺夜煮晝施，七十日全活饑民，復瘗遺骸數十萬，再施粥而終，布衣蔬食，施貧賑乏而已
  source_urls:
