  summary: 事吳郡張瑄行舶筦庫，贏羨不私，見貴盛而亟辭，布衣蔬食勸戒厚藏，瑄敗獨免毫髮無累
  phases:
  - key: brewing
    name: 初事張瑄筦庫會計
