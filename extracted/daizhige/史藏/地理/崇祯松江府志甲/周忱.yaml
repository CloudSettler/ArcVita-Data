events:
- id: guji-周忱-event-birth
  title_zh: 出生于江西吉水
  date: 1381
  year_of: 1381
  description: 洪武十四年生江西吉水永乐中登进士历刑部主事工部侍郎
- id: guji-周忱-event-1434-zhenji
  title_zh: 奉敕谕巡抚侍郎赈济被灾饥民
  date: 1434-10
  year_of: 1434
  description: 宣德九年十月敕谕巡抚侍郎周忱被灾处人民乏食即委官于所在官仓量给米粮赈济毋得坐视民患
- id: guji-周忱-event-1440-takan
  title_zh: 奉敕躬自踏勘苏松潦水田亩
  date: 1440-07
  year_of: 1440
  description: 正统五年七月得奏苏松潦水为患农不及耕遣员外郎王瑛赍敕令周忱躬自踏勘渰没不得耕种之处具实奏来被水艰食者悉于官仓给济
- id: guji-周忱-event-1445-juanmian
  title_zh: 奏请蠲免十四府州无征粮米
  date: 1445-08
  year_of: 1445
  description: 正统十年八月奏南直隶并浙江苏松嘉湖等十四府州正统九年水灾无征粮米四十九万三千五百六十三石有奇乞验实蠲之得旨命户部验实蠲免
- id: guji-周忱-event-death
  title_zh: 卒于景泰四年
  date: 1453
  year_of: 1453
  description: 久任江南巡抚凡二十二年兴水利均税粮活数百万生灵景泰四年卒
