  archetype: 治水理财之能臣
  dilemmas:
  - 东南水患日甚而连岁灾疫民困凋瘵大兴工役与轻徭养民如何权衡缓急
  - 三江故道湮塞潮沙易淤先浚何港复何闸制设何夫役方能垂久远
  lesson: 治水必寻源溯委相地分流使太湖诸水各趋于海并立闸设夫以继疏浚方为久远之功
  summary_first_person: 吾湘阴人也以户部尚书理财治赋永乐初奉命区画苏松水利开刘家白茆二港疏泄太湖以合三江入海之旧法时论以为善吾惟愿后人守板闸夫役围岸之制使旱涝有备贡赋不亏百姓安堵而已
  source_urls:
