  decisions:
  - date: 1403
    title_zh: 决开刘家白茆以合三江故道
    rationale: 视三江东江湮塞太湖泛溢不浚迳直入海之港则上游壅遏故舍迂就径以分泄湖水
  - date: 1404
    title_zh: 定先浚大港后理支浦之序
    rationale: 大港通则众水有所归支浦方能次第疏治若漫理小浜则潮沙易淤功不继而患多
- id: guji-夏原吉-endeavor-2
  person_qid: guji-夏原吉
  title_zh: 总户部经制闸夫以守水利久远
  summary_zh: 以户部尚书总国赋创立开江撩浅夫役板闸启闭围岸修筑之制使疏浚有继旱涝有备
