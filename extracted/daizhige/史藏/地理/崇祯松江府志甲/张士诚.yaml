    highlight_event_id: guji-张士诚-event-birth
  - key: breakthrough
    name: 谋劫狱杀官起事
    labels:
      zh: 与李华甫同谋杀华甫并众
    start_date: '1353'
    highlight_event_id: guji-张士诚-event-qibing
  - key: climax
    name: 陷通泰自号诚王
    labels:
