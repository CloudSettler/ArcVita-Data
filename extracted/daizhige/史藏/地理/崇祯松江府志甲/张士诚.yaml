    highlight_event_id: guji-张士诚-event-qibing
  decisions:
  - date: '1353'
    title_zh: 与李华甫谋起事后杀华甫并其众
    rationale: 借劫狱之机并合盐贩与游侠以独揽兵权免受制于人
  - date: '1354'
    title_zh: 陷高邮通泰后自号诚王改元天祐
    rationale: 据淮南要冲设官分截要冲以号召四方拒元南下
- id: guji-张士诚-endeavor-2
  title_zh: 南渡取吴据有平江松江
  summary: 因江阴朱英求救盛陈江南富庶遂南攻常熟破官军据平江路
  phases:
  - key: brewing
    name: 朱英求救劝南取
    labels:
      zh: 质妻子借兵盛陈江南钱谷子女之富
    start_date: '1355'
    highlight_event_id: guji-张士诚-event-qibing
  - key: breakthrough
    name: 正月朔攻破常熟
    labels:
      zh: 达识帖木儿脱因哈散沙等捍御境上
    start_date: '1356-01-01'
    highlight_event_id: guji-张士诚-event-jupingjiang
  - key: climax
    name: 破吴江官军据平江
    labels:
      zh: 王与敬一战而败死者过半退屯松江
    start_date: '1356-02-01'
    highlight_event_id: guji-张士诚-event-jupingjiang
  - key: closure
    name: 奄有江南坐守松苏
    labels:
      zh: 据松江平江保境安民终失进取
    start_date: '1357'
    highlight_event_id: guji-张士诚-event-jupingjiang
  decisions:
  - date: '1356-01-01'
    title_zh: 应朱英之请南攻常熟松江
    rationale: 闻江南土地广钱谷子女玉帛富欲避淮南重兵另开富庶基地
  - date: '1356-02-01'
    title_zh: 乘胜取吴江进据平江路城
    rationale: 官军新败松江空虚据苏松太仓漕运财赋以立割据之本
events:
- id: guji-张士诚-event-birth
  date: '1321'
  year_of: 1321
  title_zh: 生于泰州白驹场
  description: 泰州白驹场人兄弟并驾盐纲船兼业私贩家富轻财多结游侠
- id: guji-张士诚-event-qibing
  date: '1353'
  year_of: 1353
  title_zh: 与李华甫谋起事陷通泰高邮称诚王
  description: 至正十三年起事杀华甫并其众焚掠村落陷通泰高邮自号诚王改元天祐元立义兵元帅府招安而不就降
- id: guji-张士诚-event-jupingjiang
  date: '1356-01-01'
  year_of: 1356
  title_zh: 攻破常熟吴江据有平江路
  description: 十六年正月朔攻破常熟官军义民捍御不敌吴江止元帅王与敬一战大败残兵退屯松江遂据平江路奄有江南
- id: guji-张士诚-event-death
  date: '1367'
  year_of: 1367
  title_zh: 兵败国灭而死
  description: 割据苏松十余年后兵败被俘国灭而终松江故地归于一统
