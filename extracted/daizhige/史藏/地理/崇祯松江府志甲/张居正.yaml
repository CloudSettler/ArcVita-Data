endeavors:
- id: guji-张居正-endeavor-1
  title_zh: 请罢苏松织造取回内臣
  summary_zh: 因苏松水灾重大百姓流离，会工部礼科奏请罢苏松及应天织造取回内臣，便殿面奏得旨令孙隆织完近降花样即回京余皆停罢
  phases:
  - key: brewing
    name: 灾报酝酿部议请罢
    labels:
      zh: 水灾部议
    start_date: 1577
    highlight_event_id: guji-张居正-event-1
  - key: breakthrough
    name: 便殿力陈灾困面争
    labels:
      zh: 便殿面奏
    start_date: 1578
    highlight_event_id: guji-张居正-event-1
  - key: climax
    name: 中发御前银谕织完回京
    labels:
      zh: 发银谕回
    start_date: 1578
    highlight_event_id: guji-张居正-event-2
  - key: closure
    name: 奉旨停止物料准作岁造
    labels:
      zh: 停织具奏
    start_date: 1578
    highlight_event_id: guji-张居正-event-2
  decisions:
  - date: 1578
    title_zh: 持工部疏便殿奏陈苏松灾困
    rationale: 据抚按奏报及所闻百姓困苦流离朝不谋夕，地方钱粮委难措处，宜从部请以彰敬天恤民
  - date: 1578
    title_zh: 请取回孙隆停止未完织造
    rationale: 前年星变已有明旨停止织造著孙隆回京至今未完，诏令不信德泽不宣，且地方多一事则添一扰
- id: guji-张居正-endeavor-2
  title_zh: 请酌减增造赏夷段疋
  summary_zh: 因承运库以赏赐夷人段疋缺乏题请增造，查灾地疲民不堪催督，奏请酌减增造数额以纾东南民力
  phases:
  - key: brewing
    name: 库臣题请增造酝酿
    labels:
      zh: 缺乏题请
    start_date: 1578
    highlight_event_id: guji-张居正-event-3
  - key: breakthrough
    name: 查数酌减奏请裁定
    labels:
      zh: 酌减奏请
    start_date: 1579
    highlight_event_id: guji-张居正-event-3
  - key: closure
    name: 减派纾民以固邦本
    labels:
      zh: 减派恤民
    start_date: 1579
    highlight_event_id: guji-张居正-event-3
  decisions:
  - date: 1579
    title_zh: 发下王道成等疏查议减造
    rationale: 赏夷虽关国体然灾伤重大物料钱粮尚未徵完，不堪再加派扰民
  - date: 1579
    title_zh: 坚持酌减以推广德意
    rationale: 君臣一体有司不奉行百姓不得受惠，愿重惜民生保固邦本为社稷灵长之庆
events:
- id: guji-张居正-event-birth
  title_zh: 出生
  date: 1525-05-26
  year_of: 1525
  place_zh: 荆州府江陵县
  description_zh: 嘉靖四年五月初三生于江陵，后登进士入翰林终为万历首辅
- id: guji-张居正-event-1
  title_zh: 便殿奏请罢苏松织造
  date: 1578
  year_of: 1578
  place_zh: 京师便殿
  description_zh: 持工部覆顾九思王道成等疏入见，言苏松水灾重大百姓群聚劫夺，愿取回孙隆许坤仍旧，以彰敬天恤民
- id: guji-张居正-event-2
  title_zh: 得旨孙隆织完近降花样即回京余皆停止
  date: 1578
  year_of: 1578
  place_zh: 京师
  description_zh: 上许之命查近降御前发去银两应织袍服上紧凑织完日即回京，以前未完都停止物料准作岁造抚按查数具奏
- id: guji-张居正-event-3
  title_zh: 请酌减增造赏夷段疋
  date: 1579
  year_of: 1579
  place_zh: 京师
  description_zh: 发下王道成等请酌减织造段疋一本，查承运库太监孔成等以赏赐夷人缺乏题请增派，奏请量减以纾东南灾地疲民
- id: guji-张居正-event-death
  title_zh: 病逝
  date: 1582-07-09
  year_of: 1582
  place_zh: 京师
  description_zh: 万历十年六月二十日病逝于京师，改革未竟身后被籍
