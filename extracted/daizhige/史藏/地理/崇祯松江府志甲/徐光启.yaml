  decisions:
  - date: 1627-08-01
    title_zh: 决取耐水早熟者以先保收
    rationale: 松郡水乡不患旱而患潦惟能于三四尺深水中抽芽者可保全故舍晚熟高产而取耐水早熟
  - date: 1628-05-01
    title_zh: 劝厚壅以助水底抽芽
    rationale: 深水漫种非厚壅则苗弱不能出水故教人多壅使与常稻同熟
