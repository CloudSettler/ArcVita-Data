    rationale: 以目相慑不足惧若此刻低头则终身不可复言事
  - date: '1563'
    title_zh: 入南首弹沈坤次论鄢懋卿罗龙文
    rationale: 祭酒失表率权门客行大逆不先去此则纲纪不立
- id: guji-林润-endeavor-2
  title_zh: 开府江南条上苏松切务
  summary_zh: 以都御史开府江南江南大吏重足条上宽恤疲苦计民运清丈田表节义诸疏皆切苏松朝廷倚任
