  dilemmas:
  - 严世蕃设宴以目相慑是附势全身还是守正待弹
  - 开府江南重任在肩是姑息大吏还是条上切务厘弊苏松
  lesson: 不以目慑改节不以权门易心以苏松切务为封事则直声与实政并立
  summary_first_person: 吾莆田林润号念堂嘉靖丙辰进士初令临川继为南御史不畏严世蕃首弹沈坤次论鄢懋卿罗龙文终以都御史开府江南条上宽恤清丈裕征诸务方见倚任而卒于官
  source_urls:
  - https://daizhige.org/史藏/地理/崇祯松江府志甲/卷33.html
