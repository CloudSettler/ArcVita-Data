    rationale: 苏松赋重虚征累民不丈田均役则国计民命两困
  - date: '1569'
    title_zh: 表节义恤耆哲裕虚征召贤辅
    rationale: 兵燹之后风教不立则吏治难兴必先崇德报功以收人心
