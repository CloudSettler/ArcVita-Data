endeavors:
- id: guji-汤和-endeavor-1
  title_zh: 奉命治海务创建金山等卫所
  summary: 洪武初奉命相度缘海要冲，于松江建金山卫青村所南汇所并府城守御所，屯留都官军立墩堡烽传以防倭
  phases:
  - key: brewing
    name: 受命相度要冲
    labels:
      zh: 治海务
    start_date: 1369
    highlight_event_id: guji-汤和-event-1
  - key: breakthrough
    name: 建卫立所屯守
    labels:
      zh: 建金山卫
    start_date: 1370
    highlight_event_id: guji-汤和-event-1
  - key: closure
    name: 墩堡烽传策应成
    labels:
      zh: 烽堠相望
    start_date: 1371
    highlight_event_id: guji-汤和-event-1
  decisions:
  - date: 1369
    title_zh: 采纳缘海设卫之议相度要冲
    rationale: 倭警屡发，非沿海建卫屯军立墩举烽不能首尾策应
  - date: 1370
    title_zh: 择浙直交关建金山卫并青村南汇
    rationale: 扼浙直交关与迤东要口，兼顾府城守御，使二百余载有所赖
- id: guji-汤和-endeavor-2
  title_zh: 年老再行海疆筑数十城而归
  summary: 春秋高乞骸骨赐第凤阳后，奉旨自闽越并海视要害筑城增兵以固守备，功成陛辞归居
  phases:
  - key: brewing
    name: 乞归赐第凤阳
    labels:
      zh: 乞骸骨
    start_date: 1388
    highlight_event_id: guji-汤和-event-2
  - key: climax
    name: 并海筑城增兵
    labels:
      zh: 筑城增兵
    start_date: 1389
    highlight_event_id: guji-汤和-event-2
  - key: closure
    name: 功成陛辞归居
    labels:
      zh: 归居凤阳
    start_date: 1390
    highlight_event_id: guji-汤和-event-2
  decisions:
  - date: 1388
    title_zh: 虽老奉诏再行视要害筑城
    rationale: 日本小夷屡扰滨海之民，虽春秋高不敢辞劳，只求要害增兵固守
  - date: 1389
    title_zh: 自闽越并海连筑数十城
    rationale: 沿海之地散漫无依，非连筑坚城增兵戍守不足以绝后患
