events:
- id: guji-汪从善-event-birth
  title_zh: 出生于婺
  date: '1275'
  year_of: 1275
  description_zh: 婺之著姓父徽国公汪斌以医进累迁太医院使年十三入见便殿世祖抚顶许以远大
- id: guji-汪从善-event-fengxi
  title_zh: 大德十一年先奉御宝至东宫
  date: '1307'
  year_of: 1307
  description_zh: 大德十一年上不豫储贰未定语同寅神器不宜久留中宫是夜舁宝至东宫门仁宗称为社稷臣武宗正位抱玺立上侧用玺如法赐四品服升宣德府知府
- id: guji-汪从善-event-songjiang
  title_zh: 特旨除松江府知府兼劝农
  date: '1317'
  year_of: 1317
  description_zh: 丁父艰服阕特旨除松江府知府兼劝农提调普庆寺钱粮戒县筑堤防水亲往率役是年秋大熟修西湖书塾置祭田旱岁祷雨大雨复稔
- id: guji-汪从善-event-nankang
  title_zh: 泰定元年转南康守多异绩
  date: '1324'
  year_of: 1324
  description_zh: 秩满因母乐莼鲈卜居城南泰定元年宰相奏为南康守多异绩会母丧还居松江以著书自晦
- id: guji-汪从善-event-death
  title_zh: 至正二年卒于松江里第
  date: '1342'
  year_of: 1342
  description_zh: 晚年貌魁梧气落落性刚介面折人过所著通鉴地理志考异生意斋笔录等力學不懈至正二年卒家无长物惟琴书祭器而已
