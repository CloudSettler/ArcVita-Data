  title_zh: 弘治壬戌進士授兵科給事中
  date: '1502'
  year_of: 1502
  description_zh: 弘治壬戌進士，選翰林庶吉士，授兵科給事中，後謫判亳州陞高淳知縣
- id: guji-王廷相-event-1508
  title_zh: 巡按山東陝西忤廖太監下獄謫贛榆丞
  date: '1508'
  year_of: 1508
  description_zh: 授御史巡按山東陝西，每事禁抑鎮守廖太監，為所構下獄，謫贛榆丞
- id: guji-王廷相-event-1513
  title_zh: 陞寧國知縣松江同知
  date: '1513'
  year_of: 1513
  description_zh: 起陞寧國知縣，歷松江同知，不事浮躁，撫字有聲
- id: guji-王廷相-event-1530
  title_zh: 歷官兵部尚書加太子少師
  date: '1530'
  year_of: 1530
  description_zh: 累歷至兵部尚書，加太子少師，以大識大氣大德自盟，論權紀綱人才繫國命
- id: guji-王廷相-event-death
  title_zh: 卒于京
  date: '1544'
  year_of: 1544
  description_zh: 明嘉靖二十三年卒，遺言權紀綱人才為國命所主，有識書之座右
