  birth_date: '1483'
  death_date: '1544'
  era: 明
  reign_ref: 明弘治至嘉靖
  archetype: 直臣能吏
  dilemmas:
  - 巡按禁抑鎮守太監招恨下獄，與曲從保身之間抉擇守正
  - 貶判亳州謫丞贛榆沉淪下僚，與趨附權要求速進之間抉擇持重
  lesson: 大識者外偽不能累，大氣者外侮不能動，大德者外物不能遷，權紀綱人才繫國之存亡
  summary_first_person: 吾儀封王廷相，弘治壬戌進士，歷兵科給事中御史，巡按山東陝西，禁抑鎮守廖太監而下獄謫贛榆，後起寧國知縣松江同知，終至兵部尚書加太子少師，平生不事浮躁，以識氣德自盟
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%B4%87%E7%A5%AF%E6%9D%BE%E6%B1%9F%E5%BA%9C%E5%BF%97%E7%94%B2/%E5%8D%B732.html
endeavors:
- id: guji-王廷相-endeavor-1
  title_zh: 科道巡按抗閹直節
  summary_zh: 由庶吉士授兵科給事中，巡按山東陝西，裁抑鎮守太監，下獄謫贛榆而不屈
  phases:
  - key: brewing
    name: 翰林給事養望
    labels:
      zh: 弘治進士給事
    start_date: '1502'
    highlight_event_id: guji-王廷相-event-1502
  - key: breakthrough
    name: 巡按山陝禁抑
    labels:
      zh: 巡按裁抑鎮守
    start_date: '1506'
    highlight_event_id: guji-王廷相-event-1508
  - key: climax
    name: 忤廖下獄貶謫
    labels:
      zh: 下獄謫贛榆丞
    start_date: '1508'
    highlight_event_id: guji-王廷相-event-1508
  - key: closure
    name: 守正待白起復
    labels:
      zh: 貶處守正
    start_date: '1510'
    highlight_event_id: guji-王廷相-event-1513
  decisions:
  - date: '1506'
    title_zh: 每事禁抑鎮守太監
    rationale: 以紀綱繫國脈，不容中官撓法，故力裁其請托侵漁
  - date: '1508'
    title_zh: 下獄不屈謫丞不附
    rationale: 窮通命也，守道不阿，寧為赣榆丞不以賄謝權閹
- id: guji-王廷相-endeavor-2
  title_zh: 守令親民終秉樞
  summary_zh: 歷亳州高淳寧國松江，撫字不尚浮躁，終為兵部尚書太子少師，以人才紀綱立言
  phases:
  - key: brewing
    name: 州縣親民歷練
    labels:
      zh: 亳州高淳寧國
    start_date: '1510'
    highlight_event_id: guji-王廷相-event-1513
  - key: breakthrough
    name: 寧國松江同知惠政
    labels:
      zh: 松江同知不浮躁
    start_date: '1513'
    highlight_event_id: guji-王廷相-event-1513
  - key: climax
    name: 歷官兵部尚書
    labels:
      zh: 兵部尚書少師
    start_date: '1530'
    highlight_event_id: guji-王廷相-event-1530
  - key: closure
    name: 立言垂訓以終
    labels:
      zh: 三不亡垂訓
    start_date: '1544'
    highlight_event_id: guji-王廷相-event-death
  decisions:
  - date: '1513'
    title_zh: 守松江寧國不事浮躁
    rationale: 治在安民養本，戒俗儒鄙儒迂儒之失，故持重撫字
  - date: '1530'
    title_zh: 以權紀綱人才論國命
    rationale: 國之不亡在權不下移，紀綱不隳，不用小人，故以此自盟示後
events:
