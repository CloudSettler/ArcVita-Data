    title_zh: 先祭而後役以安眾心
    rationale: 蘇秀之人皆云神故有廟在江涘不祭則民疑故躬告以主蓄洩
  - date: 1038
    title_zh: 許修復祠貌以報靈貺
    rationale: 若水患得弭即嚴督郡縣修復棟宇以昭報而垂久遠
events:
- id: guji-葉清臣-event-birth
  title_zh: 出生於蘇州長洲
  date: 1008
  year_of: 1008
  place_zh: 蘇州長洲
  description_zh: 大中祥符元年生後登進士第歷館閣以文學政事顯
- id: guji-葉清臣-event-panlong
  title_zh: 以轉運副使開松江盤龍匯
  date: 1038
  year_of: 1038
  place_zh: 華亭崑山間盤龍匯
  description_zh: 寶元元年以兩浙轉運副使建議釃盤龍匯為新渠從滬瀆入海直流速水患遂弭乾興以來屢疏未得其要至是乃成
- id: guji-葉清臣-event-sacrifice
  title_zh: 祭滬瀆龍王文告興工
  date: 1038
  year_of: 1038
  place_zh: 滬瀆龍王廟江涘
  description_zh: 躬行按視作祭文告神求無風雪無瘥癘舉臿土潰決渠水降即修復祠貌春秋蘋藻如故
- id: guji-葉清臣-event-death
  title_zh: 卒於皇祐元年
  date: 1049
  year_of: 1049
  place_zh: 京師
  description_zh: 歷三司使翰林學士以疾卒平生經度水利之功吳人稱開一江有一江之利之先聲
