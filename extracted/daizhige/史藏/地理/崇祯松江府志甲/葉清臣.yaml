    start_date: 1043
    highlight_event_id: guji-葉清臣-event-3
  - key: climax
    name: 皇祐對備邊策
    labels:
      zh: 高潮
    start_date: 1049
    highlight_event_id: guji-葉清臣-event-4
  - key: closure
    name: 集文百六十卷慮深
    labels:
      zh: 收束
    start_date: 1049
    highlight_event_id: guji-葉清臣-event-4
  decisions:
  - date: 1043
    title_zh: 創合同檢革內取索
    rationale: 內東門御廚取索有司不敢問歲費百萬唯合同驗支出納戶部驅磨方有中制
  - date: 1049
    title_zh: 對便殿薦用邊才
    rationale: 不患無人患有人而不能用當以富弼范仲淹韓琦等分任輔翊將帥偏裨方固社稷
events:
- id: guji-葉清臣-event-birth
  title_zh: 出生於長洲
  date: 1000
  year_of: 1000
  description: 葉清臣字道卿長洲人弱冠以策擢高等自清臣始
- id: guji-葉清臣-event-1
  title_zh: 授奉禮郎知秀州
  date: 1025
  year_of: 1025
  description: 宋進士授太常寺奉禮郎旋知秀州見並太湖民田豪右據上游水不得泄
- id: guji-葉清臣-event-2
  title_zh: 任兩浙轉運副使疏盤龍匯滬瀆
  date: 1038
  year_of: 1038
  description: 寶元初為兩浙轉運副使請疏盤龍匯開鑿新渠道直流速又建議疏滬瀆入於海人賴其利其患遂弭
- id: guji-葉清臣-event-3
  title_zh: 為三司使立合同檢內取索
  date: 1043
  year_of: 1043
  description: 仁宗朝為三司使以合同檢內東門御廚出入憑此取金銀錢帛於戶部年終驅磨以制濫取
- id: guji-葉清臣-event-4
  title_zh: 皇祐初對備邊之策
  date: 1049
  year_of: 1049
  description: 皇祐初帝御便殿訪備邊之策上對薦富弼范仲淹夏竦鄭戩韓琦田况劉渙孫沔王德用龐籍狄青等分任將相另陳九議十要五利有文集百六十卷
- id: guji-葉清臣-event-death
  title_zh: 逝世
  date: 1049
  year_of: 1049
  description: 皇祐元年卒平生天資爽邁遇事敢行所論皆當世可行者
