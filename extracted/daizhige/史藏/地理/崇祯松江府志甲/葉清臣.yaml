    name: 水患弭民賴利
    labels:
      zh: 收束
    start_date: 1039
    highlight_event_id: guji-葉清臣-event-2
  decisions:
  - date: 1038
    title_zh: 決請疏盤龍匯開直渠
    rationale: 豪右據上游水不得泄民莫敢訴匯曲水迂滯唯開鑿新渠道直流速方弭患
  - date: 1038
    title_zh: 建議疏滬瀆入於海
    rationale: 既治盤龍仍須導下流唯疏滬瀆入海方暢泄太湖永利吳淞
- id: guji-葉清臣-endeavor-2
  title_zh: 三司經制與備邊建言
  summary: 天資爽邁數上九議十要五利為三司使以合同檢內東門取索皇祐初對便殿備邊之策薦用文武賢才
  phases:
  - key: brewing
    name: 策高第數上書
    labels:
