    title_zh: 作積慶寺後宅建禪堂疏
    rationale: 先伯故廬即給孤初地梵鐘到枕似得皈依勃谿度垣殊妨晏坐故首倡金湯勸同志捐杖頭錢展袈裟地
  - date: 1629-01-01
    title_zh: 作坐化菴興復疏明壽堂肉身本末
    rationale: 江南列剎無稱坐化菴者惟積慶有元壽堂祖師肉身三百年靈老巋若不忍視其傾圮故證功德起信勸修
