events:
- id: guji-陆机-event-birth
  title_zh: 生于吴郡华亭
  date: '0261'
  year_of: 261
  place_zh: 吴郡华亭
  description_zh: 陆逊之后，陆抗之子，生于华亭陆氏，后世以陆机茸五茸为其游猎读书之地
- id: guji-陆机-event-bianwang
  title_zh: 作辩亡论上下二篇
  date: 0280
  year_of: 280
  place_zh: 洛阳
  description_zh: 吴亡后论孙吴兴亡得失，文章典雅，为晋代史论名篇
- id: guji-陆机-event-ruluo
  title_zh: 与陆云入洛见张华
  date: 0290
  year_of: 290
  place_zh: 洛阳
  description_zh: 太康末入洛，张华奇其才，名噪一时，与潘岳并称，时人谓太康之英
- id: guji-陆机-event-heqiao
  title_zh: 河桥兵败
  date: '0303'
  year_of: 303
  place_zh: 河桥
  description_zh: 为成都王司马颖河北大都督，率军讨长沙王司马乂，军心不一，临阵溃败
- id: guji-陆机-event-death
  title_zh: 被谗遇害于军中
  date: '0303'
  year_of: 303
  place_zh: 邺下军中
  description_zh: 兵败后为孟超等所谗，与陆云同被杀，故乡华亭聚土为黄耳冢传其忠信之犬故事
