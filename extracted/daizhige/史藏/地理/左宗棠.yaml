    highlight_event_id: guji-左宗棠-event-1878-kefu-dihua
  decisions:
  - date: 1876-04-01
    title_zh: 坚持先北后南缓进急战
    rationale: 北路近而粮易集，先复迪化呼图壁可断逆援，再图南疆，免两线糜饷
  - date: 1878-03-01
    title_zh: 令驻军屯垦护民壁垒
    rationale: 呼城残破汉民壁垒尚存，驻洛克伦马桥子筑城护卫，以兵护垦，以垦养兵
- id: guji-左宗棠-endeavor-2
  title_zh: 赈济安集呼图壁遗黎复垦
  goal_zh: 赈济饥黎并发耕牛籽种，开渠设塾丈地垦荒，使流亡复集
  phases:
  - key: brewing
    name: 王瑜圃请赈核实户口荒情
    labels:
      zh:
      - 请赈核灾
    start_date: 1877-03-01
    highlight_event_id: guji-左宗棠-event-1877-zhenji-hutubi
  - key: breakthrough
    name: 批准赈济发牛籽苏民命
    labels:
      zh:
      - 发赈给牛种
    start_date: 1877-05-01
    highlight_event_id: guji-左宗棠-event-1877-zhenji-hutubi
  - key: climax
    name: 督饬驱蝗开渠豁免额征
    labels:
      zh:
      - 驱蝗开渠
    start_date: 1878-06-01
    highlight_event_id: guji-左宗棠-event-1878-kefu-dihua
  - key: closure
    name: 留任能吏丈地垦荒设塾
    labels:
      zh:
      - 留吏垦荒
    start_date: 1881-01-01
    highlight_event_id: guji-左宗棠-event-1878-kefu-dihua
  decisions:
  - date: 1877-05-01
    title_zh: 批准发耕牛九十九对籽麦三百十七石
    rationale: 遗黎不满十户皆饥困不自存，非急赈老弱并发牛种则招徕无本，民命不苏
  - date: 1881-06-01
    title_zh: 赞同留任江景曜不准交卸
    rationale: 招徕渐集丈地垦荒方始，草率交卸前功尽弃，留署以责成效并示鼓励
