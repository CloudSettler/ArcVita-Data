  dilemmas:
  - 漕舟本以利国今乃滋病当因循旧贯还是考典立制
  - 承事者寡食粟者众当多造漕舟还是节省糜费
  lesson: 考典立制以裕国计，节用任人以苏军民，文献有征则经久可行
  summary_first_person: 吾遂宁席书，弘治进士，尝承命领清江船厂，考建置沿革，采故典耆旧，编次漕船志一编，冀南北形势漕运规模概见，备会典之助，复以大礼事君，惟愿国计充裕漕病永瘳云
