  dilemmas:
  - 澉水斗大一隅素乏图经当博采闻见成编还是因陋就简听其散佚
  - 初稿既成镇官屡易无人问刊当弃置旧稿还是逾年订正以待知音
  lesson: 一镇虽小不可无志守稿二十七年以待刊刻则文献不坠
  summary_first_person: 余竹窗常棠字召仲寓居海盐澉浦镇绍定三年应镇尹罗叔韶之属搜访舆理编成澉水志逾多政订正益详后遇权镇孙君割俸募镌水军袁统制捐梓而成书幸志得传
