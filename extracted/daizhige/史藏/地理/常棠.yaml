    start_date: 1257
    highlight_event_id: guji-常棠-event-1257-publish
  decisions:
  - date: 1256
    title_zh: 以旧稿付孙君镌行
    rationale: 孙君公谨廉敏明烛隐幽虽镇场废坏非畴曩比犹能趋办自足故托刊以传一方
  - date: 1257
    title_zh: 作序记刊刻本末
    rationale: 书不刊于镇税全盛之前而刊于凋弊之后可嘉当书其遇如李吉甫志待张公刻于襄阳故事
events:
- id: guji-常棠-event-birth
  title_zh: 常棠出生
  date: 1190
  year_of: 1190
  place_zh: 两浙嘉兴府一带
  description_zh: 常棠字召仲号竹窗约生于南宋光宗绍熙年间后寓居海盐澉浦镇
- id: guji-常棠-event-1230-entrust
  title_zh: 罗叔韶属撰澉水志
  date: 1230-09-08
  year_of: 1230
  place_zh: 海盐澉浦镇
  description_zh: 绍定三年重阳前一日监澉浦镇税兼烟火公事罗叔韶以郡邑志载澉水甚略属寓居是镇之常棠讨论闻见缀缉成编名曰澉水志
- id: guji-常棠-event-1237-revise
  title_zh: 逾政订正志稿益详
  date: 1237
  year_of: 1237
  place_zh: 海盐澉浦镇
  description_zh: 罗仪甫满去逾七八政常棠不废旧稿因岁既久订正尤详备载地理山水廨舍坊巷学校寺庙古迹物产及碑记诗咏
- id: guji-常棠-event-1257-publish
  title_zh: 澉水志得刊行
  date: 1257
  year_of: 1257
  place_zh: 海盐澉浦镇
  description_zh: 后二十七祀权镇孙君割已俸售募镌行水军袁统制捐梓料赞成常棠作序记其本末志遂镂板流传
- id: guji-常棠-event-death
  title_zh: 常棠去世
  date: 1260
  year_of: 1260
  place_zh: 海盐澉浦镇一带
  description_zh: 常棠于澉水志刊行后不久去世约在南宋理宗景定年间前后竹窗遗文以志传
