  reign_ref: 弘治
  archetype: 文苑义士
  dilemmas:
  - 救友仗义则忤权阉而丧官守义，缄默自保则负心交而全禄位
  - 归隐著述则远朝堂而存乡邦文献，出仕徘徊则蹈险阱而失初心
  lesson: 为友仗义不避祸患，削籍不悔，以笔存史，以志传乡，立身在义而不在位
  summary_first_person: 吾康海，字德涵，陕西武功人，弘治壬戌进士第一，授翰林修撰，因救李梦阳忤刘瑾而削籍归里，屏居著述，撰武功县志七篇以纪山川建置祠祀田赋官师人物选举，文简事核，冀以劝鉴来者
  source_urls:
