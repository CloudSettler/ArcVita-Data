  lesson: 以文治彰山川灵秀，以制度成志乘体要，游观览胜亦当存绳武自警之心
  summary_first_person: 吾于雍正年间奉命谒陵往来蓟野已望见盘山，践阼四年后始一游，遂发内帑建静寄山庄，岁谒陵辄驻跸，命蒋溥等纂新志而为之序，欲使田盘改观以承祖武
