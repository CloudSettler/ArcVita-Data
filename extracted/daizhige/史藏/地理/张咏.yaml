    highlight_event_id: guji-张咏-event-3
  decisions:
  - date: '1835'
    title_zh: 详记倮罗与负物筑城之法
    rationale: 亲见妇女裹首贸易舁舆服牛及额负大木巨石，又见郡邑以巨石灌桐油石灰筑城，故详录以存边地民情工法
  - date: '1840'
    title_zh: 亲莅大理三月街纵观贸易
    rationale: 夷苗土司咸集珍宝翡翠象牙孔雀麝麂等货与人以万计，故备录品类以见滇西商贸之盛
- id: guji-张咏-endeavor-2
  person_qid: guji-张咏
  title_zh: 撰述云南风土记十三条
  summary: 将滇中见闻及考证编为短札十三条，记花木水产摩崖鸟吊，流传于小方壶斋舆地丛钞本
  phases:
  - key: brewing
    name: 随笔札记
