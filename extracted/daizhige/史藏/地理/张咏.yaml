    start_date: '1842'
    highlight_event_id: guji-张咏-event-3
  - key: climax
    name: 编定十三条
    labels:
      zh: 编定
    start_date: '1843'
    highlight_event_id: guji-张咏-event-3
  - key: closure
    name: 传钞流布
    labels:
      zh: 流传
    start_date: '1845'
    highlight_event_id: guji-张咏-event-3
  decisions:
  - date: '1842'
    title_zh: 引宋诗纪事考洱河摩崖
    rationale: 玉案山摩崖此水可当兵百万语不知所云，查梅磵诗话李钰浮远堂联语相合，故考其移刻之由以正流传
  - date: '1843'
    title_zh: 仅录十三条以存精要
    rationale: 滇中物产风俗浩繁难尽，择其最异于吾乡者如翠核桃绣球、螺蛳白浆、鸟吊山等编次成帙，贵精不贵多
events:
- id: guji-张咏-event-birth
  person_qid: guji-张咏
  type: birth
  title_zh: 太仓出生
  date: '1800'
  year_of: 1800
  description: 清代江苏太仓人，家世生年不详，少习文史，后宦游远方
- id: guji-张咏-event-1
  person_qid: guji-张咏
  type: career
  title_zh: 踏察滇中民俗物产
  date: '1835'
  year_of: 1835
  description: 居云南，察倮罗男女畜发赤足妇女裹首贸易之俗，又记以棕索额负之法及以巨石灌桐油石灰筑城之坚，兼观琥珀含虫与桂梅花果之异
- id: guji-张咏-event-2
  person_qid: guji-张咏
  type: career
  title_zh: 大理观三月街贸易盛会
  date: '1840-03-15'
  year_of: 1840
  description: 每年三月中旬往大理西门外点苍山麓，观夷苗倮罗土司部落延袤数里贸易宝石琥珀翡翠车渠缅锡象牙孔雀锦鸡等，提督拨兵逻守
- id: guji-张咏-event-3
  person_qid: guji-张咏
  type: career
  title_zh: 撰成云南风土记十三条
  date: '1843'
  year_of: 1843
  description: 将滇中见闻编为十三条，记绣球翠核桃、梅桂、洱河工鱼蟛蜞螺蛳羹、黄果柚子佛手金沙江瓜、玉案山摩崖考、浪穹凤羽山鸟吊山奇闻，唯见于小方壶斋舆地丛钞本
- id: guji-张咏-event-death
  person_qid: guji-张咏
  type: death
  title_zh: 逝世
  date: '1860'
  year_of: 1860
  description: 晚年行迹不详，卒年不详，遗书云南风土记十三条传世
