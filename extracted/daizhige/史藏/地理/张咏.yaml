- id: guji-张咏-endeavor-1
  person_qid: guji-张咏
  title_zh: 宦游滇中踏察民物风俗
  summary: 久居云南，踏察倮罗民俗、额负筑城、山川物产与市集贸易，积累第一手见闻
  phases:
