    labels:
      zh: 踏察
    start_date: '1835'
    highlight_event_id: guji-张咏-event-1
  - key: climax
    name: 大理观三月街盛市
    labels:
      zh: 观察
    start_date: '1840'
    highlight_event_id: guji-张咏-event-2
  - key: closure
    name: 汇集见闻成稿
    labels:
