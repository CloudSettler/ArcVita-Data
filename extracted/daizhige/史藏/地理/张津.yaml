  decisions:
  - date: 1167
    title_zh: 因旧图经重加增订
    rationale: 景德大观旧本搜采未备，须补郡守姓名山水祠庙人物以全都会郡县之体
  - date: 1168
    title_zh: 分郡县各立门目
    rationale: 明州不置倚郭县，州县各领疆土，故总叙居首，六县各为专卷，不相混淆
- id: guji-张津-endeavor-2
  title_zh: 守四明兴学水利存古迹
  summary: 以郡守兼领沿海之地，留意学校御书水利古迹贤守事实，采集碑刻史传，以实图经九门之内容
  phases:
