    rationale: 唐人郊居多在韦曲樊川，欲就园亭主人问旧闻以补志乘之阙
- id: guji-张礼-endeavor-2
  title_zh: 撰游城南记并加注考证
  summary_zh: 以日记为经，以张注考唐坊里寺塔陵墓沿革，订正长安志之误，使后人可按图而求
  phases:
  - key: brewing
