  - date: 1086-04-07
    title_zh: 于曲江乐游发黍离之叹仍详其泉渠来去
    rationale: 虽宫殿鞠为茂草，犹记黄渠鲍陂水道，冀后世可复其旧观
  - date: 1086-05-01
    title_zh: 以注疏正本事并存异说
    rationale: 唐坊改名寺塔重建陵墓迁移皆易淆，故引志传碑刻以考地里沿革
events:
- id: guji-张礼-event-birth
  title_zh: 张礼出生
  date: 1045
  year_of: 1045
  place_zh: 京兆一带
  summary_zh: 约北宋庆历间出生，长而好古，习闻长安掌故
- id: guji-张礼-event-tour-start
  title_zh: 元祐改元季春出游城南
  date: 1086-04-07
  year_of: 1086
  place_zh: 京兆东南门外兴道务本坊圣容院荐福寺塔
  summary_zh: 与明微茂中同出安上门，历兴道务本二坊，入圣容院观荐福寺塔，南行至永乐坊草场坡
- id: guji-张礼-event-cien-qujiang
  title_zh: 登慈恩塔观曲江乐游
  date: 1086-04-07
  year_of: 1086
  place_zh: 慈恩寺大雁塔曲江乐游原杏园芙蓉园
  summary_zh: 登慈恩塔观唐人留题，下瞰曲江宫殿皆为野草，过杏园芙蓉园杜祁公家庙，出启夏门览南郊三坛
- id: guji-张礼-event-weiqu-fanchuan
  title_zh: 游韦曲樊川访韩郑郊居范公五居
  date: 1086-04-08
  year_of: 1086
  place_zh: 韦曲申店神禾原朱坡华岩寺澄襟院
  summary_zh: 循清明渠至皇子坡，览韩愈郑谷郊居，宿申店李氏园，游韦氏会景堂，涉潏水游范公五居，上朱坡憩华岩寺，宿澄襟院
- id: guji-张礼-event-shaoling-return
  title_zh: 历杜曲兴教至少陵原归
  date: 1086-04-11
  year_of: 1086
  place_zh: 杜曲兴教寺少陵原司马村三像院
  summary_zh: 过延兴寺杜曲杜固，上兴教寺玉峰轩，抵韦赵览牛僧孺郊居，登少陵原穿三像院，暮归孙中复庐，次日渡潏水观乾湫涂山寺而还
- id: guji-张礼-event-book-complete
  title_zh: 游城南记撰成
  date: 1086-05-01
  year_of: 1086
  place_zh: 京兆
  summary_zh: 以游程为记，益以考证注文，详唐京城坊市寺塔陵墓水渠变迁，遂成一家城南掌故
- id: guji-张礼-event-death
  title_zh: 张礼去世
  date: 1108
  year_of: 1108
  place_zh: 京兆一带
  summary_zh: 约北宋大观间去世，其记赖后人续注传抄而存，为研究唐宋长安城南要籍
