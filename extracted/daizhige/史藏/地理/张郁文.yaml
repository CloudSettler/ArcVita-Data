  dilemmas:
  - 山水形胜易堙而碑刻诗文散佚何以兼收并存
  - 志山水恐流于游观志寺院恐流于宗门何以得其实
  lesson: 亲履其地博采碑诗而后山有魂寺有据一方之胜乃可传远
  summary_first_person: 吾乃张郁文吴中人也少见邓尉梅雪如海壮游玄墓铜井青芝弹山诸峰又览光福讲寺圣恩禅寺碑刻恐胜景湮没故考山脉源流辑古今诗文成光福诸山记以存一方文献
