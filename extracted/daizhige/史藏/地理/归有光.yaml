    start_date: '1555'
    highlight_event_id: guji-归有光-event-shangshu
  - key: climax
    name: 与知县彭富论水亲董全吴乡工
    labels:
      zh: 亲历董工
    start_date: '1558'
    highlight_event_id: guji-归有光-event-quanwuxiang
  - key: closure
