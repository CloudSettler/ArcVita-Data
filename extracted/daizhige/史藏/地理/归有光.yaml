  - date: '1553'
    title_zh: 作三江说辨三江口
    rationale: 吴淞江下三江口淤塞众说纷纭，须原禹迹考松娄东江以定导河之向
  - date: '1560'
    title_zh: 作水利论前后论专官治水
    rationale: 水利废弛在无人任责，欲以论说明水性水官之要以劝当道
