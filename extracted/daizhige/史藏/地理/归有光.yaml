  title_zh: 志嘉祐大徳天顺开吴淞江事
  date: '1565'
  year_of: 1565
  place_zh: 苏州
  description: 追志宋嘉祐元祐及元大徳国朝天顺开江旧绩，明开江利害以资後鉴
- id: guji-归有光-event-death
  title_zh: 卒于京师官舍
  date: '1571'
  year_of: 1571
  place_zh: 京师
  description: 明隆庆五年卒，後人辑其水利论说志序入吴中水利全书传世
