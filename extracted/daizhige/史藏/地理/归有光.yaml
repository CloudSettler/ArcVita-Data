  title_zh: 上书郡邑襄助昆山地方濬河
  summary: 上书兵道府县论昆山水利，志全吴乡濬河实绩，助地方兴筑圩岸沟洫
  phases:
  - key: brewing
    name: 寓居昆山察田野水患
