    highlight_event_id: guji-归有光-event-quanwuxiang
  decisions:
  - date: '1555'
    title_zh: 上苏州府知府王仪及昆山令论水利
    rationale: 昆山枕湖带海，圩田易涝，非濬浦置闸筑塘不可救，须劝郡邑主持
  - date: '1558'
    title_zh: 襄助全吴乡濬河记其成
    rationale: 空言不如实绩，亲验河工经费夫役之法，志之以垂后式
events:
