    highlight_event_id: guji-施烺-event-penghu
  decisions:
  - date: 1683-06-22
    title_zh: 乘雾偃旗直入不举炮
    rationale: 火器彼所长闻声寻击我不能敌乘雾不辨直趋中坚短兵相接可惊乱取胜
  - date: 1683-06-23
    title_zh: 纵遣八百创残归台传谕
    rationale: 使父母妻子相见展转相告则伪将士争欲自投禁不能止不战而解散其心
- id: guji-施烺-endeavor-2
  title_zh: 招抚台湾纳土设郡县
  description_zh: 乘胜索军资整备以要刘冯亲至纳土献版籍剃发内徙亲渡海行定新附地置郡县如内地
  phases:
