  archetype: 海疆统帅
  dilemmas:
  - 盛暑南风不利行师而督臣严趣三易师期进退两难
  - 澎湖泊地非旧汛处潮汐叵测稍失即舟碎沙上
  - 火炮铅丸不如贼利而大雾中当舍长就短以死战
  - 台湾港道纡回当乘胜急击还是俟北风再进
  lesson: 审潮汐雾候以决战以恩信纵降以瓦解人心则远岛可一举而定
  summary_first_person: 我是施烺受命平台冒暑自铜山举帆至澎湖乘大雾大潮直捣中坚大破刘国轩纵遣降卒传谕招抚使郑克塽纳土剃发亲渡海定新附地而台湾入版图授靖海将军世袭罔替
