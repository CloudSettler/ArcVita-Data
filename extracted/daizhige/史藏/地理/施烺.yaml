  decisions:
  - date: 1683-07-08
    title_zh: 要刘国轩冯锡范亲身纳土剃发内徙
    rationale: 必亲至献版籍遵制剃发举家内徙方可防反复而一劳永逸
  - date: 1683-08-15
    title_zh: 亲渡海行定新附地代奏安插
    rationale: 绝域初附曲折未定身往履勘代请就近安插置郡县如内地始可久安
events:
- id: guji-施烺-event-birth
  title_zh: 晋江诞生习谙海事
  date: 1621
  year_of: 1621
  place_zh: 福建晋江
  description_zh: 明天启元年生于晋江娴习海道后以提督受命平台
- id: guji-施烺-event-death
  title_zh: 卒于京师世袭靖海将军
  date: 1696
  year_of: 1696
  place_zh: 京师
  description_zh: 康熙三十五年卒前以平台功授靖海将军世袭罔替
- id: guji-施烺-event-junji
  title_zh: 铜山禡牙举帆至澎湖外岛
  date: 1683-06-10
  year_of: 1683
  place_zh: 铜山澎湖外岛
  description_zh: 合提标及兴化平阳铜山金门海坛厦门诸镇数万人舳舻数百自铜山南向初十日至澎湖外岛非向来屯驻地相守十二日潮不至
- id: guji-施烺-event-penghu
  title_zh: 大雾澎湖决战大破刘国轩
  date: 1683-06-22
  year_of: 1683
  place_zh: 澎湖娘娘宫外洋
  description_zh: 天忽大雾乘潮骤涌分舟左右冲锋偃旗卧鼓鱼贯入钩连贼舟腾跃短兵纵火自巳至未杀焚溺万二千刘国轩以数舸逸朱天贵战死杨瑞率官兵四千余降梦观音授水一桶而验
- id: guji-施烺-event-zhaofu
  title_zh: 七月受降晓谕剃发向化
  date: 1683-07-16
  year_of: 1683
  place_zh: 澎湖军前台湾
  description_zh: 郑克塽遣郑平英等赍降表至要三事复遣刘国昌冯锡韩等悉如约留质遣吴启爵等赍告示渡海台湾军民投戈剃发何佑等撤防效顺
- id: guji-施烺-event-dingtai
  title_zh: 缴伪印籍土渡海定地设郡县
  date: 1683-08-15
  year_of: 1683
  place_zh: 台湾赤嵌城
  description_zh: 克塽奏缴伪延平王印册武平侯忠诚伯印尽籍境土户口为图以献举族内徙施烺亲渡海行定新附地授靖海将军刘国轩授天津提督克塽赦罪居京师台湾置郡县如内地
