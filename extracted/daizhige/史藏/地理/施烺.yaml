    start_date: 1683-07-01
    highlight_event_id: guji-施烺-event-zhaofu
  - key: climax
    name: 要三事晓谕剃发
    labels:
      zh: 要约剃发
    start_date: 1683-07-16
    highlight_event_id: guji-施烺-event-zhaofu
