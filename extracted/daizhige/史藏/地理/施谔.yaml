    rationale: 长安旧制不足法须以行都实迹为纲故分三卷叙城府
  - date: '1248'
    title_zh: 旧治古迹与今治续建并列
    rationale: 凤凰山吴山沿革可考盛衰故存虚白堂中和堂有美堂诸目以见迁变
- id: guji-施谔-endeavor-2
  title_zh: 撰述山川江潮湖河体系
  summary: 以城内外诸山岭洞石坞峪关与浙江西湖河渠水闸为纲考陵谷水陆之变
