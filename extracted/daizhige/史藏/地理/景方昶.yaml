endeavors:
- id: guji-景方昶-endeavor-1
  title_zh: 考订金上京会宁府在阿什河畔白城
  summary: 辨盛京通志等沿明一统志之误证会宁即阿勒楚喀河南白城
  phases:
  - key: brewing
    name: 疑宁古塔之说博采旧志
    labels:
      zh: 酝酿疑辨
    start_date: 1825-01-01
    highlight_event_id: guji-景方昶-event-huining-kaozheng
  - key: breakthrough
    name: 以按出虎水即阿什河为突破
    labels:
      zh: 考水定地
    start_date: 1832-01-01
    highlight_event_id: guji-景方昶-event-huining-kaozheng
  - key: climax
    name: 以太祖进军次第与世宗幸上京日历证成
    labels:
      zh: 证成会宁
    start_date: 1835-01-01
    highlight_event_id: guji-景方昶-event-huining-kaozheng
  - key: closure
    name: 成卷一金上京会宁府考
    labels:
      zh: 著述收束
    start_date: 1840-01-01
    highlight_event_id: guji-景方昶-event-zhushu
  decisions:
  - date: 1832-06-01
    title_zh: 断按出虎水即今阿勒楚喀河
    rationale: 以今土名阿什河音转相合白城在其西遗址犹存故不从色齐窝集之说
  - date: 1835-03-01
    title_zh: 引金太祖伐辽与大定幸上京行程为据
    rationale: 由伯都讷宁江至白城道里四日可至若在宁古塔则千里不合故定会宁为白城
- id: guji-景方昶-endeavor-2
  title_zh: 释金史上京路蒲与合懒等五路及撰东北舆地释略
  summary: 疏蒲与合懒恤品曷苏馆胡里改五路疆域成东北舆地释略四卷
  phases:
  - key: brewing
    name: 稽金史地理志阙略搜集本纪列传
    labels:
      zh: 酝酿搜讨
    start_date: 1836-01-01
    highlight_event_id: guji-景方昶-event-wulu-kaoshi
  - key: breakthrough
    name: 以道里音变定蒲与合懒恤品方位
    labels:
      zh: 定位五路
    start_date: 1838-01-01
    highlight_event_id: guji-景方昶-event-wulu-kaoshi
  - key: climax
    name: 辨黄龙府宾州肇州及涞流来流之别
    labels:
      zh: 辨析附地
    start_date: 1842-01-01
    highlight_event_id: guji-景方昶-event-wulu-kaoshi
  - key: closure
    name: 汇为东北舆地释略四卷成书
    labels:
      zh: 成书收束
    start_date: 1845-01-01
    highlight_event_id: guji-景方昶-event-zhushu
  decisions:
  - date: 1838-08-01
    title_zh: 以南至上京道里定蒲与在齐齐哈尔一带
    rationale: 蒲与南至上京六百七十里与白城相合若从宁古塔则方向道里皆乖故正之
  - date: 1842-04-01
    title_zh: 别涞流河与来流拉林水为二水
    rationale: 辽上京涞流绕临潢三面即洮儿河金会宁来流即拉林河字同音通而实别故特辨之
