  dilemmas:
  - 旧志皆以宁古塔当金上京会宁府是否当从众说还是据山川道里正其谬误
  - 金史上京路五路四至阙略是否阙疑还是参以舆图古今音变疏其大略
  lesson: 治地理当核山水程途参证史志不徇旧志之误
  summary_first_person: 吾为贵州兴义景方昶躬逢清世留意东北舆地疑会宁在宁古塔之说遂稽金史辽志参以山川道里作东北舆地释略以正旧志之失
