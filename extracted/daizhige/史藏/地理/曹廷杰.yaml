  decisions:
  - date: 1887-03-01
    title_zh: 以经纬度数为纲山水为目
    rationale: 旧图奉吉交界及松花江水道多不相接，必准经纬方隅里到始合
  - date: 1890-01-01
    title_zh: 详注古今沿革险要
    rationale: 筹边聚米非可臆谭，必辨开元开原扶余黄龙五国伯利诸地以知依据
