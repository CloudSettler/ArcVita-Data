  dilemmas:
  - 屡试场屋不遇是坚守举业还是以例就教谕散秩
  - 老母笃老是远涉重洋赴凤山还是守里以尽孝
  - 海外见闻淆杂无序是随手散佚还是编次成志以传荒徼
  lesson: 以诗骚写胜景以考订存方俗使圣治无外而荒徼可知
  summary_first_person: 吾少以异等贡国学屡困场屋以明经官德化蒙恩调凤山泛海至台追记道涂闻见成小琉球漫志十卷以彰海外之奇
