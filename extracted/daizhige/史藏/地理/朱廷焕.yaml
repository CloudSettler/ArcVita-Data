    rationale: 补入诗什以存风流末志灾伤使知靡侈过甚足招天谴
  - date: '1640'
    title_zh: 直著周公谨之名不作子虚
    rationale: 四水潜夫即著癸辛杂识之周密别号弁阳老人不欲使后人疑揣故直著其名
