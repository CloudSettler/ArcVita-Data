  lesson: 有武林之侈即有厓山之变当以节俭持盈使武林常为乐邦
  summary_first_person: 余朱廷焕字中白单县人崇祯甲戌进士以工部主事司榷杭州得四水潜夫旧事暇时披寻湖山诸志增补阙略益六卷为八卷补诗什以存风流志灾异以示儆戒
