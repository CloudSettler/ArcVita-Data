  summary_first_person: 我是朱彝尊，浙江秀水人，幼逢鼎革，壮年北游京师，见帝都掌故散佚，遂策屐登临，按图索访，捃拾千六百种载籍及金石碑版，分十三门为日下旧闻四十二卷，康熙二十七年成书，欲以实证存旧闻，以亲验正传闻，晚年曝书藤屋，愿后人补阙订讹而已
