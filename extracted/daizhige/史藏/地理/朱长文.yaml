  summary_first_person: 吾苏州人字伯原未冠登进士乙科以足疾不仕杜门著述受临淄晏公之托参考载籍探摭旧闻作吴郡图经续记三卷凡图经已备者不录别集吴门总集元丰七年献于太守章公置诸郡府后以苏轼荐充本州教授召为太常博士迁秘书省正字枢密院编修
