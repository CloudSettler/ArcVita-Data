  decisions:
  - date: '0226'
    title_zh: 更城大城欲穿山引水
    rationale: 江州承二江之会，夏水涨盛易坏散，当筑大城并引汶江通巴江使城为洲，以固根本
  - date: '0227'
    title_zh: 求以五郡置巴州
    rationale: 巴地东西辽远，江州以东半楚，以西平敞殊俗，当置巴州以统摄，便于供输守御
