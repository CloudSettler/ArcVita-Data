  dilemmas:
  - 版图散佚而强藩割据，如何以地理统摄形胜以佐削藩一统
  - 户口耗半而贡赋紊乱，如何以国计核实丰耗以定经制
  lesson: 明版图以扼天下之吭，核户口以制群生之命，方能收地保势胜之利
  summary_first_person: 吾乃赵州赞皇李吉甫，宰相栖筠之子，历事德顺宪三朝，两拜中书侍郎平章事，先上国计簿以审户口丰耗，再撰郡县图志以辨州域疆理，起京兆尽陇右凡四十七镇，愿以山川险要户口虚实佐圣主一统
