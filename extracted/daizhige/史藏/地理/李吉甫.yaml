    title_zh: 起京兆尽陇右成书上进
    rationale: 以版图地理佐明王扼吭制命，收地保势胜之利，故每镇图冠篇首并叙攻守利害
  - date: 0814
    title_zh: 自续宥州新置入志
    rationale: 宥州更置乃己身经画之事，书成后续入以存实，不拘元和八年旧限
