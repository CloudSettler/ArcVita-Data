    title_zh: 先上国计簿后撰图志
    rationale: 成当今之务树将来之势，莫若版图地理为切，故以户口丰耗为经，以州域疆理为纬
  - date: 0807
    title_zh: 赞宪宗驱除强侯以一四海
    rationale: 天宝之后纲解侯傲，唯尽驱除方能封疆一乎四海，故请收险要以固根本
