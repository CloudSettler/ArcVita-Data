    rationale: 见殿舍倾颓佛像尘蒙，轻财好施兴善念，邀善人助缘以光大祝国之所彰盛美表乡闾
events:
- id: guji-李成梁-event-birth
  date: 1526
  year_of: 1526
  type: birth
  title_zh: 出生于辽东铁岭卫
  description: 明嘉靖五年，生于辽东都司铁岭卫李氏家，后从戎辽事
- id: guji-李成梁-event-sanguanmiao
  date: 1582-08
  year_of: 1582
  type: career
  title_zh: 捐俸重建银州城北三官庙落成
  description: 铁岭县志载万历丁卯提兵北征过而增喟，大捐俸金付宿仰辰总其事，东西广十丈南北袤二十二丈，中建神殿拜亭廊庑钟鼓楼，万历十年壬午秋八月赵惟卿记其事
- id: guji-李成梁-event-yongquansi
  date: 1608
  year_of: 1608
  type: career
  title_zh: 修建铁岭南五十里魏台冲涌泉寺
  description: 铁岭县志祠庙条载明万历三十六年李大将军成梁修建，山门韦驮伽蓝祖师佛殿俱备，崇德八年曾蒙敕赐
- id: guji-李成梁-event-death
  date: 1615
  year_of: 1615
  type: death
  title_zh: 卒于京师
  description: 明万历四十三年卒，镇辽近三十年，威震边陲，铁岭诸刹志其修建之功
