  description_zh: 杨镳号莲峯，生年不详，此处系约计，康熙朝为官
- id: guji-杨镳-event-1
  title_zh: 康熙十八年仲秋奉命知辽阳州
  date: 1679-08-01
  year_of: 1679
  description_zh: 杨镳仲秋赴辽，见平原旷野一望苍莽村落茅茨，索前人政迹与绅士耆老商榷因革兴废招集劝抚之法
- id: guji-杨镳-event-2
  title_zh: 康熙二十年与施鸿纂成辽阳州志并撰序
  date: 1681-08-01
  year_of: 1681
  description_zh: 为州一年余士习民安百废修举，与奉天府经历施鸿分任采录核实润色，旬余成稿，杨镳撰叙一施鸿撰叙二，凡二十八卷付梓
- id: guji-杨镳-event-death
  title_zh: 杨镳去世
  date: 1685-01-01
