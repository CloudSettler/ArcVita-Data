person:
  qid: guji-林应训
  name_zh: 林应训
  names:
    zh: 林应训
    en: Lin Yingxun
  lifespan:
    birth:
      date: '1535'
      precision: year
      is_circa: true
      raw: 生年未详，约嘉靖间福建怀安人
    death:
      date: '1590'
      precision: year
      is_circa: true
      raw: 卒年未详，约万历后期
  birth_date: '1535'
  death_date: '1590'
  era: 明代
  reign_ref: 明神宗万历
  archetype: 治水能臣
  dilemmas:
  - 水道湮塞久而经费浩大，如何不赋于民而不至匮乏
  - 太湖上源猥盛而三江下流填淤，如何分杀上源又宣泄下流
  - 高田患旱低田患涝，如何蓄泄兼筹使高低下咸宜
  lesson: 治水必穷源循道，分疏蓄泄，专官董成，方册垂宪，方能一劳永逸
  summary_first_person: 予闽怀安人，忝列柱下，万历四年奉玺书督理苏松常镇水利，周爰畿郡，跋涉山川，相度源委，以三江既入为纲，浚吴淞白茆刘河黄浦，分杀太湖，导归于海，财用不赋于民，六载蒇功，又命文学辑为水利图说，改名三吴水考，以告将来官水者
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E4%B8%89%E5%90%B4%E6%B0%B4%E8%80%83.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E4%B8%89%E5%90%B4%E6%B0%B4%E8%80%83.md
endeavors:
- id: guji-林应训-endeavor-1
  title_zh: 督理苏松常镇水利疏浚三江入海
  summary_zh: 万历四年受命巡察督率司道府县，相度上游汇支港分流，浚吴淞娄江东江及白茆刘河黄浦诸要港，复闸坝塘堰，六年大浚吴淞四十余里，驻节督浚白茆使深广通海，十年工竣
  phases:
  - key: brewing
    name: 受命相度考究源委
    labels:
      zh:
      - 踏勘
      - 经画
    start_date: '1576'
    highlight_event_id: guji-林应训-event-1
  - key: breakthrough
    name: 大浚吴淞分水支渠
    labels:
      zh:
      - 疏浚
      - 分杀
    start_date: '1578'
    highlight_event_id: guji-林应训-event-2
  - key: climax
    name: 驻节督浚白茆通海
    labels:
      zh:
      - 督浚
      - 宣泄
    start_date: '1580'
    highlight_event_id: guji-林应训-event-3
  - key: closure
    name: 六载蒇功北向献绩
    labels:
      zh:
      - 底定
      - 献功
    start_date: '1582'
    highlight_event_id: guji-林应训-event-4
  decisions:
  - date: '1578'
    title_zh: 以吴淞为正派娄东为旁支次第施功
    rationale: 太湖泄水以三江为大，娄江流驶则吴淞势微，须复吴淞正流，支派分疏或疏或濬或节，使太湖诸水注吴淞，淀泖注黄浦，昆嘉注刘河白茆，各趋于海
  - date: '1580'
    title_zh: 督浚白茆使深广蓄宣
    rationale: 白茆为吴中要害，导苏常东北诸水入海，可减杀震泽横溢，连年大水借宣泄之力，不至尽填沟壑，故深浚广浚，停蓄宣导
  - date: '1578'
    title_zh: 易丹阳以北石桥为木顶天关
    rationale: 运船出闸方可起桅，石桥阻阨则停泊江中等风易坏，改为天关可抽拽，有风便渡直抵，无风停泊内河，免险阻之患
- id: guji-林应训-endeavor-2
  title_zh: 董辑水利图说改名三吴水考垂宪
  summary_zh: 命张内蕴周大韶诸文学辑水事，初名水利图说十六卷，后改名三吳水考，分诏令水源水道水年水官水议水疏水移水田水绩水文十二类，徐栻刘凤皇甫汸为序，颁告将来官水者
  phases:
  - key: brewing
    name: 咨访履行询谋备考度
    labels:
      zh:
      - 考咨
      - 稽谋
    start_date: '1576'
    highlight_event_id: guji-林应训-event-1
  - key: breakthrough
    name: 命文学纂辑水利图说
    labels:
      zh:
      - 纂辑
      - 图说
    start_date: '1580'
    highlight_event_id: guji-林应训-event-3
  - key: climax
    name: 书成改名三吴水考
    labels:
      zh:
      - 成书
      - 定名
    start_date: '1581'
    highlight_event_id: guji-林应训-event-4
  - key: closure
    name: 序跋颁行以开后人
    labels:
      zh:
      - 垂宪
      - 手镜
    start_date: '1582'
    highlight_event_id: guji-林应训-event-4
  decisions:
  - date: '1580'
    title_zh: 分十二类备载源流利病
    rationale: 水非穷源何测滥觞，不循故道何宣何泄，故先诏令重事权，次源道年官议疏移政田绩文，使经略肤功典要昭然，后可遵行
  - date: '1582'
    title_zh: 董其成而不自著署衔不署名
    rationale: 执权秉宪非命不尊，奏疏条约署衔署姓以重事权，纂辑属文学而己董其成，务切实用，不主文章，施伐不嫌，禹贡可作
events:
- id: guji-林应训-event-birth
  type: birth
  date: '1535'
  year_of: 1535
  title_zh: 生于福建怀安
  description: 生年未详，约嘉靖间生于闽怀安，后登科列台臣
  location_zh: 福建怀安
- id: guji-林应训-event-1
  type: achievement
  date: '1576'
  year_of: 1576
  title_zh: 万历四年奉敕督理苏松常镇水利
  description: 言官论苏松常镇水利久湮，特命监察御史林应训督理，时常往来巡察，督率司道府县水利官，考究上游汇下流支港，分疏刘家河黄浦七浦白茆诸要港
  location_zh: 苏松常镇
- id: guji-林应训-event-2
  type: achievement
  date: '1578'
  year_of: 1578
  title_zh: 万历六年大浚吴淞江及诸支渠
  description: 特疏其状诏命大发人徒开浚吴淞约四十余里，诸分水支渠千百俱附三江入海，兼复运河闸坝，改石桥为天关，震泽底定复禹迹之旧
  location_zh: 吴淞江
- id: guji-林应训-event-3
  type: achievement
  date: '1580'
  year_of: 1580
  title_zh: 驻节督浚白茆港深广通海
  description: 驻节督浚白茆，复深且广，俾可停蓄宣导入海，苏常东北诸水由此入海，太湖上源减杀，连年大水得宣泄之力
  location_zh: 白茆港
- id: guji-林应训-event-4
  type: achievement
  date: '1582'
  year_of: 1582
  title_zh: 工竣董成三吴水考十六卷
  description: 自万历五年至十年工竣，命张内蕴周大韶辑水利图说十六卷，改名三吴水考，分十二类，徐栻庚辰序，刘凤辛巳序，皇甫汸壬午序，财用未赋于民，屡上蠲恤疏苏孑遗
  location_zh: 苏州
- id: guji-林应训-event-death
  type: death
  date: '1590'
  year_of: 1590
  title_zh: 卒于万历后期
  description: 卒年未详，约于献功之后万历后期去世，功在三吴，屡载水绩水文以传
  location_zh: 未详
