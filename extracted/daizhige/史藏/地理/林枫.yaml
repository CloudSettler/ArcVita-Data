endeavors:
- id: guji-林枫-endeavor-1
  title_zh: 考订榕城掌故著成考古略三卷
  description: 分城橹坊巷郊坰三卷采摭群书附注考证兼录名人题咏以存福州建置沿革
  phases:
  - key: brewing
    name: 乡居积访熟习闽中掌故
    labels:
      zh: 积访
    start_date: 1830
    highlight_event_id: guji-林枫-event-xiangju
  - key: breakthrough
    name: 举于乡后闭门勤笔立例分卷
    labels:
      zh: 立例
    start_date: 1851
    highlight_event_id: guji-林枫-event-zhongju
  - key: climax
    name: 采摭群书考城橹河道桥梁成稿
    labels:
      zh: 成稿
    start_date: 1865
    highlight_event_id: guji-林枫-event-zhushu
  - key: closure
    name: 冢嗣薇卿付刊谢章铤陈衍作序以传
    labels:
      zh: 付传
    start_date: 1872
    highlight_event_id: guji-林枫-event-kanxing
  decisions:
  - date: 1851
    title_zh: 不趋戎幕闭门吟写专治乡邦文献
    rationale: 世运升沉电光泡影不如考献征文以文章传远自遂生平
  - date: 1865
    title_zh: 仿水道提纲东城杂记体例分三卷附注考证
    rationale: 非乡人不能辨方言传闻异辞必采摭群书附注证之方得翔实可传
- id: guji-林枫-endeavor-2
  title_zh: 晚年以医自给兼治医学著述
  description: 晚岁贫病不废研求以医养廉医学特为绪余亦勒有成书济世存心
  phases:
  - key: brewing
    name: 中年究心方书以医济家
    labels:
      zh: 究方
    start_date: 1855
    highlight_event_id: guji-林枫-event-xiangju
  - key: breakthrough
    name: 晚年悬壶自给名动闾里
    labels:
      zh: 悬壶
    start_date: 1865
    highlight_event_id: guji-林枫-event-xingyi
  - key: climax
    name: 著述医学诸书以惠后学
    labels:
      zh: 惠人
    start_date: 1868
    highlight_event_id: guji-林枫-event-yixue
  - key: closure
    name: 医名与地理之学并传子能读父书
    labels:
      zh: 家传
    start_date: 1872
    highlight_event_id: guji-林枫-event-kanxing
  decisions:
  - date: 1865
    title_zh: 以医自给不借手肥身家
    rationale: 守穷困而无愧怍不愿置身流俗赫赫之途以医养廉全名节
  - date: 1868
    title_zh: 医学为绪余亦勤勒成书
    rationale: 地理掌故特精之余以医济人亦当笔之于书以传后
events:
- id: guji-林枫-event-birth
  date: 1800
  year_of: 1800
  title_zh: 生于福州闽县
  description: 约嘉庆道光间生于闽县林氏后与谢氏外家有连为谢章铤丈人行
- id: guji-林枫-event-zhongju
  date: 1840
  year_of: 1840
  title_zh: 举于乡为孝廉
  description: 举乡颇晚同年生多谢章铤侪辈遂与谢氏结忘年交纵谈竟夕
- id: guji-林枫-event-xiangju
  date: 1851
  year_of: 1851
  title_zh: 咸丰初闭门吟写不逐戎幕
  description: 东南兵事起都人士投笔从戎独守老屋三楹朝吟暝写若甚自得
- id: guji-林枫-event-xingyi
  date: 1865
  year_of: 1865
  title_zh: 晚年以医自给
  description: 家贫炊烟不继晚年悬壶自给不借手肥身家而著述倍勤
- id: guji-林枫-event-yixue
  date: 1868
  year_of: 1868
  title_zh: 医学著述勒成书
  description: 于闽地理掌故特精之外以医学为绪余亦勒有成书以惠乡人
- id: guji-林枫-event-zhushu
  date: 1870
  year_of: 1870
  title_zh: 著成榕城考古略三卷
  description: 首卷城橹二卷坊巷三卷郊坰叙述有法采摭群书附注证之兼录题咏
- id: guji-林枫-event-death
  date: 1871
  year_of: 1871
  title_zh: 卒于福州
  description: 同治十年前后卒于家次年故友谢章铤归自京师始闻其殁为之慨然
- id: guji-林枫-event-kanxing
  date: 1872
  year_of: 1872
  title_zh: 冢嗣出稿谢陈二氏作序付传
  description: 冢嗣薇卿出考古略一集属谢章铤同治壬申序于赌棋山庄陈衍癸丑再叙遂传于世
