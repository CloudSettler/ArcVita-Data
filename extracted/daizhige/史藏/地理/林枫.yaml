  - 咸丰兵兴都人士投笔从戎以取大名闭户吟写甘于炊烟不继何去何从
  - 晚年穷困以医自给与勤于著述保存闽地文献如何两全
  lesson: 穷困自遂无所愧怍文章传远有子能读父书胜于流俗赫赫之途
  summary_first_person: 余姓林名枫字芾庭闽县人举于乡颇晚咸丰初闭门三楹朝吟暝写不逐时好晚以医自给益勤著述于闽地理掌故特精勒成榕城考古略三卷以传
