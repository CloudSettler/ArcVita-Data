    name: 定为江南各郡成式
    labels:
      zh: 推行
    start_date: '1433'
    highlight_event_id: guji-周忱-event-1433
  decisions:
  - date: '1430'
    title_zh: 请以侍郎巡抚江南兼理税粮
    rationale: 东南赋重官民交困，非重臣久任不能变通经久
  - date: '1432'
    title_zh: 行平籴劝分之令
    rationale: 趁丰年聚米于官，凶年尽发以赈，胜于临灾束手
- id: guji-周忱-endeavor-2
  title_zh: 创设松江济农仓
  summary: 在华亭上海分贮平籴及省耗之米二十一万余石，春夏借贷秋收偿官，兼济运损与堤役
  phases:
  - key: brewing
    name: 宣德七年秋逢稔奏行平籴
    labels:
      zh: 平籴
    start_date: '1432'
    highlight_event_id: guji-周忱-event-1432a
  - key: breakthrough
    name: 得米六万石分贮华亭上海
    labels:
      zh: 立仓
    start_date: '1432'
    highlight_event_id: guji-周忱-event-1432a
  - key: climax
    name: 奏留京俸就松支给省米十五万
    labels:
      zh: 省费益仓
    start_date: '1433'
    highlight_event_id: guji-周忱-event-1433
  - key: closure
    name: 定出纳条约择廉能掌管
    labels:
      zh: 定制
    start_date: '1433'
    highlight_event_id: guji-周忱-event-1433
  decisions:
  - date: '1432'
    title_zh: 名仓曰济农专济农贫
    rationale: 食者众而耕者贫，不济耕者则民无养，故以济农为本
  - date: '1433'
    title_zh: 请北京将帅禄俸就松江给发
    rationale: 转输南京每六斗致一石之费太重，就近给发以省费之米益仓则农可无忧
events:
- id: guji-周忱-event-birth
  title_zh: 出生于吉水
  date: '1381'
  year_of: 1381
  kind: birth
  summary: 洪武十四年生于江西吉水，字恂如，后登永乐二年进士
- id: guji-周忱-event-1430
  title_zh: 巡抚江南
  date: '1430'
  year_of: 1430
  kind: career
  summary: 以工部侍郎巡抚江南诸府，总督税粮，至松江与知府赵豫议农贫赋重之弊
- id: guji-周忱-event-1432a
  title_zh: 行平籴劝分立济农仓
  date: '1432'
  year_of: 1432
  kind: career
  summary: 宣德七年秋吴中丰稔，奉诏平籴劝分得米六万石，分贮华亭上海，名曰济农仓，明年饥即发以赈松江饥民二十余万
- id: guji-周忱-event-1433
  title_zh: 奏省京俸运费以益农仓
  date: '1433'
  year_of: 1433
  kind: career
  summary: 奏请岁征北京将帅禄俸改就松江支给，省米十五万石，并各场赢余及平籴所贮凡二十一万余石，广二县仓以贮之，定春散秋敛之制
- id: guji-周忱-event-death
  title_zh: 卒于官
  date: '1453'
  year_of: 1453
  kind: death
  summary: 景泰四年卒，江南民闻之皆为流涕，松江济农仓法为后世所守
