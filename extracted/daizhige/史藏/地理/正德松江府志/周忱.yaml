  - 积贮救荒与官司侵耗监守之弊之难
  lesson: 为政以预备为仁，平籴劝分与就近支给可使重赋之区凶年不饥
  summary_first_person: 我是周忱，巡抚江南二十余年，见松江田赋特重而农贫失养，乃与知府赵豫协谋，于宣德七年行平籴劝分得米六万石，立济农仓以备赈济，又奏留北京将帅禄俸就松给之以省耗费，广储二十余万石，春夏施散秋冬敛补，使民遇旱饥而不流殍
