endeavors:
- id: guji-周忱-endeavor-1
  title_zh: 巡抚江南总理粮储
  summary: 宣德五年起巡抚江南，减运耗，察民隐，以松江赋重为最忧，谋长久养民之政
  phases:
  - key: brewing
