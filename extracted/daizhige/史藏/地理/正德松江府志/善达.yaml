person:
  qid: guji-善达
  name_zh: 善达
  names:
    zh: 善达
    en: Shanda Xiyuan
  lifespan:
    birth:
      date: 1335
      precision: year
      is_circa: true
      raw: 元末约生上海金氏子
    death:
      date: 1402-05
      precision: month
      is_circa: false
      raw: 洪武三十五年夏五月泊然而逝
  birth_date: 1335
  death_date: 1402-05
  era: 元末明初
  reign_ref: 明太祖洪武
  archetype: 舍产兴寺之净土行者
  dilemmas:
  - 寺田多则重徭艰役僧散去，留产养众还是舍产存寺
  - 自任住持守成还是延请贤能甲乙相承
  lesson: 田多则寺废，无产则寺兴，以舍为得，以俭护常住，以念佛为归
  summary_first_person: 吾上海金氏子，号西原，十岁从叔能公出家于法华寺，首忏上天竺，回松延庆忝居第二座。见法华田多徭重僧散，乃尽以寺田数十顷与佃户，使庭无吏迹，渐兴废屋，重建殿宇。洪武清理佛教立为四方禅林，吾请象先董事，复造方丈僧堂以延智勇，属孙如䥔以代，俭约自持，专修净业，临终念佛而去。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E6%AD%A3%E5%BE%B7%E6%9D%BE%E6%B1%9F%E5%BA%9C%E5%BF%97/%E5%8D%B720.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E6%AD%A3%E5%BE%B7%E6%9D%BE%E6%B1%9F%E5%BA%9C%E5%BF%97/%E5%8D%B720.md
endeavors:
- id: guji-善达-endeavor-1
  title_zh: 舍田兴复法华禅寺
  summary_zh: 叹田多寺废，尽舍寺田数十顷与佃户，重建殿宇轮奂一新
  phases:
  - key: brewing
    name: 幼年出家见寺衰
    labels:
      zh: 上海出家上天竺首忏
    start_date: 1345
    highlight_event_id: guji-善达-event-1
  - key: breakthrough
    name: 断舍寺田去徭役
    labels:
      zh: 以寺田悉与佃户去吏迹
    start_date: 1390
    highlight_event_id: guji-善达-event-2
  - key: climax
    name: 重建殿宇赎旧物
    labels:
      zh: 易坚木鳞万瓦赎安藏转轮
    start_date: 1391
    highlight_event_id: guji-善达-event-2
  - key: closure
    name: 请立四方禅林
    labels:
      zh: 洪武二十四年请象先董事
    start_date: 1391
    highlight_event_id: guji-善达-event-3
  decisions:
  - date: 1390
    title_zh: 尽以寺田数十顷与佃户
    rationale: 田多则寺废，无一墢之土则庭无吏迹，僧散者复集，屋废者渐兴
  - date: 1391
    title_zh: 请一公象先董四方禅林事
    rationale: 国朝清理佛教立为禅林，须得有道者主持，方能安众弘化
- id: guji-善达-endeavor-2
  title_zh: 俭约护常住专修净业垂嗣
  summary_zh: 造方丈僧堂延智勇，属孙如䥔代领，俭约护物念佛示寂
  phases:
  - key: brewing
    name: 延庆第二座归来
    labels:
      zh: 回松延庆历练归法华
    start_date: 1385
    highlight_event_id: guji-善达-event-1
  - key: breakthrough
    name: 造方丈僧堂延贤
    labels:
      zh: 造方丈居智勇建僧堂栖云水
    start_date: 1399
    highlight_event_id: guji-善达-event-3
  - key: climax
    name: 属孙如䥔以代
    labels:
      zh: 倦于事付孙辈成丛林规制
    start_date: 1400
    highlight_event_id: guji-善达-event-3
  - key: closure
    name: 专修净业示寂
    labels:
      zh: 临终念佛泊然而逝
    start_date: 1402-05
    highlight_event_id: guji-善达-event-death
  decisions:
  - date: 1399
    title_zh: 造方丈僧堂延天台智勇住持
    rationale: 无堂以集云水则住持难安，建屋以居贤者，轮奂方能一新
  - date: 1400
    title_zh: 属孙如䥔代领家业
    rationale: 倦于事而护常住物如己赀，付托得人则祖业不坠，己得专修净业
events:
