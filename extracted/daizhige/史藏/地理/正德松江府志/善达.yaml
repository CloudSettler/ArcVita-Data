- id: guji-善达-event-1
  type: career
  title_zh: 十岁从叔能出家首忏上天竺
  date: 1345
  year_of: 1345
  place_zh: 法华禅寺上天竺松江延庆寺
  description_zh: 十岁从僧叔能公出家于法华寺，久之首忏于上天竺，复回松江延庆寺为第二座
- id: guji-善达-event-2
  type: career
  title_zh: 舍寺田数十顷兴复法华
  date: 1390
  year_of: 1390
  place_zh: 法华禅寺
  description_zh: 叹田多寺废，乃以寺田数十顷悉与佃户，寺无一墢之土，屋废渐兴，僧散复集，重建安藏转法诸殿，赎回旧物
- id: guji-善达-event-3
  type: career
  title_zh: 请象先董禅林造堂延智勇
  date: 1391
  year_of: 1391
  place_zh: 法华禅寺
  description_zh: 洪武二十四年立为四方禅林，请一公象先董其事，后天台智勇捧檄来住，造方丈僧堂以居栖之，演法庖库咸备
- id: guji-善达-event-death
  type: death
  title_zh: 念佛泊然示寂
  date: 1402-05
  year_of: 1402
  place_zh: 法华禅寺
  description_zh: 以俭约自持护常住物如己赀，专修净业，洪武三十五年夏五月临终念佛泊然而逝，孙如䥔继其业
