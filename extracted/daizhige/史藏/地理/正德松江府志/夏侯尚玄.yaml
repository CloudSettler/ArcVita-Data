events:
- id: guji-夏侯尚玄-event-birth
  title_zh: 出生华亭儒家
  date: 约1275
  year_of: 1275
  location_zh: 华亭
  description_zh: 世业儒幼有大志阅经史好深思为文下笔成章通释老医药卜筮诸书
- id: guji-夏侯尚玄-event-banDu
  title_zh: 游京师为东宫伴读
  date: 约1300
  year_of: 1300
  location_zh: 京师
  description_zh: 大德间游京师赵孟頫荐于朝为东宫伴读主礼典乐皆有能声以官卑去而汗漫湖海
- id: guji-夏侯尚玄-event-beiYou
  title_zh: 北入海都事武平王郯王
  date: 约1328
  year_of: 1328
  location_zh: 海都北界
  description_zh: 明宗自海都还事有变北入海都被武平王留礼遇王薨嘉王厚遇之复为郯王上宾抵掌论事左右皆忌之
- id: guji-夏侯尚玄-event-xueYuan
  title_zh: 朝堂三诉雪郯王冤
  date: 约1329
  year_of: 1329
  location_zh: 京师朝堂
  description_zh: 郯王被诬殁亲信逃匿独挺身陈王忠孝数事三上始行明诏改正复其业袭其子
- id: guji-夏侯尚玄-event-nanGui
  title_zh: 着处士衣冠南归
  date: 约1330
  year_of: 1330
  location_zh: 松江华亭
  description_zh: 事成不求爵着处士衣冠渊明巾歌归去来辞翩然南归筑室为三径之主
- id: guji-夏侯尚玄-event-death
  title_zh: 南归后以寿终
  date: 约1335
  year_of: 1335
  location_zh: 华亭
  description_zh: 归隐故里远迹荣利时人谓报主之德遂其志而不居其功者尤难
