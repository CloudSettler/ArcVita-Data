  - title_zh: 差役雇役義役何從
    description_zh: 差役則詭挾隱寄爭訟紛挐雇役則官募直鄉後人不繼義役則合而終必離守久為難
  - title_zh: 義田既立恐後人敗之
    description_zh: 官取其賦則弊民據其產則弊排比不公則爭州家言利復取則蠲而復徵
  lesson: 合雇役差役義役而一之立法垂後易守久為難要在上下均任其責保護封植使永久無弊
  summary_first_person: 吾瑾字廷閏丙戌進士以東門稅攝華亭聽訟以理督賦寬期疏產立籍停差保長募民為直鄉糾錢買田二萬六千餘畝蠲其苗稅為官田義莊以充役費條章鏤板以示後來惟望後之君子扶持存全勿壞
