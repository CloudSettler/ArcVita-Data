  - date: 1034-06-01
    title_zh: 上书宰臣具言水利
    rationale: 湖溢江壅横没诸邑惟分流东南入松江东北入江海方可救荐饥非朝廷主之守土不敢建事
  - date: 1034-08-01
    title_zh: 驳江高潮来沙塞劳民四说
    rationale: 江海善下潮退多于潮来新河设闸御潮春理闸外旱涝皆利役万人费米无多视蠲租数十万孰轻孰重
- id: guji-范仲淹-endeavor-2
  title_zh: 亲临海滨开浚五河泄积水
  summary: 亲至海滨相度开浚五河及盘龙一曲设闸扃御春理闸外使积潦速下秋得七八成收为后世开江第一义
