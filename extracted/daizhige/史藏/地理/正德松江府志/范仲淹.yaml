  lesson: 水患非天命在人事未尽治水须力排浮议顺水之性决而流之
  summary_first_person: 我守乡郡见姑苏大水逾秋不退遍视湖江海潮之势乃上书宰相力陈开浚松江及东南东北分流入海之策并亲历海滨开五河设闸御潮以保东南稼穑
