    title_zh: 就成都王军司之命
    rationale: 欲以军功破文士轻薄之讥，兼感知遇不忍固辞
  - date: 195
    title_zh: 兵败不逃直待朝命
    rationale: 自恃忠心可表，不肯叛走，欲以死明志而终罹谗杀
events:
- id: guji-陆机-event-birth
  title_zh: 生于吴郡华亭
  date: 177
  year_of: 261
  place_zh: 华亭
  description_zh: 吴永安四年，生于吴郡华亭陆氏，为吴丞相陆逊之孙，大司马陆抗之子
- id: guji-陆机-event-ruluo
  title_zh: 初入洛千里莼羹名对
  date: 0289
  year_of: 289
  place_zh: 洛阳
  description_zh: 初入洛诣侍中王济，济指羊酪相问，对以千里莼羹末下盐豉，时人称为名对，华亭称云间亦由此文名而广
- id: guji-陆机-event-congjun
  title_zh: 为成都王司马颖军司督兵
  date: 194
  year_of: 302
  place_zh: 邺下
  description_zh: 应成都王司马颖之辟为军司，率众讨长沙王，军纪不整，战败招忌，为孟玖等所谗
- id: guji-陆机-event-death
  title_zh: 兵败被谗遇害
  date: 195
  year_of: 303
  place_zh: 军中
  description_zh: 太安二年，以兵败及谗言被收遇害，兼害其弟陆云，一时文士之冤，天下惜之
