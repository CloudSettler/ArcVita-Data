  archetype: 恃才误身的文士统帅
  dilemmas:
  - 吴亡之后南士北上，才名太盛而根基浅薄，何以自安
  - 依附藩王以求功业，卷入八王之乱，何以自保
  lesson: 文才可显名亦可招忌，托身非人则才反为累，见识与节守重于词章
  summary_first_person: 吾本华亭人，少负才名，吴亡入洛，以千里莼羹之对动京师，后以文显于朝，终从成都王军事，兵败被谗而死，方知虚名误身
