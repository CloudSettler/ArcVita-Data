  era: 汉末三国吴
  reign_ref: 吴大帝孙权
  archetype: 名臣
  dilemmas:
  - 白衣谦下以骄关羽，隐忍负重与长者之责如何两全
  - 嫡庶之争上疏三四，明知触怒而守正统大义何去何从
  lesson: 以深谋韬隐制敌，以忠贞守正安国，功成而家无余财
  summary_first_person: 我是吴郡吴人陆逊，字伯言，少孤随从祖庐江太守陆康，二十一岁仕孙权幕府，屯海昌，破山越，代吕蒙袭荆州，夷陵破刘备，石亭破曹休，官至上大将军丞相，辅太子掌荆州，谏嫡庶而见让，愤恚而卒
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E6%AD%A3%E5%BE%B7%E6%9D%BE%E6%B1%9F%E5%BA%9C%E5%BF%97/%E5%8D%B727.html
endeavors:
- id: guji-陆逊-endeavor-1
  title_zh: 屯田平越经营江东
  summary: 出守海昌劝农赈旱，讨平会稽鄱阳山贼，收东三郡精卒，肃清宿恶
  phases:
  - key: brewing
    name: 初仕屯田
    labels:
      zh: 屯田积谷
    start_date: '0203'
    highlight_event_id: guji-陆逊-event-haichang
  - key: breakthrough
    name: 讨平潘临
    labels:
      zh: 招讨山越
    start_date: '0205'
    highlight_event_id: guji-陆逊-event-haichang
  - key: climax
    name: 部伍三郡
    labels:
      zh: 破费栈得众
    start_date: 0208
    highlight_event_id: guji-陆逊-event-haichang
  - key: closure
    name: 屯镇蕪湖
    labels:
      zh: 荐贤养民
    start_date: '0215'
    highlight_event_id: guji-陆逊-event-haichang
  decisions:
  - date: '0205'
    title_zh: 开仓赈旱劝督农桑
    rationale: 连年亢旱先救贫民以固本，农桑既劝则军民蒙赖
  - date: '0215'
    title_zh: 荐举淳于式为佳吏
    rationale: 式白我扰民本意养民，若毁之以乱圣听不可长，当以长者之道处之
- id: guji-陆逊-endeavor-2
  title_zh: 袭取荆州夷陵破备
  summary: 代吕蒙为督，白衣谦书安关羽，克公安南郡，进封华亭江陵侯，夷陵火攻破刘备四十余营
  phases:
  - key: brewing
    name: 代蒙守陆口
    labels:
      zh: 韬隐待机
    start_date: 0219
    highlight_event_id: guji-陆逊-event-jingzhou
  - key: breakthrough
    name: 谦书安羽潜军上
    labels:
      zh: 克公安南郡
    start_date: 0219-11
    highlight_event_id: guji-陆逊-event-jingzhou
  - key: climax
    name: 夷陵坚守待疲
    labels:
      zh: 火攻破备
    start_date: '0222'
    highlight_event_id: guji-陆逊-event-yiling
  - key: closure
    name: 加辅国领荆州牧
    labels:
      zh: 连和定南
    start_date: '0223'
    highlight_event_id: guji-陆逊-event-yiling
  decisions:
  - date: 0219
    title_zh: 致谦书于关羽
    rationale: 羽矜骄务北进，以书生疏迟示弱使其大安，方可察形便而禽之
  - date: '0222'
    title_zh: 持茅火攻同时俱进
    rationale: 备连营数百里兵疲意沮，初不可干而久可破，以火攻拔之则土崩瓦解
- id: guji-陆逊-endeavor-3
  title_zh: 石亭抗魏辅政守正
  summary: 假黄钺破曹休于皖，拜上大将军右都护，辅太子掌荆州，代顾雍为丞相，谏二宫嫡庶守大义
  phases:
  - key: brewing
    name: 西陵辅太子
    labels:
      zh: 董督军国
    start_date: 0229
    highlight_event_id: guji-陆逊-event-shiting
  - key: breakthrough
    name: 石亭冲伏追北
    labels:
      zh: 斩获万余
    start_date: 0228
    highlight_event_id: guji-陆逊-event-shiting
  - key: climax
    name: 拜丞相总司三事
    labels:
      zh: 匡国弭难
    start_date: '0244'
    highlight_event_id: guji-陆逊-event-chengxiang
  - key: closure
    name: 三四上疏谏嫡庶
    labels:
      zh: 守正见让
    start_date: '0245'
    highlight_event_id: guji-陆逊-event-chengxiang
  decisions:
  - date: 0228
    title_zh: 三道俱进逆曹休
    rationale: 周鲂已诳休入皖，自为中部令朱桓全琮为翼，冲其伏兵可追亡逐北
  - date: '0243'
    title_zh: 上疏陈太子正统磐石之固
    rationale: 二宫势敌必有彼此，太子正统宜尊，鲁王藩臣当使宠秩有差，方上下获安
events:
- id: guji-陆逊-event-birth
  date: 0183
  year_of: 183
  title_zh: 出生吴郡吴县
  description: 少孤随从祖庐江太守陆康在官，长于康子陆绩数岁，为之纲纪门户
- id: guji-陆逊-event-haichang
  date: '0205'
  year_of: 205
  title_zh: 出为海昌屯田都尉并领县事
  description: 开仓赈旱劝督农桑，讨会稽潘临鄱阳尤突，拜定威校尉，讨丹阳费栈得精卒数万人，还屯芜湖
- id: guji-陆逊-event-jingzhou
  date: 0219-11
  year_of: 219
  title_zh: 代吕蒙为偏将军右部督克公安南郡
  description: 致谦书安关羽，潜军而上，与吕蒙为前部克公安南郡，径进领宜都太守，拜抚边将军封华亭侯
- id: guji-陆逊-event-yiling
  date: '0222'
  year_of: 222
  title_zh: 黄武元年为大都督夷陵破刘备
  description: 假节督五万人拒备，坚守七八月，以火攻破四十余营，斩张南冯习，备夜遁入白帝，加辅国将军领荆州牧改封江陵侯
- id: guji-陆逊-event-shiting
  date: 0228
  year_of: 228
  title_zh: 石亭破魏大司马曹休
  description: 假黄钺为大都督逆休，自为中部令朱桓全琮为左右翼，三道俱进冲伏追至夹石，斩获万余军资俱尽，休还疽发死
- id: guji-陆逊-event-chengxiang
  date: '0244'
  year_of: 244
  title_zh: 赤乌七年代顾雍为丞相
  description: 诏以超世之功膺光大之宠，州牧都护领武昌事如故，上疏谏二宫嫡庶，书三四上求诣都口论不许
- id: guji-陆逊-event-death
  date: '0245'
  year_of: 245
  title_zh: 愤恚卒于武昌年六十三
  description: 外孙顾谭顾承姚信附太子见流徙，累遣中使让逊，家无余财，孙休追谥昭侯，子陆抗袭爵
