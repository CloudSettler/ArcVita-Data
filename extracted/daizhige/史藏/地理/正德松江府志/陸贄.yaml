  name_zh: 陸贄
  names:
    zh: 陸贄
    en: Lu Zhi
  lifespan:
    birth:
      date: '0754'
      precision: year
      is_circa: true
      raw: 唐天寶十三載嘉興人
    death:
      date: 0805
      precision: year
      is_circa: false
      raw: 唐永貞元年卒於忠州召還途中年五十二
  birth_date: '0754'
  death_date: 0805
  era: 唐
  reign_ref: 唐德宗貞元
  archetype: 內相直諫名臣
  dilemmas:
  - 奉天扈從機務闐總當沛然草詔安撫天下抑或明哲保身以避權倖之忌
  - 貞元秉政面斥裴延齡僻戾躁妄當苦諫不聽至罷相貶謫抑或容忍緘默以保相位
  - 處忠州瘴癘荒遠當闔戶避謗不著書抑或著書立言以傳後世法
  lesson: 上不負天子下不負所學剴切盡言雖一時見逐而奉天詔令感動士卒之功足為後世法
  summary_first_person: 我字敬輿嘉興人十八登進士自鄭尉渭南至監察御史入翰林從德宗狩奉天山南日草數百詔人人曉暢時號內相後以中書侍郎平章事力阻裴延齡苦諫不納罷為太子賓客貶忠州別駕終老荒遠我上不負天子下不負所學而已
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E6%AD%A3%E5%BE%B7%E6%9D%BE%E6%B1%9F%E5%BA%9C%E5%BF%97/%E5%8D%B728.html
