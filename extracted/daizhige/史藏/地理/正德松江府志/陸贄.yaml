  - date: 0783
    title_zh: 請撤瓊林大盈二庫
    rationale: 行在貢奉當恤衛兵無衣府藏委棄不可別藏私庫以失人心
  - date: 0784
    title_zh: 勸帝痛自咎悔下罪己詔
    rationale: 盜遍天下宜以誠感人心如成湯罪己楚昭善言復國使叛者革心
