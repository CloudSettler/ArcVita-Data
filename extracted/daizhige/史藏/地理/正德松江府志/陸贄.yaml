    title_zh: 班宏卒薦李遜判度支
    rationale: 度支需清慎可任裴延齡僻戾躁妄必誤國計
  - date: 0794
    title_zh: 上書苦諫斥延齡姦佞
    rationale: 延齡得君天下仇惡不敢言吾不敢自顧重事有可否必言之
  - date: 0795
    title_zh: 謫居忠州闔戶避謗不著書
    rationale: 地苦瘴癘為避謗僅集古今驗方五十篇示鄉人以全君臣之義
events:
- id: guji-陸贄-event-birth
