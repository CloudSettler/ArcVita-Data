  date: '0754'
  year_of: 754
  place_zh: 嘉興
  description: 唐天寶十三載生於嘉興秘書監齊望姪曾孫吏部郎中灞之子
- id: guji-陸贄-event-jinshi
  title_zh: 十八登進士補渭南尉
  date: '0771'
  year_of: 771
  place_zh: 長安
  description: 十八第進士中博學宏辭調鄭尉以書判拔萃補渭南尉說黜陟使以五術八計三科四賦時皆韙之遷監察御史召為翰林學士
- id: guji-陸贄-event-fengtian
  title_zh: 從狩奉天草詔號內相
  date: 0783
  year_of: 783
  place_zh: 奉天
  description: 馬燧討賊李希烈寇襄城從狩奉天機務闐總奏請報下詔書數百沛然有餘諫撤瓊林大盈二庫勸罪己謝天下士卒感泣思奮興元戡難多賴其力
- id: guji-陸贄-event-zaixiang
  title_zh: 貞元八年拜中書侍郎平章事
  date: 0792
  year_of: 792
  place_zh: 長安
  description: 貞元七年罷學士以兵部侍郎知貢舉竇參黜乃以中書侍郎同中書門下平章事輔政不敢自顧必言可否
- id: guji-陸贄-event-bianzhong
  title_zh: 論裴延齡罷相貶忠州別駕
  date: 0795
  year_of: 795
  place_zh: 忠州
  description: 言裴延齡僻戾躁妄不可用上書苦諫不聽竟以太子賓客罷賴陽城等論辯貶忠州別駕闔戶人不識面集驗方五十篇
- id: guji-陸贄-event-death
  title_zh: 順宗召還未至卒贈兵部尚書
  date: 0805
  year_of: 805
  place_zh: 忠州
  description: 順宗立召未至卒年五十二贈兵部尚書謚曰宣論諫數十百篇本仁義炳炳如丹
