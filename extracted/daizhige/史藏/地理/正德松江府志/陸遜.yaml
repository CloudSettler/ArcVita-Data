endeavors:
- id: guji-陸遜-endeavor-1
  title_zh: 經略荊州與夷陵守成
  summary: 贊呂蒙襲取荊州，繼而夷陵拒劉備，以堅忍待變轉危為安，奠定吳之疆土
  phases:
  - key: brewing
    name: 幕府參贊蓄望江東
    labels:
      zh: 韜晦養望
    start_date: '0203'
    highlight_event_id: guji-陸遜-event-215
  - key: breakthrough
    name: 代呂蒙謀取荊州
    labels:
      zh: 示弱藏鋒
    start_date: 0219
    highlight_event_id: guji-陸遜-event-219
  - key: climax
    name: 夷陵堅守火破蜀軍
    labels:
      zh: 以逸待勞
    start_date: '0222'
    highlight_event_id: guji-陸遜-event-222
  - key: closure
    name: 拜輔國將軍封江陵侯
    labels:
      zh: 功成受封
    start_date: '0223'
    highlight_event_id: guji-陸遜-event-222
  decisions:
  - date: 0219
    title_zh: 贊成襲取荊州之謀
    rationale: 荊州為吳蜀必爭，關羽驕矜北伐，宜與曹魏連和，先剪羽翼以全江東，故書贊呂蒙，密圖南郡
  - date: '0222'
    title_zh: 堅壁不戰以待蜀疲
    rationale: 劉備憤兵東下鋒銳，不可與爭，退守夷陵，避其銳氣，待其分營散處，機至則火攻破之
- id: guji-陸遜-endeavor-2
  title_zh: 丞相輔政與華亭報功
  summary: 出將入相領荊州牧，晚年居丞相輔佐國政，直諫護太子，歿後配享華亭鎮西廟
  phases:
  - key: brewing
    name: 撫邊鎮西累功進封
    labels:
      zh: 開拓封疆
    start_date: '0224'
    highlight_event_id: guji-陸遜-event-222
  - key: breakthrough
    name: 石頭卻魏揚威四方
    labels:
      zh: 捍禦大患
    start_date: '0234'
    highlight_event_id: guji-陸遜-event-244
  - key: climax
    name: 拜丞相領荊州牧輔政
    labels:
      zh: 位極人臣
    start_date: '0244'
    highlight_event_id: guji-陸遜-event-244
  - key: closure
    name: 華亭立廟昭侯血食
    labels:
      zh: 鄉邦尸祀
    start_date: '0245'
    highlight_event_id: guji-陸遜-event-death
  decisions:
  - date: '0244'
    title_zh: 受丞相之任總理國事
    rationale: 孫權倚重文武全才，授以丞相荊州牧，欲託後事，故以社稷為念，受命輔政，共治曹魏
  - date: '0245'
    title_zh: 上疏直諫保全太子
    rationale: 儲位動搖國本不安，明知觸怒亦盡忠懇至，寧以身殉義，不負託孤之誠
