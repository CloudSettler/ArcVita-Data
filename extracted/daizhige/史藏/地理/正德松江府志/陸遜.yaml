  description: 代呂蒙為右護軍，密啟孫權與魏連和，揚兵相應，襲取江陵，生擒關羽，遂拜撫邊將軍封婁侯
- id: guji-陸遜-event-222
  title_zh: 夷陵大破劉備拜大將軍
  date: '0222'
