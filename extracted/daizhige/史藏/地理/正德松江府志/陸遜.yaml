  description: 赤烏七年以前拜丞相，文武全功與國始終，上疏諫爭儲事，憂國忘身，忠誠懇至
- id: guji-陸遜-event-death
  title_zh: 卒於任謚曰昭侯配享華亭
  date: '0245'
  year_of: 245
  kind: death
  place_zh: 建業
  description: 赤烏七年卒，謚昭侯，族子陸凱繼鎮西之號，松江府治東立鎮西輔國將軍廟，合祀遜凱及子抗，春秋致祭
