    title_zh: 请省罢华亭茶盐分司
    rationale: 分司为逃亡折陷之源省之则追会不远催督反易
  - date: 1260
    title_zh: 请省罢买纳场文武一员并定吏卒人数
    rationale: 官多吏多民扰定额觉察以止并缘渔猎
- id: guji-黄震-endeavor-2
  title_zh: 陈恤亭丁六策并论宽榷禁
  summary: 主张不急复祖额而专恤亭丁发积招流亡除出剩省烦扰并请外严内宽以养利源
  phases:
