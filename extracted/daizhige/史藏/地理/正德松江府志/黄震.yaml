  - key: climax
    name: 实办八万三千袋为近十年之最
    labels:
      zh: 增课
    start_date: 1261
    highlight_event_id: guji-黄震-event-xuting
  - key: closure
    name: 论私禁宜宽以培养元气
    labels:
      zh: 宽禁
    start_date: 1261
