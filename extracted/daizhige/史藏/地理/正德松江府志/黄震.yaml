  decisions:
  - date: 1261
    title_zh: 以恤亭丁为急不以复祖额为名
    rationale: 有人有土有财复额立名必趣办耗根本恤丁则额渐自复
  - date: 1261
    title_zh: 陈宽禁之请外示大防内存宽恕
    rationale: 私禁宽则民有余力煎纳官盐禁严则无本可煎徒撻至死无益
