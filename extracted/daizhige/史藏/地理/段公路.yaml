  dilemmas:
  - 中夏旧闻与岭南风土异俗如何并存而取信
  - 小说尚鬼神变怪滑稽诙谐之风中如何坚守可考验之博物
  lesson: 博而且信，采风必连类引证相参验，方能为博物之助而不徒为谈端
  summary_first_person: 余段公路，邹平公之孙，官京兆万年县尉，尝以事南游五岭，采民风土俗饮食衣制歌谣哀乐之异于中夏者，及草木果蔬虫鱼羽毛瑰形诡状，连类引证而成北户录三卷，惟求可考验耳
