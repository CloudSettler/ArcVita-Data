  summary: 以事南游五岭间，采民风土俗饮食衣制及草木虫鱼瑰形诡状，连类引证与奇书异说相参验
  phases:
  - key: brewing
    name: 幼嗜僻学博览群籍
    labels:
      zh: 幼学强力
    start_date: 0837
    highlight_event_id: guji-段公路-event-birth
