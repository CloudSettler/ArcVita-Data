    name: 录成北户三卷备核其实
    labels:
      zh: 录成全书
    start_date: 0870
    highlight_event_id: guji-段公路-event-chengshu
  decisions:
  - date: 0860
    title_zh: 采异于中夏者录而志之
    rationale: 非徒止于闻见，更连类引证与奇书异说相参验，求博而且信
  - date: 0869
    title_zh: 亲验鹦鹉瘴绯猨红虵诸异
    rationale: 目击为实，如忌手触鹦鹉背，养绯猨而葬之，见红虵白虵入榕藤窍，皆备核其实
- id: guji-段公路-endeavor-2
  title_zh: 任万年尉请序传书
  summary: 官京兆万年县尉，以曾从事岭南之陆希声备核其实而请序，使北户录得行于世
  phases:
  - key: brewing
    name: 出身宰相家文学世其家
    labels:
      zh: 家世
    start_date: 0850
    highlight_event_id: guji-段公路-event-birth
  - key: breakthrough
    name: 结衔京兆万年县尉
    labels:
      zh: 守官
    start_date: 0868
    highlight_event_id: guji-段公路-event-renwei
  - key: climax
    name: 请右拾遗陆希声为序作证
    labels:
      zh: 请序
    start_date: 0870
    highlight_event_id: guji-段公路-event-chengshu
  - key: closure
    name: 北户录三卷征引佚书传后
    labels:
      zh: 传书
    start_date: 0871
    highlight_event_id: guji-段公路-event-chengshu
  decisions:
  - date: 0870
    title_zh: 请陆希声序以为证
    rationale: 陆曾从事岭南备核其实，得其证则书之风土物产皆可考验，异于近世小说诞妄
  - date: 0871
    title_zh: 广征淮南万毕术南越志等佚书为注
    rationale: 藉征引以见一二，又考张华博物志真伪，使物产条下典赡可传
events:
- id: guji-段公路-event-birth
  date: 0830
  year_of: 830
  title_zh: 出生于段氏
  description: 为宰相邹平公段文昌之孙，或言东牟人，或言临淄人，生年不详，自幼爱以指画地，六七岁受学强力不罢，尤长仄僻之学
  place_zh: 东牟
- id: guji-段公路-event-nanyou
  date: 0860
  year_of: 860
  title_zh: 以事南游五岭采风
  description: 南游五岭间，采民风土俗饮食衣制歌谣哀乐之异于中夏者，及草木果蔬虫鱼羽毛瑰形诡状，毕载无遗
  place_zh: 五岭
- id: guji-段公路-event-renwei
  date: 0868
  year_of: 868
  title_zh: 官京兆万年县尉
  description: 据书首结衔知官京兆万年县尉，历仕始末不可考，以文学世其家，状貌似邹平公
  place_zh: 京兆
- id: guji-段公路-event-gaoliang
  date: '0869-06-01'
  year_of: 869
  title_zh: 咸通十年历高凉雷州
  description: 咸通十年往高凉次青山镇见黄绯猨，夏初见三木舶载五色鹦鹉至，至雷州对岸见孔雀毛色金翠虵与真红虵及白虵入榕藤窍，亲验鹦鹉瘴诸事
  place_zh: 高凉
- id: guji-段公路-event-chengshu
  date: 0870
  year_of: 870
  title_zh: 著成北户录请陆希声序
  description: 著北户录三卷，载岭南风土物产，征引广志南越志等诸书，请右拾遗内供奉陆希声序以为证，题登仕郎前参军龟图注文
  place_zh: 岭南
- id: guji-段公路-event-death
  date: 0890
  year_of: 890
  title_zh: 卒
  description: 卒年不详，约九世纪晚期，书作北户杂录者疑传写误衍杂字，学海类编仅存一卷非完本
