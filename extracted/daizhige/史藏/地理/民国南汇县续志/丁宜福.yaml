  - 教养偏废而风气日偷如何转移
  - 农夫最苦而雇工游惰如何直书
  lesson: 以朴学记风俗，以诗歌存农艰，教养并重可移风
  summary_first_person: 我为南汇人，见粤匪平后元气渐苏，至光绪中叶村落相望，又见衿董鱼肉散工游惰，故以恭桑录记塾学农事，以挞花谣刺黄梅雇工，欲以教养转移风气
