      - 成书
      - 风俗
    start_date: '1890'
    highlight_event_id: guji-丁宜福-event-1
  decisions:
  - date: '1885'
    title_zh: 以寸许红笺识方字法入录
    rationale: 儿童入塾先识方字后授小书四书，志得意满不复求学，须直书记其得失
  - date: '1890'
    title_zh: 以农夫做卯时纺织三鼓记农苦
    rationale: 农夫最勤亦最苦，全家沾体涂足，妇女纺纱至三鼓，不录则劳逸不均无以劝
- id: guji-丁宜福-endeavor-2
  title_zh: 作挞花谣刺黄梅雇工游惰
  summary: 记散工梅花肉八集烟喝酒诸习，伤农事勤惰不均
  phases:
  - key: brewing
    name: 察散工早饱晚归
    labels:
      zh:
      - 踏查
      - 农雇
    start_date: '1890'
    highlight_event_id: guji-丁宜福-event-2
  - key: breakthrough
    name: 黄梅招工价增至三百文
    labels:
      zh:
      - 黄梅
      - 工价
    start_date: '1892'
    highlight_event_id: guji-丁宜福-event-2
  - key: climax
    name: 成挞花谣以讽游惰
    labels:
      zh:
      - 诗歌
      - 讽谕
    start_date: '1895'
    highlight_event_id: guji-丁宜福-event-2
  decisions:
  - date: '1892'
    title_zh: 直录梅花肉八烟三餐酒食之例
    rationale: 散工日上三竿始往，一日力作不满三时，坐吸八次夜必醉饱，须据实以警惰农
  - date: '1895'
    title_zh: 以谣体述孩童稚女草根未断花先死
    rationale: 黄梅多雨草裹棉花，工如病牛鞭不前，借韵语使乡人易传易戒
events:
- id: guji-丁宜福-event-birth
  title_zh: 生于南汇
  date: '1840'
  year_of: 1840
  description: 清道光咸丰间生于南汇，海滨农耕之家，约当粤匪平前
- id: guji-丁宜福-event-1
  title_zh: 南浦恭桑录记塾学农事成
  date: '1890'
  year_of: 1890
  description: 记识方字小书四书制义，记农夫做卯时踏车纺织，记田家肥料豆饼河泥水草，为后世续志所引
- id: guji-丁宜福-event-2
  title_zh: 作挞花谣记黄梅雇工
  date: '1895'
  year_of: 1895
  description: 记散工梅花肉五方蔬菜鱼蛋酒食，记工价增至三百文，孩童稚女一齐下田，叹工如病牛一粥三餐八集烟
- id: guji-丁宜福-event-death
  title_zh: 卒于南汇
  date: '1910'
  year_of: 1910
  description: 约宣统前后卒于乡里，其书节文存于民国南汇县续志卷十八风俗志一
