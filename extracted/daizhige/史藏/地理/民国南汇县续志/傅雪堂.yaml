  - key: breakthrough
    name: 收成倍增鄉人取則
    labels:
      zh:
      - 稀植增產
    start_date: 1908
    highlight_event_id: guji-傅雪堂-event-1
  - key: climax
    name: 蒙農工商部給匾嘉獎
    labels:
      zh:
      - 給匾嘉獎
    start_date: 1910
    highlight_event_id: guji-傅雪堂-event-2
