  - date: 1905
    title_zh: 改密為稀
    rationale: 稀則通風透光枝鈴繁茂以省種增收
  - date: 1908
    title_zh: 中開早開選留為種
    rationale: 早開核不堅晚開經霜嫩弱惟中間最壯可為來歲之種
- id: guji-傅雪堂-endeavor-2
  title_zh: 纂述改良種棉法
  summary: 總結麥棉兼營藏種選種作畦治田之法著為一書以惠鄉邦
  phases:
  - key: brewing
    name: 積累麥棉經驗
    labels:
      zh:
      - 麥棉兼營
    start_date: 1908
    highlight_event_id: guji-傅雪堂-event-2
  - key: breakthrough
    name: 著書初具規模
    labels:
      zh:
      - 纂述成書
    start_date: 1911
    highlight_event_id: guji-傅雪堂-event-3
  - key: climax
    name: 改良種棉法刊行
    labels:
      zh:
      - 刊行傳播
    start_date: 1912
    highlight_event_id: guji-傅雪堂-event-3
  - key: closure
    name: 鄉人奉為種棉指南
    labels:
      zh:
      - 惠及鄉里
    start_date: 1915
    highlight_event_id: guji-傅雪堂-event-3
  decisions:
  - date: 1911
    title_zh: 分門纂述種棉要法
    rationale: 辨地藏種選種培壅作畦播種治田選苗治蟲脫法摘頭收利皆當明示以便農人
  - date: 1912
    title_zh: 刊布一書公諸同業
    rationale: 獨善不如眾善欲使浦東棉農共知改良以振實業
