  date: 1910
  year_of: 1910
  description: 以改良種棉著績蒙農工商部給匾嘉獎鄉里榮之
- id: guji-傅雪堂-event-3
  title_zh: 著改良種棉法一書
  date: 1912
  year_of: 1912
