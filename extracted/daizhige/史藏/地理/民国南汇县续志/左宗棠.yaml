    title_zh: 坚持先塞后海缓海急塞
    rationale: 新疆不复则陕甘不固塞防系国家根本海防可缓图而西陲不可失
  - date: 1866-06-01
    title_zh: 创设福州船政学堂造船练水师
    rationale: 师夷长技以制夷自造轮船自练水师方能永固海防不徒恃渔团乡勇
