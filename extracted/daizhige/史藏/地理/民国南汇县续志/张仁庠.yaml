person:
  qid: guji-张仁庠
  name_zh: 张仁庠
  names:
    zh: 张仁庠
    en: Zhang Renxiang
  era: 清末
  reign_ref: 光绪至宣统
  archetype: 乡里兴学者
  dilemmas:
  - 以祠庙香火之地改作学堂与存留旧俗之两难
  - 分校散布乡野而经费师资难以兼顾
  lesson: 以庙产祠款化为学产分校相维足令乡学绵延
  summary_first_person: 吾南汇邑人当废科举兴学堂之际于六灶借祠创持正小学复设两分校又分设沙涂以庙田养士欲令乡里子弟皆有所学
  source_urls:
