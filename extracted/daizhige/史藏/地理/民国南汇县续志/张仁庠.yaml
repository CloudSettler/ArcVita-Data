  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E6%B0%91%E5%9B%BD%E5%8D%97%E6%B1%87%E5%8E%BF%E7%BB%AD%E5%BF%97/%E5%8D%B707.md
endeavors:
- id: guji-张仁庠-endeavor-1
  title_zh: 创办持正小学堂并设两分校
  summary: 于六灶借节母孝子祠设持正小学后再设严家桥第一分校及大丁宅第二分校以成乡学体系
  phases:
  - key: brewing
    name: 筹借祠堂办学
    labels:
      zh:
      - 筹设
    start_date: 1904-07
    highlight_event_id: guji-张仁庠-event-1
  - key: breakthrough
    name: 持正小学开学
    labels:
      zh:
      - 创办
    start_date: 1904-07
    highlight_event_id: guji-张仁庠-event-1
  - key: climax
    name: 增设严家桥第一分校
    labels:
      zh:
      - 扩张
    start_date: 1906-01
    highlight_event_id: guji-张仁庠-event-2
  - key: closure
    name: 再设大丁宅第二分校
    labels:
      zh:
      - 成体系
    start_date: 1909-02
    highlight_event_id: guji-张仁庠-event-3
  decisions:
  - date: 1904-07
    title_zh: 借张氏节母孝子祠创持正校
    rationale: 因祠宇宽敞便聚徒讲学又以节孝之名劝勉乡里
  - date: 1906-01
    title_zh: 于严家桥陆家庙设第一分校
    rationale: 为就近收徒免远途跋涉故分设以广覆盖
  - date: 1909-02
    title_zh: 与丁达行合设第二分校
    rationale: 联合乡人分担经费师资令大丁一带童蒙有归
- id: guji-张仁庠-endeavor-2
  title_zh: 由持正分设沙涂小学堂
  summary: 于宣统二年由持正校分设沙涂校以沙涂庙田充校产立案收租养学
  phases:
  - key: brewing
    name: 清查沙涂庙田
    labels:
      zh:
      - 筹产
    start_date: 1910-01
    highlight_event_id: guji-张仁庠-event-4
  - key: breakthrough
    name: 分设沙涂校
    labels:
      zh:
      - 分设
    start_date: 1910-01
    highlight_event_id: guji-张仁庠-event-4
  - key: climax
    name: 以庙田租入充常费
    labels:
      zh:
      - 养学
    start_date: 1910-01
    highlight_event_id: guji-张仁庠-event-4
  - key: closure
    name: 田单立案可考
    labels:
      zh:
      - 立案
    start_date: 1910-01
    highlight_event_id: guji-张仁庠-event-4
  decisions:
  - date: 1910-01
    title_zh: 以沙涂庙田充校产分设新校
    rationale: 因庙有闲田七十余亩散处各啚收租足供束脩故化香火为学田
  - date: 1910-01
    title_zh: 田单立案以垂久远
    rationale: 恐日后侵占故将二十二纸田单立案存考使经费有据
