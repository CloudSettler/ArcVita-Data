  summary: 幼從姚煒琥博覽元和惠氏歙江氏海陽戴氏嘉定錢氏之書取九經三禮博稽約考佐錢熙祚兄弟輯守山閣叢書諸集精天算折服西儒
  phases:
  - key: brewing
    name: 幼從姚煒琥啟蒙問學
    labels:
      zh: 啟蒙
    start_date: '1818'
    highlight_event_id: guji-張文虎-event-study
  - key: breakthrough
    name: 博覽惠江戴錢悟學本原
    labels:
      zh: 悟道
    start_date: '1830'
    highlight_event_id: guji-張文虎-event-study
  - key: climax
    name: 佐錢氏輯叢書精天算
    labels:
      zh: 校書
    start_date: '1848'
    highlight_event_id: guji-張文虎-event-congshu
  - key: closure
    name: 質疑西儒歎為專家莫及
    labels:
      zh: 會通
    start_date: '1862'
    highlight_event_id: guji-張文虎-event-congshu
  decisions:
  - date: '1848'
    title_zh: 佐錢熙祚輯守山閣叢書
    rationale: 假館借書以博稽約考成融會貫通之業不以客授南塘為足
  - date: '1862'
    title_zh: 以中法明天算折服西儒
    rationale: 守九經三禮注疏為本原不以外來新說搖經訓根基
- id: guji-張文虎-endeavor-2
  title_zh: 入幕治書與書院講席
  summary: 同治癸酉入曾文正幕綰內軍械局佐校王船山遺書理江南官書局纂修華亭奉賢南匯三志主南菁書院辭尊經聘以老病終
  phases:
  - key: brewing
    name: 入曾文正幕綰內軍械局
    labels:
      zh: 入幕
    start_date: '1873'
    highlight_event_id: guji-張文虎-event-mumu
  - key: breakthrough
    name: 佐校船山遺書理江南官書局
    labels:
      zh: 治書
    start_date: '1874'
    highlight_event_id: guji-張文虎-event-guanshu
  - key: climax
    name: 纂修三志主南菁課士
    labels:
      zh: 設教
    start_date: '1879'
    highlight_event_id: guji-張文虎-event-guanshu
  - key: closure
    name: 辭尊經聘卒於松郡復園
    labels:
      zh: 守節
    start_date: 1885-01
    highlight_event_id: guji-張文虎-event-death
  decisions:
  - date: '1873'
    title_zh: 就曾文正聘綰軍械佐校書
    rationale: 以謹嚴文獻之長佐軍興文治兼全不以沈默謙和辭劇任
  - date: '1880'
    title_zh: 就南菁講席辭尊經書院
    rationale: 老病量力以經義詞章課江陰士子不以遠聘榮名易晚節
events:
- id: guji-張文虎-event-birth
  type: birth
  title_zh: 生於周浦
  date: '1808'
  year_of: 1808
  description: 嘉慶間生於周浦幼從同里姚煒琥游家貧幾廢學得曲成始弱冠客授南塘
- id: guji-張文虎-event-study
  type: career
  title_zh: 博覽諸家悟為學本原
  date: '1830'
  year_of: 1830
  description: 課餘博覽元和惠氏歙江氏海陽戴氏嘉定錢氏所著書取九經三禮漢唐宋人注疏博稽約考融會貫通
- id: guji-張文虎-event-congshu
  type: career
  title_zh: 佐錢氏輯叢書精天算
  date: '1848'
  year_of: 1848
  description: 佐金山錢熙祚輯守山閣叢書復為其弟熙輔校續藝海珠塵諸集精天算術西儒艾約瑟偉烈亞力造廬質疑歎為非彼國專家所能及
- id: guji-張文虎-event-mumu
  type: career
  title_zh: 入曾文正幕綰內軍械局
  date: '1873'
  year_of: 1873
  description: 同治癸酉入總督曾文正公幕綰內軍械局時忠襄方在安慶校刊王船山遺書與劉毓嵩督理其事
- id: guji-張文虎-event-guanshu
  type: career
  title_zh: 理江南官書局纂志主南菁
  date: '1874'
  year_of: 1874
  description: 合肥李文忠總制兩江延與周學濬管理江南官書局纂修華亭奉賢及本邑志謹嚴有法黃體芳創南菁書院聘主教席以經義詞章課士蜀督吳棠聘主尊經講席以老病辭
- id: guji-張文虎-event-death
  type: death
  title_zh: 卒於松郡復園
  date: 1885-02
  year_of: 1885
  description: 光緒乙酉正月卒於松郡復園所著見藝文子錫卣至孝冒暑省父病暍而殁
