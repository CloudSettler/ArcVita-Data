  summary_first_person: 吾居周浦少貧從姚煒琥游博覽惠江戴錢諸家之書悟為學本原取九經三禮漢唐宋注疏博稽約考佐錢氏輯叢書精天算使西儒嘆服入曾文正幕綰軍械佐校船山遺書理江南官書局纂修華亭奉賢南匯三志主南菁書院課士以經義終老病辭川聘卒於松郡
