  birth_date: '1311'
  death_date: '1360'
  era: 元
  reign_ref: 元惠宗至正年间
  archetype: 航海旅行家
  dilemmas:
  - 远洋风涛生死难测与遍历海外求真记述之间的取舍
  - 亲历见闻繁杂琐碎与提纲挈领成书立说之间的权衡
  lesson: 亲历四方始能成信史，遍历险远而记录不辍，方为后人开眼看世界之先声
  summary_first_person: 我是汪大渊，南昌人，元代航海旅行家，我两度随商舶远航，南抵爪哇苏禄，北至琉球彭湖，西过天竺洋面，遍历南洋西洋百余地，归而撰成岛夷志略百条，以记山川风土物产贸易，愿以亲历所得为后人留一海外信史
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/地理/岛夷志略.md
  - https://daizhige.org/史藏/地理/岛夷志略.html
endeavors:
- id: guji-汪大渊-endeavor-1
  title_zh: 两度远航遍历南洋西洋
  summary: 自泉州庆元登舶，两次随商舶远下西洋，历彭湖琉球占城真腊三佛齐爪哇等地，观风土物产贸易
  phases:
  - key: brewing
    name: 南昌力学候舶泉州
    labels:
      zh: 启程酝酿
    start_date: '1328'
    highlight_event_id: guji-汪大渊-event-birth
  - key: breakthrough
    name: 首航南洋历交趾占城
    labels:
      zh: 首航突破
    start_date: '1330'
    highlight_event_id: guji-汪大渊-event-1330
  - key: climax
    name: 再航远抵西洋群岛
    labels:
      zh: 远航高峰
    start_date: '1337'
    highlight_event_id: guji-汪大渊-event-1337
  - key: closure
    name: 安返整理海闻
    labels:
      zh: 归来收束
    start_date: '1339'
    highlight_event_id: guji-汪大渊-event-1339
  decisions:
  - date: '1330'
    title_zh: 随商舶首下南洋
    rationale: 慕海外风土，乘泉州商舶之便，冒风涛以求亲历见闻
  - date: '1337'
    title_zh: 再航远涉西洋
    rationale: 首航未尽大观，复随舶西行，穷极岛夷之地以补前阙
- id: guji-汪大渊-endeavor-2
  title_zh: 撰成岛夷志略百条
  summary: 以两航亲历为据，参以舶人番商之言，于至正年间撰成岛夷志略，记百地山川气候风俗物产贸易
  phases:
  - key: brewing
    name: 归来搜集舶人旧闻
    labels:
      zh: 撰述酝酿
    start_date: '1340'
    highlight_event_id: guji-汪大渊-event-1339
  - key: breakthrough
    name: 草创百条体例
    labels:
      zh: 体例初定
    start_date: '1346'
    highlight_event_id: guji-汪大渊-event-1349
  - key: climax
    name: 至正己丑成书刊行
    labels:
      zh: 成书高峰
    start_date: '1349'
    highlight_event_id: guji-汪大渊-event-1349
  - key: closure
    name: 海内流传为航海指南
    labels:
      zh: 流传收束
    start_date: '1350'
    highlight_event_id: guji-汪大渊-event-death
  decisions:
  - date: '1346'
    title_zh: 以亲历为主兼采众言成书
    rationale: 恐海闻失真，故以目验为纲，以舶人番贾之言为辅，务求信实
  - date: '1349'
    title_zh: 自序标明两航本末以取信
    rationale: 明言两次随舶所至，使读者知所从来，不敢虚饰，以存信史之体
events:
