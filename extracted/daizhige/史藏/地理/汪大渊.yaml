  title_zh: 撰成岛夷志略
  place: 南昌
  description: 至正己丑撰成岛夷志略一卷百条，记海外诸国地理气候风俗物产贸易，为元代海外地理名著
- id: guji-汪大渊-event-death
  date: '1360'
  year_of: 1360
  title_zh: 元末明初去世
  place: 南昌
  description: 成书之后行事不详，于元末明初之际去世，其书流传海内为后世航海地理所宗
