  year_of: 1337
  title_zh: 再次远航遍历西洋
  place: 龙牙门
  description: 再随商舶由龙牙门西行，历三佛齐爪哇重迦罗苏禄勃泥等地，远涉大洋，穷极岛夷
- id: guji-汪大渊-event-1339
  date: '1339'
