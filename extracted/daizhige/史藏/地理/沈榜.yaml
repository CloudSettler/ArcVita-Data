endeavors:
- id: guji-沈榜-endeavor-1
  title_zh: 历官四邑亲民施政
  summary: 自内乡历东明上元以至宛平，因掌故籍行，讲求擘划，救弊补偏
  phases:
  - key: brewing
    name: 初授内乡讲求掌故
    labels:
      zh: 亲民籍行
    start_date: 1577
    highlight_event_id: guji-沈榜-event-1
  - key: breakthrough
    name: 历东明上元润饰功令
    labels:
      zh: 外县陪京历练
    start_date: 1583
    highlight_event_id: guji-沈榜-event-2
  - key: climax
    name: 复除宛平总理畿邑
    labels:
      zh: 辇毂首邑
    start_date: 1590
    highlight_event_id: guji-沈榜-event-3
  - key: closure
    name: 施设明备按籍有据
    labels:
      zh: 导利除害发奸剔垢
    start_date: 1592
    highlight_event_id: guji-沈榜-event-4
  decisions:
  - date: 1590
    title_zh: 受事宛平随事讲求
    rationale: 县无志而案牍茫然，访公卿故老，兴废举坠皆附类记录
  - date: 1592
    title_zh: 不立义例杂录见闻
    rationale: 不敢自居作志，聊识见闻以备掌故，俟后来增益
- id: guji-沈榜-endeavor-2
  title_zh: 纂修宛署杂记二十卷
  summary: 取署中行之有据言之足征者，随事记录，命吏缮为二十卷，自宣谕至志遗
  phases:
  - key: brewing
    name: 搜辑残篇疏牍访询
    labels:
      zh: 博求掌故
    start_date: 1590
    highlight_event_id: guji-沈榜-event-3
  - key: breakthrough
    name: 分卷列类录存宣谕县始
    labels:
      zh: 识以达政
    start_date: 1591
    highlight_event_id: guji-沈榜-event-4
  - key: climax
    name: 盈帙缮写成二十卷
    labels:
      zh: 聊备采择
    start_date: 1592
    highlight_event_id: guji-沈榜-event-4
  - key: closure
    name: 自序见日堂传示后人
    labels:
      zh: 甘心敝帚
    start_date: 1592-02-09
    highlight_event_id: guji-沈榜-event-4
  decisions:
  - date: 1591
    title_zh: 录存正德以来宣谕
    rationale: 重农宣谕月一举行，嘉隆后雇役倒包，录存者以见德意盛衰
  - date: 1592-02-09
    title_zh: 书自序于见日堂
    rationale: 明不敢言志而又不忍无志之意，冀后人因志垂石画
events:
- id: guji-沈榜-event-birth
  title_zh: 生于浙中
  date: 1545
  year_of: 1545
  description: 明嘉靖间生，长而博求掌故，识户口阨塞风俗政治
- id: guji-沈榜-event-1
  title_zh: 授内乡历东明知县
  date: 1577
  year_of: 1577
  description: 初授官内乡，历东明，因掌故籍行，以润饰功令
- id: guji-沈榜-event-2
  title_zh: 晋上元后复除宛平
  date: 1590
  year_of: 1590
  description: 既晋陪京上元，及复除宛平，列辇毂下，按籍茫然，随事讲求擘划
- id: guji-沈榜-event-3
  title_zh: 任宛平知县总理县务
  date: 1591
  year_of: 1591
  description: 访公卿大夫编氓故老，考宣谕县始职官山川赋役诸务，皆以类附见
- id: guji-沈榜-event-4
  title_zh: 成宛署杂记自序见日堂
  date: 1592-02-09
  year_of: 1592
  description: 万历壬辰人日书自序于宛署见日堂，杂记二十卷成，传子孙以备采择
- id: guji-沈榜-event-death
  title_zh: 卒于万历末年后
  date: 1615
  year_of: 1615
  description: 去宛平后行迹无考，约卒于万历末泰昌间，杂记独行于世
