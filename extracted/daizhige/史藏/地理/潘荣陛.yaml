  summary_first_person: 余大兴潘荣陛字在廷甫自辛亥秋从事禁庭癸丑冬奉置史馆叨窥内府金匮石室之秘又恭膺宫阙制作督销晨入夜出少暇丙寅冬告养归来随意记录成帙又念皇都品汇万方岁时令节远迈前古乃以耳目之余汇为帝京岁时纪胜以记熙朝景物仪文之盛
