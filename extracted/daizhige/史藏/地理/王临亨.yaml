    title_zh: 非亲见亲接者弗纪
    rationale: 志实不志虚，使读者挹名区于几席而无谬悠之辞
  - date: 1605-01-01
    title_zh: 以萧然之橐付剞劂公海内
    rationale: 不取陆贾千金装，独以百金剑之编遗好事卧游猎异者
events:
