  summary_zh: 明隆庆万历年间生于王氏，字止之，后官刑部比部。
- id: guji-王临亨-event-death
  title_zh: 逝世
  date: 1625-01-01
  year_of: 1625
  summary_zh: 明天启年间卒，遗粤剑编四卷行于世。
- id: guji-王临亨-event-1
  title_zh: 万历辛丑奉命虑囚岭南
  date: 1601-02-01
  year_of: 1601
  place_zh: 广东广州
  summary_zh: 以刑部比部奉命虑囚岭南，遍历清远韶州惠州潮州诸郡。
- id: guji-王临亨-event-2
  title_zh: 释珠盗六十余人死
  date: 1601-06-01
  year_of: 1601
  place_zh: 广州
  summary_zh: 以片言柔中贵人，顷刻释珠盗六十余人之死，时比陆贾使粤之功。
- id: guji-王临亨-event-3
