  - date: 1601-06-01
    title_zh: 片言释珠盗六十余人死
    rationale: 不忍以爰书旁午轻决人命，柔中于片言而脱众生于锋镝
  - date: 1601-08-01
    title_zh: 议红毛鬼别居一澳许互市
    rationale: 以诮中国无穷之衅而收外夷不赀之利，效陆贾使粤之功
