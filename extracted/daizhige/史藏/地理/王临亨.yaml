  year_of: 1601
  place_zh: 濠镜澳
  summary_zh: 酌议红毛鬼别居一澳，许之互市，以弭衅而收利。
- id: guji-王临亨-event-4
  title_zh: 汇成粤剑编四卷付梓
  date: 1605-01-01
  year_of: 1605
  place_zh: 金陵
  summary_zh: 举南粤古迹名胜时事土风物产艺术外夷游览八类为四卷，名粤剑编，叔父王安鼎为叙付梓。
