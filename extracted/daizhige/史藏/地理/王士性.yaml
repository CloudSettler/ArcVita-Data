  dilemmas:
  - 足迹遍海内而病倦难尽记，欲以笔补游之不足
  - 耳闻与目见难两全，辑录四夷恐失实而不忍尽阙
  lesson: 以足版亲历核山川边储，以耳目心三证补旧说，见闻则书不见则阙
  summary_first_person: 余已遍海内五岳及名山大川，病而倦游，追忆行踪先为广游志又绎为广志六卷，身所见闻则书，不则宁阙如
