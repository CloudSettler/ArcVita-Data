    start_date: 0897
    highlight_event_id: guji-王审知-event-897-jiedushi
  decisions:
  - date: 0893
    title_zh: 受潮命率兵攻范晖
    rationale: 陈岩卒后范晖据福州自立，不讨则闽中分裂，故以偏师取福州以一统闽地
  - date: 0897
    title_zh: 嗣兄镇福州受威武节度
    rationale: 王潮卒后军中无主，若让则生乱，故承制守土，受唐命以安众心
- id: guji-王审知-endeavor-2
  title_zh: 俭约治闽进封闽王兴学
  summary_zh: 据福州后俭约礼士，加中书令进封闽王，升福州为大都督府，建四门学校拔闽士
  phases:
  - key: brewing
    name: 初镇福州安集流散
