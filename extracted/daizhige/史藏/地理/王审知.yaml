  - key: breakthrough
    name: 梁加中书令进封闽王
    labels:
      zh: 封王突破
    start_date: 0909
    highlight_event_id: guji-王审知-event-909-minwang
  - key: climax
    name: 建四门学校拔秀俭治
    labels:
      zh: 文治高潮
    start_date: 0910
    highlight_event_id: guji-王审知-event-909-minwang
  - key: closure
    name: 同光三年卒谥忠懿
    labels:
      zh: 善终收局
    start_date: 0925
    highlight_event_id: guji-王审知-event-death
  decisions:
  - date: 0909
    title_zh: 受梁封为闽王守土不僭帝
    rationale: 中原梁唐迭兴，闽僻远难争鼎，故安于王爵以保境，不称帝以避祸
  - date: 0910
    title_zh: 建四门学校礼拔闽士
    rationale: 闽地久乱文教不振，起列校者欲得人心，非兴学俭约不能长守，故以文儒汇征补武功之不足
