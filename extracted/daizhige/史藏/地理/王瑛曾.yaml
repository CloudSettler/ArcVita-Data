    highlight_event_id: guji-王瑛曾-event-xiuzhi
  decisions:
  - date: '1760'
    title_zh: 到凤即厘便民与不便民之政
    rationale: 海疆初辟法制未备，必先兴除以安四境，方能推行教化
  - date: '1763'
    title_zh: 仰体道府整饬之意黾勉佐理
    rationale: 道府皆清德名贤具赵尹韩张之风，佐理其治可冀风俗渐纯
- id: guji-王瑛曾-endeavor-2
  title_zh: 厘订旧志重修凤山县志
  summary_zh: 感旧志草昧因陋，延黄佾卓肇昌参校，参府志鄙见定十二则凡例，自秋徂冬成书十二卷
  phases:
  - key: brewing
    name: 调凤即慨然有修辑志愿
