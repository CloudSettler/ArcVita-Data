    labels:
      zh: 道府倡修
    start_date: '1762'
    highlight_event_id: guji-王瑛曾-event-fengshan
  - key: climax
    name: 延黄卓共参校自秋徂冬
    labels:
      zh: 参校纂辑
    start_date: '1763'
    highlight_event_id: guji-王瑛曾-event-xiuzhi
  - key: closure
    name: 仲春书成请序付梓
    labels:
      zh: 告成付梓
    start_date: '1764'
    highlight_event_id: guji-王瑛曾-event-xiuzhi
  decisions:
  - date: '1763'
    title_zh: 不仍旧贯而取材旧史纬以新裁
    rationale: 旧志分纲别目繁简不称且阙山川土赋番俗，必更革体例方能纲举目张
  - date: '1763'
    title_zh: 延侯官黄佾本邑卓肇昌共参校
    rationale: 非得淹通博洽远绍旁搜则诬与野难免，借道府之力延名贤以成其事
