  dilemmas:
  - 誓志灭吴效忠新朝与安保陇右乡里之难
  - 沙场立威与身后荫子遗泽之难
  lesson: 以勇决胜以忠成名功归朝廷泽被乡土
  summary_first_person: 吾生于屈吴山下马营水堡，少经离乱，投军效力，誓灭吴三桂，夜渡黄河，转战秦陇，蒙恩授奋威将军，殁后归葬池东屈吴山北，愿子孙忠勇相继，乡土安宁。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E6%8B%89%E6%B1%A0%E5%8E%BF%E4%B8%9E%E5%BF%97.html
endeavors:
- id: guji-王进宝-endeavor-1
  title_zh: 誓志灭吴转战立功
  summary_zh: 自马营出身投军效力康熙，参与平定吴三桂之乱，夜渡黄河，屡建战功，授奋威将军。
  phases:
  - key: brewing
    name: 马营出身投军陇右
    labels:
      zh: 出身行伍
    start_date: '1662'
    highlight_event_id: guji-王进宝-event-1
  - key: breakthrough
    name: 誓灭吴夜渡黄河
    labels:
      zh: 灭吴立功
    start_date: '1674'
    highlight_event_id: guji-王进宝-event-2
  - key: climax
    name: 授奋威将军镇守西北
    labels:
      zh: 封爵镇守
    start_date: '1680'
    highlight_event_id: guji-王进宝-event-3
  - key: closure
    name: 病卒归葬屈吴山
    labels:
      zh: 归葬故山
    start_date: '1685'
    highlight_event_id: guji-王进宝-event-death
  decisions:
  - date: '1674'
    title_zh: 誓志灭吴投效进剿
    rationale: 吴三桂据乱，钟灵屈吴山，预为谶兆，故决意从军西进以报国恩
  - date: '1680'
    title_zh: 镇守西北安抚军民
    rationale: 战后地方残破，需以威重镇抚，使流移复业，通道安宁
- id: guji-王进宝-endeavor-2
  title_zh: 归葬屈吴荫及子孙
  summary_zh: 殁后钦赐造葬归葬打拉池屈吴山北，三代追赠一品，子孙世袭侍卫子爵，垂裕后昆。
  phases:
  - key: brewing
    name: 置买坟山营建茔域
    labels:
      zh: 营建茔域
    start_date: '1685'
    highlight_event_id: guji-王进宝-event-death
  - key: breakthrough
    name: 钦赐祭葬追赠三代
    labels:
      zh: 恩恤追赠
    start_date: '1685'
    highlight_event_id: guji-王进宝-event-3
  - key: climax
    name: 子孙侍卫世袭子爵
    labels:
      zh: 恩荫世袭
    start_date: '1686'
    highlight_event_id: guji-王进宝-event-4
  - key: closure
    name: 坟院碑坊传为胜迹
    labels:
      zh: 遗泽乡里
    start_date: '1908'
    highlight_event_id: guji-王进宝-event-4
  decisions:
  - date: '1685'
    title_zh: 遗命归葬虎形屈吴山
    rationale: 生于斯山，欲以体魄镇护乡土，使后人瞻仰忠勇有所矜式
  - date: '1686'
    title_zh: 以军功请荫子孙
    rationale: 以一生战功换子孙侍卫世职，使家门忠孝相继不绝
events:
- id: guji-王进宝-event-birth
  title_zh: 出生于马营水堡
  date: '1642'
  year_of: 1642
  place_zh: 甘肃马营水堡屈吴山下
  description_zh: 崇祯十五年生于马营水堡，相传屈吴山钟灵所生。
- id: guji-王进宝-event-1
  title_zh: 投军效力陇陕
  date: '1662'
  year_of: 1662
  place_zh: 陕甘
  description_zh: 少年投军，历行伍积功，渐为将领，驻防陇右一带。
- id: guji-王进宝-event-2
  title_zh: 誓志灭吴夜渡黄河
  date: '1674'
  year_of: 1674
  place_zh: 黄河西岸
  description_zh: 吴三桂反，誓志灭吴，夜渡黄河进剿，由此授首，立下大功。
- id: guji-王进宝-event-3
  title_zh: 授奋威将军赐葬祭
  date: '1680'
  year_of: 1680
  place_zh: 京师及西北
  description_zh: 以功授太子太保奋威将军，妻孙氏封一品夫人，三代皆赠荣禄大夫。
- id: guji-王进宝-event-4
  title_zh: 子孙恩荫世袭一等子
  date: '1686'
  year_of: 1686
  place_zh: 打拉池屈吴山
  description_zh: 子用宾赐侍卫，孙辈授参将游击，五世孙王永世袭一等子爵，六世以下相继袭爵为副将侍卫。
- id: guji-王进宝-event-death
  title_zh: 卒后归葬屈吴山北
  date: '1685'
  year_of: 1685
  place_zh: 打拉池东十里屈吴山北
  description_zh: 康熙二十四年卒，钦赐造葬，与妻孙氏合葬池东屈吴山北，立谕祭碑神道碑石坊翁仲。
