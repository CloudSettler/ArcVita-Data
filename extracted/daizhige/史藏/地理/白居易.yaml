endeavors:
- id: guji-白居易-endeavor-1
  title_zh: 钱塘湖水利整饬
  summary: 察钱塘湖蓄泄之宜，定放水溉田节限，修堤通井，禁盗泄，勒石垂训
  phases:
  - key: brewing
    name: 到杭履任究湖利害
    labels:
      zh: 履任察访
    start_date: 0822-07-01
    highlight_event_id: guji-白居易-event-appoint
  - key: breakthrough
    name: 定节限量尺寸放水
    labels:
      zh: 定法节水
    start_date: 0823-04-01
    highlight_event_id: guji-白居易-event-lake-law
  - key: climax
    name: 修筑湖堤加高蓄水
    labels:
      zh: 修堤蓄水
    start_date: 0824-01-01
    highlight_event_id: guji-白居易-event-lake-law
  - key: closure
    name: 勒石记湖事示来者
    labels:
      zh: 勒石垂训
    start_date: 0824-03-10
    highlight_event_id: guji-白居易-event-hushiji
  decisions:
  - date: 0823-06-01
    title_zh: 旱岁经州陈状即日给水
    rationale: 若待状入司符下县动经旬日，旱苗无及，故自便押帖即日与水以活民命
  - date: 0824-03-10
    title_zh: 不文其言书于石
    rationale: 恐来者不知湖之利害，故直书四条使读者易晓，堤防如法则千顷无凶年
- id: guji-白居易-endeavor-2
  title_zh: 冷泉亭山水纪胜
  summary: 品第余杭灵隐山水，以冷泉亭为甲，继五亭之后述而不作
  phases:
  - key: brewing
    name: 览余杭郡山水形胜
    labels:
      zh: 览胜品第
    start_date: 0822-09-01
    highlight_event_id: guji-白居易-event-appoint
  - key: breakthrough
    name: 察冷泉亭撮奇得要
    labels:
      zh: 察亭得要
    start_date: 0823-05-01
    highlight_event_id: guji-白居易-event-lengquanji
  - key: climax
    name: 继五亭之后作记
    labels:
      zh: 继述作记
    start_date: 0823-08-13
    highlight_event_id: guji-白居易-event-lengquanji
  - key: closure
    name: 以山水之清涤尘垢垂教
    labels:
      zh: 文记垂教
    start_date: 0823-08-13
    highlight_event_id: guji-白居易-event-lengquanji
  decisions:
  - date: 0823-08-13
    title_zh: 继五亭述而不作
    rationale: 佳景殚能事毕，后来虽有敏心巧目无所加，故但作记以存其胜而不别创
  - date: 0823-08-13
    title_zh: 标冷泉为余杭之最
    rationale: 其水粹冷柔滑能蠲烦析酲除眼耳尘垢，故定为最余杭而甲灵隐以导和畅气
events:
- id: guji-白居易-event-birth
  date: 0772-02-20
  year_of: 772
  type: birth
  title_zh: 出生于河南新郑
  description: 唐大历七年正月二十出生，后登进士第，历官翰林学士左拾遗
- id: guji-白居易-event-appoint
  date: 0822-07-01
  year_of: 822
  type: career
  title_zh: 出为杭州刺史
  description: 长庆二年出守杭州，领东南名郡，巡湖察俗，理水利兼存山水
- id: guji-白居易-event-lengquanji
  date: 0823-08-13
  year_of: 823
  type: career
  title_zh: 作冷泉亭记
  description: 长庆三年八月十三日记，称东南山水余杭为最，灵隐为尤，冷泉亭为甲，历叙虚白候仙观风见山及此亭五亭相望
- id: guji-白居易-event-lake-law
  date: 0823-06-01
  year_of: 823
  type: career
  title_zh: 定钱塘湖放水溉田法
  description: 别选公勤军吏立于田次湖次，据顷亩定时量尺寸节限放之，每减一寸可溉十五余顷
- id: guji-白居易-event-hushiji
  date: 0824-03-10
  year_of: 824
  type: career
  title_zh: 作钱塘湖石记
  description: 长庆四年三月十日记，在郡三年仍岁逢旱，究湖利害，列刺史要知四条，辨鱼龙茭菱六井之谬，禁盗泄，防堤溃，书于石
- id: guji-白居易-event-death
  date: 0846-09-08
  year_of: 846
  type: death
  title_zh: 卒于洛阳
  description: 唐会昌六年八月卒，赠尚书右仆射，谥文，与元稹并称元白，为新乐府运动倡导者
