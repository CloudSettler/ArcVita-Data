  - 放湖溉田活民与鱼龙茭菱小利之间如何取舍
  - 经州陈状即日给水与层层符牒稽延旱情之间如何决断
  lesson: 治湖须定节限蓄泄及时，更须不文其言勒石以示来者，方能利及千顷而垂久
  summary_first_person: 吾守杭三载，仍岁逢旱，尽究湖之利害，修堤蓄水，节限放溉，又记冷泉之胜，述而不作，以示来者，愿濒湖千顷无凶年也
