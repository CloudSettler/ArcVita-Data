  birth_date: '1279'
  death_date: '1351'
  era: 元
  reign_ref: 至治
  archetype: 博通经学的治河儒臣
  dilemmas:
  - 宋金二本得失互见丛杂纷纠，如何讨寻以便观览
  - 地形改易人事迁移古法未必可行，如何准今酌古变通参考
  lesson: 汇宋金旧典而削冗订舛，存矩矱以资实用而随宜变通
  summary_first_person: 吾系出西域，少学算数于真定，得都水监本，又得汴本沈立周俊之书，患其纷纠难寻，遂合而订之，分门析类，以资河务之用
