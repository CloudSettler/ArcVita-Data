    title_zh: 遍记赫哲住址卡伦古城里程
    rationale: 非明沿江虚实里道远近，不足以守边，故自富克锦城西南东北两路详考屯寨卡伦
  - date: 1850
    title_zh: 兼记荒地界堆可开官地晌数
    rationale: 边地守在人，人聚在食，惟丈明可垦荒地设界招垦，方可实边裕国
