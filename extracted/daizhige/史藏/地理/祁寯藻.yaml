    title_zh: 专治经史词章谋科第出身
    rationale: 惟科第可致用，非词林清望不足以进参大政，故力学登第为经世之基
  - date: 1841
    title_zh: 受命军机持重守正不附和
    rationale: 海疆事起，朝议纷纭，惟持重守阙可安社稷，不敢以轻进邀功误国
