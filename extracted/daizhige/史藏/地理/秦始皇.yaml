person:
  qid: guji-秦始皇
  name_zh: 秦始皇
  names:
    zh: 嬴政
    en: Qin Shi Huang
  lifespan:
    birth:
      date: '-259'
      precision: year
      is_circa: false
      raw: 秦昭襄王四十八年正月生于邯郸
    death:
      date: -210-07
      precision: month
      is_circa: false
      raw: 秦始皇三十七年七月崩于沙丘
  birth_date: '-259'
  death_date: -210-07
  era: 秦
  reign_ref: 秦王前246年至前221年，皇帝前221年至前210年
  archetype: 一统开创之君
  dilemmas:
  - 富强之后骄侈营缮与爱惜民力之衡
  - 凭藉武功速成大业与垂法久远之择
  lesson: 殚天下财力以事营缮则宫阙三月而烬，固本节用方能长安久治
  summary_first_person: 朕并灭六国而称始皇帝，徙天下豪富十二万户于咸阳，彻诸侯宫室作于北坂南临渭，殿屋复道周阁相属，又作信宫更名极庙以象天极，自极庙道骊山作甘泉前殿筑甬道，筑咸阳宫端门四达则紫宫，渭贯都以象天汉，横桥南渡以法牵牛，穷极奢侈而终见项羽烧宫三月火不灭，悲夫
  source_urls:
  - https://daizhige.org/史藏/地理/三辅黄图.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/地理/三辅黄图.md
endeavors:
