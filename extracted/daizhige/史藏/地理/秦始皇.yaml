endeavors:
- id: guji-秦始皇-endeavor-1
  title_zh: 统一六合建制称帝
  summary: 即秦王位而剪灭六国，并天下为郡县，称皇帝以定一统之基。
  phases:
  - key: brewing
    name: 即位理政蓄势
    labels:
      zh:
      - 蕴势
      - 理政
    start_date: '-246'
    highlight_event_id: guji-秦始皇-event-birth
  - key: breakthrough
    name: 剪灭列国
    labels:
      zh:
      - 攻灭
      - 扩展
    start_date: '-230'
    highlight_event_id: guji-秦始皇-event-unify
  - key: climax
    name: 并六合称皇帝
    labels:
      zh:
      - 统一
      - 称制
    start_date: '-221'
    highlight_event_id: guji-秦始皇-event-unify
  - key: closure
    name: 郡县天下同轨
    labels:
      zh:
      - 制度
      - 收束
    start_date: '-220'
    highlight_event_id: guji-秦始皇-event-unify
  decisions:
  - date: '-238'
    title_zh: 亲政除嫪毐吕不韦
    rationale: 收回权柄以专断国事，为并吞六国清内患。
  - date: '-221'
    title_zh: 废封建行郡县称皇帝
    rationale: 以郡县收天下之权，以帝号明海内一统之尊。
- id: guji-秦始皇-endeavor-2
  title_zh: 东巡海疆封禅求仙
  summary: 东巡山东海疆，登之罘历成山，祭三山阴主，遣方士求蓬莱，以海祀通神权而示疆域。
  phases:
  - key: brewing
    name: 议封禅望东海
    labels:
      zh:
      - 筹划
      - 望海
    start_date: '-220'
    highlight_event_id: guji-秦始皇-event-dongxun
  - key: breakthrough
    name: 东巡之罘成山刻石
    labels:
      zh:
      - 巡幸
      - 刻石
    start_date: '-219'
    highlight_event_id: guji-秦始皇-event-dongxun
  - key: climax
    name: 祭三山遣徐福求仙
    labels:
      zh:
      - 祭祀
      - 求仙
    start_date: '-218'
    highlight_event_id: guji-秦始皇-event-dongxun
  - key: closure
    name: 崩于沙丘海祀存志
    labels:
      zh:
      - 崩殂
      - 存志
    start_date: '-210'
    highlight_event_id: guji-秦始皇-event-death
  decisions:
  - date: '-219'
    title_zh: 东巡登之罘立刻石
    rationale: 以刻石纪功明东海为疆，以巡幸示海内无外。
  - date: '-218'
    title_zh: 祠三山凿盏遣方士入海
    rationale: 因海人之说祭阴主求三神山，以通神权而慰遐荒之望。
events:
- id: guji-秦始皇-event-birth
  type: birth
  title_zh: 生于邯郸
  date: '-259'
  year_of: -259
  place_zh: 邯郸
  summary: 秦昭襄王四十八年正月生，为秦庄襄王之子，后即秦王位。
- id: guji-秦始皇-event-unify
  type: career
  title_zh: 并六国称始皇帝
  date: '-221'
  year_of: -221
  place_zh: 咸阳
  summary: 灭齐而并六合，废谥法自称始皇帝，分天下为郡县，车同轨书同文。
- id: guji-秦始皇-event-dongxun
  type: career
  title_zh: 东巡山东海疆祭三山
  date: '-219'
  year_of: -219
  place_zh: 之罘成山三山
  summary: 二十八年东巡登之罘历成山，筑久山镇海口传说所系，祠三山阴主凿石盏以盛酒醢，后世山东海疆图记屡载其迹并有始皇桥存。
- id: guji-秦始皇-event-death
  type: death
  title_zh: 崩于沙丘
  date: '-210'
  year_of: -210
  place_zh: 沙丘
  summary: 三十七年东巡归途崩于沙丘，秦二世继而海祀巡幸之制已传，后人望碣石之罘而思秦皇。
