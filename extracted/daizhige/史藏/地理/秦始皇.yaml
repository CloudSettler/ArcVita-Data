  dilemmas:
  - 封禅求仙与务实经界之间如何权衡
  - 海疆辽阔难守与中央集权之间如何兼顾
  lesson: 海疆必先定经界，形胜既明而守御始有据
  summary_first_person: 朕起自西秦并六合，东至海而望三山，筑久山以镇海口，凿石盏以祭百神，立之罘成山之刻，通渤澥沧溟之途，虽求仙未获，而海疆形胜已昭后世。
