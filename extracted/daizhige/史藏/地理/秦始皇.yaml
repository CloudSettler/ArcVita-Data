    highlight_event_id: guji-秦始皇-event-1
  - key: breakthrough
    name: 扫灭六国一统
    labels:
      zh:
      - 灭韩赵魏楚燕齐
      - 一统
    start_date: '-230'
    highlight_event_id: guji-秦始皇-event-1
  - key: climax
    name: 称始皇帝置郡县
    labels:
