      - 实京
    start_date: '-221'
    highlight_event_id: guji-秦始皇-event-2
  decisions:
  - date: '-221'
    title_zh: 定号始皇帝废谥法
    rationale: 以彰一统至尊，示传万世之统，革古谥议之制
  - date: '-221'
    title_zh: 徙天下高赀富豪十二万户于咸阳
    rationale: 以实关中根本，弱山东豪强，充宫阙钟鼓美人之用
- id: guji-秦始皇-endeavor-2
  title_zh: 营建咸阳宫阙驰道
  summary_zh: 因北陵营殿，端门四达则紫宫，渭贯都象天汉，横桥法牵牛，离宫别馆相望，阿房未成而侈心不息
  phases:
  - key: brewing
    name: 承秦旧宫规制
    labels:
      zh:
      - 承旧
      - 筹划
    start_date: '-221'
    highlight_event_id: guji-秦始皇-event-2
  - key: breakthrough
    name: 彻侯宫作北坂复道相属
    labels:
      zh:
      - 彻宫
      - 复道
    start_date: '-221'
    highlight_event_id: guji-秦始皇-event-2
  - key: climax
    name: 作信宫极庙甘泉甬道
    labels:
      zh:
      - 极庙
      - 甬道
    start_date: '-220'
    highlight_event_id: guji-秦始皇-event-3
  - key: closure
    name: 咸阳横桥象天汉
    labels:
      zh:
      - 横桥
      - 象天
    start_date: '-212'
    highlight_event_id: guji-秦始皇-event-4
  decisions:
  - date: '-220'
    title_zh: 作信宫于渭南更命极庙象天极
    rationale: 以应天命居中，以极庙象帝居，壮皇权之威
  - date: '-212'
    title_zh: 广横桥复道阁道相连
    rationale: 以通渭南北宫观二百七十，法牵牛天汉，极都城宏大之观
events:
- id: guji-秦始皇-event-birth
  title_zh: 生于邯郸
  date: '-259'
  year_of: -259
  description_zh: 秦昭襄王四十八年正月生，后归秦立为太子
- id: guji-秦始皇-event-1
  title_zh: 即秦王位亲政理国
  date: '-246'
  year_of: -246
  description_zh: 十三岁即秦王位，后亲政用李斯王翦等并灭六国
- id: guji-秦始皇-event-2
  title_zh: 廿六年徙豪富作咸阳北坂宫
  date: '-221'
  year_of: -221
  description_zh: 始皇廿六年徙天下高赀富豪十二万户于咸阳，诸庙台苑皆在渭南，每破诸侯彻其宫室作于咸阳北坂南临渭，自雍门东至泾渭殿屋复道周阁相属
- id: guji-秦始皇-event-3
  title_zh: 廿七年作信宫更名极庙筑甬道
  date: '-220'
  year_of: -220
  description_zh: 廿七年作信宫渭南已而更命为极庙象天极，自极庙道骊山作甘泉前殿筑甬道自咸阳属之
- id: guji-秦始皇-event-4
  title_zh: 筑咸阳宫象帝居横桥法牵牛
  date: '-212'
  year_of: -212
  description_zh: 穷极奢侈筑咸阳宫因北陵营殿端门四达则紫宫，渭水贯都以象天汉横桥南渡以法牵牛，桥广六丈南北二百八十步六十八间，咸阳旁离宫别馆相望联属
- id: guji-秦始皇-event-death
  title_zh: 崩于沙丘宫阙后燬
  date: -210-07
  year_of: -210
  description_zh: 三十七年东巡崩于沙丘，二世胡亥继立，项羽入关烧秦宫阙三月火不灭，汉高祖始都长安号西京
