  - title_zh: 严肃与亲士如何兼得
    description: 清廉严肃易流于苛刻，接绅士无骄惰容则须持敬存诚
  - title_zh: 鼎革初定如何安民
    description: 明清交替郡情未稳，须以简肃服众，不扰而治
  lesson: 以清廉立身，以平敬接士，严而不苛可致久安
  summary_first_person: 吾管起凤字瑞吾，锦州人，以生员出守宁国，顺治五年到任，持身清廉，临事严肃，接见绅士不敢有骄惰之容，后迁汝南道副使，幸得祀宁国八贤祠，此生无他长，惟愿无愧于民而已
