    rationale: 蓬山即蓬莱仙山之喻用以称秘阁藏书之奥秘合于唐宋以来以仙馆比书府之传统
  - date: 1105-01-01
    title_zh: 决定并载书画器物宴赐故事
    rationale: 以为秘阁不止藏书兼蓄古画墨迹御书宸翰宴赐观览皆见君臣同文之美不可略而不书
