    rationale: 天子命讵得辞且俗悍而朴务丛而顺御制有方摄养有素辅以制节谨度则僻远亦无旷阙
  - date: 1258-12-01
    title_zh: 半载先举百废经画城守
    rationale: 高城固垒所以保民闽赣潮梅环境盐寇时作须累土增楼浚濠置窑陶甓渐图包砌不可扰民而负薪
