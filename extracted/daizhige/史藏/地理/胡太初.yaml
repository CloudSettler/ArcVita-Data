  decisions:
  - date: 1258-06-01
    title_zh: 命文学掾赵与沐提纲修志
    rationale: 事制仍革户口登耗租税虚盈人物盛衰皆莫考须择博茂士审绎旧志蒐猎轶闻方能粲然列郡邑
  - date: 1259-07-01
    title_zh: 亲定科条订事实剂雅俗
    rationale: 束稿已来须订事实正讹谬剂雅俗方成一代郡乘又别为集各十五卷阙左方以俟后来同志相续不绝
- id: guji-胡太初-endeavor-2
  title_zh: 由澄江易守临汀安边抚俗
  summary: 由澄江守易兹僻郡以静镇勤行制节谨度御寇养民半载百废粗举并经画城池官窑等务
