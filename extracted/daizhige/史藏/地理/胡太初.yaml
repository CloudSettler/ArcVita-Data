  dilemmas:
  - 僻远难治之谤与镇静勤俭可治之信何以自持
  - 旧志阙疏六十载漫焉莫考与半载百废粗举中求速成何以兼顾
  - 志求大备不可得与阙左方以俟来者何以取舍
  lesson: 守郡以静勤制节为本修志以补阙存真俟续为功僻远亦可治阙疏亦可补
  summary_first_person: 余以澄江守蒙恩易守临汀亲朋谓僻远难治余惟天子命不敢辞及境见山川缭复俗朴务顺镇之以静行之以勤半载百废粗举乃与赵与沐及博茂诸士审绎旧志蒐猎轶闻定科条正讹谬而成临汀志又别为文集各十五卷而阙其左方以俟来者
  source_urls:
