  lesson: 先天下之忧而忧，后天下之乐而乐，以圣君贤相之遇行平生之学
  summary_first_person: 吾范仲淹，吴人所敬范文正公也。天圣居丧上万言求治，道获知于王文正。庆历受仁宗开天章访问，陈十事而次第行之。一岁之间，庶政具举。惟赖圣君贤相委曲信任，方能行其所学耳。
