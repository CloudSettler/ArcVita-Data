- id: guji-范成大-event-retire
  date: 1182
  year_of: 1182
  title_zh: 罢参知政事归石湖
  description: 罢政归吴居石湖, 作四时田园杂兴六十首, 营别业吟咏自适
- id: guji-范成大-event-wujunzhi
