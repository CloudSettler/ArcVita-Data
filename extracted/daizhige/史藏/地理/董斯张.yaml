endeavors:
- id: guji-董斯张-endeavor-1
  title_zh: 甲寅读掌故比勘补辑
  description: 万历甲寅读徐长谷掌故，比勘史籍，补其轶漏，先成六卷
  phases:
  - key: brewing
    name: 读掌故而生补辑之志
    labels:
      zh: 酝酿
    start_date: '1614'
    highlight_event_id: guji-董斯张-event-1614
  - key: breakthrough
    name: 比勘史籍补成六卷
    labels:
      zh: 突破
    start_date: '1614'
    highlight_event_id: guji-董斯张-event-1614
  decisions:
  - date: '1614'
    title_zh: 取史籍比勘补徐氏之阙
    rationale: 惜古迹浸微而掌故多轶，故取史籍比勘，补其未甄者为一家言
- id: guji-董斯张-endeavor-2
  title_zh: 得闵氏助编成吴兴备志
  description: 天启甲子得闵康侯兄弟藏书五百种之助，数月成十六卷，删复益三卷，终成备志三十二卷分二十六征
  phases:
  - key: climax
    name: 借藏书博取附益而成十六卷
    labels:
      zh: 高潮
    start_date: '1624'
    highlight_event_id: guji-董斯张-event-1624
  - key: closure
    name: 雠校删复定为备志三十二卷
    labels:
      zh: 收束
    start_date: '1624'
    highlight_event_id: guji-董斯张-event-1624b
  decisions:
  - date: '1624'
    title_zh: 受闵氏藏书黾勉终事
    rationale: 家苦少书借借鲜应，得康侯出藏书相示并遣人抄寄，故黾勉百许日以竟其业
  - date: '1624'
    title_zh: 立例全录原文眉列出处
    rationale: 使人不敢轩轾事不敢论断，以俟志者之采，存古传信而空剽窃之习
