  date: 1778
  year_of: 1778
  description: 遍勘南路山脚添建隘寮移旧隘拨番丁携眷永住守卫
- id: guji-蒋元枢-event-tan
  title_zh: 新建鲫鱼潭重修海会寺盐馆
  date: 1778
  year_of: 1778
  description: 面潭建官厅半舫湖心亭修海会寺赎置寺产重建盐课大馆洲南场及福井
- id: guji-蒋元枢-event-death
  title_zh: 逝世
  date: 1782
  year_of: 1782
  description: 卸台郡任后卒于乾隆中后期著有重修台郡各建筑图说传世
