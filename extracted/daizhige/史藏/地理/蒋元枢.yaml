endeavors:
- id: guji-蒋元枢-endeavor-1
  title_zh: 重建台郡城防与望楼隘寮体系
  summary: 巡阅台郡木栅朽坏刺竹残拔遂捐俸清厘城基加高重建设敌台窝铺炮台并于五县厅分设望楼南路添建生番隘寮以固海疆
  phases:
  - key: brewing
    name: 巡城相度清厘旧基
    labels:
      zh: 巡阅朽栅
    start_date: 1775
    highlight_event_id: guji-蒋元枢-event-cheng
  - key: breakthrough
    name: 捐俸倡建内外重城
    labels:
      zh: 捐建木城
    start_date: 1776
    highlight_event_id: guji-蒋元枢-event-cheng
  - key: climax
    name: 遍设五属望楼敌台
    labels:
      zh: 星罗望楼
    start_date: 1777
    highlight_event_id: guji-蒋元枢-event-wanglou
  - key: closure
    name: 移建隘寮筹款岁修
    labels:
      zh: 设隘永卫
    start_date: 1778
    highlight_event_id: guji-蒋元枢-event-ailiao
  decisions:
  - date: 1776
    title_zh: 于旧栅内加高重建木城并种刺竹珊瑚
    rationale: 旧栅单层易被残拔故留空隙密植藩篱层层捍御而不扰民庐墓
  - date: 1777
    title_zh: 台凤诸彰淡五属分设望楼派丁轮巡
    rationale: 乡郊荒陬盗匪伏莽故筑石墙设望楼鸣锣相应四面截击以保民安
- id: guji-蒋元枢-endeavor-2
  title_zh: 重修学校礼乐与寺庙水利文治工程
  summary: 整治府署填洼扩基修府县学重铸孔庙礼乐器修海会寺天后宫风神庙浚鲫鱼潭建盐馆盐场以兴文教便民生
  phases:
  - key: brewing
    name: 相度府署学宫倾圮
    labels:
      zh: 查勘倾圮
    start_date: 1775
    highlight_event_id: guji-蒋元枢-event-fuxue
  - key: breakthrough
    name: 填筑府署重修府学
    labels:
      zh: 捐修学署
    start_date: 1776
    highlight_event_id: guji-蒋元枢-event-fuxue
  - key: climax
    name: 吴中铸造礼乐佾舞明备
    labels:
      zh: 铸礼制乐
    start_date: 1777
    highlight_event_id: guji-蒋元枢-event-liyue
  - key: closure
    name: 浚潭修寺建馆垂久远
    labels:
      zh: 潭寺盐馆
    start_date: 1778
    highlight_event_id: guji-蒋元枢-event-tan
  decisions:
  - date: 1776
    title_zh: 购民地填洼整齐府署并建迎晖阁景贤舫
    rationale: 府署高下数丈偏而不整故填筑扩基以壮纲纪政地观瞻
  - date: 1777
    title_zh: 按阙里制度赴吴中购铜铸造礼乐器运台
    rationale: 台庙礼器铅锡质陋乐器臆造失制故用铜万余斤明备以肃丁祭
events:
