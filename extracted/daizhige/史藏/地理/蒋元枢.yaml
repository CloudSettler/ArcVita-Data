  date: 1776
  year_of: 1776
  description: 修大成殿东西庑泮池棂星门建魁星阁石坊移建佐属公馆添建学廨
- id: guji-蒋元枢-event-liyue
  title_zh: 制办孔庙礼乐佾舞之器
  date: 1777
  year_of: 1777
  description: 按阙里制吴中设局铸铜礼器备乐器肄习丁祭绘佾舞图说
