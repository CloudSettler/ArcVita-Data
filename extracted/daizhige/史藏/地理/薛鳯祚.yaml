  name_zh: 薛鳯祚
  names:
    zh: 薛鳯祚
    en: Xue Fengzuo
  lifespan:
    birth:
      date: 1600
      precision: year
      is_circa: false
      raw: 明万历二十八年
    death:
      date: 1680
      precision: year
      is_circa: false
