  birth_date: 1600
  death_date: 1680
  era: 清初
  reign_ref: 清世祖顺治至圣祖康熙
  archetype: 通儒实学家
  dilemmas:
  - 西洋新法与中土旧历之间当何从
  - 究心天文历算与兼治河渠地理如何兼顾
  - 著书立说求实用于世还是求空言名理
  lesson: 通天文以明时变，究地理以兴实利，学必归于经世致用
  summary_first_person: 吾益都薛鳯祚，字仪甫，少力学，及长受西洋穆尼阁算术天文之学，国初言历法者推吾为独绝，梅文鼎所谓青州之学即吾辈所传，吾又究心地理，详考黄河运河利病，辑为两河清汇八卷，以备修守之用，愿后人因今考古，治水如治历，皆求其所以然
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E4%B8%A4%E6%B2%B3%E6%B8%85%E6%B1%87.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E4%B8%A4%E6%B2%B3%E6%B8%85%E6%B1%87.html
