  title_zh: 受西学创青州历算之学
  summary: 师事西洋穆尼阁习算术天文，以天文名家，国初言历法者推为独绝，开青州之学
  phases:
  - key: brewing
    name: 益都力学奠基
    labels:
      zh: 酝酿求学
    start_date: 1620
    highlight_event_id: guji-薛鳯祚-event-birth
  - key: breakthrough
    name: 从穆尼阁受西洋算术
    labels:
      zh: 突破师承
    start_date: 1645
    highlight_event_id: guji-薛鳯祚-event-study
  - key: climax
    name: 以天文名家冠国初
    labels:
      zh: 鼎盛立名
    start_date: 1653
    highlight_event_id: guji-薛鳯祚-event-astronomy
  - key: closure
    name: 青州之学传于后世
    labels:
      zh: 收束传学
    start_date: 1665
    highlight_event_id: guji-薛鳯祚-event-astronomy
  decisions:
  - date: 1645
    title_zh: 师事穆尼阁习西洋算术天文
    rationale: 中法疏漏，欲借西洋测算之密以正历法，故不拘夷夏专心受学
  - date: 1653
    title_zh: 以历算名家而不仕专事著述
    rationale: 国初历局纷争，愿以著书讲学存青州之学，胜于逐官职浮沉
- id: guji-薛鳯祚-endeavor-2
  title_zh: 详究两河利病著两河清汇
  summary: 究心地理，考黄河运河形势职官夫役修守事宜，辑潘季驯崔雅旧说参以己见成八卷
  phases:
  - key: brewing
    name: 遍考运河黄河形势
    labels:
      zh: 酝酿 khảo察
    start_date: 1660
    highlight_event_id: guji-薛鳯祚-event-astronomy
  - key: breakthrough
    name: 分卷厘定运河修守事宜
    labels:
      zh: 突破纲纪
    start_date: 1668
    highlight_event_id: guji-薛鳯祚-event-book
  - key: climax
    name: 缉录前贤兼陈己见成八卷
    labels:
      zh: 高潮成书
    start_date: 1672
    highlight_event_id: guji-薛鳯祚-event-book
  - key: closure
    name: 清汇传世备河防永赖
    labels:
      zh: 收束刊传
    start_date: 1675
    highlight_event_id: guji-薛鳯祚-event-book
  decisions:
  - date: 1668
    title_zh: 详载运河职官河湖泉水道里夫役之数
    rationale: 治河先明形势职守，无确数则修守皆空言，故首重考据征实
  - date: 1672
    title_zh: 缉潘季驯河防辨惑崔雅刍议而附刍论修守事宜
    rationale: 前贤成法不可弃，时变亦不可守旧，故并存旧说而以己见断其得失
