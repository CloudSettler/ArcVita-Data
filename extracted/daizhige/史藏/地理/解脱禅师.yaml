person:
  qid: guji-解脱禅师
  name_zh: 解脱禅师
  names:
    zh: 解脱禅师
    en: Master Jietuo
  lifespan:
    birth:
      date: 0560-01-01
      precision: year
      is_circa: true
      raw: 隋初本土刑氏驰马之岁出家推约
    death:
      date: 0630-01-01
      precision: year
      is_circa: true
      raw: 住佛光寺垂五十年推约
  birth_date: 0560-01-01
  death_date: 0630-01-01
  era: 隋唐之际
  reign_ref: 隋文帝开运重兴像教之世
  archetype: 禅观弘化型高僧
  dilemmas:
  - 独善寂灭与旷济群蒙之抉择
  - 亲礼文殊外求与自悔内悟之辨
  - 严谨绳墨与随事无准之化法
  lesson: 不外求圣就我，当自悔悟无生，以谦卑侍众成旷济之业
  summary_first_person: 我是五台昭果寺解脱，刑氏子，少即出家，初依抱腹山志昭求定，返乡诵法华作佛光观，三诣大孚东台得见文殊，教我自悔而悟无生，又感诸佛现身说偈，遂发旷济心，重修佛光寺，五十年不出，化千余人入禅，但愿学者不著文殊解脱之名，直见心境皆空
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%8F%A4%E6%B8%85%E5%87%89%E4%BC%A0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%8F%A4%E6%B8%85%E5%87%89%E4%BC%A0.md
endeavors:
- id: guji-解脱禅师-endeavor-1
  title_zh: 抱腹参定与佛光观行
  summary_zh: 少年出家依止抱腹山志昭禅师询求定验，返故居后常诵法华兼作佛光等观，数往大孚追寻文殊
  phases:
  - key: brewing
    name: 驰马出家依昭求定
    labels:
      zh: 抱腹询验
    start_date: 0572-01-01
    highlight_event_id: guji-解脱禅师-event-1
  - key: breakthrough
    name: 返居诵经作观精勤
    labels:
      zh: 法华佛光
    start_date: 0580-01-01
    highlight_event_id: guji-解脱禅师-event-1
  - key: climax
    name: 东台三逢文殊得旨
    labels:
      zh: 自悔悟解
    start_date: 0590-01-01
    highlight_event_id: guji-解脱禅师-event-2
  - key: closure
    name: 感佛现身闻寂灭偈
    labels:
      zh: 方便智灯
    start_date: 0592-01-01
    highlight_event_id: guji-解脱禅师-event-2
  decisions:
  - date: 0572-01-01
    title_zh: 不执僧役专询定验
    rationale: 志昭识其禅习冲明特赐殊礼，遂不滞常辈事务以全定慧之基
  - date: 0580-01-01
    title_zh: 诵法华兼修佛光观
    rationale: 以经教熏心以观行炼境，为亲见圣境积因
  - date: 0590-01-01
    title_zh: 承教自悔不复外求
    rationale: 文殊诲汝何须亲礼我可自悔责，乃悟无生而增法喜
- id: guji-解脱禅师-endeavor-2
  title_zh: 住持佛光旷济弘禅
  summary_zh: 慨然独善思怀旷济，重修理佛光寺立终焉之志，五十年不出激励四方，学成者千余人
  phases:
  - key: brewing
    name: 祈诚大觉谨旷济心
    labels:
      zh: 发济群蒙
    start_date: 0595-01-01
    highlight_event_id: guji-解脱禅师-event-2
  - key: breakthrough
    name: 再修佛光立终焉志
    labels:
      zh: 复修伽蓝
    start_date: 0600-01-01
    highlight_event_id: guji-解脱禅师-event-3
  - key: climax
    name: 五十年化千余入禅
    labels:
      zh: 露坐盈林
    start_date: 0605-01-01
    highlight_event_id: guji-解脱禅师-event-3
  - key: closure
    name: 营粥示文殊即解脱
    labels:
      zh: 不二试验
    start_date: 0620-01-01
    highlight_event_id: guji-解脱禅师-event-3
  decisions:
  - date: 0600-01-01
    title_zh: 终老佛光不出其寺
    rationale: 以一处为道场收摄来学，使瓶钵绳床映满林薮而成丛席
  - date: 0605-01-01
    title_zh: 唯严唯谨随病指撝
    rationale: 务攻其所疾略无常准，使游门之士莫窥庭奥而各得其益
  - date: 0620-01-01
    title_zh: 营粥不顾现前文殊
    rationale: 应以文殊自文殊解脱自解脱示真悟，不著圣名方为真见
events:
- id: guji-解脱禅师-event-birth
  title_zh: 生于五台刑氏家
  type: birth
  date: 0560-01-01
  year_of: 560
  place_zh: 五台县
  summary_zh: 本土刑氏子，驰马之岁即预出家，宿植德本早怀津问
- id: guji-解脱禅师-event-1
  title_zh: 从抱腹山志昭询定诵法华作观
  type: career
  date: 0575-01-01
  year_of: 575
  place_zh: 介山抱腹山
  summary_zh: 初从志昭禅师询求定验蒙许超拔，返故居常诵法华并作佛光等观
- id: guji-解脱禅师-event-2
  title_zh: 东台逢文殊悟无生感诸佛说偈
  type: career
  date: 0590-01-01
  year_of: 590
  place_zh: 大孚寺东台之左
  summary_zh: 数往大孚追寻文殊再三逢遇，初礼已失后亲承音训自悔悟无生，感诸佛现身说寂灭甚深法及方便智为灯之偈
- id: guji-解脱禅师-event-3
  title_zh: 重修佛光寺五十年弘化
  type: career
  date: 0600-01-01
  year_of: 600
  place_zh: 佛光山佛光寺
  summary_zh: 隋运重兴发旷济心再加修理，不出寺垂五十年，学成禅业者千余人，谦卑侍众为众营粥示不二之旨，远近辐凑请益如流
- id: guji-解脱禅师-event-death
  title_zh: 终于佛光寺
  type: death
  date: 0630-01-01
  year_of: 630
  place_zh: 佛光寺
  summary_zh: 终老于所修佛光寺，道化比衡岳惠思台山智者更盛，鸾公旧地亦因之重光
