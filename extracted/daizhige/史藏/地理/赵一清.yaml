    start_date: 1755
    highlight_event_id: guji-赵一清-event-errata
  decisions:
  - date: 1750
    title_zh: 取双行夹写说离析经注
    rationale: 沈约宋书声词合写古有其例参姚宏补注战国策范成大吴郡志注中夹注之例使正文旁义条理分明
  - date: 1754-11
    title_zh: 以大小字分书不改原文大义
    rationale: 效许相卿史汉方驾之变使增删之意开卷厘然存朱郁仪之是兼弼郦道元之违
- id: guji-赵一清-endeavor-2
  title_zh: 考补佚水复旧数之学
  summary: 证唐六典百三十七水之数杂采他籍补淦洺滹沱等十八水析清漳浊漳小辽为六共得二十九水以合佚卷
  phases:
  - key: brewing
    name: 雠校崇文总目蜀本佚卷之说
