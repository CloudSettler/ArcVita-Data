      - 辑佚
    start_date: 1752
    highlight_event_id: guji-赵一清-event-supplement
  - key: climax
    name: 补列洛丰泾汭渠获洙滁等目
    labels:
      zh:
      - 补目
    start_date: 1754-11
    highlight_event_id: guji-赵一清-event-supplement
  - key: closure
    name: 卷首刊所据四十本以示征信
    labels:
      zh:
      - 示据
    start_date: 1755
    highlight_event_id: guji-赵一清-event-errata
  decisions:
  - date: 1752
    title_zh: 以本注杂采他籍补佚水
    rationale: 今本仅百十六水崇文总目载注三十五卷盖宋已佚五卷以后人离析篇帙合原数当据汉志说文诸书考补
  - date: 1754-11
    title_zh: 并列伊瀍涧与洛为敌不附见
    rationale: 禹贡伊洛瀍涧既入于河其源既异其流相敌当各殊篇目如漾沔淮泗之例
events:
- id: guji-赵一清-event-birth
  date: 1711
  year_of: 1711
  type: birth
  title_zh: 生于浙江仁和
  description: 谷林征士之子藏书数十万卷甲于东南自少从事根柢之学
- id: guji-赵一清-event-study
  date: 1745
  year_of: 1745
  type: career
  title_zh: 合顾黄胡阎诸家以通水经
  description: 拾顾炎武顾祖禹黄宗羲胡渭阎若璩及刘献廷之说购旧椠以校竭精思以审渐见天日
- id: guji-赵一清-event-preface
  date: 1754-11
  year_of: 1754
  type: career
  title_zh: 撰水经注释自序于琼华街
  description: 乾隆十九年仲冬自署东潜述明水之治乱在人能读与否追古帝治水之心致地平天成之业
- id: guji-赵一清-event-supplement
  date: 1755
  year_of: 1755
  type: career
  title_zh: 补防水防余及洛渭诸篇考成四十卷
  description: 于防水下分防余水考清漳浊漳小辽各为二并补滹沱滋淦洺伊瀍涧丰泾汭渠获洙等以合百三十七水之数
- id: guji-赵一清-event-errata
  date: 1764
  year_of: 1764
  type: career
  title_zh: 别为水经注笺刊误以存朱氏之是
  description: 取朱郁仪笺释之长缪盭则削遗漏则补不欲羼入卷中惑人视听遂勒成附录二卷刊误十二卷
- id: guji-赵一清-event-death
  date: 1764
  year_of: 1764
  type: death
  title_zh: 卒于乾隆二十九年
  description: 身后注释盛行四库馆臣以官校宋本外诸刻以此为首恭校收入史部地理河渠之属
