      - 渡海初到
    start_date: 1915-12-04
    highlight_event_id: guji-邱文鸾-event-1
  - key: breakthrough
    name: 游历台北市衢大正街公园
    labels:
      zh:
      - 市街观察
    start_date: 1915-12-06
    highlight_event_id: guji-邱文鸾-event-2
  - key: climax
    name: 参观苗圃林业国语学校博物馆农事场
    labels:
      zh:
      - 农教深察
    start_date: 1915-12-07
    highlight_event_id: guji-邱文鸾-event-3
  - key: closure
    name: 观屠场酒厂讲习所而叹经营之善
    labels:
      zh:
      - 实业收束
    start_date: 1915-12-08
    highlight_event_id: guji-邱文鸾-event-4
  decisions:
  - date: 1915-12-06
    title_zh: 寓林本源以省费而便观览
    rationale: 林本源富冠台湾田产甚厚借其寓所可久留详察又得蔡法平助膳费故能专心考察
  - date: 1915-12-07
    title_zh: 详询试验场主事并录其梗概
    rationale: 台湾农业一日千里全赖机关精密故不辞泥泞逐场咨访以求归国借鉴
- id: guji-邱文鸾-endeavor-2
  title_zh: 撰写台湾旅行记针砭时弊
  summary_zh: 叙沿革地势物产以较中日得失警国人自立
  phases:
  - key: brewing
    name: 追溯台湾沿革兴亡之感
    labels:
      zh:
      - 史地发端
    start_date: 1915-12-04
    highlight_event_id: guji-邱文鸾-event-1
  - key: breakthrough
    name: 比较台民教育生活与内地困苦
    labels:
      zh:
      - 民生对比
    start_date: 1915-12-06
    highlight_event_id: guji-邱文鸾-event-2
  - key: climax
    name: 论日本官吏国民服从尚朴能生产
    labels:
      zh:
      - 针砭奢靡
    start_date: 1915-12-07
    highlight_event_id: guji-邱文鸾-event-3
  - key: closure
    name: 论政党在人成书以劝自强
    labels:
      zh:
      - 立言劝国
    start_date: 1915-12-08
    highlight_event_id: guji-邱文鸾-event-4
  decisions:
  - date: 1915-12-06
    title_zh: 直书割台之惜与奴隶之惧
    rationale: 数千里膏腴沦为囊中物日人治台如英治印度故不得不痛言以警国人
  - date: 1915-12-08
    title_zh: 驳联络工商之请而主自立
    rationale: 讲习所长劝售用日货而五月无理要求在前故主张国不自立而倚人如寄金于盗贼
events:
- id: guji-邱文鸾-event-birth
  title_zh: 出生于四川
  date: 1890-01-01
  year_of: 1890
  description_zh: 清光绪年间生于四川后游学从事实业考察
- id: guji-邱文鸾-event-death
  title_zh: 逝世
  date: 1945-01-01
  year_of: 1945
  description_zh: 民国三十四年左右逝世
- id: guji-邱文鸾-event-1
  title_zh: 由马江乘船赴基隆登台
  date: 1915-12-05
  year_of: 1915
  description_zh: 十二月四日由南台德兴洋行乘神岛丸转湖北丸出五虎口五日夜抵基隆泊港外
- id: guji-邱文鸾-event-2
  title_zh: 初抵台北游大稻埕大正街
  date: 1915-12-06
  year_of: 1915
  description_zh: 由基隆乘汽车至台北寓林本源第一房午后游新市衢大正街公园市场叹故宫禾黍及商标电光之盛
- id: guji-邱文鸾-event-3
  title_zh: 参观苗圃林业国语学校博物馆农事场
  date: 1915-12-07
  year_of: 1915
  description_zh: 历访苗圃林业试验场专卖局国语学校博物馆农事试验场养蚕所水源地录樟脑烟膏米产及改良牛种诸事
- id: guji-邱文鸾-event-4
  title_zh: 观屠场酒厂讲习所
  date: 1915-12-08
  year_of: 1915
  description_zh: 晨观大稻埕屠场午观芳酿株式会社制酒及工业讲习所辨中日会社信用政党得失之异
