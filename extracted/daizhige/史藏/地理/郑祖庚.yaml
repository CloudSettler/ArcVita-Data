  birth_date: 1865
  death_date: 1920
  era: 清末民初
  reign_ref: 光绪
  archetype: 方志纂修者
  dilemmas:
  - 闽为首剧而邑乘阙如，如何征文述献以补阙
  - 奏定例目繁杂而守令事繁，如何详核简雅以成小学课本
  - 古今建置沿革众说纷纭，如何辨虚实以定闽县源流
  lesson: 由乡土耳目所习见入手，详核史志以迪童蒙，方能使一方文献可传
  summary_first_person: 我是闽县郑祖庚，字新樊，戊子科举人，受福州府闽县之托总纂新撰闽县乡土志，遵奏定乡土志例目，分历史地理格致以考建置沿革，录政绩兵事耆旧以彰先贤，并记版籍地形物产商务以备小学乡土之课，冀使闽邑文献有征，童蒙有所依据
  source_urls:
  - https://daizhige.org/史藏/地理/闽县乡土志.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/地理/闽县乡土志.md
endeavors:
- id: guji-郑祖庚-endeavor-1
  title_zh: 总纂新撰闽县乡土志
  summary: 应闽县知县之聘总理全志，按奏定例目立叙目四篇，分门访采编撰审定，以成闽县乡土教科书
  phases:
  - key: brewing
    name: 受聘筹办与立例
    labels:
      zh: 酝酿
    start_date: 1906
    highlight_event_id: guji-郑祖庚-event-juren
  - key: breakthrough
    name: 分门访采与纂辑
    labels:
      zh: 突破
    start_date: 1907
    highlight_event_id: guji-郑祖庚-event-xiangtuzhi
  - key: closure
    name: 审定成书与报部
    labels:
      zh: 收束
    start_date: 1908
    highlight_event_id: guji-郑祖庚-event-xiangtuzhi
  decisions:
  - date: 1906
    title_zh: 遵奏定例目另立闽县叙目
    rationale: 奏定之例言人人殊恐庞杂，须立考录略琐记杂述以统历史地理实业
  - date: 1907
    title_zh: 征访事委员分途调查
    rationale: 守令事繁非专人访采不能详核，故设总访分访调查委员以考山川户口物产商务
- id: guji-郑祖庚-endeavor-2
  title_zh: 考订闽县建置沿革与耆旧政绩
  summary: 辨唐虞以至国朝闽县隶属分合，辑兴利去害听讼兵事耆旧，以辨东侯官原丰长乐诸名之误
  phases:
  - key: brewing
    name: 博考府志通志与史传
    labels:
      zh: 酝酿
    start_date: 1906
    highlight_event_id: guji-郑祖庚-event-jianzhikao
  - key: climax
    name: 断隋开皇十二年置闽县为始
    labels:
      zh: 高潮
    start_date: 1908
    highlight_event_id: guji-郑祖庚-event-jianzhikao
  - key: closure
    name: 以政绩兵事耆旧系于建置之后
    labels:
      zh: 收束
    start_date: 1908
    highlight_event_id: guji-郑祖庚-event-xiangtuzhi
  decisions:
  - date: 1907
    title_zh: 辨东侯官改名之诬
    rationale: 正史未见梁改原丰为东侯官，隋志注及陈宝应封爵皆可证其误，故不从俗说
  - date: 1908
    title_zh: 政绩分兴利去害听讼三门
    rationale: 官本境者惠政须以年月先后系录，方能使后学知利害感动人心
events:
- id: guji-郑祖庚-event-birth
  date: 1865
  year_of: 1865
  title_zh: 生于福州闽县
  description: 同治年间约生于闽县，少习经史乡邦文献，后入县学生员
- id: guji-郑祖庚-event-juren
  date: 1888
  year_of: 1888
  title_zh: 戊子科中举人
  description: 光绪十四年戊子科中福建乡试举人，列名总纂为戊子科举人郑祖庚新樊
- id: guji-郑祖庚-event-jianzhikao
  date: 1907
  year_of: 1907
  title_zh: 考成闽县建置沿革考
  description: 分未置本境以前自唐虞扬州以至陈丰州原丰，既置以后自隋开皇十二年置闽县以至国朝因明制，成建置沿革考一篇
- id: guji-郑祖庚-event-xiangtuzhi
  date: 1908
  year_of: 1908
  title_zh: 总纂成新撰闽县乡土志
  description: 与副纂陈永鑫张绍九等分纂王际镐及访事誊录校录诸员合作，成奏定例目叙目政绩兵事耆旧版籍地形物产物产商务诸篇，督修吕渭英赞成朱福星总理李骏斌审定刊行
- id: guji-郑祖庚-event-death
  date: 1920
  year_of: 1920
  title_zh: 卒于闽地
  description: 乡土志成后事迹不显，约卒于民国初年以后，遗书以闽县乡土志传世
