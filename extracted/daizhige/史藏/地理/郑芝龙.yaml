events:
- id: guji-郑芝龙-event-birth
  date: 1604
  year_of: 1604
  title_zh: 生于泉州南安石井
  description: 泉州南安石井巡司人父绍祖兄弟四人伯为芝龙姿容秀丽胆智过人十岁戏投石误中太守蔡善继得贵语
- id: guji-郑芝龙-event-1621
  date: 1621
  year_of: 1621
  title_zh: 入台湾投颜振泉剑跃见推为魁
  description: 天启元年与弟芝虎入颜振泉党请舰燔略暹罗分财不受颜死众插剑盟天芝龙拜而剑跃遂推为魁纵横海上
- id: guji-郑芝龙-event-1628
  date: 1628-07-01
  year_of: 1628
  title_zh: 降于福建巡抚熊文灿授游击
  description: 崇祯元年七月率所部降文灿继杀陈衷纪焚红毛巨艘于澎湖擒李魁奇败钟斌以功任都督一方渐宁
- id: guji-郑芝龙-event-1635
  date: 1635-04-01
  year_of: 1635
  title_zh: 田尾远洋追灭刘香平定海盗
  description: 崇祯八年奉命合粤兵击刘香烧己舰以烧寇舰香势蹙自焚溺死余党归款自此通贩益便台湾商船岁诣日本
- id: guji-郑芝龙-event-death
  date: 1661-11-24
  year_of: 1661
  title_zh: 清顺治十八年殁于北京
  description: 明亡后入清北迁羁留北京顺治十八年遇难成功海上之业则由子郑成功继守台湾东宁
