  birth_date: 0852
  death_date: 0932
  era: 唐末五代
  reign_ref: 唐僖宗至后唐明宗
  archetype: 开国君主
  dilemmas:
  - 以贩盐博徒起家如何取信乡里豪杰以成大事
  - 强藩环伺之下受梁册封与否如何保境安民以全吴越
  - 既有国土当广府治垂祚久远还是守旧制以安百年
  lesson: 起于微贱而能保境安民，知止不僣，衣锦不忘本，故能开国垂统九十八年
  summary_first_person: 我是钱镠，字具美，临安人，幼戏大木能号令群儿，长以贩盐为盗，后应募讨王郢破黄巢，斩刘汉宏而居杭州，平董昌而有两浙，梁封吴越王，守土安民，筑城保境，卒年八十一，谥武肃
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E8%A5%BF%E6%B9%96%E6%B8%B8%E8%A7%88%E5%BF%97%E4%BD%99.html
endeavors:
- id: guji-钱镠-endeavor-1
  title_zh: 募乡兵讨王郢破黄巢而起家
  summary: 唐干符中应董昌募为偏将，击破王郢，又以二十劲卒伏山谷射杀黄巢先锋，扬言八百里屯兵以退贼众，遂显名浙西
  phases:
  - key: brewing
    name: 贩盐结众临安戏令
    labels:
      zh: 蓄势结众
    start_date: 0852
    highlight_event_id: guji-钱镠-event-birth
  - key: breakthrough
    name: 应募讨王郢授偏将
    labels:
      zh: 一战成名
    start_date: 0875
    highlight_event_id: guji-钱镠-event-wangying
  - key: climax
    name: 伏弩斩将退黄巢
    labels:
      zh: 出奇制胜
    start_date: 0879
    highlight_event_id: guji-钱镠-event-wangying
  - key: closure
    name: 趋八百里扬威浙东
    labels:
      zh: 声威大振
    start_date: 0880
    highlight_event_id: guji-钱镠-event-wangying
  decisions:
  - date: 0875
    title_zh: 应董昌募讨王郢
    rationale: 镇兵少而盗众，唯乡兵可用，借讨贼以练劲卒结豪杰，为起家之资
  - date: 0879
    title_zh: 以二十人伏击黄巢先锋后扬言八百里屯兵
    rationale: 贼多我少难力敌，宜出奇兵先挫其锋，再因地名设疑兵，使大众不敢深入
- id: guji-钱镠-endeavor-2
  title_zh: 据杭越受铁券开吴越国
  summary: 中和二年斩刘汉宏而居杭州，进镇海节度，平董昌之乱，受唐末梁初册封及铁券，筑七十里罗城，开吴越一国，衣锦还乡，守旧制以全百年之祚
  phases:
  - key: brewing
    name: 斩汉宏自居杭州
    labels:
      zh: 据地立基
    start_date: 0882
    highlight_event_id: guji-钱镠-event-hangzhou
  - key: breakthrough
    name: 平董昌荡定江表
    labels:
      zh: 平定两浙
    start_date: 0895
    highlight_event_id: guji-钱镠-event-hangzhou
  - key: climax
    name: 受梁册封吴越王锡铁券
    labels:
      zh: 开国称王
    start_date: 0907
    highlight_event_id: guji-钱镠-event-wuyuewang
  - key: closure
    name: 筑腰鼓城衣锦还乡守旧制
    labels:
      zh: 保境安民
    start_date: 0908
    highlight_event_id: guji-钱镠-event-wuyuewang
  decisions:
  - date: 0882
    title_zh: 击斩刘汉宏奏董昌为越帅而自居杭州
    rationale: 越杭构兵之际先定杭州咽喉，再图两浙，不急自立以避众矢
  - date: 0907
    title_zh: 受梁命为吴越王不拒命
    rationale: 自比孙仲谋保境安民，不失事大之礼，全吴越生灵免于兵革，又改临安为衣锦军以不忘本
events:
- id: guji-钱镠-event-birth
  title_zh: 生于临安
  date: 0852
  year_of: 852
  place_zh: 杭州临安
  description: 钱镠生于临安，幼时与群儿戏大木下，坐大石麾令有法，又得术者相贵，钟起纵子与游时贷其乏
- id: guji-钱镠-event-wangying
  title_zh: 讨王郢破黄巢先锋
  date: 0875
  year_of: 875
  place_zh: 浙西临安八百里
  description: 唐干符二年募乡兵讨王郢表为偏将，后以二十劲卒伏山谷射杀黄巢前锋将，又假托八百里屯兵吓退巢众
- id: guji-钱镠-event-hangzhou
  title_zh: 斩刘汉宏居杭州平董昌
  date: 0882
  year_of: 882
  place_zh: 杭州越州
  description: 中和二年刘汉宏与董昌构兵，击斩汉宏而居杭州，寻进镇海军节度，后击取僣乱之董昌，荡定江表
- id: guji-钱镠-event-wuyuewang
  title_zh: 受梁册封吴越王锡铁券筑城
  date: 0907
  year_of: 907
  place_zh: 钱塘衣锦城
  description: 天复二年封越王，天佑元年改吴王，开平元年受梁封吴越王，锡铁券恕九死，筑城七十里十门，号腰鼓城，还乡衣锦拜钱婆留
- id: guji-钱镠-event-death
  title_zh: 卒于钱塘谥武肃
  date: 0932
  year_of: 932
  place_zh: 钱塘
  description: 后唐长兴三年卒年八十一，遗命去国仪用藩镇法臣事中国，子元瓘立，钱氏据吴越凡九十八年
