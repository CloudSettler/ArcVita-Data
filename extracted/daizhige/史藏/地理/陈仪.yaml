  dilemmas:
  - 考据沿革与敷陈利病之间当以当下水势民生为重
  - 筑堤束水日增愈高与疏浚分流畅达海口之间当以疏导为要
  - 浊流淤淀为害与引淤肥田转斥卤为肥饶之间当转害为利
  lesson: 身为土人亲预水利乃知水性地形治水当先从低处下手疏胜于塞转害为利
  summary_first_person: 吾文安陈仪字子翙号一吾康熙乙未进士官至翰林院侍讲学士充霸州等处营田观察使经理营田之时遍历海河卫河白河永定河子牙河等二十五水深知水性地形作直隶河渠志一卷详今形势略古迹敷陈利病以备参考
