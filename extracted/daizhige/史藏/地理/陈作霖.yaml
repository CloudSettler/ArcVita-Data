endeavors:
- id: guji-陈作霖-endeavor-1
  title_zh: 辑撰凤麓琐志存金陵掌故
  description_zh: 以岁时记与蔬鱼织业为基，辑凤麓小志以存金陵旧俗旧制
  phases:
  - key: brewing
    name: 留心乡邦掌故
    labels:
      zh:
      - 采风
      - 掌故
    start_date: '1875'
    highlight_event_id: guji-陈作霖-event-birth
  - key: breakthrough
    name: 辑成凤麓小志
    labels:
      zh:
      - 辑志
      - 岁时
    start_date: '1888'
    highlight_event_id: guji-陈作霖-event-fenglu
  - key: climax
    name: 详记蔬鱼织业
    labels:
      zh:
      - 蔬鱼
      - 织缎
    start_date: '1890'
    highlight_event_id: guji-陈作霖-event-fenglu
  - key: closure
    name: 以凤麓为后志之据
    labels:
      zh:
      - 存古
      - 立例
    start_date: '1895'
    highlight_event_id: guji-陈作霖-event-survey
  decisions:
  - date: '1888'
    title_zh: 先成凤麓以记岁时
    rationale: 以子隐岁时之记为法，先存风俗礼俗再及物产
  - date: '1890'
    title_zh: 详载蔬鱼织业不厌其繁
    rationale: 事以类相从，辞繁而不杀，汉儒著述之例可从
- id: guji-陈作霖-endeavor-2
  title_zh: 考述金陵物产风土以裕民生
  description_zh: 承食货重农兼贸迁之义，条列植物动物矿物食物用物以诏来兹
  phases:
  - key: brewing
    name: 踏查田圩桑圃
    labels:
      zh:
      - 踏查
      - 农桑
    start_date: '1895'
    highlight_event_id: guji-陈作霖-event-survey
  - key: breakthrough
    name: 分考动植矿物
    labels:
      zh:
      - 物产
      - 分类
    start_date: '1900'
    highlight_event_id: guji-陈作霖-event-survey
  - key: climax
    name: 编成物产风土志
    labels:
      zh:
      - 编志
      - 民生
    start_date: '1905'
    highlight_event_id: guji-陈作霖-event-compile
  - key: closure
    name: 附于琐志之末以诏来兹
    labels:
      zh:
      - 成书
      - 示后
    start_date: '1908'
    highlight_event_id: guji-陈作霖-event-compile
  decisions:
  - date: '1900'
    title_zh: 以民生日用饮食为纲
    rationale: 野无旷土家无侈费则民富，故首重田农桑蚕灌圃之业
  - date: '1905'
    title_zh: 繁而不杀重出凤麓诸篇
    rationale: 既以类相从，王制内则亦有重出，存全以便观览
