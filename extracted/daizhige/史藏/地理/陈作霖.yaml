  lesson: 自强始于一邑，一邑始于民富，必先察物产风土以厚生日
  summary_first_person: 吾为江宁陈作霖，念时务在自强而自强在一邑民富，爰历考金陵田圩桑蚕蔬圃鱼鳞织缎饮食诸产，条其独异与生日日用之质，成此风土志以诏来兹
