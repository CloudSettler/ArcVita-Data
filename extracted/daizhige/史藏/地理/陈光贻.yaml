    start_date: 1940
    highlight_event_id: guji-陈光贻-event-wujin
  - key: breakthrough
    name: 入上海图书馆与方志晨夕
    labels:
      zh: 与馆藏晨夕每获异书持以相视
    start_date: 1955
    highlight_event_id: guji-陈光贻-event-shangtu
  - key: climax
    name: 钩玄校实正旧著录之讹
    labels:
      zh: 据钓诸小志震川文集考辨版本源流
    start_date: 1975
    highlight_event_id: guji-陈光贻-event-jia勘
  - key: closure
    name: 以余稿续见待后成
    labels:
      zh: 杀青有日孜孜赓续以此为滥觞
    start_date: 1980-04
    highlight_event_id: guji-陈光贻-event-tiyao
  decisions:
  - date: 1940
    title_zh: 从武进文献整理转入方志专修
    rationale: 方志为国史初基隐微事迹赖以传故专力于斯三十余年无间寒暑
  - date: 1975
    title_zh: 旁搜广引正旧传不徒录流传不广
    rationale: 著录刻本多讹传钞足本被掩故据别集文集举证以存信实
