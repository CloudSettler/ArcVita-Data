    name: 北至北京南至天一访求外地异本
    labels:
      zh: 征求外地亲往访书所见寖广
    start_date: 1965
    highlight_event_id: guji-陈光贻-event-fangshu
  - key: climax
    name: 集成千余篇分列十五卷
    labels:
      zh: 择版本罕传笔墨优异取材独到者录之
    start_date: 1978
    highlight_event_id: guji-陈光贻-event-tiyao
  - key: closure
    name: 撰例言自序杀青付梓
    labels:
      zh: 首卷冠总志旁搜广引正旧传
    start_date: 1980-04
    highlight_event_id: guji-陈光贻-event-tiyao
  decisions:
  - date: 1960
    title_zh: 只录稀见与笔墨优异取材独到者
    rationale: 方志近万种一人难尽录故择版本罕传诸家目录遗漏者以见体裁因革
  - date: 1978
    title_zh: 以总志冠首兼收侨置编年纪事赋体骈俪诸体
    rationale: 明一省疆域必明一国疆理诸体散佚不录则变革无征故每类每体皆著录
- id: guji-陈光贻-endeavor-2
  title_zh: 古籍整理与方志考辨
  summary: 承乏武进文献征存社整理古籍继在上海图书馆晨书冥写兼事校正旧传如辨读史方舆纪要足本与兴都志传钞之讹
  phases:
  - key: brewing
    name: 武进文献征存整理古籍
