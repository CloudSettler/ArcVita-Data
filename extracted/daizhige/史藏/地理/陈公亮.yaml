  summary_first_person: 吾武义陈公亮，淳熙甲辰下车严州，见郡图经板本散亡，悯其废坠。时和年丰之后，命州学教授刘文富订正旧经，再锓诸木。一以宽政理严，辑睦其俗，庶后人知风俗利病，师范先贤。
