  date: 1846
  year_of: 1846
  title_zh: 道光丙午举人
  description_zh: 道光丙午登举人，后以知府衔署台湾府淡水同知澎湖通判
- id: guji-陈培桂-event-2
  date: 1869-09-01
  year_of: 1869
  title_zh: 同治己巳秋抵任署淡水同知
