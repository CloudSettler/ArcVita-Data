  date: 1871-05-01
  year_of: 1871
  title_zh: 同治十年夏五月厅志定为十六卷
  description_zh: 缮稿呈黎兆棠厘订增损，更细加参酌定今书，自为序以谂后牧
- id: guji-陈培桂-event-death
  date: 1880
  year_of: 1880
  title_zh: 卒年不详
  description_zh: 同治十年后事迹不详，卒于清季，暂阙其年
