- id: guji-陈培桂-event-3
  date: 1869-10-01
  year_of: 1869
  title_zh: 协同黎道办理洋商争利事
  description_zh: 泰西商胁安平，身任绳以法者，五阅月事定，自兹坚明约束
- id: guji-陈培桂-event-4
  date: 1870-02-01
  year_of: 1870
  title_zh: 同治九年正月开局采访修志
