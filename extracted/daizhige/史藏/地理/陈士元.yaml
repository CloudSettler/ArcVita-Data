  - title_zh: 信传闻还是重考证
    description: 楚地故实多附会神怪，乡贤土风亦多夸饰，当存录还是辨正
  - title_zh: 宗汉儒还是从宋说
    description: 治易多发明汉儒之学，与宋儒空谈义理之间当何从
  lesson: 引据必赅洽，论断必明晰，存怪可阙疑，辨伪须有据
  summary_first_person: 余心叔，应城人也。嘉靖甲辰进士，留心古籍，多发明汉儒之学。于楚地故实设为问答加以考证，成江汉丛谈二卷，又撰易象钩解，虽历官莫考，而考据之志不敢废也。
