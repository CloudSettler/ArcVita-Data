  - 山志欲详考旧迹与岩僧湮没碑版剥落之难征
  lesson: 以雄词奥学领袖词垣，又以品题山川寄怀林壑，文传而山显，宦游不忘丘壑
  summary_first_person: 吾陈沂字鲁南号石亭，弘治十二年进士入翰林，掌帝制润国猷，嘉靖中游金陵献花岩，览牛首祖堂之胜，与诸大夫宿山旁陟历考索，志山石岩洞水泉台甃宫宇卉木异蓄七篇并附题咏，使禅诵者知托游瞩者忘归
