endeavors:
- id: guji-陈鼎-endeavor-1
  title_zh: 漫游滇中访山川寺宇
  summary: 自曲靖入滇会城，历大理点苍洱海，至鸡足丽江永昌，遍访寺宇碑刻温泉风穴，核验舆图传闻
  phases:
  - key: brewing
    name: 江南蓄志欲访西南
    labels:
      zh: 蓄志远游
    start_date: '1680'
    highlight_event_id: guji-陈鼎-event-birth
  - key: breakthrough
    name: 由黔入滇历州县道里
    labels:
      zh: 入滇履勘
    start_date: '1705'
    highlight_event_id: guji-陈鼎-event-dianxing
  - key: climax
    name: 穷苍洱鸡足览胜穷源
    labels:
      zh: 苍洱穷源
    start_date: '1706'
    highlight_event_id: guji-陈鼎-event-canger
  - key: closure
    name: 遍游三郡归而理稿
    labels:
      zh: 游归理稿
    start_date: '1708'
    highlight_event_id: guji-陈鼎-event-zhushu
  decisions:
  - date: '1705'
    title_zh: 舍安就险西行入滇
    rationale: 欲以目验补纸上之不足，不惮瘴疠险远，故决意远游
  - date: '1706'
    title_zh: 登苍山泛洱海访古迹
    rationale: 点苍洱海为滇西要地，古迹碑刻多可证史，故纡道详访
- id: guji-陈鼎-endeavor-2
  title_zh: 撰滇游记以存风土补史
  summary: 将道里山川寺观物产风俗见闻笔之于书，参以南诏旧事武侯遗迹，为后人存一时滇地实录
  phases:
  - key: brewing
    name: 沿途随时记录见闻
    labels:
      zh: 随游记录
    start_date: '1705'
    highlight_event_id: guji-陈鼎-event-dianxing
  - key: breakthrough
    name: 会稡碑刻志书相参
    labels:
      zh: 参核碑志
    start_date: '1708'
    highlight_event_id: guji-陈鼎-event-canger
  - key: climax
    name: 撰成滇游记一篇
    labels:
      zh: 撰述成篇
    start_date: '1710'
    highlight_event_id: guji-陈鼎-event-zhushu
  - key: closure
    name: 流传抄本以示后学
    labels:
      zh: 流传后学
    start_date: '1712'
    highlight_event_id: guji-陈鼎-event-zhushu
  decisions:
  - date: '1710'
    title_zh: 以游记体详载琐细
    rationale: 郡志多略，游记可载道里远近物产寒暖，故不厌其详
  - date: '1710'
    title_zh: 存疑直书不附会旧说
    rationale: 如黑水金沙江源流诸说，足迹不到则存疑，故据实直书以俟来者
events:
- id: guji-陈鼎-event-birth
  date: '1650'
  year_of: 1650
  title_zh: 诞生于常州府江阴
  description: 清顺治七年生于江阴，少好读书属文，喜访古游览
  location_zh: 江阴
- id: guji-陈鼎-event-dianxing
  date: '1705'
  year_of: 1705
  title_zh: 由黔入滇历曲靖会城
  description: 经平彝交水曲靖入滇，登金马山俯瞰会城，访圆通华山碧鸡诸胜，记道里驿程物产
  location_zh: 曲靖昆明
- id: guji-陈鼎-event-canger
  date: '1706'
  year_of: 1706
  title_zh: 游大理苍山洱海鸡足山
  description: 访崇圣感通诸寺，登点苍览十九峰玉带，泛洱海至宾川鸡足，考南诏大理旧事及释氏遗迹，辨风花雪月诸景
  location_zh: 大理宾川
- id: guji-陈鼎-event-zhushu
  date: '1710'
  year_of: 1710
  title_zh: 撰成滇游记记滇西见闻
  description: 汇集滇中道里寺宇山水物产风俗为一编，详载温泉毒泉风穴蜜饯诸事，并辨金沙江澜沧江源流
  location_zh: 江南
- id: guji-陈鼎-event-death
  date: '1719'
  year_of: 1719
  title_zh: 终于江南
  description: 游归后以著述终老，滇游记与滇黔记游诸作流传于世
  location_zh: 江南
