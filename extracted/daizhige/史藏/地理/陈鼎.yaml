  - 安处江浙著书与远涉滇黔访验之两难
  - 耳闻旧志与目验山川异同取舍之难
  - 纪胜娱心与存实补史责任之衡
  lesson: 足至目验方为实录，山川风土皆可证史补志
  summary_first_person: 余名陈鼎，江阴人，性好远游，曾遍历滇黔山水，访寺阁碑刻，察风土物产，以所见所闻撰为滇游记，欲以行脚补郡志之阙
