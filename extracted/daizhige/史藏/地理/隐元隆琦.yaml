  lesson: 不忘家山而普利十方，以严戒清规续慧命，以文字志书垂不朽
  summary_first_person: 吾福清人，出家黄檗，嗣密云费隐之法，重兴祖庭，辑志以传信，后应请东渡扶桑，开万福寺，传戒弘律，愿临济正眼遍布海内外
