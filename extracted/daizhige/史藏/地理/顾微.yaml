  birth_date: 0280
  death_date: '0350'
  era: 晋
  reign_ref: 东晋初
  archetype: 方志博物者
  dilemmas:
  - 中原阙岭南风土，荒远之地何以传信于后
  - 传闻神怪杂异物，直书与删削如何抉择
  lesson: 处边陲亦可存史，以耳目所及补中原之阙，博物即教化
  summary_first_person: 吾顾微生逢两晋，宦游至广州，见厅事五羊瑞像，闻石牛祈雨，睹珠玑藤桂菖蒲之异，恐湮没不传，故采风谣核见闻，作广州记以存岭南一方风土
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%B9%BF%E5%B7%9E%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%9C%B0%E7%90%86/%E5%B9%BF%E5%B7%9E%E8%AE%B0.md
endeavors:
- id: guji-顾微-endeavor-1
  title_zh: 宦游岭南采风察俗
  summary: 游历广州郁林熙安怀化诸地，观山川祠祀物产，访蛮俚乡曲耆旧，为作记积累耳目之资
  phases:
  - key: brewing
    name: 初至广州观瑞像
    labels:
      zh:
      - 岭南初到
      - 五羊瑞像
    start_date: '0300'
    highlight_event_id: guji-顾微-event-1
  - key: breakthrough
    name: 遍访郡县识异俗
    labels:
      zh:
      - 石牛祈雨
      - 尉陀故迹
    start_date: '0305'
    highlight_event_id: guji-顾微-event-1
  - key: climax
    name: 深入山水辨物产
    labels:
      zh:
      - 藤桂珠玑
      - 医药物产
    start_date: '0310'
    highlight_event_id: guji-顾微-event-2
  - key: closure
    name: 采风既备归理文
    labels:
      zh:
      - 采风告成
      - 理稿待撰
    start_date: '0315'
    highlight_event_id: guji-顾微-event-2
  decisions:
  - date: '0305'
    title_zh: 以瑞应正州名分
    rationale: 广州厅事画五羊衔谷为瑞，又广州六国时属楚，故先考楚庭旧事以正地望
  - date: '0310'
    title_zh: 兼收神怪与实用
    rationale: 桂父升仙石牛致雨虽涉神异，乃乡俗所信，不可尽删，当并存以见风俗
- id: guji-顾微-endeavor-2
  title_zh: 撰述广州记垂后
  summary: 以厅事瑞像开篇，次及山川神异，终以草木医药物产收束，成岭南最早州记之一
  phases:
  - key: brewing
    name: 立纲以瑞异统篇
    labels:
      zh:
      - 发凡起例
      - 五羊开篇
    start_date: '0315'
    highlight_event_id: guji-顾微-event-2
  - key: breakthrough
    name: 分类记山水祠祀
    labels:
      zh:
      - 山水祠祀
      - 百管罗阳
    start_date: '0320'
    highlight_event_id: guji-顾微-event-2
  - key: climax
    name: 详述物产医药成书
    labels:
      zh:
      - 益智五子
      - 藤续断雍菜
    start_date: '0325'
    highlight_event_id: guji-顾微-event-2
  - key: closure
    name: 书成流传补史阙
    labels:
      zh:
      - 广州记成
      - 裨补史阙
    start_date: '0330'
    highlight_event_id: guji-顾微-event-2
  decisions:
  - date: '0320'
    title_zh: 先神异后物产为序
    rationale: 先言五羊石牛固冈以明风水祠祀，后言益智鬼目藤菜以便民用，体例由虚入实
  - date: '0325'
    title_zh: 存方言俗名不雅饰
    rationale: 蛮俚木绵古度菖蒲涧皆存本名，若改以雅言则后人难识其地其物
events:
- id: guji-顾微-event-birth
  title_zh: 晋初约生于江南
  date: 0280
  year_of: 280
  description: 晋初约生，少习史地博物，长而宦游四方
- id: guji-顾微-event-1
  title_zh: 至广州观五羊瑞像访石牛固冈
  date: '0310'
  year_of: 310
  description: 至广州厅事见梁上五羊像及五谷囊，访郁林石牛祈雨法，登熙安固冈望汉故道，采得尉陀旧闻
- id: guji-顾微-event-2
  title_zh: 考物产医药成广州记
  date: '0325'
  year_of: 325
  description: 核益智续断鬼目雍菜诸物性味主治，录明月珠水精珠怀化石墨诸产，撰成广州记流传于世
- id: guji-顾微-event-death
  title_zh: 东晋初后约卒
  date: '0350'
  year_of: 350
  description: 书成之后声名传于岭外，东晋初后约卒，其记为后世岭南志之祖
