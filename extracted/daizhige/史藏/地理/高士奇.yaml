  lesson: 以退食之暇訪故老尋故址，詳記興廢以昭儉德，守近者當任見聞之責
  summary_first_person: 余自丁巳賜居太液池之西，朝夕策馬過金鰲玉蝀，望苑中景物七閱寒暑，訪曩時舊制於老監傳聞，尋故址於離宮別館，詳於西而略於東，紀興廢而雜以時事，於甲子夏序成二卷，欲昭聖上卑宮室約園囿之儉，以存太平佳話
