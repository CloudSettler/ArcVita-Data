  decisions:
  - date: '1677'
    title_zh: 移家苑西朝夕觀察
    rationale: 以居近紫極炊煙燈火相鄰，便於旦暮經過俯仰考其興廢
  - date: '1682'
    title_zh: 訪詢前朝老監傳聞
    rationale: 去明末僅四十年宦豎存者猶多，出入禁廷得以訽訪，考校可據
- id: guji-高士奇-endeavor-2
  title_zh: 撰述金鰲退食筆記
  description_zh: 退食之頃約略傳聞彷彿尋址，詳西略東紀興廢雜時事，甲子序成二卷，備太平嘉話
  phases:
