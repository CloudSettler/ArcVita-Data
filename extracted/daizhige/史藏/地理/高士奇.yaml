    labels:
      zh: 高潮
    start_date: '1684'
    highlight_event_id: guji-高士奇-event-2
  - key: closure
    name: 四庫著錄備參稽
    labels:
      zh: 收束
    start_date: '1781'
    highlight_event_id: guji-高士奇-event-2
  decisions:
  - date: '1684'
    title_zh: 詳西略東之限
    rationale: 以所居在苑西故詳西，東如小南城葡萄園雖存總不及書，守見聞之實
  - date: '1684'
    title_zh: 立三不書之戒
    rationale: 衙署監局載在會典者不書，訪問未確者不書，外人罕窺如景山者不敢書，以存慎重
events:
- id: guji-高士奇-event-birth
  title_zh: 浙江平湖出生
  date: '1645'
  year_of: 1645
  place_zh: 浙江平湖
  description: 清順治二年出生於浙江平湖，字澹人號江村，後以博學入侍康熙內廷
- id: guji-高士奇-event-1
  title_zh: 丁巳賜居太液池西
  date: '1677'
  year_of: 1677
  place_zh: 京師西苑太液池西
  description: 丁巳賜居太液池之西，朝夕策馬過金鰲玉蝀橋，望苑中景物，始七年考校舊制
- id: guji-高士奇-event-2
  title_zh: 甲子序成退食筆記
  date: 1684-06
  year_of: 1684
  place_zh: 京師西苑
  description: 官侍講學士入侍內廷時，退食訪聞成書，詳記太液瀛台樂成紫光蕉園承光瓊華諸勝，甲子夏六月自序，凡二卷
- id: guji-高士奇-event-death
  title_zh: 康熙年間去世
  date: '1704'
  year_of: 1704
  place_zh: 京師
  description: 康熙四十三年去世，一生侍從著述宏富，所記西苑舊制多為日下舊聞採掇，四庫全書仍錄存備參稽
