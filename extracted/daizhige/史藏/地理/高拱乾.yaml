  - title_zh: 抚绥要地与百度草创之难
    description: 海外兵燹之余利弊未判学校兵政待举而政事之余又须采风问俗修志
  lesson: 新辟殊方惟殚精治道刻意民生采群言以成信史方能彰一德同风而助官方久治
  summary_first_person: 余拱乾世受国恩以荫生出守温陵蒙荐分巡台厦浮海驻节三年勤求生遂安集之道政余采揽山川风土物产习俗纂成台湾府志十卷捐俸自梓以俟后人踵事增华志在使海隅声教与上国比隆
