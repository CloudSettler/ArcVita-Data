  date: 1190
  year_of: 1190
  place_zh: 明州鄞县
  description: 鄞县人，家距它山堰不数里，幼奉教先生长者，生年无考
- id: guji-魏岘-event-wujin
  type: endeavor
  title_zh: 嘉定辛巳请重建乌金堨
  date: 1221
  year_of: 1221
  place_zh: 明州鄞县它山
  description: 言于府请重修久废乌金堨并董兴作，详见郡志及乌金堨志
- id: guji-魏岘-event-tian
  type: endeavor
  title_zh: 嘉熙三年乞增淘沙田亩
  date: 1239
  year_of: 1239
  place_zh: 明州鄞县
  description: 以淘沙利便乞增置田亩，得前政赵以夫给刘泳没官田二十九亩有奇，承程覃置田四十亩之制
- id: guji-魏岘-event-junsha
  type: endeavor
  title_zh: 淳佑元年提督大浚它山沙港
  date: 1241-10-10
  year_of: 1241
  place_zh: 它山堰口至新安庙前
  description: 受余天锡委提督浚治，分顾三乡人户柴船户，给米二升官钱四十足，自十月十日甲子至十一月二十六日迄事，放水奔湍而入
- id: guji-魏岘-event-book
  type: endeavor
  title_zh: 淳佑二年撰成四明它山水利备览
  date: 1242-02-11
  year_of: 1242
  place_zh: 鄞县
  description: 上元节书序，上卷杂志源流规制修造始末，下卷收碑记题咏诗，记唐太和七年王元暐作堰浚日月二湖立三堨之事
- id: guji-魏岘-event-death
  type: death
  title_zh: 卒于鄞里
  date: 1260
  year_of: 1260
  place_zh: 明州鄞县
  description: 淳佑以后卒于乡里，卒年无考，备览经陈朝辅于崇祯辛巳梓行而传
