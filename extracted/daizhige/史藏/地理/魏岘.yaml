person:
  qid: guji-魏岘
  name_zh: 魏岘
  names:
    zh: 魏岘
    en: Wei Xian
  lifespan:
    birth:
      date: 1190
      precision: year
      is_circa: true
      raw: 南宋鄞县人，生年无考，约嘉定以前
    death:
      date: 1260
      precision: year
      is_circa: true
      raw: 淳佑以后卒，卒年无考
  birth_date: 1190
  death_date: 1260
  era: 南宋
  reign_ref: 宋理宗嘉定至淳佑
  archetype: 乡居经世型循吏
  dilemmas:
  - 灵迹不可妄动与久坏必修之辨，须破增损得祸之说而护堰体
  - 旱岁急浚救苗与农隙深广久浚之权衡，须立岁浚之制
  - 私家出力雇募与官仓收桩就近支发之选择，须免缓不及事
  lesson: 水利贵在躬考源委深浚久护，破惑而修，著书传法，方能泽及七乡久远
  summary_first_person: 我是魏岘，鄞县人，曾任朝奉郎提举福建路市舶，归居它山堰旁十余年，日与田夫野老讲井里事，受州家所托任修堨淘沙造闸之责，考图志记文参以己见，于淳佑二年编成四明它山水利备览，愿讲明水政者观此易为力
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/地理/四明它山水利备览.md
  - https://daizhige.org/史藏/地理/四明它山水利备览.html
endeavors:
- id: guji-魏岘-endeavor-1
  title_zh: 请复乌金堨与主持它山淘沙防沙
  summary: 嘉定辛巳请朝重建久废乌金堨，嘉定以来屡行障水浚港，淳佑元年提督浚治沙港五百余丈，立石闸叠堤砌岸防沙三策，并请仓田以充岁浚
  phases:
  - key: brewing
    name: 归居究利病
    labels:
      zh: 居堰旁访田夫野老
    start_date: 1215
    highlight_event_id: guji-魏岘-event-wujin
  - key: breakthrough
    name: 请朝复上水堨
    labels:
      zh: 嘉定辛巳请重建乌金堨
    start_date: 1221
    highlight_event_id: guji-魏岘-event-wujin
  - key: climax
    name: 提督大浚沙港
    labels:
      zh: 淳佑辛丑率三乡浚堰口至新安
    start_date: 1241-10-10
    highlight_event_id: guji-魏岘-event-junsha
  - key: closure
    name: 立防沙养堰制
    labels:
      zh: 筑叠堤立闸砌岸护堤禁越堰
    start_date: 1242
    highlight_event_id: guji-魏岘-event-junsha
  decisions:
  - date: 1221
    title_zh: 请于府朝重建乌金堨
    rationale: 上水堨久废则暴流无所泄蓄，复之可启闭蓄泄以济小溪镇入城河渠
  - date: 1241-10-10
    title_zh: 以官钱米优雇三乡及柴船户大浚
    rationale: 沙淤高出水面舟楫不通田失溉，须标识界分晨集暮放深广浚治，浚深一尺则获尺水之利
  - date: 1242
    title_zh: 主张叠堤石闸砌岸三法防沙
    rationale: 平地横沙与湍流挟沙及两岸坍沙三源易壅，须斜筑石堤植榆柳，狭处立闸以水为则，两岸钉桩砌叠，方能永久
- id: guji-魏岘-endeavor-2
  title_zh: 编撰四明它山水利备览并立仓田岁浚制
  summary: 考图志碑记耆老之言，记它山水源堰制三堨二湖淘沙诸法，辨唐志谬误，成二卷备览，并请以官田租充淘沙顾夫之用
  phases:
  - key: brewing
    name: 考图志询耆老
    labels:
      zh: 讲源委究利病考兴造增修
    start_date: 1239
    highlight_event_id: guji-魏岘-event-tian
  - key: breakthrough
    name: 请增仓田充浚费
    labels:
      zh: 嘉熙三年乞增置田亩申朝省
    start_date: 1239
    highlight_event_id: guji-魏岘-event-tian
  - key: climax
    name: 编帙成书
    labels:
      zh: 淳佑二年上元编成上下二卷
    start_date: 1242-02-11
    highlight_event_id: guji-魏岘-event-book
  - key: closure
    name: 以书传水政
    labels:
      zh: 庶几讲明水政者易为力
    start_date: 1242-02-11
    highlight_event_id: guji-魏岘-event-book
  decisions:
  - date: 1239
    title_zh: 乞增置田亩并申朝省永充淘沙用
    rationale: 程覃置谷田赵以夫给米田散在丞厅观宇，旱时申请转折缓不及事，须府仓收桩委小溪监镇就近支发
  - date: 1242-02-11
    title_zh: 编为备览上下卷记修造始末
    rationale: 学道爱人不必拘其事，它山关七乡丰歉，须记源流规制碑记题咏，使后人知蓄泄启闭修沙捍土之要
  - date: 1242
    title_zh: 辨正唐地理志谬误
    rationale: 志以开元王元纬置小江湖与史异文，考诸碑记僧诗，证太和七年王元暐作堰浚日月二湖立三堨，不可以史疑书
events:
