endeavors:
- id: guji-魏源-endeavor-1
  title_zh: 辑四洲志成海国图志师夷长技
  summary: 据林则徐所译四洲志及历代史志明以来岛志与夷图夷语，钩稽贯串，图经表纬，成六十卷后增补百卷，以西洋人谭西洋，开眼看世界
  phases:
  - key: brewing
    name: 得林尚书四洲志萌志
    labels:
      zh: 积材
    start_date: 1841-01-01
    highlight_event_id: guji-魏源-event-jinshi
  - key: breakthrough
    name: 壬寅嘉平叙志于扬州
    labels:
      zh: 立纲
    start_date: 1842-06-01
    highlight_event_id: guji-魏源-event-haiguo-first
  - key: climax
    name: 道光廿七刻六十卷于扬州
    labels:
      zh: 成书
    start_date: 1847-01-01
    highlight_event_id: guji-魏源-event-haiguo-first
  - key: closure
    name: 咸丰二年补成百卷刊高邮
    labels:
      zh: 增广
    start_date: 1852-01-01
    highlight_event_id: guji-魏源-event-haiguo-expanded
  decisions:
  - date: 1842-12-01
    title_zh: 以夷攻夷以夷款夷师夷长技为纲
    rationale: 爱恶相攻远近相取，不知敌形敌情利害相百，故为制夷而作
  - date: 1847-01-01
    title_zh: 以图经之表纬之博参群议发挥之
    rationale: 旧图止有正背总图不足惬左图右史，故每国一图开方里差以资控驭
- id: guji-魏源-endeavor-2
  title_zh: 作筹海篇议守议战议款
  summary: 主张以守为攻以守为款，守外洋不如守海口守海口不如守内河，调客兵不如练土兵，并陈浙粤闽苏津防要塞火舟水勇水雷之法
  phases:
  - key: brewing
    name: 历夷变察战款皆失守要
    labels:
      zh: 察势
    start_date: 1840-06-01
    highlight_event_id: guji-魏源-event-jinshi
  - key: breakthrough
    name: 提守内河火攻断后之策
    labels:
      zh: 议守
    start_date: 1842-01-01
    highlight_event_id: guji-魏源-event-haiguo-first
  - key: climax
    name: 分省论地利得失与上中下策
    labels:
      zh: 筹防
    start_date: 1843-01-01
    highlight_event_id: guji-魏源-event-haiguo-first
  - key: closure
    name: 归本于人心人才去寐祛虚
    labels:
      zh: 归本
    start_date: 1852-01-01
    highlight_event_id: guji-魏源-event-haiguo-expanded
  decisions:
  - date: 1842-06-01
    title_zh: 专主守内河诱深入而歼之
    rationale: 夷艘长于外洋短于内河，鱼贯狭浅可设伏塞港，用火舟水雷火箭夹攻必奏奇功
  - date: 1843-01-01
    title_zh: 弃舟山宝山虚岛而守要港
    rationale: 城逼海滨炮及城内迥非可守，不如移兵南田守宁波镇海，弃宝山守上海东沟以守约为奇
events:
- id: guji-魏源-event-birth
  date: 1794-04-23
  year_of: 1794
  title_zh: 出生于湖南邵阳
  description: 乾隆五十九年三月二十三生于邵阳，字默深，后以经世致用名世
- id: guji-魏源-event-jinshi
  date: 1822-01-01
  year_of: 1822
  title_zh: 道光二年成进士入仕
  description: 道光二年登进士，历内阁中书，留心经世，佐林则徐筹海防禁烟事，得四洲志译本
- id: guji-魏源-event-haiguo-first
  date: 1843-01-01
  year_of: 1843
  title_zh: 叙海国图志于扬州初刻六十卷
  description: 道光二十二年壬寅嘉平月叙于扬州，据四洲志史志夷图夷语成书，主师夷长技以制夷，道光二十七年刻六十卷于扬州
- id: guji-魏源-event-haiguo-expanded
  date: 1852-01-01
  year_of: 1852
  title_zh: 咸丰二年补刊百卷于高邮
  description: 咸丰二年叙于高邮州，增东南洋西南洋大小西洋北洋外大洋诸志及教门纪年诸表，附天文地球水战火攻图成百卷
- id: guji-魏源-event-death
  date: 1857-03-26
  year_of: 1857
  title_zh: 咸丰七年卒
  description: 咸丰七年三月初一卒，一生愤忧夷患，欲以实事程实功革虚务实，遗书启洋务之先声
