  dilemmas:
  - 以夷攻夷与以夷款夷之间如何兼顾守战
  - 守外洋与守海口守内河之间如何取舍地利
  - 师夷长技与人心人才之本之间孰为兵机孰为兵本
  lesson: 为以夷攻夷而作，为师夷长技以制夷，知形知情，去伪饰畏难，务实功实事
  summary_first_person: 吾邵阳魏源字默深，道光进士，感于夷变，据林尚书四洲志及历代史志夷图夷语，成海国图志六十卷后增至百卷，倡以守为攻为款，欲祛人心之寐患人才之虚患
