- id: guji-于谦-event-1449-qingli
  year_of: 1449
  date: '1449-08-29'
  precision: day
  is_circa: false
  title_zh: 伏阙力请郕王即位
  description_zh: 正统十四年八月二十九日，土木败绩之后，文武百官具本伏文华门请郕王即位，王再三辞让，尚书王直、于谦、陈循等咸以宗庙社稷大计为言，力请不退，会太后命亦下，乃许以九月初六日即位
  endeavor_ids:
  - guji-于谦-endeavor-1
  - guji-于谦-endeavor-2
- id: guji-于谦-event-1449-refuse
  year_of: 1449
  date: '1449-10-10'
  precision: day
  is_circa: false
  title_zh: 拒也先索迎之诈
  description_zh: 十月初十日，虏酋也先合众拥太上皇帝入关，直造城下，索大臣王直、于谦出迎，众知其诈不出，乃遣王复、王荣充大臣出迎
  endeavor_ids:
  - guji-于谦-endeavor-1
- id: guji-于谦-event-1449-defense
  year_of: 1449
  date: '1449-10-12'
  precision: day
  is_circa: true
  title_zh: 督师凭城力战却虏
  description_zh: 兵部尚书于谦督率总兵分营凭城与战，互有杀伤，连战二三日虏不退；陈循请调各省精骑入卫并榜谕悬赏，至十四、五日也先果先遁去，内外赞画防御，于谦之力居多
  endeavor_ids:
  - guji-于谦-endeavor-1
  - guji-于谦-endeavor-2
- id: guji-于谦-event-1457-death
  year_of: 1457
  date: 1457-01
  precision: month
  is_circa: true
  title_zh: 夺门之变中被执杀
  description_zh: 天顺元年正月，太监曹吉祥、武清侯石亨等密谋迎太上皇于南城复位，执于谦、王文、范广杀之，罪其迎外藩也，然实无此事，时诸人欲张己功，假此以为名
  endeavor_ids:
  - guji-于谦-endeavor-1
  - guji-于谦-endeavor-2
- id: guji-于谦-event-death
  year_of: 1457
  date: 1457-01
  precision: month
  is_circa: true
  title_zh: 于谦卒
  description_zh: 于天顺元年正月夺门之变中与王文、范广同被杀
