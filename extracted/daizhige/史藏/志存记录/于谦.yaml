    highlight_event_id: guji-于谦-event-1449-qingli
  - key: breakthrough
    name_zh: 拒也先索迎，凭城督战
    labels:
      zh:
      - 却敌安邦
      - 兵部尚书
    start_date: '1449-10-10'
    highlight_event_id: guji-于谦-event-1449-defense
  - key: closure
    name_zh: 夺门之变中遇害
    labels:
      zh:
      - 身死非命
    start_date: 1457-01
    highlight_event_id: guji-于谦-event-1457-death
  decisions:
  - date: '1449-08-29'
    title_zh: 与王直、陈循等以宗庙社稷大计力请郕王即位
    rationale: 土木败绩，人心危疑，思得长君以弭祸乱，故伏阙力请，不得已而为此变通之举
  - date: '1449-10-10'
    title_zh: 拒也先索大臣出迎，督率总兵分营凭城与战
    rationale: 知也先挟太上皇帝入关为诈，出迎必堕其计；凭城固战，连战二三日，虏势沮而遁去
- id: guji-于谦-endeavor-2
  name_zh: 景泰朝辅政
  phases:
  - key: brewing
    name_zh: 以兵部尚书赞画防御
    labels:
      zh:
      - 内外赞画
      - 勤劳王事
    start_date: 1449-10
    highlight_event_id: guji-于谦-event-1449-defense
  - key: climax
    name_zh: 景泰数年敬礼大臣、宽恤民下之局中任事
    labels:
      zh:
      - 辅弼之臣
    start_date: '1450'
    highlight_event_id: guji-于谦-event-1449-qingli
  - key: closure
    name_zh: 天顺改元被黜杀，名随功没
    labels:
      zh:
      - 功成身殒
    start_date: 1457-01
    highlight_event_id: guji-于谦-event-1457-death
  decisions:
  - date: 1449-10
    title_zh: 以内外赞画防御为己任，与陈循协力居多
    rationale: 虏骑剽掠、势亦张大，居阁者未明而入、抵暮而出，防御之事赖于谦之力为多
events:
- id: guji-于谦-event-birth
  year_of: 1398
  date: '1398'
  precision: year
