person:
  qid: guji-于谦
  name_zh: 于谦
  names:
    zh: 于谦
    en: Yu Qian
  lifespan:
    birth:
      date: '1398'
      precision: year
      is_circa: true
      raw: 洪武年间生（古文本未载，据史补）
    death:
      date: 1457-01
      precision: month
      is_circa: true
      raw: 天顺元年正月，与王文、范广同被执杀
  birth_date: '1398'
  death_date: 1457-01
  era: 明代
  reign_ref: 正统·景泰·天顺
  archetype: 社稷之臣·救时宰相
  dilemmas:
  - 土木之变后英宗被俘，拥立郕王即位以安社稷，须冒迎立外藩之嫌、担擅立之名
  - 也先挟太上皇帝叩关索迎，出迎恐堕其诈，不出则恐伤上皇；坚拒出迎并督师凭城决战
  - 夺门之变后，以无实之“迎外藩”罪被杀，功在社稷而身死非命
  lesson: 社稷为重，不以一身利害易其守；危疑之际，挺身任事，虽死不悔
  summary_first_person: 土木败绩之后，我以兵部尚书之力请郕王即位，以绝也先挟持之谋；及其拥上皇至城下索我出迎，我知其诈而不出，督率总兵分营凭城与战，连战二三日虏骑乃遁。然天顺改元，曹吉祥、石亨辈迎上皇复位，假“迎外藩”为名执而杀我，实无此事。功之所在，祸亦随之，我固无憾于社稷。
endeavors:
- id: guji-于谦-endeavor-1
  name_zh: 力保社稷·北京保卫战
