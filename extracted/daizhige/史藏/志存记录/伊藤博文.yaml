      is_circa: false
  birth_date: 1841-10-16
  death_date: 1909-10-26
  era: 日本明治时期
  reign_ref: 明治天皇在位期间
  archetype: 外交强权谈判者
  dilemmas:
  - 以“全权”礼仪问题为名拒绝张荫桓、邵友濂，实则挟战胜之势索取更大让步
  - 在马关谈判中对年迈的李鸿章坚持苛刻条款，但于停战质压问题上有所回旋
  - 私下向伍廷芳暗示愿与李鸿章议和，试探清廷意向而不露底牌
  lesson: 谈判中“全权”名分与实质权力之争，往往是大国压制弱国的先手棋
  summary_first_person: 我以日本内阁总理大臣之身为全权大臣，先在广岛以“敕书全权不足”拒却张荫桓、邵友濂之议和使团，又私下向伍廷芳示意惟李鸿章堪任此事。及李鸿章衔命至马关，我于春帆楼与之互校敕书、往复议约，先以停战条件索大沽、天津、山海关为质，后于条款中割地、赔款诸端坚持不让，终成定议。
