  decisions:
  - date: '1895-01-08'
    title_zh: 以清使全权不足为由绝张荫桓、邵友濂之议
    rationale: 指清国敕书未载便宜行事全权，无立草约签名捺印之权，断不开议，免劳往返
  - date: 1895-02
    title_zh: 私下向伍廷芳暗示惟李鸿章堪任议和
    rationale: 探清廷虚实，促成以威望素着之重臣衔全权来议，取 弃，割膏腴、偿巨款
  - date: '1895-03-21'
    title_zh: 停战谈判中坚持以大沽、天津、山海关为质
    rationale: 挟战胜之势以驻兵为质，保障军队继续进攻直隶之选择权
  - date: '1895-04-15'
    title_zh: 递尽头约稿，限四日答复，称但允不允两言而决
    rationale: 于割地减宽甸、赔款减至二万万两等处微让，而大局坚持，逼清方速允
