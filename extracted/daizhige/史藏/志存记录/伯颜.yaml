  - 舍郢不攻直趋大江或先拔坚城以绝后患
  - 贪取小胜致骄惰或忍小利以求一鼓全功
  - 严刑立威斩拒敌者或宽纵安民秋毫无犯
  lesson: 奉仁义而行不杀为武以奇正审缓急以纪律得众心则江南可传檄而定
  summary_first_person: 吾蒙圣遇寄以心膂总兵南伐自襄樊沿汉而下舍郢趋江一鼓渡阳逻大败贾似道于丁家洲抚建康而候秋再举惟愿不杀如曹彬以全功报天子
