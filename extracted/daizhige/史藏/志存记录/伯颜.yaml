  - date: 1275-03-01
    title_zh: 拒和议以决胜负
    rationale: 奉旨举兵为宋失信安敢退兵惟纳土归附可闻奏否则以坚甲决胜
  - date: 1275-03-20
    title_zh: 驻建康分守镇江两淮
    rationale: 沿江归附州郡众多当选威望将守之约束不下乡扰民以固根本
events:
- id: guji-伯颜-event-birth
  title_zh: 出生
  date: 1236-01-01
  year_of: 1236
  description_zh: 元初生于蒙古八邻部后以德器为世祖所知拜中书平章
- id: guji-伯颜-event-xiangfan
  title_zh: 襄樊会兵舍郢入汉江
  date: 1274-09-01
  year_of: 1274
  description_zh: 至元十一年秋会兵襄樊沿汉而下怒斥惮涉溧水者破黄家原堡治堰荡舟过郢城不攻而去殿后破郢追兵于汉上
- id: guji-伯颜-event-yangluo
  title_zh: 阳逻堡渡江大捷
  date: 1275-01-01
  year_of: 1275
  description_zh: 观大江形势密令阿术溯流上趋青山矶得南岸亲冒矢石督舟师冲宋船夏贵溃遁遂渡江取鄂州汉阳
- id: guji-伯颜-event-dingjiazhou
  title_zh: 丁家洲败贾似道
  date: 1275-03-01
  year_of: 1275
  description_zh: 至池州下流贾似道孙虎臣以十余万屯丁家洲求和不许督战夹江树炮并力攻之宋兵大溃江水为赤
- id: guji-伯颜-event-jiankang
  title_zh: 入建康镇守抚谕江南
  date: 1275-03-20
  year_of: 1275
  description_zh: 赵制置遁去遣榜抚谕入建康大赉三军令镇江两淮分守约束不扰民传檄而江南滁宁等数十城款附
- id: guji-伯颜-event-death
  title_zh: 逝世
  date: 1295-01-11
  year_of: 1295
  description_zh: 平宋全功还朝拜中书右丞相晚年勋望益重至元末逝世谥忠武
