  description: 七月初一乡兵十余万会于砖桥阵法不整为李成栋左右翼冲溃死者塞河成栋遂屠娄塘与太仓合嘉定成孤城
- id: guji-侯峒曾-event-death
  title_zh: 嘉定城破殉国
  date: 1645-08-24
  year_of: 1645
  place_zh: 嘉定县城
  description: 七月初四李成栋破城与黄淳耀等分守不屈死之阖城屠戮是为嘉定三屠之始
