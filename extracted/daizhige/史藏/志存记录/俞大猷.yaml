endeavors:
- id: guji-俞大猷-endeavor-1
  title_zh: 普陀捣巢破王直徐海
  summary_zh: 嘉靖三十二年随巡抚王忬，以参将率锐兵直捣普陀诸山倭砦，焚庐舍毁艅艎，复追退昌国临山之寇，毁巢于海上
  phases:
  - key: brewing
    name: 释旧将募新兵
    labels:
      zh:
      - 释卢镗尹凤
      - 募壮民狼兵
    start_date: 1552-07
    highlight_event_id: guji-俞大猷-event-putuo
  - key: breakthrough
    name: 直捣普陀焚砦
    labels:
      zh:
      - 会哨普陀
      - 纵火焚庐
    start_date: 1553-03
    highlight_event_id: guji-俞大猷-event-putuo
  - key: climax
    name: 邀击逸寇斩获过百
    labels:
      zh:
      - 表头北邀击
      - 斩俘并获
    start_date: 1553-03
    highlight_event_id: guji-俞大猷-event-putuo
  - key: closure
    name: 回师守浙东洋面
    labels:
      zh:
      - 昌国解围
      - 临山追斩
    start_date: 1553-04
    highlight_event_id: guji-俞大猷-event-wusong
  decisions:
  - date: 1553-03
    title_zh: 请以锐兵先发巨艘继之
    rationale: 倭结砦海中时出近洋袭我，若不猝发纵火焚其庐舍，则巢固难拔，故分俞大猷汤克宽两路径趋
  - date: 1553-04
    title_zh: 以舟师守扼昌国临山
    rationale: 巢虽破而渠魁逸散必犯内地卫所，当以舟师邀击于洋面，不使登陆久据
- id: guji-俞大猷-endeavor-2
  title_zh: 王江泾合剿柘林新倭
  summary_zh: 嘉靖三十四年以总兵副总兵督狼土官兵，会张经卢镗诸军，邀击自柘林犯嘉兴之倭于石塘湾王江泾，擒斩近二千，为倭患以来第一功
  phases:
  - key: brewing
    name: 调永顺保靖狼兵
    labels:
      zh:
      - 征调土司
      - 分配诸将
    start_date: 1555-04
    highlight_event_id: guji-俞大猷-event-wangjiangjing
  - key: breakthrough
    name: 石塘湾初战挫敌
    labels:
      zh:
      - 石塘湾大战
      - 逼敌北走
    start_date: 1555-05
    highlight_event_id: guji-俞大猷-event-wangjiangjing
  - key: climax
    name: 王江泾南北夹击
    labels:
      zh:
      - 永顺邀击
      - 保靖击后
    start_date: 1555-05
    highlight_event_id: guji-俞大猷-event-wangjiangjing
  - key: closure
    name: 余寇奔归柘林清野
    labels:
      zh:
      - 追溃残倭
      - 松江出海截击
    start_date: 1555-07
    highlight_event_id: guji-俞大猷-event-wusong
  decisions:
  - date: 1555-05
    title_zh: 以土司兵当锋水陆并击
    rationale: 柘林新倭四千突犯嘉兴，江南脆兵望风奔溃，唯狼土兵敢战，当使彭盖臣彭翼南分道邀击以挫其锐
  - date: 1555-07
    title_zh: 乘胜追击吴淞出海之倭
    rationale: 王江泾虽溃而苏松嘉善余倭尚趋松江出海，当遣舟师败之于吴淞所，不使复聚为巢
events:
- id: guji-俞大猷-event-birth
  title_zh: 生于晋江
  date: 1503
  year_of: 1503
  place_zh: 泉州府晋江
  summary_zh: 弘治十六年生于晋江武家，少好武，嘉靖年间以武举入仕
- id: guji-俞大猷-event-putuo
  title_zh: 普陀焚巢大破倭砦
  date: 1553-03
  year_of: 1553
  place_zh: 普陀诸山洋面
  summary_zh: 受王忬命以参将率锐兵先发，汤克宽以巨艘继之，径趋王直徐海所结海中砦纵火焚庐舍，斩首五十余级生擒百四十三人，飓风作而王直逸去，尹凤复邀击于表头北斩俘百余
- id: guji-俞大猷-event-wusong
  title_zh: 吴淞所击败苏州东窜之倭
  date: 1553-07
  year_of: 1553
  place_zh: 吴淞所松江洋面
  summary_zh: 苏州倭至嘉善趋松江出海，以总兵督兵败之于吴淞所，擒七人斩首二十三级
- id: guji-俞大猷-event-wangjiangjing
  title_zh: 王江泾大捷
  date: 1555-05
  year_of: 1555
  place_zh: 石塘湾王江泾
  summary_zh: 会总督张经诸军，以永顺宣慰司官舍彭翼南邀击北走平望之倭于王江泾，保靖兵击其后，诸军共擒斩一千九百八十有奇，为有倭患以来第一功
- id: guji-俞大猷-event-death
  title_zh: 卒于万历初
  date: 1579
  year_of: 1579
  place_zh: 南京
  summary_zh: 历两广总兵南京右府都督佥事，万历七年卒，赠左都督
