  reign_ref: 嘉靖
  archetype: 御倭干城
  dilemmas:
  - 江南兵脆而倭锋甚锐，当严申军法以立威还是姑息将领以求速战
  - 海寇飘忽巢穴在外洋，当冒险捣巢焚砦还是坚守内洋以保全舟师
  lesson: 欲平海寇必先练兵肃纪，以纪律化脆为劲，以会哨制飘忽之敌
  summary_first_person: 我本晋江武家子，嘉靖年间以武举任备倭诸职，与卢镗汤克宽共事王忬张经麾下，募沿海壮民征狼土兵，焚普陀之巢却昌国之围，复邀击于王江泾，亲见江南糜烂而将懦法弛，方知练胆练艺方能御倭
  source_urls:
