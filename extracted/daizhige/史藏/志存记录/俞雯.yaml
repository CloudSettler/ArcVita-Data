  - date: 1837
    title_zh: 日课七百字为掌生写诗
    rationale: 掌生以科场事系狱长日无事界乌丝兰格写诗夜归亦必补足以文字酬知己
  - date: 1837-09-01
    title_zh: 移居羊毛胡同立咏霓堂
    rationale: 既脱籍不宜久羁传经堂故别居华首堂改榜咏霓堂以新门户
  - date: 1838-03-01
    title_zh: 率弟子秀芸入四喜部
    rationale: 四喜旧多白发父老声律不竞欲以新秀振兴旧部故携秀芸往投
