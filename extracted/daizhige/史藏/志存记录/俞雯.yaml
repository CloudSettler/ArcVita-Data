  title_zh: 戊戌春入四喜部
  date: 1838-03-01
  year_of: 1838
  summary: 率弟子秀芸由春台转入四喜部时人望四喜复兴其自题画兰云可怜一样庭阶种流落人间当草看志可嘉也
