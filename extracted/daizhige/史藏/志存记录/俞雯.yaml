    rationale: 师初令裹头为女子装演摇会剧志不可屈故改小生以全其志
  - date: 1836-09-15
    title_zh: 以肝胆酬许金桥
    rationale: 与许金桥交厚闻其为债家所逼即载数百钱往偿不惜私蓄倾尽
