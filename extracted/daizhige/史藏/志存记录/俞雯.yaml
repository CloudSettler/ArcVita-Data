  date: 1820
  year_of: 1820
  summary: 吴中旧家子父隶巡抚麾下为材官家有八男行第三以嘉庆二十五年庚辰生小名阿龙
- id: guji-俞雯-event-fame
  type: career
  title_zh: 传经堂继韵香成名
  date: 1836-09-15
  year_of: 1836
  summary: 与韵香同里同师韵香没后得传经堂举止无俗韵如水仙在清泉白石间丙申中秋倾私蓄济许金桥一时传为佳话
- id: guji-俞雯-event-move
  type: career
  title_zh: 移居羊毛胡同咏霓堂
  date: 1837-09-01
  year_of: 1837
  summary: 丁酉脱弟子籍秋七月为掌生纳橐饘秋八月移居石头胡同内羊毛胡同掌生篆梦侠情禅室榜华首堂改题咏霓堂善画水墨兰蕙落纸数十幅
- id: guji-俞雯-event-sixi
