  dilemmas:
  - 死节殉国与老母在堂（八十四岁）的忠孝两难
  - 中表施略劝其效文文山忍耻出外举兵图恢复，与即死殉君之间的抉择
  lesson: 血性男子，君亡则死社稷；尽忠即所以尽孝，身许国则义无两全。
  summary_first_person: 我倪元璐，字鸿宝，上虞人，壬戌进士，官至户、礼两部尚书。甲申三月十八日蒙先帝密召，次日贼入城，我知事不可为、君必死社稷，遂朱衣束带，北向拜阙、南向拜母，酹酒关帝前而自誓从之。施略劝我忍耻举兵图恢复，我厉声拒之；念老母八十四犹健，泪下而无所憾。留书嘱死后委我于壑、勿用棺衾以志吾痛，遂南向自缢于厅事。贼骑至而愕叹「可惜明朝一好官」，王公弼榜门曰「忠义之门」。弘光朝赠太保，諡「文正」。
  source_urls:
  - https://zh.wikisource.org/wiki/雪交亭正氣錄
