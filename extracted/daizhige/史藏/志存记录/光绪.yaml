  dilemmas:
  - 亲裁大政与慈禧训政之间难自专而欲自全
  - 革新富强与守旧亲贵之间欲用人而掣肘
  - 母子名分与君臣大义之间欲孝养而终见疑
  lesson: 天挺英明而处万难之会遵养时晦终损天年空怀奋发之志
  summary_first_person: 朕四岁入承大统幼而提携长而禁制十九年未尝一日展容舒气亲政后欲右文革新致富强擢康梁任四贵而枢辅掣肘母后疑忌戊戌训政幽于瀛台己亥建储庚子播迁此生无母子夫妇昆季之爱亦无臣下宴游之乐惟留此三十四年朝局以告后人
