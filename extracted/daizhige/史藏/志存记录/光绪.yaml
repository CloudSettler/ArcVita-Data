    start_date: 1898-09-21
    highlight_event_id: guji-光绪-event-coup
  decisions:
  - date: 1898-06-11
    title_zh: 明定国是广开言路
    rationale: 环顾枢辅庸懦外难日迫欲革新庶政致富强
  - date: 1898-08-01
    title_zh: 擢谭嗣同杨锐刘光第林旭参赞军机
    rationale: 思得气节知士专理新政以厉威风众调处顽固守旧
- id: guji-光绪-endeavor-2
  title_zh: 己亥建储与庚子国难
  summary_zh: 戊戌后储贰久虚荣禄等谋废立改立大阿哥溥儁兼祧穆宗义和拳起信拳攻使酿成庚子大难
  phases:
  - key: brewing
    name: 桐宫传闻储位久虚
