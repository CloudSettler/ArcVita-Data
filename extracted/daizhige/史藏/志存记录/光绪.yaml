    start_date: 1900-01-24
    highlight_event_id: guji-光绪-event-heir
  - key: climax
    name: 纵容拳匪围攻使馆
    labels:
      zh: 拳乱召衅
    start_date: 1900-06-21
    highlight_event_id: guji-光绪-event-boxer
  - key: closure
    name: 国亡在前犹言一战
    labels:
      zh: 庚子播迁前夜
    start_date: 1900-08-01
    highlight_event_id: guji-光绪-event-boxer
  decisions:
  - date: 1900-01-24
    title_zh: 立溥儁为大阿哥兼祧穆宗
    rationale: 春秋已盛无皇子欲以近支承统符吴可读前议
  - date: 1900-06-21
    title_zh: 主战诏下恃人心御洋人
    rationale: 积弱已极所仗人心若并失之何以立国不肯拱手而亡
events:
- id: guji-光绪-event-birth
  title_zh: 诞于醇王府槐阴斋
  date: 1871-08-14
  year_of: 1871
  description_zh: 同治十年六月二十八日为醇贤亲王长子母叶赫那拉氏诞于宣武门内西太平街醇王府
- id: guji-光绪-event-wedding
  title_zh: 大婚亲裁大政
  date: 1889-02-26
  year_of: 1889
  description_zh: 光绪十五年正月大婚皇后叶赫那拉氏纳珍嫔瑾嫔始亲裁大政间日诣颐和园请安章疏封送园中
- id: guji-光绪-event-reform
  title_zh: 戊戌兴定国是
  date: 1898-06-11
  year_of: 1898
  description_zh: 甲午辽东丧师后锐欲革新召康有为以维新进开懋勤殿之议擢四贵参赞军机广开言路
- id: guji-光绪-event-coup
  title_zh: 戊戌训政迁瀛台
  date: 1898-09-21
  year_of: 1898
  description_zh: 八月初四太后由间道入宫尽括章疏临朝训政尽反新政迁上于南海瀛台并坐如二君臣工奏对嘿不发言
- id: guji-光绪-event-heir
  title_zh: 立溥儁为大阿哥
  date: 1900-01-24
  year_of: 1900
  description_zh: 己亥十一月召集近支王贝勒大臣于仪鸾殿立端郡王载漪子溥儁为大阿哥兼祧穆宗入居阿哥所开弘德殿
- id: guji-光绪-event-boxer
  title_zh: 仪鸾殿召对论拳匪
  date: 1900-06-20
  year_of: 1900
  description_zh: 五月召王大臣六部九卿于仪鸾殿议剿抚拳匪太后恃人心董福祥朱祖谋等力争剿匪未得要领终至开衅
- id: guji-光绪-event-death
  title_zh: 崩于瀛台
  date: 1908-11-14
  year_of: 1908
  description_zh: 在位三十四年无疾病而未尝展容终损天年弃臣民后冲主即位传之后世以明朝局真相
