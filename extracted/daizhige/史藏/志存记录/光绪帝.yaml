    rationale: 甲午战败国势益危，欲以变法图存自强
  - date: 1898-09-21
    title_zh: 被幽后坚守变法之志
    rationale: 政变被废亦不改图强初衷，以存社稷人心
events:
- id: guji-光绪帝-event-birth
  title_zh: 出生于醇王府
  date: 1871-08-14
  year_of: 1871
  place_zh: 北京醇王府
  description_zh: 同治十年六月二十八日生，为醇亲王奕譞之子，名载湉
- id: guji-光绪帝-event-enthroned
  title_zh: 冲龄入宫承统
  date: 1875-02-25
  year_of: 1875
  place_zh: 北京紫禁城
  description_zh: 同治帝崩无嗣，四岁入宫即皇帝位，年号光绪，由两宫垂帘听政
- id: guji-光绪帝-event-prep
  title_zh: 杭州织造传办大婚衣料
  date: 1888-12-01
  year_of: 1888
  place_zh: 杭州织造及礼仪处
  description_zh: 传办御用明黄江绸纱袍褂及皇后妆奁袍衣马褂紧身并各色缎绸纱罗宫扇香器等数千件匹
- id: guji-光绪帝-event-wedding
  title_zh: 大婚礼成册立皇后
  date: 1889-02-26
  year_of: 1889
  place_zh: 北京紫禁城坤宁宫
  description_zh: 光绪十五年正月二十七日大婚，册立叶赫那拉氏为皇后，是为隆裕
- id: guji-光绪帝-event-qinzheng
  title_zh: 归政亲政
  date: 1889-03-04
  year_of: 1889
  place_zh: 北京紫禁城太和殿
  description_zh: 大婚后慈禧归政，开始亲裁政事，勤勉听政以图振作
- id: guji-光绪帝-event-reform
  title_zh: 明定国是推行维新
  date: 1898-06-11
  year_of: 1898
  place_zh: 北京紫禁城
  description_zh: 下明定国是诏，推行戊戌变法，力图自强存续国运
- id: guji-光绪帝-event-death
  title_zh: 崩于瀛台涵元殿
  date: 1908-11-14
  year_of: 1908
  place_zh: 北京中南海瀛台
  description_zh: 光绪三十四年十月二十一日崩，年三十八，幽废十年而终
