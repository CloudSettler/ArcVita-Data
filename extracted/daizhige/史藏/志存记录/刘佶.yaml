endeavors:
- id: guji-刘佶-endeavor-1
  title_zh: 扈从北巡出塞
  summary_zh: 闰七月夜从哈剌章出建德门，历居庸鸡鸣营口中都至上都，见证关无一兵峰崩马惊京师失守
  phases:
  - key: brewing
    name: 夜决去就随行
    labels:
      zh: 去就从公
    start_date: 1368-09-12
    highlight_event_id: guji-刘佶-event-beixun
  - key: breakthrough
    name: 出居庸历险阻
    labels:
      zh: 途经萧条
    start_date: 1368-09-13
    highlight_event_id: guji-刘佶-event-juyong
  - key: climax
    name: 闻京师失守
    labels:
      zh: 京师陷落
    start_date: 1368-09-19
    highlight_event_id: guji-刘佶-event-shangdu
  - key: closure
    name: 抵上都稍安
    labels:
      zh: 上都驻跸
    start_date: 1368-10-07
    highlight_event_id: guji-刘佶-event-shangdu
  decisions:
  - date: 1368-09-12
    title_zh: 愿从哈剌章后北行
    rationale: 朝廷大计不敢问，知院夜有举动，愿以匹马相随，不独留京师待贼
  - date: 1368-09-15
    title_zh: 宿毡帐察军情
    rationale: 经日不食谒知院留宿，请速召扩廓帖木儿入援，以图恢复
- id: guji-刘佶-endeavor-2
  title_zh: 任御史直书成记
  summary_zh: 上都拜监察御史，奏高丽怀两端不可恃，见狐入行殿风霾昼晦，后从观音奴使扩廓营撮要成书
  phases:
  - key: brewing
    name: 上都论国事无可为
    labels:
      zh: 朋党犹存
    start_date: 1368-10-09
    highlight_event_id: guji-刘佶-event-shangdu
  - key: breakthrough
    name: 拜监察御史
    labels:
      zh: 直臣拜命
    start_date: 1369-02-14
    highlight_event_id: guji-刘佶-event-yushi
  - key: climax
    name: 奏高丽不可恃退保红罗
    labels:
      zh: 论外援论和林
    start_date: 1369-05-20
    highlight_event_id: guji-刘佶-event-yingchang
  - key: closure
    name: 从使扩廓撮要成记
    labels:
      zh: 私记掌故
    start_date: 1370-02-08
    highlight_event_id: guji-刘佶-event-shikuo
  decisions:
  - date: 1369-02-20
    title_zh: 奏高丽心怀两端
    rationale: 纳哈出构兵高丽诉求，高丽贡币如旧而心怀两端，不可恃为外援，虽不报亦直陈
  - date: 1370-02-11
    title_zh: 从观音奴使扩廓营
    rationale: 诏征扩廓入卫访其存没，愿以御史从行亲知西北消息，归撮十七月事备异日掌故
events:
- id: guji-刘佶-event-birth
  type: birth
  date: 1330-01-01
  year_of: 1330
  title_zh: 出生
  description_zh: 生年未详，约元末，长而入枢密为属官
  place_zh: 中原
- id: guji-刘佶-event-beixun
  type: career
  date: 1368-09-12
  year_of: 1368
  title_zh: 夜随北巡出建德门
  description_zh: 至正二十八年闰七月二十八日夜漏三下，帝率三宫太子幸上都，佶匹马遇哈剌章于道中扈从
  place_zh: 大都建德门
- id: guji-刘佶-event-juyong
  type: career
  date: 1368-09-13
  year_of: 1368
  title_zh: 历居庸鸡鸣山
  description_zh: 车驾至居庸关无一兵无供张，次鸡鸣山遇雨峰崩人马皆惊，诏召扩廓帖木儿入援
  place_zh: 居庸关鸡鸣山
- id: guji-刘佶-event-shangdu
  type: career
  date: 1368-10-07
  year_of: 1368
  title_zh: 至上都见丘墟
  description_zh: 八月十五日车驾至上都，宫殿官署皆焚毁，得也速献币粮始有自存之势，佶与秃因不花周恤患难
  place_zh: 上都
- id: guji-刘佶-event-yushi
  type: career
  date: 1369-02-14
  year_of: 1369
  title_zh: 拜监察御史
  description_zh: 二十九年正月初九日拜命，是日狐入行殿至御座下，阿剌不沙极言亡国之兆
  place_zh: 上都行在
- id: guji-刘佶-event-yingchang
  type: career
  date: 1369-07-25
  year_of: 1369
  title_zh: 扈从至应昌
  description_zh: 六月十三日车驾幸应昌府，留普化鼎住守上都，十五日晃火帖木儿战死新开岭，十七日贼陷上都
  place_zh: 应昌府
- id: guji-刘佶-event-shikuo
  type: career
  date: 1370-02-08
  year_of: 1370
  title_zh: 从观音奴使扩廓营
  description_zh: 三十年正月初九日诏观音奴赍手诏征扩廓入卫，佶以监察御史从行，十一日启行，撮十七月事成北巡私记
  place_zh: 应昌至扩廓营
- id: guji-刘佶-event-death
  type: death
  date: 1390-01-01
  year_of: 1390
  title_zh: 卒
  description_zh: 明初卒，卒年未详，以北巡私记十七月直笔传世
  place_zh: 未详
