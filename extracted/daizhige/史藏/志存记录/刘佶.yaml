  birth_date: 1330-01-01
  death_date: 1390-01-01
  era: 元末明初
  reign_ref: 元惠宗至正
  archetype: 患难扈从的记事孤臣
  dilemmas:
  - 去就之择：都城难保，随哈剌章北巡还是留守故都
  - 微臣之限：密勿军旅非小臣所得知，直笔撮要以备掌故
  - 恢复之望：寄望扩廓帖木儿与西北诸藩，朝议迟疑朋党犹存
  lesson: 国之将亡不在一战，而在君臣离心措置失宜，小臣惟以直记存十七月行在之实
  summary_first_person: 我待罪枢密属官，至正二十八年闰七月随哈剌章扈从北巡，自大都历居庸鸡鸣中都至上都应昌，目睹红巾焚掠宫阙丘墟，后拜监察御史论高丽不可恃，复从观音奴使扩廓营，所知撮要为北巡私记
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%8C%97%E5%B7%A1%E7%A7%81%E8%AE%B0.html
