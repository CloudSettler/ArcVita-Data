person:
  qid: guji-刘氏
  name_zh: 刘氏
  names:
    zh: 刘氏
    en: Lady Liu
  lifespan:
    birth:
      date: '1614'
      precision: year
      is_circa: true
      raw: 任阳儒家女十四适人入府时三十五推算约生于明末
    death:
      date: '1650'
      precision: year
      is_circa: true
      raw: 册为豫王妃生一子后事迹不载约卒于顺治初
  birth_date: '1614'
  death_date: '1650'
  era: 明末清初
  reign_ref: 顺治
  archetype: 贞烈智妇
  dilemmas:
  - 为守节即死与为见女苟活之两难
  - 为婢妾苟合与以正妃名分自重要求之坚持
  lesson: 古来尽节贵在割爱，心有所系则志易移，然能自重者可转辱为荣，当以正名自守
  summary_first_person: 吾小字三季，任阳儒家之女，早孤倚嫂，误适邑富黄亮功为继室，生女珍而夫亡，拒恶侄夺产，迁居直塘，兵乱被掳至南京，选入豫王府，初以死拒辱，念女不忍遽死，终要以正妃之名方从，册为妃而生一子，此生荣辱皆系割爱与自重之间
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%A4%9A%E9%93%8E%E5%A6%83%E5%88%98%E6%B0%8F%E5%A4%96%E4%BC%A0.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%A4%9A%E9%93%8E%E5%A6%83%E5%88%98%E6%B0%8F%E5%A4%96%E4%BC%A0.html
endeavors:
- id: guji-刘氏-endeavor-1
  title_zh: 黄门继室守业抚女
  summary_zh: 幼聪早孤，误适黄门，生女守寡，拒分产，迁财直塘以保家业
  phases:
  - key: brewing
    name: 儒门毓秀择婿未谐
    labels:
      zh: 幼聪守正待字
    start_date: '1614'
    highlight_event_id: guji-刘氏-event-birth
  - key: breakthrough
    name: 仲兄贪利误适黄门
    labels:
      zh: 误嫁继室生女
    start_date: '1628'
    highlight_event_id: guji-刘氏-event-marry
  - key: climax
    name: 夫亡拒侄夺产迁财
    labels:
      zh: 逐悍侄迁直塘
    start_date: '1644'
    highlight_event_id: guji-刘氏-event-marry
  - key: closure
    name: 直塘分守待变守成
    labels:
      zh: 母女分司收发
    start_date: '1645'
    highlight_event_id: guji-刘氏-event-capture
  decisions:
  - date: '1644'
    title_zh: 逐七出门不分遗产
    rationale: 七好勇斗狠不肖，若分产必荡尽家业，故摔之门外以保女
  - date: '1645'
    title_zh: 迁财谷徙居直塘
    rationale: 防盗劫报复，母女分司收发以求保全
- id: guji-刘氏-endeavor-2
  title_zh: 兵乱被掳册为豫妃
  summary_zh: 松江被掳送南京，选入豫王府，以死拒辱，因女致志移，要以正妃名分方从
  phases:
  - key: brewing
    name: 松江沦陷被掳北送
    labels:
      zh: 被掳大宅送南京
    start_date: '1645'
    highlight_event_id: guji-刘氏-event-capture
  - key: breakthrough
    name: 南京选入豫王府
    labels:
      zh: 四妇侍酒独异
    start_date: '1646'
    highlight_event_id: guji-刘氏-event-capture
  - key: climax
    name: 以死拒辱以书系女
    labels:
      zh: 撞柱绝食通书
    start_date: '1647'
    highlight_event_id: guji-刘氏-event-consort
  - key: closure
    name: 受冠服成婚册妃生子
    labels:
      zh: 要正名册妃
    start_date: '1648'
    highlight_event_id: guji-刘氏-event-consort
  decisions:
  - date: '1647'
    title_zh: 饮糜通书问女生死
    rationale: 未亡而不死者欲得与珍相见，知女无恙方能稍进饮食
  - date: '1648'
    title_zh: 非正妃不侍寝
    rationale: 婢妾不如死，未亡人更不可苟且，必得一品命服婚礼方从
events:
- id: guji-刘氏-event-birth
  title_zh: 生于任阳儒家
  date: '1614'
  year_of: 1614
  place_zh: 常熟任阳
  summary_zh: 生而聪颖，六岁母死，父教之书，十岁父死，倚嫂居，称为国色
- id: guji-刘氏-event-marry
  title_zh: 适黄亮功为继室生女
  date: '1628'
  year_of: 1628
  place_zh: 常熟
  summary_zh: 十四犹未字，仲兄贪利乘讹嫁于富贾黄亮功，逾年生女珍，招赘钱氏以托终
- id: guji-刘氏-event-capture
  title_zh: 松江被掳送至南京
  date: '1645'
  year_of: 1645
  place_zh: 松江至南京
  summary_zh: 李成栋旗兵以七为导掳往松江大宅，复送南京归旗发遣，选入豫王府
- id: guji-刘氏-event-consort
  title_zh: 要以正名册为豫王妃
  date: '1648'
  year_of: 1648
  place_zh: 南京豫王府
  summary_zh: 撞柱拒辱绝食，作书问女，妃薨后受金凤冠一品命服行婚礼，越岁生一子册为妃
- id: guji-刘氏-event-death
  title_zh: 册妃生子后卒
  date: '1650'
  year_of: 1650
  place_zh: 南京
  summary_zh: 册妃生子，婿得奥援任部曹，其后事迹不载，约卒于顺治初
