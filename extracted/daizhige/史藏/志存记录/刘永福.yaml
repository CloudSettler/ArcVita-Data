  dilemmas:
  - 越廷猜忌饷械两缺之下是否坚守山西保胜以蔽滇粤
  - 与桂军将帅有隙而北宁危急之时是否释怨赴援以顾大局
  lesson: 孤勇能挫强敌而无后援则难持久，必联络滇桂坚守边圉方能固藩篱御外侮
  summary_first_person: 我本上思布衣，咸丰乱时率三百人出镇南关，逐何均昌而据保胜，树黑旗以聚众，越招我归诚，同治末越宣绕驰河内一战斩安邺，光绪初法复图东京，我与法战于纸桥斩李威利，复守山西兴化，虽为越臣所忌桂军所挤而退守不馁，志在保种固边而已
  source_urls:
