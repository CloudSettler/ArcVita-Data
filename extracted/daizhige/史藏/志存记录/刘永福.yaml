  - key: closure
    name: 退守兴化保胜候旨进止
    labels:
      zh: 退保待援
    start_date: 1883-12-16
    highlight_event_id: guji-刘永福-event-shanxi
  decisions:
  - date: 1883-05-19
    title_zh: 提全师击河内纸桥决战
    rationale: 法兵单寡而气骄，惟速战可挫其锋，越王思用，天朝亦可助饷
  - date: 1883-10-01
    title_zh: 不退保胜而守山西兴化
    rationale: 山西失则三江口无蔽，滇自河底江以下步步设防，退则越亡而边危
events:
- id: guji-刘永福-event-birth
  title_zh: 生于广西上思州
  date: 1837-10-10
  year_of: 1837
  summary: 咸丰前生于上思，少勇健，粤西乱起率众出关
- id: guji-刘永福-event-baosheng
  title_zh: 逐何均昌据保胜树黑旗
  date: 1867-06-01
  year_of: 1867
  summary: 率三百人出镇南关，逐据保胜之何均昌，所部皆黑旗，号黑旗军，自备饷械剿匪
- id: guji-刘永福-event-an ye
  title_zh: 河内一战斩安邺
  date: 1873-12-21
  year_of: 1873
  summary: 应越招归诚，率部越宣黄光大岭绕驰河内，一战斩法将安邺，越授三宣副提督
- id: guji-刘永福-event-zhiqiao
  title_zh: 纸桥大破法军阵斩李威利
  date: 1883-05-19
  year_of: 1883
  summary: 与法人战于河内纸桥，大破法军，阵斩法将李威利，越王封一等男，徐延旭奏陈战绩
- id: guji-刘永福-event-zhishan
  title_zh: 谒岑毓英编军十二营赴援北宁
  date: 1884-02-10
  year_of: 1884
  summary: 谒岑毓英于家喻关，极蒙优礼，编所部为十二营，率唐景崧所领全军赴援北宁
- id: guji-刘永福-event-shanxi
  title_zh: 山西失守退守兴化保胜
  date: 1883-12-16
  year_of: 1883
  summary: 法军进攻山西，滇军与黑旗凭城固守杀伤相当，卒致退舍，永福退守兴化城，后退驻保胜
- id: guji-刘永福-event-death
  title_zh: 卒于钦州
  date: 1917-01-09
  year_of: 1917
  summary: 中法战后内附安置，晚年建功台湾抗倭，民国初卒于钦州，黑旗之名传中外
