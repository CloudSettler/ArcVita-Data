  - date: 1867-01-01
    title_zh: 逐何均昌据保胜自筹饷械
    rationale: 粤西乱后无所依，保胜扼滇越孔道，可屯可战以自存并图进取
  - date: 1873-12-01
    title_zh: 应越招越宣黄光大岭绕击河内
    rationale: 黄崇英勾法谋占全越，越廷来谕，击其首可解河内围并立足越北
- id: guji-刘永福-endeavor-2
  title_zh: 纸桥大捷与山西兴化坚守
  summary: 法破东京后扼山西保胜，请战御敌，纸桥阵斩李威利，复与滇桂军共守山西北宁兴化
  phases:
  - key: brewing
