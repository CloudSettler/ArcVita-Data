  archetype: 经学文论兼治之儒师
  dilemmas:
  - 制义少作不足存而书待我存之，去留之间如何不没其实
  - 媚世从政与忠信笃敬守道之间如何自立而不苟
  lesson: 存其不足存以见诚，守忠信笃敬以立行，不以媚言事人
  summary_first_person: 吾昔所为制义自以为不足存，多随手弃去，然书既待吾存之而吾必弃之则负于书，故存其所以不足存而名曰书存，以不没其实焉
