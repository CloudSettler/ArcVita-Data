endeavors:
- id: guji-刘熙载-endeavor-1
  title_zh: 制义文论著述
  goal_zh: 以经义论文，存少作以见诚，明忠信笃敬与王道圣学之辨
  phases:
  - key: brewing
    name: 少作习制义
    labels:
      zh: 少作 accumulation
    start_date: '1828'
    highlight_event_id: guji-刘熙载-event-birth
  - key: breakthrough
    name: 进士后究经论文
    labels:
      zh: 入仕研经
    start_date: '1844'
    highlight_event_id: guji-刘熙载-event-jinshi
  - key: climax
    name: 艺概书存体系成
    labels:
      zh: 著述高峰
    start_date: '1868'
    highlight_event_id: guji-刘熙载-event-book
  - key: closure
    name: 自序书存不没实
    labels:
      zh: 自序收束
    start_date: '1875'
    highlight_event_id: guji-刘熙载-event-book
  decisions:
  - date: '1844'
    title_zh: 不弃少作而存其实
    rationale: 少作虽不足存，弃则没书之待我之诚，故存而不掩，以见学者进境
  - date: '1870'
    title_zh: 以论语孟子发忠信王道之旨
    rationale: 辨媚与正，辨功与心，辨斗筲与士，以明圣学不以外饰为重
- id: guji-刘熙载-endeavor-2
  title_zh: 仕宦讲学化人
  goal_zh: 由翰林司业至书院山长，以忠信笃敬教士，不为斗筲从政之风所移
  phases:
  - key: brewing
    name: 翰林养望
    labels:
      zh: 馆阁历练
    start_date: '1844'
    highlight_event_id: guji-刘熙载-event-jinshi
  - key: breakthrough
    name: 国子监司业谕德
    labels:
      zh: 学官任事
    start_date: '1849'
    highlight_event_id: guji-刘熙载-event-official
  - key: climax
    name: 主讲龙门学海
    labels:
      zh: 书院讲学
    start_date: '1865'
    highlight_event_id: guji-刘熙载-event-teach
  - key: closure
    name: 晚年著述授徒终老
    labels:
      zh: 晚年守道
    start_date: '1878'
    highlight_event_id: guji-刘熙载-event-death
  decisions:
  - date: '1865'
    title_zh: 南下主讲不恋京秩
    rationale: 与其为斗筲从政之列，不如以讲学养士，明士之不可苟论
  - date: '1875'
    title_zh: 以立舆参倚之功教人
    rationale: 忠信笃敬须臾不离，使学者于常境中存诚，不待奇难而后勉
events:
- id: guji-刘熙载-event-birth
  title_zh: 生于江苏兴化
  date: '1813'
  year_of: 1813
  place_zh: 江苏兴化
  description_zh: 嘉庆十八年生于江苏兴化，字伯简，号融斋，少习经史制义
- id: guji-刘熙载-event-jinshi
  title_zh: 道光甲辰进士入翰林
  date: '1844'
  year_of: 1844
  place_zh: 北京
  description_zh: 道光二十四年中进士，选庶吉士，授翰林院编修，究心经义古文
- id: guji-刘熙载-event-official
  title_zh: 任国子监司业左谕德
  date: '1849'
  year_of: 1849
  place_zh: 北京
  description_zh: 历任国子监司业，左春坊左谕德，以笃实文学为士林所重
- id: guji-刘熙载-event-teach
  title_zh: 主讲上海龙门广州学海书院
  date: '1865'
  year_of: 1865
  place_zh: 上海
  description_zh: 南下主讲上海龙门书院及广州学海堂，讲经论文，成就后学甚众
- id: guji-刘熙载-event-book
  title_zh: 成制义书存艺概诸书
  date: '1873'
  year_of: 1873
  place_zh: 上海
  description_zh: 会萃平生论艺之文成艺概游艺约言，检少作五义及论语孟子制义成制义书存并自序
- id: guji-刘熙载-event-death
  title_zh: 卒于上海
  date: '1881'
  year_of: 1881
  place_zh: 上海
  description_zh: 光绪七年卒于上海，年六十九，遗著有古桐书屋六种行世
