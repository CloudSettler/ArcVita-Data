  - key: climax
    name_zh: 矫旨枷号索贿
    labels:
      zh: 贿赂公行
    start_date: 1508
    highlight_event_id: guji-刘瑾-event-6
  - key: closure
    name_zh: 禁用天字,兆乱被诛
    labels:
      zh: 逆诛
    start_date: 1509
    highlight_event_id: guji-刘瑾-event-7
  decisions:
  - date: 1508
    title_zh: 令诸司朝觐馈银二万两方放回
    rationale: 假借威权广敛地方财货,供需瑾等分用
  - date: 1509
    title_zh: 禁臣民名用天等字
    rationale: 擅专制礼,更改名讳以立威,识者以为异兆
events:
- id: guji-刘瑾-event-birth
  date: 约 1451
  year_of: -1451
  type: birth
  name_zh: 生年不详
  description_zh: 正史未载其生年,约生于明中期
- id: guji-刘瑾-event-1
  date: 约 1490
  year_of: 1490
  type: career
  name_zh: 为东宫旧侍御
  description_zh: 与马永成、谷大用、魏彬、丘聚、罗祥、张豫等七人同为东宫旧侍御,时称七党,瑾尤奸险掌文事
- id: guji-刘瑾-event-2
  date: 1505
  year_of: 1505
  type: career
  name_zh: 武宗即位,瑾渐干大政
  description_zh: 弘治十八年武宗即位改元正德,左右嬖幸内臣日导游戏,瑾以粗知文事遂干大政
- id: guji-刘瑾-event-3
  date: 1506
  year_of: 1506
  type: career
  name_zh: 帮助掌司礼监,提督团营
  description_zh: 正德元年夜捕王岳等内应,次日入司礼监兼提督团营,设内行官校巡察,权倾中外
- id: guji-刘瑾-event-4
  date: 1507
  year_of: 1507
  type: career
  name_zh: 排韩文、刘、谢致仕
  description_zh: 罢户部尚书韩文为民,大学士刘健、谢迁致仕,李东阳独留,瑾矫令留百官跪听宣 reading 指摘勒致仕
- id: guji-刘瑾-event-5
  date: 1508
  year_of: 1508
  type: career
  name_zh: 矫旨调杨廷和、刘忠于南京
  description_zh: 经筵讲毕怨其讽谏,奏遣二人南京添注侍郎,名义上升实远之
- id: guji-刘瑾-event-6
  date: 1508
  year_of: 1508
  type: career
  name_zh: 枷号安奎、张彧,科道行跪礼
  description_zh: 查盘钱粮索贿不足,以一百五十斤枷号于东西公生门,自是科道部属皆赴瑾宅行跪礼
- id: guji-刘瑾-event-7
  date: 1510
  year_of: 1510
  type: death
  name_zh: 以逆罪伏诛
  description_zh: 正德五年瑾以逆诛,禁用天字之令遂废,人皆复其旧名
