  - date: 1506
    title_zh: 反拒内阁调派,自揽批红
    rationale: 内阁票拟渐被瑾任意批答抑或增减,权归内廷
  - date: 1508
    title_zh: 调张永南京,欲除轧己者
    rationale: 尽除掣肘之人,张永直趋御前诉冤反得留任,怨毒日深
- id: guji-刘瑾-endeavor-2
  name_zh: 打排异己与敛财厉政
  phases:
  - key: brewing
    name_zh: 排扼文臣
    labels:
      zh: 素嫉文臣
