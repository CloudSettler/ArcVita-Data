  summary_first_person: 我是刘瑾，东宫旧侍出身，武宗即位后与马永成等并称七党，渐揽朝政，掌司礼监、提督团营，矫旨擅权，斥逐贤臣。然威权日盛，同列侧目，终以谋逆伏诛。
  source_urls:
  - 《继世纪闻》卷一、卷二
