person:
  qid: guji-liu_ming_chuan
  name_zh: 刘铭传
  names:
    zh: 刘铭传
    en: Liu Ming-chuan
  lifespan:
    birth:
      date: '1836-09-07'
      precision: day
      is_circa: false
      raw: 道光十六年
    death:
      date: '1896-01-12'
      precision: day
      is_circa: false
      raw: 光绪二十一年底
  birth_date: '1836-09-07'
  death_date: '1896-01-12'
  era: 清季
  reign_ref: 光绪
  archetype: 洋务新政疆臣
  dilemmas:
  - 新政需巨款与洋商利权独揽之争，如何在不失利权下兴办铁路商务
  - 西人驾驶兵船则战时去职、华人未谙其术，用船之人难求
  lesson: 自强之道不在有船有器，而在平时储才教育、用人裕如；兴利之举须先建设以为诸效之基。
  summary_first_person: 我以淮军宿将出身，中法之战在台湾力守有功；光绪十一年台湾建省，奉旨为首任巡抚，驻节台北。我分营设防、创铁路、架水陆电线以达福州、设商务局办轮船运务、清赋丈田以裕饷源，欲使海岛孤悬之地富庶甲于东南。
endeavors:
- id: guji-liu_ming_chuan-endeavor-1
  key: 抚台建设
  name_zh: 抚台新政建设
  labels:
    zh:
    - 台湾建省
    - 洋务新政
  phases:
  - key: breakthrough
    name_zh: 建省建防
    labels:
      zh: 光绪十一年建省设防
    start_date: '1885'
    highlight_event_id: guji-liu_ming_chuan-event-appointment
  - key: climax
    name_zh: 兴路架线
    labels:
      zh: 创办铁路与电线
    start_date: '1887-04-30'
    highlight_event_id: guji-liu_ming_chuan-event-railway
  decisions:
  - date: '1887'
    title_zh: 创建台湾铁路，先自台北至基隆试办
    rationale: 山路险艰转运难，防营势难联络；铁路既成则矿产转输易、防务首尾兼顾、百货流通三利皆得。
  - date: '1887-04-30'
    title_zh: 与英德商人定约，水陆电线一年内完工
    rationale: 台湾孤悬海外，传音迟滞；电达福州省城可捷于影响。
  - date: '1887'
    title_zh: 复设商务局，交张叔和经办，拟雇船行台厦香汕四埠
    rationale: 得忌利士公司独揽航权利权，欲以官轮分利，使往来商旅不受挟制。
- id: guji-liu_ming_chuan-endeavor-2
  key: 清赋启台
  name_zh: 清赋田园启台
  labels:
    zh: 清赋丈田
  phases:
  - key: brewing
    name_zh: 剿抚番社
    labels:
      zh: 抚番开山
    start_date: '1874'
    highlight_event_id: guji-liu_ming_chuan-event-tang_dingkui_peers
  - key: breakthrough
    name_zh: 清赋丈田
    labels:
      zh: 清赋
    start_date: '1887-05-01'
    highlight_event_id: guji-liu_ming_chuan-event-taxes
  decisions:
  - date: '1887'
    title_zh: 劾督办清赋，待邵友濂到任即升科完粮
    rationale: 田亩无头绪则饷源不立，新政诸费须自筹于台地。
events:
- id: guji-liu_ming_chuan-event-birth
  date: '1836-09-07'
  year_of: 1836
  type: birth
  title_zh: 刘铭传感生
  description_zh: 生于安徽合肥（据通行纪年补）。
- id: guji-liu_ming_chuan-event-tang_dingkui_peers
  date: '1874'
  year_of: 1874
  type: endeavor
  title_zh: 遣唐定奎赴台湾设防抚番
  description_zh: 前部将唐定奎随其转战陕甘后调台湾设防，留办抚番开山事宜，剿平番社；此佐证其早期经营台湾之渊源。
  related_entities:
  - 唐定奎
- id: guji-liu_ming_chuan-event-appointment
  date: '1885'
  year_of: 1885
  type: endeavor
  title_zh: 台湾建省，奉命为首任巡抚
  description_zh: 光绪十一年设立台省，命刘爵帅抚之，驻节台北，分兵四营扼要防御。
  related_entities:
  - 台湾省
- id: guji-liu_ming_chuan-event-railway
  date: '1887-04-30'
  year_of: 1887
  type: endeavor
  title_zh: 动工创台铁路电线
  description_zh: 于四月初八日报载水陆电线刻日活动工，闻与包办之英德商人定约于本年四月内一律完工；淡水电线径达福州省城。又传蒯佩芬、席步天至辕面授机宜，先自台北至基隆试办铁路。
  related_entities:
  - 蒯佩芬
  - 席步天
- id: guji-liu_ming_chuan-event-taxes
  date: '1887-05-01'
  year_of: 1887
  type: endeavor
  title_zh: 清赋丈田及垦务推进
  description_zh: 林诗甫副钦宪开垦噶玛兰内山田地已七百余甲，三月十七起程丈量；各处清赋田亩稍有头绪，待邵友濂到任后即当升科完粮。
  related_entities:
  - 邵友濂
- id: guji-liu_ming_chuan-event-business_report
  date: '1887-05-03'
  year_of: 1887
  type: endeavor
  title_zh: 奏台湾创办商务折遭申饬
  description_zh: 四月初十奉上谕：刘铭传奏「台湾创办商务」折内抬写处「天恩」误书「天准」，殊属疏忽，著交部察议。
- id: guji-liu_ming_chuan-event-death
  date: '1896-01-12'
  year_of: 1896
  type: death
  title_zh: 刘铭传卒
  description_zh: 卒于光绪二十一年末（通说）。
