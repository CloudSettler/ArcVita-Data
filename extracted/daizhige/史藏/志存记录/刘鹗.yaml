  birth_date: 1857-10-18
  death_date: 1909-08-23
  era: 清末
  reign_ref: 光绪
  archetype: 金石收藏家、实业家与著述者
  dilemmas:
  - 购藏甲骨古器耗费巨资，与还债、汇款、家用调度互相挤兑
  - 撰实业条陈、电汇款项以谋事，而朝中梗阻、外人掣肘，事多难成
  lesson: 乱世之中以收藏护文献、以条陈谋实业，虽资绌事阻而日日记之、持之不辍
  summary_first_person: 我是刘鹗，光绪壬寅年居京师，日与潍县古董商往来，购龟版、汉印、秦权、序布，夜则点检甲骨至千数百片；又与内藤、曾根诸人论学谈洋务，撰《兴农工》《颁商律》《设商官》诸则，兼汇款金陵助亲友成事。
  source_urls:
  - https://zh.wikisource.org/wiki/抱残守缺斋日记
