events:
- id: guji-刘鹗-event-birth
  date: 1857-10-18
  date_precision: day
  year_of: 1857
  title_zh: 刘鹗生
  description: 刘鹗生于江苏丹徒，后为清末金石收藏家、小说家与实业家。
- id: guji-刘鹗-event-guiban-rugang
  date: 1902-11-19
  date_precision: day
  year_of: 1902
  title_zh: 潍县赵执斋携龟版汉印来访
  description: 是日巳刻赵执斋携龟版、汉印各一匣至，印计七百余方，又有太和大造象一区、秦权一枚，龟版颇有大者。
  endeavor_id: guji-刘鹗-endeavor-1
- id: guji-刘鹗-event-dianjian-1300
  date: 1902-11-19
  date_precision: day
  year_of: 1902
  title_zh: 夜点龟骨得千三百件
  description: 晚间点检龟骨共千三百件，自谓可谓富矣。
  endeavor_id: guji-刘鹗-endeavor-1
- id: guji-刘鹗-event-guqi-rugang
  date: 1902-11-22
  date_precision: day
  year_of: 1902
  title_zh: 百金购戈头弩机商觯诸器
  description: 潍县张某来，售戈头三枚、弩机一架、建字镜一面、商觯一具，共百金，皆入藏。
  endeavor_id: guji-刘鹗-endeavor-2
- id: guji-刘鹗-event-xubu
  date: 1902-11-23
  date_precision: day
  year_of: 1902
  title_zh: 得序布四百而十布成全
  description: 古钱刘送序布四百来，十布于是成全，自记可喜之至。
  endeavor_id: guji-刘鹗-endeavor-2
- id: guji-刘鹗-event-xingnong
  date: 1902-11-28
  date_precision: day
  year_of: 1902
  title_zh: 撰兴农工一则
  description: 是日接叔韫、啬庵、玉春三函，倦极之前撰《兴农工》一则。
  endeavor_id: guji-刘鹗-endeavor-3
- id: guji-刘鹗-event-shanglv
  date: 1902-11-30
  date_precision: day
  year_of: 1902
  title_zh: 撰颁商律设商官二则
  description: 晚撰《颁商律》、《设商官》二则，续其实业条陈之业。
  endeavor_id: guji-刘鹗-endeavor-3
- id: guji-刘鹗-event-dianjian-1890
  date: 1902-12-04
  date_precision: day
  year_of: 1902
  title_zh: 查点龟板牛骨共一千八百九十片
  description: 是日大雪，查龟板、牛骨统共一千八百九十片，所藏甲骨之富至此。
  endeavor_id: guji-刘鹗-endeavor-1
- id: guji-刘鹗-event-death
  date: 1909-08-23
  date_precision: day
  year_of: 1909
  title_zh: 刘鹗卒
  description: 刘鹗以私售仓粟罪遣戍新疆，是年病卒于戍所。
