  decisions:
  - date: 1616
    title_zh: 建元天命，定国号满洲，议先挫明兵后取叶赫
    rationale: 海西四国已平其三，独叶赫恃明援不下，非先挫明兵不能取叶赫。
  - date: 1618
    title_zh: 以七大恨誓师伐明
    rationale: 明护叶赫、纵边民越境、胁取十人抵罪，嫌隙愈深，遂决意兴师。
  - date: 1619-03
    title_zh: 判明南北二路道远，先破其中路杜松军
    rationale: 山险道远敌不能即至，并力攻其一路可破全军。
  - date: 1621
    title_zh: 定议迁都辽阳
    rationale: 辽阳为明与朝鲜、蒙古接壤要区，宜即居之。
- id: guji-努尔哈赤-endeavor-2
  name_zh: 辽西攻略与宁远受挫
  phases:
  - key: brewing
    name_zh: 渡河围西平，取广宁
