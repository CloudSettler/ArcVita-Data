  birth_date: 1559
  death_date: 1626-08
  era: 后金（清太祖）
  reign_ref: 天命（1616–1626）
  archetype: 开国君主
  dilemmas:
  - 对明臣服与独立建国之间的抉择
  - 叶赫恃明援不下，先伐明还是先取叶赫
  - 宁远之战强攻受挫，战无不胜神话的破灭
  lesson: 以七大恨誓师，并力破敌一路，集中兵力可败全军之众；然骄兵必挫，宁远一城不下。
  summary_first_person: 我以十三遗甲起于建州，平海西诸部，建天命国号满洲，以七大恨誓师伐明，萨尔浒五日破其四路大军，下沈阳辽阳，迁都盛京；然宁远一役为袁崇焕所却，赍志而崩。
  source_urls:
  - https://github.com/ArcVita/docs/YAML_STANDARD.md
