      - 迁都沈阳
    start_date: 1625-03
    highlight_event_id: guji-努尔哈赤-event-shengjing
  - key: climax
    name_zh: 大举渡辽攻宁远
    labels:
      zh:
      - 宁远之役
    start_date: 1626
    highlight_event_id: guji-努尔哈赤-event-ningyuan
  decisions:
  - date: 1625-03
    title_zh: 自辽阳迁都沈阳（盛京）
    rationale: 沈阳形胜地，西征明边路直且近，北伐蒙古、南征朝鲜皆便。
  - date: 1626
    title_zh: 乘高第撤守、形势既变，大举渡辽攻宁远
    rationale: 明尽撤关外守具，宁远孤悬可取。
events:
- id: guji-努尔哈赤-event-birth
  date: 1559
  year_of: 1559
  title_zh: 努尔哈赤生（约）
  description: 清太祖爱新觉罗氏生年。
- id: guji-努尔哈赤-event-jiyuan
  date: 1616
  year_of: 1616
  title_zh: 建元天命，定国号满洲
  description: 万历四十四年，太祖始建天命，定国号曰满洲；时海西四国已平其三，独叶赫恃明援不下。
- id: guji-努尔哈赤-event-fushun
  date: 1618
  year_of: 1618
  title_zh: 以七大恨誓师，降抚顺、陷清河
  description: 天命三年，发步骑二万分两路进，自率右翼四旗乘夜雨新霁驰抵抚顺，降游击李永芳；回军顺风纵击，张承荫以下皆战死；是秋围清河城，邹储贤及兵万人歼焉。
- id: guji-努尔哈赤-event-saerhu
  date: 1619-03
  year_of: 1619
  title_zh: 萨尔浒之战大破明四路军
  description: 亲率六旗兵攻萨尔浒大营，从暗击明，杜松中矢阵殁；乘胜破尚间崖马林军，用降卒持杜松令箭诱刘綎深入，力战歼之；五日之间败明全军，号称四十余万之众尽覆。
- id: guji-努尔哈赤-event-shenyang
  date: 1621-03
  year_of: 1621
  title_zh: 攻下沈阳，长驱取辽阳
  description: 天命六年三月，遣侦骑阳败诱贺世贤，伏兵破沈阳；渡浑河歼川浙诸营，遂渡濠登辽阳城，应泰自缢，辽河以东七十余城俱下。
- id: guji-努尔哈赤-event-guangning
  date: 1622-01
  year_of: 1622
  title_zh: 渡辽围西平，取广宁
  description: 天命七年正月，督兵渡河围西平堡，罗一贯战没；孙得功以内应迎降，整军入广宁，进克义州，降者四十余城，尽迁辽西降人于河东。
- id: guji-努尔哈赤-event-shengjing
  date: 1625-03
  year_of: 1625
  title_zh: 迁都沈阳，是为盛京
  description: 知沈阳形势尤要，就建新都，天命十年三月自辽阳迁焉。
- id: guji-努尔哈赤-event-ningyuan
  date: 1626-01
  year_of: 1626
  title_zh: 宁远之役为袁崇焕所却
  description: 天命十一年大举渡辽抵宁远，袁崇焕发西洋巨炮轰击，围遂解；二十五岁用兵以来战无不克，独宁远一城卒不能下，又不怿者累日，袭焚觉华岛舟粮而还。
- id: guji-努尔哈赤-event-death
  date: 1626-08
  year_of: 1626
  title_zh: 太祖高皇帝崩
  description: 天命十一年八月崩，太宗文皇帝嗣位，以明年为天聪元年。
