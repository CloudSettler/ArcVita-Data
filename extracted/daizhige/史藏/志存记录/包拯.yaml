person:
  qid: guji-包拯
  name_zh: 包拯
  names:
    zh: 包拯
    en: Bao Zheng
  lifespan:
    birth:
      date: 999
      precision: year
      is_circa: true
      raw: 咸平二年（据卒年与仕历推定）
    death:
      date: 1062-07-03
      precision: day
      is_circa: true
      raw: 嘉祐七年五月辛未（1062年）
  birth_date: 999
  death_date: 1062-07-03
  era: 北宋
  reign_ref: 宋仁宗朝（天圣—嘉祐）
  archetype: 清官直臣
  dilemmas:
  - 忠孝两难：进士及第后父母高年不愿远行，辞官居家终养十年方出仕
  - 法理与亲情的冲突：从舅犯法依律挞之，不徇亲旧之私
  - 直言与仕途安危的抉择：屡弹权贵（郭承佑、张尧佐），不计进退荣辱
  lesson: 「公而忘私，不徼阴幸」——守法持正、敢任事责，威严而无苛猛，故民爱之而奸邪慑服
  summary_first_person: 我包拯字希仁，庐州合肥人。天圣五年进士甲科，因父母年高辞官终养十年。出仕后从州县累迁至二府，断牛舌案、知端州不持一砚归、权知开封府罢门牌司之弊、使契丹折虏议、以御史中丞请立皇嗣、为三司使宽民除弊。性峭直，不徇私请，人以「包公」呼之而不以官称。嘉祐七年五月，方视事疾作，卒于枢密副使任上，谥孝肃。
  source_urls:
  - https://zh.wikipedia.org/wiki/包拯
