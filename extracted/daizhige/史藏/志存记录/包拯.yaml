  - date: 1059
    title_zh: 权三司使置官场和市、急吏宽民
    rationale: 军需官物旧科于郡县贾增数倍，为官场和市则民无科调之扰、物无虚直之耗；除数十年逋负凡一千二百万
events:
- id: guji-包拯-event-birth
  year_of: 999
  date: 999
  event_type: birth
  name_zh: 包拯生于庐州合肥
  description: 公讳拯，字希仁，庐州合肥人；幼挺然若成人，不为戏狎
  location: 庐州合肥
- id: guji-包拯-event-jinshi
  year_of: 1027
  date: 1027
  event_type: endeavor
  name_zh: 天圣五年进士甲科及第
  description: 初命大理评事、知建昌县；以父母高年不欲远去，辞为邑，得监和州税，遂解官终养
  endeavor_id: guji-包拯-endeavor-1
- id: guji-包拯-event-niushe
  year_of: 1037
  date: 1037
  event_type: endeavor
  name_zh: 知天长县断牛舌案
  description: 盗割人牛舌，公令「第归，杀而鬻之」；告私杀牛者至，反诘「何为盗割牛舌」，盗即款伏
  endeavor_id: guji-包拯-endeavor-1
- id: guji-包拯-event-duanzhou
  year_of: 1040
  date: 1040
  is_circa: true
  event_type: endeavor
  name_zh: 知端州，不持一砚归
  description: 州岁贡砚，前守率数十倍取以遗权贵；公命制者才足贡数，岁满不持一砚归
  endeavor_id: guji-包拯-endeavor-1
- id: guji-包拯-event-yushi
  year_of: 1043
  date: 1043
  is_circa: true
  event_type: endeavor
  name_zh: 拜监察御史里行，旋改监察御史
  description: 御史中丞王拱辰援唐制乞增置；建言取士用人不得实、岁赂戎狄非御戎之策、当取天下公议任宰相，凡十数事
  endeavor_id: guji-包拯-endeavor-2
- id: guji-包拯-event-qidan
  year_of: 1045
  date: 1045
  is_circa: true
  event_type: endeavor
  name_zh: 选使契丹，居凶驿无惧，折雄州开门之议
  description: 神水馆驿舍传有凶怪人莫敢居，公径入居之；虏令典客言雄州新开后门诱纳亡叛，公答以「本朝岂尝问涿州开门邪」，虏意沮不敢复言
  endeavor_id: guji-包拯-endeavor-3
- id: guji-包拯-event-jianyuan
  year_of: 1046
  date: 1046
  is_circa: true
  event_type: endeavor
  name_zh: 视解州盐法，请复通商旧法
  description: 庆历初范宗杰榷解州盐，破产者不可胜数；诏公往视经画，公请复通商旧法，迄今为便；又奏罢秦陇斜谷造船材木及七州建河竹木各数十万
  endeavor_id: guji-包拯-endeavor-3
- id: guji-包拯-event-mutian
  year_of: 1050
  date: 1050
  is_circa: true
  event_type: endeavor
  name_zh: 奏还广平两监牧地于民
  description: 牧地占邢、洺、赵三州民田万五千顷；公亟奏「夺民膏腴为不牧之地，非仁厚之意」，诏以还民，岁入得粟六十余万
  endeavor_id: guji-包拯-endeavor-3
- id: guji-包拯-event-yaozuo
  year_of: 1050
  date: 1050
  event_type: endeavor
  name_zh: 知谏院，力疏郭承佑、极谏张尧佐
  description: 皇祐二年擢天章阁待制、知谏院；力疏褫郭承佑宣徽使，与同列偕上极谏张尧佐兼领四使，疏复连入，遂罢其宣徽、景灵宫二使；上因定今后妃之家不得任二府职事
  endeavor_id: guji-包拯-endeavor-2
- id: guji-包拯-event-heybei
  year_of: 1052
  date: 1052
  is_circa: true
  event_type: endeavor
  name_zh: 进龙图阁直学士，复为河北都转运使
  description: 前建言河北屯兵移屯内地以省大费，至是复陈其数；又论义勇番休按阅之法，岁费不过屯兵一月
  endeavor_id: guji-包拯-endeavor-3
- id: guji-包拯-event-luzhou
  year_of: 1055
  date: 1055
  is_circa: true
  event_type: endeavor
  name_zh: 知庐州，挞犯法从舅
  description: 以子丐便郡得知扬州旋改庐州；性严毅，有从舅犯法公挞之，自是亲旧莫不畏服；又为刘筠立嗣丐还田宅
  endeavor_id: guji-包拯-endeavor-1
- id: guji-包拯-event-kaifeng
  year_of: 1056
  date: 1056
  is_circa: true
  event_type: endeavor
  name_zh: 权知开封府，罢门牌司旧制
  description: 命罢讼牒门外收状之制，民得自趋至尹前；有讼贵臣逋物货者，即传贵臣至庭与讼者置对，立偿之；验惠民河壖地契伪增步数者掘土得表识即毁彻
  endeavor_id: guji-包拯-endeavor-1
- id: guji-包拯-event-zhongcheng
  year_of: 1058
  date: 1058
  event_type: endeavor
  name_zh: 除右谏议大夫、权御史中丞兼理检使
  description: 法冠白豸角立，所排击曲中理实；请立皇嗣、条责诸路监司；理检例为空名，及公领事，称冤滥沉屈者咸为理正
  endeavor_id: guji-包拯-endeavor-2
- id: guji-包拯-event-sansi
  year_of: 1059
  date: 1059
  event_type: endeavor
  name_zh: 除枢密直学士、权三司使
  description: 急吏宽民，蠲除横敛无名之入；置官场和市，民无科调之扰；释剑南酒户系囚，与期以输，率如期至；承诏除数十年逋负总一千二百万
  endeavor_id: guji-包拯-endeavor-3
- id: guji-包拯-event-shumi
  year_of: 1061
  date: 1061
  event_type: endeavor
  name_zh: 迁给事中充三司使，数日拜枢密副使
  description: 举止以义以整，敷奏明辨，屡引大体；上所倚重，体念备至
  endeavor_id: guji-包拯-endeavor-1
- id: guji-包拯-event-death
  year_of: 1062
  date: 1062-07-03
  is_circa: true
  event_type: death
  name_zh: 卒于枢密副使任上，赠礼部尚书，谥孝肃
  description: 嘉祐七年五月己未方视事疾作，上遣使赐良药，辛未遂以不起闻；车驾幸其第临奠，辍视朝一日；顾见五岁子綖，谕左右曰「包拯公而忘私，不徼阴幸也」
  location: 开封
- id: guji-包拯-event-burial
  year_of: 1063
  date: 1063
  is_circa: true
  event_type: endeavor
  name_zh: 葬于合肥县公城乡公城里
  description: 即以嘉祐癸卯八月癸酉日葬；朝命文效为保信军节度推官护丧；录子綖为太常寺太祝，及官其族子若孙数人
  location: 庐州合肥
