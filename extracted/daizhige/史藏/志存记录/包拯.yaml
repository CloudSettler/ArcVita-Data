    rationale: 讼牒旧令收于门外不得径至廷下，因缘为奸；罢之使民得自趋尹前，无复隔阂
  - date: 1061
    title_zh: 就任枢密副使，正色昌言裁国论
    rationale: 上所倚重，奏议平允，不与人苟合，时望弥洽
