  archetype: 怀宝守真的献玉者
  dilemmas:
  - 献宝而遭刑，是否继续坚守真相
  - 封侯之赏与不仕之志之间的抉择
  lesson: 和氏之璧因守真不挠而彰，信物虽久受屈终得明
  summary_first_person: 我是卞和，楚人。我于荆山得璞玉，先后献于楚王，两遭刖刑而不悔，抱璞哭于荆山之下至于泣血；终因璞被剖而美玉自明，世称和氏之璧。楚成王封我为陵阳侯，我不受而去，作歌以追往怨，唯愿世知宝玉之冤与守真之难。
