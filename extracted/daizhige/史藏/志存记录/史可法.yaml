endeavors:
- id: guji-史可法-endeavor-1
  title_zh: 督师江北节制四镇
  summary_zh: 出镇扬州分汛设防调解黄高之隙经略河南以图恢复
  phases:
  - key: brewing
    name: 受命出镇扬州
    labels:
      zh:
      - 出镇扬州
      - 节制诸将
    start_date: 1644-06-01
    highlight_event_id: guji-史可法-event-jiandu
  - key: breakthrough
    name: 调解黄高稳定江北
    labels:
      zh:
      - 调解将帅
      - 分汛而守
    start_date: 1644-08-01
    highlight_event_id: guji-史可法-event-jiandu
  - key: climax
    name: 经略河南高杰北伐
    labels:
      zh:
      - 经略中原
      - 高杰北上
    start_date: 1644-10-14
    highlight_event_id: guji-史可法-event-gaojiebei
  - key: closure
    name: 高杰遇害中原瓦解
    labels:
      zh:
      - 睢州之变
      - 退保江淮
    start_date: 1645-01-01
    highlight_event_id: guji-史可法-event-gaojiebei
  decisions:
  - date: 1644-06-01
    title_zh: 慨然受命督师江北
    rationale: 马士英推诿而高杰非我莫制愿以顶踵报国不惜劳瘁
  - date: 1644-08-01
    title_zh: 分江北为四镇分汛而守
    rationale: 虞师不武臣不力故以身先之居中调度以防江淮
  - date: 1644-10-14
    title_zh: 遣高杰率部经略河南
    rationale: 乘高营兵强可御敌决意进取河南以图建武绍兴之业
- id: guji-史可法-endeavor-2
  title_zh: 守扬州拒降殉节
  summary_zh: 泗盱既失回守扬州纳民登陴拒豫王书独守孤城终死社稷
  phases:
  - key: brewing
    name: 移镇受阻回守扬州
    labels:
      zh:
      - 泗州失守
      - 回守扬州
    start_date: 1645-03-01
    highlight_event_id: guji-史可法-event-shoucheng
  - key: breakthrough
    name: 纳民登陴设守
    labels:
      zh:
      - 开城纳民
      - 登陴设守
    start_date: 1645-04-01
    highlight_event_id: guji-史可法-event-shoucheng
  - key: climax
    name: 焚书拒降孤城待敌
    labels:
      zh:
      - 拒降不启
      - 众将星散
    start_date: 1645-04-19
    highlight_event_id: guji-史可法-event-shoucheng
  - key: closure
    name: 城破被执不屈而死
    labels:
      zh:
      - 城亡与亡
      - 殉节扬州
    start_date: 1645-04-25
    highlight_event_id: guji-史可法-event-death
  decisions:
  - date: 1645-04-01
    title_zh: 开城纳入郊外百姓
    rationale: 不忍百姓号呼于外纵知粮援俱缺犹示慈父之仁
  - date: 1645-04-15
    title_zh: 豫王来书皆投火不启
    rationale: 身为天朝重臣不可苟且偷生以得罪万世
  - date: 1645-04-19
    title_zh: 属嗣史得威作遗表分付后事
    rationale: 知事不支以死报国而托母妻身后以全忠孝
events:
- id: guji-史可法-event-birth
  title_zh: 出生于顺天大兴
  date: 1601
  year_of: 1601
  location_zh: 顺天大兴
  description_zh: 字道邻始为西安推官有声历安庐兵备巡抚漕督终拜南京兵部尚书
- id: guji-史可法-event-jiandu
  title_zh: 出督师于扬州节制四镇
  date: 1644-06-01
  year_of: 1644
  location_zh: 扬州
  description_zh: 受命节制黄得功刘泽清刘良佐高杰分汛守江淮亲调黄高土桥之隙以安扬州
- id: guji-史可法-event-gaojiebei
  title_zh: 高杰北伐遇害于睢州
  date: 1644-10-14
  year_of: 1644
  location_zh: 睢州徐州
  description_zh: 高杰引兵而北为许定国伏杀部将还徐大梁以南皆不守中原不可为
- id: guji-史可法-event-shoucheng
  title_zh: 回守扬州拒降设守
  date: 1645-04-19
  year_of: 1645
  location_zh: 扬州
  description_zh: 泗盱既失回扬登陴檄援不至李高夜遁焚豫王书召得威托遗表于太祖陵侧
- id: guji-史可法-event-death
  title_zh: 扬州城破殉节
  date: 1645-04-25
  year_of: 1645
  location_zh: 扬州新城楼
  description_zh: 城西北崩被执见豫王不屈求无杀扬州人遂被兵尸裂阖城文武皆殉难后葬衣冠于梅花岭
