      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: '1859-04-09'
      precision: day
      is_circa: false
      raw: 咸丰九年三月初七日午
  birth_date: ''
  death_date: '1859-04-09'
  reign_ref: 清咸丰年间
endeavors:
- id: guji-叶名琛-endeavor-1
  name_zh: 拒英入城与封爵
  phases:
  - key: breakthrough
    name_zh: 襄助拒约
    labels:
      zh:
      - 布政使
      - 拒英入城
    start_date: '1849'
    highlight_event_id: guji-叶名琛-event-jue
  decisions:
  - date: '1849'
    title_zh: 与总督徐广缙协力拒绝英人入城之约
    rationale: 激发民愤、以众怒难犯之势迫使英酋罢议入城
- id: guji-叶名琛-endeavor-2
  name_zh: 总督两广与道光和局维持
  phases:
  - key: climax
    name_zh: 总督拒外
    labels:
      zh:
      - 两广总督
      - 大学士
    start_date: 1852-09
    highlight_event_id: guji-叶名琛-event-zongdu
  decisions:
  - date: 1852-09
    title_zh: 接任两广总督
    rationale: 徐广缙调湖广，朝廷授名琛为两广总督
  - date: 1856-10
    title_zh: 对英酋照会仅略书数字或竟不答
    rationale: 驭外夷务严、冀雪大耻、尊崇国体
- id: guji-叶名琛-endeavor-3
  name_zh: 英法联军攻广州与被掳
  phases:
  - key: closure
    name_zh: 城陷被掳
    labels:
      zh:
      - 英法联军
      - 广州城陷
    start_date: '1856-10-25'
    highlight_event_id: guji-叶名琛-event-lu
  decisions:
  - date: '1856-10-25'
    title_zh: 下令省河军船偃旗勿与战
    rationale: 判断英人日暮自走、不欲启衅
  - date: 1857-12
    title_zh: 拒增兵、拒团练，恃乩语镇静以待
    rationale: 信奉镇静可定大事，以为过十五日无事
events:
- id: guji-叶名琛-event-birth
  person_qid: guji-叶名琛
  type: birth
  date: ''
