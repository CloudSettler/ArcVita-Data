person:
  qid: guji-叶名琛
  name_zh: 叶名琛
  names:
    zh: 叶名琛
  era: 清
  archetype: 守疆拒夷的总督
  dilemmas:
  - 强硬拒夷与军事无力之间的两难
  - 依赖民团捍卫国体与忽视敌方实力之间的误判
  lesson: 刚愎自恃、拒听劝谏，终致城破身俘，客死海外
  summary_first_person: 我叶名琛由进士起家，官至两广总督、大学士。拒英人入城有功，然遇英法联军攻广州，我恃镇静与乩语，拒增兵拒团练，城陷被掳，押往印度， illness 而卒。
  lifespan:
