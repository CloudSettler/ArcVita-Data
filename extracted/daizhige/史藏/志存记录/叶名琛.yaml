  description_zh: 生年事迹不详
- id: guji-叶名琛-event-jue
  person_qid: guji-叶名琛
  type: endeavor
  date: '1849'
  year_of: 1849
  date_precision: year
  description_zh: 巡抚徐广缙单骑赴虎门拒英入城，名琛飞章入告，事定得旨嘉奖，封一等男爵，予世袭。
- id: guji-叶名琛-event-zongdu
  person_qid: guji-叶名琛
  type: endeavor
  date: 1852-09
  year_of: 1852
  date_precision: month
  description_zh: 咸丰二年八月授两广总督，后升协办大学士、体仁阁大学士。
- id: guji-叶名琛-event-gongcheng
  person_qid: guji-叶名琛
  type: endeavor
  date: '1856-10-25'
  year_of: 1856
  date_precision: day
  description_zh: 英酋巴亚里攻城，夺猎德、中流沙炮台，名琛笑言日昃彼自走，令偃旗勿战，英兵泊十三行。
- id: guji-叶名琛-event-xian
  person_qid: guji-叶名琛
  type: endeavor
  date: '1857-12-14'
  year_of: 1857
  date_precision: day
  description_zh: 英法联军炮击广州城，东固炮台被夺，翌日夷兵越小北门入城，广州陷。
- id: guji-叶名琛-event-lu
  person_qid: guji-叶名琛
  type: endeavor
  date: '1857-12-21'
  year_of: 1857
  date_precision: day
  description_zh: 英兵入左都统署，执名琛于中庭芭蕉下，冠带肩舆上观音山，次日挟出东门拘之船上。
- id: guji-叶名琛-event-cai
  person_qid: guji-叶名琛
  type: endeavor
  date: '1858-02-09'
  year_of: 1858
  date_precision: day
  description_zh: 被掳赴港后发新加坡、孟喀喇，居大里恩寺花园楼上，日惟诵吕祖经。
- id: guji-叶名琛-event-death
  person_qid: guji-叶名琛
  type: death
  date: '1859-04-09'
  year_of: 1859
  date_precision: day
  description_zh: 咸丰九年二月病，西法医治不效，三月初七日午问家人见电光乎，遂不复语而卒。
