events:
- id: guji-吕布-event-birth
  person: guji-吕布
  type: birth
  date: ''
  date_raw: 不详
  text: 五原人也，生年史无明文。
- id: guji-吕布-event-kill-dongzhuo
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-1
  date: 192-04-23
  year_of: 192
  date_raw: 四月二十三日
  text: 吕布刺杀董卓，以卓头系马鞍东出。
- id: guji-吕布-event-escape-changan
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-1
  date: 192-06-01
  year_of: 192
  date_raw: 六月一日败走
  text: 与李傕战败，乃将数百骑以卓头系马鞍走出武关；驻马青巢门外招王允曰"公可以去乎"。
- id: guji-吕布-event-escape-yuanshao
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-1
  date: 0193
  year_of: 193
  date_raw: 依托袁绍时期（约193）
  text: 布求还洛，绍假布司隶校尉，外言当遣内欲杀布；布使帐中鼓筝，潜自遁去，夜中兵起而布已亡，遂引去。
- id: guji-吕布-event-take-xiapi
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-2
  date: 0196
  year_of: 196
  date_raw: 布初入徐州（约建安元年196）
  text: 得袁术书信大喜，夜进下邳，丹阳兵开门内布兵，大破益德（张飞）兵，获备妻、子、军资及部曲将吏士家口。
- id: guji-吕布-event-shoot-halberd
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-2
  date: 0196
  year_of: 196
  date_raw: 袁术遣纪灵攻刘备时（约196）
  text: 纪灵率步骑三万攻备，布请灵等飨饮，令植戟于营门弯弓曰"中者当解兵"，一发中戟支，遂罢兵。
- id: guji-吕布-event-hao-meng-revolt
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-2
  date: 196-07-01
  year_of: 196
  date_raw: 建安元年六月夜半
  text: 部将郝萌反，兵入下邳府；布科头袒衣从溷上排壁出诣高顺营，顺讨斩萌首，曹性言陈宫同谋，布以宫大将不问。
- id: guji-吕布-event-duel-guosi
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-1
  date: 192-06-15
  year_of: 192
  date_raw: 长安城中（约192年六月）
  text: 布与郭汜独共对战，布以矛刺中汜，汜后骑前救，二人各罢。
- id: guji-吕布-event-siege-xiapi
  person: guji-吕布
  type: endeavor
  endeavor_id: guji-吕布-endeavor-2
  date: 198-12
  year_of: 198
  date_raw: 建安三年末（约198年12月）
  text: 曹操围下邳，布欲令陈宫、高顺守城自将骑断曹粮道，得妻言愁闷不能自决，遂为曹公所擒。
- id: guji-吕布-event-death
  person: guji-吕布
  type: death
  endeavor_id: guji-吕布-endeavor-2
  date: 199-02-07
  year_of: 199
  date_raw: 建安三年末（约199年初）
  text: 曹公擒吕布，缚之急；备曰"公不见布事丁建阳、董太师乎"，布目备曰"大耳儿最叵信"，遂被缢杀。
