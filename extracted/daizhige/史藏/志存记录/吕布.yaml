person:
  qid: guji-吕布
  name_zh: 吕布
  names:
    zh: 吕布
    en: Lü Bu
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 不详（五原人）
    death:
      date: 199-02-07
      precision: year
      is_circa: true
      raw: 建安三年末为曹操所擒，缢杀于下邳（约199年初）
  death_date: 199-02-07
  era: 东汉末
  reign_ref: 汉献帝
  archetype: 乱世枭将·反复无常之虎将
  dilemmas:
  - 杀丁原、董卓两主以求存，威名与信义不能两全
  - 下邳被围时，自出断粮道还是留城守御，妻言与陈宫、高顺之议相左
  - 穷途求赦于曹操，求刘备一言相救而不得
  lesson: 有虓虎之勇而无信义之基，反复事主、驭下不公者，虽勇冠一时终为诸将所叛、身死 feder白门。
  summary_first_person: 我吕布，五原人也。以骁武事丁原、董卓，手刃国贼董卓而名震天下，然关东诸将无有容我者。转侧于袁绍、袁术、刘备、曹操之间，据徐州与群雄周旋：辕门射戟解刘备之围，虎步淮南讥袁术之大言，亦曾夺备妻儿、与之相攻。终为曹操围于下邳，妻言愁闷不能自决，诸将临急皆叛，缚于白门之上。我谓太祖："卿背妻爱诸将妇，何以为厚？"布默然。大耳儿最叵信，然我之败，岂独人之不信我哉。
  source_urls:
  - 《汉末英雄记》（魏）王粲著·吕布条
