  archetype: 修身化人之理学士大夫
  dilemmas:
  - 为己成物与为人名誉之间当以直道无愧为断
  - 由中之乐与自外之礼之间当内外交养以消争杀
  lesson: 为学当自洒扫应对涵养而上达天德，以身化人，久则自化。
  summary_first_person: 我弱冠入太学从安定先生游，观其以德教为主而悟为己之学，后侍经筵，讲论语孟中庸，晚年笔为杂记，记师友言行与朝章礼俗，欲使后人循而上之以至于道。
