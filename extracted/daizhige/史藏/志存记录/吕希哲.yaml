endeavors:
- id: guji-吕希哲-endeavor-1
  title_zh: 太学问道与修身化人
  summary: 弱冠入太学师事胡安定，参二程横渠之学，以洒扫应对为下学上达之功。
  phases:
  - key: brewing
    name: 弱冠入太学
    labels:
      zh:
      - 求道
      - 从师安定
    start_date: 1058
    highlight_event_id: guji-吕希哲-event-study
  - key: breakthrough
    name: 会通程张
    labels:
      zh:
      - 涵养
      - 知行并进
    start_date: 1065
    highlight_event_id: guji-吕希哲-event-study
  - key: climax
    name: 以身化人
    labels:
      zh:
      - 修己教人
      - 日迁善而不自知
    start_date: 1072
    highlight_event_id: guji-吕希哲-event-teach
  - key: closure
    name: 守为己之学
    labels:
      zh:
      - 不饰行取名
      - 直道无愧
    start_date: 1080
    highlight_event_id: guji-吕希哲-event-teach
  decisions:
  - date: 1058
    title_zh: 入太学从胡安定游
    rationale: 安定以德教为主规矩备设而不尽用，欲观其化人之实以立为己之本。
  - date: 1072
    title_zh: 取法横渠以身化人
    rationale: 见横渠言忠信行笃敬而从游者迁善，知圣人必可学至，故不求空言而求躬行。
- id: guji-吕希哲-endeavor-2
  title_zh: 经筵讲读与著述传家
  summary: 元祐入侍经筵讲论语中庸，晚年追记见闻，成吕氏杂记上下卷以示后学。
  phases:
  - key: brewing
    name: 侍立父执门
    labels:
      zh:
      - 家学
      - 遍谒欧阳王司马
    start_date: 1055
    highlight_event_id: guji-吕希哲-event-study
  - key: breakthrough
    name: 元祐侍经筵
    labels:
      zh:
      - 进讲
      - 阐明诚明
    start_date: 1087
    highlight_event_id: guji-吕希哲-event-court
  - key: climax
    name: 论著成家
    labels:
      zh:
      - 笔录师说
      - 考订典礼
    start_date: 1100
    highlight_event_id: guji-吕希哲-event-write
  - key: closure
    name: 杂记示后
    labels:
      zh:
      - 传道
      - 戒饰行曲意
    start_date: 1110
    highlight_event_id: guji-吕希哲-event-write
  decisions:
  - date: 1087
    title_zh: 应诏进讲以诚明为本
    rationale: 中庸鬼神章当说至诚，胡先生以鬼神说之似浅，故欲正本清源以辅上德。
  - date: 1100
    title_zh: 笔为杂记存师友典故
    rationale: 前辈作事周详后辈多阔略，若不记录则礼亡学废，故详记朝章礼俗与师说以传信。
events:
- id: guji-吕希哲-event-birth
  title_zh: 出生于寿州
  date: 1039
  year_of: 1039
  kind: birth
  description: 宝元二年生，为吕公著之子，少承家学，祖孔宗孟以立学之正。
- id: guji-吕希哲-event-study
  title_zh: 弱冠入太学从学
  date: 1058
  year_of: 1058
  kind: career
  description: 弱冠与纪常在太学，王道粹王才叔并辔来谒安定，先生称吕晦叔二子皆有父风，遂师事胡安定及刘彝陈襄诸先生。
- id: guji-吕希哲-event-court
  title_zh: 元祐侍经筵进讲
  date: 1087
  year_of: 1087
  kind: career
  description: 元祐中入侍经筵，论中庸大学语孟之旨，辨诚明本末，参张载程颐之说以陈圣人可学之义。
- id: guji-吕希哲-event-teach
  title_zh: 体认修身化人之道
  date: 1095
  year_of: 1095
  kind: career
  description: 服膺横渠以身化人之风，谓修己以教人谓之善教，修己以化人谓之善化，主涵养浸润不求近名。
- id: guji-吕希哲-event-write
  title_zh: 著成吕氏杂记
  date: 1110
  year_of: 1110
  kind: career
  description: 追记王圣美吕与叔张子厚胡安定及朝章礼制变迁，分卷上下，兼辨老庄佛学与经义，成一家之杂记。
- id: guji-吕希哲-event-death
  title_zh: 逝世
  date: 1116
  year_of: 1116
  kind: death
  description: 政和六年卒，一生以变化气质涵养为功，遗书传于后世学者尽心知性躬行尽性之要。
