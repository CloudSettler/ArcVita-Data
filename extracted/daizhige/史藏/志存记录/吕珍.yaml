  decisions:
  - date: '1359-01-01'
    title_zh: 督民入城清野待敌
    rationale: 度大兵必至迁城外居民毁近城居宇使敌无所掠而我有坚壁
  - date: '1359-02-01'
    title_zh: 以寡御众以逸待劳持久
    rationale: 敌远来利速战而城外多水非用武之地不躁进观其动静与之持久
- id: guji-吕珍-endeavor-2
  title_zh: 连战却敌保全越城
  summary_zh: 自常禧门跃马擒敌至石堰焚寨追北又招降纳款释俘给食保越城不失
  phases:
  - key: brewing
