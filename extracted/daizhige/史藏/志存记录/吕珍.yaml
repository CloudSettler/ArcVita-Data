      zh: 身先士卒献馘执俘
    start_date: '1359-02-20'
    highlight_event_id: guji-吕珍-event-lianzhan
  - key: climax
    name: 石堰破寨
    labels:
      zh: 示弱伺懈三路齐进
    start_date: '1359-04-01'
    highlight_event_id: guji-吕珍-event-shiyan
  - key: closure
    name: 抚民释俘
    labels:
      zh: 释胁从给衣食安民
    start_date: '1359-03-01'
    highlight_event_id: guji-吕珍-event-shifu
  decisions:
  - date: '1359-02-15'
    title_zh: 亲冒矢石身先士卒
    rationale: 大军初至其势方锐不身先挫其锋则士不用命故每战必先
  - date: '1359-03-01'
    title_zh: 俘囚胁从释而不杀
    rationale: 明不负民之义以安人心离敌众杀戮者惟确为杀人者余皆给食遣还
events:
- id: guji-吕珍-event-birth
  date: '1320'
  year_of: 1320
  title_zh: 吕珍出生
  description_zh: 生年不详此据元末仕历逆推约当延祐前后
- id: guji-吕珍-event-zhenyue
  date: '1358-11-01'
  year_of: 1358
  title_zh: 以行枢密院副使镇绍兴
  description_zh: 至正十八年冬十一月至绍兴祭迈里古思而哭之拜其母严号令安人民
- id: guji-吕珍-event-zhucheng
  date: '1359-01-01'
  year_of: 1359
  title_zh: 相城增筑严备
  description_zh: 至正十九年正月命将士讲画方略筑瓮城月城望楼列炮架箭窗清野以待
- id: guji-吕珍-event-fenmen
  date: '1359-02-01'
  year_of: 1359
  title_zh: 分守诸门定持久之策
  description_zh: 命顾得兴刘宣田希仁等分守常禧植利稽山等门开门延敌议以寡御众以逸待劳
- id: guji-吕珍-event-changxi
  date: '1359-02-15'
  year_of: 1359
  title_zh: 常禧门跃马擒敌
  description_zh: 大军攻常禧门跃马挥挡杈擒一骑而还大军披靡御史大夫以马赠劳
- id: guji-吕珍-event-lianzhan
  date: '1359-02-20'
  year_of: 1359
  title_zh: 连日出战皆捷
  description_zh: 不顾耆老之请连日出城击大军献馘执俘士气增倍大军见其铠甲辄引去
- id: guji-吕珍-event-shifu
  date: '1359-03-01'
  year_of: 1359
  title_zh: 鞠俘释胁从给衣食
  description_zh: 连日获俘鞠之果杀人者戮之余胁从并释不问仍给衣食市井作息如常
- id: guji-吕珍-event-shiyan
  date: '1359-04-01'
  year_of: 1359
  title_zh: 石堰焚寨大破敌军
  description_zh: 命包玉倪昶焦德昭和攻太常山石堰寨示以不战伺懈三路齐进焚庐舍获马而还
- id: guji-吕珍-event-xiangchi
  date: '1359-05-01'
  year_of: 1359
  title_zh: 节用恤民筑塘守堰
  description_zh: 戒居民俭食用禁米出郭罢繁役筑抱姑堰及三江陡堰水陆夹守以持久
- id: guji-吕珍-event-death
  date: '1367'
  year_of: 1367
  title_zh: 吕珍去世
  description_zh: 卒年不详保越之后事迹不载此系约计
