    labels:
      zh: 乞师定盟
    start_date: 1644-04-15
    highlight_event_id: guji-吴三桂-event-shanhaiguan
  - key: climax
    name: 山海关内外合战破闯
    labels:
      zh: 合战破闯
    start_date: 1644-04-22
    highlight_event_id: guji-吴三桂-event-shanhaiguan
  - key: closure
    name: 追击至庆都封平西王
    labels:
      zh: 追贼受封
    start_date: 1644-05-01
    highlight_event_id: guji-吴三桂-event-shanhaiguan
  decisions:
  - date: 1644-04-20
    title_zh: 闻父被执陈姬被掠即引众折返
    rationale: 以不能保一女子为耻不甘受胁降贼遂决意复仇西向
  - date: 1644-04-21
    title_zh: 薙发钻刀与睿亲王定盟乞师
    rationale: 以众寡不敌恐顿甲坚城而歼尽遂借满洲精骑以逸击劳求破闯复仇
- id: guji-吴三桂-endeavor-2
  title_zh: 镇秦徇蜀收滇入缅
  summary: 由汉中驻军平定秦变入川与张献忠余部及南明相持后分三路南征由黔入滇追永历
  phases:
  - key: brewing
    name: 请命南征分兵三路
    labels:
