    highlight_event_id: guji-吴三桂-event-yipianshi
  - key: closure
    name: 追贼入京晋爵
    labels:
      zh:
      - 追击定州
      - 晋爵平西王
    start_date: 1644-06-05
    highlight_event_id: guji-吴三桂-event-yipianshi
  decisions:
  - date: 1644-04-22
    title_zh: 袭杀贼将回守山海
    rationale: 闻爱姬被掠君父已崩，知降贼必无全家之保，唯借外兵可复仇自存
  - date: 1644-04-25
    title_zh: 致书睿亲王乞师
    rationale: 京东地小兵力未集，欲兴师问罪，非假大清精兵不可成事
  - date: 1644-05-27
    title_zh: 系白布合兵冲坚
    rationale: 两军合营须明标识，集中精锐冲其中坚可一举溃贼长阵
- id: guji-吴三桂-endeavor-2
  title_zh: 镇守滇黔终至举逆
  summary: 南征云贵平永历，缢王于昆明，晋亲王总管滇黔，经营西南十余年，终因撤藩举兵反清，建周称王，病死军中
  phases:
  - key: brewing
    name: 移镇汉中窥西南
