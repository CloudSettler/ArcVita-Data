  - 降闯则父命可全而国仇难复
  - 乞师则复仇可成而引清入关贻讥后世
  - 镇滇则功高震主而进退失据
  lesson: 一念为家室而决大计遂以一战定鼎而一生受制权衡失国器终为乱贼所归
  summary_first_person: 吾本辽东边将累镇宁远奉命入援而京师已陷父执室夺遂乞师于大清合战山海关破闯西追后受封平西王转战秦蜀滇黔终镇云南功罪皆系此一决也
