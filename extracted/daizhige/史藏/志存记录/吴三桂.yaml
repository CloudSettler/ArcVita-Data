      raw: 明万历四十年五月
    death:
      date: 1678-10-02
      precision: day
      is_circa: false
      raw: 康熙十七年八月十八日
  birth_date: 1612-06-08
  death_date: 1678-10-02
  era: 明末清初
  reign_ref: 康熙
  archetype: 藩镇叛首
  dilemmas:
  - 撤藩迁辽则失兵权闲居与举兵一搏保父子俱全之间踌躇
  - 袭故明旗号以顺风号召与别建国号大周以自立之间权衡
  - 渡江北伐直捣中原与驻守虎渡观望畏惧满洲骑兵之间犹豫
  lesson: 拥兵自重者惑于私计而逆天时人心，始虽震动海内，终以离心解体而身死族灭
  summary_first_person: 我本辽东将门，奉命镇守云南，独擅云贵兵权十余年，朝廷议撤三藩令迁辽东，我惑于婿侄胡国柱夏国相等及方献廷之谋，杀巡抚朱国治起兵，建国号周，席卷贵州湖南四川两广，然畏天儆不敢渡江北伐，坐失机宜，将帅离心，粮援日促，称帝衡州未久忧惶而死，终致族灭身败
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%B9%B3%E6%BB%87%E5%A7%8B%E6%9C%AB.html
endeavors:
- id: guji-吴三桂-endeavor-1
  title_zh: 镇守云南割据经营
  summary: 奉命镇滇，独擅云贵军政，蓄养精兵，抗拒撤藩，为叛乱积势
  phases:
  - key: brewing
    name: 奉命镇滇
    labels:
      zh: 割据经营
    start_date: 1662-01-01
    highlight_event_id: guji-吴三桂-event-garrison-yunnan
  - key: breakthrough
    name: 独擅云贵
    labels:
      zh: 尾大不掉
    start_date: 1671-01-01
    highlight_event_id: guji-吴三桂-event-garrison-yunnan
  - key: climax
    name: 抗拒撤藩
    labels:
      zh: 异志遂坚
    start_date: 1673-08-01
    highlight_event_id: guji-吴三桂-event-kill-zhuguozhi
  - key: closure
    name: 决意举兵
    labels:
      zh: 密谋帷幄
    start_date: 1673-11-01
    highlight_event_id: guji-吴三桂-event-kill-zhuguozhi
  decisions:
  - date: 1673-08-01
    title_zh: 阳请撤藩以探上意
    rationale: 子应熊在京探得朝廷亦欲去五大在边，遂效尚耿请辞，冀得独留云南，不料朝廷两允，迁辽之命已下
  - date: 1673-10-01
    title_zh: 纳婿侄之言不迁辽
    rationale: 妻以子孙为质京师劝止不从，信胡国柱夏国相吴应麒等去滇则失兵权之说，又得孙世璠以为后嗣，遂决意反叛
  - date: 1673-11-01
    title_zh: 延方献廷为帷幄而疏夏吴
    rationale: 信方献廷管葛之才，命为学士中书专谋断，誓不用庸鄙贪纵之婿侄，以胡国柱为替身亲信，共图大事
- id: guji-吴三桂-endeavor-2
  title_zh: 举兵反清建周争天下
  summary: 杀巡抚起兵，建号大周，席卷西南华南，进驻湖南而不敢渡江，称帝衡州而忧死
  phases:
  - key: brewing
    name: 杀抚举兵
    labels:
      zh: 叛乱初起
    start_date: 1673-12-28
    highlight_event_id: guji-吴三桂-event-kill-zhuguozhi
  - key: breakthrough
    name: 席卷湘黔蜀粤
    labels:
      zh: 震动天下
    start_date: 1674-04-01
    highlight_event_id: guji-吴三桂-event-occupy-hunan
  - key: climax
    name: 称帝衡州
    labels:
      zh: 强弩之末
    start_date: 1678-04-01
    highlight_event_id: guji-吴三桂-event-proclaim-emperor
  - key: closure
    name: 忧死衡州
    labels:
      zh: 众叛亲离
    start_date: 1678-10-02
    highlight_event_id: guji-吴三桂-event-death
  decisions:
  - date: 1673-12-01
    title_zh: 不用故明旗号别建国号周
    rationale: 以大湖南北袭故明号迄无一成历数已绝为由，从胡国柱议，伪建国号曰周，伪称兵马都元帅，以谶语惑众
  - date: 1674-02-01
    title_zh: 驻虎渡口不敢渡江
    rationale: 长驱五千里无阻至澧州，遇雷火焚舆畏天儆，又素悉满洲骑兵利害平阳不可敌，遂驻岳州袁吉以图进取，坐失空虚之机
  - date: 1678-04-01
    title_zh: 以衡州为伪都称帝改元昭武
    rationale: 泷水取韶州惨败精锐殆尽，袁吉长沙相继失守，广东反正，计难雪耻，借称帝哄人，封楚王太孙以系党心
events:
- id: guji-吴三桂-event-birth
  title_zh: 生于辽东高邮
  date: 1612-06-08
  year_of: 1612
  location_zh: 辽东
  description: 明万历四十年生于辽东将门，后为明总兵，镇山海关
- id: guji-吴三桂-event-garrison-yunnan
  title_zh: 奉命镇守云南
  date: 1662-01-01
  year_of: 1662
  location_zh: 云南昆明
  description: 引兵入滇镇守，独擅云贵军政，蓄养精兵数万，尾大不掉，朝廷议撤三藩
- id: guji-吴三桂-event-kill-zhuguozhi
  title_zh: 杀云南巡抚朱国治起兵
  date: 1673-12-28
  year_of: 1673
  location_zh: 云南昆明
  description: 癸丑十一月二十一日杀巡抚朱国治，以吴应贵为先锋出普安陷贵州，伪建国号周举兵反清
- id: guji-吴三桂-event-occupy-hunan
  title_zh: 长驱陷贵州湖南驻虎渡口
  date: 1674-04-01
  year_of: 1674
  location_zh: 贵州至湖南澧州虎渡口
  description: 亲率胡国柱方献廷马宝等由平大黔威至贵州，总督甘文焜缢死镇远吉祥寺，长驱陷辰沅常德，至澧州遇霹雳火焚舆不敢渡江，驻虎渡口，湖南北州县望风而遁，王屏藩入蜀，王辅臣叛于秦
- id: guji-吴三桂-event-proclaim-emperor
  title_zh: 称帝衡州改元昭武
  date: 1678-04-01
  year_of: 1678
  location_zh: 湖南衡州
  description: 康熙十七年三月以衡州为伪都称帝，进方献廷为尚书辅太孙于云南，封吴应麒为伪楚王，不久土官陆道清归诚动摇全滇人心
- id: guji-吴三桂-event-death
  title_zh: 忧死衡州
  date: 1678-10-02
  year_of: 1678
  location_zh: 湖南衡州
  description: 康熙十七年八月十八日见兵势日促人心渐变，日夜忧惶叹何苦而死于衡州，余党拥吴世璠僭位于云南，十九年昆明破灭，掘骨传示各省
