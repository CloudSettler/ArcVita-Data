endeavors:
- id: guji-吴三桂-endeavor-1
  title_zh: 山海关借师破贼
  summary: 甲申京师陷落，翻然自滦州回关，乞师大清，合兵一片石大破李自成，追击至京畿，复仇雪耻而遂定鼎之基
  phases:
  - key: brewing
