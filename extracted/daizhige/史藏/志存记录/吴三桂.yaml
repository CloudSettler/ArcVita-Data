    start_date: 1662-06-01
    highlight_event_id: guji-吴三桂-event-yunnan
  - key: closure
    name: 拒撤举兵建周
    labels:
      zh:
      - 蓄谋西南
      - 病殁衡州
    start_date: 1673-12-24
    highlight_event_id: guji-吴三桂-event-rebellion
  decisions:
  - date: 1661-10-20
    title_zh: 请兵大举入缅
    rationale: 由榔在缅借以鼓众心，不禽王以献不足效黔国世守滇中为子孙计
  - date: 1662-06-01
    title_zh: 缢杀永历于昆明
    rationale: 明室根孽在此一举，杀之则滇地悉平而己位可固
  - date: 1673-12-24
    title_zh: 举兵云南反清
    rationale: 朝廷下撤藩之命，若束手解兵则数十年经营尽失，不如先发以图万世之业
events:
- id: guji-吴三桂-event-birth
  date: 1612-06-08
  year_of: 1612
  title_zh: 生于辽东高邮
  description: 万历四十年生于辽东，弱冠中武举，善骑射，勇力绝人，后镇守山海关
- id: guji-吴三桂-event-qingshi
  date: 1644-04-22
  year_of: 1644
  title_zh: 自滦州折返乞师大清
  description: 至滦州闻陈沅被掠，抵几大怒，作书与父诀，袭杀守关贼将，遣杨坤奉书乞师于睿亲王
- id: guji-吴三桂-event-yipianshi
  date: 1644-05-27
  year_of: 1644
  title_zh: 一片石合兵破李自成
  description: 睿亲王至沙河，吴兵系白布为识，冲贼中坚，追至永平，贼杀吴襄西走，吴追及定州清水河大捷
- id: guji-吴三桂-event-yunnan
  date: 1662-06-01
  year_of: 1662
  title_zh: 拥永历还滇缢杀
  description: 大兵临缅江，缅人献永历，三桂拥之还滇，康熙元年四月令人以帛缢杀之，藁葬云南城外，滇地悉平
- id: guji-吴三桂-event-rebellion
  date: 1673-12-24
  year_of: 1673
  title_zh: 云南起兵反清建周
  description: 朝廷议撤三藩，三桂杀巡抚朱国治，举兵云南，国号周，建元昭武，席卷云贵川湘闽粤
- id: guji-吴三桂-event-death
  date: 1678-10-02
  year_of: 1678
  title_zh: 称帝衡州病殁
  description: 康熙十七年三月称帝衡州，改元洪化，八月病殁于衡州行宫，孙世璠继位，滇南寻平
