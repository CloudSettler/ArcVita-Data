  - key: breakthrough
    name: 克遵义败梁亦英收降七星关外营
    labels:
      zh: 入黔破关
    start_date: 1658-05-11
    highlight_event_id: guji-吴三桂-event-rudian
  - key: climax
    name: 抄间道破七星关盘江败李定国
    labels:
      zh: 破关入滇
    start_date: 1658-12-02
    highlight_event_id: guji-吴三桂-event-rudian
  - key: closure
    name: 会师滇城西追镇南普棚
    labels:
      zh: 入城西追
    start_date: 1659-01-03
    highlight_event_id: guji-吴三桂-event-rudian
  decisions:
  - date: 1658-02-25
    title_zh: 趁孙李相攻上疏速进贵州
    rationale: 以可望投诚人心未定当用卞庄刺虎之势自请西路由川入黔以居首功
  - date: 1658-12-02
    title_zh: 知七星关险不可攻由水路抄其背
    rationale: 以正面石城木栅巨炮难撼遂寻快捷方式渡关下流出其不意惊溃白文选
events:
- id: guji-吴三桂-event-birth
  title_zh: 生于辽东将门
  date: 1612
  year_of: 1612
  place_zh: 辽东
  description: 先世由徽州至高邮流寓辽东父吴骧母为祖大寿同怀自少为边将勇而敢战累迁至宁远总兵
- id: guji-吴三桂-event-shanhaiguan
  title_zh: 山海关合战破李自成
  date: 1644-04-22
  year_of: 1644
  place_zh: 山海关一片石庙冈
  description: 与睿亲王定盟开关出战二十二日苦战至日昧满兵分左右翼击之大捷阵斩贼帅十五人杀数万追至永平庆都
- id: guji-吴三桂-event-rudian
  title_zh: 破七星关入云南城
  date: 1659-01-03
  year_of: 1659
  place_zh: 七星关至云南城
  description: 自遵义进兵由西溪河至以烈抄出白文选背追至乌撒马宝俱奔李定国败于盘江遂入滇城会师信郡王赵布太
- id: guji-吴三桂-event-death
  title_zh: 称帝衡州旋卒
  date: 1678-10-02
  year_of: 1678
  place_zh: 衡州
  description: 镇滇久而骄恣后举兵反清称周王称帝衡州未几病卒滇变大定为庭闻录所诛之乱贼
