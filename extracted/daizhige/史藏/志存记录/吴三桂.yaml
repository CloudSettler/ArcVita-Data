  - 借北兵灭闯贼，是复仇还是引敌入关
  - 撤藩搬家在即，是束手就范还是举兵一搏
  lesson: 借外力复仇终为外力所制，大义一失则进退皆咎
  summary_first_person: 余辽东铁岭人，少年镇宁远守山海，甲申借兵入关破闯贼，继而永镇云南，晚以撤藩起兵称周，席卷湖广而终败死衡州
