  birth_date: 1812
  death_date: 1879-04-25
  era: 清末（同治、光绪年间）
  reign_ref: 同治、光绪
  archetype: 以死直言的忠谏之臣（尸谏者）
  dilemmas:
  - 言职与本分：已被罪降调之臣，是否仍当越职言事
  - 私身与公义：迟死以待朝廷大事完毕，抑或即刻引决
  - 守家法与定大统：请降懿旨预定大统，恐涉建储之忌
  lesson: 「惧，吾私也；死，吾公也」——以先皇帝所赐余年，践平生未尽之言，虽官微而言系国本。
  summary_first_person: 我本甘肃皋兰一介小臣，尝以御史直言请诛成禄而落职。蒙先皇帝起用为吏部主事，五六年间，环顾在廷诸臣，无人再念穆宗立嗣大计。今逢大行皇帝奉安山陵，恐事久渐忘，遂随赴惠陵襄礼，还至蓟州马伸桥三义庙，饮毒毕命，遗疏泣请两宫皇太后预定大统之归，为穆宗留一嗣子之信。
