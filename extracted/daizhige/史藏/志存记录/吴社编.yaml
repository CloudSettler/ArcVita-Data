      raw: 明万历四十二年
  birth_date: 1535
  death_date: 1614
  era: 明
  reign_ref: 明嘉靖至万历
  archetype: 风俗记录者
  dilemmas:
  - 祈年洽闾本意与淫靡尚怪流弊之辨
  - 敬鬼神与舍医药崇巫觋废四民之业之辨
  - 长民者禁谶与士人存正直言之难
  lesson: 社本以祈年祓灾洽闾乐太平，流为淫祠糜费则启僣滋奸废业生祸，长民者当如戮豕沉巫以正之
  summary_first_person: 吾吴人也，见春夏之交妄言神降，游手亡赖张皇其事，朱门白首以至闺秀罴客无不糜金费帛废业斗奢，慨淫祠之害如昔日乌氏河伯，故历览五方贤圣诸会境仪，两日编成此篇藏之斋中以消烦暑而存直言
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%90%B4%E7%A4%BE%E7%BC%96.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%90%B4%E7%A4%BE%E7%BC%96.md
endeavors:
- id: guji-吴社编-endeavor-1
  title_zh: 批判吴地淫祠社费之祸
  summary: 举祈年祓灾本义，斥轻人道重鬼神毁宗庙建淫祠，以郭代公西门豹为法，责长民者不禁
  phases:
  - key: brewing
    name: 幼见松花猛将旱蝗则举
    labels:
      zh:
      - 酝酿
    start_date: 1545
    highlight_event_id: guji-吴社编-event-birth
  - key: breakthrough
    name: 目击瓦方贤圣五月盛会糜费
    labels:
      zh:
      - 突破
    start_date: 1573-05-01
    highlight_event_id: guji-吴社编-event-1
  - key: climax
    name: 直陈打会酣斗奸慝僣奢之害
    labels:
      zh:
      - 高潮
    start_date: 1590
    highlight_event_id: guji-吴社编-event-2
  - key: closure
    name: 发鲁人猎较之问存讽谏
    labels:
      zh:
      - 收束
    start_date: 1592
    highlight_event_id: guji-吴社编-event-2
  decisions:
  - date: 1573-05-01
    title_zh: 以五方五湖五龙考辨正名
    rationale: 考古祀典图经不载五方贤圣，断为五湖五龙之神，斥搜神姓氏封号及缁劝善黄匡阜之蛇足，以正至尊黄屋之僣
  - date: 1590
    title_zh: 引郭戮豕西门沉巫责长民者
    rationale: 以淫祠溃三尺废四民决奢淫长争斗，谓当禁而不禁则贻海氛焚廨之祸，故直言规之
- id: guji-吴社编-endeavor-2
  title_zh: 备录诸会境仪与百戏珍异
  summary: 详记五龙堂等十七境，会首助会按会看会妆会走会舍会诸式，及杂剧神鬼人物技术乐部珍异火器祭器散妆诸目
  phases:
  - key: brewing
    name: 遍走五龙东仓娄门葑门诸境
    labels:
      zh:
      - 酝酿
    start_date: 1570
    highlight_event_id: guji-吴社编-event-1
  - key: breakthrough
    name: 分疏会首助会按会看会之制
    labels:
      zh:
      - 突破
    start_date: 1585
    highlight_event_id: guji-吴社编-event-1
  - key: climax
    name: 极写妆舍杂剧傀儡狮繖亭乐之盛
    labels:
      zh:
      - 高潮
    start_date: 1591
    highlight_event_id: guji-吴社编-event-2
  - key: closure
    name: 两日编成藏斋消暑
    labels:
      zh:
      - 收束
    start_date: 1592-07-01
    highlight_event_id: guji-吴社编-event-2
  decisions:
  - date: 1585
    title_zh: 具录会首经营与贫富看会之态
    rationale: 富人捐金借骑倩妓命工，亡赖啸召敛翠裒香，按会筵豆千百，看会朱门锦席白舫青帘以至汗雨填巷，欲见糜费之实
  - date: 1592-07-01
    title_zh: 两日速编不饰直书
    rationale: 以不赀之财充无益之费神而有灵吾谁欺，故穷精竭神供一笑而藏之，存吴风一时之照
events:
- id: guji-吴社编-event-birth
  title_zh: 出生吴中
  date: 1535
  year_of: 1535
  description: 明嘉靖十四年生于吴中，幼时犹及见松花猛将会旱蝗则举
  endeavor_ref: guji-吴社编-endeavor-1
- id: guji-吴社编-event-1
  title_zh: 观五方贤圣五月大会
  date: 1573-05-01
  year_of: 1573
  description: 郡中最尚瓦方贤圣会，五龙堂为始，十七境云从，会首助会按会看会糜金极戏，遂考五湖五龙以正其名
  endeavor_ref: guji-吴社编-endeavor-1
- id: guji-吴社编-event-2
  title_zh: 备览妆舍百戏两日编成
  date: 1592-07-01
  year_of: 1592
  description: 详览妆会走会舍会杂剧神鬼人物狮繖亭台乐部珍异火器瓜仁五谷垒及南濠柿脯冶坊包子徐氏巨酒之劳，两日编成藏之斋中
  endeavor_ref: guji-吴社编-endeavor-2
- id: guji-吴社编-event-death
  title_zh: 卒后编本流传
  date: 1614
  year_of: 1614
  description: 明万历四十二年卒，吴社编以志存记录流传，见淫祠糜费之戒
  endeavor_ref: guji-吴社编-endeavor-2
