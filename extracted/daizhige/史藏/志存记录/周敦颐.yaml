person:
  qid: guji-周敦颐
  name_zh: 周敦颐
  names:
    zh: 周敦颐
    en: Zhou Dunyi
  lifespan:
    birth:
      date: '1017'
      precision: year
      is_circa: true
      raw: 生当太平（北宋）
    death:
      date: '1073'
      precision: year
      is_circa: true
  birth_date: '1017'
  death_date: '1073'
  era: 北宋
  reign_ref: 北宋
  archetype: 理学开山
  dilemmas:
  - 如何以《易》《老》融通儒学，建立天人之学的体系
  - 出仕为官与主静无欲之修养如何兼全
  lesson: 主静立人极，定之以中正仁义，以诚立本、以几神用，探道原以辟理窟。
  summary_first_person: 我世居道州营道县濂溪上，人呼濂溪先生。我作《太极图说》《通书》，契性命之微于大易，接孔颜之学于一诚，以太极人极发明天人之蕴，倡理学以开宋学程朱性理之先。我以乐易恬性和，光风霁月，饮人以和，每令二程寻孔颜乐处。
  source_urls:
  - https://zh.wikisource.org/wiki/近百年湖南学风
