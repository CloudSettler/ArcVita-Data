    title: 本《中庸》证之《易·系辞传》，拈出太极无极之义
    rationale: 使天命之性、率性之道有体有系，补《易系》所未言，融《老子》《易系》之义冶于一炉。
  - date: '1060'
    title: 主静立人极，以诚立本、以几神用
    rationale: 无欲故静，中正仁义为其实落处；道非诚不立，非几不行。
