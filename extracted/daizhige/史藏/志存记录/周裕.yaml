  - 随军深入险瘴之地，生死未卜仍坚持档房之责
  - 粮尽援绝进退两难之际，见证主帅舍生殿后
  - 归里二十余年后追忆败绩，如何秉笔直书而不讳
  lesson: 厄于水复厄于火，犹以亲历存边事之真
  summary_first_person: 我本钱塘诸生，佐明瑞幕府承办档房，随大军自永昌入木邦，转战缅地五月，九死一生而还，后追忆成从征日记以存其概
