events:
- id: guji-周裕-event-birth
  date: '1735'
  year_of: 1735
  title_zh: 生于钱塘
  description: 钱塘人，体质素弱，少有才识，后佐幕入滇
- id: guji-周裕-event-chushi
  date: '1767-09-24'
  year_of: 1767
  title_zh: 永昌随明瑞出师
  description: 大雨滂沱随军出永昌，马上度夜于冷水箐，渡潞江经龙陵芒市遮放出宛顶
- id: guji-周裕-event-manjie
  date: '1767-12-02'
  year_of: 1767
  title_zh: 蛮结分兵破十六寨
  description: 十一月三十日至蛮结相持，十二月初二分三路攻寨，将军亲冒矢石大破之
- id: guji-周裕-event-mengyu
  date: '1768-02-10'
  year_of: 1768
  title_zh: 猛域夜半溃围而出
  description: 转战五月粮尽马缺，夜半潜行过贼营，涉深溪溺毙甚多，将军殿后阵亡
- id: guji-周裕-event-fanhuan
  date: '1768-02-13'
  year_of: 1768
  title_zh: 匍匐至宛顶生还
  description: 三昼夜徒步至额尔登额宛顶大营，患痢卧病，力疾赴永昌几不相识
- id: guji-周裕-event-zhushu
  date: '1769-01-01'
  year_of: 1769
  title_zh: 乾隆三十四年追忆作日记
  description: 追忆从征始末，详记木邦锡箔天生桥道里及缅俗瘴候，断缅甸终为臣仆
- id: guji-周裕-event-buba
  date: '1790-08-01'
  year_of: 1790
  title_zh: 缅酋归顺补跋于永宁州
  description: 以广西永宁州知州前云南县知县衔，喜见缅酋上表输诚，赘言彰圣主德威
- id: guji-周裕-event-death
  date: '1791'
  year_of: 1791
  title_zh: 告养归里后卒
  description: 壮岁从征告养归里，越二十余年见缅酋归顺，不久考终
