    death:
      date: 1644-02
      precision: month
      is_circa: true
      raw: 甲申二月（宁武陷时死之）
  birth_date: ''
  death_date: 1644-02
  era: 明末
  reign_ref: 崇祯
  archetype: 死节武将
  dilemmas:
  - 孤城宁武，援兵不至，战守皆无生路，忠义与存身不可两全
  - 熊通奉命说降，斩使之则断朝廷沟通，留之则助贼劝降
  lesson: 以寡敌众，死守孤城，虽败犹令敌胆寒，忠义之名胜于苟全之身
  summary_first_person: 我周遇吉，锦州卫人，号萃庵，镇守山西总兵官。李自成破太原后势如破竹，我以宁武一关力抗。贼传檄五日不下且屠，我昼夜练兵，以战为守，设伏诱敌，杀贼数万。火药既尽，援兵不至，城陷被执，骂不绝口，遭磔而死（或云自刎）。夫人刘氏率妇女登屋而射，城破后阖城尽屠，无一受屈者。贼叹曰：周总兵真好汉，若再有此一镇，我主安得到此！后赠太保，谥忠武。
  source_urls:
  - https://zh.wikisource.org/wiki/甲申传信录
