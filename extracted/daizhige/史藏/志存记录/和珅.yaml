      raw: 嘉庆四年正月十八日赐自裁
  birth_date: '1750'
  death_date: '1799-02-22'
  era: 清代乾隆、嘉庆年间
  reign_ref: 乾隆帝、嘉庆帝
  archetype: 权臣贪官
  dilemmas:
  - 位极人臣与贪纵营私
  - 恩宠正隆与新君清算
  - 富可敌国与法网难逃
  lesson: 负国营私、聚敛无度者，纵然权倾一时，终难免身死籍没、为后世戒。
  summary_first_person: 我和珅性警敏，能强记，以舆前举对《论语朱注》得高宗赏识，不数年跻身大僚，官至总理大臣。当国二十余年，营私聚敛，金银玉器田产号称亿万。嘉庆四年正月，纯庙升遐方数日，御史疏发其罪，我奉旨拿问，旋赐自裁于狱中，廿载枉劳神，百年原是梦。
  source_urls:
  - 查抄和珅家产清单（清·佚名）
