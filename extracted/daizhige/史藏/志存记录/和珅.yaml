  - date: '1772'
    title_zh: 舆左举对《论语朱注》下文
    rationale: 高宗驾出，御前大臣无以应对，我提灯舆左谨举下文，遂蒙擢用。
  - date: '1790'
    title_zh: 延吴省兰诸公于家讲论今古
    rationale: 既贵之后延请名士讲论，诗文请彭元瑞、纪昀捉刀润色，以固文望。
- id: guji-和珅-endeavor-2
  name_zh: 聚敛家业与查抄
  phases:
  - key: brewing
    name_zh: 当国营私纳贿
    labels:
      zh: 潜通信息
