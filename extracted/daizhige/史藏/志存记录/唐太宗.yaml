  lesson: 能用贤纳谏、先正其身，方可致治；志满则鉴昏
  summary_first_person: 我以英武之资佐高祖定天下，即位后任用房玄龄、杜如晦、魏征诸贤，虚己受谏，励精图治二十余年，致斗米三钱、外户不闭，号为贞观之治；然魏征没后志满渐差，东征无功，幸能自引咎复碑。
