      precision: year
      is_circa: false
  birth_date: 0810
  death_date: 0859
  era: 中晚唐
  reign_ref: 年号大中（847—859）
  archetype: keyof 恭俭纳谏之明君
  dilemmas:
  - 相对戚里与朝廷之法，郑光庄吏犯事，欲以法而帝请贷，韦澳持正，终‘行法自近’
  - 疏斥优人祝汉贞，禁其干预朝政，宁可失左右之欢而肃朝纲
  - 大中淫雨伤农，效汤六事自责，降阶焚香践泥，以帝王之身代民受过
  lesson: 君主当修身纳谏，天子须博览，不然几于错罪忠良
  summary_first_person: 我以光王之身，历藩邸艰危，及登大位，号大中。我嗜书夜观，宫中人窃目我为老儒生；遇事必自责，淫雨之时降阶焚香，躬蹈泥泞。优伶言及外事，我正色斥之；舅氏庄吏横恣，我亦不敢长庇。人或称我小康之主，惟程功之一关，在兢栗不懈也。
  source_urls:
  - https://zh.wikipedia.org/wiki/唐宣宗
