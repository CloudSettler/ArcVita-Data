  type: birth
  date: 0810
  year_of: 810
  summary: 李忱约生于元和年间，宪宗之子，初封光王
- id: guji-唐宣宗李忱-event-2
  type: anecdote
  date: 0846
  year_of: 846
  summary: 在藩时从驾坠马于大雪中困渴求水，瓯中水尽为芳醪，体暖步归藩邸，是年即帝位
- id: guji-唐宣宗李忱-event-3
  type: anecdote
  date: 0847
  year_of: 847
  summary: 大中初京师淫雨涉月，帝执炉降阶践泥焚香自责，旋踵雨止，比秋大有年
- id: guji-唐宣宗李忱-event-4
  type: command
  date: 0850
  year_of: 850
  summary: 韦澳执郑光庄吏，延英对答，帝许‘行法自近’，杖之征欠租数百斛乃纵去
- id: guji-唐宣宗李忱-event-5
  type: anecdote
  date: 0847
  year_of: 847
  summary: 优人祝汉贞言及外间事，帝正色曰‘供戏乐耳，敢干预朝政耶’，遂疏之
- id: guji-唐宣宗李忱-event-6
  type: reading
  date: 0856
  year_of: 856
  summary: 帝嗜书构殿，退朝独坐观书至夜中烛灺委积，禁中谓其为老儒生
- id: guji-唐宣宗李忱-event-death
  type: death
  date: 0859
  year_of: 859
  summary: 大中十三年帝崩，葬贞陵，陵墓名因此成为《贞陵遗事》书名之源
