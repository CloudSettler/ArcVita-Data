events:
- id: guji-嘉庆-event-birth
  title_zh: 降生于圆明园天地一家春
  date: 1760-11-13
  year_of: 1760
  description_zh: 乾隆二十五年十月初六生，为乾隆帝第十五子，母孝仪纯皇后
- id: guji-嘉庆-event-dengji
  title_zh: 受禅登极改元嘉庆
  date: 1796-02-09
  year_of: 1796
  description_zh: 乾隆禅位，御太和殿受禅，践阼守成，恭奉太上皇训政
- id: guji-嘉庆-event-yongling
  title_zh: 驻跸夏园恭谒恭祭永陵
  date: 1805-10-07
  year_of: 1805
  description_zh: 由上夹河至夏园大营，御素服恭谒永陵，次日御朝服恭祭，复谒显佑宫地藏寺诸处拈香
- id: guji-嘉庆-event-shengjing
  title_zh: 入盛京宫御崇政殿颁恩诏
  date: 1805-10-14
  year_of: 1805
  description_zh: 由瓦子峪恭祭昭陵后入盛京宫，御崇政殿受贺颁恩诏，加级赏赉蠲免旗民钱粮
- id: guji-嘉庆-event-death
  title_zh: 崩于热河避暑山庄
  date: 1820-09-02
  year_of: 1820
  description_zh: 嘉庆二十五年七月二十五崩，归政未久，守成之局付之后嗣
