    title_zh: 复书吴三桂许裂地封王
    rationale: 以忠义招其来归，借边兵为前驱，合力灭贼以慰人心
  - date: 1644-04-22
    title_zh: 山海关分列海陆合击李自成
    rationale: 大风扬尘不可轻进，令清军对贼阵尾鳞次布列，吴兵分列右翼之末，齐进奋击以破贼众
- id: guji-多尔衮-endeavor-2
  title_zh: 摄政安抚经略江南
  summary_zh: 定都燕京后礼葬崇祯，遣将定山东山西河南，致书史可法晓以大义，命豫亲王为定国大将军征江南
