  decisions:
  - date: 1644-05-22
    title_zh: 以礼葬明崇祯帝后
    rationale: 崇怀宗谥号卜葬山陵悉如典礼，以示兴灭继绝收服人心
  - date: 1644-07-27
    title_zh: 致书史可法劝削号归藩
    rationale: 明国家乃得之于闯贼非取之于明朝，晓以春秋大义，欲联兵西讨共枭逆贼
  - date: 1644-10-25
    title_zh: 命豫亲王多铎为定国大将军征江南
    rationale: 南中擅立福王拥众自据，颁檄问罪，先降者升赏抗命者受戮，以定一统
events:
- id: guji-多尔衮-event-birth
  title_zh: 出生
  date: 1612-11-17
  year_of: 1612
  description_zh: 生于赫图阿拉，为努尔哈赤第十四子，母为大妃阿巴亥
- id: guji-多尔衮-event-shouyin
  title_zh: 受奉命大将军印
  date: 1644-04-08
  year_of: 1644
  description_zh: 顺治元年夏四月初八日，上御笃恭殿，赐摄政睿亲王多尔衮大将军敕印，代统大军往定中原，一切赏罚便宜行事
- id: guji-多尔衮-event-lianwu
  title_zh: 往复吴三桂书约合击
  date: 1644-04-16
  year_of: 1644
  description_zh: 师次西拉塔拉，复书吴三桂许率众来归必封故土晋为藩王，遂统兵前进踰宁远次沙河
- id: guji-多尔衮-event-shanhaiguan
  title_zh: 山海关大破李自成
  date: 1644-04-22
  year_of: 1644
  description_zh: 师至山海关，吴三桂开门迎降，清吴合阵对李自成二十余万众，大风止后奋击大败贼兵，追杀四十里，进吴三桂为平西王
- id: guji-多尔衮-event-yanjing
  title_zh: 底定燕京
  date: 1644-05-02
  year_of: 1644
  description_zh: 亲率余兵抵燕京，京城文武官吏耆老士庶出城迎降，李自成焚毁宫阙西遁，遣王贝勒等率师追击
- id: guji-多尔衮-event-anzang
  title_zh: 礼葬崇祯帝后
  date: 1644-05-22
  year_of: 1644
  description_zh: 以礼葬明崇祯帝后及妃袁氏两公主并天启后张氏万历妃刘氏，造陵墓如制，以收人心
- id: guji-多尔衮-event-zhaofu
  title_zh: 分遣大军定山东山西
  date: 1644-06-10
  year_of: 1644
  description_zh: 遣巴哈纳石廷柱定山东，遣叶臣定山西，令王鳌永招抚山东河南，州县望风归顺
- id: guji-多尔衮-event-zhaoyu
  title_zh: 致书史可法晓以大义
  date: 1644-07-27
  year_of: 1644
  description_zh: 令韩拱薇等赍书致史可法，言国家抚定燕都得之于闯贼，劝削号归藩永绥福禄，可法报书语多不屈
- id: guji-多尔衮-event-nanzheng
  title_zh: 檄谕南方命豫亲王南征
  date: 1644-10-25
  year_of: 1644
  description_zh: 檄谕河南南京浙江江西湖广，数南方三罪，命豫亲王多铎为定国大将军率师征江南
- id: guji-多尔衮-event-death
  title_zh: 薨逝
  date: 1650-12-31
  year_of: 1650
  description_zh: 顺治七年冬出猎古北口，坠马伤膝，薨于喀喇城，年三十九
