  archetype: 八旗悍将
  dilemmas:
  - 战功赫赫却廉俸尽散，死后家无长物、子寄食亲友
  - 装病诈败，须以己名节为注诱敌来犯
  lesson: 为将贵有诈谋与先知，治军贵赏罚分明、与士卒同苦。
  summary_first_person: 我隶八旗而以骁果任战，安庆之克我功最多。尝辞援设伏、称病诱敌，皆以谋胜。治军二十年，廉俸尽赏健士、抚恤伤亡，身死之日家无长物。
  source_urls:
  - docs/洪杨轶闻.md#多隆阿之将略
