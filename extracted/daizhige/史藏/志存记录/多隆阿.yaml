  decisions:
  - date: 1858-11
    title_zh: 鲍营告急辞不赴援，预伏要隘反夜袭
    rationale: 敌侦知无备必来袭己，与其驰援奔命，不如以伏待敌大破之。
  - date: 1961-08
    title_zh: 佯败称病、偃旗息鼓诱敌入伏
    rationale: 敌众十倍我，连战必挫；示弱数日使敌释疑，乃左右夹击一举破之。
  - date: 1863
    title_zh: 驰卒追回官文寄赡家三千金，为战士购征袍
    rationale: 忠勇不以家累萦怀，赏健士恤伤亡重于自养。
events:
- id: guji-多隆阿-event-birth
  date: 1817
  year_of: 1817
  title_zh: 多隆阿出生（约）
  description_zh: 隶旗籍，后世为以骁果任战著称的八旗将领。
- id: guji-多隆阿-event-1
  date: 1858-11
  year_of: 1858
  title_zh: 咸丰八年冬夜设伏大败来犯之敌
  description_zh: 公偕鲍超御安庆援贼，鲍营告急而不赴援，张乐宴诸将达旦；敌侦知无备乘夜来袭，公预伏兵要隘大败之。
- id: guji-多隆阿-event-2
  date: 1861-08
  year_of: 1861
  title_zh: 咸丰十一年七月称病诱敌，伏兵夹击
  description_zh: 粤军由英霍趋太湖连营数十里，公佯败称病、偃旗息鼓不出，敌疑数日后获间翏（谓公实大病）来犯，公预伏二十营左右夹击，敌皆弃械奔桐城。
- id: guji-多隆阿-event-3
  date: 1861-09
  year_of: 1861
  title_zh: 克复安庆，功居最多
  description_zh: 嗣是追逐截击捷报日闻；一夕登巢车远眺预移其军，敌夜劫得空营自相践藉引去，安庆之克公功最多。
- id: guji-多隆阿-event-4
  date: 1863
  year_of: 1863
  title_zh: 周至受创，帝遣药使、子双全驰驿往视
  description_zh: 公受重伤，清帝发内府珍药敷治，命黑龙江将军传知其子双全驰驿往视；其子絮衣葛屦寄食亲友，资以行装始得上道。
- id: guji-多隆阿-event-death
  date: 1864
  year_of: 1864
  title_zh: 多隆阿卒（约）
  description_zh: 忠勇无家， Yet 遗疏云“不使家有长物，身有余财”；为八旗劲旅中与兵事相始终之第一功臣。
