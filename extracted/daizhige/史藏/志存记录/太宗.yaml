  - date: 626
    title_zh: 谋除萧墙之恶以匡社稷
    rationale: 咨询李靖、李绩皆辞，帝由是珍此二人。
  - date: 627
    title_zh: 纳魏征之谏行帝王道
    rationale: 始人皆言当今不可行帝王道，唯魏征劝我，遂成功业。
  - date: 约 630
    title_zh: 以和为饵大破突厥
    rationale: 靖请倾府库赂以求和，潜军邀其归路，帝从其言，虏遂大溃获马数万。
events:
- id: guji-唐太宗-event-birth
  date: 599
  year_of: 599
  title_zh: 李世民出生
  summary: 史称唐太宗，本篇载其秦王府诸事迹。
- id: guji-唐太宗-event-e1
  date: 621
  year_of: 621
  title_zh: 御窦建德之役亲驭弓矢
  summary: 太宗持弓、尉迟敬德执枪相副，驰至敌营叩门大呼「我大唐秦王，能者来」。
- id: guji-唐太宗-event-e2
  date: 626
  year_of: 626
  title_zh: 嗣位称帝
  summary: 初嗣位，与郑公语恒自名，由是天下归心。
- id: guji-唐太宗-event-e3
  date: 626
  year_of: 626
  title_zh: 与突厥渭水之盟并反劫其归路
  summary: 突厥控弦四十万至渭水桥，用李靖策赂和邀伏，虏弃老弱而遁，获马数万匹。
- id: guji-唐太宗-event-e4
  date: 630
  year_of: 630
  title_zh: 平定突厥
  summary: 卫公既灭突厥，斥境至于大漠；温彦博请处种落于朔方，郑公以为非久远策。
- id: guji-唐太宗-event-e5
  date: 630
  year_of: 630
  title_zh: 贞观断死囚二十九人
  summary: 贞观四载，天下康安，断死刑至二十九人，户不夜闭，行旅不赍粮。
- id: guji-唐太宗-event-e6
  date: 645
  year_of: 645
  title_zh: 征辽驻跸之役受挫
  summary: 六军为高丽所乘，赖李绩麾下破敌；帝深悔此行，叹若魏征在不使有此举。
- id: guji-唐太宗-event-e7
  date: 约 643
  year_of: 643
  title_zh: 痛悼魏征
  summary: 魏征殂逝，帝自制碑文自书，谓「朕尝宝三镜，今魏征殂逝，遂亡一镜矣」。
- id: guji-唐太宗-event-death
  date: 649
  year_of: 649
  title_zh: 唐太宗驾崩
  summary: 贞观二十三年崩，昭陵陪葬功臣。
