    en: Emperor Taizong of Tang
  lifespan:
    birth:
      date: 599
      precision: year
      is_circa: true
      raw: 文中未明载，通说生于隋开皇年间
    death:
      date: 649
      precision: year
      is_circa: false
      raw: 贞观二十三年崩
  birth_date: 599
  death_date: 649
  era: 唐 · 贞观
  reign_ref: 贞观（627-649）
  archetype: 雄才兼听之君
  dilemmas:
  - 直言纳谏与帝王之尊的张力：既敬魏征之妩媚，又怒称「会杀此田舍汉」
  - ' takeaway政治两难：为社稷计除萧墙之恶时，李靖、李绩皆辞不与谋'
  - 征辽之失：魏征已逝无人谏止，兵败而后悔，复立其碑
  lesson: 以人为镜，用防己过；兼听纳谏方成治世。
  summary_first_person: 朕以秦王之身定天下，嗣位后以魏征为镜、以贤为师，虚心纳谏，遂致贞观之治；然魏征亡后轻启征辽之役，方悟良臣之重。
  source_urls:
  - 《隋唐嘉话》唐 刘餗
