  description: 教遣步骑五万往救新罗，官兵方至倭贼退，追至闾加罗任那，倭败死者十九
  location_zh: 新罗
- id: guji-好太王-event-daifang
  date: '0404'
  year_of: '0404'
  title_zh: 甲辰迎击倭于带方
  description: 倭不轨侵入带方界，太王率兵自石城岛连船渡海，倭寇溃败斩杀无数
  location_zh: 带方
- id: guji-好太王-event-bury-fuyu
  date: '0410'
  year_of: '0410'
  title_zh: 庚戌讨东夫余
  description: 东夫余旧是邹牟王属民中叛不贡，王躬率往讨，军到余城国皆归服
  location_zh: 东夫余
- id: guji-好太王-event-death
  date: '0412'
  year_of: '0412'
  title_zh: 宴驾迁山陵
  description: 昊天不吊卅有九宴驾弃国，以甲寅年九月廿九日乙酉迁就山陵
  location_zh: 高句丽
