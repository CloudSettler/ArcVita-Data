  date: 1333-07-19
  year_of: 1333
  place_zh: 大都
  summary: 自广西静江经汴梁至良乡，燕帖木儿以卤簿迎之，并马无言，六月登位改元元统，尊文宗后为太后，以燕帖木儿为太师左丞相
- id: guji-妥欢帖木儿-event-depose-bayan
  title_zh: 柳林卸伯颜军权并贬安置
  date: 1340-03-01
  year_of: 1340
  place_zh: 柳林及大都
  summary: 伯颜请飞放猎柳林，脱脱密告有异志，月怯察儿夜负燕帖古思入城，城上开读诏书解散从众，贬伯颜为河南左丞相再安置阳春，太后徙东安州，燕帖古思死于押送途中
- id: guji-妥欢帖木儿-event-history-complete
