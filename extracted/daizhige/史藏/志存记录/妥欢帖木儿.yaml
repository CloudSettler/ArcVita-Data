  summary: 脱脱奏用欧阳玄揭奚斯等修辽金宋三史，以江南桩寄钱粮为费，脱脱独断各与正统，书成鼓吹导从进于宣文阁，帝具礼服受之并大宴群臣
- id: guji-妥欢帖木儿-event-death
