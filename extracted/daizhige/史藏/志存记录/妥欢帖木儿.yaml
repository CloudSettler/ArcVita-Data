  birth_date: 1320-05-25
  death_date: 1370-05-23
  era: 元末
  reign_ref: 元惠宗元统至正
  archetype: 隐忍复权之末代守成君
  dilemmas:
  - 幼冲流落南徼，如何在燕帖木儿等权臣猜忌下保全性命并承大统
  - 母仇与权相伯颜专擅交织，如何借脱脱之力除权臣而亲政
  - 祖制废弛与汉法文治之间，如何以科举修史讲经挽回人心
  lesson: 由羁旅藩邸而登大位，须忍辱待时，借少年近臣之力去旧权，再以文治收人心，然积弊已深则文治难挽大厦之倾
  summary_first_person: 我本明宗长子，生于甘州，幼流静江。文宗崩后燕帖木儿久不立我，后迎我于良乡，我默然不发，遂于元统元年登极。初为伯颜所制，立翁吉刺为正宫，祁氏为次宫。至元五年用脱脱计，于柳林卸伯颜军权，贬之南行而死，黜太后与燕帖古思。于是复科举，开经筵，命脱脱总裁修辽金宋三史，欲以文治中兴，然红巾已起，天下终不可为矣
  source_urls:
  - https://daizhige.org/史藏/志存记录/庚申外史.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/志存记录/庚申外史.md
