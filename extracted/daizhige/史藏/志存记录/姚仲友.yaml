events:
- id: guji-姚仲友-event-birth
  event_type: birth
  date: ''
  year_of: ''
  summary: 生年不详，出自将门，三世忠孝，声满夷夏。
- id: guji-姚仲友-event-death
  event_type: death
  date: '1127-01-10'
  year_of: 1127
  summary: 二十五日晚于南城为军民所殴打至死，肝脑涂地，家赀劫掠扫地，后由王燮收遗骸、雪冤于朝廷。
- id: guji-姚仲友-event-defend-tongjin
  event_type: endeavor
  date: '1126-12-31'
  year_of: 1126
  summary: 闰十一月三日金人攻通津门甚急，仲友带军将效用千余人下城接战，杀伤甚众。
- id: guji-姚仲友-event-defend-xuanhua
  event_type: endeavor
  date: '1127-01-01'
  year_of: 1127
  summary: 初九日宣化门告急，往守御，于南拐子城造砖圆门辕门，多置炮弩，绞缚致胜棚，一日而成，众指为鬼工，贼桥不能寸进。
- id: guji-姚仲友-event-blood-battle
  event_type: endeavor
  date: '1127-01-06'
  year_of: 1127
  summary: 二十三日遣张宗颜、阎维、叚永年领敢死兵三百血战城下，纯斧队斫坏洞子七所，贼众败走。
- id: guji-姚仲友-event-fire-defense
  event_type: endeavor
  date: '1127-01-05'
  year_of: 1127
  summary: 二十四日贼推大梯来攻，仗剑拥班直守御救火，用炼金汁泼贼，杀伤甚众，贼遂退。
- id: guji-姚仲友-event-strategy
  event_type: endeavor
  date: '1126-12-25'
  year_of: 1126
  summary: 与诸将议选五万精兵出四门分十头顶击敌，为唐恪所止，专在和议；后复议讲和，为何栗所拒。
- id: guji-姚仲友-event-city-fall
  event_type: endeavor
  date: '1127-01-10'
  year_of: 1127
  summary: 二十五日郭京开宣化门出兵溃败，贼兵登城，汴京城陷，仲友自闰初三日策应至城陷，昼夜劳苦二十四日。
