    death:
      date: '1127-01-10'
      precision: day
      is_circa: false
      raw: 靖康闰十一月二十五日（丙午岁末）
  era: 北宋末年（靖康年间）
  reign_ref: 宋钦宗靖康
  archetype: 忠勇守御之将
  dilemmas:
  - 主张乘金军远来疲敝、选精兵出战，却被唐恪专主和议所止，坐失战机
  - 帮筑城身之策为提刑秦元所阻，朝廷迁延不决，功败垂成
  - 尽忠守城却先于二相被军民殴打致死，冤死而无门生故吏哭尸
  lesson: 忠于职守、勤于守御者未必得善报，然其守御之法与 Hotel 忠义之声终得雪冤传世。
  summary_first_person: 我是姚仲友，将种三世忠孝。靖康之围中，我往来东南两壁策应守御，造拐子城、设撞竿破贼梯桥，昼夜勤劳，最为有功，不料城陷之夜竟死于军民之手，以上天不佑善人为痛。
  source_urls:
  - https://zh.wikisource.org/wiki/避戎夜话
