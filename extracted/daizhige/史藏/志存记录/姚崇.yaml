- id: guji-姚崇-event-career-4
  date: 721-09
  year_of: 721
  type: endeavor
  endeavor_id: guji-姚崇-endeavor-2
  name_zh: 病中诫子遗计
  description_zh: 姚崇诫诸子：张丞相好服玩，我殁后必来吊；盛陈平生服玩宝带重器于帐前，他若不顾则速计家事，举族无类；若顾之，则录其玩用致于张公，并请神道碑文。
- id: guji-姚崇-event-career-5
  date: 721-09
  year_of: 721
  type: endeavor
  endeavor_id: guji-姚崇-endeavor-2
  name_zh: 张说来吊，果顾玩服
  description_zh: 姚既殁，张说果至，目其玩服三四，姚氏诸孤悉如教诫，知可制。
- id: guji-姚崇-event-career-6
  date: 721-10
  year_of: 721
  type: endeavor
  endeavor_id: guji-姚崇-endeavor-2
  name_zh: 碑文速成并镌刻上石
  description_zh: 不数日文成，叙述该详，时为极笔，称'八柱承天，高明之位，列四时成岁，亭毒之功存'。姚氏先砻石以待，登时镌刻并奏御。
- id: guji-姚崇-event-career-7
  date: 721-10
  year_of: 721
  type: endeavor
  endeavor_id: guji-姚崇-endeavor-2
  name_zh: 张说悔而取文不得
  description_zh: 后数日张说果遣使取文，托词词未周密欲删改；姚氏诸子引使视碑，告以已奏御闻上。张说悔恨拊膺曰：'死姚崇犹能算生张说，吾今日方知才之不及也远矣。'
