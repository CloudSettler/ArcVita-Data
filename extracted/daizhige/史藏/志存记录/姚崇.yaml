  era: 唐·开元
  reign_ref: 唐玄宗先天、开元年间
  archetype: 深谋远虑的名相·身后设局者
  dilemmas:
  - 与张说同为宰辅而嫌隙甚深，屡遭侵事，须防身后祸族
  - 明知张性好侈、衔恨切齿，须以智取而不以力抗
  lesson: 死姚崇犹能算生张说——知人料事、料敌机先者，祸患止于未发
  summary_first_person: 我与张说同朝为相，嫌隙甚深。病笃之际，我诫诸子：我死后张必来吊，盛陈我平生服玩宝器于帐前——他若不顾，汝等速谋家事，举族无类；他若顾恋，即录其玩好致于张公，并以神道碑为请。碑文到手，立刻镌刻上石，先砻石以待。张见事迟于我，数日必悔，欲取文删改，汝等引使视碑，告以已奏御闻上。后果如其言，碑文成而我家得全。
  source_urls:
  - https://zh.wikisource.org/wiki/开天传信记（据所供古文段）
