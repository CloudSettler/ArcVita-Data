person:
  qid: guji-姚广孝
  name_zh: 姚广孝
  names:
    zh: 姚广孝
    en: Yao Guangxiao
  lifespan:
    birth:
      date: '1335'
      precision: year
      is_circa: true
      raw: 至正间年四十出家，逆推约生于是年之前四十载（约元元统三年）
    death:
      date: '1418'
      precision: year
      is_circa: true
      raw: 永乐中出使归吴途中得疾而薨（约永乐十六年）
  birth_date: '1335'
  death_date: '1418'
  era: 元末明初
  reign_ref: 洪武/永乐
  archetype: 僧而佐业的谋略家
  dilemmas:
  - 身在佛门而蓄发受爵，是否背弃方外之誓
  - 佐成靖难大功与故友闭门不纳的道义之间
  lesson: 功成而不居，以僧终老，清静自处。
  summary_first_person: 我本是吴相城医家之子，出家为僧名道衍，以高僧分赐燕府，参太宗潜邸二十余年，佐成靖难之功，受封太子少师而终不肯留发，赈济苏松，清静自居。
endeavors:
- id: guji-姚广孝-endeavor-1
  name_zh: 出家游学
  phases:
  - key: brewing
    name_zh: 弃医向学与出家
    labels:
      zh:
      - 祝发为僧
    start_date: '1355'
    highlight_event_id: guji-姚广孝-event-ordination
  - key: breakthrough
    name_zh: 游学湖广，刻意诗文
    labels:
      zh:
      - 工诗善书
    start_date: '1360'
    highlight_event_id: guji-姚广孝-event-study
  - key: climax
    name_zh: 诏取高僧，住持庆寿寺
    labels:
      zh:
      - 住持庆寿寺
    start_date: '1382'
    highlight_event_id: guji-姚广孝-event-temple
  decisions:
  - date: '1355'
    title_zh: 不乐为医，从佛为方外之乐
    rationale: 幼白父曰不乐为医，但欲读书笃学以仕王朝，否则从佛。
  - date: '1375'
    title_zh: 洪武四年诏取高僧，以病免
    rationale: 有诏取高僧而称病不出。
  - date: '1378'
    title_zh: 通儒学僧考中而不愿仕
    rationale: 礼部考中后不愿出仕，赐僧服还山。
- id: guji-姚广孝-endeavor-2
  name_zh: 佐成靖难
  phases:
  - key: brewing
    name_zh: 分赐燕府，参太宗潜邸
    labels:
      zh:
      - 参应太宗于潜邸
    start_date: '1382'
    highlight_event_id: guji-姚广孝-event-temple
  - key: climax
    name_zh: 定靖难之谋
    labels:
      zh:
      - 靖难之功
    start_date: '1398'
    highlight_event_id: guji-姚广孝-event-jingnan
  - key: closure
    name_zh: 蓄发受爵，赈济苏松
    labels:
      zh:
      - 太子少师
      - 苏松赈济
    start_date: '1402'
    highlight_event_id: guji-姚广孝-event-official
  decisions:
  - date: '1355'
    title_zh: 靖难定议，言檐瓦坠地为祥兆
    rationale: 燕王以瓦碎为不祥，广孝曰天欲易黄瓦耳，是日谋乃定。
  - date: '1402'
    title_zh: 赐名广孝，蓄发加官爵而终不肯留发
    rationale: 道衍有功于国，宜蓄发加以官爵；虽官于朝，仍清净自居。
  - date: '1402'
    title_zh: 往苏松赈济
    rationale: 六月奉命往苏松赈济，赐玉带。
events:
- id: guji-姚广孝-event-birth
  person_id: guji-姚广孝
  type: birth
  date: '1335'
  year_of: '1335'
  description: 生于吴之相城，先世自汴扈宋来吴，世业医，父曰震卿，初名天禧。
- id: guji-姚广孝-event-ordination
  person_id: guji-姚广孝
  type: career
  date: '1355'
  year_of: '1355'
  description: 至正间年四十，出家于里之玅智庵，名道衍。
- id: guji-姚广孝-event-study
  person_id: guji-姚广孝
  type: career
  date: '1360'
  year_of: '1360'
  description: 游学湖广，刻意为诗文，过古作者，常从高季迪诸人游，工诗善书。
- id: guji-姚广孝-event-temple
  person_id: guji-姚广孝
  type: career
  date: '1382'
  year_of: '1382'
  description: 孝慈高后丧，太祖亲选道衍住持庆寿寺，参应太宗于潜邸二十余年。
- id: guji-姚广孝-event-jingnan
  person_id: guji-姚广孝
  type: career
  date: '1398'
  year_of: '1398'
  description: 太宗靖内难，宾于幕下，以檐瓦坠地为祥兆定靖难之谋。
- id: guji-姚广孝-event-official
  person_id: guji-姚广孝
  type: career
  date: '1402'
  year_of: '1402'
  description: 太宗即位，授左善世；赐名广孝，冠带朝服，升资善大夫、太子少师；六月往苏松赈济，赐玉带。
- id: guji-姚广孝-event-death
  person_id: guji-姚广孝
  type: death
  date: '1418'
  year_of: '1418'
  description: 复以使事归，途中得疾，抵城门不入；上亲临抚劳，乞赦泐季潭，数日乃薨。
