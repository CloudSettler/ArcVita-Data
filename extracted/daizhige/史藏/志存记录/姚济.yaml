events:
- id: guji-姚济-event-birth
  title_zh: 出生
  date: '1790'
  year_of: 1790
  summary: 清嘉庆年间生于松江一带生年失载约推于此时
- id: guji-姚济-event-jishui-start
  title_zh: 五月初一起按日纪水
  date: '1849-05-01'
  year_of: 1849
  summary: 己酉五月初一起竟日小雨夏至晴雨参半初三潮汛涨四五尺遂按日记晴雨水势与报荒
- id: guji-姚济-event-fengyu-dazhang
  title_zh: 五月十七夜风雨坍墙水大涨
  date: '1849-05-17'
  year_of: 1849
  summary: 竞日大雨夜复东北风大作风声雨声坍墙声不绝余家后墙亦坍白龙潭人家已住水乡
- id: guji-姚济-event-tuishui
  title_zh: 六月初二水势渐退
  date: '1849-06-02'
  year_of: 1849
  summary: 竟日东南风太阳燥物为今夏第一日城中水退二三寸浦南已退一二尺
- id: guji-姚济-event-jizhen
  title_zh: 七月十一华娄给口粮
  date: '1849-07-11'
  year_of: 1849
  summary: 华娄两邑于七月十一日起给口粮小民以户口不均日向公堂申诉娄青为甚华上次之
- id: guji-姚济-event-death
  title_zh: 逝世
  date: '1860'
  year_of: 1860
  summary: 己酉纪闻后事迹失载约卒于咸丰同治之际
