      raw: 殁于广西按察使官
  birth_date: ''
  death_date: ''
  era: 清
  reign_ref:
  - 嘉庆
  - 道光
  archetype: 经世学者与台湾治理能吏
  dilemmas:
  - 锐欲有以自树立，然尝有所言，上官弗善，未几罢去
  - 署台湾道五年，卒以英使讦控「妄杀俘虏」，与台湾镇达洪阿一同褫职被逮，功罪难辨
  - 目睹往来论议区划之详，惧后来者习焉不得其所以然，故决意据事直书以寓劝惩
  lesson: 知之而不能言，咎在其下；言之而不能举，咎在其上；据事直书、明切事情者，终足以不朽
  summary_first_person: 我字石甫，号明叔，晚号展和，安徽桐城人，进士出身。嘉庆二十四年我任台湾海防同知，道光元年摄噶玛兰通判事，习知台地地势民俗，遇事激昂奋发。二年丁父艰内渡，三年春复应邀渡台襄助方传燧，五年始回内地。我夙留意经世之学，以羁忧栖迟海外，惧后来者习焉不得其所以然，乃于道光九年采其要略著为《东槎纪略》五卷。十八年又署台湾道，在任五年，卒以英使讦控「妄杀俘虏」被逮，旋获释，洊擢至广西按察使，殁于官。
