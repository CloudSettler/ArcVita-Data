    title_zh: 任政首年作封洫，整编田界与都鄙
    rationale: 田界混乱、庐井紊乱，非整饬田制无以足民食兵赋，虽谤怨盈耳亦不更改
  - date: '-542'
    title_zh: 拒毁乡校，听国人议政
    rationale: 其所善者吾将行之，其所恶者吾将改之，是吾师也，防民之口甚于防川
  - date: '-536'
    title_zh: 铸刑书，公布成文法
    rationale: 临事制刑不可为常，铸刑书以定民志，虽叔向贻书责之，吾以救世为务不辞
