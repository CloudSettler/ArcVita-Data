    rationale: 爵卑而贡重者甸服也，郑伯男也而使从公侯之贡惧弗给也，故必争以轻郑之贡
events:
- id: guji-子产-event-birth
  person_qid: guji-子产
  type: birth
  title_zh: 子产生于郑国公族
  date: '-580'
  year_of: -580
  precision: year
  is_circa: true
  description_zh: 子产即公孙侨，字子产，郑穆公之孙、公子发（子国）之子，生于郑国公族，生年不详，约在公元前580年前后。
  source_urls:
  - https://ctext.org/guo-yu/zhou-yu-zhong/zhs
- id: guji-子产-event-fengxu
  person_qid: guji-子产
  type: endeavor
  title_zh: 作封洫，整顿田制
  date: '-543'
  year_of: -543
  precision: year
  is_circa: false
  description_zh: 子产受郑国执政之任，使都鄙有章、上下有服，田有封洫、庐井有伍，初行而国人谤之，三年而民诵之。
  source_urls:
  - https://ctext.org/chun-qiu-zuo-zhuan/xiang-gong-shi-san-nian/zhs
- id: guji-子产-event-xiangxiao
  person_qid: guji-子产
  type: endeavor
  title_zh: 不毁乡校
  date: '-542'
  year_of: -542
  precision: year
  is_circa: false
  description_zh: 郑人游于乡校以议执政，然明劝毁乡校，子产拒之，以为其所善者行之、所恶者改之，若之何毁之。
  source_urls:
  - https://ctext.org/chun-qiu-zuo-zhuan/xiang-gong-san-shi-yi-nian/zhs
- id: guji-子产-event-xingshu
  person_qid: guji-子产
  type: endeavor
  title_zh: 铸刑书
  date: -536-01-01
  year_of: -536
  precision: year
  is_circa: false
  description_zh: 三月，郑人铸刑书，公布成文法典，叔向遗书诒子产责其弃礼而征于书，子产报曰侨不才不能及子孙，吾以救世也。
  source_urls:
  - https://ctext.org/chun-qiu-zuo-zhuan/zhao-gong-liu-nian/zhs
- id: guji-子产-event-zhenggong
  person_qid: guji-子产
  type: endeavor
  title_zh: 争贡——郑伯男也，勿使从公侯之贡
  date: '-529'
  year_of: -529
  precision: year
  is_circa: false
  description_zh: 韦昭注国语引左传子产争贡之辞：爵卑而贡重者甸服也，郑伯男也而使从公侯之贡，惧弗给也，以此明郑在男服，贡赋当称其爵。
  source_urls:
  - https://ctext.org/guo-yu/zhou-yu-zhong/zhs
- id: guji-子产-event-death
  person_qid: guji-子产
  type: death
  title_zh: 子产卒，遗训宽猛相济
  date: -522-01-01
  year_of: -522
  precision: year
  is_circa: false
  description_zh: 子产病，谓子大叔曰我死子必为政，唯有德者能以宽服民，其次莫如猛；及卒，仲尼闻之出涕曰古之遗爱也。
  source_urls:
  - https://ctext.org/chun-qiu-zuo-zhuan/zhao-gong-er-shi-nian/zhs
