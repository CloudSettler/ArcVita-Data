person:
  qid: guji-子产
  name_zh: 子产
  names:
    zh: 子产
    en: Zichan
  lifespan:
    birth:
      date: '-580'
      precision: year
      is_circa: true
      raw: 约公元前580年（生年不详，一说约郑简公初年前后）
    death:
      date: -522-01-01
      precision: year
      is_circa: false
      raw: 公元前522年
  birth_date: 约公元前580年
  death_date: 公元前522年
  era: 春秋
  reign_ref: 郑国执政（事郑简公、郑定公、郑献公）
  archetype: 政治家·改革家·外交家
  dilemmas:
  - 弱国处晋楚两大国之间，如何以礼与辞令争国格而免于兵祸
  - 推行田制军制改革触动贵族利益，如何既强国又保身
  - 铸刑书公布成文法，打破临事议刑旧制，遭叔向致书责难
  lesson: 为政不毁乡校、宽猛相济，弱国亦能以礼义与辞令自立于大国之间
  summary_first_person: 我名公孙侨，字子产，郑穆公之孙。我执郑国之政，作封洫、立谤政、铸刑书，使郑国小而有政；于诸侯之会，我以辞令争贡赋之轻重，曰爵卑而贡重者甸服也，郑伯男也而使从公侯之贡，惧弗给也。孔子称我有古之遗爱。
  source_urls:
  - https://ctext.org/guo-yu/zhou-yu-zhong/zhs
  - https://ctext.org/chun-qiu-zuo-zhuan/zhao-gong-shi-san-nian/zhs
