endeavors:
- id: guji-孙允中-endeavor-1
  title_zh: 分巡大同廉得首恶缚献
  role: 分巡佥事
  phases:
  - key: brewing
    name: 出巡蔚州闻李瑾被杀兼程回镇
    labels:
      zh: 兼程侦变
    start_date: 1525-07-01
    highlight_event_id: guji-孙允中-event-1
  - key: breakthrough
    name: 入城觇兵廉得首恶名数
    labels:
      zh: 入城侦奸
    start_date: 1525-08-01
    highlight_event_id: guji-孙允中-event-1
  - key: climax
    name: 谋诸潘朱詹生缚倡恶者献帝
    labels:
      zh: 缚献渠魁
    start_date: 1525-08-15
    highlight_event_id: guji-孙允中-event-1
  - key: closure
    name: 帅甲士舆囚诣军门谏止血刃
    labels:
      zh: 谏止滥讨
    start_date: 1525-09-05
    highlight_event_id: guji-孙允中-event-2
  decisions:
  - date: 1525-08-10
    title_zh: 不信兵悉变断为首恶倡乱
    rationale: 亲入城察访知胁从者众，首恶不满二百，可分别定罪，不可尽诛
  - date: 1525-09-05
    title_zh: 舆囚诣军门力陈一狱吏足矣
    rationale: 五堡事朝廷已处分，甲申献级非俘，今党与未尽，以书召验即可，不须大兵洗城
- id: guji-孙允中-endeavor-2
  title_zh: 冒死入城开谕止屠著史
  role: 谏止抚定者
  phases:
  - key: brewing
    name: 受命先入城谕安人心
    labels:
      zh: 受命开谕
    start_date: 1525-10-01
    highlight_event_id: guji-孙允中-event-3
  - key: breakthrough
    name: 同赵镇戴廉设伏格杀讹言者
    labels:
      zh: 夜破讹言
    start_date: 1525-10-20
    highlight_event_id: guji-孙允中-event-3
  - key: climax
    name: 城破被围笑谕分疏请止兵羁留
    labels:
      zh: 分疏止兵
    start_date: 1525-11-01
    highlight_event_id: guji-孙允中-event-4
  - key: closure
    name: 复原职致仕著云中纪变
    labels:
      zh: 复职著史
    start_date: 1527-06-01
    highlight_event_id: guji-孙允中-event-5
  decisions:
  - date: 1525-10-20
    title_zh: 明午解甲迎王师而夜伏待变
    rationale: 洗城讹言一起众必惊溃，须以伏击明纪律，使知首恶已得兵不滥及
  - date: 1525-11-05
    title_zh: 分道间行五六疏请朝廷申纪律
    rationale: 将士贪功激变，兵连祸结非安社稷之计，虽途被邀截亦必使圣明知屠城非是
events:
- id: guji-孙允中-event-birth
  date: 1495
  year_of: 1495
  title_zh: 诞生
  description: 约弘治年间诞生，後举官至大同分巡佥事
- id: guji-孙允中-event-1
  date: 1525-08-15
  year_of: 1525
  title_zh: 闻李瑾被杀入城擒渠魁
  description: 出巡蔚州闻变兼程回镇，入城觇兵不悉变，廉得季富子王宝等首恶，谋诸潘仿朱振詹荣，生缚倡恶者并器仗以献
- id: guji-孙允中-event-2
  date: 1525-09-05
  year_of: 1525
  title_zh: 舆囚诣军门谏刘源清
  description: 帅甲士舆囚徒诣总制刘源清军门，言罪人既得可不血刃，陈甲申献级非俘，今不满二百，一狱吏足矣
- id: guji-孙允中-event-3
  date: 1525-10-20
  year_of: 1525
  title_zh: 再入城开谕夜破洗城讹言
  description: 奉命入城谕令解甲弃兵迎王师，二鼓城中呐喊讹言洗城，同赵镇戴廉设伏邀击，格杀二十九人，余解散
- id: guji-孙允中-event-4
  date: 1525-12-01
  year_of: 1525
  title_zh: 上疏止屠被劾离母去官
  description: 与潘仿驰往谕众被围，笑言圣明不屠城，分道上疏请申纪律，为东圃所怒，讽劾离母出城，去官听勘羁留怀仁
- id: guji-孙允中-event-5
  date: 1527-06-01
  year_of: 1527
  title_zh: 复职致仕著云中纪变
  description: 经黄绾查勘明功罪，潘仿孙允中复原职致仕，允中乃著云中纪变，备载甲申五堡及李瑾两变本末
- id: guji-孙允中-event-death
  date: 1545
  year_of: 1545
  title_zh: 逝世
  description: 致仕後约嘉靖二十余年卒，一生以抚定大同恩威并著见称
