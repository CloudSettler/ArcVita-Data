  reign_ref: 嘉靖
  archetype: 直臣
  dilemmas:
  - 避党逆助恶之嫌与冒死入城抚定之两难
  - 忤总制贪功嗜杀与坐视屠城玉石俱焚之两难
  - 离母出城尽臣节与居家全孝道之两难
  lesson: 明王法须恩威并著，抚定重镇不可贪功屠城，权达济变而守臣节
  summary_first_person: 吾为大同分巡佥事，值李瑾被戕，阖城汹汹，总制欲屠城立威，吾兼程入城廉得首恶，缚献渠魁，又三入城开谕，夜伏击破洗城讹言，分疏止兵，忤刘源清而被劾去官，终得复职致仕，著云中纪变以存其实
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E4%BA%91%E4%B8%AD%E7%BA%AA%E5%8F%98.html
