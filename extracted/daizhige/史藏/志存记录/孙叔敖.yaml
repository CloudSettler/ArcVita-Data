  summary_first_person: 我是楚国期思鄙人孙叔敖，经虞丘子、沈尹筮举荐被庄王任为令尹。我施教导民、上下和合，改革币制使市肆复安，劝民高车而不强令。我虽执国法而不阿私，终身妻不衣帛、马不食粟，临终嘱子不受利地，唯请封寝丘，使后世累代不绝。
