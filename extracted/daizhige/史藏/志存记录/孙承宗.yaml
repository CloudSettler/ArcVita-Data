events:
- id: guji-孙承宗-event-birth
  date: 1563
  year_of: 1563
  title_zh: 孙承宗生
  description: 孙承宗生于北直隶高阳，字稚绳。自少喜仗剑走塞下，从材官老兵游，以故晓畅边事。
- id: guji-孙承宗-event-liaodong-command
  date: 1622
  year_of: 1622
  title_zh: 熹宗时督师辽东
  description: 孙承宗以大学士督师辽东，时袁应泰丧辽阳、王化贞丧广宁之后，承宗受命经略东陲。
  endeavor_id: guji-孙承宗-endeavor-1
- id: guji-孙承宗-event-ningyuan
  date: 1623
  year_of: 1623
  title_zh: 筑宁远重镇、数立边功
  description: 承宗以袁崇焕为监军，筑宁远为重镇，数立边功。
  endeavor_id: guji-孙承宗-endeavor-1
- id: guji-孙承宗-event-zhongxian-suspicion
  date: 1625
  year_of: 1625
  title_zh: 魏忠贤疑其以兵讨己
  description: 承宗入觐，魏忠贤疑其以兵讨己，比之于王敦、李怀光；使人侦之，则幞被载车中，从者赞画鹿善继而已，然忠贤意终不释。
  endeavor_id: guji-孙承宗-endeavor-1
- id: guji-孙承宗-event-first-dismissal
  date: 1626
  year_of: 1626
  title_zh: 遭阉党忌，承宗、崇焕皆罢
  description: 因魏忠贤疑忌不释，承宗自辽东罢归，袁崇焕亦同罢。
  endeavor_id: guji-孙承宗-endeavor-1
- id: guji-孙承宗-event-recall
  date: 1629
  year_of: 1629
  title_zh: 崇祯初起复督师
  description: 大清兵分道入龙井关至京师，承宗起大学士督师，赴京师勤王。
  endeavor_id: guji-孙承宗-endeavor-2
- id: guji-孙承宗-event-zudashou-return
  date: 1629
  year_of: 1629
  title_zh: 抚定祖大寿溃军
  description: 崇焕下狱，祖大寿恐，引兵遁去；承宗至京师，大寿以兵来归。
  endeavor_id: guji-孙承宗-endeavor-2
- id: guji-孙承宗-event-recover-luanzhou
  date: 1630
  year_of: 1630
  title_zh: 督师收复滦州、永平
  description: 承宗督师入滦州，再入永平，是役祖大寿功第一，承宗再镇辽东。
  endeavor_id: guji-孙承宗-endeavor-2
- id: guji-孙承宗-event-second-dismissal
  date: 1631
  year_of: 1631
  title_zh: 再镇辽东逾年而罢
  description: 崇祯四年，承宗自辽东罢归。承宗莫知所由罢，盖亦温体仁倾之矣。
  endeavor_id: guji-孙承宗-endeavor-2
- id: guji-孙承宗-event-death
  date: 1638
  year_of: 1638
  title_zh: 孙承宗卒
  description: 承宗罢归高阳后终老乡里，卒年崇祯十一年（1638），是年大清兵数入畿辅，高阳当其冲。
  endeavor_id: ''
