person:
  qid: guji-孙承宗
  name_zh: 孙承宗
  names:
    zh: 孙承宗
    en: Sun Chengzong
  lifespan:
    birth:
      date: 1563
      precision: year
      is_circa: true
      raw: 约1563年（嘉靖四十二年）
    death:
      date: 1638
      precision: year
      is_circa: false
      raw: 1638年（崇祯十一年，清兵破高阳，殉国）
  birth_date: 1563
  death_date: 1638
  era: 明末
  reign_ref: 明熹宗、明思宗（庄烈帝）
  archetype: 督师重臣·辽东统帅·正人
  dilemmas:
  - 边事重任与阉党魏忠贤之疑忌
  - 正人辅政而遭温体仁之党阴倾
  lesson: 深算老谋、晓畅边事，善用兵而不得竟其功，惜乎朝局倾轧
  summary_first_person: 吾孙承宗，字稚绳，高阳人也。铁面剑眉，须髯戟张，声如洪钟。自少喜仗剑走塞下，从材官老兵游，故晓畅边事。熹宗时督师辽东，以袁崇焕为监军，数立边功；为魏忠贤所疑，比之王敦、李怀光，遂罢。崇祯初再起督师，收祖大寿之兵，入滦州、复永平，再镇辽东；逾年又罢，盖亦体仁倾之。使庄烈帝常相吾与震孟，明之亡不亡，未可知也。
