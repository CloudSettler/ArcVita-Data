person:
  qid: guji-孙沔
  name_zh: 孙沔
  names:
    zh: 孙沔
    en: Sun Mian
  lifespan:
    birth:
      date: 0996
      precision: year
      is_circa: true
      raw: 约996年
    death:
      date: 1066
      precision: year
      is_circa: true
      raw: 约1066年（治平末）
  birth_date: 0996
  death_date: 1066
  era: 北宋
  reign_ref: 宋仁宗（皇祐年间）
  archetype: 文臣统兵的谋略型帅臣
  dilemmas:
  - 明知贼势未衰而朝中大臣以“张皇贼势”相沮，直言必触怒二府，缄默则误国
  - 身为安抚使而无宣抚使之权与军需应副，强行为之则败事受责
  - 密输计于狄青而令其行之于军中，让功取信以保将帅同心
  lesson: 有备方能言镇静，无备而示镇静乃危亡之本；成大事者须既敢直言力争，又能屈身下人以成其功。
  summary_first_person: 我本以枢密直学士自徐州徙帅秦，入辞之际，见举朝谓岭贼将微，独我以邕广宝货尽为贼据、亡命万余归之的事实面折圣听。朝廷虽诏止我行，终除我江南西路、荆湖南路安抚使。我知贼势方盛，屡争宣抚之权、兵万人马千骑之备，虽不得尽请，犹以虚声定湖南人心，备长刀大斧以制蛮牌捻枪之长，遣李定屯宾之如和关外保全桂象。及狄青至，我以三策料贼必出下计，请密输计于太尉而自居其后，归仁铺一战，刀斧斫牌、奇兵出山背，遂破侬智高。事后我留邕善后，番休戍兵、筑归仁门、置博易务，全活胁从者数千百人。人谓文臣罕有躬预战伐成功名者，我能善为兵而身下狄，斯亦足录以示世矣。
  source_urls:
  - https://zh.wikisource.org/wiki/征南录
endeavors:
- id: guji-孙沔-endeavor-1
  name_zh: 经略岭南、平定侬智高之乱
  phases:
  - key: brewing
    name_zh: 受命入对、力陈贼势
    labels:
      zh:
      - 面折圣听
      - 诏除安抚
    start_date: 1052-08
    highlight_event_id: guji-孙沔-event-duice
  - key: breakthrough
    name_zh: 鼎州备战胜之具
    labels:
      zh:
      - 加安抚广南东西路
      - 制蛮牌捻枪之长
    start_date: 1052-09
    highlight_event_id: guji-孙沔-event-beizhan
  - key: climax
    name_zh: 归仁铺决战破贼
    labels:
      zh:
      - 密输三策
      - 刀斧破牌
    start_date: 1053-01
    highlight_event_id: guji-孙沔-event-guirenpuzhan
  - key: closure
    name_zh: 留邕善后、抚集岭外
    labels:
      zh:
      - 番休戍兵
      - 筑归仁门
    start_date: 1053
    highlight_event_id: guji-孙沔-event-shanhou
  decisions:
  - date: 1052-08
    title_zh: 面奏贼势未衰，反对朝廷轻敌罢行
    rationale: 贼破邕州尽取广府宝货，亡命归之者万余人，官军未尝一胜，朝论所谓贼微者非告陛下以实。
  - date: 1052-09
    title_zh: 力乞宣抚使名与兵万人、马千骑、金帛称之
    rationale: 无素具而当盛贼势必败事，徒受责无益；贼去朝廷远，苟当用马，岂朝奏而暮得。
  - date: 1052-10
    title_zh: 先为虚声飞报荆湖南北，促诸郡多建营垒
    rationale: 虑贼入湖南，以大兵即至之声定人心，使贼不敢过岭。
  - date: 1052-10
    title_zh: 遣裨将李定先屯宾之如和关外，戒其妄出战者斩一家
    rationale: 虑朝廷所遣兵为人所使、贪功败事；后他兵果败，宾象由是得完。
  - date: 1052-12
    title_zh: 与狄青定密议之约，以三策料贼必出下计
    rationale: 骄兵必出，出则必败；请密输计于太尉而由其行之于军中，无二令，不取美名以固二公之心。
  - date: 1053-01
    title_zh: 战前申命诸校各有队伍，战后力主赏军、宽治胁从
    rationale: 兵行部曲不相属，卒遇贼无以支；士卒冒万里险瘴立功不赏恐有变；胁从者不可尽诛，当先诘其端。
- id: guji-孙沔-endeavor-2
  name_zh: 历帅州郡、晚入枢府
  phases:
  - key: brewing
    name_zh: 历任州帅、声闻于朝
    labels:
      zh:
      - 枢密直学士
      - 自徐州徙帅秦
    start_date: 1052-07
    highlight_event_id: guji-孙沔-event-qianyishuaiqin
  - key: climax
    name_zh: 平南功高、擢枢密副使
    labels:
      zh:
      - 恳避再三
      - 昂然有古名臣之风
    start_date: 1053
    highlight_event_id: guji-孙沔-event-shumifushi
  decisions:
  - date: 1053
    title_zh: 屡乞致仕、累乞守杭以避宠名
    rationale: 昔有谮其张皇贼势、事成邀赏者，故先以求致仕自明；及平南，大臣惭其前言、害其宠名，遂恳避枢府之命再三。
  - date: 1053
    title_zh: 表请洪、谭蓄重兵给岭外，约民因贼科徭鬻子者一年折券
    rationale: 筑城抚集亡民散卒，置博易务通诸蛮有无，使因贼沦为奴婢者得复为民。
events:
- id: guji-孙沔-event-birth
  year_of: 0996
  date: 0996
  precision: year
  is_circa: true
  title_zh: 孙沔生
  summary_zh: 孙沔约生于此年，越州会稽人，后以文臣善为兵知名。
- id: guji-孙沔-event-qianyishuaiqin
  year_of: 1052
  date: 1052-07
  precision: month
  title_zh: 枢密直学士孙沔自徐州徙帅秦，请觐京师
  summary_zh: 皇祐四年七月，侬智高破九州围广州，孙沔自徐州移帅秦州，请赴京师入见。
- id: guji-孙沔-event-duice
  year_of: 1052
  date: 1052-08
  precision: month
  title_zh: 入辞面折圣听，力言贼势未衰
  summary_zh: 八月庚辰告辞将西，上谓岭贼其微；孙沔以贼尽取广府宝货、亡命归之万余、官军未尝胜对，上惊，越五日复令陛见，寻诏除江南西路、荆湖南路安抚使。
- id: guji-孙沔-event-zhengbing
  year_of: 1052
  date: 1052-09
  precision: month
  title_zh: 乞宣抚使及兵万人不获，促行仅得兵七百
  summary_zh: 与执政诘难数端，乞兵万人、马千骑、裨校文籍指顾之属，终为大臣所沮，才得人马军七百、文臣四人，安抚池、江、饶、太平四州。
- id: guji-孙沔-event-dingzhou
  year_of: 1052
  date: 1052-09
  precision: month
  is_circa: true
  title_zh: 行至鼎州，加安抚广南东西路
  summary_zh: 九月甲辰行至鼎州，加安抚广南东西路，遂留长沙一月，朝夕不怠思制胜之具。
- id: guji-孙沔-event-liding
  year_of: 1052
  date: 1052-10
  precision: month
  is_circa: true
  title_zh: 遣李定先屯宾之如和关外
  summary_zh: 遣善战斗之裨将李定先屯宾象之间，戒其妄出战者斩一家；后桂帅果使之战，定不听，他兵果败，宾象由是得完。
- id: guji-孙沔-event-beizhan
  year_of: 1052
  date: 1052-11
  precision: month
  is_circa: true
  title_zh: 集军费百万，多备长刀大斧以制蛮牌捻枪
  summary_zh: 十一月集钱帛百万军费，针对贼长技蛮牌捻枪多备长刀大斧，兼备南方瘴疠燥湿之具。
- id: guji-孙沔-event-sance
  year_of: 1052
  date: 1052-12
  precision: month
  title_zh: 与狄青密定三策，料贼必出下计
  summary_zh: 十二月狄青过岭南，孙沔以三策料贼——上计归巢、中计守邕、下计求战——度其骄兵必出下计，请密输计于太尉、由其行于军中，狄青大喜。
- id: guji-孙沔-event-guirenpuzhan
  year_of: 1053
  date: 1053-01
  precision: month
  is_circa: true
  title_zh: 归仁铺之战大破侬智高
  summary_zh: 皇祐五年正月大军四万人出昆仑关，宿朝天驿，孙沔申命诸校各有队伍；明日遇贼于归仁铺，孙节争地形战死，官军用孙沔所备刀斧斫牌枪，奇兵三百骑出山背突其后，杀伤数千，贼遂遁保邕州。
- id: guji-孙沔-event-yehu
  year_of: 1053
  date: 1053-01
  precision: month
  is_circa: true
  title_zh: 下令禁夜呼，贼疑空壁而遁
  summary_zh: 孙沔料军中怯者虚声相连，下令夜有呼叫者斩，漏二鼓他寨果惊呼，贼以为大军至遂空壁去，独孙沔所部无一人动者。
- id: guji-孙沔-event-shanhou
  year_of: 1053
  date: 1053
  precision: year
  title_zh: 留邕善后：番休戍兵、筑归仁门、置博易务
  summary_zh: 狄青还京，孙沔留邕计事；改旧戍兵三岁一易、瘴死十常七八之制为本道择善地番休、留邕一岁，新作北门号归仁门使向阙，筑城抚集亡民散卒，置博易务通诸蛮有无，全活胁从者数千百人。
- id: guji-孙沔-event-shumifushi
  year_of: 1053
  date: 1053
  precision: year
  is_circa: true
  title_zh: 累乞守杭不获，擢枢密副使
  summary_zh: 平南后狄青厚赏而孙沔止与余靖加秩一等；上闻其求致仕，执政愕然无以对；孙沔累乞杭州，行至南都，诏擢枢密副使，恳避再三不获已而受命，领机务昂然有古名臣之风。
- id: guji-孙沔-event-death
  year_of: 1066
  date: 1066
  precision: year
  is_circa: true
  title_zh: 孙沔卒
  summary_zh: 孙沔约卒于此年，征南之功与其古名臣之风并传于世。
