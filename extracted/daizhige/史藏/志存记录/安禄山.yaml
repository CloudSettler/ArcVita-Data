person:
  qid: guji-安禄山
  name_zh: 安禄山
  names:
    zh: 安禄山
    en: An Lushan
  lifespan:
    birth:
      date: 703-01-01
      precision: year
      is_circa: true
      raw: 小名轧荦山，天宝十载正月初一生辰（生年史无明文，姑系于703年前后）
    death:
      date: 757-01-29
      precision: day
      is_circa: true
  birth_date: 703-01-01
  death_date: 757-01-29
  era: 唐
  reign_ref: 唐玄宗（开元、天宝）
  archetype: 蕃将枭雄·叛臣
  dilemmas:
  - 免死之恩与日后祸心：张九龄力请诛之，玄宗惜勇免死，埋下幽燕之乱
  - 蕃将身份与朝堂攀附：以谄媚邀宠、请为贵妃养儿换取三镇兵权
  - 忠臣之表与逆节之实：外示御寇筑雄武城，内贮兵器养曳落河
  lesson: 恩宠极盛处往往藏祸根，识人于未萌者寡，纵奸于既长者众
  summary_first_person: 我本是营州杂胡，小名轧荦山，解九蕃语，起于互市牙郎。因一句"大夫不欲灭奚、契丹两蕃耶"得张守珪赏识，养为假子。此后三十余年，我以勇略与谄佞并进，位兼平卢、范阳、河东三镇，封东平郡王，贵极人臣。然而恩宠愈深，祸心愈炽，终以十五万之众反于范阳，僭号大燕，搅动天下。
