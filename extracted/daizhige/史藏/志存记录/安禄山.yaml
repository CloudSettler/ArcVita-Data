events:
- id: guji-安禄山-event-birth
  date: 703-01-01
  year_of: 703
  title_zh: 出生于营州
  detail: 营州杂种胡，小名轧荦山，母阿史德氏为突厥巫，祷轧荦山斗战神而生
- id: guji-安禄山-event-733-prophecy
  date: 733-01-01
  year_of: 733
  title_zh: 张九龄预言乱幽州者必此胡
  detail: 开元二十一年，守珪令禄山奏事，张九龄见之，谓裴光庭曰："乱幽州者，必此胡也"
- id: guji-安禄山-event-736-pardon
  date: 736-01-01
  year_of: 736
  title_zh: 讨契丹失利，玄宗免其死罪
  detail: 开元二十四年讨契丹失利，守珪奏请斩之，张九龄批请依军法，玄宗惜其勇锐但令免官，白衣展效
- id: guji-安禄山-event-741-pinglu
  date: 741-03-09
  year_of: 741
  title_zh: 授营州都督、充平卢军节度使
  detail: 开元二十九年，谄事河北采访使张利贞，利贞归朝盛称其美，遂授营州都督、平卢节度使
- id: guji-安禄山-event-744-fanyang
  date: 744-03-01
  year_of: 744
  title_zh: 充范阳节度、河北采访使
  detail: 天宝三载三月，授范阳长史，充范阳节度、河北采访使，平卢节度如故
- id: guji-安禄山-event-748-tiejuan
  date: 748-06-01
  year_of: 748
  title_zh: 赐铁券，封柳城郡开国公
  detail: 天宝七载六月，赐实封三百户并铁券，进封柳城郡开国公，又加赠其父魏郡太守
- id: guji-安禄山-event-750-wang
  date: 750-01-01
  year_of: 750
  title_zh: 进封东平郡王
  detail: 唐将帅封王自此始，制称其声威振于绝漠，捍御比于长城
- id: guji-安禄山-event-751-hedong
  date: 751-02-02
  year_of: 751
  title_zh: 兼河东节度使
  detail: 天宝十载二月二日，加云中太守兼充河东节度采访使，遂身兼平卢、范阳、河东三镇
- id: guji-安禄山-event-755-revolt
  date: 755-12-16
  year_of: 755
  title_zh: 起兵范阳，安史之乱爆发
  detail: 天宝十四载十一月，以忧国之危、奉密诏讨杨国忠为名，发兵十五万反于范阳
- id: guji-安禄山-event-756-emperor
  date: 756-02-05
  year_of: 756
  title_zh: 僭号称帝，国号大燕
  detail: 天宝十五载正月初一，于洛阳称雄武皇帝，国号大燕，建元圣武
- id: guji-安禄山-event-death
  date: 757-01-29
  year_of: 757
  title_zh: 为其子安庆绪所弑
  detail: 至德二载正月，因目疾暴厉，其子安庆绪与严庄、宦官李猪儿合谋弑之，是身死于逆节之报
