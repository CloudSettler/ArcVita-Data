    title_zh: 以讨杨国忠为名起兵范阳
    rationale: 虑玄宗年高国中事变，兼衔不拜太子之嫌，遂发所部及同罗、奚、契丹兵十五万反
  - date: 756-02-05
    title_zh: 僭位于洛阳
