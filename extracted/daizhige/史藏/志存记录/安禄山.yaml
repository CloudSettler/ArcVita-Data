    rationale: 大呼"大夫不欲灭奚、契丹两蕃耶"，以壮士自许，得张守珪奇而释之
  - date: 741-01-01
    title_zh: 曲事张利贞以邀节钺
    rationale: 以金帛结河北采访使左右，利贞归朝盛称其美，遂授营州都督、平卢节度使
  - date: 750-01-01
    title_zh: 请为贵妃养儿
    rationale: 以蕃人先母后父为辞，先拜太真，固玄宗与贵妃之宠
