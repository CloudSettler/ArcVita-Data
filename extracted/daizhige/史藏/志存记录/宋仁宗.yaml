events:
- id: guji-赵祯-event-birth
  date: 1010
  year_of: 1010
  event_type: birth
  description_zh: 仁皇帝诞降，章懿后榻下生灵芝一本四十二叶，以应享国四十二年之瑞
- id: guji-赵祯-event-accession
  date: 1022
  year_of: 1022
  event_type: milestone
  description_zh: 乾兴元年即皇帝位，在位四十二年
- id: guji-赵祯-event-lesson-1
  date: 1041
  year_of: 1041
  event_type: career
  description_zh: 庆历中亲除王素、欧阳修、蔡襄、余靖为谏官，风采天下
- id: guji-赵祯-event-lesson-2
  date: 1045
  year_of: 1045
  event_type: career
  description_zh: 王素谏王德用进女口事，帝赐所进女口钱各三百千押出内东门，讫奏泣下
- id: guji-赵祯-event-lesson-3
  date: 1057
  year_of: 1057
  event_type: career
  description_zh: 韩绛奏刘献可书多斥大臣过失，帝曰不欲留人过失于心中，持归焚之
- id: guji-赵祯-event-lesson-4
  date: 1044
  year_of: 1044
  event_type: career
  description_zh: 从王素之谏祷雨西太乙宫，殿庭雨立百拜，焚生龙脑香十七斤，举体尽湿而得雨
- id: guji-赵祯-event-lesson-5
  date: 1046
  year_of: 1046
  event_type: career
  description_zh: 内宴新蟹一枚值一千钱，帝斥侈靡，一箸为钱二十八千不忍食，置不食
- id: guji-赵祯-event-lesson-6
  date: 1057
  year_of: 1057
  event_type: career
  description_zh: 嘉祐二年北虏求御容，帝曰吾待虏厚必不然，遣张昉遗之，虏主一见惊肃再拜，称真圣主
- id: guji-赵祯-event-lesson-7
  date: 1062
  year_of: 1062
  event_type: career
  description_zh: 嘉祐七年两幸天章阁，召两府观三朝御书及瑞物，置酒赋诗群玉殿，独召韩琦酌鹿胎酒
- id: guji-赵祯-event-death
  date: 1063
  year_of: 1063
  event_type: death
  description_zh: 嘉祐八年三月升遐，契丹燕境之人无远近皆聚哭，虏主号恸曰四十二年不识兵革矣
