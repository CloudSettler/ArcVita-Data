person:
  qid: guji-赵祯
  name_zh: 宋仁宗（赵祯）
  names:
    zh: 宋仁宗（赵祯）、仁皇帝
    en: Emperor Renzong of Song (Zhao Zhen)
  lifespan:
    birth:
      date: 1010
      precision: year
      is_circa: false
      raw: 大中祥符三年生
    death:
      date: 1063
      precision: year
      is_circa: false
      raw: 嘉祐八年三月帝升遐
  birth_date: 1010
  death_date: 1063
  era: 北宋
  reign_ref: 乾兴元年（1022）即位，在位四十二年，享国四十二年
  archetype: 仁厚宽简之君
  dilemmas:
  - 谏官直言触怒于己，是逞威还是纳谏
  - 亲眷（燕恭肃王）多取金钱，是徇私还是守御史之议
  - 君权与大臣之权如何平衡，恐己断有失而害及百姓
  lesson: 以宽容纳谏、体恤民生为本，虽酒酣嫔御在列亦不忘四民，故独得“仁”谥
  summary_first_person: 我以仁恕治国，四时不御炉扇，一箸二十八千之蟹亦不忍食；谏官面折，我常耳赤而终纳之；不以己意压外庭公议，恐奉行害民。北虏求我御容，一见惊肃再拜，称真圣主。我崩之日，燕境之人无远近皆聚哭，虏主号恸曰：四十二年不识兵革矣。
  source_urls:
  - https://zh.wikisource.org/wiki/邵氏聞見後錄
