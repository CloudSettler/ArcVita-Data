person:
  qid: guji-songtaizu
  name_zh: 宋太祖
  names:
    zh: 宋太祖
    en: Emperor Taizu of Song
  lifespan:
    birth:
      date: '927'
      precision: year
      is_circa: false
      raw: 微时生年不详，一般系于后唐天成二年
    death:
      date: '976'
      precision: year
  birth_date: '927'
  death_date: '976'
  era: 五代末至北宋初
  reign_ref: 建隆、乾德、开宝
  archetype: 开国之君
  dilemmas:
  - 身居将位而人心归附，代周自立是否为义
  - 功臣手握重兵，收权则恐伤恩义
  lesson: 杯酒释兵权，以宽仁驾驭英雄，重惜名器爵位
  summary_first_person: 我起于微时，受周世宗知遇，屡建战功；陈桥受禅，定万世之基。我以杯酒释兵权，收藩镇之权，制钱谷、收精兵，使天下息兵，又重惜爵位、善待功臣，故宋室得以安平。
  source_urls:
  - https://zh.wikisource.org/wiki/邵氏闻见前录
endeavors:
- id: guji-songtaizu-endeavor-1
  name_zh: 初入仕途与受知于世宗
  phases:
