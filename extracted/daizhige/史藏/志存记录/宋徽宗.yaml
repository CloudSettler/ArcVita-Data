    highlight_event_id: guji-宋徽宗-event-chujiao
  - key: breakthrough
    name_zh: 闻张邦昌僭位，知吾事决矣
    labels:
      zh:
      - 泣下沾襟
    start_date: '1127-04-19'
    highlight_event_id: guji-宋徽宗-event-bangchang
  - key: climax
    name_zh: 北狩启程，辞违宗庙
    labels:
      zh:
      - 望城拜辞
      - 分路刘家寺
    start_date: '1127-05-13'
    highlight_event_id: guji-宋徽宗-event-beishou
  - key: closure
    name_zh: 拆领密书，遣曹勋寻康王
    labels:
      zh:
      - 可便即真
      - 速救父母
    start_date: 1127-05
    highlight_event_id: guji-宋徽宗-event-mixin
  decisions:
  - date: '1127-03-21'
    title_zh: 应金人之请出郊赴南薰门
    rationale: 以金人许"表到寨中，皇帝便可归内"，谓"若以我为质，得官家归保宗社，亦无辞"
  - date: 1127-04
    title_zh: 自制札子，愿以身代嗣子远朝金庭
    rationale: 自承海上之盟、失义方之训之咎，乞令嗣子等得一广南小郡以奉祖宗遗祀
  - date: 1127-05
    title_zh: 密书御衣领付曹勋，赍归康王
    rationale: 写"可便即真，来救父母"九字并金环为验，嘱速清中原、保守宗庙、洗雪积愤
events:
- id: guji-宋徽宗-event-birth
  date: '1082-11-02'
  year_of: 1082
  name_zh: 宋徽宗赵佶出生
  description: 神宗之子，襁褓时昼卧屋栋中折欲堕复续，乳媪抱起，梁堕卧榻之上。
  type: birth
- id: guji-宋徽宗-event-neishan
  date: 1125-12
  year_of: 1125
  name_zh: 内禅传位，逊位称太上皇帝
  description: 金兵南下，徽宗禅位嗣子（钦宗），避罪南下，归后退处道宫，不预朝政。
  type: political
  endeavor_id: guji-宋徽宗-endeavor-1
- id: guji-宋徽宗-event-zhangjue
  date: '1120'
  year_of: 1120
  name_zh: 纳降张珏，后斩首献金
  description: 收招张珏，继因金人须索斩珏缄首以献，金人指以为衅，成为南侵口实。
  type: political
  endeavor_id: guji-宋徽宗-endeavor-1
- id: guji-宋徽宗-event-chengpo
  date: '1127'
  year_of: 1127
  name_zh: 靖康城破，围城时不令知
  description: 城破国亡，祸变及身；徽宗自言围城时朝廷聋瞽之，不令知以至于此。
  type: war
  endeavor_id: guji-宋徽宗-endeavor-1
- id: guji-宋徽宗-event-fenbiao
  date: 1127-03
  year_of: 1127
  name_zh: 自制奏表，深夜焚之
  description: 于金寨自即位、逊位以来宫禁深密、朝廷政事之失，一一剖析，深夜焚表。
  type: political
  endeavor_id: guji-宋徽宗-endeavor-1
- id: guji-宋徽宗-event-chujiao
  date: '1127-03-21'
  year_of: 1127
  name_zh: 出郊赴南薰门，被金人围掩车舆
  description: 靖康二年二月初七，徽宗携显肃皇后出延福宫赴南薰门，双扉俱启，导从围掩车舆出门，徽宗顿足曰"事果变矣"，佩刀为金人搜去，止于南郊斋宫。
  type: war
  endeavor_id: guji-宋徽宗-endeavor-2
- id: guji-宋徽宗-event-bangchang
  date: '1127-04-19'
  year_of: 1127
  name_zh: 闻张邦昌僭位，泣下沾襟
  description: 靖康二年三月初七，闻张邦昌僭立，徽宗曰"既立异姓，则吾事决矣"，因泣下沾襟。
  type: political
  endeavor_id: guji-宋徽宗-endeavor-2
- id: guji-宋徽宗-event-beishou
  date: '1127-05-13'
  year_of: 1127
  name_zh: 北狩启程，望城拜辞宗庙
  description: 四月初一与渊圣分路由河北路启程北狩；前一日率二后、诸王、妃嫔、帝姬望城拜辞宗庙，伏地气塞不能起，六宫皆哭。
  type: exile
  endeavor_id: guji-宋徽宗-endeavor-2
- id: guji-宋徽宗-event-yaowang
  date: 1127-05
  year_of: 1127
  name_zh: 燕王薨于途，徽宗伏其骨哀甚
  description: 燕王以途中乏食薨，殓以马槽就寨外焚化，徽宗止之，至晚伏其骨哀甚，曰"吾行，且相及"。
  type: family
  endeavor_id: guji-宋徽宗-endeavor-2
- id: guji-宋徽宗-event-mixin
  date: 1127-05
  year_of: 1127
  name_zh: 拆御衣领密书付曹勋
  description: 过河数日后，拆御衣领写字"可便即真，来救父母"九字，并懿节皇后金环为验、白纱手帕传思念之意，付曹勋伺便冒围而出，寻康王速清中原。
  type: secret
  endeavor_id: guji-宋徽宗-endeavor-2
- id: guji-宋徽宗-event-death
  date: '1135'
  year_of: 1135
  name_zh: 徽宗崩
  description: 北狩之后，据传绍兴五年崩于五国城（本文所录止于北狩途中情事）。
  type: death
