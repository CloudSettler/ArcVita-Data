person:
  qid: guji-宋徽宗
  name_zh: 宋徽宗
  names:
    zh: 宋徽宗（赵佶）
    en: Emperor Huizong of Song (Zhao Ji)
  lifespan:
    birth:
      date: '1082-11-02'
      precision: day
      is_circa: false
      raw: 元丰五年十月丁巳
    death:
      date: '1135'
      precision: year
      is_circa: true
      raw: 绍兴五年，崩于五国城（据传）
  birth_date: '1082-11-02'
  death_date: '1135'
  era: 北宋
  reign_ref: 建中靖国至宣和（1100—1126在位），靖康元年内禅，称太上皇帝
  archetype: 艺术家皇帝·亡国之君
  dilemmas:
  - 出郊赴金营以己为质，换取嗣子（钦宗）归内保宗社，还是拒不移足防金人诈伪
  - 身陷北虏，是苟全以图后计，还是以一身代嗣子仰答天谴
  - 悔恨退位后不预朝政、反遭祸变，与寄望康王中兴、速救父母之间的两难
  lesson: 揖逊如礼、退处道宫并不能免祸；为君者当明察事机、慎用人，否则城破国亡，虽圣艺高才亦沦为囚虏。
  summary_first_person: 我赵佶，以神宗之子入承大统，在位二十余年，雅好艺文，笃信道教。金人败盟南下，我禅位嗣子，退处道宫，自谓不预朝政。靖康城破，金人坚请我出郊，我以身为质，冀全宗社；既而张邦昌僭立，我与嗣子俱被驱北狩，父子分离，妃嫔帝姬随行八百余车。途中我自咎海上之盟、三关败约之失，愿以身代嗣子远朝金庭而不得。过河之后，我拆御衣领密书"可便即真，来救父母"，付曹勋赍归康王，嘱其速清中原、保守宗庙。北行跋涉荒迥，眼见燕王殁于途、旧臣郭药师泣拜马前，唯余悔恨——当日欠一死耳。闻我后崩于五国城，魂寄故国。
  source_urls:
  - https://zh.wikisource.org/wiki/北狩见闻录
endeavors:
