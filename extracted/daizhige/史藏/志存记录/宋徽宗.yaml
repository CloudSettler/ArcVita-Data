  decisions:
  - date: 1125-12
    title_zh: 内禅传位钦宗，退处道宫
    rationale: 金兵南下，逊位避罪，自谓"块处道宫，恬养魂魄，未尝干与朝政"
  - date: '1120'
    title_zh: 纳降张珏并斩首献金
    rationale: 山西军前移文要珏，即斩首以献，不意金人指以为衅，成大兵南来之口实
- id: guji-宋徽宗-endeavor-2
  name_zh: 北狩途中以身请代与密图中兴
  phases:
  - key: brewing
    name_zh: 应召出郊，以身为质
    labels:
      zh:
      - 南薰门拜表
      - 乞皇帝归内
