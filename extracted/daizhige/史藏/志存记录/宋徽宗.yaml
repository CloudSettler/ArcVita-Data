    start_date: '1120'
    highlight_event_id: guji-宋徽宗-event-zhangjue
  - key: breakthrough
    name_zh: 金兵南下，内禅嗣子
    labels:
      zh:
      - 逊位
      - 避罪南下
    start_date: 1125-12
    highlight_event_id: guji-宋徽宗-event-neishan
  - key: climax
    name_zh: 城破国亡，祸变及身
    labels:
