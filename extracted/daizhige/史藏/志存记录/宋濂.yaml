  summary_first_person: 吾以文学承宠渥最久侍太子诸王讲读既老致仕归里每万寿来贺登文楼踬足蒙上怜老劝勿复来来岁阻风愆期又与乡人饮酒赋诗遂罹赐死之诏赖孝慈素食祈福得赦后孙慎获罪复连吾远谪四川寄寺与老衲论善恶之报终自经以终
