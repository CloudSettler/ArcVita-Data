  birth_date: '1068'
  death_date: '1123'
  era: 辽末金初
  reign_ref: 金太祖，谥大圣武元皇帝
  archetype: 开国之君
  dilemmas:
  - 以千骑之众起兵抗辽，众寡悬殊，战或降皆悬于一线
  - 辽道宗恕其拔刀之罪纵归，后起兵灭辽，恩义与兴亡相悖
  lesson: 众寡不在兵而在势，势不在力而在人心之愤与将帅之决。
  summary_first_person: 我是完颜阿骨打，世祖第二子，生于咸雍四年戊申。昔年随悟室入朝于辽，因双陆忿争拔刀欲剚辽贵，道宗以示信远人不忍杀我。后因辽使索求无度、海东青之扰，女真积怨，我以千骑起兵，借五百甲首破宁江州，连挫辽师数十万众，兵锋直入黄龙府五十余州。天祚欲封我为王，我遣使邀十事，欲为兄弟之国并尚其主之女，其怒而囚使。辽祚遂倾，我谥大圣武元皇帝，庙号太祖，弟吴乞买继立为太宗。
  source_urls:
  - https://zh.wikipedia.org/wiki/完颜阿骨打
