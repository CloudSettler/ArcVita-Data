  decisions:
  - date: 1114-09
    title_zh: 决意起兵，以五百甲首攻破宁江州
    rationale: 辽之银牌天使恃势强索妇人、强取方物，女真积忿；兼得叛辽辽亲甲首五百，遂以千骑首义。
  - date: '1115'
    title_zh: 采纳粘罕、悟室、娄宿之议，以死拒辽不降
    rationale: 我杀辽人已多，降必见剿，胜兵虽止三千，惟死战可求一生。
  - date: '1120'
    title_zh: 留辽使而遣使邀十事，请册为兄弟之国并尚主
    rationale: 天祚遣使立我为国王，我欲以对等之礼定国体，不居其册封之下。
events:
- id: guji-完颜阿骨打-event-birth
  date: '1068'
  year_of: 1068
  type: birth
  title_zh: 生于咸雍四年戊申
  detail_zh: 女真世祖核里颇之孙、世祖第二子旻生，即完颜阿骨打。
- id: guji-完颜阿骨打-event-court-blade
  date: '1100'
  is_circa: true
  year_of: 1100
  type: endeavor
  endeavor_id: guji-完颜阿骨打-endeavor-1
  phase_key: brewing
  title_zh: 道宗末年入朝，双陆忿争拔刀欲剚辽贵人
  detail_zh: 阿骨打以悟室从行，与辽贵人双陆，贵人投琼不胜妄行马，阿骨打愤甚拔小佩刀欲剚之，悟室握鞘仅止其柄而杙其胸。道宗以示信远人不听群臣诛杀之劝，纵之归国。
- id: guji-完颜阿骨打-event-ningjiang
  date: 1114-09
  is_circa: true
  year_of: 1114
  type: endeavor
  endeavor_id: guji-完颜阿骨打-endeavor-1
  phase_key: breakthrough
  title_zh: 起兵首破宁江州
  detail_zh: 女真才起千骑，用先前擒获叛辽辽亲所得甲首五百攻破宁江州；辽众五万御之不胜，复倍遣亦败。
- id: guji-完颜阿骨打-event-huanglongfu
  date: '1115'
  is_circa: true
  year_of: 1115
  type: endeavor
  endeavor_id: guji-完颜阿骨打-endeavor-1
  phase_key: climax
  title_zh: 以三千之众连败辽师，乘胜入黄龙府五十余州
  detail_zh: 胜兵仅三千，依粘罕、悟室、娄宿之议以死拒辽，连败辽师，器甲益备；辽内乱，余都姑以前军十万降，女真乘胜入黄龙府五十余州，浸逼中京。
- id: guji-完颜阿骨打-event-envoys
  date: '1120'
  is_circa: true
  year_of: 1120
  type: endeavor
  endeavor_id: guji-完颜阿骨打-endeavor-1
  phase_key: closure
  title_zh: 遣使邀十事，请为兄弟之国并尚主
  detail_zh: 天祚遣使立阿骨打为国王，阿骨打留之，遣人邀请十事，欲册帝为兄弟国及尚主；天祚怒曰小夷乃欲偶吾女，囚其使不报。
- id: guji-完颜阿骨打-event-death
  date: '1123'
  is_circa: true
  year_of: 1123
  type: death
  title_zh: 卒，谥大圣武元皇帝，庙号太祖
  detail_zh: 阿骨打且死，属其子固碖善待悟室。弟吴乞买继立，更名晟，谥文烈皇帝，号太宗。
