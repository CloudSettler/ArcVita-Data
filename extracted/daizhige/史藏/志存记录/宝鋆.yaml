person:
  qid: guji-baojun
  name_zh: 宝鋆
  names:
    zh: 宝鋆、宝文靖、佩蘅相国
    en: Baojun
  lifespan:
    birth:
      date: '1807'
      precision: year
      is_circa: true
      raw: 嘉庆年间生（文中仅言丁酉拔贡，生年约嘉庆十二年）
    death:
      date: '1891'
      precision: year
      is_circa: false
  birth_date: '1807'
  death_date: '1891'
  era: 清咸丰、同治、光绪年间
  reign_ref: 咸丰、同治、光绪三朝
  archetype: 中兴名臣·满洲枢辅
  dilemmas:
  - 根本与行在之争：力阻辇运京仓米石赴热河，触怒文宗几遭处斩
  - 城下之盟：英法联军议和时躬与其役，备受屈辱而隐忍成局
  - 枢廷进退：甲申之役朝士交章弹劾枢臣，与恭邸同日出军机
  lesson: 临危持重、处变不惊，荣辱之际以大局为怀，故能佐成中兴而以令名终。
  summary_first_person: 我宝鋆，号佩蘅，吉林人，官至大学士、军机大臣。英夷毁圆明园时，我奉旨往视列祖圣容，与崇礼泣焚残像以全国体；又力持京仓根本不可动摇，虽得旨处斩而不悔。辛酉后与恭忠亲王、文祥同心夹辅，蔚成中兴。甲申与同直诸公同出军机，休致后醇邸犹咨以大政。家居八年，红光满面而善终，蒙恩入祀贤良祠。
  source_urls:
  - https://zh.wikisource.org/wiki/春明梦录
endeavors:
- id: guji-baojun-endeavor-1
  name_zh: 枢廷辅政与同治中兴
  phases:
  - key: brewing
    name_zh: 户部持正犯颜
    labels:
      zh: 户部侍郎、力阻迁米
    start_date: '1859'
    highlight_event_id: guji-baojun-event-resist-grain
  - key: breakthrough
    name_zh: 辛酉受命入辅
    labels:
      zh: 署户部侍郎、军机大臣
    start_date: '1861'
    highlight_event_id: guji-baojun-event-assist-zhongxing
  - key: climax
    name_zh: 同心夹辅成中兴
    labels:
      zh: 与恭王、文祥共辅朝政
    start_date: '1865'
    highlight_event_id: guji-baojun-event-refuse-vest
  - key: closure
    name_zh: 甲申同日出军机
    labels:
      zh: 罢直军机、荣休
    start_date: '1884'
    highlight_event_id: guji-baojun-event-leave-junji
  decisions:
  - date: '1859'
    title_zh: 力持京仓米石不可辇运热河
    rationale: 根本重地不宜摇动，虽得旨处斩亦力持不可。
  - date: '1884'
    title_zh: 面对弹劾黯然退出军机
    rationale: 法越构衅，朝士归罪枢臣，交章弹劾，遂与同直诸公同罢。
- id: guji-baojun-endeavor-2
  name_zh: 护持圣容与议和周旋
  phases:
  - key: brewing
    name_zh: 奉旨视园
    labels:
      zh: 巡视圆明园圣容
    start_date: '1860'
    highlight_event_id: guji-baojun-event-burn-portraits
  - key: breakthrough
    name_zh: 与巴夏礼议和之役
    labels:
      zh: 城下乞盟
    start_date: '1860'
    highlight_event_id: guji-baojun-event-peace-banquet
  - key: climax
    name_zh: 洋务译署周旋
    labels:
      zh: 总理衙门经历
    start_date: '1861'
  - key: closure
    name_zh: 晚年追述感旧
    labels:
      zh: 与醇邸唱和感旧、口述掌故
    start_date: '1885'
  decisions:
  - date: '1860'
    title_zh: 采纳崇礼之议，将残破圣容就地焚化
    rationale: 检拾不能全，徒增国耻且益伤圣心，归之火化较为得体。
events:
- id: guji-baojun-event-birth
  type: birth
  date: '1807'
  year_of: 1807
  description: 宝鋆约生于嘉庆年间，后于道光丁酉（1837年）中拔贡。
- id: guji-baojun-event-resist-grain
  type: event
  date: '1859'
  year_of: 1859
  description: 咸丰之末文宗出狩热河，端华、肃顺欲辇京仓米输热河，宝鋆以根本不宜摇动力持不可，得旨着即处斩。
- id: guji-baojun-event-burn-portraits
  type: event
  date: '1860'
  year_of: 1860
  description: 洋兵毁圆明园后，宝鋆奉旨往视列祖列宗圣容，与奉宸苑苑丞崇礼奔驰十余里，见圣容散佚残破，泣而焚之，归以遍寻不见覆奏，自此重崇礼其人。
- id: guji-baojun-event-peace-banquet
  type: event
  date: '1860'
  year_of: 1860
  description: 英使巴夏礼入京议和，礼部设宴，宝鋆时为军机躬与其役，后与醇邸唱和感旧，诗有「剑戟如林免胄趋」之句，足见城下乞盟备受屈辱。
- id: guji-baojun-event-assist-zhongxing
  type: event
  date: '1861'
  year_of: 1861
  description: 文宗宾天、两宫垂帘后，宝鋆改以五品衔署户部侍郎，旋即大用，与恭忠亲王、文祥同心夹辅，蔚成同治中兴。
- id: guji-baojun-event-refuse-vest
  type: event
  date: '1873'
  year_of: 1873
  description: 兰州克复捷报至，穆宗召见军机各赏穿黄马褂，恭邸请假，宝鋆领班面奏固辞，谓军机大臣只承旨书谕不敢冒赏战功，卒未奉诏。
- id: guji-baojun-event-leave-junji
  type: event
  date: '1884'
  year_of: 1884
  description: 甲申法越之役，朝士交章弹劾枢臣失职，礼亲王出代恭邸领班，宝鋆与同直诸公同日出军机。
- id: guji-baojun-event-retirement
  type: event
  date: '1885'
  year_of: 1885
  description: 休致后醇邸遇有大政必相询问，时时馈送食物；尝分赠何刚德西山毛菰，味荤如鲍鱼。家居八年，时时与后进慨谈时局。
- id: guji-baojun-event-death
  type: death
  date: '1891'
  year_of: 1891
  description: 宝鋆家居八年后疾革，易箦时红光满面，洵为善终。薨后诏入祀京师贤良祠，进主之日恭邸先往看视祭器祭品以示厚意。
- id: guji-baojun-event-shrine
  type: event
  date: '1891'
  year_of: 1891
  description: 宝鋆薨，诏入祀京师贤良祠，诚为异数；何刚德获观进主盛典。
