    highlight_event_id: guji-宣若海-event-1
  - key: breakthrough
    name_zh: 武科及第
    labels:
      zh: 乙巳中武科
    start_date: '1605'
    highlight_event_id: guji-宣若海-event-2
  - key: climax
    name_zh: 备局郎与出使
    labels:
      zh: 奉使沈阳
    start_date: '1631'
    highlight_event_id: guji-宣若海-event-3
  - key: closure
    name_zh: 晚任节度使
    labels:
      zh: 终于庆尚水军节度使
    start_date: '1634'
    highlight_event_id: guji-宣若海-event-4
  decisions:
  - date: '1605'
    title_zh: 应父命改业武科
    rationale: 府使公以立身扬名、宜早为之、毋替家声相劝，遂业武并中乙巳科。
  - date: '1631-03-03'
    title_zh: 受命出使沈阳慰问
    rationale: 胡使道路被梗不得传国书，朝廷欲遣慰问使而难其人，我以文武备具、有专对才被选。
  - date: '1631'
    title_zh: 拒不受汗之馈银貂
    rationale: 国书尚不能受，反以无名之馈来，臣职在奉使，何劳之有。
- id: guji-宣若海-endeavor-2
  name_zh: 沈阳之辩与折冲
  phases:
  - key: breakthrough
    name_zh: 面折龙胡
    labels:
      zh: 与龙骨大诘辩
    start_date: '1631-03-22'
    highlight_event_id: guji-宣若海-event-3
  - key: climax
    name_zh: 与汗当面辩论
    labels:
      zh: 以义拒借兵
    start_date: 1631-05
    highlight_event_id: guji-宣若海-event-5
  - key: closure
    name_zh: 全节归国
    labels:
      zh: 龙胡五百骑卫送至义州
    start_date: 1631-06
    highlight_event_id: guji-宣若海-event-6
  decisions:
  - date: 1631-05
    title_zh: 面拒借兵之请
    rationale: 上国犹父子，贵国与我为与国；欲借我兵以犯我上国，决不可从。
  - date: 1631-05
    title_zh: 拒与降汉将相见
    rationale: 彼乃父母邦之人，然贪生忘义今为亡降奴，我何见为。
