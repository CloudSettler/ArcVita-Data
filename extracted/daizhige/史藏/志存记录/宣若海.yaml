person:
  qid: guji-宣若海
  name_zh: 宣若海
  names:
    zh: 宣若海
    en: Seon Yak-hae (Shen Ruo-hai)
  lifespan:
    birth:
      date: '1579'
      precision: year
      is_circa: false
      raw: 万历七年己卯
    death:
      date: 1643-05
      precision: month
      is_circa: false
      raw: 崇祯十六年癸未五月十日
  era: 明清之际 · 朝鲜宣祖—仁祖朝
  reign_ref: 朝鲜仁祖
  archetype: 忠节外交使臣
  dilemmas:
  - 借兵于清以犯母国明朝，宁死不从
  - 与清使当面诘辩岛中助粮事，恐激怒强邻
  - 奉使绝域，将老亲诀别，生死未卜
  lesson: 面对强权，以理折冲、以节自守，虽一介武臣亦能不辱使命。
  summary_first_person: 我本武人，遭亲丧十年不仕；丙寅之乱与胡变之际，奉命万里赴沈阳慰问，以片言折服强汗，拒借兵、明大义，卒全国书而归，加秩受赏，后终于水军节度使之职。
endeavors:
- id: guji-宣若海-endeavor-1
  name_zh: 早期武科与宦途
  phases:
  - key: brewing
    name_zh: 少年笃志
    labels:
