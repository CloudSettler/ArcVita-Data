  dilemmas:
  - 契丹入境河朔戒严时朝论二三、战和大计未决，力排众议劝帝亲征
  - 自奉豪奢而坦然处世，物论毁誉不一
  lesson: 临大事勇于任事、亲当矢石可振士气；虚心下士不论高卑方能收物望
  summary_first_person: 我是寇准，官至将相、历镇方面。契丹南下、河朔戒严之际，朝臣议论纷纭， 唯我力劝章圣皇帝亲幸澶渊以振士气。我条奏四事曲尽机要，宸衷遂决，銮舆顺利，敌兵北归，
    议者称我功烈第一。我虽性尚华侈，然虚心下士，遇同年过客虽州县小官亦展茵席叙礼， 且对边事有过必有防虞之虑。
  source_urls:
  - 珍席放谈（宋·高晦叟）卷上
