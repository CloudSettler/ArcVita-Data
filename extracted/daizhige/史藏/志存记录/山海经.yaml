  summary_first_person: 吾生于列国纷争之际，长于山川祭祀之间，遍历南山鹊首至西海流沙，记桂玉凤凰与九尾旋龟，述陆吾英招与西王母，成四十山万六千里之志，愿后人因吾而知天地广大异物众多
  source_urls:
