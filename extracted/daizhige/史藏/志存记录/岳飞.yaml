  era: 南宋
  reign_ref: 宋高宗绍兴年间
  archetype: 精忠报国的抗金名将
  dilemmas:
  - - 忠于君主与坚持北伐收复失土之间的张力
  - - 战功日隆而遭朝廷猜忌、被迫班师的两难
  - - 手握重兵却无意卷入和议政治的抉择
  lesson: 精忠殉国者未必见容于当世，然气节长存青史
  summary_first_person: 我岳飞行伍出身，以恢复中原为志，累建战功，官至枢密副使，然绍兴十一年因和议之局被解除兵柄，旋以莫须有之狱冤死，身后追封鄂王，谥武穆。
  source_urls:
  - https://zh.wikisource.org/wiki/梁溪漫志
