  birth_date: '1611-02-06'
  death_date: '1644-04-25'
  era: 明末
  reign_ref: 崇祯（1628—1644）
  archetype: 勤政多疑的亡国之君
  dilemmas:
  - 内忧流寇与外患后金两线作战，兵力财用两绌
  - 勤政求治与猜忌滥杀将帅之间的矛盾
  - 南迁避祸与天子守国门体统之间的抉择
  lesson: 勤政不能替代正确的用人与战略，猜忌与朝令夕改足以倾覆江山
  summary_first_person: 我朱由检以藩王入继大统，即位之初翦除魏忠贤阉党，宵衣旰食十七年，欲扶将倾之大厦；然性多疑而用人屡易，内有流寇燎原，外有建州逼关，终至甲申三月，李自成破京师，我自缢于煤山，以身殉社稷。
  source_urls:
  - https://zh.wikipedia.org/wiki/崇祯帝
  - https://ctext.org/library.pl?if=gb&res=5940
