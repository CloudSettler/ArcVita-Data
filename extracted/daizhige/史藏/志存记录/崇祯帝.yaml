    title_zh: 犹豫不决，终未南迁
    rationale: 李自成兵逼宣大，廷臣争持体统，我徘徊于守国门与避锋之间，坐失转移之机。
events:
- id: guji-崇祯帝-event-birth
  date: '1611-02-06'
  year_of: 1611
  type: birth
  title_zh: 崇祯帝朱由检生
  description_zh: 朱由检生于万历三十八年十二月二十四日，为光宗第五子，后封信王。
- id: guji-崇祯帝-event-enthronement
  date: '1627-10-02'
  year_of: 1627
  type: endeavor
  endeavor_id: guji-崇祯帝-endeavor-1
  title_zh: 即皇帝位于天启七年八月
  description_zh: 天启帝崩，无嗣，朱由检以兄终弟及入继大统，改明年为崇祯元年。
- id: guji-崇祯帝-event-purge-wei
  date: 1627-11
  year_of: 1627
  type: endeavor
  endeavor_id: guji-崇祯帝-endeavor-1
  title_zh: 贬魏忠贤凤阳守陵，阉党始溃
  description_zh: 即位数月后籍没权阉，魏忠贤道死，继而钦定逆案，朝政为之一新。
- id: guji-崇祯帝-event-execution-yuan
  date: '1630-09-22'
  year_of: 1630
  type: endeavor
  endeavor_id: guji-崇祯帝-endeavor-2
  title_zh: 磔杀督师袁崇焕
  description_zh: 后金兵入塞薄京师，我中反间之计，坐袁崇焕通敌之罪，磔于市，辽东长城自坏。
- id: guji-崇祯帝-event-fall-beijing
  date: '1644-04-24'
  year_of: 1644
  type: endeavor
  endeavor_id: guji-崇祯帝-endeavor-2
  title_zh: 李自成破京师
  description_zh: 崇祯十七年三月十八日夜，闯军攻入外城，外廷诸臣星散，社稷倾颓在即。
- id: guji-崇祯帝-event-suicide-meishan
  date: '1644-04-25'
  year_of: 1644
  type: death
  title_zh: 崇祯帝自缢于煤山
  description_zh: 三月十九日拂晓，我遗诏于衣襟，与太监王承恩登煤山自缢殉国，明亡。
