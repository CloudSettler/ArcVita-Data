endeavors:
- id: guji-崔鸣吾-endeavor-1
  title_zh: 嘉靖倭患海盐守御纪事
  summary: 自癸丑至丙辰，记演武场海舟、乍浦分道、汤克宽守盐五昼夜、卢镗孟家堰之败、柘林平徐海本末
  phases:
  - key: brewing
    name: 互市断绝酿祸
    labels:
      zh:
      - 私通溢出
      - 亡命稔乱
    start_date: '1553-04-02'
    highlight_event_id: guji-崔鸣吾-event-1553-defense
  - key: breakthrough
    name: 汤帅援盐抚民
    labels:
      zh:
      - 高公山擒贼
      - 士民欢呼
    start_date: '1553-04-25'
    highlight_event_id: guji-崔鸣吾-event-1553-defense
  - key: climax
    name: 五昼夜守孤城
    labels:
      zh:
      - 分垛协守
      - 矢集如雨
    start_date: '1553-05-04'
    highlight_event_id: guji-崔鸣吾-event-1553-defense
  - key: closure
    name: 柘林荡平录成
    labels:
      zh:
      - 招降王直
      - 火攻沈家庄
    start_date: '1556-07-29'
    highlight_event_id: guji-崔鸣吾-event-1553-defense
  decisions:
  - date: '1553-05-04'
    title_zh: 详记汤克宽守盐之力
    rationale: 盐以坚守得全而乍浦一夕即陷，恐功过颠倒，故直书以存公论
  - date: '1556-08-08'
    title_zh: 具录胡宗宪设间平海本末
    rationale: 城门尽闭邑里萧条数年，幸庙算荡平，当使后之司圉者知患豫防
- id: guji-崔鸣吾-endeavor-2
  title_zh: 海塘潮溢灾异备御记述
  summary: 记嘉靖戊申海虎、乙卯黑日、隆庆己巳飓风咸潮、万历乙亥塘圯溺死、老农淡咸养苗及彗星苗萤诸异
  phases:
  - key: brewing
    name: 海兽示异起疑
    labels:
      zh:
      - 海虎登岸
      - 报施不爽
    start_date: '1548-01-01'
    highlight_event_id: guji-崔鸣吾-event-1548-tiger
  - key: breakthrough
    name: 己巳风潮初变
    labels:
      zh:
      - 飓风咸潮
      - 土塘倾圮
    start_date: '1569-08-15'
    highlight_event_id: guji-崔鸣吾-event-1575-tide
  - key: climax
    name: 乙亥一夕圯尽
    labels:
      zh:
      - 烈风怒涛
      - 溺死数百
    start_date: '1575-05-30'
    highlight_event_id: guji-崔鸣吾-event-1575-tide
  - key: closure
    name: 记吴塘独存与农法
    labels:
      zh:
      - 吴允龙样塘
      - 夜车淡水养苗
    start_date: '1575-08-01'
    highlight_event_id: guji-崔鸣吾-event-1575-tide
  decisions:
  - date: '1575-06-01'
    title_zh: 核报灾数罪泄泄不奉命者
    rationale: 石塘十余里独吴塘巍然，圯有不尽者亦在人为，故以前车为后戒
  - date: '1575-08-01'
    title_zh: 访录老农车水之法
    rationale: 咸淡轻重得雨则凝，善养物者时不能厄，欲示济变之巧
events:
- id: guji-崔鸣吾-event-birth
  title_zh: 出生于海盐
  date: '1515'
  year_of: 1515
  description: 生于浙江海盐，僻在东南海上，长而目击潮汐兵燹，遂留心邑乘灾异
- id: guji-崔鸣吾-event-1548-tiger
  title_zh: 嘉靖戊申记海虎伤人
  date: '1548'
  year_of: 1548
  description: 虎从海上来匿刘侍御墓草间，陆尧击中其目被爪，褚仆利皮转石被噬，虎北走出境莫知所之
- id: guji-崔鸣吾-event-1553-defense
  title_zh: 癸丑夏记汤克宽守海盐
  date: '1553-04-02'
  year_of: 1553
  description: 海舟泊演武场北，王应麟进鞫遇倭，八大王流掠，汤克宽率邳兵复乍浦，五月四日率众守盐五昼夜不破，乍城一夕即陷
- id: guji-崔鸣吾-event-1575-tide
  title_zh: 万历乙亥记风潮圯塘
  date: '1575-05-30'
  year_of: 1575
  description: 五月三十夜烈风怒涛土石二塘圯尽，溺死无主官瘗者三百二十余人，倒屋四千余间，淹田五千余顷，惟吴允龙样塘独存
- id: guji-崔鸣吾-event-death
  title_zh: 万历后卒
  date: '1590'
  year_of: 1590
  description: 记彗星苗萤日食诸事成编后卒，遗崔鸣吾纪事传于海邑
