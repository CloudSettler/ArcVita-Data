person:
  qid: guji-zuoguangdou
  name_zh: 左光斗
  names:
    zh: 左光斗
    en: Zuo Guangdou
  lifespan:
    birth:
      date: '1575'
      precision: year
      is_circa: true
      raw: 明万历三年（1575年）
    death:
      date: '1625'
      precision: year
      is_circa: false
      raw: 明天启五年（1625年）
  birth_date: '1575'
  death_date: '1625'
  era: 明代晚期
  reign_ref: 万历、泰昌、天启
  archetype: 直言敢谏之东林御史
  dilemmas:
  - 直言弹劾权贵则招致阉党记恨，缄默自保则有负言官之责
  - 移宫定策功高震主，居功则疑于同列，退让则公论难明
  lesson: 当危疑之际，直道事君，虽以身殉而不悔
  summary_first_person: 吾左光斗，桐城人也。以御史直言敢谏著称，尝上移宫端疏以安圣躬，又纠劾阁臣孙如游之失礼。惜为魏忠贤阉党所忌，下狱拷掠而死，然直声留于天下。
  source_urls:
  - 明熹宗七年都察院实录
endeavors:
- id: guji-zuoguangdou-endeavor-1
  name_zh: 移宫定策
  labels:
    zh:
    - 定策安社稷
    - 直言敢谏
  phases:
  - key: brewing
    name_zh: 神宗、光宗之际察宫廷之变
    labels:
      zh:
      - 蓄势
    start_date: '1620'
  - key: breakthrough
    name_zh: 上移宫端疏促李选侍移宫
    labels:
      zh:
      - 移宫
