  - key: climax
    name_zh: 移宫功成而功罪之议纷纭
    labels:
      zh:
      - 功罪之辨
    start_date: 1621-01
  decisions:
  - date: 1620-09
    title_zh: 首上移宫端疏
    rationale: 先帝宾天，李选侍据干清宫不肯移，恐有干政之患，故毅然上疏促其移宫，以安圣躬
- id: guji-zuoguangdou-endeavor-2
  name_zh: 纠劾阁臣孙如游
  labels:
    zh:
    - 弹劾权贵
    - 纠劾失礼
  phases:
  - key: brewing
    name_zh: 察孙如游于孝端皇太后之丧不用请敕径用札付
    labels:
      zh:
      - 察失
    start_date: '1620'
  - key: breakthrough
    name_zh: 天启元年正月上疏紏阁臣孙如游
    labels:
      zh:
      - 上疏
    start_date: 1621-02
    highlight_event_id: guji-zuoguangdou-event-heju
  - key: closure
    name_zh: 疏入奉旨谕留孙如游，谏而不纳
    labels:
      zh:
      - 谏而不纳
    start_date: 1621-02
  decisions:
  - date: 1621-02
    title_zh: 疏紏孙如游进阁之失
    rationale: 孙如游于大丧之际不用请敕而用札付讣告中外，又夤夜进阁，名器之赏乖舛，故上疏纠之
events:
- id: guji-zuoguangdou-event-birth
  date: '1575'
  year_of: 1575
  name_zh: 左光斗生
  description_zh: 左光斗生于南直隶桐城，字遗直，后为东林名御史
- id: guji-zuoguangdou-event-yigong
  date: 1620-09
  year_of: 1620
  name_zh: 上移宫端疏
  description_zh: 泰昌帝宾天，左光斗以御史身份上移宫端疏，促李选侍移出干清宫，为移宫一案之要角；马逄皋疏中称"上移宫端疏者台臣左光斗也"
- id: guji-zuoguangdou-event-heju
  date: 1621-02
  year_of: 1621
  name_zh: 疏紏阁臣孙如游
  description_zh: 天启元年正月，浙江道御史左光斗疏紏阁臣孙如游，指其于孝端皇太后之丧不用请敕径用札付讣告中外，为典礼之罪人，不当以大礼而获进用；奉旨孙如游谕留已有旨
- id: guji-zuoguangdou-event-death
  date: '1625'
  year_of: 1625
  name_zh: 左光斗下狱死
  description_zh: 天启五年，左光斗为魏忠贤阉党构陷，与杨涟等同系诏狱，拷掠而死，天下惜之
- id: guji-zuoguangdou-event-legacy
  date: 1627-08
  year_of: 1627
  name_zh: 崇祯初昭雪
  description_zh: 崇祯帝即位后诛阉党，左光斗之冤得雪，追复官爵，直声传于后世
