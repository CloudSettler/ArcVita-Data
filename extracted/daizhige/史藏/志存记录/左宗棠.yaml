    title_zh: 督师西征，恃老湘营为干城
    rationale: 老湘一军号称无敌，刘松山父子相继，可托西事之重
  - date: 1878
    title_zh: 通饬台局营员用人秉公，虽官秩相等而自处卑下
    rationale: 意气甚盛而虚己求人，故英果敏辈派兵派饷无不立应，饷项支绌亦立予协济
  - date: 1884
    title_zh: 改建新疆行省，粗立其基
    rationale: 回孽将靖，欲求百年无事，须以郡县经制固边
