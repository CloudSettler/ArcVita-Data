      is_circa: false
      raw: 清光绪十一年七月二十七
  birth_date: 1812-11-10
  death_date: 1885-09-05
  era: 清
  reign_ref:
  - 咸丰
  - 同治
  - 光绪
  archetype: 中兴名臣·经世实干家
  dilemmas:
  - 以举人身份入幕专决，权倾一省而屡遭物议，樊燮互揭案几毁前程
  - 力荐叶兆兰而叶后聚敛失众心，欲劾之又碍荐主之谊，得曾国藩婉劝乃止
  - 西疆之役饷项支绌、回孽未尽而俄众相逼，独任其难以成百年之基
  lesson: 谋之于豫、持之以恒，一子落盘而全局胜负因之；受人重寄则尽心十年，啬苦自奉而用人至公。
  summary_first_person: 我以举人佐骆文忠幕府，事无大小专决不顾；后注重衢州、经略西疆，倚老湘营收西边全功，改建行省，粗立其基。律己啬苦，荐贤为务，知人善任。
  source_urls:
  - https://zh.wikisource.org/wiki/歸廬譚往錄
