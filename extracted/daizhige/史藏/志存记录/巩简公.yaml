endeavors:
- id: guji-巩简公-endeavor-1
  title_zh: 执掌朝政推行破格用人之改
  summary: 鉴于春秋内乱多因贵族权重而破格录用有才之寒士打破以血统论资排辈之旧制
  phases:
  - key: brewing
    name: 袭卿士家世而观内乱之弊
    labels:
      zh: 酝酿
    start_date: -0519-01-01
    highlight_event_id: guji-巩简公-event-reform
  - key: breakthrough
    name: 破血统之限而拔寒俊授事
    labels:
      zh: 突破
    start_date: -0515-01-01
    highlight_event_id: guji-巩简公-event-reform
  decisions:
  - date: -0515-01-01
    title_zh: 打破血统标准录用寒俊
    rationale: 贵族权重则内乱不止唯才是举方能安邦故不拘门第以才授官
  - date: -0512-01-01
    title_zh: 面对贵族诋毁威胁不改其志
    rationale: 改革利国利民虽损贵戚既得之利亦不可半途而废故坚守立场
- id: guji-巩简公-endeavor-2
  title_zh: 以身殉改开巩氏以邑为姓之脉
  summary: 遇害之后子孙感其志而以封地巩为氏奉为始祖使巩氏与周王同宗绵延不绝
  phases:
  - key: climax
    name: 遭贵戚忌恨而以身殉志
    labels:
      zh: 高潮
    start_date: -0492-01-01
    highlight_event_id: guji-巩简公-event-persecution
  - key: closure
    name: 子孙以巩为氏而奉为始祖
    labels:
      zh: 落定
    start_date: -0490-01-01
    highlight_event_id: guji-巩简公-event-death
  decisions:
  - date: -0492-01-01
    title_zh: 宁殒身而不屈从贵戚
    rationale: 若屈从则改革尽废前功尽弃故舍身以全志为后世存风骨
  - date: -0490-01-01
    title_zh: 遗命子孙以巩邑为姓
    rationale: 以封地为姓既彰改革之源又使宗族有托故立巩氏以传久远
