    death:
      date: 1853-01-12
      precision: day
      raw: 咸丰二年十二月初四日（武昌城陷之际殉难）
  birth_date: ''
  death_date: 1853-01-12
  era: 清咸丰年间
  reign_ref: 咸丰帝
  archetype: 殉城督抚
  dilemmas:
  - 坚壁清野毁城外民房与保全百姓生计之间的冲突
  - 兵力不足、援兵未至时坚守省城的抉择
  - 城陷之际殉节与逃生的抉择
  lesson: 守土之臣当尽守土之责，虽势穷力竭亦不弃城而去
  summary_first_person: 我常大淳于咸丰二年新任湖北巡抚，正值粤匪兵锋直指武昌。我周阅城垣、修筑守备，亲赴岳州布置防堵， Nei 名臣之心，虽知毁除城外民房伤及百姓，仍以清野拒贼为要先。太平军围城数十日，我登城督战、设赏格、挖内濠引水拒地道，日夜辛劳。十二月初四日文昌门被火药轰塌，城陷，我守土之责已尽，遂与城共亡。
