  - date: 1852-12-06
    title_zh: 下令毁城外十丈内民房
    rationale: 兵法以清野为先，恐贼藏身民房潜掘地道，且碍炮路，前车可鉴
  - date: 1852-12-08
    title_zh: 先自平湖门外举火焚屋
    rationale: 城外民房不及尽毁，遂主动焚之以绝贼藏身之所
  - date: 1853-01-10
    title_zh: 挖内濠引水注满以拒地道
    rationale: 贼掘文昌门地道已达城下，伐木声可闻，以水灌之破其计
events:
