  type: 防务
  title_zh: 周阅城垣委官修筑
  description: 常大淳周阅武昌城垣，委官修筑，招集湖南木簰壮勇二千人。
- id: guji-常大淳-event-yuezhou
  date: 1852-08-23
  year_of: 咸丰二年七月初九日
  type: 防务
  title_zh: 往岳州布置防堵
  description: 常大淳往岳州省视疆界，奏请发帑筑西门 外城包岳阳楼，募洞庭渔户二千余人为渔勇堵截江路。
- date_event_placeholder: 1852-09-03
  skip: ''
- id: guji-常大淳-event-xisai
  date: 1852-09-03
  year_of: 咸丰二年七月二十日
  type: 疏请
  title_zh: 疏乞留新授江南提督双福助防
  description: 双福过境，常大淳以防堵需人，疏乞留楚助防，得允。
- id: guji-常大淳-event-notice
  date: 1852-12-05
  year_of: 咸丰二年十一月十一日
  type: 安民
  title_zh: 出示晓谕安定民心
  description: 城外民房焚毁后浮言汹汹，常大淳出示说明清野之义，严禁谣言，于是浮言浸息，民乃安堵。
- id: guji-常大淳-event-siege
  date: 1852-12-14
  year_of: 咸丰二年十一月十五日(围城)
  type: 守城
  title_zh: 偕双福登城督战抗贼
  description: 贼攻武昌，常大淳与双福出赏格、登城指挥，夜御贼乘雾攻城，大败之，计贼死者三百余人。
- id: guji-常大淳-event-flood
  date: 1853-01-10
  year_of: 咸丰二年十二月初二日
  type: 守城
  title_zh: 率属官挖内濠引水拒地道
  description: 贼掘文昌门地道达城下，常大淳率属官齐集城上，用夫四百人挖内濠引水注满。
- id: guji-常大淳-event-death
  date: 1853-01-12
  year_of: 咸丰二年十二月初四日
  type: 殉难
  title_zh: 文昌门轰塌城陷殉难
  description: 黎旦文昌门被火药轰裂二十余丈，贼四面乘梯攻入，城遂陷，常大淳殉难。
