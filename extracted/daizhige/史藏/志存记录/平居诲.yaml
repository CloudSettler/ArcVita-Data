    highlight_event_id: guji-平居诲-event-depart-lingzhou
  - key: breakthrough
    name: 越凉甘肃制木涩渡碛
    labels:
      zh: 突破险碛
    start_date: 0939
    highlight_event_id: guji-平居诲-event-depart-lingzhou
  - key: climax
    name: 历瓜沙阳关抵于阗
    labels:
      zh: 抵阗高潮
    start_date: 0940
    highlight_event_id: guji-平居诲-event-arrive-khotan
  - key: closure
    name: 觐圣天金册殿礼成
    labels:
