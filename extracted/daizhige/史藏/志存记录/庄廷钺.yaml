  - date: 1663-06-10
    title_zh: 就刑赋绝命
    rationale: 知冤不可雪，借诗歌存气节于佟将军石刻之中
events:
- id: guji-庄廷钺-event-birth
  title_zh: 出生于南浔庄氏
  date: 1640
  year_of: 1640
  description: 生于吴兴南浔庄允城家，居夏家园百尺楼，兄弟以才学称九龙
- id: guji-庄廷钺-event-poem
  title_zh: 七岁能诗著百尺楼稿
  date: 1655
  year_of: 1655
  description: 少有才华，七岁能诗，后成百尺楼诗稿，有杌有名终累楚等句，选入苕上诗钞
- id: guji-庄廷钺-event-compile
  title_zh: 参订辑刻明书
  date: 1660
  year_of: 1660
  description: 兄廷鑨得朱国桢明史旧稿编辑为明书，垂成而卒，父允城刻其书于清美堂，廷钺列名参订
- id: guji-庄廷钺-event-arrest
  title_zh: 因史案被逮入虎林军狱
  date: 1662-02-01
  year_of: 1662
  description: 辛丑吴之荣以忌讳语告于将军松魁，转奏朝廷，遣官至杭执允城及廷钺并列名者十八人
- id: guji-庄廷钺-event-prison
  title_zh: 虎林军狱诗歌倡和
  date: 1663-01-01
  year_of: 1663
  description: 系狱中虽受桎梏，得佟将军爱护供给饮食，与潘柽章吴炎等诗歌倡和，后被摹刻为六石
- id: guji-庄廷钺-event-death
  title_zh: 磔于杭州弼教坊
  date: 1663-06-10
  year_of: 1663
  description: 癸卯五月五日，与茅元锡吴之镛潘柽章吴炎等同磔于杭，年二十四，妻潘氏闻极刑一恸而绝
