  era: 清初
  reign_ref: 康熙
  archetype: 才子蒙冤
  dilemmas:
  - 才华早露与文字取祸之两难
  - 家族连坐与狱中守节之抉择
  lesson: 才名可用以传家，亦可召祸，秉笔著史尤须慎于忌讳
  summary_first_person: 我字佐璜，南浔庄氏子，七岁能诗，著百尺楼诗稿，兄廷鑨輯明书而早卒，家刻其书以传，不料吴之荣告发，牵连十八人同系虎林军狱，我与诸公诗歌倡和，终以癸卯五月五日就刑于杭州，年二十四
  source_urls:
  - https://daizhige.org/史藏/志存记录/书湖州庄氏史狱.html
