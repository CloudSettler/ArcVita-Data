  name_zh: 庄廷钺
  names:
    zh: 庄廷钺
    en: Zhuang Tingyue
  lifespan:
    birth:
      date: 1640
      precision: year
      is_circa: true
      raw: 约崇祯末年生，罹祸时年二十四
    death:
      date: 1663-06-10
      precision: day
      is_circa: false
      raw: 癸卯五月五日磔于杭之弼教坊
  birth_date: 1640
