  - 在县不治免官，怀大才而屈于小职
  lesson: 才高者当识时务、择明主而展骥足，然命途多舛，功业未竟而身先殁
  summary_first_person: 我是庞统，字士元，号凤雏。年十八为德公与司马德操所赏，称南州冠冕，遂显名。我先主的治中从事，力主入益州，率众攻雒县时中矢而亡，时年三十六。
