    title_zh: 日选小内监强有力者习布库以为戏
    rationale: 以游戏为掩护练力，使权奸不疑
  - date: '1669'
    title_zh: 令布库小儿于殿内擒鳌拜
    rationale: 若令外廷拿问恐激生事端，就地擒之可行所无事
events:
- id: guji-康熙帝-event-birth
  date: '1654-05-04'
