  birth_date: '1654'
  death_date: '1722'
  era: 清代
  reign_ref: 康熙
  archetype: 幼年智除权奸的英主
  dilemmas:
  - 幼主当国，权臣鳌拜势焰熏灼，外廷拿问恐激生事端
  lesson: 除权奸不假外廷之力，以不动声色之智行非常之事
  summary_first_person: 我八岁登极，其时鳌拜专权肆行无忌。我不动声色，日选小内监中强有力者习布库为戏，使鳌拜以为我弱且好弄而心益坦然。一日他入内奏事，我令布库小儿一拥而擒之，遂伏诛。如此除之，行所无事，不致激生事端。
  source_urls:
  - 竹叶亭杂记·卷一（清·姚元之）
endeavors:
- id: guji-康熙帝-endeavor-1
  name_zh: 智擒鳌拜
  description: 以习布库为戏为掩护，训练少年侍卫，乘鳌拜入内时将其生擒伏诛
  phases:
