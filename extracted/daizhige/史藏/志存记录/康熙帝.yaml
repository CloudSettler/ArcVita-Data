  title_zh: 康熙帝出生
  description: 玄烨生于顺治十一年，后为圣祖仁皇帝。
- id: guji-康熙帝-event-enthronement
  date: '1661'
  year_of: '1661'
  title_zh: 八岁登极
  description: 圣祖仁皇帝之登极也，甫八龄，其时大臣鳌拜当国，势焰甚张。
- id: guji-康熙帝-event-aobai-training
  date: '1662'
  year_of: '1662'
  title_zh: 选小内监习布库为戏
  description: 帝在内日选小内监强有力者令习布库以为戏，不避鳌拜奏事，使之心益坦然。
- id: guji-康熙帝-event-aobai-capture
  date: '1669'
  year_of: '1669'
  title_zh: 布库擒鳌拜伏诛
  description: 一日鳌拜入内，帝令布库擒之，十数小儿立执鳌拜，遂伏诛，权奸不觉而行所无事。
- id: guji-康熙帝-event-death
  date: '1722-12-20'
  year_of: '1722'
  title_zh: 康熙帝驾崩
  description: 圣祖仁皇帝崩于康熙六十一年。
