events:
- id: guji-异牟寻-event-birth
  type: birth
  place: 南诏（生年不详）
  actor: guji-异牟寻
  description: 异牟寻生年史无明载，为阁罗凤之孙、凤伽异之子。
- id: guji-异牟寻-event-succession
  type: succession
  date: 0779
  year_of: 779
  place: 南诏史城
  actor: guji-异牟寻
  description: 唐代宗大历十四年嗣立南诏王位，有智数、善抚众，居史城（今喜州）。
- id: guji-异牟寻-event-defeat-li-sheng
  type: military-event
  date: 0779
  year_of: 779
  place: 南诏边境
  actor: guji-异牟寻
  description: 连兵吐蕃入寇，为唐神策都将李晟击破；异牟寻惧，改城苴咩（今大理），改国号曰大理，自称日东王。
- id: guji-异牟寻-event-zheng-hui-persuasion
  type: political-event
  date: 0787
  year_of: 787
  place: 南诏苴咩
  actor: guji-异牟寻
  description: 唐德宗贞元三年，清平官郑回说以大义令复归唐，异牟寻然之；会西川节度使韦皋招抚群蛮，异牟寻因求内附。
- id: guji-异牟寻-event-court-rejoin
  type: political-event
  date: 0793
  year_of: 793
  place: 长安方向·西川
  actor: guji-异牟寻
  description: 贞元九年上表请绝吐蕃、复臣于唐。
- id: guji-异牟寻-event-defeat-tubo
  type: military-event
  date: 0794
  year_of: 794
  place: 吐蕃方向
  actor: guji-异牟寻
  description: 贞元十年，自将数万人袭吐蕃，大破之。
- id: guji-异牟寻-event-tributary-investiture
  type: diplomatic-event
  date: 0794
  year_of: 794
  place: 苴咩
  actor: guji-异牟寻
  description: 遣其弟献图纳贡并献吐蕃所颁金印，请复号南诏；唐遣使册封，赐银窠、黄金印，异牟寻北面跪受，宴使指南诏老人言出玄宗所赐器物，誓尽忠皇唐。
- id: guji-异牟寻-event-death
  type: death
  date: 0799
  year_of: 799
  place: 南诏
  actor: guji-异牟寻
  description: 死，伪谥孝恒（孝恒），改元二（见龙、上元），子寻阁劝嗣，寻阁劝于唐德宗贞元十五年立，故约卒于799年前后。
