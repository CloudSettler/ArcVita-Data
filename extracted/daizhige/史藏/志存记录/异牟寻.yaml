    death:
      date: 0799
      precision: year
      is_circa: true
  death_date: 0799
  era: 唐（南诏）
  reign_ref: 唐代宗大历十四年（779）嗣南诏王位，至唐德宗贞元十五年前卒
  archetype: 雄踞一方的君主，判吐蕃归唐、重定边势的谋略之主
  dilemmas:
  - 臣属吐蕃由此屡遭征调之苦，与归唐可能引发吐蕃报复之间的权衡
  - 韦皋设计转达归化之诚至吐蕃，反令吐蕃生疑，归附志向愈坚
  lesson: 弃暗投明、审时度势，可于一念之间改变数十年边局
  summary_first_person: 我异牟寻嗣立南诏，曾连吐蕃入寇而败于李晟，后经郑回晓以大义，得韦皋招抚，遂上表请绝吐蕃、复臣于唐，亲率数万人大破吐蕃，遣弟献图纳贡并请复号南诏，受唐册封黄金印。方士老人言宴使者时出玄宗所赐器物，告以尽忠皇唐，我答“敢不敬使者之命”。
