    title_zh: 永革澎湖独行规礼
    rationale: 提臣霸占独行行家苛求渔人受累故禁革并编号稽查以恤沿海穷民
  - date: 1740-09-10
    title_zh: 传谕严查战船虚冒废弛
    rationale: 承平日久船数虚报修造侵蚀甚或赁与商人贸易故令督抚提镇加意整顿以重海防
  - date: 1752-07-07
    title_zh: 改巡察御史三年一次事竣即回
    rationale: 巡察久驻拥虚名未得实情而道府镇营足资弹压故三年一往不留驻候代
