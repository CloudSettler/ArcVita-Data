  - date: 1736-09-13
    title_zh: 减台湾四县丁银为每丁二钱
    rationale: 内地每丁一二三钱不等而台湾加倍有余故仿内地酌中减则以纾民力
  - date: 1737-02-05
    title_zh: 减番饷及澎粮淡防丁银照民丁例
    rationale: 民番皆吾赤子所输番饷即百姓丁银故一例减为二钱令均沾实惠
  - date: 1744-09-09
    title_zh: 雍正七年以后报垦仍照同安则例升科
    rationale: 台民远隔海洋应加薄赋之恩嗣后确勘肥瘠分别上中下定额以昭优恤
- id: guji-弘历-endeavor-2
