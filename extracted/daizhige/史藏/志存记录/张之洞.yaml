  dilemmas:
  - 联日本以制俄与存琉球继绝不可两全
  - 酌允商务以饵贪求与谨防屏藩尽失之两难
  - 倾粤饷械援台援闽与固守粤海口广兵单之两难
  lesson: 审邻国治乱强弱与远近缓急，分别应之，以商务羁縻而不弃大义，以人才饷械固根本
  summary_first_person: 吾值俄日法交侵之际，主酌允商务以饵日本、姑悬球案以观变，举刘璈方耀以固台防；及署两广，力筹饷械援台援闽，仿基隆新台以固粤防，惟以澄吏固民、修军实自强为柔远之本。
  source_urls:
