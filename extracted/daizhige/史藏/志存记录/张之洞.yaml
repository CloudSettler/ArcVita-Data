  decisions:
  - date: 1880-11-02
    title_zh: 商务择无弊者允行球案抽出缓办
    rationale: 商务所争在利可藉以联欢孤俄，球案遽结则屏藩尽失朝鲜危矣故以商务饵贪求悬球案观变
  - date: 1880-11-02
    title_zh: 举刘璈方耀分任台湾文武事
    rationale: 台防不得人而闽兵不练，取习水土谙台事且雄毅善战者方可辟土阜财抚番捍敌
- id: guji-张之洞-endeavor-2
  title_zh: 署两广督师筹防援台援闽抗法
  goal_zh: 固粤海口兼筹饷械援应台闽以牵制法军
