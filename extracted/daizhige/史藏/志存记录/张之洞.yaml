      - 固防
    start_date: 1884-08-21
    highlight_event_id: guji-张之洞-event-1884-yuantai
  decisions:
  - date: 1884-08-11
    title_zh: 雇轮由台南运军火协饷济刘铭传
    rationale: 台湾孤悬敌注于台则闽解，土人能战而缺将与械故就地募而源源济械饷以困敌
  - date: 1884-08-26
    title_zh: 派方恭统潮勇五营由海道援闽
    rationale: 法人专注闽口闽防日紧，潮距闽近而方耀旧部得力故拨潮勇驰赴福州听调以分敌势
  - date: 1884-08-21
    title_zh: 照会各统领仿基隆掘堑穴山新筑炮台
    rationale: 基隆旧台高厚一击即毁而因山草台反能制敌，故令粤各台相机制宜因势类推以操胜算
events:
- id: guji-张之洞-event-birth
  title_zh: 诞生于贵州兴义
  date: 1837-09-02
  year_of: 1837
  place_zh: 贵州兴义
  description_zh: 道光十七年八月初三生于贵州兴义张氏家，后以科第入仕历任封疆。
- id: guji-张之洞-event-1880-qiu
  title_zh: 上日本商务可允球案宜缓折
  date: 1880-11-02
  year_of: 1880
  place_zh: 山西巡抚任上奏
  description_zh: 光绪六年十月初一日奏陈酌允商务以饵贪求、姑悬球案以观俄事变局，并立不得助俄之约，请饬李鸿章左宗棠速议。
- id: guji-张之洞-event-1880-taifang
  title_zh: 上台防重要敬举人才片
  date: 1880-11-02
  year_of: 1880
  place_zh: 山西巡抚任上奏
  description_zh: 同日附片言日本灭球乃垂涎台湾之渐，请以刘璈方耀分任台湾文武事畀以重权以保台闽。
- id: guji-张之洞-event-1884-liangguang
  title_zh: 署理两广总督到粤接篆
  date: 1884-07-08
  year_of: 1884
  place_zh: 广东广州
  description_zh: 光绪十年闰五月十六日抵粤省城，二十日接两广总督关防盐政印信任事，奏以澄吏固民修军实自强为治。
- id: guji-张之洞-event-1884-yuantai
  title_zh: 筹济台湾军火饷项并派兵援闽整粤防
  date: 1884-08-26
  year_of: 1884
  place_zh: 广东广州
  description_zh: 奉旨济铭营军火，购枪炮药协饷雇轮送淡水；派方恭潮勇五营援闽；照会各统领速备战守并仿基隆新筑炮台以固虎门以内海口。
- id: guji-张之洞-event-death
  title_zh: 病卒于京师
  date: 1909-10-05
  year_of: 1909
  place_zh: 京师
  description_zh: 宣统元年八月二十一日卒于京，年七十三，谥文襄，著述编为张文襄公全集选集传世。
