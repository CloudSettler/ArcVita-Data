events:
- id: guji-张九龄-event-birth
  title_zh: 出生于韶州曲江
  date: 0678
  year_of: 678
  place_zh: 韶州曲江
  description: 生而聪敏，少年即以群鸽通书信，目为飞奴
- id: guji-张九龄-event-fly
  title_zh: 少年传书鸽为飞奴
  date: 0693
  year_of: 693
  place_zh: 曲江家舍
  description: 家养群鸽，以书系鸽足依所教处飞往投之，时人爱讶其聪
- id: guji-张九龄-event-seat
  title_zh: 勤政楼论辩升七宝山座
  date: 0729
  year_of: 729
  place_zh: 长安勤政楼
  description: 明皇以七宝装成山座召学士讲经旨时务，惟九龄论辩风生得升座，余人不可阶
- id: guji-张九龄-event-fish
  title_zh: 禁苑以盆池之鱼谏林甫
  date: 478
  year_of: 736
  place_zh: 长安禁苑
  description: 帝问盆池鱼鲜活可爱，林甫对赖恩波所养，九龄对犹陛下任人但能装景致助儿女之戏，帝不悦而时人美其忠直
- id: guji-张九龄-event-fire
  title_zh: 斥附杨国忠者为向火乞儿
  date: 479
  year_of: 737
  place_zh: 长安朝堂
  description: 见文武趋附国忠争富贵，独不登门，言今之朝彦皆向火乞儿，火尽则冻尸裂体，后禄山乱附炎者族灭而验
- id: guji-张九龄-event-death
  title_zh: 薨于荆州长史任
  date: 480
  year_of: 740
  place_zh: 荆州
  description: 罢相后出为荆州长史，忧国而卒，四方画真神事之者犹念其德
