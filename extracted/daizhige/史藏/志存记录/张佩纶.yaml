  description: 年甫冠，联捷入词馆，甲戌散馆授编修，丙子大考擢侍讲。
- id: guji-张佩纶-event-yandu
  person: guji-张佩纶
  type: endeavor
  date: '1879'
  year_of: 1879
  title_zh: 服阕补官，章奏朝闻夕报可
  description: 居生母丧后补庶子，屡上清丽刚明之疏，捷踞风宪。
- id: guji-张佩纶-event-taigang
  person: guji-张佩纶
  type: endeavor
  date: '1883'
  year_of: 1883
  title_zh: 署理左副都御史
  description: 一疏褫黜不职科道十二人，辇毂为肃；是年主癸未科会试贡举。
- id: guji-张佩纶-event-chuanzheng
  person: guji-张佩纶
  type: endeavor
  date: '1884'
  year_of: 1884
  title_zh: 奉旨督办福建船政
  description: 仇家阴遣荐进，出京赴闽，过津与李文忠深谈，文忠劝勿战。
- id: guji-张佩纶-event-dianzhan
  person: guji-张佩纶
  type: endeavor
  date: 1884-08
  year_of: 1884
  title_zh: 电请速战被枢臣密电阻遏
  description: 法舶已入马江，我军凿舟塞其出路；回电言万不可衅由我起。
- id: guji-张佩纶-event-majiang-defeat
  person: guji-张佩纶
  type: endeavor
  date: '1884-08-23'
  year_of: 1884
  title_zh: 马江之战败绩
  description: 法舰发炮，我军两轮得战皆沉，余尽坏；学士仓卒走免。
- id: guji-张佩纶-event-shuli
  person: guji-张佩纶
  type: endeavor
  date: '1885'
  year_of: 1885
  title_zh: 褫职遣戍后期还附李文忠幕
  description: 合肥代缴台费，还赘文忠节署，文忠尝语人"爱其才，悲其遇"。
- id: guji-张佩纶-event-zhengwuchu
  person: guji-张佩纶
  type: endeavor
  date: '1900'
  year_of: 1900
  title_zh: 还编修原职，入直政务处
  description: 庚子联军入京，銮舆西幸，从李文忠留京办事。
- id: guji-张佩纶-event-death
  person: guji-张佩纶
  type: death
  date: '1903'
  year_of: 1903
  title_zh: 张佩纶卒
  description: 李文忠既没，学士旋捐馆舍。
