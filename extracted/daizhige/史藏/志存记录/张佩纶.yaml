person:
  qid: guji-张佩纶
  name_zh: 张佩纶
  names:
    zh: 张佩纶
    en: Zhang Peilun
  lifespan:
    birth:
      date: '1848'
      precision: year
      is_circa: true
      raw: 年甫冠（同治庚午辛未联捷，约弱冠推算）
    death:
      date: '1903'
      precision: year
      is_circa: true
      raw: 李文忠没后旋捐馆舍
  birth_date: '1848'
  death_date: '1903'
  era: 清末
  reign_ref: 同治、光绪
  archetype: 清流书生·临危受命的才臣
  dilemmas:
  - 书生督战 versus 疆场机变，庙谟遥制万里之外
  - 主战清议 versus 人事变乱遭受权臣掣肘
  - 避危辞任 versus 耻避危事，临难不辞
  lesson: 才当其位，方成其功；庙谟遥制与仇家倾陷，足以毁一国之干城。
  summary_first_person: 我以清流直声起家，早年得宫廷识拔，遍纠弹积弊，署理左副都御史。中法战起，被仇家阴遣荐为船政大臣，赴马尾筹防。我仓促受命，兵械未备，朝旨又拘于"衅不可由我起"，马江一战，舰多覆没。败后褫职遣戍，蒙李文忠眷礼，晚岁入其幕府，随办政务处之事，终未复大用。
