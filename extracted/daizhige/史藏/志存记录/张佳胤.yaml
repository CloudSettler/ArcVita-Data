  person_qid: guji-张佳胤
  title_zh: 单车入杭谕平民变
  summary_zh: 万历十年杭城市民苦夜役不均聚众焚掠，我五月朔单车入台除役安众，复以营兵进剿斩倡首五十余人而散其党
  phases:
  - key: brewing
    name: 夜役积怨市民聚变
