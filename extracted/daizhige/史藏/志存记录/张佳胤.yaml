  summary_first_person: 吾铜梁张佳胤，字肖甫，万历十年以兵部右侍郎视浙师，杭城民变则单车迎谕除夜役而速讨之，浙营兵噪则还饷安军待春汛誓师而密诛九首，卒使全浙帖然，此吾缓急审密之志也
