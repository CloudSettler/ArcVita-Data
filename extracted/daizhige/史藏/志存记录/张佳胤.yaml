  date: '1583-02-01'
  year_of: 1583
  place_zh: 浙江杭州
  summary_zh: 先还饷如旧不以钱累军以安悍卒，及春汛七营当哨誓师，分捕陈德胜方子龙等七人及马文英杨廷用共九首斩辕门，驰赦七营卒而军心股栗帖服
- id: guji-张佳胤-event-death
  person_qid: guji-张佳胤
