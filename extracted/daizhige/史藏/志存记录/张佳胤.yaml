  - key: breakthrough
    name: 单车迎谕暂散其众
    labels:
      zh: 单车谕散
    start_date: '1582-05-01'
    highlight_event_id: guji-张佳胤-event-minbian
  - key: climax
    name: 借营兵进剿擒斩倡首
    labels:
      zh: 进剿擒斩
    start_date: '1582-05-02'
    highlight_event_id: guji-张佳胤-event-minbian
  - key: closure
    name: 余党鸟散郊猾屏迹
    labels:
      zh: 余党屏迹
    start_date: '1582-05-10'
    highlight_event_id: guji-张佳胤-event-minbian
  decisions:
  - date: '1582-05-01'
    title_zh: 下令蠲除夜役以解众怒
    rationale: 众苦豪强独免役而监司不听，不除其苦则反心不解，故以除役易其散而离兵民之合
  - date: '1582-05-02'
    title_zh: 用悍兵讨乱民以速定乱
    rationale: 乱民乌合可刈而悍兵求功赎罪，以兵讨民既收其用又分其势，故抚营兵使尽力捕乱而戒多杀
- id: guji-张佳胤-endeavor-2
  person_qid: guji-张佳胤
  title_zh: 宽缓并用诛浙营九首
  summary_zh: 浙幕府亲兵噪逐吴中丞，我先还饷授冠带以安其心，待春汛誓师分捕马文英杨廷用等九首斩于辕门，赦七营而全浙帖然
  phases:
  - key: brewing
    name: 营兵骄噪逐辱中丞
    labels:
      zh: 营兵骄噪
    start_date: '1582-03-01'
    highlight_event_id: guji-张佳胤-event-bingbian
  - key: breakthrough
    name: 还饷授冠带暂安悍卒
    labels:
      zh: 还饷安军
    start_date: '1582-06-01'
    highlight_event_id: guji-张佳胤-event-bingbian
  - key: climax
    name: 誓师捕斩九首示法
    labels:
      zh: 誓师正法
    start_date: '1583-02-01'
    highlight_event_id: guji-张佳胤-event-bingbian
  - key: closure
    name: 赦七营论功还都
    labels:
      zh: 赦营论功
    start_date: '1583-03-01'
    highlight_event_id: guji-张佳胤-event-bingbian
  decisions:
  - date: '1582-06-01'
    title_zh: 阳予冠带还饷以缓其变
    rationale: 悍卒未丽法而急之则生变，密掩毙之则法不振而人人自疑，故阳示宽大以安众待时而后发
  - date: '1583-02-01'
    title_zh: 春汛誓师分批捕斩九首
    rationale: 诛乱卒利用缓而须密，乘誓师部伍严整之机分捕倡乱者正法，方能振天子三尺而不惊众
