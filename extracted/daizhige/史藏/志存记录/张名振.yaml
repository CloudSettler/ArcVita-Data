  era: 明末清初
  reign_ref: 鲁王监国
  archetype: 抗清名将
  dilemmas:
  - 与黄斌卿联姻结盟，却在斌卿与王朝先冲突时面临忠于盟约与顺应形势的两难
  - 兵败后投郑成功，须在寄人篱下与坚持 “赤心报国” 志节之间求平衡
  lesson: 忠贞之志可深入肌肤，然乱世结盟易、全信难，恃力者终亡
  summary_first_person: 我张名振，以副将起于石浦，鲁王监国时迎驾海上，受定西侯之封。舟山破时，母妻兄嫂阖门死节，我收拾余烬投郑成功，解衣示 “赤心报国” 四字，遂得重用。癸巳春请兵北上，破京口、截长江，登金山题
    “十年横海一孤臣” 之句，誓以余生恢复故国。
