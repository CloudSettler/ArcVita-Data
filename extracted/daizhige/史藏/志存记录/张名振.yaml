- id: guji-张名振-event-welcome
  type: career
  person: guji-张名振
  date: '1646-08-02'
  year_of: 1646
  summary: 时为定西将军，差中军方简迎鲁王出澥门卫
- id: guji-张名振-event-alliance
  type: career
  person: guji-张名振
  date: '1646'
  year_of: 1646
  summary: 以石浦旧地借黄斌卿共守舟山，缔姻结盟；见王朝先被劫，解衣赠千金为其请还印
- id: guji-张名振-event-storm
  type: career
  person: guji-张名振
  date: '1647'
  year_of: 1647
  summary: 响应吴胜兆，联兵二千余号、兵将五百有余，次黄连港移白米沙洗炮，飓风大作全军尽覆；弟名远被擒斩；名振浮海得脱，经僧一泓剃发易服之助得脱归舟山
- id: guji-张名振-event-zhoushan-fall
  type: career
  person: guji-张名振
  date: '1651-09-03'
  year_of: 1651
  summary: 辛卯秋清三省兵分路攻舟山，九月初三城破；兄名甲、名扬、母李氏、妻马氏赴火死，名振时督兵在外，遁去
- id: guji-张名振-event-success
  type: career
  person: guji-张名振
  date: '1652'
  year_of: 1652
  summary: 兵败后往见郑成功，解衣示背上 “赤心报国” 四字，成功焚谤书以上宾待之，拜名振总制
- id: guji-张名振-event-northern
  type: career
  person: guji-张名振
  date: '1653'
  year_of: 1653
  summary: 请兵北上，获叛将金允彦磔之遥祭死事诸公，札营崇明、破京口、截长江，登金山寺题 “十年横海一孤臣”
- id: guji-张名振-event-death
  type: death
  person: guji-张名振
  date: ''
  year_of: ''
