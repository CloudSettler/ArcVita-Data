  name_zh: 张国维
  names:
    zh: 张国维
    en: Zhang Guowei
  lifespan:
    birth:
      date: '1595'
      precision: year
      is_circa: true
      raw: 万历二十三年左右生
    death:
      date: '1646-06-30'
      precision: month
      is_circa: true
      raw: 丙戌五月投池死
  birth_date: '1595'
  death_date: '1646-06-30'
  era: 明末清初
  reign_ref: 鲁监国
  archetype: 殉节阁臣
  dilemmas:
  - 以孤危之鲁抗全盛之敌，知不可为而誓不奉闽，以全君臣之义
  - 以书生督武将之军，诸师不相统而强为节制，进退皆咎归于己
  lesson: 公心鼓众而不应，唯以一死定是非，不以成败易忠节
  summary_first_person: 我以原官兵部尚书佐鲁监国于绍兴，进东阁大学士监方国安军，请筑坛拜将以一节制，伏阙斥奉闽之议，嵊赭小捷后督子突进朱桥而援绝师溃，及江上溃散还守东阳，誓不学文山迭山之避，投池以死全大义
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E4%B8%9C%E5%B1%B1%E5%9B%BD%E8%AF%AD.html
endeavors:
- id: guji-张国维-endeavor-1
  title_zh: 江上督师节制诸军
  summary: 以阁臣监方国安军，请筑坛拜荆国大将军，伏阙定奉鲁之议，图合闽越共御北师
  phases:
  - key: brewing
    name: 监军江上
    labels:
      zh: 阁部督师
    start_date: '1645-08-01'
    highlight_event_id: guji-张国维-event-baijiang
  - key: breakthrough
    name: 筑坛拜将
    labels:
      zh: 节制江上
    start_date: '1645-09-01'
    highlight_event_id: guji-张国维-event-baijiang
  - key: climax
    name: 朱桥突进
    labels:
      zh: 深入遇伏
    start_date: '1645-12-20'
    highlight_event_id: guji-张国维-event-zhuqiao
  - key: closure
    name: 越势大沮
    labels:
      zh: 援绝师溃
    start_date: '1646-01-01'
    highlight_event_id: guji-张国维-event-zhuqiao
  decisions:
  - date: '1645-09-01'
    title_zh: 疏请筑坛拜方国安为荆国大将军
    rationale: 诸营无所统策之不应，循故事假大将之名以节制江上
  - date: '1645-09-10'
    title_zh: 伏阙斥奉闽议立斩异议者
    rationale: 以鲁以数郡当全盛之敌而闽乘危诱众，移奉即为二心，当为鲁死以定名义
- id: guji-张国维-endeavor-2
  title_zh: 还守东阳投池殉国
  summary: 江军溃后还东阳拒招，作神炮睨江，及绍兴金华相继陷，投池死以明不二
  phases:
  - key: brewing
    name: 还守东阳
    labels:
      zh: 独守孤城
    start_date: '1646-05-01'
    highlight_event_id: guji-张国维-event-shenpao
  - key: breakthrough
    name: 神炮睨江
    labels:
      zh: 得洪武铜炮
    start_date: '1646-02-01'
    highlight_event_id: guji-张国维-event-shenpao
  - key: climax
    name: 江防尽溃
    labels:
      zh: 监国入海
    start_date: '1646-06-01'
    highlight_event_id: guji-张国维-event-death
  - key: closure
    name: 投池殉节
    labels:
      zh: 误国耻避
    start_date: '1646-06-30'
    highlight_event_id: guji-张国维-event-death
  decisions:
  - date: '1646-02-01'
    title_zh: 取萧山掘得洪武铜炮为神炮守江
    rationale: 借前朝祥物壮军胆，一发破垛以慑敌不敢轻进
  - date: '1646-06-30'
    title_zh: 拒避山投池死
    rationale: 误天下者学文山迭山之避，宁以死明志不以偷生负国
events:
- id: guji-张国维-event-birth
  title_zh: 出生
  date: '1595'
  year_of: 1595
  description: 浙江东阳人，字玉笥，崇祯中累官至兵部尚书
- id: guji-张国维-event-baijiang
  title_zh: 筑坛拜将与伏阙定议
  date: '1645-09-01'
  year_of: 1645
  description: 鲁监国时进东阁大学士监方国安军，请拜国安荆国大将军，伏阙斥刘中藻奉闽之使，群议始定
- id: guji-张国维-event-zhuqiao
  title_zh: 朱桥突进师溃
  date: '1645-12-20'
  year_of: 1645
  description: 因嵊赭山捷令子世凤从国安突进朱桥，以长河为后援，机露援绝选锋五千尽降，越势大沮
- id: guji-张国维-event-shenpao
  title_zh: 得洪武铜炮守江
  date: '1646-02-01'
  year_of: 1646
  description: 萧山掘地得洪武年铜炮四十二，作神炮领之睨江，一发抵武林破垛，再发炮裂不任用
- id: guji-张国维-event-death
  title_zh: 东阳投池殉国
  date: '1646-06-30'
  year_of: 1646
  description: 方师溃于桐庐监国入海，还东阳，东阳破不避入山，大言斥避敌者误国，投池中死，子世凤逮杭被害
