person:
  qid: guji-zhangshicheng
  name_zh: 张士诚
  names:
    zh: 张士诚
    en: Zhang Shicheng
  lifespan:
    birth:
      date: ''
      precision: year
      is_circa: true
      raw: 泰州白驹场人，生年不详
    death:
      date: ''
      precision: year
      is_circa: false
      raw: 兵败被俘，不屈而死
  birth_date: ''
  death_date: ''
  era: 元末（至正年间）
  reign_ref: 大周天佑、吴王
  archetype: 起于盐贩、据吴称王而终亡于战乱的一方豪杰
  dilemmas:
  - 降元与自立之间的反复摇摆
  - 信谗而失忠臣，漕贡断绝招致孤立
  lesson: 起于草莽可乘一时之势，然骄侈失谋、反复无常者终难久立
  summary_first_person: 我本泰州白驹场贩盐之人，因不堪富家与弓兵欺辱，与诸弟及李伯升等十八人起兵。乘势陷泰州、据高邮，自称诚王，国号大周，建元天佑。后来渡江取吴中富庶之地，改平江为隆平府，据浙右二千余里。我曾一度受元太尉之封而实不奉命，又自立为吴王。终因骄侈待下、诸将离心，为朱元璋大军所攻，失泰州、高邮、淮东，最后覆亡。
  source_urls:
  - https://zh.wikisource.org/wiki/皇朝平吳錄
