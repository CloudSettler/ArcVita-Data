  participants:
  - guji-zhangshicheng
- id: guji-zhangshicheng-event-cross-river
  date: 1357-02
  year_of: 1357
  type: endeavor-start
  title_zh: 渡江入吴
  description: 以淮东大饥，谓惟吴中富庶可以建国，留兵守高邮，由通州渡江入福山港，遂陷常熟，兵入平江娄、齐二门。
  participants:
  - guji-zhangshicheng
- id: guji-zhangshicheng-event-wu-king
  date: 1363
  year_of: 1363
  type: endeavor-start
  title_zh: 自立为吴王
  description: 至正二十三年，令部属自颂功德求王爵不报，遂自立为吴王，治宫室，立官属。
  participants:
  - guji-zhangshicheng
- id: guji-zhangshicheng-event-fall
  date: 1367
  year_of: 1367
  type: death
  title_zh: 兵败覆亡
  description: 朱元璋命徐达、常遇春等率军先取淮东剪其羽翼，继攻泰州、高邮，士诚屡败，终至覆亡。
  participants:
  - guji-zhangshicheng
