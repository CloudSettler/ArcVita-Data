  archetype: 权相改革家
  dilemmas:
  - 持法峻明与身家安危难以两全，身后险遭族灭之祸
  - 忘身狥国与遭当时及后世非议之间的抉择
  lesson: 持法峻明、忘身狥国可致主威伸而四夷宾服，然处身之道亦须自谨，幸免族灭实赖时运。
  summary_first_person: 我是张居正，世称张江陵。论者谓千古之下，霍光功名伊尹之后一人而已，惟我可以匹之。我持法峻明，忘身狥国，主威常伸，四夷宾服，此点与霍光相同；而处身之法亦略同。我不幸而身后遭议，又幸而不遇昌邑之事，也无霍显那样之妻，故免于族灭。霍光之功逾宣元至成帝始褒，而我亦在今上时表明，遭遇竟又如此相似。
