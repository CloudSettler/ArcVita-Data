person:
  qid: guji-张岱
  name_zh: 张岱
  names:
    zh: 张岱
    en: Zhang Dai
  lifespan:
    birth:
      date: '1597'
      precision: year
      is_circa: true
      raw: 万历二十五年丁酉（一五九九）
    death:
      date: '1684'
      precision: year
      is_circa: true
      raw: 约康熙年间，一说八十八岁（一六八四）
  birth_date: '1597'
  death_date: '1684'
  era: 明末清初
  reign_ref: 万历、崇祯、顺治、康熙
  archetype: 明遗民文史学家
  dilemmas:
  - 国破家亡后求生著史与殉节气节之间的挣扎（作自挽诗每欲引决，因《石匮书》未成而视息人间）
  - 繁华旧梦与清贫隐居的落差（昔日纨绔繁华，后布衣蔬食常至断炊）
  lesson: 能将寂寞与繁华看做没有两样，才能耐寂寞而不热衷，处繁华而不没落。
  summary_first_person: 我生于绍兴显贵之家，早年极爱繁华；甲申国亡后披发入山，甘做逸民四十年，独守一部《石匮书》，又以《陶庵梦忆》追忆前尘。
  source_urls:
  - 左传
