events:
- id: guji-张岱-event-birth
  date: '1597'
  year_of: 1597
  type: 事实
  title_zh: 张岱生于山阴
  description_zh: 自为墓志铭称生于万历二十五年丁酉，apphire一五九九年（一说约一五九七）。
- id: guji-张岱-event-shikui-start
  date: '1646'
  year_of: 1646
  type: 事业
  title_zh: 丙戌后屏居卧龙山始撰《石匮藏书》
  description_zh: 短檐危壁，沉淫于明一代纪传，以拟郑思肖之铁函心史。
- id: guji-张岱-event-shikui-done
  date: '1670'
  year_of: 1670
  type: 事业
  title_zh: 《石匮书》数十载脱稿
  description_zh: 弟《石匮》一书，泚笔四十余载，脱稿后犹时加删改。
- id: guji-张岱-event-shikui-sale
  date: '1660'
  year_of: 1660
  type: 事业
  title_zh: 以五百金让稿与谷应泰
  description_zh: 顺治年间谷应泰编《明史纪事本末》，购《石匮书》，张岱慨然予之。
- id: guji-张岱-event-mengyi-start
  date: '1646'
  year_of: 1646
  type: 事业
  title_zh: 国破家亡后始作《陶庵梦忆》
  description_zh: 遥思往事，忆即书之，持向佛前一一忏悔。
- id: guji-张岱-event-mengyi-done
  date: '1650'
  year_of: 1650
  type: 事业
  title_zh: 《陶庵梦忆》成书
  description_zh: 追忆昔日繁华靡丽总成一梦，成晚明忆语体名作。
- id: guji-张岱-event-xu-collection
  date: '1615'
  year_of: 1615
  type: 事业
  title_zh: 年少时搜集徐文长佚文
  description_zh: 以所收颇多草率之作，再求王谑庵为之删削。
- id: guji-张岱-event-xu-publish
  date: '1600'
  year_of: 1600
  type: 事业
  title_zh: 刊刻《徐文长逸稿》
  description_zh: 昔人未有以柱对传而刻之文集者，刻之自余始。
- id: guji-张岱-event-death
  date: '1684'
  year_of: 1684
  type: 事实
  title_zh: 张岱卒
  description_zh: 一说活到七十多岁，一说八十八岁（一六八四），后说较为可靠。
