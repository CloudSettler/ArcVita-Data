person:
  qid: guji-zhanghan
  name_zh: 张瀚
  names:
    zh: 张瀚
    en: Zhang Han
  lifespan:
    birth:
      date: '1511'
      precision: year
      is_circa: true
      raw: 以嘉靖甲午（1534）二十四岁举于乡逆推，约生于正德六年
    death:
      date: '1593'
      precision: year
      is_circa: true
      raw: 万历癸巳年八十三岁自识《松窗梦语》，归十八年而终，约卒于万历二十一年
  birth_date: '1511'
  death_date: '1593'
  era: 明代
  reign_ref: 历仕嘉靖、隆庆、万历三朝
  archetype: 直臣能吏
  dilemmas:
  - 张居正夺情之议起，守纲常直谏而失位，还是顺从权相以保冢宰之尊
  - 权贵横暴索求，坚持朝廷法纪还是屈从媚上以全身
  - 断狱避嫌易获名，然恐屈杀无辜，求中情之法还是沽名害命
  lesson: 居身如护新履，一失足将无所不至；持大体、济宽和，纲常所在虽雷霆不避，是非公论自明于身后。
  summary_first_person: 我字子文，别号元洲，浙之仁和人。二十四举于乡，明年成进士，扬历宦途四十余年，官至冢宰。江陵夺情事起，我不肯谕留，卒中伤以归。归而屏绝俗尘，对松窗随笔述事，成《松窗梦语》，既以自省，且以贻吾后人。
endeavors:
- id: guji-zhanghan-endeavor-1
  name_zh: 四十余年宦途：自郎署至冢宰
  phases:
  - key: brewing
    name_zh: 观政释褐，历郎署郡守
    labels:
      zh:
      - 科举入仕
      - 郎署历练
    start_date: '1535'
    highlight_event_id: guji-zhanghan-event-jinshi
  - key: breakthrough
    name_zh: 守庐阳、大名，兴水利、辨冤狱、御虏勤王
    labels:
      zh:
      - 地方治理
      - 能吏声绩
    start_date: '1545'
    highlight_event_id: guji-zhanghan-event-luyang
  - key: climax
    name_zh: 以南工部尚书入为冢宰，主持铨选
    labels:
      zh:
      - 执掌铨衡
      - 吏治之盛
    start_date: '1574'
    highlight_event_id: guji-zhanghan-event-duoqing
  - key: closure
    name_zh: 夺情之争中罢归，名重于九鼎大吕
    labels:
      zh:
      - 守纲常致仕
    start_date: '1577'
    highlight_event_id: guji-zhanghan-event-duoqing
  decisions:
  - date: '1535'
    title_zh: 成进士，观政都台，谨遵王廷相「居身如履」之诲
    rationale: 初入仕路，宜审交游；佩服舆人新履之喻，终身不敢忘。
  - date: '1549'
    title_zh: 庚戌虏变时驰赴真定，先驰集兵勤王
    rationale: 勤王之师，事不宜缓；卑使者则威亵，先王人以尊朝廷之威命。
  - date: '1550'
    title_zh: 与贪横兵备尹君相抗，行文属邑不得径解
    rationale: 朝廷纪法凛然在上，不敢废法纪以媚贪暴之人；一官不足惜，不令恐吓吾民。
  - date: '1577'
    title_zh: 拒谕留张居正夺情，偕三尚书密晤动以微言
    rationale: 纲常大义所在，虽知忤权相必去位，宁守名节不为报德屈身。
- id: guji-zhanghan-endeavor-2
  name_zh: 罢归著书，成《松窗梦语》
  phases:
  - key: brewing
    name_zh: 归居西湖之上，对松窗静思往昔
    labels:
      zh:
      - 谢客读书
      - 丹青尽弃
    start_date: '1577'
    highlight_event_id: guji-zhanghan-event-songchuang
  - key: climax
    name_zh: 万历癸巳随笔述事，成书八卷
    labels:
      zh:
      - 自省传家
      - 记游纪实
    start_date: '1593'
    highlight_event_id: guji-zhanghan-event-songchuang
  - key: closure
    name_zh: 是书为公绝笔，身后刊行传世
    labels:
      zh:
      - 绝笔之书
    start_date: '1593'
    highlight_event_id: guji-zhanghan-event-death
  decisions:
  - date: '1593'
    title_zh: 于虎林小楼自识《松窗梦语》，以自省且贻后人
    rationale: 既往为梦幻，此时为暂寤；松窗长昼，随笔述事，志在自省与传家。
events:
- id: guji-zhanghan-event-birth
  date: '1511'
  year_of: 1511
  type: birth
  title_zh: 生于浙江仁和
  description: 张瀚，字子文，别号元洲，浙江仁和人。幼卓荦，敏惠异常儿。
- id: guji-zhanghan-event-xiangju
  date: '1534'
  year_of: 1534
  type: endeavor
  title_zh: 嘉靖甲午举于乡
  description: 年二十四举于乡，为嘉靖甲午。
- id: guji-zhanghan-event-jinshi
  date: '1535'
  year_of: 1535
  type: endeavor
  title_zh: 成进士，观政都台
  description: 明年成进士，释褐观政都台，台长王廷相许为可友，以舆人新履之喻诲其居身之道。
- id: guji-zhanghan-event-luyang
  date: '1545'
  year_of: 1545
  is_circa: true
  type: endeavor
  title_zh: 守庐阳，兴塘堤、抚流民、祷雨纾旱
  description: 任庐州知府，令低洼开塘、高阜筑堤，两年开浚甚多；定逃民遗产认佃之约，庐郡渐少抛荒。
- id: guji-zhanghan-event-qinwang
  date: '1550'
  year_of: 1550
  type: endeavor
  title_zh: 庚戌之变，集兵勤王
  description: 俺答寇蓟镇直犯都城，朝廷遣使畿辅四郡备兵入卫，余阅户计丁、三十选一，先驰赴真定集师，五日而成。
- id: guji-zhanghan-event-zhongzai
  date: '1574'
  year_of: 1574
  is_circa: true
  type: endeavor
  title_zh: 以南工部尚书入为冢宰
  description: 廷推冢宰公名在三，上越次用公；在铨衡五年称最久，持大体、济以宽和，一时贤守令监司多出其选用，吏治为一时之盛。
- id: guji-zhanghan-event-duoqing
  date: '1577'
  year_of: 1577
  type: endeavor
  title_zh: 拒谕留张居正夺情，卒罢归
  description: 江陵夺情事起，朝廷属公谕留，公毅然不可，偕三尚书密晤流涕以谏；江陵滋不悦，卒中公以归，年六十七。
- id: guji-zhanghan-event-songchuang
  date: '1593'
  year_of: 1593
  type: endeavor
  title_zh: 万历癸巳自识《松窗梦语》
  description: 罢归屏绝俗尘，独处小楼，对移自天目之松随笔述事八卷，既以自省，且以贻吾后人，虎林山人八十三翁张瀚识。
- id: guji-zhanghan-event-death
  date: '1593'
  year_of: 1593
  type: death
  title_zh: 卒，年八十三
  description: 归十有八年而终，年八十有三。临终检箧笥无厚蓄，历宦禄入无私，其廉可观。
