person:
  qid: guji-张炳垣
  name_zh: 张炳垣
  names:
    zh: 张继庚（字炳垣，降贼后化名叶子法）
    en: Zhang Jigeng (Bingyuan)
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 未详生年，江宁诸生
    death:
      date: '1854'
      precision: year
      is_circa: true
      raw: 江宁陷后遭太平军车裂处死（原文明未系年，据攻略约在咸丰初）
  death_date: ~1854
  era: 清咸丰年间，太平军踞江宁时期
  reign_ref: 清文宗咸丰
  archetype: 忍辱内应、以死谋国的烈丈夫
  dilemmas:
  - 徒死无益与降贼苟活的取舍，以诈降图复兴
  - 严刑烙体之下坚不吐实，指伪官册老兄弟以计杀贼
  lesson: 身陷绝地，宁受车裂之酷而不负本朝，虽死犹以数言杀贼数十
  summary_first_person: 我本江宁诸生，城破之日，念徒死无益，遂诈降改名以图内应。三十六函军书通于向帅，约夜纳大军于仪凤门，事泄被执。烙体刺乳，我忍死不承，反借贼册指杀广西老贼三十余人，终遭五马分尸。张鸦头感我意气，杀贼七人以践死约。机事不密，英杰沦亡，我犹可谓烈丈夫也。
