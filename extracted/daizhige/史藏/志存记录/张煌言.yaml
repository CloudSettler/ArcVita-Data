  date: 1653-09
  year_of: '1653'
  type: military_campaign
  summary_zh: 定西侯张名振帅师北上，以兵部右侍郎张煌言为监军，入长江，趋丹阳，掠丹徒，左次崇明，冬尽乃还
- id: guji-张煌言-event-4
  date: '1654'
  year_of: '1654'
  type: military_campaign
  summary_zh: 甲午二月，张名振、监军张煌言帅师再入长江，掠瓜州，侵仪真，抵燕子矶而还
- id: guji-张煌言-event-5
  date: 1659-05
  year_of: '1659'
  type: military_campaign
  summary_zh: 己亥五月，郑成功全师北指，监军张煌言以所部前驱，入江抵瓜洲克其城，成功南攻镇江亦克之，江南北四府三州二十四县皆来降附
- id: guji-张煌言-event-6
  date: 1659-08
  year_of: '1659'
  type: retreat
  summary_zh: 会前锋败，成功仓猝移帐大溃乘流出海，煌言亦从间道归天台
- id: guji-张煌言-event-7
  date: 1659-06
  year_of: '1659'
  type: appointment
  summary_zh: 滇中遣使赍手敕仍命鲁王监国，加张煌言本部尚书兼东阁大学士
- id: guji-张煌言-event-death
  date: '1664'
  year_of: '1664'
  type: death
  summary_zh: 张煌言抗节不屈，就义于杭州
