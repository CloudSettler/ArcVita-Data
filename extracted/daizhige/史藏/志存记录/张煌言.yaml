  archetype: 抗清殉国忠臣
  dilemmas:
  - 屡败屡战，兵溃后间道归天台，继续海上抗清
  - 局促海隅、孤忠无援仍守节不降
  lesson: 立万世臣极，忠于所事，虽败犹荣
  summary_first_person: 我张煌言，鄞县举人，鲁王赐进士出身授翰林院编修，后官兵部尚书兼东阁大学士。我随张名振三入长江，又以监军前驱随郑成功北伐，克瓜洲、镇江，江南北四府三州二十四县皆来附；虽兵败间道归天台，抗节至死不渝。
  source_urls:
  - https://zh.wikisource.org/wiki/海东逸史
