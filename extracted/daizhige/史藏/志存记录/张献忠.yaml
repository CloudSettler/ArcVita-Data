      - 将军庙攀城
    start_date: 1642-06-03
    highlight_event_id: guji-张献忠-event-1642-luzhou
  decisions:
  - date: 1635-03-12
    title_zh: 见庐州灯火严守而解围西去
    rationale: 久攻北门南门不下守垛严密强攻徒损精锐不如流往巢县无为就食
  - date: 1642-06-02
    title_zh: 纳郭尚义暗袭之策夜取庐州
    rationale: 庐州经蝗旱人心思乱且学院临府懈防衔枚疾走可不损一矢而得大城
- id: guji-张献忠-endeavor-2
  title_zh: 谷城复叛诈取襄阳
  summary: 谷城受熊文灿招抚复叛入川脱杨嗣昌围困回湖广昼夜奔袭诈充官兵入襄阳杀襄王传檄污蔑官军致杨嗣昌自缢
  phases:
