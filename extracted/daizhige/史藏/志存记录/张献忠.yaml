    title_zh: 因密札泄露焚杀谷城复叛
    rationale: 兵备道密谋见执官民不容与其坐待受擒不如先发焚杀流窜
  - date: 1640-07-17
    title_zh: 诈称官兵回防夜袭襄阳
    rationale: 襄阳侦贼远去而怠守冒充官兵入城可不血刃而执藩王震动朝野
events:
- id: guji-张献忠-event-birth
  title_zh: 出生于陕北柳树涧
  date: 1606-09-18
  year_of: 1606
  location_zh: 陕西延安府柳树涧
  description: 明万历末生于陕北贫家少从军后因饥乱聚众为寇与李自成并称渠魁
- id: guji-张献忠-event-1635-luzhou
  title_zh: 初围庐州号铁庐州
  date: 1635-03-11
  year_of: 1635
  location_zh: 庐州府城
  description: 崇祯八年正月二十二日薄庐州城下挖水关穿地道攻北门月城为鲁弘道抵御田起潜发炮殪二大王张进嘉夜攻南门见灯火如昼叹为灯城铁庐州二十八日解围去陷巢县无为
- id: guji-张献忠-event-1640-xiangyang
  title_zh: 诈取襄阳杀襄王
  date: 1640-07-17
  year_of: 1640
  location_zh: 湖广襄阳府
  description: 自四川复出围襄阳数日佯退三百里复一昼夜驰回假充官兵进城执襄王杀之张榜诬杨嗣昌等受赂加官杨公闻之自缢于徐宅花园
- id: guji-张献忠-event-1642-luzhou
  title_zh: 夜袭再破庐州
  date: 1642-06-03
  year_of: 1642
  location_zh: 庐州府西门将军庙
  description: 据舒城得胜州纳桃城郭尚义计五月初六挑选精兵衔枚自小蜀山小路疾进三更自将军庙攀城斩守垛军开西门纵兵入城焚杀掳掠执余瑞紫拘营半载
- id: guji-张献忠-event-death
  title_zh: 殁于西充凤凰山
  date: 1647-01-02
  year_of: 1647
  location_zh: 四川西充凤凰山
  description: 据蜀称大西王后与清军战于西充中矢而殁经营四川数年终以屠戮失人心而败亡
