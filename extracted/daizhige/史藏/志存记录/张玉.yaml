person:
  qid: guji-张玉
  name_zh: 张玉
  names:
    zh: 张玉
    en: Zhang Yu
  lifespan:
    birth:
      date: '-1343'
      precision: circa
      is_circa: true
      raw: 生年不详
    death:
      date: '1400-12-26'
      precision: day
      is_circa: false
      raw: 建文二年十二月二十六日（东昌之战阵殁）
  birth_date: '-1343'
  death_date: '1400-12-26'
  era: 明初
  reign_ref: 明太祖洪武／明太宗（燕王）靖难起兵时期
  archetype: 靖难第一功臣、燕军帷幄统帅
  dilemmas:
  - 君臣伦理：朝廷削藩加兵亲藩，燕王起兵名分为“靖难”，张玉须抉择死忠建文还是辅佐燕王
  - 小挫与大局：小河之败诸将请旋师，而张玉力主以宗社为重、整兵前进（此处叙述重在朱能与燕王，张玉本人以谋略决进止）
  - 忠烈抉择：东昌之战不知燕王所在，突入敌阵力战被创而殁
  lesson: 谋定而后动、以得人心为本；临危不夺其志，虽殒身而功业垂于青史
  summary_first_person: 我本洪武旧将，累从征伐至黑松林、野人处，官至北平都指挥同知。建文初朝廷加兵亲藩，燕王举靖难之师，帷幄谋画悉以委我。我先定北平九门，取蓟州、遵化、密云、永平，献计擒潘忠、杨松于漠州，真定一役识耿炳文军无纪律而大破之，又请先袭大宁、捣李景隆之营，白沟河以逸待劳再破其百万之众，乘胜围济南、克沧州。东昌决战时燕王被围数匝，我突入敌阵求解，杀百数十人，被创而殁于十二月二十六日。后追封都督同知，再追封河间忠武王，imy子孙张辅亦以功封信安伯、进成国公。
  source_urls:
  - https://example.org/guji/jingnan-gongchen-lu
