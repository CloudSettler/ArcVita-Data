    title_zh: 以军法诛玩寇振肃自荷花海飞渡穷追
    rationale: 诸将疲于奔走因循玩寇当大明赏罚斩不用命者又舍险飞渡直捣曰丽茶偈爱子舍马徒步入暹蛮方可获季扩
events:
- id: guji-张辅-event-birth
  date: 1375
  year_of: 1375
  title_zh: 出生
  description: 洪武八年生于开国勋臣之家袭父爵为新城侯
- id: guji-张辅-event-1406-leading
  date: 1406-10-15
  year_of: 1406
  title_zh: 代朱能总兵入交南
  description: 永乐四年秋拜征夷右副将军九月大将军朱能薨于龙州奉敕代总其兵由凭祥入坡垒连破隘留鸡翎抵富良江北与沐晟会于三带
- id: guji-张辅-event-1407-pingding
  date: 1407-06-15
  year_of: 1407
  title_zh: 擒黎季犛父子平交南设三司
  description: 破多邦隘克东西二都追至闷海奇罗获黎季犛黎苍黎澄遍访陈氏无继请设交阯承宣布政使司都司按察司班师封英国公世袭
- id: guji-张辅-event-1408-qinjianding
  date: 1408-12-20
  year_of: 1408
  title_zh: 再征生擒简定
  description: 简定僭号大越作乱佩征虏副将军印自南宁入境破孔目栅碱子关太平海口至清化吉利栅生擒简定槛送京师
- id: guji-张辅-event-1414-qinjikuo
  date: 1413-11-10
  year_of: 1413
  title_zh: 擒陈季扩定交阯
  description: 复佩前印征陈季扩通神头海口夺常月堡飞渡荷花海破茶偈爱子江徒步入暹蛮蒲干擒季扩妻子首尾逾三年十三年镇交阯十五年诏还
- id: guji-张辅-event-death
  date: 1449-09-01
  year_of: 1449
  title_zh: 殁于土木王事
  description: 正统己巳随驾亲征殁于王事距平安南已三十七年
