  era: 西汉
  reign_ref: 汉武帝
  archetype: 凿空西域的外交探险家
  dilemmas:
  - 联络大月氏共击匈奴，却身陷匈奴十余年，持节不失
  - 欲通蜀身毒国道近便，然道为匈奴所隔，属臣力谏开西南夷道
  lesson: 坚守使命、历经艰险而不改其志，方能凿空万里、拓交流之路
  summary_first_person: 我张骞奉汉武帝之命出使西域，虽为匈奴所困十余年，然持汉节不失。自大夏还朝，我言身毒国即天竺，去蜀不远，通蜀身毒道既近又无害，遂再奉命通滇，为昆明之属开路，册张仁果为滇主，为汉家经营西南、西域奠定基础。
  source_urls:
  - https://zh.wikipedia.org/wiki/张骞
