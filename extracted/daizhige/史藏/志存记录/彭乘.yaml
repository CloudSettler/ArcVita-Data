    start_date: '1010'
    highlight_event_id: guji-彭乘-event-zhixian
  - key: climax
    name: 台馆近臣见闻朝政
    labels:
      zh: 观政存史
    start_date: '1030'
    highlight_event_id: guji-彭乘-event-chaoting
  - key: closure
    name: 修史守成归于恬退
    labels:
      zh: 修史守正
    start_date: '1050'
    highlight_event_id: guji-彭乘-event-death
  decisions:
  - date: '1008'
    title_zh: 应举登第不求捷径
    rationale: 以经术文章正途入仕，奠定州县馆阁历练之基
  - date: '1030'
    title_zh: 在朝谨记忠鲠优容之事
    rationale: 见仁庙纳包拯张升等直言，悟大圣慈厚之度，当直笔存之以劝后
- id: guji-彭乘-endeavor-2
  person_id: guji-彭乘
  title_zh: 撰墨客挥犀存世补史
  summary: 分卷记包拯寇准王旦欧阳修等名臣言行，兼录地理物产佛道异闻，成一家之笔记
  phases:
  - key: brewing
    name: 随手札记朝野见闻
    labels:
      zh: 积累素材
    start_date: '1035'
    highlight_event_id: guji-彭乘-event-chaoting
  - key: breakthrough
