    start_date: '1045'
    highlight_event_id: guji-彭乘-event-book
  - key: climax
    name: 墨客挥犀刊传于世
    labels:
      zh: 成书流传
    start_date: '1050'
    highlight_event_id: guji-彭乘-event-book
  - key: closure
    name: 以轶事补正史之阙
    labels:
      zh: 垂训后人
    start_date: '1055'
    highlight_event_id: guji-彭乘-event-death
  decisions:
  - date: '1045'
    title_zh: 以笔记体兼记人鬼物怪
    rationale: 正史不载细行小节，笔记可存风俗人心之真
  - date: '1050'
    title_zh: 褒忠鲠而隐恶扬善
    rationale: 如记王文正宽厚不发人过，欲使读者知厚德致福之理
