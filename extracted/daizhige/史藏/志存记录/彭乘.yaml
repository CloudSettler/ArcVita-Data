  archetype: 馆阁直笔型文臣
  dilemmas:
  - 朝野多讳言而史家当直书，如何在优容之下存忠鲠之实
  - 州县簿书繁冗而志怪轶闻易散，如何以笔记存一代风俗人心
  lesson: 温颜优纳未必无益，直书轶事亦可补史，宽厚存心而是非自见
  summary_first_person: 吾彭乘利建，华阳人，由进士历州县台馆，亲见仁庙优容谏臣之度，退而辑见闻为墨客挥犀，记名臣轶事与山川异物，欲以片言存世态，以宽厚成人之美
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%A2%A8%E5%AE%A2%E6%8C%A5%E7%8A%80.html
