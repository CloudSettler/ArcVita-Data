  - 仰仗官军会剿与自立约规均牛耕种之间既畏苛敛又需官威
  - 直书贼乱官失与顾全乡情宗族之间秉笔存史两难
  lesson: 治不生于治日而生于未乱之前，乱不作于乱日而作于苛纵之际，偏乡当团结固守均力尚勇并直记其事以鉴后车
  summary_first_person: 余生于吉康五云洞，亲见嘉靖以来耕读之盛转入隆万大乱，偕继周奋庸等立约守田心寨，具呈请官劳兵，岁考归途遇贼重伤，幸存归农，乃略记一治一乱之迹以俟后之君子
