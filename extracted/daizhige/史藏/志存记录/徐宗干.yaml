  - guji-徐宗干-endeavor-2
- id: guji-徐宗干-event-buji
  date: 1855
  year_of: 1855
  name_zh: 乙卯三月识于榕城五福巷旅馆
  detail_zh: 志抱残守阙之怀：风涛可畏、兵燹可危，尽心力之所能为而已；时毓闽侍侧读禹贡
