  detail_zh: 以按察使衔福建台湾兵备道兼理学政祭告城隍，自秋徂冬兵船覆溺、淡兰水溢、彰鹿地震，吁乞神佑、矢慎矢勤；此后辛亥、壬子晦日连年循例告祭
  related_endeavor_ids:
