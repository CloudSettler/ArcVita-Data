person:
  qid: guji-徐宗干
  name_zh: 徐宗干
  names:
    zh: 徐宗干
    en: Xu Zongan
  lifespan:
    birth:
      date: 1796
      precision: year
      is_circa: true
      raw: 约道光前二十年（文中乙巳年自述“年将半百”，逆推约生于1796年）
    death:
      date: 1866
      precision: year
      is_circa: true
      raw: 文中未载，据卒年通行记载约在同治年间
  birth_date: 1796
  death_date: 1866
  era: 清代
  reign_ref: 道光、咸丰
  archetype: 循吏兼学政——宦游四方、兴学教士、恤民弭乱的海外封疆能吏
  dilemmas:
  - 政事与课士难以兼顾：客问“政事得无荒否”，答以“校士与牖民，似不相谋而实相感”，坚持仕不忘学
  - 海外岩疆、四无援应：兵疲饷乏、天灾频仍，只能“因公无私”变通便宜行事
  - 先人遗书散佚与宦游漂泊：图籍随宦海风波屡遭飓风、兵燹、水湿虫啮，抱残守阙心力交瘁
  lesson: 仕不忘学，由文而行、由艺而德；举善劝民、化民成俗，虽历风涛兵燹而抱残守阙、尽心力而为
  summary_first_person: 我是徐宗干，江苏通州人。自道光辛巳筮仕山左，作吏二十年不废课士；中经蜀守、闽漳之擢，丁未奉恩命巡台湾，渡海视学海东书院，兼理兵备道学政。台地飓震盗乱相仍，我竭心力以收士心、联兵心、结民心；又谨将先人所著孝经正解校刊授读，虽图籍屡遭漂没焚毁，犹抱残守阙，期子子孙孙永宝之。
