  related_endeavor_ids:
  - guji-徐宗干-endeavor-1
- id: guji-徐宗干-event-ming-xun-tai
  date: 1847
  year_of: 1847
  name_zh: 丁未服阕，奉恩命巡台湾
  detail_zh: 丁未夏服阕甫出门即奉恩纶命巡台湾；行至清淮接命，折回赴苏领檄，即航海之任
  related_endeavor_ids:
  - guji-徐宗干-endeavor-2
- id: guji-徐宗干-event-dao-ren
  date: 1848
  year_of: 1848
  name_zh: 戊申渡海抵台任，校刊孝经正解授海东书院
