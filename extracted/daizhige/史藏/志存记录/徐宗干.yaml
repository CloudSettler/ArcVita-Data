  - guji-徐宗干-endeavor-2
- id: guji-徐宗干-event-death
  date: 1866
  year_of: 1866
  name_zh: 徐宗干卒
  detail_zh: 文中未载卒年，据通行记载约卒于同治五年（1866），姑系于此
