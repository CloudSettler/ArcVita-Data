  related_endeavor_ids:
  - guji-徐宗干-endeavor-2
- id: guji-徐宗干-event-neidu
  date: 1854
  year_of: 1854
  name_zh: 甲寅秋回帆至福州省垣，重为补缀
  detail_zh: 内渡抵榕城，重为补缀屏幅，复付装池；咸丰甲寅出台洋，镜帆同年由军中乞假旋里，畅言终日
