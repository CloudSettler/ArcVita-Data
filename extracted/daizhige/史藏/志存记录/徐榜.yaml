  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%AE%A6%E6%B8%B8%E6%97%A5%E8%AE%B0.html
endeavors:
- id: guji-徐榜-endeavor-1
  title_zh: 备兵辰沅绥靖苗疆
  summary: 受命入疆，巡历镇筸五靖，按视十卫十三哨，奖猛劝良，破塞擒生，并编谷战图以训将
  phases:
  - key: brewing
    name: 拜命入疆巡历观风
    labels:
      zh:
      - 巡历
      - 观风
    start_date: '1600'
    highlight_event_id: guji-徐榜-event-chenyuan
  - key: breakthrough
    name: 按视十卫十三哨作戒谕
    labels:
      zh:
      - 备兵
      - 戒谕
    start_date: '1605'
    highlight_event_id: guji-徐榜-event-chenyuan
  - key: climax
    name: 奖猛劝良犁庭扫穴
    labels:
      zh:
      - 剿抚
      - 军功
    start_date: '1606'
    highlight_event_id: guji-徐榜-event-chenyuan
  - key: closure
    name: 编谷战十图颁示训练
    labels:
      zh:
      - 阵法
      - 训练
    start_date: '1608'
    highlight_event_id: guji-徐榜-event-guzhan
  decisions:
  - date: '1605'
    title_zh: 作十三哨戒谕
    rationale: 营垒士卒器械武艺皆当整饬，禁克剥冒功偷安轻敌，以壮军威而恤士卒
  - date: '1608'
    title_zh: 编谷战图颁示诸将
    rationale: 苗疆崇山峻岭悬崖渊谷难用平原阵法，故取古名将阵图当于谷战者编为十图以为训练式
- id: guji-徐榜-endeavor-2
  title_zh: 自课立身著宦游日记
  summary: 以秉公保民训廉训勤自课僚属，以俭四益勤三益自在箴劝勉为治心治官之要
  phases:
  - key: brewing
    name: 以秉公保民立心
    labels:
      zh:
      - 秉公
      - 保民
    start_date: '1600'
    highlight_event_id: guji-徐榜-event-huanyou
  - key: breakthrough
    name: 以廉勤俭训官饬己
    labels:
      zh:
      - 训廉
      - 训勤
    start_date: '1605'
    highlight_event_id: guji-徐榜-event-huanyou
  - key: climax
    name: 随缘自在劝勉后学
    labels:
      zh:
      - 劝勉
      - 修身
    start_date: '1610'
    highlight_event_id: guji-徐榜-event-huanyou
  - key: closure
    name: 掇余刻宦游日记垂训
    labels:
      zh:
      - 著述
      - 垂训
    start_date: '1612'
    highlight_event_id: guji-徐榜-event-huanyou
  decisions:
  - date: '1610'
    title_zh: 立俭四益勤三益之训
    rationale: 贪淫生于奢侈，饥寒淫僻生于惰，故以俭养德寿神气，以勤免饥寒远淫僻致寿考
  - date: '1612'
    title_zh: 存自在箴与劝勉语
    rationale: 算计烦恼徒劳，不如随缘随分乐孔孟之道，故以淡立志刚制欲及时勇决为学
events:
- id: guji-徐榜-event-birth
  type: birth
  date: '1550'
  year_of: 1550
  is_circa: true
  title_zh: 出生
  description: 徐榜生于明嘉靖末年，号荐所，生地事迹不详，后登仕历官至方伯
- id: guji-徐榜-event-chenyuan
  type: career
  date: '1605'
  year_of: 1605
  is_circa: true
  title_zh: 备兵辰沅按视十卫十三哨
  description: 如沅州按视十卫十三哨，奖猛劝良策驽磨钝，作十三哨戒谕，三年间缚生擒而破八九塞
- id: guji-徐榜-event-guzhan
  type: career
  date: '1608'
  year_of: 1608
  is_circa: true
  title_zh: 作谷战图说颁示将领
  description: 巡历镇筸观风五靖，叹地势险阻，取古名将阵图当于谷战者编为十图且为之说以训将领
- id: guji-徐榜-event-huanyou
  type: career
  date: '1612'
  year_of: 1612
  is_circa: true
  title_zh: 自课著宦游日记
  description: 历官自课，以秉公保民训廉训勤俭四益勤三益自在箴劝勉等篇垂训，后人掇余刻为宦游日记
- id: guji-徐榜-event-death
  type: death
  date: '1630'
  year_of: 1630
  is_circa: true
  title_zh: 逝世
  description: 明末卒于家，著作有宦游日记及集中谷战图说小序等，武陵姚季问曾作辰沅道生祠记称其武功
