  birth_date: '1550'
  death_date: '1630'
  era: 明
  reign_ref: 明万历前后
  archetype: 廉勤方伯
  dilemmas:
  - 秉公与徇私亲故之间如何持心不偏
  - 保民恤士与严刑峻罚之间如何宽猛相济
  - 苗疆山险谷深之地面向征剿与绥靖如何抉择
  lesson: 秉公以生明，保民以存心，廉勤俭以养德养寿养神养气
  summary_first_person: 余徐榜，号荐所，前明方伯，备兵辰沅，历官以自课，平生以公廉勤俭保民为务，巡视十卫十三哨而作戒谕，取古阵图编为谷战十图以训将，余事掇为宦游日记以示后学
