    title_zh: 直捣齐化门一鼓克全城
    rationale: 元主已奔不战而取顺天命以复衣冠之治
- id: guji-徐达-endeavor-2
  title_zh: 再征沙漠定西破王保保
  description: 以征虏大将军出潼关经兰州追至定西大破扩廓帖木儿遂平沙漠论功封魏国公
  phases:
  - key: brewing
    name: 春正受命分兵两道
    labels:
