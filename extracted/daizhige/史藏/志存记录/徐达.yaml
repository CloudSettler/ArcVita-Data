    highlight_event_id: guji-徐达-event-3
  decisions:
  - date: 1370-01-01
    title_zh: 赞成分兵自潼关取保保
    rationale: 忘近趋远失缓急之宜当使彼此自救不暇应援
  - date: 1370-04-15
    title_zh: 逼虏营筑垒出峪陈兵决战
    rationale: 将校怀敌忾士卒愤超乘霆驱电掣以成大勋
