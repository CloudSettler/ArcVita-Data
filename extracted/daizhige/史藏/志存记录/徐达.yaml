endeavors:
- id: guji-徐达-endeavor-1
  title_zh: 北征克大都改北平
  description: 以征虏大将军率马步舟师自临清北进克通州大都改大都为北平府
  phases:
  - key: brewing
    name: 受命会师临清
    labels:
      zh: 会师北进
    start_date: 1368-07-01
    highlight_event_id: guji-徐达-event-1
  - key: breakthrough
    name: 进逼齐化一鼓克城
    labels:
      zh: 克城定都
    start_date: 1368-08-01
    highlight_event_id: guji-徐达-event-1
  - key: climax
    name: 捷闻改大都为北平
    labels:
      zh: 改置北平
    start_date: 1368-10-01
    highlight_event_id: guji-徐达-event-1
  - key: closure
    name: 振旅安抚华夏清宁
    labels:
      zh: 安定中原
    start_date: 1368-12-01
    highlight_event_id: guji-徐达-event-1
  decisions:
  - date: 1368-07-01
    title_zh: 会诸将马步舟师并进
    rationale: 乘元主无备红萝上都不设备以锐进取京城
