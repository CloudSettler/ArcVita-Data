  - key: climax
    name: 定西北逼虏营大捷
    labels:
      zh: 定西大捷
    start_date: 1370-04-15
    highlight_event_id: guji-徐达-event-2
  - key: closure
    name: 师还龙江上表封魏国公
    labels:
