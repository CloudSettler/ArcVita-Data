  - date: '1301-01-01'
    title_zh: 分军破寨助围城南
    rationale: 正南无军贼日出战，须补空缺断出路以促出降
  - date: '1301-03-05'
    title_zh: 力主留军住夏守贼
    rationale: 贼已困屈旦夕出降，住夏可竟全功，不可半途而废
events:
- id: guji-忙兀都鲁迷失-event-birth
  title_zh: 出生
  type: birth
  date: '1245'
  year_of: 1245
  description: 生年失考，蒙古出身，约十三世纪中叶生，后仕云南行省
- id: guji-忙兀都鲁迷失-event-death
  title_zh: 逝世
  type: death
  date: '1301-06-01'
  year_of: 1301
  description: 木连退军后愤恚以卒，大德五年八月杂问时已前死，子不得荫
- id: guji-忙兀都鲁迷失-event-plea
  title_zh: 为缅王讼冤请救
  type: career
  date: '1299-10-01'
  year_of: 1299
  description: 缅王子古马剌加失八来奔，陈阿散哥也囚弑之状，上言三罪擅废当救，否则效尤为乱
- id: guji-忙兀都鲁迷失-event-council
  title_zh: 赴阙议兵得旨增兵
  type: career
  date: '1300-05-15'
  year_of: 1300
  description: 正月召赴阙议兵事，五月奏请用兵，定以一万二千人，命阔阔监军，薛超兀儿刘德禄高阿康同事
- id: guji-忙兀都鲁迷失-event-siege
  title_zh: 进围木连三城
  type: career
  date: '1300-12-15'
  year_of: 1300
  description: 十月入缅，十二月会马来城，进围木连，分据东北西面，立排沙围城，破石山寨，贼困求降
- id: guji-忙兀都鲁迷失-event-retreat
  title_zh: 诸将擅还功败
  type: career
  date: '1301-02-28'
  year_of: 1301
  description: 章吉察儿等称病惧瘴不肯住夏，阿康察罕受赂倡还，分省力留不听，退军蒙来路还，朝廷所立缅王已送旧城而业废
