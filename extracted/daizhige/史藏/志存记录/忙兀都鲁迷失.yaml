  name_zh: 忙兀都鲁迷失
  names:
    zh: 忙兀都鲁迷失
    en: Mangwudu Lumishi
  lifespan:
    birth:
      date: '1245'
      precision: year
      is_circa: true
      raw: 生年失考，约十三世纪中叶
    death:
      date: '1301-06-01'
