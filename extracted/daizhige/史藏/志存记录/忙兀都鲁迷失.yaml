    title_zh: 上言缅臣三罪当救
    rationale: 缅王归朝十一年未违失，擅废不救则外国效尤为乱将至大患
  - date: '1300-05-15'
    title_zh: 请兵同僚监军
    rationale: 缅与八百媳妇通好力大，须重兵振威，同心协力以振兵威
- id: guji-忙兀都鲁迷失-endeavor-2
  title_zh: 围木连困贼而将溃
  description: 大德四年秋领兵入缅，围木连三城，贼困求降，将校受赂擅还功败
