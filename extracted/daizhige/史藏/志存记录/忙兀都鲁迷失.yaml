      raw: 大德五年秋杂问前已卒
  birth_date: '1245'
  death_date: '1301-06-01'
  era: 元
  reign_ref: 元成宗大德
  archetype: 忠勤边臣
  dilemmas:
  - 朝廷立国主被弑，救则劳师远征，不救则威信尽失效尤成患
  - 木连围困旦夕可下，住夏则瘴疠病军，将校受赂人心已散
  lesson: 远征必先肃号令慎选将校 otherwise 贼困而我溃，孤忠亦难挽贿败
  summary_first_person: 我为云南左丞，见缅臣阿散哥也兄弟擅废弑君，缅王子来奔讼冤，我力陈三罪当救，请朝廷问罪，亲随大军围木连，贼已困屈求降，诸将受赂称病擅还，功败垂成，我赍恨以没，惟望朝廷明辨以惩后
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%85%83%E6%9C%9D%E5%BE%81%E7%BC%85%E5%BD%95.html
