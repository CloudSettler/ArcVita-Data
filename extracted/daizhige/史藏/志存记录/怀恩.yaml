  dilemmas:
  - 宪宗欲易储，怀恩以免冠叩头死谏，冒死保孝宗之位
  - 林俊劾继晓下诏狱，怀恩以首承御砚、脱帽号哭力救谏官
  lesson: 身在宫闱而不阿君好，据理死争可定国本、全直臣。
  summary_first_person: 我本宦官，然宪庙欲易储时免冠叩头，宁死不奉诏；林俊下狱，我伏地号哭力救；万安进房中术，我持疏令其愧跪摘牌而去。孝宗之位得定，实我之力也。
  source_urls:
  - 近峰纪略·明·皇甫录
