  lesson: 面对武备废弛、倭寇猖獗的危局，唯有整军经武、智勇并用方能荡平祸乱
  summary_first_person: 我戚继光于嘉靖年间奉檄提兵入闽，破贼于福清、连江马鼻，会攻平海复兴化城，又大败倭于仙游，尽歼海坛余寇，终平闽海十余年倭患。
  source_urls:
  - 福州倭患始末记
