- id: guji-戚继光-event-fuqing
  entity_id: guji-戚继光
  type: endeavor
  title_zh: 嘉靖四十一年率兵入闽破贼于福清
  date: 1562-04
  year_of: 1562
  location_zh: 福建福清
  description_zh: 倭大举犯福建，巡抚游震得告急，浙督胡宗宪檄参将戚继光率都司戴冲霄、把总胡守仁剿之，破贼于福清，余党走兴化，闽宿寇几尽。
  source_refs:
  - 福州倭患始末记
- id: guji-戚继光-event-mabei
  entity_id: guji-戚继光
  type: endeavor
  title_zh: 破倭于连江马鼻百丈岩
  date: 1563-04
  year_of: 1563
  location_zh: 福建连江马鼻
  description_zh: 嘉靖四十二年四月，总兵戚继光至自浙（时入浙募兵），破倭于连江马鼻之百丈岩。
  source_refs:
  - 福州倭患始末记
- id: guji-戚继光-event-pinghai
  entity_id: guji-戚继光
  type: endeavor
  title_zh: 合攻平海复兴化城
  date: 1563-04
  year_of: 1563
  location_zh: 福建平海
  description_zh: 巡抚谭纶自将中军，总兵刘显、俞大猷将左右，合攻贼于平海；继光复以中军薄战，左右军继之，因风纵火，贼尽糜巢中，复兴化城。随后趋福州合击倭支党于长乐破之，倭悉遁去。
  source_refs:
  - 福州倭患始末记
- id: guji-戚继光-event-xianyou
  entity_id: guji-戚继光
  type: endeavor
  title_zh: 仙游大败倭寇
  date: 1563-11
  year_of: 1563
  location_zh: 福建仙游
  description_zh: 嘉靖四十二年十一月，倭复犯连江东岱堡并扰莆田、晋江等地，戚继光檄各卫所设疑兵防守，自与监军汪道昆屯兴化，进击之于仙游，大败之。
  source_refs:
  - 福州倭患始末记
- id: guji-戚继光-event-haitan
  entity_id: guji-戚继光
  type: endeavor
  title_zh: 尽歼海坛余倭
  date: 1564-05
  year_of: 1564
  location_zh: 福建海坛（今平潭）
  description_zh: 嘉靖四十三年贼续犯福清，戚继光尽擒斩之；五月尽歼屯海坛余倭。
  source_refs:
  - 福州倭患始末记
- id: guji-戚继光-event-biwei
  entity_id: guji-戚继光
  type: endeavor
  title_zh: 嘉靖四十四年分遣击倭于小埕诸港
  date: 1565-04
  year_of: 1565
  location_zh: 福建小埕、福安、宁德
  description_zh: 倭分港入寇，戚继光分遣击之，倭败遁入福安、宁德，昼伏夜行，间多饿毙；官兵搜山剿捕，无免者。论曰：微戚继光荡平之，其有宁宇耶？
  source_refs:
  - 福州倭患始末记
