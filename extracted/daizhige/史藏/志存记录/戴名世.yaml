  dilemmas:
  - 存旧闻以传信史还是避时讳以求自全
  - 重士友义气刊刻还是虑牵连众人而止笔
  lesson: 秉笔存史虽可敬，然当世讳深，辞气不慎则身族俱殒
  summary_first_person: 我桐城戴名世，少治古文，幸登第入翰林，喜览方孝标滇黔纪闻，采录成南山集以存故国旧事，不料尤云锷等捐资刊行，遂为赵申乔所劾，九卿会鞫以大逆论，寸磔市曹，族皆弃市，唯蒙圣祖恻然，全活牵连三百余人，吾身虽死，文狱之酷自此益深矣
  source_urls:
