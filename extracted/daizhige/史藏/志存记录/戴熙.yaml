  - 母病家累與聞警早避之抉擇
  - 偽館苟活與冒死出逃之抉擇
  - 滬上舉奸求功與全身避禍之抉擇
  lesson: 虎口竊印混出與江海流離皆賴審機忍辱方全性命以存信史
  summary_first_person: 吾客吳門逢庚申蘇州之陷奉母避鄰舍而身被擄入偽丞相館竊印備護照與四人冒險西南出閶門經楓橋典橋光福常熟福山航海至崇明再入滬指認周莊偽官不果後流寓江北佐幕聞蘇州克復而南返略記顛末以存劫灰
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%90%B4%E9%97%A8%E8%A2%AB%E9%9A%BE%E8%AE%B0%E7%95%A5.html
endeavors:
