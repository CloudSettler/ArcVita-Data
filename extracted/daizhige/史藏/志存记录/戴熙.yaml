    highlight_event_id: guji-戴熙-event-escape
  - key: breakthrough
    name: 滬上遇奸
    labels:
      zh: 白蕩灣投書道經蕭桃園跟蹤
    start_date: 1860-12-01
    highlight_event_id: guji-戴熙-event-shanghai
  - key: climax
    name: 道署舉告
    labels:
      zh: 吳煦派勇訪拿送上海縣
    start_date: 1860-12-03
    highlight_event_id: guji-戴熙-event-shanghai
  - key: closure
    name: 江北佐幕
    labels:
      zh: 渡海東台如皋厘卡佐幕返蘇
    start_date: 1862-05-01
    highlight_event_id: guji-戴熙-event-north
  decisions:
  - date: 1860-12-02
    title_zh: 入儲少荃館達吳煦舉奸
    rationale: 公然偽官出入滬城若能捕獲可保地方並雪私仇
  - date: 1862-05-01
    title_zh: 渡海江北投親佐幕
    rationale: 蘇垣未復崇川難久寄不如依季父表親謀厘卡自食
events:
- id: guji-戴熙-event-birth
  title_zh: 降生
  date: 1801-01-01
  year_of: 1801
  summary_zh: 嘉慶六年生於杭嘉湖間後客居蘇州
  location_zh: 浙江杭州
- id: guji-戴熙-event-suzhou-fall
  title_zh: 蘇州失守吳門被難
  date: 1860-06-02
  year_of: 1860
  summary_zh: 四月十三黎明不戰而城陷奉外祖母母妻子避後門鄰家小屋見擄掠溺斃焚屍滿河
  location_zh: 江蘇蘇州葑門
- id: guji-戴熙-event-captive
  title_zh: 被擄偽丞相館任筆墨
  date: 1860-06-04
  year_of: 1860
  summary_zh: 四月十四辰刻被擄充小夫後以書紅黃旗見喜尊為先生專職筆墨領眾二十餘日
  location_zh: 江蘇蘇州北街偽丞相館
- id: guji-戴熙-event-escape
  title_zh: 五月二十一日黎明脫虎口
  date: 1860-07-09
  year_of: 1860
  summary_zh: 竊偽印備護照與四人扮賊持械由閶門半扃得出經僧橋楓橋典橋團局薙髮至觀音山許何德家
  location_zh: 江蘇蘇州閶門至觀音山
- id: guji-戴熙-event-shanghai
  title_zh: 上海指認周莊偽官
  date: 1860-12-01
  year_of: 1860
  summary_zh: 自周莊抵滬於東門大街復遇葛姓跟蹤至蕭桃園張公館告儲少荃轉稟吳煦訪拿送縣為薛煥所縱
  location_zh: 上海蕭桃園道署
- id: guji-戴熙-event-north
  title_zh: 江北流寓佐幕聞蘇州克復
  date: 1864-11-01
  year_of: 1864
  summary_zh: 渡海東台興化如皋佐章均堂厘卡甲子聞蘇垣克復偕友返蘇後搭輪赴粵佐幕丙寅抵浙
  location_zh: 江蘇東台至廣東浙江
- id: guji-戴熙-event-death
  title_zh: 逝世
  date: 1867-01-01
  year_of: 1867
  summary_zh: 丙寅抵浙後不久病逝流離終老
  location_zh: 浙江
