    highlight_event_id: guji-戴熙-event-suzhou-fall
  - key: breakthrough
    name: 被擄入館
    labels:
      zh: 偽丞相館充夫轉任筆墨
    start_date: 1860-06-04
    highlight_event_id: guji-戴熙-event-captive
  - key: climax
    name: 竊印謀逃
    labels:
      zh: 私印護照結盟紅牌支更
    start_date: 1860-07-08
    highlight_event_id: guji-戴熙-event-escape
  - key: closure
    name: 輾轉得脫
    labels:
      zh: 出閶過楓橋典橋投觀音山
    start_date: 1860-07-09
    highlight_event_id: guji-戴熙-event-escape
  decisions:
  - date: 1860-06-04
    title_zh: 以書法應偽館筆墨求生
    rationale: 不屬惡管以筆墨自全免受鞭辱且得自由竊印
  - date: 1860-07-09
    title_zh: 乘隙扮賊持護照出逃
    rationale: 我兵無信息久留非計不如乘督更熟睡冒險西南行
- id: guji-戴熙-endeavor-2
  title_zh: 滬上辨奸江北流寓
  summary_zh: 自崇明入滬認出周莊偽官葛姓赴道署舉告不果轉赴江北佐幕
  phases:
  - key: brewing
    name: 航海寄崇
    labels:
      zh: 福山遭風苑港投友渡崇
