  dilemmas:
  - 以进献声色固宠邀功还是守正拒贿
  - 园破兵至委身求活还是投水殉节
  lesson: 以私媚固宠虽赫赫一时终召祸临难一死始全节
  summary_first_person: 我世守圆明园咸丰朝继任总管因进四春得宠交通粤商广纳贿赂权倾一时及英法兵至我当门拒兵不成遣散嫔御投福海以殉惟以一死谢先帝耳
  source_urls:
