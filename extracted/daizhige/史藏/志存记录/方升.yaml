  dilemmas:
  - 少慕武当奇胜欲往观而无一乘之便
  - 督屯唐邓近在望而守境不敢越以劝邑
  - 既提调宫事览山川宫观之盛而旧志夸饰失实欲正之又惧灾木
  lesson: 守官不越境而尽职在事既受命则周览实测直书山川宫室之胜以传信来者
  summary_first_person: 吾少时即闻武当奇胜甲天下尝裹粮欲往竟无便而止嘉靖癸巳督屯唐邓庶几望见诸宫又不敢越境甲午奉提调命乃得指挥其宫事明年三月既至遍观太和南岩紫霄五龙玉虚诸宫既归览旧志多夸乃缀拾见闻为五卷丙申长至刻之以授工
  source_urls:
