events:
- id: guji-方士淦-event-birth
  date: '1785'
  year_of: 1785
  title_zh: 方士淦约生
  description: 清乾隆间生，籍贯未详，后以幕僚游历西北
  place_zh: 内地
- id: guji-方士淦-event-xizheng
  date: '1826-09-01'
  year_of: 1826
  title_zh: 随杨遇春大军过安西至哈密
  description: 丙戌八月随杨宫保大军过苦水长流水，九月初抵哈密，见办事大臣恒敬及杨芳，识西路水泉为行军命脉
  place_zh: 哈密
- id: guji-方士淦-event-yili
  date: '1826-12-01'
  year_of: 1826
  title_zh: 抵伊犁经果子沟松树塘
  description: 子月过果子沟大雪弥漫，夜抵二台，又观松树塘关帝庙姜行本碑，留伊犁惠远城
  place_zh: 伊犁惠远城
- id: guji-方士淦-event-donggui
  date: '1828-03-15'
  year_of: 1828
  title_zh: 自伊犁惠远城东归起身
  description: 道光戊子三月十五未时自惠远城起身，经绥定果子沟达坂松树塘海子，向乌鲁木齐而行
  place_zh: 伊犁惠远城
- id: guji-方士淦-event-wulumuqi
  date: '1828-04-04'
  year_of: 1828
  title_zh: 抵乌鲁木齐拜晤僚友
  description: 初四到乌鲁木齐，见英惠晤张文浩张金，初十二赴古牧地阜康，观巴克达山天池
  place_zh: 乌鲁木齐
- id: guji-方士淦-event-hami
  date: '1828-04-28'
  year_of: 1828
  title_zh: 经巴里坤南山口抵哈密
  description: 经奇台穷八站至巴里坤，观蒲类海市岳台黑沟，过松树塘南山口，一百二十里至哈密，晤办事大臣恩铭
  place_zh: 哈密
- id: guji-方士淦-event-xian
  date: '1828-06-30'
  year_of: 1828
  title_zh: 过兰州抵西安东归日记成
  description: 出嘉峪经肃州甘州凉州，渡黄河至兰州，经营秦陇，六月三十抵省城西安，综全程为东归日记
  place_zh: 西安
- id: guji-方士淦-event-death
  date: '1845'
  year_of: 1845
  title_zh: 方士淦卒
  description: 东归后行迹不详，道光末约卒，遗东归日记传世
  place_zh: 内地
