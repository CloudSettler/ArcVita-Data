      precision: year
      is_circa: false
      raw: 宣和三年四月二十六日被擒后处死（生擒于梓桐石坑）
  birth_date: ''
  death_date: '1121'
  era: 北宋末年（宣和年间）
  reign_ref: 宋徽宗宣和二年（1120）
  archetype: 起义领袖
  dilemmas:
  - 以明教/左道聚众起事，虽揭官府苛剥之弊，然兵燹所及，江南民生日凋
  lesson: 官吏苛敛与花石纲之扰酿成民变，.validators 息患于未萌者良有司也
  summary_first_person: 我方腊以漆园被造作局酷取，怨愤久积，遂托左道惑众，自号圣公、改元永乐，以诛朱勔为名起兵，旬日聚众十万，连陷睦、歙、杭诸州；然童贯大军南下，帮源洞力战败绩，我为韩世忠（时为王渊裨将）所擒，身死而江南凋敝。
  source_urls:
  - https://zh.wikisource.org/wiki/青溪寇轨
endeavors:
- id: guji-方腊-endeavor-1
  name_zh: 起兵反宋（宣和之乱）
  phases:
  - key: brewing
    name_zh: 结众蓄势
    labels:
      zh: 借天子基传说与吃菜事魔之众，赈恤结纳贫乏游手之徒
    start_date: 1120-10
    highlight_event_id: guji-方腊-event-uprising
  - key: breakthrough
    name_zh: 连陷州县
    labels:
      zh: 陷青溪、睦州、歙州、杭州，众殆百万
    start_date: 1120-11
    highlight_event_id: guji-方腊-event-take-hangzhou
  - key: climax
    name_zh: 官军反攻
    labels:
      zh: 秀州、清河堰屡败，退据杭州后溃
    start_date: 1121-01
    highlight_event_id: guji-方腊-event-xiuzhou-defeat
  - key: closure
    name_zh: 帮源洞被擒
    labels:
      zh: 韩世忠从野径入穴，擒腊以出
    start_date: 1121-04
    highlight_event_id: guji-方腊-event-captured
  decisions:
  - date: 1120-10
    title_zh: 自号圣公、改元永乐，建置将吏
    rationale: 托左道惑众，借梓桐天子基、万年楼之说与宝志识记收束人心
  - date: 1120-11
    title_zh: 以诛朱勔为名，杀官吏公使人
    rationale: 花石纲与造作局酷取激起民怨，因民不忍而举事
  - date: 1121-02
    title_zh: 弃杭州宵遁
    rationale: 清河堰水陆战败，斩贼二万，势不可支
events:
- id: guji-方腊-event-birth
  date: ''
  year_of: 0
  title_zh: 方腊出生
  description: 生年无考；尝临溪顾影，自见冠服如王者，由此自负。
- id: guji-方腊-event-uprising
  date: 1120-10
  year_of: 1120
  title_zh: 睦州青溪起兵，自号圣公改元永乐
  description: 宣和二年十月，于青溪县碣村托左道惑众起事，以巾饰为别，红巾而上凡六等，聚众数千。
- id: guji-方腊-event-xikeng
  date: 1120-11-29
  year_of: 1120
  title_zh: 息坑之战杀蔡遵，陷青溪县
  description: 十一月二十九日，将领蔡遵与战于息坑死之，遂陷青溪县，旬日有众数万。
- id: guji-方腊-event-take-muzhou
  date: 1120-12-04
  year_of: 1120
  title_zh: 陷睦州
  description: 十二月初四日攻陷睦州。
- id: guji-方腊-event-take-shexian
  date: 1120-12-13
  year_of: 1120
  title_zh: 陷歙州，取桐庐新城富阳
  description: 曾孝蕴移知青社，守御无策，十三日陷歙州，乘势取桐庐、新城、富阳等县。
- id: guji-方腊-event-take-hangzhou
  date: 1120-12-29
  year_of: 1120
  title_zh: 陷杭州，纵火六日
  description: 知州赵霆弃城走，陈建、赵约被害；贼纵火六日，官吏居民死者十三。
- id: guji-方腊-event-xiuzhou-defeat
  date: 1121-01-24
  year_of: 1121
  title_zh: 秀州之战大败
  description: 宣和三年正月二十四日，贼将七佛攻秀州，王子武与州民固守，合击斩首九千，贼退据杭州。
- id: guji-方腊-event-qinghe-defeat
  date: 1121-02-07
  year_of: 1121
  title_zh: 清河堰战败
  description: 二月初七日，王师水陆并进，战六日斩贼二万；十八日贼再焚官舍，翌日宵遁，大兵入城。
- id: guji-方腊-event-captured
  date: 1121-04-26
  year_of: 1121
  title_zh: 帮源洞力战败，被擒
  description: 四月二十六日，韩世忠（时为王渊裨将）潜行问径，直前搏其穴，生擒方腊及妻邱、子亳二太子等五十二人。
- id: guji-方腊-event-death
  date: 1121
  year_of: 1121
  title_zh: 兵败被擒，身死乱平
  description: 被擒后伏诛，余党朱言、吴邦、吕师囊等至宣和四年三月讨平，共收六州五十二县。
