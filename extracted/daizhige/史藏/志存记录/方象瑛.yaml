- id: guji-方象瑛-event-fengming
  title_zh: 奉命典试四川宣旨
  date: '1683-06-08'
  year_of: 1683
  place_zh: 北京
  description_zh: 康熙二十二年闰六月初八宣旨，以词臣特命与王材往典四川乡试
- id: guji-方象瑛-event-fangbang
  title_zh: 成都放榜取士
  date: '1683-09-24'
  year_of: 1683
  place_zh: 成都
  description_zh: 初六入闱，初九初试，取中樊泽达等四十二人，副榜雷弘震等八人，蜀称得人
- id: guji-方象瑛-event-donggui
  title_zh: 发成都浮江东归
  date: '1683-11-07'
  year_of: 1683
  place_zh: 成都
  description_zh: 初五辞行，初七发成都，历眉州嘉定叙州泸州而东下，作使蜀日记
- id: guji-方象瑛-event-death
  title_zh: 约卒于康熙后
  date: '1700'
  year_of: 1700
  place_zh: 遂安
  description_zh: 使蜀后事迹不详，约卒于康熙末年
