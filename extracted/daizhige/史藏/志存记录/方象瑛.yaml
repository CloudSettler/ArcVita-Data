  role_zh: 纪行作者
  start_date: '1683-07-01'
  end_date: '1683-11-26'
  summary_zh: 自京师经晋秦栈道入蜀，游历成都眉嘉，记道里山川祠墓而成日记
  phases:
  - key: brewing
    name: 力疾西行记程
    labels:
      zh:
