  decisions:
  - date: '1683-09-09'
    title_zh: 小误悉免议勿轻涂乙
    rationale: 蜀久未举试，老吏无存，新例未习，欲全远人向学之心
  - date: '1683-09-19'
    title_zh: 以赢卷通融房额求真才
    rationale: 取士务真才，何论彼此房额，鬼神亦怒佳卷沉沦
