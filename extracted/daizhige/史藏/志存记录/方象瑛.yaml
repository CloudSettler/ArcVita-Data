    start_date: '1683-07-01'
    highlight_event_id: guji-方象瑛-event-fengming
  - key: breakthrough
    name: 越太行渡黄河入栈
    labels:
      zh:
      - 山川险阻
    start_date: '1683-07-08'
    highlight_event_id: guji-方象瑛-event-fangbang
  - key: climax
    name: 览蜀都访古吊贤
    labels:
      zh:
      - 怀古览胜
    start_date: '1683-09-02'
    highlight_event_id: guji-方象瑛-event-fangbang
  - key: closure
    name: 浮江东归成书
    labels:
      zh:
      - 归程成帙
    start_date: '1683-11-07'
    highlight_event_id: guji-方象瑛-event-donggui
  decisions:
  - date: '1683-07-06'
    title_zh: 使命在身不往哭故人
    rationale: 施愚山殁京邸，以王事迫不得往哭，作诗纪哀以全忠私两尽
  - date: '1683-09-02'
    title_zh: 虎狼攫人不设关防
    rationale: 民居篱落不蔽，何关防为，示镇静以安远人
events:
