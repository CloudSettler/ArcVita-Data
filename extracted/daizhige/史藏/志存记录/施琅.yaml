endeavors:
- id: guji-施琅-endeavor-1
  title_zh: 专征澎湖受降台湾
  summary: 矢策专征，缮舟训兵，自铜山进师，澎湖血战焚舟破垒，遂进鹿耳门赤嵌受降，廓清海疆
  phases:
  - key: brewing
    name: 受命筹划
    labels:
      zh:
      - 筹划
    start_date: 1681
    highlight_event_id: guji-施琅-event-penghu
  - key: breakthrough
    name: 澎湖决战
    labels:
      zh:
      - 决战
    start_date: 1683-06-14
    highlight_event_id: guji-施琅-event-penghu
  - key: climax
    name: 鹿耳门受降
    labels:
      zh:
      - 受降
    start_date: 1683-08-18
    highlight_event_id: guji-施琅-event-taiwan
  - key: closure
    name: 礼遣安插班师
    labels:
      zh:
      - 安集
    start_date: 1683-12-01
    highlight_event_id: guji-施琅-event-taiwan
  decisions:
  - date: 1683-06-22
    title_zh: 申明军令再战澎湖
    rationale: 首战风息潮退难进，暂收八罩，整旅再发，以炮火焚其舟而破其垒，一举荡平
  - date: 1683-08-18
    title_zh: 入鹿耳门秋毫无犯
    rationale: 纳款之后台人即吾人，严禁侵扰民间一丝一枲，市不易肆，礼遣降王入京，散难民归里
- id: guji-施琅-endeavor-2
  title_zh: 力请设郡县勒石纪功
  summary: 战后力排弃台之议，请置郡县设官戍守，减赋安民，留镇弹压，勒平台纪略与功德碑以垂永久
  phases:
  - key: brewing
    name: 上奏陈留台利害
    labels:
      zh:
      - 经略
    start_date: 1683-09-01
    highlight_event_id: guji-施琅-event-taiwan
  - key: breakthrough
    name: 置一府三县
    labels:
      zh:
      - 建制
    start_date: 1684-01-01
    highlight_event_id: guji-施琅-event-jilue
  - key: climax
    name: 勒平台纪略碑
    labels:
      zh:
      - 纪功
    start_date: 1685-02-01
    highlight_event_id: guji-施琅-event-jilue
  - key: closure
    name: 功德碑传颂十年
    labels:
      zh:
      - 遗爱
    start_date: 1693-01-01
    highlight_event_id: guji-施琅-event-jilue
  decisions:
  - date: 1683-10-01
    title_zh: 力请不弃台湾
    rationale: 台去内地千里户逾十万，若弃则鸠鹄无归且为逋逃渊薮，宜籍为郡县分水陆要地戍守
  - date: 1685-02-01
    title_zh: 撰平台纪略勒石天后宫
    rationale: 炎徼僻壤新入版图，推恩陶俗销兵气以光文治，端有望于官斯土者，不可无记
events:
- id: guji-施琅-event-birth
  date: 1621
  year_of: 1621
  title_zh: 生于泉州晋江
  description: 明天启元年生于晋江，字琢公，少习水师，后归清任水师提督
- id: guji-施琅-event-penghu
  date: 1683-07-08
  year_of: 1683
  title_zh: 澎湖海战大捷
  description: 自铜山进师直抵八罩，六月二十二日扬帆齐发，将士用命尽焚伪舟而破其垒，伪军全没，捞起俘伤八百余施药给粮纵还
- id: guji-施琅-event-taiwan
  date: 1683-08-18
  year_of: 1683
  title_zh: 鹿耳门赤嵌受降
  description: 八月望日直进鹿耳门赤嵌泊舰登岸受降，兵不血刃，礼遣降王入京，伪官兵载入内地安插，遂以冬月班师
- id: guji-施琅-event-jilue
  date: 1685-02-01
  year_of: 1685
  title_zh: 立平台纪略碑
  description: 康熙二十四年正月立碑纪平台始末，请置郡一县三设官戍守赋税减半，碑龛台南大天后宫，为全台最古碑碣之一
- id: guji-施琅-event-death
  date: 1696
  year_of: 1696
  title_zh: 卒于京师
  description: 康熙三十五年卒，封靖海侯世袭罔替，台湾士民感德十年勒功德碑颂其勋泽
