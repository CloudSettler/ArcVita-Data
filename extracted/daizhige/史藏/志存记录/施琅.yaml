  - 专征群议畏海难进与坚持缮舟训兵决战澎湖之难
  - 台湾去留弃守与力请设郡县永固海疆之难
  - 破敌之后妄杀泄愤与疗俘纵还安集人心之难
  lesson: 以精诚任事而好生，以远略固疆而安民，武功成于纪律，文治始于学校
  summary_first_person: 余泉州晋江人，少历明郑而归清，奉命专征福建水师，誓师铜山，决战澎湖，八月直进鹿耳门受降，平定台湾，力请置一府三县，留镇安集而班师，勒平台纪略以志之
