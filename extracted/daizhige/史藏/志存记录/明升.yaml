events:
- id: guji-明升-event-birth
  title_zh: 出生于重庆明氏之家
  date: '1356'
  year_of: 1356
  place_zh: 重庆
  description_zh: 元至正十六年明玉珍之子明升生为夏国嗣主之幼冲之资
- id: guji-明升-event-succession
  title_zh: 幼冲嗣位据有巴蜀
  date: '1366'
  year_of: 1366
  place_zh: 重庆
  description_zh: 明玉珍没明升年幼嗣位据巴蜀疆场南不过播州北不及汉中默然在位听群下之议
- id: guji-明升-event-resist-edict
  title_zh: 拒杨璟谕并犯兴元
  date: 1371-01
  year_of: 1371
  place_zh: 重庆
  description_zh: 洪武四年春正月明太祖告伐遣使开谕明升牵于群议不能决惑群言反以兵犯兴元虽败衂而去终致分道并进
- id: guji-明升-event-fall-jiewen
  title_zh: 阶文失守汉州亦拔
  date: 1371-03
  year_of: 1371
  place_zh: 阶州文州汉州
  description_zh: 傅友德潜师直捣阶文丁世珍败遁阶文俱克继而造舟逼汉州戴寿大败汉州拔蜀人解体
- id: guji-明升-event-surrender-chongqing
  title_zh: 重庆铜锣峡面缚衔璧降
  date: 1371-07
  year_of: 1371
  place_zh: 重庆铜锣峡
  description_zh: 廖永忠破瞿塘焚三桥断铁索抵重庆明升从母彭氏言遣使请降踰旬汤和至会兵城下面缚衔璧诣军门降和受璧永忠解缚抚慰
- id: guji-明升-event-audience-nanjing
  title_zh: 送至京师授归义侯
  date: 1371-09
  year_of: 1371
  place_zh: 南京奉天殿
  description_zh: 九月汤和等送明升并降表至京省部议受降礼太祖悯其年幼免伏地待罪朝见毕授爵归义侯赐冠带衣服第宅于京师
- id: guji-明升-event-death
  title_zh: 卒于京师存祀而终
  date: '1391'
  year_of: 1391
  place_zh: 京师
  description_zh: 明洪武二十四年归义侯明升卒保先人之祀而终全蜀自冬十月保宁下后悉定
