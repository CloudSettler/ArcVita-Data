person:
  qid: guji-明玉珍
  name_zh: 明玉珍
  names:
    zh: 明玉珍
    en: Ming Yuzhen
  lifespan:
    birth:
      date: 1331
      precision: year
      is_circa: true
      raw: 以天统五年丙午春卒年三十六推算
    death:
      date: 1366
      precision: year
      is_circa: false
      raw: 天统五年丙午春卒于重庆
  birth_date: 1331
  death_date: 1366
  era: 元末明初
  reign_ref: 大夏天统
  archetype: 农家出身的开国君主
  dilemmas:
  - 沔阳连岁饥困是安守汉阳旧命还是分船入蜀觅粮兼图重庆
  - 陈友谅弑徐寿辉后是继续听命还是绝夔关自立门户
  - 据巴蜀沃野是久为陇蜀王以待时还是即大号以系四方军心
  lesson: 困则思变而后能立国，立国必先安民、定赋、设学、明礼，方能由驱除而致大治
  summary_first_person: 吾本随州玉沙村农家子，目有重瞳，乡里有讼多来质成，汝颍兵起乃团乡里屯青山，后归徐寿辉镇沔阳，岁饥率斗船上夔州哨粮，因缘入重庆禁侵掠而安蜀人，遂绝陈友谅而立庙旧主，即位于重庆国号大夏改元天统，定赋十取一，廷试进士，置六卿郊社，经营西南五年而终
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%B9%B3%E5%A4%8F%E5%BD%95.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%B9%B3%E5%A4%8F%E5%BD%95.md
endeavors:
- id: guji-明玉珍-endeavor-1
  title_zh: 由青山屯长转战入蜀夺取重庆
  role: 屯长至陇蜀省右丞
  summary: 自青山团结乡里归汉授元帅镇沔阳，因饥上夔州哨粮，遇杨汉旧部诉完者都之变，分船半载粮还沔阳半攻重庆，夜遁完者都生获哈林秃，入城禁掠四方来降，遂据巴蜀上游
  phases:
  - key: brewing
    name: 青山团结乡里为屯长
    labels:
      zh:
      - 团练乡里
      - 保境安民
    start_date: 1351
    highlight_event_id: guji-明玉珍-event-congregate-qingshan
  - key: breakthrough
    name: 归汉授元帅镇沔阳
    labels:
      zh:
      - 归附授官
      - 湖中鏖战
    start_date: 1353-11-01
    highlight_event_id: guji-明玉珍-event-join-han
  - key: climax
    name: 分船西上夺取重庆
    labels:
      zh:
      - 哨粮巫峡
      - 奇取重庆
    start_date: 1357-03-01
    highlight_event_id: guji-明玉珍-event-take-chongqing
  - key: closure
    name: 御嘉定得刘祯为谋主
    labels:
      zh:
      - 守嘉定
      - 礼贤理问
    start_date: 1358-02-01
    highlight_event_id: guji-明玉珍-event-defend-jiading
  decisions:
  - date: 1357-03-01
    title_zh: 纳戴寿言分船两用攻重庆
    rationale: 沔阳饥困远来觅粮，若半载粮还乡半因汉兵攻重庆，济则据上游，不济亦可归，无损而有大利，故犹豫转从
  - date: 1358-02-01
    title_zh: 舟中拜刘祯为理问官
    rationale: 道出泸州闻刘祯能文章政事，可就见不可屈致，讲论得孔明之喜，遂邀至舟中共议国事以图治蜀
- id: guji-明玉珍-endeavor-2
  title_zh: 绝陈氏自立建号大夏治蜀
  role: 陇蜀王至大夏皇帝
  summary: 陈友谅弑徐寿辉即斥其杀逆，令守夔关绝不与通，为寿辉立庙，纳刘祯策于壬寅春即位于重庆，国号大夏改元天统，仿周设六卿，立后储，设国子监提举司，去释老奉弥勒，定赋十取一，廷试进士置雅乐郊社，分镇成都保宁夔门，遣使通聘四方
  phases:
  - key: brewing
    name: 绝陈友谅奉旧主立庙
    labels:
      zh:
      - 讨逆绝交
      - 守关立庙
    start_date: 1360
    highlight_event_id: guji-明玉珍-event-break-chen
  - key: breakthrough
    name: 重庆即位建号大夏
    labels:
      zh:
      - 即位改元
      - 六卿建制
    start_date: 1362-03-01
    highlight_event_id: guji-明玉珍-event-found-daxia
  - key: climax
    name: 定赋取一廷试开科
    labels:
      zh:
      - 轻赋息民
      - 设学取士
    start_date: 1362-06-01
    highlight_event_id: guji-明玉珍-event-found-daxia
  - key: closure
    name: 分镇全蜀遣将略滇
    labels:
      zh:
      - 分镇守土
      - 远略云南
    start_date: 1363-12-08
    highlight_event_id: guji-明玉珍-event-campaign-yunnan
  decisions:
  - date: 1360
    title_zh: 绝不与陈友谅通为寿辉立庙
    rationale: 陈倪同为徐朝臣子而弑主自立，名分已逆，若听命则失义，若讨之则系人心，故守夔关绝交通以明大义
  - date: 1362-03-01
    title_zh: 纳刘祯言称大号以系人心
    rationale: 西蜀形胜而民物凋耗，军士多四方之人，若无大号人心易散，称号方能抚养收心以应天命，故咨众即位改元
events:
- id: guji-明玉珍-event-birth
  person_id: guji-明玉珍
  title_zh: 生于随州玉沙村农家
  date: 1331
  year_of: 1331
  kind: birth
  description: 随州玉沙村人，家世务农，身长八尺目重瞳子，乡闾有讼皆往质成，以卒年三十六逆推约生于此年前后
- id: guji-明玉珍-event-congregate-qingshan
  person_id: guji-明玉珍
  title_zh: 团结里中屯于青山众推屯长
  date: 1351
  year_of: 1351
  kind: career
  description: 至正辛卯汝颍兵起，团结里中人屯于青山，众推为屯长，始起兵于乡里
- id: guji-明玉珍-event-join-han
  person_id: guji-明玉珍
  title_zh: 归汉阳授元帅镇沔阳失右目
  date: 1353-11-01
  year_of: 1353
  kind: career
  description: 癸巳冬十一月徐寿辉僭号都汉阳遣使招致，授元帅益兵镇沔阳，与元将哈林秃连战湖中飞矢中右目，人呼旻眼子
- id: guji-明玉珍-event-take-chongqing
  person_id: guji-明玉珍
  title_zh: 因巫峡之会攻入重庆献俘汉阳
  date: 1357-03-01
  year_of: 1357
  kind: career
  description: 乙未上夔州哨粮至巫峡，丁酉春遇杨汉旧部诉完者都杀帅并军，分船半还沔阳半攻重庆，完者都夜遁果州生获哈林秃，入城禁侵掠献俘汉阳，是岁秋授陇蜀省右丞
- id: guji-明玉珍-event-defend-jiading
  person_id: guji-明玉珍
  title_zh: 御完者都复重庆陷嘉定遇刘祯
  date: 1358-02-01
  year_of: 1358
  kind: career
  description: 戊戌春完者都屯嘉定大佛寺规复重庆，使义弟明二御之相持半载，亲率兵继之旬日内溃入城，执赵资等以礼葬之，道出泸州经刘泽民引见刘祯舟中拜理问官
- id: guji-明玉珍-event-break-chen
  person_id: guji-明玉珍
  title_zh: 斥陈友谅弑主绝交通推为陇蜀王
  date: 1360
  year_of: 1360
  kind: career
  description: 己亥贡汉阳，庚子春陈友谅杀徐寿辉自立，斥其杀逆令莫仁寿守夔关绝不与通，为寿辉立庙城南，众推为陇蜀王
- id: guji-明玉珍-event-found-daxia
  person_id: guji-明玉珍
  title_zh: 即位于重庆国号大夏改元天统
  date: 1362-03-01
  year_of: 1362
  kind: career
  description: 纳参谋刘祯言咨谋于众，以壬寅春三月戊辰即位于重庆，国号大夏改元天统，设六卿翰林国子监提举司，立彭氏为后子升为太子，定赋十取一无力役之征，秋廷试赐董重璧等及第，置雅乐立郊社
- id: guji-明玉珍-event-campaign-yunnan
  person_id: guji-明玉珍
  title_zh: 命万胜等三道攻云南抵滇池而还
  date: 1363-12-08
  year_of: 1363
  kind: career
  description: 天统二年命司马万胜由界首入邹兴由建昌入芝麻李由八番入，兵不满万以一当十，十二月八日抵云南梁王走屯金马山，招安降者日至获象以献，遇援孤军战伤留聂千户守建水引还
- id: guji-明玉珍-event-death
  person_id: guji-明玉珍
  title_zh: 卒于重庆子升袭位改元开熙
  date: 1366
  year_of: 1366
  kind: death
  description: 天统五年丙午春卒于重庆，年三十六岁，子升年十岁袭位改元开熙，尊母彭氏为皇太后，是冬太祖遣使通聘论恢复中原
