person:
  qid: guji-易先
  name_zh: 易先
  names:
    zh: 易先
    en: Yi Xian
  courtesy_name: 太初
  lifespan:
    birth:
      date: '1370'
      precision: decade
      is_circa: true
      raw: 约明洪武年间（据十九入太学、永乐初仕推推测）
    death:
      date: '1427'
      precision: year
      is_circa: false
      raw: 明宣德二年
  birth_date:
    date: '1370'
    precision: decade
    is_circa: true
    raw: 约明洪武年间
  death_date:
    date: '1427'
    precision: year
    is_circa: false
    raw: 明宣德二年
  era: 明
  reign_ref: 明成祖永乐、明仁宗洪熙、明宣宗宣德
  archetype: 死守孤城、以身殉国的边郡知府
  dilemmas:
  - 叛臣外诱、逆贼内侵之际，降以求生还是守城殉国
  - 交趾远在万里，避嫌自安还是事君不避难
  - 城中粮尽援绝，令军民开门以幸余生而独任其死
  lesson: 忠义人臣之大节——与城存亡，虽死不朽
  summary_first_person: 我名先，字太初，湖广湘阴人。自太学生出身，先任宛平令，兴学校、平狱讼；永乐六年奉命远赴交趾知谅山府，教化蛮俗、祈雨救旱，民谣颂我“易知府，苏民苦”。任满军民吁留，蒙恩升正三品留掌府事。宣德二年黎利之乱，诸城陷没，我以孤城抗贼，坚守三月余，粮尽援绝，誓不腼面求生，佩印自经，妻黄氏携子彻投井，阖家殉难十八口。朝廷追赠广西布政使司左参政，谥忠节，归葬湘阴栗桥。
endeavors:
- id: guji-易先-endeavor-1
  name_zh: 京畿理政：由太学到宛平令
  phases:
  - key: brewing
    name_zh: 入太学、掌燕王府书记
    labels:
      zh:
      - 太学生
      - 燕王府书记
      - 庐墓尽孝
    start_date: '1389'
  - key: breakthrough
    name_zh: 出任宛平令，兴学平讼
    labels:
      zh:
      - 宛平令
      - 兴学校
      - 平狱讼
    start_date: '1403'
    highlight_event_id: guji-易先-event-wanping
  decisions:
  - date: '1403'
    title_zh: 出任宛平令，政尚廉平
    rationale: 由太学膺推择，斥奸吏、兴学校、平狱讼，境内大治，有古循吏之风
- id: guji-易先-endeavor-2
  name_zh: 抚治谅山与死节孤城
  phases:
  - key: brewing
    name_zh: 出任交趾谅山府知府
    labels:
      zh:
      - 谅山知府
      - 教化蛮俗
    start_date: '1408'
  - key: breakthrough
    name_zh: 化俗安民、祈雨救旱
    labels:
      zh:
      - 亲祷得雨
      - 苏民苦谣
      - 军民吁留
    start_date: '1410'
    highlight_event_id: guji-易先-event-rain
  - key: climax
    name_zh: 黎利之乱，死守谅山
    labels:
      zh:
      - 孤城抗贼
      - 坚守三月
      - 佩印自经
    start_date: '1427'
    highlight_event_id: guji-易先-event-siege
  - key: closure
    name_zh: 追赠谥节、归葬乡里
    labels:
      zh:
      - 谥忠节
      - 归葬栗桥
      - 建坊立祠
    start_date: '1427'
    highlight_event_id: guji-易先-event-posthumous
  decisions:
  - date: '1408'
    title_zh: 应选远赴交趾任谅山府知府
    rationale: 同僚虑其远，公以为事君不避难乃人臣之职，交趾皆汉唐故宇，正吾儒宣力效劳之秋
  - date: '1411'
    title_zh: 谏止举兵诛洞蛮，亲往宣谕
    rationale: 洞蛮窃杀乃教化未孚，遽以兵加之则全交震动；为民父母不当令无辜之民被残
  - date: '1427'
    title_zh: 拒降守城，先遣妇孺、纳愿守之丁男
    rationale: 吾事一君，焉降？为郡守当与城存亡；自揣得人和者可以胜敌
events:
- id: guji-易先-event-birth
  date: '1370'
  year_of: 1370
  date_precision: decade
  is_circa: true
  name_zh: 生于湖广湘阴易氏
  description: 母吴恭人梦梓潼帝君授玉爵而生公；先世延庆公以纯孝称，父斗北公隐居教授，家世忠孝传家
- id: guji-易先-event-wanping
  date: '1403'
  year_of: 1403
  date_precision: year
  name_zh: 由太学出任宛平令
  description: 永乐元年由太学授宛平令，兴学校、平狱讼、斥奸吏，境内大治，有古循吏风；并以俸入散予族人
- id: guji-易先-event-liangshan
  date: '1408'
  year_of: 1408
  date_precision: year
  name_zh: 授交趾谅山府知府
  description: 永乐六年平定交趾，户部尚书黄福奏需良有司抚之，公被推择授谅山府知府，携妻与三子随任
- id: guji-易先-event-rain
  date: '1410'
  year_of: 1410
  date_precision: year
  is_circa: true
  name_zh: 交趾大旱，斋戒亲祷得雨
  description: 永乐八年交趾旱，公亲登坛祈祷，甚暑不张盖，五日涸井泉复发，七日果雨，万民欢呼；任内轻赋役、治衣冠，民谣称“易知府，苏民苦，讼庭间，风日古”
- id: guji-易先-event-promotion
  date: '1418'
  year_of: 1418
  date_precision: year
  is_circa: true
  name_zh: 任满军民吁留，升正三品留掌府事
  description: 军民黄虎山等上疏保留，称其“为国如家，保民若子”；明成祖命暂进阶三品，如其禄仍知府事，以慰民望
- id: guji-易先-event-siege
  date: '1427'
  year_of: 1427
  date_precision: year
  name_zh: 黎利寇陷诸城，死守谅山自经殉国
  description: 宣德二年黎利叛，诸城陷没；公令城外妇女远遁、纳愿同难之丁男数万人入城，葺垒练兵，率军大战斩首千余；后贼攻愈急，坚守三月余，粮尽煮马鞯以食，终无一人降者；公朝服北面再拜，佩印自经，夫人黄氏携子彻投井，阖家从死者十八口
- id: guji-易先-event-death
  date: '1427'
  year_of: 1427
  date_precision: year
  name_zh: 殉国
  description: 城陷粮尽援绝，公曰“吾为社稷死，汝等开门迎敌以幸余生”，佩印自经而死
- id: guji-易先-event-posthumous
  date: '1427'
  year_of: 1427
  date_precision: year
  name_zh: 追赠广西布政使司左参政，谥忠节
  description: 宣宗悼嘉，诏曰“忠义人臣之大节”，追赠广西等处承宣布政使司左参政，晋封正奉大夫，谥忠节，优免子孙三代差役
- id: guji-易先-event-burial
  date: 1428-06
  year_of: 1428
  date_precision: month
  name_zh: 宣德三年谕祭归葬，建坊立祠
  description: 宣德三年六月癸未朔，遣进士张纯谕祭于坟；奉旨归葬湘阴栗桥之西，建坊祠于三井头，交趾祀名宦，本邑祀乡贤忠孝祠，春秋致祭
