  name_zh: 曹履泰
  names:
    zh: 曹履泰
    en: Cao Lütai
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 明代，生年不详
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: 明末，卒年不详
  birth_date: ''
  death_date: ''
  era: 明代（天启、崇祯年间）
  reign_ref: 天启、崇祯
  archetype: 御海循吏
  dilemmas:
  - 剿抚两难：招抚海盗恐酿虎狼之患，一味进剿又兵将不力、库藏如洗
  - 直谏与保身：在谏垣謇谔任怨，终得意外严谴
  - 上下掣肘：总兵俞氏纵贼营私，职须婉转转闻而不触其怒
  lesson: 为长吏者须兼将帅之才，爱民一念贯彻剿抚之间，虽爱官爱名不爱命以赴地方之难。
  summary_first_person: 我是明末盐官曹履泰，字大来，号方城。天启崇祯之交任福建同安知县，值海盗横行、红夷窥伺，我严保甲、练乡兵、随机剿抚，五年而全闽晏然；后入谏垣直言天下安攘大计，遭严谴去职。著有《靖海纪略》传世。
endeavors:
- id: guji-曹履泰-endeavor-1
  name_zh: 治理同安、靖绥海患
  phases:
  - key: brewing
    name_zh: 初莅同安
    labels:
      zh:
      - 临危受任
    start_date: '1621'
    highlight_event_id: guji-曹履泰-event-tongan-duties
  - key: breakthrough
    name_zh: 剿抚随机
    labels:
      zh:
      - 练乡兵
      - 封船剿贼
      - 招回归农
    start_date: '1626'
    highlight_event_id: guji-曹履泰-event-capture-pirates
  - key: climax
    name_zh: 全闽晏然
    labels:
      zh:
      - 渠率献馘
      - 功成不居
    start_date: '1630'
    highlight_event_id: guji-曹履泰-event-pacify-coast
  - key: closure
    name_zh: 召入谏垣
    labels:
      zh:
      - 擢入谏垣
    start_date: '1631'
    highlight_event_id: guji-曹履泰-event-censorate
  decisions:
  - date: '1626'
    title_zh: 严保甲、练乡兵、募勇士守近澳
    rationale: 库藏如洗、援兵不至，唯以团练守城自保，人心otide立应。
  - date: '1626'
    title_zh: 发布招回告示，胁从之民一律不究
    rationale: 今为剧贼，昔皆良民；挽回从正可以离贼手足。
  - date: '1627'
    title_zh: 婉转上陈，弹压俞总兵转剿为抚之弊
    rationale: 贼在外奸在内，恐抚端一开、群盗效尤，中左将为虎狼之穴。
- id: guji-曹履泰-endeavor-2
  name_zh: 谏垣直言与《靖海纪略》
  phases:
  - key: brewing
    name_zh: 积望入垣
    labels:
      zh:
      - 起家邑令
      - 入谏垣
    start_date: '1631'
    highlight_event_id: guji-曹履泰-event-censorate
  - key: climax
    name_zh: 謇谔论事
    labels:
      zh:
      - 连劾大将
      - 誉惧功凶
    start_date: '1632'
    highlight_event_id: guji-曹履泰-event-remonstrate
  - key: closure
    name_zh: 严谴去职、著述传世
    labels:
      zh:
      - 意外严谴
      - 撰靖海纪略
    start_date: '1634'
    highlight_event_id: guji-曹履泰-event-punished
  decisions:
  - date: '1632'
    title_zh: 连奏劾大将之不律者
    rationale: 天下安攘大计所系，虽危身任怨亦不容避就。
  - date: '1634'
    title_zh: 辑治同书信为《靖海纪略》
    rationale: 以是编质今之为长吏者，示文吏可为将帅之事。
events:
- id: guji-曹履泰-event-birth
  date: ''
  year_of: ''
  type: birth
  title_zh: 曹履泰生于明浙江海宁盐官
  detail_zh: 生年不详，海宁盐官人，字大来。
- id: guji-曹履泰-event-tongan-duties
  date: '1626'
  year_of: 1626
  type: endeavor
  title_zh: 出任福建同安知县
  detail_zh: 同安滨海独当海寇之冲，值天启崇祯之交海患岌岌。
- id: guji-曹履泰-event-pirate-siege
  date: 1626-04
  year_of: 1626
  type: endeavor
  title_zh: 郑芝龙等贼二百余船压境、焚掠内地
  detail_zh: 贼遍搜民歌焚之，俞总镇闭门不出；曹履泰严保甲、练乡兵、捐资募勇士防守近澳。
- id: guji-曹履泰-event-capture-pirates
  date: 1626-06
  year_of: 1626
  type: endeavor
  title_zh: 率健丁逐贼擒获、枭示六贼
  detail_zh: 乡兵数千搏贼，贼负伤而去；数日间近县内地绝无告警。
- id: guji-曹履泰-event-recall-bandits
  date: '1627'
  year_of: 1627
  type: endeavor
  title_zh: 发布招回告示、胁从编入家甲
  detail_zh: 招回者众多，编入家甲、安其生理，地方宁静。
- id: guji-曹履泰-event-pacify-coast
  date: '1630'
  year_of: 1630
  type: endeavor
  title_zh: 治同五年剿抚俱效、三四渠率顺逆各安
  detail_zh: 顺者搏颡、逆者献馘，功成而全闽晏如；公意色渊然若不与焉。
- id: guji-曹履泰-event-censorate
  date: '1631'
  year_of: 1631
  type: endeavor
  title_zh: 以积望实擢入谏垣
  detail_zh: 益发抒规天下安攘大计，屹然有长孺禁闼之风。
- id: guji-曹履泰-event-remonstrate
  date: '1632'
  year_of: 1632
  type: endeavor
  title_zh: 连奏劾大将不律者
  detail_zh: 天下之人益贵其识，皆曰使其秉枢坐筹、杀天下贼当尽。
- id: guji-曹履泰-event-punished
  date: '1634'
  year_of: 1634
  type: endeavor
  title_zh: 直谏得严谴
  detail_zh: 直以严冷孤峭危身任怨，未几得意外严谴。
- id: guji-曹履泰-event-death
  date: ''
  year_of: ''
  type: death
  title_zh: 曹履泰卒
  detail_zh: 卒年不详，著有《靖海纪略》行世。
