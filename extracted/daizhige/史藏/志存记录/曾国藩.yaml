person:
  qid: guji-曾国藩
  name_zh: 曾国藩
  names:
    zh: 曾国藩
    en: Zeng Guofan
  lifespan:
    birth:
      date: 1811-11-26
      precision: day
      is_circa: false
      raw: 嘉庆十六年十月十一日
    death:
      date: 1872-03-12
      precision: day
      is_circa: false
      raw: 同治十一年二月初四日
  birth_date: 1811-11-26
  death_date: 1872-03-12
  era: 清代后期（嘉庆—同治）
  reign_ref: 道光、咸丰、同治
  archetype: 中兴名臣 / 湘军统帅
  dilemmas:
  - 功成之后手握重兵、部曲骄恣，是否拥兵自重
  - 御外侮之方略仅重铁舰枪炮而忽学术制度，后世议其陋
  lesson: 平大乱而不萌不臣之心，可保天下不决裂；然定天下大计若仅计政而不计教，终难御外侮。
  summary_first_person: 我以湘军平定粤匪，兵权在握而终不排满，天下赖以不裂；然我筹划御外大计，专意制造厂、船政局之铁舰枪炮，人议其陋，我亦自谓古人得名望如予者未有如予之陋也。
endeavors:
