    start_date: 1862-05
    highlight_event_id: guji-曾国藩-event-2
  - key: closure
    name_zh: 裁撤湘军、自削兵权
    labels:
      zh: 裁军
    start_date: 1864-08
    highlight_event_id: guji-曾国藩-event-2
  decisions:
  - date: 1864-07
    title_zh: 金陵克复后不萌不臣之心、不排满
    rationale: 当时兵权在握，天下豪杰半出其门，倘稍有猜忌、微萌不臣，天下决裂必甚于三国，且恐续五胡乱华之祸，故毅然裁军守节。
- id: guji-曾国藩-endeavor-2
  name_zh: 筹划御外侮大计、倡办制造厂船政局
  phases:
  - key: brewing
    name_zh: 目睹西洋船炮之利
    labels:
      zh: 省悟
    start_date: 1860
    highlight_event_id: guji-曾国藩-event-3
  - key: breakthrough
    name_zh: 创办安庆内军械所
    labels:
      zh: 造械
    start_date: 1861
    highlight_event_id: guji-曾国藩-event-3
  - key: climax
    name_zh: 与李鸿章倡办江南制造总局、船政局
    labels:
      zh: 倡厂
    start_date: 1865
    highlight_event_id: guji-曾国藩-event-4
  - key: closure
    name_zh: 方略传于后任，一遵约束
    labels:
      zh: 传略
    start_date: 1870
    highlight_event_id: guji-曾国藩-event-4
  decisions:
  - date: 1861
    title_zh: 定御外侮方略：以铁舰枪炮为急务
    rationale: 以为西人强盛而狎侮我者因其有铁舰枪炮，故皇皇以倡办制造厂、船政局为急务；然于彼邦学术制度文物皆不过问，清流党议其仅计政而不计教。
