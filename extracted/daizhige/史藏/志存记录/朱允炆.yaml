person:
  qid: guji-朱允炆
  name_zh: 朱允炆
  names:
    zh: 朱允炆
    en: Zhu Yunwen
  lifespan:
    birth:
      date: 1377-12-05
      precision: day
      is_circa: false
      raw: 洪武十年十一月初五
    death:
      date: 1440-01-01
      precision: year
      is_circa: true
      raw: 正统时归京养于佛堂而殂
  birth_date: 1377-12-05
  death_date: 1440-01-01
  era: 明
  reign_ref: 建文
  archetype: 罹难遁世之少主
  dilemmas:
  - 宽政理想与强藩现实之间如何自处
  - 国破身死与祝发偷生之间何以抉择
  - 归骨父母与再起风波之间是否现身
  lesson: 位极而不知难，仁柔而无预备，则宽政反成速亡之因，留得性命亦只付青灯
  summary_first_person: 吾为太祖长孙，懿文太子长子，洪武二十五年册为皇太孙，三十一年嗣位改元建文，行宽政赦逋租，铸凝命神宝，郊庙亲祀，一心复古。未料燕藩兵起，京阙火后，吾启先帝所遗度牒缁衣，削发自地道遁去，流转湖湘汴梁四十秋，霜雪盈头，题诗自悼。老至正统，诣察院自陈，归体父母之侧，迎入大内佛堂以终，可谓生于深宫，亡于烈火，得全于空门者也
  source_urls:
  - https://daizhige.org/史藏/志存记录/东朝纪.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/志存记录/东朝纪.md
endeavors:
- id: guji-朱允炆-endeavor-1
  title_zh: 继统行宽政
  summary_zh: 以皇太孙嗣位，改元建文，颁宽诏遣采访，制宝郊祀，欲以文治更化
  phases:
  - key: brewing
    name: 册立储嗣
    labels:
      zh: 册为皇太孙
    start_date: 1392-09-13
    highlight_event_id: guji-朱允炆-event-celi
  - key: breakthrough
    name: 登极更化
    labels:
      zh: 即位建文行宽政
    start_date: 1398-06-30
    highlight_event_id: guji-朱允炆-event-jiwei
  - key: climax
    name: 制宝亲郊
    labels:
      zh: 凝命神宝与郊祀视学
    start_date: 1399-03-01
    highlight_event_id: guji-朱允炆-event-shenbao
  decisions:
  - date: 1398-06-30
    title_zh: 即位下诏行宽政
    rationale: 承太祖严刑之后，以赦罪蠲租省刑收人心，开新政气象
  - date: 1399-03-01
    title_zh: 遣采访使观风俗
    rationale: 欲知民间患苦，察吏治得失，以二十四人分行天下
- id: guji-朱允炆-endeavor-2
  title_zh: 国破祝发远遁
  summary_zh: 燕兵入金川，启先帝函中度牒剃度，自地道出亡，云游四十年而后归骨
  phases:
  - key: brewing
    name: 预藏度牒
    labels:
      zh: 太祖函藏缁衣剃刀
    start_date: 1398-06-30
    highlight_event_id: guji-朱允炆-event-jiwei
  - key: breakthrough
    name: 宫火遁去
    labels:
      zh: 聚宝焚殿削发骑逸
    start_date: 1402-07-13
    highlight_event_id: guji-朱允炆-event-dunwang
  - key: closure
    name: 老归圆寂
    labels:
      zh: 正统自陈归养大内
    start_date: 1440-01-01
    highlight_event_id: guji-朱允炆-event-guiyang
  decisions:
  - date: 1402-07-13
    title_zh: 不殉宫火而祝发遁
    rationale: 遵太祖遗函遇难则启之意，留身避难，以图存宗祀骨血
  - date: 1440-01-01
    title_zh: 老诣察院自陈归附
    rationale: 年八十余无能为，但欲归体父母侧，不求复位只求葬骨
events:
- id: guji-朱允炆-event-birth
  title_zh: 降生应天
  date: 1377-12-05
  year_of: 1377
  event_type: birth
  description_zh: 懿文太子长子，太祖长嫡孙，后为建文皇帝
- id: guji-朱允炆-event-celi
  title_zh: 册为皇太孙
  date: 1392-09-13
  year_of: 1392
  event_type: career
  description_zh: 洪武二十五年九月十三日，太祖诏册嫡孙允炆为皇太孙，奉上下神祇以安民庶
- id: guji-朱允炆-event-jiwei
  title_zh: 嗣皇帝位改元建文
  date: 1398-06-30
  year_of: 1398
  event_type: career
  description_zh: 洪武三十一年闰五月十六日即皇帝位，改明年为建文元年，追尊懿文为孝康皇帝，吕氏为后，下诏行宽政赦有罪蠲逋租
- id: guji-朱允炆-event-shenbao
  title_zh: 获玉制凝命神宝亲郊视学
  date: 1399-03-01
  year_of: 1399
  event_type: career
  description_zh: 使者自西方得玉于雪山，琢大玺曰天命明德表正万方精一执中宇宙永昌，上幸大学视祀孔子，郊祀天地日月辉华
- id: guji-朱允炆-event-dunwang
  title_zh: 国破削发自地道遁
  date: 1402-07-13
  year_of: 1402
  event_type: career
  description_zh: 燕兵入京前聚珠衣宝帐于兰香殿涂猛火油，先启太祖所遗度牒缁衣剃刀，削发披缁骑而逸，云游河南江淮湖湘，题诗寥落东南四十秋
- id: guji-朱允炆-event-guiyang
  title_zh: 正统自陈归养大内
  date: 1440-01-01
  year_of: 1440
  event_type: career
  description_zh: 至正统时年八十余，诣察院书状自称为太祖长孙，以箸挟肉旧事取信吴诚，迎入大内佛堂养之
- id: guji-朱允炆-event-death
  title_zh: 大内圆寂
  date: 1440-01-01
  year_of: 1440
  event_type: death
  description_zh: 归养大内佛堂久而殂，得归体父母侧，结束四十年流亡
