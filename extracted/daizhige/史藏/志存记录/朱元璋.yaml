events:
- id: guji-朱元璋-event-birth
  person_qid: guji-朱元璋
  title_zh: 生于濠州钟离田野之家
  date: 1328-10-21
  year_of: 1328
  place_zh: 濠州钟离
  description_zh: 父皇寓居是方，农业艰辛，我生于贫家，后为明昌之始
- id: guji-朱元璋-event-famine-wander
  person_qid: guji-朱元璋
  title_zh: 天灾父母亡游方为僧三载
  date: 1347-01-01
  year_of: 1347
  place_zh: 淮西僧房古寺
  description_zh: 天灾流行父母兄亡，无地可葬，兄惠黄壤浮掩三尺，岁荒乞食，投空门礼佛，云水飘扬，年方二十而强
- id: guji-朱元璋-event-join-army
  person_qid: guji-朱元璋
  title_zh: 凤阳陷城祷神投城附义军
  date: 1352-03-01
  year_of: 1352
  place_zh: 凤阳濠州城
  description_zh: 雄者跳梁陷城，友人寄书劝降，忧惧无策，与智者商议祷阴，卜逃守不吉，遂附城几被创而获释从戎
- id: guji-朱元璋-event-garrison-chuyang
  person_qid: guji-朱元璋
  title_zh: 脱旅募众率渡清流戍滁阳
  date: 1353-09-01
  year_of: 1353
  place_zh: 滁阳清流
  description_zh: 从愚朝暮日日戎行，元兵讨罪解去，脱旅驭马南土，倡农夫入伍，不逾月众集赤帜盈冈，渡清流戍滁阳，会聚家眷外练兵钢
- id: guji-朱元璋-event-occupy-jianye
  person_qid: guji-朱元璋
  title_zh: 东渡大江首抚姑孰遂定建业
  date: 1356-04-01
  year_of: 1356
  place_zh: 和州姑孰建业
  description_zh: 暂戍和州东渡大江，礼仪抚姑孰，四守关防定建业，砺兵秣马静看群雄颉颃
- id: guji-朱元璋-event-northern-expedition
  person_qid: guji-朱元璋
  title_zh: 遣大将东西北伐入胡都混一
  date: 1368-09-14
  year_of: 1368
  place_zh: 大都关中齐鲁吴越
  description_zh: 亲征荆楚平湖湘，三苗尽服，大将军东平吴越，耀旌齐鲁，定伊洛崤函，入胡都长驱井陉，南藩十有三国来王，依金陵定鼎
- id: guji-朱元璋-event-erect-stele
  person_qid: guji-朱元璋
  title_zh: 命江阴侯建皇堂亲撰陵碑垂戒
  date: 1378-07-01
  year_of: 1378
  place_zh: 凤阳皇陵
  description_zh: 洪武十一年夏命吴良督工新建皇堂，欲厚陵微葬卜地且臧，泪笔述难，勒石铭于皇堂，令世世承运务德
- id: guji-朱元璋-event-death
  person_qid: guji-朱元璋
  title_zh: 崩于金陵宫中
  date: 1398-06-24
  year_of: 1398
  place_zh: 应天府金陵宫
  description_zh: 开国定鼎三十年后崩逝，遗陵碑训示子孙时时来飨勿忘劬劳
