  name_zh: 朱元璋
  names:
    zh: 朱元璋
    en: Zhu Yuanzhang
  lifespan:
    birth:
      date: 1328-10-21
      precision: day
      is_circa: false
      raw: 天历元年戊辰九月十八日生于濠梁钟离
    death:
      date: 1398-06-24
      precision: day
      is_circa: false
      raw: 洪武三十一年闰五月初十崩于西宫
  birth_date: 1328-10-21
  death_date: 1398-06-24
  era: 明
  reign_ref: 洪武
  archetype: 布衣开国君主
  dilemmas:
  - 避元兵与投红巾两难莫决乃祷于伽蓝以决去就
  - 克己下人与群雄骄淫之间择贤下士以收人心
  - 天地分祀合祀之间采明堂遗制以正大礼
  lesson: 起自布衣能敬天爱民勤政纳谏则可成大业，创业守成皆在克己尚俭与任贤不杀
  summary_first_person: 我家本句容朱家巷流寓泗州钟离，元末父母兄殁而孤贫入皇觉寺为僧，游食淮西三载，继而投濠梁郭子兴麾下奋战起家，收定远滁阳之众，渡江克太平建康，都金陵而连灭陈友谅张士诚方国珍，即吴王位继而洪武建元称帝，北伐克元都混一天下，敬天地严禋祀勤听断省躬恤民，在位三十一年而遗诏子孙
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%A4%A9%E6%BD%A2%E7%8E%89%E7%89%92.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%A4%A9%E6%BD%A2%E7%8E%89%E7%89%92.html
endeavors:
- id: guji-朱元璋-endeavor-1
  title_zh: 濠梁从戎定鼎江南
  summary_zh: 自闰三月投郭子兴历镇抚定远滁阳和阳渡江，克建康都金陵，连取镇江广德诸路，奠定吴王基业
  phases:
  - key: brewing
    name: 祷神决去就投濠
    labels:
      zh: 伽蓝卜珓卓立挺身抵濠
    start_date: 1352-04-01
    highlight_event_id: guji-朱元璋-event-joinhao
  - key: breakthrough
    name: 募兵滁阳据江东
    labels:
      zh: 率二十四人南游得众渡采石下太平
    start_date: 1353-12-01
    highlight_event_id: guji-朱元璋-event-jiankang
  - key: climax
    name: 鄱阳决战灭汉主
    labels:
      zh: 千艘甲士十万大战彭蠡友谅毙降
    start_date: 1363-07-01
    highlight_event_id: guji-朱元璋-event-poyang
  - key: closure
    name: 克平江即吴王位
    labels:
      zh: 执张士诚籍兵二十五万改吴元年
    start_date: 1367-10-01
    highlight_event_id: guji-朱元璋-event-pingjiang
  decisions:
  - date: 1352-04-01
    title_zh: 祷伽蓝决投入濠城
    rationale: 两畏元兵红军不敢前，神许即往，几被执而得郭子兴活养为亲兵
  - date: 1353-12-01
    title_zh: 弃濠南游募兵自立
    rationale: 彭赵凌辱难展志，率精锐二十四人往定远滁阳以收精兵自成一军
  - date: 1355-06-01
    title_zh: 渡采石下太平据建康
    rationale: 据上游形胜以窥江南，禁剽掠立纪纲以安众心而都金陵
- id: guji-朱元璋-endeavor-2
  title_zh: 洪武开国混一守成
  summary_zh: 自即吴王位而北伐南征，即皇帝位建元洪武，灭元平蜀滇辽东，制礼立法劝学养士，守成三十一年
  phases:
  - key: brewing
    name: 梦兆受命告祭天地
    labels:
      zh: 青幡朱台真人服剑之上帝明命
    start_date: 1367-01-01
    highlight_event_id: guji-朱元璋-event-proclaim
  - key: breakthrough
    name: 即帝位建元洪武
    labels:
      zh: 正月初四南郊即位国号大明追尊四祖
    start_date: 1368-01-23
    highlight_event_id: guji-朱元璋-event-proclaim
  - key: climax
    name: 北伐克元都追漠北
    labels:
      zh: 中山开平捣永平开平传国玺入彀
    start_date: 1368-08-01
    highlight_event_id: guji-朱元璋-event-yuandu
  - key: closure
    name: 制礼立法训子孙
    labels:
      zh: 合祀天地建太学作祖训节俭勤政
    start_date: 1382-01-01
    highlight_event_id: guji-朱元璋-event-death
  decisions:
  - date: 1368-01-23
    title_zh: 即皇帝位改元洪武
    rationale: 江南已定人心思治，乘天朗气清之祯即位以正名分而号令天下
  - date: 1368-04-01
    title_zh: 命将北伐直捣元都
    rationale: 元主北奔残元尚盛，宜乘胜追击以绝胡元而混一南北
  - date: 1370-01-01
    title_zh: 合祀天地革神封号
    rationale: 天地父母不宜异位，宜崇宇合祀六宗百神以正幽明之辨而严禋祀
events:
- id: guji-朱元璋-event-birth
  date: 1328-10-21
  year_of: 1328
  title_zh: 降诞濠梁钟离
  description_zh: 天历元年九月十八日生，白气贯室异香经宿，十年迁西乡复迁太平乡县庄村
  place_zh: 濠梁钟离今凤阳
- id: guji-朱元璋-event-joinhao
  date: 1352-04-01
  year_of: 1352
  title_zh: 投濠梁郭子兴麾下
  description_zh: 闰三月挺身抵濠为门者所执，郭子兴亲驰活之取为亲兵，遂妻以女孝慈马皇后
  place_zh: 濠梁城
- id: guji-朱元璋-event-jiankang
  date: 1356-04-10
  year_of: 1356
  title_zh: 克采石建康都金陵
  description_zh: 渡采石下太平，蛮子海牙屯采石令开平攻破，遂克建康禁剽掠得胜兵十万而都之
  place_zh: 建康
- id: guji-朱元璋-event-poyang
  date: 1363-10-04
  year_of: 1363
  title_zh: 鄱阳湖大战毙陈友谅
  description_zh: 亲帅舟师千艘甲士十万由九江征友谅，以夜继日继火筏焚舟，友谅中流矢毙士卒皆降
  place_zh: 鄱阳湖
- id: guji-朱元璋-event-pingjiang
  date: 1367-10-01
  year_of: 1367
  title_zh: 克平江执张士诚即吴王业成
  description_zh: 进围平江克之执张士诚籍兵二十五万，南通州无锡台温皆下，改明年为吴元年
  place_zh: 平江
- id: guji-朱元璋-event-proclaim
  date: 1368-01-23
  year_of: 1368
  title_zh: 南郊即皇帝位建元洪武
  description_zh: 吴二年正月初四告祭天地即位，国号大明改元洪武，追尊四祖立后马氏暨皇太子
  place_zh: 南郊金陵
- id: guji-朱元璋-event-yuandu
  date: 1368-08-20
  year_of: 1368
  title_zh: 北伐克元都不战而下
  description_zh: 幸汴梁谋取元都，诸将克汴梁河南潼关，八月元都不战而克元主北奔师次太原
  place_zh: 元都
- id: guji-朱元璋-event-death
  date: 1398-06-24
  year_of: 1398
  title_zh: 崩于西宫葬孝陵
  description_zh: 洪武三十一年闰五月初十崩寿七十一，十六日葬孝陵淑妃李氏殉，谥高皇帝庙号太祖
  place_zh: 金陵西宫孝陵
