  dilemmas:
  - 忠于明室与大清招抚之诱的抉择
  - 拥立唐王联宗与自立旗帜之间的权衡
  lesson: 以海上之力独撑残明，虽父降己不降，成败皆见孤臣之节。
  summary_first_person: 我本名郑成功，蒙赐国姓朱，起兵海上，奉永历年号，力抗清师，终不能复中原而殁。
