endeavors:
- id: guji-朱棣-endeavor-1
  title_zh: 就藩北平北征立威
  description: 洪武封燕王之国北平，修明文武，节俭爱民，两次北出塞外，擒乃儿不花，清沙漠无北顾忧
  phases:
  - key: brewing
    name: 封燕之国
    labels:
      zh:
      - 就藩镇边
    start_date: 1370-04-01
    highlight_event_id: guji-朱棣-event-fengyan
  - key: breakthrough
    name: 北抵迤都山
    labels:
      zh:
      - 深入破虏
    start_date: 1390-03-01
    highlight_event_id: guji-朱棣-event-beizheng
  - key: climax
    name: 再出塞获谍
    labels:
      zh:
      - 料敌制胜
    start_date: 1392-03-01
    highlight_event_id: guji-朱棣-event-beizheng
  - key: closure
    name: 威震戎狄
    labels:
      zh:
      - 安边丰年
    start_date: 1392-06-01
    highlight_event_id: guji-朱棣-event-beizheng
  decisions:
  - date: 1390-03-01
    title_zh: 会期北进直薄虏营
    rationale: 晋王畏惧近塞不敢进，我当以智胜深入，径袭迤都山，擒酋首而清沙漠
  - date: 1392-03-01
    title_zh: 据木牌奏报坚持深入候实
    rationale: 太子疑我怯于深入假牌来奏，惟太祖独信，获谍者自证其事，终明我心
- id: guji-朱棣-endeavor-2
  title_zh: 奉天靖难清君侧
  description: 建文削藩围逼王城，祸机迫切，擒谢贵张昺克九门，誓师奉天讨罪，先后下通州蓟州怀来永平
  phases:
  - key: brewing
    name: 削爵围城
    labels:
      zh:
      - 隐忍待白
    start_date: 1399-06-01
    highlight_event_id: guji-朱棣-event-qibing
  - key: breakthrough
    name: 计擒谢贵张昺
    labels:
      zh:
      - 先发制人
    start_date: 1399-07-01
    highlight_event_id: guji-朱棣-event-qibing
  - key: climax
    name: 怀来破宋忠
    labels:
      zh:
      - 以智胜众
    start_date: 1399-08-01
    highlight_event_id: guji-朱棣-event-huailai
  - key: closure
    name: 略定北平外卫
    labels:
      zh:
      - 安集城中
    start_date: 1399-08-15
    highlight_event_id: guji-朱棣-event-huailai
  decisions:
  - date: 1399-07-01
    title_zh: 藏壮士召贵昺入缚之
    rationale: 防守既严猝难擒，须以计取之，借逮护卫官属召其付领，擒其首则余无能为
  - date: 1399-08-01
    title_zh: 卷甲先击怀来宋忠
    rationale: 贼众新集心不一，宋忠轻躁寡谋狠愎自用，乘其未定击之必破，居庸为襟喉在必争
events:
- id: guji-朱棣-event-birth
  title_zh: 燕王出生
  date: 1360-05-02
  year_of: 1360
  place_zh: 应天
  description: 太祖第四子，母孝慈高皇后，初生云气满室，光彩五色，太祖独钟爱之
- id: guji-朱棣-event-fengyan
  title_zh: 封燕之国北平
  date: 1380-03-01
  year_of: 1380
  place_zh: 北平
  description: 洪武三年封燕王，十三年三月之国，勤学阅武，任贤爱民，威震戎狄不敢近塞
  related_endeavor_id: guji-朱棣-endeavor-1
- id: guji-朱棣-event-beizheng
  title_zh: 北征擒乃儿不花
  date: 1390-05-01
  year_of: 1390
  place_zh: 迤都山
  description: 与晋王会期进师，晋王近塞不敢进，我直抵迤都山，获乃儿不花及名王男女数万，马羊无数，太祖喜曰清沙漠者燕王也
  related_endeavor_id: guji-朱棣-endeavor-1
- id: guji-朱棣-event-qibing
  title_zh: 计擒谢贵张昺克九门
  date: 1399-07-01
  year_of: 1399
  place_zh: 北平王城
  description: 谢贵七卫围王城射箭鼓噪，削爵诏下祸迫，藏壮士于端礼门召贵昺入缚之，尽克九门，安集城中
  related_endeavor_id: guji-朱棣-endeavor-2
- id: guji-朱棣-event-huailai
  title_zh: 怀来大破宋忠
  date: 1399-08-01
  year_of: 1399
  place_zh: 怀来
  description: 率马步精锐八千卷甲进，以家人为前锋破其诳言，将士倒戈来归，渡河直冲擒宋忠俞瑱，获马八千，余众悉降
  related_endeavor_id: guji-朱棣-endeavor-2
- id: guji-朱棣-event-death
  title_zh: 永乐北征崩逝
  date: 1424-08-12
  year_of: 1424
  place_zh: 榆木川
  description: 即位后迁都北平，年谷丰登，亲征塞北，崩于班师途中，庙号太宗
