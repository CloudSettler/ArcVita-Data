  dilemmas:
  - 骨肉至亲嫌疑交构时守分待白还是起兵自救
  - 太祖属意储贰而皇太孙已立时退让守藩还是静待天命
  lesson: 守正循法以得人心，临难果决以智胜强，奉祖训讨奸恶以安社稷
  summary_first_person: 吾为太祖第四子，母孝慈高皇后，就藩北平，勤学阅武，威震戎狄，太祖常谓异日安国家必燕王，建文信任奸回，削藩围城，祸迫于躬，不得已奉祖训靖难，以清君侧，实欲求生以安宗社
