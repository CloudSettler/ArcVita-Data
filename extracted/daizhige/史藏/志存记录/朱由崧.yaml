    title_zh: 封高傑劉澤清劉良佐黃得功分轄江北
    rationale: 欲以驕將守淮拒北且借定策外援制衡南都清議故裂土分餉聽其自徵
  - date: 1644-09-01
    title_zh: 起用阮大鋮任江防專國事
    rationale: 感馬士英擁戴舊恩且謂其知兵可任故不顧欽案翻議用之以固權位終致朝爭解體
events:
- id: guji-朱由崧-event-birth
  date: 1607
  year_of: 1607
  title_zh: 生於洛陽福藩
  description: 萬曆三十五年為神宗次子福王常洵之嗣子生長洛陽萬曆四十二年隨父就國
- id: guji-朱由崧-event-advocate
  date: 1644-05-01
  year_of: 1644
  title_zh: 入南京告廟監國
  description: 崇禎十七年四月京師陷與潞王並次淮安馬士英擁至龍江關廷臣迎立五月初一日入京以守備府為行宮初三日監國
- id: guji-朱由崧-event-ascend
  date: 1644-06-19
  year_of: 1644
  title_zh: 即位改元弘光
  description: 以五月十五日即皇帝位改明年為弘光元年用史可法高弘圖姜曰廣等為閣臣馬士英留輔專國
- id: guji-朱由崧-event-fall
  date: 1645-05-25
  year_of: 1645
  title_zh: 南京陷奔蕪湖被執
  description: 清師渡江朝臣星散南京失守出奔蕪湖依黃得功軍潰被執北解燕京南渡政權亡
- id: guji-朱由崧-event-death
  date: 1646-05-23
  year_of: 1646
  title_zh: 殞於北京
  description: 被執北去羈於燕京次年遇害於北京南明追上聖安皇帝諡後諡安宗簡皇帝
