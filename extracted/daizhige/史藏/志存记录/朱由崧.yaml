  dilemmas:
  - 潞福定策之爭人望屬潞而權歸於福
  - 馬阮專國與東林清流門戶大起討賊置之不聞
  - 江北四鎮驕悍內訌督輔羈縻而不能用命
  lesson: 偷安無志報雪以區區江左比隆靈武終致君臣解體社屋人亡
  summary_first_person: 余神宗之孫福王常洵之子避賊淮上為馬士英擁戴入南都監國即位改元弘光委國士英倚江北四鎮為屏藩朝爭紛起北伐不張未及一年而南都陷余走蕪湖被執北去竟殞於北京空頂王號終類何人
  source_urls:
