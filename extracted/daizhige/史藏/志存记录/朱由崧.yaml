events:
- id: guji-朱由崧-event-birth
  date: 1607
  year_of: 1607
  title_zh: 生於福藩
  description_zh: 神宗孫先福王常洵之子生於河南福邸後嗣封為福王
  place_zh: 河南府
- id: guji-朱由崧-event-huaian
  date: 1644-04-25
  year_of: 1644
  title_zh: 自淮安南下爭立
  description_zh: 崇禎十七年四月流離入淮安聞北都失守迎立潞王議起遂書召高傑黃得功劉良佐協謀擁戴舟抵燕子矶以王禮見百官
  place_zh: 淮安至南京
- id: guji-朱由崧-event-jianguo
  date: 1644-06-07
  year_of: 1644
  title_zh: 監國於南京
  description_zh: 五月初三日行拜天禮升殿受監國寶頒監國大赦諭天下發大行皇帝喪以日易月人心乃定
  place_zh: 南京
- id: guji-朱由崧-event-dengji
  date: 1644-06-19
  year_of: 1644
  title_zh: 即皇帝位於南都改元弘光
  description_zh: 五月十五日祗告天地宗廟社稷即皇帝位以明年為弘光元年大赦天下命韓贊周管司禮監事
  place_zh: 南京
- id: guji-朱由崧-event-sizhen
  date: 1644-06-20
  year_of: 1644
  title_zh: 分江北為四鎮以史可法督師
  description_zh: 以劉澤清高傑黃得功劉良佐分領淮徐揚滁鳳壽滁和四鎮各額兵三萬命史可法督師淮揚駐揚州調遣
  place_zh: 揚州江北
- id: guji-朱由崧-event-death
  date: 1646
  year_of: 1646
  title_zh: 國亡遇害
  description_zh: 弘光朝覆亡被執北去後於順治三年遇害終其偏安一載之局
  place_zh: 北方
