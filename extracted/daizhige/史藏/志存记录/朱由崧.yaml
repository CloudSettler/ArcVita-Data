  name_zh: 朱由崧
  names:
    zh: 朱由崧
    en: Zhu Yousong
  lifespan:
    birth:
      date: '1607'
      precision: year
      is_circa: false
      raw: 万历三十五年生于洛阳福藩
    death:
      date: '1646'
      precision: year
      is_circa: true
      raw: 隆武二年遇害
  birth_date: '1607'
  death_date: '1646'
  era: 明末
  reign_ref: 弘光
  archetype: 因人成事而大权旁落的承统之君
  dilemmas:
  - 迎立之功出于马士英与四镇，登极之后如何摆脱受制之局
  - 马阮翻逆案与东林复社互争，复仇北伐与清算恩仇孰先孰后
  lesson: 归功定策怀仇异议则小人挟以专利，顾忌不敢为而北伐荒废，酒色金帛恩仇一空而国亡
  summary_first_person: 孤本福恭王世子，父殉流贼，国变南渡，得马士英与四镇迎立，监国南京而登极改元弘光，然受制定策之异议，朝政决于马阮，北伐不举，致南都倾覆，悔无及矣
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%BC%98%E5%85%89%E5%AE%9E%E5%BD%95%E9%92%9E.html
endeavors:
- id: guji-朱由崧-endeavor-1
  title_zh: 流寓迎立与监国登极
  summary: 福藩南徙避乱，于淮上为杨文骢所迎，经仪真至南京，在马士英与四镇拥戴下监国即位，改元弘光
  phases:
  - key: brewing
    name: 国变南徙与立君之议
    labels:
      zh: 七不可与潞王贤名之争
    start_date: '1644-03-01'
    highlight_event_id: guji-朱由崧-event-birth
  - key: breakthrough
    name: 淮上迎驾经仪真至南京
    labels:
      zh: 空头笺迎先至者
    start_date: '1644-05-01'
    highlight_event_id: guji-朱由崧-event-monitor
  - key: climax
    name: 监国南京而即皇帝位
    labels:
      zh: 五月庚寅监国壬寅登极
    start_date: '1644-06-07'
    highlight_event_id: guji-朱由崧-event-enthroned
  - key: closure
    name: 追崇先考先妣与祭告列祖
    labels:
      zh: 恭皇帝恭皇后与思宗庙谥
    start_date: '1644-06-15'
    highlight_event_id: guji-朱由崧-event-enthroned
  decisions:
  - date: '1644-06-07'
    title_zh: 接受马士英迎立建监国于南京
    rationale: 北都已陷太子二王陷贼，为早定人心，借拥立之力南渡承统，以安东南半壁
  - date: '1644-06-19'
    title_zh: 即皇帝位以明年为弘光元年
    rationale: 监国名分已定，四镇勳臣翕附，遂正大位改元，以继统收人心
  - date: '1644-06-20'
    title_zh: 追崇皇考为恭皇帝皇妣田氏为恭皇后并上大行烈皇帝思宗庙号
    rationale: 明伦正统，祭告泗凤显陵及神烈山，以昭承绪之正
- id: guji-朱由崧-endeavor-2
  title_zh: 南都分权与党争失政
  summary: 以史可法与马士英并入阁，分四藩以慰武将，默许翻逆案起用阮大铖，朝权渐归马阮而北伐荒废
  phases:
  - key: brewing
    name: 史马并相与四镇分藩
    labels:
      zh: 东阁大学士与靖南兴平等封爵
    start_date: '1644-06-08'
    highlight_event_id: guji-朱由崧-event-enfeoff
  - key: breakthrough
    name: 马士英密陈四事与翻逆案
    labels:
      zh: 圣母梓宫选淑女防护亲藩与起用阮大铖
    start_date: '1644-06-26'
    highlight_event_id: guji-朱由崧-event-fanan
  - key: climax
    name: 黄澍廷劾马士英与廷争不决
    labels:
      zh: 奸贪胁主与劳苦塘报之辩
    start_date: '1644-07-01'
    highlight_event_id: guji-朱由崧-event-fanan
  - key: closure
    name: 史可法出督维扬而朝局受制
    labels:
      zh: 酒色金帛恩仇而北伐荒矣
    start_date: '1644-07-10'
    highlight_event_id: guji-朱由崧-event-enfeoff
  decisions:
  - date: '1644-06-08'
    title_zh: 进史可法马士英高弘图等入阁并设四藩
    rationale: 以文武调停拥立异议，封黄得功高杰刘泽清刘良佐以慰骄兵，冀各守江北
  - date: '1644-06-26'
    title_zh: 默许翻钦定逆案召阮大铖陛见
    rationale: 以定策功臣之请为重，欲兼收人才供天下之用，不欲示人以隘
  - date: '1644-07-01'
    title_zh: 留马士英参机务令史可法出督师维扬
    rationale: 廷争不已，欲以外督安内朝，暂息门户之争而固江淮
events:
- id: guji-朱由崧-event-birth
  title_zh: 降生洛阳福藩为神宗之孙
  date: '1607'
  year_of: 1607
  description: 神宗皇帝之孙，福恭王常洵之子，国于雒阳，崇祯十六年正月父为流贼所害而南徙避乱
  place_zh: 洛阳
- id: guji-朱由崧-event-monitor
  title_zh: 夏五月庚寅建监国于南京
  date: '1644-06-07'
  year_of: 1644
  description: 杨文骢持空头笺于淮上迎先至之福王，两昼夜达仪真，史可法会议未定而各镇奉驾已至，遂监国南京
  place_zh: 南京
- id: guji-朱由崧-event-enthroned
  title_zh: 壬寅即皇帝位改元弘光
  date: '1644-06-19'
  year_of: 1644
  description: 福王即皇帝位，以明年为弘光元年，追崇皇考曰恭皇帝皇妣田氏曰恭皇后，上大行皇帝谥曰烈皇帝庙号思宗
  place_zh: 南京
- id: guji-朱由崧-event-enfeoff
  title_zh: 设四藩封爵慰武将
  date: '1644-06-10'
  year_of: 1644
  description: 以黄得功为靖南侯高杰为兴平伯刘泽清为东平伯刘良佐为广昌伯，分守淮徐扬滁凤泗庐六，借四镇以迎立即为所结
  place_zh: 江北
- id: guji-朱由崧-event-fanan
  title_zh: 马士英奏翻钦定逆案起阮大铖
  date: '1644-06-26'
  year_of: 1644
  description: 马士英荐阮大铖娴韬略请赦往罪补部曹，高弘图罗万象熊汝霖陈良弼等力争，史可法调停而诏款删复之间门户再起
  place_zh: 南京
- id: guji-朱由崧-event-death
  title_zh: 南都倾覆被执遇害
  date: '1646'
  year_of: 1646
  description: 酒色金帛恩仇聚散不一年，北伐荒废，东南金帛聚于士英恩仇快于阮铖，国亡被执，父死于路而不知，论世伤之
  place_zh: 南京
