person:
  qid: guji-朱由检
  name_zh: 朱由检
  names:
    zh: 朱由检
    en: Zhu Youjian
  lifespan:
    birth:
      date: 1611-02-06
      precision: day
      is_circa: false
      raw: 万历三十八年庚戌十二月二十四日卯时生于东宫
    death:
      date: 1644-04-25
      precision: day
      is_circa: false
      raw: 崇祯十七年三月十九日殉国
  birth_date: 1611-02-06
  death_date: 1644-04-25
  era: 明末
  reign_ref: 崇祯
  archetype: 励精独断而终致亡国的悲剧君主
  dilemmas:
  - 潜邸时为魏忠贤疑忌，是俯首隐忍以待时，还是挺身抗争以速祸
  - 朝臣尽为阉党，是不动声色逐一剪除，还是大张旗鼓尽行诛斥
  - 阉党既除东林复起，是调和朋党共济国事，还是另立亲信以防报复
  lesson: 除巨奸在一时之独断，救危亡在经年之宽仁，英明而失于猜忌，刚毅而流于独断，则廓清之后仍不免于倾覆
  summary_first_person: 我是朱由检，明光宗第五子，母刘选侍早逝而育于李庄妃，天启二年封信王，七年八月由信邸入继大统，我在位初不动声色剪除魏忠贤客氏，拆毁生祠，罢织造撤镇守，平反冤狱枚卜阁臣，欲再造宗社而终以朋党边患交困而致国亡身殉
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%B4%87%E7%A5%AF%E6%9C%9D%E9%87%8E%E7%BA%AA.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%B4%87%E7%A5%AF%E6%9C%9D%E9%87%8E%E7%BA%AA.html
endeavors:
- id: guji-朱由检-endeavor-1
  title_zh: 信王入继不动声色除魏忠贤
  summary: 自信邸隐忍称疾不朝，入宫袖食秉烛自卫，优礼客魏以安其心，潜易承奉剪除羽翼，而后发诏安置凤阳，逼令自缢，籍没拆祠，颁布爰书定逆案
  phases:
  - key: brewing
    name: 潜邸隐忍
    labels:
      zh:
      - 称疾不朝
      - 隐忍待时
    start_date: 1627-02-01
    highlight_event_id: guji-朱由检-event-ascend
  - key: breakthrough
    name: 登极潜移
    labels:
      zh:
      - 易置承奉
      - 优礼安奸
    start_date: 1627-10-02
    highlight_event_id: guji-朱由检-event-ascend
  - key: climax
    name: 放逐正罪
    labels:
      zh:
      - 安置凤阳
      - 追缉正法
    start_date: 1627-12-11
    highlight_event_id: guji-朱由检-event-wei
  - key: closure
    name: 籍没颁书
    labels:
      zh:
      - 戮尸凌迟
      - 拆毁生祠
    start_date: 1628-01-01
    highlight_event_id: guji-朱由检-event-wei
  decisions:
  - date: 1627-10-02
    title_zh: 入宫自卫仍优礼客魏
    rationale: 以新君孤立而阉党遍朝，先安其心以缓变，潜换左右以夺耳目，然后可图
  - date: 1627-12-11
    title_zh: 发锦衣扭解魏忠贤赴凤阳
    rationale: 既得嘉征等十大罪之公论，羽翼已散，则当明正典刑以雪众冤，虽从轻发遣而实示必诛
- id: guji-朱由检-endeavor-2
  title_zh: 厘革阉政平反召用忠直
  summary: 罢苏杭织造以恤民，撤各边镇守内官以一事权，诏雪天启冤狱赠恤起用，枚卜改推特召韩爌，澄清士习以挽人心
  phases:
  - key: brewing
    name: 下诏恤冤
    labels:
      zh:
      - 诏狱清理
      - 酌议褒恤
    start_date: 1627-10-05
    highlight_event_id: guji-朱由检-event-rehab
  - key: breakthrough
    name: 罢撤阉制
    labels:
      zh:
      - 罢织造
      - 撤镇守
    start_date: 1627-11-01
    highlight_event_id: guji-朱由检-event-reform
  - key: climax
    name: 枚卜更阁
    labels:
      zh:
      - 金瓶拈名
      - 特召旧辅
    start_date: 1628-03-01
    highlight_event_id: guji-朱由检-event-rehab
  - key: closure
    name: 定论是非
    labels:
      zh:
      - 廓清首功
      - 辨雪浮谤
    start_date: 1628-05-01
    highlight_event_id: guji-朱由检-event-rehab
  decisions:
  - date: 1627-11-01
    title_zh: 罢织造撤镇守内官
    rationale: 阉政蠹民而分督抚事权，必敬天恤民归政外廷，方能号令一行而民生稍苏
  - date: 1628-03-01
    title_zh: 金瓶枚卜复特召韩爌
    rationale: 会推已为邪议所把持，不足以得真贤，故对天焚告以决疑，仍参众望召用正人以定国是
events:
- id: guji-朱由检-event-birth
  title_zh: 生于东宫
  date: 1611-02-06
  year_of: 1611
  location_zh: 北京东宫
  description: 明光宗第五子，母选侍刘氏，孝纯早逝，抚育于李庄妃，是为信王
  type: birth
- id: guji-朱由检-event-ascend
  title_zh: 信邸入宫即皇帝位于中极殿
  date: 1627-10-02
  year_of: 1627
  location_zh: 北京紫禁城中极殿
  description: 天启七年八月二十四日即位，受百官朝，免召买香烛，颁赏守边官军，申饬避天地祖宗名讳
  type: career
- id: guji-朱由检-event-wei
  title_zh: 魏忠贤自缢于阜城崔呈秀自尽籍没拆祠
  date: 1627-12-11
  year_of: 1627
  location_zh: 阜城县至凤阳道中
  description: 十一月初四谕锦衣扭解魏忠贤，忠贤闻信自缢，李朝钦同缢，崔呈秀缢于家，旋籍没家产拆毁天下生祠，戮尸凌迟颁布爰书
  type: career
- id: guji-朱由检-event-reform
  title_zh: 罢苏杭织造撤各边镇守内官
  date: 1627-11-15
  year_of: 1627
  location_zh: 北京
  description: 以封疆多事征输繁重为由罢织造，以宦官观兵古来有戒为由撤镇守，军政悉归督抚调度
  type: career
- id: guji-朱由检-event-rehab
  title_zh: 诏雪阉祸冤狱赠恤起用忠直
  date: 1628-03-15
  year_of: 1628
  location_zh: 北京
  description: 命部院九卿科道酌议天启斥害诸臣，非法禁毙者褒赠恤荫，削夺牵连者复官起用，耿如杞方震孺等俱得释，倪元璐廓清之疏得俞旨
  type: career
- id: guji-朱由检-event-death
  title_zh: 甲申殉国于煤山
  date: 1644-04-25
  year_of: 1644
  location_zh: 北京煤山
  description: 李自成陷京师，烈皇自缢殉国，终年三十四岁，在位十七年
  type: death
