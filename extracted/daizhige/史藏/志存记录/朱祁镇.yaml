  dilemmas:
  - 亲征安边与留守京师之两难
  - 轻信求和移营与据险固守之两难
  - 虏中促和速还与朝中另立新君之两难
  lesson: 偏信近幸则社稷倾危，处患难能屈能忍方能保全归国
  summary_first_person: 我嗣位幼冲，宠任王振，致正统十四年亲征土木兵溃蒙尘，陷虏一年居伯颜帖木儿营，备尝艰辱，赖袁彬护持得还，南宫幽闭七载而终复辟，深悔当初轻敌之失
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%90%A6%E6%B3%B0%E5%BD%95.html
endeavors:
- id: guji-朱祁镇-endeavor-1
  title_zh: 土木亲征蒙尘北狩
  summary: 正统十四年听王振劝亲征瓦剌，出居庸抵宣府大同，土木兵溃被俘，留居大同黑松林也先伯颜营中
  phases:
  - key: brewing
    name: 也先入寇劝行亲征
    labels:
      zh:
      - 酿成
    start_date: 1449-07-08
    highlight_event_id: guji-朱祁镇-event-qinzheng
  - key: breakthrough
    name: 率五十万众出关
    labels:
      zh:
      - 突进
    start_date: 1449-07-17
    highlight_event_id: guji-朱祁镇-event-qinzheng
  - key: climax
    name: 土木兵溃御驾被留
    labels:
      zh:
      - 高潮
    start_date: 1449-09-01
    highlight_event_id: guji-朱祁镇-event-tumu
  - key: closure
    name: 居伯颜营待议迎还
    labels:
      zh:
      - 收束
    start_date: 1449-09-14
    highlight_event_id: guji-朱祁镇-event-beidi
  decisions:
  - date: 1449-07-17
    title_zh: 不顾群臣请留决意亲征
    rationale: 欲扬武塞外，兼信王振之谋，误判也先虚实与边备空虚
  - date: 1449-08-13
    title_zh: 土木留待辎重不入怀来
    rationale: 顾惜王振千余辆辎重，驻无水当冲之地，失保城自全之机
  - date: 1449-09-01
    title_zh: 信虏求和移营致阵乱被执
    rationale: 轻信虏使和议，仓促移营踰堑，行列自乱为骑蹂入所擒
- id: guji-朱祁镇-endeavor-2
  title_zh: 虏中待还南宫复位
  summary: 被留后遣使索金帛议和，历大同黑松林宴会，经李实杨善等迎请，景泰元年还京居南宫，天顺元年夺门复辟
  phases:
  - key: brewing
    name: 大同索犒黑松林安置
    labels:
      zh:
      - 酿成
    start_date: 1449-08-22
    highlight_event_id: guji-朱祁镇-event-beidi
  - key: breakthrough
    name: 李实见驾通和议迎
    labels:
      zh:
      - 突进
    start_date: 1450-07-12
    highlight_event_id: guji-朱祁镇-event-return
  - key: climax
    name: 郕王即位遥尊太上皇
    labels:
      zh:
      - 高潮
    start_date: 1449-09-07
    highlight_event_id: guji-朱祁镇-event-return
  - key: closure
    name: 还京居南宫待复辟
    labels:
      zh:
      - 收束
    start_date: 1450-09-15
    highlight_event_id: guji-朱祁镇-event-return
  decisions:
  - date: 1449-08-16
    title_zh: 手书怀来索金帛议还
    rationale: 身在虏营欲借朝廷财物缓也先，试探迎还诚意
  - date: 1450-07-12
    title_zh: 对李实自陈王振致寇悔恨
    rationale: 坦言陷虏实为除害而出皆王振所致，托通和为大事以促迎复
  - date: 1450-07-14
    title_zh: 授李实三通书达两宫群臣
    rationale: 以太上身份明示还意，安慰圣母皇帝，维系君臣迎还之望
events:
- id: guji-朱祁镇-event-birth
  date: 1427-11-29
  year_of: 1427
  title_zh: 出生于京师皇宫
  description: 宣德二年十一月十一日生，为宣宗长子，后嗣位为英宗
- id: guji-朱祁镇-event-qinzheng
  date: 1449-07-17
  year_of: 1449
  title_zh: 不听请留率军亲征
  description: 正统十四年七月十七日驾行，命郕王居守，王佐邝埜曹鼐等从，官军五十余万出居庸抵宣府大同
- id: guji-朱祁镇-event-tumu
  date: 1449-09-01
  year_of: 1449
  title_zh: 土木兵溃被拥北去
  description: 八月十五日虏使诈和，移营行列大乱，虏骑蹂阵而入，文武死伤过半，上突围不得出被拥去
- id: guji-朱祁镇-event-beidi
  date: 1449-09-14
  year_of: 1449
  title_zh: 入黑松林也先伯颜营
  description: 八月二十八日至黑松林，也先拜宴出妻奉酒，后居伯颜帖木儿营，去也先营十余里，每日献羊牛马相待
- id: guji-朱祁镇-event-return
  date: 1450-09-15
  year_of: 1450
  title_zh: 也先送还南宫居守
  description: 景泰元年经李实杨善等往返议和，也先送驾还京，入居南宫，遥称太上皇，终待天顺复辟
- id: guji-朱祁镇-event-death
  date: 1464-02-23
  year_of: 1464
  title_zh: 崩于乾清宫
  description: 天顺八年正月十七日崩，在位前后凡二十二年，遗诏止殉葬，仁恩及下
