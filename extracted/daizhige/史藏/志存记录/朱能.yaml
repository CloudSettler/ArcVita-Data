events:
- id: guji-朱能-event-birth
  year_of: '1370'
  date: ''
  name_zh: 出生（约）
  participants:
  - guji-朱能
  summary_zh: 生年史未详，洪武甲戌（1370）袭父职为燕山中护卫副千户（据袭职年推约）。
- id: guji-朱能-event-jiumen-00
  year_of: '1399'
  date: 1399-07
  name_zh: 与张玉建议首擒构祸之臣，夺北平九门
  participants:
  - guji-朱能
  - guji-张玉
  places:
  - 北平
  summary_zh: 靖难师初兴，帷幄密议惟张玉与能；率麾下首擒祸构者，遂夺九门，抚绥城内外三日，人心大定。
- id: guji-朱能-event-xiongxian-01
  year_of: '1399'
  date: 1399-08
  name_zh: 攻蓟州取遵化永平，克雄县破东门
  participants:
  - guji-朱能
  places:
  - 蓟州
  - 雄县
  summary_zh: 引兵攻蓟州擒都指挥马宣等，取遵化永平密云，从克雄县首破东门，月样桥执都督杨松潘忠。
- id: guji-朱能-event-zhending-02
  year_of: '1399'
  date: 1399-08
  name_zh: 真定大败耿炳文
  participants:
  - guji-朱能
  - guji-耿炳文
  places:
  - 真定
  - 滹沱河
  summary_zh: 乘胜长驱入真定，与敢死士三十余骑追奔至滹沱河，冲入敌阵，降者三千余人，上赐书褒谕。
- id: guji-朱能-event-zhengcunba-05
  year_of: '1399'
  date: 1399-11
  name_zh: 郑村坝大战李景隆
  participants:
  - guji-朱能
  - guji-李景隆
  places:
  - 郑村坝
  - 北平
  summary_zh: 从上至郑村坝遇景隆兵，大战败之，城中出兵夹击，景隆狼狈走。
- id: guji-朱能-event-baigouhe-06
  year_of: '1400'
  date: 1400-04
  name_zh: 白沟河为前锋大败平安及敌兵
  participants:
  - guji-朱能
  - guji-李景隆
  places:
  - 白沟河
  summary_zh: 景隆复来攻，王为前锋败都指挥平安军，明日领左哨又大败敌兵，尽克其寨栅。
- id: guji-朱能-event-cangzhou-07
  year_of: '1400'
  date: 1400-10
  name_zh: 攻沧州斩首六万余级，获徐凯
  participants:
  - guji-朱能
  - guji-徐凯
  places:
  - 沧州
  summary_zh: 先破东门入城，斩首六万余级，获总帅徐凯。
- id: guji-朱能-event-dongchang-03
  year_of: '1400'
  date: 1400-12
  name_zh: 东昌之战奋力翼上出围
  participants:
  - guji-朱能
  places:
  - 东昌
  summary_zh: 敌围上数匝，朱能奋力翼上以出。
- id: guji-朱能-event-jiahe-08
  year_of: '1401'
  date: 1401-03
  name_zh: 夹河藁城大捷
  participants:
  - guji-朱能
  - guji-盛庸
  - guji-平安
  places:
  - 夹河
  - 藁城
  summary_zh: 为奇兵先锋大败盛庸兵，又败平安于藁城，追至真定战其东门。
- id: guji-朱能-event-lingbi-09
  year_of: '1402'
  date: 1402-04
  name_zh: 灵璧先登大捷
  participants:
  - guji-朱能
  - guji-平安
  places:
  - 灵璧
  summary_zh: 先登陷阵大败敌军，生擒副总兵陈晖平安等三千余人，获马二万；此前淝河小挫时力劝整兵前进。
- id: guji-朱能-event-dujiang-10
  year_of: '1402'
  date: 1402-06
  name_zh: 克泗州扬州，从渡江入京师
  participants:
  - guji-朱能
  places:
  - 泗州
  - 扬州
  - 京师
  summary_zh: 败盛庸兵于淮，克盱眙下扬州，六月从上渡江入京师。
- id: guji-朱能-event-fengguo-04
  year_of: '1402'
  date: '1402-09-04'
  name_zh: 制封成国公
  participants:
  - guji-朱能
  summary_zh: 奉天征讨论功，朱能为左府左都督，封成国公，后追封东平武烈王。
