  dilemmas:
  - 小挫之际诸将请旋师，仍力劝燕王以宗社为重整兵前进
  lesson: 用兵未必常胜，岂可因小挫辄自沮；项羽百战百胜竟亡，汉高屡败而终兴。
  summary_first_person: 我朱能袭父职为燕山中护卫副千户，靖难初与张玉同参帷幄密议，首擒祸构者夺九门；真定之战率三十余骑冲破耿炳文数万众，东昌围中奋力翼上以出，灵璧先登大败敌军，劝进勿因小挫退兵。功封成国公，殁后追封东平武烈王。
  source_urls:
  - https://zh.wikisource.org/wiki/靖难功臣录
