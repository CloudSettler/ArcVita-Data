  era: 朝鲜后期（英祖、正祖年间）
  reign_ref: 正祖四年（清乾隆四十五年，1780）随使团赴清
  archetype: 实学家·燕行使文人
  dilemmas:
  - 尊崇明朝正朔而不敢明言，思明与事清之间的忠义困境
  - 目睹清朝富强实物，反省本国虚谈性理的风气
  lesson: 由显入微，以亲历实事谈理，利用厚生之道皆在其中
  summary_first_person: 我是朴趾源，号燕岩，随使团渡鸭绿江入清，写成《热河日记》，以纪实之笔写风谣习尚与城郭耕牧陶冶之利，兼寓言而归于谈理。我私奉崇祯纪年，念先王制度存于江东，并借观察中国以谋生民厚生之教。
  source_urls:
  - https://zh.wikipedia.org/wiki/朴趾源
