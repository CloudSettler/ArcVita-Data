  decisions:
  - date: 0629-01-01
    title_zh: 诏毋笞囚背
    rationale: 览明堂针灸图知五脏系附于背，不忍以刑残生
  - date: 0632-12-01
    title_zh: 纵死囚归家待秋决
    rationale: 亲录系囚而悯之，以信义感发人心，使期至自诣而赦之
  - date: 0636-07-01
    title_zh: 为魏徵言毁层观
    rationale: 念文德皇后不已而作观以望昭陵，闻谏而泣毁之以克情
events:
- id: guji-李世民-event-birth
  title_zh: 降生
  date: 0598-01-28
  year_of: 598
  description: 隋开皇十七年生于武功别馆，陇西李氏，高祖次子
- id: guji-李世民-event-hongwen
  title_zh: 弘文开馆
  date: 0626-09-04
  year_of: 626
  description: 聚四部书二十余万卷，选虞世南褚亮等兼学士，听朝之隙引入内殿讲论至夜分
- id: guji-李世民-event-najian
  title_zh: 纳箴赐帛
  date: 0627-03-01
  year_of: 627
  description: 张蕴古上大宝箴，陈为君实难勿纵欲傲贤，上嘉之赐帛除大理丞
- id: guji-李世民-event-zhuzhi
  title_zh: 主明臣直
  date: 0628-06-01
  year_of: 628
  description: 罢朝怒魏徵廷辱，长孙皇后具朝服贺主明臣直，上乃悦
- id: guji-李世民-event-huaiyao
  title_zh: 敬贤怀鹞
  date: 0630-01-01
  year_of: 630
  description: 得佳鹞自臂，望见魏徵来匿怀中，徵奏事久不已鹞死怀中而不问
- id: guji-李世民-event-jinzhang
  title_zh: 览图禁杖
  date: 0629-01-01
  year_of: 629
  description: 览明堂针灸图知人五脏系附于背，诏自今毋得笞囚背
- id: guji-李世民-event-zongqiu
  title_zh: 纵囚归狱
  date: 0632-12-01
  year_of: 632
  description: 纵天下死囚三百九十人归家期秋就死，至期皆自诣朝堂无亡匿者悉赦之
- id: guji-李世民-event-huiling
  title_zh: 望陵毁观
  date: 0636-07-01
  year_of: 636
  description: 葬文德皇后于昭陵，作层观以望，引魏徵同登，闻讽而泣为毁观
- id: guji-李世民-event-jiaochu
  title_zh: 遇物教储
  date: 0640-01-01
  year_of: 640
  description: 自立太子遇物诲之，见饭言稼穑艰难，见舟言水能载覆，见木言从谏则圣
- id: guji-李世民-event-death
  title_zh: 崩于含风殿
  date: 0649-07-10
  year_of: 649
  description: 贞观二十三年崩于翠微宫含风殿，在位二十三年，谥文皇帝庙号太宗
