  decisions:
  - date: 0626-09-04
    title_zh: 置弘文馆延四部书
    rationale: 聚虞世南褚亮等更日宿直，讲论前言往行以资治理
  - date: 0627-03-01
    title_zh: 嘉大宝箴赐帛擢官
    rationale: 以一人治天下不以天下奉一人，深夜省览以自儆
  - date: 0628-06-01
    title_zh: 容魏徵廷争不杀
    rationale: 知主明则臣直，以直臣为镜而得失可见
