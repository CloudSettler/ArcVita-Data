endeavors:
- id: guji-李之彦-endeavor-1
  title_zh: 湖海游历设帐教人
  summary: 四五十年来往湖海为公卿家及白屋授业不问束修多寡以尽心开导为阴德
  phases:
  - key: brewing
    name: 少时闻赴省士子以尽心教导回造化立志效之
    labels:
      zh: 种阴德
    start_date: '1175'
    highlight_event_id: guji-李之彦-event-teaching
  - key: breakthrough
    name: 湖海授徒不贰贫富贵贱之心
    labels:
      zh: 有教无类
    start_date: '1190'
    highlight_event_id: guji-李之彦-event-teaching
  - key: climax
    name: 年近七旬自省五典百行以教导可取自慰
    labels:
      zh: 自警
    start_date: '1223'
    highlight_event_id: guji-李之彦-event-writing
  - key: closure
    name: 归里垂训戒误人子弟庸师
    labels:
      zh: 垂训
    start_date: '1225'
    highlight_event_id: guji-李之彦-event-writing
  decisions:
  - date: '1190'
    title_zh: 不以贫富束修多寡贰心
    rationale: 以留心教导为种大阴德可以对越故一视同仁尽心开导
  - date: '1223'
    title_zh: 年近七旬不敢自恕但当自警
    rationale: 寸名不就身计茫然恐五典不饬百行有亏惟以教导一节自勉
- id: guji-李之彦-endeavor-2
  title_zh: 撰东谷所见针砭时俗
  summary: 目击孝养有亏物价侈靡科举谬滥狱讼冤滥军粮拖欠等弊随见随书以扶名教
  phases:
  - key: brewing
    name: 归故里拜先垄见伐墓木诉状无门含垢饮气
    labels:
      zh: 伤狱讼
    start_date: '1220'
    highlight_event_id: guji-李之彦-event-return
  - key: breakthrough
    name: 观永嘉科举物价养军之弊发愤笔录
    labels:
      zh: 忧民瘼
    start_date: '1222'
    highlight_event_id: guji-李之彦-event-writing
  - key: climax
    name: 成东谷所见二十余则论孝亲劝学戒贪
    labels:
      zh: 立言垂世
    start_date: '1223'
    highlight_event_id: guji-李之彦-event-writing
  - key: closure
    name: 以野叟自处乐闲息贪祝愿天下安乐
    labels:
      zh: 守闲
    start_date: '1225'
    highlight_event_id: guji-李之彦-event-writing
  decisions:
  - date: '1222'
    title_zh: 不咎物价踊贵但咎风俗侈靡而书之
    rationale: 室庐衣服饮食器具皆竞尚华靡故转移风俗方为渐平之道
  - date: '1223'
    title_zh: 直斥劝学文误人及狱吏自撰供答之弊
    rationale: 贪饕者蔽锢于黄金屋而冤滥者呼天不闻故不可不深责而归咎
