  dilemmas:
  - 贫富贵贱劳逸安危之间当守清闲道义还是逐功名富贵
  - 教导子弟若不用心则所得束修与受赃同当如何自警自守
  lesson: 身闲则为富心闲则为贵守道教人不负束修不逐声利
  summary_first_person: 余游湖海四五十年教公卿大夫子孙及白屋之属不以贫富贵贱束修多寡贰心晚年归故里观风俗侈靡物价腾踊科举贪饕狱讼冤滥遂笔为东谷所见以自警而警世
  source_urls:
