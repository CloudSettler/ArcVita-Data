person:
  qid: guji-李元昊
  name_zh: 李元昊
  names:
    zh: 李元昊／曩霄
    en: Li Yuanhao (Emperor Jingzong of Western Xia)
  lifespan:
    birth:
      date: '1003'
      precision: year
      is_circa: true
      raw: 古文未载生年，据卒年四十六推算约在宋真宗年间
    death:
      date: '1048'
      precision: year
      is_circa: false
      raw: 因劓创死，年四十六
  birth_date: 约1003
  death_date: '1048'
  era: 北宋中期／西夏建国时期
  reign_ref: 西夏景宗，天授礼法延祚（1040—1048）
  archetype: 雄猜之主／叛立开国者
  dilemmas:
  - 对宋称臣纳贡与僭号称帝之间的取舍
  - 依仗武力征服与国内天旱、蕃部叛离的困局
  - 猜忌诛杀左右权臣引发宫廷仇杀
  lesson: 元昊性凶鸷多猜忌，虽称霸一方而众叛亲离，终死于宫闱之变——开国易，守成与得人心难。
  summary_first_person: 我李元昊通汉文、晓浮图，袭定难军节度使后劝父叛宋，终筑坛僭号建大夏，犯边七年好水川、定川皆败宋军，又大破契丹；然晚年猜忌好杀，夺子妻、诛野利氏，终为太子宁令哥劓鼻，因创而死。
  source_urls:
  - 《西夏事略》（宋）王称撰
endeavors:
- id: guji-李元昊-endeavor-1
  name_zh: 袭爵谋叛
  phases:
  - key: brewing
    name_zh: 数劝其父德明反宋
    labels:
      zh: 劝反
    start_date: 约1020
    highlight_event_id: guji-李元昊-event-pressure
  - key: breakthrough
    name_zh: 袭定难军节度使，封西平王，改元避讳
    labels:
      zh: 袭爵
    start_date: 1032
  - key: climax
    name_zh: 寇环庆、陷瓜沙肃三州，尽得河西
    labels:
      zh: 略河西
    start_date: 1034
    highlight_event_id: guji-李元昊-event-revolt
  - key: closure
    name_zh: 筑坛受册，僭号建大夏，改元天授礼法延祚
    labels:
      zh: 建国
    start_date: 1038
    highlight_event_id: guji-李元昊-event-usurp
  decisions:
  - date: 1032
    title_zh: 避父讳改“明道”为“显道”
    rationale: 以改元示独立之志
  - date: 1038
    title_zh: 筑坛受册僭号称帝
    rationale: 恐唃厮啰制其后，先定河西再叛宋建号
  - date: 1042
    title_zh: 遣高延德求通和，与范仲淹往复书
    rationale: 国内天旱、蕃部叛、野利内叛，欲以和缓兵
- id: guji-李元昊-endeavor-2
  name_zh: 对宋战争与和议
  phases:
  - key: brewing
    name_zh: 寇金明寨执李士彬，攻延州三川口
    labels:
      zh: 三川口
    start_date: 1040
    highlight_event_id: guji-李元昊-event-sanchuankou
  - key: breakthrough
    name_zh: 好水川败任福，转寇河东陷丰州
    labels:
      zh: 好水川
    start_date: 1041
  - key: climax
    name_zh: 定川之战葛怀敏死，大举入寇
    labels:
      zh: 定川
    start_date: 1042
  - key: closure
    name_zh: 遣使称臣禀正朔，宋册为夏国王，岁赐二十五万五千
    labels:
      zh: 庆历和议
    start_date: 1044
    highlight_event_id: guji-李元昊-event-vassalage
  decisions:
  - date: '1043'
    title_zh: 更名曩霄，自称“男邦皃定国兀卒”上书宋帝
    rationale: 欲不称臣而取对等名分，为籍所拒
  - date: '1044'
    title_zh: 称臣奉正朔受册封
    rationale: 连年战争国疲天旱，籍边臣劝谕取岁赐之利
- id: guji-李元昊-endeavor-3
  name_zh: 抗拒契丹
  phases:
  - key: brewing
    name_zh: 留契丹投附之保家族八百户不遣
    labels:
      zh: 拒索
    start_date: '1044'
  - key: climax
    name_zh: 与宗真各据一山对峙，奉卮酒折箭为誓
    labels:
      zh: 对峙
    start_date: '1044'
  - key: closure
    name_zh: 觉契丹劫持之谋，以兵拒之，大败契丹，纵宗真东走
    labels:
      zh: 败契丹
    start_date: '1044'
    highlight_event_id: guji-李元昊-event-khitan
  decisions:
  - date: '1044'
    title_zh: 留保家族不遣，面对亲征不惧
    rationale: 恃河东、河西已定与兵力十五万余
- id: guji-李元昊-event-palace-endeavor
  name_zh: 宫廷猜忌与 TMZ 内乱（未用术语，仅列维度）endeavor
  phases:
  - key: brewing
    name_zh: 纳没哆氏、夺太子妻，诛野利遇乞三家
    labels:
      zh: 诛野利
    start_date: 约1045
  - key: climax
    name_zh: 与没藏氏私通，出为尼而生谅祚
    labels:
      zh: 没藏之祸
    start_date: 约1046
  - key: closure
    name_zh: 宁令哥愤而杀父劓鼻，讹庞杀宁令哥，没藏氏立谅祚
    labels:
      zh: 弑立
    start_date: '1048'
    highlight_event_id: guji-李元昊-event-death
  decisions:
  - date: 约1047
    title_zh: 夺宁令哥未婚妻没哆氏自纳为新皇后
    rationale: 贪其色而不顾储嗣之怨，种杀身之祸
