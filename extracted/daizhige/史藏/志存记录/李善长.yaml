  archetype: 开国文臣之首·功高遭忌的宰相
  dilemmas:
  - 位居太师、左丞相，位极人臣，却因功高震主卷入胡惟庸党狱
  - 早年随太祖渡江建功，晚年以罪赐死，功臣与罪臣身份仅一线之隔
  lesson: 开国元勋虽掌簿书、定规制，然君威之下功名难保，知进退者方能令终
  summary_first_person: 我李善长以文臣之身随太祖渡江起义，官至太师、中书左丞相，先封宣国公，洪武三年进封韩国公，为开国六公之一。后十七年论功臣次第，我以专掌簿书、听候指示居功臣之列。孰料洪武二十四年竟以罪赐死，子祺尚顺德公主亦不能庇我于末路。
  source_urls:
  - 损斋备忘录·纪事（明·梅纯撰）
