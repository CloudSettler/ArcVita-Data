  title_zh: 出生于山西平遥
  date: 1865-01-01
  year_of: 1865
  raw: 约清同治四年
  summary: 生于平遥李氏，自幼肄业票庄，熟谙汇业
- id: guji-李宏龄-event-bank-plan
  title_zh: 戊申春驻京与渠楚南商订银行章程
  date: 1908-04-23
  year_of: 1908
  raw: 戊申三月二十三日，京都平帮公议
  summary: 目击中外银行夺我利权，公举渠楚南为总理，拟设晋省汇业银行，集股五百万，每家出资三五万金为有限公司
- id: guji-李宏龄-event-bank-blocked
