endeavors:
- id: guji-李宏龄-endeavor-1
  title_zh: 倡设晋省汇业银行以救票业
  summary: 戊申春驻京与渠楚南商订章程，函商总号，征集各埠意见，谋以有限公司集股五百万，自保利权，抵制中外银行
  phases:
  - key: brewing
    name: 目睹利权外夺而生变计
    labels:
      zh:
      - 票商危机
      - 银行林立
    start_date: 1907-01-01
    highlight_event_id: guji-李宏龄-event-bank-plan
  - key: breakthrough
    name: 京师商订章程并公举渠楚南
    labels:
      zh:
      - 京都公议
      - 推举总理
    start_date: 1908-04-23
    highlight_event_id: guji-李宏龄-event-bank-plan
  - key: climax
    name: 通函各埠众论佥同而总号领袖力阻
    labels:
      zh:
      - 众志成城
      - 领袖反对
    start_date: 1908-10-01
    highlight_event_id: guji-李宏龄-event-bank-blocked
  - key: closure
    name: 筹议烟消云散而预言成谶
    labels:
      zh:
      - 辛亥倒帐
      - 追悔无及
    start_date: 1912-01-01
    highlight_event_id: guji-李宏龄-event-write-book
  decisions:
  - date: 1908-04-23
    title_zh: 推渠楚南为银行总理并函达总号
    rationale: 楚南谙熟商情且游历东洋，非彼不足取信于晋帮，亦可专主操纵不受官压
  - date: 1908-10-01
    title_zh: 复通函各埠征集意见以促总号
    rationale: 总号执事不商股东而欲束阁公议，惟借各埠公信洞悉市面以破守旧之局
- id: guji-李宏龄-endeavor-2
  title_zh: 编著山西票商成败记以存史垂鉴
  summary: 机会已失商务已衰，乃排列筹设银行前后信件，详述票商盛衰之由，辨明天数人事，以警后人
  phases:
  - key: brewing
    name: 票商鼎盛而隐患渐萌
    labels:
      zh:
      - 汇兑天下
      - 庚子信用
    start_date: 1900-01-01
    highlight_event_id: guji-李宏龄-event-bank-plan
  - key: breakthrough
    name: 收集京都汉口各埠往返公函
    labels:
      zh:
      - 存信
      - 征信
    start_date: 1908-02-01
    highlight_event_id: guji-李宏龄-event-bank-blocked
  - key: climax
    name: 辛亥壬子票号倒帐而银行独存
    labels:
      zh:
      - 外欠倒帐
      - 蔚丰改组
    start_date: 1911-10-10
    highlight_event_id: guji-李宏龄-event-write-book
  - key: closure
    name: 民国六年撰序成书以质有识
    labels:
      zh:
      - 绕朝赠策
      - 质诸后世
    start_date: 1917-07-01
    highlight_event_id: guji-李宏龄-event-write-book
  decisions:
  - date: 1912-02-01
    title_zh: 以保存信件为据直书领袖之误
    rationale: 盛衰虽曰天命实系人事，须原始要终使阅者知败因不在外患而在自误
  - date: 1917-07-01
    title_zh: 于无可救药之时仍撰序刊行
    rationale: 纵救时无策亦不忍耿耿自已，愿以后事之师警醒晋商与国人
events:
