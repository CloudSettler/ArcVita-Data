  raw: 中华民国六年阳历七月平遥子寿撰
  summary: 辛亥以后票商外欠倒帐欠外提款，蔚丰厚改组独存，遂编次前后信件成书，明票商之败果天数抑人事
- id: guji-李宏龄-event-death
  title_zh: 卒于民国以后
  date: 1930-01-01
  year_of: 1930
  raw: 民国以后卒年不详
  summary: 书成之后行迹不显，卒于民国年间
