  summary: 汉口上海各埠皆言银行不得不设，总号某公斥为自谋发财，命来函径束高阁，筹办之议遂散
- id: guji-李宏龄-event-write-book
  title_zh: 民国六年撰山西票商成败记序
  date: 1917-07-01
