  era: 明末清初
  reign_ref: 永历
  archetype: 悲壮孤忠的抗清统帅
  dilemmas:
  - 义父张献忠败亡后，率大西军余部转战西南，面临降清与联明抗清的抉择
  - 孙可望与永历朝廷内讧，忠义与实力权衡两难
  - 永历帝遁入缅甸后，孤军苦撑，复兴无望仍不肯降清
  lesson: 大厦将倾之际，忠诚与担当虽难挽天命，却能立千古气节
  summary_first_person: 我本张献忠义子，献忠殁后，我联明抗清，受封西宁王，两蹶名王，威震天下；孙可望跋扈内讧，我护永历帝辗转滇黔，及帝蒙难，我忧愤病殁于中缅边境，至死不降。
  source_urls:
  - https://zh.wikipedia.org/wiki/李定国
