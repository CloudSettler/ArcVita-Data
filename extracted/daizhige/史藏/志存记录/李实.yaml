person:
  qid: guji-李实
  name_zh: 李实
  names:
    zh: 李实
    en: Li Shi
  lifespan:
    birth:
      date: 1410
      precision: year
      is_circa: true
      raw: 生年未详，约明初
    death:
      date: 1465
      precision: year
      is_circa: true
      raw: 卒年未详
  birth_date: 1410
  death_date: 1465
  era: 明
  reign_ref: 明英宗正统景泰之际
  archetype: 忠节奉使之臣
  dilemmas:
  - 国势危弱而奉命深入虏营，既须不弱国体，又须促成和议迎复
  - 也先诘问旧事杀使之由，须直陈曲直以释疑而不激变
  - 复命之后群议犹豫，须冒罪建言以全迎复大信
  lesson: 敌国讲和以信为本，使臣不避险而直言，方能转危为安，迎复銮舆
  summary_first_person: 吾本礼科给事中，景泰初奉命升侍郎使瓦剌，历险见也先及太上皇于失八儿秃，力陈和好大义而归，复极言迎复以全大信
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%8C%97%E4%BD%BF%E5%BD%95.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%8C%97%E4%BD%BF%E5%BD%95.html
endeavors:
- id: guji-李实-endeavor-1
  title_zh: 北使瓦剌议和奉迎
  summary: 景泰元年六月受命为正使，赍敕往也先营议和，面折虏酋，朝见太上皇，约定迎复
  phases:
  - key: brewing
    name: 临危受命
    labels:
      zh: 受命北使
    start_date: 1450-06-28
    highlight_event_id: guji-李实-event-dispatch
  - key: breakthrough
    name: 直入虏营折辩
    labels:
      zh: 面折也先
    start_date: 1450-07-11
    highlight_event_id: guji-李实-event-yexian
  - key: climax
    name: 朝见上皇受托
    labels:
      zh: 朝见请迎
    start_date: 1450-07-12
    highlight_event_id: guji-李实-event-meet-emperor
  - key: closure
    name: 约期携使南归
    labels:
      zh: 约期南归
    start_date: 1450-07-14
    highlight_event_id: guji-李实-event-return
  decisions:
  - date: 1450-06-28
    title_zh: 慨然应诏北行
    rationale: 朝廷多事之秋，不敢以才识不周辞，愿冒险通两国之情
  - date: 1450-07-11
    title_zh: 面陈王振误国与边军奋勇以释杀使之疑
    rationale: 明辨是非以解也先之憾，示南朝不可轻犯，坚其和意
  - date: 1450-07-12
    title_zh: 劝上皇引咎谦退以全社稷
    rationale: 任用非人致蒙尘，当自责避位以安宗社，促成迎复大义
- id: guji-李实-endeavor-2
  title_zh: 复命建言成迎复
  summary: 还京复命详陈虏情实意，上疏请另遣大臣迎复，授杨善以虏情始终，终成上皇还京
  phases:
  - key: brewing
    name: 还京复命
    labels:
      zh: 复命陈情
    start_date: 1450-07-21
    highlight_event_id: guji-李实-event-report
  - key: breakthrough
    name: 传情于后使
    labels:
      zh: 授杨善虏情
    start_date: 1450-07-19
    highlight_event_id: guji-李实-event-handover
  - key: climax
    name: 上疏请迎
    labels:
      zh: 建言迎复
    start_date: 1450-07-25
    highlight_event_id: guji-李实-event-memorial
  - key: closure
    name: 銮舆还京礼成
    labels:
      zh: 还京奠安
    start_date: 1450-08-16
    highlight_event_id: guji-李实-event-huanhuan
  decisions:
  - date: 1450-07-19
    title_zh: 尽以虏情应对之词告杨善
    rationale: 使后使无讹以全始终，避免前后异辞致虏生疑
  - date: 1450-07-25
    title_zh: 昧死请另遣大臣迎复守约
    rationale: 若失约则曲在我，和议不成则上皇不可复，干戈不可息
events:
- id: guji-李实-event-birth
  date: 1410
  year_of: 1410
  type: birth
  title_zh: 出生
  description: 生于明初，举业入仕，官至礼科给事中，以忠节知名
- id: guji-李实-event-dispatch
  date: 1450-06-28
  year_of: 1450
  type: mission
  title_zh: 受命北使
  description: 景泰元年六月奉诏升兵部右侍郎改礼部右侍郎为正使，与罗绮马显赍敕往瓦剌议和
- id: guji-李实-event-yexian
  date: 1450-07-11
  year_of: 1450
  type: mission
  title_zh: 失八儿秃面折也先
  description: 至也先营开读敕书，论王振专权马价之失，辨姚谦张关保被杀之由，说喜宁伏诛之故，得也先欢喜言和
- id: guji-李实-event-meet-emperor
  date: 1450-07-12
  year_of: 1450
  type: mission
  title_zh: 朝见太上皇受托迎复
  description: 往伯颜帖木儿营朝见上皇，闻蒙尘本末及迎复之嘱，劝以引咎谦退，领袖出三书而还
- id: guji-李实-event-return
  date: 1450-07-14
  year_of: 1450
  type: mission
  title_zh: 辞别约期南归
  description: 与也先辞，别上皇，约定迎接之期，偕瓦剌使把秃儿等南还，经宣府怀来而东
- id: guji-李实-event-handover
  date: 1450-07-19
  year_of: 1450
  type: mission
  title_zh: 怀来授杨善以虏情
  description: 于怀来遇后使杨善赵荣，备细言虏情应对迎复之礼，使彼无讹以全始终
- id: guji-李实-event-report
  date: 1450-07-21
  year_of: 1450
  type: court
  title_zh: 文华殿复命
  description: 还京复命，具陈也先讲和喜悦之状及太上皇之旨，奏虏人和意似实而变诈难测，请上处置
- id: guji-李实-event-memorial
  date: 1450-07-25
  year_of: 1450
  type: memorial
  title_zh: 上疏请遣大臣迎复
  description: 言前使专为讲和今已事完，迎复之约出自也先，若失约则曲在我，请另差有能大臣奉迎以全大信
- id: guji-李实-event-huanhuan
  date: 1450-08-16
  year_of: 1450
  type: ceremony
  title_zh: 上皇还京奠安
  description: 杨善迎太上皇自野狐岭经宣府怀来还京，百官迎于东安门外，入南城，上皇下诏兄弟相让，社稷奠安
- id: guji-李实-event-death
  date: 1465
  year_of: 1465
  type: death
  title_zh: 逝世
  description: 北使迎复事成之后，行迹不详，终老于明中期
