events:
- id: guji-李密-event-birth
  type: birth
  date: 0582
  year_of: 582
  title_zh: 出生辽西
  description_zh: 李密字玄邃，辽西人，本姓屠何，曾祖南奔改姓李，父系累仕至蒲山公，密遂起家
- id: guji-李密-event-xuangan
  type: career
  date: 395
  year_of: 613
  title_zh: 从杨玄感画三策兵败逃亡
  description_zh: 晋杨玄感将反，密为画上中下三策，玄感用下策东据黎阳，反败走自杀，密逃至魏郡后依翟让
- id: guji-李密-event-weigong
  type: career
  date: 0616-04-27
  year_of: 616
  title_zh: 瓦岗称魏公布檄数隋十罪
  description_zh: 自号魏国公，令祖君彦作书布告天下，以永平元年四月二十七日檄文列隋十罪，据兴洛黎阳诸仓，豪杰响应
- id: guji-李密-event-tangshu
  type: career
  date: 0617-08-01
  year_of: 617
  title_zh: 与唐高祖书信往来自居盟主
  description_zh: 唐公屯寿阳遣使致书，密复书自居盟主欲会盟河内，唐公优待答之，言使频遣，徐鸿客献经天纬地策劝直捣江都
- id: guji-李密-event-jiangtang
  type: career
  date: 0618-10-01
  year_of: 618
  title_zh: 受越王太尉封讨宇文化及
  description_zh: 化及弑炀帝于江都，越王侗即位授密太尉尚书令兼征讨诸军事，总兵术戎机以讨逆
- id: guji-李密-event-fupan
  type: career
  date: 0618-12-01
  year_of: 618
  title_zh: 降唐后叛走出关
  description_zh: 化及灭后势孤降唐，封邢国公，旋以不甘久居人下，叛走出关图再起
- id: guji-李密-event-death
  type: death
  date: 0619-01-20
  year_of: 619
  title_zh: 死于熊耳山
  description_zh: 唐武德二年正月，密叛走至熊耳山为唐军所斩，一代魏公就此陨命
