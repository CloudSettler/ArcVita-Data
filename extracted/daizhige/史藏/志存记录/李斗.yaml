person:
  qid: guji-李斗
  name_zh: 李斗
  names:
    zh: 李斗
    en: Li Dou
  lifespan:
    birth:
      date: '1745'
      precision: year
      is_circa: true
      raw: 约1745年
    death:
      date: '1803'
      precision: year
      is_circa: true
  birth_date: 约1745年
  death_date: 约1803年
  era: 清代乾隆年间
  reign_ref: 乾隆
  archetype: 文人地理学者
  dilemmas:
  - 幼失学、疏于经史，却欲以一己见闻为扬州立传
  - 志书详古略今，近世事与俗谈难登大雅，取舍之间恐有遗漏之讥
  lesson: 以地立目、以人记事，三十年足目所至，亦可为一城留影
  summary_first_person: 我李斗，仪征人，幼失学而好游山水，尝三至粤西、七游闽浙、一往楚豫、两上京师。退居后泛舟湖上，遍历扬州诸工段，将目见耳闻之事——贤士大夫之流风余韵，乃至琐细俚俗之谈，悉数记之，积三十年而成《扬州画舫录》，以地为经、以人物记事为纬。
  source_urls:
  - https://zh.wikipedia.org/wiki/扬州画舫录
