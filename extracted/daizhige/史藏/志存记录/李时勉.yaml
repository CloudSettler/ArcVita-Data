  reign_ref: 明仁宗洪熙至明英宗正统
  archetype: 直谏师儒
  dilemmas:
  - 直言匡主将陷杀身与沉默保位之抉择
  - 权阉当国时趋附免祸与守正不贺受辱之抉择
  lesson: 守正直谏以匡君，立教育才以化人，患难不移而风教长存
  summary_first_person: 余安福李时勉，永乐进士，历侍讲祭酒。以谏后宫储事触怒仁宗，系狱几死，得杨士奇救免。宣宗复余官，正统掌太学，号古廉先生。不贺王振生辰，荷百斤枷，诸生伏阙愿代。余愿以直道事君，以师道育人。
