  year_of: 1435
  kind: career
  place_zh: 国子监
  summary_zh: 正统间为祭酒，多所造就，六堂敬爱，私号古廉先生，有沧海之量父母之心
- id: guji-李时勉-event-jia
  title_zh: 抗王振荷百斤枷诸生伏阙愿代
  date: 1441
  year_of: 1441
  kind: career
  place_zh: 国子监
  summary_zh: 以不贺王振生辰坐擅斫文庙古木置百斤枷，自荷最重者，诸生司马询等数百人伏阙愿代，三日得苏
- id: guji-李时勉-event-death
  title_zh: 卒于景泰元年
  date: 1450
  year_of: 1450
  kind: death
  place_zh: 京师
  summary_zh: 致仕后卒，谥忠文，士论惜其直节师范
