    title_zh: 服药变髭鬓一夕成霜
    rationale: 自念非老成无以弹压跋扈，故以白发示重，安定诸藩入觐之心
  - date: '0937-10-01'
    title_zh: 决意受杨吴内禅即皇帝位
    rationale: 夜梦断颈得周宗策立之贺，人情既定，天命有归，不可久虚大器
