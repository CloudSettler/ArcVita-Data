    title_zh: 以梦符验正齐王储位
    rationale: 昼梦黄龙缭绕殿槛而齐王凭槛时刻向背皆符，天意谆谆，成家事者必此子
  - date: 0940
    title_zh: 旬月之间速定大统之嗣
    rationale: 恐储位久虚生变，当趁天人同应之时早定名分以固国本
