  birth_date: 1823
  death_date: 1864-08-07
  era: 清末
  reign_ref: 咸丰
  archetype: 忠义智勇兼全之名将
  dilemmas:
  - 忠君尽节与将在外君命有所不受之抉择
  - 随石达开远走图鼎足霸业与留守金陵支拄危局之抉择
  lesson: 空有破坏建设兼长之才而困于不学无术与愚忠，不悟独断大义，终以身殉
  summary_first_person: 吾自金田从军，屡克大郡，不屠城，不杀降，解京口镇江之围，大破向荣江南大营，桐城大捷后掌朝政以支拄危局，终以忠王之名殉国
  source_urls:
  - https://daizhige.org/史藏/志存记录/太平天国战记.html
endeavors:
- id: guji-李秀成-endeavor-1
  title_zh: 解京口镇江围大破江南大营
  summary_zh: 与陈玉成等援京口，潜师夹击破张国梁和春，复取扬州，破汤头，回师金陵击溃向荣，加封合天侯
  phases:
  - key: brewing
    name: 受命援救京口
    labels:
      zh: 筹划受命
    start_date: 1856-05-01
    highlight_event_id: guji-李秀成-event-jingkou
  - key: breakthrough
    name: 潜入京口夹击破敌
    labels:
      zh: 奇袭突破
    start_date: 1856-06-01
    highlight_event_id: guji-李秀成-event-jingkou
  - key: climax
    name: 扬州汤头连捷破向荣大营
    labels:
      zh: 决战高潮
    start_date: 1856-07-01
    highlight_event_id: guji-李秀成-event-jiangnan
  - key: closure
    name: 论功加封合天侯
    labels:
      zh: 收束封赏
    start_date: 1856-09-01
    highlight_event_id: guji-李秀成-event-jiangnan
  decisions:
  - date: 1856-06-01
    title_zh: 分兵潜入京口内外夹击
    rationale: 京口被围粮绝，欲令一人由江潜入，出兵夹击，诸将不敢应，遂与陈玉成定内外合击之策
  - date: 1856-08-01
    title_zh: 弃扬州孤城回师破汤头断敌归路
    rationale: 扬州孤悬江北留守不便，汤头后路被截则归路阻，宜疾渡南徐猝击汤头，连破十余营以通江浦浦口
- id: guji-李秀成-endeavor-2
  title_zh: 拒从远走支拄朝政兼援桐城宁国
  summary_zh: 杨韦内讧后拒从石达开入川，招纳张乐行以障江北，援桐城破秦定三，收复巢县庐江宁国，掌朝政定人心
  phases:
  - key: brewing
    name: 内讧后人心动摇招纳新军
    labels:
      zh: 招贤蓄势
    start_date: 1857-02-01
    highlight_event_id: guji-李秀成-event-tongcheng
  - key: breakthrough
    name: 拒从石达开留守金陵
    labels:
      zh: 明志留守
    start_date: 1857-10-01
    highlight_event_id: guji-李秀成-event-tongcheng
  - key: climax
    name: 桐城运漕大捷解围收复州县
    labels:
      zh: 大捷解围
    start_date: 1858-02-01
    highlight_event_id: guji-李秀成-event-tongcheng
  - key: closure
    name: 加封合天燕掌朝政支拄危局
    labels:
      zh: 辅政收局
    start_date: 1858-03-01
    highlight_event_id: guji-李秀成-event-tongcheng
  decisions:
  - date: 1857-10-01
    title_zh: 拒绝随石达开入川图鼎足
    rationale: 已弃乡井捐生命图功业，中道易心后世讥议，决不行，劝陈玉成止兵不行
  - date: 1858-02-01
    title_zh: 绘图授策令陈玉成抄击庐江巢县
    rationale: 桐城失则安庆不保，檄玉成解宁国围以救桐城，先攻无为抄巢县兜击庐江，再夹击秦定三
events:
- id: guji-李秀成-event-birth
  title_zh: 出生于广西藤县
  date: 1823
  year_of: 1823
  description: 道光三年生于广西藤县贫农之家，后从金田起义
- id: guji-李秀成-event-jingkou
  title_zh: 夜援京口解镇江围
  date: 1856-06-01
  year_of: 1856
  description: 与陈玉成等四丞相援京口，陈玉成潜入城中，秀成率奇兵绕张国梁军后痛击，大败国梁，解京口围，再破和春于丹徒
- id: guji-李秀成-event-jiangnan
  title_zh: 大破向荣江南大营进封合天侯
  date: 1856-09-01
  year_of: 1856
  description: 秋八月抵金陵，奇兵出溧水断粮之议不用，亲率将士击丹徒破张国梁三万，与石达开夹攻向荣六十余垒，向军溃退丹阳，论功加合天侯
- id: guji-李秀成-event-tongcheng
  title_zh: 桐城大捷加封合天燕
  date: 1858-03-01
  year_of: 1858
  description: 咸丰八年二月，与陈玉成合击秦定三多隆阿都兴阿，收巢县庐江，大破定三于桐城，还攻宁国清军弃城走，加封合天燕
- id: guji-李秀成-event-death
  title_zh: 金陵倾覆后殉国
  date: 1864-08-07
  year_of: 1864
  description: 同治三年金陵倾覆被执，在囚笼中亲笔供述数万言，七月初六日罹极刑，以身殉国
