  summary_first_person: 吾本梧州藤县佣耕小民少从舅读书生计窘乏二十六七为洪逆裹胁隶胡以晃麾下由军帅监军指挥积战至地官副丞相忠王转战皖江浙沪终以天京倾覆舍命护幼主突围被执而死一生涂炭生灵岂吾初愿哉
