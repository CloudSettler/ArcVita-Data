    title_zh: 结张乐形龚得树以自固
    rationale: 以数十万捻众为援声势颇张得以封地官副丞相踞桐城抗官军
  - date: 1858
    title_zh: 求援陈玉成断官军饷道
    rationale: 桐城被围甚急请陈玉成陷庐江溯江出大关断饷道内外合击以解围
- id: guji-李秀成-endeavor-2
  title_zh: 东征苏浙与天京殉节
  summary: 受封忠王后由芜湖间道陷杭州苏常嘉兴继陷杭宁绍温台后力谏固守不听终护幼主突围被执戮于金陵
