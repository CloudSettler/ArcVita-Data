  decisions:
  - date: 1860
    title_zh: 由芜湖取间道袭广德武康
    rationale: 避张帅正面分兵往援合杨辅清李世贤陈玉成四面夹击溃江南大营
  - date: 1863
    title_zh: 密谏固守伺懈而击
    rationale: 以曾帅水军由上而下我劳彼逸不可与争不如多备粮械固守待懈洪逆不从遂失苏常宁杭仅踞金陵
events:
- id: guji-李秀成-event-birth
  title_zh: 生于藤县宁风乡
  date: 1823
  year_of: 1823
  description: 广西梧州府藤县宁风乡长恭里新旺村人佣耕自活少时从舅氏读书及长归父母家生计窘乏
- id: guji-李秀成-event-congni
  title_zh: 裹胁从逆隶胡以晃麾下
  date: 1851
  year_of: 1851
  description: 二十六七时洪逆煽众路经其村裹胁而去隶春官丞相胡以晃麾下为兵旋举为右四军帅守金陵太平门外新营由监军擢至指挥
- id: guji-李秀成-event-tongcheng
  title_zh: 踞桐城内外合击解围
  date: 1858
  year_of: 1858
  description: 封地官副丞相踞桐城抗秦定三围急求援陈玉成陈陷庐江出大关断饷道内外合击官军大挫围解旋扰六安霍山丙辰抗张国梁于仓头
- id: guji-李秀成-event-quanjiao
  title_zh: 招集芜湖众陷全椒来安
  date: 1859
  year_of: 1859
  description: 屯黄池指麾伪政招集芜湖贼众由昭关顺流陷全椒来安纠陈玉成攻走德军分下游官军之势贼巢得接济
- id: guji-李秀成-event-zhongwang
  title_zh: 浦口风波伪封忠王
  date: 1859
  year_of: 1859
  description: 在浦口时军中有招其投诚者为洪逆所闻惧其去伪封忠王更书万古忠义四字赐之
- id: guji-李秀成-event-hangzhou
  title_zh: 间道陷杭苏常尽陷
  date: 1860
  year_of: 1860
  description: 庚申春由芜湖取间道至广德窜泗安由武康陷杭垣合辅王侍王英王四面夹击溃江南大营张总统殉丹阳和帅缢浒关苏常嘉兴相继陷
- id: guji-李秀成-event-suzhou
  title_zh: 席卷江浙纳众数十万
  date: 1861
  year_of: 1861
  description: 辛酉冬杭垣再陷宁绍温台相继失守曾窜江西湖北收纳叛民数十万为曾军所扼狼狈逃回是秋安庆为官军克复断上游之臂
- id: guji-李秀成-event-death
  title_zh: 金陵陷护幼主被戮
  date: 1864
  year_of: 1864
  description: 甲子六月官军入金陵以己马乘幼主洪福瑱匿清凉山夜舍命冲营逃于民家为官军所擒戮之于金陵
