  - 裹胁从贼欲求自保与坐视生民涂炭之间两难
  - 回救金陵固守待懈与分兵经营江浙续命之间两难
  lesson: 出身田野而假手扰乱江浙成败系于天心厌乱与人事乖违徒以忠义之名难掩苍生涂炭之实
  summary_first_person: 吾本藤县长恭里佣耕小民少从舅氏读书长而窘乏二十六七岁为洪军裹胁而去隶春官胡以晃麾下由军帅监军指挥累至地官副丞相忠王转战皖浙苏杭克复杭嘉苏常百万之众终以金陵围急回天无术甲子六月以己马乘幼主匿清凉山夜冲营出逃民家被擒而死一生祸患相寻岂可测哉
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%BC%A2%E5%9B%AD%E7%AC%94%E4%B9%98.html
