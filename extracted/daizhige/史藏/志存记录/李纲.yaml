  description_zh: 初一日除右仆射兼中书侍郎，初二日立新班奏事，以十事论国是巡幸赦令僭逆伪命战守本政久任修德，上施行其五
- id: guji-李纲-event-zhengbangchang
  title_zh: 廷辩正张邦昌僭逆褒忠黜伪
  type: career
  date: 1127-06-04
  year_of: 1127
  place_zh: 南京行在内殿都堂
  description_zh: 与黄潜善吕好问廷辩，邦昌责授昭化军节度副使潭州安置，吴开莫俦徐秉哲王时雍等分谪，赠李若水刘韐霍安国
- id: guji-李纲-event-zhaofu
  title_zh: 请置河北招抚河东经制司
  type: career
