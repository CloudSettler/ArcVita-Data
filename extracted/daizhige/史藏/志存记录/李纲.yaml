  birth_date: 1083-07-27
  death_date: 1140-02-05
  era: 南宋
  reign_ref: 宋高宗建炎
  archetype: 孤忠中兴宰辅
  dilemmas:
  - 以战守和三论抉择国是坚持能守而后可战
  - 正张邦昌僭逆以立纲纪与调和执政异议之间抉择
  - 用孤忠峻法振作士气而触群怨谤之间抉择
  lesson: 正朝廷明纲纪修政振气而后可图恢复守信赏罚以固藩篱
  summary_first_person: 吾以孤忠受知高宗于南京，建炎元年六月拜尚书右仆射，七十余日上十事论国是巡幸战守，正邦昌僭逆之罪，黜受伪命之臣，置招抚经制以固河北河东，虽以鲠直罢而无悔，晚追录圣语政事为建炎时政记以付史馆，冀后世知中兴之本在修德行政也
  source_urls:
  - https://daizhige.org/建炎时政记.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/建炎时政记.md
endeavors:
- id: guji-李纲-endeavor-1
  title_zh: 建炎入相正朝纲
  goal_zh: 议国是正僭逆励士风以立中兴之基
  summary_zh: 建炎元年六月拜右仆射，上十事得施行战守巡幸赦令，廷辩诛张邦昌，安置吴开莫俦等，褒赠李若水霍安国
  phases:
  - key: brewing
    name: 南京受命力辞
    labels:
      zh: 拜相
    start_date: 1127-06-01
    highlight_event_id: guji-李纲-event-baixiang
  - key: breakthrough
    name: 上十事得施行
    labels:
      zh: 议国是
    start_date: 1127-06-02
    highlight_event_id: guji-李纲-event-baixiang
  - key: climax
    name: 廷辩正邦昌僭逆
    labels:
      zh: 正典刑
    start_date: 1127-06-03
    highlight_event_id: guji-李纲-event-zhengbangchang
  - key: closure
    name: 黜伪褒忠立纲纪
    labels:
      zh: 赏罚
    start_date: 1127-06-04
    highlight_event_id: guji-李纲-event-zhengbangchang
  decisions:
  - date: 1127-06-02
    title_zh: 以十事干天听论国是巡幸战守
    rationale: 中国御夷狄能守而后可战，先自治修政振气，车驾一到京师慰都人，沿河江淮控御扼冲
  - date: 1127-06-03
    title_zh: 力请正张邦昌僭逆之罪不与同列
    rationale: 春秋人臣无将之法已僭位号处宫禁月余，若尊崇为三公真王何以示四方，建中兴当自正朝廷始
  - date: 1127-06-04
    title_zh: 仿肃宗六等定受伪命之罪褒死节
    rationale: 崇观不敦名节致靖康鲜死义者，黜王时雍徐秉哲等以励士风，赠李若水刘韐霍安国以劝殉国
  outcome_zh: 朝纲粗立士气稍振，然执政异议群谤并起，为罢相之由
- id: guji-李纲-endeavor-2
  title_zh: 经略两河固藩篱
  goal_zh: 因两河人心置司措置封建守御以安中原
  summary_zh: 六月五日请于河北置招抚司河东置经制司，荐张所傅亮分任，推恩河北河东守御有功者，追录时政以存信史
  phases:
  - key: brewing
    name: 条陈两河利害
    labels:
      zh: 筹边
    start_date: 1127-06-05
    highlight_event_id: guji-李纲-event-zhaofu
  - key: breakthrough
    name: 置招抚经制司
    labels:
      zh: 建司
    start_date: 1127-06-05
    highlight_event_id: guji-李纲-event-zhaofu
  - key: climax
    name: 薦张所傅亮分任两路
    labels:
      zh: 举将
    start_date: 1127-06-07
    highlight_event_id: guji-李纲-event-zhaofu
  - key: closure
    name: 罢相后追记编录成书
    labels:
      zh: 存史
    start_date: 1127-08-01
    highlight_event_id: guji-李纲-event-bianzhi
  decisions:
  - date: 1127-06-05
    title_zh: 请以河外郡县封建使自为守
    rationale: 河北河东结集请援舍而不为则归怨朝廷且为贼用，因其人而用朝廷量助则藩篱固
  - date: 1127-06-07
    title_zh: 薦谪籍张所通判傅亮赴行在议事
    rationale: 谨择久任以责成功，所亮忠勇晓兵可任招抚经制副使以经营两路
  - date: 1132-01-01
    title_zh: 奉诏追记圣语政事编时政记上下册
    rationale: 文籍散亡后省记十之一二，然清光训敕铭镂心腑，当信传信疑传疑以备史馆采择
  outcome_zh: 两河措置初行旋以罢相中断，张所经营河北颇有功而终废，空存编录以见志
events:
