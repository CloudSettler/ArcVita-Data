  description_zh: 言两路为国家翰蔽乞置司因人而用封建守御，荐张所傅亮，推恩赵子松阎孝忠等守御功
- id: guji-李纲-event-bianzhi
  title_zh: 罢相后奉诏编建炎时政记
  type: career
  date: 1132-06-01
  year_of: 1132
  place_zh: 湖州秀州谪居地
  description_zh: 去魏阙七更岁华，追记任宰相日圣语政事赏罚黜陟，缮上下两册进御付史馆
- id: guji-李纲-event-death
  title_zh: 病卒于福州
  type: death
  date: 1140-02-05
  year_of: 1140
  place_zh: 福州
  description_zh: 绍兴十年正月十五卒，年五十八，谥忠定，著有建炎时政记梁溪集行世
