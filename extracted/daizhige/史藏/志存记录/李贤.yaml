person:
  id: guji-li-xian
  name_zh: 李贤
  names:
    zh: 李贤
    en: Li Xian
  lifespan:
    birth:
      date: '1408'
      precision: year
      is_circa: true
      raw: 永乐六年（1408年）
    death:
      date: '1466'
      precision: year
      is_circa: true
      raw: 成化二年（1466年）
  birth_date: '1408'
  death_date: '1466'
  era: 明代
  reign_ref: 正统、景泰、天顺
  archetype: 明臣·贤相型辅臣
  dilemmas:
  - 石亨、曹吉祥窃弄威权，贤欲行公道而屡遭谗构下狱
  - 石亨荐其代王翱为吏部尚书，贤以朝廷不可无老成而恳辞
  - 徐有贞怫然反对增银赈济，贤于公道与同僚情面之间抉择
  lesson: 持公道、行直道，虽暂遭谗陷，久之必见信于君而正士风
  summary_first_person: 我李贤在天顺初被众论推入阁辅政，虽因石亨、吉祥辈谗构两度下狱，然英宗察我无私，终留任腹心；我荐贤黜佞、谏止殉葬、请释建庶人，惟以公道处国家之事。
  source_urls:
  - https://zh.wikisource.org/wiki/天順日錄
endeavors:
- id: guji-li-xian-endeavor-1
  name_zh: 入阁辅政
  phases:
  - key: brewing
    name_zh: 众论推贤入阁
    labels:
      zh: 天顺改元之际
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-entry-cabinet
  - key: breakthrough
    name_zh: 入阁与议国事
    labels:
      zh: 得英宗锐意委任
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-entry-cabinet
  - key: climax
    name_zh: 下狱获释后再入阁
    labels:
      zh: 退避立身，渐得圣眷
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-reentry-cabinet
  - key: closure
    name_zh: 独承顾问至终
    labels:
      zh: 上事无大小必咨之
    start_date: '1458'
  decisions:
  - date: '1457'
    title_zh: 固辞石亨请其入阁之议
    rationale: 知石亨笼络非善意，恐入其彀中
  - date: '1457'
    title_zh: 恳辞代王翱为吏部尚书
    rationale: 朝廷不可无老成人，且避夺位之嫌
- id: guji-li-xian-endeavor-2
  name_zh: 荐贤黜佞、澄清吏治
  phases:
  - key: brewing
    name_zh: 持公道沮狥私之荐
    labels:
      zh: 与徐有贞同事内阁
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-nianfu-case
  - key: breakthrough
    name_zh: 力保年富、辨其冤诬
    labels:
      zh: 明察石彪构陷
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-nianfu-case
  - key: climax
    name_zh: 定拟廷臣与边方巡抚
    labels:
      zh: 荐耿九畴、姚夔、马昂等得人
    start_date: '1458'
  - key: closure
    name_zh: 请复文臣巡抚
    labels:
      zh: 议推六边重臣
    start_date: '1458'
  decisions:
  - date: '1458'
    title_zh: 奏请辽东、宣府、大同、延绥、宁夏、甘肃六处急选能臣
    rationale: 各边革去文臣巡抚后军官纵肆，士卒疲惫
  - date: '1457'
    title_zh: 力主增银赈济山东饥民
    rationale: 虽有里老书手之弊，犹胜于无银，恐民迫而为盗
- id: guji-li-xian-endeavor-3
  name_zh: 谏诤仁政
  phases:
  - key: brewing
    name_zh: 谏止汪妃殉葬
    labels:
      zh: 全其母子性命
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-wangfei
  - key: breakthrough
    name_zh: 请释建庶人
    labels:
      zh: 全亲亲之意
    start_date: '1457'
    highlight_event_id: guji-li-xian-event-jianshuren
  - key: climax
    name_zh: 定拟太后徽号、安排太子出阁读书
    labels:
      zh: 先大学、尚书，讲读有序
    start_date: '1458'
  - key: closure
    name_zh: 谏止无故举兵伐孛来
    labels:
      zh: 主张遣使厚赐休息军民
    start_date: '1457'
  decisions:
  - date: '1457'
    title_zh: 谏汪妃不宜殉葬
    rationale: 妃已废弃幽闭，幼女无依，情所不堪
  - date: '1457'
    title_zh: 谏止石亨领兵巡边取宝玺
    rationale: 连年灾伤府库空虚，军民疲困，亡国之物不足为贵
