    start_date: 0714-01-01
    highlight_event_id: guji-李隆基-event-kaiyuan-713
  - key: climax
    name: 登封泰山告成礼毕
    labels:
      zh: 封岱告成
    start_date: 0725-12-11
    highlight_event_id: guji-李隆基-event-fengshan-725
  - key: closure
    name: 尊岳神书碑宠异
    labels:
      zh: 礼神刻石
    start_date: 0726-01-01
    highlight_event_id: guji-李隆基-event-fengshan-725
  decisions:
  - date: 0714-05-01
    title_zh: 用姚元崇捕蝗埋之之法
    rationale: 古人秉异炎火所以安农，除害即兴农，敢议者死以定行
  - date: 0725-10-01
    title_zh: 亲乘白骡登封泰山
    rationale: 白骡洁朗权奇柔习安便，可昭告成之盛，故亲乘上下
