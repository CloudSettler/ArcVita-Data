endeavors:
- id: guji-李隆基-endeavor-1
  title_zh: 藩邸结琚勘定韦氏内难
  summary_zh: 城南游猎遇书生王琚，杀驴拔蒜相待，语合意亲善，韦氏专制独密谋于琚，纳乱则杀之之谋发动诛除，累拜琚中书侍郎配享
  phases:
  - key: brewing
    name: 城南遇琚相善
    labels:
      zh: 微时结交
    start_date: 0709-01-01
    highlight_event_id: guji-李隆基-event-coup-710
  - key: breakthrough
    name: 独密谋议决心除乱
    labels:
      zh: 纳谏决断
    start_date: 0710-06-01
    highlight_event_id: guji-李隆基-event-coup-710
  - key: climax
    name: 勘定祸难诛韦氏
    labels:
      zh: 平定内难
    start_date: 0710-07-21
    highlight_event_id: guji-李隆基-event-coup-710
  - key: closure
    name: 论功拜琚配享
    labels:
      zh: 论功酬勋
    start_date: 0710-08-01
    highlight_event_id: guji-李隆基-event-kaiyuan-713
  decisions:
  - date: 0710-07-01
    title_zh: 独密言于王琚问计
    rationale: 韦氏专制忧甚，非心腹不敢言，故就契合者托谋
  - date: 0710-07-20
    title_zh: 纳乱则杀之果断发动
    rationale: 乱形已成疑则受制，不如先发勘定以安社稷
- id: guji-李隆基-endeavor-2
  title_zh: 开元励精致太平告成
  summary_zh: 开元初铲革讹弊纳姚元崇捕蝗之议除害安农，府库山积米贱路不拾遗，封泰山乘益州白骡告成，谥骡为将军，华阴见岳神封金天王自书碑文
  phases:
  - key: brewing
    name: 励精理道铲革讹弊
