    rationale: 晚为制诰当避御名，以全朝廷之礼而安词命之体
  - date: '1000'
    title_zh: 以宏雅自守不徇流俗
    rationale: 秦火之后文渐向盛，讲诵当模诸古出诸心，不为不根陋语所移
