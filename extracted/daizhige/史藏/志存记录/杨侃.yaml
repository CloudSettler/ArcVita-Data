  reign_ref: 宋太宗端拱至宋真宗
  archetype: 类书编纂者
  dilemmas:
  - 两汉书卷帙浩繁而注释歧出，是尽收杂说还是独存雅驯
  - 为制诰词臣当避君讳，是守旧名以存本还是更名大雅以全礼
  lesson: 记事必提其要，纂言必钩其玄，读书读实，浮泛之辞不足尚，雅驯之钞可为启钥
  summary_first_person: 我是钱塘杨侃，端拱进士，官至集贤院学士，晚为制诰，因避真宗旧讳更名大雅，我摘录前后汉书隽语故事列为标目，节取颜师古及章怀太子注成两汉博闻十二卷，前七卷后五卷，不加议论，欲为读汉书者决疑贰开宏儒之学
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E4%B8%A4%E6%B1%89%E5%8D%9A%E9%97%BB.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E4%B8%A4%E6%B1%89%E5%8D%9A%E9%97%BB.html
