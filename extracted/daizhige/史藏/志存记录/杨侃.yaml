  - date: 0990
    title_zh: 不依篇第不分门类列标目
    rationale: 为提其要钩其玄，使学者直得事实，不为篇第所限
  - date: 0995
    title_zh: 节取颜师古章怀注不加议论
    rationale: 近古载籍莫过两汉书，取正注则雅驯，舍杂说则不惑，存四皓等条以资考证
