    title_zh: 命越王侑留守东都而自幸江都
    rationale: 不听宫女征辽择将之谏，欲纵意东南，故以百万师徒前驱
  - date: '0616-07-01'
    title_zh: 御龙舟选殿脚女擢绛仙为首楫
    rationale: 喜吴绛仙柔丽长蛾，欲以秀色佐游，故号崆峒夫人赐螺黛
- id: guji-杨广-endeavor-2
  title_zh: 营建迷楼荒政致乱
  summary_zh: 幸昭明文选楼见宫娥衣飞，遂建迷楼置四宝帐，宠来梦儿韩俊娥，不恤盗贼，终致禁卫作乱
