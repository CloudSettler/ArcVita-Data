  dilemmas:
  - 辽东小国远征与留守安内之两难，宫女攀车泣留而意不回
  - 江都逸乐长久与盗贼四起图治之两难，委事杨素自比长城公
  - 萧妃妒忌与众姬争宠之两难，司花女绛仙稍不得亲幸
  lesson: 沈湎逸游忘却政事，虽有文才宠姬，终致内外离叛而身亡国灭
  summary_first_person: 朕即杨广，年十五得宝儿为司花女，龙舟幸江都，建迷楼置四宝帐，夜召来梦儿安寝，终因逸游不返，委政于人，致宇文化及作乱而殒于江都
