  - 览广陵图思旧游欲泛舟东南与万里涉险劳民之谏相权
  - 欲凿穿睢阳王气与回护城邑宅墓民心之请相持
  lesson: 以一己游幸之欲兴千里大役虽成运河之利终以虐民峻刑失天下
  summary_first_person: 吾昔镇广陵恋其烟水，览图兴怀，遂决意自洛入河达淮幸广陵，纳萧怀静之策开卞渠穿王气，以麻叔谋督三百六十万丁夫，决汴乘龙舟南下，植柳护堤，然督功严酷，丁夫折耗二百五十万，终以奢虐致乱
