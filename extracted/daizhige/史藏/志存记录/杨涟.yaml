    title_zh: 光宗宾天后上疏争急移宫
    rationale: 先帝宾天出之仓卒，选侍尚居干清，当危疑之际奋不顾身，止知皇上为重，急移宫以待皇上登极。
  - date: 1621-01
    title_zh: 一再上疏自陈移宫本末与三不安之故，决意引退
    rationale: 移宫无罪亦无功可居，居功之谤与交通之疑既起，当此日惟有决去一着以明臣节，不使忠者去而邪者进、直者去而佞者进。
