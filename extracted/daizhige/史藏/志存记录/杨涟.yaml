  birth_date: '1572'
  death_date: '1625'
  era: 明·晚明
  reign_ref: 万历、泰昌、天启
  archetype: 谏臣·东林直臣
  dilemmas:
  - 移宫有功反遭居功交通之谤，去留之间如何明臣节而不负先帝特达之知
  - 奋不顾身报主则招阉宦之忌，缄默苟全则社稷圣躬之危无所补救
  lesson: 大节之际当奋不顾身，止知君国为重，不计一身是非毁誉；功罪可付公论，节概不可自污。
  summary_first_person: 我杨涟以科臣之微，受先帝特达之知。先帝宾天仓卒之际，我于九月初五上疏争急移宫，以待皇上登极，躬安圣躬于危疑之间。事后居功之谤、交通之疑纷起，同官马逄皋、方震孺为我辩白功罪，皇上亲谕我忠直素鉴，准我病告退以明心迹。我宁决然而去，不肯以一身之去就乱千载之是非。
  source_urls:
  - 明熹宗七年都察院实录·卷一
