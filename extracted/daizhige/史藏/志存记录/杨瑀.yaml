endeavors:
- id: guji-杨瑀-endeavor-1
  title_zh: 奎章入直与佐黜伯颜
  summary: 元统至元间入奎章阁为属官，至元六年御前草诏黜伯颜，先请增粜官米以安民心
  phases:
  - key: brewing
    name: 奎章积学待用
    labels:
      zh: 孕育
    start_date: '1333'
    highlight_event_id: guji-杨瑀-event-kuizhang
  - key: breakthrough
    name: 御榻草诏得信
    labels:
      zh: 突破
    start_date: '1340-02-15'
    highlight_event_id: guji-杨瑀-event-chibayan
  - key: climax
    name: 增粜安民判恩怨
    labels:
      zh: 高潮
    start_date: '1340-02-16'
    highlight_event_id: guji-杨瑀-event-chibayan
  - key: closure
    name: 黜奸事定退思
    labels:
      zh: 收束
    start_date: '1340-03-01'
    highlight_event_id: guji-杨瑀-event-chibayan
  decisions:
  - date: '1340-02-15'
    title_zh: 先粜官米安民再黜伯颜
    rationale: 城门上钥米价必涌，先增米铺二十以及时粜米，使百姓知圣主恤民，伯颜虐民之迹恩怨判然
  - date: '1340-02-15'
    title_zh: 改诏以时易日示切至
    rationale: 自早至暮皆一日，改作时字更合机宜，可见圣明切至之意
- id: guji-杨瑀-endeavor-2
  title_zh: 太史知天象与山居著书
  summary: 任太史同佥奉旨知天象事，拒景星座祥之请，后退居西湖著山居新话以录异闻
  phases:
  - key: brewing
    name: 太史掌历观象
    labels:
      zh: 孕育
    start_date: '1340-07-01'
    highlight_event_id: guji-杨瑀-event-jingxing
  - key: breakthrough
    name: 拒奏景星守正
    labels:
      zh: 突破
    start_date: '1340-07-01'
    highlight_event_id: guji-杨瑀-event-jingxing
  - key: climax
    name: 太白经天证言
    labels:
      zh: 高潮
    start_date: '1340-07-10'
    highlight_event_id: guji-杨瑀-event-jingxing
  - key: closure
    name: 山居笔录成书
    labels:
      zh: 收束
    start_date: '1347'
    highlight_event_id: guji-杨瑀-event-shanju
  decisions:
  - date: '1340-07-01'
    title_zh: 景星不具四瑞不奏
    rationale: 景星现当有醴泉凤凰朱草庆云相副，今陕西灾疫腹里盗贼福建反叛，天道相反不可造次献祥
  - date: '1347'
    title_zh: 退居西湖录新话存史
    rationale: 朝野旧闻易散，亲见亲闻者当据实笔录，使后人考制度风俗得失，不没善恶之真
events:
- id: guji-杨瑀-event-birth
  title_zh: 降生江南
  date: '1285'
  year_of: 1285
  description: 杨瑀生于江南，幼年侍坐赵孟頫席间，闻论人中取象泰卦之说，深受启迪
- id: guji-杨瑀-event-kuizhang
  title_zh: 元统间为奎章阁属官
  date: '1334'
  year_of: 1334
  description: 元统间为奎章阁属官，寓居题春帖光依东壁图书府，心在西湖山水间，预闻文宗朝旧事
- id: guji-杨瑀-event-chibayan
  title_zh: 御前草诏黜伯颜并请增粜
  date: '1340-02-15'
  year_of: 1340
  description: 至元六年二月十五日夜御前以牙牌宣入玉德殿，首以增粜官米为言，命增米铺二十钞到即粜，都民举手加额
- id: guji-杨瑀-event-jingxing
  title_zh: 太史拒奏景星祥兆
  date: '1340-07-01'
  year_of: 1340
  description: 任太史同佥知天象事，灵台报景星见请即奏闻以邀厚赐，以无四瑞相副且天下多灾不许，越九日太白经天遂证其慎
- id: guji-杨瑀-event-shanju
  title_zh: 山居著新话录朝野闻
  date: '1347'
  year_of: 1347
  description: 退居西湖山间，追记御前问羊心供，受佛戒故事，伯颜称寿服妖，金玉局现钱文诸事，成山居新话一卷
- id: guji-杨瑀-event-death
  title_zh: 逝世
  date: '1361'
  year_of: 1361
  description: 晚年家居山间，以著述终，遗书山居新话流传于世
