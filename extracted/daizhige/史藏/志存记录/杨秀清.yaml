  decisions:
  - date: 1853-02
    title_zh: 采纳老水手之谏，舍河南而定都金陵
    rationale: 河南河水小而无粮，敌困不能救解；南京乃帝王之家，城高池深，民富食足，有长江之险、舟只万千，遂移天王驾入南京，改为天京
  - date: 1850-07
    title_zh: 受天王信用，总揽一国军政
    rationale: 自拜上帝之后件件可悉，天王信用，一国之事概交与他，军令严整，赏罚分明
  - date: 1851-04
    title_zh: 传令由牛角瑶山小路出马岭，围攻桂林
    rationale: 自杀胜乌帅之后，避清军招平、平乐大路，出奇制胜，虽围桂林月余未下，仍得以转攻全州、道州，招众扩军
