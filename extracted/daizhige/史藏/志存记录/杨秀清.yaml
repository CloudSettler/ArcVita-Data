      raw: 约道光初年（生于桂平县平隘山）
    death:
      date: '1856'
      precision: year
      is_circa: true
      raw: 丙辰六年天京事变中为北王韦昌辉所杀
  birth_date: '1823'
  death_date: '1856'
  era: 清末·太平天国
  reign_ref: 太平天国东王
  archetype: 布衣将相之权臣——起于烧炭，总揽军政，威权震主而身死内讧
  dilemmas:
  - 才干过人而出身微贱，权柄尽握而功高震主
  - 军令严整带来胜利，威逼太过招致北翼积怨
  - 欲逼天王封万岁以固权，反促杀身之祸
  lesson: 才能可使人自烧炭夫跃居一国之枢，然威权无度、不知所忌，终致同室操戈、身败族灭
  summary_first_person: 我杨秀清本是桂平平隘山种山烧炭之人，自拜上帝之后，天意化作此身，件件可悉。天王信用，一国之事概交与我，我军令严整、赏罚分明。自金田起义，移营永安，破武昌，下江南，七日破南京凤仪门，遂定都天京，东王佐政，立法安民，事事严整。然我威风张扬，不知所忌，一朝之大，是首一人，权太重，竟逼天王封我万岁。北王韦昌辉与翼王石达开积怨于心，密议杀我，一朝身死，亲属属员尽被诛戮。悔哉，威逼大过，祸自内生。
