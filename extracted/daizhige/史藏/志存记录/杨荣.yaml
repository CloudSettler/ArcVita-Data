  dilemmas:
  - 先帝病逝于军中，秘不发丧以稳军心与遵礼发丧之间的两难
  lesson: 危局之中谨而多变，变而不失其忠
  summary_first_person: '我是杨荣，谥文敏。文皇驾崩于榆木川时，我与金幼孜恐讣音外泄动摇军心，

    尽取军中锡器熔为殓具，覆以龙衣，每日进膳如故，并将锡工尽除以灭其迹，

    直到回至京师，外间竟无人知晓。

    '
  source_urls:
