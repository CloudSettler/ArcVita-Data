- id: guji-yangming-event-4
  date: 1450-10
  year_of: '1450'
  title_zh: 随驾南下苦侍左右
  kind: endeavor
  detail: 也先送英宗还京途中，铭笼马并行、扶持过沟涧，代传敕命奔走诸营。
