person:
  qid: guji-yangming
  name_zh: 杨铭（哈铭）
  names:
    zh: 杨铭（初名哈铭）
    en: Yang Ming (originally Ha Ming)
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
  birth_date: ''
  death_date: ''
  era: 明代正统至天顺年间
  reign_ref: 正统、景泰、天顺
  archetype: 忠诚通事与喉舌之臣
  dilemmas:
  - 身陷瓦剌为质，随侍英宗于敌营，如何在虎狼之间保全天子并保全自身
  - 荣升之际以子陵共卧之喻受宠，如何在君恩与分寸之间自处
  lesson: 在绝境中以忠谨与应变之力，可以为君主架起生还之桥
  summary_first_person: 我本名哈铭，与其父出使瓦剌，值土木之变被羁留。此后我随侍英宗于虏营几乎一年，传语通译、奔走斡旋，屡次化险为夷。英宗还朝后我授镇抚，天顺复辟后累升至锦衣卫指挥使。
  source_urls:
  - https://zh.wikisource.org/wiki/正统北狩事迹
endeavors:
- id: guji-yangming-endeavor-1
  name_zh: 出使瓦剌与随侍英宗北狩
  phases:
  - key: brewing
    name_zh: 出使被羁
    labels:
      zh:
      - 通使瓦剌
      - 土木之变
    start_date: '1449'
    highlight_event_id: guji-yangming-event-capture
  - key: breakthrough
    name_zh: 随侍虏帐
    labels:
      zh:
      - 朝夕侍驾
      - 传语斡旋
    start_date: 1449-09
    highlight_event_id: guji-yangming-event-serve
  - key: climax
    name_zh: 奉驾南还
    labels:
      zh:
      - 自请使京
      - 迎驾议和
    start_date: 1450-07
    highlight_event_id: guji-yangming-event-return
  - key: closure
    name_zh: 还朝受赏
    labels:
      zh:
      - 授镇抚
      - 赐寝褥靴
    start_date: '1450-08-15'
    highlight_event_id: guji-yangming-event-reward
  decisions:
  - date: 1449-09
    title_zh: 奉旨随侍英宗左右
    rationale: 英宗言"老哈回矣，铭可随侍我"，遂日夜不离，为帝虏间唯一喉舌
  - date: 1450-05
    title_zh: 自请出使京师求迎驾使臣
    rationale: 铭自请行，说阿剌知院与也先遣使同赴京，促成杨善、赵荣来迎
  - date: 1450-02
    title_zh: 劝喜宁边关好为之计并预言其败
    rationale: 铭言高旺"此事多出喜宁，至边好为之计"，其后喜宁果被边人执杀
events:
- id: guji-yangming-event-birth
  event_type: birth
  date: ''
  title_zh: 杨铭（哈铭）出生
  description: 生卒年不见于记载，正統中已与其父同使瓦剌。
- id: guji-yangming-event-capture
  event_type: endeavor
  date: '1449'
  year_of: 1449
  title_zh: 出使瓦剌遭羁留
  description: 正统中与其父随指挥吴良出使瓦剌，也先以"中国留我使臣减我赏赐"为由羁留诸使，械其足，土木之变后始得见驾。
- id: guji-yangming-event-serve
  event_type: endeavor
  date: 1449-09
  year_of: 1449
  title_zh: 随侍英宗于虏营
  description: 英宗命"老哈回矣，铭可随侍我"，自此铭侍左右，屡次进言救袁彬、谏虎口夺食、致意伯颜帖木儿护送还朝。
- id: guji-yangming-event-xining
  event_type: endeavor
  date: 1450-02
  year_of: 1450
  title_zh: 密嘱高旺除喜宁之机
  description: 正月英宗遣喜宁入京，铭言于高旺"此事多出喜宁，至边好为之计"，喜宁至边果被执杀，铭言始得用。
- id: guji-yangming-event-return
  event_type: endeavor
  date: 1450-07
  year_of: 1450
  title_zh: 斡旋和议促成奉驾还朝
  description: 铭屡至大同往复，自请使京，告也先"中国万万，遣得人成那颜万世之名"，杨善、赵荣来迎，八月八日也先送驾。
- id: guji-yangming-event-reward
  event_type: endeavor
  date: '1450-08-15'
  year_of: 1450
  title_zh: 护驾还京授镇抚
  description: 銘随驾至唐家岭、德胜门土城，英宗赐寝褥靴命传子孙作古记；后有旨哈铭升一级授镇抚。
- id: guji-yangming-event-jinyiwei
  event_type: endeavor
  date: '1457'
  year_of: 1457
  title_zh: 天顺复辟累迁锦衣卫指挥使
  description: 天顺元年英宗复辟，进锦衣卫指挥佥事；后以杀曹钦有功进指挥同知，讨刘千斤当先，进指挥使。
- id: guji-yangming-event-death
  event_type: death
  date: ''
  title_zh: 杨铭（哈铭）去世
  description: 卒年不详。
