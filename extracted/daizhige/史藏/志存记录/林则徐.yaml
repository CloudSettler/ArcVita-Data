  dilemmas:
  - 严法除毒与不教而诛之仁义两难
  - 整顿营伍差役与防回护徇庇之难
  - 驱除外夷与保全通商之权衡
  lesson: 以身作则严关防，以保甲断瘾除根，以先教后诛全民命，以破汉奸内外勾结而靖海口
  summary_first_person: 吾奉旨驰驿赴粤查办海口，首在严拿汉奸，断绝鸦片，先传牌自律以恤驿站，继密札搜拿窑口兴贩，立关防以肃行辕，晓谕士商军民限期缴具断瘾，编查保甲以清源，谕责洋商夷人尽缴趸船烟土，誓必扫除净尽而后已
