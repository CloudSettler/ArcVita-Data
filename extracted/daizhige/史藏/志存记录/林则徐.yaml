endeavors:
- id: guji-林则徐-endeavor-1
  title_zh: 奉旨赴粤严拿汉奸整肃关防
  summary_zh: 传牌自律轻装赴粤，密饬布按改装拘拿包买窑口兴贩及营差武弁，悬示关防收呈以肃行辕
  phases:
  - key: brewing
    name: 传牌赴粤自律恤站
    labels:
      zh: 轻装简从
    start_date: 1839-01-08
    highlight_event_id: guji-林则徐-event-chuanpai
  - key: breakthrough
    name: 密札布按严拿汉奸
    labels:
      zh: 密拿首恶
    start_date: 1839-02-24
    highlight_event_id: guji-林则徐-event-minahanjian
  - key: closure
    name: 悬示关防收呈立规
    labels:
      zh: 肃整行辕
    start_date: 1839-03-11
    highlight_event_id: guji-林则徐-event-guanfang
  decisions:
  - date: 1839-01-08
    title_zh: 传牌沿途不扰驿站
    rationale: 以外任出差自雇夫轿船食，不用整桌燕窝烧烤，不收站规门包，以体恤州县免借名影射
  - date: 1839-02-24
    title_zh: 密札布按分投拘拿汉奸
    rationale: 鸦片私售皆由奸民勾串，先拿最要窑口贩商快艇头目及包庇兵差，不容窜匿回护，既往不咎后犯从重
- id: guji-林则徐-endeavor-2
  title_zh: 严禁断瘾谕缴烟土塞源截流
  summary_zh: 晓谕士商军民限期缴具断瘾，札学互保编查保甲，严饬营兵互保，谕责洋商勒令夷人尽缴烟土具结永不夹带
  phases:
  - key: brewing
    name: 晓谕勒限缴具断瘾
    labels:
      zh: 先教后诛
    start_date: 1839-03-18
    highlight_event_id: guji-林则徐-event-duanyin
  - key: climax
    name: 谕洋商夷人尽缴烟土
    labels:
      zh: 缴土具结
    start_date: 1839-03-18
    highlight_event_id: guji-林则徐-event-jiaotu
  - key: closure
    name: 保甲营伍互保长久奉行
    labels:
      zh: 保甲营规
    start_date: 1839-03-18
    highlight_event_id: guji-林则徐-event-jiaotu
  decisions:
  - date: 1839-03-18
    title_zh: 限期首缴烟具免究来历
    rationale: 念吸食陷溺已深不忍不教而诛，省城及各属限两月缴枪土，过期挨查牌甲搜拿，藏匿房屋入官，举报优奖
  - date: 1839-03-18
    title_zh: 谕洋商传谕夷人三日具结缴土
    rationale: 洋商设以防私通禁物却通夷分肥，必须严气正性传谕，令夷人悉数缴趸船数万箱，立汉字夷字合同永不夹带违者人正法货入官，否则择尤正法抄产
events:
- id: guji-林则徐-event-birth
  title_zh: 诞生于福建侯官
  date: 1785-08-30
  year_of: 1785
  description: 乾隆五十年七月二十六日生于福建侯官，后登嘉庆进士历任封疆
- id: guji-林则徐-event-chuanpai
  title_zh: 传牌赴广东查办海口
  date: 1839-01-08
  year_of: 1839
  description: 戊戌十一月廿三日传牌，自良乡至广东，声明不带随员书吏，自雇轿车夫船，家常饭菜不扰驿站
- id: guji-林则徐-event-minahanjian
  title_zh: 密札布按严拿汉奸
  date: 1839-02-24
  year_of: 1839
  description: 己亥正月十一日密札布按两司，开单密拿王振高等最要人犯及各衙门营兵次要人犯，先查武弁包揽蒋大彪等
- id: guji-林则徐-event-guanfang
  title_zh: 悬示关防收呈
  date: 1839-03-11
  year_of: 1839
  description: 己亥正月廿六日悬示辕门，随从不许擅离，书吏馆内给食，公馆自买时价现钱，不设差房，不收与海口无干词讼
- id: guji-林则徐-event-duanyin
  title_zh: 晓谕速戒鸦片颁保甲营规
  date: 1839-03-18
  year_of: 1839
  description: 己亥二月晓谕士商军民限期缴具断瘾，札学教官造册互保，颁查禁营兵五人互保规条，编查保甲请绅耆分理
- id: guji-林则徐-event-jiaotu
  title_zh: 谕洋商夷人呈缴烟土
  date: 1839-03-18
  year_of: 1839
  description: 己亥二月初四谕洋商据实供明串通情弊，限三日传谕各国夷人将趸船数万箱尽数缴官，具结永不夹带
- id: guji-林则徐-event-death
  title_zh: 病逝于广东潮州普宁
  date: 1850-11-22
  year_of: 1850
  description: 道光三十年十月十九日奉旨再赴广西剿匪途中病逝普宁，谥文忠
