  - 佣工谋生与结纳亡命求变之抉择
  - 据大里杙自保与竖旗攻城之进退
  lesson: 挟私聚众煽乱终至覆灭害众
  summary_first_person: 我本漳州平和贫家子，随父渡台佣工彰化大里杙，结纳少年以天地会煽众，插剑为盟举事，陷彰化据诸罗围攻府城，南北呼应一时势张，终因官军进剿义民坚壁而败亡，深悔轻生好斗贻祸生灵
  source_urls:
  - https://daizhige.org/history/record/pingtai-jishi-benmo.html
