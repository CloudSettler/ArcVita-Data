    rationale: 乘官军懈怠无备，以奇袭全歼进剿官军夺取先机
  - date: '1786-12-30'
    title_zh: 岁除分路全力攻府城东门
    rationale: 趁岁除城中无备集中大众攻其虚处，冀一举破府奠定全局
