  birth_date: 1881-10-13
  death_date: 1956-09-08
  era: 清末至日据台湾时期
  reign_ref: 光绪、宣统、明治、大正、昭和
  archetype: 雾峰望族·诗社赞助人·民族运动领袖
  dilemmas:
  - 身为日据下的殖民属地绅士，须在体制合作与汉文化存续之间权衡
  - 雅集吟咏之风雅趣味与实用有益之学、社会改良之实志难以兼全
  - 面对汉文将绝于本岛之危局，须抉择以文社结社方式延续斯文
  lesson: 以家族财力与声望庇护诗社文运，风雅道义与保存汉学可以互为表里
  summary_first_person: 我林献堂，号灌园，世居台中雾峰。栎社结社之初，我以莱园主人之身与诸君交游；宣统二年正式加盟为社友。此后瑞轩雅集、瑾园总会、观梅之会，我屡与其事；民国二年偕旭东将游大陆，同人饯于无闷草堂。台湾文社创立，我与诸友同为理事；栎社二十周年纪念，我承办纪念碑事宜，冀以片石存一代斯文于不坠。
  source_urls:
  - https://guji.example/lishe-yangezhilue
