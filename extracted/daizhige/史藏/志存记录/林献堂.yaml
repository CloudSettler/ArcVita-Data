  labels:
    zh:
    - 祖饯
    - 游历
  description: 民国二年三月十九日（古历二月二十二日），灌园、旭东将游大陆，同人集于詹厝园林痴仙之无闷草堂为祖饯雅集，作眼镜、尘、移树发等诗并撮影纪念。
- id: guji-林献堂-event-wenxueshe
  date: 1919-06-14
  precision: day
  year_of: 1919
  endeavor_id: guji-林献堂-endeavor-1
  title_zh: 台湾文社理事会兼栎社总会于瑾园举行
  labels:
    zh:
    - 文社
    - 理事
  description: 民国八年六月十四日，会于台中大智之瑾园。献堂与基六、沧玉、南强、惠如等十二人以台湾文社创立者而为理事；是日即栎社总会兼文社理事会，并改社则十八条为二十六条。
- id: guji-林献堂-event-guanmei
  date: 1920-01-31
  precision: day
  year_of: 1920
  endeavor_id: guji-林献堂-endeavor-1
  title_zh: 主办莱园观梅会并荐林作敬入社
  labels:
    zh:
    - 观梅会
    - 莱园
  description: 民国九年一月三十一日，先立春七日，莱园红梅正开，同人倡开观梅会，来会十有六人；园主人灌园推荐雾峰林作敬入社，同人赞成，击钵分咏并撮影纪念。
- id: guji-林献堂-event-death
