  description: 清宣统二年，雾峰林灌园（献堂）加盟栎社为社友，与吕蕴白同时入社。
- id: guji-林献堂-event-farewell-1913
  date: 1913-03-19
  precision: day
  year_of: 1913
  endeavor_id: guji-林献堂-endeavor-2
