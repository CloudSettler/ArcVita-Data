  decisions:
  - date: 1853-05-14
    title_zh: 百花洲坚持死守请斩异议者
    rationale: 鉴于金陵失守人无固志非严法明死守之义则城不战自溃
  - date: 1853-05-16
    title_zh: 请以兵事委江忠源立军法
    rationale: 事权不一调度不行必归一人文武违令按军法方能昼夜巡守
  - date: 1853-06-04
    title_zh: 德胜门内筑月城备沙包石块
    rationale: 贼素恃地雷攻城随塌随筑多备布袋囊沙方能化险为平
- id: guji-林福祥-endeavor-2
  title_zh: 援剿广饶克复弋阳兴安上饶
  goal_zh: 由抚州带勇援饶整顿溃军收复弋阳广信饶州
  start_date: 1855-02-08
  end_date: 1855-04-30
  phases:
  - key: brewing
    name: 祭旗出师斩亲兵立威
