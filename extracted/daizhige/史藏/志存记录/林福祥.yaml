person:
  qid: guji-林福祥
  name_zh: 林福祥
  names:
    zh: 林福祥
    en: Lin Fuxiang
  era: 清
  reign_ref: 咸丰
  archetype: 临危死守整军之干吏
  dilemmas:
  - 金陵已失人心动摇之时守城还是出走避祸
  - 石镇街腹背受敌累败之余进战还是巧退保全
  lesson: 守城贵在一定字诀站立得住见贼不动赏罚自近而始火器沙袋随塌随筑皆可转危为安
  summary_first_person: 予林福祥咸丰三年署南昌府事会江忠源死守孤城九十五日昼夜巡城两伤足继以痢疟又援剿广饶抚州出师整顿溃军石镇街巧退弋阳大捷肃清广饶二郡唯知罚自近始令行乃能战守
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/志存记录/守南昌广饶记.md
  - https://daizhige.org/史藏/志存记录/守南昌广饶记.html
