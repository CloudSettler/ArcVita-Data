    start_date: 1855-02-15
    highlight_event_id: guji-林福祥-event-shizhen-tuijun
  - key: climax
    name: 弋阳城下南北夹击大捷
    labels:
      zh:
      - 会剿
      - 大捷
    start_date: 1855-03-20
    highlight_event_id: guji-林福祥-event-yiyang-dajie
  - key: closure
    name: 分兵收兴安广饶肃清回抚州
    labels:
      zh:
      - 追剿
      - 善后
    start_date: 1855-03-21
    highlight_event_id: guji-林福祥-event-yiyang-dajie
  decisions:
  - date: 1855-02-08
    title_zh: 斩攫烟土亲兵周锦荣
    rationale: 亲兵不罚则七军不肃取烟土不罚则取财物不止必罚自近始
  - date: 1855-02-15
    title_zh: 寡妇桥荷包阵分队退万年设伏
    rationale: 溃军不可浪战大敌在前一动即溃唯河沿佯攻林中设伏步步为营方能全身
  - date: 1855-03-20
    title_zh: 与湘勇分攻弋阳西北两门
    rationale: 贼众黄旗蔽野非分头迎击断后合击不可破高桥溺贼之势
events:
- id: guji-林福祥-event-birth
  type: birth
  title_zh: 出生
  description_zh: 生年不详清代官员咸丰间任抚州知府署南昌府事
- id: guji-林福祥-event-death
  type: death
  title_zh: 逝世
  description_zh: 卒年不详咸丰五年后回抚州任善后事迹见守南昌广饶记
- id: guji-林福祥-event-nanchang-dingyi
  type: council
  title_zh: 百花洲定死守之议
  date: 1853-05-14
  year_of: 1853
  raw: 咸丰三年五月十四夜
  description_zh: 与邓仁堃坚持死守漏四下守计遂定次日迎江忠源入城统一事权
  location_zh: 南昌百花洲
- id: guji-林福祥-event-desheng-dilei
  type: battle
  title_zh: 德胜门御地雷抢筑血战
  date: 1853-06-04
  year_of: 1853
  raw: 咸丰三年六月初四辰刻
  description_zh: 贼用地雷轰城陷十余丈与江忠源邓仁堃随战随堵楚勇力战贼败逸后挖地道作明濠御地雷
  location_zh: 南昌德胜门
- id: guji-林福祥-event-nanchang-jieyan
  type: battle
  title_zh: 炮局得炮轰贼南昌解严
  date: 1853-08-22
  year_of: 1853
  raw: 咸丰三年八月二十二夜
  description_zh: 于炮局地下掘得大炮分运城上下连日轰击沉贼船无数贼败窜江西解严凡被围九十五日
  location_zh: 南昌
- id: guji-林福祥-event-shizhen-tuijun
  type: battle
  title_zh: 石镇街退军破荷包阵
  date: 1855-02-15
  year_of: 1855
  raw: 咸丰五年二月十五酉刻
  description_zh: 贼由寡妇桥抄后河沿佯攻林中设伏拔营退万年贼追至丛林枪炮齐施抱头鼠窜退回饶州
  location_zh: 万年石镇街寡妇桥
- id: guji-林福祥-event-yiyang-dajie
  type: battle
  title_zh: 克复弋阳兴安肃清广饶
  date: 1855-03-20
  year_of: 1855
  raw: 咸丰五年三月二十
  description_zh: 与罗山李迪庵湘勇会剿弋阳自巳至酉两战大败贼杀溺万计夺旗千面印二十余颗檄熊应文克兴安广饶肃清
  location_zh: 弋阳
