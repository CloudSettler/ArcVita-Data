person:
  qid: guji-liu-rushi
  name_zh: 柳如是
  names:
    zh: 柳如是
    en: Liu Rushi
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: 1664
      precision: year
      is_circa: false
      raw: 康熙初牧翁卒后，柳留城守丧，投缳而殁
  birth_date: ''
  death_date: 1664
  era: 明末清初
  reign_ref: 崇祯、弘光、顺治、康熙
  archetype: 才女烈妇
  dilemmas:
  - 虽出风尘，誓择旷代逸才而嫁
  - 劝夫殉国全节，夫不肯而己欲沉水
  - 牧斋卒后面对族人逼索，捐资不解，终以死护家
  lesson: 风尘出身不减名节之重，才识与胆魄可胜须眉
  summary_first_person: 我本杨爱，出自风尘而自负才色，改姓柳、字如是，非才如钱牧斋者不嫁。归钱后唱和诗书、助其校雠国史。乙酉之变我劝夫殉节，夫怯而我欲沉水。牧斋殁，族人逼凌，我散赀纾难、密设缚凶之计，大书壁上而后自缢，以死保其家。
  source_urls:
  - 绛云楼俊遇（清·佚名，古籍引文）
