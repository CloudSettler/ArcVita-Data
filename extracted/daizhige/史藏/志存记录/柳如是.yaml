events:
- id: guji-liu-rushi-event-zhang-pu
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-1
  year_of: 1636
  date: 1636
  type: career
  title_zh: 于盛泽归家院迎张溥，自是誓择旷代逸才而从
  detail: 崇祯丙子春，出迎复社主盟张溥于垂虹亭，缱绻而别，自此窃自负。
- id: guji-liu-rushi-event-yushan
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-1
  year_of: 1636
  date: 1636
  type: encounter
  title_zh: 士人妆扁舟谒钱谦益，诗书法皆得心赏，得字“如是”
  detail: 易杨以柳、易爱以是，造钱投谒；钱得诗大惊，访于舟中，相与絮语终日，钱字之曰“如是”。
- id: guji-liu-rushi-event-songjiang
  person_qid: guji-liu-rushi
  year_of: 1636
  date: 1636
  type: encounter
  title_zh: 投刺陈卧子遭拒，登门詈之
  detail: 以女弟自称刺投陈子龙，陈不答；柳恚而詈曰“风尘中不辨物色，何足为天下名士”。
- id: guji-liu-rushi-event-changyan
  person_qid: guji-liu-rushi
  year_of: 1640
  date: 1640
  type: declaration
  title_zh: 昌言非才如钱学士者不嫁
  detail: 遇牧翁归，乃言天下惟虞山钱学士始可言才；钱应之曰非如柳者不娶。
- id: guji-liu-rushi-event-marriage
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-1
  year_of: 1640
  date: 1640-12
  type: marriage
  title_zh: 庚辰冬月归于钱，居“我闻”室
  detail: 牧翁取《金刚经》“如是我闻”之义筑“我闻”室居之，除夜促席围炉饯岁。
- id: guji-liu-rushi-event-wedding
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-1
  year_of: 1641
  date: 1641
  type: marriage_ceremony
  title_zh: 辛巳初夏行结缡礼于芙蓉舫，称“河东君”
  detail: 箫鼓遏云、九十其仪；绅士沸议、掷砖投砾，牧翁赋《催妆》诗自若，称之河东君，家人称柳夫人。
- id: guji-liu-rushi-event-jiangyun
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-2
  year_of: 1641
  date: 1641
  type: residence
  title_zh: 居绛云楼，日夕与牧翁晤对
  detail: 牧斋于虞山北麓构绛云楼，牙签万轴，置绣帷琼榻与柳同居。
- id: guji-liu-rushi-event-jiaochou
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-2
  year_of: 1643
  date: 1643
  type: literary
  title_zh: 职司国史校雠，随手抽拈百不失一
  detail: 河东君为牧斋披吟校雠之助，某书某卷随手抽出，用事舛讹旋为辨正。
- id: guji-liu-rushi-event-liurushi
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-2
  year_of: 1647
  date: 1647
  type: literary
  title_zh: 代主酬应宾客，获称“柳儒士”
  detail: 牧翁倦见客，柳肩筠舆代访逆旅、即事拈题唱和；牧翁称此我高弟亦良记室，戏称柳儒士。
- id: guji-liu-rushi-event-bangxiong
  person_qid: guji-liu-rushi
  year_of: 1650
  date: 1650
  type: relocation
  title_zh: 绛云楼灾，移居红豆山庄
  detail: 庚寅绛云灾，钱移柳居于红豆山庄，良辰胜节偕游湖山。
- id: guji-liu-rushi-event-hongdou
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-2
  year_of: 1647
  date: 1647
  type: imprisonment_relief
  title_zh: 牧斋金陵被逮，河东君实职橐饘
  detail: 丁亥岁为蜚语所伤被急征，长君暗懦一筹莫展，牧翁和东坡诗有“徒行赴难有贤妻”句。
- id: guji-liu-rushi-event-quanje
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-3
  year_of: 1645
  date: 1645-05
  type: loyalty_act
  title_zh: 乙酉之变劝牧翁殉国，夺身欲沉池水
  detail: 劝曰“是宜取义，全大节以副盛名”，牧翁有难色，柳夺身欲沉池，持之不得入。
- id: guji-liu-rushi-event-bangxiong
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-3
  year_of: 1664
  date: 1664
  type: family_conflict
  title_zh: 牧斋卒后族人交讼，捐千金不解，密布缚凶
  detail: 未亡人出千金赂凶，群凶索取不已；柳密召懿亲门人誓约，伏仆缚凶党数十人。
- id: guji-liu-rushi-event-touhuan
  person_qid: guji-liu-rushi
  endeavor_id: guji-liu-rushi-endeavor-3
  year_of: 1664
  date: 1664
  type: death
  title_zh: 大书壁曰“并力缚凶党，然后报之官”，登楼投缳
  detail: 是夕执豕煮羊肆筵待宗人，潜令仆锔前扉，入室登荣木楼自缢，凶党尽缚，悉置之法。
- id: guji-liu-rushi-event-commemoration
  person_qid: guji-liu-rushi
  year_of: 1664
  date: 1664
  type: commemoration
  title_zh: 邑中能诗者作殉节诗挽之，顾苓作《河东君传》
  detail: 长洲顾苓为作《河东君传》；徐孝廉有“一死何关青史事，九原羞杀老尚书”之咏。
