  name_zh: 何充荐桓温代庾翼镇荆州
  description: 庾翼卒后，何充荐桓温代之；翼曾谓温有雄才，勿以常婿畜之。
- id: guji-桓温-event-3
  type: military
  date: '0347'
  year_of: 347
  name_zh: 伐蜀克成都，李势降
  description: 温伐蜀至彭模，留孙盛守辎重，直指成都克之，李势降；既灭蜀，威震朝廷，加征西大将军。
- id: guji-桓温-event-4
  type: military
  date: '0354'
  year_of: 354
  name_zh: 伐秦进军灞上
  description: 温进军灞上，咸阳王猛扪虱面谈当世之事，温察而奇之。
- id: guji-桓温-event-5
  type: political
  date: 0371-11
  year_of: 371
  name_zh: 废海西公立会稽王昱
  description: 温以雄武专朝，因郗超说以废立，平旦率众入朝堂，分兵屯宫门，呈草于太后，废帝弈为东海王，立会稽王昱为简文帝。
- id: guji-桓温-event-6
  type: political
  date: 0373-02
  year_of: 373
  name_zh: 入朝大陈兵卫
  description: 二月温来朝，大陈兵卫，延见朝士；郗超卧帐中听其言，谢安笑曰郗生可谓入幕之宾。
- id: guji-桓温-event-death
  type: death
  date: 0373-07
  year_of: 373
  name_zh: 桓温卒
  description: 七月，大司马桓温卒。
