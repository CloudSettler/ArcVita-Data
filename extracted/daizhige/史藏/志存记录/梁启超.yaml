  title: 乙未公车上书连署号召
  description: 会试期间闻中日议和，愤日本要索过巨，日夕奔走号召，各省举人连署麇集都察院，几无虚日，复合千三百人大议于松筠庵，上书大意一曰拒和，二曰迁都，三曰变法。
