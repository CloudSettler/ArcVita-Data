events:
- id: guji-段思平-event-birth
  date: ''
  year_of: ''
  type: birth
  title_zh: 段思平生
  description_zh: 段氏之先武威郡人，俭魏佐蒙氏有功，六传而生思平。思平生有异兆。生年不详。
- id: guji-段思平-event-flee
  date: ''
  year_of: ''
  type: endeavor
  title_zh: 杨于真忌而索捕，思平逃匿
  description_zh: 思平生有异兆，杨于真忌之，使人索捕。思平逃匿，得奇戟于品甸波大村，又得神骥于叶镜湖。
- id: guji-段思平-event-raise
  date: ''
  year_of: ''
  type: endeavor
  title_zh: 借兵东方，三十七部皆助
  description_zh: 思平定举义之期，借兵东方，黑爨、松爨三十七部皆助之，众至河尾。
- id: guji-段思平-event-cross
  date: ''
  year_of: ''
  type: endeavor
  title_zh: 得浣妇指点渡江
  description_zh: 明旦引兵欲渡，莫知所从。见江尾一妇被璎而浣者指曰："人从我江尾，马从三沙矣。尔国名大理。"从之得济。
- id: guji-段思平-event-win
  date: ''
  year_of: ''
  type: endeavor
  title_zh: 逐杨氏而有蒙国
  description_zh: 通海节度使段思平兴师问罪，杨于真不能御，走死。杨氏立仅二年而段氏兴。
- id: guji-段思平-event-found
  date: 937-02-17
  year_of: 937
  type: endeavor
  title_zh: 建大理国，改元文德
  description_zh: 后晋天福二年，思平既逐杨氏而有蒙国，遂改国号曰大理，改元曰文德。段氏自此传二十二主，历三百五十年。
- id: guji-段思平-event-death
  date: ''
  year_of: ''
  type: death
  title_zh: 段思平卒，谥太祖
  description_zh: 思平死，伪谥太祖，传子思英。
