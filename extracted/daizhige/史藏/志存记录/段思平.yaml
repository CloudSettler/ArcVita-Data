  birth_date: 约9世纪末
  death_date: 约944年
  era: 五代十国
  reign_ref: 后晋天福二年（937年）建大理国，改元文德
  archetype: 开国之君
  dilemmas:
  - 举义前得凶兆之梦，进军与否存疑，赖军师董迦罗解梦决断
  - 受杨于真猜忌追捕，隐忍逃匿以待时机
  lesson: 顺天时应人心，借力群部，可成开基之业；梦兆吉凶终在人造。
  summary_first_person: 我本通海节度使，杨于真贪虐无道、中外咸怨，又忌我而索捕之。我逃匿民间，得奇戟神骥，借黑爨松爨三十七部之兵，以十二月二十一日举义，渡河逐杨氏，遂有蒙国之地。后晋天福二年，我改国号曰大理，改元文德，段氏自此兴焉。
