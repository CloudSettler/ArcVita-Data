  date: 1852
  year_of: 1852
  place_zh: 湖南
  summary: 咸丰二年募楚勇成军，周昌发充亲兵，后转战安徽
- id: guji-江忠源-event-luzhou
  title_zh: 庐州被围遣使求援
  date: 1853-12
  year_of: 1853
  place_zh: 安徽庐州
  summary: 巡抚安徽入庐州被围，命周昌发缒城促援师，未返而援军不得近城
- id: guji-江忠源-event-death
  title_zh: 庐州城陷殉节
  date: 1854-01-14
  year_of: 1854
  place_zh: 安徽庐州古塘侧
  summary: 城陷死于古塘侧，就掩泥中，后周昌发窃负遗骸出城，雅量不乱，为忠烈殉节
