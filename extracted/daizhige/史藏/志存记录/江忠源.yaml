  year_of: 1843
  place_zh: 京师
  summary: 微时游京师谒曾国藩，侃侃言天下将大乱，声震屋瓦，曾目送叹为平生未见如此人
- id: guji-江忠源-event-husang
  title_zh: 护邹邓曾三丧归葬
  date: 1844
  year_of: 1844
  place_zh: 京师
  summary: 亲为邹柳溪量水称药治丧送归陕，护师邓铁松南归治丧致湘乡，又归同年曾春田之丧，义声震京师
- id: guji-江忠源-event-muyong
