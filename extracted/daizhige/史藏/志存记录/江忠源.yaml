  - date: 1853-12
    title_zh: 遣昌发缒城促援师
    rationale: 城中饷尽援绝，欲通内外以存城守大局
  - date: 1854-01-14
    title_zh: 守土不去以身殉城
    rationale: 吾守土者义当死，城亡则以节烈报朝廷，不肯偷生
events:
