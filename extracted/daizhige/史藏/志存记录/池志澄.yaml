endeavors:
- id: guji-池志澄-endeavor-1
  title_zh: 三载遍迹全台游幕考察
  summary: 自沪渡鸡笼历台北新竹，越澎湖安平凤山三条仑赴台东，遍察山川形势风俗物产
  phases:
  - key: brewing
    name: 辛卯客沪渡海至鸡笼台北
    labels:
      zh: 萌发渡台
    start_date: '1891-10-20'
    highlight_event_id: guji-池志澄-event-voyage
  - key: breakthrough
    name: 入抚幕办商务局铁路票房
    labels:
      zh: 入幕台北
    start_date: '1892-03-01'
    highlight_event_id: guji-池志澄-event-taibei
  - key: climax
    name: 经澎湖安平越岭赴台东胡传幕府
    labels:
      zh: 远赴后山
    start_date: '1893-01-22'
    highlight_event_id: guji-池志澄-event-taidong
  - key: closure
    name: 三载遍迹归结全台形势兴衰
    labels:
      zh: 收局全台
    start_date: '1894-06-01'
    highlight_event_id: guji-池志澄-event-taidong
  decisions:
  - date: '1891-10-20'
    title_zh: 应友邀自沪渡台由北而南而东
    rationale: 久慕台湾土沃产阜可富可强，欲身历目睹山川扼要风俗险阻
  - date: '1893-01-22'
    title_zh: 愿赴后山台东胡传幕府不避风瘴
    rationale: 前山亦曾为后山，有官兵营守则无险，愿远历生番巢穴之地
- id: guji-池志澄-endeavor-2
  title_zh: 删改日记撰全台游记存故土
  summary: 以三载日记删改为全台游记，兼及番社纪闻雪鸿记，晚年八十重理旧稿以待后人
  phases:
  - key: brewing
    name: 在台日记山川人物风俗险阻
    labels:
      zh: 日积游记
    start_date: '1891-10-22'
    highlight_event_id: guji-池志澄-event-voyage
  - key: breakthrough
    name: 光绪壬辰癸巳间删改日记成书
    labels:
      zh: 删改成书
    start_date: '1892-08-01'
    highlight_event_id: guji-池志澄-event-authorship
  - key: climax
    name: 甲午内渡雪鸿记受责束藏
    labels:
      zh: 束藏诸稿
    start_date: '1895-05-01'
    highlight_event_id: guji-池志澄-event-authorship
  - key: closure
    name: 八十迁居得亡儿楷本追述刊存
    labels:
      zh: 晚年存稿
    start_date: '1932-01-01'
    highlight_event_id: guji-池志澄-event-authorship
  decisions:
  - date: '1892-08-01'
    title_zh: 删改游幕日记专记形势景物
    rationale: 非身历目睹不敢率记，欲决某处必兴某处必败以昭形势
  - date: '1895-05-01'
    title_zh: 从畏友言束藏雪鸿记番社纪闻略
    rationale: 浪游十余年当著有用之书，不作冶游诲淫板桥杂记之流
events:
- id: guji-池志澄-event-birth
  title_zh: 出生
  date: '1852'
  year_of: 1852
  place_zh: 浙江
  description: 生于清咸丰初前后，少时读平台纪略戡定台湾记慕海外之想
- id: guji-池志澄-event-voyage
  title_zh: 自沪乘斯美轮船渡海至鸡笼登台北
  date: '1891-10-22'
  year_of: 1891
  place_zh: 上海至鸡笼至台北府城
  description: 辛卯十月二十日自沪开行，廿二申正到鸡笼，三面皆山北面临海，廿三乘火车至台北大稻埕
- id: guji-池志澄-event-taibei
  title_zh: 入抚幕办商务局铁路票房兼游新竹大嵙崁金沙局
  date: '1892-03-01'
  year_of: 1892
  place_zh: 台北府新竹桃仔园金沙局
  description: 在抚幕四阅月，在商务局一年，遍游艋舺沪尾新竹大嵙崁及鸡笼内山金沙煤硫之地
- id: guji-池志澄-event-taidong
  title_zh: 经澎湖安平安平凤山东港越三条仑赴台东
  date: '1893-01-22'
  year_of: 1893
  place_zh: 澎湖妈宫澳安平凤山东港三条仑大麻里
  description: 乘饷船自鸡笼南下，历澎湖妈宫安平涌浪，南行阿公店凤山林仔边东港，募番轿番兵越三条仑大树林溪底营至后山
- id: guji-池志澄-event-authorship
  title_zh: 删改日记成全台游记晚年追叙存故土
  date: '1932-01-01'
  year_of: 1932
  place_zh: 内渡后旧居
  description: 光绪壬辰癸巳删改日记为全台游记，甲午内渡散佚，晚年八十得亡儿锴楷本追思台湾未割繁华痛惜割地
- id: guji-池志澄-event-death
  title_zh: 逝世
  date: '1935'
  year_of: 1935
  place_zh: 故里
  description: 年八十余后逝世，遗全台游记以示后世有心人知当时美地
