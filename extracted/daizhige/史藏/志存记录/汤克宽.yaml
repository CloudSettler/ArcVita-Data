events:
- id: guji-汤克宽-event-birth
  date: 1506
  year_of: 1506
  title_zh: 生于邳州卫
  description: 正德初生于邳州卫指挥家少习武勇熟知倭情后任邳州卫指挥号武河
- id: guji-汤克宽-event-death
  date: 1578
  year_of: 1578
  title_zh: 卒于万历初年
  description: 久历浙直参戎征剿倭寇多建战功后卒家兵黄猛等皆附其传
- id: guji-汤克宽-event-fushou
  date: 1553-05-20
  year_of: 1553
  title_zh: 奉督府檄来守海盐
  description: 督府王忬檄参戎汤克宽提邳兵三百人皆雄伟惯战者来守盐守巡潘恩姜延颐咸在盐守御
- id: guji-汤克宽-event-gaogong
  date: 1553-05-25
  year_of: 1553
  title_zh: 高公山冒矢督战斩馘凯旋
  description: 乍浦倭船七只索粮既遁留数十负固高公山汤亲冒矢石登山督战杀贼四十余贯馘长矛入东门潘姜设宴奏凯
- id: guji-汤克宽-event-longwang
  date: 1553-05-26
  year_of: 1553
  title_zh: 龙王塘御三十七艘围攻三昼夜
  description: 倭船三十七只泊龙王塘数千白昼攻城矢如雨汤开弓射杀邳兵鸟铳俱无虚发连三夕举火守垛推石下砖贼不能破扬帆往乍浦
- id: guji-汤克宽-event-jinshan
  date: 1553-06-01
  year_of: 1553
  title_zh: 转守金山代以罗拱辰守盐
  description: 直隶吴淞贼势猖獗乃转汤守金山以松阳令罗拱辰代守盐筑土城敌楼渐固
- id: guji-汤克宽-event-pinghu
  date: 1553-07-06
  year_of: 1553
  title_zh: 会罗侯剿平湖沈家匿贼
  description: 平湖流贼匿沈姓民家金山汤公会吾盐罗侯往剿火其庐勇士吴寿升屋逐出斩获数十余奔散追剿擒获
- id: guji-汤克宽-event-zhapu
  date: 1553-09-12
  year_of: 1553
  title_zh: 率兵会援乍浦合杀贼
  description: 贼船十余只泊乍浦汤率兵来会吾盐参戎卢镗援之杀贼松阳叶千户嘉兴沈队长等战殁兵民死者百余人
