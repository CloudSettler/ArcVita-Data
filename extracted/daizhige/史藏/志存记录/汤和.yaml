  type: endeavor
- id: guji-汤和-event-shaozong
  date: '1492'
  year_of: 1492
  title_zh: 玄孙汤绍宗应诏赴京，授指挥使
  description: 孝庙即位之五年，下诏查取开国追封王爵功臣子孙，东瓯王玄孙汤绍宗至自南京，授指挥使职，定南京锦衣卫，近其坟茔以奉祀。
  type: endeavor
