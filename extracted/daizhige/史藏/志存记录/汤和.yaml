    rationale: 值元末草昧之际，择主而从，与徐达、常遇春等十人同为王师初起义之臣。
  - date: '1370'
    title_zh: 洪武三年大封功臣时受封中山侯
    rationale: 以从征之功，得与洪武三年封侯者二十八人之列。
