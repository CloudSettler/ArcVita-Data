      raw: 洪武二十八年（1395年）薨
  birth_date: '1326'
  death_date: '1395'
  era: 明初
  reign_ref: 明太祖洪武
  archetype: 开国功臣·佐命宿将
  dilemmas:
  - 功高震主之际，如何自处而得善终，与李善长等以罪赐死者形成对照
  - 子鼎先卒，身后爵位传承与祭祀之忧，赖孝庙追恩其玄孙汤绍宗得奉祀
  lesson: 为君难，为臣不易；从龙起于草昧，功成而能令终者，尤见持身之谨。
  summary_first_person: 我汤和，随太祖高皇帝于乙未夏六月渡江，是渡江十人之一。我官至御史大夫兼太子谕德，洪武三年封中山侯，十年进封信国公，二十八年薨，蒙追封东瓯王，谥襄武。我子鼎先我而卒，追封信世子；玄孙绍宗在孝庙时得授指挥使，奉我先人祀事。
  source_urls:
  - 损斋备忘录（明）梅纯 撰·纪事
