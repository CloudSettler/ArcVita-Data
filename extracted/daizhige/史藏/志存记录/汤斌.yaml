  description: 皇帝南巡将至，江督几欲毁屋修御道，汤斌力争不可；帝至，奖曰是事颇合朕爱民之意，并撤御馔赐之。
  endeavor_id: guji-tangbin-endeavor-2
  person_id: guji-tangbin
- id: guji-tangbin-event-wutong
  date: '1685'
