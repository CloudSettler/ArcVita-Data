  description: 苏城上方山五通祠淫掠妇女，祠丁以术祟人，世无敢攫其锋者；汤斌厉然火之，并尽收其丁置诸法，一方卒无恙。
  endeavor_id: guji-tangbin-endeavor-2
  person_id: guji-tangbin
- id: guji-tangbin-event-lisun
  date: '1686'
  date_precision: year
  year_of: 1686
  is_circa: true
  type: endeavor
  title_zh: 入阁去苏，竹箧数事
  description: 汤斌入阁离苏，行装惟竹箧数事、书籍满车而已；在苏时夫人五十未尝衣帛，师巫为绝，奢淫之风为之一变。
  endeavor_id: guji-tangbin-endeavor-2
  person_id: guji-tangbin
- id: guji-tangbin-event-death
  date: '1687'
  date_precision: year
  year_of: 1687
  is_circa: true
  type: death
  title_zh: 汤斌卒，谥文正
  description: 汤斌卒，谥文正。后人有病其为假道学者，然论者叹曰汤之假道学，即令今人聊效之，国势不至如此矣。
  person_id: guji-tangbin
