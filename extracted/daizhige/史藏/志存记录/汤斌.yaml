person:
  qid: guji-tangbin
  name_zh: 汤斌
  names:
    zh: 汤斌
    en: Tang Bin
  lifespan:
    birth:
      date: '1627'
      precision: year
      is_circa: true
      raw: 明天启七年（约1627年）
    death:
      date: '1687'
      precision: year
      is_circa: true
      raw: 清康熙二十六年（约1687年）
  birth_date: '1627'
  death_date: '1687'
  era: 清初
  reign_ref: 顺治、康熙
  archetype: 清廉刚直、不阿权贵的理学名臣
  dilemmas:
  - 直书明末抗节致命诸臣事迹，两遭阁臣金之厚、冯铨弹劾，仍秉笔不屈
  - 江督欲毁民居修御道迎驾，力争不可，押上己身仕途以护小民
  lesson: 居官以清廉爱民为本，处史以直笔为节，虽权势在前而不改其守，故能化一地奢淫之风、留千秋文正之谥。
  summary_first_person: 我汤斌，字孔伯，号潜庵，雎州人。顺治九年应选入二甲，十三年授翰林，为明末抗节诸臣纪实入史，直笔不挠，虽被劾而不屈。后抚苏，焚五通淫祠、免菱芡苛例、斥奢华、崇先贤，离苏之日惟竹箧数事、书籍满车，谥曰文正。
  source_urls:
  - 《所闻录》清·汪诗侬
endeavors:
- id: guji-tangbin-endeavor-1
  name_zh: 翰林直笔纪实
  domain: 史馆文翰
  description: 顺治朝应选入二甲、授翰林院，为明末抗节致命诸臣纪实入国史，文字直书，毋少顾忌，虽遭弹劾而史笔不移。
  phases:
  - key: brewing
    name_zh: 应选入二甲
    labels:
      zh: 科举入仕
    start_date: '1652'
    highlight_event_id: guji-tangbin-event-jinshi
  - key: breakthrough
    name_zh: 授职翰林
    labels:
      zh: 翰林清要
    start_date: '1656'
    highlight_event_id: guji-tangbin-event-hanlin
  - key: climax
    name_zh: 直书不屈
    labels:
      zh: 史笔抗劾
    start_date: '1657'
    highlight_event_id: guji-tangbin-event-jie
  - key: closure
    name_zh: 温谕慰留
    labels:
      zh: 圣眷保全
    start_date: '1658'
    highlight_event_id: guji-tangbin-event-jie
  decisions:
  - date: '1656'
    title_zh: 为明抗节诸臣纪实直书
    rationale: 以为国史当存信史，明臣致命之节不可没，虽阁臣劾奏在前，秉笔曾不因之少屈。
- id: guji-tangbin-endeavor-2
  name_zh: 抚苏整肃民风
  domain: 地方政务
  description: 巡抚江苏，力争不毁民居修御道，火焚上方山五通淫祠并置祠丁于法，免菱芡援例之税，修范文正、周忠介二公祠及泰伯庙，苏地奢淫之风为之一变。
  phases:
  - key: brewing
    name_zh: 出抚江苏
    labels:
      zh: 节钺临吴
    start_date: '1684'
    highlight_event_id: guji-tangbin-event-fusu
  - key: breakthrough
    name_zh: 力争御道
    labels:
      zh: 护民抗上
    start_date: '1684'
    highlight_event_id: guji-tangbin-event-yudao
  - key: climax
    name_zh: 焚祠惩恶
    labels:
      zh: 破除淫祀
    start_date: '1685'
    highlight_event_id: guji-tangbin-event-wutong
  - key: closure
    name_zh: 入阁去苏
    labels:
      zh: 两袖清风
    start_date: '1686'
    highlight_event_id: guji-tangbin-event-lisun
  decisions:
  - date: '1684'
    title_zh: 力争不可毁屋修御道
    rationale: 江督几欲毁屋修御道以迎南巡，以为扰民害民之事断不可为，遂力争不可，卒得皇帝嘉许。
  - date: '1685'
    title_zh: 焚上方山五通祠
    rationale: 五通祠淫掠妇女、祠丁以术祟人，世无敢撄其锋，厉然火之并尽收其丁置诸法，以绝一方之害。
  - date: '1685'
    title_zh: 嗤免菱芡收税之例
    rationale: 吏援例收菱芡税，以为必使小民喘气不得而后可者，汝之肉不足食，下吴县重治之，例亦免。
