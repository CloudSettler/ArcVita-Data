person:
  qid: guji-沈万山
  name_zh: 沈万山
  names:
    zh: 沈万山
    en: Shen Wanshan
  lifespan:
    birth:
      date: 约1300
      precision: decade
      is_circa: true
      raw: 元末，家贫无产，以渔为生
    death:
      date: 约1380
      precision: decade
      is_circa: true
      raw: 明太祖时以茅山石筑苏州街，被疑谋逆收杀
  era: 元末明初
  reign_ref: 元至正、明洪武
  archetype: 传奇巨富商人
  dilemmas:
  - 富可敌国而遭帝王猜忌，恃富对半筑城反招祸
  - 藏宝秘而不言以求自保，终究财富招致杀身抄家
  lesson: 财富可以骤至，亦可骤失；富过于主而不知敛藏，终为祸端。
  summary_first_person: 我本吴县渔家贫子，因水底拾得乌鸦石、又传得北斗马蹄金而暴富，转贸于豪商之间致金数百万，衣食用度拟于王者，筑绣垣宝海之楼以自娱。太祖克金陵后，我愿对半出资助筑外城，先完工三日，帝虽酌酒慰我而心实不悦。后我以茅山石筑苏州街，帝疑我有逆谋，遂收杀之，尽抄家财入官。
  source_urls:
  - 《云蕉馆纪谈》·明·孔迩述
endeavors:
