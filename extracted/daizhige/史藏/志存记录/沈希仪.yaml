person:
  qid: guji-沈希仪
  name_zh: 沈希仪
  names:
    zh: 沈希仪
    en: Shen Xiyi
  lifespan:
    birth:
      date: 1489-01-01
      precision: year
      is_circa: true
      raw: 弘治末临淮世家生
    death:
      date: 1544-01-01
      precision: year
      is_circa: true
      raw: 嘉靖末卒于广右任上
  birth_date: 1489-01-01
  death_date: 1544-01-01
  era: 明
  reign_ref: 嘉靖
  archetype: 边徼奇谋良将
  dilemmas:
  - 奉檄守文以全名还是违制进兵以争机，文法与胜算孰重
  - 剿绝立威还是怀柔收心，杀伐与全室家还虏掠孰长
  lesson: 得贼情则风雨来去皆中机，守威信则猺夷可使攻猺，奇正相生而仁恕为本方能久安
  summary_first_person: 吾世官奉议卫，少能驰马手搏贼，历永安陈村以数百捣寨，临桂追巢跳涧斩酋，荔浦以五百破八千，继赞督府谋擒岑猛于田州，复镇柳州右江十三年，以贩者为谍，以夫人结猺妇，以剜目征偿，以计擒韦扶谏岑金，遂使柳城四旁童子牵牛行深山而无敢诃者
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/guanyu-guangyou-zhangong.md
  - https://daizhige.org/shizang-zhicun-jilu-guangyou-zhangong.html
endeavors:
- id: guji-沈希仪-endeavor-1
  title_zh: 赞画督府平田州岑猛
  summary_zh: 嘉靖六年料定岑璋貌合心离，劝督府用反间，自请将中哨当工尧，绕道插旗惊溃后阵，斩邦彦入田州，借璋圈留岑猛而献首
  phases:
  - key: brewing
    name: 料璋恨猛定反间策
    labels:
      zh: 反间料敌
    start_date: 1527-01-01
    highlight_event_id: guji-沈希仪-event-tianzhou
  - key: breakthrough
    name: 分兵缘山缘江绕工尧背
    labels:
      zh: 奇袭绕后
    start_date: 1527-08-01
    highlight_event_id: guji-沈希仪-event-tianzhou
  - key: climax
    name: 合战工尧斩邦彦入隘
    labels:
      zh: 破隘穷追
    start_date: 1527-09-01
    highlight_event_id: guji-沈希仪-event-tianzhou
  - key: closure
    name: 圈留岑猛于归顺献首
    labels:
      zh: 借刀定局
    start_date: 1527-10-01
    highlight_event_id: guji-沈希仪-event-tianzhou
  decisions:
  - date: 1527-05-01
    title_zh: 劝督府使岑璋擒猛
    rationale: 知璋女失宠貌合神离，可遣精卒以护女为名居猛左右，望旗即溃
  - date: 1527-08-01
    title_zh: 自请将中哨当工尧
    rationale: 猛劲兵尽在工尧诸将推让，不当坚隘不得积粟饱军，无以乘胜取田州
- id: guji-沈希仪-endeavor-2
  title_zh: 镇柳州右江十三年绥猺
  summary_zh: 剿五都立威，置那地狼兵，以商贩为谍，以针线银簪结猺妇得情，绳内分别剧贼，剜目征偿，擒韦扶谏，诱缚岑金于宾州南宁
  phases:
  - key: brewing
    name: 捣五都置狼兵养谍
    labels:
      zh: 立威蓄谍
    start_date: 1529-01-01
    highlight_event_id: guji-沈希仪-event-liuzhou
  - key: breakthrough
    name: 结猺妇得情风雨剿剧贼
    labels:
      zh: 得情怀柔
    start_date: 1530-01-01
    highlight_event_id: guji-沈希仪-event-liuzhou
  - key: climax
    name: 俘妻子以心战擒韦扶谏
    labels:
      zh: 心战擒渠
    start_date: 1534-01-01
    highlight_event_id: guji-沈希仪-event-liuzhou
  - key: closure
    name: 款留诱缚岑金定思恩
    labels:
      zh: 诱缚定乱
    start_date: 1537-01-01
    highlight_event_id: guji-沈希仪-event-sien
  decisions:
  - date: 1529-03-01
    title_zh: 未请督府而邂逅追贼入巢
    rationale: 柳去督府千里文书往来必泄机，胜则上首虏请罪，兵谋得无泄方能制胜
  - date: 1537-04-01
    title_zh: 婉款杨留岑金诱至南宁
    rationale: 金拥五千在宾州咽喉，急图则表里骚动，不如寄衣赐银许官以安其心，携诉南宁而缚之
events:
- id: guji-沈希仪-event-birth
  title_zh: 出生临淮将家
  date: 1489-01-01
  year_of: 1489
  description_zh: 世官奉议卫指挥，先临淮人，袭官时未弱冠，能驰马手搏贼
- id: guji-沈希仪-event-tianzhou
  title_zh: 工尧破岑猛定田州
  date: 1527-09-01
  year_of: 1527
  description_zh: 嘉靖六年将中哨攻工尧，夜分三百缘山右走间道，三百缘江左上山，山上插旗，璋兵大嚣天兵得工尧矣，遂斩邦彦入隘，璋圈留岑猛醉而斩首
- id: guji-沈希仪-event-liuzhou
  title_zh: 镇柳州剿五都擒扶谏
  date: 1530-03-01
  year_of: 1530
  description_zh: 为右江参将治柳州，以五百捣五都最险巢，置那地狼兵二千，以贩者为谍，以猺妇得情，剜目征偿，俘三层妻子而以计缚韦扶谏，剜目截耳四悬城门，在柳十三年宿猾几尽
- id: guji-沈希仪-event-sien
  title_zh: 宾州款诱缚岑金
  date: 1537-06-01
  year_of: 1537
  description_zh: 思恩岑金聚兵五千欲复故地，杨留千人应募宾州欲投金，婉色款留，纳帖许官，犒牛酒，使侄同卧起，作诉稿挈金诉巡按于南宁以缚之
- id: guji-沈希仪-event-death
  title_zh: 卒于广右
  date: 1544-01-01
  year_of: 1544
  description_zh: 历永安临桂荔浦田州柳州思恩诸役，能使猺人不作贼，更能使猺攻猺，广西所未有，后卒于任，柳人思之
