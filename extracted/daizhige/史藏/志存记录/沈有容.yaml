person:
  qid: guji-沈有容
  name_zh: 沈有容
  names:
    zh: 沈有容
    en: Shen Yourong
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
  birth_date: ''
  death_date: ''
  era: 明
  reign_ref: 万历年间
  archetype: 将领
  dilemmas:
  - 剿倭受阻于风涛与朝廷非议，独任专擅之责
  - 面对红毛求市，抉择以兵剿或以言谕退
  lesson: 以勇与谋并用，一夜之师贻海上百年之安，三寸之舌胜百万之众
  summary_first_person: 我是沈有容，明末浯屿把总。万历壬寅冬，我率二十一舟冒风雪渡海，破据东番之倭，收泊大员，番酋献鹿馈酒以谢；甲辰秋，红毛韦麻郎据彭湖求市，我单艇入夷舟，以言谕之，使其解缆而去。东番之役用战，西番之役不用剿，皆出人意料之外。
endeavors:
- id: guji-沈有容-endeavor-1
  name_zh: 东番剿倭之役
  phases:
