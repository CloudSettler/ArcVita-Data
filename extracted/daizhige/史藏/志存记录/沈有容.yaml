    start_date: 1603-02
    highlight_event_id: guji-沈有容-event-5
  decisions:
  - date: 1602-12
    title: 不待明文，径渡海剿倭
    rationale: 武夫敌忾，惟机是乘；若必待明文，则贼终无殄灭之期
  - date: 1603-01
    title: 破贼财货均分兵士
    rationale: 战不旋踵图利，夺贼之财以鼓舞三军，官无所利
- id: guji-沈有容-endeavor-2
  name_zh: 谕退红毛彭湖之役
  phases:
  - key: brewing
    name_zh: 受命议抚
    labels:
      zh:
      - 请以林玉行
    start_date: 1604-10
    highlight_event_id: guji-沈有容-event-6
  - key: climax
    name_zh: 单艇入夷舟
    labels:
      zh:
      - 凌波冒险
      - 三寸之舌
    start_date: 1604-10-25
    highlight_event_id: guji-沈有容-event-7
  - key: closure
    name_zh: 三舟解缆而去
    labels:
      zh:
      - 竣于十月之二十五日
    start_date: 1604-11-16
    highlight_event_id: guji-沈有容-event-8
  decisions:
  - date: 1604-10
    title: 主谕不主剿
    rationale: 彼来求市非为寇，剿则徒杀无罪或贻朝廷羞，不如谕之使自去
  - date: 1604-10-26
    title: 亲坐小艇入夷舟见麻郎
    rationale: 谕人而羁其使非策，故身自入夷舟晓以利害
