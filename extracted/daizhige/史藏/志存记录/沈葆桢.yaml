  birth_date: 1820-07-31
  death_date: 1879-12-11
  era: 清
  reign_ref: 同治
  archetype: 洋务靖边之臣
  dilemmas:
  - 不动声色密筹与大张声势示威之间，进退两难
  - 自我启衅开边衅与苟安示弱致外侮之间，轻重两难
  - 抚绥生番为我用与简易治边防他族垂涎之间，缓急两难
  lesson: 外侮方萌当先事豫筹，谕以情理与示以兵威并用，方能消患于未形
  summary_first_person: 吾沈葆桢，值同治甲戌日兵窥伺台湾生番，奉旨以巡阅为名率轮船兵弁察看台地，又授钦差办理台湾等处海防兼理各国事务，节制闽省镇道，调拨饷船，与潘霨会商文煜李鹤年，图抚番卫台，以杜日本及各国觊觎
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%90%8C%E6%B2%BB%E7%94%B2%E6%88%8C%E6%97%A5%E5%85%B5%E4%BE%B5%E5%8F%B0%E5%A7%8B%E6%9C%AB.html
