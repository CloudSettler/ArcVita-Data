  decisions:
  - date: 1874-05-14
    title_zh: 以巡阅为名不动声色赴台
    rationale: 既不操之过急开衅，又须先事有备杜衅于方萌，故假巡查洋面之名行察看之实
  - date: 1874-05-20
    title_zh: 会商督抚提镇酌拨兵弁
    rationale: 台地孤悬须合文煜李鹤年罗大春之力，调拨轮船官弁以资缓急足恃
- id: guji-沈葆桢-endeavor-2
  title_zh: 钦差办理台湾海防兼理各国事务
  role_zh: 钦差大臣节制闽省镇道
  summary_zh: 授为钦差大臣，节制福建镇道，调遣苏粤轮船，与潘霨慎密筹划，或谕以情理或示以兵威，按约与日本及各国辩论，预杜觊觎
  start_date: 1874-05-29
  end_date: 1874-12-31
