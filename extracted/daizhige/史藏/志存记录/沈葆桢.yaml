endeavors:
- id: guji-沈葆桢-endeavor-1
  title_zh: 台湾开山抚番与建城设治
  summary_zh: 奏请巡抚移扎台湾，开后山渡台旧禁，抚番开山，建琅峤城邑，设台北府县，奠定全台建置。
  phases:
  - key: brewing
    name: 奏请移抚专责台湾
    labels:
      zh: 筹议
    start_date: 1874-12-28
    highlight_event_id: guji-沈葆桢-event-1
  - key: breakthrough
    name: 开禁招垦褒忠建祠
    labels:
      zh: 开拓
    start_date: 1875-02-14
    highlight_event_id: guji-沈葆桢-event-2
  - key: climax
    name: 履勘琅峤筑城设官
    labels:
      zh: 经略
    start_date: 1875-02-15
    highlight_event_id: guji-沈葆桢-event-2
  - key: closure
    name: 添设台北府县交卸北上
    labels:
      zh: 成治
    start_date: 1875-12-22
    highlight_event_id: guji-沈葆桢-event-3
  decisions:
  - date: 1874-12-28
    title_zh: 会奏请福建巡抚移扎台湾
    rationale: 台防吃紧事权不一，非大员驻台专责不能通筹抚番开山全局
  - date: 1875-02-14
    title_zh: 请开渡台旧禁并弛铁竹之禁
    rationale: 后山旷土亟须招垦，因时变通广招徕方能实边
  - date: 1875-02-14
    title_zh: 请为郑成功建专祠追谥
    rationale: 表彰仗节守义顺舆情以系台民之心
- id: guji-沈葆桢-endeavor-2
  title_zh: 督办南洋海防与筹议西征饷需
  summary_zh: 简任两江总督督办南洋海防，筹练军设局购铁甲开煤铁，力谏左宗棠借洋款千万之害，请移缓就急筹西征饷。
  phases:
  - key: brewing
    name: 简任两江分督南洋
    labels:
      zh: 受命
    start_date: 1875-05-29
    highlight_event_id: guji-沈葆桢-event-3
  - key: breakthrough
    name: 统筹练军设局开矿
    labels:
      zh: 筹防
    start_date: 1875-05-29
    highlight_event_id: guji-沈葆桢-event-3
  - key: climax
    name: 奏陈洋债之害请止借巨款
    labels:
      zh: 力谏
    start_date: 1876-03-01
    highlight_event_id: guji-沈葆桢-event-4
  - key: closure
    name: 交卸船政赴任江南竭筹协饷
    labels:
      zh: 持重
    start_date: 1876-03-01
    highlight_event_id: guji-沈葆桢-event-4
  decisions:
  - date: 1875-05-29
    title_zh: 受命督办南洋海防
    rationale: 南北洋地面过宽须分段督办，南洋练军设局招致华人需专任经理
  - date: 1876-03-01
    title_zh: 奏请碍难代借洋款千万
    rationale: 借债还息病海关部库，西班牙土耳其前车可鉴，不敢为孤注一掷
  - date: 1876-03-01
    title_zh: 请移缓就急匀拨西征饷
    rationale: 西征不可停，宜师赵充国养威屯田，以内库倡节俭移各省缓款济急
events:
- id: guji-沈葆桢-event-birth
  title_zh: 出生
  date: 1820-01-01
  year_of: 1820
  description_zh: 道光二十年生于福建侯官，林则徐婿，后官至船政大臣两江总督。
  place_zh: 福建侯官
- id: guji-沈葆桢-event-1
  title_zh: 奏请福建巡抚移扎台湾
  date: 1874-12-28
  year_of: 1874
  description_zh: 同治十三年十二月十一日谕，沈葆桢等奏请将福建巡抚移扎台湾以专责成，交衙门议奏。
  place_zh: 台湾
  related_endeavor_id: guji-沈葆桢-endeavor-1
- id: guji-沈葆桢-event-2
  title_zh: 开后山禁抚番开山建祠筑城
  date: 1875-02-14
  year_of: 1875
  description_zh: 光绪元年正月初十日谕准开除渡台旧禁，准为郑成功台湾府城建专祠追谥，奖开山出力员弁，饬筑琅峤城建邑设官。
  place_zh: 台湾府
  related_endeavor_id: guji-沈葆桢-endeavor-1
- id: guji-沈葆桢-event-3
  title_zh: 简任两江总督督办南洋海防
  date: 1875-05-29
  year_of: 1875
  description_zh: 夏四月二十六日以沈葆桢为两江总督兼办通商，派督办南洋海防，筹练军设局购铁甲开煤铁，台郡城垣工竣报闻。
  place_zh: 两江
  related_endeavor_id: guji-沈葆桢-endeavor-2
- id: guji-沈葆桢-event-4
  title_zh: 筹议西征饷需谏止借洋款
  date: 1876-03-01
  year_of: 1876
  description_zh: 光绪二年二月初七日奏陈国债利病，台湾借款有成案而新疆万里不同，千万洋款耗息近六百万病海关部库，请移缓就急并效充国屯田养威。
  place_zh: 上海江南
  related_endeavor_id: guji-沈葆桢-endeavor-2
- id: guji-沈葆桢-event-death
  title_zh: 去世
  date: 1879-12-01
  year_of: 1879
  description_zh: 光绪五年十一月卒于两江总督任上，谥文肃，台湾府城建祠祭祀。
  place_zh: 南京
