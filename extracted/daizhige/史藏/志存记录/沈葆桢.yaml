    start_date: 1874-08-01
    highlight_event_id: guji-沈葆桢-event-defense
  decisions:
  - date: 1874-05-29
    title_zh: 请以钦差名义办理交涉征调
    rationale: 非办理各国事务官员则彼族置之不理，呼应不灵，须重事权以便辩论调遣
  - date: 1874-07-01
    title_zh: 筹饷增兵抚番为我用
    rationale: 生番久隶版图须设法抚绥驾驭藉卫地方，使彼无隙可乘且不为他族垂涎
