  dilemmas:
  - 镇标中营守卫府城与分防各汛塘兵力单薄难以兼顾
  - 同治八年裁兵加饷后额减饷增操防抚恤难以两全
  lesson: 额兵虽裁操防不可懈，守城分汛须明册稽核以安地方
  summary_first_person: 吾为洪金升，先任台湾镇标中营游击，管马战守兵四百六十六名，守卫府城，后升嘉义营参将，统战守兵六百九十四名，分防嘉义斗六诸汛，值同治裁兵加饷之际，谨守营制汛塘，以尽镇守之责
  source_urls:
  - https://daizhige.org/史藏/志存记录/台湾兵备手抄.html
endeavors:
- id: guji-洪金升-endeavor-1
  title_zh: 镇标中营游击守卫府城
  role_zh: 镇标中营游击
  description: 任台湾镇标中营游击，统马兵二名战兵一百九十名守兵二百七十四名，兼稿字识号令手三十二名，守卫台湾府城
  phases:
  - key: brewing
    name: 初任游击清厘额数
    labels:
      zh: 整军守城
    start_date: 1868
    highlight_event_id: guji-洪金升-event-youji
  - key: climax
    name: 守城兼顾南北风汛塘防
    labels:
      zh: 分汛协防
    start_date: 1869
    highlight_event_id: guji-洪金升-event-youji
  decisions:
  - date: 1868
    title_zh: 造报镇标中营官兵马船清册
    rationale: 明马战守兵额数及号令手以便稽核操演
  - date: 1869
    title_zh: 配合南路北路塘汛轮防
    rationale: 府城为根本，链通南北尖宿里站，不可空虚
- id: guji-洪金升-endeavor-2
  title_zh: 嘉义营参将镇守中部
  role_zh: 嘉义营参将
  description: 升任嘉义营参将，统战兵三百十五名守兵三百七十九名，兼号令手十七名，驻嘉义县城，分防斗六门八奖溪诸汛
  phases:
  - key: breakthrough
    name: 由游击升任参将统嘉义大营
    labels:
      zh: 升任镇守
    start_date: 1869
    highlight_event_id: guji-洪金升-event-canjiang
  - key: closure
    name: 同治八年裁兵加饷后定额防守
    labels:
      zh: 裁兵加饷
    start_date: 1869
    highlight_event_id: guji-洪金升-event-canjiang
  decisions:
  - date: 1869
    title_zh: 驻嘉义县城分兵斗六门
    rationale: 嘉义为南北孔道，斗六门都司辖大埔林他里雾诸汛，须重兵控扼
  - date: 1869
    title_zh: 遵新章核定战守兵额
    rationale: 台澎通计七千六百二十一名，嘉义六百九十四名，额减饷增以精代多
events:
- id: guji-洪金升-event-birth
  title_zh: 出生
  date: 1820
  year_of: 1820
  description: 约生于道光年间，籍贯不详，行伍出身
- id: guji-洪金升-event-youji
  title_zh: 任台湾镇标中营游击
  date: 1868
  year_of: 1868
  description: 任镇标中营游击，与守备李连枝千总辛省三等共事，统兵四百六十六名守府城
- id: guji-洪金升-event-canjiang
  title_zh: 升任嘉义营参将
  date: 1869
  year_of: 1869
  description: 由镇标中营游击升嘉义营参将，驻嘉义县城，辖兵四百四十名在城，兼辖斗六门都司及水沙连等汛，适逢同治八年裁兵加饷定额
- id: guji-洪金升-event-death
  title_zh: 去世
  date: 1875
  year_of: 1875
  description: 约卒于光绪初年，嘉义参将任后事迹不详
