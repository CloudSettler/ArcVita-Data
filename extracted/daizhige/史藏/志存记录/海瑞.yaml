  summary_first_person: 我海瑞，自琼州举人出身，历知县、户部主事，曾抬棺上《治安疏》直谏嘉靖皇帝，虽系狱而不悔。后巡抚应天，锐意清丈田亩、力摧豪强；官至南京右都御史，卒时贫不能葬。
