person:
  qid: guji-狄仁杰
  name_zh: 狄仁杰
  names:
    zh: 狄仁杰
    en: Di Renjie
  lifespan:
    birth:
      date: '0630'
      precision: year
      is_circa: true
      raw: 据史传约生于唐贞观年间，本篇未载生年
    death:
      date: '0700'
      precision: year
      is_circa: false
      raw: 武周久视元年卒
  birth_date: '0630'
  death_date: '0700'
  era: 唐代／武周
  reign_ref: 武则天（圣历、久视年间）、中宗李显
  archetype: 直谏社稷之臣
  dilemmas:
  - 死谏与保命的两难——殿前油锅当前，改口则长保富贵，守直则立死
  - 姑侄与母子继统之争——立侄武三思顺诸武之势，立子庐陵王则逆烈火之焰
  - 受赏与守节——珠金御衣罗列殿前，受之则卖唐家社稷
  lesson: 舍死直言，以母子天性回天意，社稷为重而一身生死为轻
  summary_first_person: 则天欲立武三思为储，满朝山呼称贺，惟我不拜。我以母子性天之道、姑侄孰亲之义九次极谏，虽张易之曲媚取容、赏金诱我、油锅逼我，我惟守直而死，不邪佞而生。终使则天感悟，密召庐陵王还朝，正位东宫，复登帝位，唐祚不移。
endeavors:
- id: guji-狄仁杰-endeavor-1
  name_zh: 九谏复储——力主立庐陵王为东宫
  phases:
  - key: brewing
    name_zh: 当廷独不拜，首陈异议
    labels:
      zh: 第一谏至第四谏
    start_date: 0697
    highlight_event_id: guji-狄仁杰-event-1
  - key: breakthrough
    name_zh: 借天象人心、改元之数论武三思终不得立
    labels:
      zh: 第二谏至第四谏
    start_date: 0697
    highlight_event_id: guji-狄仁杰-event-2
  - key: climax
    name_zh: 殿前油锅死谏，褰衣欲跳
    labels:
      zh: 第八谏
    start_date: 0698
    highlight_event_id: guji-狄仁杰-event-3
  - key: closure
    name_zh: 则天感悟，庐陵王还朝正位，中宗复唐
    labels:
      zh: 第九谏
    start_date: 0698
    highlight_event_id: guji-狄仁杰-event-4
  decisions:
  - date: 0697
    title_zh: 诸臣拜贺立武三思之际独不拜，直陈当立庐陵王
    rationale: 大臣所见不远，以姑而立侄不如以母而立子，社稷合归唐家枝叶
  - date: 0698
    title_zh: 殿前油锅威逼下不改前解，褰衣欲蹈死
    rationale: 乍立庐陵王而死，不立武三思而生；以死报先帝托孤之命
- id: guji-狄仁杰-endeavor-2
  name_zh: 托孤守节——拒赏斥佞，以死报高宗之托
  phases:
  - key: brewing
    name_zh: 则天不豫入阁问疾，借鹦鹉折翅之梦进言
    labels:
      zh: 第七谏
    start_date: 0698
    highlight_event_id: guji-狄仁杰-event-5
  - key: breakthrough
    name_zh: 张易之谋以金宝诱之，赏赐罗列殿前而不为动
    labels:
      zh: 拒赏
    start_date: 0698
    highlight_event_id: guji-狄仁杰-event-6
  - key: climax
    name_zh: 殿前自陈守直而死、不邪佞而生
    labels:
      zh: 死谏
    start_date: 0698
    highlight_event_id: guji-狄仁杰-event-3
  - key: closure
    name_zh: 则天拊背称“岂朕之臣，乃社稷之臣”
    labels:
      zh: 社稷之臣
    start_date: 0698
    highlight_event_id: guji-狄仁杰-event-4
  decisions:
  - date: 0698
    title_zh: 拒收色罗、珠金、御衣等重赏
    rationale: 受此赏物却立外姓，是卖却唐家社稷，九泉之下无面见高宗大帝
  - date: 0698
    title_zh: 太子还朝后请设仪迎立，请太子赴龙门、百官备礼以迎
    rationale: 当年贬太子天下皆知，今还朝宰相尚有不知者，还宫无仪，谁知谁立
events:
- id: guji-狄仁杰-event-birth
  title_zh: 狄仁杰生
  date: '0630'
  precision: year
  is_circa: true
  year_of: 630
  description: 本篇未载生年，据史传约生于唐贞观年间。
- id: guji-狄仁杰-event-1
  title_zh: 第一谏——会朝独不拜，反对策立武三思
  date: 0697
  precision: year
  is_circa: true
  year_of: 697
  endeavor_id: guji-狄仁杰-endeavor-1
  description: 则天问策立之意，八十二员大臣皆拜舞称贺，惟狄公不拜，奏称“东宫之位合立庐陵王为储君，立武三思终当不得”。
- id: guji-狄仁杰-event-2
  title_zh: 历数改元之数，论庐陵王必立、武三思必不得立
  date: 0697
  precision: year
  is_circa: true
  year_of: 697
  endeavor_id: guji-狄仁杰-endeavor-1
  description: 第三谏中举改元两个“万岁元年”暗合“万万年”之谶，断言定东宫之位非庐陵王不可。
- id: guji-狄仁杰-event-5
  title_zh: 第七谏——问疾圆鹦鹉折翅之梦，触怒武三思被逐出朝门
  date: 0698
  precision: year
  is_circa: true
  year_of: 698
  endeavor_id: guji-狄仁杰-endeavor-2
  description: 奏称武者陛下之姓，相王、庐陵王乃陛下之双翅，今皆远贬遂感此梦；武三思在傍怒发赤色，令武士撮出朝门。
- id: guji-狄仁杰-event-6
  title_zh: 殿前重赏当前，拒赐守节
  date: 0698
  precision: year
  is_circa: true
  year_of: 698
  endeavor_id: guji-狄仁杰-endeavor-2
  description: 张易之奏称狄相家贫、多赐金宝便可策立武三思，则天陈罗十束、珠金两床、御衣百箱诱之，狄公以卖唐家社稷、无面见高宗为辞拒之。
- id: guji-狄仁杰-event-3
  title_zh: 第八谏——殿前油锅死谏，则天连声允依所奏
  date: 0698
  precision: year
  is_circa: true
  year_of: 698
  endeavor_id: guji-狄仁杰-endeavor-1
  description: 则天置油锅于殿前逼其改解，狄公征古言“姑之与侄孰近，子之与母更亲”，言讫褰衣大步欲跳入油锅，则天命武士执裾，称从今日起依卿所奏。
- id: guji-狄仁杰-event-4
  title_zh: 第九谏——庐陵王密召还朝，帘外相见，请备礼策立
  date: 0698
  precision: year
  is_circa: true
  year_of: 698
  endeavor_id: guji-狄仁杰-endeavor-1
  description: 则天感悟遣使往房州密召庐陵王，狄公见太子呜咽流涕、殒绝于地；请太子往龙门、召亲王宗正百官备礼以迎，遂正位东宫，后复帝位，庙号中宗。则天拊其背称“岂朕之臣，乃社稷之臣也”。
- id: guji-狄仁杰-event-death
  title_zh: 狄仁杰卒
  date: '0700'
  precision: year
  is_circa: false
  year_of: 700
  description: 武周久视元年卒；本篇序称中宗复帝位、唐祚不移皆梁公之力，吕温颂其“忠心与日月同明”。
