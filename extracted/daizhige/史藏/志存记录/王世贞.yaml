    title_zh: 与李攀龙共倡复古
    rationale: 惩嘉靖文坛流靡，欲以秦汉盛唐格调振起文风
  - date: '1570'
    title_zh: 李攀龙殁后独主文盟
    rationale: 以博学与交游维持复古旗帜，兼收时秀以延文脉
