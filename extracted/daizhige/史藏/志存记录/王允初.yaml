  - date: 1206-12-14
    title_zh: 自为固守不徯外援
    rationale: 宣司无急病之心孙铎拥兵不进惟自奋励可持久待春虏退
  - date: 1206-12-21
    title_zh: 开门斫寨焚其攻具
    rationale: 虏楼橹将成须析其力遏横溃故选千二百人出涢津焚洞子天桥
