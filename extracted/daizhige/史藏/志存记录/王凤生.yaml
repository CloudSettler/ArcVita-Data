events:
- id: guji-王凤生-event-birth
  title_zh: 出生
  date: 1785
  year_of: 1785
  location: 安徽婺源
  description: 清乾隆末年约生于婺源后入仕曾任浙江平湖官
- id: guji-王凤生-event-1825-buhuang
  title_zh: 莅任三日至永城捕蝗勘水
  date: 1825-06-10
  year_of: 1825
  location: 河南归德府永城县
  description: 道光乙酉夏奉命即赴归德新任莅任三日率有司赴永城捕蝗蝗净而犹未雨遂履勘各属水利
- id: guji-王凤生-event-1825-shuili
  title_zh: 札饬查勘疏浚干支河沟
  date: 1825-07-01
  year_of: 1825
  location: 河南归德府
  description: 通饬商邱宁陵鹿邑虞城夏邑睢州柘城等州县查勘十二干河及支沟按亩分工绘图贴说禀复并配合惠民沟横河等官修工程
- id: guji-王凤生-event-1825-baojia
  title_zh: 查办保甲兼行弭盗义仓
  date: 1825-08-01
  year_of: 1825
  location: 河南归德府商邱县
  description: 以平湖成法饬各属查办保甲首县王掌丝为倡兼晓谕吕司寇弭盗法陶中丞义仓法节省徭役宣讲圣谕
- id: guji-王凤生-event-1825-shengren
  title_zh: 升授河北道留札录书
  date: 1825-09-25
  year_of: 1825
  location: 河南归德府
  description: 秋九月蒙特恩升授河北守道行前留札各州县录宋州从政一编以相质愿无忘所能
- id: guji-王凤生-event-death
  title_zh: 去世
  date: 1840
  year_of: 1840
  location: 直隶河北道任后
  description: 道光末年约卒生平以兴水利办保甲省差徭为地方称道
