  archetype: 良知儒将
  dilemmas:
  - 以君子之道而行反间设诡是否违道
  - 以忠诚体国而遭江彬许泰猜忌如何全身
  - 以问罪之师而忍贼久留江湖是否纵敌
  lesson: 此心不动方能应变无穷以良知精明临难而以变化随时济忠诚
  summary_first_person: 吾守仁丰城闻宸濠之变祷风北渡潜赴吉安假为两广火牌京军文书以反间迟留半月而后移檄勤王既复南昌鄱阳湖顺流放免死木牌以散胁从火攻擒濠而不形于奏复归功总督以止巡幸惟守此心不动以致良知而已
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/志存记录/平濠记.md
  - https://daizhige.org/史藏/志存记录/平濠记.html
endeavors:
- id: guji-王守仁-endeavor-1
  title_zh: 丰城闻变吉安起兵反间迟濠
  summary_zh: 丰城闻变北风渡江舍临江取吉安伪造两广狼达官兵火牌及南北夹攻文书反间刘养正李士实迟宸濠半月不动以待四方有备
  phases:
  - key: brewing
    name: 丰城祷风潜赴吉安
    labels:
      zh: 避冲据上游
    start_date: 1519-06-15
    highlight_event_id: guji-王守仁-event-fengcheng-wenbian
  - key: breakthrough
    name: 假造火牌文书设疑
    labels:
      zh: 反间迟留
    start_date: 1519-06-20
    highlight_event_id: guji-王守仁-event-jian-fanjian
  - key: climax
    name: 遍贴告示旗牌摇贼心
    labels:
      zh: 攻心解体
    start_date: 1519-07-01
    highlight_event_id: guji-王守仁-event-jian-fanjian
  - key: closure
    name: 调度已定移檄暴罪
    labels:
      zh: 勤王有名
    start_date: 1519-07-15
    highlight_event_id: guji-王守仁-event-jian-fanjian
  decisions:
  - date: 1519-06-15
    title_zh: 舍临江取吉安起兵
    rationale: 临江滨大江近省城当冲莫若吉安居上游可进退以图勤王
  - date: 1519-06-20
    title_zh: 伪造两广火牌京军文书
    rationale: 得渠一疑则事去矣使宸濠一日不出则天下实受一日之福
  - date: 1519-07-01
    title_zh: 反间刘养正李士实并招降胁从
    rationale: 贼众本非本心威劫利诱苟合耳离其谋主散其党与则师老气衰
- id: guji-王守仁-endeavor-2
  title_zh: 复南昌鄱阳决战擒濠归功
  summary_zh: 乘濠出兵复省城顺流放免死木牌鄱阳湖火攻迎击擒宸濠于渔舟复归功张永总督称病退让以解猜忌全身
  phases:
  - key: brewing
    name: 拔南昌分兵迎击
    labels:
      zh: 攻其必救
    start_date: 1519-08-20
    highlight_event_id: guji-王守仁-event-poyang-qinhao
  - key: breakthrough
    name: 湖上顺放免死木牌
    labels:
      zh: 散其胁从
    start_date: 1519-08-24
    highlight_event_id: guji-王守仁-event-poyang-qinhao
  - key: climax
    name: 鄱阳湖火攻大溃擒濠
    labels:
      zh: 心不动而制变
    start_date: 1519-08-26
    highlight_event_id: guji-王守仁-event-poyang-qinhao
  - key: closure
    name: 付濠于张永归功总督
    labels:
      zh: 推功全身
    start_date: 1519-09-01
    highlight_event_id: guji-王守仁-event-poyang-qinhao
  decisions:
  - date: 1519-08-20
    title_zh: 复省城迎击湖上
    rationale: 贼闻省破必还救出其不意迎击之小衄不挫反激励麾下转败为功
  - date: 1519-08-26
    title_zh: 中军讲学不动心而战
    rationale: 胜负决在此心动与不动之间真肯在良知上用功自能应变无穷
  - date: 1519-09-01
    title_zh: 擒濠付张永归功军门
    rationale: 恐一受江彬节制则事机不可为推功总督以止巡幸以全身退祸
events:
- id: guji-王守仁-event-birth
  title_zh: 出生浙江余姚
  date: 1472-10-31
  year_of: 1472
  place_zh: 浙江余姚
  description_zh: 成化八年九月三十日生于余姚后以军功封新建伯以良知之学为宗
- id: guji-王守仁-event-fengcheng-wenbian
  title_zh: 丰城闻变北风赴吉安
  date: 1519-06-15
  year_of: 1519
  place_zh: 江西丰城至吉安
  description_zh: 至丰城闻宸濠反舟人畏劫不发密祷得北风拔剑馘耳而发微服换舟脱追兵夜至临江舍临江取吉安以罗盖示城而入
- id: guji-王守仁-event-jian-fanjian
  title_zh: 吉安用间迟留宸濠半月
  date: 1519-07-03
  year_of: 1519
  place_zh: 江西吉安
  description_zh: 与雷济萧禹龙光等假写两广火牌迎接京军文书及刘李反间书缝置袷衣使获杀以生疑又遍贴告示旗牌张疑兵丰城使濠六月十七拟出而不敢出至七月初三方出果逾半月
- id: guji-王守仁-event-poyang-qinhao
  title_zh: 复南昌鄱阳湖擒宸濠
  date: 1519-08-26
  year_of: 1519
  place_zh: 江西南昌鄱阳湖
  description_zh: 既拔南昌遣伍文定等迎击湖上先造免死木牌数十万顺流放下散胁从火攻大溃书宁王已擒牌以惊扰之濠遁就渔舟为王冕所伺缚送遂就擒奏捷不言反间渔舟之详
- id: guji-王守仁-event-death
  title_zh: 病逝南宁军中
  date: 1529-01-09
  year_of: 1529
  place_zh: 广西南宁军中
  description_zh: 嘉靖七年十一月二十九日征思田凯旋病逝军中平生精神用在征赣宁藩等事门人钱德洪搜录遗书汇平濠始末以白其忠诚体国之智
