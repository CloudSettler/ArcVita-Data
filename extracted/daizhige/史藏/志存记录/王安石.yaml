endeavors:
- id: guji-王安石-endeavor-1
  title_zh: 熙宁变法富国强兵
  summary_zh: 熙宁中拜参主持新法，理财练兵，欲救北宋积贫积弱之局
  phases:
  - key: brewing
    name: 得君共议理财
    labels:
      zh: 蓄势谋变
    start_date: 1068-01-01
    highlight_event_id: guji-王安石-event-bianfa
  - key: breakthrough
    name: 拜参颁行新法
    labels:
      zh: 破局立制
    start_date: 1069-01-01
    highlight_event_id: guji-王安石-event-bianfa
  - key: climax
    name: 青苗市易并举争议沸腾
    labels:
      zh: 高潮相持
    start_date: 1070-01-01
    highlight_event_id: guji-王安石-event-jinzhang
  - key: closure
    name: 罢相守旧局未竟
    labels:
      zh: 收束待评
    start_date: 1076-01-01
    highlight_event_id: guji-王安石-event-tanbing
  decisions:
  - date: 1069-01-01
    title_zh: 受命参大政主持变法
    rationale: 鉴积贫积弱非理财整军不足以救时，故不避怨谤担当新法
  - date: 1070-01-01
    title_zh: 嫁女锦帐即舍为佛帐
    rationale: 闻神宗问以大儒之家用锦帐嫁女，惧骄侈损家风国体，故舍帐于开宝寺福胜阁下以自警谢罪
- id: guji-王安石-endeavor-2
  title_zh: 奖掖后进辨人才公私
  summary_zh: 晚年日探病中南丰，论邸报蔡京召试，辨屠沽小人与制诰重任之别
  phases:
  - key: brewing
    name: 南丰病卧日造卧内
    labels:
      zh: 交谊笃厚
    start_date: 1083-01-01
    highlight_event_id: guji-王安石-event-tanbing
  - key: breakthrough
    name: 面论蔡京召试不可
    labels:
      zh: 直言品鉴
    start_date: 1083-06-01
    highlight_event_id: guji-王安石-event-tanbing
  - key: climax
    name: 拟论缴修注除命
    labels:
      zh: 持正守阙
    start_date: 1083-08-01
    highlight_event_id: guji-王安石-event-tanbing
  - key: closure
    name: 南丰颔之而殁风鉴留世
    labels:
      zh: 言传身退
    start_date: 1083-09-01
    highlight_event_id: guji-王安石-event-death
  decisions:
  - date: 1083-06-01
    title_zh: 断蔡京难任知制诰
    rationale: 谓其如屠沽无文行，词命重任不可轻授，恐取悦人主而坏制诰之体
  - date: 1083-08-01
    title_zh: 欲论缴蔡京修注之除
    rationale: 以南丰行诰词为正，待便论缴以存馆阁公议，虽病中故交亦不以私废公
events:
- id: guji-王安石-event-birth
  date: 1021-12-18
  year_of: 1021
  title_zh: 生于临川
  description_zh: 天禧五年十一月初二生于临川，少好读书属文，号半山
- id: guji-王安石-event-bianfa
  date: 1069-01-01
  year_of: 1069
  title_zh: 熙宁拜参主持变法
  description_zh: 熙宁二年拜参知政事，颁青苗免役市易诸法，富国强兵
- id: guji-王安石-event-jinzhang
  date: 1070-05-01
  year_of: 1070
  title_zh: 舍嫁女锦帐为佛帐
  description_zh: 以次女适蔡卞，吴国夫人以天下乐晕锦为帐，神宗问卿大儒之家用锦帐嫁女，归验果然，遂舍之开宝寺福胜阁下为佛帐，明日再对皇惧谢罪
- id: guji-王安石-event-tanbing
  date: 1083-06-01
  year_of: 1083
  title_zh: 病中日探南丰论蔡京
  description_zh: 南丰先生病中，日造卧内，见邸报蔡京召试，言他如何做得知制诰一屠沽耳，又言除修注诰词是子固行当待便当论缴，南丰已疾革颔之而已
- id: guji-王安石-event-death
  date: 1086-05-21
  year_of: 1086
  title_zh: 卒于江宁
  description_zh: 元祐元年四月初六卒于江宁钟山，谥文，世称临川先生荆公
