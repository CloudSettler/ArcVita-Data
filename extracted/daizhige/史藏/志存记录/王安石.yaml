  dilemmas:
  - 坚持新法与顾念故旧亲谊之间如何取舍
  - 家风持俭与贵戚华侈风气之间如何自处
  lesson: 持身以俭律家，行事以公许国
  summary_first_person: 我本临川布衣，蒙神宗知遇主持新法以救积弱，次女适蔡卞而吴夫人以乐晕锦为帐，我闻谕即舍帐于开宝寺为佛帐以谢罪，南丰病中我日造卧内，论蔡京召试谓其不可为知制诰，一生俭以率家公以观人
