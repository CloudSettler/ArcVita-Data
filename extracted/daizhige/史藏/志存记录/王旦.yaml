person:
  qid: guji-王旦
  name_zh: 王旦
  names:
    zh: 王旦
    en: Wang Dan
  lifespan:
    birth:
      date: 0957
      precision: year
      is_circa: true
      raw: 生于后汉乾祐年间
    death:
      date: '1017-10-12'
      precision: day
      is_circa: false
      raw: 天禧元年九月薨
  birth_date: 0957
  death_date: '1017-10-12'
  era: 北宋
  reign_ref: 宋真宗
  archetype: 太平宰相
  dilemmas:
  - 澶渊之盟后褒崇符瑞与据实直书之间的的两难
  - 祖宗典故与特殊情况破例任用之间的权衡
  - 抑制私恩与保全大臣之间的分寸
  lesson: 宰相之道在于守公议、裁决大事、不邀己功，虽处东封西祀之盛而能持大体。
  summary_first_person: 我王旦辅佐真宗，两为大祀使，处事以典故为守，遇大事善镇安置，虽东封西祀多出我手，然于符瑞实录必乞书臣奏以明实情，荐人却不使恩出于己。
  source_urls:
  - https://zh.wikisource.org/wiki/王文正公遗事
endeavors:
- id: guji-王旦-endeavor-1
  name_zh: 辅政真宗，历东西两府而至宰相
  phases:
