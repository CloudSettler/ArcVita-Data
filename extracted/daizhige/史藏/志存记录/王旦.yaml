  - key: breakthrough
    name_zh: 拜相主持东封西祀
    labels:
      zh:
      - 大祀使
      - 太平宰相
    start_date: '1006'
    highlight_event_id: guji-王旦-event-fengshan
  - key: climax
    name_zh: 裁处危局，镇定朝堂
    labels:
      zh:
      - 张耆选兵谋变
      - 宫禁火灾
      - 蝗灾
    start_date: '1010'
    highlight_event_id: guji-王旦-event-songhuo
  - key: closure
    name_zh: 病中荐贤托付大事
    labels:
      zh:
      - 求罢
      - 荐十余可用之人
    start_date: '1016'
    highlight_event_id: guji-王旦-event-recommend
  decisions:
  - date: '1007-06-01'
    title_zh: 答契丹借金帛，岁给外各借二万，次年额内除之
    rationale: 以微物轻之，示朝廷不懦亦不启其贪心
  - date: '1011-05-01'
    title_zh: 赵德明矫称民饥乞粮，请降手诏令其自遣众飞挽
    rationale: 不责其渝约而以抚御远方之义应之，号真庙算
  - date: '1012-03-01'
    title_zh: 张耆选兵令峻致兵谋变，擢耆枢密副使以解兵柄
    rationale: 不罪帅臣、不捕乱卒，使谋者自安，善镇大事
  - date: '1013-04-01'
    title_zh: 卜者上书干禁狱起，独对焚往来书尺不穷治朝臣
    rationale: 不欲以卜祝贱流累及朝臣，免生倾挤之风
- id: guji-王旦-endeavor-2
  name_zh: 修身守礼，保守家法以训子弟
  phases:
  - key: brewing
    name_zh: 掌诰时为避嫌恳求解职
    labels:
      zh:
      - 妻父入参大政
      - 引唐故事辞官
    start_date: 0990
    highlight_event_id: guji-王旦-event-avoid
  - key: climax
    name_zh: 弟弟任用与姻亲干谒皆谢绝
    labels:
      zh:
      - 弟旭止除闲局
      - 婿韩亿所白不许
    start_date: '1012-05-01'
    highlight_event_id: guji-王旦-event-family
  - key: closure
    name_zh: 遗事垂范，家法训戒为世所法
    labels:
      zh:
      - 魏野赠诗伴赤松游
      - 遗札存世
    start_date: '1016-09-01'
    highlight_event_id: guji-王旦-event-death
  decisions:
  - date: '1012-10-01'
    title_zh: 辞亲重用，请以弟旭改一闲局
    rationale: 恐公议非便，愿他日出于宸衷而非因宰相之力
  - date: '1014-11-01'
    title_zh: 却女夫姻亲相率之请
    rationale: 宰相执政，若可行答以何辞，是执政大忌
events:
- id: guji-王旦-event-birth
  date: 0957
  year_of: 957
  type: birth
  description: 王旦生于大名莘县仕宦之家，后为魏国公。
- id: guji-王旦-event-avoid
  date: 0990
  year_of: 990
  type: endeavor
  description: 王旦掌诰时妻父赵公入参大政，引唐独孤德、权德舆故事恳求解职，太宗览奏称叹。
- id: guji-王旦-event-chanyuan
  date: '1004-12-01'
  year_of: 1004
  type: endeavor
  description: 契丹入寇，真宗幸澶渊亲讨，王旦参大政；还京曲赦，其赦文典重，闻者称真王言。
- id: guji-王旦-event-fengshan
  date: '1008-11-01'
  year_of: 1008
  type: endeavor
  description: 王旦两为大祀使，主持东封西祀；进符瑞别录时乞令实录编修官记录己奏，明言奉符瑞者非一一自睹。
- id: guji-王旦-event-songhuo
  date: '1015-04-23'
  year_of: 1015
  type: endeavor
  description: 宫禁大火，两朝所积殆尽；王旦对以财帛不足忧、政令赏罚为虑，上表待罪；有人请置狱诛数百人，旦乞独对化解，减死者几百辈。
- id: guji-王旦-event-recommend
  date: '1017-09-01'
  year_of: 1017
  type: endeavor
  description: 王旦病笃于滋福殿得对，叙祖宗创业积累之盛，荐可用者十余人，后皆至大府。
- id: guji-王旦-event-death
  date: '1017-10-12'
  year_of: 1017
  type: death
  description: 王旦薨，寇准致奠于上前哀恸久之；幼子王素泣而辑其遗事成编。
