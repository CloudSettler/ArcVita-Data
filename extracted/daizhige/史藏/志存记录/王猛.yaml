  title_zh: 桓温伐秦进军灞上，王猛披褐诣军门，扪虱而谈当世之事
  detail: 咸阳王猛被褐而诣桓温，面谈当时之事，猛扪虱而言，傍若无人，温察而奇之。（《续晋阳秋》）
