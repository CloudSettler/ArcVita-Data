  birth_date: '325'
  death_date: '375'
  era: 东晋十六国（前秦）
  reign_ref: 前秦苻坚时期
  archetype: 出将入相的名臣/隐而待时的寒士
  dilemmas:
  - 拒绝桓温南归之邀，选择留北方辅佐苻坚
  - 身处胡族政权而以华夏纲纪自任的处境
  lesson: 怀大才者不苟合于时，遇明主则尽忠竭力、以法治国
  summary_first_person: 我王猛，字景略，北海人。少时家贫而博学，隐于华山，静观时局。桓温伐秦至灞上，我披褐诣军门，扪虱而谈天下之事，温察而奇之，然我度江南士族难成大事，遂辞归。后得苻坚知遇，君臣相得，我以丞相之位整饬法制、抑豪强、劝农桑，前秦由此大治。建元十一年，我病笃而卒，临终戒坚勿图晋室。
  source_urls:
  - https://zh.wikisource.org/檀道鸾《续晋阳秋》辑本
