  name_zh: 王琼
  names:
    zh: 王琼
    en: Wang Qiong
  lifespan:
    birth:
      date: 1459
      precision: year
      is_circa: false
      raw: 明英宗天顺三年
    death:
      date: 1532
      precision: year
      is_circa: false
      raw: 明世宗嘉靖十一年
  birth_date: 1459
  death_date: 1532
  era: 明中叶
  reign_ref: 正德
  archetype: 经世理财之尚书
  dilemmas:
  - 足国与裕民难两全，屡诏蠲租虽美而京边岁用不继
  - 守祖宗成法与因气数时势变通难两全，久远可行而无弊者鲜
  - 核实纠弊与容众持大体难两全，督饷费帑而民不沾惠
  lesson: 法久必敝气数使然，惟纪实核数因时剂量，方能足国裕民
  summary_first_person: 余居双溪之间，养气之余辄录所思，纪时事之得于耳闻目击者。正德六七年流贼猖獗，孙交督饷费太仓银二百余万而民不沾惠，京边告竭。八年余任户部，查余草料豆减价变卖得银二十六万补宣府军饷，深悟听其言美施于用疏之失，乃杂录阴阳封建郡县马政税法之变，以示劝惩垂永久。
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%8F%8C%E6%BA%AA%E6%9D%82%E8%AE%B0.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%8F%8C%E6%BA%AA%E6%9D%82%E8%AE%B0.md
endeavors:
- id: guji-王琼-endeavor-1
  title_zh: 正德八年总户部足国裕民
  summary: 继孙交后任户部尚书，清理督饷积弊，核余草余料补边储，纠蠲租不均之失
  phases:
  - key: brewing
    name: 流贼耗帑边储告竭
    labels:
      zh: 太仓银竭公私俱困
    start_date: 1511
    highlight_event_id: guji-王琼-event-1511-rebellion
  - key: breakthrough
    name: 受命度支查核始
    labels:
      zh: 任户部尚书
    start_date: 1513
    highlight_event_id: guji-王琼-event-1513-revenue
  - key: climax
    name: 变卖余草济宣府
    labels:
      zh: 得银二十六万补军饷
    start_date: 1513
    highlight_event_id: guji-王琼-event-1513-revenue
  - key: closure
    name: 陈蠲租轻重之偏
    labels:
      zh: 思足国裕民之宜
    start_date: 1514
    highlight_event_id: guji-王琼-event-1513-revenue
  decisions:
  - date: 1513
    title_zh: 奏查余剩料豆余草变价补饷
    rationale: 军行过处积蓄预备多朽腐不堪用，不核则暴殄，减价变卖可得银二十六万运送宣府
  - date: 1513
    title_zh: 议蠲租当计国用不可缺
    rationale: 孙交等屡诏蠲起运数百万而富民幸免贫民无田者惠不及，京师借太仓耗边储竭，须勾考惟正之供申明盐法
- id: guji-王琼-endeavor-2
  title_zh: 居双溪杂录论治道
  summary: 居岩穴录阴阳五行封建郡县相制兵马税法之变，及于谦三杨典故，以事寓理资智识
  phases:
  - key: brewing
    name: 双溪养气有所思
    labels:
      zh: 信手杂录纪实无空言
    start_date: 1520
    highlight_event_id: guji-王琼-event-1525-writing
  - key: breakthrough
    name: 论历代创制立法气数
    labels:
      zh: 传贤传子封建郡县未可定
    start_date: 1522
    highlight_event_id: guji-王琼-event-1525-writing
  - key: climax
    name: 记于谦受诬三杨得失
    labels:
      zh: 明是非公赏罚示劝惩
    start_date: 1524
    highlight_event_id: guji-王琼-event-1525-writing
  - key: closure
    name: 成帙垂永久
    labels:
      zh: 格物君子观之有所取
    start_date: 1525
    highlight_event_id: guji-王琼-event-1525-writing
  decisions:
  - date: 1524
    title_zh: 详书于谦死因与徐有贞李贤之谋
    rationale: 辨柄臣之心言官之口法吏之手，不可置党与于末减，以正万世公论
  - date: 1525
    title_zh: 立杂记体例事核词简理明论公
    rationale: 山林纪述虽无统理，即事寓言可广见闻，大关治道小切日用，使读者如刍豢悦口不为徒言
events:
- id: guji-王琼-event-birth
  date: 1459
  year_of: 1459
  title_zh: 生于山西太原
  description: 明英宗天顺三年生，字德华，后登进士历户部诸职
- id: guji-王琼-event-1511-rebellion
  date: 1511
  year_of: 1511
  title_zh: 正德六七年盗贼四起军饷纷扰
  description: 孙交命杨潭发太仓银二百余万和买粮草，州县强买侵克，为盗所劫，费而民不沾惠，太仓积银三百余万几尽
- id: guji-王琼-event-1513-revenue
  date: 1513
  year_of: 1513
  title_zh: 任户部尚书清理余草补边
  description: 正德八年贼平任户部尚书，奏查余剩料豆余草数千万束，减价变卖得银二十六万运送宣府，又论正德六七年蠲免起运数百万致南北税轻重之偏
- id: guji-王琼-event-1525-writing
  date: 1525
  year_of: 1525
  title_zh: 居双溪撰成杂记
  description: 居双溪岩穴录阴阳循环立法必变之理，及国初护卫禄米俸给黜陟取士内阁三杨于谦等事，久而成帙曰双溪杂记
- id: guji-王琼-event-death
  date: 1532
  year_of: 1532
  title_zh: 卒于明世宗嘉靖十一年
  description: 历事弘治正德嘉靖三朝，终以尚书之任论理财经世之务，杂记传世
