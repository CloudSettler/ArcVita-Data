person:
  qid: guji-王瑞楠
  name_zh: 王瑞楠
  names:
    zh: 王瑞楠
    en: Wang Ruinan
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 不详
    death:
      date: 1647-06-17
      precision: day
      is_circa: false
      raw: 清顺治四年五月十五（丁亥）
  death_date: 1647-06-17
  era: 明末清初
  reign_ref:
  - 明天启
  - 明崇祯
  - 南明弘光
  - 南明隆武
  - 清顺治
  archetype: 明几先识、清节不染的殉国孤忠
  dilemmas:
  - 明知主抚必败，是屈从上官维持抚局，还是力谏主剿自取祸端
  - 故国沦亡、新朝征辟，是出仕保全家族，还是守节殉明
  - 丁忧去职与国事危急相冲突，去留之间如何自处
  lesson: 识几于先而守身如玉，事不可为时以一死全其名节
  summary_first_person: 我王瑞楠，天启乙丑进士，历官苏州、河间推官，官至郧襄兵备佥事。张献忠谷城乞抚，我独知其诈，力谏熊文灿以剿济抚，三策不用，献忠果反，而我不受一钱之名遂著。南渡后授太仆寺少卿，闽浙相继沦陷，我谕降不应，于生辰之日从容拜庙置酒，自缢以殉，得谥忠节。
  source_urls:
  - 《明季瓯江殉节四先生事迹·恭录南疆绎史所载王忠节公传》
  - 《王瑞楠上戴治院书》
  - 《上理按两院书》
  - 《供奉王忠节公记》
endeavors:
- id: guji-王瑞楠-endeavor-1
  name_zh: 早年科第与州郡理政
  phases:
  - key: brewing
    name_zh: 登第入仕
    labels:
      zh:
      - 进士
      - 推官
      - 兑运调剂
    start_date: 1625
    highlight_event_id: guji-王瑞楠-event-jinshi
  - key: breakthrough
    name_zh: 岁省浮费三万金
    labels:
      zh:
      - 勒石著令
    start_date: 1625
    highlight_event_id: guji-王瑞楠-event-jinshi
  decisions:
  - date: 1625
    title_zh: 授苏州推官兼理兑运，调剂军民交兑之争
    rationale: 军民交兑恒相轧，乃均平处置，岁省浮费三万金，上官勒石著令
  - title_zh: 改河间推官，寻入为工部主事
    rationale: 政绩卓著，转迁京职
- id: guji-王瑞楠-endeavor-2
  name_zh: 郧襄抚局之争与力谏主剿
  phases:
  - key: brewing
    name_zh: 擢郧襄兵备佥事
    labels:
      zh:
      - 兵备道
    start_date: 1637
    highlight_event_id: guji-王瑞楠-event-fuju
  - key: breakthrough
    name_zh: 独抗抚议，上剿抚并行策
    labels:
      zh:
      - 谏诤
      - 剿抚并行
      - 三策
    start_date: 1638
    highlight_event_id: guji-王瑞楠-event-fuju
  - key: climax
    name_zh: 献忠复叛，不受一钱之名大著
    labels:
      zh:
      - 预言得验
      - 清节
    start_date: 1639
    highlight_event_id: guji-王瑞楠-event-fanpan
  - key: closure
    name_zh: 丁忧去职，留身待时
    labels:
      zh:
      - 丁忧
    start_date: 1639
    highlight_event_id: guji-王瑞楠-event-dingyou
  decisions:
  - date: 1638
    title_zh: 力谏熊文灿勿受张献忠谷城之抚
    rationale: 贼以抚愚我，我岂可以抚自愚；惟示之以必剿之势，乃心折不敢贰
  - date: 1638
    title_zh: 亟陈随征、归农、解散三策并自作檄文谕贼
    rationale: 知抚局必败，欲为善后留一线，文灿皆不从
  - date: 1638
    title_zh: 上戴治院、理按两院书，主以剿为抚
    rationale: 剿非败抚局，正所以济抚局；愿严军令，勿以抚废剿
- id: guji-王瑞楠-endeavor-3
  name_zh: 南明供职与从容殉节
  phases:
  - key: climax
    name_zh: 南渡授职，极陈有司虐民状
    labels:
      zh:
      - 太仆寺少卿
    start_date: 1645
    highlight_event_id: guji-王瑞楠-event-taipu
  - key: closure
    name_zh: 避降守节，生辰自缢殉国
    labels:
      zh:
      - 殉节
      - 忠节
    start_date: 1647
    highlight_event_id: guji-王瑞楠-event-death
  decisions:
  - date: 1645
    title_zh: 授太仆寺少卿，将用为湖广巡抚，旋告归
    rationale: 极陈有司虐民状，知事不可为而求退
  - date: 1646
    title_zh: 应唐王之召赴福建督理兵饷
    rationale: 故官仍之，欲效忠于南明残局
  - date: 1647
    title_zh: 温州不守，谕降不应，避之山中
    rationale: 不事二姓，守遗臣之节
  - date: 1647-06-17
    title_zh: 生辰日从容拜家庙、置酒高会后自缢，遗命五日而殓
    rationale: 以从容之死全忠节之志，恰五日殓，如其所遗命
events:
- id: guji-王瑞楠-event-birth
  title_zh: 王瑞楠生
  detail: 生年无考，永嘉人，先世旧居晏圣庙里
  type: birth
- id: guji-王瑞楠-event-jinshi
  date: 1625
  year_of: 1625
  title_zh: 登天启乙丑进士，授苏州推官兼理兑运
  detail: 调剂军民交兑，岁省浮费三万金，上官勒石著令；寻改河间推官，入为工部主事，转兵部职方员外郎
  type: career
- id: guji-王瑞楠-event-fuju
  date: 1638
  year_of: 1638
  title_zh: 张献忠谷城乞抚，瑞楠力谏熊文灿勿许
  detail: 谋于巡按林铭球、总兵左良玉欲执之；文灿固执抚局，瑞楠陈随征、归农、解散三策皆不从，乃自作檄谕献忠，并上书两院主剿抚并行
  type: political
- id: guji-王瑞楠-event-fanpan
  date: 1639
  year_of: 1639
  title_zh: 张献忠果反，留书于壁称不受献忠钱者惟郧襄道瑞楠一人
  detail: 献忠列具上官姓名及取贿岁月多寡，独不及瑞楠，由是名大著
  type: political
- id: guji-王瑞楠-event-dingyou
  date: 1639
  year_of: 1639
  title_zh: 以丁忧去职
  detail: 奔丧归，隐居墓门前
  type: personal
- id: guji-王瑞楠-event-taipu
  date: 1645
  year_of: 1645
  title_zh: 南渡授太仆寺少卿，将用为湖广巡抚
  detail: 极陈有司虐民状，旋告归；唐王继召赴福建仍故官，督理兵饷
  type: career
- id: guji-王瑞楠-event-death
  date: 1647-06-17
  year_of: 1647
  title_zh: 生辰日从容拜家庙置酒后自缢殉国
  detail: 闽地陷、温州不守，谕降不应；遗命五日而殓，及有司验视恰五日，后得通谥忠节
  type: death
