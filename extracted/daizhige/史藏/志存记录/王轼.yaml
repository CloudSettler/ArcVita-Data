    rationale: 大兵压境恐贼窥伺城池江口故分左右中后哨兼固守遥震以防声东击西而收齐攻之效
  - date: '1502-02-08'
    title_zh: 置排筏压贰笆躧水过江
    rationale: 贼恃江险拒守故设法造渡具出奇正用间谍以突破天险而长驱安南解围
  - date: '1503-04-08'
