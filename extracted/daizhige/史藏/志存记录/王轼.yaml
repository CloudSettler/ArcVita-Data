  dilemmas:
  - 大兵压境而贼据险分散若专攻一路则余贼窥伺城池盘江可虞
  - 土兵所得财物归己与官军纪验升赏之间若赏罚不明则军心易携
  - 渠魁授首之后胁从安插复业与残贼穷搜务尽之间若失当则后患复生
  lesson: 博采众论而分哨合击恩威并施而纪验严明方能一举荡平而长治久安
