  birth_date: 1592-11-28
  death_date: 1643-09-21
  era: 清初
  reign_ref: 天聪崇德
  archetype: 深谋待时之开国雄主
  dilemmas:
  - 燕京可取而难守，是速取以扬威还是解围以待天命
  - 汉官降将可用而可疑，是推心置腹还是严防钳制
  lesson: 不争一城之得失，以间伐谋，以恩收心，积小胜为大势
  summary_first_person: 吾自幼随父兄征伐，深知明虽大而政乱可待，吾不急攻燕京而围以慑之，不亲斩袁崇焕而间以去之，不鄙降将而师以用之，读金史而戒衣冠之变，割俎豆以存旧俗，凡所忍皆为后得，所施皆为远图
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%95%B8%E4%BA%AD%E6%9D%82%E5%BD%95.html
