endeavors:
- id: guji-皇太极-endeavor-1
  title_zh: 己巳伐明观兵燕京
  summary: 致书袁崇焕缓其备，假道科尔沁破喜峰口，围燕京而不强攻，以全师而还
  phases:
  - key: brewing
    name: 致书议和麻痹袁崇焕
    labels:
      zh: 示和缓敌
    start_date: 1629-08-01
    highlight_event_id: guji-皇太极-event-jisi-ruguan
  - key: breakthrough
    name: 假道蒙古突入关内
    labels:
      zh: 出奇突入
    start_date: 1629-10-01
    highlight_event_id: guji-皇太极-event-jisi-ruguan
  - key: climax
    name: 围燕匝月观兵不攻
    labels:
      zh: 围而不取
    start_date: 1629-11-01
    highlight_event_id: guji-皇太极-event-jisi-ruguan
  - key: closure
    name: 谒陵取遵化振旅而归
    labels:
      zh: 全师而还
    start_date: 1630-01-01
    highlight_event_id: guji-皇太极-event-fanjian-yuan
  decisions:
  - date: 1629-11-01
    title_zh: 燕京围而不攻
    rationale: 城坚难守易得难守，不如练旅待天命以图久远
  - date: 1630-02-01
    title_zh: 设间假纵杨监诛袁崇焕
    rationale: 宁远难拔皆因袁氏善守，借明帝猜忌除之胜于强攻
- id: guji-皇太极-endeavor-2
  title_zh: 纳降汉臣收孔耿洪承畴
  summary: 翻译三国辽金元史以通文治，亲迎孔耿设天佑兵，解裘衣洪承畴得引路人
  phases:
  - key: brewing
    name: 译书教国崇汉文治
    labels:
      zh: 文治蓄才
    start_date: 1630-05-01
    highlight_event_id: guji-皇太极-event-zhaoxiang-hongkong
  - key: breakthrough
    name: 招抚孔耿设天佑兵
    labels:
      zh: 招海岛来归
    start_date: 1633-06-01
    highlight_event_id: guji-皇太极-event-zhaoxiang-hongkong
  - key: climax
    name: 松山获洪解裘劝降
    labels:
      zh: 得引路人
    start_date: 1642-03-01
    highlight_event_id: guji-皇太极-event-zhaoxiang-hongkong
  - key: closure
    name: 明皮岛遂墟边备益固
    labels:
      zh: 版图益展
    start_date: 1642-08-01
    highlight_event_id: guji-皇太极-event-zhaoxiang-hongkong
  decisions:
  - date: 1633-06-01
    title_zh: 亲迎孔耿授都招讨印
    rationale: 海岛流离无归，厚赏结心可得其死力且空明皮岛
  - date: 1642-03-01
    title_zh: 亲往洪馆解貂裘相待
    rationale: 众将瞽目而行，需引路人以取中原，故屈尊纳贤
events:
- id: guji-皇太极-event-birth
  title_zh: 诞生于赫图阿拉
  date: 1592-11-28
  year_of: 1592
  description: 清太祖第八子，母孝慈高皇后叶赫纳喇氏，生而聪睿
- id: guji-皇太极-event-jisi-ruguan
  title_zh: 己巳自喜峰口入围燕京
  date: 1629-11-01
  year_of: 1629
  description: 先与袁崇焕书申和以缓备，假道科尔沁自洪山口入，抵燕围匝月，解围谒金太祖陵，下遵化四城而还
- id: guji-皇太极-event-fanjian-yuan
  title_zh: 设间使明磔袁崇焕
  date: 1630-03-01
  year_of: 1630
  description: 擒杨太监令鲍承先帐外诈语袁氏输诚，纵杨归而明庄烈帝疑杀袁崇焕
- id: guji-皇太极-event-zhaoxiang-hongkong
  title_zh: 收孔耿设天佑兵并降洪承畴
  date: 1642-03-01
  year_of: 1642
  description: 孔有德耿仲明来归即亲迎授印为天佑兵，松山破获洪承畴亲解貂裘致降，遂墟明皮岛
- id: guji-皇太极-event-death
  title_zh: 崩于盛京清宁宫
  date: 1643-09-21
  year_of: 1643
  description: 在位十七年，奠定入关基业，庙号太宗，谥文皇帝
