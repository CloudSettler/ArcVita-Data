    title_zh: 焚楼灭五诏
    rationale: 因五诏微弱而南诏浸强，借祭先会宴之机一举兼并诸诏
  - date: '0730'
    title_zh: 贿剑南节度使求并诏
    rationale: 求合五诏为一以得朝廷认可，使兼并合法化
  - date: 0739
    title_zh: 卜筑太和城
    rationale: 太和左洱水右苍山，山海之交形胜之地，宜为国都
events:
- id: guji-皮罗阁-event-birth
  date: '0700'
  year_of: 700
  type: birth
  title_zh: 皮罗阁生（约）
  description: 生年不详，约当唐武则天时期；父晟罗皮，南诏蒙氏世家。
- id: guji-皮罗阁-event-enthronement
  date: 0728
  year_of: 728
  type: fulfillment
  title_zh: 嗣立并受唐册封为云南王
  description: 玄宗开元十六年立，受唐册封为云南王，赐名归义。
- id: guji-皮罗阁-event-songminglou
  date: '0730'
  year_of: 730
  type: fulfillment
  title_zh: 松明楼火并五诏
  description: 因仲夏二十五日祭先之期建松明楼会五诏，宴醉后举火焚楼，五诏遂灭；复赂剑南节度使，朝廷许合五诏为一，尽有云南之地。
- id: guji-皮罗阁-event-defeat-tufan
  date: 0738
  year_of: 738
  type: fulfillment
  title_zh: 破吐蕃
  description: 既并五诏，因破吐蕃，然南诏自此渐为唐之边患。
- id: guji-皮罗阁-event-taihe-city
  date: 0739
  year_of: 739
  type: fulfillment
  title_zh: 筑太和城并迁都
  description: 卜太和形胜，左洱水右苍山，筑太和城，自蒙舍徙居之，立龙首、龙尾上下二关，连陷辽川、永昌、石鼓沙等地。
- id: guji-皮罗阁-event-fenggaiyi
  date: '0745'
  year_of: 745
  type: fulfillment
  title_zh: 遣孙凤伽异入朝
  description: 遣孙凤伽异入朝，唐授鸿胪少卿，妻以宗女，赐乐一部，南诏始有中国之乐。
- id: guji-皮罗阁-event-death
  date: 0748
  year_of: 748
  type: death
  title_zh: 皮罗阁卒
  description: 卒后子阁罗凤嗣立。
