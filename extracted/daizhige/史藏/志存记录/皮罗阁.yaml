person:
  qid: guji-皮罗阁
  name_zh: 皮罗阁
  names:
    zh: 皮罗阁
    en: Piluoge
  lifespan:
    birth:
      date: '700'
      precision: year
      is_circa: true
      raw: 生年不详，当唐武则天时期前期
    death:
      date: '748'
      precision: year
      is_circa: true
      raw: 卒年约在开元、天宝之际，子阁罗凤嗣
  birth_date: 约700年
  death_date: 约748年
  era: 唐玄宗时期
  reign_ref: 唐玄宗开元十六年（728）受唐册封为云南王
  archetype: 开疆奠基之主
  dilemmas:
  - 依附唐朝册封以求正统，却不得不武力兼并同族五诏
  - 以宴盟之计火并五诏，成大业而负信义之讥
  lesson: 借势与决断可以成事，然权谋之得亦埋下后世边患之因
  summary_first_person: 我蒙舍诏皮罗阁，受唐册封为云南王，赐名归义。趁五诏会祭之机建松明楼，火并诸诏，贿请剑南节度使得朝廷许并五诏为一，尽有云南之地，破吐蕃，筑太和城于苍山洱海之间，遣孙凤伽异入朝，使南诏始得中国之乐，为蒙氏霸业奠基。
  source_urls:
  - 滇载记（明·杨慎）
