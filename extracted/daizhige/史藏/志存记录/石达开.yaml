  dilemmas:
  - 与洪秀全相离后欲据江西自固而不得
  - 远征入川七年崎岖山谷、粮尽援绝
  lesson: 据地自固方能持久，流动作战终致覆亡
  summary_first_person: 我与洪秀全分离后，先想依托江西自保，不能自立，便转战浙、闽、湘、桂、滇、黔，辗转入蜀，崎岖山谷已七年。至由宁远渡大渡河时值水涨，改期次日，唐友耕防江之军已至，我粮尽，煮桑叶、杀马为食，终为土司岭承恩所擒。
