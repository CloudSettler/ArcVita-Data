events:
- id: guji-福康安-event-birth
  title_zh: 出生
  date: 1754
  year_of: 1754
  place_zh: 北京
  description_zh: 乾隆十九年生于富察氏家，大学士傅恒之侄
- id: guji-福康安-event-pingluan
  title_zh: 奉命为将军进剿林爽文
  date: 1787-09-01
  year_of: 1787
  place_zh: 北京至福建崇武
  description_zh: 乾隆五十一年冬林爽文作乱，天子命协办大学士嘉勇公福康安为将军统巴图鲁侍卫劲旅十余万进剿台湾
- id: guji-福康安-event-denglu
  title_zh: 自崇武放洋齐登鹿港
  date: 1787-12-08
  year_of: 1787
  place_zh: 鹿仔港口岸
  description_zh: 五十二年十月杪北风盛发，三军联樯数百艘漫海东来，一日齐登鹿仔港口岸，粮饷军装均保无虞
- id: guji-福康安-event-qinqu
  title_zh: 克日擒渠毁巢收复全台
  date: 1788-02-10
  year_of: 1788
  place_zh: 嘉义至全台
  description_zh: 军威大振所向披靡，克日擒渠毁巢收复全台，仰赖天后昭明护国庇民之功
- id: guji-福康安-event-jianmiao
  title_zh: 敕建鹿港天后宫砌基竖梁
  date: 1787-12-20
  year_of: 1787
  place_zh: 鹿港
  description_zh: 奉天子命崇德报功就鹿择地建庙，丁未腊月之吉砌基竖梁，费金一万五千八百圆赐帑一万一千余圆
- id: guji-福康安-event-rumiao
  title_zh: 奉像入庙告蒇厥工
  date: 1788-07-01
  year_of: 1788
  place_zh: 鹿港天后宫
  description_zh: 戊申六月间奉像入庙告蒇，总董事林振嵩输诚经理未敷之数，以垂不朽
- id: guji-福康安-event-death
  title_zh: 病逝军中
  date: 1796-07-02
  year_of: 1796
  place_zh: 甘肃
  description_zh: 嘉庆元年征剿川楚白莲教至甘肃病逝，谥文襄追封嘉勇郡王
