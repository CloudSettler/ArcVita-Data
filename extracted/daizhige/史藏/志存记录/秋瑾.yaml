    start_date: 1896-01-01
    highlight_event_id: guji-qiu-jin-event-endeavor-1-start
  - key: breakthrough
    name_zh: 东渡日本·入会结盟
    labels:
      zh: 负笈东瀛
    start_date: 1904-01-01
    highlight_event_id: guji-qiu-jin-event-endeavor-1-join
- id: guji-qiu-jin-endeavor-2
  name_zh: 创办《中国女报》与谋划浙皖起义
  summary: 归国后办报倡女权，主持大通学堂，联络会党，与徐锡麟约定浙皖同时起义。
  phases:
  - key: brewing
    name_zh: 创办《中国女报》
    labels:
