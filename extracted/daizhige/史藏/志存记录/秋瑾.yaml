  - key: closure
    name_zh: 轩亭就义
    labels:
      zh: 碧血千秋
    start_date: 1907-07-15
    highlight_event_id: guji-qiu-jin-event-death
  decisions:
  - date: 1904-01-01
    title: 决意东渡日本留学
    rationale: 目击国势阽危、女界黑暗，以为非出国求学、广结志士无以救国自救，遂典质钗环，只身赴日。
  - date: 1907-07-10
    title: 事泄后拒绝离校出走
    rationale: 谓革命要流血才会成功，且恐株连全校师生，甘以一身殉之，静候清兵。
events:
- id: guji-qiu-jin-event-birth
  date: 1875-11-08
  year_of: 1875
  title: 出生于福建厦门
  description: 秋瑾生于闽侯官宦之家（籍浙江山阴，今绍兴），父秋寿南时官福建。
- id: guji-qiu-jin-event-endeavor-1-start
  date: 1896-01-01
  year_of: 1896
  title: 嫁湘人王廷钧，居京期间读新学书报
  description: 依父母之命嫁湘潭王廷钧；后随夫宦居北京，得读新书报，慨然有澄清天下之志，自号鉴湖女侠。
- id: guji-qiu-jin-event-endeavor-1-join
  date: 1904-01-01
  year_of: 1904
  title: 东渡日本留学，投身革命团体
  description: 只身赴日留学，习语言、入青山实践女校，先后加入三合会、光复会，1905年入同盟会，任浙江主盟人。
- id: guji-qiu-jin-event-endeavor-2-paper
  date: 1907-01-14
  year_of: 1907
  title: 创办《中国女报》于上海
  description: 在上海创办《中国女报》，倡女权、鼓吹革命，撰发刊词，号召妇女起而救国。
- id: guji-qiu-jin-event-endeavor-2-uprising
  date: 1907-02-01
  year_of: 1907
  title: 主持绍兴大通学堂，联络会党谋浙皖起义
  description: 接办绍兴大通学堂，训练光复军，与徐锡麟约定皖浙同时举事；因事机泄露，起义未发而败。
- id: guji-qiu-jin-event-death
  date: 1907-07-15
  year_of: 1907
  title: 就义于绍兴轩亭口
  description: 清兵围大通学堂，秋瑾被捕，坚不吐实，仅书“秋风秋雨愁煞人”七字，次日（六月初六）就义于轩亭口，年三十三。
- id: guji-qiu-jin-event-legacy
  date: 1912-01-01
  year_of: 1912
  title: 民国建立后遗集与遗文传播
  description: 辛亥后《朝野新谭》等收录章太炎《秋瑾集》序、《红毛刀歌》及革命女士秋瑾遗文，烈士之名昭雪于天下。
