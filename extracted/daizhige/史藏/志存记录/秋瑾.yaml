  name_zh: 秋瑾
  names:
    zh: 秋瑾
    en: Qiu Jin
  lifespan:
    birth:
      date: 1875-11-08
      precision: day
      is_circa: false
      raw: 光绪元年十月初六日
    death:
      date: 1907-07-15
      precision: day
      is_circa: false
      raw: 光绪三十三年六月初六日
  birth_date: 1875-11-08
  death_date: 1907-07-15
  era: 清末民初
  reign_ref: 光绪
  archetype: 革命烈士·女权先驱（鉴湖女侠）
  dilemmas:
  - 家庭妻职与革命志业之两难：舍家别子东渡日本，以救国为先
  - 起义事泄后可走避而留守大通学堂，从容就义以醒国人
  lesson: 以身殉国，巾帼不让须眉；一腔热血勤珍重，洒去犹能化碧涛。
  summary_first_person: 我秋瑾，号竞雄，自称鉴湖女侠。生当清季，目击神州陆沉、女界沉沦，遂抛却闺阁，东渡求学，入同盟会，办《中国女报》，倡言女权与革命。归国后主持大通学堂，联络会党，谋浙皖起义。事泄，同志劝走，我不肯以一人之死累及他人，亦不愿苟活，遂端坐待捕。丁未六月初六，就义于绍兴轩亭口，年三十三。吾之血，愿为四万万同胞觉醒之代价。
  source_urls:
  - 《朝野新谭》甲编·章太炎先生《秋瑾集》序
  - 《朝野新谭》甲编·秋瑾遗诗拾遗《红毛刀歌》
  - 《朝野新谭》甲编·革命女士秋瑾遗文
  - 《朝野新谭》丁编·秋瑾
endeavors:
- id: guji-qiu-jin-endeavor-1
  name_zh: 东渡求学与投身革命
  summary: 冲破家庭束缚，赴日留学，加入光复会、同盟会，以文字与组织投身反清革命。
  phases:
  - key: brewing
    name_zh: 闺中愤世·立志救国
