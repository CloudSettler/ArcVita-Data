  decisions:
  - date: '1634'
    title_zh: 将兵至夔镇慑流贼
    rationale: 石砫女土司将兵至夔，蜀抚运米济师，贼知有备不敢攻，太平围解。
  - date: 1640-08
    title_zh: 力争争山夺险之策
    rationale: 邵捷春移其军近驻重庆，遣张令守黄泥洼，失地利；良玉断言此覆军之道，当争山夺险令贼不敢即我。
- id: guji-秦良玉-endeavor-2
  name_zh: 忠勤治军
  phases:
  - key: brewing
    name_zh: 治部严肃
    labels:
      zh:
      - 军纪
    start_date: '1634'
    highlight_event_id: guji-秦良玉-event-yuanjia
  decisions:
  - date: '1640'
    title_zh: 虽为妇人受国恩应死
    rationale: 冠带佩刀见按行营垒之官，左右男妾十余人仍能制其下、视他将加肃，自言受国恩应死，所恨与邵同死。
events:
- id: guji-秦良玉-event-birth
  type: birth
  date: ''
  year_of: ''
  description: 秦良玉生卒之年正史另有载，本篇未载，故不具。
- id: guji-秦良玉-event-death
  type: death
  date: ''
  year_of: ''
  description: 本篇未载其卒年。
- id: guji-秦良玉-event-yuanjia
  type: military
  date: '1634'
  year_of: '1634'
  description: 甲戌二月张献忠犯蜀，太平被攻，石砫女土司秦良玉将兵至夔，蜀抚刘汉臣运长寿之米顺流济师，贼知有备不敢攻，太平围解。
- id: guji-秦良玉-event-poluocai
  type: military
  date: 1640-05
  year_of: '1640'
  description: 庚辰夏五月，石砫女土官秦良玉大破罗汝才于夔州：汝才犯夔州，良玉师至乃去，邀之马家寨斩首六百级，追败于留马垭，又破之谭家坪、仙寺岭，夺大纛，擒渠副塌天等六人，贼走大宁。
- id: guji-秦良玉-event-yiyi-lunbing
  type: counsel
  date: 1640-08
  year_of: '1640'
  description: 按行营垒之陆逊之过秦，良玉冠带佩刀出见，为置酒，叹邵公不知兵，力陈移军近重庆、张令守黄泥洼已失地利，阁部驱贼入蜀，不及争山夺险而坐以设防，此覆军之道也。
- id: guji-秦良玉-event-shizhu-fumo
  type: military
  date: 1640-09
  year_of: '1640'
  description: 庚辰九月，张献忠陷大昌，总兵张令中流矢死，石砫军亦覆没。良玉先移兵重庆附近，终如所料覆败。
