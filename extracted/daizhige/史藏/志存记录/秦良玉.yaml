person:
  qid: guji-秦良玉
  name_zh: 秦良玉
  names:
    zh: 秦良玉
    en: Qin Liangyu
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: ''
      precision: unknown
