      raw: ''
  birth_date: ''
  death_date: ''
  era: 明末
  reign_ref: 崇祯
  archetype: 忠勇女将
  dilemmas:
  - 上官部署失当，从命则败军，抗争则忤上
  - 身为女土司受国恩，恨与庸帅同败偕亡
  lesson: 受国恩者当死国，但亦须争山夺险、据地利而战，不可坐守设防以致覆军。
  summary_first_person: 我是石砫女土司秦良玉，受国恩当以死报。张献忠、罗汝才犯蜀，我扼贼于夔门，大破罗汝才，斩其渠魁。然川抚邵公不知兵，移我军离险就渝，张令败亡，石砫军亦覆没。我知覆军之道而争之不得，唯叹所恨与邵同死耳。
endeavors:
- id: guji-秦良玉-endeavor-1
  name_zh: 扼守夔门抗贼
  phases:
  - key: brewing
    name_zh: 将兵至夔备贼
    labels:
