      is_circa: false
      raw: 汉武帝元光年间论婴弃市
  birth_date: ''
  death_date: '-131'
  era: 西汉
  reign_ref: 汉文帝、汉景帝、汉武帝
  archetype: 忠直失势之外戚重臣
  dilemmas:
  - 势位被夺时是否委曲求全以保身（拒与田蚡之势，不肯献城南田）
  - 妻子劝阻时是否独自赴死（「终不令灌夫独死，而婴独生」）
  lesson: 直道而行者虽显赫一时，一朝失势，难敌权幸构陷与宫闱之怒
  summary_first_person: 我窦婴，字王孙，乃孝文帝窦皇后从兄之子，因功封魏其侯，位至丞相，后免相失势。窦太后崩后我被疏薄，唯与太仆灌夫相知交结。田蚡为丞相，倚仗王太后之势强求我城南田，我不与，灌夫亦助我怒之，二人遂衔恨。及田蚡娶妻，太后诏列侯宗室皆往贺，灌夫使酒忤蚡，被缚论弃市。我不忍灌夫独死，上书具陈其事，与蚡于帝前互言短长。朝臣多直言我直，然太后震怒，田蚡又造作恶语闻上，天子虽知蚡不直，终为太后故论我死。我临刑骂曰：若死有知，必不独死。月余后田蚡遍体痛楚，见我与灌夫共笞之，遂死。
