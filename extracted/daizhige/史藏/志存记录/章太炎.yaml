person:
  qid: guji-章太炎
  name_zh: 章太炎
  names:
    zh: 章炳麟、章太炎
    en: Zhang Taiyan
  lifespan:
    birth:
      date: 1869
      precision: year
      is_circa: true
      raw: 未明载，据史实推约
    death:
      date: 1936
      precision: year
      is_circa: true
      raw: 未明载，据史实推约
  birth_date: '1869'
  death_date: '1936'
  era: 清末民国
  reign_ref: 光绪、宣统、民国
  archetype: 鸿儒狂士
  dilemmas:
  - 学问自负与政治锋芒难以两全，被袁世凯羁留京师
  - 个性特强流于偏执，人称「章疯子」，处世多遭忌
  lesson: 文章可横扫千军，然锋芒太露，自由亦要付出代价。
  summary_first_person: 我章太炎绩学雄文，音韵训诂自许极高，谈政治则眉飞色舞。癸丑入京因持论侃侃为袁世凯所忌，遭羁留三年，日在几案书「袁世凯」击之，曾痛哭欲出京，军警截留于车站，又大闹总统府。袁死后得释南旋，手钞秘本数十册蝇头小楷，皆汉魏以前文调，故作文渊雅古茂，有本原。
  source_urls:
  - 《近代名人轶事录》杏坡居士
