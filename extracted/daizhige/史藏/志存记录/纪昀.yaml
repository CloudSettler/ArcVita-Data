endeavors:
- id: guji-纪昀-endeavor-1
  title_zh: 总纂四库以成提要之学
  summary: 由翰林充纂修，综理四库全书，撰提要以辨源流得失，复以阅微草堂笔记寓劝戒于谐谈
  phases:
  - key: brewing
    name: 翰林养望积学待用
    labels:
      zh: 养望
    start_date: 1754-05-01
    highlight_event_id: guji-纪昀-event-birth
  - key: breakthrough
    name: 开馆纂修总其大成
    labels:
      zh: 开馆
    start_date: 1773-03-01
    highlight_event_id: guji-纪昀-event-siku
  - key: climax
    name: 提要告成衡鉴古今
    labels:
      zh: 衡鉴
    start_date: 1781-06-01
    highlight_event_id: guji-纪昀-event-siku
  - key: closure
    name: 以小说行劝戒之教
    labels:
      zh: 劝戒
    start_date: 1789-01-01
    highlight_event_id: guji-纪昀-event-siku
  decisions:
  - date: 1773-03-01
    title_zh: 受命任四库馆总纂
    rationale: 网罗遗籍非大手笔不能提纲挈领，故受命则以毕生精力系之
  - date: 1789-01-01
    title_zh: 托稗官小说寓劝戒
    rationale: 考据之书观者寡而志怪之书人人乐观，故即谐谈使言易入而教易行
- id: guji-纪昀-endeavor-2
  title_zh: 庙堂周旋以方便护持士林
  summary: 嘉庆间当实录议叙过优之议与科场外泄诗句之劾，皆以巧对自任其咎，化大事为小事以全众
  phases:
  - key: brewing
    name: 久直内廷得君信重
    labels:
      zh: 得信
    start_date: 1768-01-01
    highlight_event_id: guji-纪昀-event-siku
  - key: breakthrough
    name: 实录议叙巧譬解围
    labels:
      zh: 解围
    start_date: 1799-06-01
    highlight_event_id: guji-纪昀-event-shilu
  - key: climax
    name: 阅卷泄题自承书生习气
    labels:
      zh: 自任
    start_date: 1800-04-01
    highlight_event_id: guji-纪昀-event-yuejuan
  - key: closure
    name: 士林阴受其福而不自言
    labels:
      zh: 阴德
    start_date: 1801-01-01
    highlight_event_id: guji-纪昀-event-yuejuan
  decisions:
  - date: 1799-06-01
    title_zh: 以题主墓铭受币为喻
    rationale: 不辩议叙优否而陈己受润笔之常，使上自悟施恩先帝之理而不复深究
  - date: 1800-04-01
    title_zh: 自认漏泄以塞御史之奏
    rationale: 与其究外间传闻株连阅卷诸臣，不如自任书生吟哦之过使事寝而众安
events:
- id: guji-纪昀-event-birth
  title_zh: 纪昀生于直隶献县
  date: 1724-07-26
  year_of: 1724
  description: 雍正二年六月十五生于献县崔尔庄，少颖敏力学
- id: guji-纪昀-event-siku
  title_zh: 任四库全书馆总纂
  date: 1773-03-01
  year_of: 1773
  description: 四库馆开，以翰林充总纂，与陆锡熊等综理采辑校勘，撰四库全书总目提要
- id: guji-纪昀-event-shilu
  title_zh: 实录馆议叙事解
  date: 1799-06-01
  year_of: 1799
  description: 嘉庆间实录馆请议叙或言过优，上以问对，但言己受亲友题主墓铭厚币，上笑置不议
- id: guji-纪昀-event-yuejuan
  title_zh: 科场传闻事自任
  date: 1800-04-01
  year_of: 1800
  description: 考试差后外间传前十人诗句，御史密奏，上召问对，自言书生见佳作久吟哦或致泄漏，上含笑事寝
- id: guji-纪昀-event-death
  title_zh: 纪昀卒于京师
  date: 1805-03-14
  year_of: 1805
  description: 嘉庆十年二月十四卒于京师，谥文达，士林望若泰山北斗
