  - 考据论辨务求精核与提要劝戒务求易行之衡
  - 守直道以事君与行方便以全众之衡
  lesson: 考据至备后以小说谐谈寓劝戒，使人易入而善类得全
  summary_first_person: 余生于书香之家，少习经史，长充翰林，直书房，总纂四库，综提要之学，复以谐谈小说示劝戒，以方便护持士林，自谓毕生精力具在提要与护众二事而已
