      is_circa: false
      raw: 永乐中以罪诛
  birth_date: ''
  death_date: '1416'
  era: 明初（靖难至永乐）
  reign_ref: 明太宗（成祖）永乐
  archetype: 权幸酷吏
  dilemmas:
  - 觇上意以固宠，恃威而妄意不轨
  - 借职务勒索 Royal 宗室勋贵与富商，终以僭越获罪
  lesson: 以告密与阴谋起家者，亦常因权势骄盈、觊觎非分而族灭
  summary_first_person: 我纪纲由临邑书生叩马投效燕王，以善骑射、谙法家言、能伺人意向而得亲幸，掌锦衣卫亲兵与诏狱，势倾朝野，然骄纵不法、僭用乘舆之饰，事发被磔于市，夷三族。
endeavors:
