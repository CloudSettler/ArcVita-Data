    title_zh: 临邑叩马首请效燕王
    rationale: 见燕王起兵，投效以求富贵
  - date: '1410'
    title_zh: 谬射观兵试探朝臣
    rationale: 假与僚属串通射柳不中，察群臣纠劾与否，以测上意
events:
- id: guji-纪纲-event-birth
  event_type: birth
  date: ''
  year_of: ''
  title_zh: 生年不详
  description: 临邑书生，善骑射，颇谙法家言。
- id: guji-纪纲-event-join
  event_type: career_event
  date: '1399'
  year_of: '1399'
  title_zh: 叩燕王马首请效
  description: 燕王帅师度临邑，纪纲叩马首请效，王与语悦之。
- id: guji-纪纲-event-appointment
  event_type: career_event
  date: '1402'
  year_of: '1402'
  title_zh: 燕王即位擢掌锦衣
  description: 成祖即位，擢纲自忠义卫千户为都指挥佥事，治锦衣亲兵，复典治诏狱。
- id: guji-纪纲-event-abuse
  event_type: career_event
  date: ''
  year_of: ''
  title_zh: 恃权恣行、矫诏敛财
  description: 使腹心矫为诏下诸司，勒盐场盐，夺官舶牛车，拷掠大贾索赂，夺民人第舍庄宅，衣故王冠服呼万岁，僭饰如乘舆。
- id: guji-纪纲-event-death
  event_type: death
  date: '1416'
  year_of: '1416'
  title_zh: 下狱磔于市，夷三族
  description: 内官仇纲者发其罪，上令给事御史廷劾、按验有状，即日捕诛，磔于市，夷三族。
