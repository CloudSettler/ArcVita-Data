  decisions:
  - date: 1874-03-16
    title_zh: 白竿塘大会操演英法阵法
    rationale: 斗风开驶履险如夷以简士伍试轮船管驾，为防海先事之防
  - date: 1874-04-10
    title_zh: 润色化兵为勇条定八则练十二营
    rationale: 承平十年旧部散佚，非招致能战之士简练行伍不足御外侮
- id: guji-罗大春-endeavor-2
  title_zh: 台湾海防会办御倭与筹议开山开禁
  summary_zh: 因廖有富窜内山与日本借牡丹社事称兵琅峤，密疏请沿海设台购船布雷招三十营分驻台内，上谕促渡台会同沈葆桢潘霨筹设防理谕开禁
  phases:
  - key: brewing
