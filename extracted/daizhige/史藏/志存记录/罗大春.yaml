  title_zh: 上密疏陈日本狂悖通盘筹备
  date: 1874-06-29
  year_of: 1874
  place_zh: 厦门
  description_zh: 以倭踞牡丹社胁降十一社筑铁版屋，请沿海仿造炮台购铁甲船水雷，招六十营分统台内，厦门筑高崎巨坝以利神速，并约各国公使勒令退兵
- id: guji-罗大春-event-4
  type: career
  title_zh: 奉旨东渡抵台会办南北路设防
  date: 1874-08-02
  year_of: 1874
  place_zh: 台湾安平郡城
  description_zh: 六月十三奉旨驰赴台湾，七月二十自秀涂登靖远经厦门澎湖，二十二日次安平入郡谒沈葆桢潘霨，与镇道洋将议安平筑三合土炮台苏澳驻兵开禁事
