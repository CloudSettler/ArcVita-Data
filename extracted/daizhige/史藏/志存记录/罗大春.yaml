  decisions:
  - date: 1874-03-25
    title_zh: 主张问罪用兵渐招致疆理内山
    rationale: 番人窝留廖匪则师出有名，十年教训可使生番化熟贡赋可期，且绝日荷诱煽之机
  - date: 1874-05-16
    title_zh: 暂缓渡台先固内地通盘规画
    rationale: 苏澳仅一隅井底之蛙，固内地尚可兼顾苏澳，株守海角则全局失援
  - date: 1874-07-26
    title_zh: 奉旨决计东瀛会同督率淡水等处防兵
    rationale: 君命已下权衡缓急既定，当舍内地赴台以壮声援杜觊觎
