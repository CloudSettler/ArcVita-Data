  date: 1874-03-16
  year_of: 1874
  place_zh: 福州五虎口白竿塘洋面
  description_zh: 驾扬武率万年清伏波等十船，扬帆收帆操枪炮回合救火舢板登陆，演英法洋枪阵法至傍晚收队
- id: guji-罗大春-event-2
  type: career
  title_zh: 招健儿定练全闽十二营防海
  date: 1874-04-10
  year_of: 1874
  place_zh: 福建
  description_zh: 得日本违约称兵台南羽檄，遣人往江南招致曾历战阵健儿，润色化兵为勇八则，定练全闽制兵十二营
- id: guji-罗大春-event-3
