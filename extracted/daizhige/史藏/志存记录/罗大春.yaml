  birth_date: 1820
  death_date: 1885
  era: 清
  reign_ref: 同治
  archetype: 守疆经略型
  dilemmas:
  - 留守闽内通筹全局与远戍苏澳株守一隅之两难
  - 以口舌条约理论倭人与厚集兵威折服敌心之权衡
  - 内地根本未固与台湾声援亟须之间的缓急之辨
  lesson: 备而不用为上策，通筹全局、固内以壮外，方能寝狂谋而开边禁
  summary_first_person: 余忝提福建陆路军务，同治十三年会阅白竿塘十船，值牡丹社后倭兵窥台南，我密陈全局筹备，力主固闽内根本以兼顾全台，奉旨东渡会办台湾海防，深信生番可抚为我用，开禁疆理始绝逋逃之薮
  source_urls:
