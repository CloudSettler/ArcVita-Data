  title_zh: 平朱河法美两教大讧
  date: 1899-02
  year_of: 1899
  description: 朱河两教聚众千百械斗解息上揭蒙照会领事严谕教士朱河大安
- id: guji-罗迪楚-event-4
  title_zh: 镌职交卸回省陈情
  date: 1899-05
  year_of: 1899
  description: 五月闻旨镌职以性情浮燥不洽舆情去官交符下鄂沥陈公亏请弥
