  date: 1897-10
  year_of: 1897
  description: 光绪丁酉以南皮张公浏阳谭公檄权监利十月受事明年夏补是官
- id: guji-罗迪楚-event-2
  title_zh: 改章修江堤襄堤告成
  date: 1898-08
  year_of: 1898
  description: 改用乡夫修江堤四百里复原，又商筑潜境莲花寺溃堤种稻丰登
