  name_zh: 罗迪楚
  names:
    zh: 罗迪楚
    en: Luo Dichu
  lifespan:
    birth:
      date: 1855
      precision: year
      is_circa: true
      raw: 生年未详约同治年间四川犍为人
    death:
      date: 1905
      precision: year
      is_circa: true
      raw: 卒年未详光绪后卒
  birth_date: 1855
  death_date: 1905
  era: 清
  reign_ref: 光绪
  archetype: 循吏
  dilemmas:
  - 革券除弊欲清四十年积抗与豪蠹怨谤舆情不洽之困
  - 无款垫办四百里江堤欲改乡夫修堤与冒谤干疑之难
  - 洋教必立欲开门揖之弭祸与抑教伸民调和民教之衡
  lesson: 为吏当屏虚名求实济，以制度保民，虽孤往获谴亦不改其志
  summary_first_person: 吾犍为罗迪楚，光绪丁酉檄权监利，睹胡文忠制度慕唐忠愍所治，欲厘赋秸惠黎元，改乡夫修江堤，疏螺闸泄洪湖，理词讼治窝囤，立教堂平民教之争，革券弊起钱漕，反以性情浮燥去官，沥陈心迹，录为停琴余牍以志吾过
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%81%9C%E7%90%B4%E4%BD%99%E7%89%8D.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%81%9C%E7%90%B4%E4%BD%99%E7%89%8D.html
endeavors:
- id: guji-罗迪楚-endeavor-1
  title_zh: 监利堤防修守与螺闸疏浚
  summary: 丁酉大水后无款筹垫，改乡夫修江堤四百里，商筑潜境溃堤，修复里河堤百里，倡按亩疏螺山闸引河以泄洪湖
  phases:
  - key: brewing
    name: 受事审堤
    labels:
      zh:
      - 踏勘堤弊
    start_date: 1897-10
    highlight_event_id: guji-罗迪楚-event-1
  - key: breakthrough
    name: 改章修堤
    labels:
      zh:
      - 乡夫抵费
    start_date: 1898-01
    highlight_event_id: guji-罗迪楚-event-2
  - key: climax
    name: 疏闸泄湖
    labels:
      zh:
      - 万人疏河
    start_date: 1898-05
    highlight_event_id: guji-罗迪楚-event-3
  - key: closure
    name: 堤固功成
    labels:
      zh:
      - 堤闸并复
    start_date: 1899-03
    highlight_event_id: guji-罗迪楚-event-4
  decisions:
  - date: 1897-11
    title_zh: 改雇南夫为乡夫先期作工抵土费
    rationale: 冬工无款赊贷剥民，不如令民以力抵费，可复堤身又可杜豪民渔利
  - date: 1898-05
    title_zh: 谕导湖注江按亩起疏螺闸引河
    rationale: 湖水壅塞北水南灌，不疏无以拯百垸，按亩起夫则不敛费而成大利
  - date: 1898-08
    title_zh: 酌改里河旧章分段椗作宽估严朿
    rationale: 堤身漏薄拘窒难修，须明隐实剖旧章，方可支数十年无溃
- id: guji-罗迪楚-endeavor-2
  title_zh: 钱漕券弊革除与民教词讼绥靖
  summary: 严惩诡法厘定银券，征收逾往岁，平朱河法美教众械斗，立三教堂，以伸民抑教，息讼治匪
  phases:
  - key: brewing
    name: 到任厘讼
    labels:
      zh:
      - 清理讼狱
    start_date: 1897-10
    highlight_event_id: guji-罗迪楚-event-1
  - key: breakthrough
    name: 革券催科
    labels:
      zh:
      - 严惩诡法
    start_date: 1898-03
    highlight_event_id: guji-罗迪楚-event-2
  - key: climax
    name: 绥靖教争
    labels:
      zh:
      - 解息械斗
    start_date: 1899-02
    highlight_event_id: guji-罗迪楚-event-5
  - key: closure
    name: 去官陈情
    labels:
      zh:
      - 沥陈弥亏
    start_date: 1899-05
    highlight_event_id: guji-罗迪楚-event-4
  decisions:
  - date: 1898-03
    title_zh: 严惩书差诡法整顿征收
    rationale: 券取无制限隐抗殆半，不提纲洁领则官民俱困，虽招怨亦须渐剔
  - date: 1898-07
    title_zh: 缓立教堂先租民房后悬牌招众
    rationale: 民风强悍骤立必生事，不如渐引入教销祸于内，再伸民抑教以平民气
  - date: 1899-02
    title_zh: 寝朱河教案不上其实希功
    rationale: 聚众千人风闻易牵累好人，阴解散而禀销之，可保平安不蔓延成大案
