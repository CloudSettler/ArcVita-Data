    title_zh: 西陵救之不及后，务修德信以怀吴人
    rationale: 兵锋不利则易以攻为怀，以德信收吴人之心，为异日平吴张本
  - date: '272'
    title_zh: 不附权贵，直评王衍
    rationale: 谓此人必以盛名处当世大位，然败俗伤化者必此人也，不因权势而讳言
  - date: '273'
    title_zh: 饮陆抗所遗之酒不疑，馈药与之
    rationale: 与吴将陆抗推侨、札之好，以推心示信，时人以为华元、子反复见于今
