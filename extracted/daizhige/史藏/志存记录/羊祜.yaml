  birth_date: '221'
  death_date: 278-12
  era: 西晋
  reign_ref: 晋武帝司马炎（泰始、咸宁年间）
  archetype: 儒将·以德怀远的方面之臣
  dilemmas:
  - 西陵失利：泰始八年吴拔西陵，羊祜救之不及，归自江陵，遂改弦更张
  - 不附权贵：攻江陵之议中不肯阿附，招致王戎等权贵之怨
  lesson: 兵败之后不恃武力，务修德信，以信义怀柔敌国，终收不战之功
  summary_first_person: 我羊祜出镇荆襄，西陵一战救援不及而归，自此不务侥幸攻取，而修德信以怀吴人。陆抗遗我酒，我饮之不疑；抗有疾，我馈之药，彼亦推心服之。我不附权贵，敢以盛名处大位而败俗伤化者必为王衍之语直告于人。身后吴人闻之无不堕泪，平吴之日，朝廷追念我功，封我夫人夏侯氏为万岁乡君。
  source_urls:
  - https://zh.wikisource.org/wiki/晉陽秋_(輯本)
