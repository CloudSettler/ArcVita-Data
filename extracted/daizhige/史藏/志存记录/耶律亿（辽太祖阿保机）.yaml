- id: guji-耶律亿-event-bohai
  date: 0926
  year_of: 926
  title_zh: 亲征渤海，围忽汗城，大諲撰降
  description: 改渤海为东丹国，立太子倍为人皇王，置四相百官，一用汉法
- id: guji-耶律亿-event-death
  date: 0926
  year_of: 926
  title_zh: 崩于扶余府行宫，年五十五
  description: 有黄龙见城上入于行宫，以龙见之夕崩；后以扶余为黄龙府
