person:
  qid: guji-耶律亿
  name_zh: 耶律亿（辽太祖阿保机）
  names:
    zh: 耶律亿
    en: Yelü Yi (Abaoji)
  lifespan:
    birth:
      date: -872
      precision: year
      is_circa: true
      raw: 未载，崩于丙戌（926）年五十五推得
    death:
      date: 0926
      precision: year
      is_circa: false
      raw: 丙戌岁初秋崩于扶余府，年五十五
  birth_date: -0872
  death_date: 0926
  era: 唐末五代（唐天复四年即位）
  reign_ref: 辽太祖，在位二十年
  archetype: 开国雄主
  dilemmas:
  - 诸弟剌葛等数反，骨肉相残与国势稳定之两难
  - 汉法与契丹国制并存（南北面官）之制度抉择
  - 传位人皇王倍与大元帅德光之间终未决，埋下夺嫡祸根
  lesson: 开国之雄与让国之名，皆难敌身后诸子争立之患；制度立国，未必传心
  summary_first_person: 我耶律亿，字阿保机，以迭剌部夷离堇总知军国事，终膺推戴称帝。北收诸部入贡，南下掠幽蓟，东灭渤海改置东丹，立南北面官兼用唐制。临终预言丙戌秋初归处，果验于扶余黄龙府，我一生功业，亦随龙而逝。
  source_urls:
  - https://zh.wikisource.org/wiki/遼小史
