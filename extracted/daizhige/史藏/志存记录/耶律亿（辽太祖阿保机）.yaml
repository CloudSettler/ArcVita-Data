  date: 0907
  year_of: 907
  title_zh: 痕德堇可汗死，国人立耶律亿为皇帝
  description: 制如中国，是为辽太祖；时当五代之始，聘问不绝
- id: guji-耶律亿-event-revolt
  date: 0913
  year_of: 913
  title_zh: 诸弟剌葛等数反，追至榆河获之
  description: 缢杀辖底，赦诸弟；纳分迭剌部为二以弱其势之议
- id: guji-耶律亿-event-campaign
  date: 0916
  year_of: 916
  title_zh: 累以兵南略幽蓟，下州数十
