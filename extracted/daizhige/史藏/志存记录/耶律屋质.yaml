  name_zh: 耶律屋质
  names:
    zh: 耶律屋质
    en: Yelü Wuzhi
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  birth_date: ''
  death_date: ''
  era: 辽初（太宗至穆宗年间）
  reign_ref: 辽太宗、辽世宗、辽穆宗
  archetype: 社稷之臣／调停与平乱的谋主
  dilemmas:
  - 太后与永康王（世宗）兵戎相见，宗室内讧，和战两难
  - 察割弑逆篡位，身陷乱局，唯有智脱并速定讨贼之策
  - 察割有不臣之心，屡谏帝而不见信
  lesson: 排难解纷、临危不乱，以社稷为重化解骨肉相残
  summary_first_person: 我耶律屋质，先佐太后，遇太后与永康王隔潢河对峙，我持书往复，正色陈利害，掷筹而争，终使两主释怨罢兵，世宗得立。帝不信我言察割之奸，后果遭弑逆之乱，我易紫衣得出，亟召诸王，迎寿安王，迟明整兵围贼，卒诛察割而安社稷。
