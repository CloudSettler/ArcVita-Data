  birth_date: ''
  death_date: ''
  era: 五代至后晋时期（辽朝第二位皇帝）
  reign_ref: 辽太宗
  archetype: 开疆立制的草原雄主
  dilemmas:
  - 兄长人皇王耶律倍为嫡当立，太后属意于己，受让位后反生猜忌
  - 与石敬瑭约为父子、受燕云十六州，德威与扩张并存
  - 晋帝称孙不称臣，南下伐晋一度大败仅以橐驼得脱，雪耻与成败之间抉择
  lesson: 得中原易，守中原难；恃武而略德，虽入汴而终不能久居
  summary_first_person: 我是辽太祖第三子耶律德光，太祖在时当国掌兵。太后属意，兄长人皇王让位，我遂即皇帝位，是为辽太宗。我助石敬瑭败唐兵、册立大晋，得燕云十六州，中国益尊辽。后晋称孙不称臣，我大举南伐，曾败绩仅乘橐驼得归，耻之，再讨晋，杜重威以二十万众降，我入汴受百官朝，降封晋帝重贵为负义侯，始建国号大辽。然居汴四月即还，道中崩于高邑，年四十六。我身后中原州郡复归刘知远，而永康王阮（兀欲）即位于柩前，是为世宗。
  source_urls:
  - 《辽小史》明 杨循吉
