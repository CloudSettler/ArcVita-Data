  title_zh: 自沪乘驾时轮渡海赴基隆
  date: 1892-03-21
  year_of: 1892
  place_zh: 上海至基隆
  description_zh: 二月二十二日未正开轮，二十四日抵小基隆登岸，二十六日由沪尾至台北谒邵中丞及顾廉访
- id: guji-胡传-event-jinsha
  title_zh: 偕张经甫查龙潭堵金砂局
  date: 1892-04-15
  year_of: 1892
  place_zh: 八堵至龙潭堵
  description_zh: 乘火车至八堵换轿经煖煖碇内四脚亭宿龙潭堵，次日沿石碇溪至瑞芳苎子潭九芎桥而还
- id: guji-胡传-event-laojun
  title_zh: 赴大嵙崁阿姆坪劳军观合吻战
  date: 1892-04-07
  year_of: 1892
  place_zh: 大嵙崁至阿姆坪夹板山
  description_zh: 三月初九约陈实斋同行，初十至阿姆坪谒林荫堂，十一日冒雨进驻合吻观栋军与番接仗阵亡伤溺数人
- id: guji-胡传-event-xunyue
  title_zh: 巡阅安平旗后防营具申
  date: 1892-04-27
  year_of: 1892
  place_zh: 安平至旗后凤山
  description_zh: 随邵中丞南巡点靖海镇海二营及炮队练军，校靶赏全中者银钱，四月初二初十先后申报营务处
