person:
  qid: guji-胡林翼
  name_zh: 胡林翼
  names:
    zh: 胡林翼
    en: Hu Linyi
  courtesy_name_zh: 贶生
  art_name_zh: 润芝
  posthumous_name_zh: 文忠
  lifespan:
    birth:
      date: 1812-07-14
      precision: day
      is_circa: false
      raw: 嘉庆十七年六月初六
    death:
      date: 1861-09-30
      precision: day
      is_circa: false
      raw: 咸丰十一年八月（安庆报捷后数旬而薨）
  birth_date: 1812-07-14
  death_date: 1861-09-30
  era: 清
  reign_ref:
  - 道光
  - 咸丰
  archetype: 湘军统帅与湖北巡抚，中兴名臣
  dilemmas:
  - 权谋机警与至公无私之间的张力：既借多隆阿济急，又恐其骄而失众心
  - 用人至公与宗族戚党情面之间的取舍
  - 力荐叶兆兰而终见其误，荐贤之名与知人之难
  lesson: 大事如着棋，一子落盘全局胜负因之；谋之于豫、持之以恒，方能收其全功
  summary_first_person: 我以书生改官黔中，后抚湖北，整军理财、荐贤不遗余力；太湖之役奏派多隆阿总统诸军，坚持不撤安庆之围，卒克安庆、大定皖事，而我亦于报捷之后赍志而殁。
endeavors:
- id: guji-胡林翼-endeavor-1
  name_zh: 抚鄂整军与谋定安庆
  phases:
  - key: brewing
    name_zh: 驻黄州整军饷，兼筹粮运
    labels:
      zh:
      - 湖北巡抚
      - 黄州驻军
    start_date: 1855
    highlight_event_id: guji-胡林翼-event-1
  - key: breakthrough
    name_zh: 太湖之役奏派多隆阿总统诸军
    labels:
      zh:
      - 楚皖危急
      - 大破发捻
    start_date: 1860-02
    highlight_event_id: guji-胡林翼-event-2
  - key: climax
    name_zh: 注重安庆，坚持不撤围
    labels:
      zh:
      - 东南转机
      - 皖事大定
    start_date: 1860-05
    highlight_event_id: guji-胡林翼-event-3
  - key: closure
    name_zh: 报捷而薨
    labels:
      zh:
      - 赍志以殁
    start_date: 1861-09
    highlight_event_id: guji-胡林翼-event-death
  decisions:
  - date: 1857
    title_zh: 面斥族人请托，通饬用人至公
    rationale: 恐徇私结纳、风气一开伊于胡底，故记过示儆并通饬台局营员不得滥为汲引
  - date: 1860-02
    title_zh: 力排曾国藩之议，奏派多隆阿为总统
    rationale: 前敌无统率、号令不齐，而自驻英山后路势难前行，故假此济急，事定后行止在吾
  - date: 1860-05
    title_zh: 虽值淀园之变、汉黄之警，仍坚持不撤安庆之围
    rationale: 智深勇沉，一子落盘而全局胜负因之，谋之于豫、持之以恒
- id: guji-胡林翼-endeavor-2
  name_zh: 理财裕饷
  phases:
  - key: brewing
    name_zh: 饷银概发湘平
    labels:
      zh:
      - 厘金大宗
      - 湘平起自咸丰九年
    start_date: 1859
    highlight_event_id: guji-胡林翼-event-4
  - key: breakthrough
    name_zh: 银钱对放，暗益员勇
    labels:
      zh:
      - 微权
      - 俾无滋生弊端
    start_date: 1859
    highlight_event_id: guji-胡林翼-event-4
  - key: climax
    name_zh: 深入皖境，转运浩繁，粮台请改放银犹未许
    labels:
      zh:
      - 江船水次收放
    start_date: 1860
    highlight_event_id: guji-胡林翼-event-2
  - key: closure
    name_zh: 良法展转数手，渐成敝政之隐忧
    labels:
      zh:
      - 巨款成于积少成多
    start_date: 1861
    highlight_event_id: guji-胡林翼-event-death
  decisions:
  - date: 1859
    title_zh: 饷银概发湘平，所收库平每百申出三两六钱另储备拨
    rationale: 积少成多遂成巨款，且以钱易银徒为商贾谋利，不如暗益员勇、免生弊端
- id: guji-胡林翼-endeavor-3
  name_zh: 荐贤知人
  phases:
  - key: brewing
    name_zh: 遇四方之使必问人才，手折数十随笔记之
    labels:
      zh:
      - 博采慎取
      - 默具权衡
    start_date: 1855
    highlight_event_id: guji-胡林翼-event-1
  - key: breakthrough
    name_zh: 力荐叶兆兰，比之王阳明龙场
    labels:
      zh:
      - 天堂团练五营
    start_date: 1860
    highlight_event_id: guji-胡林翼-event-2
  - key: climax
    name_zh: 晚年专以荐贤为务，知人善任，海内交推
    labels:
      zh:
      - 荐主之地
    start_date: 1861
    highlight_event_id: guji-胡林翼-event-3
  - key: closure
    name_zh: 薨后左宗棠欲劾叶兆兰，曾国藩以稍留荐主之地劝止
    labels:
      zh:
      - 荐贤之名与身后之累
    start_date: 1862
    highlight_event_id: guji-胡林翼-event-death
  decisions:
  - date: 1856
    title_zh: 密揭两府请易鹤峰知州署员
    rationale: 审署州人材不足胜任，虽忤督府官文之情面，宁自称吾辈过而谢之
events:
- id: guji-胡林翼-event-birth
  year_of: 1812
  date: 1812-07-14
  title_zh: 胡林翼生
  date_precision: day
  person_refs:
  - guji-胡林翼
  summary_zh: 胡林翼生于湖南益阳，后为陶澍之婿，少年有公子、才子之目。
- id: guji-胡林翼-event-1
  year_of: 1857
  date: 1857
  title_zh: 黄州族人请托案
  date_precision: year
  person_refs:
  - guji-胡林翼
  summary_zh: 族人凭荐引赴前敌，文忠勃然，记银钱所委员之过，给归资遣族人，并通饬各台局营员用人秉公、不得徇情面。
- id: guji-胡林翼-event-4
  year_of: 1859
  date: 1859
  title_zh: 咸丰九年起饷银概发湘平
  date_precision: year
  person_refs:
  - guji-胡林翼
  summary_zh: 所收库平每百申出三两六钱另储备拨，银钱对放，暗益员勇薪资，理财之法冠出一时。
- id: guji-胡林翼-event-2
  year_of: 1860
  date: 1860-02
  title_zh: 太湖之役奏派多隆阿总统诸军
  date_precision: month
  person_refs:
  - guji-胡林翼
  summary_zh: 陈玉成纠合捻军十余万人围扰太湖诸军，文忠力排曾国藩之议，奏派多隆阿为总统，卒大破发捻于太湖潜山一带，皖事大定。
- id: guji-胡林翼-event-3
  year_of: 1861
  date: 1861-09-05
  title_zh: 安庆克复报捷
  date_precision: day
  is_circa: true
  person_refs:
  - guji-胡林翼
  summary_zh: 安庆之复为东南一大转机，曾国藩报捷疏推文忠之谋、多隆阿之勇；文忠尝言安庆若复，吾事毕矣。
- id: guji-胡林翼-event-death
  year_of: 1861
  date: 1861-09-30
  title_zh: 胡林翼薨
  date_precision: day
  is_circa: true
  person_refs:
  - guji-胡林翼
  summary_zh: 安庆报捷之后，文忠公薨，时人追思其志在天下、先几所触之言无不验者。
