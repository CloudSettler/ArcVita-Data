events:
- id: guji-胡舜申-event-birth
  title_zh: 出生
  date: 1090-01-01
  year_of: 1090
  description_zh: 约生于北宋末，为胡家子，侍父朝散，后与兄舜陟同居建康
- id: guji-胡舜申-event-1129-10
  title_zh: 随兄离建康赴两浙宣抚司
  date: 1129-10-01
  year_of: 1129
  description_zh: 兄胡舜陟与杜充不合，移为两浙宣抚司参谋，随周望守江，携金帛自平江至昆山梅里许浦
- id: guji-胡舜申-event-1129-12
  title_zh: 许浦从董旼入韩世忠军至镇江焦山
  date: 1129-12-01
  year_of: 1129
  description_zh: 虏犯平江望走青龙，董旼邀参谋以塞责，举家还船溯江至镇江，换船泊焦山杂于韩军中
- id: guji-胡舜申-event-1130-02
  title_zh: 寄寓焦山寺观韩军布阵
  date: 1130-02-01
  year_of: 1130
  description_zh: 居焦山方丈，日登山顶观世忠海船列阵江中及虏骑驰逐南岸焚甘露寺
- id: guji-胡舜申-event-1130-03
  title_zh: 虏别开河出江世忠塞闸无功
  date: 1130-03-01
  year_of: 1130
  description_zh: 世忠凿沈海船塞闸口，虏别开一河出江，焦山始知，诸军皆起碇惊走
- id: guji-胡舜申-event-1130-0317
  title_zh: 焦山大风脱险张帆南下
  date: 1130-03-17
  year_of: 1130
  description_zh: 三月十七日晚东北风大作，江船尽散，唯自家大船得存，次日乘南风自垂山过赣山江阴福山南奔，历平江吴江见城郭丘墟浮尸蔽水
- id: guji-胡舜申-event-1130-04
  title_zh: 至吴兴与弟侄团聚
  date: 1130-04-01
  year_of: 1130
  description_zh: 自垂山得风至平望吴兴，与先走吴兴之弟舜举侄仔相见，老幼俱安
- id: guji-胡舜申-event-1130-05
  title_zh: 遣使谢韩军并成避乱之录
  date: 1130-05-01
  year_of: 1130
  description_zh: 遣使臣以书信谢世忠董旼并送还二卒，取回寄军行李告敕，闻世忠舟师败于虏，追记陈思恭太湖击虏及虏用火箭破海船事成录
- id: guji-胡舜申-event-death
  title_zh: 逝世
  date: 1160-01-01
  year_of: 1160
  description_zh: 南宋初后卒，卒年不详，所著己酉避乱录流传以存建炎南渡之实
