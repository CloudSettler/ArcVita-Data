    title_zh: 日间相失复聚即清早出天宁门
    rationale: 鉴于日前拥挤失散趁启钥即行不使一见贼以遵天佑好为人之诫
  - date: '1862-01-01'
    title_zh: 不为乡人讳直书降贼者丑行
    rationale: 清者自清浊者自浊备举明经孝廉附贼侮圣杀人之事以劝戒来兹
events:
- id: guji-臧穀-event-birth
  title_zh: 出生
  date: '1833'
  year_of: 1833
  kind: birth
  description: 推算道光末年生于扬州年始冠时在咸丰三年
- id: guji-臧穀-event-refuge-shaodai
  title_zh: 遇警携仆避邵埭
  date: '1853-02-20'
  year_of: 1853
  kind: career
  description: 城南遇正白旗汉军书羲言贼将犯扬州是晚即携仆至邵埭幸免初陷之难
- id: guji-臧穀-event-first-fall
  title_zh: 扬州初陷流寓河东
  date: '1853-02-23'
  year_of: 1853
  kind: career
  description: 贼入扬州搜库帑劫囚狱驱民拜降余在河东见琦侯军至甘泉山贼撤队抗拒及五月攻城失利
- id: guji-臧穀-event-return
  title_zh: 城复归来见韩媪守屋
  date: '1853-11-01'
  year_of: 1853
  kind: career
  description: 十一月贼粮尽窜回瓜州城复随众归来遍访戚友不可得幸旧庐犹在见守屋韩媪道贼毁邻取之事
- id: guji-臧穀-event-second-escape
  title_zh: 丙辰陷前侍亲出天宁门
  date: '1856-02-29'
  year_of: 1856
  kind: career
  description: 侍先君暂居城中清明前日居民北趋相失复聚夜宿家中小憩清早由已开之天宁门偕出翌日贼三陷扬州知府世琨死之
- id: guji-臧穀-event-death
  title_zh: 逝世
  date: '1900'
  year_of: 1900
  kind: death
  description: 历旱蝗水患营勇之乱后辑劫余见闻成篇清末卒年未详
