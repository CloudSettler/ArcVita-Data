  - 从戎杀贼与遵从先君不许之两难
  - 恋栈危城与闻警即避邵埭之两难
  - 为乡人讳过与直书劝戒来兹之两难
  lesson: 幸存当好为人清者自清浊者自浊直书以劝戒来兹
  summary_first_person: 我是臧穀咸丰三年年始冠两应童子试不售拟弃文从戎先君不许二月二十日遇书羲示警是晚即携仆避邵埭亲历扬州三陷三复见贼踞城拜降男馆女馆之荼毒城复归来旧庐犹在故作此劫余小记以记见闻
