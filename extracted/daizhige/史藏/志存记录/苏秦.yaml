    start_date: 约-333
    highlight_event_id: guji-苏秦-event-4
  - key: climax
    name_zh: 佩相印过洛阳，一人大重于天下
    labels:
      zh: 前倨后卑 · 势位富贵
    start_date: 约-332
    highlight_event_id: guji-苏秦-event-5
  - key: closure
    name_zh: 从约瓦解，转仕燕齐
    labels:
      zh: 连鸡不能俱止于栖
    start_date: 约-320
    highlight_event_id: guji-苏秦-event-6
  decisions:
  - date: 约-337
    title_zh: 首说秦惠王以连横并吞天下
    rationale: 见秦地势形便、可称帝而治，欲以并诸侯、吞天下之策博取卿相之尊
  - date: 约-336
    title_zh: 夜发书得太公阴符之谋，引锥刺股自励
    rationale: 说人主不能出金玉锦绣、取卿相之尊，是学问未精，故期年揣摩乃成
  - date: 约-333
    title_zh: 转而倡合纵，说赵肃侯抑强秦
    rationale: 秦惠王不能用连横之策，而山东之国畏秦，合众弱以攻一强更易见功
- id: guji-苏秦-endeavor-2
  name_zh: 仕燕为反间，深入齐而亡其身
  phases:
  - key: brewing
    name_zh: 自燕入齐，厚齐以疲之
    labels:
      zh: 为燕间齐
    start_date: 约-300
    highlight_event_id: guji-苏秦-event-6
  - key: breakthrough
    name_zh: 得齐王信任，劝齐伐宋耗齐国力
    labels:
      zh: 阳为齐谋 · 阴为燕事
    start_date: 约-289
    highlight_event_id: guji-苏秦-event-6
  - key: climax
    name_zh: 反间之事渐泄，居齐日重而祸日深
    labels:
      zh: 忠诈两难
    start_date: 约-286
    highlight_event_id: guji-苏秦-event-6
  - key: closure
    name_zh: 车裂于齐，以死成燕
    labels:
      zh: 身死而燕强
    start_date: -284
    highlight_event_id: guji-苏秦-event-death
  decisions:
  - date: 约-300
    title_zh: 受燕昭王之命，以客卿之身入齐为反间
    rationale: 齐强而燕弱，欲报齐仇，唯有使齐西劳于宋、南疲于楚，为燕缓亡国之祸
events:
- id: guji-苏秦-event-birth
  date: 约-337
  year_of: -337
  title_zh: 苏秦生于东周洛邑
  description: 出身穷巷掘门、桑户棬枢之士，为东周洛阳人
- id: guji-苏秦-event-1
  date: 约-337
  year_of: -337
  title_zh: 始将连横说秦惠王，书十上而说不行
  description: 力陈秦天府之国可并诸侯吞天下，秦王以羽翼未丰辞之；黑貂之裘弊、黄金百斤尽，资用乏绝而去秦
- id: guji-苏秦-event-3
  date: 约-336
  year_of: -336
  title_zh: 归乡受困，引锥刺股发愤读书
  description: 归至家妻不下纴、嫂不为炊、父母不与言；乃夜发书得《太公阴符》之谋，读书欲睡引锥自刺其股，血流至足，期年揣摩乃成
- id: guji-苏秦-event-4
  date: 约-333
  year_of: -333
  title_zh: 说赵肃侯于华屋之下，封武安君受相印
  description: 抵掌而谈，赵王大悦，封武安君、受相印，革车百乘、黄金万溢以随其后，约从散横以抑强秦，苏秦相赵而关不通
- id: guji-苏秦-event-5
  date: 约-332
  year_of: -332
  title_zh: 将说楚王路过洛阳，父母郊迎、嫂蛇行匍伏
  description: 父母清宫除道郊迎三十里，嫂四拜自跪谢以季子位尊而多金；苏秦叹贫穷则父母不子、富贵则亲戚畏惧
- id: guji-苏秦-event-6
  date: 约-300
  year_of: -300
  title_zh: 自燕入齐，为燕行反间之策
  description: 燕昭王即位欲报齐仇，苏秦以客卿身份入齐事齐湣王，阳为齐谋伐宋以劳其国力，阴为燕图齐
- id: guji-苏秦-event-death
  date: -284
  year_of: -284
  title_zh: 反间事泄，死于齐
  description: 为燕间齐之事渐为齐人所觉，苏秦卒于齐，其谋反间终使燕得报齐之机
