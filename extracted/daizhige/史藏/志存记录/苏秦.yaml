person:
  qid: guji-苏秦
  name_zh: 苏秦
  names:
    zh: 苏秦
    en: Su Qin
  lifespan:
    birth:
      date: -337
      precision: decade
      is_circa: true
      raw: 约战国中期
    death:
      date: -284
      precision: year
      is_circa: false
      raw: 约前284年卒于齐
  birth_date: 约-337
  death_date: -284
  era: 战国
  reign_ref:
  - 赵肃侯
  - 秦惠文王
  - 燕昭王
  archetype: 纵横家 · 布衣卿相的策士
  dilemmas:
  - 首倡连横于秦而不见用，困顿归乡遭家人冷遇，是坚持游说还是废弃所学
  - 合纵既成、身佩相印之后，如何在一人之下、数国之间维持互不信任的联盟
  - 为燕昭王入齐为反间，忠信与欺诈、身名与事功不可两全
  lesson: 势位富贵可由困顿中奋起求得，但以诈谋立身者，终为诈谋所噬
  summary_first_person: 我苏秦出身穷巷，先以连横说秦而十上不行，归家时妻不下机、嫂不为炊；于是发愤读书，引锥刺股，期年揣摩乃成。再出而说赵，一举封武安君、受相印，约从散横以抑强秦，使山东六国相亲。及过洛阳，父母郊迎、嫂蛇行匍伏，我方叹贫穷则父母不子、富贵则亲戚畏惧。其后我为燕入齐为间，终死于齐人之手。
  source_urls:
  - https://zh.wikisource.org/wiki/戰國策/卷三
endeavors:
- id: guji-苏秦-endeavor-1
  name_zh: 发愤求学与合纵六国
  phases:
  - key: brewing
    name_zh: 困秦归乡，锥刺股苦读
    labels:
      zh: 悬梁刺股 · 揣摩《太公阴符》
    start_date: 约-336
