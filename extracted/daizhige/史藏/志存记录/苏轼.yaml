  decisions:
  - date: '1079-07-02'
    title_zh: 李定列可废之罪四状
    rationale: 权御史中丞李定谓轼怙终不悔、言伪而辨、行伪而坚，讪上骂下法所不宥，乞特行典宪
  - date: '1079-09-23'
    title_zh: 承认寄王诜讥讽文字
    rationale: 王诜申送开运盐河诗赋到官，隐讳不实，遂具实招供与王诜往来诗赋文字始末
events:
- id: guji-苏轼-event-birth
  date: '1037-01-08'
  year_of: 1037
  title_zh: 苏轼生于眉州眉山
  description: 案卷供状载本贯眉州眉山县，高祖祜、曾祖杲并不仕，祖序大理评事致仕，父洵霸州文安县主簿。
  endeavor_id: guji-苏轼-endeavor-1
- id: guji-苏轼-event-jinshi
  date: '1057'
  year_of: 1057
  title_zh: 嘉祐二年进士及第
  description: 供状称嘉佑二年进士及第，初任河南府福昌县主簿，未赴任间应中制科，授大理评事凤翔府签判。
  endeavor_id: guji-苏轼-endeavor-1
- id: guji-苏轼-event-hezhang
  date: '1079-03-27'
  year_of: 1079
  title_zh: 何大正札子垂拱殿进呈
  description: 太子中允权监察御史里行何大正劾湖州谢上表语，谓愚弄朝廷、妄自尊大，谤讪讥骂无所不为，并进呈镂板讥讽文字。
  endeavor_id: guji-苏轼-endeavor-2
- id: guji-苏轼-event-huzhou
  date: '1079-04-21'
  year_of: 1079
  title_zh: 知湖州到任
  description: 元丰二年四月二十一日到湖州任，未几谢上表语被台谏摘为讥切时事。
  endeavor_id: guji-苏轼-endeavor-1
- id: guji-苏轼-event-shuzhang
  date: '1079-07-02'
  year_of: 1079
  title_zh: 舒亶、李定札子崇政殿进呈
  description: 舒亶摘赢得儿童语音好、东海若知明主意等句，谓无一不以讥谤为主；李定列轼可废之罪四，乞付有司论如大不恭。
  endeavor_id: guji-苏轼-endeavor-2
- id: guji-苏轼-event-genkan
  date: '1079-07-03'
  year_of: 1079
  title_zh: 奉圣旨送御史台根勘
  description: 元丰二年七月三日进呈，奉圣旨后批四状并册子送御史台根勘闻奏，并降《元丰续添苏子瞻学士钱塘集》印行册子为证。
  endeavor_id: guji-苏轼-endeavor-2
- id: guji-苏轼-event-gongzhuang
  date: '1079-09-23'
  year_of: 1079
  title_zh: 御史台具实供状
  description: 因王诜申送开运盐河诗赋到官，轼自九月二十三日至二十七日方具实招，尽供与王诜往来诗赋及寄张方平、司马光、黄庭坚等讥讽文字始末。
  endeavor_id: guji-苏轼-endeavor-2
- id: guji-苏轼-event-death
  date: '1101-08-24'
  year_of: 1101
  title_zh: 苏轼卒
  description: 北宋元丰诗案后历经贬谪，建中靖国元年卒，年六十六。
  endeavor_id: guji-苏轼-endeavor-1
