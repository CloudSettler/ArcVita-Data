person:
  qid: guji-苏轼
  name_zh: 苏轼
  names:
    zh: 苏轼
    en: Su Shi
  lifespan:
    birth:
      date: '1037-01-08'
      precision: day
      is_circa: true
      raw: 景祐三年十二月十九；案卷供状称元丰二年年四十四岁
    death:
      date: '1101-08-24'
      precision: day
      is_circa: true
      raw: 建中靖国元年卒于常州
  birth_date: '1037-01-08'
  death_date: '1101-08-24'
  era: 北宋
  reign_ref: 嘉祐、熙宁、元丰
  archetype: 因文字获罪的文人直臣·新旧党争中的士大夫
  dilemmas:
  - 言事与事君：诗文讥切新法是尽言责还是讪上骂下
  - 仕与不仕：作《灵壁张氏园亭记》称不必仕不必不仕，被指教人无尊君之义
  - 守直与避祸：见新法病民，直言则得罪台谏，缄默则负所学
  lesson: 文字足以鼓动流俗，亦足以罗织成狱；士人处变法之世，直言与自全难两全。
  summary_first_person: 我苏轼，眉州眉山人，嘉祐二年进士及第，历官凤翔签判、杭州通判、密州、徐州、湖州知州。因谢上表与诗文讥切时事，元丰二年为台谏交章弹劾，七月三日奉旨送御史台根勘，是为乌台诗案。我初讳开运盐河诗，及王诜状送诗赋到官，九月下旬方具实招。
