  birth_date: 1771
  death_date: 1840-03-18
  era: 清
  reign_ref: 乾隆至道光
  archetype: 经世方志之臣
  dilemmas:
  - 边地初定而戍守与生聚难两全，既欲强干以御罗刹，又虑扰民而困转输
  - 朝堂典籍浩繁而边徼见闻易散，欲以纪述存边情，又惧文胜而失实用
  lesson: 记一城之建置物产风土，以存边防之实，使后人抚图即可知戍守抚绥之要
  summary_first_person: 吾英和，索绰罗氏，隶满洲正白旗，以进士起家，历枢曹，留心边徼，采齐齐哈尔将军衙署档册及耳目所及，撰卜魁纪略一卷，记城池官制兵备屯学山川物产，以备朝廷经略北疆之参考
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%8D%9C%E9%AD%81%E7%BA%AA%E7%95%A5.html
