endeavors:
- id: guji-英和-endeavor-1
  title_zh: 撰述卜魁纪略纪齐齐哈尔边制
  summary_zh: 考康熙至乾隆卜魁筑城设将军副都统始末，详户兵刑工四司炮局驿站水师屯仓诸制，兼记山川物产风俗贡道，以成边地志存之书
  phases:
  - key: brewing
    name: 留心北徼
    labels:
      zh:
      - 筹边
      - 搜访
    start_date: 1793
    highlight_event_id: guji-英和-event-jinshi
  - key: breakthrough
    name: 考定卜魁建置
    labels:
      zh:
      - 建置
      - 驻防
    start_date: 1805
    highlight_event_id: guji-英和-event-bukui
  - key: climax
    name: 纪成物产风土
    labels:
      zh:
      - 物产
      - 风土
    start_date: 1808
    highlight_event_id: guji-英和-event-bukui
  - key: closure
    name: 付传志存
    labels:
      zh:
      - 方志
      - 成书
    start_date: 1810
    highlight_event_id: guji-英和-event-bukui
  decisions:
  - date: 1805
    title_zh: 以官牍为纲参以见闻
    rationale: 卜魁去京绝远传闻易讹，故据将军衙门档册核城池兵额仓储驿站之数，再附见闻以补其阙
  - date: 1808
    title_zh: 详记驻防生产而不尚文饰
    rationale: 边要在于兵食足而器械利，故备载炮位弹药兵丁屯粮贡貂水师诸务，使可按籍而稽
- id: guji-英和-endeavor-2
  title_zh: 历仕枢曹主持文教政务
  summary_zh: 由翰林洊历内阁学士礼部户部尚书军机大臣协办大学士，典学政修水利纂典籍，以文治辅佐朝廷康雍乾以来之边政
  phases:
  - key: brewing
    name: 进士入翰林
    labels:
      zh:
      - 科第
      - 馆阁
    start_date: 1793
    highlight_event_id: guji-英和-event-jinshi
  - key: breakthrough
    name: 洊历部曹
    labels:
      zh:
      - 户部
      - 礼制
    start_date: 1800
    highlight_event_id: guji-英和-event-hubu
  - key: climax
    name: 参赞机务
    labels:
      zh:
      - 军机
      - 经略
    start_date: 1814
    highlight_event_id: guji-英和-event-hubu
  - key: closure
    name: 罢归著述
    labels:
      zh:
      - 致政
      - 存史
    start_date: 1838
    highlight_event_id: guji-英和-event-death
  decisions:
  - date: 1814
    title_zh: 主张节用而厚边储
    rationale: 以卜魁等处转输维艰，故请核兵额实仓储修屯学，使边饷有备而不糜国用
  - date: 1825
    title_zh: 兴文教以柔远人
    rationale: 边地久安在民知礼，故于齐齐哈尔黑尔根黑龙江设官学，令八旗佐领遣子入学肄业
events:
- id: guji-英和-event-birth
  date: 1771
  year_of: 1771
  title_zh: 生于京师索绰罗氏
  description: 乾隆三十六年生于京师，隶满洲正白旗，字树琴，号煦斋，少承家学，娴习清汉文
- id: guji-英和-event-jinshi
  date: 1793
  year_of: 1793
  title_zh: 登乾隆五十八年进士入翰林
  description: 登癸丑科进士，选庶吉士，授翰林院侍讲，始得与闻朝廷典籍边政
- id: guji-英和-event-bukui
  date: 1808
  year_of: 1808
  title_zh: 考定卜魁沿革撰成卜魁纪略
  description: 考康熙十五年谕罗刹归逋逃，三十年筑卜魁城设副都统，三十八年移将军驻扎设四司，及雍乾间增裁兵额设学置屯诸事，兼记嫩江山川寒暖物产贡貂诸俗，撰成一卷
- id: guji-英和-event-hubu
  date: 1814
  year_of: 1814
  title_zh: 授户部尚书参赞机务
  description: 洊历内阁学士礼部尚书，授户部尚书，入军机，协办大学士，主持清厘仓储兴修水利纂辑方志，以经世致用自任
- id: guji-英和-event-death
  date: 1840-03-18
  year_of: 1840
  title_zh: 卒于京师
  description: 道光十八年罢官归，二十年二月十五日卒于京师，年七十，谥文恪，所著卜魁纪略传于世
