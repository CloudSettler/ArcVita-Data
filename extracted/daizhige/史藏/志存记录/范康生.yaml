  decisions:
  - date: 1646-04-06
    title_zh: 力主弃舟再守，溯流赴虔
    rationale: 北军至皂口，诸军奔溃；余持张巡、许远守睢阳之义，谓"此非吾辈死所"，与万公等挽舟溯流抵虔，白督师安众心。
  - date: 1646-04-12
    title_zh: 持檄兼程赴南雄乞援
    rationale: 粤中新锐五千因饷哗于南雄，万公欲促之来援，命余往；四日抵南雄，向李永茂等哭秦庭，得吴之蕃、张国祚率师来援。
  - date: 1646-08-07
    title_zh: 间道复入虔州，领户、兵两曹
    rationale: 万公有手书以转饷弗给，命余领户、兵两曹事；念诸公久在虔劳苦，力辞谏垣之荐而返幕中。
  - date: 1646-10-23
    title_zh: 会审誓死不屈膝
    rationale: 刘别驾等哀词投诚，余与杨又如惟直陈国破家亡、自分当死，誓死不屈膝，终得宽释，因叹得死之难。
