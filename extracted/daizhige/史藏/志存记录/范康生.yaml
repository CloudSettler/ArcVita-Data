  name_zh: 范康生
  names:
    zh: 范康生
    en: Fan Kangsheng
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 不详（明末在世）
    death:
      precision: unknown
      is_circa: true
      raw: 不详
  era: 明末清初
  reign_ref: 南明·永历（丙戌年即1646年）
  archetype: 守城忠烈·幕僚遗臣
  dilemmas:
  - 守土死节与存身续史：虔城必陷之际力主持守，城破临危自期必死，被释后归乡续录信史以对文山
  - 迎扈根本与死守孤城：汀州变后主张相国、司马引兵迎扈，而督师誓与虔存亡，忠计两难
  lesson: 张目正色、置生死于度外者，虽陷万军之中，敌亦为之气夺；忠烈不在必死，而在临死不失其守。
  summary_first_person: 丙戌虔州被围，我与万公元吉诸公且守且战，持檄四出乞援；城陷被执，誓死不屈膝，会审得释，归而随笔实录，命名《仿指南录》，庶几无愧于文山。
