  summary_zh: 范康生生年不详，安福人，号讱轩氏，明中书舍人。
- id: guji-fankangsheng-event-ji-an-falls
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-03-24
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌三月二十四
  summary_zh: 吉安郡失守，余与督师万公元吉、都宪陈赓、兵曹王其宖议列栅张家渡，且守且战。
- id: guji-fankangsheng-event-zaokou-retreat
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-04-06
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌四月初六
  summary_zh: 北军至皂口，新威营先溃；余持睢阳死守之义，谓"此非吾辈死所"，与万公等挽舟溯流，初八抵虔州。
- id: guji-fankangsheng-event-nanxiong-aid
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-04-12
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌四月十二
  summary_zh: 余持檄兼程赴南雄乞援，四日即抵，向李永茂、周仕凤为秦庭之哭，得五百金犒师，吴之蕃、张国祚遂率师谕岭来援。
- id: guji-fankangsheng-event-reentry
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-08-07
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌八月初七
  summary_zh: 余间道复入虔州，时城外诸营不下四万余人；奉命领户、兵两曹事，力辞谏垣之荐。
- id: guji-fankangsheng-event-capture
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-10-04
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌十月初四
  summary_zh: 忠诚府（虔州）城陷，北军潜踰小南门而入；余整衣冠登屋以待，自期必死，张目正色叱北兵，被执而大获敬礼。
- id: guji-fankangsheng-event-trial
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-10-23
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌十月二十三
  summary_zh: 会审于乐安王府旧第，余与杨又如誓死不屈膝，直陈国破家亡、自分当死；当事宽喻甚至，竟不见杀。
- id: guji-fankangsheng-event-release
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-10-26
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌十月二十六
  summary_zh: 附刘平田舟以归，途中随笔实录，自附信史，命名《仿指南录》，庶几对文山而无愧。
- id: guji-fankangsheng-event-return-home
  person_id: guji-fankangsheng
  type: endeavor
  endeavor_id: guji-fankangsheng-endeavor-1
  date: 1646-11-07
  year_of: 1646
  precision: day
  is_circa: false
  raw: 丙戌十一月初七
  summary_zh: 返螺川，次早入西昌平山中，距家五百里不敢相闻；自跋《仿指南录》，以古之遗直自任。
- id: guji-fankangsheng-event-death
  person_id: guji-fankangsheng
  type: death
  precision: unknown
  is_circa: true
  raw: 不详
  summary_zh: 卒年不详，惟知丙戌（1646）虔城之变后尚存，撰《仿指南录》以志忠节。
