events:
- id: guji-范成大-event-birth
  title_zh: 出生吴郡
  date: 1126
  year_of: 1126
  description: 生于吴郡，后号石湖居士
  place_zh: 吴郡
- id: guji-范成大-event-departure
  title_zh: 离成都登舟
  date: 1177-06-23
  year_of: 1177
  description: 以淳熙丁酉五月二十九日戊辰离成都，泊舟小东郭合江亭下，自万里桥东下
  place_zh: 成都合江亭
- id: guji-范成大-event-meizhou
  title_zh: 下眉州会送客
  date: 1177-06-25
  year_of: 1177
  description: 发孥累舟下彭山眉州，游中岩慈姥岩，与送客班荆小饮
  place_zh: 眉州中岩
- id: guji-范成大-event-dujiangyan
  title_zh: 谒都江堰崇德庙
  date: 1177-06-26
  year_of: 1177
  description: 至永康军谒李冰父子崇德庙，观离堆伏龙，作诗刻石讽岁杀羊五万之滥
  place_zh: 永康军都江堰
- id: guji-范成大-event-qingcheng
  title_zh: 宿青城丈人观
  date: 1177-06-28
  year_of: 1177
  description: 入青城山宿丈人观，逢生辰禳祭，夜观岩上圣灯，登上清宫望大面雪山
  place_zh: 青城山
- id: guji-范成大-event-jiazhou
  title_zh: 至嘉州换舰
  date: 1177-07-05
  year_of: 1177
  description: 由眉经平羌至嘉州，登新舰治装，游凌云大像万景楼，馆于雪堂
  place_zh: 嘉州
- id: guji-范成大-event-emei
  title_zh: 登峨眉绝顶
  date: 1177-07-12
  year_of: 1177
  description: 单骑入峨眉，经白水普贤寺，冒寒登光相寺光明岩，祷大士丐晴
  place_zh: 峨眉山
- id: guji-范成大-event-wuchuanlu
  title_zh: 撰成吴船录
  date: 1177-12-01
  year_of: 1177
  description: 以东归所历山川祠庙风土笔录成书，分上下卷，记蜀吴道里
  place_zh: 江行舟中
- id: guji-范成大-event-death
  title_zh: 逝世
  date: 1193
  year_of: 1193
  description: 绍熙四年卒，谥文穆，遗文有石湖集及吴船录揽辔录等行记
  place_zh: 吴郡石湖
