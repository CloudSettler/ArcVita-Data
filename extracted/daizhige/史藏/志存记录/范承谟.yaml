  year_of: 1674
  type_zh: 事业事迹
  detail_zh: 范承谟任总督，駐守福建，网友为封疆大吏。
- id: guji-范承谟-event-endeavor-2
  date: 1674-03-15
  year_of: 1674
  type_zh: 事业事迹
  detail_zh: 康熙十三年三月十五日，耿精忠叛乱，以放炮为号，诱范承谟至第，随后将其与家属百余人隔别禁锢，福州知府王之仪等骂贼同日被杀，范承谟坚守臣节。
- id: guji-范承谟-event-death
  date: 1675-10-15
  year_of: 1675
  type_zh: 卒
  detail_zh: 康熙十五年八月十六夜，耿精忠于败局已定之际，将总督范承谟并其弟范承谱及家属尽杀死于狱中；范承谟以身殉节。
