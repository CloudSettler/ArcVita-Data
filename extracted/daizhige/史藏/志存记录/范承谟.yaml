  reign_ref:
  - 康熙
  archetype: 骂贼死节的封疆大吏
  dilemmas:
  - 面对耿精忠胁降，坚守臣节而遭监禁以致身死
  - 家属百余人俱被禁锢，保全性命与保全名节的两难
  lesson: 乱局之中，忠臣以死守节，虽囚戮而不改其志。
  summary_first_person: 我范承谟秉持臣节，当耿精忠据闽叛乱时，被诱至其第，宁死不从，与家眷百余人一同被禁锢，后于康熙十三年被杀害，以身殉国。
