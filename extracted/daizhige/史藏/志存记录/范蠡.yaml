  decisions:
  - date: -482
    title_zh: 奉命率师沿海溯淮以绝吴路
    rationale: 乘吴王夫差北上黄池与晋争长、国内空虚之机，断其归道，使吴首尾不能相顾。
  - date: -482
    title_zh: 与舌庸并进，败吴太子友于姑熊夷
    rationale: 先挫吴之储贰与郊甸之师，为越王中军溯江袭吴、入郛焚姑苏扫清障碍。
- id: guji-fanli-endeavor-2
  name_zh: 献策定战·审备之道
  phases:
  - key: brewing
    name_zh: 观吴之弊
    labels:
      zh:
      - 天占既兆
      - 人事又见
    start_date: -482
  - key: breakthrough
    name_zh: 廷对审备
    labels:
      zh:
      - 审备则可以战
      - 王称其巧
    start_date: -478
    highlight_event_id: guji-fanli-event-counsel
  - key: closure
    name_zh: 谋成吴亡
    labels:
      zh:
      - 笠泽三战三北
      - 越师围吴宫
    start_date: -478
  decisions:
  - date: -478
    title_zh: 进对“审备则可以战”
    rationale: 申包胥言战以知为先，我知守御之备审密不可攻入，方为可战之基，故以审备对，王曰巧。
  - date: -478
    title_zh: 赞成大戒兴师，防夺吴利
    rationale: 吴民既罢、大荒荐饥、囷鹿空虚，天与人征皆见，不可失其悛改之机，当起师以防夺其利。
events:
- id: guji-fanli-event-birth
  person_id: guji-fanli
  type: birth
  date: -536
  year_of: -536
  is_circa: true
  title_zh: 范蠡生于春秋末期
  description: 范蠡生于楚地，后仕越，为越王勾践股肱之臣。
- id: guji-fanli-event-cut-route
  person_id: guji-fanli
  type: endeavor
  date: -482
  year_of: -482
  title_zh: 范蠡率师沿海溯淮以绝吴路
  description: 吴王夫差北会晋定公于黄池，越王勾践命范蠡与舌庸率师沿海泝淮以绝吴王归路，败吴太子友于姑熊夷；越王乃率中军泝江袭吴，入其郛，焚其姑苏，徙其大舟。
- id: guji-fanli-event-counsel
  person_id: guji-fanli
  type: endeavor
  date: -478
  year_of: -478
  title_zh: 范蠡廷对献“审备则可以战”之策
  description: 越王勾践访五大夫问战，大夫蠡进对曰“审备则可以战”，王曰巧，谓其守御之备审密不可攻入，遂定大戒兴师伐吴之计。
- id: guji-fanli-event-lize-victory
  person_id: guji-fanli
  type: endeavor
  date: -478
  year_of: -478
  title_zh: 越师笠泽大破吴师
  description: 越王中分其师为左右军，夜半衔枚涉江鸣鼓以惑吴师，中军潜涉袭攻，吴师大北，三战三北，越师遂入吴国，围吴王宫于姑苏。
- id: guji-fanli-event-death
  person_id: guji-fanli
  type: death
  date: -448
  year_of: -448
  is_circa: true
  title_zh: 范蠡卒
  description: 相传范蠡功成之后泛舟五湖，后卒，约在战国初年。
