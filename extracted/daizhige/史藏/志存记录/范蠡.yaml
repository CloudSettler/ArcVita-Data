person:
  qid: guji-fanli
  name_zh: 范蠡
  names:
    zh: 范蠡
    en: Fan Li
  lifespan:
    birth:
      date: -536
      precision: year
      is_circa: true
      raw: 约春秋末期生
    death:
      date: -448
      precision: year
      is_circa: true
  birth_date: 约公元前536年
  death_date: 约公元前448年
  era: 春秋末期
  reign_ref: 越王勾践之世
  archetype: 谋国能臣·功成不居
  dilemmas:
  - 国仇未雪与民生凋敝之间，如何择时兴师伐吴
  - 深受重用之际，是否直言审备之策以定军心
  lesson: 伐国之道，审备为先；知进知退，方能持盈保身。
  summary_first_person: 我范蠡事越王勾践，吴王北会黄池之时，我奉命与舌庸率师沿海溯淮，绝吴归路，败吴太子于姑熊夷，遂使越师袭入吴郛。及吴王还国，大夫种倡谋，勾践遍问五大夫，我进对以“审备则可以战”，王称其巧。夫战者，知为始，仁次之，勇次之，而守御审密、不可攻入，乃胜敌之本。我以谋略佐越，终倾强吴。
  source_urls:
  - https://zh.wikisource.org/wiki/國語/吳語
