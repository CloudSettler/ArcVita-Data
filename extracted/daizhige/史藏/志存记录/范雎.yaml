    title_zh: 匿名张禄，冒死直谒秦昭王
    rationale: 秦有太后、穰侯专权之弊，唯有上书直言远近攻取之序，方能取信于王。
  - date: -266
    title_zh: 建议昭王收权，逐穰侯魏冉于关外
    rationale: 穰侯越韩魏而攻齐，非计之善；强内则王权固，近攻则地可得。
