    highlight_event_id: guji-fanju-event-peace
  decisions:
  - date: -260
    title_zh: 阴遣人持金反间于赵
    rationale: 廉颇坚壁不出，秦师老于外；必使赵易将，方可破敌。
  - date: -259
    title_zh: 纳苏代之说，许赵和而罢兵
    rationale: 既惧白起功高，亦欲存秦力、收赵地，遂听韩赵之请而罢兵。
