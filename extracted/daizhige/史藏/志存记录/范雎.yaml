person:
  qid: guji-fanju
  name_zh: 范雎
  names:
    zh: 范雎
    en: Fan Ju
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 不详
    death:
      date: -255
      precision: year
      is_circa: true
      raw: 约前255年
  death_date: -255
  era: 战国
  reign_ref: 秦昭襄王
  archetype: 纵横策士·远交近攻的谋略家
  dilemmas:
  - 以客卿之身直谏秦昭王，须冒触怒宣太后与穰侯之险
  - 报魏齐之仇与顾全秦赵大局之间的恩怨权衡
  - 功成之后激流勇退，让位于蔡泽以保身
  lesson: 王天下者须明远近之序——远交以孤敌，近攻以广地；谋士亦当知进退有时。
  summary_first_person: 我范雎，魏人也。早年遭须贾、魏齐构陷，几死，化名张禄入秦。我以远交近攻之策说秦昭襄王，得拜为相，助王逐穰侯、废太后而亲政。长平之战，我用反间计使赵以赵括代廉颇，秦遂大破赵。然我终感谗恩之累，荐蔡泽自代，谢病归相印，得以善终。
  source_urls:
  - https://zh.wikisource.org/wiki/戰國策/卷三
  - https://zh.wikisource.org/wiki/戰國策/卷六
