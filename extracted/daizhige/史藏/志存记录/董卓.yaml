events:
- id: guji-董卓-event-birth
  type: birth
  summary: 董卓出生，临洮人，父君雅曾任颍川纶氏尉。
- id: guji-董卓-event-campaign-qiang
  type: endeavor
  summary: 董卓数讨羌胡，前后百余战。
- id: guji-董卓-event-meet-emperor
  type: endeavor
  date: 189
  year_of: 189
  summary: 董卓将步骑数千于北芒阪下迎少帝与陈留王，辱斥崔烈，自陈留王怀中取王，权势始张。
- id: guji-董卓-event-depose
  type: endeavor
  date: 189
  year_of: 189
  summary: 董卓于显阳苑议废立，斥袁绍，遂策废太后及少帝（史侯），另立陈留王为皇帝，太后迁永安宫其夜崩。
- id: guji-董卓-event-kill-hongnongwang
  type: endeavor
  date: 190
  year_of: 190
  summary: 董卓闻关东州郡谋举兵，恐以弘农王为主，遣兵迫守致药，弘农王及唐妃皆薨。
- id: guji-董卓-event-meiwu
  type: endeavor
  summary: 董卓于郿城筑坞积金二三千斤、银八九万斤，珠玉锦绮山积；封亲族侯者，孙女白为渭阳君，筑坛授印绶。
- id: guji-董卓-event-assassination-attempt-warning
  type: endeavor
  date: 192
  year_of: 192
  summary: 有道士书“吕”字示卓，卓不悟为吕布；入朝时马踬不前，吕布劝行，卓衷甲而入。
- id: guji-董卓-event-death
  type: death
  date: 192-04-23
  year_of: 192
  summary: 四月二十三日吕布刺杀董卓；尸暴于市，膏流浸地，守尸吏燃其脐为灯；弟旻、宗族在郿者皆被斫射，母年九十亦被斩；袁氏门生故吏焚董氏尸，后故部曲收灰一棺葬于郿。
