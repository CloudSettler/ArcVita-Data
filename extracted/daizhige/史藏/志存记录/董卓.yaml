person:
  qid: guji-董卓
  name_zh: 董卓
  names:
    zh: 董卓
    en: Dong Zhuo
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 生年不详，临洮人
    death:
      date: 192-04-23
      precision: day
      is_circa: false
      raw: 四月二十三日为吕布所杀
  death_date: 192-04-23
  era: 东汉末年
  reign_ref: 汉灵帝、汉少帝、汉献帝时期
  archetype: 乱世权奸
  dilemmas:
  - 废立之权与汉室存续之争
  - 亲族封赏与民心背离之抉择
  lesson: 专权暴虐、逆天下而行者，纵积金玉如山，终致身死族灭
  summary_first_person: 我董卓数讨羌胡，以强兵入洛，行废立、酖弘农王，封亲族、筑郿坞积金玉，逞凶暴虐，终为吕布所刺，尸暴于市，宗族尽灭。
  source_urls:
  - https://zh.wikisource.org/wiki/漢末英雄記
