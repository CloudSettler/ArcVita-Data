endeavors:
- id: guji-蒋师辙-endeavor-1
  title_zh: 台游襄幕与水利方志著述
  summary_zh: 光绪十八年应台抚邵友濂聘由津杭海赴沪候轮东渡主章奏览海防形胜遂成江苏水利海塘图书及临朐鹿邑二志
  phases:
  - key: brewing
    name: 侍亲苦学撰述之基
    labels:
      zh: 侍亲立学
    start_date: 1864
    highlight_event_id: guji-蒋师辙-event-birth
  - key: breakthrough
    name: 应聘台抚买舟南下
    labels:
      zh: 赴台襄幕
    start_date: 1892-03-05
    highlight_event_id: guji-蒋师辙-event-taiwan
  - key: climax
    name: 察海防水利著述水利海塘图书
    labels:
      zh: 水利著述
    start_date: 1892-04-01
    highlight_event_id: guji-蒋师辙-event-taiwan
  - key: closure
    name: 修临朐鹿邑志寓振祓之义
    labels:
      zh: 方志寄义
    start_date: 1895
    highlight_event_id: guji-蒋师辙-event-taiwan
  decisions:
  - date: 1892-03-05
    title_zh: 感伯乐而赴台艰险不辞
    rationale: 仕以行道不计海外瘴疠淫佚欲谙世务展所学
  - date: 1892-04-01
    title_zh: 以土地水利为治本而专攻其书
    rationale: 水利亡则衣食绌人心坏外患极故抉网维修志以振之
- id: guji-蒋师辙-endeavor-2
  title_zh: 四易州任勤民循治
  summary_zh: 光绪二十五年后权寿州移凤阳调桐城真授无为除团练之扰减赔款之捐革车头买票签点之弊听讼平恕捍淮祷雨七月而殁民罢市巷哭
  phases:
  - key: brewing
    name: 援例知州礼下于大吏
    labels:
      zh: 起家知州
    start_date: 1899
    highlight_event_id: guji-蒋师辙-event-shouzhou
  - key: breakthrough
    name: 寿凤却扰宽捐
    labels:
      zh: 寿凤惠政
    start_date: 1899
    highlight_event_id: guji-蒋师辙-event-shouzhou
  - key: climax
    name: 桐城革车头平讼抑请托
    labels:
      zh: 桐城听断
    start_date: 1902
    highlight_event_id: guji-蒋师辙-event-tongcheng
  - key: closure
    name: 无为勤断革漕费以死殉民
    labels:
      zh: 无为殉民
    start_date: 1903
    highlight_event_id: guji-蒋师辙-event-wuwei
  decisions:
  - date: 1899
    title_zh: 寿州办团敛财则持不行
    rationale: 民情安堵团丁游手敛财必扰免扰则无后患
  - date: 1901
    title_zh: 凤阳赔款取诸官商不困农氓
    rationale: 民苦凋疗已久取诸民不如取诸官减亩捐之半自任乖政体之责
  - date: 1902
    title_zh: 去桐逸囚据实上报不伪饰
    rationale: 生无欺人语伪而苟禄不如诚以去官不欺君上
events:
- id: guji-蒋师辙-event-birth
  title_zh: 出生于上元
  date: 1847
  year_of: 1847
  description: 先世溧阳高祖迁上元父永龄为沾化知县以廉负逋侍父病风痫六年不离侧
- id: guji-蒋师辙-event-taiwan
  title_zh: 买舟赴津杭海候轮赴台
  date: 1892-03-05
  year_of: 1892
  description: 光绪十八年二月初六买舟赴津门应台抚邵友濂聘主章奏经沧州天津大沽烟台抵沪候轮东渡记沿途形胜掌故
- id: guji-蒋师辙-event-shouzhou
  title_zh: 权寿州移凤阳宽团练减赔捐
  date: 1899
  year_of: 1899
  description: 权寿州值拳匪乱持不行敛财办团移凤阳裁驿费建马棚抗言赔款取诸官自减亩捐倾囊足之檄为行省法邻蝗而凤不灾
- id: guji-蒋师辙-event-tongcheng
  title_zh: 调桐城革车头平讼去任
  date: 1902
  year_of: 1902
  description: 革赣饷挽送车头之弊使村保轮应省费十七八听讼温颜任言不轻扑人据契谱图昭穆断茔讼扼于绅请托以去逸囚据实不欺
- id: guji-蒋师辙-event-wuwei
  title_zh: 真授无为勤治革漕费
  date: 1903
  year_of: 1903
  description: 真授无为悉窒蠹孔杜买票签点卖灾欠奏销如额重门洞开讼入即决亲验命案不株连盛雨督堤徒行泥淖革漕费万金
- id: guji-蒋师辙-event-death
  title_zh: 卒于无为州任上民巷哭立祠
  date: 1904-03-27
  year_of: 1904
  description: 在无为七阅月以劳致疾卒年五十八罢市三日白衣送葬数万人请最事迹入史馆立传祠于朱南宫侧
