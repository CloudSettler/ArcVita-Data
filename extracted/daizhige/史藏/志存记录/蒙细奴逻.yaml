    title_zh: 遵五常祭西耳河以息灾
    rationale: 以种瑞木压耳声，以牲牢享河神，求五谷丰盈万姓无灾
events:
- id: guji-蒙细奴逻-event-birth
  date: 0629
  year_of: 629
  title_zh: 奇王生于贞观三年
  description: 贞观三年己丑岁，奇王蒙细奴逻始生，后为南诏开国之始
- id: guji-蒙细奴逻-event-1
  date: 408
  year_of: 630
  title_zh: 浔弥脚梦讳送耕饭三遇梵僧
  description: 浔弥脚梦讳送耕饭至路中及巍山顶，再逢梵僧坐石上，左朱鬃白马右白象并青沙牛，再亦施之
- id: guji-蒙细奴逻-event-2
  date: 408
  year_of: 630
  title_zh: 巍山顶受记奕叶相承
  description: 梵僧授记云鸟飞三月之限树叶如针之峯奕叶相承为汝臣属，梦讳呼奇王蒙细奴逻等往看，唯见五色云中圣化捧钵升空，石上留圣迹衣迹及象马牛踪
- id: guji-蒙细奴逻-event-3
  date: 410
  year_of: 632
  title_zh: 定圣祭化俗设教开疆
  description: 观精专授记龙飞九五，示铁杖金镜，叙宗祧启轨仪，现天兵十二骑助国，遵五常开疆辟土，定每年二月十八日施麦饭奉玄彩祭之
