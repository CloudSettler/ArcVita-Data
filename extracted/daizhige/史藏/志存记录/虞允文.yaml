person:
  qid: guji-虞允文
  name_zh: 虞允文
  names:
    zh: 虞允文
    en: Yu Yunwen
  lifespan:
    birth:
      date: '1110'
      precision: year
      is_circa: true
      raw: ''
  birth_date: '1110'
  era: 南宋
  reign_ref: 绍兴
  archetype: 文臣督军、临危统帅
  dilemmas:
  - 词臣本不当遣，然因谙军事被命参谋军事，赴江淮督战
  - 旧将王权已罢、新将李显忠未至，是否以朝廷参谋之身督军死战
  lesson: 临危不退，以东.spi文臣之身激励溃军，遂成采石大捷
  summary_first_person: 我是虞允文，本为词臣，因谙军事奉命参谋江淮军马。金主完颜亮大兵临采石，旧将王权已罢、新将未至，我不肯引退，犒军誓师，率诸将布阵逆战，遂有采石大捷，又追射敌舟、焚其余船，敌兵自溃，完颜亮为部下所杀。
  source_urls:
  - 九华集卷二十五·绍兴采石大战始末
