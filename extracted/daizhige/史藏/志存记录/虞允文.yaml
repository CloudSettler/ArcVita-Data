  decisions:
  - date: '1161-11-08'
    title_zh: 不退而犒军督战
    rationale: 朝廷差遣在此，事败至此当进不当退，遂誓师激励诸军死战
  - date: '1161-11-08'
    title_zh: 归师勿遏
    rationale: 诸将欲断敌归路，允文以我军少、明日无以为继，仅以强弩袭其后
  - date: '1161-11-09'
    title_zh: 守杨林河口焚敌余舟
    rationale: 前此失策放敌船出，今命盛新驻船江心，无令一船得出岸
events:
- id: guji-虞允文-event-birth
