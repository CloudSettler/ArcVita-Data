  year_of: 1161
  event_type: endeavor
  endeavor_id: guji-虞允文-endeavor-1
  phase_key: brewing
  title_zh: 奉命参谋军事，随叶义问督视江淮军马
  description: 十九日上命叶枢密义问督视江淮军马，因命虞侯参谋军事，二十二日出临安。
- id: guji-虞允文-event-caishi-battle
  date: '1161-11-08'
  year_of: 1161
  event_type: endeavor
  endeavor_id: guji-虞允文-endeavor-1
  phase_key: breakthrough
  title_zh: 采石之战大破金兵
  description: 王权已罢、李显忠未至，允文犒军誓师，与张振、王琪、时俊等列阵待敌，时俊先登，斩敌过半，江中敌死以万数，计岸上尸二千七百余。
- id: guji-虞允文-event-yanglin
  date: '1161-11-09'
  year_of: 1161
  event_type: endeavor
  endeavor_id: guji-虞允文-endeavor-1
  phase_key: climax
  title_zh: 守杨林河口，焚敌舟一百八十余，完颜亮遁
  description: 命盛新引船驻江心，齐力射敌，敌自焚余舟，官军亦以火船焚其余舟一百八十余只，亮陆遁去。
- id: guji-虞允文-event-guazhou
  date: '1161-11-23'
  year_of: 1161
  event_type: endeavor
  endeavor_id: guji-虞允文-endeavor-1
  phase_key: closure
  title_zh: 移军京口、措置瓜州
  description: 与李显忠商量移时俊军于马家渡，分李捧军一万六千人、戈船百艘来会京口习水战，后同杨存中、成闵渡江至瓜州措置。
- id: guji-虞允文-event-death
  era: 南宋
  event_type: death
  title_zh: 卒
  description: 不详
