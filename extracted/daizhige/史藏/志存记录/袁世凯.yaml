  name_zh: 袁世凯
  names:
    zh: 袁世凯
    en: Yuan Shikai
  lifespan:
    birth:
      date: 1859-09-16
      precision: day
      is_circa: false
      raw: 咸丰九年八月二十日
    death:
      date: 1916-06-06
      precision: day
      is_circa: false
      raw: 民国五年五月初六
  birth_date: 1859-09-16
  death_date: 1916-06-06
  era: 晚清至民国初年
  reign_ref: 洪宪（1916年称帝年号）
  archetype: 乱世权臣与共和转折中的争议政治家
  dilemmas:
  - 深得西太后倚任如左右手，然实不爱满人，在清廷与个人权势之间权衡
  - 面对共和潮流与君主旧制之抉择，终以帝制自为而身败名裂
  lesson: 权力之得失系于顺应时势，逆势窃国者虽握重兵亦不能久
  summary_first_person: 我袁世凯由西太后宠任而起家，倚为左右手，然我心中实不爱满人。我练兵于小站，握北洋重权，辛亥之际左右大局，受任为民国大总统。惜我晚节不终，妄行帝制改元洪宪，举国反对，帝制被迫取消，忧惧而终。
  source_urls:
  - https://zh.wikisource.org/wiki/袁世凯
