  - date: 1915-12-12
    title_zh: 接受帝位，改明年为洪宪元年
    rationale: 误判民心与列强态度，以为称帝可重聚权威，实则激起护国运动
  - date: 1916-03-22
    title_zh: 被迫取消帝制
    rationale: 护国军起、各省独立、列强劝阻，众叛亲离之下不得已退位
events:
- id: guji-袁世凯-event-birth
  person_qid: guji-袁世凯
  type: birth
  date: 1859-09-16
  year_of: 1859
  title_zh: 袁世凯生于河南项城
  description_zh: 生于河南项城官宦之家，叔祖袁甲三曾督办团练，家世与淮军渊源深厚。
- id: guji-袁世凯-event-1
  person_qid: guji-袁世凯
  type: endeavor
  date: 1882
  year_of: 1882
  title_zh: 随军入朝鲜，崭露头角
  description_zh: 随吴长庆军东渡朝鲜，镇压壬午兵变，此后长期总理朝鲜交涉通商事宜。
- id: guji-袁世凯-event-2
  person_qid: guji-袁世凯
  type: endeavor
  date: 1895-12
  year_of: 1895
  title_zh: 赴小站督练新建陆军
  description_zh: 甲午战后受命编练新建陆军，延揽段祺瑞、冯国璋等，奠定北洋军根基。
- id: guji-袁世凯-event-3
  person_qid: guji-袁世凯
  type: endeavor
  date: 1901
  year_of: 1901
  title_zh: 任直隶总督兼北洋大臣
  description_zh: 李鸿章死后继任直督，推行北洋新政，成为西太后倚任之重臣，权倾朝野。
- id: guji-袁世凯-event-4
  person_qid: guji-袁世凯
  type: endeavor
  date: 1911-11
  year_of: 1911
  title_zh: 辛亥之变复出，主持南北议和
  description_zh: 武昌起义后被清廷起用为内阁总理大臣，一面以军力压革命军，一面密与南方议和。
- id: guji-袁世凯-event-5
  person_qid: guji-袁世凯
  type: endeavor
  date: 1912-03-10
  year_of: 1912
  title_zh: 在北京就任中华民国临时大总统
  description_zh: 迫清帝退位后，继孙中山任临时大总统，清朝二百余年统治至此终结。
- id: guji-袁世凯-event-6
  person_qid: guji-袁世凯
  type: endeavor
  date: 1915-12-12
  year_of: 1915
  title_zh: 接受帝位，筹备洪宪登基
  description_zh: 经筹安会劝进，袁接受帝位，改民国五年为洪宪元年，引发护国战争。
- id: guji-袁世凯-event-7
  person_qid: guji-袁世凯
  type: endeavor
  date: 1916-03-22
  year_of: 1916
  title_zh: 取消帝制
  description_zh: 蔡锷护国军起，各省相继独立，袁被迫取消帝制，仍居总统之名。
- id: guji-袁世凯-event-death
  person_qid: guji-袁世凯
  type: death
  date: 1916-06-06
  year_of: 1916
  title_zh: 袁世凯病逝于北京
  description_zh: 帝制失败后忧愤成疾，因尿毒症卒于北京，年五十七。
