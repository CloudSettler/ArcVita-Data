person:
  id: guji-袁凯
  name_zh: 袁凯
  names:
    zh: 袁凯
    en: Yuan Kai
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 元末明初
    death:
      precision: unknown
      is_circa: true
      raw: 明初
  era: 明初（国初）
  reign_ref: 明太祖洪武
  archetype: 佯狂避祸的直臣诗人
  dilemmas:
  - 面对太祖与皇太子判决分歧，直言“法正”与“心慈”两端而触怒皇帝
  - 在严酷皇权下，选择自毁形骸、佯疯装狂以求免祸保命
  lesson: 乱世直言语祸福，藏拙佯狂可全身。
  summary_first_person: 我是袁凯，号海叟，明初诗人之冠，官御史。因答太祖刑释之问被认为持两端而下狱，几乎丧命。此后我在金水桥上诡称风疾，又以铁索锁项、食犬猪之食自污，佯狂放归，终得善终于故里。
endeavors:
- id: guji-袁凯-endeavor-1
  name_zh: 出仕为御史
  phases:
  - key: brewing
    name_zh: 以诗才闻名于吴中
    labels:
      zh:
      - 诗名
      - 国初诗人之冠
    highlight_event_id: guji-袁凯-event-endeavor-1
  - key: breakthrough
    name_zh: 仕明太祖朝为御史
    labels:
      zh:
      - 入仕
      - 御史
    highlight_event_id: guji-袁凯-event-endeavor-2
  - key: climax
    name_zh: 廷议触怒太祖
    labels:
      zh:
      - 下狱
      - 持两端
    highlight_event_id: guji-袁凯-event-endeavor-3
  - key: closure
    name_zh: 佯狂归田
    labels:
      zh:
      - 装疯
      - 放归
    highlight_event_id: guji-袁凯-event-endeavor-4
  decisions:
  - title_zh: 对太祖刑释之问答以“法之正”“心之慈”两端
    rationale: 照实理直答，不忍偏袒一方，虽触怒皇帝亦不肯阿附。
  - title_zh: 诡称风疾、自毁形骸求放归
    rationale: 遭太祖猜忌日深，宁以佯狂自污免祸。
  - title_zh: 拒起用为儒学教授，唱《月儿高》装疯到底
    rationale: 起复必再履险境，决意以疯名终老田园。
