  description_zh: 袁凯生于元末，华亭（吾乡松江）人，字景文，别号海叟。
- id: guji-袁凯-event-death
  person_id: guji-袁凯
  type: death
  date_precision: unknown
  description_zh: 佯狂放归后终老田里，得免于祸。
- id: guji-袁凯-event-endeavor-1
  person_id: guji-袁凯
  type: endeavor
  date_precision: unknown
  description_zh: 与高启齐名，为明初诗人之冠冕，有《海叟集》行于世。
- id: guji-袁凯-event-endeavor-2
  person_id: guji-袁凯
  type: endeavor
  date_precision: unknown
  description_zh: 出仕明太祖朝，任职御史。
- id: guji-袁凯-event-endeavor-3
  person_id: guji-袁凯
  type: endeavor
  date_precision: unknown
  description_zh: 太祖欲刑一人而皇太子欲释之，问凯孰是。凯对曰“陛下刑之者法之正，东朝释之者心之慈”，太祖怒其持两端，下狱三日不食，后得宥。
- id: guji-袁凯-event-endeavor-4
  person_id: guji-袁凯
  type: endeavor
  date_precision: unknown
  description_zh: 凯过金水桥诡得风疾仆地，太祖命木钻试之而不动，遂放归田里。归家以铁索锁项自毁形骸，使家人从竹筒出糖炒面混沙，匍匐取食如猪犬，使者觇之以为诚疯，置而不问。
