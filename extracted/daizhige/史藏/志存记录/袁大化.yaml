  decisions:
  - date: 1899-02
    title_zh: 禀恳李使相电商邓皖抚停征筹赈
    rationale: 民间凋残甚、人相食，停征银粮并筹办平粜，方可安辑流亡。
  - date: 1899-03
    title_zh: 檄员分两路采购粮米豆饼百万
    rationale: 一由涡河转淮至怀寿，一由滅河入淮至五河，输粮于涡蒙宿境以济饥。
  - date: 1899-06
    title_zh: 青黄接济后收局回津、自任亏累
    rationale: 四月底青黄既接，粮价已平，筹还各项假款，亏累私财甚巨而不以累人。
