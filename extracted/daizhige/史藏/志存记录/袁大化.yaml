  title_zh: 由济起程回籍办平粜
  description: 戊戌冬十一月二十九日，袁大化竣事假归，以淮北连岁失收、恐饥民聚众为患，禀商傅相乘间回籍邀集同人凑款平粜，行抵碣山即闻乱耗，冒险遄征。
  persons:
  - guji-袁大化
  endeavors:
  - guji-袁大化-endeavor-1
- id: guji-袁大化-event-battle-daozhu
  date: 1899-01-20
  year_of: 1899
  precision: month
  title_zh: 道竹桥之战
  description: 腊月初九日早，各路大股贼众约期围攻临涣，袁大化佐刘青煦督五百余官兵迎战，分马队抄贼后、步队迎面直击，以枪平码轰发，大破贼众，斩首二百余级，获子药八车、抬枪百余杆。
  persons:
  - guji-袁大化
  endeavors:
  - guji-袁大化-endeavor-1
- id: guji-袁大化-event-battle-qingting
  date: 1899-01-21
  year_of: 1899
  precision: month
  title_zh: 青町集西段家营之战
  description: 初十日，袁大化约刘青煦以寨粮给军，晨向青町、龙山进发，破贼竖条小阵，枪毙烧杀四百余贼，焚段家营贼聚，追杀十数里，以少胜众。
  persons:
  - guji-袁大化
  endeavors:
  - guji-袁大化-endeavor-1
- id: guji-袁大化-event-susong
  date: 1899-01-25
  year_of: 1899
  precision: month
  title_zh: 三镇会于临涣同报肃清
  description: 十一日伪盟主刘各疸被缚献，转献高庐集郭宝昌处正法，各匪首百有余名先后就戮；十四日刘、武、郭三镇会于临涣，同报肃清，大局遂定。
  persons:
  - guji-袁大化
  endeavors:
  - guji-袁大化-endeavor-1
- id: guji-袁大化-event-pingtiao-start
  date: 1899-02
  year_of: 1899
  precision: month
  title_zh: 设局减价平粜
  description: 己亥正月民间凋残甚、人相食，李使相、邓皖抚电催筹办平粜，檄张敬勇、邓华熙、陈保勤等设局小涧、高炉、涡阳、临涣、孙町、龙山营、石弓山七处减价平粜，数百里粮价因之大减。
  persons:
  - guji-袁大化
  endeavors:
  - guji-袁大化-endeavor-2
