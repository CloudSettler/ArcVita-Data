  - date: 1899-01-19
    title_zh: 主张乘贼未聚速行进剿
    rationale: 饥民争投掠食日添千百人，稍迟滞则蔓延浸广、势更难图，乌合之众进剿以速为妙。
  - date: 1899-01-20
    title_zh: 献策马队抄后、步队迎击
    rationale: 分饬马队远出贼后相机抄突，步队迎面直击，并亲试枪三发察贼阵隙，遂破敌于道竹桥。
  - date: 1899-01-20
    title_zh: 追杀止于弃械胁从
    rationale: 凡弃械散匿者半出胁从，姑置勿论，以分化贼众、收剿抚并用之效。
  - date: 1899-01-21
    title_zh: 以寨粮给军并扬言励士
    rationale: 青煦以军粮未到拟缓师，余拟以寨粮给之；初见贼众我寡各有惧色，扬言天时在我以安军心。
