      raw: 约1935年
  birth_date: 1851
  death_date: 1935
  era: 晚清
  reign_ref: 光绪
  archetype: 以幕僚之身返里佐军、平乱赈灾的干练实务之臣
  dilemmas:
  - 兵仅五百余人而贼众数千，退则临涣必失、三省糜烂，进则力薄难支
  - 饥民多为胁从，剿之则伤及无辜，纵之则乱势蔓延
  - 设局平粜亏累私财甚巨，救民与自保难以两全
  lesson: 乱世之中，速断速行、抚剿并用，方能以少胜众、化险为夷；救民之责，虽毁家亦不可辞。
  summary_first_person: 戊戌冬我假归淮北，逢涡宿饥民大乱，遂佐刘青煦以五百官兵连胜于道竹桥、青町集，旬日荡平巨患；次年复倡导平粜，购粮设局七处减价济民，虽亏累私财甚巨而不悔，保全地方数百里生灵。
  source_urls:
  - https://zh.wikisource.org/wiki/戊戌定乱平粜记略
