  birth_date: 1584
  death_date: 1630-09
  era: 明末
  reign_ref: 明熹宗、明思宗（庄烈帝，崇祯）
  archetype: 边关督师·忠而见疑的辽东统帅
  dilemmas:
  - 擅杀大将毛文龙以整肃军政，却授政敌以口实
  - 率师勤王解京师之围，反遭魏忠贤余党构陷下狱
  - 守辽方略未及竟功，而身先磔于西市，天下冤之
  lesson: 忠而见疑、功高被谤，则边将之才终不能救危局
  summary_first_person: 我以东莞一书生起于辽东，随孙承宗筑宁远重镇，数立边功；熹宗朝为魏忠贤所忌而罢。崇祯元年蒙起复，经略辽东、镇守山海关，二年杀皮岛大将毛文龙以肃军纪。及大清兵入龙井关逼京师，我率祖大寿疾驰勤王，不料忠贤余党高捷、史堡疏诬我擅杀大将与纳款内应，词连钱龙锡，帝遂执我下狱。崇祯三年八月，我竟遭磔刑，家籍，兄弟妻子流三千里。崇焕无罪，天下冤之。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/卷259
