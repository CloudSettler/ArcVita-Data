  era: 明
  reign_ref: 明世宗嘉靖
  archetype: 危城内应之忠孝孤臣
  dilemmas:
  - 父丧守苫执礼与君亲并急赴义之抉择
  - 尽残满城生灵与只诛渠魁保全数万之权衡
  - 诈言炭路天使以取信叛军之冒险
  lesson: 诚恳任事得众信者方能合内外于危城而再造生灵
  summary_first_person: 吾以户部郎奉命理储至大同适逢父丧而值李瑾被杀之变城闭虏迫官军顿兵城下战不利吾念君亲并急不敢自附执礼遂离苫潜使通军前约为内应与马升戴廉等盟迎天使而诛首恶开门以定大同
  source_urls:
  - https://daizhige.org/史藏/志存记录/大同平叛志.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/志存记录/大同平叛志.md
endeavors:
