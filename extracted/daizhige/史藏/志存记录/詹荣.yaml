    start_date: 1533-06
    highlight_event_id: guji-詹荣-event-lichu
  - key: breakthrough
    name: 诚恳供饷得军信
    labels:
      zh: 诚恳任事
    start_date: 1533-08
    highlight_event_id: guji-詹荣-event-lichu
  - key: climax
    name: 父丧值变不克去
    labels:
      zh: 君亲并急
    start_date: 1533-10
    highlight_event_id: guji-詹荣-event-trapped
  - key: closure
    name: 离苫奋起图赴义
    labels:
      zh: 离苫赴义
    start_date: 1534-01
    highlight_event_id: guji-詹荣-event-secret
  decisions:
  - date: 1533-10
    title_zh: 变作留镇不去
    rationale: 父丧母氏俱在镇中且素为出纳得军心不为所怨留则可为内应之本
  - date: 1534-01
    title_zh: 离苫通军前
    rationale: 官军战不利叛军复购虏将至若不赴义则满城左衽故不敢自附执礼
- id: guji-詹荣-endeavor-2
  title_zh: 密约内应诛首恶定大同
  summary: 潜使王宁赍储牒通督府得印札约为内应与马升戴廉等盟迎天使楚书入城宣慰遂分禽首恶而开门迎樊继祖
  phases:
  - key: brewing
    name: 遣王宁通军前
    labels:
      zh: 潜使通款
    start_date: 1534-01
    highlight_event_id: guji-詹荣-event-secret
  - key: breakthrough
    name: 得印札与马升盟
    labels:
      zh: 密盟忠愤
    start_date: 1534-01
    highlight_event_id: guji-詹荣-event-secret
  - key: climax
    name: 绐迎天使宣德音
    labels:
      zh: 天使宣慰
    start_date: 1534-02
    highlight_event_id: guji-詹荣-event-pacify
  - key: closure
    name: 斩首恶开门迎抚
    labels:
      zh: 开门迎抚
    start_date: 1534-02
    highlight_event_id: guji-詹荣-event-pacify
  decisions:
  - date: 1534-01
    title_zh: 借乞炭路出城计事
    rationale: 兵断炭路城中冻甚托浼出乞军门可不疑而得面定大谋
  - date: 1534-02
    title_zh: 请天使赍诏入城宣慰
    rationale: 城中不知德音即闻弗信得天使一省慰则胁从信赦而渠魁可图
