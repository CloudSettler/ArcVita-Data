events:
- id: guji-许浩-event-birth
  date: 1440
  year_of: 1440
  type: birth
  title_zh: 生于太常博士之家
  description: 约生于明正统年间父为太常博士自幼习闻郊庙礼制与朝野旧事
- id: guji-许浩-event-jiaoji
  date: 1449
  year_of: 1449
  type: career
  title_zh: 正统十四年随父陪郊祀
  description: 先君以太常博士陪祀前一日习仪赐食将祀英庙体不平命英太师摄祭亲见其始末后记入复斋日记
- id: guji-许浩-event-xingxue
  date: 1450
  year_of: 1450
  type: career
  title_zh: 见英庙幸国学释奠讲学
  description: 先君与行释奠礼亲见英庙临幸彝伦堂李祭酒讲舜典君臣赓歌君臣倾听锡予优厚并记其所立监规
- id: guji-许浩-event-zhuanji
  date: 1472
  year_of: 1472
  type: career
  title_zh: 撰成复斋日记卷上
  description: 集王冕墨梅僧玘对高皇帝余阙大节三林忠节胡濙选庶吉士汉王之变安南交阯白鲞庙白虎庙诸条以存明初掌故
- id: guji-许浩-event-death
  date: 1500
  year_of: 1500
  type: death
  title_zh: 约卒于弘治前后
  description: 日记已成流传于世以补史阙约卒于明弘治前后
