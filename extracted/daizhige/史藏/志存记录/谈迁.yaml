person:
  qid: guji-谈迁
  name_zh: 谈迁
  names:
    zh: 谈迁
    en: Tan Qian
  lifespan:
    birth:
      date: 1594
      precision: year
      is_circa: true
      raw: 卒年六十有四，逆推约生于万历二十二年前后
    death:
      date: 1657
      precision: year
      is_circa: true
      raw: 卒年六十有四，约卒于顺治十四年丁酉前后
  birth_date: 约1594
  death_date: 约1657
  era: 明末清初
  reign_ref: 崇祯、顺治年间
  archetype: 布衣史家
  dilemmas:
  - 高弘图荐入史馆，泣辞曰『忍以国之不幸博一官』，守布衣之节而失仕进之阶
  - 丙戌盗起，毕生藏稿尽失，垂老之年抉择于弃笔与重纂之间
  - 鼎革之际，隐痛于亡国之变，抉择于出仕新朝与遗民自处之间
  lesson: 以布衣之身穷年订史，稿失而志不夺，成一家之言在不肯徇爱憎、不失实而已
  summary_first_person: 我是海宁盐官布衣谈迁，字孺木。性好博综，尤谙列朝典故，尝言杨文贞于革除多失实、焦泌阳于正士加厚疵，皆徒徇爱憎耳。崇祯壬午受知于张慎言、高弘图二公，布衣定交。甲申高公入相，荐我入史馆，我泣辞不受。丙戌盗起，藏稿尽失，我发愤重纂。甲午随朱中丞北游京师，谒愍帝陵，吴太史伟业独重我。丁酉徒步数百里哭张冢宰之墓。我操行廉，不妄取一介，至今家徒四壁，然枣林之书足以餍饫后学于无涯。
  source_urls:
  - 枣林杂俎·提要
  - 枣林杂俎·序
  - 枣林杂俎·题词
  - 海宁县志·隐逸·本传
