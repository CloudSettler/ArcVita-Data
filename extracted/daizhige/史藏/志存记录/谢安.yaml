  reign_ref: 穆帝、哀帝、海西公、简文帝、孝武帝
  archetype: 隐逸高士转济世宰辅
  dilemmas:
  - 隐居山水屡辞征召与世乱需匡济之间的取舍
  - 桓温权倾朝野、废立威胁之下如何保全皇室
  - 前秦大举南寇、京师大震时如何镇定御敌
  - 遭谮毁、帝渐疏忌之际如何自处
  lesson: 矫情镇物、雅量担当，处危局而夷然不改其度
  summary_first_person: 我早年优游会稽山水，屡辞征召；年四十方应桓温之请出仕，志在匡济。桓温专朝废立，我从容周旋；苻坚大举入寇，列阵肥水，我与玄围棋自若，闻捷报而了无喜色——小儿辈遂已破贼。人皆叹我雅量镇物。
  source_urls:
  - 檀道鸾《续晋阳秋》佚文（见《世说》诸注、《御览》《占经》引）
