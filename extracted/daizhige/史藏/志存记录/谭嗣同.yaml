  birth_date: 1865-03-10
  death_date: 1898-09-28
  era: 清末
  reign_ref: 光绪
  archetype: 戊戌维新志士·军机四卿之一
  dilemmas:
  - 明知变法触怒后党、旧党盈廷，仍受四品卿衔入军机，以身许国
  - 新政诏书皆由四卿拟旨，名为章京、实则宰相，权专而势孤
  lesson: 以死殉法，其热血唤醒后人——变法须有实权与民众根基，空文新政难救危局
  summary_first_person: 我是谭嗣同，光绪二十四年四月下定国是之诏后，为侍读学士徐致靖所保，七月二十日特加四品卿衔，入军机参预新政。凡新政奏折皆经我等四卿阅看，谕旨皆由我等拟写，虽旧臣盈廷悉置不问，我知变法已成孤注。政变既起，我不肯遁逃，甘为维新流血之第一人。
  source_urls:
  - https://zh.wikipedia.org/wiki/谭嗣同
