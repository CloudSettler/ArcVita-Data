      raw: 约战国末年真定人（生年史无明载）
    death:
      date: -137
      precision: year
      is_circa: false
      raw: 汉武帝建元四年前后病故（文中文称陀公病故传职与孙赵胡）
  birth_date: -240（约）
  death_date: -137（约）
  era: 秦末汉初
  reign_ref: 南越武王／南越武帝，汉高祖时封南粤王
  archetype: 割据岭南的开疆藩王
  dilemmas:
  - 中原正统与岭南自立之间的名分抉择：臣汉称藩还是 Off 自立为帝
  - 先主任嚣遗命“绝关自备”与汉廷关市禁令的冲突
  lesson: 顺势经营，能屈能伸——乱世中审时度势，可王者亦可再称藩。
  summary_first_person: 我本真定人，秦时任南海龙川令。天下乱起，南海尉任嚣临终托我行尉事，我依其遗策绝关自守，遂定扬粤、桂林、南海诸郡，自立为南越武王。汉高祖正位，封我为南粤王，我称臣奉贡；吕后用事禁我关市，我愤而称帝；汉文帝以德化人，遣陆贾劝说，我乃去帝号复为藩王，岁时奉祀，遣子入侍。我治岭南数千里，招贤纳士，待民以宽，和集百越，终以藩王之礼得终天年，传位于孙赵胡。
