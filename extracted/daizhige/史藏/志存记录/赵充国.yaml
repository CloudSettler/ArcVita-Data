  archetype: 持重谋远的边将在外
  dilemmas:
  - 面对羌骑挑战，士马新倦，是贪小利驰逐还是持重待机
  - 大破羌人后，是乘胜穷追趋于利，还是缓师招降以全胜
  lesson: 攻不足而守有余，宁可以我致人，不可以人致我；持重爱士，方能殄灭成局
  summary_first_person: 我为将持重，先示弱不战以懈羌人之心，待其众心解弛，出其不意渡湟水大破之；既胜而不急追，深知兽穷则搏，缓之则降，西方遂平。宁可我致人，不可人致我，此我用兵之本。
