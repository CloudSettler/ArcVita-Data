  description: 周世宗崩恭帝幼冲将北征京师喧言出军之日当立点检为天子将士归心于太祖
  location_zh: 汴京
- id: guji-赵匡胤-event-chenqiao
  date: 0960-02-03
  year_of: 960
  title_zh: 陈桥兵变黄袍加身
  description: 领周师北征次陈桥驿三军拥戴裂黄袍加身还师汴京自封邱门入而不惊都人
  location_zh: 陈桥驿
- id: guji-赵匡胤-event-rucheng
  date: 0960-02-04
  year_of: 960
  title_zh: 入城靖市市不改肆
  description: 与众誓约不得剽劫入城之日市不改肆陆乔二卒长拒命死义赐庙曰忠义以旌其忠
  location_zh: 汴京
- id: guji-赵匡胤-event-jianlong
  date: 0960-02-05
  year_of: 960
  title_zh: 受周禅建隆立国誓保柴氏
  description: 受周恭帝禅即皇帝位建元建隆密镌誓碑保柴氏子孙不加刑不得杀士大夫上书言事人
  location_zh: 汴京崇元殿
- id: guji-赵匡胤-event-xiannan
  date: 0962-03-01
  year_of: 962
