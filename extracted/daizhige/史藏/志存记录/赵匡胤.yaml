  description: 纳赵普等议定先南后北之策乘南国离散次第经营荆湖南北以通王师南下之道
  location_zh: 汴京
- id: guji-赵匡胤-event-shibingquan
  date: 0961-07-15
  year_of: 961
  title_zh: 杯酒释兵权收方镇之柄
  description: 召石守信等宿将置酒从容谕以释兵权就节镇优遇自是方镇偃蹇之风稍革而禁军归一
  location_zh: 汴京宫中
- id: guji-赵匡胤-event-pingshu
  date: 0965-02-01
  year_of: 965
  title_zh: 王师平后蜀得成都
  description: 遣王全斌等分道伐蜀孟昶出降诏赴阙曹彬等严戢士卒全蜀底定统一大势遂成
  location_zh: 成都
- id: guji-赵匡胤-event-yimou
  date: 0976-01-01
  year_of: 976
  title_zh: 西幸洛阳卜永昌陵定贻谋
  description: 九年西幸还夹马营旧庐发石马登阙台鸣弦发矢以矢委处定为皇堂更陵名永昌是岁遂崩
  location_zh: 洛阳
- id: guji-赵匡胤-event-death
  date: 0976-11-14
  year_of: 976
  title_zh: 崩于大内烛影斧声传位晋王
  description: 开宝九年十月二十夜御太清阁望气雪骤降召晋王光义对饮屏左右烛影下斧声做做之语是夕崩于万岁殿
  location_zh: 汴京大内
