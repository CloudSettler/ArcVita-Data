  decisions:
  - date: 1813
    title_zh: 严治械斗、编沿海民寮入保甲
    rationale: 南澳、澄海、潮阳盗众及沿海逋逃之薮为患，惟严捕与保甲并施方能靖地方
  - date: 1815
    title_zh: 钩稽州县积亏、筹款岁修堤防并请减粮额
    rationale: 积亏展转相承、濒河堤圮民苦水患，须除纠轕、屯田生息、摊减重赋
  - date: 1817
    title_zh: 亲往捕诛宜山会匪廖五桂、蓝耀青
    rationale: 会匪分踞新旧两墟、勒索殷户，亲捕首恶并饬行保甲、置望楼以靖群盗
  - date: 1818
    title_zh: 捐梧浔二关盈馀设预备仓、增书院、置栖流所
    rationale: 自言身为大臣取盈无用，当为国家布仁泽
  - date: 1823
    title_zh: 于海口稽核台湾米船出数、酌丰歉为限制
    rationale: 漳泉仰给商运而江浙天津民无盖藏、米贵辄乱，留有馀以弭乱源
  - date: 1825
    title_zh: 病中拜疏劾贪黩不职者数十人
    rationale: 整顿铜盐屯田未及议行而疾作，去职之前必先去害群之吏
