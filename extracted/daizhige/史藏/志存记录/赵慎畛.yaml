person:
  qid: guji-赵慎畛
  name_zh: 赵慎畛
  names:
    zh: 赵慎畛
    en: Zhao Shenzhen
  lifespan:
    birth:
      date: unknown
      precision: unknown
      is_circa: true
      raw: 不详
    death:
      date: 1825
      precision: year
      is_circa: true
      raw: 道光五年（1825年）调云贵总督后未几而卒
  death_date: 1825
  era: 清代
  reign_ref: 嘉庆、道光
  archetype: 清廉实干型督抚
  dilemmas:
  - 治盗严惩首恶与宽宥被胁民众之间的分寸拿捏
  - 巡抚例得动用关盈馀与自守廉洁、以之兴学济民之间的取舍
  - 病重之际仍拜疏劾贪黩不职者数十人的公义与自保
  lesson: 服膺儒先、身体力行，为官以识才恤属、除弊安民为本
  summary_first_person: 我是赵慎畛，字笛楼，湖南武陵人。早岁为诸生时，学政钱沣称我为“人英”。嘉庆元年成进士，由编修历御史、给事中，条陈川楚善后事宜。后外任广东惠潮嘉道，严治械斗、捕缉海盗；迁广东布政使，钩稽积亏、屯田减赋。擢广西巡抚，劝民修塘造车设井，捕盗千七百余人，并捐关盈馀设预备仓、创书院。道光二年擢闽浙总督，整军律、抚台湾、慎海防。五年调云贵总督，方图整顿铜盐、筹议边防屯田，未及行而病作，病中犹劾贪黩数十人，未几卒，谥文恪。
  source_urls:
  - https://zh.wikipedia.org/wiki/赵慎畛
