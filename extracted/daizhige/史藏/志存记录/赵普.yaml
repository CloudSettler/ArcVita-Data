  - key: climax
    name: 太祖纳言推行新制
    labels:
      zh:
      - 采纳推行
    start_date: 0961
    highlight_event_id: guji-赵普-event-quanzhi
  - key: closure
    name: 郡县更替渐成定制
    labels:
      zh:
      - 制度初成
    start_date: 0962
    highlight_event_id: guji-赵普-event-quanzhi
  decisions:
  - date: 0960
    title_zh: 建言京官权知三年一替
    rationale: 以文制武以更替防专擅，革诸侯难制之源而安天下
  - date: 0961
    title_zh: 坚持郡县由朝廷差遣
    rationale: 不私亲故不徇藩帅，必使列郡之权归于朝廷
- id: guji-赵普-endeavor-2
  title_zh: 留守京师佐平潞贼李筠
  summary: 太祖亲征潞贼时与吕余庆留守京师，私谒太宗愿效军前，奉命分兵守河阳为别计，凯旋加等进枢密
  phases:
  - key: brewing
    name: 李筠据潞叛命朝廷戒严
    labels:
      zh:
      - 叛乱初起
    start_date: 0960-04
    highlight_event_id: guji-赵普-event-liushou
  - key: breakthrough
    name: 留守京师请效军前
    labels:
      zh:
      - 请缨
    start_date: 0960-05
    highlight_event_id: guji-赵普-event-liushou
  - key: climax
    name: 分兵守河阳为别计
    labels:
      zh:
      - 守备
    start_date: 0960-06
    highlight_event_id: guji-赵普-event-liushou
  - key: closure
    name: 凯旋论功进位枢密
    labels:
      zh:
      - 论功进位
    start_date: 0960-07
    highlight_event_id: guji-赵普-event-shushu
  decisions:
  - date: 0960-05
    title_zh: 私谒太宗愿军前自效
    rationale: 万乘蒙尘臣子效命之日，不敢以留后自安而托迹观望
  - date: 0960-06
    title_zh: 奉命分兵守河阳
    rationale: 胜则不言不利则别作计度，为国家留根本之备
  - date: 0968
    title_zh: 居中书屡执奏不挠
    rationale: 事有违戾必固请至理遂而止，拂落于地亦拾尘再进
events:
- id: guji-赵普-event-birth
  title_zh: 出生于幽州蓟县
  date: 0922
  year_of: 922
  place_zh: 幽州蓟县
  description: 后梁贞明八年生，后随父徙居洛阳，初为小吏以吏事敏干见知
- id: guji-赵普-event-quanzhi
  title_zh: 建言京官权知郡县三年一替
  date: 0960
  year_of: 960
  place_zh: 京师
  description: 太祖问唐室祸源何在，对以诸侯难制，请列郡以京官权知三年一替，太祖从之
- id: guji-赵普-event-liushou
  title_zh: 留守京师请从征李筠
  date: 0960-05
  year_of: 960
  place_zh: 京师朱邸河阳
  description: 太祖亲征潞贼李筠，诏与吕余庆留守京师，请效军前，奉旨分兵守河阳，凯旋论功加等
- id: guji-赵普-event-shushu
  title_zh: 议署敕请太宗以中书令署字
  date: 0960-08
  year_of: 960
  place_zh: 资福殿中书
  description: 自枢密副使授集贤殿大学士，范质等罢相中书绝曹无署敕者，问议于陶毂窦仪，请太宗以京尹中书令署敕
- id: guji-赵普-event-zhongshu
  title_zh: 居中书执奏屡谏太祖
  date: 0968
  year_of: 968
  place_zh: 中书
  description: 每奏牍违戾太祖意者固请不已，或拂之于地则缓拾振尘再献，及再三理遂而止
- id: guji-赵普-event-death
  title_zh: 卒于洛阳
  date: 0992
  year_of: 992
  place_zh: 洛阳
  description: 宋太宗淳化三年卒，累佐太祖太宗定制度固邦本，追封真定王谥忠献
