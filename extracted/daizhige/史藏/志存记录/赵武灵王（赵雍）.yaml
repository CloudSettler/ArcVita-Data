  era: 战国
  reign_ref: 赵武灵王（前325—前299在位，后自称主父）
  archetype: 锐意变法的改革君主
  dilemmas:
  - 胡服骑射违背华夏衣冠传统，遭宗室贵族之怨，仍坚持强兵
  - 立幼子赵何为王而自号主父，致长子赵章之乱，终困死于沙丘宫
  lesson: 欲成非常之功者，须任非常之谤；然继嗣之乱可倾社稷，传位之谋不可不慎
  summary_first_person: 我赵雍继肃侯而立，当五国相王、秦楚争强之世。我深感赵屡败于胡人，遂力排众议，教民胡服骑射，拓地千里，北至燕代，西至云中九原，灭中山，诈为使者入秦以窥虚实。我立少子何为王，自号主父，专意军事，欲从云中直南袭秦。惜乎沙丘之变，困于离宫三月而卒，谥武灵王。
  source_urls:
  - 贵州威宁赵氏家谱
