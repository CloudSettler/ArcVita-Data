    title_zh: 焚敌箭书拒降
    rationale: 吴曦已降之说不为所动，对来人焚书碎之，以绝城中观望之心
  - date: 1206-12
    title_zh: 创泥炮蒺藜箭
    rationale: 兵法所不载，因敌制巧，如开重濠以陷炮、织竹笼以绊马
  - date: 1206-12
    title_zh: 收夺箭改弩手三千
    rationale: 虏人最怕弩箭，每支钱三贯募弓手改弩手三千余人增于城上
  - date: '1207'
    title_zh: 置场赈粜捕灭群犬
    rationale: 出仓米原价赈籴接民食；因群犬吠噪泄兵机，织竹篘潜张濠外旬日捕尽，自后出兵每出必捷
