  - 城中柴粮匮乏，民至拆屋爨炊，须统筹赈粜与军需
  lesson: 忠赤贯日，算无遗策，以万余卒抗二十万虏而保全襄阳
  summary_first_person: 我赵淳于开禧年间坚守襄阳九十日，随机应变，创泥炮、蒺藜箭诸法，大捷一十二次，卒保一城生灵。
