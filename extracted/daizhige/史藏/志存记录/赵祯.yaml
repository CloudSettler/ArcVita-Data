  - date: '1040'
    title_zh: 遣三十内人出宫并首遣梳头夫人
    rationale: 台谏言霖淫为阴盛之罚、嫔御太多宜裁减，而梳头夫人劝拒谏，故曰劝我拒谏者岂宜置左右。
  - date: '1050'
    title_zh: 罢张尧佐宣徽使之命
    rationale: 包拯乞对反覆数百言、音吐愤激，廷论不可，卒从之。
  - date: '1059'
    title_zh: 嘉祐郊祀却群臣上尊号之请
    rationale: 采宋祁却尊号甚盛德之议，谓一日受虚名而损实美，与我意正合。
