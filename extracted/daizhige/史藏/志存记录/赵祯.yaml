  title_zh: 因霖淫台谏章疏遣三十内人出宫
  description: 帝怀台谏章疏理发，梳头夫人劝勿减嫔御、乞以己为首，帝遂携宫籍过后苑，降指挥自某人以下三十人尽放出宫，首遣其人，曰此人劝我拒谏，岂宜置左右。
