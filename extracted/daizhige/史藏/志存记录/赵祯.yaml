  title_zh: 止京东繁盛镇增置监临官
  description: 京东路一镇户繁盛为本路之最，大臣建言增置监临官，父老欣然、官司保明闻奏；昭陵思之良久曰恐动漕司岁计，遂别生事因为民患，止而不行。
