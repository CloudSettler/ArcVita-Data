  year_of: 1045
  is_circa: true
  date_raw: 仁宗时
  title_zh: 宽宥蜀中献诗老秀才
  description: 蜀中一举子献诗成都府云把断剑门烧栈阁，成都别是一乾坤，知府械付狱并表上其事；仁宗曰此乃老秀才急于仕宦不足治也，可授司户参军不厘事务，处于远小郡。
- id: guji-zhaozhen-event-baozheng
  person_qid: guji-zhaozhen
