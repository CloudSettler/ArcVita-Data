  name_zh: 赵祯
  names:
    zh: 赵祯
    en: Zhao Zhen
  lifespan:
    birth:
      date: '1010'
      precision: year
      is_circa: true
      raw: 大中祥符三年
    death:
      date: '1063'
      precision: year
      is_circa: false
  birth_date: '1010'
  death_date: '1063'
  era: 北宋
  reign_ref: 宋仁宗，1022—1063年在位，历天圣、明道、景祐、宝元、康定、庆历、皇祐、至和、嘉祐诸年号
  archetype: 仁德纳谏、俭德爱民之君
  dilemmas:
  - 台谏章疏言嫔御太多宜裁减，而从谏则须遣平日嬖爱之梳头夫人
  - 温成皇后求申张尧佐宣徽使之命，与包拯廷论数百言之不可之间
  - 郊祀丞相欲上尊号，受虚名则损实美
  - 京东繁盛之镇增置监临官以收利，恐动漕司岁计反为民患
  lesson: 人主至诚纳谏、俭德自持、谨惜名器，则风动四方、民日以富；拒谏之嬖幸不可置左右。
  summary_first_person: 我赵祯在位四十二年，自谓所恃者不过至诚纳谏与俭德而已。台谏章疏常置怀中，霖淫之罚我宁信其有，遂遣三十内人出宫，虽平日嬖爱之梳头夫人劝我拒谏，亦居首遣之。包中丞犯颜切直，唾溅我面，我终罢张尧佐宣徽使之命。我性好服浣濯之衣，破则随补，嫔御进新衣辄推去之。尊号非古，宝元以后二十年群臣毋得复请。京东置官、蜀中秀才、胡宗炎改官诸事，我皆恐为民患、恐寒士沉滞而曲为裁处，惟恐失一寒士而已。
