  date_raw: 仁宗朝
  title_zh: 好服浣濯之衣化行六宫
  description: 仁宗俭德本于天性，尤好服浣濯之衣，嫔御私易新衣以进，闻其声辄推去之；遇浣濯随破随补，将遍犹不肯易，命妇入见皆以盛饰为耻，风动四方，民日以富。
- id: guji-zhaozhen-event-shu-scholar
  person_qid: guji-zhaozhen
