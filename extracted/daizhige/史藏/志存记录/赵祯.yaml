  - date: '1050'
    title_zh: 止京东路增置监临官之议
    rationale: 恐动漕司岁计、别生事而为民患，遂止而不行。
  - date: '1045'
    title_zh: 赦蜀中献诗狂生并授远小郡司户参军
    rationale: 此乃老秀才急于仕宦而为之，不足治也。
  - date: '1055'
    title_zh: 令胡宗炎更候一任与改合入官
    rationale: 阅家状知其父胡宿见任翰林学士，叹寒士安得不沉滞，谨惜名器而曲全之。
