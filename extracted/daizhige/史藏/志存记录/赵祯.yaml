  is_circa: true
  date_raw: 皇祐间
  title_zh: 包拯犯颜切直罢张尧佐宣徽使
  description: 上以温成故欲申张尧佐宣徽使之命，已降旨，包拯乞对大陈其不可，反覆数百言，音吐愤激，唾溅帝面；帝卒为罢之，且举袖拭面责温成曰汝岂不知包拯是御史中丞乎。
- id: guji-zhaozhen-event-jingdong
  person_qid: guji-zhaozhen
