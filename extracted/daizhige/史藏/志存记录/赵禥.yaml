    title_zh: 诏斥贡羡余禁郡国贪残借贡毒民
    rationale: 以民为邦本，守艺祖家法，务先惠养以清化原导和气
  - date: 1267-01-01
    title_zh: 卜郊遇月食改用夏正孟陬行礼
    rationale: 畏天威明命，参干德隆兴旧制，裒对刚辰以敬初服
events:
- id: guji-赵禥-event-birth
  title_zh: 生于临安
  date: 1240-05-02
  year_of: 1240
  description: 嘉熙四年四月九日生，为荣王赵与芮之子，初名孟启
- id: guji-赵禥-event-enthronement
  title_zh: 忠王即皇帝位是为度宗
  date: 1264-11-16
  year_of: 1264
  description: 景定五年冬十月理宗崩，忠王受遗诏即位，诏以明年为咸淳元年
- id: guji-赵禥-event-xianchun
  title_zh: 改元咸淳首辟经帷幸太学
  date: 1265-02-07
  year_of: 1265
  description: 咸淳元年元旦下诏用君子屏憸壬，斥羡余，幸太学升邵雍司马光从祀，复相贾似道
- id: guji-赵禥-event-jiaoshe
  title_zh: 孟春朔旦有事于南郊
  date: 1267-02-15
  year_of: 1267
  description: 咸淳三年正月己丑朔合祀天地于南郊，肆赦天下，拟上皇太后寿和尊号
- id: guji-赵禥-event-death
  title_zh: 崩于临安
  date: 1274-08-12
  year_of: 1274
  description: 咸淳十年七月九日崩，在位十年，遗诏太子显即位
