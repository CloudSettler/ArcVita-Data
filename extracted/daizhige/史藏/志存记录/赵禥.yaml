  dilemmas:
  - 倚重权相贾似道以安社稷与亲政振纲之两难
  - 公田军饷仰给国计与民间愁叹星变示警之两难
  - 郊庙大礼追崇尊显与边防孔棘国用匮乏之两难
  lesson: 创业难守成亦不易，专倚一相而群言壅蔽，则国计虽济而人心日离
  summary_first_person: 朕以菲质嗣承大统，改元咸淳，兢兢以天变边警为惧，倚师相贾似道经纶，行公田以给军饷，修郊祀太学以崇礼文，惟德弗昭，夙夜祗惧
