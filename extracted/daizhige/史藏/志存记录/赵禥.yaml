    title_zh: 即位后累遣近臣宣召贾似道还朝
    rationale: 夜不安枕以待师相，欲以元勋镇安夷夏绥抚生民，不欲更张
  - date: 1265-01-01
    title_zh: 不许并相独任贾似道为右丞相
    rationale: 鉴先朝并相之弊，谓体统一则可杜绝憸慝，任贤勿贰以一观听
