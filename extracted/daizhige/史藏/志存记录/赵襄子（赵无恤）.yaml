person:
  qid: guji-zhaoxiangzi
  name_zh: 赵襄子（赵无恤）
  names:
    zh: 赵襄子、赵无恤、赵孟
    en: Zhao Xiangzi (Wuxu of Zhao)
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: -425
      precision: year
      is_circa: true
      raw: 在位三十三年，卒，谥襄子
  death_date: -425
  era: 春秋末期至战国初期
  reign_ref: 赵氏宗主（赵国基业奠基人，未称侯）
  archetype: 忍辱奠基的深谋宗主
  dilemmas:
  - 婢女所生之庶子，如何在嫡兄伯鲁在世时获得立嗣资格
  - 晋阳被围、城中易子而食之际，是否冒险离间韩魏以破智氏
  - 得国之后，为报兄伯鲁不得立之憾，不立己子而传位于伯鲁之孙
  lesson: 成大事者识势能忍、谋定后动，并以不逾兄嗣之约见其信义
  summary_first_person: 我本简子幼子，母为婢女，因三年谨记父之训诫于竹简而得立为后。四卿相攻，智伯引汾水灌晋阳，城中悬釜而炊、易子而食，我夜遣张孟谈私会韩魏，终灭智氏、三分晋国。我感兄伯鲁不得立，不立己子，立其孙浣为嗣，赵氏基业自此奠定，后世至烈侯赵籍始列为诸侯。
