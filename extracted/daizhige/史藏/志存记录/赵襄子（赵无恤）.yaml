  decisions:
  - date: -455
    title_zh: 弃城奔保晋阳
    rationale: 智伯与韩康子、魏桓子共攻无恤，无恤惧，奔保守御最强之晋阳
  - date: -453
    title_zh: 夜遣张孟谈私会韩魏
    rationale: 城不没者三版、悬釜而炊、易子而食，危急之际离间韩魏，三国合谋灭智氏
  - title_zh: 不立己子，立伯鲁之孙浣为嗣
    rationale: 襄子以为兄伯鲁不得立，必欲传位伯鲁之后；代成君赵周先死，乃立其子浣为太子
events:
