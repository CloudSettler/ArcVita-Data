    title_zh: 以赋体纪边功
    rationale: 勒马凤凰之旧事不足法惟当代施仁伐罪当铺张扬厉使华夷一统车书会同
  - date: '1467-11-10'
    title_zh: 归功圣德庙算不自居功
    rationale: 直捣万夫莫开之险非人力所能必归德动天地威播华夷方系万载太平之休
