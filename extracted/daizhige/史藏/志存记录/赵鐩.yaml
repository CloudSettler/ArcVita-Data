  decisions:
  - date: 1512-01-10
    title_zh: 改名赵怀忠就任副元帅
    rationale: 与刘惠立奉天征讨旗号分二十八营应星宿意在统束乱兵延续残局亦存观望成败之心
  - date: 1512-03-15
    title_zh: 弃册昼夜南奔不解散
    rationale: 畏官军追剿及营中刑杀不敢依恩例滚马解散只率余部由光山六安奔逃冀图再起终至覆灭
