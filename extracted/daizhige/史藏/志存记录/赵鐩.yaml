  decisions:
  - date: 1511-07-15
    title_zh: 不忍家口被辱戳伤贼徒后从贼自保
    rationale: 为保全王东村水中七十余口家眷不得已从刘七刘资上马为盗以家口发送回家换取活命
  - date: 1511-09-01
    title_zh: 共推杨虎为主佯许招抚
    rationale: 见贼势众难以脱身遂随众推杨虎为大王并以乞赦书信拖延官军争取转圜余地
- id: guji-赵鐩-endeavor-2
  title_zh: 奉天副元帅转战豫楚受俘
  summary: 杨虎死后被推为副元帅分二十八营转战河南湖广终败于官军献俘京师
  phases:
  - key: brewing
