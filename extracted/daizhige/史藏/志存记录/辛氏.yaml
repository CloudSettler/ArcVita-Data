  reign_ref: 东汉永元至永建
  archetype: 方志史家
  dilemmas:
  - 秦汉旧都文献散佚而地志阙如
  - 传闻异辞并存而难辨山川宫阙真貌
  lesson: 记地以存史，采俗以补史，令三秦故实不坠
  summary_first_person: 吾为汉室关中人，见长安承秦之旧，宫阙陵寝山川犹在而旧闻渐散，遂历访骊山太白陇坂诸地，询父老，采歌谣，条记山陵温泉兰池桂宫之事，撰成三秦记以存一方之志
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E4%B8%89%E7%A7%A6%E8%AE%B0.html
