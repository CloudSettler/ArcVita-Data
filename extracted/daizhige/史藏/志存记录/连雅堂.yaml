  - date: '1920'
    title_zh: 梓行《台湾通史》
    rationale: 书成之后不假官局，自行刊布，以广流传、垂鉴后世。
events:
- id: guji-连雅堂-event-birth
  type: birth
  title_zh: 连雅堂生
  date: '1878'
  precision: year
  is_circa: false
  year_of: 1878
  description: 连横生于清光绪四年（戊寅），后以字雅堂行世。
- id: guji-连雅堂-event-lianshe-join
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-1
  title_zh: 宣统元年加盟栎社为社友
  date: '1909'
  precision: year
  is_circa: false
  year_of: 1909
  description: 《栎社沿革志略》载：清宣统元年（己酉），台南连雅堂（横）加盟为社友。
- id: guji-连雅堂-event-lianshe-spring-1910
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-1
  title_zh: 宣统二年瑞轩春会，雅堂与二十社友会集
  date: '1910-04-23'
  precision: day
  is_circa: false
  year_of: 1910
  description: 四月二十三日（古历三月十四日），雅堂与启运、基六、灌园、南强、痴仙等二十人及来宾三十一人会于瑞轩，交宿题诗卷、撮影留念，作「栎社庚戌春会即事」诗。
- id: guji-连雅堂-event-lianshe-liangqichao
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-1
  title_zh: 宣统三年瑞轩开会欢迎梁任公
  date: '1911-04-02'
  precision: day
  is_circa: false
  year_of: 1911
  description: 四月二日（古历三月初四日），雅堂与社友二十人于瑞轩开会欢迎梁启超、汤觉顿、梁令娴游台，诗题有「追怀刘壮肃」等，会于台中公园物产陈列馆前撮影。
- id: guji-连雅堂-event-lianshe-laiyuan-1916
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-1
  title_zh: 民国五年莱园击钵吟会
  date: '1916-10-28'
  precision: day
  is_circa: false
  year_of: 1916
  description: 十月二十八日（古历十月初二日），雅堂与悔之、沧玉、少舲、槐庭、望洋、南强、子材、大智、伊若、鹤亭、灌园十二人会于雾峰莱园，作「早梅」「喷水池」「纸鸢」「汽车」等诗。
- id: guji-连雅堂-event-tongshi-start
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-2
  title_zh: 着手搜集文献、发愤修《台湾通史》
  date: '1908'
  precision: year
  is_circa: true
  year_of: 1908
  description: 感台湾无史、文献将湮，发愿撰《台湾通史》，广搜遗文旧档，积年纂述。
- id: guji-连雅堂-event-tongshi-draft
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-2
  title_zh: 《台湾通史》全书脱稿
  date: '1918'
  precision: year
  is_circa: true
  year_of: 1918
  description: 历十余年而成稿，纪、志、传备具，记台湾三百年之事。
- id: guji-连雅堂-event-tongshi-publish
  type: endeavor
  endeavor_id: guji-连雅堂-endeavor-2
  title_zh: 《台湾通史》梓行问世
  date: '1920'
  precision: year
  is_circa: false
  year_of: 1920
  description: 《台湾通史》刊行，为台湾史上第一部通史体著作，传布甚广。
- id: guji-连雅堂-event-death
  type: death
  title_zh: 连雅堂卒
  date: '1936'
  precision: year
  is_circa: false
  year_of: 1936
  description: 连横病逝，年五十有九；所遗《台湾通史》及诗文诸作，为后世所重。
