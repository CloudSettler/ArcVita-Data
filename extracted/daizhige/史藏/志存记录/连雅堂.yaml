person:
  qid: guji-连雅堂
  name_zh: 连雅堂
  names:
    zh: 连横，字雅堂（又字武公，号剑花）
    en: Lian Heng (courtesy name Yatang)
  lifespan:
    birth:
      date: 1878
      precision: year
      is_circa: false
      raw: 清光绪四年（戊寅）
    death:
      date: 1936
      precision: year
      is_circa: false
      raw: 民国二十五年病逝
  birth_date: 1878
  death_date: 1936
  era: 清末至日据台湾时期
  reign_ref: 清光绪、宣统；日本明治、大正、昭和
  archetype: 诗人、史家、报人
  dilemmas:
  - 日据之下汉学式微，须以诗文与著史维系汉文化之存续
  - 身居殖民地而心系中华文化，于谋生、办报与著述之间取舍
  lesson: 以史笔与诗心存续斯文，乱世之中尤见文化担当。
  summary_first_person: 我连横，字雅堂，戊寅年生。宣统元年加盟栎社，与雾峰林氏及台湾中部吟友击钵分笺、以风雅道义相切磋；又发愤修撰《台湾通史》，欲存台湾三百年之文献于不坠。
  source_urls:
  - https://zh.wikipedia.org/wiki/連橫_(歷史學家)
