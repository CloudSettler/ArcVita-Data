  date: 1894-09-17
  year_of: 1894
  type: endeavor
  title_zh: 随北洋舰队护运铭军八营至大东沟，列阵备敌
  description: 八月十八日午初，遥见西南黑烟丛起，各舰起锚迎敌，列两翼阵式，致远在十舰之列。
- id: guji-邓世昌-event-battle-death
  date: 1894-09-17
  year_of: 1894
  type: endeavor
  title_zh: 大东沟海战中致远沉没，邓世昌及全舰二百五十人阵亡
  description: 致远骤受重伤，管带邓世昌正欲冲锋陷敌，乃猝为敌雷所中，转舵入队，随即沉没。邓世昌及大副陈金揆以次全舰员勇二百五十人均阵亡。
  participants:
  - 邓世昌
  - 陈金揆
- id: guji-邓世昌-event-death
  date: 1894-09-17
  year_of: 1894
  type: death
  title_zh: 邓世昌殉国
  description: 战后李鸿章奏称其首先攻阵击毁敌船，遇救出水，自以阖船俱没，义不独生，奋掷自沉，忠勇性成，一时称叹。
- id: guji-邓世昌-event-posthumous
  date: 1894-09-18
  year_of: 1894
  type: honor
  title_zh: 李鸿章奏请照提督例从优议恤并拟请予谥
  description: 致远管带邓世昌，经远管带林永升，大副陈金揆，争先猛进，死事最烈。请将邓世昌、林永升照提督例从优议恤，且以官阶较崇，拟请予谥。
