person:
  qid: guji-邓凯
  name_zh: 邓凯
  names:
    zh: 邓凯
    en: Deng Kai
  lifespan:
    birth:
      date: 约1620
      precision: year
      is_circa: true
      raw: 江西吉安人，生年不详，约明末生
    death:
      date: 约1680
      precision: year
      is_circa: true
      raw: 永历被难后遁迹为僧，卒年不详
  birth_date: 约1620
  death_date: 约1680
  era: 明末清初
  reign_ref: 南明永历
  archetype: 扈从孤臣
  dilemmas:
  - 足伤得免于咒水之难，独生而同袍尽殁，何以自处
  - 君亡国破之后，殉死与存身记史，何者为忠
  lesson: 独存非幸，秉笔存真即是以身殉国
  summary_first_person: 余吉安邓凯，官都督同知，随扈永历自滇入缅。辛丑七月十九日咒水之难，余以足伤留侍行在得免，眼见四十二臣骈戮，宫闱惊散。及上还滇被难，余遁迹为僧，追录己亥以后缅甸播迁始末为也是录，以收什一于百千，昭忠奸于后世。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/志存记录/也是录.md
  - https://daizhige.org/史藏/志存记录/也是录.html
endeavors:
- id: guji-邓凯-endeavor-1
  title_zh: 随扈永历播迁入缅
  summary: 自永昌经腾越入缅甸亚哇，护驾左右，历铁壁关之乱与芒漠弃械，驻者梗草房，备尝寄寓之苦
  phases:
  - key: brewing
    name: 溪畿起行至永昌
    labels:
      zh: 扈从西迈
    start_date: 1659-01-08
    highlight_event_id: guji-邓凯-event-ru缅
  - key: breakthrough
    name: 腾越入缅关
    labels:
      zh: 弃械入关
    start_date: 1659-02-20
    highlight_event_id: guji-邓凯-event-ru缅
  - key: climax
    name: 亚哇对河驻跸
    labels:
      zh: 寄寓者梗
    start_date: 1659-05-20
    highlight_event_id: guji-邓凯-event-zhegeng
  - key: closure
    name: 咒水屠灭前夜
    labels:
      zh: 众叛亲离
    start_date: 1661-09-11
    highlight_event_id: guji-邓凯-event-zhoushui
  decisions:
  - date: 1659-02-20
    title_zh: 遵旨去戎备入缅关
    rationale: 缅人要去弓矢刀杖，马吉翔传旨命悉去，虽知受制，惟恐惊扰缅人致驾不能进，不得不从
  - date: 1661-09-11
    title_zh: 足伤留侍不行饮咒水
    rationale: 昔骂吉翔被摔伤足不能行，遂留守行殿侍上，因此得免于难，非敢避事，实天留余以见证
- id: guji-邓凯-endeavor-2
  title_zh: 余生追录撰成也是录
  summary: 永历还滇被难后遁迹为僧，追录永历十二年至十六年缅甸君臣事迹，成自非逸史编也是录以传信史
  phases:
  - key: brewing
    name: 清师出塞移跸
    labels:
      zh: 目击北辕
    start_date: 1661-12-25
    highlight_event_id: guji-邓凯-event-beinan
  - key: breakthrough
    name: 上入滇被难
    labels:
      zh: 国祀遂斩
    start_date: 1662-06-03
    highlight_event_id: guji-邓凯-event-beinan
  - key: climax
    name: 遁迹为僧
    labels:
      zh: 削发存身
    start_date: 1662-06-10
    highlight_event_id: guji-邓凯-event-beinan
  - key: closure
    name: 缮录也是录
    labels:
      zh: 以史续命
    start_date: 1663-01-01
    highlight_event_id: guji-邓凯-event-beinan
  decisions:
  - date: 1662-06-03
    title_zh: 不殉而遁迹为僧
    rationale: 上已殒身贼手，太后国母俱亡，死无以益社稷，不如存残躯录缅事，使忠奸罪状昭然
  - date: 1663-01-01
    title_zh: 追录己亥以后事成一卷
    rationale: 缅甸播迁难征文献，从跸故臣惟余独在，若不据实直书，则辍耕无录，百千俱泯，故起溪畿讫被难，详记始末
events:
- id: guji-邓凯-event-birth
  type: birth
  title_zh: 生于江西吉安
  date: 1620-01-01
  year_of: 1620
  is_circa: true
  description: 明末生于江西吉安府，早年从军，后官至都督同知，随扈永历
- id: guji-邓凯-event-ru缅
  type: career
  title_zh: 随驾自永昌入缅甸
  date: 1659-02-05
  year_of: 1659
  description: 永历十二年十二月十五日帝自溪畿起行，十三年正月初四至永昌，闰正月下营奔散，经铁壁关入缅关，抵芒漠，凯扈从在列
- id: guji-邓凯-event-zhegeng
  type: career
  title_zh: 驻者梗斥骂马吉翔伤足
  date: 1659-10-11
  year_of: 1659
  description: 永历十三年九月十九日缅人进谷，马吉翔徇私散给，凯大骂吉翔于行殿，为其旗鼓吴承爵摔仆伤足，遂不能行，为后日得免之由
- id: guji-邓凯-event-zhoushui
  type: career
  title_zh: 咒水之难足疾得免
  date: 1661-09-11
  year_of: 1661
  description: 永历十五年七月十九日缅人邀饮咒水，马吉翔李国泰胁众俱行，凯以足疾得免，诸臣四十二员被缚骈杀，黔国公沐天波等击伤缅兵而死，从上入缅者残无噍类
- id: guji-邓凯-event-beinan
  type: career
  title_zh: 上被难后为僧著也是录
  date: 1662-06-03
  year_of: 1662
  description: 永历十六年四月十八日上在滇被难，四月初四命凯带小子出外，凯得脱，遁迹为僧，追录永历十二年至十六年事成也是录一卷
- id: guji-邓凯-event-death
  type: death
  title_zh: 遁迹为僧后卒
  date: 1680-01-01
  year_of: 1680
  is_circa: true
  description: 永历亡后削发为僧以终，邵廷采西南纪事有传，卒年不详
