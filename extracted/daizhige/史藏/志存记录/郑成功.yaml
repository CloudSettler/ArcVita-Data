events:
- id: guji-郑成功-event-birth
  title_zh: 生于日本平户
  date: 1624-08-26
  year_of: 1624
  place_zh: 日本平户
  description: 翁氏梦巨鱼触膺而生芝龙命迎归年七岁名森字大木通春秋孙吴喜击剑事母以孝闻
- id: guji-郑成功-event-tuojinmen
  title_zh: 谏父不降遁归金门
  date: 1646-09-01
  year_of: 1646
  place_zh: 安平金门
  description: 芝龙劫众奉表北降成功叩马谏以海内耻作苍头奴不可脱渊鸿逵亦谏不听成功遁归金门举义
- id: guji-郑成功-event-gulangyu
  title_zh: 泊鼓浪屿令鸿逵镇金门
  date: 1647-01-01
  year_of: 1647
  place_zh: 鼓浪屿
  description: 令鸿逵镇金门芝豹芝鹏守安平自率舟师泊鼓浪屿奉鲁王会杨耿郑联兵于长垣
- id: guji-郑成功-event-haicheng
  title_zh: 克海澄破九都
  date: 1647-03-07
  year_of: 1647
  place_zh: 海澄
  description: 二月克海澄破九都令叔父香守石尾港攻漳平不利彩克漳浦郧西王复建宁邵武
- id: guji-郑成功-event-quanzhou
  title_zh: 会战泉州桃花山围泉州
  date: 1647-08-01
  year_of: 1647
  place_zh: 泉州桃花山
  description: 会鸿逵于桃花山沈佺期起兵应之大败提督赵国佐遂围泉州分伏袭杀参将解应龙
- id: guji-郑成功-event-dongzheng
  title_zh: 统师东征登陆台湾
  date: 1661-04-30
  year_of: 1661
  place_zh: 鹿耳门
  description: 亲统舟师自金厦横渡登陆鹿耳门度七鲲身形胜围台湾赤嵌二城断荷兰援路
- id: guji-郑成功-event-taiwan
  title_zh: 收复台湾驱揆一
  date: 1662-02-01
  year_of: 1662
  place_zh: 台湾城
  description: 迫荷兰揆一王降复台湾全岛抚土番立寮寨屯垦以存明朔汉家衣冠
- id: guji-郑成功-event-death
  title_zh: 卒于台湾
  date: 1662-06-23
  year_of: 1662
  place_zh: 台湾
  description: 经画未竟病卒于台湾遗命守台土以延国脉郑氏三世基业自此定
