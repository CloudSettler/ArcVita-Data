person:
  qid: guji-郑板桥
  name_zh: 郑板桥
  names:
    zh: 郑板桥
    en: Zheng Banqiao
  lifespan:
    birth:
      date: 1693
      precision: year
      is_circa: true
      raw: 康熙三十二年
    death:
      date: 1765
      precision: year
      is_circa: true
      raw: 乾隆三十年
  birth_date: 1693
  death_date: 1765
  era: 清
  reign_ref: 康熙、雍正、乾隆
  archetype: 书画家·扬州八怪
  dilemmas:
  - 为官清廉恤民与官场积习之间的冲突，终以罢官归扬州卖画为生
  - 文人清高与鬻画谋生之间的抉择，明码标价卖画而不以为耻
  lesson: 艺术当自出胸臆，不拘古法；为人当刚直恤民，虽穷不失其节
  summary_first_person: 我郑燮，号板桥，以诗书画三绝名世，尤擅兰竹。乾隆间我曾知潍县，因为民请赈忤大吏而去官，归扬州以鬻书画自给。扬州天宁寺畔青莲斋曾悬我手书之联："从来名士能评水，自古高僧爱斗茶。"
  source_urls:
  - https://zh.wikipedia.org/wiki/郑板桥
