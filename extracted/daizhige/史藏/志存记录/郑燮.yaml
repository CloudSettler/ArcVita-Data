  decisions:
  - date: 1726-01-01
    title_zh: 灯下焚家中旧奴契永不用券
    rationale: 不留把柄以苛求抑勒存心为人即是为己免后世子孙借口生祸
  - date: 1743-01-01
    title_zh: 持俸南归挨户散给宗族故旧邻里
    rationale: 葬亲旁众坟而得官是夺众人福泽当以金尽为止酬恤贫亲孤儿旧学
  - date: 1746-01-01
    title_zh: 待佃户以礼称客户不逼偿
    rationale: 主客相对无贵贱之别士居四民之末当体貌怜悯以农为天下养命之源
- id: guji-郑燮-endeavor-2
  title_zh: 诗书文章教弟训子
  summary: 寄书十六通训舍弟论文读书作诗之道主精读经史少陵放翁之辨戒过目成诵戒笼鸟杀生以忠厚养家风
