  decisions:
  - date: 1735-01-01
    title_zh: 教弟为文求新鲜秀活忌凄怨
    rationale: 文气关福泽科名欲如春江妙境令人悦心娱目以厚福泽不学刻削孤峭
  - date: 1744-06-15
    title_zh: 定读书次第四书六经左史庄骚韩杜为主
    rationale: 六经至矣家常日用即大道二十一史不可废而风月伤道之书终将自焚
  - date: 1750-01-01
    title_zh: 禁笼鸟系蜻蜓缚螃蟹教儿忠厚
    rationale: 天地化育一蚁一虫皆可爱念读书中举是小事明理作好人才是大事
