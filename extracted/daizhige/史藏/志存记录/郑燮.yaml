  dilemmas:
  - 富贵贫贱皆关善淫勤惰当自奋不怨天尤人
  - 为官泽民与保身免祸当以厚农恤民为本
  - 读书博杂与精专当舍浮博而求精义明理
  lesson: 焚券去把柄存厚待人以农为本以精读养心以仁爱全物方得福泽长远
  summary_first_person: 吾兴化郑燮自号板桥由秀才举人进士而宰范县潍县平生恶苛刻喜忠厚焚家中奴契不用书券散俸周宗族故旧以农夫为天下第一等人读书贵精不贵博作诗贵立题以端人品又戒杀生养鸟以长子弟仁心愿存厚去浇以全天理
