  decisions:
  - date: 1635-04
    title_zh: 合粤兵设伏火攻刘香巨舰
    rationale: 以沿河设兵烧己舰引燃寇舰，投水以腰牌为号而大破之，遂绝闽粤江浙大患
  - date: 1645-08
    title_zh: 与鸿逵彩等奉唐王监国即位
    rationale: 南都失守闽中无主，借翊戴之功居定策首位以控六部九卿之权
events:
- id: guji-郑芝龙-event-birth
  date: 1604
  year_of: 1604
  title_zh: 生于泉州南安石井
  description: 郑绍祖子，兄弟四人排行居长，字飞黄，小名一官，幼时容止秀丽，十岁戏掷石误中太守蔡善继而得贵语
- id: guji-郑芝龙-event-1621-join
  date: 1621
  year_of: 1621
  title_zh: 入颜振泉党后被推为魁
  description: 与弟芝虎入台湾投南海盗魁颜振泉，劫暹罗好货四船分利不取，振泉死后插剑米中祷天，剑跃而众推为首，纵横闽浙海上
- id: guji-郑芝龙-event-1628-fuzhao
  date: 1628-07
  year_of: 1628
  title_zh: 降于福建巡抚熊文灿
  description: 闽中洊饥而芝龙截粟势大，经王猷邓良知议抚，兵部议招，遂率所部归文灿，受命为将以图报效
- id: guji-郑芝龙-event-1635-xiang
  date: 1635-04
  year_of: 1635
  title_zh: 田尾远洋逼死刘香平海盗
  description: 奉命合粤兵击刘香，于五羊造舰，沿河设兵火攻，追迫至田尾远洋，香势蹙自焚溺死，屠阿丑亦擒斩，海氛澄清
- id: guji-郑芝龙-event-1645-longwu
  date: 1645-08
  year_of: 1645
  title_zh: 拥唐王即位封平虏侯太师
  description: 福王败后与郑鸿逵郑彩等奉唐王聿键于福州即位改元隆武，加封平虏侯太师，以按察司为第而权倾闽中
- id: guji-郑芝龙-event-death
  date: 1661-11-24
  year_of: 1661
  title_zh: 降清后遇害于北京
  description: 隆武败后率部降清以存家族，羁留京师多年，至顺治十八年因成功抗清不降而被戮，结束海商军阀一生
