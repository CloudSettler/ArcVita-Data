  summary_first_person: 我是泉州南安石井人郑芝龙，小名一官，字飞黄，少年奔海而居平户，后入台湾投颜振泉，遂被推为十寨之魁而纵横闽浙，受抚于熊文灿后剿李魁奇钟斌刘香而澄清海氛，累官南澳总兵封南安伯，复拥唐王于福州进平虏侯加太师，终为保全家族而降清
