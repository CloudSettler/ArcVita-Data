    title_zh: 与芝虎入振泉党请舰劫略
    rationale: 以劫获多寡卜命，分利不取以结九酋之心，遂富甲十寨而得众望
  - date: 1628-07
    title_zh: 应熊文灿招抚率部归明
    rationale: 感蔡善继旧恩且察剿难猝灭，借抚立功赎罪以求爵秩登岸
- id: guji-郑芝龙-endeavor-2
  title_zh: 澄清海氛显位与拥戴隆武
  summary: 任游击后焚荷兰船破大帽洞，擒李魁奇灭钟斌，田尾远洋逼死刘香而海盗悉平，累迁南澳总兵封南安伯，复拥唐王即位福州进平虏侯太师
  phases:
  - key: brewing
