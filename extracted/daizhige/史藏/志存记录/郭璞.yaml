endeavors:
- id: guji-郭璞-endeavor-1
  title_zh: 校注山海经存异闻
  summary: 以汉魏旧注为本，博采图赞异说，校定山海经并为注，存山川神物之旧
  phases:
  - key: brewing
    name: 少好古文博览群书
    labels:
      zh: 酝酿
    start_date: 0290
    highlight_event_id: guji-郭璞-event-youth
  - key: breakthrough
    name: 辑注山经海经成一家
    labels:
      zh: 突破
    start_date: '0310'
    highlight_event_id: guji-郭璞-event-zhushan
  - key: climax
    name: 山海经注通行于世
    labels:
      zh: 高潮
    start_date: '0316'
    highlight_event_id: guji-郭璞-event-zhushan
  - key: closure
    name: 注本垂后启后世诸家
    labels:
      zh: 收束
    start_date: '0324'
    highlight_event_id: guji-郭璞-event-death
  decisions:
  - date: '0310'
    title_zh: 以图赞互证决山海真伪
    rationale: 山海经传抄错乱图说分离，故以旧图及穆天禹本诸说参校，不妄改经文而以注发明
  - date: '0316'
    title_zh: 存疑而不强解神怪
    rationale: 怪兽神国难据常理，故详引异闻而阙所不知，使后人得见旧说本貌
- id: guji-郭璞-endeavor-2
  title_zh: 以术学历仕两晋
  summary: 以五行卜筮擅名，历佐宣城王敦诸府，著葬书相术而以谶言见忌
  phases:
  - key: brewing
    name: 精研易卜阴阳之学
    labels:
      zh: 酝酿
    start_date: '0300'
    highlight_event_id: guji-郭璞-event-youth
  - key: breakthrough
    name: 避乱南渡名动江东
    labels:
      zh: 突破
    start_date: '0311'
    highlight_event_id: guji-郭璞-event-nandu
  - key: climax
    name: 佐王敦而数陈谶谏
    labels:
      zh: 高潮
    start_date: '0322'
    highlight_event_id: guji-郭璞-event-jian
  - key: closure
    name: 忤敦见杀年四十九
    labels:
      zh: 收束
    start_date: '0324'
    highlight_event_id: guji-郭璞-event-death
  decisions:
  - date: '0311'
    title_zh: 卜筮南渡避中原之乱
    rationale: 永嘉丧乱中原不可居，故筮得南行之吉而渡江依江东王氏
  - date: '0324'
    title_zh: 直言敦败而不附逆
    rationale: 知王敦必败不肯起兵相从，宁以正道守节而不以苟免改卜
events:
- id: guji-郭璞-event-birth
  title_zh: 生于河东闻喜
  date: '0276'
  year_of: '0276'
  place_zh: 河东闻喜
  description: 晋泰始十二年郭璞生，字景纯，少好经术博学有高才
- id: guji-郭璞-event-youth
  title_zh: 博学好古精通方术
  date: '0300'
  year_of: '0300'
  place_zh: 河东洛阳
  description: 弱冠博洽经传，尤善五行天文卜筮之术，注尔雅楚辞以显名
- id: guji-郭璞-event-nandu
  title_zh: 永嘉南渡依王导
  date: '0311'
  year_of: '0311'
  place_zh: 江南建康
  description: 中原丧乱卜筮南行之吉，渡江依琅琊王氏，辟为宣城太守军谘祭酒
- id: guji-郭璞-event-zhushan
  title_zh: 校注山海经成书
  date: '0316'
  year_of: '0316'
  place_zh: 建康
  description: 考旧图校经文，分山经海经为注，发明神兽山川名物，使山海经别为完书而通行
- id: guji-郭璞-event-jian
  title_zh: 谏王敦而预言其败
  date: '0324'
  year_of: '0324'
  place_zh: 姑孰
  description: 王敦谋逆使筮之，郭璞直言无成之象，又上疏陈谶，敦怒不听其谏
- id: guji-郭璞-event-death
  title_zh: 忤王敦见杀
  date: '0324'
  year_of: '0324'
  place_zh: 姑孰
  description: 以不附逆忤王敦意，被诬害于南冈，年四十九，明帝即位追赠弘农太守
