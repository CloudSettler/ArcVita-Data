- id: guji-鄂尔泰-event-birth
  type: birth
  date: '1677'
  year_of: 1677
  description: 鄂尔泰生，西林觉罗氏，后为清代名臣。
- id: guji-鄂尔泰-event-career-1
  type: career
  date: '1726'
  year_of: 1726
  description: 雍正年间受重用，历官云贵总督、大学士，推行改土归流，成为朝廷柱石。
- id: guji-鄂尔泰-event-career-2
  type: milestone
  date: '1736'
  year_of: 1736
  description: 乾隆元年正月奉旨，与张廷玉、朱轼、福敏、徐元梦、邵基同为皇子师傅，(按原文)钦天监择二十四日吉日开学，行拜师长揖之礼，亲承『严有益而宽多损』之谕。
- id: guji-鄂尔泰-event-death
  type: death
  date: '1745'
  year_of: 1745
  description: 鄂尔泰卒，身后曾以大学士之尊配享朝议（其名迹载于《澄怀主人年谱》等）。
