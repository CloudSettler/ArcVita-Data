  birth_date: '1677'
  death_date: '1745'
  era: 清代雍正—乾隆朝
  reign_ref: 雍正、乾隆
  archetype: 帝师重臣
  dilemmas:
  - 身为皇子师傅，须在教导皇子时拿捏严厉与宽和之间的分寸，既要遵奉皇帝『严有益而宽多损』的家法，又应恪尽师道
  - 身居大学士高位，须在满汉官僚与皇室内廷之间周旋，平衡朝局
  lesson: 设教之道，严有益而宽多损；为师者殚心教导、敢任严厉，方成储君养正之功
  summary_first_person: 我鄂尔泰于雍正、乾隆两朝位至大学士，乾隆元年正月奉旨与张廷玉、朱轼等同为皇子师傅，钦天监择吉开学，亲预青宫毓德之礼，为陶淑涵养皇子尽心尽力。
  source_urls:
  - ' https://zh.wikipedia.org/wiki/鄂尔泰'
