events:
- id: guji-金庾信-event-birth
  date: 0595
  year_of: 595
  title_zh: 金庾信生
  description: 金官伽倻末王之后，父金舒玄，母文明夫人，生于新罗真平王之世。
- id: guji-金庾信-event-hwarang
  date: '0610'
  year_of: 610
  title_zh: 年十五为花郎，领龙华香徒
  description: 少年入花郎道，统龙华香徒，教习门徒，蓄养人望。
- id: guji-金庾信-event-early-campaign
  date: 0629
  year_of: 629
  title_zh: 早年随军征讨，崭露将才
  description: 佐攻高句丽娘臂城等役，以奇谋奋勇敢战，军中知名。
- id: guji-金庾信-event-alliance
  date: 0648
  year_of: 648
  title_zh: 助结罗唐同盟之谋
  description: 善德、真德之世以后，力主与唐通好结盟，共图百济高句丽。
- id: guji-金庾信-event-hwangsanbeol
  date: 0660-07
  year_of: 660
  title_zh: 黄山伐之战大破百济
  description: 为罗唐联军新罗统帅，于黄山伐破百济阶伯军，遂与唐军会师灭百济。
- id: guji-金庾信-event-goguryeo-fall
  date: 0668
  year_of: 668
  title_zh: 引兵会唐军围平壤，高句丽亡
  description: 率新罗大军会唐师围平壤城，高句丽降，三国归一。
- id: guji-金庾信-event-death
  date: '0673'
  year_of: 673
  title_zh: 金庾信卒
  description: 以太大角干之位薨，享年七十九，新罗追念其统一之功。
