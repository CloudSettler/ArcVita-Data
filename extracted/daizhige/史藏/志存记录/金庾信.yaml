  dilemmas:
  - 出身金官伽倻王族之后，身事新罗，故国与所事之国忠义如何两全
  - 唐罗联军之中，既须借唐之力灭百济高句丽，又要保全新罗疆土与自主
  lesson: 处亡国之后而能以功业再造山河，忠诚与谋略兼备者，方能在乱世中成统一之业。
  summary_first_person: 我金庾信，金官伽倻末王之裔，少入花郎，领龙华香徒，后佐新罗三代，为帅灭百济、平高句丽，卒成三国一统之功。
