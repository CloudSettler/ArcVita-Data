  dilemmas:
  - 唐吏苛虐而忠诚难表，忍辱则部族离散，抗争则背君之名
  - 附唐守藩与联蕃自立之间，存社稷与全忠义不可兼得
  lesson: 忠而见疑须早断，借势立国终以德化安民方能久固
  summary_first_person: 吾姓蒙名阁罗凤，为云南王长子，少習字人之术，从军立功，袭位之后竭忠事唐，奈奸佞构陷，诉冤不察，不得已绝唐附蕃，转祸为安，开地置城，设官立法，惟愿边隅宁静，众庶富足
