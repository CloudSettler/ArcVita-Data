- id: guji-阎应元-event-enter
  date: 1645-07
  year_of: 1645
  title_zh: 江阴义起，阎应元入城主盟
  description: 顺治二年闰六月江阴义兵起，义民坚拒清兵，阎应元入城主持守御事宜。
