- id: guji-阎应元-event-defense
  date: 1645-07
  year_of: 1645
  title_zh: 带发效忠，死守江阴孤城
  description: 率六万义民固守孤城八十一日，清兵至城下者二十四万，攻城死者六万七千有奇，杀伤极众。
  category: military
  entities:
  - 江阴城
  - 清兵
  - 阎应元
- id: guji-阎应元-event-fall
  date: 1645-08-21
  year_of: 1645
  title_zh: 江阴城陷，阖城殉节
  description: 八月二十一日城破，全城男妇自尽不屈者近十万，二十三日满城封刀，仅余五十三人。
  category: military
  entities:
  - 江阴城
  - 清兵
- id: guji-阎应元-event-inscription
  date: 1645-08-21
  year_of: 1645
  title_zh: 城破题联以明死节之志
  description: 城破日，书于东城角堞楼：“八十日带发效忠，表太祖十七朝人物；六万人同心死义，留大明三百里江山。”
  category: cultural
  entities:
  - 阎应元
- id: guji-阎应元-event-death
  date: 1645-08-21
  year_of: 1645
  title_zh: 阎应元殉城死难
  description: 城破后不屈守节而死，遗笔题七里庙壁：“露胔白骨满疆场，万死孤臣未肯降。”
  category: death
