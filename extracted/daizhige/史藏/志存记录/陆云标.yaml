      raw: 清嘉庆年间约生
    death:
      date: 1875
      precision: year
      is_circa: true
      raw: 同治年后卒年不详
  birth_date: 1815
  death_date: 1875
  era: 清
  reign_ref: 咸丰
  archetype: 忠义守正文士
  dilemmas:
  - 病躯守镇待死与携亲避难求生之抉择
  - 团练保镇敛财害民与杜门谢客自守之冲突
  - 赴苏进贡苟安与守忠义拒从贼之大义
  lesson: 忠义不可因危难而易心，保民团练不可借名渔利，从贼进贡终为名教罪人
  summary_first_person: 余锦溪后学陆云标，庚申贼逼陈墓，病守不去，目击牙侩勾勇敛财，伪官科派害民，屡拒进贡之诱，病余秉笔记略，以存真相而明忠义
