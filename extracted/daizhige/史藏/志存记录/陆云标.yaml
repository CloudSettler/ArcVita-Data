endeavors:
- id: guji-陆云标-endeavor-1
  title_zh: 病守陈墓拒贼进贡
  summary: 庚申苏城陷后病居陈墓，不附团练敛钱，不随进贡通贼，存亲避祸而守忠义
  phases:
  - key: brewing
    name: 苏陷镇扰病卧杜门
    labels:
      zh:
      - 避难纷至
      - 病卧谢客
    start_date: 1860-04-05
    highlight_event_id: guji-陆云标-event-tuanlian
  - key: breakthrough
    name: 团练变乱被勇凌辱
    labels:
      zh:
      - 乡勇横行
      - 毁家劫物
    start_date: 1860-04-20
    highlight_event_id: guji-陆云标-event-tuanlian
  - key: climax
    name: 力拒赴苏进贡之诱
    labels:
      zh:
      - 忠义明辨
      - 拒通贼
    start_date: 1860-06-12
    highlight_event_id: guji-陆云标-event-jujin
  - key: closure
    name: 避乡就医寂处自守
    labels:
      zh:
      - 携亲避唐里
      - 穷乡养病
    start_date: 1860-07-03
    highlight_event_id: guji-陆云标-event-jujin
  decisions:
  - date: 1860-04-20
    title_zh: 病中不附敛钱团练
    rationale: 团练本以保镇今适害人，不与牙侩同谋敛财，宁杜门待死不把持捐数
  - date: 1860-06-12
    title_zh: 严拒陈瓞甫进贡之说
    rationale: 既读圣贤书当知忠义二字，绝无通贼进贡之理，不甘心为悖逆之事
- id: guji-陆云标-endeavor-2
  title_zh: 目击沦陷秉笔记略
  summary: 详记陈墓镇伪官设馆科派钱粮始末，揭王文竹陈骏台等从贼害民之实
  phases:
  - key: brewing
    name: 镇空贼扰风鹤频闻
    labels:
      zh:
      - 虬泽烟火
      - 举家舟避
    start_date: 1860-07-10
    highlight_event_id: guji-陆云标-event-jujin
  - key: breakthrough
    name: 伪馆设立发蓄改装
    labels:
      zh:
      - 伪帅接印
      - 禁止剃发
    start_date: 1860-08-01
    highlight_event_id: guji-陆云标-event-jilue
  - key: climax
    name: 科派银米勒索封押
    labels:
      zh:
      - 按图均派
      - 拘拿封店
    start_date: 1860-09-01
    highlight_event_id: guji-陆云标-event-jilue
  - key: closure
    name: 九月底成记略存真
    labels:
      zh:
      - 字字皆真
      - 祷盼荡平
    start_date: 1860-09-27
    highlight_event_id: guji-陆云标-event-jilue
  decisions:
  - date: 1860-09-27
    title_zh: 直书王陈朱等从贼之罪
    rationale: 团练敛钱害人在先，进贡通贼在后，若不记其陷害乡勇逼充伪官科派之实，则一方百姓死于贼手与死于奸徒之手皆无据
  - date: 1860-09-27
    title_zh: 略而不饰以存信史
    rationale: 词意虽激而字字皆真，不粉饰不增衍，专为后人查究奸逆留证，并日夜祷大兵荡平
events:
- id: guji-陆云标-event-birth
  title_zh: 出生于锦溪
  date: 1815
  year_of: 1815
  summary: 清嘉庆年间约生于锦溪，少读圣贤书，后以诸生自守乡里
- id: guji-陆云标-event-tuanlian
  title_zh: 团练变乱病中被凌
  date: 1860-04-20
  year_of: 1860
  summary: 王文竹招匪办团练勒捐，苏陷后更纵勇横行，四月二十晚郑焕章率百余人毁其堂室劫钟饰而去，云标扶痛避唐里
- id: guji-陆云标-event-jujin
  title_zh: 拒陈瓞甫进贡之议
  date: 1860-06-12
  year_of: 1860
  summary: 陈瓞甫劝赴苏进贡，朱葵畦等邀同行，云标以忠义二字峻拒，王文竹等竟自办礼赴苏通李姓贼首
- id: guji-陆云标-event-jilue
  title_zh: 成庚申年陈墓镇记略
  date: 1860-09-27
  year_of: 1860
  summary: 目击郑焕章踞资福庵设伪馆，科派银米封店拿人，遂于九月二十七日成记略，揭王文竹陈骏台朱南昀甘心从贼之实
- id: guji-陆云标-event-death
  title_zh: 卒于乡里
  date: 1875
  year_of: 1875
  summary: 庚申后寂处穷乡，卒年不详，惟以此篇记略传世
