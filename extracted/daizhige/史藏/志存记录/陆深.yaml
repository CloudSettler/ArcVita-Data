events:
- id: guji-陆深-event-birth
  title_zh: 出生
  date: 1477
  year_of: 1477
  description: 成化十三年生于南直隶松江府上海
  type: birth
- id: guji-陆深-event-death
  title_zh: 逝世
  date: 1544
  year_of: 1544
  description: 嘉靖二十三年卒
  type: death
- id: guji-陆深-event-jinshi
  title_zh: 弘治十八年进士入翰林
  date: 1505-01-01
  year_of: 1505
  description: 乙丑科进士，选庶吉士，授编修，历侍讲学士
- id: guji-陆深-event-beihuan-start
  title_zh: 四月二十一日谢赏先行北上
  date: 1539-04-21
  year_of: 1539
  description: 于丽正门谢赏受朝后，过内阁直庐观御制宣谕文，遂发出循汉江而北宿丰乐
- id: guji-陆深-event-duhe
  title_zh: 五月初一渡河抵北岸候驾
  date: 1539-05-01
  year_of: 1539
  description: 自郑州至荣泽借寓巡抚公馆，晚晴渡河抵北岸宿舟中候驾
- id: guji-陆深-event-zhenji
  title_zh: 五月初三奏请赈济河南饥荒
  date: 1539-05-03
  year_of: 1539
  description: 以钧州迤北至河饥荒白巡抚胡缵宗，又与辅臣面闻，上动容传发银二万两备赈
- id: guji-陆深-event-kaoding
  title_zh: 途中观漳河疑冢赵州桥碑刻
  date: 1539-05-06
  year_of: 1539
  description: 自漳岸至磁州观曹操疑冢土丘星散，过赵州桥观驴迹，柏林寺观透灵碑
- id: guji-陆深-event-huangong
  title_zh: 五月十五日随驾还宫成录
  date: 1539-05-15
  year_of: 1539
  description: 五更出候驾自宣武门入过大明门车驾还宫，是行往返六十日驿路五千四百余里
