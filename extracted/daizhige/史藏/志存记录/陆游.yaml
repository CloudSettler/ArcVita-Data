  date: 1170-07-29
  year_of: 1170
  place_zh: 镇江金山甘露寺
  description: 入镇江泊西津，谒水府祠，登金山玉鉴堂妙高台及甘露多景楼，观长江形胜及南北往来
- id: guji-陆游-event-guaizhou
