  date: 1170-08-13
  year_of: 1170
  place_zh: 瓜洲真州
  description: 七月一日起瓜洲挂帆至真州，游东园报恩寺，访老道士辨仪真观南北二观本末，继而溯江而西
- id: guji-陆游-event-death
  title_zh: 卒于山阴
  date: 1210-01-26
  year_of: 1210
  place_zh: 越州山阴
  description: 嘉定二年末卒于山阴故里，一生著述甚富，入蜀记为纪行名篇传世
