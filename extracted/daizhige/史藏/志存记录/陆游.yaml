  dilemmas:
  - 久病未堪远役而夔州命下，去留难决
  - 羁旅家累在身而王事在远，亲情与官守相权
  - 目睹山川形胜与时艰而欲有为，才力与时势相违
  lesson: 以日记存一路山川漕运风土人物，于细微处考沿革辨得失，堪为后人治史经世之资
  summary_first_person: 吾陆游字务观，山阴人，乾道五年冬得报差通判夔州，久病之余谋夏初离乡，六年闰夏自乡启行，经杭秀苏常镇金陵，真州瓜洲而入江，沿途以日记所见水道闸堰祠庙碑刻旧闻，集成入蜀记，以存一路实录
  source_urls:
