person:
  qid: guji-陈侃
  name_zh: 陈侃
  names:
    zh: 陈侃
    en: Chen Kan
  lifespan:
    birth:
      date: 1489
      precision: year
      is_circa: true
      raw: 弘治初年左右
    death:
      date: 1545
      precision: year
      is_circa: true
      raw: 嘉靖中后期
  birth_date: 1489
  death_date: 1545
  era: 明
  reign_ref: 嘉靖
  archetype: 奉使儒臣
  dilemmas:
  - 君命在身当冒海道之险而往，抑托辞以避远役而全私身
  - 旧例费用侈靡当遵奉成案，抑裁省华饰以守清约而全名节
  - 群书记载互异当因仍旧说，抑亲究耳目以辨质异而正风闻
  lesson: 奉使不避险而重司命，纪事必核实而祛郢燕，字小必以诚信而守礼制
  summary_first_person: 吾待罪左省，奉诏充正使使琉球，副以高澄，造巨舟于闽，历风涛一月而达那霸，宣诏敕，祭故王尚真，封世子尚清为中山王，还而与高君日纪闻见，志道途山川风俗之实，辨群书之异，成此录以助后使
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/history/records/shi-lu-qiu-lu.md
endeavors:
- id: guji-陈侃-endeavor-1
  title_zh: 充正使册封琉球中山王
  summary: 嘉靖壬辰奉命为正使，与副使高澄造舟福州，甲午渡海历险抵琉球，宣诏祭故王，封尚清，十月还闽复命
  phases:
  - key: brewing
    name: 衔命造舟
    labels:
      zh:
