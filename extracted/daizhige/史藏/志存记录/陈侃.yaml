      - 造舟
    start_date: 1532-08-01
    highlight_event_id: guji-陈侃-event-1532-fengshi
  - key: breakthrough
    name: 南台登舟出洋
    labels:
      zh:
      - 启行
      - 渡海
    start_date: 1534-04-18
    highlight_event_id: guji-陈侃-event-1534-chuhai
  - key: climax
    name: 抵港宣诏祭封
    labels:
      zh:
      - 册封
      - 祭奠
    start_date: 1534-05-25
    highlight_event_id: guji-陈侃-event-1534-digang
  - key: closure
    name: 还闽复命
    labels:
      zh:
      - 归国
      - 复命
    start_date: 1534-10-01
    highlight_event_id: guji-陈侃-event-1534-huanmin
  decisions:
  - date: 1532-05-15
    title_zh: 拒辞使之议而受命南下
    rationale: 君父之命无所逃于天地，领封之说出于己口则为私情，故不听劝辞
  - date: 1533-07-02
    title_zh: 倍价购铁梨木为舵杆
    rationale: 舵乃一船司命，财固当惜而轻重易辨，故宁费以固根本
  - date: 1534-05-01
    title_zh: 裁省金银器饰而守清约
    rationale: 素守清约无事华侈，妄敛妄费足以污名节，故茶酒用银饰而余皆不用
- id: guji-陈侃-endeavor-2
  title_zh: 日纪闻见撰使琉球录
  summary: 与高澄询访往迹，考一统志星槎胜览之异，海上日纪见闻，归而志略辨异，附天妃灵应夷语夷字以贻后使
  phases:
  - key: brewing
    name: 历询往迹考群书
    labels:
      zh:
      - 考据
      - 质疑
    start_date: 1532-05-20
    highlight_event_id: guji-陈侃-event-1532-fengshi
  - key: breakthrough
    name: 海上日纪闻见
    labels:
      zh:
      - 观察
      - 记录
    start_date: 1534-05-08
    highlight_event_id: guji-陈侃-event-1534-chuhai
  - key: climax
    name: 志略辨异成录
    labels:
      zh:
      - 撰述
      - 辨伪
    start_date: 1534-06-15
    highlight_event_id: guji-陈侃-event-1534-digang
  - key: closure
    name: 还闽书序贻后使
    labels:
      zh:
      - 成书
      - 刊布
    start_date: 1534-10-15
    highlight_event_id: guji-陈侃-event-1534-huanmin
  decisions:
  - date: 1533-11-01
    title_zh: 题请查议诏敕请留之例
    rationale: 恐尚清如安南请留诏敕为镇国之宝，坚执则拂敬奉之心，擅许则逾专擅，故先请礼部定夺
  - date: 1534-10-15
    title_zh: 不炫词华而志实辨异
    rationale: 旧载多郢书燕说之类，使事咨诹不可缺略，故道途风俗人物皆得诸亲究而后书
events:
- id: guji-陈侃-event-birth
  kind: birth
  title_zh: 生于浙江鄞县四明
  date: 1489
  year_of: 1489
  summary: 约弘治初年生于四明陈氏，后登进士，官吏科左给事中
- id: guji-陈侃-event-1532-fengshi
  kind: career
  title_zh: 奉诏充册封琉球正使
  date: 1532-08-01
  year_of: 1532
  summary: 嘉靖十一年，世子尚清请袭封，礼部议以给事中为正，行人为副，侃与高澄承乏受命，赐一品服，赍诏敕行
- id: guji-陈侃-event-1534-chuhai
  kind: career
  title_zh: 福州造舟毕由广石出洋
  date: 1534-05-02
  year_of: 1534
  summary: 癸巳至三山访耆民造海船，长十五丈，分二十三舱，甲午三月工毕，四月南台发船，五月朔至广石祭海登舟，初八出海口，南风迅行过钓鱼屿黄毛屿
- id: guji-陈侃-event-1534-digang
  kind: career
  title_zh: 历风涛抵那霸行祭封礼
  date: 1534-05-25
  year_of: 1534
  summary: 十四日夜桅环断板缝开，呼天妃剪发设誓，回舵塞罅得安，泊热壁移山，夷众挽舟，五月二十五日达那霸港，迎恩亭奉诏入馆，既望祭故王尚真于寝庙，宣诏封尚清为中山王
- id: guji-陈侃-event-1534-huanmin
  kind: career
  title_zh: 十月还闽成使琉球录
  date: 1534-10-01
  year_of: 1534
  summary: 事竣遄返，十月朔还闽，与高澄次第闻见为使事纪略群书质异天妃灵应夷语夷字题奏等篇，甲午阳月望日书自序于长春堂
- id: guji-陈侃-event-death
  kind: death
  title_zh: 卒于嘉靖中后期
  date: 1545
  year_of: 1545
  summary: 使还之后历官中外，约嘉靖中后期卒，录行于世为后使索涂之助
