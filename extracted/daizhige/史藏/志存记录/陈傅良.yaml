    rationale: 子谏父不听则号泣随之，虑近习离间而天理感悟，不可徒快苦谏
  - date: 1195
    title_zh: 不附韩侂胄引去归里
    rationale: 宪圣拥立清静之治不可挠，宁肯外补讲学，不以宠利易直道
events:
- id: guji-陈傅良-event-birth
  title_zh: 生于永嘉瑞安
  date: 1137
  year_of: 1137
  place_zh: 温州永嘉
  description: 绍兴七年生于永嘉，早以早秋应举，游太学，治春秋周礼
- id: guji-陈傅良-event-jia-ke
  title_zh: 乾道八年登进士甲科
  date: 1172
  year_of: 1172
  place_zh: 临安
  description: 登甲科授太学录，历国子博士司业，以经义敷畅奏疏洞达见称，考亭视为畏友
- id: guji-陈傅良-event-yin-ju
  title_zh: 中书舍人引裾谏光宗过宫
  date: 1192
  year_of: 1192
  place_zh: 大内御屏下
  description: 光皇命驾北内而慈懿挽留，傅良于百官班中引裾请毋入，大恸于殿下，以子谏父之义号泣而随
- id: guji-陈傅良-event-nei-chan
  title_zh: 翊赞绍熙内禅授中书舍人兼侍读
  date: 1194
  year_of: 1194
  place_zh: 临安大内
  description: 宪圣拥立嘉王，光皇有疾不能丧，傅良与议定策，宁宗即位后授中书舍人兼侍读，直言于朝
- id: guji-陈傅良-event-death
  title_zh: 嘉泰三年卒于桂阳军任上
  date: 1203
  year_of: 1203
  place_zh: 桂阳军
  description: 与韩侂胄不合去国，讲学乡里，晚起知泉州桂阳军，卒于官，止斋集诗传春秋后传行于世
