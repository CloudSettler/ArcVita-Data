    rationale: 欲以春秋周礼明王道，不逐时文工巧之失
  - date: 1188
    title_zh: 藏诗说不与考亭辨彤管城阙
    rationale: 存千七百年女史学校之厚，不欲佐无极王霸之争而毁弃讲义
