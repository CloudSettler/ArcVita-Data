person:
  qid: guji-陈化成
  name_zh: 陈化成
  names:
    zh: 陈化成
    en: Chen Huacheng
  lifespan:
    birth:
      date: '1776'
      precision: year
      is_circa: true
      raw: 道光二十二年（1842）日记称其“六十八岁”，逆推约生于乾隆四十一年（1776）
    death:
      date: '1842-06-16'
      precision: day
      is_circa: false
      raw: 道光二十二年五月初八日辰刻，力竭阵亡于吴淞
  birth_date: '1776'
  death_date: '1842-06-16'
  era: 清嘉庆—道光年间
  reign_ref: 道光
  archetype: 殉国水师统帅·民族英雄
  dilemmas:
  - 孤军守吴淞，两江总督牛鉴所布伏兵接应一哄而散，退则可生、守则必死
  - 英军曾遣渔户寄语，以“去年攻厦门未犯其家”作人情劝其通融，复词甚壮，断然拒绝
  - 年近七十、宿将威名与朝廷防务空虚、军械不全之间的巨大落差
  lesson: 位至提督而隆冬犹著单裤、与弁兵共卧起者，方能于炮火连天之际死守不退；人格之清苦与气节之刚烈，本是一体。
  summary_first_person: 我本海船柁工，曾误入海寇之党，蒙李壮烈伯收用于行伍，随剿蔡牵，积功洊至提督。年近七十驻守吴淞，两年间只居一帐房，与士卒同卧起，隆冬不辞劳苦。道光二十二年五月初八，夷船突入吴淞口，我亲发巨炮击坏大夷船四只，亲兵死伤殆尽，腿、左乳连中炮子，力竭阵亡于海塘。尸身幸赖部兵负归嘉定棺殓，柩至省城，士民公祭于葑门马头。朝廷悯我忠勇捐躯，赏银千两，查明子嗣。五十年水师，以一身殉国，可敬可痛，然我无愧于心。
