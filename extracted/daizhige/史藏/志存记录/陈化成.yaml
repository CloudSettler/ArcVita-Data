  - date: '1842-06-16'
    title_zh: 总督伏兵溃散仍死守炮台不退
    rationale: 逆船突入口门，亟发巨炮击坏大夷船四只；小沙背徐州军无故溃散、海塘不成列，提标亲兵死伤殆尽，仍冒险迎炮，拚死不去，直至左乳中弹阵亡
events:
- id: guji-陈化成-event-birth
  date: '1776'
  year_of: 1776
  name_zh: 出生（约）
  description_zh: 据道光二十二年（1842）日记称其六十八岁逆推，约生于1776年
- id: guji-陈化成-event-join-navy
  date: '1795'
  year_of: 1796
  is_circa: true
  name_zh: 以海船柁工出身投身水师
  description_zh: 本海船柁工，能识水性、耐劳苦，曾入海寇党，旋为李壮烈伯（长庚）收用
- id: guji-陈化成-event-suppress-pirates
  date: '1805'
  year_of: 1806
  is_circa: true
  name_zh: 随李长庚攻剿海寇蔡牵，积功至提督
  description_zh: 日记载“曾随李伯诛海寇”“洊至提戎，颇有威名”，为水军宿将
- id: guji-陈化成-event-wusong-garrison
  date: '1840'
  year_of: 1840
  is_circa: true
  name_zh: 驻防吴淞口，与弁兵共卧起
  description_zh: 两年来驻吴淞口，只一帐房，与弁兵共卧起，绝不言劳；带兵二千人在塘岸帐棚住二十余月，昼夜戒严，百姓无不感服；隆冬犹著单裤，登高如夷
- id: guji-陈化成-event-wusong-standoff
  date: '1842-05-09'
  year_of: 1842
  is_circa: true
  name_zh: 英船环伺吴淞口外，陈化成心如金石、号令严明
  description_zh: 三月至五月间夷船多次驶近吴淞廿里外洋面游奕开炮恫喝；巡抚赞其“心如金石”，英军遣渔户寄语以不犯其家作人情，复词甚壮
- id: guji-陈化成-event-death
  date: '1842-06-16'
  year_of: 1842
  name_zh: 吴淞失守，力战阵亡
  description_zh: 道光二十二年五月初八辰刻，逆船大炮连环轰击，自寅至辰；陈化成先中一腿，亟发巨炮击坏大夷船四只、约伤二百余人；小沙背徐州军溃散后亲兵死伤殆尽，左乳受大炮子，腿肘皆伤，约被群子数百，力竭阵亡，尸在芦柴柴塘之中
- id: guji-陈化成-event-body-recovered
  date: '1842-06-18'
  year_of: 1842
  is_circa: true
  name_zh: 遗骸由嘉定觅兵负归棺殓挂孝
  description_zh: 其尸在芦柴中幸不腐坏，嘉定县练廷璜觅所部兵负至嘉定棺殓挂孝
- id: guji-陈化成-event-court-honor
  date: '1842-06-28'
  year_of: 1842
  is_circa: true
  name_zh: 奉旨赐恤，赏银一千两、查明子嗣
  description_zh: 五月二十日廷寄奉硃批“挥泪览之”，谕以“某忠勇夙著，今果敢捐躯，殊堪悯恻”，著赏银一千两，查明子嗣
- id: guji-陈化成-event-coffin-memorial
  date: '1842-07-02'
  year_of: 1842
  is_circa: true
  name_zh: 灵柩至省城，公祭于葑门马头
  description_zh: 五月二十四日陈提戎柩至省，公祭于葑门马头；时人叹曰“五十年水师宿将，为国捐躯，可敬，可痛”
