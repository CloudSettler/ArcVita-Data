  decisions:
  - date: '1740'
    title_zh: 清出义学官田设乡学
    rationale: 以教之地广教之人，城市乡村并设，千百人中培植一二人，转相化导，功可久远
  - date: '1743'
    title_zh: 刊发善书并行社仓水利
    rationale: 教在宣化导民，养在多种田多积谷，不知者以为迂而此为根本工夫，化得一人是一人
- id: guji-陈宏谋-endeavor-2
  title_zh: 总督直省清吏治治水
  summary_zh: 督江苏清积案速结，督直隶议永定河遥堤以弃为取，凶年宽给工价以工代赈，相水归海以藏富于民
  phases:
