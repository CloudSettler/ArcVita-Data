  decisions:
  - date: '1752'
    title_zh: 列单按月汇催速结积案
    rationale: 一事到官迁延不结则弊丛生，遇事速结，起新除旧，方能彰公道全民生
  - date: '1758'
    title_zh: 主远筑遥堤以不治为治
    rationale: 束水则冲决，纵水漫衍则势缓淤地，计久远不计目前，费于今日而利在将来，一劳永逸
events:
- id: guji-陈宏谋-event-birth
  title_zh: 生于广西临桂寒素之家
  date: '1696'
  year_of: 1696
  kind: birth
  place_zh: 广西临桂
  description_zh: 康熙三十五年生，世守寒素，立定诚朴可久之志
- id: guji-陈宏谋-event-jinshi
  title_zh: 登进士入仕
  date: '1723'
  year_of: 1723
  kind: career
  place_zh: 京师
  description_zh: 雍正元年成进士，由翰林郡守洊历封疆，持力行不尚多言之旨
- id: guji-陈宏谋-event-yunnan
  title_zh: 抚滇设义学刊书劝垦
  date: '1743'
  year_of: 1743
  kind: career
  place_zh: 云南
  description_zh: 清义学官田为束修，乡设义学，刊朱子治家格言万余本与家礼等书，兴水利劝垦行社仓，表节孝慰幽魂以移风
- id: guji-陈宏谋-event-zhili
  title_zh: 督直议永定遥堤清江苏积案
  date: '1758'
  year_of: 1758
  kind: career
  place_zh: 直隶江苏
  description_zh: 清江苏积案二千余件按月催结，上永定河远筑遥堤以弃为取之议，凶年以工代赈宽给工价，相水有所归以藏富于民
- id: guji-陈宏谋-event-death
  title_zh: 卒于东阁大学士任
  date: '1771'
  year_of: 1771
  kind: death
  place_zh: 京师
  description_zh: 乾隆三十六年卒，历督抚入纶阁，设施悉本仁心，简牍殷殷以劝善规过为怀
