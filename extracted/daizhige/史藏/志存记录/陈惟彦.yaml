  dilemmas:
  - 外人索屋与守土保民之间宁抗法使不通融以绝后患
  - 优差厚利与洁身不染之间宁辞安顺厘捐不受津贴
  - 报灾获谴与饰太平保官之间宁冒撤任直陈饥馑
  lesson: 以至诚守法化顽为良以廉直抗节不以利害易操守
  summary_first_person: 吾石埭陈惟彦字劭吾宦黔七年牧开州署婺川守黎平辨无教案断土司袭恤灾黎整厘金生平严毅质直唯求无愧于民
