endeavors:
- id: guji-陈惟彦-endeavor-1
  title_zh: 牧守开州婺川保民化顽
  summary: 莅任开州辨无教案断杨氏承袭争报灾署婺川感化田其嘴明辨顶凶以刚明仁诚安地方
  phases:
  - key: brewing
    name: 初莅开州定章约
    labels:
      zh:
      - 开州
      - 初政
    start_date: 1894-05-07
    highlight_event_id: guji-陈惟彦-event-kaizhou
  - key: breakthrough
    name: 护解卢复生拒法主教
    labels:
      zh:
      - 教案
      - 交涉
    start_date: 1894-05-26
    highlight_event_id: guji-陈惟彦-event-kaizhou
  - key: climax
    name: 报灾勘灾全活饥民
    labels:
      zh:
      - 报灾
      - 恤民
    start_date: 1895-06-01
    highlight_event_id: guji-陈惟彦-event-baozai
  - key: closure
    name: 署婺川化导田其嘴
    labels:
      zh:
      - 婺川
      - 化顽
    start_date: 1896-05-01
    highlight_event_id: guji-陈惟彦-event-wuchuan
  decisions:
  - date: 1894-05-26
    title_zh: 护送卢复生出境不迁就教案
    rationale: 教民唆讼捏保即以中国法驱逐不使藉端聚众酿乱复严拒法主教索屋建堂
  - date: 1896-05-10
    title_zh: 宽田其嘴既往令立功赎罪
    rationale: 通缉十余年不获者自投与其重办不如启其良知使其保北鄙无殴杀即为大功
- id: guji-陈惟彦-endeavor-2
  title_zh: 辞优差整顿贵州厘金
  summary: 丁酉辞安顺府厘捐优差继任贵州厘金提调董其成而不自收捐以廉洁整顿积弊
  phases:
  - key: brewing
    name: 呈请开缺委办厘捐
    labels:
      zh:
      - 安顺
      - 厘捐
    start_date: 1897-04-01
    highlight_event_id: guji-陈惟彦-event-cili
  - key: breakthrough
    name: 力辞卖放优差
    labels:
      zh:
      - 辞差
      - 守廉
    start_date: 1897-04-02
    highlight_event_id: guji-陈惟彦-event-cili
  - key: climax
    name: 任厘金提调董其成
    labels:
      zh:
      - 厘金
      - 整顿
    start_date: 1897-07-01
    highlight_event_id: guji-陈惟彦-event-lijin
  - key: closure
    name: 竣局归洁不染分文
    labels:
      zh:
      - 财政
      - 廉直
    start_date: 1898-01-01
    highlight_event_id: guji-陈惟彦-event-lijin
  decisions:
  - date: 1897-04-02
    title_zh: 辞安顺府厘捐差
    rationale: 纳捐卖放每百石缴费放行名为调剂实纵舞弊居危地不能自白故坚辞不受
  - date: 1897-07-01
    title_zh: 任总局提调不自收捐
    rationale: 声明总局只董其成不经收以杜中饱一人不舞弊而全局疾视不如立章程以清源
events:
- id: guji-陈惟彦-event-birth
  title_zh: 出生于石埭
  date: 1856
  year_of: 1856
  type: birth
  description: 约咸丰六年生安徽石埭人字劭吾弱冠知名后以助振奖大理寺丞
- id: guji-陈惟彦-event-kaizhou
  title_zh: 莅任开州辨无教案
  date: 1894-05-26
  year_of: 1894
  type: 事业
  description: 光绪甲午四月莅任开州护解药肆卢复生至札佐解散万人聚众却方步云激众之禀复驳法主教索刘屋照会争持二年立约而罢地方以无教案结案
- id: guji-陈惟彦-event-baozai
  title_zh: 争开州报灾全活饥民
  date: 1895-09-01
  year_of: 1895
  type: 事业
  description: 乙未夏黔旱开州饥民食红子树皮闰五月报灾请撤任不允九月会勘委员欲作五成不报力持不可清户口发义谷练团丁民愿纳笠粮以纾官累
- id: guji-陈惟彦-event-wuchuan
  title_zh: 署婺川化田其嘴断命案
  date: 1896-05-10
  year_of: 1896
  type: 事业
  description: 丙申四月由开州调署婺川受通缉犯田其嘴投案谕以改过立功保北鄙无殴杀又明辨陈春元顶凶之冤释其抵罪
- id: guji-陈惟彦-event-cili
  title_zh: 辞安顺府厘捐优差
  date: 1897-04-02
  year_of: 1897
  type: 事业
  description: 丁酉暮春委办安顺府厘捐闻行户卖放每石缴费之弊翌晨谒抚藩坚辞谓月薪数十金而名优差是纵舞弊断不敢任
- id: guji-陈惟彦-event-lijin
  title_zh: 提调贵州厘金整顿
  date: 1897-07-01
  year_of: 1897
  type: 事业
  description: 丁酉六月奉委贵州厘金提调声明不自收捐只董其成巡抚王毓藻许之以廉直整顿积弊
- id: guji-陈惟彦-event-death
  title_zh: 卒于民国初年后
  date: 1925
  year_of: 1925
  type: death
  description: 武昌变后翛然海上不谈天下事晚年居京师金陵口述宦游陈迹成宦游偶记后卒
