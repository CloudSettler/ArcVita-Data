  - date: 0986
    title_zh: 劝种放安命辞禄不受亦知终显
    rationale: 骨法合贵，山林不能久晦，贵贱有命，不可强避
events:
- id: guji-陈抟-event-birth
  title_zh: 生于唐末
  date: 0871
  year_of: 871
  description: 字图南，生唐末，有经世之才
- id: guji-陈抟-event-yinju
  title_zh: 入武当后隐华山
  date: 0910
  year_of: 910
  description: 厌五代之乱，入武当学神仙导养，能辟谷或一睡三年，后隐华山
- id: guji-陈抟-event-huayin
  title_zh: 华阴闻赵点检作官家
  date: '0960-02-03'
  year_of: 960
  description: 游华阴闻赵点检作官家，惊喜大笑言天下这回定叠，尝见太祖天日之表知太平始
- id: guji-陈抟-event-xiangwang
  title_zh: 相寿王为天下主
  date: 0985
  year_of: 985
  description: 太宗命历抵王宫相诸王，至寿邸见张耆杨崇勋皆将相，断寿王他日为天下主
- id: guji-陈抟-event-xiangren
  title_zh: 相种放及王氏女贵
  date: 0986
  year_of: 986
  description: 种放访道言其官至丞郎，王克正女捧炉手相贵嫁即国夫人，后皆验
- id: guji-陈抟-event-death
  title_zh: 卒于华山
  date: 0989
  year_of: 989
  description: 高卧华山讲道，端拱中卒，朝野敬为希夷先生
