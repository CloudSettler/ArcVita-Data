- id: guji-陈明遇-event-1
  date: '1645-06-21'
  year_of: 1645
  title_zh: 主持江阴军民誓师起兵
  summary_zh: 薙发令激变，众悬高皇帝像于明伦堂誓众起师，主其事者典史陈明遇，宽仁得众心，民从其令。
  entities:
  - 江阴军民
  - 方亨
- id: guji-陈明遇-event-2
  date: '1645-07-06'
  year_of: 1645
  title_zh: 会审细作时隆并清剿内应
  summary_zh: 陈明遇同游巡守备顾元泌会鞫细作时隆，供出伏兵四十余人，搜枭六十余人，又磔通谋吏书吴大成等于市，下令获细作者赏银五十两。
  entities:
  - 时隆
  - 顾元泌
  - 吴大成
- id: guji-陈明遇-event-3
  date: '1645-07-05'
  year_of: 1645
  title_zh: 缒城夜出延请阎应元入城主盟
  summary_zh: 七月初五城中势益棘，陈明遇遣人缒城夜出，请旧任典史阎应元主盟守城，并诛有异志之顾元泌。
  entities:
  - 阎应元
  - 顾元泌
- id: guji-陈明遇-event-4
  date: '1645-08-18'
  year_of: 1645
  title_zh: 昼夜卧守城上，力挫外兵
  summary_zh: 陈明遇期以身殉，日夜卧城上，宽仁抚慰战士至流涕；闻外将登城，立命长鎗刺之，联毙敌将于城下。
  entities:
  - 江阴守军
- id: guji-陈明遇-event-death
  date: '1645-08-21'
  year_of: 1645
  title_zh: 城破引刀自刎殉城
  summary_zh: 八月二十一日午刻城陷，巷战不支，陈明遇引刀自刎，毁室焚骸，以身殉城。
  entities:
  - 阎应元
  - 清军
