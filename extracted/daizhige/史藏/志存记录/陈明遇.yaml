  - 城破之际，以身殉国还是苟且偷生
  - 孤城被围，坚守与劝降之间的抉择
  lesson: 微末小吏亦能临危守义，宽仁得众则众志成城
  summary_first_person: 我是江阴典史陈明遇，薙发令下，民变蜂起，众人推我主盟守城。我宽仁得众心，与阎应元共守孤城八十一日，昼夜巡历、抚慰士卒。城破之日，我不旋踵，引刀自刎，以身殉城。
  source_urls:
  - https://zh.wikisource.org/wiki/江上遺聞
