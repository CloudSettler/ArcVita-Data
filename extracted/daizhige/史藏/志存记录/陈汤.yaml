  era: 西汉元帝时期
  reign_ref: 汉元帝建昭年间
  archetype: 矫制立功的边塞名将
  dilemmas:
  - 矫诏发兵虽有灭国之功，但违背朝廷程序，须自劾请罪
  - 位卑权轻，胸臆之谋难以施展
  lesson: 智者见未萌，奇功往往成于非常之举，但须以自劾承担风险
  summary_first_person: 我是陈汤，为人沉勇有大虑，喜奇功。建昭三年我与甘延寿出使西域，恐朝廷公卿议论迂缓，遂矫制发动城郭诸国及乌孙兵四万余骑，分道越葱岭直指郅支单于城，以缓辞骄敌、夜围攻拔，斩郅支单于之首，获名王贵人五千余级，威震西域，千年之功一朝而成。
  source_urls:
  - https://zh.wikisource.org/wiki/阃外春秋
