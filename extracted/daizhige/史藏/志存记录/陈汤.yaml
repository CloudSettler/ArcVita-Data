events:
- id: guji-陈汤-event-envoy
  person_qid: guji-陈汤
  title_zh: 与甘延寿出使西域
  date: -30
  date_raw: 元帝建昭二年秋
  year_of: -30
  precision: year
  is_circa: true
  summary_zh: 陈汤 与甘延寿奉使出西域，沿途登高远望，观察形胜，谋伐郅支。
- id: guji-陈汤-event-usurp
  person_qid: guji-陈汤
  title_zh: 矫制发兵
  date: -30
  date_raw: 建昭三年
  year_of: -30
  precision: year
  is_circa: true
  summary_zh: 趁甘延寿卧病，陈汤矫制征发城郭诸国兵与乌孙兵，胡汉四万余骑，署置官吏，并上疏自劾矫诏之罪。
- id: guji-陈汤-event-zhizhi
  person_qid: guji-陈汤
  title_zh: 攻拔郅支城，斩郅支单于
  date: -30
  date_raw: 建昭三年
  year_of: -30
  precision: year
  is_circa: true
  summary_zh: 分兵葱岭、赤谷两道，鼓行而西，以缓辞骄敌后夜围其城，迟明拔城，斩郅支单于首，获名王贵人五千余级。
- id: guji-陈汤-event-return
  person_qid: guji-陈汤
  title_zh: 携功而还，西方遂平
  date: -29
  date_raw: 建昭四年
  year_of: -29
  precision: year
  is_circa: true
  summary_zh: 获珍宝方物名马、驰牛羊百万计而还，郅支既灭，西域安定。
