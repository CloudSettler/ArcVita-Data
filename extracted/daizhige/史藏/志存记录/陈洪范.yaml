    title_zh: 德州商定相见不屈膝
    rationale: 阁议以屈膝为辱命，时势虽异仍矢志不屈以全天朝体面
  - date: 1645-10-14
    title_zh: 坚持御书不轻付礼部
    rationale: 以谢礼为贡有辱国体，宁死不亵御书以存通好之义
