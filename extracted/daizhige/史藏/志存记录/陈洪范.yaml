  - date: 1645-11-04
    title_zh: 受命独归传报大兵将至
    rationale: 左马二使被追回京，独承传报防河防江之托肝肠欲裂而行
  - date: 1646-01-01
    title_zh: 逐日笔记自记北使经过
    rationale: 自维衰朽乞闲，一字不敢虚伪以听高明垂鉴而自文其事
events:
- id: guji-陈洪范-event-birth
  date: 1585
  year_of: 1585
  title_zh: 出生
  description: 明万历年间生，世受国恩，久废居海滨
- id: guji-陈洪范-event-depart
  date: 1645-07-18
  year_of: 1645
  title_zh: 携银币开舟北行
  description: 奉弘光命偕左懋第马绍愉，赍银十万两金千两缎绢万匹自瓜仪开舟
- id: guji-陈洪范-event-dezhou
  date: 1645-09-18
  year_of: 1645
  title_zh: 至德州定不屈之议
  description: 见摄政王不必敬他告示，与左部院集议遵阁议不屈膝以全使命
- id: guji-陈洪范-event-enter-beijing
  date: 1645-10-12
  year_of: 1645
  title_zh: 捧御书入城居鸿胪寺
  description: 鼓吹前导捧御书自正阳门入城，刚陵榜什登寺诘问擅立皇帝事
- id: guji-陈洪范-event-expelled
  date: 1645-10-27
  year_of: 1645
  title_zh: 被押出京河西务遥祭
  description: 使事不成被兵督押出京，至河西务遥望诸陵设位遥祭痛哭失声
- id: guji-陈洪范-event-separate
  date: 1645-11-04
  year_of: 1645
  title_zh: 沧州与左马二使分离
  description: 行过沧州左马二使被追回北京，独被拥南不许叙别肝肠欲裂
- id: guji-陈洪范-event-jining
  date: 1645-11-15
  year_of: 1645
  title_zh: 至济宁传警防河防江
  description: 行至济宁知宿迁已失急从徐州渡，报北兵养马济宁将南侵宜急备
- id: guji-陈洪范-event-return
  date: 1645-12-01
  year_of: 1645
  title_zh: 南归陈备御乞闲
  description: 劳苦备尝奉使无效，密修寸楮报史马二辅早饬备御决计乞闲
- id: guji-陈洪范-event-write
  date: 1646-01-01
  year_of: 1646
  title_zh: 著北使纪略自述
  description: 往返情事逐日笔记，自称一字不敢虚伪姑记大略以听垂鉴
- id: guji-陈洪范-event-death
  date: 1652
  year_of: 1652
  title_zh: 卒于清初
  description: 南旋后被指纳款为清内应，遂为满清反间，卒于顺治年间
