  decisions:
  - date: 1861
    title_zh: 不面擒获的李钦差并奏全其节
    rationale: servings称忠肝义胆不易才，奏明天王“忠臣也，亦节士也，宜全其节”
  - date: 1862
    title_zh: 拒降胜保
    rationale: 当众大骂胜保为第一误国庸臣，自认开国元勋，怎配跪之
