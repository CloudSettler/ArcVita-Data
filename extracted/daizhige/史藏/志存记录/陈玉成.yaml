  lesson: 本总裁只可杀，不可辱——气节重于生死
  summary_first_person: 我是太平天国英王陈玉成，十五岁破武昌，三洗湖北、九下江南，麾下号称百廿四万；庐州粮尽势穷，误信苗沛霖赴寿州被执，宁死不降，被解往河南延津正法，年二十八。
