  title_zh: 封英王，进兵大江南北
  description: 受封钦命文衡正总裁天朝九门御林忠勇羽林军英王禄千岁，统带一百廿四万；破湖北、九江、江西、江苏、安徽州县一百五十余处
- id: guji-陈玉成-event-defeat
  date: '1861'
  year_of: 1861
  type: setback
  title_zh: 二狼河之战大败
  description: 骄气过甚直期踏平多鲍杜三军五十五营，先锋接连败北，点名清数共少人七十余万，英王从此短气
- id: guji-陈玉成-event-closure
  date: 1862-05
  year_of: 1862
  type: steadfastness
  title_zh: 寿州被擒，拒降死节
