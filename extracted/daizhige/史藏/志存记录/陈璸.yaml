    start_date: '1702-03-01'
    highlight_event_id: guji-陈璸-event-mingluntang-start
  - key: breakthrough
    name: 殚力拮据建明伦堂
    labels:
      zh:
      - 建明倫堂
      - 取義明倫
    start_date: '1702-12-01'
    highlight_event_id: guji-陈璸-event-mingluntang-start
  - key: climax
    name: 明伦堂落成进诸生训以五伦五经
    labels:
      zh:
      - 落成
      - 訓士
    start_date: '1703-06-01'
    highlight_event_id: guji-陈璸-event-mingluntang-done
  - key: closure
    name: 廓文庙基址捐金去任以待后人
    labels:
      zh:
      - 建文廟
      - 捐金留庫
      - 行取去任
    start_date: '1703-10-01'
    highlight_event_id: guji-陈璸-event-taiwan-wenmiao-start
  decisions:
  - date: '1702-12-01'
    title_zh: 以建明伦堂为为政第一事
    rationale: 无明伦堂则讲经无地人伦不明故不后他务先具详兴工
  - date: '1704-02-01'
    title_zh: 行取捐金留府库为文庙工费
    rationale: 身虽去而心惓惓恐庙学中断故捐金以成后功不谋己利
- id: guji-陈璸-endeavor-2
  title_zh: 台厦道重修府学并建朱祠文昌阁
  summary: 康熙五十一年以台厦道再至台湾商守令重修府学文庙启圣两庑棂星礼门义路一新又建朱文公祠文昌阁皆出养廉并拨庄田供香火肄业
  phases:
  - key: brewing
