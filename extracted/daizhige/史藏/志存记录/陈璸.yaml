endeavors:
- id: guji-陈璸-endeavor-1
  title_zh: 台邑首建明伦堂并创建文庙
  summary: 康熙四十一年任台湾知县以明伦堂久旷为政第一事具详报可首建明伦堂继而廓地建文庙捐金留库以待后成
  phases:
  - key: brewing
