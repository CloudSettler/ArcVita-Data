  - key: breakthrough
    name: 兴工易朽补缺筑基饬墙
    labels:
      zh:
      - 興工
      - 葺廟
    start_date: '1712-12-01'
    highlight_event_id: guji-陈璸-event-fuxue-repair
  - key: climax
    name: 建朱文公祠表正学以惠海外
    labels:
      zh:
      - 建朱祠
      - 撥田供祀
    start_date: '1713-02-01'
    highlight_event_id: guji-陈璸-event-zhuci-done
  - key: closure
    name: 建文昌阁于祠后以励修德积善
    labels:
      zh:
      - 建文昌閣
      - 勵學
    start_date: '1713-03-01'
    highlight_event_id: guji-陈璸-event-wenchang-done
  decisions:
  - date: '1712-12-01'
    title_zh: 悉出养廉不动公帑不费民财
    rationale: 荒岛初辟民力未裕故以养廉余羡任费以示正谊不谋利
  - date: '1713-02-01'
    title_zh: 立朱文公祠拨鱼逮港庄田二十八甲供祀
    rationale: 孔孟后正学赖文公发明海外学者当依归故久远计香火修脯之资
events:
- id: guji-陈璸-event-birth
  title_zh: 生于广东海康
  date: '1656'
  year_of: 1656
  place_zh: 广东海康
  description: 顺治十三年生少即诵习朱子之书沉潜玩味终身信守
- id: guji-陈璸-event-mingluntang-start
  title_zh: 调任台邑谒庙议建明伦堂
  date: '1702-03-15'
  year_of: 1702
  place_zh: 台湾府学文庙
  description: 壬午春调任台邑翌日谒文庙见明伦堂旷然平地与学博黄世杰谋殚力拮据是冬兴工
- id: guji-陈璸-event-mingluntang-done
  title_zh: 明伦堂落成训诸生明五伦通五经
  date: '1703-06-01'
  year_of: 1703
  place_zh: 台湾县明伦堂
  description: 癸未夏堂成三间高广如式进诸生告以明伦取义戒徒习文艺以败名丧检督工学博黄世杰与有功
- id: guji-陈璸-event-taiwan-wenmiao-start
  title_zh: 廓地创建文庙捐金行取去任
  date: '1704-02-01'
  year_of: 1704
  place_zh: 台湾县文庙
  description: 明伦堂成后选材鸠工平基定向创建文庙适行取命下捐金留府库为工费而去后复持节经营启圣两庑名宦乡贤二祠以遂夙志
- id: guji-陈璸-event-fuxue-repair
  title_zh: 商守令重修台湾府学文庙
  date: '1712-12-01'
  year_of: 1712
  place_zh: 台南府学宫
  description: 以台厦道商郡守周洛书等上请壬辰冬腊月兴工委千总曾荣董役大成殿启圣祠两庑棂星门礼门义路明伦堂六艺斋一新历三载竣皆出养廉
- id: guji-陈璸-event-zhuci-done
  title_zh: 建朱文公祠成拨田供香火
  date: '1713-02-15'
  year_of: 1713
  place_zh: 台湾府学宫内
  description: 于府学建朱文公祠正堂三楹斋舍门楼具起工壬辰冬至癸巳仲春成不役民夫并拨逮港庄田二十八甲租粟供祀永远遵照
- id: guji-陈璸-event-wenchang-done
  title_zh: 建文昌阁于文公祠后以励士
  date: '1713-04-01'
  year_of: 1713
  place_zh: 台南府学宫文公祠后
  description: 准福州奎光阁体式创建文昌阁二月丁亥起至三月戊申成训士修德积善求放心戒独以登高科享大名
- id: guji-陈璸-event-death
  title_zh: 卒
  date: '1730'
  year_of: 1730
  place_zh: 广东
  description: 历台湾令台厦道偏沅巡抚以清德文学兴学海外卒后台湾士民思其教化之功
