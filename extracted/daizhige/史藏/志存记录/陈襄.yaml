  archetype: 持节守正之使臣
  dilemmas:
  - title_zh: 国体与滞留之争
    description: 坚持生辰使近例坐次不移，虽致夜深滞留不肯苟从
  - title_zh: 和好与守正之衡
    description: 两朝如同一家之下仍执主礼，不以茶酒事末而废使命之大
  lesson: 奉使守正宁滞而不失国体，方全信义
  summary_first_person: 吾陈襄字述古，福州人，奉英宗敕充国信使副贺辽登位，自白沟至帐前，往返七十余程，备录接伴馆伴坐次之争与沿途礼节，守近例而不屈，以全国体而归
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E4%BD%BF%E8%BE%BD%E8%AF%AD%E5%BD%95.html
endeavors:
- id: guji-陈襄-endeavor-1
  title_zh: 奉敕贺辽登位使辽
  summary: 治平二年充皇帝登宝位国信使，自雄州白沟出境，历燕京中京至帐前递国书，争坐次守近例，辞灵驾而还
  phases:
  - key: brewing
    name: 受命出境
    labels:
      zh: 受命持节
    start_date: 1065-05-10
    highlight_event_id: guji-陈襄-event-shiliao-1065
  - key: breakthrough
    name: 白沟新城争坐次
    labels:
      zh: 守正不移
    start_date: 1065-05-11
    highlight_event_id: guji-陈襄-event-shiliao-1065
  - key: climax
    name: 帐前递国书受礼
    labels:
      zh: 完成使命
    start_date: 1065-06-15
    highlight_event_id: guji-陈襄-event-diguo-1065
  - key: closure
    name: 白沟换鞭南归
    labels:
      zh: 全节而还
    start_date: 1065-07-19
    highlight_event_id: guji-陈襄-event-huanguo-1065
  decisions:
  - date: 1065-05-11
    title_zh: 执生辰使近例拒移宾位
    rationale: 以韩刘前番安排为久例，左番大使当坐东南伸主礼，不失主位各无相压
  - date: 1065-06-15
    title_zh: 坐位未定仍入见递书
    rationale: 茶酒事末不宜反使命，请馆伴裁度，早入见以达国书圣辞为重
  - date: 1065-06-21
    title_zh: 请建白避大行发引灵驾
    rationale: 以臣子之心望回程剩蹉数驿，得辞灵驾，全事死之敬
- id: guji-陈襄-endeavor-2
  title_zh: 历官治政兴学育才
  summary: 庆历登第后历知县州，留意学校经术，治平初入朝论事，后以经义育士为时名儒
  phases:
  - key: brewing
    name: 登第入仕
    labels:
      zh: 起家牧守
    start_date: 1042
    highlight_event_id: guji-陈襄-event-dengdi-1042
  - key: breakthrough
    name: 陈桥接伴习边事
    labels:
      zh: 谙练聘礼
    start_date: 1064
    highlight_event_id: guji-陈襄-event-jieban-1064
  - key: climax
    name: 使辽成名节显
    labels:
      zh: 名节益著
    start_date: 1065-06-15
    highlight_event_id: guji-陈襄-event-diguo-1065
  - key: closure
    name: 讲学经义传后
    labels:
      zh: 化行一方
    start_date: 1070
    highlight_event_id: guji-陈襄-event-death
  decisions:
  - date: 1064
    title_zh: 陈桥接伴结好边使
    rationale: 以礼迎劳韩近等，留旧好为后日使辽往还之基
  - date: 1065-05-11
    title_zh: 沿路详录问答见闻
    rationale: 记山川程驿人物除改，以备朝廷顾问边情国信典故
events:
- id: guji-陈襄-event-birth
  date: 1017
  year_of: 1017
  title_zh: 出生
  description: 天禧元年生于福州侯官，字述古
- id: guji-陈襄-event-dengdi-1042
  date: 1042
  year_of: 1042
  title_zh: 庆历登进士第
  description: 庆历二年登第，历任浦城知县等，兴学校明经术
- id: guji-陈襄-event-jieban-1064
  date: 1064
  year_of: 1064
  title_zh: 陈桥接伴辽使
  description: 治平元年于陈桥接伴辽使韩近等，赐御筵相见结好
- id: guji-陈襄-event-shiliao-1065
  date: 1065-05-10
  year_of: 1065
  title_zh: 使辽至白沟
  description: 奉敕充登宝位国信使副至雄州白沟驿，与接伴萧好古杨规中相见，始争坐次
- id: guji-陈襄-event-diguo-1065
  date: 1065-06-15
  year_of: 1065
  title_zh: 帐前递国书
  description: 诣帐前客省入见，先致书于皇太后，次致书于辽君，面传圣辞受酒赐衣带
- id: guji-陈襄-event-huanguo-1065
  date: 1065-07-19
  year_of: 1065
  title_zh: 白沟换鞭南归
  description: 至北沟白沟桥南北互酌三盏，桥中立马相对换鞭传辞，宿雄州还朝
- id: guji-陈襄-event-death
  date: 1080
  year_of: 1080
  title_zh: 逝世
  description: 元丰三年卒，以经行名重一时，语录传使辽本末
