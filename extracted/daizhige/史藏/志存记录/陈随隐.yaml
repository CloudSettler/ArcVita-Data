  archetype: 朝仪记录者
  dilemmas:
  - 职微而欲存大驾盛仪之实
  - 见闻零散而欲条系统一之难
  lesson: 亲随目睹即时详录可补朝仪史阙
  summary_first_person: 我亲随大驾出入，目睹前后导从仗卫班列衣冠之盛，又逢恭谢回銮簪花之乐，惧其久而湮没，故详记军器御厨仪鸾等司前后之序，并缀姜夔阮秀实诸人纪咏之诗，以存一代太平朝仪之实
  source_urls:
