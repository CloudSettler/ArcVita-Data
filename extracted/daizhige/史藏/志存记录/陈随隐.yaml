    title_zh: 添录教坊作乐簪花之制
    rationale: 恭谢与常驾不同特添乐工簪花故别出专记以显其异
  - date: '1216'
    title_zh: 全录诸人诗句不加删改
    rationale: 阮秀实姜夔等诗皆当时亲见之作并存可互相印证故备录全文
