  - date: '1213'
    title_zh: 以亲见为据不取传闻
    rationale: 仗卫出入瞬息万变唯亲目睹方可信故舍传闻而专记所见
  - date: '1214'
    title_zh: 按前后行列分段备录
    rationale: 导从前后内外层层环卫若不分段则淆乱故按前驱中卫后从分别条列
- id: guji-陈随隐-endeavor-2
  title_zh: 恭谢簪花纪咏辑存
  description_zh: 辑恭谢回銮御街簪花作乐之盛及姜夔潘牥等纪咏诸诗以见太平气象
