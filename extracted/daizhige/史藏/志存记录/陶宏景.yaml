  birth_date: '0456'
  death_date: '0536'
  era: 南北朝
  reign_ref: 南朝宋齐梁
  archetype: 隐逸弘道型
  dilemmas:
  - 出仕显达与归隐林泉之间何去何从
  - 儒家经史与道家养生修仙如何兼通
  - 独善山中与济世弘道著述如何两全
  lesson: 功成身退以全节，著述弘道以济世，方为长久之道
  summary_first_person: 吾幼而聪慧，博通经史，因读葛洪神仙传而志在养生。曾为宜都王侍读，迁奉朝请，然不乐仕进，遂谢职隐居茅山华阳洞天，躬耕林泉，著书弘道。齐高帝问吾山中何所有，吾以白云自怡对之。世人以吾为华阳隐居，吾但愿以内外之学泽及后人而已。
  source_urls:
  - https://daizhige.org/史藏/志存记录/南北朝杂记.html
endeavors:
