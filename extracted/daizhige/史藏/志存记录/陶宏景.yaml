  decisions:
  - date: 0481
    title_zh: 就任奉朝请而不贪显要
    rationale: 虽居清望而志在养生，不以官爵为荣，唯以读书养性为本
  - date: 0482
    title_zh: 以白云诗答齐高帝见志
    rationale: 明志山林只可自怡，不堪持赠，以婉拒征召而全隐逸之节
- id: guji-陶宏景-endeavor-2
  title_zh: 谢职隐居茅山弘道著述
  summary_zh: 永明中谢职隐茅山华阳洞天，自号华阳隐居，集徒授道，著书立说，缙绅士庶千里来学，称为山中宰相
  phases:
  - key: brewing
    name: 萌志养生
    labels:
      zh:
      - 读神仙传
      - 仰慕青云
    start_date: '0472'
    highlight_event_id: guji-陶宏景-event-shidu
  - key: breakthrough
    name: 谢职入山
    labels:
      zh:
      - 归隐
      - 茅山
    start_date: 0492
    highlight_event_id: guji-陶宏景-event-yinju
  - key: climax
    name: 华阳弘道
    labels:
      zh:
      - 讲学
      - 著述
    start_date: '0500'
    highlight_event_id: guji-陶宏景-event-yinju
  - key: closure
    name: 德成道尊
    labels:
      zh:
      - 山中宰相
      - 羽化茅山
    start_date: '0536'
    highlight_event_id: guji-陶宏景-event-death
  decisions:
  - date: 0492
    title_zh: 决意谢职隐茅山
    rationale: 外书未满万卷而内学可成，宦途羁身不如林泉养性弘道，更可远播学风
  - date: '0502'
    title_zh: 坚持著述授徒不复出山
    rationale: 以真诰本草等书泽世，以讲学承流向风，隐居亦可济世，不必复蹈仕途
events:
- id: guji-陶宏景-event-birth
  title_zh: 诞生于丹阳秣陵
  date: '0456'
  year_of: 456
  place_zh: 丹阳秣陵
  description_zh: 陶宏景幼而聪慧，十岁得葛洪神仙传，昼夜研读，遂有志养生修道，博通经史子集
- id: guji-陶宏景-event-shidu
  title_zh: 初为宜都王侍读
  date: '0477'
  year_of: 477
  place_zh: 建康
  description_zh: 以才学征为宜都王侍读，侍讲经史，声名渐著，后转奉朝请，仍潜心道学
- id: guji-陶宏景-event-fengchaoqing
  title_zh: 迁奉朝请兼通内外之学
  date: 0481
  year_of: 481
  place_zh: 建康
  description_zh: 迁奉朝请，自言读外书未满万卷，以内书兼之乃当小出，儒道兼修，淡于荣利
- id: guji-陶宏景-event-shanzhong
  title_zh: 以诗答齐高帝山中何所有
  date: 0482
  year_of: 482
  place_zh: 建康
  description_zh: 齐高帝问山中何所有，宏景赋诗答云山中何所有岭上多白云只可自怡悦不堪持寄君，帝赏其高致
- id: guji-陶宏景-event-yinju
  title_zh: 谢职隐居茅山华阳洞天
  date: 0492
  year_of: 492
  place_zh: 茅山华阳洞天
  description_zh: 齐永明十年谢职隐茅山，茅山周回一百五十里号华阳洞天，自称华阳隐居，雅爱林泉，尤好著述，四方学者千里而至
- id: guji-陶宏景-event-death
  title_zh: 羽化于茅山
  date: '0536'
  year_of: 536
  place_zh: 茅山
  description_zh: 梁大同二年卒于茅山，年八十一，遗著真诰本草集注等传世，梁武帝时屡加咨访，时称山中宰相
