  reign_ref: 元顺帝至明成祖
  archetype: 隐逸著述者
  dilemmas:
  - 出仕显达与耕读保身之抉择
  - 举业功名与经史著述之取舍
  - 乱离存身与掌故传世之权衡
  lesson: 辍耕不辍志，摘叶亦成林，积十年之勤以存一代掌故，耕读保身而著述传远
  summary_first_person: 吾天台陶宗仪，字九成，号南村，少工举子业，晚乃弃去而阖户著书，避兵三吴间，家于松南，劳作之暇辄以笔墨自随，辍耕休于树阴，遇事肯綮摘叶书之，贮于破盎，埋于树根，如是十年，积盎至十数，尽发其藏，令门人萃录，得三十卷，题曰南村辍耕录，上兼六经百氏，下极稗官小史，以存掌故劝忠孝耳
  source_urls:
  - https://daizhige.org/南村辍耕录.html
  - https://github.com/daizhige-org/daizhigev20/blob/data/南村辍耕录.md
