  dilemmas:
  - 家弊亲老须出仕供养与不慕荣利守志归隐相冲突
  - 性嗜酒而家贫不能常得与安贫乐道晏如相牵系
  lesson: 不戚戚于贫贱不汲汲于富贵忘怀得失以乐其志
  summary_first_person: 吾宅边有五柳因以为号闲靖少言好读书不求甚解会意则欣然忘食环堵萧然短褐穿结晏如也北窗凉风暂至自谓羲皇上人
