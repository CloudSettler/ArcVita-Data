  title_zh: 安丰偏安寄命存续
  summary: 自亳州退守安丰，徒拥虚名，屡遭围攻，乞援应天，终移滁州殁于瓜埠
  phases:
  - key: brewing
    name: 安丰立国虚君垂拱
