  - date: 1355-02
    title_zh: 接受拥立建国宋改元龙凤
    rationale: 借宋室遗绪为口实，以号召汝颍荆淮群雄，聚义旗下
  - date: 1357-01
    title_zh: 委任刘福通总军分路北伐
    rationale: 乘元军溃散之机，以攻为守，图取中原以实虚号
