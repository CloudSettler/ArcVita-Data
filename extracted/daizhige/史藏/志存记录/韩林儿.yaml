      zh: 求救应天
    start_date: 1363-03
    highlight_event_id: guji-韩林儿-event-anfeng-siege
  - key: climax
    name: 脱围入滁依附强藩
    labels:
      zh: 入滁寄寓
    start_date: 1363-07
    highlight_event_id: guji-韩林儿-event-anfeng-siege
  - key: closure
    name: 瓜埠胶舟沉命舟中
    labels:
      zh: 瓜埠殁难
    start_date: 1366-12
    highlight_event_id: guji-韩林儿-event-death
  decisions:
  - date: 1363-03
    title_zh: 遣使向应天朱元璋乞援解安丰围
    rationale: 孤军无倚，唯借江南强兵可解张士诚吕珍之围，以存宋祀
  - date: 1363-07
    title_zh: 离安丰移居滁州受安置
    rationale: 安丰残破不可守，附强藩以保余生，存龙凤正朔以待时
events:
- id: guji-韩林儿-event-birth
  title_zh: 出生于栾城韩氏
  date: 1335
  year_of: 1335
  place_zh: 栾城
  summary_zh: 韩山童之子林儿，祖父以白莲会惑众，父罹难后逃往武安
- id: guji-韩林儿-event-ascend
  title_zh: 砀山迎立亳州即皇帝位
  date: 1355-02
  year_of: 1355
  place_zh: 亳州
  summary_zh: 刘福通等自砀山夹河迎至，立为皇帝，国号宋，改元龙凤，号小明王，立母杨氏为太后，以杜遵道盛文郁为丞相
- id: guji-韩林儿-event-northern
  title_zh: 刘福通大败元军围攻亳州
  date: 1357-05
  year_of: 1357
  place_zh: 许州长葛太康
  summary_zh: 刘福通劫败长葛元营，复大败答失八都鲁于太康，宋军声势大振，旋亳州被围困
- id: guji-韩林儿-event-anfeng
  title_zh: 亳州陷落退守安丰
  date: 1357-12
  year_of: 1357
  place_zh: 安丰
  summary_zh: 答失八都鲁围亳州，林儿与福通退走安丰，自此迁都安丰，徒拥虚名
- id: guji-韩林儿-event-anfeng-siege
  title_zh: 安丰被围求救应天得解
  date: 1363-03
  year_of: 1363
  place_zh: 安丰
  summary_zh: 张士诚吕珍围安丰，刘福通战死，应天兵来援解围，林儿遂移居滁州
- id: guji-韩林儿-event-death
  title_zh: 殁于瓜埠舟中
  date: 1366-12
  year_of: 1366
  place_zh: 瓜埠
  summary_zh: 在位十二年，丙午冬十二月自滁州赴应天，过瓜埠殁于舟中，龙凤君臣事业遂灭
