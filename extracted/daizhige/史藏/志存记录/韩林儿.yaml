person:
  qid: guji-韩林儿
  name_zh: 韩林儿
  names:
    zh: 韩林儿
    en: Han Liner
  lifespan:
    birth:
      date: 1335
      precision: year
      is_circa: true
      raw: 生年不详，栾城韩山童之子
    death:
      date: 1366-12
      precision: month
      is_circa: false
      raw: 丙午冬十二月殁于瓜埠
  birth_date: 1335
  death_date: 1366-12
  era: 元末
  reign_ref: 龙凤
  archetype: 傀儡君主
  dilemmas:
  - 徒拥宋室虚号，军政皆决于刘福通，立威与保身两难
  - 据亳安丰而无强兵，独立支撑与依附强藩两难
  lesson: 托虚名以号令者，若无实权强兵，终为强藩所制
  summary_first_person: 吾本栾城布衣子，父山童以妖言罹难，吾脱难走武安，后为刘福通自砀山迎立于亳，建国宋，改元龙凤，世称小明王，在位十二年，事皆决于福通，亳陷走安丰，终殁于瓜埠舟中
  source_urls:
  - https://daizhige.org史藏志存记录国初群雄事略.html
