person:
  qid: guji-韩琦
  name_zh: 韩琦
  names:
    zh: 韩琦、韩忠献
    en: Han Qi
  lifespan:
    birth:
      date: '1008'
      precision: year
      is_circa: false
      raw: ''
    death:
      date: '1075'
      precision: year
      is_circa: false
      raw: ''
  birth_date: '1008'
  death_date: '1075'
  era: 北宋
  reign_ref: 仁宗、英宗朝
  archetype: 持重辅臣、社稷之臣
  dilemmas:
  - 建储大事上是否直言定名，还是恭请君主圣裁
  - 后宫干政传闻与立后废立之议中的持正抉择
  lesson: 为臣持重敢谏，遇大事守正不惧，社稷方安。
  summary_first_person: 我韩琦以持重敢谏事仁宗、英宗两朝。谏官任上直言请出王德用所进女口，仁宗从谏；立嗣之议，我恐慄逡巡，终答"事系陛下"，以定英宗为皇子之局；两宫听政有隙，我曲意调护，使间隙不生，时人称为社稷之臣。
endeavors:
- id: guji-韩琦-endeavor-1
  name_zh: 以谏官持正论事
  phases:
  - key: breakthrough
    name_zh: 谏王德用进女口
    labels:
      zh: 直谏
    start_date: '1040'
    highlight_event_id: guji-韩琦-event-谏女口
  decisions:
  - date: '1040'
    title_zh: 谏请遣出所进女口
    rationale: 臣职在风闻，恐其亲近移上心，故持论甚坚。
- id: guji-韩琦-endeavor-2
  name_zh: 议立英宗为皇子并当国辅政
  phases:
  - key: climax
    name_zh: 建储定议
    labels:
      zh: 社稷
    start_date: '1056'
    highlight_event_id: guji-韩琦-event-议建储
  - key: closure
    name_zh: 辅佐两宫
    labels:
      zh: 调护
    start_date: '1063'
    highlight_event_id: guji-韩琦-event-调护两宫
  decisions:
  - date: '1056'
    title_zh: 建储之问答"事系陛下"
    rationale: 立嗣乃君主家事，臣不敢擅专，恭候圣意。
  - date: '1063'
    title_zh: 调护两宫听政
    rationale: 贵珰间言两宫，恐生间隙，故尽力弥缝，使始终无事。
events:
- id: guji-韩琦-event-birth
  type: birth
  date: '1008'
  year_of: 1008
  summary: 韩琦生。
- id: guji-韩琦-event-谏女口
  type: 事业事件
  date: '1040'
  year_of: 1040
  summary: 以谏官论王德用进女口，仁宗初诘之，韩琦以"臣职在风闻，正恐亲近"对，仁宗感悟，即令所进女口各支钱三百贯，出内东门，且涕下称从谏。
- id: guji-韩琦-event-议建储
  type: 事业事件
  date: '1056'
  year_of: 1056
  summary: 仁宗以司马光等四十二疏乞立嗣，问"宗室中卿厚谁"，韩忠献恐慄退立，久之答"事系陛下"；仁宗出怀中英宗藩邸旧名，议乃定。
- id: guji-韩琦-event-调护两宫
  type: 事业事件
  date: '1063'
  year_of: 1063
  summary: 英宗即位，慈圣光献皇后同听政，一二贵珰间言两宫，韩忠献力加调护，两宫终始无事。
- id: guji-韩琦-event-当国受诏
  type: 事业事件
  date: '1062'
  year_of: 1062
  summary: 韩琦当国，召翰林王圭至中书，受立英宗为皇子之诏。
- id: guji-韩琦-event-death
  type: death
  date: '1075'
  year_of: 1075
  summary: 韩琦卒，谥"忠献"。
