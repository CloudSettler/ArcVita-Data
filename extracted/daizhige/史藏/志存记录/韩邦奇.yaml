  decisions:
  - date: 1524-08
    title_zh: 不顾阻劝出雁门系属人心
    rationale: 大同虽乱冀北十七卫所州县未皆乱参议出关量可而进可以系属人心
  - date: 1524-08
    title_zh: 明日决进直入大同
    rationale: 朝廷已有恩赦军士不靖者无主耳直入则人心少安观望不敢加害
  - date: 1524-08
    title_zh: 约法两条便宜行边关
    rationale: 城中无一文职出政非便宜行关防不拘条格不能止暴安边
  - date: 1524-10
    title_zh: 插营盛装先降礼迎蔡公
    rationale: 变后巡抚威削大同人止知参议不身先降礼无以帅众存巡抚之威
- id: guji-韩邦奇-endeavor-2
  title_zh: 十一月再变面谕安众
  summary_zh: 十一月初七夜再变围三堂宅我自书告示面谕诸军撤游兵查荒粮众声如雷变遂定
