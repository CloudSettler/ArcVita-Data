  decisions:
  - date: '1524-11-07'
    title_zh: 出见乱军再三谕止
    rationale: 彼未杀人犯上抢掠尚可招来面谕镇之以静可缓祸变
  - date: '1524-11-09'
    title_zh: 自书告示晓以祸福
    rationale: 围桂宅火起既为逆招来无用不如闭门自处以明死生之义
  - date: '1524-11-10'
    title_zh: 约诸官会都司面谕
    rationale: 必须当众面谕剖判捕盗撤兵荒粮诸事方能散久跪生变之众
  - date: '1524-11-10'
    title_zh: 许撤游兵查免荒粮
    rationale: 游兵巡捕非常调屯粮正额当纳无影荒粮查明蠲免则众心服
events:
- id: guji-韩邦奇-event-birth
  title_zh: 生于陕西朝邑
  type: birth
  date: '1479'
  year_of: 1479
  description_zh: 明成化十五年生于朝邑韩氏后以功名历官参议
- id: guji-韩邦奇-event-fenshou
  title_zh: 出雁门单骑入大同
  type: career
  date: 1524-08
  year_of: 1524
  description_zh: 八月出雁门直抵西安驿不顾露刃恐吓明日竟入乱军严兵迎接约法两条两月地方大安
- id: guji-韩邦奇-event-yingcai
  title_zh: 插营雁门迎蔡天祐
  type: career
  date: 1524-10
  year_of: 1524
  description_zh: 十月插四大营于雁门关下盛装谒蔡天祐于代邸先入大同安人心上便宜二十六条为巡抚条约
- id: guji-韩邦奇-event-zaibian
  title_zh: 十一月初七夜再变谕止
  type: career
  date: '1524-11-07'
  year_of: 1524
  description_zh: 初七夜二鼓炮喊震天诸军趋分司叩门我出问作变之由再三谕止初八如平日谒巡抚初九风雪按伏散
- id: guji-韩邦奇-event-mianyu
  title_zh: 都司面谕撤兵免荒粮
  type: career
  date: '1524-11-10'
  year_of: 1524
  description_zh: 初十约三堂诸将会都司面谕诸军许撤游击兵屯粮照旧荒粮查免众应诺声如雷公堂挥笔具奏
- id: guji-韩邦奇-event-death
  title_zh: 卒于明嘉靖朝
  type: death
  date: '1556'
  year_of: 1556
  description_zh: 明嘉靖三十五年卒平生著大同纪事以存其实后半年桂勇犹在囚中蔡公开谕始归
