    title_zh: 以性善为宗距混同
    rationale: 歧无善无不善于性善尚可别，混则孟子所谓性亡，故宁歧毋混
  - date: '1605'
    title_zh: 明讲益破不讲之惑
    rationale: 士之于学如农之于耕，张韩诸公不知学则止于功业，讲而行则可至圣贤
