  era: 明末清初
  reign_ref: 明万历、崇祯；清顺治、康熙
  archetype: 遗民学者·经世致用之宗师
  dilemmas:
  - 鼎革之际，仕新朝以行道，抑守遗民之节？
  - 为救友抗辩官府，致己身幽絷半年，值不值？
  lesson: 世间“淫奔”“纳贿”皆行于夜，正人君子不夜行——立身以严，治财以勤，学问以广师
  summary_first_person: 明亡之后，我孤身北游，所到之处置产蓄财，故羁旅一生而不困乏；济南受诬入狱，我援旧牍自辩得以昭雪；晚岁被延上座，三爵即起还寓，夜饮则严拒之，盖君子不夜行也。
