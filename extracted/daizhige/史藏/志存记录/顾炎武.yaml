  endeavor_id: guji-顾炎武-endeavor-1
  title_zh: 鼎革后独身北走
  detail: 明亡之后，独身北上，凡所至之地辄买媵婢、置庄产，不一二年即弃去，终已不顾
- id: guji-顾炎武-event-3
  date: '1650'
  year_of: '1650'
  type: endeavor
  endeavor_id: guji-顾炎武-endeavor-1
  title_zh: 善治财产，羁旅不困乏
  detail: 善于治财，一生羁旅曾无困乏；东海两学士宦未显时常从假贷累数千金，亦不取偿
- id: guji-顾炎武-event-4
  date: 1668-02
  year_of: '1668'
  type: endeavor
  endeavor_id: guji-顾炎武-endeavor-2
  title_zh: 黄培案波及，赴济南被幽絷
  detail: 康熙七年二月闻姜元衡诬控于京师，即出都抵济南，幽絷半年
- id: guji-顾炎武-event-6
  date: 1668-09
  year_of: '1668'
  type: endeavor
  endeavor_id: guji-顾炎武-endeavor-2
  title_zh: 援沈天甫故牍自辩得释
  detail: 谓姜元衡所控之书即沈天甫等伪造《忠节录》陷人之书，事旋解，株连二十余人均得开释；赋诗六章纪其事
- id: guji-顾炎武-event-7
  date: '1670'
  year_of: '1670'
  type: endeavor
  endeavor_id: guji-顾炎武-endeavor-3
  title_zh: 访二曲于关中
  detail: 与惠周惕同至，二曲倒屣迎之，谈宴极欢，一时瞻望者骈肩累迹
- id: guji-顾炎武-event-5
  date: '1676'
  year_of: '1676'
  type: endeavor
  endeavor_id: guji-顾炎武-endeavor-3
  title_zh: 都下赴宴，三爵拒夜饮
  detail: 康熙丙辰在都下，两学士设宴延之上座；三爵既毕即起还寓，闻夜饮之请怒曰：淫奔腾贿皆于夜行之，岂有正人君子而夜行者乎
- id: guji-顾炎武-event-death
  date: '1682'
  year_of: '1682'
  type: death
  title_zh: 顾炎武卒
