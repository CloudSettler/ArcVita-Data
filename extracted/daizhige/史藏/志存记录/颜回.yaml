  lesson: 贫而好学、安贫乐道，以德行垂范后世
  summary_first_person: 我名颜回，字子渊，鲁国人，孔门七十二贤之首，以德行著称。我居于陋巷，箪食瓢饮，人不忍其忧而我不改其乐。可惜天不假年，早早离世，孔子痛惜曰『天丧予』。后世尊我为『复圣』，颜氏子孙绵延七十馀代，皆奉我为始祖。
