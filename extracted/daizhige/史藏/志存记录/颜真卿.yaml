    title_zh: 书《多宝塔碑》，确立个人楷书面目
    rationale: 打破初唐瘦硬书风，融入篆籀笔意，形成端庄雄伟的颜体楷书。
  - date: 0758
    title_zh: 作《祭侄文稿》
    rationale: 痛祭安史之乱中殉难的侄子颜季明，悲愤之情化入笔端，成天下第二行书。
- id: guji-颜真卿-endeavor-2
  name_zh: 社稷忠烈之臣
