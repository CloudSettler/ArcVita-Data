person:
  qid: guji-颜真卿
  name_zh: 颜真卿
  names:
    zh: 颜真卿
    en: Yan Zhenqing
  lifespan:
    birth:
      date: 0709
      precision: year
      is_circa: true
      raw: 颜真卿（709—785，一说708年生）
    death:
      date: 0785
      precision: year
      is_circa: false
      raw: 785年遇害
  birth_date: 0709
  death_date: 0785
  era: 唐代
  reign_ref: 唐玄宗、唐肃宗、唐代宗、唐德宗
  archetype: 忠烈书法家
  dilemmas:
  - - 忠于朝廷与安危自保之间，宁死不附叛贼与强藩
  - - 书法妍媚时风与刚正朴拙书风之间的抉择
  lesson: 以忠烈立身，以笔墨传世
  summary_first_person: 我是颜真卿，字清臣，琅琊颜氏之后，颜惟贞之子。我历经四朝，平乱守土，刚直敢言，终殉节于叛贼李希烈之手；我独创雄浑刚健的"颜体"楷书，与柳公权并称"颜筋柳骨"，后世奉为楷法典范。
  source_urls:
  - https://zh.wikipedia.org/wiki/颜真卿
