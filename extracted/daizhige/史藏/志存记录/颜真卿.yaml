      - 宣抚叛镇
      - 骂贼死节
    start_date: 0783
    highlight_event_id: guji-颜真卿-event-martyrdom
  decisions:
  - date: '0755'
    title_zh: 安禄山反叛时率先举义于平原郡
    rationale: 身为平原太守，早察禄山必反，预先修城积粮，叛起即首倡义兵，联络堂兄常山太守颜杲卿共抗逆贼。
  - date: 0783
    title_zh: 奉命宣抚叛将李希烈，明知危殆仍前往
    rationale: 以社稷大义为重，不顾亲友劝阻，毅然赴蔡州，终不屈遇害。
events:
- id: guji-颜真卿-event-birth
  date: 0709
  year_of: 709
  type: birth
  name_zh: 颜真卿出生
  description: 颜真卿生于京兆万年（一说琅琊临沂望族之后），为颜惟贞之子，颜之推五世孙。
- id: guji-颜真卿-event-calligraphy-start
  date: '0720'
  year_of: 720
  type: endeavor
  name_zh: 早年习书
  description: 幼年家贫乏纸，以黄土扫壁习字，承家学渊源，打下书法根基。
- id: guji-颜真卿-event-official-start
  date: '0734'
  year_of: 734
  type: endeavor
  name_zh: 进士及第，步入仕途
  description: 开元间举进士，历监察御史、殿中侍御史，以刚正闻名。
- id: guji-颜真卿-event-duobaota
  date: '0752'
  year_of: 752
  type: endeavor
  name_zh: 书《多宝塔碑》
  description: 所书《多宝塔感应碑》立，颜体楷书面目渐成，成为后世楷法人门范本。
- id: guji-颜真卿-event-rebellion
  date: '0755'
  year_of: 755
  type: endeavor
  name_zh: 平原首义讨安禄山
  description: 安史之乱爆发，河朔尽陷，独颜真卿坚守平原，联合堂兄颜杲卿举义兵，被推为盟主。
- id: guji-颜真卿-event-jiizhen-wengao
  date: 0758
  year_of: 758
  type: endeavor
  name_zh: 作《祭侄文稿》
  description: 为安史之乱中遇害的侄子颜季明写下《祭侄文稿》，情动于衷，被后世誉为"天下第二行书"。
- id: guji-颜真卿-event-political-exile
  date: '0760'
  year_of: 760
  type: endeavor
  name_zh: 因刚直遭忌，屡遭外放
  description: 肃宗、代宗朝因直言忤权臣元载等，先后外放刺史，政绩卓著，民心归附。
- id: guji-颜真卿-event-late-works
  date: 0781
  year_of: 781
  type: endeavor
  name_zh: 晚年书《颜氏家庙碑》
  description: 晚年书法炉火纯青，作《颜氏家庙碑》等，颜体臻于大成。
- id: guji-颜真卿-event-martyrdom
  date: 0785
  year_of: 785
  type: endeavor
  name_zh: 骂贼殉节于蔡州
  description: 德宗时奉派宣抚叛将李希烈，被拘禁不屈，骂贼遇害，年七十七，追赠司徒，谥文忠。
- id: guji-颜真卿-event-death
  date: 0785
  year_of: 785
  type: death
  name_zh: 颜真卿逝世
  description: 忠烈殉国，庙食千秋，其人其书并为后世楷模。
