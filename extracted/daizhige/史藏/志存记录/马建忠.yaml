endeavors:
- id: guji-马建忠-endeavor-1
  title_zh: 东行襄助朝鲜与美国立约
  description_zh: 光绪八年奉李鸿章之命偕丁汝昌东渡仁川，襄助朝鲜与美国议订修好通商条约，并代筹属邦照会与米谷诸款
  phases:
  - key: brewing
    name: 受命东渡
    labels:
      zh: 受命筹备
    start_date: 1882-03-14
    highlight_event_id: guji-马建忠-event-dongxing
  - key: breakthrough
    name: 驻泊仁川折冲
    labels:
      zh: 折冲尊卑
    start_date: 1882-04-10
    highlight_event_id: guji-马建忠-event-dongxing
  - key: climax
    name: 济物浦会盟画押
    labels:
      zh: 会盟定约
    start_date: 1882-05-22
    highlight_event_id: guji-马建忠-event-qianyue
  - key: closure
    name: 蒇事拟游王京
    labels:
      zh: 蒇事善后
    start_date: 1882-05-23
    highlight_event_id: guji-马建忠-event-qianyue
  decisions:
  - date: 1882-03-20
    title_zh: 与美使先期分航赴汉江口
    rationale: 英法德日舰船将集，恐定议遂难，故乘间先发以占机先
  - date: 1882-04-05
    title_zh: 示决裂以折骄气
    rationale: 朝鲜陪臣稍存轻量狡展，故峻词谢馆回舟以张国威而后可引掖
  - date: 1882-05-01
    title_zh: 以约外照会存属邦之名
    rationale: 约内第一条碍平行体统难以并存，故另备照会宽假自主之名实申属邦之实
  - date: 1882-05-10
    title_zh: 米谷出口改禁仁川一口
    rationale: 朝议民情以米谷为重，美使坚不允禁，故以仁川禁运折中以求早蒇
- id: guji-马建忠-endeavor-2
  title_zh: 留学西洋佐治洋务著马氏文通
  description_zh: 早年从学游历法国，通习西文法政，归国佐李鸿章筹办外交洋务，晚年著马氏文通以立中国语法之纲
  phases:
  - key: brewing
    name: 负笈游学
    labels:
      zh: 西学启蒙
    start_date: 1877
    highlight_event_id: guji-马建忠-event-wentong
  - key: breakthrough
    name: 佐幕北洋
    labels:
      zh: 佐治洋务
    start_date: 1880
    highlight_event_id: guji-马建忠-event-dongxing
  - key: climax
    name: 东行襄盟显名
    labels:
      zh: 外交建功
    start_date: 1882-05-22
    highlight_event_id: guji-马建忠-event-qianyue
  - key: closure
    name: 著述文通传世
    labels:
      zh: 著述立言
    start_date: 1898
    highlight_event_id: guji-马建忠-event-wentong
  decisions:
  - date: 1877
    title_zh: 赴法研习法政语言
    rationale: 欲以西法补中法，必先通其语言文字政教之本
  - date: 1898
    title_zh: 著马氏文通成书
    rationale: 华文无纲而散，借西法以立文法，使后学有据而守
events:
- id: guji-马建忠-event-birth
  title_zh: 生于江苏丹徒
  date: 1845
  year_of: 1845
  place_zh: 江苏丹徒
  description_zh: 道光二十五年生于丹徒，自幼治经史，后究西学
- id: guji-马建忠-event-dongxing
  title_zh: 自天津起程东渡朝鲜
  date: 1882-03-14
  year_of: 1882
  place_zh: 天津至仁川济物浦
  description_zh: 奉李鸿章之命偕丁汝昌率威远扬威镇海三舰东行，经烟台成山直指汉江口虎岛下碇
- id: guji-马建忠-event-qianyue
  title_zh: 济物浦襄助朝美画押定约
  date: 1882-05-22
  year_of: 1882
  place_zh: 济物浦帐房
  description_zh: 在近岸帐房莅盟，朝鲜申憲金宏集与美国薛孚尔铃印签押，汉洋文各三册，另具属邦照会一通
- id: guji-马建忠-event-wentong
  title_zh: 马氏文通成书
  date: 1898
  year_of: 1898
  place_zh: 上海
  description_zh: 集多年研习中西文字之得，著马氏文通，为中国首部系统语法之书
- id: guji-马建忠-event-death
  title_zh: 病卒
  date: 1900-08-27
  year_of: 1900
  place_zh: 上海
  description_zh: 光绪二十六年七月病卒，一生襄助洋务外交而以文通传世
