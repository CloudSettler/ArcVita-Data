  decisions:
  - date: 1488
    title_zh: 拒封阿黑麻为哈密王仅许入贡
    rationale: 阿黑麻自有分地难封主哈密迤北亦不通好若来贡则不拒以存大体
  - date: 1492-02
    title_zh: 请以陕巴袭封忠顺王主哈密
    rationale: 哈密三族杂居颉颃北山强虏需索必须得元遗孽理国事庶慑伏诸番不然十年未安
- id: guji-马文升-endeavor-2
  title_zh: 恩威并施迎归金印再兴哈密
  summary_zh: 被虏之后闭关安置贡使以孤虏势料敌守肃整兵以俟袭斩牙兰振威西域终迎归陕巴金印护入哈密底定
