    start_date: 1498-02
    highlight_event_id: guji-马文升-event-1498
  decisions:
  - date: 1494-03
    title_zh: 安置贡使闭嘉峪关绝贡
    rationale: 虏王印而敕使久不报轻中国著矣使结怨众夷以孤其势令知畏惧
  - date: 1495
    title_zh: 用汉番兵兼程袭斩牙兰
    rationale: 专示恩不加威终不知畏须用陈汤故事选罕东番兵为锋汉兵为援出其不意
  - date: 1496
    title_zh: 先取陕巴金印至甘州后还贡使
    rationale: 虏挟诈求还写亦满速儿等须验真归方给赏赉敕谕以防反复
events:
- id: guji-马文升-event-birth
  date: 1426
  year_of: 1426
  title_zh: 诞生
  description: 明宣德元年生于河南钧州后登进士历兵部尚书
- id: guji-马文升-event-1488
  date: 1488
  year_of: 1488
  title_zh: 弘治元年拒封阿黑麻
  description: 阿黑麻杀罕慎求王哈密以兵部尚书议难封主哈密请降玺书责谕仅许入贡四年遂归金印城池
- id: guji-马文升-event-1492
  date: 1492-02
  year_of: 1492
  title_zh: 奏立陕巴袭封忠顺王
  description: 询安定王贡使举亲侄陕巴集议请袭封忠顺王主哈密守臣仓卒送入未给冠服
- id: guji-马文升-event-1493
  date: 1493
  year_of: 1493
  title_zh: 陕巴金印被虏
  description: 弘治六年阿黑麻怒头目阿木郎遂杀之复虏陕巴及金印以去贡使写亦满速儿等适在京
- id: guji-马文升-event-1494
  date: 1494-03
  year_of: 1494
  title_zh: 安置贡使闭关
  description: 遣张海缑谦经略无功而还请以写亦满速儿等安置两广福建闭嘉峪关毋令入贡以孤虏势
- id: guji-马文升-event-1495
  date: 1495
  year_of: 1495
  title_zh: 遣彭清袭哈密振威
  description: 弘治八年命副总兵彭清统汉兵由南山快捷方式会罕东番兵夜袭牙兰虽遁斩首六十余威振西域加赏有功诸臣
- id: guji-马文升-event-1496
  date: 1496
  year_of: 1496
  title_zh: 阿黑麻归陕巴金印
  description: 弘治九年虏畏威悔过遣使入贡并以陕巴金印来归请还贡使议俟至甘州方给赏赉敕谕
- id: guji-马文升-event-1498
  date: 1498-02
  year_of: 1498
  title_zh: 护送陕巴复国哈密
  description: 弘治十一年二月就甘州给陕巴冠服敕谕量留哈剌灰家室居肃州给牛种子护送离散夷人二千余口入哈密兴复国诸番入贡边方底宁
- id: guji-马文升-event-death
  date: 1510
  year_of: 1510
  title_zh: 逝世
  description: 明正德五年卒平生经略哈密十余年及三边诸役朝廷推亡固存自记兴复岁月以示后考
