person:
  qid: guji-马皇后
  name_zh: 孝慈高皇后马氏
  names:
    zh: 马皇后
    en: Empress Ma (Hongwu)
  lifespan:
    birth:
      date: '1332-01-01'
      precision: year
      is_circa: true
      raw: 生于元至顺年间前后，文中未载生年，按卒年五十一逆推
    death:
      date: '1382-09-09'
      precision: day
      is_circa: false
  birth_date: '1332'
  death_date: '1382-09-09'
  era: 元末明初
  reign_ref: 明太祖洪武
  archetype: 贤后·谏诤护生
  dilemmas:
  - 病笃时群臣请祷医，恐医药不效连累医者，拒绝祷医
  - 太祖屡欲诛戮功臣与富民，谏则触怒天威，不谏则害及无辜
  lesson: 定天下在得人心，仁为治本；居富贵而念贫贱，以俭德济刚法
  summary_first_person: 我本是宿州徐王马公之女，父母早亡，由郭子兴抚养，归于起于布衣的洪武帝。渡江之际，我虑元兵断后，先率诸校妻赴太平，兵至果被隔，我还于陈迪家生下皇长子。洪武元年册立为后，我常进言求贤、纳谏、慎杀，救宋濂、止诛郭景祥子、释沈秀、缓死囚之役。我性俭，衣旧衣，率诸嫔蔬食请赈。洪武十五年病笃，我辞祷辞医，唯劝陛下求贤纳谏而崩，年五十一，葬孝陵，终身不复立后。
  source_urls:
  - https://ctext.org.lib/data/胜朝彤史拾遗记
