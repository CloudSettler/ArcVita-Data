events:
- id: guji-马皇后-event-birth
  date: -1332-01-01
  year_of: -1332
  name_zh: 出生
  description: 宿州徐王马公与郑媪之女，生于宿之新丰里（约至顺间）
  era: 元
- id: guji-马皇后-event-join-army
  date: '1352-01-01'
  year_of: 1352
  name_zh: 郭子兴起兵濠州，归附抚养并嫁太祖
  description: 马公杀人避仇，以后托于好友郭子兴；会江淮乱，子兴起兵据濠州，妻张氏劝以马氏配太祖，遂赘太祖于其家
  era: 元末
- id: guji-马皇后-event-cross-river
  date: '1355-01-01'
  year_of: 1355
  name_zh: 率校妻过太平避元兵于陈迪家
  description: 太祖渡江，后恐元兵蹑后，急率诸校妻过太平止繁昌陈迪家，元兵果扼渡，后于迪家生皇长子
  era: 元末
- id: guji-马皇后-event-became-empress
  date: '1368-02-01'
  year_of: 1368
  name_zh: 洪武元年册为皇后
  description: 上即皇帝位，册马氏为后，上追述布衣之言，谓非后德齐一安有今日，群臣呼万岁
  era: 明
- id: guji-马皇后-event-advisory-heart
  date: '1360-01-01'
  year_of: 1360
  name_zh: 时时赞太祖规画
  description: 吴汉接境，战无虚日，后尝谓定天下在得人心，不嗜杀则杀亦罕，太祖深然之
  era: 元末
- id: guji-马皇后-event-save-songlian
  date: '1380-01-01'
  year_of: 1380
  name_zh: 举七却食泣谏而免宋濂死
  description: 宋濂坐孙罪被逮将刑，后侍上食举七向鼎潸然却之，痛宋学士之刑，欲为诸儿服心丧，上为动，明日赦濂改安置茂州
  era: 明
- id: guji-马皇后-event-death
  date: '1382-09-09'
  year_of: 1382
  name_zh: 病崩，葬孝陵
  description: 洪武十五年八月丙戌崩，年五十一；辞祷辞医，遗言惟求贤纳谏；上悲悼终身不再立后，九月葬孝陵，诸生感其恩作歌追念
  era: 明
