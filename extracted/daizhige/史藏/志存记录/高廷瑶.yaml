  date: 1786
  date_precision: year
  title_zh: 乾隆丙午举于乡
  description_zh: 公以乾隆丙午（1786年）乡试中举，其后四上公交车不售，遂以举人出身入仕。
  labels:
    zh:
    - 中举
    - 解元
- id: guji-gaotingyao-event-machang
  endeavor_id: guji-gaotingyao-endeavor-1
  year_of: 1800
  date: 1800
  date_precision: year
  title_zh: 马场苗乱奉命往抚，恩赏六品顶戴
  description_zh: 嘉庆庚申（1800年）马场苗又为乱，公复往抚，事闻，恩赏六品顶戴。此前嘉庆初兴义苗乱，公已应当事之延往定广抚辑，全活数万人。
  labels:
    zh:
    - 抚苗
    - 六品顶戴
- id: guji-gaotingyao-event-datiao
  endeavor_id: guji-gaotingyao-endeavor-1
  year_of: 1801
  date: 1801
  date_precision: year
  title_zh: 大挑一等，奉旨加一等以通判用
  description_zh: 明年（嘉庆六年，1801年）大挑一等，奉旨加一等，以通判任用。
  labels:
    zh:
    - 大挑一等
- id: guji-gaotingyao-event-luzhou
  endeavor_id: guji-gaotingyao-endeavor-2
  year_of: 1802
  date: 1802-09-02
  date_precision: day
  title_zh: 嘉庆壬戌选授安徽庐州通判，九月二日到任
  description_zh: 嘉庆七年壬戌（1802年）以通判选授安徽庐州，八月到皖，九月二日到任。到任七日间拒校官三百金请托、掷还途拾钱券、除老役册名，抚军称真拨烦吏；在皖十年，平反全活无算。
  labels:
    zh:
    - 庐州通判
    - 拒贿
    - 平反
- id: guji-gaotingyao-event-suzhou
  endeavor_id: guji-gaotingyao-endeavor-1
  year_of: 1802
  date: 1802-12
  date_precision: month
  title_zh: 宿州教匪之乱后奉檄权州牧，力请蠲免钱粮
  description_zh: 嘉庆七年十二月，宿州教匪王潮名袭据州城，戕官焚掠。大府檄公往权州牧，兼征本年钱粮四万。公力争蠲租或缓征以苏民困，大府悟，立陈奏，诏如所请。城中居民仅七百余户，公亲拊循给口粮、盖棚栖止、查户口请抚恤。
  labels:
    zh:
    - 宿州
    - 蠲免钱粮
    - 赈恤
- id: guji-gaotingyao-event-shibao
  endeavor_id: guji-gaotingyao-endeavor-1
  year_of: 1803
  date: 1803
  date_precision: year
  title_zh: 赈务毕从实报费五千余金
  description_zh: 宿州赈务事蒇，计所耗金五千余，吏请浮增，幕客亦劝声言四万，公恻然拒之：忍令入己之数反倍蓰乎？遂从实册报。方伯叹曰如此居官其后必大。
  labels:
    zh:
    - 从实报费
    - 廉洁
- id: guji-gaotingyao-event-ehuyan
  endeavor_id: guji-gaotingyao-endeavor-1
  year_of: 1803
  date: 1803-01-03
  date_precision: day
  is_circa: true
  title_zh: 讹言教匪复至，公坚卧静镇
  description_zh: 嘉庆八年正月三日，讹言教匪复至，城外居民仓皇奔走，哭声雷动。公登城授兵登陴，谕众此必奸人欲动众劫掠，自返书院坚卧。天明四境寂然，逻者捕得酗酒造言之徒，立寘诸法，众服其静镇。
  labels:
    zh:
    - 静镇
    - 平讹言
- id: guji-gaotingyao-event-pengmin
  endeavor_id: guji-gaotingyao-endeavor-2
  year_of: 1808
  date: 1808
  date_precision: year
  title_zh: 徽宁棚民被诬聚乱，定十二年递迁之法
  description_zh: 嘉庆十三年，有以棚民结连匪徒聚众称乱诉京师者，诏遣兵察办。公知其诬，乞驻兵县城而自轻骑入山廉得实情，分别遣散回籍；念棚民二十万若同时驱逐将酿乱，请定十二年递迁之法，大府以公议上闻，允为成例。
  labels:
    zh:
    - 棚民
    - 递迁法
    - 寝兵
- id: guji-gaotingyao-event-guangdong
  endeavor_id: guji-gaotingyao-endeavor-2
  year_of: 1826
  date: 1826
  date_precision: year
  is_circa: true
  title_zh: 出知广州府，东莞弭盗，释岑溪冤狱
  description_zh: 公由凤阳府同知升广西平乐府知府，因安徽旧案镌级，两广总督蒋公特奏请捐复，调广东候补，补广州府知府。东莞匪林狗尾聚众攘夺，公奉檄带兵，至则驻兵县城宣榜通衢、重赏购渠、力请撤兵，不数日林狗尾等九十余人悉就擒，余解散勿论。又立释岑溪黎维祺积年诬讼，粤人感颂。
  labels:
    zh:
    - 广州知府
    - 东莞弭盗
    - 折狱
- id: guji-gaotingyao-event-guiili
  endeavor_id: guji-gaotingyao-endeavor-2
  year_of: 1827
  date: 1827
  date_precision: year
  title_zh: 道光丁亥引疾归里
  description_zh: 公在粤东循声益著，大府皆以国士待公，然遽引疾归，病痊仍赴补；至道光丁亥（1827年）又引疾归里，从子五人皆予以恒产，族中子弟诸甥悉经营佽助。
  labels:
    zh:
    - 引疾归
    - 睦族
- id: guji-gaotingyao-event-death
  endeavor_id: guji-gaotingyao-endeavor-2
  year_of: 1830
  date: 1830-10-01
  date_precision: day
  is_circa: true
  title_zh: 道光庚寅八月十五卒于里第
  description_zh: 道光庚寅（1830年）八月十五日，公卒于贵筑里第，诰授朝议大夫、广东广州府知府。所著《宦游纪略》载其宦绩折狱诸事，为后来作吏者之师。
  labels:
    zh:
    - 卒
    - 朝议大夫
