    title_zh: 力争豁免宿州当年钱粮四万余
    rationale: 宿州春夏遭水继以兵乱，逃亡不能耕作，与其追呼无益，无宁广施恩泽；大府悟，立陈奏，诏如所请。
  - date: 1803
    title_zh: 赈务耗费从实册报
    rationale: 百姓疮痍未起，即实心实政犹恐不逮，更因以为利何以上告君父、下对灾黎，遂拒幕客浮增之议，实报五千余金。
