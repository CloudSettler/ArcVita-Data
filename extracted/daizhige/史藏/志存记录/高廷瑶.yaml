    highlight_event_id: guji-gaotingyao-event-dongguan
  - key: closure
    name_zh: 归里著书
    labels:
      zh:
      - 引疾归
      - 著宦游纪略
    start_date: 1827
    highlight_event_id: guji-gaotingyao-event-death
  decisions:
  - date: 1808
    title_zh: 定棚民十二年递迁之法
    rationale: 属邑棚民无虑二十万，若同时驱逐将酿事生乱，乞驻兵县城而自轻骑入山廉得实情，分别遣散回籍，请于大府定为递迁成例。
  - date: 1826
    title_zh: 东莞匪乱按兵宣榜、力请撤兵
    rationale: 贼闻官军来已远扬，按户搜索是使民不死于贼而死于官；驻兵县城宣榜通衢，令居民合力擒贼、重赏购其渠，不数日渠魁就擒，余党解散。
