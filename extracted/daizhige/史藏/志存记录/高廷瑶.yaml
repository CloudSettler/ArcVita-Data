  title_zh: 高廷瑶约生于乾隆年间
  description_zh: 公讳廷瑶，字青书，贵筑洪边里北衙人。父大受，乡里称善人；母宋氏，治家有法度。生年史无明文，据乾隆丙午（1786）中举推约当1760年代。
  labels:
    zh:
    - 出生
    - 贵筑
