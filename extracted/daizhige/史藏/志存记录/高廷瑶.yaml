person:
  qid: guji-gaotingyao
  name_zh: 高廷瑶
  names:
    zh: 高廷瑶
    en: Gao Tingyao
  lifespan:
    birth:
      date: 1765
      precision: decade
      is_circa: true
      raw: 约乾隆年间生（乾隆丙午1786年举于乡，四上公交车不售，推知生年约为1760年代）
    death:
      date: 1830-10-01
      precision: day
      is_circa: true
      raw: 道光庚寅（1830年）八月十五日卒于里第
  birth_date: 1765
  death_date: 1830-10-01
  era: 清代乾隆、嘉庆、道光年间
  reign_ref:
  - 乾隆
  - 嘉庆
  - 道光
  archetype: 循吏·善折狱的爱民知府
  dilemmas:
  - 灾后钱粮当急征以充国库，还是奏请豁免缓征以纾民力
  - 虚报赈灾耗费以牟利，还是从实册报上对君父下对灾黎
  - 大兵进剿棚民疑乱与东莞土匪，还是驻兵宣榜、解散胁从以免累及良民
  lesson: 为官必自尽心始，欲尽心于民必先廉其心、毅其心；廉则不疚于利，毅则不怵于威，方能视民之困苦如身受。
  summary_first_person: 我是贵筑高廷瑶，字青书。乾隆丙午举于乡，四上春官不第。嘉庆间两赴定广抚苗，全活数万人，蒙赏六品顶戴；大挑一等，以通判签授安徽庐州，在皖十年，宿州赈灾力请蠲免钱粮四万，徽宁棚民一案定十二年递迁之法，寝兵不用，平反全活无算。后官广西平乐、广东广州两府知府，东莞之乱力请撤兵而贼渠自擒。我平生所守，惟廉与毅二字，实心实政而已。
