  dilemmas:
  - 族人犯法，依法惩处还是徇私庇护
  - 身居高位accumulate财富还是逃禄避富
  lesson: 执法至公、廉洁自守，虽逃富实为逃死，方为社稷之臣
  summary_first_person: 我鬬子文，楚成王时任令尹四十年。族人干犯国法，廷理知是令尹之族而释放，我斥其徇私，亲自将族人送交廷理接受刑罚，成王闻之更尊重我。我身穿缯布之衣上朝，以鹿裘居家，毫无积蓄，成王每朝赠脯一束糗一筐，每赐禄洲我必逃避，王止而后复入。人问我为何逃避富贵，我说从政为庇民，民多旷乏而我取富，是勤民自封，我逃死非逃富。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6250
