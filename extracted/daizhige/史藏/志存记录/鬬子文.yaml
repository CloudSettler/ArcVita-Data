- id: guji-鬬子文-event-law
  title_zh: 惩办犯法族人
  date: ''
  year_of: ''
  description: 楚成王时，族人干法，廷理闻其令尹之族遂释之。鬬子文责廷理，亲自送族人于廷理受刑，廷理惧而刑之。成王闻之不及履而至，黜廷理而尊子文，使及内政。国人歌曰：子文之族，犯国法程，廷理释之，子文不聴，恤顾怨萌，方正公平。
- id: guji-鬬子文-event-flee
  title_zh: 逃禄辞富
  date: ''
  year_of: ''
  description: 子文为令尹四十年，缯布之衣以朝，鹿裘以处，无一日之积。成王每朝设脯一束糗一筐以羞子文，自是令尹秩之。王每出子文之禄必逃，王止而后复入。人问其故，答曰从政以庇民，民多旷而我取富是勤民自封，我逃死非逃富。
- id: guji-鬬子文-event-death
  title_zh: 鬬子文去世
  date: ''
  year_of: ''
  description: 鬬子文卒，卒年不详。
