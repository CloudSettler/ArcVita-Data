  name_zh: 魏征
  names:
    zh: 魏征
    en: Wei Zheng
  lifespan:
    birth:
      date: '580'
      precision: year
      is_circa: true
      raw: 生年史无明文，约生于北周末年
    death:
      date: 643-02-11
      precision: day
      is_circa: false
      raw: 贞观十七年正月魏征卒，太宗罢朝叹"徴没明鉴昏"
  birth_date: '580'
  death_date: 643-02-11
  era: 唐代（隋末唐初）
  reign_ref: 唐太宗贞观年间
  archetype: 直谏之臣、以仁义辅政之贤相
  dilemmas:
  - 直言进谏冒犯天威与恪守臣节保身之间的两难
  - 力主仁义德化与正视现实功利之政的张力
  - 曾事李建成（隐太子）后转事太宗，忠于旧主与新朝效力的抉择
  lesson: 兼听则明，偏信则暗；忠臣直谏、君主虚己纳谏，方能致治
  summary_first_person: 我历事两朝，以直谏闻于天下。太宗虚己听纳，我以守成之难、仁义之戒屡疏进言，三十年间佐成贞观之治。我卒之后，太宗亲制碑文，然东征失利，复念我言而罢兵引咎。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=642010
endeavors:
- id: guji-魏征-endeavor-1
  key_title: 仕唐直谏，佐成贞观之治
  summary: 魏征为谏议大夫、特进，屡上疏论治道，以仁义、兼听、慎守成之说匡辅太宗。
  phases:
  - key: brewing
    name_zh: 初仕直史馆与东宫旧事之际
    labels:
      zh:
      - 出仕
    start_date: '618'
    highlight_event_id: guji-魏征-event-1
  - key: breakthrough
    name_zh: 论明君暗君与守成之难
    labels:
      zh:
      - 直谏
    start_date: '628'
    highlight_event_id: guji-魏征-event-2
  - key: climax
    name_zh: 累上疏陈十思疏诸篇，力排封德彝之谬
    labels:
      zh:
      - 上疏
      - 匡救
    start_date: '637'
    highlight_event_id: guji-魏征-event-3
  - key: closure
    name_zh: 病卒，太宗罢朝痛惜，亲为制碑
    labels:
      zh:
      - 身后
    start_date: '643'
    highlight_event_id: guji-魏征-event-4
  decisions:
  - date: '626'
    title_zh: 舍隐太子而效忠太宗
    rationale: 太宗即位后不计旧嫌、虚心延纳，魏征感其知遇，遂竭忠进谏以辅治。
  - date: '637'
    title_zh: 上疏力陈守成之难与仁义之政
    rationale: 鉴隋炀帝恃富强而行虐以致亡，惧太宗志趋骄逸，故坚守臣职、犯颜直谏。
events:
- id: guji-魏征-event-birth
  title_zh: 魏征生
  date: '580'
  year_of: 580
  precision: year
  description: 魏征约生于南北朝末期，后经历隋末乱世。
- id: guji-魏征-event-1
  title_zh: 事太宗为詹事主簿、谏议大夫
  date: 626-09
  year_of: 626
  precision: month
  description: 太宗即位后不咎其前事，擢用魏征，布列左右与之论治。
- id: guji-魏征-event-2
  title_zh: 对太宗论明君暗君兼听偏信之道
  date: '628'
  year_of: 628
  precision: year
  description: 贞观二年太宗问何为明君暗君，魏征对以兼听则明、偏信则暗，并举秦二世、梁武帝、隋炀帝为鉴。
- id: guji-魏征-event-3
  title_zh: 贞观十一年上疏论守成之难
  date: '637'
  year_of: 637
  precision: year
  description: 魏征上疏力陈帝王守成之难，言志趣骄逸、徭役不休乃国之衰弊所由起，规诫太宗慎终如始。
- id: guji-魏征-event-4
  title_zh: 魏征卒
  date: 643-02-11
  year_of: 643
  precision: day
  description: 贞观十七年魏征卒，太宗罢朝五日，谓"徴没明鉴昏"，亲制碑文并厚赐抚恤其后。
- id: guji-魏征-event-5
  title_zh: 东征无功，太宗引咎复碑
  date: '645'
  year_of: 645
  precision: year
  description: 征没后太宗志满渐差谬，东征无成，乃自引咎，复立其碑、厚赐其家，追念前规。
