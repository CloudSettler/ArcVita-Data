  summary_first_person: 我是魏源，字默深。我一生科名不显，长期为人作幕，却遍研经世之学，辑《皇朝经世文编》、撰《海国图志》，首倡“师夷长技以制夷”，愿以一介书生之力唤醒国人睁眼看世界。
  source_urls:
  - 续碑传集·魏默深先生传（姚永朴）
