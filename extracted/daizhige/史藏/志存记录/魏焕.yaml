  name_zh: 魏焕
  names:
    zh: 魏焕
    en: Wei Huan
  lifespan:
    birth:
      date: 1485
      precision: year
      is_circa: true
      raw: 明弘治末年左右生
    death:
      date: 1555
      precision: year
      is_circa: true
      raw: 明嘉靖末年左右卒
  birth_date: 1485
  death_date: 1555
  era: 明中叶
  reign_ref: 明世宗嘉靖朝
  archetype: 筹边经世士
  dilemmas:
  - 哈密为中国藩篱当弃当守之辨
  - 调操按伏为利为弊与将得人否之难
  - 屯田军伍法密弊生与缘情立法的两难
  - 茶马不行番族屡扰与羁縻抚剿何先之择
  lesson: 守边先求自治，得人然后有兵有人有土有财，按伏屯田茶马皆不可徒恃文法
  summary_first_person: 吾遍考九边图志，尤详甘肃河西与边墙沿革，见哈密不可弃，屯田不可废，按伏不可滥，茶马不可弛，乃以总论统分镇，以赵充国屯守为法，以戴文襄守御之语为鉴，勒为巡边总论，以备经略之采择
  source_urls:
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E5%BF%97%E5%AD%98%E8%AE%B0%E5%BD%95/%E5%B7%A1%E8%BE%B9%E6%80%BB%E8%AE%BA.html
