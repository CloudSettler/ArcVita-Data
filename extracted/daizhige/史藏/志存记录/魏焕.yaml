endeavors:
- id: guji-魏焕-endeavor-1
  title_zh: 汇编九边考与巡边总论
  summary: 统合甘肃保障边夷经略与边墙沿革，总考北虏套虏海寇之变，成一家筹边之志
  phases:
  - key: brewing
    name: 遍览边志旧档
    labels:
      zh: 酝酿
    start_date: 1535
    highlight_event_id: guji-魏焕-event-birth
  - key: breakthrough
    name: 立总论统分镇体例
    labels:
      zh: 突破
    start_date: 1538
    highlight_event_id: guji-魏焕-event-jiubiankao
  - key: climax
    name: 详考甘肃与边墙成编
    labels:
      zh: 高潮
    start_date: 1540
    highlight_event_id: guji-魏焕-event-gansu-jinglve
  - key: closure
    name: 刊布九边考备经略采择
    labels:
      zh: 收束
    start_date: 1541
    highlight_event_id: guji-魏焕-event-jiubiankao
  decisions:
  - date: 1538
    title_zh: 以总论统甘肃边墙经略
    rationale: 边镇散漫无纲，故先立总论，再分镇考保障边夷经略，使览者得要领
  - date: 1541
    title_zh: 引赵充国戴文襄语为断
    rationale: 空言筹边无据，故引充国屯田留兵之奏与文襄按伏墩堡之法，以古证今
- id: guji-魏焕-endeavor-2
  title_zh: 筹议甘肃屯田茶马与守御改革
  summary: 针对河西孤悬屯田日敝茶马不行按伏失宜，议得人兴屯给马督粮之实政
  phases:
  - key: brewing
    name: 察河西屯田敝坏
    labels:
      zh: 酝酿
    start_date: 1536
    highlight_event_id: guji-魏焕-event-gansu-jinglve
  - key: breakthrough
    name: 参定茶马羁縻与哈密藩篱之策
    labels:
      zh: 突破
    start_date: 1539
    highlight_event_id: guji-魏焕-event-gansu-jinglve
  - key: climax
    name: 痛陈按伏调操屯政积弊
    labels:
      zh: 高潮
    start_date: 1540
    highlight_event_id: guji-魏焕-event-tuntian-yi
  - key: closure
    name: 归纳得人有兵有土有财之序
    labels:
      zh: 收束
    start_date: 1541
    highlight_event_id: guji-魏焕-event-tuntian-yi
  decisions:
  - date: 1540
    title_zh: 主守哈密以全藩篱
    rationale: 哈密乃我国藩篱不可概以外夷视，故议徐图恢复，择忠顺裔与赤斤酋夹攻吐鲁番
  - date: 1541
    title_zh: 主三丁抽一许种屯田不禁多寡
    rationale: 法密则隐种开除军伍日耗，故议缘人情立法，有丁即役，旧册永不更易，新册十年一并，以复屯军
events:
- id: guji-魏焕-event-birth
  title_zh: 生于明弘治末年
  date: 1485
  year_of: 1485
  type: birth
  description: 直隶人，弘治末年左右生，少览方志，留心边防，遂为九边考之学
- id: guji-魏焕-event-jiubiankao
  title_zh: 编成皇明九边考巡边总论
  date: 1541
  year_of: 1541
  type: career
  description: 考甘肃镇山川卫所，叙边墙自战国秦汉至嘉靖刘天和毛伯温修筑之沿革，系以经略总考而成总论
- id: guji-魏焕-event-gansu-jinglve
  title_zh: 陈甘肃保障边夷经略
  date: 1540
  year_of: 1540
  type: career
  description: 论甘肃孤悬千五百里当法赵充国屯守，辨洮河西宁茶马纳马之数，纪亦不剌据西海满四据石城之乱，议抚剿哈密之徐图之策
- id: guji-魏焕-event-tuntian-yi
  title_zh: 上屯田军伍按伏改革议
  date: 1541
  year_of: 1541
  type: career
  description: 陈屯田十无一存军伍不充之故在立法太重，痛革调操按伏之弊，议给堡马专官驻兰州督粮，引刘大夏巡边榜籴之法为例
- id: guji-魏焕-event-death
  title_zh: 卒于嘉靖末年左右
  date: 1555
  year_of: 1555
  type: death
  description: 其书盛行于世，为嘉隆以后言九边者所宗，卒后其经略之议仍见采于边臣
