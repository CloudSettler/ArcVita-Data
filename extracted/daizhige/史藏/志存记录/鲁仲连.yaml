  archetype: 策士辩士
  dilemmas:
  - 直言规谏当权者，还是曲意逢迎以取富贵
  - 好士之名与养士之实的落差该如何点破
  lesson: 真正的好士不在于待古之贤才，而在于以马与色取于今世之同等眼光，取用于今之士
  summary_first_person: 我鲁仲连，齐之辩士也。见孟尝君自谓好士而士不为尽游，遂以厩马皆衣绣食粟、后宫皆衣缟纻食梁肉为喻，指出色与马皆取于今世，士何必待古，直斥其好士未也。
  source_urls:
  - https://zh.wikisource.org/wiki/戰國策/齊四
