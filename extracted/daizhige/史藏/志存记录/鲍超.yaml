    start_date: 1866
    highlight_event_id: guji-鲍超-event-jiaonian
  - key: breakthrough
    name: 迟出夺胜
    labels:
      zh: 援淮破捻
    start_date: 1866-06
    highlight_event_id: guji-鲍超-event-jiaonian
  - key: climax
    name: 解柄归里
    labels:
      zh: 功成见疑
    start_date: 1867
    highlight_event_id: guji-鲍超-event-guitian
  - key: closure
    name: 马白关请战
    labels:
      zh: 老将抗疏
    start_date: 1884
    highlight_event_id: guji-鲍超-event-mabaiguan
  decisions:
  - date: 1866
    title_zh: 负土成阜以阻贼骑
    rationale: 捻为四足贼流行无定乃令人负篓盛土丛为堆阜使马足颠挫步卒可持刀斫马足
  - date: 1884
    title_zh: 抗疏请以队伍直入枪炮
    rationale: 法踞越南诏遏战议和乃言不专恃枪炮必以队伍兜剿绝其根株坚忍持久以厉人才
