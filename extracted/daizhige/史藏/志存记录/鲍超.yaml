  decisions:
  - date: 1856
    title_zh: 请铸钢斧斫浮桥铁索
    rationale: 审知武昌咽喉在浮桥请以渔舟伪装酒船近桥断索以通水师
  - date: 1858-12-31
    title_zh: 除夕开垒决死突围
    rationale: 被围小池驿樵汲俱绝乃宴将激气尽出牛酒犒军夜半溃围而出以挫陈玉成凶锋
- id: guji-鲍超-endeavor-2
  title_zh: 移师剿捻晚节归田复起请战
  summary: 由鄂入豫以土篓车阵制捻骑大胜而与淮军生隙遂解兵归里光绪朝两遇边衅复起屯边终未得一战
  phases:
  - key: brewing
    name: 步骑筹策
    labels:
