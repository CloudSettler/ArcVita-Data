person:
  qid: guji-黄兴
  name_zh: 黄兴
  names:
    zh: 黄兴
    en: Huang Xing
  lifespan:
    birth:
      date: 1874-10-25
      precision: day
      is_circa: false
      raw: 清同治十三年九月十六
    death:
      date: 1916-10-31
      precision: day
      is_circa: false
      raw: 民国五年十月三十一日
  birth_date: 1874-10-25
  death_date: 1916-10-31
  era: 晚清至民国初年
  reign_ref: 清光绪、宣统年间；中华民国元年至五年
  archetype: 革命军事领袖
  dilemmas:
  - 起事屡败而同志殉难，是否坚持再举
  - 武昌事起时无饷无兵，如何支撑战局
  - 二次革命失败后，反袁与顾全党团结之间的抉择
  lesson: 屡败屡起，以身为先，故能聚人心而成共和之业
  summary_first_person: 我黄克强，生平所志在覆清廷、建民国。长沙起事虽败，走日本与孙公元凤同盟，此后广州、武昌诸役，我皆身先士卒，虽断二指、濒于死而不悔。共和既成，袁氏窃柄，我再举义旗，事虽不成，志不可夺，年四十二而卒，自谓无愧于国。
  source_urls:
  - 《朝野新谭》甲编·同盟会之历史
  - 《朝野新谭》甲编·黄兴弟子罗良鉴
endeavors:
- id: guji-黄兴-endeavor-1
  name_zh: 创立华兴会与谋划长沙起义
  phases:
  - key: brewing
    name_zh: 联络会党
    labels:
      zh: 秘密结社
    start_date: 1902
    highlight_event_id: guji-黄兴-event-huaxing-found
  - key: breakthrough
    name_zh: 长沙起义之谋
    labels:
      zh: 起义酝酿
    start_date: 1904-11
    highlight_event_id: guji-黄兴-event-changsha-plot
  - key: closure
    name_zh: 事败东渡
    labels:
      zh: 流亡
    start_date: 1904-11
  decisions:
  - date: 1903-11
    title_zh: 创立华兴会，自任会长
    rationale: 以湖南为根基，联络会党与新军，图两湖首义
  - date: 1904-11
    title_zh: 决定借太后寿期在长沙发难
    rationale: 乘万寿节官绅集会之机举事，然机密泄露遂败
- id: guji-黄兴-endeavor-2
  name_zh: 缔结同盟会与历次南方起义
  phases:
  - key: brewing
    name_zh: 东京合流
    labels:
      zh: 党派联合
    start_date: 1905-08
    highlight_event_id: guji-黄兴-event-tongmeng
  - key: breakthrough
    name_zh: 钦廉、河口诸役
    labels:
      zh: 边地起义
    start_date: 1907
    highlight_event_id: guji-黄兴-event-yuegang-uprising
  - key: climax
    name_zh: 黄花岗之役
    labels:
      zh: 决死一击
    start_date: 1911-04-27
    highlight_event_id: guji-黄兴-event-huanghuagang
  - key: closure
    name_zh: 败退香江，志不稍减
    labels:
      zh: 再图大举
    start_date: 1911-05
  decisions:
  - date: 1905-08-20
    title_zh: 与孙文共组中国同盟会，任庶务
    rationale: 合各省革命团体为一，孙主政略、我主军略，相辅而行
  - date: 1911-04-27
    title_zh: 亲率敢死队攻两广督署
    rationale: 倾党之财力人力于一役，虽知难而必发，以震天下
- id: guji-黄兴-endeavor-3
  name_zh: 武昌督师与民国肇建
  phases:
  - key: breakthrough
    name_zh: 汉阳保卫战
    labels:
      zh: 阳夏之役
    start_date: 1911-10-28
    highlight_event_id: guji-黄兴-event-hanyang-defense
  - key: climax
    name_zh: 就任战时总司令
    labels:
      zh: 力撑危局
    start_date: 1911-11-03
    highlight_event_id: guji-黄兴-event-commander
  - key: closure
    name_zh: 南北议和与临时政府
    labels:
      zh: 共和成立
    start_date: 1912-01-01
    highlight_event_id: guji-黄兴-event-republic
  decisions:
  - date: 1911-10-28
    title_zh: 慨然赴武昌督战
    rationale: 武昌首义孤危，非宿将不足以安军心，遂乔装溯江而上
  - date: 1911-11-27
    title_zh: 弃守汉阳退保武昌
    rationale: 苦战逾旬，弹尽援绝，保存革命武力以待时变
- id: guji-黄兴-endeavor-4
  name_zh: 二次革命与讨袁
  phases:
  - key: brewing
    name_zh: 反袁酝酿
    labels:
      zh: 宋案之后
    start_date: 1913-03
    highlight_event_id: guji-黄兴-event-song-case
  - key: climax
    name_zh: 江苏讨袁
    labels:
      zh: 赣宁之役
    start_date: 1913-07
    highlight_event_id: guji-黄兴-event-second-revolution
  - key: closure
    name_zh: 流亡日本美国，客死沪上
    labels:
      zh: 赍志以殁
    start_date: 1913-09
    highlight_event_id: guji-黄兴-event-death
  decisions:
  - date: 1913-07-14
    title_zh: 赴南京就任江苏讨袁军总司令
    rationale: 宋教仁遇刺，袁氏帝制自为之迹已明，非兵不可遏之
  - date: 1914
    title_zh: 拒组中华革命党按指印之制，留居美国
    rationale: 不愿党员分等誓约，宁海外筹饷助讨袁而不肯屈就
events:
- id: guji-黄兴-event-birth
  event_type: birth
  date: 1874-10-25
  year_of: 1874
  place: 湖南善化（今长沙）
  description: 黄兴生于湖南善化一书香之家，后肄业两湖书院，留学日本习军事
- id: guji-黄兴-event-huaxing-found
  event_type: endeavor
  date: 1903-11
  year_of: 1903
  place: 长沙
  description: 与宋教仁、刘揆一等创立华兴会，被推为会长，谋在湖南举义
- id: guji-黄兴-event-changsha-plot
  event_type: endeavor
  date: 1904-11
  year_of: 1904
  place: 长沙
  description: 乘西太后万寿节谋长沙起义，事泄败露，亡命上海转赴日本
- id: guji-黄兴-event-tongmeng
  event_type: endeavor
  date: 1905-08-20
  year_of: 1905
  place: 东京
  description: 华兴会与兴中会、光复会合组中国同盟会，黄兴任庶务，居孙文之下实际主持党务军事
- id: guji-黄兴-event-yuegang-uprising
  event_type: endeavor
  date: 1911-04-27
  year_of: 1911
  place: 广州
  description: 黄花岗之役，黄兴亲率敢死百余人攻两广总督署，右手断二指犹血战，同志殉难七十二人
- id: guji-黄兴-event-hanyang-defense
  event_type: endeavor
  date: 1911-10-28
  year_of: 1911
  place: 汉阳
  description: 武昌起义后抵汉督师，与清军冯国璋部鏖战于汉口汉阳，苦守月余
- id: guji-黄兴-event-commander
  event_type: endeavor
  date: 1911-11-03
  year_of: 1911
  place: 武昌
  description: 湖北军政府于阅马场筑坛拜将，授黄兴战时总司令，节制民军
- id: guji-黄兴-event-republic
  event_type: endeavor
  date: 1912-01-01
  year_of: 1912
  place: 南京
  description: 中华民国临时政府成立于南京，黄兴任陆军总长兼参谋总长
- id: guji-黄兴-event-song-case
  event_type: endeavor
  date: 1913-03-20
  year_of: 1913
  place: 上海
  description: 宋教仁遇刺，黄兴力主法律解决而形势日恶，南北终至决裂
- id: guji-黄兴-event-second-revolution
  event_type: endeavor
  date: 1913-07-14
  year_of: 1913
  place: 南京
  description: 二次革命爆发，黄兴入南京就任江苏讨袁军总司令，旋以众寡不敌败退
- id: guji-黄兴-event-death
  event_type: death
  date: 1916-10-31
  year_of: 1916
  place: 上海
  description: 讨袁志业方成而胃血病剧，卒于上海，年四十二，国葬于岳麓山
