events:
- id: guji-黄毓祺-event-birth
  date: '1600'
  year_of: 1600
  title_zh: 出生江阴
  description_zh: 黄毓祺字介之号大愚家住江阴东城内，天启元年恩贡豪于文
- id: guji-黄毓祺-event-jiangyin
  date: 1645-08
  year_of: 1645
  title_zh: 江阴城破蹈海脱身
  description_zh: 顺治二年乙酉与参将张宿上舍程壁歃盟守城八旬，八月城破潜渡海谋请兵得免
- id: guji-黄毓祺-event-chuanxi
  date: 1645-10
  year_of: 1645
  title_zh: 传檄四方阴合同志
  description_zh: 作檄言江上孤城首倡大义非脆骨弱植，檄至旧臣遗老所在响应
- id: guji-黄毓祺-event-baitu
  date: 1647-02
  year_of: 1647
  title_zh: 白土攻常州北门溃败
  description_zh: 顺治四年丁亥自舟山进发聚众数万屯武进白土，五鼓薄郡北门，知府夏一鹗开门杀出众散徐趋被执毓祺遁江北
- id: guji-黄毓祺-event-arrest
  date: 1648-04
  year_of: 1648
  title_zh: 被首下海陵狱受拷不屈
  description_zh: 顺治五年戊子春被执见廉使夏一鹗，四月下海陵狱，供称身犹旧国孤臣求一死耳，酷肆拷掠不屈后囚广陵狱
- id: guji-黄毓祺-event-death
  date: 1649-03
  year_of: 1649
  title_zh: 卒于金陵狱
  description_zh: 顺治六年己丑在狱慷慨题咏不辍，三月移金陵狱将刑，作绝命诗被衤丙衣趺坐而逝
