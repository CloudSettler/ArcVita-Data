    title_zh: 辨济水故道与趵突泉源
    rationale: 亲访趵突珍珠诸泉汇大明湖出小清河之实以正附会为复河立据
  - date: 1641
    title_zh: 主张开竹口修清河复故道
    rationale: 目睹各邑自筑堤壑竞通塞水害兴水利失欲除害兴利保田野殷富
- id: guji-黄淳耀-endeavor-2
  title_zh: 海防漕运建言与晚节殉国
  description: 详考元明海运海道胶莱利弊论登州为京师大门安东日照为山东前门请设镇分汛后归嘉定守城殉节
  phases:
  - key: breakthrough
    name: 陈海运七程与胶莱表里之策
    labels:
      zh: 经世建言
    start_date: 1641
    highlight_event_id: guji-黄淳耀-event-haifang
  - key: closure
    name: 归嘉定守城殉义全节
    labels:
      zh: 忠烈收束
    start_date: 1645
    highlight_event_id: guji-黄淳耀-event-death
  decisions:
  - date: 1641
    title_zh: 请调登镇驻胶州南援安东
    rationale: 明登州大舰难入而倭自釜山乘风正对淮安东必为前门当经权两顾兼备京师山东
  - date: 1645
    title_zh: 守嘉定不去以身殉国
    rationale: 邹鲁恭俭忠义之风不可坠愿以笔谈存山左实录以一死励后人气节
