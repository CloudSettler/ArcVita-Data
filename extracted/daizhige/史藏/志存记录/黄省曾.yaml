  lesson: 博览笃行而不徇俗，守孝安贫以著述存戒
  summary_first_person: 吾字勉之吴县人，六龄好缃素古文，弱冠与兄散金购书，南都从乔宇游，又从守仁若水梦阳讲道，嘉靖辛卯魁乡榜而累举不第，好六朝文喜谈经济，性至孝哭父母成疾遂弃诸生业，乙卯避倭侨寄金陵六年，归尽斥田产供婚嫁，焚香宴坐忻然忘老，尝作吴风录以记吴俗得失
