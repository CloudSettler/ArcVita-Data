  date: '1882'
  year_of: 1882
  type: career
  description: 光绪八年奉委至宜兰催收台北城捐询兰中父老详述道光年间署噶玛兰通判乌竹芳星驰冬瓜山罗东鹿埔圆山擒匪抚难民解漳粤围事遂直书其轶事以传
