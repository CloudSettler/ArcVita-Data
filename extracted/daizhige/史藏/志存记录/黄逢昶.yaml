  decisions:
  - date: '1882'
    title_zh: 请募壮丁五百择要驻防先抚后剿
    rationale: 番主我客番守我劳欲剿不剿可抚则抚剿必使知畏抚必使知恩一社投诚众社向慕
  - date: '1884'
    title_zh: 主张不增兵不筹饷以土勇社番驱寇
    rationale: 官军不习海战不合水土漳泉民风强悍番性尤刚借红布盐酒悬奖以逸待劳以拙胜巧
