  title_zh: 隆武帝以人望所归特用为吏部尚书大学士
  description_zh: 隆武即位于福州，进封诸将、简任阁臣，以黄道周人望所归，特用为吏部尚书、大学士，旋为首辅。
- id: guji-黄道周-event-recommend
  person_id: guji-黄道周
  type: endeavor
  date: 1645-08
  year_of: 1645
  precision: month
  is_circa: true
  title_zh: 首辅黄道周疏荐徐鸣时、徐孚远、吴德操、钱澄之
  description_zh: 钱澄之未入关即蒙首辅黄道周疏荐，鸣时、孚远次第授官，澄之与吴德操后至，奉旨与试用。
- id: guji-黄道周-event-precedence
  person_id: guji-黄道周
  type: endeavor
  date: 1645-09
  year_of: 1645
  precision: month
  is_circa: true
  title_zh: 赐宴争班次，引祖制固争武臣无班文臣右者
  description_zh: 上赐宴大臣，郑芝龙以侯爵位宰相上，首辅道周引祖制固争，遂前道周；芝龙怏怏不悦，怨隙遂深。
- id: guji-黄道周-event-departure
  person_id: guji-黄道周
  type: endeavor
  date: 1645-10
  year_of: 1645
  precision: month
  is_circa: true
  title_zh: 知郑氏无出关志，自请出关号召义师
  description_zh: 九月徽州陷、金声被执死节之后，首辅黄道周知郑芝龙无意出关，自请出关号召义师，芝龙若不闻知，听其自去。
- id: guji-黄道周-event-recruit
  person_id: guji-黄道周
  type: endeavor
  date: 1645-10
  year_of: 1645
  precision: month
  is_circa: true
  title_zh: 驻广信募义，无兵无饷以忠义激发人心
  description_zh: 道周驻广信，无兵无饷，徒以忠义激发人心，旬月之间有众万余，亲书诰身奖语，得之者荣于诰敕。
- id: guji-黄道周-event-capture
  person_id: guji-黄道周
  type: endeavor
  date: 1646-01
  year_of: 1646
  precision: month
  is_circa: true
  title_zh: 婺源明堂里兵溃，为张天禄所执送南京
  description_zh: 婺源令为其门人，驰书诱之，许为内应；至明堂里猝遇北兵，我兵溃，张天禄执道周送南京。
- id: guji-黄道周-event-martyrdom
  person_id: guji-黄道周
  type: endeavor
  date: 1646-03
  year_of: 1646
  precision: month
  is_circa: true
  title_zh: 骂洪承畴冒名，南向再拜，就义于南京
  description_zh: 清督洪承畴以同乡谊使人致意，公骂曰承畴死久矣，此无藉小人冒名耳；遂被囚系，讲习吟咏如常，都人争索其书。临难过市，见福建门牌，曰我君在焉、我亲在焉，南向再拜，从容就义。
- id: guji-黄道周-event-death
  person_id: guji-黄道周
  type: death
  date: 1646-03
  year_of: 1646
  precision: month
  is_circa: true
  title_zh: 黄道周殉节，谥忠烈
  description_zh: 事闻，隆武帝震悼辍朝，谥忠烈；钱澄之有哭公诗：二月长干天昼昏，都人争举李膺幡。
