person:
  id: guji-黄道周
  name_zh: 黄道周
  names:
    zh: 黄道周
    en: Huang Daozhou
  lifespan:
    birth:
      date: '1585'
      precision: year
      is_circa: false
      raw: 万历十三年
    death:
      date: 1646-03
      precision: month
      is_circa: true
      raw: 隆武二年二月，就义于南京
  birth_date: '1585'
  death_date: 1646-03
  era: 明末·南明隆武朝
  reign_ref: 隆武帝
  archetype: 忠烈首辅·理学名臣
  dilemmas:
  - 隆武朝廷倚重其人望，然兵饷尽在郑芝龙之手，首辅有位无权
  - 明知郑氏无意出关，自请出师则孤军无援，不出则坐视国事日坏
  - 清督洪承畴以同乡之谊致意，认之则污名节，斥之则速死
  lesson: 士以风节立身，无兵无饷犹可以忠义聚人；临难不苟，虽败犹荣。
  summary_first_person: 我黄道周，以人望所归被隆武帝特用为吏部尚书、大学士，居首辅之位。郑芝龙拥兵骄蹇，赐宴争班次，我引祖制固争，遂结怨于权臣。知郑氏无出关之志，我自请出关号召义师，无兵无饷，徒以忠义激发人心，旬月得众万余。至婺源明堂里，猝遇北兵而溃，为张天禄所执，送南京。洪承畴以同乡致意，我骂曰承畴死久矣，此冒名小人耳。系狱之中讲习吟咏如常，都人争索我书。临难过市，见福建门牌，曰我君在焉、我亲在焉，南向再拜而死，谥忠烈。
