person:
  qid: guji-黄遵宪
  name_zh: 黄遵宪
  names:
    zh: 黄遵宪
    en: Huang Zunxian
  lifespan:
    birth:
      date: 1848-05-29
      precision: day
      is_circa: false
      raw: 道光二十八年四月二十七日
    death:
      date: 1905-03-28
      precision: day
      is_circa: false
      raw: 光绪三十一年二月二十三日
  birth_date: 1848-05-29
  death_date: 1905-03-28
  era: 清代晚期
  reign_ref: 同治·光绪
  archetype: 外交家·维新思想家·诗人
  dilemmas:
  - 自守“居国不非大夫”之义，而针砭时弊、新旧同异之见时露于诗中
  - 所交多旧学家、耳闻微言刺讥，与亲见维新成效、渐信改从西法之间的立场冲突
  - 少作旧稿与新识相乖：悔其少作而点窜增损，存疑之处仍姑仍其旧
  lesson: 觇国岂易言耶——须深稽博考、亲闻亲见，方能晓然于是非得失之宜，不可缘饰古义、足己自封
  summary_first_person: 我于丁丑之冬奉使随槎东渡日本，居东二年，与其士大夫游，读其书、习其事，取杂事衍为小注、串之以诗，成《日本杂事诗》，并拟草《日本国志》。初时新旧同异之见时露于诗中；及阅历日深，见维新百度草创而进步之速为古今万国所未有，乃信其改从西法、卓然自树立。后游美洲、见欧人，益觉其政治学术与日本无大异。光绪十六年七月，我于英伦使馆翻检旧编，颇悔少作，点窜增损，附识数语，以志吾过。
