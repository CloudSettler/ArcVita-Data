    title_zh: 会同张百熙、荣庆奏定学堂章程
    rationale: 前章尚有未备，体察近日情形斟酌修改，条目详密、课程完备，令京外画一
  - date: '1903'
    title_zh: 主张首先急办师范学堂
    rationale: 学堂必须有师，师范为各项学堂之本源、兴学入手之第一义
  - date: '1903'
    title_zh: 中小学堂坚持读经以存圣教
    rationale: 经书即中国之宗教，不读经则三纲五常废绝、中国不能立国，然择切要之经分配课程不妨碍西学
