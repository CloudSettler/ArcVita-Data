  birth_date: '1562-04-24'
  death_date: '1633-11-08'
  era: 明代
  reign_ref: 万历、天启、崇祯
  archetype: 科学家与治国能臣
  dilemmas:
  - 蝗灾虽异于水旱而可人力殄灭，然须合千万众之力，官民协心方能有成
  - 修德禳灾与捕治除蝗之争，宁为民御灾而担"违经反道"之责
  lesson: 蝗灾甚重而除之则易，必合众力共除之；先事消弭胜于临时扑救。
  summary_first_person: 我徐光启，明季历时官至宰辅，深究农政兵事。目睹旱极而蝗、数千里草木皆尽之惨，遂上除蝗疏，考蝗生之缘、条列扑治之法，主张弃虚禳而务实效，先事消弭、临时竭力剪除，责成有司实心经理。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=捕蝗考
