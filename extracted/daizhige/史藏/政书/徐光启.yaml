events:
- id: guji-徐光启-event-birth
  event_type: birth
  date: '1562-04-24'
  year_of: 1562
  title_zh: 徐光启生
  description: 徐光启生于南直隶松江府上海县。
- id: guji-徐光启-event-investigate
  event_type: endeavor_milestone
  date: '1617-01-01'
  year_of: 1617
  title_zh: 奉使夏州，目睹关陕遍地皆蝗
  description: 万历四十余年北上至天启元年南还之间见蝗灾者六；丁巳之秋奉使夏州，关陕邠岐之间遍地皆蝗，土人云百年来所无。
- id: guji-徐光启-event-tianjin
  event_type: endeavor_milestone
  date: '1613-01-01'
  year_of: 1613
  title_zh: 治田天津，遇蝗灾亲验民食蝗
  description: 臣尝治田天津适遇此灾，田间小民悉将蝗蝻烹食，城市用相馈遗，熟而干之鬻于市，数文钱可易一斗，质味与干虾无异。
- id: guji-徐光启-event-memorial
  event_type: endeavor_milestone
  date: '1628-01-01'
  year_of: 1628
  title_zh: 崇祯时上除蝗疏
  description: 考春秋至胜国蝗灾之月、蝗生于涸泽及虾子所化之缘，条列先事消弭、临时捕治、事后剪除之法，主张合众力共除蝗灾。
- id: guji-徐光启-event-death
