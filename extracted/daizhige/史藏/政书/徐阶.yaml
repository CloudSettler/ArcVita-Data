person:
  qid: guji-徐阶
  name_zh: 徐阶
  names:
    zh: 徐阶
    en: Xu Jie
  lifespan:
    birth:
      date: '1503'
      precision: year
      is_circa: true
      raw: 约嘉靖前二年生（弘治十六年）
    death:
      date: '1583'
      precision: year
      is_circa: true
      raw: 万历十一年卒
  birth_date: '1503'
  death_date: '1583'
  era: 明代嘉靖、隆庆年间
  reign_ref: 嘉靖、隆庆、万历
  archetype: 内阁辅臣·隐忍持重的政治家
  dilemmas:
  - 严嵩专权之下忍辱事之、徐图反击，还是直谏抗衡、招致杀身之祸
  - 隆庆初年是否断然清算严党并平衡朝局
  lesson: 在强权之下以隐忍蓄势、待机而动，方能成大事而不失其正
  summary_first_person: 我徐阶，南直华亭人，历仕嘉靖、隆庆两朝，官至内阁首辅、加太师。在严嵩专权时隐忍屈伸而不失己志，终以智谋去嵩，主持朝政，整饬纲纪。身后万历年间得谥“文贞”，取义“道德博闻、大虑克就”。
endeavors:
- id: guji-徐阶-endeavor-1
  name_zh: 仕途与辅政
  phases:
  - key: brewing
    name_zh: 科第入仕
    labels:
      zh:
      - 进士及第
      - 翰林起家
    start_date: '1523'
    highlight_event_id: guji-徐阶-event-ascend
  - key: breakthrough
    name_zh: 隐忍御嵩
    labels:
      zh:
      - 委曲周旋
      - 渐预机务
    start_date: '1548'
    highlight_event_id: guji-徐阶-event-yan
  - key: climax
    name_zh: 首辅主政
    labels:
      zh:
      - 入阁为首辅
      - 匡救时弊
    start_date: '1562'
    highlight_event_id: guji-徐阶-event-climax
  - key: closure
    name_zh: 致仕身后
    labels:
      zh:
      - 还乡养老
      - 万历赠谥文贞
    start_date: '1574'
    highlight_event_id: guji-徐阶-event-shi
  decisions:
  - date: '1542-01-01'
    title_zh: 周旋于严嵩之门而不失自立
    rationale: 严嵩当国，猜刻睚眦之忤立致，阶以谨默容身，实阴为全局之计。
  - date: '1562-01-01'
    title_zh: 相机去嵩、代为首辅
    rationale: 嵩恶日积，帝意渐移，阶顺势经营，终代其政。
  - date: '1567-01-01'
    title_zh: 隆庆初辅政厘革
    rationale: 世宗已崩，阶总之厘革弊政，以振纪纲。
- id: guji-徐阶-endeavor-2
  name_zh: 名节与易名之典
  phases:
  - key: closure
    name_zh: 万历易名
    labels:
      zh:
      - 谥文贞
      - 大虑克就
    start_date: '1573'
    highlight_event_id: guji-徐阶-event-shi
  decisions:
  - date: '1573-01-01'
    title_zh: 曲全名节于身后
    rationale: 明臣谥考载其谥文贞，取义道德博闻、大虑克就，与其老成谋国之品相称。
events:
- id: guji-徐阶-event-birth
  event_type: birth
  title_zh: 徐阶生于南直华亭
  date: '1503'
  year_of: 1503
  description: 徐阶生于南直隶松江府华亭县。
- id: guji-徐阶-event-ascend
  event_type: career
  title_zh: 登进士第、入仕翰林
  date: '1523'
  year_of: 1523
  description: 徐阶举嘉靖二年进士，鲜衣怒马、崭露头角，步入仕途。
- id: guji-徐阶-event-yan
  event_type: career
  title_zh: 累迁至大学士、隐忍周旋于严嵩当国之际
  date: '1548'
  year_of: 1548
  description: 徐阶晋阁辅政，时严嵩专恣，阶以谨重自处，阴主持平而不露圭角。
- id: guji-徐阶-event-climax
  event_type: career
  title_zh: 代严嵩为内阁首辅、主持朝政
  date: '1562'
  year_of: 1562
  description: 严嵩败，徐阶为首辅，匡救积弊，朝政清明，为隆庆新政之基。
- id: guji-徐阶-event-death
  event_type: death
  title_zh: 徐阶卒
  date: '1583'
  year_of: 1583
  description: 万历十一年，徐阶卒于华亭故里。
- id: guji-徐阶-event-shi
  event_type: honor
  title_zh: 万历年间赐谥文贞
  date: '1573'
  year_of: 1573
  description: 朝廷追谥文贞，取义“道德博闻”“大虑克就”，见《明臣谥考》。
