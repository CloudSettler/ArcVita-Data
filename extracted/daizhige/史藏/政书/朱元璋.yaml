  decisions:
  - date: 1352
    title_zh: 弃僧从军，投郭子兴
    rationale: 天下大乱，诸兄皆亡，寄身缁流无以自保，遂淮兵大起时掠入行伍求存。
  - date: 1368
    title_zh: 即皇帝位，建元洪武
    rationale: 群雄削除殆尽，远近归心，1950吴元年李善长等屡请正大位以承天命，遂应群臣推戴。
  - date: 1380
    title_zh: 废中书省，罢丞相
    rationale: 十三年罢中书省，惩胡惟庸之专，收权于上，以杜权臣乱政。
