  date: 1328-09-28
  year_of: 1328
  type: birth
  title_zh: 生于濠州钟离
  detail_zh: 仁祖第四子，母淳皇后陈氏，以元天历元年九月丁丑生。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-join-guozixing
  date: 1352
  year_of: 1352
  type: endeavor
  title_zh: 至正十二年投郭子兴于濠州
  detail_zh: 弃皇觉寺僧籍，从郭子兴起兵，招集义旅，兵力渐众。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-cross-river
  date: 1357
  year_of: 1357
  type: endeavor
  title_zh: 帅师渡江，取滁和并谋金陵
  detail_zh: 龙凤年间招集义旅取滁和，后渡江驻兵太平，明年克金陵。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-visit-jurong
  date: 1357
  year_of: 1357
  type: endeavor
  title_zh: 访求故乡宗族于句容朱巷
  detail_zh: 为念先考常言世为朱巷人，调兵取句容，族父兄昆弟四十余人至，始叙长幼之礼。
  related_persons:
  - guji-朱元璋
