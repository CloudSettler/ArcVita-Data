  - key: climax
    name_zh: 洪武元年追尊四祖
    labels:
      zh:
      - 追尊德祖懿祖熙祖仁祖
      - 修正典章
    start_date: 1368
    highlight_event_id: guji-朱元璋-event-honor-ancestors
  decisions:
  - date: 1368
    title_zh: 追尊四代祖考为帝
    rationale: 即位之初尽人子追远之礼，定帝系昭穆以固国本。
  - date: 1367
    title_zh: 却旗卫夸辞，命去'皇帝万岁'字
    rationale: 自谓此夸大之词非古制，惧蹈陈友谅骄恣速亡之辙。
events:
