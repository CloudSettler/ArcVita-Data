  date: 1368-01-23
  year_of: 1368
  type: endeavor
  title_zh: 即皇帝位，建元洪武
  detail_zh: 洪武元年正月乙亥，即皇帝位，建元洪武。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-abolish-chancellor
  date: 1380
  year_of: 1380
  type: endeavor
  title_zh: 罢中书省，废丞相制
  detail_zh: 洪武十三年罢中书省，丞相四人李善长、徐达、汪广洋、胡惟庸之职自此永废。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-honor-ancestors
  date: 1368-01-23
  year_of: 1368
  type: endeavor
  title_zh: 洪武元年正月乙亥追尊德祖、懿祖、熙祖、仁祖四代祖考为帝
  detail_zh: 追尊伯六公为德祖元皇帝、四九公为懿祖恒皇帝、初一公为熙祖裕皇帝、世珍为仁祖淳皇帝。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-dedication-decline-flag
  date: 1367-12-25
  year_of: 1367
  type: endeavor
  title_zh: 吴元年命去旗卫'皇帝万岁'夸辞
  detail_zh: 以群臣推戴不已，祭告上帝神只；见仗内旗有'天下太平皇帝万岁'字，命去之。
  related_persons:
  - guji-朱元璋
- id: guji-朱元璋-event-death
  date: 1398-06-24
  year_of: 1398
  type: death
  title_zh: 崩于西宫，年七十一，葬孝陵
  detail_zh: 洪武三十一年闰五月乙酉崩，辛卯葬孝陵，谥高皇帝，庙号太祖。
  related_persons:
  - guji-朱元璋
