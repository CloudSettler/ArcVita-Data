    en: Zhu Yuanzhang
  lifespan:
    birth:
      date: 1328-09-28
      precision: day
      is_circa: false
      raw: 元天历元年九月丁丑
    death:
      date: 1398-06-24
      precision: day
      is_circa: false
      raw: 洪武三十一年闰五月乙酉崩于西宫，年七十一
  birth_date: 1328-09-28
  death_date: 1398-06-24
  era: 元末明初
  reign_ref: 洪武
  archetype: 开国之君
  dilemmas:
  - 由贫僧而起义，忠义与求生两难
  - 称帝前的谦让权衡：群臣劝进而恐蹈陈友谅覆辙
  - 建国后废相与功臣处置：集权之安与骨肉之残
  lesson: 出身微贱不碍成大业，然创业易、守成难，得天下者在人心与纲纪。
  summary_first_person: 我元璋，濠州钟离人，起自皇觉寺一僧，投郭子兴于行伍，取滁和、渡江、克金陵，扫平群雄，即皇帝位于应天，建元洪武，创大一统之明。
  source_urls:
  - https://zh.wikisource.org/wiki/明史
