  summary_first_person: 我是明太祖第四子朱棣，初封燕王镇守北平。建文帝削藩，我举兵靖难，四年而入京师即位，改元永乐。在位期间命修典章、遣使四方，最终崩于北征途中榆木川，庙号初为太宗，嘉靖时改成祖。
