  reign_ref: 淳熙 / 绍熙
  archetype: 礼制考订者·理学宗师
  dilemmas:
  - 州县释奠礼仪文缺略，舊本繁复难读，须折衷旧典以定其一
  - 议论不一、主事者更替，礼书修订屡屡中辍
  lesson: 考礼必究其本，虽病目力疾，仍删剔猥杂以成定本
  summary_first_person: 我毕生究心礼制，先后在同安、南康、漳州、潭州任上考订州县释奠之仪，参酌周礼仪礼、唐开元礼与政和五礼新仪，画为礼器图，训释辨明，屡经删定，方成最后定稿。
  source_urls:
  - https://ctext.org/
