  reign_ref: 成化、弘治、正德、嘉靖
  archetype: 内阁首辅·定策元老
  dilemmas:
  - 大礼议之争中坚守礼制而触怒世宗，致仕去国
  - 武宗无嗣，总揽朝政三十余日择立世宗，身处废立之危
  lesson: 危身奉上，推贤尽忠，虽功成定策，终以直道见黜
  summary_first_person: 我杨廷和，四川新都人，历仕三朝，官至内阁大学士。武宗崩后无嗣，我以首辅总揽朝政，迎立兴献王世子，是为世宗。后因大礼议忤旨，致仕归里。隆庆年间，朝廷追谥我“文忠”——危身奉上、推贤尽忠，此朝廷论定我一生之考语。
  source_urls:
  - title: 钦定四库全书·明臣谥考卷上·文忠（鲍应鳌撰）
    url: https://ctext.org/wiki.pl?if=gb&chapter=1
