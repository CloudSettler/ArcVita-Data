  era: 五代十国
  reign_ref: 后周世宗（显德，954—959）
  archetype: 锐意革制的英年帝王
  dilemmas:
  - 继位于养父郭威之后柩前即位，须在内忧外患的乱世中巩固后周基业
  lesson: 均田恤民、整饬典章可为后世立法，然天不假年，壮志未竟
  summary_first_person: 我是柴荣，周太祖郭威养子，唐天祐十八年生于邢州别墅。广顺三年授开封尹、封晋王，显德元年判内外兵马事，于柩前即位，号世宗。在位期间锐意改革，读《长庆集》见元稹均田表，命制图颁赐诸道以均田赋。显德六年崩于万岁殿，年三十九，葬庆陵。
  source_urls:
  - 钦定四库全书·五代会要卷一·帝号
