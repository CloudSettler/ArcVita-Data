events:
- id: guji-王守仁-event-birth
  event_type: birth
  date: 1472-10-31
  year_of: 1472
  date_is_approx: true
  name_zh: 生于浙江余姚
  description_zh: 王守仁出生于浙江余姚县，字伯安，世称阳明先生。
- id: guji-王守仁-event-longchang
  event_type: endeavor_milestone
  date: '1508'
  year_of: 1508
  date_is_approx: true
  name_zh: 龙场悟道
  description_zh: 阳明谪居贵州龙场驿，忽悟圣人之道吾性自足，遂标立心即理、知行合一宗旨，为心学奠基。
- id: guji-王守仁-event-zhuanxilu
  event_type: endeavor_milestone
  date: '1518'
  year_of: 1518
  date_is_approx: true
  name_zh: 门人刊刻《传习录》
  description_zh: 门人徐爱等所录讲学之语刊行，知行合一、致良知之旨得以广布天下。
- id: guji-王守仁-event-ningwang
  event_type: endeavor_milestone
  date: '1519'
  year_of: 1519
  date_is_approx: true
  name_zh: 平定宸濠之乱
  description_zh: 宁王朱宸濠反于南昌，守仁以巡抚之身仓促起兵，鄱阳湖一战三十五日而擒宸濠，功封新建伯。
- id: guji-王守仁-event-shi
  event_type: posthumous_honor
  date: '1567'
  year_of: 1567
  date_is_approx: true
  name_zh: 隆庆年间追谥文成
  description_zh: 隆庆年间朝廷追谥曰文成，取勤学好问、安民立政之义，并追赠新建侯。
- id: guji-王守仁-event-death
  event_type: death
  date: '1529-01-09'
  year_of: 1529
  date_is_approx: true
  name_zh: 卒于江西南安舟中
  description_zh: 嘉靖七年十一月，王守仁病逝于江西南安舟中，门弟子会葬者众，隆庆间追赠新建侯，谥文成。
