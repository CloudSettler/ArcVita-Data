  - 新法求富強与民间扰怨之间的两难
  - 坚持己见与罢黜异论引来的士论分裂
  lesson: 以经义理财求治，虽志在富国强兵，而峻急施行终致争议缠身
  summary_first_person: 我在仁宗朝任三司度支判官、知制诰，神宗即位后越次入对，拜参知政事，创制三司条例议行新法，先后推行青苗、免役、保甲、市易诸法，虽遭吕诲、司马光等屡屡攻诘，仍与神宗同心变法，两度拜相柄政。
endeavors:
