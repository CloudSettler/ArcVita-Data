  - date: '1071-12-10'
    title_zh: 请鬻广惠仓田为常平仓本
    rationale: 为三路及京东常平籴本开源
  - date: '1071-12-27'
    title_zh: 提举编修三司令式
    rationale: 以法式固新法之基
