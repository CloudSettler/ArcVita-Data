  name_zh: 计户定赋
  date: '1236'
  year_of: 1236
  labels:
    zh: 定户数赋税永额
  description: 太宗八年，群臣欲以丁为户，楚材力争不可，遂定二户出丝一斤、五户出丝一斤之法，朝臣谓太轻，楚材曰将来必有以利进者。
  endeavor_id: guji-耶律楚材-endeavor-2
- id: guji-耶律楚材-event-xiaoshi
  name_zh: 奏校士诸路
  date: '1237'
  year_of: 1237
  labels:
    zh: 科试儒士
  description: 太宗九年，楚材奏守成者必用儒臣，乃命刘中、杨奂随郡考试，以经义词赋论分三科，得士四十余人，被俘为奴者就试免奴者四之一。
  endeavor_id: guji-耶律楚材-endeavor-2
