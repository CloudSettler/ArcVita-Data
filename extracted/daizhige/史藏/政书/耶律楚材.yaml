  date: '1230'
  year_of: 1230
  labels:
    zh: 荐廉访使张奂
  description: 太宗二年，楚材奏荐张奂为河南路征收课税所长官廉访使，奂至则减元额四之一，公私便之。
  endeavor_id: guji-耶律楚材-endeavor-2
