  dilemmas:
  - 以书生身份仕于武功征服王朝，如何以文治与仁心约束屠戮
  - 朝臣主张以丁为户征税，楚材须力排众议坚持中原旧制
  lesson: 制度与教化是刀兵之后安天下的根本。
  summary_first_person: 我本是辽宗室，通术数与太玄之学，蒙太祖召于左右。我制庚午元历颁行国内，又借角端之兽力谏班师以全西征生灵。太宗朝我荐贤理税、定计户之赋、奏校士诸路，冀以儒术立国本。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=641606
