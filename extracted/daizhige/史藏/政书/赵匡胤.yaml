  era: 五代十国至北宋初
  reign_ref: 建隆元年（960）至开宝九年（976），宋太祖
  archetype: 创业开国君主
  dilemmas:
  - 禅代之际，幼主临朝而兵权在握，顺受禅让则负周，辞让则失军心
  - 昭宪太后遗命传弟不传子，家庭亲情与王朝安定两难
  lesson: 陈桥兵变黄袍加身，以禅代而立国，又能遵母命传位于弟，示成大事者须审时度势而克己。
  summary_first_person: 我赵匡胤生于洛阳甲马营，仕周至殿前都点检，显德七年受周禅即皇帝位，国号大宋，改元建隆，克平藩镇，肇启一代太平基业，崩于开宝九年，葬巩县永昌陵。
  source_urls:
  - https://zh.wikisource.org/wiki/宋朝事实
