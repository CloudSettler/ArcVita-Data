  era: 五代末至北宋初
  reign_ref: 宋太祖（960—976年在位），年号建隆、干德、开宝
  archetype: 开国之君
  dilemmas:
  - 受周禅之际如何稳固政权、避免重蹈五代短命王朝覆辙
  - 汾晋未平、燕蓟未复，不欲称「一统太平」
  lesson: 陈桥受禅而能偃戈修文，以文治国奠定两宋基业
  summary_first_person: 我赵匡胤，宣祖次子，生于洛阳夹马营。仕周至殿前都点检，显德七年正月受周禅即皇帝位，开基建隆，先后改元干德、开宝。我削平僭乱、南面称尊，然汾晋未平、燕蓟未复，始终不欲称一统太平。开宝九年崩于万岁殿，年五十，葬永昌陵，庙号太祖。
  source_urls:
  - 宋会要辑稿·帝系一·帝号
