    death:
      date: -68
      precision: year
      is_circa: false
      raw: 立三岁而光薨（宣帝地节二年）
  birth_date: ''
  death_date: -68
  era: 西汉
  reign_ref: 汉武帝、汉昭帝、汉废帝昌邑王、汉宣帝
  archetype: 受遗诏辅政的权臣大司马大将军
  dilemmas:
  - 昌邑王淫乱失道：废立君主以安宗庙，还是姑息保位
  - 夫人显毒杀许皇后：隐忍家丑护家族荣宠，还是依法举发
  lesson: 受先帝之托辅幼主，功在定策安邦；然家贵而骄，族灭于权萌，警戒权不可久恃
  summary_first_person: 我霍光以侍中奉车都尉受武帝遗诏，辅立幼主昭帝，行大司马事；昭帝崩，我迎立昌邑王，以其淫乱奏太后废之，又迎立武帝曾孙病已为宣帝。我女儿亦入宫为皇后，然夫人显阴使女医毒杀许皇后，我竟未及纠举。我薨后，霍氏谋反族灭，权极而祸随之。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書
