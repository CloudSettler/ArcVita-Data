- id: guji-霍光-event-birth
  event_type: birth
  date: ''
  year_of: ''
  title_zh: 出生
  description: 霍光生年不详，为霍去病之弟，仕武帝为侍中奉车都尉
- id: guji-霍光-event-zhaodi-assist
  event_type: endeavor
  date: -87
  year_of: 武帝后元二年
  title_zh: 受武帝遗诏辅立昭帝
  description: 以侍中奉车都尉为大司马大将军，受遗诏，辅八岁少主昭帝；明日武帝崩，太子即位
- id: guji-霍光-event-depose-changyi
  event_type: endeavor
  date: -74
  year_of: 元平元年
  title_zh: 奏废昌邑王贺
  description: 昭帝崩无嗣，光请皇后召昌邑王即位；六月癸巳，光奏王贺淫乱请废，太后诏曰可
- id: guji-霍光-event-li-xuandi
  event_type: endeavor
  date: -74
  year_of: 元平元年
  title_zh: 迎立宣帝
  description: 光奏议立武帝曾孙病已，可嗣孝昭皇帝后；庚申，入未央宫，先封阳武侯，群臣奉上玺绶即皇帝位
- id: guji-霍光-event-daughter-queen
  event_type: endeavor
  date: -73
  year_of: 宣帝本始元年
  title_zh: 女入宫立为霍皇后
  description: 夫人显劝光纳其女于宣帝，果立为皇后
- id: guji-霍光-event-xu-hou-poison
  event_type: endeavor
  date: -72
  year_of: 本始二年
  title_zh: 夫人显使女医毒杀许皇后
  description: 许皇后当娠，显使女医淳于衍以附子合大丸饮皇后，皇后遂崩；谥恭哀皇后
- id: guji-霍光-event-death
  event_type: death
  date: -68
  year_of: 宣帝地节二年
  title_zh: 薨
  description: 立为皇后三岁而光薨；其后霍氏谋反事发，显及诸婿兄弟皆诛灭，霍皇后废处昭台宫
