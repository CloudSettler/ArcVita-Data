person:
  qid: guji-高智耀
  name_zh: 高智耀
  names:
    zh: 高智耀
    en: Gao Zhiyao
  lifespan:
    birth:
      date: '1204'
      precision: year
      is_circa: true
      raw: 约1204年（享年六十六，卒年逆推）
    death:
      date: '1269'
      precision: year
      is_circa: false
      raw: 元世祖中统至元间以病终，年六十六
  birth_date: '1204'
  death_date: '1269'
  era: 西夏末至元代（蒙元世祖时期）
  reign_ref: 元世祖忽必烈
  archetype: 儒户保护者与立台建言之臣
  dilemmas:
  - 以儒为驱（儒人沦为驱口）与毁弃斯文之辩
  - 儒户免役反对权臣令儒户与民同役
  - 面对诘难「所释者多非儒」以金喻自辩
  lesson: 尊儒养士、蠲免儒户徭役，方能养成治天下之材。
  summary_first_person: 我出身西夏显族，世业儒学。夏亡后隐居贺兰山，因太子知我通音乐而乘驿进见，首陈西夏儒士与编氓同等供役之弊，乞予蠲免。其后屡次上奏，论儒者三纲五常之道足治国平天下，使汉地、河西儒户徭役悉蠲；又奏「以儒为驱，古无是也」，释免儒人三四千为民；并建议设立御史台为天子耳目。后任西夏中兴等路提刑按察使，以廉勤自将，处事公允。解任后毅然请命北行，未行而病终，年六十六。
  source_urls:
  - https://zh.wikisource.org/wiki/庙学典礼
endeavors:
- id: guji-高智耀-endeavor-1
  name_zh: 为儒户请命、蠲免儒籍徭役
  phases:
  - key: brewing
    name_zh: 隐居与初谒
    labels:
      zh:
      - 隐处贺兰山
      - 乘驿进见
    start_date: '1227'
  - key: breakthrough
    name_zh: 首陈蠲免儒户差役
    labels:
      zh:
      - 西州多士
      - 乞与蠲免
    start_date: '1227'
    highlight_event_id: guji-高智耀-event-plea1
  - key: climax
    name_zh: 北上奏陈儒道与释驱
    labels:
      zh:
      - 蠲免儒户徭役
      - 释儒为民三四千人
    start_date: '1260'
    highlight_event_id: guji-高智耀-event-release
  - key: closure
    name_zh: 权臣之议遂格
    labels:
      zh:
      - 儒户免役议定
    start_date: '1263'
  decisions:
  - date: '1227'
    title_zh: 乘驿走千里诣藩府进见
    rationale: 借应募吹笙之机向西夏世子陈言西州儒士当与编氓一体蠲免差役。
  - date: '1260'
    title_zh: 以儒人差役事北上奏陈
    rationale: 蠲役所以养成儒材，儒者之道自古用之则治，不可一日无。
  - date: '1261'
    title_zh: 奏罢以儒为驱
    rationale: 以儒为驱古无是也，帝方以古道治天下，宜除之，前后得释为民者三四千人。
  - date: '1263'
    title_zh: 反驳权臣令儒户与民同役
    rationale: 孟尝君尚养士三千，陛下富有四海，惜此万分一之儒户不为中国助，其利实多。
- id: guji-高智耀-endeavor-2
  name_zh: 建言御史台与提刑按察使任上肃纪
  phases:
  - key: brewing
    name_zh: 建言设台
    labels:
      zh:
      - 御史台为天子耳目
    start_date: '1261'
    highlight_event_id: guji-高智耀-event-yushitai
  - key: climax
    name_zh: 出任西夏中兴等路提刑按察使
    labels:
      zh:
      - 以廉勤自将
      - 遣驿奏治违戒僧人
    start_date: '1264'
    highlight_event_id: guji-高智耀-event-anjashi
  - key: closure
    name_zh: 解任请行，赍志而没
    labels:
      zh:
      - 毅然请行
      - 以病终
    start_date: '1269'
  decisions:
  - date: '1261'
    title_zh: 奏请建立御史台
    rationale: 前代有御史台为天子耳目，所以肃官常、整治具，诚不可阙。
  - date: '1264'
    title_zh: 遣驿奏诘违戒律挠官法之僧
    rationale: 有司莫敢谁何，须奉旨诘治不少贷，使境内肃然。
  - date: '1269'
    title_zh: 解任入觐后毅然请命北行
    rationale: 上方择人将命北行者，自陈方略大称上意，赍病将行而卒。
