    en: Wei Zhongxian
  lifespan:
    birth:
      date: '1568'
      precision: year
      is_circa: true
      raw: 生年史料未详，姑系于隆庆前后
    death:
      date: '1627'
      precision: year
      is_circa: false
      raw: 崇祯初被诛（正文未载，系于天启末崇祯初）
  birth_date: '1568'
  death_date: '1627'
  era: 明末
  reign_ref: 天启
  archetype: 权阉
  dilemmas:
  - 内廷近侍之身而窃国柄，威福自专
  - 附势者众，身后沦为前代乱亡之鉴
  lesson: 宠任貂珰则干纲不振，权移宦寺终致社稷为墟
  summary_first_person: 我本宫中寺人，因得司礼监秉笔之职，生杀予夺任所欲为，天启年间擅政，拆山石、浚宫河、改直房，威福自专如具固有；然明之败亡实由我辈肆横，遂为千古殷鉴。
  source_urls:
  - https://cta.wikisource.org/wiki/明宮史
