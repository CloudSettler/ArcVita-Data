person:
  qid: guji-丘处机
  name_zh: 丘处机
  names:
    zh: 丘处机
    en: Qiu Chuji
  lifespan:
    birth:
      date: '1148'
      precision: year
      is_circa: true
      raw: 生年未详，据卒年八十推算
    death:
      date: '1227'
      precision: year
      is_circa: false
  birth_date: '1148'
  death_date: '1227'
  era: 金末元初
  reign_ref: 元太祖（成吉思汗）
  archetype: 宗师型
  dilemmas:
  - 金、宋之季俱遣使召之，不赴，而万里赴太祖之召
  - 面对嗜杀之军政，如何以言止杀救民
  lesson: 欲一天下者，必在不嗜杀人
  summary_first_person: 我丘处机，字通密，登州栖霞人，自号长春子。年十九于宁海昆仑山学全真道，与马钰等六人同师王重阳，世称七真人，而我名最著。太祖征西域，遣使赍玺书召我，我以止杀为戒，跋涉万里，四载方达雪山。我告以不嗜杀、敬天爱民、清心寡欲之道，太祖深契其言，赐虎符玺书，称我神仙而不斥其名。后中原兵祸，民罹俘戮，我使其徒持牒购出残民，得复为良者毋虑二三万人。享年八十，改赐宫名长春。
