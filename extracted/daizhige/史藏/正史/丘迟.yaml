  birth_date: '464'
  death_date: '508'
  era: 南朝宋、齐、梁
  reign_ref: 梁武帝天监
  archetype: 文翰之臣（骈文家、记室书檄之才）
  dilemmas:
  - 以书劝反将陈伯之去魏归梁，一篇之文胜于千军
  - 仕历两朝（齐梁易代之际），须择主而事
  lesson: 一纸书檄能动千军——“暮春三月，江南草长”，故国之情感人至深，文字之力量可为武事所不能为。
  summary_first_person: 我丘迟是天监年间临川王萧宏麾下的记室。天监四年北伐时，我奉命私修一书致叛入北魏的陈伯之，以“暮春三月，江南草长，杂花生树，群莺乱飞”之句动其故国之思，伯之因此在寿阳拥众八千来归。世遂以《与陈伯之书》知我。
