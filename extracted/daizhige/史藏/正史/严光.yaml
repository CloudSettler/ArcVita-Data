  archetype: 隐逸高士
  dilemmas:
  - 故人光武征召授官与洁身自守高的抉择，以「泥涂轩冕」之志辞禄归隐
  - 帝王故谊与君臣礼制的分际，虽论道旧交而不敢逾礼偃卧
  lesson: 高尚其志、不事王侯，一介隐士亦足以风励千古
  summary_first_person: 我是会稽余姚人严光，与光武帝有故旧之谊。帝即位后访求于我，我披羊裘垂钓泽中，不肯出仕；虽召至京师论道累日，仍坚辞谏议大夫，归隐富春山耕钓终老。
  source_urls:
  - https://zh.wikisource.org/wiki/御制读严光传
