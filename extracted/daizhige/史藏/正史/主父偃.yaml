  era: 西汉（汉武帝时期）
  reign_ref: 汉武帝刘彻
  archetype: 纵横策士式的改革谋臣
  dilemmas:
  - 以严刑急进之手段推行推恩令与徙豪陵，虽利国而广结怨仇
  - 大丈夫生不五鼎食，死即五鼎烹的功名之执与保身之道相冲突
  lesson: 锐意进取可致骤贵，然恃宠横行、不加收敛者终难自全。
  summary_first_person: 我本是齐国临淄一介穷士，游学四十年而无人肯援手，晚岁西入关中，冒死上书阙下，朝奏而暮召，得武帝赏识。我倡推恩之策使诸侯自分其国，又议徙郡国豪杰于茂陵、置朔方郡，一岁四迁至中大夫。然诸侯大臣皆畏我之口而恨我之为人，及为齐相，遭劾擅受诸侯金，族灭其身，天下乃叹我早知人心之难测也。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷112
  - https://zh.wikisource.org/wiki/漢書/卷064上
