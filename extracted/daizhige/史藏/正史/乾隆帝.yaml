    highlight_event_id: guji-努尔哈齐-event-yehe-fall
  decisions:
  - date: '1583'
    title_zh: 起兵讨尼堪外兰
    rationale: 祖父景祖、父亲显祖死于其诱明兵之城，誓报祖、父之仇。
  - date: '1593'
    title_zh: 迎击九部联军
    rationale: 乌合之众其志不一，先败其前军则全军必走。
  - date: '1599'
    title_zh: 创制国书、开矿置冶
    rationale: 立法制、兴实业，为立国积累根基。
- id: guji-努尔哈齐-endeavor-2
  name_zh: 建国称制与伐明
  phases:
  - key: brewing
    name_zh: 定兵制劝进
    labels:
      zh:
      - 八旗初制
      - 置理政听讼大臣
    start_date: '1601'
    highlight_event_id: guji-努尔哈齐-event-accession
  - key: breakthrough
    name_zh: 即位建元天命
    labels:
      zh:
      - 建国号金
      - 七大恨告天
    start_date: '1616'
    highlight_event_id: guji-努尔哈齐-event-accession
  - key: climax
    name_zh: 萨尔浒大捷与辽东易主
    labels:
      zh:
      - 破明四路大军
      - 下沈阳辽阳
      - 入广宁
    start_date: '1619'
    highlight_event_id: guji-努尔哈齐-event-saluha
  - key: closure
    name_zh: 宁远受挫与崩逝
    labels:
      zh:
      - 败于袁崇焕
      - 病逝爱鸡堡
    start_date: '1626'
    highlight_event_id: guji-努尔哈齐-event-ningyuan
  decisions:
  - date: '1616'
    title_zh: 即位建元天命
    rationale: 归附日众疆域益广，诸贝勒大臣再三劝进。
  - date: '1618'
    title_zh: 以七大恨告天伐明
    rationale: 明归其丧而不执仇人尼堪外兰，又助叶赫，积怨既深，遂誓师伐明。
  - date: '1619'
    title_zh: 萨尔浒先破北路之策
    rationale: 明兵由南来者诱我南也，其北必有重兵，宜先破之。
  - date: '1625'
    title_zh: 迁都沈阳
    rationale: 凡五迁乃定都，进可逼辽西，退有根本，规模远矣。
events:
- id: guji-努尔哈齐-event-birth
  date: '1559'
  year_of: 1559
  type: birth
  title_zh: 努尔哈齐生
  description_zh: 显祖宣皇帝塔克世长子，母宣皇后喜塔喇氏，孕十三月而生，是岁明嘉靖三十八年。
- id: guji-努尔哈齐-event-uprising
  date: 1583-05
  year_of: 1583
  type: milestone
  title_zh: 十三甲起兵讨尼堪外兰
  description_zh: 万历十一年五月，以父祖遗甲十三副起兵，克图伦城，为统一建州之始。
  endeavors:
  - guji-努尔哈齐-endeavor-1
- id: guji-努尔哈齐-event-jiubu
  date: 1593-09
  year_of: 1593
  type: battle
  title_zh: 大破九部联军
  description_zh: 叶赫纠扈伦、蒙古、长白凡九部兵三万来犯，太祖斩叶赫贝勒布斋，敌大溃，俘布占泰。
  endeavors:
  - guji-努尔哈齐-endeavor-1
- id: guji-努尔哈齐-event-accession
  date: 1616-02
  year_of: 1616
  type: founding
  title_zh: 即位建元天命
  description_zh: 天命元年丙辰正月壬申朔即位，建元天命，定国号金，上尊号覆育列国英明皇帝，命四大贝勒五大臣同听国政。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-qida
  date: 1618-04
  year_of: 1618
  type: milestone
  title_zh: 七大恨告天伐明
  description_zh: 天命三年二月壬寅誓师伐明，下抚顺，李永芳降，回军击斩明总兵张承胤。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-saluha
  date: 1619-04
  year_of: 1619
  type: battle
  title_zh: 萨尔浒之战大破明军
  description_zh: 杨镐督师二十万分四路进，凡四日而破三路明兵，杜松、刘綎等皆死，翦商业定。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-liaoyang
  date: 1621-05
  year_of: 1621
  type: conquest
  title_zh: 攻克沈阳辽阳
  description_zh: 天命六年三月大举攻沈阳、辽阳，袁应泰自焚死，辽人夹道呼万岁，尽有辽东。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-guangning
  date: 1622-02
  year_of: 1622
  type: conquest
  title_zh: 入广宁
  description_zh: 天命七年正月克西平堡、入广宁，降其城堡四十，熊廷弼尽焚沿途村堡而走。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-mukden
  date: 1625-04
  year_of: 1625
  type: milestone
  title_zh: 迁都沈阳
  description_zh: 天命十年三月迁都沈阳，是曰盛京，凡五迁乃定都。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-ningyuan
  date: 1626-02
  year_of: 1626
  type: battle
  title_zh: 宁远之败
  description_zh: 天命十一年正月伐宁远，袁崇焕偕满桂、祖大寿婴城固守，西洋砲伤士卒，乃罢攻班师。
  endeavors:
  - guji-努尔哈齐-endeavor-2
- id: guji-努尔哈齐-event-death
  date: 1626-09
  year_of: 1626
  type: death
  title_zh: 努尔哈齐崩
  description_zh: 天命十一年八月丙午大渐，庚戌至爱鸡堡崩，在位十一年，年六十有八，庙号太祖，葬福陵。
