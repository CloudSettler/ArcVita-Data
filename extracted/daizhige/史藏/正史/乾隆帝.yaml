person:
  qid: guji-努尔哈齐
  name_zh: 努尔哈齐
  names:
    zh: 努尔哈齐
    en: Nurhaci
  lifespan:
    birth:
      date: '1559'
      precision: year
      is_circa: false
      raw: 明嘉靖三十八年（己未）
    death:
      date: '1626'
      precision: year
      is_circa: true
      raw: 天命十一年八月庚戌
  birth_date: '1559'
  death_date: '1626'
  era: 明末清初
  reign_ref: 天命（1616—1626）
  archetype: 开国之君
  dilemmas:
  - 祖父与父亲死于明兵之祸，隐忍积蓄而不即叛明
  - 长子褚英欲授政而暴伉失众，处置两难
  - 宁远之败后正视强敌，反思用兵之道
  lesson: 起于十三甲而终建国家，隐忍、用人与兵制革新为创业之本。
  summary_first_person: 我以十三副铠甲起兵，先统一建州，再破九部之师，创制满文、定兵制，建元天命建国号金，以七大恨伐明，萨尔浒一战定基业，取沈阳辽阳，迁都盛京，终于在宁远受挫后病逝，为子孙入主中原奠定根基。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷1
