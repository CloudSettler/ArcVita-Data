      is_circa: true
      raw: 康熙二十三年（1684年）
  birth_date: 1617
  death_date: 1684
  era: 清初
  reign_ref: 康熙
  archetype: 循吏·清廉能臣
  dilemmas:
  - 三藩乱起、湖广腹地动荡，身为地方官须在兵力不足的困境下保境安民
  - 治理地方须兼顾安抚流民与剿平叛乱，剿抚难以两全
  lesson: 居官清廉、勤政爱民，以民为本者虽处乱世亦能成就治绩。
  summary_first_person: 我是于成龙，山西永宁人。我一生为官清廉，从知县做到总督。康熙十三年麻城土寇作乱，我时任黄州知府，组织乡勇讨平叛乱，保一方安宁。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿
