      raw: 天和三年卒，享年六十六
  birth_date: '493'
  death_date: '568'
  era: 北魏末—西魏—北周
  reign_ref:
  - 北魏孝武帝
  - 西魏文帝
  - 北周武帝
  archetype: 功高不矜的开国辅臣
  dilemmas:
  - 战功卓著又位极人臣，如何在权臣宇文泰之下保持谦退自守
  - 领兵灭梁擒杀梁元帝，功业与俘民为奴的历史责任
  lesson: 益国利民，功成而不骄，方为立身长久之道
  summary_first_person: 我于谨历仕北魏、西魏、北周三朝，屡为前锋随宇文泰征战，取杨氏壁、破窦泰、战沙苑、攻柏谷坞，最后奉命讨伐江陵、擒杀梁元帝，立萧察为附庸。虽功勋隆盛，我常以恭谨自持，愿以谋略佐定关中基业。
  source_urls:
  - https://zh.wikisource.org/wiki/周書/卷2
