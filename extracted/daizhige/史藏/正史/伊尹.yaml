events:
- id: guji-伊尹-event-birth
  event_type: birth
  date: '-1600'
  year_of: -1600
  name_zh: 伊尹生
  description: 伊尹名挚，号阿衡，生于空桑，其母居伊水，因命曰伊尹。
  location_zh: 空桑 · 伊水之滨
- id: guji-伊尹-event-1
  event_type: endeavor
  date: '-1610'
  year_of: -1610
  name_zh: 负鼎俎以滋味说汤
  description: 伊尹为有莘氏媵臣，负鼎俎，以滋味说汤，致于王道。或曰汤使人聘迎之，五反然后肯往。
  location_zh: 亳
- id: guji-伊尹-event-2
  event_type: endeavor
  date: '-1600'
  year_of: -1600
  name_zh: 从汤伐桀于鸣条
  description: 夏桀为虐，伊尹从汤兴师，伐昆吾遂伐桀，桀败于有娀之虚，奔于鸣条，夏师败绩。
  location_zh: 鸣条
- id: guji-伊尹-event-3
  event_type: endeavor
  date: '-1600'
  year_of: -1600
  name_zh: 汤践天子位 · 伊尹报政
  description: 汤既胜夏，伊尹报政，诸侯毕服，汤乃践天子位，平定海内。
  location_zh: 亳
- id: guji-伊尹-event-4
  event_type: endeavor
  date: '-1588'
  year_of: -1588
  name_zh: 伊尹作咸有一德
  description: 还亳告诸侯之后，伊尹作咸有一德，言君臣皆有一德。
  location_zh: 亳
- id: guji-伊尹-event-5
  event_type: endeavor
  date: '-1588'
  year_of: -1588
  name_zh: 立太甲 · 作伊训
  description: 帝中壬崩，伊尹乃立太丁之子太甲；帝太甲元年，伊尹作伊训、肆命、徂后。
  location_zh: 亳
- id: guji-伊尹-event-6
  event_type: endeavor
  date: '-1585'
  year_of: -1585
  name_zh: 放太甲于桐宫 · 摄政当国
  description: 帝太甲既立三年，不明暴虐，伊尹放之于桐宫，三年摄行政当国，以朝诸侯。
  location_zh: 桐宫
- id: guji-伊尹-event-7
  event_type: endeavor
  date: '-1582'
  year_of: -1582
  name_zh: 迎太甲授政 · 作太甲训
  description: 太甲悔过反善，伊尹迎之而授之政；太甲修德，诸侯咸归殷，伊尹嘉之作太甲训三篇，称太宗。
  location_zh: 亳
- id: guji-伊尹-event-8
  event_type: death
  date: '-1550'
  year_of: -1550
  name_zh: 伊尹卒 · 以天子礼葬之
  description: 帝沃丁之时，伊尹卒，年百岁，卒时大雾三日，既葬伊尹于亳，沃丁以天子礼葬之，咎单训伊尹事作沃丁。
  location_zh: 亳
