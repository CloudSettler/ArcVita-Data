  name_zh: 伊尹
  names:
    zh: 伊尹
    en: Yi Yin
  lifespan:
    birth:
      date: '-1600'
      precision: year
      is_circa: true
      raw: 伊尹生于伊水之滨，年代约当夏末
    death:
      date: '-1550'
      precision: year
      is_circa: true
      raw: 帝沃丁之时，伊尹卒，年百岁
  birth_date: 约-1600
  death_date: 约-1550
  era: 夏末商初
  reign_ref: 成汤至太甲、沃丁之世
  archetype: 布衣为相 · 王佐之师
  dilemmas:
  - 欲见成汤而无由，遂以媵臣之身、负鼎俎之说近君，其道可谓屈乎？
  - 太甲暴虐不遵汤法，伊尹放之桐宫而摄行国政，臣而代君，忠僭之间孰能辨之？
  lesson: 以滋味说汤而致于王道，能屈身以就志，能摄政而不移心，终以天下之安为归。
  summary_first_person: 我名挚，号阿衡。初为有莘氏媵臣，负鼎俎以滋味说汤，遂任以国政。汤伐昆吾而诛夏桀，我实从之。汤崩，我立太甲，见其暴虐乱德，乃放之于桐宫三年，摄政当国；太甲悔过反善，我迎而授政。太平既靖，我寿百岁而卒，沃丁以天子之礼葬我于亳。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷003
