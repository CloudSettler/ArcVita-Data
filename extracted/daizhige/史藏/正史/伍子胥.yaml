  description: 夫差败越后许越求和北上争霸，子胥力言越乃吴腹心之疾，宜先灭越，夫差不听。
- id: guji-伍子胥-event-death
  date: -484
  year_of: -484
  type: death
  title_zh: 被谗赐属镂之剑自刎
  description: 伯嚭谗子胥将通齐，夫差赐属镂剑命其自尽；子胥临死求悬目于东门以观越军入吴，吴人悯之。
