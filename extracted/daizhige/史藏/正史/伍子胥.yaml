person:
  qid: guji-伍子胥
  name_zh: 伍子胥
  names:
    zh: 伍子胥（伍员，字子胥）
    en: Wu Zixu
  lifespan:
    birth:
      date: -559
      precision: year
      is_circa: true
      raw: 约生于春秋楚国之世（据传约前559年）
    death:
      date: -484
      precision: year
      is_circa: false
      raw: 吴王夫差赐死（约前484年）
  birth_date: 约前559年
  death_date: 前484年
  era: 春秋时期
  reign_ref: 事楚平王、吴王僚、吴王阖闾、吴王夫差
  archetype: 忠谏而冤死的复仇谋臣
  dilemmas:
  - 弃孝从仇：父兄为楚平王所杀，出走他国借兵复仇，背负忠孝两难之责
  - 死谏与身退：预见越国为吴腹心之患，明知直言触怒夫差而仍不忍离国
  lesson: 直言逆耳，忠臣不避死亡而终为谗言所害；复仇之志可成，而人心之防难守。
  summary_first_person: 我本楚国忠良之后，父兄无辜被戮，我历尽艰辛逃亡吴国，助阖闾夺位并西破强楚，掘平王之墓鞭尸雪恨。后辅佐夫差，屡谏越患，惜夫差信伯嚭之言，终赐我属镂之剑自尽。我死之日，求悬吾目于东门，以观越军入吴。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷066
