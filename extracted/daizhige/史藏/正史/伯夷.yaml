  name_zh: 伯夷
  names:
    zh: 伯夷
    en: Bo Yi
  lifespan:
    birth:
      date: 约-1140
      precision: year
      is_circa: true
      raw: 商末（生年不详）
    death:
      date: 约-1070
      precision: year
      is_circa: true
      raw: 商末周初，饿死于首阳山
  birth_date: 约-1140
  death_date: 约-1070
  era: 商末周初（殷周之际）
  reign_ref: 殷纣王、周武王
  archetype: 清节隐士
  dilemmas:
  - 让国出走而失孤竹储君之位
  - 扣马谏伐而忠于将亡之殷
  - 耻食周粟而宁饿死于首阳
  lesson: 义不食周粟，求仁而得仁，虽饿死而名垂后世
  summary_first_person: 我是孤竹君长子伯夷，让位于弟叔齐而出走；闻西伯善养老而归之，及武王伐纣，我叩马而谏；殷亡后耻食周粟，隐于首阳山，采薇而食，遂饿死。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷061
  - https://zh.wikisource.org/wiki/史記/卷130
