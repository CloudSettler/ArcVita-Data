  dilemmas:
  - 身处蒙古先世部族传承链，事迹仅见于谱系追述，个人功业无独立记载
  lesson: 先袓名字虽仅存于世系谱牒之中，却是部族血脉绵延与历史记忆的承续者
  summary_first_person: 我名脱罗豁勒真伯颜，为孛儿只吉歹蔑儿干与忙豁勒真豁阿之子。娶妻孛罗黑臣豁阿，生二子：长子都蛙锁豁儿一目能远视，次子朵奔蔑儿干娶豁里剌儿台蔑儿干之女阿兰豁阿为妻。阿兰豁阿感天光而生三子，其后称为尼而伦子孙，即元朝皇室之先。我身处蒙古先世谱系之中，世系相传，由我而后，部族日盛。
  source_urls:
  - https://www.guoxue.com/shibu/24shi/xjs/jmz.htm
