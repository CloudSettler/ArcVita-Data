  dilemmas:
  - 义门读书记中校三国志条目与陈景云著书难以分辨，署名存疑阙之
  - 史志简质而传写刊刻脱误繁多，须以前后文互相考证
  lesson: 校书如扫叶，抉摘精审，阙所不知。
  summary_first_person: 我是何焯，字屺瞻，号义门，长洲人。我博通经史，长于考订，批阅群书随手校勘评点，所校《三国志》考证精详，但又不流于泛作史评；学者皆从之游，世称义门先生。
  source_urls:
  - https://zh.wikisource.org/wiki/欽定四庫全書/史部/三國史辨誤
