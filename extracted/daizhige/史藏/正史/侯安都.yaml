person:
  qid: guji-侯安都
  name_zh: 侯安都
  names:
    zh: 侯安都
    en: Hou Andu
  lifespan:
    birth:
      date: '517'
      precision: year
      is_circa: true
      raw: 约517年
    death:
      date: '563'
      precision: year
      is_circa: true
      raw: 约563年
  birth_date: 约517年
  death_date: 约563年
  era: 南朝梁末至陈初
  reign_ref: 梁武帝至陈高祖陈霸先时期
  archetype: 开国元勋·骁勇战将
  dilemmas:
  - 随陈霸兴起兵勤王时，面对萧勃劝阻"保此太山自求多福"的诱惑，需在自保与忠义之间抉择
  - 率五百骁勇出战徐嗣徽精兵5000，京师空虚之下以寡敌众
  lesson: 乱世之中，择主而附、以身赴险，武功与忠诚可立不世之功，然功高震主者亦常难善终。
  summary_first_person: 我侯安都本是始兴豪杰，当高祖陈霸先于始兴结集义兵、厚结豪杰同谋义举时，我率千余人来附，自此追随其南征北讨。杜龛、韦载举兵反时，我受命留宿卫台省；徐嗣徽引齐兵五千奄至阙下，我领骁勇五百人出战，逼退敌军据守石头。其后我领水军夜袭胡墅，烧齐船千余艘；又率舟师袭徐嗣徽家口于秦州，俘获数百人。齐军十万出栅口犯梁山，我奉命共据梁山御敌；витог大决战之日，我自白下引兵横出其后，齐师大溃，生执徐嗣徽。高祖将南徐州授我，又遣我镇守上流、平定南中诸郡，并随周文育讨平萧勃、余孝顷及王琳之乱。我以骁勇果敢立功于陈室开创之际，是为陈朝开国元勋。
  source_urls:
  - https://zh.wikisource.org/wiki/陳書/卷01
