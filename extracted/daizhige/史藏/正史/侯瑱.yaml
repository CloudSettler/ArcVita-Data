  - guji-周文育
  - guji-侯安都
  location_zh: 湘州
  description_zh: 湘州刺史王琳拥兵不应命，高祖遣周文育、侯安都率众讨之，侯瑱亦在上流经略之列。
- id: guji-侯瑱-event-death
  date: '561'
  year_of: '561'
  title_zh: 侯瑱卒
  participants:
  - guji-侯瑱
  location_zh: 建康
  description_zh: 侯瑱卒于陈天嘉二年，为陈初宣力上游之重臣。
