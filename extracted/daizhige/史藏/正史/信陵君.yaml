  archetype: 诸侯公子 / 合纵抗秦领袖
  dilemmas:
  - 窃符救赵虽救邯郸之危，却得罪魏王而滞留赵国，忠孝两难
  - 率五国合纵破秦声威震主，魏王复用又见疑于心
  lesson: 威名过盛则蔽主之明，合纵可却强秦于一时，而难解猜忌之祸
  summary_first_person: 我是魏无忌，魏昭王少子、安釐王异母弟，封信陵君。秦围邯郸，我窃魏王虎符、矫杀晋鄙夺军救赵；后归魏，上将军任上，庄襄王三年，我率燕、赵、韩、楚、魏五国之兵击秦，秦军败于河外，蒙骜败退而去。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷006
