events:
- id: guji-元好问-event-birth
  date: '1190'
  year_of: 1190
  type: birth
  title_zh: 元好问生
  description_zh: 金章宗明昌元年，元好问生于太原秀容（今山西忻州）。
- id: guji-元好问-event-yangyang-reading
  date: '1205'
  year_of: 1205
  type: endeavor
  title_zh: 少年咏《雁丘词》显才名
  description_zh: 十六岁赴试并州，作《摸鱼儿·雁丘词》，'问世间情是何物'传诵千古。
- id: guji-元好问-event-cuili-chaos
  date: '1233'
  year_of: 1233
  type: endeavor
  title_zh: 亲历崔立之变与汴京陷落
  description_zh: 崔立叛乱降蒙，元好问自尚书省掾被署为左右司员外郎，亲见亡国惨状。
- id: guji-元好问-event-duixia-collect-history
  date: '1234'
  year_of: 1234
  type: endeavor
  title_zh: 金亡后自言'国亡史作'
  description_zh: 金哀宗末帝亡后，元好问 Tak 誓以修史自任，广泛收访金源君臣言行遗事。
- id: guji-元好问-event-writings
  date: '1240'
  year_of: 1240
  type: endeavor
  title_zh: 著《壬辰杂编》等以存史事
  description_zh: 编录金末丧乱见闻与故臣言行，为后来修《金史》提供重要依据。
- id: guji-元好问-event-zhongzhou-ji
  date: '1249'
  year_of: 1249
  type: endeavor
  title_zh: 编成《中州集》
  description_zh: 集金源一代诗人作品与小传，以诗存人，保存一代文献。
- id: guji-元好问-event-death
  date: '1257'
  year_of: 1257
  type: death
  title_zh: 元好问卒
  description_zh: 元宪宗七年，元好问卒于获鹿寓舍，年六十八，谥文正世称遗山先生。
