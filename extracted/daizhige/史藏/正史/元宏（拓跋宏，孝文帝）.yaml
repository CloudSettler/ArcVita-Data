  decisions:
  - date: '471'
    title_zh: 五岁即位，尊冯太后为太皇太后临朝
    rationale: 献文帝禅位，幼主继统，冯太后主政推行前期改革
  - date: 493-08
    title_zh: 借南伐之名率军南下，实谋迁都洛阳
    rationale: 平城保守势力强大，托辞南征绕开阻力
  - date: 496-02
    title_zh: 下诏改拓跋氏为元氏，定鲜卑姓氏为汉姓
    rationale: 断诸北语、改姓氏以绝华夷之辨，促进胡汉融合
- id: guji-元宏-endeavor-2
  name_zh: 统一天下的南征之志
  phases:
