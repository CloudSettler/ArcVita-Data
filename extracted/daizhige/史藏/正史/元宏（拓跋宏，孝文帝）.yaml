      - 南征
    start_date: '497'
    highlight_event_id: guji-元宏-event-3
  - key: closure
    name_zh: 病重仍催军，崩于征程
    labels:
      zh:
      - 殁于军次
    start_date: '499'
    highlight_event_id: guji-元宏-event-4
  decisions:
  - date: '497'
    title_zh: 决意亲征南方以图一统
    rationale: 汉化根基已固，欲以武功混一海内
  - date: '499'
    title_zh: 病笃仍不许退军
    rationale: 以统一大业为念，抱疾催军至死
