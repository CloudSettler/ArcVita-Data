person:
  qid: guji-元宏
  name_zh: 元宏（拓跋宏，北魏孝文帝）
  names:
    zh: 元宏
    en: Xiaowen Emperor of Northern Wei
  lifespan:
    birth:
      date: '467'
      precision: year
      is_circa: false
      raw: 皇兴元年生
    death:
      date: 499-04-26
      precision: day
      is_circa: false
      raw: 太和二十三年四月崩于南征途中
  birth_date: '467'
  death_date: 499-04-26
  era: 北魏
  reign_ref: 太和（471–499）
  archetype: 改革帝王
  dilemmas:
  - 迁都洛阳与平城保守贵族势力的激烈冲突
  - 汉化改制与鲜卑旧俗之间的文化张力
  - 南征统一志向与健康状况恶化的矛盾
  lesson: 以汉化改革融合胡汉，为民族融合奠定基础，但急进改制亦埋下后患。
  summary_first_person: 我五岁即位，由祖母冯太后临朝培养。亲政后力推汉化：迁都洛阳，禁胡服胡语，改鲜卑姓氏为汉姓，定姓族，制礼作乐。我三十三岁崩于南征途中，一生志在混一戎华。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷七下
