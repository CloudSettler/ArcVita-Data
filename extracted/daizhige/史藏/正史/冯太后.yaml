person:
  qid: guji-冯太后
  name_zh: 冯太后
  names:
    zh: 冯太后
    en: Empress Dowager Feng
  lifespan:
    birth:
      date: '0442'
      precision: year
      is_circa: true
      raw: 约生于北魏太平真君年间（约442年），长乐信都人，文成帝皇后
    death:
      date: 0490-09
      precision: month
      is_circa: false
      raw: 太和十四年（490年）崩于太和殿，谥文明太皇太后
  birth_date: '0442'
  death_date: 0490-09-17
  era: 北魏
  reign_ref: 献文帝、孝文帝临朝称制
  archetype: 临朝改革家
  dilemmas:
  - 以汉制改造鲜卑旧俗，触动鲜卑贵族利益
  - 母子（与献文帝）权柄之争与权力合法性
  - 身为汉人女子执掌鲜卑皇朝的最高权力
  lesson: 制度变革须以稳固权力与渐进推行相济，方能成事
  summary_first_person: 我是北魏文明太后冯氏，两度临朝称制，主政十余年。我推行俸禄制、均田制与三长制，整顿吏治、劝课农桑，亲自抚养教育孝文帝，为北魏的汉化与太和之治奠定了根基。
  source_urls:
  - https://zh.wikisource.org/wiki/北史/卷13
endeavors:
- id: guji-冯太后-endeavor-1
  name_zh: 太和改制
  phases:
  - key: brewing
    name_zh: 初掌朝政
    labels:
      zh:
      - 密定诛乙浑
      - 临朝听政
    start_date: 309
    highlight_event_id: guji-冯太后-event-1
  - key: breakthrough
    name_zh: 再度临朝
    labels:
      zh:
      - 献文暴崩
      - 再临朝称制
    start_date: 318
    highlight_event_id: guji-冯太后-event-3
  - key: climax
    name_zh: 推行新制
    labels:
      zh:
      - 俸禄制
      - 均田制
      - 三长制
    start_date: 0484
    highlight_event_id: guji-冯太后-event-4
  - key: closure
    name_zh: 身后余绪
    labels:
      zh:
      - 太和十四年崩
      - 孝文帝继承变法
    start_date: 0490
    highlight_event_id: guji-冯太后-event-death
  decisions:
  - date: 310
    title_zh: 密定大计诛杀权臣乙浑
    rationale: 乙浑专擅朝权、矫诏杀害大臣，威胁皇权，遂运筹帷幄将其收捕处死，稳定朝局
  - date: 318
    title_zh: 毒杀献文帝、再度临朝称制
    rationale: 献文帝褫夺其宠臣之位并与太后政争激烈，太上皇暴崩后以太皇太后之尊再掌大权
  - date: 0484
    title_zh: 颁行俸禄制、严惩贪赃
    rationale: 北魏旧制官吏无禄、恣意取敛，行班禄以整饬吏治，赃满一匹者处死
  - date: 0485
    title_zh: 颁均田令
    rationale: 为抑制豪强兼并、恢复生产，按人口分配露田桑田，使耕者有其田
  - date: 0486
    title_zh: 建立三长制
    rationale: 以邻长、里长、党长取代宗主督护，清查隐户、均赋役，与均田制相辅并行
events:
- id: guji-冯太后-event-birth
  event_type: birth
  title_zh: 冯氏生于长乐信都
  date: '0442'
  year_of: 442
  is_circa: true
  description: 北魏太武帝年间，冯氏生于长乐信都，为北燕皇族冯朗之女，后没入宫中为奴婢
- id: guji-冯太后-event-1
  event_type: political
  title_zh: 密定诛乙浑、初度临朝
  date: '0466'
  year_of: 466
  is_circa: false
  description: 文成帝崩后，权臣乙浑专政，冯太后定策诛之，以皇太后之尊临朝听政
- id: guji-冯太后-event-2
  event_type: political
  title_zh: 罢临朝、归政献文帝
  date: '0467'
  year_of: 467
  is_circa: true
  description: 孝文帝拓跋宏出生，冯太后罢令归政，躬亲抚育皇孙
- id: guji-冯太后-event-3
  event_type: political
  title_zh: 再度临朝称制
  date: '0476'
  year_of: 476
  is_circa: false
  description: 太上皇献文帝暴崩，冯太皇太后再度临朝称制，威福莫测，号令皆出其手
- id: guji-冯太后-event-4
  event_type: reform
  title_zh: 推行俸禄、均田、三长诸制
  date: 0484
  year_of: 484
  is_circa: false
  description: 太和八九年间，先后颁行俸禄制、均田制、三长制，奠定孝文帝改革的基础
- id: guji-冯太后-event-5
  event_type: education
  title_zh: 亲教育与培养孝文帝
  date: '0477'
  year_of: 477
  is_circa: true
  description: 冯太后亲自作《劝戒歌》三百余章、又作《皇诰》，以汉文化教养孝文帝，视如己出
- id: guji-冯太后-event-death
  event_type: death
  title_zh: 崩于太和殿
  date: 0490-09-17
  year_of: 490
  is_circa: false
  description: 太和十四年九月，冯太后崩于太和殿，谥文明太皇太后，孝文帝悲哀过礼、五日不食
