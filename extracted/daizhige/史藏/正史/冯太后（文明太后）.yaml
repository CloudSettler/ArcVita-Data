person:
  qid: guji-冯太后
  name_zh: 冯太后（文明太后）
  names:
    zh: 冯太后／文明太后
    en: Empress Dowager Feng
  lifespan:
    birth:
      date: '442'
      precision: year
      is_circa: false
      raw: 北魏文成帝时期
    death:
      date: 490-10-17
      precision: day
      is_circa: false
      raw: 太和十四年九月
  birth_date: '442'
  death_date: 490-10-17
  era: 北魏
  reign_ref: 北魏文成帝、献文帝、孝文帝时期
  archetype: 临朝称制的改革型太后
  dilemmas:
  - 在男性主导的皇权体系中，以太后身份长期临朝专政，须平衡鲜卑贵族与汉人士族
  - 推行俸禄制、均田制等汉化改革，触动鲜卑旧贵族利益，需以铁腕与怀柔并用
  lesson: 制度变革成功的关键，在于改革者兼具魄力、耐心与对时势的精准判断
  summary_first_person: 我是北魏文明太后冯氏，两度临朝称制，辅佐孝文帝推行俸禄制、均田制等改革，为北魏的汉化与强盛奠定根基。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷13_皇后列傳
endeavors:
- id: guji-冯太后-endeavor-1
  name_zh: 两度临朝称制
  phases:
  - key: brewing
    name_zh: 入宫为后
    labels:
      zh: 入宫、晋位皇后
    start_date: '452'
    highlight_event_id: guji-冯太后-event-queen
  - key: breakthrough
    name_zh: 首次临朝
    labels:
      zh: 诛乙浑、临朝称制
    start_date: '466'
    highlight_event_id: guji-冯太后-event-regent1
  - key: climax
    name_zh: 再度临朝与太和改制
    labels:
      zh: 太和改革、俸禄制、均田制
    start_date: '476'
    highlight_event_id: guji-冯太后-event-regent2
  - key: closure
    name_zh: 病逝与身后哀荣
    labels:
      zh: 崩于太和十四年
    start_date: '490'
    highlight_event_id: guji-冯太后-event-death
  decisions:
  - date: '466'
    title_zh: 密定大计诛权臣乙浑
    rationale: 乙浑专权危局，唯有除之方能安定朝政，遂果断夷灭之，实现了首次临朝
  - date: '476'
    title_zh: 再度临朝，尊为太皇太后
    rationale: 献文帝暴崩，孝文帝年幼，朝政须由我总摄，遂再度称制
  - date: '484'
    title_zh: 推行俸禄制
    rationale: 鲜卑旧制无俸禄致使贪腐横行，唯有立俸给禄、严惩赃污，方能整饬吏治
  - date: '485'
    title_zh: 颁行均田令
    rationale: 豪强兼并、民多失田，均田可以授田于民，安民裕国，遂下均田令
events:
- id: guji-冯太后-event-birth
  kind: birth
  date: '442'
  year_of: 442
  title_zh: 出生于长安
  description: 冯氏生于长安，长乐信都人，为北燕皇族冯朗之女。
- id: guji-冯太后-event-queen
  kind: appointment
  date: 455-01-01
  year_of: 455
  title_zh: 被立为文成帝皇后
  description: 太安二年，冯氏被立为皇后，进入北魏权力核心。
- id: guji-冯太后-event-chaos
  kind: incident
  date: 465-06-01
  year_of: 465
  title_zh: 文成帝驾崩
  description: 文成帝拓跋濬崩，太子弘即位，是为献文帝，冯氏尊为皇太后。
- id: guji-冯太后-event-regent1
  kind: political
  date: 466-02-01
  year_of: 466
  title_zh: 诛乙浑，临朝称制
  description: 天安元年，冯太后密定大计，夷灭专权的乙浑，遂临朝称制。
- id: guji-冯太后-event-regent2
  kind: political
  date: 476-06-01
  year_of: 476
  title_zh: 再度临朝，以太皇太后称制
  description: 承明元年，献文帝暴崩，孝文帝即位，冯太皇太后再度临朝称制，直至去世。
- id: guji-冯太后-event-salary-law
  kind: reform
  date: 484-06-01
  year_of: 484
  title_zh: 推行俸禄制
  description: 冯太后主持下颁行俸禄制，官员按品受俸，严惩贪赃，整饬北魏吏治。
- id: guji-冯太后-event-land-law
  kind: reform
  date: 485-01-01
  year_of: 485
  title_zh: 颁行均田令
  description: 太和九年，在冯太后主持下颁布均田令，计口授田，影响此后数百年土地制度。
- id: guji-冯太后-event-death
  kind: death
  date: 490-10-17
  year_of: 490
  title_zh: 病逝于太和殿
  description: 太和十四年九月，文明太皇太后冯氏崩于太和殿，孝文帝五日内不御一食，哭极尽哀。
