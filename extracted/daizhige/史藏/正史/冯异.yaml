  era: 东汉初（更始—建武年间）
  reign_ref: 汉光武帝刘秀
  archetype: compound_lifespan
  dilemmas:
  - 代替邓禹西征赤眉，先败于回溪，后须自证仍能破敌
  - 面对朱鲔大军攻温，坚守孟津并力战拒敌
  lesson: 败而不馁，转战再起，终以崤底大捷奠定关中之功
  summary_first_person: 我冯异在光武中兴之际先守孟津拒朱鲔，与寇恂大破敌军；后为征西大将军代邓禹伐赤眉，虽先败于回溪，旋于崤底大破赤眉十余万众，又破延岑于上林、拒公孙述将于陈仓，为平定关中立功。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷1下
