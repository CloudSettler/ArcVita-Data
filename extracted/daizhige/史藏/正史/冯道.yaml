  era: 五代
  reign_ref: 后唐明宗
  archetype: polemicist
  dilemmas:
  - 乱世中历事数朝，如何在政权更迭中保全官身与济民初心
  - 是否直言进谏以图善治，抑或明哲保身
  lesson: 处乱世而务实务民，不以一朝一姓之兴废易其济世之志。
  summary_first_person: 我冯道，历仕五代数朝，在天成二年拜相，明宗常向我问民间疾苦，我也直言谷帛之价与民生无痛疫，劝帝修德报天。庄宗崩后，我任大行皇帝山陵使主丧；潞王入洛，我率百官迎于蒋桥，旋即罢相。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史/唐本紀
