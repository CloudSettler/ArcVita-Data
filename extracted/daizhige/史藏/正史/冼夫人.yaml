  decisions:
  - date: 0549
    title_zh: 发兵助陈霸先讨平李迁仕
    rationale: 侯景乱起，李迁仕据州反叛，我率兵破之，并与陈霸先合力，认其为真主。
  - date: 0589
    title_zh: 迎隋将韦洸入广州，岭南遂定
    rationale: 陈亡之后，我奉隋诏迎王师，以所辖八州归附，免岭南兵祸。
  - date: '0601'
    title_zh: 出兵平定番州刺史冯暄之迟留与王仲宣余党
    rationale: 番州总管赵讷贪虐致乱，我上状论罪，并亲载诏书巡抚诸州。
events:
- id: guji-冼夫人-event-birth
  year_of: 512
  date: '0512'
  date_precision: year
  title_zh: 冼夫人约生于梁代高凉俚族首领之家
  description: 约生于梁天监年间，世为南越首领，跨据山洞，其部落有十万余家。
- id: guji-冼夫人-event-death
  year_of: 601
  date: 0601-01
  date_precision: month
  title_zh: 冼夫人卒
  description: 仁寿初卒，赙物一千段，遣使致祭，谥曰诚敬夫人。
- id: guji-冼夫人-event-career-1
  year_of: 535
  date: '0535'
  date_precision: circa
  title_zh: 与罗州刺史冯融之子冯宝成婚
  description: 冯化为续命于我，约以婚姻；我约本宗宗族，遵奉礼法，与冯宝共理政。
- id: guji-冼夫人-event-career-2
  year_of: 549
  date: 0549
  date_precision: year
  title_zh: 破李迁仕于高凉
  description: 侯景之乱，高州刺史李迁仕反，我以奇兵袭破其栅，又与陈霸先会师，后助陈定岭南。
- id: guji-冼夫人-event-career-3
  year_of: 589
  date: 0589
  date_precision: year
  title_zh: 率众迎隋，岭南安定
  description: 隋开皇九年，我遣孙冯魂迎韦洸入广州，以八州归附，隋册我为宋康郡夫人。
- id: guji-冼夫人-event-career-4
  year_of: 601
  date: '0601'
  date_precision: year
  title_zh: 巡抚诸州，册封谯国夫人
  description: 番州总管赵讷贪虐害民，我上书论罪后亲载诏书巡历十馀州，宣述上意；文帝册我为谯国夫人，开幕府，置官属，赐兵符。
