  birth_date: 约512年
  death_date: 601年（仁寿初）
  era: 南朝梁至隋
  reign_ref: 隋文帝开皇年间
  archetype: 岭南俚族首领·忠义安邦者
  dilemmas:
  - 家族势力与中原王朝正统之间的抉择
  - 剿叛与护乡的两难
  lesson: 我事三代之主，唯用一好心。
  summary_first_person: 我是岭南俚人大首领，历经梁、陈、隋三朝，我始终扶持正统、平定叛乱，保境安民，被尊为圣母，隋文帝册我为谯国夫人。
  source_urls:
  - https://zh.wikisource.org/wiki/隋書/卷80
