person:
  qid: guji-刘义庆
  name_zh: 刘义庆
  names:
    zh: 刘义庆
    en: Liu Yiqing
  lifespan:
    birth:
      date: '403'
      precision: year
      is_circa: true
      raw: 生年史无明文，约当晋末（403年前后）
    death:
      date: '444'
      precision: year
      is_circa: false
  birth_date: '403'
  death_date: '444'
  era: 东晋末至刘宋（南朝宋）
  reign_ref: 宋文帝元嘉年间
  archetype: 宗室文人与方镇刺史
  dilemmas:
  - 身为宗室王公，亲历宋文帝猜忌功臣朝局，遂招聚文学之士，撰述以自晦
  - 历任方镇（豫州、荆州、江州、南兖州），处淮土南北交争、侨置州郡屡分屡合之地
  lesson: 生逢乱世宗室重臣，以文墨自寄，世说新语存魏晋风流而身名两全
  summary_first_person: 我刘义庆，宋宗室临川王也。元嘉年间承乏方镇，尝镇寿阳军府，见淮北失陷、州郡侨置纷纭。不欲卷入朝局倾轧，乃招聚文士，撰《世说新语》，录汉末魏晋人物言行，以清言终老于王位。
  source_urls:
  - https://zh.wikisource.org/wiki/宋書/卷35志第25州郡一
  - https://zh.wikisource.org/wiki/宋書/卷36志第26州郡二
endeavors:
- id: guji-刘义庆-endeavor-1
  key_name: 元嘉方镇之任
  phases:
  - key: brewing
    name_zh: 袭封临川
    labels:
      zh: 宗室起家、出为豫州刺史
    start_date: '426'
  - key: breakthrough
    name_zh: 镇寿阳
    labels:
      zh: 都督豫州、以刺史镇寿阳
    start_date: '436'
    highlight_event_id: guji-刘义庆-event-zhen-shouyang
  - key: climax
    name_zh: 转镇荆、江、南兖
    labels:
      zh: 历任荆、江、南兖州刺史，政声简静
    start_date: '439'
  - key: closure
    name_zh: 卒于官
    labels:
      zh: 元嘉二十一年薨
    start_date: '444'
  decisions:
  - date: '436'
    title_zh: 受任都督，徙镇寿阳
    rationale: 宋武帝开拓河南之后，豫州基址初立，寿阳淮南重镇，宗室贤王宜当方面之任
  - date: '439'
    title_zh: 出镇江州、荆州
    rationale: 元嘉十六年迁江州，翌年改都督荆州，避朝堂之疑，远镇上流
- id: guji-刘义庆-endeavor-2
  key_name: 招聚文士与撰述
  phases:
  - key: brewing
    name_zh: 宗室好文
    labels:
      zh: 幼为高祖所知，常曰“此吾家丰城”
    start_date: '420'
  - key: breakthrough
    name_zh: 设立文房
    labels:
      zh: 招聚文学之士，远近必至
    start_date: '430'
  - key: climax
    name_zh: 纂成《世说新语》
    labels:
      zh: 分门三十六，记魏晋名士言行轶事
    start_date: '440'
    highlight_event_id: guji-刘义庆-event-shishuo
  - key: closure
    name_zh: 传世
    labels:
      zh: 书成而身没，为志人小说之祖
    start_date: '444'
  decisions:
  - date: '440'
    title_zh: 纂《世说新语》
    rationale: 身处宗室见忌之世，托笔于前代清谈轶事，既寄意趣，亦全身远祸
  - date: '442'
    title_zh: 又撰《幽明录》《宣验记》
    rationale: 兼录志怪与释氏感应，广罗见闻，成一家杂纂
