      raw: 元嘉三十年二月为太子劭所弑
  birth_date: '407'
  death_date: '453'
  era: 南朝宋（刘宋）
  reign_ref: 宋文帝，年号元嘉（424-453）
  archetype: 守成 文治之君
  dilemmas:
  - 强藩权臣与皇权集之间的平衡
  - 北伐中原雄心与国力民命的取舍
  - 废储立嗣引发的家国内乱
  lesson: 元嘉之治证明文教与休养生息可致承平，而轻启战端则足以倾覆盛业
  summary_first_person: 我是刘义隆，宋武帝第三子。景平二年，徐羡之等大臣废杀少帝，迎立我即位，改元元嘉。我先诛权臣徐羡之、傅亮、谢晦，收回国政，任用王弘、檀道济、殷景仁等，劝课农桑，兴办儒学，三十年间号称元嘉之治，江左
    never 之盛。我三次北伐中原，欲复河南旧土，然兵败于北魏，最终元嘉草草，国力大损。晚年在废立太子问题上犹豫不决，竟为太子劭所弑，在位三十年，庙号太祖。
  source_urls:
  - https://zh.wikisource.org/wiki/宋書/卷5
  - https://zh.wikipedia.org/wiki/宋文帝
