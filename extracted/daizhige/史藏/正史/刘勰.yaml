  dilemmas:
  - 执法依科与原情哀矜之间的裁量张力
  lesson: 议罪当考事原心，律法之外尚存哀矜之道
  summary_first_person: 我仕宋为三公郎，掌议狱讼。时有唐赐病吐蛊而死，其妻张氏遵其临终之言自刳其腹，子副不能禁止。郡县依科论以重刑，众以为非科例。我议曰：赐妻痛遵往言，儿识谢及理，考事原心，非在忍害，谓宜哀矜。虽尚书顾觊之议以张同不道、副为不孝，诏从觊之，然我持原心之论，见称于世。
  source_urls:
  - https://zh.wikisource.org/wiki/南史/卷36
