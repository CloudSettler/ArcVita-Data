- id: guji-liuxiang-event-biezhu
  date: -26-01-01
  year_of: -26
  title_zh: 奉诏校中秘书，撰《别录》，谓“《世本》，古史官明于古事者之所记也”——论《世本》《战国策》诸书源流
  event_type: endeavor_event
  endeavor_id: guji-liuxiang-endeavor-1
  phase_key: breakthrough
  description: 典校中秘书籍，于每一书后辄条其篇目，撮其指意，录而奏之，成《别录》；其中论及《世本》为古史官所记、录黄帝已来帝王诸侯系谥名号，又言“《战国策》，六国时纵横之说也”，撰为三十三篇而定其名。
  related_entities:
  - 战国策
  - 世本
  - 长安
- id: guji-liuxiang-event-sanzhao
  date: -25-01-01
  year_of: -25
  title_zh: 引“刘向《别录》云：孔子见鲁哀公问政，比三朝，退而为此纪”——《别录》论《黄帝三朝》七篇并入《大戴礼记》
  event_type: endeavor_event
  endeavor_id: guji-liuxiang-endeavor-1
  phase_key: closure
  description: 《别录》考语为后世史书注家所引，如司马贞《史记索隐》注《五帝本纪》引之，以明《三朝》七篇之传授，其学术影响远及唐世。
  related_entities:
  - 大戴礼记
  - 史记索隐
