- id: guji-刘基-endeavor-2
  name_zh: 谏止安丰之行
  description: 太祖自将救安丰时，刘基进谏不听；事后证明友谅果乘虚攻洪都，太祖追悔并肯定刘基远虑。
  phases:
  - key: brewing
    name_zh: 察势预判
    labels:
      zh: 谏言
    start_date: 1363-03
  - key: breakthrough
    name_zh: 力谏不听
