    start_date: 1363-09
  decisions:
  - date: 1363-03
    title_zh: 谏止太祖亲救安丰
    rationale: 判断陈友谅必乘虚直捣应天，救安丰将致根本动摇。
  - date: 1360-05
    title_zh: 策划诱陈友谅速来而先破之
    rationale: 二寇若合围，首尾受敌，惟速其来先破友谅，可使士诚胆落。
