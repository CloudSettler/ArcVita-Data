person:
  qid: guji-刘基
  name_zh: 刘基
  names:
    zh: 刘基
    en: Liu Ji
  lifespan:
    birth:
      date: '1311-07-01'
      precision: year
      is_circa: true
      raw: 刘基（字伯温），生于元至大四年
    death:
      date: '1375-05-16'
      precision: year
      is_circa: true
      raw: 卒于明洪武八年
  birth_date: '1311-07-01'
  death_date: '1375-05-16'
  era: 元末明初
  reign_ref: 洪武
  archetype: 谋臣/开国功臣
  dilemmas:
  - 出仕辅佐新朝与保全自身之间的进退抉择
  - 战略直谏（如谏止安丰之行）与君主独断之间的张力
  lesson: 谋国之臣当以远虑直言为务，然功高之际亦需知进退。
  summary_first_person: 我刘基，字伯温，元末明初浙东名士，与宋濂、章溢、叶琛同征至应天，为朱元璋运筹帷幄。我曾谏止太祖亲救安丰，其后太祖追悔，称若非我先破陈友谅，大事难定。洪武初我任御史中丞，曾致仕，旋奉诏还朝。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/卷1
  - https://zh.wikisource.org/wiki/明史/卷2
