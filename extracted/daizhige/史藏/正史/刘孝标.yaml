      raw: 天监六年春卒于新安太守官舍，时年四十九
  birth_date: '460'
  death_date: '508'
  era: 南朝宋、齐、梁
  reign_ref: 梁武帝天监
  archetype: 文宗与荐贤之臣
  dilemmas:
  - 齐明帝令其草表而辞涉斥直，触怒明帝，建武中位不过列校
  - 不治生产、散财亲故，身后诸孤流离无人赡恤
  lesson: 素交可贵，利交可畏；才思无穷而散财好客，身后家门冷落，见世态炎凉。
  summary_first_person: 我乐安任昉，字彦升，幼而好学，早知名。齐时为王俭、竟陵王记室，善属文，尤长载笔，王公表奏多出我手；因草明帝表辞直见忤，久沉下位。梁武帝践阼，以我为骠骑记室，掌禅让文诰，累迁黄门侍郎、吏部郎中，出守义兴、新安，居官清省，手校秘阁四部。我聚书万余卷，多异本，好奖进士友，时人号曰任君。天监六年卒于新安官舍，年四十九，百姓立祠城南，追赠太常卿，谥敬子。
  source_urls:
  - https://zh.wikisource.org/wiki/梁書/卷14
