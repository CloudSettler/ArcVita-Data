      is_circa: false
      raw: 汉武帝元狩元年
  birth_date: -179
  death_date: -122
  era: 西汉
  reign_ref: 汉文帝、汉景帝、汉武帝时期
  archetype: 藩王学者
  dilemmas:
  - 身为宗室藩王，尊宠与猜忌并存，著书立说与自保图存难以两全
  - 好黄老之学崇无为，却陷于削藩潮流下的谋反抉择
  lesson: 学术盛名不能抵消权力的猜忌，藩王之势越盛，危機越深
  summary_first_person: 我乃淮南厉王刘长之子，袭封淮南王。我招致宾客方术之士数千人，撰成《淮南子》，又献书、作《离骚传》以文名于世。然朝廷削藩日紧，我心不自安，终与宾客谋为西行事，事泄，武帝遣使按问，我未及对而自尽，国除为九江郡。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷044
