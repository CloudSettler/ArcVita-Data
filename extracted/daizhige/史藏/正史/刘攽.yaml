    title_zh: 逐条随笔标记，刊正《汉书》旧文讹误
    rationale: 《汉书》流传久远，文字多有讹衍脱倒，务使史实明白马д可据。
  - date: '1090'
    title_zh: 刊误原独立成卷，后与兄敞、侄奉世之校语合为一编
    rationale: 陈振孙书录解题称别本题公非先生刊误，实一书，以攽为主而附敞奉世之说。
events:
