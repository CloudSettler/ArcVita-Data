  description: 北宋史学家刘攽生，字贡父，临川新喻人（一说筠州人）。
- id: guji-刘攽-event-death
  name_zh: 刘攽去世
  date: '1088'
  year_of: 1022
  person_qid: guji-刘攽
  event_type: death
  description: 刘攽卒，年约六十七。其校《汉书》之学由后人承继流传。
- id: guji-刘攽-event-endeavor1-start
  name_zh: 潜心研治《汉书》
  date: '1040'
  year_of: 1040
  person_qid: guji-刘攽
  event_type: endeavor
  endeavor_id: guji-刘攽-endeavor-1
  description: 刘攽博极群书，专精《汉书》之学，为日后刊误之业奠基。
- id: guji-刘攽-event-endeavor1-breakthrough
  name_zh: 撰成《汉书刊误》
  date: '1060'
  year_of: 1060
  person_qid: guji-刘攽
  event_type: endeavor
  endeavor_id: guji-刘攽-endeavor-1
  description: 刘攽撰成《汉书刊误》，于旧文多所改正，如辨“沛丰邑”、“姓刘氏”、“五诸侯”、“尚右”诸条，随笔标记，不加剖析。
- id: guji-刘攽-event-endeavor1-climax
  name_zh: 兄弟子校语合编，号“三刘汉书”
  date: '1090'
  year_of: 1090
  person_qid: guji-刘攽
  event_type: endeavor
  endeavor_id: guji-刘攽-endeavor-1
  description: 攽所校《汉书》与兄敞、侄奉世所校合为一编，《文献通考》载三刘《汉书》标注六卷，后世以攽书为主而敞、奉世说附入之，仍题刊误之名。
- id: guji-刘攽-event-endeavor1-closure
  name_zh: 宋呉仁杰撰《两汉刊误补遗》补其说
  date: '1189'
  year_of: 1189
  person_qid: guji-刘攽
  event_type: endeavor
  endeavor_id: guji-刘攽-endeavor-1
  description: 宋淳熙己酉（1189），呉仁杰据后续合编之本，兼补三刘之说，撰《两汉刊误补遗》，谓其淹通胜于原书，瑕一而瑜百。
