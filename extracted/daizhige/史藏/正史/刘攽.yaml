  archetype: 史学家·校勘学者
  dilemmas:
  - 校《汉书》时他家兄弟凋疱疹说合编，书名归属难以自明
  - 随笔标记刊误而不暇剖析其所以然，遭后人（如呉仁杰）补正
  lesson: 精于史学考据，一家刊误可与兄弟之学合称“三刘汉书”，学问贵在专精与家学相承。
  summary_first_person: 我刘攽，北宋史学家，专精《汉书》，撰《汉书刊误》，与兄刘敞、侄刘奉世并行于世，后世称“三刘汉书”。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=两汉刊误补遗
