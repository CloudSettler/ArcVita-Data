  reign_ref: 代宗广德至德宗建中
  archetype: 财计能臣
  dilemmas:
  - 位至宰相而久任财赋之职，功高遭忌
  - 忠州之贬赐死，功业与政治倾轧之冲突
  lesson: 治财有道而免祸无术，能臣常困于政争
  summary_first_person: 我刘晏，历经肃宗、代宗两朝，广德元年正月以京兆尹擢为吏部尚书、同中书门下平章事。当年吐蕃陷京师、代宗幸陕后，我曾奉命宣慰上都。广德二年正月与李岘同时罢相。此后久掌财赋，以榷税、漕运之功著称当世。至德宗建中元年七月，以忠州刺史之身遇害，终为朝局倾轧所陷。
  source_urls:
  - https://zh.wikisource.org/wiki/舊唐書/卷7
