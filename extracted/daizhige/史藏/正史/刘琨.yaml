  lesson: 闻鸡起舞，志在中兴；虽身陷绝境，孤忠不移。
  summary_first_person: 我刘琨，中山魏昌人。少与祖逖同被共寝，闻鸡起舞，慨然有中原之志。永嘉之乱，我孤军守晋阳，抚流民、御胡骑，力保并州一线。后与段匹磾歃血同盟，冀图恢复，不幸为人所构，幽而被害。壮志未酬，此我所憾也。
