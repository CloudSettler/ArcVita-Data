    start_date: 约707
    highlight_event_id: guji-刘知几-event-shishaojian
  - key: climax
    name_zh: 病意尚不一，致书萧至忠言五不可
    labels:
      zh:
      - 五不可
      - 忤时
    start_date: 约708
    highlight_event_id: guji-刘知几-event-wubuke
  - key: closure
    name_zh: 以一家之学自任而去史职
