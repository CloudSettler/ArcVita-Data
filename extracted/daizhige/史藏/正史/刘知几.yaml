      raw: 约唐龙朔年间（约661年）
    death:
      date: 721
      precision: year
      is_circa: true
      raw: 约唐开元九年（约721年）
  birth_date: 661
  death_date: 721
  era: 唐
  reign_ref: 武后至中宗、睿宗朝（约当景龙前后）
  archetype: 史学家
  dilemmas:
  - 直笔示褒贬则朝野咸知，取嫉权门、见雠贵族，常人之情不能无畏
  - 史馆众手修书，人自为家，意尚不一，头白可期而汗青无日
  lesson: 国之图史皆出一家，未闻借功于众；众手纷纭，则褒贬无所归、成书无日
  summary_first_person: 我是刘知几，唐人，一字子元。尝为秘书少监，时宰相萧至忠领监修国史，史司取士溢多，人自为荀袁，家自为政骏，每记一事载一言，阁笔相视，含毫不断，头白可期而汗青无日。我因此致书于至忠，力陈修史五不可，谓国之图史皆当出一家，未闻借功于众；又申言作者如林，傥示褒贬，曾未绝口而朝野咸知，孙盛取嫉于权门，王劭见雠于贵族，直笔之难，古今同慨。
endeavors:
