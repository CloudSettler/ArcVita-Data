    start_date: 约708
  decisions:
  - date: 约708
    title_zh: 上书监修萧至忠，陈史馆修史五不可
    rationale: 史司取士溢多，人自为荀袁，家自为政骏，每记一事载一言，阁笔相视，含毫不断，故言国之图史皆出一家，未闻借功于众
- id: guji-刘知几-endeavor-2
  name_zh: 倡直笔一家之史学
  summary: 申明作史五不可之理，以孙盛、王劭为例，明直笔虽危而不可废
  phases:
  - key: brewing
    name_zh: 深省史职利害
    labels:
      zh:
      - 史德
      - 直笔
    start_date: 约707
  - key: climax
    name_zh: 申论直笔见惮之危
    labels:
      zh:
      - 孙盛
      - 王劭
      - 褒贬
    start_date: 约708
    highlight_event_id: guji-刘知几-event-zhibi
  - key: closure
    name_zh: 遗论为后世史家所称
    labels:
      zh:
      - 子元之说
    start_date: 约721
  decisions:
  - date: 约708
    title_zh: 不避权门之嫉，持褒贬直笔之说
    rationale: 史以辨正朔、存褒贬为大法，孙盛取嫉权门、王劭见雠贵族，然常人之情虽畏，不可以畏而废直书
