events:
- id: guji-刘福通-event-uprising
  date: '1351'
  year_of: 1351
  type: endeavor
  title_zh: 奉韩山童假宋后起兵于颍州
  detail_zh: 元政不纲，刘福通奉韩山童假宋后起于颍州，众至数万，置将帅，杀吏，侵略郡县。
- id: guji-刘福通-event-crown
  date: '1355'
  year_of: 1355
  type: endeavor
  title_zh: 迎立韩林儿于亳，国号宋，建元龙凤
  detail_zh: 郭子兴卒后，刘福通迎立韩山童子林儿于亳，檄令诸军，朱元璋亦用其年号以令军中。
- id: guji-刘福通-event-bianliang
  date: '1358'
  year_of: 1358
  type: endeavor
  title_zh: 破汴梁，迎韩林儿都之
  detail_zh: 刘福通破汴梁，迎韩林儿都之；先已遣将分道四出，破山东，寇秦晋，掠幽蓟，中原大乱。
- id: guji-刘福通-event-retreat
  date: '1359'
  year_of: 1359
  type: endeavor
  title_zh: 元察罕帖木儿复汴梁，退保安丰
  detail_zh: 元察罕帖木儿复汴梁，刘福通以韩林儿退保安丰。
- id: guji-刘福通-event-death
  date: 1363-02
  year_of: 1363
  type: death
  title_zh: 吕珍破安丰，刘福通死之
  detail_zh: 张士诚将吕珍破安丰，杀刘福通。
