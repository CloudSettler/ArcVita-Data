      raw: 二十三年（1363年）二月，吕珍破安丰，杀刘福通
  birth_date: ''
  death_date: '1363'
  era: 元末
  reign_ref: 龙凤（韩林儿政权年号）
  archetype: 起义领袖
  dilemmas:
  - 借韩山童宋室之后之名起事，实权在己而名义在韩林儿
  - 北伐分兵四出，后方安丰空虚，终为张士诚部所乘
  lesson: 首义者众而善终者寡，依人力而失地利终难自保
  summary_first_person: 我以白莲之众起于颍州，奉韩山童假托宋后号召天下，后迎立其子林儿于亳，国号宋，建元龙凤。遣将四出，破山东，掠幽蓟，中原为之大乱，使吴之朱元璋得趁隙略定江表。然察罕帖木儿复汴梁后，我以林儿退保安丰，终至士诚将吕珍破城，身死安丰。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/卷1
