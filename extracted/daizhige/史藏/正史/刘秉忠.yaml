events:
- id: guji-刘秉忠-event-yanzhou
  date: '1251'
  year_of: 1251
  type: advisory
  name_zh: 邢州献策
  description: 邢州为帝分地，民不堪命诣王府诉之，刘秉忠、张文谦言于帝曰邢州户本万余、军兴以来不满数百，得良吏抚之责以成效，使四方取法则天下皆受王之赐；帝从之，以脱兀脱、张耕为邢州安抚使，刘肃为商榷使，轻徭薄赋，期年户增数倍，自是帝益以儒者为能用。宪宗即位，诏漠南汉地军国之事悉听帝裁决，开府于金莲川。
  participants:
  - guji-刘秉忠
  - guji-忽必烈
  place: 邢州
  related_endeavor_id: guji-刘秉忠-endeavor-1
- id: guji-刘秉忠-event-kaiping
  date: '1256'
  year_of: 1256
  type: founding
  name_zh: 建开平城
  description: 六年春三月，命刘秉忠建城郭于桓州东、滦水北，后名为开平府。中统元年春三月，车驾至开平府，诸王文武大臣劝进，忽必烈即皇帝位，建元中统，开平遂为帝业肇基之地。
  participants:
  - guji-刘秉忠
  - guji-忽必烈
  place: 桓州东、滦水北
  related_endeavor_id: guji-刘秉忠-endeavor-2
