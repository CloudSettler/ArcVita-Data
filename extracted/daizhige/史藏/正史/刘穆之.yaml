  lesson: 总摄内外、殷勤规谏者，其身系于全局；柱石一倾，大业为之改辙。
  summary_first_person: 我刘穆之以建威将军、丹阳尹起于刘裕帐下，义熙八年得配实力；帝人西征，我入居东府，总摄内外。姚兴遣使恫吓时，我直言此言不足威敌，若鲜卑未拔而西羌又至将何以待；帝笑谓兵机非我所及。荆雍既平，帝谋关洛，以我为左仆射、领监军中军二府军司。义熙十三年，帝欲经略赵魏，我卒于长安之役，帝遂弃经营中原而归。
  source_urls:
  - source: 宋书·武帝纪（古文传本）
