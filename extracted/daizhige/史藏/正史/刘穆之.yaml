  location_zh: 南燕广固城下军中
  summary_zh: 姚兴遣使声言将涉淮左，帝答以定青州将过函谷；刘穆之遽入曰此言不足威敌，容能怒彼，若鲜卑未拔西羌又至何以待之；帝笑谓此兵机非子所及。
