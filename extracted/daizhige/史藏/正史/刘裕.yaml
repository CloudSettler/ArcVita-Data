person:
  qid: guji-刘裕
  name_zh: 刘裕
  names:
    zh: 刘裕
    en: Liu Yu
  lifespan:
    birth:
      date: 363-04
      precision: month
      is_circa: false
      raw: 晋哀帝兴宁元年三月壬寅
  birth_date: 363-04
  era: 东晋
  reign_ref: 宋高祖武帝（后为南朝宋开国皇帝）
  archetype: 开国之君
  dilemmas:
  - 是否在桓玄势大时隐忍待机还是起兵匡复晋室
  - 北伐南燕时如何应对姚兴声言援救的两面威胁
  - 兵少贼众多倍时坚守石头还是奉天子过江避敌
  lesson: 出身寒微而雄杰大度，乘乱而起，以军功与决断奠定帝业
  summary_first_person: 我刘裕，字德舆，小字寄奴，出身寒微，起于北府行伍。孙恩之乱中屡建战功，与何无忌等二十七人起兵京口，讨灭篡逆桓玄，匡复晋室。此后北灭南燕慕容超，南平卢循，西诛刘毅、翦除诸葛长人，命朱龄石平定谯纵之蜀，权倾朝野，终启刘宋之基。
  source_urls:
  - https://zh.wikisource.org/wiki/宋書/卷1
