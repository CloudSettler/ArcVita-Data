  - key: climax
    name_zh: 三司使任上勘平冤滞、裁省费用
    labels:
      zh:
      - 三司使
      - 财政
    start_date: '1058'
    highlight_event_id: guji-包拯-event-7
  decisions:
  - date: '1049'
    title_zh: 乞不夺范仲淹、欧阳修等执政岁眷注之意而论时事
    rationale: 以天下公义为本，直陈时政，不避嫌怨
