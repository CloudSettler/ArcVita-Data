person:
  qid: guji-元宏
  name_zh: 元宏
  names:
    zh: 元宏（北魏孝文帝，本名拓跋宏）
    en: Emperor Xiaowen of Northern Wei (Yuan Hong)
  lifespan:
    birth:
      date: 467-10-13
      precision: day
      is_circa: false
      raw: 皇兴元年八月戊申，生于平城
    death:
      date: 499-04-26
      precision: day
      is_circa: false
      raw: 太和二十三年四月丙戌，崩于南征途中谷塘原
  birth_date: 467-10-13
  death_date: 499-04-26
  era: 南北朝·北魏
  reign_ref: 北魏孝文帝，477—499 年在位（太和年号）
  archetype: 改革雄主
  dilemmas:
  - 汉化改革与鲜卑守旧贵族之间的激烈冲突
  - 迁都洛阳与平城旧势力、太子恂叛乱之抗争
  - 个人孝治情感与太子违反汉化礼制之不可两全
  lesson: 制度与文化的再造须以迁徙和决断为凭借，逆水行舟者须孤行而不惑。
  summary_first_person: 我本名拓跋宏，五岁即位，太后冯氏临朝专政，教我以中华之制。亲政后我决意变夷为夏：改姓元氏，禁胡服胡语，定族姓，迁都洛阳，南征而志未竟，中道崩于军中。
  source_urls:
  - https://zh.wikisource.org/wiki/北史/卷一
endeavors:
- id: guji-元宏-endeavor-1
  name_zh: 汉化改制
  phases:
  - key: brewing
    name_zh: 太后辅政学习期
    labels:
      zh: (冯太后太和改制，俸禄制、均田制)
    start_date: '477'
    highlight_event_id: guji-元宏-event-reform-start
  - key: breakthrough
    name_zh: 亲政推行汉化
    labels:
      zh: (改官制、禁胡语胡服、改姓元氏)
    start_date: '490'
    highlight_event_id: guji-元宏-event-surname-change
  - key: climax
    name_zh: 迁都洛阳与定族姓
    labels:
      zh: (南迁、定姓族、通婚汉士族)
    start_date: '493'
    highlight_event_id: guji-元宏-event-move-capital
  - key: closure
    name_zh: 南征未竟
    labels:
      zh: (再伐南齐，崩于军中)
    start_date: '497'
    highlight_event_id: guji-元宏-event-death
  decisions:
  - date: '484'
    title_zh: 行俸禄制以整饬吏治
    rationale: 承太后改制，俸给百官，杜绝胡俗贪掠
  - date: '485'
    title_zh: 颁均田令
    rationale: 计口授田，安置流民，充实国家税基
  - date: '493'
    title_zh: 借南征之名迁都洛阳
    rationale: 平城乃鲜卑旧习之地，非南迁无以彻底汉化
  - date: '496'
    title_zh: 改拓跋为元氏，禁胡服胡语
    rationale: 定文治之基，使鲜卑贵胄与汉士族合流
- id: guji-元宏-endeavor-2
  name_zh: 南征统一之志
  phases:
  - key: brewing
    name_zh: 整军经武
    labels:
      zh: (迁都后经营南阳、沔北)
    start_date: '494'
    highlight_event_id: guji-元宏-event-move-capital
  - key: breakthrough
    name_zh: 太和十八年至二十一年南伐
    labels:
      zh: (取宛、邓、沔北诸地)
    start_date: '494'
    highlight_event_id: guji-元宏-event-southern-campaign
  - key: climax
    name_zh: 太和二十二年取雍州沔南
    labels:
      zh: (破齐军，威震江南)
    start_date: '498'
    highlight_event_id: guji-元宏-event-southern-campaign
  - key: closure
    name_zh: 病崩军中
    labels:
      zh: (第三次南征途中崩)
    start_date: '499'
    highlight_event_id: guji-元宏-event-death
  decisions:
  - date: '497'
    title_zh: 废并赐死太子恂
    rationale: 恂谋归北叛乱，逆汉化大计，孝治与大法不可两全
events:
- id: guji-元宏-event-birth
  date: 467-10-13
  year_of: 467
  title_zh: 生于平城，父献文帝拓跋弘
  category: 生平
  description: 皇兴元年八月戊申生于平城紫宫，皇兴三年立为皇太子。
- id: guji-元宏-event-accession
  date: 471-09-20
  year_of: 471
  title_zh: 五岁即皇帝位
  category: 政治
  description: 皇兴五年，献文帝禅位，孝文帝即位，改元延兴，冯太后临朝。
- id: guji-元宏-event-reform-start
  date: '484'
  year_of: 484
  title_zh: 行俸禄制，继颁均田令
  category: 改革
  description: 太和八年始班俸禄，九年均田，十年立三长制，太和改制奠定基础。
- id: guji-元宏-event-personal-rule
  date: '490'
  year_of: 490
  title_zh: 冯太后崩，孝文帝亲政
  category: 政治
  description: 太和十四年冯太后崩，帝始亲万机，锐意汉化。
- id: guji-元宏-event-move-capital
  date: 493-12
  year_of: 493
  title_zh: 借南伐之名定迁都洛阳
  category: 改革
  description: 太和十七年帝率大军南征，至洛阳定迁都之议，翌年正式徒都。
- id: guji-元宏-event-surname-change
  date: 496-02
  year_of: 496
  title_zh: 下诏改拓跋氏为元氏
  category: 改革
  description: 太和二十年诏改姓元，其余鲜卑诸姓皆改汉姓，并禁胡语胡服。
- id: guji-元宏-event-prince-xun
  date: 496-12
  year_of: 496
  title_zh: 太子恂谋叛北归，废黜旋赐死
  category: 政治
  description: 恂不愿南迁谋归代北，帝废为庶人，太和二十一年赐死。
- id: guji-元宏-event-southern-campaign
  date: 497-10
  year_of: 497
  title_zh: 南伐取南阳沔北诸郡
  category: 军事
  description: 太和十八年起屡伐南齐，克宛、邓、沔北，兵锋直逼江南。
- id: guji-元宏-event-death
  date: 499-04-26
  year_of: 499
  title_zh: 崩于南征军中
  category: 生平
  description: 太和二十三年四月丙戌崩于谷塘原，年三十三，谥孝文，葬长陵。
