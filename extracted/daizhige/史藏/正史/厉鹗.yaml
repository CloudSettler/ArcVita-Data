  archetype: 史考学者·诗人
  dilemmas:
  - 采书三百家而抉摘仍有遗漏，嗜博爱奇伤于泛滥
  - 索伦旧语非所知，国语解驳文未能考定
  lesson: 广搜旁见侧出之文，钩稽端绪，可补正史之疏略；然博与精须相济。
  summary_first_person: 我是钱塘厉鹗，字太鸿，康熙庚子举人。我摘录辽史旧文为纲，采摭群书三百余种，为注为补，撰成《辽史拾遗》二十四卷，自比于裴松之之注《三国》。
