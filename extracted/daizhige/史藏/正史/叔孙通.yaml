      date: -255
      precision: year
      is_circa: true
      raw: 约秦时生年不详
    death:
      date: -192
      precision: year
      is_circa: true
      raw: 汉惠帝时卒
  birth_date: -255
  death_date: -192
  era: 秦末汉初
  reign_ref: 汉高祖、汉惠帝
  archetype: 知时变通之儒
  dilemmas:
  - 事秦 dt待诏伏危，直言几陷虎口，须权变自保
  - 定朝仪既要尊君卑臣，又恐违古礼，招鲁两生讥其道未纯
  - 分金予诸生以安众心，与持守不趋时的儒者形成对照
  lesson: 绵蕞定仪，随时屈伸，礼成而百官肃；然鲁两生穷不失守，亦足贵也。
  summary_first_person: 我历秦及汉，先以短衣媚上以免祸，后为高帝采古礼与秦仪杂就，绵蕞习仪于野，定朝仪之序，尊卑有次，百官震肃；拜奉常，号稷嗣君，赐金五百斤，悉以分诸生，诸生皆为郎。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷043
