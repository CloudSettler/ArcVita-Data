    rationale: 诸生怨不进言，通分金且荐为郎，诸生乃服，称圣人识时务
events:
- id: guji-叔孙通-event-qin-warn
  title_zh: 事秦待诏，直言二世几陷虎口
  date: -209
  year_of: -209
  date_precision: year
  description: 通以博士待诏，二世问陈胜事，诸生皆言反，通曰此鼠窃狗盗而已，二世喜，诸生得罪，通几陷虎口乃免
- id: guji-叔孙通-event-change-clothes
  title_zh: 汉王憎儒服，通变服短衣
  date: -205
  year_of: -205
  date_precision: year
  description: 通降汉王，汉王憎儒服，通即变其服，服短衣，楚制，汉王喜，随左右
- id: guji-叔孙通-event-ding-yi
  title_zh: 绵蕞野外肄习朝仪
  date: -200
  year_of: -200
  date_precision: year
  description: 通为高帝定朝仪，采古礼与秦仪杂就之，与弟子为绵蕞于野外习之月余，请高帝试观
- id: guji-叔孙通-event-fengchang
  title_zh: 诸侯群臣朝长乐宫，百官震肃
  date: -200
  year_of: -200
  date_precision: year
  description: 长乐宫成，诸侯群臣朝十月，尊卑各以次奉觞上寿，无敢喧哗失礼者，高帝曰吾乃今日知为皇帝之贵也
- id: guji-叔孙通-event-reward
  title_zh: 拜奉常，号稷嗣君，赐金悉分诸生
  date: -198
  year_of: -198
  date_precision: year
  description: 高帝拜通为奉常，号稷嗣君，赐金五百斤，通尽以分诸生，诸生悉以为郎，乃推伏称圣人知时务
- id: guji-叔孙通-event-birth
  title_zh: 叔孙通生
  date: -255
  year_of: -255
  date_precision: circa
  description: 生年史无明文，约当战国末薛地，故号稷嗣君者以追期稷下之业
- id: guji-叔孙通-event-death
  title_zh: 叔孙通卒
  date: -192
  year_of: -192
  date_precision: circa
  description: 通于惠帝时为太常，定宗庙仪法，惠帝时卒
