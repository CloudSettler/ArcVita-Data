  era: 蒙古太祖、太宗时期（13世纪前期）
  reign_ref: 蒙古太祖成吉思汗、太宗窝阔台
  archetype: martial_statesman
  dilemmas:
  - 兄长史天倪为降而复叛的武仙袭杀，须在家族血仇与稳定河北大局之间抉择
  - 以汉人世侯身份效力于蒙古政权，新旧势力更替中需自处
  lesson: 临变能忍，复城不居功，以战功与政绩赢得信任，终成一方万户
  summary_first_person: 我是史天泽。庚辰年间，武仙以真定叛，袭杀我的兄长史天倪。我于三月克复真定，武仙败走；六月又在赞皇击败并俘获宋将彭义斌。冬十月武仙再入真定，我暂退藁城伺机而动。太宗即位后，朝廷始立三万户，我忝列其中；二年八月，我攻克卫州。此后武仙奔泽州，为戍兵所杀，河北渐定。
