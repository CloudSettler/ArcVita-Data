  era: 西汉（蜀郡成都，武帝朝辞赋家）
  reign_ref: 汉景帝（前元）、汉武帝（建元/元狩罢前）
  archetype: 辞赋家
  dilemmas:
  - 游梁为客与归蜀贫居之间的出处抉择
  - 通西南夷建功与朝中毁谤之间的进退
  lesson: 以赋开一代文风，然文人之进退系于时主之好尚
  summary_first_person: 我是蜀郡成都人司马相如，字长卿。我初事景帝为武骑常侍，后游梁园，作《子虚赋》；武帝读而召问，我又献《上林赋》《大人赋》，遂为郎。我曾奉使通西南夷，作《喻巴蜀檄》《难蜀父老》。后世颜师古注《汉书》，张揖、郭璞皆专注我传，赋体因我而大盛。
  source_urls:
  - https://zh.wikipedia.org/wiki/司马相如
