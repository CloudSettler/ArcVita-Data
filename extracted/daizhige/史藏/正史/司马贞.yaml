  dilemmas:
  - 欲改动《史记》本纪世家列传次第，与尊经存旧之间权衡
  - 自补三皇本纪并自为之注，是否合阙疑传信之意
  lesson: 著述当有条理存疑，删削旧文则失考证之本
  summary_first_person: 我是唐人司马贞，河内人，开元中官朝散大夫、宏文馆学士。因病褚少孙补《史记》多有踳驳，裴骃《集解》音义散佚，诸家音义又失传，故因裴《集解》撰《史记索隐》三十卷，仿经典释文之例惟标所注之字。末二卷为述赞百三十篇及补《史记》，尝欲降秦本纪、项羽本纪为世家，吕后、孝惠各为本纪，补曹、许等世家，又欲更列传次第，其言皆有条理，然亦议者讥我自为三皇本纪之注未合阙疑传信之意。
  source_urls:
  - https://www.sikusetexts.com/史记索隐
