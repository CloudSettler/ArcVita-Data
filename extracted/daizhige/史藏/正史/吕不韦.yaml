  birth_date: -292
  death_date: -235
  era: 战国末期至秦王政年间
  reign_ref: 秦庄襄王、秦始皇（秦王政）时期
  archetype: 权臣与商人政治家
  dilemmas:
  - 奇货可居的豪赌：以千金投资落魄王孙子楚，冒家门覆灭之险以求立国之利
  - 权位与身家的两难：功高震主，献《吕氏春秋》欲以文载身，终难自免于秦王政之忌
  lesson: 奇货可居者，以柔道经营权势；然倚人成事者，终难自保其身
  summary_first_person: 我本阳翟大贾，见子楚而叹为奇货可居，倾家贷之，使归于秦，终立为庄襄王，我以相国封文信侯，食十万户。太子政立，尊我为相国，号称仲父。我集门客著《吕氏春秋》，悬之咸阳市门，有能增损一字者予千金。后因嫪毐之乱牵连，秦王政免我相职，遣就国，又赐书责让，我恐诛，遂饮鸩而死。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷085
