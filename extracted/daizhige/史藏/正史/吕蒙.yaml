  - 外盟（吴蜀）与国家实利（荆州）之间的两难
  lesson: 士别三日当刮目相待；白衣渡江示以谋略而非武勇
  summary_first_person: 我吕蒙早年以勇猛知名，蒙孙权劝学，发愤读书，见识日进，鲁肃见我叹称非复吴下阿蒙。后来我设计袭取荆州，白衣渡江，使士仁、糜芳不战而降，擒杀关羽，为吴夺回荆州，然功成而身病卒。
  source_urls:
  - https://ctext.org/book-of-han/
