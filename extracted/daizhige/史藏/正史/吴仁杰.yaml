  archetype: 汉学考据学家
  dilemmas:
  - 是否以郡望“河南”称籍，还是以实际籍贯昆山撰述自署
  lesson: 引据赅洽、考证详晰，务使明白无疑而后已，是为淹通
  summary_first_person: 我名吴仁杰，字斗南，一字南英，别号蠹隐居士，昆山人。淳熙中登进士，官国子学录，后知罗田县。我撰《两汉刊误补遗》，为刘攽《两汉书刊误》而作，兼补正刘敞、刘奉世之说，引据赅洽，考证务明，曾绛序称周必大尝以博物洽闻许我。
  source_urls:
  - https://www.zh.wikisource.org/两汉刊误补遗
