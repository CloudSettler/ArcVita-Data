  name_zh: 莫府山之战大破齐师
  summary: 太平元年六月乙卯，陈高祖自率帐内出莫府山南，吴明彻、沈泰等众军首尾齐举，纵兵大战；侯安都复自白下横出其后，齐师大溃，斩获数千，徐嗣徽被擒斩，萧轨等将帅四十六人被虏。
