  summary_first_person: 我吴明彻，历仕陈朝，以将略见称。绍泰、太平年间随高祖征战，太平元年莫府山之役，我与沈泰等率军首尾齐举，纵兵大战，大破齐师，为歼灭徐嗣徽、萧轨之众立功，是高祖定鼎建康的重要战将之一。
