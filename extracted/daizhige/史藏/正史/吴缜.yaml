  type: 事业
  date: ''
  year_of: 南渡后
  title_zh: 吴兴合刻
  description: 南渡后，《五代史纂误》曾与《新唐书纠缪》合刻于吴兴，附唐五代二史之末；后"纂误"久佚，惟《永乐大典》颇载其文，四库馆臣采缀裒集，依宋史目次厘为三卷。
