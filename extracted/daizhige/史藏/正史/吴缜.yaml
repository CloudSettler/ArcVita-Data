- id: guji-吴缜-event-endeavor2-breakthrough
  name_zh: 《五代史纂误》成书
  type: 事业
  date: ''
  year_of: ''
  title_zh: 纂误成书
  description: 《五代史纂误》成书，校勘精审，凡修轻改旧文、首尾失检之处无不疏通剖析，切中症结，故宋代颇推重之。晁公武《读书志》、陈振孙《书录解题》俱作五卷，《宋史·艺文志》作三卷。
- id: guji-吴缜-event-endeavor2-closure
