person:
  qid: guji-吴缜
  name_zh: 吴缜
  names:
    zh: 吴缜
    en: Wu Zhen
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 约宋代
  era: 北宋
  reign_ref: ''
  archetype: 史学家校勘家
  dilemmas:
  - 面对欧阳修《新唐书》《新五代史》权威地位，是否敢于指摘名家舛误
  - 考证求真与难免吹毛求疵之间的分寸拿捏
  lesson: 校史当精审实证，虽名家之作亦须核对纪传，不可轻信。
  summary_first_person: 我是吴缜，南宋…乃北宋史家，先撰《新唐书纠缪》以正宋祁、欧阳修之失，又取欧阳修所撰《五代史》，摘其舛误辑为《五代史纂误》。我抉其缺误，一一胪考折衷，校勘精审，宋代颇推重之；虽间或执迹以求短，然凡轻改旧文、首尾失检之处，无不通析切中。
  source_urls:
  - https://zh.wikisource.org/wiki/五代史纂誤
