  reign_ref: 齐明帝、梁武帝在位期间
  archetype: 文吏幕僚与守土之臣
  dilemmas:
  - 叛党攻郡之际，以微弱兵力立坞拒战，战力不敌，面临死守还是弃郡的抉择
  lesson: 知不敌而谋保全，弃地不弃节，留身以图后效
  summary_first_person: 我周兴嗣曾任吴兴郡丞，天监九年山贼吴承伯余党与叛吏鲍叙合流攻入新安，我奉太守王览之命于锦沙立坞拒战。兵力不敌，遂弃郡退保会稽。其后台军平定山寇，郡事复定。
  source_urls:
  - https://zh.wikisource.org/wiki/梁書/卷15
