      raw: 不详
    death:
      date: 917-12
      precision: month
      is_circa: false
      raw: 十五年十二月战于胡柳，死之
  birth_date: 约-850
  death_date: 917-12
  era: 唐末五代
  reign_ref: 唐僖宗至后梁末年；历事晋王李克用、李存勖
  archetype: 名将 / 军前宿将
  dilemmas:
  - 新君新立、梁军懈怠之际，是守丧持重还是乘隙出击
  - 深入攻燕与南面梁军压力之间的战略权衡
  lesson: 宿将持重，亦有殒身之势；乘敌之懈者胜，临锋浪战者殆。
  summary_first_person: 我周德威，晋之宿将也。一生从李克用父子转战，青山口尝败绩，洞涡却挫梁锋。梁围潞州，我军乱柳，会大丧而还军太原，因劝新王乘懈出兵，遂破夹城。后随庄宗转战河朔，屡当敌冲，终于胡柳之役，殁于王事。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史/唐本纪第五
