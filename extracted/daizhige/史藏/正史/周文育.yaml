    highlight_event_id: guji-周文育-event-3
  - key: climax
    name_zh: 与侯安都同讨王琳
    labels_zh:
    - 拥兵不臣
    start_date: '0558-08-01'
    highlight_event_id: guji-周文育-event-4
  decisions:
  - date: '0557-02-01'
    title_zh: 奉命攻韦载于义兴
    rationale: 震州刺史杜龛据吴兴，与义兴太守韦载同举兵反，陈霸先命周文育率众攻载于义兴，龛遣其从弟北叟拒战，北叟败归义兴。
  - date: '0558-02-01'
    title_zh: 与侯安都讨平萧勃、余孝顷
    rationale: 萧勃举兵自广州渡岭，顿南康，遣欧阳頠、傅泰及子孜为前军，余孝顷起兵应勃，陈霸先命周文育、侯安都率众讨平之。
  - date: '0558-08-01'
    title_zh: 与侯安都率众讨王琳
    rationale: 湘州刺史王琳拥兵不应命，陈霸先遣周文育、侯安都率众讨之。
