      raw: 卒年不详（陈武帝时为将）
  birth_date: ''
  death_date: ''
  era: 南朝梁末至陈初
  reign_ref: 梁武帝、陈武帝（陈霸先）在位期间
  archetype: 骁将 / 开国功臣
  dilemmas:
  - 隶属陈霸先麾下，奉命讨伐叛乱诸将，需在忠义与地方豪强之间抉择
  - 随军转战岭南、江南，屡当锋镝，进退皆系于主帅决策
  lesson: 骁勇善战、临阵先登者，可为一时之将，然功名终究依附于明主与大局。
  summary_first_person: 我是周文育，陈霸先帐下骁将。李迁仕据大皋时，我奉命将兵击走杜平虏；杜龛、韦载举兵反，我攻韦载于义兴；萧勃、余孝顷起兵，我与侯安都受命讨平之；王琳拥兵不应命，我又率众往讨。一生冲锋陷阵，为陈氏开基立业之爪牙。
    (来源：陈书卷一·本纪第一·高祖上)
  source_urls:
  - https://zh.wikisource.org/wiki/陳書/卷01
