  dilemmas: -身处孙氏创业之世，须在强敌环伺中定江东大略；壮年而卒，志业未竟。
  lesson: 赤壁一炬，以弱胜强；精英简能，不惑于众议。
  summary_first_person: 我乃吴之名将周瑜，见于《三国志·吴书》卷五十四，与鲁肃、吕蒙同卷。史载我佐孙氏决策江东，火攻赤壁而破曹操，惜天不假年。
