  dilemmas:
  - 北魏南侵寿阳，孤镇拒强敌，守与否系淮南安危
  lesson: 以寡御众、临机决断，方能在南北对峙的边线上立足建功
  summary_first_person: 我是垣崇祖，南朝齐的冠军将军。高帝建元初，我受任豫州刺史，镇守淮南要冲。建元二年，北魏大军寇寿阳，我力战破走之，为新建的齐朝稳住了北境；世祖即位后，我又再任豫州刺史，继续承担边防重任。
  source_urls:
