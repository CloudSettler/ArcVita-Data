- id: guji-多尔衮-event-bestow
  date: '1629-03-07'
  year_of: '1629'
  date_precision: day
  is_circa: false
  description_zh: 天聪三年三月戊辰，上以弟多尔衮从征有功，赐号墨尔根戴青（睿智戴青之意），庚寅设宴以赐名之礼待之。
- id: guji-多尔衮-event-gushan
  date: 1629-03
  year_of: '1629'
  date_precision: month
  is_circa: false
  description_zh: 以贝勒多尔衮为固山贝勒，独领一旗（固山）。
- id: guji-多尔衮-event-beijing
  date: '1629-11-17'
  year_of: '1629'
  date_precision: day
  is_circa: false
  description_zh: 天聪三年十一月，大军逼燕京，多尔衮与多铎、阿济格、豪格等随莽古尔泰领左翼白甲护军、蒙古兵迎击明宁远巡抚袁崇焕、锦州总兵祖大寿，俱败之。
- id: guji-多尔衮-event-liubu
  date: '1631-07-13'
  year_of: '1631'
  date_precision: day
  is_circa: false
  description_zh: 天聪五年七月庚辰，始设六部，以墨勒根戴青贝勒多尔衮等管六部事。
- id: guji-多尔衮-event-linghe
  date: '1631-09-05'
  year_of: '1631'
  date_precision: day
  is_circa: false
  description_zh: 大凌河之役，明兵出城诱战，图赖先入，贝勒多尔衮亦率兵入，城内砲矢俱发，图赖被创，诸将战殁。
- id: guji-多尔衮-event-death
  date: '1650-12-31'
  year_of: '1650'
  date_precision: year
  is_circa: true
  description_zh: 多尔衮卒，卒年不见于本段古文，据史补。
