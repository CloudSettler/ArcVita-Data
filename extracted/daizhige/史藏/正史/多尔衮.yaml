  dilemmas:
  - 少年从征，武功与兄长诸贝勒并立而须谨守臣节
  - 受赐美号墨尔根戴青，荣宠与猜忌并存
  lesson: 少年立功以勇谨立身，赐号授职皆自战功来
  summary_first_person: 我乃太祖之子多尔衮，天聪初随兄长从征，以功获赐「墨尔根戴青」之号，封固山贝勒；天聪五年设六部，受命综理部务，并从围大凌河、入塞攻明，屡立战功。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿
