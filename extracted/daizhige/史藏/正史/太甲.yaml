  decisions:
  - date: -1580
    title_zh: 以嫡长孙身份继仲壬而立
    rationale: 故太子太丁早卒，太甲承成汤血脉嗣位为王。
  - date: -1577
    title_zh: 居位而淫，不遵汤法
    rationale: 纵欲乱德、弃成汤法度，终致伊尹放之于桐宫。
- id: guji-taijia-endeavor-2
  name_zh: 桐宫悔过与复位修德
  summary: 太甲居桐宫三年悔过自责，伊尹迎之复位，此后修德而治。
  phases:
  - key: brewing
    name_zh: 幽居思过
