  - key: climax
    name_zh: 迎归复位
    labels:
      zh: 伊尹授政
    start_date: -1574
    highlight_event_id: guji-taijia-event-restore
  - key: closure
    name_zh: 修德安殷
    labels:
      zh: 复兴
    start_date: -1573
    highlight_event_id: guji-taijia-event-restored-rule
  decisions:
  - date: -1575
    title_zh: 于桐宫悔过自责、反于善
    rationale: 面对祖父成汤之法与伊尹之放，选择自省改过而非怨怼。
  - date: -1574
    title_zh: 复位后修德行政
    rationale: 纳伊尹之诲、循汤之法，安民立政，使殷道复兴。
