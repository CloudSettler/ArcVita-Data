person:
  qid: guji-taijia
  name_zh: 太甲
  names:
    zh: 太甲
    en: Tai Jia
  lifespan:
    birth:
      date: -1600
      precision: century
      is_circa: true
      raw: 约商朝初年
    death:
      date: -1571
      precision: decade
      is_circa: true
      raw: 约公元前1571年
  birth_date: -1600
  death_date: -1571
  era: 商朝早期
  reign_ref: 商王，成汤嫡长孙，继仲壬而立
  archetype: 悔过迁善之君
  dilemmas:
  - 即位后纵欲失德，遭元老伊尹放逐，须在君位与德行之间抉择
  - 幽居桐宫三年，面对复与不复，终选悔过自责而非怨怼抗争
  lesson: 知过能改、自责修德，失位可复、人心可归
  summary_first_person: 我是太甲，商汤的嫡长孙、故太子太丁之子。外丙、仲壬之后我嗣立为王，却一度纵欲乱德，被伊尹放逐到桐宫三年；我在那里悔过自责，改恶从善，伊尹乃迎我复位还政。此后我修德安民，重振殷商基业。
  source_urls:
  - https://zh.wikisource.org/wiki/讀史記十表
  - https://ctext.org/shiji/yin-ben-ji/zh
endeavors:
- id: guji-taijia-endeavor-1
  name_zh: 嗣位为商王与失德被放
  summary: 太甲继外丙、仲壬而立，因淫乱失德，被伊尹放于桐宫。
  phases:
  - key: brewing
    name_zh: 嗣位登基
    labels:
