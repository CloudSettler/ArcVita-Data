  birth_date: 约1203年
  death_date: 约1279年
  era: 元初（蒙古汗国至元朝初期）
  reign_ref: 中统、至元
  archetype: 儒臣谋士
  dilemmas:
  - 隐居讲学与时为储君谋政之间的取舍
  - 蒙古屠掠旧俗与以儒术化民之间的冲突
  lesson: 以仁术佐霸业，止杀存民，方能成就长远的治道。
  summary_first_person: 我是姚枢，金末儒生，曾隐居辉州讲学。应忽必烈潜邸之召，与其论治道，劝其行汉法、轻徭薄赋。从征大理时，我裂帛为旗，书止杀之令，使一城获免。中统初，我出为东平路宣抚使，后应召赴省，同议军国调度，以儒者之佐助元初立纲陈纪。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷004
  - https://zh.wikisource.org/wiki/元史/卷007
