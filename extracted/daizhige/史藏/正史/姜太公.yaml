person:
  qid: guji-姜太公
  name_zh: 姜太公
  names:
    zh: 姜太公、吕尚、太公望、齐太公
    en: Jiang Taigong (Lü Shang)
  lifespan:
    birth:
      date: -1128
      precision: year
      is_circa: true
      raw: 约商末，生年不详
    death:
      date: -1015
      precision: year
      is_circa: true
      raw: 约周康王时卒，享年盖百余岁
  era: 商末周初
  reign_ref: 周文王、周武王、成王、康王
  archetype: 开国辅臣 / 军师鼻祖
  dilemmas:
  - 年老穷困，钓于渭滨以待时机，贤而未遇
  - 佐周伐商，代天行罚与助纣为虐之抉择
  - 封于齐enf，就国偏远海滨之齐，经营新邦
  lesson: 大器晚成，待时而动；佐命开邦，治齐因俗简礼，通渔盐之利，遂成大国。
  summary_first_person: 我吕尚年老犹垂钓渭滨，终为文王所遇，号为太公望；佐武王伐纣灭商，首封营丘建立齐国，因俗简礼、通鱼盐之利，齐国由此富强，我亦为周师兼冢宰，辅成康之世，为一个军事家、政治家与齐国开国之祖。
  birth_date: 约前1128年（商末，生年不详）
  death_date: 约前1015年
  source_urls:
  - https://zh.wikipedia.org/wiki/姜太公
  - https://www.ctext.org/book-of-documents
