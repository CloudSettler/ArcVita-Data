  year_of: -1040
  title_zh: 成王命齐得征伐五侯九伯
  detail_zh: 周成王时管蔡作乱、淮夷叛周，成王使召康公命太公曰东至海、西至河、南至穆陵、北至无棣，五侯九伯实得征之，齐由此得专征伐，为大国。
  label_zh: 受命征伐
  location_zh: 齐国
