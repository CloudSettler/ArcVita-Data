  year_of: -1046
  title_zh: 佐武王牧野伐纣，灭商建周
  detail_zh: 武王以师尚父为帅，牧野之战大破纣军，纣走登鹿台自焚，商亡周立。
  label_zh: 牧野之战
  location_zh: 牧野
  event_type: career
