  date: -1056
  year_of: -1056
  title_zh: 文王出猎渭滨遇太公
  detail_zh: 文王将出猎，卜之曰所获非龙非彲非虎非罴，所获霸王之辅；果遇太公于渭之阳，与语大悦，同载而归，立为师，号太公望。
