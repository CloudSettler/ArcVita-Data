  year_of: -1045
  title_zh: 首封封齐，就国营丘
  detail_zh: 武王首封太公于齐营丘，莱侯来伐争营丘，太公夜衣而行，犁明至国，击退莱人，遂定。
  label_zh: 开国封齐
  location_zh: 齐国营丘
  event_type: career
  persons_involved:
