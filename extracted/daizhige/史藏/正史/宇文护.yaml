    rationale: 诸子冲幼、群公怀等夷之志，以废立固权；「威福在己，征伐自出」，有君人之实而无君人之名
  - date: '560'
    title_zh: 弑明帝（世宗）
    rationale: 世宗明察，护惮其英明，遂进毒弑之（史臣所谓「废弑至逆也，行之而无悔」）
- id: guji-宇文护-endeavor-2
