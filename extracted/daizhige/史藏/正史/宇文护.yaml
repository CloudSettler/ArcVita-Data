    labels:
      zh:
      - 除名
    start_date: '572'
    highlight_event_id: guji-宇文护-event-zhu
  decisions:
  - date: 559前
    title_zh: 征柳庆、令狐整所荐之叱罗协入朝，引与同宿，深寄托之
    rationale: 司会柳庆、司宪令狐整并辞不堪，俱荐协；护欲委腹心于协，「以为得协之晚」，即授军司马，委以兵事
  - date: '564'
    title_zh: 遣尉迟迥为先锋、宇文宪等军邙山，将兵东伐
    rationale: 「寇贼充斥，戎马交驰……岂得坐观屠灭」；然东伐不利，齐兵奄出军后，诸军恇骇退散
