  description: 晋公护东伐，以尉迟迥为先锋围洛阳；宪与达奚武、王雄等军于邙山，齐兵数万奄出军后，诸军恇骇退散，宪亲自督励，众心乃安。
  persons:
  - guji-宇文护
  - guji-宇文宪
- id: guji-宇文护-event-zhu
  date: 572-04
  year_of: 572
  type: death
  title_zh: 高祖诛晋公护
  description: 高祖谓宇文宪曰：「冢宰无君凌上，将图不轨，吾所以诛之，以安社稷。」护身首横分，妻孥为戮；党附者叱罗协、冯迁、边平等皆除名，高祖命宪往护第收兵符及诸簿书。
  persons:
  - guji-宇文护
  - guji-宇文宪
