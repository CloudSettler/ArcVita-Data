person:
  qid: guji-宇文护
  name_zh: 宇文护
  names:
    zh: 宇文护
    en: Yuwen Hu
  lifespan:
    birth:
      date: '513'
      precision: year
      is_circa: true
      raw: 约513年（生年史无明文，据享年推补）
    death:
      date: 572-04
      precision: month
      is_circa: false
      raw: 建德元年（572年）被高祖（周武帝）诛杀，身首横分
  birth_date: '513'
  death_date: '572'
  era: 西魏—北周
  reign_ref: 历仕西魏文帝、北周孝闵帝、明帝、武帝之世
  archetype: 权臣
  dilemmas:
  - 受太祖顾托而诸子冲幼：掌权安国与威福自专之间的抉择
  - 「寡于学术，昵近群小」：忠贞礼让与「人臣无君之心」的分野
  lesson: 受顾托者失之以礼让忠贞，虽「变魏为周，俾危获乂」之功，终不免身首横分、妻孥为戮——晋公护之谓也
  summary_first_person: 我宇文护，早预周室艰难，受太祖顾托，辅诸冲幼之主，卒能变魏为周。然我威福在己，征伐自出，废弑二帝而无悔，终为高祖所诛，身死家灭，史臣谓不亦宜乎。
  source_urls:
  - 《周书·卷十一·列传第三》（晋荡公护传附论，见本卷列传第四、第五相关文字）
