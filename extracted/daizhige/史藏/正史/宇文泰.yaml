    title_zh: 遣骆超、李贤和率骑赴崤中迎孝武帝
    rationale: 高欢已入洛，帝将西出，抢先奉迎以控挟天子之机
  - date: '0534'
    title_zh: 使元氏诸王杀平原公主明月
    rationale: 除孝武帝羽翼亲族之Hadji，固关中之政，致君臣相忌
  - date: 0537-10
    title_zh: 沙苑大破东魏军
    rationale: 东魏大举西讨，以少击众，一战定关陇之势
