    start_date: 0556-10
  decisions:
  - date: 0535-01
    title_zh: 受文帝进官，都督中外诸军、大行台，改封安定郡公
    rationale: 孝武崩后奉宝炬即位，以臣揽政开西魏之局
  - date: 0537-12
    title_zh: 拜柱国大将军
    rationale: 沙苑之捷，以军功进位统摄诸军
  - date: '0551'
    title_zh: 进位太师
    rationale: 文帝崩立废帝，位望尽归，朝政一决于泰
  - date: '0551'
    title_zh: 诛尚书元烈并废帝（元钦）
    rationale: 帝有怨言欲图自立，权臣之局不容异心
  - date: 0556-01
    title_zh: 初行周礼、建六官，为太师、冢宰
    rationale: 托古改制以固体系，为代周魏张本（实为代魏张本）
  - date: 0556-10
    title_zh: 遗命侄宇文护辅政
    rationale: 子幼，托宇文护，次年遂禅周
