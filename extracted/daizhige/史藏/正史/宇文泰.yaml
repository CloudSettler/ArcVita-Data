person:
  qid: guji-宇文泰
  name_zh: 宇文泰
  names:
    zh: 宇文泰
    en: Yuwen Tai
  lifespan:
    birth:
      date: ''
      precision: year
      is_circa: true
      raw: 生年不详（卒年五十，约生于北魏末）
    death:
      date: '0557'
      precision: year
      is_circa: false
  birth_date: （不详）
  death_date: '0557'
  era: 西魏—北周之际（南北朝后期）
  reign_ref: 未称帝，为西魏权臣、北周奠基者
  archetype: 权臣奠基者
  dilemmas:
  - 迎立孝武帝入关、挟天子而与高欢分庭抗礼
  - 杀孝武帝所爱明月公主，君臣相疑
  - 废帝（元钦）因怨言而遭废黜
  - 佐魏年久而不篡，终身为臣而实握神器
  lesson: 乱世之雄，挟天子、建府兵、行周礼，基业成而身不变色
  summary_first_person: 我宇文泰，黑獭也。高欢败尔朱而我崛起关中，迎孝武西迁，与东魏战于沙苑、河桥之间。二魏分立，我柱国当家，立文帝、废帝、恭帝皆由我手；行《周礼》建六官，置府兵八柱国，为周隋之业奠基。恭帝三年我薨，其侄宇文护遂辅周代魏。
  source_urls:
  - given_text
