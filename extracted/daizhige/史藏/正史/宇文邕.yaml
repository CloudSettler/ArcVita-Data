person:
  qid: guji-宇文泰
  name_zh: 宇文泰
  names:
    zh: 宇文泰
    en: Yuwen Tai
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 未详（北魏正光前后活跃）
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: 西魏恭帝三年（556年，文中有魏孝武帝崩后立文帝事，泰卒年未直书）
  birth_date: ''
  death_date: ''
  era: 北魏末至西魏
  reign_ref: 西魏权臣、大丞相
  archetype: 雄杰开国之主
  dilemmas:
  - 侯莫陈悦害贺拔岳后是否即刻赴平凉接管军众
  - 魏孝武帝西迁后如何安置皇权与朝政
  - 与高欢东西对峙中的战略抉择
  lesson: 乘时赴机、恩信御众者成大业
  summary_first_person: 我是宇文泰，字黑獭，代郡武川人。我从贺拔岳帐下起家，岳为侯莫陈悦所害后，我驰赴平凉总其军众，讨灭悦以雪耻。其后奉迎魏孝武帝都长安，立西魏，与大丞相高欢东西相抗，小关破窦泰，为关陇基业奠定根本。
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
  - https://zh.wikisource.org/wiki/周书/卷二
