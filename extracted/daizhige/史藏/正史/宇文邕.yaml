  - date: 0537-01
    title_zh: 舍近舍远袭窦泰
    rationale: 窦泰屡胜而骄，出其不意袭之必克，克泰则欢自走
  - date: 0534-08
    title_zh: 拒绝高欢甘言厚礼
    rationale: 欢已有异志，深倚魏帝以自固
events:
- id: guji-宇文泰-event-birth
  person: guji-宇文泰
  date: ''
  year_of: ''
  type: birth
  name_zh: 出生
  description_zh: 代郡武川人，德皇帝宇文肱之少子，生而有黑气如盖覆身。
  place_zh: 朔野武川
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-joining-yue
  person: guji-宇文泰
  date: '0526'
  year_of: '526'
  type: career
  name_zh: 以别将从贺拔岳
  description_zh: 孝昌二年，燕州乱，先以统军从尔朱荣征之，后与贺拔岳有旧，以别将从岳，平万俟丑奴定陇右，功居多。
  place_zh: 关陇
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-hu-qu
  person: guji-宇文泰
  date: 0532-02
  year_of: '532'
  type: military
  name_zh: 袭擒显寿
  description_zh: 普泰二年，劝侯莫陈悦留军同图显寿，自为前锋倍道兼行，追至华山擒显寿。
  place_zh: 长安
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-pingliang
  person: guji-宇文泰
  date: 0534-01
  year_of: '534'
  type: military
  name_zh: 驰赴平凉总掌岳众
  description_zh: 贺拔岳为侯莫陈悦所害，诸将推奉，太祖率帐下轻骑驰赴平凉，哭岳甚恸，将士以为主帅。
  place_zh: 平凉
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-shuiyue
  person: guji-宇文泰
  date: 0534-04
  year_of: '534'
  type: military
  name_zh: 破斩侯莫陈悦
  description_zh: 夏四月引兵上陇，出木峡关倍道兼行，大破悦军于水洛、略阳，李弼内应，悦走牵屯山被斩。
  place_zh: 陇右上邽
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-xiqian
  person: guji-宇文泰
  date: 0534-07
  year_of: '534'
  type: political
  name_zh: 奉迎魏孝武帝西迁长安
  description_zh: 七月丁未魏帝率轻骑入关，太祖备仪卫奉迎于东阳驿，奉帝都长安，军国之政咸取决焉。
  place_zh: 长安
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-liwend
  person: guji-宇文泰
  date: 0535-01
  year_of: '535'
  type: political
  name_zh: 定策立魏文帝
  description_zh: 闰十二月魏孝武帝崩，太祖与群公定策，尊立南阳王宝炬为嗣，是为文皇帝，西魏始建。
  place_zh: 长安
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-xinzhi
  person: guji-宇文泰
  date: 0535-03
  year_of: '535'
  type: reform
  name_zh: 颁二十四条新制
  description_zh: 以戎役屡兴民吏劳弊，命所司斟酌今古参考变通，为二十四条新制，奏魏帝行之。
  place_zh: 长安
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷二
- id: guji-宇文泰-event-xiaoguan
  person: guji-宇文泰
  date: 0537-01
  year_of: '537'
  type: military
  name_zh: 小关之战斩窦泰
  description_zh: 率骑六千潜出军，癸丑旦至小关，乘懈纵兵击破东魏军，尽俘其众万余人，斩窦泰传首长安。
  place_zh: 小关
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷二
- id: guji-宇文泰-event-bashang
  person: guji-宇文泰
  date: 0537-08
  year_of: '537'
  type: military
  name_zh: 霸上御敌进位丞相
  description_zh: 八月齐神武袭陷潼关侵华阴，太祖率军屯霸上，进军讨薛瑾虏卒七千，还长安进位丞相。
  place_zh: 霸上
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷一
- id: guji-宇文泰-event-death
  person: guji-宇文泰
  date: ''
  year_of: ''
  type: death
  name_zh: 去世
  description_zh: 卒年原文未详；其开府关陇、定策立君之业，为其子后代建周奠基。
  place_zh: 长安
  source_urls:
  - https://zh.wikisource.org/wiki/周书/卷二
