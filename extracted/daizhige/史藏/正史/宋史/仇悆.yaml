person:
  qid: guji-仇悆
  name_zh: 仇悆
  names:
    zh: 仇悆
    en: Qiu Yu
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      precision: unknown
      is_circa: false
  era: 南宋
  reign_ref: 宋高宗
  archetype: 循吏守土之臣
  dilemmas:
  - 主战与和议之争：力陈金人归地非策，拒绝配合秦桧主和，终坐落职
  - 守土与退保之责：宣抚司令弃城退保，悆力陈不可，誓与庐州共存亡
  - 援军不至时的孤城抗敌：求援不报、亲征不至淮甸，仍坚持守御击贼
  lesson: 临危守土、以死徇国，不因无援而弃城，不因权相而改节
  summary_first_person: 我仇悆，字泰然，益都人。大观三年登进士第。为邓城令时深受百姓爱戴，任满被遮留不得去。高宗南渡后，我知庐州，面对刘麟合金兵大入、张琦胁迫弃城的危局，岿然不动，誓以死徇国，出奇兵直抵寿春城下，三战皆捷；又以忠义激牛皋击溃金军，以克复守御功加徽猷阁待制。我尝向张浚献策未能施行，后知明州、平江府，锄豪强、奖善良，岁饥发廪平价，民无死徙。秦桧主和，我力陈金人无故归侵疆乃诡计，固辞陕西都转运使之命，遂被视为异己而落职。后来金人果然复陷所归郡邑，一如我言。我性至孝，端方挺特，自初官讫通显，无所附丽。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷399
endeavors:
- id: guji-仇悆-endeavor-1
  name_zh: 循吏早年仕途
  phases:
  - key: brewing
    name_zh: 进士入仕与州县治理
    labels:
      zh:
      - 邠州司法
      - 邓城令
      - 武陟令
    start_date: '1109'
    highlight_event_id: guji-仇悆-event-jinshi
  - key: breakthrough
    name_zh: 高密丞深得民心
    labels:
      zh:
      - 高密丞
      - 剖决如流
    highlight_event_id: guji-仇悆-event-gaomi
  decisions:
  - title_zh: 猾吏杨盖阴疏令过胁持为奸，悆暴其罪黥之
    rationale: 申纲纪、服众心
  - title_zh: 大军溃于卢沟河，悆间关营护运饷，无一豪弃失
    rationale: 守职护饷，不使资敌
- id: guji-仇悆-endeavor-2
  name_zh: 庐州守土抗金
  phases:
  - key: brewing
    name_zh: 以淮西宣抚知庐州
    labels:
      zh:
      - 淮西宣抚
      - 知庐州
  - key: breakthrough
    name_zh: 面对张琦胁迫，坚不动摇
    labels:
      zh:
      - 誓死守土
    highlight_event_id: guji-仇悆-event-luzhou
  - key: climax
    name_zh: 出奇兵复寿春，牛皋溃敌
    labels:
      zh:
      - 复寿春
      - 牛皋击贼
    highlight_event_id: guji-仇悆-event-shouchun
  - key: closure
    name_zh: 拒弃城退保之令，全活数州之众
    labels:
      zh:
      - 力陈不可
  decisions:
  - title_zh: 若辈无守土责，吾当以死徇国，寇未至而逃，人何赖焉
    rationale: 帅臣任一路之责，誓当死守
  - title_zh: 以策说张浚，请以精兵趋旧京、大军尾击金兵
    rationale: 金重兵在淮东，师老食匮，一日纵敌，数世之患
  - title_zh: 力陈不可委城退保
    rationale: 使金人有淮西，治兵舰于巢湖，必贻朝廷忧
- id: guji-仇悆-endeavor-3
  name_zh: 抗直不附和议
  phases:
  - key: climax
    name_zh: 力陈金人归地非策，固辞不行
    labels:
      zh:
      - 固辞不行
      - 忤秦桧
    highlight_event_id: guji-仇悆-event-heiyi
  - key: closure
    name_zh: 落职分司西京，金人果复陷郡邑
    labels:
      zh:
      - 落职
      - 金人如悆言
  decisions:
  - title_zh: 加宝文阁学士、陕西都转运使，固辞不行
    rationale: 金人无故归侵疆，诡计叵测，力陈非策
  - title_zh: 取士不阿，荐幕官问日费而止
    rationale: 属僚所费倍于郡守，安得不贪
