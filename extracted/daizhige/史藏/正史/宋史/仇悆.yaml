  actor: guji-仇悆
  location: 寿春
  notes: 出奇直抵寿春城下，敌三战皆北却走度淮；复寿春俘馘甚众，获旗械数千，焚粮船百余艘
- id: guji-仇悆-event-niugao
  type: 召牛皋击溃金军于合肥
  actor: guji-仇悆
  location: 合肥
  notes: 刘麟步骑数千至合肥，牛皋以骑兵驰出，短兵相接，寇畏其名遂自溃；悆以克复守御功加徽猷阁待制
- id: guji-仇悆-event-heiyi
