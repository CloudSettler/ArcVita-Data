  lesson: 用地利屯田设险，以诚御众，方为御边长策
  summary_first_person: 我幼随先父征战关南，熟知北边山川形势，遂建议开易河蒲口、筑堤贮水为屯田，以遏敌骑。其后知沧州、雄州，推诚御众，屡拒契丹，力主榷场互市与怀柔息兵，终使缘边安宁，边民闻我之丧而相率发哀。
  source_urls:
  - 宋史卷二百七十三
