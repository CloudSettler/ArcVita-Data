    name_zh: 白鹿洞诸生流落襄淮
    labels:
      zh:
      - 少年落魄
      - 好大言
    start_date: 约-1220
  - key: breakthrough
    name_zh: 冒谒赵葵留幕
    labels:
      zh:
      - 作长短句上谒
    start_date: 约-1230
  - key: climax
    name_zh: 汴城河阴战功、援安丰
    labels:
      zh:
      - 授直华文阁
      - 拜大理少卿
    start_date: 1239
    highlight_event_id: guji-余玠-event-anfeng
  - key: closure
    name_zh: 进权兵部侍郎、四川宣谕使
    labels:
      zh:
      - 手挈全蜀还本朝
    start_date: 1242
  decisions:
  - date: 约-1230
    title_zh: 上谒淮东制置使赵葵
    rationale: 以长短句自荐，冀功名之路。
- id: guji-余玠-endeavor-2
  name_zh: 经略四川、筑山城防御体系
  phases:
  - key: brewing
    name_zh: 蜀政紊乱十六年、人心粗定
    labels:
      zh:
      - 授宣抚三人制置使九人终无成绩
    start_date: 1227
  - key: breakthrough
    name_zh: 大更弊政、筑招贤馆、纳冉氏兄弟之谋
    labels:
      zh:
      - 集众思广忠益
      - 徙城钓鱼山
    start_date: 1242
    highlight_event_id: guji-余玠-event-re-built-diaoyu
  - key: climax
    name_zh: 筑十余城、调戍军、开屯田、诛王夔
    labels:
      zh:
      - 因山为垒
      - 蜀以富实
    start_date: 1243
  - key: closure
    name_zh: 遭谗夺志、暴卒
    labels:
      zh:
      - 威名顿挫
      - 赍志以没
    start_date: 1253
  decisions:
  - date: 1242
    title_zh: 筑招贤馆集思广益
    rationale: 仿诸葛孔明用蜀故事，广纳豪杰之言。
  - date: 约-1243
    title_zh: 采冉琎、冉璞之策徙合州城于钓鱼山
    rationale: 蜀口形胜莫若钓鱼山，积粟以守贤于十万师。
  - date: 约-1244
    title_zh: 力排众议独任徙城之责
    rationale: 城成则蜀赖以安，不成玠独坐之。
  - date: 约-1246
    title_zh: 夜召王夔计事而诛之
    rationale: 悍将骄恣劫掠，纵弗诛养成其势，后一举足西蜀危矣。
