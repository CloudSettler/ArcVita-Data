  date: 约-1246
  year_of: 1246
  type: endeavor
  title_zh: 诱诛悍将王夔
  description: 玠至嘉定阅兵慑服王夜叉，后听杨成之谋，夜召夔计事，潜以成代领其众，夔离营即斩之，肃清军令。
  participants:
  - guji-余玠
- id: guji-余玠-event-death
  date: 1253
  year_of: 1253
  type: death
  title_zh: 余玠暴卒
  description: 宝祐元年闻有召命愈不自安，一夕暴下卒，或谓仰药死；帝辍朝，特赠五官，旋以言夺职，六年复之。
  participants:
  - guji-余玠
