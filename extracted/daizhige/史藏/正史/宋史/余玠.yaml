person:
  qid: guji-余玠
  name_zh: 余玠
  names:
    zh: 余玠
    en: Yu Jie
  lifespan:
    birth:
      date: 约-1199
      precision: year
      is_circa: true
      raw: 生年不详，约庆元前后
    death:
      date: 1253
      precision: year
      is_circa: false
      raw: 宝祐元年暴卒
  birth_date: 约-1199
  death_date: 1253
  era: 南宋
  reign_ref: 理宗嘉熙、淳祐、宝祐年间
  archetype: 山城防御体系缔造者
  dilemmas:
  - 刚直任事与(kernel)朝中谗毁猜疑之冲突
  - 久假便宜之权而昧于勇退
  - 整军诛悍将之决断与兵变之险
  lesson: 集众思、广忠益，用贤者成大功；然功高不退易招祸。
  summary_first_person: 我余玠以布衣投军，受赵葵知遇而入幕府，屡立战功。淳祐初自许手挈全蜀还本朝，拜四川安抚制置使，大更弊政，筑招贤馆纳冉琎、冉璞兄弟之谋，徙合州城于钓鱼山，因山为垒筑十余城，屯兵聚粮，整军诛王夔，修学养士，薄赋通商，蜀以富实。然久专阃外之权，遭谢方叔等谗构，宝祐元年闻召命愈不自安，一夕暴卒，蜀人悲慕如失父母。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷416
endeavors:
- id: guji-余玠-endeavor-1
  name_zh: 从军入幕、屡立战功
  phases:
