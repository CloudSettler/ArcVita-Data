person:
  qid: guji-侯益
  name_zh: 侯益
  names:
    zh: 侯益
    en: Hou Yi
  lifespan:
    birth:
      date: 0885
      precision: year
      is_circa: true
      raw: 卒年八十，乾德三年
    death:
      date: 0965
      precision: year
      is_circa: false
      raw: 乾德三年卒，年八十
  birth_date: 0885
  death_date: 0965
  era: 五代至宋初
  reign_ref:
  - 后唐庄宗
  - 后唐明宗
  - 后晋高祖
  - 后晋少帝
  - 后汉高祖
  - 后周太祖
  - 宋太祖
  archetype: 五代历仕数朝的武将
  dilemmas:
  - 后汉时受契丹官职，惧祸欲归蜀，遣子先降，后入朝自辩
  - 潞王举兵时称疾不奉诏，知军情必变而避祸
  - 隐帝时周祖起兵，建议闭关不轻出兵，被慕容彦超讥为懦夫之计
  lesson: 五代乱世中武将周旋于多政权之间，以机变与贿结权贵保全历经数朝
  summary_first_person: 我侯益以拳勇起于李克用麾下，历仕唐、晋、汉、周及宋，凡五朝，以先登陷阵与河上擒将立名，以虎牢大破张从宾的汜水之功最著。晋祖以其功拜节度，赐将相乡勋贤里。后惧汉祖见疑几奔蜀，赖厚赂权贵获授开封尹。周末告老致仕，宋初郊祀时位列中书门下，乾德三年卒，年八十。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷254
