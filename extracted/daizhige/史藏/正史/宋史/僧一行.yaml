  archetype: 历算家·佛教僧侣
  dilemmas:
  - 出世修行与奉诏入世制历之间的张力
  - 《开元大衍历议》与《心机算术括》并存，历法推步与算术著述如何兼精
  lesson: 以佛法之精思入历算之实学，僧身亦能正天下之历。
  summary_first_person: 俗名张遂，出家为僧，法号一行。唐开元年间奉诏修历，撰《开元大衍历议》十三卷，又著《心机算术括》一卷、《大衍历经》与《大衍历立成》《大衍议》诸书，为有唐一代历算之宗。《宋史·艺文志》历算类著录吾书多种，足见后世传习之盛。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷207
