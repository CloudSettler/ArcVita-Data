person:
  qid: guji-刘娥
  name_zh: 刘娥
  names:
    zh: 章献明肃皇后、刘皇后
    en: Empress Liu E (Zhangxian Mingsu)
  lifespan:
    birth:
      date: 969
      precision: year
      is_circa: true
      raw: 约969（据崩于明道二年、年六十五推算）
    death:
      date: 1032
      precision: year
      is_circa: false
      raw: 明道二年崩（1032）
  birth_date: -969
  death_date: 1032
  era: 北宋
  reign_ref: 宋真宗—宋仁宗朝
  archetype: 辅政太后
  dilemmas:
  - 以女子之身垂帘称制，权柄与礼法的张力
  - 立刘氏庙、效武后之诱与守护祖宗之义的抉择
  - 养子仁宗与生母李宸妃关系的隐忍处置
  lesson: 权可临朝而不逾大诈之界，治世在严明有节
  summary_first_person: 我本蜀地孤女，以播鞀之艺人襄邸，佐真宗决政务，终以太后之尊垂帘称制十一年，号令严明、赐予有节，虽进用外家而终不肯负祖宗也。
  source_urls:
  - 《宋史·卷二百四十二·后妃传》
endeavors:
- id: guji-刘娥-endeavor-1
  name_zh: 入侍襄邸至册立为后
  phase_start: 986
  phases:
  - key: brewing
    name_zh: 入襄邸
    labels:
      zh: 后年十五入襄邸
    start_date: 986
    highlight_event_id: guji-刘娥-event-enter-prince-palace
  - key: breakthrough
    name_zh: 真宗即位后渐升
    labels:
      zh: 入为美人，更姓刘
    start_date: 997
    highlight_event_id: guji-刘娥-event-made-beauty
  - key: climax
    name_zh: 立为皇后
    labels:
      zh: 帝卒立之
    start_date: 1012
    highlight_event_id: guji-刘娥-event-made-empress
  decisions:
  - date: 1012
    title_zh: 养李宸妃所生仁宗为己子
    rationale: 与杨淑妃抚育甚至，巩固中宫之位
- id: guji-刘娥-endeavor-2
  name_zh: 垂帘称制
  phase_start: 1022
  phases:
  - key: brewing
    name_zh: 真宗久病预政
    labels:
      zh: 事多决于后
    start_date: 1020
    highlight_event_id: guji-刘娥-event-tianxi-decides
  - key: breakthrough
    name_zh: 受遗诏权处分军国重事
    labels:
      zh: 垂帘决事
    start_date: 1022
    highlight_event_id: guji-刘娥-event-regency-start
  - key: climax
    name_zh: 谒太庙、加尊号
    labels:
      zh: 服衮衣十章，减宗彝、藻，去剑
    start_date: 1033
    highlight_event_id: guji-刘娥-event-imperial-temple
  - key: closure
    name_zh: 崩于明道二年，谥章献明肃
    labels:
      zh: 称制凡十一年
    start_date: 1032
    highlight_event_id: guji-刘娥-event-death
  decisions:
  - date: 1022
    title_zh: 不御别殿，与帝同御承明殿
    rationale: 遣谕曰皇帝视事当朝夕在侧，何须别御一殿
  - date: 1031
    title_zh: 掷程琳《武后临朝图》
    rationale: 吾不作此负祖宗事
  - date: 1024
    title_zh: 命名儒崇政殿讲习经史辅仁宗之德
    rationale: 皇帝听断之暇，宣诏名儒讲习经史
events:
- id: guji-刘娥-event-birth
  date: -969
  year_of: 969
  iso_date: 约969
  type: birth
  title_zh: 刘娥出生（据年寿推算）
  description_zh: 其先家太原，后徙益州华阳，父通为虎捷都指挥使、嘉州刺史，从征太原道卒，后在襁褓而孤，鞠于外氏。
  place: 益州华阳
- id: guji-刘娥-event-enter-prince-palace
  date: 986
  year_of: 986
  iso_date: 约986
  type: career
  title_zh: 十五岁入襄邸
  description_zh: 蜀人龚美携之入京师，后年十五入襄邸；因王乳母秦国夫人之言，太宗令斥去，置之王宫指使张耆家。
- id: guji-刘娥-event-made-beauty
  date: 997
  year_of: 997
  iso_date: 997
  type: career
  title_zh: 真宗即位，入为美人，改姓刘
  description_zh: 以后无宗族，更以龚美为兄弟，改姓刘；大中祥符中为修仪，进德妃。
- id: guji-刘娥-event-made-empress
  date: 1012
  year_of: 1012
  iso_date: 约1012
  type: career
  title_zh: 册立为皇后
  description_zh: 自章穆皇后崩，真宗欲立之，大臣多以为不可，帝卒立之。
- id: guji-刘娥-event-adopt-renzong
  date: 1010
  year_of: 1010
  iso_date: 约1010
  type: family
  title_zh: 以李宸妃所生仁宗为己子
  description_zh: 李宸妃生仁宗，后以为己子，与杨淑妃抚礼甚至。
- id: guji-刘娥-event-tianxi-decides
  date: 1020
  year_of: 1020
  iso_date: 1020
  type: political
  title_zh: 天禧四年真宗久疾，事多决于后
  description_zh: 帝久疾居宫中，事多决于后；寇准密议太子监国谋泄罢相，周怀政谋废后被诛，诏太子开资善堂，后裁制于内。
- id: guji-刘娥-event-regency-start
  date: 1022
  year_of: 1022
  iso_date: 1022
  type: political
  title_zh: 真宗崩，垂帘称制
  description_zh: 遗诏尊为皇太后，军国重事权取处分；帝与太后五日一御承明殿，帝位左，太后位右，垂帘决事。
- id: guji-刘娥-event-tiansheng-first-year
  date: 1027
  year_of: 1027
  iso_date: 1027
  type: ritual
  title_zh: 天圣五年正旦御会庆殿受朝
  description_zh: 太后御会庆殿，群臣及契丹使者班廷中，帝再拜跪上寿；郊祀前出手书谕百官毋请加尊号。
- id: guji-刘娥-event-imperial-temple
  date: 1033
  year_of: 1033
  iso_date: 1033
  type: ritual
  title_zh: 谒太庙，服衮衣，加尊号
  description_zh: 明道二年帝亲耕籍田，太后亦谒太庙，乘玉辂，服衮衣十章，减宗彝、藻，去剑，冠仪天前后垂珠翠十旒；加上尊号曰应天齐圣显功崇德慈仁保寿太后。
- id: guji-刘娥-event-refuse-wuhou-temple
  date: 1030
  year_of: 1030
  iso_date: 约1030
  type: political
  title_zh: 拒依武后故事立刘氏庙
  description_zh: 小臣方仲弓上书请立刘氏庙，程琳献《武后临朝图》，后掷其书于地曰吾不作此负祖宗事。
- id: guji-刘娥-event-death
  date: 1032
  year_of: 1032
  iso_date: 1032
  type: death
  title_zh: 崩，谥章献明肃
  description_zh: 是岁崩，年六十五，谥曰章献明肃，葬永定陵西北；称制加四谥自后始，追赠三世，父封魏王。
  place: 汴京
- id: guji-刘娥-event-fuzhen-taimiao
  date: 1045
  year_of: 1045
  iso_date: 1045
  type: ritual
  title_zh: 庆历五年迁祔真宗庙
  description_zh: 礼院请遵三后同祔故事，迁章献、章懿二后祔真宗庙，序于章穆之次，诏从之。
