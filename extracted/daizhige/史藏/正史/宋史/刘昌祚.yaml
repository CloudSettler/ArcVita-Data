events:
- id: guji-刘昌祚-event-birth
  date: ''
  year_of: ''
  type: birth
  description_zh: 刘昌祚生，字子京，真定人；父刘贺战没于定川，录为右班殿直。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-weiyuan
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 主秦州威远砦，青唐聚兵井盐经年不散，奉帅命往诘，犒赉诸酋，欢然帅众去。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-shishe
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 使辽还，神宗临试驰射，授通事舍人。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-liugoubao
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 夏人寇刘沟堡，领骑二千出援，虏伏万骑于黑山而伪遁，大战不退，薄暮抽矢一发殪其大酋，众遁；李师中上功称西事以来以寡抗众未有如昌祚者。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-jinghe
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 从王中正入蜀破筚篥羌，加皇城使、荣州刺史、秦凤路钤辖，又知河州。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-moqi
  date: 1081-09
  year_of: 1081
  type: endeavor
  description_zh: 元丰四年出胡卢川，次磨齐隘，夏众十万扼险，挟两盾先登，师乘之斩首千七百级。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-lingzhou
  date: 1081-10
  year_of: 1081
  type: endeavor
  description_zh: 进薄灵州，城未及阖先锋夺门几入，奉命按甲勿攻；高遵裕围城十八日不下，夏人决七级渠灌师，军溃南还，昌祚手剑水上为殿，待众济而后行；至渭州粮尽，坐贬永兴军钤辖。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-yongle-rebuild
  date: '1082'
  year_of: 1082
  type: endeavor
  description_zh: 永乐新陷士气不振，知延州先修马政，令军中校技击；自义合至德靖砦七百里度屯戍险易立定式上诸朝。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-saimen
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 夏人寇塞门、安远砦，拒破之，杀其统军叶悖麻、咩吪埋，盖始谋攻永乐者，图其形以献，帝遣近侍劳军。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-longshan
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 知渭州，按举马口分地之法，又括陇山间田得万顷，募士卒五千别置将统之，劲悍出诸军右。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-shefa
  date: ''
  year_of: ''
  type: endeavor
  description_zh: 所著《射法》行于世，箭出百步之外，夏人得箭以为神持归事之。
  source_refs:
  - 宋史·刘昌祚传
- id: guji-刘昌祚-event-death
  date: ''
  year_of: ''
  type: death
  description_zh: 卒，年六十八；赠开府仪同三司，谥曰毅肃。
  source_refs:
  - 宋史·刘昌祚传
