  lesson: 以寡击众凭勇略，临功不争、持法守正，方能名重边陲
  summary_first_person: 我刘昌祚，以寡抗众名震西陲，箭殪夏酋、先登磨齐，克灵州垂成而敛兵不争功，永乐陷后整军经武，卒谥毅肃。
