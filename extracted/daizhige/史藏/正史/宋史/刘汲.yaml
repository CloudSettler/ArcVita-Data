- id: guji-刘汲-event-longdefu
  name_zh: 徙通判隆德府
  date: ''
  type: career
  desc: 奉行神霄宫不如令，因赵霆奏徙通判隆德府；摄守时治妖言狱，据实上报。
- id: guji-刘汲-event-pengzhou
  name_zh: 谪监蓬州税
  date: ''
  type: career
  desc: 对客诋斥宰相王黼领应奉司，被奏谪监蓬州税。
- id: guji-刘汲-event-zhaoxin
  name_zh: 判伪诏独驰南阳
  date: 1127
  year_of: 1127
  type: event
  desc: 建炎元年，冯延绪传诏罢兵，汲疑其伪，与高公纯至南阳，独驰数十骑赴都城，二帝已北行，素服恸哭。
- id: guji-刘汲-event-beizhan
  name_zh: 知邓州备巡幸
  date: ''
  type: career
  desc: 就加直龙图阁、知邓州兼京西路安抚使，广城池、饰行阙；奏请先取河东以定西河根本。
- id: guji-刘汲-event-death
  name_zh: 邓州城陷战死
  date: 1129
  year_of: 1129
  type: death
  desc: 金将银朱急攻京西，南阳陷，汲集敢死士死战，矢下如雨不肯去，死于阵。赠太中大夫，谥忠介。
