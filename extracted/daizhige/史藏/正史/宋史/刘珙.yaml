  birth_date: '1122'
  death_date: '1178'
  era: 南宋
  reign_ref: 宋孝宗
  archetype: 直臣能吏
  dilemmas:
  - 直言进谏会触怒君主与权宦，个人仕途与朝政纲纪难以两全
  - 举贤荐能时需避嫌避私，尤其在与其父旧交张浚相关的任命上
  lesson: 面对强权（秦桧）与君威皆据理力争，反复进谏而不改初心，方为社稷之臣
  summary_first_person: 我刘珙，少有奇质，从叔父子翚学，以荫补官而登进士乙科。秦桧欲追谥其父，我拒不赴会，遂遭驱逐；桧死复起。金人犯边，诏檄多出我手。杨存中以私憾授江淮宣抚，我一再缴奏，终寝其命。湖南李金作乱，我遣将讨平之，孝宗赐玺书褒以经纶实才。我力荐汪应辰、张栻之贤，纠察龙大渊、曾觌近习之祸，奏免苛税巨亿。晚年移知建康，值水旱，全活数十万人无一人流离。临终犹草遗奏，以进退近习、召用陈俊卿、张栻为言，其恨在未能为国报雪仇耻。谥曰忠肃。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷386
