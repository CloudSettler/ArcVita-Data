  description: 奏除福建钞盐岁额二万万，罢江西和籴及广西折米盐钱，蠲诸路逋负巨亿
- id: guji-刘珙-event-longdahyuan
  date: '1170'
  year_of: 1170
  type: defiance
  title_zh: 谏止曾觌复还
  description: 言此曹若引以自近、与闻机事，非所以光德业、振纪纲，命遂止
- id: guji-刘珙-event-wangqi
  date: '1172'
  year_of: 1172
  type: defiance
  title_zh: 诘王琪荐刘甄夫事
  description: 追琪诘其故，殿中皆惊，以故独罢为端明殿学士奉外祠
- id: guji-刘珙-event-famine
  date: '1175'
  year_of: 1175
  type: governance
  title_zh: 建康救荒
  description: 会水旱，首奏蠲夏税六十万缗、秋苗米十六万六千斛，得商人米三百万斛平价振粜，阖境数十万人无一人捐瘠流徙
- id: guji-刘珙-event-death
  date: '1178'
  year_of: 1178
  type: death
  title_zh: 薨
  description: 年五十七，赠光禄大夫，谥忠肃；遗奏仍以国事为念
