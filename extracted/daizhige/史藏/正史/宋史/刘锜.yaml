  - date: 1140-05
    title_zh: 玫言去者斩，决意守顺昌
    rationale: 东京虽失，幸全军至顺昌，有城可守，弃之则敌侵两淮震惊江浙。
  - date: 1140-05
    title_zh: 凿舟沉之，置家寺中积薪
    rationale: 示无去意，激励将士死战。
  - date: 1140-06
    title_zh: 先击兀术而非韩将军
    rationale: 兀术一动，余众无能为。
