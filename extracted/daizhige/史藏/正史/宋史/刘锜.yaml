      - 卒
    start_date: 1162-02
  decisions:
  - date: 1142
    title_zh: 塞黄潭治水患
    rationale: 建炎间决水御盗致荆衡水患，塞之得膏腴田数千亩，流民自占者几千户。
  - date: 1161
    title_zh: 求解兵柄还镇江
    rationale: 病剧，专用防江。
