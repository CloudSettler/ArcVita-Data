  name_zh: 刘锜生
  description_zh: 德顺军人，泸川军节度使刘仲武第九子，美仪状，善射，声如洪钟。
- id: guji-liu-qi-event-shouchang-lizhen
  event_type: endeavor_event
  person_qid: guji-liu-qi
  date: 1140-05
  year_of: 1140
  precision: month
  name_zh: 决守顺昌
  description_zh: 金人败盟来侵，锜与陈规敛兵入城，下令敢言去者斩，凿舟沉之示无去意。
- id: guji-liu-qi-event-shunchang-chengpo
  event_type: endeavor_event
  person_qid: guji-liu-qi
  date: 1140-06
  year_of: 1140
  precision: month
  name_zh: 顺昌初战破敌
  description_zh: 葛王褎与龙虎大王合兵三万薄城，锜令开诸门，以羊马垣为阵，用破敌弓神臂弩射敌，破其铁骑数千。
- id: guji-liu-qi-event-shunchang-jie
  event_type: endeavor_event
  person_qid: guji-liu-qi
  date: 1140-06
  year_of: 1140
  precision: month
  name_zh: 大破铁浮图拐子马
  description_zh: 兀术以铁浮图、拐子马来攻，锜乘暑敌疲，以锐斧出击，大战自辰至申，兀术铁骑什损七八，拔营北去。
- id: guji-liu-qi-event-shunchang-shou
  event_type: award_event
  person_qid: guji-liu-qi
  date: 1140-06
  year_of: 1140
  precision: month
  name_zh: 授武泰军节度使
  description_zh: 顺昌捷闻，帝喜甚，授锜武泰军节度使、侍卫马军都虞候、知顺昌府。
- id: guji-liu-qi-event-zhegao
  event_type: endeavor_event
  person_qid: guji-liu-qi
  date: 1141
  year_of: 1141
  precision: year
  name_zh: 柘皋之战
  description_zh: 与张俊、杨沂中会兵，夹石梁河而阵，大败兀术铁骑十万；柘皋之赏锜军独不与。
- id: guji-liu-qi-event-bamianguan
  event_type: political_event
  person_qid: guji-liu-qi
  date: 1141
  year_of: 1141
  precision: year
  name_zh: 罢宣抚判官
  description_zh: 张俊、杨沂中言锜战不力，秦桧主其说，罢宣抚判官，知荆南府。
- id: guji-liu-qi-event-zaojiolin
  event_type: endeavor_event
  person_qid: guji-liu-qi
  date: 1161
  year_of: 1161
  precision: year
  name_zh: 皂角林大捷
  description_zh: 金万户高景山攻扬州，锜遣员琦拒于皂角林，伏发大败之，斩景山，俘数百人。
- id: guji-liu-qi-event-guazhou-shibai
  event_type: endeavor_event
  person_qid: guji-liu-qi
  date: 1161-11
  year_of: 1161
  precision: month
  name_zh: 瓜洲之败
  description_zh: 侄刘汜违命出战先退，李横亦却，失都统制印；锜闻黄帜久不举，愤懑病益甚。
- id: guji-liu-qi-event-death
  event_type: death
  person_qid: guji-liu-qi
  date: 1162-02
  year_of: 1162
  precision: month
  name_zh: 刘锜卒
  description_zh: 绍兴三十二年闰二月，发怒呕血数升而卒，赠开府仪同三司，后谥武穆。
