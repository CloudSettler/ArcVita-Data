      zh: 北伐破敌
    start_date: '986'
    highlight_event_id: guji-卢斌-event-chaozhou-evacuation
  - key: closure
    name_zh: 枢密院问状获释，任缘边巡检
    labels:
      zh: 释问授职
    start_date: '986'
  decisions:
  - date: '986'
    title_zh: 建议弃涿州结阵南还
    rationale: 涿州深入北境，外无援内无粮，固守无利，结阵而还可百倍其利，并虑辽人剽袭，曹彬从之
- id: guji-卢斌-endeavor-2
  name_zh: 川峡平乱六年
  phases:
  - key: brewing
    name_zh: 授梓遂十二州都巡检使
    labels:
      zh: 巡检川峡
    start_date: '990'
    highlight_event_id: guji-卢斌-event-renyou-suppression
  - key: breakthrough
    name_zh: 斩任诱、破富顺监蛮、擒王尽
    labels:
      zh: 屡平贼乱
    start_date: '991'
  - key: climax
    name_zh: 抵御李顺之乱，死守梓州八十日
    labels:
      zh: 梓州守城
    start_date: '993'
    highlight_event_id: guji-卢斌-event-zizhou-defense
  - key: closure
    name_zh: 传诏安抚蓬阆渠达四州，擢西京作坊使领成州刺史，代还加恩
    labels:
      zh: 功成受奖
    start_date: '994'
  decisions:
  - date: '993'
    title_zh: 率兵六百赴成都，退保梓州集兵赴援
    rationale: 李顺乱起孤军势弱，与张雍共守梓州，决水环城、负土塞门为固守计
  - date: '994'
    title_zh: 上言请置葭萌路砦栅
    rationale: 葭萌路可直入利州，若寇焚栈道剑门不固，故请筑栅防之，太宗从之
- id: guji-卢斌-endeavor-3
  name_zh: 讨李继迁与灵州之谏
  phases:
  - key: brewing
    name_zh: 命为银夏兵马钤辖，五路出师
    labels:
      zh: 出师西讨
    start_date: '997'
  - key: climax
    name_zh: 恳言坚保灵州不果，任灵环路钤辖为前锋
    labels:
      zh: 谏而不用
    start_date: '997'
    highlight_event_id: guji-卢斌-event-lingshui-campaign
  - key: closure
    name_zh: 与诸将失期，徙屯宁州，以疾召归
    labels:
      zh: 失期而归
    start_date: '998'
  decisions:
  - date: '997'
    title_zh: 力谏不宜疾战沙漠，主张坚保灵州积粮
    rationale: 羌兵悍往来无定，败则他走，沙漠疾战非天兵所利；宜内积刍粮以援送，会兵首尾击之
  - date: '997'
    title_zh: 不俟诏自环州橐驼路进兵
    rationale: 灵州抵乌白池月余方至，取环州路裁十日，欲先期会师，然与诸将失期不见贼而还
