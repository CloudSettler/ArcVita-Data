person:
  qid: guji-卢斌
  name_zh: 卢斌
  names:
    zh: 卢斌
    en: Lu Bin
  lifespan:
    birth:
      date: '946'
      precision: year
      is_circa: true
      raw: 卒年五十，咸平初卒，逆推约生于后晋开运年间
    death:
      date: '998'
      precision: year
      is_circa: true
      raw: 咸平初卒，年五十
  birth_date: '946'
  death_date: '998'
  era: 北宋
  reign_ref: 宋太宗、宋真宗
  archetype: 将领
  dilemmas:
  - 涿州孤城外无援兵、内无资粮，固守与还师两难，力主结阵而还保全军民
  - 五路讨李继迁时，直谏沙漠疾战非天兵所利，主张坚保灵州积粮缓进，然师已出而不从其议
  lesson: 明于形势、敢于直言，虽建言未必见用，仍尽忠职守，孤军御寇建功边陲
  summary_first_person: 我卢斌，开封人，以笔札事晋邸，太宗即位补殿直。雍熙北伐我曹彬军下涿州，食尽援绝之际我力主弃守结阵而还，遂拥城中老幼南迁。后巡检缘边，平侯和尚、刘渥之盗；ummy淳化中讨任诱、平富顺监蛮、击王尽，及李顺乱，我率六百兵抵成都，转战连月，守梓州八十日破相里贵二十万之众，解阆州之围，在川峡六年累立战功。又请置葭萌砦栅以固剑门险。银夏之役，我谏天兵不宜疾战沙漠而不见用，失期而还。咸平初以疾召归，卒，年五十。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷308
endeavors:
- id: guji-卢斌-endeavor-1
  name_zh: 北伐戍守与建言弃涿州
  phases:
  - key: brewing
    name_zh: 领兵屯霸州
    labels:
      zh: 屯戍霸州
    start_date: '984'
  - key: breakthrough
    name_zh: 从曹彬北伐抵祁沟涿州
