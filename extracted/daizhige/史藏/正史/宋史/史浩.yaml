person:
  qid: guji-shi-hao
  name_zh: 史浩
  names:
    zh: 史浩
    en: Shi Hao
  lifespan:
    birth:
      date: '1106'
      precision: year
      is_circa: true
      raw: 绍熙五年薨，年八十九，逆推
    death:
      date: '1194'
      precision: year
      is_circa: false
      raw: 绍熙五年薨，年八十九
  birth_date: '1106'
  death_date: '1194'
  era: 南宋
  reign_ref: 宋高宗绍兴、宋孝宗隆兴/淳熙、宋光宗绍熙
  archetype: 宰相·帝王师
  dilemmas:
  - 太子不可将兵，当如何劝谏建王不以兵权侥幸
  - 与张浚主战之争，先备御还是即日恢复
  - 军民殴斗同罚之议，是为平冤还是逆上意
  lesson: 守备为先、公而忘私，以德报怨而不以私害公
  summary_first_person: 我以绍兴十四年进士入仕，屡任王府官，力阻建王将兵而护储嗣之礼；孝宗朝两度拜相，主张先为备御而不轻言用兵；虽有争罢之谪，终以宽厚荐贤、 resid 至太师，薨后追封越王。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷396
