events:
- id: guji-shi-hao-event-birth
  date: '1106'
  year_of: 1106
  category: birth
  title_zh: 史浩生（据卒年及寿数逆推）
  description: 字直翁，明州鄞县人
- id: guji-shi-hao-event-death
  date: '1194'
  year_of: 1194
  category: death
  title_zh: 薨，年八十九，追封会稽郡王
  description: 绍熙五年薨，宁宗时赐谥文惠；嘉定十四年追封越王、改谥忠定，配享孝宗庙庭
- id: guji-shi-hao-event-jinshi
  date: '1144'
  year_of: 1144
  category: career
  title_zh: 登进士第，调绍兴余姚县尉
  description: 绍兴十四年登第，后历温州教授，为郡守张九成所器
- id: guji-shi-hao-event-zhouli
  date: '1155'
  year_of: '1155'
  category: career
  title_zh: 讲《周礼》训世子饮酒当有节
  description: 为建王直讲，讲膳夫、酒正之制，王起而谢曰敢不佩斯训
- id: guji-shi-hao-event-jianbing
  date: '1161'
  year_of: 1161
  category: career
  title_zh: 谏止建王将兵，草奏请扈跸
  description: 金主亮犯边，建王抗疏请为前驱，浩力言太子不可将兵，并草请扈跸供子职之奏，高宗怒意顿释
- id: guji-shi-hao-event-shouchan
  date: '1162'
  year_of: 1162
  category: career
  title_zh: 立建王为皇太子，除起居郎兼太子右庶子
  description: 三十二年上还临安；孝宗受禅后迁翰林学士、知制诰
- id: guji-shi-hao-event-canzheng
  date: '1162'
  year_of: '1162'
  category: career
  title_zh: 除参知政事，奏先为备御
  description: 议应敌定论，主张先为备御是谓良规，荐陆游、尹穑并赐出身
- id: guji-shi-hao-event-baixiang
  date: '1163'
  year_of: 1163
  category: career
  title_zh: 拜尚书右仆射，首请复赵鼎、岳飞等官爵
  description: 首言赵鼎、李光无罪，岳飞久冤宜复官爵、禄其子孙，悉从之
- id: guji-shi-hao-event-bianlun
  date: '1163'
  year_of: '1163'
  category: career
  title_zh: 与张浚殿上辨论恢复，遂请去位
  description: 反对即日出兵，主张城瓜洲、采石；出知绍兴，自是不召者十三年
- id: guji-shi-hao-event-fuxiang
  date: '1174'
  year_of: '1174'
  category: career
  title_zh: 淳熙五年复为右丞相
  description: 上曰自叶衡罢虚席以待卿久矣；浩奏蒙恩再相唯尽公道
- id: guji-shi-hao-event-luyou
  date: '1162'
  year_of: '1162'
  category: recommendation
  title_zh: 荐枢密院编修官陆游、尹穑
  description: 召对，并赐出身
- id: guji-shi-hao-event-jianxian
  date: '1178'
  year_of: '1178'
  category: recommendation
  title_zh: 荐江浙之士十五人
  description: 经筵告归前薛叔似、杨简、陆九渊、叶适、袁燮等有旨升擢
- id: guji-shi-hao-event-zhishi
  date: '1183'
  year_of: 1183
  category: career
  title_zh: 请老，除太保致仕，封魏国公
  description: 淳熙十年请老；晚治第鄞之西湖上，建阁奉两朝赐书，光宗御极进太师
