- id: guji-吕大防-event-qinzhichang
  event_type: endeavor
  title_zh: 元祐元年拜尚书右丞进中书侍郎封汲郡公，擒鬼章
  date: '1086'
  year_of: 1086
  participants:
  - guji-吕大防
  summary_zh: 西方息兵后羌将鬼章犯边，大防命洮州诸将乘间致讨，生擒之。
- id: guji-吕大防-event-zuopuye
  event_type: endeavor
