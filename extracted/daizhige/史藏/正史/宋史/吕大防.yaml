  - 边地弃守两难：弃之则弱国，守之恐后悔
  - 建言直谏招致贬窜，进退之间守持公义
  lesson: 朴厚惷直、不植党朋，凡八年始终如一，虽贬死犹守臣节。
  summary_first_person: 我吕大防，以进士入仕，因治水利民、直言敢谏见称，历神宗、哲宗两朝官至尚书左仆射，倡祖宗家法，终为党争所倾，贬死循州。
  source_urls:
  - 宋史 卷三百四十
