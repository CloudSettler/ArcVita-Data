  date: '1088'
  year_of: 1088
  participants:
  - guji-吕大防
  summary_zh: 吕公著告老，宣仁后手札密访，超拜大防左仆射兼门下侍郎，提举修神宗实录。
- id: guji-吕大防-event-death
  event_type: death
  title_zh: 贬安置循州途中病逝
  date: '1097'
  year_of: 1097
  participants:
  - guji-吕大防
  summary_zh: 绍圣四年贬舒州团练副使安置循州，至虔州信丰而病，遂薨，年七十一。
