  name_zh: 吕祖谦
  names:
    zh: 吕祖谦
    en: Lü Zuqian
  lifespan:
    birth:
      date: '1137'
      precision: year
      is_circa: true
      raw: 生年约靖康前后，卒年四十五推算
    death:
      date: '1181'
      precision: year
      is_circa: false
      raw: 卒年四十五
  birth_date: '1137'
  death_date: '1181'
  era: 南宋
  reign_ref: 孝宗
  archetype: scholar-official
  dilemmas:
  - 祖谦之学本之家庭，有中原文献之传
  - 少卞急，诵孔子言躬自厚而薄责于人，忽觉平时忿懥涣然冰释
  lesson: 学如伯恭，方是能变化气质
  summary_first_person: 我名祖谦，字伯恭，尚书右丞好问之孙，自祖父始居婺州。我以荫补入官，举进士，复中博学宏词科。我治学以关、洛为宗，旁稽载籍，讲索益精，人称其能变化气质。孝宗命我校订《文海》，成《皇朝文鉴》百五十卷，有益治道。我居丽泽书院会友讲学，虽卧病而任重道远之意不衰，惜天不假年，卒于濯，谥曰成。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷434
