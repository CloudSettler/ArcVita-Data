events:
- id: guji-吕祖谦-event-birth
  event_type: birth
  date: '1137'
  year_of: 1137
  name_zh: 吕祖谦生
  description: 尚书右丞好问之孙，自其祖始居婺州，学本之家庭，有中原文献之传。
- id: guji-吕祖谦-event-jinshi
  event_type: career
  date: '1163'
  year_of: 1163
  name_zh: 举进士复中博学宏词科
  description: 初荫补入官，后举进士，复中博学宏词科，调南外宗教。
- id: guji-吕祖谦-event-mingzhao
  event_type: career
  date: '1167'
  year_of: 1167
  name_zh: 丁内艰居明招山
  description: 丁内艰居明招山，四方之士争趋之。
- id: guji-吕祖谦-event-lundui
  event_type: career
  date: '1168'
  year_of: 1168
  name_zh: 轮对勉孝宗留意圣学
  description: 除太学博士，添差教授严州，寻复召为博士兼国史院编修官、实录院检讨官。轮对，勉孝宗留意圣学，言恢复大事规模当定方略当审。
- id: guji-吕祖谦-event-lujiuyuan
  event_type: career
  date: '1170'
  year_of: 1170
  name_zh: 考试礼部识陆九渊文
  description: 尝读陆九渊文喜之，考试礼部得一卷曰此必江西小陆之文也，揭示果九渊，人服其精鉴。
- id: guji-吕祖谦-event-huizongshilu
  event_type: career
  date: '1172'
  year_of: 1172
  name_zh: 重修徽宗实录
  description: 越三年除秘书郎、国史院编修官、实录院检讨官，以修撰李焘荐，重修《徽宗实录》，书成进秩。
- id: guji-吕祖谦-event-wenjian
  event_type: career
  date: '1178'
  year_of: 1178
  name_zh: 进皇朝文鉴
  description: 孝宗以命祖谦铨择文海，遂断自中兴以前，崇雅黜浮，类为百五十卷，上之，赐名《皇朝文鉴》，诏除直秘阁。
- id: guji-吕祖谦-event-death
  event_type: death
  date: '1181'
  year_of: 1181
  name_zh: 吕祖谦卒
  description: 除著作郎兼国史院编修官，卒年四十五，谥曰成。修《读诗记》《大事记》皆未成书，考定《古周易》《书说》等皆行于世，郡人即丽泽书院而祠之。
