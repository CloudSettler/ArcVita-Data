person:
  qid: guji-吕颐浩
  name_zh: 吕颐浩
  names:
    zh: 吕颐浩
    en: Lü Yihao
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      date: 1139
      precision: year
      is_circa: false
      raw: 绍兴九年，未几，卒
  death_date: 1139
  era: 南宋
  reign_ref: 宋高宗建炎—绍兴年间
  archetype: 宰相·勤王定难之臣
  dilemmas:
  - 直言谏边险遭贬斥与尽忠社稷的取舍
  - 勤王讨逆与功高专权的党争困境
  - 北伐恢复大计与主客观条件不足的矛盾
  lesson: 胆略可定倾危之局，然不能以至公无我处事，终难保令名
  summary_first_person: 我吕颐浩，历仕徽、钦、高三朝。伐燕时力谏开边之非，几遭贬死；金人入燕，身陷敌手而得归。苗刘兵变，我举义勤王，会兵讨贼，扶高宗复辟，遂登相位。当国步艰难，我请兵北向以图恢复，然与秦桧倾轧，再相而罢。晚岁病辞，卒谥忠穆。我劝浙月桩钱之立亦为东南之患，功过任后人评说。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷362
