    title_zh: 请赏劳诛罪以平李接之乱
    rationale: 主张信赏必罚，使士卒争死斗，盗乱不逾时而平。
  - date: 约1194
    title_zh: 上疏谏光宗过宫并责陈傅良
    rationale: 安危之机判然可见，当为士大夫倡，不可洁身而去。
- id: guji-吴猎-endeavor-2
  name_zh: 荆襄备御与经边
  phases:
  - key: brewing
    name_zh: 贻书论边
