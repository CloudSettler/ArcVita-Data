person:
  qid: guji-吴猎
  name_zh: 吴猎
  names:
    zh: 吴猎
    en: Wu Lie
  lifespan:
    birth:
      date: 约-1142
      precision: year
      is_circa: true
      raw: 生年不详，约南宋绍兴初
    death:
      date: 1213
      precision: year
      is_circa: false
      raw: 嘉定六年卒
  birth_date: 约-1142
  death_date: 1213
  era: 南宋
  reign_ref: 孝宗、光宗、宁宗
  archetype: 经世儒臣·湖湘学派表率
  dilemmas:
  - 弹劾权相外甥而自遭贬降，是否坚持赏罚公道
  - 伪学禁兴时直言抗争与仕途安危的取舍
  - 开禧北伐中主守备荆州与朝廷用兵之争
  lesson: 学术正、守职直，虽屡遭党禁贬黜而经世之志不改，终于荆襄御侮、安民有功。
  summary_first_person: 我吴猎早年从张栻、朱熹问学，以湖湘正学自任。历官谏职、财赋、边帅，论事不肯阿附，虽坐党禁屡废，晚岁镇守荆襄，修三海之险、捍金人、平饥价，蜀人思我之政而祠之。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷397
