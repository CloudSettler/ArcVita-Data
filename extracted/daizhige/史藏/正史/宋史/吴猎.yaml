  - key: climax
    name_zh: 节制本路兵马
    labels:
      zh: 援竟陵·解襄阳之围
    start_date: 约1208
    highlight_event_id: guji-吴猎-event-jingling
  - key: closure
    name_zh: 宣谕四川
    labels:
