  decisions:
  - date: 约1206
    title_zh: 输湖南米五十万石于襄阳
    rationale: 料金人必出荆襄逾湖，预储军实，增枣阳、信阳之戍。
  - date: 约1207
    title_zh: 修成高氏三海、置四匮限戎马
    rationale: 荆为重镇，以水势四合限敌骑，图为长久守御之计。
  - date: 约1208
    title_zh: 募死士入竟陵、分道夹击金人
    rationale: 金再犯竟陵、张荣战死，非死守夹击不能却敌。
events:
- id: guji-吴猎-event-birth
  event_type: birth
  date: 约-1142
  year_of: -1142
  date_raw: 生年不详
  title_zh: 吴猎生于潭州醴陵
  description: 吴猎，字德夫，潭州醴陵人。
- id: guji-吴猎-event-pingnan
  event_type: career
  date: 约1172
  year_of: 1172
  date_raw: 登进士第后初仕
  title_zh: 登进士第，主浔州平南簿，摄静江府教授
  description: 时张栻经略广西，檄摄静江府教授；刘焞代栻，栻以猎荐，辟本司准备差遣。
- id: guji-吴猎-event-lijie
  event_type: career
  date: 约1180
  year_of: 1180
  date_raw: 李接之乱时
  title_zh: 请赏劳诛罪，平李接之乱
  description: 盗李接陷容、雷等州，猎请赏劳诛罪，焞录郁林功、诛南流县尉等，不逾时盗悉就擒；尉为王淮甥，猎坐降官。
- id: guji-吴猎-event-shangshu
  event_type: career
  date: 约1193
  year_of: 1193
  date_raw: 光宗不觐重华宫时
  title_zh: 上疏谏光宗过宫问安
  description: 光宗以疾久不觐重华宫，猎上疏切谏，并白留正乞召朱熹、杨万里，责陈傅良当奋力为士大夫倡。
- id: guji-吴猎-event-weixue
  event_type: career
  date: 1195
  year_of: 1195
  date_raw: 伪学禁兴时
  title_zh: 论伪学之禁，驳史浩谥、请张浚配享
  description: 禁兴时直言乱政之讥，驳史浩谥，请以张浚配享阜陵，议皆不合，出为江西转运判官，寻劾罢。
- id: guji-吴猎-event-huguang
  event_type: career
  date: 约1203
  year_of: 1203
  date_raw: 党禁驰后
  title_zh: 起知广西、除户部员外郎总领湖广财赋
  description: 党禁驰，起为广西转运判官，除户部员外郎、总领湖广江西京西财赋。
- id: guji-吴猎-event-yishu
  event_type: career
  date: 约1206
  year_of: 1206
  date_raw: 韩侂胄议开边时
  title_zh: 贻书当路献保边之策
  description: 请号召义士、刺子弟补军实、增枣阳信阳之戍、分屯阳罗五关，并输湖南米五十万石于襄阳，荐拔董逵、孟宗政等。
- id: guji-吴猎-event-jiangling
  event_type: career
  date: 约1207
  year_of: 1207
  date_raw: 知江陵府时
  title_zh: 知江陵府，振饥平粜
  description: 江陵告饥，请大农十万缗振饥；道武昌招商分籴，至郡减价发粜，米价为平。
- id: guji-吴猎-event-sanhai
  event_type: career
  date: 约1207
  year_of: 1207
  date_raw: 治荆时
  title_zh: 修成高氏三海，筑匮蓄水以限戎马
  description: 金鸾、内湖等四匮达上海注中海，拱辰等四匮达下海，又遏走马湖、熨斗陂之水，置李公匮，水势四合可限戎马。
- id: guji-吴猎-event-jingling
  event_type: military
  date: 约1208
  year_of: 1208
  date_raw: 金再犯竟陵时
  title_zh: 节制本路兵马，却金解襄阳之围
  description: 金再犯竟陵，张荣死之；猎募死士入竟陵，命王宗廉死守，调大军分道夹击，金人遂去；督董逵等援德安，孟宗政等解襄阳之围。
- id: guji-吴猎-event-sichuan
  event_type: career
  date: 约1209
  year_of: 1209
  date_raw: 吴曦伏诛后
  title_zh: 充四川宣谕使，进安抚制置使知成都
  description: 以刑部侍郎充四川宣谕使，旌别淑慝，以敷文阁学士、四川安抚制置使兼知成都府。
- id: guji-吴猎-event-death
  event_type: death
  date: 1213
  year_of: 1213
  date_raw: 嘉定六年
  title_zh: 吴猎卒，蜀人画像祠之
  description: 嘉定六年召还，卒，家无余资。蜀人思其政，画像祠之。谥文定。
