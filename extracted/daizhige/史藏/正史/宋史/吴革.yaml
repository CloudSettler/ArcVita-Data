events:
- id: guji-吴革-event-birth
  person_id: guji-吴革
  date: ''
  year_of: ''
  title_zh: 出生
  description: 华州华阳人，国初勋臣廷祚七世孙，生年不详。
- id: guji-吴革-event-jiejiu
  person_id: guji-吴革
  date: 1125
  year_of: 约1125
  title_zh: 解辽州之围并面斥粘罕
  description: 金人南牧，革帅兵解辽州之围；使粘罕军，揖不拜，责其贪利败约，词直气劲，粘罕少屈，为追回威胜诸屯兵。
- id: guji-吴革-event-shijin
  person_id: guji-吴革
  date: 1126
  year_of: 1126
  title_zh: 持节谕陕西并力谏备御
  description: 诏以为武功大夫、合门宣赞舍人，持节谕陕西；闻金人犯京师复还，与张叔夜同入城，乞幸秦州、出城劫敌、诸门出的兵牵制，皆不果。
- id: guji-吴革-event-zhenjiu
  person_id: guji-吴革
  date: 1127
  year_of: 1127
  title_zh: 启圣僧院置振济局、阴部勒数万饥民
  description: 于启圣僧院置振济局募士民就食，一日之间至者万计，阴以军法部勒，迁同文馆后所合已至数万，多两河骁悍之士，将攻金营。
- id: guji-吴革-event-death
  person_id: guji-吴革
  date: 1127-03
  year_of: 1127
  title_zh: 起兵讨张邦昌事泄，骂贼而死
  description: 谋先诛范琼辈以三月八日起兵，前期二日谋泄，为琼党所执，胁以从逆，革骂之极口，引颈受刃，颜色不变；其麾下百人皆同死。
