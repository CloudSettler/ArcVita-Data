  archetype: 忠烈死节之将
  dilemmas:
  - 主和派对金妥协与自身主战之志冲突
  - 欲起兵讨张邦昌而谋泄身陷逆党重围
  lesson: 大节临危不可夺，虽众寡不敌亦当引颈受刃，颜色不变。
  summary_first_person: 我乃华州华阳人，廷祚七世孙。金人南侵时我面斥粘罕，力谏钦宗起关中兵备战；京城陷后，我以军法部勒数万饥民，谋先诛范琼辈、讨张邦昌，事泄被执，骂贼不降而死。
  source_urls:
  - 宋史 卷四百五十二 忠义传
