events:
- id: guji-周必大-event-birth
  type: birth
  date: '1126'
  year_of: 1126
  description: 周必大约生于靖康之际，其先郑州管城人，祖倅庐陵因家焉
  labels:
    zh:
    - 出生
- id: guji-周必大-event-jinshi
  type: endeavor
  date: '1150'
  year_of: 1150
  description: 绍兴二十年第进士，授徽州户曹，后中博学宏词科，高宗读其策称掌制手
  labels:
    zh:
    - 登第
    - 掌制手
- id: guji-周必大-event-bushuhuang
  type: endeavor
  date: '1163'
  year_of: 1163
  description: 孝宗初立，权给事中缴驳不避权幸，与金安节不书黄，格不行曾觌、龙大渊之命，遂请祠去
  labels:
    zh:
    - 不书黄
    - 请祠去
- id: guji-周必大-event-shujin
  type: endeavor
  date: '1180'
  year_of: 1180
  description: 赵雄使金议受书礼，必大立具草，请正敌国之名，上称此大才也
  labels:
    zh:
    - 正敌国之名
- id: guji-周必大-event-hanyuan
  type: endeavor
  date: '1177'
  year_of: 1177
  description: 除翰林学士，在翰苑几六年，制命温雅周尽事情，为一时词臣之冠
  labels:
    zh:
    - 词臣之冠
- id: guji-周必大-event-canzheng
  type: endeavor
  date: '1187'
  year_of: 1187
  description: 淳熙十四年二月拜右丞相，论执政当和而不同，首奏当思经远之计
  labels:
    zh:
    - 拜右丞相
- id: guji-周必大-event-dianshifa
  type: endeavor
  date: '1189'
  year_of: 1189
  description: 拜枢密使，创诸军点试法，力主镇之以静，识破敌国虚喝
  labels:
    zh:
    - 点试法
    - 先见之明
- id: guji-周必大-event-inner-chanrang
  type: endeavor
  date: '1189'
  year_of: 1189
  description: 孝宗欲传位太子留必大定议，拜左丞相益国公，预草传位诏
  labels:
    zh:
    - 左丞相
    - 内禅定议
- id: guji-周必大-event-hele
  type: endeavor
  date: '1194'
  year_of: 1194
  description: 光宗朝何澹首劾必大，降判潭州，又被指为伪学罪首
  labels:
    zh:
    - 遭劾
    - 伪学罪首
- id: guji-周必大-event-zhishi
  type: endeavor
  date: '1195'
  year_of: 1195
  description: 庆元元年三上表引年，以少傅致仕，自号平园老叟
  labels:
    zh:
    - 致仕
- id: guji-周必大-event-death
  type: death
  date: '1204'
  year_of: 1204
  description: 嘉泰四年薨，年七十九，赠太师谥文忠，宁宗题其碑曰忠文耆德之碑
  labels:
    zh:
    - 薨
    - 谥文忠
