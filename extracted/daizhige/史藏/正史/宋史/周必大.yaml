person:
  qid: guji-周必大
  name_zh: 周必大
  names:
    zh: 周必大
    en: Zhou Bida
  lifespan:
    birth:
      date: '1126'
      precision: year
      is_circa: true
      raw: 卒于嘉泰四年，年七十有九，逆推生年约靖康前后
    death:
      date: '1204'
      precision: year
      is_circa: false
      raw: 嘉泰四年，薨，年七十有九
  birth_date: '1126'
  death_date: '1204'
  era: 南宋
  reign_ref: 高宗、孝宗、光宗、宁宗朝
  archetype: 词臣出身的刚正宰相
  dilemmas:
  - 不书黄抗拒曾觌、龙大渊迁官，宁去职不附幸臣
  - 反对畏金曲徇旧礼，坚持正敌国之名
  - 庆元党禁中被指为伪学罪首而持守儒学立场
  lesson: 持正守职、储才恤民，虽屡遭贬抑而名节弥重
  summary_first_person: 我是周必大，字子充，历仕高孝光宁四朝。我以文章词臣起家，因刚正敢言屡忤权幸，累迁至左丞相，国之大事每以数语决之。晚年遭庆元党禁之诬，退而著书八十一种，谥文忠。
  source_urls:
  - https://zh.wikisource.org/宋史/卷391
