  summary_first_person: 我孔道辅乃孔子四十五代孙，性格鲠挺，遇事弹劾无所避。曾笞蛇破迷信、出使契丹斥优人侮圣、率谏官伏阁反对废郭皇后，虽屡遭贬逐仍守正不阿，最终被张士逊所卖，愤惋发病卒于韦城，天下莫不以直道许我。
