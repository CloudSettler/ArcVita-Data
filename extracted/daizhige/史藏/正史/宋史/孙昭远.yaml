  era: 北宋末至南宋初
  reign_ref: 靖康、建炎
  archetype: 忠烈守土之臣
  dilemmas:
  - 诸路帅臣逗留失期，劾奏二十有八疏以整军纪，得罪同僚而求师出
  - 兵败部下欲拥其南还，昭远坚持守土报国，终为叛兵所害
  lesson: 身处乱世而守节不动，虽众寡悬殊、众叛亲离，仍以报国为先。
  summary_first_person: 我是孙昭远，字显叔，眉州眉山人。靖康间金人围太原，我奉命招集溃兵，督诸道军入援。建炎初出知河南尹、西京留守，敛散亡、保伊阳。金兵大至，部下欲拥我南还，我叱之，遂遇害。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷453
