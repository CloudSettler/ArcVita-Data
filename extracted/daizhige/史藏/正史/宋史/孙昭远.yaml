  title_zh: 元祐间中进士，调长沙尉
  description: 元祐间举进士，调任长沙尉，后辟河东经略司干当公事。
- id: guji-孙昭远-event-endeavor-2
  date: 1126
  year_of: 1126
  event_type: career
  title_zh: 靖康元年召为水部员外郎，遣同招集溃兵
  description: 金人围太原，宋师多溃，钦宗遣折彦质乘传同昭远招集；会洛阳陷，授西道总管。
- id: guji-孙昭远-event-endeavor-3
  date: 1126
  year_of: 1126
  event_type: career
  title_zh: 二十有八疏劾逗留诸帅，合兵十万出关
  description: 昭远督范致虚诸军入援，檄诸道出师，劾席贡、赵点、张深等后师期；合诸道兵十万，与致虚同出关，马祐昌战败。
- id: guji-孙昭远-event-endeavor-4
  date: 1127
  year_of: 1127
  event_type: career
  title_zh: 建炎元年迁河南尹、西京留守
  description: 至洛阳收集散亡，得义兵万余人，栅伊阳，使民入保。
- id: guji-孙昭远-event-endeavor-5
  date: 1127
  year_of: 1127
  event_type: death
  title_zh: 金人来攻，昭远遇害
  description: 其冬金人来攻，遣将姚庆拒战败死；昭远战不利，叱欲拥其南还之叛兵，遂遇害，官属无免者。
- id: guji-孙昭远-event-death
  date: 1127
  year_of: 1127
  event_type: death
  title_zh: 孙昭远卒
  description: 建炎元年冬为叛兵所害；四年后追赠徽猷阁待制。
- id: guji-孙昭远-event-posthumous
  date: 1130
  year_of: 1130
  event_type: honor
  title_zh: 追赠徽猷阁待制
  description: 建炎四年，朝廷追赠徽猷阁待制以旌其忠。
