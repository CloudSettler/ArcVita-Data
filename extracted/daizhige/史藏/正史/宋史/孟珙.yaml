  title_zh: 诏主管侍卫马军孟珙黄州驻扎，措置边防
  summary: 端平二年正月丙辰，朝廷命孟珙驻扎黄州，措置边防；丁巳入见。
- id: guji-孟珙-event-3
  type: appointment
  date: 1237-03
  year_of: 1237
  title_zh: 以孟珙为忠州团练使、知江陵府、京西湖北安抚副使
  summary: 嘉熙元年三月乙亥授命，出镇江陵，整顿京湖防务。
- id: guji-孟珙-event-4
  type: appointment
  date: 1238-02
  year_of: 1238
  title_zh: 以孟珙为京湖安抚制置副使，置司松滋县
  summary: 嘉熙二年正月进宁远军承宣使、依旧带御器械，二月癸卯授京湖安抚制置副使，置司松滋。
- id: guji-孟珙-event-5
  type: appointment
  date: 1239-03
  year_of: 1239
  title_zh: 孟珙兼都督行府参谋官
  summary: 嘉熙三年三月甲戌，兼都督行府参谋官，参预京湖大计。
- id: guji-孟珙-event-death
  type: death
  title_zh: 卒（本卷未载卒年）
  summary: 其卒年卒况不在本卷所记范围内。
