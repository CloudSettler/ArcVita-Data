  dilemmas:
  - 蒙古南压之际，既要措置边防又须与朝廷和战之议相周旋
  lesson: 危局之中受任于败军之际，屡迁要职以捍京湖
  summary_first_person: 我是孟珙，理宗朝守边之将，自端平二年奉诏驻扎黄州措置边防，此后历知江陵府、京湖安抚，进承宣使、制置副使，参谋都督行府，专力于京湖江汉之防。
  source_urls:
