  - key: closure
    name_zh: 南渡随驾
    labels:
      zh:
      - 避兵洪州虔州
    start_date: '1129'
    highlight_event_id: guji-孟皇后-event-flight
  decisions:
  - date: '1129'
    title_zh: 力拒立三岁皇子
    rationale: 强敌在外，以妇人抱三岁小儿听政将何以令天下
  - date: '1127'
    title_zh: 遣使奉迎康王
    rationale: 京师无主，遣冯澥、李回持书迎康王即皇帝位
  - date: '1131'
    title_zh: 婉言促更修神哲两朝实录
    rationale: 奸臣谤诬宣仁太后，国史未删定不足传信
events:
- id: guji-孟皇后-event-birth
  date: 约1077
  year_of: 1077
  event_type: birth
  title_zh: 孟皇后生于洺州
  description: 洺州人，眉州防御使、马军都虞候、赠太尉孟元之孙女
- id: guji-孟皇后-event-entry
  date: 约1091
  year_of: 1091
  event_type: milestone
  title_zh: 选入宫中
  description: 年十六，宣仁高太后与钦圣向太后皆爱之，教以女仪
- id: guji-孟皇后-event-enthroned
  date: '1092'
  year_of: 1092
  event_type: milestone
  title_zh: 元祐七年册立为皇后
  description: 帝亲御文德殿册为皇后，宣仁太后语帝曰得贤内助非细事
- id: guji-孟皇后-event-deposed
  date: '1096'
  year_of: 1096
  event_type: crisis
  title_zh: 绍圣三年被废
  description: 章惇、郝随等构成皇城司狱，诏废后，出居瑶华宫，号华阳教主、玉清妙静仙师，天下冤之
- id: guji-孟皇后-event-restored
  date: '1100'
  year_of: 1100
  event_type: milestone
  title_zh: 元符末诏还内，号元祐皇后
  description: 钦圣太后将复后位，诏后还内；崇宁初又被蔡京等再废，复居瑶华宫
- id: guji-孟皇后-event-jingkang
  date: '1127'
  year_of: 1127
  event_type: crisis
  title_zh: 靖康之难，独存六宫
  description: 京城陷，六宫有位号者皆北迁，后以废独存；张邦昌僭位，尊为宋太后，迎入禁中垂帘听政
- id: guji-孟皇后-event-gaozong
  date: '1127'
  year_of: 1127
  event_type: milestone
  title_zh: 遣使迎立康王
  description: 闻康王在济，遣冯澥、李回及忠厚持书奉迎，康王即皇帝位，后是日撤帘
- id: guji-孟皇后-event-miaoliu
  date: '1129'
  year_of: 1129
  event_type: milestone
  title_zh: 苗刘之变，垂帘定乱
  description: 苗傅、刘正彦作乱逼立皇子，太后力拒；韩世忠等引兵至，太后曲加慰抚诱以复辟，乱平
- id: guji-孟皇后-event-flight
  date: '1129'
  year_of: 1129
  event_type: relocation
  title_zh: 南渡避兵洪州虔州
  description: 金人渡江，康玨奉太后奔洪州、吉州、太和，兵溃之后以农夫肩舆往虔州，旋被迎归越州
- id: guji-孟皇后-event-death
  date: 1135-05
  year_of: 1135
  event_type: death
  title_zh: 绍兴五年崩于行宫西殿
  description: 年五十九，上尊号昭慈献烈皇太后，殡于会稽上皇村，三年改谥昭慈圣献
