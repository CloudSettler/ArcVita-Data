  decisions:
  - date: '1096'
    title_zh: 阻姊以符水治病入宫
    rationale: 惊知宫禁严禁，令藏符俟帝至具言其故，以避厌魅之嫌
- id: guji-孟皇后-endeavor-2
  name_zh: 靖康后垂帘辅政
  phases:
  - key: brewing
    name_zh: 遭际国变
    labels:
