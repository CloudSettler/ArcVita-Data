person:
  qid: guji-孟皇后
  name_zh: 昭慈圣献孟皇后
  names:
    zh: 孟皇后
    en: Empress Meng
  lifespan:
    birth:
      date: '1077'
      precision: year
      is_circa: true
      raw: 绍兴五年四月崩，年五十九
    death:
      date: 1135-05
      precision: month
      is_circa: false
      raw: 绍兴五年四月崩于行宫之西殿
  birth_date: 约1077年
  death_date: 1135年4月
  era: 北宋末至南宋初
  reign_ref: 哲宗皇后、宋高宗朝元祐/隆祐太后
  archetype: 逆境辅政的贤后
  dilemmas:
  - 身为哲宗皇后因宫闱构陷被废，靖康之后独存于六宫，是否以废后之身垂帘听政
  - 苗傅、刘正彦兵变逼立幼子，以妇人身听政如何拒立三岁皇子以安天下
  lesson: 时局倾覆之际，德行与担当胜于名位；废立不能掩天下之公论
  summary_first_person: 我出身世家，十六岁入宫，元祐七年册为哲宗皇后，却因宫闱构陷两度被废。靖康之难后六宫尽北迁，唯我独存，被迫垂帘听政，迎立高宗、平定苗刘之变。我一生节俭谦谨，不徇私恩，临终犹念国史未正。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷243
