events:
- id: guji-宋孝宗-event-birth
  year_of: 1127
  date: '1127-10-27'
  title_zh: 生于秀州青杉闸官舍
  detail: 建炎元年十月戊寅，秀王夫人张氏生帝，红光满室，如日正中；少长命名伯琮
- id: guji-宋孝宗-event-selected
  year_of: 1132
  date: '1132-06-01'
  title_zh: 选育于禁中
  detail: 绍兴二年五月，高宗诏选太祖之后，帝被选育于禁中
- id: guji-宋孝宗-event-heir
  year_of: 1160
  date: '1160-03-01'
  title_zh: 立为皇子，进封建王
  detail: 绍兴三十年二月癸酉立为皇子，更名玮，制授甯国军节度使、开府仪同三司，进封建王
- id: guji-宋孝宗-event-crownprince
  year_of: 1162
  date: '1162-05-01'
  title_zh: 立为皇太子，改名昚
  detail: 绍兴三十二年五月甲子立为皇太子，改名昚；六月甲戌御笔赐字元永
- id: guji-宋孝宗-event-accession
  year_of: 1162
  date: '1162-07-20'
  title_zh: 受内禅即皇帝位
  detail: 高宗内禅，帝推逊再三而后即位，称高宗为太上皇帝，退居德寿宫；戊寅大赦
- id: guji-宋孝宗-event-yuefei
  year_of: 1162
  date: '1162-08-01'
  title_zh: 追复岳飞元官，以礼改葬
  detail: 即位七月己酉，追复岳飞元官，以礼改葬
- id: guji-宋孝宗-event-fuili
  year_of: 1163
  date: '1163-05-18'
  title_zh: 符离之溃
  detail: 李显忠、邵宏渊军大溃于符离，北伐受挫，震动朝野
- id: guji-宋孝宗-event-zuiji
  year_of: 1163
  date: '1163-06-27'
  title_zh: 下诏罪己
  detail: 六月癸酉，下诏罪己，张浚降授特进，邵宏渊降武义大夫
- id: guji-宋孝宗-event-zhangjun-death
  year_of: 1164
  date: '1164-08-27'
  title_zh: 张浚薨
  detail: 八月辛巳，主战重臣张浚薨，和议之势遂成
- id: guji-宋孝宗-event-peacetalk
  year_of: 1164
  date: '1164-12-01'
  title_zh: 遣王抃使金议和
  detail: 丙申遣王抃持书如金帅府，请正皇帝号，为叔侄之国，易岁贡为岁币，减十万
