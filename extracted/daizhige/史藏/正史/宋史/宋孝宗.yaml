  birth_date: '1127-10-27'
  death_date: ''
  era: 南宋
  reign_ref: 绍兴、隆兴
  archetype: 中兴英主
  dilemmas:
  - 战与和的抉择：张浚主战、汤思退主和之间的朝堂拉锯
  - 以太祖后裔入继大统而面对传承合法性与孝道双重责任
  lesson: 大位不可轻承，中兴须先用人，胜负在人不在虚名。
  summary_first_person: 我赵昚，字元永，太祖七世孙，建炎元年生于秀州，绍兴二年入育禁中，历封建国公、普安郡王，三十年立为皇子，三十二年立为皇太子，同年受高宗内禅即位，追复岳飞，锐意恢复，然符离溃后与金议和，开启隆兴和议之路。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷33
