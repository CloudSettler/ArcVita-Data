  - date: 1067-10
    title_zh: 英宗不豫时请两日一御迩英阁讲读
    rationale: 引仁宗故事，以安人心。
events:
- id: guji-宋神宗-event-birth
  date: '1048'
  year_of: 1048
  event_type: birth
  title_zh: 生于濮王宫
  description: 庆历八年四月戊寅生于濮王宫，祥光照室；八月赐名仲针。
  person_id: guji-宋神宗
  era_label_zh: 庆历八年
- id: guji-宋神宗-event-crown-prince
  date: 1066-12
  year_of: 1066
  event_type: appointment
  title_zh: 立为皇太子
  description: 治平三年十月英宗不豫，顼请两日一御迩英阁讲读以安人心；十二月壬寅立为皇太子。
  person_id: guji-宋神宗
  era_label_zh: 治平三年
- id: guji-宋神宗-event-accession
  date: 1067-01
  year_of: 1067
  event_type: accession
  title_zh: 英宗崩，即皇帝位
  description: 治平四年正月丁巳英宗崩，帝即位，大赦天下，遣使告哀于辽。
  person_id: guji-宋神宗
  era_label_zh: 治平四年
- id: guji-宋神宗-event-bureaucracy-reform
  date: 1067-09
  year_of: 1067
  event_type: policy
  title_zh: 诏求直言、改中书画旨选知州
  description: 闰三月诏求直言；重要州军知州通判选并从中书，毋以恩例奏授，又诏减逃田税额。
  person_id: guji-宋神宗
  era_label_zh: 治平四年
- id: guji-宋神宗-event-tong-jian-preface
  date: 1067-10
  year_of: 1067
  event_type: honor
  title_zh: 制《资治通鉴序》赐司马光
  description: 十月甲寅，帝亲制《资治通鉴序》赐司马光。
  person_id: guji-宋神宗
  era_label_zh: 治平四年
- id: guji-宋神宗-event-wanganzhi-audience
  date: 1068-04
  year_of: 1068
  event_type: meeting
  title_zh: 翰林学士王安石越次入对
  description: 熙宁元年夏四月乙巳，诏翰林学士王安石越次入对。
  person_id: guji-宋神宗
  era_label_zh: 熙宁元年
- id: guji-宋神宗-event-newlaws
  date: 1069-02
  year_of: 1069
  event_type: policy
  title_zh: 创置三司条例，议行新法
  description: 以王安石参知政事；甲子，陈升之、王安石创置三司条例，其后立均输、常平给敛法，颁《农田水利约束》。
  person_id: guji-宋神宗
  era_label_zh: 熙宁二年
- id: guji-宋神宗-event-disaster-relief
  date: 1068-01
  year_of: 1068
  event_type: relief
  title_zh: 以旱减囚释杖、掩暴骸
  description: 熙宁元年正月日食，以旱减天下囚罪一等，杖以下释之；令州县掩暴骸，增太学生百人。
  person_id: guji-宋神宗
  era_label_zh: 熙宁元年
- id: guji-宋神宗-event-fubi-ousted
  date: 1069-10
  year_of: 1069
  event_type: dismissal
  title_zh: 富弼罢判亳州，新法党争起
  description: 熙宁二年十月丙申，富弼以论新法不合罢为武宁军节度使、判亳州；曾公亮、陈升之并同中书门下平章事。
  person_id: guji-宋神宗
  era_label_zh: 熙宁二年
- id: guji-宋神宗-event-death
  date: '1085'
  year_of: 1085
  event_type: death
  title_zh: 崩（本卷未载）
  description: 《宋史》卷十四本纪止于熙宁二年，据通行纪年补记元丰八年崩。
  person_id: guji-宋神宗
  era_label_zh: 元丰八年
