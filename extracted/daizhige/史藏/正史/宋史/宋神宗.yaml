person:
  qid: guji-宋神宗
  name_zh: 赵顼
  names:
    zh: 宋神宗·赵顼（初名仲针）
    en: Song Shenzong (Zhao Xu)
  lifespan:
    birth:
      date: '1048'
      precision: year
      is_circa: false
      raw: 庆历八年四月戊寅生于濮王宫
    death:
      date: '1085'
      precision: year
      is_circa: false
      raw: （本卷未载，据通行纪年）
  birth_date: '1048'
  death_date: '1085'
  era: 北宋
  reign_ref: 治平四年（1067）即位，先后用治平、熙宁、元丰年号
  archetype: 励志变法的少年天子
  dilemmas:
  - 信用王安石推行新法与朝中旧臣、台谏交攻之间的两难
  - 灾异频仍、人心不安与志在法祖强国之间的张力
  lesson: 锐意求治，敢用新人行新法，然变法之路众谤交加，须以定力与听谏相济。
  summary_first_person: 只有天性好学、动止有常的我，于英宗晏驾后 twenties 即位，日夜忧勤。感于国用不足、积弊已深，我越次召对王安石，创置三司条例，立均输、常平、农田水利诸法，虽台谏力争、重臣求去，我志在法祖强国，未尝回挠。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷14
