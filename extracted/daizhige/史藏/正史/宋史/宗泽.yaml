  dilemmas:
  - 力主高宗还都汴京以固恢复之志，而朝廷屡不纳
  - 以孤留守东京，屡破金兵，但孤立无援，忧愤成疾
  lesson: 坚守阵地、至死不渝的忠诚与坚持，即便与朝廷策略相左。
  summary_first_person: 我宗泽以东京留守之职坚守汴京，建炎二年多次击退金人进犯，又招抚河北杨进等流寇来降；我屡表请帝还阙，志在恢复中原，然朝廷不用。金兵渡河之际，我愤懑成疾，于建炎二年秋薨于任上。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷25
