person:
  qid: guji-尹洙
  name_zh: 尹洙
  names:
    zh: 尹洙
    en: Yin Zhu
  lifespan:
    birth:
      date: 1001
      precision: year
      is_circa: true
      raw: 年四十七卒，卒年不详确切生年，依卒年倒推
    death:
      date: 1047
      precision: year
      is_circa: false
      raw: 感疾，卒于南阳，年四十七
  birth_date: 1001
  death_date: 1047
  era: 北宋
  reign_ref: 宋仁宗
  archetype: 直言敢谏的边防军政文臣
  dilemmas:
  - 范仲淹以朋党被贬，尹洙自认同党而宁可获罪去职
  - 水洛城之争中违抗上司郑戬令而擅械刘沪，终致贬官
  lesson: 直道事人，宁因义兼师友而同罪，不苟免于朋党之禁。
  summary_first_person: 我是尹洙，字师鲁，河南人。我以儒学进身，因声援范仲淹而落职，后历西北边职，论兵甚深，作《叙燕》《息戍》诸篇；因水洛城事与刘沪相争，又坐假公使钱获罪，贬死南阳，年四十七。我与穆修共振古文，文章简而有法。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷295
endeavors:
- id: guji-尹洙-endeavor-1
  name_zh: 仕宦与直言进谏
  phases:
  - key: brewing
    name_zh: 科举入仕
    labels:
      zh: 举进士、历州县
    start_date: 1020
    highlight_event_id: guji-尹洙-event-jinshi
  - key: breakthrough
    name_zh: 馆阁直言
    labels:
      zh: 校勘、声援范仲淹
    start_date: 1035
    highlight_event_id: guji-尹洙-event-pengdang
  - key: climax
    name_zh: 陕西幕府与上疏论政
    labels:
      zh: 经略判官、论兵上奏
    start_date: 1040
    highlight_event_id: guji-尹洙-event-sanshu
  - key: closure
    name_zh: 外任与贬谪
    labels:
      zh: 知渭州、水洛之争、贬崇信军
    start_date: 1043
    highlight_event_id: guji-尹洙-event-shuiluo
  decisions:
  - date: 1035
    title_zh: 上奏自认为范仲淹之党
    rationale: 仲淹忠亮有素，义兼师友，不可苟免。
  - date: 1041
    title_zh: 奏上三弊之疏（命令数更、恩宠过滥、赐予不节）
    rationale: 愿陛下先正于内以正于外，远法汉主不讳危乱所以存。
- id: guji-尹洙-endeavor-2
  name_zh: 边防兵制论述与古文振起
  phases:
  - key: brewing
    name_zh: 西北久安虑武备
    labels:
      zh: 作《叙燕》《息戍》
    start_date: 1030
    highlight_event_id: guji-尹洙-event-xuyan
  - key: breakthrough
    name_zh: 论兵西北
    labels:
      zh: 上疏论兵、鬻爵令
    start_date: 1040
    highlight_event_id: guji-尹洙-event-lunbing
  - key: climax
    name_zh: 古文振起
    labels:
      zh: 与穆修复振古文
    start_date: 1030
    highlight_event_id: guji-尹洙-event-guwen
  - key: closure
    name_zh: 忠义表章
    labels:
      zh: 作《悯忠》《辨诬》
    start_date: 1041
    highlight_event_id: guji-尹洙-event-minzhong
  decisions:
  - date: 1040
    title_zh: 上《叙燕》《息戍》等九篇杂议
    rationale: 武备不可弛，兵分则尽其利，训土兵代戍卒以减边费。
  - date: 1041
    title_zh: 发庆州刘政锐卒赴镇戎军救援
    rationale: 好水川任福败，须驰援边关。
events:
- id: guji-尹洙-event-birth
  event_type: birth
  date: 1001
  year_of: 1001
  description_zh: 尹洙生于河南，少与兄尹源以儒学知名。
- id: guji-尹洙-event-death
  event_type: death
  date: 1047
  year_of: 1047
  description_zh: 徙监均州酒税，感疾，沿牒至南阳访医，卒，年四十七。
- id: guji-尹洙-event-jinshi
  event_type: career
  date: 1020
  year_of: 1020
  description_zh: 举进士，调正平县主簿，历河南府户曹参军、知光泽县，举书判拔萃。
- id: guji-尹洙-event-pengdang
  event_type: career
  date: 1035
  year_of: 1035
  description_zh: 范仲淹贬，敕榜朝堂戒百官为朋党；尹洙上奏自称仲淹之党，不可苟免，落馆阁校勘，监唐州酒税。
- id: guji-尹洙-event-xuyan
  event_type: career
  date: 1030
  year_of: 1030
  description_zh: 西北久安，作《叙燕》《息戍》二篇，论武备不可弛，又上《杂议》九篇。
- id: guji-尹洙-event-lunbing
  event_type: career
  date: 1040
  year_of: 1040
  description_zh: 赵元昊反，辟为经略判官，数上疏论兵，请减并栅垒、召募土兵、省骑军增步卒。
- id: guji-尹洙-event-sanshu
  event_type: career
  date: 1041
  year_of: 1041
  description_zh: 奏陈命令数更、恩宠过滥、赐予不节三弊，仁宗嘉纳之；帝取攻策，以为集贤校理。
- id: guji-尹洙-event-haoshuichuan
  event_type: career
  date: 1041
  year_of: 1041
  description_zh: 好水川之败，大发庆州部将刘政锐卒数千赴镇戎军救援；被奏擅发兵，降通判濠州。
- id: guji-尹洙-event-minzhong
  event_type: career
  date: 1041
  year_of: 1041
  description_zh: 悯耿傅以文吏死于行阵且为时所诬，作《悯忠》《辨诬》二篇。
- id: guji-尹洙-event-shuiluo
  event_type: career
  date: 1043
  year_of: 1043
  description_zh: 以右司谏知渭州，反对城水洛，遣人召刘沪不至，谕狄青械沪下吏，郑戬论奏不已，徙庆州而城水洛。
- id: guji-尹洙-event-baguan
  event_type: career
  date: 1045
  year_of: 1045
  description_zh: 御史刘湜就鞫，坐假公使钱偿孙用贷息，贬崇信军节度副使，天下莫不以为文致之。
- id: guji-尹洙-event-guwen
  event_type: achievement
  date: 1030
  year_of: 1030
  description_zh: 自唐末文格卑弱，柳开倡古文，洙与穆修复振起之，为文简而有法，有集二十七卷。
- id: guji-尹洙-event-zhuifu
  event_type: recognition
  date: 1056
  year_of: 1056
  description_zh: 嘉祐中，宰相韩琦为洙言于朝，追复故官，并官其子尹构。
