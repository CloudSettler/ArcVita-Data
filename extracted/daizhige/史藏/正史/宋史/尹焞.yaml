  archetype: 笃行守道的理学家
  dilemmas:
  - 应举干禄不佳，辞举以守道养母
  - 不肯事后，被宋高宗征召，后又以年迈自请致仕
  lesson: 笃行终身，不为干禄而改志
  summary_first_person: 我师事程颐，终身不应科举。靖康之难，洛阳境陷，我阖门被害，得以幸免。刘豫伪齐以礼金胁迫不出仕，自商州奔蜀。绍兴初年被宋高宗征为经筵讲官，上疏反对同金议和，与秦桧书力争，终不得报，固辞新命而致仕。
  source_urls:
  - 宋史卷四百二十八
