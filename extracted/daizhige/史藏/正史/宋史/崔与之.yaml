person:
  qid: guji-崔与之
  name_zh: 崔与之
  names:
    zh: 崔与之
    en: Cui Yuzhi
  lifespan:
    birth:
      date: '1158'
      precision: year
      is_circa: true
      raw: 薨时年八十有二（嘉熙三年卒）
    death:
      date: '1239'
      precision: year
      is_circa: false
      raw: 嘉熙三年
  birth_date: '1158'
  death_date: '1239'
  era: 南宋
  reign_ref: 宁宗、理宗朝
  archetype: 儒臣能吏·边帅贤相
  dilemmas:
  - 议和与战守之抉择：金人入境，宰相连书促和，与之以「彼方得势，和必遭屈辱」力拒。
  - 用人之辨：以忠实与才具权衡君子小人，直言独断偏听之弊。
  - 外兵内召之忧：李全来归，预判「召外兵以集事者必有后忧」。
  lesson: 开诚布公、忠实为本，方能立军政、安边民；偏听独断，则权柄潜移。
  summary_first_person: 我崔与之，绍熙四年由太学举进士，广人取科第自我始。历州县狱讼、淮东扬守、帅蜀安边，皆以清简忠实为任。金人叩边，我力主守战而寝和议；蜀中凋敝，我立军政、宽马政、荐真才。晚年屡辞参政右相之命，广州摧锋军之乱，我肩舆登城而众释甲。薨年八十二，谥清献。
  source_urls:
  - 宋史卷四百零六
