  archetype: 能吏直臣、边帅宰相
  dilemmas:
  - 直言论事屡遭贬斥，与恪守体制之间的张力
  - 西北边防与宋夏和议之取舍
  - 力保狄青专任而抵制文臣掣肘
  lesson: 晓律令、长吏事，持法深峭而治民惠爱，边臣当知战守与招怀之机变。
  summary_first_person: 我是庞籍，字醇之，起家进士，以敢言称"天子御史"，历御史、陕西边帅， integr偏安排狄青筑砦屯田、经略对夏议和，官至同平章事，晚年因事屡罢，以太子太保致仕，封颍国公，谥庄敏。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷311
