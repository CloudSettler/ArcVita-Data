  - date: ''
    title_zh: 密疏请择宗室贤者为皇子
    rationale: 仁宗不豫，其言甚切，以安国本
events:
- id: guji-pangji-event-birth
  kind: birth
  date: ''
  year_of: ''
  place: 单州成武
  description: 庞籍生于单州成武。
- id: guji-pangji-event-death
  kind: death
  date: ''
  year_of: ''
  place: ''
  description: 薨，年七十六，赠司空，加侍中，谥庄敏。以仁宗不豫，废朝、临奠皆不果。
- id: guji-pangji-event-career-1
  kind: career
  date: ''
  year_of: ''
  place: 黄州
  description: 及进士第，为黄州司理参军，知州夏竦以为有宰相器。
- id: guji-pangji-event-career-2
  kind: career
  event_tags:
  - 直言
  - 御史
  date: ''
  year_of: ''
  place: 开封
  description: 召为殿中侍御史，请燔垂帘仪制，劾尚美人遣内侍称教旨，孔道辅称其为"天子御史"。
- id: guji-pangji-event-career-3
  kind: career
  event_tags:
  - 边帅
  date: ''
  year_of: ''
  place: 陕西
  description: 元昊反，为陕西体量安抚使；进龙图阁直学士、知延州，兼鄜延都总管、经略安抚缘边招讨使。
- id: guji-pangji-event-career-4
  kind: career
  event_tags:
  - 筑城
  - 屯田
  date: ''
  year_of: ''
  place: 延州
  description: 遣狄青筑招安砦于桥子谷旁，募民耕种以赡军；周美取承平砦，王信筑龙安砦，悉复所亡地，筑十一城。
- id: guji-pangji-event-career-5
  kind: career
  event_tags:
  - 议和
  date: ''
  year_of: ''
  place: 延州
  description: 元昊求和，使者贺从勖称男不称臣，籍送使者赴阙并陈便宜，朝廷采其策，元昊既臣。
- id: guji-pangji-event-career-6
  kind: career
  event_tags:
  - 财政
  date: ''
  year_of: ''
  place: 开封
  description: 自陕西用兵公私俱困，请并省官属、退近塞之兵就食内地，颇省边费。
- id: guji-pangji-event-career-7
  kind: career
  event_tags:
  - 宰相
  date: ''
  year_of: ''
  place: 开封
  description: 拜工部侍郎、枢密使，迁户部，拜同中书门下平章事、昭文馆大学士、监修国史。
- id: guji-pangji-event-career-8
  kind: career
  event_tags:
  - 军事决策
  date: ''
  year_of: ''
  place: 开封
  description: 侬智高反，力主遣狄青专任宣抚使，诏岭南诸军皆受青节度，既而捷书至，帝曰"青破贼，卿之力也"。
