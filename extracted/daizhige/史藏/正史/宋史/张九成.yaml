  birth_date: 1092
  death_date: 1159
  era: 南宋
  reign_ref: 绍兴
  archetype: 直言敢谏的理学家与孤傲士人
  dilemmas:
  - 拒绝权贵引荐而坚守节操，还是借机入仕飞黄腾达
  - 反对屈膝和议而触怒秦桧遭谪，还是委曲求全保官位
  lesson: 未有枉己而能直人——立身刚大，不因得丧屈志
  summary_first_person: 我张九成，字子韶，先世开封人，后徙钱塘。师事杨时，绍兴二年廷对直言，力陈金有必亡、宋有必兴之理，擢置首选。为官恤刑平反，不肯苟取；金人议和之际，我坚决主张敌情多诈、不可轻易苟安，遂遭秦桧忌恨，谪守邵州，又谪居南安军十四年，倚立庭砖读书，双趺隐然。桧死后起知温州，痛陈督粮之弊，乞祠归，数月病卒。谥文忠，封崇国公。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷374
