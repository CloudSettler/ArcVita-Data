    en: Zhang Shiye
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: 1127
      precision: year
      is_circa: false
      raw: 靖康二年卒于白沟，年六十三（由约1064推得）
  birth_date: ''
  death_date: 1127
  era: 北宋
  reign_ref: 宋徽宗、宋钦宗
  archetype: 死节武臣
  dilemmas:
  - 勤王入卫而诸道无赴援，孤军对抗金兵
  - 反对割三镇议和，主张死守社稷
  - 金人议立异姓，宁死不从
  lesson: 国难当头，力战死节，过界河而绝食殉国
  summary_first_person: 我本将门之后，少年喜谈兵事，献策建西安州以除羌患，伏击宋江，智退山东群盗。金人南下，我自将三万人入卫京师，力战四日，身被创伤犹父子力战。城陷后我叩马死谏，金人议立异姓，我谓孙傅今日之事有死而已，被掳北去，过界河时仰天大呼，绝食而卒，谥忠文。
  source_urls:
  - 宋史卷三百五十三·张叔夜传
