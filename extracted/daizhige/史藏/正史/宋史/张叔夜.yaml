events:
- id: guji-张叔夜-event-birth
  date: ''
  year_of: ''
  title_zh: 张叔夜生
  type: birth
  description: 生年史无明载，卒于1127年年六十三，推约1064年（约）生
- id: guji-张叔夜-event-death
  date: 1127
  year_of: 1127
  title_zh: 张叔夜殉国于白沟
  type: death
  description: 被掳北行，道中不食粟唯饮汤，至白沟过界河，仰天大呼，次日卒，年六十三，谥忠文
- id: guji-张叔夜-event-2
  date: ''
  year_of: ''
  title_zh: 按大都形势建西安州
  type: endeavor
  description: 知兰州录事参军时，按羌人点集之要地大都的形势，画攻取之策，建成西安州，自是兰州无羌患
- id: guji-张叔夜-event-3
  date: ''
  year_of: ''
  title_zh: 海州伏兵擒宋江
  type: endeavor
  description: 知海州时宋江起河朔转略十郡，叔夜使间者觇向，募死士千人设伏，举火焚其舟，伏兵乘之，擒其副贼，江乃降，加直学士
- id: guji-张叔夜-event-4
  date: ''
  year_of: ''
  title_zh: 济南乘惰破群盗
  type: endeavor
  description: 徙济南府，山东群盗猝至，叔夜传赦文缓盗三日，会饮谯门示暇，暮发卒五千乘惰击之，追斩数千级，进龙图阁直学士
- id: guji-张叔夜-event-5
  date: 1126
  year_of: 1126
  title_zh: 靖康改元上章乞兵
  type: endeavor
  description: 金人南下，再上章乞假骑兵与诸将并力断其归路，不报，徙邓州，四道置帅领南道都总管
- id: guji-张叔夜-event-6
  date: 1126-11
  year_of: 1126
  title_zh: 自将中军率三万人入卫
  type: endeavor
  description: 钦宗手札趣入卫，叔夜自将中军，子伯奋将前军，仲熊将后军，合三万人，至尉氏遇金游兵转战而前，晦日至都，帝御南薰门见之，军容甚整
- id: guji-张叔夜-event-7
  date: 1126-12
  year_of: 1126
  title_zh: 签书枢密院连战金兵
  type: endeavor
  description: 陈兵玉津园铠甲光明，进资政殿学士，以兵入城，俄签书枢密院，连四日与金人大战，斩其金环贵将二人
- id: guji-张叔夜-event-8
  date: 1127
  year_of: 1127
  title_zh: 城陷叩马谏帝
  type: endeavor
  description: 城陷被创犹父子力战；车驾再出郊，因起居叩马而谏，号恸再拜，帝回首字之曰嵇仲努力
- id: guji-张叔夜-event-9
  date: 1127
  year_of: 1127
  title_zh: 抗请立太子被掳北去殉节
  type: endeavor
  description: 金人议立异姓，谓孙傅今日之事有死而已，移书二帅请立太子，抗请如初，遂从以北，过白沟界河仰天大呼，绝食而卒
