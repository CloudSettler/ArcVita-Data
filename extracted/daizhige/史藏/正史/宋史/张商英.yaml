  name_zh: 张商英
  names:
    zh: 张商英
    en: Zhang Shangying
  lifespan:
    birth:
      date: '1043'
      precision: year
      is_circa: true
      raw: 享年七十九，宣和三年卒推
    death:
      date: '1121'
      precision: year
      is_circa: false
      raw: 宣和三年卒
  birth_date: '1043'
  death_date: '1121-12-31'
  era: 北宋
  reign_ref: 宋徽宗、宋神宗、宋哲宗
  archetype: 变法派政治家与改革宰相
  dilemmas:
  - 既附蔡京又力诋蔡京，反复于新旧党争之间
  - 意广才疏，公坐诵言，先泄其谋，为政敌所乘
  lesson: 立场多变者虽有革新之志，终易为党争与羽翼之失所毁
  summary_first_person: 我张商英，字天觉，蜀州新津人。早年以辩才折服章惇，为王安石所召；一生浮沉于新旧党争，仕至尚书右仆射。为相时革除蔡京弊政、行钞法、宽民力，终因交结僧客、遭何执中郑居中排挤而贬死，赠太保，谥文忠。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷351
