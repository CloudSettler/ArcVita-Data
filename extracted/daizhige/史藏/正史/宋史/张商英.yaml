events:
- id: guji-张商英-event-birth
  date: '1043'
  year_of: 1043
  type: birth
- id: guji-张商英-event-yuzhou
  date: '1073'
  year_of: 1073
  type: endeavor
  title_zh: 说降渝州蛮酋、知南川县并抗章惇为上客
  summary: 章惇经制夔夷，商英着道士服长揖就座，随机折之，落落出其上，惇大喜延为上客。
- id: guji-张商英-event-jiancha
  date: '1076'
  year_of: 1076
  type: endeavor
  title_zh: 荐于王安石召对，擢监察御史，因语侵枢臣责监荆南税
  summary: 曾谏收还台狱主柄，又摭刘奉世徇私十二事，文彦博等求去，遂责监荆南税。
- id: guji-张商英-event-shaosheng
  date: '1094'
  year_of: 1094
  type: endeavor
  title_zh: 哲宗亲政召为谏官，疏攻司马光吕公著诸人
  summary: 极力攻元祐大臣，乞追夺赠谥、仆碑毁冢，以险语激怒当世。
- id: guji-张商英-event-gaijiang
  date: '1096'
  year_of: 1096
  type: endeavor
  title_zh: 欲倾安焘助章惇，事发贬监江宁酒
  summary: 与阳翟盖氏养子交关事露，哲宗不直商英，责监江宁酒。
- id: guji-张商英-event-dangji
  date: '1103'
  year_of: 1103
  type: endeavor
  title_zh: 诋蔡京遭斥，罢知亳州入元祐党籍
  summary: 御史取其《元祐嘉禾颂》及祭司马光文斥其反复，罢知亳州，入元祐党籍。
- id: guji-张商英-event-hangzhou
  date: '1110'
  year_of: 1110
  type: endeavor
  title_zh: 大观四年京再逐，起知杭州，赐对留为资政殿学士
  summary: 奏言法若有弊不可不变但不失其意，寻除中书侍郎。
- id: guji-张商英-event-xiang
  date: '1110'
  year_of: 1110
  type: endeavor
  title_zh: 拜尚书右仆射，慧星不见明日雨，徽宗大书商霖赐之
  summary: 徽宗因人望相之，登相位是夕彗不见，明日雨，帝赐商霖二字。
- id: guji-张商英-event-gemin
  date: '1110'
  year_of: 1110
  type: endeavor
  title_zh: 革蔡京弊政：改当十钱、复转般仓、行钞法、蠲横敛
  summary: 为政持平，劝帝节华侈息土木抑侥幸，帝颇严惮之。
- id: guji-张商英-event-hengzhou
  date: '1111'
  year_of: 1111
  type: endeavor
  title_zh: 事觉被鞫，中丞张克公疏击，贬崇信军节度副使衡州安置
  summary: 何执中郑居中酿织其短，因僧德洪客彭几语觉事觉，旋贬衡州。
- id: guji-张商英-event-death
  date: '1121'
  year_of: 1121
  type: death
  title_zh: 宣和三年卒，赠少保
  summary: 未几还故官职，宣和三年卒年七十九；后赐谥文忠，靖康中赠太保。
