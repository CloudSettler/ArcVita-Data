events:
- id: guji-张方平-event-birth
  type: birth
  date: '1007'
  year_of: 1007
  description: 张方平约生于岁，字安道，南京人。少颍悟绝伦，家贫无书，从人假三史，旬日即归。
- id: guji-张方平-event-keju
  type: career
  date: '1030'
  year_of: 1030
  description: 举茂材异等，为校书郎、知崑山县；又中贤良方正，迁著作佐郎、通判睦州。
- id: guji-张方平-event-yuanyao-strategy
  type: career
  date: '1040'
  year_of: 1040
  description: 赵元昊嫚书且叛，方平请顺适其意以缓其发，乘间选将厉士、坚城除器，以全制其后。
- id: guji-张方平-event-pingrong
  type: career
  date: '1040'
  year_of: 1040
  description: 上《平戎十策》，请屯兵河东卷甲趋延渭，攻其所必救；宰相吕夷简善其策而不果行。命直集贤院，俄知谏院。
- id: guji-张方平-event-he-shumi
  type: career
  date: '1041'
  year_of: 1041
  description: 夏人寇边，首乞合枢密之职于中书以通谋议，帝然之，遂以宰相兼枢密使；调刺宣毅、保捷军，连疏争之弗听，后果如其言。
- id: guji-张方平-event-he-xia-song
  type: career
  date: '1042'
  year_of: 1042
  description: 劾罢夏竦陕西节制之权，请四路帅臣各自任战守。
- id: guji-张方平-event-yuanhao-submit
  type: career
  date: '1043'
  year_of: 1043
  description: 请因郊赦引咎示信，开元昊自新之路；改庆历赦书，敕边吏通其善意，元昊竟降。
- id: guji-张方平-event-qidan-envoy
  type: career
  date: '1043'
  year_of: 1043
  description: 以修起居注使契丹，契丹主称赏，酌玉卮饮之，赠以所乘马；还知制诰，权知开封府。
- id: guji-张方平-event-liyuanhao-qidan
  type: career
  date: '1044'
  year_of: 1044
  description: 元昊既臣而与契丹有隙，来请绝其使；方平言得小羌失强敌非计，宜赐诏使之审处，时韪其谋。进翰林学士。
- id: guji-张方平-event-salt
  type: career
  date: '1047'
  year_of: 1047
  description: 拜御史中丞，改三司使；王拱辰议榷河北盐，方平以两税盐钱已成再榷，帝惊悟，请直降手诏罢之，河朔父老为佛老会七日以报。
- id: guji-张方平-event-guifei-noyi
  type: career
  date: '1048'
  year_of: 1048
  description: 禁中卫卒夜变，夏竦倡言尊异张贵妃，方平谓陈执中引汉冯婕妤事止之，执中瞿然而罢。
- id: guji-张方平-event-caili-duice
  type: career
  date: '1050'
  year_of: 1050
  description: 帝以丰财省费访群臣，方平条对又独上数千言，论祥符以来姑息渐失祖宗之旧；会坐杨仪交好，出知滁州。
- id: guji-张方平-event-yizhou
  type: career
  date: '1053'
  year_of: 1053
  description: 徙守益州，识破侬智高入寇之谣，遣还戍卒、罢诸役，上元张灯城门三夕不闭，诛造语者，蜀人遂安。
- id: guji-张方平-event-shu-hengfu
  type: career
  date: '1054'
  year_of: 1054
  description: 复以三司使召，为西鄙用兵所累之两蜀奏免横赋四十万，减铸铁钱十余万缗。
- id: guji-张方平-event-bian-caoyun
  type: career
  date: '1056'
  year_of: 1056
  description: 迁尚书左丞，上疏论汴河漕运为国计大本，画上十四策；富弼读之漏尽十刻，帝称善，悉如其说行之。
- id: guji-张方平-event-qinzhou
  type: career
  date: '1058'
  year_of: 1058
  description: 以工部尚书帅秦州，谍告夏人将压境，料简士马声言出塞，寇不至；曾公亮力辨非轻举，方平不自安，请知南京。
- id: guji-张方平-event-yingzong-furao
  type: career
  date: '1063'
  year_of: 1063
  description: 神宗立
  event_id: guji-张方平-event-yingzong-furao
- id: guji-张方平-event-yingzong-shuma
  type: career
  date: '1065'
  year_of: 1065
  description: 英宗不豫，召方平至福宁殿进笔请书，追令书「明日降诏立皇太子」，方平抗声请书颍王名，帝力疾书之，乃退草制。
- id: guji-张方平-event-shanling-fei
  type: career
  date: '1067'
  year_of: 1067
  description: 神宗即位召见，请约山陵费、减锡赉以干兴为准，费省什七八；进诏草，帝亲批称其文章典雅有三代风。
- id: guji-张方平-event-anshi-objection
  type: career
  date: '1069'
  year_of: 1069
  description: 拜参知政事，司马光疏其不当用不听；曾公亮议用王安石，方平以为不可，数日遭父忧去职。
- id: guji-张方平-event-xinfa-sucai
  type: career
  date: '1069'
  year_of: 1069
  description: 安石行新法，方平陛辞极论其害，以覆舟自焚为警，帝怃然。
- id: guji-张方平-event-jingxi-bing
  type: career
  date: '1072'
  year_of: 1072
  description: 韩绛主西师庆卒乱，京西转运使令一路会兵，民大骇；方平持檄不下而奏之，帝命罢诸郡兵。
- id: guji-张方平-event-yurong-answer
  type: career
  date: '1075'
  year_of: 1075
  description: 帝问祖宗御戎之要，对以太祖宽文法于诸将、太宗谋燕蓟而朝廷旰食、真宗澶渊与契丹盟三朝之事，戒疆塲之臣试天下于一掷；帝称旧德。萧禧议疆事卧驿不起，方平教吴充日致馈而檄其国，禧即行。
- id: guji-张方平-event-cimiao
  type: career
  date: '1072'
  year_of: 1072
  description: 新法鬻祠庙，司农并及宋阏伯、微子庙；方平言宋王业所基二祠不得免，帝震怒批「慢神辱国，无甚于斯」，天下祠庙皆得不鬻。
- id: guji-张方平-event-su-shi
  type: career
  date: '1061'
  year_of: 1061
  description: 守益州日得眉山苏洵与其二子轼、辙，深器异之；尝荐轼为谏官，轼下制狱又抗章为请，轼终身敬事之。
- id: guji-张方平-event-retire
  type: career
  date: '1085'
  year_of: 1085
  description: 数请老，以太子少师致仕；官制行独命领宣徽使如故。哲宗立，加太子太保。
- id: guji-张方平-event-death
  type: death
  date: '1091'
  year_of: 1091
  description: 元祐六年薨，年八十五，赠司空；遗令毋请谥，苏辙为请，乃谥曰文定。
