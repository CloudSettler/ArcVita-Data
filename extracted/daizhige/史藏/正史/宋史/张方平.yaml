person:
  qid: guji-张方平
  name_zh: 张方平
  names:
    zh: 张方平
    en: Zhang Fangping
  lifespan:
    birth:
      date: '1007'
      precision: approx
      is_circa: true
      raw: 据薨于元祐六年（1091）年八十五逆推
    death:
      date: '1091'
      precision: year
      is_circa: false
      raw: 元祐六年薨，年八十五
  birth_date: '1007'
  death_date: '1091'
  era: 北宋
  reign_ref: 仁宗、英宗、神宗、哲宗朝
  archetype: 直言敢谏的理财与制诰老臣
  dilemmas:
  - 预言元昊必叛而主张缓兵备边，被讥为姑息
  - 反对王安石新法，与神宗师生之遇与政见相左并存
  lesson: 深谋远虑与守正不阿，虽一时不遂而终为国之所倚
  summary_first_person: 我张方平，字安道，少颍悟绝伦，一阅成诵。西鄙有警，我先请修备缓兵，又上《平戎十策》；历知谏院、翰林学士、三司使、参知政事，议榷盐、通漕运、省山陵之费，皆切国计。安石行新法，我屡极论其害，嶷然不小屈。曾识拔苏洵、苏轼父子于蜀。晚以太子少师致仕，元祐六年薨，谥文定。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷318
