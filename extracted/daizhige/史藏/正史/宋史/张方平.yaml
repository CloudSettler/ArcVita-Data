  - date: '1056'
    title_zh: 画上汴漕十四策
    rationale: 兵恃食，食恃漕运，以汴为主，利尽南海
  - date: '1063'
    title_zh: 请约山陵之费
    rationale: 以干兴为准，遗制以先志行之，可谓孝
