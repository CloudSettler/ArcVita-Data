  reign_ref: 真宗、仁宗时期（具体年号未载，从雷有终讨王均在真宗初年）
  archetype: 循吏·能臣
  dilemmas:
  - 修复捍海堰时众人反对，担心防潮却引入内涝之患；张纶权衡“涛患十九，潦患十一”，坚持兴役
  - 降寇数百据险叛，急击恐生患，谕以向背则可能失机；张纶主张招抚
  lesson: 兴利除害在于权衡利害、敢于任事，且体恤下民，方能成久远之功。
  summary_first_person: 我张纶，字公信，颍州汝阴人。少倜傥任气，举进士不中而入武职，从雷有终平蜀乱，以智谋降贼。后历知辰州、渭州等地，抚谕五溪诸蛮。任江淮制置发运副使时整顿盐课、兴修水利，尤以修复泰州捍海堰为最，复逋户二千六百，州民为立生祠。居淮南六年，所至兴利除害，为人宽恕喜施予，尝市絮襦千数以衣冻馁之漕卒。
  source_urls:
  - 宋史 卷四百二十六 循吏传
