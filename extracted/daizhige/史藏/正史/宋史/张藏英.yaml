events:
- id: guji-张藏英-event-birth
  type: birth
  date: 893
  year_of: 893
  summary: 张藏英约生于893年，涿州范阳人，自称唐相张嘉贞之后。
- id: guji-张藏英-event-family-massacre
  type: career
  date: 909
  year_of: 909
  summary: 唐末，举族为贼孙居道所害，藏英年十七仅以身免。
- id: guji-张藏英-event-stab-market
  type: career
  date: 925
  year_of: 925
  summary: 逢孙居道于豳市场，引佩刀刺之不死，为吏所执，节帅赵德钧壮之释而不问。
- id: guji-张藏英-event-revenge
  type: career
  date: 936
  year_of: 936
  summary: 佪阳关南擒孙居道，缚于父母灵位前鞭而脔其肉，刳心以祭，诣官首服获释，号报讐张孝子。
- id: guji-张藏英-event-qidan-service
  type: career
  date: 930
  year_of: 930
  is_circa: true
  summary: 契丹用张藏英为卢䑓军使兼榷盐制置使，领坊州刺史。
- id: guji-张藏英-event-defect
  type: career
  date: 953
  year_of: 953
  summary: 后周广顺三年，率内外亲属及所部兵千余人、煮盐户七千余口、牛马万计、舟数百艘航海归周，至沧州为刺史李晖以闻。
- id: guji-张藏英-event-defendant-prefect
  type: career
  date: 954
  year_of: 954
  summary: 世宗即位，授德州刺史，旋召归对便殿，询以备边之策。
- id: guji-张藏英-event-fort-liyan
  type: career
  date: 955
  year_of: 955
  is_circa: true
  summary: 领缘边招收都指挥使，筑城李晏口，累月募得劲兵数千人。
- id: guji-张藏英-event-relief-wangyanchao
  type: career
  date: 955
  year_of: 955
  summary: 王彦超巡边为契丹所围，藏英率新募兵驰往击之，转战十余里，契丹解去。
- id: guji-张藏英-event-defeat-gaomohan
  type: career
  date: 956
  year_of: 956
  is_circa: true
  summary: 契丹将高牟翰以精骑数千扰边，藏英逆击于胡卢河北，自旦至晡杀伤甚众，契丹遁去。
- id: guji-张藏英-event-defeat-yaoneibin
  type: career
  date: 958
  year_of: 958
  is_circa: true
  summary: 巡乐寿时契丹骁将姚内斌以精骑二千列阵，藏英率麾下自辰及申殊死战，内斌解去，世宗降玺书褒美。
- id: guji-张藏英-event-waqiao-vanguard
  type: career
  date: 959
  year_of: 959
  summary: 征瓦桥关，为先锋都指挥使，败契丹骑数百于关北，下固安县，改关南排阵使。
- id: guji-张藏英-event-death
  type: death
  date: 962
  year_of: 962
  summary: 宋建隆三年，卒于瀛州治所，年六十九。
