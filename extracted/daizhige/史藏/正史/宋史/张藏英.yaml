person:
  qid: guji-张藏英
  name_zh: 张藏英
  names:
    zh: 张藏英
  lifespan:
    birth:
      date: 893
      precision: year
      is_circa: true
      raw: 卒于962年，年六十九，逆推约生于893年
    death:
      date: 962
      precision: year
      is_circa: false
  birth_date: 893
  death_date: 962
  era: 五代末至宋初
  reign_ref: 后周广顺三年至宋建隆三年
  archetype: 孝烈边将
  dilemmas:
  - 杀孙居道报父母之仇后自诣官首服，面临私刑与国法之两难
  - 仕契丹领榷盐之职后率七千余口航海归周，承受周祖疑虑之风险
  lesson: 复仇之勇可成孝名，归义之心可开新局；藏英以血偿亲仇、以城御北虏，皆见其忠孝兼全。
  summary_first_person: 我乃涿州范阳张藏英，唐相张嘉贞之后。族灭于孙居道之手，我年十七独免，后手刃仇人刳心以祭父母，燕蓟间称我为报讐张孝子。契丹用我为卢䑓军使，广顺三年我率亲属部曲七千余口航海归周。世宗用我置砦李晏口、募劲兵御契丹，破高牟翰、退姚内斌，征瓦桥关为先锋。宋初迁瀛州团练使，建隆三年卒于治所，年六十九。
