person:
  qid: guji-张贵
  name_zh: 张贵
  names:
    zh: 张贵
    en: Zhang Gui
  lifespan:
    death:
      date: ~1272
      precision: year
      is_circa: true
      raw: 襄阳被围期间战死
  era: 南宋末年（宋元之际）
  reign_ref: 宋度宗咸淳年间
  archetype: 死守孤城的忠勇民兵都统
  dilemmas:
  - 明知突围必死，仍决意出郢求援、往返死地
  - 行事泄露后速进冒死与隐匿缓行的抉择
  lesson: 智勇赴义，虽陷重围犹不屈而死，气节可贯金石
  summary_first_person: 我张贵，人称“竹园张”，以骁勇智谋为诸将所服。襄阳被围五年，我受命为都统，率死士乘轻舟乘风破浪、断缆破围，冲过北军舟师百余里，抵达襄阳城下，城中闻救，士气百倍。斩缆冒进之后，我欲还郢求援，遣敢死之士伏水锯桩、持蜡书达郢，约得龙尾洲援兵夹击。不意逃卒泄谋、郢军惊退，龙尾洲反为北兵所据。我力战疲困，身被数十枪，被执不降，遂死。敌舁尸至城下示威，守城者皆哭。吕文焕斩降卒，以我与张顺祔葬，立双庙祀之。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷450
