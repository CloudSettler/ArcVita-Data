  decisions:
  - date: ~1272
    title_zh: 开诚布公告诫死士
    rationale: 出令“此行有死而已”，恐士卒非本心败事，令不愿者速去。
  - date: ~1272
    title_zh: 账下一卒亡去即惊觉事泄，举砲鼓噪连夜发舟
    rationale: 料逃卒必报北军，置之死地而后生，不能衔枚隐迹，遂乘夜顺流断缆破围冒进。
  - date: ~1272
    title_zh: 遣二士伏水持蜡书赴郢求援
    rationale: 欲还郢再拊襄阳之背，约龙尾洲五千援兵夹击北军。
events:
- id: guji-张贵-event-birth
  year_of: ~1235
  date: ~1235
  precision: year
  is_circa: true
  raw: 生年不详
  name_zh: 张贵生
  desc: 张贵生年史无明载，湖北民兵部将，人称“竹园张”。
- id: guji-张贵-event-recruit
  year_of: ~1272
  date: ~1272
  precision: year
  is_circa: true
  raw: 襄阳被围五年后
  name_zh: 受命都统，率死士造舟备战
  desc: 襄阳被围五年，宋人于清泥河造轻舟百艘，重赏募死士三千，得张贵与张顺为都统，俗呼贵为“竹园张”，俱智勇，素为诸将所服。
- id: guji-张贵-event-breakthrough
  year_of: ~1272
  date: ~1272
  precision: year
  is_circa: true
  raw: 汉水方生之夜
  name_zh: 乘夜破围百二十里抵达襄阳
  desc: 贵先登、顺殿后，乘夜举砲鼓噪出江，断铁縆攒杙数百，转战百二十里，黎明抵襄城下，城中踊跃气百倍。
- id: guji-张贵-event-lashu
  year_of: ~1272
  date: ~1272
  precision: year
  is_circa: true
  raw: 既抵襄阳后
  name_zh: 遣死士伏水锯桩，持蜡书赴郢
  desc: 北兵连锁数十里、列撒星桩，二士遇桩即锯断，竟达郢，许发兵五千驻龙尾洲助夹击。
- id: guji-张贵-event-ambush
  year_of: ~1272
  date: ~1272
  precision: year
  is_circa: true
  raw: 出郢东下之夜
  name_zh: 龙尾洲中伏，力战被执
  desc: 东下至勾林滩，望军船举流星火示之，近则皆北兵——郢兵已退屯三十里，北兵据龙尾洲以逸待劳。贵战困，身被数十枪，被执不屈。
- id: guji-张贵-event-death
  year_of: ~1272
  date: ~1272
  precision: year
  is_circa: true
  raw: 龙尾洲败后
  name_zh: 不屈而死，尸舁至襄阳城下
  desc: 贵卒不屈，死之。北军命降卒舁尸至襄，令于城下示威，守陴者皆哭。吕文焕斩四卒，以贵祔葬张顺冢，立双庙祀之。
