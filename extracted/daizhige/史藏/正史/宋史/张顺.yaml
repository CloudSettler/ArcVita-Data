  dilemmas:
  - 襄阳被围五年、援绝，是否冒险轻舟突围入援，明知有死无生
  - 出令「此行有死而已」，遣散非本心者，独留三千死士
  lesson: 知其不可而为之，以一死衔命破重围，虽殁犹为神。
  summary_first_person: 我张顺，人称「矮张」，襄阳被围五年，我以民兵部将受任都统，率轻舟百艘、死士三千，乘风破浪冲破重围，转战百二十里抵襄城下，身中四枪六箭而死，尸浮逆流直抵浮梁，城中立庙祀我。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷450
