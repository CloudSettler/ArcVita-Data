events:
- id: guji-张顺-event-shipbuilding
  year_of: 1271
  date: '1271'
  date_precision: year
  title_zh: 于清泥河造轻舟百艘，三舟联为一舫
  desc_zh: 张顺知襄阳西北清泥河源于均、房，即其地造轻舟百艘，中舟装载，左右舟虚底掩覆。
  type: endeavor
- id: guji-张顺-event-recruit
  year_of: 1271
  date: '1271'
  date_precision: year
  title_zh: 出重赏募死士三千，张顺受任都统
  desc_zh: 重赏募得死士三千，求将得张顺与张贵，俗呼顺曰「矮张」，俱智勇，拜为都统，申令「此行有死而已」。
  type: endeavor
- id: guji-张顺-event-breakthrough
  year_of: 1272
  date: '1272'
  date_precision: year
  title_zh: 起矴出江乘风破浪，转战百二十里抵襄城下
  desc_zh: 汉水方生，夜漏下三刻以红灯为识，贵先登、顺殿后，旤断铁縆攒杙数百，黎明抵襄城下，城中踊跃气百倍。
  type: endeavor
- id: guji-张顺-event-death
  year_of: 1272
  date: '1272'
  date_precision: year
  title_zh: 殿后陈亡，身中四枪六箭，浮尸直抵浮梁
  desc_zh: 收军独失顺，数日后有浮尸被介胄执弓矢溯流直抵浮梁，视之顺也，身中四枪六箭，怒气勃勃如生，诸军惊以为神，结冢敛葬立庙祀之。
  type: endeavor
