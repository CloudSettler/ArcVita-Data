    title_zh: 于清泥河造轻舟百艘，出重赏募死士三千
    rationale: 襄阳被围五年，西北清泥河源出均房，可由此水路突入；不惜重赏，惟求死士。
  - date: '1272'
    title_zh: 受任都统，申令「此行有死而已」，遣散非本心之人
