  - date: '1065-01-01'
    title_zh: 举进士第一后历州军幕职
    rationale: 以科名入仕，遍历保信、武安、潭州之任。
  - date: '1072-01-01'
    title_zh: 邓绾举为御史，拒不应召
    rationale: 不肯因缘幸进，及绾失举自列，神宗乃用我为监察御史里行。
