person:
  qid: guji-彭汝砺
  name_zh: 彭汝砺
  names:
    zh: 彭汝砺
    en: Peng Ruli
  lifespan:
    birth:
      date: '1042-01-01'
      precision: year
      is_circa: true
      raw: 约1042年（卒年五十四，约推）
    death:
      date: '1095-01-01'
      precision: year
      is_circa: true
      raw: 约1095年（卒年五十四）
  birth_date: '1042-01-01'
  death_date: '1095-01-01'
  era: 北宋
  reign_ref:
  - 神宗
  - 哲宗
  archetype: 风骨直臣
  dilemmas:
  - 蔡确谪词草制事件：草词还是封还除目
  - 党争中坚持就事论事，两头受挤
  lesson: 制度之上有良知，草词之权可封还，直道不因左右风向改易。
  summary_first_person: 我彭汝砺以进士第一入仕，一生居官必尽诚敬：当台谏则直言理财、青苗、盐事诸弊，神宗折我于廷，我拱立不动而复言；蔡确诗案起，人人罗织，我封还除目、辩论愈切，为之落职而不悔。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷346
