  - date: '1094-01-01'
    title_zh: 封还蔡确谪命除目草词
    rationale: 我不出，谁任其责——不肯以罗织之行成于我笔。
  - date: '1094-06-01'
    title_zh: 落职知徐州
    rationale: 谏官指我为朋党，我实为朝廷论事，甘受贬斥。
events:
- id: guji-彭汝砺-event-birth
  person: guji-彭汝砺
  date: '1042-01-01'
  year_of: 1042
  is_circa: true
  title_zh: 彭汝砺生
  description: 饶州鄱阳人，字器资，生年以卒年五十四推约。
  significance_zh: 北宋直臣纪年起点。
- id: guji-彭汝砺-event-jinshi
  person: guji-彭汝砺
  date: '1065-01-01'
  year_of: 1065
  title_zh: 治平二年举进士第一
  description: 状元及第，历保信军推官、武安军掌书记、潭州军事推官。
  significance_zh: 科举取二甲之首，奠定宦途与清望。
- id: guji-彭汝砺-event-yushi
  person: guji-彭汝砺
  date: '1072-01-01'
  year_of: 1072
  is_circa: true
  title_zh: 用为监察御史里行，首陈十事
  description: 陈正己、任人、理财、青苗、盐事等十事，指擿利害；又论吕嘉问市易聚敛、俞充谄事王中正。
  significance_zh: 台谏立身之始，神宗诘语所从我卒不奉诏。
- id: guji-彭汝砺-event-junzheng
  person: guji-彭汝砺
  date: '1075-01-01'
  year_of: 1075
  is_circa: true
  title_zh: 论不当以兵付中人
  description: 王中正、李宪主西师，我以汉唐祸乱为鉴极谏；神宗语折之，我拱立不动，伺间复言，帝为改容。
  significance_zh: 廷议之中不挠，在廷皆叹服。
- id: guji-彭汝砺-event-caiyun
  person: guji-彭汝砺
  date: '1078-01-01'
  year_of: 1078
  is_circa: true
  title_zh: 元丰初陛辞进言
  description: 以馆阁校勘为江西转运判官，陛辞言「不患无将顺之臣，患无谏诤之臣」，神宗嘉其忠荩。
  significance_zh: 外任犹不废直言。
- id: guji-彭汝砺-event-qiju
  person: guji-彭汝砺
  date: '1087-01-01'
  year_of: 1087
  title_zh: 元祐二年召为起居舍人，迁中书舍人
  description: 时相问新旧之政，对曰「政无彼此，一于是而已」；逾年迁中书舍人，赐金紫。
  significance_zh: 不阿附元祐更化，持论以「是」为衡。
- id: guji-彭汝砺-event-fenghuan
  person: guji-彭汝砺
  date: '1094-04-01'
  year_of: 1094
  is_circa: true
  title_zh: 蔡确诗案中封还除目
  description: 吴处厚傅会确诗为怨谤，谏官交章欲置之法；我数白执政不能救，居家待罪，得草词曰「我不出，谁任其责者」，即入省封还除目。
  significance_zh: 拒以笔成罗织，宣仁后曰汝砺岂党确者。
- id: guji-彭汝砺-event-luozhi
  person: guji-彭汝砺
  date: '1094-06-01'
  year_of: 1094
  is_circa: true
  title_zh: 落职知徐州
  description: 确贬新州仍须我草词，遂落职知徐州；后加集贤殿修撰，权兵、刑二部侍郎，因持特旨杀狱不下而自劾请去，章四上。
  significance_zh: 人以我为确得罪，益贤之。
- id: guji-彭汝砺-event-death
  person: guji-彭汝砺
  date: '1095-01-01'
  year_of: 1095
  is_circa: true
  title_zh: 彭汝砺卒
  description: 遗表愿以仁抚土地、以礼节财用，佞人之患在后、忠言之利甚博；朝廷方以枢密都承旨命之而已卒，年五十四。
  significance_zh: 忠言报国之终章，遗训传世。
