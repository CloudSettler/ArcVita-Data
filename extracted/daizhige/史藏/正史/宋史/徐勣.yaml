  name_zh: 徐勣
  names:
    zh: 徐勣
    en: Xu Ji
  lifespan:
    birth:
      date: '1048'
      precision: year
      is_circa: true
      raw: 卒年七十九，约生于宋仁宗时
    death:
      date: '1126'
      precision: year
      is_circa: true
      raw: 卒，年七十九
  birth_date: 约1048年
  death_date: 约1126年
  era: 北宋
  reign_ref: 哲宗、徽宗朝
  archetype: 鲠直不阿的旧学朝臣
  dilemmas:
  - 不肯与蔡京联职，宁违权相而不降节
  - 帝问新法存弃，直言不当两存，须考其实
  lesson: 持正守志，不以利禄易其志，虽终不得大用而人望攸属。
  summary_first_person: 我徐勣，字元初，宣州南陵人。举进士起家，从军平交阯粮饷、力护海堤、教授诸王宫。徽宗以其旧学眷我，擢侍讲、中书舍人、翰林学士，我修《神宗史》，上疏陈六事，直论择相、理财与边事之害。蔡京以宫僚旧恩曲意结我，我终不为所动；虽帝礼重，而京党间之，我入党籍、屡遭摈斥，职终不至执政，以龙图阁直学士致仕，卒年七十九。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷348
