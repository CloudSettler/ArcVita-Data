  description: 复教授广陵、申王院，改诸王府记室参军；哲宗见其文谕奖之，欲用为左右史，未及。
  participants:
  - guji-徐勣
  - 哲宗
  location: 汴京
- id: guji-徐勣-event-5
  date: '1100'
  year_of: 1100
  type: career
  title_zh: 徽宗即位，擢宝文阁待制兼侍讲
  description: 徽宗立，擢宝文阁待制兼侍讲，迁中书舍人，修《神宗史》。
  participants:
  - guji-徐勣
  - 徽宗
  location: 汴京
- id: guji-徐勣-event-6
  date: 约-1101
  year_of: 1101
  type: career
  title_zh: 迁给事中、翰林学士，上疏陈六事
  description: 迁给事中、翰林学士，上疏陈时要、任贤、求谏、选用、破朋党、明功罪六事；并奏请参讨各家记录以成《神宗正史》。
  participants:
  - guji-徐勣
  - 徽宗
  location: 汴京
- id: guji-徐勣-event-7
  date: 约-1104
  year_of: 1104
  type: career
  title_zh: 摘其行章惇词，入党籍
  description: 蔡京入辅，擿勣所草章惇制词以为诋先烈；服阕后主管灵仙观，入党籍中，又罢知江宁府之命。
  participants:
  - guji-徐勣
  - 蔡京
  location: 汴京
