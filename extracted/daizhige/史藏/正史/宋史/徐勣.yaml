  date: '1109'
  year_of: 1109
  type: career
  title_zh: 大观三年知太平州，极论茶盐法病民
  description: 知太平州，召入觐，极论茶盐法为民病；以用度不足对，勣言生财有道、理财有义、用财有法，帝嘉之，加龙图阁直学士，留守南京。
  participants:
  - guji-徐勣
  - 徽宗
  location: 太平州
- id: guji-徐勣-event-9
  date: 约-1102
  year_of: 1102
  type: career
  title_zh: 笑拒蔡京利禄之撼
  description: 蔡京过宋见勣，微言撼之曰伯通既相矣；勣笑答人各有志，岂以利禄易之。京惭不能对，勣终不复用。
  participants:
  - guji-徐勣
  - 蔡京
  location: 宋州
- id: guji-徐勣-event-death
  date: 约1126
  year_of: 1126
  type: death
  title_zh: 徐勣卒，年七十九
  description: 以疾除显谟阁学士致仕，卒年七十九，赠资政殿学士、正奉大夫。时议惜其挺挺持正而不至大用。
  participants:
  - guji-徐勣
  location: 北宋
