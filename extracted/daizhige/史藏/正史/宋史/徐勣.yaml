  date: 约-1076
  year_of: 1076
  type: career
  title_zh: 从军讨交阯，力争不杖饥民
  description: 转运使檄从军督饷，使者欲杖逃役饥民千余人，勣力争仅涅臂以戒，使者怒欲并劾，不能夺。又疏郭逵逗留，逵、禼后皆以无功贬。
  participants:
  - guji-徐勣
  - 郭逵
  - 赵禼
  location: 桂州
