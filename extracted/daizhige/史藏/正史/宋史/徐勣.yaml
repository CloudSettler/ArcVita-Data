    highlight_event_id: guji-徐勣-event-8
  decisions:
  - date: 约-1100
    title_zh: 固辞与蔡京同校《五朝宝训》
    rationale: 不肯与京联职，奏京之恶，引卢杞为喻。
  - date: 约-1101
    title_zh: 奏请尽取各家记录勒成《神宗正史》
    rationale: 元祐、绍圣史臣各执所好，宜参讨是非、毋使失实。
  - date: 约-1102
    title_zh: 论湟州之弃，请勿妄兴边事
    rationale: 无边事则朝廷之福，有边事则臣下之利。
  - date: 约-1109
    title_zh: 极论茶盐法为民病
    rationale: 生财有道、理财有义、用财有法，当推讲力行。
  - date: 约-1103
    title_zh: 拒蔡京以利禄相撼
    rationale: 人各有志，岂以利禄易志。
