person:
  qid: guji-徐铉
  name_zh: 徐铉
  names:
    zh: 徐铉
    en: Xu Xuan
  lifespan:
    birth:
      date: '916'
      precision: year
      is_circa: true
      raw: 十岁能属文，仕吴为校书郎
    death:
      date: 991-12
      precision: month
      is_circa: true
      raw: 淳化二年贬静难行军司马后卒，年七十六
  birth_date: '916'
  death_date: '991'
  era: 五代十国至北宋初
  reign_ref: 南唐烈祖、中主、后主；宋太祖、太宗
  archetype: 文臣学者
  dilemmas:
  - 出使宋营求缓兵，须以社稷为重而不惜一己之使
  - 国亡仕宋，受太祖斥责时直言称臣当死
  lesson: 以忠直与学术立身，历三朝而不改其节
  summary_first_person: 我字鼎臣，扬州广陵人，十岁能文，与韩熙载齐名，称「韩、徐」。我先仕吴，再仕南唐，官至吏部尚书。宋师围金陵，我奉命出使求缓兵，力主不可止援兵东下。金陵陷后随李煜入觐，太祖责我，我直言「国亡罪当死」，太祖叹为忠臣。入宋后直学士院，从征太原，军中书诏出我笔下。我精小学，好李斯小篆，受诏校《说文》，镂板行世。淳化二年遭诬贬静难行军司马，终不御毛褐致冷疾，晨起从容手疏后事而卒，年七十六。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷441
