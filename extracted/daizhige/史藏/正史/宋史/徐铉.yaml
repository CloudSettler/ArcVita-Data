    title_zh: 力劝李煜勿止朱令赟援兵
    rationale: 「此行未保必能济难，江南所恃者援兵尔，奈何止之！」置一介之使于度外，以社稷为计。
  - date: '957'
    title_zh: 捕得贼首不俟报即斩
    rationale: 巡抚楚州奏罢苛细屯田，急捕罪首，虽坐专杀流舒州而不悔。
- id: guji-徐铉-endeavor-2
