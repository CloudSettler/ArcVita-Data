  birth_date: ''
  death_date: ''
  era: 北宋
  reign_ref: 北宋神宗、哲宗时期
  archetype: 世袭边将
  dilemmas:
  - 朝廷议守臣难自行，克行愿率部落先驱，委管钥而西，先斩敌酋后自劾
  - 筑砦通道之议，廷议主张由近及远，克行力主先远出奇，终用其策
  lesson: 在边三十年，善拊士卒，战功最多，羌人呼为折家父
  summary_first_person: 我乃折继闵之子折克行，字遵道，世守府州。夏人寇环庆时我请兵往援，葭芦川一战先登斩级四百，诸老将叹曰真折太尉子也。此后抗章请为先锋、大破咩保吴良、先拔宥州、城葭芦、进筑八砦通道鄜延，在边三十年善拊士卒，每战必胜，夏人畏之，羌人呼我为折家父，官至秦州观察使，卒赠武安军节度使。
  source_urls:
  - 宋史 卷二百五十三
