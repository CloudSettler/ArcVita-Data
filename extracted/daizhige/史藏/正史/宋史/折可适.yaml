  event_type: endeavor_milestone
  date: ~1078
  year_of: ~1078
  headline_zh: 从种谔出塞，与少年夺马之战斩敌首并取马而还，益知名
- id: guji-折可适-event-3
  event_type: endeavor_milestone
  date: ~1082
  year_of: ~1082
  headline_zh: 米脂之役，战三角岭斩获甚多，又败夏人于蒲桃谷东
- id: guji-折可适-event-4
  event_type: endeavor_milestone
  date: ~1091
  year_of: ~1091
  headline_zh: 先斩守烽卒使烽不传，尾丁硙大破羌夏十万之众；复从间道设伏洪德，夏国母亲逾山而遁
- id: guji-折可适-event-5
