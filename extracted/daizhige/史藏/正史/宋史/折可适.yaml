person:
  qid: guji-折可适
  name_zh: 折可适
  names:
    zh: 折可适
    en: Zhe Keshi
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年未载，后晋、汉之际（约10世纪中叶）
    death:
      precision: year
      is_circa: false
      raw: 数月后卒，年六十一（约1100年前后）
  era: 北宋
  reign_ref: 哲宗、徽宗朝（元祐、绍圣、元符、崇宁前后）
  archetype: 边将
  dilemmas:
  - 抗命与守程：筑城议策中主张“先远后近、出其不意”，与法理派秦希甫之争，最终以军功证成己见
  - 仁与功：面对饥饿逃亡的千余兵卒，制止同僚掩杀冒功，单骑劝归
  lesson: 知兵而不嗜杀，谋勇兼备而能自劾自省，方为真将种
  summary_first_person: 我是折可适，继闵之侄、克行从子，未冠而有勇，驰射不习而能，郭逵赞我“真将种也”。我从种谔出塞斩敌取马，战三角岭，破尾丁硙、洪德城设伏，几擒夏国母；又夜袭嵬名阿埋、昧勒都逋，取天都山，为朝廷设西安州。我一生在边御夏，虽屡遭失道之罪与权臣倾轧贬黜，仍直言“得之易，守之难”之策，终至武安军节度观察留后、淮康军节度使。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷253
endeavors:
