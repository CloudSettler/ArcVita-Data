  decisions:
  - date: ~1080
    title_zh: 请往援环庆
    rationale: 夏人寇环庆，种谔拒之，诏河东出师为援，克行请往，可适随军。
  - date: ~1088
    title_zh: 谏止掩杀饥卒
    rationale: 千人成聚于军门，或欲掩杀以为功，可适以“此以饥而逃耳，非叛也”单骑诘之，遣归。
- id: guji-折可适-endeavor-2
  name_zh: 筑城筹策与守边进言
  phases:
  - key: brewing
    name_zh: 权部副将
    labels:
      zh:
      - 好水川统军
      - 权第十二将
    start_date: ~1096
    highlight_event_id: guji-折可适-event-6
  - key: climax
    name_zh: 分筑场圃之争
    labels:
      zh:
      - 平夏四砦储粟
      - 逆帅意遭疑谤
    start_date: ~1101
    highlight_event_id: guji-折可适-event-8
  - key: closure
    name_zh: 复镇渭州
    labels:
      zh:
      - 复知渭州
      - 数月而卒
    start_date: ~1105
    highlight_event_id: guji-折可适-event-9
  decisions:
  - date: ~1099
    title_zh: 奇正之策，先远后近
    rationale: 筑八砦通道鄜延，秦希甫主张由近及远，可适以“乘士气之锐，所利在速”力争，卒用可适策。
  - date: ~1106
    title_zh: 议平夏储粟与借车运熙河
    rationale: 以费大难之、戾帅意，遂遭中伤召为佑神观使。
