  date: ~1097
  year_of: ~1097
  headline_zh: 夜袭夏酋嵬名阿埋、昧勒都逋，俘三千人取天都山，置西安州，帝御文德殿受贺
- id: guji-折可适-event-6
  event_type: endeavor_milestone
  date: ~1096
  year_of: ~1096
  headline_zh: 好水川筑城统军为副，失道千人尽死削十三官，章楶请留以责效，权第十二将
- id: guji-折可适-event-7
  event_type: endeavor_milestone
  date: ~1100
  year_of: ~1100
  headline_zh: 入觐，对以“得之易，守之难”，先侵弱其地、待藩篱既固，进武安军节度观察留后
- id: guji-折可适-event-8
  event_type: endeavor_milestone
  date: ~1101
  year_of: ~1101
  headline_zh: 大城萧关与钟传议龃龉，覆师踏口，贬郑州观察使，俄知卫州、拜淮康军节度使
- id: guji-折可适-event-9
  event_type: endeavor_milestone
  date: ~1105
  year_of: ~1105
  headline_zh: 复知渭州，以疑谤批敕，翌年被召为佑神观使，复镇渭州，数月而卒（实际卒于徽宗朝）
- id: guji-折可适-event-10
  event_type: endeavor_milestone
  date: ~1106
  year_of: ~1106
  headline_zh: 数月而卒，年六十一，子彦质直秘阁参军事，后签书枢密院
