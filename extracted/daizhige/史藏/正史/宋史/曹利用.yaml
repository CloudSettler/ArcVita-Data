      raw: 干兴后贬，行至襄阳驿自缢
  birth_date: ''
  death_date: '1029'
  era: 北宋
  reign_ref: 真宗、仁宗
  archetype: 刚梗之材·功高致祸的武臣枢密
  dilemmas:
  - 对契丹割地之请，宁死不辱命
  - 持正裁抑内降恩，得罪贵戚宦官
  lesson: 刚直有守者，成败常悬于功与骄之间
  summary_first_person: 我曹利用，字用之，赵州宁晋人。少喜谈辩，慷慨有志操。景德元年契丹南侵，我奉使抵其军，力拒割关南地之请，以岁币定澶渊之盟。后平岭南非为，历经迁擢至枢密使、同平章事。我久居上位，颇恃功而骄，力裁内降之恩，遂为太后及左右所怨，因从子曹汭之狱被累，贬房州，行至襄阳驿，投缳而死。明道二年，朝廷追复我官爵，赐谥襄悼，天下皆知我死非其罪。
  source_urls:
  - 宋史 卷二百九十
