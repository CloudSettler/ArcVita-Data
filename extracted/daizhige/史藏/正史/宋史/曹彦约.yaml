  lesson: 守土者当专任贤者尽付兵权，讨叛不如招安，听言当以忠直为本
  summary_first_person: 我曹彦约，淳熙八年进士，从朱熹讲学。金人入侵时我在汉阳搜访土豪、结渔户拒守，大败金兵；后督战平湖南诸盗，著《病夫议》论兵权不一之弊，累迁兵部侍郎、礼部侍郎，理宗朝入对劝帝讲学防近习，卒谥文简。
  source_urls:
  - 宋史·曹彦约传
