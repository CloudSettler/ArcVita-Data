      - 清介
    start_date: '958'
    highlight_event_id: guji-caobin-event-2
  decisions:
  - date: '958'
    title_zh: 受吴越馈赠籍之归官，尽分亲旧不著一钱
    rationale: 终拒则近名，受而上献既全礼又不污己
- id: guji-caobin-endeavor-2
  name_zh: 平定两川与征讨河东
  phases:
