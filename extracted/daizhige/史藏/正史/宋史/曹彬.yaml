person:
  qid: guji-caobin
  name_zh: 曹彬
  names:
    zh: 曹彬
    en: Cao Bin
  lifespan:
    birth:
      date: 931
      precision: year
      is_circa: true
      raw: 咸平二年（999）被疾，六月薨，年六十九，逆推约生于931年
    death:
      date: 999-06
      precision: month
      is_circa: false
  birth_date: 931
  death_date: 999-06
  era: 北宋
  reign_ref: 宋太祖、宋太宗、宋真宗
  archetype: 儒将廉谨·开国元勋
  dilemmas:
  - 平蜀诸将屠掠，独申令戢下，受赐尽分亲旧，如何在军功环境中持守清廉
  - 攻金陵垂克，称疾要诸将誓不妄杀，于军令与仁心之间权衡
  - 岐沟关之败，诸将谋议蜂起，不得已再攻涿州，将在违诏失律与军心所迫间抉择
  lesson: 伐二国秋毫无犯，位兼将相而不自异，仁厚与军法并行则众自来服。
  summary_first_person: 我是曹彬，字国华，真定灵寿人。周世宗时出使吴越，所赠一无所受，籍而上献。太祖朝我监军伐蜀，诸将屠掠而我橐中唯图书衣衾，遂受器重。开宝七年我率师伐江南，围金陵，城将克时称疾，令诸将焚香誓不妄杀一人，李煜君臣赖以保全，我还朝自称"奉敕江南干事回"，不伐其功。太宗朝我曾列枢密使、同平章事，雍熙三年北伐，因诸将请战、粮尽失律败于岐沟关，责授右骁卫上将军，后起复，真宗朝再拜枢密使，咸平二年薨，谥武惠，配飨太祖庙庭。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷258
endeavors:
- id: guji-caobin-endeavor-1
  name_zh: 佐周入宋·中立勤谨
  phases:
