    name_zh: 伐蜀都监·戢兵不屠
    labels:
      zh:
      - 宣徽南院使
    start_date: '964'
    highlight_event_id: guji-caobin-event-4
  decisions:
  - date: '964'
    title_zh: 伐蜀诸将欲屠城，独申令戢下
    rationale: 所至悦服，得诏褒奖，蜀乱赖其与光毅平定
  - date: '965'
    title_zh: 入见辞赏，谓征西将士俱得罪臣独受赏恐无以示劝
    rationale: 不矜功诿赏，上以惩劝常典励之，固授宣徽南院使
- id: guji-caobin-endeavor-3
  name_zh: 率师平定江南（灭南唐）
  phases:
  - key: brewing
    name_zh: 受任升州西南路都部署
    labels:
      zh:
      - 战棹都部署
    start_date: 974-10
    highlight_event_id: guji-caobin-event-5
  - key: climax
    name_zh: 围金陵·誓不妄杀
    labels:
      zh:
      - 克金陵
      - 全李煜君臣
    start_date: '975'
    highlight_event_id: guji-caobin-event-6
  - key: closure
    name_zh: 献俘让功
    labels:
      zh:
      - 枢密使
    start_date: '976'
    highlight_event_id: guji-caobin-event-7
  decisions:
  - date: 975-11
    title_zh: 城垂克称疾，要诸将焚香誓克城之日不妄杀一人
    rationale: 所惜者一城生聚，以仁心保全金陵
  - date: '976'
    title_zh: 不居平使相之赏，退曰好官亦不过多得钱
    rationale: 自谓仗天威遵庙谟，何功之有；太原未平故让使相
- id: guji-caobin-endeavor-4
  name_zh: 雍熙北伐与岐沟之败
  phases:
  - key: brewing
    name_zh: 声言取幽州持重缓行
    labels:
      zh:
      - 幽州行营前军都部署
    start_date: '986'
    highlight_event_id: guji-caobin-event-8
  - key: climax
    name_zh: 再攻涿州·粮尽败于岐沟关
    labels:
      zh:
      - 失律
    start_date: 986-05
    highlight_event_id: guji-caobin-event-9
  - key: closure
    name_zh: 具伏受责·起复
    labels:
      zh:
      - 右骁卫上将军
      - 侍中武宁军节度使
    start_date: '986'
    highlight_event_id: guji-caobin-event-10
  decisions:
  - date: '986'
    title_zh: 不得已违诏再攻涿州
    rationale: 部下诸将闻潘美等累建武功而谋议蜂起，彬不能制
  - date: '987'
    title_zh: 为赵昌言请得朝谒
    rationale: 北征失律虽被劾，犹以宽仁体恤同僚
