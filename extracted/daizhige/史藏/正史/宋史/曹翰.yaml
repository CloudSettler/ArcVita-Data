person:
  qid: guji-曹翰
  name_zh: 曹翰
  names:
    zh: 曹翰
    en: Cao Han
  lifespan:
    birth:
      date: '923'
      precision: year
      is_circa: true
      raw: 淳化三年卒，年六十九
    death:
      date: '992'
      precision: year
      is_circa: false
      raw: 淳化三年，卒，年六十九
  birth_date: 约923年
  death_date: '992'
  era: 五代末至北宋初
  reign_ref: 后周世宗、宋太祖、宋太宗
  archetype: 智勇双全而贪酷专擅的宋初武将
  dilemmas:
  - 战功卓著与征敛苛酷、行为不法之间的矛盾
  - 矫诏杀降八百人以防叛乱，先斩后奏的伦理困境
  - 江州屠城获亿万金帛，借运佛像之名载归
  lesson: 智谋与战功能换来一时荣宠，却不能掩盖贪暴之行，终致削爵流放。
  summary_first_person: 我曹翰是大名人，少为郡小吏而好使气陵人。周太祖奇我之才，我遂隶世宗帐下，从征高平、淮南，护塞决河有功。宋兴，我随太祖平西蜀、定剑南，又先锋克池州，poon五月攻陷江州，屠城杀兵八百。太宗朝我再从征太原，筑土山、穿渠得水，智勇为诸将所称。然我在郡征敛苛酷，私市兵器不法事发，被削官爵流锢登州，后虽起复为右千牛卫大将军，终究仕途蒙污。淳化三年，我卒于官，年六十九，赠太尉，谥武毅。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷260
endeavors:
- id: guji-曹翰-endeavor-1
  name_zh: 佐命周室，参预军事
  phases:
  - key: breakthrough
    name_zh: 隶世宗帐下
    labels:
      zh: 帐下牙校
    start_date: '947'
    highlight_event_id: guji-曹翰-event-breakthrough
  - key: climax
    name_zh: 从征立功
    labels:
      zh: 周世宗朝战功
    start_date: '954'
    highlight_event_id: guji-曹翰-event-climax
  - key: closure
    name_zh: 改朝为新职
    labels:
      zh: 入宋
    start_date: '960'
    highlight_event_id: guji-曹翰-event-climax
  decisions:
  - date: '950'
    title_zh: 不俟召归见世宗劝其入侍医药
    rationale: 见太祖寝疾，世宗身为冢嗣不当决事外廷，恐失天下望，遂密言劝其入侍，世宗悟而以府事属翰总决。
  - date: '956'
    title_zh: 矫杀降卒八百人
    rationale: 虑降卒劫正阳铠甲兵器复叛，将为大患，遂矫命尽杀之，事后向世宗陈其利害而获免罪。
- id: guji-曹翰-endeavor-2
  name_zh: 佐宋平蜀平南
  phases:
  - key: breakthrough
    name_zh: 征西蜀督饷运
    labels:
      zh: 西南转运
    start_date: '964'
    highlight_event_id: guji-曹翰-event-climax2
  - key: climax
    name_zh: 平乱定剑南
    labels:
      zh: 讨平全师雄吕翰之叛
    start_date: '965'
    highlight_event_id: guji-曹翰-event-climax2
  - key: closure
    name_zh: 征江南下江州
    labels:
      zh: 先锋攻城
    start_date: '974'
    highlight_event_id: guji-曹翰-event-climax-later
  decisions:
  - date: '971'
    title_zh: 围攻江州五月而陷屠城
    rationale: 军校胡德、牙将宋德明据江州拒命，翰率兵猛攻，凡五月城陷，屠城无噍类。
  - date: '979'
    title_zh: 攻太原东北面筑土山穿渠得水
    rationale: 与刘遇争攻城方位，奉诏攻西北，筑土山瞰城中数日而就，又祷庙穿渠得水以给军中。
  - date: '979'
    title_zh: 掘土得蟹预言班师
    rationale: 攻幽州时掘得蟹，谓蟹水物陆居、多足为援将至不可进拔之象，况蟹者解也，后班师果验。
events:
- id: guji-曹翰-event-birth
  type: birth
  date: 前？
  year_of: 0
  date_display: 约923年
  description_zh: 曹翰生于大名家，头衔为郡小吏，约923年（推算，卒于992年，年六十九）。
- id: guji-曹翰-event-breakthrough
  type: career
  date: '947'
  year_of: 947
  date_display: 干祐初
  description_zh: 周太祖镇邺，与翰语，奇之，以隶世宗帐下，世宗镇澶渊署为牙校。
- id: guji-曹翰-event-climax
  type: career
  date: '954'
  year_of: 954
  date_display: 显德元年
  description_zh: 世宗即位，补供奉官，从征高平，参豫谋画，寻迁枢密承旨，护塞决河。
- id: guji-曹翰-event-climax2
  type: career
  date: '965'
  year_of: 965
  date_display: 干德年间
  description_zh: 从征西蜀，兼西南诸州转运使凿石通道饷运不乏，会曹彬等讨平全师雄，又破吕翰复据嘉州之众，剑南遂平，迁蔡州团练使。
- id: guji-曹翰-event-climax-later
  type: career
  date: '975'
  year_of: 975
  date_display: 开宝八年
  description_zh: 将征江南，率兵先赴荆南为行营先锋使，进克池州，金陵平，又攻陷江州屠之，录功迁桂州观察使、判颍州。
- id: guji-曹翰-event-climax3
  type: career
  date: '979'
  year_of: 979
  date_display: 太平兴国四年
  description_zh: 从征太原为攻城南面都部署，筑土山瞰城、穿渠得水，继元甚恐；又从征幽州，掘得蟹预言班师果验。
- id: guji-曹翰-event-decline
  type: career
  date: '982'
  year_of: 982
  date_display: 太平兴国七年前后
  description_zh: 汝阴令孙崇望诣阙诉翰私市兵器所为不法，御史鞫之，狱具当弃市，太宗贷其罪，削官爵流锢登州。
- id: guji-曹翰-event-rehab
  type: career
  date: '985'
  year_of: 985
  date_display: 雍熙二年
  description_zh: 起为右千牛卫大将军、分司西京，雍熙四年召入为左千牛卫上将军，赐钱五百万、白金五千两。
- id: guji-曹翰-event-death
  type: death
  date: '992'
  year_of: 992
  date_display: 淳化三年
  description_zh: 曹翰卒，年六十九，赠太尉，咸平元年赐谥武毅。
