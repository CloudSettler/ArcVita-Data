  decisions:
  - date: 1127
    title_zh: 奋身自献充通问副使
    rationale: 议遣使问安两宫，弁自分必死，愿为使以申四海之养。
  - date: '1132'
    title_zh: 请留使印，让正使王伦先归
    rationale: 愿正使受书归报天子，成两国之好；己则抱印以死，死不腐矣。
  - date: 1132
    title_zh: 拒仕刘豫
    rationale: 刘豫乃国贼，恨不食其肉，宁忍北面臣之？吾有死耳。
  - date: 1132
    title_zh: 移书金人誓不易官
    rationale: 官受之本朝，言可从则从，不可从则囚之杀之，誓不易以辱吾君。
- id: guji-朱弁-endeavor-2
  name_zh: 著述与教化
