person:
  qid: guji-朱弁
  name_zh: 朱弁
  names:
    zh: 朱弁
    en: Zhu Bian
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: 1145
      precision: year
      is_circa: false
      raw: 绍兴十四年卒
  birth_date: ''
  death_date: 1145
  era: 南宋
  reign_ref: 宋高宗（建炎、绍兴年间）
  archetype: 忠节使臣
  dilemmas:
  - 死守臣节与屈仕伪齐刘豫之间的生死抉择
  - 先归报国与留印殉节的两难取舍
  lesson: 使节守节不屈，虽困于异国仍以死全义，终得南归名垂青史。
  summary_first_person: 我是朱弁，字少章，徽州婺源人。靖康之乱后，我自请出使金国问安两宫，被拘十余年。金人迫我仕伪齐刘豫，我誓死不屈，留印怀之，抱节以死自誓。绍兴十三年和议成，我终得南归，向高宗进言知时知几之策，并述北方忠臣义士死节事状请加褒录。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷373
