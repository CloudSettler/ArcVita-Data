    title_zh: 归国献六朝御容及宣和御书画
    rationale: 以在金所得文物献于朝廷，存故国文献。
  - date: 1143
    title_zh: 述北方忠臣义士死节事状请加褒录
    rationale: 劝来者，使忠义之风不泯。
