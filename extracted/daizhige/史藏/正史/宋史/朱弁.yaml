  year_of: 1128
  date_raw: 建炎初
  place_zh: ''
  description_zh: 议遣使问安两宫，弁奋身自献，诏补修武郎，借吉州团练使，为通问副使，至云中见粘罕。
- id: guji-朱弁-event-juruo
  event_type: event
  date: 1132
  year_of: 1132
  date_raw: 绍兴二年
  place_zh: 云中
  description_zh: 金人迫弁仕刘豫，弁固拒驿门、忍饥待尽，誓不为屈；金人感动，致礼如初，终不可屈。
- id: guji-朱弁-event-liuyin
  event_type: event
  date: 1134
  year_of: 1134
  date_raw: ''
  place_zh: ''
  description_zh: 伦将归，弁请留使印，怀之卧起与俱，抱印以死自誓。
- id: guji-朱弁-event-mishu
  event_type: event
  date: 1138
  year_of: 1138
  date_raw: ''
  place_zh: 金国
  description_zh: 粘罕等相继死灭，弁密疏其事及金国虚实，谓此不可失之时，遣李发等间行归报。
- id: guji-朱弁-event-nangui
  event_type: return
  date: '1143-09-16'
  year_of: 1143
  date_raw: 绍兴十三年
  place_zh: 临安
  description_zh: 和议成，弁得归。入见便殿，进言知时知几，帝纳其言，赐金帛甚厚；又献六朝御容及宣和御书画。
- id: guji-朱弁-event-guanzhi
  event_type: appointment
  date: 1143
  year_of: 1143
  date_raw: 绍兴十三年
  place_zh: ''
  description_zh: 秦桧恶其言敌情，奏以初补官易宣教郎、直秘阁；有司校考应迁数官，桧沮之，仅转奉议郎。
- id: guji-朱弁-event-death
