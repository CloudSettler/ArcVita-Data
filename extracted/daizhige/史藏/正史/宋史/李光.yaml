person:
  qid: guji-李光
  name_zh: 李光
  names:
    zh: 李光
    en: Li Guang
  lifespan:
    birth:
      date: '1078'
      precision: year
      is_circa: true
      raw: 约宋神宗时期生（以登第及年寿推算）
    death:
      date: '1159'
      precision: year
      is_circa: true
      raw: 年逾八十，至江州而卒
  birth_date: 约1078
  death_date: 约1159
  era: 两宋之际
  reign_ref: 崇宁、靖康、建炎、绍兴
  archetype: 直言敢谏的名臣与守城能吏
  dilemmas:
  - 直谏时相与保位固宠之间的取舍
  - 主战坚守与秦桧主和路线的冲突
  - 借和议而图自治之计与坚守大节的内心矛盾
  lesson: 危局之中守正不阿，虽屡遭贬窜而志节不改
  summary_first_person: 我李光，字泰发，越州上虞人。我以直言闻名于两宋之际，屡忤权臣而数遭贬黜，守宣州却金兵、平乱军，官至参知政事；后因面折秦桧而远窜岭南十余年，年逾八十而卒，谥庄简。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷363
