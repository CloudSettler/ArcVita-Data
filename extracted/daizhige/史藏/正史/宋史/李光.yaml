events:
- id: guji-李光-event-birth
  date: '1078'
  year_of: 1078
  type: birth
  title_zh: 李光约生于此年
  description: 越州上虞人，童稚不戏弄，父高称其"云间鹤"。
- id: guji-李光-event-jinshi
  date: '1106'
  year_of: 1106
  type: career
  title_zh: 登崇宁五年进士第
  description: 服除游太学后登第，调开化令，有政声。
- id: guji-李光-event-noqu
  date: '1120'
  year_of: 1120
  is_circa: true
  type: career
  title_zh: 械治朱勔父家僮，不为权势屈
  description: 知常熟县时朱冲倚势暴横，光械治其家僮，虽被移令吴江而不屈。
- id: guji-李光-event-shishi
  date: '1125'
  year_of: 1125
  is_circa: true
  type: career
  title_zh: 纳符议立皇太子
  description: 郭药师叛，知徽宗有内禅意，纳符谓蔡攸"非皇太子则国家俱危"，钦宗受禅后擢右司谏。
- id: guji-李光-event-jianyan
  date: '1126'
  year_of: 1126
  is_circa: true
  type: career
  title_zh: 任右司谏、侍御史，极陈财计与三镇攻守
  description: 论三省枢密通知兵民财计以制国用；金人围太原，力主别议攻守之策。
- id: guji-李光-event-zhangzhou
  date: '1127'
  year_of: 1127
  is_circa: true
  type: exile
  title_zh: 因奏彗星灾异贬监汀州酒税
  description: 驳耿南仲以灾异归外夷之说，引孔子《春秋》不书祥瑞之义，疏奏即遭贬。
- id: guji-李光-event-xuanzhou
  date: '1129'
  year_of: 1129
  type: career
  title_zh: 建炎三年知宣州，缮城聚粮、练义社精拣军
  description: 籍六邑之民为保伍，得保甲万余号"精拣军"，栅险要二十三所谨戍之。
- id: guji-李光-event-lijie
  date: '1129'
  year_of: 1129
  type: career
  title_zh: 解王曁燮、王曁民溃兵之斗
  description: 杜充降金后两将拥溃兵索斗于城外，光亲至营谕以先国家后私雠之义，皆感悟解去。
- id: guji-李光-event-shaoqing
  date: '1130'
  year_of: 1130
  is_circa: true
  type: career
  title_zh: 招谕邵青，遗米二千斛
  description: 溃将邵青拥舟数百艘剽当涂芜湖间，光招谕之，青感动，秋毫无犯。
- id: guji-李光-event-qifang
  date: '1130'
  year_of: 1130
  is_circa: true
  type: military
  title_zh: 却剧盗戚方宣城之围
  description: 募勇敢劫贼营，以编竹帘御炮、撞竿御对楼，射书离间其副，援师至而贼遁。
- id: guji-李光-event-shixinshang
  date: '1131'
  year_of: 1131
  type: career
  title_zh: 绍兴元年擢吏部侍郎，疏陈防守建康六隘
  description: 极论朋党之害，建言屯兵积粟于江宁镇、采石诸隘。
- id: guji-李光-event-shiqing
  date: '1133'
  year_of: 1133
  is_circa: true
  type: career
  title_zh: 为淮西招抚使，缚韩世清送阙伏诛
  description: 世清本苗傅余党擅据仓库，光假道至郡，入谒即缚送阙下；途除端明殿学士、江东安抚大使知建康府。
- id: guji-李光-event-canwheng
  date: '1138'
  year_of: 1138
  is_circa: true
  type: career
  title_zh: 擢参知政事
  description: 秦桧初定和议，欲籍光名镇压以同押榜。
- id: guji-李光-event-qinhui
  date: '1138'
  year_of: 1138
  is_circa: true
  type: political
  title_zh: 榻前面折秦桧，极言和不可恃
  description: 面斥郑亿年除职、与桧语难上前，谓桧欲壅蔽耳目、盗弄国权，章九上乃罢政。
- id: guji-李光-event-exile
  date: '1141'
  year_of: 1141
  type: exile
  title_zh: 绍兴十一年责授藤州安置
  description: 万俟禼论光阴怀怨望，责授建宁军节度副使；后移琼州、再移昌化军。
- id: guji-李光-event-changhua
  date: '1153'
  year_of: 1153
  is_circa: true
  type: exile
  title_zh: 移昌化军，论文考史怡然自适
  description: 仲子孟坚坐私撰国史狱，又被告与胡铨诗赋倡和讥讪朝政。
- id: guji-李光-event-death
  date: '1159'
  year_of: 1159
  is_circa: true
  type: death
  title_zh: 至江州而卒
  description: 郊恩复左朝奉大夫任便居住，北归途中卒于江州，年逾八十。
- id: guji-李光-event-shihao
  date: '1163'
  year_of: 1163
  is_circa: true
  type: honor
  title_zh: 孝宗即位，复资政殿学士，赐谥庄简
  description: 朝廷追复其官职并赐美谥。
