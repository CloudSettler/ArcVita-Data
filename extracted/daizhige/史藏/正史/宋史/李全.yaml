    start_date: '1222'
  - key: climax
    name_zh: 与许国相争
    labels:
      zh: 庭参见辱，益生贰心
    start_date: '1224'
  - key: closure
    name_zh: 乱楚州
    labels:
      zh: 遣刘庆福为乱，许国被害
    start_date: '1225'
    highlight_event_id: guji-李全-event-4
  decisions:
  - date: '1222'
    title_zh: 请并涟水军，自核虚籍以结贾涉
    rationale: 求并将涟水军，卑辞献珍具自结，终得制帅付军
  - date: '1225'
    title_zh: 遣刘庆福还楚城为乱，图许国
    rationale: 图国之意已决，借潘甫起兵之势，快意于许国
events:
- id: guji-李全-event-birth
  type: 出生
  date: ''
  year_of: ''
  description: 李全生于潍州北海农家，锐头蜂目，同产兄弟三人。
  source_ref: 宋史 卷四百七十六
- id: guji-李全-event-1
  type: 事件
  date: '1211'
  year_of: 1211
  description: 大元兵至山东，全母及其兄死焉，全与仲兄福聚众数千起兵。
  participants:
  - 李全
  - 李福
  source_ref: 宋史 卷四百七十六
- id: guji-李全-event-2
  type: 事件
  date: '1216'
  year_of: 1216
  description: 季先以李全五千人附高忠皎，合兵克海州，全始授武翼大夫、京东副总管。
  participants:
  - 李全
  - 季先
  - 高忠皎
  source_ref: 宋史 卷四百七十六
- id: guji-李全-event-3
  type: 事件
  date: 1219-03
  year_of: 1219
  description: 全与鹿仙掩金将卢鼓槌于涡口，金兵溺淮数千；又与阿海战于化陂湖大捷， progressing进达州刺史。
  participants:
  - 李全
  - 鹿仙
  source_ref: 宋史 卷四百七十六
- id: guji-李全-event-4
  type: 事件
  date: '1225'
  year_of: 1225
  description: 全遣庆福还楚城使为乱，露刃充庭，许国被创出走，缢于途。
  participants:
  - 李全
  - 刘庆福
  - 许国
  source_ref: 宋史 卷四百七十六
- id: guji-李全-event-death
  type: 死亡
  date: ''
  year_of: ''
  description: 本卷（李全上）未载全之死，事见下卷。
  source_ref: 宋史 卷四百七十六
