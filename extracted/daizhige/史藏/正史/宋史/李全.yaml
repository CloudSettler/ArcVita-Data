  birth_date: ''
  death_date: ''
  era: 南宋
  reign_ref: 宋宁宗/宋理宗时期，嘉定、宝庆年间
  archetype: 叛臣·地方军阀
  dilemmas:
  - 附宋自保还是归附大元，权衡多方势力间求生
  - 既受宋廷官赏，又暗蓄自雄之志，忠叛两难
  lesson: 乘乱而起者，若无信义根基，终难长久自立。
  summary_first_person: 我李全，潍州北海农家子，以弓马矫捷、能运铁枪，号"李铁枪"。金末乱起，我聚众山东，后附宋为"忠义军"，转战淮东，取东海、青州等地，官至承宣使、招信军节度。然我拥兵自重，与宋制置使屡相猜忌，终致許国之乱，成叛臣之势。
endeavors:
- id: guji-李全-endeavor-1
  name_zh: 起兵山东与附宋忠义
  phases:
