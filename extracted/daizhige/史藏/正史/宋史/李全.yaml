    start_date: '1219'
  - key: closure
    name_zh: 招抚山东诸州
    labels:
      zh: 张林以十二州来归
    start_date: 1219-06
- id: guji-李全-endeavor-2
  name_zh: 拥兵自立与叛宋之谋
  phases:
  - key: brewing
    name_zh: 并制涟水军
    labels:
      zh: 谋并诸军，与制帅相猜
