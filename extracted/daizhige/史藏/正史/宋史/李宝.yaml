  - 宋高宗
  archetype: 水军名将·海上抗金英雄
  dilemmas:
  - 大洋风涛中军心欲溃，坚持进军还是退兵；李宝自立「宝心如铁石，不变矣」
  - 取捷之后金主亮正渡淮，乘胜深入 versus 回军东海以保表里之援
  lesson: 心如铁石、临危不惧，方能在逆风与强敌之间扭转战局。
  summary_first_person: 我李宝本是河北人，曾陷于金人，脱身从海道归来。金主亮败盟南侵时，我以三千闽浙弓弩手、百二十艘海舟出海迎战，东莞顺风火攻于唐岛，焚敌数百艘，擒倪询、斩完颜郑家奴，解了钱唐之危，朝廷书「忠勇李宝」表我旗帜，除静海军节度使、沿海制置使。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷370
