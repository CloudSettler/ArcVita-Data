  - 河北
  - 临安
  summary_zh: 李宝曾陷于金，后脱身从海道南归宋廷，因召对询以北事历历如数、陛对无惧，受高宗赏识。
- id: guji-李宝-event-appointment
  year_of: 1161
  date: '1161'
  title_zh: 授浙西路马步军副总管，驻札平江督海舟捍御
  date_raw: 绍兴三十一年
  event_type: endeavor
  people:
  - guji-李宝
  - 宋高宗
  - 苏保衡
  places:
  - 平江
  summary_zh: 金主亮败盟，金造舟欲由海道袭浙江，高宗以李宝必能事，授浙西路马步军副总管，与守臣督海舟捍御。
- id: guji-李宝-event-departure
  year_of: 1161
  date: 1161-08
  title_zh: 发苏州出海，大洋三日恶风誓师
  date_raw: 绍兴三十一年八月
  event_type: endeavor
  people:
  - guji-李宝
  places:
  - 苏州
  - 江阴
  - 东海
  summary_zh: 李宝先遣子李公佐偕边士宁潜伺敌情，遂发苏州；大洋行三日风甚恶，舟散，李宝酹酒自誓「宝心如铁石，不变矣」，风止舟集。
- id: guji-李宝-event-haizhou
  year_of: 1161
  date: 1161-08
  title_zh: 解海州之围，声振山东
  date_raw: 绍兴三十一年八月
  event_type: battle
  battle:
    side: 宋
    outcome: victory
  people:
  - guji-李宝
  - 魏胜
  places:
  - 海州
  summary_zh: 敌云合围海州，李宝麾兵登岸，握槊前行，将士无不一当十，敌不意引去，魏胜出城迎，声振山东，豪杰争应援。
- id: guji-李宝-event-tangdao
  year_of: 1161
  date: 1161-10
  title_zh: 唐岛之战：火箭焚敌数百艘
  date_raw: 绍兴三十一年
  event_type: battle
  battle:
    side: 宋
    outcome: victory
  people:
  - guji-李宝
  - 李公佐
  - 完颜郑家奴
  - 倪询
  places:
  - 胶西
  - 石臼岛
  - 唐岛
  summary_zh: 李宝至石臼岛侦得敌舟泊唐岛，借北风疾进，火箭环射烟焰延烧数百艘，俘大汉军三千余人，斩完颜郑家奴等六帅，禽倪询，获符印文书器甲以万计。亮闻胶西之败，召诸酋约三日渡江，遂为内变所杀。
- id: guji-李宝-event-honors
  year_of: 1161
  date: 1161-11
  title_zh: 除静海军节度使、沿海制置使，旌旗书忠勇李宝
  date_raw: 绍兴三十一年
  event_type: honor
  people:
  - guji-李宝
  - 宋高宗
  - 陈康伯
  places:
  - 临安
  summary_zh: 高宗喜「朕独用李宝，果立功，为天下倡矣」，诏书「忠勇李宝」表其旗帜，除静海军节度使、沿海制置使，赐金器玉带；宰臣取其长枪、克敌弓弩为式制之。
