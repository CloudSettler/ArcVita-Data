  decisions:
  - date: '1073'
    title_zh: 晨帐张黄旗誓众
    rationale: 张天子所赐黄旗，谓帝实临之，激励将士用命破贼。
  - date: '1075'
    title_zh: 听木征自效诱平平羌
    rationale: 羌人天性畏服贵种，纵木征盛装以出，夺其斗志。
- id: guji-李宪-endeavor-2
  name_zh: 元丰五路伐夏
  labels:
