  - key: climax
    name_zh: 失期擅还遭劾
    labels:
      zh: 师老获咎
    start_date: '1082'
    highlight_event_id: guji-李宪-event-shanhai
  - key: closure
    name_zh: 贬死陈州
    labels:
      zh: 贬谪身后
