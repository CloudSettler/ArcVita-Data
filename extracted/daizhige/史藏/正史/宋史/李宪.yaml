person:
  qid: guji-李宪
  name_zh: 李宪
  names:
    zh: 李宪
    en: Li Xian
  lifespan:
    birth:
      date: '1041'
      precision: year
      is_circa: true
      raw: 卒年五十一，约生于庆历年间
    death:
      date: '1092'
      precision: year
      is_circa: true
      raw: 卒于绍圣前，年五十一
  birth_date: '1041'
  death_date: '1092'
  era: 北宋
  reign_ref: 宋神宗熙宁、元丰年间
  archetype: 宦官统帅
  dilemmas:
  - 宦官领兵拓边获功，却被指罔上害民、贻患中国
  - 五路伐夏失期擅还，以馈饷不接自辩而免诛
  lesson: 以中人为将，功过相缠，虽能拓地降敌，终难洗欺罔之责。
  summary_first_person: 我李宪以宦官身份领兵西陲，收复河湟、筑兰州城、屡破羌夏，然灵州之役失期擅还，虽免于诛，终为言者所论，贬死陈州。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷467
