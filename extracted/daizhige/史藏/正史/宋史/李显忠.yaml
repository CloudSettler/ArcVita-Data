events:
- id: guji-李显忠-event-birth
  person_id: guji-李显忠
  type: birth
  date: '1108'
  year_of: 1108
  is_circa: true
  title_zh: 李显忠（世辅）约生于绥德军青涧
  description: 母产数日不能免，僧言以剑矢置母旁即生，既生立于蓐，众皆异之。
- id: guji-李显忠-event-1
  person_id: guji-李显忠
  type: career
  date: '1124'
  year_of: 1124
  is_circa: true
  title_zh: 年十七投效用，夜缒陶穴杀敌
  description: 随父永奇出征，缒穴杀敌十七人，经略王庶奇之，补承信郎充队将，由是知名。
- id: guji-李显忠-event-2
  person_id: guji-李显忠
  type: family
  date: 1139-02
  year_of: 1139
  title_zh: 家属二百口遇害
  description: 归朝事泄，永奇挈家出城至马趐谷口，为金人所及，家属二百口皆遇害，天昏大雪，延安人皆泣。
- id: guji-李显忠-event-3
  person_id: guji-李显忠
  type: career
  date: '1139'
  year_of: 1139
  title_zh: 同州执金帅撒里曷
  description: 以计执元帅撒里曷，驰出城至洛河，与追骑屡战皆胜，后折箭为誓纵之。
- id: guji-李显忠-event-4
  person_id: guji-李显忠
  type: career
  date: '1139-02-14'
  year_of: 1139
  title_zh: 借夏兵任延安招抚使
  description: 擒夏患青面夜叉，夏主出二十万骑，以显忠为延安招抚使。
- id: guji-李显忠-event-5
  person_id: guji-李显忠
  type: career
  date: 1139-04
  year_of: 1139
  is_circa: true
  title_zh: 以绍兴九年号归宋，赐名显忠
  description: 得延安赦书大哭，败夏铁鹞子军，斩获甚众；至行在，高宗抚劳，赐名显忠，赐田镇江。
- id: guji-李显忠-event-6
  person_id: guji-李显忠
  type: career
  date: '1140'
  year_of: 1140
  title_zh: 招抚司前军都统制，破灵壁
  description: 兀术犯河南，命为前军都统制，与李贵同破灵壁县，又败敌于孔城镇。
- id: guji-李显忠-event-7
  person_id: guji-李显忠
  type: career
  date: 1161-11
  year_of: 1161
  is_circa: true
  title_zh: 代王权，采石之捷
  description: 诏代王权，与虞允文协力于采石破金，选锐士万人渡江尽复淮西州郡。
- id: guji-李显忠-event-8
  person_id: guji-李显忠
  type: career
  date: 1163-06
  year_of: 1163
  title_zh: 隆兴北伐复宿州，旋失律
  description: 败萧琦复灵壁，与邵宏渊拔宿州，授开府仪同三司、殿前都指挥使；旋以将帅不和兵溃，纳印待罪，责授果州团练副使。
- id: guji-李显忠-event-death
  person_id: guji-李显忠
  type: death
  date: 1177-07
  year_of: 1177
  title_zh: 淳熙四年七月卒，年六十九
  description: 赠开府仪同三司，谥忠襄。
