  birth_date: '1108'
  death_date: 1177-07
  era: 南宋
  reign_ref: 宋高宗／宋孝宗
  archetype: 悲情复仇名将
  dilemmas:
  - 陷金为官而心念故宋，欲擒兀术归朝却屡失良机
  - 家属二百口被害，借夏兵复仇与忠于宋朝两难
  - 宿州之役与邵宏渊将帅不和，孤军难支
  lesson: 以死报国、以义待人，虽功败垂成而忠烈之名不朽
  summary_first_person: 我本名世辅，世守苏尾九族巡检。金人陷延安，父永奇不肯事金，训我伺机归宋。我执金帅撒里曷，率家眷南归，亲属二百口尽为金人所害。我奔夏国借兵二十万，复延安、败夏军，以绍兴九年号归朝，高宗赐名显忠。后破兀术、抗金主亮，有采石之捷。隆兴元年与邵宏渊复宿州，然宏渊不协，孤军力战，终纳印待罪。淳熙四年卒，年六十九，谥忠襄。
  source_urls:
  - 宋史卷三百六十七
