  birth_date: '947'
  death_date: '1004'
  era: 北宋
  reign_ref: 太平兴国、淳化、咸平、景德
  archetype: 圣相·清静守正的宰相
  dilemmas:
  - 不用浮薄新进之人，与举朝喜闻利害之风相抗
  - 焚毁手诏拒立刘氏为贵妃，抗君命而守典制
  - 力主弃灵州以息民力，逆众议而行
  - 预言真宗承平后将兴土木祷祠，早忧而莫能为
  lesson: 居相位以清静镇物，忠直不欺，远识在于使人主知四方艰难。
  summary_first_person: 我李沆，字太初，太平兴国五年进士甲科。真宗朝拜相，以不用浮薄新进为先，焚诏拒立刘氏贵妃，执议不授石保吉使相，预言澶渊和盟后人主将生侈心。每奏四方水旱盗贼，使少年人主知艰难。性直谅，不求声誉，居第隘陋不为意，常读《论语》，时人谓之圣相。景德元年薨于位，谥文靖。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷282
