      raw: 不详，并州太原人
    death:
      date: '968'
      precision: year
      is_circa: false
      raw: 建隆元年（约）泽州城破赴水死
  birth_date: ''
  death_date: '968'
  era: 五代末至宋初
  reign_ref: 后唐至宋太祖建隆年间
  archetype: 拥兵旧臣 / 忠于旧朝而终败的叛镇
  dilemmas:
  - 受周室大恩与面对宋禅之际，殉旧起兵，势孤援寡
  - 依傍北汉刘钧，而刘钧与周祖有世仇，互相猜疑
  - 城危时可携马突围出保昭义，却犹豫不决
  lesson: 旧恩与形势相悖时，孤军举事难以争锋天下
  summary_first_person: 我李筠，太原人，善骑射。历事后唐、晋、汉、周，为昭义军节度，屡破并人在边境立功。周祖待我大恩，宋受禅后我不甘称臣，缝联北汉起兵据泽州，终为太祖亲征所破，赴水而死。事母至孝，性刚暴而好调谑。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷484
