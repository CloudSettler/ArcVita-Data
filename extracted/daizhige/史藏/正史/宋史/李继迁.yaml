    title_zh: 受真宗授夏州刺史、定难军节度使
    rationale: 咸平初复表归顺，取回五州地与合法节度之位，放还张浦
  - date: 1002-03
    title_zh: 大集蕃部攻陷灵州，以为西平府
    rationale: 夺取灵州作为立国根基，次年遂都于此
