    title_zh: 诈言乳母之丧出葬于郊，与党数十人奔地斤泽
    rationale: 不甘随继捧举族内附，欲保存力量以图兴复李氏西土基业
  - date: 985-02
    title_zh: 诈降诱杀曹光实，遂袭银州据之
    rationale: 借降 plausibly 消除宋军戒备，一举夺据战略要地银州
  - date: '990'
    title_zh: 受宋银州观察之命、赐名保吉，然实无降心
    rationale: 以受抚换取休整与族众归附，保持割据实力
