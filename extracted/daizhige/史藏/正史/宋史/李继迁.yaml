person:
  qid: guji-李继迁
  name_zh: 李继迁
  names:
    zh: 李继迁
    en: Li Jiqian
  lifespan:
    birth:
      date: '963'
      precision: year
      is_circa: false
      raw: 建隆四年（963年），生于银州无定河
    death:
      date: '1004-02-01'
      precision: day
      is_circa: false
      raw: 景德元年正月二日卒，年四十二
  birth_date: '963'
  death_date: '1004-02-01'
  era: 十国-北宋初
  reign_ref: 夏国王（辽册封）；西平府（灵州）建都
  archetype: 割据奠基者 / 叛服无常的边地枭雄
  dilemmas:
  - 族叔继捧举族归宋，留居银州被迫赴阙之危局
  - 诈降就抚与举兵兴复之间的反复抉择
  - 受宋官爵（夏州刺史、定难军节度）与拒绝鄜州节度、谋求独立之间的张力
  - 受西凉首领潘罗支伪降之险，招致中流矢之祸
  lesson: 依托族群故恩与豪族联姻、转徙游击，可于两强之间重建割据基业；然受降不疑终有杀身之祸。
  summary_first_person: 我是党项拓跋之后，生于银州无定河。族叔继捧举族归宋，我诈称葬乳母出逃，奔地斤泽聚众起兵。 我屡败屡起，诈降诱杀曹光实，袭取银州，受辽册为夏国王；又就宋受赐名保吉。终攻陷灵州建为西平府，
    与宋议和割五州，西取西凉府中伏，中流矢而卒，年四十二。子孙遂成西夏基业，元昊追谥我神武，庙号太祖。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷485
