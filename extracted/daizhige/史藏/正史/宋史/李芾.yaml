      is_circa: false
      raw: 德祐元年除夕（1276年初）
  birth_date: ''
  death_date: 1276-01
  era: 南宋
  reign_ref: 德祐
  archetype: 死节孤城之守臣
  dilemmas:
  - 友人劝其勿赴必死之潭州，权衡谋身与报国
  - 城破之际命部下尽杀家人以免受辱，再自尽
  lesson: 世受国恩者，当以家许国，宁死不降
  summary_first_person: 我李芾，字叔章，先是广平人，后为衡州人。我生而聪警，少自立，以荫入仕，所至有声。贾似道当国时我独不阿附，为福王案力争置法，遭诬罢官。鄂州失后我起为湖南提刑，德祐元年知潭州兼湖南安抚使。城中兵不满三千，我结蛮为援、缮城积粮。阿里海牙大军围潭，我登陴分地而守，矢尽则以败羽扇、焚盐席济军，杀招降者以徇。除夕城破，尹谷自焚，我与宾佐会饮，手书“尽忠”为号。力竭后我命沈忠尽杀我家人而后杀我，引颈受刃。沈忠焚我居，亦自刎。朝廷谥我“忠节”。
