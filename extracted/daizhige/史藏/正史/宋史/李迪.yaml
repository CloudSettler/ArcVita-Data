events:
- id: guji-李迪-event-birth
  type: birth
  description: 其先赵郡人，后徙幽州，曾祖徙家濮州
- id: guji-李迪-event-da10
  type: career
  description: 携所为文见柳开，柳开奇之曰「公辅材也」
- id: guji-李迪-event-jiudi
  type: achievement
  description: 举进士第一，授将作监丞
- id: guji-李迪-event-zhuizei
  type: achievement
  description: 知亳州，悉罢所发兵，部勒骁锐擒群剽之贼，斩以徇
- id: guji-李迪-event-sansi
  type: achievement
  description: 真宗示岁出入之数问以济，迪请发内藏库佐国用，帝悦
- id: guji-李迪-event-liaodi
  type: achievement
  description: 预料曹玮秦州必胜，果大胜于三都谷，帝叹「颇、牧在禁中」
- id: guji-李迪-event-baixiang
  type: career
  description: 拜吏部侍郎兼太子少傅、同中书门下平章事、集贤殿大学士
- id: guji-李迪-event-kangzheng
  type: career
  description: 面奏丁谓罔上弄权，愿与谓俱罢付御史台劾正，左迁户部侍郎、知郓州
- id: guji-李迪-event-bianhengzhou
  type: career
  description: 仁宗即位，坐朋党傅会贬衡州团练副使
- id: guji-李迪-event-fuxiang
  type: career
  description: 太后崩，召为资政殿学士，未几复拜同中书门下平章事、集贤殿大学士
- id: guji-李迪-event-qixiang
  type: adherence
  description: 元昊攻延州，愿守边不应，除彰信军节度使、知天雄军
- id: guji-李迪-event-death
  type: death
  year_of: -1047
  date: '-1047'
  description: 薨，年七十七，赠司空、侍中，谥文定，碑曰「遗直之碑"
