  death_date: '1047'
  era: 北宋真宗、仁宗时期
  reign_ref: 真宗、仁宗
  archetype: 谏臣·名相
  dilemmas:
  - 直谏章献太后预政而遭贬黜
  - 与权相丁谓抗争，宁死不附权幸
  lesson: 直言极谏、临事有谋，虽屡遭贬斥仍以报国自任。
  summary_first_person: 我李迪，字复古，举进士第一，历仕真宗仁宗两朝，官至同中书门下平章事。我以公辅之才自任，力谏章献太后预政，与丁谓抗争，虽数被贬黜，然料敌制胜、直言无隐，卒谥文定。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷310
