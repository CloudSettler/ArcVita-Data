  decisions:
  - date: '1120'
    title_zh: 上书言契丹不可灭
    rationale: 童贯欲连金夹攻契丹，邈以为契丹未厌其主，误机事当诛臣以谢边吏
  - date: '1120'
    title_zh: 辞知涿州、易州
    rationale: 童贯收复燕山欲以邈守之，邈叹国家祸乱自兹始，皆辞不赴
  - date: '1126'
    title_zh: 谕民出财共守真定
    rationale: 兵不满二千、钱不满二百万，自度无以拒敌，遂募勇敢数千人死守
  - date: 1126-11
    title_zh: 赴井殉城不果，被执不拜
    rationale: 巷战不克，宁死不屈，虽火燎须眉亦不降
