  description: 募民得钱十三万贯、粟十一万石，乞师不报；城破巷战不克，胁拜不拜，拘燕山府犹斥金人负盟，怒金人命被发左衽，自去发为浮屠，遂遇害
- id: guji-li-miao-event-death
