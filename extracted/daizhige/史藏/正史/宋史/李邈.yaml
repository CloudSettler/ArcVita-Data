  description: 历监润州酒务、在京竹木务，擢提辖环庆路粮草，通判河间府
- id: guji-li-miao-event-career-2
  date: '1120'
  year_of: 1120
  type: career
  title_zh: 忤童贯，上书言契丹不可灭
  description: 都转运使沉积中摭其罪五十三条鞫治，一无所得，竟以建神霄宫不如诏免官
- id: guji-li-miao-event-career-3
  date: '1126'
  year_of: 1126
  type: career
  title_zh: 应召入对，论和战不定不能成功
  description: 建议尽以诸道兵畀种师道，视敌为进退；耿南仲主和议不合，换右文殿修撰、京畿转运使，辞不拜
- id: guji-li-miao-event-career-4
  date: 1126-11
  year_of: 1126
  type: career
