person:
  qid: guji-li-miao
  name_zh: 李邈
  names:
    zh: 李邈
    en: Li Miao
  lifespan:
    birth:
      date: '1070'
      precision: year
      is_circa: true
      raw: 约1070年（生年无确载）
    death:
      date: '1126'
      precision: year
      is_circa: true
      raw: 靖康末遇害，约1126年
  birth_date: 约1070
  death_date: 约1126
  era: 北宋末
  reign_ref: 徽宗、钦宗
  archetype: 死节守臣
  dilemmas:
  - 预警契丹不可灭而忤童贯，力谏与仕途荣辱的两难
  - 真定兵粮匮乏，守城赴死还是弃城求生
  - 金人胁降诱官，拜与不拜考量气节与生死
  lesson: 临难不苟免，忠直敢言虽得罪权贵亦不改其守
  summary_first_person: 我李邈，临江清江人，唐宗室宰相李适之后。因忤蔡京、童贯被贬换武阶，仍屡谏契丹不可灭、勿移师北伐。金人犯京，我慨然复出，力主和战须定、重用种师道。守真定时兵不满二千，我谕民出财共守，得钱十三万贯、粟十一万石，拒敌四旬。城破巷战不克，赴井被阻，被胁拜金帅不拜，火燎须眉不顾。幽于燕山仍斥金人负盟，金人夺其言、强我被发左衽，我自去发为浮屠以拒之，遂遇害，颜色不变，南向再拜，端坐就戮，谥忠壮。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷447
endeavors:
