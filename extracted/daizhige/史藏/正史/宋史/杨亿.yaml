  birth_date: 约974年
  death_date: 1020年十二月
  era: 北宋
  reign_ref: 宋太宗、宋真宗
  archetype: 神童文宗·直臣翰林
  dilemmas:
  - 灵州弃守之议：直言存有大害、弃有大利，忤时议而持独见
  - 刚介寡合：薄王钦若之为人，遭其屡抉其失、相与毁訾
  - 不俟命而去省母，遭宪官弹劾，分司西京
  lesson: 才思敏捷、文格雄健可名重一时，唯刚介守节方能留清议于身后
  summary_first_person: 我杨亿，字大年，建州浦城人。十一岁以神童应诏试艺，太宗授我秘书省正字。真宗朝我预修《太宗实录》，独草五十六卷；又与王钦若同总《册府元龟》，序次体制皆出我手。我于灵州弃守直言大利大害，虽忤众议不改其守。我性刚介寡合，尚名节，喜诲诱后进，天禧四年病卒，年四十七。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷305
