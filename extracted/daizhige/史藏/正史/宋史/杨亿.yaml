events:
- id: guji-杨亿-event-birth
  event_type: birth
  date: 约974
  year_of: 974
  date_precision: year
  title_zh: 杨亿生于建州浦城
  description: 将生之夕，祖文逸梦道士自称怀玉山人来谒；既生有毛被体，长尺余，经月乃落。
- id: guji-杨亿-event-education
  event_type: career
  date: 约0984
  year_of: 984
  date_precision: year
  title_zh: 太宗诏试词艺，授秘书省正字
  description: 雍熙初年十一岁，太宗闻其名，诏张去华试诗赋五篇，下笔立成；送中书又赋诗，宰相削章为贺，即授正字、赐袍笏。
- id: guji-杨亿-event-jinshi
  event_type: career
  date: 约0992
  year_of: 992
  date_precision: year
  title_zh: 淳化中献《二京赋》赐进士第
  description: 诣阙献文，改太常寺奉礼郎；试翰林，赐进士第，迁光禄寺丞；后以未贴职不预曲宴，即直集贤院。
- id: guji-杨亿-event-shilu
  event_type: career
  date: 约0996
  year_of: 996
  date_precision: year
  title_zh: 预修《太宗实录》，独草五十六卷
  description: 真宗即位超拜左正言；诏钱若水修《太宗实录》八十卷，亿独草五十六卷。
- id: guji-杨亿-event-memorial
  event_type: statement
  date: 约0998
  year_of: 998
  date_precision: year
  title_zh: 咸平中上疏论灵州弃守
  description: 援汉弃朔方议、元帝弃朱崖故事，言存有大害、弃有大利，乞直弃灵州、保环庆，选将临边以计困之。
- id: guji-杨亿-event-hanlin
  event_type: career
  date: '1006'
  year_of: 1006
  date_precision: year
  title_zh: 召为翰林学士，同修国史
  description: 景德三年召为翰林学士；会修《册府元龟》，与王钦若同总其事，序次体制皆亿所定，变例多出亿手。
- id: guji-杨亿-event-chushi
  event_type: career
  date: '1016'
  year_of: 1016
  date_precision: year
  title_zh: 久疾求解职，分司西京
  description: 以久疾求解近职不许，权免朝直；不俟命归省母病，遭劾，授太常少卿分司西京，许就所居养疗。
- id: guji-杨亿-event-death
  event_type: death
  date: 1020-12
  year_of: 1020
  date_precision: month
  title_zh: 杨亿卒，年四十七
  description: 天禧四年十二月卒；录其子纮为太常寺奉礼郎。著述共一百九十四卷。
