person:
  qid: guji-杨允恭
  name_zh: 杨允恭
  names:
    zh: 杨允恭
    en: Yang Yungong
  lifespan:
    birth:
      date: '944'
      precision: year
      is_circa: true
      raw: 卒于咸平二年（999），年五十六，逆推约944年生
    death:
      date: 999-07
      precision: month
      is_circa: false
      raw: 咸平二年七月卒于升州，年五十六
  birth_date: '944'
  death_date: 999-07
  era: 北宋
  reign_ref: 宋太宗、宋真宗
  archetype: 财计能臣与捕盗干才
  dilemmas:
  - 竭民利官榷茶盐 versus 商人少利民亦困弊
  - 铁钱弊政欲革而不获推行
  - 边饷转运欲用木牛流马小车分铺而议者沮之
  lesson: 有心计、好言事，因建白而见从，摘山煮海、方舟之漕皆赖其规制而利博
  summary_first_person: 我少年倜傥任侠，蜀乱时结砦保乡，被擒而以谋自脱。后掌市舶、捕海寇、督江淮漕运与茶盐之法，屡有建白，多为朝廷采纳，收利巨万。真宗初年领都巡检使，以疾卒于升州。
  source_urls:
  - 宋史·杨允恭传
