    start_date: '997'
  decisions:
  - date: '995'
    title_zh: 议请依旧江北置榷务、均色号给商
    rationale: 新陈相糅杂以数品则商人少利，陈恕等以为允恭议是
  - date: '997'
    title_zh: 再三奏请淮南十八州军悉禁盐而官主之
    rationale: 行法宜一，禁私则利归官而弭持械为盗者
  - date: '998'
    title_zh: 上言川峡铁钱之弊，请运饶信之铜入蜀鼓铸
    rationale: 官失其利而民失其所，愿变法以革其弊
events:
- id: guji-杨允恭-event-birth
  year_of: 944
  date: 0944
  date_precision: year
  type: birth
  title_zh: 杨允恭生于汉州绵竹
  description_zh: 家世豪富，少倜傥任侠。
- id: guji-杨允恭-event-pingza
  year_of: 966
  date: 0966
  date_precision: year
  type: endeavor
  title_zh: 以策干丁德裕，署绵汉招收巡检
  description_zh: 干德中王师平蜀，允恭结砦清泉乡，被获而以谋脱，后以策干丁德裕，署绵、汉招收巡检，贼平补殿前承旨。
- id: guji-杨允恭-event-shibo
  year_of: 976
  date: 0976
  date_precision: year
  type: endeavor
  title_zh: 以殿直掌广州市舶
  description_zh: 太平兴国中掌广州市舶，因部运入奏海贼之患。
- id: guji-杨允恭-event-haize
  year_of: 978
  date: 0978
  date_precision: year
  type: endeavor
  title_zh: 为广连都巡检使，集水军歼海贼
  description_zh: 掩袭贼首斩之，伐木开道尽歼余党，夺所劫男女六十余口还其家，诏书嘉奖，转供奉官。
- id: guji-杨允恭-event-yunlu
  year_of: 985
  date: 0985
  date_precision: year
  type: endeavor
  title_zh: 督江南水运兼捕寇党
  description_zh: 遇贼百余枭其首，蹑海贼坏其幕擒数百人，自是江路无剽掠之患；任发运擘画茶盐捕贼事，岁运上供米由三百万增至六百万。
- id: guji-杨允恭-event-chaye
  year_of: 995
  date: 0995
  date_precision: year
  type: endeavor
  title_zh: 命为发运使，改擘画为制置
  description_zh: 至道初诏从允恭之议，依旧江北置榷务均色号，与李廷遂、王子舆并为发运使。
- id: guji-杨允恭-event-wuwei
  year_of: 996
  date: 0996
  date_precision: year
  type: endeavor
  title_zh: 请以无为建军
  description_zh: 巢、庐江二县道远多寇，民输劳费，允恭请以二县建军，诏许之，以无为为额。
- id: guji-杨允恭-event-gumasi
  year_of: 998
  date: 0998
  date_precision: year
  type: endeavor
  title_zh: 置估马司平北边卖马之估
  description_zh: 咸平初北边卖马未有定直，命允恭主平其估，置估马司铸印以为常制。
- id: guji-杨允恭-event-xunjian
  year_of: 998
  date: 0998
  date_precision: year
  type: endeavor
  title_zh: 王均之乱，命为荆湖江浙都巡检使
  description_zh: 真宗虑南方有聚寇，命允恭为荆湖、江、浙都巡检使，杨守遵副之。
- id: guji-杨允恭-event-death
  year_of: 999
  date: 999-07
  date_precision: month
  type: death
  title_zh: 卒于升州
  description_zh: 咸平二年七月以疾卒于升州，年五十六，赙赠甚厚，命扬州官造第赐其家。
