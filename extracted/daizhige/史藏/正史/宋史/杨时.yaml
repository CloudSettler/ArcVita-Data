      raw: 卒年八十三，高宗朝绍兴初
  birth_date: 1053
  death_date: 1135
  era: 北宋至南宋初
  reign_ref: 熙宁、元祐、宣和、靖康、建炎、绍兴
  archetype: 理学家与诤臣
  dilemmas:
  - 师道与仕途：调官不赴而以师礼事程颢，弃科举竞进之心求孔孟绝学
  - 和战之择：靖康间极言不可割三镇讲和，抗疏直谏而忤时议
  - 学术之辨：晚年力辟王安石经学邪说，敢犯众议而罢其配享
  lesson: 程门立雪见诚敬，浮沉州县四十七年而德望日重；晚居谏省虽仅九十日，论列皆切于世道，守道不阿乃成程氏正宗。
  summary_first_person: 我杨时字中立，南剑将乐人。熙宁九年中进士，然调官不赴，以师礼见程颢于颍昌；颢目送我归而叹「吾道南矣」。又师程颐，一日与游酢侍立门外，雪深一尺而不去。杜门不仕十年，历知浏阳、余杭、萧山三县皆有惠政，四方学者不远千里从游，号龟山先生。年四十始见程颐所传之学，辨《西铭》理一分殊而豁然无疑。浮沉州县四十七年，晚登朝廷，极言燕云之弊、力阻割三镇，乞诛姚古以肃军政，兼任国子祭酒，首言别辟官属之非，又抗疏辟王安石配享之谬，使其降从祀。上四疏乞罢，优游林泉，以著书讲学终老，卒年八十三，谥文靖。东南学者推我为程氏正宗，朱熹、张栻之学皆源于此。
  source_urls:
  - 宋史卷四百二十八
