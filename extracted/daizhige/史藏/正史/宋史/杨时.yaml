  date: 1053
  type: birth
  title_zh: 杨时生于南剑将乐
  description: 字中立，幼颖异，能属文，稍长潜心经史。
- id: guji-杨时-event-jinshi
  year_of: 1076
  date: 1076
  type: career
  title_zh: 中进士第
  description: 熙宁九年登进士第，然调官不赴，转而求师问道。
- id: guji-杨时-event-chengmen
  year_of: 1093
  date: 1093
  precision: year
  is_circa: true
  type: career
  title_zh: 程门立雪
  description: 年四十见程颐于洛。一日颐偶瞑坐，时与游酢侍立不去，颐既觉，门外雪深一尺。
  tags:
  - 治学
- id: guji-杨时-event-dao-nan
  year_of: 1085
  date: 1085
  precision: year
  is_circa: true
  type: career
  title_zh: 程颢目送叹「吾道南矣」
  description: 时以师礼见颢于颍昌，相得甚欢；其归也，颢目送之曰：吾道南矣。四年而颢死，时设位哭寝门，赴告同学。
- id: guji-杨时-event-zhixian
  year_of: 1090
  date: 1090
  precision: decade
  is_circa: true
  type: career
  title_zh: 知浏阳、余杭、萧山三县
  description: 皆有惠政，民思不忘，德望日重，四方学者不远千里从之游，号曰龟山先生。
- id: guji-杨时-event-zhaodui
  year_of: 1120
  date: 1120
  precision: year
  is_circa: true
  type: career
  title_zh: 召对陈时政之弊
  description: 高丽国主问龟山安在，使者以闻，遂召为秘书郎、迁著作郎。面对历陈祖宗之法勿问熙丰元祐，一趋于中；又陈燕云之师宜退守内地，乞为《宣和会计录》。
- id: guji-杨时-event-sanjian
  year_of: 1126
  date: 1126
  precision: year
  is_circa: true
  type: career
  title_zh: 力阻割三镇讲和
  description: 除右谏议大夫兼侍讲。极言三镇为河朔要藩不可弃，乞用种师道、刘光世；太原围闭，上疏乞诛姚古以肃军政。
- id: guji-杨时-event-anzishi
  year_of: 1126
  date: 1126
  precision: year
  is_circa: true
  type: career
  title_zh: 抗疏辟王安石配享
  description: 兼国子祭酒，历数安石变乱法度、倡奢启侈之害，乞追夺王爵、毁去配享之像。疏上，安石遂降从祀之列。
- id: guji-杨时-event-gaizong
  year_of: 1127
  date: 1127
  type: career
  title_zh: 高宗即位除工部侍郎
  description: 陛对言圣贤之君以典学为务，乞修《建炎会计录》、恤勤王之兵、宽假言者，连章丐外。
- id: guji-杨时-event-zhishi
  year_of: 1130
  date: 1130
  precision: year
  is_circa: true
  type: career
  title_zh: 以本官致仕
  description: 优游林泉，以著书讲学为事，绍兴初崇尚元祐学术源出于时。
- id: guji-杨时-event-death
  year_of: 1135
  date: 1135
  type: death
  title_zh: 卒，谥文靖
  description: 卒年八十三，谥文靖。东南学者推时为程氏正宗。
