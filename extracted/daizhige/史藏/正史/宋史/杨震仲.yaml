- id: guji-杨震仲-event-refuse
  name_zh: 拒吴曦驰檄之招
  date: '1207'
  year_of: 1207
  summary: 吴曦叛，驰檄招震仲，震仲辞疾不行，并劝史次秦脱去。
- id: guji-杨震仲-event-death
  name_zh: 饮毒殉节
  date: '1207'
  year_of: 1207
  summary: 郭鹏飞促行益急，震仲夜漏三鼓呼索汤，饮毒而死，阖郡流涕。
- id: guji-杨震仲-event-honor
  name_zh: 朝廷追赠旌忠
  date: '1208'
  year_of: 1208
  summary: 明年吴曦伏诛，赠朝奉大夫、直宝谟阁，官其二子，表里曰义荣，立庙旌忠，谥节毅。
