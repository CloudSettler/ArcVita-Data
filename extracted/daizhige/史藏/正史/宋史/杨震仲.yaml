  archetype: 忠节死义之臣
  dilemmas:
  - 吴曦叛宋招降，从之则失节，不从则祸立至
  lesson: 大节当前，义不可夺；一死可全名，亦可激义士之心。
  summary_first_person: 我杨震仲早负气节，知新井县有惠政，权大安军时吴曦叛乱驰檄招我，我辞疾不行，宣言大安为西蜀第一州，首从其招则诸郡风靡，力不能拒，惟义死之。郭鹏飞促行甚急，我夜半饮毒自尽，遗书家人谓死止一身不及妻子。曦伏诛后，朝廷赠直宝谟阁，表我里曰义荣，立庙旌忠，谥节毅。
