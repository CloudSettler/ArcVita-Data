events:
- id: guji-柳开-event-youth
  date: 959-01-01
  year_of: '959'
  title_zh: 侍父任南乐，取剑逐盗断其足指
  content_zh: 周显德末，柳开年十三，夜盗入室，家人恐不敢动，开亟取剑逐之，挥刃断盗二足指。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-jinshi
  date: '973'
  year_of: '973'
  title_zh: 开宝六年举进士
  content_zh: 以文贽王祐、杨昭俭、卢多逊，皆蒙赏激延奖，举进士，补宋州司寇参军。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-govern
  date: 975-06-01
  year_of: '975'
  title_zh: 以治狱称职，迁录事参军
  content_zh: 补宋州司寇参军，以治狱称职，迁本州录事参军，后擢右赞善大夫。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-shijiang
  date: 986-05-01
  year_of: '986'
  title_zh: 北征部送军粮，识契丹诈降之谋
  content_zh: 雍熙北征，开部送军粮，谓米信“无约而请和，谋也”，请急攻之，信迟疑不决，后果为贼所乘。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-kangshu
  date: 987-01-01
  year_of: '987'
  title_zh: 使河北抗疏，愿复幽蓟
  content_zh: 开抗疏自荐，愿得步骑数千任以河北用兵之地，为陛下复幽、蓟，虽身没战场亦所愿。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-suanshi
  date: 988-06-01
  year_of: '988'
  title_zh: 知全州，招抚西溪洞粟氏
  content_zh: 全州西溪洞粟氏聚族五百余钞劫，开遣吏谕降，粟氏惧而率酋来归，开作《时鉴》刻石戒之。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-daizhou
  date: 997-01-01
  year_of: '997'
  title_zh: 知代州，葺城垒战具
  content_zh: 真宗即位，命知代州，开上言选贤能镇西鄙、去繁省冗等事；开至州葺城垒战具，诸将多不协。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-succession
  date: 998-01-01
  year_of: '998'
  title_zh: 因诸将不协求换郡，徙忻州、沧州
  content_zh: 开谓诸将怨我，恐寇至而危，即求换郡，徙忻州刺史，继而徙沧州。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-death
  date: '1000'
  year_of: '1000'
  title_zh: 卒于沧州道中
  content_zh: 开在沧州道上病首疡卒，年五十四。录其子涉为三班奉职。著有《家戒》千余言刻石训子。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
- id: guji-柳开-event-family
  date: 1000-06-01
  year_of: '1000'
  title_zh: 子嗣记闻
  content_zh: 长子涉录为三班奉职；兄肩吾至御史，肩吾三子湜、灏、沆并进士第。
  source_refs:
  - https://zh.wikisource.org/wiki/宋史/卷440
