person:
  qid: guji-柳开
  name_zh: 柳开
  names:
    zh: 柳开
    en: Liu Kai
  lifespan:
    birth:
      date: '946'
      precision: year
      is_circa: true
      raw: 据卒年五十四推算
    death:
      date: '1000'
      precision: year
      is_circa: true
      raw: 在沧州道上病卒
  birth_date: 约946年
  death_date: 约1000年
  era: 北宋初
  reign_ref: 宋太祖开宝至真宗咸平年间
  archetype: 古文先驱
  dilemmas:
  - 幼年遇盗：家人恐惧不动，柳开拔剑追贼断其二足指
  - 使河北抗疏请兵：愿率步骑数千复幽蓟，虽身没战场亦愿
  - 全州招抚西溪洞粟氏：抚以厚赏免兵祸兼施威慑
  - 移邠州为民争罢苛运：书责转运使，民数千号诉得罢
  lesson: 文当开圣道之涂，勇可挥刃断敌指，忠持久矣成仁。
  summary_first_person: 我柳开，字仲涂，慕韩柳之文，改名字以开圣道之涂。举进士而佐郡，督运饷、知州事，屡历边席。北征之役，我识契丹诈降之谋；使河北，我抗疏乞兵，愿出生入死以复幽蓟。招抚粟氏、罢民苛运，皆有可称。晚知代州，葺城战具而诸将不协，求换郡徙忻州，终赴沧州道中病卒。倜傥重义，有集十五卷，《家戒》刻石以训诸子。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷440
