  - 直言论事招怨与仕途安危之间的抉择
  - 濮议中坚持礼制与朝臣围攻的冲突
  lesson: 文章止于润身，政事可以及物；遇事不敢忽，以宽简为政。
  summary_first_person: 我是欧阳修，字永叔，庐陵人。四岁失怙，母亲以荻画地教我读书。我倡导古文，追慕韩愈，扭转五代以来的浮靡文风；居谏职则切直敢言，虽屡遭污蔑放逐，志气自若。晚年号六一居士，官至参知政事，以太子少师致仕，谥文忠。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷319
