  era: 南宋
  reign_ref: 绍兴、隆兴、乾道、淳熙
  archetype: 直臣与治世能吏
  dilemmas:
  - 绍兴初和议风波：直言因循无备之可畏，忤秦桧被外放
  - 尊号之议：力主不加上尊号，违忤德寿宫之怒
  - 仕与隐：屡乞补外，终于在平江府失意而卧家
  lesson: 忠言直行，虽困厄十七年而不改其守
  summary_first_person: 我汪应辰，字圣锡，信州玉山人。十八岁中状元，因直言和议隐忧忤秦桧，流落岭峤十七年。桧死后还朝，历蜀帅、吏部尚书，遇事特立不回，好贤乐善，义理精纯。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷387
