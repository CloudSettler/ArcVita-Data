decisions:
- date: 1126
  title_zh: 上书枢密曹辅请立康王为大元帅
  rationale: 以河北揽天下之权，拥兵镇抚河北以掎金人之后，则京城之围自解。
- date: 1127
  title_zh: 缒城而出谒康王于济州劝进
  rationale: 神器久虚，异姓僭窃，宜早即位以图中兴。
- date: 1130
  title_zh: 驰往开谕李允文
  rationale: 李允文怀反侧拥众数十万，非汪若海莫能开其自新。
- date: 1130
  title_zh: 献平寇策主张化盗贼为我用
  rationale: 为国家者当化盗贼为我用，不可失英雄为国患。
- date: 1140
  title_zh: 毅然请行为顺昌乞援
  rationale: 刘锜明方略善用兵，以偏师济之必有成功，而众皆无敢往者。
events:
- id: guji-汪若海-event-birth
  title_zh: 汪若海出生
  event_type: birth
  date: ''
  date_raw: 无考
  year_of: ''
  participants:
  - guji-汪若海
  summary_zh: 汪若海，字东叟，歙人。生年无考。
- id: guji-汪若海-event-jingkang-shangshu
  title_zh: 靖康元年应诏上书论兵
  event_type: career
  date: 1126
  date_raw: '1126'
  year_of: 1126
  participants:
  - guji-汪若海
  summary_zh: 金人侵扰，朝廷下诏求知兵者，若海应诏，未三刻而文成，擢高等。
- id: guji-汪若海-event-qingli-kangwang
  title_zh: 上书请立康王为大元帅
  event_type: career
  date: 1126
  date_raw: '1126'
  year_of: 1126
  participants:
  - guji-汪若海
  - 曹辅
  - 赵构
  summary_zh: 若海请以康王为大元帅拥兵镇抚河北，以掎金人之后。曹辅以其书进钦宗，因宰相何㮚执议不果遣。
- id: guji-汪若海-event-jizhou-quanjin
  title_zh: 缒城出谒康王于济州劝进
  event_type: career
  date: 1127
  date_raw: '1127'
  year_of: 1127
  participants:
  - guji-汪若海
  - 赵构
  summary_zh: 二帝北行后，若海袖书抗粘罕请存赵氏，缒城而出，谒康王于济州，谓宜早即位以图中兴。
- id: guji-汪若海-event-shouguan
  title_zh: 高宗即位后授官
  event_type: career
  date: 1127
  date_raw: '1127'
  year_of: 1127
  participants:
  - guji-汪若海
  - 宋高宗
  summary_zh: 一日间三被顾问，补修职郎，充帐前差使；高宗即位后改承奉郎，迁江南经制使。
- id: guji-汪若海-event-shuoxiang-liyunwen
  title_zh: 说降跋扈的李允文
  event_type: career
  date: 1130
  date_raw: 约1130
  year_of: 1130
  is_circa: true
  participants:
  - guji-汪若海
  - 李允文
  - 汤东野
  summary_zh: 若海驰往，谕以成败逆顺，示以朝廷威德，复谈三策，允文大感悟，即举军东下。
- id: guji-汪若海-event-zhangyong-touxiang
  title_zh: 招张用等群盗归朝
  event_type: career
  date: 1130
  date_raw: 约1130
  year_of: 1130
  is_circa: true
  participants:
  - guji-汪若海
  - 张用
  summary_zh: 若海移书招张用、曹成、李宏、马友同归朝廷，张用一见，以其众二十万解甲效顺。
- id: guji-汪若海-event-cao-cheng-dun
  title_zh: 计夺王林军印迫走曹成
  event_type: career
  date: 1130
  date_raw: 约1130
  year_of: 1130
  is_circa: true
  participants:
  - guji-汪若海
  - 曹成
  summary_zh: 曹成怒欲杀若海，若海夜宿王林军帐，以计得军印，夺其众五千人，次日曹成遁走，群盗解散。
- id: guji-汪若海-event-pingkou-ce
  title_zh: 献平寇策
  event_type: career
  date: 1132
  date_raw: 约1132
  year_of: 1132
  is_circa: true
  participants:
  - guji-汪若海
  summary_zh: 若海以为当化盗贼为我用，不可失英雄为国患，献平寇策，朝廷悉用之，湖湘遂安。
- id: guji-汪若海-event-fusanjing
  title_zh: 复三京后擢通判顺昌府
  event_type: career
  date: 1139
  date_raw: '1139'
  year_of: 1139
  participants:
  - guji-汪若海
  summary_zh: 绍兴九年复三京祗谒陵寝，事还以前功，旬月四迁至承议郎、通判顺昌府。
- id: guji-汪若海-event-shunchang-qiyuan
  title_zh: 毅然请行为顺昌乞援
  event_type: career
  date: 1140
  date_raw: '1140'
  year_of: 1140
  participants:
  - guji-汪若海
  - 刘锜
  summary_zh: 金人奄至，刘锜众不满三万遣人丐援，无敢往者，若海毅然请行，具述锜方略，朝廷从之。
- id: guji-汪若海-event-shunchang-shengli
  title_zh: 金兵果败去
  event_type: career
  date: 1140
  date_raw: '1140'
  year_of: 1140
  participants:
  - guji-汪若海
  - 刘锜
  summary_zh: 朝廷从若海之言遣偏师济刘锜，金兵果败去。拓皋之役后以劳两转至朝散郎。
- id: guji-汪若海-event-death
  title_zh: 汪若海病逝
  event_type: death
  date: 1142
  date_raw: 约1142
  year_of: 1142
  is_circa: true
  participants:
  - guji-汪若海
  summary_zh: 时方经略中原，朝廷议起若海知江州，而若海死矣。
