person:
  qid: guji-汪若海
  name_zh: 汪若海
  names:
    zh: 汪若海
    en: Wang Ruohai
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: 1142
      precision: year
      is_circa: true
      raw: 绍兴年间，方经略中原时病逝
  birth_date: ''
  death_date: 1142
  era: 南宋
  reign_ref: 靖康 / 建炎 / 绍兴
  archetype: 力挽狂澜的谋略之士
  dilemmas:
  - 河北弃守之争：主张以河北揽天下之权，反对闭关养敌
  - 化盗为兵：当用盗贼为我用，不可失英雄为国患
  lesson: 危局之中，胆识与洞察胜于位高权重；说降群盗、纵论川陕，皆以一言定势。
  summary_first_person: 我汪若海，未冠入太学，靖康应诏论兵，文不三刻而成。京城失守后奔济州劝康王即位，其后说降李允文、张用等数十万众，献平寇策以安湖湘。顺昌告急，众不敢往，我毅然赴朝乞援，刘锜遂败金兵。惜乎经略中原方兴，而吾病卒。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷404
