  reign_ref: 熙宁（宋神宗年号，1068–1077）
  archetype: 学者型官员与科学家
  dilemmas:
  - 于熙宁历法改革中主持新历，须在瞬息万变的天象观测与传统历算成说之间取舍
  - 撰《熙宁奉元历》诸书，须在朝廷颁历之政与个人实测之学之间权衡
  lesson: 观天制历，推步有据；著书立成，学以传世。
  summary_first_person: 我是沈括，北宋学者。熙宁年间我主持修订历法，撰成《熙宁奉元历》一部，并著历经三卷、《立成》十四卷、《备草》六卷、《比较交蚀》六卷，皆载于《宋史·艺文志》历算类。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷207
