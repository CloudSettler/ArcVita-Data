person:
  qid: guji-沈畸
  name_zh: 沈畸
  names:
    zh: 沈畸
    en: Shen Qi
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: 约1107
      precision: year
      is_circa: true
      raw: 蔡京兴苏州钱狱后贬监信州酒税，未几，卒
  death_date: 约1107
  era: 北宋
  reign_ref: 宋徽宗（崇宁、大观年间）
  archetype: 刚直御史·平冤安民
  dilemmas:
  - 为天子耳目司，是傅会权要、杀人以苟富贵，还是执法平冤、自毁前程？
  lesson: 执法者不阿权贵，宁失荣宠，不失平恕。
  summary_first_person: 我是湖州德清人沈畸，登进士第，历官州县，崇宁间擢监察御史。我上匦言十事，论当十钱、夹锡钱之弊最为剀切；蔡京兴苏州钱狱欲陷章綖兄弟，遣我前往鞫治，我即日决释无佐证者七百人，平反以闻。京怒，削我三秩，贬监信州酒税，未几而卒。建炎初，朝廷赠我龙图阁直学士。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷348
