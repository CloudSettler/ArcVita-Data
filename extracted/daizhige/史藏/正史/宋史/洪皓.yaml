    labels:
      zh: 秀军不敢犯皓门
    start_date: '1121'
  decisions:
  - date: '1120'
    title_zh: 救荒自任，发廪损直以粜
    rationale: 大水民多失业，愿以一身易十万人命。
events:
- id: guji-洪皓-event-birth
  type: birth
  date: ''
  year_of: ''
  description: 洪皓生年不详，卒年六十八。
- id: guji-洪皓-event-jinshi
  type: career
  date: '1115'
  year_of: 1115
  description: 登政和五年进士第。王黼、朱勔皆欲婚之，力辞。
- id: guji-洪皓-event-famine
  type: career
  date: '1120'
  year_of: 1120
  description: 宣和中为秀州司录，大水民失业，白郡守发廪损直以粜，别以青白帜识民，令严而惠遍。
- id: guji-洪皓-event-grain
  type: career
  date: '1120'
  year_of: 1120
  description: 白守邀留浙东纲米济民，守不可，曰愿以一身易十万人命，人号洪佛子。
- id: guji-洪皓-event-envoy
  type: career
  date: 1129-05
  year_of: 1129
  description: 建炎三年五月擢徽猷阁待制，假礼部尚书，为大金通问使，北使金国。
- id: guji-洪皓-event-lengshan
  type: career
  date: '1130'
  year_of: 1130
  description: 粘罕迫仕刘豫，皓坚拒愿就鼎镬，得流递冷山，教陈王悟室八子。
- id: guji-洪皓-event-emperor-letter
  type: career
  date: '1130'
  year_of: 1130
  description: 二帝迁居五国城，皓在云中密遣人奏书，以桃梨粟面献，二帝始知帝即位。
- id: guji-洪皓-event-secret-letter
  type: career
  date: '1140'
  year_of: 1140
  description: 绍兴十年，因谍者赵德，书机事数万言藏故絮中归达于帝，言金人震惧宜再举。
- id: guji-洪皓-event-taihou-letter
  type: career
  date: '1141'
  year_of: 1141
  description: 绍兴十一年，求得太后书遣李微持归，帝大喜。
- id: guji-洪皓-event-return
  type: career
  date: 1143-07
  year_of: 1143
  description: 绍兴十二年七月见于内殿，留北凡十五年归国，帝称忠贯日月，虽苏武不能过。
- id: guji-洪皓-event-banish
  type: career
  date: '1144'
  year_of: 1144
  description: 忤秦桧，出知饶州，后李勤诬之，责濠州团练副使，安置英州居九年。
- id: guji-洪皓-event-death
  type: death
  date: '1155'
  year_of: 1155
  description: 徙袁州，至南雄州卒，年六十八。死后一日，桧亦死。后谥忠宣。
