  decisions:
  - date: '1130'
    title_zh: 拒仕刘豫
    rationale: 万里衔命不得奉两宫南归，恨不能磔逆豫，不愿偷生鼠狗间，愿就鼎镬无悔。
  - date: '1140'
    title_zh: 遣谍者密奏机事
    rationale: 顺昌之役金人震惧，燕山珍宝尽徙以北，意欲弃燕，今再举尚可。
  - date: 1143-07
    title_zh: 力求郡养母
    rationale: 留北十五年，忠节既全，欲归养母。
  - date: 1143-08
    title_zh: 奏留金所取赵彬等家属不遣
    rationale: 恐金知虚实而益轻中国，宜俟渊圣及皇族归乃遣。
- id: guji-洪皓-endeavor-2
  name_zh: 拯荒济民
  phases:
