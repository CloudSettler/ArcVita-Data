person:
  qid: guji-洪皓
  name_zh: 洪皓
  names:
    zh: 洪皓
    en: Hong Hao
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: '1155'
      precision: year
      is_circa: false
      raw: 至南雄州卒，年六十八
  birth_date: ''
  death_date: '1155'
  era: 南宋
  reign_ref: 政和、建炎、绍兴
  archetype: 忠贞使臣
  dilemmas:
  - 拒仕刘豫，宁死不屈
  - 出使金国被拘留十五年，忠节与归乡两难
  - 直言忤秦桧，忠言与仕途两难
  lesson: 留节不改，虽历十五年蒙难而忠义闻于天下，然不死于敌国而死死于谗慝。
  summary_first_person: 我洪皓，字光弼，番昜人。政和五年登第，建炎三年使金被拘留冷山、燕地凡十五年，拒仕刘豫，教金人子弟，密奏机事归宋。绍兴十二年归国，因直言忤秦桧，屡遭贬谪，死于南雄。
  source_urls:
  - 宋史 卷三百七十三 · 洪皓传
