    title_zh: 独遣更休四将
    rationale: 夏若并兵虽八将不敌，若不来四将足矣；塞上遂无风尘警
  - date: 约1090
    title_zh: 九上章争绥德画境
    rationale: 是一举而失百里，必不可；取城易，弃城难
