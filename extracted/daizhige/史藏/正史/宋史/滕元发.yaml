  decisions:
  - date: 约1070
    title_zh: 谏宰相以其子判鼓院
    rationale: 人有诉宰相，使其子达之，可乎；神宗悟而罢之
  - date: 约1075
    title_zh: 力陈罢新法之奏
    rationale: 熙宁三年以来所行不便者，悉罢之，则民心悦而天意解，虽不听仍屡上章
- id: guji-tengyuanfa-endeavor-2
