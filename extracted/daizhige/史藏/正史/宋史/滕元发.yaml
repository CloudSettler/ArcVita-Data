person:
  qid: guji-tengyuanfa
  name_zh: 滕元发
  names:
    zh: 滕元发
    en: Teng Yuanfa
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: ''
    death:
      precision: year
      is_circa: true
      raw: 哲宗时卒，年七十一
  death_date: 约1090
  era: 北宋
  reign_ref: 仁宗至哲宗
  archetype: 直臣名将
  dilemmas:
  - 直言极谏与屡遭贬斥
  - 边事主战主守的两难
  lesson: 天知吾直，上知吾忠，何忧之有
  summary_first_person: 我以廷试第三人入仕，历仕仁、英、神、哲四朝，论事无所隐讳。我进言朋党误国、极谏新法之害，虽屡遭贬黜，然治边凛然，威行西北，终至名帅之称。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷332
