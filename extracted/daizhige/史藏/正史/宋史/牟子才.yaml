person:
  qid: guji-牟子才
  name_zh: 牟子才
  names:
    zh: 牟子才
    en: Mou Zicai
  lifespan:
    birth:
      date: '1191'
      precision: year
      is_circa: true
      raw: 约生于淳熙、绍熙年间（史无明载）
    death:
      date: '1275'
      precision: year
      is_circa: true
      raw: 约卒于宋度宗朝末（以资政殿学士致仕后卒）
  birth_date: '1191'
  death_date: '1275'
  era: 南宋
  reign_ref: 宁宗·嘉定；理宗·宝庆至景定；度宗·咸淳
  archetype: 直臣·经筵讲官·蜀中名士
  dilemmas:
  - 直言极谏与触怒权相（史弥远、史嵩之、郑清之、丁大全、贾似道）之间的抉择
  - 屡辞荣秩、力守清节与朝廷强留之间的反复
  - 遭董宋臣、丁大全诬劾贬降而终以公论得白
  lesson: 腕可断，词不可改——以清节直道立身，虽权势熏天不可夺其守。
  summary_first_person: 我是井研牟子才，从魏了翁诸先生学，举进士而对策诋史弥远。一生为官不避权贵：奏留贤者、指斥宦寺、力辞恩禄、戏写高力士脱靴讥董宋臣而被诬贬；家无余赀，身后卖金带乃克葬。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷411
endeavors:
- id: guji-牟子才-endeavor-1
  name_zh: 蜀中求学与入仕
  phases:
  - key: brewing
    name_zh: 少时闭户读书，师从陈咸，学于魏了翁、杨子谟、虞刚简、李方子
    labels:
      zh:
      - 求学
      - 蜀中
    start_date: '1210'
  - key: breakthrough
    name_zh: 嘉定十六年举进士，对策诋史弥远，调洪雅县尉
    labels:
      zh:
      - 进士
      - 入仕
    start_date: '1223-01-01'
    highlight_event_id: guji-牟子才-event-jiangshi
  - key: climax
    name_zh: 监榷茶司、辟四川茶马司，文州视军饷甫出境而州陷
    labels:
      zh:
      - 川蜀任职
    start_date: '1224-01-01'
    highlight_event_id: guji-牟子才-event-wenzhou
  decisions:
  - date: '1223-01-01'
    title_zh: 对策诋丞相史弥远
    rationale: 直言不讳，宁处下僚不改其守。
  - date: '1224-01-01'
    title_zh: 拂衣去魏泌之辟，不受书币之谢
    rationale: 不以屈身事使者为荣，改辟不受馈。
  - date: '1225-01-01'
    title_zh: 道遇王宣劝阻仍赴文州视军庾
    rationale: 敌且压境而职责所在，必亲至州视军库。
- id: guji-牟子才-endeavor-2
  name_zh: 朝中直谏与经筵进言
  phases:
  - key: brewing
    name_zh: 史馆检阅，入对论大臣不公不和六事、备边三策
    labels:
      zh:
      - 史职
      - 入对
    start_date: '1235-01-01'
    highlight_event_id: guji-牟子才-event-rudui
  - key: breakthrough
    name_zh: 兼崇政殿说书，随事奏陈，举朝诵其奏疏
    labels:
      zh:
      - 经筵
      - 说书
    start_date: '1250-01-01'
    highlight_event_id: guji-牟子才-event-shuoshu
  - key: climax
    name_zh: 罢公田奏议、论董宋臣、缴驳吴子聪，权礼部尚书执绥官
    labels:
      zh:
      - 直谏
      - 经筵
    start_date: '1259-01-01'
    highlight_event_id: guji-牟子才-event-dikang
  - key: closure
    name_zh: 度宗即位授翰林学士，力辞，以端明殿学士进，资政殿学士致仕
    labels:
      zh:
      - 致仕
    start_date: '1265-01-01'
  decisions:
  - date: '1240-01-01'
    title_zh: 请为济王立后以回天怒，上徽钦时十证封事
    rationale: 借古证今，冀帝警惧更化。
  - date: '1263-01-01'
    title_zh: 不奉诏改谪词，曰腕可断词不可改
    rationale: 舍人院掌制书，褒贬有体，不为人情所移。
  - date: '1263-01-01'
    title_zh: 缴吴子聪知合门事之除命
    rationale: 依凭城社、以官爵为市者，公论所切齿，不可用。
  - date: '1262-01-01'
    title_zh: 谏止帝幸西太乙宫实欲游西湖
    rationale: 人主一动系天下之望，当恐惧修省。
  - date: '1260-01-01'
    title_zh: 应诏上封事请罢公田
    rationale: 公田病民，更七司法以纾天下。
  - date: '1265-01-01'
    title_zh: 力辞翰林学士不拜
    rationale: 雅不欲以旧学之私更求进用，屡请去职。
events:
- id: guji-牟子才-event-birth
  date: '1191'
  year_of: 1191
  type: birth
  summary: 牟子才生于眉州井研，八世祖允良一门在淳化中盗乱间几尽殒，惟姑得免。
- id: guji-牟子才-event-jiangshi
  date: '1223-01-01'
  year_of: 1223
  type: endeavor
  label_zh: 嘉定十六年举进士
  summary: 对策诋丞相史弥远，调嘉定府洪雅县尉，遂起家。
- id: guji-牟子才-event-wenzhou
  date: '1226-01-01'
  year_of: 1226
  type: endeavor
  label_zh: 文州视军饷
  summary: 制置司遣视王宣军饷于邓艾缒兵之文州，道遇宣劝阻不可，至州视军庾而还，甫出境州陷。
- id: guji-牟子才-event-rudui
  date: '1235-01-01'
  year_of: 1235
  type: endeavor
  label_zh: 擢史馆检阅入对
  summary: 首言大臣不公不和六事，次陈备边三策，理宗顾问甚悉，翼日谕宰相可峻擢。
- id: guji-牟子才-event-shuoshu
  date: '1250-01-01'
  year_of: '1250'
  type: endeavor
  label_zh: 兼崇政殿说书
  summary: 随事奏陈，举朝诵其奏疏皆曰有德之言；因宰相惧其言己，并晚讲于早而不得独对。
- id: guji-牟子才-event-fujie
  date: '1261-01-01'
  year_of: 1261
  type: endeavor
  label_zh: 知太平州兴利除弊
  summary: 教民孝弟、修采石战舰、补上供纲租、蠲酒息苗税，创抵库以助籴本，并建李白祠自为记刻石。
- id: guji-牟子才-event-dikang
  date: '1260-01-01'
  year_of: 1260
  type: endeavor
  label_zh: 遭诬劾降官，吴子明雪之
  summary: 丁大全与董宋臣合谋嗾御史诬劾其公燕馈遗入己，密问安吉守吴子明奏其四壁萧然，事遂解。
- id: guji-牟子才-event-shishang
  date: '1262-01-01'
  year_of: 1262
  type: endeavor
  label_zh: 蜀边防卫之策
  summary: 言蜀当以嘉、渝、夔三城为要，各须万人屯守，不然不出三年蜀必亡。
- id: guji-牟子才-event-death
  date: '1275'
  year_of: '1275'
  type: death
  summary: 以资政殿学士致仕，卒，赠四官，官其后二人；身后家无余赀，卖金带乃克葬。
