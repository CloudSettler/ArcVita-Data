  dilemmas:
  - 以无行之身为国使，屈身虎口求和而名节受人讥议
  - 金人胁以伪官，守节则死，受官则辱
  lesson: 使四方有辱国之命，成语大事，不辱君命，可谓士矣；临死不易其节
  summary_first_person: 我王伦是莘县人出身，.s může家贫无行，靖康之变中乘势弹压都人之乱而骤显身手，此后四次奉使金国，冒万死一生为宋金和议奔走。金人拘我河间六年，欲授我伪职，我冠带南向再拜恸哭，拒之而慷慨就死，谥号愍节。
