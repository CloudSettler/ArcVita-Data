  dilemmas:
  - 蒙军压境下孤守合州，兵力粮饷俱缺，须在坚守与求援之间权衡
  - 蜀地战乱频仍，帅臣更迭、政争不断，仍须专心御敌
  lesson: 危城之下，忠勇与坚守可为一方生民托命。
  summary_first_person: 我王坚，南宋理宗朝武将。宝祐二年，蒙古兵入合州、广安军境，我与曹世雄等奋力战御有功，蒙诏官两转。同年七月，朝廷以我为兴元都统兼知合州，肩负守御川东重镇之责，其后更以合州城（钓鱼城）为屏障，力抗大元兵锋。
  source_urls:
