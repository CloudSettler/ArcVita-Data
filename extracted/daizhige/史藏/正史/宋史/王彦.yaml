  birth_date: 约1080
  death_date: '1139'
  era: 南宋
  reign_ref: 建炎、绍兴
  archetype: 忠义名将·八字军统帅
  dilemmas:
  - 力主北伐忤时相，兵权被夺
  - 张浚富平欲大举，谏不可而不用
  lesson: 忠义聚众可撼河朔，然和议之时，名将难伸其志。
  summary_first_person: 我王彦，字子才，上党人。金人攻汴，我弃家赴阙，率七千人渡河破敌，复新乡。我将士刺面明「赤心报国，誓杀金贼」之志，号八字军，众十余万，威振河朔。后随张浚入蜀，守金州，破桑仲、李忠诸贼，御金人于饶风。又措置荆南屯田，营田八百五十顷。惜朝廷方挠于和议，召我还而夺我兵柄，使治一郡。绍兴九年卒于官，年五十。
