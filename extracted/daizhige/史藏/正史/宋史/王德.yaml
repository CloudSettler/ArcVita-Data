events:
- id: guji-王德-event-birth
  event_type: birth
  date: ''
  year_of: 0
  description: 生年无载，通远军熟羊砦人
- id: guji-王德-event-death
  event_type: death
  date: '1155'
  year_of: 1155
  description: 绍兴二十五年卒，赠检校少保，再赠少傅
- id: guji-王德-event-1
  event_type: military_action
  date: '-1126'
  year_of: 1126
  description: 隶熙帅姚古，金人入侵时奉命间谍怀泽之间，斩一酋而还，补进武校尉
- id: guji-王德-event-2
  event_type: military_action
  date: '-1126'
  year_of: 1126
  description: 以十六骑夜入隆德府治，执伪守姚太师，手杀数十百人，遂号王夜叉
- id: guji-王德-event-3
  event_type: appointment
  date: '1127'
  year_of: 1127
  description: 建炎元年以勤王师倍道趋阙，改隶刘光世，平济南李昱、池阳张遇
- id: guji-王德-event-4
  event_type: battle
  date: '1127'
  year_of: 1127
  description: 上蔡皂角桥以百骑大呼王师大至，骇退李成部众，追杀甚众，遂袭取李成，授武略大夫
- id: guji-王德-event-5
  event_type: battle
  date: '1131'
  year_of: 1131
  description: 崇明沙亲执旗麾兵破邵青水寨，后万矢齐发破火牛阵，邵青自缚请命，迁中亮大夫、同州观察使
- id: guji-王德-event-6
  event_type: battle
  date: '1134'
  year_of: 1134
  description: 滁州为金兵所破，德越江袭夺之，追至桑根，擒女真万户卢孛及千户十余人
- id: guji-王德-event-7
  event_type: battle
  date: '1141'
  year_of: 1141
  description: 柘皋之战，夜拔和州，引弓毙酋，以长斧如墙而进，大破兀术铁骑十余万；刘锜请以兄礼事之
- id: guji-王德-event-8
  event_type: military_action
  date: '1140'
  year_of: 1140
  description: 入宿州降马秦、耶律温，进趋亳州，郦琼闻风遁走；请进取东都不果，班师策功第一，封陇西郡侯
- id: guji-王德-event-9
  event_type: appointment
  date: '1141'
  year_of: 1141
  description: 累迁侍卫亲军马步军都虞候；后拜清远军节度使、建康府驻札御前诸军都统制，历浙东福建总管、荆南副都统制
