  name_zh: 王樵
  names:
    zh: 王樵
    en: Wang Qiao
  lifespan:
    birth:
      date: 0962
      precision: 十年
      is_circa: true
      raw: 不详（咸平中已成年）
    death:
      date: '1060'
      precision: 十年
      is_circa: true
      raw: 不详（治平末前卒）
  birth_date: 约0962
  death_date: 约1060
  era: 北宋
  reign_ref: 咸平、治平
  archetype: 隐士·复仇求道者
  dilemmas:
  - 弃妻绝俗，访亲不获，忠孝两难
  - 求朝廷用兵灭辽复仇，策不用而自筑茧室待死
  lesson: 乱世孝子以绝俗自处，以茧室自铭其不用于世之痛。
  summary_first_person: 我王樵，字肩望，淄川人，善考《易》。契丹掠我双亲，访求累年不获，遂刻木招魂，服丧六年，自称赘世翁，以论兵击剑为事。屡游塞下画策求灭辽复讐而不用，乃自筑茧室，病革入室自掩户而卒。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷458
