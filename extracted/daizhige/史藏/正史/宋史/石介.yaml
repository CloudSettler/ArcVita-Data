person:
  qid: guji-石介
  name_zh: 石介
  names:
    zh: 石介
    en: Shi Jie
  lifespan:
    birth:
      date: '1005'
      precision: year
      is_circa: true
      raw: 约北宋景德二年
    death:
      date: '1045'
      precision: year
      is_circa: false
      raw: 庆历五年卒
  birth_date: '1005'
  death_date: '1045'
  era: 北宋
  reign_ref: 宋仁宗庆历
  archetype: 刚烈敢言的儒学教育家
  dilemmas:
  - 直言指斥时政而招致权奸（夏竦）记恨，身后几被发棺验尸
  - 乐善疾恶、遇事敢为与明哲保身之间的冲突
  lesson: 刚直敢言可振士风，然锋芒太露亦易取祸；身后清白需赖友朋与义者相保。
  summary_first_person: 我是石介，字守道，兖州奉符人，人称徂徕先生。我笃学有志，乐善疾恶，遇事奋然敢为。丁父母忧时我耕于徂徕山下，以《易》教授于家，后入为国子监直讲，太学因我而益盛。我著《怪说》《中国论》痛斥佛老之蠹，又作《庆历圣德诗》歌颂贤臣、指斥大奸夏竦，孙复警告我祸自此始。我未及赴濮州通判之任而卒，死后竟遭诬指诈死北走契丹，众数百人具状力保，方免斵棺之辱。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷432
