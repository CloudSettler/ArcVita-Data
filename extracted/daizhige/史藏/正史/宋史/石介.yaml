  description: 丁父母忧，耕徂徕山下，葬五世未葬者七十丧，以《易》授徒，鲁人号“徂徕先生”。
  participants:
  - guji-石介
- id: guji-石介-event-works
  date: '1038'
  year_of: 1038
  type: publication
  title_zh: 著《怪说》《中国论》《唐鉴》
