  decisions:
  - date: 1043-03
    title_zh: 作《庆历圣德诗》
    rationale: 见杜衍、韩琦、范仲淹、富弼等贤臣并立、谏官齐聚，以为盛事，歌颂乃其职分；诗中“大奸”实斥夏竦，遂结深怨。
