  participants:
  - guji-石介
- id: guji-石介-event-poem
  date: 1043-03
  year_of: 1043
  type: publication
  title_zh: 作《庆历圣德诗》
  description: 庆历三年三月，歌颂杜衍、韩琦、范仲淹、富弼等一时名臣，指斥“大奸”（夏竦）；孙复曰“子祸始于此矣”。
  participants:
  - guji-石介
- id: guji-石介-event-death
  date: '1045'
  year_of: 1045
  type: death
  title_zh: 未赴濮州通判而卒，身后险遭斵棺
  description: 自请出为通判濮州，未赴而卒。会孔直温谋反，搜得介书，夏竦诬其诈死北走契丹，请发棺以验；众数百人具军令状力保，乃免斵棺。家贫，富弼、韩琦分俸买田赡其家。有《徂徕集》行于世。
  participants:
  - guji-石介
