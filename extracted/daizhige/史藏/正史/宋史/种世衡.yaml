  summary: 少尚气节，析赀时惟取图书；以放荫补将作监主簿，累迁太子中舍
- id: guji-种世衡-event-2
  type: career
  date: ''
  summary: 知泾阳县，杖脊奸吏王知谦而请罪于府
- id: guji-种世衡-event-3
  type: career
  date: ''
  summary: 忤王蒙正，坐流窦州，后经李纮等辨诬除卫尉寺丞
- id: guji-种世衡-event-4
  type: career
  date: ''
  summary: 西边用兵，签书同州、鄜州判官事
- id: guji-种世衡-event-5
  type: career
  date: ''
  summary: 建言因故宽州废垒筑城，朝廷从之，命董其役
- id: guji-种世衡-event-6
  type: career
  date: ''
  summary: 且战且城，凿地百五十尺得泉，城成赐名青涧城，迁内殿崇班知城事
- id: guji-种世衡-event-7
  type: career
  date: ''
  summary: 开营田二千顷，募商贾贷本钱通货，城遂富实
- id: guji-种世衡-event-8
  type: career
  date: ''
  summary: 大雪三尺踏险赴约劳羌部，得羌死力；课吏民射，敌不敢近
- id: guji-种世衡-event-9
  type: event
  date: 1042
  year_of: 1042
  summary: 庆历二年，野利刚浪㖫令浪埋等三人诣世衡请降，世衡知其诈而留用为间
- id: guji-种世衡-event-10
  type: event
  date: ''
  summary: 为蜡书遣王嵩遗刚浪㖫，伪许夏州节度使以诱之
- id: guji-种世衡-event-11
  type: event
  date: ''
  summary: 元昊疑刚浪㖫贰己，诛野利兄弟，反间功成
- id: guji-种世衡-event-12
  type: event
  date: ''
  summary: 元昊继遣使者请降，遂称臣如旧；庞籍疏请优进王嵩官
- id: guji-种世衡-event-13
  type: career
  date: ''
  summary: 葛怀敏败后，率羌兵数千人振泾原；后奉范仲淹檄与蒋偕筑细腰城，城成而卒
