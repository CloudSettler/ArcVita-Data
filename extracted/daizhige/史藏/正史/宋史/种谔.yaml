    rationale: 陆诜恐生事欲弗纳，谔曰必欲令㖫当以景询来易，遂止其索。
  - date: '1067'
    title_zh: 不待报悉起所部兵长驱围名山帐
    rationale: 云弟夷山先降乘机诱之，谔知机不可失，先斩后奏取绥州。
