person:
  qid: guji-种谔
  name_zh: 种谔
  names:
    zh: 种谔
    en: Zhong E
  lifespan:
    birth:
      date: '1026'
      precision: year
      is_circa: true
      raw: 生年不详（卒年五十七，约生于天圣年间）
    death:
      date: '1083'
      precision: year
      is_circa: true
      raw: 疽发背卒，年五十七，约元丰末
  birth_date: 约1026年
  death_date: 约1083年
  era: 北宋
  reign_ref: 宋仁宗至神宗朝
  archetype: 激进开边的边将
  dilemmas:
  - 专断“不待报”出师取绥州建功却遭贬，事后获帝追悔复官，功罪之间如何自处
  - 力主先取横山覆夏巢穴，而朝议改筑永乐，谋略不售反致大祸
  - 擅诛军吏威驭士卒，敢战数胜而“诈诞残忍”之评为身后毁誉所系
  lesson: 建功之勇不足以保其名，谋国之远亦需其时；刚愎专行虽能取尺寸之胜，终难辞党同竞胜之祸。
  summary_first_person: 我以父任入仕，知青涧城，不待诏命诱降嵬名山，一举取绥州，虽遭贬谪而神宗悔悟复我官。此后从韩绛城啰兀、随李宪收洮州，又上言夏主被囚可乘间捣其巢穴，得帝壮之委以西讨。米脂之役我大破夏军八万，进图横山，方策未竟而徐禧改城永乐，祸发之际我未能赴救。我善驭士卒、临敌出奇，然性诈诞残忍，识者谓我不死边事不已，功罪盖棺，任人论说。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷335
