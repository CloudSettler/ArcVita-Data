  decisions:
  - date: '1082'
    title_zh: 上言夏主秉常为其母所囚可急捣其巢穴
    rationale: 面奏“夏国无人，秉常孺子，臣往持其臂以来耳”，促成神宗决意西讨。
  - date: '1082'
    title_zh: 建言先城银州以囊括横山
    rationale: 横山多马宜稼、有盐铁之利，其势居高可俯视兴灵直覆巢穴。
events:
- id: guji-种谔-event-birth
  date: '1026'
  year_of: 1026
  type: birth
  title_zh: 种谔约生于此年
  summary_zh: 父种世衡，兄种古、弟种谊皆有将材，关中号曰三种。
- id: guji-种谔-event-suizhou
  date: '1067'
  year_of: 1067
  type: endeavor
  title_zh: 诱降嵬名山取绥州
  summary_zh: 得酋领三百、户万五千、兵万人，敌四万坌集怀远，谔开门出战追击二十里，遂城绥州。
- id: guji-种谔-event-mizhi
  date: '1082'
  year_of: 1082
  type: endeavor
  title_zh: 无定川大破夏军
  summary_zh: 夏兵八万来援，谔设伏断其首尾大破之，降守将令介讹遇，捷书闻帝大喜罢中正。
- id: guji-种谔-event-death
  date: '1083'
  year_of: 1083
  type: death
  title_zh: 疽发背卒
  summary_zh: 永乐之祸后帝就命知延州，旋以疽发背卒，年五十七。
