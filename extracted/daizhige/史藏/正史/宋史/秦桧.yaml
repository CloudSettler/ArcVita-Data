  archetype: 主和权相
  dilemmas:
  - 和议与恢复中原的路线之争
  - 屈己受书与朝廷体面的矛盾
  - 主和与诸将主战的军政冲突
  lesson: 权相专主和议，可以一时定局，却以代价与争议铭刻史册。
  summary_first_person: 我秦桧于绍兴八年复除尚书右仆射兼枢密使，专主与金和议：自乌陵思谋来聘，至张通古'诏谕江南'之议，我以摄冢宰受书进呈，定割地通好之局。绍兴九年河南地归，我主持交割；十年金人败盟南侵，我奏命刘锜择利班师，又促诸大帅还镇罢兵，终成和局。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷29
