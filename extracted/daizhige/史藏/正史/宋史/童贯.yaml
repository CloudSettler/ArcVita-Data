events:
- id: guji-童贯-event-birth
  year_of: '1054'
  date: '1054'
  precision: year
  kind: person-birth
  summary: 童贯约生于此年，少年出李宪之门，后自给事宫掖。
  refs:
  - 新宋史纪传文本（卷四六八宦者传）
- id: guji-童贯-event-1
  year_of: '1100'
  date: '1100'
  precision: year
  kind: career-transition
  summary: 徽宗立，置明金局于杭州，童贯以供奉官主之，始与蔡京游；蔡京进用多赖童贯之力。
  refs:
  - 宋史卷468
- id: guji-童贯-event-2
  year_of: '1102'
  date: '1102'
  precision: year
  kind: appointment
  summary: 蔡京既相，赞策取青唐，力荐童贯尝十使陕右、审五路事宜之能，遂用李宪故事监王厚军。
  refs:
  - 宋史卷468
- id: guji-童贯-event-3
  year_of: '1104'
  date: '1104'
  precision: year
  kind: military-victory
  summary: 童贯匿徽宗停兵手札而出师，师竟出复四州，擢景福殿使、襄州观察使；后讨溪哥臧征，复积石军、洮州，加检校司空。
  refs:
  - 宋史卷468
- id: guji-童贯-event-4
  year_of: '1118'
  date: '1118'
  precision: year
  kind: military-campaign
  summary: 童贯将秦晋锐师深入河陇，薄萧关古骨龙，逼刘法取朔方，法遇伏死；贯隐其败以捷闻，夏人终因辽人进誓表纳款。
  refs:
  - 宋史卷468
- id: guji-童贯-event-5
  year_of: '1121'
  date: 1121-01
  precision: month
  kind: military-victory
  summary: 方腊起事后，童贯改江、浙、淮南宣抚使，率禁旅及秦、晋蕃汉兵十五万东征，正月前锋大破方七佛于秀州。
  refs:
  - 宋史卷468
- id: guji-童贯-event-6
  year_of: '1121'
  date: 1121-04
  precision: month
  kind: military-victory
  summary: 四月，官军生擒方腊及妻孥等于梓桐石穴，余党至宣和四年三月悉平；进贯太师，徙国楚。
  refs:
  - 宋史卷468
- id: guji-童贯-event-7
  year_of: '1125'
  date: '1125'
  precision: year
  kind: award
  summary: 以复燕山功，诏解节钺为真三公，加封徐、豫两国；宣和七年依神宗遗训封广阳郡王，居宦官封王之极。
  refs:
  - 宋史卷468
- id: guji-童贯-event-8
  year_of: '1126'
  date: '1126'
  precision: year
  kind: downfall
  summary: 金人南侵，贯弃太原南遁，钦宗即位后数其十大罪，命监察御史张澂追至南雄斩之，函首赴阙枭于都市。
  refs:
  - 宋史卷468
- id: guji-童贯-event-death
  year_of: '1126'
  date: '1126'
  precision: year
  kind: person-death
  summary: 童贯于南雄被诛，既诛函首赴阙，枭于都市。
  refs:
  - 宋史卷468
