person:
  qid: guji-胡安国
  name_zh: 胡安国
  names:
    zh: 胡安国
    en: Hu Anguo
  lifespan:
    birth:
      date: '1074'
      precision: year
      is_circa: true
      raw: 约1074年（卒于绍兴，年六十五推算）
    death:
      date: '1138'
      precision: year
      is_circa: true
      raw: 绍兴年间卒，年六十五
  birth_date: '1074'
  death_date: '1138'
  era: 南宋
  reign_ref: 宋哲宗、宋钦宗、宋高宗
  archetype: 经世儒臣·春秋学者
  dilemmas:
  - 直言极谏而屡遭权贵倾陷，罢黜与坚守之抉择
  - 引《春秋》大义评判朝政，学术原则与仕进利害之冲突
  - 一生在官四十年而实历不及六载，出处进退基本断于心
  lesson: 以正心为万事之宗，出处去就当内断于心，不为利名所动
  summary_first_person: 我名安国，字康侯，建宁崇安人。绍圣四年登进士第，哲宗亲擢第三。我潜心《春秋》二十余年，以为传心要典；屡召屡辞，然每有君命即置家事不问。曾进《时政论》二十一篇，力主定计建都、志在恢复；因论朱胜非不可用而落职，终进宝文阁直学士，卒年六十五，谥文定。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷435
endeavors:
- id: guji-胡安国-endeavor-1
  name_zh: 科举入仕与经学立身
  phases:
  - key: brewing
    name_zh: 游学太学
    labels:
      zh: 太学从师
    start_date: '1090'
    highlight_event_id: guji-胡安国-event-rostudy
  - key: breakthrough
    name_zh: 绍圣登第
    labels:
      zh: 廷试亲擢第三
    start_date: '1097'
    highlight_event_id: guji-胡安国-event-jinshi
  decisions:
  - date: '1097'
    title_zh: 廷试对策推明《大学》，以渐复三代为对
    rationale: 发策崇复熙宁元丰之制，安国独以三代为归，哲宗称善亲擢第三
- id: guji-胡安国-endeavor-2
  name_zh: 靖康建言与坚守朝纲
  phases:
  - key: brewing
    name_zh: 屡辞屡召
    labels:
      zh: 累辞太常少卿等职
    start_date: '1126'
    highlight_event_id: guji-胡安国-event-jingkang
  - key: breakthrough
    name_zh: 正心之对
    labels:
      zh: 钦宗召见论圣学
    start_date: '1126'
    highlight_event_id: guji-胡安国-event-jingkang
  - key: climax
    name_zh: 封还词头
    labels:
      zh: 论刘玨贬谪不当
    start_date: '1126'
    highlight_event_id: guji-胡安国-event-fenghuan
  decisions:
  - date: '1126'
    title_zh: 封还刘玨行词词头，反对台谏越职弹击
    rationale: 侍从献纳有职，弹击官邪必归风宪，此路若开则朝著不靖
  - date: '1126'
    title_zh: 论分天下为四道权恐太重
    rationale: 内外之势适平则安，偏重则危，建议沿二十三路帅府选重臣
- id: guji-胡安国-endeavor-3
  name_zh: 高宗朝献论与《春秋》侍讲
  phases:
  - key: brewing
    name_zh: 进《时政论》
    labels:
      zh: 献二十一篇
    start_date: '1131'
    highlight_event_id: guji-胡安国-event-shizheng
  - key: breakthrough
    name_zh: 专讲春秋
    labels:
      zh: 兼侍读专讲《春秋》
    start_date: '1131'
    highlight_event_id: guji-胡安国-event-jiangchunqiu
  - key: climax
    name_zh: 论胜非落职
    labels:
      zh: 持录黄不下，卧家不出
    start_date: '1131'
    highlight_event_id: guji-胡安国-event-luozhi
  - key: closure
    name_zh: 篡修《春秋传》
    labels:
      zh: 书成除侍读
    start_date: '1135'
    highlight_event_id: guji-胡安国-event-chunqiuzhuan
  decisions:
  - date: '1131'
    title_zh: 论朱胜非不可同都督诸军事
    rationale: 胜非缄默附会致渡江，尊用张邦昌，苗刘之变贪生苟容，用人得失系国安危
  - date: '1131'
    title_zh: 奏请褒封程颐等诸儒，颁行遗书
    rationale: 孔孟之道自二程始明，不当禁学者从其学，使邪说不得作
  - date: '1138'
    title_zh: 力辞知永州，归治《春秋传》
    rationale: 屡以病变，愿提举宫观纂修所著春秋传
events:
- id: guji-胡安国-event-birth
  date: '1074'
  year_of: 1074
  type: birth
  title_zh: 胡安国生于建宁崇安
  detail: 字康侯，建宁崇安人（生年据卒年六十五推约）
- id: guji-胡安国-event-rostudy
  date: '1090'
  year_of: 1090
  type: study
  title_zh: 入太学，师朱长文、靳裁之
  detail: 裁之与论经史大义，深奇重之
- id: guji-胡安国-event-jinshi
  date: '1097'
  year_of: 1097
  type: appointment
  title_zh: 绍圣四年进士第，哲宗亲擢第三
  detail: 廷试策本第一，以无诋元祐语被抑，哲宗命再读称善，亲擢第三
- id: guji-胡安国-event-chuming
  date: '1110'
  year_of: 1110
  type: appointment
  title_zh: 提举湖南学事，举王绘、邓璋遗逸
  detail: 遭蔡京构陷置狱推治，卒无验而除名，后复元官
- id: guji-胡安国-event-jingkang
  date: '1126'
  year_of: 1126
  type: audience
  title_zh: 靖康元年钦宗召见，奏正心之说与中兴之策
  detail: 奏明君以务学为急、圣学以正心为要，乞访大臣集议国论，提振纪纲
- id: guji-胡安国-event-zhongshu
  date: '1126'
  year_of: 1126
  type: appointment
  title_zh: 除中书舍人，赐三品服
  detail: 耿南仲屡谮之，疏奏不下，安国乃就职
- id: guji-胡安国-event-fenghuan
  date: '1126'
  year_of: 1126
  type: remonstrance
  title_zh: 封还刘玨行词词头
  detail: 为刘玨辨冯澥越职之奏，遭何㮚等挤，出知通州
- id: guji-胡安国-event-kaifeng
  date: 1126-12
  year_of: 1126
  type: departure
  title_zh: 去京逾旬而金人薄都城
  detail: 子胡寅在围城中，安国曰主上在重围中，敢念子乎
- id: guji-胡安国-event-gaozong
  date: '1127'
  year_of: 1127
  type: recall
  title_zh: 高宗即位以给事中召
  detail: 黄潜善讽康执权论其托疾，罢之
- id: guji-胡安国-event-shizheng
  date: '1131'
  year_of: 1131
  type: memorial
  title_zh: 献《时政论》二十一篇
  detail: 论定计、建都、设险、尚志、正心、养气等，自谓虽诸葛复生不能易此论
- id: guji-胡安国-event-jiangchunqiu
  date: '1131'
  year_of: 1131
  type: lecture
  title_zh: 除兼侍读，专讲《春秋》
  detail: 高宗谓他人通经岂胡安国比，不许讲官分经之例
- id: guji-胡安国-event-luozhi
  date: 1131-11
  year_of: 1131
  type: dismissal
  title_zh: 论朱胜非罢同都督，持录黄不下，落职提举仙都观
  detail: 吕颐浩指为朋党，降旨责其偃蹇不至，落职；是夕彗出东南，秦桧三上章乞留不报
- id: guji-胡安国-event-chunqiuzhuan
  date: '1135'
  year_of: 1135
  type: writing
  title_zh: 提举太平观，奉诏纂修《春秋传》
  detail: 书成，高宗谓深得圣人之旨，除提举万寿观兼侍读
- id: guji-胡安国-event-gongfu
  date: '1138'
  year_of: 1138
  type: memorial
  title_zh: 奏请封爵程颐诸儒、颁行遗书
  detail: 遭陈公辅等承宰相风旨交章论其学术颇僻
- id: guji-胡安国-event-death
  date: '1138'
  year_of: 1138
  type: death
  title_zh: 卒，年六十五，谥文定
  detail: 进宝文阁直学士，诏赠四官，赐田十顷恤其孤
