  date: 1129
  year_of: 1129
  detail: 金人蹑隆祐太后至赣州，以漕檄摄本州幕，募乡丁助官军捍御，第赏转承直郎
  is_circa: true
- id: guji-胡铨-event-appointment
  event: 除枢密院编修官
  date: 1135
  year_of: 1135
  detail: 吕祉以贤良方正荐，赐对，除枢密院编修官
- id: guji-胡铨-event-memorial
  event: 抗疏乞斩三奸
  date: 1138
  year_of: 1138
  detail: 上书乞断王伦、秦桧、孙近三人之头竿之藁街，称宁赴东海而死，不处小朝廷求活
- id: guji-胡铨-event-exile-zhaozhou
  event: 除名编管昭州
  date: 1138
  year_of: 1138
