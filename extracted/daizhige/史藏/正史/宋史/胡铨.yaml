  summary_first_person: 我字邦衡，庐陵人。建炎二年对策直言治道本民，绍兴八年抗疏乞斩秦桧、孙近、王伦之头，遂遭除名编管，谪居岭海多年而不改其节；孝宗朝起复，力主恢复、反对和议，官至端明殿学士，谥忠简。
