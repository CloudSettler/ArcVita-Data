- id: guji-胡铨-event-exile-xinzhou
  event: 编管新州
  date: 1142
  year_of: 1142
  detail: 谏官罗汝楫劾其饰非横议，诏除名编管新州
- id: guji-胡铨-event-exile-jiyang
  event: 移谪吉阳军
  date: 1148
  year_of: 1148
  detail: 新州守臣张棣讦其与客唱酬、谤讪怨望，移谪吉阳军
- id: guji-胡铨-event-release
  event: 量移衡州·得自便
  date: 1161
  year_of: 1161
  detail: 桧死，二十六年量移衡州，三十一年得自便
- id: guji-胡铨-event-recall
  event: 复官知饶州
  date: 1162
  year_of: 1162
  detail: 孝宗即位，复奉议郎、知饶州，召对言修德、结民、练兵、观衅，帝曰久闻卿直谅
  is_circa: true
- id: guji-胡铨-event-sole-dissent
  event: 庭议独主不可和
  date: 1163
  year_of: 1163
  detail: 隆兴元年和戎遣使大询于庭，预议十四人中言不可和者铨一人，独上一议
- id: guji-胡铨-event-defense
  event: 措置海道、锤冰退敌
  date: 1164
  year_of: 1164
  detail: 以本职措置浙西、淮东海道，劾李宝不救，雪中先持铁锤锤冰，士皆用命，金人遂退
- id: guji-胡铨-event-retire
  event: 以资政殿学士致仕
  date: 1177
  year_of: 1177
  detail: 乾道七年陛辞，犹以归陵寝、复故疆为言，归庐陵成训传诸经之志
- id: guji-胡铨-event-death
  event: death
  date: 1180
  year_of: 1180
  detail: 薨，谥忠简，有澹庵集一百卷行于世
  is_circa: true
