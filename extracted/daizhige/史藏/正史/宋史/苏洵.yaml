  title_zh: 苏洵生于眉州眉山
  description: 字明允，眉州眉山人。
- id: guji-苏洵-event-fenwen
  date: '1037'
  year_of: '1037'
  type: endeavor
  title_zh: 举进士、茂才异等皆不中，焚旧文闭户苦读
  description: 年二十七始发愤为学，岁余举进士，又举茂才异等，皆不中。悉焚常所为文，闭户益读书，遂通《六经》、百家之说，下笔顷刻数千言。
- id: guji-苏洵-event-jingshi
  date: '1056'
  year_of: '1056'
  type: endeavor
  title_zh: 携二子轼、辙至京师，欧阳修上其所著书二十二篇
  description: 至和、嘉祐间，与其二子轼、辙皆至京师，翰林学士欧阳修上其所著书二十二篇，既出，士大夫争传之，一时学者竞效苏氏为文章。
- id: guji-苏洵-event-cishiren
  date: '1059'
  year_of: '1059'
  type: endeavor
  title_zh: 韩琦奏于朝，辞疾不试，除秘书省校书郎
  description: 宰相韩琦见其书，善之，奏于朝，召试舍人院，辞疾不至，遂除秘书省校书郎。
- id: guji-苏洵-event-xiushu
  date: '1061'
  year_of: '1061'
  type: endeavor
  title_zh: 与姚辟同修《太常因革礼》一百卷
  description: 会太常修纂建隆以来礼书，乃以为霸州文安县主簿，与陈州项城令姚辟同修礼书，为《太常因革礼》一百卷。
- id: guji-苏洵-event-death
  date: '1066'
  year_of: '1066'
  type: death
  title_zh: 苏洵卒
  description: 书成，方奏未报，卒。赐其家缣、银二百，特赠光禄寺丞，敕有司具舟载其丧归蜀。著有文集二十卷、《谥法》三卷，又有《权书》《衡论》《机策》。
