person:
  qid: guji-苏洵
  name_zh: 苏洵
  names:
    zh: 苏洵
    en: Su Xun
  lifespan:
    birth:
      date: '1009'
      precision: year
      is_circa: true
      raw: 年二十七始发愤为学（约1009年生，见至和嘉祐间父子至京师）
    death:
      date: '1066'
      precision: year
      is_circa: true
      raw: 《太常因革礼》书成方奏未报而卒（约治平末）
  birth_date: '1009'
  death_date: '1066'
  era: 北宋
  reign_ref: 嘉祐、治平年间
  archetype: 大器晚成之文章家
  dilemmas:
  - 科举屡试不中，焚旧文闭户苦读，弃进取之常途而自成一家之文
  - 召试舍人院而辞疾不至，宁守布衣之节
  lesson: 年二十七始发愤为学，终能通六经百家之说，下笔顷刻数千言。
  summary_first_person: 我苏洵，字明允，眉州眉山人。二十七岁始发愤为学，屡试不中后尽焚旧文，闭户苦读，通《六经》百家之说。至和、嘉祐间携二子轼、辙至京师，欧阳修上我所著书二十二篇，士大夫争传，学者竞效苏氏文章。韩琦奏于朝，我辞疾不试，除秘书省校书郎，后为霸州文安县主簿，与姚辟同修《太常因革礼》一百卷，书成未报而卒。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷443
