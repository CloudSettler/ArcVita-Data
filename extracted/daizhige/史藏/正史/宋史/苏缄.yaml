  name_zh: 苏缄
  names:
    zh: 苏缄
    en: Su Jian
  courtesy_name_zh: 宣甫
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      date: '1076'
      precision: year
      is_circa: false
      raw: 熙宁九年，邕州城陷，纵火自焚死
  birth_date: ''
  death_date: '1076'
  era: 北宋
  reign_ref: 仁宗、神宗朝
  archetype: 死守孤城的忠烈守臣
  dilemmas:
  - 孤城被围四十二日，外援不至，守或走之间抉择，终取全家殉城之义
  - 预判交趾入寇，屡白上官沈起、刘彝而不见听，言责与官势之冲突
  lesson: 守土之臣，义在不弃城、不死贼手，虽力竭身焚而气节不灭
  summary_first_person: 我苏缄，字宣甫，泉州晋江人。举进士为官，杖豪商、斩剧盗，以儒者之身行果决之事。侬智高围广州时，我募兵赴援、扼其归路，独以功迁。及知邕州，交趾号八万之众入寇，我仅得二千八百人，散家财以固众心，昼夜守城，发神臂弓殪敌甚众。外援不至，城陷之日，我不肯死贼手，先杀其家三十六人，纵火自焚，谥忠勇。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷446
