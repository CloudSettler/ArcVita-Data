  - date: ''
    title_zh: 诘杖豪商樊氏
    rationale: 主簿虽卑，邑官也；商虽富，部民也。邑官杖部民，有何不可。
- id: guji-su-jian-endeavor-2
  name_zh: 援救广州，拒侬智高
  phases:
  - key: climax
    name_zh: 募兵赴难、扼贼归路
    labels:
      zh:
      - 夜行赴难
      - 布槎木亘四十里
    start_date: '1052'
    highlight_event_id: guji-su-jian-event-guangzhou
  decisions:
  - date: '1052'
    title_zh: 委印鲍轲，夜行赴广
    rationale: 广为都府，城危在旦暮而不救，非义也。
  - date: '1052'
    title_zh: 擒斩黄师宓父，招抚诖误者
    rationale: 挫贼谋主，捕杀乘乱为盗者六十八人，招诖误者六千八百人使复业，以沮贼势。
- id: guji-su-jian-endeavor-3
  name_zh: 死守邕州，殉城自焚
  phases:
  - key: brewing
    name_zh: 预警交趾，请罢沈起刘彝之谋
    labels:
      zh:
      - 伺得实
      - 移文责沮议
    start_date: '1071'
    highlight_event_id: guji-su-jian-event-warn
  - key: climax
    name_zh: 邕州被围四十二日
    labels:
      zh:
      - 授方略分地自守
      - 神臂弓殪敌
    start_date: '1076'
    highlight_event_id: guji-su-jian-event-siege
  - key: closure
    name_zh: 城陷自焚，身后懷忠
    labels:
      zh:
      - 吾义不死贼手
      - 立祠赐额怀忠
    start_date: '1076'
    highlight_event_id: guji-su-jian-event-death
  decisions:
  - date: '1076'
    title_zh: 悉出官帑私藏示众，固守待援
    rationale: 兵械既具，蓄聚不乏，宜固守以迟外援；一人举足，则群心摇矣。
  - date: '1076'
    title_zh: 独遣子元还桂州，留其妻子在城
    rationale: 人不可户晓，必以郡守家出城则众心动摇，故遣子而留其妻子以安人心。
  - date: '1076'
    title_zh: 榜沈起、刘彝之罪于市
    rationale: 愤其致寇又不救患，欲上疏而道梗不通，冀朝廷得闻。
events:
- id: guji-su-jian-event-nanhai
  person_qid: guji-su-jian
  endeavor_id: guji-su-jian-endeavor-1
  title_zh: 以选往阅蕃舶赀，诘杖豪商樊氏
  date: ''
  year_of: ''
  era_label: 仁宗朝
  summary: 广州南海主簿任上，商樊氏升阶就席以客礼见，缄诘而杖之；州召责，缄以邑官杖部民之理自辩，州不能诘。
- id: guji-su-jian-event-yangwu
  person_qid: guji-su-jian
  endeavor_id: guji-su-jian-endeavor-1
  title_zh: 阳武尉访获剧盗李，驰马追斩其首
  date: ''
  year_of: ''
  era_label: 仁宗朝
  summary: 萃众大索，火旁舍以迫之，李逸出，缄驰马逐而斩其首送府，府尹贾昌朝惊曰儒者乃尔轻生。
- id: guji-su-jian-event-guangzhou
  person_qid: guji-su-jian
  endeavor_id: guji-su-jian-endeavor-2
  title_zh: 知英州，募士数千夜行赴援广州，扼侬智高归路
  date: '1052'
  year_of: '1052'
  era_label: 皇祐四年
  summary: 委印于提点刑狱鲍轲，夜行止营去广二十里；擒斩贼谋主黄师宓父，捕杀为盗者，招诖误者六千八百人复业；分兵先扼归路，布槎木亘四十里，贼绕道由连州贺州而西，缄与贼战摧伤甚众，尽得其掠物，独以功换供备库副使、广东都监。
- id: guji-su-jian-event-warn
  person_qid: guji-su-jian
  endeavor_id: guji-su-jian-endeavor-3
  title_zh: 知邕州，伺知交趾谋寇，致书沈起、刘彝请备不听
  date: '1071'
  year_of: '1071'
  era_label: 熙宁四年
  summary: 以皇城使知邕州，伺得交趾入寇之实，以书抵知桂州沈起，起不以为意；刘彝代起，缄致书请罢所行事，彝不听，反移文责缄沮议。
- id: guji-su-jian-event-siege
  person_qid: guji-su-jian
  endeavor_id: guji-su-jian-endeavor-3
  title_zh: 交趾八万众围邕州，缄以二千八百人固守四十二日
  date: '1076'
  year_of: '1076'
  era_label: 熙宁九年
  summary: 蛮陷钦、廉，破邕四砦；缄阅州兵得二千八百，召僚吏郡人材者授以方略，分散地自守；悉出官帑私藏示众，斩潜出者翟绩以徇，发神臂弓射贼所殪甚众，焚其云梯洞子；求救于刘彝、宋球，援军张守节逗遛不进，举军皆覆；贼囊土傅城，蚁附而登，城遂陷。
- id: guji-su-jian-event-death
  person_qid: guji-su-jian
  endeavor_id: guji-su-jian-endeavor-3
  title_zh: 城陷，杀其家三十六人，纵火自焚，谥忠勇
  date: '1076'
  year_of: '1076'
  era_label: 熙宁九年
  summary: 力不敌，曰吾义不死贼手，亟还州治，杀其家三十六人藏于坎，纵火自焚，蛮求尸不得；神宗嗟悼，赠奉国军节度使，谥忠勇；邕人立祠，元祐中赐额怀忠；交人惧苏皇城领兵报怨而引归。
