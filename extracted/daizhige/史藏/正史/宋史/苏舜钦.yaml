person:
  qid: guji-苏舜钦
  names:
    zh: 苏舜钦
    en: Su Shunqin
  name_zh: 苏舜钦
  lifespan:
    birth:
      date: '1008'
      precision: year
      is_circa: true
      raw: 舜钦年二十一，诣登闻鼓院上疏（当天圣中玉清昭应宫灾）
    death:
      date: '1048'
      precision: year
      is_circa: false
      raw: 二年，得湖州长史，卒
  birth_date: '1008'
  death_date: '1048'
  era: 北宋
  reign_ref: 宋仁宗（天圣、康定、庆历年间的士人）
  archetype: 直言敢谏而遭倾陷的文学家
  dilemmas:
  - 言事获罪：连番上疏直言时政，触怒权臣，终以进奏院细故被劾除名
  - 出与处：放废后寓居吴中，于沧浪亭修园读书，取舍于朝堂与江湖之间
  lesson: 世人不容直言革新者，正义之士遭处常被苛责，一如世所谓「一举网尽」。
  summary_first_person: 我苏舜钦，字子美，少慷慨有大志，与穆修倡为古文歌诗，屡上疏论朝廷事，以直声闻于当世。终因进奏院用故纸公钱之细故为王拱辰等倾陷除名，退寓吴中，筑沧浪亭，发愤懑于豪放歌诗、草书，得湖州长史而卒，世甚惜之。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷442
