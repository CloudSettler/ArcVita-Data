person:
  qid: guji-苏辙
  name_zh: 苏辙
  names:
    zh: 苏辙
    en: Su Zhe
  lifespan:
    birth:
      date: '1039'
      precision: year
      is_circa: true
      raw: 年十九与兄轼同登进士科（嘉祐二年，1057），逆推约生于1039年
  birth_date: '1039'
  era: 北宋
  reign_ref: 仁宗、神宗、哲宗
  archetype: 直言敢谏的政论家与理财之臣
  dilemmas:
  - 直言极谏恐遭黜落与忠于职守之间的抉择
  - 反对新法（青苗法）而与王安石势力冲突
  - 因兄苏轼诗案连坐被贬
  - 差役与雇役之争中力求折衷缓行
  - 对夏国弃地与守边之争
  - 反对“调停”引用旧党小人之议
  lesson: 无事深忧、有事不惧；藏富于民、制出于一，方能安民靖国
  summary_first_person: 我字子由，年十九与兄轼同登进士科，极言禁廷得失，几被黜而授商州推官。我反对青苗法与仓促复差役，力主藏财于州郡、罢“调停”之议；元祐间官至门下侍郎，论事切直，屡忤权臣而不悔。
  source_urls:
  - 宋史卷三百三十九
endeavors:
- id: guji-苏辙-endeavor-1
  name_zh: 科举入仕与初仕直言
  phases:
  - key: brewing
    name_zh: 进士与制科
    labels:
      zh: 与兄轼同登第
    start_date: '1057'
    highlight_event_id: guji-苏辙-event-keju
  - key: breakthrough
    name_zh: 制科极言得失
    labels:
      zh: 极言禁廷之事
    start_date: '1061'
    highlight_event_id: guji-苏辙-event-zhike
  - key: climax
    name_zh: 历任州县属官
    labels:
      zh: 商州推官、大名推官
    start_date: '1061'
    highlight_event_id: guji-苏辙-event-shangzhou
  decisions:
  - date: '1061'
    title_zh: 乞养亲京师
    rationale: 父洵修《礼书》、兄轼签书凤翔判官，遂留京侍亲
- id: guji-苏辙-endeavor-2
  name_zh: 抵制新法与外任辗转
  phases:
  - key: brewing
    name_zh: 入三司条例司
    labels:
      zh: 为条例司属官
    start_date: '1069'
    highlight_event_id: guji-苏辙-event-tiaoli
  - key: breakthrough
    name_zh: 力陈青苗不可
    labels:
      zh: 与吕惠卿论多相牾
    start_date: '1069'
    highlight_event_id: guji-苏辙-event-qingmiao
  - key: climax
    name_zh: 外任贬谪
    labels:
      zh: 出为河南推官、齐州掌书记、谪监筠州盐酒税
    start_date: '1069'
    highlight_event_id: guji-苏辙-event-junzhou
  decisions:
  - date: '1069'
    title_zh: 力抵安石书言青苗法不可行
    rationale: 引刘晏常平法，言贷钱出息吏缘为奸，害民烦政
  - date: '1079'
    title_zh: 谪监筠州盐酒税
    rationale: 坐兄轼以诗得罪
- id: guji-苏辙-endeavor-3
  name_zh: 元祐执政与议政
  phases:
  - key: brewing
    name_zh: 居谏职
    labels:
      zh: 为右司谏
    start_date: '1086'
    highlight_event_id: guji-苏辙-event-jian
  - key: breakthrough
    name_zh: 论役法科举与还地于夏
    labels:
      zh: 论差雇役、许还五砦
    start_date: '1086'
    highlight_event_id: guji-苏辙-event-wuzhai
  - key: climax
    name_zh: 执政枢要
    labels:
      zh: 尚书右丞、门下侍郎
    start_date: '1091'
    highlight_event_id: guji-苏辙-event-youcheng
  - key: closure
    name_zh: 户部理财三弊疏
    labels:
      zh: 三监皆兼隶户部
    start_date: '1089'
    highlight_event_id: guji-苏辙-event-hubu
  decisions:
  - date: '1086'
    title_zh: 论役法宜缓行、来年科场一切如旧
    rationale: 使举人知有定论，徐议科举格式
  - date: '1089'
    title_zh: 许还夏国五砦
    rationale: 间不容发，避免边衅祸难无已
  - date: '1091'
    title_zh: 面斥“调停”之非并上疏
    rationale: 君子小人势同冰炭，不可并处
  - date: '1089'
    title_zh: 户部奏裁三弊，使三监兼隶户部
    rationale: 制出于一，天下贫富可责之户部
