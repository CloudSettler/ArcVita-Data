person:
  qid: guji-范镇
  name_zh: 范镇
  names:
    zh: 范镇
    en: Fan Zhen
  lifespan:
    birth:
      date: '1007'
      precision: year
      is_circa: true
      raw: 生年史无明文，据卒年八十一推算约1007年
    death:
      date: '1088'
      precision: year
      is_circa: true
      raw: 乐成而薨，年八十一
  birth_date: '1007'
  death_date: '1088'
  era: 北宋
  reign_ref: 仁宗、英宗、神宗、哲宗
  archetype: 骨鲠谏臣与礼乐学者
  dilemmas:
  - 直言必死与为臣职分之间的抉择
  - 反对新法与保全自身荣名之间的抉择
  - 定乐当先正律与朝廷既成之乐之间的坚持
  lesson: 临大节决大议，色和而语壮，虽万乘前无所屈
  summary_first_person: 我范镇生平以直言事君，首倡建储之议，章十九上而不悔；又力执礼乐古法，与新法相抗，退而名益重，吾所愧者，未能消患于未萌也。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷337
endeavors:
- id: guji-范镇-endeavor-1
  name_zh: 谏诤与建储之议
  phases:
  - key: brewing
    name_zh: 知谏院论事
    labels:
      zh:
      - 谏官
      - 民力
    start_date: 庆历间
    highlight_event_id: guji-范镇-event-lunjian
  - key: climax
    name_zh: 首启建储之议
    labels:
      zh:
      - 建储
      - 死谏
    start_date: 嘉祐初
    highlight_event_id: guji-范镇-event-jianchu
  - key: closure
    name_zh: 定策立英宗
    labels:
      zh:
      - 立储功成
    start_date: 嘉祐末
    highlight_event_id: guji-范镇-event-yingzong
  decisions:
  - date: 嘉祐初
    title_zh: 首上疏请立宗室为储
    rationale: 天下事无大于此者，自分必死故敢言
  - date: 章十九上后
    title_zh: 固辞兼侍御史知杂事
    rationale: 事当论是非不当问难易，言不从则不居言职
- id: guji-范镇-endeavor-2
  name_zh: 抵制青苗新法
  phases:
  - key: breakthrough
    name_zh: 封还诏命
    labels:
      zh:
      - 封驳
      - 反新法
    start_date: 熙宁初
    highlight_event_id: guji-范镇-event-fenghuan
  - key: climax
    name_zh: 疏五上极诋时政
    labels:
      zh:
      - 致仕
    start_date: 熙宁三年
    highlight_event_id: guji-范镇-event-zhishi
  - key: closure
    name_zh: 以户部侍郎致仕
    labels:
      zh:
      - 退隐赋诗
    start_date: 熙宁三年后
    highlight_event_id: guji-范镇-event-zhishi
  decisions:
  - date: 熙宁中
    title_zh: 诏命五下皆封还
    rationale: 青苗行于唐衰世不足法，常平近古不可改
  - date: 熙宁三年后
    title_zh: 力争苏轼孔文仲不报而请谢事
    rationale: 言不行无颜复立于朝
- id: guji-范镇-endeavor-3
  name_zh: 考定乐律
  phases:
  - key: brewing
    name_zh: 独主以律生尺
    labels:
      zh:
      - 乐律
      - 律尺
    start_date: 皇祐后
    highlight_event_id: guji-范镇-event-lvchi
  - key: climax
    name_zh: 与刘几定乐而自作律尺
    labels:
      zh:
      - 铜律
    start_date: 神宗时
    highlight_event_id: guji-范镇-event-yuecheng
  - key: closure
    name_zh: 乐成献于延和殿
    labels:
      zh:
      - 嘉奖
    start_date: 晚年
    highlight_event_id: guji-范镇-event-yuecheng
  decisions:
  - date: 神宗时
    title_zh: 定乐当先正律，不用李照加四清声之乐
    rationale: 虽有师旷之聪不以六律不能正五音
events:
- id: guji-范镇-event-birth
  type: birth
  date: '1007'
  year_of: 1007
  precision: circa
  summary_zh: 范镇生于成都华阳，约1007年
- id: guji-范镇-event-jinshi
  type: career
  date: '1030'
  year_of: 1030
  precision: circa
  summary_zh: 举进士，礼部奏名第一，殿廷唱第至第七十九人抗声自陈旧风不为所动，旧风遂革
- id: guji-范镇-event-lunjian
  type: career
  date: '1048'
  year_of: 1048
  precision: circa
  summary_zh: 擢起居舍人、知谏院，上疏论民力困敝、请二府同制国用
- id: guji-范镇-event-jianchu
  type: career
  date: '1056'
  year_of: 1056
  precision: circa
  summary_zh: 仁宗暴疾，镇独奋首建储议，章十九上待命百余日须发为白
- id: guji-范镇-event-yingzong
  type: career
  date: '1062'
  year_of: 1062
  precision: circa
  summary_zh: 帝意卒为所动，其后韩琦定策立英宗
- id: guji-范镇-event-puyi
  type: career
  date: '1065'
  year_of: 1065
  precision: year
  summary_zh: 濮议起，镇判太常寺率其属言称皇考之非，执政怒责之不屈
- id: guji-范镇-event-fenghuan
  type: career
  date: '1069'
  year_of: 1069
  precision: circa
  summary_zh: 神宗时镇封还 青苗、罢司马光枢副等诏，诏五下执如初
- id: guji-范镇-event-zhishi
  type: career
  date: '1070'
  year_of: 1070
  precision: circa
  summary_zh: 疏五上证安石喜怒为赏罚，安石自草制极诋之，镇以户部侍郎致仕
- id: guji-范镇-event-juyong
  type: career
  date: '1079'
  year_of: 1079
  precision: circa
  summary_zh: 苏轼下台狱，索与镇往来书文甚急，镇犹上书论救
- id: guji-范镇-event-lvchi
  type: career
  date: '1071'
  year_of: 1071
  precision: circa
  summary_zh: 与刘几同定乐，主张定乐先正律，与司马光往复论难数万言
- id: guji-范镇-event-yuecheng
  type: career
  date: '1088'
  year_of: 1088
  precision: circa
  summary_zh: 请太府铜自作律尺逾年乐成，比李照乐下一律有奇，帝及太皇太后御延和殿阅视，赐诏嘉奖
- id: guji-范镇-event-death
  type: death
  date: '1088'
  year_of: 1088
  precision: circa
  summary_zh: 乐奏三日而薨，年八十一，赠金紫光禄大夫，谥忠文
