  archetype: 权相
  dilemmas:
  - 固位与报刊国孰先：屡罢屡起，蒲伏扣头祈哀以保权位
  - 「绍述」新旧法之间反复依违，见利忘义
  lesson: 奸相弄权，倾覆宗社，终谴死道路而为天下所恨
  summary_first_person: 我蔡京，字元长，兴化仙游人，熙宁三年登进士第，四度当国，倡丰亨豫大之说，竭天下以自奉，名列六贼之首，钦宗时贬死于潭州。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷472
