  decisions:
  - date: '1101'
    title_zh: 结童贯以营复起
    rationale_zh: 童贯以供奉官访书画于杭，京与游不舍昼夜，凡所画屏幛扇带达禁中，帝由是属意
  - date: '1102'
    title_zh: 置讲议司自为提举
    rationale_zh: 阴托绍述之柄，箝制天子，凡政事之大者皆由讲议司出
  - date: '1105'
    title_zh: 更定盐钞法
    rationale_zh: 旧钞尽废，富商巨贾数十万缗一旦化为流丐
  - date: '1102'
    title_zh: 刻元祐党人碑
    rationale_zh: 司马光等三百九人目为奸党，锢其子孙，不得官京师及近甸
