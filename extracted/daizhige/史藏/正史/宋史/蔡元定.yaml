    rationale: 彼以学来，何忍拒之；祸患非闭门塞窦所能避
events:
- id: guji-蔡元定-event-birth
  date: '1135'
  year_of: '1135'
  title_zh: 蔡元定生于建州建阳
  detail: 字季通，生而颖悟，八岁能诗，日记数千言。父蔡发以程氏《语录》、邵氏《经世》、张氏《正蒙》授之，谓孔孟正脉。
- id: guji-蔡元定-event-study
  date: '1143'
  year_of: '1143'
  title_zh: 少年登山读书
  detail: 登西山绝顶，忍饥啖荠读书，既长辨析益精。
- id: guji-蔡元定-event-shizhu
  date: '1158'
  year_of: '1158'
  title_zh: 师从朱熹
  detail: 闻朱熹名，往师之。熹扣其学，大惊曰此吾老友也，不当在弟子列，遂与对榻讲论诸经奥义，每至夜分。四方学者必先从元定质正。
- id: guji-蔡元定-event-cijian
  date: '1190'
  year_of: '1190'
  title_zh: 辞朝命筑室西山
  detail: 太常少卿尤袤、秘书少监杨万里联疏荐于朝，召之坚以疾辞，筑室西山将为终焉之计。
- id: guji-蔡元定-event-zhushu
  date: '1175'
  year_of: '1175'
  title_zh: 与朱熹往复参订、起稿《启蒙》
  detail: 朱熹疏释《四书》及为《易》《诗》传、《通鉴纲目》皆与元定往复参订，《启蒙》一书属元定起稿。所著有《律吕新书》等，熹为之序。
- id: guji-蔡元定-event-bian
  date: '1196'
  year_of: '1196'
  title_zh: 遭伪学之禁谪道州
  detail: 韩侂胄设伪学之禁，沈继祖、刘三杰连疏诋熹并及元定。谪道州，不辞家即就道。朱熹与从游者数百人饯别萧寺，元定赋诗执手笑相别；杖屦同其子沉行三千里，脚为流血，无几微见言面。
- id: guji-蔡元定-event-death
  date: '1198'
  year_of: '1198'
  title_zh: 卒于道州
  detail: 谓其子沉曰可谢客，吾欲安静，以还造化旧物，阅三日卒。侂胄既诛，赠迪功郎，赐谥文节，学者尊之曰西山先生。
