person:
  qid: guji-cai-xiang
  name_zh: 蔡襄
  names:
    zh: 蔡襄
    en: Cai Xiang
  lifespan:
    birth:
      date: '1012'
      precision: year
      is_circa: true
      raw: 治平三年丁母忧，明年卒，年五十六，逆推约生于大中祥符五年前后
    death:
      date: '1067'
      precision: year
      is_circa: false
      raw: 治平四年卒，年五十六
  birth_date: '1012'
  death_date: '1067'
  era: 北宋
  reign_ref: 宋仁宗、宋英宗
  archetype: 直言敢谏的名臣与书法家
  dilemmas:
  - 任谏非难，听谏为难；听谏非难，用谏为难
  - 直言尽职与保全自身、母老家事之间的取舍
  lesson: 忠言不避祸，事事有担当；为此君者当修人事，不徼非理之福。
  summary_first_person: 我是蔡襄，字君谟，兴化仙游人。我以直言谏诤著称，凡除授不当辄封还之；又知福州、泉州，建模桥万安渡而植松庇路，并以书法冠绝当时。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷320
