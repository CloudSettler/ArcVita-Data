    rationale: 恐邪人造为好名、好进、彰君过之说御谏，愿察其实
  - date: '1050'
    title: 谏止复营开宝浮图
    rationale: 生民困苦、四夷骄慢，当修人事，不可专信佛法
  - date: '1053'
    title: 乞尽诛保州乱卒
    rationale: 招抚将开骄慢暴乱之源，须明诛杀决行之令
