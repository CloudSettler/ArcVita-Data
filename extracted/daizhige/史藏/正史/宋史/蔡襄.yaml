- id: guji-cai-xiang-event-shijinshi
  event_type: career
  date: '1030'
  year_of: 1030
  description: 举进士，为西京留守推官、馆阁校勘
- id: guji-cai-xiang-event-sishi-poem
  event_type: career
  date: '1036'
  year_of: 1036
  description: 作《四贤一不肖诗》，都人士争相传写，契丹使购归张于幽州馆
- id: guji-cai-xiang-event-jianyuan
  event_type: career
  date: '1043'
  year_of: 1043
  description: 庆历三年，仁宗亲擢谏官，襄知谏院，上疏辨任谏听谏用谏之难
- id: guji-cai-xiang-event-fuzhou
  event_type: career
  date: '1045'
  year_of: 1045
  description: 以母老求知福州，改福建路转运使，开古五塘溉民田，奏减丁口税之半
- id: guji-cai-xiang-event-fenghai
  event_type: career
  date: '1050'
  year_of: 1050
  description: 兼修起居注，谏止复营开宝浮图舍利，谓当修人事不徼非理之福
- id: guji-cai-xiang-event-fenghuan
  event_type: career
  date: '1050'
  year_of: 1050
  description: 为唐介力争改贬英州；后除授非当辄封还，帝赐其母冠帔并亲书君谟二字
- id: guji-cai-xiang-event-qiaoliang
  event_type: career
  date: '1055'
  year_of: 1055
  description: 知泉州，立石为梁于万安渡，长三百六十丈，种蛎固础，又植松七百里庇路，闽人刻碑纪德
- id: guji-cai-xiang-event-kaifeng
  event_type: career
  date: '1058'
  year_of: 1058
  description: 迁龙图阁直学士知开封府，精吏事谈笑剖决，吏不能欺
- id: guji-cai-xiang-event-hangzhou
  event_type: career
  date: '1064'
  year_of: 1064
  description: 英宗疑外间言襄有论议，襄数谒告，乞为杭州，拜端明殿学士以往
- id: guji-cai-xiang-event-muzang
  event_type: career
  date: '1066'
  year_of: 1066
  description: 治平三年丁母忧
- id: guji-cai-xiang-event-death
  event_type: death
  date: '1067'
  year_of: 1067
  description: 蔡襄卒，年五十六，赠吏部侍郎；乾道中赐谥曰忠惠
- id: guji-cai-xiang-event-shuhao
  event_type: career
  date: '1055'
  year_of: 1055
  description: 工书为当时第一，仁宗命书《元舅陇西王碑文》；令书《温成后父碑》则不奉诏
