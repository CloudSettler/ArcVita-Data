  era: 南宋理宗宝祐年间（1254—1258）
  reign_ref: 宋理宗·宝祐
  archetype: 权臣·边阃帅臣
  dilemmas:
  - 边事吃紧与庙堂权位之间周旋，屡以开阃、绘图、调兵表功固宠
  - 前蜀帅余玠获罪、同僚削官之际独骤进枢要，负相位争议之名
  lesson: 以军功与图奏经营人望，可在乱世中迅速攀升枢府，然权位愈高，毁誉愈集。
  summary_first_person: 我是贾似道，故光禄大夫贾涉之子。宝祐二年我以同知枢密院事开阃淮东，以枢密行府行事；其后城东海、复广陵、败李全之子松寿皆以图上闻，得敕书奖谕。宝祐三年进知枢密院事，四年拜参知政事，五年为两淮安抚使，加官两转，仕途扶摇直上。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷44
