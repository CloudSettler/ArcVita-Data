person:
  qid: guji-贾逵
  name_zh: 贾逵
  names:
    zh: 贾逵
    en: Jia Kui
  lifespan:
    birth:
      date: '1012'
      precision: year
      is_circa: true
      raw: 卒年年六十九，元丰初卒
    death:
      date: '1080'
      precision: year
      is_circa: true
  birth_date: 约1012年
  death_date: 约1080年
  era: 北宋
  reign_ref: 英宗／神宗
  archetype: 边将/武将
  dilemmas:
  - 归仁驿之战: 违狄青"不待令而举者斩"之令，擅自引军据高，胜则功、败则斩
  - 邕州城破后受命入城搜括公私遗坠，坚辞不受以免同僚匿宝之弊
  lesson: 临机决断与廉洁自守——兵法"先据高者胜"胜于坐待军令，财宝面前独守其身
  summary_first_person: 我贾逵，真定槁城人，少孤而以巧计迎母奉养。自拱圣卒伍至殿前班副都知，随狄青征侬智高，归仁驿之战我违令据高，仗剑驰下断贼为二，遂破侘智高；事后诣青请罪，青反拊背劳谢。历秦凤、并代、鄜延诸路，伐木却羌酋，聚熟户为二十七堡以御寇，铸铁钥以正禁城启闭。神宗时拜建武军节度使、殿前都指挥使，并请不俟郊赦而赐三世官以尽念亲之志。数月而卒，赠侍中，谥武恪。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷349
