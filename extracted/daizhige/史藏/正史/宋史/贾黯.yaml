  type: career
  title_zh: 迁左正言，果于言事，首论韩琦、富弼、范仲淹可大用
  description: 还为秘书省著作佐郎、直集贤院，迁左正言、判三司开拆司。
- id: guji-贾黯-event-3
  date: 约1051
  year_of: 1051
  type: petition
  title_zh: 论杜枢无罪及谏官随入奏事之请，皆弗许
  description: 言枢无罪，恐自此贵幸近习阴肆谗毁；又请执政奏事听谏官一人随入。
- id: guji-贾黯-event-4
  date: '1052'
  year_of: 1052
  type: career
  title_zh: 皇祐四年同修起居注，徙判盐铁勾院，迁左司谏
  description: 建言天下复置义仓，反复辨析而不果行。
- id: guji-贾黯-event-5
  date: 约1055
  year_of: 1055
  type: career
  title_zh: 擢知制诰，判吏部流内铨，劾桑泽废终身
  description: 奏劾父死三年而匿丧调官之益州推官桑泽，废终身。
- id: guji-贾黯-event-6
  date: 约1064
  year_of: 1064
  type: career
  title_zh: 迁给事中、权御史中丞，安然与曾弹己之吕诲共事
  description: 言尝荐诲为御史，知其方正谨厚，一时公言非有嫌怨。
- id: guji-贾黯-event-7
  date: 约1065
  year_of: 1065
  type: petition
  title_zh: 与两制合议请以濮王为皇伯，数诣中书争论
  description: 执政弗从，数诣中书争论；会大雨水，疏言执政建两统贰父之说违背经义致灾。
- id: guji-贾黯-event-8
  date: '1065'
  year_of: 1065
  type: death
  title_zh: 病中以翰林侍读学士知陈州，未行而卒，年四十四
  description: 口占遗奏数百言，犹以濮王议为请。赠尚书礼部侍郎。
