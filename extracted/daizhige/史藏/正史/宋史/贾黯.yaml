    start_date: 约1065
    highlight_event_id: guji-贾黯-event-7
  - key: closure
    name_zh: 病求出知陈州
    labels:
      zh:
      - 翰林侍读学士
      - 知陈州
    start_date: '1065'
    highlight_event_id: guji-贾黯-event-8
  decisions:
  - date: 约1064
    title_zh: 请以濮王为皇伯
    rationale: 执政建两统贰父之说违背经义，作为谏臣当守礼制正论。
  - date: '1065'
    title_zh: 口占遗奏以濮王议为请
    rationale: 大雨水，以为简宗庙逆天时致灾，至死犹持己议。
