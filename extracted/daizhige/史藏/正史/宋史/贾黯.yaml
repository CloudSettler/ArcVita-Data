  birth_date: 约1022
  death_date: '1065'
  era: 北宋仁宗、英宗两朝
  reign_ref: 庆历—治平
  archetype: 直言敢谏之诤臣
  dilemmas:
  - 弃官就养父疾而违抗朝廷法度，遭御史弹劾贬官
  - 濮议之争中力主皇伯说，与执政抗争，明知忤逆仍直谏至死
  lesson: 谏官之本在介直敢言，虽屡遭抑黜、刚愎见诋，仍不以私害公，至死犹以国事为念。
  summary_first_person: 我贾黯，字直孺，邓州穰人，进士第一。自以年少遭遇而备位谏官，果于言事。我首论韩琦、范仲淹可大用，论杜枢之冤，请开广言路；建言置义仓、罢荐举之例、止狄青骤登枢府；判流内铨时劾桑泽、黜刘抃，以风厉臣下。权知开封府、御史中丞，虽人或讥我刚愎卞急，然濮议之议，我力持经义，与执政数争于中书；病且笃，犹口占遗奏数百言以濮王为请。卒年四十四。
