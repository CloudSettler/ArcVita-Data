  decisions:
  - date: 约1050
    title_zh: 首论韩琦、富弼、范仲淹可大用
    rationale: 自以年少遭遇，备位谏官，果于言事，首荐社稷之臣。
  - date: 约1051
    title_zh: 请如唐太宗故事听谏官随入奏事
    rationale: 谏官御史迹疏远未预闻时政，一有失言即受诘难沮辱，非开广言路之道。
  - date: '1052'
    title_zh: 建言并付余靖经制两路以御侬智高
    rationale: 二人临事指踪不一，下将无所适从，专任一人则号令归一。
  - date: '1052'
    title_zh: 奏罢刘沆尽废荐举之例
    rationale: 中外荐举陈乞一切以诏令从事，论者以为非便。
- id: guji-贾黯-endeavor-2
  name_zh: 濮议与临终遗奏
  phases:
