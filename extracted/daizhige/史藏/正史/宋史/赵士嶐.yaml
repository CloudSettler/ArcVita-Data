    name_zh: 骂贼殉国
    labels:
      zh:
      - 拒伪安抚使
      - 裂帛遗书
      - 仰药而卒
    start_date: '1131'
    highlight_event_id: guji-赵士嶐-event-jiujiang-death
  decisions:
  - date: '1131'
    title_zh: 城中食尽、同僚议弃城，毅然独留守城
    rationale: 郡城可弃，臣节不可弃；众心犹可系于守城一念
  - date: '1131'
    title_zh: 拒受李成伪安抚使之职，仰药自尽
    rationale: 贼欲屈我，义不苟活；且遗书诸子，令脱身后为我雪耻
events:
- id: guji-赵士嶐-event-birth
  date: '1079'
  year_of: 1079
  type: birth
  summary_zh: 赵士嶐生，宋太宗之后。
- id: guji-赵士嶐-event-shouchun
  date: '1120'
  year_of: 1120
  type: battle
  is_circa: true
  summary_zh: 剧贼丁一箭众号十万攻寿春秋，郡守悉委备御之策于士嶐。士嶐募敢死士，张宣独持槊缒城击杀数十人，复选壮士数百夜开门出其不意击走贼众，追奔数十里，以功迁三官。
- id: guji-赵士嶐-event-jiujiang-defense
  date: '1130'
  year_of: 1130
  type: battle
  is_circa: true
  summary_zh: 李成遣马进围九江，士嶐与守臣姚舜明、副钤辖刘绍先竭力捍守百余日，城食尽而志不摇。
- id: guji-赵士嶐-event-jiujiang-death
  date: '1131'
  year_of: 1131
  type: death
  is_circa: true
  summary_zh: 同僚纵火弃城，士嶐独留守。城破，贼欲官之，士嶐怒骂裂帛遗书诫诸子雪耻，仰药而卒，年五十二。诏赠武功大夫，官其孙二人。
- id: guji-赵士嶐-event-posthumous
  date: '1131'
  year_of: 1131
  type: honor
  is_circa: true
  summary_zh: 事闻，高宗嘉悼，赠武功大夫，录其孙二人；其子不㣻、不懘、不隐皆于是役死焉。
