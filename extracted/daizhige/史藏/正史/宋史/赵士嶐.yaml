person:
  qid: guji-赵士嶐
  name_zh: 赵士嶐
  names:
    zh: 赵士嶐
    en: Zhao Shilong
  lifespan:
    birth:
      date: '1079'
      precision: year
      is_circa: true
      raw: 卒于绍兴元年（1131），年五十二，逆推约生于1079年
    death:
      date: '1131'
      precision: year
      is_circa: true
      raw: 绍兴元年（1131）九江城破后仰药而卒，年五十二
  birth_date: '1079'
  death_date: '1131'
  era: 北宋末至南宋初
  reign_ref: 宋高宗·绍兴
  archetype: 守城殉国的宗室武将
  dilemmas:
  - 城中食尽、同僚议弃城纵火而去，独自纠合部曲余民守城至死
  - 李成欲任其为伪安抚使，宁死不屈，裂帛遗书诫诸子雪耻
  lesson: 世受国恩者，临危不当苟活；义之所在，虽死不回。
  summary_first_person: 我乃太宗之后，字景瞻。少时弃科举从武，累迁淮南西路兵马钤辖。丁一箭十万贼众攻寿春，我定计募敢死士夜出击走之。李成遣马进围九江，守百余日、城中食尽，同僚弃城去，我独留死守。城破，贼欲以伪官屈我，我裂帛留书诫诸子为我雪耻，仰药而卒，年五十二。
