      raw: 嘉定十四年后卒（宋史卷四百三，是夕大星陨于襄阳）
  birth_date: ''
  death_date: ''
  era: 南宋
  reign_ref: 淳熙、嘉定
  archetype: 儒帅边臣
  dilemmas:
  - 和战之争：朝廷和议未定，力主提兵决战以报国
  - 忠义军处置：招纳土豪劲旅与朝廷财粮有限之间的权衡
  lesson: 以战为守，合官民兵为一体，持军严而用人推诚。
  summary_first_person: 我起自儒生，帅边十年，以战为守，力排和议，拔擢孟宗政、扈再兴等土豪名将，屡败金兵于枣阳、唐邓之间，使京西一境独全，殁以身殉边事。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷403
