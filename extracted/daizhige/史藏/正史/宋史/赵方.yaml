  decisions:
  - date: ''
    title_zh: 抗疏主战
    rationale: 朝廷和战未定乱人意，吾策决矣，惟有提兵临边决战以报国。
  - date: ''
    title_zh: 围魏救赵捣金虚
    rationale: 金人空巢穴而来，若捣其虚，则枣阳之围自解。
  - date: ''
    title_zh: 先发制人
    rationale: 料金人不得志于枣阳，必将并攻诸城，故先溃其保甲、毁其城砦。
events:
- id: guji-zhao-fang-event-birth
  type: birth
  date: ''
  year_of: ''
  name_zh: 赵方出生
  description: 衡山人，字彦直，父赵棠从胡宏学，方遂从张栻学。
- id: guji-zhao-fang-event-jinshi
  type: career
  date: '1181'
  year_of: '1181'
  name_zh: 淳熙八年举进士
  description: 调蒲圻尉，疑狱多所委决，后历大宁监教授、青阳知县，有"催科中抚字"名言。
- id: guji-zhao-fang-event-zaoyang-jie
  type: career
  date: ''
  year_of: ''
  name_zh: 枣阳第一次解围
  description: 金兵围枣阳，遣孟宗政、扈再兴等援枣阳，夹击败金人，围解；再疏力陈不可和者七，战议遂定。
- id: guji-zhao-fang-event-zaoyang-dajie
  type: career
  date: ''
  year_of: ''
  name_zh: 枣阳大捷破完颜讹可
  description: 命许国、扈再兴捣唐邓之虚，再兴败金人于瀼河及城南，宗政出城夹击，杀其众三万，讹可单骑遁，进焕章阁直学士。
- id: guji-zhao-fang-event-huaixi
  type: career
  date: ''
  year_of: ''
  name_zh: 援淮西败金
  description: 金犯淮西，命许国保鄂、再兴援淮西，灵山击金人大败，逐六十里擒监军合答，进显谟阁直学士、权刑部尚书。
- id: guji-zhao-fang-event-death
  type: death
  date: ''
  year_of: ''
  name_zh: 赵方病卒于任
  description: 病革犹言"未死一日，当立一日纪纲"，勉扈再兴协心报国，是夕大星陨于襄阳；谥忠肃，累赠太师。
