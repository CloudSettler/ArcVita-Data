      raw: 庆元二年正月壬午
  birth_date: '1140'
  death_date: '1196'
  era: 南宋
  reign_ref: 孝宗、光宗、宁宗
  archetype: 定策安邦的宗室贤相
  dilemmas:
  - 光宗疾不能执丧，帝位继承危机中是否行内禅大计
  - 宗室身份居相位引发合法性与政敌攻击
  - 对韩侂胄预政势力的遏制取舍
  lesson: 以社稷为重，处君臣之变而不敢言功
  summary_first_person: 我以宗室之身中进士第一，历仕孝宗、光宗两朝。孝宗崩，我毅然定策，奉太皇太后命拥立宁宗，再造朝廷。然为韩侂胄所忌，诬以谋危社稷，贬死衡州，天下冤之。
  source_urls:
  - 宋史 卷三百九十二
