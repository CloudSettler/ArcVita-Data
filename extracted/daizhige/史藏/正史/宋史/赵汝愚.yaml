person:
  qid: guji-赵汝愚
  name_zh: 赵汝愚
  names:
    zh: 赵汝愚
    en: Zhao Ruyu
  lifespan:
    birth:
      date: '1140'
      precision: year
      is_circa: true
      raw: 不详
    death:
      date: '1196'
      precision: year
