events:
- id: guji-赵汝愚-event-birth
  event_type: birth
  date: '1140'
  year_of: 1140
  description: 约生于饶州余干，汉恭宪王元佐七世孙
- id: guji-赵汝愚-event-death
  event_type: death
  date: 1196-01
  year_of: 1196
  description: 贬永州途中，至衡州为守臣钱鍪所窘，暴薨，天下冤之
- id: guji-赵汝愚-event-进士第一
  event_type: career
  date: '1163'
  year_of: 1163
  description: 擢进士第一，签书宁国军节度判官，召试馆职，除秘书省正字
- id: guji-赵汝愚-event-谏内侍兼兵职
  event_type: career
  date: '1180'
  year_of: 1180
  description: 论内侍陈源不宜居总戎之任，孝宗诏自今内侍不得兼兵职
- id: guji-赵汝愚-event-帅蜀
  event_type: career
  date: '1185'
  year_of: 1185
  description: 进直学士、制置四川兼知成都府，以计分诸羌蛮之势，孝宗谓其有文武威风
- id: guji-赵汝愚-event-规谏两宫
  event_type: political
  date: '1191'
  year_of: 1191
  description: 光宗久不朝重华宫，汝愚往复规谏，又属嗣秀王伯圭调护，两宫之情始通
- id: guji-赵汝愚-event-知枢密院
  event_type: career
  date: 1194-01
  year_of: 1194
  description: 迁知枢密院事，初辞不拜，以张诏代领武兴军后乃受命
- id: guji-赵汝愚-event-拥立宁宗
  event_type: political
  date: 1194-07
  year_of: 1194
  description: 孝宗崩，光宗疾不能执丧，汝愚定策，宪圣垂帘，拥立嘉王即位为宁宗，素幄披黄袍，率同列再拜
- id: guji-赵汝愚-event-拜右相
  event_type: career
  date: '1195'
  year_of: 1195
  description: 除光禄大夫、右丞相，力辞再三不许；与留正议攒宫不合
- id: guji-赵汝愚-event-贬永州
  event_type: political
  date: 1195-11
  year_of: 1195
  description: 韩侂胄使其党李沐诬以同姓居相位将不利社稷，罢右相；胡纮疏其谋为不轨，责宁远军节度副使，永州安置
- id: guji-赵汝愚-event-赠谥
  event_type: posthumous
  date: '1208'
  year_of: 1208
  description: 党禁解除，复资政殿学士，韩侂胄诛后尽复元官，赐谥忠定，赠太师、沂国公，后配享宁宗庙庭
