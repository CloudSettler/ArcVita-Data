  - date: '1181'
    title_zh: 以稼名轩
    rationale_zh: 尝谓人生在勤当以力田为先，故以稼名轩
  - date: '1200'
    title_zh: 往哭朱熹
    rationale_zh: 伪学禁方严，门生故旧无敢送葬者，弃疾为文往哭
events:
- id: guji-辛弃疾-event-birth
  date: '1140'
  year_of: 1140
  type: birth
  title_zh: 辛弃疾生于齐之历城
  detail_zh: 字幼安，齐之历城人，少师蔡伯坚，与党怀英同学
- id: guji-辛弃疾-event-death
  date: '1207'
  year_of: 1207
  type: death
  title_zh: 进枢密都承旨未受命而卒
  detail_zh: 赐对衣金带，守龙图阁待制致仕，特赠四官；绍定六年赠光禄大夫，德祐初加赠少师，谥忠敏
- id: guji-辛弃疾-event-shi-caibaijian
  date: '1150'
  year_of: 1150
  title_zh: 少师蔡伯坚，与党怀英同学
  detail_zh: 号辛党，始筮仕决以蓍，怀英遇坎留事金，弃疾得离遂决意南归
  type: education
- id: guji-辛弃疾-event-zhangjing-zhangjishu
  date: 1161-01-01
  year_of: 1161
  title_zh: 为耿京掌书记，劝决策南向
  detail_zh: 耿京聚兵山东称天平节度使，弃疾为掌书记并斩窃印之僧义端归报
  type: career
- id: guji-辛弃疾-event-bind-zhanganguo
  date: 1162-01-01
  year_of: 1162
  type: breakthrough
  title_zh: 奉表归宋并率众缚张安国于金营
  detail_zh: 绍兴三十二年奉表归宋，会张安国杀耿京降金，弃疾约王世隆等径趋金营众中缚之以归，献俘斩于市，时年二十三
- id: guji-辛弃疾-event-meiqin
  date: 1168-01-01
  year_of: 1168
  type: policy_proposal
  title_zh: 献《九议》《美芹十论》
  detail_zh: 乾道六年召对延和殿，作九议并应问三篇美芹十论献于朝，以讲和方定议不行
- id: guji-辛弃疾-event-chuzhou
  date: 1168-01-01
  year_of: 1168
  type: appointment
  title_zh: 通判建康府、知滁州
  detail_zh: 州罹兵烬井邑凋残，宽征薄赋招流散教民兵议屯田，刱奠枕楼繁雄馆
- id: guji-辛弃疾-event-pinglaiwenzheng
  date: 1175-01-01
  year_of: 1175
  type: career
  title_zh: 提点江西刑狱，平剧盗赖文政有功
  detail_zh: 加秘阁修撰，后调京西转运判官，差知江陵府兼湖北安抚
- id: guji-辛弃疾-event-hunan-shuyu
  date: 1179-01-01
  year_of: 1179
  type: memorial
  title_zh: 知潭州兼湖南安抚，上论弭盗疏
  detail_zh: 指贪吏迫使民为盗，乞申饬州县以惠养元元为意，诏奖谕之
- id: guji-辛弃疾-event-feihu
  date: 1180-01-01
  year_of: 1180
  type: military_reform
  title_zh: 创建湖南飞虎军
  detail_zh: 度马殷营垒故基建砦栅，步军二千马军五百，战马铁甲皆备，军成雄镇一方为江上诸军之冠
- id: guji-辛弃疾-event-jiangji
  date: 1180-01-01
  year_of: 1180
  type: famine_relief
  title_zh: 知隆兴府赈济江右大饥
  detail_zh: 榜通衢闭籴者配彊籴者斩，借钱物官民运籴发粜，民赖以济，并以十之三米舟予信州
- id: guji-辛弃疾-event-fujian
  date: 1191-01-01
  year_of: 1191
  type: appointment
  title_zh: 起福建提点刑狱，累迁知福州兼福建安抚使
  detail_zh: 积镪五十万缗榜曰备安库，欲造万铠招壮丁，事未行遭王蔺劾，遂丐祠归
- id: guji-辛弃疾-event-zhejiang
  date: 1196-01-01
  year_of: 1196
  type: appointment
  title_zh: 起知绍兴府兼浙东安抚使
  detail_zh: 庆元间复起，后差知镇江府赐金带，屡辞免进枢密都承旨未受命而卒
- id: guji-辛弃疾-event-kuli-zhuxi
  date: 1200-01-01
  year_of: 1200
  type: cultural
  title_zh: 同朱熹游武夷山，熹殁后为文往哭
  detail_zh: 赋九曲櫂歌，熹书克己复礼夙兴夜寐题其二斋室；熹殁伪学禁严，弃疾为文哭之曰所不朽者垂万世名，regular凛凛犹生
- id: guji-辛弃疾-event-jiaxuanji
  date: 1207-01-01
  year_of: 1207
  type: literary
  title_zh: 《稼轩集》行世
  detail_zh: 雅善长短句，悲壮激烈，以稼名轩，有稼轩集传世
