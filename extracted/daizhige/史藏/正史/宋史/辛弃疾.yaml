person:
  qid: guji-辛弃疾
  name_zh: 辛弃疾
  names:
    zh: 辛弃疾
    en: Xin Qiji
  lifespan:
    birth:
      date: '1140'
      precision: year
      is_circa: true
      raw: 时年二十三（绍兴三十二年金营缚张安国，逆推约生于建炎/绍兴初）
    death:
      date: '1207'
      precision: year
      is_circa: true
      raw: 开禧末年未受枢密都承旨命而卒（约1207，绍兴六年赠光禄大夫为追赠之绍定六年误，以卒年推）
  birth_date: '1140'
  death_date: '1207'
  era: 南宋
  reign_ref: 高宗/孝宗/光宗/宁宗
  archetype: 文武兼备的抗金志士与能臣词人
  dilemmas:
  - 决意南归：筮仕得《离》，弃金归宋，一生志在恢复中原而议和方定、抱负不展
  - 创军受阻：建飞虎军遭枢府沮挠、金字牌令停罢，受而藏之，如期成军
  - 荒政担责：江右大饥，果断放粮通籴，虽被言者落职而不悔
  lesson: 人生在勤，当以力田为先；志士虽有恢复之豪情，亦须务实利民之干略。
  summary_first_person: 我辛弃疾，字幼安，济南历城人。少年聚义抗金，曾率二十余骑闯金营生缚叛贼张安国。南归后屡陈《美芹十论》《九议》以求恢复，虽屡遭排摈，仍在湖南创飞虎军雄镇一方，赈饥安民，晚年以悲壮长短句名世，有《稼轩集》行世。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷401
