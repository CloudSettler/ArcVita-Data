  decisions:
  - date: '1161'
    title_zh: 决意南归
    rationale_zh: 筮仕得《离卦》，且中原豪杰并起，遂归宋抗金
  - date: '1162'
    title_zh: 径趋金营缚张安国
    rationale_zh: 主帅耿京被杀降金，谓何以复命，乃约王世隆等五十人袭金营
  - date: '1168'
    title_zh: 上《美芹十论》《九议》
    rationale_zh: 帝锐意恢复，因论南北形势，持论劲直不为迎合
  - date: '1180'
    title_zh: 受金字牌而不停工
    rationale_zh: 枢府沮挠飞虎军，受而藏之，期一月营栅成，如期落成上部绘图进呈
  - date: '1191'
    title_zh: 福建设备安库、欲造万铠
    rationale_zh: 福州枕海为贼渊，帅臣空竭，务为镇静积镪备患
