  dilemmas:
  - 幼年失怙失恃，由姑父吕氏抚养，寻父三十年方归
  - 身患周痹，自移病于末，带病行医终至挛痹寖剧
  lesson: 不拘古法、遍览众书而自出新意，方能于儿科针药屡起沉疴
  summary_first_person: 我本吴越王钱俶支属，父东游海上不归，姑母吕氏养我诲医。我以《颅囟方》名世，以黄土汤愈皇子瘈疭，得太医丞之职，辨正《本草》阙误，不守一师之法，虽偏废而风骨悍坚，年八十二而终。
