  title_zh: 淳熙五年更名同，诣阙上书论立国本末与恢复大计
  description_zh: 直言和议惰人心，请陛下迁都建业、经略荆襄以图中原；孝宗赫然震动，欲榜朝堂励群臣，拟擢用之。
- id: guji-陈亮-event-tao-3
