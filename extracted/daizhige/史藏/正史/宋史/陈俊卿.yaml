person:
  qid: guji-陈俊卿
  name_zh: 陈俊卿
  names:
    zh: 陈俊卿
    en: Chen Junqing
  lifespan:
    birth:
      date: '1113'
      precision: year
      is_circa: true
      raw: 淳熙十三年（1186）十一月薨，年七十四
    death:
      date: 1186-11
  birth_date: '1113'
  death_date: 1186-11
  era: 南宋
  reign_ref: 宋孝宗 / 宋高宗
  archetype: 名相·直臣
  dilemmas:
  - 和战之辩：面对金人压力与朝中主和势力，坚持先正名、选将练兵，反对轻率求和与轻启兵端两极。
  - 事君与守正：屡忤亲幸（曾觌、龙大渊、张说）与权相倾轧，宁可罢去不附权贵。
  - 恢复故疆与量力而行：既赞帝复国大志，又谏陵寝遣使之议不可轻发，主张蓄力待时。
  lesson: 为政之本在至公——正纪纲、明赏罚、远佞亲贤，宁守拙直而不迎合人意。
  summary_first_person: 我是陈俊卿，字应求，兴化人。绍兴八年登进士第，历仕高宗、孝宗两朝，官至尚书右仆射同平章事兼枢密使。我以兼听至公、辨明邪正自任，劾逐桧党之韩仲通，护张浚、荐钱端礼之隙者拒之、曾觌龙大渊之亲幸斥之；隆兴间佐张浚都督江淮，乾道中为相，以用人为己任，奖廉退、抑奔竞。致仕后以少师、魏国公卒于家，谥正献。
  source_urls:
  - 宋史 卷三百八十三
endeavors:
- id: guji-陈俊卿-endeavor-1
  name_zh: 科第入仕与清名立身
  phases:
  - key: brewing
    name_zh: 幼庄重，执丧如成人
    labels:
      zh:
      - 少年庄重
      - 孝行
    start_date: 约1125
  - key: breakthrough
    name_zh: 绍兴八年登进士第，授泉州观察推官
    labels:
      zh:
      - 科第
      - 州府佐官
    start_date: '1138'
    highlight_event_id: guji-陈俊卿-event-jinshi
  - key: climax
    name_zh: 不附秦桧，转徙外任；桧死后以校书郎召
    labels:
      zh:
      - 立朝守正
    start_date: '1145'
  - key: closure
    name_zh: 辅导普安郡王（后来的孝宗），讲经寓规
    labels:
      zh:
      - 王府教授
    start_date: '1156'
  decisions:
  - date: '1138'
    title_zh: 泉州任上谢绝同僚宴集，失火后至而唯唯引过
    rationale: 服勤职业，不诿过于人，郡守汪藻由是叹服。
  - date: 约1145-1155
    title_zh: 不附秦桧，甘任南外睦宗院教授
    rationale: 察其不附己而遭抑置，不愿曲节以进。
- id: guji-陈俊卿-endeavor-2
  name_zh: 御史与建康宣抚：论劾权臣、匡赞恢复
  phases:
  - key: brewing
    name_zh: 累迁监察御史、殿中侍御史，首论兼听至公
    labels:
      zh:
      - 台谏
    start_date: 约1160
  - key: breakthrough
    name_zh: 劾韩仲通、刘宝、汤思退，救张浚而请对悟主
    labels:
      zh:
      - 劾权奸
      - 保忠臣
    start_date: 约1161
    highlight_event_id: guji-陈俊卿-event-he-yu-luan
  - key: climax
    name_zh: 孝宗受禅，充江淮宣抚判官，建策分遣舟师捣山东
    labels:
      zh:
      - 江淮宣抚
    start_date: '1162'
  - key: closure
    name_zh: 隆兴北伐失利，力谏勿罢张浚都督，自乞从坐贬秩
    labels:
      zh:
      - 谏诤
    start_date: '1163'
  decisions:
  - date: 约1161
    title_zh: 疏辨张浚忠荩，请按张去为沮用兵之罪
    rationale: 白首忠义之臣不可为谗言中伤。
  - date: '1162'
    title_zh: 献策分遣舟师直捣山东以解吴璘孤军之危
    rationale: 两淮事势已急，兵出腹心则彼还师自救。
  - date: '1163'
    title_zh: 请对力争张浚不宜削都督重权置扬州死地
    rationale: 议者但知恶浚欲杀之，不复为宗社计。
- id: guji-陈俊卿-endeavor-3
  name_zh: 参政入相：正纪纲、抑亲幸、举贤才
  phases:
  - key: brewing
    name_zh: 乾道元年召对，除吏部侍郎同修国史
    labels:
      zh:
      - 召还
      - 吏部
    start_date: '1165'
    highlight_event_id: guji-陈俊卿-event-called-back
  - key: breakthrough
    name_zh: 拜同知枢密院事，退曾觌龙大渊，劾戚方刮军
    labels:
      zh:
      - 枢密
    start_date: 约1166
  - key: climax
    name_zh: 乾道四年十月拜右仆射同平章事兼枢密使
    labels:
      zh:
      - 拜相
    start_date: 1168-10
    highlight_event_id: guji-陈俊卿-event-chancellor
  - key: closure
    name_zh: 与虞允文争陵寝遣使之议，杜门请去，帅福州
    labels:
      zh:
      - 乞去
      - 外任
    start_date: '1171'
  decisions:
  - date: 约1166
    title_zh: 具奏出龙大渊、曾觌，杜密旨径下诸军，请奏审方行
    rationale: 人主所恃者纪纲、号令、赏罚，不可令近幸窃威福。
  - date: 约1167
    title_zh: 藏刘珙贬命手诏，自劾乞罢以救之
    rationale: 恐自此大臣阿顺持禄，非国家福。
  - date: '1171'
    title_zh: 谏阻轻遣泛使请陵寝，杜门请去
    rationale: 大事欲计万全，俟遵数年后事力稍充乃可，不敢迎合误国。
- id: guji-陈俊卿-endeavor-4
  name_zh: 出镇地方与晚年恳谏
  phases:
  - key: brewing
    name_zh: 帅福州，政尚宽厚，严治盗，海道晏清
    labels:
      zh:
      - 福州
    start_date: 约1172
  - key: climax
    name_zh: 淳熙二年再知福州，旋起判建康府兼江东安抚
    labels:
      zh:
      - 建康
    start_date: '1175'
    highlight_event_id: guji-陈俊卿-event-jiankang-2
  - key: closure
    name_zh: 淳熙八年告老，以少师、魏国公致仕；十三年薨，谥正献
    labels:
      zh:
      - 致仕
      - 谥正献
    start_date: '1181'
  decisions:
  - date: 约1173
    title_zh: 移书宰执极言福建盐法与淮浙异，阻钞盐法行
    rationale: 福建盐法与他路不同，改行钞盐必扰民。
  - date: '1181'
    title_zh: 上章告老，遗命勿祈恩泽勿请谥树碑
    rationale: 遗表止谢圣恩，不为身后名。'
