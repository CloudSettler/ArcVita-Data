person:
  qid: guji-chen-kangbo
  name_zh: 陈康伯
  names:
    zh: 陈康伯
    en: Chen Kangbo
  lifespan:
    birth:
      date: '1097'
      precision: year
      is_circa: true
      raw: 卒于乾道元年（1165），年六十九，逆推
    death:
      date: '1165'
      precision: year
      is_circa: false
      raw: 乾道元年（1165），薨于殿门出后，年六十九
  birth_date: '1097'
  death_date: '1165'
  era: 南宋
  reign_ref: 宋高宗、宋孝宗
  archetype: 危局定鼎的宰相
  dilemmas:
  - 和战之议：主战备而不轻举，面对「今日更不问和与守，直问战当如何」的抉择
  - 散百官手诏：焚诏不奉，以「百官散，主势孤矣」谏止弃都
  - 带病复相：亲故劝辞而以「大臣与国存亡，虽死安避」力疾就道
  lesson: 国难之际，宰相当以一身任安危，进退从容而持论不移。
  summary_first_person: 我是陈康伯，弋阳人，宣和三年登第，历仕三朝。完颜亮败盟南侵时，我力持战守之义，焚却散官手诏，请帝亲征，卒定采石之捷。孝宗朝我再相而薨，谥文恭，后改谥文正，配享孝宗庙庭。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷384
