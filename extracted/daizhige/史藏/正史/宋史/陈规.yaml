    labels:
      zh:
      - 病卒于官
    start_date: '1160'
  decisions:
  - date: '1140'
    title: 劝刘锜共为死守计
    rationale: 城中有粟数万斛，死守则可胜
  - date: '1140'
    title: 主张潜兵斫营
    rationale: 敌志屡挫必思出奇，潜兵可使彼昼夜不得休以养我锐
events:
- id: guji-陈规-event-birth
  date: ''
  year_of: ''
  title: 陈规出生
  date_raw: ''
- id: guji-陈规-event-li-buqing
  date: '1127'
  year_of: '1127'
  title: 守德安连败祝进、王在
  date_raw: 建炎元年前后
  description: 祝进、王在以砲石鹅车攻城东，陈规连战败之，二盗引众而去。
- id: guji-陈规-event-li-heng
  date: '1132'
  year_of: '1132'
  title: 德安拒李横焚天桥
  date_raw: 绍兴间
  description: 李横围城七十日，陈规以六十人持火枪出西门焚天桥，火牛助之，横拔砦去。
- id: guji-陈规-event-shunchang
  date: 1140-06
  year_of: '1140'
  title: 顺昌大捷
  date_raw: 绍兴十年
  description: 与刘锜登城区画，征神臂弓拒金兵，主张以逸制劳，更队易器，兀术宵遁。
- id: guji-陈规-event-death
  date: '1160'
  year_of: '1160'
  title: 陈规卒
  date_raw: 移知庐州兼淮西安抚后疾作而卒
  description: 年七十，临终犹分派帅事与郡城之守，赠右正议大夫，后立庙德安赐额贤守，追封忠利侯。
