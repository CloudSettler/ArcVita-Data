person:
  qid: guji-陈规
  name_zh: 陈规
  names:
    zh: 陈规
    en: Chen Gui
  archetype: 儒将守城
  era: 南宋
  reign_ref: 建炎、绍兴
  dilemmas:
  - 李横围城索妓女换退兵，一城与一妇之抉择
  - 顺昌之战进退皆是死，誓死进而为忠
  lesson: 死中求生，守城以粮与人心为本
  summary_first_person: 我是陈规，以文臣之身屡破流盗、拒李横、佐刘锜顺昌大捷，虽有攻守方略传世而位不酬劳。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷377
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: '1160'
      precision: year
      is_circa: false
      raw: 卒年七十，移知庐州兼淮西安抚后疾作而卒
birth_date: ''
death_date: '1160'
