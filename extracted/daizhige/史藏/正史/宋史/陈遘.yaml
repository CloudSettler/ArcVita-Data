    death:
      date: '1127'
      precision: year
      is_circa: false
      raw: 靖康末城破遇害（建炎初追赠，约1127年）
  birth_date: ''
  death_date: '1127'
  era: 北宋
  reign_ref: 徽宗、钦宗朝
  archetype: 忠节守土之臣
  dilemmas:
  - 坚守中山孤城与朝廷割两河求和之命的冲突
  - 斩杀拒战总管以强制守城与军心离析的矛盾
  lesson: 主辱臣死，宁守孤城殉国，不为囚孥卖国
  summary_first_person: 我陈遘，字亨伯，先世自江宁迁永州。进士出身，历任莘县、雍丘知县，为政有绩，蒙蒋之奇、冯京、许将交相推荐。虽屡忤蔡京而遭罢黜外任，却先后担任广西转运判官、河北转运使、徽猷阁待制等职，宣和二年方腊之乱时受诏经制七路，创议「经制钱」，并弹劾贪吏、治河利民。后徙河北都转运使，知中山、真定、河间府。金人再至，我冒围入中山坚壁拒守半年，外无援师。弟光禄卿陈适奉旨谕降，我遥语之：「主辱臣死，宁当卖国家为囚孥乎？」我斩辞战的总管以徇，遣步将沙振出击，却被其怀刃入府害于堂上，子锡及仆妾十七人同殉。金人见尸叹曰「南朝忠臣也」，敛葬于铁柱寺。建炎初赠特进。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷446
