events:
- id: guji-陈遘-event-birth
  date: ''
  year_of: ''
  type: birth
  name_zh: 陈遘出生
  description: 陈遘先世自江宁徙永州，出生年不详。
- id: guji-陈遘-event-enter-office
  date: ''
  year_of: ''
  type: milestone
  name_zh: 登进士第、知莘县
  description: 遘登进士第，知莘县为治有绩，魏尹蒋之奇、冯京、许将交荐之。
- id: guji-陈遘-event-jianman
  date: ''
  year_of: ''
  type: milestone
  name_zh: 谏阻开蛮地遭蔡京罢归
  description: 蔡京启蛮徭地建平、从、允三州，遘言蛮人幸安静、轻扰兆衅不可，京恶之，以他事罢归。
- id: guji-陈遘-event-caoyun
  date: ''
  year_of: ''
  type: milestone
  name_zh: 决两塘通漕路
  description: 为发运使，运渠壅涩，使决吕城、陈公两塘达于渠，漕路始通。
- id: guji-陈遘-event-huazhi-gang
  date: ''
  year_of: ''
  type: milestone
  name_zh: 捕系朱勔纲人自劾
  description: 朱勔花石纲塞道，官舟不得行，遘捕系其人并上章自劾，帝为黥勔人，进遘徽猷阁待制。
- id: guji-陈遘-event-fangla
  date: '1120'
  year_of: 1120
  type: milestone
  name_zh: 受诏经制方腊之乱
  description: 宣和二年冬方腊乱，诏以属遘；遘请发京畿兵、鼎澧枪盾手兼程而来，帝悉行其言。
- id: guji-陈遘-event-jingzhi-qian
  date: '1121'
  year_of: 1121
  type: milestone
  name_zh: 创议经制钱
  description: 加龙图阁直学士经制七路，治于杭，创议度公私出纳、量增其赢，号「经制钱」，后翁彦国仿之为「总制钱」，经总制钱之名自此始。
- id: guji-陈遘-event-he-wangzhongnin
  date: ''
  year_of: ''
  type: milestone
  name_zh: 劾罢王仲薿
  description: 劾越州王仲薿纠市民造金茶器、减直买军粮券，而以私钱取之，仲薿坐黜。
- id: guji-陈遘-event-zhihe
  date: ''
  year_of: ''
  type: milestone
  name_zh: 集纲卒治杭河
  description: 冬月檄真、扬、润、楚诸郡集守闸纲卒二千人治河，不两月毕，杭人利焉。
- id: guji-陈遘-event-zhongshan
  date: '1126'
  year_of: 1126
  type: milestone
  name_zh: 冒围入中山坚守
  description: 金人再至，遘冒围入城坚壁拒守；钦宗割两河求和，弟适临城谕旨，遘遥语「主辱臣死，宁当卖国家为囚孥乎」。
- id: guji-陈遘-event-sha-zongguan
  date: '1127'
  year_of: 1127
  type: event
  name_zh: 斩总管以徇、遣沙振出击
  description: 遘呼总管尽括城中兵击贼，总管辞，遂斩以徇；又遣步将沙振，振怒且惧，潜衷刃入府，杀其妾定奴，遂害遘于堂，子锡及仆妾十七人同死，长子巨以官淮南获免。
- id: guji-陈遘-event-death
  date: '1127'
  year_of: 1127
  type: death
  name_zh: 遇害中山
  description: 陈遘为沙振所害于府堂，城中无主乃开门出降；金人见其尸曰「南朝忠臣也」，敛葬于铁柱寺，建炎初赠特进。
