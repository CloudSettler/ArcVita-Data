  dilemmas:
  - 黄天荡之战兵力于金军悬殊，虽先胜终因火攻败绩，进退两难
  - 戍守江淮与赴行在听命之间的军政权衡
  lesson: 据险截击、以寡御众，虽败犹彰忠勇，然孤军难支大局。
  summary_first_person: 建炎四年金人北撤，我屯焦山寺并驻军扬子江截其归路，屡败兀术；再战江中遇火攻败绩。虽经罢黜，旋蒙起复，授检校少师、武成感德军节度使。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷26
