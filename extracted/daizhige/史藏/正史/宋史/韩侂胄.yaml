  era: 南宋宁宗朝
  reign_ref: 宁宗（赵扩）
  archetype: 定策外戚·权臣
  dilemmas:
  - 策立宁宗有功，却以近幸之姿揽权，与赵汝愚、理学之党势成水火
  - 禁止伪学以固权威，致使朱熹、彭龟年、吕祖俭等名士贬黜流放
  lesson: 定策之功可居，窃弄威福必忌；权柄移于内庭，清议终不能容
  summary_first_person: 宁宗即位之夕，我受赵汝愚之托，借内侍关礼泣请太皇太后，得「好为之」三字，遂定内禅之策。自汝州防御使超迁枢密都承旨，开府仪同三司、少傅，权势日隆。彭龟年、朱熹、吕祖俭交章攻我，我次第黜之；庆元间以「伪学」禁锢诸贤，赵汝愚贬死永州，朝局遂由我主。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷37
