  death_date: '1088'
  era: 北宋
  reign_ref: 宋仁宗、宋英宗、宋神宗、宋哲宗
  archetype: 刚直果敢的宰相与理财能臣
  dilemmas:
  - 举荐并支持王安石变法，身居相位却被迫在新党内部倾轧中求去
  - 自请行边应对西夏犯塞，素不习兵事而位至宰相
  - 终以党王安石复得政，为清议所少
  lesson: 临事果敢敢于担当，然用兵非所长，用人特别是倚重王安石的抉择决定了其政治命运
  summary_first_person: 我韩绛字子华，进士甲科出身，历知谏院、御史中丞至参知政事、拜相。我荐王安石于朝，请行边有差役更法之议；西事失利罢知邓州后复相，终因与新党的分歧再出知许州。我临事果敢，不为后虑，发廪振恤、筑堤救溺皆所留惠政，
    Duis 元祐间 请老致仕。
  source_urls:
  - 宋史·韩绛传（据所给古文）
