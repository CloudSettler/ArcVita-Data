      is_circa: false
      raw: ''
    death:
      date: '1127'
      precision: year
      is_circa: false
      raw: 死于赴濮州贬所途中
  birth_date: ''
  death_date: '1127'
  era: 北宋末至南宋初
  reign_ref: 绍圣、崇宁、靖康、建炎、绍兴
  archetype: 直言敢谏之忠臣
  dilemmas:
  - 亡国之危中独抗张邦昌僭立，冒死乞存赵氏
  - 论黄潜善、汪伯彦十七事，明知必遭杀身仍叠上章言事
  lesson: 吾志在行道，以富贵为心则为富贵所累，志士不忘在沟壑。
  summary_first_person: 我是马伸，字时中，绍圣四年进士。靖康汴京陷落、金人胁立张邦昌时，我独奋然约秦桧、吴给共为议状乞存赵氏，并具书责邦昌速迎康王。邦昌气沮而谋丧。高宗即位后我擢殿中侍御史，举发黄潜善、汪伯彦不法十七事，疏留中而贬濮州监酒税，用事者必欲杀我，我怡然襥被而行，死于道中。天下识与不识皆冤痛之，绍兴初诏赠谏议大夫。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷455
