events:
- id: guji-马伸-event-jinshi
  date: '1097'
  year_of: 1097
  type: milestone
  title_zh: 绍圣四年进士及第
  detail: 每调官未尝择便利，为成都郫县丞，请绝受输宿弊，民争先输，常平使者孙俟荐于朝。
- id: guji-马伸-event-chengyi
  date: '1102'
  year_of: 1102
  type: endeavor
  title_zh: 注西京法曹，十反求见程颐
  detail: 崇宁初范致虚攻程颐为邪说，伸欲依颐门以学，因张绎求解，公暇虽风雨必日一造，卒受《中庸》以归。
- id: guji-马伸-event-cunzhao
  date: '1127'
  year_of: 1127
  type: endeavor
  title_zh: 金人胁立张邦昌时独倡议状存赵氏
  detail: 众唯唯，伸独奋曰吾职谏争忍坐视乎，乃与吴给约秦桧共为议状乞存赵氏复嗣君位，并预吴革复国之谋。
- id: guji-马伸-event-shu-bangchang
  date: '1127'
  year_of: 1127
  type: endeavor
  title_zh: 独上书责邦昌速迎康王
  detail: 书不称臣，投袂叱银台司，即缴申尚书省；邦昌得书气沮谋丧，遂议迎孟太后垂帘、遣使迎康王。
- id: guji-马伸-event-yuzhen
  date: '1127'
  year_of: 1127
  type: endeavor
  title_zh: 力争止籍龙德宫宝货
  detail: 王及之等请籍龙德宫宝货斥卖以资官用，伸慨然引义檄之曰君之府藏燕游忍一朝而毁乎，力争乃止。
- id: guji-马伸-event-yushi
  date: '1127'
  year_of: 1127
  type: appointment
  title_zh: 高宗擢殿中侍御史，抚谕荆湖广南
  detail: 伸拜章请窜削，上知其有忠力于国，擢殿中侍御史，奉命以诛邦昌及其党王时雍等，诹察吏治民瘼。
- id: guji-马伸-event-shu-qianshan
  date: '1128'
  year_of: 1128
  type: endeavor
  title_zh: 上疏论黄潜善、汪伯彦不法十七事
  detail: 草疏已具，先奏孙觌、谢克家负国之贼；再进疏条列十七事，先后叠上，请速罢潜善、伯彦政柄。
- id: guji-马伸-event-bianzhe
  date: '1128'
  year_of: 1128
  type: persecution
  title_zh: 坐言事不实责濮州监酒税
  detail: 疏留中，改卫尉少卿辞不拜，录疏申御史台；诏言事不实送吏部责濮州监酒税，用事者恚甚必欲杀之。
- id: guji-马伸-event-death
  date: '1128'
  year_of: 1128
  type: death
  title_zh: 怡然襥被赴贬所，死道中
  detail: 或曰王渊在濮，潜善密嗾其不利于伸；明年金人陷广陵，伸言始验，天下识与不识皆冤痛之。
- id: guji-马伸-event-zengguan
  date: '1132'
  year_of: 1132
  type: honor
  title_zh: 绍兴初诏赠谏议大夫
  detail: 胡安国上《时政论》为伸申雪，谓罚沮忠谠公道何由而明，遂寻加直龙图阁、诏赠谏议大夫。
