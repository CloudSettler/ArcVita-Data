  dilemmas:
  - 战备若何：金兵逼近而朝廷报未下，是否不俟报即日兴工筑城
  - 出仕与守道：制置使李珏不能用其言、边备废弛，且同幕排挤，是否力辞和州之命
  - 师门之托：朱熹以《丧》《祭》二编与所著书相托，能否终其身传道编礼
  lesson: 不残于寇，不滔于水，生汝者黄父也——以实政与讲学并进，方为 reboot 吾道之托
  summary_first_person: 我是黄干，字直卿，师事朱熹，受其深衣与遗书之托，编礼著书，守汉阳、城安庆，直言边事不避忌讳，归里讲学而终。
  source_urls:
  - 宋史卷四百三十
