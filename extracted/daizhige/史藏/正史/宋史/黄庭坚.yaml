      is_circa: true
      raw: 卒年六十一，倒推约生于1045年
    death:
      date: '1105'
      precision: year
      is_circa: true
      raw: 徙永州，未闻命而卒，年六十一
  birth_date: '1045'
  death_date: '1105'
  era: 北宋
  reign_ref: 神宗熙宁至徽宗崇宁年间
  archetype: 直言不讳的诗书两绝之臣
  dilemmas:
  - 修《神宗实录》被指诬谤，从实直对还是屈从权臣章惇、蔡卞之问
  - 屡遭贬谪仍以郡职文书直书时弊，如「用铁龙爪治河，有同儿戏」
  - 徽宗初屡召皆辞，求郡而得太平州，九日即罢
  lesson: 处迁谪而泊然，直辞以对，文章孝行 interest 两全
  summary_first_person: 我黄庭坚，字鲁直，洪州分宁人。以诗文书法名世，与苏轼并称苏黄；修《神宗实录》时直书「用铁龙爪治河，有同儿戏」，虽屡贬不悔，泊然讲学于蜀中。
  source_urls:
  - 宋史 卷四百四十四
