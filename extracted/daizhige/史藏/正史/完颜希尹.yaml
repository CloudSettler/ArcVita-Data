  dilemmas:
  - 处于女真初创文字与辽宋文化之间的传承抉择
  - 随宗翰略地追袭辽主时对进退机宜的把握
  lesson: 能成事者，既能武略拓疆，亦能文治立制。
  summary_first_person: 我是完颜希尹，出自完颜部。太祖举兵伐辽之际，我随宗翰来贺称进劝；后来受命随军略地、追袭辽主，且以创制女真大字著称于世。
  source_urls:
  - https://zh.wikisource.org/wiki/金史/卷2
