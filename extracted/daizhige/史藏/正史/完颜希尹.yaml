    title_zh: 驻北安而分兵略地
    rationale: 宗翰驻北安州时，受遣出兵略地，搜获辽护卫耶律习泥烈，探知辽主猎于鸳鸯泺等内情。
- id: guji-完颜希尹-endeavor-2
  name_zh: 创制女真大字
  start_date: '1119'
  notes: 天辅三年八月太祖颁行女直字，即希尹所制女真大字（据金史他卷，本文本tahun辅三年八月己丑条为颁行时点）。
  phases:
  - key: brewing
    name_zh: 受命制字
    labels:
      zh:
      - 文字创制
    start_date: '1119-01-01'
    highlight_event_id: guji-完颜希尹-event-5
  - key: breakthrough
    name_zh: 颁行国字
    labels:
      zh:
      - 颁行
    start_date: '1119-08-01'
    highlight_event_id: guji-完颜希尹-event-5
  decisions:
  - date: '1119-08-01'
    title_zh: 以女真字颁行本国
    rationale: 女真旧无文字，与邻国通问皆用契丹字；为立国建制、推行号令，与seyen同事依汉字楷体、参照契丹字制度写成女真大字，奏颁行之。
