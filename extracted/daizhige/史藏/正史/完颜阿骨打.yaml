  dilemmas:
  - 部族弱小附庸于辽，反辽则存亡攸关，隐忍蓄力与起兵决裂难以抉择
  - 建国称帝之际须兼顾女真旧俗与新兴国家制度之取舍
  lesson: 隐忍蓄势、以弱克强，把握时机方能成就大业
  summary_first_person: 我完颜阿骨打 born 于生女真完颜部，继任部落联盟首领后，不堪辽廷欺压，以二千五百人起兵反辽，出河店、黄龙府诸战以少胜多，遂于称帝建大金，创猛安谋克之制，命完颜希尹制女真文字，终灭辽主力，为金朝百年基业奠定根本。
  source_urls:
  - https://zh.wikisource.org/wiki/金史/卷1
  - https://zh.wikisource.org/wiki/金史/卷2
