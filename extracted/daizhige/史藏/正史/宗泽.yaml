  reign_ref: 宋钦宗靖康、宋高宗建炎
  archetype: 抗金名将与东京留守
  dilemmas:
  - 主战与朝廷主和之间的抉择
  - 年近七旬仍受命危难之际
  lesson: 临终三呼过河，忠愤不泯
  summary_first_person: 我宗泽字汝霖，婺州义乌人。元祐六年进士，历仕州县有政声。靖康之难后，我年近七旬毅然出仕抗金，任东京留守，留守开封、整军经武，联络义兵，屡败金人，前后二十余次上疏请高宗还都北伐，皆不获报。建炎二年，我忧愤成疾，临终无一语及家事，连呼三声过河而逝，遗恨终天。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷360
