person:
  qid: guji-寇准
  name_zh: 寇准
  names:
    zh: 寇准
    en: Kou Zhun
  lifespan:
    birth:
      date: '961'
      precision: year
      is_circa: false
      raw: 太平兴国前・生于宋建隆二年（961）
    death:
      date: '1023'
      precision: year
      is_circa: false
      raw: 天圣元年（1023）卒于雷州
  birth_date: '961'
  death_date: '1023'
  era: 北宋
  reign_ref:
  - 宋太宗
  - 宋真宗
  archetype: 刚直敢谏的社稷之臣
  dilemmas:
  - 直言强谏与君主威严之间的冲突
  - 主战抗辽与朝中主和派（王钦若、丁谓）的党争倾轧
  - 定策之功反遭谗言贬黜的忠而见疑
  lesson: 刚直可以定国于危难，却难以自保于朝堂；社稷之功未必换来善终。
  summary_first_person: 我寇准，字平仲，华州下邽人。十九岁中进士，以敢言著称，尝挽太宗衣袖强谏。真宗朝我拜相，景德元年契丹南侵，我力排南迁之议，促真宗亲征澶州，定澶渊之盟，保百年平安。然功高见忌，为王钦若所谮，罢相；后遭丁谓构陷，再贬雷州司户参军，天圣元年卒于贬所，谥忠愍。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷281
