  death_date: 1362-06
  era: 元末（至正年间）
  reign_ref: 元惠宗（妥懽帖睦尔）至正朝
  archetype: 平乱儒将
  dilemmas:
  - 招降叛将田丰、王士诚而终遭其刺杀，忠信与御将之难
  - 中原未平而与孛罗帖木儿越境相攻，藩镇倾轧之危
  lesson: 以书生起兵而廓清中原，然释仇纳降不察其心，终殒命于降将之手。
  summary_first_person: 我本布衣书生，愤红巾乱世而起兵于沈丘，转战河南、陕西、山西、山东，复陕虢、汴梁、冀宁诸路，官至中书平章政事。至正二十二年，我招抚田丰、王士诚，不料二贼叛心未死，竟袭杀我于军中，功败垂成。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷026
