  title_zh: 复陕州、虢州二州
  detail_zh: 至正十六年九月，兵部尚书察罕帖木儿复陕、虢二州。
- id: guji-察罕帖木儿-event-yuan-shanxi
  date: 1357-02
  year_of: 1357
  type: endeavor
  title_zh: 与李思齐援陕西
  detail_zh: 陕西贼陷商州，察罕帖木儿与李思齐援陕西，受任陕西行省左丞。
- id: guji-察罕帖木儿-event-fu-jining-lu
  date: 1357-05
  year_of: 1357
  type: endeavor
  title_zh: 复冀宁路
  detail_zh: 至正十八年五月，察罕帖木儿复冀宁路，旋为山西行省右丞。
- id: guji-察罕帖木儿-event-fu-jinning
  date: 1358-03
  year_of: 1358
  type: endeavor
  title_zh: 复晋宁路
  detail_zh: 王士诚陷晋宁路，察罕帖木儿寻复之。
- id: guji-察罕帖木儿-event-fu-bianliang
  date: 1359-08
  year_of: 1359
  type: endeavor
  title_zh: 克复汴梁路
  detail_zh: 至正十九年八月，察罕帖木儿复汴梁路，刘福通挟伪主韩林儿奔安丰，察罕帖木儿为河南行省平章政事。
- id: guji-察罕帖木儿-event-taoshandong
  date: 1361-06
  year_of: 1361
  type: endeavor
  title_zh: 率部讨山东贼
  detail_zh: 至正二十一年六月，察罕帖木儿率所部讨山东贼，寻复东昌、冠州，败田丰于东平，田丰及其众皆降。
- id: guji-察罕帖木儿-event-zhongshupingzhang
  date: 1361-10
  year_of: 1361
  type: endeavor
  title_zh: 拜中书平章政事
  detail_zh: 至正二十一年十月，察罕帖木儿为中书平章政事，兼知河南、山东等处行枢密院事。
- id: guji-察罕帖木儿-event-death
  date: 1362-06
  year_of: 1362
  type: death
  title_zh: 为田丰、王士诚所杀
  detail_zh: 至正二十二年六月戊子，已降之田丰、王士诚杀察罕帖木儿以叛；养子扩廓帖木儿继掌其军。
