  decisions:
  - date: 1356-09
    title_zh: 兵部尚书任上率军复陕州、虢州
    rationale: 阻断汝颍红巾西进潼关之势，屏障陕西。
  - date: 1357-02
    title_zh: 与李思齐援陕西，受任陕西行省左丞
    rationale: 红巾李武、崔德入关，朝廷倚其兵威镇压。
  - date: 1359-08
    title_zh: 克复汴梁，逐韩林儿奔安丰
    rationale: 拔刘福通伪都，重振朝廷声势，进河南行省平章。
  - date: 1361-06
    title_zh: 率所部讨山东贼
    rationale: 毛贵、田丰等乱山东，亟需覆其巢穴以固京师。
  - date: 1361-08
    title_zh: 败田丰于东平而受其降
    rationale: 欲以宽德收降将以速定山东，因疏于防备埋下祸患。
events:
- id: guji-察罕帖木儿-event-fu-shan-uo
  date: 1356-09
  year_of: 1356
