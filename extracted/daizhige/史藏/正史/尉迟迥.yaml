  era: 西魏-北周
  reign_ref: 魏恭帝、孝闵帝、明帝之世
  archetype: 宗室宿将·开国征伐之臣
  dilemmas:
  - 受命伐蜀，面临蜀地险远、梁武陵王萧纪据守的军略抉择
  - 作为太祖外甥与柱国重臣，身处宇文护专权、皇室外戚之间的微妙处境
  lesson: 受命于危难之际， Philipp长驱而定剑南，功勋著于开国之基
  summary_first_person: 我乃魏安公尉迟迥，太祖之甥。魏恭帝二年，太祖命我率众伐梁武陵王萧纪于蜀；杨干运以潼州降后，引军向成都，是年八月克成都，剑南遂平。孝闵帝践阼，我以小宗伯、魏安公之位进为柱国，同列者宁都公毓、达奚武、豆卢宁、李远、贺兰祥诸勋贵。明帝之世，我又奉命率众于河南筑安乐城，以固边略。后进位太师、封蜀国公，追上孝闵帝谥于南郊。一生征战于西魏北周革鼎之际，以宗室肺腑之亲，立巴蜀开辟之功。
  source_urls:
  - https://zh.wikisource.org/wiki/周書/卷02
  - https://zh.wikisource.org/wiki/周書/卷03
  - https://zh.wikisource.org/wiki/周書/卷04
