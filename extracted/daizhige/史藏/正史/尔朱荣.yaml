  birth_date: 0493
  death_date: 344
  era: 北魏
  reign_ref: 北魏孝明帝、孝庄帝时期
  archetype: 乱世权将
  dilemmas:
  - 以边镇蕃将之身入主中枢，兵权与朝纲难以两全
  - 六镇之乱中既为朝廷平叛，又拥兵自重挟制朝政
  lesson: 兵威可定一时之乱，难以服天下之心
  summary_first_person: 我出自北秀容尔朱氏，世为部落酋帅。值六镇纷乱，我先平南秀容牧子之叛，又破桑乾叛虏，以军功累迁至车骑大将军、仪同三司。孝明帝崩，幼主即位，我抗表请奔赴京师，勒兵而南，由此登上了北魏政治的漩涡中心。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷74
endeavors:
- id: guji-尔朱荣-endeavor-1
  name_zh: 起于秀容、讨平叛乱
  summary: 以别将身份讨平南秀容牧子于乞真之叛，击破桑乾敕勒叛众，稳固北疆，奠定军事资本。
  phases:
