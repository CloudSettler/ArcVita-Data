  - key: breakthrough
    name_zh: 讨叛立功
    labels:
      zh:
      - 讨平于乞真
      - 击破斛律洛阳
    start_date: 340
    highlight_event_id: guji-尔朱荣-event-1
  - key: climax
    name_zh: 执掌州权
    labels:
      zh:
      - 肆州执尉庆宾
      - 羽生统州事
    start_date: 342
    highlight_event_id: guji-尔朱荣-event-3
  - key: closure
    name_zh: 勒兵而南
    labels:
      zh:
      - 抗表赴阙
      - 进位将相
    start_date: 0528
    highlight_event_id: guji-尔朱荣-event-5
  decisions:
  - date: 340
    title_zh: 出兵讨平南秀容于乞真叛乱
    rationale: 南秀容牧子于乞真反，杀太仆卿陆延，朝廷倚重尔朱氏部落兵力，荣借机立功显名。
  - date: 342
    title_zh: 于肆州执刺史尉庆宾，令从叔羽生统州事
    rationale: 以武力控制肆州人事，显露拥兵自重、干预地方行政的野心。
  - date: 0528
    title_zh: 抗表请入奔赴，勒兵而南
    rationale: 孝明帝暴崩、幼主即位，朝局动荡，尔朱荣以勤王之名率军南下，谋取更大权柄。
