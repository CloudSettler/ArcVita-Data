events:
- id: guji-岳飞-event-birth
  type: birth
  date: '1103'
  year_of: 1103
  name_zh: 岳飞出生
  summary: 岳飞生于相州汤阴县，相传出生时有大禽若鹄飞鸣其上，故名飞。
- id: guji-岳飞-event-jun
  type: career
  date: '1122'
  year_of: 1122
  name_zh: 应募从军
  summary: 岳飞初次应募投军，开始军旅生涯，宣和四年从军征伐。
- id: guji-岳飞-event-jiankang
  type: career
  date: '1130'
  year_of: 1130
  name_zh: 收复建康
  summary: 岳飞率军于建康城南屡败金军，收复建康，崭露头角。
- id: guji-岳飞-event-xiaojun
  type: career
  date: '1129'
  year_of: 1129
  name_zh: 治军严明
  summary: 岳飞治军号令严明，冻死不拆屋，饿死不掳掠，岳家军之名始著。
- id: guji-岳飞-event-xiangyang
  type: career
  date: 1134-05
  year_of: 1134
  name_zh: 收复襄阳六郡
  summary: 岳飞首次北伐，收复郢州、随州、襄阳、唐州、邓州、信阳六郡。
- id: guji-岳飞-event-yancheng
  type: career
  date: 1140-07
  year_of: 1140
  name_zh: 郾城大捷
  summary: 郾城之战大破金兀术拐子马，进至朱仙镇，距汴京仅四十五里。
- id: guji-岳飞-event-banshi
  type: career
  date: 1140-09
  year_of: 1140
  name_zh: 十二道金牌班师
  summary: 一日奉十二道金字牌，被迫班师，仰天悲叹十年之功废于一旦。
- id: guji-岳飞-event-death
  type: death
  date: '1142-01-27'
  year_of: 1142
  name_zh: 冤死风波亭
  summary: 以「莫须有」罪名被赐死于大理寺，时年三十九岁，天下冤之。
