  - 忠君与北伐恢复中原大业的取舍
  lesson: 精忠报国而遭冤杀的悲剧名将
  summary_first_person: 我岳飞，生于相州汤阴，少怀报国之志。靖康之难后投军抗金，屡建战功，率岳家军北伐，郾城大捷，直指朱仙镇。然被十二道金牌召回，终遭秦桧以「莫须有」罪名冤杀于风波亭。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷365
