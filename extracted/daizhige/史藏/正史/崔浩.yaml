      raw: 太平真君十一年六月己亥（诛司徒崔浩）
  birth_date: ''
  death_date: 0450-06
  era: 北魏太武帝时期
  reign_ref: 北魏太武帝拓跋焘
  archetype: 帝王谋臣/律令改制者
  dilemmas:
  - 以汉人士族辅佐胡族君主，身处胡汉冲突与国史之祸之间
  - 深得信任而权倾一时，终因直笔修史触怒鲜卑贵戚而被诛
  lesson: 伴君谋国有术，直笔涉史无防，功高而不知敛则祸至
  summary_first_person: 我崔浩历仕北魏，以谋略见信于太武帝，官至司徒，监典礼、修律令、辅太子决庶政，数赞军机；然以修国史直书拓跋氏先世之事，激怒宗室与鲜卑大臣，于太平真君十一年六月被诛，夷灭全族。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷1
  - https://zh.wikisource.org/wiki/魏書/卷4上
