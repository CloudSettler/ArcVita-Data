person:
  qid: guji-左丘明
  name_zh: 左丘明
  names:
    zh: 左丘明
    en: Zuo Qiuming
  lifespan:
    birth:
      date: -556
      precision: year
      is_circa: true
      raw: 春秋末期鲁国太史，生年不详，相传约与孔子同时或稍前
    death:
      date: -451
      precision: year
      is_circa: true
      raw: 卒年不详
  birth_date: 约前556年（不详，一说略早于孔子）
  death_date: 约前451年（不详）
  era: 春秋末期
  archetype: 史官 / 经传撰者
  dilemmas:
  - 双目失明后仍口述著史，如何在不便目视的晚年完成浩繁的编年与国语之撰
  - 传《春秋》应以解经为体，抑或广记诸国言行而自成《国语》一书，两条路径如何兼顾
  - 身为鲁国太史，面临存史职责与政治风险的冲突，直书与避祸之间如何取舍
  lesson: 以口述与笔录相结合的方式传经存史，说明著述之志可克服身体与制度之限。
  summary_first_person: 我是春秋末期鲁国太史左丘明，世代为史官，相传与孔子同时。孔子作《春秋》，我惧弟子各执异辞、失其真意，于是为之作传，合三十篇，世称《左氏传》；又撰《国语》，上起周穆王，下迄敬王，记诸侯之事，凡二十一篇。晚年失明，犹口述成书，使经义与史事得以并存。
  source_urls:
  - https://zh.wikipedia.org/wiki/左丘明
