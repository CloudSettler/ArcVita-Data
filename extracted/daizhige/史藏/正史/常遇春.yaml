  era: 元末明初
  reign_ref: 红巾起事后至吴王建国之际
  archetype: 骁勇先锋大将
  dilemmas:
  - 遇春欲直捣元都，太祖主先撤屏蔽缓进，将帅谋略相歧
  - 攻城用武与太祖戒杀之仁之间的张弛
  lesson: 先登破阵者勇，善用其勇者须佐以庙算。
  summary_first_person: 我常遇春自至正十五年来归太祖，牛渚之役先登陷阵，此后池州屡破陈友谅，鄱阳湖射退张定边救主于危，历官平章政事、鄂国公，终为北伐副将军，随徐达讨平士诚、直取中原。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/本纪第一
