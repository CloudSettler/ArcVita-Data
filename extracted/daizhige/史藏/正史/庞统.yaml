  dilemmas:
  - 其貌不扬而才高，需先主识拔方能尽用
  - 进围雒县时身陷流矢，英年早逝
  lesson: 良才择主，器识为先；早逝之憾，令后人叹息
  summary_first_person: 我庞统，号凤雏，与孔明齐名。彭羕曾直上我榻促膝长谈，我称善之，并引荐于先主，同谋取益州之策。惜乎围雒县时中流矢而逝，未能竟兴复之业。
