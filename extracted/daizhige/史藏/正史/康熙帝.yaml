    start_date: 1583-05
    highlight_event_id: guji-nuerhaci-event-raise-army
  - key: climax
    name_zh: 兼并诸部
    labels:
      zh: 破九部联军、灭哈达辉发乌拉
    start_date: 1593-09
    highlight_event_id: guji-nuerhaci-event-nine-tribes
  - key: closure
    name_zh: 一统建州
    labels:
      zh: 尽收长白诸路、建州奠定霸业
    start_date: '1591'
    highlight_event_id: guji-nuerhaci-event-nineteen
  decisions:
  - date: 1593-09
    title_zh: 破九部之师，先败前军乘胜逐北
    rationale: 乌合之众其志不一，败其前军则军必反走。
  - date: 1599-09
    title_zh: 乘哈达内乱伐哈达
    rationale: 哈达送质乞援复私于叶赫，师出有名。
- id: guji-nuerhaci-endeavor-2
  name_zh: 建国称汗伐明
  phases:
  - key: brewing
    name_zh: 定制立国
    labels:
      zh: 釐定兵制、创制国书、置理政大臣
    start_date: 1599-02
    highlight_event_id: guji-nuerhaci-event-guo-shu
  - key: breakthrough
    name_zh: 称汗建元
    labels:
      zh: 即位建元天命、定国号金
    start_date: '1616'
    highlight_event_id: guji-nuerhaci-event-throne
  - key: climax
    name_zh: 七大恨伐明与萨尔浒大捷
    labels:
      zh: 破明四路大军、克沈阳辽阳
    start_date: '1618'
    highlight_event_id: guji-nuerhaci-event-sarhu
  - key: closure
    name_zh: 定都沈阳宁远受挫
    labels:
      zh: 迁都盛京、宁远撤军、崩于爱鸡堡
    start_date: 1626-02
    highlight_event_id: guji-nuerhaci-event-death
  decisions:
  - date: '1618'
    title_zh: 以七大恨告天伐明
    rationale: 明人助叶赫、杀吾祖父、侵夺所属，兴师有名。
  - date: 1619-03
    title_zh: 萨尔浒先破北路杜松军
    rationale: 明兵由南来者诱我南，北必有重兵，宜先破之。
  - date: 1625-03
    title_zh: 迁都沈阳
    rationale: 凡五迁乃定都，规模更远。
