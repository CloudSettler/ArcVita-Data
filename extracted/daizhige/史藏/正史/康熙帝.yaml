person:
  qid: guji-nuerhaci
  name_zh: 努尔哈齐（清太祖）
  names:
    zh: 努尔哈齐
    en: Nurhaci
  lifespan:
    birth:
      date: '1559'
      precision: year
      is_circa: false
      raw: 明嘉靖三十八年（己未）
    death:
      date: '1626-09-30'
      precision: day
      is_circa: false
      raw: 天命十一年八月庚戌（1626年），崩于爱鸡堡，年六十有八
  birth_date: '1559'
  death_date: '1626-09-30'
  era: 明朝末年至后金天命年间
  reign_ref: 天命（1616—1626）
  archetype: 开国创业之君
  dilemmas:
  - 祖父与父亲死于明兵之难，复仇与依附明朝之间的抉择
  - 对明朝称臣入贡与自立建国称汗之间的两难
  - 长子褚英暴伉失众，授政与处死之间的痛楚
  lesson: 蒙难艰贞，忍辱蓄势，以十三甲起家而终成大业。
  summary_first_person: 我以十三副遗甲起兵，先报祖仇，继并建州，破九部之师于古勒，灭哈达、辉发、乌拉、叶赫。以七大恨告天伐明，萨尔浒一战破其三路，遂取辽沈、广宁，迁都沈阳，建国号金，建元天命，用兵三十余年而成帝业。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷1
endeavors:
- id: guji-nuerhaci-endeavor-1
  name_zh: 起兵统一建州女真
  phases:
  - key: brewing
    name_zh: 蒙难蓄志
    labels:
      zh: 十三甲起家、结盟纳贤
