    highlight_event_id: guji-张仪-event-chu
  - key: closure
    name_zh: 出奔魏相而卒
    labels:
      zh: 晚岁
    start_date: ~-310
    highlight_event_id: guji-张仪-event-wei
  decisions:
  - date: ~-328
    title_zh: 入秦求仕
    rationale: 楚以盗璧之疑笞辱仪，仪以为口舌存亡所系，遂西入秦以谋功名。
  - date: ~-313
    title_zh: 使楚欺怀王绝齐
    rationale: 齐楚为纵亲，秦欲破之，乃许商於之地六百里诱楚绝齐，使合纵自解。
- id: guji-张仪-endeavor-2
  name_zh: 游说诸侯
  labels:
    zh: 遍说六国
  phases:
  - key: brewing
    name_zh: 说魏事秦为中枢
    labels:
      zh: 首说魏
    start_date: ~-322
    highlight_event_id: guji-张仪-event-shuowei
  - key: climax
    name_zh: 遍说韩魏齐赵燕
    labels:
      zh: 连横之游
    start_date: ~-311
    highlight_event_id: guji-张仪-event-chu
  decisions:
  - date: ~-311
    title_zh: 力为秦连横六国
    rationale: 借秦威势，以利诱威服之说动诸国君，使背纵约而西事秦。
events:
- id: guji-张仪-event-birth
  event_type: birth
  date: ~-356
  year_of: ~-356
  description: 张仪生，魏国安邑人，后学于鬼谷先生，习纵横之术。
- id: guji-张仪-event-bianru
  event_type: incident
  date: ~-340
  year_of: ~-340
  description: 从相楚，楚相亡璧，疑张仪盗之，执笞数百，仪不服，释之。仪曰：视吾舌尚在不？
- id: guji-张仪-event-xiang
  event_type: appointment
  date: ~-328
  year_of: ~-328
  description: 秦惠文王以为客卿，与谋伐诸侯；后为相，居秦而摄魏相之政。
- id: guji-张仪-event-shuowei
  event_type: diplomatic_mission
  date: ~-322
  year_of: ~-322
  description: 张仪相魏，欲令魏先事秦而以为诸侯之倡，魏不肯，秦伐取曲沃、平周，复厚遇魏。
- id: guji-张仪-event-chu
  event_type: diplomatic_mission
  date: ~-313
  year_of: ~-313
  description: 使楚，许楚怀王商於六百里地以诱其绝齐；楚绝齐而秦不予地，怀王大怒兴兵伐秦，兵败丹阳、蓝田。
- id: guji-张仪-event-shuoliuhuo
  event_type: diplomatic_mission
  date: ~-311
  year_of: ~-311
  description: 说韩、齐、赵、燕诸王以连横事秦，六国之约皆散，秦封仪武信君。
- id: guji-张仪-event-wei
  event_type: aftermath
  date: ~-310
  year_of: ~-310
  description: 秦武王素恶张仪，仪惧诛，因间言之魏，为魏相，期岁而卒于魏。
