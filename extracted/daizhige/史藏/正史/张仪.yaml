person:
  qid: guji-张仪
  name_zh: 张仪
  names:
    zh: 张仪
    en: Zhang Yi
  lifespan:
    birth:
      date: ~-356
      precision: year
      is_circa: true
      raw: 生年不详，约战国中期
    death:
      date: ~-309
      precision: year
      is_circa: true
      raw: 卒于秦武王元年前后
  birth_date: ~-356
  death_date: ~-309
  era: 战国
  reign_ref: 秦惠文王、秦武王
  archetype: 纵横家／外交策士
  dilemmas:
  - 以诈术相秦，_objective 求功名与道义之间的取舍
  lesson: 凭舌辩与权变纵横捭阖，瓦解合纵、连横强秦，然以诈欺成名，亦以诡道见讥于后世。
  summary_first_person: 我张仪，魏国人也，学游说之术于鬼谷先生。曾因被疑盗璧而遭笞辱，然不以小辱废志。后入秦，说惠文王，拜为客卿，继而为相。我以连横之策游说诸国，散六国之合纵：使楚绝齐盟，欺怀王以商於六百里之地；说韩、魏、齐、赵、燕以事秦，令山东之势自溃。秦武王立，我不见容，出奔魏，为魏相一岁而卒。
  source_urls:
  - https://zh.wikisource.org/wiki/史记/卷070
endeavors:
- id: guji-张仪-endeavor-1
  name_zh: 相秦用事
  labels:
    zh: 入秦为相
  phases:
  - key: brewing
    name_zh: 游学及楚受辱
    labels:
      zh: 游学
    start_date: ~-340
    highlight_event_id: guji-张仪-event-bianru
  - key: breakthrough
    name_zh: 说秦惠王拜客卿
    labels:
      zh: 入秦
    start_date: ~-328
    highlight_event_id: guji-张仪-event-xiang
  - key: climax
    name_zh: 连横破合纵
    labels:
      zh: 连横
