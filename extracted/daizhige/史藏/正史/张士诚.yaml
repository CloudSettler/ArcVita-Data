  dilemmas:
  - 偏安吴地求富庶，还是逐鹿中原争天下
  - 在元朝与朱元璋两大势力之间进退
  lesson: 保守割据而无远略者，终为锐意进取的对手所并。
  summary_first_person: 我是张士诚，起于泰州贩盐之家，乘元末大乱据高邮自称诚王，后陷平江，自称吴王，据有淮东浙西。然我名为守成，坐视朱元璋次第翦灭陈友谅、削我羽翼，终至二十万大军围平江，城破被执，霸业灰飞。
  source_urls:
  - 明史·本纪第一太祖一
