- id: guji-张巡-event-yongqiu
  type: endeavor
  date: 757-03
  year_of: 757
  details: 十五载三月乙卯，张巡及安禄山将令狐潮战于雍丘，败之；后又败翟伯玉于白沙埚。
- id: guji-张巡-event-suiyang-win
  type: endeavor
  date: 757-01
  year_of: 757
  details: 至德二载正月乙亥，安庆绪将尹子奇寇睢阳郡，张巡败之。
- id: guji-张巡-event-suiyang-fall
  type: endeavor
  date: 757-10
  year_of: 757
  details: 至德二载十月癸丑，安庆绪陷睢阳，太守许远及张巡、姚訚、南霁云皆死之。
- id: guji-张巡-event-death
  type: death
  date: 757-10
  year_of: 757
