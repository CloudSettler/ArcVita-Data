  event_type: endeavor_milestone
  description: 庄宗告克宁谋逆，承业请诛之，遂伏兵于府，置酒大会，执而杀克宁。
- id: guji-张承业-event-clash
  year_of: -908
  date: 约-908
  title_zh: 与克宁结隙
  event_type: context
  description: 克宁杀都虞候李存质，而与张承业、李存璋有隙，又求兼领大同军节度使。
