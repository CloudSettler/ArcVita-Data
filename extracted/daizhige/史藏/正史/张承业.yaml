person:
  qid: guji-张承业
  name_zh: 张承业
  names:
    zh: 张承业
  era: 五代·后唐（唐末至同光年间）
  archetype: 顾命大臣
  dilemmas:
  - 受先王托孤之重，面对庄宗季父克宁谋逆，须在骨肉之情与社稷存亡之间抉择
  - 位在宦者而执军国之权，既需辅佐幼主，又难免与骄横宗室结怨
  lesson: 受托孤之命者，当以社稷为重，临危不徇私情，方能定倾扶危。
  summary_first_person: 我受武皇临终之托，与克宁同辅亚子。庄宗即位后，克宁惑于群小之言，杀李存质，又与我有隙，求领大同。史敬熔告其谋执王及太后以降梁。庄宗问计于我，我请诛克宁，遂伏兵府第，置酒执而杀之，以安晋阳。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史/卷14
