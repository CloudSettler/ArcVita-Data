      raw: 约东汉永兴前后生年推算
    death:
      date: '143'
      precision: year
      is_circa: true
  birth_date: '98'
  death_date: '143'
  era: 东汉
  reign_ref: 汉顺帝
  archetype: 刚直御史·循吏
  dilemmas:
  - 直言弹劾权臣梁冀而仕途受阻
  - 弃车驾单车赴贼营招降张婴，身入险地以信义平乱
  lesson: 疾风知劲草，埋轮之问见风骨；以诚待下，盗贼亦可为民生。
  summary_first_person: 我张纲，字文纪，犍为武阳人，司空张皓之子。顺帝时为御史，奉命按察天下，独埋轮洛阳都亭，直言'豺狼当路，安问狐狸'，劾奏大将军梁冀。后出为广陵太守，单车诣张婴垒，以恩信招降积贼，郡中大治；年三十六卒于任上，百姓如丧考妣。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷56
