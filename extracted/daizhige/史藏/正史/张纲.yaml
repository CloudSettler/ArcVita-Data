- id: guji-张纲-event-death
  type: death
  date: '0143'
  year_of: '143'
  description: 卒于广陵太守任上，年三十六，张婴等五百余人为之衰绖负土成坟。
- id: guji-张纲-event-2
  type: career
  date: '0140'
  year_of: '140'
  description: 补御史，与杜乔、周举等八人同日拜命，分巡天下州郡。
- id: guji-张纲-event-3
  type: career
  date: '0142'
  year_of: '142'
  description: 埋轮洛阳都亭，上书劾奏大将军梁冀、河南尹梁不疑，直声震朝廷。
- id: guji-张纲-event-4
  type: career
  date: '0142'
  year_of: '142'
  description: 以直忤梁冀，出为广陵太守，时张婴聚众寇乱徐、扬十余年。
- id: guji-张纲-event-5
  type: career
  date: '0142'
  year_of: '142'
  description: 单车径诣张婴垒门，喻以恩信，婴感悟降，旬日间散遣万余众，一方遂安。
- id: guji-张纲-event-6
  type: career
  date: '0143'
  year_of: '143'
  description: 卒于广陵太守任上，郡人张婴等五百余人穿心制服，负土成坟。
