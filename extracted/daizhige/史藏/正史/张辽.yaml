  era: 东汉末至三国曹魏
  reign_ref: 汉灵帝、汉献帝、魏文帝
  archetype: 名将
  dilemmas:
  - 降将身份如何赢得主君信任
  - 忠于新主与旧主恩义之间的抉择
  lesson: 勇而有谋，临阵决机，能以少胜多者成大事
  summary_first_person: 我张辽字文远，本姓聂，雁门马邑人。初事丁原、董卓、吕布，吕布败亡后归降曹操，拜中郎将。我随曹公征伐，北征乌桓于白狼山斩单于蹋顿，守合肥破孙权十万之众，威震逍遥津，以少胜多名扬江东。后拜征东将军，曹丕即位进为前将军，病中还吴防备，卒于江都，谥曰刚侯。
  source_urls:
  - https://zh.wikisource.org/wiki/三國志/卷17
