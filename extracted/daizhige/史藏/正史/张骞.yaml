  decisions:
  - date: -119
    title_zh: 建议厚赂乌孙，遣公主和亲以断匈奴右臂
    rationale: 乌孙东归故地，可牵制匈奴，并为西域诸国之招徕。
events:
- id: guji-张骞-event-birth
  date: -195
  year_of: -195
  type: birth
  name_zh: 张骞生
  description: 张骞生于汉中城固（生年史无明文，约为西汉前期）。
- id: guji-张骞-event-embassy-1
  date: -139
  year_of: -139
  type: endeavor
  name_zh: 建元中应募出使西域
  description: 张骞以郎应募，率百余人自长安出发，欲联大月氏共击匈奴。
- id: guji-张骞-event-capture
  date: -138
  year_of: -139
  type: endeavor
  name_zh: 途中为匈奴所俘
  description: 取道匈奴时被扣留十余年，娶妻生子，然持汉节不失。
- id: guji-张骞-event-dayuezhi
  date: -129
  year_of: -129
  type: endeavor
  name_zh: 抵大月氏、大宛，考察西域
  description: 经大宛、康居至大月氏，月氏已乐居无意攻匈奴，使命未竟而获西域山川物产之详。
- id: guji-张骞-event-return-1
  date: -126
  year_of: -126
  type: endeavor
  name_zh: 辗转归汉复命
  description: 自西域取南道归汉，时从者仅堂邑父在，拜为太中大夫，凿空之功自此始。
- id: guji-张骞-event-marquis
  date: -123
  year_of: -123
  type: honor
  name_zh: 以从卫青击匈奴功封博望侯
  description: 元朔六年张骞以校尉从大将军卫青出征有功，封博望侯。
- id: guji-张骞-event-embassy-2
  date: -119
  year_of: -119
  type: endeavor
  name_zh: 二使西域通乌孙
  description: 拜中郎将，将三百人赍金币帛出使乌孙，并分遣副使使大宛、康居、大夏诸国。
- id: guji-张骞-event-wusun
  date: -116
  year_of: -116
  type: endeavor
  name_zh: 乌孙遣使报谢，西域道通
  description: 乌孙发译道送骞归汉并献马，西域诸国始通于汉，丝绸之路渐开。
- id: guji-张骞-event-death
  date: -114
  year_of: -114
  type: death
  name_zh: 张骞卒
  description: 张骞去世（约元鼎三年），后其事迹载于《汉书·张骞李广利传》（卷六十一）。
