    title_zh: 应募出使大月氏，谋夹击匈奴
    rationale: 汉武帝欲联大月氏断匈奴右臂，骞以郎应募，勇担使命。
  - date: -129
    title_zh: 自匈奴脱亡，西行数千里抵大宛
    rationale: 虽被扣十余年，乘隙逃亡，不忘使命，继续西进。
