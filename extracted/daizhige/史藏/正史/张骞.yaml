      precision: year
      is_circa: true
      raw: 约元鼎三年卒
  birth_date: -195
  death_date: -114
  era: 西汉
  reign_ref: 汉武帝
  archetype: 凿空西域的外交探险家
  dilemmas:
  - 身陷匈奴十余年，持汉节不失，去留之间忠于使命
  - 联络大月氏共击匈奴的战略目标落空，如何转化外交成果
  lesson: 凿空西域，虽使命未竟而通途自开
  summary_first_person: 我张骞奉汉武帝之命出使西域，两度被匈奴扣留而持节不屈，终通大宛、大月氏、乌孙诸国，开丝绸之路之先声，以博望侯名垂青史。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷061
