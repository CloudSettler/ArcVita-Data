  summary_zh: 徐广，东晋东莞姑幕人，曾任中散大夫。研核众本为《史记》作《音义》，具列异同、兼述训解，裴骃《史记集解》即以徐氏之学为本增演而成，对《史记》校勘训诂 contrib极巨。
  lessons:
  - 核众本、具列异同，校勘求实而后训解有所依托
  first_person_summary: 我是徐广，东晋东莞人，因研核《史记》众本、撰《音义》具列异同兼述训解，而使后世裴骃得以本之撰《集解》，训诂校勘之学赖此不坠。
