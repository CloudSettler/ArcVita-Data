  archetype: 忠谏之谋臣·降将
  dilemmas:
  - 直谏尔朱兆勿放高欢离山东，忠言逆耳反遭囚禁
  - 尔朱氏败亡后择降，归于昔日劲敌高欢
  lesson: 谋臣识远，忠谏虽见拒于一时，其言日后皆验；识时降主，终能保全。
  summary_first_person: 我是慕容绍宗，尔朱兆长史。高欢欲携六镇降户就食山东，我力谏不可，言高公雄略握兵，恐不可制，兆不听，反因左右谗言而禁我。韩陵之败，兆叩心叹不用我言；我收聚散卒，整军容而西。后我以尔朱荣妻子及余众保乌突城，降于高欢，神武念旧义，待我甚厚。
