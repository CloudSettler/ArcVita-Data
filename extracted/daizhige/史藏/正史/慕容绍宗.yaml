  name_zh: 谏尔朱兆勿遣六镇降户就食山东
  detail: 绍宗谏曰高公雄略又握大兵将不可为，兆以香火重誓自解；左右受高欢金而谮绍宗旧有隙，兆乃禁绍宗而催神武发。
