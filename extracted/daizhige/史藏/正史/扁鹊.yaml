events:
- id: guji-bianque-event-birth
  type: birth
  date: -407
  year_of: 公元前407年
  content: 扁鹊（秦越人）约于此年间生，勃海郡郑人也。
- id: guji-bianque-event-apprentice
  type: milestone
  date: -403
  year_of: 约公元前403年
  content: 舍客长桑君过，扁鹊独奇之，常谨遇之；长桑君出上药并禁方书，饮以上池之水，视见垣一方人，自此为医。
- id: guji-bianque-event-jin
  type: career
  date: -397
  year_of: 约公元前397年
  content: 过虢、行至晋，为赵简子按脉，言其血脉治，简子寤而酬之。
- id: guji-bianque-event-guo
  type: career
  date: -387
  year_of: 约公元前387年
  content: 路过虢，闻虢太子死未半日，自荐视之，断为尸蹶，使弟子子阳厉针砥石、子豹为方熨，太子遂复生，天下尽以扁鹊为能生死人。
- id: guji-bianque-event-huan
  type: career
  date: -353
  year_of: 约公元前353年
  content: 见齐桓侯（一作蔡桓公），四见而疾由腠理至骨髓，桓侯不以为然，扁鹊去，桓侯后病发而死。
- id: guji-bianque-event-departments
  type: career
  date: -330
  year_of: 约公元前330年
  content: 周游列国，随俗为变：在赵为带下医，过雒阳为耳目痹医，入咸阳为小儿医。
- id: guji-bianque-event-death
  type: death
  date: -310
  year_of: 约公元前310年
  content: 入秦，秦太医令李醯自知伎不如扁鹊，使人刺杀之，扁鹊卒于途。
