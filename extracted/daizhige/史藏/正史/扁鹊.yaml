  dilemmas:
  - 讳疾忌医者不可救，医者三易之道的取舍
  - 医术精而遭权贵嫉妒残害之危
  lesson: 信医者生，讳疾者亡；良医当随俗为变，不拘一术
  summary_first_person: 我名秦越人，世人以良医之称叫我扁鹊。我得长桑君禁方，能视见垣一方人，以此视病尽见五脏症结，行医列国，随俗为变，卒遭秦太医令李醯妒杀。
