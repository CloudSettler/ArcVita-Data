  era: 三国至西晋
  reign_ref: 始祖神元皇帝，飨国五十八年（庚子元年，即魏黄初元年前后）
  archetype: 部族缔造者
  dilemmas:
  - 依附没鹿回部窦宾时隐功不报，以退让换取北居长川、蓄积部众之机
  - 太子沙漠汗遭诸大人离间构陷，年老之君偏听而令除之，事后深悔
  - 面对匈奴、蹋顿抄掠边民之前车，弃掠夺而与魏晋和亲互市
  lesson: 忍隐蓄势、以德化聚众可成大业；然年老易惑、偏信谗言则骨肉相残、基业播荡。
  summary_first_person: 我拓跋力微，生而英睿。始西部内侵，部民离散，我依没鹿回部大人窦宾。宾军败失马，我以骏马相赠而不言其功，宾知后欲分国半以奉我，我不受，唯请率所部北居长川。积十数年，德化大洽，旧部咸来归附。宾二子谋逆，我召杀之，尽并其众，控弦二十余万。后迁于定襄之盛乐，祭天而戮观望不至之白部大人，远近震慑。我历观前世抄掠之害，乃与魏和亲，遣子沙漠汗如魏观风土，聘问交市不绝。然太子久留洛阳，习南夏奇术，诸大人惧其变易旧俗，加以卫瓘金锦离间，我年逾期颐，颇有所惑，竟许除之，旋即深悔。其年我病，乌丸王库贤复以砥斧之诈摇动诸部，我先崩，年一百四岁，飨国五十八年。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷1
