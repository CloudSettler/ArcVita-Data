person:
  qid: guji-tuobasi
  name_zh: 拓跋嗣
  names:
    zh: 拓跋嗣
    en: Tuoba Si
  lifespan:
    birth:
      date: '392'
      precision: year
      is_circa: false
      raw: 天兴元年前后生
    death:
      date: 423-11-10
  birth_date: '392'
  death_date: 423-11-10
  era: 北魏
  reign_ref: 明元帝（永兴、神瑞、泰常年间，409—423在位）
  archetype: monarch
  dilemmas:
  - 其父道武帝晚年猜忌，欲废嗣立清河王绍，嗣被迫出逃在外，夹忠于父与保身之间
  - 即位后刘宋乘丧南伐，须在孝义与国家安全之间抉择攻防之策
  lesson: 隐忍避祸、承乱继统者，须以宽政安民、筑城备边方能固国祚。
  summary_first_person: 我是拓跋嗣，北魏明元帝。父道武帝晚年苛虐，我避祸出逃；绍弑逆后我诛之即位。在位间却刘宋、御柔然，筑长城二千余里，设六镇之雏，为子嗣拓跋焘统一北方奠定根基。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷03
