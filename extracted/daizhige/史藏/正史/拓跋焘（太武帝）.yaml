  - date: 0429
    title_zh: 倾力北击柔然
    rationale: 柔然屡扰北边，不先除之则中原之兵无以专意南顾。
  - date: 280
    title_zh: 先取夏国再定南方
    rationale: 赫连氏据关中膏腴之地，南朝新定，先西后南尤为得力。
  - date: 0439
    title_zh: 讨沮渠牧犍灭北凉
    rationale: 北凉苟安一隅，不并则河西不通，北土终不得混一。
