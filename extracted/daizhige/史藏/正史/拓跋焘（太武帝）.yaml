  - date: 288
    title_zh: 受天师道箓，崇道教
    rationale: 欲假神道立华夏正统之号，收中夏士民之心。
  - date: 294
    title_zh: 断禁佛法、毁寺焚经
    rationale: 盖吴乱起而沙门藏匿兵器，虑佛门为奸宄所托，故断其法。
  - date: 296
    title_zh: 诛崔浩夷五族
    rationale: 国史直书国恶，忿诸鲜卑大人之言，遂兴大狱。
