person:
  qid: guji-tuobatao
  name_zh: 拓跋焘
  names:
    zh: 拓跋焘
    en: Tuoba Tao / Emperor Taiwu of Northern Wei
  lifespan:
    birth:
      date: 0408
      precision: year
      is_circa: true
      raw: 生年不详，约北魏天兴年间
    death:
      date: 0452-03-11
      precision: day
      is_circa: false
      raw: 正平二年中常侍宗爱所弑
  birth_date: 0408
  death_date: 0452-03-11
  era: 南北朝 · 北魏
  reign_ref: 北魏太武帝（始光—正平，423-452 在位）
  archetype: 开疆建制之雄主
  dilemmas:
  - 灭佛崇道与安邦固本之争
  - 华夏正统与鲜卑旧俗之取舍
  - 威严驭下与近侍之祸的疏失
  lesson: 武功可以定四海，然苛察寡信、近身无防，虽有混一之志，终不免肘腋之变。
  summary_first_person: 我拓跋焘，北魏明元帝长子，年十五嗣位。在位近三十年，先后击破柔然、夏国赫连氏、北凉沮渠氏，于四三九年统一北方，与南朝宋对峙，成南北之势。我用法严急，太平真君年间纳崔浩之议，崇天师道而果断禁佛，惩抑豪强，以武定天下、以律齐万民。然晚年苛暴多疑，宗爱得近左右，正平二年我为所弑。魏收书纪我世祖太武皇帝，功业赫赫，而殁于近侍之手，可为后世鉴。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷4上
  - https://zh.wikisource.org/wiki/魏書/卷4下
