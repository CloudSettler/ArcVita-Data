person:
  qid: guji-拓跋珪
  name_zh: 拓跋珪（道武帝）
  names:
    zh: 拓跋珪
    en: Tuoba Gui
  lifespan:
    birth:
      date: '371'
      precision: year
      is_circa: false
      raw: 建国三十四年（什翼犍之世）
    death:
      date: '409'
      precision: year
      is_circa: false
  birth_date: '371'
  death_date: '409'
  era: 十六国至北魏初期
  reign_ref: 北魏道武帝（386—409 在位，年号登国、皇始、天兴、天赐）
  archetype: 开国雄主
  dilemmas:
  - 流亡寄居贺兰部，国统中绝，须在部族离散与强邻环伺中复国
  - 复国后面对离散诸部与慕容、后燕等强敌，离散部落、编户定居与保持鲜卑旧俗之间的取舍
  - 晚期刚愎多疑，诛戮大臣，终致父子相残之祸
  lesson: 复兴弱国须审势待时、断行变革，然功成之后的猜忌与暴力往往自毁其业。
  summary_first_person: 我是拓跋珪，代国覆灭后随母流亡，寄居贺兰部与后燕之间。十六岁复国称魏王，破刘显、灭刘卫辰，离散诸部、编为编户，逐步建军立制。登国十年参合陂大破后燕，皇始年间攻克中山，尽有华北要地。天兴元年定都平城，称皇帝，营宫室、立官制、定冠服，仿华夏规范建立帝业。然而晚年忧愤猜忌，jaw常服寒食散，喜怒无常，天赐六年终死于清河王绍之手。
  source_urls:
  - https://zh.wikisource.org/wiki/魏书/卷一
  - https://zh.wikisource.org/wiki/魏书/卷二
