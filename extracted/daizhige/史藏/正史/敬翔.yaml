  era: 五代十国
  reign_ref: 后梁太祖朱温至后梁末帝时期
  archetype: 谋士
  dilemmas:
  - 佐梁新政而梁长期被视为僭伪之国，忠与名的两难
  - 朱氏内乱频发（友珪弑父、兄弟相残），事主与事国的两难
  lesson: 危乱之世佐霸者，需以谋略持正，然身仕僭朝，功业难掩名分之憾。
  summary_first_person: 我敬翔，后梁太府卿，开平元年太祖朱温改枢密院为崇政院，以我为崇政院使，掌枢机之任。乾化二年太祖遇弑后，末帝即位，又以我为中书侍郎、同中书门下平章事，预闻国政。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史/卷02
  - https://zh.wikisource.org/wiki/新五代史/卷03
