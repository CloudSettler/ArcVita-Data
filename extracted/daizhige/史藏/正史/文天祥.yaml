    rationale: 元军渡江，诏天下勤王，天祥尽捐家赀为军费，率万人入卫临安。
  - date: '1276'
    title_zh: 出使元营抗辩不屈
    rationale: 以右丞相身份赴伯颜军前谈判，力争国体，被扣留后于镇江脱逃。
  - date: 1278-12
    title_zh: 五坡岭被俘不降
    rationale: 兵败被执，欲服脑〔毒〕自尽未死，绝食抗元，后作《正气歌》。
  - date: '1283-01-09'
    title_zh: 从容就义于柴市
    rationale: 囚三年，元廷许以宰相之位劝降，终不降，向南再拜而死。
