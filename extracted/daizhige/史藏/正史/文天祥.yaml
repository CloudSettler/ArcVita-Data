  dilemmas:
  - 降元保全性命 versus 守节殉国
  - 出仕勤王屡败 versus 明知不可为而为之
  lesson: 人生自古谁无死，留取丹心照汗青；以身殉节，气节重于生死。
  summary_first_person: 我乃南宋文天祥，宝祐四年状元及第。元兵渡江，我散家财、起义军勤王，出使元营被拘，脱险后再度举兵，兵败五坡岭被俘。囚于燕京三年，元世祖屡劝不降，终从容就义，作《正气歌》以明志。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷418
  - https://zh.wikipedia.org/wiki/文天祥
