  dilemmas:
  - 名门将种，父子俱侍霸府，忠武与功高震主之危难以两全
  lesson: 一箭中的虽显技艺，然生于权门，武略愈盛愈易招忌
  summary_first_person: 我斛律光，出敕勒名将之家。本事高氏霸府，在晋阳曾奉世子高澄之命，一箭射落集于亭树的恶鸟，军中皆服我射御之精。后位至北齐大将军，功名盖世，终为朝堂谗构所杀。
