    rationale: 高欢与魏帝相疑，部署将帅防宇文泰，倚重斛律金为方面之任。
  - date: '547'
    title_zh: 受神武临终托付，辅佐世子高澄
    rationale: 「厍狄干鲜卑老公，斛律金敕勒老公，并性遒直，终不负汝。」以其忠直可托。
