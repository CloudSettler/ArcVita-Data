      date: '488'
      precision: year
      is_circa: true
      raw: 约Raised in Northern Wei era（生年约488）
    death:
      date: '567'
      precision: year
      is_circa: true
      raw: 卒于北齐天统年间（享年八十）
  birth_date: '488'
  death_date: '567'
  era: 北魏—东魏—北齐
  reign_ref: 东魏孝静帝、北齐文襄/文宣帝时期
  archetype: 敕勒老将、性遒直之元勋
  dilemmas:
  - 身为敕勒族将，历事尔朱、高氏两朝，如何在乱世中择主自保全节
  - 玉壁败军之后士气低落，以悲歌《敕勒歌》稳军心
  lesson: 性遒直忠谨，高龄宿将仍被托孤信重，以质朴诚信终不辜负所托。
  summary_first_person: 我斛律金，敕勒人也，性遒直，历事高氏，汾州刺史、大将军之列。玉壁军中，神武命我唱《敕勒歌》，并自和之，哀感流涕。神武临终托付世子，谓我敕勒老公终不负汝。晚年在北齐以元勋宿将辅政，以为国之长城。
  source_urls:
  - https://zh.wikisource.org/wiki/北齊書/卷2_帝紀第二_神武下
