  name_zh: 明德马皇后
  names:
    zh: 明德马皇后
    en: Empress Ma (Mingde)
  lifespan:
    birth:
      date: '39'
      precision: year
      is_circa: true
      raw: 约东汉建武年间生
    death:
      date: '79'
      precision: year
      is_circa: false
      raw: 建初四年卒
  birth_date: '39'
  death_date: '79'
  era: 东汉
  reign_ref: 汉明帝、汉章帝
  archetype: 贤后·抑制外戚
  dilemmas:
  - 儿子章帝欲封诸舅为侯以尽孝，马后若允则启外戚专权之祸，若坚辞则恐子陷"不孝"之名
  - 传称其节俭身衣大练，然赐诸贵人白越杂帛黄金、赐广平钜鹿乐成王各钱五百万，节俭之名与赏赐之实相矛盾
  lesson: 抑制外戚、力辞封爵虽为远虑，然史笔褒贬未必尽实，尽信史不如无史
  summary_first_person: 我为明帝皇后，一生力倡节俭，苦辞外戚封侯，恐马氏干预朝政重蹈覆辙；然身后史书所记，贤名与赏赐挥霍、苦辞与长恨之言相互矛盾，遂令后人疑信参半。
  source_urls:
  - https://ctext.org/book-of-later-han
