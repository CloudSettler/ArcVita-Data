  dilemmas:
  - 削藩固国与激起七国之乱的矛盾
  - 忠于社稷却被景帝斩杀以谢诸侯
  lesson: 改革者常为化解危机付出生命代价
  summary_first_person: 我名晁错，汉景帝时为御史大夫，力主削夺诸侯封地以尊朝廷。吴楚七国遂以“清君侧”为名起兵反叛，景帝为息兵祸，将我斩杀以谢七国，然乱终未止，我以死殉削藩之策。
  source_urls:
  - https://zh.wikisource.org/wiki/前漢書/卷005
