  name_zh: 晏婴
  names:
    zh: 晏婴
    en: Yan Ying
  lifespan:
    birth:
      date: -600
      precision: year
      is_circa: true
      raw: 生年不详，约齐惠公、顷公之世
    death:
      date: -500
      precision: year
      is_circa: false
      raw: 景公四十八年（前500年）夹谷之会后卒
  birth_date: -600
  death_date: -500
  era: 春秋
  reign_ref: 齐灵公、齐庄公、齐景公之世
  archetype: 忠谏之相
  dilemmas:
  - 崔杼弑君之际，君死于私欲而臣是否当殉难
  - 景公奢侈厚赋，谏则忤君，不谏则害民
  - 田氏以私德收民心，预知政将归田而无力回天
  lesson: 君为社稷死则死之，为社稷亡则亡之；若为己而死，非其私昵谁敢任之
  summary_first_person: 我晏婴历事灵公、庄公、景公三朝。崔杼弑庄公时，我不从君于私死，枕尸而哭三踊而出，崔杼以我为民望而舍之。二相要盟，我誓唯从忠于君利社稷者。景公时彗星见而群臣祈祷禳灾，我笑而直谏：君高台深池、赋敛无度、刑罚不胜，民怨以万数，一人何能禳之。我亦使晋，与叔向私语，预言齐政终归田氏。我死之岁，景公会鲁侯于夹谷。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷032
