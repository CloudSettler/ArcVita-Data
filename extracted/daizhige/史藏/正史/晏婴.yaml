  decisions:
  - date: -548
    title_zh: 不殉庄公私死之难，唯从社稷公义
    rationale: 君以私欲取祸，臣当从公义而非私昵；枕尸哭踊而得存，崔杼以其为民望舍之
  - date: -548
    title_zh: 拒与崔庆之盟
    rationale: 婴所不唯忠于君利社稷者是从，不肯与不义之盟，庆封欲杀之而崔杼止之
  - date: -522
    title_zh: 笑止群臣禳彗星之祷，谏修德政
    rationale: 民苦怨万数，神不可祝而来亦可禳而去，一人禳之安能胜众口
- id: guji-晏婴-endeavor-2
  name_zh: 出使邻邦，问礼察政，与叔向论齐之将归田氏
