  - 事若不成，恐秦族灭其家，故让沛公之位于刘季
  lesson: 知时让贤、谨守成法，可成大功
  summary_first_person: 我曹参本是沛县狱掾，秦末与萧何同为县吏。陈胜起事后，我们劝沛令召刘季，沛令反悔闭城，我与萧何逾城投奔刘季。众人推我为沛公，我以自爱恐事不就而让于刘季。此后随沛公起兵，为汉攻城略地，终为汉相。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷008
