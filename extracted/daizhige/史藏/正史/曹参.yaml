events:
- id: guji-caocan-event-counsel
  person_id: guji-caocan
  date: -209-08
  year_of: -209
  date_precision: month
  type: decision
  name_zh: 陈胜起事，曹参与萧何劝沛令召刘季
  detail: 秦二世元年秋，陈胜起于蕲，沛令欲以沛应之，掾、主吏萧何、曹参建议召诸亡在外者可得数百人，因劫众。乃令樊哙召刘季。
- id: guji-caocan-event-flee
  person_id: guji-caocan
  date: -209-09
  year_of: -209
  date_precision: month
  type: escape
  name_zh: 沛令反悔，曹参逾城保刘季
  detail: 沛令后悔恐其有变，闭城城守，欲诛萧、曹。萧、曹恐，逾城保刘季，刘季以书射城上谕沛父老，父老杀沛令迎刘季。
- id: guji-caocan-event-recruit
  person_id: guji-caocan
  date: -209-09
  year_of: -209
  date_precision: month
  type: military
  name_zh: 曹参等收沛子弟二三千人
  detail: 立刘季为沛公后，少年豪吏如萧、曹、樊哙等皆为收沛子弟二三千人，攻胡陵、方与，还守丰。
- id: guji-caocan-event-yield
  person_id: guji-caocan
  date: -209-09
  year_of: -209
  date_precision: month
  type: decision
  name_zh: 曹参等文吏自爱让位
  detail: 众欲立曹参为沛令，萧、曹等皆文吏，自爱，恐事不就，后秦种族其家，尽让刘季，乃立刘季为沛公。
