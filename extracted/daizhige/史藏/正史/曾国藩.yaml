person:
  qid: guji-努尔哈齐
  name_zh: 努尔哈齐
  names:
    zh: 努尔哈齐
    en: Nurhaci
  lifespan:
    birth:
      date: 1559
      precision: year
      is_circa: false
      raw: 明嘉靖三十八年己未
    death:
      date: 1626-09-30
      precision: day
      is_circa: false
      raw: 天命十一年八月庚戌，崩于爱鸡堡
  birth_date: 1559
  death_date: 1626-09-30
  era: 明末·后金
  reign_ref: 天命（1616—1626）
  archetype: 开国君主·军事征服者
  dilemmas:
  - 祖父景祖、父亲显祖死于明兵之难，血仇在身而势孤力单，须隐忍蓄势还是遽然报复的两难
  - 长期向明称臣纳贡换取战略空间，与羽毛丰满后自立建国公开决裂的抉择
  - 长子褚英暴伉失众，欲授政而止，储位与诸贝勒权力平衡的困局
  - 宁远受挫于袁崇焕，用兵三十余年未逢抗手，暮年雄师如何自处
  lesson: 以遗甲十三起于微末，凭隐忍蓄力、立法建制、用人不咎、用兵果决，数十年经营终成开国之业
  summary_first_person: 我本建州子弟，祖与父死于兵祸，几不免于难。年二十五以遗甲十三起兵讨尼堪外兰，此后攻兆佳、取图伦、破九部联军于古勒山，兼并哈达、辉发、乌拉，终灭叶赫，收长白山与东海诸路。我创国书、定八旗、立法制，丙辰岁受覆育列国英明皇帝之号，建国曰金，建元天命。复以七大恨告天伐明，萨尔浒四日破其三路大军，下开原、铁岭、沈阳、辽阳、广宁，迁都盛京。惟末年攻宁远，挫于袁崇焕婴城固守，叹其人乃能尔耶，未几崩于爱鸡堡，年六十有八。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷1
