  reign_ref: 被诸部共立为局儿罕（众汗之汗）
  archetype: 染雄叛友
  dilemmas:
  - 与铁木真旧谊情分与草原争霸野心不可两全
  - 投靠乃蛮太阳罕却深知其军容亡败，进退失据
  lesson: 巧言寡信、唯以阴谋合纵者，终难敌宽仁得众之雄主
  summary_first_person: 我札木合，蒙古札答阑部人，与铁木真为安答之交，屡合诸部与之争雄。然答兰版朱思、海剌儿诸战皆败，虽伪附太阳罕，见其军容不振即遁去，终不得志，随汪罕败后奔乃蛮，为帝所执，霸业尽付流水。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷1
