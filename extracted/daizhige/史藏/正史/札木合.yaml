  date: ''
  start_date: ''
  title_zh: 从太阳罕与铁木真战于沆海山，见军容整肃引兵遁去
  summary: 札木合从太阳罕来，见帝军容整肃，谓左右殆非往时矣，遂引所部兵遁去。
