  era: 唐末五代
  reign_ref: 后梁太祖，开平元年（907）即皇帝位，国号梁
  archetype: 篡代枭雄
  dilemmas:
  - 背弃黄巢归唐以取富贵
  - 弑昭宗篡唐自立而终遭亲子所弑
  lesson: 以诈力取天下者，亦常死于骨肉之诈力
  summary_first_person: 我本砀山贫家之子，从黄巢起兵，数败于河中而降唐，获赐名全忠，据汴州宣武一镇。此后破秦宗权、并兖郓、败时溥、击李克用、胁天子迁都洛阳，弑昭宗，废唐自立为梁帝。然晚年昏暴，母子兄弟相猜，乾化二年为郢王友珪所弑。
  source_urls:
  - 新五代史·卷一梁本纪第一
  - 新五代史·卷二梁本纪第二
