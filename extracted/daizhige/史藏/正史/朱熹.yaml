      is_circa: false
      raw: 庆元六年三月初九日，卒于建阳考亭
  birth_date: 1130-10-18
  death_date: 1200-04-23
  era: 南宋
  reign_ref: 宋高宗建炎 / 宋宁宗庆元
  archetype: listarb
  dilemmas:
  - 道尊于势：以儒者之学 wahupi 时君，屡遭贬抑而不改其说
  - 经世与讲学：出仕不久辄退，终以书院讲学著述为终身之业
  - 庆元党禁：学说被指为伪学，进退之际守死善道
  lesson: 理一分殊，格物致知；道统虽厄于一时，终为百世之师。
  summary_first_person: 吾朱熹，徽州婺源人，生于尤溪。幼颖悟，父卒后受学于延平李侗，得程氏正脉。举进士后仕于外，历同安主簿、知南康军期间重建白鹿洞书院，奏灾荒、兴教化。屡上封事论天下大计，孝宗朝数召对而持论鲠直。晚年知漳州、潭州，刊四经四子之书。宁宗朝入为焕章阁待制兼侍讲，四十余日而罢。庆元中伪学禁兴，吾讲学不辍，注述遍于群经，集《四书章句集注》，卒后逾年党禁乃解，谥曰文。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷429
