person:
  qid: guji-朱熹
  name_zh: 朱熹
  names:
    zh: 朱熹 / 元晦 / 晦庵
    en: Zhu Xi
  lifespan:
    birth:
      date: 1130-10-18
      precision: day
      is_circa: false
      raw: 建炎四年九月十五日，生于南剑州尤溪
    death:
      date: 1200-04-23
