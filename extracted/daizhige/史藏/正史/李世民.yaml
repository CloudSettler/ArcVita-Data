person:
  qid: guji-李世民
  name_zh: 李世民
  names:
    zh: 李世民
    en: Li Shimin
  lifespan:
    birth:
      date: '-599'
      precision: year
      is_circa: true
      raw: 隋开皇十七年（约599年）
    death:
      date: 649-07-10
      precision: day
      is_circa: false
      raw: 贞观二十三年五月（649年）
  birth_date: '-599'
  death_date: 649-07-10
  era: 唐初（武德—贞观）
  reign_ref: 贞观（626—649）
  archetype: 创业守成之君
  dilemmas:
  - 天人感应灾异之戒与励精图治之间如何自处
  - 政变夺位带来的合法性压力
  lesson: 灾祥之变，人君以修德应之，胜于缘饰符瑞。
  summary_first_person: 我李世民，以贞观之治名垂青史。史册五行志中频见我朝灾异：陇右山摧、凉州石文、讹言惊扰、连年大旱，我或遣使祭告，或开坊慰谕，皆以修德答天谴自励。
  source_urls:
  - https://zh.wikisource.org/wiki/新唐书/卷34
