  - date: 626-07-02
    title_zh: 玄武门定策，受禅即位
    rationale: 以非常之举定储位，随后改元贞观，开创治世。
  - date: '643'
    title_zh: 查祥瑞而存寅惧，遣使祭凉州瑞石
    rationale: 石文有“李世民”字，太宗以“弥增寅惧”应之，不敢自矜天命。
  - date: 643-07
    title_zh: 处置“枨枨杀人”讹言
    rationale: 太宗恶之，令通夜开诸坊门，宣旨慰谕，以安民心而不以刑威压之。
- id: guji-李世民-endeavor-2
  name_zh: 修德应灾，以政弭异
