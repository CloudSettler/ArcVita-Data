  lesson: 临危受命、以少胜多可为柱石，然功高盖主亦须善处君臣之际。
  summary_first_person: 我是李光弼，契丹裔唐将。安史之乱中我受任河东节度副使，与郭子仪并称中兴名将，克常山、赵郡，守太原，战河阳，屡挫史思明；后邙山失利罢副元帅，出镇河南，功高见忌，郁郁而终。
