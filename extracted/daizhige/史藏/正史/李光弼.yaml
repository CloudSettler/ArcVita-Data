  event_type: endeavor
  date: 0761-02-01
  year_of: 761
  summary_zh: 上元二年二月戊寅，李光弼与史思明战于北邙，败绩，思明陷河阳，光弼罢副元帅。
- id: guji-李光弼-event-henan
