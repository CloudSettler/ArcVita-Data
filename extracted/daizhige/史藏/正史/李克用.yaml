  era: 唐末至五代初
  reign_ref: 河东节度使、唐封晋王
  archetype: 藩镇枭雄
  dilemmas:
  - 忠于唐室与自立称雄之间的抉择
  - 与朱温仇怨深结而无力独灭梁
  lesson: 生于乱世，骁勇盖世而终未能定天下，遗志子承方成一朝。
  summary_first_person: 我李克用，沙陀飞虎子，一目微眇而箭法无双。我率黑鸦军破黄巢、收京师，官至河东节度使，封晋王。与朱温有上源驿之仇，终身与之相攻，虽屡胜屡败，至死未降梁。我遗志托于存勖，后来他灭梁建后唐，我在九泉可瞑目矣。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史/卷4
