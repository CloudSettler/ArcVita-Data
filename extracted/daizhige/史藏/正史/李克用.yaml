  title_zh: 唐廷召其率沙陀军入援镇压黄巢
  desc_zh: 黄巢乱起，李克用奉诏南下讨贼，自此崭露头角。
- id: guji-李克用-event-2
  date: 883-05
  year_of: 883
  type: endeavor
  title_zh: 破黄巢复长安，任河东节度使
  desc_zh: 率军下太行度河出洛阳，会诸镇兵击巢，收复京师，拜河东节度使。
- id: guji-李克用-event-3
  date: 884-06
  year_of: 884
  type: endeavor
  title_zh: 上源驿之变，朱温夜袭李克用
  desc_zh: 追黄巢至冤朐而旋，过汴州，朱温于上源驿夜攻之，逾城而免，自此结下深仇。
- id: guji-李克用-event-4
  date: 901-05
  year_of: 901
  type: endeavor
  title_zh: 梁军会攻太原，围城不克
  desc_zh: 朱温大举攻晋，诸军会于太原围之，李克用坚守，梁军遇雨而还。
- id: guji-李克用-event-5
  date: 908-02
  year_of: 908
  type: death
  title_zh: 李克用卒于晋阳
  desc_zh: 称晋王一年而病没，遗命其子存勖讨灭后梁。
