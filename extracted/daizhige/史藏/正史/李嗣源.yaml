  era: 唐末至五代后唐
  reign_ref: 后唐明宗，天成、长兴年间在位
  archetype: 沙陀养子出身的守成之君
  dilemmas:
  - 受命讨乱而部众哗变，被迫反戈
  - 即位后于养父功业与自身政权合法性之间权衡
  lesson: 乱世之中，武力可致大位，唯政通人和方能称治
  summary_first_person: 我李嗣源本为沙陀部属，以骁勇善战为晋王李克用养子。同光四年，我奉命讨伐贝州赵在礼之乱，二月既已奉命兴师，三月军士哗变，与魏博乱兵合势，遂反戈向京师。庄宗东幸汴州，我先入洛阳，庄宗至万胜不得进而还，军士离散，遇弑而亡。诸将拥我即皇帝位，改元天成，是为后唐明宗。在位期间，我诛安重诲滥权，抑宦官，征文教，与民休息，史称小康。长兴四年，次子李从荣以兵入宫谋袭位，事败惊惧成疾而崩。然而我身后诸子相残，养子从珂与婿敬瑭再启乱阶，天下复归于争战。
  source_urls:
  - https://zh.wikipedia.org/wiki/李嗣源
