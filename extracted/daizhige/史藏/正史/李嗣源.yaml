    title_zh: 徙石敬瑭于成德以图制衡
    rationale: 河东劲兵久握必为国家腹心之患，遂以明诏移镇，然未几徙回，反成其势。
  - date: 0933
    title_zh: 抑末帝从珂、厚遇敬瑭，兼置宿卫于诸子
    rationale: 养子功高而诸子幼弱，故欲以姻娅，然终不能收其 potentiatile，遗祸于身后。
