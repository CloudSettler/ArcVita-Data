    title_zh: 亲谏袭取郓州之策
    rationale: 梁军东备郓州，缺口可乘，遂以奇兵夜渡黄河夺其城门。
  - date: 0926-03-01
    title_zh: 受命讨贝州而纳从众之变
    rationale: 城中官兵与城外乱兵合势拥我为帝，势不容拒，遂顺众意取向京师。
  - date: 0926-04-01
    title_zh: 诛宦官、行简易之政
    rationale: 前朝弊政在于宦官干政、赋敛过重，故即位后并省冗职，与民休息。
