person:
  qid: guji-李存孝
  name_zh: 李存孝
  names:
    zh: 李存孝
  archetype: 骁将
  dilemmas:
  - 助李罕之攻怀、孟，因晋将安休休叛奔蔡州，被迫退兵，功败垂成
  lesson: 一军之胜负常系于全线诸将之进退，孤勇难支大局。
  summary_first_person: 我是李克用麾下骁将。文德元年，晋王遣我率师三万，助李罕之攻打怀州、孟州。城中食尽，张言遣子为质并向朱温求救，朱温派葛从周、牛存节赴援，与我军战于流河店。恰逢晋将安休休率一军叛奔蔡州，我于是引军而退，李罕之退保泽州。
  source_urls:
  - https://zh.wikisource.org/wiki/舊五代史/卷14
