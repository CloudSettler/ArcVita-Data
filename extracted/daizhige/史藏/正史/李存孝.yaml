  title_zh: 率师三万攻怀孟
  detail: 三月，李克用遣李存孝率师三万攻怀州、孟州，助李罕之。城中食尽，张言遣子入质求救于朱温。
- id: guji-李存孝-event-retreat
  date: 0889
  year_of: 889
  title_zh: 因安休休叛而退军
  detail: 汴将葛从周、牛存节赴援，与我军逆战于流河店；会晋将安休休以一军奔蔡，存孝引军而退，李罕之退保泽州。
