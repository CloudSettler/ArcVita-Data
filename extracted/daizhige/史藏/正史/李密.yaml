  era: 隋末唐初
  reign_ref: 隋末瓦岗之乱（大业十二年至义宁年间）
  archetype: 乱世起兵的豪杰
  dilemmas:
  - 以叛军之身欲成帝王之业，坚守洛口还是扩张中原两难
  - 盟友翟让旧部与自立权威之间的内部整合困境
  lesson: 乘势而起的豪杰若不能稳固内部人心与根本，声势虽盛终难持久。
  summary_first_person: 大业十三年，我与翟让攻陷兴洛仓，开仓赈济群盗，众至数十万，遂自号魏公改元。又下回洛仓、黎阳仓，河南诸郡相继归附，王世充亦为我所败。然声势虽隆，根基未固，终为乱世棋局中匆匆一霸。
  source_urls:
  - https://zh.wikisource.org/wiki/隋書
