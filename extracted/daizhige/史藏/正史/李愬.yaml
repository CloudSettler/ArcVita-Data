  dilemmas:
  - 雪夜奇袭蔡州：孤军深入险地，成败悬于一线，守成则无功，冒险则或全军覆没
  - 与诸将帅并受节 制，须谦下纳降、得降卒之心方能制胜
  lesson: 善用降将与情报、以雪夜之"险"出敌不意，是奇谋制胜的典范；功成而克敌后谦退不伐。
  summary_first_person: 我李愬以唐邓随节度使讨淮西吴元济，先礼降将李祐，练兵蓄锐，元和十二年十月雪夜自张柴村疾趋蔡州，一举擒元济，淮西遂平。
  source_urls:
  - https://zh.wikisource.org/wiki/新唐書/卷007
