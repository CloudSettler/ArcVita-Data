person:
  qid: guji-李渊
  name_zh: 李渊
  names:
    zh: 李渊
    en: Li Yuan
  lifespan:
    birth:
      date: '566'
      precision: year
      is_circa: true
      raw: 北周天和元年（约566年）
    death:
      date: 635-06-25
      precision: day
      is_circa: false
      raw: 贞观九年（635年）
  birth_date: '566'
  death_date: 635-06-25
  era: 隋末唐初
  reign_ref: 唐高祖，武德元年（618年）至武德九年（626年）在位
  archetype: 开国之君
  dilemmas:
  - 隋室旧臣与起兵反隋之间的忠义抉择
  - 建都长安后群雄割据、四方未定的统一困局
  - 立储之争中太子李建成与秦王李世民的平衡难题
  lesson: 顺势而起、据关中以制天下的初创之力，亦难逃家事与国事交缠的困局
  summary_first_person: 我李渊出身关陇贵胄，仕隋而镇太原。天下大乱之际，我起兵晋阳，誓师于号令堂，定鼎长安，受禅称帝，开创大唐，年号武德。在位九年间翦平群雄，后传位太宗，称太上皇以终老。
  source_urls:
  - https://zh.wikisource.org/wiki/舊唐書/卷1
  - https://zh.wikisource.org/wiki/新唐書/卷1
