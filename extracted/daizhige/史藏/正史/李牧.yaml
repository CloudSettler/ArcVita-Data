  title_zh: 李牧生
  description_zh: 李牧生于战国末年，事迹见《史记》赵世家所载代雁门备边之战功。
  persons:
  - guji-li-mu
- id: guji-li-mu-event-xiongnu
  date: 约前244
  year_of: 约前244
  year_of_parseable: -244
  type: endeavor
  endeavor_id: guji-li-mu-endeavor-1
  title_zh: 大破匈奴
  description_zh: 李牧驻代雁门，习射猎、谨烽火、厚养战士，示弱以骄匈奴，乃选车千三百乘、骑万三千、百金士五万、彀者十万，张左右翼大破匈奴，杀十余万骑，灭襜褴、破东胡、降林胡，其后十余年匈奴不敢近赵边城。
  persons:
  - guji-li-mu
- id: guji-li-mu-event-yidu
  date: 约前234
  year_of: 约前234
  year_of_parseable: -234
  type: endeavor
  endeavor_id: guji-li-mu-endeavor-1
  title_zh: 肥之战却秦封武安君
  description_zh: 秦桓齮攻赵杀扈辄、斩首十万，李牧受命为将大破秦军于宜安、肥下，却敌有功，封武安君。《秦始皇本纪》载十四年秦攻赵取宜安，即与此役相涉。
  persons:
  - guji-li-mu
- id: guji-li-mu-event-envoy
  date: 约前236
  year_of: 约前236
  year_of_parseable: -236
  type: endeavor
  endeavor_id: guji-li-mu-endeavor-1
  title_zh: 以赵相使秦约盟
  description_zh: 《秦始皇本纪》载赵王使其相李牧来约盟于秦，故秦归其质子；已而赵背盟反我太原，秦遂兴兵伐赵。
  persons:
  - guji-li-mu
- id: guji-li-mu-event-fangzhan
  date: -229
  year_of: -229
  year_of_parseable: -229
  type: endeavor
  endeavor_id: guji-li-mu-endeavor-1
  title_zh: 坚壁拒秦、拒王命
  description_zh: 秦王翦率大军下井陉伐赵，李牧与司马尚御之，屡却秦兵。秦以重金反间于赵，使足够的谗人郭开构李牧欲反，赵王迁使赵葱、颜聚代将，李牧不受命以拒秦之故不从。
  persons:
  - guji-li-mu
- id: guji-li-mu-event-death
  date: -229
  year_of: -229
  year_of_parseable: -229
  type: death
  title_zh: 李牧冤死
  description_zh: 李牧遭谗被诬谋反而被杀（一说被赐死，一说被捕诛），次年王翦大破赵军，虏赵王迁，赵亡。
  persons:
  - guji-li-mu
