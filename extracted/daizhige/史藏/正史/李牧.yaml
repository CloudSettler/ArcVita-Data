  archetype: 名将
  dilemmas:
  - 将在外而朝中谗毁交加，忠战之权与君命之间难以两全
  - 强邻压境而国君昏聩，守土之名将与衰亡之国势相抗
  lesson: 良将之功不敌谗言之口，国之存亡常系于用人之明
  summary_first_person: 我乃赵国名将李牧，常年代北备胡，一战大破匈奴，其后屡却秦兵，封武安君。然王迁八年，秦使反间于赵，谗人郭开构我于王前，我竟冤死，赵亦随之而亡。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷006
