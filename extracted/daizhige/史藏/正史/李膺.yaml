  archetype: 清流党人领袖
  dilemmas:
  - 直言抨击宦官权贵与保全自身及家族之间的抉择
  - 党锢之祸中以气节自守而不肯逃亡避祸
  lesson: 在黑暗政治中坚守名节，虽死而不改其志
  summary_first_person: 我李膺以风节自持，名重一时，士人被他接待称为登龙门。我在桓帝时任司隶校尉，严惩贪残宦官，后遭党锢之祸，虽遇赦仍遭禁锢；建宁二年第二次党锢大狱中，我不肯避祸，最终死于狱中。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷67
