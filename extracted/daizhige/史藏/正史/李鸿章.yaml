  name_zh: 李鸿章
  names:
    zh: 李鸿章
    en: Li Hongzhang
  lifespan:
    birth:
      date: 1823-02-15
      precision: day
      is_circa: false
      raw: 道光三年正月初五
    death:
      date: 1901-11-07
      precision: day
      is_circa: false
      raw: 光绪二十七年九月二十七日
  birth_date: 1823-02-15
  death_date: 1901-11-07
  era: 晚清
  reign_ref: 咸丰·同治·光绪
  archetype: 中兴名臣·洋务自强与弱国外交之重臣
  dilemmas:
  - 战守与议和——列强环伺之下，何者为朝廷存续之计
  - 忠君之节与师夷长技之新学如何两全
  - 代朝廷签约任谤，抑或洁身避责
  lesson: 弱国图存，胜负不在谈判之舌，而在自强之实；当以一身任谤，以百事图新。
  summary_first_person: 我李鸿章，道光三年生于合肥，以进士入翰林。咸丰九年二月，诏我以编修交伊兴阿差委，自此舍清班而赴戎行。其后募淮军、援上海、抚江苏，官至直隶总督兼北洋大臣，办洋务自强三十年；甲午败后马关定约，庚子之后再签辛丑，光绪二十七年卒于京师，谤满天下，而自强之志未尝一日息。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷20
endeavors:
- id: guji-lihongzhang-endeavor-1
  title_zh: 词臣从戎——由翰林编修而赴军前
  start_date: 1847
  end_date: 1861
  summary: 道光二十七年成进士、入翰林；咸丰九年二月乙丑，诏编修李鸿章交伊兴阿差委，遂离京职改隶军前，入剿捻戎幕。
  phases:
  - key: brewing
    name_zh: 翰苑储才
    labels:
      zh: 进士·翰林院编修
    start_date: 1847
    highlight_event_id: guji-lihongzhang-event-1847-jinshi
  - key: breakthrough
    name_zh: 奉诏军前
    labels:
      zh: 交伊兴阿差委
    start_date: 1859-03
    highlight_event_id: guji-lihongzhang-event-1859-yixinga
  decisions:
  - date: 1859-03
    title_zh: 应诏交伊兴阿差委
    rationale: 本纪云诏编修李鸿章交伊兴阿差委，时伊兴阿副傅振邦督剿三省捻匪；此诏使词臣改隶军前，为弃文从武之枢机。
- id: guji-lihongzhang-endeavor-2
  title_zh: 练淮援沪·封疆洋务与末路议约
  start_date: 1861
  end_date: 1901
  summary: 奉曾国藩命编练淮军，同治元年乘英轮援上海、署江苏巡抚，渐为东南柱石；同治九年任直隶总督兼北洋大臣，主持洋务自强数十年；甲午、庚子两度主和议，马关、辛丑之约皆出其手，光绪二十七年卒。
  phases:
  - key: brewing
    name_zh: 奉命募淮
    labels:
      zh: 淮军成军
    start_date: 1861
    highlight_event_id: guji-lihongzhang-event-1862-shanghai
  - key: breakthrough
    name_zh: 援沪抚苏
    labels:
      zh: 江苏巡抚
    start_date: 1862-04
    highlight_event_id: guji-lihongzhang-event-1862-jiangsu
  - key: climax
    name_zh: 总督直隶·北洋自强
    labels:
      zh: 直隶总督·北洋大臣
    start_date: 1870-08
    highlight_event_id: guji-lihongzhang-event-1870-zhili
  - key: closure
    name_zh: 马关·辛丑议约
    labels:
      zh: 弱国外交
    start_date: 1895-04-17
    highlight_event_id: guji-lihongzhang-event-1895-maguan
  decisions:
  - date: 1862-04
    title_zh: 率淮军乘英轮援上海
    rationale: 受曾国藩所命别募淮勇，借轮船溯江赴沪；由此别立淮系，进可规复苏南，退可自成一军。
  - date: 1870-08
    title_zh: 受任直隶总督兼北洋大臣
    rationale: 天津教案后接替曾国藩督直，遂主持北洋，练兵、置舰、筑路、兴学，洋务自强诸政皆自此发端。
  - date: 1895-04-17
    title_zh: 马关议和签约
    rationale: 甲午败局已定，奉旨赴马关议和；弱国无外交，忍辱定约，以一身任天下之谤而纾朝廷之急。
  - date: 1901-09-07
    title_zh: 订辛丑条约
    rationale: 庚子京师沦陷，奉诏抱病与列强议约；约成月余即卒，为毕生仕途之终点。
