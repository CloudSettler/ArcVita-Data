  - 仕途蹭蹬与以诗载道的取舍
  lesson: 穷年忧黎元，以诗证史，虽困顿而不忘家国。
  summary_first_person: 我生于盛唐而 Fällen于乱世，一生流离，却以诗记录苍生疾苦，后世称我为"诗史"。
