events:
- id: guji-杜甫-event-birth
  date: '712'
  year_of: 712
  type: birth
  title_zh: 杜甫生于河南巩县
  description: 生于官宦诗书之家，祖父杜审言为初唐著名诗人。
- id: guji-杜甫-event-death
  date: '770'
  year_of: 770
  type: death
  title_zh: 卒于湘江舟中
  description: 大历五年冬，贫病而卒，年约五十九。
- id: guji-杜甫-event-1
  date: '0731'
  year_of: 731
  type: endeavor
  title_zh: 壮游齐赵
  description: 出游吴越、齐赵，与李白同游梁宋，作《望岳》。
- id: guji-杜甫-event-2
  date: '0747'
  year_of: 747
  type: endeavor
  title_zh: 应诏就试，困居长安十年
  description: 应"野无遗贤"之试而落第，献《三大礼赋》得玄宗奇之，仍不获显用。
- id: guji-杜甫-event-3
  date: '0756'
  year_of: 756
  type: endeavor
  title_zh: 陷贼纪乱，作"三吏""三别"
  description: 安史之乱中身陷长安，后脱身谒肃宗于凤翔；乱中写下《春望》《三吏》《三别》等诗史诗篇。
- id: guji-杜甫-event-4
  date: '0760'
  year_of: 760
  type: endeavor
  title_zh: 筑成都草堂，漂泊西南
  description: 于成都浣花溪畔筑草堂，严武表为检校工部员外郎，世称"杜工部"。
- id: guji-杜甫-event-5
  date: '0770'
  year_of: 770
  type: endeavor
  title_zh: 《杜甫集》六十卷传世
  description: 《新唐书·艺文志》著录《杜甫集》六十卷，又润州刺史樊晃编《小集》六卷，开杜诗结集传世之端。
