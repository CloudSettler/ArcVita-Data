  name_zh: 杜预
  names:
    zh: 杜预
    en: Du Yu
  lifespan:
    birth:
      date: '222'
      precision: year
      is_circa: true
      raw: 约魏黄初三年（222年）
    death:
      date: 285-01
      precision: month
      is_circa: false
  birth_date: '222'
  death_date: 285-01
  era: 三国至西晋
  reign_ref: 晋武帝司马炎
  archetype: 儒将
  dilemmas:
  - 出身罪臣之后（其父杜恕与司马懿有隙），仕途受阻而终成灭吴统帅
  - 身不能跨马射箭却以谋略are冠三军，文武之间
  lesson: 有『左传癖』之称的经学家，亦能以书生之身摧枯拉朽灭一国
  summary_first_person: 我杜预字元凯，京兆杜陵人。虽不善骑射，却深通韬略与《左传》，参与撰《晋律》，著《春秋左氏经传集解》，终以镇南大将军督众伐吴，一举平定江南。
  source_urls:
  - https://zh.wikisource.org/wiki/九家旧晋书辑本
