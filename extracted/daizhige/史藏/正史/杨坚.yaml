  - 储君之择与诸子争位之乱
  lesson: 法可屈于情则国纲堕，家不齐则天下乱
  summary_first_person: 我杨坚，以父道训子而家法不立，以君道绳臣而疑忌日深。废勇立广，幽秀囚谅，诸子无一善终，开逆乱之源，长觊觎之望。
