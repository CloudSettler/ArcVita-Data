  title_zh: 讨萧衍王茂先，大破之并追奔拔五城
  description: 四年夏四月，萧衍王茂先寇荆州屯河南城，诏平南将军杨大眼讨之。辛酉，大破之，斩其辅国将军王花，首虏二千余；进攻河南城，茂先逃溃，追奔至汉水，拔其五城。
