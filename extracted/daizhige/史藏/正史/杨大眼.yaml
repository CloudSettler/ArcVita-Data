  reign_ref: 北魏宣武帝（景明、正始、永平年间）
  archetype: 骁勇战将
  dilemmas:
  - 在南朝萧衍与北魏对峙的长期拉锯中，反复奔波于淮水、汉水、荆豫前线，劳而无定的将帅之任。
  lesson: 以骁勇善战立功疆场，能于边地群蛮反侧之际屡破强敌，然武人之荣辱常系于大战一役之胜负。
  summary_first_person: 我杨大眼是北魏的猛将，孝文、宣武之世频年在外征战。正始初我以黄河南数州边任讨平东荆州一带反侧的群蛮樊季安等，后领平南将军拒萧衍王茂先之众，大破之于河南城，追奔至汉水，连拔其五城，为魏之南疆屡立战功。
