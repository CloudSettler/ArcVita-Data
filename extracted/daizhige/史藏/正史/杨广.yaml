person:
  qid: guji-杨广
  name_zh: 杨广
  names:
    zh: 杨广
    en: Yang Guang
  lifespan:
    birth:
      date: '569'
      precision: year
      is_circa: true
      raw: 隋文帝杨坚次子，生于北周末年
    death:
      date: '618'
      precision: year
      is_circa: false
  birth_date: '569'
  death_date: '618'
  era: 隋
  reign_ref: 大业（605—618）
  archetype: 雄才大略而役民过度之帝
  dilemmas:
  - 建大河功在千秋与劳民伤财致天下溃叛两难
  - 巡幸江都以避关中乱局与弃宗庙根本两难
  lesson: 大业之成毁，往往系于民力之竭与不竭
  summary_first_person: 我是杨广，隋文帝次子，开皇年间以晋王统军平陈，继立为皇太子，仁寿四年即位，改元大业。我开凿大运河贯通南北，营建东都洛阳，亲征吐谷浑、三征高句丽，开通西域驰道。然徭役无度、民不堪命，各方起事蜂起，我避居江都，大业十四年为部下所弑，隋祚随之倾覆。
  source_urls:
  - https://zh.wikisource.org/wiki/隋書/卷三
  - https://zh.wikisource.org/wiki/隋書/卷四
