  dilemmas:
  - 身居尚书机要，侍奉沉酗淫暴之君，进退两难
  - 累迁仆射、尚书令，位重而君心难测
  lesson: 处昏乱之朝，谨守枢要、勤于政事可获进用，然危局之中安身尤为不易
  summary_first_person: 我杨愔为东魏、北齐之际的文吏能臣，文宣帝天保年间入尚书省，北齐立国累迁至尚书右仆射、尚书左仆射，天保九年再拜尚书令，主持邦国机务。帝赎后期虽有荒暴，而我以谨饬强记临事，为朝廷所倚重；也曾奉废帝高殷之命传旨问学于诸儒。
  source_urls:
  - https://zh.wikisource.org/wiki/北齊書/卷4
