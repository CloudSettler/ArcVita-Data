  dilemmas:
  - 世受国恩而天下已乱，起兵反隋还是效忠朝廷
  - 兵逼东都时，取洛阳为基还是西入关中
  lesson: 乘主上在外举事虽得一时响应，然迟疑不决、坐失战机，终致败亡。
  summary_first_person: 我杨玄感，官至礼部尚书。大业九年，炀帝再征辽东、民力竭尽，我于黎阳起兵反隋，众至数万，进逼东都。后为宇文述所破，败死于阌乡。
