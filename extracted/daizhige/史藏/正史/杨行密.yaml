events:
- id: guji-杨行密-event-yangzhou-takeover
  date: 0887
  year_of: 887
  type: endeavor
  title_zh: 杨行密入据扬州
  detail: 淮南节度使高骈死，杨行密入扬州。
- id: guji-杨行密-event-refuse-li-fan
  date: 0888
  year_of: 888
  type: decision
  title_zh: 李璠至扬州，行密不纳
  detail: 朱温以行密为淮南副使，以行军司马李璠为留后；璠之扬州，行密不纳。
- id: guji-杨行密-event-flee-xuanzhou
  date: 0891
  year_of: 891
  type: endeavor
  title_zh: 孙儒攻扬州，行密走宣州
  detail: 秦宗权弟宗衡为其将孙儒所杀，儒攻杨行密于扬州，淮南大乱，行密走宣州，儒入扬州。
- id: guji-杨行密-event-qingkou-victory
  date: 0897-09
  year_of: 897
  type: endeavor
  title_zh: 清口之役大破朱温军
  detail: 朱温攻淮南，庞师古出清口；杨行密遣硃瑾先击清口，师古败死，葛从周亦败于渒河，王惧而驰归。
- id: guji-杨行密-event-wu-wang
  date: 0902
  year_of: 902
  type: endeavor
  title_zh: 称吴王建杨吴基业
  detail: 行密遂王吴地，为吴世家第一之开基者。
- id: guji-杨行密-event-birth
  date: '852'
  year_of: 852
  type: birth
  title_zh: 杨行密生
- id: guji-杨行密-event-death
  date: 905-12-03
  year_of: 905
  type: death
  title_zh: 杨行密卒
  detail: 天祐二年卒，杨吴基业由其后继承之。
