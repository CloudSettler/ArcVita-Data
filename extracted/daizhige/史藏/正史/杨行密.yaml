person:
  qid: guji-杨行密
  name_zh: 杨行密
  names:
    zh: 杨行密
    en: Yang Xingmi
  lifespan:
    birth:
      date: '852'
      precision: year
      is_circa: true
      raw: 约唐大中六年
    death:
      date: 905-12-03
      precision: day
      is_circa: false
      raw: 唐天祐二年十一月
  birth_date: '852'
  death_date: 905-12-03
  era: 唐末
  reign_ref:
  - 吴王（据淮南，为杨吴政权奠基者）
  archetype: 割据开基之主
  dilemmas:
  - 夹缝求存：在黄巢余部与强藩朱温、孙儒之间周旋，先据扬州又被迫走宣州
  - 拒纳汴命不受制于人：朱温表为淮南副使兼欲遣留后李璠入扬州，行密不纳
  lesson: 乱世起于行伍者，惟有立足根本、善用良将，方能于群雄环伺中自成一国。
  summary_first_person: 我杨行密出身行伍，乘高骈死后淮南之乱入据扬州，虽遭朱温遥制、孙儒来攻而暂避宣州，终以硃瑾等breaking劲敌孙儒，击退朱温清口之师，遂王吴地，为杨吴基业之本。
  source_urls:
  - 新五代史·梁本纪（吴世家相关记载）
