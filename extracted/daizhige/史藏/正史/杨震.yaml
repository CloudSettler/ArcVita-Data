  - 昌邑暮夜受金，虽无人知，是否收受
  - 面对乳母王圣、中官樊丰骄横恣意，是明哲保身还是屡极切谏
  lesson: 昌邑四知之戒——天知、神知、我知、子知，何谓无知
  summary_first_person: 我杨震字伯起，明经博览，人称关西孔子。年五十始仕州郡，累迁至太尉。每迁转皆以清白自守，四知拒金。屡谏安帝_priv幸之臣，不见用，反遭构陷，遣归本郡，行至城西夕阳亭，慷慨饮鸩而卒，年七十余。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷54
