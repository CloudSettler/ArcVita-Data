    title_zh: 昌邑县令王密暮夜怀金十斤以遗，震却之
    rationale: 天知，神知，我知，子知，何谓无知；密愧而出
  - date: '0123'
    title_zh: 赵腾上书言灾异获罪，震上疏救之
    rationale: 讥切得失，欲以讽谏示主，不当诛
  - date: '0124'
    title_zh: 遣归本郡途中，慨然饮鸩于夕阳亭
    rationale: 为国进忠，反蒙冤见害；以死明志，全臣节
events:
- id: guji-杨震-event-birth
  date: '0054'
  year_of: 54
  title_zh: 杨震生于弘农华阴
  summary: 通晓经籍，博览群书，无不穷究，时人号称关西孔子杨伯起。
- id: guji-楂震-event-career-1
  date: '0104'
  year_of: 104
  title_zh: 年五十始仕州郡
  summary: 居湖城讲学二十年，不答州郡礼命数十年，众人谓其晚暮，而震志愈笃。
- id: guji-杨震-event-career-2
  date: '0111'
  year_of: 111
  title_zh: 东莱太守任上四知拒金
  summary: 赴东莱任，道经昌邑，县令王密夜怀金十斤以遗震；震以上述四知语还之，密惭愧而出。
- id: guji-杨震-event-career-3
  date: '0122'
  year_of: 122
  title_zh: 代刘恺为太尉
  summary: 延光二年，代刘恺为太尉；帝舅大鸿胪耿宝荐中常侍李闱兄于震，震不从，惟以诏书付有司而已。
- id: guji-杨震-event-career-4
  date: '0124'
  year_of: 124
  title_zh: 遭构陷罢官，慨然饮鸩于夕阳亭
  summary: 延光三年，因帝怒而遭遣，归途中谓诸子门人曰：死者士之常分，吾蒙恩居位，不能退奸恶，不能安不肖，何面目复见日月？遂饮鸩而卒，时年七十余。
- id: guji-杨震-event-death
  date: '0124'
  year_of: 124
  title_zh: 杨震卒，年七十余
  summary: 弘农太守移民陕县停棺于道路之侧，道路经者皆流涕。后顺帝即位，下诏平反，改葬华阴潼亭，有大鸟高丈余俯于棺前。
