    rationale: 使逃户归业、赋役均平
events:
- id: guji-柴荣-event-birth
  event_name_zh: 出生
  date: 0921
  year_of: 921
  location_zh: 邢州尧山
  summary_zh: 柴荣生于邢州，后依姑父郭威成长，善骑射，略通书史，曾随商贾贩茶江陵以资家用。
- id: guji-柴荣-event-gaoqi
  event_name_zh: 高平之战
  date: 0954-03
  year_of: 954
  location_zh: 泽州高平
  summary_zh: 北汉与契丹联军南犯，柴荣力排众议亲征，冒矢石督战，大破北汉；战后诛樊爱能等临阵将校数十人，整饬军纪，史称五代用兵未有如此之盛。
- id: guji-柴荣-event-junzheng
  event_name_zh: 整军经武
  date: 0954
  year_of: 954
  location_zh: 汴京
  summary_zh: 高平既胜，柴荣命简选天下骁勇，收精兵入禁军，禁军自此为诸军之冠，为赵宋之制所承。
- id: guji-柴荣-event-minfo
  event_name_zh: 显德灭佛铸钱
  date: 0955-05
  year_of: 955
  location_zh: 全国
  summary_zh: 柴荣下诏废天下无敕额寺院，毁铜佛以铸周通钱，存者犹二千六百余寺，世称三武一宗之厄。
- id: guji-柴荣-event-jiangbei
  event_name_zh: 收取江北
  date: 0958-03
  year_of: 958
  location_zh: 淮南江北
  summary_zh: 柴荣两征淮南，尽取南唐江北十四州、六十县，李璟去帝号称江南国主，划江为界。
- id: guji-柴荣-event-beifa
  event_name_zh: 北伐契丹
  date: 0959-05
  year_of: 959
  location_zh: 瓦桥关、益津关
  summary_zh: 柴荣大举北伐，兵不血刃，四十二日连取契丹宁、莫、瀛三州及瓦桥、益津、淤口三关，垂欲进取幽州。
- id: guji-柴荣-event-death
  event_name_zh: 英年早逝
  date: '0959-07-29'
  year_of: 959
  location_zh: 汴京
  summary_zh: 北伐途中柴荣骤疾，以张永德与文臣同掌禁军而还京，六月甲戌崩于万岁殿，年三十九，庙号世宗，幼子继位，国祚旋移。
- id: guji-柴荣-event-xingtong
  event_name_zh: 修定律令
  date: 0958
  year_of: 958
  location_zh: 汴京
  summary_zh: 诏撰《大周刑统》以代繁苛之律，为后世《宋刑统》之蓝本。
