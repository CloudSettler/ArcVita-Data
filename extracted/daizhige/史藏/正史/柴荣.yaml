person:
  qid: guji-柴荣
  name_zh: 柴荣
  names:
    zh: 柴荣、周世宗、柴世宗
    en: Chai Rong
  lifespan:
    birth:
      date: 0921
      precision: year
      is_circa: true
      raw: 生于邢州尧山
    death:
      date: '0959-07-29'
      precision: day
      is_circa: false
      raw: 显德六年六月甲戌崩于汴京
  birth_date: 0921
  death_date: '0959-07-29'
  era: 五代十国（后周）
  reign_ref: 显德（955-959）
  archetype: 雄略之主
  dilemmas:
  - 削藩强干之志与武将擅权之局的冲突
  - 灭佛铸钱慰民与佛道存续之两难
  - 北伐收复燕云之壮志与天不假年之无常
  lesson: 十年拓天下、十年养百姓、十年致太平，惜乎功败垂成、志业夭折
  summary_first_person: 我柴荣本是邢州布衣，从姑父郭威起于行伍，受其鞠养，得立为嗣。即位之后，我亲御戎车，高平一战破北汉与契丹联军，整军诛懦，练出一支禁旅。继而西取秦凤、南收江北、北攻契丹，兵锋所指，望风瓦解。我均定田赋、毁佛铸钱、兴修水利，立志以十年平定天下、养民致太平。惜乎显德六年北伐方捷，我骤染重疾而崩，年三十九，事业尽付托孤之手，终为他人作了嫁衣。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史/卷12
