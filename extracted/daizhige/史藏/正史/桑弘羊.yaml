  dilemmas:
  - 与霍光同辅昭帝而权势相争，终致死局
  - 盐铁会议面临贤良文学对国营专擅之策的非难
  lesson: 富国在其务实，权争殒其身家
  summary_first_person: 我出身洛阳贾人子，十三岁入侍宫中，以心计助武帝理财，推行盐铁官营、均输平准，充盈国用，然盐铁会议后与霍光不谐，终因燕王旦之谋牵连而死。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷二十四下
