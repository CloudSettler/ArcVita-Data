    title_zh: 受任治粟都尉领大农，推行盐铁官营
    rationale: 汉武帝用兵四方，财用不足，试点盐铁官营于山东，见效而推广全国。
  - date: -110
    title_zh: 请置大农部丞数十人分部郡国，均输平准
    rationale: 以均输调节郡国贡输，平准稳定物价，使国用饶给而民不益赋。
