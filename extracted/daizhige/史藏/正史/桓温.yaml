  birth_date: 约312年
  death_date: ''
  era: 东晋
  reign_ref: 康帝建元元年、穆帝永和年间、升平年间
  archetype: 权臣名将
  dilemmas:
  - 北伐功高震主，需在恢复中原与朝廷猜忌之间权衡
  - 建元受命为前锋，能否突破庾氏门户军制的限制
  lesson: 桓温借灭蜀、北伐之功由方镇进位太尉，显示军功是东晋寒门将帅攀升之阶，但权势过盛亦招士族猜忌。
  summary_first_person: 余起家琅邪内史，建元间受诏为前锋小督入临淮，此后都督荆司雍益梁宁诸州、镇荆州。永和二年率师伐蜀，三年正月克成都，李势降，益州平。其后屡兴北伐：永和十年伐关中，败苻苌于蓝田，粮尽而还；十二年讨姚襄，战于伊水，大败之，收复洛阳，遣将镇守。累迁征西大将军、太尉，封南郡公。
  source_urls:
  - https://zh.wikisource.org/wiki/晉書/卷008
