  dilemmas:
  - 受武帝猜疑，被评'虽有干略，而无远志'，功高而难自安
  lesson: 才略可济一时之变，志与德方定长久之局
  summary_first_person: 我檀道济为将多年，从武帝北伐，兵次潼关；武帝临终虽称我有干略而无疑人之志，然其后我仍被卷入废立之局，率兵居前废少帝，复入守朝堂，身负武功而处境维艰。
  source_urls:
