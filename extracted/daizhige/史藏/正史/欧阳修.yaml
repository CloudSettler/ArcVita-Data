  summary_first_person: 我是欧阳修，宋之史官。我撰修《新唐书》与《五代史记》，文章法度自许足亚于史汉，然吴缜作《五代史纂误》、司马光作《通鉴考异》，摘我纪传抵牾、晋王三矢付庄宗等讹漏之事。吾知文章贵乎义法，而考证之疏，亦吾之为戒也。
  source_urls:
  - source: 五代史纂误（四库全书本，宋·吴缜撰）
