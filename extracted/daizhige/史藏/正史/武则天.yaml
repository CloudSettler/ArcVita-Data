      is_circa: false
      raw: 神龙元年十一月壬寅，崩于上阳宫
  birth_date: '0624'
  death_date: '0705-11-16'
  era: 唐·武周
  reign_ref: 天授—神龙（690-705 在位，号圣神皇帝）
  archetype: 后妃-turned-女皇
  dilemmas:
  - 以女主临朝，网罗已立、宗室得罪者众
  - 立子还是立侄，传位于武氏或李氏的两难
  - 酷吏政治与为政求才的矛盾
  lesson: 权移女主而社稷复归李氏，人谋与天命相持之局
  summary_first_person: 我以才人入宫，再为皇后，参决朝政，终至革唐建周，自称圣神皇帝；晚年虽还政于子，却以无字之碑留身后之评。
  source_urls:
  - https://zh.wikisource.org/wiki/新唐书/卷004（则天皇后本纪）
