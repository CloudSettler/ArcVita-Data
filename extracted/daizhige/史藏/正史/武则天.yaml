person:
  qid: guji-武则天
  name_zh: 武则天
  names:
    zh: 武曌、武则天、则天皇后
    en: Wu Zetian
  lifespan:
    birth:
      date: '0624'
      precision: year
      is_circa: true
      raw: 武德七年（据两唐书推算）
    death:
