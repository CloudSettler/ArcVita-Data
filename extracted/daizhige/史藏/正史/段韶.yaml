  lesson: 勋臣以沉毅谨慎佐命，历事而累迁中枢，武力与政略兼备。
  summary_first_person: 我段韶，字孝先，出身高门，累承先世功勋。天保以来，我由并州刺史入为尚书右仆射，封平原王，历司空、司徒等显职，屡领诸军筑城戍边、出师救援，是齐室倚为柱石之将。
