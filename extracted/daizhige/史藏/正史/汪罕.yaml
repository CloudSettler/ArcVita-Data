events:
- id: guji-汪罕-event-succession
  person: guji-汪罕
  title_zh: 父忽儿札胡思杯禄卒后嗣位克烈部长
  detail: 多杀戮昆弟,埋下兄弟叛离之根
  date: ~1170
  year_of: ~1170
  kind: career
  tags:
  - 世袭
  - 杀戮
- id: guji-汪罕-event-uncle-war
  person: guji-汪罕
  title_zh: 叔父菊儿罕来攻,败走仅以百余骑脱
  detail: 逼于哈剌温隘战败,奔于烈祖
  date: ~1175
  year_of: ~1175
  kind: conflict
  tags:
  - 内乱
  - 兵败
- id: guji-汪罕-event-ally
  person: guji-汪罕
  title_zh: 烈祖逐菊儿罕于西夏,复夺部众归我,结盟为按答
  detail: 汪罕德之,与也速该相与盟,称为按答
  date: ~1180
  year_of: ~1180
  kind: alliance
  tags:
  - 按答
  - 结盟
- id: guji-汪罕-event-naiman-loss
  person: guji-汪罕
  title_zh: 弟也力可哈剌叛归乃蛮,乃蛮亦难赤发兵夺我部众
  detail: 西走河西回鹘回回,奔契丹,中道粮绝,捋羊乳刺橐驼血为食
  date: ~1199
  year_of: ~1199
  kind: conflict
  tags:
  - 失国
  - 流亡
- id: guji-汪罕-event-father-figure
  person: guji-汪罕
  title_zh: 成吉思汗尊我为父,会于土兀剌河
  detail: 帝遣近侍招还,亲迎抚劳,安置军中振给之
  date: ~1200
  year_of: ~1200
  kind: alliance
  tags:
  - 父子之盟
  - 复立
- id: guji-汪罕-event-joint-war
  person: guji-汪罕
  title_zh: 与帝会萨里河,大战泰赤乌于斡难河上
  detail: 败走沆忽等,斩获无算
  date: ~1201
  year_of: ~1201
  kind: battle
  tags:
  - 合战
  - 泰赤乌
- id: guji-汪罕-event-four-generals
  person: guji-汪罕
  title_zh: 四将击走乃蛮曲薛吾,尽夺所掠归我
  detail: 帝遣博尔术、木华黎、博罗浑、赤老温帅师雪耻
  date: ~1202
  year_of: ~1202
  kind: battle
  tags:
  - 乃蛮
  - 雪耻
- id: guji-汪罕-event-betrayal
  person: guji-汪罕
  title_zh: 谋以许亲酒害帝,事泄遂举兵来侵
  detail: 帝驰军阿兰塞,先败朱力斤、董哀诸部,亦剌合中颊敛兵而退
  date: 1203
  year_of: 1203
  kind: betrayal
  tags:
  - 布浑察儿
  - 背盟
- id: guji-汪罕-event-khalqin-defeat
  person: guji-汪罕
  title_zh: 哈阑真沙陀之战初胜后,军心离散
  detail: 按弹、火察儿、札木合等谋弑汪罕不克,奔乃蛮
  date: 1203
  year_of: 1203
  kind: battle
  tags:
  - 哈阑真沙陀
  - 内叛
- id: guji-汪罕-event-final-defeat
  person: guji-汪罕
  title_zh: 夜袭折折运都山,克烈部众尽降
  detail: 帝伪为哈撒儿之言诱我遣使来盟,衔枚夜趋,出其不意袭破之
  date: 1203
  year_of: 1203
  kind: battle
  tags:
  - 克烈灭亡
  - 夜袭
- id: guji-汪罕-event-death
  person: guji-汪罕
  title_zh: 挺身遁走,路逢乃蛮部将,为其所杀
  detail: 叹曰'我为吾儿所误,今日之祸,悔将何及'
  date: 1203
  year_of: 1203
  kind: death
  tags:
  - 兵败身死
  - 乃蛮
