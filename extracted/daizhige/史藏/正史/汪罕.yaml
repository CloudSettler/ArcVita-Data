person:
  qid: guji-汪罕
  name_zh: 汪罕
  names:
    zh: 汪罕
    en: Ong Khan (Toghrul)
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: ~1203
      precision: year
      is_circa: false
      raw: 癸亥之后,'汪罕出走,路逢乃蛮部将,遂为其所杀'
  death_date: ~1203
  era: 南宋·金时期草原诸部
  reign_ref: 克烈部部长·受金封爵为王
  archetype: 恩仇无常的草原霸主
  dilemmas:
  - 受恩于也速该却终与其子成吉思汗反目
  - 疏亲多杀,昆弟叛离,部众离散
  - 听信札木合、亦剌合谗言,毁弃盟约
  lesson: 恩义不终,虽强必蹶
  summary_first_person: 我名脱里,受金封王,番音讹为汪罕。我数遭倾覆,赖烈祖与其子铁木真屡复我国,尊我为父,与我盟为按答。然我性忌,听兄弟谗言,背盟设宴欲害之,兵败哈阑真,客死乃蛮之手,克烈部遂亡。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷001
