  era: 西汉
  reign_ref: 汉武帝（元狩年间为准）
  archetype: 直谏诤臣
  dilemmas:
  - 直言犯上与保全禄位之间的抉择
  - 老成守拙与权臣（公孙弘、张汤）更化之政的冲突
  lesson: 直道事君，虽被疏远而不改其守，诤臣之节可传后世。
  summary_first_person: 我汲黯以正直闻名，位列九卿，面折廷争，武帝敬而惮之。我崇黄老之术，恶公孙弘、张汤之巧诈，屡加面斥，虽终被出为东海太守、淮阳太守，然治民有惠，其名不衰。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷050
