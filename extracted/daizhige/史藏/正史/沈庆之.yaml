  era: 南朝宋
  reign_ref: 宋文帝元嘉、孝武帝孝建
  archetype: 名将
  dilemmas:
  - 边镇武将与中央权争之间的.position 取舍
  lesson: 以军功起家，审时度势，归顺勤王则功勋卓著。
  summary_first_person: 我沈庆之，以太子步兵校尉率军讨伐缘江诸蛮，后逢元凶弑逆，佐孝武帝即位，官至领军将军、镇北大将军，孝建年间大破叛将鲁爽，终位开府仪同三司。
  source_urls:
  - https://zh.wikisource.org/wiki/宋書/卷6
