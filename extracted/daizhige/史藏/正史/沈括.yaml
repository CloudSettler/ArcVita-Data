events:
- id: guji-沈括-event-birth
  date: '1031'
  year_of: 1031
  type: birth
  title_zh: 沈括出生
  summary_zh: 约1031年出生于钱塘，属杭州。
- id: guji-沈括-event-chengjinshi
  date: '1063'
  year_of: 1063
  type: career
  title_zh: 登进士第
  summary_zh: 沈括中进士，开始步入仕途，初任扬州司理参军，后入馆阁。
- id: guji-沈括-event-tianjian
  date: '1072'
  year_of: 1072
  type: career
  title_zh: 提举司天监
  summary_zh: 沈括提举司天监，主持改历，起用卫朴修奉元历，并改制浑仪、浮漏、景表等仪象。
- id: guji-沈括-event-chnliao
  date: '1075'
  year_of: 1075
  type: career
  title_zh: 出使辽国
  summary_zh: 熙宁八年沈括使辽，就河东地界与辽人争辩，据六国旧册力争，使辽所欲地终不得。
- id: guji-沈括-event-siceng
  date: '1081'
  year_of: 1081
  type: career
  title_zh: 经略鄜延边事
  summary_zh: 沈括知延州兼鄜延路经略安抚使，参与对西夏战守，因永乐城之役被劾，责授均州团练副使。
- id: guji-沈括-event-mengxi
  date: '1088'
  year_of: 1088
  type: achievement
  title_zh: 居梦溪著笔谈
  summary_zh: 沈括谪居润州梦溪园，退居著述，作《梦溪笔谈》，博载天文历算、地理医药、典章技艺之学。
- id: guji-沈括-event-death
  date: '1095'
  year_of: 1095
  type: death
  title_zh: 沈括卒
  summary_zh: 绍圣二年，沈括卒于润州，年约六十五。
