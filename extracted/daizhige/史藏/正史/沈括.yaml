  lesson: 以实证与博览的精神记天下之学，虽仕途蹉跎而学问自成一格
  summary_first_person: 我是沈括，字存中，北宋钱塘人。我历仕仁宗、英宗、神宗诸朝，参与王安石变法，曾提举司天监、出使辽国、经略鄜延。晚年谪居润州，筑梦溪园，著《梦溪笔谈》，记天文、历法、地理、医药、技艺之学，以博览实证自许。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷302
  - https://zh.wikipedia.org/wiki/沈括
