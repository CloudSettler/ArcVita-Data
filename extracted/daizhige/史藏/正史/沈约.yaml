  era: 南朝宋、齐、梁
  reign_ref: 梁武帝天监年间
  archetype: 文学家与史学家
  dilemmas:
  - 身历三朝，历仕宋齐梁，如何在易代之际自处并参与劝进
  - 作为「竟陵八友」之一，文友萧衍最终称帝，友情与君臣之别的转变
  lesson: 以文才与史学立身，历仕三朝而不坠，然晚年因言语谨慎、惧患而卒，可见易代文人维系名位之难。
  summary_first_person: 我是沈约，字休文，吴兴武康人。我历仕宋、齐、梁三朝，博通典籍，撰《宋书》《四声谱》，倡导四声八病之说，是永明体诗歌的重要推动者。当年我曾与萧衍同游竟陵王西邸，列为「竟陵八友」之一。
  source_urls:
  - https://zh.wikisource.org/wiki/梁書/卷1
