  summary_zh: 沈约生于吴兴武康，约当刘宋元嘉年间。
- id: guji-沈约-event-xidi
  title_zh: 游于竟陵王西邸，列竟陵八友
  date: '487'
  year_of: 487
  kind: endeavor
  endeavor_ref: guji-沈约-endeavor-1
  source_text: 竟陵王子良开西邸，招文学，高祖与沈约、谢朓、王融、萧琛、范云、任昉、陆倕等并游焉，号曰八友。
  summary_zh: 竟陵王萧子良开西邸招文学之士，沈约与萧衍、谢朓、王融、萧琛、范云、任昉、陆倕并游其间，号称「竟陵八友」。
- id: guji-沈约-event-sisheng
  title_zh: 立「四声八病」之说
  date: '485'
  year_of: 485
  kind: endeavor
  endeavor_ref: guji-沈约-endeavor-2
  summary_zh: 沈约研求声律，提出四声八病之说，与谢朓等共创永明体诗歌。
- id: guji-沈约-event-quanjin
  title_zh: 沈约劝萧衍受禅代齐
  date: 502-04
  year_of: 502
  kind: endeavor
  endeavor_ref: guji-沈约-endeavor-1
  summary_zh: 梁将受禅之际，沈约为萧衍陈说符命劝进，萧衍即帝位建立梁朝，沈约以佐命之功显贵。
- id: guji-沈约-event-songsong
  title_zh: 撰成《宋书》
  date: '502'
  year_of: 502
  kind: endeavor
  endeavor_ref: guji-沈约-endeavor-1
  summary_zh: 沈约入梁后奉敕撰《宋书》，记载刘宋一朝史事，为二十四史之一。
- id: guji-沈约-event-death
  title_zh: 沈约去世
  date: '513'
  year_of: 513
  kind: death
  summary_zh: 沈约卒于梁天监十二年，时为尚书左仆射、领太子少傅，谥曰隐侯。
