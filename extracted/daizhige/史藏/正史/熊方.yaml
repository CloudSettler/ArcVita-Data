person:
  qid: guji-熊方
  name_zh: 熊方
  names:
    zh: 熊方
    en: Xiong Fang
  lifespan:
    birth:
      date: 1101-01-01
      precision: decade
      is_circa: true
      raw: 南宋初人
  birth_date: 约1101年前后（南宋初人）
  death_date: 不详
  era: 南宋初
  reign_ref: 宋高宗
  archetype: scholar-historian
  dilemmas:
  - 范蔚宗《后汉书》有纪传而无表志，东京典故散缀纪传之内、不能丝连绳贯
  - 集补年表投进后未蒙指挥，欲请朝廷令诸儒仿班史撰著两汉人表而惧众志纷纭难得归一
  lesson: 信史有阙则补之，述而不作，一据范刘旧文，纲目条章稍仿前书，阙疑则俟后之君子。
  summary_first_person: 我是熊方，字广居，丰城人，由上舍生官至右迪功郎、权澧州司户参军。痛惜范蔚宗作《后汉书》仅成纪传而表志未立，我辑成《补后汉书年表》十卷，含同姓侯王表二卷、异姓诸侯表六卷、百官表二卷，以足范刘之未备，自题其堂曰补史。
  source_urls:
  - 钦定四库全书·史部·正史类·补后汉书年表
