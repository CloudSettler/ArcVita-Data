  decisions:
  - date: 约1130
    title_zh: 决意辑补后汉年表
    rationale: 范蔚宗《后汉书》仅毕纪传而表志未立，刘昭补注诸志又不及表，惧伪闰不分、正朔无统，故集补后汉年表十卷以足范刘之未备。
  - date: 约1131
    title_zh: 义例一据范刘旧文
    rationale: 凡表之义例一据范刘旧文，不敢取他说以汨其传；纲目条章稍仿前书，有阙疑则俟后之君子。
  - date: 约1131
    title_zh: 自题其堂曰补史
    rationale: 深自矜重，以志补史之业。
