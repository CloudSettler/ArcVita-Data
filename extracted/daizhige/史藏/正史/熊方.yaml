- id: guji-熊方-event-work-start
  person_id: guji-熊方
  title_zh: 着手辑补后汉年表
  date: 约1130
  year_of: 1130
  category: work
  description: 惜东京之再造、痛信史之未成，熊方着手汇集补后汉年表。
- id: guji-熊方-event-book-complete
  person_id: guji-熊方
  title_zh: 辑成补后汉书年表十卷
  date: 约1131
  year_of: 1131
  category: work
  description: 是书凡同姓侯王表二卷、异姓诸侯表六卷、百官表二卷，其所证据一本范氏旧文，义例仿前书而稍为通变，百官表取刘昭之志，自太傅至河南尹凡二十有三等以系于年，除拜薨免之实悉见，贯穿钩考极为精详。
- id: guji-熊方-event-submit
  person_id: guji-熊方
  title_zh: 随表投进补后汉年表十卷
  date: 约1132
  year_of: 1132
  category: work
  description: 熊方进补后汉书年表序并进表投进朝廷；进表中有皇帝陛下奋神武以拨乱、仰稽圣功同符光武之语，又有御书太学石经之语，可知为高宗时人、南渡之初。
- id: guji-熊方-event-retry
  person_id: guji-熊方
  title_zh: 再诣天庭陈进，请求撰两汉人表
  date: 约1133
  year_of: 1133
  category: work
  description: 昨投年表未蒙指挥，熊方不避斧钺再诣天庭陈进，伏望降付有司，令诸儒仿班史撰著两汉人表以补范史不足，并前所上年表庶传不朽。
