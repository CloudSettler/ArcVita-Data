  - 武将出身遭文臣猜忌，功高而位危
  - 面有黥文仍不改本色，戴面沚以镇三军
  lesson: 以勇略起于行伍而不忘本，然功高遭忌，盛极而衰
  summary_first_person: 我狄青自行伍起家，以骁勇善战闻名，夜袭昆仑、破侬智高，位至枢密使。然出身微贱而居高位，终为朝议所忌，出知陈州，忧惧而终。
