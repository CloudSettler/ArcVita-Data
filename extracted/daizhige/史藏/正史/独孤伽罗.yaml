  name_zh: 独孤伽罗
  names:
    zh: 独孤伽罗
    en: Empress Dugu Qieluo
  lifespan:
    birth:
      date: '544'
      precision: year
      is_circa: true
      raw: 约544年（西魏大统十年前后）
    death:
      date: '602'
      precision: year
      is_circa: false
  birth_date: '544'
  death_date: '602'
  era: 西魏—北周—隋
  reign_ref: 隋文帝开皇年间、仁寿初
  archetype: 帝后共治的贤妻谋主
  dilemmas:
  - 辅佐夫君代周建隋，事成则涉夺宇文氏天下之嫌
  - 主张一夫一妇、严管后宫与皇子，引发政争流言
  lesson: 内助之功可以开基立业，然宫闱之权亦会牵动储位之危
  summary_first_person: 我独孤伽罗，十四岁北周时嫁与杨坚，誓无异生之子。周隋之际我与夫君共定大计，开皇元年二月他被立为帝，我受册为皇后，宫中称与陛下为“二圣”。我躬行节俭、佐定朝政二十余年，仁寿二年先于帝崩逝。
  source_urls:
  - https://zh.wikisource.org/wiki/隋書/卷一
