events:
- id: guji-独孤信-event-birth
  type: birth
  date: 503
  year_of: 503
  description_zh: 独孤信生（约），武川镇人，后为西魏名将。
- id: guji-独孤信-event-1
  type: endeavor
  date: 537-08
  year_of: 537
  description_zh: 大统三年八月，独孤信与李弼、赵贵等十二将随宇文泰东伐，至潼关誓师。
- id: guji-独孤信-event-2
  type: endeavor
  date: 538
  year_of: 538
  description_zh: 与开府元季海率步骑二万向洛阳；至新安，高敖曹走度河，独孤信遂入洛阳。
- id: guji-独孤信-event-3
  type: endeavor
  date: 538-08
  year_of: 538
  description_zh: 东魏侯景等围独孤信于洛阳，宇文泰率军来救；河桥之战中独孤信、李远居右军，战不利，弃其卒先归，大军由是班师。
- id: guji-独孤信-event-4
  type: endeavor
  date: 548
  year_of: 548
  description_zh: 大统十二年，凉州刺史宇文仲和据州反，太祖遣开府独孤信讨之。
- id: guji-独孤信-event-5
  type: endeavor
  date: 548-05
  year_of: 548
  description_zh: 夏五月，独孤信平凉州，擒宇文仲和，迁其民六千余家于长安。
- id: guji-独孤信-event-death
  type: death
  date: 557
  year_of: 557
  description_zh: 557年，独孤信卒（文本未载，据史补）。
