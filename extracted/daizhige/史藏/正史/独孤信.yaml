      raw: 西魏恭帝三年后、北周初
  birth_date: 约503年
  death_date: 557年
  era: 北魏末—西魏
  reign_ref: 西魏文帝大统年间
  archetype: 开国武将·府兵柱国
  dilemmas:
  - 邙山之战战不利且不知主帅所在，弃卒先归，陷入忠与自保的两难
  - 身为西魏重臣，须在东西魏对峙中择主效忠并护佑关陇集团
  lesson: 功名之盛难掩乱世抉择之艰，将帅当以奉命征讨、克定四方为本，而成败荣辱常系于一战。
  summary_first_person: 我名独孤信，西魏之柱国名将。大统年间，我随丞相宇文泰东征，率步骑二万进取洛阳，入据其城；又与李弼各率骑五千出武关退侯景，奉命讨平凉州宇文仲与之乱。河桥邙山之战，我居右军，战不利而先还，是生平之憾。后为大宗伯，位登大司马，子孙显赫于关陇。
  source_urls:
  - https://zh.wikisource.org/wiki/周書/卷2
