      is_circa: false
      raw: 宣光五年五月卒于哈剌那
  birth_date: ''
  death_date: 宣光五年（1376年）五月
  era: 元末北元
  reign_ref: 元惠宗至正年间、北元宣光年间
  archetype: 忠勇孤臣
  dilemmas:
  - 受命征讨却先攻关中诸将，遭朝廷猜疑
  - 皇后奇氏欲胁帝禅位，知其意而拒绝拥兵入城
  - 中原大势已去，忠元抗明终至全军覆没
  lesson: 明太祖谓"吾所不能臣，真天下奇男子"，孤忠守节虽败犹荣。
  summary_first_person: 我本王氏，为察罕帖木儿养子，屡拒明人招降，崎岖塞上，卒全忠孝，虽沈儿峪大败、太原夜溃，犹于岭北大破徐达，明人称我为天下奇男子。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷221 (正文实为卷二百二十) 列传
