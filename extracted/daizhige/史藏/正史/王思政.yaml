- id: guji-王思政-endeavor-1
  name_zh: 移镇颍川
  start_date: 0547-04
  end_date: 0547-07
  description: 西魏大统十三年三月，太祖遣开府李弼援侯景于颍川，东魏将韩轨等遁去；侯景徙镇豫州后，太祖遣开府王思政据颍川，李弼引军而还。
