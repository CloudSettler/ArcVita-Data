  reign_ref: 西魏文帝（元宝炬）大统年间
  archetype: 镇边守城之将
  dilemmas:
  - 侯景举河南六州来附，奉命据守颍川，地处四战之冲，孤悬东魏与南梁之间
  - 东魏十余万大军围城引水灌城，救援阻绝，守与降两难
  lesson: 忠于所托，虽孤城绝援犹力拒强敌；然势之不敌，非忠勇所能独支。
  summary_first_person: 我本西魏开府之将，值侯景以河南来附，太祖命我移镇颍川。东魏遣高岳、慕容绍宗、刘丰生等率十余万众围城，起堰引洧水灌城。太祖遣赵贵来援，而颍川以北尽为陂泽，救兵不得至。大统十五年夏六月，颍川陷。
  source_urls:
  - https://zh.wikisource.org/wiki/周書/卷3
