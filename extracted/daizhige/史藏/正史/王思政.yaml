    rationale: 侯景请举河南六州来附且徙镇豫州，需以重将控扼颍川要地。
- id: guji-王思政-endeavor-2
  name_zh: 颍川守城之战
  start_date: 0548
  end_date: 0549-06
  description: 大统十四年，东魏遣高岳、慕容绍宗、刘丰生等率众十余万围王思政于颍川。十五年太祖遣赵贵督东南诸州兵来援；高岳起堰引洧水灌城，颍川以北皆为陂泽，救兵不得至。夏六月，颍川陷。
