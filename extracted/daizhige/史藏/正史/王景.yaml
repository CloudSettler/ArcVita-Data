  birth_date: ''
  death_date: ''
  era: 东汉（明帝、章帝时期）
  reign_ref: 汉明帝、汉章帝
  archetype:
  - 治水能臣
  - 技术型循吏
  dilemmas:
  - 治河工程浩大费以百亿，需在简省役费与根治水患之间权衡
  - 迁都洛阳已定而人心思长安，作金人论以安人情
  lesson: 治水安民，因地制宜，术数之学亦可济世
  summary_first_person: 我是王景，字仲通，先祖自琅邪浮海而居乐浪。我少学《易》，广窥众书，好天文术数。永平年间奉诏与王吴修浚仪渠，又主持治汴渠筑堤千里，凿山破砥，十里立一水门，渠成而河患遂息。后历侍御史、河堤谒者、徐州刺史、庐江太守，在庐江教民牛耕、修起芍陂、训令蚕织，境内丰给。我又集众家数术为大衍玄基，卒于官。
endeavors:
- id: guji-王景-endeavor-1
  key: 治水济世
  name_zh: 治理浚仪渠与汴渠河堤
  summary_first_person: 我先后修浚仪渠与汴渠堤防，以堰流法束水，十里立一水门，终使河汴分流，无复溃漏之患，帝亲自巡行，我由是知名，拜河堤谒者。
  phases:
  - key: brewing
    name_zh: 初修浚仪渠
    labels:
      zh:
      - 显宗诏与王吴共修浚仪渠
    start_date: ''
    highlight_event_id: guji-王景-event-3
  - key: breakthrough
    name_zh: 永平议治汴渠
    labels:
      zh:
      - 应对称利害
      - 赐山海经、河渠书、禹贡图
    start_date: ''
    highlight_event_id: guji-王景-event-4
  - key: climax
    name_zh: 修渠筑堤千里渠成
    labels:
      zh:
      - 发卒数十万
      - 十里立一水门
      - 帝亲巡行
    start_date: ''
    highlight_event_id: guji-王景-event-5
  - key: closure
    name_zh: 拜河堤谒者
    labels:
      zh:
      - 从驾东巡狩
      - 帝美其功绩
    start_date: ''
    highlight_event_id: guji-王景-event-6
  decisions:
  - date: 0069
    title_zh: 应诏与王吴共修浚仪渠
    rationale: 有人荐我能理水，显宗诏我与王吴共修浚仪渠，吴用我堰流法，水乃不复为害。
  - date: 58
    title_zh: 永平十二年陈理水利害
    rationale: 帝引见问以理水形便，我陈其利害，应对敏给，帝善之，遂委以修渠筑堤重任。
  - date: 58
    title_zh: 商度地势治汴渠筑堤千里
    rationale: 自荥阳东至千乘海口千余里，我凿山阜、破砥绩、直截沟涧、疏决壅积，十里立一水门令更相洄注，虽简省役费仍以百亿计。
- id: guji-王景-endeavor-2
  key: 牧民兴利
  name_zh: 历任徐州刺史、庐江太守兴教化劝农桑
  summary_first_person: 我迁徐州刺史，作金人论以安迁都之议；后为庐江太守，教民牛耕，修起芜废的芍陂稻田，训令蚕织为作法制，由是垦辟倍多，境内丰给。
  phases:
  - key: brewing
    name_zh: 徐州刺史
    labels:
      zh:
      - 作金人论颂洛邑之美
    start_date: ''
    highlight_event_id: guji-王景-event-7
  - key: breakthrough
    name_zh: 迁庐江太守
    labels:
      zh:
      - 教用牛耕
    start_date: ''
    highlight_event_id: guji-王景-event-8
  - key: climax
    name_zh: 修芍陂铭石刻誓
    labels:
      zh:
      - 修起芜废
      - 垦辟倍多
      - 境内丰给
    start_date: ''
    highlight_event_id: guji-王景-event-8
  - key: closure
    name_zh: 集大衍玄基卒于官
    labels:
      zh:
      - 参纪众家数术
      - 集为大衍玄基
    start_date: ''
    highlight_event_id: guji-王景-event-9
  decisions:
  - date: 63
    title_zh: 建初七年迁徐州刺史作金人论
    rationale: 杜笃奏论都赋欲迁还长安，人情动怀土之心，我以宫庙已立，恐人情疑惑，乃作金人论颂洛邑之美、天人之符。
  - date: 0078
    title_zh: 庐江劝农兴水利教蚕织
    rationale: 百姓不知牛耕，致地力有余而食常不足，我驱率吏民修起芜废芍陂，教用牛耕，又训令蚕织为作法制，皆着于乡亭。
