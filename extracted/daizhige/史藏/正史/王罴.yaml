decisions:
- date: ~0534
  title_zh: 奉命率甲士一万先据华州
  rationale: 华州当高欢西来之冲，先据之则敌进有内顾之忧，太祖决策自定
- date: 0537-01
  title_zh: 东魏司马子如寇华州，出兵击走之
  rationale: 子如回军自蒲津寇华州，华州为关中门户，不容失，故主动出击
- date: 0537-10
  title_zh: 高欢大军度河逼华州，严兵固守不战
  rationale: 敌众我寡，众寡不敌，恃城严守使敌知不可攻、锐挫气沮，为太祖聚兵击之赢得时机
