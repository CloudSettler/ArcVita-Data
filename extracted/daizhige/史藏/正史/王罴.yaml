  era: 南北朝·西魏
  reign_ref: 西魏文帝（元宝炬）大统年间
  archetype: 忠谨坚守的方面之任（州刺史／守将）
  dilemmas:
  - 敌众我寡之际，是背城决战，还是据城力守以待援
  - 强邻压境、主帅远出之时，如何独任方面、确保关中门户不失
  lesson: 众寡悬殊之时，恃城严守、挫敌锐气，亦足以定一方之安危。
  summary_first_person: 我本仕于魏末，为宇文太祖所知。太祖与诸将议拒高欢，命我率甲士一万先据华州，以为关中西面之屏。大统元年，东魏将司马子如自蒲津来寇华州，我督兵击走之。三年，高欢亲率大军度河逼华州，我严兵固守，敌知不可攻，乃涉洛而西，遂有沙苑之败。我守华州，正所以为太祖东拒之藩篱也。
  source_urls:
  - https://zh.wikisource.org/wiki/周書/卷2_(帝紀第二·文帝下)
