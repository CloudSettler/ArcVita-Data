  - 出仕与归隐之间的矛盾，晚年称病去郡，优游山水
  - 世家大族身份与个人艺术追求之间的平衡
  lesson: 以毕生之功精研技艺，终成一代书圣；名士风骨不在功名而在气度。
  summary_first_person: 我是王羲之，出身琅玡王氏，官至右军将军、会稽内史，人称王右军。我以书法冠绝古今，兰亭雅集一序传世，世人尊我为书圣。
  source_urls:
