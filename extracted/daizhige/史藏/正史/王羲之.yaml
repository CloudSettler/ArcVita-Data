  date: 353-04-14
  title_zh: 永和九年三月三日兰亭雅集
  participants:
  - guji-王羲之
  summary_zh: 与谢安、孙绰等四十一人修禊于会稽山阴之兰亭，临流赋诗，乘兴作《兰亭集序》，为天下第一行书。
