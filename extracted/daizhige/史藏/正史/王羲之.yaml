- id: guji-王羲之-event-resign
  type: endeavor
  year_of: '355'
  date: '355'
  title_zh: 称病去郡，誓墓不复出
  participants:
  - guji-王羲之
  summary_zh: 因与王述意气相忤，称病去会稽郡职，于父母墓前自誓不复出仕，优游山水终老。
