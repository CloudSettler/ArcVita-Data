  era: 东晋
  reign_ref: 晋安帝、晋恭帝时期
  archetype: 开路奇将（前锋猛将，以奇袭与舟师破敌著称）
  dilemmas:
  - 奉刘裕密令奇袭江陵，须在刘毅称疾蓄势、宠信渐固之际先发制人
  - 北伐关中深入敌境，攻克长安后孤悬北方，与诸将不和、主帅南归
  lesson: 兵贵神速，奇袭可定一方；然孤军悬远、将帅相疑，功成亦难自保。
  summary_first_person: 我王镇恶，是刘裕麾下先锋之将。义熙八年他遣我与蒯恩前袭江陵，一战擒诛刘毅；十二年北伐，我率舟师自河入渭，直取长安，擒获姚泓，功冠诸军。然义熙十四年，安西中兵参军沈田子杀我于关中，时人惜之。
