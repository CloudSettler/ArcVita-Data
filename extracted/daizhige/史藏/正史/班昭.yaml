  reign_ref: 汉和帝、汉安帝时代
  archetype: 才女史家・宫廷师友
  dilemmas:
  - 以女子之身厕身政事，进退须权衡名分与实务
  - 直言犹惧取祸，沉默则有负所学与家风
  lesson: 学问与守礼并行，方能于乱世宫廷中存身而济事
  summary_first_person: 我是班昭，续成兄长班固之《汉书》，两度于宫中教授后妃与诸生，人称曹大家。邓太后当国之际，遇到疑难常向我垂问；其兄邓骘遭母丧乞归，太后不许，问于我，我陈说礼义，太后乃许其守丧，阖门辞事。我以经史之学_LEGULONG佐朝政之名论，不逾闺阈而影响庙堂，是我一生所守。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷10上
