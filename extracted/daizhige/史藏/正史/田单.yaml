events:
- id: guji-田单-event-birth
  person_qid: guji-田单
  name_zh: 田单出生
  date: -291
  year_of: -291
  precision: year
  is_circa: true
  type: birth
  description: 田单生年正史无载，约生于战国齐威王末年，为临淄市掾（市场小吏）之后。
- id: guji-田单-event-escape
  person_qid: guji-田单
  name_zh: 安平逃亡
  date: -284
  year_of: -284
  precision: year
  is_circa: true
  type: endeavor
  endeavor_id: guji-田单-endeavor-1
  description: 燕将乐毅破齐临淄，田单先令族人将车轴截断并包铁笼，齐人争路车轴尽断为燕所虏，唯田单一族得以逃脱东保即墨。
- id: guji-田单-event-defend
  person_qid: guji-田单
  name_zh: 即墨被推为将
  date: -283
  year_of: -283
  precision: year
  is_circa: true
  type: endeavor
  endeavor_id: guji-田单-endeavor-1
  description: 即墨大夫战死，城中共推田单为将，立城拒燕；田单与士卒同甘苦，坐则编贲、起则操版筑，自取妻妾编于行伍，深得军心。
- id: guji-田单-event-fire-oxen
  person_qid: guji-田单
  name_zh: 火牛阵夜破燕军
  date: -279
  year_of: -279
  precision: year
  is_circa: true
  type: endeavor
  endeavor_id: guji-田单-endeavor-1
  description: 田单以反间使燕换将骑劫，又收城中千余牛，角缚兵刃、尾束灌脂苇草，夜凿城纵牛，壮士五千随出，燕军大骇败走，齐人杀其将骑劫。
- id: guji-田单-event-restore
  person_qid: guji-田单
  name_zh: 收复七十余城迎立襄王
  date: -279
  year_of: -279
  precision: year
  is_circa: true
  type: endeavor
  endeavor_id: guji-田单-endeavor-1
  description: 火牛大胜之后田单乘胜追亡，所过城邑皆叛燕归齐，收复七十余城，迎齐襄王于莒，入临淄听政。
- id: guji-田单-event-xiangguo
  person_qid: guji-田单
  name_zh: 封安平君拜为齐相
  date: -279
  year_of: -279
  precision: year
  is_circa: true
  type: endeavor
  endeavor_id: guji-田单-endeavor-2
  description: 齐襄王封田单为安平君，后拜之以为相，主齐政。
- id: guji-田单-event-di
  person_qid: guji-田单
  name_zh: 过淄攻狄不下与终克
  date: -266
  year_of: -266
  precision: year
  is_circa: true
  type: endeavor
  endeavor_id: guji-田单-endeavor-2
  description: 田单攻狄三月不克，鲁仲连谓其有生之乐无死之心；田单闻言立具卒乘、厉气循城，亲当矢石，遂克狄城。
- id: guji-田单-event-death
  person_qid: guji-田单
  name_zh: 田单卒
  date: -265
  year_of: -265
  precision: year
  is_circa: true
  type: death
  description: 田单卒年不详，为相之后事迹无闻，约卒于齐襄王后期；一说迁赵为将。
