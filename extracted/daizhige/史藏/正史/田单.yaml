  name_zh: 田单
  names:
    zh: 田单
    en: Tian Dan
  lifespan:
    birth:
      date: -291
      precision: year
      is_circa: true
      raw: 生年不详，约战国后期
    death:
      date: -265
      precision: year
      is_circa: true
      raw: 莒城任相后数年卒，年不详
  birth_date: 约 -291
  death_date: 约 -265
  era: 战国
  reign_ref: 齐湣王、齐襄王时期
  archetype: 孤城复国的智谋名将
  dilemmas:
  - 守即墨孤城而死战，还是出降而保全性命
  - 用阴谋诡计惑敌取胜是否合乎兵道正道
  lesson: 火牛奇计出奇制胜，危局中智谋与民心可扭转乾坤
  summary_first_person: 我本是齐国临淄市掾小吏，燕破齐时遁走安平，教族人改车轴缚铁笼得脱。后守即墨孤城，众推为将。我扬言天命助齐，深得士心，又行反间使燕王易将去乐毅，乃以火牛阵夜破燕军，连收七十余城，迎齐王入莒，复齐之国，功封安平君。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷082
