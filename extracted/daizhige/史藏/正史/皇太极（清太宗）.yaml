events:
- id: guji-皇太极-event-birth
  name_zh: 皇太极生
  date: 1592-10-25
  year_of: 1592
  type: birth
  location: 建州
  source: 清史稿·太祖本纪
  description: 壬辰冬十月二十五日，太祖第八子皇太极生，孝慈高皇后所出，是为太宗。
- id: guji-皇太极-event-hun
  name_zh: 皇太极娶科尔沁部莽古思之女
  date: '1614'
  year_of: 1614
  type: marriage
  location: 赫图阿拉
  source: 清史稿·太祖本纪
  description: 甲寅夏四月，帝八子皇太极娶于蒙古科尔沁部莽古思之女，行亲迎礼。
- id: guji-皇太极-event-fengbeile
  name_zh: 授皇太极为四贝勒
  date: '1616'
  year_of: 1616
  type: appointment
  location: 赫图阿拉
  source: 清史稿·太祖本纪
  description: 天命元年建元，命八子皇太极为四贝勒，与代善、阿敏、莽古尔泰共听国政。
- id: guji-皇太极-event-saerhu
  name_zh: 萨尔浒之战献策并领兵破刘綎
  date: '1619'
  year_of: 1619
  type: battle
  location: 界凡、阿布达里冈
  source: 清史稿·太祖本纪
  description: 四贝勒言宜趋界凡护卫筑城之众；后以突骑三十夺阿布达里冈，与代善会战斩刘綎，大破南北两路明军。
- id: guji-皇太极-event-jieyuan
  name_zh: 领兵援科尔沁退林丹汗
  date: 1625-11
  year_of: 1625
  type: battle
  location: 科尔沁
  source: 清史稿·太祖本纪
  description: 察哈尔林丹汗来攻科尔沁，四贝勒皇太极及阿巴泰以精骑五千赴之，林丹汗遁。
- id: guji-皇太极-event-jihan
  name_zh: 继太祖位为汗
  date: '1627'
  year_of: 1627
  type: succession
  location: 盛京沈阳
  source: 清史稿
  description: 太祖崩于天命十一年，皇太极以四贝勒继位，建元天聪。
- id: guji-皇太极-event-chengdi
  name_zh: 称帝建元崇德、改国号为清
  date: '1636'
  year_of: 1636
  type: enthronement
  location: 盛京沈阳
  source: 清史稿
  description: 皇帝受宽温仁圣皇帝尊号，建国号曰清，建元崇德。
- id: guji-皇太极-event-death
  name_zh: 皇太极崩
  date: '1643'
  year_of: 1643
  type: death
  location: 盛京沈阳
  source: 清史稿·太宗本纪
  description: 崇德八年，太宗崩于盛京，庙号太宗，谥文皇帝。
