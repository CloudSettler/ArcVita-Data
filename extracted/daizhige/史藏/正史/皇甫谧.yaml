  era: 三国曹魏至西晋
  reign_ref: 西晋武帝泰康年间
  archetype: 隐逸学者与医学家
  dilemmas:
  - 朝廷屡征不应，坚持隐居著述，隐逸与名节的抉择
  - 身染风痹而发愤学医，儒学与医学的兼修
  - 编纂《帝王世纪》考订上古帝王世系，各家异说之间取舍传信
  lesson: 病残之躯不能夺其志，白首穷经兼通医道，慎阙疑而传信。
  summary_first_person: 我名皇甫谧，字士安，自号玄晏先生。生当魏晋之际，淡泊名利，屡辞征辟；因染风痹，遂究医学，撰《针灸甲乙经》。又博考经传，作《帝王世纪》，考黄帝、尧、舜以来帝王世次，主张阙疑传信，为后世史家所重。
  source_urls:
  - https://zh.wikipedia.org/wiki/皇甫谧
