  decisions:
  - date: 934-03
    title_zh: 自成德移镇赴阙，邂逅愍帝于卫州
    rationale: 应顺元年因孟汉琼入朝之议，徙镇成德，率军入朝，尽杀愍帝从者而留驻京师。
- id: guji-石敬瑭-endeavor-2
  name_zh: 举兵建后晋
  phases:
