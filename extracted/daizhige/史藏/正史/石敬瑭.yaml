      date: '942'
      precision: year
      is_circa: false
      raw: 天福七年卒
  birth_date: 约892年
  death_date: 942年
  era: 五代十国（后晋）
  reign_ref: 后晋高祖，天福元年（936）即位
  archetype: 开国之君 / 借外力夺位者
  dilemmas:
  - 为求自立而称臣契丹、割让燕云，得位与失地的两难
  - 受废帝猜疑，徙镇与反叛之间的抉择
  lesson: 借势者得天下，亦常以更重的代价偿之。
  summary_first_person: 我本河东节度使，为废帝所疑，天福元年据太原举兵，引契丹为援，遂灭后唐而建后晋，然割燕云、称儿皇帝，为后世所议。
  source_urls:
  - https://zh.wikisource.org/wiki/新五代史
endeavors:
