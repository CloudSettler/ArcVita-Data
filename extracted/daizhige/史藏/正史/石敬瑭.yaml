  decisions:
  - date: 936-05
    title_zh: 徙镇天平，敬瑭不受命
    rationale: 废帝疑其必反，罢总管徙镇郓州，敬瑭遂据河东抗命举兵。
  - date: 936-11
    title_zh: 称臣契丹，割燕云十六州
    rationale: 以契丹兵助战灭唐，父事契丹、割地称臣，换取立国之援。
