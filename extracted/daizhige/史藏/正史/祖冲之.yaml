  dilemmas:
  - 新历斗胆改易旧章， consultar传统历法与实测天象之间的取舍
  - 圆周率推算繁难，精确与计算工具极限之间的坚持
  lesson: 以实测纠正旧说，精算不辍，方能使历数大明于世
  summary_first_person: 我是祖冲之，精于历数之学。所造大明历以实测定置闰与交点月，所推圆周率密于前人；沈洙议漏刻时，犹引何承天与我所定之刻数为准。寒暑不改，昼夜推步，务使历数合于天行。
  source_urls:
  - https://zh.wikisource.org/wiki/南史/卷072
