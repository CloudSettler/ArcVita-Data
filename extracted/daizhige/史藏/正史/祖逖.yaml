  dilemmas:
  - 中原沦丧而朝廷偏安，孤军北伐难有后援
  lesson: 闻鸡起舞、中流击楫，志士当以天下兴亡为己任
  summary_first_person: 我祖逖，范阳人，少与刘琨闻鸡起舞，共矢报国之志。中原板荡，我率部曲南渡，后请缨北伐，渡江中流击楫而誓：不清中原而复济者，有如大江。我收复黄河以南之地，然朝廷内忧掣肘，壮志未竟而卒。
  source_urls:
  - https://zh.wikisource.org/wiki/晉書/卷062
