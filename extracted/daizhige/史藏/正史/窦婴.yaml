  summary_first_person: 我是窦婴，汉文帝皇后窦氏堂侄。七国之乱时我以大将军守荥阳，因功封魏其侯。武帝初我任丞相，后因直言忤旨去职。因灌夫之事与田蚡结怨，终被弃市于渭城，功名尽付东流。
