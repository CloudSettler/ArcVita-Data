person:
  qid: guji-窦宪
  name_zh: 窦宪
  names:
    zh: 窦宪
    en: Dou Xian
  lifespan:
    birth:
      date: ''
      precision: ''
      is_circa: false
      raw: ''
    death:
      date: 92
      precision: year
      is_circa: false
      raw: 永元四年，遣宪及弟笃、景就国，到皆自杀
  birth_date: ''
  death_date: 92
  era: 东汉
  reign_ref: 汉和帝永元年间
  archetype: 外戚权臣与征伐名将
  dilemmas:
  - 以外戚辅政、权倾朝野，终遭皇帝诛除
  - 灭北匈奴立不世之功，同时埋下鲜卑崛起之患
  lesson: 功高震主而不知自处者，虽勒石燕然亦难保其身
  summary_first_person: 我是窦宪，汉章帝窦皇后之兄。和帝年幼即位，太后临朝，命我以侍中领兵伐北匈奴。永元元年，我出鸡鹿塞，于稽落山大破北单于，追至私渠比鞮海，登燕然山刻石勒功；后再遣将围北单于于金微山，北庭遂定，我进为大将军，权倾朝野。然我潜图弒逆事发，永元四年和帝收我大将军印绶，遣我就国，行至半途被逼自杀。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
endeavors:
- id: guji-窦宪-endeavor-1
