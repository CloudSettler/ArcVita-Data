  - key: climax
    name_zh: 燕然勒功与金微山之捷
    labels:
      zh: 登燕然山刻石纪功；耿夔破北单于于金微山
    start_date: '89'
    highlight_event_id: guji-窦宪-event-jinweishan
  - key: closure
    name_zh: 权倾被诛
    labels:
      zh: 进为大将军，还朝后图逆事败，自杀
    start_date: 89-09
    highlight_event_id: guji-窦宪-event-death
  decisions:
  - date: '88'
    title_zh: 固辞内辅，自请出击匈奴
    rationale: 太后诏欲以旧典辅政，宪固执谦让，遂请北伐以立功自固
  - date: 89-09
    title_zh: 受封大将军，坐镇朝廷
    rationale: 以破匈奴之功进号大将军，自此专权用事
  - date: '92'
    title_zh: 潜图弒逆
    rationale: 权势日盛，图谋不轨，终致和帝先发制人
events:
- id: guji-窦宪-event-appointed
  date: 88-10
  year_of: 88
  title_zh: 以侍中窦宪为车骑将军，伐北匈奴
  summary_zh: 章和二年十月乙亥，太后临朝，命兄窦宪率军征讨北匈奴。
  principals:
  - 窦宪
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
- id: guji-窦宪-event-jiluoshan
  date: 89-06
  year_of: 89
  title_zh: 稽落山大破北匈奴，登燕然山刻石勒功
  summary_zh: 永元元年六月，窦宪出鸡鹿塞，与度辽将军邓鸿、南单于会师，大破北匈奴于稽落山，追至私渠比鞮海，登燕然山刻石而还。
  principals:
  - 窦宪
  - 北单于
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
- id: guji-窦宪-event-dajiangjun
  date: 89-09
  year_of: 89
  title_zh: 以车骑将军窦宪为大将军
  summary_zh: 九月庚申，以破匈奴之功进窦宪为大将军。
  principals:
  - 窦宪
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
- id: guji-窦宪-event-jinweishan
  date: 91-02
  year_of: 91
  title_zh: 遣耿夔围北单于于金微山，大破之
  summary_zh: 永元三年二月，大将军窦宪遣左校尉耿夔出居延塞，围北单于于金微山，大破之，获其母阏氏，北庭遂灭。
  principals:
  - 窦宪
  - 耿夔
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
- id: guji-窦宪-event-huichao
  date: 92-04
  year_of: 92
  title_zh: 大将军窦宪还至京师
  summary_zh: 永元四年夏四月丙辰，窦宪自凉州还至京师，权势盛极。
  principals:
  - 窦宪
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
- id: guji-窦宪-event-death
  date: 92-06
  year_of: 92
  title_zh: 窦宪谋逆事发，收大将军印绶，就国自杀
  summary_zh: 永元四年六月，和帝收捕宪党郭璜、郭举、邓迭、邓磊等下狱死，使谒者仆射收宪大将军印绶，遣宪及弟笃、景就国，到皆自杀。
  principals:
  - 窦宪
  - 汉和帝
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷4
