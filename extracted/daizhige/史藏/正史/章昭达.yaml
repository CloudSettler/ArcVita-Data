  name_zh: 章昭达
  names:
    zh: 章昭达
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: ''
  era: 南朝陈（陈文帝、废帝在位期间）
  reign_ref: 陈世祖文皇帝（陈蒨）· 陈废帝（陈伯宗）
  archetype: 武将·讨叛平乱之帅臣
  dilemmas:
  - 受命连年征讨周迪、陈宝应等反叛势力，兵无宁岁而民力疲敝
  - 屡立战功位至方面，需在皇权更迭与宗室纷争中谨慎自处
  lesson: 以南征北讨安定方隅，功名著于江左。
  summary_first_person: 我章昭达出为郢州刺史，天嘉年间奉诏讨伐周迪，大破之；继又进军建安平陈宝应，擒陈宝应、留异送京师，晋安郡遂平。此后历镇前将军、开府仪同三司、江州刺史，废帝时进号征南大将军，官至中抚大将军，为陈室南疆支柱。
