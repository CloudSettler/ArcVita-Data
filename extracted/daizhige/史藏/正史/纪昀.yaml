  archetype: 学者·总纂官
  dilemmas:
  - 作为总纂官校订群籍，须在收录存古与削繁定一之间权衡取舍
  - 对前人著作既有推崇又须指出其考证疏舛，褒贬难以兼顾
  lesson: 校勘之学贵在精审疏通，既存古本之旧，亦须切中症结、不避吹毛求疵之讥。
  summary_first_person: 我纪昀奉乾隆钦命为四库全书总纂官，与陆锡熊、孙士毅等恭校群籍。此篇所校为宋吴缜《五代史纂误》，其书久佚，我们从永乐大典中采缀裒集，得一百十四事，依宋史目次厘为三卷，于乾隆四十七年五月恭校上进。
  source_urls:
  - https://example.org/sikuquanshu/wudaishizuanyu
