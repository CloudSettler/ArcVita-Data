events:
- id: guji-羊祜-event-birth
  date: '221'
  year_of: '221'
  title_zh: 羊祜出生
  summary_zh: 羊祜生于泰山南城，出身累世二千石之家，蔡邕外孙。
- id: guji-羊祜-event-appointment
  date: '269'
  year_of: '269'
  title_zh: 都督荆州诸军事、假节
  summary_zh: 泰始五年，羊祜为都督荆州诸军事，出镇襄阳。
- id: guji-羊祜-event-shiTun
  date: '271'
  year_of: '271'
  title_zh: 屯田备粮，恩信大行
  summary_zh: 减省戍守巡逻之卒以垦田八百余顷，初至军无百日粮，至末年有十年之积；同时开布信义，绥怀江汉，吴人悦服。
- id: guji-羊祜-event-lukang
  date: '274'
  year_of: '274'
  title_zh: 与陆抗信义相往还
  summary_zh: 吴将陆抗与之对境，常通使命，抗病祜馈之药，抗不疑而饮之，叹其德不可犯。
- id: guji-羊祜-event-memorial
  date: '278'
  year_of: '278'
  title_zh: 临终献策，力主伐吴
  summary_zh: 咸宁四年，羊祜疾病，入朝面陈伐吴之策，举杜预自代。两年后晋果灭吴，群臣忆祜之言。
- id: guji-羊祜-event-recommend
  date: 278-11
  year_of: '278'
  title_zh: 荐杜预自代
  summary_zh: 病笃举杜预都督荆州以继其谋。
- id: guji-羊祜-event-death
  date: 278-11
  year_of: '278'
  title_zh: 羊祜卒
  summary_zh: 咸宁四年十一月卒，年五十八。南州民罢市而泣，吴守边将士亦为之泣，襄阳百姓于岘山立碑，岁时飨祭，号堕泪碑。
