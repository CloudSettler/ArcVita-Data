  archetype: 儒将
  dilemmas:
  - 伐吴之议，朝议不合，进退维艰
  - 镇襄阳而怀柔吴人，战和之间
  lesson: 不伐有功，不矜其能，德信服人
  summary_first_person: 我出身高平羊氏，历仕魏晋两朝，出镇襄阳十年，修德怀柔，屯田储粮，为平吴大业奠定根基，临终荐杜预自代，身后吴人闻丧亦为之泣。
  source_urls:
  - https://zh.wikisource.org/wiki/九家旧晋书辑本
