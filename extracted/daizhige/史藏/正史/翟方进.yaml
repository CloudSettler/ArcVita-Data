  description: 援汉旧仪'御坐为起、在舆为下'，劾奏司隶不敬，其后又劾罢两司隶，风厉天下。
- id: guji-翟方进-event-4
  event_type: endeavor
  date: -15
  year_of: -15
  principal: guji-翟方进
  title: 代薛宣为丞相
  description: 薛宣诫掾史之私言终应验，翟方进其后果代宣为公，秉政当国。
- id: guji-翟方进-event-5
  event_type: endeavor
  date: -7
  year_of: -7
  principal: guji-翟方进
  title: 星变频发，白马赐死
  description: 绥和二年春节星变，帝使尚书诘问，方进即席自陈宿责，成帝赐上尊酒、黄牛以示遣就其第，方进即日自尽，追諡恭侯，童谣'翟子威'流传。
- id: guji-翟方进-event-death
  event_type: death
  date: -7
  year_of: -7
  principal: guji-翟方进
  title: 翟方进卒于自杀
  description: 丞相因星异被谴，饮药或自尽以谢责，卒于绥和二年。
