person:
  qid: guji-耶律乙辛
  name_zh: 耶律乙辛
  names:
    zh: 耶律乙辛
  era: 辽（道宗朝）
  archetype: 权臣
  dilemmas:
  - 在重元之乱中率宿卫平叛，以身家性命站队皇权
  - 由忠于朝廷的功臣逐步专权，走上党同伐异之路
  lesson: 平乱之功可致显位，权柄无制则生祸乱
  summary_first_person: 我耶律乙幸起于枢密副使，清宁五年除南院枢密使，七年知北院枢密使事。九年重元父子犯行宫，我与许王仁先等率宿卫士卒御之，涅鲁古被射杀，重元亡入大漠自杀，我遂以定乱之功复为南院枢密使，权势日盛。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷21
  - https://zh.wikisource.org/wiki/遼史/卷22
