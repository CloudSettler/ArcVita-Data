  archetype: 邦交谈判之材
  dilemmas:
  - 对宋索地还是约和：兴宗欲取关南十县，仁先奉使折冲，终以增币定和而兵不血刃
  lesson: 大使一言，可息两国之兵；坐获岁币利在国家，交兵则害在国家。
  summary_first_person: 我耶律仁先，历仕重熙朝，先充贺宋生辰使副，继以枢密副使衔与刘六符使宋约和，促成宋岁增银绢十万之盟，进宋国誓书而还；后同知东京留守事，累迁南院大王，以彊济谨重称于时。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷19
  - https://zh.wikisource.org/wiki/遼史/卷20
