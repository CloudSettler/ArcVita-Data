    rationale: 宿将寿终，圣宗辍朝五日，进封诸弟以代其镇南之寄
- id: guji-耶律休哥-endeavor-2
  name_zh: 身后门庭之变与其余波
  roles:
  - 于越之后（家系）
  summary_zh: 统和二十一年（1023）十一月，休哥之子道士奴、高九等谋叛，事败伏诛，家道中衰；同年朝议通括南院部民，门荫之势尽消。
  dates:
