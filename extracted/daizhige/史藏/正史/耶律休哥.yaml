  name_zh: 镇御南京、屡抗宋军
  roles:
  - 南京留守
  - 宋国王
  summary_zh: 统和年间，耶律休哥长期镇守南京（幽州），屡次参与对宋战事，为辽朝南面边防统帅，封宋国王，即本卷所载'宋国王休哥'。
  dates:
    start: 983
    end: 998-12
