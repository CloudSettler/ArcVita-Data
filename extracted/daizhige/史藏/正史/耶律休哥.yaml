  dilemmas:
  - 边帅功高震主，身后诸子谋叛伏诛
  lesson: 一代名将之荣辱系于君心，门庭之祸常在身后
  summary_first_person: 我是辽室宗王，久镇南京、御宋为边帅，官至宋国王，显赫一时。统和十六年十二月，我薨逝，皇帝辍朝五日以致哀荣。然我死之后二十余年，我的儿子道士奴、高九等谋叛，竟遭伏诛，家门荣辱_TBL成败皆系于朝堂。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷15
  notes: 本卷为《辽史·圣宗纪六》，休哥事迹仅见卒年，反推其生平为宋伐诸役名将；追叙其子谋叛事。
