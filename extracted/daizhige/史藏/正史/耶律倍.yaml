  dilemmas:
  - 身为皇太子却为母后所疏，位与才难以两全
  - 弃国投后唐以保性命与文化志趣
  lesson: 长于文明而短于权斗，让位未必得全。
  summary_first_person: 我是耶律倍，辽太祖长子，神册元年被立为皇太子。我通汉学、建孔庙之议，也奉兵略地。然母后属意弟尧骨，我遂让位，奔后唐避祸，终不得善终。
