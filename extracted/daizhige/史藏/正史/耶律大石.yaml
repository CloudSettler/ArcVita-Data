person:
  qid: guji-耶律大石
  name_zh: 耶律大石
  names:
    zh: 耶律大石
    en: Yelü Dashi
  lifespan:
    birth:
      date: 约1087
      precision: year
      is_circa: true
      raw: 生年史无明文，据天庆五年登进士第推约在1087年前后
    death:
      date: '1143'
      precision: year
      is_circa: false
      raw: 西辽康国十年（1143年）卒
  birth_date: 约1087
  death_date: '1143'
  era: 辽朝末年至西辽开国（12世纪前期）
  reign_ref: 西辽德宗（追尊），号菊儿汗，年号延庆、康国
  archetype: 亡国之际万里西迁、重建王朝的开国之君
  dilemmas:
  - 君臣大节与社稷存续相冲突：天祚弃国远遁，是愚忠随亡，还是立淳以系燕地人心
  - 复辽方略之争：随天祚轻举求战必速亡，力谏养兵待时则近于抗上
  - 个人安危与复国大业之两难：抗辩获赦后不自安，坐待清洗，还是杀将自立、西迁另辟基业
  lesson: 国势不可为则蓄势于外；与其困守将倾之厦，不如远徙择地、养兵待时，绝境之中亦可别续宗祧。
  summary_first_person: 吾耶律大石，字重德，太祖八代孙。通辽、汉字，善骑射，天庆五年登进士第，擢翰林应奉，辽人呼翰林为林牙，故称大石林牙，历泰、祥二州刺史、辽兴军节度使。金兵日逼，天祚播越，吾与诸大臣立秦晋王淳以守燕；淳亡，复奉萧德妃保燕。天祚怒诛德妃而诘我，吾以「即立十淳，皆太祖子孙，岂不胜乞命于他人」对之，上无以答，赦吾罪。然度天祚终不可与图存，力谏轻举又不见用，遂杀乙薛、坡里括，置北南面官属，自立为王，率铁骑二百宵遁，西至可敦城，会十八部王众誓师。后逾万里而西，称菊儿汗，建元延庆，肇建西辽，以延大辽国祚。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷30
  - https://zh.wikisource.org/wiki/遼史/卷29
