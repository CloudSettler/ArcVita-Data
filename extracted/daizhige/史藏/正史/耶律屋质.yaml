  summary_first_person: 我耶律屋质出身皇族孟父房，官至于越。太宗身后勤王诸军相攻之际，太后遣李胡拒世宗于泰德泉，我直言谏太后，指出人心畏李胡酷暴，终促成帝位之争的和议，免辽室一场内乱。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷六十四
