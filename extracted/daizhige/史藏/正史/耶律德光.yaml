events:
- id: guji-耶律德光-event-birth
  year_of: 902
  date: '902'
  title_zh: 耶律德光出生
  detail: 唐天复二年生，太祖第二子，母淳钦皇后萧氏，生时神光异常。
- id: guji-耶律德光-event-yuanshuai
  year_of: 922
  date: '922'
  title_zh: 授天下兵马大元帅
  detail: 天赞元年受任大元帅，统六军南徇地，下平州、掠镇定、破幽州守军。
- id: guji-耶律德光-event-celi
  year_of: 936
  date: '936'
  title_zh: 册立石敬瑭为晋帝
  detail: 南援太原大破唐军，设坛晋阳册石敬瑭为大晋皇帝，约为父子之国。
- id: guji-耶律德光-event-bianjing
  year_of: 947
  date: '947'
  title_zh: 入汴京改国号大辽
  detail: 灭后晋，入汴州，改国号为大辽，兼采汉制治理中原。
- id: guji-耶律德光-event-death
  year_of: 947
  date: '947'
  title_zh: 病逝于北返途中
  detail: 自汴北返，病逝于栾城（杀胡林），庙号太宗。
