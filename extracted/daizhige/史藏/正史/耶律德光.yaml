  era: 辽（契丹）太宗时期
  reign_ref: 天显、会同、大同年间在位
  archetype: 开拓型君主 · 军事征服者
  dilemmas:
  - 继位之争：兄长人皇王耶律倍在世，得述律太后支持而登大统，兄弟关系微妙
  - 南征抉择：援立石敬瑭得燕云，既收藩辅之利，又担中原治理之难
  lesson: 顺势借力可成大业，然得地易、治地难。
  summary_first_person: 我是辽太宗耶律德光，太祖第二子，小字尧骨。我早年为天下兵马大元帅，随父东征西讨，战功卓著。太祖崩后，我得母后与群臣拥戴即位，随后应石敬瑭之请南援，破唐军于太原，册立后晋，尽取燕云十六州。此后我经营南北、修订制度，最终南下灭晋，入汴京改号大辽，然北返途中病逝于栾城。
  source_urls:
  - '{{古文出处：辽史·本纪第三·太宗上}}'
