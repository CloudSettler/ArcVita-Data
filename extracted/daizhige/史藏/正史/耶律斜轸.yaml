  era: 辽代（景宗、圣宗朝）
  reign_ref: 保宁、乾亨、统和年间
  archetype: 名将统帅
  dilemmas:
  - 忠于君主与战局凶险之间（白马岭之败后须力挽对宋战局）
  - 援汉耗竭国力与战略必要之间的取舍
  lesson: 危局中冷静出击，一战定胜负者必先蓄势于边镇
  summary_first_person: 我是辽之名将耶律斜轸，先任西南面招讨使，保宁八年转北院大王；乾亨元年援汉，随后在高梁河与休哥横击宋军，令宋帝乘驴车遁逃；统和初守司徒，随太后南征，又于战场上救出被围的统军使善补。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷九
  - https://zh.wikisource.org/wiki/遼史/卷十
