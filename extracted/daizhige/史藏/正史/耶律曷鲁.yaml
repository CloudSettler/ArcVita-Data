      raw: 神册三年秋七月乙酉，于越曷鲁薨
  birth_date: 0872
  death_date: 0918-08
  era: 辽太祖时期（契丹开国）
  reign_ref: 辽太祖耶律阿保机
  archetype: 开国元勋
  dilemmas:
  - 忠于太祖与宗族利益之间的抉择
  - 统兵攻幽州而兵少，进退之难
  lesson: 股肱之臣以忠勤佐命，虽久劳军事而不居功，故薨而君为之辍朝震悼。
  summary_first_person: 我耶律曷鲁，契丹迭剌部人，佐辽太祖定天下。尝率百僚三表请上尊号，拜阿庐朵里于越；又领兵围幽州，兵少而还，旋奉命与卢国用守之。神册三年薨，太祖震悼辍朝三日，赙赠有加。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷01
  - https://zh.wikisource.org/wiki/遼史/卷02
