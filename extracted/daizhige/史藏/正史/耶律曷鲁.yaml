    title_zh: 太祖班师，留曷鲁、卢国用守幽州之围
    rationale: 以大暑霖潦不可攻，留曷鲁继续围困幽州。
  - date: 0917-08
    title_zh: 李嗣源来救幽州，曷鲁以兵少而还
    rationale: 敌援大军既至，契丹兵少难敌，权衡利弊遂撤围而还。
