  death_date: 1244年
  era: 大蒙古国
  reign_ref: 元太宗窝阔台时期
  archetype: 制度文臣
  dilemmas:
  - 举国崇武征伐背景下能否以文法理财安顿中原
  - 诸王贵戚欲另立官吏自取租赋时是否坚持朝廷集权
  lesson: 制度虽一时受挫，然安民足国之谋终为后世根基
  summary_first_person: 我本契丹后裔，仕于大蒙古国。太祖成吉思汗信我，太宗窝阔台倚我。我主中原赋税以户计 出，建中书省为中书令，立十路征收课税使，奏罢扑买课税之弊，禁诸王擅自征调，又试儒士、蠲赋役、修孔子庙、兴文教。太宗尝言
    非卿则中原无今日。然奥都拉合蛮扑买银课，我谏而不从，此生尽瘁于汉法与国用之间。
  source_urls:
  - 卷四《元史·太宗本纪》
