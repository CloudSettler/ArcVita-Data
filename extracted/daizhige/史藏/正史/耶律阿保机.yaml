person:
  qid: guji-yelv-abaoji
  name_zh: 耶律阿保机
  names:
    zh: 耶律阿保机
    en: Yelü Abaoji
  lifespan:
    birth:
      date: 872
      precision: year
      is_circa: false
      raw: 唐咸通十三年生
    death:
      date: 926
      precision: year
      is_circa: false
      raw: 史载天显元年七月崩于扶余府，本节选未及，据史补
  birth_date: 872
  death_date: 926
  era: 唐末五代·契丹开国
  reign_ref: 天皇帝，907年即位至926年，年号神册、天赞、天显
  archetype: 开国之君·部族联盟转帝制
  dilemmas:
  - 帝位欲传子而契丹旧制可汗世选，诸弟剌葛等三度谋逆，家天下与部落共治相争
  - 手足与国法难两全，首恶剌葛杖而释之，从逆三百余人弃市，自叹诛之实不得已
  - 四向武功与民生凋敝并存，征伐俘获甚众而民间昔有万马今皆徒步
  lesson: 创非常之业者不可以常法守之，然非常之权须以制度、文教与宽仁固之，否则虽兄弟亦成寇仇
  summary_first_person: 吾耶律氏讳亿，字阿保机，契丹迭剌部人。起于挞马沙里，以夷离堇专征讨，破室韦、于厥、奚霫，与李克用云州约为兄弟。燔柴告天代遥辇氏而立为天皇帝，三平诸弟之乱，建元神册，立子倍为皇太子。城皇都，置惕隐、北府宰相，诏建孔子庙佛寺道观，修辽阳为东平郡，欲使契丹自部落而为制度之国。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷1
  - https://zh.wikisource.org/wiki/遼史/卷2
endeavors:
- id: guji-yelv-abaoji-endeavor-1
  name_zh: 代遥辇氏称帝、平诸弟定帝制
  description_zh: 自受痕德堇可汗夷离堇专征讨之任，至燔柴即位、三平诸弟之乱、建元神册立皇太子，契丹由部落联盟转为帝制国家。
  start_date: 901
  end_date: 916
  phases:
  - key: brewing
    name_zh: 专征立威
    labels:
      zh: 授夷离堇专征讨、破室韦于厥奚、俘获甚众
    start_date: 901
    highlight_event_id: guji-yelv-abaoji-event-901-yilijin
  - key: breakthrough
    name_zh: 燔柴即位
    labels:
      zh: 痕德堇可汗殂、群臣奉遗命请立、即皇帝位号天皇帝
    start_date: 907
    highlight_event_id: guji-yelv-abaoji-event-907-enthronement
  - key: climax
    name_zh: 三平诸弟之乱
    labels:
      zh: 剌葛等三度谋逆、缓追疲敌、擒剌葛于榆河
    start_date: 911
    highlight_event_id: guji-yelv-abaoji-event-913-zhudiping
  - key: closure
    name_zh: 建元立储
    labels:
      zh: 上尊号大圣大明天皇帝、建元神册、立子倍为皇太子
    start_date: 916
    highlight_event_id: guji-yelv-abaoji-event-916-shence
  decisions:
  - date: 907
    title_zh: 三让而后即皇帝位
    rationale: 痕德堇可汗殂，群臣奉遗命请立，曷鲁等劝进，遂燔柴告天，尊母为皇太后、立后为地皇后
  - date: 913-04
    title_zh: 缓追疲敌以待其乱
    rationale: 俟剌葛远遁，人各怀土，其心必离，我军乘之，破之必矣；尽以所获资畜分赐将士
  - date: 913
    title_zh: 杖释首恶剌葛、诛从逆三百余人
    rationale: 人命至重，弟不忍置法；然残害忠良涂炭生民剽掠财产，民间昔有万马今皆徒步，实不得已而诛之
  - date: 916
    title_zh: 立子倍为皇太子
    rationale: 变可汗世选为父子相传，固帝制之基
- id: guji-yelv-abaoji-endeavor-2
  name_zh: 四向征拓、南略燕蓟
  description_zh: 以兵四十万伐河东代北，尽有奚霫之地，北征突厥吐浑党项沙陀，南攻蔚新武妫儒五州、围幽州，拓地设西南面招讨司。
  start_date: 902
  end_date: 919
  phases:
  - key: brewing
    name_zh: 伐代北城龙化
    labels:
      zh: 攻下九郡获生口九万五千、城龙化州于潢河之南
    start_date: 902
    highlight_event_id: guji-yelv-abaoji-event-902-longhua
  - key: breakthrough
    name_zh: 结盟李克用
    labels:
      zh: 云州会盟易袍马约为兄弟、共击刘仁恭拨数州
    start_date: 905
    highlight_event_id: guji-yelv-abaoji-event-905-cloudstate-alliance
  - key: climax
    name_zh: 尽有奚霫、南攻幽州
    labels:
      zh: 五部入版籍刻石纪功、新州之战斩首三万余级
    start_date: 911
    highlight_event_id: guji-yelv-abaoji-event-911-xi
  - key: closure
    name_zh: 经略辽东
    labels:
      zh: 围幽州不克班师、修辽阳故城置东平郡防御使
    start_date: 918
    highlight_event_id: guji-yelv-abaoji-event-919-dongping
  decisions:
  - date: 905-10
    title_zh: 与李克用云州结盟
    rationale: 克用乞盟借兵以报刘仁恭木瓜涧之役，易袍马约为兄弟，进兵击仁恭，拨数州尽徙其民以归
  - date: 916-07
    title_zh: 亲征突厥吐浑党项沙陀诸部
    rationale: 乘建元之势北略，皆平之，俘酋长及户万五千六百，遂改武州为归化州、妫州为可汗州，置西南面招讨司
  - date: 917-06
    title_zh: 围幽州不克而班师
    rationale: 望城中有气如烟火状，知未可攻，以大暑霖潦班师，留曷鲁、卢国用守之
- id: guji-yelv-abaoji-endeavor-3
  name_zh: 创制度、建都城、兴文教
  description_zh: 始置惕隐典族属，以后族萧敌鲁为北府宰相，置铁冶、炭山北置羊城通市易，城皇都，诏建孔子庙佛寺道观，修辽阳故城迁汉民渤海户。
  start_date: 908
  end_date: 919
  phases:
  - key: brewing
    name_zh: 立官制
    labels:
      zh: 始置惕隐以皇弟撒剌为之、典族属
    start_date: 908
    highlight_event_id: guji-yelv-abaoji-event-908-tiyin
  - key: breakthrough
    name_zh: 置相兴业
    labels:
      zh: 萧敌鲁为北府宰相、置铁冶、羊城通市易
    start_date: 910
    highlight_event_id: guji-yelv-abaoji-event-910-beifu
  - key: climax
    name_zh: 营皇都、立孔庙
    labels:
      zh: 康默记充版筑使城皇都、诏建孔子庙佛寺道观
    start_date: 918
    highlight_event_id: guji-yelv-abaoji-event-918-huangdu
  - key: closure
    name_zh: 实东平、谒圣庙
    labels:
      zh: 以汉民渤海户实东平郡、亲谒孔子庙命后与太子分谒寺观
    start_date: 919
    highlight_event_id: guji-yelv-abaoji-event-919-dongping
  decisions:
  - date: 908-01
    title_zh: 始置惕隐典族属
    rationale: 宗族日盛，设官专掌皇族之事，以皇弟撒剌为之
  - date: 910-07
    title_zh: 以后兄萧敌鲁为北府宰相
    rationale: 联后族共掌国政，后族为相自此始
  - date: 918-05
    title_zh: 诏建孔子庙、佛寺、道观
    rationale: 兼容三教以收汉地士民之心，立文教之基
  - date: 919-02
    title_zh: 修辽阳故城为东平郡
    rationale: 以汉民、渤海户实之，置防御使，经营辽东为东面根本
events:
- id: guji-yelv-abaoji-event-birth
  type: birth
  date: 872
  year_of: 872
  precision: year
  title_zh: 生于契丹迭剌部
  description_zh: 唐咸通十三年生，母宣简皇后萧氏梦日堕怀有娠，及生室有神光异香，三月能行，言必及世务，伯父当国疑辄咨焉。
- id: guji-yelv-abaoji-event-901-yilijin
  type: office
  date: 901
  year_of: 901
  precision: year
  title_zh: 授夷离堇、专征讨
  description_zh: 唐天复元年痕德堇可汗立，以太祖为本部夷离堇专征讨，连破室韦、于厥及奚帅辖剌哥，冬十月授大迭烈府夷离堇。
  endeavor_id: guji-yelv-abaoji-endeavor-1
- id: guji-yelv-abaoji-event-902-longhua
  type: campaign
  date: 902-09
  year_of: 902
  precision: month
  title_zh: 伐河东代北、城龙化州
  description_zh: 秋七月以兵四十万伐河东代北，攻下九郡，获生口九万五千，驼马牛羊不可胜纪；九月城龙化州于潢河之南，始建开教寺。
  endeavor_id: guji-yelv-abaoji-endeavor-2
- id: guji-yelv-abaoji-event-903-yuyue
  type: office
  date: 903
  year_of: 903
  precision: year
  title_zh: 拜于越、总知军国事
  description_zh: 伐女直下之，复攻下河东怀远等军，引军略至蓟北俘获以还，创为奚迭剌部分十三县，遂拜于越、总知军国事。
  endeavor_id: guji-yelv-abaoji-endeavor-1
- id: guji-yelv-abaoji-event-905-cloudstate-alliance
  type: alliance
  date: 905-10
  year_of: 905
  precision: month
  title_zh: 与李克用云州会盟
  description_zh: 冬十月以骑兵七万会克用于云州，易袍马约为兄弟，进兵击刘仁恭，拨数州，尽徙其民以归。
  endeavor_id: guji-yelv-abaoji-endeavor-2
- id: guji-yelv-abaoji-event-907-enthronement
  type: enthronement
  date: 907-01
  year_of: 907
  precision: month
  title_zh: 燔柴告天、即皇帝位
  description_zh: 痕德堇可汗殂，群臣奉遗命请立，曷鲁等劝进，三让从之；春正月庚寅设坛如迂王集会埚，燔柴告天即皇帝位，群臣上尊号天皇帝，立皇后萧氏为地皇后。
  endeavor_id: guji-yelv-abaoji-endeavor-1
- id: guji-yelv-abaoji-event-908-tiyin
  type: institution
  date: 908-01
  year_of: 908
  precision: month
  title_zh: 始置惕隐
  description_zh: 春正月辛巳始置惕隐，典族属，以皇弟撒剌为之。
  endeavor_id: guji-yelv-abaoji-endeavor-3
- id: guji-yelv-abaoji-event-910-beifu
  type: institution
  date: 910-07
  year_of: 910
  precision: month
  title_zh: 以后兄萧敌鲁为北府宰相
  description_zh: 秋七月以后兄萧敌鲁为北府宰相，后族为相自此始。
  endeavor_id: guji-yelv-abaoji-endeavor-3
- id: guji-yelv-abaoji-event-911-xi
  type: campaign
  date: 911
  year_of: 911
  precision: year
  title_zh: 亲征奚、五部入版籍
  description_zh: 春正月亲征西部奚，所向辄下，分兵讨东部奚亦平之，于是尽有奚霫之地，东际海南暨白檀西松漠北抵潢水凡五部咸入版籍；三月次滦河刻石纪功。
  endeavor_id: guji-yelv-abaoji-endeavor-2
- id: guji-yelv-abaoji-event-913-zhudiping
  type: civil_war
  date: 913-05
  year_of: 913
  precision: month
  title_zh: 平诸弟之乱、擒剌葛
  description_zh: 剌葛、迭剌、寅底石、安端等三度谋逆，剌葛具天子旗鼓将自立，焚行宫辎重；上缓追疲敌，北追至柴河大破之，五月奏擒剌葛于榆河，明年论刑，杖释首恶而从逆三百余人弃市。
  endeavor_id: guji-yelv-abaoji-endeavor-1
- id: guji-yelv-abaoji-event-916-shence
  type: era
  date: 916-02
  year_of: 916
  precision: month
  title_zh: 建元神册、立皇太子
  description_zh: 二月群臣筑坛上尊号大圣大明天皇帝，大赦建元神册；三月立子倍为皇太子。
  endeavor_id: guji-yelv-abaoji-endeavor-1
- id: guji-yelv-abaoji-event-917-youzhou
  type: campaign
  date: 917-03
  year_of: 917
  precision: month
  title_zh: 新州大破周德威、围幽州不克
  description_zh: 三月攻幽州，周德威以五州之兵拒于居庸关西，合战新州东大破之，斩首三万余级；四月围幽州不克，六月望城中气如烟火状，以大暑霖潦班师。
  endeavor_id: guji-yelv-abaoji-endeavor-2
- id: guji-yelv-abaoji-event-918-huangdu
  type: construction
  date: 918-02
  year_of: 918
  precision: month
  title_zh: 城皇都、诏建孔子庙
  description_zh: 二月癸亥城皇都，以礼部尚书康默记充版筑使；五月乙亥诏建孔子庙、佛寺、道观。
  endeavor_id: guji-yelv-abaoji-endeavor-3
- id: guji-yelv-abaoji-event-919-dongping
  type: construction
  date: 919-02
  year_of: 919
  precision: month
  title_zh: 修辽阳故城为东平郡、谒孔子庙
  description_zh: 二月修辽阳故城，以汉民渤海户实之，改为东平郡置防御使；八月谒孔子庙，命皇后、皇太子分谒寺观。
  endeavor_id: guji-yelv-abaoji-endeavor-3
- id: guji-yelv-abaoji-event-death
  type: death
  date: 926
  year_of: 926
  precision: year
  title_zh: 崩于扶余府
  description_zh: 本节选未及；史载天显元年七月灭渤海后班师，崩于扶余府，年五十五。
