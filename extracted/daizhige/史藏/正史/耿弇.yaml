  dilemmas:
  - 归附刘秀时更始势盛，须在乱世中择主而事
  - 讨齐之策忤抗拒众议，胜负悬于千里孤军
  lesson: 明于料敌、决于机先，方能以少胜众
  summary_first_person: 我耿弇，年二十一投明主于河北，以突骑纵横燕赵，曾率兵平定张步、定齐地，为光武削平东方之乱，云台之上，名列功臣。
