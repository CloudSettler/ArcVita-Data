person:
  qid: guji-蒙哥
  name_zh: 蒙哥
  names:
    zh: 蒙哥
    en: Möngke Khan Mortuus
  lifespan:
    birth:
      date: '1209'
      precision: year
      is_circa: true
      raw: 生年未详，年五十二崩于九年
    death:
      date: 1259-07
      precision: month
      is_circa: false
      raw: 九年秋七月癸亥，帝崩于钓鱼山，年五十有二
  birth_date: '1209'
  death_date: 1259-07
  era: 宋末蒙元
  reign_ref: 元宪宗，1251—1259在位，庙号宪宗，谥桓肃皇帝
  archetype: 征战型君主
  dilemmas:
  - 遵太宗遗命立失烈门，还是借助拔都之力自立为汗
  - 猜防失烈门诸王骨肉，还是保全成吉思汗睦族之训
  - 亲总六师攻坚城合州，还是早还北庭休养民力
  lesson: 聪明果毅可成不世之业，然而凉薄猜嫌、骨肉相残，终为内乱之萌
  summary_first_person: 我是睿宗拖雷长子，蒙哥。凭拔都推戴，我于辛亥年即汗位于斡难、克鲁伦之间。我手书诏令、整饬庶政，命弟忽必烈总漠南、旭烈兀西征，又亲率大军伐宋，围合州坚城，天不假年，殒于钓鱼山下，庙号宪宗。
  source_urls:
  - '{source}'
endeavors:
- id: guji-蒙哥-endeavor-1
  name_zh: 定立汗位与整饬庶政
  phases:
  - key: brewing
    name_zh: 议立积势
    labels:
      zh: 阿勒塔克山会商汗位
    start_date: '1248'
    highlight_event_id: guji-蒙哥-event-aim
  - key: breakthrough
    name_zh: 即位更政
    labels:
      zh: 辛亥即位、颁便益事宜
    start_date: 1251-06
    highlight_event_id: guji-蒙哥-event-enthronement
  - key: climax
    name_zh: 定谳诸王
    labels:
      zh: 穷治失烈门党羽、定太宗子孙分地
    start_date: 1252-04
    highlight_event_id: guji-蒙哥-event-purge
  - key: closure
    name_zh: 政制底定
    labels:
      zh: 凡诏令皆帝手书
    start_date: '1253'
    highlight_event_id: guji-蒙哥-event-reform
  decisions:
  - date: '1251'
    title_zh: 弃宗法长幼之议，受拔都推戴即位
    rationale: 拔都以聪明睿智能效法太祖为言，末哥力劝，遂屈己从众
  - date: '1251'
    title_zh: 颁便益事宜，收滥发牌印诏命
    rationale: 惩太宗朝群臣擅权、政出多门之弊，凡诏令皆手书行之
  - date: '1252'
    title_zh: 谪禁失烈门、忽察、脑忽三王，穷诛党羽
    rationale: 防患于未然，虽宥其死而禁锢之，然靠嫌骨肉，史臣讥之
- id: guji-蒙哥-endeavor-2
  name_zh: 亲总六师伐宋
  phases:
  - key: brewing
    name_zh: 命将经略
    labels:
      zh: 经略司屯田唐邓
    start_date: 1252-02
    highlight_event_id: guji-蒙哥-event-jinglue
  - key: breakthrough
    name_zh: 三道并进
    labels:
      zh: 自将伐宋、出大散关
    start_date: '1258'
    highlight_event_id: guji-蒙哥-event-campaign
  - key: climax
    name_zh: 攻坚合州
    labels:
      zh: 围合州、攻一字城诸门
    start_date: 1259-02
    highlight_event_id: guji-蒙哥-event-hezhou
  - key: closure
    name_zh: 赍志而殂
    labels:
      zh: 崩于钓鱼山
    start_date: 1259-07
    highlight_event_id: guji-蒙哥-event-death
  decisions:
  - date: '1258'
    title_zh: 亲率大军由陇州入大散关伐宋
    rationale: 宋人囚使者月里麻思十六年，亦以天未厌宋、欲竟一统之业
  - date: '1259'
    title_zh: 留兵三千围合州，余众悉攻重庆
    rationale: 合州王坚固守不下，欲分势并进
events:
- id: guji-蒙哥-event-birth
  date: '1209'
  year_of: '1209'
  title_zh: 蒙哥出生
  type: 出生
- id: guji-蒙哥-event-aim
  date: '1248'
  year_of: '1248'
  title_zh: 诸王大会阿勒塔克山议立君
  type: 政治事件
  description_zh: 定宗崩后，拔都力排立失烈门之议，以“聪明睿智、能效法太祖”属意于蒙哥，众议遂定
- id: guji-蒙哥-event-enthronement
  date: 1251-06
  year_of: '1251'
  title_zh: 即汗位于斡难河、克鲁伦河之间
  type: 即位
  description_zh: 翌年夏六月，诸王诹日奉帝即位，追尊皇考拖雷为帝，礼成大宴七日
- id: guji-蒙哥-event-reform
  date: '1251'
  year_of: '1251'
  title_zh: 改更庶政、颁便益事宜
  type: 制度改革
  description_zh: 命忽必烈总治漠南汉地，设三行尚书省，收滥发牌印诏命，定驿马饮税之制
- id: guji-蒙哥-event-purge
  date: 1252-04
  year_of: '1252'
  title_zh: 谪禁失烈门诸王、诛党羽七十人
  type: 政治清洗
  description_zh: 克薛杰上变告三王欲乘宴会作乱，帝穷治其党，定太宗子孙分地以安置之
- id: guji-蒙哥-event-jinglue
  date: 1252-02
  year_of: '1252'
  title_zh: 置经略司于汴，屯田唐邓诸州
  type: 军政经略
  description_zh: 以史天泽、杨惟中、赵璧等为经略使，为图宋之基
- id: guji-蒙哥-event-campaign
  date: 1258-04
  year_of: '1258'
  title_zh: 帝自将伐宋，军号十万三道而进
  type: 军事行动
  description_zh: 帝由陇州入大散关，末哥由米仓关，孛里察入沔州，所向克捷
- id: guji-蒙哥-event-hezhou
  date: 1259-02
  year_of: '1259'
  title_zh: 围攻合州
  type: 军事行动
  description_zh: 帝自鸡爪滩渡江直抵合州城下，攻一字城、镇西门诸堡，汪德臣夜登外城不克而卒
- id: guji-蒙哥-event-death
  date: 1259-07
  year_of: '1259'
  title_zh: 崩于钓鱼山
  type: 逝世
  description_zh: 秋七月癸亥，帝崩于钓鱼山，年五十有二，庙号宪宗，谥桓肃皇帝，葬起辇谷
