  place_zh: 冀州
- id: guji-舜-event-nv
  event_type: career
  date: 约-2220
  year_of: -2220
  title_zh: 厘降二女于沩汭，嫔于虞
  summary_zh: 四岳荐其克谐以孝，烝烝乂不格奸；尧以二女妻舜以观其内，使九男与处以观其外，二女事舜亲戚甚有妇道。
  participants:
  - guji-舜
  place_zh: 沩汭
- id: guji-舜-event-shouzhong
  event_type: career
  date: 约-2210
  year_of: -2210
  title_zh: 舜受终于文祖
  summary_zh: 受天下于尧，告于尧之太祖文祖以明所从受；诛四凶，举元恺八恺、禹皋陶后稷伯夷等分职任事。
  participants:
  - guji-舜
  place_zh: 文祖之庙
- id: guji-舜-event-jianyu
  event_type: career
  date: 约-2200
  year_of: -2200
  title_zh: 舜荐禹于天
  summary_zh: 禹受命于神宗之日，舜年九十有五，耄期倦于勤，以天下巽于外姓有功之贤。
  participants:
  - guji-舜
  place_zh: 神宗（尧庙）
- id: guji-舜-event-death
  event_type: death
  date: 约-2200
  year_of: -2200
  title_zh: 陟方乃死
  summary_zh: 舜典云三十在位、五十载陟方乃死；史迁记南巡狩崩于苍梧、葬于江南九疑，孟子谓卒于鸣条（今山西安邑），本书记疑而不轻从九疑之说。
  participants:
  - guji-舜
  place_zh: 苍梧之野（一说鸣条）
