  archetype: 侧微起于耕渔、以孝德受禅的圣君
  dilemmas:
  - 父顽母嚚象傲之间，克谐以孝而不格于奸
  - 侧微之身，赖四岳之荐、历试诸难而后承尧之天下
  - 受尧之天下而不以私亲授受，传贤不传子
  lesson: 克谐以孝，立德于耕渔侧微之间；举贤诛凶，分职任能，以公天下之心巽位于禹
  summary_first_person: 我出自侧微，耕于历山，渔于雷泽，让畔让居，家虽顽嚚而不失其孝。尧试我以二女、九男，历试诸难，而后受终于文祖。我诛四凶而举元恺，分职任事，晚年荐禹于天，陟方而终。
  source_urls:
  - 钦定四库全书·史记疑问卷上·五帝纪
