- id: guji-苏秦-event-xuexi
  date: -330
  year_of: -330
  type: endeavor
  title_zh: 锥刺股发愤读书
  description: 苏秦游说秦惠王失败、归家受家人冷遇，于是闭门读太公阴符之谋，读书欲睡时引锥自刺其股，血流至足。
- id: guji-苏秦-event-shuoyan
  date: -314
  year_of: -314
  type: endeavor
  title_zh: 说燕文侯合纵
  description: 苏秦游说燕文侯，陈说燕国恃赵之利，燕文侯大悦，资以车马金帛，使说赵。
- id: guji-苏秦-event-liuyin
  date: -288
  year_of: -288
  type: endeavor
  title_zh: 身佩六国相印
  description: 苏秦先后说 韩、魏、齐、楚诸国，约纵成功，为纵约长，并相六国，秦兵不敢东向函谷关十五年。
- id: guji-苏秦-event-death
  date: -284
  year_of: -284
  type: death
  title_zh: 死于齐国
  description: 苏秦为燕反间于齐，齐大夫与之争宠使人刺之，苏秦临死献计诛刺客，齐以车裂之法捕得凶手，苏秦身亡。
