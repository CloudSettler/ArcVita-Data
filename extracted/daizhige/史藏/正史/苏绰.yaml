  reign_ref: 西魏文帝大统年间
  archetype: 制度创制之能臣
  dilemmas:
  - 在战乱动荡中草创新制，法令繁严与宽政惠民之间须权衡
  - 辅佐权臣宇文泰制定典章，忠勤任事而鞠躬尽瘁
  lesson: 循名责实、损益古制以适时用，方能于乱世中奠定制度之本
  summary_first_person: 我苏绰在西魏文帝大统年间任尚书，奉命将太祖前后所上二十四条及十二条新制损益裁定，总为五卷颁行天下，成为中兴永式；又与卢辩依《周礼》改制，创六官之典，为宇文周官制之基，惜乎积劳早逝。
  source_urls:
  - https://zh.wikisource.org/wiki/周書/卷02_帝紀第二
