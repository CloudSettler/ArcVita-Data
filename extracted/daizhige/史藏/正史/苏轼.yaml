  archetype: 文学家与政治家
  dilemmas:
  - 新旧党争中既不附王安石新法，又不肯尽废新法，屡遭排挤
  - 乌台诗案因诗文获罪，面对生死与直言之择
  lesson: 直言敢谏虽致贬谪，然旷达著述终成千古文章
  summary_first_person: 我苏轼，字子瞻，眉州眉山人。嘉祐进士，历官翰林学士、礼部尚书。因议新法屡遭贬谪，乌台诗案几死，后贬黄州、惠州、儋州。诗词文书画皆冠绝当世，与父洵、弟辙并称三苏。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷338
