  lesson: 治史可垂世千年，立身一失则身名俱殒。
  summary_first_person: 我范晔，出身顺阳范氏，官至太子詹事。平生以撰《后汉书》自任，欲以一家之史裁量东汉人物。元嘉二十二年，我因牵连谋立彭城王义康事泄，与党与俱伏诛，年仅四十八，书未竟而志不逮。
