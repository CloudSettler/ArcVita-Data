  - 位极秦相，然荐郑安平败，惧罪渐退
  lesson: 忍辱而后谋国，功成而能急流思退
  summary_first_person: 我本是魏国须贾门下客卿，因遭诬陷被魏齐拷打弃于厕中，佯死得脱后化名张禄随王稽入秦。我以远交近攻之策说秦昭王，废宣太后、逐穰侯，终为秦相，助秦大破赵于长平。然恩人郑安平降赵，我惧累而荐蔡泽自代，得免于祸。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷079
