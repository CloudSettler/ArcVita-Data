  lesson: 议人之短须有据，直言易结怨而不足取誉
  summary_first_person: 我是南朝齐尚书郎范缜。谢朓拜吏部郎时谦让过甚，我当面嘲他说：以你的才资本无愧于吏部之选，可惜治家无法、仪刑寡妻有所不足。谢朓闻言有愧色。此事载于其传。
