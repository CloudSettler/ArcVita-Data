person:
  qid: guji-范蠡
  name_zh: 范蠡
  names:
    zh: 范蠡
    en: Fan Li
  lifespan:
    birth:
      date: -506
      precision: decade
      is_circa: true
      raw: 春秋末期，约楚宛三户人，生年不详
    death:
      date: -0448
      precision: decade
      is_circa: true
      raw: 卒老死于陶
  birth_date: -506
  death_date: -0448
  era: 春秋末期
  reign_ref: 越王句践在位期间
  archetype: 功成身退的智谋家与经商致富的传奇人物
  dilemmas:
  - 功高震主：灭吴之后深知"大名之下难以久居"，在共患难与共安乐之间选择离越而去
  - 居于齐国为相受尊名，恐"久受尊名不祥"，毅然归印散财以免祸
  - 营救中男于楚:遣长子与遣少子的两难抉择，终因长子惜财而致弟被杀
  lesson: 功成、名遂、身退；知进退、明盈虚，见好即收方能名垂后世
  summary_first_person: 我是范蠡，事越王句践二十余年，苦身戮力，深谋灭吴，报会稽之耻，使句践称霸。功成之后，我知句践可与同患难、难与处安，遂辞官泛海去齐，变名鸱夷子皮，耕于海畔致富数十万；齐人以为相，我叹久受尊名不祥，又归相印散财。后止于陶，自谓陶朱公，逐什一之利，赀累巨万，天下称之。三徙成名，卒老死于陶。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷041
endeavors:
- id: guji-范蠡-endeavor-1
  name_zh: 佐越灭吴，报会稽之耻
  labels:
