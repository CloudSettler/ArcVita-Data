      zh: 求和、质吴
    start_date: -0492
    highlight_event_id: guji-范蠡-event-zhiri
  - key: climax
    name_zh: 乘吴弊伐吴，栖吴王于姑苏
    labels:
      zh: 伐吴、围姑苏
    start_date: -0478
    highlight_event_id: guji-范蠡-event-poWu
  - key: closure
    name_zh: 称霸徐州，功成身退
    labels:
      zh: 称霸、辞官
    start_date: -0468
    highlight_event_id: guji-范蠡-event-cizheng
  decisions:
  - date: -0494
    title_zh: 谏阻句践先发伐吴
    rationale: 兵者凶器，战者逆德；阴谋逆德，好用凶器，行者不利
  - date: -0492
    title_zh: 建议卑辞厚礼与吴成和，并自请为质于吴
    rationale: 持满者与天，定倾者与人；不许，则身与之市
  - date: -0478
    title_zh: 判断"可矣"，劝句践发兵伐吴
    rationale: 吴已杀子胥，导谀者众，吴王北会黄池，精兵尽从，国内空虚
  - date: -315
    title_zh: 会稽quoted劝句践拒绝吴王求成，鼓进兵灭吴
    rationale: 天与弗取，反受其咎；谋之二十二年，一旦弃之可乎
  - date: -0468
    title_zh: 灭吴后辞别句践，浮海出齐
    rationale: 大名之下难以久居；句践可与同患难，难与处安
- id: guji-范蠡-endeavor-2
  name_zh: 变名更姓，耕于海、商于陶，三致千金
  labels:
    zh: 经商、治产
  phases:
  - key: brewing
    name_zh: 浮海出齐，耕于海畔
    labels:
      zh: 变名、治产
    start_date: -0468
    highlight_event_id: guji-范蠡-event-fuHai
  - key: breakthrough
    name_zh: 为齐相，归印散财
    labels:
      zh: 齐相、散财
    start_date: -304
    highlight_event_id: guji-范蠡-event-guiXiang
  - key: climax
    name_zh: 止于陶，称陶朱公，赀累巨万
    labels:
      zh: 陶朱公、逐什一之利
    start_date: -302
    highlight_event_id: guji-范蠡-event-zhiTao
  - key: closure
    name_zh: 中男囚楚，营救不成，笑论事理
    labels:
      zh: 营救中男
    start_date: -0448
    highlight_event_id: guji-范蠡-event-zhongNan
  decisions:
  - date: -0468
    title_zh: 变姓名为鸱夷子皮，耕于海畔
    rationale: 大名之下难以久居，且句践难与处安
  - date: -304
    title_zh: 归齐相印，尽散其财与知友乡党
    rationale: 居家致千金、居官至卿相，此布衣之极也；久受尊名，不祥
  - date: -302
    title_zh: 止于陶，自谓陶朱公
    rationale: 陶为天下之中，交易有无之路通，为生可以致富
  - date: -0448
    title_zh: 遣长子携千金赴楚营救中男
    rationale: 千金之子不死于市；然长男惜财不知舍，终致弟被杀，事之理也，无足悲
