person:
  qid: guji-fanju
  name_zh: 范雎
  names:
    zh: 范雎、张禄、应侯、范叔
    en: Fan Ju
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详，魏国人
    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详，约秦昭王末年
  birth_date: ''
  death_date: ''
  era: 战国
  reign_ref: 秦昭王
  archetype: 纵横辩士
  dilemmas:
  - 遭须贾诬陷、魏齐笞辱，佯死脱身后化名张禄入秦，恩怨分明的抉择
  - 说昭王废太后逐穰侯，收秦王之权，需冒身死之险
  - 韩魏之交、远交近攻的战略权衡
  - 于己有恩的王稽、郑安平任用之私与官场公义之两难
  lesson: 一饭之德必偿，睚眦之怨必报；当言则言，虽死不避
  summary_first_person: 我本魏国寒士，因出使齐国受赏而遭须贾诬陷、魏齐毒打，佯死得脱。由王稽、郑安平之助入秦，化名张禄游说昭王，献远交近攻之策，又说秦王亲政、废太后逐四贵，终拜相封应侯。得志之日，须贾
    subsequenter 使秦，我宴而辱之；魏齐亡走，我坚持必报其仇。散家财报穷厄，一饭之恩亦必偿。
