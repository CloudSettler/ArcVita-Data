person:
  qid: guji-萧承之
  name_zh: 萧承之
  names:
    zh: 萧承之
    en: Xiao Chengzhi
  字: 嗣伯
  lifespan:
    birth:
      date: 0384
      precision: circa
      is_circa: true
      raw: 元嘉二十四年殂，年六十四（逆推）
    death:
      date: '0447'
      precision: year
      is_circa: false
      raw: 元嘉二十四年
  生卒说明: 卒于宋元嘉二十四年（447），年六十四
  birth_date: 0384
  death_date: '0447'
  era: 东晋末—刘宋
  reign_ref: 宋文帝元嘉年间
  archetype: 军政方略家
  dilemmas:
  - 兵少城危之际，示弱必被屠，示强恐是空城，如何以疑兵退敌
  - 治民与武干之间权衡，授兖州刺史之命因无权贵奥援而寝
  - 彭城王义康秉政，不肯依附而仕途受抑
  lesson: 处绝境不敢示弱，治民直道不阿权贵，忠果奋勇，功成而位不尽显，身后为基业张本。
  summary_first_person: 我是萧承之，字嗣伯。少有大志，才力过人，历建威参军、济南太守。北虏犯济南，我以数百人拒战，更偃兵开城门，示强惑敌，虏疑有伏而退。汉中氐乱，我轻军破黄金山，破薛健、赵温，断槊捶犀甲之贼，连战皆捷，梁州平定。文帝欲授青州而不果。元嘉二十四年卒，后追赠金紫光禄大夫，子道成代齐而兴。
  source_urls:
  - https://zh.wikisource.org/wiki/南齊書/卷1
  追赠: 宋升明二年九月赠太常；升明二年赠散骑常侍、金紫光禄大夫
