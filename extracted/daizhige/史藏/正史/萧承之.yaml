    labels:
      zh: 龙骧将军
    start_date: '0434'
    highlight_event_id: guji-萧承之-event-pingliang
  decisions:
  - date: '0434'
    title_zh: 轻军先行攻黄金山
    rationale: 控张鲁旧戍之险固，先据要地以制敌。
  - date: '0434'
    title_zh: 命军中断槊以大斧捶之
    rationale: 贼皆衣犀甲刀箭不能伤，以钝击破甲陷阵。
