  decisions:
  - date: '0431'
    title_zh: 偃兵开城门示强拒虏
    rationale: 今日悬守穷城，若复示弱必为所屠，惟当见强待之；虏疑有伏兵遂引去。
  - date: '0432'
    title_zh: 固谏萧思话勿弃镇
    rationale: 青州刺史欲委镇保险，承之固谏不从，思话果失据溃走。
