  death_date: -47
  era: 西汉
  reign_ref: 汉宣帝、汉元帝
  archetype: 刚直儒臣
  dilemmas:
  - 守节不辱与出仕就禄之间的义利之辨
  - 直言进谏与保全自身之间的两难
  lesson: 义利明辨、守大节者虽得直名，亦易罹谗毁之祸
  summary_first_person: 我是东海钜儒萧望之，治经修身，不愿以抱关之禄放弃素履；宣帝闻名对策，一岁三迁。我本雅意在朝，辞平原刺史，又移病不肯屈就，虽不言要君，人未必信。恭、显当权，薰莸同器不相合，我子萧伋上书诉冤，反招谗毁，灾祸无妄延缘，实亦自取。我慷慨饮药而终，足以砥砺懦鄙。
  source_urls:
  - https://zh.wikisource.org/wiki/御製讀蕭望之傳
