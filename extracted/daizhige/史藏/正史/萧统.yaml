  lesson: 蓄书辑文，以不朽之业传世，不以寿数论成败
  summary_first_person: 我是梁武帝长子萧统，世称昭明太子。生而聪慧，三岁受《孝经》，长而遍读群书。天监元年立为皇太子，仁孝谦谨，_bits簿不盈。惜三十一岁因病早逝，未及登基。我召集刘孝绰、徐陵等文士，编纂《文选》三十卷，又辑《陶渊明集》、作《文选序》，为后世文章之学的津梁。
  source_urls:
  - https://zh.wikisource.org/wiki/梁書/卷8
