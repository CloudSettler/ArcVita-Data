person:
  qid: guji-萧绰
  name_zh: 萧绰
  names:
    zh: 萧绰
    en: Xiao Chuo
  lifespan:
    birth:
      date: 953
      precision: year
      is_circa: false
      raw: 辽景宗保宁先前，约公元953年生
    death:
      date: 1009-12-29
  birth_date: 953
  death_date: 1009
  era: 辽代
  reign_ref: 辽景宗、辽圣宗时期摄政
  archetype: 摄政太后
  dilemmas:
  - 主少国疑，母寡子弱而外有宋师压境
  - 汉法与契丹旧制之间的治国取舍
  - 归政与恋权之间的抉择
  lesson: 柔肩担社稷，是一位将个人情感置于国运之后的杰出女政治家
  summary_first_person: 我是萧绰，契丹萧氏之女，小字燕燕。景宗体弱，我预闻军国大政；景宗崩后，我以太后之尊称制，与韩德让等共辅幼子圣宗，视朝决政。我先后令宋军两度南征受挫，缔成澶渊之盟，使宋辽弭兵百年。及圣宗冠而政成，我归于上京，未几而逝，谥圣神宣献皇后。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷13
  - https://zh.wikisource.org/wiki/遼史/卷14
endeavors:
- id: guji-萧绰-endeavor-1
  key: brewing
  name_zh: 入宫预政
  labels:
    zh: 后妃与预闻国政
  start_date: 969
  highlight_event_id: guji-萧绰-event-crown-empress
  decisions:
  - date: 969
    title_zh: 册立为皇后
    rationale: 萧思温之女入景宗宫闱，以显赫后族背景成为政治联盟核心
- id: guji-萧绰-endeavor-2
  key: breakthrough
  name_zh: 摄政称制
  labels:
    zh: 临朝称制·改革内政
  start_date: 982-10
  highlight_event_id: guji-萧绰-event-regency
  decisions:
  - date: 982-10
    title_zh: 以太后称制，总揽军国
    rationale: 圣宗年方十二，主少国疑，唯有太后称制可稳定辽廷
  - date: 983
    title_zh: 开放集贤，任用汉臣耶律斜轸、韩德让
    rationale: 借汉法理汉地、科举取士，缓和蕃汉矛盾，强化中央集权
- id: guji-萧绰-endeavor-3
  key: climax
  name_zh: 御宋签盟
  labels:
    zh: 南御北宋·澶渊之盟
  start_date: 1004
  highlight_event_id: guji-萧绰-event-chanyuan
  decisions:
  - date: 1004
    title_zh: 与圣宗亲率大军南征
    rationale: 以攻为守，借军事压力与北宋谈判，争取岁币与和平
- id: guji-萧绰-endeavor-4
  key: closure
  name_zh: 归政于帝
  labels:
    zh: 还政权宜
  start_date: 1009
  highlight_event_id: guji-萧绰-event-retire
  decisions:
  - date: 1009
    title_zh: 归政圣宗
    rationale: 圣宗已冠而能政，主动还政以定国本
events:
- id: guji-萧绰-event-birth
  date: 953
  year_of: 953
  type: birth
  title_zh: 生于辽代显赫后族萧氏，小字燕燕
  description: 萧绰为北府宰相萧思温之女，聪慧过人，早为父所重
- id: guji-萧绰-event-crown-empress
  date: 969
  year_of: 969
  type: endeavor_event
  title_zh: 册立为景宗皇后
  description: 辽景宗即位后纳萧绰为后，景宗多病，谕后预闻军国事，'刑赏政事，用汉人与否，后参与之'
- id: guji-萧绰-event-regency
  date: 982-10
  year_of: 982
  type: endeavor_event
  title_zh: 景宗驾崩，以皇太后称制辅立十二岁圣宗
  description: 景宗崩于焦山，萧绰临朝称制，重用韩德让、耶律斜轸、耶律休哥等，稳定政局，推行科举、整饬吏治、劝课农桑
- id: guji-萧绰-event-war-song
  date: 1004
  year_of: 1004
  type: endeavor_event
  title_zh: 亲率契丹大军南征北宋
  description: 太后与圣宗亲统二十万大军深入宋境，宋真宗亲征相持于澶州，形势胶着促成了和议
- id: guji-萧绰-event-chanyuan
  date: 1005-01
  year_of: 1005
  type: endeavor_event
  title_zh: 缔结澶渊之盟
  description: 宋辽约为兄弟之国，宋岁输银十万两、绢二十万匹，两国此后百余年无大规模战事
- id: guji-萧绰-event-retire
  date: 1009
  year_of: 1009
  type: endeavor_event
  title_zh: 归政圣宗
  description: 萧绰将全部权力交还圣宗，不再称制，未几病逝
- id: guji-萧绰-event-death
  date: 1009-12-29
  year_of: 1009
  type: death
  title_zh: 病逝，谥圣神宣献皇后
  description: 归政后不久于行宫病逝，后改谥'睿智皇后'，圣宗哀恸，追念母后之政
