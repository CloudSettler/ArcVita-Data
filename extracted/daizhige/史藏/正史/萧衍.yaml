person:
  qid: guji-萧衍
  name_zh: 萧衍
  names:
    zh: 萧衍
    en: Xiao Yan
  lifespan:
    birth:
      date: '464'
      precision: year
      is_circa: false
      raw: 宋孝武大明八年甲辰岁
    death:
      raw: ''
  birth_date: '464'
  era: 南朝齐、梁之际
  reign_ref: 梁武帝（天监至太清年间在位）
  archetype: 开国雄主与佛教护法
  dilemmas:
  - 起兵代齐之忠义两难：以雍州之兵讨昏主，与宗室懿兄劝阻之抉择
  - 郢州围城之持久与速决：拒绝并军分兵与向北魏求援之下策
  - 拥南康王为帝而自掌兵权：不为他人所使的权柄抉择
  lesson: 攻心为上、攻城次之；把握时机则天下可卧取
  summary_first_person: 我萧衍，字叔达，生有异相，博学多才。起家王府参军，历佐ilitary，镇守雍州。见齐室昏乱，遂举义兵，以攻心之策定荆州、破郢城、下建康，终受禅建立梁朝，成一代开国之业。
  source_urls:
  - 梁書·本紀第一·武帝上
