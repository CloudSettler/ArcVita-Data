    title_zh: 请为先启攻贤首山
    rationale: 众畏魏军不敢前，我请精兵夜进，出不意以破围
  - date: '497'
    title_zh: 邓城败后结阵断后
    rationale: 慧景欲退而不能止，我独率众拒战以保全师
- id: guji-萧衍-endeavor-2
  name_zh: 举义伐齐
  phases:
  - key: brewing
    name_zh: 兄被害密谋起兵
    labels:
      zh:
      - 檀溪造舟
