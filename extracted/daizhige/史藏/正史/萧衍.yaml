    labels:
      zh:
      - 建牙襄阳
      - 传檄京邑
    start_date: '500'
    highlight_event_id: guji-萧衍-event-7
  - key: climax
    name_zh: 汉口郢城大战
    labels:
      zh:
      - 破张冲
      - 袭加湖
    start_date: '501'
    highlight_event_id: guji-萧衍-event-8
  - key: closure
    name_zh: 下建康受众拥立
    labels:
      zh:
      - 斩东昏
      - 大司马录尚书
    start_date: '501'
    highlight_event_id: guji-萧衍-event-9
  decisions:
  - date: '500'
    title_zh: 以两封空函离间刘山阳与萧颖胄
    rationale: 攻心为上，使人人生疑，则不战而定一州
  - date: '501'
    title_zh: 拒迎南康王都襄阳待正尊号
    rationale: 若置帝于人手则为人所使；功业若建，号令天下谁敢不从
  - date: '501'
    title_zh: 拒并军围郢与求援北魏之议
    rationale: 分兵则粮运阻断首尾俱弱；北面请敌徒示弱而贻丑声
  - date: '501'
    title_zh: 夜袭加湖破吴子阳
    rationale: 乘水暴长顺风齐进，一战而郢鲁夺气
events:
- id: guji-萧衍-event-birth
  date: '464'
  year_of: 464
  type: birth
  name_zh: 生于秣陵县同夏里三桥宅
  note_zh: 两胯骈骨，顶上隆起，右手有文曰武
- id: guji-萧衍-event-1
  date: '477'
  year_of: 477
  type: career
  name_zh: 起家巴陵王南中郎法曹行参军
  note_zh: 迁卫将军王俭东阁祭酒，俭深相器异
- id: guji-萧衍-event-2
  date: '487'
  year_of: 487
  type: career
  name_zh: 与沈约等游竟陵王西邸，号曰八友
  note_zh: 王融谓宰制天下必在此人
- id: guji-萧衍-event-3
  date: '495'
  year_of: 495
  type: military
  name_zh: 义阳之役夜上贤首山破魏军
  note_zh: 以冠军将军、军主隶王广为援，魏军表里受敌而退
- id: guji-萧衍-event-4
  date: '497'
  year_of: 497
  type: military
  name_zh: 邓城之战独帅众断后全师而归
  note_zh: 崔慧景狼狈自拔，高祖杀数十百人得下船
- id: guji-萧衍-event-5
  date: '498'
  year_of: 498
  type: appointment
  name_zh: 授雍州刺史，出镇襄阳
  note_zh: 都督雍梁南北秦四州诸军事，谓雍州乃避祸万全之地
- id: guji-萧衍-event-6
  date: '500'
  year_of: 500
  type: decision
  name_zh: 长兄萧懿被害，密谋举义
  note_zh: 召王茂、吕僧珍等定策，沉檀溪竹木密为舟备
- id: guji-萧衍-event-7
  date: '500'
  year_of: 500
  type: military
  name_zh: 建牙襄阳，以空函之计定荆州斩刘山阳
  note_zh: 驰两空函定一州，萧颖胄伏甲斩山阳
- id: guji-萧衍-event-8
  date: '501'
  year_of: 501
  type: military
  name_zh: 二月发襄阳，汉口破张冲，七月夜袭加湖
  note_zh: 郢鲁二城相视夺气，相继请降
- id: guji-萧衍-event-9
  date: 501-12
  year_of: 501
  type: political
  name_zh: 兵入建康，张稷王珍国斩东昏
  note_zh: 授中书监大司马录尚书事，封建安郡公
- id: guji-萧衍-event-death
  date: '549'
  year_of: 549
  type: death
  name_zh: 卒于台城
  note_zh: 在位四十八年，庙号高祖，谥武皇帝
