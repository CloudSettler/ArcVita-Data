  archetype: restrained_ally
  dilemmas:
  - 身居高职而额外供给皆取于民，是否奏罢以纾民困
  - 作为奚族将领效力于辽廷伐宋战事
  lesson: 祛除额外征敛，体恤部民；临战为先锋而功成不居。
  summary_first_person: 我是萧观音奴，字耶宁，奚王搭纥之孙。统和十二年任右祗候郎君班详稳，后迁奚六部大王。此前官吏在俸秩之外还向百姓索取獐鹿百数，我上奏罢除了这项弊政。伐宋时我与萧挞凛同为先锋，降祈州，下德清军，得到朝廷优赏。后任同知南院事，卒于任上。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷85
