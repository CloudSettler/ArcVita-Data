events:
- id: guji-董宣-event-fuke
  date: '27'
  year_of: 27
  type: 起任
  title_zh: 出任洛阳令
  description: 建武年间董宣任职洛阳令，司职京畿法纪。
- id: guji-董宣-event-jiuju
  date: '30'
  year_of: 30
  type: 纠案
  title_zh: 举纠湖阳公主
  description: 湖阳公主奴杀人西市而与主共舆、出入宫省，董宣举纠其罪，不回避贵戚。
- id: guji-董宣-event-geshi
  date: '30'
  year_of: 30
  type: 执法
  title_zh: 直道讨奸，干犯主怒
  description: 董宣直道不顾，干主讨奸，光武初怒召而欲加棰刑。
- id: guji-董宣-event-mianyou
  date: '30'
  year_of: 30
  type: 昭雪
  title_zh: 蒙宥获赦，京城侧目
  description: 董宣受怒之初，京师侧耳；及其蒙宥，天下拭目，刚正之名大著。
- id: guji-董宣-event-caimao
  date: '31'
  year_of: 31
  type: 声援
  title_zh: 蔡茂上书赞其刚正
  description: 司徒蔡茂喜宣刚正，上书请使执平之吏永申其用，光武纳之，朝廷始禁制贵戚。
