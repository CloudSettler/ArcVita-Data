person:
  qid: guji-董宣
  name_zh: 董宣
  names:
    zh: 董宣
    en: Dong Xuan
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
  birth_date: ''
  death_date: ''
  era: 东汉初（光武帝建武年间）
  reign_ref: 汉光武帝
  archetype: 执法刚直的强项令
  dilemmas:
  - 直绳纠主则忤逆皇威与湖阳公主，退让才保身
  - 坚持律法惩办公主之奴，须以身家性命相抵
  lesson: 宁死不向权贵曲法，直道而行终得昭雪
  summary_first_person: 我董宣任洛阳令时，湖阳公主的奴仆在西市杀人，我跟公主同车出入，仍当街叱奴下车格杀。陛下大怒欲棰杀我，我以头击楹，死不肯谢罪，陛下终赦免并赏我，“强项令”之名由此而来。后来蔡茂上书称许我刚正，朝廷因此渐禁贵戚横行。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷26
