person:
  qid: guji-蒙恬
  name_zh: 蒙恬
  names:
    zh: 蒙恬
    en: Meng Tian
  lifespan:
    birth:
      date: -250
      precision: year
      is_circa: true
      raw: 生年不详，约秦庄襄王年间
    death:
      date: -210
      precision: year
      is_circa: false
      raw: 秦始皇三十七年（前210年），被赐死于阳周
  birth_date: -250
  death_date: -210
  era: 秦
  reign_ref: 秦始皇（嬴政）
  archetype: 忠信武将
  dilemmas:
  - 修万里长城与驰道劳民而功在社稷，功过难以自明
  - 拥兵三十万守边，扶苏被赐死之际，明知有诈却须在忠君与守义之间抉择
  lesson: 忠信而不察上意之诈，地脉之说难逃杀身之祸；谨守臣节终致冤死，令人叹惋。
  summary_first_person: 我蒙恬本是齐国人，先世自祖父蒙骜起三代仕秦为将。我因家世得信于秦，率军攻齐大败齐军，拜为内史。秦国统一天下后，我奉命率三十万之众北逐戎狄，收复河南之地，修筑长城，起临洮至辽东，延袤万余里，又渡河据阳山，往来北方十余年，威震匈奴。秦始皇甚尊宠我，信重我弟蒙毅。我还奉命修直道，自九原至甘泉，堑山堙谷千八百里，然道未成。始皇三十七年，始皇崩于沙丘，赵高、李斯、胡亥矫诏赐扶苏与我一死。扶苏自杀，我疑诏有诈，请复诉，被囚于阳周。胡亥即位后，赵高进谗，终使我吞药自杀。我自言筑长城绝地脉，或因此得罪于天，然我之忠，天地可鉴。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷088
