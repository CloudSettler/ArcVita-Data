      raw: 战国末期
  era: 战国末期
  archetype: 战国纵横说客、审时知止的功成身退者
  dilemmas:
  - 说客以口取相，得势易、保身难
  - 功名之进与全身之退的抉择
  lesson: 知止全身，功成急退者得数十；贪恋权位者鲜有善终
  summary_first_person: 闻应侯得两帝王之师而不解，遂西入秦，以雄谈数范雎盛极思退，说之而代为秦相，然为相数月即谢病归，以知止全身免于倾覆之祸。
endeavors:
- id: guji-蔡泽-endeavor-1
  name_zh: 西游说秦、代范雎为相
  desc: 以游说之士入秦，以知止之论说服应侯范雎退位，遂继任秦相。
  phases:
  - key: brewing
    name_zh: 持粱刺齿肥之志
    labels:
      zh: 有志游说
  - key: breakthrough
    name_zh: 雄谈悟应侯
    labels:
      zh: 说范雎
    highlight_event_id: guji-蔡泽-event-说服范雎
  - key: climax
    name_zh: 拜相代秦
    labels:
      zh: 为秦相
    highlight_event_id: guji-蔡泽-event-代相
  - key: closure
    name_zh: 数月而退
    labels:
      zh: 知止得归
    highlight_event_id: guji-蔡泽-event-罢相
  decisions:
  - title_zh: 西行入秦说应侯
    rationale: 范雎虽势力显极，然久居相位必有危殆，泽以知止全身之说取而代之
  - title_zh: 为相数月即退
    rationale: 知权位不可久恃，全身而退，异于势利之徒
