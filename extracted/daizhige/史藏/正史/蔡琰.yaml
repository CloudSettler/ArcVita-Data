person:
  qid: guji-蔡琰
  name_zh: 蔡琰
  names:
    zh: 蔡琰、蔡文姬、昭姬
    en: Cai Yan (Cai Wenji)
  lifespan:
    birth:
      date: '162'
      precision: year
      is_circa: true
      raw: 约东汉延熹年间
    death:
      date: '239'
      precision: year
      is_circa: true
      raw: 约汉末魏初
  birth_date: 约162年
  death_date: 约239年
  era: 东汉末年至曹魏初
  reign_ref: 汉献帝、魏文帝
  archetype: 乱世才女
  dilemmas:
  - 没入匈奴十二年，归汉则须抛别二子
  - 为报故人曹操之请，忆写亡父遗籍四百余篇
  lesson: 乱世之中，才情与母爱皆成两难，然坚韧可践冰涉雪而不陨其志
  summary_first_person: 我乃蔡邕之女蔡琰，博学有才辩，妙于音律。值天下丧乱，为董卓乱兵所虏，流转没入南匈奴十二年，生二子。曹操素与先父交好，痛其无嗣，遣使者以金璧赎我归汉。我别子归乡，肝肠如裂，然念亡父遗业，凭记忆缮写其书四百余篇，文字无所遗失，以续先人之文脉。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷84
endeavors:
- id: guji-蔡琰-endeavor-1
  key_fork_label: 回汉忆书
  title_zh: 归汉续父遗文
  summary_zh: 被赎归汉后，凭记忆缮写亡父蔡邕藏书四百余篇，文无遗漏，为存续汉儒文献尽其力。
  start_date: '207'
  phases:
  - key: brewing
    name_zh: 被掳没胡
    labels:
      zh: 兴平之乱没入匈奴
    start_date: '195'
    highlight_event_id: guji-蔡琰-event-capture
  - key: breakthrough
    name_zh: 金璧赎归
    labels:
      zh: 曹操遣使赎还
    start_date: '207'
    highlight_event_id: guji-蔡琰-event-ransom
  - key: climax
    name_zh: 忆写遗籍
    labels:
      zh: 缮书四百余篇
    start_date: '208'
    highlight_event_id: guji-蔡琰-event-books
  - key: closure
    name_zh: 再嫁董祀
    labels:
      zh: 后嫁屯田都尉董祀
    start_date: '209'
  decisions:
  - date: '207'
    title_zh: 应曹操之赎，别子归汉
    rationale: 故人曹公遣使以金璧相请，念先父无嗣、遗文可续，遂忍痛归国。
  - date: '208'
    title_zh: 乞免夫罪并忆写书籍
    rationale: 夫董祀当死，蓬首发跣诣曹公求情，音旨清哀，得免；又答操以家藏散尽，愿凭记忆缮写。
events:
- id: guji-蔡琰-event-birth
  date: '162'
  year_of: '162'
  type: birth
  title: 蔡琰生于陈留圉县
  description: 蔡邕之女，生于儒学世家，少博学有才辩，妙工音律。
- id: guji-蔡琰-event-capture
  date: '195'
  year_of: '195'
  type: exile
  title: 兴平年间为胡骑所掳，没入南匈奴
  description: 天下丧乱，文姬为董卓乱军所虏，流转至南匈奴左贤王处，居十二年，生二子。
- id: guji-蔡琰-event-ransom
  date: '207'
  year_of: '207'
  type: achievement
  title: 曹操遣使者以金璧赎蔡琰归汉
  description: 曹操素与蔡邕善，痛其无嗣，乃遣使者以金璧赎之，重嫁屯田都尉董祀。
- id: guji-蔡琰-event-books
  date: '208'
  year_of: '208'
  type: achievement
  title: 忆写亡父遗书四百余篇
  description: 曹操问及妻家书籍，文姬答以焚毁散佚，然凭记忆者四百余篇，乞给纸笔，缮写送之，文无遗漏。
- id: guji-蔡琰-event-plead
  date: '209'
  year_of: '209'
  type: achievement
  title: 蓬首徒行求免董祀死罪
  description: 董祀犯法当死，琰诣曹操请罪，音旨清哀，词情酸感，宾客动容，操乃赦其夫。
- id: guji-蔡琰-event-death
  date: '239'
  year_of: '239'
  type: death
  title: 蔡琰卒
  description: 晚年感伤乱离，追怀悲愤，作《悲愤诗》二首；卒年不详，约汉末魏初。
