  dilemmas:
  - 五代朝代更迭频繁、诸臣历事数朝，断代立传难以褒贬分明，史体不易安排
  lesson: 以官修之力囊括乱世本末，虽文笔不及欧史谨严，而叙事详核、是非不诡于正，足为后世鉴观之资
  summary_first_person: 我薛居正于宋开宝年间奉诏监修五代史，与卢多逊、扈蒙、李昉等同修，断代为书如陈寿三国志之体，成书一百五十卷，时称旧五代史，司马光通鉴多采用之。后因金泰和间专用欧阳修新史，我书渐就湮没，赖四库馆臣自永乐大典中搜辑复完。
  source_urls:
  - https://zh.wikipedia.org/wiki/薛居正
