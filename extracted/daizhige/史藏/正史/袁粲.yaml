person:
  qid: guji-袁粲
  name_zh: 袁粲
  names:
    zh: 袁粲
  era: 南朝宋（刘宋）
  reign_ref: 宋明帝泰始至泰豫年间（465-472）、后废帝元徽年间（473-477）
  archetype: 顾命辅政大臣
  dilemmas:
  - 受明帝顾命辅佐幼主，面对宗室相残与权臣崛起，夹在忠诚与自保之间
  - 泰始、泰豫之际朝政苛暴、府藏空竭，身为尚书省长官难挽颓势
  lesson: 居枢要而逢末世，位愈尊而局愈危
  summary_first_person: 我是袁粲，历仕宋明帝朝，由太子詹事累迁至尚书令，并受顾命与褚渊等共辅幼主后废帝，然而当此宋室衰微之际，辅政之任实为重负。
