events:
- id: guji-袁粲-event-puye
  date: 467-06-15
  year_of: 467
  title_zh: 以太子詹事袁粲为尚书仆射
  detail: 泰始三年五月壬戌，太子詹事袁粲拜尚书仆射，进入中枢。
- id: guji-袁粲-event-youpuye
  date: 470-07-01
  year_of: 470
  title_zh: 转尚书右仆射
  detail: 泰始六年六月癸卯，以尚书仆射袁粲为尚书右仆射，王景文为尚书左仆射。
- id: guji-袁粲-event-ling
  date: 471-06-20
  year_of: 471
  title_zh: 迁尚书令
  detail: 泰始七年五月庚午，以尚书右仆射袁粲为尚书令，成为尚书省长官。
- id: guji-袁粲-event-guming
  date: 472-05-10
  year_of: 472
  title_zh: 受明帝顾命
  detail: 泰豫元年四月己亥明帝大渐，袁粲与褚渊、刘勔、蔡兴宗、沈攸之同被顾命，是日帝崩。
- id: guji-袁粲-event-fuzheng
  date: 472-05-11
  year_of: 472
  title_zh: 与褚渊共辅后废帝朝政
  detail: 后废帝即位，尚书令袁粲、护军将军褚渊共辅朝政。
