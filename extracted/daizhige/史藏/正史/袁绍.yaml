  dilemmas:
  - 坐拥河北最强实力,却在官渡一役败于曹操,一失足而成千古恨
  - 生前未定嗣子,致谭、尚相争,基业顷刻覆灭
  lesson: 势盛而寡断,才多而决少,纵有四世三公之资,亦难全其功业
  summary_first_person: 吾袁本初,出汝南袁氏,四世三公,门生故吏遍天下。昔讨董卓、夺冀州、平青幽并,雄踞河北,天下莫此为盛。惜乎官渡一败,未及再振而病卒,诸子相争,基业遂为曹氏所并。
  source_urls:
  - https://zh.wikisource.org/wiki/三國志/卷06
