  - 以利啖诱西域诸蕃入朝，致州郡疲于送迎、糜费万万，功业与民弊两难
  lesson: 通西域、撰图记，开边通商之功与劳民糜费之弊并存于一身
  summary_first_person: 我裴矩奉炀帝之命往张掖监诸商胡互市，以利啖之，劝令入朝，自此西域诸蕃往来相继；我采其山川风俗撰为图记以述西域之道里，然所经州郡疲于送迎、糜费以万万计，通远之功与劳民之责皆在于我。
  source_urls:
  - https://zh.wikipedia.org/wiki/裴矩
