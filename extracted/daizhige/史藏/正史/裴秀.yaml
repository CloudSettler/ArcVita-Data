  lesson: 因.file取准测量与比例缩绘，方能传地图之信于后世
  summary_first_person: 我少有才名，仕魏晋两朝，官至司空，总一朝仪制；然我最留名者，乃考订《禹贡》山川、作《禹贡地域图》十八篇，创“制图六体”之分率、准望诸法，为中国传统地图学立规矩。
