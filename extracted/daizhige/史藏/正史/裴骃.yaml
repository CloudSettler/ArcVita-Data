  lesson: 以徐广《音义》为本，广采经传百家，删游辞取要实，未详则阙，集解而不独断
  summary_first_person: 我是裴骃，南朝宋人，字龙驹。我以父亲裴松之之学为家学底色，见《史记》文句不同、真伪舛错，遂以徐广《史记音义》为本，采经传百家并先儒之说，增演成《史记集解》，未详则阙，不敢臆说。
  source_urls:
  - 四库全书·史部·史记索隐提要
  - 史记集解序
