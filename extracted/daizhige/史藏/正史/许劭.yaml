events:
- id: guji-许劭-event-birth
  date: '150'
  year_of: 150
  title_zh: 许劭出生
  description: 许劭，字子将，汝南平舆人，少峻名节，好论人物。
- id: guji-许劭-event-begin-pingjia
  date: '170'
  year_of: 170
  title_zh: 与许靖并修品评之业
  description: 与从兄许靖俱有高名，好共核论乡党人物，每月辄更其品题。
- id: guji-许劭-event-yuedan
  date: '180'
  year_of: 180
  title_zh: 月旦评名动天下
  description: 每月初一更新品评，故汝南俗有“月旦评”之称，士人皆以得其品题为荣。
- id: guji-许劭-event-cao-cao
  date: '190'
  year_of: 190
  title_zh: 评曹操为治世能臣、乱世奸雄
  description: 曹操微时卑辞厚礼求为己品评，许劭为其定“盛世之能臣，乱世之奸雄”之目。
- id: guji-许劭-event-flee
  date: '194'
  year_of: 194
  title_zh: 南渡扬州依刘繇
  description: 中原丧乱，许劭携宗族南渡江东，扬州刺史刘繇礼待之。
- id: guji-许劭-event-death
  date: '195'
  year_of: 195
  title_zh: 许劭去世
  description: 许劭随刘繇至广陵，卒于逃难途中，终年四十六岁。
