  dilemmas:
  - 处于汉末乱世，官职爵禄与避乱保身之间的抉择
  - 品评人物时直言与时局人情之间的权衡
  lesson: 知人之明贵在公允，识势之智在于审时避害。
  summary_first_person: 我许劭，汝南平舆人，以每月初一更新品评当世人物的“月旦评”知名于时，曹操求评而得“治世之能臣，乱世之奸雄”之语。东汉末天下大乱，我携宗族南渡扬州，受扬州刺史刘繇之礼遇，终老于广陵，年四十六。
  source_urls:
  - https://zh.wikipedia.org/wiki/许劭
