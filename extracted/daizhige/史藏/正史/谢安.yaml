events:
- id: guji-谢安-event-birth
  event_type: birth
  date: '0320'
  year_of: 320
  name_zh: 谢安出生
  description: 谢安生于陈郡谢氏，字安石。
- id: guji-谢安-event-yinju
  event_type: endeavor
  date: '0345'
  year_of: 345
  name_zh: 高卧东山
  description: 谢安屡辞征辟，寓居会稽东山，与王羲之、许询等游山水吟咏。
- id: guji-谢安-event-chushan
  event_type: endeavor
  date: '0360'
  year_of: 360
  name_zh: 出山应召
  description: 年逾四十方应桓温之辟，入其幕府，时人谓之"东山再起"。
- id: guji-谢安-event-bingzheng
  event_type: endeavor
  date: '0373'
  year_of: 373
  name_zh: 秉政中枢
  description: 桓温死后，谢安与王彪之共掌朝政，辅佐孝武帝。
- id: guji-谢安-event-beiwu
  event_type: endeavor
  date: '0377'
  year_of: 377
  name_zh: 布防长江
  description: 举侄谢玄为兖州刺史，镇广陵，组建北府兵以御前秦。
- id: guji-谢安-event-feishui
  event_type: endeavor
  date: 0383
  year_of: 383
  name_zh: 淝水大捷
  description: 苻坚大军压境，谢安从容部署，遣弟谢石、侄谢玄迎战，淝水一战大破秦军。
- id: guji-谢安-event-guangling
  event_type: endeavor
  date: 0385
  year_of: 385
  name_zh: 出镇广陵
  description: 遭谗见忌，自请出镇广陵，筑新城以避朝局，同年病卒。
- id: guji-谢安-event-death
  event_type: death
  date: 0385
  year_of: 385
  name_zh: 谢安去世
  description: 太元十年卒于建康，年六十六，追赠太傅。
