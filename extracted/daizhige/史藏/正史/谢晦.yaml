  era: 南朝宋
  reign_ref: 宋武帝、宋少帝时期
  archetype: 佐命权臣
  dilemmas:
  - 受武帝顾命辅政，却主导废立，忠于社稷与擅权之间的抉择
  - 武帝遗言预判「若有同异，必此人也」，未尽信亦未尽防
  lesson: 参与废立者常为废立所累，机变之才须以忠谨慎守之
  summary_first_person: 我谢晦历仕宋廷，以右卫将军迁中领军，武帝临终与徐羡之、傅亮同受顾命辅政。少帝失德，我领军居前，与檀道济等共废帝而迎立宜都王义隆。
