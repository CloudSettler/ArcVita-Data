  - 山水诗宗而卷入朝局，终以狂放致诛
  lesson: 恃才慢礼，威仪不肃，纵逸名胜而祸机伏焉
  summary_first_person: 我陈郡谢灵运，素有逸才，然每出入必众人扶接，四人挈衣裙、三人捉坐席，仪从赫奕，民谣讥之。貌不恭而不肃之咎积于身，后竟坐诛，才名终不能免祸。
