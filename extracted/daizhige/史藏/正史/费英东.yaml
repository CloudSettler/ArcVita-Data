    title_zh: 随父索尔果率所部归附努尔哈赤
    rationale: 苏完部内附，太祖厚抚之，遂委身效命。
  - date: 1607
    title_zh: 受命与扬古利率兵徙斐悠城户五百
    rationale: 瓦尔喀斐悠城长穆特黑以乌拉侵暴求内附，太祖命往徙其民，击败乌拉遮击之兵。
