  dilemmas:
  - 部族归附与效忠新主之间的抉择
  - 戍守哈达时对盟友叛约的处置之难
  lesson: 忠勇事主、战功卓著者可由部众之长成为开国五大臣，名垂青史。
  summary_first_person: 我本苏完部索尔果之子，戊子年随父率所部归附太祖，倍受厚抚。此后屡从征伐，徙斐悠城之民，征渥集诸路，戍守哈达，太祖建元后命我为五大臣，同听国政，官至左翼都统总兵官、一等大臣。天命五年卒，上亲临哭之，后又过我的墓赐奠。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷1
