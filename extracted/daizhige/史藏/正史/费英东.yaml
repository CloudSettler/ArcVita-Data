events:
- id: guji-费英东-event-guifu
  name_zh: 苏完部来归
  date: 1588
  year_of: 1588
  type: milestone
  description: 戊子夏四月，苏完部索尔果率其子费英东等率所部来归，太祖皆厚抚之。
  participants:
  - 费英东
  - 索尔果
  - 努尔哈赤
- id: guji-费英东-event-hada
  name_zh: 戍守哈达
  date: 1599
  year_of: 1599
  type: milestone
  description: 己亥年哈达送质乞援，太祖遣费英东、噶盖戍之；哈达私于叶赫，戍将以告，遂有伐哈达之役。
  participants:
  - 费英东
  - 噶盖
  - 哈达部
- id: guji-费英东-event-feiyou
  name_zh: 徙斐悠城民与破乌拉
  date: 1607
  year_of: 1607
  type: battle
  description: 丁未春正月，命舒尔哈齐、褚英、代善及费英东、扬古利率兵徙斐悠城户五百，乌拉以兵一万遮击，击败之，斩首三千，获马五千匹。
  participants:
  - 费英东
  - 扬古利
  - 乌拉部
- id: guji-费英东-event-wuji
  name_zh: 征渥集部
  date: 1607-05
  year_of: 1607
  type: battle
  description: 丁未夏五月，命巴雅拉、额亦都、费英东、扈尔汉征渥集部，取二千人还。
  participants:
  - 费英东
  - 额亦都
  - 扈尔汉
  - 巴雅拉
- id: guji-费英东-event-wuerjin
  name_zh: 取乌尔古宸、木伦二路
  date: 1611-07
  year_of: 1611
  type: battle
  description: 辛亥秋七月，命子阿巴泰及费英东、安费扬古取渥集部乌尔古宸、木伦二路。
  participants:
  - 费英东
  - 阿巴泰
  - 安费扬古
- id: guji-费英东-event-wudachen
  name_zh: 授五大臣同听国政
  date: 1616
  year_of: 1616
  type: appointment
  description: 天命元年丙辰春正月，太祖即位建元，命额亦都、费英东、何和里、扈尔汉、安费扬古为五大臣，同听国政。
  participants:
  - 费英东
  - 努尔哈赤
  - 额亦都
- id: guji-费英东-event-death
  name_zh: 费英东卒
  date: 1620
  year_of: 1620
  type: death
  description: 天命五年三月丙戌，左翼都统总兵官、一等大臣费英东卒，上临哭之；九月车驾又过其墓赐奠。
  participants:
  - 费英东
  - 努尔哈赤
