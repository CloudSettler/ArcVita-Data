  - 当亭县公出镇楚州，治军整备而不得擅开战端之权衡
  lesson: 习战备虏，以明取江南之志；然功高口伐，恃功而骄者终致祸。
  summary_first_person: 我是贺若弼，开皇元年三月戊子，我以开府、当亭县公受任楚州总管，镇守淮南沿江之地，为日后果然平陈江南练兵储粮做准备；然而功成之后位居诸将之右而心怀不平，终被隋文帝削爵，炀帝时更因讪谤朝政被诛。
  source_urls:
  - https://zh.wikisource.org/wiki/隋書/卷二
