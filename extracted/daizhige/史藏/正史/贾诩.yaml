  - 事多主（董卓、张绣、曹操）所带来的忠义争议
  lesson: 谋之以慎，言之以时，策无遗算而自全其身
  summary_first_person: 我是贾诩，字文和。我历仕董卓、张绣，后归曹操。官渡之战前，我劝张绣率众降曹，使其得封列侯；战事相持之际，我与荀攸力劝曹操奇袭乌巢，终破袁绍。我算无遗策，然常自敛藏，以全其身，晚位至太尉。
  source_urls:
  - https://zh.wikisource.org/wiki/三國志/卷01
