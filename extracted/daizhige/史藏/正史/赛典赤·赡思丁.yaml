  era: 元代
  reign_ref: 元世祖至元年间
  archetype: 治世能臣·行省奠基者
  dilemmas:
  - 身为西域色目人，需在蒙元朝廷与汉地、云南各族之间调和统御
  - 经略云南时须平息战乱与推行仁政、兴学教化之间的平衡
  lesson: 化兵戈为教化，以仁政治边陲，则远人自服
  summary_first_person: 我出身西域贵族世家，早年侍奉成吉思汗、窝阔台诸朝，历主丰州、平阳诸路政务。世祖至元年间，我拜平章政事行省云南，抚定乱局，建立行省制度，兴修水利、创办儒学、立州县、恤民困，滇人怀之。我死于任上，诸民如丧父母，朝廷追封咸阳王，谥忠惠。
  source_urls:
  - https://zh.wikisource.org/wiki/新元史/卷一百五十五
