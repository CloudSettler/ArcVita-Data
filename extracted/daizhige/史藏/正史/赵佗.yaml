  era: 秦末至汉武帝初
  reign_ref: 南越武王（曾自称南越武帝）
  archetype: 割据称雄的边裔开国之主
  dilemmas:
  - 中原王朝正统与岭南自立之间的称臣与称帝抉择
  - 闭关自守以自保与奉贡修好以安边之间的权衡
  lesson: 善审时势、能屈能伸，越族半壁可传数世
  summary_first_person: 我本真定人，秦时为南海龙川令。秦亡，我行南海尉事，击并桂林、象郡，自立为南越武王。汉高祖时通使，惠帝三年我称臣奉贡。吕后时禁关市，我乃自尊号为南越武帝，发兵攻长沙边邑。文帝遣陆贾来聘，我去帝号复称臣，至今子孙称王于岭外。
  source_urls:
  - https://zh.wikipedia.org/wiki/赵佗
