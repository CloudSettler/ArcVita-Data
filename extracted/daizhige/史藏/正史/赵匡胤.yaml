  birth_date: 927-03-21
  death_date: 976-11-14
  era: 五代末至北宋初
  reign_ref: 建隆、乾德、开宝，在位十六年，庙号太祖
  archetype: 开国之君
  dilemmas:
  - 兵变夺位于幼主孤儿寡妇，忠义与天命之抉择
  - 武将拥兵之患，需削藩集权又不欲屠戮功臣
  lesson: 以杯酒释兵权，用不流血之策终结五代兵乱，重文抑武奠定两宋基业
  summary_first_person: 我本后周殿前都点检，见天下分裂久矣。陈桥兵变，黄袍加身，我受周禅而即帝位，建号大宋。先平李筠、李重进之叛，而后以杯酒释诸将兵权，用文臣知州事，收天下精兵于禁中。先南后北，翦灭荆南、湖南、后蜀、南汉、南唐，唯北汉未下。烛影斧声之中，我寿终五十，庙号太祖。
  source_urls:
