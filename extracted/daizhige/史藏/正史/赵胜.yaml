  reign_ref: 赵惠文王、赵孝成王
  archetype: 贵族政治家
  dilemmas:
  - 冯亭献上党十七城，受地则招秦祸，不受则失大利
  - 邯郸被围，须亲赴楚国求救以存赵
  lesson: 利不可骛于无故之外患，毛遂自荐显于盘国之会
  summary_first_person: 我乃赵国公子，号平原君，三为赵相，喜宾客，食客数千。新王初立、秦军急攻之际，我奉命受上党之地，终酿长平之祸；邯郸围困时，我赴楚乞师，赖毛遂定纵，得以却秦存赵，孝成王十四年卒。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷043
