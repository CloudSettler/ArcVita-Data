  - 奉诏执法与豫章王暕请托之间的冲突，坚持‘奉诏不敢有私’
  - 革除岷州畏病弃亲陋俗，以身居病庐破除迷信
  lesson: 以身作则、至诚抚民，可以移风易俗，德政胜于刑罚。
  summary_first_person: 我辛公义早孤勤学，历仕周隋，在岷州坐在病者之间为其疗疾，革弃亲之俗；在牟州露坐狱侧亲验囚徒，决断殆尽；虽因不徇私情触怒权贵而去官，终究吏人诉冤、复被起用。
  source_urls:
  - https://zh.wikisource.org/wiki/隋书/卷73
