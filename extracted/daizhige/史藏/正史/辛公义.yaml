  summary: 辛公义生于陇西狄道，早孤，为母所养，亲授书传。
- id: guji-辛公义-event-lumen
  date: 约570
  date_raw: 约570（天和中）
  year_of: 570
  type: career
  summary: 选良家子任太学生，后被召入露门学受道义，每月御前与大儒讲论，数被嗟异。
- id: guji-辛公义-event-pingqi
  date: 约577
  date_raw: 建德初后
  year_of: 577
  type: career
  summary: 授宣纳中士，从平齐，累迁掌治上士、扫寇将军。
- id: guji-辛公义-event-horses
  date: 587
  date_raw: 开皇七年
  year_of: 587
  type: career
  summary: 使勾检诸马牧，所获十余万匹，高祖喜曰‘唯我公义，奉国罄心’。
- id: guji-辛公义-event-minzhou
  date: 约590
  date_raw: 平陈后
  year_of: 590
  type: career
  summary: 以功除岷州刺史，亲设榻独坐病者之间，尽俸市药迎医，病人悉差，风俗遂革，合境呼为慈母。
- id: guji-辛公义-event-muzhou
  date: 约594
  date_raw: 后迁牟州
  year_of: 594
  type: career
  summary: 迁牟州刺史，下车露坐牢侧亲自验问，十余日决断咸尽；受领新讼不立文案，宿于厅事不还閤，罪人自款服，争讼多两让而止。
- id: guji-辛公义-event-yangzhou
  date: 601
  date_raw: 仁寿元年
  year_of: 601
  type: career
  summary: 追充扬州道黜陟大使，拒豫章王暕请托，谓‘奉诏不敢有私’，至扬州皆无所纵舍，暕衔之。
- id: guji-辛公义-event-dismissal
  date: 约605
  date_raw: 炀帝即位后
  year_of: 605
  type: career
  summary: 扬州长史王弘入为黄门侍郎，言公义之短，竟去官；吏人守阙诉冤相继不绝，后帝悟，除内史侍郎。
- id: guji-辛公义-event-death
  date: 约602
  date_raw: 从征至柳城郡卒，时年六十二
  year_of: 602
  type: death
  summary: 起为司隶大夫、检校右御卫武贲郎将，从征至柳城郡卒，时年六十二。
