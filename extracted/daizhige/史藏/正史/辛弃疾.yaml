person:
  qid: guji-辛弃疾
  name_zh: 辛弃疾
  names:
    zh: 辛弃疾 / 辛幼安 / 稼轩居士
    en: Xin Qiji
  lifespan:
    birth:
      date: '1140-05-28'
      precision: day
      is_circa: false
      raw: 宋高宗绍兴十年（金天眷三年），生于历城
    death:
      date: '1207-10-03'
      precision: day
      is_circa: false
      raw: 开禧三年九月，卒，年六十八
  birth_date: '1140-05-28'
  death_date: '1207-10-03'
  era: 南宋
  reign_ref: 高宗—宁宗
  archetype: 豪杰文人
  dilemmas:
  - 身在南方而志在北伐，一生被迫闲居，恢复之志 无处施展
  - 儒雅文名 与 杀伐决断 并具，官场猜忌使其屡起屡废
  lesson: 真正的家国担当，不因身世与困顿而稍减，不遇亦不改其初心
  summary_first_person: 我本北方孤忠，绍兴三十一年聚众南归，五十骑入敌军五万众营中生擒叛贼；此后平茶商军、创飞虎军，政绩赫赫，然壮志难酬，半生赋闲 于带湖瓢泉，词开豪放一宗
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷401
endeavors:
- id: guji-辛弃疾-endeavor-1
  name_zh: 南归起义与平乱军政
  labels:
    zh: 起义南归 / 军政建言
  phases:
  - key: brewing
    name_zh: 北方聚义
    labels:
      zh: 聚众南归
    start_date: '1161-10-01'
    highlight_event_id: guji-辛弃疾-event-join-gengjing
    desc: 绍兴三十年至三十一年间，金主完颜亮大举南侵，北方军民竞起；辛弃疾鸠众二千，投耿京麾下为掌书记，并以天平军节度掌书记奉表南归，说服耿京奉表归宋。
  - key: breakthrough
    name_zh: 擒叛安军
    labels:
      zh: 五十骑入金营
    start_date: '1162-06-01'
    highlight_event_id: guji-辛弃疾-event-capture-zhanganguo
    desc: 叛徒张安国杀耿京降金，辛弃疾亟率五十骑袭入五万金军军营，直取张安国于眈眈不动之顷，缚之以出，号召万人赑之，献俘行在，一时忠义之气震动当时。
  - key: climax
    name_zh: 政事军功
    labels:
      zh: 平茶商军 / 创飞虎军
    start_date: '1175-01-01'
    highlight_event_id: guji-辛弃疾-event-laiwenzheng
    desc: 上《美芹十论》《九议》陈方略；淳熙二年平赖文政茶商军，遂以江西提点刑狱兼经制盗贼；淳熙七年知潭州兼湖南安抚，创置湖南飞虎军，一如旧制综理，至今为湖南雄镇。
  - key: closure
  decisions:
  - date: '1162-01-01'
    rationale: 奉表归宋、投奔银牌席、金人不疑，绝无踯躅
    title_zh: 决计南归，以二千人投耿京
  - date: '1175-09-01'
    rationale: 摧暴廓清、法可立而贪可畏，不逾月即峻治之
    title_zh: 严治盗贼为乱本之论
  - date: '1179-05-01'
    rationale: 江湖有事、得军镇记载，权免寝奏
    title_zh: 置骑雕刻飞虎军（湖南）
- id: guji-辛弃疾-endeavor-2
  name_zh: 稼轩词与著述
  labels:
    zh: 豪放词正宗 / 带湖瓢泉闲居
  phases:
  - key: brewing
    name_zh: 忠愤托词
    labels:
      zh: 《美芹十论》《九议》
    start_date: '1165-01-01'
    highlight_event_id: guji-辛弃疾-event-meiqin
    desc: 乾道元年上《美芹十论》，淳熙中上《九议》，剖析南北形势、兵谋钱谷利害，深为宰相谂之，虽不及用，却为知兵之 骚首而留意于笔端者所重。
  - key: breakthrough
    name_zh: 闲居带湖
    labels:
      zh: 带湖瓢泉闲居
    start_date: '1181-01-01'
    highlight_event_id: guji-辛弃疾-event-daihu
    desc: 淳熙八年冬，因王蔺论列 罢居上饶带湖，之后屡 判绍兴府、知福州、镇江府、铅山瓢泉，赋闲二十年，纵游山水，所作词章 忠愤托为其宗。
  - key: climax
    name_zh: 起废再战
    labels:
      zh: 复出知府参与北伐
    start_date: '1203-01-01'
    highlight_event_id: guji-辛弃疾-event-zhenjiang
    desc: 嘉泰三年再起 知绍兴府兼浙东安抚使，加宝谟阁待制、知镇江府；会北伐兴起，屡言金国必乱必亡、须更待二十年，言战亟终，未几官复差 知福州，免降而已。
  - key: closure
    name_zh: 遗恨以终
    labels:
      zh: 秋风之中 呼喊北伐而逝
    start_date: '1207-08-01'
    highlight_event_id: guji-辛弃疾-event-death
    desc: 开禧三年诏赴行在，疾 中又命 议论 关河、留置三连贯语，未竟而卒；特赠四官（光禄大夫），谥 忠敏，临危犹呼“杀贼”数声。
  decisions:
  - date: '1181-06-01'
    rationale: 弁 冠 挂之神 农，入 湖海 之 隐，志 不 得 伸 而 藏 之 于 文
    title_zh: 罢居带湖，专事著述
  - date: '1204-01-01'
    rationale: 逆 睹 开 熙 轻 举 之 非，力 言 须 更 待 二 十 年 方 可 图 之
    title_zh: 知镇江府时坚辞冒进北伐之议
events:
- id: guji-辛弃疾-event-birth
  date: '1140-05-28'
  year_of: 1140
  type: exact
  title_zh: 生于山东历城（济南）
  desc: 生而幼安，中在山东 死节 之 后，辛赞于 金 为 官，随 之 在 金 地 长 大，常 使 复 视 山 川 形 胜，思 报 国 之 志 早 萌。
- id: guji-辛弃疾-event-join-gengjing
  date: '1161-11-01'
  year_of: 1161
  type: approx
  title_zh: 聚众二千，投耿京麾下
  desc: 绍兴三十一年， 南北 起 义 军 竞 起，辛 弃 疾 鸠 众 二 千，以 名 义 加 入 耿 京 天 平 军，为 掌 书 记。
- id: guji-辛弃疾-event-capture-zhanganguo
  date: '1162-06-15'
  year_of: 1162
  type: exact
  title_zh: 五十骑闯金营生擒叛徒张安国
  desc: 耿京 被 叛 徒 张 安 国 杀 害 后，辛 弃 疾 率 五 十 骑 袭 入 五 万 金 军 之 营，当 场 缚 张 安 国，并 号 召 万 人 起 义 同 行，献 俘 行 在。
- id: guji-辛弃疾-event-meiqin
  date: '1165-10-01'
  year_of: 1165
  type: approx
  title_zh: 上《美芹十论》
  desc: 乾道 元 年 上《美 芹 十 论》，剖 析 南北 形 势、兵 谋 钱 谷、政 治 民 生 之 得 失，指 事 切 实，为 议 论 北 伐 之 重 镇 。
- id: guji-辛弃疾-event-laiwenzheng
  date: '1175-06-01'
  year_of: 1175
  type: approx
  title_zh: 平定赖文政茶商军
  desc: 时 茶 商 军 起 于 江 西，其 势 骚 扰 州 属，辛 弃 疾 以 江 西 提 点 刑 狱 兼 提 举 督 讨，旬 月 间 讨 平，由 是 迁 转 数 壁 干 功。
- id: guji-辛弃疾-event-daihu
  date: '1181-01-01'
  year_of: 1181
  type: year
  title_zh: 罢居上饶带湖，专事词章
  desc: 被 弹 劾 罢 官，砸 建 带 湖 庄 于 上 饶，自 号 稼 轩 居 士，闲 居 近 二 十 年，以 填 词 著 述、纵 游 山 水 为 务。
- id: guji-辛弃疾-event-zhenjiang
  date: '1204-05-01'
  year_of: 1204
  type: approx
  title_zh: 起废复出，知镇江府呼应北伐
  desc: 嘉泰 三 年 再 起 知 绍 兴府 兼 浙 东 安 抚 使，后 知 镇 江府；对 而 北 伐 之 议 起，则 建 言 战 略、遣 谋 报 详 侦 金 虚 实、画 天 下 大 势，未 几 免
    官 而 归。
- id: guji-辛弃疾-event-death
  date: '1207-10-03'
  year_of: 1207
  type: exact
  title_zh: 卒，赠少师（一说光禄大夫），谥忠敏
  desc: 开 熙 三 年 九 月 卒 于 铅 山，临 终 犹 大 呼“杀 贼”数 声 而 逝，气 壮 山 河；谥 忠 敏，著 有《稼 轩 长 短 句》传 世 。
