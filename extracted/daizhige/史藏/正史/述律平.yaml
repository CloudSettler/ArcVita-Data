person:
  qid: guji-述律平
  name_zh: 述律平
  names:
    zh: 述律平
    en: Shulü Ping
  lifespan:
    birth:
      date: '879'
      precision: year
      is_circa: true
      raw: 约唐乾符六年（879年），史传推算
    death:
      date: '953'
      precision: year
      is_circa: false
      raw: 辽应历三年（953年）
  birth_date: '879'
  death_date: '953'
  era: 唐末五代·辽朝肇建期
  reign_ref: 与天皇帝并尊，初号地皇后，神册加尊应天大明地皇后
  archetype: 开国皇后·摄政女主
  dilemmas:
  - 行宫被焚之际，救天子旗鼓而弃辎重庐帐：社稷象征与军实资财难以两全
  - 引后族兄弟拜相统军：外戚之柄既固中宫根基，亦开后族坐大之门
  lesson: 危局之中，果断取舍重于全盘保全；亲族可托重柄，亦须以名位制度约束其权。
  summary_first_person: 吾名述律平，契丹述律氏之女，太祖天皇帝之后。帝燔柴告天即位之日，吾正位中宫，群臣上尊号曰地皇后。诸弟构乱，寅底石焚掠行宫，吾急遣蜀古鲁驰救，仅存天子旗鼓。吾兄敌鲁拜北府宰相，后族为相自此始；神册之初，吾再加尊号曰应天大明地皇后。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷1
  - https://zh.wikisource.org/wiki/遼史/卷2
endeavors:
- id: guji-述律平-endeavor-1
  name_zh: 佐太祖定鼎护国
  description_zh: 自册立中宫至加尊应天，历诸弟之乱而社稷不倾，与天皇帝并尊共治。
  phases:
  - key: brewing
    name_zh: 册立中宫
    labels:
      zh: 燔柴告天，正位地皇后
    start_date: 907-01
    highlight_event_id: guji-述律平-event-houli-907
  - key: breakthrough
    name_zh: 乱中护宫
    labels:
      zh: 诸弟之乱遣将保旗鼓
    start_date: 914-03
    highlight_event_id: guji-述律平-event-hujia-914
  - key: climax
    name_zh: 应天大明
    labels:
      zh: 加尊应天大明地皇后
    start_date: 916-02
    highlight_event_id: guji-述律平-event-zunhao-916
  - key: closure
    name_zh: 崇儒分谒
    labels:
      zh: 与皇太子分谒寺观
    start_date: 925-08
    highlight_event_id: guji-述律平-event-si-925
  decisions:
  - date: 914-03
    title_zh: 急遣蜀古鲁驰救行宫
    rationale: 叛党寅底石焚掠行宫、纵兵大杀，先存天子旗鼓以保国本，辎重庐帐虽失亦在所不惜。
- id: guji-述律平-endeavor-2
  name_zh: 经营后族权柄
  description_zh: 以母家兄弟典相府、掌兵符，确立后族与皇族共理军国之格局。
  phases:
  - key: brewing
    name_zh: 正位开基
    labels:
      zh: 册后立制之始
    start_date: 907-01
    highlight_event_id: guji-述律平-event-houli-907
  - key: breakthrough
    name_zh: 后族拜相
    labels:
      zh: 兄萧敌鲁为北府宰相
    start_date: 910-07
    highlight_event_id: guji-述律平-event-houzu-910
  - key: climax
    name_zh: 弟掌兵符
    labels:
      zh: 弟阿骨只为统军
    start_date: 917-03
    highlight_event_id: guji-述律平-event-tongjun-917
  - key: closure
    name_zh: 定制垂后
    labels:
      zh: 后族为相自此始
    start_date: 910-07
    highlight_event_id: guji-述律平-event-houzu-910
  decisions:
  - date: 910-07
    title_zh: 荐后兄萧敌鲁为北府宰相
    rationale: 以后族典北府重职，联结母家以固中宫之势，史称后族为相自此始。
  - date: 917-03
    title_zh: 以后弟阿骨只为统军、实鲁为先锋
    rationale: 新州大破周德威之后南面用兵方殷，托兵柄于手足，使军权不外溢。
events:
- id: guji-述律平-event-birth
  person: guji-述律平
  title_zh: 述律平生
  date: '879'
  precision: year
  year_of: 879
  type: birth
  description_zh: 述律平约生于唐乾符六年，契丹述律氏之女，后为辽太祖耶律阿保机之皇后。
- id: guji-述律平-event-houli-907
  person: guji-述律平
  title_zh: 正位中宫，群臣上尊号地皇后
  date: 907-01
  precision: month
  year_of: 907
  type: career
  endeavor: guji-述律平-endeavor-1
  description_zh: 太祖燔柴告天即皇帝位，立皇后萧氏；北宰相萧辖剌、南宰相耶律欧里思率群臣上尊号，帝曰天皇帝，后曰地皇后。
- id: guji-述律平-event-houzu-910
  person: guji-述律平
  title_zh: 后兄萧敌鲁拜北府宰相
  date: 910-07
  precision: month
  year_of: 910
  type: career
  endeavor: guji-述律平-endeavor-2
  description_zh: 太祖四年秋七月戊子朔，以后兄萧敌鲁为北府宰相，后族为相自此始。
- id: guji-述律平-event-hujia-914
  person: guji-述律平
  title_zh: 诸弟之乱，急遣蜀古鲁救行宫
  date: 914-03
  precision: month
  year_of: 914
  type: career
  endeavor: guji-述律平-endeavor-1
  description_zh: 太祖七年，剌葛遣其党寅底石引兵径趋行宫，焚辎重庐帐、纵兵大杀；皇后急遣蜀古鲁救之，仅得天子旗鼓而已。
- id: guji-述律平-event-zunhao-916
  person: guji-述律平
  title_zh: 加尊应天大明地皇后
  date: 916-02
  precision: month
  year_of: 916
  type: career
  endeavor: guji-述律平-endeavor-1
  description_zh: 神册元年春二月丙申，群臣及诸属国筑坛州东上尊号，帝曰大圣大明天皇帝，后曰应天大明地皇后，大赦建元神册。
- id: guji-述律平-event-tongjun-917
  person: guji-述律平
  title_zh: 后弟阿骨只为统军
  date: 917-03
  precision: month
  year_of: 917
  type: career
  endeavor: guji-述律平-endeavor-2
  description_zh: 神册二年三月辛亥，新州大破周德威之后，以后弟阿骨只为统军、实鲁为先锋，东出关略燕赵。
- id: guji-述律平-event-si-925
  person: guji-述律平
  title_zh: 奉命与皇太子分谒寺观
  date: 925-08
  precision: month
  year_of: 925
  type: career
  endeavor: guji-述律平-endeavor-1
  description_zh: 天赞四年秋八月丁酉，太祖谒孔子庙，命皇后、皇太子分谒佛寺道观。
- id: guji-述律平-event-death
  person: guji-述律平
  title_zh: 述律平卒
  date: '953'
  precision: year
  year_of: 953
  type: death
  description_zh: 辽应历三年，述律皇后崩，初谥贞烈，后世改谥淳钦皇后。
