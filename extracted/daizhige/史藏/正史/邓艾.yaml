  archetype: 出身寒微而以军功灭蜀的魏国名将（ premature 功高被谗之典型）
  dilemmas:
  - 穷若空谷之寒士，與其忍辱待年，不如奋身立功
  - 灭蜀大功既成，居功自擅而遭钟会陷构，何自处
  lesson: 功成而不居，方能善始善终；恃功而行，祸常随之
  summary_first_person: 我邓艾出身寒微，以屯田之策与淮南陇西军功起家，后偷渡阴平、一举灭蜀，却因擅权被钟会等诬构，与子同死，功成而身殒。
  source_urls:
  - https://zh.wikisource.org/wiki/三國志/卷28
