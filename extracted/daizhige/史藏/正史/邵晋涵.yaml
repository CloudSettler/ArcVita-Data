  - 薛史体例残阙与欧史谨严之间的史学抉择
  lesson: 残缣断简之中孜孜搜辑，可使湮没七百余年的史籍重显于世
  summary_first_person: 我是邵晋涵，以翰林院编修充四库全书馆纂修官，主纂《旧五代史》，从《永乐大典》各韵所引薛居正书甄録条系，复采《册府元龟》诸书补阙考证，勒成一百五十卷五十八册，使其重列于廿三史之目。
  source_urls:
  - https://www.zh.wikisource.org/旧五代史
