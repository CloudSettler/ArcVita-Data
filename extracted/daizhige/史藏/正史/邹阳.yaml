  lesson: 知心以说，尽忠款诚，胜于口辩之才
  summary_first_person: 我本是齐人，游于梁孝王门下。因遭谗被下狱，我于狱中上书陈情，以辞喻理而获释。梁王欲为不平之事时，我又借规劝王长君而感悟梁王，使祸端不发。世人谓我能以言悟人，然我所恃者，知心与至诚而已。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷083
