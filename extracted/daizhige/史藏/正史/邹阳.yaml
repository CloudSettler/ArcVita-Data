    rationale: 知梁王将有非分之举，遂借王长君之关系进言，以人伦利害讽喻，使梁王止而不为
events:
- id: guji-邹阳-event-imprisonment
  date: -109
  year_of: -155
  type: career
  person_id: guji-邹阳
  name_zh: 遭谗下狱于梁
  description: 邹阳在梁孝王门下遭人谗毁而下狱，狱中上书自陈忠悃，援史为喻，梁王读之感悟，出而释之，待为上客。
- id: guji-邹阳-event-admonish
  date: -104
  year_of: -150
  type: career
  person_id: guji-邹阳
  name_zh: 悟梁王 弭祸谏言
  description: 梁王谋议不轨之际，邹阳借为王长君画策之机进言，以利害大义感悟梁王，使其罢议。世人称为"邹阳悟长君"，以其知心之术为说客典范。
- id: guji-邹阳-event-birth
  date: -128
  year_of: 200
  type: birth
  person_id: guji-邹阳
  name_zh: 邹阳出生
  description: 邹阳，西汉齐人，史家推其约生于汉文帝前后。
- id: guji-邹阳-event-death
  date: -96
  year_of: -140
  type: death
  person_id: guji-邹阳
  name_zh: 邹阳卒（约）
  description: 邹阳卒年史无明载，约在汉武帝初期，其狱中上书之文传于后世，与枚乘、严忌并称为梁园名士。
