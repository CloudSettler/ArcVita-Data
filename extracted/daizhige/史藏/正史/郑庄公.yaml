  era: 春秋
  reign_ref: 郑国国君（春秋初期）
  archetype: 挟天子以令诸侯的强藩之君
  dilemmas:
  - 周桓王于其朝见时无礼，郑怨而与鲁易许田，体现对王室尊卑与本国利益的抉择
  - 桓王率师伐郑，郑军射伤王肩，胜而未敢穷追，须权衡胜王与名义
  lesson: 王权衰微时，强藩以实力 dispute 天子之礼，虽胜犹存顾忌，礼与力之冲突终启春秋争霸之局
  summary_first_person: 我郑庄公朝见周桓王而遭无礼之遇，遂怨而与鲁互换许田；桓王亲率诸侯伐我，我军射王中肩，王师败归，周室之威自此益衰。
  source_urls:
  - https://zh.wikisource.org/wiki/史记/卷004
