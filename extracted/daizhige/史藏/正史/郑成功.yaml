  archetype: 抗清名将
  dilemmas:
  - 忠于明室与维系家族（父郑芝龙降清）之间的取舍
  - 抗清复明与经营台湾根据地之间的战略抉择
  lesson: 在故国倾覆之际，坚守信念、另辟根基，以孤军延续一方基业。
  summary_first_person: 我本名郑森，为故明之将。清军南下后，我拒不从父降清，据东南沿海抗清多年。清廷先后遣总兵官王邦俊、浙闽总督陈锦等征讨我军；我转战潮州、漳州等地，后收复台湾，以为抗清复明之基。
  source_urls:
  - https://zh.wikisource.org/wiki/清史稿/卷5
