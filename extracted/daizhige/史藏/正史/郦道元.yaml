  - 执法纠弹权贵而屡遭权臣排抑
  - 欲精核山川水道，然宦游南北之际难得闲暇实地遍访
  lesson: 以实地考察修正经传讹误，虽仕途险恶而学术之志不移
  summary_first_person: 我名郦道元，北魏范阳涿人。我仕宦于朝，曾任御史中尉，敢于纠弹不顾情面，故为当权者所忌。我生平最爱山水地理，遍历北地，考察水道，撰《水经注》四十卷，以补《水经》简略之失。后奉使关中，为萧宝夤所害，死于阴盘驿。后人称我为我朝最精博的地理学家。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書
