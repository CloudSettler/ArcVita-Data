person:
  qid: guji-朱温
  name_zh: 朱温
  names:
    zh: 朱温
    en: Zhu Wen
  lifespan:
    birth:
      date: 852-10-21
      precision: day
      is_circa: false
      raw: 唐大中六年十月二十一日夜，生于砀山县午沟里
    death:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  birth_date: 852-10-21
  death_date: ''
  era: 唐末五代（宣武军节度使，后建后梁）
  reign_ref: 后梁太祖，开平元年即位
  archetype: 乱世枭雄
  dilemmas:
  - 由黄巢部将转而降唐，赐名全忠，背负背主之疑
  - 上源驿之夜谋袭李克用，埋下梁晋世仇
  - 挟朝廷节度诸镇，独自与强敌蔡贼周旋
  lesson: 出身微贱者于乱世崛起，成败系于兵势与人心，然背信之争终难久安。
  summary_first_person: 我本砀山布衣，壮年不事生业，黄巢乱起投军，以骁勇起家；降唐受赐名全忠，镇宣武，破秦宗权，兼并徐兖郓，遂踞中原而图王业。
  source_urls:
  - https://zh.wikisource.org/wiki/舊五代史/卷001
  note: 提示为人名郭威，但所呈古文为《旧五代史》卷一至卷七（梁书）太祖纪，内容为朱温本纪，故依文本抽取朱温。
endeavors:
- id: guji-朱温-endeavor-1
  name_zh: 从军黄巢与降唐授镇
  phases:
  - key: brewing
    name_zh: 早年与应募从巢
    labels:
      zh: 少年孤贫、投巢军立功
    start_date: '875'
    highlight_event_id: guji-朱温-event-join-huangchao
  - key: breakthrough
    name_zh: 据同州与举郡降唐
    labels:
      zh: 同州防御使、降王重荣、赐名全忠
    start_date: '882'
    highlight_event_id: guji-朱温-event-surrender
  - key: climax
    name_zh: 就任宣武节度使
    labels:
      zh: 移镇汴梁、入梁苑
    start_date: 883-07
    highlight_event_id: guji-朱温-event-enter-bian
  - key: closure
    name_zh: 立足宣武
    labels:
      zh: 任职之始
    start_date: 883-07
    highlight_event_id: guji-朱温-event-enter-bian
  decisions:
  - date: 882-09
    title_zh: 斩监军严实，举同州降于王重荣
    rationale: 表章十上不得达，察巢军势蹙诸校离心，知其必败，遂定计归唐。
  - date: 885-07
    title_zh: 遣朱珍、李唐宾袭取滑州
    rationale: 安师儒怠于军政为部下所杀，乘乱取滑台之地。
- id: guji-朱温-endeavor-2
  name_zh: 讨平蔡贼秦宗权
  phases:
  - key: brewing
    name_zh: 东北面都招讨使
    labels:
      zh: 汴宋连饥、外攻内忧而锐气益振
    start_date: '883'
    highlight_event_id: guji-朱温-event-luyi
  - key: breakthrough
    name_zh: 招兵奇袭
    labels:
      zh: 朱珍淄棣募兵、先击秦贤连拔四寨
    start_date: 884-02
    highlight_event_id: guji-朱温-event-xianji
  - key: climax
    name_zh: 汴水之上大破贼众
    labels:
      zh: 诸军齐攻、斩首二万余级、宗权遁去
    start_date: 884-05
    highlight_event_id: guji-朱温-event-bianshui
  - key: closure
    name_zh: 蔡州平定
    labels:
      zh: 郭璠执宗权献于长安，独柳树下斩之
    start_date: 887-02
    highlight_event_id: guji-朱温-event-caizhou-ping
  decisions:
  - date: 884-04
    title_zh: 乘贼不备，先击秦贤
    rationale: 度贼息师蓄锐必来攻，且宗权度我兵少未知朱珍来援，出其不意可胜。
- id: guji-朱温-endeavor-3
  name_zh: 争衡徐兖郓
  phases:
  - key: brewing
    name_zh: 朱瑄诱军生衅
    labels:
      zh: 移檄让瑄、命朱珍侵曹伐濮
    start_date: 884-09
    highlight_event_id: guji-朱温-event-cao-yan
  - key: breakthrough
    name_zh: 连败郓军
    labels:
      zh: 破援师于范县、攻陷濮州
    start_date: 885-10
    highlight_event_id: guji-朱温-event-puzhou
  - key: climax
    name_zh: 克徐州与鱼山大捷
    labels:
      zh: 庞师古下彭门枭时溥、鱼山纵火破瑄瑾
    start_date: 893-04
    highlight_event_id: guji-朱温-event-yushan
  - key: closure
    name_zh: 徐兖势定
    labels:
      zh: 彭门既克、兖州屡败
    start_date: 893-04
    highlight_event_id: guji-朱温-event-yushan
  decisions:
  - date: 893-02
    title_zh: 鱼山之战令纵火攻
    rationale: 东南风起我军旌旗失次，俄而西北风骤发，两军皆在草莽中，纵火乘势可破敌。
