  name_zh: 至元元年五月乙亥，郭守敬与唆脱颜行视西夏河渠
  description: 古文载'五月乙亥，唆脱颜、郭守敬行视西夏河渠'。二人奉世祖之命勘察西夏故地河渠，其后修复唐来、汉延等古渠，溉田数千顷，濒河诸地复蒙其利。
  persons:
  - guji-郭守敬
