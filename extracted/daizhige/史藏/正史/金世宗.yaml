person:
  qid: guji-金世宗
  name_zh: 金世宗
  names:
    zh: 金世宗
    en: Emperor Shizong of Jin
  lifespan:
    birth:
      date: '1123'
      precision: year
      is_circa: true
      raw: 完颜雍生于金天辅年间（约1123年）
    death:
      date: '1189-01-13'
  birth_date: '1123'
  death_date: '1189-01-13'
  era: 金朝
  reign_ref: 大定（1161—1189）
  archetype: 中兴之君
  dilemmas:
  - 海陵王暴政之下，起兵自保与臣节之间的抉择
  - 面对宋金战争，主战与议和以休养生息的权衡
  - 女真旧俗与汉法治理之间的制度取舍
  lesson: 宁静致治，用贤纳谏，谋定而后动，可成中天之业
  summary_first_person: 我本以东京留守留守辽阳，因海陵王无道、举国怨愤，遂于大定元年即位于辽阳，时年人称"小尧舜"。在位近三十年，我偃兵息民，与宋议和成隆兴和议，任用贤臣，革除海陵弊政，轻徭薄赋，史称大定之治。
  source_urls:
  - https://zh.wikisource.org/wiki/金史/卷6
  - https://zh.wikipedia.org/wiki/金世宗
endeavors:
- id: guji-金世宗-endeavor-1
  name_zh: 大定之治
  phases:
  - key: brewing
    name_zh: 潜居自晦
    labels:
      zh:
      - 东京留守
      - 隐忍蓄势
    start_date: '1150'
    highlight_event_id: guji-金世宗-event-1
  - key: breakthrough
    name_zh: 即位于辽阳
    labels:
      zh:
      - 称帝
      - 改元大定
    start_date: '1161'
    highlight_event_id: guji-金世宗-event-2
  - key: climax
    name_zh: 隆兴和议与偃武修文
    labels:
      zh:
      - 宋金和议
      - 任贤纳谏
    start_date: '1164'
    highlight_event_id: guji-金世宗-event-3
  - key: closure
    name_zh: 大定盛世
    labels:
      zh:
      - 中兴
      - 小尧舜
    start_date: '1189'
    highlight_event_id: guji-金世宗-event-death
  decisions:
  - date: '1161'
    title_zh: 于东京辽阳自立为帝，改元大定
    rationale: 海陵王完颜亮穷兵黩武、残害宗室，人心思变，遂举义以安社稷
  - date: '1164'
    title_zh: 与宋订立隆兴和议，息兵罢战
    rationale: 连年用兵民不堪命，休养生息方为长久之计
  - date: '1170'
    title_zh: 屡召直臣、广开言路，革海陵弊政
    rationale: 治天下者必资众力，纳谏则得失可鉴，故朝政清明，史称大定之治
events:
- id: guji-金世宗-event-birth
  event_type: birth
  date: '1123'
  year_of: 1123
  title_zh: 完颜雍诞生
  description_zh: 完颜雍，本名乌禄，金太祖之孙，宗尧（完颜宗辅）之子，生于金初天辅年间。
- id: guji-金世宗-event-1
  event_type: endeavor
  date: '1150'
  year_of: 1150
  title_zh: 出任东京留守，韬晦自保
  description_zh: 海陵王完颜亮即位，猜忌宗室，完颜雍长期隐忍自晦，任东京留守，深得辽阳人心。
- id: guji-金世宗-event-2
  event_type: endeavor
  date: '1161-10-26'
  year_of: 1161
  title_zh: 辽阳即位，改元大定
  description_zh: 海陵王南伐之际，完颜雍于东京辽阳府即皇帝位，改元大定，进讨海陵余党，旋即海陵王死于采石之败。
- id: guji-金世宗-event-3
  event_type: endeavor
  date: '1164'
  year_of: 1164
  title_zh: 隆兴和议订立
  description_zh: 金宋罢兵言和，缔结隆兴和议，此后南北维持近四十年和平，民生得以休养。
- id: guji-金世宗-event-4
  event_type: endeavor
  date: '1170'
  year_of: 1170
  title_zh: 举贤纳谏，修明政治
  description_zh: 世宗先后任用纥石烈志宁、仆散忠义、唐括安礼及直臣梁襄等，广开言路，抑制豪强，轻徭薄赋，实现大定之治。
- id: guji-金世宗-event-death
  event_type: death
  date: '1189-01-13'
  year_of: 1189
  title_zh: 金世宗驾崩
  description_zh: 世宗在位二十九年，崩于大定二十九年正月，谥仁孝皇帝，庙号世宗，葬兴陵。
