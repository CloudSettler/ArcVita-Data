  birth_date: '1198'
  death_date: '1234-02-09'
  era: 金末年
  reign_ref: 金朝第九位皇帝，年号正大、开兴、天兴，1234年蔡州城破前传位完颜承麟后自缢
  archetype: 末代救亡之君
  dilemmas:
  - 蒙古大军压境，欲与南宋修好却两线受敌
  - 都城不守，迁蔡州以避兵锋，然大势已去
  - 守绪急于传位以图破局，反成亡国之君
  lesson: 内政修明可延国祚，然强邻环伺、独木难支，守成亦需天下之势。
  summary_first_person: 我是完颜守绪，即金哀宗。即位后力争与宋、夏修好，专意抗蒙，然国势已颓。汴京不守，我辗转迁蔡州。宋蒙合围之下，我传位于东面元帅完颜承麟，自缢于幽兰轩，金遂亡。
  source_urls:
  - https://zh.wikisource.org/wiki/金史/卷18
