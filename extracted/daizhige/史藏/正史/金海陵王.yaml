person:
  qid: guji-完颜亮
  name_zh: 海陵王（完颜亮）
  names:
    zh: 完颜亮 / 海陵炀王
    en: Wanyan Liang (Prince Hailing)
  lifespan:
    birth:
      date: '1122'
      precision: year
      is_circa: true
      raw: 天辅六年
    death:
      date: '1161-12-15'
      precision: day
      is_circa: false
      raw: 正隆六年十一月（瓜洲渡，为部下所杀）
  birth_date: '1122'
  death_date: '1161'
  era: 金代
  reign_ref: 金海陵王正隆年间（1156—1161）
  archetype: 暴君改革者
  dilemmas:
  - 弑君夺位与巩固皇权的政治冷酷
  - 迁都燕京、南下伐宋的宏大野心与国力民怨的失衡
  lesson: 急进集权与穷兵黩武虽能一时改制，却终因失人心而覆亡
  summary_first_person: 我是完颜亮，以宗室之身弑熙宗自立，迁都燕京、厉行汉制、南征宋国， 终因前线兵变死于瓜洲，身后被废为庶人，谥曰炀。
  source_urls:
  - https://zh.wikisource.org/wiki/金史/卷5
  - https://zh.wikisource.org/wiki/金史/卷132
