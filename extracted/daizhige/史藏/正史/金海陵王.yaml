    rationale: 欲混一天下，效法秦皇汉武一统之业
events:
- id: guji-完颜亮-event-birth
  event_type: birth
  date: '1122'
  year_of: '1122'
  name_zh: 完颜亮生（金太祖庶长子宗干次子）
  description: 天辅六年生，字元功，本名迪古乃。
- id: guji-完颜亮-event-seizure
  event_type: political_event
  date: '1150-01-09'
  year_of: '1150'
  name_zh: 弑金熙宗，自立为帝
  description: 皇统九年十二月，联合近侍杀熙宗于寝殿，即皇帝位，改元天德。
- id: guji-完颜亮-event-capital-move
  event_type: political_event
  date: '1153'
  year_of: '1153'
  name_zh: 迁都燕京，营建中都
  description: 贞元元年自上京会宁府迁都燕京，改称中都，推动女真政权汉化。
- id: guji-完颜亮-event-reform
  event_type: political_event
  date: '1156'
  year_of: '1156'
  name_zh: 颁行正隆官制
  description: 废中书、门下三省，仅存尚书省，军政集权于皇帝。
- id: guji-完颜亮-event-southern-invasion
  event_type: military_event
  date: 1161-10
  year_of: '1161'
  name_zh: 大举南征伐宋
  description: 正隆六年十月亲率大军渡淮攻宋，同年采石之战为宋虞允文所败。
- id: guji-完颜亮-event-death
  event_type: death
  date: '1161-12-15'
  year_of: '1161'
  name_zh: 死于瓜洲兵变
  description: 南征军中完颜元宜等兵变，完颜亮中箭身亡，后被金世宗降封海陵庶人，谥炀。
