      - 传位于子
    start_date: 0932
    highlight_event_id: guji-钱镠-event-death
  decisions:
  - date: 0882
    title_zh: 拒董昌裂土之诱
    rationale: 乱世之中，与其分地苟合，不如奉朝廷以取威名
  - date: 0896
    title_zh: 讨伐叛唐称帝的董昌
    rationale: 奉朝廷之命诛除僭乱，既忠义又可并两浙之力
- id: guji-钱镠-endeavor-2
  name_zh: 事大保境，建设吴越
