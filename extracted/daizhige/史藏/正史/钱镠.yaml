      - 保境息民
    start_date: 0910
    highlight_event_id: guji-钱镠-event-haitang
  - key: closure
    name_zh: 遗嘱奉事中原
    labels:
      zh:
      - 临终嘱子孙善事中国
    start_date: 0932
    highlight_event_id: guji-钱镠-event-death
  decisions:
