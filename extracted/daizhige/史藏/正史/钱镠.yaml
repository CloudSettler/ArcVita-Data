person:
  qid: guji-钱镠
  name_zh: 钱镠
  names:
    zh: 钱镠
  archetype: 割据军阀
  dilemmas:
  - 忠于中原王朝与保境安民之间的权衡
  lesson: 乱世中保境安民、审慎事大，可以成就一方安定
  summary_first_person: 我是钱镠，唐末起于临安，为吴越国的开创者，终其一生奉中原正朔，保境安民，使两浙免于兵祸。
  source_urls:
  - https://zh.wikipedia.org/wiki/钱镠
  lifespan:
    birth:
      date: 0852
      precision: year
      is_circa: true
      raw: 唐大中六年
    death:
      date: 0932
      precision: year
      is_circa: false
      raw: 后唐长兴三年
  birth_date: 0852
  death_date: 0932
  era: 唐末五代
  reign_ref: 吴越太祖
