  dilemmas:
  - 离间突厥诸汗与安抚归附部众之间的轻重权衡
  - 军情危急时以诈术稳控染干（启民可汗）的去留抉择
  lesson: 因机制变、以夷制夷，善用谋略与信义并施，方能不战而屈人之兵
  summary_first_person: 我长孙晟以奇计著称，深谙突厥情势，屡献离间之策，护送并扶立启民可汗，使突厥内附、北边得安，以兵不血刃而功盖边朔。
  source_urls:
  - https://zh.wikisource.org/wiki/北史/卷22
