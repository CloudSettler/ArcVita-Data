  description: 河南洛阳人，卒年五十八逆推约生于五五二年
- id: guji-长孙晟-event-1
  type: mission
  date: '583'
  year_of: 583
  title_zh: 出使突厥，暗察诸汗虚实
  description: 借出使之机遍知突厥山川形势、部众强弱，为后来离间之策奠定基础
- id: guji-长孙晟-event-2
  type: mission
  date: '599'
  year_of: 599
  title_zh: 货赂达官，夜掩获安遂迦
  description: 以计贿突厥达官探知钦所在，夜袭擒获，发公主私事，国人大耻，雍闾遂执遂迦等付晟
- id: guji-长孙晟-event-3
  type: refuge
  date: '599'
  year_of: 599
  title_zh: 大长城之战后密遣举烽，赚染干入伏远镇
  description: 染干兵败欲投达头，晟伪称四烽告急示贼迫，诱其入镇，驰驿入朝，染干受封意弥豆启民可汗
- id: guji-长孙晟-event-4
  type: settlement
  date: '599'
  year_of: 599
  title_zh: 筑大利城安置染干
  description: 领五万人于朔州筑大利城以处染干，后又奏请徙五原、掘横堑以避抄掠，上并从之
- id: guji-长孙晟-event-5
  type: appointment
  date: '600'
  year_of: 600
  title_zh: 授秦州行军总管，领降人讨达头
  description: 诏晟部领降人，取晋王广节度，出讨达头
- id: guji-长孙晟-event-6
  type: battle
  date: '600'
  year_of: 600
  title_zh: 毒上流之泉，达头人畜多死，夜遁
  description: 取诸药毒水上流，达头人畜饮之多死，惊曰天雨恶水，因夜遁
- id: guji-长孙晟-event-7
  type: battle
  date: '600'
  year_of: 600
  title_zh: 追击斩首千余级，俘百余口
  description: 晟追达头，斩首千余级，晋王引晟入内同宴，威名震突厥，闻弓声为霹雳、走马称闪电
- id: guji-长孙晟-event-8
  type: battle
  date: '602'
  year_of: 602
  title_zh: 与梁默击走思力俟斤
  description: 仁寿二年军次北河，贼帅思力俟斤领兵拒战，晟与大将军梁默击走之，贼众多降
- id: guji-长孙晟-event-9
  type: submission
  date: '603'
  year_of: 603
  title_zh: 铁勒十余部背达头来降，达头西奔
  description: 铁勒思结、伏具、浑、斛薛、阿拔、仆骨等十余部尽降，达头众大溃西奔吐谷浑，晟送染干安置碛口
- id: guji-长孙晟-event-10
  type: appointment
  date: '604'
  year_of: 604
  title_zh: 炀帝即位，委以内衙宿卫，拜左领军将军
  description: 文帝崩，匿丧未发，炀帝引晟于大行前委以内衙宿卫、知门禁事，即日拜左领军将军
- id: guji-长孙晟-event-11
  type: project
  date: '607'
  year_of: 607
  title_zh: 榆林指帐前草为香，诱启民亲芟，开御道三千里
  description: 借染干嗅草悟国家之法，启民拔刀亲芟，诸部落效之，举国开御道长三千里、广百余步
- id: guji-长孙晟-event-death
  type: death
  date: '609'
  date_precision: year
  is_circa: false
  year_of: 609
  title_zh: 长孙晟卒
  description: 大业五年卒，年五十八，帝悼惜之；后突厥围雁门，帝叹向使长孙晟在，不令匈奴至此；唐贞观中追赠司空、上柱国，谥曰献
