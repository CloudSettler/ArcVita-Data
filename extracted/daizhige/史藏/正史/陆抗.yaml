  summary: 陆抗生于吴郡陆氏，为丞相陆逊之子。
- id: guji-陆抗-event-yong-an-siege
  type: campaign
  date: '264'
  year_of: 264
  names:
    zh: 起兵西上攻永安
  summary: 吴闻蜀败，起兵西上，陆抗率军攻巴東永安，罗宪保城缮甲告誓将士，临江拒射。
- id: guji-陆抗-event-reinforce-siege
  type: campaign
  date: '264'
  year_of: 264
  names:
    zh: 增围永安
  summary: 步协攻城不利后，陆抗等率众三万人增宪之围，被攻凡六月日，城中疾疫大半而救援不到。
- id: guji-陆抗-event-retreat
  type: military_action
  date: '264'
  year_of: 264
  names:
    zh: 引兵而退
  summary: 晋王遣荆州刺史胡烈救宪，攻击吴之西境，陆抗等遂引兵撤退，永安之围解。
- id: guji-陆抗-event-death
  type: death
  date: '274'
  year_of: 274
  names:
    zh: 去世
  summary: 陆抗卒，吴失干城，数年后吴为晋所灭。
