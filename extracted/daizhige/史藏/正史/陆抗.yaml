    title_zh: 奉命率众三万增围永安
    rationale: 吴闻蜀败，外托救援，内欲袭取永安；宪临江拒御，吴遂增兵围攻。
  - date: '264'
    title_zh: 晋荆州刺史胡烈来救，引兵而退
    rationale: 攻凡六月日救援不到，城中疾疫大半，而晋遣胡烈攻西陵以救宪，抗等遂引退。
