  archetype: 名将支柱
  dilemmas:
  - 吴国倾覆之际奉命增围永安，救援不至、攻城六月不下，进退两难
  - 强攻巴东为吴取利，还是顾全吴蜀旧盟之义
  lesson: 忠于所守，力尽而退，然国势倾颓非一将可支。
  summary_first_person: 我是吴国名将陆抗。蜀亡之后，吴起兵西上，我奉命率众三万增围永安，罗宪固守，攻凡六月而晋援将军胡烈来救，我遂引兵而退。
  source_urls:
  - https://zh.wikisource.org/wiki/三國志/卷十一
