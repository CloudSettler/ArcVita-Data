  archetype: 翰林学士·制诰重臣
  dilemmas:
  - 奉天危城之下为君起草罪己诏， balancing 君威与自省
  - 奉命晓谕拥兵谋逆的李怀光，于刀俎之间全使臣之节
  lesson: 危难之际以诚笔济世，一纸罪己诏可收天下之心
  summary_first_person: 我是陆贽，建中末任祠部员外郎充翰林学士，德宗幸奉天时随驾左右。乱军围城之日，我以考功郎中知制诰，草兴元罪己诏以安人心；又奉命晓谕反状已明的李怀光。兴元收京后，我迁谏议大夫、中书舍人，仍掌翰林，以文辞佐中兴。
  source_urls:
  - https://zh.wikisource.org/wiki/舊唐書/卷12
