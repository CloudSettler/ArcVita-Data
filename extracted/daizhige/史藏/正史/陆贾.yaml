events:
- id: guji-陆贾-event-birth
  event_type: birth
  date: 约-240
  year_of: -240
  title_zh: 陆贾生于楚地
  detail: 陆贾，楚人，约生于战国末年。
- id: guji-陆贾-event-nanyue
  event_type: mission
  date: -196
  year_of: -196
  title_zh: 奉使南越，说赵佗称臣
  detail: 高祖使陆贾赐尉他赵佗印，为南越王。贾说以汉之强盛，令其去帝制、称臣奉汉约。还报，高帝大悦，拜贾为太中大夫。
- id: guji-陆贾-event-xinyu
  event_type: work
  date: -195
  year_of: -195
  title_zh: 著新语十二篇献高祖
  detail: 陆贾于高帝前称说诗书，高祖骂曰乃公居马上而得之，安事诗书。贾对以马上得之，宁可马上治之乎。高祖命著秦所以失天下、吾所以得之者及古成败之国。贾凡著十二篇，每奏一篇，高帝未尝不称善，号其书曰新语。
- id: guji-陆贾-event-chuhan
  event_type: work
  date: 约-190
  year_of: -190
  title_zh: 撰楚汉春秋
  detail: 汉太中大夫楚人陆贾所撰，纪项氏与汉高祖初起及说惠文间事。太史公司马迁据左氏国语，采世本战国策，述楚汉春秋，盖取资于贾书。
- id: guji-陆贾-event-death
  event_type: death
  date: 约-170
  year_of: -170
  title_zh: 陆贾卒
  detail: 陆贾约卒于文帝时，寿终。
