  reign_ref: 汉高祖、汉惠帝、汉文帝时期
  archetype: 思想家与外交使臣
  dilemmas:
  - 居乱世而欲以文辨定天下，武夫当道则儒术难行
  - 事高祖以口舌立功，然功不见于封侯之列
  lesson: 马上得天下，不可马上治之；文武并用，方为长久之术。
  summary_first_person: 我陆贾，楚人也，仕汉为太中大夫。尝谓高祖：居马上得之，宁可以马上治之乎？乃著书十二篇，言秦汉所以失得天下者，号曰新语。又撰楚汉春秋，纪项氏与汉高祖初起之事，及说惠文间事，以存当代之史。
  source_urls:
  - https://zh.wikisource.org/wiki/史记索隐
