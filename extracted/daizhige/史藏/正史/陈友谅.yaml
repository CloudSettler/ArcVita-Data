    en: Chen Youliang
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      date: 1363-08
      precision: month
      is_circa: false
      raw: 至正二十三年八月壬戌，中流矢死于鄱阳湖
  death_date: 1363-08
  era: 元末（至正年间）
  reign_ref: 汉帝（大汉，1360—1363）
  archetype: 争天下之枭雄
  dilemmas:
  - 弑主徐寿辉称帝，尽有江西、湖广，然失人心之望
  - 与张士诚约共攻应天，士诚观望不至，遂孤军深入
  - 鄱阳湖ँ巨舟联阵对朱元璋小舟火攻，舟重力强而机动不敌
  lesson: 兵众船巨，不如人心与地利；杀俘弑主者，众叛亲离。
  summary_first_person: 我陈友谅，初为徐寿辉将，遣赵普胜陷池州，据龙兴。后弑寿辉自立为帝，国号汉，尽有江西、湖广之地。曾陷太平，兵逼应天，然龙湾一战为朱元璋所破。又大举围洪都，与朱元璋决战鄱阳湖，联巨舟为阵，楼橹高十余丈，绵亘数十里，然中火烧大乱，突围至泾江中流矢而死，其子理奔武昌。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/本纪/第1卷
