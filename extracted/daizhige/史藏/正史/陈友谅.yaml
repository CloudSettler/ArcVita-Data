events:
- id: guji-陈友谅-event-birth
  type: birth
  summary_zh: 生年史文未载。
- id: guji-陈友谅-event-1
  type: endeavor
  date: 1358-05
  year_of: 1358
  summary_zh: 至正十八年夏五月，徐寿辉将陈友谅遣赵普胜陷池州，是月友谅据龙兴路。
- id: guji-陈友谅-event-2
  type: endeavor
  date: 1360-06
  year_of: 1360
  summary_zh: 至正二十年闰五月，友谅陷太平，守将朱文逊、花云等死之；未几弑其主徐寿辉，自称皇帝，国号汉，尽有江西、湖广地，约士诚合攻应天。
- id: guji-陈友谅-event-3
  type: endeavor
  date: 1360-07
  year_of: 1360
  summary_zh: 友谅引兵东，乙丑至龙湾，遭朱元璋水陆夹击，大败，乘别舸走；应天解围，复失太平、安庆。
- id: guji-陈友谅-event-4
  type: endeavor
  date: 1361-08
  year_of: 1361
  summary_zh: 至正二十一年秋，张定边陷安庆；八月朱元璋自将舟师征陈友谅，克安庆，追败友谅于江州，友谅奔武昌。
- id: guji-陈友谅-event-5
  type: endeavor
  date: 1363-04
  year_of: 1363
  summary_zh: 至正二十三年夏四月，友谅大举兵围洪都；分兵陷吉安、临江、无为州，守臣多死之。
- id: guji-陈友谅-event-6
  type: endeavor
  date: 1363-09-14
  year_of: 1363
  summary_zh: 鄱阳湖之战，友谅兵号六十万，联巨舟为阵与朱元璋决战康郎山；遭火攻大败，左右二金吾将军皆降，八月壬戌突围至泾江，中流矢死，张定边以其子陈理奔武昌。
- id: guji-陈友谅-event-death
  type: death
  date: 1363-09-14
  year_of: 1363
  summary_zh: 鄱阳湖兵败突围，中流矢死于泾江。
