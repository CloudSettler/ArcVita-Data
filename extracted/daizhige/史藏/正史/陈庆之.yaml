  era: 南朝梁（梁武帝时期）
  reign_ref: 梁武帝萧衍（大通、中大通年间）
  archetype: 以少胜多的白袍名将
  dilemmas:
  - 卫送元颢北还，助其僭号建武，陷入梁魏争霸与扶持傀儡的忠诚困局
  - 孤军深入北魏腹地，势单力孤，进退维谷
  lesson: 忠勇敢战，善用时机，然孤军无援终难久持，北伐功败垂成。
  summary_first_person: 我是陈庆之，梁武帝帐下东宫直阁将军。大通二年冬，我奉命卫送魏北海王元颢还北主魏；中大通元年，我率军攻拔梁城、屠考城，生擒魏济阴王晖业，五月攻克虎牢，护元颢入洛阳僭号称帝，威震北土。同年闰六月，尔朱荣攻杀元颢，京师反正，我孤军无援而归。
  source_urls:
  - https://zh.wikisource.org/wiki/南史/卷七
