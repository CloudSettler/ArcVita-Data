  name_zh: 矫制发兵斩郅支单于
  description_zh: 建昭三年，陈汤矫制发屯田吏士并诸国兵四万余人，分道三道会攻郅支城，破城斩郅支单于首，传首京师，悬首槀街。
  participants:
  - guji-陈汤
  - guji-甘延寿
