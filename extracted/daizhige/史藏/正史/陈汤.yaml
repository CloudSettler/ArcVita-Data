  dilemmas:
  - 矫制发兵虽建奇功却触犯汉法，功过如何相抵
  - 出身寒微、屡遭困厄，是明哲保身还是冒险立功
  lesson: 将在外君命有所不受，非常之功必待非常之人
  summary_first_person: 我陈汤出身贫穷，好读书记，西行求官至长安。我与甘延寿出使西域，见郅支单于役使诸国、威胁汉使，力主奇袭。他犹豫未决，我矫制发屯田吏士与诸国兵，斩郅支单于首级，传首京师。虽事后被劾矫制，幸赖朝议宽宥，得封关内侯。晚年贬黜辗转敦煌、安定，郁郁而终。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷070
