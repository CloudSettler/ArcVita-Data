person:
  qid: guji-陈胜
  name_zh: 陈胜
  names:
    zh: 陈胜
    en: Chen Sheng
  archetype: 反秦首义者
  dilemmas:
  - 以数百戍卒之众对抗拥有百万之师的秦帝国，成败悬殊
  - 起义建立张楚后，须在短时间内整合山东豪俊与六国旧势力
  lesson: 仁义不施而攻守之势异也——一夫作难而七庙堕，民心向背决定存亡
  summary_first_person: 我本是迁徙戍边的瓮牖绳枢之子，才能不过中人，无仲尼墨翟之贤、陶朱猗顿之富。二世元年七月，我以戍卒散乱之众数百人，在大泽乡奋臂大呼，不用弓戟之兵，以鉏耰白梃揭竿而起，天下云集响应。我自立为楚王，号张楚，居陈遣诸将徇地，山东郡县少年皆杀其守尉令丞以应我。然秦将章邯击破周章军，诸王并立不肯相助，我终败亡，被杀于城父。我揭开了亡秦的序幕。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷006
