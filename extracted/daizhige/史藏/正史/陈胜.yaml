  source_ref: 《史记·秦始皇本纪》附贾谊《过秦论》
- id: guji-陈胜-event-uprising
  type: event
  date: -209-07
  year_of: -209
  description_zh: 二世皇帝元年七月，戍卒陈胜等反于故荆地，为大泽乡（文中作"奋臂"处）起义，号为张楚
  source_ref: 《史记·秦始皇本纪》：七月，戍卒陈胜等反故荆地，为张楚
- id: guji-陈胜-event-king
  type: event
  date: -209-07
  year_of: -209
  description_zh: 陈胜自立为楚王，居陈，遣诸将徇地；山东郡县少年杀其守尉令丞以应陈涉
  source_ref: 《史记·秦始皇本纪》：胜自立为楚王，居陈，遣诸将徇地
- id: guji-陈胜-event-zhouzhang
