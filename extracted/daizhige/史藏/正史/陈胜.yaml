  source_ref: 《史记·秦始皇本纪》：击破周章军而走……杀陈胜城父
- id: guji-陈胜-event-death
  type: death
  date: -209-12
  year_of: -209
  description_zh: 陈胜（陈涉）失败，被杀于城父，起义历时约半年而败亡
  source_ref: 《史记·秦始皇本纪》：杀陈胜城父
