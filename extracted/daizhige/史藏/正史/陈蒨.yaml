      is_circa: false
  birth_date: 522
  death_date: 566
  era: 南朝陈
  reign_ref: 陈文帝（天康/天嘉年间在位，559—566）
  archetype: 守成之君
  dilemmas:
  - 侄主幼国疑，身为宗室第二代，需在权臣与外患之间稳固陈氏政权
  - 国力凋敝、号令不出建康，须权衡征讨与休养
  lesson: 创业维艰，守成亦难；休养生息与平定叛乱并重，方能延续基业
  summary_first_person: 我名陈蒨，是高祖武皇帝陈霸先之侄，始兴昭烈王陈道谭长子。侯景之乱时我避难临安，后随高祖起兵。永定三年高祖驾崩，我奉遗诏即位，是为陈文帝。在位期间平定王琳、留异、陈宝应等叛乱，削平豪强，使江南渐安，又躬行节俭，劝课农桑，陈室基业由我得以巩固。天康元年我崩于有觉殿。
  source_urls:
  - https://zh.wikisource.org/wiki/陳書/卷03
