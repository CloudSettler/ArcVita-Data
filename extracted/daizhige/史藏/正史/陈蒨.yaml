events:
- id: guji-陈蒨-event-birth
  date: 522
  year_of: 522
  type: birth
  title_zh: 陈蒨生
  description: 陈蒨为陈道谭长子，陈霸先之侄，字子华。
- id: guji-陈蒨-event-houjing
  date: 548
  year_of: 548
  type: endeavor
  title_zh: 侯景之乱中避难临安
  description: 侯景陷建康，陈蒨避地临安，时年二十余，后往依高祖。
- id: guji-陈蒨-event-wuxing
  date: 555
  year_of: 555
  type: endeavor
  title_zh: 出任吴兴太守
  description: 高祖讨王僧辩之党后，以陈蒨为吴兴太守，镇守后方；次年率兵击败杜龛余部、张彪等，渐显统御之才。
- id: guji-陈蒨-event-usurp-accession
  date: 559-08-07
  year_of: 559
  type: accession
  title_zh: 即皇帝位，改元天嘉
  description: 永定三年高祖崩，陈蒨以侄嗣位于南郊，是为陈文帝，改元天嘉。
- id: guji-陈蒨-event-wanglin-pacified
  date: 560
  year_of: 560
  type: endeavor
  title_zh: 王琳东下兵败，上游之患渐平
  description: 王琳引齐兵东下，文帝遣侯瑱等大破之于芜湖、沌口，琳奔齐，江郢二州收复。
- id: guji-陈蒨-event-liuyi-broken
  date: 564
  year_of: 564
  type: endeavor
  title_zh: 破留异、陈宝应，境内削平豪强
  description: 天嘉年间，先后平定留异、陈宝应、周迪等割据势力，江南渐服。
- id: guji-陈蒨-event-death
  date: 566-05-30
  year_of: 566
  type: death
  title_zh: 陈文帝崩于有觉殿
  description: 天康元年四月文帝病重，立太子陈伯宗，旋即崩逝，年四十五，谥文皇帝，葬永宁陵。
