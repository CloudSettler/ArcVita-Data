    death:
      date: 0168-10
      precision: month
      is_circa: false
      raw: 建宁元年九月辛亥
  death_date: 0168-10
  era: 东汉
  reign_ref: 汉桓帝、汉灵帝
  archetype: 东汉忠直之臣，位列三公，以抗直敢谏、谋诛宦官闻名，最终矫诏被害，夷其族。
  dilemmas:
  - 直言谏诤与宦官专权之间的对抗
  - 辅政大臣谋诛宦官失败，身死族灭
  lesson: 忠直抗争虽败，其气节为后世所称。
  summary_first_person: 我在桓帝朝由太中大夫拜太尉，旋以直道见免；灵帝初受顾命，以太傅录尚书事，与大将军窦武共谋诛除宦官，事败，为中常侍曹节矫诏所诛，宗族夷灭。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷八
