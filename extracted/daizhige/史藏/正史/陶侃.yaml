  date: '0310'
  year_of: 310
  type: anecdote
  label_zh: 朝夕运甓，以习劳砺志，常语人曰「圣人惜寸阴，况我辈当惜分阴」
- id: guji-陶侃-event-phases-6
  date: '0330'
  year_of: 330
  type: anecdote
  label_zh: 造船木屑竹头皆藏以备用，汉口移营课农，久之为世所重
