  archetype: 名将·能臣
  dilemmas:
  - 出身寒微，于门阀执掌的东晋仕途中屡遭猜忌与排抑
  - 苏峻之乱后都督荆湘，权镇上流而志在北伐中原
  lesson: 陶侃惜谷运甓，勤于吏治，以凡庸之资成再造之功
  summary_first_person: 我陶侃少时家贫，由鄱阳郡吏起家，虽屡遭中朝人士轻视，仍以勤慎任职、惜时运甓自励。累迁荆州刺史，平陈敏、平苏峻，再造晋室，位至大将军、都督荆湘等八州诸军事，封长沙郡公。
