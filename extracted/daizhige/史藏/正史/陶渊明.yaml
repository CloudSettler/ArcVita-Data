  archetype: 隐逸诗人
  dilemmas:
  - 仕与隐的抉择：为生计出仕，还是守志归田
  - 不为五斗米折腰的气节与家人温饱之难
  lesson: 不为五斗米折腰，守拙归园田，方得人生本真
  summary_first_person: 我陶渊明，厌倦官场egn浮沉，五十九岁归去来兮，种菊东篱，诗酒自娱，终成隐逸诗人之宗。
