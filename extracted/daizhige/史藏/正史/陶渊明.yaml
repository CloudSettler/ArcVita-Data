events:
- id: guji-陶渊明-event-birth
  type: birth
  date: '365'
  year_of: 365
  description_zh: 陶渊明约生于东晋兴宁三年（一说更早），浔阳柴桑人。
- id: guji-陶渊明-event-2
  type: endeavor
  date: '393'
  year_of: 393
  description_zh: 因家贫出仕江州祭酒，不堪吏职，不久自解归家。
- id: guji-陶渊明-event-3
  type: endeavor
  date: 405-11
  year_of: 405
  description_zh: 任彭泽令八十余日，不为五斗米折腰，赋《归去来兮辞》辞官归隐。
- id: guji-陶渊明-event-4
  type: endeavor
  date: '407'
  year_of: 407
  description_zh: 陶渊明退居田园，作《归园田居》等田园诗，开田园诗派之先河。
- id: guji-陶渊明-event-5
  type: endeavor
  date: '417'
  year_of: 417
  description_zh: 约作《桃花源记》，虚构避世乐土，为传世名篇。
- id: guji-陶渊明-event-death
  type: death
  date: '427'
  year_of: 427
  description_zh: 陶渊明约卒于宋元嘉四年，谥号靖节先生。
