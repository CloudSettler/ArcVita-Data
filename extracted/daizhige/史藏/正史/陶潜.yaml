  summary_first_person: 我陶潜，一名渊明，弃官归隐，以田园诗名世；后世梁代江州刺史萧秀闻我曾孙被用为里司，叹"陶潜之德，岂可不及后胤"，即日辟其为西曹，足见我高洁之名泽被子孙。
