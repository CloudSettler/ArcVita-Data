  birth_date: 1559
  death_date: 1626-09-30
  era: 明末清初
  reign_ref: 天命（1616—1626）
  archetype: 开国之君
  dilemmas:
  - 祖父与父亲死于明兵之手，既欲复仇又须与明周旋通贡
  - 九部联军来犯，以寡敌众
  - 萨尔浒之役四面受敌，须择路先破
  lesson: 隐忍蓄势、忠奸分明，以法治众、以谋制胜，终成建国之业
  summary_first_person: 我少经丧乱，以十三甲起兵，先诛尼堪外兰，次收建州诸部，破九部联军，灭哈达、辉发、乌拉、叶赫，以七大恨伐明，萨尔浒一战破其三路，克沈阳、下辽阳、取广宁，迁都盛京，建国称帝，号天命，用兵三十余年而基业乃定。
  source_urls:
  - 清史稿·本纪一·太祖本纪
