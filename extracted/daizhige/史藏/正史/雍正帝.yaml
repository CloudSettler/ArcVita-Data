events:
- id: guji-努尔哈齐-event-birth
  date: 1559
  year_of: 1559
  name_zh: 努尔哈齐生
  description: 明嘉靖三十八年己未生，母喜塔喇氏宣皇后，孕十三月而生
- id: guji-努尔哈齐-event-起兵
  date: 1583-05
  year_of: 1583
  name_zh: 十三甲起兵讨尼堪外兰
  description: 万历十一年癸未夏五月，以遗甲十三起兵，克图伦城
- id: guji-努尔哈齐-event-九部之战
  date: 1593-09
  year_of: 1593
  name_zh: 古勒山破九部联军
  description: 叶赫纠九部之兵三万来犯，太祖阵斩布斋，大破之，擒布占泰
- id: guji-努尔哈齐-event-称帝
  date: 1616-01
  year_of: 1616
  name_zh: 即位建元天命
  description: 天命元年丙辰正月壬申朔即位，建国号金，上尊号覆育列国英明皇帝
- id: guji-努尔哈齐-event-伐明
  date: 1618-04
  year_of: 1618
  name_zh: 以七大恨伐明陷抚顺
  description: 天命三年壬寅，伐明，祭堂子而行，李永芳降，毁抚顺城
- id: guji-努尔哈齐-event-萨尔浒
  date: 1619-03
  year_of: 1619
  name_zh: 萨尔浒之役破明三路
  description: 四日之内连破杜松、马林、刘綎三路大军，杨镐四路进兵之谋尽败
- id: guji-努尔哈齐-event-灭叶赫
  date: 1619-08
  year_of: 1619
  name_zh: 灭叶赫
  description: 八月己巳征叶赫，缢金台什，杀布扬古，叶赫亡
- id: guji-努尔哈齐-event-下辽阳
  date: 1621-03
  year_of: 1621
  name_zh: 克沈阳、下辽阳
  description: 天命六年三月入沈阳，继破辽阳，袁应泰自焚死，辽人夹道呼万岁
- id: guji-努尔哈齐-event-迁都
  date: 1625-03
  year_of: 1625
  name_zh: 迁都沈阳
  description: 天命十年三月庚午迁都沈阳，是为盛京
- id: guji-努尔哈齐-event-death
  date: 1626-09-30
  year_of: 1626
  name_zh: 崩于爱鸡堡
  description: 宁远受挫后不豫，八月庚戌崩，在位十一年，年六十八，葬福陵，庙号太祖
