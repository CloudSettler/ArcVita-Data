    title_zh: 废昌邑王，定策更立
    rationale: 昭帝崩无嗣，所立昌邑王即位二十七日行淫乱，光奏太后废之，择贤迎立戾太子孙病已
  - date: -68
    title_zh: 薨前请分封兄孙霍山
    rationale: 病笃上书谢恩，宣帝以光功德，封山为乐平侯，拜禹为右将军以安其家
events:
- id: guji-霍光-event-birth
  date_about: -141
  year_of: -141
  name_zh: 出生
  detail_zh: 霍光生年史无明文，据卒时年约六十余推算；字子孟，河东平阳人，骠骑将军霍去病异母弟
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-1
  date_about: -134
  year_of: -134
  name_zh: 以兄霍去病之荫入仕为郎
  detail_zh: 年十余岁，霍去病携其入长安，任郎官，稍迁诸曹侍中，出入禁闼二十余年，小心谨慎，未尝有过
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-2
  date_about: -87
  year_of: -87
  name_zh: 受遗诏辅少主
  detail_zh: 武帝病笃，立少子弗陵为皇太子，赐周公负成王朝诸侯图画，拜光为大司马大将军，与金日磾、上官桀受遗诏辅少主
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-3
  date_about: -80
  year_of: -80
  name_zh: 翦灭上官桀、燕王旦之乱
  detail_zh: 上官桀父子、桑弘羊与燕王旦、盖长公主谋诛光废帝，事觉，光与丞相奏族诛之，燕王旦、盖长公主皆自杀
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-4
  date_about: -74
  year_of: -74
  name_zh: 废昌邑王贺
  detail_zh: 昭帝崩无嗣，光迎立昌邑王贺；贺即位二十七日行淫乱，光与群臣奏太后，废贺，归昌邑
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-6
  date_about: -74
  year_of: -74
  name_zh: 迎立宣帝，权倾朝野
  detail_zh: 迎立戾太子皇曾孙病已为帝，是为宣帝；光稽首归政，帝谦让委任，事皆先关白光；宣帝若芒刺在背
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-5
  date_about: -68
  year_of: -68
  name_zh: 病笃薨逝
  detail_zh: 地节二年春病笃，宣帝亲临问疾；光薨，谥宣成侯，赐黄金百斤、东园温明，葬茂陵东
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-death
  date_about: -68
  year_of: -68
  name_zh: 去世
  detail_zh: 前汉书卷六十八载霍光地节二年薨
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
- id: guji-霍光-event-7
  date_about: -66
  year_of: -66
  name_zh: 霍氏谋反族诛
  detail_zh: 光子禹、侄孙云、山及婿显等谋反，事觉族诛，皇后霍成君废处昭台宫；宣帝图画功臣，光仍居麒麟阁第一
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
