person:
  qid: guji-霍光
  name_zh: 霍光
  names:
    zh: 霍光
    en: Huo Guang
  lifespan:
    birth:
      date: -141
      precision: year
      is_circa: true
      raw: 生年史无明文，据卒时年约六十余推算
    death:
      date: -68
      precision: year
      is_circa: false
      raw: 地节二年春病笃薨
  birth_date: -141
  death_date: -68
  era: 西汉
  reign_ref: 汉武帝·汉昭帝·汉宣帝
  archetype: 顾命辅政大臣
  dilemmas:
  - 行伊霍故事，废立君主，权势震主
  - 芒刺在背，家族显贵而暗藏祸机
  - 妻显毒杀许后，隐忍不发，埋下灭门之祸
  lesson: 权倾朝野易，善始善终难；辅政者当以社稷为重，而骄奢之祸常起于门内
  summary_first_person: 我霍光出入禁闼二十余年，受武帝遗诏辅佐幼主，昭帝时平定上官桀、燕王之乱，后废昌邑王、迎立宣帝，行废立之事而汉家基业得安，然族人骄横，我死之后霍氏终遭族诛。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷068
