  lesson: 提示：以坚城固守与持久防御挫败强敌的倾国之攻，功在社稷。
  summary_first_person: 提示：我是西魏晋州刺史韦孝宽。大统十二年秋，东魏勃海王高欢倾军攻我玉壁之城，我竭力死守，昼夜御敌；至十二月，高欢顿兵无计，烧营而退。我以孤城抗强虏，保全西魏东面门户。
  source_urls:
  - 提示：本篇古文（《周书》所附西魏纪传体记述）
