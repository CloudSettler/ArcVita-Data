person:
  qid: guji-韩延徽
  name_zh: 韩延徽
  names:
    zh: 韩延徽
    en: Han Yanhui
  lifespan:
    birth:
      date: 0882
      precision: year
      is_circa: true
      raw: 据《辽史》本传卒年七十八逆推，约生于唐中和年间
    death:
      date: 0959
      precision: year
      is_circa: false
      raw: 辽应历九年（959）卒，年七十八
  birth_date: 0882
  death_date: 0959
  era: 唐末五代—辽初（契丹开国时期）
  reign_ref: 历辽太祖、太宗、世宗、穆宗四朝；本卷所系事在太祖天显元年
  archetype: 仕于北族王朝的汉地辅弼谋臣
  dilemmas:
  - 节与命——奉使契丹被拘，不拜则困辱、拜则失臣节
  - 孝与忠——潜归后唐以怀乡，终又返辽以全知遇
  - 华与夷——以汉地衣冠之臣佐契丹开基，济世之功与故国之思难两全
  lesson: 在两难中先守其大者，才略终有施展之地；恩义与故土可以并存，唯须自择而自承。
  summary_first_person: 吾字藏明，幽州安次人。初佐刘守光，奉使契丹见留，不拜而牧马，后以筹策见知，立参军事，攻党项、室韦多出吾谋。吾请树城郭、分市里以居汉民，定配偶、教垦艺，降人遂安。中间亡归后唐，复自念忘亲非孝、弃君非忠，毅然北还，太祖赐名匣列。天显元年从征渤海，与康默记同攻长岭府。其后历仕四朝，官至南面重臣，应历九年以寿终，年七十八。
  source_urls:
  - https://zh.wikisource.org/wiki/遼史/卷002
  - https://zh.wikisource.org/wiki/遼史/卷075
