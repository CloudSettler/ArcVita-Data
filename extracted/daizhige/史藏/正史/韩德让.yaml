  dilemmas:
  - 强敌围城之际，既须安抚人心，又须力保城池，兼顾军民而不敢懈怠
  lesson: 居危能安众，守土见忠勤，抚民自有其功。
  summary_first_person: 我韩德让出身辽廷汉臣之家。乾亨元年宋主亲征围南京，我以权知南京留守事守御城池，安定人心，与耶律学古、刘弘同受诏褒奖。乾亨三年十二月，我自辽兴军节度使升任南院枢密使，跻身枢要。
