- id: guji-韩愈-event-guwen-start
  date: 0792
  year_of: 0792
  type: endeavor
  endeavor_id: guji-韩愈-endeavor-1
  title_zh: 登进士第，倡古文之学
  description: 贞元八年韩愈登进士第，此后倡为古文，力反骈俪，与柳宗元共兴古文运动，欲复三代两汉之文与孔孟之道。
- id: guji-韩愈-event-fenggu-bian
  date: 0819
  year_of: 0819
  type: endeavor
  endeavor_id: guji-韩愈-endeavor-2
  title_zh: 谏迎佛骨，贬潮州刺史
  description: 元和十三年十二月宪宗迎佛骨于凤翔，明年正月迎入大内供养；韩愈上《论佛骨表》极谏，宪宗怒，几处死，赖裴度等救，贬为潮州刺史。文中"昔韩愈言"之语即其史论为世人所重之证。
- id: guji-韩愈-event-death
  date: '0824-12-25'
  year_of: 0824
  type: death
  title_zh: 韩愈去世
  description: 长庆四年十二月，韩愈卒于长安靖安里，官终吏部侍郎，谥曰文，世称韩文公。
