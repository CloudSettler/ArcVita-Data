  - 著书明法术而终为同门李斯所构
  lesson: 著书立说可传后世，然法术之学不见用于故国，反致杀身
  summary_first_person: 我为韩国宗室公子，口吃不能道说而善著书，与李斯同事荀卿，作孤愤、五蠹等篇，秦王读而慕之；既出使于秦，为李斯、姚贾所害，死于云阳狱中，而法家之学由是益显。
