  year_of: -280
  title_zh: 韩非约生于战国末年
  description_zh: 韩之诸公子也，与李斯俱事荀卿，斯自以为不如非。
- id: guji-hanfei-event-study
  event_type: endeavor
  date: -260
  year_of: -260
  title_zh: 与李斯同师荀卿
  description_zh: 非见韩之削弱，数以书谏韩王，韩王不能用。
  participants:
  - guji-hanfei
- id: guji-hanfei-event-writing
  event_type: endeavor
  date: -240
  year_of: -240
  title_zh: 作孤愤五蠹内外储说等篇
  description_zh: 疾治国不务修明其法制，悲廉直不容于邪枉之臣，故作孤愤、五蠹、内外储、说林、说难十余万言。
- id: guji-hanfei-event-envoy
  event_type: endeavor
  date: -234
  year_of: -234
  title_zh: 韩王遣非使秦
  description_zh: 秦王见孤愤五蠹之书曰得见此人与之游死不恨矣，急攻韩；韩王始不用非，及急乃遣非使秦。
- id: guji-hanfei-event-death
  event_type: death
  date: -233
  year_of: -233
  title_zh: 李斯姚贾毁之，非下狱死
  description_zh: 李斯、姚贾害之，毁之曰非终为韩不为秦；秦王以为然，下吏治非，李斯使人遗非药使自杀，遂死云阳狱中。
