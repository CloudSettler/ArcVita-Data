person:
  qid: guji-xiangliang
  name_zh: 项梁
  names:
    zh: 项梁
    en: Xiang Liang
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 生年未载
    death:
      date: -208
      precision: year
      is_circa: true
      raw: 秦二世二年秋，卒于定陶之役
  death_date: -208
  era: 秦末
  reign_ref: 秦二世
  archetype: 将门遗胤·义军统帅
  dilemmas:
  - 立牧羊儿熊心为楚怀王可从民望、聚楚地蜂起之众，然楚之法统既立，异日终为项氏之制
  - 东阿雍丘连捷、再破秦军，益轻秦有骄色，宋义谓战胜而将骄卒惰者败，弗听，竟以定陶之殁验之
  - 不忍杀穷来归我之田假以要齐兵，信义存而齐援绝，定陶之败东线遂孤
  lesson: 世将之名足以聚众举义，从民所望者众归之；然胜而将骄卒惰者败，纳谏者昌，骄兵速祸。
  summary_first_person: 吾项氏世世为楚将，封于项故姓项氏，父项燕为秦将王翦所戮。吾杀人避仇徙吴中，每有大繇役及丧常为主办，阴以兵法部勒宾客子弟，以知其能。二世元年九月，吾与籍斩会稽假守殷通，举吴中精兵八千；二年渡江而西，并陈婴、英布之众六七万军下邳，击杀背陈王之秦嘉。闻陈王定死，吾纳范增之谋，立楚怀王孙心于民间，自号武信君，从民所望。救东阿、大破秦军，至雍丘斩李由，比至定陶再破秦军。然吾轻秦不听宋义之谏，秦悉起兵益章邯，夜衔枚击我军于定陶，吾遂殁于阵，灭秦之业付之羽儿。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷007
  - https://zh.wikisource.org/wiki/漢書/卷031
