      - 夜衔枚击楚军
    start_date: -208
    highlight_event_id: guji-xiangliang-event-death
  decisions:
  - date: -208
    title_zh: 采纳范增之谋，立楚怀王孙心为楚怀王
    rationale: 秦灭六国楚最无罪，怀王入秦不反楚人怜之至今，楚虽三户亡秦必楚；今君起江东，楚蜂起之将争附者以君世世楚将，为能复立楚之后，乃求怀王孙心于民间牧羊者立之，从民所望，陈婴为上柱国与怀王都盱台
  - date: -208
    title_zh: 弗听宋义将骄卒惰之谏
    rationale: 再破秦军、斩李由，益轻秦有骄色；宋义言战胜而将骄卒惰者败，今卒少惰而秦兵日益，臣为君畏之，梁不听；秦果悉起兵益章邯夜击定陶，军破身死，章邯遂以为楚地兵不足忧而北击赵
events:
- id: guji-xiangliang-event-birth
  title_zh: 项梁出生
  precision: unknown
  is_circa: false
  raw: 生年未载
  summary: 项氏世世为楚将，封于项故姓项氏；梁为楚名将项燕之子、项籍季父。
- id: guji-xiangliang-event-wuzhong
  title_zh: 杀人避仇徙吴中，阴以兵法部勒宾客
  precision: unknown
  is_circa: false
  raw: 年代未载，当在秦二世起兵之前
  summary: 尝有栎阳逮，乃请蕲狱掾曹咎书抵栎阳狱掾司马欣，以故事得已；吴中贤士大夫皆出梁下，每吴中有大繇役及丧常为主办，阴以兵法部勒宾客及子弟，以是知其能。
- id: guji-xiangliang-event-kuaiji
  title_zh: 诱斩会稽假守殷通，举吴中兵八千起事
  date: -209-09
  precision: month
  is_circa: true
  year_of: -209
  raw: 秦二世元年九月
  summary: 会稽假守殷通素贤梁，召与计事欲发兵应陈涉，使公及桓楚将；梁出诫籍持剑居外待，复入请召籍使受令召桓楚，籍入而梁眴之曰可行矣，籍遂拔剑斩守头，梁持守头佩其印绶，门下大惊扰乱，籍击杀数十百人，一府慑伏莫敢起；乃召故所知豪吏谕以所为起大事，举吴中兵使人收下县得精兵八千人，梁为会稽守，籍为裨将徇下县。
- id: guji-xiangliang-event-crossing
  title_zh: 以八千人渡江西进，并陈婴英布之众军下邳
  date: -208
  precision: year
  is_circa: true
  year_of: -208
  raw: 秦二世二年
  summary: 广陵召平为陈王徇广陵未下，闻陈王败走而秦兵又且至，乃渡江矫陈王命拜梁为楚上柱国曰江东已定急引兵西击秦；梁乃以八千人渡江而西，陈婴以东阳二万人来属，英布蒲将军亦以兵属焉，凡六七万人军下邳。
- id: guji-xiangliang-event-qinjia
  title_zh: 击杀秦嘉并其军，景驹走死
  date: -208
  precision: year
  is_circa: true
  year_of: -208
  raw: 秦二世二年
  summary: 秦嘉已立景驹为楚王军彭城东欲距梁；梁谓军吏曰陈王首事战不利未闻所在，今秦嘉背陈王而立景驹大逆无道，乃进兵击秦嘉，嘉军败走追至胡陵，嘉还战一日而死，军降，景驹走死梁地，梁已并秦嘉军军胡陵将引兵而西。
- id: guji-xiangliang-event-xue
  title_zh: 薛城会盟，立楚怀王孙心，自号武信君
  date: -208
  precision: year
  is_circa: true
  year_of: -208
  raw: 秦二世二年
  summary: 闻陈王定死，召诸别将 会薛计事，沛公亦起从沛往；居鄛范增年七十好奇计，往说梁曰楚虽三户亡秦必楚，今君起江东楚蜂起之将皆争附君者，以君世世楚将为能复立楚之后也；梁然其言，乃求楚怀王孙心在民间为人牧羊者，立以为楚怀王，从民所望；陈婴为楚上柱国封五县，与怀王都盱台，梁自号武信君。
- id: guji-xiangliang-event-victories
  title_zh: 救东阿大破秦军，雍丘斩李由，再破秦军至定陶
  date: -208
  precision: year
  is_circa: true
  year_of: -208
  raw: 秦二世二年
  summary: 章邯追围田荣于东阿，梁引兵与齐田荣、司马龙且救东阿，大破秦军；使羽与沛公别攻城阳屠之，西破秦军濮阳东，攻定陶未下，西略地至雍丘大破秦军斩李由，还攻外黄未下；梁起东阿西北比至定陶再破秦军，项羽等又斩李由，益轻秦有骄色。
- id: guji-xiangliang-event-death
  title_zh: 定陶之战兵败身死
  date: -208
  precision: year
  is_circa: true
  year_of: -208
  raw: 秦二世二年秋
  summary: 宋义谏曰战胜而将骄卒惰者败，今卒少惰而秦兵日益，臣为君畏之，梁不听；秦果悉起兵益章邯，夜衔枚击楚军，大破之于定陶，项梁死；章邯已破项梁军，则以为楚地兵不足忧，乃渡河北击赵，沛公与项羽引兵而东。
