  - date: -209-09
    title_zh: 借召见桓楚之名诱斩殷通，夺会稽而起兵
    rationale: 假守殷通虽欲发兵应陈涉，然兵权在人；梁出诫籍持剑居外，复入请召籍使受令，眴籍曰可行矣，籍遂拔剑斩守头，梁持守头佩其印绶，一府慑伏，乃举吴中兵得精兵八千，自为会稽守，起事主导权归于项氏
  - date: -208
    title_zh: 渡江西进，受陈婴英布之众
    rationale: 召平矫陈王命拜梁为楚上柱国令急引兵西击秦；陈婴以项氏世世将家有名于楚、倚名族亡秦必矣，以其兵二万属梁，英布蒲将军亦以兵属焉，众至六七万军下邳
  - date: -208
    title_zh: 不忍杀田假以要齐兵
    rationale: 田假穷来归我，不忍杀之，赵亦不杀田角田间以市于齐；齐遂不肯发兵助楚，东阿之后齐楚失和，定陶之败遂无东援
- id: guji-xiangliang-endeavor-2
  name_zh: 复立楚祀与西征破秦
  phases:
  - key: brewing
