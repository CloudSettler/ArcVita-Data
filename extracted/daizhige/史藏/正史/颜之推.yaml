- id: guji-颜之推-event-advice
  type: political_advice
  date: 0577-01
  year_of: 577
  precision: month
  name_zh: 与薛道衡、陈德信劝奔河外
  description_zh: 北齐幼主承光初，黄门侍郎颜之推与中书侍郎薛道衡、侍中陈德信等劝太上皇帝往河外募兵，更为经略，若不济则南投陈国，太上皇从之；未几周师至，齐亡。
- id: guji-颜之推-event-witness-fall
  type: fall_of_dynasty
  date: 0577-01
  year_of: 577
  precision: month
  name_zh: 亲历北齐覆亡
  description_zh: 周军逼近邺城，幼主东走，太上皇携后妃逃青州，终为周将尉迟纲所获，颜之推随朝廷覆亡而失所依。
- id: guji-颜之推-event-death
