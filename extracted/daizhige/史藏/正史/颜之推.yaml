  era: 南北朝至隋初
  reign_ref: 北齐后主隆化至北周建德、隋开皇年间
  archetype: 忧愤士人·历仕三朝的学者
  dilemmas:
  - 家国倾覆之际，仕齐、仕周、仕隋，忠节与时势难以两全
  - 劝幼主朝廷南投陈国，谋存社稷而终不得济
  lesson: 乱世之中，学问与持守是最可依托的传家之业
  summary_first_person: 我历仕梁、齐、周、隋四朝，身经国破家迁。北齐将亡时，我任黄门侍郎，与薛道衡、陈德信劝太上皇往河外募兵，不济则南投陈国，惜计未成而国已灭。后半生以著述自守，教育子孙，唯愿耕读之业、文墨之训传之久远。
  source_urls:
  - https://zh.wikisource.org/wiki/北齐书/卷8
