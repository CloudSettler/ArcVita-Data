    rationale: 见光武"恢廓大度，常恐出世GRES之心"而认定真主
  - date: '40'
    title_zh: 自请将兵讨交趾
    rationale: 二征反叛，援以'丈夫虽年尽，亦当有以报国'自许
events:
- id: guji-马援-event-birth
  date: -14
  year_of: -14
  type: birth
  title_zh: 降于扶风茂陵
  description: 马援生于扶风茂陵，字文渊。
- id: guji-马援-event-decision-gui-hao-gui-han
  date: '28'
  year_of: 28
  type: decision
  title_zh: 舍隗嚣而归光武
  description: 马援奉命往洛阳观光武，见其恢廓大度，遂决意弃隗嚣，归于刘秀。
- id: guji-马援-event-longxi-ping-qiang
  date: '33'
  year_of: 33
  type: battle
  title_zh: 陇西击破先零羌
  description: 马援为陇西太守，亲击先零诸羌，肃清边地，用人勇略相称。
- id: guji-马援-event-jiao-chi-ping-ding
  date: '41'
  year_of: 41
  type: achievement
  title_zh: 交趾克捷、铜柱纪功
  description: 拜伏波将军，与楼船军并进，斩征侧、征贰，于象林立铜柱为华夷之界，还封新息侯。
- id: guji-马援-event-ma-ge-xiang-shi
  date: '37'
  year_of: 37
  type: statement
  title_zh: 「马革裹尸」之誓
  description: 武陵蛮反时，援年逾六旬，"据鞍顾眄，以示可用"，曰"男儿要当死于边野，以马革裹尸还葬"。
- id: guji-马援-event-wu-xi-bing-jun
  date: '49'
  year_of: 49
  type: death
  title_zh: 五溪瘴疠，卒于壶头
  description: 马援抱病率军征武陵五溪蛮，困于壶头，病卒于军中，享年六十余。
- id: guji-马援-event-shen-hou-meng-chan
  date: '50'
  year_of: 50
  type: aftermath
  title_zh: 身后遭谗、魂不得还
  description: 虎贲中郎将梁松诬援于帝，光武震怒，援家人不得还葬于其先茔，云台二十八将不着援名。
