person:
  qid: guji-马援
  name_zh: 马援
  names:
    zh: 马援
    en: Ma Yuan
  lifespan:
    birth:
      date: -14
      precision: year
      is_circa: true
      raw: 约西汉成帝年间（据《后汉书·马援列传》享年八十二逆推，恐过实，姑约为公元前后）
    death:
      date: '49'
      precision: year
      is_circa: false
      raw: 建武二十五年，卒于征武陵五溪军中
  birth_date: -14
  death_date: '49'
  era: 两汉之际（新莽末年至东汉光武帝建武年间）
  reign_ref: 汉光武帝（刘秀，建武）
  archetype: 功成不居、马革裹尸的老将
  dilemmas:
  - 应效忠更始、隗嚣，还是归顺光武
  - 功高遭谤，身后蒙冤难雪
  lesson: 穷当益坚，老当益壮；男儿当以马革裹尸还葬
  summary_first_person: 我马援，文渊，扶风茂陵人也。当乱时许诺"穷当益坚，老当益壮"，最终弃隗嚣而归光武，为伏波将军平陇西羌、定交趾二征，铜柱表功。晚年抱病南征武陵五溪，卒于军中；身后遭谗，几不得还冢，唯忠骨之名与铜柱并峙。
  source_urls:
  - https://zh.wikisource.org/wiki/後漢書/卷24
