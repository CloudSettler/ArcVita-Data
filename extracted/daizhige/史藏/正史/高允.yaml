  lesson: 儒者守正，虽逢乱世而不改其节
  summary_first_person: 我高允，渤海蓨人也。太武一朝，司徒崔浩称我与州邦俊秀，以礼征我入仕。我以经术佐政，历事五帝，直言不讳，虽临刑而不改其辞，卒为国之杖，年九十八而终。
