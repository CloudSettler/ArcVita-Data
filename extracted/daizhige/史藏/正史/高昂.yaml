events:
- id: guji-高欢-event-birth
  date: ''
  year_of: 495
  type: 出生
  summary_zh: 生年史无明载， Hunish 出身怀朔镇兵户。
- id: guji-高欢-event-estab-jinyang
  date: '-531'
  year_of: 531
  type: 事业
  summary_zh: 建牙阳曲川，统率州镇兵，晋阳格局初成。
- id: guji-高欢-event-xindu-juyi
  date: 531-06
  year_of: 531
  type: 事业
  summary_zh: 六月庚子，建义于信都，据冀州，自军次信都高乾、封隆之开门以待。
- id: guji-高欢-event-hangling
  date: 532-04
  year_of: 532
  type: 战争
  summary_zh: 韩陵为圆阵，连牛驴塞归道，大破尔朱氏二十万联军。
- id: guji-高欢-event-chihongling
  date: 533-01
  year_of: 533
  type: 战争
  summary_zh: 遣窦泰精骑一日一夜行三百里追至赤洪岭，尔朱兆自缢，神武亲临厚葬之。
- id: guji-高欢-event-luoyang-entered
  date: 534-08
  year_of: 534
  type: 事业
  summary_zh: 己酉入洛阳，停永宁寺，魏帝西奔长安。
- id: guji-高欢-event-qianye
  date: '534'
  year_of: 534
  type: 政治
  summary_zh: 立孝静帝迁都邺，魏于是始分为二，军国政务皆归相府。
- id: guji-高欢-eventheyin
  date: 538-08
  year_of: 538
  type: 战争
  summary_zh: 河阴之战大破西魏军，俘获数万，司徒高昂死之。
- id: guji-高欢-event-mangshan
  date: 543-03
  year_of: 543
  type: 战争
  summary_zh: 芒山之战大败周文，俘斩六万，几为贺拔胜所逐。
- id: guji-高欢-event-yubi
  date: 546-11
  year_of: 546
  type: 战争
  summary_zh: 围玉壁不下，大雪士卒多死，乃班师。
- id: guji-高欢-event-death
  date: ''
  year_of: 547
  type: 去世
  summary_zh: 东西对峙终成鼎足之势后病卒，未尽之业。
