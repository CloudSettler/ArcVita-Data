  - 忠于魏室还是自专大政
  - 与孝武帝决裂后如何另立新君
  - 对西魏战和两难
  lesson: 乘势而起者亦受时势所限
  summary_first_person: 我起于尔朱氏帐下，借六镇降户举义信都，破尔朱兆于韩陵，坐镇晋阳执掌东魏国政，与西魏鏖战沙苑、河阴、芒山而终未能一统，终生为霸业鞠躬尽瘁。
