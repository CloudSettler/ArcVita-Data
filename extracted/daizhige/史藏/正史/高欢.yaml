  decisions:
  - date: 531-06
    title_zh: 起兵信都，以诛尔朱氏为名
    rationale: 普泰政出尔朱，天下怨望，借此名可聚河北之众
  - date: 531-10
    title_zh: 推立勃海太守元朗为帝于信都
    rationale: 别立幼主以主号令，而己为丞相都督中外诸军事，握实权
  - date: 532-04
    title_zh: 废节闵帝于崇训佛寺，改立平阳王修
    rationale: 魏兰根忌帝雅德而毁谤之，遂从崔陵议，择易制者而立
  - date: 534-10
    title_zh: 迁都邺城，立清河王亶子善见为东魏主
    rationale: 孝武西奔长安，洛阳孤悬，遂徙都专掌朝政，魏始分为二
- id: guji-高欢-endeavor-2
  key_role: 与西魏争夺关东关西
  phases:
  - key: brewing
    name_zh: 河桥相持
