    start_date: 537-10
    highlight_event_id: guji-高欢-event-shayuan
  - key: climax
    name_zh: 围攻玉壁
    labels:
      zh: 顿兵坚城
    start_date: 546-09
    highlight_event_id: guji-高欢-event-yubi
  - key: closure
    name_zh: 病殁授政
    labels:
      zh: 薨，子澄继权
    start_date: 547-01
    highlight_event_id: guji-高欢-event-death
  decisions:
  - date: 534-08
    title_zh: 引军东度、追击西奔孝武帝
    rationale: 不容孝武挟关中之兵而制己
  - date: 546-09
    title_zh: 攻玉壁
    rationale: 欲先拔河东重镇再图关中，然晋州刺史韦孝宽力战御之，遂烧营而退
events:
- id: guji-高欢-event-birth
  event_type: birth
  date: ''
  year_of: 496
  precision: circa
  summary_zh: 高欢生年史无明文，出生约在北魏中期
- id: guji-高欢-event-zhaoshu
  event_type: political_maneuvering
  date: 531-03
  year_of: 531
  precision: year
  summary_zh: 普泰元年，节闵帝以晋州刺史、平阳郡公高欢为勃海王，高欢受封而潜蓄大志
- id: guji-高欢-event-qibing
  event_type: military_campaign
  date: 531-06
  year_of: 531
  precision: month
  summary_zh: 勃海王高欢起兵信都，以诛尔朱氏为名，河北群雄响应
- id: guji-高欢-event-yuanlang
  event_type: enthronement_arranged
  date: 531-10-28
  year_of: 531
  precision: day
  summary_zh: 十月壬寅，高欢推勃海太守元朗即皇帝位于信都，改元中兴，以高欢为丞相
- id: guji-高欢-event-guang'a
  event_type: military_victory
  date: 531-11
  year_of: 531
  precision: month
  summary_zh: 中兴元年辛亥，高欢大破尔朱兆于广阿
- id: guji-高欢-event-hanling
  event_type: decisive_battle
  date: 532-02
  year_of: 532
  precision: month
  summary_zh: 中兴二年闰二月，高欢败尔朱天光等尔朱氏诸军于韩陵，尔朱氏势力土崩瓦解
- id: guji-高欢-event-feijieming
  event_type: dethronement_arranged
  date: 532-04
  year_of: 532
  precision: day
  summary_zh: 四月辛巳，高欢与废帝至芒山，遣魏兰根察节闵帝为人，兰根毁谤之，遂废帝于崇训佛寺，立平阳王修为孝武帝
- id: guji-高欢-event-xiaowu
  event_type: enthronement_arranged
  date: 532-05
  year_of: 532
  precision: month
  summary_zh: 高欢遣斛斯椿求孝武帝，备仪奉迎，于东郭之外以黑毡蒙七人之旧制拥立即位
- id: guji-高欢-event-tongguan
  event_type: military_campaign
  date: 534-08
  year_of: 534
  precision: month
  summary_zh: 孝武西奔，高欢追车驾至潼关，九月己酉东还洛阳，后推清河王亶子善见为主，徙都邺，是为东魏
- id: guji-高欢-event-shayuan
  event_type: military_defeat
  date: 537-10
  year_of: 537
  precision: month
  summary_zh: 大统三年十月，西魏安定公宇文泰于沙苑大破东魏军，高欢东政受挫
- id: guji-高欢-event-yubi
  event_type: military_campaign
  date: 546-09
  year_of: 546
  precision: month
  summary_zh: 冬九月，勃海王高欢攻玉壁，晋州刺史韦孝宽力战御之，欢久攻不克，十二月烧营而退
- id: guji-高欢-event-death
  event_type: death
  date: 547-01
  year_of: 547
  precision: year
  summary_zh: 大统十三年春正月，东魏勃海王高欢薨，其司徒侯景随后据颍川以河南诸州内附西魏
