person:
  qid: guji-高欢
  name_zh: 高欢
  names:
    zh: 高欢
    en: Gao Huan
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: '547'
      precision: year
      is_circa: false
      raw: 十三年春正月……东魏勃海王欢薨
  birth_date: ''
  death_date: '547'
  era: 北魏末至东魏
  reign_ref: 东魏勃海王、大丞相
  archetype: 权臣与军事霸主
  dilemmas:
  - 诛尔朱氏可雪耻，然挟主立君则失人臣之节
  - 西迎魏帝则受制，迁移邺都则魏分东西、兵连祸结
  lesson: 乱世权柄可自军功与拥立而得，然失信于君臣之义者，终使天下分裂、伐兵不休
  summary_first_person: 我高欢起于信都，以诛尔朱氏为名起兵，韩陵一战胜之，遂立元朗、废帝而立孝武，权倾朝野；孝武西奔宇文泰，我迁孝静帝都邺，魏于是分为东西；我据山东，屡攻玉壁而不得，终以勃海王大丞相之尊薨于晋阳，子澄、洋继之而代魏建齐。
  source_urls:
  - https://zh.wikisource.org/wiki/魏書/卷11
