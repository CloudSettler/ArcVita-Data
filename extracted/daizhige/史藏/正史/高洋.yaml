    title_zh: 斩乱丝以明心志
    rationale: 面对父试诸子治乱丝，独抽刀斩之，曰“乱者须斩”，以果决得高欢赏识。
  - date: '0547'
    title_zh: 受任尚书令、京畿大都督
    rationale: 在东魏朝廷累迁至尚书令、中书监、京畿大都督，内虽明敏而外示愚钝，避兄文襄之猜。
- id: guji-高洋-endeavor-2
