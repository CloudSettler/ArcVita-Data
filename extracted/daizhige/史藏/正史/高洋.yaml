    start_date: '0550'
    highlight_event_id: guji-高洋-event-shouchan
  - key: closure
    name_zh: 天保之治与晚年骄纵
    labels:
      zh: 兴学劝农 / 渐至暴虐
    start_date: '0550'
    highlight_event_id: guji-高洋-event-shizheng
  decisions:
  - date: 0549-08
    title_zh: 秘不发丧、亲总庶政
    rationale: 文襄遇盗而殂，事出仓卒； 泄丧机将致内乱，故秘之，徐出言安众，旋赴晋阳总揽政务。
  - date: '0550'
    title_zh: 受魏禅即皇帝位
    rationale: 魏帝以天人之望有归下诏禅位； 势已成、命已合，遂升坛柴燎告天，建国大齐。
events:
- id: guji-高洋-event-birth
  date: '0529-01-01'
  year_of: 0529
  title_zh: 高洋出生
  detail_zh: 显祖文宣皇帝讳洋，字子进，高祖欢第二子，世宗澄之母弟，约529年生。
- id: guji-高洋-event-zhansi
  date: '0545-01-01'
  year_of: '0545'
  title_zh: 抽刀斩乱丝，得父器重
  detail_zh: 高欢试诸子意识，各使治乱丝，帝独抽刀斩之曰“乱者须斩”，又勒众擒彭乐以献，高欢谓此儿意识过吾。
- id: guji-高洋-event-guansi
  date: '0547-04-12'
  year_of: '0547'
  title_zh: 授尚书令、中书监、京畿大都督
  detail_zh: 武定五年，授尚书令、中书监、京畿大都督，位望日隆，而内虽明敏，貌若不足。
- id: guji-高洋-event-pingluan
  date: '0549-08-22'
  year_of: 0549
  title_zh: 文襄遇害，讨贼理事
  detail_zh: 武定七年八月世宗遇盗而殂，帝神色不变，指麾部分，脔斩兰京等群贼而漆其头，秘不发丧，旋赴晋阳亲总庶政，务从宽厚。
- id: guji-高洋-event-shouchan
  date: '0550-06-07'
  year_of: '0550'
  title_zh: 受禅即位，建国大齐
  detail_zh: 武定八年五月戊午，即皇帝位于南郊，升坛柴燎告天；魏帝逊于别宫，归帝位于齐；改武定八年为天保元年，大赦天下。
- id: guji-高洋-event-shizheng
  date: '0550-09-10'
  year_of: '0550'
  title_zh: 立学劝农、封爵建政
  detail_zh: 天保元年诏郡国修立黉序、敦述儒风，移蔡邕石经置学馆；劝课农桑以备水旱；封功臣宗室诸王，立子殷为皇太子、李氏为皇后。
- id: guji-高洋-event-death
  date: '0559-10-19'
  year_of: 0559
  title_zh: 高洋驾崩
  detail_zh: 天保十年，帝崩，庙号显祖（初号高祖，本文所据前卷系统记其追谥世系），史称暴而能治、功过参半之一代雄主。
