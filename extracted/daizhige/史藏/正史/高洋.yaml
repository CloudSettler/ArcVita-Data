person:
  qid: guji-高洋
  name_zh: 高洋
  names:
    zh: 高洋
    en: Gao Yang
  lifespan:
    birth:
      date: 0529
      precision: year
      is_circa: true
      raw: 时年三十一（天保十年，559年去世反推，约529年生）
    death:
      date: 0559
      precision: year
      is_circa: false
      raw: 天保十年崩（559年）
  birth_date: 0529（约）
  death_date: 0559
  era: 东魏—北齐（六世纪中叶）
  reign_ref: 北齐文宣帝（天保元年550年受禅，至559年）
  archetype: 开国之君/由隐忍而至暴虐的雄主
  dilemmas:
  - 装愚晦迹以避兄猜，还是显露锋芒自谋前程
  - 受禅代魏以定新朝，还是谨守臣节保全魏室名义
  - 励精图治与纵欲肆虐于一身，功业与暴行并存
  lesson: 深沉晦迹可蓄势于暗，斩乱之断可成开国之业；然权在手而不制于德，雄主亦可堕为暴君—— făi 水能载舟，亦能覆舟，况乎人主自覆。
  summary_first_person: 我高洋，字子进，献武高欢第二子。幼时沉晦不言，貌若不足，人皆轻我，唯先父谓我意识过人。我以“乱者须斩”之断得父器重，历散骑常侍、尚书令、京畿大都督。兄文襄遇害，我仓卒讨贼，漆截凶首，秘不发丧，神色不乱，遂总庶政。次年受魏禅，即皇帝位于南郊，建国大齐，改元天保。在位之初，修刑政、立学馆、劝农桑、征四夷，颇称英武；然居久渐骄，嗜杀纵酒，功过并著于史。
  source_urls:
  - https://zh.wikisource.org/wiki/北齊書/卷4
  - https://zh.wikisource.org/wiki/北齊書/卷5
