person:
  qid: guji-高澄
  name_zh: 高澄
  names:
    zh: 高澄 / 世宗文襄皇帝
    en: Gao Cheng / Emperor Wenxiang of Northern Qi
  lifespan:
    birth:
      date: '520'
      precision: year
      is_circa: true
      raw: 尚孝静帝妹冯翊长公主，时年十二（天平二年，约十二岁）
    death:
      date: 549-08
      precision: month
      is_circa: false
  birth_date: 约公元520年
  death_date: 公元549年（武定七年七月，遇盗而殂）
  era: 东魏
  reign_ref: 东魏渤海王世子、大将军、大丞相；追谥文襄皇帝，庙号世宗
  archetype: 权臣世子与改革者
  dilemmas:
  - 少年执政，以严明机略服众，须在神武盈庭的勋旧之下树立权威
  - 对侯景叛乱用书诈诱降与离间梁朝双管齐下，忠与诈的边界
  - 权势极盛，凌辱孝静帝，同时也为受禅做准备，君臣名分与实力背离
  - 疏于防备庖厨之下的兰京，宠遇琅邪公主而尽撤侍卫
  lesson: 铨擢得人、纠劾权豪可以整肃朝野，但轻慢小人、侍卫尽出，祸常起于厨房。
  summary_first_person: 我是高澄，字子惠，神武长子。十二岁尚公主、预军国筹策，天平年间入辅朝政，朝野振肃。我改崔亮年劳之制，铨擢唯在得人，奏崔暹为中尉纠劾权豪，风俗一变。神武崩后我秘不发丧，平侯景之叛，又遗书诱景、反间于梁。我劝魏帝酒而辱之，权位至此几于受禅，然而武定七年遇盗兰京于柏堂而殂，时年二十九，实有大志未竟耳。
endeavors:
- id: guji-高澄-endeavor-1
  name_zh: 少年辅政与铨选改革
  phases:
  - key: brewing
    name_zh: 立世子预政
    labels:
      zh: 世子听政
    start_date: '534'
    highlight_event_id: guji-高澄-event-minister
  - key: breakthrough
    name_zh: 入辅朝政、朝野振肃
    labels:
      zh: 入辅朝政
    start_date: '536'
    highlight_event_id: guji-高澄-event-selection
  - key: climax
    name_zh: 沙汰尚书郎、荐擢才名之士
    labels:
      zh: 铨擢得人
    start_date: '539'
    highlight_event_id: guji-高澄-event-censor
  - key: closure
    name_zh: 承神武之位、总揽军国
    labels:
      zh: 秉政秉国
    start_date: '547'
    highlight_event_id: guji-高澄-event-succession
  decisions:
  - date: '539'
    title_zh: 厘改崔亮年劳之制，铨擢唯在得人
    rationale: 魏自崔亮以后选人以年劳，文襄厘改前式，专以得贤为务；又沙汰尚书郎、妙选人地。
  - date: '540'
    title_zh: 奏崔暹为御史中尉，纠劾权豪
    rationale: 正光之后天下多事，在任群官廉洁者寡，故开直言之路，以肃风俗。
  - date: '544'
    title_zh: 上言幽、安、定三州北接奚、蠕蠕，修险要城戍
    rationale: 躬自临覆北边防务，以固疆场。
- id: guji-高澄-endeavor-2
  name_zh: 经营北齐基业与平侯景
  phases:
  - key: brewing
    name_zh: 秘不发丧、平侯景
    labels:
      zh: 秀容秘丧
    start_date: '547'
    highlight_event_id: guji-高澄-event-succession
  - key: breakthrough
    name_zh: 大权独揽
    labels:
      zh: 河阴之变
    start_date: '548'
    highlight_event_id: guji-高澄-event-offend
  - key: climax
    name_zh: 布置受禅、代魏在即
    labels:
      zh: 署拟百官
    start_date: '549'
    highlight_event_id: guji-高澄-event-usurp
  - key: closure
    name_zh: 遇盗柏堂、为人所杀
    labels:
      zh: 柏堂之祸
    start_date: '549'
    highlight_event_id: guji-高澄-event-death
  decisions:
  - date: 547-01
    title_zh: 神武崩后秘不发丧，自为书以诱侯景
    rationale: 恐四方未定，四邻闻丧欲趁机而动；又景久专制河南，必叛，故以书误之、离间于梁。
  - date: 547-07
    title_zh: 启辞位、愿停王爵以固权柄
    rationale: 魏帝诏令固辞丞相、夺情不理，以推让而收朝野之心。
  - date: 549-08
    title_zh: 撤侍卫以回避琅邪公主来往
    rationale: 北城东柏堂莅政，宠琅邪公主，欲其来往无所避忌，遂致祸起萧墙。
events:
- id: guji-高澄-event-death
  name_zh: 遇盗兰京而殂于北城东柏堂
  date: '549'
  year_of: 549
  event_type: death
  description: 武定七年七月辛卯、时年二十九，兰京挥刀曰来将杀汝，乘乱除之；秘不发丧、年二十九葬峻成陵；齐受禅追谥文襄皇帝、庙号世宗。
