person:
  qid: guji-高欢
  name_zh: 高欢
  names:
    zh: 高欢、贺六浑、齐高祖神武皇帝
    en: Gao Huan
  lifespan:
    birth:
      date: 0496
      precision: year
      is_circa: true
      raw: 约北魏太和年间生于渤海蓚（怀朔镇成长）
    death:
      date: 359
      precision: year
      is_circa: false
      raw: 东魏武定五年正月卒于晋阳
  birth_date: 0496
  death_date: 0547-01
  era: 北魏末—东魏
  reign_ref: 未称帝，为东魏大丞相、渤海王，子高洋建北齐后追尊为高祖神武皇帝
  archetype: 雄杰权臣·开国之基
  dilemmas:
  - 名为魏臣而实握废立之权，忠义与代魏野心如何自处
  - 与孝武帝君臣相疑，终致分裂为东西魏
  - 六镇降众难制，须以恩威并施纳为己用
  lesson: 乘势而起者，亦为势所拘——一生澄清天下之志终止于晋阳霸府，未能亲履帝位。
  summary_first_person: 我高欢，字贺六浑，起于怀朔镇户，以察时变、结豪杰起兵信都，破尔朱氏于韩陵，立孝武帝而迁都于邺，拥兵晋阳与关中宇文氏相持，身殁而子业成，开北齐之基。
  source_urls:
  - https://zh.wikisource.org/wiki/北齊書/卷1
  - https://zh.wikisource.org/wiki/北齊書/卷2
endeavors:
- id: guji-高欢-endeavor-1
  name_zh: 起兵讨灭尔朱氏、奠定霸业
  phases:
  - key: brewing
    name_zh: 边镇蓄志
    labels:
      zh:
      - 队主函使
      - 结交奔走之友
    start_date: '0525'
    highlight_event_id: guji-高欢-event-funai
  - key: breakthrough
    name_zh: 信都建义
    labels:
      zh:
      - 举兵信都
      - 立中兴帝
    start_date: 0531-06
    highlight_event_id: guji-高欢-event-xindu
  - key: climax
    name_zh: 韩陵破兆
    labels:
      zh:
      - 圆阵死战
      - 尔朱氏覆灭
    start_date: '0532'
    highlight_event_id: guji-高欢-event-hanling
  - key: closure
    name_zh: 定都定霸
    labels:
      zh:
      - 迁邺
      - 晋阳大丞相府
    start_date: 0532-07
    highlight_event_id: guji-高欢-event-jinyang
  decisions:
  - date: 0528
    title_zh: 谏尔朱荣铸像止篡
    rationale: 恐强行篡位不得人心，借铸像卜之使止。
  - date: '0531'
    title_zh: 智取六镇降众兵权
    rationale: 借拳殴贺拔允示忠，骗取尔朱兆委统之权，收二十余万流民为已用。
  - date: 0532-04
    title_zh: 韩陵连牛驴塞归道
    rationale: 众寡不敌，置之死地而后生，激发将士死志。
- id: guji-高欢-endeavor-2
  name_zh: 东西魏分峙与晋阳霸府经营
  phases:
  - key: brewing
    name_zh: 抚纳远俗
    labels:
      zh:
      - 招抚阿至罗
    start_date: '0533'
    highlight_event_id: guji-高欢-event-azhiluo
  - key: breakthrough
    name_zh: 君臣决裂
    labels:
      zh:
      - 表启相攻
      - 南向诛椿
    start_date: 0534-06
    highlight_event_id: guji-高欢-event-qiaoxiang
  - key: climax
    name_zh: 霸府晋阳
    labels:
      zh:
      - 建大丞相府
      - 遥制朝政
    start_date: 0532-07
    highlight_event_id: guji-高欢-event-jinyang
  - key: closure
    name_zh: 赤洪岭终局
    labels:
      zh:
      - 灭尔朱兆
      - 身后基业传子
    start_date: 0533-01
    highlight_event_id: guji-高欢-event-chihong
  decisions:
  - date: '0534'
    title_zh: 力主迁都于邺
    rationale: 洛阳久经丧乱、王气衰尽，邺地山河形便、土田沃衍。
  - date: 0533-01
    title_zh: 扬声讨兆而屡止、岁首掩袭
    rationale: 惰敌之志，以精骑一日一夜三百里突袭赤洪岭。
events:
- id: guji-高欢-event-birth
  date: 0496
  year_of: 496
  type: birth
  name_zh: 生于渤海蓚、长于怀朔
- id: guji-高欢-event-funai
  date: '0525'
  year_of: 525
  type: endeavor
  name_zh: 焚毁羽林之变后散财结客
  description: 见洛阳政乱，倾产结客，自是有澄清天下之志，与司马子如、刘贵、侯景等为友。
- id: guji-高欢-event-xindu
  date: 0531-06
  year_of: 531
  type: endeavor
  name_zh: 建义于信都
  description: 以讨尔朱为名举兵，椎牛飨士，众推为主，奉元朗为帝，年号中兴。
- id: guji-高欢-event-hanling
  date: 0532-04
  year_of: 532
  type: endeavor
  name_zh: 韩陵之战大破尔朱氏
  description: 马不满二千、步不至三万，为圆阵连牛驴塞归道，四面赴击，大败尔朱兆二十万众。
- id: guji-高欢-event-jinyang
  date: 0532-07
  year_of: 532
  type: endeavor
  name_zh: 定居晋阳建大丞相府
  description: 以晋阳四塞，建大丞相府而定居焉，自此遥制东魏朝政。
- id: guji-高欢-event-chihong
  date: 0533-01
  year_of: 533
  type: endeavor
  name_zh: 破斩尔朱兆于赤洪岭
  description: 窦泰精骑一日一夜三百里掩至，兆军惊溃自缢，并州悉平。
- id: guji-高欢-event-azhiluo
  date: '0534'
  year_of: 534
  type: endeavor
  name_zh: 抚纳阿至罗诸虏
  description: 遣使招纳叛藩，赉粟帛抚慰如初，酋帅感恩效用。
- id: guji-高欢-event-qiaoxiang
  date: 0534-07
  year_of: 534
  type: endeavor
  name_zh: 勒兵南向与魏帝决裂
  description: 以诛斛斯椿为名举兵渡河，魏帝西奔关中依宇文泰，魏分东西。
- id: guji-高欢-event-death
  date: 0547-01
  year_of: 547
  type: death
  name_zh: 卒于晋阳
  description: 武定五年正月薨，遗基业于子，后追尊为高祖神武皇帝。
