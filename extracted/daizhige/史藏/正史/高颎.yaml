  era: 隋
  reign_ref: 隋文帝开皇
  archetype: 开国宰辅
  dilemmas:
  - 身居相位总百揆，功高震主，进退之间宠辱难料
  lesson: 尽忠勤政可以兴邦，然位极人臣者尤须知进退盈虚之道
  summary_first_person: 我是高颎，佐隋文帝定鼎开皇，先任尚书左仆射兼纳言，总领朝政，又监造大兴城、节度诸军平陈之役，以勤于地利、明于铨衡著称于时。
  source_urls:
  - https://zh.wikisource.org/wiki/隋書
endeavors:
- id: guji-高颎-endeavor-1
  key: brewing
  name_zh: 佐周辅隋、登庸相位
  labels:
    zh:
    - 辟命登庸
    - 相府司马
  start_date: 581-03
  decisions:
  - date: 581-02
    title_zh: 自相府常服入宫受禅之际任尚书左仆射兼纳言
    rationale: 隋文帝受禅建隋，以柱国、相国司马、渤海郡公高颎为尚书左仆射兼纳言，委以枢要
- id: guji-高颎-endeavor-2
  key: breakthrough
  name_zh: 营建大兴城与经略北边
  labels:
    zh:
    - 营新都
    - 出击突厥
  start_date: 582-06
  decisions:
  - date: 582-06
    title_zh: 诏高颎等创造新都
    rationale: 隋文帝决意迁都，以左仆射高颎为营新都监，与刘龙、贺娄子干等同营大兴城
  - date: 583-08
    title_zh: 遣尚书左仆射高颎出宁州道击胡
    rationale: 突厥为患，颎与虞庆则并为行军元帅分道出击
- id: guji-高颎-endeavor-3
  key: climax
  name_zh: 节度诸军伐陈
  labels:
    zh:
    - 平陈之役
    - 节度诸军
  start_date: 588-09
  decisions:
  - date: 588-09
    title_zh: 以长孙览、元景山为行军元帅伐陈，命高颎节度诸军
    rationale: 陈室内乱，隋大举南伐，以尚书左仆射高颎节度诸军总揽军事
- id: guji-高颎-endeavor-4
  key: closure
  name_zh: 转任武职、功成持盈
  labels:
    zh:
    - 左领军大将军
  start_date: 585-03
  decisions:
  - date: 585-03
    title_zh: 以尚书左仆射高颎为左领军大将军
    rationale: 开皇五年三月，颎由仆射转领头军之任，仍参掌机要
events:
- id: guji-高颎-event-birth
  date: '541'
  year_of: 541
  precision: year
  type: birth
  title_zh: 高颎约生于西魏末年
  detail: 生年史无明文，据其仕历推为北魏末至西魏之初
- id: guji-高颎-event-1
  date: 581-02
  year_of: 581
  precision: day
  type: appointment
  title_zh: 拜尚书左仆射兼纳言
  detail: 开皇元年二月甲子，隋文帝即位，以柱国、相国司马、渤海郡公高颎为尚书左仆射兼纳言
- id: guji-高颎-event-2
  date: 582-06
  year_of: 582
  precision: day
  type: construction
  title_zh: 受诏监造新都大兴城
  detail: 开皇二年六月，诏左仆射高颎、将作大匠刘龙等创造新都，次年三月迁都，名大兴城
- id: guji-高颎-event-3
  date: 583-08
  year_of: 583
  precision: day
  type: military
  title_zh: 出宁州道为行军元帅击胡
  detail: 开皇三年八月壬午，遣尚书左仆射高颎出宁州道、内史监虞庆则出原州道，并为行军元帅以击突厥；二月己丑诏颎等班师
- id: guji-高颎-event-4
  date: 588-09
  year_of: 588
  precision: day
  type: military
  title_zh: 节度诸军以伐陈
  detail: 开皇九年前后，以长孙览、元景山并为行军元帅伐陈，仍命尚书左仆射高颎节度诸军
- id: guji-高颎-event-5
  date: 585-03
  year_of: 585
  precision: day
  type: appointment
  title_zh: 转任左领军大将军
  detail: 开皇五年三月戊午，以尚书左仆射高颎为左领军大将军
- id: guji-高颎-event-death
  date: '607'
  year_of: 607
  precision: year
  type: death
  title_zh: 高颎死于非命
  detail: 隋炀帝大业初，颎以规谏失宠，被诛，天下冤之
