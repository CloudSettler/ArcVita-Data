person:
  qid: guji-拓跋焘
  name_zh: 魏太武帝拓跋焘
  names:
    zh: 拓跋焘、魏太武帝、太武皇帝
    en: Tuoba Tao (Emperor Taiwu of Northern Wei)
  lifespan:
    birth:
      date: 0408
      precision: year
      is_circa: false
      raw: 略以公元四〇八年生（北魏明元帝时期）
    death:
      date: 298
      precision: year
      is_circa: false
  birth_date: 0408
  death_date: '0452'
  era: 南北朝·北魏
  reign_ref: 北魏太武帝，年号始光、神麚、延和、太延、太平真君、正平
  archetype: 统一北方的雄略之君
  dilemmas:
  - 灭佛弘法与固本强兵之争（太武灭佛）
  - 南征统一天下与国力支撑之权衡
  - 信任崔浩与鲜卑贵族之矛盾（国史之狱）
  lesson: 刚毅果断可成统一大业，然用法过峻、猜忍好杀，终 致身死国疑之祸。
  summary_first_person: 我拓跋焘，明元帝长子，年十五立为太子，即位后屡破柔然，灭夏、北燕、北凉，统一北方 ；又以国史之狱诛崔浩，晚年为宗爱所弑。
  source_urls:
  - https://zh.wikisource.org/wiki/北史/卷002
