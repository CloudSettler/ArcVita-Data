      is_circa: false
      raw: 魏安釐王三十四年
  birth_date: -290
  death_date: -243
  era: 战国末期
  reign_ref: 魏安釐王在位期间
  archetype: 礼贤下士的贵公子
  dilemmas:
  - 国家危难与自身不得信任之间的抉择
  - 窃符救赵之忠义与擅杀大将之罪责的冲突
  - 归魏后遭秦离间、被魏王猜忌，纵酒自亡与再起救国的两难
  lesson: 急人之困、不恃富贵骄士，然功高见疑，终以酒色自毁，令人叹惋
  summary_first_person: 我魏无忌是魏昭王少子、安釐王异母弟，封信陵君。我倾身散财养士三千，侯嬴、朱亥皆为我死。秦围邯郸，赵求救于魏，魏王畏秦观望，我窃符夺军，却秦存赵，留赵十年。秦伐魏，我归国为上将军，合五国之兵大破秦军于河外。然秦行反间，魏王夺我兵权，我谢病不朝，与宾客纵酒，多近妇女，竟以酒色终此四年。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷077
