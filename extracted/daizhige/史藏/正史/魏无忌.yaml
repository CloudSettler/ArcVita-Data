events:
- id: guji-魏无忌-event-birth
  type: birth
  date: -290
  year_of: -290
  title_zh: 魏无忌生
  summary: 魏昭王少子出生。
- id: guji-魏无忌-event-hou-yuan
  type: endeavour
  date: -270
  year_of: -270
  title_zh: 虚左亲迎夷门监者侯嬴
  summary: 公子从车骑亲迎侯嬴，侯嬴过期客以观公子，公子愈恭，市人皆从骑窃骂，公子执辔愈恭，由是名闻诸侯。
- id: guji-魏无忌-event-qiong-fu
  type: endeavour
  date: -257
  year_of: -257
  title_zh: 窃符救赵、锤杀晋鄙夺军
  summary: 如姬窃兵符，朱亥锤杀晋鄙，公子将十万军破秦于邯郸城下，解赵围；使军去而侯嬴自刭北乡送之。
- id: guji-魏无忌-event-stay-zhao
  type: endeavour
  date: -256
  year_of: -256
  title_zh: 留赵访求毛公薛公
  summary: 公子不敢归魏，留赵，从博徒卖浆者毛公薛公游，魏军亦不敢违命攻魏。
- id: guji-魏无忌-event-general
  type: endeavour
  date: -247
  year_of: -247
  title_zh: 归魏为上将军、合五国破秦于河外
  summary: 秦伐魏危急，诸侯之客进兵谋，公子归国为魏上将军，率五国之兵在河外破秦军，乘胜逐秦军至函谷关。
- id: guji-魏无忌-event-slander
  type: endeavour
  date: -246
  year_of: -246
  title_zh: 遭反间失兵权、谢病纵酒
  summary: 秦使万人持金行反间，魏王使人代将，公子谢病不朝，与宾客为长夜饮，饮醇酒多近妇女。
- id: guji-魏无忌-event-death
  type: death
  date: -243
  year_of: -243
  title_zh: 信陵君病酒而卒
  summary: 公子竟以病酒卒，其岁魏安釐王亦薨；闻公子死，秦使蒙骜攻魏，拔二十城。
- id: guji-魏无忌-event-temple
  type: milestone
  date: -242
  year_of: -242
  title_zh: 高祖过魏祠信陵君
  summary: 汉高祖微时数闻公子贤，及即皇帝位过魏，每岁四时祠公子于魏，置五家守奉其冢。
