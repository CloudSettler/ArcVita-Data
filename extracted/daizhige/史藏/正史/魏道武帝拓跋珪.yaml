  era: 北魏
  reign_ref: 登国元年（386年）即代王位，后称魏王、皇帝
  archetype: 开国之君
  dilemmas:
  - 复兴代国还是依附后燕强大势力
  - 中原汉制与鲜卑旧俗的取舍
  lesson: 拓跋珪以非常之志与隐忍之谋，趁乱复国、破强敌、建魏业，然峻法多疑终致身殒。
  summary_first_person: 吾拓跋珪，昭成皇帝之孙也。昔国破家亡，吾隐忍于独孤、贺兰之间，后乘苻氏之乱复国于牛川， 即代王位，改称魏王。吾北破高车、蠕蠕，南破慕容宝于参合陂，遂定中原，建天子旌旗，
    迁都平城，初置百官台省。然吾性多猜忌，晚年诛戮大臣，终为清河王绍所弑，崩于天安殿。
  source_urls:
  - https://zh.wikisource.org/wiki/北史/卷一
endeavors:
- id: guji-tuobaogui-restate
  name_zh: 复国建魏
  description: 道武帝拓跋珪于代国灭亡后，乘淝水之战苻坚败亡、北方大乱之际，在牛川即代王位， 次年改称魏王，重建北魏政权。
  phases:
  - key: brewing
    name_zh: 流亡与隐忍
    dates: 376-385
    description: 代国为苻坚所灭后，拓跋珪先后流寓独孤部、贺兰部，苟全性命于乱世，暗中结交旧臣，等待复国时机。
  - key: breakthrough
    name_zh: 牛川即位
    dates: 386-391
    description: 登国元年正月，珪于牛川即代王位，旋改称魏王。随后击败刘显、窟咄，讨平库莫奚、高车诸部， 稳固政权根基。
  - key: climax
    name_zh: 参合陂之战与定中原
    dates: 395-399
    description: 拓跋珪大破后燕太子慕容宝于参合陂，坑杀降卒数万；继而下并州、围中山，尽取后燕河北之地， 于登国十一年称皇帝，建天子旌旗。
  - key: closure
    name_zh: 迁都平城与后期统治
    dates: 398-409
    description: 天兴元年定都平城（今大同），置百官、立台省，规范礼制。晚年性情暴戾，朝臣人人自危， 天赐六年为清河王拓跋绍所弑。
  decisions:
  - date: 386-01
    title: 牛川即代王位
    rationale: 因淝水之战后前秦瓦解，旧部离散，拓跋珪借贺兰部等推戴，于牛川即位复国，后改称魏王。
  - date: 395-12
    title: 击破慕容宝于参合陂
    rationale: 后燕侵逼五原，拓跋珪诱敌深入，乘慕容宝烧船夜遁之机济河追击，大破燕军并坑杀降卒， 消除最强外患。
  - date: 398-01
    title: 迁都平城
    rationale: 拓跋珪平定中原后，为控扼南北、经营汉地，定都平城并大规模营建宫室、设立台省百官。
  related_events:
