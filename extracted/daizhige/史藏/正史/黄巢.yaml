  era: 唐末
  reign_ref: 唐僖宗 乾符、广明、中和年间
  archetype: 叛乱者
  dilemmas:
  - 科举失利与仕进无门
  - 降抚反复与求节钺不得
  lesson: 失去体制出口的民间武力，终将以暴力改写秩序，也最终被秩序围剿
  summary_first_person: 我是曹州冤朐人黄巢，曾聚众攻郓、沂，与王仙芝合兵纵横江淮；仙芝败死，我众十万掠淮南、入闽中、陷广州，后渡淮北上，自号率土大将军，攻陷东都，破潼关入长安，僭号大齐，改元金统，终为诸道之师所败。
  source_urls:
  - https://zh.wikisource.org/wiki/舊唐書/卷19下
