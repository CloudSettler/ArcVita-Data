events:
- id: guji-龚遂-event-birth
  date: 约-100
  year_of: -100
  type: 出生
  title_zh: 龚遂生（生年不详，系年约估）
  description_zh: 字少卿，山阳南平阳人，明经为官，后为昌邑王郎中仆。
- id: guji-龚遂-event-1
  date: -75
  year_of: -75
  type: 仕宦
  title_zh: 昌邑王刘贺郎中
  description_zh: 为昌邑王郎中仆，见王动作不正，数引经义直谏，后从王入朝。
- id: guji-龚遂-event-2
  date: -70
  year_of: -70
  type: 仕宦
  title_zh: 拜渤海太守
  description_zh: 渤海左右郡饥荒，盗贼并起；宣帝举遂，除太守罢遣，遂单车独行至府，移书属县罢逐捕吏，言持田器者皆良民。
- id: guji-龚遂-event-3
  date: -69
  year_of: -69
  type: 政绩
  title_zh: 令民卖剑买牛、卖刀买犊
  description_zh: 郡中有带持刀剑者，使卖剑买牛，卖刀买犊，曰“何为带牛佩犊”；劝民务农桑，亲身巡行郡中，劳问疾苦。
- id: guji-龚遂-event-4
  date: -67
  year_of: -67
  type: 政绩
  title_zh: 渤海大治
  description_zh: 郡中皆有积蓄，狱讼止息，吏民皆富贵；以定乱功为水衡都尉。
- id: guji-龚遂-event-death
  date: 约-46
  year_of: -46
  type: 去世
  title_zh: 龚遂卒（卒年不详，系年约估）
  description_zh: 刘贺废后卒于水衡都尉任上；史榜次黄霸，列宣帝中兴名守之列。
