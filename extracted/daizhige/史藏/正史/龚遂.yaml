  dilemmas:
  - 民困于末业，劝农则须逼民卖刀剑买牛犊，政令与民俗相抗
  lesson: 卖剑买牛，劝民力田，化俗以德
  summary_first_person: 我是西汉循吏龚遂，少卿是我的字。我以明经为昌邑王郎中，数谏其过；后为渤海太守，见齐地之民好蓄刀剑、怠耕作，便下令卖剑买牛、卖刀买犊，劝民务农桑，于是郡中积蓄渐实，狱讼止息，吏民富贵。史称我与黄霸为宣帝中兴名守，然乾隆御制诗犹责我卖刀剑者必有买者，讥其义欠三复，我唯以力耕化俗自守而已。
  source_urls:
  - https://zh.wikisource.org/wiki/漢書/卷八十九
  - https://www.zhonghuadiancang.com/lishizhuanji/hanshu/
