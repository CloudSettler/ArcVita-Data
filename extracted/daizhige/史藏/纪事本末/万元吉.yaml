  birth_date: '1603'
  death_date: 1646-10
  era: 明末／南明（弘光、隆武时期）
  reign_ref: 弘光、隆武
  archetype: 孤忠调停之臣
  dilemmas:
  - 内则党争倾轧（马阮奸党与东林），外则清兵压境，谏言屡不见用
  - 奉命调停诸镇不和，既须弥缝将帅私怨，又须保全大局
  - 受隆武帝倚任而兵饷两乏，明知不可为而守赣州死之
  lesson: 明知大厦将倾，仍以调停维系一线；终以身殉城，成其孤忠。
  summary_first_person: 我万元吉，明天启间进士，累官兵部。弘光立，我力争起用阮大铖之非；又奉史可法之命，解黄得功与高杰之仇。隆武朝我协守赣州，粮尽援绝，城破死之，不失臣节。
  source_urls:
  - https://zh.wikipedia.org/wiki/万元吉
