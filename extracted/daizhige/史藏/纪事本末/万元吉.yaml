    title_zh: 上疏力谏起用阮大铖
    rationale: 阮为逆案之人，中旨擢用坏祖宗成法，故与诸臣合疏力争。
  - date: '1645'
    title_zh: 受史可法命和解黄得功、高杰之隙
    rationale: 得功与杰相仇欲决死战，非调停无以保江北；值得功母丧，劝杰以千金助赙，遂解。
