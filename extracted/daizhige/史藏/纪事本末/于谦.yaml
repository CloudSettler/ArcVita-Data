  archetype: 持重防御的兵部尚书
  dilemmas:
  - 三卫通瓦剌为间，是绝其朝贡之欢，还是严权宜之备
  - 泰宁卫乞大宁废城及甲盾，宁可拒之而失边夷之欢
  lesson: 御边之道在于权度量裁，不轻弃要地，亦不滥施恩赏。
  summary_first_person: 我是于谦，景泰年间官至兵部尚书。朵颜三卫使者叠至，常为瓦剌刺探间隙，我奏请边臣严加防备，并条上防御事宜，定使团止伴二三人入京之制；泰宁卫求大宁废城与甲盾，我坚持不可，以译辞婉拒而使其谋沮。
