  title_zh: 于谦条上三卫防御事宜
  description: 景泰四年，兵部尚书于谦言三卫使叠至，颇为瓦剌为间，宜令边臣严备，因条上防御事。诏自是使至，伴二三人入京，余不得辄入关。
  participants:
  - guji-于谦
- id: guji-于谦-event-refusal
  date: '1453'
  year_of: 1453
  type: endeavor
  title_zh: 于谦持不可拒大宁废城及甲盾之乞
  description: 泰宁卫都督佥事单于帖木儿乞大宁废城及甲盾，谦持不可。帝重绝三卫欢，遣译者以地近塞、不便驰猎、多疫为由婉拒，其谋遂沮。
  participants:
  - guji-于谦
