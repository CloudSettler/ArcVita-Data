person:
  qid: guji-先轸
  name_zh: 先轸
  names:
    zh: 先轸
    en: Xian Zhen
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      date: -627-08
      precision: month
      is_circa: true
      raw: 晋襄公元年八月戊子，死于箕之战
  birth_date: ''
  death_date: -627-08
  era: 春秋·晋国
  reign_ref: 晋文公、晋襄公
  archetype: 谋略型军事统帅
  dilemmas:
  - 殽之战前力排众议，主张在国丧期间违规袭击秦师，以“一日纵敌，数世之患”压倒“未报秦施”的仁义顾虑
  - 箕之战前自省“匹夫逞志于君而无讨”，在报效与自罚之间选择免胄入狄师赴死
  lesson: 谋国者以社稷大义为先，纵敌酿患不如一战定局；有过则自讨，虽死无悔。
  summary_first_person: 我是先轸，晋国下军之佐起家，因谋略著称而代郤縠将中军。城濮之战我定计怒楚、许复曹卫而诱战，横击楚师成文公霸业；文公卒后秦师灭滑而还，我主张发丧墨绖击秦，败之于殽；旋伐狄于箕，因自认之前对君逞志无讨，免胄冲入狄师而死，狄人归我之首，面色如生。
