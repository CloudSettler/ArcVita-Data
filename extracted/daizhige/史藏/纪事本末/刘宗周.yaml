  birth_date: '1578'
  death_date: '1645'
  era: 晚明・南明弘光朝
  reign_ref: 弘光（南明福王朱由崧）
  archetype: 直臣诤谏者
  dilemmas:
  - 弘光小朝廷偏安肉食与新立朝纲整饬之间的取舍
  - 直言论事与马阮当权、仕途去留之间的冲突
  lesson: 危局之中，据形势、慎爵赏、核旧官，直言不讳虽不久于位，足为后世臣道之范式。
  summary_first_person: 我在弘光朝被召为都察院左都御史，上疏力陈据形胜、重藩屏、慎爵赏、核旧官诸事，直指诸将滥封、督抚坐视之弊，然时事不可为，不久即予告归去。
  source_urls:
  - https://zh.wikisource.org/wiki/三藩紀事本末
