  type: endeavor
  date: 1644-06
  year_of: 1644
  summary: 宗周上疏论时事：一言据形胜，宜以亲征之师东厄淮徐、北控豫州、西顾荆襄；一言重藩屏，斥路振飞、刘泽清、高杰可斩；一言慎爵赏，谓左帅以恢复而封、高刘以败逃而亦封，滥赏将使天下解体；一言核旧官，请分别定罪从贼逃官；并请立兴问罪之师，请自中外诸臣之不职者始。
