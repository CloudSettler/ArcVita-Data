person:
  qid: guji-卢象升
  name_zh: 卢象升
  names:
    zh: 卢象升
    en: Lu Xiangsheng
  lifespan:
    birth:
      date: 1600
      precision: year
      is_circa: true
      raw: 万历二十八年，南直隶常州府宜兴人
    death:
      date: 1639-01
      precision: month
      is_circa: true
      raw: 崇祯十一年十二月，巨鹿贾庄之役力竭殉国
  birth_date: 1600
  death_date: 1639-01
  era: 明末
  reign_ref: 崇祯
  archetype: 忠烈儒将
  dilemmas:
  - 文臣守土与亲冒矢石之间，以大名道身份手与贼格战，刃及于鞍，失马步斗
  - 内臣监军体制之下与太监杨进朝同击贼，功赏奏报之实多受牵制
  - 主战赴难与孤军势穷相迫，卒以一身当锋而以功名显
  lesson: 临阵以身为士卒先，矢石满前不为动，虽失马步斗亦不退，故贼惮之而不敢窥大名，终以功名显
  summary_first_person: 我是卢象升，进士出身，出为畿南大名道。崇祯六年贼众数万屯小西天山，我驻内邱西东黄寺，与梁甫、从化成犄角；青龙冈一战再邀破贼，临阵身先士卒，矢石满前不动。内邱临城之间，我亲手与贼格斗，刃及于鞍，失马以步斗得免。贼自是惮我，不敢窥大名，魏人至今言之，我亦终以功名显于世。
