  name_zh: 参议监国拥立
  labels:
    zh:
    - 定策之议
  summary: 马士英移书史可法及吕大器请奉福王，可法以潞王稍有贤誉持未决，拥立遂为马士英等先迎。
  source: 三藩纪事本末·三藩僭号
- id: guji-史可法-event-kaifu
  person: guji-史可法
  type: endeavor
  date: 1644-06
  year_of: '1644'
  name_zh: 入阁办事、开府扬州
  labels:
    zh:
    - 入阁
    - 开府扬州
  summary: 福王召史可法与高弘图、马士英入阁办事；以黄得功、高杰、刘泽清、刘良佐分镇淮上，可法开府扬州兼督其军。
  source: 三藩纪事本末·三藩僭号
- id: guji-史可法-event-xiuqian
  person: guji-史可法
  type: endeavor
  date: 1644-09
  year_of: '1644'
  name_zh: 阅兵淮上、督师靖边
  labels:
    zh:
    - 阅泽清军
    - 巡仪真
    - 清江浦屯田
  summary: 八月可法巡淮安阅刘泽清军、具疏请饷为进攻计；九月巡仪真阅黄得功军；赴清江浦遣官屯田开封，自任宿迁冲要。
  source: 三藩纪事本末·四镇
- id: guji-史可法-event-tiaojie
  person: guji-史可法
  type: endeavor
  date: '1644'
  year_of: '1644'
  name_zh: 土桥之变后调停
  labels:
    zh:
    - 命万元吉和解
  summary: 黄、高二军内讧，得功欲与高杰决死战，可法命万元吉和解之，并命杰以千金赙得功母丧，事乃止。
  source: 三藩纪事本末·四镇
- id: guji-史可法-event-huifu
  person: guji-史可法
  type: endeavor
  date: 1644-11
  year_of: '1644'
  name_zh: 复宿迁、援邳州
  labels:
    zh:
    - 复宿迁
    - 解邳州围
  summary: 王师入宿迁，可法令刘肇基、李栖凤复之；未几大兵围邳州，肇基拔之，相持半月而解。
  source: 三藩纪事本末·四镇
- id: guji-史可法-event-death
  person: guji-史可法
  type: death
  date: '1645-04-14'
  year_of: '1645'
  location:
    zh: 扬州
  summary: 乙酉年清兵渡江顺治二年，史可法守扬州殉国；五月大兵渡江后福王亦被执北上。
  source: 三藩纪事本末·四镇
