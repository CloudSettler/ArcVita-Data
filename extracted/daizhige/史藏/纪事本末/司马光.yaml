  - 黍尺生律之辨：律生于尺抑或尺起于黄钟，与范镇争论三十年而不能决
  - 守旧制与更新声：面对朝廷屡次改乐，坚持考据经义、不为异说所动
  lesson: 论学贵有据，虽与至交数十年论难不合，仍各守其说而下笔有本
  summary_first_person: 我是司马光，居集贤校理之职。皇祐间房庶言汉志脱八字、当以律生尺，范镇以为是，我独不谓然，数与之论难于钟律黍尺之间，历三十年而世鲜知乐，竟不能决，然我守经据古，终不为浮议所迁。
  source_urls:
