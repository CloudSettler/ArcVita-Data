  description: 吕尚盖尝穷困年老，历经文王、武王、成王之世而终。
  principal: guji-吕尚
  place: 周
- id: guji-吕尚-event-1
  event_type: career
  date: 约-1120
  year_of: -1120
  title_zh: 穷困隐处，屠牛鬻饭
  description: 吕尚盖尝穷困，年老矣以渔钓奸周；一说屠牛于朝歌，卖饭于孟津，事纣无道而去。
  principal: guji-吕尚
  place: 朝歌、孟津
- id: guji-吕尚-event-2
  event_type: career
  date: 约-1060
  year_of: -1060
  title_zh: 遇文王于渭之阳，立为师
  description: 西伯将出猎，卜之曰所获非龙非彲非虎非罴，所获霸王之辅，果遇太公于渭之阳，与语大悦，号之曰太公望，载与俱归立为师。
  principal: guji-吕尚
  place: 渭水之滨
- id: guji-吕尚-event-3
  event_type: career
  date: 约-1058
  year_of: -1058
  title_zh: 与吕尚阴谋修德以倾商政
  description: 西伯归与吕尚阴谋修德以倾商政，其事多兵权与奇计，后世言兵及周之阴权皆宗太公为本谋。
  principal: guji-吕尚
  place: 周
- id: guji-吕尚-event-4
  event_type: career
  date: 约-1052
  year_of: -1052
  title_zh: 谋佐伐崇密须犬夷，大作丰邑
  description: 文王伐崇、密须、犬夷，大作丰邑，天下三分其二归周，太公之谋计居多。
  principal: guji-吕尚
  place: 丰邑
- id: guji-吕尚-event-5
  event_type: career
  date: 约-1046
  year_of: -1046
  title_zh: 佐武王克殷，以功封齐
  description: 吕尚为文武师，佐周灭商，以功封于齐，为齐国始封之君。
  principal: guji-吕尚
  place: 齐
