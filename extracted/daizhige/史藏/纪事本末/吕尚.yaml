person:
  qid: guji-吕尚
  name_zh: 吕尚
  names:
    zh: 吕尚
    en: Lü Shang
  lifespan:
    birth:
      date: 约-1150
      precision: year
      is_circa: true
      raw: 年老方遇文王，生年不详，约商末
  birth_date: 约-1150
  death_date: ''
  era: 商末周初
  reign_ref: 周文王、周武王之世
  archetype: 渭滨钓叟、佐周灭商之帝师
  dilemmas:
  - 穷困年老，隐居待时，事纣无道而去，究竟何投
  - 权谋奇计助周倾商，兵权阴谋与仁义修德如何相济
  lesson: 大器晚成，以待其时；钓于渭滨而佐王业，天下非一人之天下
  summary_first_person: 我本东海上人，先祖佐禹平水土有功，封于吕，因以吕为氏。我半生穷困，鬻饭屠牛，垂钓于渭水之滨。文王出猎遇我，与我语而大悦，说我太公望之久，遂载我俱归，立为师。我佐文王阴谋修德以倾商政，断虞芮之讼，天下三分其二归周，多出我之谋计。文王崩后，我又佐武王伐纣灭商，以功封于齐。后世言兵及周之阴权，皆宗我为本谋。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=980965
