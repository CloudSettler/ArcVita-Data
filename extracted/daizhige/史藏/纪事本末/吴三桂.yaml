  lesson: 恩宠既极而骄恣蓄逆，终致身败名裂
  summary_first_person: 我本以父荫为明边将，镇守山海关；闯贼陷京，我引清兵入关，受封平西王，随征西南，进封亲王留镇云南。然我蓄异志、括田置私、练兵买硝，及康熙十二年朝廷议撤藩，我乃举兵反，自称周王，直窥湖广。八年战乱后我病死，孙世璠困守昆明亦败亡。
  source_urls:
  - https://zh.wikisource.org/wiki/平定三逆方略
