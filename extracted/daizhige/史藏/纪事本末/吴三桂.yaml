events:
- id: guji-吴三桂-event-birth
  type: birth
  date: '1612'
  year_of: 1612
  note: 传记未载，据通史约1612年
- id: guji-吴三桂-event-投降-1644
  type: career
  date: '1644'
  year_of: 1644
  title_zh: 闻爱妾被据忿还山海，迎降多尔衮，封平西王
  description: 流贼陷京，父襄降贼以书招之；行至宝邸闻贼据其爱妾，旋山海关，密请清师，睿亲王多尔衮师次翁后，迎降受封。
- id: guji-吴三桂-event-镇滇-1659
  type: career
  date: '1659'
  year_of: 1659
  title_zh: 随大兵平云南、进缅甸，叙功封平西亲王留镇滇
  description: 叙功封平西亲王，后奏请文武官弁自选置，益骄蹇纵恣。
- id: guji-吴三桂-event-请撤-1673
  type: career
  date: 1673-07
  year_of: 1673
  title_zh: 疏请撤兵移藩
  description: 康熙十二年七月庚午，闻尚可喜乞归获允，不自安具疏请撤；朝廷议准，命率所属官兵家口搬移。
- id: guji-吴三桂-event-起兵-1673
  type: career
  date: '1673-11-21'
  year_of: 1673
  title_zh: 勒兵反叛，杀云南巡抚朱国治
  description: 康熙十二年十一月，以谋久事泄，遂勒兵反，执杀朱国治，久留哲勒肯等；僭称天下都招讨兵马大元帅。
- id: guji-吴三桂-event-称周-1674
  type: career
  date: '1674'
  year_of: 1674
  title_zh: 以明年甲寅为周王元年
  description: 僭建年号，贵州提督李本深叛应之，云贵总督甘文焜自刎。
- id: guji-吴三桂-event-死-1678
  type: death
  date: '1678'
  year_of: 1678
  title_zh: 伏冥诛（病死）
  description: 兵败穷蹙，未及清军平滇而死于昆明。
- id: guji-吴三桂-event-灭孙-1681
  type: career
  date: 1681-10
  year_of: 1681
  title_zh: 孙世璠困守昆明败亡，藩除
  description: 康熙二十年十月大兵攻围云南省城，世璠自杀，献给馘京师；三逆悉平。
