  year_of: 1674
  title_zh: 虞渊沈中下二卷未付枣木遂佚
  description: 虞渊沈中下二卷未付枣木传刻；朱彝尊抄入百六丛书之足本后为人借失，吴兴书贾购得者亦不可复见，或因明末降闯劝进诸臣子孙尚存而讳而不出。
