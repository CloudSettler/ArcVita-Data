person:
  qid: guji-吴伟业
  name_zh: 吴伟业
  names:
    zh: 吴伟业
    en: Wu Weiye
  lifespan:
    birth:
      date: '1609'
      precision: year
      is_circa: true
      raw: 明万历三十七年
    death:
      date: '1672'
      precision: year
      is_circa: false
      raw: 清康熙十一年
  birth_date: '1609'
  death_date: '1672'
  era: 明末清初
  reign_ref: 明崇祯·清顺治
  archetype: 由明入清的及第诗人与私史撰者
  dilemmas:
  - 应荐出仕清廷与守节故明之间的名节困境
  - 明亡降臣子孙讳匿之世，私撰亡国信史而卷帙散佚之难
  lesson: 身历鼎革者常以笔墨续史自处；私史之传不惟系乎撰者，亦系乎刻本与卷帙之存佚。
  summary_first_person: 我吴伟业，字骏公，号梅村，太仓人。明崇祯辛未以第三人及第，入清官至国子监祭酒。顺治壬辰舍馆嘉兴万寿宫，始辑《绥寇纪略》，专纪崇祯时流寇迄于明亡，分十二篇，篇后各系论断；惜虞渊沈中下二卷未付枣木，身后刻本遂佚此二卷。
  source_urls:
  - https://zh.wikisource.org/wiki/綏寇紀略
  - https://zh.wikipedia.org/wiki/吳偉業
endeavors:
- id: guji-吴伟业-endeavor-1
  name_zh: 科举起家与明清两朝仕历
  type: career
  summary: 崇祯辛未以第三人及第入翰林，明亡后应荐北上仕清，官至国子监祭酒，旋以疾乞归，里居著述以终。
  phases:
  - key: brewing
    name_zh: 早岁攻举业
    labels:
      zh: 太仓攻苦
    start_date: '1609'
    highlight_event_id: guji-吴伟业-event-birth
  - key: breakthrough
    name_zh: 崇祯辛未第三人及第
    labels:
      zh: 及第入翰林
    start_date: '1631'
    highlight_event_id: guji-吴伟业-event-jinshi
  - key: climax
    name_zh: 仕清官至国子监祭酒
    labels:
      zh: 贰臣之痛
    start_date: '1653'
    highlight_event_id: guji-吴伟业-event-chushi
  - key: closure
    name_zh: 乞归南还
    labels:
      zh: 归里著述
    start_date: '1657'
    highlight_event_id: guji-吴伟业-event-guili
  decisions:
  - date: '1653'
    title_zh: 应荐北上出仕清廷
    rationale: 迫于征辟时势而出，遂贻终身名节之憾，临殁有墓门之悔。
  - date: '1657'
    title_zh: 以疾乞归不恋禄位
    rationale: 南还太仓，闭户以著述终老。
- id: guji-吴伟业-endeavor-2
  name_zh: 撰辑《绥寇纪略》
  type: scholarship
  summary: 专纪崇祯时流寇迄于明亡，分十二篇，以三字标题，每篇后加以论断；虞渊沈中下二卷未付枣木，传刻遂佚。
  phases:
  - key: brewing
    name_zh: 目睹鼎革蓄志纪变
    labels:
      zh: 亲历明亡
    start_date: '1644'
    highlight_event_id: guji-吴伟业-event-mingwang
  - key: breakthrough
    name_zh: 万寿宫始辑
    labels:
      zh: 顺治壬辰辑于嘉兴
    start_date: '1652'
    highlight_event_id: guji-吴伟业-event-bianzuan
  - key: climax
    name_zh: 邹式金刻本行世
    labels:
      zh: 康熙甲寅刊于身后
    start_date: '1674'
    highlight_event_id: guji-吴伟业-event-kanke
  - key: closure
    name_zh: 虞渊沈中下二卷散佚
    labels:
      zh: 二卷不传
    start_date: '1674'
    highlight_event_id: guji-吴伟业-event-sanyi
  decisions:
  - date: '1652'
    title_zh: 发凡起例以三字标题分十二篇
    rationale: 仿苏鹗《杜阳杂编》、何光远《鉴戒录》之例，自渑池渡至虞渊沈标目，纪崇祯流寇本末，取其闻之于朝、胜于草野传闻，可资国史采辑。
