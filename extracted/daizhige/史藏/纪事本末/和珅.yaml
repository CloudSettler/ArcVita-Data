  era: 清乾隆间
  reign_ref: 乾隆帝弘历
  archetype: 权臣·钦差督师
  dilemmas:
  - 督抚奏报欺饰纷歧，军情虚实难稽，非亲莅行营核实不能定进止
  - 各路之兵零星散处，催之速战则挫衂伤士气，待其力齐则坐失事机
  - 军务未竟而热河扈从需人，留甘则违眷注、还京则卸前功
  lesson: 虚张与讳饰皆误兵机，据实驰报、严明行阵，始能上慰宵旰而下安边民
  summary_first_person: 我钮祜禄·和珅，蒙乾隆帝简拔，累迁至尚书、军机大臣。乾隆四十六年三月，撒拉尔番回苏四十三等因争新教抗官杀将、陷河州、直逼兰州省城，我奉命偕大学士阿桂率健锐火器营京兵四千名、领侍卫驰驿督剿。四月望前入甘肃境即遇雨随轮；抵兰州后严饬守兵彻夜虚放枪炮之弊，搜捕杀贼数人，复与阿桂申明军律、安设卡栅、于山间札大营，军容壁垒一新，民心渐安。旋以阿桂一人足任军事，奉旨回京，道经秦晋，面陈沿途麦收九分以上、民情大略，以助庙堂颁纶加恩被燹穷民。
  source_urls:
  - https://zh.wikisource.org/wiki/欽定蘭州紀略
