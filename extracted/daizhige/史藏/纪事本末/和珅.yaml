    title_zh: 严禁守兵黑夜虚张枪炮并搜捕城下潜贼
    rationale: 各路调兵零星散处、不俟力齐催令开战致有伤亡而士气不振，故到营即严饬禁止、搜捕杀贼数人，与阿桂安设卡栅彼此接应，于山间札大营以慑贼而安民
  - date: 1781-06-25
    title_zh: 遵旨交卸军务回京面陈甘省事宜
    rationale: 帝以阿桂一人足可了事而热河御前扈从不宜少，遂奉命回京，沿途查勘甘陕晋民情收成以实报闻
