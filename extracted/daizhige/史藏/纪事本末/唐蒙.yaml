  archetype: 开边之策士（拓境谋臣）
  dilemmas:
  - 通夷拓境、立功封疆与兴役劳民、士卒物故、巴蜀骚动之间的张力
  lesson: 开边之功当以民力为本，谋国者不可徒逞奇策而疲敝百姓。
  summary_first_person: 我唐蒙为番阳令时，奉命晓谕南越，席上尝蜀产蒟酱，追问其源，得知夜郎可通牂牁江。归而献策，请以巴蜀之富强通夜郎以制南越，武帝许之，拜我为中郎将。我率士卒辎重入夜郎，厚赐夜郎侯多同，喻以威德，约为置吏，其子为令，遂建犍为郡并开僰道至牂牁江之道。然道险士卒多病故逃亡，诛之则巴蜀大惊，武帝遣司马相如责我等而谕安其民。我首倡西南夷之通，功过同在，为后世所评说。
  source_urls:
  - 四库全书·滇考·汉通西南夷置郡县
