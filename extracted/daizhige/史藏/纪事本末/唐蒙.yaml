person_narrative: 唐蒙是西汉武帝时的将领与使者，最早推动了汉朝对西南夷的经营。
model: 唐蒙，西汉武帝时期官员，曾任番阳令，后拜中郎将，是汉通西南夷的开拓者。因在南越见蜀产蒟酱经夜郎转运，遂留心西南通路，上书建言以巴蜀之富通夜郎制南越，得武帝采纳。率兵入夜郎，厚赐夜郎侯多同，约为置吏，使其子为令，汉据此设犍为郡并发卒数万治道通牂牁江。其谋虽开创了汉朝经营西南之局，但工程耗费巨大，士卒多病故逃亡，巴蜀惊恐，武帝曾遣司马相如前往责谕安抚。
