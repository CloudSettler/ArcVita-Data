  birth_date: ''
  death_date: '1697'
  era: 清代康熙年间
  reign_ref: 康熙
  archetype: 边疆枭雄
  dilemmas:
  - 与喀尔喀交恶，兵败叩关引发清朝收抚草原之局
  - 乌兰布通败后投牒指誓乞降而旋即渝盟
  - 亲信寨桑相继归附、其子被擒，势穷仰药授首
  lesson: 除恶务尽，制胜在谋；背盟逞凶者终难自存
  summary_first_person: 我出身厄鲁特准噶尔，性强悍而志大，戕害兄弟兼并四部，蚕食邻封。我与喀尔喀构怨，击败其部迫其叩关乞援于清。乌兰布通一战受挫，仓皇宵遁，投牒指誓而旋渝盟，掠纳木扎尔陀音，侵扰边塞。康熙帝决意亲征，三驾漠北，昭莫多之战我大败，仅以数人跳身走，党羽离散，其子被擒，终于仰药授首，众皆归降。
  source_urls:
  - https://zh.wikisource.org/wiki/親征平定朔漠方略
