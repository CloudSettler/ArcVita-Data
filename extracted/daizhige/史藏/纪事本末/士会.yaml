person:
  qid: guji-士会
  name_zh: 士会
  names:
    zh: 士会、随会、随季、范会
    en: Shi Hui
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  birth_date: ''
  death_date: ''
  era: 春秋时期
  reign_ref: 晋文公、晋襄公、晋灵公、晋成公之世
  archetype: 贤而有耻、柔而不犯的谋臣
  dilemmas:
  - 奉命赴秦迎公子雍而晋改立灵公，随先蔑奔秦去留两难
  - 在秦受重用而晋患其才，归晋则须冒背秦被戮之险
  lesson: 贱而有耻，柔而不犯，其知足使；识时明礼，方可全身而济国
  summary_first_person: 我士会曾奉晋命赴秦迎公子雍，因晋立灵公而流亡于秦，为秦所用谋晋；后晋人患我之才，使魏寿余伪叛诱我归晋，我履足于朝暗通其意，终返晋复职，为晋政之重臣。
endeavors:
