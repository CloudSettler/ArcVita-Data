    rationale: 珙断燕王异日太平天子、须及脐当正大位，与己之卜筮互为表里，坚其推戴之心
events:
- id: guji-姚广孝-event-birth
  title_zh: 姚广孝生于长洲
  date: 1335
  year_of: 1335
  precision: year
  is_circa: true
  description_zh: 广孝生于元末长洲，本传未详其生年，兹据通行史传补记为约1335年
- id: guji-姚广孝-event-baimao
  title_zh: 献白帽之谶，得侍燕邸
  date: 1370
  year_of: 1370
  precision: year
  is_circa: true
  description_zh: 太祖择名僧配诸王，广孝知燕王必嗣天位，自言大王若使臣得侍，当奉一白帽与大王戴，王上加白其文为皇；燕王遂请于太祖，乞广孝随侍北平燕邸
- id: guji-姚广孝-event-yuangong
  title_zh: 荐袁珙入燕邸相燕王
  date: 1370
  year_of: 1370
  precision: year
  is_circa: true
  description_zh: 广孝至燕邸，荐鄞人袁珙（文中作袁拱）善相术；珙相燕王龙形凤姿，断为异日太平天子，曰须及脐即正大位
- id: guji-姚广孝-event-bu
  title_zh: 三钱卜筮，密陈天命
  date: 1370
  year_of: 1370
  precision: year
  is_circa: true
  description_zh: 燕府长史葛诚后语张昺云：曩封国时广孝密有推戴意，成祖令卜，广孝以三钱授祝，始掷一钱即视曰殿下欲为帝乎，更掷曰有之，遂陈天命所在
- id: guji-姚广孝-event-yiwa
  title_zh: 召对谋事，解檐瓦坠地之疑
  date: 1399
  year_of: 1399
  precision: year
  is_circa: false
  description_zh: 建文元年张信密告朝廷将执燕王，成祖召广孝谋事，适檐瓦堕地，成祖色不怿；广孝曰无异，是欲易色耳，转凶为吉，遂定大计
- id: guji-姚广孝-event-shiqi
  title_zh: 断靖难师期，天兵之验
  date: 1399-07
  year_of: 1399
  precision: month
  is_circa: true
  description_zh: 成祖屡问师期，广孝屡言未可；举兵前一日曰明日午有天兵应，及期众见空中兵甲其帅玄帝像，成祖披发仗剑应之，靖难师遂起于北平
- id: guji-姚广孝-event-death
  title_zh: 姚广孝卒
  date: 1418
  year_of: 1418
  precision: year
  is_circa: false
  description_zh: 广孝卒于明永乐十六年，本传未及其卒年，兹据通行史传补记
