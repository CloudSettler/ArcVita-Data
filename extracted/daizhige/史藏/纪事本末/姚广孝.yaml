    title_zh: 自请侍燕，献白帽之谶
    rationale: 知燕王必嗣天位，以「王上加白」暗许帝业，自求随藩以展经纬之志
  - date: 1399
    title_zh: 召对谋事，释檐瓦坠地之疑
    rationale: 成祖心恶瓦堕为不祥，广孝断为「欲易色耳」，转凶为吉，定起兵之谋
  - date: 1399-07
    title_zh: 断定靖难师期
    rationale: 屡问屡言未可，至举兵前一日预言「明日午有天兵应」，安众心而定大举之日
