person:
  qid: guji-姚广孝
  name_zh: 姚广孝
  names:
    zh: 姚广孝
    en: Yao Guangxiao
  lifespan:
    birth:
      date: 1335
      precision: year
      is_circa: true
      raw: 元元统三年，约1335年
    death:
      date: 1418
      precision: year
      is_circa: false
      raw: 明永乐十六年，1418年
  birth_date: 1335
  death_date: 1418
  era: 元末明初
  reign_ref: 洪武、建文、永乐
  archetype: 黑衣宰相·佐命谋僧
  dilemmas:
  - 身列缁流而预兵谋，出世清修与佐命功业相冲
  - 助藩夺嫡成败悬于一线，成则负杀伐之名，败则与燕府俱焚
  lesson: 识势于微末，谋定于隐忍；谶言卜筮皆人事之媒，功成而不居其荣。
  summary_first_person: 吾姚广孝，法名道衍。太祖择名僧赐诸王，吾知燕王必嗣天位，自许奉一白帽与大王戴，遂得侍燕邸。建文削藩势急，吾以三钱之卜、易瓦之祥、师期之断坚定燕王举兵之志，靖难师起而大业遂成，吾愿终始僧服。
  source_urls:
  - https://zh.wikisource.org/wiki/鴻猷錄
