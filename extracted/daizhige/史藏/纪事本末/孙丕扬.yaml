person:
  qid: guji-孙丕扬
  name_zh: 孙丕扬
  names:
    zh: 孙丕扬
    en: Sun Piyang
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: 生年不详
    death:
      date: ''
      precision: unknown
      is_circa: false
      raw: 卒年不详
  era: 明朝万历年间
  reign_ref: 明神宗万历
  archetype: 刚直敢言的吏部大臣
  dilemmas:
  - 屡上乞休之疏而不获准，去留之间进退维谷
  - 秉公主持京察，与内阁权臣及党人相持不下
  lesson: 持正核才、不畏权势，虽屡遭倾轧犹力求公道，然党争之世终难独行其志
  summary_first_person: 我孙丕扬以蹇谔自负，两任吏部尚书，主持推举与京察，力矫权门请托；虽与沈思孝、汤宾尹辈交恶，屡疏乞去，终挂冠出都。
  source_urls:
  - 《东林始末》（明）蒋平阶 撰
endeavors:
- id: guji-孙丕扬-endeavor-1
  name_zh: 首任吏部尚书与丁此吕沈思孝之争
  phases:
  - key: brewing
    name_zh: 廷推与就任
    labels:
      zh: 廷推阁臣、代陈有年为吏部尚书
    start_date: 1594
    highlight_event_id: guji-孙丕扬-event-1
  - key: breakthrough
    name_zh: 弹劾蒋时馨、逮丁此吕
    labels:
      zh: 整顿吏治、交恶沈思孝
    start_date: 1595
    highlight_event_id: guji-孙丕扬-event-2
  - key: climax
    name_zh: 屡疏乞休
    labels:
      zh: 乞休疏二十上，斥权官坐谋
    start_date: 1596
    highlight_event_id: guji-孙丕扬-event-3
  - key: closure
    name_zh: 罢官去职
    labels:
      zh: 闰八月与沈思孝俱罢
    start_date: 1596-09
    highlight_event_id: guji-孙丕扬-event-4
  decisions:
  - date: 1595-08
    title_zh: 上丁此吕访单，命逮下狱
    rationale: 丁此吕贪婪赃迹显著，虽曾建言亦无幸脱之理，秉公发其奸
  - date: 1596-08
    title_zh: 二十上疏乞休
    rationale: 吏部尚书张位党庇丁此吕、沈思孝，权官坐谋，鹰犬效力，义难再留
- id: guji-孙丕扬-endeavor-2
  name_zh: 再任吏部尚书与辛酉京察
  phases:
  - key: brewing
    name_zh: 起复原官
    labels:
      zh: 起太子少保吏部尚书
    start_date: 1608-09
    highlight_event_id: guji-孙丕扬-event-5
  - key: breakthrough
    name_zh: 挠察之纠
    labels:
      zh: 纠金明时倡言要挟逃察
    start_date: 1611-03
    highlight_event_id: guji-孙丕扬-event-6
  - key: climax
    name_zh: 京察惩党
    labels:
      zh: 秦聚奎闲住，汤宾尹等降调
    start_date: 1611-04
    highlight_event_id: guji-孙丕扬-event-7
  - key: closure
    name_zh: 挂冠出都
    labels:
      zh: 挂冠径去，不辞而别
    start_date: 1612-02
    highlight_event_id: guji-孙丕扬-event-8
  decisions:
  - date: 1611-03
    title_zh: 纠参御史金明时
    rationale: 金明时自知京察不免，先发攻吏部右侍郎王图以挠察，不可容
  - date: 1612-02
    title_zh: 挂冠出都
    rationale: 党争日炽，察典尽归党人之议纷起，去意遂决
events:
- id: guji-孙丕扬-event-birth
  type: birth
  date: ''
  description: 孙丕扬生年，史料未详（陕西富平人，文中称秦人）
- id: guji-孙丕扬-event-1
  type: appointment
  date: 1594
  year_of: 1594
  description: 万历二十二年五月，吏部以左都御史孙丕扬名上推阁臣，不允；后以孙丕扬代陈有年为吏部尚书
- id: guji-孙丕扬-event-2
  type: political_action
  date: 1595
  year_of: 1595
  description: 万历二十三年秋，代文选郎中蒋时馨辨劾，逮丁此吕下狱，遂与沈思孝交恶
- id: guji-孙丕扬-event-3
  type: petition
  date: 1596-05
  year_of: 1596
  description: 万历二十四年八月，乞休疏二十上，言权官坐谋、鹰犬效力，义难再留；上责其无大臣体
- id: guji-孙丕扬-event-4
  type: dismissal
  date: 1596-09
  year_of: 1596
  description: 万历二十四年闰八月，吏部尚书孙丕扬、右都御史沈思孝罢
- id: guji-孙丕扬-event-5
  type: appointment
  date: 1608-09
  year_of: 1608
  description: 万历三十六年九月，起孙丕扬太子少保吏部尚书
- id: guji-孙丕扬-event-6
  type: political_action
  date: 1611-03
  year_of: 1611
  description: 万历三十九年三月，纠御史金明时倡言要挟逃察，奏参秦聚奎，并以汤宾尹等七人访单送内阁
- id: guji-孙丕扬-event-7
  type: purge
  date: 1611-04
  year_of: 1611
  description: 万历三十九年四月，计疏下，秦聚奎闲住，汤宾尹、王绍徽等降调有差
- id: guji-孙丕扬-event-8
  type: resignation
  date: 1612-02
  year_of: 1612
  description: 万历四十年二月癸未，吏部尚书孙丕扬挂冠，出都
- id: guji-孙丕扬-event-death
  type: death
  date: ''
  description: 孙丕扬卒年，文中未详
