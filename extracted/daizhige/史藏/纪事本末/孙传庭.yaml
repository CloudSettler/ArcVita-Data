  - key: climax
    name_zh: 东出潼关,粮尽兵败
    labels:
      zh:
      - 潼关败殁
    start_date: 1643-10
    highlight_event_id: guji-孙传庭-event-zhanshi
  - key: closure
    name_zh: 身死国蹙
    labels:
      zh:
      - 尽节疆场
    start_date: 1643-11
    highlight_event_id: guji-孙传庭-event-death
  decisions:
  - date: 1642
    title_zh: 出狱督师,整兵关中
    rationale: 朝廷思良将,以我为秦督,惟假以时日,方可训练成军而复图中原。
  - date: 1643-10
    title_zh: 势弱粮匮仍东出潼关
    rationale: 朝命促战,中外催征,卒以裸而成师,诚知必败而鞠躬尽瘁。
