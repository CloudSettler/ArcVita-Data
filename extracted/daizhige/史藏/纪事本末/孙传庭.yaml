  decisions:
  - date: 1638-08
    title_zh: 与洪承畴合谋,于潼关原设伏以待自成
    rationale: 自成势穷,必奔潼关,同盟洪承畴追蹙而致之,设三覆可一战而擒。
  - date: 1638-10
    title_zh: 传谕商雒朱阳兰草诸隘,绝不使贼入关
    rationale: 理臣援军久约不至,秦军已疲,乃收卒守隘,免被内窜。
- id: guji-孙传庭-endeavor-2
  name_zh: 再起督师与关中鞠躬尽瘁
  phases:
  - key: brewing
    name_zh: 出狱复起
    labels:
