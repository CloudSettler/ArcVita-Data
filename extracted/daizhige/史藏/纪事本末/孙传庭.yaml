  year_of: 1638
  title_zh: 潼关原设伏大破李自成
  description: 与洪承畴并兵逐贼,潼关原依邱阜蔽林木立伏,曹变蛟驱贼入伏,飞走路绝,自成妻女俱失,仅从七人遁走。
  participants:
  - guji-孙传庭
  - 洪承畴
  - 曹变蛟
  place_zh: 潼关原
- id: guji-孙传庭-event-xiayu
  date: 1638-11
  year_of: 1638
  title_zh: 召入卫援,参戎机
  description: 京师告急,帝召孙传庭、洪承畴入卫;传庭已陞兵部添设侍郎,加副都御史,赐尚方剑,提督援兵。
  participants:
  - guji-孙传庭
  place_zh: 京师
- id: guji-孙传庭-event-daili
  date: 1642
  year_of: 1642
  title_zh: 出狱起复原官,总督关中
  description: 忤旨下狱数年,以复以贼势叵测,起用公子督师关中,以图后效。
  participants:
  - guji-孙传庭
  place_zh: 西安
- id: guji-孙传庭-event-zhanshi
  date: 1643-10
  year_of: 1643
  title_zh: 潼关兵败,身死乱军
  description: 东出潼关与贼战,粮尽援绝,军溃于潼关,孙传庭殁于阵。
  participants:
  - guji-孙传庭
  place_zh: 潼关
- id: guji-孙传庭-event-death
  date: 1643-11
  year_of: 1643
  title_zh: 孙传庭卒
  description: 潼关大败,传庭死之,时谓传庭死而明亡矣。
  participants:
  - guji-孙传庭
  place_zh: 潼关
