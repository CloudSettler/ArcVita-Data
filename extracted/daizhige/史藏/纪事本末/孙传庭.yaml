person:
  qid: guji-孙传庭
  name_zh: 孙传庭
  names:
    zh: 孙传庭、孙傅庭
    en: Sun Chuanting
  lifespan:
    birth:
      date: 1593
      precision: year
      is_circa: true
      raw: 生年不详,约万历二十一年
    death:
      date: 1643-11
      precision: month
      is_circa: false
      raw: 崇祯十六年十月,潼关战败身亡
  birth_date: 1593
  death_date: 1643-11
  era: 明末
  reign_ref: 明思宗崇祯年间
  archetype: 明末名将 / 临危受命之统帅
  dilemmas:
  - 戴罪之身再起,朝命促战与兵力未集之间的两难
  - 剿抚之争中主剿,与总理熊文灿招抚之策相左
  lesson: 代孙传庭败,明之良将尽矣,成事在人,而时节不与人。
  summary_first_person: 我孙传庭以进士出身而治兵,擒高迎祥于黑水峪,败贼于潼关原。京师告急,我入卫擢兵部侍郎督援兵,后以忤旨下狱。中原糜烂,朝廷复用我为督师,慨然出关,粮饷不给、促战不休,兵败潼关,身死乱军之中。明之亡,人谓传庭死而明亡矣。
  source_urls:
  - 《明史纪事本末》足本卷十九
