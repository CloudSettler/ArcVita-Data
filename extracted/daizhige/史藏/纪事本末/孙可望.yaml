events:
- id: guji-孙可望-event-kill-yan-qiheng
  date: 1651-02
  year_of: 1651
  title_zh: 遣贺九仪杀大学士严起恒
  description: 永历五年（辛卯）二月，孙可望遣贺九仪杀大学士严起恒，并追杀杨鼎和于崑仑关，杀刘尧珍、吴霖、张载述等。
- id: guji-孙可望-event-move-emperor
  date: 1652-02
  year_of: 1652
  title_zh: 迁永历帝于安陆所
  description: 永历六年（壬辰）二月，孙可望迁王于安陆所，改陆为隆、升所为府，后复改为安龙。
- id: guji-孙可望-event-kill-wu-zhenyu
  date: 1654-03
  year_of: 1654
  title_zh: 遣郑国、王爱秀杀吴贞毓等十八人
  description: 永历十一年（甲午）三月，孙可望遣郑国、王爱秀至安隆，杀大学士吴贞毓及张镌等十八人；并议废后，后泣诉乃止。
- id: guji-孙可望-event-self-cabinet
  date: 1656
  year_of: 1656
  title_zh: 自置内阁六部等官
  description: 永历十三年（丙申），孙可望自置内阁六部等官，以文安之为东阁大学士；安之走川东，李定国遂护王迁云南。
