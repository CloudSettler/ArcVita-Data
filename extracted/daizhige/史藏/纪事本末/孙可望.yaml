  era: 南明永历年间（顺治八年至十三年间活动见于记载）
  reign_ref: 永历帝朱由榔
  archetype: 权臣跋扈、挟主自雄的枭雄
  dilemmas:
  - 以张献忠余部之身欲挟永历朝廷号令四方，与李定国拥主之诚相冲突
  - 自置内阁六部，与永历朝廷名分相悖
  lesson: 挟主自重而无匡复之诚，终致内部相残、大势瓦解
  summary_first_person: 我本是张献忠旧部，归顺南明后拥兵自重，先遣人杀大学士严起恒以立威，又迁永历帝于安龙，囚控天子；后来帝密约李定国来迎，我遣人安龙杀吴贞毓等十八人以绝其望，甚至自置内阁六部，以文安之为大学士。然李定国终护帝迁滇，我挟主之局遂破。
