  title_zh: 万历二十一年京察，抗旨力保虞淳熙、杨于庭
  summary_zh: 刑科给事中刘道隆论劾虞淳熙、杨于庭，孙鑨上言不忍以功为罪，被责不引罪，夺俸三月。
