  - date: 1593-03
    title_zh: 不忍以功为罪，力保虞淳熙、杨于庭
    rationale: 淳熙安贫好学，于庭任西事有功，若知其无罪而以科道之言去之，是昧心欺君，臣不能为。
  - date: 1593-04
    title_zh: 力驳专权结党之谤并乞骸骨归
    rationale: 以留二庶僚为专权、留二京职为结党，则无往非专非党；任使不效而洁身去，专权结党之说终不明于世。
