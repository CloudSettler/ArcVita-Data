  era: 清咸丰、同治年间
  reign_ref: 咸丰十一年、同治元年
  archetype: 在籍士绅团练领袖
  dilemmas:
  - 地方官讳匿贼情、力图招抚，与绅士力主剿办之间的冲突
  - 无官职兵权而须自筹团练保卫乡里
  lesson: 讳疾忌医、以抚代剿纵容乱源，终致祸乱蔓延，惟早惩真相、实办团练方可御乱
  summary_first_person: 我以翰林侍读在籍督办团练，早见金钱会乱萌，力言于道府以为当正其为贼而惩之。官不见信，贼益炽，遂治理团务、逐乡立团，贼劫我乡里而郡城陷落。至闽师张启煊等奉命来剿，我谋假钱资军，卒与会党诸乡团合力，同治元年平定会匪。
endeavors:
- id: guji-孙锵鸣-endeavor-1
  name_zh: 奉命回籍督办团练，预见乱萌
  phases:
  - key: brewing
    name_zh: 告警道府
    labels:
      zh:
      - 上书陈乱
    start_date: 1860-01-01
    highlight_event_id: guji-孙锵鸣-event-warn1
  - key: breakthrough
    name_zh: 力争正贼名
    labels:
      zh:
      - 争言贼状
    start_date: 1861-01-01
    highlight_event_id: guji-孙锵鸣-event-warn2
  decisions:
  - date: 1860-01-01
    title_zh: 向署巡道、署知府直陈金钱会当痛惩
    rationale: 见粤贼在括、奸民啸聚将启寇心，认为趁其初起惩治可无烦兵力
- id: guji-孙锵鸣-endeavor-2
  name_zh: 治理团务、平定金钱会
  phases:
  - key: climax
    name_zh: 逐乡立团抵御贼劫
    labels:
      zh:
      - 团练抗贼
    start_date: 1861-07-01
    highlight_event_id: guji-孙锵鸣-event-houseburned
  - key: closure
    name_zh: 资助闽师讨贼
    labels:
      zh:
      - 假钱济军
    start_date: 1862-01-01
    highlight_event_id: guji-孙锵鸣-event-fundarmy
  decisions:
  - date: 1861-07-01
    title_zh: 谓官不可恃，谋益治团务，逐乡以为团
    rationale: 见道府抚议无成、贼势益张，惟有组织民团、入团者不入会以渐披贼党
  - date: 1861-10-01
    title_zh: 义堡被焚后求拨枪炮护家、告急郡县
    rationale: 贼祸及孙氏则郡县不能无事，贼无火器，得拨枪炮即可御
  - date: 1862-01-01
    title_zh: 谋于永嘉富民假钱四千缗资张启煊造炮船
    rationale: 事始可为，而启煊军械缺、不能行，须资其军始能进剿金谷山
events:
- id: guji-孙锵鸣-event-warn1
  date: 1860-01-01
  year_of: 1860
  title_zh: 言金钱会乱萌于署巡道志勋、署知府黄惟诰
  detail_zh: 睹乱萌，谓粤贼在括、奸民啸聚启寇心，宜及初起痛惩之，道府不以为意
  endeavor_ref: guji-孙锵鸣-endeavor-1
- id: guji-孙锵鸣-event-warn2
  date: 1861-01-01
  year_of: 1861
  title_zh: 复力争道府、寓书巡抚王有龄
  detail_zh: 力争正其为贼，谓妄称团练是官驱民从贼，王有龄责道府，但贼仍不可制
  endeavor_ref: guji-孙锵鸣-endeavor-1
- id: guji-孙锵鸣-event-houseburned
  date: 1861-09-20
  year_of: 1861
  title_zh: 金谷山贼焚其安义堡屋
  detail_zh: 贼首潘英等率党千余人焚孙氏安义堡，瑞安始戒严
  endeavor_ref: guji-孙锵鸣-endeavor-2
- id: guji-孙锵鸣-event-fundarmy
  date: 1862-01-01
  year_of: 1862
  title_zh: 假钱四千缗资助张启煊进剿
  detail_zh: 就启煊谋讨贼，谋于永嘉富民假钱资军，启煊乃造炮船，终与会党义团长张家珍等合力平定钱仓贼
  endeavor_ref: guji-孙锵鸣-endeavor-2
