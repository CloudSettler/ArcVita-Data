      raw: 虞亡后率族去，卒年未详
  birth_date: 约-690
  death_date: 约-655
  era: 春秋
  reign_ref: 虞公
  archetype: 讽谏直臣
  dilemmas:
  - 谏与去：屡谏而不见听，留则同覆，去则背宗
  - 家国与宗族：引『唇亡齿寒』『辅车相依』之理而国君贪利自便
  lesson: 唇亡齿寒，惟德是依；谏而不纳则祸不旋踵
  summary_first_person: 我为虞国大夫，两次谏止借道于晋以伐虢。晋以璧马诱我君，我以辅车相依、唇亡齿寒、同宗相恤之义力陈，又举鬼神非人实亲、惟德是依以破其恃祭之惑，君终不听。晋既灭虢，还师袭虞，虞公被执，虞亡，我率族人而曰『虞不腊矣』，遂去之。
  source_urls:
  - https://www.zhonghuashu.com/wiki/钦定四库全书/左传纪事本末/卷二十四
