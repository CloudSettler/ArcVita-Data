  location_zh: 虞
  summary_zh: 晋献公以垂棘之璧、屈产之乘假道于虞以伐虢，取下阳。
- id: guji-宫之奇-event-jiandao-2
  name_zh: 晋复假道，谏以唇亡齿寒
  date: -655
  year_of: 周惠王二十二年
  type: statecraft
  actors:
  - guji-宫之奇
  - 虞公
  - 晋献公
  location_zh: 虞
  summary_zh: 晋复假道于虞以伐虢。宫之奇谏曰：『虢，虞之表也；虢亡，虞必从之。谚所谓辅车相依、唇亡齿寒者，其虞虢之谓也。』又以『鬼神非人实亲，惟德是依』破其恃祭祀之惑。虞公不听，许晋。
- id: guji-宫之奇-event-qv
  name_zh: 晋灭虢还袭虞，宫之奇率族去虞
  date: -655
  year_of: 周惠王二十二年
  type: exile
  actors:
  - guji-宫之奇
  - 虞公
  - 晋献公
  location_zh: 虞
  summary_zh: 冬十二月，晋灭虢，虢公丑奔京师。晋师还，馆于虞，遂袭虞，灭之，执虞公及其大夫井伯。宫之奇以其族行，曰：『虞不腊矣，在此行也，晋不更举矣。』
