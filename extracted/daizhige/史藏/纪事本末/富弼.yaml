person:
  qid: guji-富弼
  name_zh: 富弼
  names:
    zh: 富弼
    en: Fu Bi
  lifespan:
    birth:
      date: '1004'
      precision: year
      is_circa: false
      raw: 宋真宗景德元年
    death:
      date: '1083'
      precision: year
      is_circa: false
      raw: 宋神宗元丰六年
  birth_date: '1004'
  death_date: '1083'
  era: 北宋
  reign_ref: 宋仁宗、宋英宗、宋神宗朝
  archetype: 贤相名臣
  dilemmas:
  - 使契丹定和议时以身家性命与国家体面相权衡
  - 行庆历新政时推进变革与遭朋党之谗的两难
  - 神宗朝反对青苗法，忠直进言与仕进去留相冲突
  lesson: 直言敢谏、临危受命，虽遭谗黜而守正不移。
  summary_first_person: 我是北宋名相富弼。庆历年间我出使契丹，折冲樽俎而安边界，又与范仲淹条奏十事推行新政；后虽因朋党之谗屡遭外放，至神宗朝仍直言反对青苗法，退居洛下而守志不改。
  source_urls:
  - https://zh.wikisource.org/wiki/皇宋通鉴长编纪事本末
endeavors:
- id: guji-富弼-endeavor-1
