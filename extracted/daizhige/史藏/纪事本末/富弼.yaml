  - date: '1043-09-01'
    title_zh: 与范仲淹条奏当世之务
    rationale: 欲振纲纪、裁冗滥、明赏罚，与范仲淹同心更张庶政。
- id: guji-富弼-endeavor-3
  name_zh: 神宗朝力争新法
  names:
    zh: 论青苗
    en: Opposition to the Green Sprouts policy
