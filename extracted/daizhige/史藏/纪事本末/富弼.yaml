  - key: climax
    name_zh: 上疏直谏
    labels:
      zh:
      - 乞罢新法
      - 告老
    start_date: '1069-10-01'
    highlight_event_id: guji-富弼-event-6
  - key: closure
    name_zh: 退居洛阳
    labels:
      zh:
      - 判汝州
      - 致仕
    start_date: '1074-01-01'
  decisions:
  - date: '1069-10-01'
    title_zh: 上疏力言青苗之害
    rationale: 以财聚人则小人进，恐新法扰民伤国体，故不肯附和王安石。
  - date: '1074-01-01'
    title_zh: 求去致仕居洛
    rationale: 不愿与行新法者同列，遂称疾辞位，归居洛阳。
events:
- id: guji-富弼-event-birth
  title_zh: 富弼生
  date: '1004'
  year_of: 1004
  category: 生平
  description: 富弼生于河南洛阳，字彦国，北宋名臣。
- id: guji-富弼-event-death
  title_zh: 富弼卒
  date: '1083'
  year_of: 1083
  category: 生平
  description: 元丰六年，富弼卒，谥文忠。
- id: guji-富弼-event-1
  title_zh: 富弼出使契丹
  date: '1042-03-01'
  year_of: 1042
  category: 出使
  description: 契丹兵临而索关南故地，富弼奉使赴契丹议和，见载于《皇宋通鉴长编纪事本末》吕夷简事迹"富弼出使"条。
- id: guji-富弼-event-2
  title_zh: 富弼廷折契丹之请
  date: '1042-08-01'
  year_of: 1042
  category: 出使
  description: 弼于契丹廷上面折其君臣之请，力辨和战利害，遂以增币而弭兵争。
- id: guji-富弼-event-3
  title_zh: 富弼拜枢密副使参预机务
  date: '1043-08-01'
  year_of: 1043
  category: 仕宦
  description: 庆历三年富弼擢枢密副使，与范仲淹、韩琦同心辅政。
- id: guji-富弼-event-4
  title_zh: 富范条奏十事本末
  date: '1043-09-01'
  year_of: 1043
  category: 新政
  description: 富弼与范仲淹上十事疏，主明黜陟、抑侥幸、均公田、择官长诸务，史载"富范条奏十事本末"。
- id: guji-富弼-event-5
  title_zh: 富弼上疏论青苗法
  date: '1069-10-01'
  year_of: 1069
  category: 谏诤
  description: 神宗朝行青苗法，富弼时在相位，上疏力陈其扰民之害，不肯奉行。
- id: guji-富弼-event-6
  title_zh: 富弼罢相求退
  date: '1070-01-01'
  year_of: 1070
  category: 仕宦
  description: 为王安石所抑，富弼罢相出判亳州，后致仕居洛阳。
