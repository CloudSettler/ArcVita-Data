  - date: '1042-03-01'
    title_zh: 临危受命出使契丹
    rationale: 契丹遣使索地，两国交兵在即，弼自请出使以纾国难。
- id: guji-富弼-endeavor-2
  name_zh: 庆历新政十二条奏
  names:
