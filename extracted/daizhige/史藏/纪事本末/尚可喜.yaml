    en: Shang Kexi
  lifespan:
    birth:
      date: -1604
      precision: year
      is_circa: true
      raw: 康熙十二年（1673年）奏称“年已七十”，逆推约生于明万历三十二年前后
    death:
      date: 1676
      precision: year
      is_circa: false
      raw: 康熙十三年至十四年间，其子尚之信迫其从贼，“可喜愤死”
  birth_date: 约-1604
  death_date: 1676
  era: 明末清初
  reign_ref: 清太宗天聪、崇德年间至清圣祖康熙年间
  archetype: 归诚藩王
  dilemmas:
  - 其子尚之信暴横不法、迫其从贼，父子忠逆之冲突
  - 年老乞骸归辽东养老与朝廷撤藩大局之间的抉择
  lesson: 明末孤穷之际航海归诚，镇粤二十余年奉职维谨，晚年急流勇退请撤藩归乡，然终困于逆子之乱，忠谨而不得善终，令人叹藩镇之局害人至深。
  summary_first_person: 我本是明广鹿岛副将，天聪八年航海归顺大清，太宗皇帝擢我为总兵官，崇德元年封智顺王，顺治六年改封平南王，率兵下广东后镇守广州二十余年，戢兵御众、奉职维谨。我年七十时疏请携家口归辽东养老，朝廷亦允全藩撤离，不料三桂先反，我子之信暴横不法，迫我从贼，我愤懑而死。
  source_urls:
  - https://example.org/guji/pingdingsannifanglue
