  - date: 1673-03-12
    title_zh: 上疏请撤兵归辽东养老
    rationale: 年已七十、精力就衰，欲归太宗所赐辽东海州故土安插养赡，遂乞骸骨。
events:
- id: guji-尚可喜-event-guilai
  date: 1634
  year_of: 1634
  title_zh: 天聪八年航海来归，太宗擢为总兵官
  desc_zh: 尚可喜原为明广鹿岛副将，天聪八年弃明航海归顺，太宗皇帝招徕远人不吝爵赏，遂擢为总兵官。
- id: guji-尚可喜-event-fengwang
  date: 1636
  year_of: 1636
  title_zh: 崇德元年封智顺王，后改封平南王率兵下广东
  desc_zh: 崇德元年封智顺王；顺治六年改封平南王，率所部兵随大兵下广东，因驻广州凡二十余年。
- id: guji-尚可喜-event-shuiyue
  date: 1673-03
  year_of: 1673
  title_zh: 康熙十二年三月疏请撤兵归辽东，朝廷允全藩迁移
  desc_zh: 尚可喜以年七十疏请归辽东海州故土安插，部议及议政王大臣会议均议全撤之便，诏从之，命户部尚书梁清标等赴广东料理迁移。
- id: guji-尚可喜-event-death
  date: 1676
  year_of: 1676
  title_zh: 其子尚之信迫其从贼，可喜愤死
  desc_zh: 吴三桂反后，耿精忠据福建反，尚可喜子之信迫其父从贼，可喜愤死，之信遂遥为煽附。
