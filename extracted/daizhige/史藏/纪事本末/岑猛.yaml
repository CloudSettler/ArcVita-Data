    title_zh: 贿赂刘瑾矫诏复职
    rationale: 以财赂换取田州府同知官位，重振兵威
  - date: 1519
    title_zh: 自请为督府征调先锋
    rationale: 希以军功序迁重获知府之位
  - date: 1526-04
    title_zh: 命部下勿交锋并上书自辩
    rationale: 认为岑氏世荷天朝，有罪可乞怜免
  - date: 1526
    title_zh: 佩印出奔归顺投岳父岑璋
