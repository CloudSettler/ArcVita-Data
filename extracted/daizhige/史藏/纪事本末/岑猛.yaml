events:
- id: guji-cenmeng-event-birth
  date: ''
  year_of: 0
  title_zh: 出生
  detail_zh: 文献未载出生年月
- id: guji-cenmeng-event-1
  date: 1493-09
  year_of: 1493
  title_zh: 父岑溥被兄岑猇弑杀
  detail_zh: 弘治六年九月，猇以失爱弑溥于江中，黄骥、李蛮发兵诛猇，猛得以袭任。
- id: guji-cenmeng-event-2
  date: 1493
  year_of: 1493
  title_zh: 督府奏准袭溥官
  detail_zh: 黄骥以猛奔梧州，督府奏猛袭岑溥之官，纳之于田州。
- id: guji-cenmeng-event-3
  date: 1518
  year_of: 1518
  title_zh: 岑浚败死后降为福建平海所千户
  detail_zh: 弘治十八年潘蕃等疏浚罪状，诏发湖兵讨之，浚败死，改流官，降猛千户。
- id: guji-cenmeng-event-4
  date: 1519
  year_of: 1519
  title_zh: 从征华林峒贼立功迁指挥同知
  detail_zh: 正德间陈金檄猛从征，兵沿途剽掠，贼平后疏功稍迁指挥同知。
- id: guji-cenmeng-event-5
  date: 1526-04
  year_of: 1526
  title_zh: 嘉靖五年姚镆发兵八万征田州
  detail_zh: 四月，姚镆偕朱麒等以五将军分道并进，长子邦彦守工尧隘被沈希仪击斩。
- id: guji-cenmeng-event-6
  date: 1526
  year_of: 1526
  title_zh: 出奔归顺州遭岑璋鸩杀
  detail_zh: 猛佩印走归顺，岳父岑璋甘言诱之，鸩杀之，斩首归官军。
- id: guji-cenmeng-event-death
  date: 1526
  year_of: 1526
  title_zh: 死亡
  detail_zh: 嘉靖五年为归顺州知州岑璋所鸩杀。
