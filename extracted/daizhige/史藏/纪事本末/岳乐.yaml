  dilemmas:
  - 身为宗室亲王，奉诏远征三藩逆乱，需在朝廷指挥与战场实情之间权衡进止
  - 兵至江西后，面临「由袁州进取长沙」或「径抵广西剿灭叛逆」的战略抉择
  lesson: 宗室重臣临危受命，统师南下平叛，进退皆为社稷。
  summary_first_person: 我是和硕安亲王岳乐，康熙年间奉旨为定远平寇大将军，率师南下平定三藩之乱， 先赴江西调度诸军，再图湖南、广西。
  source_urls:
  - https://zh.wikisource.org/wiki/平定三逆方略
