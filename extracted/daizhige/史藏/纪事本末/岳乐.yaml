events:
- id: guji-岳乐-event-birth
  date: '-1625'
  year_of: -1625
  type: birth
  title_zh: 岳乐出生
  details_zh: 约天命年间生，清宗室，后封和硕安亲王。
- id: guji-岳乐-event-appointment
  date: 1674-01
  year_of: 1674
  type: appointment
  title_zh: 命和硕安亲王岳乐为定远平寇大将军
  details_zh: 时广西提督马雄、左江总兵官郭义降贼，全省变动。上命岳乐为定远平寇大将军， 率护军骁骑速赴广东，令都统觉罗霍特伯、郎素等偕往；兵至江西，或由袁州进取 长沙以平定广西，或径抵广西剿灭叛逆，听大将军王与都统等商酌以行。
- id: guji-岳乐-event-march
  date: 1674-10
  year_of: 1674
  type: military_campaign
  title_zh: 大将军安亲王岳乐帅师之广东
  details_zh: 是日总督金光祖奏广西全省变动、贼势愈炽，请入粤大兵取道南雄星驰赴救； 上谕大将军安亲王已帅师由广东进定粤西。
- id: guji-岳乐-event-jiangxi
  date: 1674-11
  year_of: 1674
  type: military_campaign
  title_zh: 谕大将军安亲王速赴江西调度
  details_zh: 将军希尔根等奏贼犯抚州等处，上谕大将军安亲王速赴江西，酌量调度， 会同尼雅翰等诸军平定地方。
- id: guji-岳乐-event-death
  date: '1689'
  year_of: 1689
  type: death
  title_zh: 岳乐去世
  details_zh: 康熙二十八年卒。
