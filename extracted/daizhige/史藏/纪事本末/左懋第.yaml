    start_date: '1645'
    highlight_event_id: guji-左懋第-event-martyrdom
  decisions:
  - date: 1645-07
    title_zh: 奉命北上出使燕京
    rationale: 弘光朝遣使北上交涉，懋第衔命而行，志在守节。
  - date: '1645'
    title_zh: 至燕京不屈
    rationale: 面对清朝威逼利诱，决不出仕新朝，宁死不屈。
events:
- id: guji-左懋第-event-envoy
  person_qid: guji-左懋第
  title_zh: 任兵部右侍郎兼都察院右佥都御史奉使燕京
  date: 1645-07
  year_of: 1645
  description: 七月己丑，以南明弘光朝兵部右侍郎兼右佥都御史身份奉使北京，陈洪范为副使同行。
- id: guji-左懋第-event-martyrdom
  person_qid: guji-左懋第
  title_zh: 至燕京不屈死节
  date: '1645'
  year_of: 1645
  description: 至燕京后不屈服，为清人所害，以身殉国；同行的陈洪范却暗中输款降清。
- id: guji-左懋第-event-letter-taizi
  person_qid: guji-左懋第
  title_zh: 密书史可法言太子在燕京
  date: '1645'
  year_of: 1645
  description: 北使期间密书史可法，言先帝太子实在燕京，使可法自悔曾误认王之明为真太子。
