person:
  qid: guji-左懋第
  name_zh: 左懋第
  names:
    zh: 左懋第
  era: 明末（崇祯—弘光年间，1601—1645）
  archetype: 舍生取义的殉国使臣
  dilemmas:
  - 北使燕京面对清朝，守节不屈与使命三难之间的抉择
  - 身为南明使臣却无力挽回和议颓势的忠节困境
  lesson: 使节守节不辱，宁死不屈，以气节为立身之本
  summary_first_person: 我左懋第于明末受命北使燕京，不辱使命，终不屈而死，以身殉国，为后世所重。
endeavors:
- id: guji-左懋第-endeavor-1
  name_zh: 奉使燕京不屈殉节
  phases:
  - key: brewing
    name_zh: 授命北使
    labels:
      zh: 兵部右侍郎
    start_date: 1645-07
    highlight_event_id: guji-左懋第-event-envoy
  - key: climax
    name_zh: 至燕京不屈
    labels:
