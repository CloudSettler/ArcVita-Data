  precision: month
  is_circa: true
  title_zh: 假奉太子密诏举兵东下
  description_zh: 弘光元年三月，托言奉先帝太子密诏，传檄讨马士英以清君侧，全军顺江东下
  endeavor_id: guji-zuoliangyu-endeavor-2
- id: guji-zuoliangyu-event-jiujiang
  date: 1645-04
  year_of: 1645
  precision: month
  is_circa: true
  title_zh: 兵抵九江，纵兵焚掠
  description_zh: 四月大军至九江，约江督袁继咸会师不从，部众焚掠九江城，军纪大坏
  endeavor_id: guji-zuoliangyu-endeavor-2
- id: guji-zuoliangyu-event-death
