person:
  qid: guji-zuoliangyu
  name_zh: 左良玉
  names:
    zh: 左良玉
    en: Zuo Liangyu
  lifespan:
    birth:
      date: 1599
      precision: year
      is_circa: true
      raw: 万历二十七年（1599年），山东临清
    death:
      date: 1645-04
      precision: month
      is_circa: true
      raw: 弘光元年四月（1645年），呕血数升，卒于九江军中
  birth_date: 1599
  death_date: 1645-04
  era: 明末
  reign_ref: 崇祯、弘光
  archetype: 拥兵自重的乱世枭将
  dilemmas:
  - 听朝命节制则断饷失援，拥兵自重则形同藩镇
  - 假太子密诏举兵清君侧，忠名与逆名只隔一线
  lesson: 兵归将有、骄将失驭，平寇之利刃终成倾覆社稷之内患
  summary_first_person: 我起于辽东行伍，以剿流寇之功累迁至平贼将军、宁南侯；然恃兵骄横，屡抗朝命，朱仙镇一败退保武昌。先帝殉国后，我假奉太子密诏，传檄东下清君侧，兵至九江纵兵焚掠，旋呕血而亡，所部旋降于清。
  source_urls:
  - https://zh.wikisource.org/wiki/綏寇紀略
  - https://zh.wikipedia.org/wiki/左良玉
endeavors:
- id: guji-zuoliangyu-endeavor-1
  name_zh: 剿寇中原
  description_zh: 自崇祯初年随军镇压农民军，转战秦晋豫楚，以骁勇累迁至总兵，获平贼将军印；终因骄横抗命，朱仙镇溃败，退保武昌坐大江楚。本卷所记渑池渡至通城击诸篇，多载其转战之事。
  phases:
  - key: brewing
    name_zh: 行伍崛起
    labels:
      zh: 辽东起家
    start_date: 1630
    highlight_event_id: guji-zuoliangyu-event-rise
  - key: breakthrough
    name_zh: 玛瑙山大捷
    labels:
      zh: 拜平贼将军
    start_date: 1640-02
    highlight_event_id: guji-zuoliangyu-event-manao
  - key: climax
    name_zh: 朱仙镇溃败
    labels:
      zh: 拥兵自误
    start_date: 1642-09
    highlight_event_id: guji-zuoliangyu-event-zhuxian
  - key: closure
    name_zh: 退保武昌
    labels:
      zh: 雄踞江楚
    start_date: 1642-10
    highlight_event_id: guji-zuoliangyu-event-wuchang
  decisions:
  - date: 1640-02
    title_zh: 受平贼将军印后渐不受杨嗣昌节制
    rationale: 恃功骄横，恐西入川中受制，阴纵张献忠遁走以自固，围歼之机遂失，督师忧愤而死
  - date: 1642-09
    title_zh: 朱仙镇兵败后弃襄阳南走武昌
    rationale: 惧李自成新胜之锋，避实就虚以存实力，自此不复有勤王北顾之意
- id: guji-zuoliangyu-endeavor-2
  name_zh: 举兵东下
  description_zh: 崇祯殉国后受封宁南侯，拥兵八十万屯武昌；弘光元年假称奉先帝太子密诏，传檄讨马士英清君侧，大军东下，兵至九江焚掠，旋呕血而卒，子左梦庚率全军降清。绥寇纪略卷十二九江哀一篇即记其事，而四库提要谓伟业叙述多回护良玉，亦涉恩怨之私。
  phases:
  - key: brewing
    name_zh: 受封宁南侯
    labels:
      zh: 雄镇武昌
    start_date: 1644-06
    highlight_event_id: guji-zuoliangyu-event-ningnan
  - key: breakthrough
    name_zh: 假诏起兵
    labels:
      zh: 传檄清君侧
    start_date: 1645-03
    highlight_event_id: guji-zuoliangyu-event-ship
  - key: climax
    name_zh: 兵抵九江
    labels:
      zh: 焚掠九江
    start_date: 1645-04
    highlight_event_id: guji-zuoliangyu-event-jiujiang
  - key: closure
    name_zh: 病殁军降
    labels:
      zh: 身死军散
    start_date: 1645-04
    highlight_event_id: guji-zuoliangyu-event-death
  decisions:
  - date: 1645-03
    title_zh: 假奉太子密诏举兵东下讨马士英
    rationale: 借太子、童妃诸案之势，以清君侧之名行逼朝夺权之实，师出无名而军心益骄
  - date: 1645-04
    title_zh: 遣使约江督袁继咸会师于九江
    rationale: 欲收江楚之众并力以图南京，然部众焚掠九江激变，继咸不肯从，图谋落空而呕血身死
