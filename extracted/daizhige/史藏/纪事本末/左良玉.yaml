  precision: month
  is_circa: true
  title_zh: 子左梦庚率全军降清
  description_zh: 良玉既死，子梦庚秘丧东下，遇清阿济格追兵于湖口，遂拥众十余万降清
  endeavor_id: guji-zuoliangyu-endeavor-2
