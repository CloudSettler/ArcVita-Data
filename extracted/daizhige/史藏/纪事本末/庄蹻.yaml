  dilemmas:
  - 归路被秦切断，是还楚报命还是留滇称王
  - 王于夷地，是从其俗变服，还是保持楚制
  lesson: 道路断绝之处，顺势而变服从俗者得建立新邦
  summary_first_person: 我是楚庄王苗裔庄蹻，楚顷襄王时为将，率兵溯沅水伐夜郎，灭之，改且兰为牂牁。我引兵至滇池，以兵威略定滇地，欲归报楚，恰逢秦击夺楚巴黔中郡，道路塞绝，遂还滇筑苴兰城而居，以声教诱服诸夷，夷人共推我为君长。我变服从其俗以王之，庄氏世王滇，至汉武帝时滇王常羌犹我之后。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=四库全书·滇考
