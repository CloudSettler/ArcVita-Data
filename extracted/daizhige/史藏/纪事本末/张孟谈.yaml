person:
  qid: guji-张孟谈
  name_zh: 张孟谈
  names:
    zh: 张孟谈
    en: Zhang Mengtan
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详，约活动于晋阳之战前后
  era: 春秋末期晋国六卿之世
  reign_ref: 仕赵襄子无恤
  archetype: 危局说客·离间存赵之谋臣
  dilemmas:
  - 晋阳被围灌、城不浸者三版之际，潜出城说韩魏敌盟，谋泄则祸立至
  - 以一身任泄谋之险，换韩魏二主之心，成则存赵，败则身死国灭
  lesson: 唇亡齿寒——使利害相共者结为一，则必亡之局可转
  summary_first_person: 吾赵氏之臣张孟谈也。智伯帅韩魏围晋阳、决水灌城，城不浸者三版，沈灶产蛙而民无叛意。襄子使吾潜出见韩康子、魏桓子，吾以唇亡齿寒晓之：赵亡则韩魏为之次。二子恐事未遂而谋泄祸立至，吾曰谋出二主之口、入臣之耳，何伤也。二子乃阴与吾约定期日而遣之还。襄子夜决水反灌智军，韩魏翼击，大败智伯，遂杀之而尽灭智氏。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑/卷001
  - https://zh.wikisource.org/wiki/通鑑紀事本末/卷第一
