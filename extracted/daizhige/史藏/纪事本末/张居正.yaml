  dilemmas:
  - 夺情守制之争：居母丧而恋权柄，遭言官抗疏攻讦
  - 专权与党伐：其权专、其党同伐异显，行于好恶之间而人莫之敢议
  lesson: 夫小人欲空人国，必加之以朋党——权相行事之终局，亦启门户之渐。
  summary_first_person: 我，张居正，世称张太岳、江陵先生，以擅权专政、党同伐异著称于嘉隆之际；我生前威柄独运，身后门人及政敌皆为东林门户之源，而「江陵夺情」一事遂为晚明气节之倡。
  source_urls:
  - https://zh.wikisource.org/wiki/東林本末
