  decisions:
  - date: 1746
    title_zh: 瞻对之役陈请亲赴军营相机筹画
    rationale: 请缨自效，帝以将次就功未允所请
  - date: 1747-04
    title_zh: 由贵州取道兼程赴川受任
    rationale: 谕旨以其熟悉苗蛮情形责以绥靖边陲，会同详察进剿机宜与粮饷接济
  - date: 1748
    title_zh: 密旨诛良尔吉而始终回护不行
    rationale: 瞻徇模棱致军中消息泄漏，贼得以主待客，师老功弗集
events:
- id: guji-张广泗-event-miao-pacify
  date: 1747-04
  precision: month
  is_circa: true
  raw: 乾隆十二年三月辛丑谕
  year_of: 1747
  title_zh: 苗疆绥靖苗种向化见称于朝
  description_zh: 上谕内阁称贵州地方张广泗料理以来现在妥协，苗种向化可以无虞，其善治苗疆之名由此见知。
  endeavor_id: guji-张广泗-endeavor-1
- id: guji-张广泗-event-zhandui-request
  date: 1746
  precision: year
  is_circa: true
  raw: 乾隆十一年前后瞻对之役
  year_of: 1746
  title_zh: 瞻对之役陈请亲赴军营未允
  description_zh: 张广泗陈请亲赴瞻对军营相机筹画，上以将次就功未允所请。
  endeavor_id: guji-张广泗-endeavor-2
- id: guji-张广泗-event-appoint-governor-general
  date: 1747-04
  precision: month
  is_circa: true
  raw: 乾隆十二年三月辛丑
  year_of: 1747
  title_zh: 补授川陕总督由黔兼程赴川
  description_zh: 上以金川莎罗奔肆横不法，而张广泗于此等苗蛮情形素所熟悉，命补授川陕总督，不必来京即由贵州取道速赴川省，会同庆复察度机宜、接济粮饷。
  endeavor_id: guji-张广泗-endeavor-2
- id: guji-张广泗-event-supreme-command
  date: 1747-04
  precision: month
  is_circa: true
  raw: 乾隆十二年三月己酉后传谕
  year_of: 1747
  title_zh: 进剿机宜专听调度申明军律
  description_zh: 上传谕此次进剿一应机宜专听张广泗调度，申明军律、指授方略，务令逆酋授首、刬绝根株，并许酌带在黔习于军旅之将弁赴川驱使。
  endeavor_id: guji-张广泗-endeavor-2
- id: guji-张广泗-event-shield-liangerji
  date: 1748
  precision: year
  is_circa: true
  raw: 乾隆十三年经略傅恒至营之前
  year_of: 1748
  title_zh: 密旨诛良尔吉而始终回护
  description_zh: 小金川土舍良尔吉从征日久，阳效先驱阴怀二志，军中消息时多泄漏；上先已密谕加诛，张广泗始终回护，在营诸将模棱两端莫敢发，迨经略傅恒至营始排众议数其罪而诛之。
  endeavor_id: guji-张广泗-endeavor-2
- id: guji-张广泗-event-death
  date: 1748
  precision: year
  is_circa: true
  raw: 乾隆十三年（1748）
  year_of: 1748
  title_zh: 金川师老获罪处斩
  description_zh: 金川用兵糜饷老师、绩用弗集，张广泗以罪论斩，一世边才随金川之败俱殒。
  endeavor_id: guji-张广泗-endeavor-2
