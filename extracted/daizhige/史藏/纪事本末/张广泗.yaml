  name_zh: 张广泗
  names:
    zh: 张广泗
    en: Zhang Guangsi
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 不详
    death:
      date: 1748
      precision: year
      is_circa: true
      raw: 乾隆十三年（1748）金川师老获罪，被处斩
  death_date: 1748
  era: 清乾隆年间
  reign_ref: 乾隆
  archetype: 边疆督抚·苗疆经略统兵之臣
  dilemmas:
  - 熟悉苗蛮边情之才与金川师老无功之责并存
  - 密旨诛内应良尔吉与始终回护模棱之间忠疑难辨
  lesson: 长于抚驭者未必长于征伐；赏罚不明、徇私护短，虽宿将亦不免糜饷老师而身败名裂
  summary_first_person: 吾张广泗，久宦黔中，以熟悉苗情、抚驭妥协见知于朝廷；乾隆十二年三月奉旨补授川陕总督，由贵州取道兼程赴川，专任征剿大金川机宜，申明军律。然师久无功，密旨诛良尔吉而吾始终回护，遂以罪诛，一世边才与身俱殒。
  source_urls:
  - https://zh.wikisource.org/wiki/欽定平定金川方略
  - https://zh.wikisource.org/wiki/清史稿
endeavors:
- id: guji-张广泗-endeavor-1
  name_zh: 抚驭贵州苗疆
  summary_zh: 久任黔疆，习知苗蛮情形，抚驭妥协，苗种向化，边地安帖，遂以善治苗疆之名受知于乾隆帝。
