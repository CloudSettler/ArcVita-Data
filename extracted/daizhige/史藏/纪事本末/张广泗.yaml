      - 向化
    start_date: 1747-04
    highlight_event_id: guji-张广泗-event-miao-pacify
  - key: closure
    name_zh: 移节川陕黔局底定
    labels:
      zh:
      - 移督
    start_date: 1747-04
    highlight_event_id: guji-张广泗-event-appoint-governor-general
  decisions:
  - date: 1747-04
    title_zh: 移治川省，以治苗之法治蛮
    rationale: 帝谕番蛮与苗性相近，倚其熟悉苗情善于抚驭，冀詟服其心、消弭其衅
- id: guji-张广泗-endeavor-2
  name_zh: 总督川陕征剿大金川
  summary_zh: 乾隆十二年受命川陕总督，专任进剿金川机宜，申明军律；然师老无功，密旨诛良尔吉而始终回护，十三年获罪处斩。
  phases:
  - key: brewing
