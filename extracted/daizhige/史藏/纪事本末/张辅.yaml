person:
  qid: guji-张辅
  name_zh: 张辅
  names:
    zh: 张辅
    en: Zhang Fu
  lifespan:
    birth:
      date: '1375'
      precision: year
      is_circa: true
      raw: 洪武八年（1375年）
    death:
      date: 1449-09
      precision: month
      is_circa: false
      raw: 正统十四年八月（土木之变，1449年9月）
  birth_date: '1375'
  death_date: 1449-09
  era: 明代
  reign_ref: 建文靖难至永乐、正统年间，历事四朝
  archetype: 靖难名将·英国公·安南征服者
  dilemmas:
  - 父河间王张玉战殁东昌，年少继统须独自扛起将门重任、在靖难战局中自证将才
  - 位极国公、功冠靖难与平安南，历四朝须以谦抑忠谨化解功高震主之危
  lesson: 将门之后以战功立身、以谨慎保家，方能历四朝而恩宠不坠
  summary_first_person: 我是张辅，河间王张玉之子。父殁东昌后，我随成祖靖难力战，夹河之战与朱能率众并进，合击破盛庸十万之众；永乐间我佩征夷将军印南平安南，生擒黎季犛父子，请设交趾布政司，进封英国公，历事四朝，终殁于土木之难。
endeavors:
- id: guji-张辅-endeavor-1
  name_zh: 靖难之役从征
  summary_zh: 随父张玉起兵靖难，父殁东昌后继掌战事，夹河之战与朱能并进力摧南军，卒从成祖入金陵、正大统。
  phases:
  - key: brewing
    name_zh: 随父起兵北平
    labels:
      zh:
      - 靖难起兵
      - 将门之子
    start_date: '1399'
  - key: breakthrough
    name_zh: 东昌丧父、继领父军
    labels:
      zh:
      - 东昌之败
      - 袭掌军务
    start_date: '1401'
  - key: climax
    name_zh: 夹河并进、迭破南师
    labels:
      zh:
      - 夹河之战
      - 与朱能并进
    start_date: 1401-03
    highlight_event_id: guji-张辅-event-jiahe
  - key: closure
    name_zh: 从入金陵、论功受封
    labels:
      zh:
      - 长驱金陵
      - 靖难功成
    start_date: '1402'
  decisions:
  - date: 1401-03
    title_zh: 夹河之战与朱能合力并进
    rationale: 中军将谭渊违令佯击、战殁于阵，张辅随朱能率众并进稳住中坚，助成祖以劲骑绕出敌背合势大破盛庸军
- id: guji-张辅-endeavor-2
  name_zh: 南征安南、经略交趾
  summary_zh: 永乐间佩征夷将军印两平安南，破隘留、多邦之险，生擒黎季犛父子，请设交趾布政司，以功进封英国公。
  phases:
  - key: brewing
    name_zh: 受命挂帅南征
    labels:
      zh:
      - 征夷将军
      - 代掌帅印
    start_date: '1406'
    highlight_event_id: guji-张辅-event-annam-start
  - key: breakthrough
    name_zh: 破隘留、夜袭多邦
    labels:
      zh:
      - 夜袭多邦
      - 破三江之险
    start_date: 1406-12
  - key: climax
    name_zh: 擒黎季犛、安南底定
    labels:
      zh:
      - 生擒黎氏父子
      - 郡县交趾
    start_date: '1407'
    highlight_event_id: guji-张辅-event-annam-win
  - key: closure
    name_zh: 设交趾布政司、班师封公
    labels:
      zh:
      - 交趾布政司
      - 进封英国公
    start_date: 1407-07
  decisions:
  - date: '1406'
    title_zh: 领征夷将军印讨黎季犛
    rationale: 黎氏篡陈、杀使拒贡，成祖以将门之后谙习兵略者当此重任，张辅受命首征、代殁于道之主帅朱能掌军
  - date: 1407-07
    title_zh: 疏请设交趾布政司
    rationale: 安南乱平、军民归附，请如内郡例设府县流官，改置郡县以图久安
events:
- id: guji-张辅-event-birth
  date: '1375'
  year_of: 1375
  title_zh: 张辅出生
  category: birth
  description_zh: 洪武八年生，河间王张玉长子，后为仁孝文皇后之兄，将门之后。
- id: guji-张辅-event-jiahe
  date: 1401-03
  year_of: 1401
  title_zh: 夹河之战随朱能并进击南军
  category: battle
  related_endeavor_id: guji-张辅-endeavor-1
  description_zh: 建文三年三月，滹沱河夹河之战中军将谭渊战殁，张辅与朱能等率众并进，成祖以劲骑绕出敌背合势夹击，斩首十余万级，大破盛庸军。
- id: guji-张辅-event-annam-start
  date: '1406'
  year_of: 1406
  title_zh: 受命南征安南
  category: campaign
  related_endeavor_id: guji-张辅-endeavor-2
  description_zh: 永乐四年，成祖命出师讨篡逆黎季犛，朱能道卒后张辅代掌其军，佩征夷将军印督师南下。
- id: guji-张辅-event-annam-win
  date: '1407'
  year_of: 1407
  title_zh: 生擒黎季犛父子、安南平
  category: campaign
  related_endeavor_id: guji-张辅-endeavor-2
  description_zh: 破多邦等险、追擒黎季犛父子于海上，安南悉平，成祖诏设交趾布政司，张辅以首功进封英国公。
- id: guji-张辅-event-death
  date: 1449-09
  year_of: 1449
  title_zh: 殁于土木之变
  category: death
  description_zh: 正统十四年随驾亲征瓦剌，八月土木堡之变中殉难，年七十五。
