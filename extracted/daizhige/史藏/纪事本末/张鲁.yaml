  decisions:
  - date: 128
    title_zh: 以璋暗懦，不复承顺，袭杀张修并其众
    rationale: 刘璋袭父焉位而暗懦，汉中可自擅；并张修部众以厚兵力，遂与璋为敌
  - date: 141
    title_zh: 使弟张卫与杨昂等据阳平关，横山筑城十余里以拒操
    rationale: 阳平关据险要，欲恃关阻曹操自武都入氐、出散关远来之师
  - date: 0215-12
    title_zh: 阳平既破，弃南郑奔巴中，终降曹操
    rationale: 关为夜袭所破，府库珍宝尽入操手，战守皆穷，降以自全（法正称曹操一举而降张鲁，定汉中）
- id: guji-张鲁-endeavor-2
  name_zh: 世奉五斗米道，以教团之力成割据之业
  summary_zh: 自祖父张陵以来世奉五斗米道居于蜀，鲁以道众受任督义司马，政教相资以成汉中之业，亦随降曹而终。
  phases:
