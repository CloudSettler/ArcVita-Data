  birth_date: 约0100
  death_date: 约0216
  era: 东汉末年
  archetype: 政教合一的割据军阀
  dilemmas:
  - 承刘焉之命断绝斜谷、杀害汉使，自此与汉廷决裂，进退皆系于军阀之局
  - 刘璋嗣父之位而暗懦，从之则俯仰由人，叛之则负故主之恩
  - 曹操举大军自武都、陈仓而来，战则阳平难守，走则弃汉中基业，终择降以保宗族部众
  lesson: 恃险要与道术足以割据一方，然不明存恤、不纳善谋者，终不能当雄主亲征之师。
  summary_first_person: 吾张鲁，沛人也，自祖父陵以来世奉五斗米道而居于蜀。初平二年，益州牧刘焉以吾为督义司马，遣吾袭汉中，吾掩杀太守苏固，断绝斜谷阁，遂据其地。建安五年刘璋嗣位，吾以璋暗懦不复承顺，袭杀张修并其众，与璋为敌，雄据巴汉。建安二十年曹操自武都、散关来攻，弟卫与杨昂等守阳平关为其夜袭所破，吾溃奔巴中，终降于操，汉中遂归曹氏。
  source_urls:
  - 本篇古籍未提供URL
endeavors:
- id: guji-张鲁-endeavor-1
  name_zh: 割据汉中，与刘璋相攻
  summary_zh: 受刘焉之命取汉中，后并张修之众，雄据巴汉与璋为敌，终为曹操所并。
