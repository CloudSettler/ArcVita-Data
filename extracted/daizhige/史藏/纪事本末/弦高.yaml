- id: guji-弦高-event-reward
  date: -627-04
  year_of: -627
  name_zh: 犒师于滑
  description_zh: 僖公三十三年，秦师袭郑，过滑国。弦高将市于周，遇之，恐郑不备，乃以四张熟牛皮先犒秦师，又与十二头牛，曰：寡君闻吾子将步师出于敝邑，敢犒从者。
- id: guji-弦高-event-warning
  date: -627-04
  year_of: -627
  name_zh: 遽使告郑
  description_zh: 弦高一面犒师以缓秦军，一面一面私下遣人速告郑国，使郑穆公得以视杞子等秦戍之备而逐之。
- id: guji-弦高-event-aftermath
  date: -627-04
  year_of: -627
  name_zh: 秦师灭滑而还
  description_zh: 秦将孟明以为郑有备，郑不可袭，遂灭滑而还，郑国赖弦高之智得免兵祸。
- id: guji-弦高-event-death
  date: -590
  year_of: -590
  name_zh: 弦高卒（约）
  description_zh: 弦高约卒于春秋中期，后世传为爱国商人之典范。
