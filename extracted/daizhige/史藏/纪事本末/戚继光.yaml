  title_zh: 戚继光生
- id: guji-戚继光-event-baijiang
  date: 1568-04
  year_of: '1568'
  type: appointment
  title_zh: 隆庆二年四月拜大将军，专理练兵
  description: 谭纶为总督，戚继光拜大将军，上疏请募浙江杀手三千、鸟铳手三千及西北马步军，俱报可。
- id: guji-戚继光-event-bianshuang
  date: '1568'
  year_of: '1568'
  type: policy
  title_zh: 上练兵与设监军之疏
  description: 继光言蓟地有三形，宜车骑步迭用，请予浙兵并设监军科道官，疏上俱报可。
- id: guji-戚继光-event-qingshan
  date: 1573-01
  year_of: '1573'
  type: military
  title_zh: 万历元年勒兵青山围董狐狸
  description: 董狐狸索赏喜峰口启衅，戚继光猝勒兵青山围之，狐狸以身免，寻缚首恶献，予款。
- id: guji-戚继光-event-changtu
  date: 1575-02
  year_of: '1575'
  type: military
  title_zh: 万历三年追逐长昂、生缚其叔长秃
  description: 二月追长昂坠马几获之，生缚长秃羁董家口，长昂纳马钻刀盟乃释之。
- id: guji-戚继光-event-death
  date: 1588-01
  year_of: '1588'
  type: death
  title_zh: 戚继光卒
