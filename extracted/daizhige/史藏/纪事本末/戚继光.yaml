    title_zh: 上疏请募浙兵一万二千调练蓟门
    rationale: 边兵不习山战谷战林战之法，惟浙兵能之
  - date: '1568'
    title_zh: 自请设监军科道官以避嫌
    rationale: 拥重兵易生猜疑，请设监军使臣无掣肘
events:
- id: guji-戚继光-event-birth
  date: '1528'
  year_of: '1528'
