  lesson: 练兵实备、车骑步协同，方能御虏于塞外
  summary_first_person: 我发迹浙江，以鸳鸯阵与浙兵练法整饬蓟门，筑台浚隍，屡破长昂、董狐狸之众，使北边数得安堵。
