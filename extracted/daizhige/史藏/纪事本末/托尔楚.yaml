events:
- id: guji-托尔楚-event-report-nayan-crimes
  person_qid: guji-托尔楚
  title_zh: 遣使驰驿奏闻纳延党犯咸平
  date: 1287-07
  year_of: 1287
  category: warfare
  person_dates_json_snapshot: ''
  details: 至元二十四年秋七月，纳延党诸王齐都尔犯咸平，托尔楚遣使驰驿以闻，帝命其领军一万与皇子阿雅噶齐同力备御。
- id: guji-托尔楚-event-deploys-nayanchuan
  person_qid: guji-托尔楚
  title_zh: 弃妻子率十二骑直抵建州
  date: '1287'
  year_of: 1287
  category: military_campaign
  person_dates_json_snapshot: ''
  details: 女真硕达勒达官民皆与纳延连结，托尔楚弃妻子与麾下十二骑直抵建州，距咸平千五百里。
- id: guji-托尔楚-event-battle-jianzhou
  person_qid: guji-托尔楚
  title_zh: 力战中矢、射杀叛酋特尔格岱
  date: '1287'
  year_of: 1287
  category: battle
  details: 与纳延党达春巴图鲁等合战两中流矢，复知其党欲袭皇子，以千余人扈从渡辽水，接战转斗而前，射其酋特尔格岱中口，镞出于项，堕马死。
- id: guji-托尔楚-event-yizhou-gratitude
  person_qid: guji-托尔楚
  title_zh: 军懿州，百姓焚香罗拜
  date: '1287'
  year_of: 1287
  category: governance
  details: 遂军懿州，懿州老幼千余人焚香罗拜道旁泣曰：非宣慰公吾属无遗种矣。托尔楚谦称功在皇帝洪福与将士之力。
- id: guji-托尔楚-event-chase-jinshan
  person_qid: guji-托尔楚
  title_zh: 追纳延余党北至金山战捷
  date: '1287'
  year_of: 1287
  category: battle
  details: 又追纳延余党北至金山，战捷。
- id: guji-托尔楚-event-awarded-tiger-tally
  person_qid: guji-托尔楚
  title_zh: 赐明珠虎符、充蒙古军万户
  date: '1287'
  year_of: 1287
  category: career
  details: 帝嘉其功，赐明珠虎符，充蒙古军万户。
