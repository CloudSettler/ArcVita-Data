  dilemmas:
  - 咸平诸王叛党势大，应坚守待援还是率孤军深入迎战
  lesson: 临危效死、忠于职守者，虽有孤军深入之险，终得朝廷嘉赏与史册留名
  summary_first_person: 我是托尔楚，元世祖时任辽东宣慰使。至元二十四年诸王纳延反叛，其党犯咸平，我遣使驰驿奏闻；女真硕达勒达官民与叛党联结，我弃妻子、率麾下十二骑直抵建州，与达春巴图鲁等合战，身中两箭仍力战，护皇子渡辽水，射杀叛酋特尔格岱，遂军懿州；百姓焚香罗拜于道，我谦称功在皇帝洪福与将士之力。又追纳延余党北至金山，战捷，蒙帝嘉奖，赐明珠虎符，充蒙古军万户。
