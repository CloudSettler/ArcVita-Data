  archetype: 中兴之君
  dilemmas:
  - 厉公被弑后国内卿族坐大、政局动荡，年少即位须先安内
  - 楚国势盛、中原诸侯背离，晋须复伯而避免与楚直接决战
  - 需兼顾攘楚与安抚戎狄，避免两线受敌
  lesson: 先修内政、善用谋略（联吴制楚、魏绛和戎、三驾疲楚），以德与力并施方能不战而复霸。
  summary_first_person: 我年少自周归晋即位，整饬内政、任用贤臣，令魏绛和戎、三驾疲楚，使晋国霸业在我手中复兴，诸侯复归于晋。
  source_urls:
  - https://ctext.org/leftzhuan-jishibenshuai
