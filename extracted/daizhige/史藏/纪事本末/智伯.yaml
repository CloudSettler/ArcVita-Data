      raw: 不详
    death:
      date: -453
      precision: year
      is_circa: false
      raw: 公元前453年（周贞定王十六年）
  birth_date: ''
  death_date: -453
  era: 春秋末期
  reign_ref: 晋国执政大夫（智氏宗主，谥襄，史称智襄子）
  archetype: 才胜德而败亡的骄横权臣
  dilemmas:
  - 才与德之争：瑶有五贤而甚不仁，智果谏立瑶恐灭宗，终如其言
  - 备与骄之择：智国谏备难、絺疵察韩魏必反，皆恃强不听，祸至无日
  - 强与和之衡：无故索地凌轹韩赵魏，逼人成怨，反促三家合谋灭智
  lesson: 才者德之资，德者才之帅；才胜德者如虎添翼，恃才骄横终致身死族灭。
  summary_first_person: 吾乃智伯瑶，智宣子之子，谥襄。以美须长大、射御足力、伎艺毕给、巧文辩慧、强毅果敢五贤冠绝诸卿，独少仁德。执晋国之政，蓝台宴上戏侮韩魏君臣，索地于韩魏各得万家之邑；求蔡皋狼之地于赵而弗与，遂帅韩魏之甲围晋阳，决水灌城，城不浸者三版。吾尝叹“水可以亡人国”，言未几而韩魏倒戈，决水反灌吾军，身死晋阳，智氏尽灭，惟辅果独存；头颅为饮器，赖豫让漆身吞炭为吾复仇。
  source_urls:
  - https://zh.wikisource.org/wiki/通鑑紀事本末/卷一
  - https://zh.wikisource.org/wiki/資治通鑑/卷001
