  decisions:
  - date: -457
    title_zh: 蓝台宴上戏康子而侮段规
    rationale: 恃智氏之强，自谓“难将由我，我不为难谁敢兴之”，拒智国备难之谏
  - date: -455
    title_zh: 请地于韩康子、魏桓子
    rationale: 无故索地以试诸卿，狃于得地而骄，张智氏之势
  - date: -454
    title_zh: 以絺疵之言告韩魏二子
    rationale: 不察人心忧色，自隳耳目，终不为韩魏反水之备
- id: guji-智伯-endeavor-2
  name_zh: 晋阳之役，水灌赵氏
  labels:
    zh:
    - 晋阳之战
    - 攻伐
    - 围城
  summary_zh: 求地于赵被拒，怒而联韩魏围晋阳，决水灌城几灭赵氏；然骄矜轻敌，韩魏倒戈，水反灌军，身死族灭。
  phases:
  - key: brewing
    name_zh: 求蔡皋狼之地于赵，襄子弗与
    labels:
      zh:
      - 索地
      - 结怨
    start_date: -455
    highlight_event_id: guji-智伯-event-qiudi-zhao
  - key: breakthrough
    name_zh: 帅韩魏之甲攻赵，围晋阳
    labels:
      zh:
      - 兵锋
      - 围城
    start_date: -455
    highlight_event_id: guji-智伯-event-weijin
  - key: climax
    name_zh: 决水灌晋阳，城不浸者三版
    labels:
      zh:
      - 水攻
      - 久围
    start_date: -454
    highlight_event_id: guji-智伯-event-jinyang-water
  - key: closure
    name_zh: 韩魏倒戈，决水反灌，身死族灭
    labels:
      zh:
      - 败亡
      - 覆族
    start_date: -453
    highlight_event_id: guji-智伯-event-death
  decisions:
  - date: -455
    title_zh: 求蔡皋狼之地于赵襄子
    rationale: 志在蚕食赵地，无故而索，韩魏献邑之后愈狃于得地
  - date: -455
    title_zh: 帅韩魏之甲攻赵
    rationale: 挟二家之力期灭赵氏而三分其地，未防二家忧惧相亲
  - date: -454
    title_zh: 引水灌晋阳城
    rationale: 决水围城以困赵，叹水可亡国而不虞水亦反噬其军
events:
- id: guji-智伯-event-birth
  title_zh: 智伯（智瑶）出生
  date: ''
  is_circa: false
  raw: 不详
  summary_zh: 生年史无明文，智氏世为晋卿，父智宣子（智申）欲以瑶为后，智果谏其五贤不仁而不听。
- id: guji-智伯-event-power
  title_zh: 嗣立为智氏宗主，执晋国之政
  date: -475
  is_circa: true
  year_of: -475
  endeavor_id: guji-智伯-endeavor-1
  summary_zh: 及智宣子卒，智襄子为政；智果已别族于太史为辅氏以避祸。
- id: guji-智伯-event-lantai
  title_zh: 蓝台之宴戏侮韩魏君臣
  date: -457
  is_circa: true
  year_of: -457
  endeavor_id: guji-智伯-endeavor-1
  summary_zh: 智伯与韩康子、魏桓子宴于蓝台，戏康子而侮段规；智国谏曰主不备难必至，智伯斥曰“难将由我，我不为难谁敢兴之”，弗听。
- id: guji-智伯-event-suodi
  title_zh: 请地于韩魏，各得万家之邑
  date: -455
  is_circa: true
  year_of: -455
  endeavor_id: guji-智伯-endeavor-1
  summary_zh: 智伯请地于韩康子，段规劝与以骄其心，得万家之邑；又求地于魏桓子，任章劝与以骄智伯，复与之万家之邑，智伯悦。
- id: guji-智伯-event-qiudi-zhao
  title_zh: 求蔡皋狼之地于赵，襄子弗与
  date: -455
  is_circa: true
  year_of: -455
  endeavor_id: guji-智伯-endeavor-2
  summary_zh: 智伯又求蔡皋狼之地于赵襄子，襄子弗与，智伯怒。
- id: guji-智伯-event-weijin
  title_zh: 帅韩魏之甲攻赵，围晋阳
  date: -455
  is_circa: true
  year_of: -455
  endeavor_id: guji-智伯-endeavor-2
  summary_zh: 智伯怒而帅韩魏之甲以攻赵氏；襄子念尹铎宽晋阳之民必和，乃走晋阳，三家以国人围而攻之。
- id: guji-智伯-event-jinyang-water
  title_zh: 决水灌晋阳，城不浸者三版
  date: -454
  is_circa: true
  year_of: -454
  endeavor_id: guji-智伯-endeavor-2
  summary_zh: 智伯引水灌城，沈灶产蛙而民无叛意；智伯行水曰“吾乃今知水可以亡人国”，桓子肘康子、康子履其跗，惧汾水可灌安邑、绛水可灌平阳。
- id: guji-智伯-event-death
  title_zh: 晋阳之败，身死族灭
  date: -453
  is_circa: false
  year_of: -453
  endeavor_id: guji-智伯-endeavor-2
  summary_zh: 赵襄子使张孟谈阴约韩魏，夜杀守堤之吏决水反灌智伯军；韩魏翼而击之，襄子将卒犯其前，大败智伯之众，遂杀智伯，尽灭智氏之族，惟辅果在。
- id: guji-智伯-event-aftermath
  title_zh: 头颅为饮器，豫让漆身吞炭复仇
  date: -453
  is_circa: false
  year_of: -453
  endeavor_id: guji-智伯-endeavor-1
  summary_zh: 赵襄子漆智伯之头以为饮器；其臣豫让欲为报仇，诈为刑人入宫涂厕、伏于桥下，再刺襄子不成，漆身为癞、吞炭为哑，终被杀，襄子称其为义士。
