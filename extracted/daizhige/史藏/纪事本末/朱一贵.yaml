  era: 清康熙年间
  reign_ref: 康熙
  archetype: 乱首
  dilemmas:
  - 以明朝后裔之名号召部众，实为游手奸民起事，名实相悖
  - 称王后禁淫掠整军纪，与杜君英等共事群贼互相吞并，内讧致败
  lesson: 承平日久、吏治废弛则防范疏阔，奸民乘隙一呼而全台震动；乌合之众虽可窃据一时，终难持久。
  summary_first_person: 我本漳州长泰人，小名祖，移居台湾饲鸭为生，因官府苛政而结党起事，自称明朝后裔，众推为大元帅，寻称伪王，号永和，旬月间全台俱陷，终因群贼内讧，败于清军征剿。
