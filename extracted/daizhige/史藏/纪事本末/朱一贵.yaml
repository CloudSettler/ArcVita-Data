  is_circa: false
  description_zh: 康熙五十二年渡台，充台厦道辕役，寻被革，居母顶草地饲鸭为生
- id: guji-朱一贵-event-uprising
  event_type: revolt
  date: '1721-04-19'
  year_of: '1721'
  date_precision: day
  is_circa: false
  description_zh: 康熙六十年四月十九日，与李勇、吴外、郑定瑞、王玉全、陈印等五十二人就黄殿庄中焚表结盟，立帜书大元帅朱，夜出冈山袭劫塘汛
- id: guji-朱一贵-event-battle-chishan
  event_type: battle
  date: '1721-04-26'
  year_of: '1721'
  date_precision: day
  is_circa: false
  description_zh: 赤山之战，与杜君英两路夹攻官军，周应龙溃逃，千总陈元战死，贼势大盛
- id: guji-朱一贵-event-king
  event_type: enthronement
  date: '1721-05-01'
  year_of: '1721'
  date_precision: month
  is_circa: false
  description_zh: 五月朔，群贼攻破台湾府，立朱一贵为伪王，通天冠黄袍玉带取之优伶，伪号永和
- id: guji-朱一贵-event-split
  event_type: conflict
  date: 1721-05
  year_of: '1721'
  date_precision: month
  is_circa: false
  description_zh: 与杜君英内讧，密谋李勇、郭国正等整兵围攻，杜君英率粤贼数万北走虎尾溪
- id: guji-朱一贵-event-death
  event_type: death
  date: '1721'
  year_of: '1721'
  date_precision: year
  is_circa: false
  description_zh: 康熙六十年，清军会师进剿，朱一贵败亡（康熙六十年辛丑）
