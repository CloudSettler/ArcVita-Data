  decisions:
  - date: 1721-03
    title_zh: 决计以明朝后裔之名举事
    rationale: 见地方官长沉湎废弛、兵民瓦解，与李勇、吴外等谋，谓我姓朱，以明朝后裔耸动乡村，归者必众
  - date: 1721-05
    title_zh: 出令禁淫掠并诛戴穆、洪阵以整军纪
    rationale: 戴穆强娶民间妇女，洪阵私鬻伪札，皆杀之以立威
  - date: 1721-05
    title_zh: 整兵围攻杜君英
    rationale: 杜君英骄蹇掠妇女、缚杨来林琏，怒而攻之，君英率粤贼北走
