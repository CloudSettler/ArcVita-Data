  name_zh: 朱由检
  names:
    zh: 朱由检
    en: Zhu Youjian
  lifespan:
    birth:
      date: '1611-02-06'
      precision: day
      is_circa: false
      raw: 无确切生辰记载，据史补
    death:
      date: '1644-04-25'
      precision: day
