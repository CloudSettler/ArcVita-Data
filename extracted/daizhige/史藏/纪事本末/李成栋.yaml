events:
- id: guji-李成栋-event-birth
  date: 约-0-01-01
  year_of: 约0
  title_zh: 李成栋出生
  description: 生年不详，出处未载。
- id: guji-李成栋-event-1
  date: 约1645-01-01
  year_of: 1645
  title_zh: 隶清军南征
  description: 李成栋为清将，参与江南、闽粤之役，为清廷开疆。
- id: guji-李成栋-event-2
  date: 约1647-01-01
  year_of: 1647
  title_zh: 李成栋收粤东
  description: 书列专篇「李成栋收粤东」，成栋以兵定广东，为清取粤东全境。
- id: guji-李成栋-event-3
  date: 约1648-06-01
  year_of: 1648
  title_zh: 举粤东反正归永历
  description: 成栋以广东归明，奉永历帝；朝士从其至者有袁彭年、曹晔、耿献忠、洪天擢、潘曾纬、毛毓祥、李琦等，自夸反正。
- id: guji-李成栋-event-4
  date: 约1649-03-01
  year_of: 1649
  title_zh: 其子元胤留肇庆、成一派势力
  description: 李元胤为成栋之子，留肇庆掌兵；袁彭年等附之，时号五虎，与广西扈行旧臣相攻。
- id: guji-李成栋-event-5
  date: 约1649-06-01
  year_of: 1649
  title_zh: 反正诸臣与旧臣分吴楚两党
  description: 从成栋至者与广西扈行者互相攻诘无虚日，永历帝令盟于太庙而不能解。
- id: guji-李成栋-event-death
  date: 约1649-01-01
  year_of: 1649
  title_zh: 李成栋卒
  description: 具体卒年出处未详载，约在反正后数年间。
