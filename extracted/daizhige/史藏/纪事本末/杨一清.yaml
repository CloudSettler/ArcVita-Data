  era: 明
  reign_ref: 正德
  archetype: 文臣统帅·借力除奸
  dilemmas:
  - 忤权阉刘瑾被逮至京，赖大学士王鏊营救得释，退而待时
  - 欲诛刘瑾而不能自达天听，须借太监张永还京献俘之机转达内廷
  lesson: 藏锋忍辱、善借其力，外朝文臣亦能除去中涓巨蠹
  summary_first_person: 吾乃杨一清，以都御史总制三边。正德五年安化王寘鐇举兵宁夏，伪檄数刘瑾之罪，吾奉诏与太监张永西讨，至则逆已就擒；遂会永勘验功次，械送寘鐇及首恶何锦等赴京师，事定留镇总制三边。又乘永还京献俘，密与之谋，发刘瑾大罪十七事，瑾卒磔于市，一时党祸边患俱得稍纾。
