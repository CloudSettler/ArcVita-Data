  birth_date: 1569
  death_date: 1635
  era: 明末（万历至崇祯年间）
  reign_ref: 明崇祯帝
  archetype: 主抚失策的三边总督
  dilemmas:
  - 帝言“寇亦吾赤子，宜招抚不可纯勦”，然降众安置无策，抚而复叛，恩信反成寇资
  - 延抚张梦鲸愤恚移书纠叅，鹤不以上闻，情法之间进退两难
  lesson: 治乱不可专恃姑息——招抚若无屯田安置与法度稽核相辅，则降者复叛，宽仁反酿大祸
  summary_first_person: 崇祯二年我以右副都御史总督三边，时陕西大饥，边兵饥民相纠为盗。我笃信朝廷“寇亦赤子”之谕，力主招抚，给免死牌、宣圣谕、受神一魁降而数其十罪仍赦之。然群盗视总督如儿戏，淫掠如故，抚局遂坏。崇祯四年十月我被革职逮讯，五年论戍，一生以宽仁始，以谪戍终。
  source_urls:
  - 钦定四库全书·绥寇纪略·卷一（吴伟业撰）
endeavors:
