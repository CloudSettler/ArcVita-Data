    highlight_event_id: guji-杨鹤-event-appointment
  - key: breakthrough
    name_zh: 力主招抚
    labels:
      zh: 崇祯三年，与刘广生出示招抚，给贼首黄虎、小红狼等免死牌，安置延绥河曲；又请发裁扣站银充兵费
    start_date: 1630-04-01
    highlight_event_id: guji-杨鹤-event-zhaofu
  - key: climax
    name_zh: 宁州受降
    labels:
