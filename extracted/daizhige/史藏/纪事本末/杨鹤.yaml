    start_date: 1631-04-01
    highlight_event_id: guji-杨鹤-event-ningzhou
  - key: closure
    name_zh: 抚局败坏革职论戍
    labels:
      zh: 崇祯四年十月革职逮讯，五年正月论戍，主抚之策终为朝野所咎
    start_date: 1631-11-01
    highlight_event_id: guji-杨鹤-event-dismissal
  decisions:
  - date: 1629-03-01
    title_zh: 受命总督三边
    rationale: 固原兵变、流贼四起，朝命以右副都御史督师，责在收拾边局
  - date: 1630-04-01
    title_zh: 主抚不以闻
    rationale: 王嘉引掠延安庆阳，鹤以饥民胁从宜宽，出示招抚而不上闻，欲以怀柔消乱
  - date: 1631-04-01
    title_zh: 移镇宁州受神一魁降
    rationale: 奉帝“寇亦吾赤子宜招抚不可纯勦”之谕，数贼十罪而赦之以示信
  - date: 1631-11-01
    title_zh: 俯首就逮
    rationale: 降贼叛乱相继，抚策见诘于朝，鹤无以自解，革职逮讯论戍
