  name_zh: 毕沅
  names:
    zh: 毕沅
    en: Bi Yuan
  lifespan:
    birth:
      date: 1730
      precision: year
      is_circa: true
      raw: 雍正八年（1730年）
    death:
      date: 1797
      precision: year
      is_circa: true
      raw: 嘉庆二年（1797年）
  birth_date: 1730
  death_date: 1797
  era: 清·乾隆年间
  reign_ref: 乾隆
  archetype: 学者型封疆大吏
  dilemmas:
  - 兰州军情危急而地属邻封，须在维持陕西本省政务与全力协济入甘满汉官兵之间权衡调度
  lesson: 封疆之责不限辖地，邻省有警亦当闻警先办、驰奏军情，使庙算先定则援师速发
  summary_first_person: 我是毕沅，乾隆间以状元入仕，久抚陕西；辛丑年苏四十三乱起，陷河州、逼兰州，我驰奏军情、悉心调度，协济满汉官兵，事事迅速妥协，因先办而与谕旨暗合，蒙赏一品顶带、交部优叙。
  source_urls:
  - https://zh.wikisource.org/wiki/欽定蘭州紀略
endeavors:
- id: guji-毕沅-endeavor-1
  title_zh: 状元登第与抚陕仕途
  start_date: 1760
  summary_zh: 乾隆二十五年殿试夺魁，授修撰入翰林，累迁至西安巡抚，久任西北冲要，为其后邻省军兴时的调度协济预作根基。
  phases:
  - key: brewing
    name_zh: 翰墨举业
    labels:
      zh: 举业修行
    start_date: 约1748
  - key: breakthrough
    name_zh: 状元及第
    labels:
      zh: 殿试夺魁
    start_date: 1760
    highlight_event_id: guji-毕沅-event-zhuangyuan
  - key: climax
    name_zh: 出抚陕西
    labels:
      zh: 坐镇西安
    start_date: 约1773
    highlight_event_id: guji-毕沅-event-renshaanxi
  - key: closure
    name_zh: 抚陕任内逢军兴
    labels:
      zh: 闻警驰奏
    start_date: 约1781-04
    highlight_event_id: guji-毕沅-event-zoubao-lanzhou
  decisions:
  - date: 1760
    title_zh: 由一甲第一入翰林院
    rationale: 以清要之途立身，学问政事并举，为日后开府封疆积累名器
  - date: 约1773
    title_zh: 出抚陕西
    rationale: 西北边要之地，抚绥练兵兼筹粮运，恰为邻省兰州军兴时的协济调度奠定基础
- id: guji-毕沅-endeavor-2
  title_zh: 兰州之役邻封协济
  start_date: 1781-04
  summary_zh: 乾隆四十六年辛丑，撒拉尔番回苏四十三等陷河州、进逼兰州省城，西安巡抚毕沅在西安境内闻报即悉心调度，协济满汉官兵，事事迅速妥协，并有先办而与所降谕旨相合者，上嘉实属可嘉之至，因邻封安抚裕良图之功，赏给一品顶带、交部从优议叙。
  phases:
  - key: brewing
    name_zh: 闻警先办
    labels:
      zh: 先办协济
    start_date: 约1781-04
  - key: breakthrough
    name_zh: 驰奏军情
    labels:
      zh: 奏报逆匪逼兰
    start_date: 1781-04
    highlight_event_id: guji-毕沅-event-zoubao-lanzhou
  - key: climax
    name_zh: 调度协济
    labels:
      zh: 满汉官兵迅速妥协
    start_date: 1781-04
    highlight_event_id: guji-毕沅-event-xieji-junwu
  - key: closure
    name_zh: 叙功受赏
    labels:
      zh: 赏一品顶带
    start_date: 约1781-04
    highlight_event_id: guji-毕沅-event-yipindingdai
  decisions:
  - date: 1781-04
    title_zh: 驰奏逆匪直逼兰州省城
    rationale: 军情先达则庙算先定，朝廷得以调派满汉各路官兵并健锐、火器营京兵四千名，命阿桂、和珅督率进剿
  - date: 1781-04
    title_zh: 先办协济而后俟旨
    rationale: 军行粮糈为先，邻省安危一体，先行筹办恰与所降谕旨相合，故获嘉奖
events:
- id: guji-毕沅-event-birth
  title_zh: 毕沅出生
  date: 1730
  year_of: 1730
  is_circa: true
  description_zh: 毕沅生于清雍正八年（1730年），后官至西安巡抚。
- id: guji-毕沅-event-zhuangyuan
  title_zh: 乾隆二十五年状元及第
  date: 1760
  year_of: 1760
  description_zh: 殿试第一甲第一名，授翰林院修撰，自科第清途入仕。
- id: guji-毕沅-event-renshaanxi
  title_zh: 出任西安巡抚
  date: 约1773
  year_of: 1773
  description_zh: 累迁至西安巡抚，坐镇西北冲要；至乾隆四十六年兰州军兴时，仍以西安巡抚闻警奏报、调度协济。
- id: guji-毕沅-event-zoubao-lanzhou
  title_zh: 驰奏逆匪直逼兰州省城
  date: 约1781-04
  year_of: 1781
  description_zh: 辛丑年三月末撒拉尔番回苏四十三等陷河州、拥众犯兰州，四月朔御制诗注记「今日复据毕沅奏逆匪直逼兰州省城」，朝廷因调派满汉各路官兵并健锐、火器营京兵四千名，命大学士阿桂、尚书和珅带领侍卫督率进兵。
- id: guji-毕沅-event-xieji-junwu
  title_zh: 悉心调度协济满汉官兵
  date: 约1781-04
  year_of: 1781
  description_zh: 毕沅在西安境内闻报即悉心调度，协济满汉官兵，事事迅速妥协，并有先办而与所降谕旨相合者，上批实属可嘉之至。
- id: guji-毕沅-event-yipindingdai
  title_zh: 赏给一品顶带从优议叙
  date: 约1781-04
  year_of: 1781
  description_zh: 与勒尔谨、仁和等同奏克复河州、省城围解，因邻封安抚调度有方，奉旨赏给一品顶带，仍交部从优议叙，以奖贤劳。
- id: guji-毕沅-event-death
  title_zh: 毕沅去世
  date: 1797
  year_of: 1797
  is_circa: true
  description_zh: 毕沅卒于嘉庆二年（1797年）。
