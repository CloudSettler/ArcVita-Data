person:
  qid: guji-沈一贯
  name_zh: 沈一贯
  names:
    zh: 沈一贯
    en: Shen Yiguan
  lifespan:
    birth:
      precision: unknown
      is_circa: false
    death:
      precision: unknown
      is_circa: false
  era: 明万历年间
  reign_ref: 万历
  archetype: 权相党魁
  dilemmas:
  - 持权求胜与清议侧目：受黜者身去而名益高，东林声势因对立而盛
  - 楚宗案与妖书案中疑忌郭正域、沈鲤，陷阁部互相龃龉
  - 连岁乞休八十疏，恋栈与求去之间的迟疑
  lesson: 以私人植党、钳制言路者，纵能一时持权，终致清议并起、身名两损。
  summary_first_person: 我沈一贯，万历二十二年以礼部尚书兼东阁大学士入直文渊阁，自许有才，不为人下。楚宗案、妖书案中我与郭正域、沈鲤相龃龉，朝士多附东林而攻我浙党，党争遂起，垂五十年。万历三十四年，疏八十上始得致仕归。
