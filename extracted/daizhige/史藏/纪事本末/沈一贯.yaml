    start_date: '1594-05-09'
    highlight_event_id: guji-沈一贯-event-tingtui
  - key: breakthrough
    name_zh: 入阁柄政
    labels:
      zh:
      - 特简入相
    start_date: '1594-05-18'
    highlight_event_id: guji-沈一贯-event-ruge
  - key: climax
    name_zh: 楚案妖书与党争
    labels:
      zh:
      - 浙党之首
      - 遍置私人
    start_date: '1603-06-23'
    highlight_event_id: guji-沈一贯-event-yaoshu
  - key: closure
    name_zh: 京察被劾致仕
    labels:
      zh:
      - 疏八十上始允
    start_date: '1605-01-07'
    highlight_event_id: guji-沈一贯-event-zhishi
  decisions:
  - date: '1603-11-01'
    title_zh: 疑郭正域作妖书，纵钱梦皋直指正域并及沈鲤
    rationale: 借妖书事倾轧异己，归狱皦生光而后得解
  - date: '1605-01-07'
    title_zh: 请以萧大亨主京察笔，惮杨时乔方严
    rationale: 欲护被察私人钱梦皋等，疏上竟属时乔，谋不遂
- id: guji-沈一贯-endeavor-2
  key_phase_start: breakthrough
  name_zh: 与东林相持
  phases:
  - key: breakthrough
    name_zh: 廷推之争后入相
    labels:
      zh:
      - 以才自许
    start_date: '1594-05-18'
    highlight_event_id: guji-沈一贯-event-ruge
  - key: climax
    name_zh: 浙党与东林倾轧
    labels:
      zh:
      - 持权求胜
      - 附者有人
    start_date: '1605-05-01'
    highlight_event_id: guji-沈一贯-event-sanchazhongliu
  - key: closure
    name_zh: 奸贪被劾放归
    labels:
      zh:
      - 并致仕
    start_date: '1606-06-01'
    highlight_event_id: guji-沈一贯-event-zhishi
  decisions:
  - date: '1599-09-01'
    title_zh: 密揭沈鲤、朱赓年未及艾，请先立老成，助朱赓入阁
    rationale: 运用密疏运作阁臣人选，插手枚卜
events:
- id: guji-沈一贯-event-birth
  event_type: birth
  title_zh: 沈一贯出生
  description_zh: 生年不详，后仕明，官至内阁大学士。
- id: guji-沈一贯-event-tingtui
  event_type: career
  date: '1594-05-09'
  year_of: 1594
  title_zh: 廷推阁臣，沈一贯名列其中
  description_zh: 万历二十二年五月丁亥，吏部推王家屏、沈鲤、沈一贯等阁臣，上览不怿，下旨诘责。
- id: guji-沈一贯-event-ruge
  event_type: career
  date: '1594-05-18'
  year_of: 1594
  title_zh: 以礼部尚书兼东阁大学士入阁
  description_zh: 万历二十二年五月辛卯，沈一贯、陈于陛兼东阁大学士，直文渊阁；其时顾宪成疏救反遭削籍。
- id: guji-沈一贯-event-chuzong
  event_type: career
  date: '1603-06-23'
  year_of: 1603
  title_zh: 楚宗案中主张亲王不当勘
  description_zh: 万历三十一年，楚王与宗人相讦，沈一贯主当体访不当勘，与右郭正域者相持，阁部龃龉。
- id: guji-沈一贯-event-yaoshu
  event_type: career
  date: '1603-11-01'
  year_of: 1603
  title_zh: 妖书事起，疑郭正域为之
  description_zh: 万历三十一年十一月，妖书事起，沈一贯疑郭正域所为，钱梦皋遂直指正域并及沈鲤，后归狱皦生光。
- id: guji-沈一贯-event-sanchazhongliu
  event_type: career
  date: '1605-01-07'
  year_of: 1605
  title_zh: 京察中欲以萧大亨主笔而不果
  description_zh: 万历三十三年正月考察京官，沈一贯惮杨时乔方严，请萧大亨主笔；上以时乔廉直竟属之，中旨留被察之钱梦皋。
- id: guji-沈一贯-event-beihe
  event_type: career
  date: '1605-05-01'
  year_of: 1605
  title_zh: 刘元珍等交章劾其遍置私人
  description_zh: 万历三十三年五月至七月，刘元珍、贺灿然、庞时雍等先后弹劾沈一贯蒙上箝下、欺罔误国，温纯致仕，京察始得奏。
- id: guji-沈一贯-event-zhishi
  event_type: death
  date: '1606-06-01'
  year_of: 1606
  title_zh: 致仕归里
  description_zh: 万历三十四年夏六月，陈良训、孙居相劾其奸贪，沈一贯、沈鲤并致仕；一贯连岁乞休，疏八十上始允。
- id: guji-沈一贯-event-death
  event_type: death
  title_zh: 沈一贯去世
  description_zh: 卒年不详，致仕后归里以终。
