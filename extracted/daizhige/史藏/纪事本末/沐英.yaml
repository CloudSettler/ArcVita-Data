      date: '1345'
      precision: year
      is_circa: true
      raw: 定远人沐英八岁遭兵乱
  birth_date: '1345'
  death_date: ''
  era: 元末明初
  reign_ref: 朱元璋（明太祖）起兵至称帝时期
  archetype: 幼孤见抚的开国养子名将
  dilemmas:
  - 八岁遭兵乱、父母双亡、无所依傍的乱世孤儿，何以为生
  - 被义军主帅收养赐姓，身为人子又身为将士，忠与孝如何两全
  lesson: 孤幼无依之人得遇仁主庇育，知恩奋进，亦可成长为柱石之才
  summary_first_person: 我本是定远一个八岁便遭兵乱、失去父母的孤儿，幸得主上怜我孤苦，与高皇后一同抚育我为子，赐我朱姓，军中称我为“沐舍”。他们择师教我，把我从流离无依的孩童培养成能执兵效力之人。后来天下大定，论及开国诸将，我的名字竟得以与徐达、常遇春、李文忠诸公并列，谓可匹敌古之名将——我这一生，全始于那位在兵荒马乱中俯身收留我的义父。
