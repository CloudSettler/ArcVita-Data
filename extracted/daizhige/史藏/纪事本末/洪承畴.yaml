  dilemmas:
  - 剿抚两难：既奉诏主抚又须靖乱，杀降诛叛以绝后患
  - 忠节之辨：明督师重臣终降于清，功业与名节不可两全
  lesson: 能吏可以定一时之乱，然处鼎革之际，功名与气节往往难以兼得
  summary_first_person: 我洪承畴由督粮道参议起家，以围剿陕西流寇显露才略，擒王左挂、诛叛贼，累迁延绥巡抚、三边总督，力主剿抚兼施，为明廷戡乱建功；然大厦将倾，我终易节归清，此中功罪，任由后人评说。
