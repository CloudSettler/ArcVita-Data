  lesson: 借信仰与铁令凝众，虽能席卷数省，然围坚城失利即更张其势，成败存乎机会与统御
  summary_first_person: 我是洪秀全，广东人，自号太平天德王，率众围长沙、破岳州，用分截之法与官兵周旋，所造天条书以敬天为第一义，深知文墨，御众极严。
