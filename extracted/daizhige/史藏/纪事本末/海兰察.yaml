  title_zh: 海兰察卒
  description_zh: 海兰察于乾隆五十八年（1793）病卒，谥武壮；本篇《钦定兰州纪略》所载为其乾隆四十六年督剿撒拉尔番回诸事。
  persons:
  - guji-海兰察
