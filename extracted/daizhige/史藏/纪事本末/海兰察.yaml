  precision: day
  is_circa: true
  year_of: 1781
  title_zh: 会同严饬军纪、安设卡栅、山间札大营
  description_zh: 各路兵零星散处、不俟力齐催令打仗致有伤亡，守城兵丁虚张声势彻夜放枪炮；和珅、海兰察等至后严饬禁止、搜捕杀贼，阿桂等申明军律、激励戎行、安设卡栅彼此接应，并于山间札一大营（四月廿九日奏）。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-2
- id: guji-海兰察-event-3
  type: endeavor
  date: '1781-06-23'
  precision: day
