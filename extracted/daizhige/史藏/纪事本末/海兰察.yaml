  precision: day
  is_circa: true
  year_of: 1781
  title_zh: 大举攻剿连下贼卡，偕明亮带兵驻守，次日焚毁本布尔庙
  description_zh: 闰五月十五日大举攻剿，攻得贼卡四座并贼人大卡，海兰察、明亮即带兵驻守；次日天明又占两处山包，烧毁贼营迤西本布尔庙，杀贼甚多，官兵接连占至黄河边，两岸设防水陆。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-1
- id: guji-海兰察-event-6
  type: endeavor
  date: '1781-07-25'
  precision: day
  is_circa: true
  year_of: 1781
  title_zh: 隔断水磨沟水道、填塞贼营井泉，断水困贼
  description_zh: 官兵安设木城卡栅四面围困，设法隔断水磨沟水道，华林寺后及雷坛二井以土填筑；夜间盗水者被杀，脱出老教供称贼五百余名防水五日已有渴死者，骡马牛驴数百匹倒毙殆尽（乾隆四十六年六月间）。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-2
- id: guji-海兰察-event-7
  type: endeavor
  date: '1781-08-03'
  precision: day
  is_circa: true
  year_of: 1781
  title_zh: 乘密雨填壕直进破贼营，阵斩首逆苏四十三
  description_zh: 六月十五日海兰察、明亮率官兵先伏卡边，乘密雨出贼不意，以枝捆土袋填塞贼壕奋勇直进；远则枪箭齐发、近则短兵相接，拏立木栅直扑贼营，割得贼首一百二十余颗，认出首犯苏四十三、韩一提巴拉等首级；海兰察、明亮、哈当阿首先出力，奉旨交部从优议叙。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-1
- id: guji-海兰察-event-8
  type: endeavor
  date: '1781-08-24'
  precision: day
  is_circa: true
  year_of: 1781
  title_zh: 扑入华林寺尽殱余党，撒拉尔之乱平
  description_zh: 七月初六日海兰察、明亮率侍卫官兵由华林寺扑入，重重围裹，火弹枪箭齐发、短兵砍杀，生擒贼六十七名、割获首级四百五十，寺内余贼殱戮无遗，无一人漏网，甘肃之乱遂平。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-1
