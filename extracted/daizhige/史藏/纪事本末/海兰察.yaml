  title_zh: 奉诏偕和珅、拉旺多尔济、额森特驰驿赴兰州督率剿捕
  description_zh: 苏四十三等陷河州、进逼省城，朝廷简派健锐火器两营京兵四千名，选乾清门巴图鲁侍卫带领，命和珅、拉旺多尔济及海兰察、额森特前往督率，大学士阿桂由河南取道会剿（乾隆四十六年四月初）。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-1
