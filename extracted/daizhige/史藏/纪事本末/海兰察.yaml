  year_of: 1781
  title_zh: 偕明亮率阿拉山马兵由龙尾山绕华林山西南斜扑贼卡
  description_zh: 川省屯练土兵到齐后，为预悉华林山势及进兵路径，阿桂派海兰察、明亮等率阿拉山马兵及屯练兵由龙尾山绕至华林山西南斜扑贼卡（闰五月初三日）。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-1
