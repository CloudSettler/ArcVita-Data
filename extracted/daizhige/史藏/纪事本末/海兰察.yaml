  precision: day
  is_circa: true
  year_of: 1781
  title_zh: 四路攻剿贼营，抢得贼卡四座、杀贼百余名
  description_zh: 闰五月初九日官兵四路攻剿，抢得贼卡四座、杀贼百余名；贼倾穴出迎拚死抵拒，官军遂改于贼营迤西严密围困，绝其觅食之路。
  persons:
  - guji-海兰察
  endeavor_id: guji-海兰察-endeavor-1
