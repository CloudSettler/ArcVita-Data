    en: Hailancha
  lifespan:
    birth:
      date: '1741'
      precision: year
      is_circa: true
      raw: 生年史无明文，约当乾隆初年
    death:
      date: '1793'
      precision: year
      is_circa: false
      raw: 乾隆五十八年
  birth_date: 约1741
  death_date: '1793'
  era: 清·乾隆朝
  reign_ref: 乾隆
  archetype: 索伦出身的领队骁将、钦差督率大臣
  dilemmas:
  - 奉诏星驰赴援，而各路之兵未齐、主帅未至，骤战则有伤亡、观望则失军期
  - 钦差同列调度未协、兵丁虚张声势，须协力申明军律、收束行阵而不逾职分
  lesson: 兵不整不战：先申军律、立卡接应、断水围困，俟敌力竭，再乘隙出奇一举破巢
  summary_first_person: 我是海兰察，索伦人。乾隆四十六年撒拉尔番回苏四十三作乱，我奉诏偕和珅、拉旺多尔济、额森特率健锐火器营劲旅驰援兰州，复归大学士阿桂节制。闰五月我偕明亮率阿拉山马兵由龙尾山绕扑华林山西南贼卡，四路攻剿连得卡栅，焚本布尔庙；又隔断水磨沟水道、填塞井泉断水困贼；六月十五日乘密雨填壕直进，远则枪箭齐发、近则短兵相接，直扑贼营，阵斩首逆苏四十三，蒙旨交部从优议叙；七月初六扑入华林寺，生擒六十七名、割获首级四百五十，余贼殱戮无遗，甘乱遂平。
endeavors:
- id: guji-海兰察-endeavor-1
  name_zh: 督率驰剿撒拉尔番回之役（华林山破巢诛渠）
  labels:
    zh: 平叛征战
  start_date: 1781-04
  end_date: 1781-08
  summary_zh: 乾隆四十六年苏四十三陷河州、进逼兰州，海兰察奉诏与和珅等率京营劲旅驰援，旋归阿桂节制，领兵连破华林山贼卡，诛首逆苏四十三，尽殱余党于华林寺。
  phases:
  - key: brewing
    name_zh: 奉诏驰援兰州
    labels:
      zh: 驰驿督率
    start_date: '1781-04-23'
    highlight_event_id: guji-海兰察-event-1
  - key: breakthrough
    name_zh: 绕龙尾山斜扑华林山贼卡
    labels:
      zh: 攻卡夺险
    start_date: '1781-06-23'
    highlight_event_id: guji-海兰察-event-3
  - key: climax
    name_zh: 乘雨填壕破巢、阵斩苏四十三
    labels:
      zh: 阵斩渠魁
    start_date: '1781-08-03'
    highlight_event_id: guji-海兰察-event-7
  - key: closure
    name_zh: 扑入华林寺尽殱余党
    labels:
      zh: 一网打尽
    start_date: '1781-08-24'
    highlight_event_id: guji-海兰察-event-8
  decisions:
  - date: '1781-08-03'
    title_zh: 乘密雨出贼不意、抛填壕沟直进
    rationale: 贼掘壕负险死守，先伏卡边相机进攻；乘密雨以枝捆土袋填壕，出其不意奋勇跃入鏖杀，远则枪箭近则短兵，遂破巢而得首逆。
  - date: '1781-08-24'
    title_zh: 乘胜直扑华林寺、重重围裹勿使漏网
    rationale: 苏四十三既诛，余党四百余人遁入华林寺死守，须四面围紧、火弹枪箭齐发，务绝根株，不使一名幸免。
- id: guji-海兰察-endeavor-2
  name_zh: 会办兰州军务：整饬行阵与断水围困
  labels:
    zh: 整军围困
  start_date: 1781-05
  end_date: 1781-08
  summary_zh: 京营与各路之兵初到零星散处、虚张声势、士气不振，海兰察与阿桂、和珅会同申明军律、安设卡栅彼此接应、山间札大营，并隔断水磨沟水道、填塞贼营井泉，断水困贼以俟一举。
  phases:
  - key: brewing
    name_zh: 驰抵省城、会合诸军
    labels:
      zh: 会剿整备
    start_date: '1781-05-01'
    highlight_event_id: guji-海兰察-event-1
  - key: breakthrough
    name_zh: 申明军律、安卡接应
    labels:
      zh: 严饬行阵
    start_date: '1781-05-21'
    highlight_event_id: guji-海兰察-event-2
  - key: climax
    name_zh: 隔水填井、断水困贼
    labels:
      zh: 困敌以渴
    start_date: '1781-07-25'
    highlight_event_id: guji-海兰察-event-6
  - key: closure
    name_zh: 俟其力竭、一举尽殱
    labels:
      zh: 收功全胜
    start_date: '1781-08-24'
    highlight_event_id: guji-海兰察-event-8
  decisions:
  - date: '1781-05-21'
    title_zh: 严禁虚张枪炮、申明军律安卡接应
    rationale: 守城兵丁虚张声势彻夜施放枪炮、各路之兵零星不俟力齐催战致有伤亡、士气不振，故搜捕杀贼、申律励戎、安设卡栅并山间札大营以固军心。
  - date: '1781-07-25'
    title_zh: 隔断水道填井困贼
    rationale: 贼营蓄粮足延时、取水黄河，惟水可绝；隔断水磨沟水道、以土填筑华林寺后及雷坛二井，使贼渴毙力竭，可不战自溃。
