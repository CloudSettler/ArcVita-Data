  archetype: 清官循吏·治水能臣
  dilemmas:
  - '~'
  lesson: 为政在务实恤民，浚河治水使民得食，功在生民。
  summary_first_person: 我海瑞以直节清望著称，巡抚江南时委官开浚吴淞故道，万丈河工不两月而成，民赖以食。
  source_urls:
  - https://zh.wikisource.org/wiki/明史紀事本末
