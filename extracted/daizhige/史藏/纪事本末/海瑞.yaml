  decisions:
  - date: '1570'
    title_zh: 委松江府同知黄成乐、上海知县张{山顶}开浚吴淞江王家渡至宋家港
    rationale: 吴淞江久淤成灾，议减河面为宽十五丈、底七丈五尺、深一丈五尺六寸，以省工费而求速成。
  - date: '1570'
    title_zh: 岁大饥而大兴河役
    rationale: 畚锸云集，饥民得以佣工就食，两月告成，以工代赈，水利赈济两得。
events:
- id: guji-海瑞-event-birth
  date: '1514'
  year_of: 1514
  type: birth
  summary_zh: 海瑞生（约正德年间）。
- id: guji-海瑞-event-death
  date: '1587'
  year_of: 1587
  type: death
  summary_zh: 海瑞卒（约万历十五年前后）。
- id: guji-海瑞-event-1
  date: '1569'
  year_of: 1569
  type: office
  event_key: 巡抚江南
  summary_zh: 海瑞巡抚应天诸府，苏松水利积淤，委官筹划开浚吴淞江。
- id: guji-海瑞-event-2
  date: '1570'
  year_of: 1570
  type: project
  event_key: 委官开浚
  summary_zh: 隆庆四年，委松江府同知黄成乐、上海知县张{山顶}开浚王渡至宋家港，长一万一千五百七十一丈，原议阔三十余丈后议减半；共用工银六万余两。
- id: guji-海瑞-event-3
  date: '1570'
  year_of: 1570
  type: project-completion
  event_key: 河工告成
  summary_zh: 是岁大饥，畚锸云集，不两月而河工告成，民得仰食。
- id: guji-海瑞-event-4
  date: '1587'
  year_of: 1587
  type: aftermath
  event_key: 浚筑奏功
  summary_zh: 谷应泰论吕光询治水三利、海瑞浚筑奏功，与历代吴淞水利治理相续，后世因吴中水患复请特设水利副使。
