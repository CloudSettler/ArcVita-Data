person:
  qid: guji-温福
  name_zh: 温福
  names:
    zh: 温福
    en: Wenfu
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      date: 1773
      precision: year
      is_circa: false
      raw: 乾隆三十八年（癸巳）木果木之败遇害
  death_date: '1773'
  era: 清乾隆年间
  reign_ref: 乾隆帝
  archetype: 兵败身死的定边将军
  dilemmas:
  - 绿营怯懦、兵力分散，而敌据险死守，进退两难
  - 朝廷急于平定两金川，须在攻坚与持重之间权衡
  lesson: 兵分则单、轻信降众则败，将不知调度则虽拥重兵亦覆
  summary_first_person: 我以大学士授定边将军，由西路进讨小金川，克巴朗拉、资哩、布朗郭宗，俘土司泽旺，复与阿桂会师克美诺，两金川一度将平。然进讨促浸时我移军木果木，调度失宜，以二万余人散布各卡，贼猝由间道掩至，煽降番复叛，绿营先溃，我率亲兵搏战，遇害尽节，军复失利。
  source_urls:
  - https://zh.wikisource.org/wiki/欽定平定兩金川方略
