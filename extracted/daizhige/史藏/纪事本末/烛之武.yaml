  dilemmas:
  - 年老不被用而临危受命，说秦退兵
  - 小国处晋楚（晋秦）大国之间，畏首畏尾、铤而走险
  lesson: 以利害析势，一言可解一国之围；小国事大，在徳则其人，不徳则其鹿。
  summary_first_person: 我是郑国大夫烛之武，身处晋楚秦诸大国夹缝之间。往年正月我曾往朝于晋之夷地，为郑国周旋事大国之礼；国之存亡，系我一言之辩。
