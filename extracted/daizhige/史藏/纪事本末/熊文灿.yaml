person:
  qid: guji-熊文灿
  name_zh: 熊文灿
  names:
    zh: 熊文灿
    en: Xiong Wencan
  lifespan:
    birth:
      date: 约1575
      precision: year
      is_circa: true
      raw: 约万历初年（1575年前后）
    death:
      date: 1640
      precision: year
      is_circa: false
      raw: 崇祯十三年（1640）论死弃市
  birth_date: 约1575
  death_date: 1640
  era: 明末（万历—崇祯）
  reign_ref: 崇祯
  archetype: 主抚误国的五省总理
  dilemmas:
  - 醉后失言自任办寇，实则无专征之才而膺总理重任
  - 抚剿两难：空隐和尚已点破流寇非刘香比，抚则养痈，剿则兵饷俱绌
  - 节制失灵：左良玉宿将专进止、粤兵乌蛮与北兵相仇，麾下实不为用
  lesson: 招抚必以战胜之威为质；无制贼之实而恃抚局虚名，终酿谷城之变，身死名裂。
  summary_first_person: 我熊文灿，黔之泸州人，久宦南服，五溪獠峒之间自负知兵；督两广时以闽海招抚刘香之术邀功，岭表富实，日以珠玑犀象饷遗权贵。崇祯十年因杨嗣昌之荐出膺总理，六月闻召，九月过庐山谒空隐和尚，自度兵不能制贼死命、将无可属大事，遂定抚议；十月抵安庆，乞边兵战马而左良玉终不为用。既受张献忠、罗汝才之降，任其屯谷城、居房竹拥众不散，谷房变起，抚局尽溃。刘曰俊谓招安之失策在回原籍三字，而我无专征才以至于败，岂招安误之哉。
endeavors:
- id: guji-熊文灿-endeavor-1
  person_id: guji-熊文灿
  name_zh: 督抚两广以招抚术驭海寇
  description: 其督两广也，以闽海招抚功即其术用之粤寇刘香；惠州三道员虽受绐被执，寻而香死，得褒赏益重，岭表称富实；熊官南方久，珠玑荃葛孔雀犀象日饷遗权贵人，冀长制交广，自谓幸效川湖督朱燮元十年卧护西南。
  phases:
  - key: brewing
    name_zh: 久宦岭表
    labels:
      zh: 南官久任
    start_date: 1628
    highlight_event_id: guji-熊文灿-event-governor-guang
  - key: breakthrough
    name_zh: 招抚刘香
    labels:
      zh: 闽海招抚
    start_date: 1635-04
    highlight_event_id: guji-熊文灿-event-liuxiang-death
  - key: climax
    name_zh: 岭表富实·珰使暗察
    labels:
      zh: 馈遗权贵
    start_date: 1636
    highlight_event_id: guji-熊文灿-event-eunuch-visit
  - key: closure
    name_zh: 粤督见荐
    labels:
      zh: 内调办寇
    start_date: 1637-06
    highlight_event_id: guji-熊文灿-event-appointment
  decisions:
  - date: 1635
    title_zh: 以招抚术靖闽海粤寇
    rationale: 闽海招抚既效，即以其术用之刘香；香虽寻毙，坐得褒赏，遂自诩知兵，欲效朱燮元卧护西南，冀长制交广。
  - date: 1637-06
    title_zh: 应荐出膺总理
    rationale: 侨蕲水与姚明恭为姻娅，姚附嗣昌欲倚熊以就功名，言此有内援可荐；嗣昌新得帝意、惧讨贼引以自解，遂奏用之，熊闻召即办严过岭旦暮赴之。
- id: guji-熊文灿-endeavor-2
  person_id: guji-熊文灿
  name_zh: 总理剿寇与抚局崩坏
  description: 崇祯十年六月杪闻召，九月过岭道庐山谒空隐和尚而定抚议；十月抵安庆，随黔兵火攻手千人无骑，上书请战马三千匹，嗣昌以左良玉一军隶焉而实不为用；既受张献忠、罗汝才之抚，屯谷城、居房竹不回原籍；十二年谷房变起，抚局尽溃，外史谓熊文灿无专征才以至于败，岂招安误之哉。
  phases:
  - key: brewing
    name_zh: 庐山问道
    labels:
      zh: 受任踌躇
    start_date: 1637-06
    highlight_event_id: guji-熊文灿-event-appointment
  - key: breakthrough
    name_zh: 驻皖请兵
    labels:
      zh: 檄乞边马
    start_date: 1637-10
    highlight_event_id: guji-熊文灿-event-anqing
  - key: climax
    name_zh: 谷房受抚
    labels:
      zh: 招抚献曹
    start_date: 1638
    highlight_event_id: guji-熊文灿-event-surrender
  - key: closure
    name_zh: 谷房变作
    labels:
      zh: 抚局崩坏
    start_date: 1639-05
    highlight_event_id: guji-熊文灿-event-gucheng-revolt
  decisions:
  - date: 1637-09
    title_zh: 庐山问计，定招抚之策
    rationale: 空隐诘以所将兵足制贼死命乎、诸将有可属大事乎，皆答不能；又戒以流寇非刘香比慎之，熊长跽佛前请以余年入道，遂定抚议。
  - date: 1637-10
    title_zh: 请留左良玉一军并乞边兵战马
    rationale: 所随黔兵火攻手千人无骑，上书请战马三千匹；嗣昌用左良玉一军隶焉，然良玉宿将专进止，所募粤人乌蛮与北兵相仇，托辞水土遣之，气稍振而节制实虚。
  - date: 1638
    title_zh: 受献忠、汝才之降而不散其众
    rationale: 张献忠住谷城、罗汝才居房竹，俱托词难回原籍而不散部曲；刘曰俊先发其奸，文灿恃抚局不设备，遂养痈成谷房之变。
  - date: 1639-05
    title_zh: 变起之后抚策尽败
    rationale: 谷城、房竹同时举叛，招安之失策验；朝廷诛逮相寻，文灿以无专征才论死，附纪叹曰岂招安误之哉。
events:
- id: guji-熊文灿-event-birth
  person_id: guji-熊文灿
  type: birth
  title_zh: 熊文灿生于泸州（约）
  date: 约1575
  precision: year
  is_circa: true
  year_of: 1575
  description: 黔之泸州人，五溪好役属獠丁峒户，故自诩知兵；既贵侨居楚之蕲水。
- id: guji-熊文灿-event-governor-guang
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-1
  type: appointment
  title_zh: 总督两广
  date: 约1628
  precision: year
  is_circa: true
  year_of: 1628
  description: 其督两广也，以闽海招抚功即其术用之粤寇刘香；据本传时序，约崇祯初任。
- id: guji-熊文灿-event-liuxiang-death
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-1
  type: military
  title_zh: 粤寇刘香死，文灿得褒赏
  date: 1635-04
  precision: month
  is_circa: true
  year_of: 1635
  description: 无何香死，得褒赏益重，岭表称富实；前此惠州三道员虽受绐被执，抚术不效而卒收其功。
- id: guji-熊文灿-event-eunuch-visit
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-1
  type: political
  title_zh: 帝遣珰使观变，熊醉后失言自任办寇
  date: 约1636
  precision: year
  is_circa: true
  year_of: 1636
  description: 帝初疑刘香不死且不识文灿何如人，遣珰名广西采办药材往观之；珰微及中原寇乱，熊击案骂曰此行间诸臣误国耳，若文灿往讵令贼至是乎；悔失言，设五难四不可自脱，珰笑许立请于上，后特设督饷侍郎及奏事机速不关银台司皆此珰本谋。
- id: guji-熊文灿-event-appointment
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-2
  type: appointment
  title_zh: 嗣昌荐代王家祯为总理
  date: 1637-06
  precision: month
  is_circa: true
  year_of: 1637
  description: 嗣昌以王家祯不足任，荐粤督熊文灿为总理；文灿以六月杪闻召，办严过岭，未旦暮至，王家祯退为豫抚。
- id: guji-熊文灿-event-lushan
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-2
  type: consultation
  title_zh: 庐山谒空隐和尚，自度不能制贼
  date: 1637-09
  precision: month
  is_circa: false
  year_of: 1637
  description: 九月办严过岭，道庐山谒所善空隐和尚；和尚诘以兵足制贼死命乎、将有可属大事乎，熊答不能与未知，遂定招抚之议，请留山中十日而诸将不可。
- id: guji-熊文灿-event-anqing
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-2
  type: military
  title_zh: 抵安庆，请边兵战马
  date: 1637-10
  precision: month
  is_circa: false
  year_of: 1637
  description: 十月至安庆，所随黔兵火攻手千人无骑，上书请战马三千匹；嗣昌用左良玉一军隶焉；良玉提空名奉节制，粤兵与之不和，托辞南人不能水土遣之，止留帐下儿五十余人。
- id: guji-熊文灿-event-surrender
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-2
  type: negotiation
  title_zh: 受张献忠、罗汝才抚，屯谷城房竹
  date: 1638
  precision: year
  is_circa: false
  year_of: 1638
  description: 张献忠受抚住谷城，罗汝才居房竹，皆不回原籍而拥众自若；刘曰俊疏谓招安之失防乃回原籍三字误之，实先发其奸。
- id: guji-熊文灿-event-gucheng-revolt
  person_id: guji-熊文灿
  endeavor_id: guji-熊文灿-endeavor-2
  type: rebellion
  title_zh: 谷房变起，抚局尽溃
  date: 1639-05
  precision: month
  is_circa: true
  year_of: 1639
  description: 张献忠复叛于谷城，罗汝才应之于房竹，招安之策彻底破产；外史氏谓熊文灿无专征才以至于败，岂招安误之哉。
- id: guji-熊文灿-event-death
  person_id: guji-熊文灿
  type: death
  title_zh: 熊文灿论死
  date: 1640
  precision: year
  is_circa: false
  year_of: 1640
  description: 抚局败坏、罪在不赦，崇祯十三年被诛弃市，为崇祯朝因剿寇诛督臣之尤著者。
