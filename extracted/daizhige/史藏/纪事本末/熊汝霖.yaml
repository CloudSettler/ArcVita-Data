endeavors:
- id: guji-熊汝霖-endeavor-1
  name_zh: 浙东举义
  labels:
    zh:
    - 联络义兵
    - 复明举事
  phases:
  - key: brewing
    start_date: 1645-06
    name_zh: 密谋举义
  decisions:
  - date: '1645-06-08'
    title_zh: 走甬东面请王之仁之兵，期会孙嘉绩于定海
    rationale: 王之仁定海总兵心有机权，欲借其兵力举大事
  - date: '1645-08-25'
    title_zh: 与孙嘉绩合营龙王塘，加总都督院
    rationale: 沿江分汛防守，协同方国安、王之仁诸军共守江防
- id: guji-熊汝霖-endeavor-2
  name_zh: 江上督师
  labels:
    zh:
    - 渡江血战
    - 西征缯兵
  phases:
  - key: breakthrough
    start_date: '1645-09-08'
    name_zh: 江干连战
  decisions:
  - date: '1645-09-08'
    title_zh: 与监军陈潜夫合营并进，先登出击
    rationale: 自初八始有连战十日之约，渡江埋伏戈弩以待北骑
  - date: 1645-10
    title_zh: 以书币聘陈万良，欲内地起兵
    rationale: 江面仰攻不如内地起兵，故遣书聘西湖义军首领陈万良
events:
- id: guji-熊汝霖-event-jaqi-plot
  type: endeavor/launch
  date: 1645-06
  year_of: 1645
  name_zh: 与孙嘉绩密谋举义
  description_zh: 北兵下浙东之际，余姚乡绅原任礼科左给事中熊汝霖，与原任职方司郎中孙嘉绩密谋举义，并邀宁绍分守于颍通谋，复以书约定海总兵王之仁，期以十二日会于定海，约齐举事。
- id: guji-熊汝霖-event-xibiang-underattack
  type: battle
  date: '1645-08-23'
  year_of: 1645
  name_zh: 督兵至西兴
  description_zh: 二十三日以后，定海总兵王之仁统标兵，同熊汝霖、孙嘉绩等各督兵至西兴，江上军声渐振。
- id: guji-熊汝霖-event-jianggan-battle
  type: battle
  date: '1645-09-08'
  year_of: 1645
  name_zh: 江上渡江伏击大捷
  description_zh: 自初八日与监军陈潜夫合营并进，诸师无日不战；渡江埋伏戈弩，伏弩齐发，毙北将一员及数十骑，是役诸师气鼓壮，为江干战功第一。
- id: guji-熊汝霖-event-zha-biao-secret
  type: diplomacy
  date: '1645-09-14'
  year_of: 1645
  name_zh: 罗应魁被释送回熊营
  description_zh: 孙嘉绩兵罗应魁深入放火被获，缚见清营张存仁，不杀，遣还送熊汝霖营中，并持谕帖致瓶窑姚志卓。
