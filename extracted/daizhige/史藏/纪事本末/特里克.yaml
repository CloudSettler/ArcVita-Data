  birth_date: 约1230年（生年不详）
  death_date: 约1300年（卒年不详）
  era: 元世祖至元年间
  reign_ref: 元世祖忽必烈
  archetype: 辞命使者/边事谏臣
  dilemmas:
  - 奉密旨直造海都境视虚实，违命则诛、从命则身陷叛王营垒
  - 海都日召宗亲宴饮伺隙谋害，言辞进退间须以辩论全身并护国体
  lesson: 临危直言、持节不辱，以雄辨与胆识化险为夷，并为朝廷定“坚垒勿追”之策。
  summary_first_person: 我本为平阳马步改达噜噶齐，因应对称旨，奉世祖密旨出使叛王海都。入境直进，虽面临谋害而厉声斥之，海都嘉我雄辨，赠皮服而归。归后我进言海都兵繁而锐，宜坚垒待之、去则勿追，帝深然之，以金饰所受皮服命朝会服之以示褒。
