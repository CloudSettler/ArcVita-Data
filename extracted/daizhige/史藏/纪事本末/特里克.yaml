  description: 特里克生年史无明文，约至元前任平阳马步改达噜噶齐。
- id: guji-特里克-event-summon
  date: '1270'
  year_of: 至元初
  type: endeavor
  endeavor_id: guji-特里克-endeavor-1
  description: 廷议遣使海都，左右以特里克对，遂被召见，应对称旨，帝嘉其辨慧，命为使并遣二人副之。
- id: guji-特里克-event-envoy
  date: '1270'
  year_of: 至元初
  type: endeavor
  endeavor_id: guji-特里克-endeavor-1
  description: 特里克违背副使持重之议，直造海都境以视虚实，随即与诸王议事，转至海都处。
- id: guji-特里克-event-defiance
  date: '1270'
  year_of: 至元初
  type: endeavor
  endeavor_id: guji-特里克-endeavor-1
  description: 海都日召宗亲宴饮，伺隙谋害；特里克厉声斥之曰“且食毋令语言脱口相摭为罪”，海都愕然称其直，酒半求衣，海都嘉其雄辨增三袭皮服，厚赠遣行。
- id: guji-特里克-event-strategy
  date: '1270'
  year_of: 至元初
  type: endeavor
  endeavor_id: guji-特里克-endeavor-1
  description: 还朝悉以事闻，进言海都兵锐不宜速战，来坚垒待之、去勿追；帝深然之，勅所受皮服全饰以金，命朝会服之以示褒宠。
- id: guji-特里克-event-death
  date: '1300'
  year_of: 卒年不详（推测）
  type: death
  description: 史书未载其卒年，事迹仅见于至元初使海都之事。
