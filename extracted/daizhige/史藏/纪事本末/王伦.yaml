    highlight_event_id: guji-wanglun-event-linqing
  - key: closure
    name_zh: 困守临清、自焚而死
    labels:
      zh: 自焚而死
    start_date: 1774-10
    highlight_event_id: guji-wanglun-event-death
  decisions:
  - date: 1774-10-03
    title_zh: 夜起事攻寿张
    rationale: 寿张查拏邪教甚严、堂邑搜查张四孤庄，怀恨惧诛，遂先发制人，白布缠头爬城、围衙劫库、踞城称乱
  - date: 1774-10-06
    title_zh: 弃城流动作战
    rationale: 众仅千余、随地胁从而无粮械后援，入城止图劫掠银钱，得手即弃城不顾，以避官兵合围
  - date: 约1774-10-10
    title_zh: 进逼临清
    rationale: 临清当水路之冲、回空漕艘所必经，屯聚州南柳林、攻扰州城以胁漕运要道
