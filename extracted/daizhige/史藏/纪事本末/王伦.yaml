person:
  qid: guji-wanglun
  name_zh: 王伦
  names:
    zh: 王伦
    en: Wang Lun
  lifespan:
    birth:
      date: 约1720
      precision: decade
      is_circa: true
      raw: 生年不详，文本未载；据其为山东寿张教首，约生于康熙末年
    death:
      date: 1774-10
      precision: month
      is_circa: true
      raw: 乾隆三十九年九月，临清兵败，穷迫自焚死
  birth_date: 约1720
  death_date: 1774-10
  era: 清乾隆年间
  reign_ref: 乾隆
  archetype: 白莲教教门首领 · 起事叛乱领袖
  dilemmas:
  - 邪教久遭朝廷严禁，借教敛财聚众的生计与官府查拏之间已无退路
  - 乌合之众无力据城久守，弃城流窜则无根基，困守孤城则坐待合围
  - 胁从渐众而粮械后援皆无，聚众易而成事难，只得以劫掠维持
  lesson: 妖言左道纵能煽惑乡愚于一时，终不容于法度；铤而走险，不过自速其死。
  summary_first_person: 吾借白莲教名目传徒敛财，事魔叱菜，聚众焚香，党羽渐成。乾隆三十九年官府查拏邪教甚急，吾侪怀恨惧诛，遂于八月二十八日夜起事，白布缠头、各带器械爬入寿张城，围衙劫库、占踞城池；继弃寿张转掠阳谷、堂邑，身披黄马褂为魁，众至千余，进逼临清以胁漕运。然官兵四面合攻，大学士舒赫德统八旗劲旅继至，吾困守临清，穷迫自焚而死，党众尽被俘诛。
  source_urls:
  - https://ctext.org/searchbooks?if=gb&searchu=钦定临清纪略
