  decisions:
  - date: 约1765
    title_zh: 事魔叱菜、托以敛财
    rationale: 借白莲教名目惑众，以奉教之名聚敛钱财、结纳徒众
  - date: 约1774-08
    title_zh: 聚众焚香、密约举事
    rationale: 党羽既众而自知妖言左道圣世不容，遂以白布缠头为号、藏械密约，图谋不轨
- id: guji-wanglun-endeavor-2
  name_zh: 乾隆甲午起事
  type: 武装叛乱
  summary: 乾隆三十九年八月二十八日夜起事破寿张，转掠阳谷、堂邑，进逼临清，月余兵败自焚。
  phases:
  - key: brewing
    name_zh: 白布缠头、潜结党众
    labels:
