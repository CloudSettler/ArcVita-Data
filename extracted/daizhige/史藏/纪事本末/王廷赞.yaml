  name_zh: 王廷赞
  names:
    zh: 王廷赞
    en: Wang Tingzan
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 年屈古稀（乾隆四十六年时年约七十）
    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详
  era: 清乾隆年间
  reign_ref: 乾隆
  archetype: 守土尽节的地方大吏
  dilemmas:
  - 救援不至，为免茶毒生民，是否答应叛军条件，将马明新提至城堞示众
  - 守土者当捐躯报效还是保全己身，王廷赞以"国家有事之秋，臣子报效之日"自任
  lesson: 民信胜于兵食，守土官长以义率民、临危不惧，则危城可保
  summary_first_person: 我是王廷赞，盛京人，时任甘肃布政使。苏四十三叛众围攻兰州时，我年届古稀，慷慨激励僚属与士民登城守御，昼夜奔驰，徒步晓谕，开仓赈恤，虽无兵卫而民信独存，卒保省会无恙。
  source_urls:
  - 平回纪略（清）不著撰人
