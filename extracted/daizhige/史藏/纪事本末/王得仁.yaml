  - date: 1648-01
    title_zh: 劫杀巡抚章于天之饷差、力促金声桓反清
    rationale: 我本流贼，崇祯皇帝为我逼死，无饷可得，索饷之辱不能忍
  - date: 1649-02
    title_zh: 采胡澹上策，诈用清军旗号顺流袭九江
    rationale: 乘破竹之势，扬言章抚院请救者，江南必开门纳君
  - date: 1649-03
    title_zh: 与金声桓全军顿兵赣州城下
    rationale: 高进库不受册封作战，相持七十余日，师老为期
