person:
  qid: guji-王得仁
  name_zh: 王得仁
  names:
    zh: 王得仁
    en: Wang Deren
  lifespan:
    birth:
      date: '1610'
      precision: year
      is_circa: true
      raw: 生年不详，起群盗，从闯营
    death:
      date: '1649'
      precision: year
      is_circa: true
      raw: 永历三年正月南昌城破，死之（卷二截于围城，据史事补）
  birth_date: '1610'
  death_date: '1649'
  era: 明末清初
  reign_ref: 崇祯、弘光、隆武、永历
  archetype: 叛将
  dilemmas:
  - 投清后受督抚折辱索贿，反清则势孤难久
  - 欲侯爵而不得，怨愤与利害交争
  lesson: 失封赏之望则怨积于内，恃勇轻谋，终困孤城。
  summary_first_person: 我本闯部降将，人称王杂毛。降清后屡受折辱，不得提督之职，愤而与金声桓叛清归明，称建武侯，破九江，围赣州，终困守南昌，死于清兵围城。
  source_urls:
  - https://zh.wikisource.org/wiki/江变纪略
