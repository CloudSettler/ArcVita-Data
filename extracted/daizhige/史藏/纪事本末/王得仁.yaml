  description_zh: 五月七百骑至，谭泰掘濠筑城围困；清兵素畏王勇名，夜惊曰王杂毛来也
  persons_involved:
  - guji-王得仁
  - guji-金声桓
- id: guji-王得仁-event-death
  date: '1649'
  precision: year
  year_of: 1649
