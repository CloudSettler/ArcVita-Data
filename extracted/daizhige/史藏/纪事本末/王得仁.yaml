  labels:
    zh:
    - 攻赣州
    - 师老
  description_zh: 三月丙辰出师，册印封高进库不纳，白朝佐冲阵至城下而大军不继，顿兵相持；四月二十八日九江失守，内外皆走
  persons_involved:
  - guji-王得仁
  - guji-金声桓
  - 高进库
