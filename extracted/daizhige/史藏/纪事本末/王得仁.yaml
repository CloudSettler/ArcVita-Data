  year_of: 1649
  title_zh: 西征九江，不移时而破之
  labels:
    zh:
    - 破九江
  description_zh: 永历二年二月庚午，建武侯西征九江，纳胡澹上策，诈用清兵旗号服色顺流而下，一举破城
  persons_involved:
  - guji-王得仁
  - 胡澹
- id: guji-王得仁-event-qianzhou
  date: 1649-03
  precision: month
  year_of: 1649
