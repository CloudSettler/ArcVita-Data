person:
  qid: guji-王钦若
  name_zh: 王钦若
  names:
    zh: 王钦若
    en: Wang Qinruo
  lifespan:
    birth:
      date: 0962
      precision: year
      is_circa: false
      raw: 生于北宋建隆三年（962年）
    death:
      date: '1025'
      precision: year
      is_circa: false
  birth_date: 0962
  death_date: '1025'
  era: 北宋
  reign_ref: 宋真宗、宋仁宗朝
  archetype: 权相与祥瑞政治推手
  dilemmas:
  - 澶渊之盟后力主南迁避敌，与寇准主战立场对立，身处和战与君心之间
  - 顺应真宗崇道心理制造天书祥瑞，借神道设教巩固相位，背负"奸邪"之名
  - 主持编修《册府元龟》等巨型典籍，功在文献而名节受损
  lesson: 逢迎君意可得一时之宠，然史笔如铁，功过终难相掩
  summary_first_person: 我王钦若，事真宗为相，澶渊之后力请南迁，又倡天书封禅之说以固君宠；然我主持编修《册府元龟》、校《道藏经》、定郊丘板位，于典章文献亦有所成，虽时人讥为"瘿相"，仁宗朝犹再登相位。
  source_urls:
  - https://zh.wikisource.org/wiki/皇宋通鉴长编纪事本末
