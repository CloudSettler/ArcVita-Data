      raw: ''
  birth_date: '-1534'
  death_date: '1611'
  era: 明代
  reign_ref: 万历
  archetype: 权相
  dilemmas:
  - 曾为吴中行、赵用贤抗疏营救而为张居正所忌，后反而与申时行合流，授意排挤诸君子
  - 在三王并封之议中献媚密主其说，又惧忤上意，密揭诿过于许国
  lesson: 依违于宫府之间、巧于自谋者，虽能一时固位，终难逃公论之是非。
  summary_first_person: 我王锡爵，号荆石，世称太仓相。万历年间两度居相位，初以营救言官为张居正所忌，后与申时行同心当国，密主三王并封之议，又于救疏一事诿过于许国，虽神鬼莫知，而密揭终为上出。晚岁被旨复召入阁，为顾宪成诸人所讥切，姜士昌疏劾我褊愎忌刻。身后东林门户之祸，论者每数及于我。
  source_urls:
  - https://zh.wikisource.org/wiki/東林本末
endeavors:
