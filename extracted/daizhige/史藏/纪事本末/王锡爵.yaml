      - 起用
    start_date: '1605'
    highlight_event_id: guji-王锡爵-event-fuzhao
  - key: breakthrough
    name_zh: 中旨复召东仓入阁
    labels:
      zh:
      - 复召
      - 东林讥切
    start_date: '1607'
    highlight_event_id: guji-王锡爵-event-fuzhao
  - key: climax
    name_zh: 遭姜士昌疏劾、顾宪成讥切
    labels:
      zh:
      - 疏劾
    start_date: '1608'
    highlight_event_id: guji-王锡爵-event-fuzhao
  decisions:
  - date: '1607'
    title_zh: 应中旨再居相位
    rationale: 山阴朱赓老懦不为众所服，朝廷谋复召之，然东林诸人以其复用而并及晋江、山阴俱遭摈斥。
