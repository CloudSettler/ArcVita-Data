  decisions:
  - date: '1590'
    title_zh: 密主三王并封之说
    rationale: 献媚于上，欲乱天潢序定之册立，然众口争之，遂被诋为党。
  - date: '1591'
    title_zh: 密揭诿过于许国而不认前疏
    rationale: 惧忤上意，自谓阴阳其事神鬼莫知，而上竟出其密揭以塞廷议。
