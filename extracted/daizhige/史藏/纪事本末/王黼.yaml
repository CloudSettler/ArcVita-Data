events:
- id: guji-王黼-event-birth
  date: '1079'
  year_of: '1079'
  name_zh: 王黼生
  detail: 约生于北宋熙宁末年，生年史无确载。
- id: guji-王黼-event-1
  date: '1118'
  year_of: '1118'
  name_zh: 朝堂议遣使女真，黼预北伐之谋
  detail: 政和八年前后，朝廷议结女真夹攻大辽，李良嗣（赵良嗣）倡其议，郑居中、邓洵武等力争守盟罢兵，北议一度寝。
- id: guji-王黼-event-2
  date: '1120'
  year_of: '1120'
  name_zh: 王黼复倡兼弱攻昧，再动上心
  detail: 契丹既衰，宰相王黼复为兼弱攻昧之言以动徽宗；邓洵武以兵食旁通册、财匮民弊之言谏，议复止。其后洵武殁，黼始遂前议。
- id: guji-王黼-event-3
  date: '1121'
  year_of: '1121'
  name_zh: 宣和初竟出师北伐
  detail: 邓洵武既卒，王黼遂前议，宣和初朝廷竟出师，结金伐辽，取幽蓟，卒致天下之乱。
- id: guji-王黼-event-death
  date: '1126'
  year_of: '1126'
  name_zh: 王黼被贬死
  detail: 靖康初，钦宗治其罪，王黼贬官，死于流放途中。
