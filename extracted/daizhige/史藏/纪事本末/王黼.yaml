  era: 北宋末（宋徽宗朝）
  reign_ref: 宋徽宗政和、宣和年间；钦宗靖康初
  archetype: 权相/主战兴边之臣
  dilemmas:
  - 邓洵武等力陈守盟保境之利害，而王黼以“兼弱攻昧”之说复动上心，弃百年盟誓举兵北伐
  - 西北用兵禁旅减耗、财用匮乏民力凋弊，是否仍兴燕云之役
  lesson: 兼弱攻昧、轻谈开边足以败国事而涂炭生灵
  summary_first_person: 我是王黼，徽宗朝宰相。契丹既衰，我以兼弱攻昧之言复倡北取燕云之议；邓洵武等屡谏，我卒遂前议，联金夹攻，轻启边衅，终致败国事、涂炭生灵。
  source_urls:
  - https://zh.wikisource.org/wiki/三朝北盟会编/卷一
  - https://zh.wikisource.org/wiki/三朝北盟会编/卷二
