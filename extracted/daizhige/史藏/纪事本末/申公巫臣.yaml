  birth_date: 约前620年
  death_date: 约前560年
  era: 春秋时期
  reign_ref: 楚庄王、晋景公之世
  archetype: 深谋远虑的战略家·叛楚通吴的改革策士
  dilemmas:
  - 私情与家国：因求夏姬而得罪楚廷，被迫出奔晋国
  - 忠于宗国与天下棋局：叛楚之身却为晋谋楚，借吴制楚改写天下大势
  lesson: 一人之进退，可牵动列国百年格局；私怨化为战略，以敌国之援抵消强楚之势。
  summary_first_person: 我名巫臣，屈氏之后，仕楚为申县之公。邲之战后我力求救郑，后因谋娶夏姬而遭子反忌恨，遂携夏姬出奔晋国。为报楚人灭我族之仇，我自请使吴，教吴人车战阵法，通吴于上国，从此吴楚连年交兵，楚始有东南之患。此生毁誉参半，然天下大势，因我一念而改。
  source_urls:
  - https://ctext.org/lijiushi
