events:
- id: guji-申公巫臣-event-1
  date: '-598'
  year_of: -598
  title_zh: 谏莊王与子反勿纳夏姬
  label_zh: 巫臣谏夏姬
  person_id: guji-申公巫臣
  summary_zh: 楚莊王破陈，欲纳夏姬，莊王及子反皆惑于其色；巫臣历陈此女之不祥及子反贪色之危，二人皆止，而巫臣阴有自娶之谋。
- id: guji-申公巫臣-event-2
  date: '-590'
  year_of: -590
  title_zh: 出奔晋国，楚灭巫臣之族
  label_zh: 巫臣奔晋
  person_id: guji-申公巫臣
  summary_zh: 巫臣借使齐之机，携夏姬出奔晋国为邢大夫；子反怒，请以重币赂晋而求之，晋人不与；楚遂灭巫臣之族，巫臣='{自是吴楚.Normalize>'
- id: guji-申公巫臣-event-3
  date: '-588'
  year_of: -588
  title_zh: 自晋使吴，教吴车战
  label_zh: 巫臣通吴
  person_id: guji-申公巫臣
  summary_zh: 巫臣自晋请使于吴，与其子狐庸教吴人使用兵乘车，使其祝策，吴始伐楚、伐巢、伐徐，蛮夷属于吴。
- id: guji-申公巫臣-event-4
  date: '-584'
  year_of: -584
  title_zh: 通呉于上国（成公二年条）
  label_zh: 通吴上国
  person_id: guji-申公巫臣
  summary_zh: 《春秋左传事类始末》成公二年之下特书"申公巫臣通呉于上国"，自此东南吴国为晋之援，牵制强楚，天下势变。
