  decisions:
  - date: '-0522'
    title_zh: 与伍子胥约定“子能复之，我必能兴之”
    rationale: 明知其誓将覆楚，仍以致友之诚立报国之志
  - date: '-0506'
    title_zh: 立依庭墙而哭，勺饮不入口七日
    rationale: 拒绝秦馆待之请，以死节之诚感动秦哀公
  - date: '-0505'
    title_zh: 功成不受赏而逃
    rationale: 且我尤子旗，为君也非为身也
events:
- id: guji-shen-baoxu-event-birth
  date: '-0555'
  year_of: -555
  type: birth
  title_zh: 申包胥生于春秋楚地（生年无考，约当春秋末期）
  summary: 生年不见经传，为楚公族大夫
- id: guji-shen-baoxu-event-vow-wu-yuan
  date: '-0522'
  year_of: -522
  type: endeavor
  title_zh: 伍员亡吴前夕与申包胥立誓
  summary: 伍员曰“我必覆楚”，申包胥答“子能复之，我必能兴之”，约为友而志在存楚
- id: guji-shen-baoxu-event-weep-qin
  date: '-0506'
  year_of: -506
  type: endeavor
  title_zh: 秦庭哭师七日
  summary: 吴入郢，昭王在随；申包胥如秦乞师，立依庭墙而哭，日夜不绝声，勺饮不入口七日，秦哀公为之赋《无衣》，九顿首而坐
- id: guji-shen-baoxu-event-save-chu
  date: '-0505'
  year_of: -505
  type: endeavor
  title_zh: 以秦师至，与楚师共破吴
  summary: 秦师五百乘救楚，败吴师于沂、雍澨、公壻之谿，吴子乃归，楚昭王复国入郢
- id: guji-shen-baoxu-event-flee-reward
  date: '-0505'
  year_of: -505
  type: endeavor
  title_zh: 拒王赏而逃
  summary: 昭王赏功及申包胥，包胥曰“吾为君也非为身也，君既定矣又何求”，遂逃赏
- id: guji-shen-baoxu-event-death
  date: '-0505'
  year_of: -505
  type: death
  title_zh: 申包胥卒（卒年无考，约在昭王复国之后）
  summary: 事迹终见楚昭王复国，其后无闻
