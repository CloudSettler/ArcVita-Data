  death_date: '-0505'
  era: 春秋时期（楚昭王时代）
  reign_ref: 楚昭王
  archetype: 忠臣义士
  dilemmas:
  - 伍员亡吴覆楚，与故友之谊和忠于楚国的冲突
  - 秦师既出楚社稷已定，接受封赏还是功成身退
  lesson: 立依庭墙，哭七日不食，忠信可动天地而兴灭国
  summary_first_person: 我是申包胥，与伍员为友。吴师入郢时，我在秦庭痛哭七日不进勺饮，终借秦师复楚；事定之后却不受赏而逃，因我为君非为身。
  source_urls:
