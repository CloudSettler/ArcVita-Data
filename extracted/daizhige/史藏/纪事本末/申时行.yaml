  - date: '1583-01-01'
    title_zh: 挤出邹元标、令人构赵用贤使自相攻
    rationale: 惧建言禁切主上之士，使其党自相攻以衰士气
  - date: '1587-01-01'
    title_zh: 授意丁亥内计疏十九人
    rationale: 希己旨欲悉中素所不平者，赖王国抗之得不废
events:
- id: guji-申时行-event-birth
  date: '1535'
  year_of: 1535
  type: birth
  title_zh: 申时行出生
  description: 明嘉靖年间，申时行（号瑶泉）生。
- id: guji-申时行-event-huparty
  date: '1582'
  year_of: 1582
  type: career
  title_zh: 张居正败后默庇其党
  description: 茂苑申公素为江陵所信爱，其党非众所指名者，辄默为地以免。
- id: guji-申时行-event-yuanbiao
  date: '1583'
  year_of: 1583
  type: career
  title_zh: 挤出邹元标、构赵用贤
  description: 邹元标建禁切之言，上不堪，申因挤出之；又令人构赵用贤等使自相攻。
- id: guji-申时行-event-neiji
  date: '1587'
  year_of: 1587
  type: career
  title_zh: 丁亥内计疏十九人
  description: 主计者希申旨，疏申所怒十九人欲悉中之，御史王国抗言“罪独失申相公意耳”，诸人得不废。
- id: guji-申时行-event-bingfeng
  date: '1591-01-01'
  year_of: 1591
  type: career
  title_zh: 密主三王并封
  description: 朝议册立，天潢序定，而申、王献媚，密主三王并封之说，众口争之，遂诋为党。
- id: guji-申时行-event-mijie
  date: '1593-01-01'
  year_of: 1593
  type: career
  title_zh: 具疏救主事后密揭诿过许国
  description: 工部主事请造太子仪仗逢圣怒欲置法，申、王、许逼于公论具疏救之；申、王惧忤上，密揭诿过于许而不认前疏，上竟出密揭以塞廷议。
- id: guji-申时行-event-retire
  date: '1594'
  year_of: 1594
  type: career
  title_zh: 甲午败谢，致政归乡
  description: 岁甲午，申、王既败，申时行罢位致政。
- id: guji-申时行-event-hanshu
  date: '1606'
  year_of: 1606
  type: career
  title_zh: 贻书沈一贯谋陷沈鲤
  description: 枚卜沈龙江、朱金庭后，申瑶泉贻书蛟门曰“篮面贼来矣，盍备之”，欲与谋陷沈鲤。
- id: guji-申时行-event-death
  date: '1614'
  year_of: 1614
  type: death
  title_zh: 申时行去世
  description: 万历年间，申时行卒。
