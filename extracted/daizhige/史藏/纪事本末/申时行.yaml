  name_zh: 申时行
  names:
    zh: 申时行
    en: Shen Shixing
  lifespan:
    birth:
      date: '1535'
      precision: year
      is_circa: false
      raw: 嘉靖年间生
    death:
      date: '1614'
      precision: year
      is_circa: false
      raw: 万历年间卒
  birth_date: '1535'
  death_date: '1614'
  era: 明代万历时期
  reign_ref: 万历
  archetype: 权相·和事佬宰辅
  dilemmas:
  - 在张居正身后护持其党羽与迎合众议之间周旋
  - 主张三王并封献媚君上，引发朝臣公议之争
  - 具疏救言官后惧忤上意，密揭诿过于同僚许国
  lesson: 调和两端的“巧术”虽可自保，终难逃公论清议之评。
  summary_first_person: 我是申时行，万历年间官至内阁首辅。张居正败后，我以其素所信爱之身暗中庇护其党羽；国本之争中我密主三王并封之说，遭众口诋为结党；救工部主事一事上，我又与王锡爵密揭诿过于许国，自谓阴阳其事、神鬼莫知，不料皇帝竟出密揭以塞廷议。甲午年我罢位致政，身后书本之人将我与王锡爵并列，谓自申瑶泉以后为相者术巧而诡托宫府之内。
  source_urls:
  - 东林本末（明）不着撰人
