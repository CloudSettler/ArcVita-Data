person:
  qid: guji-盛宣怀
  name_zh: 盛宣怀
  names:
    zh: 盛宣怀
    en: Sheng Xuanhuai
  lifespan:
    birth:
      date: 1844-11-04
      precision: day
      is_circa: false
      raw: 道光二十四年九月廿四日（1844年11月4日）
    death:
      date: 1916-04-27
      precision: day
      is_circa: false
      raw: 1916年4月27日
  birth_date: 1844-11-04
  death_date: 1916-04-27
  era: 晚清
  reign_ref: 道光、咸丰、同治、光绪、宣统
  archetype: 洋务官僚实业家与铁路国有政策主事者
  dilemmas:
  - 速成干路以固边防、握中央枢纽，与川粤鄂商办股东既有权利相冲突；文中上谕斥商办收股无成、倒帐坐耗，而川省股东援公司律誓死抗争
  - 借四国巨债以救财政、兴实业、筑铁路，与资政院议决权、民力负担及债权国盘剥之虞相权衡；呈文引埃及波斯覆辙、饮鸩自毙为戒
  lesson: 大政之举，计熟而后动；不经民意机关议决、不恤商民身家而强夺既成权利，虽为救时之策，亦足以自覆其局。
  summary_first_person: 我是盛宣怀，字杏荪，江苏常州人。一生佐李鸿章办轮船、电报、银行、矿路，并创南北洋学堂，自诩为中国实业开山之人。辛亥春我以邮传部大臣当国，主干路收归国有，与英德美法四国银行签订粤汉川汉借款合同，川人保路，风潮激成武昌大变，我因此被革职出走日本。成败功罪，留与后人评说。
endeavors:
- id: guji-盛宣怀-endeavor-1
  name_zh: 创办洋务实业与新式教育
  description: 历办轮船招商局、电报总局、中国通商银行、汉冶萍煤铁厂矿公司，并创办北洋大学堂、南洋公学，为中国近代实业与教育奠基。
  phases:
  - key: brewing
    name_zh: 佐李鸿章筹办轮船招商局
    labels:
      zh:
      - 航运
      - 洋务
    start_date: 1873
    highlight_event_id: guji-盛宣怀-event-zhaoshangju
  - key: breakthrough
    name_zh: 总办天津电报总局，开中国电报之先
    labels:
      zh:
      - 电报
    start_date: 1880
    highlight_event_id: guji-盛宣怀-event-dianbao
  - key: climax
    name_zh: 创办北洋大学堂、南洋公学与中国通商银行
    labels:
      zh:
      - 新式学堂
      - 银行
    start_date: 1895
    highlight_event_id: guji-盛宣怀-event-bank
  - key: closure
    name_zh: 合并汉冶萍，成中国钢铁煤铁联合之业
    labels:
      zh:
      - 矿冶
    start_date: 1908
    highlight_event_id: guji-盛宣怀-event-hanyeping
  decisions:
  - date: 1895
    title_zh: 创办天津北洋西学学堂
    rationale: 感于时局，以为自强以储才为本，立头等学堂，开中国近代大学之先河。
  - date: 1897
    title_zh: 创办中国通商银行于上海
    rationale: 洋务诸业既兴，须有本国银行通融资金，遂奏设中国自办第一家新式银行，通商兴业。
  - date: 1908
    title_zh: 合并汉阳铁厂、大冶铁矿、萍乡煤矿为汉冶萍公司
    rationale: 铁厂无矿则废，矿无厂则滞，合三处为一以自给钢铁，免受制于外人。
- id: guji-盛宣怀-endeavor-2
  name_zh: 铁路干路国有与四国借款（1911）
  description: 辛亥川路风潮之主线，我以邮传部大臣主其事——借款、国有两谕继颁，川人保路，激成大变。
  phases:
  - key: brewing
    name_zh: 与四国银行团磋商借款，颁借债上谕
    labels:
      zh:
      - 外债
      - 币制
    start_date: 1911-05-04
    highlight_event_id: guji-盛宣怀-event-jiekuan
  - key: breakthrough
    name_zh: 奏定干路均归国有之政策
    labels:
      zh:
      - 铁路国有
    start_date: 1911-05-09
    highlight_event_id: guji-盛宣怀-event-guoyou
  - key: climax
    name_zh: 签押借款合同，川湘保路风潮骤起
    labels:
      zh:
      - 保路运动
    start_date: 1911-05-20
    highlight_event_id: guji-盛宣怀-event-qianzi
  - key: closure
    name_zh: 川乱激成武昌起义，被弹劾革职出走
    labels:
      zh:
      - 辛亥革命
    start_date: 1911-10-10
    highlight_event_id: guji-盛宣怀-event-gezhi
  decisions:
  - date: 1911-05-09
    title_zh: 主奏干路收归国有，取消各省商办成案
    rationale: 文载上谕，粤收股及半造路无多、川倒帐甚巨、鄂开局徒资坐耗，遂定干路国有为国策，由国家收回赶筑，支路仍准商办。
  - date: 1911-05-20
    title_zh: 以邮传部大臣奉旨于粤汉川汉借款合同签字
    rationale: 文载四月二十二日上谕署名盛宣怀，著邮传部大臣签字；合同照张文襄草约，借英德美法四国六百万磅，息五厘、四十年期，以度支部两湖财政作保，并无铁路作抵。
  - date: 约1911-06-01
    title_zh: 与督办大臣端方会衔电四川刊刻誊黄晓谕
    rationale: 文载五月十四日护督部堂发阅盛、端两大臣电文，申明国有因民办艰难、借款有保无抵，并议换给国家六厘保息股票、查明股款诸办法，欲安众心免再要挟。
events:
- id: guji-盛宣怀-event-birth
  type: birth
  date: 1844-11-04
  year_of: 1844
  title_zh: 生于江苏常州
  description: 字杏荪，出身常州官宦之家，后入李鸿章幕府起家。
- id: guji-盛宣怀-event-zhaoshangju
  type: career
  date: 1873
  year_of: 1873
  title_zh: 任轮船招商局会办
  description: 招商局于1872年奏设，盛与会办局务，与太古、怡和洋商争衡，开中国自办航运之端。
  endeavor_id: guji-盛宣怀-endeavor-1
- id: guji-盛宣怀-event-dianbao
  type: career
  date: 约1880
  year_of: 1880
  title_zh: 总办天津电报总局
  description: 建津沪电线，开中国电报通信之先，此后渐成全国电报网。
  endeavor_id: guji-盛宣怀-endeavor-1
- id: guji-盛宣怀-event-beiyang
  type: career
  date: 1895-10-02
  year_of: 1895
  title_zh: 创办天津北洋西学学堂
  description: 即北洋大学堂，为中国近代第一所大学，后为天津大学前身。
  endeavor_id: guji-盛宣怀-endeavor-1
- id: guji-盛宣怀-event-nanyang
  type: career
  date: 约1896
  year_of: 1896
  title_zh: 筹设上海南洋公学
  description: 南洋公学为交通大学前身，与北洋大学堂并为盛氏兴学两柱。
  endeavor_id: guji-盛宣怀-endeavor-1
- id: guji-盛宣怀-event-bank
  type: career
  date: 1897-05-27
  year_of: 1897
  title_zh: 创办中国通商银行
  description: 于上海开业，为中国自办第一家新式银行，盛任督办。
  endeavor_id: guji-盛宣怀-endeavor-1
- id: guji-盛宣怀-event-hanyeping
  type: career
  date: 1908
  year_of: 1908
  title_zh: 合并成立汉冶萍煤铁厂矿公司
  description: 并汉阳铁厂、大冶铁矿、萍乡煤矿为一，开中国钢铁联合企业之始。
  endeavor_id: guji-盛宣怀-endeavor-1
- id: guji-盛宣怀-event-jiekuan
  type: career
  date: 1911-05-04
  year_of: 1911
  title_zh: 宣统三年四月初六上谕特借四国银行款
  description: 文载谕旨，向英美德法四国银行借一千万磅、横滨银行借一千万元，专备考定币制、振兴实业、推广铁路之用，不得移作别用；盛宣怀时任邮传大臣与闻其事。
  endeavor_id: guji-盛宣怀-endeavor-2
- id: guji-盛宣怀-event-guoyou
  type: career
  date: 1911-05-09
  year_of: 1911
  title_zh: 四月十一日上谕定干路均归国有
  description: 文载上谕斥商办数年粤收股及半、川倒帐甚巨、鄂徒资坐耗，明定干路国有为国策，宣统三年以前各省商办干路一律由国家收回赶筑。
  endeavor_id: guji-盛宣怀-endeavor-2
- id: guji-盛宣怀-event-qianzi
  type: career
  date: 1911-05-20
  year_of: 1911
  title_zh: 奉旨于粤汉川汉铁路借款合同签字
  description: 文载四月二十二日上谕署名盛宣怀，著邮传部大臣签字；合同借英德美法四国六百万磅，息五厘、四十年期，以两湖财政作保，此议一出川湘鄂保路风潮骤起。
  endeavor_id: guji-盛宣怀-endeavor-2
- id: guji-盛宣怀-event-dianwen
  type: career
  date: 约1911-06-01
  year_of: 1911
  title_zh: 与端方会衔电四川解释国有与借款办法
  description: 文载五月十四日护督部堂发阅盛、端两大臣电文，申明川路国有因民办艰难，借款照张文襄草合同并无铁路作抵，并议换给国家六厘保息股票、查明股款等办法，令刊誊黄安众心。
  endeavor_id: guji-盛宣怀-endeavor-2
- id: guji-盛宣怀-event-gezhi
  type: career
  date: 1911-10-25
  year_of: 1911
  title_zh: 保路风潮激变，被革职永不叙用
  description: 武昌起义后资政院弹劾盛宣怀路事借款违法，清廷革其职，永不叙用，盛出走日本；文中川路公司、各法团纷纷呈请电奏抗争，即其发端。
  endeavor_id: guji-盛宣怀-endeavor-2
- id: guji-盛宣怀-event-death
  type: death
  date: 1916-04-27
  year_of: 1916
  title_zh: 病逝于上海
  description: 身后以实业、教育之功与路事之罪并传于世。
