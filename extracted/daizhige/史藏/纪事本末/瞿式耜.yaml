      - 定策之功
    start_date: 1646-10
    highlight_event_id: guji-瞿式耜-event-2
  decisions:
  - date: 1646-10
    title_zh: 与丁魁楚会议拥立永明王监国
    rationale: 唐王死于汀州，明统不可绝，与丁魁楚会议定策。
- id: guji-瞿式耜-endeavor-2
  name_zh: 入阁辅政、留守桂林
  summary: 丁亥拜东阁大学士，三月进文渊阁大学士兼吏、兵两部尚书，留守桂林，为楚党所外结，支撑粤西危局。
  labels:
    zh:
    - 辅政
    - 守土
