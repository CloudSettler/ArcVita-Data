  reign_ref: 永历帝（明永明王朱由榔）
  archetype: empress_dowager_regent_style_loyalist
  dilemmas:
  - - 拥立藩王监国以续明统
    - 诸藩相继败亡，独撑危局近乎无望
  - - 留守桂林死守
    - 永历朝廷漂泊无定，孤立无援
  lesson: 危亡之际，守土死节之臣以孤忠自任，成败固不可期，忠义不可夺。
  summary_first_person: 我瞿式耜于南都既失之后，与丁魁楚会议，拥立永明王监国肇庆；其后拜东阁大学士，进文渊阁大学士兼吏、兵两部尚书，受命留守桂林，力撑残局，终以殉粤见称于史。
  source_urls:
  - https://zh.wikisource.org/wiki/三藩紀事本末
endeavors:
- id: guji-瞿式耜-endeavor-1
  name_zh: 拥立永历、定策肇庆
  summary: 丙戌唐王死后，与两广总督丁魁楚会议监国，十月十四日奉永明王称监国，十一月改元永历。
  labels:
    zh:
    - 定策
    - 拥立
  phases:
