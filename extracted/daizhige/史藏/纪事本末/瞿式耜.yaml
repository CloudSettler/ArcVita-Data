  decisions:
  - date: 1647-03
    title_zh: 受命留守桂林
    rationale: 行在漂泊肇庆、梧州之间，桂林为粤西门户，非重臣不能守。
  - date: 1647
    title_zh: 外结楚党，以固朝局
    rationale: 与袁彭年等楚党声气相接，抗衡吴党及马吉翔、陈邦傅之势。
