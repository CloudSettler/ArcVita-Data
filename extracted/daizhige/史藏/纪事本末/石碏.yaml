person:
  qid: guji-石碏
  name_zh: 石碏
  names:
    zh: 石碏
    en: Shi Que
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生卒不详（春秋初期卫国大夫）
    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详，桓公被弑后（前719年）时犹在，自言“老夫耄矣”
  era: 春秋（卫国）
  reign_ref: 卫庄公、卫桓公、卫宣公时期
  archetype: 大义灭亲的诤臣
  dilemmas:
  - 谏庄公勿宠州吁而不听，预见祸乱
  - 亲子石厚助州吁弑君，告陈执之，忍痛使宰杀之
  lesson: 石碏农民断亲：为国除贼，虽子不赦，“大义灭亲”由此得名
  summary_first_person: 我是卫国大夫石碏。庄公宠爱庶子州吁而纵其好兵，我以“六逆六顺”切谏而不听；我的儿子石厚又与州吁交游，我禁之不得。州吁果然弑桓公自立而不得民心。石厚来问我安君之策，我指使他随州吁朝陈，同时密告陈国执此弑君二人。陈人执之，卫人杀州吁于濮，我使家宰獳羊肩赴陈杀了我的儿子石厚。君子称我“大义灭亲”，纯臣之谓也。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
