events:
- id: guji-石碏-event-remonstrate
  date: -735
  year_of: 前735年（隐公三年前后）
  person_id: guji-石碏
  person_name: 石碏
  title_zh: 石碏谏卫庄公勿纵州吁
  description_zh: 庄公嬖人之子州吁有宠而好兵，公弗禁。石碏谏曰“爱子教之以义方”，陈六逆六顺之义，谓去顺效逆所以速祸。庄公弗听。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
- id: guji-石碏-event-retire
  date: -734
  year_of: 前734年前后（桓公立）
  person_id: guji-石碏
  person_name: 石碏
  title_zh: 桓公立，石碏告老
  description_zh: 州吁之祸已萌，其子厚与州吁游，禁之不可。桓公立，石碏乃老。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
- id: guji-石碏-event-usurp
  date: -719-03
  year_of: 前719年（隐公四年春）
  person_id: guji-石碏
  person_name: 石碏
  title_zh: 州吁弑卫桓公而立
  description_zh: 隐公四年春，州吁弑桓公而立，未能和其民。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
- id: guji-石碏-event-lure
  date: -719-09
  year_of: 前719年秋
  person_id: guji-石碏
  person_name: 石碏
  title_zh: 石碏使告于陈，执州吁石厚
  description_zh: 石厚问定君之策，石碏告以“王觐为可”，使厚从州吁如陈。石碏密使告陈曰：“此二人者实弑寡君，敢即图之。”陈人执之。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
- id: guji-石碏-event-execute
  date: -719-09
  year_of: 前719年九月
  person_id: guji-石碏
  person_name: 石碏
  title_zh: 杀州吁于濮，石碏使宰杀石厚
  description_zh: 卫人使右宰丑涖杀州吁于濮；石碏使其宰獳羊肩涖杀石厚于陈。君子曰：石碏纯臣也，大义灭亲其是之谓乎。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
- id: guji-石碏-event-establish
  date: -718-12
  year_of: 前719年冬十二月（宣公即位）
  person_id: guji-石碏
  person_name: 石碏
  title_zh: 卫人迎立公子晋为宣公
  description_zh: 平乱之后，卫人逆公子晋于邢，冬十二月宣公即位。《书》曰“卫人立晋”，众也。
  source_urls:
  - https://zh.wikisource.org/wiki/左傳紀事本末/卷三十七
