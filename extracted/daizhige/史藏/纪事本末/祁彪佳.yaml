  archetype: 殉国守节之儒臣
  dilemmas:
  - 出仕新朝以保家活人，还是殉节守名以全臣子大义
  - 死之迟速——卻聘委曲与从容就义之间的自省
  lesson: 生死旦暮之间，守住名节方不辱祖宗，从容赴死亦是浩然留天地。
  summary_first_person: 我是山阴人祁彪佳，字幼父，号世培，曾任苏松巡抚，明亡后养病里居。清兵南下，以书来聘，我处置家政，作绝命词别宗亲，自言臣子大义惟有一死，不贪旦暮之生而致名节扫地，遂肃衣冠投于寓园放生池柳树之阴，颜色如生。
  source_urls:
  - 浙东纪略·徐芳烈
