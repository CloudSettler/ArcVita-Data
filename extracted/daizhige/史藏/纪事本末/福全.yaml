events:
- id: guji-福全-event-birth
  date: '1653'
  year_of: '1653'
  type: birth
  title_zh: 福全出生
  description: 顺治帝第二子，后封和硕裕亲王。
- id: guji-福全-event-1
  date: 1688-08
  year_of: '1688'
  type: endeavor_start
  title_zh: 上谕裕亲王福全等预为备御噶尔丹
  description: 厄鲁特噶尔丹兵至枯伦贝尔地方，去喀伦仅七八日程，康熙谕裕亲王福全令科尔沁土谢图亲王沙津等派十旗兵一万、盛京兵一千，各赍两月粮至喀尔喀河备御。
- id: guji-福全-event-2
  date: 1688-08
  year_of: '1688'
  type: endeavor_event
  title_zh: 部署各旗王台吉率兵与福全会防
  description: 命尚书吉尔他布、都统巴海等会同科尔沁各王台吉奔赴所指之地备御，与福全之防务部署相配合。
- id: guji-福全-event-death
  date: '1703'
  year_of: '1703'
  type: death
  title_zh: 福全去世
  description: 康熙四十二年薨，谥曰宪。
