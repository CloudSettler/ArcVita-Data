person:
  qid: guji-福全
  name_zh: 福全
  names:
    zh: 福全
    en: Fuquan, Prince Yu
  lifespan:
    birth:
      date: '1653'
      precision: year
      is_circa: true
      raw: 生年史载顺治十年
  birth_date: '1653'
  era: 清康熙朝
  reign_ref: 康熙
  archetype: 宗室统帅
  dilemmas:
  - 身为裕亲王受命备御噶尔丹，须在边境防务与部属粮饷之间权衡
  - 面对蒙古各旗调兵，需协调科尔沁、盛京等各方兵马协同防守
  lesson: 宗室重臣临边受任，镇定布置，可为朝廷边防之藩屏。
  summary_first_person: 康熙二十七年，噶尔丹攻掠喀尔喀，逼近我边喀伦。皇兄裕亲王福全奉谕，会同诸王大臣调科尔沁十旗兵一万及盛京兵一千，赍两月粮至喀尔喀河一带预为备御，参与部署防范厄鲁特之边防事务。
  source_urls:
  - https://zh.wikisource.org/wiki/聖祖仁皇帝親征平定朔漠方略
