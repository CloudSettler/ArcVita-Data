    title_zh: 依附达兰而居
    rationale: 金人徙众官于韩州，独秦桧不与徙，因依达兰以居，达兰厚待之。
events:
- id: guji-秦桧-event-defense-debate
  title_zh: 议三镇存弃时主守议
  date: 1126-11
  year_of: 1126
  description: 金人分道南侵，朝廷集议三镇存弃，何㮚、梅执礼、吕好问、洪刍、秦桧等皆主守议，而唐恪、耿南仲等力主割地。
  participants:
  - 秦桧
  - 何㮚
  - 梅执礼
  - 吕好问
