person:
  qid: guji-秦桧
  name_zh: 秦桧
  names:
    zh: 秦桧
    en: Qin Hui
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: ''
    death:
      precision: unknown
      is_circa: false
      raw: ''
  era: 北宋末—南宋初（靖康年间）
  reign_ref: 宋钦宗靖康元年至靖康二年（1126—1127）
  archetype: 争议政士
  dilemmas:
  - 主战与主和之争中的立场抉择
  - 靖康之难中忠于宋室还是屈从金人的生死抉择
  lesson: 靖康之变中秦桧曾主守议、抗金人立异姓之议而被执北去，其后遭遇则预示其日后的政治转向，皆见乱世之中人心之变。
  summary_first_person: 我秦桧在靖康年间反对割让三镇，主张守议；京城陷落后，金人废二帝立张邦昌，我与御史马伸、吴给共上议状，愿复嗣君以安四方，并论邦昌蠹国乱政之罪，金人恼怒将我执去。北行时二帝被掳，众随行官员皆徙韩州，独我不与徙，依附达兰（挞懒）而居，达兰亦厚待我。
