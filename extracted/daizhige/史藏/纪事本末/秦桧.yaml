  - guji-秦桧-endeavor-2
- id: guji-秦桧-event-stay-with-talan
  title_zh: 不与徙韩州依达兰而居
  date: 1127-05
  year_of: 1127
  description: 金主封二帝为昏德公、重昏侯，徙之韩州，尽空其城，命晋康郡王等九百余人同处；惟秦桧不与徙，依达兰以居，达兰亦厚待之。
  participants:
  - 秦桧
  - 达兰
  related_person_ids:
  - guji-秦桧
  endeavor_refs:
