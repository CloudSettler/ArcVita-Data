- id: guji-秦桧-event-memorial
  title_zh: 上议状愿复嗣君论张邦昌之罪
  date: 1127-02
  year_of: 1127
  description: 金人令推立异姓，王时雍集百官议立张邦昌，御史马伸与吴给约中丞秦桧共为议状，愿复嗣君以安四方，且论邦昌当上皇时蠹国乱政以致社稷倾危，金人怒执桧去。
  participants:
  - 秦桧
  - 马伸
  - 吴给
  - 王时雍
  - 张邦昌
  related_person_ids:
  - guji-秦桧
  endeavor_refs:
  - guji-秦桧-endeavor-1
- id: guji-秦桧-event-abducted
  title_zh: 随二帝北去
  date: 1127-04
  year_of: 1127
  description: 靖康二年夏四月，金人以二帝及后妃太子宗戚三千人北去，尼玛哈以帝后太子妃嫔宗室及何㮚、孙傅、张叔夜、陈过庭、司马朴、秦桧等由郑州去。
  participants:
  - 秦桧
  - 宋钦宗
  - 何㮚
  - 孙傅
  - 张叔夜
  related_person_ids:
  - guji-秦桧
  endeavor_refs:
