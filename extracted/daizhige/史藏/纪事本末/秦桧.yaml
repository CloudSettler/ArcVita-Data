    title_zh: 主三镇不当割
    rationale: 金人无信，割亦来，不割亦来，故主守议。
  - date: 1127-02
    title_zh: 与马伸、吴给共为议状愿复嗣君
    rationale: 身为诤臣不容坐视，愿复赵氏嗣君以安四方，并论张邦昌蠹国乱政当诛。
