person:
  qid: guji-cheng-wan
  name_zh: 程畹
  names:
    zh: 程畹
    en: Cheng Wan
  lifespan:
    birth:
      date: 1830
      precision: year
      is_circa: true
      raw: 自言生十二年而值夷乱，壬寅（1842）英船入圌山关时年约十二，逆推约生于道光十年前后
  birth_date: 约1830年
  era: 清道光至咸丰年间
  reign_ref: 道光、咸丰（亲历战乱），《避寇纪略》有光绪十二年刻本传世
  archetype: 乱世蒙馆塾师·纪难文人
  dilemmas:
  - 死义与逃生：城破之日缳已结，自分引决，终念堂上五六十老人、长成未嫁之姊妹而奉亲出走，自叹死无名不如生全孝
  - 养亲与谋生：佣书授馆为口食计，母姊染危疾不能亲视汤药，数日一归，归无半日留，私心悼恨
  - 存真与见忌：直书乱民冒贼焚掠、大营坐视不救之实，有句云贼已去时民尽盗，城方复后我无家
  lesson: 国难之际，士节不独在赴死，更在扶老携幼的担当、对素昧平生善士的感念，与乱定后秉笔存史的执守。
  summary_first_person: 吾程畹，江苏仪征蒙馆塾师也。生值道光季年，十二岁英夷犯圌山关，随父夜走妙山；咸丰三年癸丑粤匪陷仪征，余设帐厉惕斋家，自分引决，缳已结而卒奉亲出走，家口出北门而贼自南门入，间不容发，新婚不四夕即别；是冬贼退，家毁于乱民，有句云贼已去时民尽盗，城方复后我无家。丙辰再陷，扶母姑避走天长界；戊午江北大营溃，复携家奔公道桥三檀庄，目击六合陷没、生机尽绝。乱后佣书课徒，笔录三经离乱始末为《避寇纪略》，志生民之劫，亦彰陈起财、王媪、王乙诸善士之义。
