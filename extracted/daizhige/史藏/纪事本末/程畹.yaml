    title_zh: 城陷前弃馆随眷出走
    rationale: 自度止则均死，走或可全，遂从舅氏绍先出北门，家口甫出而贼已入南门
  - date: 1856-04
    title_zh: 扶母姑再徙天长界
    rationale: 贼氛逼近，雇车辇母姑，与陈起财谋北徙，赖素识之王姓翁媪收留五十余日
  - date: 1857-12
    title_zh: 岁试毕回仪奉亲
    rationale: 瓜镇收复，人怀归志，遂辞东台之馆，过召伯湖九十里抵寓，以定省为重
  - date: 1858-09
    title_zh: 判贼势东走公道桥
    rationale: 度贼自六合来、入山既深且众，惟东走公道桥、急则过湖遁下河可万一免，功乔丈大然之
