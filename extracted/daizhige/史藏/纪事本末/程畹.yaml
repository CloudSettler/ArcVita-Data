    rationale: 乱民冒贼焚掠，数百年祖宗贻留之物靡不灰烬，录贼已去时民尽盗之句，可与《咸同广陵吏稿》互证
  - date: 1858-10
    title_zh: 详记流民善士言行
    rationale: 王媪延留、王乙让屋、陈起财弗染指一丝一粟，志人心之善以补正史所遗
events:
- id: guji-cheng-wan-event-birth
  type: birth
  date: 1830
  precision: year
  is_circa: true
  year_of: 1830
  title_zh: 程畹生于江苏仪征
  description: 自言生十二年而值夷乱，逆推约生于道光十年前后；家世业儒，后为蒙馆塾师
- id: guji-cheng-wan-event-1842-flight
  type: war-flight
  date: 1842-07
  precision: month
  is_circa: true
  raw: 壬寅六月十二日警甚，家君携予夜走妙山
  year_of: 1842
  title_zh: 英船入圌山关，随父夜走妙山
  description: 年约十二，与黄丈、李丈养初彻夜微行，转徙赵氏庄、王氏庄；村居两旬和约成，夷船退而反故宅，邻里交庆，岂知为乱之初生
- id: guji-cheng-wan-event-1853-teaching
  type: career
  date: 1853-02
  precision: month
  is_circa: true
  raw: 癸丑正月陆建瀛弃军，仪人闻变，予馆厉惕斋丈家
  year_of: 1853
  title_zh: 设馆厉惕斋家，寇至罢馆
  description: 金陵陷后学生出走，束手归来，生计茫然；富室争徙，予即为死计，纵酒读书，慷慨引义
- id: guji-cheng-wan-event-1853-city-fall
  type: war-flight
  date: 1853-03
  precision: month
  is_circa: true
  raw: 癸丑二月二十日贼入仪征，家口自北门出，寇已自南门入
  year_of: 1853
  title_zh: 太平军首陷仪征，绝缳出走
  description: 缳已结矣，刘月樵舅氏代贳屋，绍先外兄拉同走，间不容发；避孔家营草屋，衣物一无所携恐诲盗也
- id: guji-cheng-wan-event-1853-marriage
  type: marriage
  date: 1853-08
  precision: month
  is_circa: true
  raw: 癸丑七月二十六日行合卺礼
  year_of: 1853
  title_zh: 与徐氏合卺，新婚不四夕而避警
  description: 闻警连日，初四日移眷张庄而予回馆；九月天寒野旷，家人回城，予作客稍惯
- id: guji-cheng-wan-event-1853-home-destroyed
  type: calamity
  date: 1853-12
  precision: month
  is_circa: true
  raw: 癸好三年十一月贼既退，乱民冒贼者焚掠尤甚，予家毁
  year_of: 1853
  title_zh: 贼退家毁，赋民尽盗之句
  description: 数百年祖宗贻留之物及一花一本一书一画靡不灰烬，惟大门灶未动；有句云贼已去时民尽盗，城方复后我无家
- id: guji-cheng-wan-event-1855-family-illness
  type: illness
  date: 1855-02
  precision: month
  is_circa: true
  raw: 乙卯正月母与姊俱染危疾，姊已先没
  year_of: 1855
  title_zh: 母姊染危疾，姊先没
  description: 闻信奔回不及最后一面；以佣书为口食计不能亲视汤药，数日一归，归无半日留，私心悼恨；九月予又大病
- id: guji-cheng-wan-event-1856-second-fall
  type: war-flight
  date: 1856-03
  precision: month
  is_circa: true
  raw: 丙辰年（太平天国六年）春，二十四日贼犯仪征，防守之营亦溃
  year_of: 1856
  title_zh: 太平军再犯仪征，扶母姑避走天长界
  description: 贼掠于野，邑人咸被巨创；敦迫母姑扶持而行，雇车历费姓庄、霍姓庄，人畜如蚁几死践踏，抵天长界王姓庄，赖王媪延留五十余日
- id: guji-cheng-wan-event-1857-exam
  type: career
  date: 1857-07
  precision: month
  is_circa: true
  raw: 丁巳六月岁试，学使李小湖廷尉首拔食饩
  year_of: 1857
  title_zh: 岁试受知于李小湖，首拔食饩
  description: 是年正月大病几殆，二月赴东台进馆，凶岁之余饿莩载道；考毕仍赴馆，十一月瓜镇收复始回仪奉亲
- id: guji-cheng-wan-event-1858-flee
  type: war-flight
  date: 1858-10
  precision: month
  is_circa: true
  raw: 戊午八月二十六日贼犯境，黎明登车行九十里至公道桥三檀庄
  year_of: 1858
  title_zh: 江北大营溃，携家奔公道桥三檀庄
  description: 德兴阿营败走，贼连陷江浦浦口围六合，数十万人百道俱进；夜半束装焚香告祖宗，父子泣别存宗祀；六合旋陷，仪扬虽肃清而生机尽矣
- id: guji-cheng-wan-event-1886-edition
  type: literary
  date: 1886
  precision: year
  is_circa: false
  raw: 据清光绪十二年刻本辑
  year_of: 1886
  title_zh: 《避寇纪略》光绪十二年刻本传世
  description: 记太平天国癸好三年、丙辰六年克仪征及戊午八年攻破江北大营时逃避事，所记贼退后乱民焚掠一节可备稽考，与《咸同广陵吏稿》互证
