  decisions:
  - date: '1117-07-04'
    title_zh: 与蔡京同奏请以市马为名遣人浮海探问女真
    rationale: 高药师等漂至登州具言女真侵辽之实，可借访虚实通好女真
  - date: '1118-04-27'
    title_zh: 与王师中选马政、呼延庆使女真军前议事
    rationale: 通好女真、讲买马旧好，议夹攻灭辽相应举兵
  - date: '1118'
    title_zh: 说邓洵武勿阻北伐之议
    rationale: 知蔡京与己图燕之意，劝枢密"商量得十来年里不要相拗官家"，恐为他人所夺
