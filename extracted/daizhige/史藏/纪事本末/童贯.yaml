  reign_ref: 宋徽宗赵佶（政和、宣和）
  archetype: 权宦枢臣
  dilemmas:
  - 守宋辽百年盟誓还是联金夹攻取燕云
  - 奉密旨觇辽，却在边事与外交往来中渐开兵衅
  lesson: 轻弃百年盟约、侥幸开边，虽位极枢密，终致祸变涂炭生灵
  summary_first_person: 我以太师领枢密院，总西北边事；政和元年副郑允中使辽，奉密旨觇其国。马植来归、登州奏报女真之势，我皆与蔡京力主之，遣使浮海通女真，议夹攻灭辽，遂开宋金海上之盟，天下祸变自是而始。
  source_urls:
  - https://zh.wikisource.org/wiki/三朝北盟会编/卷一
