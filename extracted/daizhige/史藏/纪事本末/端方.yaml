  - date: '1911-06-01'
    title_zh: 与盛宣怀联署歌电，宣示川路股票换领国家六厘保息股票并催查股款
    rationale: 收路朝命已定，先行明宣借款用途与换股体恤各节，欲安川省股东之心，免误股为捐、激成暴动
  - date: 1911-08
    title_zh: 与瑞澄往返电商后联名电奏，请留李稷勋仍驻宜昌暂管路事
    rationale: 宜昌夫役数万人，恐未接收以前谣诼纷纭、停工生事，留员经理以保路工而靖地方
  - date: 1911-08
    title_zh: 奉旨就近会商赵尔丰，查明川路收款并严行弹压
    rationale: 川人罢市抗路、舆情汹汹，叠次谕旨责成实力奉行，不得不妥筹办理、弹压事端
