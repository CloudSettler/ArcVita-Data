person:
  qid: guji-duanfang
  name_zh: 端方
  names:
    zh: 端方
    en: Duanfang
  lifespan:
    birth:
      date: '1861'
      precision: year
      is_circa: false
      raw: 咸丰十一年（1861年）
    death:
      date: '1911-11-27'
      precision: day
      is_circa: false
      raw: 宣统三年（1911年11月27日），被杀于四川资州
  birth_date: '1861'
  death_date: '1911-11-27'
  era: 晚清
  reign_ref: 光绪、宣统
  archetype: 晚清新政干臣与铁路国有督办
  dilemmas:
  - 铁路国有朝命已定，而川中股东军民众情激愤，强推则激变、缓行则抗旨，镇抚两难
  - 歌电换股保息意在体恤安民，而部电专断、朝旨迫切前后不符，释疑与失信并存
  - 奉旨严行弹压保路风潮，而武昌事起、所率鄂军军心已附革命，执法与自危成死局
  lesson: 大政推行必先宣明政策、顺应舆情；恃朝命强收民产而失公信，虽有才具亦不免身死政败
  summary_first_person: 我是端方，字午桥，满洲正白旗人。历官湖北、湖南巡抚，两江、直隶总督，曾奉派出洋考察各国政治， 归国力主预备立宪，并兴办学堂、图书馆。宣统三年四月二十日，我奉上谕充督办粤汉、川汉铁路大臣，
    与盛宣怀联署歌电宣示川路股票换领国家六厘保息股票、查明已收未收股款等接收办法，又与鄂督瑞澄 电奏留李稷勋仍驻宜昌经理路工，并奉旨就近会商四川总督赵尔丰，查明收款、严行弹压。川人罢市抗争、 风潮愈烈，武昌事起后我率鄂军入川，是年冬行抵资州，为哗变新军所杀。
endeavors:
