    rationale: 日俄战后朝野思变，奉旨考察东西各国宪政得失，为清廷预备立宪之张本
  - date: 1906-08
    title_zh: 归国联衔奏请仿行宪政、先立预备之基
    rationale: 考察所见各国强弱系于宪政，非立宪无以固国本、收人心
events:
- id: guji-duanfang-event-birth
  date: '1861'
  year_of: 1861
  type: birth
  title_zh: 端方生
  description: 托忒克氏，字午桥，号匋斋，满洲正白旗人，生于咸丰十一年
- id: guji-duanfang-event-mission
  date: 1905-12
  year_of: 1905
  type: endeavor
  title_zh: 以出洋考察政治大臣赴东西洋考察宪政
  description: 光绪三十一年冬，与载泽、戴鸿慈等奉派出洋，分途考察各国政治，为清末预备立宪之先声
- id: guji-duanfang-event-xianzheng
  date: 1906-08
  year_of: 1906
  type: endeavor
  title_zh: 考察归国，奏请预备立宪
  description: 与戴鸿慈归国后条陈考察所得，力主仿行宪政，促成清廷宣示预备立宪
- id: guji-duanfang-event-library
  date: '1907'
  year_of: 1907
  type: endeavor
  title_zh: 总督任上兴学藏书，奏设江南图书馆
  description: 督两江期间锐意新政，兴办学堂、广收流散古籍，奏设江南图书馆，为近代公共图书馆之先导
- id: guji-duanfang-event-appointment
  date: '1911-05-18'
  year_of: 1911
  type: endeavor
  title_zh: 奉上谕充督办粤汉、川汉铁路大臣
  description: 宣统三年四月二十日，清廷以各省商办干路收归国有定为政策，派端方充督办粤汉川汉铁路大臣，负责接收湘鄂川路事，川省股东闻命惶激
- id: guji-duanfang-event-ge-dian
  date: '1911-06-01'
  year_of: 1911
  type: endeavor
  title_zh: 与盛宣怀联署歌电宣示川路接收办法
  description: 五月初五盛端歌电由川督转发：川路公司股票不分民股商股官股准换国家铁路股票、六厘保息，历年虚糜之款除倒帐外不折扣股本；宜昌至夔州六百里难工准用美国总工程师；并催川督查明已收未收股款迅速电复
- id: guji-duanfang-event-li-jixun
  date: 1911-08
  year_of: 1911
  type: endeavor
  title_zh: 与瑞澄联名电奏请留李稷勋暂驻宜昌经理路工
  description: 因宜昌夫役数万人恐未接收以前谣诼生事，端方与鄂督瑞澄及邮传部往返电商后电奏，请仍留李稷勋暂行经理，工项就川款开支，川人指为专擅害公，群情益愤
  is_circa: true
- id: guji-duanfang-event-suppress
  date: 1911-08
  year_of: 1911
  type: endeavor
  title_zh: 奉旨会同赵尔丰妥筹办理并严行弹压
  description: 上谕责成四川总督赵尔丰会同端方将川路所有收款分别查明细数、实力奉行，并饬端方就近会商赵尔丰懔遵叠次谕旨妥筹办理、严行弹压，毋任滋生事端
  is_circa: true
- id: guji-duanfang-event-death
  date: '1911-11-27'
  year_of: 1911
  type: death
  title_zh: 率鄂军入川，行至资州为哗变新军所杀
  description: 武昌起义后端方率湖北新军入川查办路事，军心已附革命，宣统三年冬行抵资州，为哗变官兵所杀，并及其弟端锦
