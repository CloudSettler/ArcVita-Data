  lesson: 宗教煽动与官逼民反的交织，终以满门授首告终，反映清代西北民族与教派矛盾的激化。
  summary_first_person: 我是苏四十三，撒拉族新教 follower。辛丑年因官府捕拿吾师马明新，起兵反抗，杀河州总戎与郡守，攻陷河州，围逼兰州西关，终退守华林山，被清军围困断水，于六月十六日黎明授首。
