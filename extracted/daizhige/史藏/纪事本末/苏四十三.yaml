events:
- id: guji-苏四十三-event-birth
  date: ''
  year_of: 0
  title: 出生
  description: 生年不详，撒拉族新教 follower。
- id: guji-苏四十三-event-kill-officials
  date: 1781-03-19
  year_of: 1781
  title: 佯降夜袭，杀总戎与杨守
  description: 辛丑三月十九日，苏四十三佯服罪，伺夜半持矛杀河州总戎；又赶至旗台堡害郡守杨守。
- id: guji-苏四十三-event-capture-hezhou
  date: 1781-03-21
  year_of: 1781
  title: 攻陷河州
  description: 三月二十一夜半，贼势大张，趁城无兵卫攻陷河州，州牧周拔剑自刎。
- id: guji-苏四十三-event-siege-lanzhou
  date: 1781-03-25
  year_of: 1781
  title: 逼兰州西关
  description: 三月二十五日申刻，逼兰城西关，沿途纵火，围攻西关、西南二关，久攻不下，日退入华林山。
- id: guji-苏四十三-event-retreat-hualin
  date: 1781-03-27
  year_of: 1781
  title: 华林山决战
  description: 三月二十七日未刻招集余党直逼西城，要求见马明新；后夜袭不得，退入华林山，大将军阿建营龙尾山对峙，断水围困。
- id: guji-苏四十三-event-death
  date: 1781-06-16
  year_of: 1781
  title: 华林山授首
  description: 六月十六日黎明，大将军阿出奇兵引贼战，苏四十三授首，十七日韩一的把拉亦死，函首遍示直省。
