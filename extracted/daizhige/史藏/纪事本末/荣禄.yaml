person:
  qid: guji-荣禄
  name_zh: 荣禄
  names:
    zh: 荣禄
    en: Ronglu
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  birth_date: ''
  death_date: ''
  era: 清末光绪年间
  reign_ref: 光绪
  archetype: 权臣与军事统帅
  dilemmas:
  - 主剿义和团而枢臣刚毅、启秀、赵舒翘力主解散，屡上章请剿却被旨责以不得孟浪从事
  - 宣战后奉命与立山、许景澄、联元赴使馆宣谕，夹在朝廷战和两难之间
  - 西巡时留武卫中军驻守京城，自言虎狼之士不能制
  lesson: 乱世中枢臣纵有先见之明，若不能左右朝议，亦难挽狂澜。
  summary_first_person: 我荣禄在庚子事变中屡次上章请剿义和团而不获采纳，宣战后参与对使馆宣谕，随扈西巡，目睹朝议误国、拳匪殃民而无可奈何。
  source_urls:
  - https://example.org/guji/quanbian-jilve
