person:
  qid: guji-董士选
  name_zh: 董士选
  names:
    zh: 董士选
    en: Dong Shixuan
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      precision: unknown
      is_circa: true
  era: 元世祖至元、成宗元贞年间
  reign_ref: 元世祖至元、元成宗元贞
  archetype: 儒雅干练、功成不伐的行省主政官
  dilemmas:
  - 贼势盛而诸将观望不进，身为一介文臣是否亲身赴险督讨
  - 平贼之功与肃贪之责孰先孰后，如何处置贪官污吏
  lesson: 临危挺身以定乱，功成不居以养德。
  summary_first_person: 我是董士选。赣州刘六十聚众万余、建立名号时，诸将观望不进，我以江南行省左丞之身亲自请往，驻兵兴国、依法处置激乱之人与奸民，不数日擒获贼首、余党尽散。事后我只奏请黜退数名赃吏，绝口不提破贼之事，时人称我不伐。
endeavors:
- id: guji-董士选-endeavor-1
  name_zh: 平定赣州刘六十之乱
  phases:
  - key: brewing
    name_zh: 受命请行
