    name_zh: 擒贼散党
    labels:
      zh: 贼首就擒
    start_date: 1296-11
    highlight_event_id: guji-董士选-event-endeavor-1-victory
  - key: closure
    name_zh: 奏黜赃吏
    labels:
      zh: 不伐其功
    start_date: 1296-12
    highlight_event_id: guji-董士选-event-endeavor-1-report
  decisions:
  - date: 1296-10
    title_zh: 孤身请往平乱
    rationale: 朝廷遣将讨刘六十，诸将观望不进致贼势益盛，遂自请督兵前往。
  - date: 1296-12
    title_zh: 只奏黜赃吏而不言破贼之功
    rationale: 以为安民在吏治，乱源在贪腐，故但请黜赃吏数人，略不及破贼事。
