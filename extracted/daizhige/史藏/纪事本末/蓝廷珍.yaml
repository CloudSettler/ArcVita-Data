person:
  qid: guji-蓝廷珍
  name_zh: 蓝廷珍
  names:
    zh: 蓝廷珍
    en: Lan Zhenzhen
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  era: 清康熙年间
  reign_ref: 康熙
  archetype: 平乱名将
  dilemmas:
  - 面对台湾全郡陷落、逃官难民涌至，力主整兵死守澎湖而非退守厦门
  - 进剿台湾时主张止歼巨魁、胁从者许其自新，以免滥杀生灵
  lesson: 临危受命者当胆略与仁心并举，谋定而后动，方能不血刃而定乱
  summary_first_person: 我蓝廷珍，任南澳总兵官。康熙六十年台湾朱一贵倡乱，全郡俱陷，浙闽总督觉罗满保檄召我星赴厦门，与我定平台方略，委我总统征台水陆大军。我率将弁八十余员、兵丁八千余名、船四百余号，会提督施世骠于澎湖，誓师渡海。六日丙午攻破鹿耳门，当日收复安平，连败贼众于鲲身、西港仔、木栅仔，克复府治。我为计深远，力言不可妄杀，止诛巨魁而胁从概予自新。事后奉檄署理台湾镇总兵官，分遣大兵剿抚南北二路，全台次第荡平。
endeavors:
- id: guji-蓝廷珍-endeavor-1
  name_zh: 受命平台
  phases:
  - key: brewing
    name_zh: 闻警条陈
    labels:
      zh: 闻警条陈、受召赴厦
    start_date: 1721-05
    highlight_event_id: guji-蓝廷珍-event-muster
    decisions:
    - date: 1721-05
      title_zh: 条陈进兵事宜，请总督驻厦就近督师
      rationale: 闻台警即上书指画谟谋，所见于总督吻合，得满保信任
  - key: breakthrough
    name_zh: 誓师渡海
    labels:
      zh: 祭江誓师、统帅大军
    start_date: 1721-06
    highlight_event_id: guji-蓝廷珍-event-crossing
    decisions:
    - date: 1721-05
      title_zh: 受委总统征台水陆大军
      rationale: 总督满保与定平台方略，视其为帅必能成功
  - key: climax
    name_zh: 攻台克复
    labels:
      zh: 破鹿耳门、取安平、复府治
    start_date: 1721-06
    highlight_event_id: guji-蓝廷珍-event-recover
    decisions:
    - date: 1721-07
      title_zh: 率舟师夜进西港仔，全力继进
      rationale: 恐林亮一军孤危，谋算必出万全，亲率大军继之
    - date: 1721-06
      title_zh: 建言止歼巨魁、胁从自新勿问
      rationale: 贼众三十万不可胜诛，多杀无益，可不血刃而平
  - key: closure
    name_zh: 剿抚余党
    labels:
      zh: 署理台镇、清剿南北二路
    start_date: 1721-07
    highlight_event_id: guji-蓝廷珍-event-appointment
    decisions:
    - date: 1721-06
      title_zh: 计擒朱一贵，给王仁和、杨旭等衔札
      rationale: 令其密纠乡壮谋擒巨魁，以绝后患
events:
- id: guji-蓝廷珍-event-birth
  type: birth
  date: ''
  year_of: ''
  description: 蓝廷珍生年，本传未载
- id: guji-蓝廷珍-event-muster
  type: endeavor
  date: 1721-05-27
  year_of: 1721
  description: 庚午日总督觉罗满保发三山，接南澳镇蓝廷珍条陈禀函，大喜曰平台得人；二十七日丁亥廷珍单骑到厦，所部舟师继至
- id: guji-蓝廷珍-event-command
  type: endeavor
  date: 1721-05
  year_of: 1721
  description: 满保与廷珍定平台方略，委其总统征台水陆大军，将弁八十余员、兵丁八千余名、船四百余号，祭江誓师
- id: guji-蓝廷珍-event-crossing
  type: endeavor
  date: 1721-06-01
  year_of: 1721
  description: 六月朔日辛卯，楼船出厦门港，中途飓风大作，廷珍亲操舟抵御，风定后发铜山至澎湖
- id: guji-蓝廷珍-event-anping
  type: endeavor
  date: 1721-06-16
  year_of: 1721
  description: 丙午黎明攻鹿耳门，林亮、董方焚贼火药破台；廷珍率四百余艘连樯并进，夺鹿耳门炮台，乘胜复安平镇城，出示安民
- id: guji-蓝廷珍-event-defense
  type: endeavor
  date: 1721-06-18
  year_of: 1721
  description: 朱一贵先后遣众数万犯安平，廷珍指挥枪炮连环夹击，亲督大炮破乌龙旗、牛车阵，贼大败不敢再至鲲身
- id: guji-蓝廷珍-event-xigang
  type: endeavor
  date: 1721-06-30
  year_of: 1721
  description: 辛亥率舟师五千五百余人夜向西港仔进发，登岸弃舟示必死心，分兵八队大败贼于苏厝甲，夜伏芒蔗间再破劫营之贼
- id: guji-蓝廷珍-event-recover
  type: endeavor
  date: 1721-07-03
  year_of: 1721
  description: 癸丑督兵南下复败贼于木栅仔，直捣台郡，朱一贵遁去，廷珍收复府治，驻札万寿亭，万姓欢呼拜迎王师
- id: guji-蓝廷珍-event-appointment
  type: endeavor
  date: 1721-07-05
  year_of: 1721
  description: 陈章报捷至厦门，总督满保檄蓝廷珍署理台湾镇总兵官事
- id: guji-蓝廷珍-event-pacify
  type: endeavor
  date: 1721-07
  year_of: 1721
  description: 与施世骠分遣大兵剿抚南北二路，南路收复凤山县擒斩颜子京、郑定瑞；北路密令杨旭等乡壮于沟尾庄计擒朱一贵
- id: guji-蓝廷珍-event-death
  type: death
  date: ''
  year_of: ''
  description: 蓝廷珍卒年，本传未载
