events:
- id: guji-蓝鼎元-event-join-campaign
  date: 1721
  year_of: 1721
  title_zh: 以宾客赞画身份随师赴台平乱
  description: 朱一贵作乱，全郡陷没，蓝鼎元随军东征，躬历行间。
- id: guji-蓝鼎元-event-campaign-service
  date: 1721-06
  year_of: 1721
  title_zh: 军中风涛戎马，参赞征剿机务
  description: 风涛戎马之间，执馘献俘、招降殄孽，罙搜穷山、绥靖番黎，无不目击手挥；中夜闻警，磨盾草檄，千里驱驰，废寝食，冒风露。
- id: guji-蓝鼎元-event-return
  date: 1721-07
  year_of: 1721
  title_zh: 事定归来，全台形胜治乱事迹了了胸中
  description: 事定归来，满船明月，所见所闻视他人较为切实。
- id: guji-蓝鼎元-event-read-false-record
  date: 1722
  year_of: 1722
  title_zh: 见《靖台实录》记事谬误，愀然叹惜
  description: 自东宁归，见市《靖台实录》者，读不终篇而愀然，谓其未经身历目睹，谬误舛错，将为害于后世。
- id: guji-蓝鼎元-event-write-book
  date: 1722
  year_of: 1722
  title_zh: 撰《平台纪略》
  description: 据事直书，功无遗漏，罪无掩讳，记朱一贵之乱始末与平台方略。
- id: guji-蓝鼎元-event-self-preface
  date: 1722
  year_of: 1722
  title_zh: 自序其编，题为蓝鼎元自题
  description: 自述著书宗旨，谓载笔所以传信，赖直道平心，庶可垂为千秋龟鉴。
