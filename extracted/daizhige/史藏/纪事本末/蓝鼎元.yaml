  era: 清康熙年间
  reign_ref: 康熙
  archetype: 军事幕僚与史家
  dilemmas:
  - 亲历平台之役却无一命之膺，是否据实直书以传信后世
  - 面对讹传的《靖台实录》，权衡著述的求实与处世风险
  lesson: 载笔所以传信，据事直书功罪不讳方可垂鉴千秋
  summary_first_person: 我随军东征逾载，躬历行间，目睹平台之役始末。归来见坊间纪载谬误百出，恐史氏据以征信贻害后世，遂据事直书，作《平台纪略》，以为千秋龟鉴。
