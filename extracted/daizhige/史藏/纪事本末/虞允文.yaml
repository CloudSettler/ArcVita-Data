  era: 南宋高宗绍兴年间
  reign_ref: 宋高宗绍兴三十一年至三十二年（约1161—1162）
  archetype: 主战文臣 · 战略谏诤者
  dilemmas:
  - 朝廷决意弃德顺三路求和，而宣谕使虞允文力陈德顺系陕西存亡、弃之则窥蜀之路愈多
  - 疏奏不合和议，反遭罢知夔州，主和派 outweigh 主战战略
  lesson: 尽言料势者未必胜于时势——忠言既上，和局已定，遂使血战新复之地得而复失。
  summary_first_person: 我以川陕宣谕使视师西陲，见吴璘力战新复十三州，而朝廷欲弃德顺班师。我上疏言恢复莫先于陕西，德顺一弃则窥蜀之路愈多，西和、阶、成利害至重。疏奏既上，反罢我知夔州，诏璘班师，金人乘其后，丧师三万三千，三路新复之地尽没。我言不用，恨事也，然臣子之责已尽。
  source_urls:
  - https://zh.wikisource.org/wiki/續資治通鑑
