person:
  qid: guji-袁枢
  name_zh: 袁枢
  names:
    zh: 袁枢
    en: Yuan Shu
  courtesy_name_zh: 机仲
  birth_place_zh: 建安
  lifespan:
    birth:
      date: '1131'
      precision: year
      is_circa: true
      raw: 文本未载生年，据宋史本传约推定
    death:
      date: '1205'
      precision: year
      is_circa: true
      raw: 文本未载卒年，事迹具宋史本传，兹据通说约定
  birth_date: '1131'
  death_date: '1205'
  era: 南宋
  reign_ref: 宋孝宗隆兴、乾道、淳熙间
  archetype: 史学家·纪事本末体开创者
  dilemmas:
  - 纪传之法或一事复见数篇而宾主莫辨，编年之法或一事隔越数卷而首尾难稽：何以于史家二体之外自创新体
  - 缀集不出通鉴原文：去取剪裁之间，如何使义例精密而不堕割裂撦挦
  - 治道尽在是矣：直书千载兴亡本末，如何使君相读之知所法戒
  lesson: 每事各详起讫、自为标题，经纬明晰、节目详具，则数千年兴亡一览了然
  summary_first_person: 吾袁枢，字机仲，建安人也。孝宗初试礼部词赋第一，历官至工部侍郎，以右文殿修撰知江陵府，寻提举太平兴国宫。吾病司马温公通鉴编年割裂、首尾难稽，乃自出新意，区别门目、以类排纂，每事各详起讫、自为标题，撰通鉴纪事本末四十二卷，始于三家分晋，终于周世宗之征淮南。淳熙三年诏严州摹印十部，孝宗读而嘉叹，分赐东宫及江上诸帅，曰治道尽在是矣。
endeavors:
- id: guji-袁枢-endeavor-1
  person: guji-袁枢
  name_zh: 撰通鉴纪事本末四十二卷
  role_zh: 撰者
  start_date: '1163'
  end_date: 1176-11
  description_zh: 因司马光资治通鉴区别门目、以类排纂，每事各详起讫、自为标题，每篇各编年月、自为首尾，始于三家分晋，终于周世宗之征淮南，于史家二体之外别为一体，前古所未有。
  phases:
  - key: brewing
    name_zh: 涵泳通鉴、发凡起例
