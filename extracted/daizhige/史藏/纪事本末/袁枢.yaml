    is_circa: true
    highlight_event_id: guji-袁枢-event-paizuan
  - key: breakthrough
    name_zh: 成书缮上、奉诏摹印
    labels:
      zh:
      - 突破
      - 成书上进
    start_date: 1176-11
    highlight_event_id: guji-袁枢-event-muyin
  - key: climax
    name_zh: 孝宗嘉叹、分赐诸帅
    labels:
      zh:
      - 高潮
      - 治道尽在是
    start_date: '1177'
    is_circa: true
    highlight_event_id: guji-袁枢-event-jiatan
  - key: closure
    name_zh: 别为一体、递相沿仿
    labels:
      zh:
      - 收束
      - 流风余韵
    start_date: 1781-05
    highlight_event_id: guji-袁枢-event-siku
  decisions:
  - date: '1170'
    is_circa: true
    title_zh: 因通鉴区别门目、以类排纂
    rationale: 纪传之弊在宾主莫辨，编年之弊在首尾难稽，故每事各详起讫、自为标题，每篇各编年月、自为首尾。
  - date: '1170'
    is_circa: true
    title_zh: 缀集一依通鉴原文，去取剪裁务归精密
    rationale: 错综温公之书，义例极为精密，异于通鉴总类诸书之割裂撦挦。
  - date: 1176-11
    title_zh: 先以缮本上之，再于严州摹印十部
    rationale: 龚茂良奏所编纪事有益见闻，奉诏摹印，仍先以缮本上进。
