- id: guji-yuanjixian-event-birth
  type: birth
  date: '1593'
  precision: year
  is_circa: true
  year_of: 1593
  raw: 约明万历二十一年（1593）
  title_zh: 袁继咸生
  description: 生年本卷未载，据通行传记约在明万历年间。
- id: guji-yuanjixian-event-aid-stopped
  type: political
