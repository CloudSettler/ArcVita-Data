  title_zh: 诏止江西总督袁继咸兵入援
  description: 五月庚寅福王监国南京，止江西总督袁继咸兵入援；继咸遂留镇上游。
  endeavor_id: guji-yuanjixian-endeavor-1
- id: guji-yuanjixian-event-governor-jiujiang
  type: appointment
  date: 1644-05
  precision: month
  is_circa: true
  year_of: 1644
  raw: 崇祯十七年五月，本卷称九江总督袁继咸
  title_zh: 出镇九江，扼金陵上游咽喉
  description: 本卷以九江总督称之，知其出镇浔阳，为金陵上游之屏障。
  endeavor_id: guji-yuanjixian-endeavor-2
- id: guji-yuanjixian-event-chanyuan
  type: memorial
  date: 1644-05
  precision: month
  is_circa: true
  year_of: 1644
  raw: 崇祯十七年五月，弘光初立
  title_zh: 谏『澶渊之行』，请奉六龙亲征
  description: 上言陛下即位虽以恩泽收人心，尤必以纲纪肃众志、益君德，以刚毅为先，不可使太阿倒持；虑春冬之间淮上不能无事，请奉六龙为澶渊之行。宏光帝难之，姜曰广言不可无此心。
  endeavor_id: guji-yuanjixian-endeavor-1
- id: guji-yuanjixian-event-strategy
  type: memorial
  date: 1644-05
  precision: month
  is_circa: true
  year_of: 1644
  raw: 崇祯十七年五月
  title_zh: 陈金陵大计，讥切南渡用舍
  description: 言金陵咽喉在浔阳、襄樊为之门，襄阳古今所争必设镇宿兵、聚粮修城，宜选吏辑民通商，收巴蜀黔滇之货利；又谓宋高不用李纲、赵鼎而用汪、黄、秦、汤致偏安，若早用刘宗周、吴甡、黄道周、杨廷麟诸人何至今日。语皆洞切，马士英谓刺己，恶之。
  endeavor_id: guji-yuanjixian-endeavor-1
- id: guji-yuanjixian-event-zuobing-letter
  type: political
  date: 1644-05
  precision: month
  is_circa: true
  year_of: 1644
  raw: 崇祯十七年五月
  title_zh: 遗书朝士预警左兵
  description: 遗书朝士言左兵不可不备，宜重督抚之权以示维制；马士英不省，其后卒有九江之变。
  endeavor_id: guji-yuanjixian-endeavor-2
- id: guji-yuanjixian-event-jiujiang
  type: military
  date: '1645'
  precision: year
  is_circa: true
  year_of: 1645
  raw: 弘光元年（1645），本卷预告『卒至九江之变（详下）』
  title_zh: 九江之变起，预警成谶
  description: 左良玉部以清君侧为名东下，上游兵动，九江变作；本卷于此仅存预告而文末阙如，继咸身陷兵祸，据史载其后被执北上。
  endeavor_id: guji-yuanjixian-endeavor-2
- id: guji-yuanjixian-event-death
  type: death
  date: '1646'
  precision: year
  is_circa: true
  year_of: 1646
  raw: 清顺治三年（1646）殉节
  title_zh: 被执不屈，守节殉难
  description: 本卷未见详文；据史载，九江兵败后继咸被执北上，拒降不仕，不屈殉节。
  endeavor_id: guji-yuanjixian-endeavor-2
