    title_zh: 面折廷诤，力言不可攻使馆
    rationale: 恐事若决裂，百万生灵涂炭，虽触怒太后亦直言。
  - date: '1900-07-02'
    title_zh: 不改主和之议
    rationale: 各督抚多以剿乱保使入告，朝中亦知其非。
  - date: '1900-07-03'
    title_zh: 慨然赴死
    rationale: 被指为可杀之臣，五千忠谏换成弃市之刑，天下冤之。
events:
- id: guji-许景澄-event-birth
