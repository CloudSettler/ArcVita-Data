- id: guji-许景澄-event-哭谏
  date: '1900-06-16'
  year_of: '1900'
  title_zh: 廷议力陈利害，皇上挽袖而哭
  description: 吏部侍郎许景澄、内阁学士联元、太常寺卿袁昶力陈利害。皇上挽许景澄袖哭，谕曰事若决裂朕一人不足惜如百万生灵何。皇太后怒叱，景澄退。
- id: guji-许景澄-event-宣谕
  date: '1900-06-17'
  year_of: '1900'
  title_zh: 奉命赴使馆宣谕
  description: 命荣禄、立山、许景澄、联元赴使馆宣谕令各使出京，各使复照会云未奉彼朝命不敢出京。
- id: guji-许景澄-event-下狱
  date: '1900-07-02'
  year_of: '1900'
  title_zh: 拿交刑部
  description: 庄王等面奉懿旨，许景澄、袁昶拿交刑部。
- id: guji-许景澄-event-death
  date: '1900-07-03'
  year_of: '1900'
  title_zh: 弃市正法
  description: 次日即正法。天下冤之。
