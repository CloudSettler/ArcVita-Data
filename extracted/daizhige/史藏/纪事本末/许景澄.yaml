  birth_date: 约1845年
  death_date: 1900年七月（庚子七月，被弃市正法）
  era: 清光绪年间
  reign_ref: 光绪
  archetype: 直谏孤臣 · 主和殉难者
  dilemmas:
  - 反对围攻使馆与对外宣战，直言利害而触怒皇太后
  - 明知进言招祸，仍力陈不可决裂，弃裂则百万生灵涂炭
  lesson: 危局中直言者虽遭弃市，天下冤之，公论长存。
  summary_first_person: 我许景澄官至吏部侍郎，庚子拳乱中力陈不可攻使馆、不可轻启战端。皇上挽袖而哭，太后怒叱。终与袁昶、联元等被拿交刑部，七月弃市，天下冤之。
  source_urls:
  - 《拳变纪略》（继昌）
