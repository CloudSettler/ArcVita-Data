events:
- id: guji-费扬古-event-birth
  date: 1645
  year_of: 1645
  type: birth
  title_zh: 董鄂·费扬古生
  description: 费扬古出生，后为满洲正白旗人。
- id: guji-费扬古-event-launch
  date: 1696-02-18
  year_of: 1696
  type: endeavor
  title_zh: 率西路大兵启行
  description: 康熙三十五年二月十八日，抚远大将军领侍卫内大臣伯费扬古领西路兵启行，与中路军约期会于土喇。
  source: 圣祖仁皇帝亲征朔漠方略
- id: guji-费扬古-event-audience
  date: 1696-02-16
  year_of: 1696
  type: endeavor
  title_zh: 蒙圣祖面授方略
  description: 二月十六日特谕费扬古，告诫勿误认喀尔喀为厄鲁特、选乡导约期奏报，规画已定于启行之前。
  source: 圣祖仁皇帝亲征朔漠方略
- id: guji-费扬古-event-arrive-kalun
  date: 1696-03-13
  year_of: 1696
  type: endeavor
  title_zh: 至喀伦分遣诸军
  description: 三月十三日率大兵至喀伦，分京师与右卫兵，自率京师大兵及大同绿旗兵由东路进。
  source: 圣祖仁皇帝亲征朔漠方略
- id: guji-费扬古-event-logistics
  date: 1696-04-07
  year_of: 1696
  type: endeavor
  title_zh: 筹画粮饷增补驮力
  description: 驻席喇呼鲁苏台，会商运米、安置宁夏兵，翰旋于兵力集结与粮道艰难之间。
  source: 圣祖仁皇帝亲征朔漠方略
- id: guji-费扬古-event-battle
  date: 1696-05-13
  year_of: 1696
  type: endeavor
  title_zh: 昭莫多之战大破噶尔丹
  description: 康熙三十五年五月，西路军于昭莫多设奇制胜，大败噶尔丹，贼众溃遁，噶尔丹仅以身免。
  source: 圣祖仁皇帝亲征朔漠方略
- id: guji-费扬古-event-triumph
  date: 1696-07
  year_of: 1696
  type: endeavor
  title_zh: 凯旋叙功
  description: 西路军克期会师有功，费扬古以殊勋受赏，为万古未前之伟绩的建立者之一。
  source: 圣祖仁皇帝亲征朔漠方略
- id: guji-费扬古-event-death
  date: 1701
  year_of: 1701
  type: death
  title_zh: 费扬古卒
  description: 康熙四十年卒，追念其平定朔漠之功。
