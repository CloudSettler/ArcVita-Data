events:
- id: guji-贾鲁-event-audit
  date: 1348-02
  year_of: 1348
  title_zh: 立行都水监于郓城以贾鲁为大监
  detail_zh: 鲁修河道察地形备得要害
  persons:
  - guji-贾鲁
- id: guji-贾鲁-event-two-plans
  date: '1348'
  year_of: 1348
  title_zh: 贾鲁为图上二策
  detail_zh: 一是修筑北堤以制横溃用工省，二是疏塞并举挽河东行使复故道其工数倍；会迁中书右司郎中不果行
  persons:
  - guji-贾鲁
- id: guji-贾鲁-event-court-debate
  date: '1350'
  year_of: 1350
  title_zh: 廷议复申故道之议
  detail_zh: 贾鲁复申前议以为必塞北河疏南河使复故道役不大兴害不能已，与成遵等异议相争，遵出为河间盐运使
  persons:
  - guji-贾鲁
- id: guji-贾鲁-event-ordered
  date: 1351-04
  year_of: 1351
  title_zh: 命贾鲁以工部尚书充河防使
  detail_zh: 发河南北兵民十七万开黄河故道，自黄陵冈南达白茅放于黄固哈济等口合于故道凡二百八十里
  persons:
  - guji-贾鲁
- id: guji-贾鲁-event-dredge
  date: 1351-04
  year_of: 1351
  title_zh: 疏浚故道及凹里减水河
  detail_zh: 浚故道通长二百八十里百五十四步而强，治凹里减水河九十八里余，塞专固缺口修堤三重
  persons:
  - guji-贾鲁
- id: guji-贾鲁-event-closure
  date: '1351-11-11'
  year_of: 1351
  title_zh: 龙口遂合决河绝流
  detail_zh: 石船沉水遏决河，进官吏工徒十余万人日加奖谕，五阅月而河复故道
  persons:
  - guji-贾鲁
- id: guji-贾鲁-event-reward
  date: 1351-11
  year_of: 1351
  title_zh: 超授贾鲁集贤大学士
  detail_zh: 赐金带银币，命立河平碑，都水监有司官皆以功迁赏有差
  persons:
  - guji-贾鲁
