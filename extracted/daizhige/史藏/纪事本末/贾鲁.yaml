  archetype: 治河工程家
  dilemmas:
  - 劳民动众兴大河之役与水患频仍不治之祸孰重
  - 中流合龙功败垂成之际进退之间众议沸腾
  lesson: 治水处得其当则用力少而患迟，失其宜则用力多而患速；临危不乱、机解捷出者方能成就大功
  summary_first_person: 我是贾鲁，元顺帝时以工部尚书充河防使，至正十一年率十七万兵民挽黄河复归故道，五阅月而龙口合，河复故道，升授集贤大学士。世人或诿天下之乱于我治河之役，然元之所以亡者纪纲废弛，非一朝一夕之故。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷066
