person:
  qid: guji-赵云
  name_zh: 赵云
  names:
    zh: 赵云
    en: Zhao Yun
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 生年不详
    death:
      date: 229
      precision: year
      is_circa: false
      raw: 蜀汉建兴七年（229年）卒，原卷未载，据史补
  death_date: 229
  era: 汉末三国
  reign_ref: 汉献帝建安年间至蜀汉后主建兴年间
  archetype: 忠勇宿将
  dilemmas:
  - 汉水之危：黄忠过期不还，以数十骑猝遇曹公大军，救则身陷、退则弃友，遂且斗且却、示空营以疑敌
  - 箕谷之任：以偏师弱旅当魏军主力，疑兵分敌之功与失利之责并至
  lesson: 临大敌而不乱，示虚以疑敌，胆勇济以谋略方为将道；然一身是胆，终难独挽偏师之败与倾国之颓。
  summary_first_person: 吾乃赵云，字子龙。建安十六年先主入蜀，吾领留营司马，与诸葛亮同卫荆州。建安十九年泝江西上，由外水定江阳、犍为，分定资中、嘉眉，会师围成都而刘璋出降。汉中之役，曹公运米北山下，吾以数十骑出营视黄忠，猝遇大军，前突其陈、且斗且却；既入营，大开门、偃旗息鼓，魏兵疑伏而退，吾雷鼓震天、以劲弩射其后，魏兵自相蹂践、堕汉水死者甚多，先主劳军叹曰“子龙一身都是胆也”。建兴六年从丞相出祁山，与邓芝为疑军据箕谷，兵败箕口而还。
