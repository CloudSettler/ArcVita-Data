    rationale: 扬声斜谷取郿以分魏兵之势，使丞相得专力攻祁山
events:
- id: guji-zhao-yun-event-birth
  title_zh: 赵云生
  date_precision: unknown
  raw: 生年不详
  summary_zh: 生年史无明文，字子龙。
  source_zh: 原卷未载，据史补
- id: guji-zhao-yun-event-211-liuying
  title_zh: 受任留营司马，留卫荆州
  date: 211
  date_precision: year
  year_of: 211
  raw: 建安十六年
  summary_zh: 昭烈自荆州将步卒数万人入益州，留诸葛亮守荆州，以赵云领留营司马。
  source_zh: 卷第二·昭烈君臣由江道入蜀
- id: guji-zhao-yun-event-214-badong
  title_zh: 与诸葛亮、张飞泝流克巴东
  date: 214
  date_precision: year
  year_of: 214
  raw: 建安十九年
  summary_zh: 诸葛亮留关羽守荆州，遂与张飞、赵云泾流克巴东，至江州，破巴郡太守严颜，生获之。
  source_zh: 卷第二·昭烈进围成都
- id: guji-zhao-yun-event-214-waishui
  title_zh: 由外水定江阳、犍为
  date: 214
  date_precision: year
  year_of: 214
  raw: 建安十九年
  summary_zh: 分遣赵云从外水定江阳、犍为；云自外水至泸州，分定资中、嘉眉等地，与张飞定巴西、德阳为掎角。
  source_zh: 卷第二·昭烈进围成都
- id: guji-zhao-yun-event-214-chengdu
  title_zh: 会师围成都，刘璋出降
  date: 214
  date_precision: year
  year_of: 214
  raw: 建安十九年
  summary_zh: 雒城溃，昭烈进围成都，诸葛亮、张飞、赵云引兵来会，围城数十日，刘璋遂出降，益州平。
  source_zh: 卷第二·昭烈进围成都
- id: guji-zhao-yun-event-219-caozhi
  title_zh: 曹公自斜谷至汉中，黄忠掠米不还
  date: 219-03
  date_precision: month
  year_of: 219
  raw: 建安二十四年三月
  summary_zh: 曹操自长安出斜谷至汉中，昭烈敛众拒险，终不交锋；操运米北山下，黄忠引兵欲取之，过期不还。
  source_zh: 卷第二·昭烈取汉中
- id: guji-zhao-yun-event-219-hanshui
  title_zh: 猝遇曹军，突陈且斗且却
  date: 219-03
  date_precision: month
  year_of: 219
  raw: 建安二十四年三月
  summary_zh: 赵云将数十骑出营视之，值操扬兵大出，云猝与相遇，遂前突其陈，且斗且却，魏兵散而复合，追至营下。
  source_zh: 卷第二·昭烈取汉中
- id: guji-zhao-yun-event-219-kongying
  title_zh: 空营疑敌，雷鼓劲弩破曹军于汉水
  date: 219-03
  date_precision: month
  year_of: 219
  raw: 建安二十四年三月
  summary_zh: 云入营更大开门，偃旗息鼓；魏兵疑有伏兵引去，云雷鼓震天，惟以劲弩于后射之，魏兵惊骇自相蹂践，堕汉水中死者甚多，云遂破其军于汉水。
  source_zh: 卷第二·昭烈取汉中
- id: guji-zhao-yun-event-219-yishendan
  title_zh: 先主叹曰子龙一身都是胆也
  date: 219-03
  date_precision: month
  year_of: 219
  raw: 建安二十四年三月，战之明旦
  summary_zh: 明旦，昭烈自来至云营视昨战处，曰：“子龙一身都是胆也。”夏五月，操与诸军还长安。
  source_zh: 卷第二·昭烈取汉中
- id: guji-zhao-yun-event-228-yijun
  title_zh: 与邓芝为疑军据箕谷
  date: 228
  date_precision: year
  year_of: 228
  raw: 建兴六年春
  summary_zh: 丞相亮扬声由斜谷取郿，使赵云、邓芝为疑军据箕谷，亮身率大军攻祁山，天水、南安、安定皆降。
  source_zh: 卷第三·汉诸葛忠武侯北伐
- id: guji-zhao-yun-event-228-jikou
  title_zh: 兵败于箕口
  date: 228
  date_precision: year
  year_of: 228
  raw: 建兴六年
  summary_zh: 魏遣张郃拒亮，马谡违节度破于街亭；赵云、邓芝亦兵弱敌强，败于箕口。
  source_zh: 卷第三·汉诸葛忠武侯北伐
- id: guji-zhao-yun-event-228-sanzhou
  title_zh: 天水三郡复入于魏
  date: 228
  date_precision: year
  year_of: 228
  raw: 建兴六年
  summary_zh: 亮收马谡下狱杀之，拔西县千余家还汉中；箕谷既败，天水、南安、安定三郡复入于魏。
  source_zh: 卷第三·汉诸葛忠武侯北伐
- id: guji-zhao-yun-event-death
  title_zh: 赵云卒
  date: 229
  date_precision: year
  year_of: 229
  raw: 建兴七年
  summary_zh: 卒于蜀汉建兴七年（229）；原卷叙事止于建兴九年而未及云卒，据史补记。
  source_zh: 原卷未载，据史补
