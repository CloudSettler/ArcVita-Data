person:
  qid: guji-赵盾
  name_zh: 赵盾
  names:
    zh: 赵盾
    en: Zhao Dun
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 不详
  birth_date: ''
  era: 春秋时期
  reign_ref: 晋灵公、晋成公之世
  archetype: 权臣与贤卿
  dilemmas:
  - 弑君之名：灵公无道屡谏不从，赵穿弑君而太史书"赵盾弑其君"，为法受恶
  - 忠信两难：出亡未越境，返不讨贼，陷入"贼民之主不忠、弃君之命不信"式困境（见鉏麑之感）
  lesson: 为法受恶、夏日可畏——执政严猛有威，然"亡不越竟，反不讨贼"则名分之责不可逃。
  summary_first_person: 我赵盾，晋国正卿，世称赵宣子。夷之搜中军之任为阳处父所易，此后执晋国政，制事典、正法罪，定晋国之常法。襄公卒后我先谋立公子雍，因穆嬴抱嗣君泣朝而背约立灵公，败秦师于令狐；河曲之役用臾骈之谋深垒固军；秦欲用士会，我设魏寿余之计诱其归晋。灵公不君，我骤谏不纳，遭鉏麑之刺、伏甲獒犬之厄，赖提弥明与灵辄得免；赵穿弑灵公于桃园，我不越境不讨贼，董狐直书"赵盾弑其君"，孔子称我"古之良大夫也，为法受恶"。人问贾季，谓我如夏日之日，可畏而不可近。
  source_urls:
  - https://zh.wikipedia.org/wiki/赵盾
