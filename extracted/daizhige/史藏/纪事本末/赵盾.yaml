events:
- id: guji-赵盾-event-take-power
  date: -621
  year_of: -621
  text_snippet: 晋搜于夷使狐射姑将中军赵盾佐之……阳处父至改搜于董易中军……宣子于是乎始为国政制事典正法罪
  note: 夷之搜，赵盾佐中军，阳处父改搜于董易其班，赵盾遂始为国政。
- id: guji-赵盾-event-linggong
  date: -620
  year_of: -620
  text_snippet: 宣子与诸大夫皆患穆嬴且畏偪乃背先蔑而立灵公以御秦师……训卒利兵秣马蓐食潜师夜起败秦师于令狐
  note: 八月晋襄公卒，欲立公子雍，后立灵公，败秦师于令狐。
- id: guji-赵盾-event-hequ
  date: -615
  year_of: -615
  text_snippet: 赵盾将中军……以从秦师于河曲臾骈曰秦不能久请深垒固军以待之
  note: 河曲之战，赵盾将中军御秦。
- id: guji-赵盾-event-retrieve-shihui
  date: -614
  year_of: -614
  text_snippet: 乃使魏寿余伪以魏叛者以诱士会……秦人归其帑
  note: 设计诱士会自秦归晋。
- id: guji-赵盾-event-assassination-attempt
  date: -607
  year_of: -607
  text_snippet: 公患之使鉏麑贼之……触槐而死……公嗾夫獒焉明搏而杀之
  note: 灵公欲杀赵盾，鉏麑触槐而死，提弥明搏獒及伏甲之厄。
- id: guji-赵盾-event-death-name
  date: -607
  year_of: -607
  text_snippet: 赵穿攻灵公于桃园宣子未出山而复大史书曰赵盾弑其君以示于朝
  note: 赵穿弑灵公，董狐直书"赵盾弑其君"，孔子称其为良史之笔。
- id: guji-赵盾-event-die
  date: ''
  year_of: ''
  note: 卒年史无明文。
