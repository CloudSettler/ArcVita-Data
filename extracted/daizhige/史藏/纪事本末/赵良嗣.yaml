- id: guji-赵良嗣-event-1
  name_zh: 归朝官赵有开、赵良嗣议报聘女真，欲用国书
  date: '1118-03-18'
  year_of: 1118
  note: 与赵有开议聘金仪制，良嗣主用国书；会赵有开卒，遂罢使。
- id: guji-赵良嗣-event-2
  name_zh: 诏充使副由登州往使金国，议夹攻契丹
  date: '1120-03-06'
  year_of: 1120
  note: 三月六日丙午，诏赵良嗣充使、王环副之，面奉密旨议夹攻取燕云地、岁币等事。
- id: guji-赵良嗣-event-3
  name_zh: 泛海抵苏州关，与阿骨打会于青牛山、龙冈
  date: '1120-04-14'
  year_of: 1120
  note: 四月十四日抵苏州关下，随观攻上京，城破后见阿骨打，致议约之意。
- id: guji-赵良嗣-event-4
  name_zh: 上京延和楼置酒议岁币，卒许契丹旧数五十万
  date: '1120'
  year_of: 1120
  note: 初许三十万，辨论久之，卒许契丹旧数。
- id: guji-赵良嗣-event-5
  name_zh: 与粘罕议六事，定榆关古北松亭为界、不许与契丹讲和
  date: '1120'
  year_of: 1120
  note: 于阿木火（阿勒楚喀）与粘罕、兀室议地界、举兵、榷场等六约。
- id: guji-赵良嗣-event-6
  name_zh: 引金使习鲁等入国门，宴于显静寺
  date: '1120-09-04'
  year_of: 1120
  note: 九月四日壬寅入国门锡宴，后于崇政殿引见，押筵送伴金使回国。
