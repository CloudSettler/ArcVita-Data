  era: 北宋末年
  reign_ref: 宋徽宗宣和年间
  archetype: 跨海使节·联金图燕的外交家
  dilemmas:
  - 夹攻契丹取燕云，借助金国兵威却引强邻入室
  - 以缴纳岁币换取旧汉地，忠于谋国还是养虎为患
  lesson: 通过海上联盟复取燕云，虽合旧疆之愿，却将新兴的金国强权引为邻邦，埋下后患；外交之约若无实力相衬，终难久守。
  summary_first_person: 我赵良嗣，北宋归朝官，宣和年间力主联金攻辽。宣和二年春，我奉诏由登州泛海使金，以买马为名面议夹攻契丹之约，与阿骨打会于上京龙冈，定燕京归宋、岁币如契丹旧数之议，并就西京、平滦营州界分与粘罕等反复辨论。然山后诸地之约旋遭抵赖，金人疑宋无兵备，盟约根基动摇，联金之谋遂为大患之始。
  source_urls:
  - https://zh.wikisource.org/wiki/三朝北盟会编/卷一百四
