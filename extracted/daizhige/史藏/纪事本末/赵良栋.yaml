  archetype: 边镇干将：以精明历练、才略过人著称，由总兵临危受命擢升提督
  lesson: 真才实学终会为知遇者所荐，临危受命更见担当
  summary_first_person: 我本任天津总兵官，将军侯张勇深知我随其征剿著有功绩、精明历练，力疏请调。康熙十五年宁夏兵变、提督陈福遇害，朝廷遂将宁夏员缺改为提督，以我升补，命兼程速赴。抵任之日，我与副都统恰塔、员外郎拉笃佑共议一切军务机宜，共守这一三边要地。
  source_urls:
  - 平定三逆方略卷二十二
