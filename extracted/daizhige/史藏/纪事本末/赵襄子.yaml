person:
  qid: guji-赵襄子
  name_zh: 赵襄子
  names:
    zh: 赵襄子（赵毋恤，一作无恤）
    en: Zhao Xiangzi (Wuxu)
  lifespan:
    birth:
      date: -500
      precision: year
      is_circa: true
      raw: 生年史无明文，约当春秋末年（约前500年）
    death:
      date: -425
      precision: year
      is_circa: true
      raw: 约卒于前425年，赵氏宗主之位传于兄后
  birth_date: 约-500
  death_date: -425
  era: 春秋末期至战国初期
  reign_ref: 晋国赵氏宗主（约前476—前425在位）
  archetype: 临危守城、借盟翻盘、让统全族的守成宗主
  dilemmas:
  - 智伯索蔡皋狼之地：与之则纵贪日削，弗与则招韩魏之甲围城灭族之险
  - 晋阳被围水灌，城不浸者三版、沉灶产蛙：降与死守之间，恃民无叛意而坚持到底
  - 两获刺客豫让：除患杀之与全义纵之难两全，先舍其命再于桥下杀之
  - 身后立嗣：传位于己子与还统于伯鲁之后，终以五子不置后而成让国之义
  lesson: 恃民心则孤城可守，用反间则弱可胜强；敬义士以收天下之心，让兄统以全赵氏之祧。
  summary_first_person: 我名毋恤，赵简子之子。父书训戒于二简试我与伯鲁，三年之后我能诵其辞、出简于袖中，遂立我为后，又嘱我晋国有难必以晋阳为归。智伯索蔡皋狼之地，我不与，他率韩魏之甲来攻；我弃长子之厚、邯郸之实，走保晋阳，城浸三版、沉灶产蛙而民无叛意。我使张孟谈潜出，以唇亡齿寒策反韩魏，夜杀守堤之吏，决水反灌智伯军，内外夹击，遂杀智伯、尽灭智氏，三家分其田。我漆智伯之头为饮器，豫让两度为刺：初获而敬其为主报仇之义，谨避而舍之；再获于桥下，遂杀之。我有五子而不肯置后，封伯鲁之子于代，早卒，立其子浣为赵氏后，使兄之统绪得续。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑/卷001
  - https://zh.wikisource.org/wiki/通鑑紀事本末
endeavors:
- id: guji-赵襄子-endeavor-1
  title_zh: 走保晋阳与三家灭智
  description: 拒智伯索地而走晋阳，依民力死守孤城，策反韩魏，决水反灌灭智氏，三家分其田。
  phases:
  - key: brewing
    name_zh: 二简受训立储、晋阳为归
    labels:
      zh:
      - 立储
      - 父训
      - 晋阳之备
    start_date: -476
    highlight_event_id: guji-赵襄子-event-heir
  - key: breakthrough
    name_zh: 拒索地而走保晋阳
    labels:
      zh:
      - 拒地
      - 保晋阳
    start_date: -455
    highlight_event_id: guji-赵襄子-event-jinyang
  - key: climax
    name_zh: 策反韩魏、决水反灌灭智
    labels:
      zh:
      - 反间
      - 决水
      - 灭智
    start_date: -453
    highlight_event_id: guji-赵襄子-event-defeat-zhibo
  - key: closure
    name_zh: 三家分智氏之田
    labels:
      zh:
      - 分地
      - 权力重组
    start_date: -453
    highlight_event_id: guji-赵襄子-event-partition
  decisions:
  - date: -455
    title_zh: 拒绝智伯索蔡皋狼之地
    rationale: 智伯无故索地，予之则求无已而宗族日削；宁抗而守先主之业。
  - date: -455
    title_zh: 弃长子近城与邯郸之富，走保晋阳
    rationale: 长子、邯郸皆厚敛于民，守之民不我与；晋阳为先主所属、尹铎所宽，民必和，可恃以御敌。
  - date: -453
    title_zh: 遣张孟谈潜出策反韩魏
    rationale: 唇亡则齿寒，赵亡则韩魏为之次；谋出二主之口、入臣之耳，可成密约。
  - date: -453
    title_zh: 夜杀守堤吏而决水灌智伯军
    rationale: 转守为攻，以水乱敌，与韩魏翼击内外并进，一举破灭智氏。
- id: guji-赵襄子-endeavor-2
  title_zh: 恩威之间：漆智伯之头与再赦再杀豫让
  description: 以漆头示威，又两遇豫让行刺，先敬其义而舍之，再获于桥下遂杀之，威与义并用。
  phases:
  - key: brewing
    name_zh: 灭智分田、漆头为饮器
    labels:
      zh:
      - 分田
      - 示威
    start_date: -453
    highlight_event_id: guji-赵襄子-event-lacquer
  - key: breakthrough
    name_zh: 豫让涂厕行刺，获而舍之
    labels:
      zh:
      - 遇刺
      - 赦义士
    start_date: -452
    highlight_event_id: guji-赵襄子-event-yurang1
  - key: climax
    name_zh: 豫让漆身吞炭伏桥再刺，遂杀之
    labels:
      zh:
      - 伏桥
      - 马惊
    start_date: -452
    highlight_event_id: guji-赵襄子-event-yurang2
  - key: closure
    name_zh: 义声与威名并存，人心益附
    labels:
      zh:
      - 收人心
    start_date: -451
    highlight_event_id: guji-赵襄子-event-yurang2
  decisions:
  - date: -453
    title_zh: 漆智伯之头以为饮器
    rationale: 惩智伯围城灌城之仇，示三家分智之威。
  - date: -452
    title_zh: 初获豫让于厕而舍之
    rationale: 智伯死无后而此人欲为报仇，真义士也；杀之则失天下义士之心。
  - date: -452
    title_zh: 再获豫让于桥下而杀之
    rationale: 前已谨避之，再纵则社稷不安；杀之以止患，亦成其忠义之名。
- id: guji-赵襄子-endeavor-3
  title_zh: 让统伯鲁：不立己子而还位兄后
  description: 有子五人不肯置后，封伯鲁之子于代为代成君，早卒，立其子浣为赵氏后，卒后国人迎浣立为献子。
  phases:
  - key: brewing
    name_zh: 念伯鲁之不立，久不置嗣
    labels:
      zh:
      - 立嗣之念
    start_date: -440
    highlight_event_id: guji-赵襄子-event-heir
  - key: breakthrough
    name_zh: 封伯鲁之子于代
    labels:
      zh:
      - 封代成君
    start_date: -426
    highlight_event_id: guji-赵襄子-event-dai-feng
  - key: climax
    name_zh: 代成君早卒，立浣为赵氏后
    labels:
      zh:
      - 立浣
    start_date: -425
    highlight_event_id: guji-赵襄子-event-li-huan
  - key: closure
    name_zh: 卒后桓子乱政，国人迎浣立为献子，襄子之志遂定
    labels:
      zh:
      - 还统
      - 献子立
    start_date: -425
    highlight_event_id: guji-赵襄子-event-death
  decisions:
  - date: -426
    title_zh: 封伯鲁之子于代，号代成君
    rationale: 为伯鲁之不立也，虽身有五子不肯置后，以位还兄之后。
  - date: -425
    title_zh: 立代成君之子浣为赵氏后
    rationale: 代成君早卒，立浣以续伯鲁之统，全兄弟之义。
events:
- id: guji-赵襄子-event-birth
  title_zh: 赵毋恤（赵襄子）生
  date: -500
  year_of: -500
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  description: 赵简子之子，名毋恤（一作无恤），生于春秋末晋国，后为赵氏宗主。
- id: guji-赵襄子-event-heir
  title_zh: 二简之试，立毋恤为后
  date: -476
  year_of: -476
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  - guji-赵襄子-endeavor-3
  description: 简子书训戒之辞于二简授伯鲁、无恤，三年而问之：伯鲁不能举辞而失其简，无恤诵辞甚习、出简于袖中；简子以为贤，立以为后，并嘱晋国有难必以晋阳为归。
- id: guji-赵襄子-event-jinyang
  title_zh: 拒智伯索地，走保晋阳
  date: -455
  year_of: -455
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  description: 智伯求蔡、皋狼之地，襄子弗与；智伯怒，帅韩魏之甲攻赵。襄子不以长子城厚、邯郸仓实为可依，谓晋阳先主所属、尹铎所宽、民必和，乃走晋阳。
- id: guji-赵襄子-event-siege
  title_zh: 三家围灌晋阳，民无叛意
  date: -455
  year_of: -455
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  description: 三家以国人围晋阳而引水灌城，城不浸者三版，沉灶产蛙，民无叛意；智伯行水叹水可亡人国，韩魏君相阴惧汾水绛水之祸。
- id: guji-赵襄子-event-alliance
  title_zh: 遣张孟谈潜出，阴约韩魏
  date: -453
  year_of: -453
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  description: 襄子使张孟谈潜出城，以唇亡齿寒说韩康子、魏桓子；二子恐事泄祸至，张孟谈以谋出二主之口、入臣之耳释其疑，遂阴定期日。
- id: guji-赵襄子-event-defeat-zhibo
  title_zh: 决水反灌，大败智伯，尽灭智氏
  date: -453
  year_of: -453
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  description: 襄子夜使人杀守堤之吏而决水灌智伯军，智伯军救水而乱，韩魏翼而击之，襄子将卒犯其前，大败智伯之众，遂杀智伯、尽灭智氏之族，惟辅果在。
- id: guji-赵襄子-event-partition
  title_zh: 三家分智氏之田
  date: -453
  year_of: -453
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-1
  - guji-赵襄子-endeavor-2
  description: 赵与韩魏分智氏之田，晋政归三家，为周威烈王二十三家命魏斯、赵籍、韩防为诸侯之基。
- id: guji-赵襄子-event-lacquer
  title_zh: 漆智伯之头以为饮器
  date: -453
  year_of: -453
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-2
  description: 赵襄子漆智伯之头以为饮器，智伯之臣豫让由是誓为报仇。
- id: guji-赵襄子-event-yurang1
  title_zh: 豫让涂厕行刺，获而舍之
  date: -452
  year_of: -452
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-2
  description: 豫让诈为刑人，挟匕首入襄子宫中涂厕；襄子如厕心动，索之获豫让。左右欲杀，襄子谓智伯死无后而此人欲为报仇、真义士也，谨避之而舍其命。
- id: guji-赵襄子-event-yurang2
  title_zh: 豫让漆身吞炭伏桥再刺，襄子遂杀之
  date: -452
  year_of: -452
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-2
  description: 豫让漆身为癞、吞炭为哑，行乞于市，伏于桥下；襄子至桥马惊，索之得豫让，遂杀之。豫让自言所为极难，将以愧天下后世为人臣怀二心者。
- id: guji-赵襄子-event-dai-feng
  title_zh: 封伯鲁之子于代，号代成君
  date: -426
  year_of: -426
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-3
  description: 襄子为伯鲁之不立也，虽身有五子不肯置后，封伯鲁之子于代，号代成君。
- id: guji-赵襄子-event-li-huan
  title_zh: 代成君早卒，立其子浣为赵氏后
  date: -425
  year_of: -425
  precision: circa
  endeavor_ids:
  - guji-赵襄子-endeavor-3
  description: 代成君早卒，襄子立其子浣为赵氏嗣，以续兄统。
- id: guji-赵襄子-event-death
  title_zh: 赵襄子卒，浣后立为献子
  date: -425
  year_of: -425
  precision: year
  endeavor_ids:
  - guji-赵襄子-endeavor-3
  description: 襄子卒，弟桓子逐浣自立，逾年而卒；赵氏之人以桓子立非襄子意，共杀其子，复迎浣立之，是为献子；献子生籍，是为烈侯，后与魏斯、韩防同为诸侯。
