  era: 清咸丰年间
  reign_ref: 咸丰
  archetype: 秘密会社首领
  dilemmas:
  - 借官府之名立威，与地方官吏互相讳饰，终致官贼难分
  - 以邪术敛财聚众求生，却陷入与乡团仇杀的泥潭
  lesson: 借势而起的私会，一旦以团练之名自我遮蔽，终究难逃覆灭
  summary_first_person: 我是赵起，本是温州钱仓的埠役。咸丰八年，周荣流落至此，我与朱秀三等八人合谋创金钱会，铸“金钱义记”大钱，托庙神惑众，从者日众。我曾纠众入平阳城捕程殿英、烧其屋，声势大张，官府惧我，反给予团练名目，愈发肆无忌惮。后来我们焚林垟陈氏、焚雷渎温氏，与瑞安孙氏、乡团结下血仇。及至乡团以台船攻钱仓，我一度几欲自尽。然我终率众渡江，攻破温州郡城，杀官夺印，又围攻瑞安城月余。城上炮火连天，守民誓死不降，我据城东龙山架炮攻城，仍不能下。
