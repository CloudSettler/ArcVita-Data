    title_zh: 与周荣等八人合谋创金钱会
    rationale: 假托山中得金钱七枚后当贵，托钱仓山庙神以惑众敛钱
  - date: 1860
    title_zh: 借官立威，纠众入平阳城捕程殿英
    rationale: 与王秀锦、程殿英有隙，且欲假官府名义树立威势
  - date: 1861
    title_zh: 约期大举攻温州郡城
    rationale: 官府屡不满实情，议抚无成，遂分路并进
events:
- id: guji-赵起-event-found
  date: 1858
  precision: year
  year_of: 1858
  type: founding
  title_zh: 合谋创立金钱会
  description_zh: 赵起与周荣、朱秀三、谢公达、缪元、张元、孔广珍、刘汝凤等八人合谋为金钱会，倚托钱仓山庙神惑众，入会者纳钱五百，给“金钱义记”大铜钱一枚。
- id: guji-赵起-event-wangxiu
  date: 1859
  precision: year
  year_of: 1859
  type: other
  title_zh: 结纳金谷山、小篁竹奸民
  description_zh: 谢秀球持大钱数千招纳瑞安江上流各处essoa与生员潘英、林景澜、郑日芳等入会，蔓延瑞安西北乡。
- id: guji-赵起-event-pingyang
  date: 1860
  precision: year
  year_of: 1860
  type: campaign
  title_zh: 纠党数千人入平阳城
  description_zh: 借官立威，捕贡生程殿英、焚其屋，与朱秀三、谢公达握剑指挥，踞坐试士院，平阳县知县翟惟本反重加犒赏。
- id: guji-赵起-event-linyang
  date: 1861-06-26
  precision: day
  year_of: 1861
  type: campaign
  title_zh: 劫掠焚烧林垟
  description_zh: 因林垟陈安澜办团练不利金钱会，赵起纠其党二千人聚钱仓后，劫林垟，焚陈氏、谢氏屋。
- id: guji-赵起-event-leidu
  date: 1861-08
  precision: month
  year_of: 1861
  type: campaign
  title_zh: 袭焚雷渎温氏
  description_zh: 温氏誓不入会且受牒为团长，台船退后，赵起于八月十九日攻雷渎，温和钧与其父儒业、妻陈氏皆死。
- id: guji-赵起-event-sack-city
  date: 1861-10-02
  precision: day
  year_of: 1861
  type: clash
  title_zh: 分道攻破温州郡城
  description_zh: 赵起与潘英、蔡华等率众两千余人由三角门入郡城，先犯试院，杀署典吏许象贤，入道署、府署、县署，杀数人，夺道印、府印、县印，大掠城中。
- id: guji-赵起-event-siege-ruian
  date: 1861-11
  precision: month
  year_of: 1861
  type: campaign
  title_zh: 据龙山围攻瑞安城
  description_zh: 赵起据城东龙山，架巨炮自上而下轰击全城，分道扑城，与海盗船三面焚掠；瑞安守民十六岁以上皆持械上城抵御，城终不陷。
