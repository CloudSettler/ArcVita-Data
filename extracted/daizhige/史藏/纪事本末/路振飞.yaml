  era: 明末（崇祯—弘光间）
  reign_ref: 崇祯、弘光
  archetype: 守土抗贼、蒙谗不渝的封疆巡抚
  dilemmas:
  - 京师已陷而代者未至——缚己以降，抑或誓众死守
  - 朱国弼构陷几被诏逮——蒙冤待罪与前线御贼难以兼顾
  - 候代未至而伪防御使武愫至境——羁縻观望与立威正法之权衡
  lesson: 孤臣守土，临难不苟免；然一去职而新政尽反、义兵立散——封疆之重，实系于其人其志
  summary_first_person: 吾乃路振飞，崇祯十七年以巡抚坐镇淮安。山西乱兵南下，吾分遣金声桓守徐州、周仕凤守泗州、周尔敬守清口，犒民兵牛酒，得士数万。闻京师陷，集众泣问降守，遂散漕粮、校坊团，与王燮治兵固守。宿迁两破贼将董学礼，沉伪官胡来贺、斩赵拱春，复槛送伪防御使武愫赴南京，史可法奏称东南安奠。朱国弼构陷几逮，吾不为屈；终以忧去职，田仰代之尽反吾政，义兵皆散，淮上之守遂坏。
