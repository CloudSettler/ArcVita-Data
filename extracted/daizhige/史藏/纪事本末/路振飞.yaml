  decisions:
  - date: 1644-01
    title_zh: 分遣三将扼守徐州、泗州、清口
    rationale: 山西乱兵大下凤阳、淮安，使金声桓守徐州、周仕凤守泗州、周尔敬守清口，并犒牛酒收民兵数万以厚守势
  - date: 1644-03
    title_zh: 闻京师陷，誓守淮城
    rationale: 集众泣问降守，众皆哭；遂散漕粮以饷士、校坊团以编民，与巡按王燮治兵固守，绝迎降之议
  - date: 1644-04
    title_zh: 出击宿迁，惩伪立威
    rationale: 击破贼将董学礼，沉伪官胡来贺、斩赵拱春，使董学礼、白邦政不敢前，东南得以安奠
