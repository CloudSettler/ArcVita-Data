  lesson: 明察利害、力持盟约，虽逆权臣亦坚守宗社大计
  summary_first_person: 我是邓洵武，字子常，官至知枢密院事。当蔡京、童贯谋结女真共攻辽国之时，我屡次力争守盟誓、罢兵保境，引赵普谏太宗之疏进呈，终使上意一度醒悟，北议暂缓。然王黼复倡兼弱攻昧之说，主上竟出师伐燕，酿成天下之乱。我之谏诤虽未克全功，然守约保民之义，志不可夺。
  source_urls:
  - docs/三朝北盟会编卷一、卷二
