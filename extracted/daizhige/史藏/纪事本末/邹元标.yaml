    rationale: 扶国纪而明人伦，虽身死何惜。
  - date: '1621'
    title_zh: 建议复张居正谥号
    rationale: 江陵未尝无功，谥不可不复，当其不当复时不敢私宽，当复时亦不因私怨不复。
