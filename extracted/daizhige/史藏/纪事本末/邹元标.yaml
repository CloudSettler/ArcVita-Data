    title_zh: 莅任总宪面谕诸御史
    rationale: 以无成心示人，始终皆为社稷。
events:
- id: guji-邹元标-event-birth
  person_id: guji-邹元标
  type: birth
  date: '1551'
  year_of: 1551
  title_zh: 邹元标出生
  detail: 约嘉靖三十年生，江西吉安人，世称邹吉水。
- id: guji-邹元标-event-death
  person_id: guji-邹元标
  type: death
  date: '1624'
  year_of: 1624
  title_zh: 邹元标去世
  detail: 天启四年卒，党祸未息，东林因以始亦因以终。
- id: guji-邹元标-event-1
  person_id: guji-邹元标
  type: endeavor
  date: '1577'
  year_of: 1577
  title_zh: 抗疏论张居正夺情，遭廷杖谪戍
  detail: 万历五年张居正夺情，元标发愤抗疏，如朝闻夕死，锋芒直犯江陵，触之立碎，遂遭廷杖、远谪。
- id: guji-邹元标-event-2
  person_id: guji-邹元标
  type: endeavor
  date: '1582'
  year_of: 1582
  title_zh: 张居正败后起用，建白称首
  detail: 江陵败后，诸不得志者悉被显擢，元标为诸君子之首，所建白多禁切主上者。
- id: guji-邹元标-event-3
  person_id: guji-邹元标
  type: endeavor
  date: '1621'
  year_of: 1621
  title_zh: 为左都御史，旋议复江陵之谥
  detail: 莅任总宪，面谕诸御史，谓江陵守制不谨固为其罪，然其功亦不可掩，谥不可不复，时议服其无成心。
- id: guji-邹元标-event-4
  person_id: guji-邹元标
  type: endeavor
  date: '1583'
  year_of: 1583
  title_zh: 言事直切，被申时行构挤出朝
  detail: 其建白多禁切主上，上久不堪，申时行因挤出之，并令人构陷赵用贤等使诸君子自相攻。
- id: guji-邹元标-event-5
  person_id: guji-邹元标
  type: endeavor
  date: '1621'
  year_of: 1621
  title_zh: 党祸大兴，发难于吉水
  detail: 天启间魏忠贤党兴，耆老仅存者孟秉用，未几党祸乃发难于邹元标，东林以此始亦以此终。
- id: guji-邹元标-event-6
  person_id: guji-邹元标
  type: endeavor
  date: '1624'
  year_of: 1624
  title_zh: 削籍归里而卒
  detail: 党禁日酷，元标削籍归山，未几卒，东林流风余韵犹系人宗社。
