person:
  qid: guji-邹元标
  name_zh: 邹元标
  names:
    zh: 邹元标、吉水、邹山甫
    en: Zou Yuanbiao
  lifespan:
    birth:
      date: '1551'
      precision: year
      is_circa: true
      raw: 嘉靖三十年（约1551年）
    death:
      date: '1624'
      precision: year
      is_circa: false
      raw: 天启四年（1624年）
  birth_date: '1551'
  death_date: '1624'
  era: 明代万历、天启年间
  reign_ref: 万历、天启两朝
  archetype: 直臣、东林党领袖、气节之士
  dilemmas:
  - 抗张居正夺情而冒死直谏，获罪廷杖、远谪边卫
  - 晚节主张复张居正谥号，被讥悔其旧论，实出为国之心
  - 身为讲学领袖却因聚徒讲学卷入党祸，毁家削籍
  lesson: 气节不灭、宠辱不惊；身可废而道不可废。
  summary_first_person: 我邹元标，以一疏抗张居正夺情而遭廷杖、谪戍都匀，然气节从此立于天下；居正败后得召还，我建言多为禁切之论，为诸君子所称首。后来虽登台省，仍不忘讲学明道，尝劝同僚勿以私憾毁人，主张复江陵之谥。天启间党祸大兴，发难于我，书院被毁，我削籍归而卒。
  source_urls:
  - 东林本末（中·下）
