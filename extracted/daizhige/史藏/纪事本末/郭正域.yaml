  archetype: 清流直臣·礼部右侍郎，坚持勘问楚王真伪而遭倾轧罢去
  dilemmas:
  - 楚王袭封真伪系皇家世系，勘则得罪亲王与辅臣，不勘则宗人之罪不定、人心不服
  - 身为江夏人查本省亲王案，一有偏徇祸且不测，须以彻底勘问自明无私
  lesson: 在党争倾轧的朝廷中，持正勘问公案可以服众，却往往以去位为代价；名节与权位难以两全。
  summary_first_person: 我是郭正域，万历年间任礼部右侍郎。楚王华奎与宗人华越互讦冒爵，朝议多右王，我独主张彻勘，谓非勘则王迹不白、各宗罪不定。沈一贯主不勘，阁部龃龉，言官劾我修怨谋陷王，上卒以王为真，我因此罢去。妖书事起，一贯又疑我所为，钱梦皋直指于我并及沈鲤。至三十三年京察，钱梦皋复请削我籍。我以直道处群小之间，终不为时所容。
  source_urls:
  - 古文传记·郭正域（明史纪事本末类史料）
