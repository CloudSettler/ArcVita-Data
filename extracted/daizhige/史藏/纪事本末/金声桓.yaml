  era: 明末清初
  reign_ref:
  - 顺治
  archetype: 降将复叛的地方军事强人
  dilemmas:
  - 降清得官与故国旧谊之间的抉择
  - 受清廷猜忌压制后反戈一击的孤注一掷
  lesson: 依附强者而失其信，则进退皆危；反正之举虽壮，无远略同盟则难持久。
  summary_first_person: 我本是明军左良玉部下总兵，良玉子梦庚降清后，我独请收江西自效，兵不血刃入南昌，尽定江西。后我杀清廷监军同营之王体忠，用其部将王得仁，实际拥兵自主。因清廷只授我总兵而不予总督之位，功用遭弃，顺治五年我遂据南昌反正归明，迎揭重熙、傅鼎铨等共事，一度震动东南。然孤城无援，谭泰大军围南昌，城破，我与王得仁皆败死，江西复入清手。
  source_urls:
  - 三藩纪事本末卷三·金、王之乱
