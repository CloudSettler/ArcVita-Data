  - date: 1645-05
    title_zh: 独请收江西自效
    rationale: 王北旋携降将俱北，声桓不愿北去，请以收江西为功自效，得许，与闯部降将王体忠合营屯浔阳。
  - date: '1645-08-25'
    title_zh: 矫杀王体忠，以王得仁代之
    rationale: 体忠拥兵观望，声桓欲专兵权，矫命杀之而并其军，以体忠部将王得仁代领，实成独立之势。
