    title_zh: 举南昌叛清归明
    rationale: 清廷只用其力不假以级，功成见忌；遂据南昌反正，首迎揭重熙、傅鼎铨，联湖东义军图兴复。
  - date: '1648'
    title_zh: 请重熙等任闽事、自留江西
    rationale: 重熙、鼎铨不欲驻省，声桓与之分任，欲并力保守南昌、联络闽赣。
events:
- id: guji-金声桓-event-join-qing
  date: 1645-05
  year_of: '1645'
  person_qid: guji-金声桓
  endeavor_id: guji-金声桓-endeavor-1
  type: milestone
  name_zh: 请命收江，合营屯浔
  detail_zh: 英王追闯贼至九江，左梦庚率三十六营降；独后营总兵金声桓请收江西自效，王许之，乃与王体忠合营屯浔，规进取。
- id: guji-金声桓-event-enter-nanchang
  date: '1645-06-19'
  year_of: '1645'
  person_qid: guji-金声桓
  endeavor_id: guji-金声桓-endeavor-1
  type: achievement
  name_zh: 入南昌，江西望风而下
  detail_zh: 声桓先遣牌招抚，巡抚旷昭先遁，士民送款；十九日入南昌，南康、九江不烦兵而下。
- id: guji-金声桓-event-kill-tizhong
  date: '1645-08-25'
  year_of: '1645'
  person_qid: guji-金声桓
  endeavor_id: guji-金声桓-endeavor-1
  type: conflict
  name_zh: 矫杀王体忠
  detail_zh: 八月二十五日，声桓矫杀王体忠，以其部将王得仁代领其众，兵权遂归一己。
- id: guji-金声桓-event-pacify-jiangxi
  date: 1646-04
  year_of: '1646'
  person_qid: guji-金声桓
  endeavor_id: guji-金声桓-endeavor-1
  type: achievement
  name_zh: 破广信，江西悉平
  detail_zh: 得仁破安仁、贵溪，周定礽、詹兆恒等死之；四月破广信，江西悉平，惟赣州未下。
- id: guji-金声桓-event-rebel
  date: '1648'
  year_of: '1648'
  person_qid: guji-金声桓
  endeavor_id: guji-金声桓-endeavor-2
  type: turning-point
  name_zh: 以南昌叛清归明
  detail_zh: 顺治五年（戊子），金声桓以南昌叛，首迎揭重熙、傅鼎铨；其故将张自盛、洪国玉等争来归，兵势大振。
- id: guji-金声桓-event-death
  date: '1649'
  year_of: '1649'
  person_qid: guji-金声桓
  endeavor_id: guji-金声桓-endeavor-2
  type: death
  name_zh: 南昌破，声桓死
  detail_zh: 清谭泰大军围南昌，重熙赴粤求援未及归而城破；声桓与王得仁皆败死，江西之兵遂尽。
