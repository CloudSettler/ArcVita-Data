  type: action
  title_zh: 密授周荃安抚方略
  description: 郡人周荃，谦益客也，有口辩；密受谦益旨，谒清帅豫王，言吴下民风柔软，飞檄可定。豫王大悦，即日拜官，使降人黄家鼒佐荃，单骑安抚吴中。
