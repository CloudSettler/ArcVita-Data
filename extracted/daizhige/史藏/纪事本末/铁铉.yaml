  title_zh: 诈降设悬门，几获成祖
  summary: 堰水灌城之危中，铉诈令军民出降，阴伏壮士门内，佯开门纳师；成祖喜而止灌，方入城而悬门发，成祖几为所获。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/卷142
