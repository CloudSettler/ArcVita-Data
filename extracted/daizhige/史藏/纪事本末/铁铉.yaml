  summary: 十二月，盛庸移师驻东昌，铉与庸等闻北师将至，大犒将士誓师，简精锐背城而阵，列火器毒弩以待；北师轻进尽为火器所伤，庸麾兵大战围成祖数匝，北兵大败，张玉败死于阵，擒斩万余。
