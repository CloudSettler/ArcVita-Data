person:
  qid: guji-铁铉
  name_zh: 铁铉
  names:
    zh: 铁铉
    en: Tie Xuan
  lifespan:
    birth:
      date: '1366'
      precision: year
      is_circa: true
      raw: 文本未载生年；据通说约生于元至正二十六年（1366）
    death:
      date: '1402'
      precision: year
      is_circa: true
      raw: 文本未载卒年；据史补，建文四年（1402）燕师入京后不屈殉难
  birth_date: '1366'
  death_date: '1402'
  era: 明初·建文朝
  reign_ref: 建文（1399—1402）
  archetype: 死守孤城的忠烈文臣
  dilemmas:
  - 开城迎降可保身家，然建文大义与济南生民不可弃，遂择死守孤城
  - 诈降设悬门近乎诡道，然堰水灌城、城旦夕且坏，非奇计不能止灌缓兵
  - 大书太祖神牌以却炮石，借孝陵之尊行守御之实，忠与机互为表里
  lesson: 城可危而节不可夺；临大难以忠义固人心，以智术撑危局，方能于必败之势中搏一线之胜
  summary_first_person: 吾本山东参政，督饷于景隆军前。景隆师溃，诸城望风而散，吾与高巍酌酒同盟，以死自誓，收溃卒、募新兵以守济南。燕师围城百道来攻，堰水灌城，吾诈降设悬门，几获其帅；炮石将破城，吾大书太祖高皇帝神牌悬之，敌不敢击。围解，与盛庸合兵复德州，擢兵部尚书，复于东昌背城列阵、列火器毒弩，大破北师。吾所守者，建文之节、济南之民而已。
  source_urls:
  - https://zh.wikisource.org/wiki/明史/卷142
