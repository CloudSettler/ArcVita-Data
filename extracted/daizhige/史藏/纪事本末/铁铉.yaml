    title_zh: 与高巍酌酒同盟，以死自誓，收溃卒守济南
    rationale: 景隆师溃、诸城望风而散，非盟誓无以系人心；济南失则山东门户尽开
  - date: 1400-08
    title_zh: 诈令军民出降，阴伏壮士门内，佯开门纳师
    rationale: 燕师堰水灌城，城旦夕且坏；诈降可止灌缓兵，悬门之发或可擒其渠魁
  - date: 1400-08
    title_zh: 大书太祖高皇帝神牌悬于炮击之处
    rationale: 敌以炮击城将坏；神牌所在，师不敢击，借孝陵之尊以全城堞
