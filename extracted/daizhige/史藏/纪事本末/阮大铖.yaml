  birth_date: ''
  death_date: ''
  era: 明末
  reign_ref: 弘光
  archetype: 佞臣权奸
  dilemmas:
  - 名列崇祯逆案被禁锢，借拥立福王与马士英之谋求复出，逆转案以自脱
  - 复出后以三案挑动君怒、兴大狱陷害清流，与东林复社旧怨相报
  - 弘光危局中受命巡防上江抵御左兵与清兵，进退皆失据
  lesson: 逆案之人一旦得志，以私怨乱朝政，终致党祸复烈、国势日蹙
  summary_first_person: 我名列逆案，屏居金陵，借马士英拥立福王之机复出，进兵部尚书，以三案激帝怒，兴大狱构陷周镳、雷演祚及诸清流，欲毁《要典》翻逆案；弘光末年随帝出奔，一生以报复怨家为事，卒为党祸之首。
  source_urls:
  - https://zh.wikisource.org/wiki/弘光朝伪东宫伪后及党祸纪略
