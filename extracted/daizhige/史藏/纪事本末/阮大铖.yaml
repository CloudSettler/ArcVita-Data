events:
- id: guji-阮大铖-event-exile
  person_id: guji-阮大铖
  type: 事业
  date: '1629'
  year_of: 1629
  title_zh: 名在崇祯定逆案中，废锢不得出
  detail: 烈皇帝定逆案，焚《三朝要典》，魏党皆锢终身，大铖名在其中
- id: guji-阮大铖-event-spy
  person_id: guji-阮大铖
  type: 事业
  date: ''
  year_of: 1635
  title_zh: 屏居金陵城南，遣梨园伶人窃听复社名士口语
  detail: 名士酒酣辄戟手詈大铖，大铖闻之嚼腭捶床大恨，怨周镳及诸名士刺骨
- id: guji-阮大铖-event-tuotuo
  person_id: guji-阮大铖
  type: 事业
  date: '1642'
  year_of: 1642
  title_zh: 归周延儒求荐，延儒以马士英为托
  detail: 曰瑶草复起，是即大铖复成也；延儒言之帝，起士英为凤阳总督
- id: guji-阮大铖-event-yongli
  person_id: guji-阮大铖
  type: 事业
  date: '1644'
  year_of: 1644
  title_zh: 与马士英谋立福王
  detail: 以福王与东林有郄，立之则东林必逐而逆案可毁，己可出
- id: guji-阮大铖-event-zhaojian
  person_id: guji-阮大铖
  type: 事业
  date: '1644'
  year_of: 1644
  title_zh: 士英荐其知兵，予冠带召见
  detail: 罗万象、王孙蕃、詹兆恒、郭维经等交章言其名在逆案不宜召，上弗听
- id: guji-阮大铖-event-ku
  person_id: guji-阮大铖
  type: 事业
  date: '1644'
  year_of: 1644
  title_zh: 入对伏地哭陈祖母之仇，以三案挑激上怒
  detail: 言陛下知君父之仇未报，亦知祖母之仇未报乎，三案挑激自此始
- id: guji-阮大铖-event-bingbushangshu
  person_id: guji-阮大铖
  type: 事业
  date: '1644'
  year_of: 1644
  title_zh: 荐为兵部右侍郎，旋进兵部尚书
  detail: 安远侯柳祚昌复荐之，后加太子太保
- id: guji-阮大铖-event-dayu
  person_id: guji-阮大铖
  type: 事业
  date: '1644'
  year_of: 1644
  title_zh: 兴大狱，逮周镳、雷演祚，捕诸名士
  detail: 校尉纷出，跄踉奔窜，善类为之一空；杀周镳、雷演祚于狱
- id: guji-阮大铖-event-liudeng
  person_id: guji-阮大铖
  type: 事业
  date: '1644'
  year_of: 1644
  title_zh: 定从逆六等条例，起用逆案诸人
  detail: 清望不悦己者辄窜入其中，袁宏勋、杨维垣等次第起用
- id: guji-阮大铖-event-namingdie
  person_id: guji-阮大铖
  type: 事业
  date: '1645'
  year_of: 1645
  title_zh: 欲藉大悲狱起大狱陷清流
  detail: 与张孙振布匿名帖于通衢，徐石麒、陈子龙、祁彪佳等皆入其内，狱不果成
- id: guji-阮大铖-event-xunfang
  person_id: guji-阮大铖
  type: 事业
  date: '1645'
  year_of: 1645
  title_zh: 奉命率兵巡防上江拒左兵
  detail: 左梦庚举兵反，京师戒严，大铖率兵巡防上江，大兵至无御之者
- id: guji-阮大铖-event-suibeng
  person_id: guji-阮大铖
  type: 事业
  date: '1645-05-28'
  year_of: 1645
  title_zh: 随帝出奔太平得功营
  detail: 五月壬辰上如太平幸得功营，阮大铖随之；其后不知所终
