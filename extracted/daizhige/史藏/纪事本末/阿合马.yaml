  reign_ref: 元世祖至元年号
  archetype: 权相式理财大臣
  dilemmas: -为国家聚敛财赋与鱼肉汉地百姓之间的矛盾 -位高权重凌驾百司与朝野公愤激化的矛盾
  lesson: 竭泽而渔式的理财终致人亡政息，权臣失制必酿其祸。
  summary_first_person: 我阿合马本是回回人，蒙元世祖信任，专领国用，理财兴榷、铁冶盐课皆出我手，权倾朝野。然政尚苛刻，搜括益急，怨愤鼎沸，至元十九年王著、高和尚矫皇太子令把我诱杀于宫前，死后我又被发棺戮尸，家产籍没。
  source_urls:
  - https://zh.wikisource.org/wiki/元史紀事本末
