  title_zh: 阿合马被王著等人矫诏诱杀
  desc: 至元十九年三月，益都千户王著与僧人高和尚借皇太子真金北巡之机，矫诏以铜锤击杀阿合马于宫前。世祖事后大怒，发棺戮尸，枭首通玄门外，籍没其家。
