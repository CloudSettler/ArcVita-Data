  date: 1287-04
  year_of: 1287
  event_type: career
  summary_zh: 至元二十四年四月，纳延反，西北诸王多欲从之，帝以为忧；宿卫使阿实克布哈献策先抚安诸王乃行天讨，帝称善，命其行之。
- id: guji-阿实克布哈-event-pacify
  date: 1287-05
  year_of: 1287
  event_type: career
  summary_zh: 至元二十四年五月前后，阿实克布哈北上说诸王纳延，晓以利害，纳延许之，诸王之谋乃解，帝遂议亲讨纳延。
- id: guji-阿实克布哈-event-strategy
  date: 1287-06
  year_of: 1287
  event_type: career
  summary_zh: 抚安之策见效，叛者势孤，世祖亲讨纳延，围其党于实喇图噜之地，纳延败走被执。
