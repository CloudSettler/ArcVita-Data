  archetype: 宿卫谋臣
  dilemmas:
  - 诸王叛乱时是否先行安抚以孤立叛者
  - 面对西北诸王欲响应纳延如何稳定宗室
  lesson: 先抚安诸王、行天讨以孤立叛者，则叛势自孤，胜于轻启用兵。
  summary_first_person: 我在至元年间担任宿卫使。至元二十四年诸王纳延反叛，西北诸王多欲响应，陛下忧之。我献策主张先抚安诸王，再行天讨，使叛者势孤。我奉命北行说服诸王，使诸王之谋解体，为主力平叛铺平了道路。
