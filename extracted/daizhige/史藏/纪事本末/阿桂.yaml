  era: 清代
  reign_ref: 乾隆
  archetype: 大将军
  dilemmas:
  - 叛乱初起、省城兵力空虚，须速调外镇劲旅弹压，同时防止擅杀扩大汉回仇怨
  - 围困石峰堡久攻不下，需权衡强攻伤亡与断水围困耗时
  lesson: 以围困断绝之道与乘隙奇袭，方能不战屈人，既平叛乱又尽量少伤生民
  summary_first_person: 我阿桂于乾隆年间两度奉命平定甘肃回变，先于龙尾山筑营断绝苏四十三水道，出奇兵致其授首；后围石峰堡别引涧水，乘回众过年诵经不备，密令健锐营与川省土练登堡破敌，戳力疆场，终以奏凯。
  source_urls:
  - https://zh.wikisource.org/wiki/平回纪略
