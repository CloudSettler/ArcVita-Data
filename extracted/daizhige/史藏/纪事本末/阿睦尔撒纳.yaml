person:
  qid: guji-阿睦尔撒纳
  name_zh: 阿睦尔撒纳
  names:
    zh: 阿睦尔撒纳
    en: Amursana
  lifespan:
    birth:
      date: ~1723
      precision: uncertain
      is_circa: true
      raw: 生年未见明文，据其乾隆十九年（1754）台吉身份推约
    death:
      date: 1757
      precision: year
      is_circa: false
      raw: 乾隆二十二年，亡命入俄罗斯界，旋伏天诛（患痘疫死）
  birth_date: ~1723
  death_date: 1757
  era: 清乾隆年间
  reign_ref: 乾隆
  archetype: 叛而复叛的厄鲁特辉特部台吉
  dilemmas:
  - 率部内属受封崇爵与潜怀异图谋据准部之间的矛盾
  - 兵败后奔哈萨克、逃入俄罗斯乞庇护与天朝追捕之势的冲突
  lesson: 恃诈负恩、背叛盟约者终难逃覆亡；俄罗斯守约不纳逋逃，函骨请验，叛乱遂平。
  summary_first_person: 我本辉特台吉，乾隆十九年率部内属，受皇上召见于热河，锡以崇爵，并充前驱从班第等西征，直抵伊犁，缚献达瓦齐。然我潜怀异志，欲总领四卫拉特，遂于二十年负恩叛乱，煽诱党与，台路中断，帅臣死绥。皇上两番命师致讨，我兵败走哈萨克，复归伊犁又遁，技穷亡命入俄罗斯界，旋患痘伏诛，俄人函其骨请使验实，准噶尔之事于是大定。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=642006
