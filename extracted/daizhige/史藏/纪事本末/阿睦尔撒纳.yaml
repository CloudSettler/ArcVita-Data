  - date: 1755
    title_zh: 负恩叛乱，煽诱党与
    rationale: 朝廷方将众建渠长分领其部，我不甘为人臣属，遂举兵叛，欲自据准部。
  - date: 1757
    title_zh: 技穷亡命入俄罗斯界
    rationale: 屡败之后计无所出，惟恇惧远飏，遁入俄罗斯乞援，然罪贯既盈，旋伏天诛。
