      raw: 约1792年
    death:
      date: 1853-03
      precision: month
      is_circa: false
      raw: 咸丰三年正月（1853年，南京城破时遇害）
  era: 清代（道光、咸丰年间）
  reign_ref: 咸丰帝
  archetype: 守土名臣
