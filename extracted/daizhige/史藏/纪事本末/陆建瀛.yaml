events:
- id: guji-lujianying-event-birth
  event_type: birth
  date: '1792'
  year_of: 1792
  title_zh: 陆建瀛出生
  description: 约生于1792年，后来官至两江总督。
- id: guji-lujianying-event-appointment
  event_type: endeavor
  date: 1852-11
  year_of: 1852
  title_zh: 江宁百姓谣传总督奉旨会剿
  description: 壬子冬，粤匪猖獗，扬言南下，总督陆建瀛奉旨会剿。
- id: guji-lujianying-event-depart
  event_type: endeavor
  date: '1852-12-15'
  year_of: 1852
  title_zh: 钦差大臣陆建瀛起身赴楚
  description: 于壬子十二月十五日起身，逡巡畏缩，不敢前进，正月初始过安庆。
- id: guji-lujianying-event-caishi
  event_type: endeavor
  date: '1853-01-30'
  year_of: 1853
  title_zh: 采石遇贼败还，秘不发丧
  description: 二十三日，制军欲复往采石防堵，遇贼而还，犹秘不发，并谕居民毋徙，贻误江宁防务。
- id: guji-lujianying-event-anqing-defeat
  event_type: endeavor
  date: '1853-01-17'
  year_of: 1853
  title_zh: 安庆失守，所部溃败
  description: 十七日安庆失守，贼至东梁山，众军溃败，此后将军祥厚谕闭各处城门。
- id: guji-lujianying-event-death
  event_type: death
  date: 1853-03
  year_of: 1853
  title_zh: 江宁城破，陆建瀛遇害
  description: 咸丰三年二月太平军攻陷江宁，陆建瀛死于城中。
- id: guji-lujianying-event-city-fall
  event_type: context
  date: '1853-03-11'
  year_of: 1853
  title_zh: 太平军以地道炸塌仪凤门攻克江宁
  description: 贼于地道中开炮，城塌数丈，乘雾登城，兵勇俱溃，副将沈鼐力战遇害，江宁城破。
