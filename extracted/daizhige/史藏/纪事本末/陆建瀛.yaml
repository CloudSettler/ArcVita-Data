  - 钦差赴楚会剿却逡巡畏缩、不敢前进，贻误江宁防务
  - 遇贼采石败还，秘不发丧并谕居民毋徙，致百万生灵罹难
  lesson: 督师西讨而怯于前敌，讳败误城，身死名损。
  summary_first_person: 我是陆建瀛，官至两江总督。咸丰二年冬奉旨会剿粤匪，然我进兵迟疑，兵败采石，遁回金陵而不敢声张。咸丰三年正月，安庆失守、贼军东下，江宁城破之日，我死于乱军之中。
  source_urls:
  - https://zh.wikipedia.org/wiki/陆建瀛
