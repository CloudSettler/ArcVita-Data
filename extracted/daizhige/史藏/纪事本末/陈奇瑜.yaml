  dilemmas:
  - 陕西流寇遍地，勦抚两难，既须杀贼立功，又须应付朝廷招抚之议
  lesson: 乱世抚勦相持之际，能战之臣亦难独挽颓局
  summary_first_person: 我陈奇瑜，陕西右布政征伐有功，崇祯五年壬申擢延绥巡抚。时张福臻以抚贼失驭去任，而我率众戮力，亦能杀贼，与叶廷桂、王振竒、戴君恩、樊一蘅诸有功之臣并列幕府。
  source_urls:
  - https://www.example.com/siku/sui-kou-ji-lue
