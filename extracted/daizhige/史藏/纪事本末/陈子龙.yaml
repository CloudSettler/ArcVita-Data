    title_zh: 与夏允彝、宋征璧散私财募士海滨
    rationale: 贼陷忻代、逼京师，及先帝崩益思复仇；水师不可迟、海舟尤不可缺，义不容缓
  - date: 1644-07
    title_zh: 请江南诸郡共为门户共募水军
    rationale: 必保江淮为根本；使江南诸郡共为门户，则万人亦不难致
- id: guji-陈子龙-endeavor-2
  name_zh: 屡疏警朝·复仇雪耻之谏
  labels:
    zh:
    - 卧薪尝胆
    - 联络义旗
    - 亲统六师
  phases:
  - key: brewing
    name_zh: 入国门再旬，见人情泄沓无异平时
    labels:
      zh:
      - 忧愤
    start_date: 1644-07
    highlight_event_id: guji-陈子龙-event-memorial-awaken
  - key: breakthrough
    name_zh: 疏请卧薪尝胆，收三齐之城、燕赵悲歌之士
    labels:
      zh:
      - 卧薪尝胆
      - 收河北山东义旗
    start_date: 1644-07
    highlight_event_id: guji-陈子龙-event-memorial-awaken
  - key: climax
    name_zh: 请大集舟师京口芜湖、三路出师讨逆
    labels:
