person:
  qid: guji-陈子龙
  name_zh: 陈子龙
  names:
    zh: 陈子龙
    en: Chen Zilong
  lifespan:
    birth:
      date: 1608
      precision: year
      is_circa: true
      raw: 1608年
    death:
      date: 1647
      precision: year
      is_circa: true
      raw: 1647年
  birth_date: 1608
  death_date: 1647
  era: 明末清初
  reign_ref: 弘光
  archetype: 忠谏言官·殉节志士
  dilemmas:
  - 国破君亡欲复仇雪耻，而朝议泄沓、忠言屡上屡不听
  - 深知水师海舟为保江淮根本，然庙堂惟议守江，志不得伸
  lesson: 危局中清醒与担当可贵，但若庙堂讳疾忌医，再切的谏言也会被清歌漏舟、痛饮焚屋的惰性吞没；忧患意识必须化为及时行动。
  summary_first_person: 我乃给事中陈子龙。京师陷、先帝崩，我即与长乐知县夏允彝、中书舍人宋征璧以私财募士海滨，欲驾海舟入援；入朝后又屡疏劝陛下卧薪尝胆，速阅京营、大集舟师于京口芜湖，联络河北山东义旗，出师三路以讨逆。然入国门再旬，人情泄沓无异平时，清歌漏舟之中、痛饮焚屋之下，我言终不见听。
