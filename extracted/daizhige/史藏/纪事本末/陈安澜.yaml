  era: 清 咸丰年间
  reign_ref: 咸丰
  archetype: 地方团练士绅
  dilemmas:
  - 奉牒办团却遭会党仇视，求官兵而郡县不应，只能倾家自保
  - 团练被诬为激变之源，忠而见谤
  lesson: 在官府讳贼纵贼之际，士绅团练举家之力御寇，虽终不免焚劫，然其坚守可见乱世民间自救之难。
  summary_first_person: 我是林洋垟富民陈安澜，奉县牒督办江南岸团练。会党金子蓉、陈丙式等忌我练团，拔旗树贼帜仇视于我。我诉于郡，郡遣罗敦樛获贼党郑步高，赵起遂纠众二千聚钱仓。我再请官兵助团，郡县皆不应。咸丰十年六月二十六日，贼劫焚林洋垟，陈氏谢氏被焚数千人。我复诉于郡，力请剿贼，又谋倾赀募台州船三十艘，令武举游飞鹏督行，与温氏团约水陆夹攻。十六日台船薄钱仓，贼仓猝四散，惜温氏误期，夹攻不成，贼反攻雷渎，温氏死难。其后高梁材等竟以激变坐罪陈氏，我忠而见谤，此时局之大悲也。
