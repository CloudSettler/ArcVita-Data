person:
  qid: guji-陈立
  name_zh: 陈立
  names:
    zh: 陈立
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  era: 西汉成帝时期
  reign_ref: 汉成帝河平年间
  archetype: 良吏/边疆平乱的能吏
  dilemmas:
  - 夜郎王兴不从谕告，杀之可速平乱但易激起更大反叛
  - 翁指、邪务据险为垒，天旱粮绝，进退两难
  lesson: 以威断与智谋并举，转乱为治
  summary_first_person: 我陈立曾任连然长、不韦令，蛮夷畏服。成帝河平年间，夜郎王兴与句町王禹、漏卧侯俞举兵相攻，大将军王凤举荐我为牂牁太守。兴仍不从命，我召其至且同亭，数责其罪，斩其首，士众释兵而降，禹与俞皆震恐入贡。其后兴妻父翁指与子邪务复反，我断其粮道、纵反间、绝其水道，蛮夷共斩翁指出降，威震南裔。蒙诏征诣京师，赐爵左庶长，历巴郡、天水太守，入为左曹卫将军护军都尉。
  source_urls:
  - https://example.org/siku-quanshu/diankao
