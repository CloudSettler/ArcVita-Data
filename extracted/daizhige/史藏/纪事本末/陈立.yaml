events:
- id: guji-陈立-event-appoint
  date: -40
  year_of: -50
  title_zh: 历任连然长、不韦令，蛮夷畏之
  description_zh: 陈立早岁在益州郡为连然长，又为不韦令，政声 stern，蛮人畏其威名，为王凤所知。
- id: guji-陈立-event-taishou
  date: -27
  year_of: -27
  title_zh: 河平二年拜牂牁太守
  description_zh: 夜郎王兴与句町王禹、漏卧侯俞举兵相攻，杜钦说大将军王凤，凤荐陈立为牂牁太守。
- id: guji-陈立-event-kill-xing
  date: -27
  year_of: -27
  title_zh: 且同亭数责夜郎王兴，斩其首
  description_zh: 立遣吏出行县，至且同亭召兴。兴将数千人往至亭，从诸邑君入见，立数责兴，断其头出晓士众，皆释兵降。
- id: guji-陈立-event-tribute
  date: -27
  year_of: -27
  title_zh: 句町王禹、漏卧侯俞震恐入粟千斛劳吏士
  description_zh: 兴既诛，禹与俞皆震恐，入粟千斛及牛羊以劳吏士，立还郡。
- id: guji-陈立-event-revolt
  date: -26
  year_of: -26
  title_zh: 翁指与邪务收余众迫胁旁二十二邑复反
  description_zh: 兴妻父翁指与兴子邪务收余众，迫胁旁二十二邑，阨险为垒以拒陈立。
- id: guji-陈立-event-battle
  date: -26
  year_of: -26
  title_zh: 都尉万年独进败走，立叱之复战
  description_zh: 都尉万年独进败走还营，立叱戏下令格之，都尉还复战，立引兵救应。
- id: guji-陈立-event-water
  date: -26
  year_of: -26
  title_zh: 天旱攻绝水道，蛮夷斩翁指首出降
  description_zh: 时天大旱，立攻绝其水道，蛮夷共斩翁指首出降，威震南裔。
- id: guji-陈立-event-honor
  date: -25
  year_of: -25
  title_zh: 征诣京师，赐爵左庶长
  description_zh: 立以平乱功征诣京师，赐爵左庶长，后由巴郡太守徙天水太守，入为左曹卫将军护军都尉。
- id: guji-陈立-event-reign-context
  date: -27
  year_of: -27
  title_zh: 汉成帝河平年间背景
  description_zh: 河平二年，陈立受命为牂牁太守，处夜郎、句町、漏卧相攻之乱局。
