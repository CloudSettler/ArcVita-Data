  lesson: 潜行问路径、身先士卒，方能于绝险中建奇功
  summary_first_person: 我本是王渊麾下裨将，宣和三年随军征讨方腊。诸将至清溪帮源洞，腊众二十万深据岩屋为三窟，莫知所入；我潜行溪谷，问野妇得小径，挺身直前渡险数里，捣其穴，格杀数十人，擒方腊以出。惜辛兴宗截洞口掠以为功。
