      date: '1075'
      precision: year
      is_circa: true
      raw: '1075'
  birth_date: '1008'
  death_date: '1075'
  era: 北宋
  reign_ref: 宋仁宗、宋英宗、宋神宗
  archetype: 宰相重臣·定策元老
  dilemmas:
  - 英宗与濮安懿王的名分之争：忠于一体之礼与尊崇生父之间左右为难，"濮议"聚讼纷纭
  - 英宗初立、两宫疑隙之际，居中调停，既要保护新君又要安抚慈寿（曹太后）垂帘之势
  lesson: 处非常之变，以定策安社稷为先，不在一时毁誉；边事则务实体，筑城练兵而不务侥幸
  summary_first_person: 我韩琦相三朝，立二帝。庆历与范仲淹同御西夏、共条新政；嘉祐定策迎立英宗；濮议之际虽遭物议，然扶危定倾，自谓无愧于社稷。在西边则筑甘谷等城，以实边备。
  source_urls:
  - https://example.org/guji/huangsong-tongjian-changbian-jishibennmo
