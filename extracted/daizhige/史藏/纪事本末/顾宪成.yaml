  dilemmas:
  - 庙堂是非与天下是非相悖时，坚守己见而遭削籍归里
  - 讲学东林、以清议影响朝政与保持士人本分之间的张力
  lesson: 直道不容于朝，则退而讲学，以天下公论自任
  summary_first_person: 我本以直言事君为职，然庙堂之是非每与天下相反，我削籍归里后讲学东林，天下随之，虽屡被召用皆辞不赴，惟持清议以正人心。
