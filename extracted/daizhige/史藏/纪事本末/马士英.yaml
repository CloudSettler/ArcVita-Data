  - guji-马士英
  summary: 崇祯十七年四月，马士英遗书南京诸大臣，言福王序当立。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
- id: guji-马士英-event-3
  type: 入阁为首辅
  date: 1644-06
  year_of: 1644
  persons:
  - guji-马士英
  summary: 五月壬辰以马士英为东阁大学士兼兵部尚书，率兵渡江劝进，后出史可法而自为首辅。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
- id: guji-马士英-event-4
  type: 排挤史可法
  date: 1644-06
  year_of: 1644
  persons:
  - guji-马士英
  - guji-史可法
  summary: 士英挟拥立功，出可法于外为督师，遂为首辅，文武离心。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
- id: guji-马士英-event-5
  type: 荐阮大铖
  date: 1644-07
  year_of: 1644
  persons:
  - guji-马士英
  - guji-阮大铖
  summary: 士英荐前光禄寺卿阮大铖知兵，予冠带召见，党祸复烈。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
- id: guji-马士英-event-6
  type: 逮系名士起党狱
  date: 1644-09
  year_of: 1644
  persons:
  - guji-马士英
  - guji-阮大铖
  - guji-周镳
  summary: 逮周镳、雷演祚下狱，捕诸名士，善类一空。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
- id: guji-马士英-event-7
  type: 侍北兵以破左
  date: 1645-04
  year_of: 1645
  persons:
  - guji-马士英
  summary: 大兵已至仪扬，士英辈谓无虞，且欲藉北兵以破左良玉。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
- id: guji-马士英-event-8
  type: 奉太后奔杭州
  date: '1645-05-10'
  year_of: 1645
  persons:
  - guji-马士英
  summary: 五月壬辰帝奔，马士英奉太后如杭州，杭州人不纳，逡巡钱塘江上。
  source_refs:
  - 戴名世《弘光朝伪东宫伪后及党祸纪略》
