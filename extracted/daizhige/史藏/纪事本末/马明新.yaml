  location_zh: 安定县官川镇
- id: guji-马明新-event-teaching-start
  date: ''
  year_of: 1770
  title_zh: 入撒拉倡起新教
  description: 马明新入撒拉地方倡起新教，演习摇头跣足、摆手仰天之仪，自称人得金光下、死者托生好处。
  participants:
  - guji-马明新
  location_zh: 循化厅撒拉地方
- id: guji-马明新-event-ming-shi
  date: ''
  year_of: 1775
  title_zh: 被愚众奉为明师掌教
  description: 教众被惑，奉马明新为明师，以为圣人复出；混名阿浑，又称掌教。不从者遭刀矛威胁，甚至弟杀兄、子杀父。
  participants:
  - guji-马明新
  location_zh: 循化厅撒拉地方
- id: guji-马明新-event-imprisoned
  date: 1781-04
  title_zh: 被官府擒获禁于皋兰
  description: 官府查办新教，马明新被预先擒获禁于皋兰县尉处；贼众围省城时曾伪言索马明新，并佯言欲见一面。
  participants:
  - guji-马明新
  location_zh: 兰州皋兰
- id: guji-马明新-event-cited-to-walls
  date: '1781-04-27'
  title_zh: 被提出面见贼众
  description: 方伯王廷赞恐茶毒生民，许贼之请，提马明新面城堞与贼头目相见。众贼滚马伏地，口称圣人，挥涕如雨。
  participants:
  - guji-马明新
  location_zh: 兰州西城
- id: guji-马明新-event-death
  date: '1781-07-10'
  title_zh: 身死销尸扬灰
  description: 苏四十三败亡后，官军销马明新尸，扬灰郊外。其后来田五等犹托言为马明新报仇，聚众再乱。
  participants:
  - guji-马明新
  location_zh: 兰州郊外
