  lesson: 创立教门可聚众于一呼之间，亦足以致杀身焚尸、累及数千人生命。
  summary_first_person: 我是马明新，安定官川镇人，入撒拉地方倡起新教，被奉为掌教阿浑，聚众煽惑，酿成大变。乾隆辛丑年我被官府擒获禁于皋兰，苏四十三等率众围省城以索我。乱平之后，我被处死，骸骨被销扬于郊外。
