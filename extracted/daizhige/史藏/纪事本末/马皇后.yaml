person:
  qid: guji-马皇后
  name_zh: 马皇后
  names:
    zh: 马皇后、高皇后、马公女
    en: Empress Ma
  lifespan:
    birth:
      date: '1332'
      precision: year
      is_circa: true
      raw: 约元至顺年间
    death:
      date: '1382'
      precision: year
      is_circa: false
      raw: 洪武十五年
  birth_date: '1332'
  death_date: '1382'
  era: 元末明初
  reign_ref: 洪武
  archetype: 贤后
  dilemmas:
  - 义父郭子兴与朱元璋之间嫌隙渐生时，身处两家夹缝如何保全夫婿
  - 养女身份与_Real_ 姓氏隐蔽之间，如何在权力中心自处
  lesson: 内助有德，以柔济刚；患难之中倾其所有以济义，方为持家安国之本
  summary_first_person: 我是马氏，宿州马公之女，郭子兴抚养我如己女，嫁与朱元璋为妻。濠州军中嫌隙四起时，我倾尽所有馈子兴妻张氏，使疑衅渐释，护其周全。后夫起兵渡江成帝业，我立为中宫皇后。
