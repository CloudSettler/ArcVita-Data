  dilemmas:
  - 讨贼当以力战还是招抚为主，杀人立威与示信招降之间难以两全
  lesson: 用兵贵谋，焚山诱敌可少胜多；然降而复擒，信义之道难全
  summary_first_person: 我名高兴，元世祖至元间为讨贼副帅，至元十七年奉命与旺扎勒图共讨漳州陈桂龙。贼据高山为险，我命士卒各挟束薪进至半山弃薪而走，如是六日诱其矢石俱尽，乃焚山而战，斩首二万级，桂龙遁走。十九年复击斩陈吊眼，招降桂龙。其后江南盗乱频仍，余多与闻征讨之事。
  source_urls:
  - 元史纪事本末卷一·江南羣盗之平
