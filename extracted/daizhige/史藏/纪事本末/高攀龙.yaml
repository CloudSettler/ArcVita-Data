  title_zh: 高攀龙出生
  summary_zh: 高攀龙生于明朝，后成为万历朝直臣与东林士人代表之一。
- id: guji-高攀龙-event-appeal
  person: guji-高攀龙
  key: endeavor
  date: 1593-11
  year_of: 1593
  era_label: 万历二十一年闰十一月甲午
  title_zh: 上疏申救得罪诸臣
  summary_zh: 高攀龙以行人身份上疏，列举孙鑨、赵用贤、赵南星等大小臣工罢斥之事，言皇上果断去邪，而左右行媚嫉之私，臣下蒙拒谏之诮，为圣德之累。
- id: guji-高攀龙-event-demotion
  person: guji-高攀龙
  key: endeavor
  date: 1593-12
  year_of: 1593
  era_label: 万历二十一年闰十一月丙申
  title_zh: 被讦奏降揭阳县典史
  summary_zh: 杨应宿讦奏高攀龙，孙丕扬核议应宿谩骂、攀龙疏而易言，命降应宿为湖广按察司经历、攀龙为广东揭阳县典史。
- id: guji-高攀龙-event-donglin
  person: guji-高攀龙
  key: endeavor
  date: '1604'
  year_of: 1604
  era_label: 万历三十二年（约）
  title_zh: 讲学东林
  summary_zh: 顾宪成谪归讲学于东林书院，天下趋之；高攀龙作为同气相求的清流士人，与东林讲学之林砚席相通，为其重要成员。
- id: guji-高攀龙-event-death
  person: guji-高攀龙
  key: death
  date: '1626'
  year_of: 1626
  era_label: 天启六年（约）
  title_zh: 高攀龙去世
  summary_zh: 天启年间阉党祸国，高攀龙不肯屈辱求生，投水而死，以死明志，全其气节。
