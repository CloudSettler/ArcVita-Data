person:
  qid: guji-高迎祥
  name_zh: 高迎祥
  names:
    zh: 高迎祥
    en: Gao Yingxiang
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 生年不详
    death: 1636
  death_date: 1636
  era: 明末
  reign_ref: 明思宗崇祯年间
  archetype: 明末农民起义领袖（闯王）
  dilemmas:
  - 饥馑与生计：秦中大祲而催科不止，是束手待毙还是亡命山谷聚众求活
  - 流动与割据：官军会剿日急，是流动作战就食四方还是据险立寨持久相持
  - 奇袭与稳妥：崇祯九年欲出子午谷奇袭西安，李自成谏阻不听，卒陷黑水峪伏围
  lesson: 天灾连年、饷匮财竭之世，失所流民一呼即成燎原；然逞奇冒进、拒纳谏言，纵称闯王亦不免黑水之擒。
  summary_first_person: 我高迎祥，陕西人，以贩马为业。崇祯元年秦中大饥，官府征敛如故，我在安塞聚众起事，自号闯王。此后渡河入晋，列名三十六营巨魁，转战秦晋畿南，崇祯六年冬渑池渡河突入中原。崇祯八年荥阳大会，我率东路军与张献忠、李自成攻陷凤阳、焚毁皇陵，天下震动。崇祯九年万里还秦，欲出子午谷直取西安，不听李自成之谏，被孙传庭伏兵困于盩厔黑水峪，力战四日马蹶被擒，槛送京师，凌迟而死。
  source_urls:
  - https://zh.wikisource.org/wiki/綏寇紀略
