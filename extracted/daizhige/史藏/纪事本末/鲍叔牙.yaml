    title_zh: 亲迎囚车释管仲于堂阜
    rationale: 管召本奉子纠，射钩为其君动，非私仇，当为国惜才
  - date: -685
    title_zh: 辞桓公相位荐管夷吾为宰
    rationale: 自陈五不如夷吾：宽惠柔民、治国不失柄、忠信结民、制礼义、执枹鼓加勇于民
  - date: -685
    title_zh: 建言以戮臣之名请诸鲁生致管仲
    rationale: 恐施伯知将用其政而不予，故假"戮于群臣"之名求得生还
events:
- id: guji-鲍叔牙-event-birth
  date: -710
  year_of: -710
  title_zh: 鲍叔牙生
  description: 生年史无明文，约生于春秋早期齐国鲍氏之族，与管仲早相友善。
  type: birth
- id: guji-鲍叔牙-event-warning
  date: -690
  year_of: -690
  title_zh: 预言"君使民慢，乱将作矣"
  description: 襄公立无常，鲍叔牙曰君使民慢、乱将作矣，遂谋奉公子小白出避。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-1
- id: guji-鲍叔牙-event-escape
  date: -686
  year_of: -686
  title_zh: 奉公子小白出奔莒
  description: 鲍叔牙傅小白，见祸将及，奉其出奔莒国；管仲召忽则奉公子纠奔鲁。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-1
- id: guji-鲍叔牙-event-enter
  date: -685
  year_of: -685
  title_zh: 御小白争先入齐，立为桓公
  description: 无知被杀后，高国阴召小白。鲍叔牙以莒车道近，令车驾疾行为前驱；管仲遮莒道射中小白带钩，小白佯死，的结果先入齐得立，是为桓公。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-1
- id: guji-鲍叔牙-event-jiu
  date: -685
  year_of: -685
  title_zh: 帅师请讨子纠，鲁杀子纠
  description: 鲁伐齐纳子纠败于干时，鲍叔帅师来言：子纠亲也请君讨之，管召讐也请受而甘心焉。鲁乃杀子纠于生窦，召忽死之，管仲请囚。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-1
- id: guji-鲍叔牙-event-release
  date: -685
  year_of: -685
  title_zh: 受管仲于鲁囚，至堂阜而税之
  description: 鲍叔受管仲之囚，行及堂阜即释其缚，归而告桓公：管夷吾治于高傒，使相可也。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-2
- id: guji-鲍叔牙-event-recommend
  date: -685
  year_of: -685
  title_zh: 辞相荐管仲
  description: 桓公使鲍叔为宰，鲍叔辞曰臣君之庸臣也，历数五事皆不如管夷吾，力荐管仲为相。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-2
- id: guji-鲍叔牙-event-fetch
  date: -685
  year_of: -685
  title_zh: 计请于鲁生致管仲
  description: 桓公欲宥管仲而恐鲁杀之，鲍叔建言假称欲戮于群臣而请生致之；鲁庄公使束缚以予齐使，既至齐则三衅三浴，桓公亲逆于郊，礼以为相。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-2
- id: guji-鲍叔牙-event-serve
  date: -680
  year_of: -680
  title_zh: 让贤甘居管仲之下，同辅齐霸
  description: 鲍叔牙以身下之，与管仲、隰朋、高傒同心辅政，助桓公北杏会盟、平宋服郑，齐始霸焉。
  type: endeavor
  endeavor_id: guji-鲍叔牙-endeavor-2
- id: guji-鲍叔牙-event-death
  date: -644
  year_of: -644
  title_zh: 鲍叔牙卒
  description: 卒年不详，约终于齐桓公霸业后期，后世以"管鲍之交"称其知人之明与让贤之德。
  type: death
