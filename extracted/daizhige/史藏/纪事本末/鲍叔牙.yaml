  name_zh: 鲍叔牙
  names:
    zh: 鲍叔牙
    en: Bao Shuya
  lifespan:
    birth:
      date: -710
      precision: decade
      is_circa: true
      raw: 约春秋早期，生年不详
    death:
      date: -644
      precision: year
      is_circa: true
      raw: 卒年不详，约齐桓公晚年
  birth_date: -710
  death_date: -644
  era: 春秋
  reign_ref: 齐桓公
  archetype: 知人让贤的辅政重臣
  dilemmas:
  - 辅佐小白奔莒避乱，还是留守危城
  - 桓公欲以鲍叔为宰，荐管仲自代，还是固位专权
  - 管仲曾射中桓公带钩，劝桓公宥而用之，还是任旧怨废大才
  lesson: 知人善让、荐贤不忌，成全霸业者未必亲执其政。
  summary_first_person: 我鲍叔牙事齐小白。襄公无道，我知乱将作，奉公子小白出奔莒。无知之乱既平，我御小白争先入齐，立为桓公。桓公欲以我为宰，我力辞，言治国有如管夷吾者，遂设计自鲁生致管仲，三衅三浴而进之。我终身让贤，甘居其下，助成桓公九合诸侯之霸。
  source_urls:
  - 左传纪事本末卷十八·齐桓公之伯（钦定四库全书）
