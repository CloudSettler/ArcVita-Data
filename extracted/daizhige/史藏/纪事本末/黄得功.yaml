person:
  qid: guji-huang_degong
  name_zh: 黄得功
  names:
    zh: 黄得功
    en: Huang Degong
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      date: 1645
      precision: year
      is_circa: false
      raw: 弘光元年（1645年）
  death_date: 1645
  era: 明末清初
  reign_ref: 弘光
  archetype: 忠勇武将
  dilemmas:
  - 身在跋扈藩镇之间，独忠勇奉朝命，孤掌难鸣
  - 面对真伪难辨的“太子”案，须在保全皇室血胤与安定人心之间抉择
  lesson: 乱世之中，个人的忠勇终难挽朝廷倾颓，四镇仅其一忠而国仍亡。
  summary_first_person: 我是黄得功，弘光朝靖南侯，四镇之中唯我忠勇奉朝命。我破左梦庚兵于板子矶，进封靖国公；帝出奔幸我营，终因刘良佐引兵劫驾，我力战死于芜湖。
endeavors:
- id: guji-huang_degong-endeavor-1
  name_zh: 拥立福王与镇守江北
  phases:
  - key: brewing
    name_zh: 结纳马士英
    labels:
      zh: 崇祯末年
    start_date: 1644
    highlight_event_id: guji-huang_degong-event-yongli
  - key: breakthrough
    name_zh: 分镇江北
    labels:
      zh: 弘光元年
    start_date: 1644
    highlight_event_id: guji-huang_degong-event-fenghou
  - key: climax
    name_zh: 忠勇事朝
    labels:
      zh: 弘光年间
    start_date: 1645
    highlight_event_id: guji-huang_degong-event-taibao
  decisions:
  - date: 1644
    title_zh: 愿立福王
    rationale: 与马士英深相结，随士英之旨主张立福王为君。
  - date: 1645
    title_zh: 上疏保全疑似东宫
    rationale: 言太子真伪未辨，乞多方保全以谢天下，遽加害则天下必以为真东宫。
- id: guji-huang_degong-endeavor-2
  name_zh: 讨伐左兵与殉国
  phases:
  - key: brewing
    name_zh: 征调入卫
    labels:
      zh: 左良玉举兵反
    start_date: 1645
    highlight_event_id: guji-huang_degong-event-banzi
  - key: climax
    name_zh: 板子矶大捷
    labels:
      zh: 弘光元年
    start_date: 1645
    highlight_event_id: guji-huang_degong-event-jingguo
  - key: closure
    name_zh: 芜湖殉难
    labels:
      zh: 弘光元年
    start_date: 1645
    highlight_event_id: guji-huang_degong-event-death
  decisions:
  - date: 1645
    title_zh: 迎驾太平
    rationale: 帝弃南京出奔，幸我得功营中避难。
events:
- id: guji-huang_degong-event-birth
  type: birth
  name_zh: 黄得功出生
  note: 生年不详
- id: guji-huang_degong-event-yongli
  type: political
  date: 1644
  year_of: 1644
  name_zh: 与诸将共主拥立福王
  note: 士英兵权在握，与黄得功、高杰、刘泽清、刘良佐深相结，诸将皆愿立福王。
- id: guji-huang_degong-event-fenghou
  type: appointment
  date: 1644
  year_of: 1644
  name_zh: 分镇江北、进封靖南侯
  note: 史可法请分江北为四镇，得功等分统之；帝即位后得功进封靖南侯。
- id: guji-huang_degong-event-taibao
  type: political
  date: 1645
  year_of: 1645
  name_zh: 上疏乞保全疑似太子
  note: 言先帝之子及陛下之子真伪未辨，乞多方保全以谢天下。
- id: guji-huang_degong-event-banzi
  type: military
  date: 1645
  year_of: 1645
  name_zh: 板子矶大破左梦庚兵
  note: 左良玉子梦庚举兵反，得功大破梦庚兵于板子矶。
- id: guji-huang_degong-event-jingguo
  type: appointment
  date: 1645
  year_of: 1645
  name_zh: 进封靖国公世袭
  note: 以板子矶之功，进封靖国公，爵位世袭。
- id: guji-huang_degong-event-death
  type: death
  date: 1645-05
  year_of: 1645
  name_zh: 死于芜湖
  note: 帝幸得功营，降将刘良佐引兵至芜湖劫驾如大兵营，黄得功死之。
