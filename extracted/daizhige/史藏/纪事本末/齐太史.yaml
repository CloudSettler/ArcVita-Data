  birth_date: 约-600
  death_date: 约-548
  era: 春秋
  reign_ref: 齐后庄公、崔杼执政时期
  archetype: 直笔史官
  dilemmas:
  - 记史直书崔杼弑君而身遭屠戮，还是屈从权臣而失史职之守
  - 兄弟相继死者是否仍从前简续书
  lesson: 秉笔直书、宁死不夺，史官以生命守护实录之义
  summary_first_person: 我是齐国的太史。崔杼弑其君齐庄公，我直书"崔杼弑其君"，被他杀死；我的两个弟弟相继接着写，又相继被杀；最小的弟弟仍旧直书，崔杼终于放弃，不得不让我写下史实，而南史氏还抱着简策等候我们死绝再继续。由此史笔得以保全，弑君之罪终不可掩。
  source_urls:
  - https://zh.wikipedia.org/wiki/%E9%BD%90%E5%A4%AA%E5%8F%B2
