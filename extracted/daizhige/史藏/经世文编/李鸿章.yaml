person:
  qid: guji-李鴻章
  name_zh: 李鸿章
  names:
    zh: 李鸿章
    en: Li Hongzhang
  lifespan:
    birth:
      date: '1823'
      precision: year
      is_circa: false
      raw: 道光三年
    death:
      date: '1901'
      precision: year
      is_circa: false
      raw: 光绪二十七年
  birth_date: '1823'
  death_date: '1901'
  era: 清代人名
  reign_ref: 道光·咸丰·同治·光绪
  archetype: 洋务名臣，海防与自强之倡导者，外事折冲之重镇
  dilemmas:
  - 海防与塞防之争，李鸿章力主海防，而朝议多主并重塞防，故有来调度国帑之难
  - 马嘉理案后中外交涉，李鸿章主持议约，故有主战主和之难
  - 甲午之败，北洋水师覆于威海，李鸿章身任其责，故有力任其咎之难
  lesson: 李鸿章之难在主和主战两端，一端恐启外侮，一端恐失国威，折冲樽俎，不辱使命，而甲午一役北洋覆没，斯言亦成讽刺，其自强之志虽在，而大势已倾
  summary_first_person: 我李鸿章以皖中布衣起家，从军干戈之际，以淮军之众，历剿粤捻，其后海防帆樯之利，机器制造之术，电线铁路之谋，莫不以我先之。舟大在洋者三十余年，外而节钺，内且宰辅，中外交涉，率由我主持。而甲午之役，北洋水师一战于黄海，再困于威海，师徒尽丧，议和开（春帆楼）之约，马关之盟，骂名一身。晚岁复任两广，庚子之变，奉命议和，卒于任所，为中外投重之身，盖棺之日，是非难定。
  source_urls:
  - https://zh.wikipedia.org/wiki/李鸿章
  - https://zh.wikisource.org/wiki/清代名人传略
