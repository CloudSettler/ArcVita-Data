  name_zh: 弱冠随任武昌习经世之学
  description_zh: 盛宣怀弱冠随任武昌，先父勖以经世之学，举贺氏文编授读，业余辄自循览；从贤士大夫游，纵观近代名家专集及军兴以来奏牍书札，历年择录积盈箧衍。
- id: guji-盛宣怀-event-career-2
