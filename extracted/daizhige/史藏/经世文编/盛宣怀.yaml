      raw: ''
  birth_date: '1844'
  death_date: '1916'
  era: 清末
  reign_ref: 道光至宣统年间
  archetype: 经世编书者·洋务官僚
  dilemmas:
  - 时局纷纭、驰驱仕途与续编经世文之志难以兼顾，屡作屡辍
  - 面对强弱异宜、彼合我孤之局，须于泥守成法与力图自强之间抉择
  lesson: 人定可以胜天，观往策应对越艰难，益厉转弱为强之志
  summary_first_person: 我弱冠随任武昌，先君勖我以经世之学，举贺长龄所编经世文编授我研习。我壮岁驰驱未及卒业，先辑林、胡、曾三公奏议以明祈向；迨承乏东海，幸多闲暇，与二三同志搜讨集益，先君自浙告归渡海就养，复加手辑，赓续董成，历时既久，经始于重光，蒇工于强圉，成续编经世文百二十卷。
