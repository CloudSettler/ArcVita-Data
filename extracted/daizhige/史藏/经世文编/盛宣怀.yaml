  year_of: 1897
  type: career
  endeavor_id: guji-盛宣怀-endeavor-2
  name_zh: 续编经世文百二十卷蒇工
  description_zh: 经始于重光、蒇工于强圉之岁，成续编经世文百二十卷，凡辑道光初元迄今四朝诸家文集公私论议，以续贺氏之书，发凡起例述缘始于书后。
