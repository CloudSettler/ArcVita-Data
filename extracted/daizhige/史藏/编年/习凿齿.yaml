  name_zh: 习凿齿
  names:
    zh: 习凿齿
    en: Xi Zaochi
  lifespan:
    birth:
      date: 0328
      precision: year
      is_circa: true
      raw: 约东晋咸和年间（一说328年）
    death:
      date: '0413'
      precision: year
      is_circa: true
      raw: 约东晋义熙九年（413年）
  birth_date: 0328
  death_date: '0413'
  era: 东晋
  reign_ref: 晋穆帝至晋安帝间
  archetype: 史学家
  dilemmas:
  - 晋受魏禅，尊魏统则汉统遂绝，黜魏继汉则须直书本朝禅代之由，正名与时讳难以两全
  - 仕于权臣幕府，见其势倾人主，进则恐同流、退则恐贾祸，惟以著述寄褒贬
  lesson: 史笔所在即名分所在，一字之褒贬可折千古之正闰
  summary_first_person: 吾习凿齿，襄阳人，仕于东晋。疾曹魏篡汉而晋承魏后、统绪不明，乃撰《汉晋春秋》，起汉光武，讫晋愍帝，力主晋宜越魏继汉、不应以魏后为三恪，临终犹上论疏申此义。又作《别周鲁通诸葛论》，重诸葛武侯匡汉宗本之心，而斥周瑜、鲁肃为小人。评刘备当阳之败，称其颠沛而信义愈明、终济大业宜也；评曹操骄伐，叹其勤于数十年而弃于俯仰之顷，知其不能兼天下。原书久佚，清人汤球辑吾遗文，褒贬犹可概见。
endeavors:
- id: guji-习凿齿-endeavor-1
  name_zh: 修撰《汉晋春秋》
  summary_zh: 编年体晋史，起汉光武、终晋愍帝，以晋越魏承汉统为全书纲旨；原书亡佚，清汤球辑本传世，书中多发习凿齿曰之史评。
  start_date: '0356'
  end_date: '0413'
  phases:
  - key: brewing
    name_zh: 出仕积材
    labels:
      zh: 应辟入幕、留心汉晋之际史事
    start_date: '0356'
    highlight_event_id: guji-习凿齿-event-ru-mu
  - key: breakthrough
    name_zh: 立正统之旨
    labels:
      zh: 定晋宜越魏继汉之义
    start_date: '0365'
    highlight_event_id: guji-习凿齿-event-zhengtong-lun
  - key: climax
    name_zh: 撰成全书
    labels:
      zh: 汉晋春秋成书
    start_date: 0383
    highlight_event_id: guji-习凿齿-event-hanjin-chengshu
  - key: closure
    name_zh: 临终申义
    labels:
      zh: 临终上前论疏
    start_date: '0413'
    highlight_event_id: guji-习凿齿-event-linzhong-shu
  decisions:
  - date: '0365'
    title_zh: 定越魏继汉之义
    rationale: 晋虽受魏禅而魏实篡汉，若以魏后为三恪则正闰倒置；故力主晋越魏而直承汉统，以正名分。
  - date: 0383
    title_zh: 断限起汉光武讫晋愍帝
    rationale: 依统绪定断限，明晋之所承在汉不在魏，使编年与正统论相表里。
- id: guji-习凿齿-endeavor-2
  name_zh: 史论褒贬以正名分
  summary_zh: 以别周鲁通诸葛论及散篇习凿齿曰品评三国人物，以是否尽忠汉室与劳谦骄伐为君子小人之判。
  start_date: '0366'
  end_date: 0385
  phases:
  - key: brewing
    name_zh: 读史辨统
    labels:
      zh: 潜心史评、先定所为之本
    start_date: '0366'
  - key: breakthrough
    name_zh: 别周鲁通诸葛
    labels:
      zh: 主客问答定褒贬
    start_date: 0380
    highlight_event_id: guji-习凿齿-event-bie-zhou-lu
  - key: climax
    name_zh: 品评曹刘
    labels:
      zh: 评刘备信义与曹操骄伐
    start_date: 0383
    highlight_event_id: guji-习凿齿-event-shi-ping
  - key: closure
    name_zh: 定评入书
    labels:
      zh: 史评随汉晋春秋传世
    start_date: 0385
    highlight_event_id: guji-习凿齿-event-hanjin-chengshu
  decisions:
  - date: 0380
    title_zh: 尊诸葛而贬周瑜鲁肃
    rationale: 以臣节之终始定人品，汉室未亡而竭臣礼于孙氏为小人，诸葛有匡汉宗本之心故重之。
  - date: 0383
    title_zh: 以骄伐信义论成败
    rationale: 齐桓一矜而叛者九国、曹操暂骄而天下三分，皆勤于数十年而弃于俯仰之顷，垂戒后世劳谦居让。
