    death:
      date: '-2600'
      precision: 约传说在位一百一十年（或云一百一十六年）后
      is_circa: true
  birth_date: 约-2700（传说）
  death_date: 约-2600（传说，在位百余年后没）
  era: 上古三皇时代
  reign_ref: 甲寅元年辛巳（传说纪年）
  archetype: 文化创制圣王
  dilemmas:
  - 上古民智未开、无纲纪器用，何以立教化之基
  - 传闻异辞、年代渺远，如何考信于后世
  lesson: 观天法地、因时而制，方为百王之先
  summary_first_person: 我生于成纪，风姓，德合天地。我仰观天象、俯察地理，始作八卦，因重之为六十四爻；结绳为网罟以佃以渔，以赡民用；制嫁娶以俪皮为礼；作甲历、建五气、定五行；以龙纪官，正君臣父子夫妇之义。我继天而王，为百王之首，在位一百一十年而没，后世称为太昊。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑外紀/卷第一
