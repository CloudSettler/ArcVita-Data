    title_zh: 取象天地始作八卦
    rationale: 天应以河图洛书，故仰观象于天、俯观法于地、中观万物之宜，造八卦以通神明之德
  - date: '-2690'
    title_zh: 作为网罟教民佃渔
    rationale: 上古茹毛饮血、衣食无利，度时制宜作网罟以赡民用
  - date: '-2680'
    title_zh: 制嫁娶之礼、定人伦
    rationale: 民但知其母不知其父，故以俪皮为礼制嫁娶，正夫妇之义
