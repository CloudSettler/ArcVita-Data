    rationale: 筮纪阳气之初以为律法，使民知天时，立纲常之教
  - date: '-2690'
    title_zh: 始名官而以龙纪官
    rationale: 上古有名无官，故立官职以龙名之，定五行、正人伦
events:
- id: guji-伏羲-event-birth
  date: 约-2700
  year_of: -2700
  type: birth
  title_zh: 生于成纪
  description: 包牺氏母曰华胥，蛇首人身，风姓，生于成纪
- id: guji-伏羲-event-ascend
  date: '-2700'
  year_of: -2700
  type: reign_start
  title_zh: 继天而王，甲寅元年
  description: 继天而王，为百王先；一说甲寅元年辛巳，太昊之号取象日月之明
- id: guji-伏羲-event-bagua
  date: '-2700'
  year_of: -2700
  type: achievement
  title_zh: 造八卦
  description: 德合上下，天应以鸟兽文章，地应以河图洛书；仰观象于天，俯观法于地，中观万物之宜，造八卦，始作三画以象二十四气，因而重之，爻象备矣
- id: guji-伏羲-event-wanggu
  date: '-2690'
  year_of: -2690
  type: achievement
  title_zh: 作网罟以佃以渔，制嫁娶之礼
  description: 度时制宜，作为网罟以佃以渔，以赡民用；制嫁娶以俪皮为礼，于是人民乃治
- id: guji-伏羲-event-lijian
  date: '-2690'
  year_of: -2690
  type: achievement
  title_zh: 建律法、立官制
  description: 筮之纪阳气之初以为律法，建五气、立五常、定五行，始名官而以龙纪，有甲历五运，象法乾坤以正君臣父子夫妇之义
- id: guji-伏羲-event-death
  date: '-2600'
  year_of: -2600
  type: death
  title_zh: 在位崩殒
  description: 在位一百一十年（或云一百一十六年）而没，包牺氏没，女娲氏代立
