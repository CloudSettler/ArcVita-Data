person:
  qid: guji-伯夷
  name_zh: 伯夷
  names:
    zh: 伯夷
    en: Bo Yi
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 商末，年不可考
    death:
      precision: unknown
      is_circa: true
      raw: 约周武王克商后，饿死于首阳山
  era: 商末周初（约公元前11世纪）
  reign_ref: 孤竹国世子（未嗣位）
  archetype: 求仁得仁的嘉遁忠廉之士
  dilemmas:
  - 义不食周粟与求生之间的抉择
  - 父命传位叔齐而夷让国的兄弟让位之难
  lesson: 以清节立身，虽饿死首阳而求仁得仁，为后世所称。
  summary_first_person: 我是孤竹君长子伯夷，父欲立弟叔齐，叔齐让位于我，我逃去的；叔齐亦不立而逃。周武王伐纣，我们叩马而谏以为不孝不仁；周有天下，我耻食周粟，隐于首阳山采薇而食，终于饿死。我求仁而得仁，虽贫贱亦无所怨悔。
endeavors:
- id: guji-伯夷-endeavor-1
  key: brewing
  name_zh: 让国出逃
  labels:
    zh: 让国
  highlight_event_id: guji-伯夷-event-1
  decisions:
  - title_zh: 逃让君位
    rationale: 父欲立叔齐，伯夷顺父命而让国，遂遁去。
- id: guji-伯夷-endeavor-2
  key: climax
  name_zh: 叩马谏伐与耻食周粟
  labels:
    zh: 谏伐 / 不食周粟
  highlight_event_id: guji-伯夷-event-2
  decisions:
  - title_zh: 隐于首阳采薇
    rationale: 耻食周粟，以全其义，采薇于首阳山而食之。
- id: guji-伯夷-endeavor-3
  key: closure
  name_zh: 饿死首阳
  labels:
    zh: 殉义
  highlight_event_id: guji-伯夷-event-3
events:
- id: guji-伯夷-event-birth
  type: birth
  description: 伯夷生于商末孤竹国，为孤竹君长子。
- id: guji-伯夷-event-1
  type: endeavor
  description: 孤竹君欲立叔齐，父卒后伯夷让国，逃去；叔齐亦不肯立而逃。
- id: guji-伯夷-event-2
  type: endeavor
  description: 周武王伐纣，伯夷、叔齐叩马而谏，以为"父死不葬，爰及干戈，可谓孝乎？以臣弑君，可谓仁乎？"
- id: guji-伯夷-event-3
  type: endeavor
  description: 武王克商有天下，伯夷耻食周粟，隐于首阳山，采薇而食，遂饿死。
- id: guji-伯夷-event-death
  type: death
  description: 伯夷饿死于首阳山，其清节为后世所传颂。
