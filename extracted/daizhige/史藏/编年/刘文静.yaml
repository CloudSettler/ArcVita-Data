  era: 隋末唐初
  reign_ref: 大业年间
  archetype: 谋臣
  dilemmas:
  - 举兵反隋与尽节隋臣之间的抉择
  - 联突厥借兵与防其滋扰边民的权衡
  lesson: 识时势者能以小吏之身佐成大业，然机变与守节常难两全
  summary_first_person: 我刘文静本为晋阳县令，逢隋乱而起。甲子旦，我以状告高君雅、王威私通突厥，助唐公定晋阳之局。后突厥数万骑逼城，我受命守备诸门。及唐公建大将军府，我为司马，奉命使于突厥迎其兵马。胡兵虽来，帝诫我取数百足矣，恐为民患，我体其意而还。
