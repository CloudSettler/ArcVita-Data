events:
- id: guji-努尔哈赤-event-birth
  name_zh: 努尔哈赤出生
  date: 1559
  year_of: 1559
  desc_zh: 显祖塔克世之子，长白山俄朶里、赫图阿拉满洲部之后，受龙虎将军之职
- id: guji-努尔哈赤-event-revenge
  name_zh: 以十三副遗甲起兵讨尼堪外兰
  date: 1583
  year_of: 1583
  desc_zh: 父祖被尼堪外兰搆衅于明所害，以遗甲十三副起兵攻图伦城，尼堪外兰遁走
- id: guji-努尔哈赤-event-maerdun
  name_zh: 征玛尔墩寨以四人败八百敌
  date: 1584-04
  year_of: 1584
  desc_zh: 亲征哲陈、界藩，执纛先进，率弟穆尔哈齐等击溃八百敌兵，神勇盖世
- id: guji-努尔哈赤-event-reign
  name_zh: 上尊号建元天命
  date: 1616
  year_of: 1616
  desc_zh: 丙辰年俯顺诸贝勒大臣恭上尊号覆育列国英明皇帝，建元天命
- id: guji-努尔哈赤-event-sevenhatreds
  name_zh: 书七大恨告天伐明
  date: 1618
  year_of: 1618
  desc_zh: 天命三年黄气贯天，遂率步骑二万击抚顺，招降守将李永芳，毁其城
- id: guji-努尔哈赤-event-sarhu
  name_zh: 萨尔浒之战大破明军
  date: 1619
  year_of: 1619
  desc_zh: 明四路来攻号称四十七万，先破杜松于萨尔浒山，再破马林尚间崖、刘綎阿布达哩冈，以少胜众
- id: guji-努尔哈赤-event-liaoshen
  name_zh: 克沈阳下辽阳定辽沈
  date: 1621
  year_of: 1621
  desc_zh: 阵斩贺世贤、袁应泰自焚，辽阳既下属城七十余俱降，定都辽阳
- id: guji-努尔哈赤-event-death
  name_zh: 努尔哈赤卒
  date: 1626
  year_of: 1626
  desc_zh: 天命十一年卒，其基业由皇太极嗣而宏之，克定盛京规模
