  decisions:
  - date: 493-08
    title_zh: 借南伐之名定迁都之策
    rationale: 恐鲜卑贵族反对迁都，遂以南征为名率军至洛阳，造成既成事实。
  - date: '496'
    title_zh: 下诏改拓跋氏为元氏并厘定姓族
    rationale: 以姓氏、语音、服饰之改革使胡汉融合，巩固中原统治合法性。
events:
- id: guji-北魏孝文帝拓跋宏-event-birth
  date: '467'
  year_of: 467
  title_zh: 拓跋宏生于平城
  description: 皇兴元年八月，献文帝拓跋弘长子拓跋宏生于北魏平城。
  participants:
  - 献文帝拓跋弘
  endeavor_ref: ''
- id: guji-北魏孝文帝拓跋宏-event-亲政
  date: 490-10
  year_of: 490
  title_zh: 冯太后卒，孝文帝亲政
  description: 太和四年冯太后病逝，孝文帝开始独揽朝政，继续推行改革。
  participants:
  - 冯太后
  endeavor_ref: guji-北魏孝文帝拓跋宏-endeavor-1
- id: guji-北魏孝文帝拓跋宏-event-均田
  date: '485'
  year_of: 485
  title_zh: 颁行均田令
  description: 太和九年太和纪事颁均田令，计口授田，继以三长制检括户口。
  participants:
  - 李安世
  endeavor_ref: guji-北魏孝文帝拓跋宏-endeavor-1
- id: guji-北魏孝文帝拓跋宏-event-迁都
  date: 493-10
  year_of: 493
  title_zh: 借南伐至洛，决意迁都
  description: 太和十七年，孝文帝率军号称南征，至洛阳后宣布定都于此，群臣不敢复谏。
  participants:
  - 任城王拓跋澄
  endeavor_ref: guji-北魏孝文帝拓跋宏-endeavor-1
- id: guji-北魏孝文帝拓跋宏-event-改姓
  date: 496-02
  year_of: 496
  title_zh: 诏改拓跋氏为元氏，厘定姓族
  description: 太和二十年诏令改鲜卑复姓为汉姓，拓跋氏改称元氏，并禁胡语、服汉衣冠。
  endeavor_ref: guji-北魏孝文帝拓跋宏-endeavor-1
- id: guji-北魏孝文帝拓跋宏-event-太子事件
  date: 496-12
  year_of: 496
  title_zh: 废黜太子恂
  description: 太子元恂谋归平城、违背汉化改革，被废为庶人，后赐死。
  participants:
  - 元恂
  endeavor_ref: guji-北魏孝文帝拓跋宏-endeavor-1
- id: guji-北魏孝文帝拓跋宏-event-death
  date: 499-04-26
  year_of: 499
  title_zh: 南征途中病逝于谷塘原
  description: 太和二十三年，孝文帝第三次南征齐朝期间病逝，年三十三，谥孝文皇帝。
  endeavor_ref: guji-北魏孝文帝拓跋宏-endeavor-1
