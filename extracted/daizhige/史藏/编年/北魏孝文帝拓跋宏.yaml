person:
  qid: guji-北魏孝文帝拓跋宏
  name_zh: 北魏孝文帝拓跋宏
  names:
    zh: 拓跋宏、元宏
    en: Emperor Xiaowen of Northern Wei (Tuoba Hong)
  lifespan:
    birth:
      date: '467'
      precision: year
      is_circa: false
      raw: 皇兴元年
    death:
      date: 499-04-26
  birth_date: '467'
  death_date: 499-04-26
  era: 南北朝（北魏）
  reign_ref: 北魏太和年间
  archetype: 锐意汉化改革的北魏君主
  dilemmas:
  - 迁都洛阳与守旧鲜卑贵族的强烈反对
  - 汉化.setProperty与保持鲜卑旧俗之间的文化冲突
  lesson: 深刻的制度改革需以坚定的意志、渐进的谋划和对反对势力的权衡来推进。
  summary_first_person: 我乃北魏皇帝拓跋宏，后改汉姓为元宏。我亲政后力排众议迁都洛阳，推行均田制、禁胡服胡语、改汉姓、定姓族，使鲜卑与汉人加速融合，虽壮年而逝，却为南北一统埋下根基。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑
_list_note: 给定古文为《资治通鉴·周纪一》，未直接涉及拓跋宏生平，以下事件依据通鉴太和年间相关纪事及通行史实补足。
