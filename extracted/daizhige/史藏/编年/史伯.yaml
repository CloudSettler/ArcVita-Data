  - date: -774
    title_zh: 断言周存亡不出三稔，预言秦晋齐楚与荆楚必兴
    rationale: 依《泰誓》“民之所欲，天必从之”，弃和取同、宠信谗慝者必弊；申缯西戎方强，将合伐周。
events:
- id: guji-史伯-event-counsel-774
  person_qid: guji-史伯
  date: -774
  year_of: -774
  era_label: 周幽王八年
  title_zh: 对答郑桓公之问，论王室将卑、指划东迁之地
  description_zh: 郑桓公为司徒，惧王室之祸而问史伯。史伯陈天下形势，指虢、郐之间济、洛、河、颍之地可为，教以寄孥与贿之策；并论及荆楚、秦、齐、晋之将兴。
- id: guji-史伯-event-he-tong
  person_qid: guji-史伯
  date: -774
  year_of: -774
  era_label: 周幽王八年
  title_zh: 提出“和实生物，同则不继”之和同之辨
  description_zh: 史伯论周幽王去和而取同，以他平他谓之和，声一无听、物一无文、味一无果，断言殆于必弊，为中国思想史上和同之辨的开端。
- id: guji-史伯-event-result-773
  person_qid: guji-史伯
  date: -773
  year_of: -773
  era_label: 周幽王九年
  title_zh: 其谋落地，桓公东寄帑与贿
  description_zh: 郑桓公悦其言，乃东寄帑与贿，虢、郐受之，十邑皆有寄地；次年东徙其民洛东，虢、郐果献十邑，竟国之。
