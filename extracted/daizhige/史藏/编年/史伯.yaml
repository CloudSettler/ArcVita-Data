  dilemmas:
  - 周室将衰，何以避祸存身
  - 如何以“和而不同”之道判断兴亡大势
  lesson: 和实生物，同则不继；能审时度势者，可于乱世中谋得长久之地。
  summary_first_person: 我是西周末年周的太史，幽王八年郑桓公为司徒时问计于我。我断言王室将卑、戎狄必昌，指点他寄孥与贿于虢、郐之间，东徙立国；又预言芈姓之楚、嬴姓之秦、姜姓之齐、晋之后皆将兴起。我以“和实生物，同则不继”论周之必弊，后世视为和同之辨的开山之言。
  source_urls:
  - 国语·郑语
  - 史记·郑世家
