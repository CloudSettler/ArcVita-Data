  title_zh: 史弥远生
  description_zh: 南宋权相史弥远生（字同叔，明州鄞县人，史浩之子；据通行史传补）。
  type: life
- id: guji-史弥远-event-jinshi
  date: 1187
  precision: year
  is_circa: true
  year_of: 1187
  title_zh: 登进士第
  description_zh: 淳熙十四年登进士第，后渐跻禁从，至开禧间已预近密（据通行史传补）。
  type: life
- id: guji-史弥远-event-zhu-han
  date: 1207-11
  precision: month
  is_circa: false
  year_of: 1207
  title_zh: 建策收诛韩侂胄
  description_zh: 开禧三年十一月，除侂胄之议建于史弥远；遂与杨后定谋，命殿前司中军统制夏震选兵三百收侂胄，别选兵二百守其府门，执而诛之。时论讥其多烦禁旅、俨如敌国，而弥远由此柄政。
  type: endeavor
  endeavor_id: guji-史弥远-endeavor-1
  quote_zh: 除侂胄之议建于史弥逺
- id: guji-史弥远-event-jiading-heyi
  date: 1208
  precision: year
  is_circa: true
  year_of: 1208
  title_zh: 嘉定和议成，独相柄国
  description_zh: 嘉定元年宋金和议成，增币以弥兵；弥远由是独相，擅权用事、专任佥壬，时人谓之史丞相，论者以为奸恶几与侂胄无异。真德秀上疏警以宴安鸩毒之祸。
  type: endeavor
  endeavor_id: guji-史弥远-endeavor-1
  quote_zh: 愿以通和讲好为权宜以修徳行仁为实务
- id: guji-史弥远-event-bingyilang
  date: 1221-06
  precision: month
  is_circa: true
  year_of: 1221
  title_zh: 与莒补秉义郎
  description_zh: 嘉定十四年六月乙亥，宗室子与莒（即后来之理宗）补秉义郎；此为弥远属意沂邸、阴植定策之发端。
  type: endeavor
  endeavor_id: guji-史弥远-endeavor-2
  quote_zh: 嘉定十四年六月乙亥与莒补秉义郎其目云即理宗皇帝
- id: guji-史弥远-event-feili
  date: 1224-09
  precision: month
  is_circa: true
  year_of: 1224
  title_zh: 废立济王、拥立理宗
  description_zh: 嘉定十七年闰八月宁宗崩，弥远定策：废皇子竑为济王出居，迎立沂邸赵昀即位（理宗）。《两朝纲目备要》于此废立事略而不书，而弥远营家庙、求起复则一一大书于简。
  type: endeavor
  endeavor_id: guji-史弥远-endeavor-2
  quote_zh: 惟于史弥逺废立济王事畧而不书……然弥逺之营家庙求起复一一大书于简
- id: guji-史弥远-event-death
  date: 1233-10
  precision: month
  is_circa: true
  year_of: 1233
  title_zh: 薨于相位
  description_zh: 绍定六年十月，弥远薨于相位，柄国凡二十余年；逾年理宗亲政，时论始伸其废立之非。
  type: life
