person:
  qid: guji-史弥远
  name_zh: 史弥远
  names:
    zh: 史弥远
    en: Shi Miyuan
  lifespan:
    birth:
      date: 1164
      precision: year
      is_circa: true
      raw: 宋孝宗隆兴二年（约1164）
    death:
      date: 1233
      precision: year
      is_circa: false
      raw: 宋理宗绍定六年十月（1233）
  birth_date: 1164
  death_date: 1233-10
  era: 南宋
  reign_ref: 宋宁宗嘉定至宋理宗绍定（约1207至1233年独相柄政）
  archetype: 擅权定策之权相
  dilemmas:
  - 建策诛侂胄以靖难，而收捕之际禁旅俨如敌国，过用兵威之讥
  - 主嘉定和议增币弥兵，而西山一疏警以宴安鸩毒、忘战必危
  - 宁宗晏驾定策拥立，而废济王竑立沂邸昀，擅废储贰亏宗法大义
  lesson: 除恶者不鉴其覆辙，则擅权专任之奸几与前人无异；盟好既成而志气愈惰，祸每伏于宴安鸩毒之间。
  summary_first_person: 我史弥远，建除韩侂胄之议，收诛之后登相位，主嘉定和议以息兵；柄国日久，专任佥壬，时论谓奸恶几侔侂胄。宁宗晏驾，我属意沂邸，废济王而立昀（理宗），营家庙、求起复皆大书于史。身后是非，听之世人。
  source_urls:
  - https://zh.wikisource.org/wiki/兩朝綱目備要
  - https://zh.wikipedia.org/wiki/史弥远
endeavors:
- id: guji-史弥远-endeavor-1
  name_zh: 建策诛韩与嘉定和议
  description: 开禧之末，韩侂胄窃权挑金、师老财殚；除侂胄之议建于史弥远，遂与杨后定谋，命殿前司夏震收而诛之。既而主盟嘉定和议，增币以弥兵，然真德秀一疏警其宴安忘战之虞。
  phases:
  - key: brewing
    name_zh: 密建除侂胄之议
    labels:
      zh:
      - 除侂胄之议建于史弥逺
      - 奥援杨后
    start_date: 1207
    highlight_event_id: guji-史弥远-event-zhu-han
  - key: breakthrough
    name_zh: 收诛侂胄
    labels:
      zh:
      - 禁军收捕
      - 俨如敌国之讥
    start_date: 1207-11
    highlight_event_id: guji-史弥远-event-zhu-han
  - key: climax
    name_zh: 主盟嘉定和议
    labels:
      zh:
      - 增币弥兵
      - 伯侄之国
    start_date: 1208
    highlight_event_id: guji-史弥远-event-jiading-heyi
  - key: closure
    name_zh: 西山一疏之诫
    labels:
      zh:
      - 宴安鸩毒
      - 权宜通和
    start_date: 1208
    highlight_event_id: guji-史弥远-event-jiading-heyi
  decisions:
  - date: 1207-11
    title_zh: 建策诛韩侂胄
    rationale: 侂胄窃权专命、挑金致败，罪当执诛；弥远建议，命殿前司中军统制夏震选兵三百收之，别选兵二百守其府门，执而诛之，遂由此柄政。
  - date: 1208
    title_zh: 成嘉定和议
    rationale: 兵连财殚，力难再举，以通和讲好为权宜；然如真德秀疏言，恐盟好既成志气愈惰，宴安鸩毒之祸作，修德行仁、搜讨军实乃实务。
- id: guji-史弥远-endeavor-2
  name_zh: 独相擅权与定策废立
  description: 弥远柄政，擅权用事、专任佥壬，时论谓其奸恶几与侂胄无异；先属意沂邸子昀（与莒），宁宗晏驾遂废济王竑而立昀，是为理宗。其营家庙、求起复，史皆大书于简。
  phases:
  - key: brewing
    name_zh: 专任佥壬·擅权用事
    labels:
      zh:
      - 史丞相
      - 奸恶几侔侂胄
    start_date: 1208
    highlight_event_id: guji-史弥远-event-jiading-heyi
  - key: breakthrough
    name_zh: 属意沂邸
    labels:
      zh:
      - 与莒补秉义郎
      - 阴植定策
    start_date: 1221-06
    highlight_event_id: guji-史弥远-event-bingyilang
  - key: climax
    name_zh: 废立济王·拥立理宗
    labels:
      zh:
      - 定策之臣
      - 擅废储贰
    start_date: 1224-09
    highlight_event_id: guji-史弥远-event-feili
  - key: closure
    name_zh: 营家庙求起复·终相绍定
    labels:
      zh:
      - 大书于简
      - 柄国终身
    start_date: 1225
    highlight_event_id: guji-史弥远-event-death
  decisions:
  - date: 1221-06
    title_zh: 拔沂邸子昀于宫班（与莒补秉义郎）
    rationale: 宁宗储位久虚，弥远属意沂邸之与莒，拔之宫班以为定策之本，阴植储贰以固己权。
  - date: 1224-09
    title_zh: 废竑立昀，定策拥立理宗
    rationale: 宁宗晏驾，济王竑素与弥远忤，恐其立则祸及己；遂定策沂邸、贬竑为济王出居，迎立赵昀。《两朝纲目备要》于此废立事略而不书，而营家庙求起复则一一书之。
events:
- id: guji-史弥远-event-birth
  date: 1164
  precision: year
  is_circa: true
