  archetype: 平乱靖国之臣
  dilemmas:
  - 白公胜作乱、楚子被执，是否起兵勤王
  - 身兼叶地尹官与朝中重臣，勤王后亟须还政去位
  lesson: 临危讨逆、功成不居，迎君复位而退返封地。
  summary_first_person: 我乃沈诸梁，受封于叶，故世称叶公。鲁哀公十六年，白公胜作乱于楚，杀令尹、司马，执楚惠王。我率方城之外之人入讨，诛杀公孙胜，迎楚子复位，安定社稷；其后又领兵伐东夷，与三夷男女会盟于敖，为楚国靖边立功。
