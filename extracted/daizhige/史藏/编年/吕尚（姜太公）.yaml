      raw: 生卒年不详
  birth_date: 约公元前1150年
  death_date: 约公元前1010年
  era: 商末周初
  reign_ref: 周文王、周武王时期
  archetype: 开国谋臣
  dilemmas:
  - 年老未遇明主，隐居渭水滨垂钓以待时机
  - 辅佐翦商大业须隐忍蓄势二十年
  - 受封建齐，面对东夷新附之地之治理
  lesson: 韬光养晦，待时而动；大器晚成者可以兴邦。
  summary_first_person: 我本是商末长于谋略而困顿不得志之人，垂钓渭水以候天命。周文王访贤于渭滨，与我语而大悦，号曰太公望，迎我为师。我佐文王修德备武，翦商羽翼；又佐武王于牧野之战灭商。受封于齐营丘，通鱼盐之利，因俗简礼，齐国由是大兴。我一生以蹈略著称，为周初开国与齐国始封之祖。
  source_urls:
  - https://zh.wikipedia.org/wiki/姜太公
