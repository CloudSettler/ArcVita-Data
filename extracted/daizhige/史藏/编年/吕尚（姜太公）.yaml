person:
  qid: guji-吕尚
  name_zh: 吕尚（姜太公）
  names:
    zh: 吕尚
    en: Lü Shang
  lifespan:
    birth:
      date: '-1150'
      precision: year
      is_circa: true
      raw: 生卒年不详
    death:
      date: '-1010'
      precision: year
