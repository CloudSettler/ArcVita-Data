events:
- id: guji-吕尚-event-birth
  date: 约-1150
  year_of: -1150
  type: birth
  title_zh: 吕尚出生
  description: 吕尚（姜太公）约生于商末，姜姓吕氏，后世多称姜子牙、太公望。
- id: guji-吕尚-event-fishing
  date: 约-1075
  year_of: -1075
  type: endeavor
  title_zh: 垂钓于渭水之滨
  description: 吕尚年老未遇，隐居渭滨垂钓，等待明主，时人语曰“太公钓于渭阳”。
- id: guji-吕尚-event-wenwang
  date: 约-1060
  year_of: -1060
  type: endeavor
  title_zh: 文王渭滨遇得太公望
  description: 周文出猎于渭阳，遇 吕尚，与之语而大悦，曰“吾太公望子久矣”，因号太公望，载归立为师。
- id: guji-吕尚-event-muye
  date: -1046
  year_of: -1046
  type: endeavor
  title_zh: 佐武王伐纣，战于牧野
  description: 吕尚为周师，佐武王誓于牧野，克灭殷商，周朝肇建。
- id: guji-吕尚-event-qi
  date: 约-1045
  year_of: -1045
  type: endeavor
  title_zh: 受封建齐于营丘
  description: 周初封功臣谋士，吕尚受封于齐之营丘，为齐国始封君。
- id: guji-吕尚-event-qizhi
  date: 约-1044
  year_of: -1044
  type: endeavor
  title_zh: 治齐通利，国势大兴
  description: 吕尚治齐，修政因俗简礼，通鱼盐之利，人民多归齐，齐为大国。
- id: guji-吕尚-event-death
  date: 约-1010
  year_of: -1010
  type: death
  title_zh: 吕尚卒
  description: 吕尚高龄而寿终，后世尊为兵家鼻祖、韬略之圣。
