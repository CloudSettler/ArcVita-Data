person:
  qid: guji-吕母
  name_zh: 吕母
  names:
    zh: 吕母
    en: Mother Lü
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 不详，西汉末琅邪人
    death:
      precision: unknown
      raw: 不详，天凤年间起义后卒
  era: 新莽末年
  reign_ref: 王莽新朝
  archetype: 复仇者与农民起义领袖
  dilemmas:
  - 散尽家财聚众复仇与守法安分之间的抉择
  - 报子仇杀县长后的伦理与法度冲突
  lesson: 蒙冤受屈者以恩义聚众、以信誓立威，可由个人复仇演变为时代风暴
  summary_first_person: 我是琅邪吕母。我的儿子被县令枉杀，我散尽数百金家产， Opener 备酒买兵，救助贫乏少年数年，感动众人助我复仇。我自称将军，聚众数百人，攻破县城，手杀县令，以其首祭子之墓。此后人心思乱，樊崇、逄安等相继起事，岁间众各数万，天下遂乱。
