events:
- id: guji-吕母-event-birth
  title_zh: 吕母生
  description: 西汉末琅邪人，家产数百金，因子为县长所杀而立志复仇。
- id: guji-吕母-event-plot
  title_zh: 治酒买兵结纳少年
  date: 12
  year_of: 14
  description: 吕母以数百金家产治酒、多买刀兵，见少年所乏而与之，如此数岁，财产单尽。
  endeavors_refs:
  - guji-吕母-endeavor-1
- id: guji-吕母-event-swear
  title_zh: 涕泣明志众皆许诺
  date: 15
  year_of: 17
  description: 少年欲偿母，母涕泣言所以相待非为求利，乃欲为子报怨；少年壮其志，感其恩，皆许诺。
  endeavors_refs:
  - guji-吕母-endeavor-1
- id: guji-吕母-event-revenge
  title_zh: 自号将军攻县长手杀之
  date: 15
  year_of: 17
  description: 吕母聚众数百人，自号将军，攻破县城，解免掾吏，手杀县长，以其首祭子墓。
  endeavors_refs:
  - guji-吕母-endeavor-2
- id: guji-吕母-event-death
  title_zh: 吕母卒
  description: 复仇之后事迹不见于史，其地樊崇等继而大起，赤眉之势成。
