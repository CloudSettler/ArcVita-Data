    en: King Wu of Zhou
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
  birth_date: ''
  death_date: ''
  era: 商末周初
  reign_ref: 周武王元年（商帝辛四十二年）
  archetype: 开国之君
  dilemmas:
  - 以臣伐君，是否伐纣
  - 克商后如何处置殷遗与武庚
  lesson: 顺天应人、慎待时机，伐罪吊民而后天下归心
  summary_first_person: 我是周武王姬发，文王之子。我受命继志，会八百诸侯于盟津而不轻发，待纣杀比干、囚箕子，方始伐殷，战于牧野，亲禽纣于南单之台。克商之后，我立武庚以守殷祀，命三监以监殷民，大封诸侯，迁九鼎于洛，作大武之乐，遂定天下，都于镐。
