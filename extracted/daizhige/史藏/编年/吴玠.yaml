  name_zh: 吴玠
  names:
    zh: 吴玠
    en: Wu Jie
  lifespan:
    birth:
      date: '1093'
      precision: year
      is_circa: true
      raw: 原文未载生年，据宋史本传补为绍圣间
    death:
      date: '1139'
      precision: year
      is_circa: false
      raw: 原文未载卒年，据宋史本传补为绍兴九年卒于宣抚副使任
  birth_date: '1093'
  death_date: '1139'
  era: 南宋初建炎绍兴年间
  reign_ref: 宋高宗赵构
  archetype: 扼险抗金之川陕守御名将
  dilemmas:
  - 富平新败五路瓦解，孤军扼蜀口则粮饷不继，弃险而退则三川震动
  - 受张浚仓卒拔擢之恩，须以再战之功自明，不负知遇而立于败军之后
  lesson: 扼险蓄锐，与士卒同甘苦，则众寡强弱之势可转
  summary_first_person: 我本泾原行伍，以都监戍边。建炎间张浚宣抚川陕，至秦州置司节制五路，参谋军事刘子羽荐我军前，浚与语大悦，即擢我为统制官，又使弟璘领帐前亲兵。此后我扼守和尚原、仙人关，力拒金人入蜀之冲，终身于川陕宣抚副使任上。
  source_urls:
  - https://zh.wikisource.org/wiki/中興小紀/卷008
