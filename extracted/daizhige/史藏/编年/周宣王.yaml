person:
  qid: guji-周宣王
  name_zh: 周宣王
  names:
    zh: 周宣王
    en: King Xuan of Zhou
  lifespan:
    birth:
      date: -827
      precision: year
      is_circa: true
      raw: 宣王元年甲戌春正月王即位
  birth_date: -827
  death_date: -782
  era: 西周
  reign_ref: 宣王元年甲戌至四十六年（约前827—前782）在位四十六年
  archetype: 中兴之主
  dilemmas:
  - 厉王流彘之后拨乱中兴，复文武成康之政，然晚年师败于戎、诸侯不睦
  - 废长立少导致鲁国内乱（立鲁世子戏，致使伯御弑君）
  - 丧南国之师后料民于太原，违仲山甫之谏
  lesson: 宣王承厉王之烈，内有拨乱之志，遇灾而惧，中兴周室；然大旱祈禳、偏听杀杜伯、千亩之败，皆见王德渐衰、盛极难继之戒。
  summary_first_person: 厉王死于彘后，周公召公立我为王。即位之初，二相辅政，修文武成康之遗风，复田赋、作戎车，命尹吉甫北伐玁狁、方叔南征荆蛮、召穆公平淮夷，诸侯复宗周，女有中兴之名。然我晚岁师败于千亩、杀杜伯招祟，料民违谏，王政终衰。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=960781 竹书统笺卷九
