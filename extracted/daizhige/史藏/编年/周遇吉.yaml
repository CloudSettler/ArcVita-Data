    death:
      date: 1644
      precision: year
      is_circa: false
      raw: 崇祯十七年（1644），李自成破宁武关时力战死之
  birth_date: ''
  death_date: 1644
  era: 明末（崇祯年间）
  reign_ref: 崇祯
  archetype: 殉国武将
  dilemmas:
  - 山关尽破、孤城援绝，是战死以全忠节，还是降贼求生
  lesson: 孤城力拒、骂贼殉节，虽败犹挫敌胆；忠武之名，千载凛然
  summary_first_person: 我周遇吉以总兵驻代州，凭城固守；粮尽退守宁武关。闯贼大军压境，我发大炮杀贼万计，设伏诱敌复杀数千。城破之日，我徒步巷战，手刃数十人，身中集矢如猬，被执骂贼而死；妻刘氏率妇女登屋射贼，阖家俱焚，城中士民无一降者。
