person:
  qid: guji-女娲
  name_zh: 女娲
  names:
    zh: 女娲
    en: Nüwa
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 上古传说时代，包牺氏之后
    death:
      date: ''
      precision: unknown
      is_circa: true
  era: 上古三皇时代
  reign_ref: 女皇元年辛未
  archetype: 补天造人、整顿天地秩序的创世女帝
  dilemmas:
  - 四极废、九州裂，天倾地陷，苍生罹难，她以己身之力补天治水，承担秩序重建之重责
  - 代替包牺氏王天下，是继承旧制还是开创女帝新统
  lesson: 当天崩地裂、秩序崩坏之际，以坚韧与创造精神补天济世，使苍生各安其性
  summary_first_person: 我是女娲，风姓，蛇身人首，继包牺氏而立，号为女帝。当是时四极废、九州裂，我炼五色石以补苍天，断鳌足以立四极，杀黑龙以济冀州，积芦灰以止淫水，又作笙簧、制婚姻之礼。虽然承包牺之制无所革造，但在位一百三十年，天下苍生得以安居。
