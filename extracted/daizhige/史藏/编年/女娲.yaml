  title_zh: 女娲生于上古传说之世
  description: 风姓，蛇身人首，系包牺氏（伏羲）同族传说时代之女帝。
- id: guji-女娲-event-reign-start
  date: -2700
  year_of: -2700
  type: office
  title_zh: 包牺氏没，女娲氏代立，号女帝
  description: 是为女皇，元年辛未，在位一百三十年。
- id: guji-女娲-event-repair-sky
  date: -2650
  year_of: -2650
  type: achievement
  title_zh: 炼五色石补苍天，断鳌足立四极
  description: 时四极废、九州裂，天不兼覆，地不周载，火爁炎而不灭；女娲炼五色石以补苍天，断鳌足以立四极。
- id: guji-女娲-event-stop-flood
  date: -2648
  year_of: -2648
  type: achievement
  title_zh: 杀黑龙、积芦灰以止淫水
  description: 杀黑龙以济冀州，积芦灰以止淫水；天不足西北故日月移焉，地不足东南故百川注焉。
- id: guji-女娲-event-culture
  date: -2645
  year_of: -2645
  type: achievement
  title_zh: 作笙簧、正婚姻
  description: 作笙簧，张云幕而枚占神明，定嫁娶人伦，苍天补、四极正、狡虫死，民生得安。
- id: guji-女娲-event-death
  date: -2570
  year_of: -2570
  type: death
  title_zh: 女娲在位一百三十年而终
  description: 在位百三十年，公元前二五七〇年前后（传说年代，只具纪年意义）。
