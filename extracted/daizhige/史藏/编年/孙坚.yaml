  - 越境讨贼：零陵贼寇长沙，坚任长沙太守而越境寻讨，虽违常制而成三郡肃然之功
  - 乱世立功与不邀私赏之间求军功进身，与傅燮「有功不论，时也」的操守形成对照
  lesson: 贼起于邻郡而不以境为限，果断进讨者建功受封。
