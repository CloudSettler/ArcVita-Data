  decisions:
  - date: '0340'
    title_zh: 出任长沙太守，居官不营财产
    rationale: 家贫而清介自守，不以禄位殖货，士林以此重之。
  - date: '0370'
    title_zh: 拒诸子泣请，不改枋头直笔
    rationale: 史官之职在直书实录，讳败媚权则信史亡矣，宁触权怒而不易一字。
- id: guji-孙盛-endeavor-2
  title_zh: 撰《晋阳秋》
  summary: 撰晋代编年史《晋阳秋》，词直理正，为世称良史；因直书桓温枋头之败几遭门祸，密藏定本于外以存其真。
  phases:
  - key: brewing
    name_zh: 积学储材
    labels:
