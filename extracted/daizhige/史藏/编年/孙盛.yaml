      - 直笔
    start_date: 0369-09
    highlight_event_id: guji-孙盛-event-fangtou
  - key: climax
    name_zh: 拒改史稿、密藏定本
    labels:
      zh:
      - 门祸之危
      - 信史
    start_date: '0370'
    highlight_event_id: guji-孙盛-event-defend
  - key: closure
    name_zh: 书成传世
    labels:
      zh:
      - 辑本存世
      - 词直理正
    start_date: '0373'
    highlight_event_id: guji-孙盛-event-death
  decisions:
  - date: 0369-09
    title_zh: 直书桓温枋头之败于《晋阳秋》
    rationale: 枋头丧师，天下共见，史笔不可为权臣讳。
  - date: '0370'
    title_zh: 怒拒诸子改稿之请，另藏定本于外
    rationale: 桓温谓诸子'若此史遂行，自是关君门户事'，我知祸在旦夕，然史稿一字不可易，惟密藏定本以存真相。
events:
- id: guji-孙盛-event-birth
  date: '0302'
  year_of: 302
  title_zh: 孙盛生（约）
  description: 约西晋末东晋初年生，后以博学、善言名理知名于世。
- id: guji-孙盛-event-appoint
  date: '0325'
  year_of: 325
  title_zh: 起家佐著作郎（约）
  description: 以博学善言名理为时所重，起家佐著作郎，由此踏入仕途与史学之门。
- id: guji-孙盛-event-merit
  date: 0329
  year_of: 329
  title_zh: 从讨苏峻之乱以功封侯（约）
  description: 苏峻之乱平定，孙盛以军功进爵封侯，声誉渐起。
- id: guji-孙盛-event-changsha
  date: '0340'
  year_of: 340
  title_zh: 出任长沙太守（约）
  description: 出为长沙太守，居官清介，家贫不营财产，累迁至秘书监，加给事中。
- id: guji-孙盛-event-fangtou
  date: 0369-09
  year_of: 369
  title_zh: 直书桓温枋头之败
  description: 太和四年桓温北伐败于枋头，孙盛于所撰《晋阳秋》中直书其败，词直理正，桓温见之大怒。
- id: guji-孙盛-event-defend
  date: '0370'
  year_of: 370
  title_zh: 拒改史稿，密藏定本（约）
  description: 桓温威胁孙氏诸子，诸子号泣叩头请改，孙盛大怒不许；为存信史，乃别录定本密藏于外，诸子私改者非其真。
- id: guji-孙盛-event-death
  date: '0373'
  year_of: 373
  title_zh: 孙盛卒（约）
  description: 约东晋宁康元年卒于官，年逾七十；《晋阳秋》辑本存世，以直笔良史之名传后世。
