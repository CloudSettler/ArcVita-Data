person:
  qid: guji-孙盛
  name_zh: 孙盛
  names:
    zh: 孙盛
    en: Sun Sheng
  lifespan:
    birth:
      date: '0302'
      precision: year
      is_circa: true
      raw: 约西晋末东晋初年生，一说约302年
    death:
      date: '0373'
      precision: year
      is_circa: true
      raw: 约东晋宁康元年（约373年）卒
  birth_date: 约302年
  death_date: 约373年
  era: 东晋
  reign_ref: 东晋元帝至孝武帝之世
  archetype: 秉笔直书的良史与清介能臣
  dilemmas:
  - 直书桓温枋头之败则祸及满门，曲笔讳败则辱没史德
  - 诸子叩头泣请改稿与史官信条之间的亲情冲突
  - 处权臣威势之下，守正直书与保全家性命难以两全
  lesson: 秉笔直书，不避权势；宁以死守真，不以史笔媚人。
  summary_first_person: 我是孙盛，字安国，东晋史家。我以博学善言名理起家著作郎，历佐陶侃、庾亮、桓温，从平苏峻之乱以功封侯，累迁至秘书监加给事中，居官清介。晚年撰《晋阳秋》，词直理正。桓温枋头兵败，我直书其事，温怒而胁我子孙，诸子泣请改稿，我怒不许，乃别藏定本于外以存信史。史笔如铁，虽千万人吾不改一字。
  source_urls:
  - https://zh.wikipedia.org/wiki/孙盛
  - https://www.zhsqdata.com/ 众家编年体晋史目录（本篇辑本所据）
