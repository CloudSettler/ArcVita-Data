person:
  qid: guji-宋徽宗
  name_zh: 宋徽宗
  names:
    zh: 宋徽宗
    en: Emperor Huizong of Song
  lifespan:
    birth:
      date: '1082'
      precision: year
      is_circa: false
      raw: 元丰五年
    death:
      date: '1135'
      precision: year
      is_circa: true
      raw: 绍兴五年
  birth_date: '1082'
  death_date: '1135'
  era: 北宋
  reign_ref: 宣和年间
  archetype: 昏於质疑、怠于军政的艺术家君主
  dilemmas:
  - 面对张瑴叛金来附，须在天金盟誓与纳土诱惑之间抉择，御笔定「坐观其变、以为后图」之策
  - 燕山凯还后对童贯、蔡攸「始甚不乐」，赏薄而喜其进献羡馀，恩威失据
  lesson: 当君主以喜怒privacy与侥幸之心决策军国大事，权臣的欺罔与边衅的祸端便由此而生。
  summary_first_person: 我是宋徽宗。宣和年间收燕之后，张瑴以平州叛金来附，我下令羁縻观望，许其世袭，却不敢明盟；旋即诏毁苏轼、司马光文集板，禁元祐学术；又因童贯、蔡攸班师失我之意而薄其赏，转以谭稹代镇河北，终致宋金生衅。
  source_urls:
  - https://zh.wikisource.org/wiki/續資治通鑑長編拾補
endeavors:
- id: guji-宋徽宗-endeavor-1
  name_zh: 收复燕山与经营平州
  phases:
  - key: breakthrough
    name_zh: 燕京告捷
    labels:
      zh:
      - 宣功燕山
      - 凯还受贺
    start_date: '1123-04-28'
    highlight_event_id: guji-宋徽宗-event-kaihuan
  - key: climax
    name_zh: 平州招纳
    labels:
      zh:
      - 羁縻张瑴
      - 许以世袭
    start_date: 1123-06
    highlight_event_id: guji-宋徽宗-event-zhangujh
  - key: closure
    name_zh: 衅端渐起
    labels:
      zh:
      - 坐观其变
      - 金人索瑴
    start_date: 1123-07
    highlight_event_id: guji-宋徽宗-event-tanzhen
  decisions:
  - date: '1123-06-02'
    title_zh: 御笔付詹度令察张瑴去就
    rationale: 以卞庄刺虎之计坐观其变，不敢首违与金誓书，又虑张瑴结连四军窥燕，故预加抚谕而秘不示约
  - date: 1123-06
    title_zh: 降诏付詹度多方恤存归燕之民
    rationale: 闻燕民得归，欲收人心以促张瑴纳款，与免三年常赋
  - date: '1123-07-07'
    title_zh: 以谭稹代童贯镇抚河北诸路
    rationale: 童贯、蔡攸归自燕山颇失上意，王黼、梁师成共荐谭稹，使交割山后云中之地
- id: guji-宋徽宗-endeavor-2
  name_zh: 禁绝元祐学术
  phases:
  - key: climax
    name_zh: 诏毁苏司马文集
    labels:
      zh:
      - 毁板焚书
      - 申禁学术
    start_date: 1123-07
    highlight_event_id: guji-宋徽宗-event-huiban
  decisions:
  - date: 1123-07
    title_zh: 诏毁苏轼、司马光文集板
    rationale: 因福建印造二人文集，令今后举人传习元祐学术者以违诏论，翌年又申禁之
events:
- id: guji-宋徽宗-event-birth
  date: '1082'
  year_of: 1082
  title_zh: 宋徽宗赵佶出生
  labels:
    zh:
    - 出生
  description: 赵佶生，后为北宋第八位皇帝。
- id: guji-宋徽宗-event-kaihuan
  date: '1123-05-29'
  year_of: 1123
  title_zh: 童贯、蔡攸班师凯旋至京师
  labels:
    zh:
    - 受贺
    - 御景龙门观奏凯
  description: 二帅四月二十八日自燕山班师，至是告功于庙；上始甚不乐，故二帅赏皆薄，贯遂致仕，攸拜枢密；既进大珠黄金，上喜之。
- id: guji-宋徽宗-event-zhangujh
  date: '1123-06-05'
  year_of: 1123
  title_zh: 张瑴以平、营、滦三州纳款归宋
  labels:
    zh:
    - 纳土归朝
    - 授世袭平州
  description: 张瑴杀左企弓等，称保大三年，遣人诣宣抚司纳土；宋许其节度世袭平州，詹度不敢受而密奏，朝廷决定羁縻招纳。
- id: guji-宋徽宗-event-huiban
  date: 1123-07
  year_of: 1123
  title_zh: 诏毁苏轼、司马光文集板并禁元祐学术
  labels:
    zh:
    - 毁板
    - 学禁
  description: 中书省言福建印造苏轼、司马光文集，诏令毁板，今后传习元祐学术者以违制论；卫所禁愈严而传愈多。
- id: guji-宋徽宗-event-tanzhen
  date: '1123-07-07'
  year_of: 1123
  title_zh: 授谭稹检校少保、燕山府路兼河北路宣抚使
  labels:
    zh:
    - 代童贯
    - 经营山后
  description: 童贯致仕，谭稹兼治三路，至太原经营山后，招朔、应、蔚三州降人号朔宁军。
- id: guji-宋徽宗-event-death
  date: '1135'
  year_of: 1135
  title_zh: 宋徽宗崩
  labels:
    zh:
    - 去世
  description: 靖康之变被俘北迁后，卒于五国城。
