  reign_ref: 熙宁、元丰
  archetype: 锐意变法的改革君主
  dilemmas:
  - 新政推行与朝臣阻力（如王陶弹劾韩琦、吴奎封还诏书）之间的君权权衡
  - 追求富国强兵与爱护大臣体面之间的取舍
  lesson: 改革须刚断与安抚并用，威令既行亦当惜大臣大体
  summary_first_person: 我以冲龄嗣位，锐意更张，初政即手诏罢四方繁贡，裁抑宰执之专，用安石诸臣推行熙宁新法，以图富国强兵，虽朝议纷纭，未尝改志。
  source_urls:
