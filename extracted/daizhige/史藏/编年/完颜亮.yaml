  era: 金代
  reign_ref: 金主（海陵王）
  archetype: 雄猜之主
  dilemmas:
  - 欲迁都南向以图宋，又恐渝盟失信于国
  - 屯兵宿亳以威江南，然边衅一动则两国俱伤
  lesson: 穷兵黩武、背盟启衅者，虽盛极一时终致祸败
  summary_first_person: 朕为金国之主，尝率文武群臣巡幸汝洛，登北邙山而改其名曰太平；又议移居汴京，屯兵宿亳之间，积粟发兵，意在南寇。宋人闻之，遣使窥探，边备遂兴。朕之志在一统，然轻启战端，终不免身败名裂。
  source_urls:
  - https://zh.wikisource.org/wiki/建炎以来系年要录
