  year_of: '1122'
  name_zh: 完颜亮出生
  description: 完颜亮生，后为金国国主。
- id: guji-完颜亮-event-move
  date: 1161-04
  year_of: 1161-04
  name_zh: 金主亮谋迁都于汴
  description: 宋廷闻金主欲移居于汴，且屯兵宿亳之间，乃议遣周麟之奉使称贺金主迁都。
- id: guji-完颜亮-event-tool
  date: 1161-04
  year_of: 1161-04
  name_zh: 金主亮率群臣如汝洛
  description: 是月，金主亮率文武群臣如汝洛，至北邙山，因改其山曰太平。
- id: guji-完颜亮-event-march
  date: 1161-05
  year_of: 1161-05
  name_zh: 金主亮积粟发兵意在南寇
  description: 张阐言完颜亮积粟发兵，意在南寇，乞守要害，防海道巴蜀淮襄；金使王全于宋殿上传金主意欲割地索人，北使悖语，宋廷议调兵守江淮。
- id: guji-完颜亮-event-death
  date: '1161'
  year_of: '1161'
  name_zh: 完颜亮卒
  description: 完颜亮南侵兵败身死。
