  lesson: 至公无私、以天下为公，为后世禅让典范
  summary_first_person: 我名尧，帝喾之后，元丙子即天子位，在位一百年。我命羲和历象日月星辰，敬授民时；遭洪水之患，询四岳求治水者，用鲧而九年无功；晚年以天下授舜，禅让而去。
