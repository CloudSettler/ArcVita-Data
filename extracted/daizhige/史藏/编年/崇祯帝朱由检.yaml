  archetype: 亡国之君·励精图治而刚愎多疑
  dilemmas:
  - 求治太急而人事偾败，内帑空虚与流贼内乱交迫
  - 果于诛赏，多疑易置将相，终致国事不可为
  lesson: 志在拨乱而无用人之量与持久之策，急切与猜疑反加速倾覆
  summary_first_person: 我承神宗、熹宗之敝，慨然有拨乱之志，诛客魏、撤镇守内臣；然求治太急、果于诛赏，先后易置宰相近五十人，终至流贼破京，以身殉国。
