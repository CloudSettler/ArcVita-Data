  date: -1976
  year_of: -1976
  name_zh: 武观以西河叛，彭伯寿征而归之
  summary_zh: 十五年，武观以西河叛，彭伯寿帅师征西河，武观来归。
- id: guji-di-qi-event-death
  date: -1975
  year_of: -1975
  event: death
  name_zh: 帝启陟
  summary_zh: 十六年，帝陟。夏后继位之局由此传于太康。
