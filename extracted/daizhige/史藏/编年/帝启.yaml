  date: -1983
  year_of: -1983
  name_zh: 帝使孟涂如巴莅讼
  summary_zh: 八年，遣孟涂至巴地主持听讼之事。
- id: guji-di-qi-event-dance-jiushao
  date: -1981
  year_of: -1981
  name_zh: 巡狩舞九韶于大穆之野
  summary_zh: 十年，帝巡狩，于大穆之野舞《九韶》，示礼乐于四方。
- id: guji-di-qi-event-wuguan-exile
  date: -1980
  year_of: -1980
  name_zh: 放武观于西河
  summary_zh: 十一年，放王季子武观于西河（观国，今顿丘卫县）。
