person:
  qid: guji-di-qi
  name_zh: 帝启
  names:
    zh: 帝启
    en: Qi of Xia
  lifespan:
    birth:
      date: -2100
      precision: year
      is_circa: true
      raw: 生年无考
    death:
      date: -1990
      precision: year
      is_circa: true
  birth_date: 约 -2100
  death_date: 约 -1990
  era: 夏朝（初世）
  reign_ref: 元年癸亥即位于夏邑，在位十六年
  archetype: 世袭王权开创者
  dilemmas:
  - 伯益辅政惯例与父死子继新制的冲突
  - 有扈氏不服，需以武力确立王权
  - 亲子武观西河叛乱，骨肉与国法两难
  lesson: 制度的初立往往不靠人心自然归附，而靠一场摊牌式的战争与对叛乱者的惩处来确立惯例。
  summary_first_person: 我是大禹之子启。禹崩，三年丧毕，天下不从伯益而归我，我便即位于夏邑，大飨诸侯于钧台，开启父死子继之局。费侯伯益出就其国；有扈氏不服，我帅师伐之，大战于甘而服天下。其后我放武观于西河，及武观叛，命彭伯寿征西河而受其来归。在位十六年而陟，夏之家天下自此始。
  source_urls:
  - 古文出处：《竹书纪年》（王国维辑校本）夏纪·帝启
