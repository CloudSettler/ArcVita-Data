  name_zh: 帝启生
  summary_zh: 生年史无明文，约当禹之壮年，母系及生地竹书未详。
- id: guji-di-qi-event-accession
  date: -1990
  year_of: -1990
  name_zh: 即位于夏邑，大飨诸侯于钧台
  summary_zh: 元年癸亥，帝即位于夏邑，于钧台大飨诸侯，诸侯复从帝归于冀都，大飨于璇台。
- id: guji-di-qi-event-yi-goes-state
  date: -1989
  year_of: -1989
  name_zh: 费侯伯益出就国
  summary_zh: 二年，禅让旧臣费侯伯益离朝廷出就封国，子继之制落定。
- id: guji-di-qi-event-gan-battle
  date: -1989
  year_of: -1989
  name_zh: 王帅师伐有扈，大战于甘
  summary_zh: 王亲帅六师伐有扈（在始平鄠县），大战于甘，有扈氏败服。
- id: guji-di-qi-event-yi-death
  date: -1985
  year_of: -1985
  name_zh: 伯益薨，祠之
