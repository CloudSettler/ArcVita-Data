  birth_date: -2181
  death_date: -2047
  era: 上古传说时代（五帝时期）
  reign_ref: 尧元年丙子，帝即位，居冀；在位百年
  archetype: 禅让圣王
  dilemmas:
  - 洪水滔天，屡易治水之臣而功不成
  - 亲子丹朱不肖，传子还是传贤
  - 禅位于舜后权位如何平稳交接
  lesson: 以天下为公，传贤不传子，方成千古禅让之范
  summary_first_person: 我生于丹陵，封于唐，高辛氏衰而天下归我。我即位居冀，命羲和历象，先后使共工、鲧治河不成，终举舜于畎亩，以二女妻之，历试诸难，最后禅以天下。我在位百年，陟于陶。
  source_urls:
  - 竹书纪年·卷上·帝尧陶唐氏
