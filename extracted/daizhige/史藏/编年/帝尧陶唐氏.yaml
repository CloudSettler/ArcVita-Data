      raw: 孕十四月而生尧于丹陵
    death:
      precision: year
      is_circa: true
      raw: 一百年，帝陟于陶
  era: 上古五帝时期
  reign_ref: 元年丙子，在位一百年
  archetype: 圣君禅让者
  dilemmas:
  - 洪水滔天，选贤治水——先命共工，再命鲧，鲧九载弗成而黜之
  - 帝位传承——不舍亲子丹朱，举侧陋虞舜而禅让天下
  lesson: 以天下为公，禅让不传子，惟贤是举
  summary_first_person: 吾帝尧陶唐氏，庆都感龙图赤龙之瑞，孕十四月而生吾于丹陵。吾封于唐，高辛氏衰，天下归吾。元年丙子，吾即位居冀，命羲和历象日月星辰，初巡狩四岳，初治兵，命共工治河，又命崇伯鲧治河九载而绩用弗成。在位七十年，吾使四岳锡虞舜命，得舜而禅以天下，凤凰在庭，景星出翼，龙马衔甲出《河图》。后舜受终于文祖，吾命二女嫔于舜，命司空禹治河。吾在位百年，帝陟于陶，天下归于舜。
  source_urls:
  - 古本竹书纪年·帝尧陶唐氏
