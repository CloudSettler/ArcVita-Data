  title_zh: 孕十四月生于丹陵
  description_zh: 母曰庆都，生于斗维之野，常有黄云覆其上。龙负图而至，其文要曰亦受天佑。既而阴风四合，赤龙感之，孕十四月而生尧于丹陵。
