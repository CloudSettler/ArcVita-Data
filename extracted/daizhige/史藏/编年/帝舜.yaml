events:
- id: guji-帝舜-event-birth
  date: '-2250'
  year_of: -2250
  title_zh: 生于姚墟
  event_type: birth
  summary_zh: 母曰握登，见大虹意感，而生舜于姚墟。目重瞳子，故名重华。
- id: guji-帝舜-event-overcoming
  date: '-2230'
  year_of: -2230
  title_zh: 焚廪填井之厄与耕于历山
  event_type: endeavor-general
  summary_zh: 舜父母憎舜，涂廪自下焚之，舜服鸟工衣飞去；浚井填石，舜服龙工衣自傍而出。耕于历，梦眉长与发等，遂登庸。
- id: guji-帝舜-event-xi-ming
  date: '-2107'
  year_of: -2107
  title_zh: 帝使四岳锡虞舜命
  event_type: endeavor-general
  summary_zh: 尧在位七十年春正月，使四岳锡虞舜命。
- id: guji-帝舜-event-zhi-nv
  date: '-2106'
  year_of: -2106
  title_zh: 帝命二女嫔于舜
  event_type: endeavor-general
  summary_zh: 尧七十一年，帝命二女嫔于舜。
- id: guji-帝舜-event-shou-zhong
  date: '-2104'
  year_of: -2104
  title_zh: 舜受终于文祖
  event_type: appointment
  summary_zh: 尧七十三年春正月，舜受终于文祖。七十四年，虞舜初巡狩四岳。
- id: guji-帝舜-event-en-throne-run
  date: '-2104'
  year_of: -2104
  title_zh: 遵河渚受《甲图》告命
  event_type: endeavor-general
  summary_zh: 尧洁斋修坛场于河洛，龙马衔《甲图》，检文曰闿色授帝舜，言虞、夏当受天命，藏于东序。
- id: guji-帝舜-event-en-throned
  date: '-2100'
  year_of: -2100
  title_zh: 舜即天子之位
  event_type: appointment
  summary_zh: 帝子丹朱避舜于房陵，舜让不克，朱封于房为虞宾。三年，舜即天子之位。元年己未，帝即位，居冀。
- id: guji-帝舜-event-dayao
  date: '-2100'
  year_of: -2100
  title_zh: 作大韶之乐
  event_type: endeavor-general
  summary_zh: 元年，作大韶之乐。《九韶》既奏，凤凰巢于庭，百兽率舞，景星出于房。
- id: guji-帝舜-event-xing-xing
  date: '-2097'
  year_of: -2097
  title_zh: 命皋陶作刑
  event_type: endeavor-general
  summary_zh: 三年，命皋陶作刑。
- id: guji-帝舜-event-xiwangmu
  date: '-2091'
  year_of: -2091
  title_zh: 西王母来朝献白环玉玦
  event_type: endeavor-general
  summary_zh: 九年，西王母来朝，献白环、玉玦。
- id: guji-帝舜-event-jian-yu
  date: '-2054'
  year_of: -2054
  title_zh: 卿云见，荐禹于天
  event_type: endeavor-general
  summary_zh: 十四年，卿云见，命禹代虞事。钟石笙管未罢而天大雷雨，舜持衡而笑，倡《卿云》之歌，乃荐禹于天，使行天子事。黄龙负图出坛，文言当禅禹。
- id: guji-帝舜-event-ming-yu
  date: '-2054'
  year_of: -2054
  title_zh: 命夏后总师、复九州、征有苗
  event_type: endeavor-general
  summary_zh: 三十二年帝命夏后总师，遂陟方岳；三十三年夏后受命于神宗，复九州；三十五年命夏后征有苗，有苗氏来朝。
- id: guji-帝舜-event-death
  date: '-2153'
  year_of: -2153
  title_zh: 帝陟于鸣条，葬苍梧
  event_type: death
  summary_zh: 四十九年帝居于鸣条，五十年帝陟。鸣条有苍梧之山，帝崩遂葬焉，今海州。
