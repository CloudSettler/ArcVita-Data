person:
  qid: guji-帝舜
  name_zh: 帝舜
  names:
    zh: 帝舜有虞氏
    en: Emperor Shun
  lifespan:
    birth:
      date: '-2250'
      precision: year
      is_circa: true
      raw: 见大虹意感，而生舜于姚墟（年代不可确考，设为约公元前23世纪）
    death:
      date: '-2153'
      precision: year
      is_circa: true
      raw: 五十年，帝陟（年代不可确考）
  birth_date: '-2250'
  death_date: '-2153'
  era: 上古五帝时期
  reign_ref: 帝舜有虞氏元年己未至五十年
  archetype: 受禅继治的圣君
  dilemmas:
  - 家庭迫害（父母憎舜，焚廪填井）与孝悌之道如何两全
  - 受尧禅让后如何对待避让的帝子丹朱
  - 晚年天示异象，是否禅位于禹
  lesson: 才德与担当足以胜天命坎坷，功成而不恋位，举贤自代方为大公。
  summary_first_person: 我生于姚墟，目有重瞳，故名重华。父母憎我，焚廪、填井欲害我，我以鸟工、龙工衣得脱，耕于历山。尧帝使我登庸，命二女嫔于我，终受终于文祖，即天子之位，居冀。我作大韶之乐，命皋陶作刑，西王母、息慎诸族来朝。在位十四年，卿云见而天大雷雨，我知天下非一人之天下，遂荐禹于天，使行天子事。后命夏后征有苗、复九州，居鸣条，五十年而陟，葬于苍梧之山。
  source_urls:
  - https://zh.wikisource.org/wiki/竹書紀年
