  decisions:
  - date: 1276-01-29
    title_zh: 挟益王、广王出嘉会门渡浙江
    rationale: 效靖康之鉴，不固守危城，觊建炎、绍兴中兴之福。
  - date: 1276
    title_zh: 不纳蒲寿庚请驻跸泉州，后纵之归、掠其海舶
    rationale: 不以海舶自随，致寿庚怒杀宗室淮兵而降元。
  - date: 1279
    title_zh: 厓山布一字阵而后断维夺港
    rationale: 奉宋主居阵中为死计，然未与君同溺，欲存赵氏之嗣自逭一朝夕。
events:
- id: guji-张世杰-event-escape
  person_id: guji-张世杰
  event_type: political_crisis_response
  title_zh: 张世杰等以益王昰、广王昺出奔
  description: 巴延军次皋亭山宋主奉玺以降之翌日，世杰与苏刘义等挟二王出嘉会门，渡浙江遁去；巴延遣阿喽罕、董文炳、范文虎追之不及。
  start_date: 1276-01-29
  year_of: 1276
  date_precision: day
- id: guji-张世杰-event-fuzhou
  person_id: guji-张世杰
  event_type: career_event
  title_zh: 益王即位福州，世杰拜枢密副使
  description: 世杰自定海与陈宜中、陆秀夫、苏刘义会于江心寺，奉益王昰即皇帝位，改元景炎，以世杰为枢密副使。
  start_date: 1276-05
  year_of: 1276
  date_precision: day
- id: guji-张世杰-event-attack-jiangxi
  person_id: guji-张世杰
  event_type: career_event
  title_zh: 与陈宜中等聚兵福建攻江西
  description: 时世杰与陈宜中等聚兵福建攻江西，元江西都元帅逊都岱奏乞援兵。
  start_date: 1276
  year_of: 1276
  date_precision: month
- id: guji-张世杰-event-quanzhou
  person_id: guji-张世杰
  event_type: career_event
  title_zh: 泉州颇用寿庚之请、掠其海舶，奉宋主趋潮
  description: 宋主舟泊泉州港，蒲寿庚请驻跸，张世杰不可；既而舟不足，掠其舟而没其赀，寿庚怒杀宗室及士大夫与淮兵在泉者，世杰遂奉宋主趋潮。
  start_date: 1276-11
  year_of: 1276
  date_precision: month
- id: guji-张世杰-event-yaishan
  person_id: guji-张世杰
  event_type: death
  title_zh: 厓山断维夺港，后大风覆舟而死
  description: 世杰于厓山布一字阵奉宋主居其间为死计，卒断维夺港而去，不与其君同溺；既葬杨太后，将之安南，瓣香之祝，大风覆舟而亡。
  start_date: 1279
  year_of: 1279
  date_precision: year
