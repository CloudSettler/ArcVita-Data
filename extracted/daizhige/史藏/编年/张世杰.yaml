    death:
      date: 1279
      precision: year
      is_circa: false
      raw: '1279'
  death_date: '1279'
  era: 宋末元初
  reign_ref: 宋端宗景炎、宋帝昺祥兴
  archetype: 忠节殉国之将
  dilemmas:
  - 厓山决战中断维夺港而去，未与宋主同溺，义利之际未能决断
  - 泉州留蒲寿庚否，酿其后之乱
  lesson: 忠臣末路，成败利钝之间最见心术；瓣香之祝，大风覆舟，天曲全其忠。
  summary_first_person: 我张世杰，宋末大将。临安将破，我与苏刘义等挟益王昰、广王昺出嘉会门渡浙江而遁；后奉益王即位于福州，拜枢密副使，聚兵福建图兴复。泉州我不用蒲寿庚之言，掠其海舶，寿庚怒而作乱。帝昺仄居厓山，我布一字阵奉主居中为死计，然卒断维夺港而去，未与君同溺。杨太后既葬，我将之安南，飓风覆舟而死，人谓瓣香之祝、大风覆舟，天所以曲全我之忠。
