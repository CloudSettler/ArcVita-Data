events:
- id: guji-张浚-event-birth
  title_zh: 张浚生于绵竹
  date: '1097'
  precision: year
  is_circa: true
  year_of: 1097
  description: 张浚生于绵竹（今四川绵竹），文中称浚绵竹人，感子也；生卒本篇未载，据史补。
  location: 绵竹
- id: guji-张浚-event-appointment
  title_zh: 自虞部郎官擢殿中侍御史
  date: 1127-07
  precision: month
  is_circa: true
  date_raw: 建炎元年七月丁未
  year_of: 1127
  description: 建炎元年七月丁未，以虞部郎官张浚为殿中侍御史；浚绵竹人，感子也。
  location: 行在
- id: guji-张浚-event-impeach-li-gang
  title_zh: 首论李纲专杀侍从之罪，纲遂罢相
  date: 1127-08
  precision: month
  is_circa: true
  date_raw: 建炎元年八月丁丑
  year_of: 1127
  description: 浚与宋齐愈素善，知齐愈死非其罪，谓上初立而李纲以私意杀侍从，典刑不当，恐失人心，于是首论纲罪；丁丑李纲罢为观文殿大学士提举洞霄宫，纲相凡七十五日。
  location: 行在
- id: guji-张浚-event-impeach-han-shizhong
  title_zh: 再论韩世忠师行无纪，夺其观察使
  date: 1127-10
  precision: month
  is_circa: true
  date_raw: 建炎元年十月己卯
  year_of: 1127
  description: 随驾后军至楚州宝应县作乱，逼逐左正言卢臣中坠水死。浚以为虽在艰难中岂可废法，即论都统制韩世忠师行无纪、士卒为变；初议从赎，中书后省言止罚金何以惩后，浚再论且乞擒捕为变者，遂夺世忠观察使。
  location: 楚州宝应县
- id: guji-张浚-event-against-qinli
  title_zh: 与卫肤敏论孟忠厚、邢焕除职不可
  date: 1127-12
  precision: month
  is_circa: true
  date_raw: 建炎元年十二月前后
  year_of: 1127
  description: 朝廷以隆祐太后兄子孟忠厚为显谟阁直学士、皇后父邢焕为徽猷阁待制，右谏议大夫卫肤敏、殿中侍御史张浚皆论以为不可；邢焕后改授观察使。
  location: 行在
- id: guji-张浚-event-death
  title_zh: 张浚卒
  date: '1164'
  precision: year
  is_circa: true
  year_of: 1164
  description: 张浚约卒于隆兴二年（1164年），本篇《中兴小纪》未载，据史补。
  location: неизвестно
