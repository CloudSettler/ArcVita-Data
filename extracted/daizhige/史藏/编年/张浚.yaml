  birth_date: '1097'
  death_date: '1164'
  era: 南宋
  reign_ref: 宋高宗建炎至宋孝宗隆兴
  archetype: 主战抗金的台诤之臣与宰辅重臣
  dilemmas:
  - 为亡友鸣冤须劾当国名臣，公义与朝局相冲
  - 大将可用而军法难废，用将与正法两难
  - 抑外戚骤迁之恩与全太后后宫之情难两全
  lesson: 危难之际尤不可废法，持论以公方能服天下人心
  summary_first_person: 吾绵竹张浚，建炎元年自虞部郎官擢殿中侍御史。宋齐愈死非其罪，吾首论李纲以私意杀侍从、典刑不当，恐伤新政人心，纲遂罢相；随驾至楚州宝应，后军作乱逼死谏臣卢臣中，吾谓艰难中岂可废法，再论韩世忠师行无纪，卒夺其观察使；又与卫肤敏论孟忠厚、邢焕除职不可，以全风宪之公。
  source_urls:
  - https://zh.wikisource.org/wiki/中興小紀/卷二
