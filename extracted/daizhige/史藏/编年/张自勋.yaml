  death_date: 卒年不详
  era: 明末（崇祯年间）
  reign_ref: 明思宗崇祯
  archetype: 校勘考据学者
  dilemmas:
  - 尊崇朱子之名与据实纠正《纲目》讹误之间的张力
  - 信从凡例成例与以义理断是非之间的取舍
  lesson: 校书当求端讯末、以义为主，不可执例而害义，亦不可博虚名而牵合迂谬
  summary_first_person: 我是明末南昌（一署宜春）人张自勋，字卓庵。我服膺六经四子，尤重《易》与《春秋》，以为史者经之翼。因见朱子《通鉴纲目》传授刊刻多有讹脱，诸家推扬过情、褒称失实，遂于崇祯癸未撰成《纲目续麟》二十卷，兼作校正凡例、附录、彚览各若干卷：证纲目非朱子手定、多出赵师渊之手，并一一辨正纲目及考异书法发明考证之是非，删增正纲三千六百余字、分注四百余字。我非故与朱子为难，惟求无失乎《春秋》之义，知罪俟之后世。
