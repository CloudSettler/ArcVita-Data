    start_date: ''
    highlight_event_id: guji-张自勋-event-2
  decisions:
  - date: ''
    title_zh: 不置喙于诸家褒扬，独怪纲目纲畧不严、目冗未备
    rationale: 见大儒笔削不能无议，诸家推扬过情，故发凡起例自加订定
- id: guji-张自勋-endeavor-2
  name_zh: 撰《纲目续麟》以订正《通鉴纲目》
  phases:
  - key: brewing
    name_zh: 订定凡例
    labels:
      zh:
