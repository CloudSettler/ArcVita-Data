      - 附录朱子手书
    start_date: ''
    highlight_event_id: guji-张自勋-event-3
  - key: breakthrough
    name_zh: 辨正纲目是非
    labels:
      zh:
      - 续麟二十卷
      - 摘列辨正
    start_date: ''
    highlight_event_id: guji-张自勋-event-4
  - key: climax
    name_zh: 删增纲目文字
    labels:
      zh:
      - 彚览三卷
      - 增删三千余字
    start_date: ''
    highlight_event_id: guji-张自勋-event-5
  - key: closure
    name_zh: 书成待后世论定
    labels:
      zh:
      - 书成崇祯癸未
      - 知罪俟后世
    start_date: 1643
    highlight_event_id: guji-张自勋-event-5
  decisions:
  - date: ''
    title_zh: 著论证明纲目正纲亦多出赵师渊之手、刘友益误以晚年未定之本为中年已定之本
    rationale: 备列朱子论纲目手书十二篇及诸序为证，破陋儒附会之说
  - date: ''
    title_zh: 不以统予秦晋隋
    rationale: 宗方孝孺之论，秦晋隋不可谓正统
  - date: ''
    title_zh: 不以钞胥刻工之失执为朱子笔削
    rationale: 举曹丕刘裕书姓而刊本漏刘字、郑众封侯漏宦者字诸例，证传写刊刻不免讹脱
