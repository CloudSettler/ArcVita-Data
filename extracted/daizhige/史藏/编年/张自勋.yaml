  date: ''
  person_id: guji-张自勋
  description: 服膺六经四子有年，取义尤在《易》与《春秋》，以为孔子本易以作春秋。
- id: guji-张自勋-event-2
  type: 立志著书
  date: ''
  person_id: guji-张自勋
  description: 以本《春秋》以治《纲目》，见诸家书法发明、考异考证互相抵牾，窃不自安，决意为之订定。
- id: guji-张自勋-event-3
  type: 著述
  date: ''
  person_id: guji-张自勋
  description: 首撰校正凡例一卷，列朱子凡例与刘友益书法凡例而各著所疑；次撰附录一卷，备列朱子论纲目手书十二篇及李方子、王柏、徐昭文诸序。
- id: guji-张自勋-event-4
  type: 著述
  date: ''
  person_id: guji-张自勋
  description: 按原书次第摘列纲目及考异书法发明考证之文而一一辨正其是非，撰《续麟》二十卷。
- id: guji-张自勋-event-5
  type: 成书
  date: 1643
  year_of: 1643
  person_id: guji-张自勋
  description: 崇祯癸未（崇祯十六年）《纲目续麟》全书成，附彚览三卷，列增删正纲者三千六百四十余字、增删分注者四百四十余字。
