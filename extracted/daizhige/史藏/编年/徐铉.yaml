  reign_ref: 南唐后主李煜、宋太祖赵匡胤
  archetype: 弱国之辩臣
  dilemmas:
  - 国势已去，欲以辞令缓宋师而保全江南
  - 事奉旧主与面对新朝威严之间的进退
  lesson: 卧榻之侧不容他人鼾睡，辞辩难挽积弱之亡
  summary_first_person: 我徐铉奉后主之命两度出使汴京，以江南事宋如子事父为辞，恳求缓师；太祖按剑叱我，谓卧榻之侧岂容他人鼾睡，辩词终无所用，随李煜归宋。
  source_urls:
  - https://zh.wikisource.org/wiki/御制书通鉴续编宋主答徐铉事
