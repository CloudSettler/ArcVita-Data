events:
- id: guji-xuxuan-event-birth
  year_of: 916
  date: '916'
  name_zh: 徐铉约生于此年
  detail: 徐铉，字鼎臣，仕南唐，以文学知名。
- id: guji-xuxuan-event-envoy-1
  year_of: 975
  date: '975'
  name_zh: 徐铉奉命使宋
  detail: 宋师伐江南，徐铉奉李煜之命，卑辞使宋，乞求缓师。
- id: guji-xuxuan-event-envoy-2
  year_of: 975
  date: '975'
  name_zh: 汴廷论辩被叱
  detail: 徐铉以江南事宋如子事父为喻论辩，宋太祖按剑叱之，谓卧榻之侧岂容他人鼾睡，缓师之请不得。
- id: guji-xuxuan-event-surrender
  year_of: 975
  date: '975'
  name_zh: 随李煜归宋
  detail: 金陵陷落，徐铉随后主李煜北面归宋， identifies 宋曹彬禁暴不杀，海内一时底定。
- id: guji-xuxuan-event-death
  year_of: 991
  date: '991'
  name_zh: 卒
  detail: 徐铉卒于宋淳化二年。
