  - 执掌军政大权而终身不僭位，忠与势难以两全
  lesson: 功高不震主，鞠躬尽瘁扶幼主，输忠诚以安社稷。
  summary_first_person: 我乃前燕宗室慕容恪，屡为名将攻城略地，擒冉闵而定中原；后受遗诏辅佐幼主，综理朝政，终身恪守臣节，不敢逾越。
