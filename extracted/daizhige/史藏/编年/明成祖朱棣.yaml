  description: 文中诗云「燕国帝车遥指北」，指其封燕之地为王业之基。
- id: guji-朱棣-event-jingnan
  date: '1402-07-13'
  year_of: 1402
  type: endeavor
  title_zh: 金川门之变，燕师入金陵
  description: 文云「金川门外血波横，大义奚称旦辅成」，谓靖难之役终以入南京夺位；并讥齐泰黄子澄谋疎而气节犹存。
- id: guji-朱棣-event-search
  date: '1402'
  year_of: 1402
  type: endeavor
  title_zh: 登位后访求建文帝下落
  description: 文云「缁衣不辨真兮伪」，暗指成祖疑建文帝逊去，遣胡濙等巡行天下以访张邋遢（张三丰）为名察其踪迹。
- id: guji-朱棣-event-search-end
  date: '1423'
  year_of: 1423
  type: endeavor
  title_zh: 胡濙还朝密奏，其疑始释
  description: 相传胡濙访建文多年还朝夜对，成祖心始安（据史常识补，以应「缁衣不辨真伪」之咏）。
- id: guji-朱棣-event-death
