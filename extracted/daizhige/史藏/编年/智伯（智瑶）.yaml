  title_zh: 智瑶生年不详
  summary_zh: 晋卿荀跞（智文子）之孙、智宣子（荀申）之子，生年史无明文。
- id: guji-智伯-event-succession
  person_qid: guji-智伯
  date: ''
  year_of: ''
  type: career
  title_zh: 智宣子立瑶为后，智果预言智宗必灭
  summary_zh: 智果谏立宵而不从，谓瑶五贤而不仁，以五贤陵人以不仁行之，智宗必灭；智果遂别族于太史为辅氏。
- id: guji-智伯-event-rule
  person_qid: guji-智伯
  date: ''
  year_of: ''
  type: career
  title_zh: 智宣子卒，智襄子为政，专晋国政
  summary_zh: 及智宣子卒，智瑶为晋政，于晋大夫为最强，侵伐邻国，攻晋出公，出公道死，乃奉哀公骄立之。
- id: guji-智伯-event-humiliation
  person_qid: guji-智伯
  date: ''
  year_of: ''
  type: career
  title_zh: 蓝台之宴戏韩康子而辱段规
  summary_zh: 与韩康子、魏桓子宴于蓝台，戏康子而侮段规；智国谏以蚋蚁蜂虿皆能害人，智伯弗听。
- id: guji-智伯-event-land-demand
  person_qid: guji-智伯
  date: ''
  year_of: ''
  type: career
  title_zh: 索地韩魏，各得万家之邑
  summary_zh: 请地于韩康子、魏桓子，韩魏用段规、任章之谋，欲以骄智伯，各与之万家之邑一。
- id: guji-智伯-event-siege
  person_qid: guji-智伯
  date: -455
  year_of: -455
  type: career
  title_zh: 帅韩魏之甲围晋阳，决晋水以灌城
  summary_zh: 赵襄子弗与蔡皋狼之地，智伯怒而率三家之师攻赵；襄子走晋阳，三家以国人围而灌之，城不浸者三版，沉灶产蛙，民无叛意。
- id: guji-智伯-event-boast
  person_qid: guji-智伯
  date: -454
  year_of: -454
  type: career
  title_zh: 行水灌城放言“水可以亡人国”
  summary_zh: 智伯行水，魏桓子御，韩康子骖乘；智伯言今乃知水可亡人国，桓子肘康子、康子履桓子之跗，盖惧汾水可灌安邑、绛水可灌平阳，暗结反谋。
- id: guji-智伯-event-death
  person_qid: guji-智伯
  date: -453
  year_of: -453
  type: death
  title_zh: 赵襄子与韩魏反，灭智氏于晋阳，智伯死于凿台之下
  summary_zh: 韩魏惧亡，赵襄子得机反而合韩魏共灭智氏，分其地；智伯身死于凿台之下，遂有三家分晋之势。
