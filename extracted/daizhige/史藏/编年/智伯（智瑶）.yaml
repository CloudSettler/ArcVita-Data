  decisions:
  - date: ''
    title_zh: 不听智果之谏自恃五贤
    rationale: 以美鬓长大、射御足力、伎艺毕给、巧文辩惠、强毅果敢五贤自居，不顾其不仁之短，终致智宗必灭之预言成真。
  - date: ''
    title_zh: 蓝台宴上戏康子而侮段规，不听众谏备战
    rationale: 自谓“难将由我”，以为无人敢兴难，轻慢韩魏。
  - date: ''
    title_zh: 求地于韩魏而得，进而索蔡皋狼之地于赵
    rationale: 贪得而骄，狃于得地，韩魏佯与之以骄其心，赵襄子弗与，遂兴师伐赵。
events:
