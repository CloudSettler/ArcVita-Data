  name_zh: 智伯（智瑶，谥襄，号智襄子）
  names:
    zh: 智伯 / 智瑶 / 荀瑶 / 智襄子
    en: Zhi Bo / Xun Yao / Zhi Xiangzi
  lifespan:
    birth:
      date: ''
