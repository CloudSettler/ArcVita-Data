    death:
      date: -453
      precision: year
      is_circa: false
  birth_date: ''
  death_date: -453
  era: 春秋末期 / 战国前夜，晋国六卿专权时期
  reign_ref: 晋出公、晋哀公时期执政晋国
  archetype: 恃才傲物的权臣而覆亡者
  dilemmas:
  - 五贤而不仁，才高而德薄
  - 好利而愎，索地树敌，骄兵必败
  lesson: 才不可凌德，胜不可忘备；骄横吞地者终遭三家共灭。
  summary_first_person: 我智瑶承智宣子之后执掌晋政，才具过人，然恃强凌弱，戏辱韩魏之君相，强索其地，又求蔡皋狼之地于赵襄子不得，遂帅韩魏之甲围晋阳而水灌之。城将没，我言水可亡人国，韩魏二子由此惧祸暗相结。晋阳未下，赵襄子反而与韩魏共灭我族，我身死凿台之下，智氏之地遂为三家所分。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑/卷第一
