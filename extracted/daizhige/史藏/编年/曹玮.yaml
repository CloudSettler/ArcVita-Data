  name_zh: 曹玮
  names:
    zh: 曹玮
    en: Cao Wei
  lifespan:
    birth:
      date: 0973
      precision: year
      is_circa: true
      raw: 开宝六年前后
    death:
      date: '1030'
      precision: year
      is_circa: true
      raw: 天圣八年前后
  birth_date: 0973
  death_date: '1030'
  era: 北宋
  reign_ref: 宋真宗·宋仁宗
  archetype: 边将儒帅
  dilemmas:
  - 镇守西鄙，既要御夏羌之寇，又需以粮价、盐池之策谋长途军供与怀柔诸戎
  - 果于战斗与持重守边之间的抉择
  lesson: 善战者以谋济力，以地利盐粮之策弱敌强边
  summary_first_person: 我是北宋名将曹彬之子曹玮，以签书枢密院事出为环庆路都总管安抚使，镇守西鄙。我果于战斗，长于边计，尝谋建城减粮价、据乌白盐池以制夏贼、号令诸戎分封擒贼之功，使敌敛迹，边患渐息。
  source_urls:
  - 续资治通鉴长编卷四十五及相关注文（蜀文辑存、王曾笔录引曹玮事）
