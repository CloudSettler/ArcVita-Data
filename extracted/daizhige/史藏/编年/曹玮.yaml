    title_zh: 建议建清远二城以趋灵武、减谷价供军费
    rationale: 度越旱海无舍宿之地、有贼寇之忧故谷贵；建城则军兵有舍宿之地、少贼寇之忧，输籴日益，谷贱足以供二城之费
  - date: 0999
    title_zh: 谋据乌白盐池、号令诸戎共击夏贼
    rationale: 乌白盐池为夏贼及诸戎所性命视之，据之以分封擒贼之功，则诸戎愿擒保吉者众，可为王师之助
  - date: '1016'
    title_zh: 晚自枢贰出镇西鄙
    rationale: 以签书枢密院事为环庆路都总管安抚使，亲当边任
