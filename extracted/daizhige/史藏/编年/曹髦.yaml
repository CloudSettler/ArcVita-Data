person:
  qid: guji-cao-mao
  name_zh: 曹髦
  names:
    zh: 曹髦
    en: Cao Mao
  lifespan:
    birth:
      date: '241'
      precision: year
      is_circa: true
      raw: 正始二年（241年），魏文帝之孙
    death:
      date: 260-06-02
      precision: day
      is_circa: false
      raw: 魏景元元年五月（260年6月2日），成济抽戈犯跸刺之，刃出于背
  birth_date: '241'
  death_date: 260-06-02
  era: 三国·曹魏
  reign_ref: 魏帝·高贵乡公（254—260年在位，年号正元、甘露）
  archetype: 宁为玉碎的傀儡少帝
  dilemmas:
  - 坐受废辱以苟全，还是挺身讨昭以殉魏
  - 采王经重详之谏以图后计，还是掷版令而定必死之志
  lesson: 司马昭之心路人所知，而天子拔剑；当尊严与存亡不可兼得，曹髦以一死守住了傀儡最后的君德——败亡者未必失格，忍辱者未必全节。
  summary_first_person: 我是曹髦，魏文帝之孙，继废帝之后践阼，而威权日归司马氏。井中之龙屈于泥涂，我作《潜龙》之诗自讽，昭见而恶之。及至司马昭之心路人所知，我不甘坐受废辱，掷版令于地，率僮仆数百鼓噪出宫，亲与贾充战于南阙，遂死成济之戈，刃出于背。葬于瀍涧之滨，下车数乘，不设旌旐，百姓掩面而泣——我以血存魏室之魂。
  source_urls:
  - https://zh.wikisource.org/wiki/三國志/卷04
  - https://zh.wikisource.org/wiki/世說新語/方正
endeavors:
- id: guji-cao-mao-endeavor-1
  name_zh: 以斯文自持：太学养老与《潜龙》讽喻
  summary: 权归司马，髦修文德、崇儒乞言，又借诗明志，以天子之礼与讽喻守君德之格，然讽喻之路终绝。
  phases:
  - key: brewing
    name_zh: 冲龄践阼
    labels:
      zh: 傀儡之始
    start_date: 254-10
    highlight_event_id: guji-cao-mao-event-accession
  - key: breakthrough
    name_zh: 太学乞言
    labels:
      zh: 崇儒修礼
    start_date: 258-08
    highlight_event_id: guji-cao-mao-event-taixue
  - key: climax
    name_zh: 潜龙自讽
    labels:
      zh: 以诗抗威
    start_date: 259-01
    highlight_event_id: guji-cao-mao-event-qianlong
  - key: closure
    name_zh: 讽喻路绝
    labels:
      zh: 图穷改辙
    start_date: 260-05
    highlight_event_id: guji-cao-mao-event-plan
  decisions:
  - date: 259-01
    title_zh: 作《潜龙》之诗以自讽
    rationale: 龙者君德，上不在天下不在田而数屈于井，非嘉兆；借诗自明屈居之志，暗讥司马氏之专。
- id: guji-cao-mao-endeavor-2
  name_zh: 讨昭殉国：南阙之血
  summary: 髦不忍坐受废辱，率僮仆数百亲讨司马昭，战于南阙，死于贾充所指使的成济之戈，以天子之血存魏室最后的尊严。
  phases:
  - key: brewing
    name_zh: 威权日去
    labels:
      zh: 积愤蓄志
    start_date: 259-01
    highlight_event_id: guji-cao-mao-event-qianlong
  - key: breakthrough
    name_zh: 掷版定策
    labels:
      zh: 决意亲讨
    start_date: 260-05
    highlight_event_id: guji-cao-mao-event-plan
  - key: climax
    name_zh: 血溅南阙
    labels:
      zh: 天子拔剑
    start_date: 260-06-02
    highlight_event_id: guji-cao-mao-event-death
  - key: closure
    name_zh: 薄葬瀍滨
    labels:
      zh: 百姓掩泣
    start_date: 260-07
    highlight_event_id: guji-cao-mao-event-burial
  decisions:
  - date: 260-05
    title_zh: 拒王经之谏，必行讨贼
    rationale: 权在其门为日久矣，宿卫空阙兵甲寡弱；然不能坐受废辱，掷版令曰行之决矣，正使死何所恨。
  - date: 260-06-02
    title_zh: 亲帅僮仆鼓噪出宫
    rationale: 密议已泄于王沈、王业，司马昭为之备，迟则坐废；以天子之身亲出搏一线存魏之机，死亦无恨。
events:
- id: guji-cao-mao-event-birth
  title_zh: 生于宗室，后封高贵乡公
  date: '241'
  precision: year
  is_circa: true
  year_of: 241
  summary: 魏文帝曹丕之孙、东海定王曹霖之子，封高贵乡公。
- id: guji-cao-mao-event-accession
  title_zh: 曹芳被废后入继大统
  date: 254-10
  precision: month
  is_circa: true
  year_of: 254
  summary: 自曹芳事后，魏人省彻宿卫，无复铠甲，诸门戎兵老弱而已；髦立为帝而威权日归司马氏。
- id: guji-cao-mao-event-taixue
  title_zh: 养老于太学，乞言于王祥
  date: 258-08
  precision: month
  is_circa: true
  year_of: 258
  summary: 八月帝养老于太学，乞言于王祥；祥对以明王礼乐既备，加之以忠诚，忠诚之发形于言行。
- id: guji-cao-mao-event-qianlong
  title_zh: 龙见井中，作《潜龙》诗自讽
  date: 259-01
  precision: month
  is_circa: true
  year_of: 259
  summary: 甘露四年正月，魏地井中屡有龙见，咸以为吉祥；帝曰龙者君德，屈于井非嘉兆，乃作《潜龙》之诗以自讽，司马昭见而恶之。
- id: guji-cao-mao-event-plan
  title_zh: 召三臣斥司马昭之心，掷版定讨
  date: 260-05
  precision: month
  is_circa: true
  year_of: 260
  summary: 髦见威权日去不胜其忿，召侍中王沈、尚书王经、常侍王业，谓司马昭之心路人所知，不能坐受废辱；王经谏以权在其门、宿卫空阙，帝不听，出怀中版令投地曰行之决矣，正使死何所恨；沈、业奔走告昭，昭为之备。
- id: guji-cao-mao-event-march
  title_zh: 帅僮仆数百鼓噪而出，战于南阙
  date: 260-06-02
  precision: day
  is_circa: false
  year_of: 260
  summary: 髦遂帅僮仆数百鼓噪而出，遇昭弟屯骑校尉司马伷于东止车门，其众奔走；中护军贾充逆战于南阙下，髦自用剑。
- id: guji-cao-mao-event-death
  title_zh: 成济抽戈犯跸，刃出于背
  date: 260-06-02
  precision: day
  is_circa: false
  year_of: 260
  summary: 众欲退，太子舍人成济问计于贾充，充曰公畜养汝等正为今日；济即抽戈前刺髦，刃出于背。太傅孚奔往枕帝股而哭曰杀陛下者臣之罪也；昭垂涕问陈泰何以居我，泰请速斩贾充以自明，昭不可，泰厉声曰意唯有进于此耳，归而自杀。
- id: guji-cao-mao-event-burial
  title_zh: 薄葬瀍涧之滨，百姓掩面而泣
  date: 260-07
  precision: month
  is_circa: true
  year_of: 260
  summary: 丁卯葬高贵乡公于洛阳西北三十里瀍涧之滨，下车数乘，不设旌旐；百姓相聚观之曰是前日所杀天子也，或掩面而泣，悲不自胜。
