  reign_ref: 洪武
  archetype: 儒臣·帝王谋士
  dilemmas:
  - 出处之际：身处元末乱世，辅佐朱元璋定鼎，又在明初功成之际恳求归隐山田
  lesson: “高筑墙，广积粮，缓称王”，谋国以深远，处世以退让，功成而不居。
  summary_first_person: 我是朱升，徽州儒生，元末曾为池州学正。至正年间我以“高筑墙、广积粮、缓称王”九字进呈明太祖，为其立国大计所本。洪武元年，我以翰林学士奉命修《女诫》，辑录古贤后妃可为法度之事，使子孙知所法守。开国之典章礼仪亦多出我之手。
  source_urls:
  - 明通鉴目录卷一
