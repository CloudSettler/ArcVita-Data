    title_zh: 两宫北迁后仍拒降诏，坚守扬州
    rationale: 身为宋臣，不忍以城附敌，虽知孤危必死
  - date: 1276-03
    title_zh: 遣姜才出兵邀两宫于泰州
    rationale: 欲劫夺北迁之两宫以入城，图存宋社稷，兵败不克
- id: guji-李庭芝-endeavor-2
  name_zh: 与文天祥之疑合与憾
  phases:
  - key: brewing
    name_zh: 误信流言
    labels:
      zh:
      - 决策失误
    start_date: '1276'
    highlight_event_id: guji-李庭芝-event-1
  decisions:
  - date: '1276'
    title_zh: 信人言天祥来说降，命苗再成杀之
    rationale: 误信脱归军士之言，疑文天祥为元丞相说降使者，忠 行未着、誉望未隆，不足以取信
events:
- id: guji-李庭芝-event-birth
  date: '1219'
  year_of: '1219'
  title_zh: 李庭芝生（约）
  description: 李庭芝约于1219年生，后为南宋淮东制置使、右丞相。
- id: guji-李庭芝-event-1
  date: '1276'
  year_of: '1276'
  title_zh: 误疑文天祥说降
  description: 文天祥至真州谋合兵兴复，李庭芝信脱归者言元的密遣丞相入真州说降，疑天祥为说降使，命苗再成杀之；再成不忍，天祥得以东走海道。史评谓此疑致再成之谋不成，两淮兵力不能合。
- id: guji-李庭芝-event-2
  date: '1276'
  year_of: '1276'
  title_zh: 坚守扬州，东南突围
  description: 两宫北迁后诏谕庭芝等降，犹坚守不下。阿珠遣兵绝高邮、宝应饷路，攻泰州新城；姜才攻湾头堡战败，庭芝留朱涣守城，与才率步骑东出，追及于泰州西，杀步卒千余人，庭芝等仅得入，阿珠筑长围堑守之。
- id: guji-李庭芝-event-3
  date: 1276-08
  year_of: '1276'
  title_zh: 扬州陷，与姜才同死
  description: 朱焕以扬州降，庭芝帐下刘发、郑俊亦开门降，阿珠执庭芝及姜才，斩于扬州市，淮东皆附。同月召为右丞相之命已下而身已死，与都统姜才同殉国。
- id: guji-李庭芝-event-death
  date: '1276'
  year_of: '1276'
  title_zh: 李庭芝卒
  description: 至元十三年（1276），李庭芝执于泰州，斩于扬州市，以身殉宋。
