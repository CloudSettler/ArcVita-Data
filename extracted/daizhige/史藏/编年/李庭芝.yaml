  birth_date: 约1219
  death_date: 1276
  era: 南宋末
  reign_ref: 宋端宗景炎元年 / 元世祖至元十三年
  archetype: 孤城死守之忠臣
  dilemmas:
  - 忠于垂亡之宋室，明知大势已去，仍坚守扬州不降
  - 因误信文天祥前来“说降”的流言而疑忌之，事后成憾
  - 城中粮绝援绝，奉诏坚守两宫已北迁之下，是否仍拼死不降
  lesson: 士为故主守土，生死之际不改其节；然孤忠难挽天命，疑忌忠良更失中兴之机。
  summary_first_person: 我李庭芝受宋恩为淮东制置使，守扬州孤城。元兵已入临安，两宫北迁，诏谕来降，我坚不下。阿珠断我饷路、筑长围困我，我终以城降将叛、身陷敌手，与都统姜才同斩于扬州市，以身殉国。
