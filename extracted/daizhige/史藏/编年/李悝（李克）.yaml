  lesson: 尽地力与明法度，可使贫弱之国一跃而为强国
  summary_first_person: 我是李悝，又名李克，战国初期魏国人。魏文侯以我为相，主持变法：我作尽地力之教以增粟，立平籴之法以稳粮价，著《法经》六篇以明刑罚，又主张食有劳而禄有功、使能而任贤，夺淫民之禄以来四方之士。魏国由是富强，为诸侯之雄。
