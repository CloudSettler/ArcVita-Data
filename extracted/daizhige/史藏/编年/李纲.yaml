      raw: 约1140年
  birth_date: '1083'
  death_date: '1140'
  era: 两宋之际（北宋末至南宋初）
  reign_ref: 宋钦宗靖康、宋高宗建炎
  archetype: 主战宰相·救时之臣
  dilemmas:
  - 守中原系人心与朝廷议幸东南之争：力言中原天下根本，一去则人心揺，示不去中原
  - 严惩围城受伪命之臣与含垢纳污安众心之两难：欲区别三等以差行遣，吕好问谓专以叛逆加之彼必有辞
  - 金人所恶之身与受命为相之任：颜歧请置闲地，上以朕之立恐亦非金人所喜答之
  lesson: 危局之中正纲纪、系人心重于一身毁誉；直道虽孤，规模所立足为中兴之基
  summary_first_person: 我李纲，邵武人。宣和间官起居舍人，论京师水灾谪沙县监税。靖康京城初被围，我首建议力守，后宣抚河南救太原，虽无功而士论恕我。建炎元年五月甲午，天子自外除我右仆射兼中书侍郎。六月至行在，人言我为金人所恶宜置闲地，我不辞而赴堂治事。我再论围城受伪命之罪，引春秋之法请诛张邦昌僭逆，上终贷死窜之潭州；荐张所招抚河北、傅亮经制河东，请买马募财、籍兵十万为战守之备；又言当修军政、宜适南阳以不去中原。七月壬寅进左仆射兼门下侍郎，兼御营使，与主幸东南者力争，为中兴立规模。
  source_urls:
  - https://zh.wikisource.org/wiki/中興小紀
