- id: guji-李纲-event-chuxiang
  date: 1127-06-16
  precision: day
  year_of: 1127
  title_zh: 自外除右仆射兼中书侍郎
  description: 靖康执政皆去，人望未孚，上以纲当围城能力守，甲午拜右仆射兼中书侍郎
  raw_date: 建炎元年五月甲午
- id: guji-李纲-event-xingzai
  date: 1127-07-11
  precision: day
  year_of: 1127
  title_zh: 至行在入见，却金人所恶之议
  description: 御史中丞颜歧言纲为金人所恶宜置闲地；纲入见首言愿归田里，乞圣心审处，上以朕之立恐亦非金所喜答之，歧无辞而退，纲乃赴堂治事
  raw_date: 建炎元年六月己未朔
- id: guji-李纲-event-weiming
  date: 1127-07-14
  precision: day
  year_of: 1127
  title_zh: 再论围城受伪命之罪
  description: 纲谓围城士大夫不闻死节、因以为利，李若水、霍安国死节甚着而吴幵莫俦等受伪命为执政罪首；欲区别三等以差行遣，吕好问谓专以叛逆罪之彼必有辞；上以新政重于杀士大夫，止窜责吴幵莫俦王时雍等
  raw_date: 建炎元年六月壬戌
- id: guji-李纲-event-bangchang
  date: 1127-07-15
  precision: day
  year_of: 1127
  title_zh: 请以春秋法诛张邦昌，终窜潭州
  description: 纲奏邦昌恃金人盗神器、冒取王爵，都城人德之元帅府恕之为私，天下愤之为公；若执政议不同乞廷辨，必欲用邦昌乞罢臣相；上召黄潜善吕好问汪伯彦再对，是日诏邦昌以散官安置潭州
  raw_date: 建炎元年六月癸亥
- id: guji-李纲-event-mubing
  date: 1127-08-07
  precision: day
  year_of: 1127
  title_zh: 请买马募财、诏籍兵十万
  description: 纲请令诸路买马及募民出财助军费，谓熙丰禁旅五十九万今单弱，当取财东南、募师西北；丙戌诏陕西河北各募三万、京东各募二万，创骑胜忠勇等十号，每号四军、每军二千五百人
  raw_date: 建炎元年六月丙戌
- id: guji-李纲-event-liuzhongyuan
  date: 1127-08-22
  precision: day
  year_of: 1127
  title_zh: 议留中原，拟诏亲督六师
  description: 纲言中原天下根本，一去之则人心揺，昨建策适襄邓正示不去中原且系其心；上言但欲奉太后六宫往东南、朕当留中原，纲赞为汉髙光唐太宗之英断，乞降诏，乃命纲拟诏
  raw_date: 建炎元年七月辛丑
- id: guji-李纲-event-jinzuo
  date: 1127-08-23
  precision: day
  year_of: 1127
  title_zh: 进左仆射兼门下侍郎兼御营使
  description: 纲迁左仆射兼门下侍郎，黄潜善代为右仆射兼中书侍郎；时初建御营司，两人并兼御营使，张慤副之
  raw_date: 建炎元年七月壬寅
- id: guji-李纲-event-nanyang
  date: 1127-08-26
  precision: day
  year_of: 1127
  title_zh: 建策宜适南阳缮城储粮
  description: 纲言今未能幸关中宜适南阳，乃诏委守臣修缮城隍、降钞盐钱帛储粮草、令江湖纲运由襄江通漕、四川转轻货自归峡输于邓
  raw_date: 建炎元年七月乙巳
- id: guji-李纲-event-death
  date: 1140
  precision: year
  year_of: 1140
  title_zh: 李纲卒
  description: 绍兴十年卒，年五十八，谥忠定（本卷未载，据史传补）
  raw_date: 约绍兴十年
