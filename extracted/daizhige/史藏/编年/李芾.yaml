  dilemmas:
  - 家眷与城ӏa：城将陷， rejects逃亡，须决生死
  - 家眷与守节：令沈忠尽杀家人而后杀己，以死殉城免受辱
  - 死节与劝说：面对元军招降，誓死不屈与慷慨登陴分守
  lesson: 忠义殉城，宁举家死节不为降虏
  summary_first_person: 我是宋潭州安抚使李芾，元兵围潭州时我慷慨登陴、分兵守城，勉励军民以忠义死战。城将陷时，我坐熊湘阁，遗金命帐下沈忠尽杀我的家人而后杀我，忠泣许之。我引颈受刃，忠纵火焚吾居，还家杀其妻孥，复至火所大恸，遂自刭而死。幕后僚陈亿孙、顔应焱皆死，潭民闻之多举家自尽。
  source_urls:
  - source: 钦定四库全书·元史续编
    passage: 世祖皇帝至元十三年春二月丁卯朔 阿尔哈雅克宋潭州安抚使李芾死之
