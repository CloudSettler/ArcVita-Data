person:
  qid: guji-杜太后
  name_zh: 杜太后（昭宪太后）
  names:
    zh: 杜太后
    en: Empress Dowager Du
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年未详，享年六十
    death:
      date: 961-07-29
      precision: day
  death_date: 961-07-29
  era: 五代末至北宋初
  reign_ref: 宋太祖建隆年间
  archetype:
  - 深谋远虑的母后
  dilemmas:
  - 主少国疑之忧：亲历后周幼主失国，力主立长君以固社稷
  - 家国之间：临终定传位之约，以母子至情约束皇权更替
  lesson: 鉴柴氏使幼儿主天下、群心不附之败，以金匮之盟立长君传弟之约，谋社稷长远而非一家之私
  summary_first_person: 我是宋太祖之母杜太后。我聪明有智度，常与皇帝参决大政，称赵普为赵书记，嘱其尽心辅佐我尚未更事的儿子。我尤爱光义，每出必戒其与赵书记偕行。建隆二年我病笃，召赵普入受遗命，问皇帝何以得天下，指出正因为柴氏使幼儿主天下、群心不附；因命传位于弟光义，使赵普在榻前记为誓书，藏之金匮。同年六月甲午，我崩于滋德殿，后祔葬安陵，谥明宪（后谥昭宪）。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑後編/卷二
