person:
  qid: guji-杨业
  name_zh: 杨业
  names:
    zh: 杨业
    en: Yang Ye
  lifespan:
    birth:
      precision: 不详
      is_circa: true
      raw: 古文未载其生年
    death:
      date: 0986-08
      precision: 月
      is_circa: true
      raw: 宋太宗雍熙三年八月，兵败被擒，不食三日而死
  death_date: 0986-08
  era: 北宋
  reign_ref: 宋太宗·雍熙三年（丙戌，986）
  archetype: 忠烈武勇、与士卒同甘苦之边将
  dilemmas:
  - 身陷敌手：事敌苟活还是绝食殉节——业太息曰上遇我甚厚，何面目求活于敌中，乃不食三日而死
  - 兵败之际：遣散麾下百余人令其逃生，还是携之俱死——业慰遣之，众皆感泣不肯去，遂俱死无生还者
  - 护民之责：敌兵邀击、马重伤不能进，进则必死、退则弃民——力战自日中至暮，手刃数百人
  lesson: 受国厚恩者临难不苟免；为将与士卒同甘苦，则士卒乐为之用，至死不相弃。
  summary_first_person: 我杨业不知书，然忠烈武勇，有智谋，练习攻战，与士卒同甘苦，故士卒乐为我用。雍熙三年，朝廷迁四州之民，属我与潘美以所部护送，敌兵邀击，我力战自日中至暮，手刃数百人，马重伤不能进，遂为敌所擒。上遇我甚厚，何面目求活于敌中，乃不食三日而死。
  source_urls:
  - https://zh.wikisource.org/wiki/九朝編年備要
