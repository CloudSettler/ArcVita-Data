  - key: breakthrough
    name_zh: 与士卒同甘苦
    labels:
      zh: 故士卒乐为之用
  - key: climax
    name_zh: 麾下以死相随
    labels:
      zh: 兵败后慰遣麾下百余人，众感泣不肯去，遂俱死无生还者
    start_date: 0986-08
    highlight_event_id: guji-杨业-event-farewell
  - key: closure
    name_zh: 身后哀荣
    labels:
      zh: 诏削潘美三任，赐业官，锡其家粟帛，録其子五人
