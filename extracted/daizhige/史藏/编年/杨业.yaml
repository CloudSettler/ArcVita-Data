    title_zh: 马重伤犹力战不退
    rationale: 护迁民之责在身，敌兵邀击，自日中至暮手刃数百人，虽人马俱困不肯弃民先走
  - date: 0986-08
    title_zh: 被擒后拒绝事敌，绝食殉节
    rationale: 业太息曰上遇我甚厚，何面目求活于敌中——以死报君恩，全忠烈之名
