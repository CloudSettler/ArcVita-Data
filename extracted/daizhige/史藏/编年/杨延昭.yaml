  era: 北宋
  reign_ref: 宋真宗景德年间
  archetype: 边将
  dilemmas:
  - 澶渊盟和后守边之臣当战当守的两难：和议既成，边备不可弛而朝廷忌兵
  lesson: 有备则和可久，无备则和必败；守边者威名不在战功多寡，而在敌不敢犯。
  summary_first_person: 我杨延朗乃杨业之子，戍守北边二十余年，澶州之役时以缘边都巡检屯保州，契丹畏我不敢近边。景德和议既定，朝廷命我知保州，专一行守巡警，虽罢兵而不敢废防。
  source_urls:
  - https://zh.wikisource.org/wiki/續資治通鑑長編/卷五十九
