person:
  qid: guji-杨皇后
  name_zh: 杨皇后
  names:
    zh: 杨皇后、杨桂枝、恭圣仁烈杨皇后
    en: Empress Yang
  lifespan:
    birth:
      date: '1162'
      precision: year
      is_circa: true
      raw: 约绍兴三十二年
    death:
      date: '1233'
      precision: year
      is_circa: false
      raw: 嘉定六年绍定六年卒
  birth_date: '1162'
  death_date: '1233'
  era: 南宋
  reign_ref: 宋宁宗、宋理宗朝
  archetype: 后宫与外朝枢纽型政治人物
  dilemmas:
  - 韩侂胄专权，杀与不杀之间须联史弥远定策
  - 宁宗崩后储位 unsettled，废济王而立理宗之抉择
  lesson: 势弱者以隐忍与结盟成大事，然定策废立亦埋下祸根
  summary_first_person: 我是南宋宁宗皇后杨氏，出身低微而终登中宫。韩侂胄窃权跋扈，我与史弥远合谋，诛之于玉津园侧，朝局为之一新。宁宗崩后，我从史弥远之议，废皇子竑而立与莒，是为理宗，此后垂帘称制多年，虽稳定朝局，亦为济王之死留下争议之名。
  source_urls:
  - https://zh.wikipedia.org/wiki/恭圣仁烈杨皇后
