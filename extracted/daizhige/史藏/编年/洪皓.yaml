  dilemmas:
  - 出使金国遭扣留，守节还是屈从
  - 在金廷为馆客，暗中观察记录女真史事
  lesson: 使于四方，不辱君命，威武不能屈
  summary_first_person: 我是洪皓，建炎年间奉命出使金国，被扣留十余年而不改其节，人比之苏武。我留金期间留意女真国情，归国后著《松漠记闻》，记金太祖阿骨打事、完颜氏起源及金廷人物，为宋人知金之要籍。
