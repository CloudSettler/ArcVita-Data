  era: 元代
  reign_ref: 元文宗天历、至顺年间
  archetype: 权臣
  dilemmas:
  - 立君定策：泰定帝死后两都并立，须择君以定社稷归属
  - 忠于宗室与自己专权之间的张力，拥立文宗后又迎立明宗，明宗暴卒遭后世疑议
  lesson: 乘时拥立可致位极人臣，然权柄过盛、终身秉政，身后家族随败，权臣之荣难副其危
  summary_first_person: 我燕铁木儿以西枢密之兵举义大都，两都之战定文宗之位，官拜中书右丞相、封太平王，军国大政皆决于我，权倾一时，终以沉溺酒色致疾而卒。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷138
  note: 所给《元史续编》卷一至元十三至十四年文本中无燕铁木儿事迹，本条据通行史传知识补拟，待原文核对。
