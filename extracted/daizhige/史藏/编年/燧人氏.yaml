    title_zh: 教民钻木取火
    rationale: 民食果蓏蚌蛤，腥臊臭恶，伤害腹胃而多疾病，故发明取火以炮生为熟
- id: guji-燧人氏-endeavor-2
  name_zh: 持斗机之法，施政教而王天下
  phases:
  - key: climax
    name_zh: 遂皇握机矩
    labels:
      zh: 政教初创
    start_date: about-29000
    highlight_event_id: guji-燧人氏-event-reign
  decisions:
  - date: about-29000
    title_zh: 指天以施政教
    rationale: 郑玄六艺论云遂皇持斗机运转之法，指天以施政教，始王天下
events:
- id: guji-燧人氏-event-breakthrough
  date: about-30000
  year_of: -30000
  title_zh: 钻木取火
  desc_zh: 上观星辰，下察五木，钻木取火，炮生为熟，养人利性，避臭去恶
- id: guji-燧人氏-event-reign
  date: about-29000
  year_of: -29000
  title_zh: 王天下号燧皇
  desc_zh: 在伏牺之前始王天下，有天下百余代或云万余年，号燧皇
- id: guji-燧人氏-event-death
  date: about-28000
  year_of: -28000
  title_zh: 燧人氏没，包牺氏代之
  desc_zh: 皇甫谧帝王世纪云燧人氏没，包牺氏代之；自天皇至燧皇九十一代
