person:
  qid: guji-燧人氏
  name_zh: 燧人氏
  names:
    zh: 燧人氏
    en: Suiren Shi
  era: 上古三皇，伏牺之前
  reign_ref: 天皇地皇人皇之后，有天下百余代
  archetype: 文化先祖·取火圣王
  lesson: 观星辰而察五木，钻木取火，教民熟食去害，技术之发明始于对自然的细察
  dilemmas:
  - 民食腥臊生冷而多疾，须舍生冷之便以换长久之安
  - 火既能养生亦可成灾，须立教化以约束用火
  summary_first_person: 我观星辰、察五木，钻木取火，炮生为熟，教民去腥臊臭恶之害；又持斗机运转之法以施政教，遂王天下。
endeavors:
- id: guji-燧人氏-endeavor-1
  name_zh: 钻木取火，炮生为熟
  phases:
