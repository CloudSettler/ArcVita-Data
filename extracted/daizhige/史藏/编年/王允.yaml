  archetype: 清流谋国者
  dilemmas:
  - 宦官专权与外戚相争之间如何辅保汉室
  - 忍辱屈从董卓以图后计
  lesson: 处危乱之世，谋大事者须能隐忍待时。
  summary_first_person: 我是王允，汉末之臣。大将军何进谋诛宦官时，以我为河南尹，与丁原、董卓之兵共胁太后。其后董卓擅政，倾覆汉纲，我忍辱周旋于其侧，与士大夫暗相结纳，终与吕布合谋诛卓，冀纾社稷之难。
