    rationale: 何进欲诛诸常侍而忧太后不纳，故召外兵胁迫，并任袁绍为司隶校尉、王允为河南尹，布置京畿以谋内官。
- id: guji-王允-endeavor-2
  name_zh: 屈身董卓之后图
