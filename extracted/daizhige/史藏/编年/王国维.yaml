  death_date: 1927-06-02
  era: 清末民初
  reign_ref: 民国
  archetype: 考据学者·辨伪辑佚
  dilemmas:
  - 今本《纪年》既断为无用无征，理可径废；又惧后世复有陈逢衡辈纷纷聚讼，废与刊之间两难，终取写而刊之、与《古本辑校》并行
  - 所据今本间有讹误为王氏所未及尽正，遗书初印续印两本互有得失，只能略出案语以说明
  lesson: 辨伪之道在穷源竟委，一一求其所出，如捕盗者之获得真赃；结论须立于逐条疏证之上
  summary_first_person: 我是海宁王国维，字静安。治《竹书纪年》，既成《古本辑校》一卷；复怪今本《纪年》为后人搜辑、其迹甚着，而近三百年学者疑信参半。乃用惠定宇、孙颐谷二家之法，一一求其所出，始知今本所载殆无一不袭他书，所增者惟杜撰年月，无用无征。丁巳孟夏，写而刊之，俾与《古本辑校》并行，惧后世复为陈逢衡辈之说所纷也。
  source_urls:
  - https://zh.wikisource.org/wiki/今本竹書紀年疏證
endeavors:
