    start_date: 1917-05
    highlight_event_id: guji-王国维-event-shuzhengxu
  decisions:
  - date: 1916
    title_zh: 定《古本辑校》为一卷
    rationale: 汲冢竹书久亡，惟赖诸书征引存其佚文，辑校所以存古本之真
  - date: 1917-05
    title_zh: 俾《古本辑校》与《疏证》并行
    rationale: 一存其真，一破其伪，二者相辅并行，学者可据以定谳
- id: guji-王国维-endeavor-2
  name_zh: 撰《今本竹书纪年疏证》
  description: 用惠、孙二家之法为今本《纪年》逐条疏证出处，证其为后人搜辑之本
  phases:
  - key: brewing
    name_zh: 怪今本迹甚着而信者过半，取惠、孙二家疏证之法
    labels:
      zh: 方法承借
    start_date: 1916
    highlight_event_id: guji-王国维-event-jinbenkaochu
  - key: breakthrough
    name_zh: 一一求其所出，知今本所载殆无一不袭他书
    labels:
      zh: 伪迹大明
    start_date: 1916
    highlight_event_id: guji-王国维-event-jinbenkaochu
  - key: climax
    name_zh: 逐条疏证出处，剖析古今杂陈、矛盾调停之因
    labels:
      zh: 疏证成书
    start_date: 1917
    highlight_event_id: guji-王国维-event-shuzhengxu
  - key: closure
    name_zh: 丁巳孟夏序成，写而刊之
    labels:
      zh: 刊布并行
    start_date: 1917-05
    highlight_event_id: guji-王国维-event-shuzhengxu
  decisions:
  - date: 1917-05
    title_zh: 不径废今本而刊《疏证》
    rationale: 夫事实既具他书、年月多杜撰，无用无征，废之可也；然惧后世复有陈逢衡辈为是纷纷，故写而刊之，俾与《古本辑校》并行
  - date: 1917-05
    title_zh: 序中自明方法所自与成书缘起
    rationale: 取惠定宇《古文尚书考》、孙颐谷《家语疏证》成法，所谓是犹捕盗者之获得真赃
