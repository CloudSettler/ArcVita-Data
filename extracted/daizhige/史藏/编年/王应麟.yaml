  dilemmas:
  - 宋亡之后隐居不仕元朝，以著述自守
  - 历史地名纷乱沿革难考，须辨析异同以为兴替之鉴
  lesson: 治学务在考证地名沿革，通古今兴替成败之鉴
  summary_first_person: 我名王应麟，字伯厚，庆元府人。淳祐元年登进士第，宝祐中复中博学宏辞科，官至礼部尚书兼给事中。宋亡后隐居著述，撰《通鉴地理通释》《诗考》《诗地理考》《困学纪闻》诸书，为史学考据之功甚巨。
  source_urls:
  - https://www.zh.wikisource.org/wiki/通鉴地理通释
