      raw: 南宋绍兴九年（1139）卒，本传未详
  birth_date: 约1090
  death_date: '1139'
  era: 两宋之际（北宋末至南宋建炎）
  reign_ref: 宋高宗建炎
  archetype: 抗金统兵将领
  dilemmas:
  - 驭将过严则失猛士，岳飞见疑而去自为一军
  - 招抚司骤得擢用，都统制任重而根基未固
  lesson: 用才者须能容才，驭众者不可多疑，疑则骁将离心而去。
  summary_first_person: 我是王彦，河内人，初为清河尉。直龙图阁张所招抚河东时，我投身其军中，张所奇我的才干，不数月便擢我为都统制。我以效力之人岳飞为军将，与他共统部伍。然相处既久，岳飞见疑于我，乃去而自为一军，至是降于东京留守杜充。
  source_urls:
  - https://zh.wikisource.org/wiki/中興小紀/卷四
