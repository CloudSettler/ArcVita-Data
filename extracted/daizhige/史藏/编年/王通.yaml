  description: 旧史无详载，约生于隋初开皇间，河东龙门王氏
- id: guji-王通-event-yuanjing
  date: 0609
  year_of: 609
  type: endeavor-start
  name_zh: 旧题王通撰《元经》成，起晋太熙元年，终隋开皇九年
  description: 元经十卷旧题隋王通撰，始晋太熙元年（290），终隋开皇九年（589），凡九卷称为通之原书；序称夫子以元经为天下之书，征天命以正帝位
- id: guji-王通-event-xueshou
  date: '0610'
  year_of: 610
  type: collaboration
  name_zh: 薛收受经于王通，撰元经传解并续末一卷
  description: 薛收自序称收受经于夫子，輙为传解发明师训；其书末一卷自隋开皇十年迄唐武德元年，唐薛收续并作传
- id: guji-王通-event-dispute
  date: '1044'
  year_of: 1044
  type: commentary
  name_zh: 宋人疑《元经》为阮逸伪托之作
  description: 晁公武疑阮逸依托为之；陈振孙谓河汾王氏诸书自中说以外皆唐艺文志所无，传出阮逸或云皆伪作；据太兴四年书字例，作于隋世之书不宜如此
- id: guji-王通-event-death
  date: '0617'
  year_of: 617
  type: death
  name_zh: 王通卒
  description: 大业末卒于河汾讲学之地，世称文中子；生卒年约略无确据
