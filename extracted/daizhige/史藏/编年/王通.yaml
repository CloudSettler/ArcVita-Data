person:
  qid: guji-王通
  name_zh: 王通
  names:
    zh: 王通
    en: Wang Tong
  lifespan:
    birth:
      date: 0584
      precision: year
      is_circa: true
      raw: 隋世学者，生年史无详载，约当开皇年间
  birth_date: 0584
  era: 隋
  reign_ref: 隋文帝开皇
  archetype: scholar
  dilemmas:
  - 妄以圣人自居而标榜著述正统，与本传所疑伪托之节操之间的张力
  - 欲以《元经》继《春秋》褒贬之业，然书直书杨坚辅政，被讥为悖乱其世
  lesson: 著述欲代圣人立言，须以真学术与真品行立信；依托造作，纵流传久远，终为考据者所纠
  summary_first_person: 我名王通，世称文中子，生当隋世。旧题我撰《元经》十卷，起晋太熙元年、终隋开皇之年，以继《春秋》正帝位、明天命之归；门人薛收受经，为作传解。然吾生隋世而直书杨坚辅政，后人讥我悖乱；宋以来更有晁公武、陈振孙诸家疑此书实出阮逸伪托，河汾王氏诸书中说以外皆唐志所无。书之真伪聚讼至今，然吾以讲学河汾、以经史明王道自任之志，仍见于序传笔法之间。
  source_urls:
  - https://zh.wikisource.org/wiki/四库全书总目/元经
