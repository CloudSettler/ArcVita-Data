  lesson: 谋定边略、敢于建言，方能由微贱而见用于明主
  summary_first_person: 我布衣客游陕西，访采边事，熙宁元年诣阙上《平戎策》三道，主张欲取西夏当先复河湟，使夏人腹背受敌。神宗奇其言，召问方略，我遂得为管勾秦凤经略司机宜文字，从此踏上经略熙河之路。
