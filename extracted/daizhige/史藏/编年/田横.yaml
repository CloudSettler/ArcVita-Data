person:
  qid: guji-田横
  name_zh: 田横
  names:
    zh: 田横
    en: Tian Heng
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: 生年不详
    death:
      date: '-202'
      precision: year
      is_circa: true
      raw: 汉五年（约前202年）
  era: 秦末楚汉之际
  reign_ref: 楚汉之际齐国王族、齐相、齐王
  archetype: 守土殉国之臣
  dilemmas:
  - 项羽不肯王己之兄田荣，齐楚交恶，夹于楚汉之间择主而事
  - 韩信袭齐，广被虏，横于亡国之际自立为齐王，抗汉而终不能支
  lesson: 强邻环伺之下，据地自守终难独存；士之立身，宁折不屈。
  summary_first_person: 我田横出于齐国王族。兄田荣怨项羽不肯封王，杀田市自立为齐王，并三齐之地。项羽伐齐杀田荣，我立荣子田广为齐王，自为相，止于城阳。齐请救于楚，楚遣龙且以二十万众来援，与韩信夹潍水而阵；韩信壅水半渡、佯败诱敌，决壅破楚，斩龙且，虏田广，齐遂破。我于败中复立为齐王，收兵再战，终不能胜，遂亡去。
  source_urls:
  - https://zh.wikisource.org/wiki/前汉纪
