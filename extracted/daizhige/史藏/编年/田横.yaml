events:
- id: guji-田横-event-5
  date: -205-06
  year_of: '-205'
  title_zh: 田荣并三齐自立为齐王
  description: 田荣杀田市逐田都击杀济北王安，并三齐之地，田氏定齐。
- id: guji-田横-event-6
  date: -205-01
  year_of: '-205'
  title_zh: 项羽伐齐杀田荣
  description: 项羽北击齐，杀田荣，齐降于楚；羽焚城郭、杀降卒、系虏老弱，齐复叛楚降汉。
- id: guji-田横-event-1
  date: -204-04
  year_of: '-204'
  title_zh: 田横立田广为齐王，自为相
  description: 汉三年夏四月，田横立田荣之子田广为齐王，己为齐相，止于城阳。
- id: guji-田横-event-2
  date: -204-10
  year_of: '-204'
  title_zh: 田横请救于楚
  description: 韩信将伐齐，横危惧，请援于项羽。
- id: guji-田横-event-3
  date: -204-11
  year_of: '-204'
  title_zh: 楚遣龙且救齐，韩信潍水破之
  description: 楚使龙且以号二十万众与齐合军，夹潍水而阵；韩信壅水诱敌，决水半渡而击，斩龙且，虏齐王田广。
- id: guji-田横-event-4
  date: -204-12
  year_of: '-204'
  title_zh: 田横复立为齐王，战败而亡
  description: 齐地平于汉，横于败中自立为齐王，收兵再战不支，遂出亡。
