events:
- id: guji-皇太极-event-birth
  year_of: -3792
  date: '1592-11-28'
  type: birth
  title_zh: 皇太极生
  detail: 太祖之子，幼禀睿知圣德咸备，为太祖器重
- id: guji-皇太极-event-sizu
  year_of: 1626
  date: '1626-10-01'
  type: endeavor
  title_zh: 继太祖嗣服为汗
  detail: 太祖崩，皇太极即汗位，改元天聪，规模既定
- id: guji-皇太极-event-yuxi
  year_of: 1635
  date: '1635-10-01'
  type: endeavor
  title_zh: 收服察哈尔获历代传国玉玺
  detail: 天聪九年贝勒多尔衮等收服察哈尔全部，其子额哲率众迎降，获传国玉玺
- id: guji-皇太极-event-daqing
  year_of: 1636
  date: '1636-04-01'
  type: endeavor
  title_zh: 建国号大清改元崇德
  detail: 诸贝勒大臣以符瑞炳着请建国号，群臣上尊号曰寛温仁圣皇帝
- id: guji-皇太极-event-chaoxian
  year_of: 1636
  date: '1636-12-01'
  type: endeavor
  title_zh: 亲征朝鲜
  detail: 以朝鲜败盟逆命统大军征之，李倧诣军前降，上明国所给勅印，三田渡勒碑颂德
- id: guji-皇太极-event-liaodan
  year_of: 1631
  date: '1631-10-01'
  type: endeavor
  title_zh: 亲破明兵于大凌河
  detail: 黑云起，风从西来，敌乘风纵火，天忽雨反风焚敌，遂大捷，十月大凌河城降
- id: guji-皇太极-event-fengqiang
  year_of: 1638
  date: '1638-09-01'
  type: endeavor
  title_zh: 两入明边张挞伐
  detail: 命多尔衮、岳托统左右翼军，自墙子岭、青山关分路入关，破济南诸府
- id: guji-皇太极-event-songjin
  year_of: 1642
  date: '1642-02-01'
  type: endeavor
  title_zh: 克松山，生擒洪承畴
  detail: 崇德七年二月克松山城，擒明总督洪承畴，三月克锦州，祖大寿降
- id: guji-皇太极-event-shenru
  year_of: 1642
  date: '1642-11-01'
  type: endeavor
  title_zh: 命阿巴泰率师征明
  detail: 由黄崖口入，越燕京趋河间至兖州，凡克府三州十八县六十七
- id: guji-皇太极-event-death
  year_of: 37
  date: '1643-09-21'
  type: death
  title_zh: 皇太极崩
  detail: 崇德八年薨，贻定鼎之谋于后世
