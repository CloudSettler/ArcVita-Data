  date: 约1214
  date_precision: year
  is_circa: true
  year_of: 1214
  summary_zh: 贞祐二年金主珣不堪蒙古攻逼，自燕京迁都开封，宋廷岁币之议随之一时汹汹。
- id: guji-真德秀-event-que-suibi
  endeavor_id: guji-真德秀-endeavor-1
  title_zh: 真德秀请绝金人岁币
  date: 约1214
  date_precision: year
  is_circa: true
  year_of: 1214
  summary_zh: 嘉定七年，真德秀上疏力请绝女真岁币，谓塔坦图金犹猎师之志在得鹿，当乘敌将亡亟图自立，以用忠贤、修政事、询群策、收众心为本，厉甲兵而毋以苟安为志。
- id: guji-真德秀-event-appointment
