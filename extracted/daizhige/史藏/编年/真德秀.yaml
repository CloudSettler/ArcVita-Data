  birth_date: 1178
  death_date: 1235
  era: 南宋
  reign_ref: 宋宁宗嘉定年间
  archetype: 理学名臣·经世谏臣
  dilemmas:
  - 事仇与绝币：续输岁币可暂缓边衅，然以世仇为屏蔽有亏大义
  - 借金为屏与乘机自立：金存可缓冲蒙古之逼，亦恐养痈遗患、坐失自强之机
  - 联蒙之诱与比邻之盗：群盗与强敌皆出荒裔，拒纳新附则激其等死之忿，纳之又虞窥觎
  lesson: 国以自立为本，用忠贤、修政事、询群策、收众心，毋以苟安为志，毋以金存为喜、金亡为畏
  summary_first_person: 予真德秀，号西山。当金人迁汴、蒙古侵陵之秋，予伏阙上疏，力请绝女真岁币，谓用兵之费可移为自强之资；朝辞之日复进五事：宗社之耻不可忘，比邻之盗不可轻，幸安之谋不可恃，导谀之言不可听，至公之论不可忽，皆以收人心、修实政为国家久长之计。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷437
  - https://zh.wikipedia.org/wiki/真德秀
