  date: 约1214-12
  date_precision: month
  is_circa: true
  year_of: 1214
  summary_zh: 嘉定七年冬，真德秀除秘阁修撰、江南东路计度转运副使，将朝辞赴任。
- id: guji-真德秀-event-wuwu
  endeavor_id: guji-真德秀-endeavor-2
  title_zh: 朝辞奏五事
  date: 约1214-12
  date_precision: month
  is_circa: true
  year_of: 1214
  summary_zh: 朝辞奏事，进言五事：宗社之耻不可忘、比邻之盗不可轻、幸安之谋不可恃、导谀之言不可听、至公之论不可忽；陈待敌上中下三策，谓宜勉勾践之良图、惩谢玄之失策。
- id: guji-真德秀-event-death
