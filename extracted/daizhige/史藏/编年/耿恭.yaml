events:
- id: guji-耿恭-event-birth
  person: guji-耿恭
  type: birth
  title_zh: 耿恭出生
  detail_zh: 生年史无明文；字伯宗，耿况之孙，性慷慨多大略。
- id: guji-耿恭-event-1
  person: guji-耿恭
  type: appointment
  date: 74-10
  year_of: 74
  title_zh: 汉置西域都护，耿恭拜戊己校尉
  detail_zh: 窦固、耿秉破车师，固奏置西域都护、戊己校尉；恭为戊己校尉，屯金蒲城。
- id: guji-耿恭-event-2
  person: guji-耿恭
  type: diplomatic
  date: 74-11
  year_of: 74
  title_zh: 移檄乌孙宣喻威德
  detail_zh: 恭移檄乌孙、大昆弥，宣喻威德，乌孙皆遣使献马，求入侍天子。
- id: guji-耿恭-event-3
  person: guji-耿恭
  type: military
  date: 75-03
  year_of: 75
  title_zh: 匈奴攻金蒲城，毒矢却敌
  detail_zh: 北匈奴左鹿蠡王率焉耆、龟兹二万骑来攻；恭以毒药傅矢，发弩应弦而倒，创中皆沸，虏大惊遁去。
- id: guji-耿恭-event-4
  person: guji-耿恭
  type: military
  date: 75-05
  year_of: 75
  title_zh: 移据疏勒城，绝涧穿井拜泉
  detail_zh: 恭引兵居疏勒；匈奴绝其涧水，吏士饮马粪汁；恭穿井十五丈不得水，整衣向井再拜祷水，率士挽笼，飞泉涌出，以水示虏，虏兵大惊而去。
- id: guji-耿恭-event-5
  person: guji-耿恭
  type: military
  date: 75-11
  year_of: 75
  title_zh: 粮尽煮弩食筋，杀使拒降
  detail_zh: 帝崩后匈奴复围疏勒，粮尽煮弩筋食之，恭与士卒同甘苦；匈奴诱降许封白屋侯，恭手刃其使，坚守数月，吏士消尽。
- id: guji-耿恭-event-6
  person: guji-耿恭
  type: rescue
  date: 76-01
  year_of: 76
  title_zh: 汉军入疏勒相迎，十三将士归
  detail_zh: 汉军破车师，范羌率兵二千至疏勒城迎恭；城中闻汉兵皆称万岁，开城相持垂涕；随军还敦煌，吏士余十三人。
- id: guji-耿恭-event-7
  person: guji-耿恭
  type: appointment
  date: 76-02
  year_of: 76
  title_zh: 拜骑都尉
  detail_zh: 司徒鲍昱称恭"节过苏武，宜蒙爵土之赏"，不从；帝拜恭为骑都尉。
- id: guji-耿恭-event-death
  person: guji-耿恭
  type: death
  title_zh: 耿恭去世
  detail_zh: 卒年不详；其孤城守节事迹与"十三将士归玉门"流传后世。
