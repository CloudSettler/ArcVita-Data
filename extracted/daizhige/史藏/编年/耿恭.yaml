person:
  qid: guji-耿恭
  name_zh: 耿恭
  names:
    zh: 耿恭
    en: Geng Gong
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: unknown
      is_circa: true
  era: 东汉
  reign_ref: 汉明帝、汉章帝时期
  archetype: 孤城死守的忠节名将
  dilemmas:
  - 长期被围粮尽之际是否投降匈奴以求生
  - 救援与否之争中朝廷是否弃西域孤军
  lesson: 坚守气节与信念，绝境中不屈终能得救名垂青史
  summary_first_person: 姓耿，字伯宗，扶风茂陵人，耿况之孙。性慷慨多大略，好将帅之事。永平末为戊己校尉，屯金蒲城、后据疏勒城，以数百之众抗北匈奴数万，毒矢破敌、掘井拜泉、煮弩食筋，拒降手刃贼使。建初元年为汉军所救，归时吏士余十三人，鲍昱称节过苏武。后拜骑都尉，仅凭孤忠，为中国历史留下"十三将士归玉门"的悲壮篇章。
  source_urls:
  - https://zh.wikipedia.org/wiki/耿恭
