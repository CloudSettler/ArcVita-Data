endeavors:
- id: guji-胡三省-endeavor-1
  key: brewing
  name_zh: 承志发愿，集众说为注
  labels:
    zh: 承父遗志
  start_date: '1256'
  decisions:
  - date: '1256'
    title: 继承父志，汇集众说注通鉴
    rationale: 当时诸家音注乖谬甚多，其父有注鉴遗愿，故汇集史炤释文、费氏注、直音等众说而覃思为之注
- id: guji-胡三省-endeavor-2
  key: breakthrough
  name_zh: 宝祐登第，注业渐成
  labels:
    zh: 宝祐进士
  start_date: '1256'
  decisions:
  - date: '1256'
    title: 登宝祐进士第
    rationale: 科举入仕得以从容治学，贾似道曾馆之
- id: guji-胡三省-endeavor-3
  key: climax
  name_zh: 兵难藁三失，乙酉手抄定注
  labels:
    zh: 乱中定稿
  start_date: '1285'
  decisions:
  - date: '1285'
    title: 乙酉岁留袁氏塾，日手抄定注
    rationale: 三十年间兵难中书稿三次散失，遂于袁氏家塾每日手抄重定音注
- id: guji-胡三省-endeavor-4
  key: closure
  name_zh: 藏书窖中，书稿得免
  labels:
    zh: 窖藏保稿
  start_date: '1289'
  decisions:
  - date: '1289'
    title: 己丑寇作，以书藏窖中
    rationale: 避战乱将定注藏于地窖，书稿得以保全，其后定注藏于家
