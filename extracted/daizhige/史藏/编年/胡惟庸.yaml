  person_qid: guji-胡惟庸
  kind: anecdote
  related_endeavor_id: guji-胡惟庸-endeavor-1
  description: 帝曾问相于刘基，基言宪有相才无相器，汪广洋褊残，至于胡惟庸则曰"譬之驾，惧其偾辕也"，后"宪、广洋、惟庸皆败如基言"
