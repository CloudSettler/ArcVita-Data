      is_circa: true
  era: 明初（洪武年间）
  reign_ref: 明太祖洪武
  archetype: 权相
  dilemmas:
  - 刘基以"譬之驾，惧其偾辕"相谏，太祖仍用其为相，权势与隐患并存
  - 居左丞相之位，专决政务，与帝权相激
  lesson: 识人于微，刘基早料其败；居高位而恣纵横，终如预言倾覆
  summary_first_person: 我是定远人胡惟庸，洪武三年任中书省参知政事，四年正月李善长罢相后，我代汪广洋为左丞相。刘基昔日对我的评语是"譬之驾，惧其偾辕也"，并断言宪、广洋与我都将败亡。
