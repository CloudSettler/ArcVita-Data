  lesson: 大臣之节，宁赴东海而死，不为屈膝偷生之举
  summary_first_person: 我于绍兴八年任编修官，见朝廷使王伦使金议和，欲屈己就和，遂上疏极言屈膝之祸，乞斩秦桧、孙近、王伦，否则宁赴东海而死；书上连贬窜，绍兴十二年更被罗汝楫论列，除名编置新州。
  source_urls:
  - 续宋编年资治通鉴卷四至卷五
