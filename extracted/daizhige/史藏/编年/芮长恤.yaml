person:
  qid: guji-芮长恤
  name_zh: 芮长恤
  names:
    zh: 芮长恤
    en: Rui Changxu
  lifespan:
    birth:
      precision: unknown
      is_circa: false
    death:
      precision: unknown
      is_circa: false
  era: 清
  reign_ref: 康熙、乾隆
  archetype: scholar
  dilemmas:
  - 分注不出朱子之手，纠门人之失是否为对朱子不敬
  - 修补纲目分注是否僭逾之作
  lesson: 是非者天下之公，大儒之心廓然无我，考订讹漏正所以成全其学
  summary_first_person: 我名长恤，字蒿子，原名城，溧阳人。我读朱子《通鉴纲目》，合温公《通鉴》两书质对，考得分注实出于赵师渊之手。凡分注删削《通鉴》而失其本事者，我悉按原文列于某句某字之下，推求事理为之考辨，撰成《通鉴纲目分注拾遗》四卷，凡补葺四百六十余事。我纠师渊非纠朱子，冀为纲目之功臣，并非凭虚肆辨。
  source_urls:
  - https://www.kaogu.cn/（钦定四库全书《纲目分注拾遗》提要）
