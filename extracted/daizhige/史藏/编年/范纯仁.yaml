  archetype: 直言敢谏之臣
  dilemmas:
  - 骨鲠敢言而久谴不复, 直道与仕途得失难两全
  - 忠谏君主与明哲保身之间的取舍
  lesson: 骨鲠敢言者虽久遭贬谴, 仍不失其为国之直臣
  summary_first_person: 我以骨鲠敢言著称于谏官之列, 因直言时政得失而久遭贬谴不获召还。当时谏臣赵抃曾上疏列举吕诲、傅尧俞、范纯仁、吕大防、赵瞻、赵鼎、马默诸人, 称我等皆骨鲠敢言之士,
    久谴不复, 希望朝廷录用。
  source_urls:
  - https://zh.wikisource.org/wiki/續資治通鑑長編
