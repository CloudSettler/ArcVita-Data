  birth_date: 约-500
  death_date: -453
  era: 春秋末期
  reign_ref: 晋国智氏（荀氏）宗主，执政大夫
  archetype: 才高志骄而败于贪霸的春秋权臣
  dilemmas:
  - 才略冠世而骄狂凌人，蓝台之宴戏韩虎侮段规，树敌三卿
  - 与韩魏围赵于晋阳既是权力顶峰，也是三卿反噬之局
  - 灭范中行氏而专晋国政，食邑之贪终召灭族之祸
  lesson: 恃才而骄、贪而好胜者，胜局越多离倾覆越近；晋阳水困之际，韩魏倒戈，一夕而宗灭。
  summary_first_person: 我荀瑶继智氏而执政晋国，伐郑破齐、灭夙繇、袭卫，与韩魏瓜分范中行氏之地，晋出公出奔后国事皆决于我，可谓权倾一时。然我于蓝台戏韩虎而侮其相段规，又耻辱赵无恤，结怨日深。贞定王十六年，我与魏驹、韩虎围赵无恤于晋阳，水困之城将破，不料无恤之臣张孟谈密约韩魏反攻，三家灭我而分其地，智氏自此亡。
  source_urls:
  - https://ctext.org/
