  reign_ref: 隋开皇、唐武德
  archetype: 续经传学的儒门弟子
  dilemmas:
  - 师著元经以续春秋，续笔与作传如何发明师训而不僭越
  - 隋世避乱与出仕唐廷之间的出处抉择
  lesson: 受经而有守，述而不作，以传解经使师学得以传世。
  summary_first_person: 我薛收受经于文中子王通，夫子作元经以续春秋之法，我续其末卷并为传解，发明师训一二，冀使后王后儒常存常述。
