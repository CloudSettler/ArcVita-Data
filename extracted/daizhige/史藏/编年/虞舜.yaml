person:
  qid: guji-虞舜
  name_zh: 虞舜
  names:
    zh: 虞舜
    en: Shun of Yu
  lifespan:
    birth:
      date: 尧二十一载（约前2300年前后）
      precision: era
      is_circa: true
      raw: 甲子二十有一载虞舜生于诸冯
    death:
      precision: unknown
      is_circa: true
  era: 上古五帝时期
  reign_ref: 尧朝（受尧举用，后摄位称帝）
  archetype: 圣君·孝德典范
  dilemmas:
  - 父顽母嚚象傲而欲杀之，避逃受罪之间不失子道
  - 举鲧治水九载弗成，黜鲧而以其子禹继之
  lesson: 至孝可以谐至难之家，至公可以举天下之才
  summary_first_person: 我生于诸冯之姚墟，耕于历山，渔于雷泽，陶于河滨，虽父顽母嚚弟傲屡欲害我，我以孝不失子道而德闻天下。尧举我于侧陋，历试五典、百揆、四门、大麓，我皆能谐能叙能穆能弗迷，遂受尧天下。
  source_urls:
  - 古文传记（未标明具体出处，见原始文献）
