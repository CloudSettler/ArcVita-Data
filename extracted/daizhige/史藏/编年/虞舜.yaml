  - date: 尧七十二载
    title_zh: 纳于大麓而举禹益弃契
    rationale: 鲧殛羽山三年丧毕，乃举禹平水土，益掌火，弃教民播种，契为司徒
  - date: 尧七十载后
    title_zh: 流放四凶于四裔
    rationale: 宾于四门四门穆穆，殛鲧于羽山，放驩兜于崇山，以御螭魅
events:
- id: guji-虞舜-event-birth
  date: 尧二十一载甲子（约）
  year_of: 尧二十一载
  type: birth
  name_zh: 生于诸冯姚墟
  detail: 孟子曰舜生于诸冯；苏氏谓生于诸冯之姚墟，故为有姚，居于沩汭故为有沩
- id: guji-虞舜-event-filial-renown
  date: 尧六十载（舜年二十前后，史记作年二十以孝闻）
  year_of: 尧六十载
  type: career
  name_zh: 以孝闻，耕渔陶化
  detail: 父瞽瞍顽母嚚象傲，屡欲杀舜，舜避逃受罪不失子道；耕历山让畔，渔雷泽让居，陶河滨器不苦窳
- id: guji-虞舜-event-recommendation
  date: 尧七十载
  year_of: 尧七十载
  type: career
  name_zh: 四岳荐舜于侧陋，尧妻以二女
  detail: 明明扬侧陋，师锡曰有鳏在下曰虞舜；尧厘降二女于妫汭嫔于虞，曰我其试哉
- id: guji-虞舜-event-bigrod
  date: 尧七十一载前后
  year_of: 尧七十一载
  type: career
  name_zh: 慎徽五典纳于百揆宾于四门
  detail: 举八恺以揆百事莫不时叙，举八元布五教于四方，流四凶族于四裔
- id: guji-虞舜-event-dalu
  date: 尧七十二载
  year_of: 尧七十二载
  type: career
  name_zh: 纳于大麓，烈风雷雨弗迷
  detail: 使禹平水土、益掌火、弃教民播种、契为司徒；舜入山林川泽暴风雷雨行不迷，度量绝人而天地鬼神相之
- id: guji-虞舜-event-death
  year_of: 未载
  type: death
  name_zh: 卒年未详
  detail: 原文未及其卒
