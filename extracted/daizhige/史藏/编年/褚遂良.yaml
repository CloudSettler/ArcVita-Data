  birth_date: 约596年
  death_date: 658年
  era: 唐
  reign_ref: 唐太宗贞观年间至唐高宗显庆年间
  archetype: 忠直谏臣
  dilemmas:
  - 元舅与功臣不可诛，顾托之臣面对君主私愿进退两难
  - 叩首还笏直谏忤旨，宁受贬谪不曲从君诬
  lesson: 草茅承顾托，宁当惜残躯——受先帝顾命之托者当以忠直自守，不因忤旨获罪而悔。
  summary_first_person: 我是唐代名臣褚遂良，以书法与直谏著称。高宗欲废王皇后立武氏，我叩首还笏、力言不可，因此获罪，先贬潭州，终至忧愤而逝。乾隆皇帝读《通鉴辑览》至我贬潭州一节，嘉我忠悃，效我体裁御制诗以褒扬。
  source_urls:
  - https://zh.wikipedia.org/wiki/褚遂良
