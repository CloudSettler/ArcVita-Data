person:
  qid: guji-贾后
  name_zh: 贾后
  names:
    zh: 贾后
    en: Empress Jia
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: unknown
      is_circa: true
      raw: 卒年史传未详载（元康后失势被诛）
  birth_date: 生年不详
  death_date: 卒年不详
  era: 西晋
  reign_ref: 晋惠帝
  archetype: 后妃干政的乱世弄权者
  dilemmas:
  - 以妇弄权，弑姑废后，祸乱晋室
  - 专政纵私，招致诸王相残、天下大乱
  lesson: 权由私出、阴黜忠良者终致身败国乱
  summary_first_person: 我是贾充之女，晋惠帝的皇后。太子暗愚，实由我决政务，先除杨骏，废太后杨氏，又杀汝南王亮、卫瓘，废弑愍怀太子。史家谓"政由贾氏，天下乱矣"，晋室之祸实自我家始。
endeavors:
- id: guji-贾后-endeavor-1
  key: brewing
  name_zh: 入主东宫与册立为后
  labels:
    zh:
    - 东宫代笔
    - 册立皇后
  start_date: -0272~
  highlight_event_id: guji-贾后-event-hou
  decisions:
  - date: -0272-05~
    title_zh: 使张泓具草代太子答武帝疑事
    rationale: 太子不慧，试以疑事，贾氏令给事张泓具草，使太子写答，武帝悦
- id: guji-贾后-endeavor-2
  key: breakthrough
  name_zh: 诛杨骏专政
  labels:
    zh:
    - 连兵讨骏
    - 废太后
    - 杀亮瓘
  start_date: -0291~
  highlight_event_id: guji-贾后-event-sha-jun
  decisions:
  - date: -0291-03~
    title_zh: 与黄门董猛连兵讨杨骏，夷三族
    rationale: 杨骏受遗诏辅政而不能图贾后，贾后先发制之
  - date: -0291-06~
    title_zh: 使楚王玮杀汝南王亮、卫瓘，又归罪于玮而杀之
    rationale: 借宗室之手除异己，复以曲赦安逆党之心
- id: guji-贾后-endeavor-3
  key: climax
  name_zh: 废弑太子与末路
  labels:
    zh:
    - 废愍怀太子
    - 弑太子及谢太后
  start_date: -0299~
  highlight_event_id: guji-贾后-event-sha-taizi
  decisions:
  - date: -0299-12~
    title_zh: 废太子遹
    rationale: 太子遹非其所出，欲专朝权
- id: guji-贾后-endeavor-4
  key: closure
  name_zh: 身败名灭
  labels:
    zh:
    - 赵王伦起事
    - 见废被诛
  start_date: ~-0300
  highlight_event_id: guji-贾后-event-mie
events:
- id: guji-贾后-event-hou
  year_of: 290
  date: 0290-04~
  title_zh: 立为皇后
  detail_zh: 太熙元年夏四月，立太后杨氏、贾氏为皇后；史谓"不言立，非惠帝立之也"，政由贾氏，天下乱矣
- id: guji-贾后-event-sha-jun
  year_of: 291
  date: 0291-03~
  title_zh: 杀太傅杨骏，夷三族
  detail_zh: 永平元年辛卯，贾氏与黄门董猛连兵讨骏，骏逃于马厩，以戟杀之，杨氏夷三族，并废太后杨氏为庶人徙金墉城
- id: guji-贾后-event-sha-liang-guan
  year_of: 291
  date: 0291-06~
  title_zh: 杀汝南王亮及太保卫瓘
  detail_zh: 元康元年六月，使楚王玮杀亮及瓘，又归罪于玮而杀之，曲赦洛阳
- id: guji-贾后-event-bi-taihou
  year_of: 292
  date: 0292-02~
  title_zh: 弑太后于金墉城
  detail_zh: 元康二年二月己酉，贾庶人弑太后杨氏于金墉城，绝膳而崩，贬称庶人，不与其为后
- id: guji-贾后-event-sha-taizi
  year_of: 299
  date: 0299-12~
  title_zh: 杀皇太子遹及其母谢太后
  detail_zh: 元康九年十二月壬戌，贾庶人杀太子及其母谢太后；先有郊禖石破为愍怀不利之兆
- id: guji-贾后-event-mie
  year_of: 300
  date: 0300-05~
  title_zh: 贾后之祸平
  detail_zh: 赵王伦等起事，贾后失势被废诛，晋室由是大乱
- id: guji-贾后-event-death
  year_of: 300
  date: ~0300
  title_zh: 卒
  detail_zh: 失势被诛，史家谓晋室祸乱阴盛之报
- id: guji-贾后-event-birth
  year_of: ~257
  title_zh: 生
  detail_zh: 贾充之女，生年史未详载
