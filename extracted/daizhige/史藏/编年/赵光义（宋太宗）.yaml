  archetype: 翊运亲王
  dilemmas:
  - 陈桥之夜处于拥立与守节之间，既知诸将定议，则顺应大势，同时请以剽劫为戒以全京城人心
  - 赐名光义后由皇弟近臣渐预戎机，须在太祖功业之下谨慎自处
  lesson: 处非常之变者，顺天应人之外，尤须以约束军纪、保护都城人心为先。
  summary_first_person: 我本太祖之弟匡义，陈桥兵变之夜与赵普同受将士之议，劝喻约束军士勿事剽劫，遂成翊戴之功；建隆初受睦州防御使，赐名光义，复以皇弟为大内都点检，随太祖征泽潞，预于开创之业。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史全文卷一
