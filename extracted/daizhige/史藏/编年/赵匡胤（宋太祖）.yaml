  reign_ref: 建隆元年（960）受周禅即位，国号宋
  archetype: 开国之君／兵变受禅者
  dilemmas:
  - 受周世宗厚恩与应天顺人代周之间的忠义冲突
  - 强军拥立之下如何约束兵士、不掠都城以收人心
  - 削除李筠、李重进等后周旧将势力与安定天下的取舍
  lesson: 兴王易姓虽云天命，实系人心；纪律严明、秋毫无犯方能成大业
  summary_first_person: 我本后周殿前都点检，掌军政六年，士卒归心。建隆元年正月于陈桥驿为六军所迫，黄袍加身，我誓约将士毋凌少帝太后、毋纵兵大掠，整军入京，秋毫无犯，遂受禅即位，定国号曰宋。随后先平泽潞李筠，再破扬州李重进，混一之规摸渐成。我以不嗜杀人与严敕军士为治本，深知天命所在，唯在人心。
  source_urls:
  - guji://宋史全文/卷一/宋太祖一
