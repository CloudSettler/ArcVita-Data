  title_zh: 受周禅即皇帝位，国号曰宋
  description: 太祖诣崇元殿行禅代礼，用陶谷所进禅位制书，即位，群臣拜贺。乙巳诏定有天下之号曰宋，改元建隆，大赦；奉周帝为郑王。
  category: endeavor
  people_refs:
