  title_zh: 亲征泽潞，克泽州李筠赴火死
  description: 石守信等破贼三万余于泽州南；上至泽州督攻，马全义率敢死士先登，飞矢贯臂仍拔镞进战，辛巳克城，李筠赴火死，守节以潞州降被赦用。
