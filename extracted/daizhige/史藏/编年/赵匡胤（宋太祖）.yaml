  title_zh: 亲征扬州，攻拔其城李重进赴火死
  description: 十一月次大义驿，石守信奏扬州即破；是夕次其城下登时攻拔，李重进尽室赴火死。诏赈给城中民，胁隶军者赐衣屦纵之，役夫死城下者复其家三年。
  category: endeavor
