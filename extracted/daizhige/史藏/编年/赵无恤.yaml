  - 面对荀瑶侮慢，隐忍蓄力还是即刻翻脸
  - 晋阳被围之时，如何离间韩魏以绝境求生
  lesson: 深仇可忍，大业需借势而成。
  summary_first_person: 我本是赵氏庶子，因能忍而有后福。大夫荀瑶两次羞辱于我，我不动声色，只为来日报仇。晋阳被围三年，我使张孟谈私约韩魏，反手灭知氏而三分其地。灭代先姊而又悼之，可知我行事之忍。我立伯鲁之孙为后，迁治中牟，为赵氏开万世之基。
  source_urls:
  - http://example.com/guji/dashiji-juan1-2
