  dilemmas:
  - 金兵压境，坚守都城还是出逃避敌
  - 对金议和所索巨额金银，割地赔款还是整军抗战
  - 内禅之命难辞，受位于危乱之际
  lesson: 临危乏断、进退失据，纵有忠臣死守，亦难挽社稷倾颓之势。
  summary_first_person: 我赵桓，徽宗长子，元符三年生于坤宁殿，初名亶，累改赐名烜、桓。我列_wc庶长，早受经学，政和五年正位东宫为皇太子。宣和七年岁末，金人犯边，父皇仓促内禅，我涕泣力辞而不得，遂于危难之中即皇帝位，改元靖康。金兵围城期间，李纲力主坚守，我始定固守之策，然和战不定，听信宰臣议和，尽索金银以犒敌。后汴京城破，父子俱陷金营，北迁而终，北宋由此而亡，靖康之耻遂为千古之痛。
  source_urls:
  - https://www.ctext.org/wiki.pl?if=gb&res=620263
