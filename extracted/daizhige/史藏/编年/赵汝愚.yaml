  decisions:
  - date: 1195-03
    title_zh: 罢政即行，不辩不怨
    rationale: 内禅已定于太后与嗣君，力争徒滋党祸，退处以俟后之公论
  - date: 1195-12
    title_zh: 毅然就道赴永州贬所
    rationale: 人臣罪否自明于朝廷，抗命徒增罪状，忍辱行义以全大节
events:
- id: guji-zhaoruyu-event-birth
  date: 1140
  year_of: 1140
  type: birth
  title_zh: 生于饶州余干宗室之家
  detail_zh: 汉恭宪王赵元佐之后，生于宋绍兴十年
- id: guji-zhaoruyu-event-zhuangyuan
  date: 1163
  year_of: 1163
  type: career
  title_zh: 隆兴元年对策第一，状元及第
  detail_zh: 举进士第一释褐入仕，自此历官中外有声
- id: guji-zhaoruyu-event-shuyuan
  date: 1194-01
  year_of: 1194
  type: career
  title_zh: 入知枢密院事
  detail_zh: 光宗朝入秉枢府，位居机要，为异日定策之地
  endeavor_id: guji-zhaoruyu-endeavor-1
- id: guji-zhaoruyu-event-neichan
  date: 1194-07
  year_of: 1194
  type: political
  title_zh: 定策绍熙内禅，奉宁宗即位
  detail_zh: 孝宗崩，光宗疾不能丧，汝愚合韩侂胄请宪圣太后垂帘，以嘉王扩即皇帝位，社稷几危而复安
  endeavor_id: guji-zhaoruyu-endeavor-1
- id: guji-zhaoruyu-event-baixiang
  date: 1194-08
  year_of: 1194
  type: career
  title_zh: 拜右丞相，收召贤俊
  detail_zh: 内禅后自枢府登相位，引朱熹、彭龟年、黄裳诸贤列于朝
  endeavor_id: guji-zhaoruyu-endeavor-1
- id: guji-zhaoruyu-event-jushang
  date: 1194-09
  year_of: 1194
  type: political
  title_zh: 拒赏韩侂胄，祸根暗种
  detail_zh: 侂胄自以定策有功求节钺，汝愚谓宗室执政当守法度，仅除枢密都承旨，侂胄由是衔之
  endeavor_id: guji-zhaoruyu-endeavor-1
- id: guji-zhaoruyu-event-baxiang
  date: 1195-03
  year_of: 1195
  type: political
  title_zh: 遭劾罢相，出知福州
  detail_zh: 庆元元年李沐论汝愚同姓居相位将不利于社稷，遂罢右丞相，以观文殿学士出知福州
  endeavor_id: guji-zhaoruyu-endeavor-2
- id: guji-zhaoruyu-event-tanzhou
  date: 1195-06
  year_of: 1195
  type: political
  title_zh: 改知潭州，谪居湖南
  detail_zh: 台谏交章不已，改湖南安抚使知潭州，去国愈远
  endeavor_id: guji-zhaoruyu-endeavor-2
- id: guji-zhaoruyu-event-liufang
  date: 1195-12
  year_of: 1195
  type: political
  title_zh: 责授永州安置
  detail_zh: 庆元元年十一月责授宁远军节度副使，永州安置，凛冬就道
  endeavor_id: guji-zhaoruyu-endeavor-2
- id: guji-zhaoruyu-event-death
  date: 1196-01
  year_of: 1196
  type: death
  title_zh: 贬途病卒于衡州
  detail_zh: 庆元二年正月行至衡州，愤恚发病而卒，年五十七
  endeavor_id: guji-zhaoruyu-endeavor-2
- id: guji-zhaoruyu-event-zhaoxue
  date: 1208
  year_of: 1208
  type: rehabilitation
  title_zh: 韩侂胄诛后昭雪，追谥忠定
  detail_zh: 开禧三年侂胄伏诛，朝廷复汝愚官爵，追封沂国公，赐谥忠定，天下之冤乃白
  endeavor_id: guji-zhaoruyu-endeavor-2
