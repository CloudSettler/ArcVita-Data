  decisions:
  - date: 1194-07
    title_zh: 请宪圣太后垂帘定策
    rationale: 光宗疾不能执丧，非禀太后之命则内禅无名，人心不固
  - date: 1194-09
    title_zh: 拒韩侂胄节度使之赏
    rationale: 祖宗之法无私赏，宗室执政尤当避嫌，宁结怨于近幸，不启侥幸之门
- id: guji-zhaoruyu-endeavor-2
  name_zh: 庆元贬谪与身后昭雪
  role_zh: 观文殿学士、责授宁远军节度副使
  labels:
