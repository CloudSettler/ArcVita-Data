person:
  qid: guji-zhaoruyu
  name_zh: 赵汝愚
  names:
    zh: 赵汝愚
    en: Zhao Ruyu
  lifespan:
    birth:
      date: 1140
      precision: year
      is_circa: true
      raw: 宋绍兴十年，生于饶州余干
    death:
      date: 1196-01
      precision: month
      is_circa: true
      raw: 宋庆元二年正月，贬途卒于衡州
  birth_date: 1140
  death_date: 1196-01
  era: 南宋
  reign_ref: 宋光宗、宋宁宗两朝
  archetype: 定策安社稷的宗室宰相
  dilemmas:
  - 宗室之亲位至宰辅，功高震主，同姓执政反成罪状
  - 拒韩侂胄冒赏以守法度，守正却招致权臣倾陷
  lesson: 定策之功可再造社稷，而不善防权柄之隙者终为权臣所噬；守正之外尤须防微杜渐
  summary_first_person: 我是赵汝愚，字子直，绍兴十年生于宗室余干之族，汉恭宪王元佐之后。隆兴元年对策第一，历官中外。绍熙五年孝宗上宾，光宗以疾不能执丧，中外汹汹，我以知枢密院事定策，请宪圣太后垂帘，奉嘉王即位，是为宁宗，宋室几危而复安。既拜右丞相，收召朱熹、彭龟年诸贤。韩侂胄自谓有定策功求节钺，我持祖宗法度拒之，庆元元年竟遭同姓居相位之诬，罢相贬永州，二年正月行至衡州愤恚而卒，年五十七。后侂胄伏诛，朝廷复我官爵，赐谥忠定。
  source_urls:
  - https://zh.wikisource.org/wiki/兩朝綱目備要
  - https://zh.wikipedia.org/wiki/赵汝愚
