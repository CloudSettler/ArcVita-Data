    death:
      date: '1266'
      precision: year
      is_circa: true
      raw: ''
  birth_date: '1186'
  death_date: '1266'
  era: 南宋
  reign_ref: 理宗（宝庆至端平年间）
  archetype: 武将兼疆臣
  dilemmas:
  - 端平入洛之议：抚定中原之志与粮饷不继、兵力不足之间的矛盾
  - 李全叛乱：忠义军尾大不掉，剿抚两难
  lesson: 兵未动而粮先行；虚内事外、千里馈饫之危，杜杲早已预见
  summary_first_person: 我是南宋理宗朝边帅赵葵，与兄赵范、全子才建守河据关之议，端平初督军进汴、遣军洛阳，因粮尽而败退；此前我在扬州设伏，终于平定叛将李全，又曾乞经理营田以固边储。
  source_urls:
  - https://zh.wikisource.org/wiki/宋季三朝政要
endeavors:
- id: guji-赵葵-endeavor-1
  name_zh: 平定李全之乱
  phases:
