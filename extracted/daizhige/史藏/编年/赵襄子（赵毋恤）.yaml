person:
  qid: guji-赵襄子
  name_zh: 赵襄子
  names:
    zh: 赵襄子（赵毋恤）
    en: Zhao Xiangzi (Zhao Wuxu)
  lifespan:
    birth:
      date: -0487
      precision: approximate
      is_circa: true
      raw: 生年不详，约战国初期
    death:
      date: '-0425'
      precision: approximate
      is_circa: true
      raw: 卒年不详
  birth_date: -0487
  death_date: '-0425'
  era: 春秋战国之际
  reign_ref: 晋国赵氏宗主
  archetype: 沉毅忍辱、以退为进的守成开拓者
  dilemmas:
  - 面对智伯索地，宁被围攻而不割让祖业
  - 弃长子近城与邯郸富邑，选择民心所归的晋阳
  lesson: 城郭之固不如民心之和，忍一时之辱方能成千秋之业
  summary_first_person: 我乃赵简子幼子毋恤，以诵简得立为后。智伯索地于我，我不与，遂奔晋阳，坚守孤城，民无叛意。终联合韩魏灭智氏，三分晋国，赵氏由大夫而列于诸侯。
  source_urls:
  - https://zh.wikisource.org/wiki/資治通鑑/卷第一
