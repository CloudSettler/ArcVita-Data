person:
  qid: guji-赵鼎
  name_zh: 赵鼎
  names:
    zh: 赵鼎
    en: Zhao Ding
  lifespan:
    birth:
      date: '1085'
      precision: year
      is_circa: true
      raw: 宋神宗元丰八年（1085），解州闻喜人
    death:
      date: '1147'
      precision: month
      is_circa: true
      raw: 宋高宗绍兴十七年（1147）八月，绝食卒于吉阳军贬所
  birth_date: '1085'
  death_date: '1147'
  era: 南宋
  reign_ref: 宋高宗建炎、绍兴年间
  archetype: 主战中兴宰相
  dilemmas:
  - 和战大计之争：守中原正朔则并逆强敌与主和权臣
  - 荐贤御侮与党争倾轧：荐岳飞、援张浚以图中兴，反遭构陷贬窜岭海
  lesson: 危难之际擎持国本者，虽贬死遐荒，气节足为百世师
  summary_first_person: 我赵鼎，解州闻喜人，崇宁间登进士第。建炎三年扬州仓皇之变，我身在扈从之列，护驾南渡，后著《扈从录》纪其颠沛。绍兴间两度拜相，荐岳飞经略荆襄，与张浚共图中兴。及秦桧主和，我力争不从而罢相，贬潮州、移吉阳军，终以绝食明志，不肯附和议以负社稷。
  source_urls:
  - https://zh.wikisource.org/wiki/中興小紀
  - https://zh.wikipedia.org/wiki/赵鼎
