    rationale: 非良将不能恢复中原，岳飞忠勇可用，故力荐倚任之
  - date: 1138-10
    title_zh: 力争寝和议、决意求去
    rationale: 以国体屈膝金人为万世之耻，宁去相位不苟同和议
