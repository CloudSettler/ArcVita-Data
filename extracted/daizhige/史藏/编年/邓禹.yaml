  - 于乱世中选择谁为可托之君
  lesson: 知人之明与适时而动的谋略，功成而不傲
  summary_first_person: 我邓禹，字仲华，南阳新野人。少以德行称，游学长安时见解于我知非常人。人多举荐我于更始，我不肯从；闻世祖平河北，遂杖策追至邺。我进策言更始庸碌，天下人思汉，劝世祖收英雄、定三州，南面号令天下。世祖留我宿，号我邓将军。
  source_urls:
  - 后汉光武皇帝纪二卷第二
