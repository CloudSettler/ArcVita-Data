  title_zh: 桓公为周司徒
  description: 周幽王八年，桓公为司徒，甚得周众与东土之人。
  type: 政治事件
  source_urls:
  - https://zh.wikisource.org/wiki/國語/鄭語
- id: guji-郑桓公-event-shibo
  date: -774
  year_of: -774
  title_zh: 问于史伯谋郑之东迁
  description: 桓公惧王室之乱祸及于己，问史伯何所可以逃死。史伯论及和同之理、周室必弊，建议寄孥与贿于虢、郐之间，并预言周衰之后晋、秦、齐、楚将兴。
  type: 谋议事件
  source_urls:
  - https://zh.wikisource.org/wiki/國語/鄭語
- id: guji-郑桓公-event-dongxi
  date: -773
  year_of: -773
  title_zh: 东寄帑与贿，虢郐献十邑
  description: 桓公东徙其民于洛东，虢、郐果献十邑，竟国之，为郑国东迁奠定根基。
  type: 政治事件
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷042
- id: guji-郑桓公-event-death
  date: -771
  year_of: -771
  title_zh: 犬戎之难，桓公殉难
  description: 幽王十一年，犬戎杀幽王于骊山下，并杀桓公，子武公掘突立。
  type: 死亡事件
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷042
