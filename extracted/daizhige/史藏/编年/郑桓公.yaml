  reign_ref: 周宣王二十二年（前806年）始封于郑
  archetype: 审时度势的宗室封君
  dilemmas:
  - 预见周室将衰，须为宗族寻求安身之地与政治退路
  - 身为周司徒，忠于王室与保全郑国自立之间难以两全
  lesson: 识势于未乱，谋退路于盛时；寄孥于邻，方免覆巢之祸
  summary_first_person: 我是郑桓公友，周宣王之母弟，前806年始封于郑。幽王时我任司徒，深得周众之心。眼见王室多故、戎狄必昌，我问计于史伯，采纳其谋，东寄帑与贿于虢、郐之间，十邑皆有寄地，为郑国东迁奠定根基。前771年骊山之难，犬戎杀幽王，我以身殉之，子武公掘突嗣立。
  source_urls:
  - https://zh.wikisource.org/wiki/史記/卷042
  - https://zh.wikisource.org/wiki/國語/鄭語
