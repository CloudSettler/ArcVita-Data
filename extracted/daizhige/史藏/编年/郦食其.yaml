    en: Li Yiji
  era: 秦末汉初
  reign_ref: 汉王刘邦（汉元年—汉四年）
  archetype: 辩士谋臣
  dilemmas:
  - 说齐已下而韩信袭齐，被疑卖己，遭烹杀
  lesson: 游说之功可抵数十万兵，然无实力背书则功成身危
  summary_first_person: 我是郦食其，楚汉之际著名的说客。楚汉相争时我向汉王献策，力主急取荥阳、据敖仓之粟，塞成皋之险，以形制之势定天下所归。其后燕赵已定，惟齐未下，我自请奉诏说齐王田广与相国田横，使齐七十馀城不战而下，为汉东藩。不料韩信乘我方说降齐国之机，袭破齐历下军；田广田横以为我卖己，遂烹杀了我。我以一介儒生之口，下齐七十馀城，终以身殉。
