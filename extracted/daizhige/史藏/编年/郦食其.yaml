events:
- id: guji-郦食其-event-aocang
  date: -204-08
  year_of: -204
  title_zh: 说汉王急取荥阳，据敖仓之粟，塞成皋之险
  description: 汉数困于荥阳成皋，欲捐成皋东屯巩雒。郦食其进言敖仓藏粟甚多，急复进兵收取荥阳、据敖庾之粟、塞成皋之险、杜太行之道、距飞狐之口、守白马之津，以示诸侯形制之势，则天下知所归。汉王从之，乃谋取敖仓。
  participants:
  - guji-郦食其
  location_zh: 荥阳·敖仓
- id: guji-郦食其-event-shuoqi
  date: -204-08
  year_of: -204
  title_zh: 奉诏使说齐王田广及相国田横
  description: 郦食其又说汉王：方今燕赵已定，惟齐未下；田广据千里之齐，将二十万众军历下，齐人多变诈，虽数十万师未可岁月破，请奉明诏说齐王使为汉称东藩。王曰善，乃使食其说齐王广及相国横。
  participants:
  - guji-郦食其
  location_zh: 历下·临淄
- id: guji-郦食其-event-death
  date: -203-10
  year_of: -203
  title_zh: 韩信袭破齐历下军，郦食其被田广烹杀
  description: 四年冬十月，韩信袭破齐历下军，入临菑。齐王田广、相国田横以为郦食其卖己，遂烹杀之；田广东走高密，田横走博。
  participants:
  - guji-郦食其
  location_zh: 临菑
