person:
  qid: guji-金日磾
  name_zh: 金日磾
  names:
    zh: 金日磾
    en: Jin Midi
  lifespan:
    birth:
      date: -134
      precision: year
      is_circa: true
      raw: 生年史无明载（约武帝时期）
    death:
      date: -86
      precision: year
      is_circa: false
  birth_date: -134
  death_date: -86
  era: 西汉武帝、昭帝时期
  reign_ref: 汉武帝、汉昭帝
  archetype: 忠谨降臣／顾命辅政大臣
  dilemmas:
  - 以匈奴休屠王太子之身仕汉，何以自处并取信于汉廷
  - 霍光让贤时辞让辅政首席，恐匈奴轻汉
  - 察觉莽何罗兄弟谋反，隐忍不发、静待时机
  lesson: 忠谨自持、临危果决者虽出于异族亦可为汉室柱石
  summary_first_person: 我是匈奴休屠王太子，归汉后为武帝所信，任侍中驸马都尉。我察觉莽何罗兄弟谋反，趁其袖刃入殿之机将其抱住擒缚，救主于卧榻之侧。武帝临终托孤，霍光让位于我，我以“臣外国人，将令匈奴轻汉”坚辞，遂受遗诏与霍光等辅佐少主，拜车骑将军，辅政岁余病薨，谥敬侯。
  source_urls:
  - https://zh.wikisource.org/wiki/前汉纪
