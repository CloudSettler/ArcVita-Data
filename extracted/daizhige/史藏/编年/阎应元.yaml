  dilemmas:
  - 降可保富贵，守则必死：面对刘良佐劝降，坚守故国之义
  - 以一典史之微职，担起守城大任
  lesson: 位卑未敢忘忧国；我一典史耳，犹不忘故国
  summary_first_person: 我是阎应元，字丽亨，顺天通州人。崇祯中任江阴典史，曾手射海盗立功。剃发令下，江阴士民起义守城，陈明遇推我为主。我入城盟众、治军械、分堡坚守，拒清军十万围攻八十余日，屡出奇计破敌，骂退劝降的刘良佐。城破被执，不屈而死。
