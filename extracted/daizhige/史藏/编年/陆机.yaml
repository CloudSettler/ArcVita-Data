person:
  qid: guji-陆机
  name_zh: 陆机
  names:
    zh: 陆机
    en: Lu Ji
  lifespan:
    birth:
      date: '261'
      precision: year
      is_circa: true
      raw: 吴永安四年（约261年）
    death:
      date: '303'
      precision: year
      is_circa: false
      raw: 西晋太安二年（303年）遇害
  birth_date: '261'
  death_date: '303'
  era: 西晋
  reign_ref: 晋惠帝（司马衷），兼历晋武帝朝
  archetype: 文宗兼史家的乱世才士
  dilemmas:
  - 仕与不仕——吴亡之后，故大司马之孙仕于灭吴之晋，忠孝与功名难以两全
  - 直笔与避讳——以本朝人撰本朝编年史，直书惠帝朝乱政，实录易触时忌
  - 依附与自全——吴人身处嫌疑、无援于朝，委质成都王颖以求自存，却卷入八王之乱终遭杀身
  lesson: 才高冠世不能免谗，临刑犹叹华亭鹤唳不可复闻——乱世之中文名难保其身，惟直笔遗篇自足传世。
  summary_first_person: 我是陆机，字士衡，吴郡人，故大司马陆逊之孙。吴亡入洛，与弟陆云并以文才倾动京师；历太子洗马、著作郎，撰编年《晋纪》与《晋惠帝起居注》以存一朝实录；后依成都王颖，拜后将军、河北大都督，兵败河桥，为谗所构遇害，临刑叹华亭鹤唳岂可复闻。
  note_zh: 本篇所据《众家编年体晋史》目录仅明载其撰《晋纪》《晋惠帝起居注》；生平行迹参据《晋书》通行记载，凡系年不确者皆标为约。
endeavors:
- id: guji-陆机-endeavor-1
  name_zh: 修撰《晋纪》与《晋惠帝起居注》
  labels:
    zh: 编年史家
  summary_zh: 以本朝著作之职，用编年体撰《晋纪》，兼记《晋惠帝起居注》，为众家编年体晋史之一家。
  phases:
  - key: brewing
    name_zh: 入洛典著作，文档在握
    labels:
      zh: 任著作郎
    start_date: '289'
    highlight_event_id: guji-陆机-event-ruoluo
  - key: breakthrough
    name_zh: 起笔惠帝朝记
    labels:
      zh: 起居注
    start_date: '291'
    highlight_event_id: guji-陆机-event-qijuzhu
  - key: climax
    name_zh: 编年成纪
    labels:
      zh: 晋纪
    start_date: '299'
    highlight_event_id: guji-陆机-event-jinji
  - key: closure
    name_zh: 身死而稿佚，赖后世辑存
    labels:
      zh: 遗文辑存
    start_date: '303'
    highlight_event_id: guji-陆机-event-death
  decisions:
  - date: '291'
    title_zh: 以本朝人直修本朝史
    rationale: 身居著作、亲历惠帝朝政，取编年直书以存实录
  - date: '299'
    title_zh: 编年与起居注两体并举
    rationale: 起居注详一日之迹，《晋纪》总一朝之变，两体相济成史
- id: guji-陆机-endeavor-2
  name_zh: 文章诗赋之业
  labels:
    zh: 太康文宗
  summary_zh: 亡国后闭门勤学十年，入洛以文倾动一时，作《文赋》论文章甘苦，为一代文宗。
  phases:
  - key: brewing
    name_zh: 吴亡退居旧里，闭门勤学
    labels:
      zh: 读书十年
    start_date: '280'
    highlight_event_id: guji-陆机-event-wufall
  - key: breakthrough
    name_zh: 二陆入洛，名动京华
    labels:
      zh: 文名鹊起
    start_date: '289'
    highlight_event_id: guji-陆机-event-ruoluo
  - key: climax
    name_zh: 撰《文赋》，以赋论文
    labels:
      zh: 文论立极
    start_date: '292'
    highlight_event_id: guji-陆机-event-wenfu
  - key: closure
    name_zh: 临刑之叹，归于华亭
    labels:
      zh: 鹤唳余音
    start_date: '303'
    highlight_event_id: guji-陆机-event-death
  decisions:
  - date: '289'
    title_zh: 应召入洛，以文干世
    rationale: 故国已亡，所恃惟文章声名，遂与弟云北上求仕
  - date: '292'
    title_zh: 作《文赋》以论文
    rationale: 尽创作甘苦之思，为后世文章立法度
- id: guji-陆机-endeavor-3
  name_zh: 出仕与军旅，卷入八王之乱
  labels:
    zh: 陆平原
  summary_zh: 赵王伦败后获救于成都王颖，遂委质其府，任平原内史；太安二年拜后将军、河北大都督，兵败河桥，谗起见杀。
  phases:
  - key: brewing
    name_zh: 历太子洗马、著作郎诸职
    labels:
      zh: 朝序渐进
    start_date: '289'
    highlight_event_id: guji-陆机-event-ruoluo
  - key: breakthrough
    name_zh: 委质成都王颖，任平原内史
    labels:
      zh: 依强藩
    start_date: '301'
    highlight_event_id: guji-陆机-event-weizhi
  - key: climax
    name_zh: 拜后将军河北大都督，总二十万众
    labels:
      zh: 总戎北讨
    start_date: 303-08
    highlight_event_id: guji-陆机-event-dadudu
  - key: closure
    name_zh: 建春门之败，临刑鹤唳
    labels:
      zh: 败亡夷灭
    start_date: 303-09
    highlight_event_id: guji-陆机-event-death
  decisions:
  - date: '301'
    title_zh: 遭疑获释后委质成都王颖
    rationale: 吴人身处嫌疑，无援于朝，依附强藩以自全，却由此深入诸王之争
  - date: 303-08
    title_zh: 固辞大都督不获，勉力受任
    rationale: 以吴人总吴士，功成则谗必先至，然辞之不得，惟以父祖旧勋自励一搏
events:
- id: guji-陆机-event-birth
  type: birth
  name_zh: 陆机生于吴郡华亭
  date: '261'
  precision: year
  is_circa: true
  year_of: 261
  description_zh: 吴郡陆氏之后、大司马陆逊之孙出生，字士衡；一说生于262年。
  source_zh: 《晋书·陆机传》通行记载
- id: guji-陆机-event-wufall
  type: career
  name_zh: 吴亡，退居旧里闭门勤学
  date: '280'
  precision: year
  is_circa: false
  year_of: 280
  description_zh: 年二十而吴为晋所灭，退居旧里，闭门勤学积有十年，后作《辨亡论》论吴所以亡。
  source_zh: 《晋书·陆机传》通行记载
- id: guji-陆机-event-ruoluo
  type: career
  name_zh: 与弟陆云入洛，名动京师
  date: '289'
  precision: year
  is_circa: true
  year_of: 289
  description_zh: 太康末与弟云携文入洛，才藻新丽倾动一时，时称二陆；后历太子洗马、著作郎。
  source_zh: 《晋书·陆机传》通行记载
- id: guji-陆机-event-qijuzhu
  type: career
  name_zh: 起撰《晋惠帝起居注》
  date: '291'
  precision: year
  is_circa: true
  year_of: 291
  description_zh: 惠帝即位之初，机以本朝著作之职记一朝言动，为编年晋史之辅翼。
  source_zh: 《众家编年体晋史》目录（《晋纪》《晋惠帝起居注》……陆机）
- id: guji-陆机-event-wenfu
  type: career
  name_zh: 作《文赋》论文章之理
  date: '292'
  precision: year
  is_circa: true
  year_of: 292
  description_zh: 备言创作甘利害钝，收百世之阙文、采千载之遗韵，为文学理论名篇；系年诸说并存，姑系于此。
  source_zh: 《文赋》传世文本，通行系年
- id: guji-陆机-event-jinji
  type: career
  name_zh: 撰编年体《晋纪》
  date: '299'
  precision: year
  is_circa: true
  year_of: 299
  description_zh: 以编年体述晋史，与《晋惠帝起居注》并行，后世辑目列于众家编年体晋史。
  source_zh: 《众家编年体晋史》目录
- id: guji-陆机-event-weizhi
  type: career
  name_zh: 委质成都王颖，任平原内史
  date: '301'
  precision: year
  is_circa: true
  year_of: 301
  description_zh: 赵王伦败后机见疑被收，赖成都王颖救免，遂委质于颖，任平原内史，世称陆平原。
  source_zh: 《晋书·陆机传》通行记载
- id: guji-陆机-event-dadudu
  type: career
  name_zh: 拜后将军、河北大都督
  date: 303-08
  precision: month
  is_circa: true
  year_of: 303
  description_zh: 太安二年秋，成都王颖起兵讨长沙王乂，以机为后将军、河北大都督，督二十余万人，机固辞不许。
  source_zh: 《晋书·陆机传》通行记载
- id: guji-陆机-event-heqiao
  type: career
  name_zh: 建春门之败
  date: 303-09
  precision: month
  is_circa: true
  year_of: 303
  description_zh: 军至河桥，与长沙王乂战于建春门，大败，赴七里涧死者如积；宦人孟玖等因谗机有异志。
  source_zh: 《晋书·陆机传》通行记载
- id: guji-陆机-event-death
  type: death
  name_zh: 遇害夷三族，临刑叹华亭鹤唳
  date: 303-11
  precision: month
  is_circa: true
  year_of: 303
  description_zh: 为牵秀所收，临刑叹曰华亭鹤唳岂可复闻，遂遇害，夷三族，弟云后亦连坐被害。
  source_zh: 《晋书·陆机传》通行记载
