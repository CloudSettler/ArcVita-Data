  era: 宋末
  reign_ref: '[宋]端宗景炎、[宋]帝昺祥兴'
  archetype: 忠节殉国之臣
  dilemmas:
  - 社稷将倾，奉二王出奔海上，于存续宋统与势不可为之间抉择
  - 厓山之败，负帝赴海殉国，以死全节
  lesson: 国亡君在，人臣当以死奉社稷，虽知不可为而为之
  summary_first_person: 我是陆秀夫，宋末之臣。临安陷后，我与苏刘义等闻二王在温州，以兵来会，共奉益王昰入闽兴复。景炎元年，益王即位于福州，我任佥书院事。后厓山之役，宋室终不能支，我以死殉国，不负赵氏。
