  dilemmas:
  - 布衣直言宰相之过，罪当万死，仍冒死进言
  - 任贤与去邪、社稷存亡与个人安危之间的抉择
  lesson: 奋不顾身、死生以之者，社稷之臣也
  summary_first_person: 我是太学生陈东，靖康元年金人围城之际，我与同学伏阙上书，言任贤勿贰、去谗勿疑，请复用李纲而斥李邦彦、白时中等社稷之贼，以安中外之心、保祖宗疆土。
