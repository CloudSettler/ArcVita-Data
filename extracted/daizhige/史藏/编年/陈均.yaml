person:
  qid: guji-陈均
  name_zh: 陈均
  names:
    zh: 陈均
    en: Chen Jun
  lifespan:
    birth:
      date: 1174
      precision: year
      is_circa: true
      raw: 生年无考，约当南宋淳熙间
    death:
      date: 1244
      precision: year
      is_circa: true
      raw: 卒年无考，约当理宗淳祐前后
  birth_date: 约1174年
  death_date: 约1244年
  era: 南宋
  reign_ref: 宁宗嘉定至理宗端平间
  archetype: 布衣史学家
  dilemmas:
  - 举子业功名与删繁撮要著史之志的两难，累举恩当对大廷而不愿就
  - 私家裒辑国史恐犯僭拟之嫌，然志在便学者省阅、有补于世
  - 叹服朱子通鉴纲目义例精密，然本朝事惟据事实录，不敢尽同文公褒贬之法
  lesson: 足不出书室、口不及世事，积十余年之力删繁撮要，以布衣成九朝信史，用志非世俗所可量
  summary_first_person: 我陈均，字平甫，号云岩，兴化莆田人，前太学生，从祖为丞相正献公陈俊卿。幼侍从祖，得观国朝史录及眉山李氏续通鉴长编，酷嗜之而患篇帙浩繁，立志删繁撮要为一书以便省阅；时方从事举子业未果。晚滞场屋，决意退藏林壑，出入名流之门，得尽见司马文正公稽古录、徐度国纪、九朝通略等十数家，博考互订，纲本李氏，目仿朱子而时有修饰节文，据事直书不加褒贬。积十余年之力，纂成皇朝编年举要备要，起太祖讫钦宗凡九朝百六十七年。真德秀、林岊为之序，郑性之为跋，朋友锓木传之。端平初朝廷宣取，赐官迪功郎；复辑中兴举要备要各十四卷，惜后皆散佚。
  source_urls:
  - https://zh.wikisource.org/wiki/九朝編年備要
  - https://zh.wikipedia.org/wiki/陳均_(南宋)
endeavors:
- id: guji-陈均-endeavor-1
  name_zh: 纂修皇朝编年举要备要（九朝编年备要）
  summary_zh: 以李焘长编为纲本，参司马光、徐度、赵汝愚等十数家博考互订，删繁撮要勒成一编，起建隆讫靖康凡九朝百六十七年，为学林称许
  phases:
  - key: brewing
    name_zh: 幼嗜史学
    labels:
      zh: 侍观史录，患长编浩繁，立志删繁撮要
    start_date: 约1186
    highlight_event_id: guji-陈均-event-read-history
  - key: breakthrough
    name_zh: 弃业藏壑
    labels:
      zh: 晚滞场屋，退藏林壑，博采十数家互订
    start_date: 约1210
    highlight_event_id: guji-陈均-event-retire
  - key: climax
    name_zh: 积年纂成
    labels:
      zh: 朝夕矻矻，积十余年之力删繁撮要成编
    start_date: 约1218
    highlight_event_id: guji-陈均-event-book-done
  - key: closure
    name_zh: 序跋宣取
    labels:
      zh: 真德秀林岊作序、郑性之跋之，端平宣取赐官迪功郎
    start_date: 1229
    highlight_event_id: guji-陈均-event-bestow
  decisions:
  - date: 约1210
    title_zh: 决意弃举子业，退藏林壑
    rationale: 晚滞场屋不遇，遂专意删繁撮要以便省阅
  - date: 约1218
    title_zh: 纲取司马朱子之法，目本李焘而加节文
    rationale: 叹通鉴纲目义例精密，然本朝事惟据事实录，寓褒贬则不敢尽同文公
  - date: 约1228
    title_zh: 累举恩当对大廷，不愿就
    rationale: 不愿就廷对，独朝夕矻矻于纂述，积十余年之力成一家之史
  - date: 1229
    title_zh: 听朋友锓木刊行，与学者共之
    rationale: 本欲秘为私诵记诵之具，经同志劝勉，遂相与锓木流传
- id: guji-陈均-endeavor-2
  name_zh: 续纂中兴举要备要
  summary_zh: 九朝编成后拟次及中兴之后，据马端临文献通考著录撰中兴举要十四卷、备要十四卷，惜后世并皇朝编年举要皆佚，今独存九朝编年备要三十卷
  phases:
  - key: brewing
    name_zh: 次及中兴
    labels:
      zh: 九朝编成，又拟次及高宗以后中兴之事
    start_date: 约1230
    highlight_event_id: guji-陈均-event-zhongxing-plan
  - key: breakthrough
    name_zh: 撰成中兴二书
    labels:
      zh: 撰中兴举要十四卷、备要十四卷
    start_date: 约1235
    highlight_event_id: guji-陈均-event-zhongxing-done
  - key: closure
    name_zh: 二书散佚
    labels:
      zh: 中兴举要备要与举要皆佚，独存九朝编年备要
    start_date: 约1300
    highlight_event_id: guji-陈均-event-books-lost
