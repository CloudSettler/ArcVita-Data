  dilemmas:
  - 书名袭"通鉴"之旧而体例实仿纲目，名不副实
  - 以褒贬自任，持论偏宋而轻信传闻、引据疏舛
  lesson: 作史当明大义而慎考据，褒贬与实录不可偏废
  summary_first_person: 我名陈桱，字子经，奉化人，流寓长洲，官至翰林学士。我家世传史学，祖著、父泌皆有述作。我以司马氏《通鉴》与朱子《纲目》皆终于五代，遂著《通鉴续编》二十四卷，首述盘古至高辛以补金履祥前编之缺，次志契丹得国之故，余皆宋事，终于二王，以继通鉴之后。
