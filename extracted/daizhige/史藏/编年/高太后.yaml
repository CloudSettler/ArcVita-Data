  - key: climax
    name_zh: 却还政之议
    labels:
      zh:
      - 约以还政
    start_date: '1091'
    highlight_event_id: guji-高太后-event-genghua
  - key: closure
    name_zh: 临终嘱诰
    labels:
      zh:
      - 遗训告戒
    start_date: 1093-09
    highlight_event_id: guji-高太后-event-death
  decisions:
  - date: '1085'
    title_zh: 抑制母族高氏子弟恩赏
    rationale: 以外家不预政为家法，杜绝外戚干政之讥
