  decisions:
  - date: '1085'
    title_zh: 迎立神宗第六子赵熙即位
    rationale: 神宗病笃，拥立幼子，以祖母之亲稳定皇统
  - date: '1085'
    title_zh: 起用司马光执政
    rationale: 倚重旧党重臣，以更张熙宁新法、收拾人心
  - date: '1086'
    title_zh: 支持尽罢免役、保甲、方田等新法
    rationale: 认为新法扰民，命司马光、吕公著以数月之内尽复祖宗旧制
