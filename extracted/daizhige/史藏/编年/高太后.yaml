person:
  qid: guji-高太后
  name_zh: 高太后
  names:
    zh: 高太后
    en: Grand Empress Dowager Gao
  lifespan:
    birth:
      date: '1032'
      precision: year
      is_circa: true
      raw: 约1032年
    death:
      date: '1093-10-12'
      precision: day
      is_circa: false
      raw: 元祐八年九月
  birth_date: '1032'
  death_date: '1093-10-12'
  era: 北宋
  reign_ref: 元祐（哲宗朝垂帘听政）
  archetype: 临朝听政的太后
  dilemmas:
  - - 新法存废
    - 在哲宗年幼、神宗新法积弊与朝臣分裂之间抉择全面更化还是折中延续
  - - 权力边界
    - 以祖母亲政垂帘，需在维护皇权正统与不僭越帝位之间自处
  lesson: 权柄在手而不贪位，更化务尽而慎于用人，然身后党争之祸已伏於其间
  summary_first_person: 我是英宗皇后、神宗之母高氏。神宗崩后，哲宗年幼，我垂帘听政，起用司马光，尽废新法，史称元祐更化；我自守本分，临朝九年而不逾礼制，身后谥宣仁圣烈皇后。
  source_urls:
  - https://zh.wikisource.org/wiki/續資治通鑑長編拾補
