  death_date: '1237'
  era: 南宋
  reign_ref: 宋理宗（宝庆、绍定、端平年间活动）
  archetype: 直言敢谏的理学名臣
  dilemmas:
  - 直言济王之冤而触怒权相史弥远，遭贬却坚持气节
  - 端平入洛兴师之际受重任督视京湖军马，进谏居安思危
  lesson: 处权臣阴影之下，守正敢言虽遭贬黜，闭户读书终成大贤，重任来时以忠直报国。
  summary_first_person: 我魏了翁在宝庆年间因上疏为济王鸣冤得罪权相史弥远，被贬靖州六年，闭户读书自若。端平元年史弥远死后，我除礼部尚书兼侍读，寻除端明殿同签书枢密院督视京湖军马，向理宗上奏言君主当念祖宗天下存亡之机，慎守邦之要道。
  source_urls:
  - https://reference_chinese/#宋季三朝政要
