person:
  qid: guji-黄帝轩辕氏
  name_zh: 黄帝轩辕氏
  names:
    zh: 黄帝轩辕氏
    en: Yellow Emperor (Xuanyuan)
  lifespan:
    birth:
      date: -2717
      precision: decade
      is_circa: true
      raw: 二十五月而生帝于寿丘（生年无考，姑系于即位前约二十年）
    death:
      date: -2598
      precision: year
      is_circa: true
      raw: 一百年，地裂。帝陟
  birth_date: -2717
  death_date: -2598
  era: 上古五帝之世
  reign_ref: 在位百年（元年即位居有熊，至一百年地裂而陟）
  archetype: 创制垂裳、以土德王的文明始祖
  dilemmas:
  - 以感生瑞应立圣王之统，神话与史实杂糅难征
  - 兵定蚩尤之乱与垂衣裳而治的刚柔之择
  lesson: 垂衣裳而天下治——定制度、正名号、应天瑞，胜于专恃兵威
  summary_first_person: 吾轩辕氏，母曰附宝，见大电绕北斗枢星感而孕，二十五月而生吾于寿丘；弱而能言，龙颜，有圣德。命应龙攻蚩尤，以女魃止淫雨，天下既定，即位居有熊。初制冕服，以云纪官，二十年景云见，五十年凤鸟至而祭于洛水，龙图出河、龟书出洛，遂以土德王。五十九年贯胸、长股来宾，七十七年昌意降居弱水。在位百年，地裂而陟，臣左彻取吾衣冠几杖而庙飨之，诸侯大夫岁时朝焉。
  source_urls:
  - https://zh.wikisource.org/wiki/今本竹書紀年疏證
