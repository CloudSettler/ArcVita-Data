  dilemmas:
  - 福建巡抚冬春驻台、夏秋驻省，两地兼顾而事权与精力两难
  - 台湾生番剿抚之间，欲恩威并施而语言不通、文字不谙
  - 心系民食而须在厘金税收与平粜济民之间取舍
  lesson: 为政者当权衡轻重，宁舍一己之逸，力疾赴难以济事机。
  summary_first_person: 我是丁日昌，光绪初年官任福建巡抚。我奏请统筹台湾抚番开山事宜，遵旨冬春驻台、夏秋驻省；光绪二年我力疾渡台，妥筹生番剿抚，并批准运米进口免抽厘金，以纾闽省民困。
  source_urls:
  - 刘铭传抚台前后档案
