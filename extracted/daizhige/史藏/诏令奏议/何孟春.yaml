person:
  qid: guji-何孟春
  name_zh: 何孟春
  names:
    zh: 何孟春
    en: He Mengchun
  lifespan:
    birth:
      date: 1474
      precision: year
      is_circa: true
      raw: 史传约载，原文未明
    death:
      date: 1536
      precision: year
      is_circa: true
      raw: 史传约载，原文未明
  birth_date: 1474
  death_date: 1536
  era: 明代中期
  reign_ref: 弘治、正德、嘉靖
  archetype: 气节直谏之臣
  dilemmas:
  - 言路获罪与忠谏本分：科道因言下狱，满朝缄默，上疏恐触圣怒而缄默即自欺
  - 尊宗支与护言路：皇帝厚待宗藩并罪言官，谏之则伤恩，不谏则伤国体公论
  - 礼制名分与仕进前程：争大礼泣谏，明知忤旨必遭左迁削籍而仍不能已
  - 爱民节用与奉命兴作：营缮频兴费财疲民，直言停工则逆近幸权贵之意
  lesson: 直言不讳须以气节自任，其奏剀切详明、恳挚凿凿，方于朝政有实裨，而非徒意气激进取名一时。
  summary_first_person: 我何孟春，字子元，郴州人，弘治癸丑进士。自兵部主事起家，历官至右副都御史巡抚云南，入为吏部左侍郎。我少游李东阳之门，学问该博，生平以气节自许：救言官庞泮等，请停万岁山工役，清宁宫灾陈八事，出理陕西马政上厘弊五事，谏武宗幸宣府，嘉靖初以旱潦条奏八事。以争大礼泣谏，左迁南京工部左侍郎，寻削籍。隆庆初赠礼部尚书，谥文简。
endeavors:
- id: guji-何孟春-endeavor-1
  name_zh: 历官谏诤与争大礼
  phases:
  - key: brewing
    name_zh: 释褐兵部初建言
    labels:
      zh: 进士入仕、兵部主事
    start_date: 1493
    highlight_event_id: guji-何孟春-event-jinshi
  - key: breakthrough
    name_zh: 疏救言官与省营缮
    labels:
      zh: 建言疏、省营缮、清宁宫灾陈八事
    start_date: 1496
    highlight_event_id: guji-何孟春-event-jianyan
  - key: climax
    name_zh: 督马政与巡抚云南
    labels:
      zh: 陕西马政厘弊、右副都御史抚滇、吏部左侍郎
    start_date: 1506
    highlight_event_id: guji-何孟春-event-mazheng
  - key: closure
    name_zh: 争大礼泣谏削籍
    labels:
      zh: 大礼议、左迁南京、削籍
    start_date: 1524
    highlight_event_id: guji-何孟春-event-dali
  decisions:
  - date: 1496-04-18
    title_zh: 上建言疏救科道言官
    rationale: 科道以言得罪连系者五六十人，恐臣下自此以言为讳，挫公论伤国体，故不惜覼缕陈请从轻发落。
  - date: 1498-03-18
    title_zh: 上省营缮疏请罢毓秀亭工役
    rationale: 土木频兴费府库疲军民，无汉文帝之富庶而所为过之，愿陛下惜民力以光治道。
  - date: 1524
    title_zh: 争大礼泣谏
    rationale: 名分礼制所系，明知忤旨必贬，犹不能自已，遂左迁南京工部左侍郎、寻削籍。
- id: guji-何孟春-endeavor-2
  name_zh: 遗稿搜辑与奏议刊传
  phases:
  - key: brewing
    name_zh: 身后遗稿散轶
    labels:
      zh: 遗稿散轶、事迹具明史本传
    start_date: 1536
    highlight_event_id: guji-何孟春-event-death
  - key: breakthrough
    name_zh: 赵贤搜辑遗稿
    labels:
      zh: 万历初巡抚湖广搜辑诗文
    start_date: 1573
    highlight_event_id: guji-何孟春-event-kankan
  - key: climax
    name_zh: 永州刊诗文、衡州刊奏议
    labels:
      zh: 何文简疏议十卷成
    start_date: 1573
    highlight_event_id: guji-何孟春-event-kankan
  - key: closure
    name_zh: 四库全书著录
    labels:
      zh: 钦定四库全书收录疏议十卷
    start_date: 1779
    highlight_event_id: guji-何孟春-event-siku
  decisions:
  - date: 1573
    title_zh: 赵贤别录奏议为一集刊于衡州
    rationale: 孟春诗文与奏议并具可观，惟奏议剀切尤为建白之卓卓者，故别为一集以传。
events:
- id: guji-何孟春-event-birth
  year_of: 1474
  date: 1474
  title_zh: 何孟春生
  desc_zh: 郴州人，字子元，少游李东阳之门。原文未载生年，据史传约系。
- id: guji-何孟春-event-jinshi
  year_of: 1493
  date: 1493
  title_zh: 举弘治癸丑进士，授兵部主事
  desc_zh: 弘治癸丑登进士第，初授兵部主事，自此入仕。
- id: guji-何孟春-event-jianyan
  year_of: 1496
  date: 1496-04-18
  title_zh: 上建言疏救科道言官
  desc_zh: 科道官以岷王奏事连坐系狱者五六十人，孟春上疏乞从轻发落，保全敢言之风。疏末署弘治九年四月十八日。
- id: guji-何孟春-event-shengying
  year_of: 1498
  date: 1498-03-18
  title_zh: 上省营缮疏谏止毓秀亭工役
  desc_zh: 乾清宫西七所与毓秀亭兴作，费财疲民，孟春引汉文帝露台故事切谏。疏末署弘治十一年三月十八日。
- id: guji-何孟春-event-qingning
  year_of: 1498
  date: 1498
  title_zh: 清宁宫灾，应诏陈万言疏
  desc_zh: 清宁宫灾，应诏直言，并请停万岁山工役，陈八事以禆修省。
- id: guji-何孟春-event-mazheng
  year_of: 1506
  date: 1506
  title_zh: 出理陕西马政，上厘弊五事
  desc_zh: 奉命出理陕西马政，上疏厘革积弊五事，后官河南参政、入为太仆寺卿，皆有马政诸疏。
- id: guji-何孟春-event-xunfu
  year_of: 1519
  date: 1519
  title_zh: 以右副都御史巡抚云南
  desc_zh: 累官右副都御史巡抚云南，疏议第四至八卷皆巡抚云南时作，多地方、边务、救灾之奏。
- id: guji-何孟春-event-shilang
  year_of: 1522
  date: 1522
  title_zh: 入为吏部左侍郎，嘉靖初条奏八事
  desc_zh: 召入为吏部左侍郎，值旱潦相仍，条奏八事，为建白之卓卓者。
- id: guji-何孟春-event-dali
  year_of: 1524
  date: 1524
  title_zh: 争大礼泣谏，左迁南京，寻削籍
  desc_zh: 以争大礼泣谏，忤旨左迁南京工部左侍郎，寻削籍归。
- id: guji-何孟春-event-death
  year_of: 1536
  date: 1536
  title_zh: 何孟春卒
  desc_zh: 削籍后卒于家，遗稿散轶。原文未载卒年，据史传约系。
- id: guji-何孟春-event-zengshi
  year_of: 1567
  date: 1567
  title_zh: 隆庆初赠礼部尚书，谥文简
  desc_zh: 隆庆初追赠礼部尚书，赐谥文简。
- id: guji-何孟春-event-kankan
  year_of: 1573
  date: 1573
  title_zh: 万历初赵贤搜辑遗稿刊行
  desc_zh: 巡抚湖广佥都御史汝阳赵贤搜辑其诗文刻于永州，别录奏议为一集刊于衡州，即何文简疏议十卷。
- id: guji-何孟春-event-siku
  year_of: 1779
  date: 1779
  title_zh: 四库全书收录何文简疏议
  desc_zh: 乾隆四十四年二月，钦定四库全书著录何文简疏议十卷于史部诏令奏议类。
