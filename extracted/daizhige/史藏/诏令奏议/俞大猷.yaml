person:
  qid: guji-俞大猷
  name_zh: 俞大猷
  names:
    zh: 俞大猷
    en: Yu Dayou
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
  era: 明
  reign_ref: 嘉靖
  archetype: 抗倭名将
  dilemmas:
  - 平海倭寇盘踞、兵粮俱困之际，须与刘显、戚继光分兵设伏、一鼓歼灭
  - 倭贼欲遁下船，须严防海口防其逃逸，又要冒险截击
  lesson: 沉毅任事、蓄威待机，水陆并进方能全歼强敌
  summary_first_person: 我俞大猷在嘉靖年间任福建总兵官，与刘显、戚继光协力剿倭。嘉靖四十二年，新倭自长乐登岸，我分伏要路截击；兴化既破之后，倭众移据平海卫，我与刘显分屯渚林养威蓄锐，与诸将约定哨道，二十一日三路并进，纵火破巢，擒斩真倭二千二百余名颗。又督朱相开沟设伏截贼去路，贼渡水邀击，擒斩过半，余党投海，我兵全胜。
