person:
  qid: guji-刘安世
  name_zh: 刘安世
  names:
    zh: 刘安世 / 元城先生 / 殿上虎 / 真铁汉
    en: Liu Anshi
  lifespan:
    birth:
      date: '1048'
      precision: year
      is_circa: true
      raw: 少师事司马光，北宋进士出身，生年史未详载
    death:
      date: '1125'
      precision: year
      is_circa: true
      raw: 后复直龙图阁而卒
  birth_date: 约1048年
  death_date: 约1125年
  era: 北宋
  reign_ref: 哲宗、徽宗
  archetype: 直谏诤臣
  dilemmas:
  - - 直言报国与孝养其母：初除谏官，虑犯颜获罪贻母忧，先入白老母，得母勉慰而后就职
  - - 尽言不讳与身家祸福：弹击权贵章惇蔡确至二三十章不止，视死生祸福如浮沤
  - - 嫉恶太严与平和处势：务欲置蔡确于死地，致词或过激，激成朋党之势
  lesson: 尽言者自不妄语中来——从司马光学得"诚"之一字，诚以事主，则敢批龙鳞、触忌讳，虽窜逐炎荒十余年而不回。
  summary_first_person: 我少时师事司马光，得"诚"之一言为立身之要，以不妄语为求诚之功。哲宗初年，司马光与吕公着先后荐我入谏垣，我遇事极言，论胡宗愈除职至二十一疏，论蔡确、章惇各十一二疏，百折不回，人号"殿上虎"，坡公称我"真铁汉"。绍圣初我落职知南安军，再贬新州别驾、英州安置，徽宗立又移衡州、鼎州居住，奉母流转蛮烟瘴雨之地十余年，终得全躯而归，复直龙图阁而卒。
  source_urls:
  - https://ctext.text/details/尽言集
