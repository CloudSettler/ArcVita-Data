  decisions:
  - date: 1086-02-05
    title: 受母命赴谏官之职，欲以直谏报主
    rationale: 初除谏官虑坐罪贻母忧，欲辞官终养；母述先君欲为谏官不获之憾，再三勉慰，遂拜谢就职，出处至此见其忠孝根于天性。
  - date: 约1089-01-29
    title: 首论开广言路，献言上关社稷安危
    rationale: 见防谏数人相继罢去，惧欺君蔽耳目，虽世俗以为嫌疑亦不避之，先论治乱本原。
  - date: 约1090-07-18
    title: 反复论列执政亲戚差除之弊
    rationale: 见殿上差除多执政亲戚、子弟姻亲布满要津，专引亲属、排斥孤寒为大患，条列其弊，直指柄臣。
