  - 胡宗愈
  - 欧阳棐
  - 程颐
  summary: 论胡宗愈除职不当至二十一疏，论欧阳棐差遣不当章凡九上，并无区别于苏轼之善、程子之仇之间，见其孤立无党；论章惇蔡确强买讥讪各十一二疏，人号"殿上虎"。
