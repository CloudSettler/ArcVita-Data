person:
  qid: guji-刘永福
  name_zh: 刘永福
  names:
    zh: 刘永福
    en: Liu Yongfu
  lifespan:
    birth:
      date: '1837'
      precision: year
      is_circa: true
      raw: 道光十七年
    death:
      date: '1917'
      precision: year
      is_circa: true
  birth_date: '1837'
  death_date: '1917'
  era: 晚清
  reign_ref: 同治、光绪
  archetype: hierarch
  dilemmas:
  - 身为绿林出身将领，如何在官府歧视中证明忠诚与战功
  - 甲午割台后，面对朝廷放弃台湾，是奉旨内渡还是留台抗日
  lesson: 处乱世而能审时度势，守土抗敌之志不失，进退之间自见气节。
  summary_first_person: 我刘永福出身草莽，以黑旗军名震中外。先在越南抗法取胜，后奉调署理碣石镇总兵；甲午之役赴台协防，割台后犹率部抗拒日军。一生转战海疆，虽处末世，未尝忘守土之责。
  source_urls:
  - https://zh.wikipedia.org/wiki/刘永福
