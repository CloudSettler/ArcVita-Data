person:
  qid: guji-刘铭传
  name_zh: 刘铭传
  names:
    zh: 刘铭传
    en: Liu Mingchuan
  lifespan:
    birth:
      date: 1836
      precision: year
      is_circa: true
      raw: 道光年间生，光绪二十一年卒时年六十
    death:
      date: 1896
      precision: year
  birth_date: 1836
  death_date: 1896
  era: 清代（咸丰、同治、光绪三朝）
  reign_ref: 咸丰帝 / 同治帝 / 光绪帝
  archetype: 淮军名将·首任台湾巡抚·自强运动先驱
  dilemmas:
  - 弃守基隆以保沪尾，遭朝野大哗而不改
  - 忍让刘璈掣肘数年，恐湘淮内讧致台事倾覆
  - 甲午之变朝廷欲起用，因枢臣忌淮而延不下诏，终不出
  lesson: 兵事变化非局外人所能遥度，用兵贵专权、用人贵无私；铁路轮舰乃自强根基，失之则亡无日矣。
  summary_first_person: 我刘铭传，合肥西乡人，少有大志，年十八杀豪雪耻。起团练、建铭军，破常州、平东西捻，以少击众，血战四载。法夷犯台，我弃基隆而守沪尾，短衣麻履亲当军锋，坚持八月卒保危疆。抚台七年，建省设治，清赋抚番，筑铁路、兴邮政，欲以一隅为全国树范。及海军议格，知藩篱自毁，三疏求去。今人方惎我，我乃自抉其藩，亡无日矣。
  source_urls:
  - 清史本传·新城王树枬撰稿
  - 刘壮肃公家传·江宁程先甲撰
endeavors:
- id: guji-刘铭传-endeavor-1
  key_thrust: 组建铭军，转战苏浙、平定东西捻，以少击众成淮军劲旅
  phases:
  - key: brewing
    name_zh: 团练起家与创建铭军
    labels:
      zh: 团练起家·铭军立帜
    start_date: 1854
    highlight_event_id: guji-刘铭传-event-mingjun-founded
  - key: breakthrough
    name_zh: 会攻常州，平吴建功
    labels:
      zh: 攻克常州·名噪海内
    start_date: 1862
    highlight_event_id: guji-刘铭传-event-changzhou-fallen
  - key: climax
    name_zh: 转战数省，剿平捻军
    labels:
      zh: 剿捻四年·沙河运河之防
    start_date: 1864
    highlight_event_id: guji-刘铭传-event-east-nian-pacified
  - key: closure
    name_zh: 督陕引疾，归里筑盘亭
    labels:
      zh: 引疾归隐·自号大潜山人
    start_date: 1870
  decisions:
  - date: 1865
    title_zh: 建议筑长堤扼沙河，改游击为聚歼之计
    rationale: 中原平旷，捻骑飘忽，专主游击不能制其死命，须以河防蹙贼
  - date: 1867
    title_zh: 议防运河、扼胶莱、筑长墙
    rationale: 东捻奔突无定，以长墙运河圈制，方得聚歼于洋弥两河间
- id: guji-刘铭传-endeavor-2
  key_thrust: 力倡铁路自强，抗法保台，抚台建省兴新政
  phases:
  - key: brewing
    name_zh: 力陈铁路之益
    labels:
      zh: 上疏倡铁路·自强机括
    start_date: 1880
    highlight_event_id: guji-刘铭传-event-railway-memorial
  - key: breakthrough
    name_zh: 受命渡台，血战抗法
    labels:
      zh: 弃基隆·守沪尾
    start_date: 1884
    highlight_event_id: guji-刘铭传-event-huwei-victory
  - key: climax
    name_zh: 建省设治，清赋抚番兴新政
    labels:
      zh: 台湾建省·清赋筑路
    start_date: 1885
    highlight_event_id: guji-刘铭传-event-taiwan-province
  - key: closure
    name_zh: 海军议格，三疏求去，卒于里
    labels:
      zh: 三疏求去·病卒家山
    start_date: 1891
    highlight_event_id: guji-刘铭传-event-death
  decisions:
  - date: 1880
    title_zh: 应诏陈言，请修南北铁路
    rationale: 铁路一开则二十二行省联为一气，一兵可抵十数兵之用，自强基础在此
  - date: 1884
    title_zh: 毅然弃基隆，移军守沪尾
    rationale: 基隆距省治六十里，军资饷械尽萃台北；无舰应敌，死守基隆则敌袭后路，坐毙而已
  - date: 1885
    title_zh: 奏请台湾改建行省，增设府县
    rationale: 台湾阻海为南洋锁钥，非行省不能自治自固
  - date: 1891
    title_zh: 户部奏停购舰炮，三上疏求去
    rationale: 人方惎我，我乃自抉其藩，亡无日矣
