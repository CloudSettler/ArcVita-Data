  dilemmas:
  - 尽忠进谏与触怒君主之间的生死抉择
  - 预见藩镇之患而言不见用的先知困境
  lesson: 危言谠论虽当时获罪，后世可为金鉴；不可以人废言。
  summary_first_person: 我于洪武九年应诏上直言书，直言诸王分封太侈、用刑太繁、求治太速，告诫裂土分封恐蹈汉七国之祸，因此触怒太祖被逮下狱，瘐死狱中，其言后果验于靖难之役。
