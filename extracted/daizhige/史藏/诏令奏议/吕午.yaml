  era: 南宋
  reign_ref: 宋理宗嘉熙年间
  archetype: 直言敢谏之诤臣
  dilemmas:
  - 战、守、和三策纷纭，边事危急而人心不齐，如何定规模以一人心
  - 国用窘匮而贪官猾吏蠹国害民，纠之为苛、不纠则民贫国空
  lesson: 思患豫防，有备无患；直言极谏，以风节自励。
  summary_first_person: 余字伯可，歙县人。嘉定四年进士，官至起居郎、右文殿修撰，知漳州。两为谏官，以风节自励，知无不言。理宗尝称余议论甚明切，谓论边事甚好。嘉熙二年上疏六首，论定规模以一人心、据要害以饬武备，及财赋、秤提会子诸事。文集名《竹坡类藁》，惜久佚，今惟《左史谏草》六疏存于散佚之余。
