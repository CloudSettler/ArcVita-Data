  category_zh: 政事谏诤
  start_date: '1238'
  end_precision: year
  frequency: 反复多次
  evidence: 午两为谏官，以风节自励，知无不言。理宗尝称其议论甚明切，又谓其论边事甚好。此六疏皆理宗嘉熙二年所上。
  confidence: high
  notes: 嘉熙二年戊戌（1238）正月、三月、四月、五月连上诸疏，论边防、财赋、士风、会子等事。
- id: guji-吕午-habit-3
  name_zh: 撰述文集
  category_zh: 著述
  end_precision: year
  evidence: 回称午文集名竹坡类藁，是午本有全集而今佚之，兹六疏盖存于散佚之余者。其它遗文则颇散见于新安文献志诸书。
  confidence: medium
  notes: 另撰《左史谏草》存嘉熙奏议六首，后附其子吕沆奏议一首。
