- id: guji-吕留良-event-writings
  event_type: career
  name_zh: 私为著述，妄议华夷
  date: '1660'
  year_of: 1660
  description_zh: 著述谓"德佑以后，天地大变，亘古未经，于今复见"，评点时文传播夷夏之防思想，为其后雍正上谕所痛斥。
- id: guji-吕留良-event-anathey
  event_type: career
  name_zh: 曾静案发，被指为逆魁
  date: '1728'
  year_of: 1728
  description_zh: 曾静遣张熙投书岳钟琪谋反案发，供词牵连吕留良，雍正上谕指其为"凶顽悖恶"之逆贼魁首，其徒严鸿逵转相附和，余波及于曾静。
- id: guji-吕留良-event-sentence
  event_type: career
  name_zh: 戮尸枭示，著作禁毁
  date: '1730'
  year_of: 1730
  description_zh: 雍正帝颁《大义觉迷录》刊刻颁布天下学宫，逐条驳斥吕留良华夷之辨之说，吕留良被戮尸枭示，子孙门徒遭严惩，著作遭禁毁。
- id: guji-吕留良-event-death
  event_type: death
  name_zh: 吕留良去世
  date: '1683'
  year_of: 1683
  description_zh: 吕留良于清康熙年间去世，身后四十余年因文字之祸遭戮尸之刑。
