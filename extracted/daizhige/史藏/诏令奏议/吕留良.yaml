  archetype: 遗民学者·华夷之辨论者
  dilemmas:
  - 身处异族统治之下，守遗民气节与保全家族性命之间的两难
  - 著述传播"华夷之辨"思想与清廷大一统意识形态的冲突
  lesson: 思想文字虽可遭戮尸毁版，其是非 controversy 却被最高权力被迫公开回应，足见言论之力
  summary_first_person: 我是吕留良，明亡后不仕新朝，闭门著述，力主华夷之辨，谓德佑以后天地大变。身后因曾静案被雍正指为逆魁，戮尸枭示，著作被禁毁，然《大义觉迷录》反使我的名字传遍天下学宫。
  source_urls:
  - https://zh.wikisource.org/wiki/大义觉迷录
