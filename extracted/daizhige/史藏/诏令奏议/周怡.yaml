  dilemmas:
  - 直言极谏触怒权贵与个人安危的冲突
  - 出狱复起后再次上疏获罪仍不改其志
  lesson: 百折不改其志，劲直忠亮，虽困踣颠连而直道自持
  summary_first_person: 我周怡字顺之，号都峰，改号讷溪，太平人。嘉靖戊戌进士，初居吏垣，因直言忤严嵩被廷杖下锦衣狱三年，出狱不久复被逮又二年始释。隆庆初召为太常寺少卿，又因疏忤中官外调。平生触犯权幸至再至三，其志百折不改。
  source_urls:
  - https://www.example.com/siku/neixi-zoushu
