    title_zh: 上论重名器疏，抑奔竞以重名器
    rationale: 清宁宫重建升赏过当，郎中李堂躐升京职二级，物议沸腾，义不容默
  - date: '1502-01-08'
    title_zh: 上论贡举疏，精贡举以务得人
    rationale: 会试贿赂传递奸弊日滋，乞严加禁革、复大臣子弟复试之制
