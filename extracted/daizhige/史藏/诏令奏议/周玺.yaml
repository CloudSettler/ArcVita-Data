    - 明知劾逆珰必罹祸而依旧上疏直谏
  lesson: 食其禄不避其难，直气坌涌虽死不避
  summary_first_person: 我是明弘治丙辰进士、官至礼科都给事中的周玺，字天章，号荆山，合肥人。我屡上疏论贡举积弊、恤民罢作、重名器、惩欺罔，并弹劾大僚太监多人；正德间抗疏劾刘瑾，被构陷毙于廷杖，瑾败后昭雪复官。
