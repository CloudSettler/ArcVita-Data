  summary_first_person: 我认为周起元一生以忠直自任，早年中万历辛丑进士，巡漕时上西台奏疏，巡抚江南时上抚吴奏疏，屡屡建言抗疏，弹劾权奸、关切国计民生，终因忤魏珰被害，追赠兵部侍郎，谥忠愍，再谥忠惠。
