events:
- id: guji-唐宣宗-event-birth
  date: 0810
  year_of: 810
  type: birth
  summary: 宪宗之子，生于元和年间，幼有「为善好学」之誉。
- id: guji-唐宣宗-event-accession
  date: 0846
  year_of: 846
  type: political
  title_zh: 宣宗即位册文：会昌六年三月即皇帝位
  summary: 武宗「祷神饵药，有加无瘳」，委家国于皇太叔，「权勾当军国政事」，遂于会昌六年丙寅三月即位。
- id: guji-唐宣宗-event-governing
  date: 0847
  year_of: 847
  type: political
  title_zh: 改元大中，勤政图治
  summary: 秉「斥去奇邪，亲任仁人」之训，宣宗孜孜求治，号「大中之治」。
- id: guji-唐宣宗-event-second-endeavor-start
  date: 0850
  year_of: 850
  type: political
  title_zh: 大中政令频颁，考慎庶官
  summary: 大中年间修举废坠，明察吏治，号为小太宗之治。
- id: guji-唐宣宗-event-death
  date: 0859
  year_of: 859
  type: death
  title_zh: 大中十三年崩，懿宗即位
  summary: 寝疾弥留，药石无功，传位于皇太子（懿宗），八月丙申皇帝册命懿宗即位。
