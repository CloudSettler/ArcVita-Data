  era: 唐
  reign_ref: 会昌六年（846年）即位，年号大中
  archetype: 中兴守成之君
  dilemmas:
  - 晚唐宦官专权、藩镇跋扈，父死子继之外的非常继位
  - 在牛李党争余波中如何收拾朝局、重建权威
  lesson: 皇太叔以「权勾当军国政事」之名承继大统，是在乱局中以贤不以嫡的现实抉择。
  summary_first_person: 我以皇太叔之身，于会昌六年受册即皇帝位，改元大中，欲以宽仁勤政再振唐室纲纪。
  source_urls:
