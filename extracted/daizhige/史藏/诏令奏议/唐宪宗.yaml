    rationale: 令狐楚草“门下侍郎、彰义军节度使、宣慰等使制”，辞涉“剪其类”“更张琴瑟”“烦我台席”，裴度奏请改作近谕之辞，我以大体所在采纳之，遂成“鬭其类为剪其部”之新文宣布于外。
  - date: 0820
    title_zh: 属神器于元良
    rationale: 皇太子恒孝友聪明、日新厥德，可为嗣君，付以社稷而望其绥靖万邦。
events:
- id: guji-唐宪宗-event-birth
  date: 0778
  year_of: 0778
  type: birth
  summary: 宪宗李纯生于大历十三年，顺宗皇帝之长子，早以英武明决、仁孝之诚见称于累圣。
  participants:
  - guji-唐宪宗
- id: guji-唐宪宗-event-enthronement
  date: '0805-09-05'
  year_of: 0805
  type: enthronement
  summary: 永贞元年岁次乙酉八月丁酉朔九日乙巳，太上皇（顺宗）遣检校司徒平章事杜佑、副使门下侍郎平章事杜黄裳持节持绶，册皇太子纯即皇帝位于宣政殿，是为宪宗。
  participants:
  - guji-唐宪宗
  evidence: 宪宗即位册文（唐大诏令集卷一）：“是用命尔当位嗣统宜陟元后代予忧勤……尔有光大之德敷于万邦”
- id: guji-唐宪宗-event-xucai
  date: 0817
  year_of: 0817
  type: administrative-decision
  summary: 元和十二年裴度以门下侍郎、彰义军节度使、宣慰等使奉命讨淮西，令狐楚所草制辞含“剪其类”“更张琴瑟”“烦我台席”等语，裴度奏请改作，我依奏改制宣布之，楚亦因此罢内职，遂振军威而终平淮西之乱。
  participants:
  - guji-唐宪宗
  evidence: 四库提要载：“据旧唐书其文乃令狐楚所草制出后度请改制内剪其类……宪宗从之楚亦因此罢内职”
- id: guji-唐宪宗-event-death
  date: 0820
  year_of: 0820
  type: death
  summary: 元和十五年岁次庚子，宪宗寝疾弥留，不兴不寤而崩，闰正月三日丙午皇太子恒即皇帝位，改元长庆，是为穆宗，诏称“十圣丕承光宅四海”以继统绪。
  participants:
  - guji-唐宪宗
  evidence: 穆宗即位册文（唐大诏令集卷一）：“今朕寝疾弥留弗兴弗寤神器所付属之元良咨尔皇太子恒……宜令中书门下侍郎平章事令狐楚奉册即皇帝位”
