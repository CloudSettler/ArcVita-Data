person:
  qid: guji-唐宪宗
  name_zh: 唐宪宗
  names:
    zh: 唐宪宗
    en: Emperor Xianzong of Tang
  lifespan:
    birth:
      date: 0778
      precision: year
      is_circa: true
      raw: 永贞元年册文称“皇太子纯”，生于大历十三年
    death:
      date: 0820
      precision: year
      is_circa: false
      raw: 元和十五年正月崩，闰正月三日丙午穆宗即位
  birth_date: 0778
  death_date: 0820
  era: 唐代中期（中晚唐）
  reign_ref: 永贞元年（805）即位，年号元和（806—820）
  archetype: 中兴之主
  dilemmas:
  - 内有权阉专横、宫闱构衅，外有藩镇割据，须以刚断摄服群凶而保全宗庙社稷
  - 齐家与治国难以兼顾，最终身没于变起肘腋，大业未竟
  lesson: 恪遵祖宗之丕训、慎俭徳、纳忠直，方能“削平僭叛、再振国势”，然临庶官以信若失，则祸起萧墙。
  summary_first_person: 我在永贞元年受太上皇册命即皇帝位，年号元和。当是时藩镇僭乱，我以削平僭藩、恢复朝廷号令为己任，任用杜黄裳、裴度等贤相，平淮西、清宿逆，重振宗社之威。然元和十五年正月宫闱生变，我崩于位，皇太子恒继统，是为穆宗。史家称我之艰难创业，媲美高祖太宗之剪定隋乱。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6224
