  era: 明代
  reign_ref: 正统、景泰、天顺、成化
  archetype: 直言敢谏的内阁辅臣
  dilemmas:
  - 遭石亨诬陷去职，复出后是否贪恋宠荣
  - 劾汪直直指权阉，直言与自保的两难
  lesson: 忠言直谏，虽遭贬斥而不改其守
  summary_first_person: 我商辂起自书生，由进士历官翰林、内阁，经历土木之变与夺门之变。天顺间被石亨诬陷为民，成化初复职入阁，屡上疏言政——招抚流民、清理边田、劾西厂汪直，惟愿直言以报国。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=商文毅疏稿
