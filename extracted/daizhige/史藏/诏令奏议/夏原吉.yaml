person:
  qid: guji-夏原吉
  name_zh: 夏原吉
  names:
    zh: 夏原吉
    en: Xia Yuanji
  lifespan:
    birth:
      date: '1366'
      precision: year
      is_circa: true
      raw: 约1366年
    death:
      date: '1430'
      precision: year
      is_circa: false
  birth_date: '1366'
  death_date: '1430'
  era: 明代永乐、洪熙朝
  reign_ref: 明成祖、明仁宗
  archetype: 财计名臣
  dilemmas:
  - 既要宽恤民力，又须维持国家财政支度
  - 宗室禄米屡增与太仓储积有限的矛盾
  lesson: 治财之道在体国恤民，宽徵薄敛而仓廪自足
  summary_first_person: 我为户部尚书，历事两朝。皇上每与臣议诸王加禄、免徵灾伤税粮、除荒田租额诸事，皆以恤民为先，臣谨承其意，斟酌国用，务使民不困而仓不乏。
  source_urls:
  - https://zh.wikisource.org/wiki/明仁宗實錄
endeavors:
- id: guji-夏原吉-endeavor-1
  name_zh: 执掌户部，综理国家财政
  phases:
  - key: brewing
    name_zh: 理财任事
    labels:
      zh: 户部任事
    start_date: '1403'
  - key: breakthrough
    name_zh: 佐成永乐之治
    labels:
