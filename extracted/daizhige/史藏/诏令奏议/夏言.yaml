person:
  qid: guji-夏言
  name_zh: 夏言
  names:
    zh: 夏言
    en: Xia Yan
  lifespan:
    birth:
      date: '1482'
      precision: year
      is_circa: true
      raw: 明成化年间生
    death:
      date: '1548'
      precision: year
      is_circa: false
      raw: 嘉靖二十七年弃市
  birth_date: '1482'
  death_date: '1548'
  era: 明代
  reign_ref: 明世宗嘉靖帝
  archetype: 权臣礼制改革家
  dilemmas:
  - 才敏受知世宗而有恩眷，然柄用后志骄气溢、傲愎自专，终致败亡
  - 议礼合于典要而立身本末殊无可称，功与德难以两全
  - 尽职礼部举仪制之事，却为严嵩所构，坐与曾铣交关弃市
  lesson: 学问淹博、精于仪文度数可以成一代制作之功，然志骄气溢、傲愎自专者，虽蒙特眷终不免祸败；立身与事功不可偏废。
  summary_first_person: 我夏言，字公谨，江西贵溪人。正德丁丑登进士，授兵科给事中，以才器开敏受知世宗，累官至礼部尚书、武英殿大学士。当世宗锐意讲贯之时，我斟酌损益朝廷制作，如南北郊分祀、更定文庙祀典、大禘礼仪、立先蚕坛诸事，皆我所赞成，所上奏牍议论明达。然柄用之后志骄气溢，傲愎自专，为严嵩所构，坐与曾铣交关，竟遭弃市。隆庆初追复原官，谥文愍。我编所作疏议为《南宫奏稿》五卷，庶几不没我所能长。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6103
