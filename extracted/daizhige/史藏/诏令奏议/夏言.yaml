  - date: '1533'
    title_zh: 赞成南北郊分祀、文庙祀典、大禘礼仪、立先蚕坛诸制
    rationale: 世宗锐意讲贯，言学问淹博、留意仪文度数，故于朝廷制作斟酌损益，合于典要。
  - date: '1533-01-01'
    title_zh: 议定驾幸太学礼仪并纂缉《圣驾重幸太学录》
    rationale: 临雍盛典宜有纪述以昭文明，俾天下之士知上意隆师重道。
  - date: '1548'
    title_zh: 与曾铣交关终致获罪弃市
    rationale: 傲愎自专，志骄气溢，为严嵩所构陷，卒以致败。
