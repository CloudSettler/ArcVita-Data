  birth_date: '1624'
  death_date: '1683'
  era: 清代康熙年间
  reign_ref: 清圣祖康熙
  archetype: 功高不赏的封疆大吏
  dilemmas:
  - 平台首功被施琅七日驰奏抢先，己奏迟旬日而不得封侯
  - 经营台湾二十年之力反为他人爵赏，愤懑无处申雪
  lesson: 荐贤者功成而身退无赏，知人任事之劳往往湮没于受任者之名下
  summary_first_person: 我姚启圣经营台湾二十年，招降黄梧、施琅诸郑氏故将，复保荐施琅专征海道。台湾既平，琅自海道七日驰奏得封靖海侯，我奏迟至旬日，竟不得封。琅功实我功也，而当时大臣无一人为我言者。我以此大恚，疽发背而卒，身后唯待全祖望作第二碑纪实。
