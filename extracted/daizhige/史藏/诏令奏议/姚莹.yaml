  endeavor_ref: guji-姚莹-endeavor-1
  summary: 姚莹闰四月到任台湾道，查悉匪徒滋事情形，与达洪阿、王得禄筹商，饬令各属联庄收养游民、编造庄丁名册，并于九月初七日亲往北路巡查督拿积匪。
- id: guji-姚莹-event-2
