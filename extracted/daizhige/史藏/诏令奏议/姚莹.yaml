- id: guji-姚莹-event-3
  date: '1838-11-16'
  year_of: 1838
  type: endeavor
  endeavor_ref: guji-姚莹-endeavor-1
  summary: 中路胡布聚众竖旗谋攻湾里街泛。姚莹在彰化得信驰回店仔口，与达洪阿督派带兵围拿，生擒逆首胡布及洪保等十二名，恭请王命将首犯凌迟处死。
- id: guji-姚莹-event-4
  date: '1838-12-06'
  year_of: 1838
  type: endeavor
  endeavor_ref: guji-姚莹-endeavor-1
  summary: 道光十八年十一月初六日，姚莹与达洪阿严鞠各犯，将张贡、张生等分别凌迟处斩并概枭示，将查办全台南、北、中三路匪类情形恭折具奏。
