  dilemmas:
  - 年老隐居，何时出山佐命之择机之难
  - 辅佐新朝，如何以敬胜怠、以义胜欲而致万世之治
  lesson: 敬胜怠者吉，怠胜敬者灭；义胜欲者从，欲胜义者凶。
  summary_first_person: 我为周之师尚父，武王践阼三日即召我问治道。我奉丹书而告之曰：敬胜怠者吉，怠胜敬者灭；义胜欲者从，欲胜义者凶。凡事不强则枉，弗敬则不正；枉者灭废，敬者万世。王闻言惕然恐惧，是知敬慎者可以为万世之基。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=歴代名臣奏議
