  dilemmas:
  - 弹劾权贵恐招祸，仍言官职责所在，赴危直陈
  lesson: 居言官之位者，当抗直不回，虽危身而不隐于君。
  summary_first_person: 我孙懋，字德夫，号毅庵，慈溪人，正德辛未进士，官至应天府尹。任给事中时武宗嬖幸用事，我独抗直不回，奏太监于喜、史宣、张泽诸疏皆直陈无隐，又劾江彬，人多为我危，我弹劾权贵奋不顾身。
  source_urls:
  - 孙毅庵奏议（明·孙懋撰，钦定四库全书）
