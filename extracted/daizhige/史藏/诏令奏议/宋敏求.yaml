person:
  qid: guji-宋敏求
  name_zh: 宋敏求
  names:
    zh: 宋敏求
    en: Song Minqiu
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年史无明载
  era: 北宋
  reign_ref: 宋仁宗至宋神宗（景祐—熙宁年间）
  archetype: 学者型史官·文献编纂者
  dilemmas:
  - 因封还李定词头忤逆权贵，仕途受挫，退而以翰墨自守
  - 父亲半成之书稿，续成而惧失坠，藏于家楹多年后终于刊布传世
  lesson: 刚正则失位，笃守文献则不朽；仕途荣辱皆一时，典册留存乃千秋。
  summary_first_person: 我宋敏求，字次道，赵州平棘人，参知政事宋绶之子。进士及第，官至史馆修撰、龙图阁直学士，曾预修《唐书》，又私撰唐武宗以下实录一百四十八卷，于唐代史事最熟。父亲宋绶昔日采集唐代德音号令，未及编次而卒，我惧其失坠，藏于家楹多年，后绪正旧稿，总一百三十卷。治平二年简拔入西掖，正缮写成编，却因封还李定词头忤权解职，遂以"唐大诏令"名其集而藏之，熙宁三年自为之序。
  source_urls:
  - https://zh.wikisource.org/wiki/唐大诏令集
