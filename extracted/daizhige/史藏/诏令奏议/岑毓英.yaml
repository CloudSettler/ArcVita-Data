person:
  qid: guji-岑毓英
  name_zh: 岑毓英
  names:
    zh: 岑毓英
    en: Cen Yuying
  era: 清代同治、光绪年间
  reign_ref: 光绪
  archetype: 封疆大吏 / 边防统帅
  dilemmas:
  - 海疆多事之际，被廷臣举荐督办台湾，需在大员渡台、统筹全局与原任职务之间权衡
  lesson: 危局之中，干练之臣常为朝廷倚重，委以筹边重任。
  summary_first_person: 我岑毓英在同治、光绪年间仕于清廷。据《道咸同光四朝奏议选辑》所载，光绪六年议结球案倭约时，有奏疏附片请调我督办台湾事务，可见当时我的才干已为朝中重臣所知，被视为筹办台湾海防、抚垦大计的合适人选。
  source_urls:
  - https://zh.wikisource.org/wiki/道咸同光四朝奏议选辑
