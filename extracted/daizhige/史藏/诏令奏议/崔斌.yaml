  dilemmas:
  - 直言弹劾权臣阿合马，虽得清誉却遭报复构陷，忠直与保身难以两全
  - 身居中书要职，既欲推行善政，又须周旋于聚敛之臣专权的朝局之间
  lesson: 若亲近直言敢谏之臣，方能免主蔽于奸佞，政ForeColor失于聚敛
  summary_first_person: 我崔斌仕元世祖朝，官至中书省，以直言敢谏著称；曾疏陈便民十五事，议缓征日本、置太子官属，并弹劾权臣阿合马之奸贪，然终为阿合马党羽所忌恨构陷，冤屈而死，是元初刚正不阿之诤臣。
  source_urls:
  - https://zh.wikipedia.org/wiki/崔斌
