  birth_date: '1575'
  death_date: '1625'
  era: 明代晚期（万历至天启年间）
  reign_ref: 明神宗、明熹宗
  archetype: 直臣死谏之孤臣型——正色立朝、抗疏批鳞而身死诏狱的忠荩杰士
  dilemmas:
  - 直言批鳞必触怒权阉，缄默保身则坐视阉祸乱政，忠君与自全不可两全
  - 奏疏切中利病可裨时政，而当时主闇政昏，言虽正而行不能达，留名与济世分离
  lesson: 危言谠论不以身殁而废——其言可援为金鉴，其气节足为后世炯戒
  summary_first_person: 我是左光斗，万历间成进士，天启朝官至御史。魏忠贤窃柄、阉人满朝之际，我与杨涟正色立朝，慷慨抗疏，劾阉党之罪，剀切敷陈，欲绳愆纠谬以正朝纲。忠言未纳，反遭构陷，天启五年瘐死诏狱。今上追论，谓若明之君能采而用之，犹不致败亡，录我奏疏以为殷鉴，亦足以慰我在狱中不改之初心。
  source_urls:
  - https://zh.wikipedia.org/wiki/左光斗
