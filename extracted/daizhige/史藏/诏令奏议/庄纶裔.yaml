  dilemmas:
  - 教民恃教讹索与依约保护教士之间的两难
  - 义和团之际剿办乱民与保全地方民心的权衡
  lesson: 州县虽小官，实心实政仍可固结民心、维持国本，文学与政事并非歧出。
  summary_first_person: 我是庄纶裔，字纫秋，阳湖人，光绪年间任莱阳知县。我任职六年，精于听断，严治讼棍手裁堂判，使讼词由每期百余纸减至二三十纸；庚子前后我禁赌禁习拳、护教缉贼，办理法人涉讼诸案，并将治县公牍手自著录为《卢乡公牍》进呈抚宪。
  source_urls:
  - 本传：《卢乡公牍》序及正文
