  summary_first_person: 我是张佩纶，清末清流名臣。我在光绪三年上《扼要筹边宜规久远摺》，力陈边疆防务须作长久规划；光绪十年又上摺遵查署台湾镇杨在元难期得力，参劾不得力之官员，以整饬台湾防务。
  source_urls:
