    title_zh: 移檄布置肃州官守并拨兵驻防嘉峪关
    rationale: 城池虽复民心惊惶，弹压需兵，以杜昂汉彝人窥伺之端
  - date: 1655-02
    title_zh: 疏陈甘肃积弊并自述整顿
    rationale: 应诏直陈兵民疾苦、政事利弊，言其害即举其利
events:
- id: guji-张勇-event-birth
  type: birth
  title_zh: 张勇生
  summary_zh: 生年不详，上元人，字飞熊。
- id: guji-张勇-event-shunzhi6-shouming
  date: 1649-05-04
  year_of: 1649
  type: endeavor
  title_zh: 奉旨实授甘肃总兵官
  summary_zh: 因总督孟乔芳会题岩疆亟需总镇，奉旨以都督佥事充总兵官，镇守甘肃等处地方，颁给勑印。
- id: guji-张勇-event-suzhou-fucheng
  date: 1649-11-18
  year_of: 1649
  type: endeavor
  title_zh: 攻复肃州、生擒逆首
  summary_zh: 顺治六年十一月十八日夜率兵登城克复肃州，二十七日驰援内外夹攻，活擒丁国栋，二十九日又擒黑成印，共斩首五千余级。
- id: guji-张勇-event-nanzheng-qingying
  date: 1655-02-25
  year_of: 1655
  type: endeavor
  title_zh: 奏请効力繁剧
  summary_zh: 上疏自陈愿统师南下灭寇安民，奉旨忠勤可嘉，着即来京以俟简用，旋仍留镇甘肃。
- id: guji-张勇-event-jibi-zhengdun
  date: 1655
  year_of: 1655
  type: endeavor
  title_zh: 疏陈甘肃积弊与整顿
  summary_zh: 疏言总镇克减军饷、克剥小民之弊，自述买牛劝农、修店招商、赈济穷民、革除陋规，七年兵民相安。
- id: guji-张勇-event-fuzheng
  date: 1674
  year_of: 1674
  type: endeavor
  title_zh: 奉调征讨王辅臣之乱
  summary_zh: 康熙十三年以后奉调南征，旋回甘肃，往来征讨王辅臣之乱，日无宁晷。
- id: guji-张勇-event-jianchuang
  date: 1674
  year_of: 1674
  type: endeavor
  title_zh: 箭创病足肩舆督师
  summary_zh: 自康熙十三年后箭创病足，以肩舆督师者十年，屡乞解职皆荷优诏慰留，卧理边防。
- id: guji-张勇-event-ganzhou-yishu
  date: 1684
  year_of: 1684
  type: endeavor
  title_zh: 力疾出师与甘州遗疏
  summary_zh: 为防御麦力干力疾出师，卒于军营，终以甘州遗疏，兵间凡四十余年，封靖逆侯加少傅兼太子太师。
- id: guji-张勇-event-death
  date: 1684
  year_of: 1684
  type: death
  title_zh: 张勇卒
  summary_zh: 康熙二十三年卒于甘肃军营，谥襄壮，所上奏疏百二十篇由其子云翼编为《张襄壮奏疏》。
