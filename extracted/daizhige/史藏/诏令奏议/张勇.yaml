person:
  qid: guji-张勇
  name_zh: 张勇
  names:
    zh: 张勇
    en: Zhang Yong
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      date: 1684
      precision: year
      is_circa: false
      raw: 康熙二十三年卒于军营
  death_date: 1684
  era: 清初（顺治、康熙年间）
  reign_ref: 顺治、康熙
  archetype: 边镇儒将
  dilemmas:
  - 边疆坐镇与请缨南下効力之间的取舍
  - 屡乞解职而朝廷优诏慰留、卧理边防
  lesson: 知有国而不知有家，终身效命疆场，善弈者谋势，善谋者定边。
  summary_first_person: 我张勇，字飞熊，上元人。自顺治年间平定河西回民之乱、恢复肃州起，镇守甘肃数十年，后获封靖逆侯、靖逆将军，提督甘肃军务，加少傅兼太子太师。三藩之乱时往来征讨平定王辅臣，终以箭创病足之躯力疾出师防御麦力干，卒于甘州军营，兵间四十余年。
  source_urls:
  - 钦定四库全书·张襄壮奏疏
