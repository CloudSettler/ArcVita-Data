  archetype: 直谏之臣
  lesson: 忠亮直谏，虽谪居瘴疠八年而志不挫
  summary_first_person: 我张原，字士元，号玉坡，三原人，正德甲戌进士，授吏科给事中。因极论时政，谪贵州新添驿丞八年。嘉靖元年复官，益慷慨直谏，力折权幸，不避祸患，以谏诤为已任，言人所不能言。
