  dilemmas:
  - 皇太后为张延龄说情，法度与慈恩两难
  - 由藩王旧邸入赞大礼，名分与法理交织
  lesson: 恩有所当加，法有所当屈，仁义须并用而不可偏废。
  summary_first_person: 我是张孚敬，字秉用，温州永嘉人。以议大礼起家，得世宗信任，官至内阁首辅。嘉靖十二年昭圣皇太后为张延龄案传谕说情，我奏对恳切，主张延龄杀人罪不可宥，而谋逆情节须待法官具招，详审而后裁断，不敢轻率议处。
  source_urls:
  - 谕对录（明）张孚敬撰
