  - 位极人臣而侍奉苛刻之君，如何在圣意纤微之间谨慎承旨、不敢以私意参其间
  lesson: 秉公佐治、恪守臣节，以缜密勤慎之姿襄赞两朝政令文书之编纂与宣示
  summary_first_person: 我是张廷玉，历仕康雍乾三朝，官至保和殿大学士仍管吏部户部尚书、翰林院掌院学士。雍正七年，我与怡亲王允祥等廷臣合词奏请将历年上谕彚编刊刻颁行天下，遂有《上谕内阁》一书，使臣民咸知圣训，永为法守。
