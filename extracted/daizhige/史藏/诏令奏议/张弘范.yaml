person:
  id: guji-张弘范
  name_zh: 张弘范
  names:
    zh: 张弘范
    en: Zhang Hongfan
  lifespan:
    birth:
      date: '1238'
      precision: year
      is_circa: true
      raw: 元太宗十年前后生，年四十三卒逆推
    death:
      date: 1280-01
      precision: month
      is_circa: false
      raw: 至元十七年正月卒，年四十三
  birth_date: '1238'
  death_date: '1280'
  era: 元代（蒙古—元初）
  reign_ref: 元世祖忽必烈中统、至元年间
  archetype: 出将入相之元代汉军世侯子弟、灭宋统帅
  dilemmas:
  - 身为汉人世侯之后仕蒙元而领兵灭宋，功业与名节之两难
  - 统军杀伐与安民仁政（如荒年请免租税）之间的取舍
  lesson: 以严明军纪与体恤民生并行，方能在乱世统驭大军、成一代功业；然助新朝灭故国者，功过任由后人评说。
  summary_first_person: 我张弘范，易州定兴人，蔡国公张柔第九子。少事世祖潜邸，长而将兵。襄阳一役我先登破城，焦山水战大破宋军，终以蒙古汉军都元帅之职，于崖山覆宋，勒石纪功。然我亦知马上得之不可马上治之，荒年尝奏免租税以安黎庶。平宋之后未几病卒，年四十三，追封淮阳王，谥献武。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷156
  - https://www.zhonghuadiancang.com/lishizhuanji/yuanshi/
endeavors:
- id: guji-张弘范-endeavor-1
  name_zh: 从军征伐与襄阳破宋
  phases:
  - key: brewing
    name_zh: 早期军旅历练
    labels:
      zh: 世侯之后、潜邸近臣
    start_date: '1256'
    highlight_event_id: guji-张弘范-event-early-career
  - key: breakthrough
    name_zh: 襄阳之围建功
    labels:
      zh: 攻襄阳、破樊城
    start_date: '1268'
    highlight_event_id: guji-张弘范-event-xiangyang
  decisions:
  - date: '1268'
    title_zh: 请预襄阳之役并献城守攻取之策
    rationale: 襄阳为宋之咽喉，拔之则江南可图，遂自请效力以立功名。
  - date: '1272'
    title_zh: 建言先断樊城、隔绝襄阳声援
    rationale: 樊襄唇齿相依，断浮桥、分兵夹攻，则二城俱下。
- id: guji-张弘范-endeavor-2
  name_zh: 率师灭宋与崖山决战
  phases:
  - key: climax
    name_zh: 东下平宋
    labels:
      zh: 焦山水战、追二王、崖山
    start_date: '1275'
    highlight_event_id: guji-张弘范-event-yashan
  - key: closure
    name_zh: 平宋后病卒
    labels:
      zh: 勒石纪功、病逝
    start_date: '1279'
    highlight_event_id: guji-张弘范-event-death
  decisions:
  - date: '1274'
    title_zh: 上疏请为灭宋前锋
    rationale: 伐宋大计已定，自请率军南下以建不世之功。
  - date: '1279'
    title_zh: 崖山决战围歼宋军残部
    rationale: 宋舟聚崖山负隅，断其汲道、乘风纵攻，一举荡平，绝宋祀而后南北一统。
  - date: ~1279
    title_zh: 荒年奏免租税
    rationale: 兵燹之余民生凋敝，轻徭薄赋以固新朝根本、收拾人心。
events:
- id: guji-张弘范-event-birth
  event_type: birth
  date: '1238'
  year_of: 1238
  title_zh: 张弘范生于易州定兴
  description_zh: 张柔第九子，生于蒙古攻金烽火之际，长于军功世家。
- id: guji-张弘范-event-early-career
  event_type: endeavor_milestone
  date: '1256'
  year_of: 1256
  title_zh: 事世祖潜邸，习武修文
  description_zh: 弘范少从郝经受学、兼习骑射，为藩邸近侍，渐预军政。
- id: guji-张弘范-event-xiangyang
  event_type: endeavor_milestone
  date: '1273'
  year_of: 1273
  title_zh: 襄阳陷，弘范功居其多
  description_zh: 至元十年樊城破、襄阳降，弘范先登督战有功，为灭宋之局奠定基石。
- id: guji-张弘范-event-jiaoshan
  event_type: endeavor_milestone
  date: '1275'
  year_of: 1275
  title_zh: 焦山水战大破宋军
  description_zh: 至元十二年，与宋将张世杰、孙虎臣等战于焦山，以火攻破宋水师，进抵临安近郊。
- id: guji-张弘范-event-yashan
  event_type: endeavor_milestone
  date: 1279-03
  year_of: 1279
  title_zh: 崖山海战灭宋，勒石纪功
  description_zh: 至元十六年，以蒙古汉军都元帅督舟师围宋军于崖山，宋军覆没，陆秀夫负幼帝赴海，弘范勒石「镇国大将军张弘范灭宋于此」而还。
- id: guji-张弘范-event-death
  event_type: death
  date: 1280-01
  year_of: 1280
  title_zh: 张弘范病卒
  description_zh: 平宋还朝未几，感瘴疾而卒，年四十三。后追封淮阳王，谥献武。
