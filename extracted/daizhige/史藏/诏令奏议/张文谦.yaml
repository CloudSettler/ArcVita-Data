  title_zh: 张文谦卒
  description: 官至昭文馆大学士、领太史院事，卒赠少傅，谥忠宣。
  type: death
- id: guji-张文谦-event-endeavor-1
  date: '1251'
  year_of: 1251
  title_zh: 请择官治邢州，邢州大治
  description: 邢州两牧非人、民流地荒，文谦与刘秉忠进言于忽必烈，请选近侍脱兀脱、尚书刘肃、侍郎李简等往治之，期月户增十倍，世祖由是重儒臣，视汉地为可行王化之验。
  type: endeavor
  endeavor_id: guji-张文谦-endeavor-1
- id: guji-张文谦-event-endeavor-2
  date: '1253'
  year_of: 1253
  title_zh: 从征大理，力谏杀掠
  description: 忽必烈征大理，文谦与姚枢、刘秉忠随行，极谏止杀，大军不妄戮一人，南诏全活，天下归心。
  type: endeavor
  endeavor_id: guji-张文谦-endeavor-2
- id: guji-张文谦-event-endeavor-3
  date: '1276'
  year_of: 1276
  title_zh: 领太史院，佐修《授时历》
  description: 以昭文馆大学士领太史院事，奏请改历，与王恂、郭守敬、许衡等立局测验四方晷景，至元十七年《授时历》成，文谦实董其成。
  type: endeavor
  endeavor_id: guji-张文谦-endeavor-2
