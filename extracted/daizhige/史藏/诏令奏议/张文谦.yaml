  era: 元代（金末至元世祖至元年间）
  reign_ref: 元世祖忽必烈
  archetype: 谏诤辅政之臣
  dilemmas:
  - 乱世从征时力谏止杀，与军功掠夺之利相冲突
  - 财赋之权当归中书，与近臣聚敛分权之局相抗
  lesson: 治国以安民为本，理财不可侵夺相权，谏诤贵在持正不挠
  summary_first_person: 我张文谦，邢州沙河人也。早年与刘秉忠同学于紫金山，随世祖潜邸出谋。邢州凋敝，我请择良吏试治，遂为汉地大治之始；从征之际，我屡谏杀掠，全活甚众；居中书，我坚持财赋大事必关白中书，以杜聚敛之臣专权。历官左丞、御史中丞、昭文馆大学士，领太史院事，佐定《授时历》，毕生以爱民立政为念。
  source_urls:
  - https://zh.wikipedia.org/wiki/张文谦
