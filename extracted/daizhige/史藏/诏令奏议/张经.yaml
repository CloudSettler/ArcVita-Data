  dilemmas:
  - 征剿安南需耗巨费，兵粮不足以全年用，进退难决
  lesson: 兴师远伐，必先周思预计兵马粮草，策出万全乃可成功。
  summary_first_person: 我张经在嘉靖年间任镇守广西副总兵，会同两广布按诸司筹画征讨安南莫登庸之兵马粮饷，分定水陆五哨进兵之策，并参与审验安南忠义郑氏兄弟之书信虚实。
