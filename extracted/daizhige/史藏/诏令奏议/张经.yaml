    rationale: 兴师远伐体统重大，须周思预计兵马粮草，分兵三哨正兵、二哨奇兵及海道舟师，方为万全。
  - date: '1539'
    title_zh: 会同布按诸司隔别译审郑惟憭等
    rationale: 黎宁存殁与安南忠义书信真伪关系征讨名分，须审究明实呈报，未敢擅专。
