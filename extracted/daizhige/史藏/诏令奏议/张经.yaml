  date: 1537-12-28
  year_of: 嘉靖十六年
  name_zh: 以镇守广西副总兵身份奉敕参与征剿安南之议
  place_zh: 广西
  description_zh: 嘉靖十六年十二月蔡经奉敕谕调集兵粮征剿莫登庸，张经会同两广都布按三司会议兵马粮草。
- id: guji-张经-event-2
  type: endeavor
  date: '1538'
  year_of: 嘉靖十七年
  name_zh: 会同议定水陆进兵方略
  place_zh: 两广
  description_zh: 与陆杰、万潮、沈希仪、高谊等会议，定正兵三哨、奇兵二哨、海道舟师之进兵路线，计水陆三十万众、粮米一百六十二万石、用银七十三万余两。
- id: guji-张经-event-3
  type: endeavor
  date: '1539'
  year_of: 嘉靖年间
  name_zh: 参与译审安南郑惟憭、奸细杜文庄并验书信
  place_zh: 广西
  description_zh: 与左布政使陆杰等重复隔别译审，考订郑惟悛、郑惟憭书信真伪及黎宁存殁之事。
