- id: guji-彭玉麟-event-5
  date: 1857-02
  year_of: 1857
  type: appointment
  title_zh: 奉旨为水师副统领
  description: 曾国藩丁忧离营，疏请外江内湖水师特派杨载福总统、彭玉麟副之，上命与杨协力督剿。
