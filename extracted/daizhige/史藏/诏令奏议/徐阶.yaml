person:
  qid: guji-徐阶
  name_zh: 徐阶
  names:
    zh: 徐阶
    en: Xu Jie
  lifespan:
    birth:
      date: 1503
      precision: year
      is_circa: true
      raw: 弘治十六年（约1503）
    death:
      date: 1583
      precision: year
      is_circa: true
  birth_date: '1503'
  death_date: '1583'
  era: 明代嘉靖、隆庆朝
  reign_ref: 嘉靖、隆庆
  archetype: 柔而有守的内阁辅臣
  dilemmas:
  - 皇帝欲亲赴天寿山谒陵而边警频传，谏止则有拂圣意
  - 内臣欲坐营干预军务，上意难违而祖制当守
  - 皇帝命代祭太庙，礼制与君命相冲突
  lesson: 辅政之道在耐心反复进谏，以先帝成宪为据，使君主自悟而非强争
  summary_first_person: 我徐阶以大学士之位辅佐幼主，隆庆初年总裁《世宗实录》、知经筵事。天子欲亲谒山陵、命内臣坐营、遣官代祭太庙，皆我率阁臣三疏力争，或引成宪，或陈利害，终使圣意回转。我不逞一时之直，而以渐进之诚匡扶社稷。
  source_urls:
  - 明实录·穆宗实录
