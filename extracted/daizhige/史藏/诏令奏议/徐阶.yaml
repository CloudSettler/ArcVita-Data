    labels:
      zh:
      - 一代令典
    start_date: 1567-06
  decisions:
  - date: 1567-05
    title: 受命为《世宗实录》总裁官
    rationale: 先帝临御四十五年，功德巍巍，宜纂辑成编以启后人、贻法万世
- id: guji-徐阶-endeavor-2
  key_role: 知经筵事 / 首辅谏臣
  phases:
  - key: brewing
    name_zh: 隆庆初受任知经筵事
    labels:
      zh:
      - 经筵
      - 辅德
    start_date: 1567-04
  - key: breakthrough
    name_zh: 三疏谏止亲谒天寿山
    labels:
      zh:
      - 谏止巡边
      - 重社稷
    start_date: 1567-08
    highlight_event_id: guji-徐阶-event-stop-tomb-visit
  - key: climax
    name_zh: 力争罢内臣坐营、亲祭太庙
    labels:
      zh:
      - 遵先帝定制
      - 劳而不避
    start_date: 1567-09
  decisions:
  - date: 1567-08
    title: 三上疏乞止天寿山谒陵之行
    rationale: 天子之孝以保安社稷为大，虏骑环伺，边警屡闻，不宜以万乘之重轻试于危险
  - date: 1567-09
    title: 谏止内臣坐营、复团营裁革之制
    rationale: 团营已为先帝嘉靖二十九年裁革，内臣无营可坐，愿皇上惟以先帝为法
  - date: 1568-01
    title: 乞上亲诣太庙行孟春时享
    rationale: 祭祀为国家大礼，春祭为四时之首，吾不与祭如不祭，无故遣代恐非禋聚之道
events:
- id: guji-徐阶-event-birth
  date: '1503'
  year_of: 1503
  type: birth
  title: 徐阶生（约）
  description: 徐阶约生于弘治年间，后官至少师兼太子太师、吏部尚书、建极殿大学士。
- id: guji-徐阶-event-shilu-open
  date: 1567-06-01
  year_of: 1567
  type: endeavor
  title: 隆庆元年六月开馆纂修《世宗实录》
  description: 敕命成国公朱希忠为监修官，大学士徐阶、春芳、朴、以勤、居正为总裁官，以徐阶领衔总裁，可汗而称述先帝四十五年功德，务成一代之令典。
- id: guji-徐阶-event-jingyan
  date: 1567-04-22
  year_of: 1567
  type: endeavor
  title: 命徐阶知经筵事
  description: 四月癸巳，命成国公朱希忠、建极殿大学士徐阶知经筵事，以四月二十二日御经筵，务启沃君心、辅成上德。
- id: guji-徐阶-event-stop-tomb-visit
  date: 1567-08
  year_of: 1567
  type: decision
  title: 三疏谏止皇帝亲谒天寿山
  description: 上谕内阁欲亲诣天寿山行秋祭礼，徐阶等三上疏极言天寿山之后即黄花镇，之外即虏地，东西二虏欲犯喜峰、古北诸口，勿以万乘之重轻试于危险，上悟乃止。
- id: guji-徐阶-event-stop-neichen
  date: 1567-09
  year_of: 1567
  type: decision
  title: 力争罢内臣坐营
  description: 科道言内臣不当坐营、团营已先帝裁革，上诘阶等何故不奉诏，徐阶对言团营革于先帝，愿皇上惟以先帝为法，上纳其言，遂命罢之。
- id: guji-徐阶-event-temple-sacrifice
  date: 1568-01
  year_of: 1568
  type: decision
  title: 乞上亲祭太庙止代祭
  description: 隆庆二年正月上遣成国公代行孟春时享，徐阶等疏言吾不与祭如不祭，方万国来朝之初无故遣代恐非禋聚之道，上乃从之。
- id: guji-徐阶-event-death
  date: '1583'
  year_of: 1583
  type: death
  title: 徐阶卒（约）
  description: 徐阶约卒于万历十一年。
