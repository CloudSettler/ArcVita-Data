  dilemmas:
  - 身为宗室亲王，需在恭谨避嫌与辅政担纲之间权衡
  - 主持刊刻颁布上谕，须兼顾圣意尊崇与臣民教化之实效
  lesson: 辅君以忠，化民以诚；典章垂世，贵在使天下共闻共知
  summary_first_person: 我乃怡亲王允祥，雍正间深受倚重之宗室亲王。雍正七年，我偕大学士马尔赛、张廷玉、蒋廷锡等，合词奏请将雍正元年以来历颁上谕汇辑编年、刊刻颁行天下，使远近臣民家喻户晓，永为法守。
