      is_circa: false
      raw: 嘉靖四十五年十二月（1567年初崩）
  birth_date: '1507'
  death_date: '1567-01-23'
  era: 明朝（中期）
  reign_ref: 嘉靖（1522—1566）
  archetype: 中兴崇儒之君 / 敬天修省型帝王
  dilemmas:
  - 灾异频仍与政令施行的两难：既求实修实省，又恐群臣“虚文应故事”
  - 斋醮祭告与“不如常修厥德”的自省张力
  lesson: 敬天勤民，罪己修省，方能“上下交修以成励精之治”
  summary_first_person: 我以藩服承大统，即位以来遇灾异频仍，辄敕谕群臣同加修省，躬祷郊社、亲制祝文，以求上回天意、下安民生。
