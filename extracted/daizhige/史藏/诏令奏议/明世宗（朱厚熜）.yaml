    title_zh: 暂免郊祀庆成宴
    rationale: 四方灾异非常，恐多费劳民，以见奉天恤民之意
  - date: 1531-02
    title_zh: 亲往南郊祈雨
    rationale: 一冬少雪、二麦未登，恐秋荐饥，亲祷以尽虔祈之意
events:
- id: guji-明世宗-event-birth
  date: '1507'
  year_of: 1507
  type: birth
  title_zh: 朱厚熜生
  description: 兴献王之子，后入奉大统。
- id: guji-明世宗-event-death
  date: '1567-01-23'
  year_of: 1567
  type: death
  title_zh: 明世宗崩
  description: 在位四十五年，庙号世宗。
- id: guji-明世宗-event-1522南京灾变修省
  date: 1522-08
  year_of: 1522
  type: political
  title_zh: 以南京灾变敕谕修省
  description: 南京猛风骤雨、江水涌溢，帝致斋积诚告天地宗庙社稷，遣官赈恤被灾军民。
- id: guji-明世宗-event-1524诏赈恤四方
  date: 1524-09
  year_of: 1524
  type: political
  title_zh: 以四方灾异下诏赈恤
  description: 南京及淮扬大风雨、江西湖广水患，帝自省“在予一人”，命赈恤瘗埋招复、蠲免钱粮。
- id: guji-明世宗-event-1527谕杨一清求直言
  date: 1527-12
  year_of: 1527
  type: political
  title_zh: 赐敕谕杨一清求直言
  description: 杨一清因灾异上言修省乞罢，帝嘉纳其言，令其出供职，开导朕心，“务以上下一德，上回天意”。
- id: guji-明世宗-event-1531躬祷得雪
  date: 1531-12
  year_of: 1531
  type: ritual
  title_zh: 躬祷雪于南郊得雪
  description: 深冬无雪，帝躬祷南郊、社稷坛，次日雨雪，遂择日告谢天地宗庙。
- id: guji-明世宗-event-1531大内火
  date: 1531-01
  year_of: 1531
  type: incident
  title_zh: 大内东偏火，告天修省
  description: 宫中火起，帝告天祖考，谕张璁规制门砌如南京制，作“或问”自记引咎。
