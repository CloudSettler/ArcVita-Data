person:
  qid: guji-朱瞻基
  name_zh: 朱瞻基
  names:
    zh: 朱瞻基
    en: Zhu Zhanji
  lifespan:
    birth:
      date: 1399-03-16
      precision: day
      is_circa: true
      raw: 洪武三十年二月初九（相传生于北平）
    death:
      date: 1435-01-31
      precision: day
      is_circa: true
      raw: 宣德十年正月初三
  birth_date: 1399-03-16
  death_date: 1435-01-31
  era: 明代（永乐—洪熙—宣德—正统初）
  reign_ref: 宣德（1426—1435）
  archetype: 守成令主·仁宣之治的缔造者
  dilemmas:
  - 亲藩叛乱与骨肉之情：汉王高煦谋反，亲征与否关乎新君威信与宗室相残
  - 敬天祭祀与军国急务：巡边大捷后孟冬庙享之期迫近，是否留军候将
  - 民力与宫廷供用：内府织造器用繁费，取于民抑或减省俭约
  lesson: 为君者以敬天法祖、恤民节俭为本，临危决断贵在神速，功成则归德于天与祖宗。
  summary_first_person: 朕自幼蒙皇祖钟爱教诲，嗣承大统。汉王不臣，朕亲征乐安，兵贵神速，旬日就擒；北虏犯边，朕以三千铁骑出喜峰口，亲射其前锋而大破之。朕夙夜祗念祖宗付托之重，服御从俭，减半织造，罢贡祥瑞，宥胁从、恤狱囚，惟愿保安百姓，不愧天心。
  source_urls:
  - https://example.org/guji/xuanzong-baoxun
