events:
- id: guji-朱瞻基-event-birth
  year_of: 1399
  date: 1399-03-16
  is_circa: true
  type: birth
  name_zh: 朱瞻基生
  detail_zh: 生于洪武年间，自幼为成祖所钟爱，常侍左右，随事训教。
- id: guji-朱瞻基-event-accession-journey
  year_of: 1425
  date: 1425-06-10
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-3
  name_zh: 闻仁宗讣驰还北京即位
  detail_zh: 奉命在南京，仁宗不豫驰书召还，时传言已宾天，或劝从间道整兵卫，帝以君父召岂可稍迟，由驿道兼程还京，即日解严即位。
- id: guji-朱瞻基-event-revolt-decision
  year_of: 1426
  date: 1426-08-08
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-1
  name_zh: 汉王高煦反，决策亲征
  detail_zh: 宣德元年八月壬戌朔，高煦反乐安。张辅请兵二万往擒，帝以新即位小人尚怀二心，必亲征慑服之，遂严城守、搜奸细、敕诸帅以兵从。
- id: guji-朱瞻基-event-march-leean
  year_of: 1426
  date: 1426-08-26
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-1
  name_zh: 蓐食兼行直趋乐安
  detail_zh: 前军至乐安城下，蹇义、夏原吉等谏勿兼行，帝以兵贵神速、直抵城下则彼为阱中虎，遂昼夜兼进。
- id: guji-朱瞻基-event-capture-gaoxu
  year_of: 1426
  date: 1426-09-01
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-1
  name_zh: 高煦出降就擒
  detail_zh: 大军昧爽抵乐安城下，高煦临事狐疑、中心实怯，不敢出战，翌日就擒。
- id: guji-朱瞻基-event-pardon-followers
  year_of: 1426
  date: 1426-09-02
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-1
  name_zh: 胁从不问，榜谕安业
  detail_zh: 谕户部尚书夏原吉：同谋首恶数人罪不可赦，其余军民被胁从者一切不问，遣薛禄等抚安军民。
- id: guji-朱瞻基-event-border-alarm
  year_of: 1428
  date: 1428-10-01
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-2
  name_zh: 兀良哈万众侵边
  detail_zh: 巡边至石门驿，喜峰口守将驰奏兀良哈之寇万众已入大宁，将及宽河。帝曰天遣此寇投死耳，须擒不可纵。
- id: guji-朱瞻基-event-xifeng-out
  year_of: 1428
  date: 1428-10-05
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-2
  name_zh: 亲率三千铁骑出喜峰口
  detail_zh: 或言三千未必足用，帝曰兵在精与和不在多，遂决策亲征，出喜峰口，昼夜兼行。
- id: guji-朱瞻基-event-kuanhe-victory
  year_of: 1428
  date: 1428-10-06
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-2
  name_zh: 宽河之战大破虏寇
  detail_zh: 车驾距虏营二十里，虏以为戍边之兵悉众来战，帝命铁骑为两翼夹攻，亲射其前锋三人殪之，神机铳叠发，虏死者大半，悉溃走，大获生口驼马辎重。
- id: guji-朱瞻基-event-decline-table
  year_of: 1428
  date: 1428-10-25
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-2
  name_zh: 还京辞平胡表
  detail_zh: 巡边还至三河县，在京诸王文武进平胡表，帝览表示近臣曰称道过矣，诛擒皆天与祖宗之祐、将士用命，朕何与力焉。
- id: guji-朱瞻基-event-halve-weaving
  year_of: 1425
  date: 1425-10-01
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-3
  name_zh: 内府织造减半
  detail_zh: 工部奏内府供用纻丝纱罗九千匹请下苏杭织造，帝曰百姓艰难，可减半造，并谕尚书吴中体恤民力。
- id: guji-朱瞻基-event-release-boys
  year_of: 1425
  date: 1425-11-01
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-3
  name_zh: 遣还所获番童
  detail_zh: 土官李英进所获安定番童十五人，帝谓得其首恶足矣，童子何罪，即遣还本土，无父母可依者付各卫善养之。
- id: guji-朱瞻基-event-refuse-auspice
  year_of: 1429
  date: 1429-03-01
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-3
  name_zh: 拒贺驺虞祥瑞
  detail_zh: 南京守备李隆献驺虞，礼部请上表贺，帝批答以祗敬祖宗、恭养圣母皆职分当然，何德之有，溢美虚词非所乐闻，其止勿贺。
- id: guji-朱瞻基-event-spare-beheaded-corpse
  year_of: 1432
  date: 1432-07-01
  is_circa: true
  type: endeavor
  endeavor_id: guji-朱瞻基-endeavor-3
  name_zh: 罢强盗病死斩首之例
  detail_zh: 时天气炎热，谕三法司速决遣罪囚，又以强盗病死狱中例悉斩首为太过，悯而罢之，但验实勿斩。
- id: guji-朱瞻基-event-death
  year_of: 1435
  date: 1435-01-31
  is_circa: true
  type: death
  name_zh: 朱瞻基崩
  detail_zh: 宣德十年正月初三崩，庙号宣宗，谥章皇帝，葬景陵。
