    name_zh: 恳请合葬与上尊崇徽号
    labels:
      zh:
      - 圣孝
    start_date: '1468'
    highlight_event_id: guji-明宪宗-event-huanghe
  - key: closure
    name_zh: 上圣慈仁寿皇太后徽号
    labels:
      zh:
      - 圣孝
    start_date: '1484'
    highlight_event_id: guji-明宪宗-event-huanghou
  decisions:
  - date: '1468'
    title_zh: 力请慈懿皇太后与英宗合葬裕陵
    rationale: 合葬乃天理人心之至，虽碍于圣母仍恳请以全孝
