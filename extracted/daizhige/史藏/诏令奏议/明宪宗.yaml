person:
  qid: guji-明宪宗
  name_zh: 明宪宗朱见深
  names:
    zh: 朱见深
    en: Emperor Xianzong of Ming
  lifespan:
    birth:
      date: '1447'
      precision: year
      is_circa: false
      raw: 正统十二年
    death:
      date: '1487'
      precision: year
      is_circa: false
      raw: 成化二十三年
  birth_date: '1447'
  death_date: '1487'
  era: 明代中期
  reign_ref:
  - 成化
  - 天顺八年即位
  archetype: 守成之君
  dilemmas:
  - 身承天戒灾异频仍，如何修省弭灾、平衡君臣交修之责
  - 慈懿皇太后合葬裕陵之议受阻于母后，孝道与两宫之礼如何两全
  lesson: 敬天修德、虚心纳谏、以心政一致垂范子孙
  summary_first_person: 朕以菲德嗣承祖宗鸿业，临御二十余年，遇灾异必斋心修省、敕谕群臣共图交修；重经筵圣学，考订朱子《通鉴纲目》，举孝亲之礼以敦人伦，惟愿保治于攸久，跻世于隆平。
  source_urls:
  - https://zh.wikisource.org/wiki/大明憲宗純皇帝寶訓
endeavors:
- id: guji-明宪宗-endeavor-1
  name_zh: 经筵圣学与匡正典籍
  start_date: 1464-08
  highlight_event_id: guji-明宪宗-event-jingyan
  phases:
  - key: brewing
    name_zh: 开经筵讲学
    labels:
      zh:
      - 圣学
    start_date: 1464-06
    highlight_event_id: guji-明宪宗-event-jingyan
  - key: climax
    name_zh: 考订《通鉴纲目》并编纂宋元通鉴
    labels:
      zh:
      - 圣学
      - 刻书
    start_date: '1473'
    highlight_event_id: guji-明宪宗-event-gangmu
  decisions:
  - date: 1464-06
    title_zh: 命开经筵并举讲读官
    rationale: 帝王之道具载经书，临御之初先务莫急于讲学
  - date: '1473'
    title_zh: 尽去《纲目》考异考证诸书，刻梓传承
    rationale: 免学者之疑，成朱子笔削之志
  - date: 1473-11
    title_zh: 命儒臣编纂宋元二史接续通鉴
    rationale: 朱文公纲目可以辅经而行，宋元二史至今未备
- id: guji-明宪宗-endeavor-2
  name_zh: 敬天修省与弭灾图治
  start_date: '1464'
  highlight_event_id: guji-明宪宗-event-jieyu
  phases:
  - key: brewing
    name_zh: 即位之初天戒屡彰
    labels:
      zh:
      - 谨天戒
    start_date: '1464'
    highlight_event_id: guji-明宪宗-event-jieyu
  - key: climax
    name_zh: 灾异迭见屡降敕谕修省
    labels:
      zh:
      - 谨天戒
      - 敕谕百官
    start_date: '1465'
    highlight_event_id: guji-明宪宗-event-dizhen-chiyu
  decisions:
  - date: '1464'
    title_zh: 因风雹大作降敕谕群臣修省
    rationale: 深惧上天垂戒，恐德有未修而政有未举
  - date: 1465-05
    title_zh: 火星留守南斗，减膳斋心引咎责躬
    rationale: 玄象示警，不可不惧
  - date: 1485-01
    title_zh: 因灾异迭见敕谕百官直言弊政
    rationale: 天道与人事流通，必人事乖违斯天道不顺
- id: guji-明宪宗-endeavor-3
  name_zh: 孝奉两宫与上母后徽号
  start_date: '1468'
  highlight_event_id: guji-明宪宗-event-huanghou
  phases:
