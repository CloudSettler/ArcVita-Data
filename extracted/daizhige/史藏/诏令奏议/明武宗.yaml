  archetype: 雄猜之主
  dilemmas:
  - 遵祖制开经筵讲学与个人英武不羁之志相冲突
  - 宠任宦官刘瑾致朝政大乱，须倚张永诛之
  - 天灾频仍须下诏修省以回天意
  lesson: 英武独断之才可以除奸雪耻，然不纳忠谏、任用近幸则祸乱及身。
  summary_first_person: 我承继大统十七年，慎遵祖宗之法，然英武不羁之心难羁；曾诛刘瑾、平宁夏之乱；屡因灾异下诏修省，虽雄才大度，亦多游猎失度之讥。
