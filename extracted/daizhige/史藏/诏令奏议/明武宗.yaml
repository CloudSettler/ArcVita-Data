events:
- id: guji-明武宗-event-birth
  date: '1491-10-26'
  year_of: 1491
  type: birth
  summary_zh: 武宗生于弘治四年九月，孝宗之子。
- id: guji-明武宗-event-1
  date: 1505-06
  year_of: 1505
  type: political
  summary_zh: 敕谕礼部上圣祖母及圣母两宫尊号，极尽孝养。
- id: guji-明武宗-event-2
  date: '1505-11-02'
  year_of: 1505
  type: educational
  summary_zh: 遵大学士刘健之请，御文华殿暖阁日讲，接续讲读《论语》《尚书》。
- id: guji-明武宗-event-3
  date: 1506-09
  year_of: 1506
  type: omen
  summary_zh: 星变之后命张懋等分行祭告，示纳谏修省之意。
- id: guji-明武宗-event-4
  date: 1510-08
  year_of: 1510
  type: accusation
  summary_zh: 太监张永还自宁夏，密奏刘瑾不法十七事。
- id: guji-明武宗-event-5
  date: 1510-09
  year_of: 1510
  type: purge
  summary_zh: 降旨将刘瑾降奉御凤阳闲住，所行亏国体者悉奏革。
- id: guji-明武宗-event-6
  date: '1510-09-17'
  year_of: 1510
  type: execution
  summary_zh: 瑾反形已具，于午门前会多官鞫讯，凌迟三日，榜示天下。
- id: guji-明武宗-event-7
  date: 1510-10
  year_of: 1510
  type: reform
  summary_zh: 革去瑾所新设及变乱成宪、烧毁新查屯田文册，恢复旧制。
- id: guji-明武宗-event-8
  date: '1514-01-20'
  year_of: 1514
  type: disaster
  summary_zh: 乾清宫灾，释服降敕谕群臣痛加修省、直言时政阙失。
- id: guji-明武宗-event-death
  date: '1521-04-20'
  year_of: 1521
  type: death
  summary_zh: 武宗崩，世宗受遗诏入正大统，后命纂集宝训以贻典则。
