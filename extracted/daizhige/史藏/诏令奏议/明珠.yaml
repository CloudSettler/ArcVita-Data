  era: 清代康熙年间
  reign_ref: 康熙
  archetype: 权臣
  dilemmas:
  - 恩宠与法纪之间，康熙念其平定三藩之劳而不即暴示罪状，然终因植党营私被罢斥
  - 权势熏灼与言路弹劾之间，被郭琇露章胪欵抨击而无力钳制言路
  lesson: 权位再高，若徇利太深、结交太广、不恪守官箴，终难保全恩礼
  summary_first_person: 我明珠在康熙年间身为大学士，柄用有年，曾于平定三藩时赞理军务有劳，然竟不克自终，渐至植党营私、市恩通赂，为郭琇疏劾，立予罢斥，后又遭削职，虽量为录用仅授内大臣。
  source_urls:
  - https://www.zhihu.com/question/none
