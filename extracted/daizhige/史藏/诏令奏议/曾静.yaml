      raw: 卒年约乾隆初年（史载乾隆年间被处决）
  birth_date: 约1670
  death_date: 约1736
  era: 清雍正、乾隆年间
  reign_ref: 雍正帝
  archetype: 反清思想案犯
  dilemmas:
  - 受吕留良华夷之辨学说感召，试图策动反清，事败后反被雍正利用为宣示正统的工具
  - 雍正以辩驳其言行刊行《大义觉迷录》赦免之，而乾隆继位后终将其处决
  lesson: 思想传播的力量可以反噬发布者——一桩谋反案演变为皇帝的公开自辩，终成历史上罕见的奇案
  summary_first_person: 我曾静，湖南永兴人。我读吕留良遗著，笃信华夷之辨，遂遣门徒张熙投书川陕总督岳钟琪，劝其起兵反清，并直斥雍正帝谋父、逼母、弑兄等十大罪。事败被捕后，雍正不杀我，反与我反复辩驳，将问答刊为《大义觉迷录》颁行天下，命我赴各地宣讲自悔。我以为得全性命，岂料乾隆继位后终将我处死。
  source_urls:
  - https://zh.wikisource.org/wiki/大義覺迷錄
