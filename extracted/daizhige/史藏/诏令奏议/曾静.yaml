- id: guji-zengjing-event-read
  name_zh: 得读吕留良著述，思想转向反清
  date: 约1725
  year_of: 1725
  description: 读吕留良遗著，受其华夷之辨、明清易代"天昏地暗"之说蛊惑，与严鸿逵门徒转相传习
- id: guji-zengjing-event-letter
  name_zh: 遣张熙投书岳钟琪
  date: 1728
  year_of: 1728
  description: 遣门徒张熙赴川陕总督岳钟琪处投递逆书，列举雍正谋父、逼母、弑兄、屠弟等罪，劝其谋反；岳钟琪设计诱供，案发
- id: guji-zengjing-event-arrest
  name_zh: 被捕解京，雍正亲加审辩
  date: 1729
  year_of: 1729
  description: 案发后解送京师，雍正亲自条陈驳斥其言论，追认源出吕留良，酿成吕留良文字狱大案
- id: guji-zengjing-event-daju
  name_zh: 《大义觉迷录》颁行，奉旨免罪宣讲
  date: 1730
  year_of: 1730
  description: 雍正将逆书与上谕刊为《大义觉迷录》颁布各府州县学宫，赦免曾静并令其赴江南等地宣讲悔过
- id: guji-zengjing-event-death
  name_zh: 乾隆即位后被处死
  date: 约1736
  year_of: 1736
  description: 乾隆继位后推翻雍正处置，将曾静、张熙处决，《大义觉迷录》遭查禁
