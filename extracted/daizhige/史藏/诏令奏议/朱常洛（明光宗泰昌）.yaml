events:
- id: guji-朱常洛-event-birth
  date: 1582-08-28
  year_of: 1582
  title_zh: 朱常洛生于万历十年八月
  detail: 为明神宗长子，母恭妃王氏。
- id: guji-朱常洛-event-tingji
  date: 1615-05-04
  year_of: 1615
  title_zh: 梃击案——张差持梃入东宫
  detail: 万历四十三年五月初四，男子张差持梃突入东宫殿檐下，当时就擒；皇太子谕法司科道，断为风癫误入，诬攀庞保刘成从轻拟罪以安人心。
- id: guji-朱常洛-event-accede
  date: 1620-08
  year_of: 1620
  title_zh: 嗣皇帝位，改建元泰昌
  detail: 万历四十八年神宗崩，太子朱常洛嗣位，方欲崇德显扬、追尊先人。
- id: guji-朱常洛-event-ceremony
  date: 1620-09
  year_of: 1620
  title_zh: 追尊生母康妃为皇太后、议祔葬典礼
  detail: 谕礼部集议上尊谥，并举祔葬岁时享祀事宜，查例具奏。
- id: guji-朱常洛-event-death
  date: 1620-09-26
  year_of: 1620
  title_zh: 泰昌帝崩，庙号光宗
  detail: 在位仅一月余，生辰适逢大行皇帝梓宫未发，倍切哀痛；谥贞皇帝。
