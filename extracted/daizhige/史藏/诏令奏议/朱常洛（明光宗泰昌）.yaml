  era: 明代晚期
  reign_ref: 泰昌（1620）
  archetype: 短命而多难的守成之君
  dilemmas:
  - 在"梃击案"中需平息群疑又不欲株连无辜、惊伤天和
  - 生母宫人出身的身世与追尊所生之母亲的孝礼之间的礼制两难
  - 在位仅一月，父丧未及尽哀而生辰反增哀痛的伦理处境
  lesson: 处重案当重人命、止株连，以阴德安人心；然冲龄多舛，寿祚天不假年。
  summary_first_person: 我以先皇长子出阁读书多年，万历四十三年五月初四有男子张差持梃入东宫，法司究问，喜事者倡为谋危之说，人情皇皇。我于慈宁宫门谕群臣再三，断其情实系风癫误入，诬攀庞保刘成者从轻拟罪，恐伤天和，务使刑狱平而人心安。及嗣位，改建泰昌，方欲追尊所生母康妃为皇太后、经营典礼，而龙驭上宾，志未逮焉。
  source_urls:
  - https://zh.wikipedia.org/wiki/泰昌帝
