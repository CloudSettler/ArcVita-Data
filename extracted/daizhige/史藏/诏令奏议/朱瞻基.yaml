  event_type: education
  date: '1404'
  year_of: '1404'
  summary_zh: 朕自幼龄恭侍皇祖太宗文皇帝朝夕，仰承慈爱训谕，彝伦日用至宗社天下之务，靡不本末该举，拳拳服膺。
