  event_type: political
  date: '1425'
  year_of: '1425'
  summary_zh: 朕承嗣洪业，临御天下，外朝群臣奏对之际，圣谟大训见诸政令诰谕者尚多。
- id: guji-朱瞻基-event-preface
  event_type: literary
  date: '1430-01-21'
  year_of: '1430'
  summary_zh: 宣德五年正月二十一日，实录既成，朕特命儒臣汇稡皇祖宝训十五卷六十类合五百八十六条，谨序诸篇端，垂示子孙。
- id: guji-朱瞻基-event-death
