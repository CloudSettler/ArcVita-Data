  dilemmas:
  - 国本之争与廷臣相持，君臣离心
  - 梃击案中案涉内官，欲息群疑又不欲株连无穷
  - 息政与朝政废弛之间的执两用中
  lesson: 人命至重不当因猜疑波及无辜；久居尊位者，懈怠之害积于无形。
  summary_first_person: 朕朱翊钧，十岁登基，在位四十八年。少年倚张居正励精图治，吏称民安；中岁以后倦于临朝，遇大狱如梃击案，朕亲谕群臣，诫勿株连无辜、恐伤天和。
  source_urls:
  - 大明光宗贞皇帝宝训卷之一
