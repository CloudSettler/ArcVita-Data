  reign_ref:
  - 明孝宗弘治
  - 明武宗正德
  archetype: �阁重臣·直言奏议之臣
  dilemmas:
  - 刘瑾专权时期身居内阁，周旋于阉党与朝臣之间，进退出处两难
  - 既欲匡救时政又不忍轻去其位，屡屡上疏直陈政失
  lesson: 位尊不避危疑，身处浊世而以奏议穷陈政失，可谓知不可为而为之。
  summary_first_person: 我李东阳，历仕天顺至正德五朝，官至内阁首辅。弘治末年我上《陈政令十失疏》，直指朝政之弊；正德年间刘瑾乱政，我留任内阁曲为补救，又上《议边军入卫疏》论边务，于危难中支撑朝局。
  source_urls:
  - https://zh.wikisource.org/wiki/御選明臣奏議/卷十一
  - https://zh.wikisource.org/wiki/御選明臣奏議/卷十三
