  archetype: military-governor
  dilemmas:
  - 三藩叛乱，浙江兵力不足，需在固守与求援之间权衡
  - 战乱之际既要剿贼，又须安民、招抚、赈济，军政两难
  lesson: 临危受命，运筹调度，终以福建之功定东南
  summary_first_person: 我在康熙十二年出任浙江总督，適逢三藩之乱起，闽变猝发，我统筹堵御、督师衢州，历经数年苦战，连复仙霞诸关，平定浙闽乱局，并招抚难民、蠲免钱粮以安地方。
