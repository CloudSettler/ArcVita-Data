  description_zh: 朱季友献书诋毁濂洛关闽之学，士奇主张毁其著书以免误后人，上敕焚其书笞其人。
- id: guji-杨士奇-event-3
  person_qid: guji-杨士奇
  type: endeavor
  date: 1409-03
  year_of: 1409
  place_zh: 右顺门
  description_zh: 永乐九年三月，上召问东宫所行，士奇对以孝敬，言殿下以爱人为本，将来宗庙社稷之寄允不负付托，上赐酒馔。
- id: guji-杨士奇-event-4
  person_qid: guji-杨士奇
  type: endeavor
  date: '1413-12-28'
  year_of: 1413
  place_zh: 南京
  description_zh: 永乐十一年十二月正旦日食之议，黄淮、杨荣等未有对，士奇引富弼之事建议免贺，上从之。
- id: guji-杨士奇-event-5
  person_qid: guji-杨士奇
  type: endeavor
  date: '1416'
  year_of: 1416
  place_zh: 南京
  description_zh: 永乐十四年，士奇直言汉王高煦异志之状，请上早善处置；后高煦私造兵器等实迹具显，被削两护卫，处乐安州。
- id: guji-杨士奇-event-6
  person_qid: guji-杨士奇
