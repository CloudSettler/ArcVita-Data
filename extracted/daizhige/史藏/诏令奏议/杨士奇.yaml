  decisions:
  - date: '1413-12-28'
    title_zh: 建议正旦日食免贺
    rationale: 日食天变之大者，前代元正日食多不受朝，敬天致诚必求当理
  - date: '1416'
    title_zh: 直言汉王朱高煦异志，请早处置
    rationale: 汉王两辞就藩，惟欲留南京，天下人疑其心，宜早善处置以全父子之恩
  - date: '1417'
    title_zh: 与蹇义共荐礼部侍郎仪智侍皇太孙讲读
    rationale: 仪智起家学官，道理明，执守正，精神不衰，老成正大未见其比
