  dilemmas:
  - 直言进谏与保全自身之间的平衡：面对朱季友诋毁先儒、汉王朱高煦异志等事，须在君威与公义之间直言不隐
  lesson: 为臣当戒私交，为士当务清谨；直言勿隐，能服善
  summary_first_person: 我是杨士奇，历仕永乐至宣德三朝，以文学侍君，以直道辅东宫，遇事必直言，蒙先帝知遇，荣宠终身。
