    en: Yang Yuebin
  lifespan:
    birth:
      date: '1822'
      precision: year
      is_circa: true
      raw: 生年不详，约道光初年
  birth_date: 约1822年
  death_date: ''
  era: 清道光、咸丰、同治年间
  reign_ref: 道光—咸丰—同治
  archetype: 湘军水师统帅／疆臣
  dilemmas:
  - 忠孝难两全：父母年老多病而军务吃紧，朝廷令“移孝作忠”
  - 甘省贫瘠缺饷缺粮与用兵方略之两难
  - 开缺养亲之请与朝廷倚畀之冲突
  lesson: 身先士卒、廉洁朴讷，谋勇兼备而忠于所事
  summary_first_person: 我杨岳斌原名载福，湖南善化人。自道光二十六年由行伍起家，咸丰间随曾国藩治水师，湘潭、岳州、田家镇诸役身先陷阵，转战长江十年，克九江、复武昌汉阳，卒破金陵之围；后总督陕甘，力撑危局，虽伤病交作仍苦战不辍。
  source_urls:
  - https://zh.wikisource.org/wiki/楊勇愨公奏議
