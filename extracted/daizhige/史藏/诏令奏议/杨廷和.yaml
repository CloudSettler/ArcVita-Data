  dilemmas:
  - 武宗失德荒嬉，辅臣直谏与保全身位两难
  - 大礼议中维护礼法祖制与迎合新君意志的冲突
  lesson: 礼法大纲不可轻废，虽居定策之功亦当以身守之
  summary_first_person: 我杨廷和，历仕三朝，官至内阁首辅。武宗巡幸无度，我屡上疏切谏；武宗崩后，我总揽朝政四十余日，定策迎立世宗。及大礼议起，我执祖训礼法力争，终忤帝意，乞归故里。
  source_urls:
  - https://zh.wikisource.org/wiki/御选明臣奏议
