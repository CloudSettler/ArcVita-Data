  era: 明末（万历至天启年间）
  reign_ref:
  - 明神宗万历
  - 明熹宗天启
  archetype: 直臣/谏臣
  dilemmas:
  - 面对魏忠贤阉党专权，疏劾权阉则身遭横祸，缄默则负忠臣之责
  - 皇帝年幼昏聩、太阿倒持之际，犯颜批鳞须以性命作注
  - 忠君爱国之忱与君王昏聩、朝政失当之间的深刻矛盾
  lesson: 危言谠论，正色立朝；虽人品涉党争毁誉，其直言切中利病者，不可以人废言。
  summary_first_person: 我杨涟，万历进士出身，官至左副都御史。天启年间，魏忠贤窃柄、权幸满朝，我上疏劾其二十四大罪，慷慨d建议、剀切敷陈，正色立朝不避斧钺。终为阉党构陷入狱，拷掠而死，以身殉直。百余年后，乾隆帝犹谓我辈奏疏"危言谠论，关系前代得失"，将我与左光斗、熊廷弼并列，搜采入《御选明臣奏议》，以垂法戒、昭炯鉴。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=御选明臣奏议
