- id: guji-杨涟-event-taichang
  date: 1620-09
  year_of: 1620
  name_zh: 昌平卫直谏／光宗危殆之际抗疏
  type: career
  related_to: guji-杨涟-endeavor-1
  description_zh: 泰昌帝病笃，杨涟力请光宗慎医药以奏。遂被召见，声名大振。文云"折冲疆场、正色立朝，俱能慷慨建议、剀切敷陈"，此其立朝之端。
- id: guji-杨涟-event-yigong
  date: 1620-10
  year_of: 1620
  name_zh: 移宫案抗疏争纲常
  type: career
  related_to: guji-杨涟-endeavor-1
  description_zh: 李选侍据乾清宫，杨涟抗疏请移宫，官至左副都御史，直声动朝野。
- id: guji-杨涟-event-cixi
  date: 1624-06
  year_of: 1624
  name_zh: 上疏劾魏忠贤二十四大罪
  type: career
  related_to: guji-杨涟-endeavor-1
  description_zh: 天启四年，杨涟疏数魏忠贤二十四大罪，"危言谠论，关系前代得失"，忠言之烈震动朝野。
- id: guji-杨涟-event-arrest
  date: 1625
  year_of: 1625
  name_zh: 遭阉党构陷入狱
  type: career
  related_to: guji-杨涟-endeavor-1
  description_zh: 魏忠贤党羽矫诏逮系，与左光斗同下诏狱，严刑拷掠。
- id: guji-杨涟-event-death
  date: 1625
  year_of: 1625
  name_zh: 死于诏狱
  type: death
  description_zh: 天启五年，死于狱中。事后乾隆称"胜国去今尤近，三百年中荩臣杰士，其规陈治乱、抗疏批鳞当亦不亚汉唐宋元诸臣"，命将其奏疏搜采入《御选明臣奏议》。
