  birth_date: '1371'
  death_date: '1440'
  era: 明代（洪武至正统初）
  reign_ref: 明成祖、仁宗、宣宗、英宗朝
  archetype: 辅政重臣
  dilemmas:
  - 亲征进兵之速与稳妥之辩：宣德元年汉王高煦反，车驾兼行，杨荣等进言“军临敌境尤宜慎重”，主张少驻兵广哨望
  - 谏言与恭谨之平衡：身为侍臣与少傅，屡在郊祀、巡边、谒陵等大事中指出言恳切
  lesson: 居辅政之位者，既要斗胆直谏、虑事周详，又要恭体君心、同心协虑以成治功。
  summary_first_person: 我杨荣历仕四朝，以内阁大学士之位辅弼君主。在宣德朝，我常与蹇义、夏原吉、杨士奇等奉召备顾问：郊祀之诚、亲征之慎、谒陵之孝、瑞物勿贺之谦，我皆参与谋议。
  source_urls:
  - https://example.org/guji/xuanzong-baoxun
