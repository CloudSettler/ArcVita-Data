  title_zh: 谏亲征汉王宜慎重缓进
  description_zh: 宣德元年八月壬戌朔汉王高煦反，上亲征。庚辰车驾至盐山，杨荣与蹇义、夏原吉、杨士奇等进言军临敌境尤宜慎重，请少驻兵广哨望而后进。上以兵贵神速不听，遂抵乐安擒高煦。
