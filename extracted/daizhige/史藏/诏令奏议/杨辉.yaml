    title_zh: 准令税粮折收苗银
    rationale: 寨老袁昱等告称运赴贵州兴隆等仓搬运本色艰难，愿折纳轻赍银两，遂令各里每米一石折收苗银一两，类解该仓买米上纳
  - date: 1452-12
    title_zh: 起立坊牌表彰恩典
    rationale: 以输粟助军饷蒙赐敕奖谕，欲表彰朝廷恩典，立坊牌上写勑赐二字
  - date: 1475
    title_zh: 具奏致仕，让杨爱袭职
    rationale: 因患暗风病，众心不肯保结杨友袭替，只得具奏致仕，由嫡子杨爱替职，一应政事仍自主张
