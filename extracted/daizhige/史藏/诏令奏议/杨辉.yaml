  - date: 1476
    title_zh: 令杨爱出名具奏请兵
    rationale: 捏称大坝山原系本司怀远府故地被苗占据，乞会兵征剿，实为分割容山重安地土、另立宣抚司予杨友
  - date: 1476
    title_zh: 嘱托张瓒奏设安抚司
    rationale: 官军到彼不经交锋而就抚，杨辉嘱托巡抚张瓒于大坝山设立安宁宣抚司并二长官司，以杨友、俞温、何清等为安抚长官
