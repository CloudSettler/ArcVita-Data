  era: 明代景泰至成化年间
  reign_ref: 明景泰、天顺、成化年间
  archetype: 边地土司
  dilemmas:
  - 身为朝廷封疆宣慰使，却私收阉人、侵占田地、纵容亲族违法，礼法与私欲相悖
  - 立嗣之际偏爱庶长子杨友，违背杨氏家法立嗣以嫡之制，酿成家族内争
  - 为分地土予宠子，设计奏请开设安宁宣抚司等衙门，假公济私、构陷忠良
  lesson: 封疆之柄不可徇私。杨辉以土司之尊听信嬖妾、溺爱憎长，伪造边情、滥设衙门，终致子嗣相争、部属贪横、地方不宁，身败名裂于勘问之疏。
  summary_first_person: 我是杨辉，播州宣慰使杨铿之后，继祖父杨纲袭职。景泰间苗蛮反叛，我输粟助饷蒙赐敕奖谕，又令税粮折纳银两以纾民力。然我亦多有过失：私收阉割之人使唤，据杉木、黑铅之利，听信妾田氏之言欲以庶长子杨友承袭而未果，致仕后犹专政事。后为予杨友地土，捏奏生苗占据大坝山，请兵征剿设安宁宣抚司等衙门，责死长官司长官韩瑄，纵弟张渊、张深等胡作非为。成化十五年我分庄田金银与诸子，然家族纷争日炽，丑声外扬，事多干碍，终为朝廷差官勘问。
  source_urls:
  - https://www.zhonghuadiancang.com/daojiaozongjiao/kuanyuboc情况/zhouyishujing/16697/
