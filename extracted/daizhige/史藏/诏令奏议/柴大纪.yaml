      is_circa: false
      raw: 乾隆五十三年（1788年）
  birth_date: ''
  death_date: 1788
  era: 清乾隆年间
  reign_ref: 乾隆五十二年（1787）至五十三年（1788）台湾林爽文事件
  archetype: 守城名将而晚节不保的武臣
  dilemmas:
  - 死守诸罗孤城以尽职守，与彼时延误调度、兵败获咎之间的两难
  - 位至提督封伯之荣宠，与旋即革职严审、身败名裂的反差
  lesson: 军功与荣宠系于严格军纪与统帅信任；一旦失察获罪，前功难赎。
  summary_first_person: 我是柴大纪，官至福建台湾镇总兵，后署福建陆路提督。林爽文起事时我督率官兵堵御府城，又力守诸罗孤城数月，蒙恩赏给巴图鲁名号，封一等义勇伯，诸罗因忠义守城改赐名嘉义。然乾隆五十三年，因诸事获咎，与常青一同革职，交福康安严审定拟，终至论罪处死，功名毁于一朝。
  source_urls:
  - https://zh.wikisource.org/wiki/臺案彙錄庚集
