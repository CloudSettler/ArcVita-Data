events:
- id: guji-chai-daji-event-birth
  title_zh: 出生
  date: ''
  year_of: ''
  type: birth
  description: 出生年份不详，清乾隆年间仕至福建陆路提督。
- id: guji-chai-daji-event-fendu
  title_zh: 奉派剿捕，与郝壮猷分路进攻
  date: 1787-02
  year_of: 1787
  type: endeavor
  description: 水师提督黄仕简奏派总兵郝壮猷、柴大纪分路剿捕林爽文贼匪，柴大纪于郡城冲要处堵御擒捕。
- id: guji-chai-daji-event-dulü
  title_zh: 督率官兵堵御府城，迭次打仗杀贼
  date: 1787-01
  year_of: 1787
  type: endeavor
  description: 据台湾镇总兵柴大纪禀报，自十二月初九至三十等日督率官兵堵御，与台湾道永福招募的乡勇义民协同守御，杀死贼匪甚多。
- id: guji-chai-daji-event-shuli
  title_zh: 署理福建陆路提督，总督台湾镇兵马
  date: 1788-04
  year_of: 1788
  type: endeavor
  description: 黄仕简、任承恩革职拿问，上谕福建陆路提督员缺着柴大纪暂行署理；六月兵部题请其军功加一级。
- id: guji-chai-daji-event-batulu
  title_zh: 赏给巴图鲁名号
  date: 1787-09
  year_of: 1787
  type: honor
  description: 上谕赏给台湾总兵柴大纪巴图鲁名号。
- id: guji-chai-daji-event-shoulu
  title_zh: 死守诸罗孤城
  date: 1787-12
  year_of: 1787
  type: endeavor
  description: 诸罗被围孤守，忠义可嘉，上谕着将诸罗县改为嘉义县，以旌其功。
- id: guji-chai-daji-event-fengbo
  title_zh: 封一等义勇伯
  date: 1787-12
  year_of: 1787
  type: honor
  description: 上谕柴大纪着封一等义勇伯。
- id: guji-chai-daji-event-gezhi
  title_zh: 革职交福康安严审
  date: 1788-03
  year_of: 1788
  type: mishap
  description: 上谕柴大纪、常青革职，俱交福康安严审；闽浙总督李侍尧续参各款并交福康安严审定拟；徐嗣曾查奏柴大纪诸劣迹。
- id: guji-chai-daji-event-death
  title_zh: 论罪处死（身故）
  date: 1788
  year_of: 1788
  type: death
  description: 柴大纪被定罪处死（据史载于乾隆五十三年被处斩）。
