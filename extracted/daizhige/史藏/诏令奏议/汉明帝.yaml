events:
- id: guji-刘庄-event-birth
  date: 0028
  year_of: 28
  title_zh: 刘庄生于洛阳
  description: 光武帝第四子，母阴皇后，初名阳。
- id: guji-刘庄-event-accession
  date: '0057'
  year_of: 57
  title_zh: 即皇帝位，改元永平
  description: 中元二年光武帝崩，皇太子刘庄即位，是为显宗孝明皇帝。
- id: guji-刘庄-event-governance
  date: '0060'
  year_of: 60
  title_zh: 严明考课、约束宗室外戚
  description: 明帝御下严切，察举必核其实，馆陶公主求郎不得，赐钱而不予官。
- id: guji-刘庄-event-bianqu
  date: 0069
  year_of: 69
  title_zh: 诏遣王景、王吴治河修汴渠
  description: 永平十二年议修汴渠，发卒数十万，用景流法，河汴分流，功成而无复溃漏之患。
- id: guji-刘庄-event-death
  date: '0075'
  year_of: 75
  title_zh: 崩于洛阳东宫前殿
  description: 永平十八年秋八月，帝崩，年四十八，遗诏起寝庙勿修，葬节夫人以下。
