  era: 东汉
  reign_ref: 永平（公元58年—75年在位）
  archetype: 中兴明君·崇儒重法之主
  dilemmas:
  - 既要尊奉光武旧制又要有所更张
  - 对宗室与外戚的约束和恩养难以两全
  - 兴办太学与严明考课需并重
  lesson: 承业之主当恪守法度、明察吏治，方能延续中兴之业。
  summary_first_person: 朕为光武皇帝第四子刘庄，承继大统，改元永平。朕勤于政务，严驭宗室外戚，兴修汴渠，尊礼三老五更，使天下承平，号称明章之治。
  source_urls:
  - https://zh.wikisource.org/wiki/兩漢詔令
