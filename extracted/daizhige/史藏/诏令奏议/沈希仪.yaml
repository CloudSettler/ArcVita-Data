person:
  qid: guji-沈希仪
  name_zh: 沈希仪
  names:
    zh: 沈希仪
    en: Shen Xiyi
  lifespan:
    birth:
      precision: unknown
      is_circa: false
  era: 明代嘉靖年间
  reign_ref: 嘉靖
  archetype: 边将
  dilemmas:
  - 征讨安南需倾两广之力，兵粮皆有巨额缺口，须在按时进兵与量力周备之间权衡
  - 所获安南伪印谕书真伪难辨，须审慎核验黎氏遗脉存亡，以免误判向导之局
  lesson: 兴师远伐，必先集众思、探虚实、备粮饷，方可计出万全
  summary_first_person: 我是明代右参将沈希仪，嘉靖时分守柳庆等处，奉军门之命整搠汉土官兵听调征讨安南，密派人探查交趾边情，并经手查验归顺州所获安南万胜侯伪印谕书，会同司道诸臣审究黎氏遗裔真伪，为征剿安南筹画兵粮机宜。
