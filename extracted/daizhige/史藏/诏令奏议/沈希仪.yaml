    rationale: 征剿安国家事重大，兵马粮草诸宜预计，须周思预计以备用兵
events:
- id: guji-沈希仪-event-birth
  type: birth
  person_id: guji-沈希仪
  event_name_zh: 沈希仪出生
  description_zh: 生年不详，事迹见于嘉靖年间安南奏议。
- id: guji-沈希仪-event-1
  type: endeavor
  date: 1537
  year_of: 1537
  person_id: guji-沈希仪
  event_name_zh: 奉军门行委整搠所属汉土官兵听调征讨安南
  description_zh: 沈希仪以分守柳庆右参将之职，奉提督两广军门之令，整搠所属汉土官兵，听调征讨安南并料理一应事宜。
- id: guji-沈希仪-event-2
  type: endeavor
  date: 1537
  year_of: 1537
  person_id: guji-沈希仪
  event_name_zh: 密差骆玉探查边境并收验安南万胜侯伪印谕书
  description_zh: 沈希仪密差柳州卫百户骆玉赴右江、镇安、归顺等处体探虚实；归顺州官男岑瓛计取安南伪印谕书，沈希仪责差头目韦柱封送呈验，并口禀其体格失当、迹涉可疑。
- id: guji-沈希仪-event-3
  type: endeavor
  date: 1537-12
  year_of: 1537
  person_id: guji-沈希仪
  event_name_zh: 会同司道诸臣审究黎氏遗脉并议定进兵方略
  description_zh: 嘉靖十六年十二月前后，沈希仪以右参将都指挥同知身份，与陆杰、张经、翁万达等会同，隔别译审郑惟憭等，考辨万胜侯郑惟悛书信真伪及黎宁存亡，并议定三哨陆路进兵、海道舟师及兵粮调度方略。
