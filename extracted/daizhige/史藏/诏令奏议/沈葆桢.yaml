person:
  qid: guji-shenbaozhen
  name_zh: 沈葆桢
  names:
    zh: 沈葆桢
    en: Shen Baozhen
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: ''
    death:
      date: 1879-12-19
      precision: day
      is_circa: false
      raw: 光绪五年十一月初六日
  birth_date: ''
  death_date: 1879-12-19
  era: 清代
  reign_ref: 咸丰、同治、光绪
  archetype: 封疆大吏·船政开创者
  dilemmas:
  - 忠与孝：家有老亲乞终养，而时事方艰、义无返顾
  - 守土与身死：广信孤城被围，誓以一死报国
  - 病躯与职守：受恩深重不敢言退，鞠躬尽瘁而心力已瘁
  lesson: 学问首在不欺，见义即为、无所退避，方能于盘根错节中历练而立。
  summary_first_person: 我由翰林起家，历御史而出守九江，广信解围受先帝知遇；抚赣平乱、总理船政、渡台抚番开山，终总督两江，病殁于任上，遗疏犹惓惓于购铁甲船之事。
endeavors:
- id: guji-shenbaozhen-endeavor-1
  name_zh: 江西守城与巡抚军务
  labels:
    zh:
    - 吏治
    - 军事
  phases:
  - key: brewing
    name_zh: 出守九江署广信
    labels:
      zh:
      - 初任
    start_date: '1855'
    highlight_event_id: guji-shenbaozhen-event-guangxin
  - key: breakthrough
    name_zh: 咸丰六年广信解围
    labels:
      zh:
      - 知遇
    start_date: '1856'
    highlight_event_id: guji-shenbaozhen-event-guangxin
  - key: climax
    name_zh: 巡抚江西堵剿粤逆
    labels:
      zh:
      - 平乱
    start_date: '1862'
    highlight_event_id: guji-shenbaozhen-event-jiangxi-fushui
  - key: closure
    name_zh: 克复金陵叙功
    labels:
      zh:
      - 叙功
    start_date: '1864'
    highlight_event_id: guji-shenbaozhen-event-jinling
  decisions:
  - date: 1856
    title_zh: 坚守广信危城，誓以身殉
    rationale: 城守兵单，闻风先溃，独伸大义于天下。
  - date: 1862-02
    title_zh: 受命巡抚江西，义无返顾
    rationale: 两亲惮于出行，而时事方艰，义无返顾。
- id: guji-shenbaozhen-endeavor-2
  name_zh: 总理船政
  labels:
    zh:
    - 洋务
    - 海防
  phases:
  - key: brewing
    name_zh: 奉旨总理船政
    labels:
      zh:
      - 受命
    start_date: '1867'
    highlight_event_id: guji-shenbaozhen-event-chuanzheng
  - key: climax
    name_zh: 成兵轮船二十余艘
    labels:
      zh:
      - 成船
    start_date: '1868'
    highlight_event_id: guji-shenbaozhen-event-chuanzheng
  decisions:
  - date: 1867
    title_zh: 坚辞不获，毅然接办船政
    rationale: 厂地滨江、土松潮悍，机器殊制，众皆惧之；念船政关系海防，苦心焦思而任之。
- id: guji-shenbaozhen-endeavor-3
  name_zh: 渡台抚番开山
  labels:
    zh:
    - 台湾
    - 海防
  phases:
  - key: brewing
    name_zh: 日本事起奉旨巡台
    labels:
      zh:
      - 受命
    start_date: '1874'
    highlight_event_id: guji-shenbaozhen-event-taiwan
  - key: climax
    name_zh: 南北中三路开山抚番
    labels:
      zh:
      - 抚番开山
    start_date: 1875-02
    highlight_event_id: guji-shenbaozhen-event-shitoushe
  - key: closure
    name_zh: 请移驻巡抚以专责成
    labels:
      zh:
      - 善后经制
    start_date: '1874-12-26'
    highlight_event_id: guji-shenbaozhen-event-yizhu-fuxun
  decisions:
  - date: 1874
    title_zh: 据理责倭，备而不开衅端
    rationale: 不先开衅端，而无一不为可战之计，使倭人遵约撤兵。
  - date: 1874-12-26
    title_zh: 奏请福建巡抚移驻台湾
    rationale: 台地善后势当渐图，番境开荒事关创始；开山抚番相为表里，须专责成以经久远。
  - date: 1875-02
    title_zh: 光绪元年正月再东渡破狮头社
    rationale: 凶番狙杀游击王开俊，非破之则抚番之议不成。
- id: guji-shenbaozhen-endeavor-4
  name_zh: 总督两江
  labels:
    zh:
    - 吏治
    - 海防
    - 洋务
  phases:
  - key: brewing
    name_zh: 在台奉总督两江之命
    labels:
      zh:
      - 受命
    start_date: '1875'
    highlight_event_id: guji-shenbaozhen-event-liangjiang
  - key: climax
    name_zh: 兴利除弊、整顿海防
    labels:
      zh:
      - 施政
    start_date: '1875'
    highlight_event_id: guji-shenbaozhen-event-liangjiang
  - key: closure
    name_zh: 病笃吁开缺，遗疏犹论铁甲船
    labels:
      zh:
      - 尽瘁
    start_date: '1879-11-03'
    highlight_event_id: guji-shenbaozhen-event-death
  decisions:
  - date: 1879-11-03
    title_zh: 病势日棘，沥诚疏吁开缺
    rationale: 本原太亏、精气日耗，自知万难支持，恐稍有蹉跌负疚弥重。
events:
- id: guji-shenbaozhen-event-birth
  type: birth
  title_zh: 沈葆桢出生
  date: ''
  year_of: ''
  place_zh: ''
  participants:
  - guji-shenbaozhen
- id: guji-shenbaozhen-event-guangxin
  type: milestone
  title_zh: 广信解围，受文宗特达之知
  date: 1856
  year_of: 1856
  place_zh: 江西广信
  participants:
  - guji-shenbaozhen
  details: 筹饷河口飞骑驰归，坚守危城誓以身殉；会总兵饶廷选一军至，七战皆捷，围乃得解。曾国藩疏称其独伸大义于天下。
- id: guji-shenbaozhen-event-jiangxi-fushui
  type: milestone
  title_zh: 巡抚江西堵剿粤逆连战皆捷
  date: 1862
  year_of: 1862
  place_zh: 江西
  participants:
  - guji-shenbaozhen
  details: 从容肆应，教民坚壁清野，指挥众将、增募新营，保全安庆，使左宗棠得以一意援浙。
- id: guji-shenbaozhen-event-jinling
  type: milestone
  title_zh: 以克复金陵功赏一等轻车都尉世职
  date: 1864
  year_of: 1864
  place_zh: 江宁
  participants:
  - guji-shenbaozhen
  details: 加头品顶带；推功诸将，沥陈恳辞不受。
- id: guji-shenbaozhen-event-chuanzheng
  type: milestone
  title_zh: 奉旨总理船政，成兵轮二十余艘
  date: 1867
  year_of: 1867
  place_zh: 福建福州马尾
  participants:
  - guji-shenbaozhen
  details: 左宗棠倡议船政，谓非沈葆桢无可属者；丁忧后仍接办，成万年清以下兵轮船二十余艘。
- id: guji-shenbaozhen-event-taiwan
  type: milestone
  title_zh: 日本事起奉旨巡视台湾
  date: 1874
  year_of: 1874
  place_zh: 台湾
  participants:
  - guji-shenbaozhen
  details: 兼办各国通商、军务；据理责倭、宣抚诸社，修城筑垒、练勇备械，倭人遵约撤兵。
- id: guji-shenbaozhen-event-yizhu-fuxun
  type: document
  title_zh: 请移驻巡抚摺
  date: 1874-12-26
  year_of: 1874
  place_zh: 台湾
  participants:
  - guji-shenbaozhen
  details: 奏请福建巡抚移驻台湾，北路增设府县，以专责成、以经久远。
- id: guji-shenbaozhen-event-shitoushe
  type: milestone
  title_zh: 光绪元年东渡破狮头社，抚番之议乃成
  date: 1875-02
  year_of: 1875
  place_zh: 台湾南部
  participants:
  - guji-shenbaozhen
  details: 复于光绪元年正月东渡，破狮头及助恶各社，分南、北、中三路披榛开莽，顽族震慑。
- id: guji-shenbaozhen-event-liangjiang
  type: milestone
  title_zh: 在台奉总督两江之命，兴利除弊
  date: 1875
  year_of: 1875
  place_zh: 两江
  participants:
  - guji-shenbaozhen
  details: 修河堤、行海运、缓开关、筹积榖、整顿盐务、筹画海防，尤重中外交涉。
- id: guji-shenbaozhen-event-death
  type: death
  title_zh: 沈葆桢病殁于两江总督任上
  date: 1879-12-19
  year_of: 1879
  place_zh: 江宁
  participants:
  - guji-shenbaozhen
  details: 光绪五年十一月初六日未刻出缺；殁日布被旧衣、囊无余钱。遗疏犹惓惓于购铁甲船之事。
- id: guji-shenbaozhen-event-shangdian
  type: milestone
  title_zh: 追赠太子太保，予谥入祀贤良祠
  date: 1879-11-30
  year_of: 1879
  place_zh: 北京
  participants:
  - guji-shenbaozhen
  details: 光绪帝谕加恩追赠太子太保衔，入祀贤良祠，照总督例赐恤，政绩宣付史馆立传，江西及立功各省建专祠。
