person:
  qid: guji-yinzhen
  name_zh: 清世宗雍正帝胤禛
  names:
    zh: 胤禛
    en: Yinzhen
  lifespan:
    birth:
      date: 1678-12-13
      precision: day
      is_circa: false
      raw: 康熙十七年
  birth_date: 1678-12-13
  era: 清代康熙至雍正年间
  reign_ref: 雍正（1722–1735 在位，御极十有三年）
  archetype: 励精图治之守成君主
  dilemmas:
  - 效法圣祖而自谦不及，虚文颂祝与务实政治之间的抉择
  - 尊师重道之诚与祥瑞庆贺之虚礼的取舍
  lesson: 崇实黜华，勤政图治，勿以虚文废实政
  summary_first_person: “朕嗣承大统十三年，事事效法皇考，祗敬郊庙，整饬官方，正人心厚风俗。凡庆贺道场、进献玩好等虚文，朕皆屏绝不取，惟以勤俭励有位、利济苍生为本。”
  source_urls:
  - https://www.gugelib.com/世宗宪皇帝圣训
