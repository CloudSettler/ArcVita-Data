events:
- id: guji-yinzhen-event-birth
  event_type: birth
  date: 1678-12-13
  year_of: 1678
  description: 胤禛生于康熙十七年（其生年据实传考订；文本中言其在藩邸四十余年御极前）
  source: 千古文章·世宗宪皇帝圣训序
- id: guji-yinzhen-event-death
  event_type: death
  date: 1735-10-07
  year_of: 1735
  description: 御极十有三年而终，谥宪皇帝
  source: 世宗宪皇帝圣训序
- id: guji-yinzhen-event-ascension
  event_type: endeavor
  date: 1723-07
  year_of: 1723
  endeavor_id: guji-yinzhen-endeavor-1
  description: 雍正元年七月谕诸王大臣内外文武官员，于诞日毋得建立祝寿道场，屏绝虚文。
  source: 世宗宪皇帝圣训卷一·圣德
- id: guji-yinzhen-event-wenmiao
  event_type: endeavor
  date: 1723-11
  year_of: 1723
  endeavor_id: guji-yinzhen-endeavor-2
  description: 谕礼部会同工部详加阅视文庙殿宇廊庑讲堂学舍，务须整理周备。
  source: 世宗宪皇帝圣训卷一·圣德
- id: guji-yinzhen-event-qinyi
  event_type: endeavor
  date: 1726-08
  year_of: 1726
  endeavor_id: guji-yinzhen-endeavor-2
  description: 雍正四年八月丁卯上亲祭先师孔子，谕礼部侍郎三泰等，献帛进酒皆跪，以后照此遵行。
  source: 世宗宪皇帝圣训卷一·圣德
- id: guji-yinzhen-event-kongdian
  event_type: endeavor
  date: 1724-06
  year_of: 1724
  endeavor_id: guji-yinzhen-endeavor-2
  description: 雍正二年六月阙里圣庙灾，素服斋居减膳撤乐遣官告祭，命择日兴修。
  source: 世宗宪皇帝圣训卷一·圣德
- id: guji-yinzhen-event-heqing
  event_type: endeavor
  date: 1727
  year_of: 1727
  endeavor_id: guji-yinzhen-endeavor-1
  description: 雍正五年黄河澄清横亘三千余里绵历三旬，坚拒升殿受贺，御制河清碑文勒石自儆。
  source: 世宗宪皇帝圣训卷一·圣德
- id: guji-yinzhen-event-wanshou
  event_type: endeavor
  date: 1727-10
  year_of: 1727
  endeavor_id: guji-yinzhen-endeavor-1
  description: 万寿圣节止庆贺，事事效法皇考，自陈洞悉下情乃得于藩邸四十余年亲历。
  source: 世宗宪皇帝圣训卷一·圣德
