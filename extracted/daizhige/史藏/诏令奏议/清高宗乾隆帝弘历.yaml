  name_zh: 爱新觉罗弘历（清高宗乾隆帝）
  names:
    zh: 弘历
    en: Aisin Gioro Hongli, Emperor Qianlong
  lifespan:
    birth:
      date: 1711-09-25
      precision: day
      is_circa: false
      raw: 康熙五十年八月十三日
    death:
      date: 1799-02-07
      precision: day
      is_circa: false
      raw: 嘉庆四年正月初三
  birth_date: 1711-09-25
  death_date: 1799-02-07
  era: 清代（乾隆朝，1735—1796 在位）
  reign_ref: 乾隆
  archetype: 守成兼开创之帝王·文献整理主持者
  dilemmas:
  - 于御制序文中如何彰显皇考世宗宪皇帝之德业而不逾臣子之分
  - 纂辑圣训实录之际，于编年系日之中分门备录，斟酌去取以昭法守
  lesson: 述而不作，敬承先训，以简编昭经纶之迹，示后嗣以法守。
  summary_first_person: 我是皇四子弘历，嗣承大统后追慕皇考世宗宪皇帝之德业，御极之初即命大学士详慎纂辑世宗宪皇帝实录一百五十九卷，复于编年系日之中分门备录，恭成圣训三十六卷，三千九百十六则。乾隆五年十二月初七日，朕亲撰序文刊布，欲以皇考之彝训明定保之征，使亿万斯年子孙臣庶咸遵圣训之光昭，率由嗣守丕绪。
  source_urls:
  - https://www.zh.wikisource.org/wiki/世宗宪皇帝圣训
