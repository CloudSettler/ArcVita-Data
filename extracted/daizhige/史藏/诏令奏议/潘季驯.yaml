  decisions:
  - date: '1577'
    title_zh: 上《奉明旨陈愚见议治两河经略疏》，条上六事
    rationale: 塞决以挽正河、筑堤防以杜溃决、复闸坝、建滚水坝、止浚海工程、暂寝老黄河之议，以图永利
  - date: '1577'
    title_zh: 断言海无可浚之理，惟当导河归海
    rationale: 勘得海口面阔七八里至十余里，深三四丈，人力难浚；惟以水治水，固堤塞决即浚海之策
  - date: '1578'
    title_zh: 力主暂寝老黄河开复之议
    rationale: 故道久弃，询之居民俱失其真；大河口窄狭不及桃清三分之一，开复必不能夺流
  - date: '1578'
    title_zh: 创议于磨脐沟、陵城、安娘城筑滚水石坝三座
    rationale: 伏秋水涨，任其宣泄杀势，则两堤可保而正河无淤塞之患，全河不分而堤自固
