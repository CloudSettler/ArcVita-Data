  birth_date: '1521'
  death_date: '1595'
  era: 明代嘉靖至万历年间
  reign_ref: 万历
  archetype: 治水名臣·河工专家
  dilemmas:
  - 分流杀势与束水攻沙之争：众议多主分流减水，季驯力主合流专一，以堤束水、以水刷沙
  - 浚海与治河之争：世人归咎海口壅塞，主浚海；季驯断言“海无可浚之理，惟当导河归海”
  - 复老黄河故道与固守现道之权衡：勘得故道久失其真，力请暂寝其议以免糜费
  lesson: 治水如治政，顺水性而缮堤防，专其力则沙随水去；师古而不凿，乃为大智。
  summary_first_person: 我潘季驯，四任总理河道，先后总河务二十七年。当万历之初，河决高家堰，淮扬皆为巨浸，我遍历徐沛淮扬，亲勘两河，力排浚海分流之议，倡“筑堤束水，以水攻沙”之法：塞决口、复故道、筑遥堤、建滚水坝，使黄淮合流，涓滴悉趋于海，卒以此奏功。晚年辑《河防一览》，又撰《两河经略》，皆为有裨实用之言。
  source_urls:
  - https://zh.wikisource.org/wiki/兩河經略
