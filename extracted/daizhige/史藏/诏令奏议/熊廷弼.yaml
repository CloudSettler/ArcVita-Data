    death:
      date: '1625'
      precision: year
      is_circa: false
      raw: 天启五年（据通行传记补，原文未载）
  birth_date: '1569'
  death_date: '1625'
  era: 明代晚期（神宗至熹宗年间）
  reign_ref: 明神宗、明熹宗
  archetype: 边疆统帅·抗疏直言名臣
  dilemmas:
  - 主闇政昏、阉人窃柄，忠言难被采纳
  - 辽沈用兵、兵溃饷絶之际独任危局
  lesson: 危言谠论、刚正敢言者虽不获于时君，其忠君爱国之忱后世不可废言，足为炯戒殷鉴。
  summary_first_person: 我熊廷弼在明末辽东危局之中慷慨建言、剀切敷陈，折冲疆场以图挽救败亡，然当朝主闇政昏、赏罚不明，终不为所用；乾隆年间编纂《御选明臣奏议》，我与杨涟、左光斗等同被推为荩臣杰士，谓明君若采吾言或不致亡国，遗疏具存，足为后人之鉴。
  source_urls:
  - https://zh.wikisource.org/wiki/御選明臣奏議
