events:
- id: guji-王夫之-event-birth
  date: ~1619
  year_of: 1619
  kind: birth
  title_zh: 王夫之生
  summary_zh: 生于湖广衡州府衡阳县，生年据壬午（1642）举于乡上推约取。
- id: guji-王夫之-event-death
  date: ~1692
  year_of: 1692
  kind: death
  title_zh: 王夫之卒
  summary_zh: 卒年据通行记载约推。
- id: guji-王夫之-event-1
  date: 1642
  year_of: 1642
  kind: achievement
  title_zh: 壬午举于乡
  summary_zh: 中湖广乡试举人，方上计偕至南昌而局势大乱。
- id: guji-王夫之-event-2
  date: 1643-09
  year_of: 1643
  kind: conflict
  title_zh: 张献忠陷衡州，刺腕救父
  summary_zh: 献忠购索士绅，父为伪吏所执欲自裁，夫之刺腕傅毒出，与奚鼎铉谋脱父于难，与伯兄先走南岳双髻峰。
- id: guji-王夫之-event-3
  date: 1647
  year_of: 1647
  kind: participation
  title_zh: 衡山起义兵败
  summary_zh: 奉父遗命与管嗣裘起义衡山，力弱事败，逃死行阙，避虏萍寄昭江。
- id: guji-王夫之-event-4
  date: 1647-11-18
  year_of: 1647
  kind: family
  title_zh: 父王朝聘忧愤而终
  summary_zh: 永历元年十一月十八日，因衡州被陷、伪官勾索令下，父朝聘忧愤成疾而终。
- id: guji-王夫之-event-5
  date: 1649
  year_of: 1649
  kind: petition
  title_zh: 上《请终丧免阁试疏》
  summary_zh: 以丁忧之身恳乞敕免阁试，获旨“著俟服阕另与议考”。
- id: guji-王夫之-event-6
  date: 1649
  year_of: 1649
  kind: petition
  title_zh: 任行人司行人并上《陈言疏》
  summary_zh: 疏论雷德复参辅臣严起恒之事，请允辅臣乞休以定国是，遭旨谓“似讦似嘲，奉内事姑不深究”。
- id: guji-王夫之-event-7
  date: 1649
  year_of: 1649
  kind: award
  title_zh: 永历二年明旨奖励
  summary_zh: 永历二年明旨下奖云“骨性松坚”，高汇旃评为“忠肝义胆，情见乎词”。
