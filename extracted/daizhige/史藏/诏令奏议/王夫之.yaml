      date: ~1619
      precision: year
      is_circa: true
      raw: 壬午举于乡（1642年前推，生年约1619）
  birth_date: ~1619
  era: 明末清初
  reign_ref: 永历
  archetype: 遗民学者
  dilemmas:
  - 守丧尽孝与新朝征召之间的冲突，宁可抗命乞免阁试
  - 逃亡抗清与出仕永历朝廷之间的取舍
  lesson: 忠孝之际，宁守节而不苟进
  summary_first_person: 我王夫之，衡阳举人。父朝聘因衡州陷落忧愤而终，我服丧之际，辅臣误以庶常荐我，我上疏恳乞终丧免阁试。后任行在行人司行人，又上陈言疏论辅臣进退之机，虽遭驳斥，然肝胆尽见乎词。
  source_urls:
  - https://example.org/longyuan-yehua
