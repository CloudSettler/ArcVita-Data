events:
- id: guji-王恕-event-birth
  date: '-1416'
  year_of: -1416
  event_type: birth
  title_zh: 王恕生
  description: 王恕生年史载不详，据其成化、弘治之际任兵部尚书推约生于15世纪前期。
- id: guji-王恕-event-effort-1
  date: '1487'
  year_of: 1487
  event_type: endeavor
  endeavor_id: guji-王恕-endeavor-1
  title_zh: 成化二十三年邹智上疏举王恕为元勋硕德
  description: 邹智陈时事疏中称'兵部尚书王恕，元勋硕德，顾削其爵'，荐其宜分居要地。
- id: guji-王恕-event-effort-2
  date: '1487'
  year_of: 1487
  event_type: endeavor
  endeavor_id: guji-王恕-endeavor-1
  title_zh: 遭削爵
  description: 因所言所行利于公室而不利于私家，为小人谗间，兵部尚书之爵被削。
- id: guji-王恕-event-effort-3
  date: '1488'
  year_of: 1488
  event_type: endeavor
  endeavor_id: guji-王恕-endeavor-2
  title_zh: 孝宗即位，锐意革弊
  description: 孝宗登宝位后革罢传奉冗员、追回滥赏，天下称颂，为王恕上奏之背景。
- id: guji-王恕-event-effort-4
  date: '1488'
  year_of: 1488
  event_type: endeavor
  endeavor_id: guji-王恕-endeavor-2
  title_zh: 上《论滥升内官奏》
  description: 弘治元年，王恕奏滥升内官事，谏孝宗守祖宗之法，勿蹈前弊；诏答以内官随侍春宫年久量陞一级了罢。
- id: guji-王恕-event-death
  date: '1508'
  year_of: 1508
  event_type: death
  title_zh: 王恕卒
  description: 卒年史载不详，约在弘治末、正德初。
