  reign_ref: 明宪宗成化、明孝宗弘治
  archetype: 直臣 / 政论家
  dilemmas:
  - 刚直敢言而遭权贵忌恨、削夺爵位
  - 既蒙孝宗重用，仍需直谏抑制内官滥升之弊
  lesson: 居高位而不忘直言正谏，以祖宗旧制矫正时弊。
  summary_first_person: 我在成化朝以元勋硕德之望为兵部尚书，因直言正人君子之论而遭削爵；弘治初年，我又上疏痛陈滥升内官之弊，提醒皇上守祖宗之法，勿为巧言所惑，以保天命人心。
  source_urls:
  - https://www.kanripo.org/KR3/0008/006
