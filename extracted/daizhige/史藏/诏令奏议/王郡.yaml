  archetype: 海疆武职重臣
  dilemmas:
  - 台湾戍员俸满候升迁延，需在恪守定制与体恤边劳之间奏请变通
  - 水师人才壅滞，须在各省补用惯例与因地制宜破格之间权衡
  lesson: 针对海疆戍防积弊，任事之臣敢据实陈奏、推动制度变通，方能激励远戍劳臣、巩固边防。
  summary_first_person: 我王郡历任福建台湾总兵、水师提督等职，雍正八年上折奏请台湾参、游、守备改为二年俸满升用，以纾弁员候缺迁延之困；后任水师提督时，又奏请台湾水师俸满员弁分推沿海各省水师营补用，以疏通壅滞、奖励远戍。
  source_urls:
  - https://gu receipts.台案汇录乙集
