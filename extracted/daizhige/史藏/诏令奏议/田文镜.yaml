  archetype: 署理封疆的武职总督
  dilemmas:
  - 署理两江重任而自认吏治非其所长，武职出身临民情不谙
  - 盘查藩库发现欵归补银两限期归补与奏销期限冲突
  - 预拟有秋遽尔入奏却逢秋成阴雨，遭皇帝斥责训诫
  lesson: 以安静详审为务，一事毕复办一事，慎字最要，迟速有时
  summary_first_person: 我本是武职出身，蒙皇上特恩署理江南江西总督印务。到任之初细访前任操守、盘查两江藩库，据实奏闻淮关监督庆元与勒追亏空之潘尚智私相授银一案，屡蒙朱批砥砺，教我以诚格天、安静详审经理地方。
