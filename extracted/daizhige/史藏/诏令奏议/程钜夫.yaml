  name_zh: 程钜夫
  names:
    zh: 程钜夫
    en: Cheng Jufu
  lifespan:
    birth:
      date: '1249'
      precision: year
      is_circa: true
      raw: 南宋淳祐年间（约1249年）
    death:
      date: '1318'
      precision: year
      is_circa: true
  birth_date: '1249'
  death_date: '1318'
  era: 元代（由宋入元）
  reign_ref: 元世祖至元—元成宗大德—元仁宗延祐
  archetype: 直言敢谏的治世名臣与江南贤士的举荐者
  dilemmas:
  - 南人初附，仕途受抑，是明哲保身还是为江南士人力争入仕之阶
  - 官吏贪残、俸薄无法自赡，是迁就成法还是直陈吏治五事触怒权贵
  - 奉诏求贤江南，荐举旧国遗才可能被视为怀恋故宋
  lesson: 居庙堂之高而不忘民间利病，以公选、学校、通南北之选为长治久安之本。
  summary_first_person: 我本建昌书生，由宋入元，蒙世祖擢用。我不肯做缄默之臣，连上《吏治五事》《民间利病》，为江南百姓请宽赋、均工役、给俸钱、惩贪墨；又力主通南北之选、好人公选，荐拔江南贤士入朝。晚年掌翰林文字，进《三朝实录表》，以笔墨存一代之典章。
  source_urls:
  - https://zh.wikisource.org/wiki/元代奏议集录
