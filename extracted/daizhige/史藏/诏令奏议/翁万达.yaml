  dilemmas:
  - 安南莫登庸僭逆，朝廷议征，然兵粮两缺，竭两广之力犹欠兵十七万、米百余万石，进退两难
  - 黎宁存殁难辨，向导未集，天兵若直入恐老师匮饷，招抚与征剿须相机酌处
  lesson: 兴师远伐必先审势量力，兵粮筹划务集众思、计出万全
  summary_first_person: 我翁万达在嘉靖间以副使参与两广征剿安南莫登庸的会议筹划，与三司诸臣核算兵马粮饷、审验安南文书、访探虚实，力主出奇审势、万全而后动。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=安南奏议
