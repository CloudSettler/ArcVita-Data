person:
  qid: guji-胡世宁
  name_zh: 胡世宁
  names:
    zh: 胡世宁
    en: Hu Shining
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: unknown
      raw: 卒年不详，官至兵部尚书
  era: 明代
  reign_ref: 弘治、正德、嘉靖
  archetype: 直言敢谏之能臣
  dilemmas:
  - 弹劾宁王朱宸濠遭构陷，几不免于危祸
  - 议大礼与张璁、桂萼偶同，而他事屡与之忤，孤立危疑
  - 屡上辞职乞罢之疏，欲退而不能以退鸣高
  lesson: 风节震一世，虽孤立危疑仍直言极论时政阙失
  summary_first_person: 我胡世宁，字永清，仁和人。弘治癸丑进士，为推官时屡折岐藩之势，为主事时上书极论时政阙失，与李承勋、魏校、余祐并称南都四君子。任江西副使时疏劾宁王宸濠，遭构陷几陷危祸。宸濠败后复起，屡纠中官，官至兵部尚书。
  source_urls:
  - 钦定四库全书·胡端敏奏议
