  - 在耿精忠已怀异志的福建，总督如何既竭力经营地方防务又忠于朝廷
  - 乱起后被囚，面临威逼利诱与殉节之间的生死抉择
  lesson: 身处危疆，谋国之忠至死不渝；事不可为则舍生取义。
  summary_first_person: 我范承谟，汉军旗人范文程之子，官至福建总督。康熙十三年耿精忠叛乱前夕，我上《条陈闽省利害疏》以备边患；乱起被执，羁囚三载，骂贼不屈，终以身殉。
  source_urls:
  - 《清奏疏选汇》条陈闽省利害疏（康熙十三年）
