  lesson: 择主而事、以文略佐开国之业，见机审势方能久居枢要。
  summary_first_person: 我范文程以明生员之身归附清廷，历事太祖、太宗，参与帷幄机务；入关后佐世祖定鼎燕京，顺治年间位居内院大学士，为清初制度章程的开创者之一，晚年功成身退，获谥文肃。
