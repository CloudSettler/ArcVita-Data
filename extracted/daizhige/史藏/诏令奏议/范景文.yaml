  summary_first_person: 我在天启五年任吏部文选司郎中，见仕路溷浊、奔竞成风，遂上疏自陈，与同僚相约不行请托、不受嘱托，愿以身始澄清选法；后仕至大学士，甲申国变时殉节而死。
