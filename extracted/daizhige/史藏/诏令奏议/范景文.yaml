  summary_zh: 天启五年二月壬寅，吏部文选司郎中范景文疏言仕路溷浊，自陈岁格、绩望、资劳三者之外不徇私径，并与诸臣相约绝去嘱托，帝命以后升除推用一循资望，有故违请托者指名参奏。
