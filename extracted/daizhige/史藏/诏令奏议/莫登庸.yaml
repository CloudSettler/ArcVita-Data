events:
- id: guji-mo-deng-yong-event-usurp
  date: ''
  year_of: 1516
  title_zh: 作乱窃据安南国城
  description: 黎宁奏称国王黎晭故绝，被贼臣莫登庸作乱，窃据国城，阻绝道路，因而久废职贡，经明朝差官查勘是实。
- id: guji-mo-deng-yong-event-forgery
  date: ''
  year_of: 1536
  title_zh: 擅作大诰，僭拟名号
  description: 莫登庸既篡逆本国，又擅作大诰，僭拟名号，伪置官属，又捕获其伪造书印，明廷谕斥其背叛朝廷，罪在不赦。
- id: guji-mo-deng-yong-event-spy
  date: ''
  year_of: 1537
  title_zh: 所遣奸细被云南官军捉获
  description: 云南镇巡等官捉获莫登庸奸细阮璟等及伪造书印；其后莫登庸所遣奸细杜文庄报称癸巳年莫登庸曾差阮文都将光绍赶出顺化城，杜文庄亦被译审。
- id: guji-mo-deng-yong-event-framing
  date: ''
  year_of: 1532
  title_zh: 驱逐光绍出顺化城
  description: 据被获奸细杜文庄供称，癸巳年莫登庸差阮文都将光绍赶出顺化城，黎氏势力被迫退往清华、乂安一带。
- id: guji-mo-deng-yong-event-persecution
  date: ''
  year_of: ''
  title_zh: 监改郑氏姓名，监控旧黎头目
  description: 郑惟憭原名郑嵎，其弟郑峣原改名郑惟俊，皆被莫登庸监改为今名，惟莫登庸犹私下呼其旧名，显示其对黎氏旧臣的防范与控制。
