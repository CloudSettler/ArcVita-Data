  archetype: 篡逆权臣
  dilemmas:
  - HeySGPT
  - 篡夺黎氏王位后，既组建政权官属，又面临明朝兴师问罪、两广三十万大军压境的存亡压力
  lesson: 权臣篡国可逞一时，然叛弃朝贡、僭拟名号，终致天讨临头、骑虎难下
  summary_first_person: 我莫登庸本是安南黎氏之臣，趁国王黎晭故绝之际作乱，窃据国城，阻绝道路，致使安南久废职贡。我伪造书印，僭拟名号，伪置官属，自以为可久据其国。不料黎宁赴明奏我篡逆，明朝震怒，嘉靖十六年敕命云南、两广镇巡调集兵粮，分道进兵，水陆约三十万众征剿于我。我遣奸细杜文庄等刺探虚实，反被官军捉获，罪在不赦，处境危殆。
  source_urls:
  - 安南奏议（明）不着撰人
