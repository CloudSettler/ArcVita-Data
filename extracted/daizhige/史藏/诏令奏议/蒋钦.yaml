  dilemmas:
  - 明知上疏弹劾权阉刘瑾必遭下狱杖责除名，仍冒险直言
  - 身为言官，面对阉党专权蔽日，在沉默保身与死谏尽忠之间抉择
  lesson: 忠臣进谏不避斧钺
  summary_first_person: 我蒋钦在正德年间任河南道御史，目睹太监刘瑾等专权擅政、蠹国殃民，愤而上疏弹劾。虽因此下诏狱、受杖责并被除名，我亦不悔，谨守言官之职。
