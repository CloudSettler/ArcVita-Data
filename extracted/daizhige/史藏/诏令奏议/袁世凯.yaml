  dilemmas:
  - 义和团时期剿办拳匪与保护教民之间的危局权衡
  - 议结教案时抚恤教民、严惩拳党与抑制奸棍借端勒诈的两难
  lesson: 抚绥地方须先事防范、随事严办，方能消患于无形而保全大局
  summary_first_person: 我在山东巡抚任上严惩拳党、议结教案、创办学堂，整顿吏治保卫教民洋商，时称项城宫保，各方禀陈教案拳祸诸事多蒙我批复允准，一时莠民奸棍借拳祸吓诈、借学堂渔利者皆被我严令禁革。
