  summary_zh: 光绪庚子四月，莱阳知县庄纶裔禀报邮政局司事赵实丰纵局差捉赌讹财，我批饬函嘱英人卜尼司限半月另换妥人接管，并将司帐提案质讯按律拟办。
  role_zh: 山东巡抚（抚宪袁）
  source_refs:
  - guji-袁世凯-endeavor-1
- id: guji-袁世凯-event-2
  type: career
  date: '1900-06-15'
  year_of: 1900
  summary_zh: 庚子六月，我以六百里排单两次函谕所属州县遵旨剿办土匪乱民、保护洋商教士，勿稍游移，并嘱劝禁民人习拳。
  role_zh: 山东巡抚（抚宪袁）
  source_refs:
  - guji-袁世凯-endeavor-1
- id: guji-袁世凯-event-3
  type: career
  date: '1901-03-15'
  year_of: 1901
  summary_zh: 辛丑春夏东省教案议结之际，平度教民冷受谦越境敛钱讹诈莱民，我主张惩办借拳祸吓诈奸棍，地方官禀明情形颇蒙我激赏，地方因以平靖。
  role_zh: 项城宫保、山东巡抚
  source_refs:
  - guji-袁世凯-endeavor-1
- id: guji-袁世凯-event-4
  type: career
  date: '1901-05-01'
  year_of: 1901
  summary_zh: 我任东抚期间抚恤教民、严惩拳党不遗余力，并创办学堂、提倡振兴新学，不容地方官稍有遏抑莠民奸棍借学堂渔利之行。
  role_zh: 山东巡抚（项城宫保）
