  decisions:
  - date: '1900-04-01'
    title_zh: 批饬查办邮政局司事借端讹索案
    rationale: 司帐只管收发信件，何得屡次藉端滋事讹索陋规，限半月内另换妥人，逾限即拿解省讯惩，免滋巨祸而安民心
  - date: '1900-06-15'
    title_zh: 六百里排单函谕剿办土匪保护洋商教士
    rationale: 防患未萌、保全大局，勿稍涉游移致滋贻误
  - date: '1901-05-01'
    title_zh: 议结教案严惩拳党并创办学堂
    rationale: 抚恤教民、严惩拳党不遗余力，振兴学堂不容地方官稍有遏折，以支持危局而安地方
