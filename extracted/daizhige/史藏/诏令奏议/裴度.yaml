  title_zh: 力主讨伐淮西吴元济
  type: endeavor
  endeavor_id: guji-裴度-endeavor-1
  summary_zh: 淮西叛乱，朝议多主赦宥，裴度坚请以兵，遂启元和讨蔡之役。
- id: guji-裴度-event-2
  date: 0816
  date_precision: year
  year_of: 0816
  title_zh: 拜门下侍郎、彰义军节度使、宣慰等使
  type: endeavor
  endeavor_id: guji-裴度-endeavor-1
  summary_zh: 宪宗命裴度督师宣慰淮西。《唐大诏令集》载其制词本令狐楚所草，制出后度奏请改「剪其类」为「革其志」、「更张琴瑟」为「近辍枢衡」、「烦我台席」为「授以成算」，宪宗从之，令狐楚因此罢内职。
