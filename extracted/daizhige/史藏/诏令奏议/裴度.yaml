- id: guji-裴度-event-5
  date: '0826-12-12'
  date_precision: day
  year_of: 0826
  title_zh: 以司空平章事奉册文宗即皇帝位
  type: endeavor
  endeavor_id: guji-裴度-endeavor-2
  summary_zh: 宝历二年十二月乙巳，太皇太后命司空平章事裴度奉册江王昂即皇帝位，是为文宗。
- id: guji-裴度-event-death
  date: 0839
