person:
  qid: guji-裴度
  name_zh: 裴度
  names:
    zh: 裴度
    en: Pei Du
  lifespan:
    birth:
      date: '0765'
      precision: year
      is_circa: true
      raw: 生年史无明文
    death:
      date: 0839
      precision: year
      is_circa: true
      raw: 卒年据两《唐书》本传
  birth_date: '0765'
  death_date: 0839
  era: 唐（中晚期：宪宗、穆宗、敬宗、文宗朝）
  reign_ref: 宪宗元和、穆宗长庆、敬宗宝历、文宗大和
  archetype: 中兴元老 / 平叛主战宰相
  dilemmas:
  - 讨伐淮西吴元济，朝中主抚与主战之争，裴度力主以兵且自请督师
  - 宰相制词由令狐楚所草，裴度上奏改制文句，宪宗从之，令狐楚因此罢内职
  - 宝历间敬宗欲颁册尊号赦，李逢吉等抑李绅量移，翰林学士论列，帝命追改赦书
  lesson: 一代元老所以安社稷者，非徒谋略，亦在危疑之际据理力争、改制正名。
  summary_first_person: 我裴度历仕宪穆敬文四朝，宪宗元和中以门下侍郎领彰义军节度使宣慰等使，督师平定淮西；官至司空平章事，宝历二年奉册文宗即皇帝位。我以力主讨叛、坚持正道著称，虽遭权幸排抑，终为唐室中兴之柱石。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=642006
