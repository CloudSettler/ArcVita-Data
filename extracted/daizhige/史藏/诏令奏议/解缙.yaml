person:
  qid: guji-xiejin
  name_zh: 解缙
  names:
    zh: 解缙
    en: Xie Jin
  lifespan:
    birth:
      date: '1369'
      precision: year
      is_circa: true
      raw: 洪武二年（约）
    death:
