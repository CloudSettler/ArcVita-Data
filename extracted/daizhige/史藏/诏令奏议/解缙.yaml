    title_zh: 重士奇及胡广而轻黄淮
    rationale: 以部属亲疏衡文学高下，致淮有憾，为日后是非之端
events:
- id: guji-xiejin-event-birth
  date: '1369'
  year_of: 1369
  type: birth
  name_zh: 解缙生
  description_zh: 解缙约生于洪武二年（1369年）。
- id: guji-xiejin-event-1
  date: 1404-06
  year_of: 1404
  type: endeavor
  name_zh: 对朱季友献书之评
  description_zh: 永乐二年六月，饶州士人朱季友献书专斥濂洛关闽之说，上以其书示侍臣，解缙对曰「惑世诬民莫甚于此」，遂有毁书示罚之命。
- id: guji-xiejin-event-2
  date: 1404-07
  year_of: 1404
  type: endeavor
  name_zh: 内阁分阅讲义，专任阅书
  description_zh: 永乐二年七月，翰林春坊诸臣分撰诸经讲义，内阁之臣阅过，解缙专阅书经部分，后又与胡广等四人相与辨析疑义，录为巨册。
- id: guji-xiejin-event-3
  date: '1405'
  year_of: 1405
  type: endeavor
  name_zh: 与黄淮生隙
  description_zh: 因解缙重杨士奇及胡广而轻黄淮，致黄淮有憾，同僚之间由是不睦。
- id: guji-xiejin-event-death
  date: '1415'
  year_of: 1415
  type: death
  name_zh: 解缙卒
  description_zh: 解缙于永乐十三年（1415年）下狱后遇害，年约四十七。
