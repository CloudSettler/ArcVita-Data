  era: 明
  reign_ref: 洪武至永乐
  archetype: 直言敢谏的翰林学士与内阁重臣
  dilemmas:
  - 才高位重而性情直率，轻慢同僚致黄淮有憾，埋下人际隐患
  - 立朝敢言、裁断是非，身处永乐党争倾轧之中
  lesson: 才学足以经世，而持身不谨、遇事直言无隐者，虽遇明主亦难全终
  summary_first_person: 我解缙以翰林学士侍永乐之朝，斥朱季友惑世诬民之书为儒之贼，又在内阁专阅诸经讲义中之书经部分，与胡广、杨士奇等辨析疑义；然我重士奇、广而轻黄淮，遂生嫌隙。
  source_urls:
  - 三朝圣谕录（明·杨士奇撰）
