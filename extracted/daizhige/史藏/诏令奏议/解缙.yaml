    rationale: 捍卫濂洛关闽正学，斥谤先贤毁正道之罪，取直道立朝之意
  - date: '1404'
    title_zh: 内阁分阅诸经讲义，专任阅书
    rationale: 以经学所长分任校阅，与胡广阅诗、金幼孜阅春秋、杨士奇阅易相配
