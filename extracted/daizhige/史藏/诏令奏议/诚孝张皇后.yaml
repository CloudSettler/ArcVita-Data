- id: guji-诚孝张皇后-event-1
  title_zh: 册立仁宗张皇后
  date: '1424-11-13'
  year_of: 1424
  kind: status
  description: 洪熙元年仁宗即位，张氏册立为皇后。
- id: guji-诚孝张皇后-event-2
  title_zh: 尊为皇太后
  date: '1425-06-12'
  year_of: 1425
  kind: status
  description: 洪熙元年六月仁宗崩，宣宗即位，尊张氏为皇太后。
- id: guji-诚孝张皇后-event-3
  title_zh: 宣宗奉皇太后谒二陵
  date: '1430-04-12'
  year_of: 1430
  kind: endeavor
  description: 宣德五年三月，太后命择日，帝躬櫜鞬骑导太后辇渡清河桥，畿甸之民夹道迎拜；驻沙河时太后望天寿山感怆，号为其诚孝所感。
- id: guji-诚孝张皇后-event-4
  title_zh: 万寿山奉觞上寿，训谕保安百姓
  date: '1428-02-27'
  year_of: 1428
  kind: endeavor
  description: 宣德三年二月，帝奉太后游西苑，亲掖太后舆登万寿山，奉觞上寿、献诗颂圣德；太后酌酒赐帝，谕以保安百姓、毋使饥寒之训。
- id: guji-诚孝张皇后-event-death
  title_zh: 诚孝张皇后崩
  date: '1442-11-20'
  year_of: 1442
  kind: death
  description: 正统七年十月崩，谥诚孝恭肃明德弘仁顺天启圣昭皇后，附葬献陵。
