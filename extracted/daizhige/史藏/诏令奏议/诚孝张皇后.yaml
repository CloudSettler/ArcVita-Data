  birth_date: '1379'
  death_date: '1442-11-20'
  era: 明初（永乐、洪熙、宣德、正统四朝）
  reign_ref: 明仁宗张皇后，宣宗朝皇太后，英宗朝太皇太后
  archetype: 贤后慈母型
  dilemmas:
  - 母仪天下与干预朝政之间的分寸把握
  - 丧礼从俭遗诏与孝子厚葬之情的取舍（辅佐其子遵从薄葬）
  lesson: 以慈孝辅政而不专权，以俭德垂范而固国本
  summary_first_person: 我是仁宗张皇后，历永乐、洪熙、宣德、正统四朝。我天性至孝，笃念祖宗。儿子宣宗事我极孝，每日朝谒请安，军国大政必禀命而行；每逢清明，必奉我谒长陵、献陵，登万寿山为我上寿献诗。我尝训谕他：天下百姓皆天与祖宗之赤子，为人君但要保安百姓，使之不至饥寒，则母子之乐可永远。海内粗安，我常自觉皆上天祖宗垂祐，非人主之德所致，以此告诫儿孙群臣毋生骄怠。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=641006
