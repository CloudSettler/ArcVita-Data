    title_zh: 受帝奉侍游西苑，谕以保安百姓之教
    rationale: 天下无事，母子同乐，皆是天与祖宗之赐；当使百姓不至饥寒，安乐可永远。
  - date: 1430-04
    title_zh: 允奉谒长陵献陵
    rationale: 圣心笃念祖宗，愿亲往拜谒，以彰圣孝、上慰慈心。
- id: guji-诚孝张皇后-endeavor-2
