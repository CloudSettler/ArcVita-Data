  archetype: 军事统帅与兵部重臣
  dilemmas:
  - 地方失事奏报不实与法纪严明之间的权衡
  - 边患方殷而援饷不足时的战守抉择
  lesson: 治军弭盗须责成有实、申报有实，姑息欺瞒终酿大患。
  summary_first_person: 我谭纶出身进士，历官台州、福建等地，转战东南抗倭，后总制蓟辽练兵备边，官至兵部尚书。任内我严究盗案、申饬隐匿，与吏部尚书张瀚合勘守臣失职之罪，力求法纪振饬、海内安靖。
  source_urls:
  - https://zh.wikisource.org/wiki/明神宗顯皇帝實錄
