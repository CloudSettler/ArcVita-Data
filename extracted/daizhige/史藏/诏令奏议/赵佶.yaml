  archetype: 艺术家型皇帝
  dilemmas:
  - 治国与个人艺术志趣之间的失衡
  - 承继神宗哲宗变法遗业与朝政用人之争
  lesson: 艺术天赋并不能替代勤勉治国，奢靡与用人失察终致社稷倾覆。
  summary_first_person: 我是宋徽宗赵佶，元符三年继兄长哲宗之位即皇帝位，颁赦天下，率循元丰、绍圣之谋；然我以书画自娱，委任非人，终在宣和末年内禅逊位，社稷倾覆，客死五国城。
  source_urls:
  - 《宋大诏令集》卷第一帝统一
  - 《宋大诏令集》卷第二帝统二
