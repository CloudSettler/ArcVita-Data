  era: 北宋
  reign_ref: 治平四年至元丰八年在位，年号熙宁、元丰
  archetype: 锐意变法的君主
  dilemmas:
  - 欲革祖宗旧法以图富强，又须面对朝臣以‘谨守奉行、不敢失坠’为训的守成压力
  - 新政需揽贤才，而尊号、诞节等典礼频繁，民政与礼仪资源难以两全
  lesson: 遵先训而不泥旧章，方能在承祧之初开改革之局
  summary_first_person: 我以神宗之位承先帝遗训，改元熙宁、元丰，锐意更张法度，虽忧勤积劳，终致弥留之患，然大宋图治之业自此一新。
  source_urls:
  - https://zh.wikisource.org/wiki/宋大诏令集/卷1
