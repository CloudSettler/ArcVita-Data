  archetype: 老成持重之辅政重臣
  dilemmas:
  - 亲征大军兼行涉险与兵贵神速之间的进谏权衡
  - 山陵营建厚葬与遵先帝俭约遗诏之间的礼制抉择
  lesson: 事君以诚，进言有度，功成不居
  summary_first_person: 我蹇义历事数朝，官至少师，每于祭祀、山陵、巡边诸大典，与夏原吉、杨士奇、杨荣等同心辅弼，进言必以慎重爱民为本，蒙皇上信任赐宴赐诗，荣宠备至。
  source_urls:
  - 大明宣宗章皇帝宝训
