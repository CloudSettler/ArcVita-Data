events:
- id: guji-蹇义-event-birth
  type: birth
  place: ''
  summary: 生卒年文献未详（史料记载蹇义约1363年生，1435年卒，本篇未载）
- id: guji-蹇义-event-death
  type: death
  place: ''
  summary: 本篇未载其卒年
- id: guji-蹇义-event-sacrifice
  type: endeavor
  date: '1431'
  year_of: 1431
  place: 武英殿
  summary: 宣德元年正月甲辰，皇上致斋武英殿，谕尚书蹇义、夏原吉、杨士奇、杨荣等：祀天地为苍生祈福不敢不敬，卿等宜秉诚相朕；义等叩首而退
- id: guji-蹇义-event-tomb
  type: endeavor
  date: '1428'
  year_of: 1428
  place: 天寿山
  summary: 洪熙元年九月，皇上召尚书蹇义、夏原吉等议营献陵，示以务从俭约遗诏，义等对曰圣见高远、发于孝诚、万世之利
- id: guji-蹇义-event-campaign
  type: endeavor
  date: '1426'
  year_of: 1426
  place: 盐山
  summary: 宣德元年八月亲征汉王高煦，车驾至盐山，蹇义与夏原吉、杨士奇、杨荣进言'军临敌境尤宜慎重'，请少驻兵广哨望而后进
- id: guji-蹇义-event-tomu-visit
  type: endeavor
  date: '1435'
  year_of: 1435
  place: 天寿山
  summary: 宣德五年二月，皇上召少师蹇义、杨士奇、杨荣议奉皇太后谒长陵献陵，义等对曰天理人心之正；随侍道中闻圣谕，对答'陛下圣孝久而不忘，祖宗在天之灵应当永佑'
- id: guji-蹇义-event-poem
  type: endeavor
  date: 1431-02
  year_of: 1431
  place: 文华后殿
  summary: 宣德六年二月乙巳，皇上召少师蹇义、杨士奇、杨荣、胡濙至文华后殿，念国事赖卿等同心协虑，出御制诗赐义等并赐特宴
