person:
  qid: guji-逯中立
  name_zh: 逯中立
  names:
    zh: 逯中立
    en: Lu Zhongli
  archetype: 直言敢谏的言官
  dilemmas:
  - 直言进谏 versus 触怒皇帝与辅臣、自毁前程
  - 恪尽封驳谏职 versus 事不施行、孤掌难鸣
  lesson: 以谏职为己任，虽屡遭忤旨贬斥，犹守正不阿，力救人才与国体。
  summary_first_person: 我是明代给事中逯中立，历官吏、兵二科，故称“两垣”。我上六疏论公用舍、请罢太和山织造、论东倭封贡之误、论修史用人、请拔淹滞停云南例金、论会推阁臣，三疏见acht于史册，一忤旨停俸，一见忌辅臣，一被贬外授，然矫矫不阿，无愧封驳之职。
  reign_ref: 万历
  era: 明万历年间
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=4730
endeavors:
- id: guji-逯中立-endeavor-1
  name_zh: 任给事中上《两垣奏议》六疏
  phases:
  - key: brewing
    name_zh: 待罪谏垣
    labels:
      zh: 初任给事中
    highlight_event_id: guji-逯中立-event-3
  - key: breakthrough
    name_zh: 力谏国事
    labels:
      zh: 连上诸疏
    start_date: 1593
    highlight_event_id: guji-逯中立-event-4
  - key: climax
    name_zh: 忤旨见斥
    labels:
      zh: 停俸见忌
    highlight_event_id: guji-逯中立-event-5
  - key: closure
    name_zh: 贬谪外授
    labels:
      zh: 因疏被贬
    highlight_event_id: guji-逯中立-event-6
  decisions:
  - date: 1593
    title_zh: 上论公用舍疏，请录用废谪诸臣
    rationale: 诸臣多砥行守正之士，被斥致人才凋敝，愿朝廷随材录用以示大公。
  - date: 1593
    title_zh: 上论罢太和山织造疏，请以香税赈灾
    rationale: 织造不经且费巨，东南灾沴民困，愿停不经之费以弘赈恤之恩。
  - date: 1593
    title_zh: 上论东倭疏，力主罢封贡、修战守
    rationale: 封贡乃苟且之谋，倭情叵测，当闭关谢使，一意防御。
  - date: 1594
    title_zh: 上论修史用人疏，参劾刘虞夔总裁之选
    rationale: 虞夔邪媚为士类不齿，辅臣援私，恐开邪臣奔竞之途。
  - date: 1594
    title_zh: 上论拔淹滞停例金疏
    rationale: 废谪诸臣才可用而永无进阶，云南加金民不堪命，请次用诸臣、停增例金。
  - date: 1594
    title_zh: 上论会推阁臣疏，为顾宪成等鸣不平
    rationale: 会推乃国家大政，宪成以直道被黜，恐黜陟重典为权门供爱憎。
