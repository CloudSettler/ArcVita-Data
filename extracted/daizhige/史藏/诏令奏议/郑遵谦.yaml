  era: 南明（隆武、鲁监国时期）
  reign_ref: 隆武、鲁监国
  archetype: 起兵抗清的地方武将
  dilemmas:
  - 首义保江东却遭朝中宵小诽谤，功高而谤随
  - 父渡江降虏，忠孝难以两全
  lesson: 倡义存疆者未必见信于朝，公论有赖直言者为之辩护。
  summary_first_person: 乙酉夏，虏入杭州，八府震恐，我密谋迅起，首斩彭万里、继斩张愫，缚官抚涣，禡旗演武场，列阵江干，发兵扼江，力拒虏师；独保江东，特赐、富阳售典五百金散给溃兵，收甲仗以需后用，故士卒归心。金堡监军江上，与我同心共济，特上疏为我讼功。
