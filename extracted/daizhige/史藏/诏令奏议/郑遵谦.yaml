  decisions:
  - date: 1645-06
    title: 密遣腹心安抚左营索粮之兵
    rationale: 勿使散失甲仗，以需后用；典屋五百金不足，毁杯斝簪珥以继之。
  - date: 1645-07
    title: 首倡义旗，斩彭万里、张愫
    rationale: 当绍兴通郡将奉降表之际，奋举义旗，为中朝吐气。
events:
- id: guji-郑遵谦-event-plan
  event_type: 计议
  date: 1645-06
  year_of: 1645
  summary: 虏入杭州，八府震恐，绍兴籍吏民、封府库、赍降表者如市；遵谦与诸同仇密谋迅起。
- id: guji-郑遵谦-event-uprising
  event_type: 起兵
  date: 1645-07
  year_of: 1645
  summary: 首斩彭万里，继斩张愫，缚官抚涣，禡旗于演武场，万人踊跃，列阵江干。
- id: guji-郑遵谦-event-hold-river
  event_type: 作战
  date: 1645-08
  year_of: 1645
  summary: 发兵扼江，力拒虏师；十日后王之仁至，一月后方国安至。
- id: guji-郑遵谦-event-berth
  event_type: 防御
  date: 1645-09
  year_of: 1645
  summary: 昼汛夜防，先列戍于长山，继札营于小亹，越江而战，扼险而巡。
- id: guji-郑遵谦-event-defense-advocacy
  event_type: 建言
  date: 1645-10
  year_of: 1645
  summary: 金堡于中兴大计疏中议其列营江上，固守绍兴之外，可出偏师与姚志卓等相掎角，绝虏粮道。
- id: guji-郑遵谦-event-honor-plea
  event_type: 讼功
  date: 1645-11
  year_of: 1645
  summary: 金堡上《为郑遵谦讼功疏》，详述首义之功，请敕部竟行叙用、钦定爵衔赐将印。
