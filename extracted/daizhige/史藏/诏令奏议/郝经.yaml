  type: birth
  date: '1223'
  year_of: 1223
  name_zh: 郝经生于许州（一说陵川人，生于金末战乱之际）
  description_zh: 郝经字伯常，泽州陵川人，生于金末兵乱，家世业儒。
  era: 蒙古汗国
- id: guji-hao-jing-event-yidongzuìyán
  type: endeavor_event
  date: '1250'
  year_of: 1250
  name_zh: 上《河东罪言》
  description_zh: 忽必烈在藩邸召见，郝经上《河东罪言》，陈汉地赋役之弊与安民之策。
  endeavor_id: guji-hao-jing-endeavor-1
  era: 蒙哥汗时期
- id: guji-hao-jing-event-banshiyi
  type: endeavor_event
