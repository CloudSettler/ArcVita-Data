  year_of: 1259
  name_zh: 上《东师议》《班师议》
  description_zh: 宪宗蒙哥死于合州军中，郝经力劝忽必烈班师北归，先定继统大计。
  endeavor_id: guji-hao-jing-endeavor-1
  era: 蒙哥汗末年
- id: guji-hao-jing-event-shisong
  type: endeavor_event
  date: '1260'
  year_of: 1260
  name_zh: 以国信使奉使南宋
  description_zh: 世祖中统元年，郝经以翰林侍读学士充国信使使宋，议和通好。
  endeavor_id: guji-hao-jing-endeavor-2
  era: 元中统元年
- id: guji-hao-jing-event-detained
  type: endeavor_event
  date: '1260'
  year_of: 1260
  name_zh: 被贾似道拘于真州
  description_zh: 至真州，贾似道恐其言及鄂州之盟，将郝经拘禁于真州忠勇军营，一拘十六年。
  endeavor_id: guji-hao-jing-endeavor-2
  era: 元中统元年
- id: guji-hao-jing-event-writing
  type: endeavor_event
  date: '1261'
  year_of: 1261
  name_zh: 幽囚著述，不辍其业
  description_zh: 被拘期间讲学著书不辍，撰《续后汉书》《陵川集》等，明志守节。
  endeavor_id: guji-hao-jing-endeavor-2
  era: 元中统至至元年间
- id: guji-hao-jing-event-lizhengyi
  type: endeavor_event
  date: '1260'
  year_of: 1260
  name_zh: 上《便宜新政》《备御奏目》《立政议》
  description_zh: 世祖初立，郝经先后陈奏新政之宜、备御之目与立国之议，为元初立制献策。
  endeavor_id: guji-hao-jing-endeavor-1
  era: 元中统年间
- id: guji-hao-jing-event-return
  type: endeavor_event
  date: '1275'
  year_of: 1275
  name_zh: 北归，寻卒
  description_zh: 至元十二年宋请和，郝经得释北归，同年七月病卒于大都，谥文忠。
  endeavor_id: guji-hao-jing-endeavor-2
  era: 元至元十二年
- id: guji-hao-jing-event-death
  type: death
  date: 1275-08
  year_of: 1275
  name_zh: 郝经卒于大都
  description_zh: 至元十二年七月卒，世祖遣使吊祭，谥文忠。
  era: 元至元年间
