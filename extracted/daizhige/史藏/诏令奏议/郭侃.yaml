  era: 蒙古汗国·元初
  reign_ref: 蒙哥汗、元世祖忽必烈
  archetype: 西征宿将·经世建言者
  dilemmas:
  - 身为汉人世侯之后而远征西亚，战功与屠城止杀之抉择
  - 归朝之后由武功转文治，上策议政以图平宋安民
  lesson: 出将入相之才贵在止杀安民，军功之后尤须以屯田立政固本
  summary_first_person: 我郭侃，华州郑县人，唐汾阳王郭子仪之后。幼养于蒙古将门，从军西征，破木剌夷、下报达，转战万里，凡下城七百余。中统、至元间归朝，上立政、平宋、屯田之策，以武功起家而终于文治安民之议。
  source_urls:
  - https://zh.wikisource.org/wiki/元史/卷149
  - https://zh.wikipedia.org/wiki/郭侃
