    rationale: 职在纠弹，仰体尧舜之心，效鹰鹯之逐，不畏权要睚眦必报。
  - date: '1689-10-26'
    title_zh: 上特参近臣疏，劾高士奇、王鸿绪等植党营私、招权纳贿
    rationale: 高士奇等表里为奸，恣肆于光天化日之下，不避嫌怨，直陈其罪。
