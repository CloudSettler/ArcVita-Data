  description_zh: 康熙二十七年，以言官上疏弹劾大学士明珠、余国柱背公结党纳贿，并参河臣靳辅、幕宾陈潢；明珠立予罢斥，郭琇以此鲠直受知。
  location_zh: 京师
- id: guji-郭琇-event-duyushi
  type: achievement
  date: '1689-01-01'
  year_of: 1689
  description_zh: 受圣祖嘉其敢言，不及二年由左佥都御史洊擢左都御史；康熙二十八年复劾高士奇、王鸿绪等，诸人俱休致回籍。
  location_zh: 京师
- id: guji-郭琇-event-zongdu
