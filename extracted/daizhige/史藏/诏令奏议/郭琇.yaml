  era: 清康熙年间
  reign_ref: 康熙
  archetype: 鲠直敢谏之臣
  dilemmas:
  - 弹劾权臣明珠、高士奇等虽受知拔擢，然得罪权要、树敌甚众
  - 总督任内因红苗抢掠隐匿不报，功名尽毁，罪由自取
  lesson: 直言弹劾可得一时之知，然居官须始终恪尽职守，赏罚皆视其所自取。
  summary_first_person: 朕（臣）郭琇，字华野，即墨人，康熙庚戌进士。由吴江知县行取入台，即劾罢大学士明珠、尚书王鸿绪等，蒙圣祖嘉其敢言，洊擢左都御史；后缘事镌秩，复起为湖广总督，在官四年，以红苗抢掠一事褫职归里。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=华野疏稿
