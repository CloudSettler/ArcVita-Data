  date: 1730-11-01
  year_of: 1730
  type: policy
  title_zh: 改土归流大功告成
  description: 先后平定乌蒙、镇沅等处土司叛乱，西南三省废土司、设府州县、编户籍、兴学校，雍正特授一等伯。
- id: guji-鄂尔泰-event-death
  date: 1745-04-24
  year_of: 1745
  type: death
  title_zh: 鄂尔泰病逝
  description: 乾隆十年卒于大学士任，谥文端，配享太庙；乾隆二十年坐胡中藻案撤出贤良祠。
