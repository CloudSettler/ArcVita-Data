  title_zh: 鄂尔泰生于满洲镶蓝旗西林觉罗氏之家
  description: 出身官宦世家，康熙十六年生。
- id: guji-鄂尔泰-event-breakthrough
  date: 1725-03-15
  year_of: 1725
  type: appointment
  title_zh: 迁云南布政使，开始主政西南
  description: 雍正三年擢云南布政使，旋profess升总督，得雍正常密谕倚任，与田文镜、李卫并称三大模范督抚。
