  era: 明末清初
  reign_ref: 隆武、永历
  archetype: 直谏忠臣·明遗民
  dilemmas:
  - 尽忠报国与守丧终制的冲突
  - 抗清出仕与国亡后出家守节的选择
  lesson: 犯颜直谏、不避权贵，国亡后以身殉节，气节重于功名
  summary_first_person: 我是金堡，仁和人，崇祯庚辰进士。隆武、永历之际我居言职，屡上疏直言时政、弹劾权贵，几乎置死于朝堂；国亡后祝发为僧，抗志以终。
