events:
- id: guji-金堡-event-birth
  date: ''
  year_of: ''
  type: birth
  title_zh: 金堡生（浙江仁和人）
  detail: 崇祯十三年庚辰中二甲进士，推测生年约在万历末年
- id: guji-金堡-event-uprising
  date: 1645
  year_of: 1645
  type: endeavor
  title_zh: 与姚志卓等起兵余杭，复城擒伪
  detail: 誓死不屈，几死虏手，弃家入越会诸义师；鲁藩加职方主郎，不受
- id: guji-金堡-event-zhongxing
  date: 1645-10
  year_of: 1645
  type: endeavor
  title_zh: 隆武乙酉十月上《中兴大计疏》
  detail: 力请隆武帝出关亲征，并画分道出师之势；又为郑遵谦讼功
- id: guji-金堡-event-cike
  date: 1646
  year_of: 1646
  type: endeavor
  title_zh: 因停刑之谏破格擢礼科给事中，恳辞不就
  detail: 请收回成命，仍愿为忠义营监军
- id: guji-金堡-event-shizheng
  date: 1648-11
  year_of: 1648
  type: endeavor
  title_zh: 永历戊子上《时政八失疏》《中兴四议疏》
  detail: 永历朝兵科给事中职上，屡劾权贵，愤激敷陈，规切时事
- id: guji-金堡-event-monk
  date: 1650
  year_of: 1650
  type: endeavor
  title_zh: 国亡后祝发为僧
  detail: 高尚不事，抗志以终，与谢枋得、唐珏先后辉映
- id: guji-金堡-event-shuzi
  date: 1673
  year_of: 1673
  type: legacy
  title_zh: 孙德谦为《岭海焚余》作序
  detail: 岁在癸丑，隘堪居士孙德谦据睹閟簃钞本缀序，谓其文不在苏文忠下
- id: guji-金堡-event-death
  date: ''
  year_of: ''
  type: death
  title_zh: 金堡卒（为僧后抗志以终）
  detail: 卒年不详
