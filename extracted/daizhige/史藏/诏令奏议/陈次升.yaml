  era: 北宋
  reign_ref: 熙宁、元佑、绍圣、徽宗朝（政和、重和）
  archetype: 直言敢谏之诤臣
  dilemmas:
  - 弹劾权臣章惇、蔡京、蔡卞、曾布，虽知必遭报复仍坚持极论
  - 为元佑诸臣辨诬，反对小人攀诬宣仁皇后徽号
  - 论列宗景以妾为妻，触怒宫廷权贵而不避风险
  lesson: 破除门户之见、坚守公议是非，虽三居言责屡遭贬谪而刚直之气凛然不改
  summary_first_person: 我陈次升，字当时，兴化仙游人。熙宁二年进士及第，历知安邱县、监察御史、殿中侍御史、左司谏。我三居言责，建议鲠切，最大之功在止吕升卿使岭南，救元佑诸臣；又弹劾章惇、蔡京、蔡卞、曾布诸疏明白痛切，虽因此垂老投荒，然破除成见、不立门户，是非公论无所假借，凛然之气可昭史册。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=932751
