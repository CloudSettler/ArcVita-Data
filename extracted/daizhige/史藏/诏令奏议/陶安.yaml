  - 儒者出仕与保境安民之间的抉择
  lesson: 顺天应人、吊民伐罪者方能定天下，择主当观其心而不观其势
  summary_first_person: 我陶安，元末耆儒。乙未夏太祖渡江取太平，我率父老出迎，见其龙姿凤质，谓有主矣。因献言四海鼎沸之际唯明公神武不杀、顺天应人，又劝先取金陵形胜之地以临四方，遂佐开国之业。
  source_urls:
  - 钦定四库全书·名臣经济録卷一·陶安传録
