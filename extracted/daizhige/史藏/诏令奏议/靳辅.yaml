events:
- id: guji-靳辅-event-appointment
  date: '1677'
  year_of: 1677
  title_zh: 受康熙帝委任为河道总督
  summary: 皇帝委任治河，靳辅专听幕宾陈潢之策，主持黄淮河工
- id: guji-靳辅-event-dispute
  date: '1687'
  year_of: 1687
  title_zh: 下河工程之争与屯田累民
  summary: 屡次题请筑堤挑浚、耗费帑金数百万而河患如故；屯田夺民田、越境货卖米麦，与于成龙议不合，被指阻挠明诏
- id: guji-靳辅-event-impeached
  date: 1688-03
  year_of: 1688
  title_zh: 遭郭琇特参弹劾
  summary: 康熙二十七年正月郭琇上《特参河臣疏》劾靳辅蠹国累民、庇护陈潢冒滥名器，靳辅及佛伦等解任，河工案内完结
- id: guji-靳辅-event-connected-impeachment
  date: '1688-03-08'
  year_of: 1688
  title_zh: 因交结党援同被严议
  summary: 郭琇《特纠大臣疏》指靳辅与明珠、余国柱交相固结，每年縻费河银大半分肥，康熙帝命于河工案内一并查究
