events:
- id: guji-顺治帝-event-birth
  date: '1638-03-15'
  year_of: 1638
  type: birth
  title_zh: 爱新觉罗·福临生
  description_zh: 生而神灵，岐嶷首出，后为世祖章皇帝。
  location_zh: 盛京
- id: guji-顺治帝-event-accession
  date: '1644-10-30'
  year_of: 1644
  type: political
  title_zh: 冲龄践阼，定鼎燕京
  description_zh: 六岁嗣绍丕基，诸王大臣同心推戴，定鼎京师，奄有四海。
  location_zh: 北京
- id: guji-顺治帝-event-personal-rule
  date: '1651-02-13'
  year_of: 1651
  type: political
  title_zh: 亲政始，革睿王摄政积弊
  description_zh: 亲政后焦心劳思，痛陈摄政时期诛降滥赏、屏斥忠良之弊，竭力更新。
  location_zh: 北京
- id: guji-顺治帝-event-edict-rectify
  date: 1653-02
  year_of: 1653
  type: political
  title_zh: 御内院阅通鉴，论历代贤君
  description_zh: 谕大学士范文程等，以明太祖所定制度章程规画周详为历代之最。
  location_zh: 北京
- id: guji-顺治帝-event-neizeyanyi
  date: 1656-08
  year_of: 1656
  type: cultural
  title_zh: 制内则衍义成书并序
  description_zh: 仰承皇太后慈训，搜辑古今嘉言美行，阐明孝敬教礼让慈勤学八要。
  location_zh: 北京
- id: guji-顺治帝-event-jingyan
  date: 1655-03
  year_of: 1655
  type: cultural
  title_zh: 谕选满汉词臣充日讲官
  description_zh: 选学问淹博者八员充日讲官，侍左右以备谘询，勤学图治。
  location_zh: 北京
- id: guji-顺治帝-event-xiaojing-yanyi
  date: 1656-01
  year_of: 1656
  type: cultural
  title_zh: 命撰孝经衍义
  description_zh: 谕内三院博采群言加以论断，勒成一编，以彰孝治天下之意。
  location_zh: 北京
- id: guji-顺治帝-event-shengxun
  date: 1687-03
  year_of: 1687
  type: cultural
  title_zh: 圣祖恭编世祖圣训六卷
  description_zh: 康熙二十六年圣祖仁皇帝命儒臣编纂，凡一百一十三则，分三十有二门。
  location_zh: 北京
- id: guji-顺治帝-event-death
  date: '1661-02-05'
  year_of: 1661
  type: death
  title_zh: 顺治帝崩
  description_zh: 在位十八年，励精图治，为康乾盛世奠定丕基。
  location_zh: 北京
