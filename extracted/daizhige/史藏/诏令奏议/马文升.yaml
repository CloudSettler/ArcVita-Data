  birth_date: 约1426年
  death_date: 1510年
  era: 明代
  reign_ref: 历仕景泰、天顺、成化、弘治、正德五朝（主要活动于成化、弘治）
  archetype: 直臣能吏 · 忧国之相
  dilemmas:
  - 权阉汪直、方士李孜省辈屡加构陷，志不得尽行，仍直言不辍
  - 宪宗时敭历中外而建白难行，孝宗召用后方得展布谟猷
  lesson: 砥砺廉隅、练达政体，虽屡遭构陷而靖献之志不改，进言以家国至计为先。
  summary_first_person: 我马文升，字负图，均州人，景泰辛未进士，官至兵部尚书，谥端肃。我砥砺廉隅、练达政体，朝端大议多待我而决。成化中巡抚辽东、总督漕运，建有劳绩，然屡为汪直、李孜省辈所构，不能尽行其志；及蒙孝宗知遇，明良相契，乃于《端肃奏议》中尽陈剀切之言——请正北岳祀典、振肃风纪十五章、勤政惜费、重守令、豫教皇储诸疏，皆有关家国至计。与王恕、刘大夏同负一时重望。
  source_urls:
  - https://guji.ctext.org/
