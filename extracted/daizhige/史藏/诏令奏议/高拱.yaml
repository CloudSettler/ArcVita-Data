  description_zh: 高拱约生于正德年间（约1513年）。
- id: guji-高拱-event-jingyan
  event_type: role_appointment
  date: 1567-04
  year_of: 1567
  date_precision: month
  description_zh: 隆庆元年四月，命少保兼太子太保礼部尚书武英殿大学士高拱同知经筵事。
- id: guji-高拱-event-appeal
  event_type: memorial
  date: '1570-09-14'
  year_of: 1570
  date_precision: day
  description_zh: 掌吏部事大学士高拱等于审录重囚时，见方士王金等狱词诬先帝不得正终，隐恸流涕上疏请会同多官从公再讯，为世宗昭雪；后刑部会鞫尽反狱词，宣付史馆。
- id: guji-高拱-event-jingying
  event_type: policy_discussion
  date: '1570-12-09'
  year_of: 1570
  date_precision: day
  description_zh: 隆庆四年九月甲午，诏复京营旧制，罢六提督，更推总督协理大臣；此事与其"辅臣分制"之议相涉。
- id: guji-高拱-event-tutor
  event_type: role_appointment
  date: 1572-02
  year_of: 1572
  date_precision: month
  description_zh: 隆庆六年二月，东宫出阁讲学，高拱等请选辅导官僚，得旨命高拱与张居正提调各官讲读。
- id: guji-高拱-event-death
  event_type: death
  date: '1578'
  year_of: 1578
  date_precision: year
  description_zh: 高拱约卒于万历六年（约1578年）。
