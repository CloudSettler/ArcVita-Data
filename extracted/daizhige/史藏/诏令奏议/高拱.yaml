  birth_date: 约1513
  death_date: 约1578
  era: 明代（隆庆朝）
  reign_ref: 隆庆
  archetype: 政务宰辅
  dilemmas:
  - 内阁辅臣与言官科道之间的政争与信任危机
  - 祖制成宪与时局更革之间的取舍
  lesson: 秉公执正、敢言敢任，方能在乱世政局中护持纲纪。
  summary_first_person: 我高拱，历仕嘉靖、隆庆两朝，以大学士掌吏部事。隆庆四年，我于审录重囚时见方士王金等狱词诬先帝以不得正终，涕泣上言为其昭雪；又参与京营旧制之复、经筵讲学之设，并于东宫出阁讲学时遴选辅导官僚，提调讲读，以尽辅弼之责。
  source_urls:
  - https://zh.wikisource.org/wiki/大明穆宗庄皇帝宝训
