events:
- id: guji-高滔滔-event-birth
  kind: birth
  date: '1032'
  year_of: 1032
  summary_zh: 高滔滔生，后为亳州蒙城高氏，入英宗藩邸。
- id: guji-高滔滔-event-炸立皇后
  kind: career
  date: '1063'
  year_of: 1063
  summary_zh: 治平年间颁《立高皇后制》《册高皇后文》，正位中宫。
- id: guji-高滔滔-event-尊太皇太后
  kind: career
  date: 1085-03
  year_of: 1085
  summary_zh: 神宗崩，哲宗即位（《哲宗即位赦》元丰八年三月己亥），高氏尊为太皇太后并建坤成节。
- id: guji-高滔滔-event-权同听政
  kind: career
  date: '1085'
  year_of: 1085
  summary_zh: 权同听政诏下，高氏垂帘处分军国事。
- id: guji-高滔滔-event-改元元祐
  kind: career
  date: '1086'
  year_of: 1086
  summary_zh: 颁改元祐元年御札，临朝诸政以减恩泽、罢受册礼、元日不御殿示节俭。
- id: guji-高滔滔-event-服药赦
  kind: career
  date: '1093'
  year_of: 1093
  summary_zh: 元祐八年寝疾，颁以太皇太后寝疾赦见禁德音及服药大赦。
- id: guji-高滔滔-event-遗诰
  kind: career
  date: '1093'
  year_of: 1093
  summary_zh: 太皇太后遗诰颁下，崩逝。
- id: guji-高滔滔-event-death
  kind: death
  date: '1093'
  year_of: 1093
  summary_zh: 崩，谥宣仁圣烈，有谥议、谥册、哀册，园陵称山陵。
