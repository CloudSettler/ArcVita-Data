  era: 北宋
  reign_ref: 英宗皇后、神宗朝皇太后、哲宗朝太皇太后临朝（元祐年间摄政）
  archetype: 临朝称制的贤后
  dilemmas:
  - 权同听政与还政于君之间的取舍
  - 新旧党争与祖宗成法之间的抉择
  lesson: 权而不专，功成身退；临朝而不改元僭号，还政而后止。
  summary_first_person: 我是高滔滔，宣仁圣烈皇后。我以英宗皇后入中宫，神宗朝尊为皇太后，神宗崩后权同听政，辅立幼主哲宗，改元元祐，临朝期间遵行祖宗旧章，减损恩泽，不御正殿，朝廷称治。元祐八年我病重服药、大赦天下，遗诰而崩，谥宣仁圣烈。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=641006
