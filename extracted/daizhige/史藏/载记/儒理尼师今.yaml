- id: guji-儒理尼师今-event-reign-start
  date: '0024'
  year_of: '0024'
  type: enthronement
  title_zh: 齿理多而奉立为王，号尼师今
  actors:
  - guji-儒理尼师今
  - guji-脱解
  place: 金城
  excerpt_zh: 初南解薨，儒理当立，以大辅脱解素有德望推让其位，脱解曰圣智人多齿，试之，儒理齿理多，乃与左右奉立之，号尼师今。
- id: guji-儒理尼师今-event-sacrifice
  date: '0025'
  year_of: '0025'
  type: political
  title_zh: 亲祀始祖庙，大赦
  actors:
  - guji-儒理尼师今
  place: 金城
  excerpt_zh: 二年春二月，亲祀始祖庙，大赦。
- id: guji-儒理尼师今-event-relief
  date: 0028
  year_of: 0028
  type: political
  title_zh: 巡行国内，解衣推食赈济贫病
  actors:
  - guji-儒理尼师今
  place: 新罗国内
  excerpt_zh: 五年冬十一月，王巡行国内，见一老妪饥冻将死，曰是予之罪也，解衣覆之，推食食之，仍命有司在处存问鳏寡孤独老病不能自活者，给养之，邻国百姓闻而来者众矣。
- id: guji-儒理尼师今-event-institution
  date: '0032'
  year_of: '0032'
  type: institutional
  title_zh: 改六部赐姓，设官十七等，始制嘉俳与歌乐
  actors:
  - guji-儒理尼师今
  place: 金城
  excerpt_zh: 九年春，改六部之名仍赐姓，又设官有十七等；王既定六部，中分为二，使王女二人各率部内女子分朋绩麻，八月十五日考其功，负者置酒食以谢胜者，歌舞百戏皆作谓之嘉俳，会苏曲之名由是而作，此歌乐之始也。
- id: guji-儒理尼师今-event-yugok
  date: '0051'
  year_of: '0051'
  type: diplomatic
  title_zh: 高句丽既灭乐浪，其国人五千来投，分居六部
  actors:
  - guji-儒理尼师今
  place: 金城
  excerpt_zh: 十四年，高句丽王无恤袭乐浪灭之，其国人五千来投，分居六部。
- id: guji-儒理尼师今-event-death
  date: '0057'
  year_of: '0057'
  type: death
  title_zh: 王薨，遗命脱解即大位，葬蛇陵园内
  actors:
  - guji-儒理尼师今
  place: 金城
  excerpt_zh: 三十四年秋九月王不豫，谓臣寮曰脱解屡著功名，朕之二子其才不及远矣，吾死之后即大位以无忘我遗训；冬十月王薨，葬蛇陵园内。
