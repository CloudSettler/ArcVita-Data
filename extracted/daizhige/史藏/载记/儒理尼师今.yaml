      raw: 儒理尼师今三十四年冬十月王薨
  birth_date: '0024'
  death_date: '0057'
  era: 古朝鲜三国前期（新罗初期）
  reign_ref: 儒理尼师今（新罗第三位君主，24–57年在位）
  archetype: 谦让守礼、经制立国的古代君主
  dilemmas:
  - 南解薨后当立，但惧大辅脱解素有德望，让位与否关乎神器归属
  - 脱解与自身皆贤，须以“齿多”试智定神器之归
  lesson: 让位于贤须有实德自证；为君以养民、立制为本。
  summary_first_person: 我本为南解太子，先王薨时本当即位，然因大辅脱解素有德望，我推让其位，脱解以圣智之人齿多相试，我齿理为多，遂被左右奉立，号尼师今。即位后我亲祀始祖庙、巡行国内赈济孤寡，饥冻老者解衣推食以养之，邻国百姓闻风来投。我改六部之名并赐姓李、崔、孙、郑、裴、薛，又设官十七等，命二公主率部内女子分朋绩麻，八月十五日考功置酒作乐，号嘉俳，会苏曲由此而生，为歌乐之始。在位间乐浪犯边、高句丽灭乐浪而其众来投、貊国结好，皆有应付。三十四年我不豫，念脱解屡著功名而我二子才不及远，遗命脱解继大位，冬十月薨，葬蛇陵园内。
  source_urls:
  - https://zh.wikisource.org/wiki/三國史記/卷01
