  era: 五代十国·南唐
  reign_ref: 保大、交泰、建隆年间南唐朝廷
  archetype: 文人宰相
  dilemmas:
  - 位居辅弼而屡主扩土之议，闽楚用师连连丧败，才名与功业相悖
  - 夹在庸主猜忌与党争倾轧之间，屡登相位又屡遭罢黜
  lesson: 词名千载而政声难继，文人秉政须审时度势，贪功轻举则误国败身。
  summary_first_person: 我冯延巳，事南唐二主，位至同平章事。我以词名世，却数度当国，佐元宗屡兴师旅，闽楚之役丧师失地，我亦随政局浮沉，屡罢屡起，国蹙降号之际，备尝荣辱。
  source_urls:
  - 南唐书·元宗本纪（李俊风整理校对本）
