  era: 十六国·前赵
  reign_ref: 光初
  archetype: 开国之君·武将皇帝
  dilemmas:
  - 酗酒误战：洛西大战前连饮酒数斗，乘赤马无故蹋顿，换小马出阵，终致大溃被执
  - 改号争议：弃汉宗庙改国号为赵，去汉怀民之望，众议未决而独断
  - 亡国之托：被执后致书太子毗，戒其勿以己为意速降，社稷仍亡
  lesson: 沉醉与自负可毁百战之功；一马失蹄，国祚随倾。
  summary_first_person: 我刘曜，字永明，刘渊族子，少孤而养于渊宫。我身长九尺，厚铁可洞射，眉白目赤光。靳准乱汉，我自长安赴难，光初元年即皇帝位，翌年徙都长安，改国号为赵。我破石虎于蒲坂，攻金墉围石生，然洛西一战，我醉后出战，马陷石渠，为石堪所执，被送襄国，终为石勒所杀，太子毗亦遇害，前赵二十六载之业至此而终。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=十六国春秋
