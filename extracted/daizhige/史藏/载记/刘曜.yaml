events:
- id: guji-刘曜-event-birth
  person_qid: guji-刘曜
  date: ''
  year_of: ''
  date_precision: unknown
  name_zh: 刘曜出生（少孤见养于刘渊）
  description: 刘曜字永明，渊之族子，少孤，见养于渊，生而眉白，目有赤光。
- id: guji-刘曜-event-capture-luoyang
  person_qid: guji-刘曜
  date: '0311'
  year_of: 311
  date_precision: year
  name_zh: 与王弥石勒会攻陷洛阳
  description: 永嘉四年前后，刘聪命王弥、刘曜及石勒进军，长驱围洛阳陷之，总兵大掠，迁晋帝于平阳。
- id: guji-刘曜-event-throne
  person_qid: guji-刘曜
  date: 0318-10
  year_of: 318
  date_precision: month
  name_zh: 即皇帝位，改元光初
  description: 太保呼延宴等自平阳来奔上尊号，曜僣即皇帝位于光初元年十月，十二月靳准左右杀准奉六玺来降。
- id: guji-刘曜-event-changan
  person_qid: guji-刘曜
  date: 0319-04
  year_of: 319
  date_precision: month
  name_zh: 徙都长安并改国号为大赵
  description: 光初二年夏四月徙都长安，立子熙为皇太子；又议除汉宗庙改国号，遵以水行，革称大赵。
- id: guji-刘曜-event-pushan
  person_qid: guji-刘曜
  date: 0325-07
  year_of: 325
  date_precision: month
  name_zh: 蒲坂大破石虎
  description: 光初八年七月石虎率众四万寇河东进蒲坂，曜选中外精锐自潼关北济，虎惧引还，曜追而败之，枕尸一百余里。
- id: guji-刘曜-event-captured
  person_qid: guji-刘曜
  date: 0328-12
  year_of: 328
  date_precision: month
  name_zh: 洛西兵败被执
  description: 勒自帅众拒于洛西；曜性酗酒，将战饮数斗，乘赤马蹋顿，复饮乘小马，至西阳门防阵，马陷石渠坠冰上，为石堪所执，送襄国。
- id: guji-刘曜-event-death
  person_qid: guji-刘曜
  date: 0329
  year_of: 329
  date_precision: year
  name_zh: 被石勒所杀，前赵灭亡
  description: 建平末为勒所杀；翌年太子毗等奔上邽溃，石虎执毗及王公已下三千余人皆杀之，自刘渊建号至是二十有六载。
