  decisions:
  - date: '304'
    title_zh: 称汉王而不称皇帝
    rationale: 晋氏犹在、四方未定，仰遵高祖法，权停皇帝之号以待宇宙混一
  - date: '304'
    title_zh: 迁于左国城、收纳晋人
    rationale: 众十余万，晋人东附者数万，据形胜以图中原
  - date: '07'
    title_zh: 以汉为国号、追尊刘禅
    rationale: 汉有天下岁久，恩德结于庶民，立汉祖宗之庙以怀民望
events:
- id: guji-刘渊-event-birth
  event_type: birth
  date: '249'
  year_of: 249
  summary_zh: 因白鱼跃祭所、日精入梦之祥，十五月而生，左手有文曰渊海，遂名渊。
- id: guji-刘渊-event-study-youth
  event_type: study
  date: '266'
  year_of: 266
  summary_zh: 幼而好学，不舍昼夜，谓同门生朱纪、范隆等：一物不知，君子耻之；遂文学武事并皆妙绝。
- id: guji-刘渊-event-serving-jin
  event_type: political_career
  date: '264'
  year_of: 264
  is_circa: true
  summary_zh: 咸熙中为侍子居于洛阳，晋文帝深待之，王济称其容貌风仪，虽金日磾无以加。
- id: guji-刘渊-event-left-commander
  event_type: appointment
  date: '289'
  year_of: 289
  is_circa: true
  summary_zh: 其父文豹卒，晋帝以渊代为左部帅，转宁朔将军、监五部军事。
- id: guji-刘渊-event-planning
  event_type: political_career
  date: '306'
  year_of: 306
  is_circa: true
  summary_zh: 惠帝失政、州郡豪杰蜂起，从祖刘宣等密议拥渊为大单于，谓今司马氏骨肉相残，兴复在此时矣。
- id: guji-刘渊-event-coronation-hanwang
  event_type: coronation
  date: 304-10
  year_of: 304
  summary_zh: 迁于左国城，筑坛南郊，即汉王位，改元熙元年，大赦天下，追尊刘禅为孝怀皇帝，立汉三祖五宗神主。
- id: guji-刘渊-event-emperor
  event_type: coronation
  date: 306-10
  year_of: 306
  is_circa: true
  summary_zh: 永凤元年十月，丞相刘宣等上尊号，渊僭即皇帝位于南郊，大赦改元，以刘宣等置百官，招降王弥、石勒。
- id: guji-刘渊-event-move-capital
  event_type: capital_relocation
  date: '307'
  year_of: 307
  is_circa: true
  summary_zh: 河瑞元年迁都平阳，汾水得玉玺，大赦改元。
- id: guji-刘渊-event-death
  event_type: death
  date: 310-08
  year_of: 310
  summary_zh: 渊寝疾，以诸子录尚书事、置单于台，薨于光极殿，葬永光陵，諡光文皇帝，庙号高祖。
