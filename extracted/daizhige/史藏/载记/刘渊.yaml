person:
  qid: guji-刘渊
  name_zh: 刘渊
  names:
    zh: 刘渊
    en: Liu Yuan
  lifespan:
    birth:
      date: '249'
      precision: year
      is_circa: true
      raw: 魏嘉平中祈子于龙门，十五月而生渊
    death:
      date: '310'
      precision: year
      is_circa: false
  birth_date: '249'
  death_date: '310'
  era: 魏晋十六国（前赵）
  reign_ref: 汉王（元熙元年即汉王位，后称帝，改元永凤、河瑞）
  archetype: 开国之君
  dilemmas:
  - 以匈奴贵胄之身仕晋洛阳，忠与族群身份的两难
  - 称汉王还是单于、复汉还是复国之取舍
  lesson: 随陆无武、绛灌无文——文武兼修方能成大业；德之所授不分华夷
  summary_first_person: 我刘渊，新兴匈奴人，先世为夏后氏苗裔，因汉与冒顿约为兄弟而冒姓刘。我幼而好学，兼修文学武事，仕魏为侍子，晋武帝时为左部帅、监五部军事。晋室诸王相残，刘宣等推我为大单于，我以继承汉统为名起于左国城，称汉王，追尊刘禅，后即皇帝位于南郊，迁都平阳，得玉玺改元，临终托政于诸子，諡光文皇帝，庙号高祖。
  source_urls:
  - https://www.zh.wikisource.org/wiki/十六国春秋
