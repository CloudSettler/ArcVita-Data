  era: 十六国·前赵
  reign_ref: 汉国（前赵）君主
  archetype: 雄略僭主
  dilemmas:
  - 以汉室之名行匈奴屠各之实，承晋还是代晋的合法性纠结
  - 俘虏并羞辱晋怀帝、愍帝与夷灭其臣的暴虐抉择
  - 军国大权尽付国相刘粲与靳准所致的身死族乱隐患
  lesson: 借民族之名兴邦易，恃虐杀与荒宴守成难。
  summary_first_person: 我是刘聪，一名载渊，刘渊第四子。母孕梦日入怀，十五月而生，生有异光。我聪悟绝人，通经史百家，兼习孙吴兵法，猿臂善射，弯弓三百斤。永嘉四年我即皇帝位于光极前殿，改元光兴。我遣兵长驱围洛阳，陷而大掠，俘晋怀帝；其后又攻长安，纳愍帝之降，皆幽杀之于平阳。晚年我荒耽酒色，立市于后庭，或三日不醒，军国之决尽付刘粲、靳准，灾异迭见而我不惧。及薨，谥武皇，庙号烈宗；未几靳准作乱，刘氏几尽。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=5974
