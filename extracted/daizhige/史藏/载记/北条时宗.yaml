  era: 镰仓时代（文永、弘安年间）
  reign_ref: 执权（辅佐惟康亲王将军执政）
  archetype: 拒外御侮的执政者
  dilemmas:
  - 元朝国书降服之求与国体存亡之抉择
  - 迁二上皇于镰仓严卫京师还是分兵御敌
  lesson: 强敌压境之际，守议拒降、修边防、赖神社与将士同心，方保社稷
  summary_first_person: 我为镰仓执权，元世祖屡遣使来书逼贡，我议却其使，修筑长门以南海防。文永之役元兵入博多，忽遇飓风退去；弘安之役复大举来犯，我令九国兵会太宰府，筑石垒严守，元军复遭飓风覆没。杀杜世忠等元使，绝不通和，至死不渝。
endeavors:
- id: guji-北条时宗-endeavor-1
  name_zh: 抵御元朝（蒙古）入侵
  phases:
