    start_date: 1281
    highlight_event_id: guji-北条时宗-event-3
  - key: closure
    name_zh: 医后严修海防
    labels:
      zh: 弘安五年以后
    start_date: 1282
    highlight_event_id: guji-北条时宗-event-4
  decisions:
  - date: 1275
    title_zh: 杀元使杜世忠等
    rationale: 元使至太宰府送之镰仓，时宗竟杀之，以绝元通好之望，示不屈之志
  - date: 1281
    title_zh: 再杀周福、栾忠并议迁二上皇于镰仓
    rationale: 元先遣使暂缓师期，时宗又斩之；元兵压境，议迁二上皇于镰仓而以兵严卫京师
  - date: 1271
    title_zh: 却赵良弼所赍国书
    rationale: 传闻蒙古强盛，颇怀疑惧，然前书不报为既定方针，仍不通报而修边防
events:
- id: guji-北条时宗-event-1
  date: 1268
  year_of: 1268
  title_zh: 得元世祖国书上之，议却还并修边防
  detail_zh: 高丽潘阜赍元书致太宰府，时宗奉惟康亲王为将军执政权，得书上之；藤原长成草答书，时宗议不可，令却还，修边防，祷神社以备有变
  participants:
  - 北条时宗
  - 潘阜
  - 藤原长成
  location_zh: 镰仓
  source_ref: 卷五邻交志上二
- id: guji-北条时宗-event-2
  date: 1274
  year_of: 1274
  title_zh: 文永之役，元兵入博多
  detail_zh: 元以忻都、洪茶邱等发舟师，拔对马、壹岐，十九日入博多；二十日夜大风雨触礁，遂还
  participants:
  - 忻都
  - 洪茶邱
  - 金方庆
  location_zh: 对马、壹岐、博多
  source_ref: 卷五邻交志上二
- id: guji-北条时宗-event-3
  date: 1281
  year_of: 1281
  title_zh: 弘安之役，元兵压境败于飓风
  detail_zh: 元两军约会壹岐平户，兵至太宰府前沿海；日本诸道兵会太宰府，筑石垒严守，六月晦夜西北风大作，元舰自相撞碎溺死无算，全军十五万归者不及五之一
  participants:
  - 北条时宗
  - 范文虎
  - 忻都
  - 洪茶邱
  - 河野通有
  location_zh: 筑前、肥前沿海
  source_ref: 卷五邻交志上二
- id: guji-北条时宗-event-4
  date: 1282
  year_of: 1282
  title_zh: 令严修海防，九国将士更番戍守
  detail_zh: 弘安之役后，时宗仍令严修海防，命九国将士更番戍守；远江守北条时定为镇西奉行统辖军事
  participants:
  - 北条时宗
  - 北条时定
  location_zh: 镇西
  source_ref: 卷五邻交志上二
- id: guji-北条时宗-event-death
  date: ''
  year_of: 1284
  title_zh: 北条时宗死
  detail_zh: 是岁，北条时宗死，子左马权头贞时代为执权
  participants:
  - 北条时宗
  - 北条贞时
  location_zh: 镰仓
  source_ref: 卷五邻交志上二
