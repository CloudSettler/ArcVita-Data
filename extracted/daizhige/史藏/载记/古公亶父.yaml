  era: 商末周先公时期
  reign_ref: 周先公，居豳（邠），后迁岐周
  archetype: 仁德让地、肇基王业的部族领袖
  dilemmas:
  - 狄人屡侵索取财物与土地，抵抗将害及民众，退让则失国土
  - 欲传位于圣孙姬昌，须废长立少，有违常制
  lesson: 君子不以所养害其所养；积德行义，弃一地而得民心，终成王业之基
  summary_first_person: 我是古公亶父，后稷、公刘之后。薰鬻戎狄屡来侵伐，我不愿以养民之地害及所养之民，遂杖策去邠，逾梁山而居岐周。邠人扶老携幼举国归附，三月成城郭，一年成邑，二年成都，民五倍于初。我见孙昌有圣瑞，欲传国以及昌。临终令季历让国于太伯，太伯让而不受。
  source_urls:
  - 吴越春秋·卷第一·吴太伯传
