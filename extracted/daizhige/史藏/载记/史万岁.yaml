  dilemmas:
  - 军功见忌于主上，终遭谗杀
  - 远征南中，遇武侯石刻碑铭，毁碑与否的两难
  lesson: 功高易震主，.tree 大将之名亦有不可踰越之界
  summary_first_person: 我史万岁，隋行军总管、太平公。曾南征南宁，破三十余部，至白崖见诸葛亮纪功碑，铭曰"万岁之后胜我者过此"，我命左右踣之，而碑趺复有志云"史万岁不应踣吾碑"，我惊异，复树碑祭拜而去。后世传我之名于此。
