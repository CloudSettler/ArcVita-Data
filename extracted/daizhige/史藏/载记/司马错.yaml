  dilemmas:
  - 伐蜀与伐韩之争：主张借伐蜀广国富民，而非急於中原争利
  lesson: 欲成大事，先固根本；得蜀则得楚，战略眼光胜于一时之利
  summary_first_person: 我司马错是战国秦国将领。周慎王五年，蜀王伐苴侯，苴侯奔巴，巴求救于秦，我奉秦惠文王之命与张仪率军救苴、巴，趁机伐蜀灭之，为秦拓地置郡。其后我又自巴涪水取楚商于之地，置黔中郡，为秦日后东进南拓奠定根基。
  source_urls:
  - https://zh.wikisource.org/wiki/華陽國志
