  reign_ref: 前秦苻丕太平元年（386年）
  archetype: 军事枭雄
  dilemmas:
  - 远征西域功成之际，中原主君苻坚败亡，班师之后何所依归
  - 受前秦任命于危难之世，既要承制一方又须面对诸燕诸秦纷争
  lesson: 乱世之中，功业可以自西徼东来，然名位终须在群雄角力中自定。
  summary_first_person: 我本是苻坚麾下的安西将军，奉命远征西域。坚败于淝水、终为姚苌所害之后，我率得胜之师自西域还，于太平元年九月归来中原。苻丕随后拜我为车骑将军、梁州牧、酒泉公，我的基业由此而立。
  source_urls:
  - https://zh.wikisource.org/wiki/十六國春秋
