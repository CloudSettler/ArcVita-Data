  date: 0937
  year_of: 937
  date_precision: year
  summary: 交州矫公羡杀杨廷艺自立，吴权时为廷艺旧将，愤而起兵讨伐，谋取州治。
- id: guji-吴权-event-2
  person_id: guji-吴权
  type: endeavor
  date: 0938
  year_of: 938
  date_precision: year
  summary: 南汉主遣刘弘操率舟师来救公羡，吴权于白藤江口植大杙、设伏诱敌，乘潮退以舟师攻之，弘操败死，南汉军大溃。
- id: guji-吴权-event-3
  person_id: guji-吴权
  type: endeavor
  date: 0939
  year_of: 939
  date_precision: year
  summary: 白藤捷后，吴权称王，置百官、定朝仪，都于古螺，安南始自立为国。
- id: guji-吴权-event-4
  person_id: guji-吴权
  type: endeavor
  date: 0940
  year_of: 940
  date_precision: year
  summary: 权遣使通好南汉，以外交固自立之局，南汉终不复南侵。
- id: guji-吴权-event-death
  person_id: guji-吴权
  type: death
  date: 0944
  year_of: 944
  date_precision: year
  summary: 吴权卒于王位，在位六年，杨后兄弟争继，其子昌岌昌文后相继立。
