- id: guji-he-lv-event-recruit-wuzixu
  title_zh: 引用楚亡臣伍子胥
  date: -514
  year_of: -514
  precision: year
  desc_zh: 伍子胥奔吴，阖闾下阶迎唁，召上殿与语三日三夜，倾心听其教，号为谋主。
- id: guji-he-lv-event-build-city
  title_zh: 筑吴大城
  date: -514
  year_of: -514
  precision: circa
  desc_zh: 阖闾所造吴大城，周四十七里二百一十步二尺，陆门八水门八，徙治胥山。
- id: guji-he-lv-event-defeat-chu
  title_zh: 救蔡伐楚十五战十五胜
  date: -506
  year_of: -506
  precision: year
  desc_zh: 楚将伐蔡，子胥言之阖闾，即遣子胥救蔡而伐荆，十五战十五胜，一度破楚入郢。
- id: guji-he-lv-event-death
  title_zh: 与越交战伤指而卒
  date: -496
  year_of: -496
  precision: year
  desc_zh: 与越王勾践战于槜李，伤将指，卒；葬于阊门外虎丘。
- id: guji-he-lv-event-burial
  title_zh: 葬于虎丘
  date: -496
  year_of: -496
  precision: year
  desc_zh: 下池广六十步，铜椁三重，十万人筑治之，葬三日白虎居上，故名虎丘。
