events:
- id: guji-周娥皇-event-birth
  date: 0936
  year_of: 0936
  title_zh: 出生
  description: 约生于南唐时期，司徒周宗之长女，史称大周后。
- id: guji-周娥皇-event-marriage
  date: 0954
  year_of: 0954
  title_zh: 嫁与李煜
  description: 以美貌与才艺被选入宫，为李煜（时为王子）之妃。
- id: guji-周娥皇-event-enthroned
  date: 0961
  year_of: 0961
  title_zh: 立为皇后
  description: 李煜嗣位为南唐国主，册周氏为皇后，即大周后。
- id: guji-周娥皇-event-nishang
  date: 0963
  year_of: 0963
  title_zh: 重修《霓裳羽衣》曲
  description: 与后主考订残谱，复原并改编唐开元盛世之《霓裳羽衣》大曲，宫中上演，极一时之盛。
- id: guji-周娥皇-event-death
  date: 0964
  year_of: 0964
  title_zh: 病逝
  description: 幼子李仲宣夭折后哀伤病笃，旋卒，谥昭惠皇后；后主哀悼，作诔文悼之。
