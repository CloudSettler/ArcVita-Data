      raw: 生年史无明文，约生于南唐前期
    death:
      date: 0964
      precision: year
      is_circa: false
      raw: 乾德二年（附马令《南唐书·女宪传》相应记载年代）
  birth_date: 0936
  death_date: 0964
  era: 南唐
  reign_ref: 南唐后主李煜时期（保大至乾德年间）
  archetype: 才情 Hankering 宫廷才女与贤后
  dilemmas:
  - 身为皇后而沉溺歌舞声色，与辅助君主治国之责相冲突
  - 爱子夭折与缠绵病榻之间的哀恸
  lesson: 才艺足以传世，然纵情享乐伤身误政，盛极而衰可为借鉴。
  summary_first_person: 我周娥皇，通书史、善歌舞、尤工琵琶，以国色才艺得嫁South唐后主李煜为后。我与后主重修《霓裳羽衣》旧曲，宫中宴乐极一时之盛。然幼子夭折，我哀伤成疾，不久病逝，年未三十，谥昭惠皇后。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=5947
