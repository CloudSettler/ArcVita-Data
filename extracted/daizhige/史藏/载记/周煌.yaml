    title_zh: 书名不冠「中山」，恪遵印文，惟称《琉球国志略》
    rationale: 康熙元年颁赐王印印文止「琉球国王之印」六字，不称中山；今臣所续纂务从其实
  - date: 1757
    title_zh: 参订陈侃、郭汝霖、汪楫、徐葆光诸使录，析为十六卷十六目
    rationale: 前录条类繁多不相统系，稽考难于检阅；故定凡例、立目分卷，务求征信
