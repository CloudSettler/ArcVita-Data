  date: 1756-12
  year_of: 1756
  type: career
  title_zh: 奉旨充册封琉球副使
  description: 乾隆二十年十二月诏遣正使翰林院侍讲全魁、副使翰林院编修周煌赍诏敕册封琉球国中山王尚穆，并赐王及妃文币等物。
  source_refs:
  - 《琉球国志略·诏敕》
- id: guji-周煌-event-sacrifice
  date: 1756-07
  year_of: 1756
  type: milestone
  title_zh: 致祭海神兼谕祭故王尚敬
  description: 乾隆二十一年六月奉命谕祭海神，七月与正使全魁谕祭故琉球国中山王尚敬之灵。
  source_refs:
  - 《琉球国志略·谕祭文》
- id: guji-周煌-event-compilation
  date: 1757
  year_of: 1757
  type: milestone
  title_zh: 纂成《琉球国志略》十六卷
  description: 汇辑陈侃以下诸使录及史载琉球事实，参以亲见闻，析星野、国统、封贡、舆地等十六目为十六卷，并绘该国地图二幅。
  source_refs:
  - 《琉球国志略·凡例》
- id: guji-周煌-event-report
  date: 1758-01
  year_of: 1758
  type: milestone
  title_zh: 恭进《琉球国志略》
  description: 乾隆二十二年十二月十八日上奏恭进《琉球志略》，附地图二幅及《衔恩纪事韵语》二册，奉旨留览。
  source_refs:
  - 《琉球国志略·题奏》
