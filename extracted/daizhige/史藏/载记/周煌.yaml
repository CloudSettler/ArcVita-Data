  era: 清乾隆年间
  reign_ref: 乾隆
  archetype: 册封使臣·方志编纂者
  dilemmas:
  - 前使诸录传闻异辞、意存润饰，如何在严程匆遽之间订正征信而不铺张
  - 琉球国名与「中山」王号相沿不清，书名是否仍冠「中山」
  lesson: 务求征信、无事铺张，以耳目所及订正前录，方志之体足以坚藩服向化之忱
  summary_first_person: 我是周煌，西蜀人，由进士入翰林，官侍讲。乾隆二十一年奉命为副使，随全魁册封琉球国王尚穆，往返途次随时采辑，回京后分门比类，纂成《琉球国志略》十六卷，并绘具该国地图二幅，于乾隆二十二年十二月恭进御览。
  source_urls:
  - https://zh.wikisource.org/wiki/琉球国志略
