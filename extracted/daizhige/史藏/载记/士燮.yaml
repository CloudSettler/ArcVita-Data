person:
  qid: guji-士燮
  name_zh: 士燮
  names:
    zh: 士燮
    en: Shi Xie
  lifespan:
    birth:
      date: '0137'
      precision: year
      is_circa: true
      raw: 少游学京师，在治四十余年，魏黄初七年薨，寿九十
    death:
      date: '0226'
      precision: year
      is_circa: false
  birth_date: '0137'
  death_date: '0226'
  era: 东汉末至三国吴初
  reign_ref: 献帝建安中为绥南中郎将，吴封龙编侯
  archetype: 乱世保境的儒学郡守
  dilemmas:
  - 中原大乱而交州地远，是依附曹操汉室还是结好孙权以保境
  - 派质子、献珍宝向吴称臣，换取一郡安宁与家族权位
  lesson: 礼贤下士与务实周旋可在乱世中保全一方二十余年，然身死而子孙旋遭翦除
  summary_first_person: 我是苍梧广信人士燮，字彦威，少游学京师，好《左氏春秋》并为之作注。汉末天下乱离，我任交趾太守，谦恭下士，中原避乱者多往依我。献帝赐玺书，拜我为绥南中郎将。建安末我遣子入质于吴，并以珍宝遗孙权，被封为龙编侯。我处大乱之世，保全一郡二十余年，疆场无事，民皆乐业，出入鸣钟鼓吹，威震南蛮。魏黄初七年我薨，寿九十；其后子孙为吕岱所诛，合浦以北遂属广州。
  source_urls:
  - https://zh.wikisource.org/wiki/越史略/卷上
