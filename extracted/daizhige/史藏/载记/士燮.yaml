- id: guji-士燮-event-death
  date: '0226'
  year_of: '226'
  type: death
  title_zh: 士燮薨，寿九十
  desc: 魏黄初七年薨，寿九十，在治四十余年；孙权析合浦以北属广州，其后其子徽等发兵拒良，皆为吕岱所诛。
