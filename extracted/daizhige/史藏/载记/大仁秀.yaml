  era: 唐代渤海国
  reign_ref: 唐宪宗元和十三年（818年）即位，改元建兴，历穆宗、敬宗至文宗太和年间
  archetype: 中兴开疆之君
  dilemmas:
  - 简王幼薨、国统旁落，以从父之身份权知国务，须在内忧中稳固君位
  - 身处唐、契丹两强之间，既受唐册封称藩，又欲北略诸部扩展疆土
  lesson: 承继衰乱之局，专事经营，南征北略而开大境宇，终使渤海复称海东盛国
  summary_first_person: 我乃渤海宣王大仁秀，简王从父、高王弟野勃之四世孙。简王薨后我权知国务，元和十三年受唐册封为忽汗州都督渤海郡王。我南征新罗、北略诸部，开大境宇，改元建兴，数遣使朝唐通聘，使渤海之业中兴。
  source_urls:
  - 本地文本《渤海考·君考·宣王》
