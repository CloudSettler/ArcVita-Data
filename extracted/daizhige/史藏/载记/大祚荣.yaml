    rationale: 西邻契丹屡叛，须驻重兵捍卫西境。
events:
- id: guji-大祚荣-event-birth
  title_zh: 大祚荣出生
  summary: 生年史无明文，粟末靺鞨人。
  location: 高句丽
- id: guji-大祚荣-event-death
  date: 0718
  year_of: 718
  title_zh: 高王薨
  summary: 玄宗开元七年王薨，三月丙辰讣赴于唐。
  location: 忽汗城
- id: guji-大祚荣-event-brewing
  date: ~698
  year_of: 698
  title_zh: 随父东走度辽水
  summary: 契丹陷营州，父仲象与靺鞨酋乞四比羽率高句丽破部东走，保太白山之东北，阻奥娄河树壁自固；唐封仲象为震国公。
  location: 辽水东、奥娄河
- id: guji-大祚荣-event-tianmenling
  date: ~698
  year_of: 698
  title_zh: 天门岭大破唐军
  summary: 李楷固穷追度天门岭，祚荣引高句丽、靺鞨兵大破之，楷固仅以身免。
  location: 天门岭
- id: guji-大祚荣-event-founding
  date: ~698
  year_of: 698
  title_zh: 自立为震国王，筑忽汗城
  summary: 圣历中并乞四比羽之众，据东牟山筑忽汗城以居，国号震（一作振），地方五千里，户十余万，胜兵数万。
  location: 东牟山忽汗城
- id: guji-大祚荣-event-fengce
  date: 459
  year_of: 713
  title_zh: 受唐册为渤海郡王
  summary: 玄宗先天二年遣郎将崔忻册王左骁卫大将军渤海郡王，以所统为忽汗州、领都督，始去靺鞨号专称渤海；此前中宗时遣张行芰慰抚，王遣子入侍。
  location: 忽汗州
- id: guji-大祚荣-event-jiaotong
  date: ~698
  year_of: 698
  title_zh: 遣使交突厥、通聘诸方
  summary: 奚契丹叛唐道绝之顷，遣使交突厥，以图为国之外援。
  location: 忽汗城
- id: guji-大祚荣-event-lueding
  date: ~700
  year_of: 700
  title_zh: 略有扶余沃沮朝鲜海北十余国
  summary: 靺鞨及高句丽旧人悉归之，东穷海、西契丹、南接新罗以泥河为界，地方五千里，成海东强国。
  location: 扶余、沃沮、朝鲜诸地
