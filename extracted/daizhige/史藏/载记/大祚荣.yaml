    title_zh: 并比羽之众，据东牟山筑忽汗城自立
    rationale: 震国公卒、乞四比羽败死，部众无主，遂收其余众据险建国以自固。
  - date: ~698
    title_zh: 遣使交突厥
    rationale: 奚契丹叛唐、道路阻绝，武后不能致讨，故连突厥以为外援。
  - date: 459
    title_zh: 受唐册为渤海郡王，去靺鞨号专称渤海
    rationale: 借唐朝册封确立正统名分，换取国安，亦遣子入侍以示臣服。
