person:
  qid: guji-大祚荣
  name_zh: 大祚荣
  names:
    zh: 大祚荣
    en: Dae Joyeong
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年未详
    death:
      date: 0718
      precision: year
      is_circa: false
      raw: 玄宗开元七年王薨，三月丙辰赴唐
  death_date: 开元七年三月
  era: 唐代 · 渤海
  reign_ref: 渤海高王（自号震国王，后唐册渤海郡王）
  archetype: 开国雄主
  dilemmas:
  - 高句丽灭亡后率部众东走，面临唐军李楷固的追击，须以寡敌众自保自立
  - 介于唐、突厥、契丹诸强之间择交，既要抗唐自固又遣子入侍称臣纳贡
  lesson: 以散亡之余效力、凭山川形胜与合纵之策，亦足以雄视一方、开国建制。
  summary_first_person: 我本高句丽之人，随父震国公乞乞仲象徙居营州。契丹叛唐陷营州后，我东渡辽水，据天门岭之险大破唐将李楷固，遂并乞四比羽之众，筑忽汗城于东牟山，自立为震国王。后受唐册为渤海郡王，始专称渤海，遣使通突厥、朝献于唐，略定扶余沃沮诸国，地方五千里，为渤海开国奠基。
