      raw: 义熙十二年十二月丁未，兴疾甚…薨于殿，年五十三
  birth_date: '0366'
  death_date: 0416-12
  era: 东晋十六国·后秦
  reign_ref: 后秦第二位皇帝，年号皇初、弘始
  archetype: 守成之君
  dilemmas:
  - 面对弟弟广平公姚弼两次潜谋作乱，身为兄长与君主，如何在亲情与国法之间取舍
  - 其父姚苌缢杀苻坚夺位，兴需在承认前朝血债与稳固政权合法性之间权衡
  - 明言"攻克割据"之后，地方上的叛乱迭起，兴需征伐还是抚绥？
  lesson: 天下可以马上得之，不可马上治之——兴因广纳佛学与文教得一时之治，却也因姑息姚弼之乱埋下祸根
  summary_first_person: 我是姚兴，字子略，后秦武昭皇帝姚苌之少子。父皇驾崩时我秘不发丧，后于槐里即位，改元皇初。我先后击败苻登、攻取洛阳、降服吕隆，迎鸠摩罗什入长安讲经，弘始年间文教昌盛，与魏通和、四方称藩。然朕晚年体弱多病，胞弟广平公姚弼两次图谋作乱，朕虽怒而收之，终不忍致其死地，直至病势危殆时才责令自尽。朕在位十六年，谥文桓皇帝，庙号高祖。
  source_urls:
  - https://zh.wikisource.org/wiki/十六国春秋/卷五
