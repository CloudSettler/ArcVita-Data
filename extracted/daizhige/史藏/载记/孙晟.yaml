  archetype: 忠节使臣
  dilemmas:
  - 身为使臣勒石请和，受辱不屈，守节而死还是屈身求生
  - 出使后周面临割地削号之辱，国命与己身两难
  lesson: 使臣守节不辱命，虽死犹荣
  summary_first_person: 我孙晟仕南唐，官至司空。保大年间周师侵淮南，我两度奉使北上求成，削去帝号、请为外臣亦不得许。保大十四年冬，周人害我于汴，从者二百人皆死，独钟谟得免。我以一身殉国，全唐之节。
  source_urls:
  - 马令《南唐书·嗣主书》
