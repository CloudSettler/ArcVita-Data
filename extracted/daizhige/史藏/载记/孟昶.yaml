    death:
      date: '965'
      precision: year
      is_circa: false
  birth_date: '919'
  death_date: '965'
  era: 五代十国·后蜀
  reign_ref: 广政（938–965，后蜀后主年号）
  archetype: 末代守成之君
  dilemmas:
  - 强邻环伺：周师取秦凤、宋师伐蜀，拒周则兵祸将至，称藩则君父之辱
  - 纵承先父基业四十年温衣美食养士，临敌却无股肱爪牙，守土与保民难以两全
  lesson: 承平惰安、委政非人，虽府库充盈终不能御外侮；四十六日之亡，殷鉴在集权与用人。
  summary_first_person: 我孟昶继先君之业，据蜀近三十一年，改元广政。其间勒石经、铸铁钱、劝农置园，亦曾拒周抗宋；然王昭远误国，玄喸不武，宋师一至，剑门遂失。纳降入汴后不久而终，国祚随广政年号俱尽。
