    start_date: 955-11
    highlight_event_id: guji-孟昶-event-8
  decisions:
  - date: '951'
    title_zh: 下诏勒诸经于石
    rationale: 命张绍文、孙朋古诸人分写古经，以正文字，为后世成都石经之基础。
  - date: 953-06
    title_zh: 许母昭裔镂版印九经
    rationale: 宰相出私财百万营学馆、版印九经以颁郡县，从其请。
  - date: 955-11
    title_zh: 始铸铁钱
    rationale: 募兵既多用度不足，境内铁器以耑其利；民甚苦之，然国库赖以维持。
