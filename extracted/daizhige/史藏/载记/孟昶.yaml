  decisions:
  - date: 955-08-06
    title_zh: 命李廷珪为北路行营都统拒周师
    rationale: 周人入寇秦凤，遣将统宿卫军拒之；虽败，仍聚刍粟剑门白帝为守御备。
  - date: 964-11
    title_zh: 王昭远通并州约出兵北伐
    rationale: 张廷伟之议，欲令中原表里受敌以取关右；终发蜡丸书为彦韬所献，遂有宋师西讨之名。
  - date: 965-01-19
    title_zh: 命李昊草表请降
    rationale: 宋师已至魏城、汉州，败象既成，全府库、保军民，具礼纳降。
