person:
  qid: guji-孟知祥
  name_zh: 孟知祥
  names:
    zh: 孟知祥
    en: Meng Zhixiang
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: 934-07
      precision: month
      is_circa: false
      raw: 明德元年秋七月甲子帝寝疾而崩
  birth_date: ''
  death_date: 934-07
  era: 五代十国·后蜀（约874—934）
  reign_ref: 后蜀高祖，明德元年（934）称帝
  archetype: 割据开国之君
  dilemmas:
  - 后唐臣属与割据自保之间的抉择
  - 与东川董璋同盟共事后反目相攻
  lesson: 在乱世中借姻盟与实力并用以自固，然身后幼主继位、权臣跋扈，守成之难甚于取天下。
  summary_first_person: 我本北京留守，受庄宗之命入蜀平定后事，遂为西川节度使。后唐内乱，明宗猜忌，我斩监军李严，与东川董璋结秦晋之好，起兵争衡。其后击破董璋，并有两川，受唐册封为蜀王，终至文武劝进，即皇帝位，改元明德。即位数月而崩，传位于子仁贽（孟昶）。
  source_urls:
  - https://zh.wikisource.org/wiki/錦里耆舊傳
endeavors:
- id: guji-孟知祥-endeavor-1
  name_zh: 出镇西川
  phases:
  - key: brewing
    name_zh: 北都留守受任
    labels:
      zh:
      - 授剑南西川节度使
    start_date: 926-12
    highlight_event_id: guji-孟知祥-event-2
  - key: breakthrough
    name_zh: 入蜀主政
    labels:
      zh:
      - 至成都镇蜀
    start_date: 926
    highlight_event_id: guji-孟知祥-event-3
  decisions:
  - date: 926-12
    title_zh: 除授同中书门下平章事、充剑南西川节度使
    rationale: 郭崇韬被诛后蜀中动荡，庄宗（明宗）以懿戚重臣镇抚西川。
- id: guji-孟知祥-endeavor-2
  name_zh: 割据两川
  phases:
  - key: brewing
    name_zh: 斩监军自固
    labels:
      zh:
      - 斩李严
    start_date: 925-02
    highlight_event_id: guji-孟知祥-event-4
  - key: breakthrough
    name_zh: 联东川起兵
    labels:
      zh:
      - 与董璋结姻起兵
    start_date: 930
    highlight_event_id: guji-孟知祥-event-5
  - key: climax
    name_zh: 破璋并两川
    labels:
      zh:
      - 汉州之役
    start_date: 932
    highlight_event_id: guji-孟知祥-event-6
  - key: closure
    name_zh: 受封蜀王
    labels:
      zh:
      - 唐册封蜀王
    start_date: 932-08
    highlight_event_id: guji-孟知祥-event-7
  decisions:
  - date: 925-02
    title_zh: 斩两川监军使李严
    rationale: 明宗篡位，知祥以前朝懿戚心不自安，又察李严承安重诲密旨图己，遂斩之以绝朝廷罗网。
  - date: 925
    title_zh: 与东川董璋结秦晋之亲
    rationale: 厉兵秣马，唇齿相依，共抗朝廷削藩之谋。
  - date: 930
    title_zh: 两川起兵讨遂利阆等州
    rationale: 朝廷置军置镇窥觎两川，遂合兵十五万分路进讨，以自保而拓境。
- id: guji-孟知祥-endeavor-3
  name_zh: 称帝建蜀
  phases:
  - key: climax
    name_zh: 文武劝进
    labels:
      zh:
      - 即皇帝位改元明德
    start_date: 934
    highlight_event_id: guji-孟知祥-event-8
  - key: closure
    name_zh: 柩前传子
    labels:
      zh:
      - 遗制册孟昶
    start_date: 934-07
    highlight_event_id: guji-孟知祥-event-9
  decisions:
  - date: 934
    title_zh: 即皇帝位，改元明德，以赵季良为相
    rationale: 唐室衰乱、两川已定，群下劝进，遂开建元立政之业。
events:
- id: guji-孟知祥-event-2
  date: 926-12
  year_of: 926
  type: appointment
  name_zh: 北都留守孟知祥除同平章事、充剑南西川节度使
  detail: 甲戌，北都留守孟知祥除授同中书门下平章事充剑南西川节度使到府。
- id: guji-孟知祥-event-3
  date: 926
  year_of: 926
  type: milestone
  name_zh: 入蜀拜僖宗御容
  detail: 魏王以孟公至大慈寺拜僖宗御容，并令扫抹塑北方天王一身。
- id: guji-孟知祥-event-4
  date: 925-02
  year_of: 925
  type: decision
  name_zh: 斩两川监军使李严
  detail: 天成二年二月己亥，川主斩监军使李严，自此方思割据、厉兵秣马。
- id: guji-孟知祥-event-5
  date: 930-09
  year_of: 930
  type: campaign
  name_zh: 两川起兵讨遂府利阆并黔夔等州
  detail: 长兴元年秋，与东川点检马步军十五万骑分路往讨，收阆州、夔州、利州、遂州。
- id: guji-孟知祥-event-6
  date: 932-04
  year_of: 932
  type: battle
  name_zh: 东川董璋拥兵来袭，败亡于汉州
  detail: 夏四月，董璋来攻至汉州，昭武军节度使赵廷隐讨平之，董璋父子被枭斩。
- id: guji-孟知祥-event-7
  date: 932-08
  year_of: 932
  type: honors
  name_zh: 唐国进封蜀王、行墨制
  detail: 七月唐册封蜀王，加食邑，改赐忠贞匡国保大功臣；八月下令行墨制以布鸿恩。
- id: guji-孟知祥-event-8
  date: 934-04
  year_of: 934
  type: accession
  name_zh: 即皇帝位，改元明德
  detail: 夏四月文武劝进即皇帝位，大赦改唐长兴五年为明德元年，以赵季良为相，分掌军权。
- id: guji-孟知祥-event-9
  date: 934-07
  year_of: 934
  type: death
  name_zh: 寝疾而崩，葬和陵，庙号高祖
  detail: 秋七月甲子帝寝疾而崩，遗制册元子昶于柩前即皇帝位。
