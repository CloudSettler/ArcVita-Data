person:
  qid: guji-宋齐丘
  name_zh: 宋齐丘
  names:
    zh: 宋齐丘
    en: Song Qiqiu
  era: 五代十国·南唐
  reign_ref: 南唐烈祖昇元、元宗保大年间
  archetype: 谋臣宰辅
  dilemmas:
  - 预判徐知训必败而劝李昪赴乱定局
  - 力谏复姓李氏，助烈祖正唐统
  - 元宗欲传位景遂，上书切谏
  lesson: 识势于未乱，言进于未听
  summary_first_person: 我以策士之身佐烈祖起于淮南，知训之败我先见之；及建国，历左丞相、平章事，力主复姓李氏以承唐统。元宗朝我屡登台辅，亦屡遭黜罢，虽位至太傅中书令，进退之间，常在权力潮头。
  source_urls:
  - https://zh.wikisource.org/wiki/南唐書_(馬令)/卷一
