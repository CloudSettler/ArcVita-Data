    start_date: '1123'
    highlight_event_id: guji-完颜晟-event-succession
  decisions:
  - date: '1123'
    title_zh: 依祖制继位，沿用太祖旧制
    rationale: 世宗旧制，兄弟相传，周而复始；金初立国，国基未稳，以弟承兄可安人心。
- id: guji-完颜晟-endeavor-2
  name_zh: 灭辽破宋，混一天下之半
  phases:
  - key: brewing
    name_zh: 遣将备兵
    labels:
      zh:
      - 陕府两路
    start_date: '1124'
    highlight_event_id: ''
  - key: breakthrough
    name_zh: 灭辽掳天祚
    labels:
