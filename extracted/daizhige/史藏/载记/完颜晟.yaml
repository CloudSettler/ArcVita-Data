person:
  qid: guji-完颜晟
  name_zh: 完颜晟
  names:
    zh: 完颜晟
    en: Wanyan Sheng
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: ''
    death:
      date: '1135'
      precision: year
      is_circa: false
      raw: 天会十三年（1135）卒
  birth_date: ''
  death_date: '1135'
  era: 金朝
  reign_ref: 金太宗，天会年间（1123—1135）在位
  archetype: 继承皇位、灭辽侵宋的开国之君弟
  dilemmas:
  - 兄终弟及的祖制与传子之私的冲突
  - 灭辽之后是否乘胜伐宋
  lesson: 承兄业而灭辽破宋，然终不能挣脱兄终弟及祖制的束缚，身前立储亦须思归朝廷。
  summary_first_person: 我完颜晟，金世祖之子、太祖阿骨打之弟，以吴乞买之号承继大统。天会年间，我遣将俘天祚、掳徽钦，灭辽侵宋，拓地中州；然立储须循祖宗之法，终以兄终弟及白ridge身，而崩于会宁。
  source_urls:
  - https://zh.wikisource.org/wiki/大金国志
endeavors:
- id: guji-完颜晟-endeavor-1
  name_zh: 继承帝位与稳定金初政权
  phases:
  - key: brewing
    name_zh: 早受重用
    labels:
