      - 俘天祚帝
    start_date: '1125'
    highlight_event_id: guji-完颜晟-event-liaofall
  - key: climax
    name_zh: 侵宋掳二帝
    labels:
      zh:
      - 靖康之变
    start_date: '1126'
    highlight_event_id: guji-完颜晟-event-songcaptured
  - key: closure
    name_zh: 立制度安中原
    labels:
      zh:
      - 立张邦昌、刘豫
    start_date: '1130'
    highlight_event_id: ''
  decisions:
  - date: '1125'
    title_zh: 乘灭辽之势，发兵两路伐宋
    rationale: 契丹已亡，宋弱可图；完颜宗望、宗翰力主南侵，遂分东西两路以夺中原。
  - date: '1130'
    title_zh: 立刘豫为帝，建伪齐以治中原
    rationale: 中原广土，金力未及遥制，立藩辅以慑宋人、靖盗贼、免劳师。
