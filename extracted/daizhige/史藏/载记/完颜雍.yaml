  era: 金代
  reign_ref: 金世宗，年号大定
  archetype: 中兴之主
  dilemmas:
  - 在海陵王暴政下隐忍自保，伺机而动，需权衡忠节与存身
  - 即位后面临南北并用、稳定内政与对宋和战的两难
  lesson: 蹈晦待时而后发，施仁政、惜赦宥，方成大定之治
  summary_first_person: 我完颜雍，金室宗室之才，先在海陵王治下韬晦自全，后于辽阳即位为帝。即位数年间虽降三赦，务以宽仁治世，改元大定，偃武修文，使金国得享中兴之治。
  source_urls:
  - https://zh.wikisource.org/wiki/大金國志
