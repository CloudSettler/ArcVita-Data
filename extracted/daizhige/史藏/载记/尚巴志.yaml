  archetype: unifier
  dilemmas:
  - 兼并山南、山北三国，需在武力扩张与维持对明朝贡宗藩关系之间取得平衡
  lesson: 统一需要审时度势、整合各方势力，并以对上恭顺换取承认为代价
  summary_first_person: 我于永乐年间先后覆灭山北、山南两国，将琉球复归一统。为求 radio 中朝的承认， 我以中山之名遣使进贡，终得受封为一国之主，定都那霸，为琉球尚氏王朝奠定基业。
