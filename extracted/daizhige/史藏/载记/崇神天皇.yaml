person:
  qid: guji-崇神天皇
  name_zh: 崇神天皇
  names:
    zh: 崇神天皇
    en: Emperor Sujin
  lifespan:
    birth:
      date: '-0162'
      precision: year
      is_circa: true
      raw: 开化天皇第二子，生年无考，约前二世纪
    death:
      date: (-0030)-01
      precision: year
      is_circa: true
      raw: 在位六十八年崩，生卒年俱传说
  birth_date: '-0162'
  death_date: '-0030'
  era: 日本上古（记录时代，约当西汉）
  reign_ref: 开化天皇之后，御肇国天皇
  archetype:
  - 创制立国的奠基君主
  - 祭政一体的神圣王者
  dilemmas:
  - 四方未统，邑村相陵，如何扫荡诸豪族以定一尊
  - 神器奉祀之地屡迁，如何安置天照太神以安国本
  - 民未习征调，如何课户定籍而不激起反乱
  lesson: 崇神之世，校户课役、造船开沟、巡察四方，始有国家规制，故号御肇国天皇；虽史多传说，其整理内治、重神道、奉神器之功，为后世立国规模之始。
  summary_first_person: 我是崇神天皇，讳御间城入彦五十琼殖，开化天皇第二子。我即位元年当汉武帝天汉四年。我崇重神道，奉神器于大和笠缝邑，遣使将兵巡察北陆东海及西国丹波，始校户数、课男女调役，造舟船、开沟洫。在位六十八年崩，号曰御肇国天皇。后世谓我立国始有规模，或疑徐福东渡之遗党当政于此时，然考我朝九代无事足纪，我实为肇建邦基之君。
  source_urls:
  - https://zh.wikisource.org/wiki/日本国志/卷一
