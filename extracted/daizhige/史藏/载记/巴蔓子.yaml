  death_date: 约-320
  era: 战国
  reign_ref: 周之季世
  archetype: 忠信守土的悲情将军
  dilemmas:
  - 借楚师平乱而许以三城，事后违约失信与失地保国的两难
  - 以自刎献头守诺，殉身成全国土与信义
  lesson: 舍身守信，城可不予而头可谢之，忠义两全
  summary_first_person: 我为巴国将军，国乱时借楚兵平难，许楚三城。乱平楚索城，我不忍割土，愿以吾头谢楚王，遂自刎授首。楚王以上卿礼葬吾头，巴国亦以上卿礼葬其身。
  source_urls:
  - https://zh.wikisource.org/wiki/華陽國志
