  type: endeavor
  date: '1159-12-01'
  year_of: '1159'
  era_zh: 平治之乱
  summary_zh: 帝逃出平清盛第，平氏以兵迎入其第，清盛途闻变与子重盛决议讨贼，诱贼出大内，信赖、义朝皆诛死，义朝诸子尽为平氏所捕杀，惟赖朝免死流于伊豆
  participants:
  - guji-平清盛
- id: guji-平清盛-event-升太政大臣
  type: endeavor
  date: '1167-01-01'
  year_of: '1167'
