person:
  qid: guji-平清盛
  name_zh: 平清盛
  names:
    zh: 平清盛
    en: Taira no Kiyomori
  lifespan:
    birth:
      date: '1118'
      precision: year
      is_circa: true
      raw: 约生于平安后期（古文未载，据史通说）
    death:
      date: '1181'
      precision: year
  birth_date: '1118-01-01'
  death_date: '1181-01-01'
  era: 平安时代后期
  reign_ref: 保元之乱、平治之乱及平氏专权时期
  archetype: 武家权臣
  dilemmas:
  - 保元之乱中，叔父平忠政从崇德上皇，清盛选择从后白河天皇，遂弑叔父
  - 平治之乱中，义朝之子赖朝当诛，其母乞怜，放免流之伊豆
  - 权势极盛时与后白河法皇相争，其子重盛固谏幽禁法皇之事
  lesson: 外戚专权、刑赏自专，威福过盛则举国兵马半属敌家，终并为源氏所灭
  summary_first_person: 我以平氏之兵，保元间从后白河帝攻白河殿，平治间又讨信赖、义朝，遂尽诛义朝诸子而进官爵。立我妹之子为太子，升太政大臣，同姓为公卿者十六人，威福过于藤原氏。我幽法皇、贬诸藤原、独决朝政，又立外孙安德帝。及以仁王下令、源氏响应，我遣兵东讨不胜，遗戒子弟力讨赖朝而寻薨。
