    title_zh: 纳源义朝婢三人免其死
    rationale: 其母殊色，清盛纳之，因亦得免；赖朝则由清盛之母为尼者悯之
  - date: '1180-01-01'
    title_zh: 遣追讨使东击源氏
    rationale: 以仁王下令东国发源氏，源氏所在响应
