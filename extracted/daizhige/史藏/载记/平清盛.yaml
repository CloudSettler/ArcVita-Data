  summary_zh: 以仁王下令东国讨平氏败死，源赖朝、源义仲各奉令起兵，清盛大惊，遣追讨使东击之不胜，及是薨，遗戒子弟力讨赖朝
  participants:
  - guji-平清盛
- id: guji-平清盛-event-death
  type: death
