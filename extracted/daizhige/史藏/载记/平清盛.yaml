  - date: '1167-01-01'
    title_zh: 接受从一位太政大臣
    rationale: 后白河纳平清盛妹生宪仁立为太子，平氏始以外戚摄政
  - date: '1179-01-01'
    title_zh: 幽法皇于鸟羽并贬诸藤原氏官爵
    rationale: 法皇游宴自如，与成亲共议图灭平氏事泄，清盛积怒遂专恣
