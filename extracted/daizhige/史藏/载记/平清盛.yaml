  summary_zh: 寻升清盛从一位太政大臣，平氏始以外戚摄政；清盛专恣，同姓为公卿者十六人，得升殿者十余人，为卫府国司者六十余人，其采地半海内，威福过于藤原氏
  participants:
  - guji-平清盛
- id: guji-平清盛-event-幽法皇
  type: endeavor
  date: '1179-01-01'
  year_of: '1179'
  era_zh: 治承末年
  summary_zh: 重盛卒未数日，清盛即遣宗盛率兵幽法皇于鸟羽，前因重盛固谏而止；又讽高仓帝让位于太子言仁，遂立安德帝，清盛决事
  participants:
  - guji-平清盛
- id: guji-平清盛-event-东讨不胜寻薨
  type: endeavor
