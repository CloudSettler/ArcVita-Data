  birth_date: '0754'
  death_date: 0808-07
  era: 唐代宗—唐宪宗时期南诏君主
  reign_ref: 大历十三年（778）即位，改元见龙、上元，元和三年（808）卒
  archetype: 弃暗投明、复归中原的边地之君
  dilemmas:
  - 苦吐蕃征求无厌，又惧唐不容，进退两难
  - 韦皋遣使致书，吐蕃疑之，索南诏大臣为质
  - 点苍山夜盟时吐蕃使者尚在其境，杀之则绝归路，不杀则事泄
  lesson: 唯有审时度势、认祖归宗，方能以文化认同化干戈为玉帛
  summary_first_person: 我本南诏王孙，继立为君，先附吐蕃而受其苦役。书生郑回劝我归唐，韦皋致书相招，我遂与唐使夜盟于点苍山下，斩吐蕃使者，弃赞普钟之号。后奉诏袭吐蕃，破神川铁桥，献捷纳贡，天子册我云南王，赐贞元金印。我遣子弟入蜀就学，进奉圣乐，岁贡方物，与唐世修盟好，终保云南安宁三十年。
  source_urls:
  - guji://nanzhaoyeshi/yimouxun
