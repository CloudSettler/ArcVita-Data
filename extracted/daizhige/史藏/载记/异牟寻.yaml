  location_zh: 大厘城
  summary: 兴元元年牟寻迁大厘城，改号大理国，封五岳四渎，立三皇庙，设九爽三托，划定疆界八分之地。
- id: guji-异牟寻-event-dali-title
  date: 0784
  year_of: 0784
  title_zh: 封五岳四渎，建神祠
  kind: cultural
  actors:
  - guji-异牟寻
  location_zh: 南诏
  summary: 以点苍山为中岳，乌龙、蒙乐、高黎贡、雪山为东西南北岳，金沙、兰沧等江为四渎，各建神祠，立三皇庙。
- id: guji-异牟寻-event-zhenghui-advise
  date: 0787
  year_of: 0787
  title_zh: 郑回说寻归唐，寻决计背蕃
  kind: political
  actors:
  - guji-异牟寻
  - 郑回
  - 韦皋
  location_zh: 大理城
  summary: 牟寻居大理城，命子弟师事郑回；因苦吐蕃征求无厌，郑回因韦皋招抚之势劝其归唐，寻然之，蕃使征兵则谢绝。
- id: guji-异牟寻-event-cangshan-alliance
  date: 0790
  year_of: 0790
  title_zh: 夜迎崔佐时于点苍山下会盟，斩蕃使去僭号
  kind: diplomatic
  actors:
  - guji-异牟寻
  - 崔佐时
  - 韦皋
  location_zh: 点苍山
  summary: 韦皋遣崔佐时报聘，寻令蕃使更衣避之，夜迎唐使；佐时宣诏，令斩蕃使、去所立之号，寻遂与盟于点苍山下。
- id: guji-异牟寻-event-shenchuan-victory
  date: 0793
  year_of: 0793
  title_zh: 以三千应蕃而阴将数万，神川破吐蕃，断铁桥取十六城
