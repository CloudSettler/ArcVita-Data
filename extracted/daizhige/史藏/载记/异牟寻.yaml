  actors:
  - guji-异牟寻
  - 凑罗栋
  - 尹仇宽
  location_zh: 神川铁桥
  summary: 吐蕃征兵，寻阳示寡弱以兵三千应，自将数万踵后，正月袭蕃，断铁桥，取十六城，俘五王，降众十余万。
- id: guji-异牟寻-event-yuanzeng-seal
  date: 0794
  year_of: 0794
  title_zh: 袁滋持节册封南诏王，王北面跪受贞元金印
  kind: diplomatic
  actors:
  - guji-异牟寻
  - 袁滋
  - 韦皋
  location_zh: 南诏
  summary: 寻遣弟献捷并献地图、纳贡及蕃印，请复号南诏；唐以袁滋为册使，赐贞元册南诏印，王北面跪受，宴使出龟兹乐二乐工。
- id: guji-异牟寻-event-hostage-study
  date: 0798
  year_of: 0798
  title_zh: 请质子弟于朝，就学成都
  kind: cultural
  actors:
  - guji-异牟寻
  - 韦皋
  location_zh: 成都
  summary: 贞元十四年请以大臣子弟质于朝，韦皋初却，固请，乃尽舍成都遣就学，此后比年贡方物，唐帝深礼之。
- id: guji-异牟寻-event-die
  date: 0808-07
  year_of: 0808
  title_zh: 异牟寻卒，在位三十年，子寻阁劝立
  kind: death
  actors:
  - guji-异牟寻
  location_zh: 南诏
  summary: 元和三年七月卒，唐遣使祭吊，追谥孝桓王；在位三十年，子寻阁劝嗣位，蒙氏三世事唐唯谨之局得以延续。
