  name_zh: 张道古
  names:
    zh: 张道古
  lifespan:
    birth:
      date: 0855
      precision: decade
      is_circa: true
      raw: 生年未载，约唐宣宗末年
    death:
      date: 0909
      precision: year
      is_circa: false
      raw: 前蜀武成二年三月，卒于贬所途中（灌州奏闻）
  birth_date: 约855年
  death_date: 909年
  era: 唐末—前蜀
  reign_ref: 唐僖宗、唐昭宗、前蜀高祖王建
  archetype: 直谏孤臣
  dilemmas:
  - 明知再谏必贬，仍向王建上诗重述二乱五危七事
  - 唐室已亡而王建称帝，受召出仕与“唐室谏臣”身份相冲突
  lesson: 忠于故国者宁伏死不毛之地，不为新朝屈膝
  summary_first_person: 我本是唐室谏臣，屡上疏直言二乱五危七事，两遭贬黜；王建闻我之名召为判官，及他开国再用我，我自知终必再贬，行至玉垒关便嘱亲故葬我于关东不毛之地，题“唐左补阙张道古”之墓。后来果然再贬茂州，我死在路上，守住了不事二姓的心。
