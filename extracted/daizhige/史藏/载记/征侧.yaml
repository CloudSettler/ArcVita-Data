  archetype: 起义领袖
  dilemmas:
  - 身为雒将之女、土官之妻，面对太守苏定「绳之以法」，是隐忍还是举兵反抗
  - 起兵略定六十五城、自立为王后，还要面对汉朝大军压境的存亡抉择
  lesson: 一介女子因怨愤而举兵，能席卷六十五城、称王一方，可见民心向背与边吏苛政之力量；然无持久之备，终难敌帝国之师。
  summary_first_person: 我是麊泠县人征侧，雒将之女，嫁与诗索。太守苏定以法绳我，我愤而起兵，与妹征贰举峰州之众，九真、日南皆应，略定南外六十五城，自立为王，都麊泠。建武十七年，汉拜马援为伏波将军来击，十八年战于浪泊，我不敌退保禁溪，十九年困极出走，为马援所杀。汉人遂立铜柱为界，分封溪、望海二县。
