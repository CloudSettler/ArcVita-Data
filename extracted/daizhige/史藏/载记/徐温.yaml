  era: 唐末五代十国
  reign_ref: 吴国大丞相、都督中外诸军事，追尊义祖
  archetype: 权臣
  dilemmas:
  - 专掌吴政而终身不称帝，养子徐知诰（李昪）后来篡吴建南唐
  - 亲子徐知训骄横被杀，续以养子知诰执政，亲子与养子之争
  lesson: 权柄虽盛，传承难定；养子继政，终移国祚
  summary_first_person: 我是徐温，杨行密麾下谋主，初为牙将，后与张颢共执吴政。弑张颢独秉国柄，养徐知诰为子，使其掌政，我身居金陵遥制朝权，诸子知训、知询、知诲、知谏各有分任。终身未易杨氏之鼎，而我徐氏之势已固，吴之政柄实归于我。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=xxxx
