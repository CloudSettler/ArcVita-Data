person:
  qid: guji-徐温
  name_zh: 徐温
  names:
    zh: 徐温
    en: Xu Wen
  lifespan:
    birth:
      date: 0862
      precision: year
      is_circa: true
      raw: 生年不详，约晚唐
    death:
      date: 0927-11
      precision: month
      is_circa: false
      raw: 义祖晚有气疾……将殂之夕，气暴作……而绝
  birth_date: 约0862
  death_date: 0927
  era: 晚唐五代十国・吴国权臣，追尊义祖
  reign_ref: 吴国大丞相／都统，封齐王；死后烈祖追上尊号义祖
  archetype: 沉毅枭雄・权臣养父
  dilemmas:
  - 养子知诰（烈祖）终威胁亲子知询之位，忍而不除
  - 废弑君主以专吴政，与维护杨氏名义之间的张力
  - 诛张颢夺权后面对武王勋旧不服， 李遇之反即其果
  lesson: 权柄可以夺于一时， 名位与人心须以名分与忍让徐图， 然夺位之局终反噬其子孙。
  summary_first_person: 我是徐温， 吴武王的裨将出身， 以刚毅寡言著称， 人目为徐嗔。我与张颢先弑景王， 后又诛颢专淮南军政， 平李遇以慑诸将， 出镇建康而令亲子知训留扬州， 知训败后我举养子知诰居中任事。我权虽重而名位卑，
    遂请建国封齐王、自为都统；唐庄宗来诏， 我以敌国之礼拒之。我深知知诰终为己害， 然彼事我以孝， 终不忍除。晚年苦气疾， 一夕暴发而殂。
  source_urls:
  - https://zh.wikisource.org/wiki/江南别录
