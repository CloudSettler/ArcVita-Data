  dilemmas:
  - 求仙之请实为避祸渡海，志不在小
  - 上书求童男女渡海，成则无大利，败则诛
  lesson: 假求仙之名，行殖民拓海之实，识时势者能转虚言为实功
  summary_first_person: 我乃秦时方士徐福，因齐地滨海久传海上三神山之说，遂上书始皇，请遣童男童女三千人入海求仙，终率船队东渡，相传居日本熊野浦，纪伊国有徐福祠，熊野山有徐福墓，即其遗迹。
  source_urls:
  - https://zh.wikisource.org/wiki/日本国志
