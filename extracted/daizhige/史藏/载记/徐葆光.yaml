    en: Xu Baoguang
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详，清康熙年间在世
  era: 清·康熙
  reign_ref: 康熙
  archetype: 册封使臣·地理学者
  dilemmas:
  - 使期促迫、见闻易讹，须在前人诸录“荒略舛漏”与亲历目验之间求“传信”之实
  - 采用民间商舶充封舟、不置副柁，须在节省官帑与渡海安全之间决断
  lesson: 得之传闻不如目见之真；考信求实，方能纠正群书之谬
  summary_first_person: 我以翰林院编修奉使琉球为册封副使，留中山八月，遍游山海、考其制度礼仪，与陪臣往复证订，归而撰《中山传信录》六卷，正针路、志山川物产，欲以传信垂后。
  source_urls:
  - 全篇文本：《中山传信录》清·徐葆光撰（汪士鋐序、自序及卷一）
