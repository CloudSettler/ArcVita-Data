  decisions:
  - date: 1719
    title_zh: 采用民间商舶二艘充封舟，不另造新舟
    rationale: 取浙甯民间巨舶，大小相埒而费轻办速，杜绝历来造舟骚动夫役、奸吏假手之弊
  - date: 1719
    title_zh: 一号封舟采用西洋夹板柁，不置副柁
    rationale: 西洋造法最坚稳，柁重万斤船中无处可置，故与闽中有司力争而竟不置副柁
  - date: 1719
    title_zh: 先致语国王，求示《中山世鉴》及山川图籍
    rationale: 证之史牒、去疑存信，以求见闻互证、得其实
events:
- id: guji-徐葆光-event-ship
  date: 1719
  year_of: '1719'
  title_zh: 督臣移檄选浙江民间商舶二艘充封舟
  description_zh: 册封命下未到闽前，闽浙总督满保移檄各镇选大船修葺备用，二船取自宁波府属民间商舶，封舟之费轻而办速，前所未有
  participants:
  - guji-徐葆光
- id: guji-徐葆光-event-voyage
  date: 1719-06-20
  year_of: 康熙五十八年五月
  title_zh: 自福州五虎门放洋渡海赴琉球
  description_zh: 五月二十日奉诏敕升舟，谕祭海神后出五虎门放洋，用乙辰、乙卯诸针，历鸡笼、花瓶、彭家诸山而行
  participants:
  - guji-徐葆光
- id: guji-徐葆光-event-stay
  date: 1719-06
  year_of: 康熙五十八年六月
  title_zh: 至琉球留中山八月，遍游山海考订见闻
  description_zh: 己亥六月朔至国，候汛逾年，在中山凡八阅月；封宴之暇求示《中山世鉴》及山川图籍，与通文字译词之大夫遍游山海，考制度、观风问俗、询得一物异状之实
  participants:
  - guji-徐葆光
- id: guji-徐葆光-event-return
  date: 1720-02-16
