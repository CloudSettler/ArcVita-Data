  title_zh: 自琉球那霸港放洋归福州
  description_zh: 庚子二月十六日启行，由姑米山取温州南杞山，循针路乘东北风归福州
  participants:
  - guji-徐葆光
- id: guji-徐葆光-event-book
  date: 1721-08
  year_of: 康熙六十年八月
  title_zh: 撰成《中山传信录》并自序
  description_zh: 编海行针道、封宴诸仪、山川辖属、风俗物产图状并列，为六卷，康熙六十年秋八月翰林院编修臣徐葆光谨序
  participants:
  - guji-徐葆光
