    en: Xu Kai
  lifespan:
    birth:
      date: 0920
      precision: year
      is_circa: true
      raw: 约生于唐末天祐年间（约920年）
    death:
      date: 0975
      precision: year
      is_circa: false
  birth_date: 0920
  death_date: 0975
  era: 五代十国·南唐
  reign_ref: 南唐烈祖升元、元宗保大、交泰，后主时期
  archetype: 学者型文臣
  dilemmas:
  - 生于 南唐国小势弱之世，抱文才忠节而不能救社稷之将倾
  - 兄徐铉仕宋而己死节于国亡之际，出处去就之间的士节抉择
  lesson: 文武才业、忠节声华可以炳耀一时，然大廈将倾，孤忠能否免于覆巢？
  summary_first_person: 我徐锴，南唐文臣学者，与兄铉并有文名，时称二徐。我以文翰事烈祖、元宗、后主三世，著述严谨，忠节声华炳耀一时。然国势日蹙，宋师压境，金陵将陷，我以身属故国，不肯背李氏而仕新朝，遂以忧愤卒于国亡之际。
  source_urls:
  - https://www.gujidb.com/nantangshu/preface
