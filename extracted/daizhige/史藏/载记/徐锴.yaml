- id: guji-徐锴-event-loyal-service
  event_type: career_milestone
  date: 0961
  year_of: 961
  is_circa: true
  summary_zh: 后主即位，徐锴复以其贤才与文翰沉稳见重，佐其后主及国政论议。
- id: guji-徐锴-event-death
  event_type: death
  date: 0975
  year_of: 975
  is_circa: true
  summary_zh: 宋师围金陵，国将亡，徐锴以忧愤卒，未几金陵陷落，南唐亡。
