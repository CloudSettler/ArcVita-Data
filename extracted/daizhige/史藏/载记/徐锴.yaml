- id: guji-徐锴-event-career-start
  event_type: career_start
  date: 0940
  year_of: 940
  is_circa: true
  summary_zh: 徐锴入仕南唐，以文翰事烈祖，初为秘书省末职。
- id: guji-徐锴-event-scholarship
  event_type: achievement
  date: 0955
  year_of: 955
