  - guji-丰臣秀吉
- id: guji-德川家康-event-defeat-longqiu
  date: ''
  year_of: 1584
  type: endeavor
  title_zh: 败后与和，秀吉许共定天下
  description: 秀吉与之和，曰吾将与之定天下以救亿万生灵；家康谬为恭敬，媚事秀吉，尝于朝会亲为整履，秀吉卒时握手托遗孤。
  participants:
  - guji-德川家康
  - guji-丰臣秀吉
- id: guji-德川家康-event-battle-sekigahara
  date: ''
  year_of: 1600
  type: battle
  title_zh: 关原之战大破石田三成
  description: 家康方攻景胜，闻三成举兵，引军还，遂与三成战于关原，大破之，捕斩三成，削毛利辉元八国，流浮田秀家于八丈岛。
  participants:
  - guji-德川家康
  - guji-石田三成
- id: guji-德川家康-event-shogun-edo
  date: ''
  year_of: 1603
  type: endeavor
  title_zh: 任征夷大将军，开府江户
  description: 令德川家康等五大老辅嗣子秀赖，家康任征夷大将军，开府江户，大封诸侯，行赏立制，课诸侯筑江户、骏府，命诸侯妻子住江户，间一岁交代就国，禁西诸侯造战舰，开长崎港通商。
  participants:
  - guji-德川家康
- id: guji-德川家康-event-fall-osaka
  date: ''
  year_of: 1615
  type: endeavor
  title_zh: 攻破大坂，灭丰臣氏
  description: 家康以钟铭语涉咒诅为名举兵攻大坂，城破，秀赖母子不知所终，庶子捕斩于六条碛，丰臣氏遂亡。
  participants:
  - guji-德川家康
  - guji-丰臣秀赖
- id: guji-德川家康-event-death
  date: ''
  year_of: 1616
  type: death
  title_zh: 家康定法制后寻薨
  description: 家康定文臣法五章、廷式十七章、武员式十二章，置老中，定幕府及列国制度，灭丰臣氏，寻薨。
  participants:
  - guji-德川家康
