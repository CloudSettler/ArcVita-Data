  archetype: 隐忍开国之雄
  dilemmas:
  - 忍辱事秀吉以求存，还是举兵争天下
  - 辅丰臣遗孤秀赖，还是取而代之成就德川氏基业
  lesson: 隐忍蓄势、审时度势，方能以少力成大业
  summary_first_person: 我起于参河，败于长湫而能与秀吉和，虚心媚事，亲为整履，受托遗孤。后于关原大破石田三成，居骏府以制大坂，终灭丰臣氏，任征夷大将军，开府江户，定法制、封诸侯、开长崎通商，奠定江户幕府二百余年太平之基。
