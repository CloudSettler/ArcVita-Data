  birth_date: 约-156
  death_date: 约-110
  era: 西汉
  reign_ref: 汉景帝、汉武帝时人
  archetype: 兴学劝教的地方良守
  dilemmas:
  - 承秦之后学校陵夷，蜀地蛮夷之风与儒化之难
  - 以官费遣士东游受经，郡财有限与人材培育之取舍
  lesson: 兴办学校、遣士受经，可移风易俗，使一方文教比于齐鲁
  summary_first_person: 我是文翁，庐江人。景帝末年我为蜀郡守，见蜀承秦之后学校衰废，便穿湔江口灌田千七百顷以裕民，又立学于成都，选吏弟子就学，遣张叔等十八人东诣博士受七经，学成归来教授。学徒鳞萃，蜀学比于齐鲁，巴、汉亦立文学。景帝嘉之，令天下郡国皆立文学，因我倡其教，蜀为之始也。我曾立文学精舍、讲堂，作石室于城南，后世虽火毁而屡修，蜀之文风由此而兴。
  source_urls:
  - https://zh.wikipedia.org/wiki/文翁
