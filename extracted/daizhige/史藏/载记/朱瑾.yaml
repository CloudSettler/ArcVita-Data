  era: 唐末五代（杨吴）
  reign_ref: 杨吴（杨渥、杨渭在位时期）
  archetype: 蒙冤而刚烈自处的名将
  dilemmas:
  - 家族之好遭背叛：知客与朱知训私通，辱及己身，隐忍还是发难
  - 被排挤出知训别迁历阳，是将行就道还是密图反击
  - 击杀知训后杨氏闭门不纳，是负罪待命还是出逃
  lesson: 忍辱可蓄势，刚烈能诛仇，然孤忠无援者终难自全
  summary_first_person: 我朱瑾乃杨氏名将，与徐知训有通家之好，岂料其与我家知客私通。事泄后知训惧我生变，排我出知历阳。临别宴上我以手板击杀之，提其首以见杨氏，然杨氏闭门不纳，我逾城而出，坠城折足，遂自刭而死，吴人暴我尸于市而虫蛆不犯。
  source_urls:
  - 《五国故事》卷上·伪吴杨氏
