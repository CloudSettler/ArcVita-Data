- id: guji-李冰-event-appoint
  type: career
  date: -256
  year_of: -256
  description: 秦孝文王以李冰为蜀守，冰能知天文地理，谓汶山为天彭门，至湔氐县见两山对如阙，号天彭阙，立祀三所，祭用三牲。
- id: guji-李冰-event-duojiang
  type: career
  date: -255
  year_of: -255
  description: 冰乃壅江作堋，穿郫江、检江，别支流双过郡下以行舟船，坐致材木，又溉灌三郡，开稻田，蜀沃野千里，号“陆海”。
- id: guji-李冰-event-shixi
  type: career
  date: -253
  year_of: -253
  description: 作石犀五头以厌水精，穿石犀溪于江南，命曰犀牛里；自湔堰上分穿羊摩江，灌江西；于白沙邮作三石人立三水中，与江神要：水竭不至足，盛不没肩。
- id: guji-李冰-event-hunyan
  type: career
  date: -251
  year_of: -251
  description: 青衣沫水触山胁溷崖，水脉漂疾破害舟船，冰发卒凿平溷崖，通正水道；又积薪烧崖通僰道故蜀王兵兰，悬崖有赤白五色。
- id: guji-李冰-event-tianfu
  type: career
  date: -250
  year_of: -250
  description: 通笮道文井江，导洛通山洛水、绵水皆溉灌稻田；识察水脉，穿广都盐井、诸陂池，水旱从人，不知饥馑，天下谓之“天府”。
- id: guji-李冰-event-qiao
  type: career
  date: -249
  year_of: -249
  description: 造七桥于西南两江之上，上应七星，蜀人立里多以桥为名。
