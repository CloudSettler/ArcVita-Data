  reign_ref: 秦孝文王时为蜀守
  archetype: 治水功臣与地方能吏
  dilemmas:
  - 如何驯服岷江水患并兼顾航运、灌溉与民生之利
  - 面对水神怒传说仍坚持凿崖通正水道
  lesson: 顺应水脉、因势利导，方能使水旱从人、地利无穷
  summary_first_person: 我是李冰，秦孝文王时受任蜀守。我知天文地理，号岷山为天彭门，于水上立祀三所。我壅江作堋，穿郫江、检江，引水灌溉三郡，开稻田，使蜀沃野千里，号称“陆海”、“天府”。我又作石犀厌水精，凿平溷崖通正水道，通笮道文井江，导洛水、绵水以灌稻田，穿广都盐井与诸陂池。世人谓蜀水旱从人、不知饥馑，此我心之所安也。
