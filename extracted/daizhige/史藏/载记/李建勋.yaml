  lesson: 洞察时势、功成身退，方能免于身后之祸
  summary_first_person: 我李建勋是南唐宰相，效力烈祖、元宗两朝。保大五年元日大雪，元宗赐诗于我，我与徐铉、张义方和于溪亭，为一时佳话。我看元宗宽厚而忧其性习未定，预言左右非方正之士恐不守旧业，福州之败果如我所料。晚年累表致政，自号钟山公，不受司徒之命。临终嘱门人不须封树立碑，任冢土为民耕凿，后来公卿茔域遭兵祸发掘殆尽，独我葬所不及于祸。
  source_urls:
  - 江表志·卷上
  - 江表志·卷中
