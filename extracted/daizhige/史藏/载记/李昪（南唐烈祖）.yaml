  reign_ref: 南唐开国皇帝（烈祖）
  archetype: 开国之君·养子承业
  dilemmas:
  - 养子身份与义祖宗族猜忌之间的处境
  - 受吴禅让取代旧主之忠义抉择
  lesson: 以孝谨忍蓄得立、以爱民节用聚人心，终成一代开国基业
  summary_first_person: 我本唐室孤儿，旧名知诰，为义祖徐温所养。我以孝谨事亲，以严明治政，累任楼船指挥使、升州刺史、润州刺史。知训败亡后，我轻舟渡江镇定内外，遂掌大政，增修法度，爱民节用。义祖殂后大政由己，出镇建邺，封齐王，终于受吴禅让，复姓李氏，国号唐，是为南唐。
