    rationale: 义祖殂、徐知询废，大政由己，顺势受吴禅而立国
  - date: ''
    title_zh: 徙让皇于丹徒、迁诸杨于泰州
    rationale: 固请不已，依故事而不行曹马之事之志，然终徙置旧主
