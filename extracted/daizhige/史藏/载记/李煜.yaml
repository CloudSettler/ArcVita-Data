  reign_ref: 南唐后主，建隆二年（961/文中作建隆二年七月二十九日）袭位于金陵
  archetype: 亡国之君·词人
  dilemmas:
  - 文采风流与国政不修之间的矛盾：有辞藻、善笔札、善音律，而尚奢侈
  - 江南小国与中原王朝强弱之势下的存亡困境
  lesson: 精于艺文而怠于政事、奢靡无度，终致国破，才情越盛，覆亡之兆越显。
  summary_first_person: 我本名从嘉，嗣南唐伪位后改名煜。我有文采，善书法，通音律，曾作《念家山破》《振金铃曲》等曲，然生性奢侈，以销金红罗饰壁、白银钉玳瑁押之，又题染肆之榜曰“天水碧”。建隆二年七月二十九日我袭位于金陵，登楼建金鸡肆赦，太祖闻之大怒，幸得进奏使陆昭符以“怪鸟”之对巧言解围。其后皇家荡平江南，种种皆成前兆。
  source_urls:
  - https://zh.wikisource.org/wiki/五國故事
