- id: guji-李煜-event-luxury
  date: '961'
  year_of: 961
  title: 宫中奢饰并题“天水碧”之榜
  detail: 尝于宫中以销金红罗幂壁，以白银钉玳瑁押之；又以绿钿刷隔眼、糊以红罗，外种梅花，设彩画小木亭与爱姬周氏对酌；建康染肆之榜多题“天水碧”，寻而皇家荡平，悉前兆也。
  tags:
  - 奢侈
  - 谶兆
