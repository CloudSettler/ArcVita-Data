  - 兄弟友爱与早立储君之礼的冲突
  - 传位于弟景遂引发朝局争议
  - 闽楚之乱中出兵拓土屡遭败绩
  lesson: 守文之主不忍兵祸，然用人失察则拓土成失
  summary_first_person: 我名璟，字伯玉，烈祖长子。幼工属文，风度高秀。烈祖受禅后封吴王、徙齐王，立为皇太子时固让不受。烈祖崩后即位，改元保大。初欲传位于弟景遂，后在其间闽楚内乱中出兵，平楚而失湖南，攻闽仅得建州而败于福州。周师侵淮南后，国势渐蹙。
  source_urls:
  - 南唐书・卷二 元宗本纪第二
