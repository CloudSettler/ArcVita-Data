person:
  qid: guji-李雄
  name_zh: 李雄
  names:
    zh: 李雄
    en: Li Xiong
  lifespan:
    birth:
      date: '274'
      precision: year
      is_circa: true
      raw: 晋时生年无确载，约生于泰始年间
    death:
      date: '334'
      precision: year
      is_circa: false
  birth_date: 约274
  death_date: '334'
  era: 两晋之际（十六国成汉开国君主）
  reign_ref: 李雄称成都王、后称帝，国号大成
  archetype: 起于流民之乱的开国之君
  dilemmas:
  - 六郡流民与蜀土土著之间如何立国治蜀
  - 称王者奉晋正朔还是自建帝号的两难
  lesson: 起自微贱者应天顺人，宽简得众可以立国于乱世。
  summary_first_person: 我李雄本宕渠伍卒、略阳流民出身，乘晋乱与流人之势入据成都，先称成都王，后即帝位，建立成汉，轻徭薄赋，广纳流亡，遂王巴蜀。
  source_urls:
  - https://zh.wikisource.org/wiki/華陽國志
