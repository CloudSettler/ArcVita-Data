person:
  qid: guji-杜惠度
  name_zh: 杜惠度
  names:
    zh: 杜惠度
    en: Do Hien Do (Du Huidu)
  lifespan:
    birth:
      date: ''
      precision: ''
      is_circa: false
      raw: 未详
    death: ''
  birth_date: ''
  death_date: ''
  era: 东晋
  reign_ref: 义熙七年为交州刺史（411）
  archetype: 守土名臣
  dilemmas:
  - 卢循来奔犯境：拒不接纳流亡叛军，率府兵迎战于石碕
  - 林邑入寇：孤军迎击，战而后乞降
  lesson: 以火攻破敌、以法理政治民，民畏而爱之，城门夜开而道不拾遗。
  summary_first_person: 我乃交州刺史杜瑗之子杜惠度。义熙七年，永嘉太守卢循来奔，攻破合浦，径向我州治，我奉晋帝之命为刺史，率府兵大破之于石碕，又战于龙编南津，以雉尾炬焚其船，夹岸射之，卢循兵溃溺水而死，我取其尸斩之，函首送建康。其后林邑入寇，我又击破之，林邑乞降。我为政民畏而爱之，夜间城门不闭，道不拾遗。
