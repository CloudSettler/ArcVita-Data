  lesson: 创基业者亲犯矢石，然身后权力交接之难，甚于征战。
  summary_first_person: 我杨行密，唐末起于淮南，亲冒矢石创立基业，麾下劲兵数万号黑云长剑，被尊为吴王。临终之际，面对传子抑或托贤之问，终以嫡嗣为国之根本，身后诸将政争果如所虑。
