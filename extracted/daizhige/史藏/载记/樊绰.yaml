  era: 唐
  reign_ref: 咸通（860—874）
  archetype: 边疆著述家
  dilemmas:
  - 身陷安南危城战局，以亲历见闻录成《蛮书》，为朝廷谋定南诏之策
  - 奉使蔡袭麾下书写蛮王誓文，在 EntityState 南诏与唐廷关系反复间力求实录
  lesson: 亲历边疆，笔录途程山川部落之实，使后人得以考见云南。
  summary_first_person: 我是樊绰，唐代 - 咸通年间随蔡袭出镇安南，亲历南疆。我惧南蛮攻劫，遂录其城镇川原途程、山川江源、六诏部落与制度风物，撰成《蛮书》十卷，献于朝廷，冀佐经略，永清边患。
  source_urls:
  - https://zh.wikisource.org/wiki/蠻書
