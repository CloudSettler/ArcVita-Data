  era: 唐末五代至十国时期
  reign_ref: 后晋天福二年（937）建立大理国，改元文德
  archetype: 开国之君
  dilemmas:
  - 通海节度使身份与杨氏大义宁国苛政之间的抉择：起兵建国或屈身事人
  - 得国后笼络旧贵族之时如何安顿郑、赵、杨诸姓余众及三十七蛮部
  lesson: 顺民心、减赋税者得国；以宽政与分封换取割据乱世中的稳定。
  summary_first_person: 我段思平起于南诏衰微之世，官至通海节度使，见杨干贞苛虐，众心不附，乃约三十七蛮部，借点苍洱海之险，一战而立大理国，改元文德，减税宽刑，传国于子孙。
  source_urls:
  - https://zh.wikisource.org/wiki/南詔野史
