  decisions:
  - date: '937'
    title_zh: 联合三十七蛮部起兵，攻灭杨干贞之大义宁国
    rationale: 杨氏苛政酷敛，众心相背；段氏素得部众信服，乘势取而代之。
  - date: '937'
    title_zh: 定都羊苴咩城，改年号文德
    rationale: 洱海苍山便于控御南北，且承南诏故都之基。
  - date: '938'
    title_zh: 减免赋税，宽刑罚，分封董、高、赵诸姓功臣
    rationale: 以宽政固国本，以分封安抚诸大姓，安定割据初建之局。
events:
- id: guji-段思平-event-birth
  date: 0937
  year_of: 937
  type: birth
  title_zh: 段思平出生（生年史无明载，约在唐末）
  detail_zh: 《南诏野史》载段氏为南诏大姓之后，世居滇地。
- id: guji-段思平-event-1
  date: 0929
  year_of: 929
  type: political
  title_zh: 任通海节度使，暗蓄反杨之势
  detail_zh: 赵善政之后杨干贞立大义宁国，苛政失人心；段思平以通海节度使联结滇东三十七蛮部。
- id: guji-段思平-event-2
  date: 0937
  year_of: 937
  type: founding
  title_zh: 起兵灭大义宁，建大理国，改元文德
  detail_zh: 后晋天福二年，段思平破杨氏，定都羊苴咩城，称帝建大理国。其后高氏、郑、赵诸姓继据南诏故地，段思平之立为九姓更迭中一大转折。
- id: guji-段思平-event-3
  date: 0938
  year_of: 938
  type: governance
  title_zh: 减赋税、宽刑政，分封功臣于洱海诸地
  detail_zh: 即位后反杨氏苛政而行宽政，封董、高、赵诸姓及三十七部酋长，奠定大理国三百余年基业。
- id: guji-段思平-event-4
  date: 0944
  year_of: 944
  type: death
  title_zh: 段思平卒，传位于子
  detail_zh: 按《南诏野史》世次，段氏与郑买嗣、赵善政、杨于贞、高升泰等相继据于唐末迄南宋，段思平卒后子孙继立大理。
