  dilemmas:
  - 使期促迫、搜讨仓猝，语言文字彼此讹谬，所记难于取信
  lesson: 以典實為要，不襲前誤，始可成信史
  summary_first_person: 我以翰林院檢討奉使琉球，改用現成戰船充封舟以絶舊弊，並撰「中山沿革志」與「雜錄」，記載典實，遠勝前人諸錄。
