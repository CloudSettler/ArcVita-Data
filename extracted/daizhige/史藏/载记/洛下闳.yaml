person:
  qid: guji-洛下闳
  name_zh: 洛下闳
  names:
    zh: 洛下闳
    en: Luoxia Hong
  lifespan:
    birth:
      date: -156
      precision: decade
      is_circa: true
      raw: 西汉景帝前后，约前二世纪中叶，巴郡阆中人
    death:
      date: -87
      precision: decade
      is_circa: true
  birth_date: 约-156
  death_date: 约-87
  era: 西汉
  reign_ref: 汉武帝
  archetype: 历算天文学家
  dilemmas:
  - 民间历法精算之士应诏入朝，能否将巴蜀之学与太史署官方历制相融合
  - 历成之后受官不受赏，宁归隐乡里以守其德操
  lesson: 术业专精而不慕荣利，其历法行用千古，是为不朽
  summary_first_person: 我洛下闳，巴郡阆中人，精于天文历算。汉武帝太初年间，应诏与唐都、司马迁等同造《太初历》，运算转历，创八十一分法，并作浑天仪以测天象。历成，我辞官不受，归隐而德播于世，时人称巴有此贤者。
  source_urls:
  - https://zh.wikisource.org/wiki/華陽國志
