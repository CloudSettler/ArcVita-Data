    title_zh: 应汉武帝之诏入京参与太初改历
    rationale: 以巴蜀民间历算之所长，济汉廷改正朔之所需
  - date: -103
    title_zh: 历成而辞谢官爵归隐
    rationale: 德操仁义之士，不慕富贵，令问令望足矣
events:
- id: guji-洛下闳-event-birth
  type: birth
  date: -156
  year_of: -156
  title_zh: 洛下闳生于巴郡阆中
  detail: 西汉巴郡阆中人，其地人杰地灵，与任文公等同郡名贤并称。
- id: guji-洛下闳-event-taichu
  type: endeavor
  date: -104-05
  year_of: -104
  title_zh: 与唐都、司马迁等共造《太初历》
  detail: 汉武帝太初元年，洛下闳应诏运算转历，创八十一分律历，与唐都等测定二十八宿、推算气朔，遂颁行《太初历》。
- id: guji-洛下闳-event-armillary
  type: endeavor
  date: -104
  year_of: -104
  title_zh: 制作浑天仪以测天象
  detail: 于改历之际制造浑天仪，确立浑天说之观测基础，为后世天文仪器之先导。
- id: guji-洛下闳-event-death
  type: death
  date: -87
  year_of: -87
  title_zh: 洛下闳卒
  detail: 史载其历成辞官归隐，寿终乡里，名载《华阳国志》，与冯绲、范目等并称巴地英伟。
