  reign_ref: 汉孝成帝鸿嘉五年前后（赫居世居西干四十年，约公元前18年）即百济王位
  archetype: 开国之君
  dilemmas:
  - 立国于百济而与辰韩新罗、马韩相邻，需在诸韩势力之间定都立国、扩土自保
  lesson: 创业之君审地势、择险要、抚民安边，方能肇建邦国
  summary_first_person: 我温祚，为百济始祖。当新罗赫居世居西干四十年，我在熨斗津起邦，立国号为百济，以慰礼为都，与辰韩、马韩相抗，实开百济数百年之基。
