  title_zh: 温祚立为百济始祖
  detail: 《三国史记·新罗本纪》赫居世居西干四十年载：百济始祖温祚立。据百济本纪，温祚与兄沸流由东夫余南下，居慰礼城，称王。
- id: guji-温祚-event-founding
  date: -0019
  year_of: -19
  type: political
  title_zh: 建邦立国，国号百济
  detail: 温祚自扶余携臣僚南下，渡浿水，择慰礼之地筑城立国，国号百济。
- id: guji-温祚-event-territory
  date: '-0012'
  year_of: -12
  type: political
  title_zh: 开拓疆土，筑城设防
  detail: 温祚在位期间屡次筑城拓地，与新罗（辰韩）、加耶、乐浪相争防御，奠定百济版图基础。
