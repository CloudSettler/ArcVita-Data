person:
  qid: guji-源光国
  name_zh: 源光国
  names:
    zh: 源光国
    en: Tokugawa Mitsukuni
  lifespan:
    birth:
      date: 1628-07-11
      precision: day
      is_circa: false
      raw: 宽永五年六月十日
    death:
      date: 1701-01-14
      precision: day
      is_circa: false
  birth_date: 1628-07-11
  death_date: 1701-01-14
  era: 日本江户时代
  reign_ref: 水户藩第二代藩主
  archetype: 史家藩主 / 修史立国体之儒
  dilemmas:
  - 著史欲尊国体，却须裁断神代传说、徐福泰伯传讹等涉外附会之说
  - 身为德川一门之长，修《大日本史》尊王抑幕，于将军权威有微妙张力
  lesson: 考史以正名，削附会而存国体；断代立例，学问重在辨别讹传。
  summary_first_person: 我是水户藩主源光国，延揽学者纂修《大日本史》，断自神武肇基。当世或言日本为吴泰伯、徐福之后，我驳斥道“谓泰伯后，是以我为附庸国也”，遂削之不书，以正国体、明史例。
