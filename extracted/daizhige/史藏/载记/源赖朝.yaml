    rationale: 源氏所在响应，东海东山道多属之，据关东为根本
  - date: '1185'
    title_zh: 分遣范赖、义经追讨平氏
    rationale: 平氏挟安德帝西走，不灭则基业不固
- id: guji-源赖朝-endeavor-2
  name_zh: 立幕府养民之政
  phases:
