    title_zh: 奏请诸国置守护、庄园置地头
    rationale: 掌兵马逮捕之权，加赋税充兵粮，以政所文书行事
  - date: '1180'
    title_zh: 奏蠲所领九国逋租，请诸国仿行
    rationale: 兵兴以来民不暇农，量力收赋以苏民力
