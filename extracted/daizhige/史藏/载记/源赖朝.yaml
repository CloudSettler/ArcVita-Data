person:
  qid: guji-源赖朝
  name_zh: 源赖朝
  names:
    zh: 源赖朝
    en: Minamoto no Yoritomo
  lifespan:
    birth:
      date: 1147
      precision: year
      is_circa: true
      raw: 生年文中未详，据史通说
    death:
      date: 1199
      precision: year
      is_circa: false
      raw: 建久十年（文中称赖朝薨于法皇之前后）
  birth_date: 1147
  death_date: 1199
  era: 平安末期至镰仓初期
  reign_ref: 镰仓开府，首代征夷大将军
  archetype: 开国武将
  dilemmas:
  - 家族被平氏诛戮殆尽，孤身免死流放伊豆，隐忍待时
  - 既奉以仁王讨平令旗自立，又须对付朝廷与义仲、义经等源氏内部的倾轧
  - 功业既成，骨肉相残，借北条之手除弟义经诸兄
  lesson: 俭以自奉、以养民为本，方能于多事之日成就大业
  summary_first_person: 我源赖朝，平治之乱后赖清盛之母之怜免死，流于伊豆。以仁王令下，我起兵开府镰仓，与弟范赖、义经先灭义仲，再于坛浦灭平氏，遂请诸国置守护、庄园置地头，兵马之权归于我手，拜征夷大将军。我于多事之秋犹蠲逋租、量力收赋，以养民为本，故能一草一木莫不从风，成建久大业。后追讨义经、行家，尽平诸国，自是朝廷拥虚器，大权独在将军。
