person:
  qid: guji-王审知
  name_zh: 王审知
  names:
    zh: 王审知
    en: Wang Shenzhi
  lifespan:
    birth:
      date: '862'
      precision: year
      is_circa: true
      raw: 生年不载，据通行谱系约生于咸通三年
    death:
      date: 925-12-30
      precision: day
      is_circa: false
      raw: 后唐同光三年十二月卒
  birth_date: '862'
  death_date: 925-12-30
  era: 唐末五代
  reign_ref: 后梁开平三年封闽王
  archetype: 开国藩主
  dilemmas:
  - 兄潮薨后让位于仲弟审邽而不得，遂自称福建留后
  - 唐末乱世之中奉中原正朔、保境安民而不称帝
  lesson: 宁为开门节度使，不作闭门天子，休兵息民、劝课农桑以固一方
  summary_first_person: 我是王审知，光州固始人，从兄王潮起兵入闽，先取泉州、继定福州，后受唐与后梁封拜，为威武军节度使、闽王。我招怀离散、均赋缮兵、置四门义学、搜求遗书，遣人向学，通商舶之路，致闽地晏然。
  source_urls:
  - source: 十国春秋卷九十·闽一·太祖世家
endeavors:
- id: guji-王审知-endeavor-1
  name_zh: 从兄平定福建
  labels:
    zh: 开基
  phases:
