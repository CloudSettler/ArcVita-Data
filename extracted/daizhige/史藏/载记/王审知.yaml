  decisions:
  - date: 886-08
    title_zh: 任都监随彦复攻泉州
    rationale: 刺史廖彦若贪暴，泉州耆老奉牛酒迎潮，遂引兵围之
  - date: 893-05
    title_zh: 急攻福州破杀范晖
    rationale: 潮令兵将尽则吾至，故竭力攻城
- id: guji-王审知-endeavor-2
  name_zh: 保境治闽
  labels:
    zh: 治理
  phases:
  - key: brewing
    name_zh: 权知军府
    labels:
      zh: 继承兄业
    start_date: 897-12
    highlight_event_id: guji-王审知-event-succession
  - key: breakthrough
    name_zh: 受封闽王
    labels:
      zh: 奉梁正朔
    start_date: '909'
    highlight_event_id: guji-王审知-event-fengwang
  - key: climax
    name_zh: 招徕文教
    labels:
      zh: 兴学纳士
    start_date: '904'
  - key: closure
    name_zh: 晚年营造
    labels:
      zh: 筑城铸佛
    start_date: '905'
  decisions:
  - date: 897-12
    title_zh: 让位审邽不果，自称福建留后
    rationale: 让位于仲弟泉州刺史审邽，审邽以审知有功不受
  - date: '905'
    title_zh: 筑福州外罗城及南北夹城
    rationale: 恢守地养民之本，隆暂劳永逸之防
  - date: '905'
    title_zh: 搜求遗书缮写上进
    rationale: 兵兴以来图籍散亡，命管内军州搜遗书缮写以上
events:
- id: guji-王审知-event-birth
  date: '862'
  year_of: 862
  type_zh: 出生
  title_zh: 王审知生
  summary_zh: 光州固始人，王潮季弟，身长七尺六寸，紫色方口，常乘白马，军中号白马三郎。
- id: guji-王审知-event-quanzhou
  date: 887-08
  year_of: 887
  type_zh: 事业
  title_zh: 攻陷泉州
  summary_zh: 光启二年八月引兵围泉州，明年八月克之，杀廖彦若，遂有其地。
- id: guji-王审知-event-fuzhou
  date: 893-05
  year_of: 893
  type_zh: 事业
  title_zh: 克福州尽有五州
  summary_zh: 景福二年五月为都监与彦复急攻福州，范晖弃城走，入城后潮尽有闽中五州。
- id: guji-王审知-event-succession
  date: 897-12-25
  year_of: 897
  type_zh: 事业
  title_zh: 继主闽政
  summary_zh: 乾宁四年冬潮疾，审知知军府事；潮薨，让位审邽不受，自称福建留后，表于朝。
- id: guji-王审知-event-liuhou
  date: 898-03-21
  year_of: 898
  type_zh: 事业
  title_zh: 授节度使
  summary_zh: 光化元年春三月己丑，唐以审知为威武军留后、检校刑部尚书，冬十月授右仆射本军节度使。
- id: guji-王审知-event-fengwang
  date: '909'
  year_of: 909
  type_zh: 事业
  title_zh: 后梁封闽王
  summary_zh: 后梁开平年间累加守侍中，封闽王，奉中原正朔，保境息民。
- id: guji-王审知-event-gantang
  date: '906'
  year_of: 906
  type_zh: 事业
  title_zh: 甘棠港之赐
  summary_zh: 祷于海神，一夕风雨雷震击开黄崎为港，唐帝赐号甘棠港，封其神为灵显侯。
- id: guji-王审知-event-death
  date: 925-12-30
  year_of: 925
  type_zh: 去世
  title_zh: 王审知卒
  summary_zh: 后唐同光三年十二月卒，在位二十九年，谥忠懿，闽人奉祀不辍。
