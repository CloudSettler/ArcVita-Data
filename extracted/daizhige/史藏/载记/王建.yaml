person:
  qid: guji-王建
  name_zh: 王建
  names:
    zh: 王建
  lifespan:
    birth:
      date: '847'
      precision: year
      is_circa: true
      raw: 许州舞阳人，生年不详
    death:
      date: '918'
      precision: year
      raw: 在伪位十有二年，末年殂
  birth_date: 约847
  death_date: '918'
  era: 唐末五代十国（前蜀）
  reign_ref: 前蜀高祖，武成、永平、通正、天汉、光天等年号
  archetype: 开国之君 ·亦是聚敛急刻之主
  dilemmas:
  - 葬父棺椁三跃乃安于"天子之地"，自负天命却行聚敛虐民之政
  - 立嗣铸钟以祈东宫之庆，八日钟坠，终成国祚短促之兆
  lesson: 得国艰难者当勤俭恤民而久安，急赋虐敛则天命人心俱失
  summary_first_person: 我本是许州舞阳饼师之家，葬父时棺三跃，遇神人谓之天子之地，遂自负天命。起于忠武军为将，剖马得蛇愈自恃异相；奉唐命领永平军节度，旋收两川封蜀王。及朱梁受禅，我亦僭称帝号，与梁通和互市，自谓"俱非恃强逼禅，皆以行道济时"。我在位十二年，五改其元，虽仓廪充溢而聚敛不已，尝欲税桑而民尽伐桑柘。末年立少子衍为嗣，铸钟虚悬自贺，八日钟殒龙首摧落，我已不怿。病痢剧痛中见百姓列于床前诉重赋伤死之冤，我惭言不知，未几而殂，蜀祚竟如其钟，八载而亡。
