events:
- id: guji-皮逻阁-event-birth
  person_qid: guji-皮逻阁
  date: ''
  year_of: ''
  type: birth
  title_zh: 皮逻阁生于蒙舍诏
  summary: 生年无考，开元十六年（728/738）即位时年三十一岁，逆推约生于七世纪末。
- id: guji-皮逻阁-event-ascend
  person_qid: guji-皮逻阁
  date: 0728
  year_of: 728
  type: event
  title_zh: 即蒙舍诏王位
  summary: 唐元宗戊辰开元十六年即位，年三十一岁。
- id: guji-皮逻阁-event-bribe-wangyu
  person_qid: guji-皮逻阁
  date: '0730'
  year_of: 730
  type: event
  title_zh: 赂剑南节度使王昱求合六诏为一
  summary: 先是五诏抗命，逻阁赂剑南节度使王昱，求合六诏为一，昱奏于朝，许之。
- id: guji-皮逻阁-event-songminglou
  person_qid: guji-皮逻阁
  date: '0730-06-24'
  year_of: 730
  type: event
  title_zh: 松明楼焚灭四诏
  summary: 豫建松明大楼，托言星回节祭祖，诱邆赕、施浪、浪穹、蒙嶲四诏赴会，纵火焚之，四诏皆死。
- id: guji-皮逻阁-event-conquer-wuzhao
  person_qid: guji-皮逻阁
  date: '0730'
  year_of: 730
  type: event
  title_zh: 灭五诏
  summary: 逻阁既灭四诏，取各诏宫人；越析诏于赠远不赴会，后亦为所并。开元十八年（739年前说）灭五诏，自称南诏王。
- id: guji-皮逻阁-event-yunnan-wang
  person_qid: guji-皮逻阁
  date: 0738
  year_of: 738
  type: event
  title_zh: 受唐封云南王、赐名归义
  summary: 开元戊寅二十六年（738），破吐蕃及弥蛮，入朝，元宗礼之，加封特进、云南王、越国公、开府仪同三司，赐名归义，并锦袍金钿带七事。
- id: guji-皮逻阁-event-taihe-city
  person_qid: guji-皮逻阁
  date: 0738
  year_of: 738
  type: event
  title_zh: 筑太和城，尽有云南之地
  summary: 归国以兵逐洱河蛮，筑太和城，又筑大厘城守之，尽有云南之地；开元辛巳二十九年（741）自蒙舍川迁居太和城，立龙首、龙尾二关。
- id: guji-皮逻阁-event-fenggaiyi
  person_qid: guji-皮逻阁
  date: '0746'
  year_of: 746
  type: event
  title_zh: 遣孙凤伽异入唐
  summary: 天宝丙戌五载（746），遣凤伽异入唐，唐授鸿胪少卿，妻以宗室女，赐龟兹乐一部。
- id: guji-皮逻阁-event-death
  person_qid: guji-皮逻阁
  date: '0747'
  year_of: 747
  type: death
  title_zh: 皮逻阁卒
  summary: 唐元宗戊子天宝七载（747）王卒，在位二十年，子阁逻凤立。
