- id: guji-盖苏文-event-office
  title_zh: 嗣父为东部大人
  date: ''
  year_of: 642
  description: 性忍暴，残凶不道，嗣父职为东部大人，诸大臣与建武议诛之。
- id: guji-盖苏文-event-usurp
  title_zh: 弑杀建武专国柄
  date: ''
  year_of: 642
  description: 盖苏文觉谋，悉召诸部诒云大阅兵，尽杀临视大臣百余人，驰入宫杀建武，残其尸投诸沟，更立建武弟之子藏为王，自为莫离支专国柄，犹唐兵部尚书中书令之职。
- id: guji-盖苏文-event-attack-xinluo
  title_zh: 攻取新罗二城
  date: ''
  year_of: 643
  description: 新罗遣使上书求援，太宗以书让高丽且使止勿攻，使未至而盖苏文已取新罗二城，遂招致唐太宗亲征。
- id: guji-盖苏文-event-death
  title_zh: 盖苏文死诸子相怨
  date: ''
  year_of: 666
  description: 盖苏文死，子男生代为莫离支，与弟男建男产相怨，男生入朝求援，唐遣李勣等讨之，遂灭高丽。
