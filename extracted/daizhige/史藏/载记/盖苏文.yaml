  lesson: 忍暴专权虽得一时之柄，穷兵拒命终致国灭族倾
  summary_first_person: 我姓泉氏，自云生于水中以惑众，性忍暴，嗣父为东部大人。诸大臣密议诛我，我先发制人，借阅兵之名尽杀大臣百余人，驰入宫杀建武，更立藏王，自为莫离支专国柄，抗拒唐命，攻取新罗二城，终至唐师亲征，我死之后国亦为唐所灭。
