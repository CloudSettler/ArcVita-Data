  name_zh: 石虎
  names:
    zh: 石虎
    en: Shi Hu
  lifespan:
    birth:
      date: 0295
      precision: year
      is_circa: true
      raw: 生年史无明文，约生于三世纪末
    death:
      date: 0349
      precision: year
      is_circa: true
      raw: 本传未载，史载卒于349年
  birth_date: 0295
  death_date: 0349
  era: 十六国·后赵
  reign_ref: 石勒麾下征伐大将，后为后赵主（本卷所记为其为将时期）
  archetype: 骁悍勇战的宗室大将，攻城略地、坑杀降卒的枭雄武人
  dilemmas:
  - 屡为石勒力战克敌，权势渐盛，与石氏宗族荣辱一系，果于杀伐而无字面上的抉择困局
  lesson: 兵锋虽锐，恃力坑戮者终不得人心，胜局亦埋祸根
  summary_first_person: 我石虎将步骑数万自皋关入洛；先于洛西大破刘曜军中山王岳，围石梁断其粮道；高候之战虽为曜所破，至洛西终擒刘曜。其后奉命进击关中，义渠破胤、陷上邽，执太子熙及王公以下三千余人，坑屠各五千余人于洛阳，前赵自此而灭。
  source_urls:
  - https://zh.wikisource.org/wiki/十六國春秋/卷07
  - https://zh.wikisource.org/wiki/十六國春秋/卷08
