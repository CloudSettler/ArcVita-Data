  detail_zh: 勒遣虎率步骑四万入自皋关，岳陈兵以待，战于洛西
- id: guji-石虎-event-luoxi
  date: 0328
  year_of: 328
  type: endeavor
  endeavor_id: guji-石虎-endeavor-1
  name_zh: 洛西破中山王岳，围困金墉石梁
  detail_zh: 岳师败绩，身中流矢退保石梁；虎作堑栅列围，遏绝内外，岳众饥甚杀马以食；呼延谟为虎所杀
- id: guji-石虎-event-gaohou
  date: 0328-08
  year_of: 328
  type: endeavor
  endeavor_id: guji-石虎-endeavor-1
  name_zh: 高候之战为刘曜所破，退保朝歌
  detail_zh: 曜追及于高候，大战破之，斩将军石瞻，枕尸百余里，虎奔朝歌
- id: guji-石虎-event-luoxi-final
  date: 0328-12
  year_of: 328
  type: endeavor
  endeavor_id: guji-石虎-endeavor-1
  name_zh: 洛西决战，虎自城北击曜中军，曜被执
  detail_zh: 勒帅步骑四万入洛阳城，虎引步骑三万自城北而西攻曜中军，石堪等自城西击其前锋，曜军大溃，为堪所执
- id: guji-石虎-event-yiqu
  date: 0329-09
  year_of: 329
  type: endeavor
  endeavor_id: guji-石虎-endeavor-2
  name_zh: 义渠之战率骑二万破南阳王胤
  detail_zh: 勒使虎率骑二万来援，九月战于义渠，大破胤军，死者五千余人；虎乘胜追战，枕尸千里
- id: guji-石虎-event-shanggui
  date: 0329-09
  year_of: 329
  type: endeavor
  endeavor_id: guji-石虎-endeavor-2
  name_zh: 攻围上邽，城溃，执杀前赵宗室王公
  detail_zh: 攻围上邽，城溃，执太子熙、南阳王胤并将相诸王等三千余人皆杀之，坑屠各五千余人于洛阳
