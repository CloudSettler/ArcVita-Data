  birth_date: -711
  death_date: -585
  era: 传说时代（日本上古地神代之后）
  reign_ref: 日本第1代天皇（神武天皇）
  archetype: 传说开国君主
  dilemmas:
  - 自西陲日向起兵，面对四方‘邑有君、村有长、各相陵轹’的分裂局面，须决断是否东征统一
  - 东征途中遇长髓彦据阻、饶速日命率支属被推为其长者，须以武力与恩威兼施降服之
  lesson: 洪荒甫辟之际，仗剑东征、经营四方，七年而成帝业，开万世一系之统绪
  summary_first_person: 我是一 Indonesia……实为日本传说中之开国天皇。我本日本盘余彦尊，起于日向国，会皇族议曰东方有美地足以恢扩大业，遂率师东征，讨平长髓彦及八十枭贼，降饶速日命，七年而operator帝业，迁都大和之橿原，国号秋津洲，命大臣主祭祀、掌朝政，遣诸臣任国造县主，立灵畤祀皇祖天神，在位七十六年而崩。后世史家如源光国、赖襄皆断自神武纪元。惟考神武至崇神中更九代无事足纪，或亦追王之词，未可知也。
