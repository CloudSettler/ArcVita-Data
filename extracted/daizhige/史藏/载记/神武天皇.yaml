    title_zh: 决议东征
    rationale: 我祖宗僻居西陲，运属草昧，四方未沾王化，邑有君村有长各相陵轹；闻东方有美地，山岳四周，足以恢扩大业，故将扫荡之。
  - date: -660
    title_zh: 迁都橿原即位
    rationale: 讨平群雄、开山林营宫室之后，都于大和之橿原，以正帝业之基。
