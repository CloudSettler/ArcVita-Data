events:
- id: guji-窝阔台-event-birth
  date: '1186'
  year_of: 1186
  title_zh: 窝阔台生（约）
  description_zh: 成吉思汗之子，小名兀窟解，后继大蒙古皇帝之位。
- id: guji-窝阔台-event-succeed
  date: '1229'
  year_of: 1229
  title_zh: 继立为大蒙古皇帝
  description_zh: 黑鞑之国号大蒙古，成吉思皇帝之后，兀窟解继立，其耦僭号者八人，以按只角、楚材、重山、镇海等为相分理汉与回回国事。
- id: guji-窝阔台-event-south-invasion
  date: '1230'
  year_of: 1230
  title_zh: 遣军南侵金国
  description_zh: 命伪太子屈术随按只角等南侵，次年屈术死，按只角代之；攻凤翔专力打城之一角，立炮四百座，终灭金虏，百工之事于是大备。
- id: guji-窝阔台-event-death
  date: '1241'
  year_of: 1241
  title_zh: 窝阔台卒（约）
  description_zh: 在位期间灭金、立金帐、定差发赋敛，身后其国号令仍自鞑主亲决之制延续。
