  birth_date: '1186'
  death_date: '1241'
  era: 蒙古帝国
  reign_ref: 成吉思汗第三子，继位为大蒙古皇帝（文中称"兀窟解"）
  archetype: 征服者与帝国治理者
  dilemmas:
  - 信用汉地与西域诸臣（楚材、镇海、按只角）而军事决策独断于亲族
  - 依赖回回贾贩纳息与对汉地重敛之间的矛盾
  lesson: 帝国扩张须兼重文治与民生，否则"诸亡国之人怨愤彻天"
  summary_first_person: 我名兀窟解，成吉思皇帝之子，今继为大蒙古之主。我以楚材、镇海等共理汉与回回事，金帐听政，烧琵琶占吉凶，行师用兵则自断，南侵灭金，事无巨细自决之。
  source_urls:
  - https://zh.wikisource.org/wiki/黑鞑事略
