  reign_ref: 商纣王时期
  archetype: 遗民封君 / 制度传播者
  dilemmas:
  - 陈洪范于武王，义不臣周而受封朝鲜，忠与传道之间的两难
  - 佯狂为奴以全身，见微知著而终被囚
  lesson: 义不臣周而以礼义化民，遗教绵延者德也
  summary_first_person: 我本殷之宗室，见纣无道而佯狂为奴，终被囚。武王克商，释我之囚，我陈《洪范》九畴，义不臣周，遂东走朝鲜，教民礼义田蚕，制八条之约，其俗遂淳厚无淫盗。
