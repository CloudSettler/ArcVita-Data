  era: 辽末金初
  reign_ref: 天辅、天会年间
  archetype: 开国名将·军政强臣
  dilemmas:
  - 奉守阿骨打联宋之约与己意欲止割燕地之间的取舍
  - 军前专断与国中骨舍共权之平衡
  lesson: 骁勇严酷可决胜于阵，然贪纵谋深，亦为宋金争端埋祸
  summary_first_person: 我粘罕乃阿骨打从侄，姿貌雄杰，披甲贯马腹，轮剑入敌人莫敢当。性严酷残忍，沈鸷多谋，号令之下回顾者斩，故每战必胜。我佐太祖灭辽，袭中京、取西京、逐天祚，又力主燕地租赋当归金，誓约之间寸利必争。太祖尝诫我：彼与宋有誓，身后之事听我为之，我遂成金初用事之权臣。
