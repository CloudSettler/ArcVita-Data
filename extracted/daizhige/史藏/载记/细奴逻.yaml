  lesson: 以奇相与祥异得众，逊国而立，遵唐正朔以固新基
  summary_first_person: 我细奴逻，蒙苴笃之后，自哀牢避难至蒙舍川，耕于巍山。因祥异感天，张乐进求妻以女、举国逊我，我于贞观二十三年即位，建号大蒙国，称奇嘉王，遣子入朝，受唐巍州刺史之封，在位二十六年。
