      raw: 汉初，卒年不详
  era: 秦末汉初
  reign_ref: 汉高帝刘邦时期
  archetype: 建议密谋者
  dilemmas:
  - 功成之际，土卒思归，须以辞侯换得乡人安逸
  lesson: 有恩信方略者，能聚乡勇成大事，亦知功成身退、谋及众人
  summary_first_person: 我乃阆中人范目，有恩信与方略，预知汉王必得天下，为高帝募发賨民从征，与共定三秦。秦地既定，封我为长安建章乡侯；帝将讨关东而賨民思归，我固辞封爵，遂徙封阆中慈凫乡侯，再辞，乃封渡沔侯。故世谓"三秦亡，范三侯"。我又请复除罗、朴、昝、鄂、度、夕、龚七姓之租赋。我所率賨民为汉前锋陷阵，锐气喜舞，帝称此"武王伐纣之歌"，令乐人习之，是为"巴渝舞"。
