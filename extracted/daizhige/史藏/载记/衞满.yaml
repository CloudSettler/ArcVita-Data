person:
  qid: guji-衞满
  name_zh: 衞满
  names:
    zh: 衞满
    en: Wi Man (Wei Man)
  lifespan:
    birth:
      date: '-0245'
      precision: year
      is_circa: true
      raw: 燕人，生年无考
    death:
      date: '-0165'
      precision: year
      is_circa: true
      raw: 卒年无考（其孙右渠于汉武帝时被灭）
  birth_date: '-0245'
  death_date: '-0165'
  era: 汉高祖至惠帝时期（战国燕至汉初）
  reign_ref: 王俭城（今平壤）朝鲜王
  archetype: 亡命立国者
  dilemmas:
  - 亡命之身与称王之志
  - 承旧国之名与篡逐旧主之实
  lesson: 以流亡之身诱据故地而自立，可成一时之业，然孙辈不奉正朔终致覆灭。
  summary_first_person: 我是燕人衞满，汉高祖时因燕王卢绾作乱，亡命渡浿水（今大同江），东入箕子朝鲜。我诱逼箕准，使之浮海南奔，遂据王俭城（今平壤），仍号朝鲜，传国至孙右渠。右渠不奉汉诏，武帝遣师灭之，分其地为四郡。
  source_urls:
  - https://ctext.org/
