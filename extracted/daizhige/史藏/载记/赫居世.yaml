  era: 上古朝鲜三国时期（新罗始祖）
  reign_ref: 汉宣帝五凤元年立，在位六十一年
  archetype: 开国之君
  dilemmas:
  - 出身神异（萝井大卵中所生），传奇起源与史实难以分辨，权近讥其「怪而不常」
  - 建国之初六部分立、乐浪东沃沮环伺，须以德服人而非以力扩张
  lesson: 以德立国、劝督农桑、不伐邻丧，虽出身传说而致二圣之名
  summary_first_person: 我生于萝井林间大卵之中，为六部村人所养，因卵形似瓠而姓朴。他们共立我为君，号居西干，都徐罗伐。我立阏英为妃，人谓二圣。我巡抚六部，劝督农桑，不伐马韩之丧；乐浪来侵，见我民夜户不扃，服其有道而退；东沃沮亦称我为圣人。遣使献马，卞韩以国来降。在位六十一年而薨，太子南解继立。
  source_urls:
  - 钦定四库全书·朝鲜史略卷一
