  era: 新罗初期
  reign_ref: 五凤元年即位居西干，在位六十一年
  archetype: 神异立国圣君
  dilemmas:
  - 六部分居山谷，朝鲜遗民无主，须立君以聚人心
  - 马韩责辰、卞二韩不输职贡并胁使臣瓠公
  - 马韩王薨，臣下劝乘丧征伐，王以仁义拒之
  lesson: 以神异聚众立国，以农桑富民，以仁义待人，不乘人之危。
  summary_first_person: 我生于大卵，辰韩六部之人以我生而神异，推立为君，号居西干，时年十三，国号徐那伐，以卵如瓠故姓朴。我娶阏英为妃，时人称二圣。我巡抚六部，劝督农桑；卞韩以国来降，东沃沮献马来朝。倭人闻我有神德而还兵，乐浪人见我民夜户不闭，愧为盗而引兵归。马韩辱我使而又薨，我曰幸人之灾不仁，不征其丧，反遣使吊慰。在位六十一年而升遐，葬于蛇陵。
  source_urls:
  - https://zh.wikisource.org/wiki/三國史記/卷01
