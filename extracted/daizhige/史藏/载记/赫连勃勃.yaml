person:
  qid: guji-赫连勃勃
  name_zh: 赫连勃勃
  names:
    zh: 赫连勃勃
    en: Helian Bobo
  lifespan:
    birth:
      date: '381'
      precision: year
      is_circa: true
      raw: 约公元381年
    death:
      date: '425'
      precision: year
      is_circa: false
      raw: 公元425年
  birth_date: '381'
  death_date: '425'
  era: 十六国时期
  reign_ref: 大夏天王（407年僭称）
  archetype: 叛主立国之枭雄
  dilemmas:
  - 依附后秦得以掌兵，却因姚兴与北魏通好而决意叛秦自立，忠义与雄图相冲突
  - 屡以游击掠战立足岭北，需在削夺后秦边镇与避免决战之间权衡
  lesson: 乘势而起者，须以兵威与权谲并济；然弑主背盟之业，终以暴立而难以久安。
  summary_first_person: 我本匈奴铁弗之裔，为后秦安北将军，因姚兴与魏通好而愤然诛高平公没奕干，收其众数万，改姓赫连，僭称大夏天王。此后我转战岭北，袭破齐难、逼死姚详、屡掠平凉陇右，又于龙尾堡之战遭挫而复振，终使后秦疲于奔命，为日后大夏立国奠定基业。
