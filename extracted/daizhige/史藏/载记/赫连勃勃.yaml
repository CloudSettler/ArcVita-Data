      - 退保河曲
    start_date: '416'
    highlight_event_id: guji-赫连勃勃-event-wucheng
  decisions:
  - date: '409'
    title_zh: 潜师袭击齐难纵兵野掠之军
    rationale: 闻秦兵将至，退保河曲，待左仆射齐难纵兵野掠，乘隙潜师掩击，斩首七千，擒齐难。
  - date: '412'
    title_zh: 屡攻平凉、陇右诸堡而掠户内徙
    rationale: 以游骑抄掠平凉杂胡、定阳、白崖堡、清水等地，虏户万余以实部众，避秦主力而不决战。
  - date: '408'
    title_zh: 闻秦大军将至则退保河曲
    rationale: 避后秦中军广平公弼等三万步骑之锋，以空间换时机，伺其将骄卒怠而后击之。
events:
- id: guji-赫连勃勃-event-birth
  date: 0381
  year_of: 381
  title_zh: 赫连勃勃出生
  description: 勃勃出生于铁弗匈奴刘氏之家，约生于四世纪末，生年史无明文。
- id: guji-赫连勃勃-event-death
  date: '0425'
  year_of: 425
  title_zh: 赫连勃勃去世
  description: 大夏创立者赫连勃勃卒，本篇所据《十六国春秋》后秦录各卷载其事迹至姚兴之世而止。
- id: guji-赫连勃勃-event-rebel
  date: '0407'
  year_of: 407
  title_zh: 杀没奕干以叛，收众数万
  description: 勃勃忿姚兴与北魏交好，杀高平公没奕干以叛，收其众数万，邀留柔然社仑所献八千匹马，侵掠岭北诸镇。
  endeavors:
  - guji-赫连勃勃-endeavor-1
- id: guji-赫连勃勃-event-founding
  date: '0407'
  year_of: 407
  title_zh: 改姓赫连，僭称大夏天王
  description: 叛秦之后，勃勃改姓赫连氏，僭称大夏天王，立国建号。
  endeavors:
  - guji-赫连勃勃-endeavor-1
- id: guji-赫连勃勃-event-qinan
  date: 0409
  year_of: 409
  title_zh: 潜师袭破秦将齐难
  description: 弘始十年夏，勃勃闻秦兵将至退保河曲；左仆射齐难纵兵野掠，勃勃潜师袭击，斩首七千余人，追至木城擒齐难，复虏将士万三千人。
  endeavors:
  - guji-赫连勃勃-endeavor-2
- id: guji-赫连勃勃-event-pingliang
  date: '0410'
  year_of: 410
  title_zh: 帅骑二万攻掠平凉
  description: 弘始十一年夏四月，勃勃帅骑二万攻掠平凉杂胡七千余户，进屯依力川，又击败来救之秦将姚强。
  endeavors:
  - guji-赫连勃勃-endeavor-2
- id: guji-赫连勃勃-event-wucheng
  date: '0410'
  year_of: 410
  title_zh: 乘虚袭姚兴于贰城，伏兵禽姚榆生
  description: 弘始十一年秋，姚兴自将讨勃勃至贰城，诸军未集而勃勃率骑乘虚奄至；伏兵夹击，禽秦别将姚榆生，因姚文宗等死战而退。
  endeavors:
  - guji-赫连勃勃-endeavor-2
- id: guji-赫连勃勃-event-longyou
  date: '0412'
  year_of: 412
  title_zh: 攻陷定阳、白崖堡，寇陇右
  description: 弘始十二年，勃勃遣胡金纂万余骑攻平凉败绩被擒；又遣兄子罗提陷定阳，坑将士四千余人，执姚广都；寇陇右，陷白崖堡，虏一万六千户而去。
  endeavors:
  - guji-赫连勃勃-endeavor-2
- id: guji-赫连勃勃-event-longwei
  date: '0415'
  year_of: 415
  title_zh: 破杏城，执杀秦将姚详
  description: 弘始十三年二月，勃勃逼杏城，秦安远将军姚详粮尽矢竭南奔，至大苏被勃勃平北将军鹿奕干要击，众溃，姚详被执而死。
  endeavors:
  - guji-赫连勃勃-endeavor-2
- id: guji-赫连勃勃-event-luowei
  date: '0416'
  year_of: 416
  title_zh: 龙尾堡之战遭挫
  description: 弘始十七年秋，勃勃遣赫建入平凉，进兵新平，为广平公姚弼大破于龙尾堡，赫建被擒送长安；勃勃攻石堡彭双方积年不克，闻建败引师而去。
  endeavors:
  - guji-赫连勃勃-endeavor-2
