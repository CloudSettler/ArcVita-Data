  decisions:
  - date: '406'
    title_zh: 忿后秦与魏交好而决意叛秦
    rationale: 姚兴起初许婚复绝婚，又与魏通和赎还狄伯支，勃勃认为秦恩已绝，遂杀高平公没奕干以叛。
  - date: '407'
    title_zh: 改姓赫连、僭称大夏天王
    rationale: 既已收没奕干之众数万，侵岭北诸镇，遂改姓赫连氏，建国称制以自树。
- id: guji-赫连勃勃-endeavor-2
  name_zh: 岭北争霸
  phases:
