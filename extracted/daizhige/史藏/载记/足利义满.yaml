events:
- id: guji-足利义满-event-birth
  date: 1358
  year_of: 1358
  title_zh: 足利义满出生
  description: 足利义诠之子，父死后年幼袭为将军
- id: guji-足利义满-event-1
  date: 1367
  year_of: 1367
  title_zh: 嗣任征夷大将军
  description: 父义诠死，义满袭将军之职
- id: guji-足利义满-event-2
  date: 1392
  year_of: 1392
  title_zh: 促成南北朝合一
  description: 义满来请和，南朝后龟山帝还驾京师、授神器于北朝后小松帝，两朝始一统
- id: guji-足利义满-event-3
  date: 1394
  year_of: 1394
  title_zh: 就任太政大臣
  description: 朝议以武家无升此官者而阻，义满怒言天子乃我家所立，遂得许
- id: guji-足利义满-event-4
  date: 1397
  year_of: 1397
  title_zh: 营北山金阁
  description: 营别业于北山，起金阁徙居之，称北山殿，又造小御所于禁内
- id: guji-足利义满-event-5
  date: 1399
  year_of: 1399
  title_zh: 遣使称臣于明
  description: 每进朝公卿皆下阶拜跪，遣使称臣于明，受太宗皇帝封为日本王
- id: guji-足利义满-event-6
  date: 1408
  year_of: 1408
  title_zh: 薨，诏赠太上天皇号
  description: 义满薨，朝廷诏赠太上天皇之号
- id: guji-足利义满-event-death
