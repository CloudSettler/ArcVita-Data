person:
  qid: guji-足利义满
  name_zh: 足利义满
  names:
    zh: 足利义满
    en: Ashikaga Yoshimitsu
  lifespan:
    birth:
      date: 1358
      precision: year
      is_circa: true
      raw: 义诠死后袭职，约生于南朝延文年间
    death:
      date: 1408
      precision: year
      is_circa: true
      raw: 应永年间薨
  birth_date: 1358
  death_date: 1408
  era: 日本南北朝末至室町前期
  reign_ref: 应永年间
  archetype: 权倾朝野的室町幕府将军
  dilemmas:
  - 以臣下之身僭越天家礼制，欲受太上天皇之号
  - 迎合北朝一统却承诺两统更立，遗南朝后患
  lesson: 以实利操柄、以虚名让权，可成一时之谋，然僭越与失信终遗祸于后
  summary_first_person: 我自幼嗣为幕府将军，平定南北之争，迎回神器使天下一统；后官至太政大臣，营北山金阁，遣使朝明受封日本王，声势倾动朝野。
