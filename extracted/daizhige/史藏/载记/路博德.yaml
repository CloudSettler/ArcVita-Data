  description: 伏波将军路博德率师出桂阳，缘湟水南下，直趋南越腹地。
- id: guji-路博德-event-panyu
  type: endeavor
  date: -111
  year_of: 元鼎六年
  description: 楼船将军杨仆精兵先陷寻陿、破石门，得越船粟；路博德俱进至番禺，与杨仆会攻，粤人纵火烧城，汉兵攻败粤军。
- id: guji-路博德-event-ninejun
  type: endeavor
  date: -111
  year_of: 元鼎六年
  description: 日暮伏波为营，使招降者赐印绶，纵令相招，城中皆降；吕嘉、建德夜亡入海，被追擒。南越平，以其地为九郡；越人牵牛载酒，交趾、九真、日南三郡户籍来降，路博德因拜为三郡守。
