  dilemmas:
  - 城中粤人溃乱，是否纵火强攻番禺
  - 追亡逐北与招降安抚之间的取舍
  lesson: 伏波为营、招降赐印，以宽谋定岭南，不战而收九郡之功。
  summary_first_person: 我是西汉伏波将军路博德，元鼎五年奉武帝之命出桂阳、下湟水，与楼船将军杨仆分道并进，会师番禺。当城中火起、暮色将合之时，我屯营招降、赐印纵使相招，一夜之间城中皆降，擒吕嘉、建德，遂定南越，以其地为九郡。
