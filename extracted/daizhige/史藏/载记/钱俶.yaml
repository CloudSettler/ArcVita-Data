  birth_date: '929'
  death_date: '988'
  era: 五代十国·吴越
  reign_ref: 吴越国王（948—978 在位，忠懿王）
  archetype: 末代纳土归顺之君
  dilemmas:
  - 位居一方而宋一统大势已成，是保境自守还是纳土归宋
  - 助宋讨伐南唐与唇亡齿寒之间的两难
  lesson: 识时势、保生民，舍王位而全宗族，纳土归宋终得善终。
  summary_first_person: 我为吴越国王钱俶，尊奉中原，助宋平江南，终以所部十三州一军八十六县纳土归宋。
  source_urls:
  - https://zh.wikisource.org/wiki/十国春秋/卷081
  - https://zh.wikisource.org/wiki/十国春秋/卷082
endeavors:
- id: guji-钱俶-endeavor-1
  name_zh: 尊宋纳贡、保境奉朝
  phases:
  - key: brewing
    name_zh: 遣使入贡
    labels:
      zh: 贡奉不绝
    start_date: '960'
    highlight_event_id: guji-钱俶-event-tribute-song
  - key: breakthrough
    name_zh: 加官进爵
    labels:
      zh: 屡受封赏
    start_date: '963'
    highlight_event_id: guji-钱俶-event-titled-wuyue-king
  - key: climax
    name_zh: 纳土归宋
    labels:
      zh: 献地称臣
    start_date: 978-05
    highlight_event_id: guji-钱俶-event-land-surrender
  - key: closure
    name_zh: 徙封淮海、宿卫京师
    labels:
      zh: 举家留京
    start_date: 978-05
    highlight_event_id: guji-钱俶-event-huaihai-king
  decisions:
  - date: 961-10
    title_zh: 命弟信入贡于宋
    rationale: 宋既革命，贡奉有加，以固两国之好。
  - date: 978-05
    title_zh: 决策上表献土
    rationale: 丞相崔仁冀劝纳土不然祸且立至，遂献十三州一军八十六县，庶免覆亡之祸。
- id: guji-钱俶-endeavor-2
  name_zh: 助宋平江南（伐南唐）
  phases:
  - key: brewing
    name_zh: 密表请师期
    labels:
      zh: 阴附宋廷
    start_date: 974-09
    highlight_event_id: guji-钱俶-event-request-war-date
  - key: breakthrough
    name_zh: 授招讨制置使
    labels:
