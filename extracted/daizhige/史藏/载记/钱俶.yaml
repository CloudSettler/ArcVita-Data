    start_date: 974-10
    highlight_event_id: guji-钱俶-event-attack-changzhou
  - key: climax
    name_zh: 拔常州、平润州
    labels:
      zh: 屡克敌城
    start_date: 975-04
    highlight_event_id: guji-钱俶-event-battle-changzhou
  - key: closure
    name_zh: 金陵平、奉表称贺
    labels:
      zh: 请觐入朝
    start_date: 975-11
    highlight_event_id: guji-钱俶-event-jinling-peace
  decisions:
  - date: 974-07
    title_zh: 奉宋诏出师伐江南
    rationale: 宋帝谕以将讨江南，许唇亡齿寒之言不可惑，遂练兵助讨。
  - date: 975-04
    title_zh: 许常州禹万诚纳款
    rationale: 知常州军州事遣使请降，从其请，遂拔常州。
