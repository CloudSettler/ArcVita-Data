  era: 蒙古帝国时期（十三世纪前期）
  reign_ref: 大蒙古国 成吉思皇帝至其后继在位时期
  archetype: 掌文书典印之重臣
  dilemmas:
  - 以回回字押署文书以防中书之专，既防楚材又互相检尼，处于彼此掣肘的权力格局之中
  - 鞑主不识字而文书大权在握，得同握鞑柄、行其私意
  lesson: 典守文字与符印者，虽无相之名，可总国之实。
  summary_first_person: 我名镇海，仕于大蒙古国。鞑人本无字书，行于回回之文书用回回字，由我主之；又于汉文文书年月之前亲写回回字为验，以防专擅。我自号为'中书相公'，总理国事，所理不只回回国事，亦主'宣命之宝'之印。事无巨细，须伪酋自决，而四方文书之事，我与楚材等得以预焉。
  source_urls:
  - https://zh.wikisource.org/wiki/黑韃事略
