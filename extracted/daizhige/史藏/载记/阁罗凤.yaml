  decisions:
  - date: '0755'
    title: 乘安禄山之乱取蜀卭州
    rationale: 安禄山反于范阳，唐无力南顾，遂以兵取卭州筑城，得丽水金宝之利
  - date: '0752'
    title: 用郑回为清平官
    rationale: 获唐西泸令郑回爱其才，用为清平官，后使撰《德化碑》，为归唐留人脉
events:
- id: guji-阁罗凤-event-birth
  date: '0712'
  date_raw: 天宝七载卽位年三十六岁逆推
  year_of: '0712'
  type: birth
  title: 阁罗凤生（约）
  description: 生卒年史料缺载，据「天宝七载即位，年三十六岁」逆推约生于712年。
- id: guji-阁罗凤-event-accession
  date: 0748
  date_raw: 唐元宗天宝戊子七载
  year_of: 0748
  type: political
  title: 袭封云南王即位
  description: 父皮逻阁卒，阁罗凤年三十六即位，唐遣中使黎敬义持节册封袭云南王，始建元。
- id: guji-阁罗凤-event-yaozhou
  date: '0750'
  date_raw: 天宝庚寅九载
  year_of: '0750'
  type: conflict
  title: 怒而起兵取姚州
  description: 谒都督李宓过云南，太守张虔陀私辱又征求，表控不达，遂遣兵攻虔陀，虔陀饮鸩死，取姚州并夷州三十二。
- id: guji-阁罗凤-event-xierhe
  date: '0751'
  date_raw: 天宝辛卯十载
  year_of: '0751'
  type: battle
  title: 西洱河大败唐军
  description: 唐剑南节度使鲜于仲通率兵八万征云南，凤屡谢罪求罢兵不得，遂逆战西洱河，唐兵大败死者六万，凤叛唐建元长寿，归附吐蕃受册赞普钟南国大诏。
- id: guji-阁罗凤-event-jiangkou
  date: '0754'
  date_raw: 天宝甲午十三载六月
  year_of: '0754'
  type: battle
  title: 江口之战覆没李宓全军
  description: 唐命李宓、何履光率十道兵再征云南，凤遣凤伽异、段俭魏迎战江口，诱敌深入内外夹击，唐十万全军覆没，李宓沉江死。
- id: guji-阁罗凤-event-wanrenzhong
  date: '0754'
  date_raw: 天宝十三载后
  year_of: '0754'
  type: commemoration
  title: 筑万人冢立德化碑
  description: 唐先后丧师二十余万，凤敛战胔筑京观于龙尾关河尾名万人冢，令清平官郑回撰《德化碑》，立太和国门外，明不得已叛唐归吐蕃之故。
- id: guji-阁罗凤-event-dali
  date: '0764'
  date_raw: 代宗甲辰广德二年
  year_of: '0764'
  type: construction
  title: 羊苴哶城成命名大理
  description: 城成，凤名之曰大理城又名紫城，奠定南诏乃至后世大理国之都邑。
- id: guji-阁罗凤-event-death
  date: 0778
  date_raw: 代宗戊午大历十三年
  year_of: 0778
  type: death
  title: 阁罗凤卒
  description: 在位三十年卒，因子凤伽异先死追谥悼惠王，孙异牟寻立。
