  decisions:
  - date: '0750'
    title: 攻杀张虔陀取姚州
    rationale: 太守张虔陀私辱王妻、征求无度，表控于朝而中官抑之、元宗不省，忍无可忍遂发兵
  - date: '0751'
    title: 归附吐蕃受赞普钟册封
    rationale: 屡谢罪求罢兵而仲通不许，恐云南非唐有，遂投吐蕃为兄弟之国，改元赞普钟
- id: guji-阁罗凤-endeavor-3
  name_zh: 扩土建城立制度
