  era: 唐代（南诏建国时期）
  reign_ref: 天宝七载（748）袭封云南王即位，至大历十三年（778）卒
  archetype: 开国之君
  dilemmas:
  - 迫于唐朝边吏张虔陀侵辱而叛唐，又于泸南多次谢罪求和不得
  - 灭四诏后平定边地与归附吐蕃之间的抉择
  lesson: 忍辱自省、审时度势；立《德化碑》以明不得已叛唐之故，为后世子孙留归唐之路
  summary_first_person: 我蒙氏阁罗凤，袭封云南王。因太守张虔陀侵辱、朝廷不省，我起兵取姚州；唐遣鲜于仲通、李宓先后率大军二十余万征讨，我于西洱河、江口两役大破唐兵，筑万人冢立碑明不得已叛唐之衷，遂归附吐蕃受赞普钟南国大诏，扩地筑城，改元建号，晚年更心向归唐，为子孙留一线复合之机。
