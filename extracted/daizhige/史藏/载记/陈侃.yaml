  date: 1534
  year_of: 1534
  summary: 嘉靖甲午（十三年），陈侃奉使册封琉球，渡海前往，舟至叶壁山，小舟四十牵挽八日，始至那霸。
- id: guji-陈侃-event-record
  person: guji-陈侃
  type: endeavor
  date: 1535
  year_of: 1535
  summary: 使归后撰琉球「录」，疏称访其山川、风俗、人物之详，且驳群书之谬，以成「纪略」「质异」二卷，末载国语、国字；归上于朝。今钞本什存二、三矣。
