  era: 明嘉靖
  reign_ref: 嘉靖
  archetype: 册封使臣·航海记述者
  dilemmas:
  - 渡海风险与王命使命的两难
  - 旧籍记载荒略或有舛漏，需实地核验传闻与目见
  lesson: 目见者胜于传闻，考实可以正史之谬
  summary_first_person: 我于嘉靖年间奉使册封琉球，历访其山川、风俗、人物之详，驳群书之谬，撰成琉球「录」，归上于朝，后使多据我所定封舟之式与针路而行。
