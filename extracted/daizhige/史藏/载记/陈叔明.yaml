      is_circa: true
  birth_date: 约1320年代
  death_date: 约洪武二十年之后（文中仅记“久之叔明卒”）
  era: 元末明初
  reign_ref: 安南国王（明洪武年间初封候议）
  archetype: 弑主夺位的权变君主
  dilemmas:
  - 杀日熞自立后如何在明朝宗藩体系下获得册封合法性
  - 名义传政于弟陈煓而实自专制
  - 对占城“阳解阴构”屡遭明帝切责
  lesson: 名与实相维系，僭取之权终须以恭顺纳贡换取承认，然杀君之迹史笔难消。
  summary_first_person: 我本安南国戚，趁前王日熞之势而杀之自立，遣使贡方物谢罪求封；明帝虽诘其诈，仍许我以摄政视事。我授弟煓理国而实握其柄，又与占城构兵十余年屡被切责，最终行“代身金人”故智之外，以恭顺朝贡终其身。
  source_urls:
  - https://zh.wikisource.org/wiki/安南傳_(王世貞)
