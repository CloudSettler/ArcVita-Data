  archetype: 史学家·文学家
  dilemmas:
  - 既要真实记录三国史事，又须避忌权臣之意（如《魏志》失荀勖之意而外放）
  - 遵继母遗令不附葬父，遭时人讥议，孝行与礼俗相冲突
  lesson: 直笔著史，虽位望不充其才，而《三国志》遂成不朽
  summary_first_person: 我是陈寿，字承祚，巴西安汉人。少师事谯周，精研《尚书》、《三传》与《史记》、《汉书》。入晋后撰《益部耆旧传》，复鸠合三国史事，著魏、吴、蜀《三国志》六十五篇，为世所重。
