person:
  qid: guji-陈日烜
  name_zh: 陈日烜
  names:
    zh: 陈日烜
    en: Tran Hoang (Chen Rixuan)
  lifespan:
    birth:
      date: '1240'
      precision: year
      is_circa: true
      raw: 约生年，史无明载
    death:
      date: '1290'
      precision: year
      is_circa: true
      raw: 约卒年，传称卒子日燇嗣
  birth_date: 约一二四零年
  death_date: 约一二九零年
  era: 后元初安南陈朝
  reign_ref: 元世祖至元间
  archetype: 抗元保国之君
  dilemmas:
  - 元岁责供巨亿不可支，(play)cam将命与纳贡之间两难
  - 元伐占城假道安南，拒则兵祸，从则受制
  lesson: 弱国周旋强邻，不臣不屈亦不轻易灭己
  summary_first_person: 吾嗣父王光昺之后为安南国王。元督摄安南甚苦，岁责供巨亿不可支，又设达鲁花赤参预国事。会元伐占城假道于我，吾发兵拒之不前。镇南王急击，大破我守兵，围国都，吾走清化，弟益稷降元为安南国王。久之暍暑，元军还师，吾追其后军，多败之。其后镇南王复来伐，入国都而返，元兵凡三破国，杀获几十万，然终不能久，吾亦进代身金人赎罪，元诏止不伐。卒后子日燇嗣。
  source_urls:
  - - https://zh.wikisource.org/wiki/安南传_(王世贞)
