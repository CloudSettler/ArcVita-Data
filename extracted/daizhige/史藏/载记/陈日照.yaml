person:
  qid: guji-陈日照
  name_zh: 陈日照
  names:
    zh: 陈日照
    en: Tran Nhat Chao
  lifespan:
    birth:
      date: '1218'
      precision: year
      is_circa: true
      raw: 故福州长乐人，生年不详
    death:
      date: '1277'
      precision: year
      is_circa: true
      raw: 卒年不详
  birth_date: '1218'
  death_date: '1277'
  era: 南宋至宋元之际
  reign_ref: 安南国王
  archetype: 落拓布衣跃升为王
  dilemmas:
  - 里人身份与安南国统之争
  - 面对元军迫降的国祚存亡
  lesson: 乱世落魄者亦能凭才貌与机遇登临异国至尊
  summary_first_person: 我本是福州长乐人谢升卿，读书识字、姿容俊美而落拓不羁，因杀人变名逃入安南，应试居首，为王女所悦而招为婚，遂执掌国政，受封安南国王；当元军轻兵压境招降时，我未显屈服之状，终虽宫庙被焚、避匿海岛，然保住了陈氏之统，后奏请宋廷传位于子威晃。
  source_urls:
  - https://zh.wikisource.org/wiki/安南傳_(王世貞)
