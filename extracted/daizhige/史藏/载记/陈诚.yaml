  archetype: 干练不屈的外交使臣
  dilemmas:
  - 面对安南日焜抗命不还思明府侵地，是否主张兴兵征讨
  - 安南馈赠黄金白银沉檀香以示"赆礼"，受则类陆贾之贾利，却则辱或失礼
  lesson: 持节不挠，明辨疆界，以理折冲而不受重贿
  summary_first_person: 我是明朝行人陈诚。洪武三十年，我奉诏与吕让前往安南，谕令国王日焜归还所侵思明府丘温等五县之地。日焜抗命不从，驰书巧辨，又以黄金白金沉檀香馈赠，假托"陆贾受赆"为例。我据理斥之，指出尉佗以弹丸之地抗汉乃贾祸，陆贾受重赂乃贾利，坚决却其金香，复命于朝。天子召群臣议征讨，卒以"蛮夷相争"而止。我以一介行人，在大
    blir山重压之下不辱使命、不受贿赂，为外交使臣之楷模。
