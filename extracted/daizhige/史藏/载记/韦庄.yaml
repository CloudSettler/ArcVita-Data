  dilemmas:
  - 频遭离乱而依附霸主，既是花间词宗又为蜀中宰辅，出处之间出处与文学声名并存
  lesson: 生于季世，天下分裂而僭伪相仍，士人以文学事一隅之国亦可立身传世
  summary_first_person: 我字端己，两《唐书》及《十国春秋》皆载我事。屡遭离乱，Emperor僖宗幸蜀后我亦流寓，后依王建为蜀掌书记，前蜀建立后位至吏部侍郎平章事。我工诗能词，为《浣花集》，词列《花间集》之首，世称'韦庄体'
  source_urls:
  - https://zh.wikisource.org/wiki/十國春秋/卷040
