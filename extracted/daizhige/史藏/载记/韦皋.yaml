  name_zh: 遣巡官监察御史马益开凿石门路、置行馆
  description: 贞元十年七月，西川节度韦皋遣马益重开石门故道，修复隋代偏梁桥阁，置馆通云南北路。
- id: guji-韦皋-event-make-shuwei-kill-mengchong
  date: 0791
  year_of: 贞元七年
  event_type: endeavor
  name_zh: 使巂州刺史苏隗杀勿邓大鬼主苴梦冲
  description: 梦冲内受唐恩赏、外私吐蕃，贞元七年韦皋使苏隗杀之，别立大鬼主以绝吐蕃之援。
- id: guji-韦皋-event-nanzhao-alliance
  date: 0794
  year_of: 贞元十年
  event_type: endeavor
  name_zh: 与异牟寻通书，促成南诏归化、苍山会盟
  description: 异牟寻献书于韦皋，皋答书申朝廷之命；贞元十年三使至阙，崔佐时与盟于玷苍山下，唐遂册异牟寻为云南王。
