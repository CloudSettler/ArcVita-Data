  name_zh: 韦皋
  names:
    zh: 韦皋
    en: Wei Gao
  lifespan:
    birth:
      date: '745'
      precision: year
      is_circa: true
      raw: 生年不详（约天宝年间）
  birth_date: 约745
  death_date: ''
  era: 唐
  reign_ref: 贞元年间（唐德宗）
  archetype: 边疆经略重臣
  dilemmas:
  - 南诏私通吐蕃，西川边患难平，须以恩信招徕又不失朝廷体统
  - 西山诸部首领内受唐赏、外附吐蕃，讨与抚两难
  lesson: 制边之道在于通道置馆、结好远人，以信义化敌为屏藩。
  summary_first_person: 我是唐朝剑南西川节度使韦皋。贞元年间，我遣巡官马益开凿石门旧路、设置行馆，重通云南通道；又致书南诏异牟寻，申朝廷之命，促成其归化立盟；并使巂州刺史苏隗诛除两面依附吐蕃的大鬼主梦冲，别立新主，西川南鄙遂安。
  source_urls:
  - https://zh.wikisource.org/wiki/蠻書
