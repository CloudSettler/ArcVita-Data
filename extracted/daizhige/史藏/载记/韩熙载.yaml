  decisions:
  - date: 0958
    title_zh: 议宋齐丘党与陈觉、冯延鲁之罪
    rationale: 指斥齐丘党羽用师闽楚丧败误国，因而为齐丘所怒遭黜。
  - date: 0963
    title_zh: 奏狱讼非车驾所宜临幸，请罚内库钱三百万
    rationale: 以制度匡正后宫刑政之失，虽不听，后主亦不之怒。
events:
