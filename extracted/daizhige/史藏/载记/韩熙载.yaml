  date: 0958
  year_of: 958
  type: career
  description_zh: 韩熙载评议宋齐丘党与，齐丘怒而黜之，元宗不悦。出自《南唐书·宋齐丘传》。
- id: guji-韩熙载-event-keju
  date: 0964-03
  year_of: 964
  type: career
  description_zh: 乾德二年春，命吏部侍郎修国史韩熙载知贡举，放进士王崇古等九人。
- id: guji-韩熙载-event-yanzou
  date: 0963
  year_of: 963
  type: career
  description_zh: 中书侍郎韩熙载奏狱讼有司之事，囚圄非车驾所宜临幸，请罚内库钱三百万以资国用；后主虽不听，亦不怒。
- id: guji-韩熙载-event-death
  date: 0970
  year_of: 970
  type: death
  description_zh: 韩熙载约卒于开宝年间，卒年史文未载。
