      is_circa: true
      raw: 约生于唐末
  birth_date: 0902
  era: 五代十国·南唐
  reign_ref: 南唐元宗李璟、后主李煜在位期间
  archetype: 直言敢谏的臣僚与文士
  dilemmas:
  - 欲以直言匡正君主，却屡因直言招忌而被黜
  - 身处南唐国势日蹙之局，进谏与自保难以两全
  lesson: 直言有价——士人风骨可垂后世，然逆君主之欲者常失位去国。
  summary_first_person: 我是韩熙载，仕于南唐，以文才与直言闻。我曾主持贡举、放进士九人，也曾奏请罚内库钱以资国用，谏后主不宜亲临刑狱。因议宋齐丘之党而遭黜斥，然不悔其直。
  source_urls:
  - docs/YAML_STANDARD.md
endeavors:
