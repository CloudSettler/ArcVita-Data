  dilemmas:
  - 主帅何氏死后诸将争位，独领士卒、为帅治丧而被众军拥立
  - 庄宗离间之言借长子希范之口传入，谋臣高郁被构罪弃市
  lesson: 宽厚得士则起，轻信离间则霸业不终
  summary_first_person: 我马殷，上蔡人，自称伏波将军之后。唐末乱起，我从行伍随何氏南取长沙，累功擢为裨将、邵州刺史。何氏死后，众人杀帅共迎我为主，僖宗许我开国置卿相。杨行密遣舟师数万来伐，我登楼指麾一战破之，湘水为丹，四方遂无敢侵。后纳廖光图，遣李勋拔桂管十八城，刘䶮乞盟。庄宗征入觐，我以年老遣希范前往，不料离间之计成，谋臣高郁竟被弃市。我薨之后，诸子相残，楚业遂衰。
  source_urls:
  - 三楚新录·卷一（宋·周羽）
