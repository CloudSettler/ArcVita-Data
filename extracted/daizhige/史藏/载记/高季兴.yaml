  summary_zh: 唐庄宗以魏王继岌充西川四面行营都统、郭崇韬充东北面行营都招讨使，以荆南节度使高季兴充东南面行营都招讨使，与凤翔节度使李继曮等同州节度使李令德等率兵六万入蜀。
  source_quote: 又以荆南节度使高季兴充东南面行营都招讨使
