  name_zh: 后唐灭前蜀，成都陷落
  summary_zh: 是年十一月丁巳唐军入成都，前蜀主王衍白衣衔璧出降于升迁桥，高季兴所预东南面行营之役告成。
  source_quote: 丁巳唐大军入城，继岌居东内，崇韬止天策府
