  birth_date: '1335-01-01'
  death_date: '1427-01-01'
  era: 陈末安南／明初
  reign_ref: 大虞太上皇
  archetype: 篡国权臣
  dilemmas:
  - 代陈执国与篡陈自立之间的名分困境
  - 面对明廷问责与征伐时的战和抉择
  lesson: 以阴谋欺世窃国者，终为强邻所乘，身俘国灭。
  summary_first_person: 我本是陈氏外戚权辅，先弑陈炜、再弑日焜，改姓胡，自立国号大虞，尊为太上皇。明太宗数加责让，我诈迎又劫杀陈天平，终招八十万大军南征。永乐五年兵败遁海，被明卒缚送京师，下狱多年，后释戍广西，客死他乡。
  source_urls:
  - 古文传记『安南传』（王世贞）
