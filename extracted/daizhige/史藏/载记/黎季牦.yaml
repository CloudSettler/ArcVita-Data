  name_zh: 黎季牦
  names:
    zh: 黎季牦
    en: Le Quy Ly / Ho Quy Ly
  lifespan:
    birth:
      date: '1335-01-01'
      precision: year
      is_circa: true
      raw: 约元末
    death:
      date: '1427-01-01'
