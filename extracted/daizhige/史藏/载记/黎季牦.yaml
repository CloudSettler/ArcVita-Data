events:
- id: guji-li-ji-mao-event-birth
  subject: guji-li-ji-mao
  type: birth
  date: '1335-01-01'
  year_of: 1335
  is_circa: true
  detail: 黎季牦生，陈叔明之婿，一名黎一元。
- id: guji-li-ji-mao-event-usurp
  subject: guji-li-ji-mao
  type: political-usurpation
  date: '1388-12-01'
  year_of: 1388
  detail: 洪武二十一年十二月，黎一元弑国相陈炜于幽城外大阳坊，立叔明子日焜主国事。
- id: guji-li-ji-mao-event-territory
  subject: guji-li-ji-mao
  type: territorial-dispute
  date: '1397-01-01'
  year_of: 1397
  detail: 遣兵取思南府地，与明争丘温如嶅庆渊脱五县，明遣陈诚吕让谕还地，久不决。
- id: guji-li-ji-mao-event-daiyu
  subject: guji-li-ji-mao
  type: dynasty-founding
  date: '1400-01-01'
  year_of: 1400
  detail: 复弑日焜，立其子胡𡗨（苍），改姓名胡一元，自称太上皇，国号大虞。
- id: guji-li-ji-mao-event-enthrone
  subject: guji-li-ji-mao
  type: enfeoffment
  date: '1403-12-01'
  year_of: 1403
  detail: 明礼部郎中夏止善往封胡𡗨为安南国王，季牦父子欺瞒得封。
- id: guji-li-ji-mao-event-ambush
  subject: guji-li-ji-mao
  type: ambush
  date: '1406-02-01'
  year_of: 1406
  detail: 明送陈天平归国，季牦伏兵十余万于隘留鸡陵芹站，劫杀天平，明遂决意兴师。
- id: guji-li-ji-mao-event-captured
  subject: guji-li-ji-mao
  type: capture
  date: '1407-01-01'
  year_of: 1407
  detail: 富良江大败后，季牦父子以小舟遁走又安，为明卒所诇缚，献俘阙下，下狱。
- id: guji-li-ji-mao-event-exile
  subject: guji-li-ji-mao
  type: exile
  date: '1417-01-01'
  year_of: 1417
  is_circa: true
  detail: 久之，黎季牦释自狱，充戍广西；其子苍澄以善兵器用，累官至工部尚书。
- id: guji-li-ji-mao-event-death
  subject: guji-li-ji-mao
  type: death
  date: '1427-01-01'
  year_of: 1427
  is_circa: true
  detail: 戍广西后卒。
