  era: 元代（原安南国人，入元后仕于中国）
  reign_ref: 元世祖至元年间
  archetype: 遗民史家 / 入降士人
  dilemmas:
  - 身为安南人却随陈键出降元朝，故国与出处之间的忠节困境
  - 陈键志不伸而名泯，撰《安南志略》以伸其志、存安南史实于中土
  lesson: 身历易代与故国之变，乃以著述存一方史事，供参稽互考，使亡者之名不泯。
  summary_first_person: 我本安南爱州人，阮敷之后，幼为黎琫养子，九岁试童科，仕至侍郎。至元中随主帅陈键出降，键殁于军，我入元授奉议大夫，居汉阳。因痛陈键之志不伸，乃撰《安南志略》二十卷，以存安南事实、致其意。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6760
