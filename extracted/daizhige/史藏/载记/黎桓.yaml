person:
  qid: guji-黎桓
  name_zh: 黎桓
  names:
    zh: 黎桓
    en: Le Huan
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: year
      is_circa: true
      raw: 真宗立后寻卒（约11世纪初）
  era: 五代末至北宋初期，安南（交趾）
  reign_ref: 丁朝末年至前黎朝；受宋封安南都护、交趾郡王，真宗时进封南平王
  archetype: 权臣篡立、以兵威与朝贡双重策略自立于中夏与南越之间的藩镇枭雄
  dilemmas:
  - 佯为臣服中国以换取册封，同时暗蓄兵势、保障自立
  - 少主丁璇尚幼，擅权废锢与名分礼法之间的抉择
  lesson: 以恭顺朝贡掩其枭雄之实，弱邻之权臣可借天朝名器自固其位
  summary_first_person: 我本丁氏牙将，因少主环幼弱，遂锢而擅权，代为节度使。宋太宗怒而遣舟师步骑来讨，其军皆败，我因而岁遣使谢罪求封，卒得宋授安南都护、进封交趾郡王。我阳为服中国，实则兵伐邻郡、剽民居廪食子女。真宗立，进封我为南平王，寻卒。
