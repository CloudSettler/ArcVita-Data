  lesson: 以孤忠抗奸，以死勤事，纲常不可一日废
  summary_first_person: 吾字文孺号大洪，应山人也，牧常熟而问道东林，逢神光之际力请太子入侍、趣阁臣宿阁，泰昌移宫吾奋髯叱阉，声彻御座，天启击阉列二十四罪，知不敌而为之，虽拷死镇抚狱，初心不悔。
