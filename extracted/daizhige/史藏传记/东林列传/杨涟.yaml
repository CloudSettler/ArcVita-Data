    title_zh: 趣阁部入干清宫力主移宫
    rationale: 内廷有干清犹外廷有皇极，正名定分不可一日倒置，虽叱阍人阁臣不避
  - date: '1624-06-01'
    title_zh: 上魏忠贤二十四大罪疏
    rationale: 阉竖窃柄必杀东林，若不先发讨贼，则君父受制，虽死亦当先声夺奸
  - date: '1625-07-01'
    title_zh: 被诬熊廷弼赃不自诬伏受拷
    rationale: 受赃非实，诬伏则损清议，宁以身殉道不以赃污易节
events:
- id: guji-杨涟-event-birth
  title_zh: 诞生湖广应山
  date: '1572'
  year_of: 1572
  description_zh: 杨涟字文孺号大洪，湖广应山人，生于隆庆末万历初。
- id: guji-杨涟-event-jinshi
  title_zh: 万历丁未登进士授常熟令
  date: '1607'
  year_of: 1607
  description_zh: 万历三十五年丁未成进士，授常熟县令，政暇与士子讲道论德，徒行阡陌问民疾苦，徧知闾里利病，举循良第一。
- id: guji-杨涟-event-qinggong
  title_zh: 请太子入侍与定策考选
  date: '1620-07-01'
  year_of: 1620
  description_zh: 神宗寝疾光宗不得入侍，涟率百官问疾请阁臣宿阁，引宋文潞公诃内侍事传语王安请太子入侍；光宗谅闇奉遗诏下考选撤阉税出留中章奏，封后议起力争册立。
- id: guji-杨涟-event-yigong
  title_zh: 泰昌移宫定国本
  date: '1620-09-01'
  year_of: 1620
  description_zh: 光宗宾天选侍踞干清宫不肯出，涟趣阁部大臣趋干清宫，攘臂叱阍人而入，于朝房掖门殿廷日十数争，奋髯呌呼声彻御座，选侍乃移一号殿，太子复还干清，上语近侍胡子官真忠臣。
- id: guji-杨涟-event-heyan
  title_zh: 上疏劾魏忠贤二十四大罪
  date: '1624-06-01'
  year_of: 1624
  description_zh: 天启四年为左副都御史，力引东林正人，上二十四大罪疏劾魏忠贤，忠贤大惧与魏广微谋以涟为东林党人，群小侧目。
- id: guji-杨涟-event-death
  title_zh: 下镇抚狱拷死
  date: '1625-08-26'
  year_of: 1625
  description_zh: 天启五年为阉党诬坐故经略熊廷弼赃二万两，逮下镇抚狱，百惨备尝不自诬，拷死狱中，崇祯即位赠恤有加谥忠烈。
