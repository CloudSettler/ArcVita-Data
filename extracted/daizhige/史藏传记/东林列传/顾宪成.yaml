    start_date: '1594'
    highlight_event_id: guji-顾宪成-event-dismissal
  - key: closure
    name: 杜门省愆
    labels:
      zh: 省愆
    start_date: '1595'
    highlight_event_id: guji-顾宪成-event-dismissal
  decisions:
  - date: '1593'
    title_zh: 会推赵南星等抗疏争公道
    rationale: 吏部会推当以人望公议为据不可徇内廷私意故持疏力争以明铨选之公
  - date: '1594'
    title_zh: 忤旨不悔遂就削籍
    rationale: 既以直道事人知不可为而为之宁去官不枉道以全臣节
- id: guji-顾宪成-endeavor-2
  title_zh: 重兴东林会讲
  description: 罢官归无锡与顾允成高攀龙等寻得宋杨时东林故址重建书院制会约立讲会以明圣学正人心四方学者云集遂为天下清议所宗
  phases:
