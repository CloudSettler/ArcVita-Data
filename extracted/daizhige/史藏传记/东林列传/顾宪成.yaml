    start_date: '1612'
    highlight_event_id: guji-顾宪成-event-death
  decisions:
  - date: '1604'
    title_zh: 定东林会约以学规束众
    rationale: 讲学不可徒尚口辩当以躬行实践为的故立会约明宗旨使学者知向
  - date: 1604-10
    title_zh: 会讲不辍兼论时政得失
    rationale: 学本经世不可空谈心性故以时事相砥砺欲以清议补朝政之阙
