  dilemmas:
  - 出仕持正与归隐讲学何以抉择
  - 以清议匡时与门户朋党何以辨限
  - rect直道事君与保全善类何以兼济
  lesson: 讲学明道可正人心挽风俗然以道德相标榜易成门户朋党当以实学实行合一为要戒意气而务持平
  summary_first_person: 吾讳宪成字叔时号泾阳无锡人也少力学中万历八年进士历户部吏部本欲以至诚事君持正铨衡会推建言忤旨遂削籍归里与弟允成及高攀龙重葺宋杨龟山东林故址定会约以会讲四方从者甚众欲以讲学明理补朝阙而收人心讵料清议既张附会日广终成朋党之祸而阉祸亦由是起吾退处讲席未尝一日忘国也
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/史藏/传记/东林列传.md
  - https://daizhige.org/史藏/传记/东林列传.html
