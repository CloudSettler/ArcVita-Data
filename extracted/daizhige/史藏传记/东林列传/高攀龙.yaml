  decisions:
  - date: 1604-09-01
    title_zh: 与顾宪成刘元珍等修复东林书院
    rationale: 学不讲则圣道不明人心蔽，欲发明人心道心纲常伦理，虽触忌犹为之
  - date: 1615-01-01
    title_zh: 撰异端辨困学记及诸经孔义
    rationale: 善学孔子者无如朱子，欲以主敬格致正学脉，兼洒落主敬实践超悟而去其弊
- id: guji-高攀龙-endeavor-2
  title_zh: 秉宪护善抗击阉党
  description: 立朝虽未及数载而以清节直道护善类击奸党，掌都察院时力持公议，削籍后仍为群小所嫉，终以死全节
  phases:
  - key: brewing
    name: 初入仕途
    labels:
