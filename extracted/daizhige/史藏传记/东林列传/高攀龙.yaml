  - key: climax
    name: 削籍归野
    labels:
      zh: 去国
    start_date: 1625-08-01
    highlight_event_id: guji-高攀龙-event-dismissal
  - key: closure
    name: 遗表殉节
    labels:
      zh: 殉节
    start_date: 1626-10-02
    highlight_event_id: guji-高攀龙-event-death
  decisions:
  - date: 1621-06-01
    title_zh: 就都察院左都御史力引东林正人
    rationale: 欲以台宪清流斥邪扶正，虽知群小侧目亦孤忠自许
  - date: 1626-10-02
    title_zh: 闻缇骑逮周顺昌即作遗表投池自尽
    rationale: 臣虽削夺系大臣，大臣受辱则辱国，愿北面叩头从屈平遗则以全臣节
events:
- id: guji-高攀龙-event-birth
  title_zh: 生于无锡
  date: 1562-09-04
  year_of: 1562
  description: 明嘉靖四十一年八月初八生于南直隶无锡，号景逸，少负重望
  location: 南直隶无锡
- id: guji-高攀龙-event-jinshi
  title_zh: 万历十七年成进士
  date: 1589-04-01
  year_of: 1589
  description: 登万历己丑科进士，授官中书舍人等，立朝以直道不容于时
  location: 京师
- id: guji-高攀龙-event-donglin
  title_zh: 与顾宪成复建东林书院讲学
  date: 1604-09-01
  year_of: 1604
  description: 与顾宪成等重建无锡东林书院会讲，阐主敬格致，海内清流趋之如市，东林之名满天下
  location: 无锡东林书院
- id: guji-高攀龙-event-writings
  title_zh: 著述讲学臻于大成
  date: 1618-01-01
  year_of: 1618
  description: 撰异端辨困学记周易孔义春秋孔义高子遗书并辑朱子要语，论者谓兼陈献章洒落胡居仁主敬薛瑄实践王守仁超悟而无其弊
  location: 无锡
- id: guji-高攀龙-event-censor
  title_zh: 起为都察院左都御史
  date: 1623-01-01
  year_of: 1623
  description: 天启初起用与赵南星杨涟左光斗并执法不阿，护善类击奸党，为东林领袖
  location: 京师都察院
- id: guji-高攀龙-event-dismissal
  title_zh: 为阉党削夺归里
  date: 1625-08-01
  year_of: 1625
  description: 魏忠贤用事，织造太监李实劾周顺昌等攀龙与焉，遂削攀龙职归无锡
  location: 无锡
- id: guji-高攀龙-event-death
  title_zh: 作遗表投池殉节
  date: 1626-10-02
  year_of: 1626
  description: 缇骑将至逮周顺昌至吴门，攀龙谒道南祠作告龟山先生文，置遗表于箧曰臣虽削夺系大臣从屈平遗则，夜半整衣投后园池中死，衣冠端立如生年六十五，崇祯初赠太子少保兵部尚书谥忠宪
  location: 无锡后园池
