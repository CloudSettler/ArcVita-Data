  era: 明
  reign_ref: 天启
  archetype: 东林领袖
  dilemmas:
  - 直道孤忠与全身远祸之两难
  - 讲学明道与卷入党争之两难
  - 大臣受辱辱国与苟活偷生之抉择
  lesson: 主敬格致，护善击奸，孤忠自许，死而后已
  summary_first_person: 余高攀龙字存之号景逸无锡人也，少受主静之学，万历中举进士，与顾泾阳共复东林书院，讲孔孟主敬格致之旨，以为善学孔子者无如朱子。天启初忝掌宪纪为左都御史，力护善类击奸党，不容于阉寺群小，遂削夺归。及闻缇骑逮周蓼洲至吴门，知大臣受辱则辱国，乃拜道南祠作告龟山先生文，具遗表北面叩头从屈平遗则，投后园池水而死，庶几臣节得全而君恩可结于来生
  source_urls:
  - https://zh.wikipedia.org/wiki/高攀龙
  - https://www.zdic.net/hans/高攀龙
