  birth_date: '1474'
  death_date: '1544'
  era: 明
  reign_ref: 弘治至嘉靖
  archetype: 经世理学家与复古文宗
  dilemmas:
  - 致良知禅定盛行当随俗敷同抑或剖析天性人道之知以正圣学
  - 权阉以赂干请剥削无度当迎合保位抑或焚书抗诬虽下诏狱不恤
  - 位至九列当为弟与子冒滥名器抑或守一介取与必谨之节
  lesson: 穷理必在事为心体必验身行学以经世济用为归不以空悟为得
  summary_first_person: 余王廷相字子衡仪封人也少颖异以古文名登弘治壬戌进士与李梦阳何景明等倡复古究心典章机宜谪亳州得薛蕙而授学历御史按陕抗权阉廖镗而下狱三督学政正学术剿平四川沙保之乱修边清腾骧掌南兵部革魏国公世守之弊掌都察总团营疏止幼年监国之议老不释卷著慎言诸集以辨良知之妄终以实学自任
  source_urls:
  - 古籍原文王肃敏廷相传
endeavors:
- id: guji-王廷相-endeavor-1
  title_zh: 复古文盟与慎言理学
  summary_zh: 与李何倡古文复古究圣学矩矱得薛蕙授学辨致良知之禅著慎言诸集合六十卷以实学正人心
  phases:
  - key: brewing
    name: 京师倡古文究典章
    labels:
      zh: 弘治壬戌登进士与李梦阳何景明康海等相倡
    start_date: '1502'
    highlight_event_id: guji-王廷相-event-jinshi
  - key: breakthrough
    name: 谪亳授学
    labels:
      zh: 谪亳州判于稠人识薛蕙亲授以成其学
    start_date: '1508'
    highlight_event_id: guji-王廷相-event-bozhou
  - key: climax
    name: 辨良知剖析天人
    labels:
      zh: 指婴儿饮食视听为天性之知余皆人道之知以斥禅定乱德
    start_date: '1530'
    highlight_event_id: guji-王廷相-event-bianxue
  - key: closure
    name: 家居纂述
    labels:
      zh: 著慎言雅述沟断台史等集合六十卷奏议三十卷
    start_date: '1540'
    highlight_event_id: guji-王廷相-event-zhushu
  decisions:
  - date: '1508'
    title_zh: 谪亳亲授薛蕙
    rationale: 不以谪宦自废圣学择可传矩矱者尽心授受以成实学之基
  - date: '1530'
    title_zh: 力辨致良知混禅
    rationale: 致良知几以禅定乱德当分天性人道之知使学者不驰于空悟而务于习悟穷理
- id: guji-王廷相-endeavor-2
  title_zh: 宦历风节与经世匡济
  summary_zh: 历给事御史督学按察巡抚兵部都察抗权阉平冦剿夷修边革世守制度疏止监国以廉慎济人为务
  phases:
  - key: brewing
    name: 科道风纪
    labels:
      zh: 授兵科给事督学北畿焚权阉三王二刘贿书
    start_date: '1502'
    highlight_event_id: guji-王廷相-event-jinshi
  - key: breakthrough
    name: 按陕抗阉下狱
    labels:
      zh: 按陕西严禁廖镗朘削被诬逮诏狱谪赣榆县丞
    start_date: '1512'
    highlight_event_id: guji-王廷相-event-shaanxi
  - key: climax
    name: 抚蜀平乱督边
    labels:
      zh: 巡抚四川剿平沙保向信晋兵侍督修边清腾骧
    start_date: '1528'
    highlight_event_id: guji-王廷相-event-sichuan
  - key: closure
    name: 南枢革制总营谏监国
    labels:
      zh: 晋南兵部尚书请革魏国公久专守备召掌都察总十二团营疏止太子幼年监国
    start_date: '1532'
    highlight_event_id: guji-王廷相-event-nanjing
  decisions:
  - date: '1512'
    title_zh: 焚书抗阉严禁朘削
    rationale: 内臣恃势朘削军民若开贿赂之门则法废将引使者于庭焚书示不可干
  - date: '1538'
    title_zh: 疏止太子监国
    rationale: 太子春秋方幼知虑未普一旦御事恐壅蔽生后虽觉无及当待学成
  - date: '1532'
    title_zh: 奏革魏国公专守
    rationale: 祖宗根本重地守备重权不宜久属一家当如各处文武推代以防专擅
events:
- id: guji-王廷相-event-birth
  title_zh: 生于仪封
  date: '1474'
  year_of: '1474'
  kind: birth
  summary_zh: 成化十年生于仪封生而颖异十三补邑庠以古文诗赋名
- id: guji-王廷相-event-jinshi
  title_zh: 弘治壬戌登进士授兵科给事中
  date: '1502'
  year_of: '1502'
  kind: career
  summary_zh: 弘治十五年壬戌登进士由庶吉士授兵科给事中与李梦阳何景明等倡古文究心典章机宜圣学矩矱
- id: guji-王廷相-event-bozhou
  title_zh: 谪亳州判识薛蕙授学
  date: '1508'
  year_of: '1508'
  kind: career
  summary_zh: 谪亳州判于稠人中识薛蕙亲授以成其学寻知高淳赐环
- id: guji-王廷相-event-shaanxi
  title_zh: 按陕西抗廖镗下诏狱谪赣榆
  date: '1512'
  year_of: '1512'
  kind: career
  summary_zh: 晋御史按陕西严禁权阉廖镗朘削先曾焚三王二刘贿书至是被诬奏逮系诏狱举朝论救谪赣榆县丞
- id: guji-王廷相-event-sichuan
  title_zh: 巡抚四川剿平沙保向信
  date: '1528'
  year_of: '1528'
  kind: career
  summary_zh: 以湖广按察晋山东布政丁忧著丧礼备纂巡抚四川剿平夷沙保向信三巴震撼悉平
- id: guji-王廷相-event-nanjing
  title_zh: 晋南兵部尚书革守备世专
  date: '1532'
  year_of: '1532'
  kind: career
  summary_zh: 晋兵部侍郎督修边工清腾骧晋南京兵部尚书奏祖宗根本守备不宜久属魏国专司请推代上嘉纳更置自此始
- id: guji-王廷相-event-bianxue
  title_zh: 著论辨致良知
  date: '1530'
  year_of: '1530'
  kind: career
  summary_zh: 斥世儒致良知近禅定谓婴儿胞中饮食出胞视听乃天性之知余皆因习因悟因过因疑之人道之知
- id: guji-王廷相-event-zhushu
  title_zh: 著述纂集
  date: '1540'
  year_of: '1540'
  kind: career
  summary_zh: 好集书老不释卷著沟断集台史集慎言雅述等六十卷奏议公移三十卷皆渊源道德硏精礼乐
- id: guji-王廷相-event-death
  title_zh: 卒赠少保谥肃敏
  date: '1544'
  year_of: '1544'
  kind: death
  summary_zh: 嘉靖二十三年卒年七十一隆庆初赠少保谥肃敏位九列而弟与子犹布衣一介取与必谨
