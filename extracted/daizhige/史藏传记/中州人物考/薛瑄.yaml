person:
  qid: guji-薛瑄
  name_zh: 薛瑄
  names:
    zh: 薛瑄
    en: Xue Xuan
  lifespan:
    birth:
      date: '1389'
      precision: year
      is_circa: false
      raw: 洪武二十二年
    death:
      date: '1464-06-15'
      precision: day
      is_circa: false
      raw: 天顺八年甲申六月十五日
  birth_date: '1389'
  death_date: '1464-06-15'
  era: 明
  reign_ref: 永乐至天顺
  archetype: 理学宗师
  dilemmas:
  - 权宦当朝时当折节私谒以保官途还是守正不阿以明风宪
  - 出仕显达与归隐讲学何者更能明道济世
  lesson: 居敬穷理为要，凡辞受取与必揆诸义，守正不阿，辩冤死亦无愧
  summary_first_person: 余河津薛瑄字德温号敬轩，少厌科举慨求圣贤之道，师濂洛关闽以居敬穷理为要。忝为御史提学山东以白鹿洞规教士，历大理卿辨冤忤振几死，浸狱读易自若。后入阁不以私谒事权贵，见曹石用事即引疾归，家居讲学八年，七十六年无一事此心惟觉性天通。
  source_urls:
  - https://github.com/daizhige-org/daizhigev20/blob/data/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%AD%E5%B7%9E%E4%BA%BA%E7%89%A9%E8%80%83.md
  - https://daizhige.org/%E5%8F%B2%E8%97%8F/%E4%BC%A0%E8%AE%B0/%E4%B8%AD%E5%B7%9E%E4%BA%BA%E7%89%A9%E8%80%83.html
