    start_date: '1440'
    highlight_event_id: guji-薛瑄-event-jiaju-jiangxue
  - key: closure
    name: 晚年玩心高明著书
    labels:
      zh: 收束
    start_date: '1457'
    highlight_event_id: guji-薛瑄-event-zhishi
  decisions:
  - date: '1421'
    title_zh: 辞杨士奇馆训之邀
    rationale: 不欲以私门训子为业，愿就教职以明道
  - date: '1436'
    title_zh: 欣然就提学山东
    rationale: 以为此吾事也，遂以朱子白鹿洞学规示学者，先力行后文艺
  - date: '1457'
    title_zh: 拒石亨请勅敷教并资养
    rationale: 引许鲁斋悬勅不示人之义，若受其养何如不辞官，守辞受之义
- id: guji-薛瑄-endeavor-2
  title_zh: 风宪司法与守正抗阉
  summary: 为御史大理卿持法明允，面斥王振金英兴安诸阉，不私谒不纳馈，辨冤驳狱几死不悔，维系风纪
  phases:
  - key: brewing
    name: 御史纠劾不私见
    labels:
      zh: 酿造
    start_date: '1428'
    highlight_event_id: guji-薛瑄-event-yushi
  - key: breakthrough
    name: 辨冤驳狱忤振
    labels:
      zh: 突破
    start_date: '1439'
    highlight_event_id: guji-薛瑄-event-bianyan-xiayu
  - key: climax
    name: 南京大理卿拒中官
    labels:
      zh: 高潮
    start_date: '1450'
    highlight_event_id: guji-薛瑄-event-nanjing-dali
  - key: closure
    name: 内阁守正引疾归
    labels:
      zh: 收束
    start_date: '1457'
    highlight_event_id: guji-薛瑄-event-ruge
  decisions:
  - date: '1428'
    title_zh: 拒见三杨与王振
    rationale: 职在纠劾无相见私门之礼，安有受爵公朝拜官私门
  - date: '1439'
    title_zh: 三驳王山诬杀案
    rationale: 明知承振风旨必死而坚持辩冤，读易自若死亦何愧
  - date: '1450'
    title_zh: 拒守备中官兴安馈扇与金英宴请
    rationale: 以朝廷礼不可私受，不往江上饯行以示风节
events:
- id: guji-薛瑄-event-birth
  title_zh: 生于河津
  date: '1389'
  year_of: '1389'
  location: 山西河津
  description: 祖仲义通经史，父贞为鄢陵教谕，母齐氏梦紫衣人谒见而生，肌肤如水晶五脏皆见
- id: guji-薛瑄-event-xiangshi
  title_zh: 中永乐庚子解元
  date: '1420'
  year_of: '1420'
  location: 河南
  description: 从父在鄢陵，强应河内乡试遂中第一
- id: guji-薛瑄-event-jinshi
  title_zh: 登辛丑进士辞馆选
  date: '1421'
  year_of: '1421'
  location: 京师
  description: 登进士第，学士杨士奇欲馆训诸子固辞，居父丧服阕愿就教职
- id: guji-薛瑄-event-yushi
  title_zh: 擢云南道御史监湖广银场
  date: '1428'
  year_of: '1428'
  location: 湖广
  description: 宣宗思得良宪臣振励风纪，擢御史，三杨使人要见以职在纠劾辞不往，手录性理大全雪盈尺不辍
- id: guji-薛瑄-event-tixue
  title_zh: 提学山东以白鹿洞规教士
  date: '1436'
  year_of: '1436'
  location: 山东
  description: 正统改元初设提学，郭琎荐瑄，首以朱子白鹿洞学规开示，诸生呼为薛夫子，王振问三杨谁可大用皆荐瑄
- id: guji-薛瑄-event-bianyan-xiayu
  title_zh: 任大理少卿辨冤忤王振下狱论死
  date: '1439'
  year_of: '1439'
  location: 京师
  description: 为大理右少卿转左，辨指挥妾诬妻毒夫案三驳都察院，王文承振旨劾受贿出人死诏缚市杀之，怡然读易，振老仆哭厨下得解，王伟申救免死家居六年
- id: guji-薛瑄-event-jiaju-jiangxue
  title_zh: 家居六年从游百余人
  date: '1440'
  year_of: '1440'
  location: 河津
  description: 造诣益邃，江陕弟子来学百余人，阎禹锡徒步来学，告以居敬穷理为要
- id: guji-薛瑄-event-nanjing-dali
  title_zh: 升南京大理寺卿抗中官
  date: '1450'
  year_of: '1450'
  location: 南京
  description: 景泰初升南京大理卿，守备中官兴安袁诚叹为与振作对头者，午节馈扇以朝廷礼拒之，中官金英过南京公卿饯江上独不往，御史刘孜荐供馆阁不允
- id: guji-薛瑄-event-ruge
  title_zh: 入内阁兼翰林学士主会试
  date: '1457'
  year_of: '1457'
  location: 京师
  description: 英庙复位以礼部右侍郎兼翰林学士入内阁，召入便殿候上易燕服乃见，论许鲁斋不陈伐宋谋，主考会试以正学复性为序，曹石用事引疾致仕
- id: guji-薛瑄-event-zhishi
  title_zh: 致仕家居讲学
  date: '1457-09-01'
  year_of: '1457'
  location: 河津
  description: 居家八年四方学者从游甚众，随寓图书箴规不释卷，辞受一毫不苟，作诗七十六年无一事此心惟觉性天通
- id: guji-薛瑄-event-death
  title_zh: 衣冠危坐而逝
  date: '1464-06-15'
  year_of: '1464'
  location: 河津
  description: 遘疾衣冠危坐而逝，时风雷大作白气上升，年七十六，赠礼部尚书谥文清，著读书录河汾集，成化隆庆间从祀孔庙
