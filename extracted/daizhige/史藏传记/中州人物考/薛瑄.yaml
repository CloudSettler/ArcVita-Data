  title_zh: 濂洛讲学与理学著述
  summary: 师法濂洛关闽，以居敬穷理立教，提学山东成全人才，家居授徒著读书录河汾集，开明代理学一脉
  phases:
  - key: brewing
    name: 少厌科举求道
    labels:
