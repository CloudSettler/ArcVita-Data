  birth_date: '1130-10-18'
  death_date: '1200-04-23'
  era: 宋
  reign_ref: 南宋·高宗至宁宗
  archetype: 理学宗师
  dilemmas:
  - 道学理想与仕途进退之艰：屡辞召命又屡遭弹劾，如何在伪学之禁中持守正学
  - 集注群经与尊崇圣言之衡：欲会通周程张载之义理，又恐以己意夺圣人之意
  lesson: 格物穷理必以居敬涵养为本，知行并进、读书躬行方能成己成物
  summary_first_person: 吾讳熹字仲晦，幼承家学，师事李延平得闻伊洛渊源，中年尝历州县而志在讲学，筑室考亭、重建白鹿，集注四书以明理一分殊之旨，虽遭庆元党禁目为伪学而讲论不辍，愿后学以穷理居敬为要，循序渐进以至圣贤
  source_urls:
  - https://zh.wikipedia.org/wiki/朱熹
endeavors:
- id: guji-朱熹-endeavor-1
  title_zh: 集注四书与理学体系建构
  summary: 会通周敦颐张载二程之说，以理气心性为核心，注四书易诗，建构理一分殊的理学正统，为后世程朱理学奠基
  phases:
  - key: brewing
    name: 师承潜心
    labels:
      zh: 师事李侗
    start_date: '1153-01-01'
    highlight_event_id: guji-朱熹-event-jinshi
  - key: breakthrough
    name: 著述开端
    labels:
      zh: 四书集注初成
    start_date: '1172-01-01'
    highlight_event_id: guji-朱熹-event-sishu
  - key: climax
    name: 体系大成
    labels:
      zh: 朱子语类编次
    start_date: '1185-01-01'
    highlight_event_id: guji-朱熹-event-yulei
  - key: closure
    name: 定论流传
    labels:
      zh: 晚年定稿
    start_date: '1198-01-01'
    highlight_event_id: guji-朱熹-event-death
  decisions:
  - date: '1172-06-01'
    title_zh: 决定以四书为教本重作章句集注
    rationale: 以大学中庸为入德之门，补二程未竟之业，使学者有阶梯可循，不堕于词章
  - date: '1182-09-01'
    title_zh: 拒绝词章取誉专注义理之学
    rationale: 时文浮薄不足以明道，欲以穷理格物挽回士风，确立道学正统
- id: guji-朱熹-endeavor-2
  title_zh: 书院讲学与门人培育
  summary: 重建白鹿洞书院、会讲岳麓鹅湖，制订学规、兴社仓，以书院为基地培养闽学门人，开南宋讲学之风，门人遍布建安建阳
  phases:
  - key: brewing
    name: 出仕历练
    labels:
      zh: 同安主簿
    start_date: '1154-01-01'
    highlight_event_id: guji-朱熹-event-nankang
  - key: breakthrough
    name: 书院重兴
    labels:
      zh: 重建白鹿洞
    start_date: '1179-01-01'
    highlight_event_id: guji-朱熹-event-bailudong
  - key: climax
    name: 鹅湖岳麓会讲
    labels:
      zh: 论学陆九渊
    start_date: '1175-01-01'
    highlight_event_id: guji-朱熹-event-ehu
  - key: closure
    name: 考亭授徒
    labels:
      zh: 筑室考亭
    start_date: '1183-01-01'
    highlight_event_id: guji-朱熹-event-kaoting
  decisions:
  - date: '1179-04-01'
    title_zh: 奏请复兴白鹿洞书院并颁学规
    rationale: 官学拘于科举不足以育真才，欲立书院以存道统、化民成俗
  - date: '1194-02-01'
    title_zh: 庆元党禁下坚持讲学不辍
    rationale: 道学被目为伪学亦不可因祸福而变节，当讲明义理以待后世
