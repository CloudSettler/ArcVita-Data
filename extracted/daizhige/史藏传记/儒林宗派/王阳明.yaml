  description: 奉命巡抚两广总督军务讨平思恩田州瑶乱疏请设立流官推行新制靖边而返
  location: 广西思田
  is_circa: false
- id: guji-王阳明-event-death
  date: '1529-01-09'
  year_of: '1529'
  title_zh: 卒于南安舟中
  description: 嘉靖七年十一月二十九日班师北归病革舟次江西南安知军问遗言曰此心光明亦复何言遂卒年五十七隆庆时赠新建侯谥文成
  location: 江西南安青龙埠舟中
