  - date: '1519-07-20'
    title_zh: 举兵勤王赴南昌
    rationale: 宁王宸濠举兵若据南京则江南糜烂当机立断以偏师捣其巢穴夺其先机
  - date: '1519-08-28'
    title_zh: 鄱阳湖决战擒宸濠
    rationale: 不以持重而以奇正相生示弱诱敌水陆并进一举擒王以绝后患
  - date: '1527-11-01'
    title_zh: 奏请告归不恋军功
    rationale: 事功虽显然功高易忌且欲归讲学以明致良知之志不以爵赏为心
events:
