    title_zh: 龙场反观悟心即理
    rationale: 贬谪艰困中舍外求而反求诸心断定心外无物心外无理为心学奠基
  - date: '1521-12-01'
    title_zh: 拈出致良知三字
    rationale: 以良知为天理之昭明灵觉处为修学一了百当之宗旨收束心即理之工夫
- id: guji-王阳明-endeavor-2
  title_zh: 戡乱平藩的事功实践
  summary: 以知行合一之旨经略南赣平定宁王宸濠之乱再抚思田瑶乱以事功验心学
