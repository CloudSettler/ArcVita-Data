  date: '1175-06-01'
  year_of: '1175'
  location: 信州鹅湖寺
  description: 与朱熹、吕祖谦及兄九龄会于鹅湖，论为学之方，朱主即物穷理，己主发明本心，分歧遂显
- id: guji-陆九渊-event-xiangshan
