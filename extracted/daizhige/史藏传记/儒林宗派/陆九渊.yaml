  date: '1188-01-01'
  year_of: '1188'
  location: 象山精舍
  description: 筑精舍于贵溪象山，聚徒讲学，标举先立乎其大、宇宙便是吾心之旨，学者云集，陆氏学派以成
- id: guji-陆九渊-event-jingmen
