  dilemmas:
  - 心即理与程朱性理之辨
  - 鹅湖论辩后坚持简易直截还是调和折衷
  - 出仕经世与退隐讲学立教之抉择
  lesson: 心即理也，学贵先立乎其大，发明本心简易直截，不假外求
  summary_first_person: 吾陆九渊字子静，号象山，金谿人也。少与兄九韶、九龄讲学，悟得宇宙即吾心、吾心即宇宙之义。与朱子会于鹅湖，辨无极太极虽异而所争者在道之本心。晚筑象山精舍，聚徒讲授，欲使学者先立本心，不为训诂支离所蔽，守此简易以终身。
  source_urls:
  - https://zh.wikipedia.org/wiki/陆九渊
