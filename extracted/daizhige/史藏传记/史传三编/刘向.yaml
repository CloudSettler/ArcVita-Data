  lesson: 以经术比附灾异、以忠诚直谏匡正君心，虽数被枉而不改其志。
  summary_zh: 西汉经学家、目录学家，校中秘书，作洪范五行传论、列女传、新序说苑，封事数十上。
  summary_first_person: 吾本楚元王之后，以经术事宣帝、元帝、成帝，三世更迭，外戚日盛，吾以春秋灾异推言得失，虽系狱免官，犹上封事不已。
