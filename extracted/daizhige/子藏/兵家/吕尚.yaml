  - key: climax
    name_zh: 作金人铭与太公金匮
    labels:
      zh: 三缄其口
    start_date: '-1035'
    highlight_event_id: guji-吕尚-event-5
  decisions:
  - date: '-1040'
    title_zh: 述五帝之戒，劝武王书铭随身自诫
    rationale: 道自微而生，祸自微而成，慎终与始，完如金城
  - date: '-1035'
    title_zh: 著《太公金匮》载金人铭
    rationale: 毋多言，毋多事，多言多败，多事多害
events:
- id: guji-吕尚-event-birth
  date: 约-1150
  year_of: -1150
  title: 吕尚诞生
  description: 吕尚生于商末，后为周之太师，号太公望、师尚父。
- id: guji-吕尚-event-death
  date: 约-1010
  year_of: -1010
  title: 吕尚逝世
  description: 吕尚卒，身后以《太公金匮》等谋略之言垂世。
- id: guji-吕尚-event-1
  date: '-1120'
  year_of: -1120
  title: 答武王可伐之问
  description: 武王问殷已亡其三人，今可伐乎？太公答以天与不取反受其咎，时至不行反受其殃。
- id: guji-吕尚-event-2
  date: 约-1046
  year_of: -1046
  title: 牧野决战，雷电应天
  description: 武王师到牧野，阵未毕而暴风疾雨雷电幽冥，太公断为吾军动应天也。
- id: guji-吕尚-event-3
  date: '-1042'
  year_of: -1042
  title: 画射丁侯，四夷来贡
  description: 丁侯不朝，尚父画丁侯三旬射之，丁侯病剧请降；四夷闻之各以其职来贡，越裳氏献白雉。
- id: guji-吕尚-event-4
  date: '-1040'
  year_of: -1040
  title: 述五帝之戒，劝武王随身书铭
  description: 武王随师尚父之言，因书铭随身自诫，冠、履、剑、镜、车、几、杖诸铭皆出此。
- id: guji-吕尚-event-5
  date: '-1035'
  year_of: -1035
  title: 金人三缄其口之铭传世
  description: 周太庙右阶之前有金人三缄其口，铭其背曰我古之慎言人也，世谓太公作金人与《太公金匮》。
