  name_zh: 吕尚
  names:
    zh: 吕尚
    en: Lü Shang
  lifespan:
    birth:
      date: -1150
      precision: year
      is_circa: true
      raw: 生卒年不详，约商末周初
    death:
      date: -1010
      precision: year
      is_circa: true
  birth_date: 约-1150
  death_date: 约-1010
  era: 商末周初
  reign_ref: 周文王、周武王时期
  archetype: 谋略家·开国师佐
  dilemmas:
  - 忠谏可获罪于无道之君，明哲保身与直言尽忠难以两全
  - 伐纣时机难觅，先谋后事抑或先事后谋关乎成败
  - 天命与民意之辨，敬畏天神与 naw 治民安须并行
  lesson: 知天者不怨天，知己者不怨人；先谋后事者昌，先事后谋者亡
  summary_first_person: 我吕尚，即太公望、师尚父，佐文王、武王识天道、谋伐纣，以慎言慎行垂诫于君，终成周室开国之大业。
  source_urls:
  - 太公金匮
