  - date: '-1119'
    title_zh: 劝武王先谋后事，待时而伐殷
    rationale: 知天者不怨天，知己者不怨人；天与不取反受其咎，时至不行反受其殃
  - date: -1046-01-20
    title_zh: 牧野阵未毕而暴风疾雨，断为应天之举
    rationale: 雷电幽冥乃吾军动应天之兆，坚定军心继续作战
  - date: '-1042'
    title_zh: 画丁侯而射之，使其举国为臣虏
    rationale: 不战而屈人之兵，四夷闻之皆惧，各以其职来贡
