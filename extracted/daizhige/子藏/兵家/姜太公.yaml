person:
  qid: guji-jiangtaigong
  name_zh: 姜太公
  names:
    zh: 姜太公、太公、尚父、太公望
    en: Jiang Taigong (DukeTai of Qi, Jiang Ziya)
  lifespan:
    birth:
      date: -1150
      precision: year
      is_circa: true
      raw: 生年不详，相传约殷末
    death:
      date: -1015
      precision: year
      is_circa: true
      raw: 卒年不详，相传年百余岁
  birth_date: -1150
  death_date: -1015
  era: 商末周初
  reign_ref: 周武王、周成王时期
  archetype: 谋略之师 / 开国辅臣
  dilemmas:
  - 刑赏之道：如何以轻罚重威、少赏劝善
  - 治国之道：贤君与亡国之君的分野
  lesson: 内宽外仁，言行相副；安不忘危，存不忘亡
  summary_first_person: 我为周武王之师，尚父之号，论贤君治国不以私害公，明杀一惩万、赏一劝众之威福，并以五帝之戒警王以临深履薄之心。
  source_urls:
  - https://zh.wikisource.org/wiki/太公阴谋
endeavors:
- id: guji-jiangtaigong-endeavor-1
  name_zh: 辅佐武王论政。
  phases:
  - key: brewing
    name_zh: 出山佐周
    labels:
      zh: 渭滨遇合
    start_date: -1060
    highlight_event_id: guji-jiangtaigong-event-consult-1
  - key: breakthrough
    name_zh: 论贤君治国
    labels:
      zh: 对问治国之法
    start_date: -1046
    highlight_event_id: guji-jiangtaigong-event-consult-1
  - key: climax
    name_zh: 佐克殷并建策
    labels:
      zh: 灏周立政
    start_date: -1046
    highlight_event_id: guji-jiangtaigong-event-consult-2
  - key: closure
    name_zh: 五帝之戒与造铭垂训
    labels:
      zh: 监戒传承
    start_date: -1040
    highlight_event_id: guji-jiangtaigong-event-consult-3
  decisions:
  - date: -1046
    title_zh: 对武王问治国之法
    rationale: 主张不以私害公，赏不加无功，罚不加无罪，法不废仇雠、不避所爱
  - date: -1045
    title_zh: 对武王问轻罚重威之术
    rationale: 杀一人而千人惧者杀之，赏一人而千人喜者赏之，以一惩万、以一劝众
  - date: -1044
    title_zh: 对武王问五言之教
    rationale: 内宽外仁、言行相副、敬贤用谏、敬接不肖、通否泰顺时容养
  - date: -1043
    title_zh: 述五帝之戒以警新并殷之王
    rationale: 黄帝摇摇、尧振振、舜兢兢、禹栗栗、汤战战，王者当翼翼惧不敢怠
events:
- id: guji-jiangtaigong-event-birth
  title_zh: 姜太公出生
  date: -1150
  year_of: -1150
  participants:
  - guji-jiangtaigong
  summary: 约商末出生，生年不详。
- id: guji-jiangtaigong-event-consult-1
  title_zh: 对武王论贤君治国之法
  date: -1046
  year_of: -1046
  participants:
  - guji-jiangtaigong
  - 周武王
  summary: 太公对曰贤君不以私害公，赏不加无功，罚不加无罪，不因怒以诛、不因喜以赏；并列举亡国之君之政以相警示。
- id: guji-jiangtaigong-event-consult-2
  title_zh: 对武王论刑赏威福之道
  date: -1045
  year_of: -1045
  participants:
  - guji-jiangtaigong
  - 周武王
  summary: 太公言杀一以惩万、赏一而劝众，简令而众皆化之道，此明军之威福。
- id: guji-jiangtaigong-event-consult-3
  title_zh: 述五帝之戒并警新并殷之王
  date: -1043
  year_of: -1043
  participants:
  - guji-jiangtaigong
  - 周武王
  summary: 尚父述黄帝至汤之戒，皆临深履薄之惧；王曰新并殷，翼翼惧不敢怠。
- id: guji-jiangtaigong-event-couplet-ming
  title_zh: 传衣镜觞之铭与机之书
  date: -1040
  year_of: -1040
  participants:
  - guji-jiangtaigong
  summary: 《太公阴谋》载武王衣铭、镜铭、觞铭，及机之书曰安不忘危、存不忘亡，垂训后世。
- id: guji-jiangtaigong-event-death
  title_zh: 姜太公去世
  date: -1015
  year_of: -1015
  participants:
  - guji-jiangtaigong
  summary: 卒年不详，相传年百余岁而终。
