    death:
      date: -1015
      precision: 年
      is_circa: true
      raw: 约西周初（卒年不详）
  birth_date: 约-1150
  death_date: 约-1015
  era: 商末周初
  reign_ref: 周文王、周武王时期
  archetype: 开国军师 / 兵学鼻祖
  dilemmas:
  - 垂钓渭滨待时，须判断文王是否为可辅之主
  - 商虐民困，谋伐取天下须待天殃人灾之机，不可先倡
  - 助周得天下后须定国安民，权衡同利与专权之道
  lesson: 天下非一人之天下，乃天下之天下；同天下之利者则得天下。
  summary_first_person: 吾乃姜尚，钓于渭阳而遇文王，以'天下为天下人之天下'之说见重，被立为师。吾佐文王修德惠民，观商之亡征，教以文伐十二节、攻强离亲之谋；复佐武王讲论兵道，论将选才，立将授钺，以仁义爱民与谋略不测之术相济，为周室翦商定国之倚仗。
  source_urls:
  - guji://liutao/wentao
