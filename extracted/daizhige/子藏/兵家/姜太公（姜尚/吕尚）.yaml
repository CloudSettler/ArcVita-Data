  decisions:
  - date: 约-1055
    title: 应文王之聘，载与俱归
    rationale: 文王斋戒田猎渭阳，亲访于茅蒲之上；吾以钓喻政，言禄饵取人之权，文王再拜，遂立为师，倾心相托。
- id: guji-姜尚-endeavor-2
  name_zh: 佐周翦商定业
  phases:
  - key: brewing
    name_zh: 观衅修德
    labels:
