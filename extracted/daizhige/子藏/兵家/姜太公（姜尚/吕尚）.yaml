  decisions:
  - date: 约-1050
    title: 谏文王不可先倡，必见天殃人灾乃可谋
    rationale: 商虐虽极，然天道未殃、人道未灾，先谋则失机；故先修德下贤惠民，以观天道人事之变。
  - date: 约-1045
    title: 献文伐十二节之策
    rationale: 商之野草菅胜谷、吏暴虐残疾，亡国之时已见；以因其所喜、亲其所爱、赂其左右等十二节阴坏其国，乃成武事。
  - date: 约-1040
    title: 教武王以兵道'一'与速击不意之术
    rationale: 兵凶器，不得已而用之，须外乱内整、阴其谋密其机，密察敌机疾乘其利，复疾击其不意。
  - date: 约-1030
    title: 辅文王武王垂教后世
    rationale: 明传六守三宝、举贤赏罚、守土爱民之道，义胜欲则昌，敬胜怠则吉，为传子孙之至道。
events:
- id: guji-姜尚-event-birth
  date: 约-1150
  type: birth
  year_of: -1150
  title: 姜尚约生于商末
  description: 姜尚（吕尚）生年史无明文，推测约当商朝晚期。
- id: guji-姜尚-activity-1
  date: 约-1060
  type: activity
  year_of: -1060
  title: 钓于渭水之阳
  description: 隐居渭滨，垂钓茅蒲，自言君子乐得其志，以渔喻禄饵取人之权，静待明主。
- id: guji-姜尚-activity-2
  date: 约-1055
  type: activity
  year_of: -1055
  title: 文王猎渭阳遇太公
  description: 文王斋三日乘田车田于渭阳，见太公坐茅以渔，问渔之似，太公道'天下非一人之天下，同天下之利者得天下'，文王再拜载归，立为师。
- id: guji-姜尚-activity-3
  date: 约-1050
  type: activity
  year_of: -1050
  title: 论天下兴衰与为国务本
  description: 对文王言盈虚祸福在君不在天时， revea尧之节俭爱民；申述爱民之法——利而勿害、薄赋俭宫、清风吏，立为政之本。
- id: guji-姜尚-activity-4
  date: 约-1045
  type: activity
  year_of: -1045
  title: 陈文伐十二节之谋
  description: 对文王详陈因其所喜、亲其所爱、阴赂左右、辅其淫乐等十二节，塞其明然后伐之。
- id: guji-姜尚-activity-5
  date: 约-1040
  type: activity
  year_of: -1040
  title: 佐武王论兵立制
  description: 向武王讲兵道莫过于一，论将有五材十过，取将用八征之法，陈王翼七十二股肱之制，及立将授钺之礼。
- id: guji-姜尚-activity-6
  date: 约-1030
  type: activity
  year_of: -1030
  title: 明传先圣至道
  description: 文王寝疾，太公对答道之所止与所起-------见善而怠、时至而疑、知非而处三者道之止；柔静恭敬、强弱忍刚四者道之起，垂为明传。
- id: guji-姜尚-event-death
  date: 约-1015
  type: death
  year_of: -1015
  title: 姜尚约卒于西周初年
  description: 佐周室定国之后寿终，卒年不详，后世尊为兵家之祖。
