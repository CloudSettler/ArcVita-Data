  dilemmas:
  - 救鲁须游说强齐转兵伐吴，扩张战乱而存母国
  - 说吴伐齐又须防吴灭越，借勾践之力诱吴王出征
  - 劝晋备兵待吴，坐观齐吴两败以强晋
  lesson: 一人之口舌可移四国之兵，说客成功贵在知各国君臣之患而因其势导之
  summary_first_person: 我是孔门弟子子贡。田常欲伐鲁，夫子命我出行。我以忧在内者攻强之说，使田常转兵伐吴；说吴王救鲁伐齐，又为越王谋报吴之机，更劝晋君修兵以待。吴破齐而败于晋，越遂灭吴而霸。我一出而存鲁、乱齐、破吴、强晋、霸越。
  source_urls:
  - 《间书·间论·子贡》引《孔子家语·屈节解》
