  title_zh: 吴破齐师于艾陵
  detail: 吴王发九郡之兵与齐战于艾陵，大破齐师，获七将军之兵，其后以兵临晋，与晋相遇黄池，晋人大败吴师。
  location: 艾陵
- id: guji-zigong-event-wu-fall
