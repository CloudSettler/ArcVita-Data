  date: '617'
  year_of: 617
  summary_zh: 霍邑之战，义师初交锋少却，太宗亲以铁骑自南原驰下横突，宋老生兵断后大溃被擒，以奇为正，暗合孙吴。
- id: guji-李世民-event-qizheng
  person: guji-李世民
  type: endeavor
  date: '630'
  year_of: 630
  is_circa: true
  summary_zh: 与李靖反复问对，究奇正相变、虚实之形，悟'致人而不致于人'之要，又作《破陈乐舞》以寓八陈四头八尾之制。
- id: guji-李世民-event-gaoli
  person: guji-李世民
  type: endeavor
  date: '645'
  year_of: 645
  summary_zh: 高丽数侵新罗、不奉诏，太宗与靖论讨伐之策，靖请以正兵致敌。
- id: guji-李世民-event-beihuang
  person: guji-李世民
  type: endeavor
  date: '646'
  year_of: 646
  is_circa: true
  summary_zh: 幸灵州回，北荒悉平，命道宗、李勣等讨薛延陀，又与靖论蕃汉杂处经久之策，置驿六十六处通斥候。
- id: guji-李世民-event-death
