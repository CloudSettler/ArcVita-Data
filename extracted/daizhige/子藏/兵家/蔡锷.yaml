  era: 清末民国
  reign_ref: 宣统 / 民国
  archetype: 军事家 / 护国元勋
  dilemmas:
  - 身膺军职，欲救国渡民，然强邻环伺、内乱频仍，以死为归宿，志愿难达万一
  lesson: 以良心血性驱使行事，耿耿精忠，百折不磨，方可渡同胞于苦海、置国家于坦途
  summary_first_person: 我松坡一生以救国为目的，以死为归宿。辛亥之春应李公之召参戎职于云南，时片 马交涉方殷、瓜分谣诼忽起，我厉兵秣马，赴机待死。因钟公有嘱，我编《曾胡治兵语 录》以代精神讲话，就曾、胡两公治兵言论分类凑辑、附以按语，冀同袍列校身体力
    行。后来护国军起，使民国生死肉骨，此皆良心血性二者所驱使也。
