  era: 战国末期
  reign_ref: 秦王政时期
  archetype: 法家思想家
  dilemmas:
  - 屡谏韩王而不用，忠言难达于故国
  - 入秦之后，存韩之志与事秦之身相冲突，终遭李斯、姚贾构陷
  lesson: 精于揣摩人情世态者未必能自脱祸患，立言当折衷于理，不可逞私智欺世盗名
  summary_first_person: 我韩非为韩国宗室，见韩削弱，数以书谏韩王而不用，遂作《孤愤》《五蠹》《内外储》《说林》《说难》十余万言。书传至秦，秦王悦之，然李斯、姚贾害我，下吏治罪，使我自杀于狱中。
  source_urls:
  - https://zh.wikisource.org/wiki/韓非子
