  detail: 大明重整旧山河，力挽狂澜，功迈张良。
- id: guji-yuqian-event-death
  date: '1457'
  year_of: 1457
  type: death
  title_zh: 于肃愍公临刑
  detail: 临刑谓刑者且停刀得完一诗：庄椿居士老维摩，做尽人间好事多；正统已添新岁月，大明重整旧山河；功过吕望扶周室，德迈张良散楚歌；顾我于今归去也，白云堆里笑呵呵。另有说临刑但云皇天后土可表此心者三四，同刑都御史王文在侧，云斫头就斫头，何用多言。
