person:
  qid: guji-元昊
  name_zh: 元昊
  names:
    zh: 元昊、拓跋元昊
    en: Yuanhao (Emperor Jingzong of Western Xia)
  lifespan:
    birth:
      date: '1003'
      precision: year
      is_circa: true
      raw: ''
    death:
      date: '1048'
      precision: year
      is_circa: true
      raw: ''
  birth_date: '1003'
  death_date: '1048'
  era: 北宋西夏对峙时期
  reign_ref: 西夏景宗
  archetype: 叛命称帝的枭雄之主
  dilemmas:
  - 父德明志在自守，元昊志在恢拓，弃此策略而举兵侵宋
  - 称帝求册被拒后，既不欲曲在己而戒兵不侵，终因范雍部属纵掠而决意入寇
  lesson: 隐忍蓄势与借势扩张，邻敌多怨而恃强自恃者，终难久安
  summary_first_person: 我拓跋元昊少而好兵，佐父破甘凉，遂得意于征战。父德明死，我并诸蕃、建号自称，遣使求朝廷真册而遭拒绝。范雍守延安屡遣兵纵掠，我因怒举众十万入寇延安，败刘平于前，又连破任福于好水川、葛怀敏于定川，宋廷西北大震。然连年鏖兵，储供殚耗，宋开五路重兵以备我，诸蕃亦多怨我，进退之势，已见其难。
  source_urls:
  - https://zh.wikisource.org/wiki/儒林公議
