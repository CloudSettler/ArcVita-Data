  - key: breakthrough
    name_zh: 授秘书丞
    labels:
      zh: 馆阁
    start_date: '1170'
  - key: climax
    name_zh: 定高宗庙号、谏韩侂胄
    labels:
      zh: 直谏
    start_date: '1187'
    highlight_event_id: guji-尤袤-event-定高宗庙号
  - key: closure
    name_zh: 年七十引年归
    labels:
      zh: 致仕
    start_date: '1196'
    highlight_event_id: guji-尤袤-event-致仕
  decisions:
  - date: '1187'
    title_zh: 奏争高宗庙号不从世祖之说
    rationale: 太上亲为徽宗子，子为祖、父为宗失昭穆之序，在天之灵不安。
  - date: '1190'
    title_zh: 奏驳韩侂胄超授四阶
    rationale: 朝廷官爵专徇私幸，非磨砺之具，诏遂不行。
  - date: '1196'
    title_zh: 极言陈源姜特立之恶不纳而引年归
    rationale: 时年七十，直谏不听，遂乞身退居梁溪。
events:
- id: guji-尤袤-event-birth
  person_id: guji-尤袤
  date: '1127'
  year_of: 1127
  key: 出生
  title_zh: 生于靖康丁未
  detail: 资质绝人，五岁能为诗句，文献公称其为天上骐骥。
- id: guji-尤袤-event-幼学
  person_id: guji-尤袤
  date: '1137'
  year_of: 约1137
  key: 教育
  title_zh: 十岁亲受以经
  detail: 蒋偕、施以神童荐于有司，年十五以词赋为诸士冠。
- id: guji-尤袤-event-廷拟状元被抑
  person_id: guji-尤袤
  date: '1148'
  year_of: 1148
  key: 科举
  title_zh: 名冠南宫，廷拟状元，秦桧易以王佐
  detail: 因不呈卷，秦桧易状元为王佐；时文献公尚在。
- id: guji-尤袤-event-登第
  person_id: guji-尤袤
  date: '1148-01-01'
  year_of: 1148
  key: 科举
  title_zh: 绍兴戊辰登第，与朱文公同榜
  detail: 廷对上第，召除将作监簿，后虞允文亟授秘书丞，张先生叹“尤君真秘书也”。
- id: guji-尤袤-event-知台州
  person_id: guji-尤袤
  date: '1180'
  year_of: 约1180
  key: 任职
  title_zh: 补外守台州，政声比赵汝愚
  detail: 上得其善政并东湖四诗，嘉之，遂除淮东提举。
- id: guji-尤袤-event-定高宗庙号
  person_id: guji-尤袤
  date: '1187-01-01'
  year_of: 1187
  key: 直谏
  title_zh: 定号高宗，驳洪迈世祖之议
  detail: 率颜师鲁奏太上亲为徽宗子，子为祖、父为宗失昭穆之序，迈论遂屈，卒如公议。
- id: guji-尤袤-event-谏韩侂胄
  person_id: guji-尤袤
  date: '1190'
  year_of: 约1190
  key: 直谏
  title_zh: 奏韩侂胄四年已转官又欲超授四阶
  detail: 指朝廷官爵专徇私幸，诏遂不行。
- id: guji-尤袤-event-上封事过重华宫
  person_id: guji-尤袤
  date: '1193'
  year_of: 约1193
  key: 直谏
  title_zh: 上千言封事，驾即日过重华宫
  detail: 都下欢呼，继口奏中宫谒家庙推赏一百七十二人之滥，乞大裁节，汰其半。
- id: guji-尤袤-event-擢礼部尚书
  person_id: guji-尤袤
  date: '1194'
  year_of: 约1194
  key: 任职
  title_zh: 擢礼部尚书兼侍读
  detail: 以裁节之谏见嘉纳，累迁至礼部尚书。
- id: guji-尤袤-event-致仕
  person_id: guji-尤袤
  date: '1196-01-01'
  year_of: 约1196
  key: 致仕
  title_zh: 年七十，极言陈姜之恶不纳，引年归
  detail: 以政奉大夫致仕，赠太师金紫光禄大夫；《宋史》言年七十终于位，误也，文集可考。
- id: guji-尤袤-event-筑梁溪园圃
  person_id: guji-尤袤
  date: '1196-05-01'
  year_of: 约1196
  key: 晚年
  title_zh: 梁溪之上造圃
  detail: 沿溪左种梅、右种海棠各数百树，有《瑞鹧鸪》咏落梅、海棠二词。
- id: guji-尤袤-event-death
  person_id: guji-尤袤
  date: '1202-01-01'
  year_of: 约1202
  key: 逝世
  title_zh: 致仕又八年而薨
  detail: 赠太师金紫光禄大夫，谥文简。
