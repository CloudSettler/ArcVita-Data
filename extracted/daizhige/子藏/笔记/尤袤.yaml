person:
  qid: guji-尤袤
  name_zh: 尤袤
  names:
    zh: 尤袤
    en: You Mao
  lifespan:
    birth:
      date: '1127'
      precision: year
      is_circa: false
      raw: 靖康丁未（靖康二年）
    death:
      date: '1202'
      precision: year
      is_circa: true
      raw: 年七十致仕，又八年薨
  birth_date: '1127'
  death_date: '1202'
  era: 南宋
  reign_ref: 靖康、绍兴、淳熙、绍熙、庆元
  archetype: statesman_scholar
  dilemmas:
  - 科举廷试被秦桧抑置，状元易为王佐，如何在不公之下持守名节
  - 谏止韩侂胄超迁官阶、极言陈源姜特立之恶，直谏与仕途风险的权衡
  - 高宗庙号定议之争，与洪迈“世祖”说对抗，维护昭穆之序
  lesson: 博雅纯孝，直道事君，宁可引年归去也不曲学阿世。
  summary_first_person: 我尤袤生于靖康之世，二十二岁名冠南宫却为秦桧所抑；此后历仕州郡与馆阁，定高宗庙号、谏韩侂胄之滥赏，年七十致仕归梁溪，筑圃种梅海棠，又八年而终。
