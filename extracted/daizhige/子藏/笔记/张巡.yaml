  title_zh: 雍丘拒令狐潮劝诱
  detail_zh: 令狐潮以书劝诱，不纳；雷万春中弩面不动，潮疑为木人，乃叹"方知足下军令矣"
- id: guji-张巡-event-siege
  date: '0757'
  year_of: 757
  type: endeavor
  title_zh: 死守睢阳，被围四十七日
  detail_zh: 玄宗已幸蜀，胡羯方炽，城孤势蹙，人困食竭，煮纸以茶汁和之；上《谢加金吾将军表》言被围四十七日凡一千二百余阵
- id: guji-张巡-event-death
  date: '0757'
  year_of: 757
  type: death
  title_zh: 睢阳城陷，以身殉国
  detail_zh: 刘禹锡曰：向若救至身存，不过是一张仆射耳，则张巡、许远之名，焉得以光扬于万古哉
