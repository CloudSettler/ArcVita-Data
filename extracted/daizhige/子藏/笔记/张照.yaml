  reign_ref: 康熙、雍正
  archetype: 儒臣通禅／书法名宦
  dilemmas:
  - 身居卿贰而好禅悦，儒臣身份与佛门因缘交缠
  - 早年得圣祖赏识，仕途机遇与"福缘亦孽果"之叹并存
  lesson: 宦途显贵与禅机悟性可并存，然福祸相依，荣辱皆数
  summary_first_person: 我张照，十四五岁入泮，十八捷南宫，蒙圣祖钦点入翰林，供奉内廷多年。世宗即位后因通内典而召对，答问契合，遂得放缺，位至卿贰，世称我前生为断臂和尚。
