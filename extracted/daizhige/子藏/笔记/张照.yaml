  - date: '1723'
    title_zh: 承认通阅内典
    rationale: 世宗问及通禅悦之廷臣，张文和举族侄照，召对机缘遂成
events:
- id: guji-张照-event-birth
  date: '1691'
  year_of: 1691
  title_zh: 降生
  description_zh: 断臂和尚圆寂同时，农部家中娩一男孩，时人以为宿德再来。
  event_type: birth
- id: guji-张照-event-gengming
  date: '1696'
  year_of: 1696
  title_zh: 五岁更名
  description_zh: 原名默，因恐异时被字为黑犬，自行更名照，字得天。
  event_type: other
- id: guji-张照-event-ruem
  date: '1704'
  year_of: 1704
  title_zh: 十四岁入泮
  description_zh: 十四入泮，十七乡举，科第连捷。
  event_type: other
- id: guji-张照-event-diandian
  date: '1708'
  year_of: 1708
  title_zh: 十八捷南宫，钦点庶常
  description_zh: 选庶常时仰奏乞教习，圣祖笑称"小蛮童乃颇有胆"，颔之。
  event_type: achievement
- id: guji-张照-event-zhaodui
  date: '1723'
  year_of: 1723
  title_zh: 世宗召对
  description_zh: 世宗问"视朕何人"，答"是佛"；问"汝自视何人"，答"干屎橛"，言下大契，即得放缺。
  event_type: achievement
- id: guji-张照-event-huma
  date: '1742'
  year_of: 1742
  title_zh: 扈从山庄坠马
  description_zh: 扈从山庄坠马折右臂，得蒙古医疗之而痊。
  event_type: other
- id: guji-张照-event-death
  date: '1745'
  year_of: 1745
  title_zh: 卒于道
  description_zh: 后三年丁艰归，卒于道。
  event_type: death
