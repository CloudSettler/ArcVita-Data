  archetype: 博学家
  dilemmas:
  - 博与专之辨：四部之学各有专门，兼长难求，欲贯穿玄宗、融镜内典者常涉猎而已
  - 务华贱实之叹：文苑烜赫而儒林埋没，实学何以弗衰、靡文何以弗盛
  lesson: 博学非猎奇炫博，当以经为本、求实征之据，博古通今方能称儒名。
  summary_first_person: 我撰《华阳博议》，遍论经史子集四部之博学者，考其流别门径，辨博古与通今，讥虚诞之妄谈，惜实学之不显。
  source_urls:
  - https://zh.wikisource.org/wiki/少室山房笔丛
