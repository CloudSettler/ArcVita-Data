  era: 宋末元初
  reign_ref: 宋末元初
  archetype: 遗民隐士
  dilemmas:
  - 生逢易代乱世，贫困而志不得伸，文才与命运相乖
  - 委家出游讲学养家与潜心著述之间艰难权衡
  lesson: 处穷困而文心不灭，忧愤郁积亦可化为传世之文
  summary_first_person: 我名翱，字皋父，延平人。早年治科举之学，有志当世，中年遭兵火，室家散亡，为生计所迫出游，馆于严陵，讲学授徒，卖薪炭易米度日。我曾补唐诗人无传者三十余篇，著家史，访前代故实。甲午岁与邓牧相遇会稽，结为方外友，日夜论辩文章。我一生不得志，郁愤之气皆宣于文，读之使人凄怆。临终犹望邓牧不至，以诗绝笔，葬于钓台。
  source_urls:
  - https://zh.wikisource.org/wiki/伯牙琴/謝皋父傳
