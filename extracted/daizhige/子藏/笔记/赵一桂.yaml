  decisions:
  - date: 1644-05
    title: 变产集资以天子礼改葬思宗
    rationale: 报大明二百年深仁厚泽，且使腥膻之徒知汉族尚有人。
  - date: 1644-05
    title: 参酌奢俭之中定制礼服仪品
    rationale: 先帝俭德昭著，不宜过奢以损盛德。
  - date: 1644-06
    title: 力辞县官库帑，遁归远乡
    rationale: 满清虎狼，不愿以清白之体供其鱼肉，亦不忍假先帝遗骸沽荣名。
events:
- id: guji-赵一桂-event-birth
  date: ''
  year_of: 约1600-1625之间
  title: 赵一桂出生
  detail: 生年史籍无载，为京师肆商（辇下商贩）。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-death
  date: ''
  year_of: 约1644之后
  title: 赵一桂去世
  detail: 卒年不详，子孙藏其笔记于祠中，赖邵青门之文与口述得传。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-1
  date: 1644
  year_of: 1644
  title: 匿御史少子，自任婴臼
  detail: 闯兵将至，邻居住直声震朝之御史以殉国自誓，一桂匿其少子，许诺代为营敛，如谢皋羽之于文信国故事。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-2
  date: 1644-04
  year_of: 1644
  title: 伪运粮冒险入都门
  detail: 京师陷，一桂独袱被策蹇驴，伪为军中运粮食者入国门，为乱兵所困十余次，卒达禁中。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-3
  date: 1644-04
  year_of: 1644
  title: 御史尸不可得
  detail: 御史死于围城中，尸不可得；时帝后遗骸方为顺天府遣官薄葬，如平民礼，无旧臣哭临。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-4
  date: 1644-05
  year_of: 1644
  title: 昌平恸哭思陵
  detail: 一桂赴昌平，夜深独恸哭陵下，袱被宿树阴；赖友吏目延食宿三日，立誓以天子礼改葬。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-5
  date: 1644-05
  year_of: 1644
  title: 结盟中涓，探得葬所
  detail: 得曾在宫中值差之中涓邢某，与之结为兄弟，出橐中金千余，探察得知帝后草葬于昭陵旁小丘，宿草未青，土痕犹湿。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-6
  date: 1644-05
  year_of: 1644
  title: 启田妃墓，以帝礼改葬思宗及周后
  detail: 鸠工起土，出旧朽梓宫，订购礼服仪品，凿山錾石入羡道，舁帝后新梓宫入田妃墓，帝居中、周后居左、移田妃棺于右，别作文木椁饰以钿漆；义士孙繁祉、刘再昌等捐金数百以足费用。
  participants:
  - guji-赵一桂
- id: guji-赵一桂-event-7
  date: 1644-06
  year_of: 1644
  title: 奉奠力辞库帑，遁迹远乡
  detail: 增购牲醴楮帛奉奠，居民争来致吊，轰动邻邑；县官欲请于朝发库帑，一桂力辞不受，挈袱被与中涓偕遁远乡。
  participants:
  - guji-赵一桂
