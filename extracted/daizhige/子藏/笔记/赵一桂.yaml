  dilemmas:
  - 家财与道义：变卖家产以葬帝后，毁家纾难
  - 清白与名利：拒绝县官库帑，不借先帝遗骸沽荣名
  lesson: 布衣亦有担当，义举不计生死荣利。
  summary_first_person: 我本京师一介商贩，国破后冒险入城，欲践约营葬殉国御史；御史尸不可得，遂痛心于思宗帝后草葬，散尽家财，联合中涓义士，以天子礼改葬思陵，事毕力辞官帑，遁迹远乡以全清白。
