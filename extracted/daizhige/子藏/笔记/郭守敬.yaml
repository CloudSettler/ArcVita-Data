person:
  qid: guji-郭守敬
  name_zh: 郭守敬
  names:
    zh: 郭守敬
    en: Guo Shoujing
  lifespan:
    birth:
      date: '1231'
      precision: year
      is_circa: true
      raw: 元代天文学家，生年史载丙寅（1231）
    death:
      date: '1316'
      precision: year
      is_circa: true
      raw: 卒于延祐三年（1316）
  birth_date: '1231'
  death_date: '1316'
  era: 元
  reign_ref: 元世祖至元年间
  archetype: 天文仪器创制与历法测算宗师
  dilemmas:
  - 昔人仪器规环不协、测天未精，郭守敬弃旧制而自创简仪仰仪，需在师法传统与突破古法之间抉择
  - 以管窥天度宿余分未得其的，遂改用二线推测，求精确而不惜变更旧法
  lesson: 制器务必精妙，测算力求毫杪无差，历术之进在于不泥古法。
  summary_first_person: 我是元人郭守敬，世祖时至元中，见历代仪象规环不协，遂创简仪、仰仪及诸仪表，皆臻精妙，为古所未及。又以昔人以管窥天度宿余分未得其的，乃立二线推测，使余分纤微皆有可考；尝主张高表四丈以量日影，使影长而尺寸无毫杪之失。我曾言古日舒长今日暂促，百年短一分，此义在度数之外。毕生志在天笺历术，务求其密。
  source_urls:
  - 文本来源：四库全书本《元明事类钞》卷一·天文门（简仪、二线、古日舒长诸条）
endeavors:
- id: guji-郭守敬-endeavor-1
  name_zh: 创制简仪仰仪诸仪表
  phases:
  - key: brewing
    name_zh: 见旧仪不协而起改制之心
    labels:
      zh:
      - 仪器改制
    start_date: '1276'
    highlight_event_id: guji-郭守敬-event-instruments
  - key: breakthrough
    name_zh: 简仪仰仪诸表皆臻精妙
    labels:
      zh:
      - 创制新仪
    start_date: '1279'
    highlight_event_id: guji-郭守敬-event-instruments
  decisions:
  - date: '1276'
    title: 弃旧规环之制，自创简仪仰仪及诸仪表
    rationale: 元初仪象之器规环不协，旧制不可用，遂自行创制，务臻精妙。
- id: guji-郭守敬-endeavor-2
  name_zh: 二线推测与高表量影
  phases:
  - key: brewing
    name_zh: 以管窥天度宿余分未得其的
    labels:
      zh:
      - 测算旧法之弊
    start_date: '1276'
    highlight_event_id: guji-郭守敬-event-two-lines
  - key: breakthrough
    name_zh: 用二线推测余分纤微皆有可考
    labels:
      zh:
      - 二线测天
    start_date: '1279'
    highlight_event_id: guji-郭守敬-event-two-lines
  - key: climax
    name_zh: 高表量影
    labels:
      zh:
      - 建议立四丈高表
    start_date: '1279'
    highlight_event_id: guji-郭守敬-event-two-lines
  decisions:
  - date: '1279'
    title: 改以二线推测，复立四丈高表量日影
    rationale: 昔人以管窥天度宿余分未得其的，且前代八尺之表晷影短而尺寸易差，故用二线以究纤微，立四丈高表于二丈折中开窍以量影，使尺寸无毫杪之失。
