  dilemmas:
  - 因声名远播而受君主礼聘，与道家避名全性之道相冲突
  - 居畏垒之山受民崇祀，自省违于老聃之言
  lesson: 全形抱生，藏身深眇，心不为外物所诱
  summary_first_person: 我是老聃弟子庚桑楚，陈人也。偏得老子之道，隐居畏垒之山，居三年而谷熟俗安。后世游吴，隐毗陵盂峰，著书九篇，号《亢仓子》。唐封我为洞灵真人，书为《洞灵真经》。cular我力行全性用道之学，教人清心想德，靖世安人。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=398640
