person:
  qid: guji-僧肇
  name_zh: 僧肇
  names:
    zh: 僧肇
    en: Seng Zhao
  lifespan:
    birth:
      date: '384'
      precision: year
      is_circa: true
      raw: 约东晋太元年间
    death:
      date: '414'
      precision: year
      is_circa: true
      raw: 约东晋义熙十年
  birth_date: '384'
  death_date: '414'
  era: 东晋
  reign_ref: 东晋
  archetype: 义学僧人·般若中观论师
  dilemmas:
  - 谈真则逆俗，顺俗则违真：如何在不背离世俗言教的同时阐明诸法不迁的真理。
  - 动静之辩：世人以昔物不至今为动，如何即动而求静、由流动显示不迁。
  lesson: 即动而求静，物各性住于一世，功业不朽故常存不迁。
  summary_first_person: 我是僧肇，东晋义学沙门。作《物不迁论》，即动而求静，谓昔物自在昔、今物自在今， 去住虽殊其致一也，群籍百家苟得其会，皆会归同致，行业湛然，何必惑于去来、踟蹰于动静之间。
  source_urls:
  - https://zh.wikisource.org/wiki/物不遷論
endeavors:
- id: guji-僧肇-endeavor-1
