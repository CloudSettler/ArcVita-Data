      - 引放光道行中观
    start_date: ~'400'
    highlight_event_id: guji-僧肇-event-5
  - key: breakthrough
    name_zh: 两言一会
    labels:
      zh:
      - 会放光与摩诃衍之说
    start_date: ~'410'
    highlight_event_id: guji-僧肇-event-6
  decisions:
  - date: ~'400'
    title_zh: 以《放光》《道行》《中观》圣言为准
    rationale: 法无去来、诸法本无所从来去亦无所至，斯皆即动而求静，以知物不迁明矣。
