    start_date: ~'410'
    highlight_event_id: guji-僧肇-event-3
  - key: closure
    name_zh: 湛然明矣
    labels:
      zh:
      - 功业不朽之旨
    start_date: ~'413'
    highlight_event_id: guji-僧肇-event-4
  decisions:
  - date: ~'405'
    title_zh: 乃作论寄心于动静之际
    rationale: 谈真逆俗、顺俗违真，中下难分存亡，然不能自已，聊复寄心于动静之际以辨惑。
  - date: ~'410'
    title_zh: 不释动求静而求静于诸动
    rationale: 因诸法无所从来去，昔物自在昔、今物自在今，故虽动而常静、虽静而不离动。
- id: guji-僧肇-endeavor-2
  name_zh: 依经立义会通经论
  phases:
