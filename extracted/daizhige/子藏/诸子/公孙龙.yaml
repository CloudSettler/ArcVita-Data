  archetype: 名家辩士
  dilemmas:
  - 主张“白马非马”，欲以辩正名实，然言愈辩而名实愈不可正
  - 与孔丛子记载互异：孔穿究为龙所绌，抑或愿拜龙为师
  lesson: 持论雄赡、恣肆恢诞，虽足耸动天下，然离形言色、析名离实，终致辩而愈乱，正名须合于实。
  summary_first_person: 我是赵人公孙龙，六国时辩士，以“白马非马”“指物”“通变”诸论名世。我疾名器乖实，假指物以混是非，冀时君有悟而正名实；平原君以我为客，孔穿欲为我弟子而求去我术，我拒而不从。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=441583
