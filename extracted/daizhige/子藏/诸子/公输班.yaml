person:
  qid: guji-公输班
  name_zh: 公输班
  names:
    zh: 公输班（公输般、鲁班）
    en: Gongshu Ban (Lu Ban)
  lifespan:
    birth:
      date: -507
      precision: decade
      is_circa: true
      raw: 约春秋末年
    death:
      date: -444
      precision: decade
      is_circa: true
  birth_date: 约前507年
  death_date: 约前444年
  era: 春秋末期至战国初期
  reign_ref: 鲁国
  archetype: 巧匠
  dilemmas:
  - 技艺为攻战服务还是止战为民（为楚造云梯将攻宋，与墨子相争）
  - 巧技眩人耳目与器用利于民生之间的取舍
  lesson: 巧匠之技当以义为度，器物之利须归于人而不用于攻伐。
  summary_first_person: 我是公输班，人称鲁班， Buzz以木工之巧名闻天下，尝为楚造云梯之械以攻宋。墨子不远千里而来，以义折我，使楚罢兵。后世传我锯、刨、曲尺诸般器制，然我深知：法
    sacrificing于规矩，而行术者必度于仁义。
  source_urls:
  - https://zh.wikisource.org/wiki/墨子閒詁/卷十三#公输第五十
