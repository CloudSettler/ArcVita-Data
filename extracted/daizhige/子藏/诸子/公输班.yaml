    title_zh: 受楚之命造云梯
    rationale: 世人聘我为巧，我以技巧为职，遂为楚制攻宋之械，未虑其非义。
  - date: -445
    title_zh: 与墨子理化后止攻
    rationale: 墨子以义责我，攻守推演不胜，知杀之无益而攻不可成，遂谏楚罢兵。
