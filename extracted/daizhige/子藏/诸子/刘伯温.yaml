  archetype: 谋士·开国功臣·著述家
  dilemmas:
  - 道不行于元廷，弃官隐居著书，还是随波苟且
  - 出仕新朝辅佐大明，还是守节终老山林
  lesson: 学以开物成务，不获设施则笔之方册以传后世
  summary_first_person: 我刘基，字伯温，括苍人。元末登进士第，有志尊主庇民，然当国者因循苟且，累建大议而不行，遂弃官屏居青田山中，发愤著《郁离子》。及皇上龙兴，出佐大业，定功行赏，膺五等之爵，为诚意伯。
  source_urls:
  - https://zh.wikisource.org/wiki/郁离子
