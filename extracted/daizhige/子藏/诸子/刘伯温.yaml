  year_of: 1348
  title_zh: 参赞藩阃兵务，累建大议不为用
  description: 藩阃方务治兵，辟公参赞，累建大议，皆匡时之长策，而当国者抑而不行。
- id: guji-liuji-event-writings
  type: endeavor
  date: '1352-01-01'
  year_of: 1352
  title_zh: 屏居青田山中，发愤著《郁离子》
  description: 弃官去，屏居青田山中，发愤著书。其书总为十卷，十八十八章，一百九十五 či条。
- id: guji-liuji-event-assist
  type: endeavor
  date: '1360-01-01'
  year_of: 1360
  title_zh: 出佐维新之朝，辅翼兴运
  description: 皇上龙兴，卒以宏谟伟略，辅翼兴运。
- id: guji-liuji-event-title
  type: endeavor
  date: '1370-01-01'
  year_of: 1370
  title_zh: 定功行赏，封诚意伯
  description: 及定功行赏，疏土分封，遂膺五等之爵，与元勋大臣丹书铁券联休共美。
- id: guji-liuji-event-death
  type: death
  date: '1375-05-16'
  year_of: 1375
  title_zh: 刘基薨
  description: 今公已薨，其子仲璟惧其散轶，请序以传其书。
