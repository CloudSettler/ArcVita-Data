    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详，活动于曹魏黄初至正始年间
  era: 三国·曹魏
  reign_ref: 黄初中官散骑常侍，正始中赐爵关内侯
  archetype: 思想家·人才学著作撰写者
  dilemmas:
  - 名字传写歧异：他本或作刘劭、刘邵，宋庠据魏志考订从卲（训高、美），与字孔才义符
  - 偏材之性不可移转：虽教之以学、训之以恕，材成而失随之，学不入道、恕不周物
  lesson: 知人诚智，则众材得其序而庶绩之业兴；观人察质，必先察其平淡而后求其聪明。
  summary_first_person: 我刘卲，字孔才，邯郸人，曹魏之臣。黄初中官散骑常侍，正始中赐爵关内侯。我依圣训志序人物，撰《人物志》十二篇，首尾完具，论辨人才，以外见之符验内藏之器，分别流品，研析疑似，其学虽出于名家，其理则不乖于儒。
  source_urls:
  - https://www.example.com/sikuquanshu/renwuzhi
