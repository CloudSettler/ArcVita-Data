person:
  qid: guji-刘敞
  name_zh: 刘敞
  names:
    zh: 刘敞
    en: Liu Chang
  lifespan:
    birth:
      date: '1019'
      precision: year
      is_circa: true
      raw: 北宋庆历前后
    death:
      date: '1068'
  birth_date: '1019'
  death_date: '1068'
  era: 北宋
  reign_ref: 仁宗、英宗朝
  archetype: 经学家
  dilemmas:
  - 三党交讧之际，萧然于门户之外，不附新党亦不党于元佑诸贤
  - 独抱遗经、澹于声誉，讲学家视之为异党而抑之
  lesson: 学问贵在发明正学、和平持中，不以门户声誉为念。
  summary_first_person: 我刘敞，字原父，世称公是先生。我撰《公是先生弟子记》，托言弟子所记，实自记问答之言。书中多攻王氏新学，亦兼针砭元佑诸贤；论王安石性无善恶之说，先于程朱辞而辟之。以熙宁、元丰间卓然一醇儒自任。
  source_urls:
  - https://zh.wikisource.org/wiki/公是先生弟子記
