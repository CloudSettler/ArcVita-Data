  lesson: 穷而不馁，发愤著述以自见
  summary_first_person: 我渤海阜城人，字孔昭，孤贫好学，昼夜不息。举秀才十年不得，遂发愤撰《高才不遇传》，孝昭时诣晋阳上书，切直而不见收，乃编为《帝道》，河清中又著《金箱璧言》以讥时政。
