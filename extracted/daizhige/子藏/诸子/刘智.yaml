person:
  qid: guji-刘智
  name_zh: 刘智
  names:
    zh: 刘智
    en: Liu Zhi
  lifespan:
    birth:
      date: 约1660
      precision: year
      is_circa: true
      raw: 清初
  birth_date: 约1660
  era: 清代康熙年间
  reign_ref: 康熙
  archetype: 学者-著译者
  dilemmas:
  - 弃功名生产而专事天方译著，不为世所知
  - 会通儒、天方、泰西之学而不惑于异说
  lesson: 苦学精思、虚心会通，可成一家之言而光大其道
  summary_first_person: 我刘智，字介廉，金陵人。弃生产功名，隐居著书二十余年，广搜天方经典，以十年之力精研，汉译《天方性理》《天方典礼》诸书，会通儒学与天方性理，使天方之学为中国人所共知。
endeavors:
