  decisions:
  - date: 约1690
    title_zh: 避世居山，弃生产功名百家术数，一志于学
    rationale: 以性理为宗，欲阐天方以晓中国
  - date: '1704'
    title_zh: 采精挹萃，辑数经为一经，因经立图、因图立说，成《天方性理》
    rationale: 天方经籍文语聱牙不能通于儒，慨然独任汉译会通之事
