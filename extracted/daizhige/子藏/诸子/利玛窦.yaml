  dilemmas:
  - 既要坚守天主教教义，又要适应儒家礼俗与传统话语
  - 传教救灵魂与尊重君亲伦常之间的张力
  lesson: 会通而非对抗的理解之道，使异邦学问得以在陌生文明中生根
  summary_first_person: 我生于意大利马切拉塔，远涉重洋至华。着《天主实义》《畸人十篇》等书，以天主之理接引儒者，援中西学问彼此印证，欲使福音与西学同播于中华。
