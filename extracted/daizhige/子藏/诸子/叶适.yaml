  dilemmas:
  - 志在经世济时，而仕途屡经起落
  - 论学喜出新义，与恪守洛闽之学的时论相左
  lesson: 考核精博、议论英伟，独见出于深思而不袭陈言
  summary_first_person: 我叶适，字正则，自号水心居士，永嘉人。淳熙五年登进士第，官至宝文阁学士，谥忠定。我辑录经史百子各为论述，成《习学记言》五十卷，凡经十四卷、诸子七卷、史二十五卷、文鉴四卷。所论喜为新奇，不屑摭拾陈语，虽议者或谓义理未纯，然如考辨子思生卒、斥汉人五行灾异之说，皆确有所见，足以副我雄辨之才。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=习学记言
