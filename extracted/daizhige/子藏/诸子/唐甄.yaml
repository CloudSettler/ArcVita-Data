      - 知县
    start_date: 1671
    highlight_event_id: guji-tangzhen-event-office
  - key: closure
    name_zh: 革职为民
    labels:
      zh:
      - 罢官
    start_date: 1671
    highlight_event_id: guji-tangzhen-event-office
  decisions:
  - date: 1671
    title_zh: 为贫而仕，出知长子县
    rationale: 母老无食，出游谋食，不得已而仕；旋以十月经革为民，自认犹是市里山谷之民
- id: guji-tangzhen-endeavor-2
  name_zh: 鬻田经商于吴市
  phases:
  - key: brewing
    name_zh: 赋重田贫
    labels:
      zh:
      - 岁计不足
    highlight_event_id: guji-tangzhen-event-tianfu
  - key: breakthrough
    name_zh: 贱鬻田产
    labels:
      zh:
      - 鬻田
    highlight_event_id: guji-tangzhen-event-yutian
  - key: climax
    name_zh: 贩经设牙
    labels:
      zh:
      - 经商
    highlight_event_id: guji-tangzhen-event-weiya
  decisions:
  - date: 1672
    title_zh: 贱鬻田得六十余金，使仆贩经于震泽
    rationale: 佃入不足于赋，典物以益之，将及冻馁，故鬻田救死，日得微利以活家人
  - date: 1673
    title_zh: 迁居城东，使衷、原为牙主客
    rationale: 贩经得失不常，改设牙行以图恒业；自谓吕尚卖饭孟津，唐甄为牙吴市，其义一也
- id: guji-tangzhen-endeavor-3
  name_zh: 讲学明道与著述
  phases:
  - key: brewing
    name_zh: 立三义论朋友之道
    labels:
      zh:
      - 讲学
    highlight_event_id: guji-tangzhen-event-sanyi
  - key: climax
    name_zh: 论隐论治，慨天下大命
    labels:
      zh:
      - 著述
    start_date: 1690
    highlight_event_id: guji-tangzhen-event-daming
  decisions:
  - date: 1691
    title_zh: 游江西乞粟于故人之宦者
    rationale: 父死三十一年、母死五年而不能葬，家有一石一斗三升粟，惧妻女饿死，不得不乞于故人
events:
- id: guji-tangzhen-event-birth
  date: '1630'
