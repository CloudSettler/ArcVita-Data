  person: 唐甄
- id: guji-tangzhen-event-nanzhou
  date: 1644
  year_of: 1644
  title_zh: 明亡，从父避于南洲山中有田一顷
  person: 唐甄
  note: 舅李长祥战石郭，乃去之而居于五湖之滨
- id: guji-tangzhen-event-yanguang
  date: 1651
  year_of: 1651
  title_zh: 年二十一，读汉书严光传勃然大怒，气盖天下欲得志于天下
  person: 唐甄
  note: 后二十余年游历无所得食，乃悔骂严光之过
- id: guji-tangzhen-event-xiangshi
  date: 1657
  year_of: 1657
  title_zh: 顺治十四年举于阆中之场（中举）
  person: 唐甄
- id: guji-tangzhen-event-office
  date: 1671-10
  year_of: 1671
  title_zh: 康熙十年宦于丹朱之封，任长子知县
  person: 唐甄
  note: 供十月而革为民，自此不复言君臣之伦
- id: guji-tangzhen-event-tianfu
  date: 1672
  year_of: 1672
  title_zh: 长洲冶长泾、谢庄之田四十亩，重赋所困，佃获不足于赋
  person: 唐甄
  note: 通七岁计之，典物以益者六斛，叹明之赋于吴者半其田之所获
- id: guji-tangzhen-event-yutian
  date: 1672
  year_of: 1672
  title_zh: 贱鬻田产得六十余金，遣养子衷与仆原贩经于震泽
  person: 唐甄
- id: guji-tangzhen-event-weiya
  date: 1673
  year_of: 1673
  title_zh: 迁居城东设牙行，为牙于吴市，日得微利以活家人
  person: 唐甄
- id: guji-tangzhen-event-sanyi
  date: 1680
  year_of: 1680
  title_zh: 立三义明朋友之道，论济友之财与讲学进德
  person: 唐甄
- id: guji-tangzhen-event-daming
  date: 1690
  year_of: 1690
  title_zh: 岁饥食糠粞，见妇人哭夫之墓，慨叹天下大命之不平
  person: 唐甄
- id: guji-tangzhen-event-jiangxi
  date: 1691
  year_of: 1691
  title_zh: 游江西乞于故人之宦者，登绣谷之山而病眩
  person: 唐甄
- id: guji-tangzhen-event-death
  date: '1704'
  year_of: 1704
  title_zh: 唐甄约卒于康熙四十三年
  person: 唐甄
