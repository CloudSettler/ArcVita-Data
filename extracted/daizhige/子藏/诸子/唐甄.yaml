person:
  qid: guji-tangzhen
  name_zh: 唐甄
  names:
    zh: 唐甄
    en: Tang Zhen
  lifespan:
    birth:
      date: '1630'
      precision: year
      is_circa: true
      raw: 顺治十四年举乡试时年二十八，逆推约生于崇祯三年（1630）
      year_of: 1630
    death:
      date: '1704'
      precision: year
      is_circa: true
      raw: 约康熙四十三年（1704）卒
      year_of: 1704
  birth_date: 约1630年
  death_date: 约1704年
  era: 明末清初
  reign_ref: 顺治、康熙年间
  archetype: 穷而后信的经世思想家
  dilemmas:
  - 为贫而仕与士人操守的冲突：任长子知县十月即被革为民，自甘与市里山谷之民同列
  - 有田不敷赋税，冻馁逼身，最终贱鬻田产、为牙于吴市以救死养家
  - 隐与出仕之间的抉择：既不愿为麋鹿式避世之隐，又无君臣之伦可达
  lesson: 节之立不立，由于食之足不足；救死养亲亦是讲学进德，贾贩屠沽不为辱身
  summary_first_person: 我为贫而仕，为知县十月而革为民，遂与大潜伏处吴市，鬻田为牙以活家人；设                                                                三义以明朋友之道，叹天下大命之不平，悔昔日骂严光之过，顺时而隐，守贱守节。
endeavors:
- id: guji-tangzhen-endeavor-1
  name_zh: 举业与仕宦
  phases:
  - key: breakthrough
    name_zh: 举于阆中
    labels:
      zh:
      - 中举
    start_date: 1657
    highlight_event_id: guji-tangzhen-event-xiangshi
