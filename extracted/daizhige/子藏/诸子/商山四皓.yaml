person:
  qid: guji-商山四皓
  name_zh: 商山四皓
  names:
    zh: 商山四皓
    en: Four Whiteheads of Mount Shang
  lifespan:
    birth:
      is_circa: true
      raw: 秦末汉初隐士
  era: 秦末汉初
  reign_ref: 汉高祖、汉惠帝
  archetype: 隐士
  dilemmas:
  - 避世高名与不应征辟之间的出处抉择
  - 呂后私赂相请与高祖废嫡之间忠直与权变之辨
  lesson: 辞天爵非傲君，出山 adjunct 吕氏太子，实为用邪扶正、持危定天下
  summary_first_person: 我们四人遁迹商山，避时而处，世人疑为傲君受贿；及太子势摇，我们应吕后之请出山辅佐孝惠，实为用邪扶正、正天下之危。
  source_urls:
  - https://zh.wikisource.org/wiki/伸蒙子
