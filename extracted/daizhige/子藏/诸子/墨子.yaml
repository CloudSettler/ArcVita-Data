  - 节用非乐与礼乐传统的冲突
  lesson: 染于苍则苍，染于黄则黄；成败系于所染与所法
  summary_first_person: 我是墨子，主张兼爱、非攻、尚贤、节用。我见染丝而叹，知人所受熏染决定成败；我谓天下从事者不可无法仪，莫若法天之兼爱无私。国之七患、君之五奢，皆因不节不备而生，我以此教导弟子，欲天下之治而恶其乱。
