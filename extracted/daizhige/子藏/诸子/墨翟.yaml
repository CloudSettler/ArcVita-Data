  dilemmas:
  - 墨家学说兼爱非攻，然战国争战不休，其道难行于世
  - 《吕氏春秋》采诸子之长而于墨翟之言'不取其非儒明鬼者'，儒墨相非之张力贯穿其学
  lesson: 兼爱非攻，摩顶放踵利天下而为之
  summary_first_person: 我名墨翟，世称墨子，战国初鲁人。我倡兼爱、非攻、尚贤、明鬼，率弟子行义于列国，为墨家开山之祖。《吕氏春秋》集百家之言，采墨家之说的醇正者，而不取我非儒明鬼之论，可见儒墨之辨自古并存于世。
  source_urls:
  - https://ctext.org/lvshi-chunqiu
