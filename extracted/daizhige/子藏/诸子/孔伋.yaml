  dilemmas:
  - 义利之辨：仁义与利的关系如何统一
  lesson: 仁义所以利之，上不仁不义则为大不利
  summary_first_person: 我名伋，字子思，孔子之孙。相传《子思子》一书实为后人缀缉而成，非我自著。书中载我与孟轲论牧民之道，我言先利之，谓仁义固所以利之；轲后以仁义告魏侯罃，深得我之本旨。惜世人或不察，误以为我言与轲相反而惑焉。
