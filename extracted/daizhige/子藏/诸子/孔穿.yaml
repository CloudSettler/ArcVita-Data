  date: -270
  year_of: -270
  title_zh: 居鲁闻公孙龙之名，愿往受业
  details_zh: 居于鲁，侧闻下风，高公孙龙之智，悦其之行，愿受业之日久矣。或劝子高往正其毁大道之辩，子高曰大道之悖，天下自会校枉，不必忧，然为天下故遂往赵。
- id: guji-孔穿-event-3
  type: endeavor
  date: -255
  year_of: -255
  title_zh: 与公孙龙会于平原君家，请废“白马非马”
  details_zh: 与公孙龙会于赵平原君家，谓愿为弟子而请去“白马非马”之术；公孙龙斥其“先生之言悖”，并以楚王遗弓、仲尼异楚人于人为对，孔穿无以应焉。
- id: guji-孔穿-event-4
  type: endeavor
  date: -253
  year_of: -253
  title_zh: 平原君宴席上以六鹢素丝破白马之辩
  details_zh: 异日平原君会众宾延子高，问其欲去公孙白马之学。子高引《春秋》“六鹢退飞，睹之则六，察之则鹢”及《诗》《礼》素丝缁布之称，明“先举其色，后名其质”为万物所同之理，断言公孙之辩从此可破；燕客史由亦谓公孙龙“辞则有焉，理则否矣”。
- id: guji-孔穿-event-5
  type: endeavor
  date: -252
  year_of: -252
  title_zh: 论“臧三耳”甚难而实非，事毕欲归
  details_zh: 于平原君所记论，辨及“臧三耳”。子高谓其为臧三耳甚难而实非，谓臧两耳甚易而实是；次日平原君告公孙龙：“其人理胜于辞，公辞胜于理，辞胜于理，终必受诎，公无复与孔子高辨事也”。子高所言于公孙龙者，欲其去白马之说而智行固存，乃不失其所师者。
