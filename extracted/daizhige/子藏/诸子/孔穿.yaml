    title_zh: 愿师公孙龙而请废“白马非马”之学
    rationale: 高其智而悦其行，愿受业久矣，然独不取“白马为非马”之说，故请其去此术乃为弟子
  - date: 约-255
    title_zh: 退而告人，不争于公孙龙
    rationale: 以为其“言非而博，巧而不理，此固无所不答也”，与其口辩，不如以理正之
  - date: 约-253
