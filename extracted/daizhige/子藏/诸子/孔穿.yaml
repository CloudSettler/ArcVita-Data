  reign_ref: 战国晚期诸雄并立、养士之风盛行
  archetype: 儒家名理辩难者
  dilemmas:
  - 慕公孙龙之名欲师从之，又拒斥其“白马非马”之说，怎能先令师去其所教而后师之
  - 面对辩者小辩毁大道，是隐而不校，还是为天下正其悖枉
  - 辞胜于理的辩术风行一时，儒者以理胜辞是否终能服人
  lesson: 问他“及此破辩，何必远遁”，理之至精者则自明之，贵当物理而不贵繁辞
  summary_first_person: 我孔穿，孔子的后裔，字子高。我久闻公孙龙之名，亲至赵国平原君家中，愿执弟子礼，但请他废去“白马非马”之学；他斥我之言为悖，我无以应而退。事后我悟其“言非而博，巧而不理”。后于平原君宴席上，我以《春秋》六鹢退飞、《诗》素丝、《礼》缁布为喻，明“先举其色，后名其质”之理，破其白马之辩；又论“臧三耳”甚难而实非、谓两耳甚易而实是，使平原君亦折服，劝公孙龙勿再与我论辩。我尚儒术，贵实理而贱繁辞，遂翻然高逝东归。
  source_urls:
  - https://zh.wikipedia.org/wiki/孔穿
