  name_zh: 楚庄王
  names:
    zh: 楚庄王、熊旅、熊侣
    en: King Zhuang of Chu
  lifespan:
    birth:
      date: '-700'
      precision: year
      is_circa: true
      raw: 生年不详
    death:
      date: '-591'
