  birth_date: '-700'
  death_date: '-591'
  era: 春秋时期
  reign_ref: 楚庄王元年〔前613年〕至二十三年〔前591年〕
  archetype: 霸主明君
  dilemmas:
  - 即位之初朝政为大店家把持，忠奸难辨，隐忍三年以察群臣
  - 为争霸中原，需在礼义名声与武力扩张之间权衡
  lesson: 人材须先辨忠佞，治理必兴学崇教，方能国治民化。
  summary_first_person: 我具衣冠而坐叹天下无材，农家与身弩之徒点醒我材在四境之间；于是立大夫第为博士之官，弟子化而笃学，愿人之子弟遂其淫僻，人家长老失其故常。治伊吾卢既有田亩部曲，复依弦子之业兴学，进相以德，则材足用而国治矣。
  source_urls:
  - https://zh.wikipedia.org/wiki/楚庄王
