  reign_ref: 秦穆公之臣
  archetype: 知耻后勇的败军之将
  dilemmas:
  - 师老远袭，谏言不被采纳，陷于崤之险
  - 兵败被俘，身系国辱，何以自处
  lesson: 败而能忍，知过而后图强，方为大将之器
  summary_first_person: 我名视，秦穆公以我为将，偕白乙丙、西乞术率师远袭郑国。父亲蹇叔哭送于师门外，言晋人必遏我师于殽。师过周而东，郑商人弦高矫命犒师，我知机事已泄，遂还师。岂料晋襄公从先轸之言，于殽地大败秦师，我三帅俱为所获。此败非天意，乃智不至也——不纳忠谏，轻于远役。后人以此为戒：师之不反，从不信忠言而生，智有所不至，其害大矣。
