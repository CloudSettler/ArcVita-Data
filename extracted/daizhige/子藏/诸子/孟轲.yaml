  reign_ref: 齐宣王、梁惠王之世
  archetype: 游说诸侯而不遇的儒家圣贤
  dilemmas:
  - 以仁义之大学说干时君，而君主才浅不能受
  - 德高见谤，遭嬖人臧仓之毁而不得见用
  lesson: 贤者之道能否行世，系于遇与不遇；遇不遇在天，而操行守道在己。
  summary_first_person: 我孟轲怀仁义之道，游说齐、梁诸国，然时君才下知浅，不能用大才，屡屡困厄不遇。鲁平公欲见我，嬖人臧仓毁谤而止，我叹曰"天也"。遇不遇是命，而我守道洁行之志未尝改易。
