  birth_date: 约-390
  death_date: 约-330
  era: 战国
  reign_ref: 秦孝公时期
  archetype: 杂家学者 / 谋士
  dilemmas:
  - 依附商鞅变法建功与商君被刑后恐遭株连而逃亡的生存抉择
  - 著述杂糅道德仁义与九州地理、不循孔氏之术的学派归属难题
  - 里籍晋人抑或鲁人，史籍记载相异难定
  lesson: 学不倦以治己，教不厌以治人；积学如积土成岳，终究有所生发
  summary_first_person: 我是尸佼，或为晋人，或云鲁人，曾为秦相卫鞅之客，商君谋事画计、立法理民，未尝不与我共规。商君被刑后，我恐遭并诛，逃亡入蜀。我著书二十篇、六万余言，十九篇陈道德仁义之纪，一篇言九州险阻、水泉所起。后世称我书为《尸子》，虽原本散佚，而诸子征引，犹见精华。
  source_urls:
  - https://zh.wikisource.org/wiki/尸子
