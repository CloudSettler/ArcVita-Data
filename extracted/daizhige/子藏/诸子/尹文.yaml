  archetype: 稷下名家学者
  dilemmas:
  - 名与实相乱，世人悦名而丧其实
  - 学出黄老而出入刑名，遭儒者讥其淆杂
  lesson: 正名定分，使万事归一，百度皆准于法
  summary_first_person: 我是战国时齐宣王时期的稷下学者尹文，与宋钘、彭蒙、田骈相友善，学本黄老而近刑名。我主张先正名分，使形名不相乱、上下不相侵，名定则物不竞，分明则私不行。我曾与齐宣王、湣王问答论治道，着《尹文子》一篇，后经仲长氏条次定为上下篇传世。
