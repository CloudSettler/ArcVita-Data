  era: 战国
  reign_ref: 约齐宣王、湣王之世
  archetype: 法家/黄老思想家
  dilemmas:
  - 弃知去己：不师智虑、缘不得已，与天下尚贤之举相悖，豪杰笑其为"至死人之理"
  - 学属之争：庄子列其为道家之流，汉志归入法家，其学出入黄老申韩之间，归属难定
  lesson: 因物理之当然而立法守之，不求于法之外，上下相安则可清净而治。
  summary_first_person: 我乃赵人慎到，曾游学稷下。我主张弃知去己，缘物之理而立法定分，使上下各守其法而治，故申韩多称引我之说。
