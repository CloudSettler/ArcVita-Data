  decisions:
  - date: -192
    title: 汉志录慎子四十二篇入法家
    rationale: 班固据刘歆《七略》将《慎子》四十二篇列于法家，以其大旨在因法而治。
  - date: 1776
    title: 四库全书重加校录
    rationale: 慎子原书散佚，明人捃拾残剩重编为五篇，四库馆臣考订其浏阳、名广诸说之误，于乾隆四十六年正月校上。
events:
- id: guji-慎到-event-birth
  person_id: guji-慎到
  date: -0390
  year_of: -390
  precision: decade
  is_circa: true
  kind: birth
  title: 慎到生于赵
  description: 慎到为赵人，见于《史记》(《四库提要》引陈振孙《书录解题》)；中兴书目误作浏阳人，提要辨其非。
- id: guji-慎到-event-1
  person_id: guji-慎到
  date: -232
  year_of: -350
  precision: decade
  is_circa: true
  kind: endeavor
  title: 游学稷下，与田骈并称
  description: 《庄子·天下篇》以慎到、田骈并称，同为稷下学者；颜师古谓尹文为齐宣王时人，慎到殆亦宣王时稷下旧人。
- id: guji-慎到-event-2
  person_id: guji-慎到
  date: -224
  year_of: -340
  precision: decade
  is_circa: true
  kind: endeavor
  title: 著《慎子》倡"因循任法"之旨
  description: 著书大旨欲因物理之当然，各定一法而守之，不求于法之外，亦不宽于法之中，则上下相安、清净而治；庄子述其"弃知去己而缘不得已"之说。
- id: guji-慎到-event-3
  person_id: guji-慎到
  date: -192
  year_of: -300
  precision: decade
  is_circa: true
  kind: endeavor
  title: 道德转刑名，申韩称之
  description: 其学由道德转出刑名，"法所不行，势必刑以齐之"，故申不害、韩非多称引之(语见《汉书·艺文志》)，汉志录其书四十二篇。
- id: guji-慎到-event-4
  person_id: guji-慎到
  date: 1781-01
  year_of: 1781
  precision: month
  is_circa: false
  kind: endeavor
  title: 四库馆臣校录《慎子》
  description: 乾隆四十六年正月，纪昀等总纂官恭校《慎子》一卷五篇上；考辨"到一名广"之误实为田骈一名广，并指明本为明人捃拾残剰重编。
- id: guji-慎到-event-death
  person_id: guji-慎到
  date: -205
  year_of: -315
  precision: decade
  is_circa: true
  kind: death
  title: 慎到卒
  description: 确切卒年无考，约当齐湣王前后；其学著述经秦火散灭，传世仅残篇。
