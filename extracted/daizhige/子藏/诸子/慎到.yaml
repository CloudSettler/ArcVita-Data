    rationale: 赵人南游齐之稷下学宫，与尹文、田骈诸子同期论学，声闻于世。
  - date: -224
    title: 舍是与非，缘物立理
    rationale: 悟"弃知去己、缘不得已"之道，主张推而后行、曳而后往，因物理之当然而各定一法守之。
