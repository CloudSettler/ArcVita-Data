  dilemmas:
  - 立功立言之间如何量力而行
  - 事君无私与化人正心之道如何践履
  lesson: 好成者败之本也，愿广者狭之道也，立功立言必也量力乎。
  summary_first_person: 我早年在河汾问学于文中子，请教事君、使人、化人之道与郡县之治，领受无私无偏、正心之旨；后来出仕唐廷，以量力立功立言自警，成为一代贤相。
