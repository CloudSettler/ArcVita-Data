  description_zh: 揭暄与方以智（愚者）、方中通交游，为其《物理小识》作注，论气、光、声之理。
  participants:
  - guji-方以智
  - guji-方中通
- id: guji-揭暄-event-career-3
  date: '1660'
  year_of: 1660
  title_zh: 论气有声有光、气能显物
