  - 至道
  - 天禧
  - 景祐
  archetype: 学者 / 文臣
  dilemmas:
  - 儒释兼融：著书主于勉人为善，而不免兼入于释氏
  - 出世与处世间的取舍：既历两制、逮事三朝，又晚年潜心内典
  lesson: 身老浸衰理之常也，心老浸高道使然也；年老而修善，犹胜终不改其前过。
  summary_first_person: 我字明远，澶州清丰人，自父始徙家彭门。太平兴国五年登进士第，至道末擢右正言、直史馆、知制诰，旋为翰林学士加承旨。天禧中判西京留司御史台，以太子太保致仕。晚年居于昭德坊，著《昭德新编》，取东鲁之书文而雅、西域之书质而备之意，作指迷五说，酌中而作。卒谥文元。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6427
