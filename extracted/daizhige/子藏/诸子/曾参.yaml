  person_qid: guji-曾参
  type: endeavor
  date: -470
  year_of: -470
  title_zh: 撰《曾子》书
  description: 撰《曾子》十八篇（汉志所载），今传十篇分为二卷，与唐志合；其书明白皎洁若列星之丽天，敷腴谆笃若万卉之含泽；一日三省，君子爱日，皆见其中。
- id: guji-曾参-event-4
  person_qid: guji-曾参
  type: endeavor
  date: -435
  year_of: -435
  title_zh: 《曾子》之书备见于《大戴礼》
  description: 《曾子》之书已备见于《大戴礼》中，汉志云十八篇而亡其八篇；或谓《大孝篇》及乐正子春事为后人所辑，非曾子所自著。
