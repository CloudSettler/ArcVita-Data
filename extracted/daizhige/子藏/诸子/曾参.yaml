  dilemmas:
  - 曾子所撰之书是否出自其本人之手，抑或后人辑录（如《大孝篇》及乐正子春事，疑出后人所辑）
  - 传本篇卷残缺，汉志十八篇而今传十篇，真貌难考
  lesson: 有德者必有言，日省其身而近于道
  summary_first_person: 我名参，鲁人，孔门弟子。世传《曾子》一书，自《修身》至《天圆》凡十篇，分为二卷，其文明白皎洁、敷腴谆笃。我谨守孝道，一日三省吾身，君子爱日以勤学，庶几不失孔子之教。
