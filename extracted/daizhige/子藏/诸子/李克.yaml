  archetype: 贤臣·选相论士之智臣
  dilemmas:
  - 观人与荐贤之择：不妄置可否，而以五条观人之道启悟君主
  - 穷达之际：以“达视其所举，穷视其所不取”自处并度人
  lesson: 观人不貌取， 论士不序爵； 居视所亲， 富视所与， 达视所举， 穷视所不为， 贫视所不取
  summary_first_person: 我李克事魏文侯，主问置相之时，我不请面折，而以五条观士之法人害之，令文侯自择魏成子与翟璜，卒以知人善任显名于世。
  source_urls:
