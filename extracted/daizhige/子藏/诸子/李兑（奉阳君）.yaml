  name_zh: 李兑以奉阳君当赵国政
  description_zh: 李兑为赵相，世称奉阳君，执赵国之权。
- id: guji-li-dui-event-alliance
  person_qid: guji-li-dui
  date: -0290
  year_of: -290
  type: political_action
  name_zh: 梁王朝奉阳君于邯郸
  description_zh: 梁王与成阳君北面而朝奉阳君于邯郸，而赵氏不得所求之地。
- id: guji-li-dui-event-fengtao
  person_qid: guji-li-dui
  date: -0290
  year_of: -290
  type: territory
  name_zh: 齐以陶封奉阳君
  description_zh: 齐以奉阳君之封，使梁韩皆效地，欲以取赵而赵不得。
- id: guji-li-dui-event-stop-su-qin
  person_qid: guji-li-dui
  date: -0291
  year_of: -291
  type: political_action
  name_zh: 止苏秦于赵
  description_zh: 奉阳君止苏秦于赵，使不得之齐、之韩梁，苏秦患赵之不出己。
- id: guji-li-dui-event-zhouna
  person_qid: guji-li-dui
  date: -0290
  year_of: -290
  type: diplomacy
  name_zh: 使周纳告齐毋任苏秦
  description_zh: 奉阳君使周纳告齐王曰燕王请毋任苏秦以事，又言欲谋齐。
- id: guji-li-dui-event-sell-su-qin
  person_qid: guji-li-dui
  date: -0289
  year_of: -289
  type: political_action
  name_zh: 鬻苏秦归罪于燕
  description_zh: 薛公与奉阳君约攻齐，奉阳君鬻苏秦，归罪于燕，以定其封于齐。
- id: guji-li-dui-event-accept
  person_qid: guji-li-dui
  date: -0288
  year_of: -288
  type: diplomacy
  name_zh: 受苏秦传齐王之命
  description_zh: 苏秦告以齐王之约，奉阳君悦曰王又使周湿长驷重命兑，兑也敬受命。
- id: guji-li-dui-event-decline
  person_qid: guji-li-dui
  date: -0288
  year_of: -288
  type: political_note
  name_zh: 奉阳君与齐循善以定其封
  description_zh: 奉阳君所欲，循善齐秦以定其封，此其上计；齐赵循善则燕之大祸。
