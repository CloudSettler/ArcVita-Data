  era: 战国
  reign_ref: 赵惠文王时
  archetype: 权相与主父之臣
  dilemmas:
  - 专赵国之权与维持合纵攻秦之间的取舍
  - 以奉阳君之封与诸国外交利益的平衡
  lesson: 权臣以封邑与盟约交织，终因贪利定封而定天下纵横之局
  summary_first_person: 我李兑，世称奉阳君，当赵国之政，主合纵之谋。齐欲以陶封我，燕王请毋任苏秦以事，我与周纳言谋齐之语；后齐取宋，梁韩效地而赵不得，梁王北面临朝于邯郸。我主张完三晋之交、合纵攻秦，勿先反而收秦，以定我封于陶。
  source_urls:
  - 马王堆帛书《战国纵横家书》
