events:
- id: guji-李衡-event-birth
  event_type: birth
  date: '1100'
  year_of: 1100
  description: 李衡生于江都，高祖昭NotEmpty Natur素仕至侍御史，幼善博诵，为文操笔立就
  location: 江都
- id: guji-李衡-event-1
  event_type: career
  date: 1127
  year_of: 1127
  description: 登进士第，授吴江主簿；部使者怙势侵刻下民，衡投劾于府，拂衣而归
- id: guji-李衡-event-2
  event_type: career
  date: 1160
  year_of: 1160
  description: 知溧阳，专以诚意化民，二税以期日榜县门，乡无吏迹而输送先于他邑，四年狱户未尝系一重囚
- id: guji-李衡-event-3
  event_type: career
  date: 1164
  year_of: 1164
  description: 金人犯淮，沿江官多送其孥，衡独自浙右移家入县，民心大安；帅漕列上治状，诏进一秩，寻召为监察御史
- id: guji-李衡-event-4
  event_type: career
  date: 1173
  year_of: 1173
  description: 外戚张说以节度使掌兵柄，衡力疏其事，廷争移时改除起居郎；与其进而负于君孰若退而合于道，章五上请老，以秘阁修撰致仕；莫济不书敕、周必大不草制、王希吕相继论奏，士为四贤诗纪之
- id: guji-李衡-event-5
  event_type: scholarly
  date: 1120
  year_of: 1120
  description: 宣和间入辟雍，同舍赵孝孙劝读《论语》，谓学不可有丝毫伪；衡心佩其训，终身以《论语》为根本
- id: guji-李衡-event-death
  event_type: death
  date: 1178-06-23
  year_of: 1178
  description: 淳熙戊戌夏，觉不喜食即赴乐庵；作手简遍别亲旧，分钱米惠贫者，遗训六事示诸子；至夜沐浴冠栉起坐，二鼓翛然而逝，享年七十九
  location: 昆山乐庵
