  reign_ref: 高宗绍兴、孝宗隆兴、淳熙年间
  archetype: 学道践履、直道而退的儒臣
  dilemmas:
  - 仕进之利与直道去国之间的抉择（论张说掌兵柄，廷争改除起居郎，仍五上章请老）
  - 对部使者侵刻下民，不忍敲扑迎合，投劾拂衣而归
  lesson: 与其进而负于君，孰若退而合于道
  summary_first_person: 我李衡字彦平，江都人。登进士第后历任吴江主簿、溧阳知县，以诚意化民；绍兴、隆兴间历监察御史、司封郎中，出知温婺台三州，除侍御史。因力疏外戚张说不当掌兵柄，与其进而负君，不如退而合道，遂以秘阁修撰致仕。定居昆山，结屋种竹，号乐庵，聚书万卷，以《论语》为学之根本，终生讲明性命道德之学，临终翛然而逝，时人谓孔门闻道者。
  source_urls:
  - https://zh.wikisource.org/wiki/樂庵語錄
