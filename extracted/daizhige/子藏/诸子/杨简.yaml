  person: guji-杨简
  summary: 某三十有一，于富阳簿舍双明阁下侍象山先生坐问答之间，忽觉此心清明澄然无畔，知吾心即道。
- id: guji-杨简-event-shushi
  date: '1184-08-00'
  year_of: 1184
  type: endeavor
  person: guji-杨简
  summary: 淳熙十一年八月朔既领浙西抚属事，僦宅隘陋，因得宝莲山僧屋创书室于高爽之地，帅君更其居并使惟意规摹之。
- id: guji-杨简-event-yongchun
  date: '1185-00-00'
  year_of: 1185
  type: endeavor
  person: guji-杨简
  summary: 应书咏春铭堂，敷明曾晳沂咏之旨，并铭时斋、勿斋、熙光、昭融等诸室，皆归咏春之旨。
- id: guji-杨简-event-shicai
  date: '1210-00-00'
  year_of: 1210
  type: endeavor
  person: guji-杨简
  summary: 分牧东嘉，释菜于至圣文宣王，以忠信大道告东嘉人士，使学者自觉日用平常实直之心即大道。
- id: guji-杨简-event-death
  date: '1226-00-00'
  year_of: 1226
  type: death
  person: guji-杨简
  summary: 杨简卒于约1226年（据行年七十八之记载约推）
