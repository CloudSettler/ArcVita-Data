person:
  qid: guji-杨简
  name_zh: 杨简
  names:
    zh: 杨简
    en: Yang Jian
  lifespan:
    birth:
      date: '1141-00-00'
      precision: year
      is_circa: true
      raw: 行年七十八（由卒年约1226上推）
    death:
      date: '1226-00-00'
      precision: year
      is_circa: true
  birth_date: '1141-00-00'
  death_date: '1226-00-00'
  era: 南宋
  reign_ref: 淳熙
  archetype: 心学儒者
  dilemmas:
  - 尊孔子“心之精神是谓圣”之说与恪守程朱诚意正心之教之间的张力
  lesson: 心本虚明，毋意毋蔽，日用平常实直之心即道
  summary_first_person: 我杨简自谓三十有一于富阳双明阁下侍象山先生而忽觉此心清明澄然无畔，遂笃信心之精神是谓圣、人之本心与尧舜同，终生以毋意去蔽、忠信即道之旨教示学者。
endeavors:
- id: guji-杨简-endeavor-1
  name_zh: 从学陆九渊，得觉本心
  phases:
  - key: brewing
    name_zh: 早年承训，穷究此道
    labels:
      zh:
      - 自總角承先大夫训迪
    start_date: '1153-00-00'
    highlight_event_id: guji-杨简-event-enlighten
  - key: breakthrough
    name_zh: 富阳双明阁下忽觉此心清明
    labels:
      zh:
      - 侍象山先生坐问答之间某忽觉
    start_date: '1172-00-00'
    highlight_event_id: guji-杨简-event-enlighten
  - key: climax
    name_zh: 以圣言证心，告学者吾心即道不可更求
    labels:
      zh:
      - 得圣人之言以证以告学子
    start_date: '1173-00-00'
    highlight_event_id: guji-杨简-event-enlighten
  - key: closure
    name_zh: 晚年行年七十八日夜兢兢，述道心之旨
    labels:
      zh:
      - 行年七十有八日夜兢兢
    start_date: '1218-00-00'
  decisions:
  - date: '1172-00-00'
    title_zh: 于富阳簿舍从象山问答忽觉本心
    rationale: 问答之间忽觉此心清明澄然无畔，遂自信人皆本心与圣贤同
- id: guji-杨简-endeavor-2
  name_zh: 仕宦与兴学
  phases:
  - key: breakthrough
    name_zh: 为浙西抚属，宝莲山创书室
    labels:
      zh:
      - 四明杨某为浙西抚属
      - 创书室于高爽之地
    start_date: '1184-09-00'
    highlight_event_id: guji-杨简-event-shushi
  - key: climax
    name_zh: 分牧东嘉，释菜告学者
    labels:
      zh:
      - 兹分牧东嘉又将以告东嘉人士
    start_date: '1210-00-00'
    highlight_event_id: guji-杨简-event-shicai
  - key: closure
    name_zh: 教学不辍， restrains 起意之判教
    labels:
      zh:
      - 先圣特曰复所以针二千载之膏肓
    start_date: '1215-00-00'
  decisions:
  - date: '1184-08-00'
    title_zh: 领浙西抚属事后僦宅并请更居宝莲山
    rationale: 僦宅隘陋无宴息之所不可奉亲，乃创书室于高爽之地
- id: guji-杨简-endeavor-3
  name_zh: 铭咏春诸堂，阐时斋之旨
  phases:
  - key: breakthrough
    name_zh: 书咏春铭堂，敷明曾晳沂咏之旨
    labels:
      zh:
      - 恪也请书咏春以铭堂
    start_date: '1185-00-00'
    highlight_event_id: guji-杨简-event-yongchun
  - key: climax
    name_zh: 科名时斋、勿斋、熙光诸室，皆归咏春之旨
    labels:
      zh:
      - 东院曰熙光
      - 西房曰勿斋
    start_date: '1186-00-00'
    highlight_event_id: guji-杨简-event-yongchun
  - key: closure
    name_zh: 属辞比事为职，自谓不乱于意
    labels:
      zh:
      - 着庭以属辞比事为职
    start_date: '1190-00-00'
  decisions:
  - date: '1185-00-00'
    title_zh: 应恪之请敷明咏春之旨并铭东西房
    rationale: 入事亲出事君皆其旨，一以发明日用平常之心即道
events:
