  dilemmas:
  - 辞艰理僻不为时人所知，退而改撰《伸蒙子》以求傳世
  - 遁隐著述与践行王道之间的出处抉择
  lesson: 持论醇正，学周公仲尼之道，敷陈古今以垂鉴后世
  summary_first_person: 我是唐人林慎思，字虔中，号伸蒙子。旧著《儒范》七篇辞艰理僻不为人知，遂斋沐祷祝，梦得蒙卦之象，感而自号伸蒙子。我退栖槐里，与二三子辩论兴亡，编成《伸蒙子》上中下三卷，所述皆周公仲尼之道、尧舜文武之事，以槐里辨、泽国纪、时喻敷陈天地人君臣之道。
  source_urls:
  - source: https://zh.wikisource.org/wiki/伸蒙子
