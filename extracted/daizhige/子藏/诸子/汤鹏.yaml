    start_date: '1835'
  decisions:
  - date: '1823'
    title_zh: 弃制艺而追摹古诗
    rationale: 自谓制艺不足言文，取汉魏六朝迄唐诗歌必求其似，务备其体。
  - date: '1834'
    title_zh: 见言不用，乃大著书
    rationale: 欲有所暴白于天下，通论治道学术，而立意为幹、支幹相演。
