      raw: 道光二十四年七月九日
  birth_date: '1804'
  death_date: '1844-08-22'
  era: 清代嘉庆、道光年间
  reign_ref: 道光
  archetype: 骨鲠敢言之士 / 自成一子的著述家
  dilemmas:
  - 直言弹劾宗室尚书而遭黜，言路与现实的两难
  - 英夷犯境之际已罢言职，欲进言而不能，只能转奏三十事
  - 才高自负，欲“奄有古人”，然仕途偃蹇、书生之见不见用
  lesson: 负才气者当有所树立，事不得施则著之于言，然直道难容，愤郁而终。
  summary_first_person: 我汤鹏，字海秋，湖南益阳人。道光三年二十岁成进士，历官礼部主事、军机章京、户部主事、山东道监察御史。我负气敢言，曾弹劾叱辱满司官的宗室尚书，因此罢御史。英夷犯海疆，我虽已黜犹条上善后三十事，而人笑为书生之见。既不得施于事，乃著《浮邱子》九十馀篇、四十馀万言，兼为诗歌三千首，欲与陆宣公、朱子并驾，卒年四十四。
  source_urls:
  - https://zh.wikisource.org/wiki/浮邱子
