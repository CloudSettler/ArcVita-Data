    title_zh: 援嘉庆故事力争宗室尚书处分
    rationale: 以为臣不可奴隶辱朝吏，此作威作福之渐，吏议不足以儆。
  - date: '1840'
    title_zh: 已黜仍条上夷务善后三十事
    rationale: 愤英夷事起、议抚通市，虽不得进言，犹托尚书转奏。
