  name_zh: 汤鹏
  names:
    zh: 汤鹏
    en: Tang Peng
  lifespan:
    birth:
      date: '1804'
      precision: year
      is_circa: true
      raw: 道光三年年甫二十
    death:
      date: '1844-08-22'
      precision: day
