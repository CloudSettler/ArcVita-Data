  birth_date: 约公元前385年
  death_date: 约公元前337年
  era: 战国
  reign_ref: 韩昭侯
  archetype: 法家术治派思想家
  dilemmas:
  - 主张君主以术驭臣、藏于无为，与臣下专权蔽君的现实之间存在永恒张力
  - 任法任数而不任智，但治国又须依赖君主个人察奸之术，法治与术治难以兼全
  lesson: 明君如身，臣如手；君操其柄而臣行其事，名正则天下自定
  summary_first_person: 我是申不害，郑国京邑人，后为韩相。我主张君主明法审令、以术御臣——藏于无事、示天下无为，使臣并进辐凑而莫得专君。名自正而事自定，君设其本，臣操其末，此我术治之要。
  source_urls:
  - https://zh.wikisource.org/wiki/申子
