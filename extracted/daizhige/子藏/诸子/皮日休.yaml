  archetype: 隐逸文人
  dilemmas:
  - 出处行藏：隐于鹿门抑或出仕用世
  - 道与志：圣人能与人道，不能与人志
  lesson: 道不在于自用，文学如药，善服有济，不善服反为害
  summary_first_person: 我隐居鹿门，号醉士，著《隐书》六十篇，论圣人不语怪力乱神之深意，辨古今奢侈节俭、用人交友之道，忧天下之乱而守圣贤之介。
