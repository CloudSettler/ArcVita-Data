  lesson: 择所当染，谨其所染，近仁义之友方能成名安身
  summary_first_person: 我是禽滑釐，墨子的高足弟子。墨子言“所染”，以染丝为喻，将我与段干木、傅说并举，谓我等交友皆好仁义、淳谨畏令，故处官得其理，家日益、身日安、名日荣。我一生谨守师教，以勤苦力行传墨者之道。
  source_urls:
  - https://zh.wikisource.org/wiki/墨子/所染第三
