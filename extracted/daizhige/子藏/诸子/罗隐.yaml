  reign_ref: 唐末·吴越钱镠
  archetype: 怀才不遇的务实文臣
  dilemmas:
  - 十次应举不第，是否坚持科举正途
  - 朱温篡唐以谏议大夫相召，出仕新朝还是另投钱镠
  lesson: 怀才不遇不可执于一名，转向可以施展所学的平台，亦可自成一家
  summary_first_person: 我本名罗横，新城人，十次应试不中第，遂改名罗隐。朱温篡唐后以谏议大夫召我，我不应命，转而归吴越钱镠，先后任钱塘令、掌书记、节度判官、给事中等职。我撰有谗书、淮海寓言与两同书，两同书十篇上卷终以老氏之言、下卷终以孔子之言，会通儒道。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=两同书
