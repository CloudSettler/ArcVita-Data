  dilemmas:
  - 兼采心性与问学，折衷诸家而不立门户
  - 力伸阳明师说而又忧世儒执一见之偏
  lesson: 见大而后能平，折衷于圣与心，方衡天下之言。
  summary_first_person: 我胡直，字正甫，泰和人，学者称庐山先生。先攻古文词，年二十六聆欧阳南野讲学而折节事之，三十后兼师罗念庵，私淑阳明。著衡齐九篇，以“衡”平诸家之争、以“齐”和其异，力主尽性至命之学，倡道东南，门下考德问业者众。
