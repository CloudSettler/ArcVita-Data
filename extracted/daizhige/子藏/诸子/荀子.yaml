  archetype: 思想家与学派宗师
  dilemmas:
  - 主张性恶却志在化性起伪，教化的根基与出路何在
  - 隆礼重法与战国纷争现实之间的张力
  - 三为稷下学宫祭酒而终遭谗言流亡
  lesson: 学不可以已，锲而不舍，金石可镂
  summary_first_person: 我名荀况，世称荀子。我不信生而知之，只信积学至于圣人，故作《劝学》开篇言学不可以已。我以为人性本恶，其善者伪也，唯礼义师法可以化性。我曾三为齐国稷下祭酒，掌兰陵而终老于著书，将儒家的礼与法衔接，传《荀子》三十二篇于后世。
  source_urls:
  - https://zh.wikisource.org/wiki/荀子
