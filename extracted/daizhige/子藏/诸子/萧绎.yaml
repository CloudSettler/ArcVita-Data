  era: 南北朝（梁）
  reign_ref: 梁孝元皇帝（承圣年间，552-554）
  archetype: 勤学者帝王
  dilemmas:
  - 身为藩王而志于著述，晚年遭国破身死，书与业两相矛盾
  - 自称'五百年运余何敢让'上比孔子，声誉与僭越之讥并存
  lesson: 立德著书以求不朽，然政乱身危则文业难保，劝戒兼资亦瑕瑜不掩。
  summary_first_person: 我是梁孝元皇帝萧绎，在藩时自号金楼子，博总群书、勤于著述，夜以继日撰成《金楼子》一家之言；后登帝位于江陵，然世乱国蹙，文业与功名终难两全。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=金楼子
