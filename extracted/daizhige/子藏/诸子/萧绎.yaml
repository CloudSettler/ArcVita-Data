events:
- id: guji-萧绎-event-birth
  name_zh: 萧绎生
  date: 约508
  year_of: 508
  kind: birth
  summary: 梁武帝之子，生于天监年间（约508年）。
- id: guji-萧绎-event-endeavor-1
  name_zh: 藩邸自号金楼子并撰著其书
  date: 约540
  year_of: 540
  kind: endeavor
  summary: 其在藩时尝自号金楼子，因以名书；文案盈前而书幌未辍，俾夜作昼，躬自搜纂为一家之言。
- id: guji-萧绎-event-endeavor-2
  name_zh: 《金楼子》湮没后自《永乐大典》辑为六卷
  date: '1781'
  year_of: 1781
  kind: endeavor
  summary: 明季其书遂亡；乾隆四十六年（1781）四库馆臣自永乐大典各韵裒缀互订，厘为六卷，恭校上梓。
- id: guji-萧绎-event-endeavor-3
  name_zh: 即皇帝位于江陵
  date: '552'
  year_of: 552
  kind: endeavor
  summary: 承圣年间萧绎于江陵即帝位，是为梁孝元皇帝。
- id: guji-萧绎-event-death
  name_zh: 萧绎卒
  date: '555'
  year_of: 555
  kind: death
  summary: 江陵陷落，萧绎遇害身亡，梁祚摇落。
