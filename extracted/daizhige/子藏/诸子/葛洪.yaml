  era: 晋
  reign_ref: 东晋
  archetype: 方术求仙的奇士
  dilemmas:
  - 深溺神仙黄白之术，弃《六艺》正学而专志丹道
  - 以博闻深洽之才杂引诞亵荒诞之说
  lesson: 奇才若舍方技而学《六艺》，则无可御之；然沉溺方术终为惜也
  summary_first_person: 我葛洪，字稚川，晋人也。我博闻深洽，江左绝伦，撰《抱朴子》《内篇》二十卷言神仙黄白变化之事，《外篇》十卷驳难通释。我曾于马迹山中从郑君隐受《九鼎》《金液》二经，其学承自葛仙公玄，玄乃我从祖。我深信神仙可学，合丹砂黄金为药服之可得长生。虽文辞不近古，然纡徐蔚茂，旁引曲证，必达己意乃已。
