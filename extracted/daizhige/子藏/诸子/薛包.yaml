person:
  qid: guji-薛包
  name_zh: 薛包
  names:
    zh: 薛包、薛孟尝
    en: Xue Bao
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 东汉安帝前后
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: 建光年间后
  birth_date: ''
  death_date: ''
  era: 东汉
  reign_ref: 汉安帝建光年间（121–122）
  archetype: 孝友让财之士
  dilemmas:
  - 父听后妻之谮憎恨驱逐，孝亲与保全自身相冲突
  - 弟子求分财异居，让产与保家业相冲突
  - 朝廷特征拜侍中，仕宦与恬虚隐退相冲突
  lesson: 至孝感亲，让财成德；宠辱不惊，恬退自守。
  summary_first_person: 我薛包好学笃行，母丧以孝闻。父为后妻所惑而逐我，我泣不忍去，被殴杖后乃庐于舍外、里门，晨昏洒扫省视不废，积岁余父母惭而迎还。服丧六年哀逾常制。后与弟子分财，我取老弱奴婢、荒顿田庐、朽败器物，弟子破产我复赈给。建光中被特征拜侍中，我性恬虚，称疾以死自乞，蒙诏赐告归。
