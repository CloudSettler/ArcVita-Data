  era: 春秋末期
  reign_ref: 越王句践
  archetype: 谋士与经济学家
  dilemmas:
  - 不肯自显诸侯，隐性辅佐七国，天下莫知
  - 认为越王为人鸟喙，不可与同利，却仍受范蠡师事并传授经世之道
  lesson: 早知天地之反，为之预备；水则资车，旱则资舟
  summary_first_person: 我姓辛，名文子，晋国亡公子之后，人称计然。我博学通达，学阴阳，见微知著，却隐于海泽，号渔父，暗利于七国。范蠡卑身事我，请受道于石室。越王问政，我教以积蓄、省赋、劝农桑、平粜之术，指出籴价二十伤农、九十病末，上不过八十、下不过三十，则农末俱利。又以太阴之岁论丰年凶年循环，望阳出粜、从阴收著，三年五倍，助越富国强兵，终灭吴称霸。
  source_urls:
  - 《越绝书·越绝计倪内经》
  - 《吴越春秋·句践阴谋外传》及《富国》篇
  - 《史记·货殖列传》
