  - 究极仁学与救亡图存之间以死证道
  lesson: 以仁通为第一义，冲决网罗，虽死无悔
  summary_first_person: 我自少遭纲伦之厄，濒死累矣而卒不死，遂轻生命而怀墨子摩顶放踵之志。我著《仁学》五十篇，以仁以通，冲决利禄、俗学、君主、伦常乃至佛法重重网罗。戊戌政变，我自觉中国未闻有因变法而流血者，请自嗣同始，终以身殉道。
  source_urls:
  - https://zh.wikisource.org/wiki/仁学
