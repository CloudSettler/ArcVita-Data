  dilemmas:
  - 此书经历“小儒以私意改定”，脱误滋生，训解有失本真之虞
  - 诸说纷纭，须依先师旧训与经史互证，避免注家附会之失
  lesson: 注书当以训诂简质、驳正引证为务，宁存疑阙而不蹈附会
  summary_first_person: 我是东汉涿人高诱，承先师旧训注解《吕氏春秋》《淮南子》《战国策》《孝经》，并正《孟子》章句。我为之解凡十七万三千余言，务求训诂简质、引证有据，有纰缪不经者，望后之君子裁断。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=5976
