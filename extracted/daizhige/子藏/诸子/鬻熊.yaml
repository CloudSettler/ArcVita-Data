  lesson: 使臣捕兽逐麋已老矣，使臣坐策国事尚少也
  summary_first_person: 我名熊，楚人，祝融之后。年九十而见文王，自言捕兽逐麋已老，坐策国事尚少，文王遂师事我。我论道进言，为诸子之首唱，后世传《鬻子》一书，托我之名流传。
