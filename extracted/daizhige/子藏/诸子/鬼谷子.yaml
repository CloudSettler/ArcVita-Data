    title_zh: 潜心著述捭阖揣摩之术
    rationale: 观天下纷错、上无明主，遂深隐鬼谷，将纵横谋略之道著为篇章，以俟后世
  - date: -208
    title_zh: 功成不居，退隐不出
    rationale: 世无可抵则深隐待时，不为诸侯强征所动，守神于天地
