person:
  qid: guji-鬼谷子
  name_zh: 鬼谷子
  names:
    zh: 鬼谷子
    en: Guiguzi
  archetype: 纵横家鼻祖·谋略宗师
  dilemmas:
  - 谋略之术可兴邦亦可倾国，传道与否的道德拷问
  - 隐居避世与弟子出山济世的进退抉择
  lesson: 捭阖有道，知人先知己；深隐待时，因事为制
  summary_first_person: 我隐居于鬼谷，观阴阳开阖之道，著《鬼谷子》十三篇，以捭阖、揣摩、飞箝之术教苏秦、张仪诸徒，使纵横游说之学行于天下。我主张圣人不泥常道，世可治则抵而塞之，不可治则抵而得之，深隐以待其时。
  era: 战国
  reign_ref: 相传活动于战国中期
  source_urls:
  - https://zh.wikisource.org/wiki/鬼谷子
