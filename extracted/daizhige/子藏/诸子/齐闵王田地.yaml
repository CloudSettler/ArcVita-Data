  era: 战国
  reign_ref: 齐闵王（齐湣王）
  archetype: 霸权执迷的君王
  dilemmas:
  - 攻宋取淮北而招致诸侯合谋伐齐
  - 于齐赵、齐燕之间反复权衡盟约取舍
  - 称帝伐秦与湣下存宋的战略抉择
  lesson: 恃强失信、四面树敌，纵有一时之明终致众叛亲离、身死国破。
  summary_first_person: 我田地即位为齐王后，灭宋残据淮北，率梁王朝赵，一度称帝伐秦，又谋取三晋。然我多疑寡信，不信燕而疏于防备，乐毅率五国联军破齐，我出亡被杀，齐国几乎亡国。
  source_urls:
  - https://zh.wikipedia.org/wiki/齊湣王
