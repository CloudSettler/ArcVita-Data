  - 取法乎上与时尚流俗之争
  lesson: 取法乎上，仅得乎中；学书必精六书，通篆籀乃得古法
  summary_first_person: 我丰坊，鄞县人，晚号南禺外史，工书法，藏碑帖甚富。今作《书诀》，历数双钩悬腕、让左侧右、虚掌实指、意前笔后之要诀，考金石文字、六书之法，论笔墨纸砚之制，欲以正本清源，使学者知师法古人之贵，不入浊俗之流。
