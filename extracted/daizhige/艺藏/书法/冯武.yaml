events:
- id: guji-冯武-event-birth
  date: '-1627'
  year_of: '1627'
  title: 冯武约生于常熟
  text: 冯武号简缘，常熟人，冯班之从子，约生于明天启年间。
- id: guji-冯武-event-background
  date: '-1645'
  year_of: '1645'
  title: 遭乱离，破巢完卵，久焚笔砚
  text: 自叙称“余少而遭乱离，破巢完卵，久焚笔砚，长而以家累久事村塾”，书学得之家学。
- id: guji-冯武-event-write
  date: '-1707'
  year_of: '1707'
  title: 丁亥年馆苏州缪曰芑家，述《书法正传》
  text: 年八十一，时馆苏州缪曰芑家，为述此书，专论正书之法，于树滋堂窗明几净中旬日成编。
- id: guji-冯武-event-annotate
  date: '-1707'
  year_of: '1707'
  title: 为翰林要诀等三家作补注
  text: 首陈绎曾《翰林要诀》、周伯琦所传《书法三昧》、李溥光《永字八法》“其语意有未显者，则武为补注以明之”，使一见了然。
- id: guji-冯武-event-compile
  date: '-1707'
  year_of: '1707'
  title: 纂言三卷、书家小传、名迹源流
  text: 纂言三卷历举历代书家之微论，提要钩玄；又作《书家小传》《名迹源流》各一卷以稽考晋唐名迹真赝存亡。
- id: guji-冯武-event-publish
  date: '-1707'
  year_of: '1707'
  title: 自叙成书，手定编次
  text: 作《书法正传自叙》，虞山简缘冯武述；侄孙冯鼎谨识铺叙编次付梓之由。
- id: guji-冯武-event-death
  date: '-1700'
  year_of: '1700'
  title: 冯武约于康熙年间卒
  text: 卒年不详，约于康熙年间去世，卒年约八十余。
