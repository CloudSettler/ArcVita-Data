      precision: year
      is_circa: true
      raw: 丁亥年（1687年自叙）自称“马齿八十一”，逆推约生于1627年
    death:
      date: '1700'
      precision: year
      is_circa: true
  birth_date: '-1627'
  death_date: '-1700'
  era: 清初
  reign_ref: 康熙
  archetype: 学者型书家·书法理论纂述者
  dilemmas:
  - 鼎革之后僻处乡曲，藏书散佚，见闻有限而欲剖明千古不传之书学秘奥
  - 年老风烛而不忍书学“不绝如线”，在藏拙与公诸天下后世之间抉择
  lesson: 大道不宜秘传，与其使如线之绪终绝，孰若公诸天下后世，以待后起者驰骋康庄之衢。
  summary_first_person: 我冯武，号简缘，常熟人，书法名于一时之冯班从子。少遭乱离，焚笔砚，长事村塾，然于书学颇有渊源。年八十一时馆苏州缪曰芑家，述成《书法正传》十卷，专论正书之法，冀以嘉惠后学。
  source_urls:
  - https://ctext.org/library.pl?if=gb&resu=1
