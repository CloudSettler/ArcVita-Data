  reign_ref: 万历、崇祯、顺治、康熙
  archetype: 书学家·诗论家
  dilemmas:
  - 尊古法与时流新意的取舍：既言"变古法须有胜古人处"，又力斥后生耻言模仿古人
  - 碑刻与真迹之辨：间架可看石碑，用笔非真迹不可
  lesson: 书法无他秘，只有用笔与结字；本领者将军也，心意者副将也。
  summary_first_person: 我一生究心书法，谓用笔与结字为二要，结字晋人用理、唐人用法、宋人用意；力排"奴书"之论，为赵松雪辩护，教人先学间架、次学用笔，须看真迹与碑刻两不相废。
  source_urls:
  - https://zh.wikisource.org/wiki/钝吟书要
