  dilemmas:
  - 尺牍辞赋与鸿都门学是否合乎经术取士的正统
  lesson: 帝王雅好书艺，亦能以课试聚才，然鸿都门学之设，士论颇有訾议
  summary_first_person: 我讳宏，肃宗元孙也。好学善书，自作皇羲篇五十章，始置鸿都门学生，敕州郡举召能为尺牍辞赋及工书鸟篆者课试至千人。熹平中诏诸儒正五经文字，命蔡邕等书刻石立于太学。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=2063
