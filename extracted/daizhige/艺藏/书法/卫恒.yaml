  archetype: 书法家·书论家
  dilemmas:
  - 身居权要而潜心书艺，仕途显贵与书法理论研究难以两全，终因卷入宫廷政争而殒命
  lesson: 以"尚象"审美总结古体书势，为魏晋书法理论奠基；然而依附权门者，祸福难料
  summary_first_person: 我是西晋卫恒，河东安邑人，官至尚书郎、黄门侍郎。我承家学而善书，撰《四体书势》，综述古文、篆、隶、草四体之源流并系以赞辞，为魏晋书论"尚象"一脉的重要著作。惜乎卷入政争，为楚王司马玮所害，年未竟其业。
  source_urls:
  - https://zh.wikipedia.org/wiki/卫恒
