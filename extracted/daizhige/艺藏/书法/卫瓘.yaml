  lesson: 融会诸家而自出新意，方成一家之妙
  summary_first_person: 我名卫瓘，字伯玉，卫觊之子。幼年为魏尚书郎，后仕晋官至司空。我善书法，与索靖齐名，时人称我们为"一台二妙"。我采张芝的草法，参以先父之书，更为草稿，世人评说"伯玉得筋"，又谓我有楷法而书风骨力独运。
