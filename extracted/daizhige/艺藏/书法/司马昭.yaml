    title_zh: 讨平淮南诸葛诞之叛后专断魏政
    rationale: 三叛既平，司马氏代魏之势已成，遂加九锡、进爵晋公。
  - date: '263'
    title_zh: 遣钟会、邓艾、诸葛绪三路伐蜀
    rationale: 蜀汉连年北伐耗损国力，乘隙一举兼并，立不世之功。
