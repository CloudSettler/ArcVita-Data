  name_zh: 司马昭
  names:
    zh: 司马昭
    en: Sima Zhao
  lifespan:
    birth:
      date: '211'
      precision: year
      is_circa: true
      raw: 约211年
    death:
      date: 265-09-06
      precision: day
      is_circa: false
  birth_date: 约太和五年（211年）
  death_date: 魏咸熙二年八月（265年9月）
  era: 三国·魏
  reign_ref: 魏明帝至魏元帝时期
  archetype: 权臣书法家
  dilemmas:
  - 身为权相而翰墨见称，武功与书艺并驰
  - 位极人臣而终身称臣，禅代之业留待子孙
  lesson: 权位一时，艺名千古；文皇帝之手迹亦入书家品流。
  summary_first_person: 我司马昭，字子上，河内温县人，晋宣帝司马懿次子。我官至魏相国、录尚书事，封晋文王，甘露年间平定淮南之叛，景元年间遣钟会、邓艾灭蜀。世人评我「量蕴文儒，才苞古人」，谓我笔迹高子
    上之雄神，可与兄长司马师之瑰迹并称。我子司马炎受禅建晋，追尊我为文皇帝。
  source_urls:
  - https://zh.wikisource.org/wiki/述书赋
