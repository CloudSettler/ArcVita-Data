  - date: '250'
    title_zh: 以文儒之量寄于笔墨
    rationale: 寄词达礼、任道怀仁，书迹遂为唐人窦臮《述书赋》所录，与王羲之诸贤同列品流。
events:
- id: guji-司马昭-event-birth
  date: '211'
  year_of: '211'
  type: birth
  title_zh: 司马昭出生
  description: 河内温县人，宣帝司马懿次子，母张春华，字子上。
- id: guji-司马昭-event-1
  date: '240'
  year_of: '240'
  type: career
  title_zh: 历官洛阳，预军国之谋
  description: 正始年间为散骑常侍，随父司马懿征讨，渐掌机要。
- id: guji-司马昭-event-2
  date: '255'
  year_of: '255'
  type: political
  title_zh: 继兄司马师辅政，为大将军
  description: 嘉平七年司马师卒于许昌，昭继为大将军、录尚书事，总揽朝政。
- id: guji-司马昭-event-3
  date: 263-11
  year_of: '263'
  type: military
  title_zh: 遣军灭蜀，进封晋公
  description: 邓艾入成都，刘禅出降，蜀汉亡；昭以殊功进位相国、封晋公，后进爵晋王。
- id: guji-司马昭-event-4
  date: '740'
  year_of: '740'
  type: legacy
  title_zh: 《述书赋》评其书迹
  description: 唐窦臮《述书赋》列司马昭为魏五书家之一，评曰「高子上之雄神」「量蕴文儒，才苞古人」「如睛郊驷马，维岳降神」，注称其「终魏相国、录尚书事，封文王，追尊文皇帝」。
- id: guji-司马昭-event-death
  date: 265-09-06
  year_of: '265'
  type: death
  title_zh: 司马昭卒，其子司马炎代魏建晋
  description: 昭卒于洛阳，谥文王；同年八月其子炎受禅，追尊昭为文皇帝，庙号太祖。
