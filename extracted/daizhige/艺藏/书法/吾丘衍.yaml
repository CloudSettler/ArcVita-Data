  decisions:
  - date: '1300-01-01'
    title_zh: 以《说文》为篆学根本，著三十五举以教后学
    rationale: 许慎作《说文》救汉篆之失，学者苟能通之，写不至差；故约定法度以正俗学。
  - date: '1305-01-01'
    title_zh: 主张白文印用汉篆平方正直、朱文不逼边
    rationale: 汉魏印章白文方正，唐宋朱文古法渐废，须复汉法以存古意。
