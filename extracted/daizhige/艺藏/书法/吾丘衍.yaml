  archetype: 文字学与篆刻理论家
  dilemmas:
  - 古法湮没：唐宋以来印文与篆法渐失古意，后世妄意盘屈
  - 传与守：学篆者无师承，把笔运腕多不得法
  lesson: 学篆必须博古，以《说文》为根本，尊汉法、守法度，不可随俗妄变。
  summary_first_person: 我是元代吾丘衍，精研篆隶与古印之法，作《学古编》三十五举，论蝌蚪古文之源、小篆笔法、汉印白文规矩，以正时俗，使学者知古法所在。
