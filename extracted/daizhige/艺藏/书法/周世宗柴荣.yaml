  name_zh: 周世宗柴荣
  names:
    zh: 周世宗柴荣
    en: Chai Rong (Emperor Shizong of Later Zhou)
  lifespan:
    birth:
      date: 0921
      precision: year
      is_circa: true
      raw: 邢州尧山，生年史载约后梁龙德前后
    death:
      date: 0959
      precision: year
      is_circa: false
  birth_date: 0921
  death_date: '959'
  era: 五代十国·后周
  reign_ref: 显德（955-959）
  archetype: 英武有为的开创之主，兼擅书法
  dilemmas:
  - 继明在御而命短，壮志未雪燕云
  - 因任旧臣绍述前烈与自创新局之间的平衡
  lesson: 英杰之主能克家，神武之略自见于笔端
  summary_first_person: 我本是太祖圣穆皇后之侄，丱岁事君后以孝谨闻，蒙太祖爱之，及长委以主器之重。继位后摧高平之阵、还秦凤之封，江北燕南取之如拾芥，惜天不假年，志未竟而殁。
  source_urls:
  - https://zh.wikisource.org/wiki/宣和書譜
