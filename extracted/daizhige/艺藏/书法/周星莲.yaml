  era: 清
  archetype: 书法家
  dilemmas:
  - 取法乎上而躐等求进，欲速则不达
  - 拘泥笔画形迹与超越笔墨之外的意趣难求两全
  lesson: 学书须循序渐进，由技进道，以敬为主，临摹之外贵在会悟。
  summary_first_person: 余酷嗜古人法书，临摹数十载，著有《临池管见》，于用笔、用锋、用墨、执笔诸法略有心得，愿与知书者共参。
