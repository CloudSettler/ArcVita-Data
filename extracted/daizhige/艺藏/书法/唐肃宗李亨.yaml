  era: 唐
  reign_ref: 唐肃宗
  archetype: 中兴之君
  dilemmas:
  - 明皇幸蜀，父老遮道留太子讨贼，忠孝与社稷难以两全
  - 以天下元帅提孤军抗衡渔阳之众，成败未可知
  lesson: 善将将而能御豪杰，方能削平祸乱、再造唐室
  summary_first_person: 我是明皇第三子李亨，天性仁孝，好学不倦，开元二十五年被立为太子。安史乱起，明皇幸蜀，父老遮道乞留我平贼，我遂以天下元帅提孤军抗衡渔阳之众，终使海岳一清，宗庙如故，再造唐室。即位之明年，我遣韦见素迎上皇自蜀还京，使父皇感悟自慰。郭子仪、李光弼皆天下豪杰，功名中兴第一，皆因我善将将而能御之。我早岁承明皇选贺知章等佳士侍读之教，又承父皇行书、八分、章草之家法，故行书气韵可与能字者争衡。
  source_urls:
  - https://zh.wikisource.org/wiki/宣和书譜/卷一
