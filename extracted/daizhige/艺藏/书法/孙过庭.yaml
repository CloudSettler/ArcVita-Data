  lesson: 勤学精思，运笔有法而切忌急速草率
  summary_first_person: 我是孙过庭，字虔礼，陈留人（一说富阳人），官至率府录事参军。我好古博雅，工于文词，以翰墨得名，所作草书咄咄逼人，直追王羲之、王献之，尤妙于用笔，儁拔刚断出于天才，非功用积习所至。评者称我之书如丹崖绝壑，笔势坚劲；又谓我真书不及草书。我善临摹，往往真赝难辨，撰《运笔论》数千言，妙尽作字之旨，学者宗以为法，然落笔喜急速，议者亦以此病之。
