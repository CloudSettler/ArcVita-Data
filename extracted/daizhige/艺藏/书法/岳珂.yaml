  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
- id: guji-岳珂-event-start-collecting
  event_type: career
  date: '1190'
  year_of: 1190
  title: 承家藏、初事收藏法书
  description: 承先君手装之帖，如轴玉标锦尚是先君手装，与后来所得御府帖无小异，遂有志于收藏鉴跋。
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
- id: guji-岳珂-event-jiading-acquire
  event_type: career
  date: '1218'
  year_of: 1218
  title: 嘉定年间广购法书
  description: 嘉定戊寅仲春得仁宗御汉体书二中都新婺州戎帅张松家；嘉定戊寅三月假守檇李，有钱氏孙澥持《浓风》帖求售，敬赎而取之。
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
- id: guji-岳珂-event-compile-book
  event_type: career
  date: '1220'
  year_of: 1220
  title: 编纂《宝真斋法书赞》
  description: 以家所藏前人墨迹，自晋唐迄于南宋，各系以跋而为之赞；诸家古帖尤征人论世，攷核精密。
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
- id: guji-岳珂-event-books-completed
  event_type: career
  date: '1215'
  year_of: 1215
  title: 著《九经三传例》《桯史》《金陀粹编》《愧郯録》诸书
  description: 珂所著九经三传例、桯史、金陀粹编、愧郯録诸书，世多传本。
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
- id: guji-岳珂-event-book-transmitted
  event_type: career
  date: '1225'
  year_of: 1225
  title: 书成传世，四库馆自《永乐大典》辑复
  description: 是书泯没零落逾数百年，原本为《永乐大典》割裂分系；乾隆间四库馆裒辑复见于世。乾隆四十九年十月恭校上。
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
