person:
  qid: guji-岳珂
  name_zh: 岳珂
  names:
    zh: 岳珂
    en: Yue Ke
  lifespan:
    birth:
      date: '1183'
      precision: year
      is_circa: true
      raw: 南宋时期
    death:
      precision: unknown
      is_circa: false
  birth_date: 约1183
  death_date: 约1243
  era: 南宋
  reign_ref: 嘉定、绍定、宝庆年间
  archetype: 学者型收藏家与鉴藏家
  dilemmas:
  - 身处南渡积弱之后、家难流离之际，如何在编著中既考订精密又发愤抒怀
  - 家藏法书面临散佚，如何汇集成书以传后世
  lesson: 以赏鉴兼文章，考人论世，精密考核，方能存文献于久远
  summary_first_person: 我是岳珂，字肃之，号亦斋，又号倦翁，岳飞之孙、岳霖之子。历官户部侍郎、淮东总领。我编纂《宝真斋法书赞》，汇集家藏晋唐迄南宋前人墨迹，各系以跋而为之赞；又著《九经三传例》《桯史》《金陀粹编》《愧郯录》诸书。
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
