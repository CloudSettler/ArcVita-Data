  decisions:
  - date: '1215'
    title: 决意汇辑家藏法书成书
    rationale: 家藏前人墨迹自晋唐迄于南宋，恐其散佚，故各系以跋而为之赞，编辑以成书
  - date: '1220'
    title: 将祖父手迹别为《鄂国传家帖》附于末
    rationale: 于宋诸家真迹终以鄂国传家，家怀旧藏不可与其他诸帖混淆，以示专敬
- id: guji-岳珂-endeavor-2
  name_zh: 考证诸家古帖、订补史传
  labels:
    zh: 学术考证
  phases:
  - key: brewing
    name_zh: 人论世考
    labels:
      zh: 精研考订
    start_date: '1215'
    highlight_event_id: guji-岳珂-event-jiading-acquire
  - key: climax
    name_zh: 订史补文
    labels:
      zh: 订是非补讹缺
    start_date: '1220'
    highlight_event_id: guji-岳珂-event-compile-book
  decisions:
  - date: '1220'
    title: 存诸帖异词，不没其实
    rationale: 前贤法帖释者聚讼，所载间有异词，数说皆通者并参存之
  - date: '1218'
    title: 按长历考订太宗札帖岁月
    rationale: 攷之建隆元年七月辛亥事，以验帖尾十三日之书，证其召见二相不召范质之由
- id: guji-岳珂-endeavor-3
  name_zh: 撰著《九经三传例》《桯史》《金陀粹编》《愧郯录》诸书
  labels:
    zh: 著述
  phases:
  - key: brewing
    name_zh: 家学与史料积累
    labels:
      zh: 治学积累
    start_date: '1205'
    highlight_event_id: guji-岳珂-event-start-collecting
  - key: breakthrough
    name_zh: 诸书撰成
    labels:
      zh: 撰述成书
    start_date: '1215'
    highlight_event_id: guji-岳珂-event-books-completed
  decisions:
  - date: '1215'
    title: 撰《金陀粹编》为祖父辨诬
    rationale: 处南渡积弱之余又当家难流离之后，关涉时事者多发愤激烈，情见乎词
