  date: '1183'
  year_of: 1183
  title: 岳珂出生
  description: 岳珂字肃之，号亦斋，又号倦翁，鄂国忠武王岳飞之孙，敷文阁待制岳霖之子。（生年约1183，古文未详）
  source_urls:
  - https://zh.wikisource.org/wiki/寶真齋法書贊
- id: guji-岳珂-event-death
  event_type: death
  title: 岳珂去世
