  summary_first_person: 我字子慎，新野人，起家晋安王国常侍，元帝时官至度支尚书。自少迄长留心书艺，虽敏手不逮临池，乃删善草隶者一百二十八人，推能相越、引类相附，分为九品，复为略论，总名《书品》。
