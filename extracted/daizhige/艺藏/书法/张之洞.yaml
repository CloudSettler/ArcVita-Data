  birth_date: '1837'
  death_date: '1909'
  era: 晚清
  reign_ref: 同治、光绪、宣统年间
  archetype: 倡导刻书传古的封疆大吏
  dilemmas:
  - 朝野争以变法强国为媒进，随波逐流而忽忽至暮年，兴学存古、进退失据
  - 欲求不朽而德业学问不足过人，是否刊布古书以传世
  lesson: 刻书者传先哲之精蕴，启后学之困蒙，其书终古不废，则刻书之人终古不泯
  summary_first_person: 我张之洞倡刻书为求不朽之善法，撰《书目答问》并附劝人刻书说，于粤督任内刻《广雅丛书》百数十种，光绪以来海内刻书之风因之大盛。然移节两湖二十年，未能续刻，随波逐流投身变法，忽忽至暮年，兴学存古而进退失据。七十生辰自撰《抱冰堂弟子记》，叙述本心欲如司马温公居洛著书，俯仰古今，宋贤邈矣。
  source_urls:
  - https://example.org/guji/shulinqinghua
