person:
  qid: guji-张彦远
  names:
    zh: 张彦远
    en: Zhang Yanyuan
  lifespan:
    birth:
      date: 0815
      precision: year
      is_circa: true
      raw: 约815年（唐宪宗元和年间）
    death:
      date: 0877
      precision: year
      is_circa: true
  birth_date: 0815
  death_date: 0877
  era: 唐
  reign_ref: 唐宪宗至唐僖宗时期
  summary_first_person: 我出身收藏世家，高祖河东公以来家传法书名画，惜经宪宗访求进献与长庆豳州散失，传家十无一二。我自幼习熟知见，虽竟不能学一字，然收藏鉴识有一日之长，遂采自古论书百篇勒为十卷，名《法书要录》，又撰《历代名画记》十卷，以为书画之事毕矣。
  dilemmas:
  - 家传珍迹屡遭进献散失，欲守先世收藏而不可得
  - 自幼浸淫书画却自愧不能书一字，转而以撰录鉴识传世
  lesson: 不能善书者亦可为书画之知音，编纂鉴识之功可传千古。
