  archetype: 书法理论家
  dilemmas:
  - 古今书评标准分歧巨大，前人评论多“鉴不圆通”，需自立评骘体系
  - 文字始祖之说异端蜂起，考证须“考穷乖谬，敢无隐于昔贤”
  lesson: 芟夷浮议，扬榷古今，以源流与三品优劣为纲，方能究书法之臧否。
  summary_first_person: 我张怀瓘，海陵人，开元中为翰林院供奉。因见历来书评纷纭失实，遂撰《书断》三卷，上卷叙古文至草书十体源流而系以赞，中下卷分神、妙、能三品论古今能书人，自苍颉迄卢藏用三千余年，欲Boston拔狐疑之根，探索幽微。
  source_urls:
  - https://example.org/guji/shuduan
