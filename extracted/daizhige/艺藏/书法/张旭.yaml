  archetype: 狂草书法大家/颠草之祖
  dilemmas:
  - 酒醉狂走落笔的颠逸与草法规矩之间的张力
  lesson: 艺术之颠狂须以规矩为源流，“张颠不颠”，奇 advertising怪百出而点画皆合规矩
  summary_first_person: 我是张旭，字伯高，苏州人，官至左率府长史。我善楷隶而尤工草书，世人称我“张颠”，每醉必叫呼狂走方落笔，曾以发濡墨作大字，醒后自以为神。我见担夫争道、闻鼓吹而知笔意，观公孙大娘舞剑器而得其神。后人师法我者众，我家法传于韩滉、邬彤、崔邈诸人。
