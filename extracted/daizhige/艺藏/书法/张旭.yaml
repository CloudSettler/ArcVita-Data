  description: 喜酒叫呼狂走方落笔，一日酒醉以发濡墨作大字，既醒视之自以为神。
- id: guji-张旭-event-career-4
  date: 约0750
  year_of: 约0750
  title: 官至左率府长史并以颠草名世
  description: 名本以颠草而至，小楷行书亦不减草字之妙，草字奇怪百出而无一点画不合规矩，学者师法者甚众。
- id: guji-张旭-event-death
