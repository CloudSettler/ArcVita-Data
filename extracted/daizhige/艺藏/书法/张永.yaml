  name_zh: 张永
  names:
    zh: 张永
    en: Zhang Yong
  lifespan:
    birth:
      date: '0400-01-01'
      precision: year
      is_circa: true
      raw: 刘宋时期人，生年不详，约当五世纪初
    death:
      date: '0470-01-01'
      precision: year
      is_circa: true
      raw: 卒年不详，约当南朝宋中期
    birth_date: 约400年
    death_date: 约470年
  era: 南北朝·刘宋
  reign_ref: 宋文帝元嘉年间
  archetype: 墨人
  dilemmas:
  - 出身将门而以巧思文具之艺显名，存在武职与匠艺身份的张力
  lesson: 欲善其事，必利其器；纸墨自营造，方得称心之具。
  summary_first_person: 我张永，字景云，吴郡吴人，张裕之子，仕宋官至征西将军。我涉猎书史，能为文章，善隶书，兼有巧思，为文帝所知。纸墨皆出自我亲手营造，帝每得我表启，辄执玩咨嗟，自叹供御者不及。我又奉诏更制御纸，紧洁光丽，耀日夺目；又合秘墨，色如点漆，一点竟纸，美殊前后。
  source_urls:
  - https://zh.wikisource.org/wiki/墨史
