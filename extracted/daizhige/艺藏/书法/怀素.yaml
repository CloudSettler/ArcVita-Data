    title_zh: 与钟繇、王羲之诸家同列品评
    rationale: 北宋内臣岑宗旦取汉迄唐善书者十有一人加以评骘，怀素与焉，谓其书闲逸翩翩如真仙，足见其艺在书法史上之位置。
