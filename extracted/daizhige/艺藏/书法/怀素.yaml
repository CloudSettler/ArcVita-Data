  archetype: 草书僧人书法家
  dilemmas:
  - 出身寒门寄身佛门，而书法之名其譟于世，须在戒律修持与艺术放逸之间自处
  lesson: 学书须自得于心、积学于外，纵逸而不失其法，方能笔下有凌云之气
  summary_first_person: 我是一个 transcendent 后世称怀素者，以草书轻逸放达著称；此段书史中，内臣岑宗旦论历代善书者，谓「怀素之间逸，故翩翩如真仙」，即以「闲逸」二字括我笔意。
  source_urls:
  - 来源：书史会要卷六（明陶宗仪撰）内臣岑宗旦评语条
