  era: 清末至民国初年
  reign_ref: 清代至民国二年（1913）
  archetype: 学者型书法教育家 / 幕僚出身的经师
  dilemmas:
  - 与上官不合：弃官从教之间的人格抉择
  - 遗稿未刊：学统传承与传世之难
  lesson: 学书先楷后行草、由大字入小字，循序渐进，法古而不泥古。
  summary_first_person: 吾博览群书，擅词章，精书法，前清以孝廉方正幕游四方，负才喜游。民国二年宦游秦中，因与上官不合，遂弃官设馆授教于陕南，生徒数百，陕南文化为之一变。所辑《书法辑要》辨正楷、行、草诸体门径，欲使学者依法学去，自易成家。
