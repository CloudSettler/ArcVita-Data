  dilemmas:
  - 书迹珍重于世，求书者众，故以铁限限门、退笔成冢，然真迹为好事者摹拓分散
  lesson: 精研家法、勤学不辍，书艺可传千载，然真迹一旦散佚，唯摹本与评定眼光可存其神
  summary_first_person: 俗姓王，为王羲之七世孙，居会稽永欣寺为僧，世称永禅师。我精研祖法，真草千文写本分布浙东诸寺，求书者踏破门限，退笔为冢。米元章所见我有归田赋真迹、千文搨本，纷纷为好事者摹写流传。
