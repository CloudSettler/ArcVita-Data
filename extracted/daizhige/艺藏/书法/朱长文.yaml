  archetype: 学者型书法理论家
  dilemmas:
  - 诸家议论分歧（如徐锴守许氏旧说与李阳冰自创新义之争），须折衷穿凿与遵循旧文之间
  - 原本十二卷而传世六卷，另附僭增之碑刻条目，考订去取艰难
  lesson: 综辑古人之书而不没其源头，间附己说以雅正，方能使遗文得传于后
  summary_first_person: 我是北宋朱长文，专论书学源流，搜辑古人成书编为八门成《墨池编》，间附己说，务求典雅，使前代遗文赖以得传。
endeavors:
- id: guji-朱长文-endeavor-1
  name_zh: 撰《墨池编》
  labels:
    zh: 书学著述
