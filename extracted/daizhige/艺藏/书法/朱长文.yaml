  decisions:
  - title_zh: 分书学为八门（字学、笔法、杂议、品藻、赞述、宝藏、刻碑、器用）
    rationale: 引古人成书而编类之，搜辑甚博，使前代遗文借以得传于后
  - title_zh: 于赞述门下自称编此书原为十卷，附器用后勒成两卷，合为十二卷
    rationale: 因读苏大文房四谱，取其有事禆于书者，赘于墨池编之末
- id: guji-朱长文-endeavor-2
  name_zh: 撰《吴郡图经续记》诸书
  labels:
