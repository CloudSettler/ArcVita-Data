  dilemmas:
  - 本姓奚而获赐国姓李，族居易水与歙州混淆，世多误以奚庭珪即李廷珪
  - 墨艺至精声名至贵，致世之好奇者借其姓名模仿伪造，真伪难辨
  lesson: 父子相承、精工不辍，遂使一艺成天下第一之品，而名愈重则伪者愈滋
  summary_first_person: 我本姓奚，出于易水，唐末随父李超渡江居歙州，地多美松，遂以制墨为业。世为南唐墨官，主偏赐我李姓。我墨坚如玉、纹如犀，削木不损、落水不坏，蔡君谟推为天下第一。后世至以宣和年间黄金易得而我墨不可得，然伪托我名者亦纷纷不绝。
  source_urls:
  - https://example.org/guji/moshi
