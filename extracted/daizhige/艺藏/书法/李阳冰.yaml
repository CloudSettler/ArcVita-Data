  lesson: 学古而不泥古，精研小学方能自成一家
  summary_first_person: 我是赵郡人李阳冰，官至将作大匠，以小篆著称。我先师李斯《峄山碑》，后见仲尼《吴季札墓志》，笔势变化开阖，如虎如龙，自言斯篆之后直至小生，时人谓之“笔虎”。大历二年我曾造供御墨，制如巨碑，坚泽如玉。
  source_urls:
