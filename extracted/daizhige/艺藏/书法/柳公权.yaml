  name_zh: 柳公权
  names:
    zh: 柳公权
    en: Liu Gongquan
  lifespan:
    birth:
      date: 0778
      precision: year
      is_circa: true
      raw: 约大历十三年
    death:
      date: 0865
      precision: year
      is_circa: true
  birth_date: 0778
  death_date: 0865
  era: 唐
  reign_ref: 唐代宗至唐懿宗年间，历穆宗、文宗、宣宗诸朝
  archetype: 楷书宗师·碑版之圣
  dilemmas:
  - 书艺极盛而传世真迹稀少，后世鉴藏中真伪难辨
  - 心正笔正的谏臣风骨与侍书近臣的身份张力
  lesson: 心正则笔正，书如其人；解散俗姿，以骨力垂范千古
  summary_first_person: 我是柳公权，字诚悬，唐世楷法之大家。世间相传我心正笔正之语，与颜鲁公并称颜筋柳骨。米元章论書虽讥公权丑怪恶札祖，谤议所集，然我紫丝靸书兰亭诗、跋老子西升经、书阴符经诸迹，历千年犹为藏家宝惜，聚讼纷纷。
endeavors:
- id: guji-柳公权-endeavor-1
  key: brewing
  name_zh: 研习书法，融颜欧新意
  labels:
    zh:
    - 书法启蒙
    - 楷法初成
  start_date: 0790
  highlight_event_id: guji-柳公权-event-career-1
  decisions:
  - date: 0790
    title_zh: 通习诸家而自成一格
    rationale: 博涉颜真卿、欧阳询笔法，以骨力劲健自树立。
- id: guji-柳公权-endeavor-2
  key: breakthrough
  name_zh: 以书侍帝，直言心正笔正
  labels:
    zh:
    - 侍书内廷
    - 直臣风节
  start_date: 0821
  highlight_event_id: guji-柳公权-event-career-2
  decisions:
  - date: 0821
    title_zh: 藉笔墨进谏
    rationale: 穆宗问笔法，对以用笔在心，心正则笔正，借艺进规。
- id: guji-柳公权-endeavor-3
  key: climax
  name_zh: 颜筋柳骨，碑版满天下
  labels:
    zh:
    - 自成一家
    - 大臣碑版多出其手
  start_date: 0840
  highlight_event_id: guji-柳公权-event-career-3
  decisions:
  - date: 0840
    title_zh: 尽弃欧颜旧姿而自立
    rationale: 变法出新，楷法遒媚劲健，与颜真卿并称。
- id: guji-柳公权-endeavor-4
  key: closure
  name_zh: 老年侍书而名誉聚讼
  labels:
    zh:
    - 晚年侍书
    - 千古论定
  start_date: 0858
  highlight_event_id: guji-柳公权-event-career-4
  decisions:
  - date: 0865
    title_zh: 身后书迹为宋世鉴藏聚讼之资
    rationale: 苏黄米薛诸家评骘公权书，毁誉相半，影响绵延。
