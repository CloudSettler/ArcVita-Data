  type: career
  date: 0850
  year_of: 0850
  era_name: 唐宣宗大中年间
  summary: 以紫丝靸书兰亭诗二帖，据米芾所记，龙图大谏李公帅府暇日出书，后归富郑公子宿州使君家。
- id: guji-柳公权-event-calligraphy-yinfu
  type: career
  date: 0855
  year_of: 0855
  era_name: 唐宣宗大中年间
  summary: 书阴符经，署会昌月日姓名，为马玘借去未还，其子能保惜，世称宣和以前识者宝之。
- id: guji-柳公权-event-career-4
  type: career
  date: 0858
  year_of: 0858
  era_name: 唐懿宗时
  summary: 以老年侍书近臣，誉满朝野；日光炬照，帝有小臣仅能指拂其纸。
- id: guji-柳公权-event-death
  type: death
  date: 0865
  year_of: 0865
  era_name: 唐懿宗咸通六年
  summary: 柳公权卒，赠太子太师。
