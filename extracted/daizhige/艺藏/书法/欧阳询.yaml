person:
  qid: guji-欧阳询
  name_zh: 欧阳询
  names:
    zh: 欧阳询
    en: Ouyang Xun
  lifespan:
    birth:
      date: '557'
      precision: year
      is_circa: true
      raw: 约梁太平二年
    death:
      date: '641'
      precision: year
      is_circa: false
      raw: 唐贞观十五年
  birth_date: 约557年
  death_date: 641年
  era: 隋末唐初
  reign_ref: 唐高祖、唐太宗年间
  archetype: 书法大家
  dilemmas:
  - 字即欧阳纥之子，家逢变故由陈入隋再入唐，历三朝而书名愈盛。
  - 学王羲之而不泥于王，险劲瘦硬自成一家，须在传统与自创间取舍。
  lesson: 猛锐长驱、日夜精研，方能在师法前贤之后自成一家，晚年笔力益刚劲。
  summary_first_person: 我是欧阳询，字信本，潭州临湘人，官至太子率更令、太常少卿，封渤海男。我由隋入唐，博通经史，喜字学，初学王羲之书，后险劲瘦硬自成一家，真行有王献之法，与智永旗鼓相攻而令其夺气。鸡林曾遣使求我书法，名重一时。晚年笔力益刚劲，有执法面折廷争之风，人以金刚瞋目、力士挥拳喻我书，又谓俊逸处如孤峰崛起、四面削成。飞白、隶、行、草入妙，大小篆、章草入能。
  source_urls:
  - https://example.org/guji/shushihuainyao
