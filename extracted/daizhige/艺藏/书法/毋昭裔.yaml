  dilemmas:
  - 贫贱借书遭拒之辱与日后刻书酬愿之间的取舍
  - 蜀归宋后家产受豪族侵夺，靠艺祖还板保全书板
  lesson: 借书受辱而立志刊布典籍，刻书兼积书与积德，终家累千金、文字大兴
  summary_first_person: 我早年为布衣，尝从人借《文选》《初学记》而遭难色，遂发愿异日若贵，必镂板以遗学者。后仕蜀至宰相，乃命工日夜雕板，印成二书，复雕九经诸史，两蜀文字由此大兴。蜀归宋时，艺祖见卷尾毋氏姓名，命以板还我，其书遂遍于海内。
  source_urls:
  - https://zh.wikisource.org/wiki/書林清話/卷一
