  description: 蒲津人，生年史无明文，早岁为布衣。
- id: guji-毋昭裔-event-borrow
  date: 0920
  year_of: 920
  type: endeavor
  title_zh: 从人借《文选》《初学记》遭难色
  description: 布衣时尝从人借《文选》《初学记》，多有难色，公叹恨贫不能力致，立愿他日刻板印之。
- id: guji-毋昭裔-event-carve
  date: 0935
  year_of: 935
  type: endeavor
  title_zh: 仕蜀尊显，刻《文选》《初学记》成
  description: 后显于蜀为宰相，曰今可以酬宿愿矣，命工日夜雕板，印成二书，复雕九经诸史，两蜀文字由此大兴。
- id: guji-毋昭裔-event-influence
  date: 0932
  year_of: 932
  type: endeavor
  title_zh: 后唐命李锷（鹗）书五经仿蜀刻，刊板国子监
  description: 后唐平蜀后，明宗命太学博士李锷（按当作李鹗）书《五经》，仿毋氏蜀刻制作，刊板于国子监，为监中印书之始。
- id: guji-毋昭裔-event-return
  date: 0965
  year_of: 965
  type: endeavor
  title_zh: 蜀归宋，艺祖命以书板还毋氏
  description: 蜀归宋后，艺祖命使尽取蜀文籍印本，见卷尾毋氏姓名，欧阳炯言此毋氏家钱自造，艺祖悦，即命以板还毋氏，其书遍于海内，家累千金，子孙禄食。
- id: guji-毋昭裔-event-death
  date: 0965
  year_of: 965
  type: death
  title_zh: 毋昭裔卒（卒年不详，约蜀归宋后）
  description: 卒年史无明文，子孙犹食其禄，藏书板传于世。
