  era: 北魏
  reign_ref: 北魏世祖太武帝至孝明帝之世
  archetype: 字学家
  dilemmas:
  - 欲正文字而世多俗学鄙习，穿凿虚造，难以厘改
  - 依祖训编撰古来文字，然私家之力穷于书不全、学不博
  lesson: 文字为经艺之本、王政之始，须遵修旧文而不穿凿
  summary_first_person: 我出身陈留江氏，六世祖江琼从卫觊受古篆之法，家风世传斯业。逢皇魏承绪而文字舛讹，我秉持六世之资，以许慎《说文》为本，采诸家字书以类编联，上篆下隶，撰《古今文字》四十篇，上表请敕给书史学士相助，蒙诏许可，兼教八分书，冀使天下文字归于同域。
  source_urls:
  - guji-source
