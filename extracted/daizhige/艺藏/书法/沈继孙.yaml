  - 师戒不扬其姓名，恐乡里同业者知之或怨，与著书传法之志相冲突
  - 墨谱诸家文具无凭，须以身历手试之实录纠其妄撰
  lesson: 身所历、手所试，方为可信可从之实录；古法具存，切于实用者胜于徒为戏玩。
  summary_first_person: 我姑苏人沈继孙，先受教于三衢墨师，又得一僧墨诀，遂录成一卷《墨法集要》，凡图二十有一，各有说，自浸油至试墨，叙次详核，为近代造墨家所祖。
