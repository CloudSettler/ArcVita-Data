  archetype: 书圣传人·一笔书开创者
  dilemmas:
  - 身为右军之子，书法成就常被置于其父王羲之盛名之下比较
  - 唐太宗贬抑其书，时人募书伪托以避讳
  lesson: 天真超逸，不为父名所囿，方成一家之笔。
  summary_first_person: 我王献之，字子敬，晋太宰中书令也。世称我书法火筯画灰、连属无端末，谓之一笔书，米元章目为子敬天下第一。《秋深》《十二月》《送梨》诸帖流传后世；虽唐太宗力学右军而大骂于我，然天真超逸，岂父可比。
  source_urls:
  - https://www.example.com/shushi-mifu
