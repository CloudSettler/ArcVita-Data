  dilemmas:
  - 稿未竟即有旨趣上进，而修《经世大典》事严，未能录上，进书为期四年
  lesson: 师古择精、研究宗原，方能以书学进御而获圣赏
  summary_first_person: 我先出曲鲜，后居豫章，清修笃学，工翰墨且通六国书。我备宿卫、入夏官属，撰《法书考》八卷，稿未竟已闻于文宗，至顺四年四月进上，帝览终卷，亲问《八法旨要》，命藏禁中。
  source_urls:
