events:
- id: guji-盛熙明-event-birth
  event_type: birth
  date: ''
  year_of: ''
  description_zh: 盛熙明生年不可考，其先曲鲜人，后居豫章，色目人。
- id: guji-盛熙明-event-1
  event_type: endeavor_milestone
  date: ''
  year_of: ''
  description_zh: 清修谨饬，笃学多材，通六国书，得备宿卫，为名公卿所知。
- id: guji-盛熙明-event-2
  event_type: endeavor_milestone
  date: 1331
  year_of: 1331
  description_zh: 至顺二年，作《法书考》，稿未竟，已有言之文宗之前者，有旨趣上进。
- id: guji-盛熙明-event-3
  event_type: endeavor_milestone
  date: 1333-04-05
  year_of: 1333
  description_zh: 四年四月五日，今上在延春阁，因奎章承制学士沙剌班进《法书考》八卷；帝览之终卷，亲问《八法旨要》，命藏之禁中，以备亲览。
- id: guji-盛熙明-event-4
  event_type: endeavor_milestone
  date: 1335-10-15
  year_of: 1335
  description_zh: 元统二年十月望，揭傒斯作序著进书始末；给事中亦思剌瓦性吉时中出资鋟梓刊行。熙明以书入官，为夏官属。
- id: guji-盛熙明-event-death
  event_type: death
  date: ''
  year_of: ''
  description_zh: 卒年不可考，始末无传。
