      is_circa: false
  birth_date: '1051'
  death_date: '1107'
  era: 北宋
  reign_ref: 元祐、元符、崇宁年间
  archetype: 鉴藏家、书家
  dilemmas:
  - 名迹借出久不归还，如沈存中借禇书兰亭未还
  - 宗室仲爰擅取桓公破羌帖，装裱剪损古跋，痛惜
  - 公权误连右军帖为子敬，鉴真与误判间反复辨析
  lesson: 能书者未必能鉴：鉴别须以目历、印跋、纸墨为据，不欺于俗目。
  summary_first_person: 余平生目历法书名画，区别无疑，集曰《书史》以指南识者；中年典衣易帖、掷枣轴以护古物，虽屡遭失帖之痛，犹以鉴定真伪为终身之业。
  source_urls:
  - https://zh.wikisource.org/wiki/書史
