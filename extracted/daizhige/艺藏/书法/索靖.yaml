  summary_first_person: 我索靖以章草名世，越制特立、风神凛然，与卫瓘并号“一台二妙”，世谓我得伯英之肉，而时议以为我放手流便处犹胜瓘之法则，我的《草书状》更以“宛若银钩，飘若惊鸾”为草书法度立言。
