  decisions:
  - date: 1752
    title: 书法由颜入欧兼融诸碑
    rationale: 初学颜平原，继学欧阳率更，隶法史晨韩勑诸碑，化度一碑尤得力
  - date: 1779
    title: 借摹方正学草稿访客持卷
    rationale: 三年前借卷重摹一过，规摹古人遗迹无不肖似，见其摹古精审
  - date: 1818-01-01
    title: 元旦胡麻书字至第七粒而止
    rationale: 目倦不能成字，自叹吾其衰矣，知力尽而不能已
- id: guji-翁方纲-endeavor-2
  name_zh: 金石钩摹与鉴藏
  phases:
  - key: brewing
    name_zh: 双钩摹帖
