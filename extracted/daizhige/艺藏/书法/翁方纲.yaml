person:
  qid: guji-翁方纲
  name_zh: 翁方纲
  names:
    zh: 翁方纲
    en: Weng Fanggang
  lifespan:
    birth:
      date: 1733
      precision: year
      is_circa: true
      raw: 生年未载，据卒年八十六推算
    death:
      date: 1818
      precision: year
      is_circa: false
      raw: 卒年八十六（戊寅正月二十七日归道山）
  birth_date: 1733
  death_date: 1818
  era: 清
  reign_ref: 乾隆
  archetype: 书法家·学者型官僚
  dilemmas:
  - 官至内阁学士，左迁鸿胪寺卿，仕途有降黜而艺业愈精
  - 目力衰退而犹以蝇头小楷自课，衰与坚持的张力
  lesson: 取法诸家、日课不辍，精细摹古可成绝艺，虽短视而贞恒自砺
  summary_first_person: 我是翁方纲，号覃溪、苏斋，大兴人，乾隆十七年进士。我书法初学颜平原，继学欧阳率更，隶法则取汉碑，尤精蝇头小楷与响榻钩摹之技，至老犹日课不辍，每岁元旦于胡麻上书字以试目力。
  source_urls:
  - 湖海诗传
  - 畿辅诗传
  - 存素堂文集
  - 归田琐记
  - 郎潜纪闻
  - 木叶厱法书记
