  decisions:
  - date: 1760
    title: 双钩摹勒旧帖数十本
    rationale: 是以北方求书碑版者毕归之
  - date: 1800
    title: 响榻独擅，摹落水兰亭长卷
    rationale: 古今题识印记悉行钩摹，纸墨之色曲肖，自题数万言
events:
- id: guji-翁方纲-event-birth
  type: birth
  date: 1733
  year_of: 1733
  title: 翁方纲生（据卒年八十六推算）
  place: 大兴
- id: guji-翁方纲-event-jinshi
  type: 科举
  date: 1752
  year_of: 1752
  title: 乾隆十七年进士及第
  detail: 后官内阁学士，左迁鸿胪寺卿，重宴琼林加二品衔
  source: 湖海诗传
- id: guji-翁方纲-event-shufa
  type: 事业
  date: 1790
  year_of: 1790
  title: 北方求书碑版者毕归之
  detail: 书法虞永兴、欧阳率更，化度一碑尤得力；行书得兰亭神韵，晚年以苏米之法行之
  source: 畿辅诗传
- id: guji-翁方纲-event-mole
  type: 事业
  date: 1779
  year_of: 1779
  title: 重摹方正学草稿墨迹以娱客
  detail: 钩抹涂乙无一不肖，规摹古人遗迹神似皆类此
  source: 存素堂文集
- id: guji-翁方纲-event-yingtou
  type: 事业
  date: 1810
  year_of: 1810
  title: 八十余犹日作蝇头书以自课
  detail: 每岁元旦于胡麻上写天下太平四字以试目力，或一日冰心在玉壶七字
  source: 榆巢杂识、郎潜纪闻
- id: guji-翁方纲-event-death
  type: death
  date: 1818-02-02
  year_of: 1818
  title: 卒，年八十六
  detail: 戊寅元旦书至第七粒目倦不能成字，叹曰吾其衰矣，正月二十七日归道山
  source: 归田琐记
