  decisions:
  - date: 1571
    title: 因郡试书拙而发愤临池
    rationale: 郡守以书拙置第二，遂立志精研书法
  - date: 1585
    title: 观项子京家藏真迹，弃前学
    rationale: 见古人真迹后悟从前妄自标许，愿焚笔砚而重新泛学
  - date: 1620
    title: 以董为主，间入少师之法成家
    rationale: 王双白劝其专业华亭，誓以终老
events:
- id: guji-董其昌-event-birth
  date: 1555-02-10
  year_of: 1555
  type: birth
  title: 董其昌生于华亭
  description: 盖明嘉靖间生于松江华亭
- id: guji-董其昌-event-17
  date: 1571
  year_of: 1571
  type: career
  title: 十七岁发愤临池
  description: 与家仲子同试于郡，郡守以余书拙置第二，自是始临池，师颜平原多宝塔碑
- id: guji-董其昌-event-18
  date: 1574
  year_of: 1574
  type: career
  title: 三年师古，改学晋人
  description: 初师颜平原，改学虞永兴，以为唐不如晋，专仿黄庭经及锺元常宣示表诸帖三年
- id: guji-董其昌-event-19
  date: 1585
  year_of: 1585
  type: career
  title: 游嘉兴观项氏藏真迹
  description: 亲观项子京家藏古人真迹，又见右军官奴帖于金陵，方悟从前妄自标许
- id: guji-董其昌-event-20
  date: 1600
  year_of: 1600
  type: career
  title: 编镌戏鸿堂帖、宝鼎斋帖
  description: 平生学力皆在此二种刻帖，临摹历代大家及自书题跋，精妙绝伦，可掩郁冈斋、踞诸淳化之上
- id: guji-董其昌-event-21
  date: 1612
  year_of: 1612
  type: career
  title: 自评书法古今独步
  description: 华亭论书，自云吾书无他奇，但姿态高秀，为古今独步，历游南北门徒从之，名满四方
- id: guji-董其昌-event-death
  date: 1636
  year_of: 1636
  type: death
  title: 董其昌卒
  description: 明崇祯年间卒，书法传于后世，门人得其嫡传
