  dilemmas:
  - 学古与自成一家之地：临摹须似古，而终须脱化自成一家
  - 取与舍之间：始在能取，继则能舍，难在能舍
  lesson: 工夫分三段——专一、广大、脱化，坚定不懈方能突破壁障，终至悟门大开
  summary_first_person: 吾学书自十七岁发愤临池，先师颜平原，后遍临魏晋唐宋诸家，至悟得势字与三折笔锋，三十年不辍，终以姿态高秀独步古今。
endeavors:
- id: guji-董其昌-endeavor-1
  name_zh: 学书三段历程
  description: 初专师一家而宗主之，次遍临魏晋唐宋元明数十大家，末守定一家出入各家，终悟门大开自成一家
  start_date: 1571
