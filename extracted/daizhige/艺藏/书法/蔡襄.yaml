    start_date: '1060'
    highlight_event_id: guji-蔡襄-event-4
  decisions:
  - date: '1040'
    title_zh: 以师法钟、王与颜、欧为学书路径
    rationale: 学楷书须先大后小，先颜次王，师法古人方能端严温厚、自成一家
  - date: '1053'
    title_zh: 书丹万安桥记并刻石于闽中
    rationale: 桥记大字撒落有法，可为题匾大字之式，垂范后世
- id: guji-蔡襄-endeavor-2
  name_zh: 为一代楷法立式
  phases:
  - key: brewing
    name_zh: 深研魏晋风气
    labels:
      zh: 尚友千载
    start_date: '1030'
    highlight_event_id: guji-蔡襄-event-2
  - key: breakthrough
    name_zh: 与宋骏、石延年等同列大家
    labels:
      zh: 本朝八人
    start_date: '1050'
    highlight_event_id: guji-蔡襄-event-2
  - key: climax
    name_zh: 被宣和书谱录为一代法
    labels:
      zh: 为一代法
    start_date: '1060'
    highlight_event_id: guji-蔡襄-event-4
  - key: closure
    name_zh: 身后法帖传习
    labels:
      zh: 后学楷模
    start_date: '1067'
    highlight_event_id: guji-蔡襄-event-5
  decisions:
  - date: '1050'
    title_zh: 以正书、行书兼善自立一家之法
    rationale: 兼真谓之真行，师二王而不泥，端严不刻、温厚难犯
events:
- id: guji-蔡襄-event-birth
  date: '1012'
  year_of: 1012
  type: birth
  title_zh: 蔡襄生
  description: 北宋兴化军仙游人，字君谟。
- id: guji-蔡襄-event-death
  date: '1067'
  year_of: 1067
  type: death
  title_zh: 蔡襄卒
  description: 治平年间卒，谥忠惠，官至端明殿学士，世称蔡端明。
- id: guji-蔡襄-event-1
  date: '1018'
  year_of: 1018
  type: endeavor
  title_zh: 童蒙习楷，先大后小
  description: 八岁学大字以颜为法，十余岁习中楷以欧为法，及笄渐敛为小楷，宗法钟、王，奠定书法根基。
- id: guji-蔡襄-event-2
  date: '1040'
  year_of: 1040
  type: endeavor
  title_zh: 正书与行书兼善知名
  description: 得魏晋风气，真书与宋骏、石延年之徒皆与古作者并驱争衡，为一代法。
- id: guji-蔡襄-event-3
  date: 1053-04
  year_of: 1053
  type: endeavor
  title_zh: 书《万安桥记》
  description: 在闽中所书万安桥记，闽中有刻，大楷老师宿儒皆以为可看可学。
- id: guji-蔡襄-event-4
  date: '1060'
  year_of: 1060
  type: endeavor
  title_zh: 官端明殿学士，人称蔡端明
  description: 邓志宏论蔡端明之书端严不刻、温厚难犯，以为善书。
- id: guji-蔡襄-event-5
  date: '1067'
  year_of: 1067
  type: endeavor
  title_zh: 身后书迹为学书门径
  description: 后世学楷引其字为范式，与钟、王、欧、颜并称垂范。
