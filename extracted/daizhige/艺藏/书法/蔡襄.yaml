  birth_date: '1012'
  death_date: '1067'
  era: 北宋
  reign_ref: 宋仁宗、宋英宗时期
  archetype: 书法家
  dilemmas:
  - 身居朝列、政事繁剧，仍须坚持书法临池之功而不废
  lesson: 学书当先楷后行草，师法古人、以人品养书，端严温厚方成一inger代之法
  summary_first_person: 我是蔡襄，君谟是我的字，人称蔡端明。在本朝以正书、行书与古作者并驱争衡，为一代之法，所书万安桥记，闽中有刻。
  source_urls:
  - 书法辑要（清）文伯子辑
endeavors:
- id: guji-蔡襄-endeavor-1
  name_zh: 书法实践与临池
  phases:
  - key: brewing
    name_zh: 学楷奠基
    labels:
      zh: 先楷法后行草
    start_date: '1012'
    highlight_event_id: guji-蔡襄-event-1
  - key: breakthrough
    name_zh: 正书成家
    labels:
