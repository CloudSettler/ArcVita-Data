events:
- id: guji-yushinan-event-birth
  date: 558
  year_of: 558
  name_zh: 虞世南出生
  labels:
    zh:
    - 出生
  summary: 虞世南生于南朝，越州余姚人，与兄虞世基同有名望。
- id: guji-yushinan-event-study-ziyong
  date: 570
  year_of: 570
  name_zh: 从智永禅师学习书法
  labels:
    zh:
    - 学书
    - 师承智永
  summary: 师事王羲之七世孙智永，得二王笔法真传，奠定了其书法根基。
- id: guji-yushinan-event-join-tang
  date: 621
  year_of: 621
  name_zh: 入唐为秦王府参军、记室
  labels:
    zh:
    - 仕唐
  summary: 归唐后入李世民秦王府，任参军、记室，从此与太宗结下君臣之谊。
- id: guji-yushinan-event-kongmiao-bei
  date: 628
  year_of: 628
  name_zh: 撰并书《孔子庙堂碑》
  labels:
    zh:
    - 楷书
    - 庙堂碑
  summary: 所书《孔子庙堂碑》圆秀浑成、深得右军三昧，成为唐楷典范之作。
- id: guji-yushinan-event-mishujian
  date: 627
  year_of: 627
  name_zh: 任秘书监，掌国家图书典籍
  labels:
    zh:
    - 秘书监
  summary: 贞观初任秘书监，主持典籍校雠整理，受封永兴县子，世称虞永兴。
- id: guji-yushinan-event-lijian
  date: 632
  year_of: 632
  name_zh: 屡以灾异直言进谏太宗
  labels:
    zh:
    - 直谏
  summary: 太宗遇灾异问计，世南以天道人事直言极谏，言多见纳，太宗称其忠直。
- id: guji-yushinan-event-five-perfections
  date: 637
  year_of: 637
  name_zh: 太宗誉其具五绝之才
  labels:
    zh:
    - 五绝
  summary: 太宗称世南有五绝——德行、忠直、博学、文词、书翰，为当代名臣之最。
- id: guji-yushinan-event-lingyan
  date: 638
  year_of: 638
  name_zh: 去世，图像凌烟阁，陪葬昭陵
  labels:
    zh:
    - 去世
    - 凌烟阁
  summary: 年八十一卒，陪葬昭陵，图形于凌烟阁，为唐初功臣之列。
- id: guji-yushinan-event-death
  date: 638
  year_of: 638
  name_zh: 虞世南去世
  labels:
    zh:
    - 去世
  summary: 贞观十二年卒于长安，赠礼部尚书，谥文懿。
