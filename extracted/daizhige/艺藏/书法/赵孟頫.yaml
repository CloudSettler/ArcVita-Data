events:
- id: guji-赵孟頫-event-birth
  event_type: birth
  date: '1254'
  year_of: 1254
  description_zh: 赵孟頫生于湖州，宋太祖赵匡胤十一世孙，秦王赵德芳之后
- id: guji-赵孟頫-event-death
  event_type: death
  date: '1322-06-16'
  year_of: 1322
  description_zh: 卒于吴兴家中，追封魏国公，谥文敏
- id: guji-赵孟頫-event-career-1
  event_type: career
  date: '1262'
  year_of: 1262
  description_zh: 幼年即习书，日课数千字，遍临古帖
- id: guji-赵孟頫-event-career-2
  event_type: career
  date: '1287'
  year_of: 1287
  description_zh: 经程钜夫举荐出仕元朝，任兵部郎中；其书法主张上承晋唐，书法五体兼擅，创「赵体」
- id: guji-赵孟頫-event-career-3
  event_type: career
  date: '1295'
  year_of: 1295
  description_zh: 作《鹊华秋色图》等，倡「作画贵有古意」，以书画同源之说奠定文人画典范
- id: guji-赵孟頫-event-career-4
  event_type: career
  date: '1310'
  year_of: 1310
  description_zh: 奉诏撰《松雪斋集》，官至翰林学士承旨、荣禄大夫，荣际五朝，名满四海
