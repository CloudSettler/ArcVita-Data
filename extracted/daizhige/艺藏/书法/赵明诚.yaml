  archetype: 金石学家
  dilemmas:
  - 隶书与楷书、八分名实混淆，历代书体分类纷争难定
  - 欧阳修《集古录》误以八分为隶，需以金石实证纠其谬
  lesson: 辨章学术、考镜源流，须以碑刻实物为据，不可因循旧说
  summary_first_person: 我赵明诚平生笃好金石，遍收三代以来钟鼎彝器、汉唐石刻，编为《金石录》。我尝论隶、楷、八分同源异名之变：东魏大觉寺碑韩毅自题为隶书，实即今楷书，可证唐以前隶楷合一；又讥欧阳公误以八分为隶，谓当以碑刻时代正其名。
