person:
  qid: guji-赵构
  name_zh: 赵构
  names:
    zh: 赵构
    en: Zhao Gou
  lifespan:
    birth:
      date: '1107-06-12'
      precision: day
      is_circa: false
      raw: 宋大观元年五月
    death:
      date: '1187-11-09'
      precision: day
      is_circa: false
      raw: 宋淳熙十四年
  birth_date: '1107-06-12'
  death_date: '1187-11-09'
  era: 南宋
  reign_ref: 建炎、绍兴（宋高宗年号）
  archetype: 帝王书法家
  dilemmas:
  - 国势危殆、卧薪尝胆之际，仍耽心笔札、留情翰墨，被论为舍本营末
  - 访求法书名画不遗馀力，而渡江之后钟王真迹散失，收藏与国运难以两全
  lesson: 学书当以锺、王为法，然後出入变化自成一家；凡五十年非大利害相妨未尝一日舍笔墨，功在不辍。
  summary_first_person: 我自束发即喜揽笔作字，初学黄庭坚，继采米芾，终专意羲献父子。渡江立国之后，虽国事维艰，五十年间未尝一日舍笔墨，晚年得趣，横斜平直随意所适，因著《翰墨志》以论书自识。
  source_urls:
  - https://zh.wikipedia.org/wiki/宋高宗
endeavors:
- id: guji-赵构-endeavor-1
  name_zh: 书法研习与师法转变
  phases:
  - key: brewing
    name_zh: 初习各家
    labels:
      zh:
      - 初喜黄庭坚体格
    start_date: '1120'
  - key: breakthrough
    name_zh: 兼采米芾
    labels:
      zh:
      - 后采米芾
    start_date: '1130'
  - key: climax
    name_zh: 专意羲献
    labels:
      zh:
      - 置黄米不用，手追心摹锺王
    start_date: '1140'
    highlight_event_id: guji-赵构-event-2
  - key: closure
    name_zh: 晚年得趣
    labels:
      zh:
      - 肆笔皆成，作尺馀大字
    start_date: '1162'
    highlight_event_id: guji-赵构-event-3
  decisions:
  - date: '1140'
    title_zh: 专师锺王羲献
    rationale: 学书当以锺王为法，然後出入变化自成一家，故置苏黄米诸体不用。
  - date: '1162'
    title_zh: 内禅退位后专注翰墨
    rationale: 清暇之燕，展玩摹搨不少怠，于精笔佳纸遣数十言以自识。
- id: guji-赵构-endeavor-2
  name_zh: 撰著《思陵翰墨志》与访求法书
  phases:
  - key: brewing
    name_zh: 渡江访求
    labels:
      zh:
      - 重赏得一二钟王摹本
    start_date: '1129'
  - key: breakthrough
    name_zh: 评骘历代书家
    labels:
      zh:
      - 评北宋诸家与吴说徐兢
    start_date: '1150'
  - key: climax
    name_zh: 晚年成书自识
    labels:
      zh:
      - 自谓五十年未尝舍笔墨
    start_date: '1180'
    highlight_event_id: guji-赵构-event-3
  - key: closure
    name_zh: 书传后世
    labels:
      zh:
      - 《宋史·艺文志》载高宗评书一卷
    start_date: '1187'
  decisions:
  - date: '1180'
    title_zh: 撰《翰墨志》一卷
    rationale: 欲鼓动士类为一代操觚之盛，因试笔书以自识，笔其梗概。
events:
- id: guji-赵构-event-birth
  date: '1107-06-12'
  year_of: 1107
  title_zh: 赵构生于宋大观元年
  description: 宋徽宗第九子，后为南宋开国皇帝。
- id: guji-赵构-event-1
  date: '1129'
  year_of: 1129
  title_zh: 渡江后访求法书名画
  description: 自渡江后无复锺王真迹，间有一二以重赏得之，褾轴字法显然可验。
- id: guji-赵构-event-2
  date: '1140'
  year_of: 1140
  title_zh: 专意羲献父子
  description: 初喜黄庭坚体格，后采米芾，已而皆置不用，专意王羲之、王献之父子，手追心摹。
- id: guji-赵构-event-3
  date: '1180'
  year_of: 1180
  title_zh: 撰成《思陵翰墨志》
  description: 自谓五十年未尝舍笔墨，晚年得趣，作尺馀大字肆笔皆成；论书独宗羲献，评端研一段紫玉之辨为鉴家指南。
- id: guji-赵构-event-4
  date: '1187-11-09'
  year_of: 1187
  title_zh: 赵构卒于淳熙十四年
  description: 宋高宗崩，《翰墨志》一卷传世，岳珂《法书赞引》题作《思陵翰墨志》。
