  date: 1777
  year_of: 1777
  type: endeavor
  title_zh: 客金陵梅镠家八年，遍临石鼓碑刻
  description: 得梅镠之助尽览金石铭刻，日摹石鼓、李斯篆及汉隶碑版，篆隶大进。
  participants:
  - guji-dengshiru
  related_endeavor_id: guji-dengshiru-endeavor-1
