  dilemmas:
  - 布衣终身不入仕途，以艺立身于科举功名为尚的时代
  - 碑学与帖学之争中，以篆隶北碑之笔另立门户
  lesson: 能将南北合一手——融汇篆隶草分诸体之脉，方成一家之奇
  summary_first_person: 我邓石如，字顽伯，号完白山人。世称我“篆隶草分入神妙，后有作者其余支”，能将南北书风合一手，以布衣之身开碑学之先声。
