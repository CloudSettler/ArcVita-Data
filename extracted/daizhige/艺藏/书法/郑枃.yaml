person:
  qid: guji-郑枃
  name_zh: 郑枃
  names:
    zh: 郑枃
    en: Zheng Jin
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生卒年不详，约活动于元代泰定年间
    death:
      precision: unknown
      is_circa: true
      raw: 生卒年不详
  era: 元
  reign_ref: 泰定
  archetype: 书法理论家
  dilemmas:
  - 慨古道浸邈、俗尚乖离，孤居无可与语，唯著书以鸣其所不能自已者
  - 士负材抱艺欲有为，而修名未立、老将至，出处两难
  lesson: 究心一艺至深，方能析其源流、成一家之言；其《衍极》论书自仓颉迄元代，识见卓绝，为后世取法之资。
  summary_first_person: 我郑枃，字子经，罗源人，泰定中任南安县教谕。我痛感书道衰微、古道浸邈，遂潜心书艺，著《衍极》五篇与《衍极记载》三篇，自仓颉迄元代，论古人篆籀以极书法之变。宣抚使齐伯亨采我书上之，作衍极堂以藏之。我兼工八分、能大字，得李齐序而其书始显于世。
  source_urls:
  - https://ctext.org/wiki.plx?if=gb&chapter=&res=
  note: 字子经，罗源人，与陈旅为文字友；书注为刘有定（字能静，号原范，莆田人）所作。
