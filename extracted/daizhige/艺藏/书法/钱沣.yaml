  dilemmas:
  - 身居言职直言敢谏与仕途险恶之间的取舍
  - 书宗颜鲁公，于柔媚时风中坚守苍劲正大
  lesson: 学书如立身，专效鲁公，遒劲端严，人得其一纸珍如拱璧。
  summary_first_person: 我钱沣，字东注，一字约甫，号南园，云南昆明人。乾隆三十六年成进士，官通政司副使。楷法出于《灵飞经》《十三行》，行书专效鲁公《争座位帖》，后肆力于《家庙碑》《露筋祠碑》，遒丽苍劲，时论谓直入鲁公之室。
  source_urls:
  - https://www.zh.wikisource.org/wiki/国朝书品
