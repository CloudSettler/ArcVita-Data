  - 御给笔墨不任用，奏言需张芝笔、左伯纸、臣墨方逞径丈之势
  lesson: 工欲善其事，必先利其器
  summary_first_person: 我是韦诞，字仲将，京兆人。我师法张芝并兼采邯郸淳之法，诸体皆善，尤精题署。明帝凌云台成，我被悬笼引至离地二十五丈处题榜，因危惧而戒子孙勿传此楷法。青龙年间洛阳、许、邺三都宫观题署皆出我手，以为永制。
  source_urls:
  - https://zh.wikipedia.org/wiki/韦诞
