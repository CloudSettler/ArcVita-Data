events:
- id: guji-项元汴-event-birth
  date: '1525'
  year_of: 1525
  title_zh: 项元汴生（约）
  description: 项元汴生于浙江嘉兴，为明代著名收藏家。
  type: birth
- id: guji-项元汴-event-1
  date: '1545'
  year_of: 1545
  title_zh: 筑天籁阁蓄藏书画
  description: 项元汴营造天籁阁，开始大规模收藏法书名画，所用金粟笺、藏印渐成体系。
  type: endeavor
- id: guji-项元汴-event-2
  date: '1571'
  year_of: 1571
  title_zh: 收藏赵孟頫书心经
  description: 赵孟頫至大元年所书心经册经项元汴收藏，钤神品、天籁阁、项墨林鉴赏章诸印，并于册后钤墨林子、子京父印、项元汴印等。
  type: endeavor
- id: guji-项元汴-event-3
  date: 1573-08
  year_of: 1573
  title_zh: 万历元年题记熏沐奉持心经
  description: 万历元年仲秋望前九日，项元汴于赵孟頫书心经册后题记，“大乘弟子墨林项元汴熏沐奉持”，钤净因庵主、退密、子京所藏诸印。
  type: endeavor
- id: guji-项元汴-event-death
  date: '1590'
  year_of: 1590
  title_zh: 项元汴卒（约）
  description: 项元汴约于万历十八年去世，天籁阁藏品后渐散出。
  type: death
