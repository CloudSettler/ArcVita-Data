  lesson: 精鉴笃藏，可使名迹传世久远
  summary_first_person: 我是明季嘉兴鉴藏家项元汴，号墨林子、子京，筑天籁阁蓄法书名画与释道经卷，凡经我鉴赏之迹必钤项墨林鉴赏章、项子京家珍藏诸印，并常于卷后题记熏沐奉持。
  source_urls:
