person:
  qid: guji-项穆
  name_zh: 项穆
  names:
    zh: 项穆
    en: Xiang Mu
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      precision: unknown
      is_circa: true
  era: 明代
  archetype: 学者书法理论家
  dilemmas:
  - 曾名德枝，郡官徐公为其改名纯，后又更名穆
  - 沈思孝规劝其不应以一艺自掩，他答以取舍：为墨卿优孟与艺争，胜于与命运争的仕途
  lesson: 取法乎上，宗法晋人王羲之，尤推崇以中和为书法之的
  summary_first_person: 我是项穆，秀水项元汴之子，初名德枝，后改名穆，字德纯，号贞元。我承家学耳濡目染，于书法特工，日摹《兰亭》《圣教》一纸，作《书法雅言》十七篇，以晋人为宗，痛斥苏轼、米芾之棱角怒张。
endeavors:
- id: guji-项穆-endeavor-1
  name_zh: 书学研究与《书法雅言》撰写
