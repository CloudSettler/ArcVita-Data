  decisions:
  - title_zh: 放弃仕途进取，以书法为毕生之业
    rationale: 自言与其如素王优孟与命争不可知，不如为墨卿优孟与艺争可必得，且以右军以书传世为证
  - title_zh: 定书法以晋人为宗，著论放斥苏米
    rationale: 认为正书法所以正人心，人心不正所动悉邪；又评米芾自画阻后学学古
