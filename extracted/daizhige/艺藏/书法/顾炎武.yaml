events:
- id: guji-guyanwu-event-birth
  date: '1613'
  year_of: 1613
  title_zh: 顾炎武出生
  category: 出生
  person_qid: guji-guyanwu
  detail: 生于明万历四十一年，苏州昆山人。
- id: guji-guyanwu-event-mingwang
  date: '1645'
  year_of: 1645
  title_zh: 明亡后立志经世之学
  category: 转折
  person_qid: guji-guyanwu
  detail: 清兵南下，明室倾覆，遂弃举业，致力于经世致用之学。
- id: guji-guyanwu-event-travel
  date: '1650'
  year_of: 1650
  title_zh: 北游考察天下郡国
  category: 事业
  person_qid: guji-guyanwu
  detail: 弃家北游，遍考察山川、边塞、水利，修《天下郡国利病书》。
- id: guji-guyanwu-event-rizhilu
  date: '1670'
  year_of: 1670
  title_zh: 完成《日知录》初刻
  category: 事业
  person_qid: guji-guyanwu
  detail: 积三十年之功，刊刻《日知录》，学分八股，日积月累成书。
- id: guji-guyanwu-event-jinshi
  date: '1670'
  year_of: 1670
  title_zh: 撰《金石文字记》
  category: 事业
  person_qid: guji-guyanwu
  detail: 考订历代金石文字，论汉唐分隶同异，以实证方法辨文字源流。
- id: guji-guyanwu-event-likai
  date: '1675'
  year_of: 1675
  title_zh: 考辨隶楷八分之名实
  category: 事业
  person_qid: guji-guyanwu
  detail: 在《金石文字记》中论及楷法、八分、隶书源流，主张汉碑称隶、唐碑称八分，批评并汉碑皆名为八分之说。
- id: guji-guyanwu-event-death
  date: '1682'
  year_of: 1682
  title_zh: 顾炎武去世
  category: 逝世
  person_qid: guji-guyanwu
  detail: 清康熙二十一年卒于山西曲沃。
