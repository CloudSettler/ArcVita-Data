  era: 元
  reign_ref: 元初（世祖至元、成宗大德年间）
  archetype: 书法家
  dilemmas:
  - 身居郎中卑微官职而书艺超群，世人以官位轻人的时代如何以胆气立艺名
  - 行草须悬腕而悬腕最险，弃稳求险之抉择
  lesson: 悬腕之ooks难在胆，艺成于胆气与苦功，末在巧媚
  summary_first_person: 我鲜于枢以善悬腕书名于世，人问悬腕之法，我瞑目伸臂连呼\"胆胆胆\"，盖悬腕笔势无限，胆大则笔壮。我官至郎中之卑，而草书与赵孟頫并称，传于后世。
