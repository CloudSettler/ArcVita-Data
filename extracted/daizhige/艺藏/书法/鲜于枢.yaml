  name_zh: 鲜于枢出生（约）
  description: 约生于1246年，字伯机，渔阳（今北京蓟州一带）人，后居杭州。
- id: guji-鲜于枢-event-work1
  type: achievement
  date: '1280'
  year_of: 1280
  name_zh: 以悬腕书著称于世
  description: 元初书坛，鲜于枢善悬腕作行草，悬腕则笔势无限。陈绎曾《翰林要诀》记：\"今代惟鲜于郎中善悬腕书，问之，辄瞑目伸臂曰：胆胆胆！\"。
- id: guji-鲜于枢-event-work2
  type: achievement
  date: '1290'
  year_of: 1290
  name_zh: 官至郎中，书名并称
  description: 时称\"鲜于郎中\"，其草书与赵孟頫并重，为元代书坛巨擘。
- id: guji-鲜于枢-event-death
  type: death
  date: '1302'
  year_of: 1302
  name_zh: 鲜于枢去世（约）
  description: 约卒于1302年，年五十七左右。
