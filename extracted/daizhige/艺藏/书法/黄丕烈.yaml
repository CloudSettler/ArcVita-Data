  dilemmas:
  - 仕途与藏书校书之业难以兼顾，遂弃科举进取而专意典籍
  - 佞宋秘宋之癖，倾家资购宋元旧刻，取舍之间耗尽心力
  lesson: 藏书题跋以存版本源流，刻丛书以广流传，方为善藏书者
  summary_first_person: 我平生笃好宋元旧椠，蓄书于士礼居，号佞宋主人，撰《士礼居藏书题跋记》《百宋一廛书录》，又刻《士礼居丛书》，以刻《季沧苇书目》诸书传世，愿古书终古不废。
  source_urls:
  - https://zh.wikipedia.org/wiki/黄丕烈
