  archetype: 书法家
  dilemmas:
  - 我法与古法如何相融，自成一家而不失本源
  lesson: 心能转腕，手能转笔，书字便如人意
  summary_first_person: 我是北宋黄庭坚，世人论书常以我为宋四家之一。米南宫曾言“黄庭坚描字”，而山谷我自谓小字莫作痴冻蝇，大字无过瘗鹤铭，隋人作计终后人，自成一家始逼真。我评定武兰亭，喜其本，主张临古须透一步、翻一局，智过其师方名得髓，学柳下惠莫若鲁男子，于此可悟舍法。
