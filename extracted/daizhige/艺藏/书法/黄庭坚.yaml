- id: guji-黄庭坚-event-1
  date: '1075'
  year_of: 1075
  title: 探索笔势之法
  description: 山谷论书主张得势，笔势开张，中宫紧结，长撇大捺自成体势。
- id: guji-黄庭坚-event-2
  date: '1080'
  year_of: 1080
  title: 评骘古人碑帖
  description: 山谷喜定武兰亭本，士大夫自此争宝之；又谓洛神赋非王子敬书，以字格笔力辨伪。
- id: guji-黄庭坚-event-3
  date: '1090'
  year_of: 1090
  title: 自成一家
  description: 主张临古须透一步翻一局，学书各自立一家乃可与古人相抗，遂开新风。
- id: guji-黄庭坚-event-4
  date: '1082'
  year_of: 1082
  title: 论书语传世
  description: “小字莫作痴冻蝇，乐毅论胜遗教经；大字无过瘗鹤铭”等论书诗行之后世。
