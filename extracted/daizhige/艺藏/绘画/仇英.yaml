  birth_date: 约1494
  death_date: 约1552
  era: 明代中期
  reign_ref: 明弘治、正德、嘉靖年间
  archetype: 由漆工弟子出身而跻身明四大家的职业画家
  dilemmas:
  - 出身卑微（初为漆工执事丹青），须突破身份与门第壁垒
  - 职业画师地位低，需在文人画主导的画坛中以精工技艺立足
  lesson: 以摹古夺真之工与不倦钻研，可将手工技艺锤炼为不朽艺术
  summary_first_person: 我字实父，号十洲，太仓人，后寓居吴中。起初只是执事丹青的漆工，周东村（周臣）见我异常，收而教之。我摹唐宋人名迹皆能夺真，尤工人物，发翠毫金、丝丹缕素，精丽艳逸，自谓无惭古人，遂与沈周、文徵明、唐寅并称明四家。
  source_urls:
  - https://zh.wikisource.org/wiki/明画录
