  archetype: 文人画家
  dilemmas:
  - 矜重不轻作画，求者经年不报，常以花竹小品应急
  - 不奔竞要津以谋升迁，仕途迟缓而甘之
  lesson: 学优品粹，不趋附权贵，功名迟速自有其时
  summary_first_person: 我是余集，字蓉裳，号秋室，钱塘人。乾隆丙戌科进士，以荐征入史馆授编修。读书之余留心绘事，逸笔写生，尤工士女，都下有"余美人"之称。画成题诗，书法古秀，人称三绝。我为人平和，敝车羸马，与故人立谈移晷，不役役于要津求迁爵秩。供职几二十年，由谕德赞善荐擢侍读。
  source_urls:
  - 《读画闲评》（清）俞蛟·余秋室传
