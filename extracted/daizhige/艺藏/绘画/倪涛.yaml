  dilemmas:
  - 贫不能得人缮写，无力雇人抄录，只能率家妇女亲手助成
  - 年近百岁犹著书不辍，编纂与养生精力的矛盾
  lesson: 笃志嗜学、手自抄录，不以贫病辍业，积数十年而成巨帙。
  summary_first_person: 我是钱塘倪涛，平生笃志嗜学，撰有《周易蛾术》《六艺之一录》四百六卷并续编十四卷，穷探金石书画之学，贫而手自抄录，家妇女助成之。
