  archetype: 隐逸书画家
  dilemmas:
  - 富家出身而弃产隐逸，以笔墨寄其孤高之志
  lesson: 非人玩物物玩人，清雅之士以书画寄怀，得失皆有可叹
  summary_first_person: 我倪瓒字元镇，人称云林先生。至正五年春，素先生来访林下，我赋诗并写惠山图以记同游之乐；壬子年九月，又为潘翁仲辉写松亭山色图并赋七言题于其上。世传吾戏墨在江东人家，以有无为清俗，然物往人移，图卷流离，唯有青松自迟暮。
  source_urls:
  - https://example.org/guji/source
