  - 出世为僧与以书画立身的张力
  - 狂态处世与知己倾艺的两面
  lesson: 国破之后以笔墨寄恨，款题联缀似哭似笑，藏身于书画而不失其志。
  summary_first_person: 我是明宗室后裔，甲申后隐于南昌，号八大山人，或谓我曾为高僧持八大人觉经。我擅山水花鸟竹木，笔情纵恣不泥成法，苍劲圆睟时有逸气；款题八大二字联缀，山人二字亦然，类哭之笑之，字意盖有在也。
  source_urls:
  - https://example.org/guji/guochaoHuazhenglu
