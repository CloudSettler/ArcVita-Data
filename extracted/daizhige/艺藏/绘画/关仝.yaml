      raw: 不知何许人，生年不详
    death:
      precision: unknown
      is_circa: false
  era: 五代
  reign_ref: 五代梁唐间
  archetype: 山水画家
  dilemmas:
  - 师承荆浩而力求超越，废寝忘食地刻意力学
  - 山中人物非己所长，须假手胡氏（胡翼）添画
  lesson: 刻意力学、废寝忘食，方能青出于蓝，自成一家而名动四方。
  summary_first_person: 我不知何许人也，初师荆浩学山水，刻意力学，寝食都废，意欲逾浩。后来俗谚称"关家山水"，四方之人辐凑争求我的笔迹。我的画上突巍峰、下瞰穷谷，一笔而成，竦擢之状如涌出，峰岩苍翠、林麓土石、桥彴村堡皆备，当时推尚之。只是画中山中人物，须求安定胡氏（或曰胡翼）添画。
