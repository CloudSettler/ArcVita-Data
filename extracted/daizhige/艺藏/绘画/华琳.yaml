  title_zh: 少时多病，卧游古人山水图画
  summary: 读书不能卒业，病中无以自遣，每悬古人山水图画卧游之，久而酷嗜。
- id: guji-华琳-event-2
  date: ''
  year_of: ''
  type: milestone
  title_zh: 学画十年，下笔无一是处
  summary: 病愈后立志学画，学十年而无成，遂博取古人论画之书一一披览，详形体而略笔墨，心怀疑焉。
- id: guji-华琳-event-3
  date: ''
  year_of: ''
  type: milestone
  title_zh: 夜梦二叟点悟，书画互相参玩十余年
  summary: 朝夕研读古人真迹，寝食俱废；忽夜梦二叟，一曰书画通禅，一曰书法至唐末而绝；遂以书法参画理，渐悟笔法墨法，遇有心得随即录出，共成三十六则。
- id: guji-华琳-event-4
  date: ''
  year_of: ''
  type: publication
  title_zh: 就正刘晓山，缮写成《南宗抉秘》
  summary: 以三十六则就正于刘晓山先生，先生见之大快，怂恿缮写成帙，留以公诸同好，并为之名曰《南宗抉秘》。
