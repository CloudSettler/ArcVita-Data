  - date: ''
    title_zh: 疑画家自秘笔法，取古人真迹朝夕研读
    rationale: 古人论画详于形体而略于笔墨，心怏怏不快而怀疑，乃自摩手揣不肯自甘
- id: guji-华琳-endeavor-3
  key: climax
  name_zh: 书画参玩，录成三十六则
  labels:
    zh:
    - 书画参玩
    - 渐有所悟
  start_date: ''
  highlight_event_id: guji-华琳-event-3
  decisions:
  - date: ''
    title_zh: 择赵宋以前古帖悉心展阅，以书法运画墨
    rationale: 古帖人虽异代、体亦不一，而笔画如出一手，以如此用笔运作画之墨，何患墨里无笔
- id: guji-华琳-endeavor-4
  key: closure
  name_zh: 就正晓山，成书《南宗抉秘》
  labels:
