  archetype: 画论家
  dilemmas:
  - 少时多病，读书不成，自认弃材而学画十年无成，是否终为弃材
  - 前人论画详形体而略笔墨，疑画家自秘其法，是否弃而自甘
  lesson: 执笔紧、运腕活，先入纸而后出纸；不存自欺欺人之心，苦心揣摩方能渐悟
  summary_first_person: 我少时多病，卧游古人山水而不觉嗜画。学画十年无成，遂遍览古人论画之书，发现诸家详形体而略笔墨，疑画家自秘其法。夜梦二叟点悟“书画通禅”，遂以书法参画理，又十余年渐有所得，录成三十六则，经刘晓山先生怂恿成书，公诸同好，名曰《南宗抉秘》。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6622
