    title_zh: 体例以纲目分卷，画各三十卷
    rationale: 先纲后目，先总后分，先本文而后题跋，条理秩然，便检阅
  - date: ''
    title_zh: 广采汪砢玉《珊瑚网》、张丑《清河书画舫》诸书
    rationale: 所载不尽属所藏，多从诸书采摭裒辑，故收汇详博
  - date: ''
    title_zh: 全录禇遂良书陆机《文赋》等本文
    rationale: 具载全篇，殊为疣赘
  - date: ''
    title_zh: 于赵孟坚《水仙图卷》下注明其一恐出临摹
    rationale: 珊瑚网载有二本，不能无前后错出之疑，并存以防考
  lesson: 集众采摭可成巨帙，然兼载全篇即为疣赘，而缺载世未睹之迹亦为漏略
