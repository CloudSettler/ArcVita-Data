  reign_ref: 康熙—乾隆间撰《书画彙考》
  archetype: 书画鉴藏家与著录学者
  dilemmas:
  - 载录繁博与考辨精审难以两全，所录书画多自他书采摭，未尽目见，真伪难辨
  - 征引详富足以资鉴藏家检阅，然疏舛之处亦招致讥评
  lesson: 宏博与精审并难度量，集众采摭可成巨帙，但须修正错讹方臻完善
  summary_first_person: 我字令之，隶镶红旗汉军，官至刑部左侍郎、福建巡抚。我精于书画赏鉴，撰《书画彚考》六十卷，上溯魏晋，下迄元明，诗文题跋悉载，条理秩然，征引详富，为赏鉴家所重。
  source_urls:
  - https://www.ctext.org/library.pl?if=gb&res=6651
