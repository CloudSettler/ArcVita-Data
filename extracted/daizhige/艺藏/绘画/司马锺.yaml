person:
  qid: guji-司马锺
  name_zh: 司马锺
  names:
    zh: 司马锺
    en: Sima Zhong
  lifespan:
    birth:
      precision: unknown
      is_circa: true
    death:
      precision: unknown
      is_circa: true
  era: 清（国朝）
  archetype: 画家
  dilemmas:
  - 求画者以其官职功名为诱，欲以笔墨换名器，锺以『朝廷名器非易笔墨之具』峻拒
  - 所绘麻姑像疑为母病之祟，焚之母愈，自此不复摹人物，于艺术取舍与孝道信念间抉择
  lesson: 尺幅虽可易钱，朝廷名器不可易笔墨；洁身自持，艺品与人格相称。
  summary_first_person: 我司马锺，字子英，号秀谷，别号紫金山樵，上元人。我善绘事，片纸可入质库易钱。就官直隶三角淀通判时，有求画者以功名相动，我峻拒之，谓朝廷名器非易笔墨之具。尝画麻姑象悬于母室，母病，卜者谓麻姑为祟，焚之果愈，自是不复摹人物。
endeavors:
- id: guji-司马锺-endeavor-1
  name_zh: 善绘事
  phases:
  - key: breakthrough
    name_zh: 画艺成名
    labels:
      zh:
      - 绘画
      - 写麻姑
    highlight_event_id: guji-司马锺-event-painting-treasured
  decisions:
  - title_zh: 绘麻姑象悬于母室
    rationale: 奉母至孝，所作人物画悬于母室；母病卜谓麻姑为祟，焚画母愈，自此不复摹人物
  - title_zh: 拒绝以画作交易官职功名
    rationale: 朝廷名器非易笔墨之具，保持画家人格独立，不受权势裹挟
events:
- id: guji-司马锺-event-birth
  type: birth
  summary: 司马锺生年不详，上元（今南京）人，别号紫金山樵。
- id: guji-司马锺-event-official
  type: appointment
  summary: 就官直隶三角淀通判。
- id: guji-司马锺-event-painting-treasured
  type: recognition
  summary: 善绘事，画艺精湛，片纸可入质库易钱，见重于世。
- id: guji-司马锺-event-refusal
  type: decision
  summary: 任直隶三角淀通判期间，有求画者以功名动之，锺峻拒曰：朝廷名器非易笔墨之具。
- id: guji-司马锺-event-death
  type: death
  summary: 卒年不详，留名画史，兼以风骨传世。
