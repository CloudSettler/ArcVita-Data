  era: 明代
  reign_ref:
  - 成化
  - 弘治
  archetype: 画风纵逸的职业画师
  dilemmas:
  - 布衣出身游走朱门间，以"小仙"之名负盛誉，而画坛北宗渐趋末流遭雅士訾议
  - 技艺冠绝一时获皇家殊遇，然流辈仿其笔意者流于狂态，身后褒贬不一
  lesson: 纵笔萧洒、直师古人正脉，艺术之准则在格调气格而不在趋附时好
  summary_first_person: 我吴伟，字士英，更字次翁，江夏人。弱冠谒成国诸公，被呼为小仙，遂以为号。我人物师法吴道元，纵笔萧洒，山石皴法亦自宕逸，弘治间供奉仁智殿，授锦衣百户，蒙赐"画状元"图章。
  source_urls:
  - https://zh.wikisource.org/wiki/明画录
