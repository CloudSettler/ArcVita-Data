  dilemmas:
  - 夫君远仕米脂并随军喀什噶尔，独留吴门，两家用度皆赖其绘画之力
  - 以孝行称，才艺与家庭责任并担
  lesson: 闺阁丹青亦可撑一家生计，才艺出于天然亦是孝与担当的体现。
  summary_first_person: 我名吴规臣，字飞卿，又字香轮，金坛人，嫁吴县顾侣松（鹤）为妻。我以孝行著称，绘画师法恽南田，所作风枝露叶雅秀天然；兼通医术。夫君任职米脂、随征喀什噶尔时，我留居吴门，夫家母家皆靠我的丹青供给生活。
  source_urls:
  - 玉台画史别录（清·汤漱玉）
