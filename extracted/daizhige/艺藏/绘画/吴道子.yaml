  dilemmas:
  - 众皆密于盼际，我则离披其点画——在形似与气韵之间独取疏体
  - 不用界笔直尺而弯弧挺刃，于规矩与神会之间守其神、专其一
  lesson: 守其神，专其一；意存笔先，画尽意在
  summary_first_person: 我吴道玄天纵其能，独步当世，师法张僧繇，授笔法于张旭，知书画用笔同法。我画六法俱全，万象必尽，笔才一二，像已应焉，笔不周而意周，时人尊我为画圣。
