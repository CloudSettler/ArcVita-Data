  name_zh: 吴道玄
  names:
    zh: 吴道玄
    en: Wu Daoxuan
  lifespan:
    birth:
      date: 0680
      precision: year
      is_circa: true
      raw: 唐开元前后活跃，生年不详，约当高宗、武后之际
    death:
      date: 0759
      precision: year
      is_circa: true
      raw: 卒年不详，约当肃宗乾元前后
  birth_date: 约680
  death_date: 约759
  era: 唐
  reign_ref: 唐玄宗开元年间
  archetype: 画圣
  dilemmas:
  - 供奉内廷，非有诏不得画，技艺才华受宫廷职分所限
  - 每一挥毫必须酣饮，以气为主而不拘绳墨
  lesson: 技进乎道，以气为主，落笔风生可为天下壮观
  summary_first_person: 我名道玄，字道子，阳翟人。少年孤贫，客游洛阳，学书不成而改工画，未及成年便臻妙境。明皇召我入供奉，更名道玄，于是我名振天下。我师法张僧繇而变态纵横，顾恺之之前绝、僧繇之后绝，我兼而有之。裴旻将军舞剑助我画气，我解衣磅礴，落笔风生；画圆光转臂运墨，一笔而成，观者惊动坊邑。世人谓有唐之盛，文至韩愈、诗至杜甫、书至颜真卿、画至吴道玄，天下能事毕矣。
  source_urls:
  - https://zh.wikipedia.org/wiki/吴道子
