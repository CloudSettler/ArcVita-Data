  type: endeavor
  title_zh: 明皇召入供奉
  date: '0713'
  year_of: 约713
  precision: circa
  description_zh: 初为兖州瑕丘尉，明皇闻其名召入供奉，更名道玄，复以道子为字，名振天下；为内教博士，非有诏不得画。
- id: guji-吴道玄-event-peimin
  person_qid: guji-吴道玄
  type: endeavor
  title_zh: 天宫寺观裴旻舞剑而作画
  date: '0720'
  year_of: 约720
  precision: circa
  description_zh: 开元中裴旻居母丧请画鬼神于天宫寺资母福。道子使旻去缞服军装驰马舞剑，观者数千百人骇栗；道子解衣磅礴，用其气以壮画思，落笔风生，为天下壮观。
- id: guji-吴道玄-event-hell
  person_qid: guji-吴道玄
  type: endeavor
  title_zh: 作地狱变相名闻天下
  date: '0730'
  year_of: 约730
  precision: circa
  description_zh: 世所共传而知者惟地狱变相，观其命意得阴隲阳授之理，或以金胄杂于桎梏，议者谓唐画至吴道玄而天下能事毕。
- id: guji-吴道玄-event-death
  person_qid: guji-吴道玄
  type: death
  title_zh: 吴道玄去世
  date: 0759
  year_of: 约759
  precision: circa
  description_zh: 卒年不详，官止宁王友，御府所藏其画凡九十有三。
