  dilemmas:
  - 雅好鉴藏与寒素无力储备名迹之间的矛盾
  - 古画日渐朽糜而良装裱工难觅的现实困境
  lesson: 保护古书画当法不违古、精而不苛，以装潢延续古人精神所寄
  summary_first_person: 我是周二学，号药坡，好读书稽古，精于书画鉴藏，写《赏延素心录》十则，为世人定装潢保管之法，护惜墨宝，祛俗存雅。
