  - 良工难得，好事者须越格厚聘，以保书画性命
  lesson: 装潢者，书画之司命也；付托得人，古迹方能超劫回生。
  summary_first_person: 我是明末淮海人周嘉胄，喜好鉴赏收藏，究心书画装潢之术数十载，得金针之秘，著《装潢志》一卷，主张古迹重装如病笃延医，非良工不为，愿以所得公诸海内，使名迹赖装潢而存亡有系。
