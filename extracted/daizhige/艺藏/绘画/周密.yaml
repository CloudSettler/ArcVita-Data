person:
  qid: guji-周密
  name_zh: 周密
  names:
    en: Zhou Mi
  era: 宋末元初
  archetype: 鉴藏家·文史学者
  dilemmas:
  - 家国沦丧之后，如何以著录保存故物流传与文化记忆
  lesson: 书画奇玩聚散无常，随见随录，可使“烟云过眼”化为不朽之文献。
  summary_first_person: 我号公谨，目睹宋亡之后故家收藏流散如烟云过眼，遂将平生所见于书画奇玩一一笔录，成《云烟过眼录》，为后世留一分鉴藏之据。
endeavors:
- id: guji-周密-endeavor-1
  name_zh: 撰《云烟过眼录》
  phases:
  - key: brewing
    name_zh: 蓄藏见闻
    labels:
      zh: 志于博古
    highlight_event_id: guji-周密-event-work-1
  - key: breakthrough
    name_zh: 从事著录
    labels:
      zh: 随见随录
    highlight_event_id: guji-周密-event-work-2
  decisions:
  - date: circa-1290
    title_zh: 决意以著录代收藏
    rationale: 鉴于书画奇玩聚散无常、形质必坏，与其冥搜广索置列一室，不如随所见而录，使亿万载后恍若目击。
events:
- id: guji-周密-event-birth
  date: 1232
  year_of: 1232
  event_type: birth
  description: 周密生于宋末，字公谨，号草窗，历仕宋末，入元不仕，以遗民自处。
- id: guji-周密-event-work-1
  date: 1276
  year_of: 1276
  event_type: endeavor_milestone
  description: 宋亡之际，故家名胜收藏流散，周密亲见故家旧藏大批流转于世，深感“烟云过眼”之义。
- id: guji-周密-event-work-2
  date: circa-1290
  year_of: 1290
  event_type: work_published
  description: 撰成《云烟过眼录》四卷，录所见书画奇玩及其流传聚散，明范应宫序称其“随所见而录，因所录而珍”。
- id: guji-周密-event-death
  date: 1298
  year_of: 1298
  event_type: death
  description: 周密卒，留下的著录成为宋元之际鉴藏史的重要文献。
