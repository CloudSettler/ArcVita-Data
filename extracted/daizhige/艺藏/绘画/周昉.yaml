  dilemmas:
  - 画赵纵侍郎写真时，如何超越前画者形似之工，兼得其神气
  - 作章敬寺壁画时，面对都人竞观、贤愚毕至的公评，如何取舍修改
  lesson: 形似不如神似，画者当移其神气、得其情性笑言之姿
  summary_first_person: 我周昉字仲朗，京兆人，出身节制之家，好属文而穷丹青之妙，游卿相之间，为贵公子。我善画佛像、人物、士女，士女之画古今冠绝，又画水月观自在菩萨，时称殊绝当代。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=373229
