events:
- id: guji-周昉-event-birth
  date: ''
  year_of: ''
  title_zh: 出生
  detail: 周昉字仲朗，京兆人，节制之后，好属文，游卿相间，贵公子也；兄皓善骑射，以功为执金吾
- id: guji-周昉-event-1
  date: ''
  year_of: ''
  title_zh: 德宗召画章敬寺神
  detail: 德宗修章敬寺，召周皓言其弟昉善画，欲宣画章敬寺神，经数月果召之
- id: guji-周昉-event-2
  date: ''
  year_of: ''
  title_zh: 落笔之际都人竞观
  detail: 昉乃下手，落笔之际都人竞观，寺抵园门，贤愚毕至，或言其妙或指其瑕，随意改定
- id: guji-周昉-event-3
  date: ''
  year_of: ''
  title_zh: 精妙为当时第一
  detail: 经月有余，是非语绝，无不叹其精妙为当时第一
- id: guji-周昉-event-4
  date: ''
  year_of: ''
  title_zh: 画赵纵侍郎写真定优劣
  detail: 郭令公列韩干与周昉所写二真于坐侧，赵夫人评后画兼移神气，遂定优劣，送锦彩数百段与之
- id: guji-周昉-event-5
  date: ''
  year_of: ''
  title_zh: 画士女为古今冠绝
  detail: 又画士女，为古今冠绝，又画诸图粉本及《仲尼问礼图》《降真图》《五星图》《扑蝶图》等至多
- id: guji-周昉-event-6
  date: ''
  year_of: ''
  title_zh: 任宣州别驾画北方天王
  detail: 昉任宣州别驾，于禅定寺画北方天王，尝于梦中见其形像
- id: guji-周昉-event-7
  date: ''
  year_of: ''
  title_zh: 新罗人以善价收市其画
  detail: 贞元末新罗国人于江淮以善价收市数十卷持往彼国，其画佛像、真仙、人物、士女皆神品
- id: guji-周昉-event-death
  date: ''
  year_of: ''
  title_zh: 卒年不详
  detail: 生卒年史无明载，据贞元末其画已传海外推测卒于贞元之后
