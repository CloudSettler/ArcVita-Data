  archetype: 画家与画论家
  dilemmas:
  - 收录前人画论时沿袭之误（如误题荆浩、误以为郭熙作）难以尽考
  lesson: 作画以气韵为本，读书为先
  summary_first_person: 我唐志契，字敷五，江都诸生，能画山水，以山水擅名，与弟志尹皆工画。我著《绘事微言》二卷，录自南齐谢赫至明代李日华诸家名论，芟除芜冗，择取精华，自著论断亦多中肯綮，故《钦定佩文斋书画谱》多有采录。
