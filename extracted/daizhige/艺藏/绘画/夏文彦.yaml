  dilemmas:
  - 搜罗广博与体例考订难以两全，书中仍沿袭封膜等旧讹且时代先后倒置
  lesson: 广搜博访、征考源流，方成画史中最详赡之作
  summary_first_person: 我字士良，先世吴兴人，居于松江，嗜古精于绘事，为杨维桢所称。我家多藏古迹，又广搜博访，采辑古今能画者录其姓氏加以品藻，作《图绘宝鉴》，自轩辕迄元代，旁及外国，得一千五百余人。
  source_urls:
  - https://www.ctext.org/library.pl?if=gb&res=885
