  era: 北宋（真宗、仁宗朝）
  reign_ref: 大中祥符—天圣
  archetype: 刚正名臣
  dilemmas:
  - 妖蛇被众人奉为神明、刺史率僚佐日谒，击杀有触众怒之险，却关乎破除淫惑、正人心俗
  - 使契丹时优人以先圣为戏，怒而离席；还朝被论“生事开衅”，须在礼节与邦交之间自辩
  lesson: 明则有礼乐，幽则有神；诬神惑民者虽众必击，正直之气不诡随于俗
  summary_first_person: 我乃孔子四十五世孙，祥符间进士出身，初任宁州推官。天庆观蛇妖凭神惑众，郡守率僚属祷拜，我独奋笏击蛇、立毙之，因此知名。后掌风宪，历右正言、御史中丞、龙图阁待制，劾曹利用，使契丹不辱君命。平生以刚直养气自任，击蛇之笏传家数百年，为子孙与名士所宝。
