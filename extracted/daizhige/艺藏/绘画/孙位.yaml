  location_zh: 蜀
- id: guji-孙位-event-yingtian-temple
  date: 0885
  year_of: 885
  title_zh: 应天寺与昭觉寺画壁
  description: 光启年，应天寺无智禅师请画山石两堵、龙水两堵，寺门东畔画东方天王及部从两堵；昭觉寺休梦长老请画松石墨竹一堵，仿润州高座寺张僧繇战胜一堵。龙拿水汹，千状万态，势欲飞动。
  type: career
  location_zh: 成都应天寺、昭觉寺
- id: guji-孙位-event-fuhai
  date: 0885
  year_of: 885
  title_zh: 眉州福海院画行道天王
  description: 悟达国师请于眉州福海院画行道天王、松石龙水两堵，并见存。
  type: career
  location_zh: 眉州福海院
- id: guji-孙位-event-rename
  date: 0885
  year_of: 885
  title_zh: 改名孙遇
  description: 不知其后有何所遇，改名遇矣；后人（如景朴）尝在应天寺门西畔对画天王，识者比之蹄涔巨浸，远不及孙遇。
  type: career
  location_zh: 蜀
