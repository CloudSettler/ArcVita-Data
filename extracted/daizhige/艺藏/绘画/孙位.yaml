  archetype: 逸格画家
  dilemmas:
  - 面对豪贵千金重礼，礼数稍慢即不肯落笔，坚守气节与艺术自主
  lesson: 艺术至高境界在于气韵超然、意先自然，不为权贵所役
  summary_first_person: 我孙位，东越人，僖宗幸蜀时自京入蜀，号会稽山人。性情疏野，襟抱超然，好酒而不沉溺，与禅僧道人往还。豪贵相请礼有少慢，纵赠千金亦难留我一笔，唯好事者时得其画。光启年间我应请于应天寺、昭觉寺画山石、龙水、松石墨竹诸壁，龙拿水汹，势欲飞动，笔精墨妙，名列逸格一人。后来改名孙遇，不知所遇何事。
  source_urls:
  - https://zh.wikisource.org/wiki/益州名画录
