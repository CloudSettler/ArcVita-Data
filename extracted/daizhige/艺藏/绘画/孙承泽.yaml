  name_zh: 孙承泽
  names:
    zh: 孙承泽
    en: Sun Chengze
  lifespan:
    birth:
      date: '1592'
      precision: year
      is_circa: true
      raw: 约1593年生，明末清初人
    death:
      date: '1676'
      precision: year
      is_circa: true
      raw: 约卒于康熙十五年（1676）
  era: 明末清初
  reign_ref: 崇祯、顺治、康熙
  archetype: 鉴藏学人
  dilemmas:
  - 出仕两朝之退隐选择：晚年退居，思以讲学自见，而论者多未之许
  - 著述评价之困：所撰诸书见着録，独鉴赏书画别有专长乃获推许
  lesson: 鉴裁精审、叙次雅洁，业余之癖亦可传世；退居销夏，以赏鉴自适而自成一家之言。
  summary_first_person: 我孙承泽，明末清初人，曾官吏部左侍郎。晚年退居北京，顺治庚子夏四月朔至六月，编成《庚子销夏记》八卷，录所藏晋唐至明书画真迹与古石刻，逐条评隲。生平藏帖上石无数，与曹溶诸君以赏鉴相往还。
  source_urls:
  - https://www.example.com/guji/gengzixiaoxiaji
