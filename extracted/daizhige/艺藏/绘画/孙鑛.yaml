person:
  qid: guji-孙鑛
  name_zh: 孙鑛
  names:
    zh: 孙鑛
    en: Sun Kuang
  lifespan:
    birth:
      date: '1542'
      precision: year
      is_circa: true
      raw: 生年不见于本文，约在嘉靖中期
    death:
      date: '1613'
      precision: year
      is_circa: false
  birth_date: '1542'
  death_date: '1613'
  era: 明代
  reign_ref: 万历
  archetype: 藏品题跋
  dilemmas:
  - 文章制义之名盛于一时，书画并非专业，所论却时有精理，需在『不以书画』与『鉴赏精辨』之间自处
  lesson: 业无论轻重，学无分钜细，博综易而核审精辨为难
  summary_first_person: 我字文融，号月峯，浙江余姚人。万历甲戌成进士，官至南京兵部尚书，谥文简。我以制义文名一时，于诗书礼诸经及三史、晋书、文选皆有评论，余暇著述甚勤。我特因王世贞先有书画跋，复跋其所跋，撰书画跋跋，重文见义，所论考辨精审，时与世贞之论相合，为赏鉴家所取证。
