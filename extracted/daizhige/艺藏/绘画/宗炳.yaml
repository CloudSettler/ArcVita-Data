  - 晚年以疾归江陵，不能亲游名山，遂图之于壁以卧游
  lesson: 以形写形、以色貌色，澄怀味像，畅神而已
  summary_first_person: 我字少文，南阳涅阳人，善书画琴书，好山水，西陟荆巫，南登衡岳，屡被征辟皆不就。晚年以疾归江陵，将平生游历图于壁上以供卧游，并著《画山水序》，阐明以小观大、畅神写意的画理。
