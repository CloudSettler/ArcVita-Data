  dilemmas:
  - 身为吐火罗国人而供奉中都，画风异域，衣冠物像略无中都仪形
  lesson: 融汇异域画技与中原传统，虽各有短长，仍可与当世名家分庭抗礼
  summary_first_person: 我是尉迟乙僧，吐火罗国人，贞观初因善画被荐入中都，授宿卫官、封郡公。人们称我父亲跋质那为大尉迟，称我为小尉迟。我曾在慈惠寺塔前画《千手眼降魔像》，时号奇踪；用笔之妙，能与阎立本相上下。
  source_urls:
  - https://zh.wikisource.org/wiki/宣和畫譜/卷一
