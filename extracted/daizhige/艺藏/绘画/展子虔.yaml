person:
  qid: guji-展子虔
  name_zh: 展子虔
  names:
    zh: 展子虔
    en: Zhan Ziqian
  lifespan:
    birth:
      date: 545
      precision: year
      is_circa: true
      raw: 生年不详，约北齐之前
    death:
      date: 618
      precision: year
      is_circa: true
      raw: 卒年不详，约隋末
  birth_date: 约公元545年
  death_date: 约公元618年
  era: 南北朝至隋
  reign_ref: 隋朝
  archetype: 画家
  dilemmas:
  - 历仕北齐、北周、隋三朝，政权更迭之际如何维系艺术生命与仕途身份
  - 画名与官职之间的取舍，虽为朝散大夫，却以丹青传世
  lesson: 咫尺之内可写千里之势，精湛技艺能超越时代与朝代的更替。
  summary_first_person: 我展子虔历北齐、北周、隋三朝，隋时官拜朝散大夫。我尤擅台阁与山水，写江山远近之势，能于咫尺之间见千里之趣。僧琮评我触物留情，所画备皆绝妙，与董伯仁并称"董展"，然台阁之妙一时无人能窥其奥。
  source_urls:
  - https://zh.wikisource.org/wiki/宣和畫譜
