    title_zh: 仕隋受朝散大夫
    rationale: 隋代周而立，展子虔历仕三朝，入隋继续以画艺受职于朝。
  - date: 590
    title_zh: 专精台阁与山水远近之势
    rationale: 所画台阁之妙，董展同辈不能窥其奥；写江山远近尤工，故咫尺有千里趣。
- id: guji-展子虔-endeavor-2
  name_zh: 与董伯仁并称董展
  phases:
  - key: brewing
