      - 并世名家
    start_date: 570
    highlight_event_id: guji-展子虔-event-dongzhan
  - key: climax
    name_zh: 各擅胜场
    labels:
      zh:
      - 展得其骏
    start_date: 590
    highlight_event_id: guji-展子虔-event-dongzhan
  decisions:
  - date: 590
    title_zh: 以台阁之妙超出董伯仁
    rationale: 时评谓董造其微、展得其骏，展于台阁则胜董，董于车马则胜展，如诗家之李杜。
