  decisions:
  - date: '1705-11-25'
    title_zh: 命孙岳颁、宋骏业、王原祁等纂辑佩文斋书画谱
    rationale_zh: 见书画诸书种类错互漫无统纪，遂即佩文斋所有者编葺之，使各以类相从为一百卷。
  - date: '1708-03-01'
    title_zh: 亲制序文并检出题跋数十则为一卷
    rationale_zh: 从诸臣之请，摅适性情，泳陶清暇，附于古圣人游艺之意，为嗜古者树毫楮之标准。
events:
- id: guji-康熙帝-event-birth
  date: '1654-05-04'
  name_zh: 玄烨生于清宫
  category: birth
  description: 清世祖之子，后以康熙年号临御天下。
- id: guji-康熙帝-event-endeavor-1
  date: '1704-01-01'
  year_of: 1704
  name_zh: 佩文斋披览历代书画诸书
  category: endeavor
  description: 朕万几燕闲，披览典册，间临书家名迹，每观前代纪录书画诸书种类错互，漫无统纪。
- id: guji-康熙帝-event-endeavor-2
  date: '1705-11-25'
  year_of: 1705
  name_zh: 康熙四十四年十月初九日奉敕纂辑书画谱
  category: endeavor
  description: 命孙岳颁、宋骏业、王原祁等发内府书籍纂成是书，经史子集稗官野乘靡不搜采，引书凡一千八百四十四种。
- id: guji-康熙帝-event-endeavor-3
  date: '1708-03-01'
  year_of: 1708
  name_zh: 康熙四十七年二月御制佩文斋书画谱序
  category: endeavor
  description: 述书画源流，自苍颉史皇下暨近代皆列焉，检出题跋数十则以为一卷，从诸臣之请。
- id: guji-康熙帝-event-endeavor-4
  date: '1707-05-11'
  year_of: 1707
  name_zh: 康熙四十六年四月十一日杭州行在奏准校刊
  category: endeavor
  description: 命校刊官生董理雕梓，勒为是编，允为图书之渊要、翰墨之大成。
- id: guji-康熙帝-event-death
  date: '1722-12-20'
  year_of: 1722
  name_zh: 康熙帝崩
  category: death
  description: 在位六十一年，庙号圣祖，谥仁皇帝。
