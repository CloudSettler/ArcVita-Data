  era: 清代
  reign_ref: 康熙（1662—1722）
  archetype: 君主学者·文治稽古之君
  dilemmas:
  - 日理万机与个性情游艺之间的平衡
  - 广搜众说与考辨去取之间的取舍
  lesson: 游心翰墨而务求源流有征，嗜古贵在考信。
  summary_first_person: 朕万几燕闲，披览典册，间临书家名迹；因见书画诸书错互无统，遂发内府所藏，命臣纂辑《佩文斋书画谱》一百卷，溯源篆隶，备录书画源流、工者姓氏、闻人题跋与历代鉴藏，俾嗜古者有所标准，考索有所资粮。
  source_urls:
  - 御制佩文斋书画谱序
