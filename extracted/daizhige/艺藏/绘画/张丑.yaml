  dilemmas:
  - 题跋多从文集转录而非亲睹原迹，需在广收与精审之间权衡
  lesson: 鉴赏贵在订正讹传，如纠《宋史》米芾卒年之误
  summary_first_person: 我原名谦德，字叔益，后改今名，字青父，号米庵，昆山人。万历乙卯得米芾《宝章待访录》墨迹，名书室曰宝米轩，因以自号；次年丙辰辑成《清河书画舫》十二卷。我家四世收藏，所览卷轴极广，书中多订正前人考证之疏，如考米芾生于皇祐三年、卒于大观元年、年五十七，以纠《宋史》之误。后世收藏家多借我书辨验真伪。
  source_urls:
  - https://cht.wikisource.org/wiki/清河书画舫
