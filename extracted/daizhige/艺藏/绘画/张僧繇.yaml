  archetype: 画圣级宗师
  dilemmas:
  - 形似与气韵之间的取舍，疏体笔不周而意周
  - 书画用笔同法之辨，须以书法笔意入画
  lesson: 意存笔先，画尽意在；勿以形似之外无画。
  summary_first_person: 我张僧繇为梁朝画坛宗师，创“张家样”，点曳斫拂依卫夫人《笔阵图》，一点一画别是一巧，钩戟利剑森森然；笔才一二，象已应焉，离披点画，时见缺落，笔不周而意周。我与顾恺之、陆探微、吴道玄并称，书画用笔同法，子善果、儒童皆师于我。
  source_urls:
  - 历代名画记
