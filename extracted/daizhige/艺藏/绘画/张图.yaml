person:
  qid: guji-张图
  name_zh: 张图
  names:
    zh: 张图
    en: Zhang Tu
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 生年不详
    death:
      precision: unknown
      is_circa: false
      raw: 卒年不详
  era: 五代·后梁
  reign_ref: 后梁龙德年间
  archetype: 画家
  dilemmas:
  - 无师授而自成一体，面对自负的名家跋异，是隐忍还是当场较艺
  lesson: 艺高者不假朽约、不事虚让，以笔墨实力服人
  summary_first_person: 我张图，字仲谋，河南洛阳人。曾为朱梁太祖掌行军资粮簿籍，时人呼我"张将军"。我少年颖悟好丹青，泼墨山水皆不由师授，亦不法今古，自成一体，尤长大像。梁龙德年间，洛阳广爱寺募画三门两壁，处士跋异自负绝笔，我长揖请为赞贰，遭其讥诮。我即就西壁不假朽约，搦管挥写，倏忽成折腰报事师并三鬼，跋异惊服引退，我遂专其功，又于东壁画水神一座，视之如生。
