    title_zh: 于广爱寺投朽木于地，就西壁径自挥写
    rationale: 不满跋异自负之语，弃朽木起稿之法，径以神笔挥写以证实力
  - title_zh: 不伪让，专其功
    rationale: 面对跋异谢退，不假辞让，独擅二壁功绩
  - title_zh: 画作《十王地藏》一轴
    rationale: 慈悲善护之相精妙，为时人宝藏
events:
- id: guji-张图-event-birth
  title_zh: 张图生于河南洛阳
  summary_zh: 文献未载其生年，仅知其为河南洛阳人，少颖悟，好丹青。
- id: guji-张图-event-service
  year_of: -4
  title_zh: 张图掌行军资粮簿籍，时人呼为张将军
  summary_zh: 朱梁太祖在藩镇之日，张图执掌行军资粮簿籍，故时人称之为张将军。
- id: guji-张图-event-competition
  date: 936-11-19
  year_of: 936
  title_zh: 广爱寺题壁折服跋异
  summary_zh: 梁龙德中，洛阳广爱寺沙门义暄邀四方奇笔画三门两壁，处士跋异自恃绝笔应募。张图请为赞贰遭讥，遂投朽木于地，就西壁不假朽约，搦管挥写，倏忽成折腰报事师及从者三鬼，跋异惊服而退，张图遂专其功。
- id: guji-张图-event-watergod
  year_of: 936
  title_zh: 东壁画水神一座
  summary_zh: 张图于广爱寺东壁画水神一座，直视西壁报事师，意思高远，视之如生，与西壁并存焉。
- id: guji-张图-event-death
  title_zh: 张图卒
  summary_zh: 文献未载其卒年，可列神品。
