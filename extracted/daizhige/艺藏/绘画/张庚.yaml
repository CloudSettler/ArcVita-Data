  name_zh: 张庚
  names:
    zh: 张庚
    en: Zhang Geng
  lifespan:
    birth:
      date: 1685
      precision: year
      is_circa: false
      raw: 康熙乙丑岁生
  era: 清代
  reign_ref: 康熙、雍正、乾隆
  archetype: 画家与画史学者
  dilemmas:
  - 家贫孤苦，赖节母针黹抚育成立，治学与生计难以两全
  - 著述甚勤而自谦所见者窄，犹豫是否刊行《国朝画征录》
  lesson: 好学心知、虚怀集益，方能名家垂世
  summary_first_person: 我本名焘，字溥三，后改名庚，号浦山，又号瓜田逸史、白苎村桑者，晚号弥伽居士，秀水人。幼年失怙，家境赤贫，全赖节母做针线抚我成人。我工画，尤究心画理，余年十余年间三次上京师，遍游豫章、山左、江汉、中州，载稿于行笥，凡遇可观图画辄考其人而录之，撰成《国朝画征录》，录国朝画家征其可信之迹，评骘不敢轻下一字，以为后之论六法者可由述而考之。
