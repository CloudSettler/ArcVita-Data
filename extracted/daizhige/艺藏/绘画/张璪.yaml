person:
  qid: guji-张璪
  name_zh: 张璪
  names:
    zh: 张璪
    en: Zhang Zao
  lifespan:
    birth:
      date: ~730
      precision: decade
      is_circa: true
      raw: 唐代宗朝前后活动，生年无确载
    death:
      date: ~800
      precision: decade
      is_circa: true
      raw: 晚年事迹见符载《观张员外画松石序》所述谪武陵郡司马时期
  birth_date: ~730（约）
  death_date: ~800（约）
  era: 唐
  reign_ref: 唐代宗至唐德宗年间
  archetype: 墨戏写意的大画家
  dilemmas:
  - 官职贬谪与艺术成就之间的张力: 谪为武陵郡司马，官闲无事反使其画迹为士君子所得而传世
  - 秘致笔法与率意挥写之间的张力: 贵室藏其画非精诚不得睹，而作画时却遗去机巧、以手摸绢素
  lesson: 外师造化，中得心源——绘画须取法自然，归本于心，艺进于道。
  summary_first_person: 我是唐代张璪，字文通，官至尚书祠部员外郎，后谪为武陵郡司马。我以画松石名世，用秃毫，或以手摸绢素，姿态纵横。毕宏见我一惊而绝笔。人问我所受，我答以“外师造化，中得心源”。符载记我当时箕坐鼓气，毫飞墨喷，松石云水顷刻而就；朱景玄、张彦远亦推重我水墨淋漓、ignon不拘常法之法。
