  desc_zh: 张璪生于唐，字文通，后官至尚书祠部员外郎。
- id: guji-张璪-event-1
  type_zh: 事业
  date: ~765
  year_of: 765
  date_raw: 毕宏见其所画而惊叹，时当代宗朝
  desc_zh: 毕宏擅名于代，一见张璪画惊叹其唯用秃毫、或以手摸绢素，闻“外师造化，中得心源”之语而搁笔。
- id: guji-张璪-event-2
  type_zh: 事业
  date: ~779
  year_of: 779
  date_raw: 谪为武陵郡司马之日
  desc_zh: 张璪谪官武陵郡司马。御史陈澧会其座上，众客请观，员外箕坐鼓气，毫飞墨喷，顷刻松石云水俱成，众皆惊叹其艺如道。
- id: guji-张璪-event-3
  type_zh: 事业
  date: ~780
  year_of: 780
  date_raw: 答毕宏问答之际
  desc_zh: 应毕宏所问，张璪抛出“外师造化，中得心源”八字，成为后世画论心印。
- id: guji-张璪-event-death
  type_zh: 去世
  date: ~800
  year_of: 800
  date_raw: 卒年不详，约贞元中
  desc_zh: 张璪卒年无考，其画迹与画论经张彦远等记述而传世。
