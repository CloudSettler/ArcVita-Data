  era: 唐末五代
  reign_ref: 唐乾符至前蜀、后蜀之际
  archetype: 道门人物画家
  dilemmas:
  - 少孤贫而性好绘画，落拓无羁，遂弃俗衣道士服
  - 唯画道门尊像，豪贵之家少得其画者
  lesson: 专注一道，落笔如神，自始及终更无改正；以笃守本业终成名手。
  summary_first_person: 我是简州人张素卿，出身孤贫而性好丹青，多见隋唐名画而艺成，遂着道士服，专画道门尊像。乾符中居青城山常道观焚修，因上表议丈人山封号而获赐紫。我画五岳朝真、十二仙君诸图，落锥之后下笔如神，更无改正；后于青城山丈人观、简州开元观画诸神仙像，声动当代。
  source_urls:
  - https://zh.wikisource.org/wiki/益州名画录
