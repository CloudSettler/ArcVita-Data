  dilemmas:
  - 以双管齐下之绝技闻名，然史料未载其仕途行事，艺术声名与生平事迹失于记载
  lesson: 技进乎道，一笔之枯荣可写尽天地春秋之气
  summary_first_person: 我张藻乃唐朝衣冠文学之名流，尤以画松石、山水称绝当代。我最负盛名者，是以手握双管、一时齐下，一画生枝，一画枯枝，生枝润含春泽，枯枝惨同秋色，槎丫鳞皴之状随意纵横。我所作山水高低秀丽，咫尺之间重深无尽，石尖欲落、泉喷如吼。时人推我松树特出古今，能居神品之列。
