  dilemmas:
  - 学古与创新：主张须优入古人法度中，方能脱落时径、洗发新趣
  - 逸品与俗习：见没骨花图传模既久将为滥觞，亟称宋人澹雅以还本色
  lesson: 作画在摄情，虚处实则通体皆灵；善学者于古人不用心处用心。
  summary_first_person: 名格，一字寿平，号南田，毗陵人。我以没骨写生名世，又以笔跋论画之理，谓澄怀观道，出入风雨而卷舒苍翠。
