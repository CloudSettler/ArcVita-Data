  birth_date: '1018'
  death_date: '1079'
  era: 北宋
  reign_ref: 宋神宗熙宁、元丰年间
  archetype: 画家
  dilemmas:
  - 工于墨竹而仕途不显，远官湖州，身后以艺名世
  - 法度与自然之辨：画竹须“胸有成竹”，既守规矩又求生意
  lesson: 画竹必先得成竹于胸中，振笔直遂以追其所见；艺之精者，法度之中自见天真。
  summary_first_person: 我文同，字与可，世称文湖州。我以善画墨竹名于世，主张画竹先得成竹于胸中，曾以画竹之诀授苏轼。苏公终身北面，后世宗我这派墨竹者，皆推我为源头。
endeavors:
- id: guji-文同-endeavor-1
  name_zh: 开创湖州墨竹一派
  labels:
    zh:
    - 艺事
    - 墨竹
  start_date: '1050'
  highlight_event_id: guji-文同-event-invention
  decisions:
  - date: '1050'
    title: 立墨竹之法度
    rationale: 笔如神助，妙合天成，驰骋于法度之中而逍遥于尘垢之外，纵心所欲不逾准绳。
- id: guji-文同-endeavor-2
  name_zh: 传授画竹要诀
  labels:
    zh:
    - 艺事
    - 授业
  start_date: Bing-Xi-1073
  highlight_event_id: guji-文同-event-teach
  decisions:
  - date: '1073'
    title: 授东坡画竹之诀
    rationale: 竹之始生一寸之萌而节叶具焉，画竹必先得成竹于胸中，執筆熟視振筆直遂。
events:
- id: guji-文同-event-birth
  date: '1018'
  date_of: birth
  year_of: 1018
  title: 文同生于北宋
  summary: 北宋梓州永泰人，字与可，后以善画竹知名。
- id: guji-文同-event-birth-meta
  date: '1018'
  date_of: birth
  year_of: 1018
  title: 生卒年份补记
  summary: 北宋时期生，元丰年间卒，享年约六十余岁。
- id: guji-文同-event-invention
  date: '1050'
  date_of: event
  year_of: 1050
  title: 独得墨竹笔法，开湖州竹派
  summary: 至宋朝作者寖盛，文湖州最后出，不异杲日升空爝火俱息，黄钟一振瓦釜失声，一以画竹之宗为世所推。
- id: guji-文同-event-teach
  date: '1073'
  date_of: event
  year_of: 1073
  title: 授苏轼胸有成竹之诀
  summary: 文湖州授东坡诀云画竹必先得成竹于胸中，振笔直遂以追其所见，如兔起鹘落少纵则逝。
- id: guji-文同-event-huzhou
  date: '1079'
  date_of: event
  year_of: 1079
  title: 知湖州，世称文湖州
  summary: 出知湖州，不久去世，后世遂以“文湖州”称之，其画法亦号湖州竹派。
- id: guji-文同-event-death
  date: '1079'
  date_of: death
  year_of: 1079
  title: 文同去世
  summary: 苏公犹终身北面，斯人已没而湖州之法流传后世。
