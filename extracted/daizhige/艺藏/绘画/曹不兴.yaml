person:
  qid: guji-曹不兴
  name_zh: 曹不兴
  names:
    zh: 曹不兴
    en: Cao Buxing
  lifespan:
    birth:
      precision: year
      is_circa: false
      raw: ''
  era: 三国吴
  reign_ref: 孙权时期，赤乌年间
  archetype: 画家以误点成蝇、写龙献瑞著称的吴地画圣
  dilemmas:
  - 误落墨点于屏风素面，需即兴补救而不损画
  - 目睹龙出水上，决定落笔写生以献君主
  lesson: 匠心妙手可化失误为神来之笔；写实功力使画迹历数百年而令人叹服
  summary_first_person: 我曹不兴乃吴兴人，为孙权画屏风时误落笔点于素上，随手就势画成蝇状，孙权疑以为真而以手弹之。吴中有八绝之称，我忝列其一。赤乌年间我至青溪，见赤龙出于水上，写之献于孙皓，皓送秘府藏之。至宋朝陆探微见此画犹叹其精妙，取龙置于水上，应时蓄水成雾。谢赫虽言我之真迹世代不复可见，然观秘阁所存一龙头，可知我风骨擅名不虚。我又尝画兵符图，极工。
  source_urls:
  - https://zh.wikisource.org/wiki/历代名画记
