person:
  qid: guji-朱景玄
  name_zh: 朱景玄
  names:
    zh: 朱景玄
    en: Zhu Jingxuan
  lifespan:
    birth:
      date: 504
      precision: decade
      is_circa: true
      raw: 约唐代宗大历年间，生年无确考
    death:
      date: 0840
      precision: decade
      is_circa: true
      raw: 约卒于唐文宗开成前后，卒年无确考
  birth_date: '0770'
  death_date: 0840
  era: 唐朝中后期
  reign_ref: 唐宪宗元和年间（806-820）
  archetype: 画史品评家
  dilemmas:
  - 前人品录如李嗣真《画品录》空录人名而不论善恶高下，后人无从考证，如何另立可考之品格体系
  - 画迹亲见有限，若求全而录入传闻，则失实；若仅录亲见，则恐遗贤，如何权衡取舍
  - 张怀瓘神、妙、能三品已定等格，然有不拘常法之奇作，格于三品则失其真，如何安置
  lesson: 立品定格须以亲见为据，见者必书、不见者不录；分类立品方使后之鉴者可考可辩。
  summary_first_person: 我是唐人朱景玄，平生窃好绘事，寻访画踪。见李嗣真《画品录》空录人名而不论善恶，后学无所考鉴，遂借张怀瓘神、妙、能三品之断，再分上中下，又于格外创逸品以表不拘常法者。我论画以人物居先，推吴道子天纵其能、独步当世，周昉次之，其余作者一百二十四人直以能画定其品格，不计冠冕贤愚。此《唐朝名画录》所以作也。
endeavors:
- id: guji-朱景玄-endeavor-1
  name_zh: 撰《唐朝名画录》
  labels:
    zh: 品评著述
  phases:
  - key: brewing
    name_zh: 溯源画品之弊
    labels:
      zh: 病前人品录空录人名
    start_date: 0790
    highlight_event_id: guji-朱景玄-event-critique-lizhen
  - key: breakthrough
    name_zh: 借三品立等格
    labels:
      zh: 承张怀瓘神妙能之断
    start_date: 0800
    highlight_event_id: guji-朱景玄-event-sanpin
  - key: climax
    name_zh: 创逸品、定宗匠
    labels:
      zh: 格外立逸品，推吴道子
    start_date: 0806
    highlight_event_id: guji-朱景玄-event-yipin
  - key: closure
    name_zh: 集录成书
    labels:
      zh: 录一百二十四人成《唐朝名画录》
    start_date: 0810
    highlight_event_id: guji-朱景玄-event-chengshu
  decisions:
  - date: 0800
    title_zh: 以张怀瓘《画品》断神、妙、能三品为纲，上中下再分三等
    rationale: 三品断格可使后之观者考其高下，免于空录人名、无善恶之弊。
  - date: 0806
    title_zh: 于三品之外增设逸品
    rationale: 其格外有不拘常法者，格于神妙能则失其真，故立逸品以表其优劣。
  - date: 0810
    title_zh: 不见者不录，见者必书
    rationale: 推之至心，不愧拙目；宁守亲见之实，不作泛滥之录。
  - date: 0810
    title_zh: 直以能画定品格，不计冠冕贤愚
    rationale: 近代画者但工一物以擅其名，以艺本身为衡，方可使后之至鉴者诋诃其理为不谬。
events:
- id: guji-朱景玄-event-birth
  date: 504
  year_of: 770
  title_zh: 朱景玄约生于唐代宗大历年间
  detail: 生年无确考，据元和间撰《唐朝名画录》推其约生于八世纪中后期。
- id: guji-朱景玄-event-critique-lizhen
  date: 0790
  year_of: 790
  title_zh: 病李嗣真《画品录》空录人名而不论善恶
  detail: 自国朝以来惟李嗣真《画品录》空录人名，无品格高下，俾后之观者何以考焉，遂立志自撰品录。
- id: guji-朱景玄-event-sanpin
  date: 0800
  year_of: 800
  title_zh: 借张怀瓘《画品》断神、妙、能三品，定其等格
  detail: 以张怀瓘三品之断为纲，上中下又分为三，建立可考之画格体系。
- id: guji-朱景玄-event-yipin
  date: 0806
  year_of: 806
  title_zh: 于三品格外创逸品，推吴道子独步当世
  detail: 其格外有不拘常法者又有逸品，以表其优劣；论画以人物居先，谓吴道子天纵其能、独步当世，可齐踪于顾陆，周昉次焉。
- id: guji-朱景玄-event-chengshu
  date: 0810
  year_of: 810
  title_zh: 撰成《唐朝名画录》并作序
  detail: 其余作者一百二十四人直以能画定其品格，不计其冠冕贤愚，于品格之中略序其事，使后之至鉴者可以诋诃其理为不谬。
- id: guji-朱景玄-event-death
  date: 0840
  year_of: 840
  title_zh: 朱景玄约卒于唐文宗开成前后
  detail: 卒年无确考，约卒于九世纪中前期。
