  dilemmas:
  - 位列士大夫清流，而以丹青末技名世，须在文人身份与画家技艺之间自处
  - 学佛悟道深得微旨，而立朝籍籍有声，出奇玄异之画恐世俗惊惑不识胜绝处
  lesson: 士大夫能画何愧于古——阎立本、杨炎、王维、郑虔皆以画不害其为贤，极致之艺与文人之道可以并存。
  summary_first_person: 我是龙眠居士李伯时，登进士第，以文学有名于时，学佛悟道，立朝有声，雅好钟鼎古器，画心通意，时人谓我鞍马愈韩干、佛像近吴道玄。
  source_urls:
  - https://example.org/guji/deyu-zhai-huapin
