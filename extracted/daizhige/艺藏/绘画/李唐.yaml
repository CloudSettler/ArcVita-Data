person:
  qid: guji-李唐
  name_zh: 李唐
  names:
    zh: 李唐、李晞古
    en: Li Tang
  lifespan:
    birth:
      date: '1049'
      precision: year
      is_circa: true
      raw: 建炎间年近八十
  birth_date: 约1049年（据建炎间年近八十推算）
  death_date: 卒年不详（南宋高宗朝仍在世）
  era: 北宋末至南宋初（徽宗、高宗朝）
  reign_ref: 宋徽宗、宋高宗（建炎）
  archetype: 画院待诏·南渡画家
  dilemmas:
  - 中原板荡、南渡流寓，年近八十而重入画院谋生
  - 院画身份与“名下无虚士”的文人评鉴之间的张力
  lesson: 笔意不凡、自成家数，年高不坠其志，师古而能变（大斧劈皴）
  summary_first_person: 我李唐，字晞古，河阳三城人。徽宗朝补入画院，靖康乱后南渡至临安，建炎间得太尉邵宏渊荐，授成忠郎、画院待诏，赐金带，时年近八十。我善画人物山水，尤工画牛，山水初法李思训，后自成大斧劈皴一家，高宗雅重之，尝题我长夏江寺卷云“李唐可比唐李思训”。
  source_urls:
  - https://www.ctext.org/
