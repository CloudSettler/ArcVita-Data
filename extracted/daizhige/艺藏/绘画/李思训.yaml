  lesson: 山水之变，成于二李——在承袭传统与开创金碧山水之间完成盛唐山水画之变革
  summary_first_person: 我乃唐宗室李思训，官至右武卫大将军，人称大李将军。武周之世我弃官藏匿，开元初复居庙堂。然我最足传世者在丹青——金碧山水、楼台界画，与吾弟思诲、侄昭道并称，世谓"山水之变，始于吴，成于二李"。
  source_urls:
  - https://zh.wikisource.org/wiki/历代名画记
