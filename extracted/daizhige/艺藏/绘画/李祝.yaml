  body: 属唐祚陵季，遂退藏不仕，以丹青自污，而好游晋唐间。
- id: guji-李祝-event-painting
  event_date: 0904
  year_of: 0904
  type: career
  name_zh: 对手画摄摩腾竺法兰及诸神像于龙兴寺壁
  body: 命往陕郊画龙兴寺回廊列壁二百余堵，与韩求对手画摄摩腾竺法兰以经来大各八尺，三门上神数十身皆高二丈，又画九子母及罗乂变像，宛有步武之态，天下画流云集，莫不鼠伏。
- id: guji-李祝-event-death
  event_date: 0905
  year_of: 0905
  type: death
  name_zh: 为李克用溺杀于中流
  body: 克用闻画人谗言，虑事泄，矫称按察至陕郊，设宴慰劳，逮济中流，求祝俱醉，克用皆溺之。君子太息曰：怀异志，杀善人，死无日矣。
