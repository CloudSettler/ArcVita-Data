  archetype: 乱世避祸的画家
  dilemmas:
  - 才具经略却逢唐祚陵季，退藏不仕，以丹青自污避祸
  - 画艺冠绝反遭忌：因知晋王李克用“异图”之密而见害
  lesson: 才高不能避世之险，技进乎道亦难逃乱世杀机
  summary_first_person: 我李祝与韩求齐名，皆有经略之才，生逢唐末乱世，不肯出仕，以丹青自晦。我们在陕郊画龙兴寺回廊列壁二百余堵，画摄摩腾、竺法兰及神像九子母，宛有生态，天下画流云集而莫不鼠伏。然因画中辞多不顺，被指知晋王异图之密，李克用借宴饮中流，将我与韩求俱溺杀之。画名冠绝天下，竟以水葬收场，君子闻之太息焉。
