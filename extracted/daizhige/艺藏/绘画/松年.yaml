person:
  qid: guji-松年
  name_zh: 松年
  names:
    zh: 松年
    en: Song Nian
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: ''
    death:
      precision: unknown
      is_circa: true
      raw: ''
  era: 清
  reign_ref: 光绪
  archetype: 书画家·画论家
  dilemmas:
  - 扬雄称书画为雕虫小道，壮夫不为；而作者认为小道亦有奥义，穷半生心血于范水模山
  - 临摹可长学识但易困于古法，独创一家方能称画才，二者如何取舍
  - 争名字画令人折损福泽，退而怡情自适抑或精进立名
  lesson: 用笔、运墨、用水六字尽之；书与画皆须由工入放、独创一家，方能得上品。
  summary_first_person: 我姓松年，蒙古人，自幼喜画，三十五岁经吾师如冠九先生指点三年而窥堂奥，名噪津门。后宦游山左二十余年，公暇以笔墨怡情，将师传与自悟之要诀撰成《颐园论画》，愿为我画社诸贤挥毫之一助。
  source_urls:
  - https://zh.wikisource.org/wiki/颐园论画
