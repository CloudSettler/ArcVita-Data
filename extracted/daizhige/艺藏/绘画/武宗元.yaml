  year_of: 996
  type: progress
  summary: 年十七，文惠公请画北邙老子庙壁，颇为精神。
- id: guji-武宗元-event-4
  person_qid: guji-武宗元
  title_zh: 玉清昭应宫募画流三千人中选为左部之长
  date: '1007-12-31'
  year_of: 1007
  type: climax
  summary: 景德末章圣皇帝营玉清昭应宫，募天下画流逾三千，中选者才百人，分为二部，宗元为左部之长。
- id: guji-武宗元-event-5
  person_qid: guji-武宗元
  title_zh: 画中岳天封观及洛中南宫三圣宫东壁画十太乙
  date: '1020'
  year_of: 1020
  type: progress
  summary: 中岳天封观置百金以求名手，宗元乘兴挥写无毫发遗憾；洛中南宫三圣宫东壁画十太乙皆丈余，又于河阳广福院写迴廊庙壁。
- id: guji-武宗元-event-6
  person_qid: guji-武宗元
  title_zh: 为张士逊画消灾菩萨并终官虞部员外郎
  date: '1030'
  year_of: 1030
  type: milestone
  summary: 丞相文懿张公士逊生辰，宗元画消灾菩萨一轴，公张于千岁堂秘重焉；历官至虞部员外郎，列神品下。
- id: guji-武宗元-event-death
