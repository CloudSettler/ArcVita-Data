  title_zh: 文惠公王随妻以外孙女并补太庙斋郎
  date: 0990
  year_of: 990
  type: milestone
  summary: 父道与丞相文惠公王随为布衣交，携宗元诣之，时方成童，大被称赏，文惠公妻以外孙女，用其荫补太庙斋郎。
- id: guji-武宗元-event-3
  person_qid: guji-武宗元
