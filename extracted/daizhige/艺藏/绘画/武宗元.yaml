  dilemmas:
  - 虽贵人名臣日走于门求画甚勤，未尝肯诺，坚守艺术自主而不媚权贵
  lesson: 学吴生之笔而得其闲丽之态，技艺精绝且不为势利所动，方能列神品之位。
  summary_first_person: 我武宗元字总之，河南白波人，世代业儒。早年承丞相王随赏识，补太庙斋郎。景德末真宗营建玉清昭应宫，天下画流三千余人应选，中选者仅百人，我任左部之长。我学吴道子之笔得其闲丽之态，善画大像，曾为中岳天封观、洛中南宫三圣宫等画壁，历官至虞部员外郎，列名画评神品下。
  source_urls:
  - https://ctext.org/wikibook/song-chao-ming-hua-ping/
