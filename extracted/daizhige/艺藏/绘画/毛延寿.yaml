      precision: unknown
      is_circa: true
      raw: 西汉元帝时期
    death:
      precision: unknown
      is_circa: true
      raw: 元帝时因昭君事弃市
  era: 西汉元帝时期
  reign_ref: 汉元帝（竞宁前后）
  archetype: 画工
  dilemmas:
  - 宫人竞相贿赂画工以求美图，受贿与否关乎生计与操守
  - 王昭君不赂画工而被画丑，终致和亲远嫁，画家因此获罪
  lesson: 苟取不义之财，纵有绝艺亦难自保；去真存伪终致杀身之祸。
  summary_first_person: 我是杜陵人毛延寿，善画人物，老少美恶皆得其真。元帝后宫既多，使画工图其状以备按图召见，诸宫人竞赂画工求美像，独王嫱不苟求我，我遂为其作丑状。后匈奴求汉美女，帝按图召昭君行，见其貌为第一，甚悔而籍已定，穷究其事，我与诸画工皆弃市。
