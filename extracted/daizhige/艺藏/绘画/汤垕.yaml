person:
  qid: guji-汤垕
  name_zh: 汤垕
  names:
    zh: 汤垕
    en: Tang Hou
  era: 元代
  reign_ref: 元文宗天历元年（1328）前后著《画鉴》
  archetype: 鉴赏家·书画评鉴学者
  dilemmas:
  - 旧本题“宋东楚汤垕”实为相沿误题，垕与柯九思同为元人，不能复称宋人，亦非遗民借口
  - 其《画鉴》经后人删补润色，已非原本，书名亦非垕所自命，而题词不著名氏，难以详考其人
  lesson: 论画以鉴别真伪为主，凡所辨论皆在笔墨气韵之间，知画贵识其气象与笔意。
  summary_first_person: 我是汤垕，字君载，自号采真子，东楚人，生活于元代。我妙于考古，在京师与鉴画博士柯九思论画，遂著《画鉴》，采真访赜，鉴别历代名画真伪。我论画始于吴曹弗兴，历晋卫协、顾恺之，六朝陆探微诸家，及唐五代、宋金元诸家，以至外国画与杂论，大致似米芾《画史》，以鉴别真伪为主，所辨皆在笔墨气韵之间。
  source_urls:
  - 钦定四库全书·子部·艺术类·画鉴
