    start_date: 1804
  - key: breakthrough
    name_zh: 分则注释
    labels:
      zh: 拟划段落，分十则作注
    start_date: 1810
  - key: climax
    name_zh: 订正付梓
    labels:
      zh: 请谢澧浦校正，录评语刊行
    start_date: 1813-12-20
    highlight_event_id: guji-汤贻汾-event-book-2
  - key: closure
    name_zh: 序成流布
    labels:
      zh: 仲振履作序，书成传世
    start_date: 1813-09-03
  decisions:
  - date: 1804
    title_zh: 拟分划《画筌》段落并注
    rationale_zh: 冯墨初示《书筌》，论法精当简要而论未条分，欲使初学了然
  - date: 1805
    title_zh: 编纂中辍
    rationale_zh: 时遭北水骤至，邑侯属主赈事，戊辰复捧檄南来，此事久废
  - date: 1813
    title_zh: 付梓谢澧浦订正
    rationale_zh: 编卷已十载，同人多劝付梓，因钞本多伪，属画友谢澧浦以桐华馆刊本校正
  - date: 1813
    title_zh: 择录王石谷、恽正叔评语
    rationale_zh: 鲁亥既正，并录评语之精当者什之五六
- id: guji-汤贻汾-endeavor-2
  name_zh: 仕宦为官
  phases:
  - key: brewing
    name_zh: 三江任职
    labels:
      zh: 任三江都司
    start_date: 1805
  - key: climax
    name_zh: 摄齐昌都尉
    labels:
      zh: 摄齐昌都尉事
    start_date: 1813
    highlight_event_id: guji-汤贻汾-event-official-2
  decisions:
  - date: 1805
    title_zh: 分笪氏原文为十则
    rationale_zh: 任三江时因问业者随事指陈，分目为十则，每则为之注
  - date: 1808
    title_zh: 主赈灾事
    rationale_zh: 北水骤至，流离满野，邑侯属主赈事
