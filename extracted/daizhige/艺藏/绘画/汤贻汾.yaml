person:
  qid: guji-汤贻汾
  name_zh: 汤贻汾
  names:
    zh: 汤贻汾
    en: Tang Yifen
  lifespan:
    birth:
      date: '1778'
      precision: year
      is_circa: true
      raw: 乾隆年间生
    death:
      date: '1853'
      precision: year
      is_circa: true
      raw: 咸丰三年卒
  birth_date: '1778'
  death_date: '1853'
  era: 清代嘉庆、道光、咸丰年间
  reign_ref: 嘉庆、道光
  archetype: 书画名家
  dilemmas:
  - 欲订正笪重光《画筌》分则注释，时遭水灾流离应当赈务，编纂之事中辍多年
  - 以钞本多伪，同人多劝付梓而迟迟不敢刊行
  lesson: 剖裁先哲文字面 pundit 虽难，为便于后学寻绎，标目分则、附录愚论，终成《画筌析览》
  summary_first_person: 我是汤贻汾，号雨生。我研读笪江上先生《画筌》，虑其章段连翩、论说互杂，遂积十年之功标目分则、删冗订正，并请谢澧浦校正付梓，又访冯墨初、与仲振履相助，终使此篇永垂于后。
endeavors:
- id: guji-汤贻汾-endeavor-1
  name_zh: 编纂《画筌析览》
  phases:
  - key: brewing
    name_zh: 积年研读
    labels:
