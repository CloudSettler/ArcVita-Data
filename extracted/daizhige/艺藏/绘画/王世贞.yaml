  dilemmas:
  - 政务之暇与著述鉴藏之间的取舍
  - 对古书画真伪难辨的疑信之难
  lesson: 拙于挥毫而工于别古，鉴古之道在博览精辨而非自书成家。
  summary_first_person: 我是王世贞，字元美，号弇州山人，明代太仓人，官至南京刑部尚书，世称大司寇。我好古敏求，考覈精密，著有《弇州山人四部稿》，先成《书画跋》诸篇，采拾多而见闻广；孙鑛复跋我所跋，成《书画跋跋》。我于钟繇、王羲之、褚遂良、颜真卿诸帖皆有题跋，辨真伪、论笔法，虽不以字名，而吴中诸家知法古人者，或推我为一人。
  source_urls:
  - https://www.example.org/roughcraft/sun-yue-xuan-yu-shuhua-babba
