  decisions:
  - date: '1655'
    title_zh: 承祖父命摹习古迹缩本
    rationale: 王时敏择古迹法备气至者二十四幅为缩本，出入与俱，以时模楷，原祁由此扎根正脉。
  - date: '1670'
    title_zh: 专宗大痴墨妙
    rationale: 世之论一峰老人正法眼藏者归于王氏一门，原祁世其业而精之，遂以山水名世。
- id: guji-王原祁-endeavor-2
