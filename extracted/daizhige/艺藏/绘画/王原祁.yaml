    en: Wang Yuanqi
  lifespan:
    birth:
      date: '1642'
      precision: year
      is_circa: false
      raw: 明崇祯十五年
    death:
      date: '1715'
      precision: year
      is_circa: false
      raw: 清康熙五十四年
  birth_date: '1642'
  death_date: '1715'
  era: 清代初期
  reign_ref: 康熙
  archetype: 画家（正统派山水，娄东画派宗师）
  dilemmas:
  - 家学传承与个人风格之间的取舍：承祖父王时敏所授大痴（黄公望）正法，须守正而能自出机杼
  - 仕途与绘事的兼顾：以科名入仕供奉内廷，同时以画艺推重于时
  lesson: 深研家学、宗法黄公望而精益求精，方能世其业而精之，为一时推重。
  summary_first_person: 我是王原祁，太仓王时敏之孙。我家藏名迹、画学有自，我世其家业而精研大痴墨妙，以山水推重于时。
  source_urls:
  - https://zh.wikisource.org/wiki/國朝畫徵錄
