    start_date: '1670'
    highlight_event_id: guji-王原祁-event-career-2
  - key: climax
    name_zh: 供奉内廷、鉴藏书画
    labels:
      zh:
      - 内廷供奉
      - 佩文斋书画谱
    start_date: '1700'
    highlight_event_id: guji-王原祁-event-career-2
  decisions:
  - date: '1670'
    title_zh: 应科举以进身
    rationale: 以科名入仕为进身之阶，得以接近内廷鉴藏与绘事。
events:
- id: guji-王原祁-event-birth
  date: '1642'
  year_of: 1642
  type: birth
  name_zh: 王原祁出生
  description_zh: 王原祁生于太仓，为文肃公王锡爵曾孙、王时敏之孙。
  persons:
  - guji-王原祁
  place: 太仓
- id: guji-王原祁-event-career-1
  date: '1655'
  year_of: 1655
  type: career
  name_zh: 承家学研习绘画
  description_zh: 承祖父王时敏指授，得见家藏名迹，以缩本巨册时时模楷，凡布置设施、钩勒斫拂、水晕墨彰悉有根柢。
  persons:
  - guji-王原祁
  - guji-王时敏
  place: 太仓
- id: guji-王原祁-event-career-2
  date: '1700'
  year_of: 1700
  type: career
  name_zh: 以山水精艺推重于时
  description_zh: 世其家业而精之，宗法黄公望而自成面目，画名大盛，为清代画苑所推重。
  persons:
  - guji-王原祁
  place: 京师
- id: guji-王原祁-event-death
  date: '1715'
  year_of: 1715
  type: death
  name_zh: 王原祁去世
  description_zh: 王原祁卒，其山水一脉为娄东正宗，影响后世深远。
  persons:
  - guji-王原祁
  place: 京师
source_note: 本条目主要据《国朝画征录》王时敏条"孙原祁世其业而精之，推重于时"及卷首目次所载，结合通行生平记载补足。
