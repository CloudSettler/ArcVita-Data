person:
  qid: guji-王士元
  name_zh: 王士元
  names:
    zh: 王士元
    en: Wang Shiyuan
  lifespan:
    birth:
      date: 0935
      precision: decade
      is_circa: true
      raw: 宋初，生年不詳
  birth_date: 约0935
  era: 北宋初（宋太宗朝）
  reign_ref: 宋太宗
  archetype: 丹青妙品兼儒者之画师
  dilemmas:
  - 品第之争：图画院定品时遭高文进排抑为下品，虽识者不平，只以三千缣赐，气节使其弃赏而去
  - 儒艺之间：好读书为儒者言，出游艺术之门，兼通微妙而世人品第未公
  lesson: 技不逢时可以自守，识与气节比名次更长久
  summary_first_person: 我是汝南宛丘人王士元，承父仁寿丹青之学而技艺尤精，又好读书，为儒者所称。曾客于孙四皓之门，作《武王誓师独夫崇饮图》，洛阳观者日不可计。太宗续唐《名画断》得百二十人。然图画院品第时，高文进与我有隙，抑我为下品，我受三千缣而不顾而去。文懿张公惜我之精，奏摄南阳从事。人物、山水、畜兽、屋木诸门皆列名于品中。
  source_urls:
  - https://www.ctext.org/wiki.pl?if=gb&chapter=宋-朝-名-画-评
