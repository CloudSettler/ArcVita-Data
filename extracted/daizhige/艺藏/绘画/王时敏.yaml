person:
  qid: guji-王时敏
  name_zh: 王时敏
  names:
    zh: 王时敏
    en: Wang Shimin
  lifespan:
    birth:
      date: '1592'
      precision: year
      is_circa: true
      raw: 少时即受董其昌、陈继儒深赏
    death:
      date: '1680'
      precision: year
      is_circa: true
      raw: 卒年八十有九
  birth_date: '1592'
  death_date: '1680'
  era: 明末清初
  reign_ref: 万历—康熙年间
  archetype: 画苑领袖
  dilemmas:
  - 淡于仕进与承袭祖荫为官之间的取舍
  - 收购名迹不惜重金而家藏与传艺之间的取舍
  lesson: 得正法真传者，须兼收古法、勤于模楷，并以爱才之心成就后人。
  summary_first_person: 我出身太仓王氏，为文肃公锡爵之孙，淡于仕进而专注笔墨，穷究大痴墨妙，为国朝画苑领袖，四方工画者踵接于门，皆得其指授而知名于时。
  source_urls:
  - https://zh.wikisource.org/wiki/國朝畫徵錄
endeavors:
- id: guji-王时敏-endeavor-1
  name_zh: 少年学画，得董其昌真传
  phases:
  - key: brewing
    name_zh: 启蒙
    labels:
      zh:
      - 天资颖异
      - 名家赏识
    start_date: '1600'
    highlight_event_id: guji-王时敏-event-recognition
  decisions:
  - date: '1610'
    title_zh: 弃仕途而优游笔墨
    rationale: 以荫官至奉常，然淡于仕进，专力于画学
- id: guji-王时敏-endeavor-2
  name_zh: 收藏名迹与模楷缩本
  phases:
  - key: brewing
    name_zh: 富于收藏
    labels:
      zh:
      - 不惜多金购名迹
      - 李营丘墨迹
    start_date: '1610'
    highlight_event_id: guji-王时敏-event-collection
  decisions:
  - date: '1620'
    title_zh: 择古迹二十四幅为缩本巨册
    rationale: 载在行笥，出入与俱，以时模楷，使布置钧勒悉有根柢
- id: guji-王时敏-endeavor-3
  name_zh: 领袖画苑，指授后学
  phases:
  - key: climax
    name_zh: 声誉隆盛
    labels:
      zh:
      - 国朝画苑领袖
      - 爱才若渴
    start_date: '1650'
    highlight_event_id: guji-王时敏-event-leader
  decisions:
  - date: '1660'
    title_zh: 揄扬王翚于名公卿间
    rationale: 爱才若渴，诎己右之，周恤备至，使翚得成绝艺
events:
- id: guji-王时敏-event-birth
  date: '1592'
  year_of: 1592
  title_zh: 王时敏生
  description: 太原王氏，文肃公王锡爵之孙、翰林王衡之子，太仓人
- id: guji-王时敏-event-recognition
  date: '1610'
  year_of: 1610
  title_zh: 少年为董其昌、陈继儒所深赏
  description: 于画有特慧，董宗伯综揽古今、以传灯一宗视之，烟客亲得其真源嫡派。
- id: guji-王时敏-event-collection
  date: '1620'
  year_of: 1620
  title_zh: 购李营丘《山阴泛雪图》费二十镒
  description: 每得秘轴闭阁沉思，遇有赏会则绕床大叫、拊掌跳跃。
- id: guji-王时敏-event-leader
  date: '1660'
  year_of: 1660
  title_zh: 为国朝画苑领袖，四方画者踵接于门
  description: 得其指授无不知名于时，海虞王翚其首也。
- id: guji-王时敏-event-death
  date: '1680'
  year_of: 1680
  title_zh: 王时敏卒
  description: 卒年八十有九。子王撰传其大痴法，孙王原祁世其业而精之，推重于时。
