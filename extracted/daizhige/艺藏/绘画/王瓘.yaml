  date: ''
  year_of: ''
  description: 王瓘生，河南洛阳人，美风表有才辨。
- id: guji-王瓘-event-learn
  type: endeavor
  date: ''
  year_of: ''
  description: 少时贫穷无以游学，往观北邙山老子庙壁吴道子所画，穷冬积雪不倦，尘滓涂渍必拂拭刮磨以寻其迹，由是得其遗法。
- id: guji-王瓘-event-zhaobao
  type: endeavor
  date: ''
  year_of: ''
  description: 石中令以礼相召，为王瓘付酬金币，命其画昭报寺廊壁，声誉籍甚，动于四远，王公大人以其画为珍玩。
- id: guji-王瓘-event-climax
  type: endeavor
  date: 0963
  year_of: '963'
  description: 干德开宝之间（963—976）画名至盛，无人可敌，刘道醇评其为本朝丹青第一，居神品上，谓前无吴生。
- id: guji-王瓘-event-death
  type: death
  date: ''
  year_of: 周边
  description: 王瓘逝世，画流相率哭之；武宗元叹曰观国器之笔则不知有吴生；高克明谓今得国器画何必吴生，所谓买王得吴。
