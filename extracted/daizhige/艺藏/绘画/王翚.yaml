- id: guji-王翚-event-1
  type: career
  date: '1660'
  year_of: 1660
  summary: 廉州太守携少时王翚谒王时敏，王时敏与之论究，叹为古人复出，揄扬于名公卿间，至诎己右之；王时敏爱才若渴，四方工画者得其指授无不知名于时，王翚为其首。
- id: guji-王翚-event-2
  type: career
  date: '1680'
  year_of: 1680
  summary: 王翚画名渐盛，成名海内；同代查士标见其画爱之，延至家乞其泼墨作云西、云林、大痴、仲圭四家笔法，盖有所资取，可见其为时所推重。
