  dilemmas:
  - 家贫而艺绝，依托名公得以成艺扬名
  - 得指授于王时敏、王鉴，身负正法眼藏之托
  lesson: 得名师赏拔与己之勤勉相济，方能成一代画圣。
  summary_first_person: 我王翚石谷，海虞人，少时家贫。蒙廉州太守携我谒见王烟客先生，先生叹为古人复出，延誉公卿，屈己相推。又从王廉州游，得二王倾囊指授，周恤备至，遍摹古人真迹，遂于山水一体集其大成，虞山画派由此而立。
