  summary_first_person: 我是王蒙，号黄鹤山樵，吴兴人，赵孟頫外孙。我隐居黄鹤山中，以山水画名世，与倪瓒、吴镇、黄公望并称元四家。尝于至正辛丑与陈征君同宿僧房，焚香烹茗，图石梁秋瀑，翛然有出尘之趣。
