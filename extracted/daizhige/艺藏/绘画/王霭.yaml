person:
  qid: guji-王霭
  name_zh: 王霭
  names:
    zh: 王霭
    en: Wang Ai
  era: 五代末至北宋初
  archetype: 宫廷画家
  reign_ref: 后梁、后晋、宋太祖
  dilemmas:
  - 战乱被掠北去，失自由而技艺不废
  - 奉命微服潜写敌国重臣形貌，忠于职守而涉险
  lesson: 平静坚定、多方求变，写真与佛像皆臻其妙
  summary_first_person: 我是王霭，京师人，幼有志节，静默而留心图画，尤长写真，追学吴道子之笔，于佛像人物能尽其妙。历梁晋为翰林待诏，石晋末被耶律德光掠归北地；宋兴放还，复为待诏。艺祖欲图江南，命我微服往钟陵，潜写宋齐丘、韩熙载、林仁肇等形状以闻，受赏加等。我又奉诏于定力院写宣祖及太后御容，画大殿西壁水月观音，于景德寺九曜院后西壁画弥勒下生像。末年与孙梦卿对画开宝寺文殊阁东西两壁，梦卿以东壁让之，尊我声迹。所画毗楼勒义天王、金枪道菩萨，笔力精迈，思虑殚竭，评者谓可列神品中。
