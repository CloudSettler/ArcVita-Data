person:
  qid: guji-石涛
  name_zh: 石涛
  names:
    zh: 石涛
    en: Shitao
  lifespan:
    birth:
      date: '1642'
      precision: year
      is_circa: true
      raw: 约1642年（明崇祯十五年）
    death:
      date: '1707'
      precision: year
      is_circa: true
      raw: 约1707年（清康熙四十六年）
  birth_date: '1642'
  death_date: '1707'
  era: 清初
  reign_ref: 清康熙年间
  archetype: 叛古立我的画论宗师
  dilemmas:
  - 泥古与化古——法度为障还是为我所用
  - 说出家僧人却以'我'为本的画道是否背离传统
  lesson: 无法而法，乃为至法；搜尽奇峰打草稿。
  summary_first_person: 我是苦瓜和尚石涛，明宗室之后出家为僧。我立'一画'之法，主张'无法而法，乃为至法'，'我之为我，自有我在'。搜尽奇峰打草稿，山川与予神遇而迹化，遂成一家之言。
  source_urls:
  - guji://苦瓜和尚画语录
endeavors:
- id: guji-石涛-endeavor-1
  title_zh: 立'一画'之法，撰《苦瓜和尚画语录》
  phases:
  - key: brewing
    name_zh: 游历山川，师法造化
    labels:
      zh: 搜尽奇峰打草稿
    start_date: '1660'
    highlight_event_id: guji-石涛-event-2
  - key: breakthrough
    name_zh: 参悟一画，法自我立
    labels:
      zh: 一画开天
    start_date: '1680'
    highlight_event_id: guji-石涛-event-3
  - key: climax
    name_zh: 撰成画语录十八章
    labels:
      zh: 著述立言
    start_date: '1690'
    highlight_event_id: guji-石涛-event-4
  - key: closure
    name_zh: 晚年融字画为一体
    labels:
      zh: 兼字资任
    start_date: '1700'
  decisions:
  - date: '1680'
    title_zh: 弃门户之见，立'借古以开今'
    rationale: 憾世人泥古不化，纵逼似某家亦食残羹，故自发我之肺腑，揭我之须眉。
- id: guji-石涛-endeavor-2
  title_zh: 以诗禅入画，成山水一家
  phases:
  - key: brewing
    name_zh: 皴法因峰而生
    labels:
      zh: 峰皴合一
    start_date: '1670'
  - key: breakthrough
    name_zh: 笔墨絪缊，辟混沌手
    labels:
      zh: 混沌放光
    start_date: '1685'
  - key: climax
    name_zh: 山川脱胎于予，予脱胎于山川
    labels:
      zh: 神遇迹化
    start_date: '1695'
  - key: closure
    name_zh: 山海互居，画即诗中意
    labels:
      zh: 诗画一味
    start_date: '1705'
  decisions:
  - date: '1695'
    title_zh: 以一画测之，参天地之化育
    rationale: 得乾坤之理者山川之质，得笔墨之法者山川之饰，必获于一，一无不明则万物齐。
events:
- id: guji-石涛-event-birth
  type: 出生
  date: '1642'
  year_of: 1642
  summary: 石涛约生于1642年，明宗室之后，后出家为僧，号苦瓜和尚、大涤子。
- id: guji-石涛-event-1
  type: 死亡
  date: '1707'
  year_of: 1707
  summary: 石涛约卒于1707年，留《苦瓜和尚画语录》传世。
- id: guji-石涛-event-2
  type: 事业
  date: '1660'
  year_of: 1660
  summary: 青年石涛漫游山川，直面真山真水，痛斥方隅之识拘于一峰一山，始蓄'搜尽奇峰打草稿'之志。
- id: guji-石涛-event-3
  type: 事业
  date: '1680'
  year_of: 1680
  summary: 立'一画'之法——一画者，众有之本，万象之根；以无法生有法，以有法贯众法，画从心而障自远。
- id: guji-石涛-event-4
  type: 事业
  date: '1690'
  year_of: 1690
  summary: 撰成《苦瓜和尚画语录》十八章，自一画章至资任章，系统提出'无法而法，乃为至法'，'我之为我，自有我在'。
- id: guji-石涛-event-5
  type: 事业
  date: '1695'
  year_of: 1695
  summary: 自述五十年来脱胎于山川之悟：'山川使予代山川而言也，山川脱胎于予也，予脱胎于山川也'，画道与造化神遇迹化。
- id: guji-石涛-event-6
  type: 事业
  date: '1700'
  year_of: 1700
  summary: 晚年著兼字、资任诸章，论字画一体：'一画者，字画先有之根本也'，以墨海抱负、笔山驾驭，广其用于八极九土。
