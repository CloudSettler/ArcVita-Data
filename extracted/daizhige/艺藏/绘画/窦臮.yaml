    title_zh: 以亲见者为限，不凭传搨虚名
    rationale: 所言并今朝自武德以来迄于乾元之始翰墨之妙可入品流者咸亦书之；其所不覩、空居名额并世所传搨者不敢凭推一皆略焉
  - date: '0742'
    title_zh: 于赋末系署证、印记、征求宝玩诸家名录
    rationale: 品题叙述极精核，印记一章兼画印模于句下，为后世著录之祖
  - date: '0742'
    title_zh: 因卷帙稍重分为上下两篇
    rationale: 上篇自上古至南北朝，下篇自唐代迄其兄窦蒙，文与上篇相属，分而为二
