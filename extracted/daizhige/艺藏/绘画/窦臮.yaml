      raw: 卒年无考，文成于天宝年间
  birth_date: ''
  death_date: ''
  era: 唐
  reign_ref: 天宝、至德、乾元
  archetype: 书法家·书论家
  dilemmas:
  - 安史之乱后御府法书散坠，目睹名迹流落而恨深草莽、上达无阶
  - 亲见真迹与世传搨本真伪难辨，取舍须凭目验而非虚名
  lesson: 品鉴书画当亲瞩目验、直道公论，勿贱目而贵耳
  summary_first_person: 我窦臮字灵长，扶风人，官至检校户部员外郎、宋汴节度参谋。天宝之末国有寇难，府库倾覆，法书散坠闾阎，我在至德中往往偶见前贤真迹，遂记前后亲见者，自上古史籀、李斯，迄于唐代乾元之始，凡一十三代一百九十八人，撰成《述书赋》二卷，品题叙述务求精核，兼记署证、印记、征求宝玩之家，以寄翰墨之妙、直道之论。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=934460
