    rationale: 为文名与笔墨所重，继受新聘
events:
- id: guji-童珏-event-birth
  type: birth
  description: 童珏生于会稽，年月未载
- id: guji-童珏-event-refuse-exam
  year_of: 二十余岁
  type: career
  description: 年二十余未尝应童子试；郡守倩人劝使就试，特置榜首，及学使按临，仍托病不出
- id: guji-童珏-event-plum-style
  type: career
  description: 画梅学宋人杨无咎，花蕊不繁，枝干屈蟠，微见横斜之致，得梅之神韵
- id: guji-童珏-event-thousand-works
  year_of: 求之辄应，数十年间
  type: career
  description: 无论巨帧尺幅，求之辄应，墨迹遍天下，画竟必题咏刻印，署'万幅梅花万首诗'，诗不盗袭前人不雷同己作
- id: guji-童珏-event-yu-zhi
  type: career
  description: 豫省抚军数千里外走书币聘修省志，解维将发犹抒纸篷窗写'暗香疏影'以偿夙逋
- id: guji-童珏-event-jiangzuo
  year_of: 豫志毕
  type: career
  description: 复就江左抚军之聘，入志馆修志
- id: guji-童珏-event-death
  year_of: 应江左之聘后未几
  type: death
  description: 卒于维阳志馆
