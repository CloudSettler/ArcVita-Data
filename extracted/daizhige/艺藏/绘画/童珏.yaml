person:
  qid: guji-童珏
  name_zh: 童珏
  names:
    zh: 童珏
    en: Tong Jue
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 未载
    death:
      date: 维阳志馆卒，年月未载
  era: 清代
  reign_ref: 乾隆年间（据同篇余集登乾隆丙戌科推断）
  archetype: 孤高画士
  dilemmas:
  - 郡守劝试置榜首，是否出仕
  - 数千里受聘修省志与隐逸自适之间的取舍
  lesson: 不求闻达而艺自传，画就题诗，万幅梅花万首诗
  summary_first_person: 我名珏，字璞岩，号二树，会稽名士。博闻强记，工书善画，尤长于梅，画成必题咏，自署"万幅梅花万首诗"。年二十余不应童子试，郡守特置榜首亦托病不出。后应豫省抚军之聘修省志，志毕复受江左抚军之聘，卒于维阳志馆。
