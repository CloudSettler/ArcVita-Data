  dilemmas:
  - 身入仕途而心向艺林，画禅与功名难以两全
  lesson: 言情理确、深入画禅者，其言说可垂之后世
  summary_first_person: 我笪重光，丹徒人，字在辛，自号江上外史。顺治壬辰成进士，官至佥都御史。我深思画理，撰《画筌》一篇，言情理确，为艺林所珍。后人汤贻汾分其目为十则而析览之，使拙篇得与《书谱》并传。
  source_urls:
