  summary_first_person: 我是米友仁，米芾之子，世称米元晖。我承家学而以水墨云山自成一格，寓“墨戏”于潇湘奇趣；居京口时观北固烟云变态，悟得“宿雨初霁、晓烟未泮”正是吾家粉本，并曾鉴定先臣米芾真迹恭进内府。
