    en: Cangjie
  lifespan:
    birth:
      date: '-2697'
      precision: year
      is_circa: true
      raw: 黄帝之史，上古时代
  birth_date: 约-2697
  era: 上古黄帝时代
  reign_ref: 黄帝
  archetype: 文字创造者·史官
  dilemmas:
  - 结绳纪事不足以载道，文字未创而天地幽秘难通
  - 集众美而造六书，须博采众象、仰观俯察方成一体
  lesson: 仰观奎星之象、俯察鸟迹之奇，博采众美乃能通天地之幽秘，为百王之宪章。
  summary_first_person: 我是苍颉，黄帝之史，亦称皇颉，姓侯刚氏，首有四目，通于神明。我仰观奎星屈曲之象，俯察龟文鸟迹之奇，博采众美，与沮诵广伏牺之文而造六书，是为古文。后世学书者祭我不绝，李斯、叔孙通皆尝识我藏书台上之字。
  source_urls:
  - https://www.sikuquanshu.com/衍极
