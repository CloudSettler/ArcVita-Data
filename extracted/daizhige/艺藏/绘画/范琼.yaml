  archetype: 寺壁佛画师
  dilemmas:
  - 会昌法难毁尽诸寺壁画，独存大圣慈一寺，后又两遇兵火，笔踪屡经存亡
  lesson: 同题材而形状无一相同，以无穷变貌成就蜀中佛画之冠
  summary_first_person: 我范琼，不知何许人，开成年与陈皓、彭坚同寓蜀城，三人同手画诸寺佛像天王。会昌除毁后独存大圣慈寺笔迹，宣宗再兴佛寺，自大中至乾符于四寺图画二百余间墙壁，名目虽同而形状无一相类，虽经兵火，圣寿、圣兴两寺佛僧犹为我亲描见存。
  source_urls:
  - https://zh.wikisource.org/wiki/益州名畫錄
