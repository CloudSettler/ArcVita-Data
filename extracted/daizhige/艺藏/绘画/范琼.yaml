  note: 淳化五年、咸平三年两遇兵火，大圣慈、圣寿、圣兴三寺画壁见存
- id: guji-范琼-event-5
  date: '860'
  year_of: 860
  title_zh: 咸通年绘圣兴寺西方一堵，精妙之极；刍瑟磨像设色未半而终莫能继
  note: 其中西方一堵甚著奇工；两堵设色未半，笔踪俨然，后之妙手不能续
