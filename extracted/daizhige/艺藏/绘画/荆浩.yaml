  dilemmas:
  - 逢乱世而弃仕途，退藏于太行洪谷，以艺自适
  - 不附权贵、自号洪谷子，以笔墨立德立言
  lesson: 逢乱世不仕，隐于洪谷，以山水笔墨自成一家，著述传世。
  summary_first_person: 我是荆浩，字浩然，河南沁水人，业儒博通经史。五季多故，我退藏不仕，隐于太行洪谷，自号洪谷子，画山水树石以自适，著《山水诀》，门生关同最知名。
  source_urls:
  - https://example.org/guji/wudai-minghua-jianwen
