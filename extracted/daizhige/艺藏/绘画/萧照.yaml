  lesson: 慕贤弃旧业，追随名师终成画院之才
  summary_first_person: 世传我是建业人，颇知书，亦善画。靖康中中原兵火，我流入太行山为盗。一日群贼掠到李唐，检其行囊唯粉奁画笔，方知其姓氏。我素闻唐名，即辞群贼，随唐南渡得以亲炙。唐感我生全之恩，尽以所能授我，后我补入画院，笔法潇洒超逸。
