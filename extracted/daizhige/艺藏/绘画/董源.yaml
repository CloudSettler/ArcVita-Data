- id: guji-董源-event-early
  date: 0930
  year_of: 0930
  title_zh: 早年画多矾头
  description_zh: 《画鉴》称"蚤年矾头颇多"，山石多作麻皮皴。
- id: guji-董源-event-breakthrough
  date: 0950
  year_of: 0950
  title_zh: 暮年一洗旧习
  description_zh: 汤垕评其晚年画风改变，平淡多姿。
- id: guji-董源-event-climax
  date: 0960
  year_of: 0960
  title_zh: 收藏家秘府递传其真迹
  description_zh: 汤垕于秘府见春龙出蛰图、孔子哭虞丘子图、春山图、溪岸图、秋山图，人间约见二十本，皆其平生得意合作；夏山图今在史崇文家。
- id: guji-董源-event-closure
  date: '1300'
  year_of: 1300
  title_zh: 米芾、汤垕定评其画史地位
  description_zh: 米芾评"天真烂漫，平淡多姿，唐无此品"；汤垕谓宋画家山水超绝唐世者，李成、董源、范宽三人，董源得山之神气。
- id: guji-董源-event-death
  date: 0962
  year_of: death
  title_zh: 董源去世（约）
  description_zh: 卒于南唐末、宋初之际，具体年份不详。
