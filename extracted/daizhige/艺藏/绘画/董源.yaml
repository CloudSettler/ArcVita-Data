  era: 五代至宋初（南唐）
  reign_ref: 南唐
  archetype: 山水画家
  dilemmas:
  - 其画乱真者多，真迹难辨，鉴赏家以笔墨气韵推求之
  lesson: 山水至宋始备，董源得山之神气，平淡天真而不失古意，为百代师法。
  summary_first_person: 我名董源（亦作董元），南唐画家。山水有二种：一水墨矾头疏林远树平远幽深，山石作麻皮皴；一着色皴纹甚少，用色秾古。早年矾头颇多，暮年一洗旧习。米元章谓我天真烂漫、平淡多姿，唐无此品。汤君载平生见我真迹约二十本，皆得意合作。
  source_urls:
  - https://zh.wikisource.org/wiki/畫鑒
