person:
  qid: guji-董逌
  name_zh: 董逌
  names:
    zh: 董逌
    en: Dong You
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 约北宋中后期（生年不详）
    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详
  era: 北宋
  reign_ref: 崇宁、宣和年间
  archetype: 考据鉴赏家
  dilemmas:
  - 封禅之礼不见于经，诸儒杂取秦汉之制而未能超度汉唐、复归三代
  - 神仙异闻之图流传于世，儒学者不道，然不可谓世无此事
  lesson: 考据赏鉴当引据精核、考合经义，方可辨名物之失、正传流之误。
  summary_first_person: 我董逌，北宋考据赏鉴之学者，与黄伯思齐名，撰《广川画跋》六卷。我官于麟台秘阁，屡曝书观画，考订封禅、望仙、千角鹿诸图，引据经史，虽偶有小疵，而精核为世所称。
  source_urls:
  - 钦定四库全书·子部·艺术类一·广川画跋提要
endeavors:
- id: guji-董逌-endeavor-1
  name_zh: 撰《广川画跋》六卷
  labels:
    zh: 考据著述
  phases:
  - key: brewing
    name_zh: 秘阁观画蓄积题跋
    labels:
      zh: 秘阁考画
    start_date: 1104
    highlight_event_id: guji-董逌-event-fengchan
  - key: climax
    name_zh: 崇宁宣和间考据题跋成篇
    labels:
      zh: 精核考据
    start_date: 1106
    highlight_event_id: guji-董逌-event-yufeng
  - key: closure
    name_zh: 书成传世，元至正间孙道明钞录，乾隆间入四库
    labels:
      zh: 书成流传
  decisions:
  - date: 1104
    title_zh: 就秘阁封禅图作文，辨秦汉封禅之制不合六经
    rationale: 封禅告成为大礼，然不见于经，诸儒不能深究，故考图立义以正之。
  - date: 1105
    title_zh: 为东丹王千角鹿图定名，录异闻以备顾问
    rationale: 诏秘阁收画，使者疑其状求其说，当得名以自解。
  - title_zh: 考武皇望仙图实为唐武宗仙乐图，正其名失
    rationale: 旧传汉武帝会西王母，然以画与史考之，实会昌间佞邪荧惑之迹，当为后王龟鉴。
events:
- id: guji-董逌-event-birth
  type: birth
  name_zh: 董逌诞生
  detail: 生年不详，北宋人也。
- id: guji-董逌-event-death
  type: death
  name_zh: 董逌辞世
  detail: 卒年不详。
- id: guji-董逌-event-fengchan
  type: endeavor
  date: 1104
  year_of: 1104
  name_zh: 曝书石渠，观大中祥符元年封禅图而作书
  detail: 秘阁曝书，发奁出封禅图，考其杂取秦汉之制，叹礼书不备、诸儒拘执。
- id: guji-董逌-event-luhua
  type: endeavor
  date: 1105
  year_of: 1105
  name_zh: 诏下秘阁收东丹王李赞华千角鹿图
  detail: 崇宁四年诏收其画，使者疑其状求其说，董逌引据杂俎、华阳志诸书以定名。
- id: guji-董逌-event-yufeng
  type: endeavor
  date: 1106
  year_of: 1106
  name_zh: 崇宁五年画学试列子御风图，董逌书图上论其旨
  detail: 官试画学生，疏出本文为目；翌日有持古画者，众叹得画中县解，逌因示众论御风之义。
