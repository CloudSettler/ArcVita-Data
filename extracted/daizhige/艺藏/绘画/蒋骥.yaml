person:
  qid: guji-蒋骥
  name_zh: 蒋骥
  names:
    zh: 蒋骥
    en: Jiang Ji
  life_span:
    birth:
      precision: unknown
      is_circa: false
      raw: 不详
    death:
      precision: unknown
      is_circa: false
      raw: 不详
  era: 清代（国朝）
  reign_ref:
  - 康熙
  - 雍正
  - 乾隆
  archetype: 画家·写真理论家
  dilemmas:
  - 书艺不及其父蒋衡，转而专攻人物写真，另辟一艺成名
  - 传统观念视写真为匠人技艺、非士大夫之艺，力倡其学理价值
  lesson: 不盲目贵远贱近，专精一艺、研析精微，方能补古人所未备，自成一家
  summary_first_person: 我是蒋骥，字赤霄，号勉斋，金坛人。我书法不及父亲蒋衡，却专攻人物写真之法，撰《传神秘要》一卷，凡二十七目，将布局取势、运笔设色的心得一一详述，欲使写真之法列为可传之学。
  source_urls:
  - source: 《四库全书总目提要·子部·艺术类·传神秘要》
endeavors:
- id: guji-蒋骥-endeavor-1
  name_zh: 撰写《传神秘要》
  description: 系统总结人物写真之法，凡分二十七目，于布局取势、运笔设色皆抒心得，研析精微，标举格例，补古人所未备。
  phases:
  - key: brewing
    name_zh: 承家学而别攻写真
    labels:
      zh:
      - 家学
      - 写真
    highlight_event_id: guji-蒋骥-event-1
  - key: breakthrough
    name_zh: 撰成《传神秘要》
    labels:
      zh:
      - 著述
      - 二十七目
    highlight_event_id: guji-蒋骥-event-2
  - key: climax
    name_zh: 名以写真
    labels:
      zh:
      - 以写真名
    highlight_event_id: guji-蒋骥-event-3
  decisions:
  - title_zh: 专攻写真而非书法
    rationale: 书不逮父，而特以写真名，遂以肖像画法为终身所诣
  - title_zh: 以写像之法勒为一书
    rationale: 王绎《写像秘诀》外鲜有著述，丹青之家多以口诀相传，故研析精微、标举格例以补其阙
- id: guji-蒋骥-endeavor-2
  name_zh: 家传书学与《十三经》进呈
  description: 其父蒋衡（字湘帆，后改名振生）以书法名一时，手写《十三经》于乾隆五年呈进内府，特赐国子监学正衔；蒋骥承其家学。
  phases:
  - key: brewing
    name_zh: 家学熏陶
    labels:
      zh:
      - 金坛蒋氏
      - 书法
    highlight_event_id: guji-蒋骥-event-1
  decisions:
  - title_zh: 由书学转入画学
    rationale: 父以书名，己书不逮父，遂取径写真独树一帜
