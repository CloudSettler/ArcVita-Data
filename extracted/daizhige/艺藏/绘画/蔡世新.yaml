person:
  qid: guji-蔡世新
  name_zh: 蔡世新
  names:
    zh: 蔡世新
    en: Cai Shixin
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 明代，生卒年不详
    death:
      precision: unknown
      is_circa: true
      raw: 明代，生卒年不详
  era: 明代
  reign_ref: 明正德、嘉靖间（据王守仁镇虔时期推断）
  archetype: 画家
  dilemmas:
  - 客观限制：王文成公两颧棱峭，正面难写其真，众史多不当意
  - 破局抉择：随众史入见而甘居侧旁，以一侧相取神，需舍正取侧方得神似
  lesson: 识势取巧，从别侧视角逼近本真；艺之至者，不在正面死攻，而在另一角度见其所不见。
  summary_first_person: 我蔡世新，号少壑，赣县人，以写照见长。当年王文成公镇守虔州，召众画史写真，众人皆不得要领——只因公两颧棱峭，正面实在难写。我年少时随师进见，独自在旁取一侧面的角度相之，竟得其神似，自此名声大起。我也善钩勒竹，大幅尤佳，兼画美人。
