  dilemmas:
  - 官私收藏名迹真伪混杂，需鉴别谨守，恐以伪充真贻误后人
  - 待诏于汉王李元昌门下讨论画艺，序文须兼顾王府与公私著录之公心
  lesson: 存录必考真迹、明源流，方使千载丹青之学有所归依
  summary_first_person: 我是唐贞观年间的裴孝源，受汉王元昌之命，遍检秘府、佛寺并私家所蓄魏晋以来画迹，考其品格高下，撰成《贞观公私画录》，起自高贵乡公，终于贞观十三年，存二百九十八卷、屋壁四十七所，且严辨真伪，恐时人强题名氏、以伪乱真。
