  era: 北宋
  reign_ref: 宋徽宗朝前后
  archetype: 宗室文人画家
  dilemmas:
  - 身为贵胄而被讥所见不出京洛五百里，不能远游以广画境
  - 精研绘画却感“艺之役人”，得文名后为应酬所困、无少暇时
  lesson: 意所专习，度越流俗；虽拘于见闻，仍每图必出新意
  summary_first_person: 我是赵令穰，字大年，宋宗室，官光州防御使。少读杜诗慕毕宏、韦偃之迹，师而写之，不数月便逼真，时贤称叹。我作小轴甚清丽，雪景类王维笔意，汀渚水鸟有江湖意；又学东坡作小山丛竹。然所画不出京洛五百里之景，人戏谓“此必朝陵一番回矣”。既得名而诛求无已，掷笔叹“艺之役人如此”。
  source_urls:
  - 画继·卷二
