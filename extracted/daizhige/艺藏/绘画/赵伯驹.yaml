  birth_date: 约1120年（生年不详，推测）
  death_date: 不详（“享寿不永”，卒年未知）
  era: 南宋
  reign_ref: 宋高宗建炎至绍兴年间
  archetype: 宗室画家
  dilemmas:
  - 随驾南渡、流寓钱唐，幸免北迁之难，身份困顿而待机遇
  - 画艺雅洁却因寿短职卑，遗迹传世绝少
  lesson: 身逢乱世而以才艺自见，一扇之画可动天听；然寿之修短，非才可挽。
  summary_first_person: 我赵伯驹，字千里，宋太祖七世孙。建炎年间随驾南渡，流寓钱唐。善青绿山水，图写人物雅洁异常。尝与士友画扇，偶为宦官张太尉所见，奏呈高宗。上怜我乃太祖诸孙，幸逃北迁之难，遂并吾弟远召见，每称为王侄。仕至浙东兵马钤辖，惜享寿不永，终于此官，故遗迹于世绝少。
