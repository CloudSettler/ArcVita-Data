person:
  qid: guji-赵光辅
  name_zh: 赵光辅
  names:
    zh: 赵光辅
    en: Zhao Guangfu
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: unknown
      is_circa: true
      raw: 卒年不详
  era: 北宋太宗朝
  reign_ref: 宋太宗在位期间（976—997）
  archetype: 隐逸画家
  dilemmas:
  - 居图画院学士之职而性喜幽旷，不慕仕进，最终潜自遁去
  - 艺名显赫授以官秩，与淡泊自处之志相互冲突
  lesson: 技进乎道者不必借官爵自重，弃官独往而艺名更彰。
  summary_first_person: 我赵光辅是耀州华原人，当太宗朝任职图画院学士。我生性喜好幽静旷达，没有仕进之意，后来悄悄离开了画院，乡人还记得我这个旧头衔，称我"赵评事"。我长于画人物与蕃马，曾客居许昌开元寺，画腾竺法兰以传教像，皆长丈余，慈觉悲悯之相尽备；又画五百高僧，资质风度互有意思，坐立瞻听皆得其妙。刘道醇评我"放而逸，约而正，形气清楚，骨格厚重"，人物门列我为神品下，畜兽门更以我为神品一人。
  source_urls:
  - 钦定四库全书·子部·宋朝名画评（刘道醇撰）
