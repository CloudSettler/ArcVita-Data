person:
  qid: guji-zhao-qimei
  name_zh: 赵琦美
  names:
    zh: 赵琦美
    en: Zhao Qimei
  lifespan:
    birth:
      precision: unknown
      is_circa: false
    death:
      precision: unknown
  era: 明代
  reign_ref: 万历
  archetype: 编纂家·书画鉴藏家
  dilemmas:
  - 原本题朱存理撰，然据跋语考订实为无名氏残稿所编，存档题名与考据结论相冲突
  - 两本互有详略，卷帙不同，须取舍增补定其先后次序
  lesson: 考据求真——宁改旧题以存实，不袭谬说以传信
  summary_first_person: 我是常熟赵琦美，万历间先从秦四麟家得《铁网珊瑚》书品、画品各四卷，后又从焦竑处得一残本，卷帙较多，遂两本互校，增为书品十卷、画品六卷，定其先后次序，并以所见真迹续于卷后。虽原本无撰人姓名，旧题朱存理撰实误，然书中所载书画诸跋足以辨析异同、考究真伪，至今赏鉴家多引据之。
