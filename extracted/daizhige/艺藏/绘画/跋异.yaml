  archetype: 恃艺自负而屡经胜负的画家
  dilemmas:
  - 恃才自负，遇强敌张图当众折服，画名受损
  - 再遇李罗汉挑战，胜与败皆关乎名誉存亡
  lesson: 骄矜易挫，胜负无常；艺无止境，容人方能存己。
  summary_first_person: 我跋异，汧阳人，眉目疏秀，性沉厚而善画佛道鬼神及大像。我曾自恃画艺，在洛阳广爱寺募画时傲视张图，不料他当场挥笔成神，我惭愧退让，洛下遂有讥我之谣。后来福先寺请我画护法善神，李罗汉来与我西壁对画角技，我竭精贮思，画出一神，侍从严毅、设色鲜丽，为平生所未有。李氏纵观我画，自觉精妙远不及我，竟羞愧自缢，我草葬之于城北僧园。昔败于张将军，今取捷于李罗汉，我以妙品传世。
  source_urls:
  - https://zh.wikisource.org/wiki/五代名画补遗
