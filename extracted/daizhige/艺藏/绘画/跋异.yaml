events:
- id: guji-跋异-event-1
  date: '921'
  year_of: '921'
  name_zh: 广爱寺夺壁之争，张图挥笔折服跋异
  description: 洛阳广爱寺沙门义暄置金币邀四方奇笔画三门两壁。处士跋异方草定画样，张图立于其后求为赞贰。跋异傲然拒之，授朽木大笔于图。图投朽木于地，搦管挥写，倏忽成折腰报事师者，从以三鬼。异瞪目踧踖，惊拱而问：'子岂非张将军乎？'遂雍容致谢，引退还让，图遂专其功。洛下谣曰："赫赫洛下，唯说异画。张氏出头，跋异无价。"
  participants:
  - guji-跋异
  - guji-张图
  location: 洛阳广爱寺
  sources:
  - https://zh.wikisource.org/wiki/五代名画补遗
- id: guji-跋异-event-2
  date: '923'
  year_of: '923'
  name_zh: 福先寺与李罗汉对画护法善神
  description: 福先寺请跋异画大殿护法善神。异方朽约，滑台人李氏自称李罗汉，来与对画角其拙巧，以沽名誉。异恐如张图者再现，遂固让西壁与之。异竭精贮思，意与笔会，屹成一神，侍从严毅，又设色鲜丽，尽平生之功。时京洛士人争来品藻。
  participants:
  - guji-跋异
  - guji-李罗汉
  location: 洛阳福先寺
  sources:
  - https://zh.wikisource.org/wiki/五代名画补遗
- id: guji-跋异-event-3
  date: '923'
  year_of: '923'
  name_zh: 李罗汉自惭自缢，跋异草葬之
  description: 李氏纵观异画，见其精妙入神，非己所及，遂手足失措。时人谣曰："李生来，跋君怕，不意今日却增价，不画罗汉画驼马。"异夸咤曰："昔见败于张将军，今取捷于李罗汉。"李深有怍色，倏起如厕，久而不出，已自缢于步檐下。异遂藁葬之于城北之僧园。
  participants:
  - guji-跋异
  - guji-李罗汉
  location: 洛阳福先寺
  sources:
  - https://zh.wikisource.org/wiki/五代名画补遗
