  era: 南宋
  reign_ref: 宋孝宗乾道年间（1165－1173）
  archetype: 画史著述家
  dilemmas:
  - 家藏名画在战乱中多遭焚劫，欲存录遗存而不胜唏嘘
  - 承郭若虚《图画见闻志》之后，熔铸二百余载画人事迹而不敢妄定品第
  lesson: 人品既高，气韵不得不高；气韵既高，生动不得不至。
  summary_first_person: 我是邓椿，字公寿。鉴于郭若虚《图画见闻志》止于熙宁七年，其后九十四年间画者众而无记载，遂稽之方册、益以见闻，撰《画继》十卷，自乾道上溯若虚所止之年，凡二百一十九人，并立轩冕、岩穴二门以寓气韵出于人品之微意。
