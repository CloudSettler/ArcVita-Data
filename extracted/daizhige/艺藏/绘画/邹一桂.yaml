  lesson: 以万物为师，以生机为运，格物以致知，方能艺进于道
  summary_first_person: 我是邹一桂，字小山，号让乡，无锡人。雍正丁未进士，官至礼部侍郎。我工花卉，得恽寿平法，撰《小山画谱》，立八法四知之说，又承诏画内廷洋菊三十六种而撰《洋菊谱》以志荣遇。
