    title_zh: 以书理入画理，衣纹林木用笔全类于书
    rationale: 画衣纹勾绰纵掣、理无妄下，须以书法笔意状高侧深斜、卷折飘举之势。
events:
- id: guji-郭忠恕-event-birth
  date: 0912
  year_of: 912
  type: birth
  title_zh: 郭忠恕约生于五代初年
  description: 郭忠恕，字恕先，生于五代乱世，性纵逸不羁，博通经史文字。
- id: guji-郭忠恕-event-1
  date: 0960
  year_of: 960
  type: endeavor
  title_zh: 入宋为界画名家
  description: 宋初，郭忠恕与王士元之流以屋木界画著称，画楼阁多见四角，斗拱逐铺作为，向背分明，不失绳墨，为世楷模。
- id: guji-郭忠恕-event-2
  date: 0965
  year_of: 965
  type: endeavor
  title_zh: 书画兼精，用笔同法
  description: 其画衣纹林木用笔全类于书，既精小学训诂，又以书法笔意入界画，被誉为国初名手。
- id: guji-郭忠恕-event-death
  date: 0977
  year_of: 977
  type: death
  title_zh: 郭忠恕卒于太平兴国二年
  description: 因言行忤旨贬谪流放，卒于道中，其界画遗迹传于后世。
