person:
  qid: guji-郭忠恕
  name_zh: 郭忠恕
  names:
    zh: 郭忠恕
    en: Guo Zhongshu
  lifespan:
    birth:
      date: 0912
      precision: decade
      is_circa: true
      raw: 约五代初年
    death:
      date: 0977
      precision: year
      is_circa: false
      raw: 太平兴国二年（977）卒
  birth_date: 0912
  death_date: 0977
  era: 五代末至北宋初
  reign_ref: 宋太宗太平兴国年间
  archetype: 界画大家与文字学家
  dilemmas:
  - 生当乱世、历经五代更迭，才学高绝而性情纵逸放达，终因言行忤旨获罪流放
  - 精研文字与屋木界画，然世多以小技视之，而其艺实能与六籍同功
  lesson: 界画屋木须“折算无亏、向背分明、不失绳墨”，规矩法度之中方见壮丽闲雅之意；艺之精者，不在趋时而在守正。
  summary_first_person: 我郭忠恕，经五代入宋，以文字学精深、兼善屋木界画知名。我画楼阁，多见四角，斗拱逐铺为之，向背分明，不失绳墨，为国初界画楷模。
  source_urls:
  - https://zh.wikisource.org/wiki/圖畫見聞志
