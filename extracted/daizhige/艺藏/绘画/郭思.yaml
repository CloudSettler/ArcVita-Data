person:
  qid: guji-郭思
  name_zh: 郭思
  names:
    zh: 郭思
    en: Guo Si
  lifespan:
    birth:
      precision: unknown
      is_circa: false
      raw: 生年不详，北宋后期人
    death:
      precision: unknown
      is_circa: false
  era: 北宋
  reign_ref: 元丰五年进士；仕至徽猷阁待制
  archetype: 官员文人·画论纂述者
  dilemmas:
  - 仕宦之业与承传父艺纂集画学之志如何兼顾
  - 述父之词与自抒己见如何在一编之中相区分
  lesson: 随闻随记、收拾纂集，不成失坠，方能使家学传于后世、贻之同好
  summary_first_person: 我是郭思，字得之，河南温县人，画家郭熙之子。我丱角时侍先子游泉石，每闻画山水之说，旋即笔记；元丰五年登进士第，官至徽猷阁待制、秦凤路经略安抚使。我将平日所记收拾纂集为《林泉高致集》，又先纂《山水诀纂》，以述先子平生讲论，用贻同好。
  source_urls:
  - https://zh.wikisource.org/wiki/林泉高致集
