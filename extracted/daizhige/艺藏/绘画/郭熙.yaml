person:
  qid: guji-郭熙
  name_zh: 郭熙
  names:
    zh: 郭熙
    en: Guo Xi
  lifespan:
    birth:
      date: '1000'
      precision: year
      is_circa: true
      raw: 约北宋中期
    death:
      date: '1090'
      precision: year
      is_circa: true
      raw: 约北宋元祐年间
  birth_date: 约1000年
  death_date: 约1090年
  era: 北宋
  reign_ref: 宋神宗、宋哲宗时期
  archetype: 山水画宗师与画论家
  dilemmas:
  - 出处两难：既怀林泉之志，又处太平盛日、君亲之心两隆，须在仕隐之间求其本意
  - 承袭与自立：专门之学自古为病，须兼收并览而不局于一家
  - 惰气昏气之戒：作图意不欲则委下不顾，须以明窗净几、心神闲定而后落笔
  lesson: 莫神于好，莫精于勤，莫大于饱游饱看；林泉之心临之，则画意自高。
  summary_first_person: 我郭熙，宋世山水画手也。我论山水有可行可望可游可居之品，谓画者当夺造化，须饱游饫看，历历罗列于胸中；落笔必注精神，严重恪勤，如见大宾。山形步步移而面面看，四时朝暮阴晴各异其态，故一山兼百数十山之意状也。
  source_urls:
  - 六如居士画谱（明·唐寅辑）卷一
endeavors:
- id: guji-郭熙-endeavor-1
  name_zh: 山水画创作与画论著述
  phases:
  - key: brewing
    name_zh: 游历名山，饱游饫看
    labels:
      zh:
      - 师法造化
      - 兼收并览
    start_date: '1020'
    highlight_event_id: guji-郭熙-event-1
  - key: breakthrough
    name_zh: 山水画艺大成
    labels:
      zh:
      - 营丘范宽之外自成一格
    start_date: '1060'
    highlight_event_id: guji-郭熙-event-2
  - key: climax
    name_zh: 阐明画理，确立山水之法
    labels:
      zh:
      - 三远四时
      - 大山堂堂
    start_date: '1070'
    highlight_event_id: guji-郭熙-event-3
  - key: closure
    name_zh: 画训画意传世
    labels:
      zh:
      - 林泉高致
    start_date: '1080'
    highlight_event_id: guji-郭熙-event-4
  decisions:
  - date: '1070'
    title_zh: 提出可游可居为山水画本意
    rationale: 可行可望不如可游可居之为得，君子渴慕林泉正谓佳处，画者当以此意造，鉴者以此意品。
  - date: '1075'
    title_zh: 立落笔四戒
    rationale: 不注精则神不专，不以轻心挑之、慢心忽之，故明窗净几、焚香盥手，如见大宾而后为之。
- id: guji-郭熙-endeavor-2
  name_zh: 观察之法与画山水之体的总结
  phases:
  - key: brewing
    name_zh: 体察真山水
    labels:
      zh:
      - 远望取势
      - 近看取质
    start_date: '1030'
    highlight_event_id: guji-郭熙-event-5
  - key: breakthrough
    name_zh: 步移面看之说
    labels:
      zh:
      - 山形步步移
      - 山形面面看
    start_date: '1065'
    highlight_event_id: guji-郭熙-event-6
  - key: climax
    name_zh: 四时烟岚之论
    labels:
      zh:
      - 春山如笑
      - 夏山如滴
      - 秋山如妆
      - 冬山如睡
    start_date: '1075'
    highlight_event_id: guji-郭熙-event-7
  - key: closure
    name_zh: 景外意与意外妙
    labels:
      zh:
      - 景外意
      - 意外妙
    start_date: '1085'
    highlight_event_id: guji-郭熙-event-8
  decisions:
  - date: '1080'
    title_zh: 主张画见大象、不为刻画之迹
    rationale: 画见大象而不为斩刻之形，则云气之态度活；见大意而不为刻画之迹，则烟岚之气象正。
events:
- id: guji-郭熙-event-birth
  person_id: guji-郭熙
  title_zh: 郭熙出生
  date: '1000'
  year_of: 1000
  era: 北宋
  summary: 约生于北宋中期，河阳温县人，后世称郭河阳。
- id: guji-郭熙-event-death
  person_id: guji-郭熙
  title_zh: 郭熙去世
  date: '1090'
  year_of: 1090
  era: 北宋
  summary: 约卒于哲宗元祐年间，画论画迹并传于世。
- id: guji-郭熙-event-1
  person_id: guji-郭熙
  title_zh: 饱游饫看天下名山巨镇
  date: '1020'
  year_of: 1020
  era: 北宋
  summary: 嵩多好溪，华多好峰，泰山好主峰；欲夺造化，莫神于好，莫精于勤，莫大于饱游饱看。
- id: guji-郭熙-event-2
  person_id: guji-郭熙
  title_zh: 自成一家，兼收并览
  date: '1060'
  year_of: 1060
  era: 北宋
  summary: 谓专门之学自古为病，齐鲁之士难摹营丘，关陕之士难摹范宽，须广议博考，不局于一家。
- id: guji-郭熙-event-3
  person_id: guji-郭熙
  title_zh: 提出“山形步步移、面面看”之法
  date: '1070'
  year_of: 1070
  era: 北宋
  summary: 山每远每异、每看每异，一山而兼百数十山之形状意态；春夏秋冬、朝暮阴晴之景不同。
- id: guji-郭熙-event-4
  person_id: guji-郭熙
  title_zh: 作画训画意诸篇，立看画之体
  date: '1080'
  year_of: 1080
  era: 北宋
  summary: 谓山水大物，鉴者须远观方见一障山川形势气象；以林泉之心临之则价高，以骄侈之目临之则价低。
- id: guji-郭熙-event-5
  person_id: guji-郭熙
  title_zh: 论真山水川谷岩石云气之异
  date: '1030'
  year_of: 1030
  era: 北宋
  summary: 川谷远望取其深、近游取其浅；岩石远望取其势、近看取其质；云气四时不同。
- id: guji-郭熙-event-6
  person_id: guji-郭熙
  title_zh: 授学画之诀
  date: '1065'
  year_of: 1065
  era: 北宋
  summary: 学画花者置之深坑而瞰之，学画竹者取影于素壁；学画山水亦如神游物象，身即烟霞。
- id: guji-郭熙-event-7
  person_id: guji-郭熙
  title_zh: 界定山水之大体
  date: '1075'
  year_of: 1075
  era: 北宋
  summary: 山大物也，欲耸拔浑厚雄豪；水活物也，欲静深汪洋回环；山以水为血脉、草木为毛发、烟云为神采。
- id: guji-郭熙-event-8
  person_id: guji-郭熙
  title_zh: 阐发画之景外意、意外妙
  date: '1085'
  year_of: 1085
  era: 北宋
  summary: 看画令人生此意，如真在山中；见青烟白道而思行，见幽人山阁而思居，此画之景外意也。
