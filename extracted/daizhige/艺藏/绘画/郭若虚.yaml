  archetype: 书画著录家
  dilemmas:
  - 家藏书画在诸族人间取分玩赏，几近沦弃，须在亲情与护藏之间取舍
  lesson: 二世家藏之好未敢不钦藏，续前贤画史、考诸传记得失，方能光大其业
  summary_first_person: 我出身好蓄书画之家，祖上与当世贵公均富画府。弱年家藏流散无几，近岁方购寻遗失，得十余卷传世之宝，终日幽对，不知天地之大。昔唐张彦远著《历代名画记》，绝笔于会昌元年，厥后撰集多相乱。我考诸传记、参较得失，续自会昌元年历五季至本朝熙宁七年，编次名人艺士，厘为六卷，目之曰《图画见闻志》。
  source_urls:
  - 图画见闻志·序
