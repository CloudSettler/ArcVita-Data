  archetype: 孝子画家
  dilemmas:
  - 为湖广总督画像索重润笔，遭怒欲绳以法，携父母图像避走京师
  - 贫富贵贱有别，遇富贵者必重索金币而得罪权贵
  lesson: 孝思所感可以通神明，而以笔墨抗权贵、不悔于祸，是古之愚亦古之贞。
  summary_first_person: 我闵贞，字正斋，居汉口镇。幼失怙恃，痛不能见二亲遗容，遂笃志学画写照，虔祷观音求与父母相肖者图之，追翁媪一夜行二百余里，其貌果类吾父母，写毕而翁媪不见，乡人惊为孝感通神。既工写照，四方求画者众：贫贱者靡不应，富贵者必重索金币。湖督招我绘制，索润笔二千镒，增至千金亦不应，几罹祸而携亲像避入京师，寓晋阳庵。居三年穷甚，负袱被出都门而去。
  source_urls:
  - https://zh.wikisource.org/wiki/讀畫閒評
