  detail_zh: 受人绐言有翁媪貌类父母往荆襄，正斋一日夜疾行二百余里，追得其人写像，翁媪写毕忽不见，乡人惊叹孝感通神。
- id: guji-闵贞-event-governor
  date: '1770'
  year_of: '1770'
  title_zh: 应湖督之招索润笔二千镒
  detail_zh: 先以片纸呈试，制军大悦令速竣绘事；正斋索润笔二千镒，当事增至千金亦不应，制军怒欲绳以法。
- id: guji-闵贞-event-flee
  date: '1772'
  year_of: '1772'
  title_zh: 携父母图像避入京师
  detail_zh: 寓潘家河沿之晋阳庵，得作者过访握手大笑如旧相识，出奉馔图索题。居三年窭甚，负袱被出都门而去。
