events:
- id: guji-阎立本-event-birth
  date: '0600'
  year_of: 600
  type: birth
  title_zh: 阎立本生（约）
  description: 阎毗之子，与兄阎立德并称“二阎”，居于隋末唐初之际。
- id: guji-阎立本-event-mentor
  date: '0610'
  year_of: 610
  type: career
  title_zh: 兼师于父阎毗
  description: “二阎师于郑、张、杨、展，兼师于父毗，毗在隋朝。”承家学与隋代匠学传统。
- id: guji-阎立本-event-master
  date: '0625'
  year_of: 625
  type: career
  title_zh: 祖述顾陆张吴传统
  description: “阎立德、阎立本并祖述顾、陆、僧繇”，而阎则“六法备该，万象不失”。
- id: guji-阎立本-event-zhaojun
  date: '0640'
  year_of: 640
  type: career
  title_zh: 画昭君着帏帽
  description: “阎令公画昭君，已着帏帽。殊不知帏帽兴于国朝。”张彦远举此为绘画衣冠时代之例。
- id: guji-阎立本-event-price
  date: '0650'
  year_of: 650
  type: career
  title_zh: 国朝画可齐中古，屏风值金二万
  description: 名价品第中，阎立本与吴道玄、尉迟乙僧并列“国朝画可齐中古”，其屏风一片值金二万，列于最上之价。
- id: guji-阎立本-event-death
  date: '0673'
  year_of: 673
  type: death
  title_zh: 阎立本卒
  description: 咸亨四年卒，其迹为《历代名画记》所载，传芳千祀。
