  archetype: 宫廷画家·六法兼备
  dilemmas:
  - 位至宰相而世以画师目之，技与名的纠缠
  - 谨守形似与气韵兼备之间的取舍
  lesson: 六法备该、万象不失者，方能传芳千祀
  summary_first_person: 我阎立本与兄立德并称“二阎”，师法郑法士、张僧繇、杨契丹、展子虔，兼承家学于父亲阎毗。世人称我“六法备该，万象不失”，画昭君着帏帽、衣冠土风各依时代，然我得列国朝可齐中古之价，屏风一片值金二万。
