person:
  qid: guji-陆探微
  name_zh: 陆探微
  names:
    zh: 陆探微
    en: Lu Tanwei
  lifespan:
    birth:
      date: 约-400
      precision: year
      is_circa: true
      raw: 生年不详，约五世纪前中期
    death:
      date: 约-485
      precision: year
      is_circa: true
      raw: 卒年不详，约活动于南朝宋明帝时期
  birth_date: 约-400
  death_date: 约-485
  era: 南朝宋
  reign_ref: 宋明帝、宋前废帝时期
  archetype: 画家
  dilemmas:
  - 师承顾恺之而不泥于师法，须在“迹简意澹”的古法中自成一笔之骨气
  - 身处乱世，图画数为兵火所毁，真迹难存而声名须传后
  lesson: 以形写神、骨法用笔，画之妙在气韵生动而不在形似。
  summary_first_person: 我陆探微，师法顾恺之而自成一格，以秀骨清像、一笔画名重南朝宋，画品居上品之首，风采为百代所仰。
  source_urls:
  - https://zh.wikisource.org/wiki/历代名画记
