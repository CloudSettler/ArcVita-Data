    start_date: 约-485
    highlight_event_id: guji-陆探微-event-legacy
  decisions:
  - date: 约-465
    title_zh: 倾心图画，不受官爵实惠
    rationale: 以画事自守，虽无位而丹青妙绝一时，为南齐高帝品第四十二人之冠
events:
- id: guji-陆探微-event-birth
  date: 约-400
  year_of: -400
  title_zh: 陆探微出生（约）
  type: birth
  description: 生年史无明文，据其活跃于南朝宋文帝至明帝间推定约生于五世纪前期。
- id: guji-陆探微-event-learn
  date: 约-420
  year_of: -420
  title_zh: 师事顾恺之之法
  type: endeavor
  description: 《历代名画记》载"陆探微师于顾恺之"，探微承卫顾一脉师资传授。
- id: guji-陆探微-event-fame
  date: 约-450
  year_of: -450
  title_zh: 以秀骨清像、笔画连绵名重江左
  type: endeavor
  description: 探微精利润媚，一笔画妙绝，与时人并称"顾陆"，遂为宋代画坛第一。
- id: guji-陆探微-event-xiaoshi
  date: 约-479
  year_of: -479
  title_zh: 《萧史图》妙冠一时，宋齐录为古来名手之冠
  type: endeavor
  description: 南齐高帝科第古来名手，"自陆探微至范惟贤四十二人，为四十二等"，探微居首；唐张彦远进《萧史图》于宪宗，称其"妙冠一时，名居上品"。
- id: guji-陆探微-event-legacy
  date: 约-485
  year_of: -485
  title_zh: 卒，其子陆绥、弟弘肃并师其法
  type: death
  description: 探微卒年不详；子绥、弘肃并师于父，画法传于后世，与顾恺之、张僧繇并称"六朝三杰"（"陆"居其一）。
