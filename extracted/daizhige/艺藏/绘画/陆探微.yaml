    title_zh: 于顾恺之法外求画，以骨气形似兼得自立门户
    rationale: 深悟气韵生动为画之总要，遂变顾氏古法为己貌
- id: guji-陆探微-endeavor-2
  name_zh: 为宋明帝常侍、画名冠绝一时
  phases:
  - key: climax
    name_zh: 名居上品
    labels:
      zh:
      - 上品
      - 帝室供奉
    start_date: 约-465
    highlight_event_id: guji-陆探微-event-xiaoshi
  - key: closure
    name_zh: 身后流芳
    labels:
      zh:
