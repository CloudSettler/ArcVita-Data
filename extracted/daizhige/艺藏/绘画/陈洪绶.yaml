  birth_date: '1599'
  death_date: '1652'
  era: 明末清初
  reign_ref: 崇祯、南明监国
  archetype: 人节两全的乱世画家
  dilemmas:
  - 征召与傲骨：崇祯间召入为供奉，不拜
  - 荣辱之际：为固山额真所获，因其名优遇之，终亡归故里
  lesson: 艺可越前贤而不自满，身可屈于势而志不降
  summary_first_person: 我陈洪绶，字章侯，号老莲，甲申后自称悔迟，诸暨人。四岁过妇翁家，见新垩之壁，登案画关羽像长八九尺，妇翁惊而扃室奉之。我画人物躯干伟岸，衣纹清圆细劲，兼有李公麟、赵孟頫之妙；少时渡钱塘，拓杭州府学七十二贤石刻闭户临摹，数摹而数变，又摹周昉美人图至再四犹恨不及，人谓已胜元本，而我自言"吾画易见好，则能事犹未尽"，正因知此所以不及。崇祯间召我不拜，监国中为待诏；南都破，我为清将所获，以其慕名优遇，然终亡归，卒于家。时人谓与顺天崔子忠齐名，号南陈北崔。
