  summary_first_person: 我是陈遇，字中行，鄞县人。元末曾官江东书院山长，博通经史，尤邃先天之学。明初参赞帷幄，累官至尚书。我工于写照，曾为高皇纪容，妙绝当时，兼善山水，世称静诚先生。
