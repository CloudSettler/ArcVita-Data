    en: Han Gan
  lifespan:
    birth:
      date: ~0706
      precision: approximate
      is_circa: true
      raw: 唐代京兆人，生年不详
    death:
      date: ~0783
      precision: approximate
      is_circa: true
      raw: 卒年不详
  birth_date: ~0706
  death_date: ~0783
  era: 唐代
  reign_ref: 唐明皇天宝年间
  archetype: 宫廷画马大师，神品下画家
  dilemmas:
  - 奉诏师从陈闳学画马却不肯师法陈闳，宁以内厩真马为师，冒犯圣意而有独到之见
  lesson: 师法造化而非拘泥师门，直面实物方得神韵，遂成画马一代宗师。
  summary_first_person: 我韩幹乃京兆人，天宝年间被明皇召入宫廷供奉。皇帝命我师从陈闳画马，我却自言内厩骏马即是我师。开元之后四海清平，西域名马纷至，我尽写其状，飞黄、照夜、浮云、五花皆入我图，遂与陈闳先后辉映，位居神品。
