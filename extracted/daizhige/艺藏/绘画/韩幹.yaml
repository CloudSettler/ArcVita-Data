- id: guji-韩幹-event-death
  event_type: death
  date: ~0783
  year_of: 783
  title_zh: 韩幹卒
  description: 卒年不详，画高僧、鞍马、菩萨、鬼神等并传于世。
- id: guji-韩幹-event-summon
  event_type: endeavor
  date: 482
  year_of: 742
  title_zh: 明皇天宝中召入供奉
  description: 唐明皇天宝年间，韩幹被召入宫廷为供奉画家。
- id: guji-韩幹-event-defend-teacher
  event_type: endeavor
  date: 482
  year_of: 742
  title_zh: 自陈以内厩之马为师
  description: 上令师陈闳画马，帝怪其不同而诘之，奏称臣自有师，陛下内厩之马皆臣之师，上甚异之。
- id: guji-韩幹-event-masterpiece
  event_type: endeavor
  date: 493
  year_of: 755
  title_zh: 尽写内厩飞黄照夜诸骏
  description: 开元后四海清平，外国名马重驿累至，明皇择良马与中国之骏同颁，令尽写之，韩幹继陈闳之后写渥洼騕褭之形，遂居神品之列。
- id: guji-韩幹-event-temple-walls
  event_type: endeavor
  date: 498
  year_of: 762
  title_zh: 画宝应寺资圣寺壁及写真传世
  description: 画宝应寺三门神、西院北方天王、佛殿菩萨及净土壁、资圣寺北门二十四圣，皆奇踪；画高僧、鞍马、菩萨、鬼神等并传于世。
