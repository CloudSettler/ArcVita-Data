  - date: 0904
    title_zh: 受命往陕郊画龙兴寺二百余堵壁画
    rationale: 李克用欲使其远离权力中心，遂前往作画。
events:
- id: guji-韩求-event-retreat
  date: 0900
  precision: year
  year_of: 0900
  title_zh: 唐末退藏不仕，与李祝以丹青自污，好游晋唐间
  description: 倜傥不拘，有经略才能，属唐祚陵季遂退藏不仕。
- id: guji-韩求-event-mural
  date: 0904
  precision: year
  year_of: 0904
  title_zh: 于陕郊龙兴寺画回廊列壁二百余堵
  description: 对手画摄摩腾竺法兰以经来大各八尺，三门上神数十身皆高二丈，又画九子母及罗乂变像，宛有步武之态，天下画流云集，莫不鼠伏。
- id: guji-韩求-event-slandered
  date: 0906
  precision: year
  year_of: 0906
  title_zh: 遭画人嫉妒谗害
  description: 画人妒其才识，从容言于克用曰求、祝有文武经术大略，辞多不顺，言大王有异图。
- id: guji-韩求-event-drown
  date: 0906
  precision: year
  year_of: 0906
  title_zh: 李克用设宴，与李祝同醉溺于中流
  description: 克用矫称按察境内往陕郊慰劳赐宴，逮济中流，求祝俱醉，克用皆溺之，虑画师神笔散入别境。
- id: guji-韩求-event-death
  date: 0906
  precision: year
  year_of: 0906
  title_zh: 韩求卒
  description: 与李祝同为李克用溺杀，时君子太息曰怀异志杀善人死无日矣。
- id: guji-韩求-event-birth
  date: ''
  precision: unknown
  year_of: 0900
  title_zh: 韩求生
  description: 不知何处人，生年不详，一云韩虬。
