  dilemmas:
  - 逢唐末乱世，退藏不仕，以丹青自污避祸
  - 才识过人遭画流嫉妒，被谗于李克用
  lesson: 乱世怀才难自保，退隐避世亦不免祸。
  summary_first_person: 我韩求，与李祝皆倜傥不拘，有经略才能。唐祚陵替之际，我们退藏不仕，以丹青自污，游历晋地。曾在陕郊龙兴寺画回廊列壁二百余堵，画摄摩腾、竺法兰及三门诸神，天下画流云集，莫不鼠伏。然因才招妒，被人谗于李克用，终遭其设计，与李祝俱醉后溺于中流。世称我等可列神品。
