  - 身处唐季书风日趋姿媚之时，独守古籍雄厚之法，力挽颓俗
  - 兼擅楷行草而欲承先秦科斗籀隶之遗意，复古与创新难两全
  lesson: 含宏光大，以书载道，气象可以仪表衰俗
  summary_first_person: 我乃琅邪临沂人颜真卿，字清臣，师古五世从孙，仕唐官至尚书右丞，封鲁郡公，赠太师。我善楷书行草，蔚然雄厚，独具先秦科斗籀隶之遗意，被后世推为书统之宗，与蔡邕、张芝、钟繇、王羲之诸贤并列于书法
    thirteen 作者之列。
