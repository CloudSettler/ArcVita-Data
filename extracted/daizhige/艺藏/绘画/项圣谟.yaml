person:
  qid: guji-项圣谟
  name_zh: 项圣谟
  names:
    zh: 项圣谟
    en: Xiang Shengmo
  lifespan:
    birth:
      date: '1597'
      precision: year
      is_circa: true
      raw: 生年未明文，约万历中
    death:
      date: '1658'
      precision: year
      is_circa: true
      raw: 卒年未明文，约清初
  birth_date: '1597'
  death_date: '1658'
  era: 明末清初
  reign_ref: 崇祯、顺治间
  archetype: 遗民画家
  dilemmas:
  - 家国易代之际，以画自守而不事新朝
  - 家藏书画遭乱散失，以笔墨记载兴亡
  lesson: 乱世之中，艺事亦可以为志节所寄。
  summary_first_person: 我是秀水项圣谟，字孔彰，号易庵，又号胥山樵，项子京之孙。初学文衡山，后扩于宋而取韵于元，花草松竹木石尤精妙。董文敏曾跋我画册，谓众美毕臻、士气作家俱备。世乱之后，我仍以画寄怀，著《朗云堂集》。
