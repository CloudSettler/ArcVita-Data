person:
  qid: guji-马远
  name_zh: 马远
  names:
    zh: 马远
    en: Ma Yuan
  lifespan:
    birth:
      date: '1160'
      precision: year
      is_circa: true
      raw: 南宋光宗、宁宗朝活动
    death:
      date: '1225'
      precision: year
      is_circa: true
  birth_date: '1160'
  death_date: '1225'
  era: 南宋
  reign_ref: 光宗、宁宗朝画院待诏
  archetype: 南宋院画家
  dilemmas:
  - 生逢南渡偏安之世，画风多剩水残山，被讥为写偏安风景，宜守家学还是开新境
  - 家学传承数世至其子马麟而不逮，爱子心切多以己画得意者题作马麟
  lesson: 独开门径方能传世，马远一名反而埋没了儿子的才华
  summary_first_person: 我马远，南宋光宁两朝画院待诏，世称马一角、号马半边。我家世代以画为业，我师李唐法而更出新意，极简淡之趣，善作剩水残山，画水十二幅曲尽水态，宫苑进御之作多由杨妹子题署，至今为世所珍。
