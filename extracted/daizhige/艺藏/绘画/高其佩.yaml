- id: guji-高其佩-event-office
  event_type: 仕宦
  date: '1715'
  year_of: 1715
  description: 康熙乙未年由京口买舟赴永宁观察任，历官至刑部侍郎（官司寇）
- id: guji-高其佩-event-old
  event_type: 晚年
  date: '1730'
  year_of: 1730
  description: 年过六旬在京师，暮色中辨堂上无款旧画为刘松年所制妙品，又鉴倪瓒山水一峰可疑，悬对三日拍案叫绝
- id: guji-高其佩-event-death
  event_type: 卒
  date: '1734'
  year_of: 1734
  description: 其佩卒，年约七十五，指画传世千余幅岁计不下五六万幅
