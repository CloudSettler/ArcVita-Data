person:
  qid: guji-高其佩
  name_zh: 高其佩
  names:
    zh: 高其佩
    en: Gao Qipei
  lifespan:
    birth:
      date: '1660'
      precision: year
      is_circa: true
      raw: 生于忠烈公江西建昌郡守任所
    death:
      date: '1734'
      precision: year
      is_circa: true
      raw: 年过七旬后卒
  birth_date: '1660'
  death_date: '1734'
  era: 清康熙、雍正年间
  reign_ref: 康熙、雍正
  archetype: 艺术家
  dilemmas:
  - 八龄学画而弱冠恨不能自成一家，梦土室以指蘸水习画，得于心而不能应之于笔
  - 指画名重一时，世人只称指墨而不知其笔墨之佳，笔为指掩
  lesson: 笔所难到处指能传其神，指笔互相因，须天资、学力、胸襟三者兼备
  summary_first_person: 我八龄学画，弱冠恨不能自成一家，后于梦中得土室以指蘸水习画之法，遂以指蘸墨，尽得其神，弃笔而创指头画一派，中年奉命入大内作图，至老犹悬眼镜临橅古人。
  source_urls:
  - https://zh.wikisource.org/wiki/指头画说
