  decisions:
  - date: '1715'
    title_zh: 赴永宁观察任于江上 persuaded 画龙
    rationale: 康熙乙未年由京口买舟赴永宁观察任，泊舟虔祷得见真龙，自此画龙有耳而无无碍者
events:
- id: guji-高其佩-event-birth
