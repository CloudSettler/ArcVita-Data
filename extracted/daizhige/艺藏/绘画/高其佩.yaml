  event_type: 学画
  date: '1668'
  year_of: 1668
  description: 八龄学画，遇稿辄摹，积十余年盈二簏
- id: guji-高其佩-event-dream
  event_type: 顿悟
  date: '1680'
  year_of: 1680
  description: 弱冠时倦而假寐，梦老人引至土室，壁皆画理而空空不能摹仿，惟以指蘸盂水习之，觉而大喜
- id: guji-高其佩-event-palace
  event_type: 奉旨作画
  date: '1729'
  year_of: 1729
