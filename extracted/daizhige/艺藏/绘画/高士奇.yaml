events:
- id: guji-高士奇-event-birth
  date: '1645'
  year_of: '1645'
  type: birth
  summary: 高士奇约生于清顺治初年，浙江平湖人，号江村。
- id: guji-高士奇-event-serve
  date: '1677'
  year_of: '1677'
  type: endeavor
  summary: 以殊才遭逢圣天子不世之遇，槖笔入禁庭备顾问。
- id: guji-高士奇-event-retire
  date: '1692'
  year_of: '1692'
  type: endeavor
  summary: 十有余年一旦乞身而退，优游北墅，漱清泉枕白石，罢归平湖之日考所见法书名画。
- id: guji-高士奇-event-collect
  date: '1692'
  year_of: '1692'
  type: endeavor
  summary: 罢归平湖之日，以所见法书名画考其源流，记绢素长短广狭、后人题跋图记。
- id: guji-高士奇-event-record
  date: '1693'
  year_of: '1693'
  type: endeavor
  summary: 长夏掩关澄怀默坐，间有挟卷轴就余辨真赝，偶遇佳迹必详记其位置行墨、长短阔隘、题跋图章。
- id: guji-高士奇-event-complete
  date: 1693-06
  year_of: 1693-06
  type: endeavor
  summary: 书成于康熙三十有二年六月，凡三年余仅得三卷，名曰江村销夏录，故以销夏名编。
- id: guji-高士奇-event-preface
  date: 1693-09
  year_of: 1693-09
  type: endeavor
  summary: 授序印行，朱彝尊于是年九月作序印行之，自序言览此者当作云烟过眼观，体例与铁网珊瑚、清河书画舫相似而所录皆以亲见为定。
- id: guji-高士奇-event-death
  date: '1704'
  year_of: '1704'
  type: death
  summary: 高士奇约卒于康熙后期，鉴赏之精为收藏家所取重，其书后来录入四库全书。
