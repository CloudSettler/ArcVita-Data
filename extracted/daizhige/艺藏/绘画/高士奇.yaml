  birth_date: '1645'
  death_date: '1704'
  era: 清代康熙朝
  reign_ref: 康熙
  archetype: 鉴藏家兼文臣
  dilemmas:
  - 内廷供奉而不着于录，恐失慎密之义
  - 竭赀力收藏书画与决性命以饕富贵者何异
  lesson: 聚散无常，当作云烟过眼观，亲见为定、宁慎无滥
  summary_first_person: 我以殊才遭逢圣主，槖笔入禁庭备顾问十余年，一旦乞身退居平湖，考所见法书名画源流，详记绢素尺寸题跋图记，成《江村销夏录》，视功名富贵如云霞花鸟，忽有忽无而无所蒂芥。
  source_urls:
  - 钦定四库全书·子部·艺术类·《江村销夏录》提要及序
