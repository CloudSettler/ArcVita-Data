  name_zh: 高士奇
  names:
    zh: 高士奇、江村、澹人
    en: Gao Shiqi
  lifespan:
    birth:
      date: '1645'
      precision: year
      is_circa: true
      raw: 约顺治二年
    death:
      date: '1704'
      precision: year
      is_circa: true
