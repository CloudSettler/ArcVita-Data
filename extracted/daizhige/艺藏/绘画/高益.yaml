    start_date: 约-965
    highlight_event_id: guji-高益-event-soushan
  decisions:
  - date: 约-960
    title: 以画附药相赠，借市井人之口传名
    rationale: 涿郡亡国之人无名于中土，画赎药者所需鬼神犬马，惊动时人，为立身之资。
  - date: 约-967
    title: 往客孙四皓，作搜山图酬其厚礼
    rationale: 孙氏广延艺术之士，待益甚厚，以画酬知，得进身之阶。
- id: guji-高益-endeavor-2
  name_zh: 入宫廷图画院，勅画京师大寺名壁
  phases:
  - key: climax
    name_zh: 诏待诏图画院，绘相国寺阿育王战像
    labels:
      zh: 待诏、勅画、临幸问对
    start_date: 约-975
    highlight_event_id: guji-高益-event-ayuwang
  - key: closure
    name_zh: 画崇夏寺东西二壁善神，坐神擅长
    labels:
      zh: 大像、善神、坐神
    start_date: 约-980
    highlight_event_id: guji-高益-event-chongxia
  decisions:
  - date: 约-975
    title: 答太宗问兵法之对
    rationale: 上问卿晓兵法否，答以臣非知兵者命意至此耳，以谦退之言得嘉许。
  - date: 约-980
    title: 于崇夏寺大殿东西壁作长身善神
    rationale: 长于大像而不称其笔，遂用心于坐神，扬长补短。
