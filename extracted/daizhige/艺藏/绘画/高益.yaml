  birth_date: 约-940
  death_date: 约-985
  era: 五代末至北宋初
  reign_ref: 宋太祖、宋太宗
  archetype: 画师
  dilemmas:
  - 亡国孤客如何以技艺立身于新朝
  - 待诏之命与个人画风的坚守
  lesson: 以药济人与以画酬知，命意专深则虽异乡人亦可列神品。
  summary_first_person: 我本契丹涿郡人，宋太祖时遁入中国，初于都市货药，常画鬼神犬马赠赎药者，人皆惊异。蒙孙四皓厚待，为其画搜山图、钟馗诸作，笔力劲健，观者滴汗。孙氏进我所画搜山图于太宗，遂诏待诏图画院，勅画相国寺廊壁。驾幸见我写阿育王战像，上问我晓兵法否，我答臣非知兵者，命意至此耳，上甚善之。复画崇夏寺大殿东西二壁善神，虽长于大像而不称其笔，凡画坐神则用意益善。评者谓我色轻而墨重，变通应手，不拘一能，列神品下，又于鬼神门列妙品。京师楼阁序庑之制，自我的四皓楼芭蕉始，至今尚存。
  source_urls:
  - https://www.zh.wikisource.org/wiki/宋朝名画评
endeavors:
- id: guji-高益-endeavor-1
  name_zh: 契丹遗民入宋，货药行画谋生立名
  phases:
  - key: brewing
    name_zh: 遁入中国，都市货药
    labels:
      zh: 流寓、货药、借药赠画
    start_date: 约-960
    highlight_event_id: guji-高益-event-sell-medicine
  - key: breakthrough
    name_zh: 客游孙四皓之门，以酬知之画成名
    labels:
