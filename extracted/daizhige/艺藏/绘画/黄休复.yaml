    name_zh: 书流传、四格为学者楷式
    labels:
      zh:
      - 考黄氏之四格则思过半矣
    start_date: 1006
    highlight_event_id: guji-黄休复-event-preface
  decisions:
  - date: 1006
    title: 请虞曹员外郎致仕李畋作序
    rationale: 李畋有陶隐居之好，读其书首贶见托，故以序见付。
