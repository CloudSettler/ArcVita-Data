    title: 决意笔录残存名画
    rationale: 淳化甲午盗发二川，绘宝散如决水，可觌者十二三，心郁久之，故必书以存之。
- id: guji-黄休复-endeavor-2
  name_zh: 撰《益州名画录》三卷
