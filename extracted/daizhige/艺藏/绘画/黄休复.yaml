person:
  qid: guji-黄休复
  name_zh: 黄休复
  names:
    zh: 黄休复
    en: Huang Xiufu
  lifespan:
    birth:
      date: 950
      precision: year
      is_circa: true
      raw: 约五代末至宋初
    death:
      date: 1010
      precision: year
      is_circa: true
      raw: 约景德之后
  birth_date: 约950
  death_date: 约1010
  era: 五代末至北宋初
  reign_ref: 北宋乾德、景德年间
  archetype: 画史著录家
  dilemmas:
  - 名画毁于兵燹，是听任散亡还是抱残存录
  - 心郁名迹剥落，唯有笔之于书以传后世
  lesson: 目击存真，品以四格，蜀地名画赖以不亡。
  summary_first_person: 我是江夏黄休复，字归本，通《春秋》与《左氏》《公》《谷》之学，以鬻丹养亲，游心顾陆之艺。益多名画，然淳化甲午盗焚二川，墙壁之绘、家秘之宝毁散殆尽，我心郁久之，乃笔之于书，自李唐乾元初至皇宋乾德，取目击之精者五十八人，品以四格，离为三卷，命曰《益州名画录》，庶使蜀郡名画之存亡，系后学之明昧。
  source_urls:
  - https://zh.wikipedia.org/wiki/黄休复
