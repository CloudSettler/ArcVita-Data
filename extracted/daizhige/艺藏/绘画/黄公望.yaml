- id: guji-黄公望-event-kuaixue-inscription
  date: '1345-09-01'
  year_of: '1345'
  summary: 我为赵文敏大书快雪时晴帖敬题：文敏公大书右军帖字，余以遗景行，当与真迹并行也。
- id: guji-黄公望-event-caoyunxi-inscription
