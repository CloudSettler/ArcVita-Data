  summary_first_person: 我是黄筌，始事孟蜀为待诏，入宋为宫赞给事禁中，多写珍禽瑞鸟、琪花文石，与儿子居寀并为花鸟神品，世称黄家富贵，与徐熙之野逸并称于后世。
