person:
  qid: guji-黄钺
  name_zh: 黄钺
  names:
    zh: 黄钺
    en: Huang Yue
  lifespan:
    birth:
      date: '1750'
      precision: year
      is_circa: true
      raw: 清乾隆年间
  birth_date: '1750'
  era: 清代
  reign_ref: 乾隆—嘉庆年间
  archetype: 书画理论家 / 画家
  dilemmas:
  - 六法之中气韵最难，欲以文字穷尽画理，自知管蠡所见未得二三
  lesson: 仿司空图《诗品》之例立画品二十四则，专言林壑理趣，以诗论画、以品统法。
  summary_first_person: 我仿司空表圣诗品之例，著画品二十四篇，专言山水林壑理趣，自谓管蠡之见，愿为后有作者之前驱。
endeavors:
- id: guji-黄钺-endeavor-1
  key_name: 著《二十四画品》
  phases:
  - key: brewing
    name_zh: 沿流讨源
    labels:
      zh:
      - 考画品源流
      - 效法表圣
    highlight_event_id: guji-黄钺-event-brewing
  - key: breakthrough
    name_zh: 著成廿四品
    labels:
      zh:
      - 气韵开篇
      - 专言林壑
    highlight_event_id: guji-黄钺-event-breakthrough
  - key: climax
    name_zh: 品目铺陈
    labels:
      zh:
      - 体物周流
      - 神妙高古
    highlight_event_id: guji-黄钺-event-climax
  - key: closure
    name_zh: 谦以自处
    labels:
      zh:
      - 愿为前驱
    highlight_event_id: guji-黄钺-event-closure
  decisions:
  - title_zh: 仿司空图《二十四诗品》例著画品二十四篇
    rationale: 谢赫姚最虽有画品之传，然山水未分宗、止及像人肖物，故专言林壑理趣以补其阙。
- id: guji-黄钺-endeavor-2
  key_name: 以诗论画、敷写廿四品目
  phases:
  - key: brewing
    name_zh: 立品定目
    labels:
      zh:
      - 气韵为最
      - 意居笔先
    highlight_event_id: guji-黄钺-event-climax
  - key: breakthrough
    name_zh: 骈语体物
    labels:
      zh:
      - 读万卷书
      - 庶几心会
    highlight_event_id: guji-黄钺-event-breaking2
  - key: closure
    name_zh: 归于韶秀
    labels:
      zh:
      - 问架是立
      - 大雅其嗤
    highlight_event_id: guji-黄钺-event-breakthrough
  decisions:
  - title_zh: 以气韵居首、韶秀殿后，统摄神妙高古至于空灵俊秀二十四则
    rationale: 六法之难气韵为最，故以之开篇；品目骈语成篇，使画理可诵可味。
events:
- id: guji-黄钺-event-birth
  title_zh: 黄钺生
  date: '1750'
  year_of: 1750
  note: 生卒据通行记载，原文未载，约年。
- id: guji-黄钺-event-death
  title_zh: 黄钺卒
  date: '1841'
  year_of: 1841
  note: 原文未载，据史传补记。
- id: guji-黄钺-event-brewing
  title_zh: 自序追述画品源流并明著述之志
  note: 昔画缋之事备于百工，两汉以还精于学士，谢赫姚最并有画品之传。
- id: guji-黄钺-event-breakthrough
  title_zh: 著《画品廿有四篇》成书
  note: 涂抹余间，仿司空表圣之例，专言林壑理趣，自谦管蠡之见，愿为后有作者前驱。
- id: guji-黄钺-event-climax
  title_zh: 首标气韵，赋咏廿四品目
  note: 六法之难气韵为最，意居笔先妙在画外；继以神妙、高古、苍润、沉雄、冲和诸品，终以韶秀。
- id: guji-黄钺-event-breaking2
  title_zh: 以骈偈韵语写诸品意境
  note: 如天风冷冷水波濊濊、如音栖弦如烟成霭，体物周流无小无大，读万卷书庶几心会。
- id: guji-黄钺-event-closure
  title_zh: 终篇韶秀，谦辞谢世
  note: 间架是立韶秀始基，但抱骨妍休憎面媸；非不可爱，大雅其嗤。
