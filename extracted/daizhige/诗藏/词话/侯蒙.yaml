  dilemmas:
  - 年三十余方得乡贡，因年长貌寝遭人轻慢，甚至被画形于纸鸢之上戏弄
  - 迟暮登第，仍以词自励，终至执政之位
  lesson: 不遇时不自弃，遭辱而不怒，一笑作词藏大志，终有碧霄之日。
  summary_first_person: 我是侯蒙，字元功，密州人。年少久困于科场，三十一岁才得乡贡，因年长貌丑不为人敬，有人画我的像于纸鸢上放出，我见之大笑，作临江仙词题其上，自喻当风借力、一举入高空。后来一举登第，年五十余，官至执政。
  source_urls:
  - 夷坚志·侯蒙词
