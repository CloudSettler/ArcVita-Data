  archetype: 戏曲大家
  dilemmas:
  - 以杂剧鸣世而正史失载，生卒行迹皆湮没无闻
  - 身处书会才人之列，于市井优伶间求生，不能进显达之途
  lesson: 造语妖娇而切于世情，以曲写人间不平，遂成元曲之冠
  summary_first_person: 我关汉卿，太医院尹出身，混迹书会，与优伶为伍，造语妖娇如小女临杯，然笔下多悲愤之音，为杂剧宗匠，后世推我为元曲四大家之首。
  source_urls:
