  summary_first_person: 我况周颐，字夔笙，号蕙风，桂林人，一生专精词学，提出“重、拙、大”之说，着《蕙风词话》，与王鹏运、朱祖谋、郑文焯并称清季词学四大家。
  source_urls:
  - 《蕙风词话》（新校本）
