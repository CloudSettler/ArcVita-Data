- id: guji-刘禹锡-event-zhuzhi
  date: 0815
  year_of: '815'
  title: 沅湘作竹枝新词九章
  description: 唐贞元中，刘禹锡在沅湘，以里歌鄙陋，乃依骚人九歌作竹枝新词九章，教里中儿歌之，由是竹枝盛于贞元元和之间。
- id: guji-刘禹锡-event-changhe
  date: 0819
  year_of: '819'
  title: 与白居易倡和竹枝
  description: 刘禹锡与白居易倡和竹枝甚多，自叙竹枝乃巴歈，巴儿联歌，吹短笛击鼓以赴节，歌者扬袂睢舞，其音协黄钟羽；刘白词俱无和声。
- id: guji-刘禹锡-event-hena
  date: 0825
  year_of: '825'
  title: 作纥那曲二十字词
  description: 刘禹锡作纥那曲「杨柳郁青青，竹枝无限情，同郎一回顾，听唱纥那声」，即唐平韵五言绝句，为倚声家所录。
- id: guji-刘禹锡-event-death
  date: 0842
  year_of: '842'
  title: 刘禹锡卒
  description: 刘禹锡约于唐武宗会昌二年（842年）去世。
