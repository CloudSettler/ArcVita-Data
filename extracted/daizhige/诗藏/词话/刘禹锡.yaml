  dilemmas:
  - 处沅湘之间闻里歌鄙陋，弃之抑依骚人体裁革新之
  - 依九歌作新词教里中儿歌之，民间俚俗与文人雅制如何相济
  lesson: 即事之微必考古而立制，化俚俗为雅声方成法程
  summary_first_person: 我刘禹锡于贞元中居沅湘，见里歌鄙陋，乃依骚人九歌作竹枝新词九章，教里中儿歌之，由是竹枝盛于贞元元和之间；我又与白居易倡和竹枝甚多，自叙其巴歈联歌、吹短笛击鼓以赴节之状；我亦有纥那曲词传世，为倚声家所法。
