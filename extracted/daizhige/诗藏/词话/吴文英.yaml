  name_zh: 吴文英
  names:
    zh: 吴文英、梦窗
    en: Wu Wenying
  lifespan:
    birth:
      date: '1200'
      precision: year
      is_circa: true
      raw: 约1200年
    death:
      date: '1260'
      precision: year
      is_circa: true
      raw: 约1260年
  birth_date: 约1200年
  death_date: 约1260年
  era: 南宋
  reign_ref: 南宋后期（理宗朝前后）
  archetype: 词人
  dilemmas:
  - 立意高远取径邃密，却因过嗜饾饤（堆砌典故辞藻）而招致后世讥议
  - 由南追北上追北宋秾挚之境，然风格密丽晦涩，毁誉参半
  lesson: 为文立意宜高、取径宜远，然雕琢堆砌过度反成疵累；虚实并到方为至境。
  summary_first_person: 我吴文英，号梦窗，南宋词人。周济《宋四家词选》以我跻身宋词四家，谓我奇思壮采、腾天潜渊，返南宋之清泚，为北宋之秾挚，由南追北，开词家转境；虽过嗜饾饤被议，然虚实并到之作，虽清真不过也。
  source_urls:
  - https://zh.wikisource.org/wiki/宋四家词选目录序论
endeavors:
- id: guji-吴文英-endeavor-1
  key: brewing
  name_zh: 由南追北
  labels:
    zh: 学词问道
  start_date: '1220'
  highlight_event_id: guji-吴文英-event-1
  decisions:
  - date: '1220'
    title_zh: 由南追北，上追北宋秾挚之风
    rationale: 南宋清泚有余而秾挚不足，乃取径北宋，融密丽于浑化。
- id: guji-吴文英-endeavor-2
  key: breakthrough
  name_zh: 奇思壮采
  labels:
    zh: 词艺大成
  start_date: '1240'
  highlight_event_id: guji-吴文英-event-2
  decisions:
  - date: '1240'
    title_zh: 力追清真浑化之境
    rationale: 虚实并到，虽清真亦不过，遂自成一格。
- id: guji-吴文英-endeavor-3
  key: closure
  name_zh: 领袖一代
  labels:
    zh: 跻身宋四家
  start_date: '1832'
  highlight_event_id: guji-吴文英-event-3
  decisions:
  - date: '1832'
    title_zh: 被周济列为宋词四家之一
    rationale: 周济论词，以清真、稼轩、碧山、梦窗领袖一代，梦窗为学词问涂之关键一环。
