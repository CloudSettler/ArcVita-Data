  - date: '1324-09-09'
    title_zh: 因张汉英、萧存存之请，撮韵成帙
    rationale: 时人作词不辨阴阳平仄、乱用入声衬字，故分平声阴阳、入声派入三声，编为十九韵部，'名之曰中原音韵并起例以遗之'。
  - date: '1324-01-01'
    title_zh: 决意以中原实际语音正乐府之音
    rationale: 欲作乐府必正言语、必宗中原之音；吴楚轻浮、燕冀重浊，方言误音，须以正语为本。
