  archetype: 音韵学家 / 曲学家
  dilemmas:
  - 北曲用中原实际语音，是否应打破传统诗韵规范？
  - 以一时中原之音定韵谱，如何面对'变乱古法'的批评？
  lesson: 依语言自然之节立韵，专为北曲定制音韵体系，虽遭'轻诋古书'之讥，所定《中原音韵》终成北曲韵谱的千年准绳。
  summary_first_person: 我是周德清，字挺斋，高安人。我为北曲创作编成《中原音韵》，以平声分阴阳、入声派入三声，分十九韵部。泰定甲子年，应萧存存之请，我撮录同音、析辨阴阳，使作词者有
    âm 韵可依。此书虽被指'变乱古法'，却至今为北曲之准绳。
  source_urls:
  - https://www.sks-quanshu.com/
