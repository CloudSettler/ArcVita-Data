events:
- id: guji-周济-event-birth
  title_zh: 周济生
  event_type: birth
  date: '1781'
  year_of: 1781
  precision: year
  is_circa: true
  description: 清乾隆四十六年，周济生，字保绪，号止庵、介存斋主人，江苏荆溪（今宜兴）人。
- id: guji-周济-event-word-begin
  title_zh: 少嗜填词，中更三变
  event_type: endeavor
  date: '1795'
  year_of: 1795
  precision: year
  is_circa: true
  description: 自谓「余少嗜此，中更三变，年逾五十，始识康庄」，由少年学词至暮年报一 贯，自悼冥行之艰。
- id: guji-周济-event-cibian
  title_zh: 次成《词辨》十卷并写本付田生
  event_type: endeavor
  date: '1812'
  year_of: 1812
  precision: year
  is_circa: true
  description: 向次《词辨》十卷：正、变、疵累、格调、纰缪、本事词话乃至庸选恶札各分卷次，写本付田生携行。
- id: guji-周济-event-wreck
  title_zh: 《词辨》稿本厄于黄河
  event_type: endeavor
  date: '1812'
  year_of: 1812
  precision: year
  is_circa: true
  description: 田生携稿附粮艘北行，衣袽不戒，厄于黄流，既无副本，惋叹而已；尔后稍稍追忆，仅存正、变两卷。
- id: guji-周济-event-reprint
  title_zh: 录存正、变两卷先付刻
  event_type: endeavor
  date: '1820'
  year_of: 1820
  precision: year
  is_circa: true
  description: 恐稿久而复失，先录付刻以俟将来，并于卷末自记述录之难，署「介存又记」。
- id: guji-周济-event-songxuan
  title_zh: 道光十二年冬记成《宋四家词选目录序论》
  event_type: endeavor
  date: '1832-12-09'
  year_of: 1832
  precision: day
  is_circa: false
  description: 道光十二年冬十一月八日，止庵周济记于春水怀人之舍，提出清真集大成，稼轩、碧山、梦窗为附庸领袖一代之说。
- id: guji-周济-event-late-sum
  title_zh: 晚岁论定坛坫，自树一帜
  event_type: endeavor
  date: '1835'
  year_of: 1835
  precision: year
  is_circa: true
  description: 晚年阐论「感慨所寄，不过盛衰」「词亦有史」之义，退苏进辛、纠弹姜张，足骇世而不改其诚。
- id: guji-周济-event-death
  title_zh: 周济卒
  event_type: death
  date: '1839'
  year_of: 1839
  precision: year
  is_circa: true
  description: 清道光十九年，周济卒，年为苏州府教授，年五十九。
