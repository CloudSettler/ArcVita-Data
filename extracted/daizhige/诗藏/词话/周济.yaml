person:
  qid: guji-周济
  name_zh: 周济
  names:
    zh: 周济
    en: Zhou Ji
  lifespan:
    birth:
      date: 1781
      precision: year
      is_circa: true
      raw: 乾隆四十六年
    death:
      date: 1839
      precision: year
      is_circa: true
      raw: 道光十九年
  birth_date: '1781'
  death_date: '1839'
  era: 清代中后期
  reign_ref: 乾隆、嘉庆、道光
  archetype: 词论家·常州词派理论集大成者
  dilemmas:
  - 「非寄托不入，专寄托不出」——词之寄托深浅与浑化无迹之间难以平衡
  - 尊北宋抑南宋、退苏进辛纠弹姜张，须直面时人推崇姜张、玉田的主流成见
  - 《词辨》十卷原本随粮艘沉失黄河，仅存正变两卷，补辑之力难继
  lesson: 词虽小道，然以一生心力三变而后识康庄；论词当见事多、识理透，使词有史，方足自树一帜。
  summary_first_person: 我是周济，字保绪，号止庵，人称介存先生。我少嗜填词，中更三变，年逾五十始识康庄。我推尊北宋、独重清真，以为稼轩、碧山、梦窗与清真四家领袖一代，提出「非寄托不入，专寄托不出」，为常州词派立论。我曾撰《词辨》十卷，稿厄于黄河，仅追忆存正、变两卷，又成《介存斋论词杂著》与《宋四家词选序论》，剖判两宋
    词家高下，退苏进辛、纠弹姜张，宁骇世而不改由中之诚。
  source_urls:
  - 人民文学出版社《介存斋论词杂著·復堂词话·蒿庵论词》一九五九年版录入
