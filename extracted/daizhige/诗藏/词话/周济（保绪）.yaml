person:
  qid: guji-周济
  name_zh: 周济
  names:
    zh: 周济、周保绪
    en: Zhou Ji
  lifespan:
    birth:
      precision: year
      is_circa: true
    death:
      precision: year
      is_circa: true
  era: 清代嘉庆、道光年间
  reign_ref: 嘉庆末年已成名，同张惠言（皋文）兄弟同里切磋词学
  archetype: 常州词派词人与词论家
  dilemmas:
  - 宗尚南唐北宋、以“有厚入无间” wording为独得之秘，须在浙派崇尚南宋之风盛行下独自探求唐人微旨
  lesson: 填词须得意内言外之旨，炼意炼辞兼备，方能深厚而不流于纤滑或质木
  summary_first_person: 我为阳湖人，与张皋文、翰风兄弟同里相切磋，又与董晋卿各致力于词，启古人不传之秘，举“有厚入无间”一语，欲上追南唐北宋，所作存审轩词于南唐北宋神似而非形似，为常州词派之眉目。
