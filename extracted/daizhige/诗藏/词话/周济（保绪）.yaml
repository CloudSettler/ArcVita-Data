  date: '-1810'
  year_of: 1810
  event_type: endeavor
  title_zh: 与张皋文兄弟、董晋卿切磋词学，倡“有厚入无间”
  description: 少年时与张皋文、翰风兄弟同里相切磋，又与董晋卿各致力于词，启古人不传之秘，举“有厚入无间”为独得之旨，常州诸公瓣香周秦以上，窥唐人微旨，先生其眉目
  endeavor_id: guji-周济-endeavor-1
- id: guji-周济-event-3
