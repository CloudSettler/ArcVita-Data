  decisions:
  - date: '1147'
    title_zh: 冒忌作《贺新郎》送胡铨谪新州
    rationale: 胡澹庵抗疏乞斩秦桧被谪，我以词送之，义之所在，虽忤权奸不避。
  - date: '1148'
    title_zh: 坐是除名后退居不仕
    rationale: 既为贼桧所疾而被削名，遂绝意仕途，以居士自处，保其气节。
- id: guji-张元干-endeavor-2
  name_zh: 与有节之士结交唱和
  phases:
  - key: brewing
    name_zh: 与杨补之、黄师宪等为气节之交
    labels:
      zh: 同道唱酬
    start_date: '1130'
  - key: climax
    name_zh: 集中寿词纷繁，人品曾起争议
    labels:
      zh: 毁誉交加
    start_date: '1145'
  decisions:
  - date: '1150'
    title_zh: 存削名之作于集中而不删
    rationale: 冯煦疑我始与桧周旋，至其秽德彰闻乃存词削名；去就之际，以节为先。
