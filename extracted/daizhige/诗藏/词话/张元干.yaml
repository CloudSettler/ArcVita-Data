  name_zh: 张元干
  names:
    zh: 张元干 / 芦川居士
    en: Zhang Yuangan
  lifespan:
    birth:
      date: '1091'
      precision: year
      is_circa: true
      raw: 约1091年
    death:
      date: '1161'
      precision: year
