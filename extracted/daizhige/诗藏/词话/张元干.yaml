      raw: 约1161年
  birth_date: '1091'
  death_date: '1161'
  era: 两宋之际
  reign_ref: 宋高宗绍兴年间
  archetype: 坚守气节的南渡词人
  dilemmas:
  - 直言抗恶而遭除名，与权奸周旋时的进退取舍
  - 词既为文末技，又欲以之寄托忠愤、眷怀旧君
  lesson: 泰山崩于前而守其节，词可怨乱而不失其爱君之心
  summary_first_person: 我是芦川居士张元干。南渡之后，我以《贺新郎》一阕送胡澹庵谪新州，因此触怒权相秦桧，被削除名籍。我不悔——与杨补之屡徵不起、黄师宪一官远徙一样，我守的是同一份高节。后人说我词中眷恋旧君，辞旨怨乱，宜为贼桧所疾；我却始终抱着“终是爱君”之心，如咏“琼楼玉宇”的苏轼一般。
  source_urls:
  - https://zh.wikisource.org/wiki/蒿庵论词
endeavors:
- id: guji-张元干-endeavor-1
  name_zh: 词坛创作与南渡悲歌
  phases:
