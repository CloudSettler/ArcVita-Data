  dilemmas:
  - 身居主战立场却须面对朝廷和议主势的倾轧
  - 词作忠愤激越与其仕宦进退之间的张力
  lesson: 眷怀君国、感愤淋漓之词，可以唤醒聋聩，不待论其工拙
  summary_first_person: 我是张孝祥，号于湖居士。乾道间我知建康府（一说留守建康），席上赋《六州歌头》，感愤淋漓，主人为之罢席；我又作《水调歌头》"雪洗虏尘静"、《木兰花慢》"拥貔貅万骑"、《浣溪沙》"霜日明霄"诸阕，皆眷怀君国之作，以忠愤之气随笔而出，期以唤醒当时聋聩。
  source_urls:
  - https://zh.wikisource.org/wiki/蒿庵论词
