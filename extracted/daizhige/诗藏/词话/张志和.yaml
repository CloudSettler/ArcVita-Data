  dilemmas:
  - 仕与隐：无心任运、放浪江湖，其兄松龄惧其不返而作诗唤归
  lesson: 无心任运，斜风细雨不须归；渔父之咏开出千古隐逸词家风调
  summary_first_person: 我号元真子，作渔父词五首传于江湖，「西塞山前白鹭飞，桃花流水鳜鱼肥」与「斜风细雨不须归」句，无心任运，浑然天成。黄鲁直尝以鹧鸪天续我遗事，览者谓其有心避患，与我之神理迥别。
