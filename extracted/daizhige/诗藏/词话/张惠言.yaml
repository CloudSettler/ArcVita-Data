  birth_date: '1761'
  death_date: '1802'
  era: 清代
  reign_ref: 乾隆、嘉庆
  archetype: 词学家、经学家、阳湖派与常州词派开创者
  dilemmas:
  - 以比兴寄托说词，虽或过度穿凿，然欲复古 RequestMethod 风骚之义
  - 治学与文学之间：兼治《易》《礼》之经学与词章之学
  lesson: 词不当仅为遣兴小道，而当上接风骚，以比兴寄托见君国之思
  summary_first_person: 我张惠言论词，主张比兴寄托，以为温庭筠以下诸家之词皆有风骚之义，士不遇之感与君国之忧皆寓其中，遂开常州词派之门。
endeavors:
- id: guji-张惠言-endeavor-1
  name_zh: 编《词选》、创常州词派
  phases:
  - key: brewing
    name_zh: 治经学与问学奠基
    labels:
      zh: 治《易》《仪礼》，兼攻词章
    start_date: '1780'
  - key: breakthrough
    name_zh: 编选《词选》并作论词之评点
    labels:
      zh: 嘉庆二年与弟张琦编《词选》
    start_date: '1797'
    highlight_event_id: guji-张惠言-event-compilation
  - key: climax
    name_zh: 以比兴寄托说各家词，批点温、韦、冯、晏、范、欧、苏、辛、姜、王诸家
    labels:
      zh: 温飞卿、韦端己、冯正中诸家词评
    start_date: '1797'
    highlight_event_id: guji-张惠言-event-commentary
  - key: closure
    name_zh: 身后其说经张琦、董士锡等推衍，常州词派蔚为大宗
    labels:
      zh: 影响周济、后世词学
    start_date: '1802'
  decisions:
  - date: '1797'
    title: 编《词选》以正词风
    rationale: 不满浙派末流之浮滑，欲以风骚比兴之义论词
- id: guji-张惠言-endeavor-2
  name_zh: 古文与经学研究
  phases:
  - key: brewing
    name_zh: 师法问学，攻《易》与《仪礼》
    labels:
      zh: 义法兼擅，为阳湖派古文大家
    start_date: '1780'
  - key: climax
    name_zh: 著《易》学、《仪礼》诸书，倡汉儒之说
    labels:
      zh: 与恽敬并称，开阳湖文派
    start_date: '1790'
  decisions:
  - date: '1790'
    title: 兼治汉学与古文
    rationale: 欲通经致用，以经义济文章
events:
- id: guji-张惠言-event-birth
  event_type: birth
  date: '1761'
  year_of: 1761
  summary: 张惠言生于常州武进。
- id: guji-张惠言-event-compilation
  event_type: endeavor
  date: '1797'
  year_of: 1797
  summary: 嘉庆二年，编《词选》，于诸家词后作评点，倡比兴寄托之说。
- id: guji-张惠言-event-commentary
  event_type: endeavor
  date: '1797'
  year_of: 1797
  summary: 《词选》评点中论温庭筠《菩萨蛮》“此感士不遇也”，谓“照花四句”有《离骚》初服之意；又以“庭院深深”殆为韩、范而作，说词皆主寄托。
- id: guji-张惠言-event-death
  event_type: death
  date: '1802'
  year_of: 1802
  summary: 嘉庆七年卒，年四十许，常州词派之义由后人推衍光大。
