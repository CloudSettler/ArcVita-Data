  birth_date: 约1248年（淳祐戊申）
  era: 宋末元初
  reign_ref: 宋恭帝、宋亡之后入元
  archetype: 词人
  dilemmas:
  - 身为循王张俊五世孙而遭宋亡，遁迹江湖，家国之痛与以词谋生之间徘徊
  - 曾见南宋盛世，所作苍凉激楚，身世盛衰之感难以排遣
  lesson: 身经盛衰巨变者，其词非徒翦红刻翠，而是即景抒情、备写身世；精研声律可自成一家
  summary_first_person: 我是张炎，字玉田，循王张俊五世孙。生于淳祐戊申，宋恭帝时已至中年，亲见南宋盛时。宋亡后遁迹不仕，工词，以咏春水得名。我精研声律，尤得神解，故所作苍凉激楚，备写身世盛衰之感，堪为词学后劲。
