person:
  qid: guji-晏殊
  name_zh: 晏殊
  names:
    zh: 晏殊
    en: Yan Shu
  lifespan:
    birth:
      date: '991'
      precision: year
      is_circa: true
      raw: ''
    death:
      date: '1055'
      precision: year
      is_circa: false
  birth_date: '991'
  death_date: '1055'
  era: 北宋
  reign_ref: 宋真宗、宋仁宗朝
  archetype: 文人政治家
  dilemmas:
  - 位极台辅而作闲雅小词，富贵气象与暮年感伤并存的身份张力
  lesson: 得句难对不废求人，闻善则举，风雅与其高位相成。
  summary_first_person: 我晏殊，世称晏元献公。赴杭州途中过扬州大明寺，闭目听侍吏诵壁间诗板而不问名爵，因此发现江都尉王琪。与之同游池上，我用语人自称尝写于壁的「无可奈何花落去」一句，多年未得将对，王琪应声以「似曾相识燕归来」对之，我即辟置其为馆职。此联见于我所作《浣溪沙》「一曲新词酒一杯」，词评家以为天成一段词，非诗可比。
endeavors:
- id: guji-晏殊-endeavor-1
  name_zh: 填词crire《浣溪沙》等小令
  labels:
    zh:
    - 词林正宗
    - 元献词章
  phases:
  - key: breakthrough
    name_zh: 名句锤炼
    labels:
      zh:
      - 得句书壁
    start_date: '1040'
    highlight_event_id: guji-晏殊-event-word
  - key: climax
    name_zh: 一联天成
    labels:
      zh:
      - 澹语深情
    start_date: '1042'
    highlight_event_id: guji-晏殊-event-duilian
  decisions:
  - date: '1030'
    title_zh: 得句书于墙壁、经年不废求对
    rationale: 弥年未尝强对，宁存佳句而不苟合。
  - date: '1042'
    title_zh: 纳王琪之对并录成词
    rationale: 王琪应声属对天然，遂盘桓同游，留其句成篇。
- id: guji-晏殊-endeavor-2
  name_zh: 识拔寒俊、甄录馆职
  labels:
    zh:
    - 汲引后进
    - 知人善任
  phases:
  - key: brewing
    name_zh: 幕录诗板
    labels:
      zh:
      - 冥目听诵
    start_date: '1040'
    highlight_event_id: guji-晏殊-event-shibban
  - key: breakthrough
    name_zh: 辟置馆职
    labels:
      zh:
      - 擢王琪
    start_date: '1042'
    highlight_event_id: guji-晏殊-event-bizhi
  decisions:
  - date: '1040'
    title_zh: 戒侍吏诵诗勿言爵里
    rationale: 不以名位取人，惟以诗艺甄别。
  - date: '1042'
    title_zh: 辟王琪置馆职
    rationale: 王琪应对敏捷有才，宜置清近之地。
events:
- id: guji-晏殊-event-birth
  year_of: 991
  date: '991'
  title_zh: 晏殊生
  description: 北宋临川人，后官至宰辅，谥元献，世称晏元献公。
- id: guji-晏殊-event-shibban
  year_of: 1040
  date: '1040'
  precision: year
  title_zh: 过扬州大明寺闭目听诵诗板
  description: 赴杭州道过维扬憩大明寺，冥目徐行，使侍吏诵壁间诗板，戒其勿言爵里名姓，终篇者无几，由此得知王琪之诗。
- id: guji-晏殊-event-duilian
  year_of: 1042
  date: '1042'
  precision: year
  title_zh: 池上得王琪对句「似曾相识燕归来」
  description: 与王琪同饮同步游池上，以「无可奈何花落去」求对，王琪应声对出「似曾相识燕归来」，六字一联，天成一段词。
- id: guji-晏殊-event-word
  year_of: 1042
  date: '1042'
  precision: year
  title_zh: 作《浣溪沙》「一曲新词酒一杯」
  description: 名联「无可奈何花落去，似曾相识燕归来」入词，沈际飞评为律诗俊语而自是天成一段词。
- id: guji-晏殊-event-bizhi
  year_of: 1042
  date: '1042'
  precision: year
  title_zh: 辟置王琪为馆职
  description: 因赏其才，由此辟置馆职，奖掖后进。
- id: guji-晏殊-event-death
  year_of: 1055
  date: '1055'
  title_zh: 晏殊卒
  description: 卒于北宋仁宗朝，谥元献。
