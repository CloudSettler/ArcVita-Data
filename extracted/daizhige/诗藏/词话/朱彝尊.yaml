- id: guji-朱彝尊-event-death
  title_zh: 朱彝尊卒
  date: '1709'
  year_of: 1709
  type: death
  description: 康熙四十八年卒。陈廷焯列其为古今圣于词者五家之一，谓其词具「气骨」，朱陈之后有太鸿，而竹垞与白石并峙千古。
