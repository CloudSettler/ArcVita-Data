person:
  qid: guji-朱彝尊
  name_zh: 朱彝尊
  names:
    zh: 朱彝尊 / 朱竹垞 / 竹垞
    en: Zhu Yizun
  lifespan:
    birth:
      date: '1629'
      precision: year
      is_circa: false
      raw: 明崇祯二年
    death:
      date: '1709'
      precision: year
      is_circa: false
  birth_date: '1629'
  death_date: '1709'
  era: 清初
  reign_ref: 康熙
  archetype: 词学家·词人
  dilemmas:
  - 词学宗尚之争：陈廷焯谓「论词者以北宋为最」，而竹垞独推南宋，洵独得之境，后人往往宗其说
  - 自题词称「不师秦七，不师黄九，倚新声玉田差近」，自谦取法玉田，实则借径而自得之妙，虽玉田亦当避一席
  lesson: 词贵疏密相间、一以雅正为宗：竹垞词浓淡相兼、疏密相称，兼吴梦窗之密与张玉田之疏，诚千古词坛之圭臬
  summary_first_person: 我朱彝尊，号竹垞，清初秀水人。我词源出白石而绝不相似，艳而不浮，疏而不流，兼吴、张两家之妙。我独推南宋，所选《词综》三十八卷，一以雅正为宗。与陈其年同举鸿博、并峙词坛，世以朱陈为清词之冠。
  source_urls:
  - 词坛丛话（清·陈廷焯）
