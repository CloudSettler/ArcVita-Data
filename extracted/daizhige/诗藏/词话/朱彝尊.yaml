  date: '1670'
  year_of: 1670
  type: endeavor
  endeavor_id: guji-朱彝尊-endeavor-1
  is_circa: true
  description: 咏物诸作杯水可以作波涛，一篑可以成泰山；感怀之作笔随意到，信手拈来都成异彩。
- id: guji-朱彝尊-event-cizong
