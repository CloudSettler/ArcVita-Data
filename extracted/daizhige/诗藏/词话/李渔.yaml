  dilemmas:
  - 上不似诗、下不类曲，须立于二者之间而辨雅俗分界
  - 填词求新，又忌搜古冢秘笈、僻句冷字以示新艳
  lesson: 意新为上，语新次之；妥与确总不越一理字，欲句惊人先求理服众。
  summary_first_person: 我李渔作词讲有别于诗、近于曲腔，主张一气如话、如话则易解，曾著《闲情偶寄》以生平底里和盘托出。
