  birth_date: 约1897年
  death_date: 约1941年
  era: 民国
  reign_ref: 民国时期
  archetype: 诗人与诗论家
  dilemmas:
  - 诗界泥古与食古不化之风盛行，欲以今语今物入诗而不为时人容
  - 于旧体诗词传统与当代现实生活之间求取融通
  lesson: 字句无所谓雅俗，仅有生熟之分；善为诗词者化生为熟，虽俗亦雅。
  summary_first_person: 我林庚白，民国间以诗鸣于世，著《孑楼诗词话》。力主诗词当写今人今日之真实情境，讥同光以来诗人泥古刻鹄，亦论列鲁迅、柳亚子、黄晦闻诸家之作，取其辞意并茂、化俗为雅者而扬扢之。
  source_urls:
  - source://孑楼诗词话
