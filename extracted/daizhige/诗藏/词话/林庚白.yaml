person:
  qid: guji-林庚白
  name_zh: 林庚白
  names:
    zh: 林庚白
    en: Lin Gengbai
  lifespan:
    birth:
      date: '1897'
      precision: year
      is_circa: true
      raw: 约1897年
    death:
