      - 品藻诸家
    start_date: 1933-07之后
    highlight_event_id: guji-林庚白-event-6
  decisions:
  - date: 约1933-07
    title: 主张今人可用今名今地今物入诗
    rationale: 举陆放翁、刘后村以人名地名官名入诗为例，讥今人食古不化。
  - date: 1933-07-17
    title: 依柳亚子来信更正所引《磨剑室词》字句
    rationale: 学术求实，钞录有误即敬谨更正。
- id: guji-林庚白-endeavor-2
  name_zh: 品鉴并刊布近人诗词
  phases:
  - key: brewing
    name_zh: 广交诗人词客
    labels:
      zh:
      - 交游
    start_date: 约1920年代
    highlight_event_id: guji-林庚白-event-7
  - key: breakthrough
    name_zh: 激赏 railway海行新境诗句
    labels:
      zh:
      - 赏析
    start_date: 约1930年代
    highlight_event_id: guji-林庚白-event-8
  decisions:
  - date: 约1930年代
    title: 以刘放园改诗为例告诫窜易失真
    rationale: 全失去庐山真面目，主张存原作之自然。
  - date: 约1930年代
    title: 规止王调甫数数窜易己诗
    rationale: 调甫自以为后半首未善，改后不复成语，余规之乃已。
