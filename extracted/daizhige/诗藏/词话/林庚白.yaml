  summary: 与李拔可、刘放园、王礼锡、曾履川等诗人交游唱和，获读诸家新作。
- id: guji-林庚白-event-8
  type: endeavor
  date: 约1932-01-01
  year_of: 1932
  summary: 激赏李拔可“车行追落日，淮泗失回顾”及曾履川《黑水洋》一律，推许写火车轮船新情境之诗。
