  birth_date: 约984
  death_date: 约1053
  era: 北宋仁宗朝
  reign_ref: 宋仁宗
  archetype: 婉约词宗·慢词开创者
  dilemmas:
  - 科举功名与倚声填词之间的取舍：因好为淫冶讴歌之曲被仁宗黜落，长期流连坊曲
  lesson: 以俚俗语言入词，曲曲折折中具浑沦之气，开出慢词一派，虽失意科场而精光不灭
  summary_first_person: 我初名柳三变，因好为讴歌之曲而有“忍把浮名，换了浅斟低唱”之句，被仁宗特落其榜。景祐元年方及第，后改名柳永，才得磨勘转官。我失意无俚，流连坊曲，尽收俚俗语言编入词中，以便伎人传习，一时动听，散播四方。慢词自仁宗朝而起，实自我开始。我一生精力尽在倚声，虽多俚语，高处足冠群流。
  source_urls:
  - https://zh.wikisource.org/wiki/樂府餘論
