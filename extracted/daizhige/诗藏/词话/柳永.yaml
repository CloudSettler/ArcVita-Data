events:
- id: guji-柳永-event-birth
  date: 约984
  year_of: 984
  title_zh: 柳永生
  description: 生年不详，约生于北宋初期；初名三变，字耆卿。
- id: guji-柳永-event-tiange
  date: 约1024
  year_of: 1024
  title_zh: 鹤冲天词成，仁宗特落其榜
  description: 进士柳三变好为淫冶讴歌之曲，传播四方，尝有鹤冲天词云“忍把浮名，换了浅斟低唱”；及临轩放榜，仁宗特落之曰“且去浅斟低唱，何要浮名”。
- id: guji-柳永-event-jidi
  date: '1034'
  year_of: 1034
  title_zh: 景祐元年方及第
  description: 景祐元年登第，后改名永，方得磨勘转官。
- id: guji-柳永-event-manman
  date: 约1030
  year_of: 1030
  title_zh: 流连坊曲，开慢词之风
  description: 耆卿失意无俚，流连坊曲，遂尽收俚俗语言编入词中，以便伎人传习，一时动听，散播四方；词自南唐以后但有小令，其慢词盖起宋仁宗朝。柳词曲折委婉，中具浑沦之气，虽多俚语，高处足冠群流，一生精力尽在倚声。
- id: guji-柳永-event-death
  date: 约1053
  year_of: 1053
  title_zh: 柳永卒
  description: 蹉跎于仁宗朝，及第已老；卒年不详，官终屯田员外郎，世称柳屯田。
