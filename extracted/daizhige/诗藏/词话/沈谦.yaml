      raw: 生年不详，约明天启年间
    death:
      date: '1670'
      precision: year
      is_circa: true
      raw: 卒年不详，约清康熙初年
  birth_date: 约1620
  death_date: 约1670
  era: 清初
  reign_ref: 清顺治、康熙年间
  archetype: 词论家
  dilemmas:
  - 词上不可似诗，下不可似曲，须自立体制，贵在自运
  - 白描不可近俗，修饰不得太文，生香真色在离即之间
  - 学周柳得其情、学苏辛得其气，当以离处为合
  lesson: 立意贵新，设色贵雅，构局贵变，言情贵含蓄，词贵于移情
  summary_first_person: 我沈谦，清初论词之人，撰《填词杂说》，论词承诗启曲，贵在移情，小令中调长调各有作法，评骘唐宋诸家得失，兼自述少时和唐宋词三百阕之事，以为作词要不亢不卑、言情贵含蓄。
  source_urls:
    -源': https://zh.wikisource.org/wiki/填词杂说
