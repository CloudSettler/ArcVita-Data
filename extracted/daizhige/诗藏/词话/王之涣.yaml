  detail_zh: 与王昌龄、高适会于旗亭，梨园伶官招妓聚燕。三人私约曰：「我辈擅诗名，未定甲乙，试观诸伶讴诗分优劣。」
  tags:
  - 文坛轶事
- id: guji-王之涣-event-climax
  date: 0718
  year_of: 0718
  title_zh: 伶妓歌凉州词，之涣胜出
  detail_zh: 伶人先唱昌龄二绝句、高适一绝句。之涣指诸妓中最佳者曰：「如非我诗，终身不敢与子争衡。」须臾妓唱「黄沙远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关」，之涣揶揄二子曰：「田舍奴，我岂妄哉！」
  tags:
  - 诗名之争
- id: guji-王之涣-event-death
