  - 与王昌龄、高适势均力敌，诗名高下未定
  - 身处盛世而仕途不显，以诗自见
  lesson: 真正的佳作自有公论，不必自夸，时机到时自会证明。
  summary_first_person: 我是唐代诗人王之涣，与王昌龄、高适齐名。开元中我们三人同至旗亭饮酒，私约以伶人所歌诗多者定优劣。伶人先唱二子之作，我指诸妓中最佳者说，她若不唱我诗，终身不敢与二子争衡。片刻，
    optimum妓果唱「黄河远上白云间」一绝，我笑二子为田舍奴。以此知唐时伶伎取名士诗句入曲，本是常俗。
