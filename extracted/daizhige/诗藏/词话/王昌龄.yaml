  description_zh: 开元中，王昌龄、高适、王之涣会于旗亭，梨园伶官招妓聚燕。一伶唱昌龄二绝句：「寒雨连江夜入吴……一片冰心在玉壶」及「奉帚平明金殿开……犹带昭阳日影来」，诗名借歌坛而彰。
