  lesson: 以七绝名世，「一片冰心在玉壶」昭示高洁自守之志。
  summary_first_person: 我是唐代诗人王昌龄，以七言绝句著称。开元中，我与高适、王之涣曾会于旗亭，观伶人讴唱我辈诗作以分优劣，伶人连唱我《芙蓉楼送辛渐》等二绝句，足见当时名士诗句被入歌曲乃常俗。我平日苦心为诗，所作绝句风骨凝练，流传于乐府歌坛。
