  dilemmas:
  - 少好侠尚气力，结交轻剽少年，後改节博学，由豪侠转为循吏
  - 诛讨王莽篡汉之名相翟义门人所歌咏的清官典范，身处吏治侵蚀百姓之世
  lesson: 为官清正、吏不侵枉，则民自发德之，立祠千载
  summary_first_person: 我是广汉郪人王涣，字稚子，父顺曾任安定太守。少年时好行侠使气，与轻狂少年交游；晚年改节，潜心学问，精通法律。举茂才後历任温县县令、兖州刺史、侍御史，再转任洛阳令。断狱清明，揭发奸邪如神，狱讼止息，行人野外放牧皆托名于我而不惧失盗。元兴初病卒，百姓老少嗟叹，沿途设祭，立祠于安阳亭。邓太后下诏褒美，拜我子石为郎。后帝崇黄老毁诸祠庙，惟我与卓茂之庙得存。
