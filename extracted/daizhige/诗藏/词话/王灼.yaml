  dilemmas:
  - 考订曲调源流，需在诸家小说传闻与史志正说之间辨伪存真
  - 古曲谱散佚，名义与宫调多有失解，考据难全
  lesson: 辨正声歌递变之由，考见倚声所自始，方为考古之资。
  summary_first_person: 我王灼，字晦叔，遂宁人，绍兴中尝为幕僚。我著有《糖霜谱》，又撰《碧鸡漫志》一卷，评论曲调源流：前七条总论上古至唐宋声歌递变之由，次列凉州等二十八调，一一溯其得名缘起及渐变宋词之沿革，核其名义，正其宫调，以著倚声所自始。
  source_urls:
  - https://www.kongfz.com/碧鸡漫志
