  title_zh: 著《饮水词》，奠定清代词坛大家地位
  description: 林庚白评曰：容若所著《饮水词》，在清代词苑中无愧大家之地位，其才力、工力皆远轶朱彝尊、厉鹇；其短调"心灰尽，有发未全僧……情在不能醒"，佳处较后主更为有力，味在弦外，弥足珍诵。
