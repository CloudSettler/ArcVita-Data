  birth_date: 1655-01-19
  death_date: 1685-07-01
  era: 清代
  reign_ref: 康熙
  archetype: 词人
  dilemmas:
  - 身处权贵之家而词多哀婉郁结，"情在不能醒"，生性深情与仕宦处境相纠缠
  lesson: 词以真挚自然取胜，不待雕镂而臻绝诣，短调尤见才情
  summary_first_person: 我即容若。林庚白《孑楼诗词话》称我所著《饮水词》在清代词苑中无愧大家之地位，谓似又胜竹垞（朱彝尊）、樊榭（厉鹇），才力、工力皆远轶朱、厉。又举我《忆江南》短调"心灰尽，有发未全僧……情在不能醒"，以为其佳处较后主"流水落花春去也，天上人间"更为有力，"情在不能醒"五字似为近代沉溺于爱河者作写照，味在弦外，弥足珍诵。
