  birth_date: '1808'
  death_date: '1867'
  era: 清
  reign_ref: 道光
  archetype: 词人词话作者
  dilemmas:
  - 才名盖世而境遇坎坷，中年遭蜚语，易僧服遁世，忧患余生后概从摈弃早年诗词之作
  - 词学欲上追南唐北宋，以有厚入无间为独得之秘，然著述多生前未能成书，身后散佚
  lesson: 炼意炼辞断不可少；词以意在言外、深厚蕴藉为归。
  summary_first_person: 我蒋敦复，号剑人，生平最得意于词，所作欲上追南唐北宋，尝以'有厚入无间'一语为不传之秘；中年抑郁无俚，被蜚语后易僧服避地南汇，忧患余生，身前多未刊定，身后赖友人搜遗付梓。
  source_urls:
  - https://zh.wikisource.org/wiki/芬陀利室词话
