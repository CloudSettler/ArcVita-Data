- id: guji-蒋敦复-event-2
  date: '1842'
  year_of: '1842'
  type: endeavor
  endeavor_id: guji-蒋敦复-endeavor-2
  description: 道光壬寅间被蜚语，易僧服避人于南汇，栖荷花坞栀子庵，书"绣佛前"三字，与顾澹园、王四篁等订方外交。
- id: guji-蒋敦复-event-3
  date: '1850'
  year_of: '1850'
  type: endeavor
  endeavor_id: guji-蒋敦复-endeavor-3
  description: 撰芬陀利室词话三卷，论周保绪、冯登府、周之琦诸家词，倡意内言外、有厚入无间之旨。
- id: guji-蒋敦复-event-4
  date: '1885'
  year_of: '1885'
  type: endeavor
  endeavor_id: guji-蒋敦复-endeavor-4
  description: 光绪十一年，其子伯威携词话三卷、兵鉴四卷诣王韬，王韬于淞隐庐为文记述，遗集悉付刊刻。
- id: guji-蒋敦复-event-death
  date: '1867'
  year_of: '1867'
  type: death
  description: 蒋敦复约卒于清同治年间，生前著述多未成书，身后赖友人搜刻传世。
