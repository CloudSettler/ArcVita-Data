  archetype: 乱世词人
  dilemmas:
  - 身处咸丰兵乱世局，寄寓江北，穷愁而词愈工
  - 与黄婉君聚散离合，恩极生怨，终殉情而死
  lesson: 乱世沉沦之才，哀感顽艳，穷而愈工，遂为倚声家老杜
  summary_first_person: 我是江阴蒋春霖，号鹿潭，著《水云楼词》，多清商变徵之音，谭仲修谓咸丰兵事天挺此才，为倚声家老杜。我曾权东台场大使，乱世中与四方才士寄寓江北，以词鸣世，终为黄婉君之事而卒。
  source_urls:
  - 小三吾亭词话·卷一（冒广生）
