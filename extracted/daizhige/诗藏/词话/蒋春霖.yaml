  description: 蒋春霖生于江阴，约1818年（原文未载，据考）。
- id: guji-jiangchunlin-event-early-ci
  event_type: literary_activity
  date: '1835'
  year_of: 1835
  precision: year
  is_circa: true
  description: 早年工填词，学姜白石一派，为日后《水云楼词》之作基。
- id: guji-jiangchunlin-event-magistrate
  event_type: official_appointment
  date: '1850'
  year_of: 1850
  precision: year
  is_circa: true
  description: 尝权东台场大使。
- id: guji-jiangchunlin-event-jiangbei
  event_type: residence
  date: '1853'
  year_of: 1853
  precision: year
  is_circa: true
  description: 咸丰兵事带甲天地，四方才士多寓江北，若王雨岚、杨柳门、姚西农、黄琴川、钱揆初、黄子湘诸人皆以诗名，翁与之游。
- id: guji-jiangchunlin-event-pipa-xian
  event_type: literary_activity
  date: '1860'
  year_of: 1860
  precision: year
  is_circa: true
  description: 偕黄婉君泛舟黄桥，望见烟水，念五湖之志苦不得遂，谱《琵琶仙》词，使婉君歌之，其声甚哀。
- id: guji-jiangchunlin-event-shuiyunlou
  event_type: literary_activity
  date: '1862'
  year_of: 1862
  precision: year
  is_circa: true
  description: 著《水云楼词》，多清商变徵之音，流别甚正，谭仲修谓为倚声家老杜；集中如《一萼红》《忆旧游》《淡黄柳》《渡江云》《琵琶仙》诸阕。
- id: guji-jiangchunlin-event-death-wanjun
  event_type: death_event
  date: '1868'
  year_of: 1868
  precision: year
  is_circa: true
  description: 所昵黄婉君聚散离合，恩极生怨，鹿翁卒为婉君而死；婉君亦以死殉鹿翁，濒死向陈百生再拜乞佳传，从容就绝。
- id: guji-jiangchunlin-event-bingshen
  event_type: literary_activity
  date: '1896'
  year_of: 1896
  precision: year
  is_circa: true
  description: 丙申丁酉间，冒广生寓吴门，识其犹子玉棱，以鹿翁随狙拾椽图属题，始得读翁词集及东淘杂诗，其词遂传。
