  dilemmas:
  - 出身贵胄却淡泊名利，弃官归隐与家族期望之间的冲突
  - 身为西域人却深耕汉文学传统，身份与文风的融合抉择
  lesson: 以旷达之笔写江湖之思，富贵浮云，诗酒自适，方得文章真趣
  summary_first_person: 我是贯云石，号酸斋，出身贵胄却厌倦仕途，弃官浪迹江湖，以散曲乐府寄情山水。澹斋杨朝英选《阳春白雪》时曾徵我作序，我也以知音之评酬答词林诸友。
  source_urls:
  - https://zh.wikipedia.org/wiki/贯云石
