  archetype: 词人
  dilemmas:
  - 出身武职门荫而志在文学，仕途沉沦下僚
  - 词风兼具刚健与婉丽，时人难以归类
  lesson: 博采众长而不失本色，方回词如云烟缥缈，天下莫能肖其神
  summary_first_person: 我贺铸，字方回，北宋词人。陈廷焯评我词"笔墨之妙，真乃一片化工"，谓宋词圣手五家，我与周美成并居其列。
  source_urls:
  - https://zh.wikipedia.org/wiki/贺铸
