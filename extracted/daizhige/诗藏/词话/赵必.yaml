    start_date: 1278-03
    highlight_event_id: guji-赵必象-event-wenxiangxiang
  - key: closure
    name_zh: 退隐著覆瓿集
    labels:
      zh: 遗民著述
    start_date: 1280
    highlight_event_id: guji-赵必象-event-yinju
  decisions:
  - date: 1276
    title_zh: 献策建宋号、尊宋主而后举兵
    rationale: 师出无名则盗，建宋号可正名义，事成可雄一方，不成亦垂不朽。
  - date: 1276
    title_zh: 捐家资三千缗、米五百石赡军
    rationale: 熊飞欲尽括邑人财，请以己赀代之，宽邑人之力以免骚扰。
events:
- id: guji-赵必象-event-birth
  date: ''
  year_of: ''
  name_zh: 赵必象生
  description_zh: 生年不详，东莞人，字玉渊，系出濮安懿王。
- id: guji-赵必象-event-jinshi
  date: 1265
  year_of: 1265
  name_zh: 咸淳乙丑与父崇䛆同登进士
  description_zh: 父子同科及第，后官朝散郎、佥书惠州军事判官。
- id: guji-赵必象-event-huizhou
  date: 1278
  year_of: 1278
  name_zh: 德祐间佐惠州军务
  description_zh: 惠州守文璧辟为从事，参与地方军政。
- id: guji-赵必象-event-xiongfei
  date: 1276
  year_of: 1276
  name_zh: 劝熊飞建宋号举兵入城
  description_zh: 语熊飞曰师出无名是为盗，宜建宋号、通二使、尊宋主而后举兵；飞深然之，即日署虎旗举兵，梁雄飞遁去。
- id: guji-赵必象-event-juan
  date: 1276
  year_of: 1276
  name_zh: 捐家赀三千缗、米五百石赡军
  description_zh: 飞议尽括邑人财以充军实，群情汹汹，必象请以家赀代之，乞宽邑人之力，飞从之。
- id: guji-赵必象-event-wenxiangxiang
  date: 1278-03
  year_of: 1278
  name_zh: 谒文天祥论时事，辟军事判官
  description_zh: 文天祥复东州，往谒论时事，慷慨泣下；天祥义之，辟为军事判官兼知录事。十一月天祥被执于五坡岭，必象遁归。
- id: guji-赵必象-event-bucu
  date: 1280
  year_of: 1280
  name_zh: 辞元将仕郎象州儒学教授
  description_zh: 明年宋亡，元以故官便授将仕郎象州儒学教授，不赴。
- id: guji-赵必象-event-yinju
  date: 1280
  year_of: 1280
  name_zh: 退隐温塘，泣拜文丞相像，著覆瓿集
  description_zh: 退隐邑之温塘，足迹不入城市；惟东走甲子门望山伏地大哭，画天祥像朝夕泣拜；著覆瓿集五卷，附长短句一卷，著录四库全书。
- id: guji-赵必象-event-death
  date: ''
  year_of: ''
  name_zh: 赵必象卒
  description_zh: 卒年不详，以遗民终老温塘。
