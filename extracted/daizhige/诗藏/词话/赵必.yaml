person:
  qid: guji-赵必象
  name_zh: 赵必象
  names:
    zh: 赵必象（赵秋晓、玉渊）
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: 卒年不详（宋亡后退隐）
  birth_date: ''
  death_date: ''
  era: 南宋末至宋元之际
  reign_ref: 咸淳、德祐、景炎
  archetype: 忠义遗民词人
  dilemmas:
  - 宋亡后元授官职，出仕新朝以养家，还是退隐以全气节？
  - 熊飞欲尽括邑人财物充军，护乡还是全力助军？
  lesson: 亡国之后，不出仕、不入城、朝夕泣拜忠臣遗像，诗文词章寓家国之思，可使气节垂不朽。
  summary_first_person: 我系出宋宗室濮安懿王之后，咸淳乙丑与父崇䛆同登进士，曾佐惠州军务。宋亡之际，我劝熊飞建宋号举兵，散家财以宽邑人；文天祥被执后我遁归故乡，元授学官不赴，退隐温塘，画文丞相像朝夕泣拜，著覆瓿集，词取法清真，寄黍离之悲。
  source_urls:
  - https://zh.wikisource.org/wiki/粤十三家集
