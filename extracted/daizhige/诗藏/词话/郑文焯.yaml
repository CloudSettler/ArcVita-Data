  description_zh: 高密郑叔问先生（文焯），生年史补为约1856。
- id: guji-郑文焯-event-poem-young
  year_of: 1867
  date: 1867
  date_precision: year
  type: career
  name_zh: 年十一赋樱桃沟绝句
  description_zh: 年十一，侍先中丞公游雒阳，樱桃沟观春，率成绝句，其时未识江南梅黄天气，率尔操觚，意若有会。
- id: guji-郑文焯-event-ke-wu
  year_of: 1881
  date: 1881
  date_precision: year
  type: career
  name_zh: 廿五岁南游客吴
  description_zh: 迨廿五岁，南游客吴，每值满城梅雨，襟袖酥凝，少作转成落南之诗谶。
- id: guji-郑文焯-event-pijiao
  year_of: 1890
  date: 1890
  date_precision: year
  type: career
  name_zh: 批校东坡乐府、清真集、白石道人歌曲、梦窗稿、花间集
  description_zh: 凡前人词集，经先生批校者散在海内藏家，不可指数，各家或一本，或屡经批校至三四本，莫不朱黄满纸，具有精意。
