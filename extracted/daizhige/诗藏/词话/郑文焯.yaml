  date: 1910
  date_precision: year
  type: career
  name_zh: 撰论词手简
  description_zh: 郑大鹤先生论词手简，後由番禺叶恭绰遐庵辑录为附录。
- id: guji-郑文焯-event-ci-hua-bian
  year_of: 1930
  date: 1930
  date_precision: year
  type: event
  name_zh: 龙沐勋辑大鹤山人词话
  description_zh: 唐圭璋议汇刊词话，龙沐勋搜辑遗佚，拟汇录先生批校各集为大鹤山人词话，以报唐君。
