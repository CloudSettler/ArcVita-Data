person:
  qid: guji-陆游
  name_zh: 陆游
  names:
    zh: 陆游
    en: Lu You
  lifespan:
    birth:
      date: '1125'
      precision: year
      is_circa: false
      raw: 宣和七年
    death:
      date: '1210'
      precision: year
      is_circa: true
  birth_date: '1125'
  death_date: '1210'
  era: 南宋
  reign_ref: 南渡诸帝之世
  archetype: 爱国诗人兼词人
  dilemmas:
  - 以诗人之言为词，近雅而不袭词人之冶荡，风格介于东坡、淮海之间而难造其极
  - 身处南渡，怀抱君国之思而不得志于恢复大业
  lesson: 诗心入词，独往独来，终成剑南一派刚健沈郁之风
  summary_first_person: 我是放翁，世称剑南。我屏除纤艳，作词独往独来，逋峭沈郁，求之有宋诸家无可方比。论者谓我欲驿骑东坡、淮海之间，奄有其胜；我亦拳拳君国，志在恢复，后人以我与稼轩、后村并峙为三足。
  source_urls:
  - https://zh.wikisource.org/wiki/蒿庵论词
