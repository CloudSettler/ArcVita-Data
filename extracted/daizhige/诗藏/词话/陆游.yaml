    title_zh: 屏除纤艳，独往独来作词
    rationale: 不袭词人之冶荡，以诗人雅正之言入词，求之有宋诸家无可方比
  - date: '1180'
    title_zh: 兼取东坡豪放与淮海深婉
    rationale: 据《提要》所论，欲驿骑东坡、淮海之间，奄有其胜
