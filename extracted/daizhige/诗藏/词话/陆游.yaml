    title_zh: 身当南渡之世，志在恢复
    rationale: 生丁南渡，拳拳君国；志在有为，不欲以词人自域
events:
- id: guji-陆游-event-birth
  name_zh: 陆游出生
  date: '1125'
  year_of: 1125
  description: 陆游生，字务观，号放翁，后因居蜀地作《剑南诗稿》而世称剑南。
  participants:
  - guji-陆游
- id: guji-陆游-event-southern-song
  name_zh: 生丁南渡
  date: '1127'
  year_of: 1127
  description: 北宋覆亡、宋室南渡，陆游身处其世，故词中拳拳君国，情感似放翁本色。
  participants:
  - guji-陆游
- id: guji-陆游-event-word-style
  name_zh: 词风屏除纤艳、独往独来
  date: '1153'
  year_of: 1153
  description: ' 冯煦《蒿庵论词》评："剑南屏除纤艳，独往独来，其逋峭沈郁之概，求之有宋诸家，无可方比。"'
  participants:
  - guji-陆游
- id: guji-陆游-event-patriotism
  name_zh: 以爱国情怀贯注诗
  date: '1170'
  year_of: 1170
  description: 陆游拳拳君国，诗中每抒恢复之志；后村词"似放翁"即指此忠爱之心。
  participants:
  - guji-陆游
- id: guji-陆游-event-status
  name_zh: 词坛地位论定
  date: '1180'
  year_of: 1180
  description: 《提要》谓陆游"欲驿骑东坡、淮海之间，奄有其胜"；冯煦谓"或非放翁之本意"。后村词与放翁、稼轩犹鼎三足，足见其地位。
  participants:
  - guji-陆游
- id: guji-陆游-event-death
  name_zh: 陆游去世
  date: '1210'
  year_of: 1210
  description: 陆游卒，约嘉定三年。词名与诗名并著，后世与辛弃疾、刘克庄并称三足。
  participants:
  - guji-陆游
