  birth_date: '1143'
  death_date: '1194'
  era: 南宋
  reign_ref: 绍兴至绍熙年间
  archetype: 豪傑词人 / 事功志士
  dilemmas:
  - - 才气相若而抱负难伸，与辛弃疾气谊相合却共处郁郁不得志之世
  - - 志在恢复大义，词中「据地一呼吾往矣」与「这话只成癡绝」的自相激励与自嘲
  lesson: 豪杰之词发自气谊怀抱，言近指远，虽遭时 sop抑塞，犹以元分人物自持
  summary_first_person: 我陈同甫与稼轩为友，才相若而词亦相似。我作〈贺新郎〉数阕酬答寄怀，气谊怀抱尽在其中；又有一阕〈水龙吟〉，恨芳菲世界游人未赏，都付与莺和燕，言近指远，直有宗留守大呼渡河之意。
