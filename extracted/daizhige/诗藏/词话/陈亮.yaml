events:
- id: guji-陈亮-event-birth
  type: 出生
  date: '1143'
  year_of: 1143
  place: 浙江永康
  description: 陈亮（字同甫）生於南宋，后与辛弃疾并为豪杰之词的代表。
- id: guji-陈亮-event-1
  type: 事功
  date: '1180'
  year_of: 1180
  description: 与辛稼轩为友，人才相若，词亦相似，二家气谊为世所知。
- id: guji-陈亮-event-2
  type: 创作
  date: '1188'
  year_of: 1188
  description: 稼轩寄词见怀，同甫作〈贺新郎·寄幼安见怀韵〉「树犹如此堪重别……但莫使伯牙絃绝」酬答，再挂韵往复。
- id: guji-陈亮-event-3
  type: 创作
  date: '1188'
  year_of: 1188
  description: 酬幼安再用韵见寄词云「斩新换出旌麾别。把当时一桩大义，拆开收合。据地一呼吾往矣，万里摇肢动骨」，义气见于字句。
- id: guji-陈亮-event-4
  type: 定评
  date: '1194'
  year_of: 1194
  description: 〈水龙吟〉「恨芳菲世界，游人未赏，都付与莺和燕」传世，刘熙载评为言近指远，直有宗留守大呼渡河之意。
- id: guji-陈亮-event-death
  type: 去世
  date: '1194'
  year_of: 1194
  description: 陈亮（同甫）卒，豪杰之词与稼轩并垂后世。
