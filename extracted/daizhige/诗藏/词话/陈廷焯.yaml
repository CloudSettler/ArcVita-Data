      precision: year
      is_circa: false
      raw: 光绪壬辰秋（1892），年四十
  birth_date: '1853'
  death_date: '1892'
  era: 清代
  reign_ref: 同治、光绪年间
  archetype: 词学家·词话作家
  dilemmas:
  - 白日经营家事、夜间苦读著书，主张四十后将委弃词章以求经世性命之学，遽然辞世，学未及见于行事，仅以空言传世
  lesson: 唯沉郁可以尽词之奥，性情为本，温柔敦厚为归。
  summary_first_person: 我陈廷焯，镇江丹徒人，光绪戊子科举人。早年宗法杜陵为诗，三十岁后专意于词，探索既久而豁然大彻，撰词话八卷，推本风骚，以温厚为体、沉郁为用。惜年甫四十而殁，唯赖门弟子刊行《白雨斋词话》以传其说。
  source_urls:
  - https://zh.wikisource.org/wiki/白雨斋词话
