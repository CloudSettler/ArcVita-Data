  - 遭唐末造，力不能挥戈挽日，忠愤无所於泄
  - 不得已寄情闺房儿女，世人仅以香奁目之
  lesson: 乱世之中，忠愤之情可以借诗词曲笔寄托，不可仅以表面香艳之词目之
  summary_first_person: 我生于唐末乱世，眼见国势倾颓而无力挽狂澜，一腔忠愤无处发泄，只得寄之于闺房儿女之辞。世人皆以香奁体看待我的作品，却未深究其中寄托的蒿目时艰之痛。
