- id: guji-顾太清-event-nangu
  type: life_event
  desc: 与贝勒葬处在大房山东之南谷
  significance: 长眠之地
- id: guji-顾太清-event-gongzhen
  type: rumor
  desc: 或传龚定庵（龚自珍）通殷勤于太清，事发后贝勒逼太清归、欲杀龚，龚孑身逃脱；然其事未可尽信
  significance: 传闻难考，如皋冒广生记太清遗事六首以资考证
