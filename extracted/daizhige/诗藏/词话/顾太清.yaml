person:
  qid: guji-顾太清
  name_zh: 顾太清
  names:
    zh: 顾太清
    en: Gu Taiqing
  lifespan:
    birth:
      date: '1799'
      precision: year
      is_circa: false
      raw: 嘉庆己亥
  birth_date: '1799'
  era: 清代嘉庆至道光年间
  reign_ref: 嘉庆、道光
  archetype: 才女词人
  dilemmas:
  - 身为贝勒奕绘侧福晋，才色双绝而身属侧室，词名虽盛，命运系于天家
  - 传说与龚自珍有往来致祸，被迫离府，传闻真伪难辨
  lesson: 才情可以超越身分，词章使其名垂后世
  summary_first_person: 我姓顾，苏州人，与贝勒奕绘同生于嘉庆己亥，为其侧福晋。我工诗词，著有《天游阁集》，词集名《东海渔歌》。尝与贝勒雪中并辔游西山，见者谓如王嫱重生。道光戊戌后寡居，恰四十岁。我曾集玉皇心印经为五言诗，亦有道装小像传世。
