- id: guji-顾太清-event-xueshan
  type: career
  desc: 与贝勒奕绘雪中并辔游西山，作内家妆束，披红斗篷，马上拨铁琵琶，见者谓王嫱重生
  significance: 才貌轶事，传诵一时
- id: guji-顾太清-event-yuhuang
  type: career
  desc: 亲礼玉皇，集玉皇心印经为五言诗四首，曾绘道装小像（黄云谷画）
  significance: 兼涉佛道修养
