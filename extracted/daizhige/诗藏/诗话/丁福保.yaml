      date: 1874
      precision: year
      is_circa: false
      raw: 生于清同治十三年（据史传补）
    death:
      date: 1952
      precision: year
      is_circa: false
      raw: 卒于中华人民共和国初期（据史传补）
  birth_date: 1874
  death_date: 1952
  era: 清末民国
  reign_ref: 中华民国四年（1915）
  archetype: 校勘编纂学者
  dilemmas:
  - 割裂古书重编以成善本，恐遭"割裂古人书"之诟病，然不定其次序则无法信达
  - 升庵伪撰之句，删之则失其真，存之则恐误後学，终取"原之以存其真"
  lesson: 校书如扫叶，明知瑕玷并存，弃其瑕而取其精华，方为嘉惠後学之道
  summary_first_person: 我是无锡丁福保。因仰慕杨升庵其人，见《升庵诗话》各本卷帙纷歧、讹脱相仍，遂搜集各本，详加校订，讹者正之，复者删之，缺者补之；伪撰之句则存其原貌，按题首字笔画改编为十四卷，附刻于《历代诗话续编》之中，自谓可称善本。
  source_urls:
  - https://zh.wikisource.org/wiki/升庵诗话
