  era: 唐代
  reign_ref: 唐高宗、武则天、唐中宗时期
  archetype: 宫廷女政治家与文学家
  dilemmas:
  - 身处权力中枢，需在武后、韦后等各方政治势力之间周旋求存
  - 以罪臣之后没入掖庭，诗才与政治才干既是立身之本，亦招祸患
  lesson: 才华与学识可令身处逆境者崛起于宫廷，然权力斗争之中，文人之笔终难敌刀兵之变。
  summary_first_person: 吾上官婉儿，以诗文与智略侍于掖庭之上，出身罪家而能掌制诰，称量天下之才，然终殒于政变兵刃之间。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
