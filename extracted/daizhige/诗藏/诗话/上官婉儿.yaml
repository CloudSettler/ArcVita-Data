  date: '0677'
  year_of: 677
  type_k: endeavor_event
  title_zh: 武则天召见，献诗文章
  description_zh: 武则天召见婉儿，当场命题考试文采，婉儿援笔立成，词旨华丽，遂免奴婢之身，令其掌管宫中诏命。
  related_to: guji-上官婉儿-endeavor-1
- id: guji-上官婉儿-event-2
  date: 0695
  year_of: 695
  type_k: endeavor_event
  title_zh: 专掌制诰，参决政务
  description_zh: 婉儿长期为武后处理百司表奏、参决政务，被称为'巾帼宰相'，以文才与政略显名于时。
  related_to: guji-上官婉儿-endeavor-2
- id: guji-上官婉儿-event-3
  date: 0709
  year_of: 709
  type_k: endeavor_event
  title_zh: 评量天下诗文
  description_zh: 于修文馆、昆明池群臣赋诗之时，充任主考称量各人诗篇高下，名臣沈佺期、宋之问均听其评断，一时文名冠世。
  related_to: guji-上官婉儿-endeavor-2
- id: guji-上官婉儿-event-4
  date: '0710-07-21'
  year_of: 710
  type_k: death
  title_zh: 唐隆政变中被杀
  description_zh: 临淄王李隆基发动政变诛韦后，婉儿执烛率宫人迎之，示太平公主所拟遗诏草稿，仍被斩于旗下，时年约四十六。
  related_to: guji-上官婉儿
