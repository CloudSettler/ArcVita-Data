  dilemmas:
  - 旧学深而奖掖维新后进，身处新学旧制交替之世
  lesson: 奖借后进、提携人才，三十年不倦，文教之功流于无形
  summary_first_person: 我是严修，号范孙。友人赵元礼屡以诗句呈我，我三十年间不惜赞辞，以“赵秋声”之名奖之；我曾于光绪甲午视学贵州，壬寅东游日本，诸生故友设馆、论学、吟咏，皆记于一时。
  source_urls:
