  birth_date: '1192'
  death_date: '1245'
  era: 南宋
  reign_ref: 南宋理宗时期
  archetype: 诗论家
  dilemmas:
  - 以禅喻诗虽直指诗道本源，却自认「获罪于世之君子」，取舍之间不辞非议
  - 主张盛唐为法，然身处江西诗派与江湖诗风盛行之世，正法眼无传、知音难觅
  lesson: 学诗以识为主，入门须正、立志须高，从顶上做起方不失正路
  summary_first_person: 吾字仪卿，号沧浪逋客，一生不逐科第科名，惟以诗道自任。见近世以文字、议论、才学为诗，诗道将厄，遂作《沧浪诗话》，借禅为喻，谓诗道在妙悟、在兴趣，推原汉魏，截然以盛唐为法，虽获罪于世之君子，亦不辞也。
  source_urls:
  - 《诗人玉屑》卷一·沧浪诗辨/沧浪诗法
