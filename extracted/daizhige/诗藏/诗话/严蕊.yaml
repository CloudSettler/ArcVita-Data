events:
- id: guji-严蕊-event-birth
  title_zh: 严蕊出生（约）
  date: 约1140
  year_of: 1140
  description: 生年史无明文，据南宋淳熙间为台州营妓推算约生于绍兴年间；本档仅见于《诗女史》卷十一名录，事迹据宋代笔记通考。
- id: guji-严蕊-event-painting-peach
  title_zh: 唐仲友延客命赋红白桃花
  date: 约1182
  year_of: 1182
  description: 台州守唐仲友设宴命严蕊赋红白桃花，蕊成《如梦令》"道是梨花不是，道是杏花不是……不是爱风尘，似被前缘误"，一座称赏。
- id: guji-严蕊-event-prison
  title_zh: 下狱刑讯不肯诬服
  date: 约1183
  year_of: 1183
  description: 朱熹弹劾唐仲友，指严蕊与唐有滥，逮蕊系狱，狱吏杖之逼供，蕊答："身为贱妓，纵合与太守有滥，科不至死；然是非真伪，岂可妄言以污士大夫，虽死不可诬也。"两月间再系再讯，终不改词。
- id: guji-严蕊-event-imperial-verdict
  title_zh: 事闻于朝孝宗裁决
  date: 约1183
  year_of: 1183
  description: 孝宗闻其狱词，以为"秀才争闲气"，命移狱他司了结，其冤得免。
- id: guji-严蕊-event-freedom
  title_zh: 岳霖判从良赋卜算子
  date: 约1184
  year_of: 1184
  description: 岳霖（岳飞之子）提点刑狱，怜其无辜，命作词自陈，蕊赋《卜算子》"去也终须去，住也如何住……若得山花插满头，休问奴归处"，岳遂判其从良。
- id: guji-严蕊-event-death
  title_zh: 卒年不详
  date: ''
  year_of: ''
  description: 脱籍后不知所终，卒年史无记载。
