person:
  qid: guji-严蕊
  name_zh: 严蕊
  names:
    zh: 严蕊
    en: Yan Rui
  lifespan:
    birth:
      date: 约1140
      precision: decade
      is_circa: true
      raw: 生年不详，约南宋中期
  birth_date: 约1140
  death_date: ''
  era: 南宋
  reign_ref: 宋孝宗淳熙年间
  archetype: 身陷风尘而气节不屈的才女歌妓
  dilemmas:
  - 太守唐仲友命其赋词自陈，下狱不改口供，面临刑讯与诬服的两难
  - 身为营妓欲脱籍从良，却受官府法度与州守权势牵制
  lesson: 强权逼供之下不肯诬人自陷，片言自白能明心迹，柔弱之身可存贞操
  summary_first_person: 我是南宋台州营妓严蕊，字幼芳，能诗善词。台州守唐仲友命我赋红白桃花，我作《如梦令》"不是爱风尘，似被前缘误"，以自明心志。后朱熹弹劾唐仲友，欲以罪名加诸我身，狱吏刑讯逼问我与唐之私情，我虽受杖几死，终不肯妄服一语，言身可为贱妓，然决不可诬人以欺天。事闻于朝，孝宗以为不是秀才争闲气，遂移他司了结，岳霖判我从良，我得脱风尘之籍。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
