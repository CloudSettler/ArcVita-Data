      raw: 卒年三十九
  birth_date: '1483'
  death_date: '1521'
  era: 明代弘治、正德年间
  reign_ref: 弘治—正德
  archetype: feeder
  dilemmas:
  - 与李梦阳并称而互相论争，复古师法之取舍
  - 借病辞官与宦官当道之间的出处抉择
  lesson: 诗如太华芙蓉秀出云表，才气温婉而成就不让李梦阳
  summary_first_person: 我何景明，字仲默，信阳人。少年改习《尚书》而魁于乡，二十岁举进士，授中书舍人。因谢病归里，遭宦官刘瑾之恶而罢官；瑾诛后复官，直内阁，进吏部员外郎，再迁按察副使督关中学政，为政严而详明。三载后又谢病归，卒年三十九。我与李梦阳诗名相齐，同为复古派领袖。
