  archetype: 外交使臣·能诗通胡语之尚书
  dilemmas:
  - 出使契丹需通夷语，士大夫或耻学胡语，余靖以胡语作诗反成两朝亲善之媒
  lesson: 通其语方能通其心，使节以胡语诗近夷情，成两朝和好之功。
  summary_first_person: 我余靖以尚书出使契丹，席间以胡语赋诗，契丹人爱之，再往而情益亲。虏人举大杯请我诵诗，我应声而道，虏大笑，遂成醉觞尽欢。时人称我此诗为真胡语，胜于汉译夷诗。
  source_urls:
  - https://zh.wikisource.org/wiki/宋诗话辑佚
