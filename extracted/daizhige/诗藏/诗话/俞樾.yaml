- id: guji-俞樾-event-2
  type: endeavor
  date: 1878-04-01
  year_of: 1878
  person_id: guji-俞樾
  summary: 光绪四年夏四月，徐琪等始筑俞楼于孤山之麓；因晋豫大饥，我移书请停楼工，徐子不可。
- id: guji-俞樾-event-3
  type: endeavor
  date: 1878-12-01
  year_of: 1878
  person_id: guji-俞樾
  summary: 冬十二月，俞楼成。彭玉麟巡江东下，拓俞楼而大之，且为筑池。
- id: guji-俞樾-event-4
  type: endeavor
  date: 1879-03-01
  year_of: 1879
  person_id: guji-俞樾
  summary: 汪柳门等谋凿石室，纳我所著全书，署曰'曲园书藏'；我赋诗谢诸君子。
- id: guji-俞樾-event-5
  type: endeavor
  date: 1879-01-01
  year_of: 1879
  person_id: guji-俞樾
  summary: 为内子营葬右台山，并自营生圹，拟于墓域之侧筑室三间，名曰'右台仙馆'。
