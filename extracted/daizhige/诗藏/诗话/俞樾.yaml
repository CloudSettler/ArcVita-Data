  archetype: 经师与著述家
  dilemmas:
  - 门下诸子为其筑俞楼、藏其全书于石室，自谦'余书岂足藏之名山'，屡贻书劝阻而不果
  lesson: 尊师重道之风与文人自谦之诚相映，楼以人重，山水亦以楼重。
  summary_first_person: 我号曲园叟，主讲诂经精舍，杜门著书自娱。门下诸子在西湖孤山西麓为我筑俞楼，曾多次致书劝止而同志已坚不可回；又以石室藏我全书，署曰'曲园书藏'，与右台山书冢相配。
