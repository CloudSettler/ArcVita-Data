events:
- id: guji-倭仁-event-birth
  date: '1804'
  year_of: 1804
  type: birth
  title_zh: 倭仁出生
  description: 倭仁生于清代嘉庆年间，后为蒙古正红旗人，字艮峰。
- id: guji-倭仁-event-death
  date: '1871'
  year_of: 1871
  type: death
  title_zh: 倭仁去世，谥文端
  description: 倭仁卒，谥文端，世称倭文端公。
- id: guji-倭仁-event-3
  date: '1862'
  year_of: 1862
  type: career
  title_zh: 倭仁成为同治帝师
  description: 同治初元，倭仁以理学名臣授读同治帝，位居中枢，为中兴时理学之冠。
- id: guji-倭仁-event-4
  date: '1860'
  year_of: 1860
  type: literary
  title_zh: 作纪行诗《闻喜道中遇雨》《过样子岭》
  description: 倭仁宦游途中遇雨登山，赋诗抒怀，如“策马入烟村，苍茫雨气昏”“皓皓摩天雪，苍苍拔地松”，诗雄健有奇气。
