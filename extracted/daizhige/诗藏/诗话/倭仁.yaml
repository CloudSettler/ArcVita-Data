  birth_date: '1804'
  death_date: '1871'
  era: 清代晚期（同治中兴时期）
  reign_ref: 道光、咸丰、同治
  archetype: 理学名臣
  dilemmas:
  - 以理学卫道自任，身处内忧外患之世，传统学术与经世实学之间存在张力
  lesson: 笃守理学、以德行为本，为官清正，然亦须应对时代变局
  summary_first_person: 我是倭仁，谥文端，以理学名重一时，为同治中兴诸臣之冠。我亦能诗，所作雄健有奇气，如《闻喜道中遇雨》《过样子岭》诸篇，皆纪行抒怀之作。
endeavors:
- id: guji-倭仁-endeavor-1
  key: 治学
