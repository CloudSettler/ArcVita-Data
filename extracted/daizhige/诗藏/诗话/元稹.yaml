- id: guji-元稹-event-wei-dao
  date: '809'
  year_of: 809
  title_zh: 娶京兆韦氏蕙丛；韦逝后赋悼亡“曾经沧海难为水，除却巫山不是云”
  note: 诗出《本事诗》
- id: guji-元稹-event-shu-xue-tao
  date: '809'
  year_of: 809
  is_circa: true
  title_zh: 为监察御史使蜀，以御史推鞫；严司空潜知其意，每遣薛涛往
  note: 洎登翰林，以“锦江滑腻峨眉秀”诗寄薛涛
- id: guji-元稹-event-zhedong
  date: '823'
  year_of: 823
  is_circa: true
  title_zh: 廉问浙东，刘采春自淮甸来，容华莫比，元赠诗誉其能唱《望夫歌》
  note: 在浙江七年，醉题东武亭，有“留滞七年馀”之句；卢简求戏曰为好镜湖春色
- id: guji-元稹-event-baixiang
  date: '822'
  year_of: 822
  is_circa: true
  title_zh: 拜左丞相（文中系于太和中）
- id: guji-元稹-event-bie-bai
  date: '829'
  year_of: 829
  is_circa: true
  title_zh: 乐天在洛，稹自越过洛，以“三度别”“白尽老髭须”二诗别白居易
  note: 乐天哭之曰：“始以诗交，终以诗诀，弦笔相绝，其今日乎！”
- id: guji-元稹-event-death
  date: '831'
  year_of: 831
  title_zh: 死于鄂，未几而卒
  note: 与李绅条相印证：穆宗召为翰林学士时，与李德裕、元稹同时，号三俊
