      raw: 大历十四年（779）
    death:
      date: '831'
      precision: year
      is_circa: false
      raw: 太和中拜左丞相，未几死于鄂（831）
  birth_date: '779'
  death_date: '831'
  era: 唐
  reign_ref: 历德宗贞元、宪宗元和、穆宗长庆至文宗太和年间
  archetype: 中唐诗人·风流才子而位至宰相
  dilemmas:
  - 才名冠世而情事缠身：使蜀慕薛涛之词辩，廉问浙东又眷刘采春，风流与宦声相累
  - 宦海浮沉：由监察御史、翰林学士（与李德裕李绅号“三俊”）至左丞相，终死于鄂州任上
  lesson: 才情可通天人之境，然深情与风流、诗名与相位，终难两全；与乐天“始以诗交，终以诗诀”，文字之交最可长久。
  summary_first_person: 我元稹，字微之，以诗名世。我闻薛涛词辩而使蜀推鞫，登翰林后寄诗“锦江滑腻峨眉秀”；先娶韦氏蕙丛，其逝后我有“曾经沧海难为水”之悼；后廉问浙东七年，遇刘采春，醉题东武亭。太和中拜左丞相，过洛以二诗别乐天，未几死于鄂。乐天哭我曰：“始以诗交，终以诗诀。”
