  dilemmas:
  - 坚持不仕民国以全遗节，与家境贫窘、生计维艰之间的两难
  lesson: 节操易许，糊口难支，一身容易一家难
  summary_first_person: 我冒鹤亭于壬癸之际留滞京邸，自命遗老，与同侪结社饮酒，相约不受民国官职，名刺犹署前清四品京堂。然贫无所归，俄而竟被授海关监督，百般无奈，委屈就职。临行有人讥为送遗老出山，我赋诗四章自解，深知饿死不过俄顷之事，最难是养活一家。
  source_urls:
  - 褒碧斋诗话（陈锐，民国）
