  dilemmas:
  - 晚节颓唐、诗趋潦倒，而论诗独具条理
  - 与真德秀编《文章正宗》，诗歌去取意见相左
  lesson: 论诗精核、专门成家，南宋诸家诗话无出其右
  summary_first_person: 我刘克庄，号后村，南宋人也。一生以诗为专门，晚岁撰《后村诗话》，前集、后集成于六七十岁，续集成于八十岁，新集成于八十二岁，统论汉魏以下至唐宋之诗，采摘精华，品题优劣，多赖以传。
  source_urls:
  - https://zh.wikisource.org/wiki/後村詩話
