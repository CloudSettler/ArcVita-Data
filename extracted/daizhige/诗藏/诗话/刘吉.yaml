      - 南唐旧臣
      - 忠于所奉
    highlight_event_id: guji-刘吉-event-serve-ljy
  decisions:
  - date: ~970
    title_zh: 尽忠李煜不事二心
    rationale: 以忠于所奉而得善名，归朝后因而获用。
- id: guji-刘吉-endeavor-2
  name_zh: 归宋治河
  phases:
  - key: breakthrough
    name_zh: 供奉官知八作
    labels:
      zh:
      - 归朝
      - 河渠之才
    start_date: ~975
    highlight_event_id: guji-刘吉-event-flood
  - key: climax
    name_zh: 太平兴国护河
    labels:
      zh:
      - 塞河
      - 刘跋河
    start_date: ~977
    highlight_event_id: guji-刘吉-event-tiger-boat
  - key: closure
    name_zh: 崇仪使
    labels:
      zh:
      - 官至崇仪使
      - 钓鳌集
    highlight_event_id: guji-刘吉-event-chongyi
  decisions:
  - date: ~977
    title_zh: 负土先导同役夫甘苦
    rationale: 使者访而不获，以身先士卒，终得密访奏闻，厚赐于上。
  - date: ~978
    title_zh: 荡舟慑服石全振
    rationale: 内侍石全振苛急相凌，吉借中流同见河伯之语覆其舟，自此权贵不敢相侵。
events:
- id: guji-刘吉-event-birth
  year_of: ~935
  date: ~935
  title_zh: 刘吉生
  summary: 燕蓟人（一说江左人），有膂力，尚气节。
- id: guji-刘吉-event-serve-ljy
  year_of: ~965
  date: ~965
  title_zh: 事李煜为传诏承旨
  summary: 以忠谨见知于后主，深受恩遇。
- id: guji-刘吉-event-gui-song
  year_of: ~975
  date: ~975
  title_zh: 归宋授供奉官
  summary: 以忠于所奉之名归朝，隶供奉官；又以知河渠利害，委以八作务。
- id: guji-刘吉-event-flood
  year_of: ~977
  date: ~977
  title_zh: 太平兴国河决护堤
  summary: 河大决，吉护之，着皂短布褐独负二囊土为先导，与工夫同甘苦，使者密访得之，奏于太宗，厚赐。
- id: guji-刘吉-event-tiger-boat
  year_of: ~978
  date: ~978
  title_zh: 中流覆舟慑石全振
  summary: 石全振领河堤苛急相凌，吉乘小艇督役，至中流语"不畏死，当与公同见河伯"，遂覆其舟，全振号泣乞命乃止，不复敢侵。
- id: guji-刘吉-event-chongyi
  year_of: ~985
  date: ~985
  title_zh: 官至崇仪使，号刘跋河
  summary: 以塞河有方略名震河上，人目为"刘跋河"；后为崇仪使。著诗三百首为《钓鳌集》，徐铉作序。
- id: guji-刘吉-event-death
  year_of: ~1000
  date: ~1000
  title_zh: 刘吉卒
  summary: 卒年无考，身后犹传其忠于旧主、不忘本之称南人 повед。
