person:
  qid: guji-刘吉
  name_zh: 刘吉
  names:
    zh: 刘吉
    en: Liu Ji
  era: 五代南唐至北宋初
  reign_ref: 南唐后主李煜、宋太宗太平兴国
  archetype: 忠义干济之能臣
  dilemmas:
  - 事旧主李煜与归顺新朝之间的忠义之辨
  - 忍辱负重护河与不畏权贵石全振的冲突
  lesson: 忠于所奉、不忘其本，处以勇略，行以笃实，则功立而名彰。
  summary_first_person: 我本是燕蓟人而长于江左，事李煜为传诏承旨，恩遇之深，虽归宋仍分俸济其子孙，朔望必拜其真容。入朝后以知河渠见任，太平兴国中河堤大决，我着皂褐负土与役夫同甘苦，终成塞河之方略，人呼"刘跋河"。有诗三百首为《钓鳌集》，徐铉作序。
  source_urls:
  - https://zh.wikisource.org/wiki/詩話總龜
endeavors:
- id: guji-刘吉-endeavor-1
  name_zh: 仕南唐事李煜
  phases:
