  name_zh: 刘桢
  names:
    zh: 刘桢
    en: Liu Zhen
  lifespan:
    birth:
      date: '0170'
      precision: year
      is_circa: true
      raw: 生年不详，约生于东汉末（约170年）
    death:
      date: '0217'
      precision: year
      is_circa: true
      raw: 建安二十二年（217年）卒
  birth_date: '0170'
  death_date: '0217'
  era: 东汉末建安时期
  reign_ref: 汉献帝
  archetype: 建安诗人·建安七子之一
  dilemmas:
  - 气胜于文，雕润不足，风骨与文采难以兼得
  - 居陈思（曹植）之下、众彦之间，才高而名位不显
  lesson: 以风骨气骨立身，虽文少雕润，亦能凭高风跨俗而独步一时
  summary_first_person: 我刘桢字公幹，建安之中以五言诗名世。钟嵘谓我仗气爱奇，动多振绝，真骨凌霜，高风跨俗，然气过其文，雕润恨少，然自陈思以下，我称独步。我曾与王粲为曹氏父子羽翼，与魏文往复酬答，公幹思友之篇，被推为五言之警策。
  source_urls:
  - https://zh.wikisource.org/wiki/詩品
