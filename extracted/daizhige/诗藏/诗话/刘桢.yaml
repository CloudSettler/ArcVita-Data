  decisions:
  - date: ~0197-01-01
    title_zh: 应曹氏之召，入邺下文人集团
    rationale: 曹公父子笃好斯文，平原兄弟郁为文栋，刘桢、王粲为其羽翼，遂与王粲等并侍曹门。
  - date: ~0215-01-01
    title_zh: 作《赠从弟》等思友之诗，以气骨见长
    rationale: 仗气爱奇，动多振绝，宁取真骨凌霜之势，不事雕润虚饰。
- id: guji-刘桢-endeavor-2
  name_zh: 与魏文、伟长相与酬答， ventured 往复之雅
  phases:
  - key: brewing
    name_zh: 与徐幹等七子交游切磋
    labels:
      zh:
      - 邺下交游
    start_date: ~0200
    highlight_event_id: guji-刘桢-event-career-2
  - key: climax
    name_zh: 与魏文帝往复，伟长与公幹往复
    labels:
      zh:
      - 往复酬赠
    start_date: ~0214
    highlight_event_id: guji-刘桢-event-career-3
  - key: closure
    name_zh: 身后与徐幹同列中品之评
    labels:
      zh:
      - 品第流传
    start_date: ~0515
    highlight_event_id: guji-刘桢-event-death
  decisions:
  - date: ~0214-01-01
    title_zh: 与魏文帝、徐幹诗酒往复，不以莛叩钟自贬
    rationale: 白马与陈思答赠，伟长与公幹往复，虽曰以莛叩钟，亦能闲雅，交游重气节而非爵位。
events:
- id: guji-刘桢-event-birth
  date: '0170'
  year_of: 170
  type: birth
  title_zh: 刘桢约生于东汉末年
  detail: 生年史无明文，约当汉末乱前，东平刘氏之子，后字公幹。
- id: guji-刘桢-event-career-1
  date: ~0197-01-01
  year_of: 197
  type: career
  title_zh: 入邺下文人集团，附骥曹门
  detail: 降及建安，曹公父子笃好斯文，刘桢、王粲为其羽翼，攀龙托凤者盖将百计。
- id: guji-刘桢-event-career-2
  date: ~0210-01-01
  year_of: 210
  type: career
  title_zh: 与王粲并为曹氏羽翼，文坛彬彬之盛
  detail: 彬彬之盛，大备于时；刘桢以仗气爱奇之体，与王粲别构一体各踞一途。
- id: guji-刘桢-event-career-3
  date: ~0215-01-01
  year_of: 215
  type: career
  title_zh: 作公幹思友之篇，成五言警策
  detail: 钟嵘列公幹思友于五言之警策，谓篇章之珠泽、文彩之邓林。
- id: guji-刘桢-event-death
  date: '0217'
  year_of: 217
  type: death
  title_zh: 卒于建安二十二年之疫
  detail: 建安二十二年大疫，七子多有凋零，刘桢约卒于此时；其后钟嵘置其诗于上品，谓自陈思以下，桢称独步。
