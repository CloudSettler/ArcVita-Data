  dilemmas:
  - 仕途不得志与弃官隐居之间的抉择
  - 保持气节与接受权贵礼遇之间的平衡
  lesson: 慷慨有气节，不慕荣利，以诗与山水自适
  summary_first_person: 我刘概，字孟节，青州人。喜作诗，慷慨有气节。举进士及第后为幕僚，一任不得志，便弃官隐居冶原山，远离人境四十里。我好游山，常独带一罂饭穷探幽险，夜宿岩石之下，不畏虎豹蛇虺。富丞相甚礼重我。
