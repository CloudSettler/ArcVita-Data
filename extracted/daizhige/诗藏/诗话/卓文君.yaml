  dilemmas:
  - 新寡家居，私奔司马相如有违礼法与父命
  - 当垆卖酒以窘卓王孙，在家族颜面与自主婚恋之间抉择
  lesson: 才情与勇气可破礼法藩篱，自主择偶、共守清贫终赢得家族认可，白头之约传为佳话。
  summary_first_person: 我乃临邛卓王孙之女，新寡归家，闻司马相如琴挑之意，夜奔成都。家徒四壁，我与相如复归临邛，当垆卖酒，终使父亲分与僮仆钱财。相如欲聘茂陵女为妾，我作白头吟以绝之，其意遂止，我们白首偕老。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
