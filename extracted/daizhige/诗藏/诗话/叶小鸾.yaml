    en: Ye Xiaoluan
  birth_date: 1616
  death_date: 1632
  era: 明末
  reign_ref: 崇祯年间前、天启末至崇祯初
  archetype: 早夭才女
  dilemmas:
  - 婚期将至而未嫁先逝，才命相妨
  - 钟灵毓秀之才与尘世短促之命的张力
  lesson: 才华不为寿夭所限，文字可存精神于千古
  summary_first_person: 我名琼章，字小鸾，吴江叶绍袁之第三女。我英彻如玉山之映人，诗辞绝有思致，与姐姐昭齐、蕙绸同具才调，稿载《午梦堂集》中。
