  year_of: 1630
  title_zh: 泐大师序赞
  summary: 天台泐大师序曰：汾河诸叶，叶叶交辉。中秀双株，尤为殊丽。
- id: guji-叶小鸾-event-death
  date: '1632'
  year_of: 1632
  title_zh: 琼章夭逝
  summary: 长昭齐、次蕙绸、三琼章，皆具才调，而琼章早逝，稿载《午梦堂集》中。
