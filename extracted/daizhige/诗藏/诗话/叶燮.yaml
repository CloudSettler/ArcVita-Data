  archetype: 诗论家
  dilemmas:
  - 宗唐抑宋与溯源流变的门户之争
  - 拟古与创新之间的诗学抉择
  lesson: 诗有源流本末正变盛衰，惟变可以救衰，创作者须自成一家而不依傍古人。
  summary_first_person: 我叶燮，清初诗论家，著《原诗》，以正变盛衰、源流本末之理论诗，力斥拟古剽窃之弊，主张才胆识力四者兼备，自成一家。
  source_urls:
  - https://zh.wikisource.org/wiki/原诗
endeavors:
- id: guji-叶燮-endeavor-1
  name_zh: 著《原诗》
  summary_zh: 系统阐述诗歌源流正变盛衰之理，批判明代拟古派，构建以胸襟、才胆识力为核心的诗歌理论体系。
  phases:
  - key: brewing
    name_zh: 积学蓄思
    labels:
      zh:
      - 溯源诗史
    start_date: '1670'
    highlight_event_id: guji-叶燮-event-1
  - key: breakthrough
    name_zh: 成书立论
    labels:
      zh:
      - 正变盛衰之论
    start_date: '1685'
    highlight_event_id: guji-叶燮-event-2
  - key: climax
    name_zh: 理论展开
    labels:
      zh:
      - 内篇上下
    start_date: '1686'
    highlight_event_id: guji-叶燮-event-3
  - key: closure
    name_zh: 流传后世
    labels:
      zh:
      - 诗学经典
    start_date: '1700'
    highlight_event_id: guji-叶燮-event-4
  decisions:
  - date: '1685'
    title_zh: 决意著《原诗》以正诗道
    rationale: 见近代论诗者锢习建安盛唐之说、是非淆乱，遂决意发明数千年诗之正变盛衰所以然。
  - date: '1686'
    title_zh: 立「才胆识力」四言之说
    rationale: 以为无才则心思不出，无胆则笔墨畏缩，无识则不能取舍，无力则不能自成一家。
- id: guji-叶燮-endeavor-2
  name_zh: 批判明代拟古诗风
  summary_zh: 斥李梦阳「不读唐以后书」、李攀龙「唐无古诗」诸说，及明末句剽字窃、依样葫芦之习。
  phases:
  - key: brewing
    name_zh: 观察积弊
    labels:
      zh:
      - 目击诗衰
    start_date: '1680'
    highlight_event_id: guji-叶燮-event-5
  - key: climax
    name_zh: 力加掊击
    labels:
      zh:
      - 破依傍临摹
    start_date: '1687'
    highlight_event_id: guji-叶燮-event-6
  decisions:
  - date: '1687'
    title_zh: 主张惟变以救正之衰
    rationale: 洞见「惟正有渐衰，故变能启盛」，反对以一定之程格绳天下之诗。
