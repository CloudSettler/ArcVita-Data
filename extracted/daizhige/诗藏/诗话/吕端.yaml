  reign_ref: 宋太宗朝
  archetype: 宰相·以拙自晦而终登相位
  dilemmas:
  - 才直之臣当进拙退让以避锋，抑或自明其能以谋进用
  lesson: 钩直难堪用，让贤言外自达其志；谦退之表下自有经纬，时机至则名位自来。
  summary_first_person: 我吕端在太宗朝任参知政事，常独对便殿，言谈深切。因宴后苑，太宗赋《钓鱼诗》断句“欲饵金钩殊未达，磻溪须问钓鱼人”，意在属意于我。我进和诗自谦“愚臣钩直难堪用，宜问濠梁结网人”，不数日即拜平章事，冠于宰辅之列，谥正惠。
  source_urls:
  - https://zh.wikisource.org/wiki/宋诗话辑佚
