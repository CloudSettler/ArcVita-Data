  archetype: 诗论家 / 遗民诗人
  dilemmas:
  - 年近四十方悟唐诗比兴之义，自觉少时为俗学所误五十年，悔晚而衰病无可进
  lesson: 雅学大费工力而真实，俗学悦众目而虚伪；学诗当求诗意所在，不可专重好句、冒盛唐之名
  summary_first_person: 我吴乔，明末清初人，生平作诗千余首，至将近四十岁才悟得唐诗比兴之义，又二十年方知汉魏晋宋之高妙。半生为俗学所误，故著《围炉诗话》痛论诗道，斥明人"瞎盛唐"有词无意之弊，欲使英年有志节者早自觉悟，毋若我愦愦一生。
  source_urls:
  - https://zh.wikisource.org/wiki/围炉诗话
