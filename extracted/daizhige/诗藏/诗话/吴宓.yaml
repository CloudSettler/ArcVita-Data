  summary_first_person: 我吴宓，爱朋友亦爱文学，编辑《学衡》与《大公报》文学副刊十二年，居清华藤影荷声之馆十年，汇所录师友佳诗为《空轩诗话》，欲融合新旧、撷精立极，以文章学问影响社会。
