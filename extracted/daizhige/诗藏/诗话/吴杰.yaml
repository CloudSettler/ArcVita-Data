  - 功高见劾：中法之役立功受旌，旋为提督欧阳利见劾罢，才略不得竟用
  lesson: 有功于国者未必善处官场，时事之惜在于人为倾轧
  summary_first_person: 我本为参将，中法之役在宁波招宝山以巨炮击中敌舰，相传歼其大将孤拔，得画像紫光阁。后任营统领，被提督欧阳利见劾罢。幸宁绍台道薛福成奉召出使入都，力言我功，得旨送部引见，赏还游击，荐升总兵，终管带宁波炮台之任，未竟其用，时论惜之。
