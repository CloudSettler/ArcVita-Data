person:
  qid: guji-吴沆
  name_zh: 吴沆
  names:
    zh: 吴沆
    en: Wu Hang
  lifespan:
    birth:
      date: '1116'
      precision: year
      is_circa: true
      raw: 生于丙申
    death:
      date: '1172'
      precision: year
      is_circa: true
      raw: 绍兴间举不求闻达将行而卒，年五十有七
  birth_date: '1116'
  death_date: '1172'
  era: 南宋
  reign_ref: 绍兴
  archetype: 布衣经学家与诗论家
  dilemmas:
  - 奉诏将应“不求闻达”之举而未行即卒
  - 兄弟献书误抵庙讳，自罢归而弟得免
  lesson: 通经为本，论诗以实字求健，取法杜甫一祖而宗旨终正
  summary_first_person: 我吴沆字德远，抚州崇仁人。幼孤孝母，博通经学，献书于朝以误抵庙讳罢归，遂居环溪，人称环溪居士。论诗以杜甫为一祖、李韩为二宗，主张多用实字则健，著《易璇玑》《论语发微》《环溪诗话》等数十万言，谥文通先生。
  source_urls:
  - https://zh.wikisource.org/wiki/環溪詩話
