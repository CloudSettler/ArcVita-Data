    title_zh: 弃慕效四子而专学杜甫
    rationale: 右丞言杜甫一句能言三五物、能说满天下，方到极处
  - date: 1151
    title_zh: 以拙诗质诸当代名公
    rationale: 乙卯大旱丙辰大饥，积忿所畜遂发为诗，欲行于世
events:
- id: guji-吴沆-event-birth
  date: '1116'
  year_of: '1116'
  type: birth
  name_zh: 吴沆生于丙申年
  description: 环溪自云生丙申，至乙卯二十岁；抚州崇仁人。
- id: guji-吴沆-event-poem-youth
  date: 1131
  year_of: 1131
  type: endeavor
  name_zh: 少时录渊明诗得晚归早行二诗
  description: 伯兄命录渊明诗，既毕得二诗，似渊明，十五六岁时所作。
- id: guji-吴沆-event-famine-poems
  date: 1135
  year_of: 1135
  type: endeavor
  name_zh: 乙卯蝗旱间作悯饥之作
  description: 乙卯大旱丙辰大饥，作《瓶无余粮》《雨淋漓》《有鸟》《野无孩提》以悯伤时。
- id: guji-吴沆-event-offer-books
  date: 1146-01-01
  year_of: 1146
  type: endeavor
  name_zh: 绍兴丙寅与弟澥献书于朝
  description: 下国子监，沆误抵庙讳罢归，弟澥得免；后归居环溪，号环溪居士。
- id: guji-吴沆-event-du-lun
  date: 1152
  year_of: 1152
  type: endeavor
  name_zh: 见张右丞始改辙学杜
  description: 奉诗一册自序慕效渊明太白卢仝乐天四子之意，右丞劝其学杜，遂精选五百八十篇昼夜熟读，成一句言五物、满天下之说。
- id: guji-吴沆-event-death
  date: '1172'
  year_of: '1172'
  type: death
  name_zh: 将应不求闻达之举而卒
  description: 绍兴间郡县请应诏，奏上将行而卒，年五十有七；后谥环溪居士文通先生，郡县学皆祠之。
