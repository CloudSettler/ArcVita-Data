  - 宋亡之后，遗老结社吟诗以寄故国之思，仕与不仕之间唯以诗社存斯文
  lesson: 以诗会友、以社存志，乱世之中犹能凝聚文脉、奖掖后进
  summary_first_person: 我是浦阳吴清翁，宋亡之后结月泉吟社于家，延致方凤、谢翱、吴思齐诸遗老。至元丙戌以《春日田园杂兴》为题征诗浙东西，得卷二千七百三十五，选二百八十人，三月三日揭榜赠以公服罗缣笔墨，并录选中之诗与佳句、回谢小启刻板行世，庶几斯文不坠。
  source_urls:
  - 逸老堂诗话·卷上
