events:
- id: guji-吴芳吉-event-birth
  date: '1896'
  year_of: 1896
  type: birth
  title: 吴芳吉生
  location_zh: 四川
  description_zh: 碧柳生于晚清，后为蜀中著名诗人，号碧柳。
- id: guji-吴芳吉-event-poem-1
  date: '1915-03-17'
  year_of: 1915
  type: creation
  title: 于上海作《寄吴雨僧家门》
  location_zh: 上海
  description_zh: 五律一首，颂泰伯三让之德， scans“孝友未陵替，沈吟看子孙”，唱和赠答之首。
  entities:
  - 吴宓
- id: guji-吴芳吉-event-poem-2
  date: 1916-01
  year_of: 1916
  type: creation
  title: 于上海作五律八首劳病弟何树成
  location_zh: 上海
  description_zh: 自谓颇似《古诗十九首》，不落时人气习；中有“我有同心友”句，原注指吴雨僧。
  entities:
  - 吴宓
  - 何树成
- id: guji-吴芳吉-event-poem-3
  date: 1916-07
  year_of: 1916
  type: creation
  title: 于蜀作《再送雨僧季龄及天人诸弟昆赴美洲》
  location_zh: 四川
  description_zh: 五律四首送吴宓等天人学会弟昆赴美留学，自评第一首可存；同年四月吴宓致书介绍天人学会宗旨。
  entities:
  - 吴宓
  - 天人学会
- id: guji-吴芳吉-event-diary
  date: '1913'
  year_of: 1913
  type: creation
  title: 《碧柳日记》起笔
  location_zh: 中国
  description_zh: 手稿三十四册约六十万言，今存民国二年至九年之事；录天人学会会章及友朋唱和，为难得信史。
  entities:
  - 吴宓
  - 天人学会
- id: guji-吴芳吉-event-diary-publish
  date: 1934-12
  year_of: 1934
  type: publication
  title: 吴宓读《碧柳日记》全稿并议付印
  location_zh: 南京
  description_zh: 吴宓于是年十二月得读日记，惊为瑰宝，与周光午议以全书付南京锺山书局印行，力主存真不增损一字。
  entities:
  - 吴宓
  - 周光午
  - 锺山书局
- id: guji-吴芳吉-event-death
  date: '1932'
  year_of: 1932
  type: death
  title: 吴芳吉劳苦殉身于蜀
  location_zh: 四川
  description_zh: 碧柳终不脱家庭之缚，欲成《人学》《国史》而未竟，劳苦死于蜀中，吴宓视为碧柳生死悲剧最后之一幕。
  entities:
  - 吴宓
