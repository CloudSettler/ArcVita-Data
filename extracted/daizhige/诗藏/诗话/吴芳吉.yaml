      raw: 竟以劳苦殉身于蜀
  birth_date: '1896'
  death_date: '1932'
  era: 中华民国
  reign_ref: 民国
  archetype: 诗人学人·困守立德
  dilemmas:
  - 文学天才与家庭负担的撕扯
  - 新旧文学之争中独守旧体诗而自铸新境
  - 友朋厚谊与自身不能脱家远行著述之憾
  lesson: 身阅兴亡，赋到沧桑句便工；守贫守志以诗证世
  summary_first_person: 我吴芳吉，号碧柳，蜀中诗人。与吴雨僧以文字订交，情笃终身，唱和作寄不断。我作《西征杂诗》师法汪水云纪史之体，梦联句成谶，然终不脱家庭之缚，欲成《人学》《国史》以作中华史诗而未竟，劳苦殉身于蜀，以诗与日记留真面目于后世。
  source_urls:
  - https://zh.wikipedia.org/wiki/吴芳吉
