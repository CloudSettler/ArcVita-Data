  reign_ref: 显德年间(954-959)
  archetype: 英武有大略而善纳直言之君主
  dilemmas:
  - 作诗之好与帝王之务不可兼得
  - 御用珍器之雅趣与天下大计之取舍
  lesson: 英主识大略，能纳窦俨之谏而弃雕虫之好，为天下者在此不在彼
  summary_first_person: 朕尝为小诗示窦俨，俨劝朕曰四方僭伪之主皆能诗，求工则废务。朕悟而为帝王大计，遂不复作；惟于柴窑御批定色，留下千古之趣。
  source_urls:
  - https://zh.wikisource.org/wiki/五代诗话
