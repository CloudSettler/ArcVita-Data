events:
- id: guji-周世宗-event-birth
  date: 0921
  year_of: '921'
  title_zh: 柴荣生
  summary: 周世宗约生于后梁龙德年间，后世所纪，约当其时。
- id: guji-周世宗-event-poetry
  date: 0954
  year_of: 0954
  title_zh: 示诗窦俨，纳谏不复作
  summary: 杨文公谈苑载，周世宗尝为小诗示窦俨。俨言今四方僭伪主各能为之，若求工则废务，不工则为所窥。世宗遂不复作，识帝王大略。
- id: guji-周世宗-event-kiln
  date: 0955
  year_of: 0955
  title_zh: 御批柴窑雨过青天色
  summary: 世传柴世宗时烧造所司请其色，御批云雨过青天云破处这般颜色做将来。柴窰最古，色鲜碧而质莹薄，后世得其碎片与金翠同价。
- id: guji-周世宗-event-death
  date: 0959
  year_of: 0959
  title_zh: 周世宗崩
  summary: 世宗在位数年而崩，恭帝柴宗训继立，旋禅于宋。
