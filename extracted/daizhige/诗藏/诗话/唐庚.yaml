    - 诗文
    - 赋
    - 贬谪
  phases:
  - key: brewing
    name_zh: 初谒东坡，志于学文
    labels:
      zh:
      - 求学
    start_date: '1088'
    highlight_event_id: guji-唐庚-event-dongpo
  - key: climax
    name_zh: 南迁岭外，诗赋自见
    labels:
      zh:
      - 惠州
      - 南征赋
    start_date: '1110'
    highlight_event_id: guji-唐庚-event-nanzheng
  - key: closure
    name_zh: 北还请祠，绝笔留别
    labels:
      zh:
      - 宫祠
      - 绝笔
    start_date: '1120'
    highlight_event_id: guji-唐庚-event-death
  decisions:
  - date: 约1120年
    title_zh: 力请宫祠，谋归老锦江滨
    rationale: 白头独立鸳行觉异伦，往事已空，愿归老锦江，故力请宫祠。
  - date: 约1110年
    title_zh: 南迁途中作《南征赋》
    rationale: 曲尽南迁时情状，以赋纪行自遣。
- id: guji-唐庚-endeavor-2
  name_zh: 诗论文论传授（唐子西文录）
  labels:
    zh:
    - 诗论
    - 文论
  phases:
  - key: brewing
    name_zh: 平居收拾诗材，深研杜苏
    labels:
      zh:
      - 诗材
    start_date: '1090'
    highlight_event_id: guji-唐庚-event-dongpo
  - key: climax
    name_zh: 宣和年间居景德僧舍论诗，强者记之
    labels:
      zh:
      - 论文
      - 文录
    start_date: '1119'
    highlight_event_id: guji-唐庚-event-jingde
  decisions:
  - date: 约1119年
    title_zh: 于城东景德僧舍日与学者论诗文
    rationale: 强行父、关注等从之游，闻所未闻，退而记其论文之语。
events:
- id: guji-唐庚-event-birth
  date: 约1071
  year_of: 1071
  title_zh: 唐庚出生于眉山
  description_zh: 眉山人，后以文论知名，世称唐子西。
- id: guji-唐庚-event-dongpo
  date: 约1088
  year_of: 1088
  title_zh: 年十八谒苏轼于京师
  description_zh: 东坡赴定武过京师，馆于城外园中，唐庚谒之。东坡问观何书、有甚好亭子名，唐庚茫然失对，始悟前辈观书用意。
- id: guji-唐庚-event-nanzheng
  date: 约1110
  year_of: 1110
  title_zh: 南迁惠州，作《南征赋》及惠州诸诗
  description_zh: 南迁途中作《南征赋》，自谓曲尽南迁情状；又有「雨在时时黑，春归处处青」等闲中所得句。
- id: guji-唐庚-event-jingde
  date: 1119-09-13
  year_of: 1119
  title_zh: 居汴京景德僧舍论诗，强行父记之
  description_zh: 宣和元年己亥，与关注等同寓城东景德僧舍，日从之游，行父记其论文之语，后成《唐子西文录》三十五条。
- id: guji-唐庚-event-death
  date: 约1121
  year_of: 1121
  title_zh: 得请宫祠归泸南，道卒于凤翔
  description_zh: 北归还朝后得请宫祠归泸南，道卒于凤翔，年五十一。留别诗「渐谋归老锦江滨」盖绝笔。
