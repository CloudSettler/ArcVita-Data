person:
  qid: guji-唐庚
  name_zh: 唐庚
  names:
    zh: 唐庚、唐子西、眉山唐先生
    en: Tang Geng
  lifespan:
    birth:
      date: '1071'
      precision: year
      is_circa: true
      raw: 约熙宁年间；宣和后卒时年五十一
    death:
      date: '1121'
      precision: year
      is_circa: true
      raw: 政和、宣和间北归还朝，道卒于凤翔，年五十一
  birth_date: 约1071年（据卒时年五十一推算）
  death_date: 约1121年（道卒于凤翔，年五十一）
  era: 北宋
  reign_ref: 宣和、绍兴
  archetype: 文学家·诗论家
  dilemmas:
  - 南迁贬谪与不忘著述之间的取舍
  - 学古（司马迁、杜甫）与自成一家的张力
  lesson: 作文学司马迁，作诗学杜甫；诗律伤严，近寡恩，一字不可放过。
  summary_first_person: 我眉山唐庚，字子西，以诗文论著称，尝南迁惠州，作《南征赋》曲尽迁谪情状。平生论诗论文，以为作文当学司马迁，作诗当学杜甫，一字疵病必深求而去之。晚年力请宫祠归老，北还道卒于凤翔，年五十一。
  source_urls:
  - https://zh.wikisource.org/wiki/唐子西文录
endeavors:
- id: guji-唐庚-endeavor-1
  name_zh: 诗文创作与南迁著述
  labels:
