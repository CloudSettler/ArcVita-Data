      raw: 文中未记载卒年
  birth_date: '1507'
  era: 明代中期
  reign_ref: 明世宗嘉靖年间
  archetype: 因直言忤旨、疏离权相而两度退隐的翰林文臣
  dilemmas:
  - 直言进谏与保全官位之间的抉择
  - 趋附宰相以获升迁与独守介节致被排挤的两难
  - 尽废复古派（何、李）之业与调和文风的取舍
  lesson: 依违权相可保禄位，守道直言必罹斥逐；Documented：唐顺之累调皆以宰相知故得之，又因远宰相而称病求去。
  summary_first_person: 我唐顺之，字应德，武进人。举进士高第，为翰林庶吉士，授吏部主事，后调编修。屡得迁调，皆因宰相知遇之故；及任司谏，则有意疏远宰相，称病归乡。久之太子册立，设东宫官，我被召补右春坊右司谏，仍领编修职。后因上书忤逆天子之意，被斥为民，不复起用。
  source_urls:
  - https://zh.wikisource.org/wiki/明诗评
