    title_zh: 称病辞归以远宰相
    rationale: 得官累调皆因宰相知遇之故，任司谏后不愿依附权相，故移病归乡。
  - date: '1534'
    title_zh: 上书直谏
    rationale: 尽言责之职，不惜忤逆天子之意，因而被斥为民，终身不复起用。
