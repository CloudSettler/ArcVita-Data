person:
  qid: guji-唐顺之
  name_zh: 唐顺之
  names:
    zh: 唐顺之
    en: Tang Shunzhi
  lifespan:
    birth:
      date: '1507'
      precision: year
      is_circa: true
      raw: 生年史无明文，据通行谱推断为弘治二十年
    death:
      date: ''
      precision: unknown
