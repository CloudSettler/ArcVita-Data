- id: guji-孟浩然-event-mengting
  date: 0869
  year_of: 869
  type: endeavor
  endeavor_id: guji-孟浩然-endeavor-2
  title_zh: 皮日休作《孟亭记》推许孟浩然
  description: 皮日休谓明皇世章句之风大得建安体，论者推李翰林、杜工部为尤，介其间能不愧者惟孟先生；其作遇景入咏，不钩奇抉异，与古人争胜于毫厘之间。
