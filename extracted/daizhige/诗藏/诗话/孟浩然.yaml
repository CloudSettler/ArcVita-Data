  archetype: 山水田园诗人
  dilemmas:
  - 求仕与归隐之间的抉择：心慕仕途而终身布衣，终以隐逸诗名传世
  lesson: 不钩奇抉异、遇景入咏，平淡自然亦能与古人争胜于毫厘之间
  summary_first_person: 我是孟浩然，襄阳人，一生大多隐居故乡，以山水田园之诗自适。我不刻意雕琢奇句，遇景入咏，如「气蒸云梦泽，波动岳阳城」「微云淡河汉，疏雨滴梧桐」，皆出常境。后世皮日休作《孟亭记》，谓我于李翰林、杜工部之间能不愧，此我平生所安。
  source_urls:
  - https://zh.wikisource.org/wiki/唐诗纪事
  - https://zh.wikisource.org/wiki/孟亭记
