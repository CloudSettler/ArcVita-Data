  year_of: 731
  type: endeavor
  endeavor_id: guji-孟浩然-endeavor-1
  title_zh: 作《建德江宿》
  description: 「移舟泊烟渚，日暮客愁新。野旷天低树，江清月近人。」野旷江清之境，客愁新起，为其羁旅名篇。
