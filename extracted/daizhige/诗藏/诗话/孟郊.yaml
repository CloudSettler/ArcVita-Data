  era: 唐代
  reign_ref: 德宗、宪宗朝
  archetype: 苦吟诗人（穷苦之句的践行者）
  dilemmas:
  - 以诗穷至死，终生困顿而自喜为穷苦之句
  - 家贫物尽，「都无一物」而仍执意吟咏
  lesson: 非身备尝其苦，不能道其句；真诗出于真实处境
  summary_first_person: 我孟郊一生以苦吟著称，仕途穷蹇，平生尤自喜作穷苦之句。如《移居》云「借车载家具，家具少于车」，见我家之空无一物；又《谢人惠炭》云「暖得曲身成直身」，人谓非我身备尝其苦，不能道此句。我与贾岛同以诗穷至死，后世遂以「郊寒」称我。
  source_urls:
  - https://zh.wikisource.org/wiki/六一詩話
