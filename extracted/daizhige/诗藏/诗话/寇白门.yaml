  title_zh: 进言自赎，南归得万金相报
  date: ''
  year_of: ''
  summary_zh: 崇祯甲申国变后，朱氏举家籍没入燕京，欲卖歌姬自给。寇白门进言：卖妾不过得数百金，不如纵我南归，一月当得万金相报。朱氏纵之，越月果得万金。
