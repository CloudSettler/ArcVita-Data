  title_zh: 复流落乐籍，吴梅村作诗赠之
  date: ''
  year_of: ''
  summary_zh: 寇白门得金之后复流落乐籍之中，吴祭酒（吴伟业）作诗赠之，有江州白傅（白居易浔阳江头）之叹。
