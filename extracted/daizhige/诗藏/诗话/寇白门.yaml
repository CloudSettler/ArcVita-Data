  era: 明末清初
  reign_ref: ''
  archetype: 秦淮名妓·乱世自赎
  dilemmas:
  - 身在乐籍、为人姬妾，婚姻与命运皆由他人买卖支配
  - 国破家散之际，面临被丈夫卖掉换取数百金的绝境
  lesson: 绝境中不失胆识与自尊，以智谋与信义自救，赢得他人尊重与同情。
  summary_first_person: 我本南京教坊中女子，嫁保国公朱氏为姬。国变后朱氏举家籍没入燕京，生计困窘，欲将歌姬次第变卖。我自知若被卖出，不过得数百金，还将沦落他人之手。于是我进言：不如放我南归，一月之内必得万金相报。朱氏无可奈何纵我归去，我果然如期得万金以偿。然而此后我仍流落乐籍之中，吴梅村祭酒作诗赠我，有江州白傅之叹。
  source_urls:
  - https://zh.wikisource.org/wiki/婦人集
