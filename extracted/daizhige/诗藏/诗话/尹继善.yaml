  - key: climax
    name_zh: 与钱香树苏州叠韵角胜
    labels:
      zh: 诗艺
    start_date: '1760'
    highlight_event_id: guji-尹继善-event-he-yun
  decisions:
  - date: '1731'
    title_zh: 厚待七十岁候补道员杨守知
    rationale: 知为老名士，“所以奖慰之者甚厚”，并应声以“天意怜幽草，人间重晚晴”慰其老
  - date: '1760'
    title_zh: 任性和韵叠韵，多多益善
    rationale: 好与名士角胜，虽“马疲人倦”仍追诗吴江
events:
- id: guji-尹继善-event-birth
  date: '1695'
  year_of: 1695
  summary: 传主尹继善生（约康熙年间）
- id: guji-尹继善-event-save-yuanmei
  date: '1739'
  year_of: 1739
  summary: 己未朝考，袁枚诗句被作不庄论，大司寇尹公力争：“此人肯用心思，必年少有才者……我当独奏”，群议始息，袁枚得与馆选
- id: guji-尹继善-event-teach-shujishi
  date: '1739'
  year_of: 1739
  summary: 朝考后不久，上命尹公教习庶吉士，袁枚献诗谢知遇
- id: guji-尹继善-event-governor
  date: '1730'
  year_of: 1730
  summary: 尹文端公总督江南，年才三十，时人称“小尹”
- id: guji-尹继善-event-late-scene
  date: '1731'
  year_of: 1731
  summary: 督江南任上厚遇海宁老名士杨守知，答以“天意怜幽草，人间重晚晴”
- id: guji-尹继善-event-he-yun
  date: 1760-10
  year_of: 1760
  summary: 庚辰十月，与嘉兴钱香树尚书相遇苏州，和诗至十余次，又追寄一首于吴江；钱覆札自陈“战败于吴江道上”
- id: guji-尹继善-event-death
  date: '1771'
  year_of: 1771
  summary: 传主约卒于乾隆晚期，谥文端
