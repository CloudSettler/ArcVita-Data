person:
  qid: guji-尹继善
  name_zh: 尹继善
  names:
    zh: 尹继善、尹文端公、小尹
    en: Yin Jishan
  lifespan:
    birth:
      date: '1695'
      precision: year
      is_circa: true
      raw: 康熙年间生
    death:
      date: '1771'
      precision: year
      is_circa: true
  birth_date: '1695'
  death_date: '1771'
  era: 清
  reign_ref: 乾隆、雍正
  archetype: 政坛文学家/风雅总督
  dilemmas:
  - 位极人臣而雅好诗艺，公务与文事难以两全
  - 提携后进（袁枚）须在科场众议间独任其责
  lesson: 身居高位居可济人，济世与风雅并行不悖
  summary_first_person: 我尹继善，雍正进士，三十岁即总督江南，人称“小尹”。我为官七省经略之中亦以风雅著称，好和韵叠韵，每与人角胜，多多益善。当年朝考，我为袁枚力争，使其得与馆选；此后诗笺往还，酬和不休。
  source_urls:
  - https://zh.wikisource.org/wiki/隨園詩話
endeavors:
