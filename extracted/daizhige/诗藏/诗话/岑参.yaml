    title_zh: 弃郎官之选，远赴安西从军
    rationale: 欲于边功幕府中求进取，亲历塞上以成其诗
  - date: '756'
    title_zh: 还朝赴凤翔行在
    rationale: 玄肃之际，择忠于王室，由杜甫等荐授右补阙
events:
- id: guji-岑参-event-birth
  date: '715'
  year_of: 715
  type: birth
  title_zh: 岑参生于南阳新野岑氏之家
  description: 出身官宦世家，曾祖岑文本、伯祖岑羲皆显于唐初
- id: guji-岑参-event-jinshi
  date: '744'
  year_of: 744
  type: career
  title_zh: 天宝三载进士及第
  description: 登进士第，授率府兵曹参军，步入仕途
- id: guji-岑参-event-chusai
  date: '749'
  year_of: 749
  type: career
  title_zh: 首次出塞赴安西
  description: 充安西四镇节度使高仙芝幕府掌书记，始历西域烽戍
- id: guji-岑参-event-mingpian
  date: '754'
  year_of: 754
  type: literary
  title_zh: 再赴北庭，写下《白雪歌送武判官归京》诸名篇
  description: 入封常清北庭幕府，'忽如一夜春风来，千树万树梨花开'之句为世传诵，与高适并称'高岑'
- id: guji-岑参-event-jiazhou
  date: '767'
  year_of: 767
  type: career
  title_zh: 出为嘉州刺史
  description: 大历二年转官嘉州，罢官后客死成都，世称岑嘉州
- id: guji-岑参-event-death
  date: '770'
  year_of: 770
  type: death
  title_zh: 岑参卒于成都客舍
  description: 罢嘉州刺史东归，阻兵乱逗留成都而卒
