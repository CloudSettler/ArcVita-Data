  archetype: 边塞诗人
  dilemmas:
  - 出仕安西远赴边庭与奉养家中之两难
  - 乱世中随驾与择主之忠诚抉择
  lesson: 以雄奇笔触写塞外烽烟，于长途行役中见诗人济世之志
  summary_first_person: 我岑参，唐之边塞诗人也。列名《唐诗纪事》卷二十三，与高适、孟浩然同卷。曾两度出塞，佐戎幕于安西、北庭，遍历烽戍大漠，以(yu)奇崛之语状塞外风光；暮年转官嘉州，世称岑嘉州。
  source_urls:
  - https://zh.wikisource.org/wiki/唐詩紀事/卷023
