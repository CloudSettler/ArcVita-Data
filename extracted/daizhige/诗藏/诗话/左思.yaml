  reign_ref: 晋武帝至晋惠帝时期
  archetype: 寒门苦学的大赋诗人
  dilemmas:
  - 貌寝口讷而出身寒门，欲以文章在重门第的世族社会立足
  - 潜心十年构思《三都赋》，须忍旁人讥笑并遍访山川风物以徵实
  - 卷入贾谧“二十四友”交游圈，名成之后出处两难
  lesson: 构思十年，门庭藩溷皆著笔纸，遇得一句即疏之——大器晚成者以勤补拙，以实徵文
  summary_first_person: 我左思字太冲，临淄人。貌寝口讷而不好交游，唯以著文为事。为赋《三都》，构思十年，门庭藩溷皆置笔纸，偶得一句便即疏录。赋成之初，陆机曾抚掌笑我，及其成文，竞相传写，洛阳为之纸贵。我又作《咏史》八首，借古人杯酒浇自己块垒，“济济京城内，赫赫王侯居……寂寂扬子宅，门无卿相舆”，以扬雄自况，开咏史一体之正声。后世诗话如《对床夜语》犹举我与鲍照、江淹咏史之作并论，谓三诗一轨。
  source_urls:
  - 对床夜语·卷一（宋·范晞文撰）
