events:
- id: guji-左思-event-birth
  date: 约250
  year_of: 250
  type: birth
  title_zh: 左思生于临淄
  description_zh: 齐国临淄人，字太冲，貌寝口讷而辞藻壮丽，不好交游，惟以闲居为事。
- id: guji-左思-event-sandufu-begin
  date: 约280
  year_of: 280
  type: endeavor
  endeavor_id: guji-左思-endeavor-1
  title_zh: 始构思《三都赋》
  description_zh: 闻平吴之讯，遂构《三都赋》，构思十年，门庭藩溷皆著笔纸，遇得一句即便疏之。自以所见不博，求为秘书郎，遍阅图籍，访山川风物以徵实。
- id: guji-左思-event-sandufu-done
  date: 约291
  year_of: 291
  type: endeavor
  endeavor_id: guji-左思-endeavor-1
  title_zh: 《三都赋》成而洛阳纸贵
  description_zh: 赋成之初，陆机抚掌而笑；及皇甫谧为序、张华称善，豪贵之家竞相传写，洛阳为之纸贵。
- id: guji-左思-event-yongshi
  date: 约295
  year_of: 295
  type: endeavor
  endeavor_id: guji-左思-endeavor-2
  title_zh: 作《咏史》八首
  description_zh: “济济京城内，赫赫王侯居。冠盖荫四术，朱轮竟长衢。朝集金张馆，暮宿许史庐。南邻击钟磬，北里吹笙竽。寂寂扬子宅，门无卿相舆。”托古咏怀，开咏史一体。
- id: guji-左思-event-yongshi-hualu
  date: 约1260
  year_of: 1260
  type: legacy
  title_zh: 《对床夜语》举其咏史与鲍照江淹并论
  description_zh: 宋范晞文《对床夜语》载左太冲《咏史》诗，谓与鲍明远、江文通咏史之作“三诗一轨”，定为后世诗话定评。
- id: guji-左思-event-death
  date: 约305
  year_of: 305
  type: death
  title_zh: 左思卒
  description_zh: 齐王冏命为记室督，辞疾不就，后退居，以疾终于家。
