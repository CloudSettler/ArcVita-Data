events:
- id: guji-庄存与-event-birth
  date: '1719'
  year_of: 1719
  type: birth
  name_zh: 庄存与出生
  description: 庄存与生，常州府武进县人，后为清代著名经学家。
- id: guji-庄存与-event-yaohui
  date: '1744'
  year_of: 1744
  type: endeavor
  endeavor_id: guji-庄存与-endeavor-1
  name_zh: 摇会巧得资斧
  description: 将计偕入都，苦乏资斧，纠合一会；仿狄武襄两面钱故智，预置同式骰盆布置六赫，于帐中佯掷易盆示客，众咸称贺，遂得会资。
- id: guji-庄存与-event-zhuangyuan
  date: '1745'
  year_of: 1745
  type: endeavor
  endeavor_id: guji-庄存与-endeavor-1
  name_zh: 第一人及第
  description: 是科以第一人及第，大魁天下，入翰林，由此开启仕途与经学之路。
- id: guji-庄存与-event-scholarship
  date: '1780'
  year_of: 1780
  type: endeavor
  endeavor_id: guji-庄存与-endeavor-2
  name_zh: 潜心经学著述
  description: 治《春秋》公羊学，倡导今文经学，撰《春秋正辞》等，开常州学派之先声。
- id: guji-庄存与-event-death
  date: '1788'
  year_of: 1788
  type: death
  name_zh: 庄存与去世
  description: 庄存与卒，其学经外孙刘逢禄、庄绶甲等弘扬，影响晚清今文经学。
