person:
  qid: guji-庄存与
  name_zh: 庄存与
  names:
    zh: 庄存与
    en: Zhuang Cunyu
  lifespan:
    birth:
      date: '1719'
      precision: year
      is_circa: true
      raw: 清康熙五十八年（约1719）
    death:
      date: '1788'
      precision: year
      is_circa: true
      raw: 清乾隆五十三年（约1788）
  birth_date: '1719'
  death_date: '1788'
  era: 清代乾隆年间
  reign_ref: 乾隆
  archetype: earnesty-scholar
  dilemmas:
  - 资斧匮乏: 将计偕入都应试而苦无盘缠，陷入求财与名节的两难
  - 以奇谋取资: 仿狄青两面钱故智，以预置骰盆之术获得会资，事后众人不知其为窘迫所迫
  lesson: 穷困之际权以应变，终以真才折桂，机巧可济一时，功名还凭实学。
  summary_first_person: 我庄存与，常州人氏，早年将计偕入都赴试，苦于缺乏盘缠，不得已纠合乡里会钱，借狄武襄两面钱之故智，预置同式骰盆布置六赫，于帐中佯掷而易盆示众，宾朋皆称贺，遂得资斧。洎客散，视彼故盆亦六色皆绯，殊自喜。是科我乃以第一人及第。
