  dilemmas:
  - 功高位重之时，诗中言"恨太平"，恐遭奸人侧目之忌
  - 忠直直言与全身避祸之间的两难
  lesson: 一字之改可全身，虚怀纳谏方成一字之师佳话
  summary_first_person: 我张乖崖（张咏）作牧一方，功高位重，尝于几案题绝句"独恨太平无一事，江南闲杀老尚书"，以抒闲居不甘之意。萧楚才知溧阳县时召食见之，改"恨"为"幸"，谏我天下一统之际不宜言恨，免奸人借口。我出视稿而叹服，称其为"萧弟一字之师"。
