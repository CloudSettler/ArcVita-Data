    en: Zhang Bohang
  lifespan:
    birth:
      date: 1651
      precision: year
      is_circa: true
      raw: 顺治八年（据史补，文中未载生年）
    death:
      date: 1725
      precision: year
      is_circa: true
      raw: 雍正三年（据史补，文中未载卒年）
  era: 清代康熙、雍正年间
  reign_ref: 康熙 / 雍正
  archetype: 清廉刚直的封疆大吏
  dilemmas:
  - 居官清贫而不取民间一物，幕僚无座几竟日兀立
  - 廉德与官场仪需之间的两难
  lesson: 贞操亮节、清德不衰，抚吴时一几一榻亦禁借办于民间
  summary_first_person: 我是仪封张伯行，字孝先，谥清恪。抚吴时使院萧然，一几一榻皆禁向民间借办，虽屡乏所需而安之若素。幕僚代笔者无胡床可坐，竟日兀立，留诗别我而去，我见诗大惊，亟遣追还而不及。宇内咸推我贞操亮节，清德可谓不衰。
  source_urls:
  - 古籍《不下带编》卷一（金埴撰）
