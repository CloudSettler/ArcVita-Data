- id: guji-张戒-event-endeavor-2-a
  type: statement
  date: ''
  year_of: 南宋
  description: 依锺嵘《诗品》定《古诗》第一、曹子建次之，谓此乃不易之论；并论“韵不可及者曹子建，味不可及者渊明，才力不可及者太白退之，意气不可及者子美”。
- id: guji-张戒-event-endeavor-2-b
  type: statement
  date: ''
  year_of: 南宋
  description: 品评韩愈可敌李白、二豪不并立，当屈退之第三；又以杜诗微而婉，贬《长恨歌》为乐天最下之作。
