    title_zh: 断言诗妙于子建、成于李杜、坏于苏黄
    rationale: 以为子瞻以议论作诗，鲁直专以补缀奇字，学者先得其短。
  - date: ''
    title_zh: 评韩杜之豪雄而屈韩居第三
    rationale: 引苏子由“韩诗豪，杜诗雄，杜之雄可兼韩之豪”之说，自谓得之。
