  dilemmas:
  - 标举“言志乃诗人之本意”，批判苏黄用事押韵之诗风，其论难免得罪一时主流
  - 推崇杜甫而斥《长恨歌》为下品，须面对众人称诵之俗见
  lesson: 诗以言志为本、咏物为末；意、味、韵、气四者各有不可及之人。
  summary_first_person: 我著《岁寒堂诗话》，主张言志为诗之本，推尊曹植、杜甫，评骘古今诗人高下，不满苏黄以用事押韵为工之习。
  source_urls:
  - 岁寒堂诗话·卷上
