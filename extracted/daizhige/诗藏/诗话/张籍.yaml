  archetype: 乐府诗人
  dilemmas:
  - 韩愈奖掖与元白诗风之间，张籍以乐府讽喻自立门户，既承汉魏旧题之变，又创新题刺美见事
  - 身处中唐诗体大备之后，须在古律之争中抉择：师古而不泥，因袭与新变并举
  lesson: 穷苦之言易好——切身之事、讽兴之义，方得诗人之本
  summary_first_person: 我是张籍，与王建并称，专工乐府。我承杜甫新题乐府之绪，寓意古题，刺美见事，以浅易之语写世态人情，得诗人讽兴之义。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=642004
