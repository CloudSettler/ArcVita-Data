  - 身处新旧变革之际，士大夫身份与近代企业家角色的冲突
  lesson: 穷而后工，惟自道艰苦与怀抱者其诗乃真
  summary_first_person: 我是张謇，同光诗人中少有真感者之一，与张之洞并称“二张”。我于诗能自道其艰苦与怀抱，于世则状元办厂，处新旧绝续之交，以实业与教育自救其国。
  source_urls:
  - 丽白楼诗话·上编
