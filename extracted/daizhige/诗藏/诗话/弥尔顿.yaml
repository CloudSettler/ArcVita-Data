  summary_first_person: 我是英国诗人弥尔顿，晚年双目失明，著作多靠我口授、由女儿代为笔录，情形恰似中国的左丘明。世人文人多遭困厄，中西竟如出一辙，而左丘明尚不及我有一位这样好的女儿。
