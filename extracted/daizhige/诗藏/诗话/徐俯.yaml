  archetype: 江西诗派诗人·重名节之士
  dilemmas:
  - 随舅舅黄庭坚诗风，还是自为一家
  - 靖康之变中随流俗避伪楚讳，还是以名节自任
  lesson: 名节自立， 作诗亦不必似其舅， 自成一家方能见称于世。
  summary_first_person: 我是徐俯，字师川，黄庭坚的外甥。虽出其门而诗自为一家，不似渭阳。靖康中，朝列有改名避伪楚讳者，我名婢曰昌奴，朝士至则呼之，以名节自任，故诸人多推下之。
