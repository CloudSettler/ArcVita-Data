  dilemmas:
  - 身处明清易代乱世，词中寄寓兴亡之感
  - 身为闺阁女性，才名传世却受时代限制
  lesson: 乱世之中，词心不灭，以文字安顿兴亡之悲。
  summary_first_person: 我徐湘苹，才锋遒丽，平生著小词绝佳，南宋以来闺房之秀，一人而已。我词娣视淑真，姒畜清照，缠绵辛苦，兼撮屯田淮海诸胜。我为海宁陈相国之遴贤配，著《拙政园诗余》。
