  archetype: 文人幕僚 / 营造经画者
  dilemmas:
  - 值晋豫大灾之年，其师俞樾致书请停建俞楼，然徐琪与诸同门以尊师之意坚持续建
  lesson: 山水以人名，楼宇以道传；尊师重道须身体力行，虽一亭一台皆可为文脉传承之所托
  summary_first_person: 我徐琪，字花农，为诂经精舍曲园先生（俞樾）门下弟子。光绪三四年间，诸同门集资为师于孤山西麓筑俞楼，由我总其事。自经始于光绪四年四月，至岁末楼成，其后我又续建伴坡亭、曲曲廊、灵松阁、小蓬莱、文石亭诸胜，并撰《俞楼记》与《俞楼诗记·后记》，刻先生《俞楼诗记》。光绪七年仲冬工竣，谨识其后。
