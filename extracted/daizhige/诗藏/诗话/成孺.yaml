  archetype: 大儒/书院主讲
  dilemmas:
  - 汉宋之学如何并贯而归于诚笃实践
  - 晚岁主讲他乡，去留与传道之难
  lesson: 教人以诚笃求实践，日课必及《近思录》《朱子全书》
  summary_first_person: 我初名蓉镜，晚字心巢，人称芙卿先生，为宝应东南大儒。光绪初年，我为湖南校经堂主讲席，布袍大袖，善气迎人，时年已近七十。我淹贯汉宋之学，教人一以诚笃求实践，日课必及《近思录》与《朱子全书》。余少年气盛时，我曾手书相规；及我还江南，赋诗留别，次年即归道山。
  source_urls:
  - 褒碧斋诗话·民国·陈锐
