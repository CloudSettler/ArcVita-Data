  era: 云南甯州（今云南华宁一带）
  archetype: monk-poet
  dilemmas:
  - 出家为僧与怀有家国之思、寄意深远诗风之间的张力
  lesson: 乱世中以诗画寄托胸中不平，笔尖处处有秋声，寄意深远。
  summary_first_person: 我是滇南甯州人，剃度后以“担当”为号。工于题画诗，如“千层林麓尽皆枯，尚留一干坚如铁”，借枯木孤干喻孤忠坚节；又以“不待西风摇落尽，笔尖动处有秋声”写萧瑟之怀。我的诗有奇气，寄意深远，意在言外。
