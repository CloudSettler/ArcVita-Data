- id: guji-dandang-heshang-event-debut
  type: endeavor
  name_zh: 出家为僧并开始以诗画寄怀
  detail: 削发为僧后不废吟咏，诗有奇气。
- id: guji-dandang-heshang-event-achievement
  type: endeavor
  name_zh: 作题画诗与《池亭玩月》等佳篇
  detail: 题画云“僧手披霜色有无，千层林麓尽皆枯。尚留一干坚如铁，画里何人识董狐”“孤灯照影不胜情，净水茅堂冷气生。不待西风摇落尽，笔尖动处有秋声”，又《池亭玩月》云“霜老羁禽悲木落，水枯明月照残荷”，皆寄意深远。
- id: guji-dandang-heshang-event-death
  type: death
  name_zh: 担当和尚去世
  detail: 卒年不详，诗集题画之作传世。
