  dilemmas:
  - 才名极盛而廷试卷中偶有笔误，得失系于权臣一言
  lesson: 盛名之下，一字之失亦足以倾危前程；幸有知音援引，方能化险为夷
  summary_first_person: 我文廷式萍乡人，夙负盛名。壬辰科廷对时，误将"闾阎"书作"闾面"，被读卷大臣签出。幸常熟翁叔平协揆力言"闾面"二字确有来历，还称自己曾以闾面对檐牙作对，他人欲争为笔误亦被驳去，我竟得第二人及第。
