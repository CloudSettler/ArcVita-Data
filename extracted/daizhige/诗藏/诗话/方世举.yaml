person:
  qid: guji-方世举
  name_zh: 方世举
  names:
    zh: 方世举、息翁
    en: Fang Shiju
  lifespan:
    birth:
      date: '1675'
      precision: year
      is_circa: true
      raw: 清康熙年间生，约康熙十四年
    death:
      date: '1759'
      precision: year
      is_circa: true
  birth_date: 约1675年
  death_date: 约1759年
  era: 清代康熙、雍正、乾隆年间
  reign_ref: 康熙、雍正、乾隆
  archetype: 诗话作者与韩诗笺注家
  dilemmas:
  - 诗话屡作屡失，无以质之当世，鸡肋可惜
  - 才薄力弱，不能专宗家传杜诗之学
  lesson: 学诗当登高自卑，先求其次，日渐之德，熟诵深思乃自得之
  summary_first_person: 我从朱竹垞先生游，少年指摘顾侠君笺注韩诗诸说之不合，遂有《韩诗编年笺注》之作；老来屡失诗话，幸存宜田小册，因复理而出之，为《兰丛诗话》一家言。
endeavors:
- id: guji-方世举-endeavor-1
  name_zh: 研治韩诗，撰《韩诗编年笺注》
  labels:
    zh: 韩诗笺注
  phases:
  - key: brewing
    name_zh: 从游启蒙
    labels:
      zh: 从朱竹垞游
    start_date: '1690'
  - key: breakthrough
    name_zh: 指摘旧笺
    labels:
      zh: 纠顾氏笺注
    start_date: '1690'
  - key: climax
    name_zh: 编年笺注垂成
    labels:
      zh: 韩诗笺注成书
    start_date: '1740'
  decisions:
  - date: '1690'
    title: 通考昌黎身世诸说
    rationale: 顾侠君笺注于韩愈身世多有不合，先生怂恿通考以成书
- id: guji-方世举-endeavor-2
  name_zh: 撰诗话成一家言
  labels:
    zh: 诗话著述
  phases:
  - key: brewing
    name_zh: 京师谈诗
    labels:
      zh: 留都下十年谈诗
    start_date: '1710'
  - key: breakthrough
    name_zh: 梁园诗话
    labels:
      zh: 舒子展录为梁园诗话
    start_date: '1720'
  - key: closure
    name_zh: 兰丛诗话
    labels:
      zh: 复理宜田小册成书
    start_date: '1757'
  decisions:
  - date: '1757'
    title: 因宜田小册复出诗话
    rationale: 宜田有当余心者入之以为一家言，不敢剿说雷同
events:
- id: guji-方世举-event-birth
  type: birth
  date: '1675'
  year_of: 1675
  title: 方世举生
  detail: 约康熙年间生
- id: guji-方世举-event-1
  type: endeavor
  date: '1690'
  year_of: 1690
  title: 从朱竹垞先生游并指摘顾侠君笺注
  detail: 值顾侠君笺注昌黎诗集新出，少年贸贸指摘于先生前，先生怂恿通考，为韩诗编年笺注所自始
- id: guji-方世举-event-2
  type: endeavor
  date: '1710'
  year_of: 1710
  title: 留都下十年与翰苑诸君谈诗
  detail: 康熙末留都下者十年，与汪武曹、何屺瞻诸布衣交不时过从，谈诗为事，舒子展录为梁园诗话
- id: guji-方世举-event-3
  type: endeavor
  date: '1723'
  year_of: 1723
  title: 雍正初南归，途扬州留笺注李义山集
  detail: 南归舟过扬州，表弟程午桥留笺注李义山集，宜田侄一见立成诗律
- id: guji-方世举-event-death
  type: death
  date: '1759'
  year_of: 1759
  title: 方世举卒
  detail: 老而有汉 书辨注、世说考义、家塾恒言诸小著述，兰丛诗话成
