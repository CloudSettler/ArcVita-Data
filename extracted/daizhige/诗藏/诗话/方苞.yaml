  dilemmas:
  - 戴名世《南山集》案牵连下狱，身陷生死与义节两难
  - 奉敕编书与坚守古文义法之间的取舍
  lesson: 言有物而言有序，文章以义法为宗，逆境中仍以文传世。
  summary_first_person: 我方苞，字灵皋，号望溪，桐城人。因《南山集》案牵连下狱，蒙赦後以白衣入直南书房，累官至礼部侍郎。我倡古文义法，开桐城派之先，诗文兼擅，晚岁笃守家传杜诗之法。
