  dilemmas:
  - 幼陷贼中，父拒以贿赎，得僧格林沁救还
  - 官至广西右江兵备道，为岑云阶所劾罢官，潦倒江湖
  - 辛亥后屈居僚下，携妾居京都，穷困抑郁以死
  lesson: 才高命蹇，狂士风流终难逃乱世沉沦
  summary_first_person: 我易顺鼎，汉寿人，号实甫，幼有神童之目。儿时陷于贼中，先父叟叟方伯拒不赎买，贼反爱护我、养为己子；后僧格林沁夜追贼时得我，送付应城县。平生笃好扶乩，自谓遇李仙于并门，证为张梦晋后身。在清代官至广西右江兵备道，为岑制军所劾罢官，从此潦倒江湖；辛亥后屈居僚下，携一妾寓居京都，穷困抑郁而死。诗生前陆续自刊而无全集，殁后程子大拟编定亦未果，身后萧条，与孟晋乞食相类，一时戏言竟成终身谶语，可哀也矣。
  source_urls:
  - 忍古楼诗话·民国·夏敬观
