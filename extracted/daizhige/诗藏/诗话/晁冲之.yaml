  date: '1094'
  year_of: 1094
  title_zh: 绍圣初退隐具茨山下
  description: 方绍圣初，伟异豪爽之士离谗放逐，晁氏群从多在党中，叔用飘然遗形，逝而去之，宅幽阜荫茂林于具茨之下
- id: guji-晁冲之-event-decline
  type: achievement
  date: '1105'
  year_of: 1105
  title_zh: 朝廷起用不就
  description: 暨朝廷诸公谋欲起之，乃复任心独往，高挹而不顾，世之荣利不得而羁
- id: guji-晁冲之-event-burn
  type: achievement
  date: '1140'
  year_of: 1140
  title_zh: 疾革焚其平生所著书
  description: 至于疾革，取平生所著书聚而焚之，曰「是不足以成吾名」，惟歌诗二百许篇存焉
- id: guji-晁冲之-event-death
  type: death
  date: '1149'
  year_of: 1149
  note: 约卒于绍兴中，世称具茨先生，其子晁公武编存先君歌诗
