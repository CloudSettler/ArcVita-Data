  dilemmas:
  - 党争压迫下出仕与避世的抉择
  - 临终焚书与其诗名传世之间的矛盾
  lesson: 深于道者遁于世而不怨，发于词而不怒
  summary_first_person: 我出身清丰晁氏甲门，家藏二万卷。绍圣党祸之际我飘然退隐具茨山下，朝廷诸公欲起用我，我任心独往不顾。临终焚平生所著，惟歌诗二百余篇存世，后世称我具茨先生。
  source_urls:
  - https://zh.wikisource.org/wiki/江西诗派小序
