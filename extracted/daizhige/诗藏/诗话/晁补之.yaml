  dilemmas:
  - 元祐党禁下元祐子弟不得仕宦京师，仕途与党争纠缠
  - 晚年评词自遣，在文学自足与政治失意之间取舍
  lesson: 文章至足之余自溢为奇怪；退而托兴词曲，亦足以自遣一生
  summary_first_person: 我乃苏门四学士之一的晁补之，长于诗文词曲，晚年评小晏、鲁直、少游之词以自遣，虽经党禁废黜，仍以文章名世。
