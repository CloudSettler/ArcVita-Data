  dilemmas:
  - 才盖当世而为兄长曹丕所忌，夺嫡之争中深自敛退
  - 处人伦之变而不敢废恭顺之义，以仁智自全
  lesson: 处猜忌之世，敛才守顺，以文义自全，可为处兄弟之变者法
  summary_first_person: 吾以盖代之才见忌于兄，黄初之世数遭贬削，然素无夺嫡之念，作诗责躬、上表求自试而不敢废恭顺之义，虽见灌均谗构，无一毫怨兄之意，终以文义自全。
