  summary_first_person: 我是曾巩，人称"曾夫子"。早年在太平州任司户时，太守张伯玉轻慢于我；然当他为我示范〈六经阁记〉笔法、从容应对隐晦书传之问时，我心悦诚服，自此立志广读异书，学问文章日益精进。
  source_urls:
  - https://zh.wikisource.org/wiki/紫微诗话
