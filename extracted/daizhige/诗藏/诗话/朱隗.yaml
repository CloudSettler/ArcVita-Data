person:
  qid: guji-朱隗
  name_zh: 朱隗
  names:
    zh: 朱隗
    en: Zhu Wei
  lifespan:
    birth:
      is_circa: false
      raw: 不详
    death:
      is_circa: false
      raw: 不详
  era: 明末（崇祯年间）
  reign_ref: 明思宗崇祯
  archetype: 诗选家与批评家
  dilemmas:
  - 诗坛尚气格与尚幽灵纷然各是，情与法难以两全
  - 明三百年诗人如林，选本难以卒业，须分集问世
  - 评诗欲取公心，不敢执一说强天下以必从
  lesson: 评诗当以古今人共同之情为法，取其至庸而不可易者，寄公心于千人心而不执一己之私见。
  summary_first_person: 我朱隗长洲人，二十余年间裒辑诸家之诗，从事明诗选评之役，断以己意，崇祯甲申书成《明诗平论》，寄公心于情与法之间。
endeavors:
- id: guji-朱隗-endeavor-1
  name_zh: 辑评《明诗平论》
  labels:
    zh:
    - 文献编纂
    - 诗歌批评
  phases:
  - key: brewing
    name_zh: 裒辑诸篇
    labels:
      zh:
      - 收藏
      - 选诗
    start_date: 约1624
    highlight_event_id: guji-朱隗-event-start
  - key: breakthrough
    name_zh: 评次成编
    labels:
      zh:
      - 评点
      - 编次
    start_date: 约1640
    highlight_event_id: guji-朱隗-event-complete
  - key: climax
    name_zh: 二集问世
    labels:
      zh:
      - 刊行
    start_date: '1644'
    highlight_event_id: guji-朱隗-event-publish
  - key: closure
    name_zh: 拟续三集
    labels:
      zh:
      - 补遗
    start_date: '1644'
    highlight_event_id: guji-朱隗-event-plan
  decisions:
  - date: 约1640
    title_zh: 断限起天启辛酉迄崇祯甲申春
    rationale: 三百年作者如林未易卒业，故分集问世，二集专收晚明之诗。
  - date: '1644'
    title_zh: 乐府杂体并四言诗次五七言古诗之后
    rationale: 乐府体杂出可散入诸格，步趋元倡大似临摹，不当端立一门。
  - date: '1644'
    title_zh: 取平于情与法之间，不执一说
    rationale: 情偏摹古或趋新，各是其所是，故取至庸不可易者以俟情法自定。
events:
- id: guji-朱隗-event-birth
  date: 约1600
  year_of: 1600
  type: birth
  name_zh: 朱隗生
  detail_zh: 朱隗生年不详，长洲人。生年暂以约数系之。
- id: guji-朱隗-event-start
  date: 约1624
  year_of: 1624
  type: endeavor
  name_zh: 始裒辑明诗诸篇
  detail_zh: 书序自言二十余年以来颇裒辑诸篇，有明诗选平论之役，据此逆推其着手约在天启初年。
- id: guji-朱隗-event-complete
  date: '1644'
  year_of: 1644
  type: endeavor
  name_zh: 评次粗定
  detail_zh: 间采前人所言而断以己意，随类傅会，二集评次粗定。
- id: guji-朱隗-event-publish
  date: '1644'
  year_of: 1644
  type: work
  name_zh: 书成序于支硎山紫宙斋
  detail_zh: 崇祯甲申长洲朱隗书《明诗平论》序于支硎山之紫宙斋，计各体诗二十卷，裒次成书。
- id: guji-朱隗-event-plan
  date: '1644'
  year_of: 1644
  type: endeavor
  name_zh: 拟续三集搜补散佚稿件
  detail_zh: 因山城迁转稿件多致散佚，统前后补亡拾遗及海内名稿，拟入三集。
- id: guji-朱隗-event-death
  date: 约1650
  year_of: 1650
  type: death
  name_zh: 朱隗卒
  detail_zh: 朱隗卒年不详，暂以约数系之，俟考。
