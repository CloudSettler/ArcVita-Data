  dilemmas:
  - 深于寄托的诗心与晦涩难解的际遇之间的张力
  - 才名远播而仕途淹蹇，寄人幕府以终老
  lesson: 措词寓意深妙者，往往以一生沉沦换来千古诗名；文字可以传世，命运未必酬才。
  summary_first_person: 我字义山，号玉溪生。少年客游，于逆旅席间即席赋《木兰花》诗，四座惊叹，方知我名。世人酷爱我“可怜半夜虚前席，不问苍生问鬼神”之句，叹我措词寓意深妙。然我一生困于牛李党争之间，沉沦幕府，以清峭感怆之诗自见，身后诗名冠绝晚唐。
  source_urls:
  - https://zh.wikipedia.org/wiki/李商隐
