events:
- id: guji-李商隐-event-birth
  event_type: birth
  date: 0813
  year_of: 813
  is_circa: true
  name_zh: 李商隐出生
  description: 李商隐生约813年，晚唐荥阳人，字义山。
- id: guji-李商隐-event-mulan
  event_type: endeavor
  date: 0830
  year_of: 830
  is_circa: true
  name_zh: 逆旅即席赋《木兰花》诗
  description: 义山少游投宿逆旅，主人会客召与同坐，不知其为义山。酒酣席客赋《木兰花诗》，义山后就，吟“洞庭波冷晓侵云，日日征帆送远人。几度木兰舟上望，不知元是此花身”，坐客览之大惊，方知其为义山。
- id: guji-李商隐-event-jia-sheng
  event_type: endeavor
  date: 0838
  year_of: 838
  is_circa: true
  name_zh: 咏《贾生》成千古名句
  description: 义山作《贾生》诗，“可怜半夜虚前席，不问苍生问鬼神”两句，邓帅钱若水举以示人，叹曰“措意如此，后人何以企及”。
- id: guji-李商隐-event-praise
  event_type: endeavor
  date: 0847
  year_of: 847
  is_circa: true
  name_zh: 诗为陈恕酷爱，名公叹赏
  description: 杨大年称义山诗，陈恕酷爱其“珠箔轻明覆玉墀”一绝，叹曰“古人措词寓意，如此深妙，令人感慨不已”。
- id: guji-李商隐-event-yuxi-style
  event_type: endeavor
  date: 0850
  year_of: 850
  is_circa: true
  name_zh: 玉溪体为后进所慕
  description: 鹿门先生唐彦谦为诗纂，慕玉溪，得其清峭感怆，盖其一体也，然警绝之句亦多有。
- id: guji-李商隐-event-death
  event_type: death
  date: 0858
  year_of: 858
  is_circa: true
  name_zh: 李商隐去世
  description: 李商隐卒约858年，一生沉沦幕府，而诗名冠绝晚唐，为后世传诵不衰。
