    en: Li Ciming
  lifespan:
    birth:
      date: '1830'
      precision: year
      is_circa: true
      raw: 生年待考，据史载约道光十年
    death:
      date: '1894'
      precision: year
      is_circa: false
      raw: 卒年据史载约光绪二十年
  birth_date: '1830'
  death_date: '1894'
  era: 清代晚期
  reign_ref: 光绪
  archetype: 文人学者
  dilemmas:
  - 科举连蹇，久不得志于有司，迫于生计necessarily纳赀捐官，而心耻之
  - 受周氏昆仲（昀叔）救助得以入仕，后却与之凶终隙末，恩怨交缠
  lesson: 才高而气傲，虽以著述日记名世，然恩怨之际，毁誉之交，终见文人立身处世之难
  summary_first_person: 我李慈铭，莼客也。久困场屋，连不得志于有司，赖周昀叔先生怜才，劝我纳赀为郎，假馆授餐，为之游扬于周商城、翁常熟、潘文勤之门，我之名始大。然初次集赀被骗丧资，继乃罄产始得官，颇疾首痛心于周氏，凶终隙末。后于日记中诋斥周氏之语，后皆抹去，盖亦自有悔心。我论诗极不满于赵撝叔一流，斥其以碑版金石炫世沽名。所著《白华绛跗集》《越缦堂日记》，评骘诸家，于谢茂秦五律之评，亦与诸家相同。
  source_urls:
  - https://zh.wikisource.org/wiki/定庵诗话
