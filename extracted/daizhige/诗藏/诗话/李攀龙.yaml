  dilemmas:
  - 官居常调、家境清贫，却狷介自守、绝不趋附权贵干谒
  - 欲接续李梦阳、何景明之后振兴诗道，慨叹少陵氏殁千余年文运属谁
  lesson: 不逐众为奸谒、以自爱相勉，方能以诗文自立于世
  summary_first_person: 我李攀龙，字于鳞，历城人，举进士，今为刑部郎中。我于书无所不通，为人狷介忠信，好为深沉之思，家贫而绝不逐众干谒。我折节与王世贞交好，相勉自爱，又常慨然称少陵氏殁千余年，李、何廓而未化，天乎属何人哉。
  source_urls:
  - 明诗评（明）王世贞撰
