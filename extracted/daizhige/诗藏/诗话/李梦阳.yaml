  decisions:
  - date: ~1495
    title: 昼夜取左氏、迁史、骚雅、李杜二家集风之
    rationale: 不欲折节就长沙公之诗名，故别辟蹊径，以杜为归，遂名传海内
  - date: ~1420
    title: 献吉度不可复用，即归大梁
    rationale: 再坐构讦免官，自知不为朝局所容，遂家居读书为诗文
