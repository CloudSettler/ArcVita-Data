person:
  qid: guji-李梦阳
  name_zh: 李梦阳
  names:
    zh: 李梦阳
    en: Li Mengyang
  lifespan:
    birth:
      date: '1473'
      precision: year
      is_circa: true
      raw: 卒年五十九，归后十六年卒，生平约成化、弘治间
    death:
      date: '1530'
      precision: year
      is_circa: true
  birth_date: '1473'
  death_date: '1530'
  era: 明·弘治、正德年间
  reign_ref:
  - 弘治
  - 正德
  archetype: 前七子领袖·复古诗家·直臣
  dilemmas:
  - 仕与隐：屡因直言下狱罢官，度不可复用而归大梁，傲睨不礼郡国守相
  - 复古与自得：倡师法杜甫、左氏迁史，然世讥其似少陵氏盗侠，未能自为诗
  lesson: 破台阁体之俗，以复古开诗道，然钩摘袭古亦致后进訾议
  summary_first_person: 我李梦阳，字献吉，初为户部主事，以书斥外戚张氏下狱，蒙赦而奋复古之论；再因草疏论中贵人放为民，起按察副使视江西学政，复与藩长构讦去官，归大梁，读书诗文、射猎繁吹台间，年五十九而卒。
