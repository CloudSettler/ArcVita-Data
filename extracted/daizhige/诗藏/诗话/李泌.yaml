  name_zh: 帝驰召泌入禁中
  description_zh: 开元中悉召能言佛、道、孔子者相答难禁中。员俶九岁升堂，词辨注射，坐人皆屈。帝异之，问童子有类若者乎，俶跪奏臣舅子李泌，帝驰召之。
  source_zh: 全唐诗话续编·卷上·李泌
