  person_id: guji-李泌
  type: endeavor
  date: 0728
  year_of: 0728
  is_circa: true
  endeavor_id: guji-李泌-endeavor-1
  name_zh: 方圆动静之对
  description_zh: 帝方与张说弈，命说试其能。说请赋方、员、动、静，举棋为喻：方若棋局，员若棋子，动若棋生，静若棋死。泌即答曰：方若行义，圆若用智，动若骋才，静若得意。说起贺帝得奇童。
  source_zh: 全唐诗话续编·卷上·李泌
