  dilemmas:
  - 方圆动静之辩：童子御前仓促应对，须以略求详、以义智胜棋喻
  - 才显于外而善视于家：蒙帝王赏识，进退在赐与不赐之间
  lesson: 敏捷之才贵在化有形为无形——以行义、用智、骋才、得意应方圆动静，胜于拘泥物象
  summary_first_person: 我字长源，七岁能为文。开元中天子召能言佛、道、孔子者相答难禁中，员俶以臣荐，帝驰召。张说请赋方、员、动、静，我以行义、用智、骋才、得意对之，说起贺帝得奇童，帝赐束帛而敕其家善视我。
  source_urls:
  - 全唐诗话续编·卷上·李泌
