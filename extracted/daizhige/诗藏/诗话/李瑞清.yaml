  dilemmas:
  - 清亡之后，守节自处还是出仕新朝
  - 诗艺高妙却为书名所掩，人不能尽知
  lesson: 国变山河之际，以笔墨自养，服道士服而节不移，士之自处如是。
  summary_first_person: 我李瑞清，字梅庵，临川人。清亡后不仕民国，服道士服，往来宁沪间鬻书画自给，自署清道人，儿童走卒皆知有李道士。我诗以五古最高，七绝有东川、龙标格意，惜为书名所掩。
