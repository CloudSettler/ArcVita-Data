  archetype: 浪漫主义鬼才诗人
  dilemmas:
  - 才华绝世而早逝，未能“少加以理”以奴仆命《骚》
  - 诗风虚荒幻诞，虽为《骚》之苗裔而理有所不及
  lesson: 艺术上的极致想象可超越时代，但生命短促使天才的完整面貌终究成谜
  summary_first_person: 我字长吉，生于唐元和之前，以歌诗惊世。韩吏部亦颇道我诗。我的辞句如鲸呿鳌掷、牛鬼蛇神，为《骚》之苗裔。惜乎天不假年，二十七岁而卒，世人皆叹：使我未死，稍加理致，可奴仆命《骚》也。
