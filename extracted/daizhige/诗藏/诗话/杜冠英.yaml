  archetype: 御侮守土的循吏良将
  dilemmas:
  - 敌舰压境，守土用炮与和战大计之间的抉择
  - 立功之后朝廷赏罚不一，功臣未获通显，仕途困顿
  lesson: 保家卫国之功或在身后，不为闻达所系，守土者自尽其责
  summary_first_person: 我杜冠英在光绪朝中法之役时任宁波知府，与参将吴杰施发巨炮击中进犯招宝山之敌舰，时论并有歼其大将孤拔之说。朝廷旌功，我得画像紫光阁之荣；然事后未闻通显，功名止于守土一役而已。
