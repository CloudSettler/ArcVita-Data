    rationale: 以白居易非祜之论为不平，故盛言其美，欲苟异于白而曲成于张
  - title_zh: 著文章抨击元白喜为淫言媟语
    rationale: 恨方在下位，未能以法惩治浮嚣文风，以论辅佐张祜
