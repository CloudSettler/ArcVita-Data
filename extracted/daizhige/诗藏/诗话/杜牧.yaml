  death_date: '852'
  era: 晚唐
  reign_ref: 唐文宗、唐武宗、唐宣宗时期
  archetype: 风骨峭拔的诗人与史论家
  dilemmas:
  - 不满白居易对张祜宫词的贬抑，欲为友人张目又需直面文坛宗主之论
  - 身在下位而欲以文辞针砭元白浮艳诗风，力不能及
  lesson: 诗歌品评宜还诗以公道，交谊与见识可以借诗立言，风骨不因地位而折
  summary_first_person: 我是杜牧，晚唐诗人。守秋浦时与张祜为诗酒之友，最爱吟诵他的宫词。白居易曾非议张祜，我心中不平，作诗为祜正名：「谁人得似张公子，千首诗轻万户侯」，又言「如何故国三千里，虚唱歌词满六宫」。我更著论直斥近世元白喜为淫言媟语、鼓扇浮嚣，恨自己位居下位，未能以法治之。我同时为李贺文集作序，赞其诗为《骚》之苗裔，词或过之。
