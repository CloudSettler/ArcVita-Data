    start_date: '1160'
  - key: breakthrough
    name_zh: 诗坛唱酬
    labels:
      zh:
      - 赠答序跋
    start_date: '1185'
  - key: climax
    name_zh: 品评诸家
    labels:
      zh:
      - 序千岩摘藁
    start_date: '1195'
    highlight_event_id: guji-yangwanli-event-poetry-praise
  - key: closure
    name_zh: 晚年酬酢
    labels:
      zh:
      - 声闻及晚
    start_date: '1205'
  decisions:
  - date: ~1195
    title_zh: 为萧千岩摘藁作序
    rationale: 借序而aleación诸家风格，以成一家诗论
events:
- id: guji-yangwanli-event-birth
  title_zh: 杨万里出生
  date: '1127'
  year_of: 1127
  kind: birth
  description: 南宋绍兴初，杨万里生于江西。后字廷秀，号诚斋。
- id: guji-yangwanli-event-poetry-praise
  title_zh: 诗名获推许，与诸大家并称
  date: '1195'
  year_of: 1195
  kind: achievement
  description: 杨诚斋序千岩摘藁谓近世诗人范石湖、尤梁溪、陆放翁、萧千岩皆余之所畏者；姜白石亦引尤延之言，称近世宗江西者，痛快有如杨廷秀，皆自出机杼。
- id: guji-yangwanli-event-late-works
  title_zh: 晚年诗歌为时人推奖传诵
  date: '1200'
  year_of: 1200
  kind: achievement
  description: 赵与虤《娱书堂诗话》称书中多引陆游、杨万里、楼钥等晚年之作，可想见其诗坛地位历久弥隆。
- id: guji-yangwanli-event-death
  title_zh: 杨万里去世
  date: '1206'
  year_of: 1206
  kind: death
  description: 开禧二年，诚斋先生卒。
