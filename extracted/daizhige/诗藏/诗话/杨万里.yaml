    start_date: '1206'
  decisions:
  - date: '1180'
    title_zh: 摆脱江西诗法，自成痛快一格
    rationale: 姜白石药引尤延之言，称近士喜宗江西，而温润如范至能、痛快如杨廷秀等皆自出机杼，不必以江西为法
  - date: '-'
    title_zh: 序萧千岩摘藁并论列诸家
    rationale: 我尝论近世诗人，范石湖清新、尤梁溪平淡、陆放翁敷腴、萧千岩工致，皆余之所畏者
- id: guji-yangwanli-endeavor-2
  title_zh: 与时贤唱和往来，切磋诗艺
  labels:
    zh:
    - 交游唱和
  phases:
