person:
  qid: guji-yangwanli
  name_zh: 杨万里
  names:
    zh: 杨万里
    en: Yang Wanli
  lifespan:
    birth:
      date: '1127'
      precision: year
      is_circa: true
      raw: 绍兴年间生，一般定为建炎元年（1127）
    death:
      date: '1206'
      precision: year
      is_circa: true
      raw: 开禧二年卒（1206）
  birth_date: '1127'
  death_date: '1206'
  era: 南宋
  reign_ref: 宋高宗绍兴至宋宁宗开禧年间
  archetype: 诗人
  dilemmas:
  - 生于南宋偏安之际，诗学上一度追随江西诗派，后须突破藩篱而自出机杼
  - 姜白石转述尤延之之问：「痛快有如杨廷秀者乎？……又奚以江西为哉？」可见其被推为脱离江西而自成一家之典型
  lesson: 学诗而当自出机杼，不拘泥于宗派师法。
  summary_first_person: 我杨万里，字廷秀，号诚斋。世称我的诗痛快有力，与范成大、尤袤、陆游并推为大家。我尝自评近世诗人，以范石湖、尤梁溪、萧千岩、陆放翁皆我所畏；而时人亦称我自出机杼，不效江西。
  source_urls:
  - 娱书堂诗话·提要及内文（宋 赵与虤撰）
