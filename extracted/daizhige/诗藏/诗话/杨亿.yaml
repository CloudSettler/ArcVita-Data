  detail: 昆体盛行之际，议者谓其用故事多至语僻难晓；六一诗话则辨其为学者之弊，非倡者之过——如子仪《新蝉》句虽用故事亦无害为佳句。
  endeavors_permitted_for:
  - guji-杨亿-endeavor-2
