      raw: 杨亿生于宋太祖开宝七年（974年）
    death:
      date: '1020'
      precision: year
      is_circa: true
      raw: 杨亿卒于宋真宗天禧四年（1020年）
  birth_date: 0974
  death_date: '1020'
  era: 北宋
  reign_ref: 宋太宗、宋真宗朝
  archetype: 西昆体诗宗与骈俪文豪
  dilemmas:
  - 西昆典故繁密，虽才雄笔力有余，然后学效之而语僻难晓，致诗风遭老辈訾议
  - 唱和之作骤开风气，一时争效，而学者之弊反归咎于倡导者
  lesson: 雄文博学、笔力有余故无施不可；然流派之盛，学者承其形骸而失其神采，非宗师之过。
  summary_first_person: 我是杨亿，字大年。与钱惟演、刘筠诸公唱和，《西昆集》既出，时人争相仿效，诗体为之一变。我先辈多怪我用典太多、语僻难晓，殊不知那只是学人的弊病，我雄文博学，笔力有余，用典不用典故都能成为佳句。
  source_urls:
  - https://zh.wikisource.org/wiki/六一詩話
