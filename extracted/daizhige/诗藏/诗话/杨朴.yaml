  - 被太宗召见并许官，面临出仕与归山的抉择
  - 毕士安（毕相）荐举之恩与自身不仕之志相冲突
  lesson: 淡泊名利，不受荣禄，以诗自适；其子从政代之承事，足见亦能权衡家计与隐志。
  summary_first_person: 我杨朴，字契玄，郑州人，以诗闻名，终身不肯为官。太宗召见时我面赋〈蓑衣诗〉，辞官归山，朝廷以我子从政为长水尉。我作〈七夕诗〉讥人间机巧之多，传诵一时。
