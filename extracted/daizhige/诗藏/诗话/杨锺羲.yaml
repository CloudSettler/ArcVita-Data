  dilemmas:
  - 遗民之志与新时代学术之间的取舍
  - 借诗话表彰死节殉难者而倾诉北风之思
  lesson: 以诗存史，因诗及事，借文献表彰气节，使一代风气借诗话而可考见。
  summary_first_person: 我是辽阳杨锺羲，字子勤，汉军旗人。曾与王静安先生同直清南书房，入民国后效忠不出，绩集《雪桥诗话》三集，于论诗之外，尤重朝章国故、八旗文学与死节遗民之表彰，以志我北风之思。
