    rationale: 先高祖以下墓田并在良乡，文文山所过雪桥度在琉璃河左右，取以名书，誓墓未能，聊志北风之思。
  - date: 1912
    title_zh: 特为表彰明末遗士孤臣及清死节之人
    rationale: 身为前清遗老，凡有诗文可采者皆著录褒异，所以见志。
