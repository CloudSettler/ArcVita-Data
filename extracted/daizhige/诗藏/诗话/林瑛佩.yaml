      date: ''
      precision: unknown
      is_circa: true
      raw: 生年不详，年十四时父林云铭遭耿变下狱（约在三藩之乱期间）
    death:
      date: ''
      precision: unknown
      is_circa: true
      raw: 卒年不详
  birth_date: ''
  death_date: ''
  era: 清初（约康熙年间）
  reign_ref: 康熙
  archetype: 孝烈才女
  dilemmas:
  - 父陷囹圄存亡未卜，己身未嫁而独任救父护弟之责
  - 事亲与守身两难，藏刃自防、股疗母疾兼力持家务
  lesson: 危难之中，孝勇与才慧足以撑父护弟于倾覆。
  summary_first_person: 我本侯官林云铭之女，十四岁时父亲遭耿变下狱。我把幼弟藏匿深山，袖中藏利刃自防，日日送粥饭探狱，号腹疗救惊悸成疾的母亲，独任家务，终于使父亲免难。我聪慧工诗，嫁拔贡生郑郯，有"千里梦随蛮水远，数行泪趁浙潮生"之句，著《悬黎遗稿》二卷传世。
