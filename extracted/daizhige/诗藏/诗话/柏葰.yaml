  archetype: 科场案中的宰执重臣
  dilemmas:
  - 身居军机宰执之位而受制于肃顺一党的倾轧构陷
  - 文宗不忍杀宰执重臣，肃顺以“杀考官非杀宰相”坚请置法
  lesson: 位极人臣亦难逃党争罗织，执法与权斗之辨后世当鉴
  summary_first_person: 我柏葰官至大学士、军机大臣，咸丰八年充顺天乡试正主考，因平龄、罗鸿绎等关节事为载垣、端华、肃顺辈所中伤，家人靳祥下狱，我亦褫职。己未二月奉旨与浦安等同日弃市。皇上文宗垂涕曰“宰执重臣岂能遽杀”，而肃顺力言“此杀考官，非杀宰相也”。我死之时，彗星长亘于天。
  source_urls:
  - https://zh.wikipedia.org/wiki/柏葰
