  - 居官与著述如何兼顾
  lesson: 为官之余不废著述，勤学博采可成一家之言
  summary_first_person: 我扬历中外垂四十年，居官之余不废著述，于经、小学、史、掌故、考据、文章皆有撰述，尤以裴注《三国》、李注《文选》的旁证详征博引、订正缺失为心力所萃，并纂有《闽川闺秀诗话》以传闺秀之诗。
