- id: guji-梁章钜-event-works
  type: endeavor
  title_zh: 撰定诸学著作
  description: 撰《论语旁证》二十卷、《孟子旁证》十四卷、《夏小正通释》四卷、《仓颉篇校证》三卷、《三国志旁证》二十四卷、《枢垣纪略》十六卷、《称谓拾遗》十卷、《文选旁证》四十六卷等数十种，裴注《三国》、李注《文选》尤详征博引，兼订正其缺失
  related_endeavor_ids:
  - guji-梁章钜-endeavor-2
- id: guji-梁章钜-event-shihua
  type: endeavor
  title_zh: 撰《闽川闺秀诗话》
  description: 采辑闽川闺秀诗人事迹与遗篇，录林玉衡、陆眷西、许琛等诸女士之诗，成《闽川闺秀诗话》
