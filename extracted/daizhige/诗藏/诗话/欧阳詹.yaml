events:
- id: guji-欧阳詹-event-jinshi
  date: 0792
  year_of: 0792
  title_zh: 贞元八年登进士第第三
  detail: 兵部侍郎陆贽知贡举，取二十二人，贾棱为首，欧阳詹第三。赋题明水，诗题御沟新柳。同榜后为宰相者三人：王涯、李绛、崔羣。
  source: 登科记
- id: guji-欧阳詹-event-zhujiao
  date: 0793
  year_of: 0793
  title_zh: 除国子四门助教
  detail: 关试毕薄游太原，还京后除国子四门助教，食太学之禄，助成均之教。
  source: 闽川名士传
- id: guji-欧阳詹-event-taiyuan
  date: ''
  year_of: 0792
  title_zh: 太原邂逅
  detail: 毕关试薄游太原，于乐籍中有所悦，情甚相得，盟曰至都当相迎，洒泣而别，赠以诗。
  source: 闽川名士传
- id: guji-欧阳詹-event-death
  date: ''
  year_of: ''
  title_zh: 见遗诗一恸而卒
  detail: 太原妓积望成疾，绝笔题诗寄紫罗裳之验。詹使至，女弟持诗归京，詹启函见诗，一恸而卒，卒官灵台。孟简赋诗哭之，韩愈作何蕃书所谓欧阳詹生者。
  source: 闽川名士传
