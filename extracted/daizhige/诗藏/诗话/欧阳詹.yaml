  dilemmas:
  - 赴举守约与私情的抉择：与太原妓之盟，'十目所视不可不畏'而请待至都来迎，终因蹇连不克如约
  - 亲丧与仕进之分：旧传赴举时母殁作诗哀母，然韩愈哀辞称殁时父母俱存，传闻与实录相龃龉
  lesson: 文章可擢第而名垂闽中，然情义亏约则一恸而卒，信誉之诺不可负
  summary_first_person: 我欧阳詹，字行周，泉州晋江人。弱冠能文，贞元八年陆贽知贡举，登进士第三人。除国子四门助教。曾游太原，与乐妓有盟约迎娶，因故失期，妓积望成疾而死，我见其遗诗一恸而卒。闽人登第之盛，自我始著。
  source_urls:
  - https://ctext.org/library.pl?if=gb&res=6423
