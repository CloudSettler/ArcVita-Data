  era: 欧洲浪漫主义时期（清代乾隆—道光年间）
  reign_ref: ''
  archetype: 文豪诗人
  dilemmas:
  - 文学之悲欢是否可以跨越语言，译而求之失其神，撷取其意而出之，孰为上策
  lesson: 以情人心裁铸诗境，虽隔山海语言，其悲凉动人处仍能使异国读者泫然泣下
  summary_first_person: 吾贵推（歌德）者，欧洲文豪也。吾作《威特》（《少年维特之烦恼》），写威特为沙娄歌阿明临海哭女之诗，歌唱至第七章，沙娄大恸不可仰，威特掷诗于地，握手相对而哭，已而复歌，竟不能成声。马君武曾译吾《阿明临海哭女诗》九章为中文，谓苍凉悲壮，使读者泫然泣下，是吾诗之神，虽经重译而犹可感人也。
  source_urls:
  - 《海天诗话》（胡怀琛，民国）
