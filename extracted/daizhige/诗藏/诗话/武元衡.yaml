  archetype: 宰相诗人
  dilemmas:
  - 身为宰相主持讨伐淮西藩镇，遭藩镇仇视，最终遇刺于上朝途中
  - 诗风清丽为时人所重，却被列入张为《诗人主客图》所标六主之列
  lesson: 秉公执政虽以身殉，诗名与气节并传后世
  summary_first_person: 我武元衡，唐代宰相，亦以诗著称。宪宗朝佐主讨伐不臣藩镇，决意不挠，元和十年六月于靖安里遇刺身亡。张为《诗人主客图》以我标为一派之主，与我并峙者白居易、孟云卿、李益、鲍溶、孟郊诸人。
  source_urls:
  - https://zh.wikipedia.org/wiki/武元衡
