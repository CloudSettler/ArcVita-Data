  dilemmas:
  - 忠于清室而谏不见用，戆直罢职
  - 国亡后身 Betw 忠爱与遗民之节，弃家为道士
  lesson: 戆直忠爱，虽罢言职而初心不改，国亡则洁身遗世。
  summary_first_person: 我字杏村，与赵炳麟、沈鹏同在翰林交好。我笃于忠爱，亦痴情儿女——爱京伶孟小如，为谋其终身生计，置袍带、延师教唱须生。后罢言职，谕旨称我戆直，遂赋诗告归。归后不及一年清亡，我弃家为道士，栽花种树以遣世虑。
  source_urls:
  - 柏岩感旧诗话·卷一（赵炳麟）
