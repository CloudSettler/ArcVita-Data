person:
  qid: guji-沈佺期
  name_zh: 沈佺期
  names:
    zh: 沈佺期
    en: Shen Quanqi
  lifespan:
    birth:
      date: 656
      precision: year
      is_circa: true
      raw: 约656年（唐高宗显庆年间）
  birth_date: 656
  death_date: '714'
  era: 唐代（初唐至盛唐之际）
  reign_ref: 武则天、唐中宗、唐睿宗时期
  archetype: 初唐律诗定型者
  dilemmas:
  - 身处武周政治漩涡，依附张易之而遭贬流
  - 在宫体浮靡与雅正诗风之间完成格律转型
  lesson: 文体之成往往成于承弊而 refine 者，声律之精可以传世，而出处之慎决定身后名
  summary_first_person: 我是沈佺期，字云卿，相州内黄人。我为律诗之定型出力最多，与宋之问并称“沈宋”，世谓沈约庾信之后，至我等“回忌声病，约句准篇”，如锦绣成文。我尤长七言，然因附张易之贬驩州，晚年虽复起，名节终有可议。
  source_urls:
  - https://www.zhonghuadiancang.com/
endeavors:
- id: guji-沈佺期-endeavor-1
  name_zh: 与宋之问共定律诗格律
  phases:
  - key: brewing
    name_zh: 早期应制并侍武周宫廷
    labels:
      zh: 宫廷诗人
    start_date: '0675'
    highlight_event_id: guji-沈佺期-event-career-1
  - key: breakthrough
    name_zh: 声律定型
    labels:
      zh: 律诗定型、靡丽精密
    start_date: 0690
    highlight_event_id: guji-沈佺期-event-career-2
  - key: climax
    name_zh: 遭贬与岭外之作
    labels:
      zh: 流放、诗风转向
    start_date: '0705'
    highlight_event_id: guji-沈佺期-event-career-3
  - key: closure
    name_zh: 晚年起复
    labels:
      zh: 起复、修文馆
    start_date: '0707'
    highlight_event_id: guji-沈佺期-event-death
  decisions:
  - date: 0690
    title_zh: 研揣声音，回忌声病，约句准篇
    rationale: 承沈约、庾信音韵婉附之绪，与宋之问将五七言律诗格律定型，使“缘情绮靡之功至是始备”，学者宗之，号为“沈宋”。
  - date: '0705'
    title_zh: 附张易之被贬驩州
    rationale: 神龙政变后因曾依附张易之而流放驩州，虽为政治失路，岭外之作反多真情沉郁。
events:
- id: guji-沈佺期-event-birth
  date: 656
  year_of: 656
  title_zh: 沈佺期出生
  description: 沈佺期约生于唐高宗显庆元年（656），相州内黄人，字云卿。
- id: guji-沈佺期-event-career-1
  date: '0675'
  year_of: 675
  title_zh: 进士及第，入仕宫廷
  description: 上元年间进士及第，由协律郎累迁通事舍人、给事中，以应制诗见称于武周宫廷。
- id: guji-沈佺期-event-career-2
  date: 0690
  year_of: 690
  title_zh: 与宋之问并称“沈宋”，律诗格律定型
  description: 佺期与宋之问“又加靡丽，回忌声病，约句准篇，如锦绣成文，学者宗之，号为沈宋”。胡震亨评：“沈七言律高华胜宋”，且据本传“尤长七言之作”。
- id: guji-沈佺期-event-career-3
  date: 0705-02
  year_of: 705
  title_zh: 神龙政变后长流驩州
  description: 因旧附张易之，被长流驩州（今越南义安一带），道中及岭外所赋诗篇由绮丽转趋沉痛，为贬谪诗之重要篇章。
- id: guji-沈佺期-event-death
  date: '714'
  year_of: 714
  title_zh: 沈佺期去世
  description: 沈佺期约于开元二年（714）卒，官至太子少詹事，世称“沈詹事”。独孤及评其“始裁成六律，彰施五彩，使言之而中伦，歌之而成声”。
