  era: 明嘉靖、万历间
  reign_ref: 明世宗嘉靖 / 明神宗万历
  archetype: 布衣诗人·幕府文士
  lesson: 千余首自删存四百，不以砂砾乱玉——诗人贵有自知之明
  summary_first_person: 我是鄞人沈明臣，字嘉则。少保胡宗宪征倭至闽，宴将士于烂柯山，酒酣命我为凯歌十章，'狭巷短兵相接处，杀人如草不闻声'之句令其起而捋须称快，即命刻于山石。万历间我与王稺登、王叔承以布衣豪于诗，而诗为最。尝渡江求王元美序，自言先后为诗七千余篇，仅存四百，不欲以砂砾乱玉。
