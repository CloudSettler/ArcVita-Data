- id: guji-沈明臣-event-kai-ge
  date: '1560'
  year_of: 1560
  type: endeavor
  endeavor_id: guji-沈明臣-endeavor-1
  title_zh: 烂柯山宴上作凯歌十章，胡宗宪命刻石
  description: 少保胡宗宪行部七闽，宴将士于烂柯山，酒酣乐作，命嘉则为凯歌十章。至"狭巷短兵相接处，杀人如草不闻声"句，少保起身捋须曰"何物沈郎，雄快乃尔"，即命刻于山石。一说所杀者倭寇也
- id: guji-沈明臣-event-cheng-shi
  date: '1590'
  year_of: 1590
  type: endeavor
  endeavor_id: guji-沈明臣-endeavor-2
  title_zh: 渡江见王元美求序，自删千余首存四百
  description: 万历间与吴门王伯谷（稺登）、松陵王承父（叔承）并称布衣诗豪，嘉则诗为最。尝渡江见王元美，持所为诗求序，曰"我先后诗为篇者七千余，今仅四百，不欲以砂砾乱玉也"。有《丰对楼诗》三十四卷，《四库》著目
- id: guji-沈明臣-event-death
  date: '1596'
  year_of: 1596
  type: death
  title_zh: 沈明臣去世
  description: 约卒于万历中，山人布衣而以诗名世
