  reign_ref: 乾隆、嘉庆
  archetype: 学者·诗人·直臣
  dilemmas:
  - 直言极谏与身家安危的冲突：以言获罪遣戍伊犁
  - 诗歌抒写性情与考据经史之学的取舍
  lesson: 立身以忠孝为本，论学以经史为宗，诗以三百篇为源，直道虽遭贬谪而气节不改。
  summary_first_person: 我是洪亮吉，字稚存，号北江。生平著述等身，以诂经舆地之学称于世，诗话手定为人所传。我曾因直言获罪遣戍伊犁，蒙恩赦归，编《荷戈》《赐环》二集。论诗推尊三百篇，于魏晋独取陶靖节，视盛唐李杜为支流。
