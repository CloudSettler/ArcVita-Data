  summary_first_person: 我是洪刍，字驹父，江西临川人，与诸兄并称“四洪”，列名江西诗派。我留心杜诗、韩柳与山谷句法，作《洪驹父诗话》辨析诗本事与文字讹误，虽见讥于后人处亦不自知，然考据之功有裨诗学。
  source_urls:
