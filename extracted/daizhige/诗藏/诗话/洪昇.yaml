  birth_date: '1645'
  death_date: '1704'
  era: 清康熙年间
  reign_ref: 康熙
  archetype: 戏曲家
  dilemmas:
  - 中年遭家难出奔，颠踬四方，功名遂废
  - 《长生殿》遭构难，牵连友人赵执信等罢官，词曲之名与仕途两难
  lesson: 一曲《长生殿》既成其名，亦断其途，遭天伦之变而坎壈终身，终以词曲传，复蹈汨罗之厄
  summary_first_person: 我钱塘洪昉思，早负微名，中年遘家难出奔，所至颠踬。谱《长生殿》乐府，游都下首赏者徐乾学尚书，朝彦醵金演观。不意会国服未阙，嫉者借以构难，骑尉赵秋谷诸名流因兹罢官，我亦坐废。甲申春杪应云间提帅张云翼之聘，观演《长生殿》为娱，曹寅复迎致白门，对校本三昼夜，传为盛事。返棹过乌戍，醉而失足，为汨罗之投，仅以词曲传耳。
  source_urls:
  - 《不下带编》卷一（清·金埴）
