  era: 北宋
  reign_ref: 元丰、元佑年间
  archetype: 江西诗派诗人
  dilemmas:
  - 屡试不利，负盛名而不得志于有司
  - 受知于苏轼、黄庭坚，游于名流之间而终生未显达
  lesson: 才高而运蹇，一句‘满城风雨近重阳’足传千古，则诗名不系于禄位。
  summary_first_person: 我潘大临，字邠老，黄冈人。才性明敏，经史百家无不融贯，尤以诗自负。元丰中寓居齐安，从苏轼得句法，又为黄庭坚所激赏。山谷叹我五言之气如虹贯日，屡嘱诸甥与我游。我虽早负盛名，却屡不得志于考场，寄意翰墨，书法尤工。重阳得句‘满城风雨近重阳’，竟成千古典故。弟潘大观亦以词翰名家。
  source_urls:
  - 江西诗社宗派图录·潘大临条
