person:
  qid: guji-潘德舆
  name_zh: 潘德舆
  names:
    zh: 潘德舆
    en: Pan Deyu
  lifespan:
    birth:
      date: '1785'
      precision: year
      is_circa: true
      raw: 约清乾隆五十年
    death:
      date: '1839'
      precision: year
      is_circa: true
  birth_date: '1785'
  death_date: '1839'
  era: 清
  reign_ref: 道光
  archetype: 诗论家与经学家
  dilemmas:
  - 欲以诗教正人心，而世风竞逐辞采声名，振衰之力与持续百余年的浮靡诗风相抗，成败难测
  - 主张"不以人废言"须限于治世听言，而论诗人若不明辨人品，则诗教沦为才士之逋逃薮
  lesson: 诗以言志为根本，作诗须为己自得、脱弃势利，方能雅正可传。
  summary_first_person: 我潘德舆，清之道光间山阳人，著《养一斋诗话》六卷。论诗必本"诗言志""思无邪"之旨，谓雅俗之分在于为己自得与为人逐利；痛斥斗靡骋妍、浮花浪蕊之习，捐除门户之见，遍评汉魏以来诸家而以三百篇神理意境为归。虽甘受笑骂，欲以一己之力挽回千年诗风之衰。
endeavors:
- id: guji-潘德舆-endeavor-1
  name_zh: 撰著《养一斋诗话》
  labels:
    zh: 诗学批评
  phases:
  - key: brewing
    name_zh: 立志正诗
    labels:
      zh: 立论溯源
    highlight_event_id: guji-潘德舆-event-1
  - key: breakthrough
    name_zh: 建立权衡
    labels:
      zh: 确立宗旨
    highlight_event_id: guji-潘德舆-event-2
  - key: climax
    name_zh: 遍评群家
    labels:
      zh: 评骘古今
    highlight_event_id: guji-潘德舆-event-3
  - key: closure
    name_zh: 成书传世
    labels:
      zh: 汇为定本
  decisions:
  - title_zh: 以"言志""无邪"立权度，评诗不论工拙先辨雅俗
    rationale: 权度立则诗之美恶不得遁；不迁就时俗门户，甘受笑骂而不顾
  - title_zh: 商榷《石洲诗话》偏好苏诗之失
    rationale: 恐其引导后进避难就易，累及诗教中声，故不敢不商榷以质后之君子
  - title_zh: 辨人品与诗品，斥阮籍、陈子昂、王安石为小人
    rationale: 犯天下之大恶者并其诗不得恕，否则才士一门为小人之逋逃薮，诗教害莫大焉
- id: guji-潘德舆-endeavor-2
  name_zh: 力挽千年浮靡诗风
  labels:
    zh: 诗教复兴
  phases:
  - key: brewing
    name_zh: 察病溯源
    labels:
      zh: 究诗学之衰
  - key: breakthrough
    name_zh: 主张学《三百篇》
    labels:
      zh: 追本复古
    highlight_event_id: guji-潘德舆-event-2
  - key: climax
    name_zh: 破除门户
    labels:
      zh: 直攻时弊
    highlight_event_id: guji-潘德舆-event-3
  - key: closure
    name_zh: 以性情学问为归
    labels:
      zh: 期待来学
  decisions:
  - title_zh: 力主学诗当溯《三百篇》之神理意境而非体制音节
    rationale: 不学三百篇则虽赫然成家，终归纤琐摹拟浅尽而已
  - title_zh: 发愤抒词，甘受人之笑骂而不顾
    rationale: 传之愈久则正之愈难，挽回之心愈不可已
