events:
- id: guji-潘阆-event-birth
  date: -0950
  year_of: -950
  label: 生于钱塘
  type: birth
  detail: 潘阆，字逍遥，钱塘人，所居之里即今武学前潘阆巷，巷内三将军庙有阆祠堂。
- id: guji-潘阆-event-poem-praised
  date: -0970
  year_of: -970
  label: 归自富春有佳句
  type: achievement
  detail: 归自富春，有"渔浦风波恶，钱塘灯火微"之句，人多称之；另有"夜凉疑有雨，院静似无僧"为陆放翁所称。
- id: guji-潘阆-event-flee
  date: -0984
  year_of: -984
  label: 秦王坐罪，髤发亡命
  type: flight
  detail: 为秦王记室参军，秦王坐罪被诛，捕阆急，阆自髤其发，易缁衣出南薰门。后太宗意渐解，再入京。
- id: guji-潘阆-event-decline-office
  date: -0990
  year_of: -990
  label: 封还敕命辞四门助教
  type: decision
  detail: 再入京，敕受四门助教，阆以老懒不任朝谒为辞，自封还敕命，时文法犹疏简若此。
- id: guji-潘阆-event-exile
  date: -0995
  year_of: -995
  label: 编置信上，题诗石井
  type: exile
  detail: 论者谓阆终秦党，语多怨望，遂编置信上。道旁勺石井泉，题诗柱上云"皆疑渴杀老 könyu"，犹称记室旧衔，忠于所事。苏黄门见之，以为有前辈气味，不在石曼卿苏子美下。
- id: guji-潘阆-event-shrine
  date: '-1208'
  year_of: -1208
  label: 杭议祀先贤而黜阆
  type: commemoration
  detail: 嘉定间，杭守建先贤祠于西湖，欲祀阆于列，有风不宜者，遂黜阆。事见叶靖逸《四朝闻见录》。
- id: guji-潘阆-event-death
  date: '-1009'
  year_of: -1009
  label: 卒
  type: death
  detail: 卒年不详，约北宋真宗朝间谢世；沈存中《笔谈》载其有诗名，与钱易许洞为友。
