  birth_date: 约950年
  death_date: 约1009年
  era: 北宋初
  reign_ref: 宋太宗、宋真宗时期
  archetype: 狂逸诗人/谪臣
  dilemmas:
  - 忠于故主秦王与避祸全身的抉择
  - 辞官守拙与仕途功名的取舍
  lesson: 忠于所事、不阿时好，虽被谪而诗名不失
  summary_first_person: 我是潘阆，字逍遥，钱塘人。我曾为秦王记室参军，秦王获罪后我剃发为僧逃出京城，后来太宗怒解，再入京受四门助教，我却以老懒不任朝谒为由封还敕命。此后遭人攻讦，被编置信上，途中题诗犹自称记室旧衔，可谓忠于所事。我工唐风，"渔浦风波恶，钱塘灯火微"为人称道，与钱易、许洞等一时名士为友，晚年杭城建先贤祠本欲祀我，却被黜去。
  source_urls:
  - local://guji/传记文本
