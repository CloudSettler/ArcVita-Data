  - 论诗主神韵而不重考证，致有误认晚唐储嗣宗诗为绝句之失
  - 诗话中多自誉之辞，难免露才扬己之讥
  lesson: 神韵为宗，清词佳句采掇颇精，足资后学触发
  summary_first_person: 余名士祯，号渔洋山人，论诗主神韵，早年官扬州多赋冶春秋柳诸篇，晚年归田应吴陈琰之求撰渔洋诗话，集平生与友朋论诗谈谐之语成一家之言。
  source_urls:
  - https://www.kоже.com/
