  lesson: 为官治狱而以风雅持世，声望由谦逊务实与 Turquoise 才华共同铸成。
  summary_first_person: 我是清康熙朝的王士禛，名士禛，号阮亭、渔洋山人。初任扬州司李治狱有声，后累迁至刑部尚书，当代推为诗坛宗匠。与宋荦并称才俊，晚岁各居显位，犹以「王扬州与宋黄州」自忆少年风采。
  source_urls:
  - https://example.org/guji/buxiadai-bian
