  summary_zh: 以良家子身份被选入汉宫为待诏宫女，数年不得见皇帝之面。
  year_of: -38
- id: guji-王嫱-event-2
  date: -33
  date_label_zh: 竟宁元年正月
  type: career_event
  place_zh: 长安
  summary_zh: 匈奴呼韩邪单于入朝，自言愿婿汉氏以自亲。元帝敕以宫女王嫱嫁单于，昭君出塞，遂为汉匈和亲之象征。
  year_of: -33
- id: guji-王嫱-event-3
  date: -33
  date_label_zh: 竟宁元年
  type: career_event
  place_zh: 匈奴王庭
  summary_zh: 至匈奴，号为宁胡阏氏，生一男伊屠智牙师；呼韩邪死后复嫁其二子，又生二女，汉匈边塞数十年无烽火之警。
  year_of: -33
- id: guji-王嫱-event-4
  date: -31
  date_label_zh: 建始二年
  type: life_event
  place_zh: 匈奴王庭
  summary_zh: 呼韩邪单于死，其前妻之子复株累若鞮单于继立，昭君上书求归，成帝敕令从胡俗，遂为复株累阏氏。
  year_of: -31
- id: guji-王嫱-event-death
  date: -15
  date_label_zh: 约汉成帝年间
  type: death
  place_zh: 匈奴王庭（卒年不详，后葬青冢）
  summary_zh: 王嫱卒于漠北，年不详。今传内蒙古呼和浩特有昭君青冢。后世诗词多咏其出塞本事。
  year_of: -15
