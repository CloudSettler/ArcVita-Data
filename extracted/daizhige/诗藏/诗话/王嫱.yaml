  era: 西汉
  reign_ref: 汉元帝竟宁元年（前33年）出塞和亲
  archetype: 和亲才女
  dilemmas:
  - 身处深宫不得见御，远嫁塞外以终余年
  - 入胡从俗，父子相继之俗与中原伦理之冲突
  lesson: 以一弱女子之远行，换汉匈数十年之和平，牺牲小我而成大局。
  summary_first_person: 我名嫱，字昭君，西汉南郡秭归人也。以良家子选入掖庭，数岁不得见御。竟宁元年，匈奴呼韩邪单于来朝求和亲，我自请出塞，帝敕以我嫁之，号宁胡阏氏。自此身留漠北，生一男二女，终老塞外。后世传我于马上怀抱琵琶作怨思之歌，史上遂为诗词中远嫁才女之典型。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
