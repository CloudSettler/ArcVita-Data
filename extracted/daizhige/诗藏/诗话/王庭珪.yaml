  era: 南宋
  reign_ref: 秦桧当政时期
  archetype: 义烈诗人
  dilemmas:
  - 士大夫畏秦桧之罪莫敢与胡铨谈，独庭珪以诗送之，须抉择明哲保身还是坚守道义
  - 因诗遭告讦被窜辰州，年迈远谪仍不改其志
  lesson: 强权之下，一纸送行诗亦可成为气节的见证；正直者虽遭窜逐，终得召还而名垂。
  summary_first_person: 我乃泸溪王庭珪。胡邦衡（忠简公）以言事忤秦桧、谪贬岭外之时，满朝士大夫畏罪不敢与之交谈，独我以诗二首送之，盛赞其“名髙北斗星辰上，身堕南州瘴海间”，并勉之曰“男子要为天下竒”。后为邑人欧阳安永告讦，我因此被流放辰州。直至秦桧死，方得召还。
