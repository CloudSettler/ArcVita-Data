  archetype: 和亲远嫁的巾帼人物
  dilemmas:
  - 远嫁匈奴，离开故国家园，孤身肩负汉匈和好之责
  - 传闻中因不愿行贿画工而见弃后宫，终被遣嫁匈奴
  lesson: 个人命运常系于家国大局，牺牲与担当亦能成就千古之名
  summary_first_person: 我本是汉元帝后宫的良家女子，日后匈奴呼韩邪单于入朝请婚，我被遣嫁出塞。世人传我在马背上以琵琶寄托离乡之思，实则那多是后人想像所赋。此后汉匈和好，我留名青史，千百年来诗家咏叹不绝。
