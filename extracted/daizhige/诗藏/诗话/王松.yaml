person:
  qid: guji-王松
  name_zh: 王松
  names:
    zh: 王松（字友竹）
    en: Wang Song (Youzhu)
  lifespan:
    birth:
      date: '1865'
      precision: year
      is_circa: true
      raw: 其生也，在中国割台之前三十年（自甲午割台上溯三十年）
  birth_date: 约1865年
  death_date: ''
  era: 清末日据初期台湾
  reign_ref: 光绪年间／乙未割台以后
  archetype: 遗民诗人
  dilemmas:
  - 乙未割台之际，携眷内渡泉州遇盗倾家，后再渡回台守节不出仕
  - 力辞职衔，不愿以虚名猎冠服，又被迫受宫原少将委任职事
  lesson: 世变之中，以诗酒山水为托逃，抱道自重而护持桑梓，可称古逸民之风。
  summary_first_person: 我是新竹人王松，字友竹，生于割台前三十年，读书以经世为务而不喜帖括。乙未割台时曾携眷返泉州原籍，中途遇盗倾尽家财；后再东渡回台，抱道自重，日以诗酒自娱，屡辞职衔不仕。曾受宫原少将之义请，往新竹、苗栗各庄安缉地方，不害一命、不取一钱；又与谱弟等游潜园诗社，远近称"三王"。晚岁编所著诗集诗话四种，并识《台阳诗话》于如此江山楼。
  source_urls:
  - 台阳诗话（古文本）
