- id: guji-王珪-event-visit
  date: ''
  year_of: ''
  title: 引房杜过母亲
  description: 王珪微时，一日引房玄龄、杜如晦过其家。母（一说卢氏，杜甫诗则称杜氏）见之，曰：「汝贵无疑。」并剪髻鬟换酒款待诸贤，又观次少年虬髯者，预言诸人成大名皆因此人之手。
- id: guji-王珪-event-wealth
  date: ''
  year_of: ''
  title: 贞观初显贵
  description: 及乎贞观初，王珪践台斗（位列宰辅），其母（夫人）常肩舆上殿称万寿，六宫师其柔顺，法则化妃后，至尊均嫂叔，盛事垂不朽。
