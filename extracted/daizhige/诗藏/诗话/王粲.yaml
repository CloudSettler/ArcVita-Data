  type: endeavor
  person: guji-王粲
  endeavor: guji-王粲-endeavor-2
  description: 年十七随西迁至长安，左中郎将蔡邕见而奇之，闻粲在门，倒屣迎之，曰“此王公孙也，有异才，吾不如也”。
