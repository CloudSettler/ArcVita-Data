    rationale: 刘表既亡，琮暗弱不足守，说服其举荆州附曹，以免百姓罹兵祸，亦为我谋一生路。
  - date: '0208-10-01'
    title_zh: 弃刘归曹，北返效力
    rationale: 客居荆州十五年而无所建树，曹操雄才、能用人，故毅然北归。
