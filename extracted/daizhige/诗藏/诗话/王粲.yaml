  era: 东汉末 / 建安
  reign_ref: 汉献帝
  archetype: 建安文学代表 · 七子之冠冕
  dilemmas:
  - 乱世流寓荆州，怀才不遇，登楼赋诗以寄乡关之思
  - 依刘表而不见用，终择归附曹操，弃旧主而就新朝
  lesson: 才不得用则郁，遇明主则发；文章不朽，可以稍慰生逢乱世之悲。
  summary_first_person: 我王粲，字仲宣，生于汉末乱离之中。少年避难荆州，依刘表十五年而不见重用，登当阳城楼，作《登楼赋》，抒怀乡与不遇之悲。后归曹操，拜丞相掾，赐爵关内侯，魏国初建为侍中。我博闻强识，属文举笔便成，与曹植并称“曹王”，为建安七子之首。建安二十二年，随军征吴，道中病疫而卒，年四十一。
  source_urls:
  - https://zh.wikipedia.org/wiki/王粲
