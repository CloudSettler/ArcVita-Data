  type: endeavor
  person: guji-王粲
  endeavor: guji-王粲-endeavor-1
  description: 滞留荆州怀才不遇，登楼四望，赋曰“虽信美而非吾土兮，曾何足以少留”，千古传诵。
- id: guji-王粲-event-join-cao
