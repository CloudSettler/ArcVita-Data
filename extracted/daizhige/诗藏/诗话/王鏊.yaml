  era: 明代
  reign_ref: 武宗亲征宸濠之役后
  archetype: 致仕阁臣·诗人
  dilemmas:
  - 身居内阁高位，最终选择勇退归乡，体现出处进退之抉择
  - 武宗驻跸江南时蒙宸翰垂顾，既感圣眷又存谦退之心
  lesson: 功成勇退、不恋权位，方得君臣相得与身后清名。
  summary_first_person: 我王鏊，别号守溪，明之中叶以内阁大学士致仕归吴。武宗南征凯旋，亲幸故相杨一清之家，我赋绝句四章以纪殊荣。沈石田病亟，我遣人问疾，其答诗竟成绝笔。世称我文恪公，太平贤相之
    PILOR。
  source_urls:
  - 夷白斋诗话（明·顾元庆）
