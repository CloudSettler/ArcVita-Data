person:
  qid: guji-王闿运
  name_zh: 王闿运
  names:
    zh: 王闿运（王壬秋、湘绮老人）
    en: Wang Kaiyun
  lifespan:
    birth:
      date: '1833'
      precision: year
      is_circa: true
      raw: 道光年间生，甲寅（1914）日记称年已八十有三
    death:
      date: '1916'
      precision: year
      is_circa: true
      raw: 卒于丙辰，年八十余
  birth_date: '1833'
  death_date: '1916'
  era: 晚清至民国初年
  reign_ref: 咸丰、同治、光绪、宣统、民国
  archetype: 晚清文坛怪杰、名士策士型学者
  dilemmas:
  - 才名满天下而屡被敬礼却终身不见用，终身抑塞磊落
  - 晚年应袁世凯罗致任国史馆馆长，与遗老身份及玩世态度互相冲突
  - 以诙诡玩世处世，又须维持名儒的检则与师道体统
  lesson: 盛名之下若才不见用，唯有以文墨与谐趣自处，然立身失慎则毁誉随之
  summary_first_person: 我少年为诸侯上客，曾游肃顺、曾国藩戎幕，虽蒙敬礼终不为所用；一生以诗文著述自遣，主讲尊经、船山诸书院，晚岁乃被罗致入都主持国史馆，旋又辞归，终以书生老矣。
  source_urls:
  - https://zh.wikipedia.org/wiki/王闿运
