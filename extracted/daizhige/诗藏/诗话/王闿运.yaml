events:
- id: guji-王闿运-event-birth
  date: '1833'
  year_of: '1833'
  type: birth
  summary_zh: 王闿运生于道光年间，字壬秋，号湘绮，后以诗文经学名重一时。
- id: guji-王闿运-event-sushun
  date: '1850'
  year_of: '1850'
  type: career
  summary_zh: 湘绮早登贤书、既入都，与高心夔同为尚书肃顺宾客，佐筹军国，踪迹甚密。
- id: guji-王闿运-event-qimen
  date: '1860'
  year_of: '1860'
  type: career
  summary_zh: 曾国藩驻军祁门兵事方亟，湘绮客军中；文正以客礼相全，湘绮据几读书，早储一舟自山溪泛舟而去，曾国藩笑曰"壬秋殆将行矣"。
- id: guji-王闿运-event-zunjing
  date: '1875'
  year_of: '1875'
  type: career
  summary_zh: 光绪初，湘绮依丁文诚于蜀中，延主成都尊经书院，掌教多年，得士如顾印伯等。
- id: guji-王闿运-event-chuanshan
  date: '1890'
  year_of: '1890'
  type: career
  summary_zh: 后归湘主讲衡阳船山书院，有请业者欢然指授，凡所圈点朱粲如印模。
- id: guji-王闿运-event-tianjin
  date: '1889'
  year_of: '1889'
  type: career
  summary_zh: 乙丑一至天津，李文忠优礼之，其意实在讲席，而莲池、问津讲席各有所属，遂不无缺望。
- id: guji-王闿运-event-shiguan
  date: 1914-03
  year_of: '1914'
  type: career
  summary_zh: 民国三年甲寅三月，应袁项城国史馆馆长之招入都，携宠姬周妈朝夕不离左右，甲寅日记所记殊有风趣。
- id: guji-王闿运-event-teachponem
  date: '1914-11-06'
  year_of: '1914'
  type: personal
  summary_zh: 是年十一月雪后作诗示袁四公子（袁克桓），为发蒙学诗之范，局度整齐，恰是老人早年正格。
- id: guji-王闿运-event-cizhi
  date: 1914-12
  year_of: '1914'
  type: career
  summary_zh: 冬月上呈辞国史馆馆长及参政各职，起句云"帷簿不修，妇女干政"，十二日晚搭京汉车返湘；后又作书与袁项城陈请之故，语多趣谑。
- id: guji-王闿运-event-death
  date: '1916'
  year_of: '1916'
  type: death
  summary_zh: 王闿运以名满天下之耆宿名儒，穷老著述，卒归湘，年八十余。
