  dilemmas:
  - 面对赵飞燕姐妹得宠，坚守礼法而不阿谀邀宠
  - 被谗构陷后，宁退居东宫侍奉太后，不失妇德
  lesson: 持正守礼，虽失宠而不失其德，以辞赋自见其志
  summary_first_person: 我是有汉成帝宫中的班婕妤，初以才德见选，成帝曾欲与我同辇，我以古之贤君皆有贤臣在侧、亡国之主方与嬖女同辇为辞辞谢。后赵飞燕姐妹得宠而我失幸，被谗几陷于危，我自请退居长信宫，侍奉太后，作纨扇诗自伤，以德自守而终老于宫中。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
