  name_zh: 盛西楼
  names:
    zh: 盛西楼
    en: Sheng Xilou
  lifespan:
    birth:
      precision: unknown
      is_circa: false
    death:
      date: '1867'
      precision: year
      is_circa: true
      raw: 回匪之乱，死于城下
  death_date: 约1867年（咸丰同治回民起义期间）
  era: 清代晚期
  reign_ref: 咸丰、同治年间
  archetype: 殉难书生
  dilemmas: -乱世坚守孤城，才節俱存而报國无门 - 身为茂才（秀才），立足功名与保全性命之间
  lesson: 乱世之中，文人之气节可存于诗，虽死而风骨不灭。
  summary_first_person: 我盛西楼，云南保山人，以茂才居于乡里。生平清才峻节，好为诗。值回民起乱围城，我死于城下。生平题壁诗如《太保山寺题壁》《首阳山怀古》等，倜傥风慨，后由云龙守永昌时犹见于壁，录入《定庵诗话》以传。
  source_urls:
  - https://zh.wikisource.org/wiki/定庵诗话
