  name_zh: 瞿佑
  names:
    zh: 瞿佑
    en: Qu You
  lifespan:
    birth:
      date: '1347'
      precision: year
      is_circa: true
      raw: 字宗吉，号存斋，明初在世，洪武间已任职教席
    death:
      date: '1433'
      precision: year
      is_circa: true
      raw: 卒年史无明文，约永乐末宣德初
  birth_date: '1347'
  death_date: '1433'
  era: 明
  reign_ref: 洪武—洪熙
  archetype: 文人学者
  dilemmas:
  - 宦途清秩与谪居塞外的逆境
  - 困苦抑郁中以评诗吟咏自遣还是废弃吟事
  lesson: 以诚诵诗，夷险不易其心，穷而后工，老而弥笃
  summary_first_person: 我以明经入仕，历仁和、临安、宜阳三邑庠训导，升国子助教，复任籓府长史，后谪居塞外。困约之中吟咏不废，晚年归休故里，录师友言论与触景吟咏，成《归田诗话》百二十条，析为三卷，以诚得古人作诗之要。
  source_urls:
  - https://zh.wikipedia.org/wiki/瞿佑
