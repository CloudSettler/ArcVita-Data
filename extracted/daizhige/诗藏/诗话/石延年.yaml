person:
  qid: guji-石延年
  name_zh: 石延年
  names:
    zh: 石延年、石曼卿
    en: Shi Yannian
  lifespan:
    birth:
      date: 0994
      precision: year
      is_circa: true
      raw: 约994年（生年史无明文，据通行考证）
    death:
      date: '1041'
      precision: year
      is_circa: true
      raw: 约1041年
  birth_date: 0994
  death_date: '1041'
  era: 北宋
  reign_ref: 宋仁宗时期
  archetype: poet-wit
  dilemmas:
  - 诗才豪放与仕途不显之间的张力
  - 在危难时局中以诙谐警句进言，须兼顾切合时宜与不卑权贵
  lesson: 以诗才与急智立身，虽无高位而声名不减于当世
  summary_first_person: 我石延年，字曼卿，以诗名世。章献太后崩时，群臣挽歌数百，我一句「震出坤柔变，干成太极虚」首出群作，既切时宜，又不卑长乐宫。李长吉「天若有情天亦老」人称奇绝无对，我对以「月如无恨月常圆」，时人以为勍敌。又尝赠诗隐士韩退，有「醉狂玄鹤舞，闲卧白驴号」之句，为人传诵。
  source_urls:
  - https://zh.wikisource.org/wiki/溫公續詩話
