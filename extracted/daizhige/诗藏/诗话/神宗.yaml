  decisions:
  - date: '1078'
    title_zh: 中批步军司遣兵追送韩缜家属
    rationale: 知其赋词留别，体恤臣下闺门之私，使中外士大夫乐尽其力。
  - date: '1082'
    title_zh: 不听时相苏轼不臣之谗
    rationale: 诗人之词不可如此论，彼自咏桧，何预朕事。
- id: guji-zhao-xu-endeavor-2
  name_zh: 亲孝慈圣
  phases:
