    start_date: '1083'
    highlight_event_id: guji-zhao-xu-event-mourn-cisheng
  decisions:
  - date: '1072'
    title_zh: 屡却太后欲自步出之辞
    rationale: 奉慈寿宫尤尽孝道，天性使然。
