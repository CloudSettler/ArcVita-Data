person:
  qid: guji-zhao-xu
  name_zh: 宋神宗（赵顼）
  names:
    zh: 宋神宗（赵顼）
    en: Emperor Shenzong of Song (Zhao Xu)
  lifespan:
    birth:
      date: '1048'
      precision: year
      is_circa: false
      raw: ''
    death:
      date: '1085'
      precision: year
      is_circa: false
  birth_date: '1048'
  death_date: '1085'
  era: 北宋
  reign_ref: 熙宁、元丰（1067—1085 在位）
  archetype: 雄才宽仁、眷礼臣下、笃于孝道的君主
  dilemmas:
  - 欲振国势而与臣下新旧之论相激，苏轼下狱本无意深罪
  - 心怀忧国与性情俭约谦退之间的自持
  lesson: 君主以恩泽待下，虽闺门之私亦体恤，仁厚与英断可以并行。
  summary_first_person: 朕天性俭约，奉慈寿宫尽孝，御辇亲扶太后；待臣下以恩泽，密恤韩缜之家事，亦不惜为其追送爱妾。元丰间苏轼系狱，时相诬其不臣，朕明辨诗人之词，不为所动，薄其罪而止。
  source_urls:
  - https://zh.wikisource.org/wiki/石林诗話
