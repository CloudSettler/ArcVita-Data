  birth_date: 约 0956
  death_date: 约 1016
  era: 北宋初（太宗、真宗朝）
  reign_ref: 宋真宗（章圣）
  archetype: 山林处士·以诗动天子的隐逸谏者
  dilemmas:
  - 隐居守节与累诏征辟之间的进退抉择
  - 拜官后复归山林，仕与隐的两难
  lesson: 一句山中之诗，可息十年之兵；言以时而贵，隐非逃名，乃待时也。
  summary_first_person: 我隐居终南山，不乐仕进。西夏用兵十余年，朝廷厌兵而无名罢师，我山中有诗云"胡雏负思信，圣主耻干戈"。真宗闻之叹美，遣使赍诏召我入朝，授左司谏、直昭文馆。会景德初边臣奏李继迁死，其子德明愿纳款，遂罢兵。我累诏不起，虽拜官仍复归山中，官至工部侍郎而终。
  source_urls:
  - https://zh.wikisource.org/志逸（本诗话引）
