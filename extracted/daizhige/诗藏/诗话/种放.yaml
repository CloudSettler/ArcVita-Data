    rationale: 西夏用兵十年余，民疲于输挽；以山中之诗讽谕，为朝廷罢师张本。
  - date: '1000'
    title_zh: 应真宗诏入朝受官
    rationale: 累诏不起之后遣使赍诏征召，时逢李继迁死、罢兵之际，遂出山拜左司谏。
  - date: 约-1004
    title_zh: 拜官后复归终南山
    rationale: 守隐逸之节，不恋禄位，故至拜官复归，最终官至工部侍郎。
