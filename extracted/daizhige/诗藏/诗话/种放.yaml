  type: endeavor
  title_zh: 山中有诗讽谕罢兵
  description: 西夏李继迁叛，朝廷兴师十余年，西民疲于输挽而有厌兵之意，事固秘密未闻于外。种放山中有诗云："胡雏负思信，圣主耻干戈。"真宗（章圣）闻之叹美，且惬素志。
- id: guji-种放-event-summon
  date: 0999
  year_of: 0999
  type: endeavor
  title_zh: 真宗遣使赍诏召至
  description: 章圣闻诗叹美，即遣使赍诏召种放至京。
- id: guji-种放-event-office
  date: '1000'
  year_of: '1000'
  type: endeavor
