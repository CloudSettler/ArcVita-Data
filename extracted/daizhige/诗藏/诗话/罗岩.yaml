person:
  qid: guji-罗岩
  name_zh: 罗岩
  names:
    zh: 罗岩
    en: Luo Yan
  lifespan:
    birth:
      date: 1668
      precision: approximate
      is_circa: true
      raw: 康熙年间生，卒年七十七，据丁卯元日诗"六十八"逆推约生于康熙初年
    death:
      date: 1745
      precision: approximate
      is_circa: true
      raw: 卒年七十有七，逆推约在乾隆十年前后
  birth_date: 约1668
  death_date: 约1745
  era: 清
  reign_ref: 康熙、雍正、乾隆年间
  archetype: 孝子诗人画家
  dilemmas:
  - 代父受戍，逆宪令抗长吏，以身任狱而置生死于度外
  - 赦归途中恐被人首告，滞留金陵多年而思亲不得归
  lesson: 行其心之所安，忠孝不由时运所能夺
  summary_first_person: 我罗岩，字友山，一字品山，鄞之西成里人。少负豪气，能诗善画。父絅文公被里民冒名牵入截米之狱，我长跪代父就逮，慷慨对簿，五毒参并而意气自如，遂戍沈阳。塞外周览山川，遍交豪杰，雪中拔刀割彘肩而歌猛虎词。久戍思亲，滞金陵学指画竹。赦归时父犹健在，得以孺慕终养。卒年七十七。
  source_urls:
  - https://example.org/guji/xianchenghua
