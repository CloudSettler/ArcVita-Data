person:
  qid: guji-翁同龢
  name_zh: 翁同龢
  names:
    zh: 翁同龢、虞山相国、松禅老人
    en: Weng Tonghe
  lifespan:
    birth:
      date: '1830'
      precision: year
      is_circa: true
      raw: 清道光十年（据通行生卒）'
    death:
      date: '1904'
      precision: year
      is_circa: true
      raw: 卒年据史传补
  birth_date: '1830'
  death_date: '1904'
  era: 晚清
  reign_ref: 光绪
  archetype: 帝师文臣·戊戌被放之诗人
  dilemmas:
  - 引荐康梁变法而遭太后一党忌恨，戊戌被逐
  - 欲行新政又须保全帝门师生之谊
  lesson: 党论方酷之时，闭门空谷，绩《易》言诗，以忍隐守其寸衷
  summary_first_person: 我是翁同龢，世称虞山相国，晚号松禅老人。戊戌被放后归隐瓶庐，为诗益工，然忌者犹众，畏讥避谤，情见乎词。我以帝师之尊遭逐，闲门著《易》、吟咏自遣，唯寸衷尚有鬼神知。
