  date: '1898-01-01'
  year_of: 1898
  principals: guji-翁同龢
  summary: 归隐瓶庐后为诗益工，所著有《瓶庐诗稿》；「此去闭门空谷里，会须绩《易》更言诗」，即指戊戌归隐事。
