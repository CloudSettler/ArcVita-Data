  lesson: 在权力猜忌与文化理想之间，以藏书立言、浮海自全
  summary_first_person: 我是辽太祖长子耶律倍，封东丹人皇王。我让位给弟德光，却遭疑忌徙居东平。我聚书万卷藏于医巫闾山望海堂，通阴阳音律、精医药之术，善画本国人物。最终我携美人载书泛海归唐，被赐姓名李赞华，以海畔刻木题诗明志。
  source_urls:
  - https://example.org/guji/liaoshihua
