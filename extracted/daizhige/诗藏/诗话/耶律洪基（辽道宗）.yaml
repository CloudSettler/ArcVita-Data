      raw: 寿昌七年十二月崩
  birth_date: '1032-09-14'
  death_date: '1101-01-13'
  era: 辽代（道宗朝，1055—1101 在位）
  reign_ref: 清宁、咸雍、大安、寿昌
  archetype: 雅好词翰而失于刚愎的帝王诗人
  dilemmas:
  - 崇尚汉文风雅，欲与宋人论文坛，却疏于察觉乙辛、张孝杰等奸佞之谋
  - 以后诗中暗藏“赵惟一”之名断狱，致懿德皇后蒙冤自尽，晚年虽有追悔而难昭雪
  lesson: 君王之笔可以为风雅增色，也可能因一时涂抹而误人性命
  summary_first_person: 我辽道宗耶律洪基，袭祖宗雅好词翰之业，尝以《君臣同志华夷同风诗》进皇太后，又于群臣宴集时令各赋诗。相臣李俨献《黄菊赋》，我题诗其后以赐；北院枢密副使耶律斡特刺有功，我赐诗褒奖。惜我信任乙辛、张孝杰，于十香词之狱中指认皇后怀古诗暗藏“赵惟一”三字，遂敕其自尽，铸成千古冤案。寿昌七年崩，庙号道宗。
  source_urls:
  - https://zh.wikisource.org/wiki/辽诗话
