  name_zh: 耶律洪基
  names:
    zh: 耶律洪基
    en: Yelü Hongji
  lifespan:
    birth:
      date: '1032-09-14'
      precision: day
      is_circa: true
      raw: 重熙九年前后，史载生于辽兴宗朝
    death:
