- id: guji-耶律隆绪-event-nanjing-exam
  date: '1025'
  year_of: '1025'
  title: 太平五年幸南京试进士赋诗
  description: 驻跸南京，幸内果园宴，求进士得七十二人，命赋诗第其工拙，以张昱等为太子校书郎、韩栾等为崇文馆校书郎。
- id: guji-耶律隆绪-event-praise-zhangjian
  date: '1022'
  year_of: '1022'
  title: 名张俭一代之宝
  description: 圣宗猎云中，节度使献张俭为一代之宝，名符帝梦，宠遇特异，命俭及吕德懋赋诗以美陈昭衮擒虎之功。
- id: guji-耶律隆绪-event-death
  date: '1031'
  year_of: '1031'
  title: 去世
  description: 圣宗崩，在位间文教大盛，为圣、兴、道三宗雅好词翰之首。
