  archetype: 雅好词翰、通音律、好绘画、尤喜吟咏的辽代盛世君主
  dilemmas:
  - 兼崇文教与武功，须以汉文化遗产吸纳番汉臣属
  lesson: 君主亲译汉文经典并以诗赋取士，可化边鄙为风雅之邦。
  summary_first_person: 我是辽圣宗耶律隆绪，幼喜书翰，十岁能诗，长而晓音律、好绘画，尤喜吟咏。我曾亲以契丹大字译白居易《讽谏集》，诏番臣读之；常出题诏宰相以下赋诗进御，一一读之，优者赐金带；又御制曲五百余首，太平年间幸南京试进士赋诗，以文雅陶铸一代。
