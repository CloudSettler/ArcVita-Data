  date: 0997
  year_of: '997'
  title: 统和十五年赐诗嘉奖
  description: 萧挞凛讨平敌烈、阻卜两部，诸番岁贡方物充于内府；上赐诗嘉奖，仍命林牙耶律昭作赋述功。
- id: guji-耶律隆绪-event-poetry-contest
  date: 0990
  year_of: '990'
