  era: 晚唐
  reign_ref: 唐末（懿宗、僖宗年间）
  archetype: 悯农诗人
  dilemmas:
  - 直言民生疾苦则诗风被讥为拙直，曲从时好则失诗史之旨
  lesson: 诗以言志，言近意远，虽朴直而得三百篇之旨
  summary_first_person: 我是聂夷中，河南（一作河东）人，生当唐末。我作诗师法《诗经》，最著名的是"二月卖新丝，五月粜新谷。医得眼前疮，剜却心头肉"。孙光宪称此诗言近意远，合三百篇之旨，后世目为诗史。然时人论诗尚教化，亦有人谓我辈过于拙直。
