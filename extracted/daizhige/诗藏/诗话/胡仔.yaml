  type: event
  date: '1136'
  year_of: '1136'
  summary_zh: 绍兴丙辰，侍亲赴官岭右，道经湘中，闻阮阅《诗总》之名。
- id: guji-胡仔-event-hear-about-shizong
  type: event
  date: '1136'
  year_of: '1136'
  summary_zh: 闻知舒城阮阅昔守郴江编《诗总》颇为详备，行役匆匆未暇借观。
- id: guji-胡仔-event-read-shizong
  type: event
  date: '1150'
  year_of: '1150'
  is_circa: true
  summary_zh: 居苕水，友生洪庆远从宗子彦章处获传《诗总》集，取读之，见其遗漏元祐诸公诗话。
- id: guji-胡仔-event-write-preface
  type: event
  date: '1148'
  year_of: '1148'
  summary_zh: 戊辰春三月上巳，撰《苕溪渔隐丛话》前集自序，阐明以年代先后纂集之旨。绍兴甲寅陈奉议已刊于万卷堂。
- id: guji-胡仔-event-compose-conghua
  type: event
  date: '1148'
  year_of: '1148'
  is_circa: true
  summary_zh: 纂集元祐以来诸公诗话及史传小说事实，附以辨证，成《苕溪渔隐丛话》前集六十卷、後集四十卷。
- id: guji-胡仔-event-retire-huzhou
  type: event
  date: '1150'
  year_of: '1150'
  is_circa: true
  summary_zh: 官至奉议郎知常州晋陵县后，卜居湖州，自号苕溪渔隐。
- id: guji-胡仔-event-death
