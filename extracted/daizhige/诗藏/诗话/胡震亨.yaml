  lesson: 一生搜括唐诗用力最剧，虽刻本不显，而辑存之功不灭
  summary_first_person: 我胡震亨，海盐人，字孝辕，万历丁丑举人，官至定州知州、兵部员外郎。一生搜括唐诗，撰《唐音统籖》十集，其第十集《唐音癸籖》三十三卷论诗体、诗法、乐府、诂笺，采撷唐诗话大备，为后世考唐三百年诗之源流正变所资。
