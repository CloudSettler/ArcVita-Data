  dilemmas:
  - 与梅圣俞齐名而诗风迥异，豪隽与深远难以优劣
  lesson: 笔力豪隽，以超迈横绝为奇，雄伟之句足以称宏丽之制。
  summary_first_person: 我苏子美以诗知名一时，笔力豪隽，与梅圣俞齐名而风格特异。我咏松江新长桥「云头滟滟开金饼，水面沉沉卧彩虹」，时人谓非此句雄伟不能称此桥。
  source_urls:
  - 六一诗话
