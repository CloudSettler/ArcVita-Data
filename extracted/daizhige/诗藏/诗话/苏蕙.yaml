  dilemmas:
  - 夫妻离绝而难以直言
  - 才情须托于织锦以达远人
  lesson: 相思与才华可付于经纬，璇玑回环，情义自明
  summary_first_person: 我名苏蕙，字若兰，前秦女也。夫窦滔被徙流沙，我思之不已，乃织锦为回文璇玑图，纵横反复皆可成诗，凡数百首，寄与夫君，滔感而复好如初。世传璇玑图，遂以我为诗女织锦之宗。
