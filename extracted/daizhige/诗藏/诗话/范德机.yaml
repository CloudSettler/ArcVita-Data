    start_date: '1315'
    highlight_event_id: guji-范德机-event-4
  decisions:
  - date: '1305'
    title_zh: 立六关为诗之要
    rationale: 篇法、句法、字法、气象、家数、音节，一篇诗成必须精研，合此六关方为佳
  - date: '1310'
    title_zh: 广七律篇法为十三格
    rationale: 唐人李淑《诗苑》止有六格，不能尽律诗之变态，故广为十三，檃括无遗，目曰屠龙绝艺
  - date: '1312'
    title_zh: 慎传诗法秘旨
    rationale: 授非其人，适足招议，故当慎之，不可妄授
