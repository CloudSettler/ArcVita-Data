      - 音韵
    start_date: '1313'
    highlight_event_id: guji-范德机-event-7
  decisions:
  - date: '1308'
    title_zh: 评骘诸家得失
    rationale: 诗之造极适中各成一家，词气稍偏则句有精粗强弱不均，举太白、韩杜、陶韦、孟郊、王维、李商隐诸家，一隅三反
  - date: '1313'
    title_zh: 主张诗宜用中原之韵
    rationale: 中原天地之中得气之正，声音散布各方能相入，押韵不可用哑韵
