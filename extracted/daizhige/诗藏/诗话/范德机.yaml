  reign_ref: 元
  archetype: 诗法理论家
  dilemmas:
  - 诗法秘旨当传后世，然授非其人则适足招议，须慎而又慎
  - 古今论著多言病不处方，学者沉痼少有瘳日
  lesson: 作诗必精研篇法、句法、字法、气象、家数、音节六关，深造博学，方成佳构
  summary_first_person: 我范德机汇辑开元、大历以来翰苑诸公论诗秘旨，撰《木天禁语》，以六关论诗，广律诗篇法为十三格，示后学以门径，惟恐其久而泯没，故笔之于楮，与天地间乐育者共之，又戒不可妄授非人。
  source_urls:
  - guji://木天禁语/元/范德机
