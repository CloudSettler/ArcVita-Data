  birth_date: '1007'
  death_date: '1088'
  era: 北宋
  reign_ref: 仁宗—哲宗朝
  archetype: 雅士诗人
  dilemmas:
  - 晚年致仕，去留之间：一朝思乡，径行入蜀，散财亲旧而不恋禄位
  - 为诗不趋夸耀，自言「不学乡人夸驷马，未饶吾祖泛扁舟」
  lesson: 功成身退，还乡散财、遍游山水，将性情寄于诗与远行之中。
  summary_first_person: 我范镇，字景仁，喜为诗。六十三岁那年致仕，一朝思念乡里，径行入蜀。我绕道梓州访故人李才元大临，归至成都，日与乡人乐饮，把钱财散给贫苦的亲旧，又游峨眉、青城，下巫峡、出荆门，往来近一年方还京师。旅途中作诗二百五篇，其中一联「不学乡人夸驷马，未饶吾祖泛扁舟」，正是我的自况。
  source_urls:
  - 温公续诗话
