  archetype: 一字之师的诗人县令
  dilemmas:
  - 上司诗中言“恨太平”，直改恐冒犯，不改恐其招祸
  - 官职虽卑，遇师友文字当以直言尽诚
  lesson: 一字之改可全身保命，诚言胜于谄颂；张咏称其为“一字之师”。
  summary_first_person: 我是北宋萧楚才，任溧阳县令时见知州张咏诗中有“独恨太平无一事”之句，恐其因功高位重而遭奸人构陷，冒昧改“恨”为“幸”。张咏非但不怒，反称我为“一字之师”。
  source_urls:
  - https://zh.wikisource.org/wiki/宋詩話輯佚/陳輔之詩話
