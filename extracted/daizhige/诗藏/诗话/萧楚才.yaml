  title_zh: 召食见诗，改“恨”为“幸”
  description: 知溧阳县时，张乖崖（张咏）作牧召食，见几案绝句“独恨太平无一事，江南闲杀老尚书”，改“恨”字为“幸”字，并说明保全之意，张咏叹称其为一字之师。
