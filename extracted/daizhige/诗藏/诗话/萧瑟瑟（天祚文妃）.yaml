  name_zh: 萧瑟瑟（天祚文妃）
  names:
    zh: 萧瑟瑟
    en: Xiao Sese
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 幼选入宫，生年不详
    death:
      precision: year
      is_circa: false
      raw: '天祚朝为奉先所诬，赐死（约辽末） '
  era: 辽末（天祚帝时期）
  reign_ref: 天祚帝
  archetype: 以诗歌讽谏而遭谗赐死的后宫才女
  dilemmas:
  - 目睹金兵内侵、天祚帝畋游不悛、忠良疏斥，欲以诗文谏君与明哲保身之间两难
  - 作歌讥切权贵，虽得直声，却招致天祚衔恨与萧奉先之诬
  lesson: 直言讥切可存史鉴，然谏而不纳者，身与国俱危。
  summary_first_person: '我小字瑟瑟，幼选入宫，天祚朝册为文妃。我聪慧闲雅，工文善诗，见金兵内侵而帝畋游不悛，遂作歌讽谏，又作《咏史诗》讥切权贵。帝见而衔之，后为萧奉先所诬，赐死。 '
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&res=563207
