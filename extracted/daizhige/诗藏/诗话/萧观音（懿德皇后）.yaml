events:
- id: guji-萧观音-event-birth
  date: '1040-06-23'
  year_of: '1040'
  type: birth
  title_zh: 萧观音生于重熙九年五月五日
  description: 枢密使萧惠之女，小字观音，重熙九年五月五日生。
- id: guji-萧观音-event-hou
  date: 1055-08
  year_of: '1055'
  type: affair
  title_zh: 清宁元年册为皇后
  description: 册立为皇后，出阁升座时风吹白练一段至后褥位，上有「三十六」三字，左右谓天书命可敦领三十六宫，后大喜。
- id: guji-萧观音-event-fuhulin
  date: 1057-08
  year_of: '1057'
  type: literary
  title_zh: 伏虎林应制赋诗
  description: 帝猎秋山，命后赋诗，后应声作「威风万里压南邦」之句，帝大喜，示群臣曰皇后可谓女中才子。
- id: guji-萧观音-event-hehua
  date: 1057-09
  year_of: '1057'
  type: literary
  title_zh: 应制和〈君臣同志华夷同风诗〉
  description: 帝作〈君臣同志华夷同风诗〉，后应制属和，有「虞廷开盛轨」之句。
- id: guji-萧观音-event-jianjian
  date: '1066'
  year_of: '1066'
  type: political
  title_zh: 上疏谏猎秋山
  description: 帝长弓马，所乘号飞电，常驰入深林邃谷，后患之上疏谏猎，帝虽嘉纳，心颇厌远。
- id: guji-萧观音-event-huixinyuan
  date: '1070'
  year_of: '1070'
  type: literary
  title_zh: 作〈回心院〉词
  description: 咸雍之末希得幸御，后作词〈回心院〉被之管弦，以寓望幸之意。
- id: guji-萧观音-event-shixiangci
  date: '1075'
  year_of: '1075'
  type: crisis
  title_zh: 遭〈十香词〉构陷
  description: 耶律乙辛命人作〈十香词〉，使单登诓后手书并令诬伶官赵惟一淫通，密奏诬案，帝大怒命张孝杰与乙辛穷治其狱。
- id: guji-萧观音-event-death
  date: '1075'
  year_of: '1075'
  type: death
  title_zh: 敕令自尽，白练自经
  description: 狱具，帝指〈怀古〉诗问张孝杰，孝杰谓二句中包「赵惟一」三字，帝意遂决，敕后自尽。后乞面可汗一言不许，作〈绝命词〉望帝所而拜，以白练自经，年三十六，正符白练之数，闻者莫不冤之。
- id: guji-萧观音-event-zhishi
  date: '1101'
  year_of: '1101'
  type: honor
  title_zh: 干统初追谥宣懿皇后，合葬庆陵
  description: 史云干统初追谥宣懿皇后，合葬庆陵。
