  birth_date: '1040-06-23'
  death_date: '1075'
  era: 辽代
  reign_ref: 辽道宗清宁、咸雍、大康年间
  archetype: 工诗善乐而遭构陷冤死的辽代懿德皇后
  dilemmas:
  - 谏猎失宠与作〈回心院〉望幸之间的两难
  - 才名遭忌，被耶律乙辛以〈十香词〉构陷
  lesson: 才华与直言在权力猜忌面前可能招致杀身之祸，公道或迟至身后方明
  summary_first_person: 我萧观音，以重熙九年端午生，容仪为诸萧之冠，能歌诗，弹筝琵琶尤称第一。清宁元年册为皇后，尝于伏虎林应制赋诗，帝称女中才子。因屡谏春畋得直而失宠，作〈回心院〉曲寄望幸之情。耶律乙辛借伶官赵惟一之事，以〈十香词〉伪造淫案，我手书〈怀古〉一绝反成罪证。我临死望阙而拜，留〈绝命词〉，终以白练自经，年三十六，正应当日天书「三十六」之谶。后干统初追谥宣懿，合葬庆陵，世皆冤之。
  source_urls:
  - https://zh.wikisource.org/wiki/遼詩話
