      raw: 雍正三年
    death:
      date: 1785
      precision: year
      is_circa: true
  era: 清乾隆时期
  reign_ref: 乾隆
  archetype: 诗人与戏曲家
  dilemmas:
  - 诗学宗尚：学黄山谷而出以坚锐，被讥有粗露之弊；好僻韵、次元韵，多牵强而无味
  - 论诗之偏：论诗於西江阿其所好，稍乖公允；极推北地、信阳，力诋初白、樊榭
  - 唱和之诚：感袁枚访己题壁之殷而作诗推崇，然不存於集中，被指言不由衷、实则轻袁
  lesson: 才大而奇、情深而正、学博而醇，然恃其逸足、往往奔放，须在坚锐与浑涵之间求平衡
  summary_first_person: 我苕生诗宗山谷，兼学韩、苏，才大情深，与袁枚、赵翼并称三家，尤以五七古年诗为极则，兼工词曲，然恃才奔放，粗露之失终不能免。
  source_urls:
  - 三家诗话
