  era: 北宋
  reign_ref: 北宋
  archetype: 棟梁之臣
  dilemmas:
  - 少年得志，宠恩加身，却沉溺酒色而废弛政务，忠孝之责与一时逸乐相冲突
  - 得贾踈罔屏风题诗之谏，是讳疾忌医还是泣谢改过
  lesson: 位高禄厚之时，君宠母恩未报，不当纵酒废务；闻谏能泣谢痛改，方为士人之立身之道
  summary_first_person: 我蔡齐举进士第一，以将作丞通判兖州，携母赴官，年少气锐，日日沉酣酒色以致废务。贾踈罔屡谒不得见，题诗于屏风谏我：「君宠母恩俱未报，酒如为患悔何追。」我见诗亟往泣谢，自是终身不饮酒。
  source_urls:
  - https://zh.wikisource.org/wiki/西清诗話
