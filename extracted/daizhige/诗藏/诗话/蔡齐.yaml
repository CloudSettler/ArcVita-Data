  title_zh: 贾踈罔题诗相谏，泣谢而终身不饮酒
  description: 贤良贾踈罔居郡中，屡谒不得见，因书一绝于屏间：「圣君宠厚龙头选，慈母恩深鹤发垂。君宠母恩俱未报，酒如为患悔何追。」蔡齐见之，亟往泣谢，自是终身不饮酒。
