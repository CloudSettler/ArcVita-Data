person:
  qid: guji-薛令之
  name_zh: 薛令之
  names:
    zh: 薛令之
    en: Xue Lingzhi
  lifespan:
    birth:
      date: ''
      precision: unknown
      is_circa: false
      raw: 不详
    death:
      date: '0756'
      precision: year
      is_circa: true
      raw: 肃宗立时已卒，约卒于唐肃宗即位（756）之前
  birth_date: ''
  death_date: '0756'
  era: 唐代
  reign_ref: 唐中宗神龙、唐玄宗开元、唐肃宗
  archetype: 清廉淡泊的东宫文臣与隐逸诗人
  dilemmas:
  - 东宫官职清冷、积岁不迁， poverty 与去留之间的挣扎
  - 面对玄宗讽喻题诗，选择称病挂冠归隐而不恋栈
  lesson: 「苜蓿长阑干」道尽清贫自守；不贪岁赋、量受而己，身后得赐「廉村」「廉溪」，廉名传世。
  summary_first_person: 我薛令之，神龙二年进士，开元中历左补阙、太子侍讲，久滞东宫，清贫自守，题壁自嘲苜蓿之诗惊动玄宗。我谢病徒步辞归，量受岁赋不苟取；肃宗即位欲以旧恩相召，而我已卒，敕我乡为廉村、水为廉溪。
  source_urls:
  - https://ctext.org/wiki.pl?if=gb&chapter=全闽诗话
