  decisions:
  - date: '0732'
    title_zh: 以诗自悼，谢病辞归
    rationale: 东宫官次清淡、积岁不迁，恰值玄宗题诗讽喻，遂称病挂冠，徒步归乡，不恋禄位。
  - date: '0756'
    title_zh: 量受岁赋有司之资
    rationale: 玄宗闻其贫，命有司供岁赋，令之量受而已，不苟多取，守廉本色。
events:
- id: guji-薛令之-event-study
  type: study
  title_zh: 居灵谷草堂读书，尝闻龙吟之声
  date: '0700'
  year_of: 700
  detail: 在福安县山中灵谷草堂居读，初居山闻龙吟，时人以为异兆。
- id: guji-薛令之-event-birth
  type: birth
  title_zh: 薛令之生
  date: ''
  year_of: ''
  detail: 生卒年均不详，约唐高宗、武则天时人。
- id: guji-薛令之-event-jinshi
  type: achievement
  title_zh: 神龙二年登进士第，后累迁东宫官
  date: '0706'
  year_of: 706
  detail: 唐神龙二年（706）登进士第，为闽地著名进士之始；开元中累补左补阙、太子侍讲、右庶子，与贺知章并侍东宫。
- id: guji-薛令之-event-poem
  type: literature
  title_zh: 题壁「明月上团团」诗自悼清贫，玄宗题诗其旁
  date: '0730'
  year_of: 730
  detail: 以右补阙兼侍读，积岁不迁，官次清淡，题诗壁间「盘中何所有，苜蓿长阑干」自悼；玄宗幸东宫见之，索笔题其旁「若嫌松桂寒，任逐桑榆暖」讽之。
- id: guji-薛令之-event-retire
  type: retirement
  title_zh: 谢病徒步辞官归里
  date: '0732'
  year_of: 732
  detail: 因题诗之事，恐惶谢病归，徒步还乡；玄宗闻其贫，命有司资其岁赋，令之量受而己。
- id: guji-薛令之-event-death
  type: death
  title_zh: 薛令之卒，肃宗敕名廉村、廉溪
  date: '0756'
  year_of: 756
  detail: 肃宗即位，以旧恩下诏征召，而令之已卒；因敕其村曰廉村，水曰廉溪。着《明月先生集》行世。
