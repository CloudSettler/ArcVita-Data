  description: 着女冠服，建吟诗楼于碧鸡坊，偃息其上，诗酒自适，与刘禹锡等犹有酬唱。
  label_zh: 事业
  entity_qid: guji-薛涛
- id: guji-薛涛-event-death
  date: 0832
  year_of: 832
  title_zh: 薛涛卒
  description: 约大和五年前后卒于成都，葬浣花溪畔，有《锦江集》五卷行世（今佚，存诗约九十余首）。
