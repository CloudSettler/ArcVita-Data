  era: 唐代（中唐）
  reign_ref: 唐代宗、唐德宗、唐宪宗、唐文宗诸朝
  archetype: 唐代蜀中乐妓出身的著名女诗人
  dilemmas:
  - 身入乐籍，才名虽盛而地位卑微，终身未得正式婚嫁
  - 韦皋欲奏请授其校书郎之职，格于旧例未行，「女校书」之名反成佳话
  lesson: 身处边地幕府与乐籍之间，犹以诗笔自立，与元稹、白居易等名士唱和，终成中唐第一女诗人
  summary_first_person: 我是薛涛，字洪度，长安人，随父宦游入蜀，居成都。父殁家贫，遂入乐籍。韦皋镇蜀，令我赋诗侑酒，秀句争传，拟奏校书郎虽不果，而「女校书」之名流播。我退居浣花溪，自制小笺深红，人称薛涛笺。与元稹、白居易、刘禹锡诸名士唱酬，暮年着女冠服，隐于碧鸡坊，吟诗终身。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
