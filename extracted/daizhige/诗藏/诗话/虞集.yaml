  endeavor_id: guji-虞集-endeavor-1
  title_zh: 撰《高鲁公神道碑》《宣徽院使贾公神道碑》《武卫新建先圣庙堂碑》诸钜制
  description: 记女真族砦氏之别、禁近之臣世守其事、大都列卫立孔子庙设儒学教授诸典制，足为史家讨索之助。
- id: guji-虞集-event-career-2
  date: '1330'
  year_of: 1330
  type: career
  endeavor_id: guji-虞集-endeavor-1
  title_zh: 累官奎章阁学士，应制册文制诰多出其手
  description: 史称元初大典册皆出虞集之手，道园为一代作家，元初制度因之可观。
- id: guji-虞集-event-career-3
  date: '1341'
  year_of: 1341
  type: career
  endeavor_id: guji-虞集-endeavor-1
  title_zh: 《道园学古录》五十卷成
  description: 首在朝稿二十卷，次应制录六卷，次归田录十八卷，次方外稿六卷，元史杨朵儿只、阿剌罕诸传多取其碑文为蓝本。
- id: guji-虞集-event-career-4
  date: '1300'
  year_of: 1300
  type: career
  endeavor_id: guji-虞集-endeavor-2
  title_zh: 与范椁（德机）论交，屡以诗唱题相赠
  description: 集中如题范德机诗集、舟过清江忆范德机、赋范德机诗后诸篇，称其寒岩古柏两同清。
- id: guji-虞集-event-death
