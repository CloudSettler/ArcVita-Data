  reign_ref: 元初至元/文宗奎章阁时期
  archetype: 文章家、史官、典册撰者
  dilemmas:
  - 身仕元朝而熟于金、元掌故，为遗民故国存文献、修史之责
  - 位处翰林教文要职，须以碑版文字承载一代制度典章
  lesson: 文章典重可为一代言，碑铭掌故足为史家讨索之资
  summary_first_person: 我是虞集，元奎章阁学士。元初大典册多出我手，《道园学古录》五十卷收我朝碑铭、制诰与归田杂著。我曾为史官，熟于金、元掌故，所撰《高鲁公神道碑》《曹南王勋德碑》等为《元史》诸传所取为蓝本。诗则清婉，与范德机交好最深。
  source_urls:
  - guji://道园学古录/艺林著录
