  name_zh: 袁枚
  names:
    zh: 袁枚
    en: Yuan Mei
  lifespans:
    birth:
      date: '1716-03-25'
      precision: year
      is_circa: false
      raw: 1716（康熙五十五年）
    death:
      date: '1798-01-03'
      precision: year
      is_circa: false
      raw: 1797（嘉庆二年十一月）
  birth_date: '1716-03-25'
  death_date: '1798-01-03'
  era: 清代乾隆嘉庆年间
  reign_ref: 乾隆、嘉庆
  archetype: 诗人与文学批评家
  dilemmas:
  - 崇尚性灵而不讲格调，被讥为纤佻、诗近词曲
  - 风流放诞，提倡艳体，被斥为风雅之罪人
  - 与蒋士铨、赵翼并称三家，然彼此论诗唱和之中貌合神离
  lesson: 作诗当运之以庄、措之以雅，抒写性灵而不失法度，方能自成一家。
  summary_first_person: 我袁枚，字子才，号简斋，人称随园先生。我倡导性灵之说，与蒋士铨、赵翼并称乾隆三大家，以巧丽灵动之笔震耀天下，诗学杨诚斋而参以白傅，笔巧而描写得出。我于金陵筑随园，倡诗数十年，吴越间聪明儿女多奉我为宗，虽时人不免讥我纤佻，然古文亦自成一格。
  source_urls:
  - https://zh.wikisource.org/wiki/三家诗话
