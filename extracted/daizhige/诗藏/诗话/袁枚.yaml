  decisions:
  - date: '1749-01-01'
    title_zh: 辞官卜居金陵随园，专力为诗
    rationale: 弃薄宦而就园林之乐，以四十年精力提倡风雅、抒写性灵。
  - date: '1760'
    title_zh: 提倡性灵之说，抗衡格调派
    rationale: 不满沈归愚格调太入于套，故专尚性灵，以救伪体僻体之弊。
- id: guji-袁枚-endeavor-2
  name_zh: 诗话著述与文学批评
  phases:
  - key: brewing
    name_zh: 仿敖器之《诗评》评骘当代诗人
    labels:
      zh: 品评诗坛
    start_date: '1755'
    highlight_event_id: guji-袁枚-event-breakthrough
  - key: climax
    name_zh: 撰《随园诗话》《续诗品》
    labels:
      zh: 著书立说
    start_date: '1770'
    highlight_event_id: guji-袁枚-event-climax
  - key: closure
    name_zh: 论诗绝句与三家之论流传后世
    labels:
      zh: 后世公论
    start_date: '1795'
    highlight_event_id: guji-袁枚-event-closure
  decisions:
  - date: '1770'
    title_zh: 撰《随园诗话》，取清真之作
    rationale: 以清真灵幻为诗之极诣，虽艳词侧体太多，遭议者讥其玷风雅，然《续诗品》极佳，编辑成书以传的诗道。
