events:
- id: guji-裴伦-event-birth
  date: '1788-01-22'
  year_of: 1788
  type: birth
  title_zh: 生于伦敦
  detail: 生数月其母见出，携儿徙居苏格兰阿褒廷城，居此凡十年
- id: guji-裴伦-event-inherit-1798
  date: '1798-01-01'
  year_of: 1798
  type: endeavor
  title_zh: 叔死袭男爵
  detail: 十岁，叔死以遗产与伦，并袭男爵
- id: guji-裴伦-event-poems-1807
  date: '1807-01-01'
  year_of: 1807
  type: endeavor
  title_zh: 印行所著之诗
  detail: 十九岁印行其诗集
- id: guji-裴伦-event-rebuttal-1808
  date: '1808-01-01'
  year_of: 1808
  type: endeavor
  title_zh: 著英之诗人与苏之杂志记者
  detail: 苏格兰伊丁堡杂志评其诗苛求，摆伦大怒，著俳体诗驳之，自此肆力于文学
- id: guji-裴伦-event-grand-tour-1809
  date: '1809-01-01'
  year_of: 1809
  type: endeavor
  title_zh: 始游欧洲大陆
  detail: 由西班牙而东至于希腊，徘徊凭吊希腊半岛
- id: guji-裴伦-event-childe-1812
  date: '1812-01-01'
  year_of: 1812
  type: endeavor
  title_zh: 印行少年赫洛尔第一二卷
  detail: 此为第一名著，诗出举国若狂，摆伦之名大震，英伦人视之如神
- id: guji-裴伦-event-marriage-1815
  date: '1815-01-01'
  year_of: 1815
  type: endeavor
  title_zh: 娶密班氏
  detail: 二十七岁，是年正月娶于密班氏
- id: guji-裴伦-event-divorce-1816
  date: '1816-01-01'
  year_of: 1816
  type: endeavor
  title_zh: 与妻离婚
  detail: 舆论大哗，众口交詈，摆伦不容于社会
- id: guji-裴伦-event-exile-1816
  date: '1816-04-25'
  year_of: 1816
  type: endeavor
  title_zh: 去国离英
  detail: 曰“摆伦乃不适于英国耶？否则英国不适于摆伦耳”，遂去国，后此不复返
- id: guji-裴伦-event-childe-v4-1818
  date: '1818-01-01'
  year_of: 1818
  type: endeavor
  title_zh: 印行少年赫洛尔第四卷
  detail: 三十岁印行
- id: guji-裴伦-event-don-juan-1819
  date: '1819-01-01'
  year_of: 1819
  type: endeavor
  title_zh: 印行唐蒋第一二卷
  detail: 唐蒋为摆伦第一长诗，共十六卷约十八万言，哀希腊歌即在其中
- id: guji-裴伦-event-don-juan-1823
  date: '1823-01-01'
  year_of: 1823
  type: endeavor
  title_zh: 印行唐蒋第六卷至十六卷
  detail: 三十五岁，唐蒋全书竣事
- id: guji-裴伦-event-greece-1823
  date: '1823-07-04'
  year_of: 1823
  type: endeavor
  title_zh: 渡海助希腊独立
  detail: 是年七月四号去意大利，渡海助希腊独立，希人授以一军
- id: guji-裴伦-event-last-poem-1824
  date: '1824-01-22'
  year_of: 1824
  type: endeavor
  title_zh: 病中作生日诗十章
  detail: 此摆伦绝笔诗也
- id: guji-裴伦-event-death
  date: '1824-04-19'
  year_of: 1824
  type: death
  title_zh: 卒于米郎该军中
  detail: 死时犹大呼“勇往无畏”者再，年三十六
