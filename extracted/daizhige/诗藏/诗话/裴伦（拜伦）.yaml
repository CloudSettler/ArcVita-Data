  dilemmas:
  - 个人放浪不羁与英国社会舆论不容之冲突
  - 徒以词笔鼓舞希腊人与亲身投身独立战争之抉择
  lesson: 醉心自由，不以笔墨自足，终以身殉希腊独立之业
  summary_first_person: 我生于伦敦，袭男爵之位，以诗名震英伦，因婚变不容于社会而去国。晚岁渡海助希腊独立，未及战而病卒军中，死时犹大呼“勇往无畏”。
  source_urls:
  - https://zh.wikisource.org/wiki/海天诗话
