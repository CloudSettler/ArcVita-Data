person:
  qid: guji-许穆夫人
  name_zh: 许穆夫人
  names:
    zh: 许穆夫人
    en: Lady Xu Mu
  era: 春秋
  archetype: 爱国女诗人
  dilemmas:
  - 归国唁兄与许国礼法之阻的冲突
  lesson: 闵宗国颠覆，破礼束缚而赋诗言志，为存亡继绝之义
  summary_first_person: 我是许穆夫人，卫国之女而嫁于许。卫亡之后，我闵宗国之覆，伤许国小力微不能相救，欲归唁其兄，然许之礼法不许；义虽不得行，我赋《载驰》以抒其愤忧。
  reign_ref: 卫懿公灭国前后（春秋中期）
  lifespan:
    birth:
      date: 约-690
      precision: year
      is_circa: true
      raw: 春秋中期，约卫懿公之前
    death:
      date: 约-620
      precision: year
      is_circa: true
      raw: 春秋中期，卒年不详
  birth_date: 约-690
  death_date: 约-620
  source_urls:
