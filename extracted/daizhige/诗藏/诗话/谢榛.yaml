person:
  qid: guji-谢榛
  name_zh: 谢榛
  names:
    zh: 谢榛
    en: Xie Zhen
  lifespan:
    birth:
      date: '1495'
      precision: year
      is_circa: true
      raw: 生年不详，约弘治八年
    death:
      date: '1575'
      precision: year
      is_circa: true
  birth_date: '1495'
  death_date: '1575'
  era: 明代
  reign_ref: 嘉靖
  archetype: 布衣诗人
  dilemmas:
  - 以布衣执诗坛牛耳而遭同社名士排挤绝交
  - 寄身藩邸为客与独立诗名之间的依违
  lesson: 布衣以诗立身，虽遭摈弃，其论诗指要实为“七子”先发，交游之道难得而风雅之名不灭
  summary_first_person: 我谢榛，字茂秦，临清人，眇一目，人称“眇君子”。十六岁作乐府商调传唱临德间，后折节读书，以声律鸣于时。嘉靖间挟诗卷游长安，脱卢柟于狱，又以布衣执牛耳倡结诗社于燕市。虽被削名于“七子”“五子”之列，而游道日广，秦晋诸藩争延致之，赵康王宾礼刻集。所著《四溟诗话》，论诗以夺神气、求声调、裒精华三要为旨，今体工力深厚，句响字稳，实开嘉隆七子论诗之先声。
endeavors:
- id: guji-谢榛-endeavor-1
  name_zh: 诗坛结社与游历
  phases:
  - key: brewing
    name_zh: 少年制曲与折节读书
    labels:
      zh: 乐府商调
    start_date: '1510'
  - key: breakthrough
    name_zh: 脱卢柟于狱与燕市结社
    labels:
      zh: 布衣执牛耳
    start_date: '1540'
    highlight_event_id: guji-谢榛-event-2
  - key: climax
    name_zh: 遭绝交削名而游道日广
    labels:
      zh: 秦晋延致
    start_date: '1555'
  - key: closure
    name_zh: 归东海与康王穆王礼遇
    labels:
      zh: 藩邸刻集
    start_date: '1560'
    highlight_event_id: guji-谢榛-event-4
  decisions:
  - date: '1510'
    title_zh: 折节读书，刻意为歌诗
    rationale: 十六岁作乐府商调已传唱临德间，弃侠从学，以声律立身
  - date: '1540'
    title_zh: 挟诗卷游长安，救黎阳卢柟出狱
    rationale: 侠义之风与诗名并著，诸公多其行谊，争与交欢
  - date: '1550'
    title_zh: 与李攀龙论文相责而不避绝交
    rationale: 持论不合，虽遭遗书绝交、削名于七子之列，不改其说
- id: guji-谢榛-endeavor-2
  name_zh: 诗学理论与《四溟诗话》撰述
  phases:
  - key: brewing
    name_zh: 尚论唐诸家，提出三要之说
    labels:
      zh: 夺神气求声调裒精华
    start_date: '1545'
  - key: breakthrough
    name_zh: 撰《诗家直说》四卷
    labels:
      zh: 四溟诗话
    start_date: '1550'
    highlight_event_id: guji-谢榛-event-5
  - key: climax
    name_zh: 赵康王为之刻全集
    labels:
      zh: 藩邸刊刻
    start_date: '1560'
  - key: closure
    name_zh: 身后二百余年胡曾石斋等重刊表彰
    labels:
      zh: 表彰遗稿
    start_date: '1750'
  decisions:
  - date: '1545'
    title_zh: 主张选李杜等十四家最佳者熟读歌咏
    rationale: 结社之初诸家茫无适从，提出夺神气、求声调、裒精华三要，众人皆心师其言
  - date: '1550'
    title_zh: 以布衣为首倡论诗而不依附权贵
    rationale: 坚守韦布本色，虽诸人以绂冕相凌，诗话所论为天人具眼，非诸人可及
