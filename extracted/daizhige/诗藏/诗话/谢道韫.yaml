  archetype: 咏絮才女
  dilemmas:
  - 生逢乱世，才名冠世而身系家族兴衰
  - 会稽城破之际，寡居抚孤与捍卫家门两难
  lesson: 才华不在须眉，风骨可对干戈
  summary_first_person: 我是谢安的侄女、王凝之之妻。一日雪骤，叔父问雪何所似，我以“未若柳絮因风起”一句名动四方。后嫁入王家，虽叹“不意天壤之中乃有王郎”，仍持家守节。孙恩之乱，丈夫与诸子死于会稽之难，我携幼子抽出器械，率家众突围，手刃乱兵，兵败被俘而神色不挠，得全归而寡居会稽，以咏絮之才、临危之节终老。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
