person:
  qid: guji-jiadao
  name_zh: 贾岛
  names:
    zh: 贾岛
    en: Jia Dao
  lifespan:
    birth:
      date: 0779
      precision: year
      is_circa: true
      raw: 约唐代宗大历年间
    death:
      date: 0843
      precision: year
      is_circa: true
      raw: 约会昌年间，终于传舍
  birth_date: 约779
  death_date: 约843
  era: 唐
  reign_ref: 约历德宗至武宗数朝
  archetype: 苦吟诗人
  dilemmas:
  - 为僧守清规与午后出寺吟咏之拘束：洛阳令禁僧午后出寺，叹“不如牛与羊，犹得日暮归”
  - 还俗应举与屡试不第：弃浮图求功名，却久困场屋，以《病蝉》刺公卿，被奏为“十恶”遭逐
  - 怨愤题诗与仕进之路：下第见裴度起池台，题“破却千家作一池”讥之，执政恶其不逊
  lesson: 两句三年得，一吟双泪流；僻涩之格能矫浮艳，然傲骨刺时，终以诗名而困于宦途
  summary_first_person: 我本是范阳浮图子，法名无本，独变格入僻以矫元白之艳。韩愈惜我才，教我为文，劝我还俗应举。然我久不第，吟《病蝉》刺公卿，被奏为“十恶”而遭逐。晚岁方授遂州长江簿，迁普州司仓，至老无子，啖牛肉得疾，终于传舍。
