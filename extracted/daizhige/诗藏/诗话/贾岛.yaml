  date_precision: year
  is_circa: true
  title_zh: 下第题诗讥晋公裴度起池
  summary_zh: 裴度立第兴化里，凿池种竹，岛方下第，怨愤题诗“破却千家作一池，不栽桃李种蔷薇”，皆恶其不逊。
