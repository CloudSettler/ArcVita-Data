person:
  qid: guji-赛金花
  name_zh: 赛金花
  names:
    zh: 傅彩云、赛金花
    en: Sai Jinhua
  lifespan:
    birth:
      date: '1872'
      precision: year
      is_circa: true
      raw: 一说生于中秋，本无确年
    death:
      date: ''
      precision: unknown
      is_circa: false
  birth_date: '1872'
  death_date: ''
  era: 清末民初
  reign_ref: 光绪、宣统、民国
  archetype: 传奇名妓
  dilemmas:
  - 侍郎薨后不安于室，重隶教坊，改号赛金花，身世浮沉
  - 庚子乱中周旋于联军统帅与平民之间，代乞怜而毁誉参半
  lesson: 乱世之中，艳名与命运皆随荣枯而转，因果毁誉存乎伦常之间
  summary_first_person: 我本是苏台歌妓，小字彩云，中秋夜生而得此名。后嫁状元侍郎为宠妾，随行出使德国，艳名哄传海外。侍郎薨，我重入教坊，更名赛金花。庚子兵燹之际，我在京师周旋于联军将领之间，代人乞怜，救免许多涂炭之人。晚年流落泥城桥畔，卖妾教曲，追话故家旧事而已。
  source_urls:
  - 梦苕盦诗话·钱仲联
endeavors:
- id: guji-赛金花-endeavor-1
  name_zh: 随使德国，艳名远播
  phases:
