    title_zh: 重隶教坊，更名赛金花
    rationale: 侍郎薨后不安于室，复归乐籍，以赛金花之号再张艳帜
- id: guji-赛金花-endeavor-2
  name_zh: 庚子周旋与晚年
  phases:
  - key: brewing
    name_zh: 重入都门
    labels:
      zh: 艳帜高标、再入京师
    start_date: ~1899
    highlight_event_id: guji-赛金花-event-4
  - key: climax
    name_zh: 庚子救难
    labels:
      zh: 兵燹之中、代乞怜于将军
    start_date: '1900'
    highlight_event_id: guji-赛金花-event-4
  - key: closure
    name_zh: 刑庭对簿与流落
    labels:
      zh: 虐婢系狱、晚年卖曲
    start_date: '1903'
    highlight_event_id: guji-赛金花-event-5
  decisions:
  - date: '1900'
    title_zh: 向联军统帅代百姓乞怜
    rationale: 乱军扰掠，兰闺淑媛伏如鼠，唯我以旧谊周旋，代乞收敛兵锋
  - date: '1903'
    title_zh: 妒花风雨，遽遭牢狱之冤
    rationale: 婢涎酿祸，铁铸爰书，幸所欢传语而得雪冤
events:
- id: guji-赛金花-event-birth
  type: birth
  date: ~1872
  year_of: 1872
  title_zh: 生于江南，儿生璧月中秋夜
  detail_zh: 诗云“儿生璧月中秋夜，彩云拥出银河界”，故以彩云为小字
  location_zh: 苏州横塘一带
- id: guji-赛金花-event-1
  type: endeavor
  date: ~1885
  year_of: 1885
  title_zh: 苏台歌妓，艳名鹊起
  detail_zh: 天生佳丽住横塘，三五年华尚娇小，春风到处姓名香
  location_zh: 苏州
- id: guji-赛金花-event-2
  type: endeavor
  date: ~1887
  year_of: 1887
  title_zh: 侍郎奉使德意志，宠妾随行
  detail_zh: 君王选使重怀柔，却教小妇相随往；德后与之同照小影，丰姿海外传
  location_zh: 柏林
- id: guji-赛金花-event-3
  type: endeavor
  date: ~1893
  year_of: 1893
  title_zh: 侍郎薨，重隶教坊更名赛金花
  detail_zh: 侍郎薨后不安于室，重隶教坊，乃更名赛金花
  location_zh: 苏州、上海、天津
- id: guji-赛金花-event-4
  type: endeavor
  date: '1900'
  year_of: 1900
  title_zh: 庚子事变中周旋联军，代人乞怜
  detail_zh: 鼙鼓联邦动地来，飞来天外一将军；锁骨菩萨心惨然，每向将军代乞怜
  location_zh: 北京
- id: guji-赛金花-event-5
  type: endeavor
  date: ~1903
  year_of: 1903
  title_zh: 刑庭对簿，后流落津沽、再入都门
  detail_zh: 红颜遽绝鱼姑刃，妒花风雨黯长安；后居傍泥城桥，贸得雏娃教度曲
  location_zh: 北京、申江、津沽
- id: guji-赛金花-event-death
  type: death
  date: ''
  year_of: ''
  title_zh: 卒年不详
  detail_zh: 文献所载诸诗止于其晚年流落，卒年未详
  location_zh: 北京
