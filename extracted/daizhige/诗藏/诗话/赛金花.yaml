    highlight_event_id: guji-赛金花-event-1
  - key: breakout
    name_zh: 彩云随使之行
    labels:
      zh: 出使德国、德后同照小影
    start_date: '1887'
    highlight_event_id: guji-赛金花-event-2
  - key: climax
    name_zh: 海外盛名
    labels:
      zh: 星轺幸事、丰姿海外传
    start_date: '1888'
    highlight_event_id: guji-赛金花-event-2
