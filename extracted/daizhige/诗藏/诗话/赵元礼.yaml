person:
  qid: guji-赵元礼
  name_zh: 赵元礼
  names:
    zh: 赵元礼
    en: Zhao Yuanli
  lifespan:
    birth:
      date: '1868'
      precision: year
      is_circa: true
      raw: 约同治年间出生，文中自述十九岁赴津就婚，民国八年游北海
    death:
      date: ''
      precision: unknown
      is_circa: false
      raw: 卒年不详，民国间尚在世
  birth_date: 约1868年
  death_date: ''
  era: 民国
  reign_ref: 民国八年（1919）游北海；光绪甲午（1894）前已有交游
  archetype: 诗人·诗话作者
  dilemmas:
  - 新旧学之间：师友中如陶仲明力主new学新政，而己以旧诗自守，取舍之际
  - 作诗半生逾千首，毁誉纷然，得失寸心知，自守淡然
  lesson: 读书蓄厚方能出语不浅薄，熟读古人则韵味格律机杼皆得，所谓"读书破万卷，下笔如有神"
  summary_first_person: 我赵元礼，天津人，以诗文自娱，著藏斋诗话。十九岁由平谷赴津就婚郭氏，得句"空水倒涵红蓼花"蒙严范孙奖借；民国八年游北海得"层楼出云表，万叶战秋声"，范孙拟以"赵秋声"之名相许。作诗半生不下千余首，刻诗十一本，毁誉皆淡然置之。
  source_urls:
  - 藏斋诗话·卷上（原文）
