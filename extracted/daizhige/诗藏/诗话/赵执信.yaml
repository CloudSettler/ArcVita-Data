  - 治学严谨与门人妄增附说之间的取舍
  lesson: 师不肯言，则自行排比钩稽，穷究古法而自成一家之学。
  summary_first_person: 我字仲符，号秋谷，晚号饴山老人，益都人，康熙己未进士，官右春坊右赞善。我曾问声调之学于王士祯，其靳不肯言，我乃发唐人诸集，排比钩稽，竟得其法，因著《声调谱》三卷。
