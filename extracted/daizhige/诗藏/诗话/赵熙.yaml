  date: '1922'
  year_of: 1922
  type: activity
  title_zh: 春寒夜酌重拈《左 回三唱》
  description: 旧制重拈有利有弊，其法惟翻空作谑，得“大文左氏惟传马，三品回官也吃猪”等句
