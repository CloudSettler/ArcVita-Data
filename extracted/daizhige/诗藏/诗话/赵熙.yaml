  date: '1913'
  year_of: 1913
  type: activity
  title_zh: 论诗衡人谈星海石遗魂魄
  description: 谓实甫诗有余星渔诗不足，石遗云星海有魂而无魄樊易有魄而无魂
- id: guji-赵熙-event-death
  date: '1948'
  year_of: 1948
