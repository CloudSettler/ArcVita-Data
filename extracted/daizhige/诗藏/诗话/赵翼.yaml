  name_zh: 赵翼
  names:
    zh: 赵翼
    en: Zhao Yi
  lifespan:
    birth:
      date: '1727'
      precision: year
      is_circa: false
      raw: 清雍正年间生
    death:
      date: '1814'
      precision: year
      is_circa: false
      raw: 清嘉庆年间卒
  birth_date: '1727'
  death_date: '1814'
  era: 清代
  reign_ref: 乾隆
  archetype: 诗人与史学家（清代性灵派三家之一）
  dilemmas:
  - 诗歌以议论警辟、才力新奇独开生面，却趁韵凑句、滑稽近俗，失之雅健
  - 才学宏富而好以考据入诗，吊诡搜奇，冗蔓掉书袋
  - 自以诗歌与袁（子才）、蒋（苕生）鼎立，推服与暗较并存
  lesson: 诗须有庄雅之运用，奇巧与醇美兼济，方能自成一家而不落纤俗。
  summary_first_person: 我赵翼以诗称"瓯北"，与袁枚、蒋士铨并称乾隆三家，亦以《廿二史札记》考据见长，宦游南北万里而以奇险入诗。
  source_urls:
  - https://zh.wikisource.org/wiki/三家诗话
