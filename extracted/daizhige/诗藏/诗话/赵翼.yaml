  type: endeavor
  date: '1775'
  year_of: 1775
  name_zh: 宦游采诗
  summary_zh: 宦游南北数千里，极险之境地、极怪之人物皆入诗料，可谓极诗中之伟观。
- id: guji-赵翼-event-poetry-final
