  - 危苦抑郁之怀，悉于诗歌发之
  lesson: 学官勤于教士、诗笔苍老，功名视若尘土而忠孝自持
  summary_first_person: 我赵藩，字樾村，云南剑川人，光绪乙亥登贤书，选授易门县学训导，在任十年勤于教士；后从军积功宦游四川，补永宁道、署理臬司；民国为众议院议员，著《向湖村舍诗初集》，七古沈雄有杜意。
