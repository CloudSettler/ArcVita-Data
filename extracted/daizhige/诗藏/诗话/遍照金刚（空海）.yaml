  reign_ref: 唐德宗贞元年间至宪宗元和年间；日本平安时代初期
  archetype: 入唐求法僧与诗学理论家
  dilemmas:
  - 志笃禅默而不屑文章之事，却因后生求学而着手编纂诗学格式之书
  lesson: 削繁存要，汇诸家诗格于一编，使后学不烦旁搜而得雕龙之道
  summary_first_person: 我俗姓佐伯，日本僧人，遍照金刚，谥弘法大师。贞元二十年入唐求法，元和元年归国后撰《文镜秘府论》，削诸家之重复，配卷轴于六合，以名教为宗、文章为本，为缁素好事之士留一要枢。
