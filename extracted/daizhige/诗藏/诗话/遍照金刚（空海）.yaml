  description: 弘法大师空海生，俗姓佐伯，后为日本金刚峰寺禅念沙门，号遍照金刚。
- id: guji-遍照金刚-event-入唐
  date: 0804-07
  year_of: 804
  type: endeavor
  title: 乘船入唐
  description: 贞元二十年（804）七月随遣唐使渡海至中国求法。
- id: guji-遍照金刚-event-归国
  date: 0806-08
  year_of: 806
  type: endeavor
  title: 归返日本
  description: 元和元年（806）八月离华回日本。
- id: guji-遍照金刚-event-成书
  date: 0806
  year_of: 806
  type: endeavor
  title: 撰成《文镜秘府论》
  description: 归国后作《文镜秘府论》，专论南朝至中唐诗学，分天地东南西北六卷，附《调四声谱》《调声》《八种韵》《四声论》等十五类；所引资料除皎然《诗式》外均佚，有重要参考价值；又简写为《文笔眼心抄》。
- id: guji-遍照金刚-event-death
  date: 0835
  year_of: 835
  type: death
  title: 去世
  description: 弘法大师空海卒，年约六十二，后世谥弘法大师。
