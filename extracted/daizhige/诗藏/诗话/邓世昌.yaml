  year_of: '1894'
  date: '1894'
  date_precision: year
  title_zh: 致远舰沉没，邓世昌殉国
  description: 舰身不一小时已洞穿数十孔，行将沉没，乃开足马力向敌舰猛冲，与日海军主舰同时沉没，世昌挟两爱犬殉焉。
