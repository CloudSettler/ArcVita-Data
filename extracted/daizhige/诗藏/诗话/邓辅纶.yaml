  reign_ref: 道光、咸丰、同治、光绪
  archetype: 湖湘老辈诗人
  dilemmas:
  - 老辈辨体之严与今人浮泛模仿诗体之风的对立
  - 作品为咏怀纪事而作，不趋时名
  lesson: 作诗须明辨体制源流，不得妄称学某体似某诗；诗文当有所指、有所本。
  summary_first_person: 吾乃武冈邓辅纶，号弥之。庚辰岁因事至长沙，与校经堂少年结忘年之交，谈咏无虚夕。中秋之夜，同登天心阁步月，和陶兴寄，示以五古。老辈论诗，辨体最严，自省拙诗仅一句似初唐，深鄙今人动辄自诩学某体之作。
