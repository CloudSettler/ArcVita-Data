  title_zh: 苏戡急功名而昧于去就
  summary: 陈弢庵、张孝谦之尝论及郑孝胥急功名而昧于去就，去就失据已为时人所讥。
- id: guji-郑孝胥-event-puppet
  date: '1932'
  year_of: 1932
  type: endeavor_milestone
  endeavor_id: guji-郑孝胥-endeavor-2
  title_zh: 受庇倭人出仕伪满，章士钊有“后清未必胜宏光”之讥
  summary: 郑孝胥每以建立后清自诩，受庇倭人，于清室为不忠，于民族为不孝；程穆庵闻其死有“终身为虏”之句，严于斧钺。据通说，郑于1932年出任伪满洲国要职。
- id: guji-郑孝胥-event-death
  date: '1938'
  year_of: 1938
  type: death
  title_zh: 郑孝胥卒
  summary: 郑孝胥卒于民国二十七年，老友作《哀郑重九》诗，称“高名一代海藏楼，晚节千秋质九幽”。
