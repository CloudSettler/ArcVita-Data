  reign_ref: 同治、光绪、宣统、民国
  archetype: 诗人·书家·附逆政客
  dilemmas:
  - 才名与晚节：以诗书负重名，而晚节出仕伪满，为清议所斥
  - 自托殷顽与受庇倭人：忠于故国之念与依附日本之势相矛盾
  lesson: 诗虽不朽，人不可废节；以人废言固偏，因言宥人亦当有辨。
  summary_first_person: 我郑孝胥，字苏戡，号海藏，闽县人。早岁读书福州，有“有人起长夜”之句，故号夜起。工诗善书，为光宣间作手，《海藏楼》一集难可泯灭。然我急功名而昧于去就，晚岁出仕伪满，世人讥我于清室为不忠，于民族为不孝。
