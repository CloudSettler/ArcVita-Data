  title_zh: 早岁读书福州，咏“有人起长夜”
  summary: 海藏早岁读书福州，有诗云“山如旗鼓开，舟自南台下。海日生未生，有人起长夜”，“夜起”之号盖以此也。
- id: guji-郑孝胥-event-poetry-canon
  date: '1924'
  year_of: 1924
  type: endeavor_milestone
  endeavor_id: guji-郑孝胥-endeavor-1
  title_zh: 被列入《光宣诗坛点将录》，配天罡星玉麒麟卢俊义
  summary: 汪辟疆《光宣诗坛点将录》以郑孝胥配天罡星玉麒麟卢俊义，赞其“若就诗论诗，自是光宣朝作手，《海藏》一集，难可泯灭”。
