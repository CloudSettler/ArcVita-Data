  name_zh: 郑方坤
  names:
    zh: 郑方坤
    en: Zheng Fangkun
  lifespan:
    birth:
      precision: unknown
      is_circa: false
  era: 清朝（国朝）
  reign_ref: 乾隆
  archetype: 诗话编纂学者
  dilemmas:
  - 增补王士祯残稿时须在“贪多务得”与体例断限之间权衡
  lesson: 采摭繁富可补阙遗，然滥收无断限亦为后世所讥
  summary_first_person: 我郑方坤得王士祯《五代诗话》残稿于历城朱氏，病其未备，遂采摭诸书重为补正，删二百一十六条，增七百八十九条，共成一千二百一十五条，成《五代诗话》十卷。
