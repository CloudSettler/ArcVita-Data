  dilemmas:
  - 与至交左宗棠反目，交谊与官位两难
  - 凭一己筹画大军月饷反遭纠参去位
  lesson: 直言任事者易遭倾轧，交谊因权位之争而绝，唯史笔可自白。
  summary_first_person: ' 我郭嵩焘，别号筠仙，湘阴人，官至侍郎。与我同里且结姻亲的左宗棠（左恪靖），后来督粤时与我同在一城，我以巡抚与之共事，他竟屡加倾轧，终以四摺纠参，迫使我去位。我自湖南任粤抚，每月为大军筹饷三四十万，皆出一心筹画，自认有功无过；而其奏摺多藉筹饷、潮州厘务相责，不容事理。我离粤东假归时作《述怀留别》，有"谁言肺腑戈矛起，惭愧平生取友心"之句，正为恪靖而发。三十年至交，竟以诞诬相逼，区区一官本不足惜，然朋友之谊遂绝，我唯有将始末备载自叙，以俟后世公论。'
  source_urls:
  - 定庵诗话·卷上（由云龙，民国）
