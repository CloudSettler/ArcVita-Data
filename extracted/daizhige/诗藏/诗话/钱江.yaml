person:
  qid: guji-钱江
  name_zh: 钱江
  names:
    zh: 钱江、东平
    en: Qian Jiang
  era: 清末（太平天国时期）
  reign_ref: 太平天国
  archetype: 幕僚策士
  dilemmas:
  - 投诚清廷后旧日功业成禁区，吟咏自况亦须隐晦
  lesson: 书生亦有杀贼胆，运筹须择势而栖
  summary_first_person: 我钱江，字东平，尝作《兴王策》上干洪秀全，太平天国授我大司马之职；后又与王韬上书李秀成，时人并称太平两大文字。世人曾见我《东平诗》一卷，皆投诚之后所作，中有自赠一联"名妓爱才情似海，书生杀贼胆如天"，气概大概如此。
