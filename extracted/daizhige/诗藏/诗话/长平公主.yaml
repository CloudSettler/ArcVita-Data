  summary_zh: 诏求故剑，仍如先前之议，与都尉周世显成婚。
- id: guji-长平公主-event-death
  date: '1646'
  year_of: 1646
  type: death
  name_zh: 长平公主薨逝
  summary_zh: 婚后不久薨，葬于彰义门之赐庄，礼也。
