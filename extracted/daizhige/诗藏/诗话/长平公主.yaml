person:
  qid: guji-长平公主
  name_zh: 长平公主
  names:
    zh: 长平公主
    en: Princess Changping
  lifespan:
    birth:
      date: '1630'
      precision: year
      is_circa: true
      raw: 明思宗女，生年不详，约崇祯年间
    death:
      date: '1646'
      precision: year
      is_circa: false
      raw: 顺治初寻薨
  birth_date: '1630'
  death_date: '1646'
  era: 明末清初
  reign_ref: 崇祯、顺治
  archetype: 亡国公主
  dilemmas:
  - 国破家亡，身负重伤而幸存，去留两难
  - 出仕新朝之恩与故国之思之间的伦理纠葛
  lesson: 甲申之变中剑伤复苏，上书请为尼而不得，终赐婚周世显，青春早逝，映照鼎革之际宗室女性的命运悲剧。
  summary_first_person: 我是明思宗与周皇后之女，甲申之变中父皇挥剑击伤我颊与腕，五日后复苏。顺治二年我上书愿削发为尼，诏不许，复嫁都尉周世显，不久便薨逝了。
