  summary_zh: 李自成入燕京之际，思宗御剑击伤公主颊与腕，越五宵旦而复苏。
- id: guji-长平公主-event-petition
  date: '1645'
  year_of: 1645
  type: endeavor_event
  endeavor_id: guji-长平公主-endeavor-1
  name_zh: 上书顺治帝
  summary_zh: 顺治二年公主上书今皇帝，甚有音旨，愿髡缁空王，庶申罔极。
- id: guji-长平公主-event-marriage
  date: '1645'
