  lesson: 考据精核，实事求是，不因权威而讳言舛误
  summary_first_person: 我是山阳阎百诗，一名学者。我考据精核，自谓前无古人。我虽好为诗而自知不工，却能知诗之指归。王渔洋《唐贤三昧集》初出，我便指出其中多处舛错：如王右丞诗"御亭"讹作"卸亭"，江淮本无卸亭；孟襄阳诗"涔阳"误作"浔阳"，涔阳近湘水而浔阳辽绝；祖咏诗"京水"误作"泾水"，京水正当中牟之西而泾水已入关。我恳切直言，纵然而渔洋翁不甚受言，我仍以实相告。
  source_urls:
  - https://zh.wikisource.org/wiki/談龍錄
