  title_zh: 指摘《唐贤三昧集》地名校勘之误
  desc_zh: 《唐贤三昧集》初出，阎若璩向赵执信指出书中"御亭"讹为"卸"、"涔阳"误作"浔阳"、"京水"误作"泾水"等舛错，赵执信深韪其言，寓书王渔洋；渔洋后于《池北偶谈》中潜加辩解。阎氏又与赵执信申论集中王维"人闲桂花落"诸家曲解当阙疑、储光羲诗"云"字定误、李颀《缓歌行》夸炫权势乖六义之旨等。
