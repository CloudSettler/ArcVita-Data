events:
- id: guji-阮籍-event-birth
  date: 210
  year_of: 210
  type: birth
  title_zh: 阮籍生
  description_zh: 阮籍生于建安年间，字嗣宗，陈留尉氏人，瑀之子。
- id: guji-阮籍-event-write-yonghuai
  date: 250
  year_of: 250
  type: career
  title_zh: 创作《咏怀》之作
  description_zh: 钟嵘《诗品》评：「《咏怀》之作，可以陶性灵，发幽思。言在耳目之内，情寄八荒之表。洋洋乎会于《风》《雅》……厥旨渊放，归趣难求。」源出于《小雅》，无雕虫之功。
- id: guji-阮籍-event-ranked-shangpht
  date: 500
  year_of: 500
  type: recognition
  title_zh: 《诗品》列阮籍于上品
  description_zh: 钟嵘《诗品》卷上列「晋步兵阮籍」，评其诗颇多感慨之词，渊放难求，与陈思、公幹并列上品。
- id: guji-阮籍-event-death
  date: 263
  year_of: 263
  type: death
  title_zh: 阮籍卒
  description_zh: 阮籍卒于魏景元四年，享年约五十四，处魏晋易代之际。
