  name_zh: 阮籍
  names:
    zh: 阮籍
    en: Ruan Ji
  lifespan:
    birth:
      date: 210
      precision: year
      is_circa: true
      raw: 约210年
    death:
      date: 263
      precision: year
      is_circa: true
  birth_date: 210
  death_date: 263
  era: 三国·曹魏
  reign_ref: 魏晋之际
  archetype: 乱世狂士 / 咏怀诗人
  dilemmas:
  - 易代之际身处曹魏与司马氏权斗夹缝，以酣饮佯狂自保而不失其志
  - 内心感慨之词渊放难求，不敢直言其志
  lesson: 在森严时局中，以诗寄托幽思，言在耳目之内而情寄八荒之表
  summary_first_person: 我阮籍，身处魏晋易代之际，位列晋步兵校尉。我作《咏怀》诸篇，源出《小雅》，不事雕虫之功，却能陶性灵、发幽思。世人评我诗洋洋乎会于《风》《雅》，厥旨渊放、归趣难求，连颜延年注解也怯言其志。
  source_urls:
  - https://zh.wikisource.org/wiki/詩品
