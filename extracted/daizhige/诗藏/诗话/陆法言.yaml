  title_zh: 纵观诸家韵书得失
  detail: 时各家韵书如王该韵集、周研声韵、阳休之韵略、李概音韵决疑、杜台韵略、释静洪韵英、刘善经四声指归、夏侯咏四声韵略等，互有异同，皆可资参校
- id: guji-陆法言-event-2
  person: guji-陆法言
  type: endeavor
  date: 约0601
  year_of: '0601'
  title_zh: 撰成切韵五卷
  detail: 韵书肇自陆法言，于是有音同韵异，若东冬锺、虞鱼模、庚耕清青蒸登各部之分，汉魏以前未之有也
- id: guji-陆法言-event-3
  person: guji-陆法言
  type: endeavor
  date: 约0650
  year_of: '0650'
  title_zh: 切韵为后世韵书之祖
  detail: 唐孙氏以为谬略，加刊为唐韵；宋时重修，名曰广韵。切韵、唐韵原本今无传存者，而广韵五卷二百六部之分目具在，是宋承唐、唐承切韵之遗也
- id: guji-陆法言-event-death
