  birth_date: 约0562
  death_date: 约0616
  era: 隋
  reign_ref: 隋文帝、隋炀帝时期
  archetype: 音韵学家
  dilemmas:
  - 欲统一南北语音分歧而各家韵书互有异同、无能为据
  - 前代韵书繁多尽皆湮灭，须综折众家得失定一家之言
  lesson: 分辨音同韵异、厘定分部标准，为后世韵书奠定百代不祧之基。
  summary_first_person: 我是隋人陆法言，鉴于南北语音分歧、诸家韵书讹谬百出，乃酌量古今通塞，定切韵五卷，分立音同韵异之部目，如东冬锺、虞鱼模、庚耕清青蒸登各部，汉魏以前未有也。唐孙增刊为唐韵，宋人重修为广韵，二百六部之分目实皆源于我书，故曰韵书肇自陆法言。
