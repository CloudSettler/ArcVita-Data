  - 鉴水之技近于神，而世人多疑其诈，陆羽以勺扬水辨南零之真伪，诚诈不相欺
  lesson: 术业专精，神鉴出于诚，虽被疑而终以实证自明
  summary_first_person: 我陆处士鸿渐，善茶盖天下。李季卿使军士取扬子江南零水，我以杓扬之而辨其为临岸水，倾至半而验真南零，使者骇服，遂不敢隐其以岸水补舟荡之事。
