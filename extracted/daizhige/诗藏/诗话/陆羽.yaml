  title_zh: 以茶善盖天下，与李季卿相遇于维扬
  detail: 李季卿刺湖州，至维扬，遇陆处士鸿渐，谓陆君善茶盖天下，扬子江南零水又殊绝，二妙千载一遇。
- id: guji-陆羽-event-2
  type: achievement
  date: ''
  year_of: ''
  where: 扬子江
  title_zh: 杓扬江水，辨真南零
  detail: 使者取水至，陆以杓扬水曰江则江矣非南零，似临岸者；既而倾诸盆至半，遽止，又扬之曰自此南零者矣。使者大骇，自陈舟荡半而以岸水增之。
