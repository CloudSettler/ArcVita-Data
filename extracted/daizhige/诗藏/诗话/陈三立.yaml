  lesson: 家国剧变中，以诗存世脉，以名节立身
  summary_first_person: 我为陈右铭中丞之子，光绪丙戌成进士，官吏部主事；戊戌年因父参与新政被革职。此后不复仕进，以诗鸣于世，为同光体之宗匠，世称散原先生，享有“西江一脉此传薪”之誉，民国二十七年卒。
  source_urls:
  - 光宣诗坛点将录（汪国垣）
