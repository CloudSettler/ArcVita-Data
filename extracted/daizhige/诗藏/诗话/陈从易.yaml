  type: career
  year_of: 1005
  date: 1005
  date_precision: year
  description_zh: 当西昆体文风方盛之际，陈从易独以醇儒古学见称，诗多类白乐天。
- id: guji-chen-congyi-event-2
  type: scholarship
  year_of: 1010
  date: 1010
  date_precision: year
  description_zh: 陈从易偶得杜集旧本，《送蔡都尉》诗『身轻一鸟』下脱一字，与数客各用『疾』『落』『起』『下』等字补之，莫能定。
- id: guji-chen-congyi-event-3
  type: scholarship
  year_of: 1012
  date: 1012
  date_precision: year
  description_zh: 其后得一善本，乃是『身轻一鸟过』，陈公叹服，以为虽一字，诸君亦不能到也。
