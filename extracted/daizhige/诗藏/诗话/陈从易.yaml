  birth_date: 0966
  death_date: 1031
  era: 北宋
  reign_ref: 真宗、仁宗朝
  archetype: scholar-poet
  dilemmas:
  - 西昆体盛行、唐贤诗集几废不行，独守醇儒古学，难免孤立于时风
  - 杜集旧本脱误，诸客各以一字补之莫能定，后得善本乃知不及古人
  lesson: 一字之工，虽积学之人亦未易到；为文当守雅正，不逐时风。
  summary_first_person: 我陈从易，当西昆体盛行之际，独以醇儒古学见称，诗多类白乐天。尝得杜集旧本，『身轻一鸟』下脱一字，与数客各补一字莫能定，后见善本作『过』字，乃叹服虽一字诸君亦不能到也。
  source_urls:
  - https://zh.wikisource.org/wiki/六一詩話
