  - date: ~1643
    title_zh: 被武安侯劫置别室
    rationale: 侯武人也，圆圆若有不自得者，无力自主，只得隐忍
  - date: 1644
    title_zh: 乱中随势辗转，终归王宫为次妃
    rationale: 我兵入燕京后，时局既定，为依托庇护终得归宿
events:
- id: guji-陈圆圆-event-birth
  date: ~1623
  title_zh: 生于江南（姑苏歌妓）
  description: 姑苏戾家女子也，色艺擅一时，字畹芬。
  category: birth
- id: guji-陈圆圆-event-tianxiang
  date: ~1640
  title_zh: 吴中声名鹊起
  description: 叶襄《赠姜垓百韵诗》有云：酒垆寻卞赛，花底出圆圆。其名与金陵名妓卞赛并称。
  category: endeavor
  endeavor_id: guji-陈圆圆-endeavor-1
- id: guji-陈圆圆-event-wuanhou
  date: ~1643
  year_of: 崇祯末年
  title_zh: 为戚畹武安侯劫置别室
  description: 武安侯武人也，圆圆虽有艳名，身居别室，若有不自得者。
  category: endeavor
  endeavor_id: guji-陈圆圆-endeavor-2
- id: guji-陈圆圆-event-zongmin
  date: 1644
  year_of: 崇祯十七年
  title_zh: 李自成之乱中被贼帅刘宗敏所掠
  description: 甲申之变，李自成入燕京，圆圆为贼帅刘宗敏所掠，身陷乱军。
  category: endeavor
  endeavor_id: guji-陈圆圆-endeavor-2
- id: guji-陈圆圆-event-wangfei
  date: 1644-06
  year_of: 甲申后
  title_zh: 我兵入燕京，归某王宫中为次妃
  description: 王师入燕京后，圆圆归某王（吴三桂）宫中为次妃，自此随行西南。
  category: endeavor
  endeavor_id: guji-陈圆圆-endeavor-2
- id: guji-陈圆圆-event-death
  date: ~1695
  title_zh: 卒于西南，年约七十
  description: 随吴氏入滇之后，晚景不详，卒年无确考。
  category: death
