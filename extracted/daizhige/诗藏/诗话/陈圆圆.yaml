person:
  qid: guji-陈圆圆
  name_zh: 陈圆圆
  names:
    zh: 陈圆圆
    en: Chen Yuanyuan
  lifespan:
    birth:
      date: ~1623
      precision: year
      is_circa: true
      raw: 明末
    death:
      date: ~1695
      precision: year
      is_circa: true
      raw: 清初
  birth_date: ~1623
  death_date: ~1695
  era: 明末清初
  reign_ref: 崇祯 / 明清鼎革之际
  archetype: 乱世名妓与命运漂泊者
  dilemmas:
  - 身为歌妓，姿容才艺冠绝一时，却身不由己，被权贵豪强辗转劫夺
  - 甲申之乱中被刘宗敏所掠，陷于李自成军与吴三桂家室之间的政治漩涡
  lesson: 乱世之中，个人际遇常系于时局权势之手；色艺虽能名动一时，却难自主命运。
  summary_first_person: 我名陈圆圆，字畹芬，姑苏戾家女也。色艺擅一时，蕙心纨质，澹秀天然。崇祯末，为戚畹武安侯劫置别室；李自成之乱，又被贼帅刘宗敏所掠。及王师入燕京，竟归某王宫中为次妃，飘零终老于西南。
  source_urls:
  - https://zh.wikisource.org/wiki/妇人集
