person:
  qid: guji-chenziang
  name_zh: 陈子昂
  names:
    zh: 陈子昂
    en: Chen Zi'ang
  lifespan:
    birth:
      date: 661
      precision: year
      is_circa: true
      raw: 约唐龙朔年间生
    death:
      date: 702
      precision: year
      is_circa: true
      raw: 约长安二年卒
  birth_date: 661
  death_date: 702
  era: 初唐·武周
  reign_ref: 武则天临朝称制至武周时期
  archetype: 以非常之举自售其才的孤傲文士
  dilemmas:
  - 才华满腹而不为人知：是默默等候赏识，还是以惊世骇俗之举博取声名
  - 入幕建安王府：是屈从武氏权贵之辟，还是借机施展济世之志
  lesson: 声名不至，则自造声势；一掷千金、一摔百金，舍其末而扬其本，方使文章一日溢都。
  summary_first_person: 我蜀人陈子昂，初入京师，碌碌尘土，无人识我。遇有卖胡琴者索价百万，众人传视不辨，我独以千缗买之，邀众人明日集于宣阳里。酒肴既具，我捧琴而叹：此乃贱工之役，岂宜留心！举琴碎之，而以文百轴遍赠会者，一日之内，声华溢都。其后建安王武攸宜辟我为书记，始得展其怀抱。
