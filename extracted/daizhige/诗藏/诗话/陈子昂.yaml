  year_of: 682
  is_circa: true
  endeavor_id: guji-chenziang-endeavor-1
  description: 如期集于宣阳里，酒肴毕具，捧琴语曰：蜀人陈子昂有文百轴，驰走京毂，碌碌尘土，不为人知，此乐贱工之役，岂宜留心？举而碎之，以文轴遍赠会者，一日之内，声华溢都。
