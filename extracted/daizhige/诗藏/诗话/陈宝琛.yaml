  archetype: 清流言官·遗老诗人
  dilemmas:
  - 托命倭人则不忠宗邦；谏而不从，则君臣之义两难
  lesson: 诗人到底能忠爱，虽主上出奔，仍守臣节而痛哭以谏
  summary_first_person: 我弢庵一生出入清议与诗坛，官至太保。溥仪被挟至津门时，我伏地陈七不可，痛哭而返，深知托命倭人必速亡而无以对宗邦。我诗初学黄陈，后喜临川，久更世变，自谓深醇简远，不务奇险而绝非庸音。
