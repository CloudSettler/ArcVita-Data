  reign_ref: ''
  archetype: 苦吟宗派诗人
  dilemmas:
  - 黄陈齐名却自认师法黄庭坚，甘居其后
  - 诗文师从南丰、豫章二家，须在承师与自立之间立足
  lesson: 尊师而有自立之地，地位相近方能真正师法他人
  summary_first_person: 我后山树立甚高，议论从不一字假借于人，然我自言诗师豫章；文师南丰，诗师豫章，二师皆极天下本色，故我的诗文得以高妙一世。
endeavors:
- id: guji-陈师道-endeavor-1
  name_zh: 诗学一脉，自成高格
  phases:
  - key: brewing
    name_zh: 师事豫章
