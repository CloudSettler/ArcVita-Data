  date: '1080'
  year_of: 1080
  label: 师从黄庭坚
  description: 自言其诗师豫章公黄庭坚，入江西诗派门径。
- id: guji-陈师道-event-2
  date: '1090'
  year_of: 1090
  label: 黄陈齐名
  description: 时论以黄、陈齐名，而后山能自承师法豫章，地位去之不远。
