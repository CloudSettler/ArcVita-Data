      - 诗名鹊起
    start_date: '1090'
    highlight_event_id: guji-陈师道-event-2
  decisions:
  - date: '1080'
    title_zh: 自言其诗师豫章公
    rationale: 地位去豫章不远，故能师之；同时秦晁诸人则不能为此言
  - date: '1090'
    title_zh: 文师南丰、诗师豫章，二师并取
    rationale: 二师皆极天下之本色，故诗文高妙一世
- id: guji-陈师道-endeavor-2
  name_zh: 立身持论，不假借一字
  phases:
  - key: brewing
    name_zh: 树立甚高
    labels:
      zh:
      - 议论独立
      - 不轻许人
    start_date: '1080'
    highlight_event_id: guji-陈师道-event-2
  - key: climax
    name_zh: 以诗品评高下
    labels:
      zh:
      - 题太白画像
      - 评骘人物
    start_date: '1095'
