  era: 近代（民国）
  archetype: 诗化学者
  dilemmas:
  - 家国危难之际，欢乐诗作中每含危苦之词，以诗讽刺时政
  - 治朴学于桂省破荒，而何以为官与守学之间取舍
  lesson: 为文当绝不规仿古人，纵笔所至，语必惊人；读书犹兵，不可一日不备
  summary_first_person: 我陈柱，字柱尊，广西北流人，枕胙经子，著书等身，有《待焚诗稿》数千首，绝不规仿古人。近作多感愤时事，谲词讽谕，语言妙天下；尝主讲无锡国学院，豪饮无日不酒而未见其醉。
