  archetype: 贤母诗人
  dilemmas:
  - 郭氏三丧未葬，家贫无力营葬，梦中得穴与买婢还仆之间的仁义抉择
  - 寡居抚孤，束身自修，督子成名
  lesson: 工诗之外更以德行见重，静则生慧，身教可传家
  summary_first_person: 我自号左芬侍史，工诗有中晚唐风味，著有《兰居吟草》并手书《书禅》梓行。三丧未葬时梦中得穴，买婢闻冤立还其女毁约弗索值，人以为奇。我束修其身，诲人以善，督子复斋成名，二女一烈一节，孙以孝著，世称贤母。
  source_urls:
  - docs/古文传记·闺秀诗人录
