  lesson: 不以人废言，说诗之道贵在通达广大
  summary_first_person: 我是陈衍，字叔伊，号石遗，侯官人。早年治经，中年后以说诗为业，俨然广大教主。我编有《近代诗钞》，著《石遗室诗话》，为同光体张目，晚年总裁福建通志。
