  dilemmas:
  - 知旧学问旧政治不足以图存，欲倡新学新政却为众人视为狂怪
  - 忧时济世之志与穷居消磨壮志的落寞
  lesson: 心精力果，博学多能，凡真知时势者虽遭讥议亦当坚守职志
  summary_first_person: 吾名仲明，喆甡其名，津门孝廉也。心精力果，博学多能，经籍史乘、金石训诂、医方算术、海外国书无不涉猎。甲午以后，知中国旧学旧政不足以图存，遂剀切呼号国人，力求新学新政为职志，时人几以狂怪目之。曾教授于严范孙先生家多年，与之忘形宾主，如异姓兄弟。庚子乱后，憔悴忧伤，竟死牖下，友朋多以诗文挽之。
  source_urls:
  - https://zh.wikisource.org/wiki/藏斋诗话
