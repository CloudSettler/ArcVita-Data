  birth_date: 约公元737年
  death_date: 约公元791年
  era: 唐
  reign_ref: 开元—大历—贞元年间
  archetype: 山水田园诗人·位卑名著的地方刺史
  dilemmas:
  - 位卑而名著：官阶止于刺史、郎中，诗名却冠绝当世
  - 出处之间：郡斋燕集自惭居处崇，未睹斯民康，居官而怀民瘼
  lesson: 宦途不必通显，清诗自可千秋；官称止于左司，而文章足以替之
  summary_first_person: 我是韦应物，世称韦苏州。开元以后，居官位卑而名声显著者，我是其中之一。我的仕宦本末，似乎止于苏州刺史；白乐天答刘梦得诗云“敢有文章替左司”，说的便是我，官称也止于左司郎中。郡斋雨中，我与诸文士燕集，自惭居处崇而未睹斯民康；忆全椒山中道士，欲持一瓢酒，远寄风雨夕。诗传于世，足矣。
