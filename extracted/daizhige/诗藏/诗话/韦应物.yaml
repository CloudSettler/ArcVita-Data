  endeavor_id: guji-韦应物-endeavor-2
  date: 0784
  year_of: 784
  is_circa: true
  title_zh: 作《寄全椒山中道士》
  description: “今朝郡斋冷，忽忆山中客……落叶遍空山，何处寻行迹？”又“欲持一瓢酒，远寄风雨夕”“山深松子落，幽人应未眠”诸句，张为取作《主客图》。
