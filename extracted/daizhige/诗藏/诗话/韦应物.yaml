  title_zh: 郡斋雨中与诸文士燕集
  description: 在苏州任上作《郡斋雨中与诸文士燕集》，有“兵卫森画戟，燕寝凝清香”“自惭居处崇，未睹斯民康”“吴中盛文史，群彦今汪洋”之句。
- id: guji-韦应物-event-endeavor-2-1
