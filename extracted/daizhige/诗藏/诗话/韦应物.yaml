  description: “俯饮一杯酒，仰聆金玉章”“方知大藩地，岂曰财赋强”，见其居官而怀民瘼之志。
- id: guji-韦应物-event-endeavor-2-3
  type: literary
  endeavor_id: guji-韦应物-endeavor-2
  date: 0784
  year_of: 784
  is_circa: true
