  dilemmas:
  - 译西诗如何不失其神——直译失神，须撷其意、锻炼而出之，使合于吾诗格律
  - 欧西诗境与中土诗学传统之间的取舍融合
  lesson: 文学可译不可译，端在能文者善于翦裁锻炼；取其意以吾词出之，斯为杰构。
  summary_first_person: 我马君武以译西诗著称于世，所译《新文学》为世所称道。我译德国贵推《阿明临海哭女诗》九章，苍凉悲壮，使读者泫然泣下；又译裴伦《哀希腊》，与梁任公、苏曼殊诸本各异其趣。
  source_urls:
  - https://zh.wikisource.org/wiki/海天诗话
