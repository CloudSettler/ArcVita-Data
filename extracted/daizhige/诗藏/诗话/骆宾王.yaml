  dilemmas:
  - 才高位下，仕途偃蹇
  - 忠唐与起兵讨武之间的忠义抉择
  lesson: 文可檄天下，命难酬社稷；一檄传奇，千古留声
  summary_first_person: 我乃婺州义乌骆宾王，七岁咏鹅而名动乡里，位列初唐四杰。然仕途多舛，因事下狱，后随徐敬业起兵讨武，一檄《讨武曌》，连武后亦叹其才。兵败之后，不知所终。
  source_urls:
  - https://zh.wikisource.org/wiki/唐詩紀事/卷第七
