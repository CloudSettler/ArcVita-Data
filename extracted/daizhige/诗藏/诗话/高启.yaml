  dilemmas:
  - 出仕新朝与安身避祸之间的挣扎
  - 一篇文记无意卷入郡守案件而罹腰斩极刑
  lesson: 文采冠世亦难逃政治 texts 牵连——言语文字之祸往往系于无心的笔墨。
  summary_first_person: 我是吴人高启，字季迪。元末我往来越中避乱，高皇帝即位后召我任翰林国史编修，后迁户部侍郎。因自称少年不习钱谷之学，蒙上宽慰赐金而罢归。不料郡守魏观营斋阁，我为其作记，事发连及于我，与魏观一并被逮，遭腰斩，年三十九。我身后诗文集仍传于世。
