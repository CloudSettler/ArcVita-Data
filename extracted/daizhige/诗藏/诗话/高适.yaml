    title_zh: 举有道科，授封丘尉
    rationale: 年近五十始释褐，虽官微而步入仕途，为后日军幕之阶。
  - date: '756'
    title_zh: 建言玄宗诸王分镇之策
    rationale: 潼关败后上疏论形势，力陈分镇之弊，拜谏议大夫，遂获肃宗信任。
events:
- id: guji-gaoshi-event-birth
  type: 出生
  date: '704'
  year_of: 704
  description: 高适生于约704年，渤海蓨人。
- id: guji-gaoshi-event-you-liangsong
  type: 事业事件
  date: '730'
  year_of: 730
  description: 早岁家贫，客游梁宋间，以耕钓自给，与李白、杜甫同游梁园。
- id: guji-gaoshi-event-beisai
  type: 事业事件
  date: '738'
  year_of: 738
  description: 北游燕赵，亲历边塞，作〈燕歌行〉、〈塞上〉等，奠定边塞诗宗匠地位。
- id: guji-gaoshi-event-shizhao
  type: 事业事件
  date: '749'
  year_of: 749
  description: 经宋州刺史张九皋荐举，举有道科，授封丘县尉。
- id: guji-gaoshi-event-reshi
  type: 事业事件
  date: '754'
  year_of: 754
  description: 入河西节度使哥舒翰幕为掌书记，安史乱起，佐翰守潼关。
- id: guji-gaoshi-event-jiedushi
  type: 事业事件
  date: '756'
  year_of: 756
  description: 玄宗奔蜀，间道追及河池，上《陈潼关败亡形势疏》；肃宗奇之，擢谏议大夫，寻授淮南节度使，讨永王璘。
- id: guji-gaoshi-event-goryu
  type: 事业事件
  date: '752'
  year_of: 752
  description: 与岑参、王昌龄等以边塞诗名世，与岑参并称“高岑”。
- id: guji-gaoshi-event-jiedushi-wannian
  type: 事业事件
  date: '763'
  year_of: 763
  description: 出为剑南西川节度使，后还朝为刑部侍郎，转散骑常侍，封渤海县侯，永泰元年卒，谥忠。
