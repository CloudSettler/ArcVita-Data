person:
  qid: guji-gaoshi
  name_zh: 高适
  names:
    zh: 高适
    en: Gao Shi
  lifespan:
    birth:
      date: '704'
      precision: year
      is_circa: true
      raw: 约704年
    death:
      date: '765'
      precision: year
      is_circa: false
  birth_date: 约704年
  death_date: 765年
  era: 盛唐
  reign_ref: 唐玄宗、唐肃宗、唐代宗
  archetype: 边塞诗人·诗人节帅
  dilemmas:
  - 早年潦倒不遇，中年方入仕，诗名与官运两途的取舍
  - 由布衣诗人转为镇守一方的节度使，文臣而临军政实务
  lesson: 大器晚成——五十岁前仕途蹭蹬而不废诗笔，终以阅历与志节兼得诗名功业。
  summary_first_person: 我高适字达夫，早年贫贱漫游梁宋，以边塞诗与岑参齐名，世称“高岑”。后投笔从戎，佐哥舒翰守潼关，、淮南、剑南节度使，封渤海县侯，是有唐诗人中位至节镇者。
  source_urls:
  - source: 全唐诗话续编（清·孙涛）卷下目录
