    start_date: '1244'
    highlight_event_id: guji-魏庆之-event-book-done
  decisions:
  - date: '1235'
    title_zh: 别为是编，科别其条
    rationale: 旧编诗话贪多务得、不泛则冗，故出新意，自诗话以来至于近世评论，博观约取，分门别类，庶有益于诗
  - date: '1244'
    title_zh: 尽择其精，附诸名胜品题
    rationale: 后取三百篇、骚、选而下及宋朝诸公之诗，凡名胜品题之有补于诗道者，择其精而录之
