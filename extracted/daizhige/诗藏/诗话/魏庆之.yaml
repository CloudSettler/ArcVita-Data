  dilemmas:
  - 有才而不屑科第，选择隐居种菊、以吟咏自适，放弃仕进之路
  - 面对浩繁诗话，如何在贪多务得与有益于诗之间取舍编次
  lesson: 博观约取、科别其条，方能于浩瀚诗评中提炼有益诗道之精义
  summary_first_person: 我名魏庆之，字醇甫，别号菊庄。有才而不屑科第，惟种菊千丛，日与骚人逸士觞咏其间。我以医方喻诗评，博观约取，编《诗人玉屑》以是有益于诗道，得游受斋、黄升诸公嘉赏。
  source_urls:
  - guji://shirenyuxie/xu
