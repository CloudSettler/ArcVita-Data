- id: guji-魏野-event-poems
  type: endeavor
  date: ''
  year_of: ''
  description: 贻诗宰相王旦曰"如今好逐赤松游"；上寇准诗云"好去上天辞将相，却来平地作神仙"，具诗人规戒之风。
- id: guji-魏野-event-death
