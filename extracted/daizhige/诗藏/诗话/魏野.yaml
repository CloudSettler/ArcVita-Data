  dilemmas:
  - 征召与隐逸：真宗遣使相招，野闭户逾垣而遁，坚守隐居之志而不赴仕途
  - 诗名与贫寒："烧叶"之句遭编集者嫌贫寒而改字，野人之趣与世俗眼光相冲突
  lesson: 诗贵本色真趣，求益反损；高士以节操自守，虽天子不可夺其志。
  summary_first_person: 我魏野，字仲先，陕州人，终生不仕。少时题诗寺柱，得江南文士赏识延誉，始为人重。我诗效白乐天体，有"数声离岸橹，几点别州山"之句。真宗西祀闻我名，遣中使相招，我逾垣而遁；又尝贻诗王旦、寇准，劝其功成身退。逝后蒙赠著作郎，诏子孙免科役。
  source_urls:
  - 温公续诗话（宋·司马光）
