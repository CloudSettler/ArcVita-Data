  dilemmas:
  - 身为女子而负诗才，欲以文学立身而仕途无门
  - 出身寒微、沦为妾侍后被弃，只得入道观栖身
  lesson: 才情不因性别而减色，然乱世之中女子持才自守犹属不易
  summary_first_person: 我是晚唐女诗人鱼玄机，名列《诗女史纂》卷之九，与李冶等并称诗女。我幼有诗才，及笄后为补阙李亿妾，后被弃，遂入咸宜观为女道士。我以诗名动士林，与温庭筠等文人唱和，留下「易求无价宝，难得有心郎」之句，惜身世坎坷，结局悲凉。
  source_urls:
  - http://www.cadal.zju.edu.cn/Index.action
