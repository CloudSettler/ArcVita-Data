  birth_date: 约770
  death_date: ''
  era: 唐
  reign_ref: 德宗前后
  archetype: 义商隐士
  dilemmas:
  - 舍财救人与令父丧利之间的孝义冲突
  - 折节读书与拒仕遁名之间的出处抉择
  lesson: 义在损己，名遂即逃——救人不为报，闻召而愈遁
  summary_first_person: 我十三岁随父客居杭州，值王伾覆舟罗刹江，以百金募渔者救之。父归大异，我恐以父之蓄易己名，遂去为人仆赁。主人义我而阴倍其偿，乃得为小贾，所息愈于父业。蓄藏既致，半奉亲甘毳，半振贫友昆弟，遂折节读左氏春秋。客劝仕而不答，悔见知于人，变名焚素，耕于方山。后王伾为散骑常侍遣使见召，我佯诺而夕遁矣。
  source_urls:
  - 稗史彚编
