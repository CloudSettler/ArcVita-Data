    title_zh: 以杜甫句法为诗学标准
    rationale: 后山、师川、子勉诸人皆得法于我，诗派由此立本。
  - date: '1103'
    title_zh: 赴宜州贬所而不废吟咏
    rationale: 忧斯文将坠，虽厄穷不失诗人本色。
