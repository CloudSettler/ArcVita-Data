  archetype: 诗派宗祖
  dilemmas:
  - 身处党争漩涡屡遭贬谪，仍坚守诗学与人格操守
  - 被尊为江西诗派之祖，却不以立派自居
  lesson: 诗有本源，句法可传；荣辱不惊，磨砺自成。
  summary_first_person: 我黄庭坚，号山谷道人，为江西诗派之宗祖。吕本中作《宗派图》，推我为祖，列二十五人皆嗣我法者。我诗法老杜，点铁成金、夺胎换骨，与苏轼并称苏黄。晚贬宜州，卒于贬所，而诗法泽被后世。
