      precision: year
      is_circa: true
      raw: 乾道四年（1168）陈俊卿作序后数年卒，约乾道八九年
  birth_date: ''
  death_date: '1172'
  era: 南宋
  reign_ref: 乾道
  archetype: 挂冠著述的诗论家
  dilemmas:
  - 拙直忤权势与仕途进取之间的取舍：宁弃官归隐，不肯浮沈上下
  - 悲愤孤愤之发与“何所怨哉”的自解：以诗话折衷前人之语而消解不平
  lesson: 诗当含风雅而中律度，有补于时、有辅于名教；处世则介洁嫉恶，不为五斗折腰。
  summary_first_person: 我字常明，游宦湖外十余年，以拙直忤权势，投印南归，寓居兴化之溪，闭门却扫五年。平居以文章自娱，论古人诗之当否，疏用事之隐晦者，成《溪诗话》十卷。吾论诗主风雅律度，尤敬杜子美句法森严而未尝一日忘朝廷。
  source_urls:
  - https://zh.wikisource.org/wiki/巩溪诗话
