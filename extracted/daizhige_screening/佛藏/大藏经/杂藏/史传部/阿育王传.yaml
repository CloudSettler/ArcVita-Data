category: 佛藏/大藏经/杂藏/史传部
verdict: has_candidates
candidates:
- name_zh: 阿育王
  score: 9
  worth_why: 幼年施土发愿、以不刃之兵平叛、从暴虐恶王到八万四千塔分舍利兴佛，弃恶归善的完整塑造周期，名场面极多
  era: 印度孔雀王朝
  dates_known: true
- name_zh: 耆梨
  score: 7
  worth_why: 恶人治狱ioreca营造爱乐狱，逼比丘七日证阿罗汉果，为恶者的反面教训典型
  era: 印度孔雀王朝
  dates_known: false
- name_zh: 罗提掘多
  score: 6
  worth_why: 拥立阿育王的第一辅相，设火坑机关除苏深摩，谋略完整但事迹散于王传
  era: 印度孔雀王朝
  dates_known: false
- name_zh: 尽忧
  score: 5
  worth_why: 前篇所记出家得罗汉之弟，但本卷尚无可考做事流
  era: 印度孔雀王朝
  dates_known: false
rejections:
- name_zh: 频头莎罗王
  why_not: 仅作王统与家庭线坐标，无独立做事周期
- name_zh: 苏深摩
  why_not: 失位败亡的配角，事迹皆依附阿育王叙事
- name_zh: 德胜童子
  why_not: 施土缘起中的象征性人物，无实际做事流
