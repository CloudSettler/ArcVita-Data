category: 佛藏/续藏经/中国撰述/史传部/杂传
verdict: has_candidates
candidates:
- name_zh: 冯铨
  score: 4
  worth_why: 卖女负心事与暴毙报应故事完整，但仅为一则因果轶事，无完整事业周期；且与历史上大臣冯铨事迹不符，恐为同名
  era: 明末
  dates_known: false
- name_zh: 金赤城（智旭母舅）
  score: 4
  worth_why: 有入觐、守赣州、升兖东兵道仕历，兼一段冥中劝回头而终因宦情未醒的教训，稍具做事与悔悟线
  era: 明末
  dates_known: false
- name_zh: 王万祚
  score: 3
  worth_why: 居官清廉而性严急，捶楚伤命，冤鬼索命而卒，可为为政严苛之警示
  era: 明神宗时
  dates_known: false
- name_zh: 周孔教
  score: 3
  worth_why: 应天巡抚升侍郎，劾石星致死、误杀三十余贼情犯，断头鬼索报一则，涉及司法误杀议题
  era: 明神宗时
  dates_known: false
- name_zh: 庄奇显
  score: 3
  worth_why: 癸丑榜眼掷经踏像遭恶报，有科第坐标但做事流缺失
  era: 明末
  dates_known: false
- name_zh: 张翰冲
  score: 3
  worth_why: 丙辰进士金坛知县，遇僧劝罢官学道未从而死于异痈，有抉择点但无完整周期
  era: 明末
  dates_known: false
rejections:
- name_zh: 陆谷
  why_not: 一则溺亡示梦因果故事，无做事周期
- name_zh: 蔡坦如之妻
  why_not: 持斋择日而逝轶事，无事业
- name_zh: 罗四
  why_not: 铸镜礼忏一则，无做事周期
- name_zh: 徐三姐
  why_not: 宿债索命短则寥寥数十字
- name_zh: 许兆馨
  why_not: 强污少尼啮舌而死，纯报应轶事
- name_zh: 杨龚
  why_not: 打猎损物命中自毙，无做事流
- name_zh: 劳振宇
  why_not: 卖鳝面业报一则，事迹简略
- name_zh: 万七
  why_not: 缚鸟兽十年恶报段落过短
- name_zh: 姚某
  why_not: 侵匿赈饥金毙命短则
- name_zh: 于行素
  why_not: 求云栖大师救妻病愈一则，无人物主业
- name_zh: 细婴之父徐雨海
  why_not: 诵经送女一则，无做事周期
- name_zh: 赖姓富室
  why_not: 豢养生命毙于铁网，轶事过短
- name_zh: 楚中生员
  why_not: 冥府简阅文簿传说，无历史行为者事迹
- name_zh: 南濠街阴隶
  why_not: 魂游阴司变猪变蛇故事，非可考人物
