source: 儒藏/语录/双桥随笔.md
category: 儒藏/语录
verdict: has_candidates
candidates:
- name_zh: 周召
  score: 5
  worth_why: 耿精忠之乱中携家避兵双桥，藏书尽失仍凭记诵缀成十二卷随笔，有完整小做事流（避乱起念—忆录成编—手畀儿辈代籯金）；主张信道不信邪、斥风水僧道陋习，可为乱世治学之范；然其人仅知官凤县知县，生平简略，列为缓录
  era: 清康熙初
  dates_known: true
rejections:
- name_zh: 周世宗
  why_not: 仅引废佛寺三千三百三十六、毁铜像铸钱一段轶闻以赞其明达，其完整改革做事流须另据五代正史，本篇所记太略
- name_zh: 陶侃
  why_not: 仅朝运百甓于斋外暮运于内一语励志引证，无做事周期
- name_zh: 郑玄
  why_not: 仅黄巾数万见之皆拜相戒不敢入县境一则掌故，属证引非传记
- name_zh: 孙期
  why_not: 仅牧豕奉母、贼相饬约莫犯孙先生落数十字孝行掌故
- name_zh: 吕蒙
  why_not: 仅节引孙权劝学对话，士别三日刮目相待之全事须另据三国志
- name_zh: 王仲信
  why_not: 仅愿守此书以死不愿官数语，书厄掌故而已，无生平可考
- name_zh: 司马伋
  why_not: 仅畏秦桧而否认祖著涑水记闻一段负面书厄掌故
- name_zh: 秦熺
  why_not: 仅恃父势移文夺书一段负面掌故
- name_zh: 黎盛
  why_not: 仅海寇麾兵救吴氏岁寒堂藏书一则，事极简
- name_zh: 耿精忠
  why_not: 仅作构逆避兵之时代背景提及，非传主
- name_zh: 乐正子春
  why_not: 仅母死五日不食一语引证，无做事周期
- name_zh: 诸葛亮
  why_not: 已在库，此处仅渭水治军名士评一节转引
- name_zh: 司马懿
  why_not: 已在库，此处仅戎服莅事叹诸葛数语转引
- name_zh: 刘备
  why_not: 已在库，此处仅临终戒后主读书书目一句转引
- name_zh: 孙权
  why_not: 已在库，此处仅劝吕蒙蒋钦涉猎读书数语转引
