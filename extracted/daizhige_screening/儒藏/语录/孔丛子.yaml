category: 儒藏/语录
verdict: has_candidates
candidates:
- name_zh: 子思
  score: 9
  worth_why: 《中庸》作者，孔丛子为其言行主要传本——居卫论将、辞币自持、困宋著书，出处进退终始可循，立言传道俱有成，四书之宗
  era: 战国初
  dates_known: true
- name_zh: 孔鲋
  score: 8
  worth_why: 秦焚书之际藏书于旧宅壁中，汉世鲁壁古文经由此出，存斯文之名场面；仕陈涉为博士，谏不见用而识势退身，卒于陈下——守先待后与出处气节皆可为后世法
  era: 秦末
  dates_known: true
- name_zh: 孔斌
  score: 7
  worth_why: 相魏而谏行不用，致仕著书；答陈馀纵约之问出成语作舍道边三年不成；秦并魏后坚辞不仕，出处始终完整
  era: 战国末
  dates_known: true
- name_zh: 孔穿
  score: 6
  worth_why: 与公孙龙辩而折其白马非马之说，平原君欲官之而辞——名辩名场面足录，做事流稍简
  era: 战国末
  dates_known: true
- name_zh: 子夏
  score: 6
  worth_why: 穷居壤室蓬户、弹琴歌先王之道以忘忧；史传西河设教为魏文侯师，经艺传受所自出——然本书仅载问学数则
  era: 春秋末
  dates_known: true
- name_zh: 孔臧
  score: 5
  worth_why: 嗣蓼侯、武帝时官太常，经术传家，所著赋书附连丛可考——事功简略，暂缓
  era: 西汉初
  dates_known: true
rejections:
- name_zh: 孔子
  why_not: 已在库，勿重复录入
- name_zh: 公孙龙
  why_not: 白马非马虽为名场面，然书中仅作孔穿论难之陪衬，做事流不全
- name_zh: 子贡
  why_not: 书中唯访对问难，存鲁乱齐、货殖外交诸事不载于此
- name_zh: 晏婴
  why_not: 仅适齐一节问对，无做事周期
- name_zh: 苌弘
  why_not: 仅赞孔子圣表一言，无自身事功可考于本书
- name_zh: 伊尹
  why_not: 论书篇仅一言及放太甲于桐，非其本传
- name_zh: 太甲
  why_not: 居丧不义见放一事而已，缺缘起与后效
- name_zh: 子上
  why_not: 唯受教于子思、问难于时人，事迹零星无可成之流
- name_zh: 东郭亥
  why_not: 欲攻田氏问计一节即止，事迹不成流
