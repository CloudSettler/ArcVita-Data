source: 儒藏/语录/省心录.md
category: 儒藏/语录
verdict: no_value
skip_reason: 该文献为宋林逋所撰修身格言警句集，通篇为哲理性语录，无任何人物的做事周期叙事——所涉圣贤均仅作道德引证一笔带过，不满足「做事流完整」「名场面潜力」两条核心标准，故无可录入候选人
rejections:
- name_zh: 林逋
  why_not: 仅为本书署名作者，文中无其生平事迹与做事周期；隐逸诗人非成事儿主线
- name_zh: 孟子
  why_not: 文中仅引良知良能、答梁惠王义利之辨等语，无周游列国推行仁政的做事流叙述
- name_zh: 孔子
  why_not: 已在库；文中仅以「文学为孝悌之余事」一句带过
- name_zh: 汤
  why_not: 已在库；文中仅作伊尹负鼎事例的背景
- name_zh: 尧
  why_not: 仅作传贤与「为父而有丹朱」的格言例证，无事迹
- name_zh: 舜
  why_not: 仅作「克谐以孝」的例证，无事迹
- name_zh: 伊尹
  why_not: 仅以「负鼎于汤」一语点其富贵以道，无做事流
- name_zh: 颜渊
  why_not: 仅引一瓢自乐与「有为者亦若是」之语，无事迹叙述
- name_zh: 梁惠王
  why_not: 仅作孟子答问对象出现，无事迹
