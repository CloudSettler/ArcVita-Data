source: 儒藏/语录/知圣篇.md
category: 儒藏/语录
verdict: has_candidates
candidates:
- name_zh: 廖平
  score: 9
  worth_why: 本书作者，光绪戊子于黄陵峡舟次成知圣篇，倡孔子受命改制、素王立教之说；一生经学六变，从今古学考到尊孔微言，启康有为孔子改制考，晚清经学完整做事流与争议皆备
  era: 清末民初
  dates_known: true
- name_zh: 孟子
  score: 8
  worth_why: 文中引其独传知我罪我、其义窃取之微言；史事游说齐梁不受用而归，著七篇垂万世，义利之辨性善之说成名场面
  era: 战国
  dates_known: true
- name_zh: 荀子
  score: 8
  worth_why: 文中谓其以周公仲尼为大儒；三为稷下祭酒，为兰陵令，弟子李斯韩非，著书数万言以明王道，做事流完整
  era: 战国末
  dates_known: true
- name_zh: 伊尹
  score: 8
  worth_why: 文中引伊尹说汤以素王之道，为其事迹最早出处；负鼎论味佐汤灭夏，放太甲于桐而复立，商之贤相典型
  era: 商初
  dates_known: true
- name_zh: 贾谊
  score: 8
  worth_why: 文中赞其值汉初兴指斥先帝所施涕泣请改建而不以为非；治安策过秦论垂戒，谪长沙吊屈原，做事流起伏完整
  era: 西汉初
  dates_known: true
- name_zh: 周文王
  score: 7
  worth_why: 文中析其为孔子改制所托之表，名异实同；本身羑里演易、三分天下有其二，为周代奠基，制度奠基型做事流
  era: 商末周初
  dates_known: true
- name_zh: 庄子
  score: 7
  worth_why: 文中指玄圣素王之说明文始见庄子；拒楚相之聘宁曳尾涂中，著十余万言寓言王道，精神传世
  era: 战国
  dates_known: true
- name_zh: 子贡
  score: 7
  worth_why: 文中以其知足知圣人、推孔子贤于尧舜为微言要证；史实存鲁乱齐破吴强晋，货殖千金端木遗风
  era: 春秋末
  dates_known: true
- name_zh: 朱熹
  score: 7
  worth_why: 文中称宋程朱亦主素王之义；集宋儒之成注四书，庆元党禁中著述不辍，书院讲学成完整做事流
  era: 南宋
  dates_known: true
- name_zh: 郑玄
  score: 7
  worth_why: 文中谓经学若归传述则孔子不过许郑之比，反证其地位；遍注群经融合今古，党锢中注礼不辍，黄巾皆拜郑公
  era: 东汉
  dates_known: true
- name_zh: 刘歆
  score: 7
  worth_why: 文中引其仲尼卒而微言绝之语；史实校书秘阁移书让太常争立古文经，为王莽国师晚谋诛莽事败，今古学之争关键推手且教训深刻
  era: 西汉末新莽
  dates_known: true
- name_zh: 许慎
  score: 6
  worth_why: 文中以许郑并举；史实从贾逵受古学，五经无双，二十余年成说文解字，病中遣子献书，著作做事流完整
  era: 东汉
  dates_known: true
rejections:
- name_zh: 尧
  why_not: 文中仅作改制托古坐标，君主低优先，无独立做事周期可据本文录入
- name_zh: 舜
  why_not: 同尧，仅作帝王蓝本并列，无本文事迹
- name_zh: 颜回
  why_not: 文中仅见答问语，早卒无完整做事流
- name_zh: 宰我
  why_not: 仅以称圣一语出现，无做事周期
- name_zh: 二程
  why_not: 文中仅程朱并提一笔带过，事迹无据
- name_zh: 少昊
  why_not: 仅见夹注素王溯源，无事迹流
- name_zh: 伏羲
  why_not: 仅借羲辔失驭为喻，非叙事人物
