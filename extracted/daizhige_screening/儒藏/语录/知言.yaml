candidates:
- name_zh: 胡宏
  score: 8
  worth_why: 著《知言》为湖湘学派奠基之作，提出“性立天下之有”“仁者天地之心”诸命题；隐居衡山近二十年讲学著述，辨异端辟释氏；晚年辞征召不仕，气节与学问俱全
  era: 南宋初
  dates_known: true
- name_zh: 孟子
  score: 9
  worth_why: 本书盛赞其“承道之至衰，执极而不变，屹然独立于横流”；距杨墨、道性善、游说齐梁、著书七篇，做事流与名场面俱全
  era: 战国中期
  dates_known: true
- name_zh: 张栻
  score: 8
  worth_why: 湖湘学派集大成，主教岳麓书院，与朱熹会讲往复论学；为《知言》作序阐发性论，东南三贤之一
  era: 南宋
  dates_known: true
- name_zh: 胡安国
  score: 7
  worth_why: 序称文定公，即胡宏之父；著《春秋传》为经义定本，开湖湘家学之统，传子成学派
  era: 两宋之际
  dates_known: true
- name_zh: 真德秀
  score: 7
  worth_why: 跋《知言》稿者；立朝有节为南宋名臣，著《大学衍义》成经世名作，与魏了翁并称
  era: 南宋中后期
  dates_known: true
- name_zh: 杨时
  score: 7
  worth_why: 序中师承所自（杨中立）；程门立雪之典出其身，载道南归倡道东南，洛学南传枢纽
  era: 两宋之际
  dates_known: true
