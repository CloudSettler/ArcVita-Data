category: 儒藏/语录
verdict: has_candidates
candidates:
- name_zh: 程颐
  score: 9
  worth_why: 伊川先生；举进士不中不复再试、以圣学为己任；元祐与司马光吕公著同荐入侍讲、旋罢旋贬涪州而不改其节；程门立雪之典主
  era: 北宋
  dates_known: true
- name_zh: 程颢
  score: 9
  worth_why: 明道先生；以进士得官、荐为御史、论新法不合罢去不悔；推尊董仲舒正谊明道之旨；门人共諡明道以见其志
  era: 北宋
  dates_known: true
- name_zh: 张载
  score: 9
  worth_why: 横渠先生；关学开山；与弟张戬笃行不苟为一代师表；推明圣学门徒之盛、当时并称张程；四为之教泽被后世
  era: 北宋
  dates_known: true
- name_zh: 胡瑗
  score: 9
  worth_why: 安定先生主湖州学；使学者各治一事如边事河事各居一斋日夕讲究；教人务有实效不为虚言；分斋治事为宋代教育制度创举、弟子多为时用
  era: 北宋
  dates_known: true
- name_zh: 邵雍
  score: 8
  worth_why: 康节先生；先天之学具见易图与皇极经世；洛阳论知花三等令章惇默然惭服；欲传数学须十年不仕宦之拒显学者风骨
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 8
  worth_why: 过颍规劝正献公近朱者赤欧阳永叔在此宜频近笔研、前辈规劝出于至诚；先忧后乐义庄首创、本篇得其一幕
  era: 北宋
  dates_known: true
- name_zh: 周敦颐
  score: 8
  worth_why: 茂叔；太极图说辞约而志远；二程穷理之学实自濂溪发之；以薄宦四方之游于高贤无一日之雅自谢、襟怀可鉴
  era: 北宋
  dates_known: true
- name_zh: 欧阳修
  score: 8
  worth_why: 知颍州以焦千之处书室教吕氏子弟；送行诗有能掇之行可谓仁者勇者；奖掖后进为一代文宗范式
  era: 北宋
  dates_known: true
- name_zh: 包拯
  score: 8
  worth_why: 尹京时遗金父子相让一事、吕本中引为人皆可以为尧舜之实证；铁面清官治绩完整可考
  era: 北宋
  dates_known: true
- name_zh: 吕公著
  score: 8
  worth_why: 正献公专以荐贤为务、荐程颢程颐张戬诸贤皆成显学；不欺闇室；简重清静教子有法；元祐宰辅
  era: 北宋
  dates_known: true
- name_zh: 徐积
  score: 7
  worth_why: 仲车先生闻头容直之训而悟心亦要直；晨夕具公裳揖母、事母至孝化及乡里；升堂训君子小人自成一家之论
  era: 北宋
  dates_known: true
- name_zh: 吕希哲
  score: 7
  worth_why: 荥阳公年二十一察伊川议论大异、首以师礼事之、开洛学师从之风；监陈留税不为章楶暴陵所动；不欺闇室之誉
  era: 北宋
  dates_known: true
- name_zh: 吕本中
  score: 7
  worth_why: 童蒙训作者；家塾训课传世、学问以孝经论语为本纲领明晰；江西诗派宗派图作者、诗学一派之宗
  era: 南宋
  dates_known: true
- name_zh: 章惇
  score: 6
  worth_why: 洛阳论牡丹以见根橃知花上等、惭服康节从之游；欲学数学被拒须十年不仕宦；豪俊自许之反面镜鉴
  era: 北宋
  dates_known: true
- name_zh: 李潜
  score: 6
  worth_why: 君行先生笃行自守不交当世；以经书为秤量众说轻重之喻；五十余始被荐、绍圣力求去、守经不移
  era: 北宋
  dates_known: true
rejections:
