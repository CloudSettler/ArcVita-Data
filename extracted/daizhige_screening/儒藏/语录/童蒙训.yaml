- name_zh: 焦千之
  why_not: 仅严师课士数语、做事流不完整
- name_zh: 杨国宝
  why_not: 劲挺不屈荐属官济亲散记可取、但无完整周期
- name_zh: 章楶
  why_not: 仅相试一事、其御夏功业不在此书
- name_zh: 陈抟
