source: 儒藏/语录/答王龙溪.md
category: 儒藏/语录
verdict: has_candidates
candidates:
- name_zh: 聂豹
  score: 8
  worth_why: 王门归寂说创始人，本篇即其与王龙溪往复论学的致知公案，未发涵养与现成良知之争为明代思想史名场面；曾下诏狱著困辨录悟归寂之旨；后官至兵部尚书，倡筑北京外城以御俺答，学行政功俱有完整做事流
  era: 明代正德至嘉靖年间
  dates_known: true
- name_zh: 王畿
  score: 8
  worth_why: 号龙溪，天泉证道倡四无之说，讲学东南五十余年为阳明后学浙中宗主；本篇即致知议略之往复辩难主角，辨寂感先后、格物致知，论战本身即思想交锋名场面
  era: 明代嘉靖至万历年间
  dates_known: true
rejections:
- name_zh: 颜回
  why_not: 仅作不远复三月不违之论学引证，无做事周期
- name_zh: 子贡
  why_not: 仅引多学亿中为反衬之例，无事迹
- name_zh: 孟子
  why_not: 仅引孩提爱敬良知之说为据，文中无其做事流
- name_zh: 邵雍
  why_not: 仅引先天吟诗句作论据
- name_zh: 程颢
  why_not: 仅引未发已发之语作论据
- name_zh: 朱熹
  why_not: 仅引寂感体用一句
- name_zh: 杨简
  why_not: 慈湖正心之说仅被点名驳斥，无事迹
- name_zh: 王守仁
  why_not: 先师之教仅作引据，且已在库勿重复列
