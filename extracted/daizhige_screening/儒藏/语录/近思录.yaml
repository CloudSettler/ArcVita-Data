- name_zh: 朱熹
  score: 9
  worth_why: 与吕祖谦分类缉纂近思录为五经之阶梯；集注四书、定白鹿洞学规，集理学之大成，做事流完整
  era: 南宋
  dates_known: true
- name_zh: 周敦颐
  score: 9
  worth_why: 太极图说通书开宋明理学宇宙论之先，无极而太极之立论为千古名场面，又为二程之师
  era: 北宋
  dates_known: true
- name_zh: 程颐
  score: 8
  worth_why: 著易传自成一家；穷理主敬之训立洛学规模，党禁困顿中晚年成书，周期完整
  era: 北宋
  dates_known: true
- name_zh: 程颢
  score: 8
  worth_why: 与弟颐共创洛学；识仁定性之论开后世心学先声
  era: 北宋
  dates_known: true
- name_zh: 张载
  score: 8
  worth_why: 西铭正蒙立气本之学；为天地立心四句为后世士人精神坐标
  era: 北宋
  dates_known: true
- name_zh: 吕祖谦
  score: 7
  worth_why: 与朱熹同编近思录；主持鹅湖之会调和朱陆，做事可考
  era: 南宋
  dates_known: true
- name_zh: 邵雍
  score: 6
  worth_why: 皇极经世以元会运世推步自成一家；惟本书明言姑舍其书，宜另据本传取材
  era: 北宋
  dates_known: true
