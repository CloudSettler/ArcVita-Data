source: 儒藏/语录/黄书.md
category: 儒藏/语录
verdict: has_candidates
candidates:
- name_zh: 王夫之
  score: 9
  worth_why: 明亡后举义抗清、佐南明，事不可为则遁隐石船山著述四十年；黄书倡三维之防、族类自畛、反孤秦陋宋，读通鉴论成一家之言；遗民之学下启晚清辛亥思潮，做事流完整、名场面与教训兼备
  era: 明末清初
  dates_known: true
- name_zh: 岳飞
  score: 7
  worth_why: 文中虽仅岳氏遽陨於风波一句，然其事功可凭史学补全——行伍起家、岳家军、郾城之捷、十二金牌、风波亭冤狱；忠而被戮为千古教训
  era: 南宋
  dates_known: true
- name_zh: 黄帝
  score: 7
  worth_why: 文载轩辕肇纪、闵阽危、铸五兵、诛铜额、弭刃涿鹿、巡瑞定鼎建屏万邦；涿鹿之战为华夏立国叙事的名场面；惜年代属传说、精度低
  era: 上古传说
  dates_known: false
- name_zh: 赵匡胤
  score: 7
  worth_why: 文中虽未具名而实指其人——藩臣暴兴、假杯酒固欢、削节镇收禁军；陈桥兵变至杯酒释兵权做事流完整，而集权过度致宋弱之祸亦自其始，功过皆为名场面
  era: 五代宋初
  dates_known: true
- name_zh: 赵普
  score: 6
  worth_why: 杯酒释兵权之谋主、宋初削藩弱武方略的设计者；文中斥为斗筲贡谋，然其一项制度决定牵动三百年国运，决策点清晰
  era: 北宋初
  dates_known: true
- name_zh: 狄青
  score: 6
  worth_why: 行伍至枢副、稍自掀举即嫌疑指斥、密席未温而罢；重文抑武体制的牺牲品，教训型人物、做事流可考
  era: 北宋
  dates_known: true
- name_zh: 石敬瑭
  score: 5
  worth_why: 文中石晋北倾、恃怙蠢丑即指其割燕云倚外族；燕云之割深刻改变后世攻守格局，教训价值大而做事流需外证补全
  era: 五代后晋
  dates_known: true
rejections:
- name_zh: 石守信、高怀德
  why_not: 仅作杯酒释兵权之例证一笔带过，无自身做事流
- name_zh: 李勣、薛仁贵、王忠嗣、郭元振
  why_not: 并列一句以证唐将专命进止，无阶段与决策可析
- name_zh: 王莽、曹丕
  why_not: 莽僭西都、丕夺许鼎各一词提及，无周期
- name_zh: 随会
  why_not: 仅命随会一语，无事迹展开
- name_zh: 刘六符
  why_not: 仅恫喝一句，无完整做事周期
- name_zh: 蚩尤
  why_not: 文中以铜额暗指而未具名，且年代涉神话难为时间轴坐标
