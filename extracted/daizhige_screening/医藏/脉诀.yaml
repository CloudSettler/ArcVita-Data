candidates:
- name_zh: 崔嘉彦
  score: 7
  worth_why: 撰四言脉诀，将脉理总括于浮沉迟数四纲并七表八里九道，是中医脉学由博返约的关键著作，其发明“四脉为纲、以脉统病”的方法论足以垂范后世诊法；做事流以著述为核心缘起（师承刘完素一脉学说）—编写（总结脉象体系）—成书（后世李时珍补订流传），周期完整可考
  era: 南宋
  dates_known: true
rejections:
- name_zh: 仲景
  why_not: 文中仅以“自有仲景”一句提及，非本传主体，且张仲景相关候选取舍另行处理
- name_zh: 诸病证名（中风、伤寒、疟、脚气等）
  why_not: 为脉诀所列病证名目，非人物，无可录之事
