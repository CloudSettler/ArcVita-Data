source: 史藏/传记/古列女传.md
category: 史藏/传记
verdict: has_candidates
candidates:
- name_zh: 鲁季敬姜
  score: 8
  worth_why: 教子择严师贤友，引武王结袜、桓公举过、周公吐哺三例责其游皆服役者；文伯相鲁，复以机杼经纬喻治国之要尽在经，母教与政论名场面俱足
  era: 春秋末期
  dates_known: true
- name_zh: 娥皇女英
  score: 7
  worth_why: 三助舜脱瞽叟与象之谋杀——焚廪飞出、浚井潜出、药浴防醉；舜陟方死苍梧，二妃死于江湘为湘君，湘妃典故源头
  era: 上古尧舜之际
  dates_known: false
- name_zh: 卫姑定姜
  score: 7
  worth_why: 送妇赋燕燕之诗；谏定公复孙林父以远患安国；数献公三罪辞严义正；卜兆断征者丧雄而卫人获皇耳，识虑皆验
  era: 春秋
  dates_known: true
- name_zh: 舜
  score: 7
  worth_why: 父顽母嚚弟傲而能谐柔尽孝，三难不死；尧试之百方，纳于百揆宾于四门，卒嗣位为天子，封象于有庳不藏怨，由畎亩至天子的完整弧线
  era: 上古尧舜之际
  dates_known: false
- name_zh: 弃母姜嫄
  score: 6
  worth_why: 清静专一好种稼穑，教弃种树桑麻；弃为尧之稷官、舜命播时百谷，周室由此而兴，农事母教原型
  era: 上古尧时
  dates_known: false
- name_zh: 太姒
  score: 6
  worth_why: 号曰文母，文王治外文母治内；教诲十子自少及长未尝见邪僻，卒成武王周公之德
  era: 殷周之际
  dates_known: false
- name_zh: 太任
  score: 6
  worth_why: 胎教之祖，目不视恶色耳不听淫声口不出敖言，文王生而明圣教之以一识百
  era: 殷周之际
  dates_known: false
- name_zh: 启母涂山氏
  score: 6
  worth_why: 禹三过家门不入，涂山独明教训致启之化；启持禹之功不殒而继夏统
  era: 上古夏初
  dates_known: false
- name_zh: 契母简狄
  score: 5
  worth_why: 吞玄鸟卵生契，教以理顺之序；契为司徒敬敷五教，商族由此而兴；然事简宜缓
  era: 上古尧时
  dates_known: false
- name_zh: 齐女傅母
  score: 5
  worth_why: 以硕人诗砥厉庄姜高节防患未然，庄姜感而自修；然身份不详事迹单一，宜缓
  era: 春秋
  dates_known: false
rejections:
- name_zh: 汤妃有莘
  why_not: 传文仅数十字，唯记统领九嫔后宫有序，无完整做事周期
- name_zh: 卫献公
  why_not: 居丧而慢、暴虐见逐赖鱄得返虽具始末，然皆自定姜视角铺陈，君主又无突出做事
- name_zh: 庄姜
  why_not: 传中为受教与被咏对象，无自主行事
- name_zh: 州吁
  why_not: 仅一句果杀桓公，无做事流可考
- name_zh: 太姜
  why_not: 仅记顺率导、谋事迁徙必与二三句，事迹过简
- name_zh: 尧
  why_not: 传中唯择婿试舜以为背景，君主仅作时间坐标
