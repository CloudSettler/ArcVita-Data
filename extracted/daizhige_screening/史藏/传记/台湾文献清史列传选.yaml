category: 史藏/传记
verdict: has_candidates
candidates:
- name_zh: 郑成功
  score: 10
  worth_why: 以厦门金门一隅抗清十余年，北伐直逼江宁震动东南；终跨海东征逐荷兰人复台湾，设官置县行教化；儒生变海上之王的完整做事周期，忠孝两难与盛年呕血而卒皆可成轴
  era: 明末清初
  dates_known: true
- name_zh: 吴三桂
  score: 9
  worth_why: 山海关开关引清兵改写天下大势，坐镇云贵缢杀永历，晚年举三藩之兵反清称帝旋败；引清、平西、称帝三级名场面俱全，反复无常者的典型教训
  era: 明末清初
  dates_known: true
- name_zh: 施琅
  score: 9
  worth_why: 郑氏部将出身与旧主结仇、父弟被戮，投诚后二十年隐忍蓄志，澎湖海战破刘国轩一举定台湾；又力排弃台之议主张设官驻防，复仇与远见并存，做事流极完整
  era: 清初
  dates_known: true
- name_zh: 洪承畴
  score: 9
  worth_why: 松锦之战以蓟辽总督统明军主力兵败被俘，降清后佐定江南、经略湖广五省；治世能臣与大节之亏集于一身，后世列入贰臣传，出处进退的顶级样本
  era: 明末清初
  dates_known: true
- name_zh: 郑芝龙
  score: 8
  worth_why: 起海盗受抚至总兵，缔造闽海贸易军事霸权并拥立隆武；降清后软禁北京终被族诛，成于海而亡于降，兴衰周期完整、教训典型
  era: 明末清初
  dates_known: true
- name_zh: 孔有德
  score: 8
  worth_why: 登州兵变携红夷大炮与炮匠水手渡海降金，使后金攻坚能力跃升，明清战力转折的关键技术转移者；封定南王后桂林城破自焚，功罪与结局俱全
  era: 明末清初
  dates_known: true
- name_zh: 尚可喜
  score: 8
  worth_why: 广鹿岛归附从龙入关，定广东封平南王；三藩之乱中宁受其子劫持亦不附吴耿，忧愤而终；与耿尚诸藩对照鲜明，出处之节足为藩镇之鉴
  era: 明末清初
  dates_known: true
- name_zh: 李成栋
  score: 8
  worth_why: 为清连破隆武绍武两帝并定两广，功高反遭掣肘，举全省反正归明，终信丰败死；降与反正两段皆改写时局，乱世降将进退的心理与命运样本
  era: 明末清初
  dates_known: true
- name_zh: 姚启圣
  score: 8
  worth_why: 从罢官任侠到福建总督，收拾耿乱残局、倡招抚复界、练舟师、力荐施琅专征而不夺其功，为平台方略总设计师；做事链清晰，荐贤不忌尤为可法
  era: 清初
  dates_known: true
- name_zh: 耿仲明
  score: 7
  worth_why: 与孔有德同举登州之变携炮归金，封靖南王移镇福建；因部将匿逃人惧罪自尽于军中，同为技术叛将的另一种结局
  era: 明末清初
  dates_known: true
- name_zh: 耿精忠
  score: 7
  worth_why: 袭靖南王爵附吴三桂举闽反清，结郑经为援，败降仍怀二心终磔于市；三藩覆灭的典型样本，警示首鼠两端
  era: 清初
  dates_known: true
- name_zh: 钱谦益
  score: 7
  worth_why: 东林魁首、文坛宗主，南京城破迎降留千古讥议，晚年又暗通永历倾资助抗清；著述宏富而大节有亏，文人名节的痛切个案
  era: 明末清初
  dates_known: true
- name_zh: 张勇
  score: 7
  worth_why: 明末降将，顺治间平甘肃米喇印、丁国栋之乱封靖逆侯；三藩之乱中带疾督师平王辅臣之叛，稳住陕西全局，为清廷转危为安的枢纽人物
  era: 清初
  dates_known: true
- name_zh: 金声桓
  score: 7
  worth_why: 降清后为清取江西全省，以功高见抑举兵反正归明，南昌被围数月城破自尽；降臣进退两难的完整心理与命运周期
  era: 明末清初
  dates_known: true
- name_zh: 王铎
  score: 7
  worth_why: 明清之际书法巨擘，连绵大草与临帖体系独开生面；南京陷落率百官迎降，艺术名场面与贰臣污点并存，艺节之辨的样本
  era: 明末清初
  dates_known: true
rejections:
