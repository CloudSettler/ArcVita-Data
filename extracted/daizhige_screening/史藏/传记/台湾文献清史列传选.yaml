  why_not: 四镇降将，传文止于战守降附与谋叛伏诛，无完整做事周期
- name_zh: 刘良佐
  why_not: 传略以官爵迁转为主，无独立事业轴
- name_zh: 赵之龙
  why_not: 率南京勋贵开城迎降一事之外传文简略
- name_zh: 许定国
  why_not: 诱杀高杰一节虽剧，余事简略难成做事轴
- name_zh: 左梦庚
  why_not: 承父余众降清，事迹短促无周期
- name_zh: 朱国治
  why_not: 哭庙酷案与死于吴逆可记，然无建设性做事流
- name_zh: 梁清标
  why_not: 鉴藏成就突出而传文以官职酬应为主，做事轴不显
- name_zh: 李世熊
  why_not: 遗民拒仕著述自守，无重大做事事件可系年
