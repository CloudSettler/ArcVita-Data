category: 史藏/传记
verdict: has_candidates
candidates:
- name_zh: 刘基
  score: 10
  worth_why: 做事流完整而名场面极多：上时务十八策定鼎金陵、力主先斩主降与奔钟山者、鄱阳湖之战密请移军湖口并挽舟避炮「难星过矣」、观云识伏夜取城、定军卫法；论相三断杨宪、汪广洋、胡惟庸皆验而力辞相位；终遭胡惟庸挟医毒杀、遗命焚尸扬灰，运筹之智与悲剧之鉴俱全
  era: 元末明初
  dates_known: true
- name_zh: 于谦
  score: 9
  worth_why: 巡抚河南山西十八年、入议事袖手无所馈、两袖清风赋诗自见；土木之变前与邝埜力主遣将勿亲征；其后北京保卫战再造社稷、终蒙冤死（本节传文截于土木之变，可据通史补全做事流），社稷之臣与忠烈之鉴兼具
  era: 明前期
  dates_known: true
- name_zh: 章溢
  score: 8
  worth_why: 做事流较完整：少时以身代侄自缚于贼、夜脱归募少年破贼；弃元受聘、对以「不嗜杀人者能一之」；抚定处州、招抚奸民、籍兵屯田、遣子破茗阳叛、定闽之谋；力谏勿调乡兵北伐以全官府之信；以劳毁得疾而卒，儒臣治民守信之范
  era: 元末明初
  dates_known: true
- name_zh: 李善长
  score: 7
  worth_why: 篇叙明言「乃复采李善长而下志之」，当在后续卷帙；本节已见其与刘基同居守省、袒护李彬、结怨构陷诸节；凭史学知识补全其佐太祖开国、比萧何功臣第一、封韩国公、罢相、终以胡惟庸案族诛之全程，功高位极而祸生之典型教训
  era: 元末明初
  dates_known: true
