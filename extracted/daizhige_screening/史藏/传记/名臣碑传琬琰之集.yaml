source: 史藏/传记/名臣碑传琬琰之集.md
category: 史藏/传记
verdict: has_candidates
candidates:
- name_zh: 赵普
  score: 9
  worth_why: 碑传做事流完整：滁州断狱明敏得太祖赏识起于幕府；平李筠献倍道速进之策，平李重进筹攻取之防；为相定宋初制度，太宗朝平北汉再登相位；两朝顾命三入中枢，临终上姚崇十事之表；晚岁酷爱读书，即半部论语治天下之典
  era: 北宋初
  dates_known: true
- name_zh: 韩琦
  score: 9
  worth_why: 谏官连疏劾政同日罢四执政；剑南安抚活饥民百余万；帅陕御西夏持攻守二策，力雪刘平诬降之冤；后为两朝顾命定策元勋，相三朝立二帝，名场面密集
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 欧阳修撰其神道碑当在此集；戍边御西夏，庆历新政建言十事，先天下之忧而忧后天下之乐而乐，创义庄制度，典范人物
  era: 北宋
  dates_known: true
- name_zh: 寇准
  score: 8
  worth_why: 澶渊之盟力主真宗亲征定盟，社稷之功之关键决策名场面，结局被贬亦成教训
  era: 北宋
  dates_known: true
- name_zh: 富弼
  score: 8
  worth_why: 苏轼撰其神道碑当在集中；使辽折冲拒割地，庆历新政骨干，青州救灾活民数十万
  era: 北宋
  dates_known: true
- name_zh: 欧阳修
  score: 8
  worth_why: 庆历谏臣、嘉祐知贡举革新文风，朋党论与濮议之关键角色，唐宋八大家宗主
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 编资治通鉴成史学巨制，元祐更化尽废新法，成败两面皆可作后人镜鉴
  era: 北宋
  dates_known: true
- name_zh: 包拯
  score: 7
  worth_why: 集中存其墓志铭；知开封府不畏权贵，弹劾张尧佐事件，清官典范之经典名场面
  era: 北宋
  dates_known: true
- name_zh: 文彦博
  score: 7
  worth_why: 平贝州王则之乱，历仕四朝为庆历老臣领袖，裁汰冗兵之争有决策价值
  era: 北宋
  dates_known: true
- name_zh: 狄青
  score: 7
  worth_why: 行伍至枢密使，夜袭昆仑关破侬智高之战役名场面，功高遭猜忌郁郁而终可为教训
  era: 北宋
  dates_known: true
