source: 史藏/传记/名臣碑传琬琰集.md
category: 史藏/传记
verdict: has_candidates
candidates:
- name_zh: 赵普
  score: 10
  worth_why: 佐太祖创业做满全周期：滁州断狱知名、献倍道速进策擒李筠、指画平李重进、居中定削藩方略，晚岁上姚崇十事直言，半部论语治天下之典型
  era: 五代末至北宋初
  dates_known: true
- name_zh: 韩琦
  score: 9
  worth_why: 谏官同日罢四执政、剑南赈饥活民百余万、西北御夏与范仲淹并称、庆历新政主干，末以两朝顾命定策立英神二帝，做事流与名场面俱全
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 10
  worth_why: 戍边整军御夏、庆历新政十事疏、设义庄开宗族救济制度之先、先忧后乐立言立行，模范人物典型
  era: 北宋
  dates_known: true
- name_zh: 寇准
  score: 9
  worth_why: 澶渊之役力请亲征、孤注一掷定盟弭兵之名场面；刚直进退、晚年贬死雷州，决策成败教训俱足
  era: 北宋
  dates_known: true
- name_zh: 欧阳修
  score: 9
  worth_why: 谏院论事、庆历党议、嘉祐知贡举变文风拔苏轼、濮议之争，为臣为师为文章盟主，政事文章双线完整
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 9
  worth_why: 十九年成资治通鉴之巨业、谏院敢言、元祐更化尽废新法，学者执政与制度反复的双面教训
  era: 北宋
  dates_known: true
- name_zh: 富弼
  score: 8
  worth_why: 使辽谈判不割地弭兵、青州赈灾活流民数十万、庆历至至和两度当国，外交内政皆有可考全周期
  era: 北宋
  dates_known: true
- name_zh: 文彦博
  score: 8
  worth_why: 平贝州王则之乱、历相四朝、裁冗兵议市易屡有建言，老成谋国之典型
  era: 北宋
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 伐蜀下江南皆为主帅而不妄杀，金陵围城约降以全百姓，名将自律之模范
  era: 北宋初
  dates_known: true
- name_zh: 苏轼
  score: 8
  worth_why: 徐州率民抗洪、杭州浚湖筑堤设病坊、经乌台诗案至贬儋州仍兴教化，文臣地方做事流别开生面
  era: 北宋
  dates_known: true
- name_zh: 赵抃
  score: 7
  worth_why: 铁面御史弹劾不避权贵、越州救灾全活甚众、一琴一鹤入蜀治蜀有方
  era: 北宋
  dates_known: true
- name_zh: 狄青
  score: 7
  worth_why: 面涅将军夜袭昆仑关平侬智高，行伍至枢密之名场面；功高遭忌郁郁而终，亦为教训
  era: 北宋
  dates_known: true
- name_zh: 王旦
  score: 7
  worth_why: 相真宗十二年守成协调、荐贤不遗，于天书封禅委曲求全而临终以悔闻，守成宰辅与妥协之镜鉴
  era: 北宋
  dates_known: true
- name_zh: 张咏
  score: 7
  worth_why: 两度治蜀平乱安民、约束宦官、劝课农桑，蜀人畏而爱之，能吏典型
  era: 北宋
  dates_known: true
rejections:
