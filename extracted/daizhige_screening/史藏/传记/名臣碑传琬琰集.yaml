  why_not: 本集编纂者，仕履不可考，辑录之功而非自身做事流
- name_zh: 宋太宗
  why_not: 御撰赵普碑之君主，按标准君主仅作时间坐标，其本传应另据正史专录
- name_zh: 宋神宗
  why_not: 御撰韩琦碑之君主，同上
- name_zh: 李筠
  why_not: 建隆叛帅，兵败自焚，仅为赵普献策之背景
- name_zh: 李重进
  why_not: 孤垒阻抗数月即灭，同属背景人物
- name_zh: 皇甫晖
  why_not: 滁州被擒之敌方伪将，无事业可考
- name_zh: 元昊
  why_not: 敌国君主仅作边患坐标，若录西夏开国应据别史
- name_zh: 夏竦
  why_not: 经略陕西无功被劾，史评不佳，做事流无可采
- name_zh: 刘平
  why_not: 战殁遭诬、赖韩琦力辩得白，仅一段忠烈，主体事迹本集未详
- name_zh: 黄德和
  why_not: 诬陷死节之将的监军，纯反面小人物
- name_zh: 丁谓
  why_not: 提要点名之奸邪，巧智用于逢迎倾轧终窜崖州，缺可为法之做事流
- name_zh: 王钦若
  why_not: 天书封禅之主谋、谮寇准为孤注一掷，同类奸邪
- name_zh: 吕惠卿
  why_not: 附新法而倾陷师友，反复无常，无独立可为法之做事流
- name_zh: 章惇
  why_not: 开梅山尚有实绩，然狠愎倾陷、贬逐善类，功不掩恶
- name_zh: 曾布
  why_not: 出入新旧两党无定守，绍圣主政亦沦为党争工具
