  why_not: 本篇仅言其注唐鉴分为二十四卷，注家无独立做事周期
- name_zh: 裴寂
  why_not: 仅晋阳起兵中进宫人胁高祖之配角，无独立事业
- name_zh: 刘文静
  why_not: 仅使突厥约连和一节，事略不成流
- name_zh: 高德儒
  why_not: 指野鸟为鸾之佞人，为太宗立威之例证非做事者
- name_zh: 李勣
  why_not: 本卷仅降唐赐姓一句，做事周期当待唐史正传
- name_zh: 裴枢
  why_not: 白马之祸遇难者，范祖禹论其附朱全忠非忠唐，无完整做事流
- name_zh: 程颐
  why_not: 仅被引评语称唐鉴，无本传做事
- name_zh: 朱熹
  why_not: 仅被引议论短长与纲目义例，非本文献主体
- name_zh: 欧阳修
  why_not: 仅白马之祸论中被引，无事迹
- name_zh: 王莽
