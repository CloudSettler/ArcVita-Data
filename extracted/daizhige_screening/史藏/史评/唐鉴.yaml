category: 史藏/史评
verdict: has_candidates
candidates:
- name_zh: 唐太宗李世民
  score: 10
  worth_why: 阴结豪杰定晋阳起兵、诛高德儒立军威、贞观纳谏开言路成王业范式；玄武门之变与胁父起兵是争议性关键决策；天可汗与贞观之治为帝王做事流之巅
  era: 隋末唐初
  dates_known: true
- name_zh: 范祖禹
  score: 8
  worth_why: 佐司马光修通鉴分掌唐史，以自得者著唐鉴十二卷元祐元年表上；断武后临朝系之中宗自比春秋公在干侯，自言虽得罪君子亦不辞；程颐称三代以后无此议论
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 治平中奉诏编通鉴十九年成书开编年通史典范；本篇见其与范祖禹武后义例之争；后主元祐更化尽废新法
  era: 北宋
  dates_known: true
- name_zh: 唐玄宗李隆基
  score: 8
  worth_why: 由诛韦氏乱政至开元盛世，复由盛转衰酿安史之乱；先明后昏的完整周期与教训，为唐鉴着力论断之主轴
  era: 盛唐
  dates_known: true
- name_zh: 唐高祖李渊
  score: 7
  worth_why: 晋阳起兵定鼎关中；卑辞推奖以骄李密、辞九锡之饰让、录用隋之子孙、赏谏臣孙伏伽；本卷载其由汉以来最为忠厚
  era: 隋末唐初
  dates_known: true
- name_zh: 武则天
  score: 7
  worth_why: 皇后临朝二十一年终革唐命建周；唐鉴特创武后系中宗之义例为全书最著名断案；用人有政绩而酷刑告密为教训
  era: 唐高宗至武周
  dates_known: true
- name_zh: 魏征
  score: 7
  worth_why: 犯颜直谏成谏臣典范；唐鉴屡论言路开塞系天下治乱，其与太宗并称明君贤臣之遇合
  era: 唐初
  dates_known: true
- name_zh: 狄仁杰
  score: 7
  worth_why: 武周酷吏罗织中匡救无辜；荐张柬之等终复唐祚；以一人之谋转国祚之向
  era: 武周
  dates_known: true
- name_zh: 郭子仪
  score: 7
  worth_why: 收复两京平安史之乱再造王室；单骑退回纥；功盖天下而主不疑，功成身全可为模范
  era: 中唐
  dates_known: true
- name_zh: 陆贽
  score: 7
  worth_why: 奉天之难一代诏令书奏皆出其手；奏议数千言洞达治理，为后世奏议典范，唐鉴极称其言
  era: 中唐
  dates_known: true
- name_zh: 李德裕
  score: 7
  worth_why: 会昌当国平泽潞、破回鹘、抑宦官裁冗官成会昌中兴；牛李党争核心，贬死崖州为党争教训
  era: 晚唐
  dates_known: true
- name_zh: 唐宪宗李纯
  score: 7
  worth_why: 用裴度李愬雪夜入蔡州平淮西，藩镇归命成元和中兴；晚年惑丹药宠宦官种祸，兴衰一线可为借鉴
  era: 中唐
  dates_known: true
- name_zh: 李密
  score: 6
  worth_why: 起瓦岗聚众围东都号盟主；得高祖卑辞推奖而骄志日盛终致败亡；本卷一节兼见高祖行诈与密自矜取祸
  era: 隋末
  dates_known: true
- name_zh: 朱全忠
  score: 6
  worth_why: 由黄巢降将至劫迁昭帝篡唐建梁；白马之祸杀裴枢等朝士投尸于河；唐亡祸首，权臣篡夺之教训样本
  era: 唐末
  dates_known: true
- name_zh: 孙伏伽
  score: 5
  worth_why: 高祖即位即上表切谏献鹞百戏之失，擢治书御史赐帛颁示远近；唐鉴引为国将兴必赏谏臣之证；事迹简略宜缓
  era: 隋末唐初
  dates_known: false
rejections:
