verdict: has_candidates
candidates:
- name_zh: 金庾信
  score: 9
  worth_why: 新罗统一三国的实际统帅， 花郎出身历仕真兴至文武王朝， 平百济灭高丽， 军事决策流完整且有修炼名场面
  era: 新罗·三国时期
  dates_known: true
- name_zh: 元晓
  score: 8
  worth_why: 元晓不羁条， 新罗华严宗大师， 破戒还俗自悟大笑成道， 著述影响中韩日三国
  era: 新罗
  dates_known: true
- name_zh: 义湘
  score: 8
  worth_why: 义湘传教条， 入唐求法归国创浮石寺， 新罗华严初祖， 求法周期完整
  era: 新罗
  dates_known: true
- name_zh: 慈藏
  score: 8
  worth_why: 慈藏定律条， 入唐求律归国推动新罗佛法国家化， 制度建设可考
  era: 新罗
  dates_known: true
- name_zh: 甄萱
  score: 8
  worth_why: 后百济建立者， 从百济将起兵割据西南， 与高丽抗衡半生终降， 起灭全程事例
  era: 后百济
  dates_known: true
- name_zh: 真兴王
  score: 7
  worth_why: 新罗扩张关键君主， 兴花郎制度广拓疆土， 真兴王巡狩碑名场面
  era: 新罗
  dates_known: true
- name_zh: 善德女王
  score: 7
  worth_why: 新罗首位女王， 知几三事预知名场面， 在位有瞻星台等建树
  era: 新罗
  dates_known: true
- name_zh: 朱蒙 (东明王)
  score: 7
  worth_why: 纪异卷高丽始祖， 卵生逃难至建国， 开国流完整， 兼作高句丽史坐标
  era: 高句丽
  dates_known: true
- name_zh: 温祚王
  score: 6
  worth_why: 百济第一王， 离父自立择慰礼城建都， 建国迁都决策可考
  era: 百济
  dates_known: true
- name_zh: 文武王 (法敏)
  score: 6
  worth_why: 万波息笛条， 完成灭百济败唐军之统一尾声， 兼神笛名场面
  era: 新罗
  dates_known: true
- name_zh: 弓裔
  score: 6
  worth_why: 弓巴条， 弥勒自居建泰封国后被王建覆灭， 权力膨胀覆亡教训典型
  era: 后三国
  dates_known: true
- name_zh: 阎长
  score: 6
  worth_why: 神武大王条下海盗出身的刺客， 投新罗后回报靖海， 身份与抉择张力强
  era: 新罗宪康王代
  dates_known: true
- name_zh: 圆光
  score: 6
  worth_why: 圆光西学条， 留学隋土归国传世俗五戒训花郎， 东西学交流载体
  era: 新罗
  dates_known: true
rejections:
