candidates:
- name_zh: 伏羲氏
  score: 8
  worth_why: 始画八卦造书契，命飞龙氏造六书、潜龙氏作甲历，设九牧置城郭，文明开创之完整做事流
  era: 上古三皇时代
  dates_known: false
- name_zh: 燧人氏
  score: 7
  worth_why: 钻木取火教人炮食，立日中市与结绳之政，用火起源的名场面
  era: 上古三皇时代
  dates_known: false
- name_zh: 有巢氏
  score: 6
  worth_why: 教民居巢穴取食储藏，被尊为首位君长的具象叙事
  era: 上古有巢纪
  dates_known: false
- name_zh: 神农氏
  score: 7
  worth_why: 传《归藏易》并立《政典》，民惟邦本食惟民天的治国思想与职官体系
  era: 上古三皇时代
  dates_known: false
- name_zh: 轩辕氏
  score: 5
  worth_why: 传《乾坤易》八封大象，本卷仅列卦象无做事叙事
  era: 上古三皇时代
  dates_known: false
