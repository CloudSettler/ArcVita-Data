candidates:
- name_zh: 姚莹
  score: 9
  worth_why: 三度渡台历任要职，平许尚杨良斌之乱、筹议噶玛兰定制、论台湾班兵诸篇皆可考施行；后因英使讦控妄杀俘虏与达洪阿同被褫职，旋得释；经世之学代表，东槎纪略成后世治台者之鉴
  era: 清嘉庆道光年间
  dates_known: true
- name_zh: 方传穟
  score: 8
  worth_why: 署台守时先捕许尚、部署城守、率兵援凤山、提出防北路专力南之方略，戡弭祸乱；赵文恪称善立从所请，历官擢汀漳龙道；做事流完整有名场面
  era: 清道光初年
  dates_known: false
- name_zh: 赵文恪
  score: 6
  worth_why: 督闽浙时深忧海外，慎选守令并托要务十余事，卒能弭乱安台；事迹主要作为背景与知人之明
  era: 清道光初年
  dates_known: false
rejections:
- name_zh: 许尚
  score: 6
  why_not: 反事未起即被捕，其事可作事件素材而人物自身无完整做事 cycles
- name_zh: 杨良斌
  score: 6
  why_not: 为乱首起会攻埤头，旋败走，属叛乱事件视角人物；若需亦可作反面教训候选
- name_zh: 杜绍祁
  why_not: 守埤头捕贼有绪，但记载简略无独立周期
- name_zh: 陈周全
  why_not: 本卷仅存篇目与引言，事迹文本不足
