  dilemmas:
  - 才不得展于承平，被迫在矢尽兵穷之会仗钺危疆
  - 党人掣肘、骄兵荒宴与朝廷危局之间的孤忠困局
  lesson: 时危方见人才，忠义历试而后精纯；个人努力受制于体制与时势
  summary_first_person: 我叫马光，号涑庵。崇祯己卯屡试不第，应破格征辟出知广西永宁州，控戢猺獞，调繁刺全，人称百粤睢阳；后佐琼晋宪副，永历朝被召擢台省，空拳秉钺出抚全州。北兵南下，诸帅宵遁，我疾趋行在，乘舆播迁中拔刀自刎被夺，孑身东下，蹈瘴历险十余年，卒得扁舟还吴。归而追记，题曰两粤梦游记。
  source_urls:
  - 史藏/志存记录/两粤梦游记.md
