  worth_why: 熙宁年间应募自倾家资率众穿越虚恨束密出使南诏招诱市马，全程备粮置具、循麻荏觅路、礼退蛮众，做事周期完整，是宋代西南马政开辟的关键决策与执行者，可作涉外探险外交范本
  era: 北宋熙宁
  dates_known: true
rejections:
