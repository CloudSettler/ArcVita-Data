  why_not: 传文仅数语，乞内附受册封而已，无做事周期
- name_zh: 束密王
  why_not: 仅作为接待与献俘之配角，事迹简略
- name_zh: 云南八国都王
  why_not: 君主型人物，仅作时间与地理坐标，无突出做事
- name_zh: 郭九龄
