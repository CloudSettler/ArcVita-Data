  worth_why: 以校尉随土木被虏的英宗一年，卧波斯帐温足护驾、设计擒叛阉喜宁、促成南归，忠仆全程做事流完整，有成语级名场面（寒夜以胁温帝足、木片密书计擒喜宁），教训为孤忠成事
  era: 明代正统至天顺
  dates_known: true
- name_zh: 朱祁镇（明英宗）
