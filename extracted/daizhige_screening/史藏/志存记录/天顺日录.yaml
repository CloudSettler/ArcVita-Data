category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 李贤
  score: 9
  worth_why: 天顺名臣，屡次决大议——谏止殉葬汪妃、谏止石亨兴兵取宝玺、荐耿九畴止奔竞、辨历年富冤狱；身处石亨曹吉祥谗构之下数度下狱罢黜仍以正道自持，终为英宗腹心，做事流完整可为后世楷模
  era: 明代天顺年间
  dates_known: true
- name_zh: 石亨
  score: 8
  worth_why: 夺门之变首功而恃功专权，招权纳赂、谗陷大臣，其败坏言路终致家族败落的教训深刻
  era: 明代景泰天顺之际
  dates_known: true
- name_zh: 徐有贞
  score: 8
  worth_why: 夺门首谋治水有才，但事事欲出于己、沮增银赈济，谗陷同僚终遭构陷下狱贬斥，才高德薄之鉴
  era: 明代景泰天顺之际
  dates_known: true
- name_zh: 朱祁镇
  score: 7
  worth_why: 陷土木之变而复辟，其间渐辨忠奸、悔用亨辈，恤汪妃母子、留贤用贤，可为君主用人反复之镜
  era: 明代正统至天顺
  dates_known: true
- name_zh: 曹吉祥
  score: 7
  worth_why: 以迎立功预政的权阉，与石亨勾结谗害正人、败坏言路，权阉专恃之警示
  era: 明代景泰天顺之际
  dates_known: true
- name_zh: 王翱
  score: 7
  worth_why: 老成持重，石亨欲夺其位迫其致仕，与李贤互相保全的一段官场进退佳话，廉名素著
  era: 明代天顺年间
  dates_known: true
- name_zh: 年富
  score: 6
  worth_why: 遭石彪诬奏系狱，因李贤持正得白，其革除宿弊的直臣事迹可但简略
  era: 明代天顺初
  dates_known: true
rejections:
- name_zh: 杨瑄
  why_not: 仅以敢言出现在传文中，无完整做事周期
- name_zh: 耿九畴
  why_not: 仅被荐为都御史一句话带过，无做事流
- name_zh: 陈循
  why_not: 仅叙其天顺初被斥去，无事迹
