verdict: has_candidates
candidates:
- name_zh: 庄廷鑨
  score: 7
  worth_why: 窃朱国祯史稿增损刊为《明书》，妄自尊大不直书清年号，酿成清初最大文字狱庄氏史案，满门遭祸，为文人僭史招祸的典型教训
  era: 清初顺治康熙年间
  dates_known: true
- name_zh: 庄允城
  score: 6
  worth_why: 子死后续刻《明书》，夸为不世之业，又挟书入京欲自辩反取祸，父子皆戮，教训深刻
  era: 清初
  dates_known: true
- name_zh: 潘柽章
  score: 8
  worth_why: 藏书千卷著《松陵文献》，欲与吴炎作明史而就庄氏之聘，就义时谈笑自若，真杰士，代表了民间修史之志
  era: 清初
  dates_known: true
- name_zh: 吴炎
  score: 7
  worth_why: 与潘柽章有志共作明史，商之钱谦益见许，因史案遇害，狱中赋诗授命
  era: 清初
  dates_known: true
- name_zh: 张隽
  score: 7
  worth_why: 手录千卷坐卧其中，著《与斯集》；祸发前知非逃于僧舍，丁母忧茕然缟素，就逮谈笑自若而遇害，气节与自省兼备
  era: 清初
  dates_known: true
- name_zh: 庄廷钺
  score: 6
  worth_why: 纨绔少年反复陷于史案，护父赴狱、头触狱门不能言、疾驰通州又恐累亲党自呈投诚，力辨朱峋父子无辜，历劫见人性
  era: 清初
  dates_known: true
- name_zh: 朱国祯
  score: 6
  worth_why: 致政留心史事，著《大事记》刻《史概》，遗稿遭窃而一生心血付东流，为原始起因之人
  era: 明末
  dates_known: true
- name_zh: 朱峋
  score: 5
  worth_why: 以赀雄于一世傲睨令长，因兆名摘充庄案坐罪父子骈戮妻孥徙边，骄横致祸之反面教训
  era: 清初
  dates_known: true
