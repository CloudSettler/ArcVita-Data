category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 张之洞
  score: 8
  worth_why: 清流党中坚转封疆，办洋务图富强以保名教，著《劝学篇》；马江之败后宗旨一变，做事流完整
  era: 晚清
  dates_known: true
- name_zh: 辜鸿铭
  score: 8
  worth_why: 本书作者兼传主视角，译《论语》英文、撰《尊王篇》，张之洞幕府中人，中西论辩名场面多
  era: 晚清民国
  dates_known: true
- name_zh: 曾国藩
  score: 9
  worth_why: 平定太平天国握兵权而不排满、功成自守；定御外侮大计（倡办制造厂船政局），功过皆可作后人镜鉴
  era: 晚清
  dates_known: true
- name_zh: 李鸿章
  score: 9
  worth_why: 继曾国藩为相，办善后御外侮，仿曹参遵萧何约束而甲午大败；创同文馆育洋务人材有远略，教训深刻
  era: 晚清
  dates_known: true
- name_zh: 文祥
  score: 7
  worth_why: 宰相而躬迎同文馆学子，温恭风度；创设同文馆培洋务人材，是销外患的关键制度决策
  era: 晚清
  dates_known: true
- name_zh: 彭玉麟
  score: 7
  worth_why: 中法人战争以钦差大臣守虎门，感遇恩赏涕泣，节操风采动人，气节而后功业
  era: 晚清
  dates_known: true
- name_zh: 张佩纶
  score: 6
  worth_why: 清流书生好大言而马江弃军遁，后入赘合肥相府为世所诟，书生误国的典型教训
  era: 晚清
  dates_known: true
- name_zh: 蔡锡勇
  score: 6
  worth_why: 幼入同文馆肄英文，后为张之洞幕中办洋务要角，洋务人材成长路径可考
  era: 晚清
  dates_known: false
- name_zh: 郭嵩焘
  score: 6
  worth_why: 出使西洋见各国风俗齐整，归而言「孔孟欺我也」，开眼看世界的 controversial 名场面
  era: 晚清
  dates_known: true
- name_zh: 康有为
  score: 6
  worth_why: 误读张之洞宗旨倡言变法行新政，酿戊戌庚子之祸，改革悲剧教训
  era: 晚清
  dates_known: true
rejections:
- name_zh: 李惟仁
  why_not: 仅借以评曾国藩，无自身做事周期
- name_zh: 张佩纶书中之贾生比拟诸位清流党人
  why_not: 泛论群像无具体事迹文本
- name_zh: 辜鸿铭所记伊藤博文
  why_not: 仅一段问答轶事，无完整做事流
- name_zh: 董仲舒书中被提及
  why_not: 仅作为守旧党例证一笔带过
