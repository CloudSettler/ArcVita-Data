candidates:
- name_zh: 胡林翼
  score: 10
  worth_why: 荐多隆阿统一号令破太湖发捻、坚持不撤安庆之围为东南转机；创厘金对放理财法；严拒徇私用人；晚年专以荐贤为务，做事流完整且多决策名场面
  era: 晚清咸同之际
  dates_known: true
- name_zh: 曾国藩
  score: 9
  worth_why: 坚持安庆围城谋定后动；蔬食自甘律己；荐贤有量如为左留叶兆兰余地；遣湘用淮的战略转折
  era: 晚清咸同之际
  dates_known: true
- name_zh: 左宗棠
  score: 9
  worth_why: 幕府专决起家；注重衢州谋之于豫持之以恒；经略西边收全功；生活俭苦名词甚多
  era: 晚清咸同之际
  dates_known: true
- name_zh: 多隆阿
  score: 8
  worth_why: 被荐为总统四面经营大破太湖发捻、迫安庆桐城，皖事大定；然功高遭忌憾刺骨，可供借鉴
  era: 晚清咸同之际
  dates_known: true
- name_zh: 刘松山
  score: 8
  worth_why: 老湘营统将，从剿捻入甘陕剿回，战殁金积堡，从侄锦棠代竟收西边全功，湘军三十余年终始人物
  era: 晚清咸同之际
  dates_known: true
- name_zh: 王錱
  score: 7
  worth_why: 自成一队创老湘营根基，著《练勇刍言》与戚继光《新书》表里，临阵先日席地授图部置之法为名场面
  era: 晚清咸丰
  dates_known: true
- name_zh: 金国琛
  score: 6
  worth_why: 以吴人千金投营入湘军而超擢总理营务，萆山出兵收夹击之效，吴湘门户之见下难得案例，后闹饷被劾起伏可鉴
  era: 晚清咸同之际
  dates_known: false
- name_zh: 黄冕
  score: 6
  worth_why: 募吉字营肇端竟成曾国荃五万人之基，创东征局盐米互市济江南之饷功巨而以贪横弹章终，功过转折完整
  era: 晚清咸同之际
  dates_known: false
- name_zh: 刘章侯
  score: 6
  worth_why: 抵制督抚滥委缺而密揭请易员，事孰后安然处变；七十岁拒李鸿章厚荐闲曹，士节可法
  era: 晚清咸同之际
  dates_known: false
