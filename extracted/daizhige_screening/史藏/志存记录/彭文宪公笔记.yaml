source: 史藏/志存记录/彭文宪公笔记.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 彭时
  score: 8
  worth_why: 从状元到入阁历经土木之变、北京保卫战、夺门之变，多年辅政；拒绝苟且进身、力持礼制论争，人格与做事周期完整
  era: 明代正统至成化
  dates_known: true
- name_zh: 李时勉
  score: 8
  worth_why: 任国子监祭酒治理太学，半夜提铃催读、被枷而神色自若并先校定试卷，门生三千上疏请赦，师道典范
  era: 明代正统年间
  dates_known: true
- name_zh: 于谦
  score: 9
  worth_why: 土木之变后力主郕王即位，北京保卫战督战却敌；终被夺门之变冤杀，成败教训俱全
  era: 明代景泰前后
  dates_known: true
- name_zh: 王竑
  score: 7
  worth_why: 午门之变当众捽马顺首斥奸党，激于义愤，锦衣卫之祸由其先发
  era: 明代正统末
  dates_known: true
- name_zh: 陈循
  score: 7
  worth_why: 内阁辅臣，北京保卫战中请调各省精骑入卫并榜谕悬赏以疑也先，卒致其遁
  era: 明代景泰年间
  dates_known: true
rejections:
- name_zh: 王直
  why_not: 传文仅列名于伏阙请立之列，无做事周期
- name_zh: 也先
  why_not: 君主级敌酋坐标人物，本卷无其完整做事记录
- name_zh: 石亨
  why_not: 夺门之变得志旋败，且已有曹吉祥同案，事迹简略
- name_zh: 曹吉祥
  why_not: 仅见密谋迎立一节，无完整做事周期
- name_zh: 徐有贞
  why_not: 本卷仅记其入阁旋黜，事迹零碎
