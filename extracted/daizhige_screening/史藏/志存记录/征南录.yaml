candidates:
- name_zh: 孙沔
  score: 9
  worth_why: 平侬智高之乱的全景决策者：料敌三策、备长刀大斧制蛮牌捻枪之长、虚声安湖南、宾象不战自全、归仁铺破贼、释胁从活人数千、留邕善后；又能身下狄青协同无二令，事成求致仕不邀赏，做事流完整且具教训
  era: 北宋
  dates_known: true
- name_zh: 狄青
  score: 8
  worth_why: 以枢密副使为宣抚使南征，昆仑关出奇兵、归仁铺大破侬智高、夜下令止惊呼、赏军定众，夜袭昆仑关为名场面
  era: 北宋
  dates_known: true
- name_zh: 侬智高
  score: 7
  worth_why: 广源州蛮起兵连破九州、围广州，败后走大理被斩首献；其反叛缘起（求互市不得）与覆灭过程完整，可作教训型人物
  era: 北宋
  dates_known: true
