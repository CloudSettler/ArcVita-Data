  score: 9
  worth_why: 尸谏请预定大统，自饮毒于蓟州留遗疏，死谏名场面极完整，忠诚与直谏的典范教训
  era: 晚清同治光绪年间
  dates_known: true
- name_zh: 奕譞
  score: 7
  worth_why: 长子被立为帝时惊惧伏地晕绝，后愤郁成疾上疏乞骸骨被拒，识进退而终不得退的警世样本
  era: 晚清同治光绪年间
  dates_known: true
- name_zh: 慈禧太后
  score: 6
  worth_why: 立幼君以专政权谋操作的核心推手，择立光绪驱使醇王；君后虽低优先但其决策是德宗承统事件的枢纽
  era: 晚清同治光绪年间
  dates_known: true
- name_zh: 广安
  score: 5
  worth_why: 奏请颁立铁券以定大统归属，触及赵普背杜太后之史鉴，遭申饬；谏言有识但事迹短促
  era: 晚清同治初年
  dates_known: false
- name_zh: 嘉顺皇后
  score: 5
  worth_why: 失爱于慈禧、夫亡被责终仰药殉节，悲剧警示样本但仅一句话略
  era: 晚清同治年间
  dates_known: false
