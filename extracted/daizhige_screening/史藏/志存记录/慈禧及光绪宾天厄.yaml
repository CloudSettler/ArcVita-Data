candidates:
- name_zh: 慈禧太后
  score: 8
  worth_why: 庚子立大阿哥误判后幡然转向新政、宣布九年立宪、临终定溥仪继统，晚年做事周期完整，且为晚清一切枢纽决策之所在；其悔恨与补救（赦王照、追荣吴可读）有典型教训意义
  era: 晚清
  dates_known: true
- name_zh: 光绪帝
  score: 6
  worth_why: 戊戌后长期被幽禁，本篇所记为病笃与宾天疑案；与慈禧相继而崩为中国近代最大悬案之一，但做事流在此文献中不完整，仅余傀儡处境与赦免王照等零星决策
  era: 晚清
  dates_known: true
rejections:
