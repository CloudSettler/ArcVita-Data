source: 史藏/志存记录/戴东原先生轶事.md
category: 史藏/志存记录
person:
  qid: guji-戴震
  name_zh: 戴震
  names:
    zh: 戴震
    en: Dai Zhen
  lifespan:
    birth:
      date: 1724-01-19
      precision: day
      is_circa: true
      raw: 清雍正元年
    death:
      date: 1777-07-02
      precision: day
      is_circa: true
      raw: 清乾隆四十二年五月
  birth_date: 1724-01-19
  death_date: 1777-07-02
  era: 清代乾隆年间
  reign_ref: 乾隆
  archetype: 考据学宗师与哲学家
  dilemmas:
  - 求真考据与科举功名相冲突——屡会试不第而学问反重于当世
  - 为保祖墓讼官避祸——被县令构陷之危反成就入京结纳名流之机
  lesson: 由训诂以求义理，实事求是方能贯通古今；真学问不待科名而成，至死犹执笔治学
  summary_first_person: 我以训诂考证为工具，欲明圣贤之道必先达其辞识其字，虽屡试不第，终以实学特召入四库馆校《水经注》《九章算术》，又为大旱之乡制螺旋车自转车以利农田，至病没犹撰《声类表》不辍。
endeavors:
- id: guji-戴震-endeavor-1
  name_zh: 治学著述与四库馆校书
  phases:
  - key: brewing
    name_zh: 幼年问难渐治训诂考证之学
    labels:
      zh: 训诂考据
    start_date: 1733
  - key: breakthrough
    name_zh: 休地大旱闭户著《屈原赋注》十二卷
    labels:
      zh: 代表作诞生
    start_date: 1752
    highlight_event_id: guji-戴震-event-quyuanfu
  - key: climax
    name_zh: 以举人特召充四库馆纂修官
    labels:
      zh: 四库校书
    start_date: 1773
    highlight_event_id: guji-戴震-event-sikugu
  - key: closure
    name_zh: 病没京师病亟犹撰《声类表》
    labels:
      zh: 好学至死
    start_date: 1777
    highlight_event_id: guji-戴震-event-death
  decisions:
  - date: 1756
    title_zh: 避讼祸日行二百里徒步入京
    rationale: 族豪侵占祖墓而县令受贿将文致其罪，徒步赴京师申辩，反因名流争相结纳而声名鹊起
  - date: 1773
    title_zh: 以举人特召充四库馆纂修官
    rationale: 屡会试不第然名重当世，奉旨校《水经注》《九章算术》诸书，以实学终为朝廷所重
- id: guji-戴震-endeavor-2
  name_zh: 制水车以利农灌
  phases:
  - key: brewing
    name_zh: 休地大旱斗米千钱旧法戽水劳多功少
    labels:
      zh: 缘起
    start_date: 1752
  - key: breakthrough
    name_zh: 变通古法制螺旋车
    labels:
      zh: 发明
    start_date: 1752
    highlight_event_id: guji-戴震-event-spiralcart
  - key: climax
    name_zh: 制自转车资流水之力日夜灌溉
    labels:
      zh: 应用成效
    start_date: 1752
    highlight_event_id: guji-戴震-event-zizhuanche
  - key: closure
    name_zh: 西北乡沿用其法永绝亢旱之患各处仿行
    labels:
      zh: 遗惠乡里
    start_date: 1752
  decisions:
  - date: 1752
    title_zh: 弃人力戽水旧法而自制水车
    rationale: 山乡吸水灌田所需劳力多而无补于大旱，故变通古法以求用力少而呈功倍
events:
- id: guji-戴震-event-birth
  date: 1724-01-19
  year_of: 1724
  title_zh: 戴震生于徽州休宁隆阜
- id: guji-戴震-event-askmaster
  date: 1733
  year_of: 1733
  title_zh: 十岁问塾师朱文公何以知经为孔子之言曾子述之，师无以应，遂渐治训诂考证之学
- id: guji-戴震-event-xiangrennuo
  date: 1752
  year_of: 1752
  title_zh: 应试作乡人傩题旁征博引，面质宗师历举经典如数家珍获大激赏
- id: guji-戴震-event-quyuanfu
  date: 1752
  year_of: 1752
  title_zh: 大旱家贫日以面果腹，闭户著《屈原赋注》十二卷
- id: guji-戴震-event-spiralcart
  date: 1752
  year_of: 1752
  title_zh: 变通古法制螺旋车，用力少而呈功倍，与西式吸水机相合
- id: guji-戴震-event-zizhuanche
  date: 1752
  year_of: 1752
  title_zh: 制自转车资流水运水高二三丈，不需人畜之劳，灌溉日夜不息，著《螺旋车记》《自转车记》
- id: guji-戴震-event-gongjing
  date: 1756
  year_of: 1756
  title_zh: 为保祖墓讼官遭构陷，日行二百里徒步走京师，名流争相结纳
- id: guji-戴震-event-wangniansun
  date: 1756
  year_of: 1756
  title_zh: 大宗伯王文肃延课其子王念孙，念孙得以成名
- id: guji-戴震-event-juzhen
  date: 1762
  year_of: 1762
  title_zh: 四十岁举于乡，此后屡会试未第
- id: guji-戴震-event-sikugu
  date: 1773
  year_of: 1773
  title_zh: 五十一岁以举人特召充四库馆纂修官，校《水经注》《九章算术》，乾隆帝赐诗卷首命武英殿聚珍板刊行
- id: guji-戴震-event-dianshi
  date: 1775
  year_of: 1775
  title_zh: 会试仍不第，奉命一体殿试，授翰林院庶吉士
- id: guji-戴震-event-death
  date: 1777-07-02
  year_of: 1777
  title_zh: 以足疾困罢，是年五月病没京师，病亟犹撰《声类表》并点定《段氏六书》《音韵表》
