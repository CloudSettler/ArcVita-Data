  worth_why: 借联庄保路之名创天地会聚众十余万、攻陷彰化自称大元帅；有完整做事流（起于夏汝贤勒索之怨、终至兵败），同治之乱三年震动全台
  era: 清咸丰同治年间
  dates_known: true
- name_zh: 蔡廷元
  score: 6
  worth_why: 感知遇之恩自募勇士欲救孔昭慈、城陷后大哭誓师破家募勇报仇；忠义做事流完整
  era: 清同治年间
  dates_known: false
- name_zh: 秋曰觐
  score: 6
  worth_why: 捕盗以威武闻名，欲行擒王散党之计锐身出战，兵败陷淖遇害；忠仆颜大汉幼仆小黄殉主为名场面，教训在轻敌妄出
  era: 清同治年间
  dates_known: false
- name_zh: 孔昭慈
  score: 5
  worth_why: 用人昏庸、全师尽出无后顾、拒不纳谏致彰化城陷仰药死；典型反面教训型人物
  era: 清同治年间
  dates_known: false
- name_zh: 林日晟
  score: 5
  worth_why: 外号戆虎晟，因私隙于阵前反戈致官兵大败、彰化陷落；一念之私改写战局的教训点
  era: 清同治年间
  dates_known: false
