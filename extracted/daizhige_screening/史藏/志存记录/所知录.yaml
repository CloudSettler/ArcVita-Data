- name_zh: 黄道周
  score: 9
  worth_why: 自请出关以忠义旬月募众万余、亲书诰身奖语、兵败被执死节；隆武朝唯一破局者，做事流完整且名场面突出
  era: 明末南明隆武朝
  dates_known: true
- name_zh: 朱聿键
  score: 8
  worth_why: 高墙囚徒逆袭称帝、布衣素食彻夜批章、力图亲征而受制郑氏、终殉国；虽为君主但悲剧性做事周期完整
  era: 南明隆武帝
  dates_known: true
- name_zh: 郑芝龙
  score: 8
  worth_why: 海盗起家拥立隆武、把持朝政阻挠出关、借饷扰民、终降清而死于仙霞岭；权臣误国教训典型
  era: 明末清初
  dates_known: true
- name_zh: 郑成功
  score: 9
  worth_why: 本文献载隆武帝赐国姓改名成功之起点；后成抗清复台大业，做事流与名场面俱备
  era: 明末清初
  dates_known: true
- name_zh: 钱澄之
  score: 7
  worth_why: 书生蒙钩党祸、匿复壁、随行在亲历闽粤、藏稿败絮中存史；遗民史家的完整记录者人生
  era: 明末清初
  dates_known: true
- name_zh: 何楷
  score: 6
  worth_why: 劾郑芝龙郊天不陪祭无人臣礼、被令掌都察院、归途遭截耳而死；风骨可录但事迹偏短
  era: 明末南明隆武朝
  dates_known: true
