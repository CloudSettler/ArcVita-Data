source: 史藏/志存记录/所闻录.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 汤斌
  score: 9
  worth_why: 抚苏毁五通祠破淫祀、直书抗节诸臣入国史不惧两劾、力谏免毁民屋修御道、终身布蔬治家极廉，清廉理政做事流完整，足为后世清官典范
  era: 清初顺治康熙间
  dates_known: true
- name_zh: 葛云飞
  score: 8
  worth_why: 鸦片战争中率孤军抗英于定海，力战三昼夜殉国东岳宫；其妾夜率残卒夺尸归葬，忠烈场面极具名场面潜力
  era: 清道光间
  dates_known: true
- name_zh: 洪承畴
  score: 7
  worth_why: 松山殉难传说与降清真相、与史可法孙兆奎的对答场面，是贰臣教训型人物，警示价值突出
  era: 明末清初
  dates_known: true
- name_zh: 松筠
  score: 7
  worth_why: 满臣中抗直不阿权势之鹤，屡因直言罢黜戍边而复起，升沉如串戏俳优，敢言教训可风
  era: 清乾隆至道光间
  dates_known: true
- name_zh: 刘墉
  score: 6
  worth_why: 着敝衣当街跪拜使和珅泥污满身莫可奈何，智挫权奸一段名场面，然做事流仅此一事
  era: 清乾隆嘉庆间
  dates_known: true
- name_zh: 洪秀全
  score: 6
  worth_why: 定都金陵后与外轮交涉通商护侨之外交片段可考，然本篇仅存事略节文，做事流不完整
  era: 清咸丰间
  dates_known: true
- name_zh: 孙兆奎
  score: 5
  worth_why: 以一句「松山殉难故督师洪公果死耶」反诘洪承畴使其大惭，一句名场面后即遇害，事迹过简
  era: 明末清初
  dates_known: false
- name_zh: 袁枚
  score: 5
  worth_why: 翰苑遭孔林遗裔僻典之难折其锋芒，可作文人傲物之鉴，然传文单薄
  era: 清乾隆间
  dates_known: true
rejections:
- name_zh: 和珅
  why_not: 传文仅写其被刘墉当众折辱一事，本人无完整做事周期
- name_zh: 孔林遗裔
  why_not: 匿名人物，仅以僻典难倒翰苑一事，无姓名无完整履历
- name_zh: 乾隆
  why_not: 君主仅作时间坐标，被武臣讽喻后三日不快，无突出做事
- name_zh: 毛文龙
  why_not: 传文题为毛文龙实写漳州围城中士人饿殍惨状，人物本体无做事流
- name_zh: 葛云飞之妾
  why_not: 夜夺夫尸一事可歌，然无姓名无其他事迹，宜附于葛云飞条下
