verdict: has_candidates
candidates:
- name_zh: 马文升
  score: 10
  worth_why: 抚安辽东记作者本人，做事流极完整：整饬边备、抚定建州海西、识破汪直冒功、遭谗下狱谪戍后复起巡抚辽东，国计私忿之辨足为臣道典范；另有西征石城、兴复哈密二记可互证
  era: 明代成化至弘治
  dates_known: true
- name_zh: 汪直
  score: 8
  worth_why: 权宦典型，年少喜功、辽东冒功、构陷马文升致其下狱谪戍，做事流完整且为宦官干政教训名场面
  era: 明成化年间
  dates_known: true
- name_zh: 董山
  score: 7
  worth_why: 建州左卫都督枭雄桀黠，拥众入寇被诱降后诛于广宁，成化犁庭关键人物，其死引发建州三卫连环复仇
  era: 明成化初年
  dates_known: true
- name_zh: 也先
  score: 8
  worth_why: 瓦剌太师，俘明英宗、犯北京城，正统十四年多路犯边致辽东残破，为本文边患总根源；土木之变为明代头号危机名场面
  era: 明正统景泰年间
  dates_known: true
- name_zh: 陈钺
  score: 6
  worth_why: 辽东巡抚冒功激变典型：阻散赤哈入关、夜袭无辜寨落捶死也僧格、谎报捣巢之捷，反面教训鲜明但本传线索偏碎片
  era: 明成化年间
  dates_known: true
- name_zh: 散赤哈
  score: 6
  worth_why: 海西兀者前卫都指挥，因受辱折箭誓恨引发边患连锁反应，小人物触发大事件的样本，但可考事迹集中于一段
  era: 明成化年间
  dates_known: false
