source: 史藏/志存记录/招捕总录.md
category: 史藏/志存记录
verdict: no_value
skip_reason: 招捕总录为元代西南蛮夷招降捕叛的行政记录，通篇是零散土酋叛降事件与生僻种名、地名、人名罗列；诸酋（韦郎达、雄挫、阿邦龙少等）虽有起兵—征讨—降败的片段，但无成语、代表作、制度、发明级名场面，不为后人提供范式或镜鉴，生卒年不可考，仅作编年坐标，不构成可录入的完整做事周期
rejections:
- name_zh: 韦郎达
  why_not: 花角蛮酋长，至元间拒附僭号称帝，大德元年为参政忽速刺攻破十二重寨，延祐七年复起兵劫寨，然仅为边地叛酋，事迹不见于史册主流，无做事流可考亦无启后世之处
- name_zh: 雄挫
  why_not: 永宁路阿永蛮酋，七年春结党作乱九战而败，八年赴阙原罪仍充土官，纯属招捕对象，做事周期简略且无传世意义
- name_zh: 忽速刺
  why_not: 云南省参政，攻破花角蛮有战功记载，然仅此一役数行文字，生平仕履全不可考
- name_zh: 阿邦龙少
  why_not: 罗雄州军火主，九年叛，官军连战获之，传文仅数十字
- name_zh: 蛇节
  why_not: 仅见于妇人名列举及一句匿党记载，无事迹文本
- name_zh: 沈法昔
  why_not: 安宁州土官，招引花角蛮围杀掠夺虎符，旋即投降，无完整做事流
- name_zh: 阿禾必绍
  why_not: 至元十三年降附之一行记录，无任何做事内容
- name_zh: 刺俄
  why_not: 渠州知州杀兄袭职一桩土司内讧，有叙事但属家族仇杀案例，无成事价值亦无典型教训，且人名世系破碎不可考
