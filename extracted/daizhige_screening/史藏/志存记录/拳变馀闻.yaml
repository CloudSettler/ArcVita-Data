candidates:
- name_zh: 张德成
  score: 8
  worth_why: 从操舟船夫到天下第一坛主，骗术成事获头品顶戴黄马褂，城陷挟资遁逃终被村民斩杀，完整展示装神弄鬼成事与覆灭的全周期，是民间迷信兴衰的典型标本
  era: 清末庚子年（1900）
  dates_known: false
- name_zh: 曹福田
  score: 7
  worth_why: 游勇鸦片客乘乱成天津拳匪魁首，伏地叩首称毁洋楼的表演收服民心，又拒绝滥杀洋货商民，昏与伪中偶存一线分寸，人物性格立体
  era: 清末庚子年（1900）
  dates_known: false
- name_zh: 黄莲圣母
  score: 7
  worth_why: 红灯照领袖，直督裕禄朝服九拜相迎，万众礼拜，城陷后被缚献都统衙门处死或载游欧洲，神秘女巫的兴亡极具名场面潜力
  era: 清末庚子年（1900）
  dates_known: false
- name_zh: 裕禄
  score: 6
  worth_why: 直隶总督先纵拳匪后朝服九拜迎神妪，奏保匪首报战功，酿成天津巨祸，是昏聩大员助推国变的教训样本，惟本篇未及其结局需补史料
  era: 清末
  dates_known: true
- name_zh: 罗惇曧
  score: 6
  worth_why: 亲历庚子京津之乱，连著庚子国变记与拳变余闻保存信史，以笔为业记录国变，做事流可考但属文人著述型
  era: 清末民初
  dates_known: true
