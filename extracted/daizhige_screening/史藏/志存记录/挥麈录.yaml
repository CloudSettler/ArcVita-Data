candidates:
- name_zh: 宋高宗
  score: 6
  worth_why: 卷一载其用人纳言有明见——抑刘大中除言路恐累无辜、却侯彭老进献、拒大食珠玉以养战士、投珍珠于汴水慕太古息盗，有可考决策片段可为帝王节俭纳谏之镜，但缺完整做事周期
  era: 南宋
  dates_known: true
- name_zh: 王明清
  score: 5
  worth_why: 挥麈录作者，南宋著名笔记家，考订诞节、祠庙配享等典章制度源流，治学有法，但本卷仅见其著述成果而非做事流
  era: 南宋
  dates_known: true
- name_zh: 宋仁宗
  score: 5
  worth_why: 不以玉带为宝、以人安为宝的名言有场面潜力，可作君主戒奢爱民之教训，然本卷仅一条轶事，事迹太简
  era: 北宋
  dates_known: true
