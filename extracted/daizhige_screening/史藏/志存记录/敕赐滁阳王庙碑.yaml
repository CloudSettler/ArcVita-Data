- name_zh: 郭子兴
  score: 8
  worth_why: 散家财结宾客拔濠梁起兵；识朱元璋于微时妻以养女授以兵柄；狱难获救；知人之鉴肇帝王之业而诸子皆败亡，成败对照极具教训价值
  era: 元末明初
  dates_known: true
- name_zh: 朱元璋
  score: 8
