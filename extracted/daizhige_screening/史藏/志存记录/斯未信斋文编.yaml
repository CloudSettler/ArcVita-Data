verdict: has_candidates
candidates:
- name_zh: 徐宗干
  score: 9
  worth_why: 书之作者，号树人先生。一生定乱弭乱做事流完整：山左捕泰安掖刀会匪、劝散高唐一炷香教、济宁彭河屯民案宽严得宜、保宁单骑入山平采木围官、漳洲径入盗村手书谕众；巡台湾值漳泉械斗，三次联军荡平王涌、洪纪、林恭之乱，裹一日粮即日克凤山擒林恭；严拒英酋入城、四门列械迫其扬帆而去；开藩两浙筹饷筹防，后抚十闽训吏安民。兼具治匪、御外、理财、安民多面事迹，可为循吏平乱典范
  era: 清道光咸丰同治年间
  dates_known: true
rejections:
- name_zh: 桂超万
  why_not: 仅作序推许徐宗干，自述生平事迹过于简略
- name_zh: 史密
  why_not: 撤任同知，军兴后自备壮勇襄办局务，无独立完整做事周期
- name_zh: 王春岩
  why_not: 制军（总督），仅为书信受文者与上级坐标，无事迹文本
- name_zh: 裕铎
  why_not: 台湾知府，守城筹饷皆附于徐宗干之事，无独立做事流
- name_zh: 郑元杰
  why_not: 凤山知县，仅禀报夷船寄椗一事，事迹零星
- name_zh: 林恭
  why_not: 乱首，陷凤山围嘉义旋即被擒，败亡太快无完整做事流
- name_zh: 恽次山
  why_not: 仅见于书信抬头，无事迹
