  worth_why: 全书即其自述做事流，州县起家历官四川、浙江、福建道员，治理漳郡、监试闽闱、处置英夷犯顺，从政数十年有缘起、阶段、结果，兼有日记体的为官自省，可为清代中层官员治理范本
  era: 清道光咸丰同治年间
  dates_known: true
- name_zh: 陈启泰
