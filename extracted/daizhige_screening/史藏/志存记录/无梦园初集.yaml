- name_zh: 陈仁锡
  score: 7
  worth_why: 天启探花直讲经筵，忤魏忠贤除名策蹇归园，崇祯再出山逾年即归；答咨访通论九边盐法利弊，自编无梦园初集藏拙刊行，做事周期完整且可为经世之训
  era: 明末万历至崇祯年间
  dates_known: true
