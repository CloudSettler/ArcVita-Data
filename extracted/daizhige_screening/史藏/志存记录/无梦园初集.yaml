  archetype: 翰林直臣·经世学者
  dilemmas:
  - 直讲经筵却不附权阉魏忠贤，宁受除名策蹇而归园
  - 自念藏拙不愿遽出制诰读史之文，又难却海内友人再三觅刻之请
  lesson: 学贵经世：藏于园者可自适，切于边者必济用；忤阉守直，虽踬犹荣
  summary_first_person: 余长洲人也，年四十读书焦山，有客请古文辞行世，余迟之十年；承匮中秘，登第直讲，忤权阉除名策蹇，崇祯再出山，不逾年即归，莳花种竹之余略简旧帙成无梦园初集，又尝答咨访，历数九边盐法沿革之弊，冀疏边饷。
