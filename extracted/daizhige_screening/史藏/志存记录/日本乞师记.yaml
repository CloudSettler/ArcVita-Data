verdict: has_candidates
candidates:
- name_zh: 周鹤芝
  score: 8
  worth_why: 海盗出身受抚为将，四度遣使日本乞师，与萨摩岛主结父子之约，做事故周期完整，成败皆可为鉴
  era: 明末清初
  dates_known: true
- name_zh: 冯京第
  score: 7
  worth_why: 效申包胥故事舟中朝服拜哭、血书致日本行部官员，名场面鲜明，忠烈可传
  era: 明末清初
  dates_known: true
- name_zh: 张名振
  score: 7
  worth_why: 定西侯联袂乞师、海上抗清，与阮进上疏监国请援，南明海上军事主线人物
  era: 明末清初
  dates_known: true
- name_zh: 黄斌卿
  score: 6
  worth_why: 以余煌一言止乞师之使，后纵弟黄孝卿留恋长崎官妓误国事，教训型人物
  era: 明末清初
  dates_known: true
- name_zh: 湛微
  score: 5
  worth_why: 狡僧伪署金狮子尊者遭逐，复以普陀藏经诱使乞师致全盘失败，警示样本但事迹单一
  era: 明末清初
  dates_known: false
- name_zh: 阮美
  score: 5
  worth_why: 遭黑风漂至高丽界，载经而返，历事可述但篇幅简略
  era: 明末清初
  dates_known: false
rejections:
- name_zh: 黄孝卿
  why_not: 沉溺长崎官妓误事，仅一反面插曲无完整做事周期
- name_zh: 林钥舞
  why_not: 仅受命出使旋被止行，无独立事迹
- name_zh: 林皋
  why_not: 随安昌王乞师不得要领，一笔带过
- name_zh: 阮进
  why_not: 仅请兵不允与上疏共列，无独立完整事迹
- name_zh: 安昌王
  why_not: 宗室随行角色，无做事文本
- name_zh: 余煌
  why_not: 仅书信一语作时间坐标
- name_zh: 如定
  why_not: 南京寺住持背景人物，无做事周期
