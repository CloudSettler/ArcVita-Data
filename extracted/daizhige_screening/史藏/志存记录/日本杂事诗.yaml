candidates:
- name_zh: 黄遵宪
  score: 9
  worth_why: 晚清首任驻日使馆参赞，以诗注互证写成《日本杂事诗》并草《日本国志》，亲历明治维新现场；自序自陈从疑日到服日的认知转变，是近代中国睁眼看世界、以外部经验推动变法的标志性做事流；名场面为光绪十六年英伦使馆自序中悔少作、以志吾过的自我批判
  era: 晚清·光绪年间
  dates_known: true
rejections:
