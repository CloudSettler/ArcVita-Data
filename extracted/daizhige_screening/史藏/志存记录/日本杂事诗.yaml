  why_not: 传文仅记其裂诏毁冠、拒受明封一事，属插叙片段，无完整做事周期
- name_zh: 神功皇后
  why_not: 文中仅作神话式西征新罗轶闻，神道设教之传说，非可考做事流
- name_zh: 伊达宗城
