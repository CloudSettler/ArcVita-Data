source: 史藏/志存记录/日闻录.md
category: 史藏/志存记录
verdict: no_value
skip_reason: 《日闻录》为元人李翀所撰名物制度考证札记，考辨符节、铺首、鱼袋、度量衡、白屋、月魄等名物源流，通篇无完整人物做事周期；所涉苏武、暴胜之、严挺之、萧炅、李云、主父偃、沈括、张衡等仅一二句掌故引证，无缘起、阶段、决定、结果可考，均不足录入成事儿时间轴
rejections:
- name_zh: 苏武
  why_not: 仅借其持节牧羊考释节制形制，已有库且无新做事流
- name_zh: 暴胜之
  why_not: 仅为汉武遣使逐捕盗贼一句，无做事周期
- name_zh: 严挺之
  why_not: 仅讥萧炅伏猎侍郎一语，事迹零星
- name_zh: 萧炅
  why_not: 仅读误伏腊一轶事，无做事流
- name_zh: 李云
  why_not: 仅露布上书一句考名物，无做事周期
- name_zh: 沈括
  why_not: 仅引其月如银圜之说考月魄，非做事传记
- name_zh: 张衡
  why_not: 仅引暗虚说一句，已在库且无新事迹
- name_zh: 李翀
  why_not: 作者仅考据名物，生平做事周期不可考
