candidates:
- name_zh: 陈矩
  score: 7
  worth_why: 以司礼监掌东厂而崇宽大，宫婢误出事件处置有度且惩缉事官旗以立威，终成道路无警守、狗不夜吠的太平之治，是宦官贤者的完整做事样本
  era: 明万历
  dates_known: true
- name_zh: 朱由检
  score: 7
  worth_why: 振举纪纲颇济以猛，戊寅御敌失律一次处决文武内臣三十二人以结御敌之局，传德音肆赦戴盆之士，望小民担负而损市税十分之七，甲申殉国为一代烈主，君主中少见的决策密集期
  era: 明崇祯
  dates_known: true
- name_zh: 周氏
  score: 6
  worth_why: 出布衣售医之家而正位中宫，选婚缘起、张皇后昭妃赞襄、恭俭起关雎之化，甲申之变遂为一代烈母，起于微贱而终于殉国，做事流首尾俱全
  era: 明崇祯
  dates_known: true
- name_zh: 田弘遇
  score: 5
  worth_why: 恃贵溢而园亭声伎倾甲都下，借进香普陀之名道经吴门渔猎声妓，竟以此失欢皇上，皇贵妃薨而家声稍稍戢然，为外戚骄纵致衰之教训
  era: 明崇祯
  dates_known: false
