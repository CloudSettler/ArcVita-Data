candidates:
- name_zh: 朱鸿瞻
  score: 6
  worth_why: 瑞安士人亲历明末清初八百年未有之变局，逐段记录军民、鼎革、山寇、海寇、闽藩五次大变，两度上书当路献安插迁民、平寇之策而不获用，是乱世著史存真的典型
  era: 明末清初
  dates_known: false
- name_zh: 万代尚
  score: 6
  worth_why: 海寇压境、瑞城守将开城降后，总镇议发兵屠洗瑞安，万代尚据顾敬山告变之力白百姓无罪，使一城得免屠戮，是乱世止杀护民的关键决策
  era: 顺治年间
  dates_known: false
- name_zh: 张岳
  score: 5
  worth_why: 知瑞安县，廉而有威、不畏强御，禁强买遏攘夺、招商贩米厚偿其值，于大饥之年安定一方
  era: 弘光年间
  dates_known: false
- name_zh: 顾敬山
  score: 5
  worth_why: 绍兴寓居瑞安者，率数十人间道赴郡告主将卖降状，为万代尚力白民罪提供依据，救全城性命
  era: 顺治年间
  dates_known: false
- name_zh: 马鉴
  score: 5
  worth_why: 金华总镇，庚寅冬从处州山间出奇兵，先擒渠首、纳降用为向导，犁庭扫穴平定四年山寇之乱
  era: 顺治七年前后
  dates_known: false
- name_zh: 邹钦尧
  score: 5
  worth_why: 瑞安生员，清师南下后赴江心蹈水死节，是鼎革之际士人殉节的代表
  era: 隆武二年后
  dates_known: false
- name_zh: 何兆龙
  score: 4
  worth_why: 山寇之变后期诸寇共主号大师，连踞卫所、郡邑道梗三年，其兴亡可为乱世聚散之鉴
  era: 顺治年间
  dates_known: false
- name_zh: 谷稷
  score: 4
  worth_why: 以讪语榜府治前，因流言阻饷被斩而引发民变劫衙逐官，是弘光朝人心溃散的标志性事件
  era: 弘光元年
  dates_known: false
- name_zh: 黄小吴
  score: 4
  worth_why: 自号均平王号召饥民，劫掠势如燎原，反映大饥之年民变的起灭轨迹
  era: 隆武二年后
  dates_known: false
- name_zh: 陈世亨
  score: 4
  worth_why: 因清丁科索不堪假起义袭城，三十二都民变直接触发瑞安四年山寇涂炭
  era: 顺治四年
  dates_known: false
