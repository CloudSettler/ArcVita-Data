candidates:
- name_zh: 袁崇焕
  score: 9
  worth_why: 宁远御后金数立边功；杀毛文龙、勤王下狱、凌迟冤死，忠而被谤的完整悲剧做事流
  era: 明末
  dates_known: true
- name_zh: 孙承宗
  score: 9
  worth_why: 督师辽东、再镇辽东复永平滦州；铁面剑眉深算老谋，晚年殉国，功败于党争
  era: 明末
  dates_known: true
- name_zh: 崇祯帝
  score: 8
  worth_why: 除魏忠贤、加三饷、误杀袁崇焕、历相五十人而煤山自缢，勤政亡国的典型教训
  era: 明末
  dates_known: true
- name_zh: 洪承畴
  score: 8
  worth_why: 起身文吏而武勇韬略，关中剿贼大小百余战斩首四万；后降清，气节争议贯穿一生
  era: 明末清初
  dates_known: true
- name_zh: 温体仁
  score: 8
  worth_why: 阴鸷机深、倾轧贤臣的权相标本，居首辅最久而无一善政，君臣互信崩坏的警示
  era: 明末
  dates_known: true
- name_zh: 徐光启
  score: 8
  worth_why: 通天文历算水利农桑兵法火器，累请练兵不用；督修西洋历法，科学先驱生不逢时
  era: 明末
  dates_known: true
- name_zh: 周延儒
  score: 7
  worth_why: 两度首辅，元旦受帝揖以天下相托；督师通州饮酒伪报捷，终赐死，名实相悖的教训
  era: 明末
  dates_known: true
- name_zh: 杨嗣昌
  score: 7
  worth_why: 力主增赋剿贼征剿饷练饷，民穷盗炽；代督师而不克竟功，兼议主与能臣于一身
  era: 明末
  dates_known: true
- name_zh: 魏忠贤
  score: 7
  worth_why: 阉党专权、东林党狱、称九千岁的乱政标本，其覆灭亦为崇祯初政名场面
  era: 明末
  dates_known: true
- name_zh: 卢象升
  score: 6
  worth_why: 总理五省剿贼之任，为明廷所倚重；传文简略仅见其任而不详其终
  era: 明末
  dates_known: true
- name_zh: 文震孟
  score: 6
  worth_why: 忤魏忠贤遭斥、经筵讲尚书以袖掩帝加足之失，刚方贞介；为相三月即罢
  era: 明末
  dates_known: true
