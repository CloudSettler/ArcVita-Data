candidates:
- name_zh: 姚崇
  score: 9
  worth_why: 临终设局算计张说求碑文救全家族，死姚崇犹能算生张说，做事流完整且为千古智谋名场面
  era: 唐开元
  dates_known: true
- name_zh: 张说
  score: 8
  worth_why: 与姚崇相争结怨、被算计索回碑文而悔恨，文坛领袖与宰相双重身份，做事流完整
  era: 唐开元
  dates_known: true
- name_zh: 李林甫
  score: 8
  worth_why: 口蜜腹剑典型，构陷李适之父子致死，权相弄权终遭报应，可为权术警示教材
  era: 唐天宝
  dates_known: true
- name_zh: 刘晏
  score: 8
  worth_why: 十岁神童为秘书正字，朋字未正得之对与咏戴竿诗，后为唐代理财名臣，少年成名名场面
  era: 唐开元至建中
  dates_known: true
- name_zh: 裴宽
  score: 7
  worth_why: 义不受苞苴埋鹿全守，因瘗鹿得岳丈韦诜择婿，福寿贵盛为开元天宝名家之首选，操守典范
  era: 唐开元
  dates_known: true
- name_zh: 苏颋
  score: 7
  worth_why: 醉宿酲中受简笔立成制书，三绝佳话，父严训与才子嗜酒之张力，文章成名流完整
  era: 唐开元
  dates_known: true
- name_zh: 李适之
  score: 7
  worth_why: 罢相诗避贤初罢相乐圣且衔杯，遭李林甫迫杀，好饮疏略不备权奸的教训案例
  era: 唐天宝
  dates_known: true
- name_zh: 王毛仲
  score: 7
  worth_why: 从藩邸旧僚至开府仅四人之一，恃旧不法索三品官触怒玄宗而败，居功自傲的警示样本
  era: 唐开元
  dates_known: true
- name_zh: 杨国忠
  score: 7
  worth_why: 我儿何虑不富贵一言压制科举考官，权势滔天破坏取士制度，外戚乱政教训
  era: 唐天宝
  dates_known: true
- name_zh: 房琯
  score: 6
  worth_why: 预言生死应验如宿命剧本，食鱼鲙暴卒于紫极宫，然多为志怪色彩，做事流欠完整
  era: 唐开元至至德
  dates_known: true
- name_zh: 萧颖士
  score: 6
  worth_why: 恃才傲物陵侮紫衣老人实为吏部尚书王丘，终止于一第，狂士教训典型
  era: 唐开元
  dates_known: true
- name_zh: 韦诜
  score: 6
  worth_why: 城头见瘗鹿识裴宽、力排家人非议嫁女，识人之明与择婿眼光的佳话
  era: 唐开元
  dates_known: true
- name_zh: 王鉷
  score: 5
  worth_why: 其子王准斗鸡恃势凌驸马折玉簪，反映天宝权幸骄横，但本人做事流简略
  era: 唐天宝
  dates_known: true
- name_zh: 韦抗
  score: 5
  worth_why: 玄宗夜忘相名两改草诏故事中的执行者，援笔立成称敏捷典丽，然主戏在玄宗
  era: 唐开元
  dates_known: true
