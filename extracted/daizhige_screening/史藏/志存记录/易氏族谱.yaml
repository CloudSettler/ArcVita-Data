category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 易先
  score: 9
  worth_why: 永乐间诏授琼山知府开拓交趾，政平民和，军民上千人上书请留；宣德元年孤城抗黎利叛军三月，粮尽援绝佩印自尽，家属从死者十八口，满门殉节，追赠布政使谥忠节，忠奸对照（都督蔡祜拥兵不援伏国典），做事流完整且具名场面与忠节教训
  era: 明永乐至宣德年间
  dates_known: true
- name_zh: 易见龙
  score: 8
  worth_why: 留美研究血浆与干血浆制作成功轰动美国，罗斯福亲临祝贺；谢绝高薪加入美援华中华血库，携二百余箱器械冒德军潜艇袭击回国抢救抗战伤员；战后坚辞美职回国创建全国第一所血液研究室，抗美援朝再建中国血库，学部委员，做事流完整，报国抉择突出
  era: 近现代
  dates_known: true
- name_zh: 易雄
  score: 7
  worth_why: 东晋永昌元年王敦叛，以舂陵令应檄讨逆殉难武昌，追赠忠愍侯；夫人潘氏率全家五十口赴樟潭赴死，一门忠烈，缘起与结局可考，可为忠节坐标
  era: 东晋
  dates_known: true
rejections:
- name_zh: 恺公
  why_not: 传说为东周魏国上大夫受封易水赐姓，属姓氏源流追述，无可考做事周期
- name_zh: 万年公
  why_not: 仅记后汉章武二年由太仓迁湘，为迁徙坐标无事迹
- name_zh: 重公
  why_not: 唐状元大理寺评事，仅列科名官爵
- name_zh: 拨公
  why_not: 南宋状元礼部尚书，仅列功名爵位无做事周期
- name_zh: 准公
  why_not: 仅记宋榜眼及第
- name_zh: 明节公
  why_not: 仅记选为驸马配赵氏公主
- name_zh: 思聪公
  why_not: 仅记宋太尉封唐国公
- name_zh: 昌国公
  why_not: 仅记督漕赐爵益阳侯一句
- name_zh: 棠公
  why_not: 清道光任陕甘总督，无具体事迹
- name_zh: 以巽公
  why_not: 仅记任云南布政司使
- name_zh: 祖洛
  why_not: 抗战秘书任教湘大，事迹简略为侧写
- name_zh: 定博
