- name_zh: 荀勖
  score: 7
  worth_why: 依典制制定钟律，募得周代玉律验证不差，汉故钟不叩而应，是古代音律考订的完整做事周期与制度成就
  era: 西晋
  dates_known: true
- name_zh: 贾后
  score: 6
  worth_why: 专权杀杨太后酿八王之乱关键节点，最终被废以鹿车赴金墉城食金屑而死，是权斗警示教训
  era: 西晋
  dates_known: true
- name_zh: 张方
  score: 6
  worth_why: 兵入洛阳纵兵大劫掠、决千金堰致井渠枯涸，是八王之乱中破坏洛阳的名场面，可为乱世武将之教训
  era: 西晋
  dates_known: true
- name_zh: 成都王司马颖
  score: 5
  worth_why: 围攻京邑致城中卖死驴马肉杂死人肉、采陈韭为菜，记录围城惨状，做事流较简略
  era: 西晋
  dates_known: true
