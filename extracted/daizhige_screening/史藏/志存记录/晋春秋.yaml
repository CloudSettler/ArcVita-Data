  era: 西晋末
  dates_known: true
- name_zh: 习凿齿
  score: 6
  worth_why: 四海习凿齿、弥天释道安千古名对；苻坚叹晋平吴利在二陆今破南士获士一人有半
  era: 东晋
  dates_known: true
- name_zh: 石虎
