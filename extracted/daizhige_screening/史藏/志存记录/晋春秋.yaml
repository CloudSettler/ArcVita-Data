  era: 西晋
  dates_known: true
- name_zh: 李雄
  score: 8
  worth_why: 与李特入蜀就谷起家、兄李庠被斩、僭位建初、称成都王至即帝位，成汉立国完整链条
  era: 西晋末十六国
  dates_known: true
- name_zh: 胡威
  score: 7
