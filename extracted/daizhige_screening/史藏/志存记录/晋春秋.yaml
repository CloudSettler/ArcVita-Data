  worth_why: 攻杜弢城溃弢投水死；都督八州握强兵；折翼之梦自抑不反，功高自守的典范与心理挣扎
  era: 东晋
  dates_known: true
- name_zh: 王敦
  score: 8
  worth_why: 移镇姑苏、起兵叛乱、诏列罪恶、病笃发丧、钱凤败亡，权臣叛乱完整做事周期与教训
  era: 东晋
  dates_known: true
- name_zh: 刘毅
  score: 8
