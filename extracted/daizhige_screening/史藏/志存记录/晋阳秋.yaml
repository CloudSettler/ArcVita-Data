candidates:
- name_zh: 羊祜
  score: 9
  worth_why: 陆抗遗酒饮之不疑馈药推心服之的羊陆之交；务修德信以怀吴人，为灭吴奠定战略
  era: 三国末西晋初
  dates_known: true
- name_zh: 嵇康
  score: 8
  worth_why: 竹林七贤精神领袖；临刑作诗自责今愧孙登；与吕安千里命驾；因吕巽构陷引出司马氏诛名士事件
  era: 三国曹魏
  dates_known: true
- name_zh: 姜维
  score: 8
  worth_why: 降后密表刘禅欲伪服事钟会杀之以复蜀土，事败身死；孙盛评其非所据而据身必危，教训深刻
  era: 三国蜀汉
  dates_known: true
- name_zh: 阮籍
  score: 7
  worth_why: 礼岂为我设邪；骑驴赴东平太守任坏府舍壁垒十余日而去，名士任诞风度典范
  era: 三国曹魏
  dates_known: true
- name_zh: 王祥
  score: 7
  worth_why: 卧冰求鲤孝行原型；司马昭进号为王时独长揖不拜，得今日然后知君见顾之重的评语
  era: 三国曹魏至西晋
  dates_known: true
- name_zh: 邓艾
  score: 7
  worth_why: 入江由偷渡灭蜀之奇功；功成被诛为恃功致祸之鉴
  era: 三国曹魏
  dates_known: true
- name_zh: 刘禅
  score: 6
  worth_why: 乐不思蜀名场面；与郄正的问答尽显亡国之君生存术，可为教训型人物
  era: 三国蜀汉
  dates_known: true
- name_zh: 张华
  score: 6
  worth_why: 画地成图应对如流论建章千门万户；主持厘革晋仪礼制度
  era: 西晋
  dates_known: true
- name_zh: 向雄
  score: 6
  worth_why: 不受杖下狱至同省避面，武帝赐酒礼使诣解仇，处世恩怨化解的完整小故事
  era: 西晋
  dates_known: true
- name_zh: 桓范
  score: 6
  worth_why: 高平陵之变出奔曹爽持大司农印劝其据许昌不忧谷食，爽不从致族诛，关键决策之鉴
  era: 三国曹魏
  dates_known: true
- name_zh: 裴秀
  score: 5
  worth_why: 后进领袖有裴秀之誉，后为地图学家，然本篇事迹简略
  era: 曹魏西晋
  dates_known: true
- name_zh: 谯周
  score: 5
  worth_why: 力主降魏之议；临终嘱勿以朝服加身还葬旧墓，见识与气节可述
  era: 三国蜀汉
  dates_known: true
- name_zh: 文鸳
