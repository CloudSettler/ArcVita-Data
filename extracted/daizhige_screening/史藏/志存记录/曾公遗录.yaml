verdict: has_candidates
candidates:
- name_zh: 曾布
  score: 8
  worth_why: 拥护熙宁变法至翰林学士三司使；与章惇共促绍圣复行新法；附和向太后扶立徽宗旋即入相，又被蔡京排挤去位，身列宋史奸臣传；其日录亲载君臣奏对，是填补长编空白的原始史料，做事流完整且具教训意义
  era: 北宋中后期
  dates_known: true
- name_zh: 章惇
  score: 8
  worth_why: 绍圣主政复行新法的关键推手；本录中可见其力挺张珣乞贬所稍近等细节；扶立问题上首倡端王不可君天下之议而反遭贬斥，决策与结局对照极具戏剧性与教训价值
  era: 北宋中后期
  dates_known: true
- name_zh: 章楶
  score: 7
  worth_why: 对西夏浅攻进筑战略的主持者，本录开篇即其乞差保甲应副进筑城寨；平夏城大捷为其名场面，完整对夏做事周期可考
  era: 北宋中后期
  dates_known: true
- name_zh: 蔡京
  score: 6
  worth_why: 本录中已见其奏应答辽使、欲付所司等身影；随后排挤曾布入相，崇宁专权兴党禁，做事周期完整但属祸国教训型
  era: 北宋末
  dates_known: true
- name_zh: 陈瓘
  score: 6
  worth_why: 本录载其两以书抵曾布、称引北朝旧书以难泛使，条畅有理；后为著名谏臣著尊尧集，直言遭贬，可为风骨典范
  era: 北宋末
  dates_known: true
