source: 史藏/志存记录/月河所闻集.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 王旦
  score: 6
  worth_why: 寇准面求节钺被其正色拒绝而怀怨，后真宗道破除职乃旦所荐，寇准惭服，远权利与以德报怨的典范
  era: 北宋真宗朝
  dates_known: true
- name_zh: 司马光
  score: 6
  worth_why: 临终犹以数剳子托执政曰不蒙施行死不瞑目，神爽不乱而逝，尽瘁国事之表率
  era: 北宋元祐
  dates_known: true
- name_zh: 柴荣
  score: 6
  worth_why: 高平之后收复三关收寿阳，因疾班师功败垂成，做事流戛然而止的典型
  era: 五代后周
  dates_known: true
- name_zh: 寇准
  score: 5
  worth_why: 求节钺不得而大衔王旦，闻真宗言乃惭服，修身镜鉴
  era: 北宋真宗朝
  dates_known: true
- name_zh: 王钦若
  score: 5
  worth_why: 趁真宗倦勤窃柄，专行小政以欺同列丁谓，明肃垂帘诘责其乖法度，惭恨病薨，权诈之戒
  era: 北宋真宗仁宗朝
  dates_known: true
- name_zh: 陆贽
  score: 5
  worth_why: 内相之称自其始，与德宗从容谋议天下谟谋，后贬忠州八年待遇盛衰，可考其谏诤与浮沉
  era: 唐德宗朝
  dates_known: true
- name_zh: 高遵裕
  score: 5
  worth_why: 灵州之役受诏敢议班师者斩仍以身当罪，水至全数十万军之命，危局担当一事
  era: 北宋神宗朝
  dates_known: true
rejections:
- name_zh: 莫君陈
  why_not: 作者仅辑录见闻杂记，本人无做事周期
