  why_not: 行气服丹延寿之说荒诞无考，无完整做事流
- name_zh: 陶彖
  why_not: 纸球遇鬼志怪一则，无史实做事周期
- name_zh: 胡恢
  why_not: 仅一句画马亚韩干，无事迹
- name_zh: 洛下闳
  why_not: 仅岁差一语且文中斥为后人臆说
- name_zh: 钱塘尼水美
  why_not: 嫁人之语轶闻，被张先词引用而已
- name_zh: 吕夷简
  why_not: 仅妻孕梦兆一则，属怪异附会非做事
- name_zh: 苏轼
  why_not: 文中仅录其零星笑语与辞表句，无做事流，且宜俟正史录入
- name_zh: 黄庭坚
  why_not: 仅赵挺之弹章中提及其亲缘一句
- name_zh: 丁谓
  why_not: 仅受王钦若欺而屡白不听一节，无独立完整周期
- name_zh: 刘昌祚
  why_not: 灵州几得城而忽受节制一句，事迹太简
- name_zh: 梅福
  why_not: 仅吴门卒地名考据一句
