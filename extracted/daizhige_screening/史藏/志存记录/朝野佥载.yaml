  worth_why: 《帝京篇》与讨武檄文名场面；从徐敬业扬州起兵檄武曌，兵败投江，做事流有始有终且富悲剧启示
  era: 初唐武后之际
  dates_known: true
- name_zh: 宋璟
  score: 8
  worth_why: 景云中与毕构奏停斜封官二百人，逆中求直；后为开元名相，与姚崇并称，有完整做事周期与制度遗产
  era: 武周至开元
  dates_known: true
- name_zh: 张鷟
  score: 7
  worth_why: 青钱学士下笔成章；本卷自述遭李全交构陷判死、赖同僚营救流放岭南而著作不辍，兼记一代朝野见闻
  era: 武周至开元
  dates_known: true
- name_zh: 徐敬业
  score: 7
  worth_why: 伪敕自授扬州司马、杀长史据江淮起兵讨武，起兵至败亡一段做事周期完整，为武则天时代最大反抗事件
  era: 武周革命之际
  dates_known: true
- name_zh: 孙万荣
  score: 6
  worth_why: 营州之乱以地牢疲囚、遗牛瘦马诱敌，黄獐谷设伏歼灭官军，诈术与败亡俱可考，可作谋略与教训案例
  era: 武周万岁通天前后
  dates_known: true
- name_zh: 阎知微
  score: 5
  worth_why: 和亲突厥被立为可汗，归国遭磔杀百官射之，为失节者典型教训；然事迹多为时局坐标，做事流简略
  era: 武周圣历年间
  dates_known: true
- name_zh: 杜景佺
  score: 5
  worth_why: 廷诤为李昭德辨公清正直而左授溱州，刚直严正有风骨；但传文短，做事周期不完整
  era: 武周垂拱年间
  dates_known: true
