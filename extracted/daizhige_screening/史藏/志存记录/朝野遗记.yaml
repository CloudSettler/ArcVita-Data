  why_not: 传文仅君臣相谑市令之戏，无做事周期
- name_zh: 李邦彦母
  why_not: 仅银工家出宰相一句名言，无事迹
- name_zh: 张浚
  why_not: 文中仅苗刘之变与告变片段，事迹零散不成完整做事流
- name_zh: 光宗
  why_not: 疯病轶事与过宫风波堆叠，属宫闱琐记缺乏可效法的做事主线
- name_zh: 寿皇
  why_not: 闻小儿呼赵官家等感伤片段，无完整做事周期
- name_zh: 程敦厚
  why_not: 仅被秦桧设计利用一幕，本人无主动做事周期
- name_zh: 钦宗
  why_not: 仅挽轮求归与神游故国两则遗事，无做事周期
