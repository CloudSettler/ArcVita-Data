category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 杨皇后
  score: 8
  worth_why: 从乐部之女入宫为义女，凭机敏与权术一路升至皇后；连夜双写御笔防韩侂胄匿批中变，是极典型的关键决策名场面；其经历可为权谋与自处的双重教材
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 石赪
  score: 8
  worth_why: 保正聚众据山抗金、断敌运道，被俘钉于车上遭剐仍怒目骂贼宁死不降；完整做事周期加壮烈名场面，是民间抗金的气节典范
  era: 南宋初建炎年间
  dates_known: true
- name_zh: 韦太后
  score: 6
  worth_why: 面对钦宗挽轮之请立誓南归、失明后金针拨障复明，道士点破不敢以一目存誓的隐痛；誓言与失信的教训极具戏剧性，但偏志怪、做事流不完整
  era: 南宋初高宗朝
  dates_known: true
- name_zh: 秦桧
  score: 6
  worth_why: 呼程敦厚入府终日坐候、以紫绫标赋暗示考题、为孙秦埙谋首选，是操纵科举的经典案例；但本篇仅此一幕，需与正史合参方成做事流
  era: 南宋高宗朝
  dates_known: true
- name_zh: 吕颐浩
  score: 6
  worth_why: 航海避敌时卫士怀家流言，以大义谕解并先及舟者迁五秩、署名用堂印志之、事后分别诛赏；小而完整的危机处置案例
  era: 南宋高宗朝
  dates_known: true
rejections:
