candidates:
- name_zh: 李实
  score: 9
  worth_why: 土木之变后自请出使瓦剌，面斥也先、折冲樽俎，探迎英宗，临危受命不辱君命，受命—北行—谈判—觐见上皇—复命做事流完整，且沿途纪行诗与交涉对话为第一手史料
  era: 明代景泰年间（正统己巳土木之变后）
  dates_known: true
- name_zh: 也先
  score: 8
  worth_why: 瓦剌太师，土木堡俘获明英宗、挟天子而不杀，遣使议和终归好，权倾漠北的完整做事周期，与李实对谈为名场面
  era: 明代正统至景泰年间
  dates_known: true
rejections:
