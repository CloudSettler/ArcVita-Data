  why_not: 君主仅作时间坐标，本录只记其监国即位与遣使程序
- name_zh: 明英宗朱祁镇
  why_not: 君主低优先，本录中仅为被迎对象，无自主做事流
- name_zh: 王振
  why_not: 专权致土木之败即身死乱军，做事流无完整周期，仅作教训背景
- name_zh: 兴安
