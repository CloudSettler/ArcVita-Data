verdict: has_candidates
candidates:
- name_zh: 李鸿章
  score: 10
  worth_why: 本集主角；办赈济（采购闽米四万石接济直隶春赈）、办外交（与副岛种臣换约、处理日本朝鲜台湾秘鲁交涉）、办洋务（闽沪造船招商雇买之决策与反思），做事流完整且自评“闽船创自左公、沪船创议曾相、鄙人早知不足御侮”极具名场面潜力；同治十年至光绪二十一年跨度完整可考
  era: 晚清同治光绪年间
  dates_known: true
- name_zh: 左宗棠
  score: 8
  worth_why: 创办福州船政局、首倡自造轮船，文中“闽船创自左公”可作切入点；与李鸿章的造船路线之争（官造 vs 招商雇买）是洋务运动关键决策案例
  era: 晚清同治光绪年间
  dates_known: true
- name_zh: 副岛种臣
  score: 6
  worth_why: 日本外务卿，以万国公法应对列强公使、拒绝秘鲁苦力贩贸议约、对朝鲜慎兵，外交手腕可资借鉴；但非本集主角，事迹需日本史籍补全
  era: 日本明治初年
  dates_known: true
rejections:
- name_zh: 曾国藩
  why_not: 本文献仅“沪船创议曾相”一句带过，无完整做事周期，且其主传在别集
- name_zh: 胡雪岩
  why_not: 仅受托在沪定买赈米三万石，属具体办事环节，无可考做事流
- name_zh: 文煜
  why_not: 仅以闽浙督臣身份来函关切，无独立事迹
- name_zh: 王凯泰
  why_not: 仅列名会衔复函，无做事周期
- name_zh: 王凯泰所遣丁嘉玮
  why_not: 仅押运米石之差委，无事迹文本
