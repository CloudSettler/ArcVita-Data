category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 李秀成
  score: 10
  worth_why: 从贫寒佣工至太平天国后起支柱，自述供状完整呈现其从军、守桐城、招张乐行龚得树、封地官副丞相的完整做事流；忠王一生即太平天国后期兴衰史，供状本身为千古名文
  era: 清末太平天国
  dates_known: true
- name_zh: 杨秀清
  score: 9
  worth_why: 烧炭出身而掌一国军政，军令严整赏罚分明，定都金陵之决策（采老水手谏言弃河南取江南）影响全局；威逼天王封万岁终致天京事变被杀，功败于骄，教训极深
  era: 清末太平天国
  dates_known: true
- name_zh: 洪秀全
  score: 8
  worth_why: 虽为天王但有突出做事：丁酉年还魂创拜上帝教，深山传教积岁成众，金田起义至建都天京的创业全程可考；后期专用安福两王致翼王出走，为盛世骤衰之教训
  era: 清末太平天国
  dates_known: true
- name_zh: 冯云山
  score: 8
  worth_why: 供状明言谋立创国者出南王之谋，前做事者皆南王；深入紫荆山区传教奠基，为拜上帝会实际缔造者，全州阵亡为革命重大转折
  era: 清末太平天国
  dates_known: true
- name_zh: 石达开
  score: 8
  worth_why: 家富读书文武备足，天京事变后合朝同举其理政；因安福两王挟制被逼出京远征不回，负气出走致全军覆没，忠臣被逼离心的典型教训
  era: 清末太平天国
  dates_known: true
- name_zh: 萧朝贵
  score: 7
  worth_why: 冲锋第一勇敢刚强，率李开芳林凤祥攻打长沙中炮身亡，其死直接引发天王东王移营长沙；做事周期较短但关键节点可考
  era: 清末太平天国
  dates_known: true
- name_zh: 韦昌辉
  score: 7
  worth_why: 监生出身边疆富户毁家纾难举义；天京事变中杀东王及满门、又欲杀翼王、屠杀文武，最终被合朝所诛，权力失控滥杀的完整警示案例
  era: 清末太平天国
  dates_known: true
- name_zh: 李开芳
  score: 7
  worth_why: 地官丞相，破武昌主将之一，西王死后具禀回郴引大军；与林凤祥北伐为太平天国最悲壮的远征，做事线可考
  era: 清末太平天国
  dates_known: true
- name_zh: 林凤祥
  score: 7
  worth_why: 天官副丞相，与李开芳同为东王掌令时的攻城主将，武昌之破其功最著，后北伐深入绝域，典型远征统帅
  era: 清末太平天国
  dates_known: true
- name_zh: 罗大纲
  score: 7
  worth_why: 绿林出身弃暗投明，永安突围夺古苏冲小路得火药十余担方能出关；破武昌水路主将，关键战役屡建奇功
  era: 清末太平天国
  dates_known: true
- name_zh: 陈玉成
  score: 6
  worth_why: 供状载其十八指挥出身，与李秀成同被朝臣查选出来助国的少年将领，后为英王；本篇着墨少，事迹待他篇补足
  era: 清末太平天国
  dates_known: true
rejections:
- name_zh: 洪仁发
  why_not: 安王，供状明言无才情无算计，一味古执，仅挟制翼王致其出走，无完整做事流
- name_zh: 洪仁达
  why_not: 福王，与洪仁发同为平庸宗亲，无独立事迹可考
- name_zh: 秦日昌
  why_not: 供状明言并无才情只有忠勇忠义，死状一笔带过，做事周期不成
- name_zh: 胡以晃
  why_not: 花洲接驾、破庐州有提及但无独立完整做事线，事迹简略
- name_zh: 老水手
  why_not: 无名氏，仅谏都金陵一言，虽有见识但非可独立成篇人物
