candidates:
- name_zh: 李泌
  score: 8
  worth_why: 历仕三朝的谋臣；对德宗纵论中原之祸自李林甫始，剖析玄宗由勤俭入奢、权臣承迎之弊，以齐桓管仲为鉴，是治国兴衰的深刻教训
  era: 唐代宗德宗朝
  dates_known: true
- name_zh: 姚崇
  score: 8
  worth_why: 名相；便殿借足疾之喻弹劾张说，数言定罪状数百，行事果决，救时宰相之典范
  era: 唐开元
  dates_known: true
- name_zh: 唐玄宗
  score: 7
  worth_why: 虽为君主，但前半生平内难、创开元之治、倡起居注与梨园，后半世宠信李林甫致安史之祸，兴衰一体足为后世镜鉴
  era: 唐开元天宝
  dates_known: true
- name_zh: 张说
  score: 7
  worth_why: 遭姚崇构陷几陷死地，赖昔日释放的书生持夜明帘走九公主而立解危局，恩怨报偿的完整做事流
  era: 唐开元
  dates_known: true
