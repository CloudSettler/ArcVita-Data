candidates:
- name_zh: 谈迁
  score: 9
  worth_why: 明末布衣史家，国榷手稿被盗后发愤重撰，二十余年备极艰辛终成一家之言；拒史馆之荐不借国难博官，徒步千里哭张慎言墓，操行廉至家徒四壁，做事流完整且是坚韧治史的模范
  era: 明末清初
  dates_known: true
- name_zh: 高弘图
  score: 6
  worth_why: 崇祯甲申入相，与布衣谈迁论新政得失，闻勳寺交煽即纳其言乞骸骨去，乙酉致命会稽殉国，有较完整的关键决策线
  era: 明末
  dates_known: true
- name_zh: 张慎言
  score: 6
  worth_why: 甲申任冢宰，与高弘图同为天下之望，纳谈迁之言先后乞骸骨，客死宣城，布衣之交与急流勇退可成一节
  era: 明末
  dates_known: true
