source: 史藏/志存记录/查抄和珅家产清单.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 和珅
  score: 10
  worth_why: 从抬舆诵《论语》的拜唐阿骤擢侍卫而至权倾朝野；贪腐聚敛成清代第一巨案，抄家清单本身即名场面；狱中元夕诗与白绫自尽为结局；『和珅跌倒嘉庆吃饱』足为后世巨贪之鉴；生卒仕履皆可考
  era: 清乾隆嘉庆年间
  dates_known: true
- name_zh: 嘉庆帝
  score: 6
  worth_why: 乾隆驾崩次日即被劾和珅、五日拿问、赐自裁，二十条大罪宣示中外，堪称教科书级权力收网；然君主作时间坐标为主，且大案主角实为和珅
  era: 清嘉庆年间
  dates_known: true
- name_zh: 刘墉
  score: 5
  worth_why: 唯一敢与和珅文事相抗并以谑语刺之者，门庭清峻而性喜诙谐，人物形象鲜明；然本篇仅数句侧写，做事流须另据史料补全
  era: 清乾隆嘉庆年间
  dates_known: true
rejections:
- name_zh: 吴卿怜
  why_not: 先属王亶望后献和珅，抄家后作绝句八章自悼，仅见悲怨身世，无可考做事周期
- name_zh: 长二姑
  why_not: 和珅宠妾，赋诗挽主自殉，事迹仅此一节
- name_zh: 刘全
  why_not: 和珅管家，籍没家产而已，无独立做事流
- name_zh: 纪昀
  why_not: 文中仅为和珅捉刀润色一语，无做事周期
- name_zh: 彭元瑞
  why_not: 同为代笔润色，事迹仅一笔带过
- name_zh: 王亶望
  why_not: 仅提坐事伏法、起迷楼，本篇无其做事细节
- name_zh: 乾隆帝
  why_not: 君主仅作时间坐标，本篇无其突出做事流
- name_zh: 梁章钜
  why_not: 记述者，转述和珅案档案，本人事迹未载
