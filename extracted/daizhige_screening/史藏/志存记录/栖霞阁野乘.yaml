candidates:
- name_zh: 金圣叹
  score: 8
  worth_why: 以哭庙案率诸生为民请命、抗非刑预征课税，名场面为狱中上书千余言；其死标志吴下讲学立社之风终结，兼具模范与教训
  era: 明末清初
  dates_known: true
- name_zh: 福康安
  score: 7
  worth_why: 经理藏卫、平廓尔喀、督战苗疆，行军不乘骑仿韦睿故事；舆夫暴横事件中处置姚令仪一节见其治军权衡，做事流较完整
  era: 清乾隆嘉庆间
  dates_known: true
- name_zh: 荣禄
  score: 6
  worth_why: 庚子前后枢廷领袖，军机独断之权术可考；但传文侧重制度描述而非其个人做事周期
  era: 清光绪间
  dates_known: true
- name_zh: 姚令仪
  score: 5
  worth_why: 怒毙暴横轿夫头、当福康安面自认不诿过于人，刚直任事有可记之处；然事迹限于一事
  era: 清嘉庆初
  dates_known: false
- name_zh: 康熙
  score: 5
  worth_why: 六次南巡察民疾苦、问太湖垦田蠲税、亲试菜花，有勤政细节；然君主宜作时间坐标，做事流散见
  era: 清康熙间
  dates_known: true
- name_zh: 宋荦
  score: 5
  worth_why: 三任扈从南巡、求御书西陂二字传为佳话；但事多接驾应制，做事周期不显
  era: 清康熙间
  dates_known: true
rejections:
