verdict: has_candidates
candidates:
- name_zh: 岳飞
  score: 9
  worth_why: 精忠报国、郾城大捷、十二道金牌班师、莫须有冤狱，做事流完整且为千古教训；本卷见其绍兴十一年除枢密副使（岳武穆）
  era: 南宋
  dates_known: true
- name_zh: 张浚
  score: 8
  worth_why: 建炎川陕宣抚处置使、富平之战、平湖寇、隆兴都督北伐，本卷多处记其总师行事，做事周期可考
  era: 南宋
  dates_known: true
- name_zh: 赵鼎
  score: 7
  worth_why: 知枢密院改都督川陕、两度拜相、因亲嫌让监修国史、反对和议绝食而死，贤相气节可垂后世
  era: 南宋
  dates_known: true
- name_zh: 秦桧
  score: 7
  worth_why: 以宰相入为枢密使、独相专权主和、构陷岳飞，作为权奸典型是重要警示教训
  era: 南宋
  dates_known: true
- name_zh: 吕颐浩
  score: 6
  worth_why: 建炎首任江浙制置使、绍兴都督江淮开府镇江，中兴宰相总师做事流较完整
  era: 南宋
  dates_known: true
- name_zh: 费衮
  score: 5
  worth_why: 本书作者，自序言积岁月漫录成编，撰书缘起与结果可考，然事迹简略且非天下之事先缓
  era: 南宋
  dates_known: true
