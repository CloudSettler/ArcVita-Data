category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 陈夔龙
  score: 8
  worth_why: 全书主角，自述孤苦、沉滞、忧患、衰病四时代，做事流完整；十九中举、殿试因一字之误置三甲签分兵部、十年补缺升京兆、督漕抚汴吴升督湖广终领北洋，自陈不联络新学家不敷衍留学生不延纳假名士的处世三不，庚子后执掌北洋十年为清末要角，勤俭恕三字自箴足为后世镜鉴
  era: 清末民初
  dates_known: true
- name_zh: 荣禄
  score: 7
  worth_why: 甲午后权倾朝野，庚子议和关键人物；传中记其相面断言陈夔龙五年内必有非常之遇且应验，又派陈夔龙会审大凌河马厂舞弊钦案，可窥其用人行政风格
  era: 晚清
  dates_known: true
- name_zh: 丁宝桢
  score: 7
  worth_why: 誊杀太监安德海名震朝野，督蜀十年；传中记其待唐炯以国士、与阎敬铭道义论交老而弥笃，遗疏荐贤，行事有始有终可为典范
  era: 晚清
  dates_known: true
- name_zh: 唐炯
  score: 6
  worth_why: 一生跌宕典型：由丁宝桢国士之遇超擢巡抚，甲申防边失利定斩监候，菜市口候勾死里逃生，后奉旨赏巡抚衔督办云南全省矿务持节入滇，缘起转折结果俱全
  era: 晚清
  dates_known: true
- name_zh: 阎敬铭
  score: 6
  worth_why: 理财名臣，朝野物望；传中记其为丁宝桢撰墓志铭并主持刻碑诸事，文人风骨可考，然本卷所载多属文墨交游，需参他史补全做事流
  era: 晚清
  dates_known: true
rejections:
- name_zh: 薛允升
  why_not: 传中仅记其挟嫌作弄唐炯一节，缺完整做事周期与名场面
- name_zh: 张之万
  why_not: 仅以刑部尚书身份一笔带过，无做事可述
- name_zh: 许庚
  why_not: 仅记监刑一场面，事迹零碎不足成轴
- name_zh: 岑毓英
  why_not: 仅作发遣唐炯的差遣坐标出现，无事迹文本
- name_zh: 李鸿章
  why_not: 本卷仅以合肥李文忠密保唐炯一句带过，须依其专传另行录入
- name_zh: 左宗棠
  why_not: 本卷仅湘阴左文襄并列密保一处提及，事迹须依本传
