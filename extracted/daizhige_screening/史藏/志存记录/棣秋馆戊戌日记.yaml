- name_zh: 棣秋馆日记作者（常熟士绅，名待考）
  score: 6
  worth_why: 戊戌年东乡赈荒有完整做事周期，定议取孝友庄捐款设局张市放粥米，从千人激增至三万人致挤毙十一人，果断收局改按户查放并致书都中呼吁拨款，兼营任阳垦荒筑圩引泰西水学，是江南基层士绅救荒的罕见第一手记录
  era: 清光绪戊戌年（1898）
  dates_known: false
