source: 史藏/志存记录/楼房子邓氏家谱.md
category: 史藏/志存记录
verdict: no_value
skip_reason: 邓氏家谱仅记世系、生卒与婚配，人物皆无完整做事周期，无名场面、无事业可言，仅海云一条含冤自缢事略有警示意味但事迹过简
rejections:
- name_zh: 邓海云
  why_not: 生卒可考，然除南迁与文革受诬自缢后昭雪外无做事流，无事业阶段与关键决策，事迹不足成时间轴
- name_zh: 邓连科
  why_not: 传文仅记生卒婚配子女，无任何事迹
- name_zh: 邓治国
  why_not: 传文数十字，仅记浪迹澄金与横死异乡，无完整做事周期
- name_zh: 邓海云之父
  why_not: 仅记脚客驮盐与早卒，名且不详，事迹简略
- name_zh: 邓治家
  why_not: 传文仅一句其事不详
