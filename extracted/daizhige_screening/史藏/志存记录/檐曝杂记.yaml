candidates:
- name_zh: 张廷玉
  score: 8
  worth_why: 世宗朝军机处草创核心，廷寄格式由其奏定，历仕三朝掌机务而门无竿牍、馈礼百金辄却，为军机不与外臣交接风气之典型，做事流与制度创建俱全
  era: 清康熙雍正乾隆年间
  dates_known: true
- name_zh: 傅恒
  score: 8
  worth_why: 领班军机大臣，平金川归而首揆席，奏请军机大臣同进见遂为例制，又开启司员代拟谕旨之例，制度关键节点清楚，晚膳后独召晚面见宠眷之专
  era: 清乾隆年间
  dates_known: true
- name_zh: 赵翼
  score: 8
  worth_why: 本书作者，入直军机司员，伏地起草悬腕作字、蜡泪污身亲历军机之劳，后成廿二史札记等史学名著，由中书词臣到史学大家做事周期完整
  era: 清乾隆嘉庆年间
  dates_known: true
- name_zh: 汪由敦
  score: 6
  worth_why: 张廷玉所荐代拟谕旨之笔，金川用兵诏令皆出其手，屡易其稿而不敢较，兼为皇帝诗片书写者，可作军机撰拟制度活的注脚
  era: 清乾隆年间
  dates_known: true
- name_zh: 乾隆帝
  score: 5
  worth_why: 卯刻视朝日必四五起、军报夜半亲览披衣待臣、九矢九中圣射、御制碑文五刻数千言，勤政圣学场面生动，然君主作时间坐标，无变法级制度作为，暂缓
  era: 清乾隆年间
  dates_known: true
- name_zh: 讷亲
  score: 5
  worth_why: 乾隆初年一人承旨，强记而不通文义，屡令改稿成汪由敦之苦，后平金川失机伏法，可作军机初制与宠臣覆败之教训，然本卷事迹简略
  era: 清乾隆初年
  dates_known: true
