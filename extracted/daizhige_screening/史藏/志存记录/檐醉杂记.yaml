  worth_why: 抚苏奏免积逋数十万不受一钱；拒余国柱索部费遭百端谗害而终得保全；所举廉吏郭侍御终劾倒明珠，清廉做事流完整且有斗争名场面
  era: 清康熙
  dates_known: true
