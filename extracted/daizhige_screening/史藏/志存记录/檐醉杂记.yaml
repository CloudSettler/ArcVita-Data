  era: 清康熙
  dates_known: true
- name_zh: 康熙帝
  score: 6
  worth_why: 禁赌惩重臣、革十三衙门、保全清官、蠲免积欠，做事流可考；但君主优先级低，且多散见片段
  era: 清康熙
  dates_known: true
- name_zh: 朱国治
  score: 5
  worth_why: 构奏销案祸苏松士绅万余人，后侵蚀军粮被将士脔食，可为酷吏教训；然事迹系于奏销案一节
  era: 清顺治
  dates_known: true
- name_zh: 吴正治
  score: 5
  worth_why: 具疏吁恩蠲苏松积欠之半，民困得苏；救人一节可录但篇幅短
  era: 清康熙
  dates_known: true
