verdict: has_candidates
candidates:
- name_zh: 姚崇
  score: 8
  worth_why: 开元名相救时之才；不私其子而自劾、辞逐魏知古以全大体，人君大度与相业相得，做事与操守俱全
  era: 唐开元
  dates_known: true
- name_zh: 张说
  score: 7
  worth_why: 东宫密赞元献皇后保肃宗之胎，进木瓜献药终成帝师恩泽莫比；潜邸定策关键决策点清晰
  era: 唐开元
  dates_known: true
- name_zh: 高力士
  score: 7
  worth_why: 全书所记皆其目睹禁中事；谏京兆选女改由掖庭、宣慰萧嵩等行事可见宦官参政之完整轨迹，亦可为盛衰见证
  era: 唐玄宗朝
  dates_known: true
- name_zh: 唐玄宗
  score: 7
  worth_why: 君主低优先，但本篇有其突出做事点：任姚崇不答而权纲自持、金瓯覆名选相、西幸拒焚左藏库不重困赤子、花萼楼闻李峤词而涕下
  era: 唐开元天宝
  dates_known: true
- name_zh: 萧嵩
  score: 6
  worth_why: 乞骸骨一节君臣保全大义，玄宗暮使除右丞相并赐柑，进退有节可为模范
  era: 唐开元
  dates_known: true
- name_zh: 魏知古
  score: 5
  worth_why: 由吏起家至宰辅，衔怨发姚崇二子请托事，终以负德罢政事，可为教训
  era: 唐开元
  dates_known: true
- name_zh: 善无畏
  score: 5
  worth_why: 洛阳钵水咒龙致雨名场面，事迹具体但涉神异，作缓录
  era: 唐开元
  dates_known: true
- name_zh: 李峤
  score: 5
  worth_why: 汾水秋雁一诗令玄宗涕下不待曲终，代表作诞生点鲜明，然传内仅此一事
  era: 唐武周至开元
  dates_known: true
