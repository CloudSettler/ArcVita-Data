candidates:
- name_zh: 杨铭
  score: 9
  worth_why: 哈铭父子出使瓦剌被扣，土木之变后昼夜随侍英宗，紫荆关夜寻喜宁、易州进果、涿州送酒，历经掳掠而终得护驾南归，做事流完整且为一手亲历记录
  era: 明代正统年间
  dates_known: true
- name_zh: 明英宗朱祁镇
  score: 8
  worth_why: 土木之变被俘却以气度折服瓦剌诸人，从阶下之囚到复立送归，北狩一年成帝王沉浮经典案例
  era: 明代
  dates_known: true
- name_zh: 也先
  score: 8
  worth_why: 瓦剌太师借贡使纠纷兴兵犯边，土木堡俘明英宗，挟天子叩紫荆关直逼北京，权势顶点与败亡伏笔俱在，做事流完整
  era: 明代正统景泰年间
  dates_known: true
- name_zh: 袁彬
  score: 7
  worth_why: 识字校尉自愿入瓦剌营伏侍英宗，叫城传话寒夜相伴，患难忠仆典范
  era: 明代正统年间
  dates_known: true
- name_zh: 伯颜帖木儿
  score: 7
  worth_why: 力排乃公杀帝之议，言上天不曾着皇帝死、那颜当图万年好名头，一段议论定英宗生死，兼负责养活圣驾，见识与担当可录
  era: 明代正统年间
  dates_known: false
- name_zh: 喜宁
  score: 6
  worth_why: 随驾太监叛投瓦剌，献策不入大路改趋紫荆关犯京，教诫后人叛变者的下场，可作反面教训
  era: 明代正统年间
  dates_known: false
