source: 史藏/志存记录/正统北狩事迹.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 杨铭（哈铭）
  score: 9
  worth_why: 瓦剌使臣之子，土木之变后独留英宗身边侍奉一年；劝阻英宗虎口夺食、设计借边将之手诛叛宦喜宁、奔走大同宣府促成迎驾；以“一指之喻”求功，终得都指挥之赏，忠而有谋、做事流完整
  era: 明正统至景泰年间
  dates_known: true
- name_zh: 伯颜帖木儿
  score: 8
  worth_why: 也先之弟，力排众议保护英宗并以“大鱼归大海”之喻宽慰之；护驾一年送至野狐岭洒泪而别，兼有识人之明与万世美名之谋，夷狄中有仁义
  era: 明正统年间
  dates_known: true
- name_zh: 袁彬
  score: 7
  worth_why: 校尉出身，北狩期间始终侍奉英宗、呼城传命；遭喜宁诬构欲杀而得营救，患难忠仆之典型
  era: 明正统年间
  dates_known: true
- name_zh: 也先
  score: 7
  worth_why: 瓦剌太师，土木堡擒获明英宗；在伯颜帖木儿劝谏下弃杀帝之议，以“奉驾还朝、不在金帛”换取万世之名，草原枭雄的关键抉择可鉴
  era: 明正统年间
  dates_known: true
- name_zh: 喜宁
  score: 6
  worth_why: 叛明投瓦剌之宦官，屡次谗构袁彬、杨铭并献计犯边；终被英宗设计遣入京而执杀，叛徒自取灭亡的教训样本
  era: 明正统年间
  dates_known: true
rejections:
- name_zh: 明英宗朱祁镇
  why_not: 君主低优先，本文献中主要作被俘受护之坐标；其复辟做事流在此传未展开
- name_zh: 杨善
  why_not: 迎驾使臣，传中仅奉命来迎数语，做事细节不在本文
- name_zh: 郭登
  why_not: 仅献从宣府入关之策一言，无完整做事周期
- name_zh: 石亨
  why_not: 传中仅见“巡边”“从雁门入”散句，无事迹文本支撑
- name_zh: 王直、赵荣、李实
  why_not: 朝臣迎送问对数语，无独立做事流
- name_zh: 脱脱不花王
  why_not: 仅遣使入贡一见，无事迹文本
