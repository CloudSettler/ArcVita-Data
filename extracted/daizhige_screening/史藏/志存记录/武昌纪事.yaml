candidates:
- name_zh: 洪秀全
  score: 9
  worth_why: 金田起事至定都天京的完整做事周期，攻克武昌为其军事巅峰之一役，拜上帝会创教组织堪称制度性成就
  era: 清末太平天国
  dates_known: true
- name_zh: 常大淳
  score: 9
  worth_why: 咸丰二年任湖北巡抚主持武昌防务，毁城外民房清野、凿井备守、出赏格募死士，守城八十余日城破殉难，是晚清守土死节的完整做事与教训样本
  era: 清道光咸丰间
  dates_known: true
- name_zh: 向荣
  score: 8
  worth_why: 提督向荣拥兵南来援武昌，与太平军鏖战洪山长墙，此后追击至江南大营，是太平天国前期清军主将的完整做事流
  era: 清嘉道咸间
  dates_known: true
- name_zh: 双福
  score: 7
  worth_why: 江南提督留楚助防，与常大淳共守武昌，下令悬灯备械、户出一人警夜，城破死之，守城执行层面的完整周期
  era: 清咸丰间
  dates_known: true
- name_zh: 陈徽言
  score: 6
  worth_why: 亲历武昌围城并以日记体逐日记录，编保甲行十家牌、查船编号等治安细节皆出其笔，著《武昌纪事》为围城第一手史料
  era: 清咸丰间
  dates_known: true
