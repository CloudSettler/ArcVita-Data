source: 史藏/志存记录/水城县事杂述.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 赵昱
  score: 8
  worth_why: 传文最详，就火光读书寒门成学，执教六十三载，创办官立两等小学与第二高小附国文专修科，德行化乡里，排解纷争代雪冤抑，做事流完整且有地方教育制度开创之功
  era: 清末民国
  dates_known: false
- name_zh: 喻济丞
  score: 7
  worth_why: 任水城通判时逢豺患噬人，作牒城隍文并统筹伐林募苗猎除患，是地方官应对民生灾害的完整做事案例，所遗牒文为罕见古文样本
  era: 清光绪壬寅前后
  dates_known: false
- name_zh: 赵和亭
  score: 6
  worth_why: 庚子奇荒中捐薪俸一千两派绅购米平粜，是荒政中率先行动的武职官员，可作赈灾链条的起点人物
  era: 清光绪庚子年
  dates_known: false
- name_zh: 张运芙
  score: 6
  worth_why: 奉委携拨银三千两来水赈济，委绅买粮平粜照给市价，使囤粮户尽出存粮，荒象始平，是官办赈灾的关键执行者
  era: 清光绪庚子年
  dates_known: false
- name_zh: 唐正国
  score: 6
  worth_why: 辛酉剿匪夜袭中手刃十余人犹击杀不休，力战殉职，是平民保卫战中可歌可泣的牺牲者，有警示与感奋价值
  era: 民国辛酉年
  dates_known: false
- name_zh: 华延厘
  score: 5
  worth_why: 慨捐银五百两设厂施粥日济五六百人，荒政义举，然事迹仅一句
  era: 清光绪庚子年
  dates_known: false
rejections:
- name_zh: 马正清
  why_not: 土匪头目，事迹为劫掠攻硐勒索，无正面做事价值，仅作事件坐标
- name_zh: 杨得成
  why_not: 清水教倡乱称皇后旋即败逃被擒，事败速亡无完整周期，仅足为事件背景
- name_zh: 刘正坤
  why_not: 率匪围城索款焚掠，纯破坏性行为无可取做事流
- name_zh: 刘弼
  why_not: 奉派剿匪有夜袭一役，然传文简略无生平与决策脉络
- name_zh: 章应忠
  why_not: 与刘弼同来剿匪，无独立事迹
- name_zh: 李树贞
  why_not: 城绅奔告请援，仅一句功能性行为
- name_zh: 王国兴
  why_not: 富人遇匪被害，无做事事迹
- name_zh: 严治善等黉宫秀士百余人
  why_not: 仅名录罗列无事迹
- name_zh: 各科学员名录
  why_not: 选举门纯科名录，无个人事迹可考
