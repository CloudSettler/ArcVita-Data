source: 史藏/志存记录/水窗春呓.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 曾国藩
  score: 10
  worth_why: 祁门被围传令给三月薪水任去留以固人心；休宁兵败欲自杀经劝移营东流绝处逢生；设柜求言反被老讼师所败；金陵克复后功成退让推事李鸿章；杀李金旸不循常情。做事流完整且名场面密集，兼具模范与教训
  era: 清咸丰同治年间
  dates_known: true
- name_zh: 左宗棠
  score: 9
  worth_why: 少年题洞庭君祠联意态雄杰、梦中遇盗谈笑却之的逸事见其气概；与曾国藩气度交锋以诋文相激、晚年挽联悔心流露；弃将李楚材转而重用立功，知人之明与曾国藩对照鲜明
  era: 清道光至光绪年间
  dates_known: true
- name_zh: 王夫之
  score: 8
  worth_why: 国变后不剃发隐深山四十八年著书，自言吾书二百年后始显，遗书历毁于火而终由后人捐资重刊三百卷，预言应验；郡守登楼见之不自觉五体投地。隐居著述的完整做事周期与文化影响深远
  era: 明末清初
  dates_known: true
- name_zh: 江忠源
  score: 7
  worth_why: 秀水灾赈之法被称后人治谱：以站笼诛凶立威、誓神文胁捐、发护符告示驱绅捐银十余万、分册令捐户自给五日一报，制度设计与执行力俱佳，可为赈灾范本
  era: 清道光咸丰年间
  dates_known: true
- name_zh: 陈广敷
  score: 6
  worth_why: 工医兼工相术，断刘霞仙颧骨足以断制大事、称郭嵩焘为今之房杜、推曾国藩造为杜祁公文潞国一流，皆后验；预言天下大乱戡乱之人皆在三湘于粤贼未起之前。事迹略而有奇验，缓录
  era: 清道光年间
  dates_known: false
rejections:
- name_zh: 金安清
  why_not: 本书作者，以记闻视角串场，自身无完整做事周期
- name_zh: 李金旸
  why_not: 战败被陷逃归遭冤杀又幸存为僧，故事离奇但属个案异闻，非可效法之做事流
- name_zh: 李楚材
  why_not: 绝技三条与转投左营立战功有轮廓，但终成废人且细节单薄，附于曾左叙事即可
- name_zh: 徐并庋
  why_not: 仅有挽妓长联文事，无做事周期
- name_zh: 罗泽南
  why_not: 传中仅一笔带过，无事迹文本
- name_zh: 郭嵩焘
  why_not: 传中仅被相面称今之房杜，无自身做事记载
