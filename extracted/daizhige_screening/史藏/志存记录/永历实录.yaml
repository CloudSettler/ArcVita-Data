source: 史藏/志存记录/永历实录.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 瞿式耜
  score: 9
  worth_why: 拥立永历定策功臣；留守广西屡却孔有德、李成栋于桂林；迎驾谏诤；城破被执不屈与张同敞同殉国，做事流完整且为殉道典范
  era: 南明永历朝
  dates_known: true
- name_zh: 李定国
  score: 9
  worth_why: 本传后卷详载其两蹶名王（阵斩孔有德、尼堪）名场面；联明抗清始终不渝；磨盘山血战；闻永历凶问忧愤而死，成语与战役俱全
  era: 明末清初
  dates_known: true
- name_zh: 郑成功
  score: 9
  worth_why: 传中已见朱成功复福建沿海；史载其南京之役、收复台湾，驱荷复土为天下共知的名场面，做事周期完整
  era: 明末清初
  dates_known: true
- name_zh: 李成栋
  score: 8
  worth_why: 由降将而提兵破广州杀绍武帝，后举广东全省反正归明，迎驾疏辞征虏大将军印，终战死信丰；一生反复与反正抉择极具教训性
  era: 明末清初
  dates_known: true
- name_zh: 何腾蛟
  score: 8
  worth_why: 督师湖广，调驭诸镇复永州、衡州、全州；湘潭被执不屈绝食死，但猜刻致郝永忠攻陈友龙自坏长城，功过皆可资镜鉴
  era: 南明永历朝
  dates_known: true
- name_zh: 张献忠
  score: 8
  worth_why: 大西政权建立者，转战楚蜀、屠城据地的完整做事流，殪于凤凰山；其部将孙可望李定国别开局面，是评价农民军兴亡的关键样本
  era: 明末
  dates_known: true
- name_zh: 孙可望
  score: 8
  worth_why: 平沙定洲定云南、经营后方为南明续命之本，后与李定国内讧、挟主称国主、终降清失节，兴亡教训典型
  era: 明末清初
  dates_known: true
- name_zh: 金声桓
  score: 7
  worth_why: 以左良玉旧部降清镇江西，举全省反正归明，围赣州不下，南昌陷与王得仁姜曰广同死；反正决策的时机悲剧颇具深意
  era: 明末清初
  dates_known: true
- name_zh: 堵胤锡
  score: 7
  worth_why: 识拔联络李过高必正十三营忠贞营、招抚大顺余部联明抗清的第一人，复常德麻河大捷；协调诸镇力不从心，病殁军中
  era: 南明永历朝
  dates_known: true
- name_zh: 陈子壮
  score: 6
  worth_why: 拜表请讨绍武，举义兵复沿海州县、攻广州败死；岭南抗清义旗代表，但传中事迹较简
  era: 南明
  dates_known: true
- name_zh: 王夫之
  score: 6
  worth_why: 本书作者，曾在永历朝任职、举兵衡阳抗清，后隐石船山著书四十年成船山之学；晚节治学之做事流可为学者典范
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 朱由榔
  why_not: 君主低优先；本纪所载多为奔亡梧州桂林南宁缅甸的流亡路线，主要作时间坐标，无突出做事可立轴
- name_zh: 丁魁楚
  why_not: 定策拥立而拥赀弃军走岑溪败死，传文无完整做事周期
- name_zh: 马吉翔
  why_not: 仅为擅权佞幸，掌锦衣卫乱政，无可录之做事流
- name_zh: 刘承胤
  why_not: 挟主跋扈、捶宗室、降清，反面人物且事迹单薄
- name_zh: 王坤
  why_not: 宦官仅管文书房被逐，无事迹可录
- name_zh: 佟养甲
  why_not: 传文仅谋逆伏诛一句，无做事周期
- name_zh: 沙定洲
  why_not: 叛乱为孙可望平定之背景，传文简略
