  era: 明末清初
  dates_known: true
- name_zh: 孙可望
  score: 8
  worth_why: 从张献忠养子到据滇黔挟持永历帝的完整做事流；扶明渝盟反复终至降清，是权力膨胀败亡的典型教训
  era: 明末清初
  dates_known: true
- name_zh: 白文选
  score: 7
  worth_why: 折箭自誓必杀可望；还兵权后下关丁当山力战；忠义与愧悔交织做事线完整
  era: 明末清初
  dates_known: true
- name_zh: 刘文秀
  score: 7
  worth_why: 收编可望溃兵三万练兵备边；遗表请驾幸蜀出营陕洛的转败为功之策，临终战略眼光可录
  era: 明末清初
  dates_known: true
- name_zh: 钱邦芑
  score: 7
  worth_why: 为僧守节拒孙可望官爵；密连旧臣开导白文选离间逆党，樽俎间运筹之功不逊疆场
  era: 明末清初
  dates_known: true
- name_zh: 沐天波
  score: 6
  worth_why: 建议入缅据大理两关之险以图后举的路线决策；被缅酋胁迫行臣礼之辱，见证沐氏世镇之终
  era: 明末清初
  dates_known: true
- name_zh: 程源
  score: 6
  worth_why: 被胁降可望后密连行在旧臣并进言使功莫如使过助文选复兵权，曲折中反正有可录决策
  era: 明末清初
  dates_known: false
