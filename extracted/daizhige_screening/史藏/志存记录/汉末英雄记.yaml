- name_zh: 吕布
  score: 9
  worth_why: 刺董卓、辕门射戟解斗、鼓筝诈死脱袁绍之谋，做事流与名场面俱全，反复无常终败亡为典型教训
  era: 东汉末年
  dates_known: true
- name_zh: 董卓
  score: 9
  worth_why: 废立天子、郿坞积财、暴虐致天下大乱，终身死族灭尸油为灯，反面教训完整深刻
  era: 东汉末年
  dates_known: true
- name_zh: 袁绍
  score: 7
  worth_why: 董卓议废立时横刀长揖而去，名场面；谋诛宦官、讨董盟主至官渡之败全程可考
  era: 东汉末年
  dates_known: true
- name_zh: 曹纯
  score: 7
  worth_why: 十四丧父理家、敬爱学士、二十岁起从曹操征战，为虎豹骑统帅，少有治事之才
  era: 东汉末年
  dates_known: true
- name_zh: 李傕
  score: 6
  worth_why: 与郭汜合谋攻长安酿成大乱，人相食谷一斛五十万，乱政败亡可为警示；本传事迹稍简
  era: 东汉末年
  dates_known: true
- name_zh: 王允
  score: 6
  worth_why: 定计诛董卓安汉室，事败不逃曰奉身以死之，气节可录；本篇仅片段
  era: 东汉末年
  dates_known: true
- name_zh: 高顺
  score: 6
  worth_why: 平郝萌之乱斩首靖内，治军严整，忠而不用终随吕布覆灭，教训可取
  era: 东汉末年
  dates_known: true
- name_zh: 袁术
  score: 5
  worth_why: 割据淮南终至称帝败亡，可作僭号教训；本篇仅见其致吕布书
  era: 东汉末年
  dates_known: true
