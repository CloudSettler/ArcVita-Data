source: 史藏/志存记录/江上孤忠录.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 阎应元
  score: 10
  worth_why: 江阴八十一日守城战总指挥；草人借箭、束薪为炬等名场面；典史出身力挽孤城，留发不留头抗薙发令的象征性人物；做事流完整有始有终
  era: 明末清初
  dates_known: true
- name_zh: 陈明遇
  score: 8
  worth_why: 起义首倡者，宽仁得众心；迎阎应元入城并让贤主北门，与阎同心守城至死；有完整起事-让贤-殉城周期
  era: 明末清初
  dates_known: true
- name_zh: 冯厚敦
  score: 6
  worth_why: 训导身份参与守城殉难，事迹相对简略但可作守城群体核心佐证
  era: 明末清初
  dates_known: false
- name_zh: 季世美
  score: 6
  worth_why: 冲锋营首倡者，申港之战以假炮疑兵、三鼓造饭调度有据，阵亡于虞门之战；有可考战役细节但周期偏短
  era: 明末清初
  dates_known: false
rejections:
- name_zh: 方亨
  why_not: 降清知县，推行薙发令激变民众，事后被杀；无独立做事价值仅作背景
- name_zh: 莫士英
  why_not: 缴印献马求荣的权宜小吏，无做事周期
- name_zh: 刘良佐
  why_not: 降将劫主献城，攻江阴无功而返；已有库中明末人物可作坐标，不重复录入
- name_zh: 顾元泌
  why_not: 巡守守备，私易请援文书通敌内应被诛；属反面配角无完整做事流
- name_zh: 夏维新
  why_not: 主粮饷文书事务，事迹零散不构成完整周期
- name_zh: 周瑞龙
  why_not: 声言协助却索犒观望、遇战即退扬帆去，无忠义做事价值
