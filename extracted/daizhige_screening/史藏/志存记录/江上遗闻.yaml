source: 史藏/志存记录/江上遗闻.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 阎应元
  score: 10
  worth_why: 江阴八十一日守城战主盟者；典史出身临危受命，草人借箭、大料居民、整编保甲、斩克减军饷者立威；与士卒同苦乐，亲解佩刀赠死士；答刘良佐劝降以忠臣不事二君，叱降将吴志葵；铁丸贯臂犹握刀杀敌；江阴殉国名场面与教训俱全，遗言应元一典史尚知忠义，足为后世楷模
  era: 明末清初
  dates_known: true
- name_zh: 陈明遇
  score: 9
  worth_why: 江阴起事首主其事的典史；宽仁得众心，抚慰战士至流涕；荐请阎应元主盟而自任协守，日夜卧城上，城破计不旋踵以身殉国；与阎应元刚柔相济，宽严互补的守城双璧，做事流完整可考
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 方亨
  why_not: 降清新令，严格执行薙发令激起民变，被拘被杀；仅为守城起事的触发点，无值得效法或警示的做事流
- name_zh: 莫士英
  why_not: 缴印献马迎降之主簿，后被杀，无做事周期
- name_zh: 刘光斗
  why_not: 御史迎降，仅一句提及，无事迹
- name_zh: 顾元泌
  why_not: 守城初协防，后私易请兵文通敌，被诛；反面人物但事迹零碎，做事流不完整
- name_zh: 邵康公
  why_not: 临时被立为帅，御敌不克置狱，事迹简略
- name_zh: 周瑞龙
  why_not: 借兵索犒、战不利扬帆去，无完整做事周期
- name_zh: 黄明江
  why_not: 善弩入城协守，仅数十字记载，事迹简略
- name_zh: 程璧
  why_not: 首输三万五千金助饷、拒降书，但仅此一节，无完整做事流
