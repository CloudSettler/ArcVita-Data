source: 史藏/志存记录/江阴城守后纪.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 阎应元
  score: 10
  worth_why: 江阴八十一日守城战的灵魂人物；典史之微而任天下之重，组织户籍、劝输军饷、分城布防、发明火器铁挝，城破被俘挺立不屈骂不绝口而死；「八十日戴发效忠」名场面顶级，忠烈典范
  era: 明末清初
  dates_known: true
- name_zh: 陈明选
  score: 8
  worth_why: 典史陈明选（明遇）识贤让贤，夜驰骑迎阎应元共守；分守西门，城破下马搏战身负重创手握刀僵立倚壁不仆；与阎应元并称「陈、阎二典史于一城见义」
  era: 明末清初
  dates_known: true
- name_zh: 许用德
  score: 6
  worth_why: 诸生首倡义举，悬明太祖御容于明伦堂率众拜哭「头可断，发不可剃」；制乐府五转曲令善讴者歌之城上，城破阖室自焚；义发起点名场面
  era: 明末清初
  dates_known: false
- name_zh: 邵康公
  score: 5
  worth_why: 徽商娴武事被众拜为将，招兵御敌，然出战不克；可作守城初期阶段的配角
  era: 明末清初
  dates_known: false
- name_zh: 戚勋
  score: 5
  worth_why: 中书协守入城，力不支大书于壁「戚勋死此。勋之妻若女子若媳死此」，阖门自焚；烈烈家风可作事件人物
  era: 明末清初
  dates_known: false
rejections:
- name_zh: 刘良佐
  why_not: 降将反面角色，城下劝降被驳惭去，无完整可誉做事流且已在反面教训层面附于阎应元叙事
- name_zh: 周瑞龙
  why_not: 约战无功下船逃去，事迹单薄
- name_zh: 黄略
  why_not: 仅一句分守东门，无做事周期
- name_zh: 程璧
  why_not: 仅首捐二万五千金一事，事迹过简
