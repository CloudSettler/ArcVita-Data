    start_date: 1645-10
    highlight_event_id: guji-阎应元-event-death
  decisions:
  - date: 1645-05
    title_zh: 单骑赴申港解谕乡乱
    rationale: 县主无策，诸生分乡劝谕无效，我以典史之职单骑入乱乡，以理义利害说散乱民
  - date: 1645-08
    title_zh: 应陈明遇之请入城主守
    rationale: 城中主事者自知才不及我，遣人迎我统辖城守；明知大势难回，仍以节义自任
  - date: 1645-09
    title_zh: 拒绝刘良佐城下劝降
    rationale: 降将刘良佐至城下说降，我答以有降将军、无降典史，坚守气节以固军心
  - date: 1645-10
    title_zh: 城破不降，殉节而死
    rationale: 清贝勒压境、城陷在即，我自刎未殊被执，终不屈遇害，以身殉城
events:
- id: guji-阎应元-event-birth
  person_qid: guji-阎应元
  title_zh: 阎应元生
  summary: 生年无可考，明末任江阴典史
- id: guji-阎应元-event-recon
  person_qid: guji-阎应元
  title_zh: 单骑至申港解谕乱民
  date: 1645-05
  year_of: 1645
  summary: 崇祯帝殉国凶问至，江阴市井乘乱抢掠，县主无策，阎应元单骑赴申港，以理义利害解散乱众
- id: guji-阎应元-event-enter
  person_qid: guji-阎应元
  title_zh: 受陈明遇之请入城总揽守务
  date: 1645-08
  year_of: 1645
  summary: 剃发令激变，江阴倡义守城，典史陈明遇自知不如阎应元，迎其入城主持城守大计
- id: guji-阎应元-event-defense
  person_qid: guji-阎应元
  title_zh: 统孤城血战清军八十一日
  date: 1645-08
  year_of: 1645
  summary: 阎应元调度兵粮器械、编伍登陴，屡挫清军强攻与劝降，孤城抗二十余万之众八十余日
- id: guji-阎应元-event-refuse
  person_qid: guji-阎应元
  title_zh: 城下答降将有降将军无降典史
  date: 1645-09
  year_of: 1645
  summary: 降将刘良佐亲至城下劝降，阎应元厉声答以有降将军、无降典史，拒降以励全城
- id: guji-阎应元-event-death
  person_qid: guji-阎应元
  title_zh: 城破被执不屈殉节
  date: 1645-10-09
  year_of: 1645
  summary: 清军合力攻陷江阴，阎应元自刎不殊被俘，不屈遇害，全城殉难者众，史称江阴八十一日
- id: guji-阎应元-event-memorial
  person_qid: guji-阎应元
  title_zh: 后世立祠祀阎陈二公
  date: 1695
  year_of: 1695
  summary: 康熙间韩菼谒阎、陈二公祠，搜罗散逸编次城守始末，江阴殉义之事得以传世
