source: 史藏/志存记录/江阴城守纪.md
category: 史藏/志存记录
person:
  qid: guji-阎应元
  name_zh: 阎应元
  names:
    zh: 阎应元
    en: Yan Yingyuan
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年无考
    death:
      date: 1645-10-09
      precision: day
      is_circa: true
      raw: 顺治二年八月城破遇害
  era: 明末清初
  reign_ref: 弘光元年／顺治二年乙酉
  archetype: 以典史之微职统孤城抗大军的殉节统帅
  dilemmas:
  - 新朝已定大势，守城则十万人肝脑涂地，降则背弃纲常节义
  - 官职卑微（典史），却要统辖全城士民、调度兵粮与名将劝降压力
  - 城破在即，弃城可活，殉城则身死族灭
  lesson: 位卑未敢忘忧国——小吏亦可担孤城之重，八十一日守城为后世留下气节与担当的典范，然亦警示逆势而战的惨烈代价
  summary_first_person: 我本是江阴一介典史，卸任闲居。乙酉年剃发令下，乡邦汹汹，陈明遇以城事相托，我遂率家丁入城，与全城士民共守八十余日。清军二十余万围攻，我修城缮械、击退强攻，刘良佐来劝降，我答以有降将军、无降典史。城破之日，我自刎不殊，被执不屈而死。头可断，发决不可薙。
endeavors:
