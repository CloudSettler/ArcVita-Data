  worth_why: 崇祯四年临危受命出使沈阳，面对后金诘问拒不借兵攻明、坚守国书不削年号之礼，引苏武持节自况，片言折服强胡全节而归；有亲撰沈阳日记存做事全周期（缘起、差使、对答、复命、外任），生卒行事可考，可为使臣折冲樽俎之典范
  era: 明末朝鲜仁祖朝
  dates_known: true
