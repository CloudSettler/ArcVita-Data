candidates:
- name_zh: 吐谷浑
  score: 8
  worth_why: 因马斗一言而千里西迁，开拓青海建国，子孙以父字为氏，形成延续三百余年的政权，做事流完整
  era: 西晋至南北朝
  dates_known: true
- name_zh: 阿豺
  score: 7
  worth_why: 兼并羌氐号为强国，受封浇河公，遣使贡宋，吐谷浑中兴关键人物
  era: 南北朝
  dates_known: true
- name_zh: 慕璝
  score: 7
  worth_why: 击破乞伏茙蔓扩地，又大败赫连定拥十余万口之众，以小国胜强敌的名场面
  era: 南北朝
  dates_known: true
- name_zh: 夸吕
  score: 6
  worth_why: 在位近百年称可汗，建伏俟城，屡与周隋对抗，长周期做事者
  era: 南北朝至隋
  dates_known: true
- name_zh: 伏允
  score: 6
  worth_why: 国破后借党项复国，隋唐之间反复周旋，最后败亡的教训样本
  era: 隋末唐初
  dates_known: true
- name_zh: 郭元振
  score: 8
  worth_why: 上《安置降吐谷浑状》，主张顺其情分其势安置降部，边政制度设计的经典决策文书
  era: 武周
  dates_known: true
