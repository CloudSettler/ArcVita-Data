- name_zh: 王恕
  score: 8
  worth_why: 弘治初首召入吏部，拒苞苴立门榜正风气，屡直谏救言官，成一代名臣典型
  era: 明弘治
  dates_known: true
- name_zh: 马文升
  score: 8
  worth_why: 经略哈密，养威持重终服阿黑麻、复陕巴金印，兴复哈密为明代西域经略名场面
  era: 明弘治
  dates_known: true
- name_zh: 钱福
  score: 6
  worth_why: 会试廷试皆捷、不属草而成三千言名文，惜行检不立终身黜，可为才与品的教训
  era: 明弘治
  dates_known: true
- name_zh: 明孝宗
  score: 7
  worth_why: 幼匿西宫生还登极、放省珍禽减费、任用王恕马文升开弘治中兴，太子生母纪氏之死为宫廷案
  era: 明成化至弘治
  dates_known: true
