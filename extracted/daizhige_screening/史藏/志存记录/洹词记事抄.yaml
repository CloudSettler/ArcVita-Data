candidates:
- name_zh: 崔铣
  score: 7
  worth_why: 正德朝拒长揖刘瑾风骨可书；议大礼上疏直谏；亲勘句容朱家巷实据而寝兴王之基之议，考察完整且著洹词有经世之论
  era: 明弘治至嘉靖间
  dates_known: true
- name_zh: 韩琦
  score: 7
  worth_why: 一生践履惟事论语；决澶渊之征；秉直大功人不怨不忌，晚镇北门，成事流与节操皆可为范
  era: 北宋
  dates_known: true
- name_zh: 张浚
  score: 6
  worth_why: 富平淮西符离两败而轻民命，误国复雠之局可作教训型案例，惜文本多摘评非全传
  era: 南宋初
  dates_known: true
- name_zh: 寇准
  score: 6
  worth_why: 决澶渊之征为名场面，而晚溺天书成晚节警示，做事流半全
  era: 北宋
  dates_known: true
- name_zh: 王安石
  score: 6
  worth_why: 变法误兴邦、弟安国哭谏灭门之谶，教训典型；然此书仅零评无做事周期全貌
  era: 北宋神宗朝
  dates_known: true
