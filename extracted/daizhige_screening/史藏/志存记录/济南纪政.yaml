candidates:
- name_zh: 徐榜
  score: 8
  worth_why: 明嘉靖前后治济南四年，却酒拒馈、荒年方书喻政救民、平杨化奇冤、烛破赵守道冤狱，兼办社学建明湖书院，去任囊箧萧然以清白传家，做事流完整且可为吏治典范
  era: 明代
  dates_known: true
rejections:
- name_zh: 徐生
  why_not: 仅滕县饥民受济获还魂奇遇，属徐榜政绩配角人物，无独立做事周期
- name_zh: 赵守道
  why_not: 冤狱中被诬角色，经徐榜atisation烛冤获释，无自主做事流
- name_zh: 杨化
  why_not: 被害军丁，附魂申冤属传奇叙事主干为徐榜断案，非独立可考人物
- name_zh: 于大郊
  why_not: 谋财害命凶犯，供认伏法案犯，无可录做事周期
- name_zh: 于得水
  why_not: 李氏之夫，诉请还魂的配角，事迹简略无私人事流
