events:
- id: guji-徐佩瑗-event-juju
  title_zh: 设局于家，招募太湖义勇保障一方
  date: 1860-06
  year_of: 1860
  summary: 咸丰十年苏州陷后，徐佩瑗于东永昌家中设局，募太湖等处义勇，与马寿共保一方。
- id: guji-徐佩瑗-event-qingxiang
  title_zh: 赴上海请饷银二十万、大炮十座、火药三千斤
  date: 1861-08
  year_of: 1861
  summary: 咸丰十一年八月，徐佩瑗至上海求饷，获薛焕札与官衔蓝翎，造长龙船数十。
- id: guji-徐佩瑗-event-jiechuan
  title_zh: 忠王李秀成借其火炮火药并长龙船十号攻杭州
  date: 1861-10
  year_of: 1861
  summary: 李秀成向徐佩瑗借炮械船艇充攻杭头阵，被浙江巡抚王有龄夺获封奏，切责沪员用人。
- id: guji-徐佩瑗-event-beijin
  title_zh: 赴苏城拜忠王寿被疑禁闭
  date: 1862-01
  year_of: 1862
  summary: 徐佩瑗至苏州拜李秀成寿，适逢邑城归顺，太平军疑之，将其禁闭城中。
- id: guji-徐佩瑗-event-yuuhai
  title_zh: 李抚攻苏州时永昌旗帜充头阵，徐佩瑗被太平军所害
  date: 1863-01
  year_of: 1863
  summary: 李鸿章部攻苏州日以永昌徐旗帜充头阵，城内太平军忿甚，遂杀徐佩瑗。
