person:
  qid: guji-徐佩瑗
  name_zh: 徐佩瑗
  names:
    zh: 徐佩瑗
    en: Xu Peiyuan
  lifespan:
    birth:
      raw: 未详
    death:
      raw: 同治元年前后卒
  era: 清末太平天国时期
  reign_ref: 咸丰-同治
  archetype: 乱世保乡团练富民
  dilemmas:
  - 阳附太平军阴通清廷的两面周旋
  - 保全一方家园与身家名节难以兼得
  lesson: 乱世中依托乡里兴团练可保一方，但依附摇摆者终难免两猜，身死局灭；借势需自固有根本
  summary_first_person: 我是长洲永昌富民徐佩瑗。咸丰末太平军陷苏州，我在家乡设局招太湖义勇保障一方；后受清廷招抚，得道衔花翎，赴上海请饷银二十万、大炮十座，造长龙船数十；然火炮船械为忠王李秀成借去攻打杭州，我渐被猜疑，禁闭苏城。李鸿章攻苏州时我部充头阵，城内贼忿而害我；同治六年官方犹议恤我家捐米事。
  source_urls:
  - 史藏/志存记录/海角续编.md
