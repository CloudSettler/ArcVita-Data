  score: 9
  worth_why: 陈桥兵变黄袍加身、约束军队不夯市不戮一人得天下、杯酒释兵权削藩镇之权、终结唐末以来数十年兵乱，做事流完整且名场面极多
  era: 五代末北宋初
  dates_known: true
- name_zh: 赵普
  score: 9
  worth_why: 半部论语定天下；金匮之盟；强荐贤臣与太祖抗争；献削藩之策收精兵制钱谷，决策与担当俱佳
  era: 北宋初
  dates_known: true
- name_zh: 曹彬
  score: 7
  worth_why: 奉命伐江南平定江南后面对失信赏赐的困局，密赐五十万的故事展现君臣博弈与自处之道
  era: 北宋初
  dates_known: true
- name_zh: 韩通
  score: 5
  worth_why: 后周忠臣被杀于宋室取代之际，可作王朝更替的教训样本，但事迹简略刚愎无谋
  era: 五代末
  dates_known: false
