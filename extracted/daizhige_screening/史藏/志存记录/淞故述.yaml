verdict: has_candidates
candidates:
- name_zh: 李充嗣
  score: 8
  worth_why: 正德间督浚吴淞江与白茆河，动三郡之众费巨万，成前世治水未竟之功，此后十余年松江无大水患，做事流完整
  era: 明
  dates_known: true
- name_zh: 盛彦忠
  score: 7
  worth_why: 元末任华亭丞开白茆河，万人凿土，贝琼作白茆歌颂其爱民，有民谣式名场面
  era: 元末
  dates_known: false
- name_zh: 王源
  score: 8
  worth_why: 同知松江奏罢重额粮三十余万石、平反五虎之害与褚路诬奏冤狱百余家，功在松而无人传，去职遮留脱靴，大有可为
  era: 明宣德间
  dates_known: false
- name_zh: 王立中
  score: 7
  worth_why: 元季知松江府，首务兴学延五经师购十三经注疏，士习一新，科目人才甲江南，兴文教之范
  era: 元末明初
  dates_known: false
- name_zh: 郑珠
  score: 8
  worth_why: 任稻田提领所大使，为民奏免重赋，退还羡粮万余斛，日籴于市如贫人，能吏兼廉吏之则
  era: 元至正中
  dates_known: false
- name_zh: 陈章
  score: 6
  worth_why: 刑部郎中调佐瑞州，拒分太守库银万两之污并附籍上官，清风可表；有别诗传世
  era: 明弘治前
  dates_known: false
- name_zh: 王圭
  score: 7
  worth_why: 金山卫军籍出身，誓不第不过状元友人之门，成化中设计止郡守滥罚、收县令酷杖，刚直风骨足为后人则
  era: 明景泰至成化
  dates_known: true
- name_zh: 朱应祥
  score: 5
  worth_why: 建默易台读易，狂放敢言，事迹简略
  era: 明
  dates_known: false
rejections:
