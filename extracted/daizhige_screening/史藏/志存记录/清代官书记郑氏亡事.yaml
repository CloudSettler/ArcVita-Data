candidates:
- name_zh: 郑芝龙
  score: 7
  worth_why: 海盗起家就抚居泉州成海商巨擘；降清后被羁京师利用招抚其子成功；最终遭栽罪被殛于柴市并灭家，做事流完整且是欲加之罪的教训样本
  era: 明末清初
  dates_known: true
- name_zh: 郑成功
  score: 8
  worth_why: 大败于江宁后计取台湾徙居、立法定屯垦；治家法严致诸将拒命而死，死状与死因多说不一，是关键决策与悲剧结局兼备的人物
  era: 明末清初
  dates_known: true
- name_zh: 郑经
  score: 6
  worth_why: 抵父拒命、遁守台湾、乘三藩之乱取漳泉诸郡又败退入海；因通乳母事引发郑氏内乱值得录入
  era: 南明台湾郑氏
  dates_known: true
- name_zh: 朱逖先
  score: 6
  worth_why: 该书按语作者即朱希祖，逐条考辨清代官书之诬栽与史书以讹传讹的成因如欲加之罪何患无辞，是史料考据方法的示范
  era: 近代
  dates_known: true
