candidates:
- name_zh: 尚巴志
  score: 8
  worth_why: 百余年三山交攻七十余战后统一琉球，复为一统，做事流完整，中山一世之雄
  era: 明初
  dates_known: true
- name_zh: 徐葆光
  score: 8
  worth_why: 册封琉球留居半年余，撰中山传信录六卷，纠明代册封使成书之疏谬，著述传信后世
  era: 清康熙
  dates_known: true
- name_zh: 舜天
  score: 7
  worth_why: 讨逆臣利勇复国建位，赏功罚罪民安国丰，创琉球字母伊鲁花，开国做事周期可考
  era: 南宋
  dates_known: true
- name_zh: 察度
  score: 7
  worth_why: 国人废乱政世子而立之，开启琉球通中国之始，奉表入贡，受赐三十六姓善操船者
  era: 元末明初
  dates_known: true
