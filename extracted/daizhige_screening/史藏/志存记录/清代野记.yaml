verdict: has_candidates
candidates:
- name_zh: 胡林翼
  score: 9
  worth_why: 就地筹饷就地练兵不费国库一文；调解鲍超与学使换帖定心稳军；遭星使构陷而天诛自解
  era: 清咸同之际
  dates_known: true
- name_zh: 恭亲王奕訢
  score: 8
  worth_why: 议政王总理军机，汰满用汉开中兴之局；亲王秉政自此始，去位而满焰复张
  era: 清咸同光之际
  dates_known: true
- name_zh: 肃顺
  score: 7
  worth_why: 重汉轻满搜罗人材，其用人风气为同治中兴伏笔，后被诛可作权臣教训
  era: 清咸丰
  dates_known: true
- name_zh: 彭玉麟
  score: 7
  worth_why: 十二字试探曾国藩东南半壁无主之问，名将而有隐志，场面极具戏剧性
  era: 清同治初
  dates_known: true
- name_zh: 曾国藩
  score: 8
  worth_why: 接彭玉麟劝进书即嚼毁之，忠节抉择名场面；中兴事业核心
  era: 清咸同
  dates_known: true
- name_zh: 慈禧太后
  score: 8
  worth_why: 文宗密谕焚毁之局、割臂示诚、慈安暴卒之疑；弄权轨迹完整可为教训
  era: 清咸同光宣四朝
  dates_known: true
- name_zh: 慈安太后
  score: 6
  worth_why: 持密谕而不敢用，终暴亡；优柔之教训，但事迹略
  era: 清咸同
  dates_known: true
- name_zh: 何桂清
  score: 6
  worth_why: 幼年占籍就试至三十余位封疆，保举王有龄，终败军伏法，起落可成一轴
  era: 清咸丰
  dates_known: true
- name_zh: 王有龄
  score: 6
  worth_why: 受何桂清三上折保举任浙抚，杭城再陷城亡与亡，不负举主
  era: 清咸丰
  dates_known: true
- name_zh: 鲍超
  score: 6
  worth_why: 功高被侮欲散军心，经胡林翼调停归于平静，湘军将帅生态一景
  era: 清咸同
  dates_known: true
- name_zh: 钱宝青
  score: 5
  worth_why: 挟欲查办构陷胡鲍，写复奏时暴死，警示构陷者，但事迹过短
  era: 清咸丰
  dates_known: true
