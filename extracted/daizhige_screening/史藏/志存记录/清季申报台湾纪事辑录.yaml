source: 史藏/志存记录/清季申报台湾纪事辑录.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 刘铭传
  score: 9
  worth_why: 抗法保台，首任台湾巡抚，建省、修铁路、办新政，台湾近代化奠基人
  era: 清季
  dates_known: true
- name_zh: 沈葆桢
  score: 9
  worth_why: 牡丹社事件后钦差渡台，开山抚番、建恒春城、弛禁招垦，台湾经营始祖
  era: 清同治光绪间
  dates_known: true
- name_zh: 丁日昌
  score: 8
  worth_why: 续沈葆桢经营台湾，整饬防务、兴办洋务，有可考做事周期
  era: 清光绪初
  dates_known: true
- name_zh: 唐景崧
  score: 7
  worth_why: 署理台湾巡抚，甲午割台后短暂主政，台湾民主国成败教训
  era: 清光绪间
  dates_known: true
- name_zh: 刘璈
  score: 6
  worth_why: 分派台湾府县营汛，筹办台防，与刘铭传交恶去职，事迹半可考
  era: 清光绪间
  dates_known: true
- name_zh: 夏献纶
  score: 5
  worth_why: 台湾道任内兴学与番务经营可考，但事迹多见公务奏报
  era: 清同治间
  dates_known: true
rejections:
- name_zh: 文煜
  why_not: 传文多为循例抚恤奏报，仅任署闽浙总督作时间坐标
- name_zh: 王凯泰
  why_not: 折件多为例行会衔奏报，无完整做事周期
- name_zh: 张梦元
  why_not: 仅详报护送难夷一事，事迹过简
- name_zh: 李鸿高
  why_not: 仅革职拿办片一句，无事迹可考
- name_zh: 谢维垣
  why_not: 通事译讯角色，无做事周期
- name_zh: 松大着
  why_not: 遭风漂流的琉球难夷，仅有遭难经过无事业可录
- name_zh: 岛袋
  why_not: 同上，琉球船主难夷，无做事价值
