candidates:
- name_zh: 张伯行
  score: 8
  worth_why: 天下第一清官，密饬查拿噶礼贪腐科场案，反被诬革职，得康熙力保，清官与权臣正邪对决名场面
  era: 清康熙
  dates_known: true
- name_zh: 顾炎武
  score: 7
  worth_why: 甲申后奔走出都，康熙五年黄培诗狱被株连','', '幽絷济南半年
- name_zh: 噶礼
  score: 6
  worth_why: 江南科场婪赃数十万，纵客粜米出洋致米价腾贵，被母告忤逆凌迟，棺中复活被焚，警示贪虐之祸
  era: 清康熙
  dates_known: true
- name_zh: 高腾云
  score: 7
  worth_why: 马江之役力战死绥名场面，先料南洋援必不来，主张专攻孤拔，以小舰当三大舰中炮殉国
  era: 清光绪
  dates_known: true
- name_zh: 陈英
  score: 6
  worth_why: 上书合攻孤拔座船策见采，誓众报国，炮毁孤拔船致孤拔中炮死，自身望台中炮殉
  era: 清光绪
  dates_known: true
- name_zh: 年羹尧
  score: 6
  worth_why: 西陲威势煊赫，优礼旧师之子先威后厚结，其骄横气焰可作功高震主教训之侧证
  era: 清雍正前
  dates_known: true
- name_zh: 溥伟
  score: 5
  worth_why: 夺嫡怨望脉络完整，密建皇储旧事与其谋复辟奔走，教训儇薄无行终无所成
  era: 清末民初
  dates_known: true
