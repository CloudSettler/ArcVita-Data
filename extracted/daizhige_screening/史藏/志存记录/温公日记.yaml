  reign_ref: 宋仁宗至宋神宗、宋哲宗朝
  archetype: 直谏诤臣与史家
  dilemmas:
  - 忠于素履还是趋附新政：与王安石素善，然变法不合己意，宁求外任不苟同
  - 直言获罪还是循默保位：屡言张方平、吕惠卿之短，甘冒贬黜
  lesson: 当谏则谏，虽迂阔不改其守；以著述存变法争之是非于后世
  summary_first_person: 我与王安石本为故交，然青苗之法行，我屡于延和、崇政殿直言其非，论陈升之、吕惠卿之短，宁罢中丞求外补，不肯坏素履。神宗以手诏敦喻，命我进读《资治通鉴》，御制御书序文授我，纵横之术多华少实之辨亦于进读中陈之。世人谓我迂阔，我谓虑事深远者近于迂。
  source_urls:
  - 温公日记.md
