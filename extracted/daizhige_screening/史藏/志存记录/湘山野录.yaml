candidates:
- name_zh: 张咏
  score: 8
  worth_why: 号乖崖，两入蜀平王均李顺之乱，创交子质剂之法（交子制度起源的明确记载），欲学道陈抟被劝归仕途，治蜀典故丰富，做事流完整
  era: 北宋太宗真宗朝
  dates_known: true
- name_zh: 种放
  score: 8
  worth_why: 处士隐居却三不便之奏谏止真宗西幸长安，直言由盛转衰的关键决策；后沽誉求觐宠衰而亡，隐士双重人格的教训深刻
  era: 北宋真宗朝
  dates_known: true
- name_zh: 王旦
  score: 7
  worth_why: 为太尉知临江县夜计活死囚，其父王祐植三槐庭前预其必为三公，三槐王氏典故源头；相位上释褐治国断狱有政绩
  era: 北宋初
  dates_known: true
- name_zh: 惟净
  score: 7
  worth_why: 主持译经先识请罢以自保，译蠹木梵书时宁万死不妄称祥异，守学术诚实的模范；传世佛经翻译制度关键人物
  era: 北宋真宗仁宗朝
  dates_known: true
- name_zh: 夏竦
  score: 6
  worth_why: 每作诗举笔无虚致，师胡旦仍不以贵骄，燕雀诗婉言讽骄，事迹较片断
  era: 北宋真宗仁宗朝
  dates_known: true
- name_zh: 孙冕
  score: 6
  worth_why: 知姑苏年满题诗厅壁自请致仕，人生七十鬼为邻传诵一时，清节高操拂衣归九华，出处分明的士大夫典范
  era: 北宋真宗朝
  dates_known: true
- name_zh: 王钦若
  score: 5
  worth_why: 罢相出镇与孙冕对答见其狭促羞愧一面，不足以自成立传
  era: 北宋真宗朝
  dates_known: true
- name_zh: 杜衍
  score: 5
  worth_why: 七十三岁手疏自陈衰弊辞明堂大享亚献，明哲保身范例但仅一事
  era: 北宋仁宗朝
  dates_known: true
