source: 史藏/志存记录/滇载记.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 皮罗阁
  score: 9
  worth_why: 松明楼会五诏一举灭之统一六诏；贿结剑南求合五诏为一，建太和城定鼎苍洱，是南诏立国关键决策者
  era: 唐开元年间
  dates_known: true
- name_zh: 段思平
  score: 9
  worth_why: 起义灭大义宁建大理国；得奇戟神骥、三梦吉兆、军师解梦与浣妇指津等名场面；借兵三十七部，完整做事流
  era: 五代末至后晋天福
  dates_known: true
- name_zh: 阁罗凤
  score: 9
  worth_why: 天宝之战两破唐军，鲜于仲通六万、李宓全军二十万丧命；刻碑国门明叛唐非得已，立足云南为百年边患
  era: 唐天宝至大历
  dates_known: true
- name_zh: 异牟寻
  score: 9
  worth_why: 郑回说以大义复归唐；韦皋以书间吐蕃促其决断；自将数万大破吐蕃、献图纳贡受唐册封，改国大理封五岳四渎
  era: 唐代宗至德宗
  dates_known: true
- name_zh: 世隆
  score: 7
  worth_why: 僭称皇帝因名犯玄宗讳不臣；连年寇安南交阯邕州西川二十年，唐大虚耗其国亦弊，可作警示案例
  era: 唐懿宗咸通时期
  dates_known: true
- name_zh: 郑买嗣
  score: 7
  worth_why: 郑回之后世为清平，篡蒙氏建大长和；其家族历代经营蜀俘与教化归人为经画，做事周期可考
  era: 唐昭宗光化年间
  dates_known: true
rejections:
- name_zh: 各诏王劝龙晟劝利晟丰祐等世系诸王
  why_not: 传文多为立、改元、谥号世系罗列，无完整做事周期
- name_zh: 隆舜舜化真
  why_not: 委政臣下、内嬖被弑、失国于权臣，仅交代亡国节点无做事流
- name_zh: 赵善政杨于真
  why_not: 立国十月二年即被夺，事迹简略
- name_zh: 龙祐那张乐进
  why_not: 仅有受诸葛武侯封赐与逊位传说，无行动细节
