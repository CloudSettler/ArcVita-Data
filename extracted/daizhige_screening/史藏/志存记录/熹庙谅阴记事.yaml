candidates:
- name_zh: 熹宗（天启帝朱由校）
  score: 6
  worth_why: 挺击、红丸、移宫三大案皆在其即位之际处理，登极一月内决移宫、定泰昌年号，是晚明宫闱政争的枢纽人物；但本篇多记群臣言事，其本人做事流与后来宠信魏忠贤事记载简略
  era: 晚明
  dates_known: true
- name_zh: 左光斗
  score: 8
  worth_why: 独上疏请选侍移宫，直斥名分倒置将蹈武后覆辙，事成后又自请勿株连，原则与分寸兼备；东林六君子之死为他年（本篇未载）
  era: 晚明
  dates_known: true
- name_zh: 杨涟
  score: 8
  worth_why: 力促选侍即日移宫，排闼入宫据理力争，是移宫案主谋；后抗魏忠贤死劾二十四大罪（本篇未见），堪称骨鲠之臣
  era: 晚明
  dates_known: true
- name_zh: 方从哲
  score: 7
  worth_why: 首辅当红丸、移宫之冲，进揭定策、封还中旨，又独遭众口交攻，是台阁辅臣在议潮夹缝中的典型样本
  era: 晚明
  dates_known: true
- name_zh: 贾继春
  score: 6
  worth_why: 反向建言保全选侍，引孝宗万贵妃事立论，与杨涟针锋相对，正反两面的移宫论战可供对照
  era: 晚明
  dates_known: true
- name_zh: 熊廷弼
  score: 8
  worth_why: 经略辽东一年，遭姚宗文、冯三元群劾而去，连疏自辨乞勘，将帅与言官相讦致封疆失帅，是明亡辽事转折的可考做事周期
  era: 晚明
  dates_known: true
- name_zh: 袁应泰
  score: 6
  worth_why: 接替熊廷弼巡抚、经略辽东，后殉于辽阳之败（本篇未载），决策链节点人物
  era: 晚明
  dates_known: true
- name_zh: 李可灼
  score: 5
  worth_why: 进红丸而先帝暴崩，赏罚并行引发朝论大哗，红丸案的中心小人物，教训价值在制度失守
  era: 晚明
  dates_known: false
rejections:
