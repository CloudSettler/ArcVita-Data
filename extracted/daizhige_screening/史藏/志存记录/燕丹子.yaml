candidates:
- name_zh: 燕太子丹
  score: 8
  worth_why: 质秦受辱后蓄士谋秦，养荆轲三年以死士之礼相待，促成刺秦之举；招致秦伐燕身死国近亡，是好客任侠与急功误国的双重教训
  era: 战国末
  dates_known: true
- name_zh: 荆轲
  score: 10
  worth_why: 图穷匕见刺秦王，易水悲歌风萧萧兮易水寒壮士一去兮不复还；神勇之人怒而色不变，士为知己者死的极致典范与悲壮结局
  era: 战国末
  dates_known: true
- name_zh: 田光
  score: 7
  worth_why: 慧眼识荆轲荐于太子，因被疑泄密而吞舌自刎以明节，成全刺秦之谋的第一推手
  era: 战国末
  dates_known: false
- name_zh: 樊於期
  score: 6
  worth_why: 得罪于秦全家被害，穷归燕太子，闻荆轲借首级之谋慨然自刭献头以报仇雪耻
  era: 战国末
  dates_known: false
- name_zh: 曲武
  score: 5
  worth_why: 太子傅，献合纵连楚赵韩魏缓图秦之策，不被采纳而转荐田光，代表稳健派路线与冒险路线之争
  era: 战国末
  dates_known: false
