candidates:
- name_zh: 徐行健
  score: 6
  worth_why: 卫指挥抗倭，每战涅体书名示必死，手刃二倭战死，得荫叙；做事线完整可考
  era: 明嘉靖
  dates_known: true
- name_zh: 郑茂
  score: 7
  worth_why: 嘉靖倭乱守城二十余日不陷，西门纳难民日给升米，夜巡以饼菜抚严鞭怠，保土有功
  era: 明嘉靖
  dates_known: true
- name_zh: 汤克宽
  score: 7
  worth_why: 参将抗倭，应弦毙敌，随父平江洋大盗、平三沙叛，善射有据可考
  era: 明嘉靖
  dates_known: true
- name_zh: 沈腾蛟
  score: 6
  worth_why: 父卒十年后设宴割己田产之半予异母弟，成全先父不言之意，兄弟让产名场面
  era: 明
  dates_known: false
- name_zh: 包氏二子母杨氏
  score: 6
  worth_why: 严课二子相继成进士为侍御，长子诋宦者遭戍，母训名节共著，家教典范
  era: 明
  dates_known: false
- name_zh: 冯皋谟
  score: 6
  worth_why: 平张连后急流勇退，闲居三十余年，拒售旧邻田宅以全故里人情，处世可鉴
  era: 明万历
  dates_known: false
- name_zh: 宋氏
  score: 5
  worth_why: 割股疗姑而不使人知，邑侯表闾犹自谢未尝有此，孝行典型；属私德类
  era: 明
  dates_known: false
- name_zh: 石奇
  score: 5
  worth_why: 任粮长代狱中贫者完粮救其出，及小民告其多收反得令亲信，事有两面可作鉴戒
  era: 明万历
  dates_known: false
