source: 史藏/志存记录/独醒杂志.md
category: 史藏/志存记录
verdict: no_value
skip_reason: 《独醒杂志》为宋代笔记，所记多为掌故轶闻、诗话梦兆与孝行琐事，人物如包拯、蔡襄、刘沆、苏轼、蔡京等皆仅一二则趣谈，无完整做事周期与事业阶段，时间多不可考成体系
rejections:
- name_zh: 包拯
  why_not: 仅记杖斩无赖子一事以显威名，无做事周期
- name_zh: 蔡襄
  why_not: 仅孝亲祈寿轶事一则
- name_zh: 刘景宏
  why_not: 佯从彭玕保全州城一件事迹，且主要为刘沆家族兴起的铺垫
- name_zh: 杨行密
  why_not: 仅见宽政轻赋之侧面评述，无做事流
- name_zh: 李煜
  why_not: 仅记增赋与市马轶事，亡国主且无关键决策文本
- name_zh: 苏轼
  why_not: 仅为对答机锋与称赏谢民师琐记
- name_zh: 蔡京
  why_not: 仅记改制度与荐人对答断片，非其完整政治轨迹
- name_zh: 王钦若
  why_not: 微时画猪皮作诗一则轶闻
