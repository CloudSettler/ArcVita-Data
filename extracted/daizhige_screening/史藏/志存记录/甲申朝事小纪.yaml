verdict: has_candidates
candidates:
- name_zh: 魏忠贤
  score: 9
  worth_why: 自无赖自刑入宫至权倾朝野，结客氏、倾陷后宫、生祠遍天下，及杨涟劾其二十四款之关键博弈，祸国周期完整，后世教训深刻
  era: 明末天启年间
  dates_known: true
- name_zh: 客氏
  score: 8
  worth_why: 以乳母之身擅政，与魏忠贤表里为奸，堕张后胎、饿死裕妃，出宫仪仗拟于警跸，终被笞死焚尸扬灰，恶贯周期可考
  era: 明末天启年间
  dates_known: true
- name_zh: 崇祯帝
  score: 8
  worth_why: 铲除魏阉、勤政节俭之明君做派与刚愎疑臣之弊并存，终于甲申国变，万寿山殉国，王承恩同死，亡国周期完整足为鉴戒
  era: 明末崇祯朝
  dates_known: true
- name_zh: 王承恩
  score: 8
  worth_why: 国变之夕整内员、劝出亡、对酌至醉，最终引带扼脰殉君，忠义名场面，配葬思陵
  era: 明末
  dates_known: true
- name_zh: 朱由校（熹宗）
  score: 7
  worth_why: 天子好为匠，手操斧锯运斤成风，又创水戏奇法，西苑覆舟几溺，巧艺 BUFFER 与怠政失国构成独特教训
  era: 明末天启年间
  dates_known: true
- name_zh: 周钟
  score: 7
  worth_why: 降贼撰劝进表自比尧舜，与百户周基之死相映成耻，气节反面典型，可为教训
  era: 明末清初
  dates_known: true
- name_zh: 成妃李氏
  score: 6
  worth_why: 见裕妃饿死预藏干食于瓦砖缝中，绝饮食时赖以不死，急智求生可录
  era: 明末天启年间
  dates_known: false
