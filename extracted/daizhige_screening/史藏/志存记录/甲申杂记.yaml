candidates:
- name_zh: 马默
  score: 7
  worth_why: 知登州时建言废除沙门岛溢额投海虐制，改徙登州，神宗诏可著为定制，是司法制度改进的完整做事流；传文明言亲述，年代可考
  era: 北宋神宗朝
  dates_known: true
- name_zh: 吕大忠
  score: 6
  worth_why: 哲宗前奏对泄露吕大防被宽宥的内情，半月后遭言者论劾而有循州之贬，是轻易失言致祸的教训型做事流；后半段吕大防被贬与归葬见帝王之度
  era: 北宋元祐绍圣间
  dates_known: true
- name_zh: 彭子民
  score: 6
  worth_why: 随董必察访广西，垂泣以「人人家各有子孙」感悟董必，止遣小使臣过儋州，消解对苏轼苏子瞻的迫害升级，是仁心善念改变决策的名场面
  era: 北宋绍圣间
  dates_known: false
- name_zh: 董必
  score: 5
  worth_why: 察访广西欲遣人过儋州害苏轼，因彭子民一言感悟而止，是 Gu 恶念一念转善的关键决策节点；单独事迹简略宜与彭子蒙古合记
  era: 北宋绍圣间
  dates_known: false
