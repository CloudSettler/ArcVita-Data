source: 史藏/志存记录/癸辛杂识.md
category: 史藏/志存记录
verdict: no_value
skip_reason: 癸辛杂识为宋人笔记杂录，多为鬼梦、养生、园林琐闻，人物皆片段轶事，无完整做事周期与可考生卒，不达成事时间轴录入标准
rejections:
- name_zh: 周密
  why_not: 书序自述卧病辑录见闻，仅成书缘起，无完整做事流且已属著述琐记而非事功
- name_zh: 陈圣观
  why_not: 仅有占梦一事，属怪谈无做事周期
- name_zh: 李符
  why_not: 建言改春州贬所旋遭贬死，而非可考完整做事流
- name_zh: 王安石
  why_not: 仅载改春州为县一决定，无事迹文本支撑完整时间轴且已有立场仅作佐证
- name_zh: 贾似道（贾师宪）
  why_not: 仅搬运太湖石一事，败后抄没皆零星语焉不详
