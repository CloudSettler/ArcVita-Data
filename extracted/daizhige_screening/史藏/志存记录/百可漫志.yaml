- name_zh: 解缙
  score: 7
  worth_why: 七岁以诗诉里胥催征、指松为题应声成咏，才名早显，后为主编永乐大典名场面潜力大，时间可考
  era: 明初
  dates_known: true
- name_zh: 唐皋
  score: 6
  worth_why: 累蹶场屋十科被乡人讥诮而不堕其志，五十余岁连捷经魁、状元及第，有志者事竟成的典范
  era: 明中期
  dates_known: true
- name_zh: 林清
  score: 6
  worth_why: 避元不仕变易姓名，八音体诗应对惊服府公，终不见其踪，高士气节与神秘做事流俱备
  era: 元末明初
  dates_known: false
- name_zh: 余洙
  score: 5
  worth_why: 先拒司礼监聘、为师后鞭责锦衣子弟令其跪留，终不屈于人，风骨可鉴；惜事迹单线
  era: 明中期
  dates_known: false
- name_zh: 张巡检
  score: 5
  worth_why: 借梦局以十二僧作醮为饵，密点弓卒擒凶为二女雪冤，破案机变-course完整，缘起决定结果俱有
  era: 明代
  dates_known: false
- name_zh: 尹旻
  score: 5
  worth_why: 铨衡识鉴故事两则，断人前程屡验，惜所传为片段判语非完整做事周期
  era: 明中期
  dates_known: true
- name_zh: 郑汝昂
  score: 4
  worth_why: 善诗多滑稽，寄亲绝句妙趣，仅一诗一事，做事流过简
  era: 明代
  dates_known: false
