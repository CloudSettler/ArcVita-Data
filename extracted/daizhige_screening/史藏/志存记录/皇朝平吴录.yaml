source: 史藏/志存记录/皇朝平吴录.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 张士诚
  score: 9
  worth_why: 盐徒十八人起兵据高邮败脱脱百万军、建大周称吴王、开国治吴由盛转亡，做事周期完整，败于骄侈逸乐堪为教训
  era: 元末
  dates_known: true
- name_zh: 朱元璋
  score: 8
  worth_why: 龙潜濠城阴有安天下之志，采刘基先陈后张之策，灭士诚成帝业，战略决策名场面
  era: 元末明初
  dates_known: true
- name_zh: 徐达
  score: 8
  worth_why: 龙潭破敌、围常州擒张士德、执行太祖勿蹈诈术之训，名将做事流完整
  era: 元末明初
  dates_known: true
- name_zh: 李齐
  score: 7
  worth_why: 膝如铁岂为汝屈，骂贼被剐而死，气节名场面
  era: 元末
  dates_known: true
- name_zh: 杨完者
  score: 6
  worth_why: 苗军十万击退张士诚却因骄肆被达识与张氏合谋攻杀，权臣倾轧之教训
  era: 元末
  dates_known: false
- name_zh: 杨椿
  score: 6
  worth_why: 孤守娄门力战骂贼而死，妻王氏不屈觅尸，阖家殉城，气节可录
  era: 元末
  dates_known: false
- name_zh: 俞思齐
  score: 5
  worth_why: 向为贼不贡犹可今为臣可乎，直言弃官而隐，获骨鲠臣之称
  era: 元末
  dates_known: false
- name_zh: 张士德
  score: 5
  worth_why: 士诚谋主智勇兼备，被擒后劝兄降元替死，张氏成败转折点
  era: 元末
  dates_known: true
rejections:
- name_zh: 脱脱
  why_not: 本篇仅记其高邮一败与前此被谗，无完整做事流，元史中另有传
- name_zh: 达识帖睦迩
  why_not: 屡败妥协受制张氏，仅作衬托，做事无成
- name_zh: 周烈妇
  why_not: 事迹悲烈但为单一殉节片段，无做事周期
- name_zh: 廖永安
  why_not: 太湖被俘不屈囚死，事迹过简
- name_zh: 周伯琦
  why_not: 被留于吴文墨忘归，无做事周期
