candidates:
- name_zh: 商辂
  score: 8
  worth_why: 三元入相，化名应聘童子师受轻慢，以五次上坐经历折服主人，名场面生动且前后完整
  era: 明代中期
  dates_known: true
- name_zh: 黄文琛
  score: 8
  worth_why: 办理衡州教案，力排众议令教士自修教堂，避免民教相激开边衅，牒词自陈决策理由清楚，做事周期完整
  era: 清末咸同间
  dates_known: false
- name_zh: 邓显鹤
  score: 7
  worth_why: 辑沅湘耆旧集搜罗文献赅博，为湖湘文献保存之功臣，交游宏奖风流
  era: 清道光间
  dates_known: false
- name_zh: 孙鼎臣
  score: 6
  worth_why: 为王菽原所识拔，然传文仅一笔带过，事迹简略
  era: 清道光咸丰间
  dates_known: false
- name_zh: 郭嵩焘
  score: 7
  worth_why: 识拔于王菽原，又受曾国藩托以身后碑铭，与吴敏树并称；其生平他卷可补充
  era: 清道光同治间
  dates_known: true
- name_zh: 杨芳
  score: 6
  worth_why: 鸦片战争中收粪桶厌胜夷炮的荒诞举措可作反面教训，然此处仅轶事一则
  era: 清道光间
  dates_known: true
- name_zh: 和珅
  score: 6
  worth_why: 权倾朝野百官趋附成补子胡同，可作权力依附的教训，然本篇仅侧写
  era: 清乾隆间
  dates_known: true
- name_zh: 王闿运
  score: 6
  worth_why: 名重一时，贵人欲访不至与彭玉麟雪夜布鞋相访对照成趣，然事迹简略
  era: 清咸同光间
  dates_known: true
