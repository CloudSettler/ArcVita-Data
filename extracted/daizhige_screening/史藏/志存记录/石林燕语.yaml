      raw: 南宋初自述余年老，生卒传世为1077—1148
    death:
      date: '1148'
      precision: year
      is_circa: true
  birth_date: '1077'
  death_date: '1148'
  era: 两宋之际
  reign_ref: 宣和、建炎
  archetype: 藏书著述的士大夫
  dilemmas:
  - 避世与存史的冲突：避乱山谷不复交世事，又恐所见闻日以废忘
  - 兵火之后旧闻散佚，须决断裒集成书
  lesson: 乱世中士人以笔记存故实，散佚之存全赖及时笔札
  summary_first_person: 宣和五年我卜居卞山石林谷，远城市不复更交世事，纵谈故实旧闻随手笔札记之。建炎二年避乱缙云归，兵火荡析之后故人死徙略半，我亦老矣，恐平日见闻日以废忘，遂令栋裒集为十卷，以《石林燕语》名之。
  source_urls:
  - guji:石林燕语
