- name_zh: 朱元璋
  score: 9
  worth_why: 从和阳渡江觇江南、鄱湖鏖战至登极；宝钞造币、孝陵卫、积分法等制度建设；微行识贤、赦罪纳谏诸多名场面
  era: 元末明初
  dates_known: true
- name_zh: 朱棣
  score: 8
  worth_why: 靖难夺位后建听经楼导民向善，靖难之役为完整做事流；对句日照龙鳞万点金已显气象
  era: 明初
  dates_known: true
- name_zh: 建文帝
  score: 8
  worth_why: 削发逃亡藏于箧中见机保身；正统年间化老僧归朝验足认身，戏剧性极强，隐德与教训兼具
  era: 明初
  dates_known: true
- name_zh: 徐达
  score: 8
  worth_why: 与朱元璋间行买舟觇江南虚实；获赐旧内而机警辞表，忠谨全功名善终
  era: 元末明初
  dates_known: true
- name_zh: 马皇后
  score: 7
  worth_why: 贤人心肝一谏救文臣与工匠，以秀才文章即贤人心肝化解杀局，仁人之言其利溥
  era: 元末明初
  dates_known: true
- name_zh: 宋濂
  score: 7
  worth_why: 告老还乡御制诗饯别续诗；晚年因铁券事遭谪戍，功臣知识分子的浮沉教训
  era: 元末明初
  dates_known: true
- name_zh: 沈万三
  score: 7
  worth_why: 洪武一文生利之局暴露巨富政治处境；洪武钱三分利定律之由来，巨贾与皇权博弈名场面
  era: 元末明初
  dates_known: false
- name_zh: 郭英
  score: 7
  worth_why: 鄱阳湖之战两以火攻、一矢贯睛毙陈友谅，关键战役决胜点名场面
  era: 元末明初
  dates_known: true
- name_zh: 孙蕡
  score: 7
  worth_why: 因蓝玉题画株连临刑口占绝命诗黄泉无客舍，太祖闻诗并诛监斩者，文字狱血色教训
  era: 明初
  dates_known: true
- name_zh: 彭友信
  score: 6
