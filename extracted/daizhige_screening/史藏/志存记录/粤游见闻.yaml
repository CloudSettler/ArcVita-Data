source: 史藏/志存记录/粤游见闻.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 瞿式耜
  score: 9
  worth_why: 面对靖江王劫持持敕印不屈、神色不动，护定广西迎立永历，固守桂林，是南明擎天之臣，做事流完整且忠烈模范
  era: 明末清初
  dates_known: true
- name_zh: 朱聿键
  score: 8
  worth_why: 由凤阳高墙囚徒至隆武帝，亲征、改元、欲依赣楚恢复大计，受制郑芝龙而败，可作南明抗清时间轴焦点人物
  era: 南明
  dates_known: true
- name_zh: 黄道周
  score: 8
  worth_why: 与郑芝龙争班列、孤军督师救徽州被俘，骂洪承畴不屈绝食而死，名场面鲜明，气节典范
  era: 南明
  dates_known: true
- name_zh: 金声
  score: 7
  worth_why: 绩溪山中立十三营抗清，拒降被执，合门自缢，死后尸不仆洪承畴不敢出，做事流较完整且有戏剧性节点
  era: 南明
  dates_known: true
- name_zh: 焦琏
  score: 6
  worth_why: 昔负永明王西驰脱险，后夜缒城擒杨国威平靖江之乱， twice 关键行动，但事迹记载简略
  era: 南明
  dates_known: false
- name_zh: 路振飞
  score: 6
  worth_why: 护唐王出高墙有旧恩，隆武购访入阁，护驾之功可入时间坐标，但本篇做事细节有限
  era: 明末南明
  dates_known: false
rejections:
- name_zh: 靖江王朱亨嘉
  why_not: 篡位自立旋败被囚死，属反面插曲无完整正向做事流，可作他人事件背景
- name_zh: 郑芝龙
  why_not: 本篇仅见阻驾、降清线索，无完整做事周期，需别传补足后再录
- name_zh: 陈邦傅
  why_not: 仅讨靖江一胜，后续记载缺失
- name_zh: 杨廷麟
  why_not: 仅守赣州一句，无做事流
- name_zh: 马士英
  why_not: 仅充办事官一句，无事迹
- name_zh: 张献忠
  why_not: 仅作破衡州背景提及
- name_zh: 沙定周
  why_not: 云南土司之乱真伪莫辨，事迹遥不可考
