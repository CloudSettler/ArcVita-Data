candidates:
- name_zh: 王之寀
  score: 8
  worth_why: 挺击案首发者，散饭狱底密叩张差得真情，以刑曹小官撬动宫廷大狱，胆识与办案智慧俱佳
  era: 晚明万历天启
  dates_known: true
- name_zh: 杨涟
  score: 9
  worth_why: 首发移宫之案，后抗疏劾魏忠贤二十四大罪，身死诏狱，东林气节之标志
  era: 晚明泰昌天启
  dates_known: true
- name_zh: 孙慎行
  score: 7
  worth_why: 首发红丸之案，以礼部尚书抗论逆党，士大夫气节可鉴
  era: 晚明泰昌天启
  dates_known: true
- name_zh: 左光斗
  score: 7
  worth_why: 参与三案申救，后与杨涟同死阉狱，东林君子典型
  era: 晚明天启
  dates_known: true
- name_zh: 魏忠贤
  score: 8
  worth_why: 乱政擅权，指编三朝要典罗织正人，明代阉祸顶峰，教训级人物
  era: 晚明天启
  dates_known: true
- name_zh: 方从哲
  score: 7
  worth_why: 浙党魁首，红丸进药之传奏引进者，三案争议核心，止于迎合之臣教训样本
  era: 晚明万历泰昌
  dates_known: true
- name_zh: 郑国泰
  score: 6
  worth_why: 挺击案幕后行贿灭口的主嫌，宫闱阴谋样本
  era: 晚明万历
  dates_known: false
- name_zh: 申时行
  score: 6
  worth_why: 首请建储而致国本之争十六年拖延，首辅调停术的功过样本
  era: 晚明万历
  dates_known: true
