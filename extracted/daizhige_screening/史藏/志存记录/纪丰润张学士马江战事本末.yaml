source: 史藏/志存记录/纪丰润张学士马江战事本末.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 张佩纶
  score: 9
  worth_why: 清流名臣，疏劾权贵、智斗马江战局，遭构陷赴闽督战，船政备战却受枢臣掣肘终至马江之败，台湾弃甲走；其一生起落与责任困局足为后世镜鉴
  era: 清光绪
  dates_known: true
- name_zh: 李鸿章
  score: 8
  worth_why: 中枢重臣兼军事外交操盘者，力主和议、识才敬士、与张佩纶深谈力阻开战，其决策贯穿马江战事全局
  era: 清光绪
  dates_known: true
- name_zh: 左宗棠
  score: 8
  worth_why: 创设马尾船厂、规画船政全局；西征用兵、洋务建设，做事流完整
  era: 清同治光绪
  dates_known: true
- name_zh: 沈葆桢
  score: 7
  worth_why: 以乡绅任船政、立船坞于马尾，奠定近代海军基础
  era: 清同治
  dates_known: true
- name_zh: 刘永福
  score: 7
  worth_why: 起黑旗兵与法军屡战，抗法名场面，藩属存亡角力中的关键人物
  era: 清光绪
  dates_known: true
- name_zh: 张之洞
  score: 7
  worth_why: 清流健将与洋务巨擘，与张佩纶等究心中外利弊，晚清建设重臣
  era: 清光绪
  dates_known: true
- name_zh: 陈宝琛
  score: 6
  worth_why: 清流名士，与张佩纶同砥砺时务，后有大用之迹
  era: 清光绪
  dates_known: true
- name_zh: 吴观礼
  score: 6
  worth_why: 赞画左宗棠军务、器识过人、以道德事业砺张佩纶，惜早逝为文之眼
  era: 清光绪
  dates_known: true
- name_zh: 孤拔
  score: 6
  worth_why: 法海军统帅，募汉奸入马尾、先下手突袭，马江之战另一方主角
  era: 清光绪
  dates_known: true
rejections:
- name_zh: 何如璋
  why_not: 传中仅卸任交舰、匿战书半年，做事流残缺
- name_zh: 阎敬铭
  why_not: 仅执手赠言一句，无做事周期
- name_zh: 宝廷
  why_not: 仅列名清流，无事迹文本
