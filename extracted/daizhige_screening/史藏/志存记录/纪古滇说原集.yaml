source: 史藏/志存记录/纪古滇说原集.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 庄蹻
  score: 8
  worth_why: 楚将循江略地至滇称王，会秦断归道遂王滇，古滇建国筆始，斩雝闿的是孟获事在诸葛亮条，庄蹻事迹完整可分缘起与结果
  era: 战国末至秦
  dates_known: false
- name_zh: 张仁果
  score: 7
  worth_why: 白氏国滇王肇基白崖，坚守三纲六艺，受汉册封为一方立国王者，均有叙事周期
  era: 汉武帝时
  dates_known: false
- name_zh: 诸葛亮
  score: 9
  worth_why: 南征七纵七擒孟获立铁柱改郡，断九隆山脉气，南中制度化
  era: 三国蜀汉
  dates_known: true
- name_zh: 史万岁
  score: 7
  worth_why: 平南宁羌爨翫，遇孔明纪功碑预言一段名场面，做事起讫可考
  era: 隋
  dates_known: true
- name_zh: 文齐
  score: 8
  worth_why: 滇太守开道垦田三千余顷修障塞，公孙述拘其妻子不降，光武封侯立庙，模范典范
  era: 两汉之交
  dates_known: true
- name_zh: 习农乐
  score: 7
  worth_why: 哀牢九隆传说中的开国王，修德敬教民耕种，南诏蒙氏始祖神话周期完整
  era: 上古至唐虞之世传说
  dates_known: false
- name_zh: 张乐进求
  score: 6
  worth_why: 铁柱合祭逊位于习农乐一段可作事迹周期但年份不详
  era: 唐以前滇中
  dates_known: false
- name_zh: 刘尚
  score: 6
  worth_why: 建武十九、二十年平栋蚕之叛，渡泸水、大捷获生口，事迹起讫可分
  era: 东汉光武帝时
  dates_known: true
- name_zh: 爨翫
  score: 5
  worth_why: 南宁夷叛降事散见史万岁条中，事迹简略
  era: 隋
  dates_known: true
rejections:
- name_zh: 摩耶提（阿育王）
  why_not: 神话传说附会之王，非滇中真实做事人物
- name_zh: 福邦、弘德、至德
  why_not: 神马碧凤传说诸子，无实证事迹周期
- name_zh: 沙一（摩梨羌）
  why_not: 感龙生子神话人物，不构成做事周期
- name_zh: 王褒
  why_not: 求金马碧鸡之神而道险未至，事迹简略无完整周期
- name_zh: 滇王当羌
  why_not: 汉孰为大一句话名场面，事迹太少分数不及格
- name_zh: 神明（舅氏）
  why_not: 兵阻哀牢不复返，命途故事零散
- name_zh: 奴波息
  why_not: 生十女配九隆兄弟，神话旁支无可考做事
- name_zh: 郭昌、卫广
  why_not: 灭劳深靡莫与平滇诸事简略，与其他条重叠，作配角欠缺名场面
- name_zh: 昌李毅王逊张乔杨竦
  why_not: 只存卒年或一击破事，无完整做事周期
- name_zh: 封离
  why_not: 卷夷叛乱仅一句，无可参做事流
