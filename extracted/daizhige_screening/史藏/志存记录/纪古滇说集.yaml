source: 史藏/志存记录/纪古滇说集.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 庄蹻
  score: 8
  worth_why: 楚将循江略地至滇，因秦断归道遂王滇，变服从俗开滇千年基业，是史称西南开疆的名场面
  era: 战国末
  dates_known: false
- name_zh: 张骞
  score: 9
  worth_why: 凿空西域、建议通蜀身毒道，开丝绸之路，做官为博望侯事功完整
  era: 西汉
  dates_known: true
- name_zh: 史万岁
  score: 8
  worth_why: 隋代名将征南宁夷，途中遇诸葛亮纪功碑预言一事流传千古，破要害平叛后却因受贿被诬冤死
  era: 隋
  dates_known: true
- name_zh: 文齐
  score: 7
  worth_why: 任益州太守开路垦田三千顷、修障塞集夷民；公孙述拘其妻子胁降而不屈，终得光武褒奖，气节可训
  era: 两汉之际
  dates_known: false
- name_zh: 习农乐
  score: 6
  worth_why: 九隆神话主角，背龙得名为哀牢始祖，躬耕修德建南诏蒙氏肇基，传说色彩浓而年代难考
  era: 传说时代至汉
  dates_known: false
- name_zh: 张乐进求
  score: 5
  worth_why: 祭铁柱会盟见凤凰栖于习农乐肩遂逊位让国，是云南政权禅让传说关键节点，事迹仅此一事
  era: 隋末唐初
  dates_known: false
- name_zh: 王褒
  score: 5
  worth_why: 汉宣帝遣使求金马碧鸡之神，望祀于蜀而未至滇，留下金马碧鸡典故与祭文名场面
  era: 西汉
  dates_known: true
- name_zh: 孟获
  score: 7
  worth_why: 七纵七擒主角，为夷汉所服据地数千里，被擒观营垒而心服，成语典故诞生点
  era: 三国
  dates_known: false
rejections:
- name_zh: 仁果
  why_not: 传为阿育王后裔兼白子国君，事迹多系传说，仅列治绩纲要无具体做事周期
- name_zh: 沙壹
  why_not: 九隆感生神话人物，无做事流
- name_zh: 沐朝弼
  why_not: 仅作序人物，无事迹文本
- name_zh: 张道宗
  why_not: 撰书者，无做事周期记载
