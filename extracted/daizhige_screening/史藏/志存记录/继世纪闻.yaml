category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 刘瑾
  score: 9
  worth_why: 权阉篡柄乱政之完整做事流，夜捕王岳、夺内阁票旨权、八虎分掌厂营，终因内争速败，权臣祸国之典型教训
  era: 明正德年间
  dates_known: true
- name_zh: 刘健
  score: 8
  worth_why: 首相拒批窒碍难行、联合九卿与内监谋诛八虎，事败去位，危局中的决策有考察价值
  era: 明孝宗弘治至武宗正德
  dates_known: true
- name_zh: 李东阳
  score: 8
  worth_why: 神童入翰林、 mimo媚瑾屈身保位的三难抉择，青词门生误苍生之评，功名与名节两难典型
  era: 明成化至正德
  dates_known: true
- name_zh: 韩文
  score: 8
  worth_why: 率九卿首劾刘瑾，败后罢职独行野店，的风骨榜样，做事周期完整
  era: 明弘治至正德
  dates_known: true
- name_zh: 李梦阳
  score: 7
  worth_why: 代草疏谏止盐引之祸，疏出而衣冠之祸胎，草疏谋浅反累韩文，教训清晰
  era: 明弘治至正德
  dates_known: true
- name_zh: 焦芳
  score: 7
  worth_why: 依附刘瑾入阁、阴助其谋，兼部之争被李东阳三问折服，小人得志而败之样本
  era: 明正德
  dates_known: true
- name_zh: 杨廷和
  score: 6
  worth_why: 经筵直讲、正德朝定策元老，事迹见始而后续简略
  era: 明正德
  dates_known: true
rejections:
- name_zh: 王岳
  why_not: 被夜捕缢杀，无独立做事周期
- name_zh: 谢迁
  why_not: 与刘健同去，传文无独立事迹
- name_zh: 朱恩
  why_not: 仅记“顶上”称谓，无做事流
- name_zh: 何景明
  why_not: 仅记知人轶事，无做事周期
