  era: 东晋十六国
  dates_known: true
- name_zh: 谢安
  score: 9
  worth_why: 高卧东山四十岁一出即「志存匡济」；后成淝水之战主心骨，东山再起典范
  era: 东晋
  dates_known: true
- name_zh: 车胤
  score: 8
  worth_why: 囊萤照读的经典寒门苦学故事；一岁至治中的上升做事流
  era: 东晋
  dates_known: true
- name_zh: 习凿齿
  score: 8
  worth_why: 忤桓温被左迁，着《汉晋春秋》以史笔防觊觎，以著述成事
  era: 东晋
  dates_known: true
- name_zh: 殷浩
  score: 7
  worth_why: 简文引以抗桓温，北伐失败废为庶人；废黜后雅咏不辍，教训深刻
  era: 东晋
  dates_known: true
- name_zh: 温峤
  score: 7
  worth_why: 屡辞中书令、忠于东晋经营南渡政局，虽事迹偏短但可成流
  era: 东晋
  dates_known: true
- name_zh: 袁宏
  score: 7
  worth_why: 牛渚咏史遇谢尚一举成名；牛渚泛月名场面；《东征赋》应对桓温之机智
  era: 东晋
  dates_known: true
- name_zh: 郗超
  score: 7
  worth_why: 「盛德日新郗嘉宾」；桓温谋主参与废立，才与立场之教训
  era: 东晋
  dates_known: true
