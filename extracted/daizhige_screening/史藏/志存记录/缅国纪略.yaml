source: 史藏/志存记录/缅国纪略.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 孟陨
  score: 7
  worth_why: 孟氏内乱中“七日易三王”后被国人迎立，以孙承继之智定嗣位，主动遣使奉表入贡、乞求封号开关通商，乾隆八旬万寿躬迎诏使受封，做事流完整且时间可考
  era: 清乾隆嘉庆道光年间（缅甸雍籍牙王朝）
  dates_known: true
- name_zh: 萨鸦布低
  score: 7
  worth_why: 孟既之弟，以渺缪集兵、誓清君侧、勒兵阿瓦城下迫王逊位，奉王子辅政不袭位，后袭位更名孟坑并夺还英占要地、锐意振作，权变与治绩俱著
  era: 清道光年间（缅甸）
  dates_known: true
- name_zh: 明瑞
  score: 7
  worth_why: 乾隆三十二年任云贵总督征缅，分两路进兵直入缅境，次年兵败殁于军，做事流完整，成败皆有 lesson
  era: 清乾隆年间
  dates_known: true
- name_zh: 傅恒
  score: 6
  worth_why: 以经略兵至老官屯，缅人乞降遂班师，收乾隆征缅之局，事迹较简
  era: 清乾隆年间
  dates_known: true
- name_zh: 杨应琚
  score: 5
  worth_why: 听副将生事邀功致新街败衂，逮问入都，可作边臣轻启边衅之教训，但事迹简略
  era: 清乾隆年间
  dates_known: true
rejections:
- name_zh: 刘藻
  why_not: 仅记“总督刘藻至于自杀”一句，无做事周期
- name_zh: 瓮籍牙
  why_not: 只叙其败得楞自立、篡缅建业之梗概，数行而已，周期不完整但可后续补录
- name_zh: 孟既
  why_not: 性懦多病，权柄旁落孟窝，逊位后病故，做事流多为被动
- name_zh: 孟窝
  why_not: 揽权擅专而终被执死，仅作萨鸦布低起事之对照
- name_zh: 孟络
  why_not: 仅一句嗣位构兵
- name_zh: 孟驳
  why_not: 仅记犯车里与死年
- name_zh: 彭崧毓
  why_not: 作者自序，仅记述职守作文缘起，无大事可为时间轴
