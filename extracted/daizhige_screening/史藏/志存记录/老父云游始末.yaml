events:
- id: guji-陆圻-event-treat
  endeavor_id: guji-陆圻-endeavor-2
  title_zh: 为友王于一调治疾
  summary_zh: 父友王于一自闽至浙寓昭庆寺，忽疾作，陆圻亟为调治昼夜不息。
  date: '1662-02-01'
  precision: day
  year_of: 1662
  actors:
  - guji-陆圻
- id: guji-陆圻-event-funeral
  endeavor_id: guji-陆圻-endeavor-2
  title_zh: 敛资棺殓并送柩至江浒
  summary_zh: 王不起，陆圻为敛资棺殓并出十金令其仆扶柩归里，亲送至江浒。
  date: '1662-03-01'
  precision: month
  year_of: 1662
  actors:
  - guji-陆圻
- id: guji-陆圻-event-warn
  endeavor_id: guji-陆圻-endeavor-1
  title_zh: 劝查伊璜烧毁逆书并报官查验
  summary_zh: 闻庄氏史书抵触本朝且有己名在焉，即往见查伊璜，谓此何物尚置是耶，若不早图祸将作矣，因具牒文文宗行文湖郡教谕赵君查验，赵至庄家碎其书板共六十四义口贮于府库。
  date: '1662-05-01'
  precision: month
  year_of: 1662
  actors:
  - guji-陆圻
  - 查继佐
- id: guji-陆圻-event-arrest
  endeavor_id: guji-陆圻-endeavor-1
  title_zh: 清晨随吏被逮
  summary_zh: 借视疾之名来逮，陆圻与叔梯霞公知其意，奠母而往，怡然随吏去见司李纪公，寄钱塘狱。
  date: '1662-11-15'
  precision: day
  year_of: 1662
  actors:
  - guji-陆圻
- id: guji-陆圻-event-depart
  endeavor_id: guji-陆圻-endeavor-1
  title_zh: 长行赴京诀别家人
  summary_zh: 十五日长行，母举家骨肉号哭，陆圻处分家事嘱两兄孝母终身不必读书，行至金山下誓苟得生还必祝发空门。
  date: '1662-12-15'
  precision: day
  year_of: 1662
  actors:
  - guji-陆圻
- id: guji-陆圻-event-prison
  endeavor_id: guji-陆圻-endeavor-1
  title_zh: 与查范同入刑部牢
  summary_zh: 行李使费被逆仆张煜席卷，茕茕无计，幸遇舅祖信甫裘父子，出白镪五十关通要路；严颢亭置仆于密室餐亲传，遂致书浙省当道力为暴白。
  date: '1663-01-24'
  precision: day
  year_of: 1663
  actors:
  - guji-陆圻
- id: guji-陆圻-event-return
  endeavor_id: guji-陆圻-endeavor-1
  title_zh: 命下回浙候审
  summary_zh: 得舅祖斡旋、严颢亭驰书，不数日命下回浙候审，即日出京三月初六抵杭入营监守。
  date: '1663-02-25'
  precision: day
  year_of: 1663
  actors:
  - guji-陆圻
- id: guji-陆圻-event-release
  endeavor_id: guji-陆圻-endeavor-1
  title_zh: 发还家眷释归
  summary_zh: 照照照照刘君来云公等不日归家，四月二十六日果发还家，冤狱得解。
  date: '1663-04-26'
  precision: day
  year_of: 1663
  actors:
  - guji-陆圻
