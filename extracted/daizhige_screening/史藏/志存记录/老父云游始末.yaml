  birth_date: ''
  death_date: ''
  era: 清初
  reign_ref: 康熙
  archetype: 罹难者与担当者
  dilemmas:
  - 明哲避祸Behalf与担当救友忠义之间
  - 蒙冤下狱时如何保全家族血脉
  lesson: 风骨担当与临祸的从容：无事时谨慎防患，遭难时孝义不乱、视死如归
  summary_first_person: 我陆圻精于医道、文名饮誉江左。友王于一客死杭州，我为其敛资棺殓送柩归里。闻庄廷鑨史案牵连查、范及我之名，我先疑祸劝查伊璜及早处置，具牒报官碎其书板。然吴之荣抱书上告，我于康熙元年冬被逮入都，刑部狱中蒙舅祖白金通融、严颢亭驰书浙省营救，得命回浙候审，翌年
    Rez释归。狱中三姓百七十六口同系，我处变不惊，诀别家人殷殷嘱托孝母持家，杖锁加身而怡然随吏。我谓不饰词苟免，惟以忠信处横逆。
