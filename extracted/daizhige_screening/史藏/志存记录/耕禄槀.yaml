category: 史藏/志存记录
verdict: no_value
skip_reason: 耕禄槀为宋人拟制诰表的游戏之作，所涉'人物'（田万顷、谷实、来牟、米秫、马菽、良耜、车龙、赵镈等）皆是拟人化的农事寓言，非真实历史人物，生卒无从可考，仅可作文体文献研究，不宜录入成事儿时间轴
rejections:
- name_zh: 田万顷
  why_not: 拟人化寓言人物（田产之喻），无真实生平与年代
- name_zh: 谷实
  why_not: 谷物拟人（谷实喻粮食），封侯进爵皆虚构制文
- name_zh: 来牟
  why_not: 即麦之古称拟人为侯，非真人
- name_zh: 米秫
  why_not: 米与秫拟人任祭酒，纯文学虚构
- name_zh: 马菽
  why_not: 马与豆拟人掌厩驾，非真人事迹
- name_zh: 良耜
  why_not: 农具耜拟人除司农卿，虚构
- name_zh: 车龙
  why_not: 水车拟人任转运使，虚构
- name_zh: 赵镈
  why_not: 锄类农具拟人掌金部，虚构
- name_zh: 胡锜
  why_not: 亦非本篇主人公，为作者
