- name_zh: 宋徽宗
  score: 6
  worth_why: 艮岳之役——缘起于术士进言求子，政和至宣和竭天下财力凡六载而成万岁山，靖康之变时金人围城，十万百姓入园拆伐为薪，园即成而国即亡。可作「奢靡误国」完整做事流与方法论教训：筑山而成子、成园而失国，十年兴废俱可考
  era: 北宋末
  dates_known: true
- name_zh: 朱勔
  score: 7
  worth_why: 花石纲主持者——置应奉局于平江，搜岩剔薮运太湖灵璧奇石，一花一木黄封护视得罪者众，费以亿万计，是「异石亡国」的执行者而非君主本人；其做事流缘起、扩张、禁而不止、终局俱全，是警示型典范（六贼之一）
  era: 北宋末
  dates_known: true
- name_zh: 梁师成
  score: 5
