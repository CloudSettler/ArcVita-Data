category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 叶名琛
  score: 10
  worth_why: 「不战不和不守，不死不降不走」的六不总督；拒英入城得封爵，后刚愎拒增兵借扶乩决策致广州陷落被俘，成刚愎误国的经典教训
  era: 清末咸丰年间
  dates_known: true
- name_zh: 徐广缙
  score: 8
  worth_why: 单骑赴虎门英舰面斥夷酋，组织十万团练挫败英人入城之议，获一等子爵；后调湖广督师失律，做事周期完整
  era: 道光咸丰年间
  dates_known: true
- name_zh: 耆英
  score: 7
  worth_why: 签约许诺缓议入城以图内召脱身、两年后事败，咸丰初被赐死；外交投机者身败的案例
  era: 道光咸丰年间
  dates_known: true
- name_zh: 沈棣辉
  score: 6
  worth_why: 以巨绠系身桅上督战平东莞会匪，功成反被叶名琛抑不奏保，忧愤疽发背死；忠勤而遭妒的悲剧
  era: 咸丰年间
  dates_known: false
rejections:
- name_zh: 黄恩彤
  why_not: 仅作为和议附从出现，无独立做事线
- name_zh: 赵长龄
  why_not: 附从和议后复原官升迁，乏关键场面
- name_zh: 巴亚里
  why_not: 夷酋方 mostly 对手配角，做事可并入叶名琛事件
- name_zh: 伍崇曜
  why_not: 绅商传话角色，无完整周期
