category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 于谦
  score: 9
  worth_why: 正统己巳土木之变后力主抗战、欲斩南迁之议者，定夺社稷危局，又曾夺门前主政兵部；北京保卫战名场面，人可考
  era: 明代正统、景泰年间
  dates_known: true
- name_zh: 徐有贞
  score: 8
  worth_why: 先倡南迁之议被斥，后改名夺门之变主谋、陷害于谦，做事流完整且为后世警示
  era: 明代正统、天顺年间
  dates_known: true
- name_zh: 陈镒
  score: 7
  worth_why: 巡抚陕西用法宽平得民心，民遮道借留、舁轿祈愈，治理民本典范，可考
  era: 明代正统前后
  dates_known: true
- name_zh: 项忠
  score: 7
  worth_why: 巡抚陕西令民道旁种树，民怨而有坚持，长远民生政令决策典型
  era: 明代成化前后
  dates_known: true
- name_zh: 余子俊
  score: 8
  worth_why: 知西安府时凿渠引灞浐水入城，上覆平地下通井口，为民永世之利，完整做事流与结果
  era: 明代成化前后
  dates_known: true
- name_zh: 王徽
  score: 7
  worth_why: 率六科给事中上疏直言宦官干政，谠直切中时弊遭远贬，天下慕其风采，直臣谏诤样板
  era: 明代成化年间
  dates_known: true
- name_zh: 王渊
  score: 6
  worth_why: 谏劾宦官奏疏实出其谋，焚香告天为盟，甘为王徽擅名，义让典范但事迹简略
  era: 明代成化年间
  dates_known: true
- name_zh: 郭南
  score: 6
  worth_why: 常熟知县见献软栗即命拔其种，虑异日以此殃民，小而完整的远虑决策
  era: 明代正统前后
  dates_known: true
- name_zh: 杨朝晟
  score: 5
  worth_why: 邠宁节度使集方渠、合道、木波三城，边防筑城可考，但事迹简略
  era: 唐德宗兴元年间
  dates_known: true
- name_zh: 金英
  score: 5
  worth_why: 土木之变后集廷臣议政、易储事上婉谏景帝，关键场合有言行，惜整体事迹简
  era: 明代正统、景泰年间
  dates_known: true
rejections:
