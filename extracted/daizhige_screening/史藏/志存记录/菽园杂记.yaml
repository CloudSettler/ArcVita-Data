  why_not: 仅蹋鞠得幸与奏省榅桲贡费小事，无完整做事周期
- name_zh: 整
  why_not: 侠义轶事一则，人物生平不可考
- name_zh: 周旋
  why_not: 仅状元误闻轶事，无做事流
- name_zh: 冯益
  why_not: 同名误捕轶事配角，无可考生平
- name_zh: 陈太妃
  why_not: 秦王母贤严轶事，附于王府礼节，无独立做事流
- name_zh: 卢祥
  why_not: 仅嘲诗一首，无可考事迹
- name_zh: 牛玉
