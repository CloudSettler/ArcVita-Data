  dilemmas:
  - 欲嫁貌似翼王的马生以备替身死局，需先向义父启齿
  - 大渡河被困，杀亲子毁容，令马生顶替石达开脱难
  lesson: 临大事以妇人之身断丈夫之断，然替身脱难终系于一貌之侥幸
  summary_first_person: 我本桂阳贡生之女，家破于兵，蒙翼王收为义女，掌军书于左右。至老鸦漩兵败，我杀子毁容，使夫貌类王者代我父赴难，而翼王变服遁去。
  source_urls:
  - 蕉窗雨话·记石达开老鸦漩被禽异闻
