- id: guji-韩宝英-event-join
  date: ''
  year_of: 1854
  title_zh: 家灭于土寇，马前陈情，翼王收为义女
  detail: 稽首王前慷慨陈家难，请剿土寇祭亲，遂以父女称留军中。
- id: guji-韩宝英-event-secretary
  date: ''
  year_of: 1855
  title_zh: 掌文告、口授左右并列三牍，顷刻千言
  detail: 翼王自诩文事至此亦叹不及；后自请嫁马生，仍共治军书。
- id: guji-韩宝英-event-sacrifice
  date: ''
  year_of: 1863
  title_zh: 老鸦漩被困，投儿碎首、自刭其喉，令马生替翼王
  detail: 军中传王降清，实翼王偕心腹变服遁去。
