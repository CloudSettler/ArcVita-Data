candidates:
- name_zh: 冯溥
  score: 7
  worth_why: 康熙初廷议各省设大臣衙门察督抚，独执不可，面折太必免举拳之怒，疏上事止，体现关键决策与风骨，做事流较完整
  era: 清初顺治康熙
  dates_known: true
- name_zh: 王禹偁
  score: 5
  worth_why: 黄州谢上表悲语撼真宗欲内徒，然动手周期文献有疑，事迹简略
  era: 北宋太宗真宗
  dates_known: true
- name_zh: 方浚师
  score: 5
  worth_why: 积数十年笔记成《蕉轩随录》，分巡岭西期年政成后删繁举要编书，文人著述流可考但缺乏名场面
  era: 清同治
  dates_known: true
- name_zh: 李光先
  score: 4
  worth_why: 守赣州题楹帖礼防未然弊去太甚，为政宽简有循声，但传文过短
  era: 清乾隆
  dates_known: false
rejections:
- name_zh: 方勿庵
  why_not: 乡试雷同被黜仅一事，终身未第，无完整做事周期
- name_zh: 太必兔
  why_not: 仅作冯溥事迹的对立面出现，凶暴无礼卒以夤缘伏法，无自强流
- name_zh: 弃（后稷）
  why_not: 仅经义考订一条，讨论后字当作居字，无做事叙事
- name_zh: 李光廷
  why_not: 仅作序者，无独立事迹
- name_zh: 张子锡康
  why_not: 柴薪拾木得进士二字，谈异闻而非做事
