candidates:
- name_zh: 骆秉章
  score: 8
  worth_why: 督办四川军务平定蓝李之乱与石达开之擒，善识刘蓉、湘将，治蜀整饬吏治，做事流完整
  era: 清末咸丰同治
  dates_known: true
- name_zh: 石达开
  score: 9
  worth_why: 离洪秀全后转战七省入川，大渡河粮尽被擒，太平天国名将与悲剧英雄，名场面与教训俱全
  era: 清末太平天国
  dates_known: true
- name_zh: 刘蓉
  score: 7
  worth_why: 由附生署布政使，督军擒李永和，后抚陕退巴州、灞桥之溃，仕途起伏可作教训
  era: 清末咸丰同治
  dates_known: true
- name_zh: 李永和
  score: 6
  worth_why: 蓝李之乱主角之一，围眉州踞铁山龙孔场终被擒，乱事起落可考
  era: 清末咸丰
  dates_known: true
- name_zh: 蓝朝鼎
  score: 6
  worth_why: 蓝李之乱首领，长驱川南据五通桥围绵州入陕汉阴，败亡结局可作乱事样本
  era: 清末咸丰同治
  dates_known: true
- name_zh: 黄淳熙
  score: 6
  worth_why: 姚店大捷破敌数千，燕子窝中伏战没，先胜后殒具警示意义
  era: 清末咸丰
  dates_known: true
