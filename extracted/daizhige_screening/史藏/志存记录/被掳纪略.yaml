verdict: has_candidates
candidates:
- name_zh: 陈玉成
  score: 9
  worth_why: 太平天国英王，破武汉、九江、江南大营，威名震天地；文中借俘虏之目见其军容 дисцип与治军用兵，做事流完整，安庆庐州败亡亦有全局坐标
  era: 清末太平天国
  dates_known: true
- name_zh: 刀口余生
  score: 8
  worth_why: 《被掳纪略》作者，商城生员被太平军掳掠，身被二十三刀九十日后生还脱险，亲历全程并留纪实文本，是乱世幸存者第一手史料，做事流完整且具名场面（三河夜半遇袭、朱道台疗伤）
  era: 清咸丰同治间
  dates_known: false
- name_zh: 朱道台
  score: 7
  worth_why: 江苏吴县翰林出身、官至道台，全家三十余口被杀后留身被掳于天朝行医救人，留君子小人之论，见识通达，可为乱世处世之鉴
  era: 清末太平天国
  dates_known: false
rejections:
- name_zh: 戴鹤龄
  why_not: 仅为被掳文人配角，护持作者而无独立做事周期
- name_zh: 黄大人
  why_not: 顺天福武官，仅作叙事线索，无事迹可考
- name_zh: 曹大人
  why_not: 麻埠设伏败于土匪，事迹零星无完整周期
