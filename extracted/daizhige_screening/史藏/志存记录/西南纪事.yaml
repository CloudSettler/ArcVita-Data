  why_not: 仅作世系交代，无做事周期
- name_zh: 安仁王由楥
  why_not: 先卒无事迹
- name_zh: 刘承胤
  why_not: 事略仅降附挟制数笔，且有去现代早年负面价值不足
- name_zh: 黄斌卿
  why_not: 攻宁波乞师数行，做事流不完整
- name_zh: 沐天波
