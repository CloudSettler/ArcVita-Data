category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 永历帝朱由榔
  score: 8
  worth_why: 南明最后一位皇帝，监国、即位、辗转两广云贵十八年流亡朝廷，做事周期完整，亡于咒水之难，是王朝覆灭的教训样本
  era: 南明永历年间
  dates_known: true
- name_zh: 瞿式耜
  score: 8
  worth_why: 拥立桂王、留守桂林、力战却敌、最终城破殉国，忠节典范且关键决策可考
  era: 明末清初
  dates_known: true
- name_zh: 何腾蛟
  score: 7
  worth_why: 督师湖广、联络诸镇、收复全州永州，兵溃死长沙，忠而乏略可为镜鉴
  era: 明末清初
  dates_known: true
- name_zh: 李成栋
  score: 8
  worth_why: 以广东全省反正归于永历，翊明大将军负弩郊迎，屡立战功终败死信丰，反复转折极富戏剧性
  era: 明末清初
  dates_known: true
- name_zh: 张献忠
  score: 7
  worth_why: 陷衡州、建大西政权、死于西充，其死后孙可望李定国的去向牵动西南全局
  era: 明末清初
  dates_known: true
- name_zh: 孙可望
  score: 8
  worth_why: 据云南、遣使入朝、矫制求封秦王，与永历朝廷的权力博弈是西南纪事主线之一
  era: 明末清初
  dates_known: true
- name_zh: 朱成功
  score: 9
  worth_why: 起于烈屿、围泉州、遣陈士京入朝奉永历年号，是抗清事业名场面级人物
  era: 明末清初
  dates_known: true
- name_zh: 张煌言
  score: 7
  worth_why: 与王翊、张名振相呼应保平冈四明山抗清，后期名场面人物
  era: 明末清初
  dates_known: true
- name_zh: 金声桓
  score: 7
  worth_why: 以江西全省反正、攻赣州、终至南昌被围死节，反正周期完整
  era: 明末清初
  dates_known: true
- name_zh: 丁魁楚
  score: 6
  worth_why: 首倡拥立又败死藤江，始于功而终于逃，足为教训
  era: 明末清初
  dates_known: true
- name_zh: 侯性
  score: 6
  worth_why: 古泥救驾、峡口退敌，血诏奉迎时期的护驾功臣
  era: 南明永历年间
  dates_known: false
rejections:
