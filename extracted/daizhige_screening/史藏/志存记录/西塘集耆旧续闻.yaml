verdict: has_candidates
candidates:
- name_zh: 苏轼
  score: 7
  worth_why: 谪居黄州三钞汉书成诵不遗一字，勤学典范名场面；生平往复贬谪仍屡任屡作，做事流完整可考
  era: 北宋
  dates_known: true
- name_zh: 朱翌
  score: 6
  worth_why: 十八岁词惊朱希真洪觉范，文不苟作而以文名于世；与秦桧启用事亲切得擢用，有较完整文事周期
  era: 北宋末南宋初
  dates_known: true
- name_zh: 刘安世
  score: 6
  worth_why: 元城论学守一诚字，诚自不妄语中入；论论语史阙文与通鉴去四皓事，学行与议论皆可成章
  era: 北宋
  dates_known: true
- name_zh: 米芾
  score: 6
  worth_why: 行草入能品、洁癖轶事、效羊欣书体，书法与创新名场面多，然传文零散缺乏首尾
  era: 北宋
  dates_known: true
- name_zh: 陆珍
  score: 5
  worth_why: 七岁忽吟诗自道谪仙、晚年炼丹丹成化鹤，雅志神仙有传奇色彩但仅笔记片段
  era: 北宋
  dates_known: true
