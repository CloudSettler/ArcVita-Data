candidates:
- name_zh: 李继迁
  score: 8
  worth_why: 地斤泽起兵复业、诈降诱杀曹光实、屡败宋军终建西夏基业，做事流完整而终死于潘罗支暗算，成败兼具
  era: 北宋初
  dates_known: true
- name_zh: 李元昊
  score: 9
  worth_why: 叛宋称帝建西夏、好水川定川之胜、大败契丹、创文字制度；又因猜忌杀戮、夺子之妻而死于子手，模范与教训俱全
  era: 北宋中期
  dates_known: true
- name_zh: 李德明
  score: 7
  worth_why: 父死嘱其倾心内属，受封西平王，三十年不窥边而攻甘州、西凉，为元昊称帝积蓄根基，可作守成与隐忍之鉴
  era: 北宋前期
  dates_known: true
- name_zh: 李继捧
  score: 6
  worth_why: 献五州归朝又反复为继迁所诱，终被擒为宥罪侯，教训性人物但做事流较简
  era: 北宋初
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 报元昊书中 beg 示「有征无战、不杀非辜」的经略方略，名篇长书力主以礼议和，西事经略名场面，已在库者无需重复
  era: 北宋
  dates_known: true
