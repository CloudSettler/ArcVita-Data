person:
  qid: guji-满四
  name_zh: 满四
  names:
    zh: 满四
  era: 明代成化年间
  archetype: 叛乱者
  dilemmas:
  - 官府追捕激变：从土达豪族沦为据险叛首
  - 石城险固与城中无水无粮：据险自保终致困毙
  lesson: 据险叛逆无出路，绝其水粮则釜中之鱼自毙；激变来自于下贪索
  summary_first_person: 我是固原土达满四，因官兵索马鹰、追捕杀命 urged 遂叛入石城，屡败官军，终被项忠、马文升断水草围困而降，伏诛。
  source_urls:
  - 《西征石城记》明·马文升
