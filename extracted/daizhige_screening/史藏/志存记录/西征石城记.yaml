events:
- id: guji-满四-event-recruit
  year_of: 1466
  date: '1466'
  title_zh: 与李俊谋从北虏
  summary: 冯杰索马匹鹰翎，满四与李俊倡谋叛乱。
- id: guji-满四-event-stonecity
  year_of: 1468
  date: '1468'
  title_zh: 绑架满璹据石城
  summary: 诱杀来捕的满璹部众二十余人，叛入石城据险。
- id: guji-满四-event-defeat1
  year_of: 1468
  date: '1468'
  title_zh: 大败官军于蔡祥堡
  summary: 逐牛羊于前精兵后继，执木梃而斗，官军大溃，申澄死、邢端遁。
- id: guji-满四-event-siege
  year_of: 1468-09-05
  date: '1468-09-05'
  title_zh: 项忠马文升六路围石城
  summary: 五万官军分六路进讨，毛忠阵亡，义军死伤枕藉。
- id: guji-满四-event-strangle
  year_of: 1468-10
  date: 1468-10
  title_zh: 绝水草困城
  summary: 官军焚近草、填水泉、伏袭汲者，城中水粮俱尽。
- id: guji-满四-event-fall
  year_of: 1469-01
  date: 1469-01
  title_zh: 城穷出降伏诛
  summary: 满四出诉请降，终因顽抗城破被诛。
