    rationale: 土达遭虏掠生事渐荒，官府追逼，恃石城天险可据
  - date: 1468-11
    title_zh: 诈请降以懈官军
    rationale: 贼穷蹙，欲诱总督总兵诣城下缓兵
  - date: 1468-12
    title_zh: 设栅复言战不复言降
