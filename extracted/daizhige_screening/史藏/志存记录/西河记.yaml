  worth_why: 东晋遣使拜其为凉州刺史假节而重华谋为凉王不肯受诏，与喻归使者折冲对答，是十六国前凉政治博弈的关键决策点；惜原书散佚仅存轶闻，做事流不完整
  era: 东晋十六国前凉
