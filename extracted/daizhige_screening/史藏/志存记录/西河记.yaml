- name_zh: 喻归
  score: 5
  worth_why: 以侍御史出使前凉，面对张重华拒不受诏仍折服其议，并撰西河记三卷，兼具史家与外交者双重身份；唯事迹仅见序文之转述，事迹简略
  era: 东晋
  dates_known: false
- name_zh: 张骏
  score: 5
  worth_why: 立谦光殿而池中现五龙，铸铜龙以厌之而终不胜此殿，为可考的迷信代价式警示故事；仅存轶闻一则难成做事流
  era: 东晋十六国前凉
