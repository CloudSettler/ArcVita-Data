person:
  qid: guji-沈初
  name_zh: 沈初
  names:
    en: Shen Chu
  lifespan:
    birth:
      date: 1735
      precision: year
      is_circa: true
      raw: 乾隆年间生人未详——按卒于嘉庆四年（1799）与侍直三十年推约1735年
    death:
      date: 1799
      precision: year
      is_circa: false
      raw: 嘉庆四年春哀病不支以卒
  era: 清乾隆嘉庆间
  reign_ref: 乾隆帝、嘉庆帝
  archetype: 内廷词臣与典籍编纂者
  dilemmas:
  - 内廷恩遇与编纂责任之间的长期侍直之劳——暑寒儤直皆不易，寒易耐而暑难熬
  - 前浪后浪之感——侍直三十载，前辈零落，自感荣遇与老将至的矛盾
  lesson: 侍直三十年躬修巨帙（《石渠宝笈》《天禄琳琅书目》《西清砚谱》等），见“文臣以编纂立身，以恭谨蒙恩”之道
  summary_first_person: 我沈初，乾隆间翰林，三十二年入直禁近，乾隆五十六年大考翰詹第一，蒙特旨入南书房；先后奉勑编纂《石渠宝笈》续编、校勘石经，两次出为学政，官至礼部侍郎、军机处行走；嘉庆初亲录弘历纯皇帝御制诗文，作《西清笔记》志三十年内廷荣遇，凡春帖子、重华宫茶宴联句、赐福字诸典故，得见文臣最清切之位。
