events:
- id: guji-沈初-event-birth
  title: 约生于乾隆初年（推定）
  date: 1735
  year_of: 1735
  category: birth
  description: 乾隆间生，后为平湖沈文恪公（沈初）。
- id: guji-沈初-event-chunru
  title: 乾隆三十二年冬，选入直懋勤殿
  date: 1767-11
  year_of: 1767
  category: endeavor
  description: 刘统勋、于敏中、裘日修、王文庄联名奏举，与彭元瑞等四人入直懋勤殿。
- id: guji-沈初-event-buyan
  title: 乾隆五十六年大考翰詹第一，入南书房行走
  date: 1791
  year_of: 1791
  category: endeavor
  description: 大考翰詹第一，奉特旨入南书房，同直者阮元。故作《西清笔记》。
- id: guji-沈初-event-bianzuan
  title: 乾隆四十一丙申起兼任四库全书处总裁、编纂《石渠宝笈》
  date: 1776
  year_of: 1776
  category: endeavor
  description: 乾隆五十六年奉命续编《石渠宝笈》《秘殿珠林》，并在懋勤殿写《华严经》泥金书。
- id: guji-沈初-event-xuezheng
  title: 乾隆三十六辛卯夏起两任学政（河南、江西）
  date: 1771
  year_of: 1771
  category: endeavor
  description: 江苏抚奏称职、朱批“公谕”二字，召见屡称好学政。
- id: guji-沈初-event-hezhi
  title: 乾隆四十五庚子上南巡，行在南斋匆成诗四什恭和
  date: 1780
  year_of: 1780
  category: endeavor
  description: 以詹事代阁学批本时奉旨补授礼部右侍郎。
- id: guji-沈初-event-end
  title: 嘉庆三年冬，奉命编写御制纯皇帝圣德神功碑文
  date: 1799
  year_of: 1799
  category: endeavor-1
  description: 嘉庆四年春首（约1799年）哀病不支以卒，同年卒，此为其完成最后一任幕内写作任务。
- id: guji-沈初-event-death
  title: 卒于嘉庆四年春
  date: 1799
  year_of: 1799
  category: death
  description: 嘉庆四年春之上（约春）哀病不支以卒，寿约六十五。
