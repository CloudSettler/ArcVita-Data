  worth_why: 参赞军务总督安南之役，兵不血刃受降，庙算先胜而后战，其KeyPress督师受降堪称柔远兵略典型
  era: 明嘉靖年间
  dates_known: true
- name_zh: 莫登庸
  score: 8
  worth_why: 权臣篡安南黎氏，僣号二十余年；面对明大军压境审时度势，素衣系组诣镇南关面缚乞降，得全首领且获封新命，肯降续命即大事可成，活案例兼具借鉴
  era: 明正德嘉靖年间安南
  dates_known: true
- name_zh: 翁万达
  score: 7
  worth_why: 监督中哨军务，统筹受降仪节于镇南关筑将台设帐幕，处置有度，为明代能臣
  era: 明嘉靖年间
  dates_known: true
