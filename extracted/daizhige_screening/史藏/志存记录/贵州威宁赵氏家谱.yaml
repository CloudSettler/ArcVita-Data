source: 史藏/志存记录/贵州威宁赵氏家谱.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 赵武灵王（赵雍）
  score: 9
  worth_why: 胡服骑射经典改革决策，灭中山略胡地，假扮使者探秦，主父禅让却饿死沙丘——改革雄略与继承失败的双面教训
  era: 战国
  dates_known: true
- name_zh: 赵襄子（赵无恤）
  score: 9
  worth_why: 晋阳之战被围不弃 unto 联韩魏反灭智伯，为三家分晋开局；为傥生简牍受训被立为后，让位兄后代感故事完整
  era: 春秋末期战国初
  dates_known: true
- name_zh: 赵佗
  score: 9
  worth_why: 龙川令起家自立南越武王，对汉称臣又擅自立为帝，做南越事业整个周期完整，“趔趄纵横岭南”教材式边疆治理
  era: 秦末汉初
  dates_known: true
- name_zh: 赵简子（赵鞅）
  score: 8
  worth_why: 简牍择后（无恤）、《赵氏始有邯郸》、定晋阳、从黄池争长——创赵氏实权基业的关键决定清晰
  era: 春秋末期
  dates_known: true
- name_zh: 赵盾
  score: 8
  worth_why: 赵宣子专晋政、灵公欲杀而逃、赵穿弑君——厡指他主持国政卹尽，但命运捝圆富戏剧性
  era: 春秋
  dates_known: true
- name_zh: 赵奢
  score: 8
  worth_why: 阙与之战大破秦军被赐号马服君，与赵括代将长平之祸形成对照教训
  era: 战国
  dates_known: true
rejections:
- name_zh: 琴台、原鄂、应庭等中段世系祖
  why_not: 传文仅一行婚妣生子，无事迹做事周期
- name_zh: 赵浣、赵籍、赵章等赵国诸候
  why_not: 多已在库或此文仅父卒子立谥号年数流水
- name_zh: 赵迁、赵嘉
  why_not: 亡国结局可作坐标，但本人无主动做事流
- name_zh: 轩辕黄帝、伯益、造父
  why_not: 上古世系牵线人物；造父受封赵城尚简，且君主先祖低优先
- name_zh: 赵胜（平原君）、廉颇、触龙
  why_not: 廉颇平原君已在库；触龙非赵姓且事迹另一文中
