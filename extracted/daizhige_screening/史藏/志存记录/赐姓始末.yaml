candidates:
- name_zh: 郑成功
  score: 10
  worth_why: 国姓爷赐姓、抗清北伐、驱逐荷兰收复台湾，做事周期完整，蒙古海峡决战金陵与收复台湾皆为名场面
  era: 明末清初
  dates_known: true
- name_zh: 郑芝龙
  score: 8
  worth_why: 从海盗受抚到富甲全闽、开垦台湾，其受洪承畴诱降轨迹是成功悲剧之缘起，教训深刻
  era: 明末清初
  dates_known: true
- name_zh: 张煌言
  score: 8
  worth_why: 北伐取四府二十四县、兵败后变名隐遁入海完发以死，孤忠守节可为后世镜鉴
  era: 明末
  dates_known: true
- name_zh: 郑经
  score: 6
  worth_why: 拒耿精忠节制、往返台湾经营自立，事迹可作郑氏三世终结之链环
  era: 明郑
  dates_known: true
