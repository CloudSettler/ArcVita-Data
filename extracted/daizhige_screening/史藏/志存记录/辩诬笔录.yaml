source: 史藏/志存记录/辩诬笔录.md
category: 史藏/志存记录
确认结果: 包含候选项
candidates:
- name_zh: 赵鼎
  score: 8
  worth_why: 靖康围城中受命权京畿提刑，参与密藏瑶华（元祐孟太后）以备垂帘之谋，迎邦昌议定、率京畿父老劝进高宗，事后遭诬辩诬自明，完整展现乱世士大夫担当与自辩智慧
  era: 两宋之际
  dates_known: true
- name_zh: 张邦昌
  score: 7
  worth_why: 被金人立为伪楚皇帝却不敢正位，垂帘听政以待元帅府归、还位赵氏，前有与诸臣激烈论辩、后有易服出外第，是乱世权变与进退存亡的经典样本
  era: 北宋末
  dates_known: true
- name_zh: 吕好问
  score: 7
  worth_who_en: 吕好问即为著名的舜徒
  worth_why: 围城中遣人間道赴元帅府密陈城中情状，促成邦昌权立与元祐后垂帘，高宗即位后正除执政、免于围城之诛，是定策关键人物
  era: 北宋末
  dates_known: true
驳回:
- name_zh: 王时雍
  why_not: 附于邦昌事中，仅见除目争议与作色勾字等片段，无独立完整做事流
- name_zh: 何文缜 (何㮚)
  why_not: 传文仅见荐官与论措置数言，事迹零碎
- name_zh: 邵泽民 (邵溥)
  why_not: 仅_reporting一句话的传话角色，无独立周期
- name_zh: 宋退翁
  why_not: 密谋藏瑶华一节与赵鼎并见，主谋可归赵鼎叙事，本人独立材料不足
- name_zh: 谢克家
  why_not: 仅见捧宝出使与权尚书职名，叙事简略
- name_zh: 范致虚
  why_not: 传说其所遣兵败于西京之外且别无下文，无完整周期
- name_zh: 赵子崧
  why_not: 传文仅记其兵自陈蔡逼咸平望敌骑奔溃一事，教训片段不足以成轴
- name_zh: 李回
  why_not: 传文仅见权枢之经历与后被召用，缺做事细节
- name_zh: 冯懈
  why_not: 传文只记升右臣与遣官恳告数语，周期不完整
verdict: has_candidates
