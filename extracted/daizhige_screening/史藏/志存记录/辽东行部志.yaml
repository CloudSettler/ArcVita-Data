- name_zh: 王寂
  score: 8
  worth_why: 金代明昌元年奉使按部辽东，逐日纪行，吊亡怀古、雪冤去蠹、考订沿革，留有完整赴任纪程与感怀诗，做事流与笔记者述俱全
  era: 金代中期
  dates_known: true
- name_zh: 郎思孝
  score: 6
  worth_why: 辽代高僧海山，进士出身弃官为僧，名动天下，辽兴宗以诗相酬赐号司空，实在辽西海云寺，兴宗御书遣使慰问，君臣以布衣之交相处，罕见一遇
  era: 辽兴宗重熙年间
  dates_known: false
