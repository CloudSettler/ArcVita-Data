source: 史藏/志存记录/辽夷略.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 虎墩兔憨
  score: 6
  worth_why: 号称西虏帝约束诸部拥兵数万，累岁邀贡市王爵而不得抱恨终身，可为明末辽东制虏之局的时间坐标
  era: 明末万历天启间
  dates_known: false
- name_zh: 影克
  score: 6
  worth_why: 忠实能约束部落，主动密告汉关吏请除兀鲁厮汉长秃之患，后为东虏耳目被兵而死，有明显忠虏护边做事流
  era: 明隆庆万历间
  dates_known: false
- name_zh: 窦承武
  score: 6
  worth_why: 抚夷官有完整方法论述，重信谕夷示之不测玩虏如掌上雏，忠信可行蛮貊一语可作后人治边启发
  era: 明末天启前后
  dates_known: false
- name_zh: 长昂
  score: 5
  worth_why: 屡犯屡抚但已不能如父影克之世，呈现部落由忠转叛的衰落周期，可作边患教训
  era: 明万历间
  dates_known: false
rejections:
- name_zh: 革兰泰
  why_not: 仅列八子谱系与部伍骑数，无个人决策与事件
- name_zh: 董狐狸
  why_not: 仅连结族党入寇就抚反复一句，其余为九子清单，做事流过简
- name_zh: 獐兔
  why_not: 数犯边被生致赎免旋盟旋背一语而已，无完整周期
- name_zh: 土蛮憨
  why_not: 挟封贡恐喝塞上二十年不可得老而厌兵略有做事流，但主要是西虏谱系总纲坐标人物，事迹略
- name_zh: 俺答
  why_not: 文中仅作先入贡封王的参照系，详见别传
- name_zh: 脑毛大
  why_not: 始为蓟门抚夷后挟市广宁见拒一句，余为子派骑数
- name_zh: 大委正
  why_not: 佐土蛮挟封贡被拒，其二子死于犯边，无完整做事周期
- name_zh: 克石炭
  why_not: 数为患挟封贡一语，余为三子六派谱系
