verdict: has_candidates
candidates:
- name_zh: 叶旺
  score: 8
  worth_why: 与马云同心经略辽东，设伏青石山、积冰为垒、密置钉板大破纳哈出数万之众，做事流完整
  era: 明初
  dates_known: true
- name_zh: 马云
  score: 7
  worth_why: 与叶旺由登莱渡海定辽东，招降叶廷秀、平高家奴，守辽阳破虏追击三百余里
  era: 明初
  dates_known: true
- name_zh: 纳哈出
  score: 8
  worth_why: 元遗将雄踞辽东畜产富盛二十年不附，面对明军大势叹天不复与我有此众，受降宴上浇酒脱去致惊变被擒，极具名场面
  era: 元末明初
  dates_known: true
- name_zh: 冯胜
  score: 7
  worth_why: 率二十万大军北伐纳哈出，纳款受降之际应对变局，因常茂伤纳哈出致其众惊溃后说降四万余众
  era: 明初
  dates_known: true
- name_zh: 蓝玉
  score: 7
  worth_why: 一秃河受降，解衣衣人以智取纳哈出，出酒争饮逼出惊变，后随冯胜北伐立功
  era: 明初
  dates_known: true
- name_zh: 常茂
  score: 6
  worth_why: 受降宴上闻译语直前缚纳哈出、拔刀追伤其臂，葬撞之举竟促成受降与十几万部众惊溃，教训型人物
  era: 明初
  dates_known: true
