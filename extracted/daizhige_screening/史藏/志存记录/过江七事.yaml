candidates:
- name_zh: 姜曰广
  score: 8
  worth_why: 迎立之争中力主持正、议立桂王、当面折辱马士英，风骨凛然；其与史可法、马士英的博弈是弘光立国关键决策线
  era: 明末南明
  dates_known: true
- name_zh: 史可法
  score: 9
  worth_why: 勤王妥片、被马士英出卖失势；后守扬州殉国，气节名垂千古；本篇详录其迎立决策被动摇至失势全过程，做事流完整
  era: 明末南明
  dates_known: true
- name_zh: 马士英
  score: 8
  worth_why: 抢定策之功、出卖史可法、鬻爵专权，是南明速亡的教训型人物；本篇对其与姜曰广的多次交锋刻画极细
  era: 明末南明
  dates_known: true
- name_zh: 阮大铖
  score: 6
  worth_why: 刺探情报构陷姜曰广、依附马士英起复，阉党余孽的投机典型，可作教训人物，但独立做事流记录较简
  era: 明末南明
  dates_known: true
- name_zh: 陈贞慧
  score: 5
  worth_why: 复社四公子之一，本文作者，明亡后隐居不仕；但本书所载为人旁观记事，自身做事周期不足
  era: 明末清初
  dates_known: true
