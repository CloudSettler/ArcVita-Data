source: 史藏/志存记录/近峰纪略.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 皇甫录
  score: 7
  worth_why: 作者自述在礼部主持宗藩禄米改革，为立十六岁以上支禄法及宫嫔检制之法，做事流完整且有制度壮举
  era: 明代
  dates_known: true
- name_zh: 叶兑
  score: 8
  worth_why: 布衣上策言天下武事一纲三目，削平天下规模悉如其言，且辞官自保，志向超然，明哲善始善终
  era: 元末明初
  dates_known: false
- name_zh: 怀恩
  score: 9
  worth_why: 宦官护谏官林俊免死、哭殿定孝宗之位、掷还万安房中术疏，忠直做事流完整，堪称宦官典范
  era: 明成化弘治间
  dates_known: false
- name_zh: 何文鼎
  score: 7
  worth_why: 以直言极谏下狱死，言所主者为孔子孟子，死后勒碑得祭，壮年始为宦官，具教训与事名场面
  era: 明弘治间
  dates_known: false
- name_zh: 覃吉
  score: 7
  worth_why: 于东宫口授孝经及天下民情，辞庄田功在辅导孝龙潜之德，事迹可成一完整做事流
  era: 明成化间
  dates_known: false
- name_zh: 楊子器
  score: 6
  worth_why: 孝宗山陵见水上疏直谏被责，中外惜之，做事流简略但有风骨足录
  era: 明弘治间
  dates_known: false
- name_zh: 朱守谦
  score: 5
  worth_why: 靖江王出知东平州，为宗室任官之特例，事迹简略仅在引证处
  era: 明初
  dates_known: true
否决:
- name_zh: 朱宸濠
  why_not: 虽有举兵始末，然仅为乱臣失败速亡之鉴，且与宁王之乱正史已详，此篇仅采异闻
- name_zh: 明英宗
  why_not: 明君主要作时间坐标，土木之难已备于正史，此处仅采也先母救主传闻
- name_zh: 屠镛
  why_not: 仅以私隙改定条例一事，无完整做事周期
- name_zh: 章瑾
  why_not: 进宝石媚上仅一语，无事迹周期
- name_zh: 林俊
  why_not: 仅劾继晓下狱一事，赖怀恩得免，做事流不完整
- name_zh: 万安
  why_not: 进房中术为讥讽传闻，无做事流
- name_zh: 刘棨
  why_not: 仅以传闻见证人身份出现，无事可录
