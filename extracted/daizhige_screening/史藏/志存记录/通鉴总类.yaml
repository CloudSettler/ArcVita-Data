- name_zh: 唐太宗
  score: 9
  worth_why: 自述成功五事、以至诚治天下拒试佞之术；贞观之治为后世帝王标杆；滋水镜之喻有名场面
  era: 唐
  dates_known: true
- name_zh: 沈枢
  score: 7
  worth_why: 致仕后以耄耋之年编通鉴总类二百七十一门，耄期称道不倦，晚年做事流完整，是文献编纂典范
  era: 南宋
  dates_known: true
- name_zh: 司马光
  score: 9
  worth_why: 精力尽于资治通鉴，十九年成不刊之书；胜之独读之叹反映巨著与读者关系
  era: 北宋
  dates_known: true
- name_zh: 刘义隆
  score: 7
  worth_why: 元嘉之治三十年间吏守六期之断、风俗为江左之美；但元嘉北伐惨败可为教训
  era: 南朝宋
  dates_known: true
- name_zh: 元宏
  score: 8
  worth_why: 北魏孝文帝手不释卷马上口占、拒袭明帝之奢、制礼作乐迁洛汉化，改制作事完整
  era: 北魏
  dates_known: true
- name_zh: 裴行俭
  score: 8
  worth_why: 知人之鉴料王勃骆宾王等浮躁浅露不得令终，尽验；所拔偏裨多名将；识人术贯穿一生
  era: 唐
  dates_known: true
- name_zh: 张九龄
  score: 8
  worth_why: 力谏诛安禄山言有反相，明皇不纳终酿安史之乱；先见之明与不被采纳构成完整教训
  era: 唐
  dates_known: true
- name_zh: 刘裕
  score: 8
  worth_why: 以寒微起兵代晋建宋；临终顾命评檀道济谢晦诸人个性精准，后事尽验，识人与预设皆可观
  era: 南朝宋
  dates_known: true
- name_zh: 刘备
  score: 8
  worth_why: 在库人物常重其创业，此处白帝托孤预知马谡言过实不可用而葛亮不纳致街亭之败，是素材增补点
  era: 三国
  dates_known: true
- name_zh: 李嗣源
  score: 6
  worth_why: 胡人焚香愿天早生圣人为生民主，五代乱局中粗为小康，事迹较简
  era: 五代
  dates_known: true
