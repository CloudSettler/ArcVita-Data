- name_zh: 赵普
  score: 9
  worth_why: 杯酒释兵权之谋主；稍夺其权、制其钱谷、收其精兵奠定宋初文治；雪夜对定南征之策
  era: 北宋初
  dates_known: true
- name_zh: 宋太祖
  score: 9
  worth_why: 虽为君主而有商鞅变法级作为：杯酒释兵权、收兵权～置转运使通判、曹彬平江南之御将之道，属制度创建级
  era: 北宋初
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 伐江南不妄杀一人；受密赐五十万点化于爵赏之憾；听太祖恩德之遣终成名将
  era: 北宋初
  dates_known: true
- name_zh: 寇准
  score: 9
  worth_why: 澶渊之盟独劝亲征、力请渡河、限岁币二十万、纵敌保盟，名场面密集，成事流完整
  era: 北宋真宗朝
  dates_known: true
- name_zh: 王彦超
  score: 7
