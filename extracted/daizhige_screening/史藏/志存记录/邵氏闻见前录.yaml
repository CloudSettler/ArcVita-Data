  era: 五代至宋初
  dates_known: true
- name_zh: 王审琦
  score: 6
  worth_why: 禁中救火不待召领兵入卫，因忠得祸转因婚得安，做事流尚可
  era: 北宋初
  dates_known: true
- name_zh: 宋真宗
  score: 6
  worth_why: 澶渊决策迟疑以对，作寇准成事的时间坐标兼有胆怯对照
  era: 北宋真宗朝
  dates_known: true
- name_zh: 韩通
  score: 5
  worth_why: 愚愎致将士离心，反衬太祖得人心，教训型但事迹简略
  era: 五代末
  dates_known: true
