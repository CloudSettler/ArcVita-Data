verdict: has_candidates
candidates:
- name_zh: 刘若愚
  score: 8
  worth_why: 明末宦官，历万历至崇祯五朝内廷，亲历妖书案、梃击案、魏忠贤乱政诸大事，受逆案牵连下狱仍著酌中志存信史；身处 Panda 庙堂倾轧而以史笔自明，做事流完整具教训价值
  era: 明末
  dates_known: true
- name_zh: 陈矩
  score: 8
  worth_why: 司礼掌印太监，办妖书案不兴大狱、主持大审平反，口碑遍于区宇；内书堂出身为官清廉护法，为宦官中模范典型
  era: 明万历
  dates_known: true
- name_zh: 魏忠贤
  score: 9
  worth_why: 目不识丁而总掌东厂擅权乱政，客魏集团经营多年直至覆灭，逆案三十六人整肃；权阉兴亡全程可考是权术与教训的顶级样本
  era: 明末天启
  dates_known: true
- name_zh: 客氏
  score: 7
  worth_why: 天启乳母与魏忠贤表里作恶，毒害后宫妃嫔皇子，崇祯清算赐死；出身卑微而祸乱宫廷全程完整警示典型
  era: 明末
  dates_known: true
- name_zh: 王体乾
  score: 6
  worth_why: 司礼掌印八年，握印权而养乱庇奸魏忠贤，黄白买命苟存；助逆求生全程可作教训，事迹稍简
  era: 明末
  dates_known: true
- name_zh: 吕坤
  score: 6
  worth_why: 编闺范图说引发妖书之祸，本属无妄之灾；做事周期相对被动，仅一二关键节点可考
  era: 明万历
  dates_known: true
- name_zh: 崔呈秀
  score: 6
  worth_why: 阉党五虎之首，外廷与魏忠贤表里肆虐，后被清算追论；投靠与覆灭流程完整但细节不足
  era: 明末
  dates_known: true
- name_zh: 杨涟
  score: 7
  worth_why: 弹劾魏忠贤二十四罪疏名场面，正气标杆
  era: 明末
  dates_known: true
- name_zh: 郑贵妃
  score: 7
  worth_why: 国本之争核心，梃击案妖书案缠身三十年，争议极大且过程完整
  era: 明万历
  dates_known: true
