candidates:
- name_zh: 朱元璋
  score: 10
  worth_why: 从游丐至开国，鄱阳湖火攻破陈友谅、平张士诚、建号大明、亲撰周颠传、纠正蔡沈书传天文说并颁书传会选，做事流完整且名场面密布
  era: 元末明初
  dates_known: true
- name_zh: 刘基
  score: 8
  worth_why: 定策除韩林儿、请建号大明，预言休咎如神；然其传中仅见断语未见全周期
  era: 元末明初
  dates_known: true
- name_zh: 郭子兴
  score: 7
  worth_why: 精纬候者郭某卜娶盲女而生之，纠旅起事、遇甲军之执朱元璋驰援得脱，为明之肇基；做事流较完整
  era: 元末
  dates_known: false
- name_zh: 周颠
  score: 8
  worth_why: 告太平狂士、巨缶煅之不死、随征陈友谅风起马当，名场面奇绝且有自制传为证
  era: 元末明初
  dates_known: false
- name_zh: 常遇春
  score: 6
  worth_why: 鄱阳湖纵火焚连环巨舰、再战再烧，事迹仅存片段
  era: 元末
  dates_known: true
