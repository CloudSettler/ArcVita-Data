- name_zh: 野渡子
  score: 7
  worth_why: 太平天国攻金陵亲历者，困城中月余目睹陷城始末，脱难后作记警示天下团练自保，有完整亲历与醒世动机
  era: 清咸丰初 / 太平天国
  dates_known: false
- name_zh: 澄清子
  score: 6
  worth_why: 续评 Elig野渡子记，驳『送礼保平安』之愚，倡坚壁清野、众志成城之自保策，观点鲜明有教训价值
  era: 清咸丰初 / 太平天国
  dates_known: false
- name_zh: 杨秀清
  score: 7
  worth_why: 太平军攻陷金陵之主持者：先遣奸细散布流言、价购物资收买民心、掘地道用地雷轰塌仪凤门城墙破城，综理城乡馆务定二十五人一牌之制，攻心与攻城手段俱可为兵事案例
  era: 太平天国
  dates_known: true
- name_zh: 向荣
  score: 6
  worth_why: 文中称向经略，率大兵云集金陵城外，使附郭村墟难民未遭贼毒，江南大营统帅史事可考，系此时段关键人物
  era: 清咸丰初
  dates_known: true
