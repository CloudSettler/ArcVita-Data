verdict: has_candidates
candidates:
- name_zh: 纪纲
  score: 9
  worth_why: 靖难叩马投效成祖、掌锦衣兴诏狱权倾一时，矫诏夺盐夺船勒索巨富、畜亡命造甲弩、端午射柳试探百官，终被磔夷三族，权宦小人覆亡的完整做事流与警世教训
  era: 明成祖朝
  dates_known: true
- name_zh: 袁彬
  score: 8
  worth_why: 土木之变陷虏护驾，夜以背承上足、代谋辞也先尚主之请，复辟后超擢掌锦衣，遭门达构陷死罪赖杨埙击鼓鸣冤得白，忠仆患难与功高受忌的完整周期
  era: 明英宗朝
  dates_known: true
- name_zh: 牟斌
  score: 8
  worth_why: 锦衣卫中之儒 将，保护李梦阳、救谏臣刘瑾之祸、拒附权奸张雄，两遭谴谪恬然若素，直节懿行可为缇骑楷模
  era: 明孝宗弘治至正德朝
  dates_known: true
- name_zh: 门达
  score: 7
  worth_why: 依凭英宗专治诏狱构陷袁彬、谮李贤，事败论戍岭表，袁彬郊饯赠金不计旧恶，酷吏结局反衬 宽仁
  era: 明英宗朝
  dates_known: true
- name_zh: 王振
  score: 7
  worth_why: 权阉专政兴大狱害刘球李时勉，怂恿英宗亲征酿土木之变，终籍家诛族、党羽马顺被群臣当场击杀
  era: 明英宗正统朝
  dates_known: true
- name_zh: 汪直
  score: 7
  worth_why: 宪宗别置西厂权出东厂锦衣之上，擅械留守大臣海内胁惕，特务政治膨胀与裁撤的样本
  era: 明宪宗成化朝
  dates_known: true
- name_zh: 马顺
  score: 6
  worth_why: 义子事王振膝行谄事、害死刘球，终被王竑率群臣殴杀于朝，谄附权阉者的下场
  era: 明英宗正统朝
  dates_known: true
- name_zh: 刘瑾
  score: 7
  worth_why: 正德权阉逐大臣下诏狱矫诏廷杖言官，逆牟斌 直节，后伏诛，权阉之祸的又一案例
  era: 明武宗正德朝
  dates_known: true
- name_zh: 杨埙
  score: 6
  worth_why: 漆工杨埙上疏鸣袁彬 之冤，遭门达杖百余仍设计面诉自陈不诬李贤，小人物仗义舍身的名场面
  era: 明英宗朝
  dates_known: true
- name_zh: 王信
  score: 5
  worth_why: 英国公张辅举弟廉洁 清锦衣 择贤任事的佐证
  era: 明宣宗朝
  dates_known: true
- name_zh: 朱骥
  score: 5
  worth_why: 落魄军汉得于谦妻以女，历官掌锦衣二十余年，谦冤死坐累戍还，与于谦渊缘耐人寻味
  era: 明景泰至成化朝
  dates_known: true
