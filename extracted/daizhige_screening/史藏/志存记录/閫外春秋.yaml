verdict: has_candidates
candidates:
- name_zh: 赵充国
  score: 9
  worth_why: 平羌之役尽显持重将道——先疑敌诱击、致人而不致于人、穷寇勿迫， finally 不战而降羌，西方遂平，做事流完整且含兵法名言
  era: 西汉宣帝时
  dates_known: true
- name_zh: 陈汤
  score: 10
  worth_why: 明犯强汉者虽远必诛的诞生点——矫诏发西域胡汉兵四万，分道千里奔袭斩郅支单于，关键决策（矫制、按剑叱延寿）与冒险精神极富名场面潜力
  era: 西汉元帝建昭年间
  dates_known: true
- name_zh: 刘縯
  score: 8
  worth_why: 起兵反莽、反对仓促称帝的远略议论精彩，然功高遭忌被更始所诛，木秀于林之教训典型
  era: 新莽末年
  dates_known: true
- name_zh: 寇恂
  score: 8
  worth_why: 斥使者夺还印绶安上谷之人心，又力劝耿况拒王郎归光武，_walk 东联渔阳，择主决断与治郡之能俱可考
  era: 新莽末至东汉初
  dates_known: true
- name_zh: 吴汉
  score: 8
  worth_why: 渔阳突骑归光武的关键推手，诈书谲众说彭宠发兵， topLevel 择主眼光与胆略构成完整做事流
  era: 新莽末至东汉初
  dates_known: true
- name_zh: 耿纯
  score: 7
  worth_why: 率宗族二千余焚庐舍绝退路以归光武，破釜沉舟式决断可与信都议对读
  era: 新莽末年
  dates_known: true
- name_zh: 郅恽
  score: 7
  worth_why: 信都之议力阻西还长安，据思汉人心、扬响应之威而定帝业之基，一言成事的谋士典型
  era: 新莽末年
  dates_known: false
rejections:
- name_zh: 刘邦、刘秀、任光
  why_not: 高祖为时间坐标且已在库；光武帝已在库；任光事迹仅开门迎驾一句，无独立做事流
