verdict: has_candidates
candidates:
- name_zh: 周世宗（柴荣）
  score: 8
  worth_why: 高平之战亲征险败，阵前斩七十二奔将、即坐中拔擢新人整军，军声大振，是唐末藩镇军制向禁军转型关键节点
  era: 五代后周
  dates_known: true
- name_zh: 赵匡胤
  score: 9
  worth_why: 陈桥兵变入城约束军纪、与范质约宾礼保柴氏天年、撤执政坐论之制，做事实录细节罕见
  era: 五代末宋初
  dates_known: true
- name_zh: 冯道
  score: 7
  worth_why: 谏止世宗亲征直指骄将难制，一语成谶，展示五代老臣的政治洞察与自处之道
  era: 五代
  dates_known: true
- name_zh: 王朴
  score: 7
  worth_why: 枢府断案敢抗殿前都点检赵匡胤，制法严正，令太祖叹为相才
  era: 五代后周
  dates_known: true
- name_zh: 韩琦
  score: 9
  worth_why: 定策立英宗、力持皇储议终不摇、调处两宫保慈圣与帝无隙，完整定策周期与名场面俱在
  era: 北宋
  dates_known: true
- name_zh: 富弼
  score: 8
  worth_why: 封还词头开天下先例、力主早立英宗与韩琦一致而终构隙，决策与教训兼备
  era: 北宋
  dates_known: true
- name_zh: 张方平
  score: 8
  worth_why: 谏/comic谏院论遂国夫人、荐明镐代己、指地道攻城定贝州平叛之策，荐贤与谋略俱可考
  era: 北宋
  dates_known: true
- name_zh: 文彦博
  score: 7
  worth_why: 平贝州王则之乱因功拜相，密与富弼谋立储，事功与宫廷政治交织
  era: 北宋
  dates_known: true
- name_zh: 明镐
  score: 7
  worth_why: 受荐平贝州之叛，用地道攻城功成，战法事件有完整起承转合
  era: 北宋
  dates_known: false
- name_zh: 宋仁宗
  score: 7
  worth_why: 择立储君四十二年疏探怀取纸定英宗、女乐案的克制，体现宋代君主制度化决策
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 7
  worth_why: 连上四十二疏乞立嗣终于促成建储，谏官持续施政方法论典范
  era: 北宋
  dates_known: true
- name_zh: 罗兀城无名禁卒
  score: 6
  worth_why: 被敌驱呼诱降反大呼贼军粮尽励城守，被醢而忠烈过古人，教训型人物
  era: 北宋熙宁
  dates_known: false
rejections:
