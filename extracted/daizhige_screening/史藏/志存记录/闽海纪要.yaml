candidates:
- name_zh: 郑成功
  score: 10
  worth_why: 国姓爷起兵抗清收兵南澳、取厦门斩郑芝鹏申军法、逐施琅杀其父、北伐南京、终收台湾，做事流完整且忠孝两难（父降清子尽忠）为千古名场面
  era: 明末清初
  dates_known: true
- name_zh: 郑芝龙
  score: 8
  worth_why: 海盗出身归诚累迁总兵、拥立唐王又密撤仙霞关降清、被挟北去，反复抉择的完整教训，亦是成败之关键推手
  era: 明末清初
  dates_known: true
- name_zh: 南明唐王朱聿键（隆武帝）
  score: 6
  worth_why: 唐王称帝改元隆武、赐姓成功、决意亲征而殂于将乐，可作为时间坐标辅助人物，做事流偏短
  era: 南明
  dates_known: true
- name_zh: 施琅
  score: 7
  worth_why: 知兵善战定楼橹阵伍之法，因擅杀曾德与成功决裂、父弟被杀而奔清，隐含日后平台湾之伏线，但本传内做事流未完
  era: 明末清初
  dates_known: true
- name_zh: 郑鸿逵
  score: 6
  worth_why: 遇唐王于嘉兴奉以入闽定策拥立，合攻泉州、截围马得功，有做事片段但事迹较散
  era: 明末清初
  dates_known: true
- name_zh: 叶翼云
  score: 5
  worth_why: 知同安县事城破死之，忠烈可录但事迹过于简略
  era: 明末清初
  dates_known: true
