person:
  qid: guji-林则徐
  name_zh: 林则徐
  names:
    zh: 林则徐
  lifespan:
    birth:
      date: '1785'
      precision: year
      is_circa: false
      raw: 乾隆五十年前后（据通史推知）
  birth_date: '1785'
  era: 清道光年间
  reign_ref: 道光
  archetype: 禁烟名臣·虎门销烟
  dilemmas:
  - 禁烟则断贸易启衅，不禁则银荒民弱
  - 剿抚两难：具结正法之令与国王法度之冲突
  lesson: 明知具结 virulent 一线之机犹坚持法理，过刚则祸起；禁绝之途须治内与驭外并重
  summary_first_person: 我奉钦差驰赴粤东，迫使英商缴烟二万余箱，虎门销烟二百三十七万余斤，继以火攻渔艇扰夷舶， 虽因断贸酿起边衅，然使天下共知烟毒之害与我禁绝之决心。
  source_urls:
  - 史藏/志存记录/防海纪略.md
