    rationale: 明示恩威，以贸易为质促夷商呈缴趸船烟土
  - date: 1839-11
    title_zh: 力陈不可封关禁海
    rationale: 封港则尽失各夷之好，孤己而树众敌，非制夷之道
  - date: 1840-01
    title_zh: 招渔艇蛋户以毒攻毒夜袭
    rationale: 师船未可遽出大洋，借民力火攻游击于岛屿之间
