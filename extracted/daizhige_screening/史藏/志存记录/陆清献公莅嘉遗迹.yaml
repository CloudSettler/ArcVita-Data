  birth_date: '1630'
  death_date: '1692'
  era: 清代康熙年间
  reign_ref: 康熙
  archetype: 清廉理学家知县
  dilemmas:
  - 面对盐商典商常规馈赠，收一人之利还是护千万穷黎
  - 廉洁自守与催科完赋之间如何两全
  - 尖巧取悦时有司 vs 端方取士可能触忌
  lesson: 廉吏并非不能吏：心静识澄力坚，抚字催科皆可有成；为官如传舍，随时可去，无留恋则无所牵累
  summary_first_person: 我以理学自守宰嘉定，却常用的惯例馈赠、草率的迎送，自行备足日用、减免损耗羡余，又兴文重儒、收纳生童于署中讲课；虽中途罢官，去时任所之物悉留赔补，两袖清风而百姓不忘。
