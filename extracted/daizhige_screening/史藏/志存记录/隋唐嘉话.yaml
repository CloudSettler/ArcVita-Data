source: 史藏/志存记录/隋唐嘉话.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 李靖
  score: 9
  worth_why: 灭突厥擒萧铣荡平扬越，渭水之役献计倾府库赂和而潜军邀归路，兵法之学识破侯君集将反，兼有华山庙求仕逸闻，做事流与名场面俱全
  era: 隋末唐初
  dates_known: true
- name_zh: 魏征
  score: 9
  worth_why: 直言进谏名场面极多：鹞死怀中、田舍汉之怒与长孙皇后朝服贺、太宗叹为镜 doPost 人亡，劝行帝王道成贞观之治
  era: 唐初贞观
  dates_known: true
- name_zh: 太宗
  score: 9
  worth_why: 虽为君主但有突出做事：纳谏黏章于寝殿、渭桥退突厥、 夜召侯君集出其不意，贞观四年断死刑二十九人，非仅时间坐标
  era: 唐初
  dates_known: true
- name_zh: 侯君集
  score: 8
  worth_why: 破高昌隐金簟不献、学兵法而生反心、被李靖预判必反，事后乞留幼子流岭南，完整警示性做事情节
  era: 唐初
  dates_known: true
- name_zh: 薛道衡
  score: 7
  worth_why: 人日诗名场面「人归落雁后思发在花前」，因文才遭炀帝妒害「空梁落燕泥」之叹，文学成就与悲剧结局兼备
  era: 隋
  dates_known: true
- name_zh: 平阳公主
  score: 7
  worth_why: 闻父起兵于鄠司竹园招亡命迎军，娘子军之始，唐初罕见女性做事案例
  era: 隋末唐初
  dates_known: false
- name_zh: 房玄龄
  score: 7
  worth_why: 秦王时荐杜如晦「王佐才」定选人眼光，秉政三十余载，青年时已被高孝基预见兴王佐命
  era: 隋末唐初
  dates_known: true
- name_zh: 马周
  score: 5
  worth_why: 序中提及上事与曹参对照，事迹仅一笔带过
  era: 唐初
  dates_known: true
rejections:
- name_zh: 李德林
  why_not: 仅载其与杨素共执政及子百药逸事，本人无做事周期
- name_zh: 苏威
  why_not: 宝镜异闻一则，无做事流可取
- name_zh: 高颎
  why_not: 仅盘粉置卧侧记思公事一则逸闻
- name_zh: 杜如晦
  why_not: 事迹借房玄龄与高孝基之口述及，无独立完整事迹
- name_zh: 长孙皇后
  why_not: 仅朝服贺谏一则场面，无完整做事周期
