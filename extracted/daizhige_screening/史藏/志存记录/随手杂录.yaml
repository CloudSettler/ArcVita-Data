category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 苏轼
  score: 9
  worth_why: 文字动神宗传为佳话；渡海贬儋州遇僧伽送行传说；不阿吕惠卿孟学之辩；晚年谗逐至海岛仍旷达，做事流与名场面俱足
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 8
  worth_why: 每夜自省一日所费与所为之事是否相称，先忧后乐精神的具体践行，可为修身典范
  era: 北宋
  dates_known: true
- name_zh: 蔡确
  score: 8
  worth_why: 车盖亭诗案完整过程：吴处厚笺诗告发、帘前争议、贬新州别驾，文字狱兴废与党争自食恶果的教训
  era: 北宋
  dates_known: true
- name_zh: 曹彬
  score: 7
  worth_why: 攻太原将下而麾兵少却，虑功高速祸与君臣分际，进退有度的名将智慧
  era: 北宋
  dates_known: true
- name_zh: 赵普
  score: 7
  worth_why: 独对时谏止幽燕之讨，断言取之易守之难、须世世得曹翰守之，一语定罢兵的谋略名场面
  era: 北宋
  dates_known: true
- name_zh: 吕大防
  score: 6
  worth_why: 贬岭外预知死期，留命种于中土的临终决断；位至宰相后遭贬，做事流较简
  era: 北宋
  dates_known: true
- name_zh: 曾肇
  score: 6
  worth_why: 答吕惠卿苏轼何如人之问，以孟子民为重之义回击，名场面鲜明但无可考完整做事流
  era: 北宋
  dates_known: true
- name_zh: 王巩
  score: 6
  worth_why: 笔记作者，亲历苏轼、蔡确等事件并预判谪罚，可作见证者小传，事迹散见
  era: 北宋
  dates_known: true
rejections:
- name_zh: 冯悦
  why_not: 仅存服丹药生疾得道人灸法一事，医药逸事无完整做事周期
- name_zh: 唐伯虎（还魂进士）
  why_not: 志怪还魂故事，无可考干系年代与真实处世成就
- name_zh: 李氏郡君
  why_not: 还珠与冥府增寿志怪记述，纯劝善寓言
- name_zh: 张通直新妇
  why_not: 冥司误勾还魂异闻，非历史行事
- name_zh: 僧伽
  why_not: 神异传说人物，仅为故事道具
- name_zh: 柴世宗（周世宗）
  why_not: 仅毁佛铸钱传闻一则，已有库且此叙事无新做事流
