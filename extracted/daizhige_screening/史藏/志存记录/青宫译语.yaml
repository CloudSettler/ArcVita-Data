  score: 7
  worth_why: 靖康之难被俘北迁为浣衣院奴，后因其子康王赵构即位而身份逆转，绍兴和议后以太后身份南归，见证宋金和议与靖康宫人命运，显仁太后事迹可考
  era: 北宋末至南宋初
  dates_known: true
- name_zh: 邢秉懿
  score: 6
  worth_why: 康王妃，北迁途中欲自尽守节，遥册为皇后卒于北方，高宗悼念十六年不立后，遭际可作教训与节烈典范
  era: 北宋末至金初
  dates_known: true
- name_zh: 王成棣
  score: 5
