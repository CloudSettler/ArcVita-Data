- name_zh: 方腊
  score: 9
  worth_why: 从漆园之怨到借左道聚众起事，召恶少宴议痛陈花石纲之弊、定画江而守之略，陷六州五十二县，兵败被擒于帮源洞，做事流完整且警示深
  era: 北宋末
  dates_known: true
- name_zh: 韩世忠
  score: 7
  worth_why: 时为王渊裨将，潜行谿谷问农妇得小径，只身度险格杀数十人擒方腊，名将成名之始
  era: 北宋末
  dates_known: true
- name_zh: 朱勔
  score: 7
  worth_why: 主花石纲媚上，搜山剔渊扰民东南数十郡，逼反方腊，祸首教训典型
  era: 北宋末
  dates_known: true
- name_zh: 童贯
  score: 6
  worth_why: 宣抚使移师南下平乱，初罢造作局花石纲，然其本人亦是致乱推手
  era: 北宋末
  dates_known: true
- name_zh: 陈硕真
  score: 6
  worth_why: 中国史上罕见称帝起事之女子，自称文佳皇帝，为方腊所托天子基传说之源头，事迹简略
  era: 唐永徽年间
  dates_known: true
