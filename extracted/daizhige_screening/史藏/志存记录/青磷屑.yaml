category: 史藏/志存记录
person:
  qid: guji-史可法
  name_zh: 史可法
  names:
    zh: 史可法
    en: Shi Kefa
  lifespan:
    birth:
      date: '1601'
      precision: year
      is_circa: true
      raw: 明万历年间生
    death:
      date: '1645'
      precision: year
      is_circa: true
      raw: 弘光元年殉于扬州
  birth_date: '1601'
  death_date: '1645'
  era: 明末南明
  reign_ref: 崇祯 / 弘光
  archetype: 督师殉城之忠烈社稷臣
  dilemmas:
  - 拥立定策之后自请出镇以远权势
  - 迁督府就跋扈之高杰以换扬州安堵
  - 孤城难守而毅然以死殉国
  lesson: 东西南北惟君所使，知其不可为而为之
  summary_first_person: 我在弘光建政之际带头定策，却自请出督淮扬，以宽厚驭骄兵；明知大厦将倾，仍竭力经营中州之志，终以扬州一城之殉，全我名节。
  source_urls:
  - 志存记录《青磷屑》
endeavors:
- id: guji-史可法-endeavor-1
  name_zh: 督师淮扬
  phases:
  - key: brewing
    name_zh: 拥立定策并自请督师
    labels:
      zh:
      - 迎立
      - 自请出镇
    start_date: 1644-06
    highlight_event_id: guji-史可法-event-shouming
  - key: breakthrough
    name_zh: 调和四镇收服高杰
    labels:
      zh:
      - 分布四镇
      - 驭骄帅
    start_date: 1644-08
    highlight_event_id: guji-史可法-event-jiechi
  - key: climax
    name_zh: 迁府扬州经营中州
    labels:
      zh:
      - 移督府
      - 锐意河南
    start_date: 1644-09
    highlight_event_id: guji-史可法-event-qianfu
  - key: closure
    name_zh: 殉于扬州
    labels:
      zh:
      - 死节
    start_date: '1645'
    highlight_event_id: guji-史可法-event-death
  decisions:
  - date: 1644-06
    title_zh: 辞居守而自请督师
    rationale: 马士英以其督师之名相推，公以东、西、南、北惟君所使，不敢惜顶踵私尺寸
  - date: 1644-08
    title_zh: 具疏请以廷吉等军前效用并铸从征七印
    rationale: 初定从征文武官员经制俸廪，开标额兵三万人以立军政之基
  - date: 1644-09
    title_zh: 奏定四镇驻划分界
    rationale: 泽清驻淮安、高杰驻瓜扬、得功驻仪征、良佐驻寿春，各有分界以杜私争
  - date: 1644-09
    title_zh: 迁东偏行署而以督府居扬州
    rationale: 高杰必欲以扬为镇，屡肆要挟，守土以无祸为辞，公迁府以纾城祸
- id: guji-史可法-endeavor-2
  name_zh: 铸印设官整军经武
  phases:
  - key: brewing
    name_zh: 初至军前谘询占验
    labels:
      zh:
      - 试占牙旗
    start_date: 1644-08
    highlight_event_id: guji-史可法-event-zhanfeng
  - key: breakthrough
    name_zh: 设监军监纪络络诸印
    labels:
      zh:
      - 铸印
      - 置官
    start_date: 1644-09
    highlight_event_id: guji-史可法-event-zhuyin
  - key: climax
    name_zh: 锐意兵指中州
    labels:
      zh:
      - 图河南
    start_date: 1644-09
    highlight_event_id: guji-史可法-event-henan
  decisions:
  - date: 1644-08
    title_zh: 疏救废藩唐王
    rationale: 唐藩以阁部有肄业之恩，往还简札称门生，公不避嫌而救之
  - date: 1644-08
    title_zh: 试应廷吉占风而时咨问焉
    rationale: 占验屡中，公因其学之非妄，引为军前谘询
events:
- id: guji-史可法-event-birth
  date: '1601'
  year_of: '1601'
  title_zh: 出生
  summary: 史可法生于明万历二十九年前后
- id: guji-史可法-event-shouming
  date: 1644-06
  year_of: '1644'
  title_zh: 进太子太保督师淮扬
  summary: 朝议既定，马士英辞不欲出，史公曰东西南北惟君所使，遂加太子太保、兵部尚书、武英殿大学士，视师淮扬
- id: guji-史可法-event-jiechi
  date: 1644-08
  year_of: '1644'
  title_zh: 为高杰所劫于福缘庵
  summary: 高杰以扬州事要挟，劫阁部于福缘庵，罗兵环堵；公夷然处之旬日，为疏请以瓜步屯其士卒，众志稍安
- id: guji-史可法-event-zhanfeng
  date: '1644-08-15'
  year_of: '1644'
  title_zh: 升帐占风
  summary: 八月十五牙旗被旋风吹折，命应廷吉占之，谓贵人将至、内有争斗失火损畜；后土桥之变与火事果验
- id: guji-史可法-event-zhuyin
  date: 1644-09
  year_of: '1644'
  title_zh: 请印七颗设从征官制
  summary: 疏请铸七印分掌督饷、监军、职方、监纪诸官制，从征文武经制始立
- id: guji-史可法-event-qianfu
  date: 1644-09
  year_of: '1644'
  title_zh: 迁督府居扬州
  summary: 高杰为国用兵之亟，公以柔道驭之，迁东偏行署而以督府居之，扬州遂安堵
- id: guji-史可法-event-henan
  date: 1644-09
  year_of: '1644'
  title_zh: 锐意兵指中州
  summary: 公锐意规复河南，黄日芳、陆逊之叩应廷吉，谓明年太乙在震角亢司垣，恐当殒上将
- id: guji-史可法-event-death
  date: '1645'
  year_of: '1645'
  title_zh: 殉于扬州之难
  summary: 弘光元年夏，扬州孤城难支，公以身殉国
verdict: has_candidates
