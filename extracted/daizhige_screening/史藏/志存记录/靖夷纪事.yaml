verdict: has_candidates
candidates:
- name_zh: 高拱
  score: 9
  worth_why: 隆庆间主政处理安氏之乱，力排众议不用兵而遣科官勘问，不战而定土酋之变，并起用阮文中剿平巨寇者念，展现完整决策周期与驭边智慧，自纪其事成《靖夷纪事》
  era: 明隆庆年间
  dates_known: true
- name_zh: 阮文中
  score: 8
  worth_why: 由太仆少卿被推为贵州巡抚，初欲用兵后接受高拱方略，责令安国亨输银献犯、安插安智，不烦兵革平定安氏之乱；又发兵擒斩僭号三十余年巨寇者念，做事流完整
  era: 明隆庆年间
  dates_known: true
rejections:
- name_zh: 安国亨
  why_not: 土酋按问对象，虽有献纳输服情节但主要是被处置者，不构成独立做事流
- name_zh: 安智
  why_not: 与安国亨相雠杀之另一方，事迹简略且同为被处置者
- name_zh: 贾三近
  why_not: 奉命往勘中途事定而还，无独立做事周期
- name_zh: 者念
  why_not: 僭号巨寇，仅被剿平作为阮文中事功注脚
- name_zh: 安民
  why_not: 仅代管宣慰事一句，无事迹
