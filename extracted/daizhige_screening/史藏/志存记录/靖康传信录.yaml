- name_zh: 李纲
  score: 10
  worth_why: 靖康守城名臣；力谏勿弃都城、亲征行营使、四壁守御使；汴京保卫战决策者；因姚平仲劫寨罢职而士民伏阙复职；直言和战方略、宣抚河北而屡遭罢斥；完整做事流与家国之训兼具
  era: 北宋末南宋初
  dates_known: true
- name_zh: 吴敏
  score: 7
