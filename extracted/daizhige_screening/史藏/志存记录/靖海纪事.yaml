candidates:
- name_zh: 施琅
  score: 10
  worth_why: 复台第一功；先后三疏力主平台湾，留京宿卫十余年不弃其志；澎湖海战六日破郑军，聚米作地势、骄兵之计、散金犒士；克台后不报家仇赦郑氏、放归俘虏、难民送回籍；最关键的是《恭陈台湾弃留疏》力主留台设官兵，奠定台湾入版图。做事流完整（缘起三疏—专征—澎湖决胜—受降—弃留大策），且有'施琅平台'名场面与'忠贞不贰'与'私仇不废国事'的双重启发
  era: 明末清初至康熙
  dates_known: true
- name_zh: 郑成功
  score: 7
  worth_why: 驱荷兰复台湾、抗清三十七年格局的缔造者，作为施琅的对手与台湾汉人政权奠基者值得录
  era: 清初
  dates_known: true
- name_zh: 郑经
  score: 6
  worth_why: 承继郑氏经营台湾与三藩之乱时进犯闽海的作为，可作时间坐标与对照人物
  era: 清初
  dates_known: true
