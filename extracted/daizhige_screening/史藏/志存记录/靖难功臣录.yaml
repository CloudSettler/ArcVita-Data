source: 史藏/志存记录/靖难功臣录.md
category: 史藏/志存记录
verdict: has_candidates
candidates:
- name_zh: 姚广孝
  score: 9
  worth_why: 靖难首谋者，白帽子对联点破天机，运筹帷幄辅佑世子居守，僧衣黑衣宰相，功成不改僧相
  era: 明初建文至永乐
  dates_known: true
- name_zh: 张玉
  score: 9
  worth_why: 靖难帷幄第一谋将，夺九门定北平，识耿炳文军无纪律，东昌力救战殁，追封河间忠武王
  era: 明初建文年间
  dates_known: true
- name_zh: 朱能
  score: 9
  worth_why: 真定率三十骑冲阵破耿炳文，东昌翼上突围，小河之败独劝进兵引汉高项羽为喻，封成国公
  era: 明初建文至永乐
  dates_known: true
- name_zh: 薛禄
  score: 8
  worth_why: 五十骑破数百敌、被擒夺刀复马上战，以戎伍起至封阳武侯，靖难全程战功完整
  era: 明初建文至永乐
  dates_known: true
- name_zh: 顾成
  score: 8
  worth_why: 南将被俘反受托付辅仁宗居守，屡有谗言而用其谋城不陷，得势辞兵权谨身免祸，教训与启示兼备
  era: 明初洪武至永乐
  dates_known: true
- name_zh: 李友直
  score: 7
  worth_why: 布政司吏密首张昺谋告靖难机密，由吏擢至工部尚书，小人物关键情报改换命运
  era: 明初建文至永乐
  dates_known: true
- name_zh: 孙岩
  score: 7
  worth_why: 宿将守通州御围城，力主出城逆击平安十余万众大溃，善始善终封应城伯
  era: 明初建文至永乐
  dates_known: true
rejections:
- name_zh: 谭渊
  why_not: 擒将夺门有战功然事迹琐碎，早卒于夹河，无完整做事流
- name_zh: 李彬
  why_not: 官阶迁转罗列为主，功业同于诸将不突出
- name_zh: 陈珪
  why_not: 仅随军战绩流水账，无关键决策场面
- name_zh: 徐忠
  why_not: 一句一迁官，无独立事件细节
- name_zh: 武胜
  why_not: 传文数十字，仅渡江遇害一事
- name_zh: 刘中孚
  why_not: 生员守门办事，事迹简略无可观做事流
- name_zh: 陈贤
  why_not: 文末残缺，传仅一段战历
- name_zh: 太宗文皇帝（朱棣）
  why_not: 君主天下共主，靖难可入其本纪自录，此处低优先
