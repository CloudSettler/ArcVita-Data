candidates:
- name_zh: 方孝孺
  score: 10
  worth_why: 明代儒宗，靖难拒草诏而殉节，株连十族八百四十七人，绝命词传世，忠节与殉道教训兼具，读书治学做事流完整
  era: 明初建文年间
  dates_known: true
- name_zh: 黄子澄
  score: 8
  worth_why: 建文帝首席谋臣，东角门定削藩策，主先后翦除诸王之谋，终误国族诛，为决策失误之典型教训
  era: 明初建文年间
  dates_known: true
- name_zh: 齐泰
  score: 8
  worth_why: 兵部尚书主讨燕之策，历数边将如流，削藩主谋之一，兵败抗辞不屈被族诛，做事流完整
  era: 明初建文年间
  dates_known: true
- name_zh: 铁铉
  score: 7
  worth_why: 目录有名，史载守济南拒燕军、不屈死节之名臣
  era: 明初建文年间
  dates_known: true
- name_zh: 谢贵
  score: 6
  worth_why: 以北平都指挥使围燕王府，后被燕王计擒被杀，为靖难之役导火索人物
  era: 明初建文年间
  dates_known: false
- name_zh: 张昺
  score: 6
  worth_why: 北平左布政使，监视燕藩之首臣，与谢贵同被计擒
  era: 明初建文年间
  dates_known: false
