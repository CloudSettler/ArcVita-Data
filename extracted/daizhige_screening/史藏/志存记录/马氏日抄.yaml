category: 史藏/志存记录
verdict: no_value
skip_reason: 明人马愈《马氏日抄》为笔记杂录，所载多为传闻异事、器物考订与神怪故事，人物皆片段轶事，无可考的完整做事周期与生卒年代，无成语名场面级人物
rejections:
- name_zh: 来定
  why_not: 御用监奉御与髑髅戏语一段小事即病卒，无做事流
- name_zh: 胡源洁
  why_not: 仅记其居官俭约旧事数则，无关键决策与事业阶段
- name_zh: 王振
  why_not: 仅涉狼异、井异等灾祥附会，无做事周期叙述
- name_zh: 李通
  why_not: 应募较艺十八能一段，事迹单薄且卒年行止无考
- name_zh: 马愈
  why_not: 作者自记见闻，无独立事业时间轴可建
- name_zh: 陶谷
  why_not: 依样画葫芦故事经转引，仅一轶事无完整做事流
