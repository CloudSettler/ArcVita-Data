  archetype: 实业教育考察者与地方兴学者
  dilemmas:
  - 蜷伏里闾投身社会事业与慕乘风破浪游历天下之志的两难
  - 渡台调查实业，返闽后建言未获施行，有志难酬
  lesson: 读不了万卷书就力行万里路；考察所得唯有化为学堂、工厂与制度改良，才算不虚壮游
  summary_first_person: 戊戌后我以视察员三渡日本，考察博览与学制，归国十年手创泉山幼儿园、女子职业学校、苍霞中学、高等工业学校诸校；壬子又奉命渡台调查实业，遍观铁路、权度、专卖、糖厂与农产共进会，笔之于日记以待来者。
