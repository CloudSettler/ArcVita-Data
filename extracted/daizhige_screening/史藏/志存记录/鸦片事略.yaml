- name_zh: 李圭
  score: 6
  worth_why: 汇集三百年鸦片流变与禁令弛张，成《鸦片事略》，属当代人记当代事的第一手史料；然多为纂辑而少个人做事流，缓录
  era: 清末
  dates_known: true
- name_zh: 许乃济
  score: 6
  worth_why: 道光十六年上弛禁鸦片疏，主张照药材纳税、以货易货禁银出洋，引发朝局大争论；事迹简略暂缓
  era: 清道光
  dates_known: true
- name_zh: 许球
  score: 6
  worth_why: 力驳弛禁论，主张谨守旧禁严禁鸦片，为严禁派先声；传文仅存议论，做事周期不完整，暂缓
  era: 清道光
  dates_known: false
rejections:
