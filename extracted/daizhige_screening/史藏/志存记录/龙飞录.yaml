verdict: has_candidates
candidates:
- name_zh: 宋孝宗
  score: 8
  worth_why: 新政开局可考成一做事流——为岳飞以一品礼改葬、罢御前激赏库归左帑、定五日一朝改朔望朝德寿宫、拒绝金国书改式之胁迫、改元隆兴，多有关键决策点
  era: 南宋
  dates_known: true
- name_zh: 汪应辰
  score: 7
  worth_why: 力主罢上尊号之议，率给舍台谏不签议状，死守元丰罢尊号祖制，一谏之节可成一局
  era: 南宋
  dates_known: true
- name_zh: 洪迈
  score: 7
  worth_why: 使金因表章用式与金人抗争，被扃驿绝供始易表章，辱节与守节之抉择可作教训类名场面
  era: 南宋
  dates_known: true
- name_zh: 张浚
  score: 7
  worth_why: 隆兴初除少傅江淮宣抚使进封魏国公，统军江淮，为复国做事流之起点，与隆兴北伐相连
  era: 南宋
  dates_known: true
- name_zh: 周必大
  score: 6
  worth_why: 以编年日记实录新政细节，史料价值高，但个人做事周期在篇中不完整
  era: 南宋
  dates_known: true
- name_zh: 韩侂胄
  score: 5
  worth_why: 述绍兴间使金被诟辱留涿州事，仅见一方志异闻，无完整做事流
  era: 南宋
  dates_known: true
- name_zh: 袁孚
  score: 5
  worth_why: 论德寿宫中官梁康民开酤事遭御批申饬而请去，事情完整但规模太小
  era: 南宋
  dates_known: true
rejections:
- name_zh: 刘藻
  worth_why: 仅卒年官历与误召岭南同名者轶事，无做事周期
- name_zh: 太上皇帝（宋高宗）
  worth_why: 篇中仅作受尊号、定朝谒之礼的坐标人物，无做事主线，君主低优先
- name_zh: 吴拱
  worth_why: 仅有保奏将士转官的战报摘录，人物无决策可为
