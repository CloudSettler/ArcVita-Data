  worth_why: 南宋编纂家，先成西汉会要再续东汉会要四十卷，断代会要体例开创者之一，宝庆二年奏进，做事流完整且可考
  era: 南宋
  dates_known: true
- name_zh: 汉明帝
  score: 6
