  era: 东汉
  dates_known: true
- name_zh: 汉章帝
  score: 6
  worth_why: 与明帝并称明章嗣轨，建初元和年号之下制度渐备，本文仅列世系
  era: 东汉
  dates_known: true
- name_zh: 杨震
  score: 6
  worth_why: 太尉任上直谏抗宦官，四知却金之名场面，安帝朝做事流可考，惜本文仅见其名
  era: 东汉
  dates_known: true
