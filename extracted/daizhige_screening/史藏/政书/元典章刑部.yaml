category: 史藏/政书
verdict: no_value
skip_reason: 《元典章刑部》为元代刑律政书，主体是刑罚条文、断例与圣旨节次，人物仅作为奏事官员或犯案者零星出现，无完整做事周期与名场面，不具录入时间轴价值
rejections:
- name_zh: 中书省诸臣
  why_not: 文中仅见奏准文书之程序性记载，无个人做事流与可考生卒
- name_zh: 胡光弼
  why_not: 仅为豪霸迁徙案例中的犯事者，无完整事迹
- name_zh: 童庆七、童庚二
  why_not: 移乡刺目凶徒个案，属判例素材非可成事人物
- name_zh: 冯子振
  why_not: 迁徙途中遇赦案例人物，仅一句提及无做事周期
