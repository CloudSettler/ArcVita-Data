source: 史藏/政书/国朝宫史.md
category: 史藏/政书
verdict: no_value
skip_reason: 国朝宫史为清代宫廷典制政书（训谕、典礼、宫殿、经费、官制、书籍六门），系谕旨规制汇编而非人物传记：虽涉顺治、康熙、乾隆诸帝及太监吴良辅等，但均无完整做事周期叙事，仅作制度与时间坐标，无成事儿时间轴可抽取对象
rejections:
- name_zh: 顺治帝（世祖）
  why_not: 仅有整顿内廷谕旨若干条，非传记，无做事周期叙事
- name_zh: 康熙帝（圣祖）
  why_not: 宫禁训谕数十条，属规章制度记录，人已在库且非传记文本
- name_zh: 乾隆帝（高宗）
  why_not: 仅见修书谕旨与校上题识，无个人做事流
- name_zh: 吴良辅
  why_not: 仅顺治十五年谕中提及其交通纳贿被逮问，事迹数句不成周期
- name_zh: 纪昀
  why_not: 仅为总校上题名，无事迹文本
- name_zh: 陆锡熊
  why_not: 仅总校题名，无事迹
- name_zh: 孙士毅
  why_not: 仅总纂题名，无事迹
- name_zh: 王振
  why_not: 仅于铁敕谕中作为明代宦官祸乱列举，非本传
- name_zh: 魏忠贤
  why_not: 同为鉴戒列举，无本传文本
