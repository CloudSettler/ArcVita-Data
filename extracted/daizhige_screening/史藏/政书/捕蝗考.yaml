source: 史藏/政书/捕蝗考.md
category: 史藏/政书
verdict: has_candidates
candidates:
- name_zh: 徐光启
  score: 9
  worth_why: 除蝗疏首倡蝗灾可治论，考订蝗生之地在涸泽、断为虾子所化，系统提出消弭剪除之法，科学精神与济民担当兼备
  era: 明末
  dates_known: true
- name_zh: 姚崇
  score: 9
  worth_why: 开元四年力排修德灭蝗之谬议，遣御史督捕，杀虫救人祸归于崇，终灭蝗害，为破除迷信果断担当的典范
  era: 唐
  dates_known: true
- name_zh: 陈芳生
  score: 7
  worth_why: 辑录历代捕蝗法成编，备蝗事宜十条条分缕析，主张先事预弭、临时竭除、责成有司，有著述做事流
  era: 清初
  dates_known: false
- name_zh: 吴遵路
  score: 7
  worth_why: 知蝗不食豆苗且虑遗种为患，广收豌豆教民种植，次年民大获其利，防灾预防思路可考
  era: 宋
  dates_known: false
rejections:
- name_zh: 倪若水
  why_not: 以修德拒捕蝗，被驳惧而纵捕，仅一反面片段无完整做事周期
- name_zh: 卢怀慎
  why_not: 仅反对杀蝗一言，教训意义已并入姚崇事，不单独成轴
- name_zh: 过庭训
  why_not: 山东赈饥换饼捕蝗一事详实但仅为单一行政举措，周期不完整
