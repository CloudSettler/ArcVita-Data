  worth_why: 洪武六年受诏重会众律，次年成大明律三十卷六百零六条，篇目一准于唐，为中国法典史上承唐启清的关键做事周期
  era: 明初
  dates_known: true
- name_zh: 白昂
  score: 7
  worth_why: 弘治间奉诏主持查议问囚条例，会同三法司革冗琐、存切要，成弘治问刑条例，明代律例合编格局的奠基性决策
  era: 明弘治
  dates_known: true
- name_zh: 顾应祥
  score: 7
  worth_why: 嘉靖二十九年领衔重修问刑条例，申明条例以一法守，针对妄引条例故入人罪立黜罚之条，做事缘起、过程、结果俱全
  era: 明嘉靖
  dates_known: true
- name_zh: 朱元璋
  score: 6
  worth_why: 御制定律、颁大诰、革榜文禁例，定律以绳顽的制度设计者；然君主低优先，且已有库中先例以制度主导者录入，可缓议
  era: 明初
  dates_known: true
