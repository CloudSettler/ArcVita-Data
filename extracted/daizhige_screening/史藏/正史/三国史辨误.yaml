  worth_why: 清代考据家，少从何焯游，博通经史，长于考订，所著九种之一即《三国志校误》，抉摘精审，能与三刘校《西汉书》、吴缜校《五代史》媲美；然生平行事简略，缺乏完整做事流与名场面
  era: 清代
  dates_known: false
- name_zh: 何焯
  score: 7
  worth_why: 义门读书记中校《三国志》三卷，校勘详博，曾考定杨阜传“褒袖”条并检《宋书五行志》得证；清代著名校勘学家，义门先生，弟子陈景云出其门下，属可录之列但本传中仅见片段
  era: 清代
  dates_known: false
