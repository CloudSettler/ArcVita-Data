candidates:
- name_zh: 荀彧
  score: 9
  worth_why: 王佐之才，谋迎天子都许定大战略，官渡居中镇守定人心，先后荐郭嘉荀攸陈群等；谏阻九锡之议忧愤而卒，功成不得身退的名场面与教训俱全
  era: 东汉末
  dates_known: true
- name_zh: 周瑜
  score: 9
  worth_why: 赤壁之战火攻破曹，三分天下格局定于此役；后续岁苦战取南郡；曲有误周郎顾传为美谈，雄烈冠世而早逝
  era: 东汉末
  dates_known: true
- name_zh: 陆逊
  score: 9
  worth_why: 夷陵之战火烧连营大破刘备，石亭之战破曹休位至丞相；出将入相而困于二宫之争忧愤卒，完整做事流与结局教训俱备
  era: 三国吴
  dates_known: true
- name_zh: 郭嘉
  score: 8
  worth_why: 十胜十败论振军心，算定孙策吕布二袁，遗计定辽东；曹操哭郭嘉为官渡后最著名谋士叙事
  era: 东汉末
  dates_known: true
- name_zh: 贾诩
  score: 8
  worth_why: 一言乱长安为乱局之始，宛城反曹献策、官渡定议、离间马超韩遂、以一句答问定曹丕储位，算无遗策而保身善终
  era: 东汉末三国
  dates_known: true
- name_zh: 华佗
  score: 8
  worth_why: 创麻沸散行外科手术、五禽戏导引传世，医术流完整；不肯侍曹操终遭狱杀，医书焚绝成千古之憾
  era: 东汉末
  dates_known: true
- name_zh: 张辽
  score: 8
  worth_why: 逍遥津八百破十万威震江东，白狼山阵斩蹋顿；由降将到名将的完整上升流
  era: 东汉末三国魏
  dates_known: true
- name_zh: 吕蒙
  score: 8
  worth_why: 士别三日刮目相待的勤学典范；白衣渡江袭取荆州擒关羽，战略名场面与功成身死交织
  era: 东汉末三国吴
  dates_known: true
- name_zh: 鲁肃
  score: 8
  worth_why: 榻上策先于隆中对提出帝王之业蓝图，力主联刘抗曹并促成孙刘联盟，单刀会赴会气度非凡
  era: 东汉末三国吴
  dates_known: true
- name_zh: 邓艾
  score: 8
  worth_why: 屯田淮南、却敌陇西，偷渡阴平七百里灭蜀为奇袭战经典；骤胜而骄父子俱死，兴衰一线教训深刻
  era: 三国魏
  dates_known: true
- name_zh: 姜维
  score: 8
  worth_why: 承诸葛亮遗志九伐中原，沓中败退后一计害三贤假降钟会图复国，事败自尽，忠烈与悲剧结局俱全
  era: 三国蜀
  dates_known: true
- name_zh: 袁绍
  score: 7
  worth_why: 由兼并四州到官渡倾覆的由盛转衰全周期，是听不进忠言错失良机的教科书式教训
  era: 东汉末
  dates_known: true
- name_zh: 庞统
  score: 7
  worth_why: 耒阳治政显才、献上中下三策定取蜀方略，落凤坡殒命成千古憾事，凤雏之才与早逝教训并具
  era: 东汉末
  dates_known: true
- name_zh: 法正
  score: 7
  worth_why: 奇画策算助刘备取蜀定汉中，定军山之谋致夏侯渊授首，刘备称汉中王的第一功臣，恩怨分明有始有终
  era: 东汉末
  dates_known: true
- name_zh: 陆抗
  score: 7
  worth_why: 西陵之战平步阐破叛军，忧念吴势上疏论保境之道，吴国最后的名将，亡国之兆下的独木支撑
  era: 三国吴
  dates_known: true
