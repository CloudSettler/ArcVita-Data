candidates:
- name_zh: 吴仁杰
  score: 7
  worth_why: 南宋考据名家，为补正三刘之说撰《两汉刊误补遗》，引据赅洽、考证详晰，四库评其瑕一而瑜百；缘起承三刘校汉书之绪，知罗田县时自刊板，后经全州重刊、抄本传世，成书做事周期完整，可为治学之范
  era: 南宋
  dates_known: true
- name_zh: 刘攽
  score: 7
  worth_why: 首撰两汉书刊误开汉书校勘学先河，后世补正皆本之；又佐司马光修《资治通鉴》分任汉代部分，学术做事流完整且影响深远
  era: 北宋
  dates_known: true
- name_zh: 刘敞
  score: 6
  worth_why: 与弟攽、子奉世皆精于《汉书》，随读随释终成三刘标注之学；博通经史百家，著述开宋儒学风；本篇所载以校书为主，故缓
  era: 北宋
  dates_known: true
- name_zh: 刘奉世
  score: 5
  worth_why: 承家学与父叔同校《汉书》共成三刘之名；本篇仅见校书一端，事迹简略，缓录
  era: 北宋
  dates_known: true
