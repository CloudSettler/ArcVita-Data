candidates:
- name_zh: 札木合
  score: 8
  worth_why: 与铁木真结为安答又终身相争；会盟十一部共立局儿罕；秃律别儿河岸踏岸斫林之誓为名场面；其兴衰映照草原由血缘贵族走向集权之变
  era: 蒙古高原诸部争霸时期（十二世纪末至十三世纪初）
  dates_known: true
- name_zh: 汪罕
  score: 7
  worth_why: 两度亡国皆赖也速该父子复起，受尊为义父却夜遁背盟，终因忘恩负义败亡；义父背信的典型教训
  era: 十二世纪克烈部
  dates_known: true
