candidates:
- name_zh: 北魏孝文帝元宏
  score: 9
  worth_why: 迁都洛阳、禁胡服断北语改姓氏定族姓，太和汉化改制堪比变法级；改制速成亦埋六镇隐患，启发与教训兼具
  era: 北魏中期
  dates_known: true
- name_zh: 郦道元
  score: 9
  worth_why: 代表作水经注为地理巨著兼山水文章之祖，名为注经实为治史；忠直行事为萧宝夤所杀于阴盘驿，做事流完整
  era: 北魏后期
  dates_known: true
- name_zh: 高欢
  score: 9
  worth_why: 从六镇戍卒到东魏霸主；韩陵之战以少胜多灭尔朱氏；玉壁顿兵智穷力竭，临终命斛律金唱敕勒歌，名场面与教训俱全
  era: 北魏末至东魏
  dates_known: true
- name_zh: 宇文泰
  score: 9
  worth_why: 沙苑之战以一当十破高欢；创府兵制立八柱国，用苏绰颁六条诏书，开隋唐制度与关陇集团之先河
  era: 西魏
  dates_known: true
- name_zh: 隋文帝杨坚
  score: 9
  worth_why: 代周建隋，开皇九年渡江灭陈一统南北；创三省六部与开皇律，均田定赋成开皇之治
  era: 隋
  dates_known: true
- name_zh: 魏道武帝拓跋珪
  score: 8
  worth_why: 参合陂之战大破后燕复建代魏，离散诸部分土定居使部落联盟转为国家；晚年残暴为子所弑，教训深刻
  era: 北魏开国
  dates_known: true
- name_zh: 魏太武帝拓跋焘
  score: 8
  worth_why: 灭夏、北燕、北凉统一北方，北却柔然南挫刘宋；因修国史与灭佛毁誉并存，终为中常侍所弑
  era: 北魏
  dates_known: true
- name_zh: 冯太后
  score: 8
  worth_why: 两朝临朝称制，行班禄、均田、三长之制，为太和改制奠基，古代最成功女执政者之一
  era: 北魏
  dates_known: true
- name_zh: 崔浩
  score: 8
  worth_why: 三朝谋主算无遗策，助太武帝定统一方略；主修国史直书拓跋旧事触发国史之狱而夷族，警示至深
  era: 北魏
  dates_known: true
- name_zh: 苏绰
  score: 8
  worth_why: 颁六条诏书为西魏治国纲领，创计帐户籍与朱出墨入记账法；与宇文泰日夜共政积劳而卒，寒士辅国之典范
  era: 西魏
  dates_known: true
- name_zh: 韦孝宽
  score: 8
  worth_why: 玉壁之战孤城破高欢攻城诸术，东魏死者七万智穷力竭；晚年用反间平尉迟迥三总管之乱
  era: 西魏北周至隋
  dates_known: true
- name_zh: 周武帝宇文邕
  score: 8
  worth_why: 韬晦十二年手诛权臣宇文护；灭佛强兵，五道伐齐统一北方，惜英年早逝功败垂成
  era: 北周
  dates_known: true
- name_zh: 长孙晟
  score: 8
  worth_why: 一箭双雕成语本源；使突厥尽知虚实，以离间分化东西突厥，为开皇北疆不战而屈人之兵之策
  era: 隋
  dates_known: true
- name_zh: 隋炀帝杨广
  score: 8
  worth_why: 开大运河、创进士科、营东都皆遗后世之利；三征高句丽民力竭尽身死国灭，最典型亡国教训之一
  era: 隋
  dates_known: true
- name_zh: 兰陵王高长恭
  score: 7
  worth_why: 邙山之战率五百骑免胄入周军解金墉之围，军中作兰陵王入阵曲传世；功高震主遭鸩，教训典型
  era: 北齐
  dates_known: true
