source: 史藏/正史/北齐书.md
category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 高欢
  score: 10
  worth_why: 从队主函使做到东魏霸主，做事流极完整；御恶马进言、诈书激变收六镇降户、信都建义、韩陵之战灭尔朱氏，晋阳霸府开北齐基业；玉璧兵挫后令斛律金唱敕勒歌自安军心为千古名场面；雪涕执别激众、隔水拜安抚尔朱兆等关键决策俱可鉴
  era: 北魏末至东魏
  dates_known: true
- name_zh: 段韶
  score: 8
  worth_why: 北齐第一名将，邙山一役统军退周师救洛阳，临机决断老成谋国，历事三朝为国柱石，兵家决策可师
  era: 东魏至北齐
  dates_known: true
- name_zh: 高长恭
  score: 8
  worth_why: 兰陵王邙山率五百骑解洛阳之围，催生兰陵王入阵曲；貌美假面破敌为名场面；功高被鸩是震主之祸的标本
  era: 北齐
  dates_known: true
- name_zh: 斛律光
  score: 8
  worth_why: 射雕手落雕都督，治军严整屡败周师；因百升飞上天谣谗见杀，周武帝闻之灭齐后追念，谗杀良将自毁长城的大教训
  era: 东魏至北齐
  dates_known: true
- name_zh: 高洋
  score: 7
  worth_why: 快刀斩乱麻决乱丝见英气；受禅建齐、北破契丹柔然、筑长城；后期酗虐戮宗室戮勋臣，由英明而疯狂是帝王的极端教训
  era: 东魏至北齐
  dates_known: true
- name_zh: 高纬
  score: 7
  worth_why: 诛斛律光、鸩兰陵王自毁柱石，晋州危急犹与冯小怜围猎致晋阳失陷，玉体横陈典故诞生点，完整亡国警示流
  era: 北齐
  dates_known: true
- name_zh: 斛律金
  score: 7
  worth_why: 高欢玉璧受挫时唱敕勒歌传为千古绝唱；三朝宿将知天时善用兵，教子成名而满门终罹祸，荣辱兴衰可鉴
  era: 北魏至北齐
  dates_known: true
- name_zh: 高澄
  score: 7
  worth_why: 十余岁辅政整饬朝纲，整顿铨选典章；将成禅代之际遇兰京之变被弑，事功戛然而止，威权与侥幸之鉴
  era: 东魏
  dates_known: true
- name_zh: 慕容绍宗
  score: 7
  worth_why: 谏尔朱兆之言屡验如先知；涡阳大破侯景为东魏柱石，追击中殉身，识见超群而时命不济
  era: 北魏末至东魏
  dates_known: true
- name_zh: 高昂
  score: 7
  worth_why: 高敖曹马槊绝世为汉人军魂，鲜卑语汉儿语之语境有民史价值；河桥之役轻敌败殁，骁勇之戒
  era: 北魏末至东魏
  dates_known: true
- name_zh: 杨愔
  score: 7
  worth_why: 阖门遭难后以才学复起，典选二十年清勤称当世第一；佐命建齐而血溅乾明之变，忠勤的兴亡之鉴
  era: 东魏至北齐
  dates_known: true
- name_zh: 祖珽
  score: 7
  worth_why: 奇才与惯盗集于一身，盗书盗药劣迹斑斑而屡起屡仆，目盲犹掌机要，才智误用与自毁的鲜活标本
  era: 东魏至北齐
  dates_known: true
- name_zh: 颜之推
  score: 7
  worth_why: 阅尽侯景之乱、江陵之陷与齐亡诸劫难，后成颜氏家训之祖，乱世立身与庭训传家的范本
  era: 梁末至北齐
  dates_known: true
- name_zh: 綦毋怀文
  score: 6
  worth_why: 发明宿铁刀灌钢法，浴以五牲之溺淬以五牲之脂，中国冶金史上的发明诞生点
  era: 东魏北齐之际
  dates_known: true
- name_zh: 陈元康
  score: 6
  worth_why: 知机敏断冠绝幕府，军国密务皆决于口；兰京之变中以身蔽主而死，幕僚典范
  era: 东魏
  dates_known: true
rejections:
- name_zh: 高殷
  why_not: 在位不足一年，事仅见乾明之变，无独立做事周期
- name_zh: 高演
  why_not: 在位年余，政绩散见帝纪沿革，缺关键决策与名场面
- name_zh: 高湛
  why_not: 传多秽乱叙事，无可录成事周期
- name_zh: 尉景
  why_not: 附见神武纪，贪纵事简，无独立名场面
- name_zh: 孙腾
  why_not: 从龙附传，事多琐屑，无完整做事流
- name_zh: 和士开
  why_not: 恩幸传专叙秽乱专权，教训单薄不成做事流
- name_zh: 高俨
  why_not: 少年政变未成身死，事附见诸王传，做事流残缺
