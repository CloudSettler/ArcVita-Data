candidates:
- name_zh: 刘裕
  score: 9
  worth_why: 寒门起兵京口二十七人灭桓玄，却月阵破北魏，灭南燕后秦，气吞万里如虎；义熙土断整饬门阀，君主中有商鞅变法级突出做事，可录
  era: 东晋末至南朝宋
  dates_known: true
- name_zh: 祖冲之
  score: 10
  worth_why: 圆周率精算至小数点后七位并得密率，造大明历引入岁差，制指南车千里船水碓磨，科学家做事流完整堪称标尺
  era: 南朝宋齐
  dates_known: true
- name_zh: 韦叡
  score: 9
  worth_why: 钟离之战以儒将乘淮水暴涨决堰破魏军数十万，韦虎之名天下畏服，谦退不伐的将帅典范
  era: 南朝梁
  dates_known: true
- name_zh: 陈庆之
  score: 9
  worth_why: 率七千白袍北伐护送元颢入洛阳，取三十二城四十七战皆捷，千兵万马避白袍之名场面极致
  era: 南朝梁
  dates_known: true
- name_zh: 檀道济
  score: 9
  worth_why: 唱筹量沙解围尽显智计，功高见忌临刑叹乃复坏汝万里长城，名将功成身危的千古教训
  era: 南朝宋
  dates_known: true
- name_zh: 陶潜
  score: 9
  worth_why: 不为五斗米折腰挂印归去，归去来兮辞与桃花源记立田园诗之宗，出处抉择的人格典范
  era: 东晋末至南朝宋
  dates_known: true
- name_zh: 范缜
  score: 9
  worth_why: 著神灭论与竟陵王当廷舌战满座不能屈，拒以卖论取官，一场思辨立千年哲学命题
  era: 南朝齐梁
  dates_known: true
- name_zh: 刘勰
  score: 9
  worth_why: 孤贫依沙门成学，负书干沈约获赏识，文心雕龙五十篇成中国文论体系奠基之作，晚岁出家收束
  era: 南朝齐梁
  dates_known: true
- name_zh: 范晔
  score: 9
  worth_why: 狱中自序犹自负诸序论，修后汉书成二十四史之一，又因谋立彭城王败亡，才华与祸患交织的双面样本
  era: 南朝宋
  dates_known: true
- name_zh: 陶弘景
  score: 8
  worth_why: 挂朝服于神武门隐居茅山，朝廷大事就问山中宰相，撰本草经集注重整药物分类，儒道科学一身
  era: 南朝齐梁
  dates_known: true
- name_zh: 宗悫
  score: 8
  worth_why: 少言愿乘长风破万里浪，后平林邑以奇计破象阵，乘风破浪一词的本源人物
  era: 南朝宋
  dates_known: true
- name_zh: 刘穆之
  score: 8
  worth_why: 自寄食困顿至为刘裕谋主，总掌留府决断如流，早逝致北伐中止，萧何型幕僚之镜
  era: 东晋末
  dates_known: true
- name_zh: 王镇恶
  score: 8
  worth_why: 王猛之孙自关中归晋，为前锋破潼关入长安灭后秦，旋遭同僚猜忌之变，功成速亡的教训
  era: 东晋末
  dates_known: true
- name_zh: 江淹
  score: 8
  worth_why: 少孤贫以文章显，恨赋别赋冠绝一时，历三朝险境得全，晚年梦笔还人遂称才尽，才思与环境之警示
  era: 南朝宋齐梁
  dates_known: true
- name_zh: 羊侃
  score: 8
  worth_why: 自魏归梁久疑不用，侯景之乱受命守台城力撑危局中殁于城上，守城方略与忠诚弧光俱全
  era: 南朝梁
  dates_known: true
