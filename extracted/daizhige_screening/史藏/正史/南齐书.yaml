candidates:
- name_zh: 萧道成
  score: 9
  worth_why: 由从军讨蛮、仇池拔城、破薛索儿到受禅建齐，做事流完整；明帝赐酒持银壶当众即饮释疑为名场面；黄金与土同价之志与节俭立国皆可为训
  era: 南朝宋末至南齐
  dates_known: true
- name_zh: 萧承之
  score: 7
  worth_why: 济南以数百人偃兵开城示强退虏，全城之功；汉中攻黄金山、峨公山，断槊长数尺以大斧捶其后大破氐军犀甲；临危用智，阶段与结果清晰
  era: 东晋末至刘宋
  dates_known: true
- name_zh: 萧子良
  score: 7
  worth_why: 开西邸招文学之士成竟陵八友，开永明文学风气；广抄五经百家为四部要略；与范缜论因果牵出神灭之辩，为思想史节点
  era: 南齐
  dates_known: true
- name_zh: 王僧虔
  score: 7
  worth_why: 与高帝赌书对答善自为谋，进退有度堪为处世模范；书论神彩为上为书学经典名场面
  era: 刘宋至南齐
  dates_known: true
- name_zh: 谢朓
  score: 7
  worth_why: 永明体宗匠，余霞散成绮澄江静如练为千古名句；告发岳父敬则反谋却遭萧遥光构陷而死，依违权门之鉴
  era: 南齐
  dates_known: true
- name_zh: 垣崇祖
  score: 7
  worth_why: 守寿春以寡御众大破魏军，用险设谋之役完整；终以功高见忌被杀，功名之戒
  era: 南齐
  dates_known: true
- name_zh: 沈攸之
  score: 6
  worth_why: 举荆州之众对抗萧道成，起兵、顿兵郢城、败亡自缢周期完整，犹豫失机之戒
  era: 刘宋末
  dates_known: true
- name_zh: 张敬儿
  score: 6
  worth_why: 袭取江陵破沈攸之为建齐功臣，位极人臣终被诱杀，功臣难善终之例
  era: 刘宋末至南齐
  dates_known: true
- name_zh: 褚渊
  score: 6
  worth_why: 与袁粲同受顾命而一佐受禅一死节，易代抉择对照成训
  era: 刘宋至南齐
  dates_known: true
- name_zh: 王俭
  score: 6
  worth_why: 佐定新朝礼乐制度，一代儒宗；少年居相位自比谢安，制度缔造做事流可考
  era: 南齐
  dates_known: true
- name_zh: 王融
  score: 6
  worth_why: 才高气盛，武帝病笃谋立竟陵王失败被赐死，年仅二十余，躁进之鉴
  era: 南齐
  dates_known: true
- name_zh: 周盘龙
  score: 6
  worth_why: 老将与子奉叔并骑陷阵大破魏军，父子并命传为佳话，战场名场面典型
  era: 南齐
  dates_known: true
- name_zh: 萧宝卷
  score: 6
  worth_why: 凿金莲贴地令潘妃行成步步生莲花名场面；猜杀大臣、大兴土木致众叛身死，昏暴亡国教训典型
  era: 南齐
  dates_known: true
rejections:
