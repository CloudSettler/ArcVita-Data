  dates_known: true
- name_zh: 范蠡
  score: 10
  worth_why: 助句践二十余年灭吴雪耻；功成身退泛舟五湖；三致千金为陶朱公；忠以为国智以保身
  era: 春秋末
  dates_known: true
- name_zh: 姜尚
  score: 9
  worth_why: 渭滨垂钓遇文王；佐武王牧野灭商；封齐因俗简礼通鱼盐之利；兵家权谋之祖
  era: 商末周初
  dates_known: true
- name_zh: 伍子胥
  score: 9
  worth_why: 亡楚奔吴历险过关；辅阖闾西破强楚入郢；忠谏夫差拒越被赐死悬目东门；日暮途倒行逆施
  era: 春秋末
  dates_known: true
- name_zh: 陈胜
  score: 9
  worth_why: 大泽乡揭竿而起；王侯将相宁有种乎；首建张楚点燃亡秦之火；佣耕之志至称王半岁而终
  era: 秦末
  dates_known: true
- name_zh: 苏秦
  score: 9
  worth_why: 锥刺股发愤读书；游说六国合纵抗秦；身佩六国相印；反间入齐车裂而死
  era: 战国
  dates_known: true
- name_zh: 扁鹊
  score: 9
  worth_why: 望色知病起虢太子于将殁；见蔡桓公讳疾忌医六望而遁；随俗为变各科皆精；技高见妒被刺
  era: 战国
  dates_known: true
- name_zh: 魏无忌
  score: 9
  worth_why: 信陵君窃符救赵；却秦军存邯郸；晚年率五国联军破秦追至函谷；礼贤下士客三千
  era: 战国
  dates_known: true
- name_zh: 田单
  score: 9
  worth_why: 即墨火牛阵大破燕军；收复七十余城一举复齐；先反间去乐毅；安平撤退教宗人锯轴脱险
  era: 战国
  dates_known: true
- name_zh: 张仪
  score: 8
  worth_why: 连横破纵拆散六国联盟；以六百里欺楚使怀王客死；舌在足矣之志；以横破纵定秦势
  era: 战国
  dates_known: true
- name_zh: 范睢
  score: 8
  worth_why: 远交近攻定秦东进之策；助昭王废太后逐穰侯以固王权；张禄改名脱死于厕；睚眦必报终有愧悔
  era: 战国
  dates_known: true
- name_zh: 吕不韦
  score: 8
  worth_why: 奇货可居押中子楚；捐家货立君成一段纵横；相秦十三年；集宾客著吕氏春秋一字千金；终饮鸩而亡可为戒
  era: 战国末
  dates_known: true
- name_zh: 曹参
  score: 8
  worth_why: 攻城略地功居第二；代萧何为相萧规曹随；日夜饮酒不扰而天下晏然；清静无为成治世范本
  era: 秦末汉初
  dates_known: true
- name_zh: 蒙恬
  score: 8
  worth_why: 将三十万众北逐戎狄；筑长城万里因地形用险制塞；堑山堙谷修直道；忠而见杀叹绝地脉之罪
  era: 秦
  dates_known: true
- name_zh: 西门豹
  score: 8
  worth_why: 治邺破河伯娶妇之局投巫于河；三老豪长与祝巫合谋尽除；凿十二渠引漳灌田；名闻天下泽流后世
  era: 战国
  dates_known: true
