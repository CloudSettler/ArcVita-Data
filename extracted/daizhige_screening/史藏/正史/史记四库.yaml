verdict: has_candidates
candidates:
- name_zh: 范雎
  score: 9
  worth_why: 折胁佯死化名张禄入秦，献远交近攻并助昭襄王废太后逐穰侯以固王权；一饭之德必偿、睚眦之怨必报，绨袍赠须贾成千古名场面，终因所举郑安平王稽败法而听蔡泽劝退全身，做事周期完整
  era: 战国末期
  dates_known: true
- name_zh: 张骞
  score: 9
  worth_why: 凿空西域，两度为匈奴所扣持汉节不失，约大月氏联乌孙通大宛，封博望侯；本卷御制读大宛传的地理考辨正系其凿空余绪
  era: 西汉武帝时
  dates_known: true
- name_zh: 毛遂
  score: 8
  worth_why: 锥处囊中脱颖而出，按剑劫楚王定合从救赵，三寸之舌强于百万之师；御制读平原君传所谓颖脱定从即咏其事
  era: 战国末期
  dates_known: true
- name_zh: 赵胜
  score: 8
  worth_why: 平原君斩美人谢躄者、散家财赴国难、擢毛遂合从却秦解邯郸之围；亦有受上党致长平之祸的利令智昏之失，功过俱全可鉴
  era: 战国末期
  dates_known: true
- name_zh: 晏婴
  score: 8
  worth_why: 相齐历灵庄景三世，节俭力行犯颜直谏；御者妻讽夫自抑的驭内名段即出其传，临难伏尸哭庄公一节尤见大义
  era: 春秋
  dates_known: true
- name_zh: 窦婴
  score: 8
  worth_why: 七国之乱拜大将军守荥阳立功，后失势卷入灌夫骂座案，东朝廷辩败于田蚡，矫先帝诏弃市——外戚功臣起落完整的教训样本
  era: 西汉景武之际
  dates_known: true
- name_zh: 季布
  score: 7
  worth_why: 得黄金百斤不如得季布一诺；为楚将数窘高祖，败后髡钳为奴于朱家忍辱求生，谏吕后罢伐匈奴并折樊哙之妄，忍与信兼备
  era: 秦末汉初
  dates_known: true
- name_zh: 樊哙
  score: 7
  worth_why: 屠狗出身鸿门闯帐啖生彘肩护主，谏高祖出秦宫还军；诗中所咏愿以十万众横行匈奴遭季布折冲，粗豪中有识度
  era: 秦末汉初
  dates_known: true
- name_zh: 蔡泽
  score: 7
  worth_why: 以商君白起吴起文种功成不退之祸游说范雎，一言而代秦相，数月即归印保身——急流勇退的教科书案例
  era: 战国末期
  dates_known: true
- name_zh: 魏冉
  score: 7
  worth_why: 穰侯立昭襄王定内乱、累任秦相举白起、蚕食诸侯奠定东进格局，权倾一朝终为范雎所逐忧死于关外——外戚权臣兴亡之鉴
  era: 战国末期
  dates_known: true
- name_zh: 灌夫
  score: 7
  worth_why: 吴楚之乱独驰入吴军为父报仇以勇显，失势后使酒骂座，祸延窦婴并致族灭——使酒不好人、交游失势的警示样本
  era: 西汉景武之际
  dates_known: true
- name_zh: 邹阳
  score: 7
  worth_why: 狱中上梁孝王书，白头如新倾盖如故，一篇之辞既自解于牢狱又全梁王于谗口，文辩救身的经典
  era: 西汉文景之际
  dates_known: true
- name_zh: 伯夷
  score: 6
  worth_why: 义不食周粟采薇饿死首阳，气节之千古原点；御制读伯夷列传所辨正在其大节在不仕周不在饿死，可补一条守节范型，惟做事流简
  era: 商周之际
  dates_known: false
- name_zh: 触龙
  score: 6
  worth_why: 老臣不言强谏而叙人情，父母之爱子则为之计深远，说赵太后遣长安君质齐而救赵——单一说辞但场面极强
  era: 战国
  dates_known: false
