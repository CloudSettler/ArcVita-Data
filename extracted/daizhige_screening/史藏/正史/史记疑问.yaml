source: 史藏/正史/史记疑问.md
category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 舜
  score: 7
  worth_why: 侧微举用、历试诸难以至受终文祖、流四凶、荐禹于天，成事儿周期完整；克谐以孝为百行之模范，禅让为传贤制度之诞生点；本文且存年世、崩地诸辨可资考订
  era: 上古虞舜（传说时代，依尚书可系三十征庸五十载陟方）
  dates_known: true
- name_zh: 尧
  score: 6
  worth_why: 廷于四岳举舜、以二女九男历试内外、终禅天下，开家天下之前传贤之局；本文兼存元恺不举四凶不去之诘难，足为用人得失之镜
  era: 上古唐尧（传说时代）
  dates_known: true
- name_zh: 邵泰衢
  score: 6
  worth_why: 著史记疑问三卷，旁引异同一一断之以理，如驳沙中偶语之不可信、李陵杀敌万余之夸诞、吕泽卒年之抵牾，缘起—考辨—成书做事流完整，为疑古考据方法论之示范
  era: 清乾隆
  dates_known: true
rejections:
- name_zh: 黄帝
  why_not: 本文自斥阪泉三战事属无征、鼎湖骑龙尤诞，年代渺茫不可考，且君主多作时间坐标，低优先
- name_zh: 伏羲
  why_not: 履大人迹感生之说本文断为诬圣，画八卦无年代与做事流可考
- name_zh: 女娲
  why_not: 炼石补天断鳌立极本文断为喻言诞鄙，无做事周期与可考年代
- name_zh: 神农
  why_not: 仅教耕为市数语，感龙而生之说涉诞，传说无征
- name_zh: 刘累
  why_not: 传文仅学扰龙于豢龙氏数语，事涉怪诞，本文且据竹书驳其文义，无做事周期
- name_zh: 伊尹
  why_not: 本文仅存负鼎干汤一语，孟子已辨割烹之诬，无完整做事流，宜俟殷本纪全文另录
- name_zh: 桀
  why_not: 仅败于有娀之墟奔于鸣条一句，为汤传之坐标，非独立事迹
- name_zh: 吕泽
  why_not: 仅功臣表卒年与留侯世家抵牾之考订，非人物事迹
- name_zh: 李陵
  why_not: 仅提要引杀敌万余之言以证夸诞，无本文事迹可录
