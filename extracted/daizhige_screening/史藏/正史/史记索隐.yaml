verdict: has_candidates
candidates:
- name_zh: 班固
  score: 9
  worth_why: 断代史之祖，续父业二十余年兰台撰成汉书；随窦宪北征作燕然山铭；本篇集解序开篇即引其司马迁传评语立论，做事流完整
  era: 东汉
  dates_known: true
- name_zh: 左丘明
  score: 9
  worth_why: 集解序首引仲尼作春秋经而丘明作传，左传国语双璧传世，解经叙事皆开典范
  era: 春秋末期
  dates_known: true
- name_zh: 司马贞
  score: 8
  worth_why: 本书作者，病褚少孙补书踳驳、前人音义散佚，乃撰索隐三十卷、述赞百三十篇、补三皇本纪，且拟改迁书纪传编次，学术做事流完整
  era: 唐（开元中）
  dates_known: true
- name_zh: 裴骃
  score: 8
  worth_why: 撰史记集解为三家注之首，序文全篇自述采徐广音义、删游辞取要实之取舍功夫，缘起取舍俱在
  era: 南朝宋
  dates_known: true
- name_zh: 刘向
  score: 8
  worth_why: 领校中秘书撰别录为目录学之祖，编定战国策说苑列女传；本篇多处引其叙录考订
  era: 西汉
  dates_known: true
- name_zh: 陆贾
  score: 8
  worth_why: 著楚汉春秋纪汉初起事；献新语十二篇折服高帝马上得天下不能马上治之；单车使南越折服赵佗
  era: 汉初
  dates_known: true
- name_zh: 子产
  score: 8
  worth_why: 铸刑书开成文法先河，不毁乡校存舆论；裴序引其辨晋侯疾非实沈台骀之祟、晋侯称博物君子
  era: 春秋
  dates_known: true
- name_zh: 韩非
  score: 8
  worth_why: 法术势集大成，说难孤愤为法家绝唱，死于秦狱可作教训；索隐拟附韩非于商鞅
  era: 战国末期
  dates_known: true
- name_zh: 庄周
  score: 8
  worth_why: 漆园傲吏，逍遥齐物开南华一脉；索隐拟附庄周于老子
  era: 战国
  dates_known: true
- name_zh: 贾谊
  score: 8
  worth_why: 少年博士，过秦论治安策为政论典范，谪长沙吊屈原可作教训；索隐拟传目与枚乘连名
  era: 西汉
  dates_known: true
- name_zh: 鲁仲连
  score: 7
  worth_why: 义不帝秦，射书聊城，功成不受赏；索隐拟附其传于田单
  era: 战国末期
  dates_known: true
- name_zh: 田单
  score: 7
  worth_why: 即墨火牛阵破燕军，一举复齐七十余城，乱世翻盘名场面
  era: 战国
  dates_known: true
- name_zh: 司马相如
  score: 7
  worth_why: 子虚上林立汉赋典范，持节通西南夷有使功；索隐议其传不宜在西南夷后
  era: 西汉
  dates_known: true
- name_zh: 汲黯
  score: 7
  worth_why: 武帝朝直谏社稷之臣，矫诏发仓、淮阳卧治；索隐议汲郑传不当居次
  era: 西汉
  dates_known: true
- name_zh: 皇甫谧
  score: 7
  worth_why: 帝王世纪考上古纪年，针灸甲乙经为针经之祖；本书注屡引其说证黄帝年世
  era: 西晋
  dates_known: true
rejections:
