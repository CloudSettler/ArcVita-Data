category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 班固
  score: 9
  worth_why: 继父班彪之业私撰汉书，历二十余年；因窦宪案牵连下狱死，和帝诏其妹与马续续成——代表作汉书与史家成败教训俱全；本篇序首即引班固之评立论；公元32年生、92年卒，年月确凿
  era: 东汉
  dates_known: true
- name_zh: 裴骃
  score: 8
  worth_why: 一生系于一书——恨徐广音义粗略，乃采九经诸史并汉书音义及先儒旧说，增演徐氏撰史记集解一百三十卷，为三家注之首；搜集编次、以徐为本、未详则阙的做事流在本书序与提要中首尾可考，注家典范；惜仅时代可考
  era: 南朝宋
  dates_known: false
- name_zh: 裴松之
  score: 8
  worth_why: 裴骃之父，补注三国志，立补阙、备异、惩妄、论辨四体，引书二百余种，为古典注疏之高峰；本篇提要即以宋书裴松之传附载裴骃事迹；372年生451年卒可考
  era: 南朝宋
  dates_known: true
- name_zh: 徐广
  score: 7
  worth_why: 研核众本撰史记音义四十六卷，具列异同兼述训解，为集解之蓝本，本书注文通篇以徐广曰征引，校雠之学做事流完整；352年生425年卒可考
  era: 东晋
  dates_known: true
- name_zh: 皇甫谧
  score: 7
  worth_why: 本书五帝纪屡引其说为年代权威；本人事迹更著——二十岁幡然向学，七次辞征不仕，得风痹犹手不辍书，撰针灸甲乙经开针灸一派，士人守节之范；215年生282年卒可考
  era: 魏晋
  dates_known: true
- name_zh: 刘向
  score: 7
  worth_why: 奉诏校雠群书撰别录，目录校雠学开山，又编新序说苑列女传传世；本篇序引刘向之评以定司马迁良史之才；约前77年生、前6年卒可考
  era: 西汉
  dates_known: true
- name_zh: 扬雄
  score: 7
  worth_why: 拟易作太玄、仿论语作法言，汉赋四大家之一，清贫自守终身著述，为文人著述立身之范；本篇序引扬雄评司马迁之语；前53年生、18年卒可考
  era: 西汉
  dates_known: true
- name_zh: 张守节
  score: 6
  worth_why: 唐开元间撰史记正义，为三家注之一；提要载其尝备述集解所引书目，足证裴骃援据之浩博；惟生平简略，生卒难详
  era: 唐
  dates_known: false
- name_zh: 司马贞
  score: 6
  worth_why: 唐人撰史记索隐，与集解正义并称三家注，于名物训诂多独到之见；本篇提要提及其书；做事流较简，生卒无考
  era: 唐
  dates_known: false
rejections:
- name_zh: 黄帝
  why_not: 破炎帝于阪泉、禽杀蚩尤于涿鹿之野，叙事有名场面潜力，然属神话传说，生卒年代不可考（皇甫谧所记在位百年寿百十一亦不足据），又系君主，只能作时间坐标
- name_zh: 帝尧
  why_not: 命羲和敬授民时、禅让于舜固为佳材，然亦神话君主，年代不可考，事迹难以系年，不外坐标之用
- name_zh: 颛顼
  why_not: 仅绝地天通式之总叙与四至疆域，语焉不详，神话君主无做事流
- name_zh: 帝喾
  why_not: 传文多为德性赞语，仅谱系一环，无独立事迹可系年
- name_zh: 蚩尤
  why_not: 败方陪衬，仅作乱被禽杀数句，神话人物无做事流
- name_zh: 神农氏
  why_not: 仅神农氏世衰弗能征一语，本人无做事流
- name_zh: 嫘祖
  why_not: 仅记为黄帝正妃生二子，不足数十字
- name_zh: 昌意
  why_not: 仅为黄帝与颛顼间之谱系环节
- name_zh: 帝挚
  why_not: 仅挚立不善崩数句，传位过渡坐标
- name_zh: 纪昀
  why_not: 四库馆总裁官，提要所载为集体校刊考订过程；陆锡熊、孙士毅、陆费墀同此，均无个人做事流
