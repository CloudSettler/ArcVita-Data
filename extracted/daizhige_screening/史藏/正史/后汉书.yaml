candidates:
- name_zh: 马援
  score: 9
  worth_why: 马革裹尸、穷当益壮老当益壮皆出其口；聚米为山为沙盘推演之祖；平陇破羌、南征交趾立铜柱，功高遭谗死后蒙冤，成与教训俱全
  era: 东汉初
  dates_known: true
- name_zh: 荀彧
  score: 9
  worth_why: 王佐之才，迎奉天子、坐镇许都、官渡定策，居中持重二十年为曹操霸业之枢；终因忠汉之志与霸业冲突郁愤而卒，做事流完整且矛盾深刻
  era: 东汉末
  dates_known: true
- name_zh: 班固
  score: 8
  worth_why: 私修国史系狱，受诏续成汉书开断代史体；随窦宪北征撰燕然山铭，文功武事兼具；晚系狱死，史家之镜
  era: 东汉前期
  dates_known: true
- name_zh: 耿弇
  score: 8
  worth_why: 年二十余自请定齐，五战破张步平四十六郡；光武亲赞有志者事竟成，成语出典正在其身
  era: 东汉初
  dates_known: true
- name_zh: 冯异
  score: 8
  worth_why: 每论功独屏大树之下，大树将军让功不伐；崤底大破赤眉定关中，功高而早卒，为将德范
  era: 东汉初
  dates_known: true
- name_zh: 杨震
  score: 8
  worth_why: 暮夜却金称天知神知我知子知，四知为廉政第一典；关西孔子五十始仕，屡谏权戚逼令饮鸩，后得平反，清官范本兼教训
  era: 东汉中期
  dates_known: true
- name_zh: 陈蕃
  score: 8
  worth_why: 大丈夫处世当扫除天下之典出其口；豫章太守下榻徐孺子；党人领袖谋诛宦官事败死节，气节名场面足
  era: 东汉后期
  dates_known: true
- name_zh: 窦宪
  score: 8
  worth_why: 稽落山金微山大破北匈奴，燕然勒石与封狼居胥并称；恃功骄横终被赐死，功罪一身，权臣之戒
  era: 东汉前期
  dates_known: true
- name_zh: 华佗
  score: 8
  worth_why: 麻沸散行外科手术为麻醉外科之祖，创五禽戏导引养生；拒曹操征召见杀，青囊书失传，医学名场面与遗憾并存
  era: 东汉末
  dates_known: true
- name_zh: 王充
  score: 7
  worth_why: 家贫游书肆博览遂通百家，著论衡八十五篇疾虚妄，直斥谶纬迷信俗儒虚说，独立批判精神之典范
  era: 东汉中期
  dates_known: true
- name_zh: 蔡琰
  score: 7
  worth_why: 文姬归汉，没于南匈奴十二年赎归忆写古籍四百余篇，胡笳十八拍传世，才女乱世命运与文献抢救之名场面
  era: 东汉末
  dates_known: true
- name_zh: 郑玄
  score: 7
  worth_why: 党锢杜门遍注群经百万余言混一今古文，郑学一统经坛；客耕高密聚徒数千，黄巾过境相约不敢犯
  era: 东汉后期
  dates_known: true
- name_zh: 皇甫嵩
  score: 7
  worth_why: 长社火计破波才，广宗斩张梁下曲阳灭张宝，一年而定黄巾之乱；功盖一时位极人臣而谨节
  era: 东汉末
  dates_known: true
- name_zh: 王景
  score: 7
  worth_why: 明帝亲召问理水，与王吴筑堤千里十里立水门，导河入汴复故道，治河成事为古代水利之极，功成而民不劳扰
  era: 东汉前期
  dates_known: true
- name_zh: 董宣
  score: 7
  worth_why: 强项令格杀公主苍头，宁两手据地终不向公主顿首；死后仅大麦数斛布被覆尸，执法之骨千古典范
  era: 东汉初
  dates_known: true
