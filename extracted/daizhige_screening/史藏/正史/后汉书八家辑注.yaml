  era: 东汉初
  dates_known: true
- name_zh: 宋弘
  score: 8
  worth_why: 糟糠之妻不下堂直谏光武，以一语拒尚公主之荣，关键决策可为德行楷模
  era: 东汉初
  dates_known: true
- name_zh: 虞诩
  score: 8
