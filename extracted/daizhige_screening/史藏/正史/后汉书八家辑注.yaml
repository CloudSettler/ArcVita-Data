- name_zh: 马援
  score: 9
  worth_why: 马革裹尸、老当益壮、聚米为山皆出其传；弃新莽投光武、平陇征越、出师未捷身死，做事流完整且忠勇可鉴
  era: 东汉初
  dates_known: true
- name_zh: 郑玄
  score: 9
  worth_why: 遍注群经开郑学一派；遭党锢闭门著书百万言，黄巾过其乡而不犯，学者做事周期与气节俱足
  era: 东汉末
  dates_known: true
- name_zh: 杨震
  score: 9
  worth_why: 暮夜却金成四知典故之源；五十始仕官至太尉、直谏被鸩而死，清官与直臣之教训典型
  era: 东汉中期
  dates_known: true
- name_zh: 班固
  score: 8
  worth_why: 私修国史系狱又受诏续成汉书，二十余年成断代史开创之作，其荣辱成败皆系于文章
  era: 东汉初至中期
  dates_known: true
- name_zh: 耿弇
  score: 8
  worth_why: 有志者事竟成语出光武赞其平齐之役；弱冠定四十六郡，决策奔袭临淄堪为名将范本
  era: 东汉初
  dates_known: true
- name_zh: 杜诗
  score: 8
