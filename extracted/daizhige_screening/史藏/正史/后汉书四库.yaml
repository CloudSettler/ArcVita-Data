candidates:
- name_zh: 马援
  score: 9
  worth_why: 马革裹尸、老当益壮、聚米为山皆出其事；定陇西平交趾做事流完整；壶头受困、身后遭谗，成败两面皆可垂范
  era: 东汉初
  dates_known: true
- name_zh: 郑玄
  score: 9
  worth_why: 遍注群经，集两汉经学之大成；党锢禁锢中著书不辍；黄巾过郑公之乡皆拜；戒子书传世，学问与操守俱足一轨
  era: 东汉中后期
  dates_known: true
- name_zh: 杨震
  score: 9
  worth_why: 天知地知四知拒金为成语出处；清白吏子孙家训传世；屡谏遭谗饮鸩而死，清廉典范兼忠谏之训
  era: 东汉中
  dates_known: true
- name_zh: 荀彧
  score: 9
  worth_why: 曹操首席谋主，定奉天子、固根本诸大计；功成后阻九锡而空盒饮鸩，进退之际教训深刻；本册乾隆御制文专评其是非，正可入传
  era: 东汉末
  dates_known: true
- name_zh: 董卓
  score: 9
  worth_why: 边将因缘入京、废立专权、焚洛阳筑郿坞，终身死族灭；权奸兴亡的完整反面教本
  era: 东汉末
  dates_known: true
- name_zh: 班昭
  score: 8
  worth_why: 兄没后续成汉书，中国第一位留名的女史家；上疏乞兄班超归国；女诫传世
  era: 东汉中
  dates_known: true
- name_zh: 陈蕃
  score: 8
  worth_why: 少年一屋不扫而志在扫除天下；位居三公抗宦官；谋诛宦党事败而死，气节典范
  era: 东汉中后期
  dates_known: true
- name_zh: 陈寔
  score: 8
  worth_why: 梁上君子成语出处，训盗化人；党锢之祸自请囚系，宽厚处世之范
  era: 东汉中后期
  dates_known: true
- name_zh: 范滂
  score: 8
  worth_why: 登车揽辔澄清天下之志；党锢之祸慨然赴死，与母诀别一节动千古
  era: 东汉末
  dates_known: true
- name_zh: 华佗
  score: 8
  worth_why: 麻沸散开外科先河，五禽戏开导引之先；恃能遭杀、狱中焚书之憾，医道得失兼备
  era: 东汉末
  dates_known: true
- name_zh: 许慎
  score: 8
  worth_why: 五经无双许叔重；闭门著述三十年成说文解字，创五百四十部首体系，文字学奠基之作
  era: 东汉中
  dates_known: true
- name_zh: 窦宪
  score: 8
  worth_why: 燕然勒石灭北匈奴，功比卫霍；恃功骄横终被赐死，功过兴亡集于一身
  era: 东汉初
  dates_known: true
- name_zh: 明德马皇后
  score: 8
  worth_why: 却封外戚、身衣大练的贤后典范；车如流水马如游龙即成语车水马龙出处；本册乾隆御制文专评其辞封之辨
  era: 东汉初
  dates_known: true
- name_zh: 袁绍
  score: 8
  worth_why: 四世三公起兵讨董、兼并四州；官渡一败涂地，多谋少决、废长立幼之覆辙教训完整
  era: 东汉末
  dates_known: true
- name_zh: 严光
  score: 7
  worth_why: 足加帝腹、客星犯座之传世名场面；拒官归隐富春江垂钓，淡泊气节的隐逸典范；本册乾隆御制文考辨其事
  era: 东汉初
  dates_known: true
