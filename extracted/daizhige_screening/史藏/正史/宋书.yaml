candidates:
- name_zh: 刘裕
  score: 10
  worth_why: 寒微起家破孙恩、京口举义灭桓玄、平卢循、北伐灭南燕后秦、却月阵破魏军，金戈铁马气吞万里如虎，代晋建宋，做事流完整且名场面极多
  era: 东晋末至刘宋初
  dates_known: true
- name_zh: 陶潜
  score: 10
  worth_why: 隐逸传代表人物，不为五斗米折腰、赋归去来、书桃花源，仕隐抉择链完整，田园诗与隐逸人格的范式源头
  era: 东晋末
  dates_known: true
- name_zh: 檀道济
  score: 9
  worth_why: 唱筹量沙退敌的兵法名场面；元嘉北伐独全其军；功高见忌临刑呼坏汝万里长城，名将兔死狗烹的完整悲剧
  era: 刘宋元嘉年间
  dates_known: true
- name_zh: 王镇恶
  score: 9
  worth_why: 名相王猛之孙，佐刘裕北伐后秦为先锋，破潼关入长安；功成而死于关中内讧，将门百年复兴与猝然陨落对照强烈
  era: 东晋末
  dates_known: true
- name_zh: 谢灵运
  score: 9
  worth_why: 山水诗开山祖师，池塘生春草为名场面；袭封康乐公而仕途蹇跌，恃才傲物终至广州弃市，才与命的完整教训
  era: 东晋末至刘宋初
  dates_known: true
- name_zh: 刘穆之
  score: 8
  worth_why: 刘裕之萧何，一夕百函总揽后方，鞠躬尽瘁；其死致刘裕仓促南归弃守长安，间接改变北伐结局
  era: 东晋末
  dates_known: true
- name_zh: 范晔
  score: 8
  worth_why: 后汉书作者，史才冠时；郁郁不得志而卷入彭城王谋逆弃市，史家与逆臣一身两面的双重教训
  era: 刘宋元嘉年间
  dates_known: true
- name_zh: 裴松之
  score: 8
  worth_why: 受诏注三国志，采百余家书补阙存异，开创史注范式，裴注与陈寿本传并行不朽
  era: 刘宋初
  dates_known: true
- name_zh: 宗悫
  score: 8
  worth_why: 少年愿乘长风破万里浪，成语诞生点；平林邑、参与元嘉北伐，一生践行少时之志
  era: 刘宋元嘉年间
  dates_known: true
- name_zh: 沈庆之
  score: 8
  worth_why: 不识书而善谋的老将，平雍州蛮、定内乱、拥立孝武；八十岁抗谏前废帝被赐死，晚节与强谏俱可记
  era: 刘宋中前期
  dates_known: true
- name_zh: 颜延之
  score: 7
  worth_why: 与谢灵运并称颜谢，错彩镂金一路；傲诞忤权屡遭贬斥而寿终，文人处世之鉴
  era: 东晋末至刘宋
  dates_known: true
- name_zh: 刘义庆
  score: 7
  worth_why: 宗室招聚文学之士撰世说新语，志人小说开山；避祸全身而以文传世的另一种做事流
  era: 刘宋元嘉年间
  dates_known: true
- name_zh: 刘义隆
  score: 7
  worth_why: 元嘉之治轻徭薄赋三十年；好大喜功三度北伐惨败并自毁长城杀檀道济，终被太子所弑，英主堕败的完整教训
  era: 刘宋元嘉年间
  dates_known: true
- name_zh: 袁粲
  score: 7
  worth_why: 宋末孤忠，起兵抗萧道成败死石头城，危世殉国的忠诚典型，可为气节范式
  era: 刘宋末
  dates_known: true
- name_zh: 谢晦
  score: 7
  worth_why: 名士佐命却行废立，拥兵荆州举兵抗命，兵败临刑谈笑赴死，废立之祸的完整警示样本
  era: 刘宋初
  dates_known: true
rejections:
