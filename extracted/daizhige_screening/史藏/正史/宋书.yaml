- name_zh: 刘毅
  why_not: 京口首义元勋而争权败亡，事迹多附于刘裕纪传，独立做事流不足
- name_zh: 戴法兴
  why_not: 恩幸传弄权人物，无独立可考之事业周期
- name_zh: 王玄谟
