source: 史藏/正史/宋史/卷008.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 赵恒（宋真宗）
  score: 8
  worth_why: 本卷为其编年本纪，可考东封西祀、祀汾阴谒太清宫、引入占城稻、除丁钱、减刑恤狱等决策；天书封禅亦成后世警醒的反面教材，做事周期与教训兼备
  era: 北宋
  dates_known: true
- name_zh: 曹玮
  score: 7
  worth_why: 泾原钤辖任内于笼竿川熟户蕃部置兵屯田、讨拨藏族乱事，边功可考，其事迹正史他卷更详，做事流较完整
  era: 北宋
  dates_known: true
- name_zh: 张齐贤
  score: 6
  worth_why: 由右仆射判河阳至左仆射、司空致仕，历仕始末见于本卷，然独立做事细节需参他传
  era: 北宋
  dates_known: true
- name_zh: 丁谓
  score: 6
  worth_why: 任奉祀经度制置使主持谒太清宫、铸圣像、献祥瑞，为宋祥瑞政事的操盘者；兴修玉清昭应宫等工程可成事件，但污名教训需他卷佐证
  era: 北宋
  dates_known: true
- name_zh: 王旦
  score: 6
  worth_why: 历官特进、右仆射、玉清昭应宫使至病卒前预闻东封，天书时代重臣；对真沆朝廷运作有见证意义，独立事迹略散
  era: 北宋
  dates_known: true
- name_zh: 刘娥
  score: 7
  worth_why: 由修仪、德妃至册立为后，日后垂帘听政权柄始于此卷；前期线索简而从时间可考，完整做事流见本纪后续诸卷
  era: 北宋
  dates_known: true
rejections:
- name_zh: 吕蒙正
  why_not: 本卷仅见赐第、进封与薨卒，无做事周期叙述
- name_zh: 林逋 / 魏野 / 种放 / 李渎等隐士
  why_not: 本卷仅为征召辞病的逸事点缀，无可录做事流
- name_zh: 陈尧叟 / 向敏中 / 王钦若 / 冯拯等
  why_not: 本卷仅记迁转官阶，独立事迹需他传
- name_zh: 李公蕴（交趾郡王）
  why_not: 本卷仅贡使与加官，为外藩时间坐标
