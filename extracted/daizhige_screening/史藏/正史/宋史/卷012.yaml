    start_date: 1053-01
    highlight_event_id: guji-宋仁宗-event-pingpan
  - key: closure
    name_zh: 抚定广南
    labels:
      zh: 赦广南、追捕智高
    start_date: 1053-02
  decisions:
  - date: 1052-09
    title: 以狄青为宣徽南院使宣抚荆湖广南
    rationale: 诸将屡败，改倚宿将专任兵柄
  - date: 1053-02
    title: 赦广南、给战没者槥椟还家
    rationale: 安抚新定之地，收人心而息叛源
- id: guji-宋仁宗-endeavor-2
  name_zh: 修明堂大飨与恤民之政
  phases:
  - key: brewing
    name_zh: 以岁饥罢观灯
    labels:
      zh: 省费恤民
    start_date: 1050-01
  - key: breakthrough
    name_zh: 作明堂制乐
    labels:
      zh: 自制黄钟五音五曲
    start_date: 1050-06
  - key: climax
    name_zh: 明堂大飨天地
    labels:
      zh: 大飨配以太祖太宗真宗
    start_date: 1050-09
    highlight_event_id: guji-宋仁宗-event-mingtang
  - key: closure
    name_zh: 罢贡蠲负建言纳谏
    labels:
      zh: 罢灾伤贡物放逋负
    start_date: 1051-12
  decisions:
  - date: 1050-09
    title: 诏内降指挥百司执奏毋辄行
    rationale: 杜绝宫中内批干政，重台谏纠察之权
  - date: 1051-12
    title: 罢灾伤州军贡物
    rationale: 民饥国困，先恤下而后奉上
