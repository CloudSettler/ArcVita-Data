source: 史藏/正史/宋史/卷012.md
category: 史藏/正史/宋史
person:
  qid: guji-宋仁宗
  name_zh: 宋仁宗
  names:
    zh: 宋仁宗 / 赵祯
    en: Emperor Renzong of Song
  lifespan:
    birth:
      date: 1010
      precision: year
      is_circa: false
      raw: 大中祥符三年生
    death:
      date: 1063-03
      precision: month
      raw: 嘉祐八年三月崩
  birth_date: 1010
  death_date: 1063
  era: 北宋
  reign_ref: 乾兴元年至嘉祐八年在位，本卷纪皇祐二年至至和二年
  archetype: 守成仁君
  dilemmas:
  - 西南蛮侬智高叛乱扩大，用兵广南与财政赈灾并行的的两难
  - 灾伤频年，罢贡物、蠲租赋与军储开支的财政权衡
  lesson: 以宽仁节用、纳谏恤民立治，虽武功不显而文治可范后世
  summary_first_person: 我在位日食地震水旱屡告，屡下德音避殿减膳、蠲负赈饥；广南侬智高作乱时，先后遣余靖、孙沔、狄青经制兵事，终以邕州大捷定乱；又修明堂之礼、定大乐、罢灾伤州军贡物，务以宽仁治国。
endeavors:
- id: guji-宋仁宗-endeavor-1
  name_zh: 平侬智高之乱
  phases:
  - key: brewing
    name_zh: 叛乱爆发
    labels:
      zh: 广源州蛮反
