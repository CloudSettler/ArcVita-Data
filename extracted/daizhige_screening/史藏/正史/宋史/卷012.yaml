  name_zh: 生于大中祥符三年
- id: guji-宋仁宗-event-mingtang
  person_qid: guji-宋仁宗
  date: 1050-09-24
  year_of: 1050
  type: endeavor
  name_zh: 皇祐二年辛亥大飨天地于明堂，大赦天下
  detail: 以太祖、太宗、真宗配，诏内降指挥百司执奏毋辄行，礼成而群臣毋上尊号
- id: guji-宋仁宗-event-dixing
  person_qid: guji-宋仁宗
  date: 1052-09
  year_of: 1052
  type: endeavor
  name_zh: 以狄青为枢密副使，旋委宣抚荆湖广南
  detail: 侬智高陷邕州八州围广州，累易主帅而以狄青专任
- id: guji-宋仁宗-event-pingpan
  person_qid: guji-宋仁宗
  date: 1053-01
  year_of: 1053
  type: endeavor
  name_zh: 狄青败侬智高于邕州斩首五千余级
  detail: 智高遁去，遂赦广南、蠲租免徭，事后擢狄青为枢密使
- id: guji-宋仁宗-event-death
  person_qid: guji-宋仁宗
  date: 1063
  year_of: 1063
  type: death
  name_zh: 崩于嘉祐八年，庙号仁宗
