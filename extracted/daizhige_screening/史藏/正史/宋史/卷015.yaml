candidates:
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法主导者，青苗、免役、保甲、市易诸法次第推行，与反对派激烈博弈，改革做事流完整，成与败皆可为后世镜鉴
  era: 北宋熙宁年间
  dates_known: true
- name_zh: 王韶
  score: 8
  worth_why: 开熙河、收复武胜军、破木征、置熙河路，开边做事周期完整且关键节点可考，生平事见宋史本传
  era: 北宋熙宁年间
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 新旧党争反对派领袖，九辞枢密副使、封还诏书、罢知永兴军退居洛阳，后成资治通鉴，与新法对抗做事线清晰
  era: 北宋熙宁年间
  dates_known: true
- name_zh: 章惇
  score: 7
  worth_why: 察访荆湖北路、开梅山置安化县，经营西南边地有实绩，后位至宰相，做事流可续本传补全
  era: 北宋熙宁年间
  dates_known: true
- name_zh: 种谔
  score: 7
  worth_why: 袭夏兵于啰兀大败之、城啰兀，后因抚宁之陷坐贬，将功罪交织的人生弧线完整可考
  era: 北宋熙宁年间
  dates_known: true
- name_zh: 神宗赵顼
  score: 6
  worth_why: 锐意变法之君主，然本纪体例仅记事大纲；主要作熙宁时间坐标，可缓录
  era: 北宋
  dates_known: true
rejections:
