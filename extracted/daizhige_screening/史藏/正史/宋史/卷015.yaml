  why_not: 擅兴兵败绩、诬斩裨将被贬，事虽可作警示但本卷所记过简，不足独立成轴
- name_zh: 富弼
  why_not: 本卷仅见致仕、坐格青苗法徙判汝州数语，做事周期需赖本传，暂缓
