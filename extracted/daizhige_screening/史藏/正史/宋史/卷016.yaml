  worth_why: 元丰改制定官制、五路伐夏虽败犹有完整决策周期，是王安石变法后的制度建设主
  era: 北宋
  dates_known: true
- name_zh: 种谔
  score: 8
  worth_why: 元丰四年在无定川、黑水等连破夏军，入银州复夏州，后因粮尽兵溃，名将兴衰俱全
  era: 北宋
  dates_known: true
- name_zh: 徐禧
  score: 7
  worth_why: 城永乐遭夏军三十万围攻城陷身死，是纸上谈兵致败的典型教训
  era: 北宋
  dates_known: true
- name_zh: 章惇
  score: 7
  worth_why: 参知政事至门下侍郎，历经罢黜起复，后成绍圣主政者，做事周期完整
  era: 北宋
  dates_known: true
- name_zh: 沈括
  score: 7
  worth_why: 永乐之败因措置乖方贬均州，兼《梦溪笔谈》作者，科学家统兵的荣辱样本
  era: 北宋
  dates_known: true
- name_zh: 曾巩
  score: 6
  worth_why: 专典史事、收采名臣遗文修史，文献之功可考
  era: 北宋
  dates_known: true
- name_zh: 李宪
  score: 6
  worth_why: 收复兰州古城、败夏于西市新城屈吴山，宦官将帅的边功链条清晰
  era: 北宋
  dates_known: true
- name_zh: 王珪
  score: 5
  worth_why: 上《国朝会要》《两朝史》，尚书左仆射行新官制，事迹多系职守非立事
  era: 北宋
  dates_known: true
rejections:
