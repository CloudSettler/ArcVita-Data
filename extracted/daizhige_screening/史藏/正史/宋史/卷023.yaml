candidates:
- name_zh: 赵桓
  score: 7
  worth_why: 靖康之耻的当事人君主；即位于危局、用李纲守汴又罢之、和战摇摆终致北掳，是决策反复致败的完整教训样本
  era: 北宋末
  dates_known: true
- name_zh: 李纲
  score: 8
  worth_why: 东京保卫战主帅，宣泽门、通津门力战却敌；伏阙之变中军民数万请复其职；主战罢相反复，做事流完整且成语典故多
  era: 北宋末
  dates_known: true
- name_zh: 陈东
  score: 6
  worth_why: 太学生领袖伏阙上书数万民众围观，提出诛六贼、复用李纲，为民请命的士人典型，最终以身殉之
  era: 北宋末
  dates_known: true
- name_zh: 种师道
  score: 6
  worth_why: 老将督泾原秦凤兵入援勤王，与李纲共守汴京，主张持重待敌，晚节担当可录
  era: 北宋末
  dates_known: true
- name_zh: 赵构
  score: 6
  worth_why: 康王使金军为质、再出使复归，后建南宋；本卷仅见其出使片段，做事流需待高宗本纪补全
  era: 北宋末
  dates_known: true
- name_zh: 张邦昌
  score: 5
  worth_why: 副康王使金军、后为太宰，终为金人所立傀儡皇帝，是屈节事仇的警示样本，但本卷事迹尚简
  era: 北宋末
  dates_known: true
rejections:
