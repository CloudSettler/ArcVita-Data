- name_zh: 岳飞
  score: 9
  worth_why: 本卷见其讨曹成连破贺州桂岭、遣将平萍乡诸盗，精忠报国与北伐事业流完整，莫须有冤狱为千古教训
  era: 南宋
  dates_known: true
- name_zh: 韩世忠
  score: 8
  worth_why: 本卷拔建州平范汝为、大破刘忠，此前黄天荡阻金兀术，梁红玉击鼓为名场面
  era: 南宋
  dates_known: true
- name_zh: 秦桧
  score: 8
