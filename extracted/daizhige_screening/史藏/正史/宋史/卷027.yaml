  era: 南宋
  dates_known: true
- name_zh: 吴玠
  score: 8
  worth_why: 本卷陕西诸战未见明文而和尚原之战挫金兀术有名，兄弟守蜀为完整做事流
  era: 南宋
  dates_known: true
- name_zh: 张浚
  score: 7
  worth_why: 本卷见其经略川陕、黜王庶用刘子羽等人事布局，富平之败与关陕经营周期可考
  era: 南宋
  dates_known: true
- name_zh: 李纲
  score: 7
  worth_why: 本卷见其宣抚湖广、入潭平盗又旋罢，说明力主抗金而不得用，做事流近完整
  era: 南宋
  dates_known: true
- name_zh: 赵鼎
  score: 6
  worth_why: 本卷出知江东安抚，与秦桧党争及元佑党学可为人物轴，主战贤相终贬死
  era: 南宋
  dates_known: true
