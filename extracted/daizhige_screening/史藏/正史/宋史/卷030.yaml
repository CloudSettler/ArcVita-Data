candidates:
- name_zh: 岳飞
  score: 9
  worth_why: 绍兴十二年本纪满纸岳飞余波，营护者被贬、何铸因党岳飞不主和议而罢，身处风波亭冤案中心，做事流与教训俱足
  era: 南宋初
  dates_known: true
- name_zh: 秦桧
  score: 8
  worth_why: 主和议全程操盘，加太师封两国公，排陷赵鼎、岳飞等异己，权相弄权典型，可为警示
  era: 南宋初
  dates_known: true
- name_zh: 赵鼎
  score: 7
  worth_why: 与高宗共渡江南的中兴名相，屡遭贬谪至吉阳军安置，牵连党禁一串人物
  era: 南宋初
  dates_known: true
- name_zh: 洪皓
  score: 8
  worth_why: 留金十五年持节不屈，绍兴十三年放归即出知饶州，苏武式气节人物
  era: 南宋初
  dates_known: true
- name_zh: 胡铨
  score: 7
  worth_why: 乞斩秦桧名章传世，绍兴十二年被除名新州编管，直臣标杆
  era: 南宋初
  dates_known: true
- name_zh: 王伦
  score: 7
  worth_why: 奉使金国被扣不降，绍兴十四年七月金人杀之于河间府，死节使者，做事流完整
  era: 南宋初
  dates_known: true
- name_zh: 韩世忠
  score: 7
  worth_why: 黄天荡大捷名将，和议后自沉骑都、封咸安郡王，进退之间可见宋廷削兵权大局
  era: 南宋初
  dates_known: true
- name_zh: 吴璘
  score: 7
  worth_why: 守川陕经四州经略使至利州西路安抚使，仙人关等抗金战事承岳飞外另一正面战场
  era: 南宋初
  dates_known: true
- name_zh: 郑刚中
  score: 6
  worth_why: 川陕宣抚副使分画陕西地界对金交涉，后有处置事，疆界谈判的执行者
  era: 南宋初
  dates_known: true
- name_zh: 李显忠
  score: 6
  worth_why: 自金起义南归之将，官保信军节度使，隆兴北伐著名主角
  era: 南宋初
  dates_known: true
rejections:
