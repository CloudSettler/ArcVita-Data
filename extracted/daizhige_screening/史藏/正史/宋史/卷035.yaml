candidates:
- name_zh: 宋孝宗
  score: 6
  worth_why: 为岳飞平反复谥武穆、录赵鼎岳飞子孙，锐意恢复又承平守成，淳熙年间改革考课、宽恤赋税，然本纪为编年纲目，做事周期需从他传补全
  era: 南宋
  dates_known: true
- name_zh: 史浩
  score: 5
  worth_why: 两度拜相，主张民不宜律以军法，谏诤被拒后请罢政，有风骨；主修《仙源类谱》《会要》诸典籍
  era: 南宋
  dates_known: true
- name_zh: 范成大
  score: 5
  worth_why: 从礼部尚书入参知政事，然本纪仅见迁转罢免，其使金不辱命、田园诗代表作需另据本传
  era: 南宋
  dates_known: true
- name_zh: 周必大
  score: 5
  worth_why: 由刑部尚书参知政事，后位至宰相刻书传世，本纪仅一线索
  era: 南宋
  dates_known: true
- name_zh: 赵雄
  score: 4
  worth_why: 自参知政事升右丞相，奉敕上《会要》《国史志》，自 princess 本纪事迹单薄
  era: 南宋
  dates_known: true
