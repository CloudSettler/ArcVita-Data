candidates:
- name_zh: 韩侂胄
  score: 9
  worth_why: 外戚操政策动绍熙内禅立宁宗，iong后主导庆元党禁斥朱熹道学为伪学，终开禧北伐兵败被诛，做事周期完整且是庆元党禁与开禧北伐两大名场面主角
  era: 南宋（宋宁宗朝）
  dates_known: true
- name_zh: 赵汝愚
  score: 8
  worth_why: 宗室宰相主持拥立宁宗的内禅大计，当机立断定社稷于孝宗之丧；旋即遭韩党排挤贬死衡州，功成身祸可为教训
  era: 南宋（绍熙至庆元年间）
  dates_known: true
- name_zh: 朱熹
  score: 7
  worth_why: 以侍讲进讲旋以上疏忤韩侂胄罢官，庆元党禁中道学遭禁，能体现理学家以经筵救正阙失的做事轨迹；主线详于本传
  era: 南宋
  dates_known: true
- name_zh: 宁宗
  score: 6
  worth_why: 被拥立即位与庆元党禁、开禧和议期间的君主，主要作时间坐标，缺乏主动做事周期
  era: 南宋
  dates_known: true
