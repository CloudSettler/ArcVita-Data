  era: 南宋末
  dates_known: true
- name_zh: 刘整
  score: 8
  worth_why: 泸州守将遭俞兴构陷被迫北降，献攻宋方略，直接改变宋元战争走向，命运转折剧烈
  era: 宋末元初
  dates_known: true
- name_zh: 吕文德
  score: 7
