  era: 南宋末
  dates_known: true
- name_zh: 高达
  score: 6
  worth_why: 鄂州坚守三月之功与吕氏集团受赏对照鲜明，事迹尚简可缓
  era: 南宋末
  dates_known: true
- name_zh: 夏贵
  score: 6
  worth_why: 新生洲、白鹿矶、淮安诸战督战有功，久镇两淮；结局降元可成教训，本卷事迹偏赏历
  era: 南宋末
  dates_known: true
- name_zh: 吴潜
  score: 7
  worth_why: 贤相遭贾似道、台谏倾陷，三度贬窜终于循州，忠而见逐之悲剧，做事与际遇可考
  era: 南宋末
  dates_known: true
- name_zh: 向士璧
  score: 6
