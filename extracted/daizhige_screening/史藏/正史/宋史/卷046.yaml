category: 史藏/正史/宋史
person:
  qid: guji-宋度宗
  name_zh: 宋度宗
  names:
    zh: 宋度宗
    en: Emperor Duzong of Song
  lifespan:
    birth:
      date: 1240-05-11
      precision: day
      is_circa: false
      raw: 嘉熙四年四月九日生于绍兴府荣邸
  birth_date: 1240-05-11
  era: 南宋晚期
  reign_ref: 1264-1274 在位，年号咸淳
  archetype: 守成之君
  dilemmas:
  - 蒙古大军压境，边防告急而朝政倚重贾似道
  - 谅阴期间是否即时听政的礼制抉择
  lesson: 无子而立为储、锐意求言却难挽国势；过用恩赏外戚则政以私亲坏
  summary_first_person: 我赵禥是理宗的侄子，幼年聪慧被立为太子，日日鸡鸣问安、手不释卷。景定五年理宗崩后我即皇帝位，屡辞而始听政，诏求直言、躬行三年丧、平粜赈民、严惩贪吏，又为理宗上谥南郊，谒孔子以太学四配从祀。然蒙古兵锋日逼，庐州安庆诸将战没，我终难挽偏安之局。
  source_urls:
  - 宋史 卷四十六
