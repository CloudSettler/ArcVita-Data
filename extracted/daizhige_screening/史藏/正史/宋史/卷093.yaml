candidates:
- name_zh: 张商英
  score: 8
  worth_why: 力主北流屡抗众议，缴奏反对赦复水官，提出随地形疏浚入海五策，终被夺治河权；治河当行其所无事之论可成教训
  era: 北宋徽宗朝
  dates_known: true
- name_zh: 苏辙
  score: 8
  worth_why: 门下侍郎任上力谏软堰不可施于北流，识破水官以软堰名行硬堰实之谋，说理透辟，执政风骨显著
  era: 北宋元祐
  dates_known: true
- name_zh: 赵偁
  score: 7
  worth_why: 转运使任上系统提出河事三大利害论，主张顺地势水性，请俟涨水观势再治，是北宋治河争论中的清醒派
  era: 北宋元祐绍圣间
  dates_known: true
- name_zh: 任伯雨
  score: 7
  worth_why: 奏疏痛陈近世屈大河以从人之弊，勾勒回河东流八年劳民伤财而终溃的全过程，可为劳民伤财逆势行事之鉴
  era: 北宋建中靖国
  dates_known: true
- name_zh: 吴安持
  score: 6
  worth_why: 主回河九年无尺寸之效，终以河决被窜远方，是侥幸盗功、逆水性做事流失败典型；asier为教训
  era: 北宋元祐至元符
  dates_known: true
