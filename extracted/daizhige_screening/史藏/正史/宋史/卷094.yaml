source: 史藏/正史/宋史/卷094.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 宋用臣
  score: 8
  worth_why: 主持导洛通汴工程，兴工四十五日成清汴五十一里，创引洛济漕、斗门束水之法，元祐罢废后绍圣复起力挽，做事流完整
  era: 北宋神宗哲宗朝
  dates_known: true
- name_zh: 范子渊
  score: 7
  worth_why: 知都水监丞时画十利献策引洛入汴，后又请修堤开直河，是清汴工程的倡议与技术主持者
  era: 北宋神宗朝
  dates_known: true
- name_zh: 苏辙
  score: 7
  worth_why: 连章弹奏废罢水磨水匮，算账驳课利伤民，弃利还田于民，谋国之疏可作后世理财恤民之镜
  era: 北宋元祐年间
  dates_known: true
- name_zh: 梁焘
  score: 6
  worth_why: 上疏剖判导洛通汴六失，预言怒流溃堤直冒京师之患，主张复汴口引大河，事后果应验
  era: 北宋元祐年间
  dates_known: true
rejections:
- name_zh: 张从惠
  why_not: 仅一疏建议引洛入汴，无完整做事周期
- name_zh: 李仲
  why_not: 仅建言复汴口罢清汴闸，事迹简略
- name_zh: 蔡京
  why_not: 本卷仅一言岁计漕运事，不足以成轴；史载另有专传可入
- name_zh: 贾种民
  why_not: 相度修浚清汴数奏而已，做事流不完整
- name_zh: 吴安持 / 王宗望 / 冯忱之 / 陈祐甫 / 杨琰 / 李伟 / 岑象求 / 宋用臣部属河清卒
  why_not: 传文零散仅承担查勘督修差事，无独立可考做事周期
