candidates:
- name_zh: 程昉
  score: 8
  worth_why: 熙宁水利主将，开漳河修御河创浮梁引黄河通漕，做事周期完整；役费浩大屡遭弹劾而王安石力保，终成败互见，堪称北宋版水中变法者的教训样本
  era: 北宋熙宁元丰间
  dates_known: false
- name_zh: 文彦博
  score: 7
  worth_why: 数度覆实河役利害，论漳河罢役与御河引黄之害，据理力驳建谋之官，河果决卫州而其言验，体现重臣审务与民生本位
  era: 北宋元丰间
  dates_known: true
- name_zh: 熊本
  score: 7
  worth_why: 奉命相视御河开沙河之役，奏算钱米功料二百万有奇、淤田千顷，断以'有费无利'，是数据稽核定决策的经典做事案例
  era: 北宋熙宁末
  dates_known: true
- name_zh: 王安石
  score: 6
  worth_why: 于漳河之辩提出'治之使行地中则有利无害'、以佚道使民的治水理念，并为程昉力辩，可作变法派水利路线的 restricting 注脚
  era: 北宋熙宁间
  dates_known: true
