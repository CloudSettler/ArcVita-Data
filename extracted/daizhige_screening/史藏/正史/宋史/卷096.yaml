candidates:
- name_zh: 郏亶
  score: 7
  worth_why: 上疏倡苏州治水纵浦横塘之法，受命兴修水利一年而罢，成事与挫败皆有据
  era: 北宋熙宁
  dates_known: true
- name_zh: 苏轼
  score: 8
  worth_why: 知杭州浚茆山盐桥二河、全六井，治水惠民，做事流完整；已在库人物但本卷为其杭州事功新增证据
  era: 北宋元祐
  dates_known: true
- name_zh: 沈括
  score: 7
  worth_why: 建言两浙水利、相度泾浜堤防，兼具科学家与能吏面目
  era: 北宋熙宁
  dates_known: true
- name_zh: 乔维岳
  score: 7
  worth_why: 继刘蟠开楚州至淮阴沙河六十里避淮险，舟行称便，工程周期完整
  era: 北宋雍熙
  dates_known: false
- name_zh: 丁谓
  score: 7
  worth_why: 知升州复治后湖为塘陂畜水，除租还利于民，成事之例（其人生另有权奸教训可对照）
  era: 北宋天禧
  dates_known: true
- name_zh: 蒋之奇
  score: 7
  worth_why: 建言凿龟山复河免百里淮覆溺之险，费虽大利亦博之说动人主，事成撰记刻石
  era: 北宋元丰
  dates_known: true
- name_zh: 许元
  score: 6
  worth_why: 发运使开淮阴新河属洪泽避长淮之险，创议之功可考
  era: 北宋
  dates_known: false
- name_zh: 皮公弼
  score: 5
  worth_why: 请复浚新河，十一月开工正月而毕，工期明确但事迹单薄
  era: 北宋熙宁
  dates_known: false
- name_zh: 曾孝蕴
  score: 6
  worth_why: 献澳闸利害，提举兴修京口奔牛澳闸并立法度，专业水利官典型
  era: 北宋元符
  dates_known: false
- name_zh: 罗拯
  score: 5
  worth_why: 复欲凿龟山里河达淮，得帝深然，然兴役之功归于后任
  era: 北宋熙宁
  dates_known: false
- name_zh: 徐确
  score: 5
  worth_why: 提举常平主持开吴松江青龙港，因役夫劳伤获滥赏之讥，可为教训
  era: 北宋崇宁
  dates_known: false
- name_zh: 许光凝
  score: 6
  worth_why: 姑苏遍询民吏，倡开江浚浦去水患，三江导流之议复起，论证有力
  era: 北宋大观
  dates_known: false
- name_zh: 霍端友
  score: 5
  worth_why: 知陈州奏开二百里新河泄积潦达淮，一事之功完整
  era: 北宋政和
  dates_known: true
- name_zh: 李符
  score: 5
  worth_why: 征江南时献凿横江渠策并督役数万人，渠成通漕军用无阙
  era: 北宋开宝
  dates_known: false
- name_zh: 赵竦
  score: 5
  worth_why: 度地势穿凿徐州吕梁百步洪河道、后请浚十八里河，两度言水利
  era: 北宋元祐绍圣间
  dates_known: false
