candidates:
- name_zh: 苏轼
  score: 8
  worth_why: 知杭州浚西湖积葑为堤即苏公堤，又开浚茅山盐桥二河置闸防淤，做事流完整且留下标志性工程与苏堤之名
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 8
  worth_why: 为泰州西溪盐官时请修捍海堰，调四万余夫三旬毕工，化泻卤为良田即范公堤，为后来居庙堂江湖忧乐观之先声
  era: 北宋
  dates_known: true
- name_zh: 钱镠
  score: 7
  worth_why: 筑捍海塘射潮头，造竹器积巨石植大木，堤成民居乃奠，杭州奠基性工程，命名场面钱塘射潮
  era: 五代吴越
  dates_known: true
- name_zh: 张夏
  score: 6
  worth_why: 置捍江兵士五指挥专采石修塘随损随治，邦人立祠封宁江侯，制度创举可考
  era: 北宋景祐
  dates_known: false
- name_zh: 陈损之
  score: 6
  worth_why: 奏筑绍熙堰堤三百六十里载柳十万株，得良田数百万顷，因功除直秘阁，做事闭环完整
  era: 南宋绍熙
  dates_known: false
- name_zh: 戚纶
  score: 6
  worth_why: 与陈尧佐画浙江防捍之策，后李溥复用钱氏旧法实石竹笼逾年乃成，治潮工程链可考
  era: 北宋大中祥符
  dates_known: true
- name_zh: 李溥
  score: 5
  worth_why: 复用钱氏旧法实石于竹笼筑堤七里捍潮，逾年乃成
  era: 北宋大中祥符
  dates_known: true
