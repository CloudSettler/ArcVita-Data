category: 史藏/正史/宋史
verdict: no_value
skip_reason: 卷一百为《宋史·礼志》北郊篇，属典章制度记录，通篇议礼、定仪、改坛制，无任何人物具完整做事周期；司马光、苏轼、曾布、章惇等仅以奏议片段出现，无缘起、阶段与结果的个人行事流，且空间有限不足以成条
rejections:
- name_zh: 司马光
  why_not: 仅一句谏官奏请，无做事流
- name_zh: 曾布
  why_not: 仅力主北郊之说的议礼立场，无完整行事周期
- name_zh: 苏轼
  why_not: 仅复陈合祭六议一笔带过，事迹在诗文本卷无展开
- name_zh: 章惇、黄履、蔡京、吕大防等
  why_not: 皆为议集团议中的只言片语，无个人做事流
