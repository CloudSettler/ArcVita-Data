verdict: has_candidates
candidates:
- name_zh: 宋仁宗
  score: 7
  worth_why: 皇祐二年首创亲祀明堂大庆殿之礼，定合祭天地、三祖并配之制，嘉祐七年又亲献五方帝，是一代礼制典章的定案者
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 6
  worth_why: 以谏官身份反驳严父配天说，主张非创业之君不得配天，引经据典判断礼制，见其经学功底与政论风格
  era: 北宋
  dates_known: true
- name_zh: 钱公辅
  score: 5
  worth_why: 著名配享议礼之争的发起者，以周公严祖之说反对仁宗配明堂，引发朝中礼制大辩论
  era: 北宋
  dates_known: true
- name_zh: 宋英宗
  score: 5
  worth_why: 治平四年以英宗配明堂，元丰时围绕其配享引发罢六天说、改祭器仪注等一系列礼制改革决定
  era: 北宋
  dates_known: true
rejections:
