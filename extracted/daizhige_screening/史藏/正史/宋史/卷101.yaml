  why_not: 仅一段议礼奏对，无完整做事周期
- name_zh: 王珪
  why_not: 仅学士议礼记录，事迹零散
- name_zh: 赵鼎
  why_not: 仅一条递迁配位建议无后续
- name_zh: 王祖道
  why_not: 御史一言建言，无做事周期
- name_zh: 吕诲
  why_not: 与司马光联名谏议，无独立事迹
- name_zh: 文彦博
  why_not: 仅传诏绘图一句，无做事周期
notes: 本卷为礼志记事，主线索为宋明堂礼制由草创至定型的制度演进，仁宗亲定合祭之制为最完整做事流，司马光、钱公辅之礼辩具名场面潜力
