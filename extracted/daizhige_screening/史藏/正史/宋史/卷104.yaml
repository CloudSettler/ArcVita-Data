verdict: has_candidates
candidates:
- name_zh: 赵恒（宋真宗）
  score: 7
  worth_why: 大中祥符元年东封泰山，从千余人诣阙陈请到王旦率二万四千余人五上表，再到详定仪注、五使分职、登山封祀禅社首，是一套完整的国家级礼仪工程，也是君主动用天书祥瑞政治造势的典型样本，可为后世警示
  era: 北宋
  dates_known: true
- name_zh: 王旦
  score: 6
  worth_why: 作为宰臣率百官五上表请封禅，任大礼使，奉玉匮置石匮，撰《封祀坛颂》，是东封工程实际主持者，反映盛世名相卷入天书政治的过程
  era: 北宋
  dates_known: true
- name_zh: 王钦若
  score: 6
  worth_why: 为封禅经度制置使并判兖州，任礼仪使，撰《社首坛颂》，是推动天书与封禅的关键操盘人物，可与其后生平构成决策链
  era: 北宋
  dates_known: true
rejections:
- name_zh: 宋琪
  why_not: 仅率群臣三上表请封禅一句，无做事周期
- name_zh: 王旦以外五使（陈尧叟、冯拯、赵安仁、曹利用、丁谓等）
  why_not: 仅见分职任职记录，无独立完整事迹，且赵安仁等事迹他卷可考
- name_zh: 审刑院
  why_not: 非人物
