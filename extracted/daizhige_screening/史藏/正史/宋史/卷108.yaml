verdict: no_value
skip_reason: 本卷为《宋史·礼志·时享》篇，属典章制度志，记宗庙时享礼制沿革。文中出现人物仅奏议者，如判太常寺和岘、赵安仁、吕希纯等，各自事迹仅一二条建议，无完整做事流、有名场面潜力或教训意义；皇帝行为仅礼制例行，作时间坐标无弧光，不构成可录入的成事儿时间轴
rejections:
- name_zh: 和岘
  why_not: 仅奏请加牙盘食一条，无做事周期
- name_zh: 赵安仁
  why_not: 仅一次详定朔望上食的奏议，事迹单薄
- name_zh: 吕希纯
  why_not: 仅建议恢复牙盘食并改称荐羞一事，人物缺生平与阶段
- name_zh: 宋太祖等诸帝
  why_not: 君主在本篇仅为礼制裁决与时间坐标，无突出做事
