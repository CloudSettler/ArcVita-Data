category: 史藏/正史/宋史
verdict: no_value
skip_reason: 本卷为礼志（后庙、神御殿、配侑、家庙制度），记述宋代宗庙礼制的沿革与集议，系制度史而非人物传记；出现的和岘、陈彭年、张齐贤、钱惟演、吕公著、王尧臣等皆只在个别礼议中一句带过，无做事流与名场面，时间轴价值不足
rejections:
- name_zh: 和岘
  why_not: 仅干德元年议孝明皇后庙次一句，无完整做事周期
- name_zh: 陈彭年
  why_not: 仅景德五年一疏论禘祫祔享，事迹单一
- name_zh: 张齐贤
  why_not: 仅以兵部尚书身份集议奏一句，无叙事
- name_zh: 钱惟演
  why_not: 明道二年一请并祔二后而已，无做事流
- name_zh: 吕公著
  why_not: 治平元年一奏请罢奉慈庙及熙宁二年一事，仅礼议片段
- name_zh: 王尧臣
  why_not: 仅庆历中一议章献谥号，无传记内容
- name_zh: 贾昌朝
  why_not: 仅摄太尉奉上宝册一句，非做事主体
- name_zh: 陈执中
  why_not: 同贾昌朝，仅奉册仪式一句
