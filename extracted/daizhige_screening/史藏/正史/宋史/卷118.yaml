candidates:
- name_zh: 文彦博
  score: 6
  worth_why: 四朝元老，历仁英神哲数朝，平定贝州之乱、主政澶渊议政；本卷仅见其太师平章军国重事独班起居之礼遇，做事流需他卷补足
  era: 北宋
  dates_known: true
- name_zh: 吕大防
  score: 6
  worth_why: 元祐宰臣，垂帘听政期间主政，曾奏议转对纳谏制度；本卷仅见其言台谏同对之议，事迹主要在别卷
  era: 北宋
  dates_known: true
- name_zh: 程颢
  score: 6
  worth_why: 理学奠基者，与张戬联名请御史谏官许越次登对直陈政事，体现宋代言路制度之争；代表作与思想在别卷较详
  era: 北宋
  dates_known: true
- name_zh: 张戬
  score: 5
  worth_why: 监察御史里行，与程颢同奏请求谏官牒阁门求对、许急奏越次登对，为言官权益抗争
  era: 北宋
  dates_known: true
