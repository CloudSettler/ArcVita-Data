skip_reason: 本卷为《宋史·凶礼志》，专记山陵、丧服、葬仪等国家礼制，人物仅以职官身份零散出现（范质、窦仪、王珪、雷允恭等），皆无完整做事流与名场面，不可个人立传
rejections:
- name_zh: 范质
  why_not: 仅载其充改卜安陵使旋免相，无做事周期
- name_zh: 王珪
  why_not: 仅一条议谥建言，事迹单薄
- name_zh: 雷允恭
  why_not: 只为复按山陵被差遣，无事迹展开
- name_zh: 各帝后（太祖至神宗）
  why_not: 君主在本卷只作丧仪时间坐标，无独立做事叙事
