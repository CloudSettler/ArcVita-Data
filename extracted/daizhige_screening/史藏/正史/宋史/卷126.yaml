source: 史藏/正史/宋史/卷126.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 和岘
  score: 7
  worth_why: 山嵝初改制乐定雅乐尺度新尺、定二舞之名、作瑞乐章，主导北宋首次雅乐改制，做事流完整
  era: 北宋初
  dates_known: true
- name_zh: 李照
  score: 7
  worth_why: 景祐铸编钟改雅乐成一代之乐，后因谏官交论而复旧制，为改革受挫之教训案例
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 范镇
  score: 7
  worth_why: 与司马光争乐律三十年，主张以律生尺废四清声，元祐自造乐成范镇乐
  era: 北宋
  dates_known: true
- name_zh: 杨杰
  score: 6
  worth_why: 条上旧乐之失，参定元丰之乐，又驳范镇乐致其不用，积极议乐有阶段性事迹
  era: 北宋神宗朝
  dates_known: true
- name_zh: 蔡元定
  score: 7
  worth_why: 与朱熹讲明乐律本原著为成书，理明义析，惜宋亡徒为空言，学术悲剧具启发
  era: 南宋
  dates_known: true
- name_zh: 窦俨
  score: 5
  worth_why: 承周制定宋朝一代乐章名目，改十二顺为十二安，制度初创有可考事迹
  era: 宋初
  dates_known: true
- name_zh: 王朴
  score: 6
  worth_why: 作律准考正五代雅乐，其律尺影响宋初百年乐制更改
  era: 五代后周
  dates_known: true
rejections:
- name_zh: 魏汉津
  why_not: 以帝指为律度之说荒唐，事迹依附蔡京，独立做事周期短
- name_zh: 阮逸
  why_not: 与胡瑗造钟磬声不和，事迹简略
- name_zh: 胡瑗
  why_not: 乐志中仅参预其事，主要事迹在学派教育，乐制考据不足成完整时间轴
- name_zh: 朱熹
  why_not: 乐论仅空言未行，主要成就不在乐制，应另据行状年谱录入
- name_zh: 宋太祖
  why_not: 天下共主，仅作改制之时间坐标，无突出独立做事流
