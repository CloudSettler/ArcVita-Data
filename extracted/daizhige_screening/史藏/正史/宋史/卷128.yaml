verdict: has_candidates
candidates:
- name_zh: 范镇
  score: 8
  worth_why: 元丰议乐三十年争律尺，力主先正律造尺律；乐成后坦言此刘几乐也臣何预焉，又上奏补八音匏土之缺，见学者风骨与完整做事周期
  era: 北宋元丰年间
  dates_known: true
- name_zh: 刘几
  score: 7
  worth_why: 以致仕秘书监受诏详定大乐，提七失之论，主律吕以人声为度，增四清声成一代新乐，元丰六年御大庆殿初用
  era: 北宋神宗朝
  dates_known: false
- name_zh: 杨杰
  score: 6
  worth_why: 议乐裁断叶防之奏，考均律差互与刘几同，请以晋鼓节金奏，参与元丰乐制改革
  era: 北宋神宗朝
  dates_known: false
- name_zh: 房庶
  score: 5
  worth_why: 布衣上书论尺律之法，奉诏造律管尺量龠，引发范镇正律之争，事在皇祐中
  era: 北宋仁宗朝
  dates_known: false
- name_zh: 胡瑗
  score: 5
  worth_why: 铸铜律与尺、制造磬钟形制精密，与阮逸磬钟为三等之一，虽反对房庶尺律但于乐器有实事
  era: 北宋仁宗朝
  dates_known: true
rejections:
- name_zh: 叶防
  why_not: 开封布衣上书论乐器，其说被驳，补乐正而已，无事功周期
- name_zh: 荣谘道
  why_not: 仅奏请选玉造磬一事，事迹单薄
- name_zh: 阮逸
  why_not: 传文仅存其磬钟评语，无做事流文本
