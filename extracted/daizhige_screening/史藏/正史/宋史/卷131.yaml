category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 姜夔
  score: 8
  worth_why: 向朝廷进《大乐议》，系统批评绍兴大乐乐器失度、乐工苟且、雅俗乐标准不一，主张正权衡度量、复古十二宫、作鼓吹曲歌祖宗功德，并自作《圣宋铙歌曲》，是宋代乐制改革的关键建言，做事流可考且乐学见解垂范后世
  era: 南宋
  dates_known: true
- name_zh: 耿秉
  score: 6
  worth_why: 绍熙郊祀奏请修缮乐器冠服、优给乐工日廪、严惩托权要充数者，整顿礼乐仪制的务实举措，做事流较简略
  era: 南宋
  dates_known: false
rejections:
- name_zh: 章颖
  why_not: 嘉定二年奏请申严乐工禁令，仅一疏之事，无完整做事周期
- name_zh: 光宗
  why_not: 君主，本卷仅述受禅册礼用乐，作时间坐标为主
- name_zh: 理宗
  why_not: 君主，享国遵旧章未尝改作，无突出做事
