verdict: no_value
skip_reason: 本卷为《宋史·职官志》制度卷，记大都督府、制置使、宣抚使等官制沿革，人物仅作为制度沿革例证出现，无完整做事周期可考
rejections:
- name_zh: 张浚
  why_not: 卷中仅见其宣抚川陕、都督江淮诸军事的任命记录，无做事全周期叙述
- name_zh: 吕颐浩
  why_not: 仅载绍兴二年出都督江淮诸军事一事，无生平事迹
- name_zh: 赵鼎
  why_not: 仅见兼都督诸路军马的官衔记录，非传记文本
- name_zh: 岳飞
  why_not: 仅作为武臣充宣抚使例证提及，事迹散见他卷
- name_zh: 虞允文
  why_not: 仅载充宣抚使、宣谕使的职任变更，无关键决策叙述
- name_zh: 童贯
  why_not: 仅见制置使、宣抚使任命记录，无完整做事周期
- name_zh: 虞允文
  why_not: 同上，职官志仅记其官衔递转
