skip_reason: 本卷为《宋史·职官志》叙迁格例，通篇为文臣、武臣、宗室、内侍的官阶磨勘与铨选条例，属制度文书而非人物传记；仅贾黯奏止皇子带三师官一事，事迹过简，无完整做事 ciclo 周期与名场面，均不足录入成事儿时间轴。
