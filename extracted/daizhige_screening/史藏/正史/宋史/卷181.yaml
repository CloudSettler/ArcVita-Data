candidates:
- name_zh: 张咏
  score: 9
  worth_why: 治蜀时发明交子，是世界最早纸币的制度设计者，缘起、办法、成效可考
  era: 北宋真宗朝
  dates_known: true
- name_zh: 钱端礼
  score: 7
  worth_why: 高宗朝被旨造会子，储见钱于城内外流转，为会子制度化关键人
  era: 南宋绍兴末
  dates_known: true
- name_zh: 张商英
  score: 7
  worth_why: 大观中纸币滥发致引价崩坏，其秉政复循旧法，引价复平，救币制有成
  era: 北宋徽宗朝
  dates_known: true
- name_zh: 赵开
  score: 7
  worth_why: 张浚宣抚川陕时任总饷，以钱引供籴本给军需，战时财政运作可考
  era: 南宋初
  dates_known: true
- name_zh: 王之望
  score: 6
  worth_why: 四川总饷，论添印钱引救目前而须为朝廷远虑，止添印一百万，有节制决策
  era: 南宋绍兴末
  dates_known: true
- name_zh: 薛田
  score: 6
  worth_why: 转运使任内请置益州交子务，将民营交子收归官营，金融制度关键转折
  era: 北宋仁宗朝
  dates_known: false
- name_zh: 张若谷
  score: 5
  worth_why: 与薛田同请置交子务，事迹简略
  era: 北宋仁宗朝
  dates_known: false
- name_zh: 张持
  score: 5
  worth_why: 知威州奏川引贬值治理之策，擢提举川引，后坐远谪，有做事起落但周期短
  era: 北宋大观间
  dates_known: false
- name_zh: 陈咸
  score: 5
  worth_why: 开禧末以岁用不足造小会，嘉定初出金银度牒收回半界，救币失败可作教训
  era: 南宋宁宗朝
  dates_known: false
- name_zh: 韩祥
  score: 5
  worth_why: 奏论救楮币在收减不在变更，淳祐年币论名段
  era: 南宋理宗朝
  dates_known: false
