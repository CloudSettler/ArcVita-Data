    death:
      date: 约1090
      precision: decade
      is_circa: true
      raw: 卒年史无明载
  birth_date: 约1030
  death_date: 约1090
  era: 北宋
  reign_ref: 宋神宗熙宁、宋哲宗元祐
  archetype: 制度改革执行者
  dilemmas:
  - 增课与宽刑难以两全: 盐课虽增而刑狱实繁
  - 严法奉公与下民困苦: 配流者达一万二千余人
  - 学优则仕与俗吏之名: 出身进士负文望，却被盐政成败裹挟
  lesson: 政策设计须同时核算经济收益与执法代价；吏有才能而无节制，则善政易酷，终致自损
  summary_first_person: 我以熙宁五年提举两浙盐事，先储官钱及时偿付灶户本钱，又按海水咸淡定各场分数，定伏火盘数、什伍其民以察私煮，岁课大增。然盐价愈促，配流者一万二千人，越州催盐竟至母杀子。朝廷徙我淮南，元祐中言者论我诛利增课，坐降职。名以能吏，绩以增课，谤以酷法，得失皆在一条盐法之内。
  source_urls:
  - https://zh.wikisource.org/wiki/宋史/卷182
