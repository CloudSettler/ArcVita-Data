candidates:
- name_zh: 蹇周辅
  score: 7
  worth_why: 针对闽地盗盐问题创福建盐法，降价设铺户、立法严盗，期年课增盗止；后因法弊掊克被削职，改革成败皆有可考
  era: 北宋熙宁元丰间
  dates_known: true
- name_zh: 赵汝愚
  score: 6
  worth_why: 任四川制置时体察汀州民贫官盐抑配之害，奏行裁减内钱之议，岁减民课近四万缗，惠政可考
  era: 南宋淳熙间
  dates_known: true
rejections:
