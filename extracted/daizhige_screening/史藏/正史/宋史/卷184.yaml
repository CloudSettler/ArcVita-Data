category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 李咨
  score: 7
  worth_why: 主持茶法改革复行见钱法，罢河北入中虚估、整顿交引铺保任之弊，奏罢陕西茶券，虚费五百六十万缗之弊由此得减；échec与复起两度任三司使，做事流完整
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 孙奭
  score: 7
  worth_why: 天圣三年受诏究茶法利害，罢贴射法复给本钱市茶，详陈贴射三弊；经学家而知财计，决策有据有果，然改制后茶法浸坏可为教训
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 薛向
  score: 7
  worth_why: 建议罢并边入粟、专以见钱和籴，自京辇钱帛储蓄京师优直募商，改革边籴运制；后虽遭辇运烦扰之讥而絮绛等部分维持，制度设计人物
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 叶清臣
  score: 7
  worth_why: 康定元年请行三说募入中、以东南盐代京师实钱；又上茶法疏痛陈榷茶之弊，提议通商征税岁入数倍，是宋代弛禁通商论的代表作
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 韩绛
  score: 6
  worth_why: 受诏即三司经度薛向之议，裁定边储有备未宜轻变、章程务平市估以银绸绢偿籴，为茶法脱钩边籴转折点
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 韩琦
  score: 6
  worth_why: 知定州时上言三说四说之弊费缗钱千余万，促成皇祐复行见钱法；以名臣直言论财计
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 范镇
  score: 6
  worth_why: 谏官谏罢榷货务稽商人与内藏库乘时射利之事，指出伤体坏法，一谏而罢，言官影响财政制度之例
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 吕夷简
  score: 6
  worth_why: 为天圣茶法变法辩护，以京师积钱多、边计不闻告乏论证成效，折中三司比视之误，宰相任事担当
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 杨偕
  score: 6
  worth_why: 河北转运使陈三说法十二害、见钱法十二利，条陈利弊影响景祐复行见钱法
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 董沔
  score: 5
  worth_why: 请复三说法并以茶盐香药缗钱四物支偿，创庆历四说法，但法复坏可为教训
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 张观
  score: 5
  worth_why: 宝元元年以御史中丞与三司议茶法，再损入钱数额，程序性决策参与
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 蔡齐
  score: 5
  worth_why: 以参知政事与李咨合议景祐茶法改革，罢交引铺保任、立偿商钱
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 张士逊
  score: 5
  worth_why: 受诏条析天圣比视增亏数差谬，身为主议官被罚，制度问责之例
  era: 北宋仁宗朝
  dates_known: true
rejections:
