- name_zh: 王韶
  score: 6
  worth_why: 首倡缘边市易以官钱为本，联结生羌收其赢以助军费；与李若愚、陈升之等争论而王安石力主，是熙宁市易法的源头；但本卷仅存其倡议片段，完整做事周期在宋史本传及熙河经略事中
  era: 北宋熙宁
  dates_known: true
- name_zh: 魏继宗
  score: 5
  worth_why: 自称草泽上言京师百货无常价贵贱相倾富能夺贫能与，直启京师置市易务；小人物改大制度的名场面，惜传文仅存断章
  era: 北宋熙宁
  dates_known: false
- name_zh: 苏轼
  score: 5
