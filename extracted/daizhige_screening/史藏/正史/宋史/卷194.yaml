skip_reason: 本卷为《宋史·兵志》拣选之制与廪给之制的制度汇编，通篇记军队拣选、并营规章与逐年诏令，无人物本传；虽提及韩琦、田况、王继英、燕达、狄咨等奏言，均为片段谏言，无缘起、阶段、关键决定与结果的完整做事流
rejections:
