candidates:
- name_zh: 王安石
  score: 9
  worth_why: 阿云案与张朝案力排众议以律意定谳，主张中书论正刑名，关乎国体之争，成制度性名场面
  era: 北宋熙宁间
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 与王安石争议按问自首法数十年，元丰拜相复申前议改法，立法之争贯穿其相位
  era: 北宋
  dates_known: true
- name_zh: 李昉
  score: 7
  worth_why: 率四十三人驳大理寺死判，保全安崇绪性命并定田产归宗方案，伦理与法理冲突的典范裁决
  era: 北宋端拱初
  dates_known: true
- name_zh: 许遵
  score: 7
  worth_why: 以登州知州身份引律争阿云案，抗御史台劾奏不伏，触发两 制定谳大争论
  era: 北宋
  dates_known: true
- name_zh: 曾布
  score: 7
  worth_why: 上肉刑恢复议，系统辨析流徒杖笞之弊与轻重生等，刑制改革重要文献
  era: 北宋
  dates_known: true
- name_zh: 范纯仁
  score: 7
  worth_why: 引嘉祐编敕救减等之弊，以大辟活杀数据论改法得失，宁失不经义之实践者
  era: 北宋元祐间
  dates_known: true
- name_zh: 周清
  score: 6
  worth_why: 精辨举轻明重与恶逆罪名的律意，纠正审刑院死罪误判
  era: 北宋元丰间
  dates_known: false
- name_zh: 徐铉
  score: 6
  worth_why: 安崇绪案引经义断四证定母曾离异，虽议失当被夺奉，仍为名议官场面
  era: 北宋端拱初
  dates_known: true
- name_zh: 杜纮
  score: 5
  worth_why: 单身驳法寺定两谳案死罪，虽被罚金仍显刑名之才
  era: 北宋元丰间
  dates_known: false
- name_zh: 文彦博
  score: 5
  worth_why: 上言裁抑重于旧律之法，主承平用中典；自首法立场鲜明
  era: 北宋
  dates_known: true
rejections:
