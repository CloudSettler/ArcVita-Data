- name_zh: 杜太后
  score: 8
  worth_why: 陈桥兵变时临变不喜反忧训以「为君难」；临终定金匮之盟 brothers传位立长君之谋，影响宋初皇位传承
  era: 五代末北宋初
  dates_known: true
- name_zh: 刘娥
  score: 9
  worth_why: 蜀地孤女入襄邸至垂帘听政，北宋第一位临朝称制的皇后；有《无逸》治天下之典型案例，虽借子立后有争议但治国称「元祐之治」先声
  era: 北宋真宗仁宗朝
  dates_known: true
