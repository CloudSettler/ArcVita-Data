  worth_why: 靖康之变起兵勤王，传檄讨张邦昌、坚请康王承制中兴，三屯之议有战略眼光；后因檄文获罪贬死，忠谏与祸福转折俱具名场面
  era: 两宋之际
  dates_known: true
- name_zh: 赵子淔
  score: 7
