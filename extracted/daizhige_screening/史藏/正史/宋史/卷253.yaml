candidates:
- name_zh: 折御卿
  score: 8
  worth_why: 子河汊大破契丹，力疾守边，『忠孝岂两全』死于军中，府州折氏世代捍边的代表
  era: 北宋初
  dates_known: true
- name_zh: 折克行
  score: 9
  worth_why: 在边三十年战功最多，羌人呼为折家父；葭芦川先登、奇正之辩论筑砦、先远后近出其不意，做事流完整
  era: 北宋中期
  dates_known: true
- name_zh: 折可适
  score: 9
  worth_why: 尾丁硙破敌、洪德设伏使夏国母弃辎重而遁、夜袭天都山取西安州；先弱其地后图灵武的战略建议及晚年被谤，完整兴衰周期
  era: 北宋中后期
  dates_known: true
- name_zh: 折德扆
  score: 7
  worth_why: 父子俱领节镇，破河东诸役，府州折氏崛起起点，世家捍边模范
  era: 五代末至宋初
  dates_known: true
