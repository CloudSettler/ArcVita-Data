candidates:
- name_zh: 曹翰
  score: 9
  worth_why: 缘起周太祖奇之、佐世宗侍疾得用；平西蜀击全师雄、缓更破吕翰、屠江州贪掠沉舰运宝；螃蟹失所援将至之谶应验；晚年私市兵器被鞫流登州、作退将诗得赐；阴狡贪酷正反教训俱全，生卒卒年六十九可考
  era: 五代末至宋初
  dates_known: true
- name_zh: 杨信
  score: 7
  worth_why: 瘖疾掌禁旅以童奴书掌传意指挥有序，夜捕杜廷进谋乱，太祖目送称真忠臣；聋哑忠臣治军独特事例，卒年前后事迹系年清晰
  era: 五代末至宋太宗初
  dates_known: true
- name_zh: 党进
  score: 7
  worth_why: 逐杨业隍中救援、不识字举梃示兵数、纵鹰骂饲禽兽、食蛇而亡等名场面密集；朴直与变诈并存，人物鲜活，卒年五十一可考
  era: 五代末至宋太宗初
  dates_known: true
- name_zh: 李汉琼
  score: 7
  worth_why: 征江南作浮梁牛渚济大军、纵火攻秦淮水砦；攻太原先登矢集其脑力疾战、极谏万乘勿冒矢石；完整战功周期可考
  era: 五代末至宋太宗初
  dates_known: true
- name_zh: 杨嗣
  score: 6
  worth_why: 与延昭并称二杨、廉良斩首二千、让官于延昭、城坏致败等有一定做事周期与让贤佳话，但事迹多为巡边战守条目，深度稍逊
  era: 宋太祖至真宗朝
  dates_known: true
