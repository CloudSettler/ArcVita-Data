  lifespan:
    birth:
      date: '912'
      precision: year
      is_circa: true
      raw: 年七十（卒于太平兴国六年六月，逆推约912年）
  era: 五代至宋初
  reign_ref: 后晋、后汉、后周、宋太祖、宋太宗
  archetype: 宰相·宽简守正的救弊能臣
  dilemmas:
  - 史弘肇威权震主之际，敢疑冤狱并平反，能否顶住权臣之怒
  - 卢多逊事发时同为宰相，是否牵连、如何自处
  lesson: 为相任宽简、不好苛察，救冤全活、守道始终者得善终配享
  summary_first_person: 我由进士入仕，历事晋汉周宋四朝。史弘肇部吏诬民犯盐禁，我召诘平反，虽忤权要无所屈。宋初知朗州，监军欲诛千余僧为盗党，我缓其事灭贼擒帅，僧皆得全。后招集河南饥民四万家复业，监修五代史，凡居相位十八年，恩遇不替，终于丹砂中毒暴卒，谥文惠，配飨太祖庙庭。
  source_urls:
  - 史藏/正史/宋史/卷264.md
