source: 史藏/正史/宋史/卷265.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 李昉
  score: 7
  worth_why: 两入中书为相；监修太祖实录、主持文馆，为《太平广记》《文苑英华》主事之先声；荐贤恩归于上的治术有名场面；淳化旱蝗待罪、雍熙谏籍民兵皆见做事周期；晚年欲仿洛中九老会而因蜀寇罢，足为轶事
  era: 五代末至北宋初
  dates_known: true
- name_zh: 李宗谔
  score: 7
  worth_why: 耻以父荫得官独由乡举登第；知贡举外审定太常乐署奏斥谬滥乐工五十人、条上利病二十事并著《乐纂》，礼乐制度振兴有名场面；从幸大名上疏论选将帅事见其兵事识见；馆伴契丹刊定宾仪
  era: 北宋初
  dates_known: true
rejections:
- name_zh: 李宗讷
  why_not: 传文简短，仅以荫补官、预修医方、习典礼等零散事，无完整做事周期与名场面，卒年五十五止
- name_zh: 李超
  why_not: 李昉养父，仅见世系交代无事迹
- name_zh: 李崧
  why_not: 汉末被诛，正文无其做事流，仅作宗族背景
- name_zh: 李璨
  why_not: 仅因李昉讼父冤得官一事，事迹单薄
- name_zh: 卢多逊
  why_not: 本卷仅见其谮昉事一面之词，非其本传，做事流不可考于此文献
