candidates:
- name_zh: 马知节
  score: 8
  worth_why: 将家子以严莅众，君子馆备战先见；定远军省漕粟五十万斛；彭州三百羸兵力战李顺十万众，横槊溃围复鼓噪入；方井镇急击刘旰歼之；知秦州遣归质羌感化不犯塞；知延州上元张灯退敌；真定移书诮王超促出兵；澶渊之盟后直言天下虽安不可忘战去兵，面诋王钦若不屈；忠勇智谋正直一生
  era: 北宋太祖至真宗朝
  dates_known: true
- name_zh: 雷有终
  score: 7
  worth_why: 少年抗言愿任大郡狱掾不畏侯陟；发刘祺奸赃代知监事；领茶盐制置使便宜裁制救私贩陷辟之民；平李顺之乱规画戎事有节制；父子同日受诏转运使为搢绅荣之
  era: 北宋太宗真宗朝
  dates_known: true
- name_zh: 雷德骧
  score: 6
  worth_why: 强直敢言直诣讲武殿劾赵普擅增刑名遭贬；子有邻击登闻鼓诉中书不法致赵普出镇；主京朝官考课立惩劝之法；性褊躁多忤物终被保全，刚直之鉴
  era: 北宋太祖太宗朝
  dates_known: true
- name_zh: 马全义
  score: 6
  worth_why: 征李筠攀堞先登飞矢贯臂拔镞临敌遂克泽州；河中夜袭周祖垒见赏于周世宗；三十八早卒，死事壮烈可为八子知节之缘起
  era: 五代末宋初
  dates_known: true
