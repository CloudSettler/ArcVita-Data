candidates:
- name_zh: 陈执中
  score: 7
  worth_why: 三朝宰辅，真宗朝进演要早定储位；西夏寇边时上攻守方略、焚水草绝寇资、违诏城傅海诸州；平王伦之乱；相八年拒私请。然阿附张贵妃治丧非礼、治家不严致御史合劾罢相，谥荣灵之议可为后人教训
  era: 北宋真宗仁宗朝
  dates_known: true
- name_zh: 刘沆
  score: 8
  worth_why: 断积年大狱、破尹氏伪券夺田二十年沉冤；湖南招降蛮徭二千余；为相陈三弊革保荐、陈权、叙劳之弊，直指台谏专务抉人阴私之弊；享年虽短做事流完整，且豪率任数遭论者讥，可作正反教材
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 冯拯
  score: 5
  worth_why: 书生谒赵普得奇赏；伏阁请立太子贬岭外而复起至相位；嗣后事迹本卷残缺
  era: 北宋太宗真宗朝
  dates_known: true
rejections:
- name_zh: 陈世儒
  why_not: 仅载其妻与群婢杀嫡母弃市事，无做事周期
- name_zh: 刘瑾
  why_not: 仅附见其父传，坐法免官后又复职，事迹简略
- name_zh: 尹氏
  why_not: 地方大姓夺田案反派，无独立传主价值
