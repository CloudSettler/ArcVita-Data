candidates:
- name_zh: 尹洙
  score: 9
  worth_why: 力振古文与穆修共开北宋古文运动先声；作《叙燕》《息戍》论兵制边费为御戎长策；范仲淹被贬时自认朋党不苟免；西夏战事中数上疏论兵、好水川之败后擅发兵赴救被贬又作《悯忠》《辨诬》；上疏直言命令数更、恩宠过滥、赐予不节三弊；水洛城之争与狄青械刘沪终致文致之罪；一生起落完整可为文人论兵干政之典范与教训
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 孙甫
  score: 6
  worth_why: 佐杜衍得谓益友；监益州交子务涉世界最早纸币制度；本卷传文后段残缺，做事流仅见片段
  era: 北宋仁宗朝
  dates_known: true
