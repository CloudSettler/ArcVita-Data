- name_zh: 司马池
  score: 8
  worth_why: 官历完整且多次关键抉择：斥曹利用自输马价以令行、独不附会皇甫继明浮报、闻母丧恸归不欺心、预判开㟏口道山水之患；曾预言刘平必败；不为私怨报复劾者，人称长者
  era: 北宋真宗仁宗朝
  dates_known: true
- name_zh: 司马旦
  score: 8
  worth_why: 断蔺氏十年积讼、劝富出粟平粜弭盗荒政、谏王安石开运河役夫不得其详后若其言、劝弟司马光就门下侍郎之召以大义成其进退之正；一生治郡有体、澹薄交友有信
  era: 北宋仁宗至哲宗元祐
  dates_known: true
- name_zh: 梅挚
  score: 7
  worth_why: 上《变戒》引《洪范》谏灾异、论李用和无功拜使相慎名器、奏缓借贷督偿救二浙饥民、河大涨夜督工完堤；言事有体为人称
  era: 北宋仁宗庆历前后
  dates_known: true
- name_zh: 彭乘
  score: 6
  worth_why: 辞官乞侍养为孝、蜀人得守乡郡自乘始、在普州兴学教育子弟、勒兵备贼使田忠霸之党自斩之、聚书万余卷手自刊校惠及蜀中
  era: 北宋真宗仁宗朝
  dates_known: true
