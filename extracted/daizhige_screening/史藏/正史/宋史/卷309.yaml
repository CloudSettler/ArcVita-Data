candidates:
- name_zh: 杨允恭
  score: 9
  worth_why: 少年率乡兵拒贼被擒计脱；掌市舶、平海贼叶氏五百众、毁幕弩破江海巨寇、建南安军理盐政，做事周期完整、名场面多，堪为能吏典范
  era: 北宋初
  dates_known: true
- name_zh: 张质
  score: 7
  worth_why: 潜计兵数无误于军籍留滞之际；考选枢吏重实绩，暮年转都承旨纂《兵要》称善，廉谨端悫可为职业官僚范
  era: 北宋初
  dates_known: true
- name_zh: 程德玄
  score: 7
  worth_why: 太祖大渐之夕随王继恩迎太宗即位（涉及太宗即位疑云）；渡淮遇风雷惧独以君命在身祝酒而行；然坐矫制贩鬻见贬，兼范例与教训
  era: 北宋初
  dates_known: true
- name_zh: 王延德
  score: 6
  worth_why: 出使高昌历沙碛万里撰《西州程记》献、足迹可考；然缔造于求免掌庾攀附，倾险好进时人恶之，可作教训
  era: 北宋初
  dates_known: true
- name_zh: 王延德
  score: 6
  worth_why: 历典五印而恳让二印、所至撰集《司膳录》《南郊录》诸书又上《太宗南宫事迹》，史料保存有价值但事业流平缓
  era: 北宋初
  dates_known: true
