- name_zh: 蔡襄
  score: 9
  worth_why: 作四贤一不肖诗名动天下；知谏院直言听谏用谏之辨；谏罢舍利复营；泉州万安渡立石为梁种蛎固基植松七百里，惠泽闽人；书法当时第一却拒书温成碑；遭谗不自辨，做事流完整且名场面多
  era: 北宋仁宗英宗朝
  dates_known: true
- name_zh: 王素
