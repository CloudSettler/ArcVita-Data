  worth_why: 知谏院谏省无名之费、阻进秩赏军；迫真宗之子遣出二女；蒋偕筑堡败而不罪反使其毕力自效；渭州拓城积粟训弓箭手；传寇至下令称寇者斩终证为妄，决断教益鲜明
  era: 北宋仁宗至熙宁
