  worth_why: 弹梁适刘沆二相、驳刘恢奸狱、抗青苗法拒使者；治峨眉废淫祠、为政廉简，谏官行事周期完整
  era: 北宋仁宗至神宗朝
  dates_known: false
- name_zh: 吴择仁
  score: 8
