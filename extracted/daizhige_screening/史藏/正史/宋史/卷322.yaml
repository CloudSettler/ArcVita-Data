  era: 北宋哲宗徽宗朝
  dates_known: false
- name_zh: 何郯
  score: 7
  worth_why: 碎首谏之问对答成名言；挫夏竦谗谋、抑张尧佐、论君臣交疑治乱之本，直声著于三院；惜晚节回畏成教训
  era: 北宋仁宗至神宗朝
  dates_known: false
- name_zh: 陈荐
  score: 7
  worth_why: 拒诬人自贳、请缓河役恤民力、言李定匿丧；韩琦称廉于进勇于退，可为士人立身之范
  era: 北宋仁宗至神宗朝
  dates_known: false
- name_zh: 王猎
  score: 6
  worth_why: 散财养志、立孔子庙兴山邑之学、谏濮王称礼以礼事王；事迹温和但周期较短
  era: 北宋仁宗至神宗朝
  dates_known: false
