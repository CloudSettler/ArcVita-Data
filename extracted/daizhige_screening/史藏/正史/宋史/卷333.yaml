  era: 北宋中期
  dates_known: true
- name_zh: 俞充
  score: 7
  worth_why: 提举沿汴淤田得腴田八万顷；倡西征夏国策惜未行而暴卒，是宋夏战争战略关键人物
  era: 北宋神宗朝
  dates_known: true
- name_zh: 李兑
  score: 6
  worth_why: 在言职十年谏狄青监军事、的任务是广州清节；断井尸案辨贿吏之弊，治理有方
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 张掞
  score: 6
  worth_why: 知益都为石介著《息民论》请以为天下法；劾宦官阎士良维护帅权，孝行治绩俱著
  era: 北宋中期
  dates_known: true
- name_zh: 杨蕴
  score: 5
  worth_why: 契丹游骑至而拔刀守城止民弃城，事迹简略仅附见其子传
