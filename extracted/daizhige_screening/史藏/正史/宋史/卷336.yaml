person:
  qid: guji-司马光
  name_zh: 司马光
  names:
    zh: 司马光
    en: Sima Guang
  lifespan:
    birth:
      date: 1019
      precision: year
      is_circa: false
      raw: 生于天禧三年
    death:
      date: 1086
      precision: year
      is_circa: false
      raw: 卒于元祐元年
  birth_date: 1019
  death_date: 1086
  era: 北宋
  reign_ref: 宋仁宗、宋英宗、宋神宗、宋哲宗
  archetype: 直谏老臣与制度性做事者
  dilemmas:
  - 廷争变法与国本，为直言不惜得罪权臣
  - 历十四年成《资治通鉴》，长期主义对抗速成诱惑
  lesson: 破瓮救童见临机之智，面折安石见守正之骨，作通鉴见积久之功
  summary_first_person: 我七岁破瓮救人，一生直言敢谏，尽于仁明武、官人信赏必罚六言。神宗用安石行新法，我力争祖宗之法不可变而摈不用，遂退归洛阳，绝口不言政事，以十九年之力完成《资治通鉴》二百九十四卷。哲宗立，我再起为相，尽罢新法，终身不改其守。
  source_urls:
  - docs/YAML_STANDARD.md
