- name_zh: 陈次升
  score: 7
  worth_why: 三居言责敢言不苟合，劾章惇蔡卞时拒利诱，护元祐诸贤，能遏吕升卿之行，做事周期完整可为谏官典范
  era: 北宋中后期
  dates_known: true
- name_zh: 陈师锡
  score: 8
  worth_why: 苏轼得罪时独出饯之安辑其家；预断蔡京用则天下治乱自分；与陈瓘同论京卞号二陈，坐党不悔，义气与先见兼备
  era: 北宋中后期
  dates_known: true
- name_zh: 彭汝砺
