source: 史藏/正史/宋史/卷365.md
category: 史藏/正史/宋史
person:
  qid: guji-岳飞
  name_zh: 岳飞
  names:
    zh: 岳飞
    en: Yue Fei
  lifespan:
    birth:
      date: '1103'
      precision: year
      is_circa: true
      raw: 生于相州汤阴，传文未明记年
    death:
      date: '1142'
      precision: year
      is_circa: false
      raw: 绍兴十一年岁末遇害（传文此卷未及，据史补）
  birth_date: '1103'
  death_date: '1142'
  era: 南宋初
  reign_ref: 宋高宗绍兴年间
  archetype: 精忠名将
  dilemmas:
  - 中原不可弃而朝廷欲南守，直谏忤旨夺官
  - 密旨令屠虔城，三请诛首恶赦胁从
  - 军粮将尽时纵谍惑敌，险中取胜
  lesson: 运用之妙存乎一心；治军严而爱民，岳家军秋毫无犯；功败于朝议非战之罪
  summary_first_person: 我从应募敢战士起家，以谋定用兵，收襄阳六郡，大破金与伪齐，军称岳家军；惜乎恢复之功终毁于和议。
  source_urls:
  - 宋史卷三百六十五
endeavors:
- id: guji-岳飞-endeavor-1
  name_zh: 从军抗金至收复建康
  phases:
  - key: brewing
    name_zh: 效用敢战
    labels:
      zh:
      - 首战破贼
    start_date: '1122'
    highlight_event_id: guji-岳飞-event-1122-yingmu
  - key: breakthrough
    name_zh: 滑南扬名
    labels:
      zh:
      - 独骑斩枭将
    start_date: '1126'
    highlight_event_id: guji-岳飞-event-huanan
  - key: climax
    name_zh: 屡破兀术
    labels:
      zh:
      - 牛头山设伏
    start_date: '1130'
    highlight_event_id: guji-岳飞-event-jiankang
  - key: closure
    name_zh: 转战江淮
    labels:
      zh:
      - 通泰殿后护民
    start_date: '1131'
    highlight_event_id: guji-岳飞-event-nanbaqiao
  decisions:
  - date: '1127'
    title_zh: 越职上书请北渡复中原
    rationale: 乘敌怠与勤王师集，欲亲率六军北渡；虽以越职夺官归，其志不改
- id: guji-岳飞-endeavor-2
  name_zh: 平盗安民与讨杨么曹成
  phases:
  - key: brewing
    name_zh: 破王善曹成
    labels:
      zh:
      - 南薰门以八百破五十万
    start_date: '1130'
    highlight_event_id: guji-岳飞-event-nanxunmen
  - key: breakthrough
    name_zh: 招降张用
    labels:
      zh:
      - 一书降数万
    start_date: '1131'
    highlight_event_id: guji-岳飞-event-zhangyong
  - key: climax
    name_zh: 讨曹成定岭表
    labels:
      zh:
      - 设谋破蓬头岭
    start_date: '1132'
    highlight_event_id: guji-岳飞-event-chacheng
  - key: closure
    name_zh: 平虔吉盗与营田之议
    labels:
      zh:
      - 手书精忠岳飞
    start_date: '1133'
    highlight_event_id: guji-岳飞-event-jingzhong
  decisions:
  - date: '1133'
    title_zh: 三请改密旨屠虔城为诛首恶赦胁从
    rationale: 全隆祐震惊之后人心，帝乃曲赦，民绘像祠之
- id: guji-岳飞-endeavor-3
  name_zh: 北伐恢复襄阳六郡
  phases:
  - key: brewing
    name_zh: 先取六郡定基本
    labels:
      zh:
      - 襄阳为恢复基本
    start_date: '1134'
    highlight_event_id: guji-岳飞-event-vousi
  - key: breakthrough
    name_zh: 克郢复随
    labels:
      zh:
      - 不擒贼不涉此江
    start_date: '1134'
    highlight_event_id: guji-岳飞-event-yingzhou
  - key: climax
    name_zh: 大破李成复襄阳
    labels:
      zh:
      - 长枪破骑骑兵踏步
    start_date: '1134'
    highlight_event_id: guji-岳飞-event-xiangyang
  - key: closure
    name_zh: 上营田策
    labels:
      zh:
      - 候粮足即过江
    start_date: '1134'
    highlight_event_id: guji-岳飞-event-yingtian
  decisions:
  - date: '1134'
    title_zh: 奏请先取襄阳六郡除心膂之病
    rationale: 六郡为恢复中原基本，得赵鼎力赞，遂受命北进
events:
- id: guji-岳飞-event-birth
  year_of: '1103'
  date: '1103'
  title_zh: 生于相州汤阴
  detail: 生时有大禽若鹄飞鸣室上，因以为名；弥月河决，母姚抱之坐瓮冲涛得免
  type: birth
- id: guji-岳飞-event-1122-yingmu
  year_of: '1122'
  date: '1122'
  title_zh: 应募敢战士，设伏擒陶俊贾进和
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-1
  content: 伪商诱贼、山下设伏、阳北诱敌，百骑灭剧贼
- id: guji-岳飞-event-huanan
  year_of: '1126'
  date: '1126'
  title_zh: 滑南独驰迎敌斩枭将
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-1
  content: 敌猝至，趁其未定击之，斩舞刀枭将，敌大败
- id: guji-岳飞-event-jiankang
  year_of: '1130'
  date: '1130'
  title_zh: 牛头山设伏夜扰金营，复建康
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-1
  content: 百人黑衣混营，金兵自相攻击；新城大破兀术，静安再捷
- id: guji-岳飞-event-nanxunmen
  year_of: '1130'
  date: '1130'
  title_zh: 南薰门八百破五十万贼
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-2
  content: 左挟弓右运矛横冲其阵，贼乱大败
- id: guji-岳飞-event-zhangyong
  year_of: '1131'
  date: '1131'
  title_zh: 一书招降张用
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-2
  content: 张用得书曰果吾父也，遂降
- id: guji-岳飞-event-chacheng
  year_of: '1132'
  date: '1132'
  title_zh: 佯退误谍破曹成蓬头岭
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-2
  content: 八千破十余万，诛酋抚众，岭表平
- id: guji-岳飞-event-jingzhong
  year_of: '1133'
  date: '1133'
  title_zh: 帝手书精忠岳飞制旗以赐
  type: milestone
  endeavor_ref: guji-岳飞-endeavor-2
  content: 授镇南军承宣使江南西路沿江制置使
- id: guji-岳飞-event-vousi
  year_of: '1134'
  date: '1134'
  title_zh: 奏先取襄阳六郡
  type: decision
  endeavor_ref: guji-岳飞-endeavor-3
  content: 除兼荆南鄂岳州制置使
- id: guji-岳飞-event-yingzhou
  year_of: '1134'
  date: '1134'
  title_zh: 渡江誓师克郢州
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-3
  content: 飞不擒贼不涉此江；京超投崖死
- id: guji-岳飞-event-xiangyang
  year_of: '1134'
  date: '1134'
  title_zh: 襄江大破李成复襄阳
  type: endeavor
  endeavor_ref: guji-岳飞-endeavor-3
  content: 以长枪步卒击其骑兵，以骑兵击其步卒，成夜遁
- id: guji-岳飞-event-yingtian
  year_of: '1134'
  date: '1134'
  title_zh: 上营田策
  type: decision
  endeavor_ref: guji-岳飞-endeavor-3
  content: 候粮足即过江北剿敌，营田之议自是兴
- id: guji-岳飞-event-death
  year_of: '1142'
  date: '1142'
  title_zh: 蒙冤遇害
  type: death
  content: 本卷传文止于四年北伐，据史补绍兴十一年岁末被害于风波亭
