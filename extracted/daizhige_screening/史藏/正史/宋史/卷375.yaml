  year_of: '1126'
  name_zh: 奉命赴金营留五十日
  detail: 密觇金国帛赐均与将士之数，知其兵约八万，归奏金人不足畏谏立功赏一司
- id: guji-邓肃-event-cui
  type: career
  date: '1127'
  year_of: '1127'
  name_zh: 拒伪楚而奔赴南京擢左正言
  detail: 张邦昌僭位，肃义不屈，入谏垣三月凡抗二十疏
- id: guji-邓肃-event-sanzheng
  type: career
  date: '1127'
  year_of: '1127'
  name_zh: 请分三等定受伪命诸臣之罪
  detail: 围城中知名诸臣分上中下三等定罪，上以为然
- id: guji-邓肃-event-heng
  type: career
  date: '1127'
  year_of: '1127'
  name_zh: 劾耿南仲父子误国
  detail: 南仲尝荐肃，肃不恤私恩直言其沮渡河遏勤王，上嘉其直赐五品服
- id: guji-邓肃-event-fanneng
  type: career
  date: '1127'
  year_of: '1127'
  name_zh: 论罢留守范讷
  detail: 斥其两河望风先遁，战无卒守无粮不降则走，讷遂罢
- id: guji-邓肃-event-ligang
  type: career
  date: '1127'
  year_of: '1127'
  name_zh: 上疏救李纲罢归
  detail: 言纲两河措置之功不可一日而废，执政怒，送吏部罢归居家
