candidates:
- name_zh: 陈俊卿
  score: 9
  worth_why: 南宋名相，做事流完整：进士登第、辅导普安郡王（孝宗）、力保张浚北伐议和之争、整浙西水军助李宝胶西之捷、拒外戚曾觌龙大渊干政、藏诏救刘珙、位至左右相；名场面多，如「冬日无云而雷」劾汤思退、或诈传上旨必诛王琪、遗表勿请谥树碑，正邪分明可为后人典范，生卒年可考（1138进士至1175后）
  era: 南宋孝宗朝
  dates_known: true
