  score: 9
  worth_why: 阻建王将兵免夺嫡之祸；力主先备御反对轻率北伐；为岳飞赵鼎平反；以德报怨荐莫济陆九渊叶适等十五人；宽厚宰相典范
  era: 南宋孝宗朝
  dates_known: true
