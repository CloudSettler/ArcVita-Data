- name_zh: 徐谊
  score: 8
  worth_why: 平反歙县冤狱、策动绍熙内禅定策安邦；后预见韩侂胄为国患而遭贬，仍勉力经略淮甸擅防金兵；忠奸之辨责赵汝愚一语成格言；做事流完整
  era: 南宋孝宗至宁宗时期
  dates_known: true
- name_zh: 吴猎
  score: 9
  worth_why: 张栻朱熹门下湖湘学派表率；逆党禁直谏不惧；开禧北伐时先料金兵出荆襄，修高氏三海布四匮限戎马，解襄阳德安之围，荐拔董逵孟宗政等名将；治蜀画像祠之；做事流完整且名场面多
  era: 南宋孝宗至宁宗时期
  dates_known: true
- name_zh: 项安世
  score: 7
  worth_why: 应诏上书论量赋制用、省兵省宫掖之重本轻末论，为宋史名疏；不俟朝命径遣兵解德安之围；卷入党禁与吴猎恩怨被斩幕官，成败教训并存
  era: 南宋孝宗至宁宗时期
  dates_known: true
- name_zh: 薛叔似
  score: 5
  worth_why: 开禧北伐任湖广宣抚使，传文起笔而事迹于本卷不全
  era: 南宋中期
