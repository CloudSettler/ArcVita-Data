source: 史藏/正史/宋史/卷403.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 赵方
  score: 9
  worth_why: 儒生帅边十年，以战为守，枣阳大捷破金十万，合官民兵为一体，拔扈再兴孟宗政于土豪；名言催科不扰是催科中抚字；临终立纪纲报国，燕赵多奇士之典范
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 贾涉
  score: 8
  worth_why: 收编节制山东忠义军主胜客、传檄中原取复十余州；预判李全之骄为后忧而弥远不听；为父申冤十年伏阙，做事与教训兼备；惜最终被贾似道光环牵连
  era: 南宋宁宗理宗间
  dates_known: true
- name_zh: 扈再兴
  score: 7
  worth_why: 被发肉袒徒跣挥双刃入阵的猛将，设伏团山血肉枕藉，铁蒺藜破敌、枣阳解围掎角追击，战术名场面多；出身土豪终成方面藩屏，惜传文后半残缺、无生卒年
  era: 南宋宁宗朝
  dates_known: false
rejections:
- name_zh: 孟宗政
  why_not: 本卷仅随赵方传提及，无独立立传，事迹不完整，其自有专卷再录
- name_zh: 赵范赵葵
  why_not: 传云有传别卷，本卷无做事周期可抽
- name_zh: 史弥远赵雄吴挺郭杲
  why_not: 仅作背景人物无独立事迹
- name_zh: 李全
  why_not: 传明言见李全传，本卷非其本传
- name_zh: 张惠时青石珪夏全季先沈铎
  why_not: 附贾涉传的忠义军将领，片段无完整做事流
