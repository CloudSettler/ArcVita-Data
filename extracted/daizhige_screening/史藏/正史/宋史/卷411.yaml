- name_zh: 牟子才
  score: 9
  worth_why: 终代理宗名臣，师承朱熹一脉；坚拒改谪词，腕可断词不可改；力谏罢经界、防蜀三屯之策、谏幸西湖、争济王立后；与史弥远、史嵩之、郑清之、贾似道、董宋臣数代权幸相抗而直声不衰，做事周期完整且多关键决策
  era: 南宋宁宗至理宗朝
  dates_known: true
- name_zh: 蒋重珍
  score: 8
  worth_why: 嘉定十六年状元；本心外物界限之论进《为君难》六箴；以周勃霍光归政喻权相柄国，临安大火应诏直谏震动君心；屡辞恩禄力抗柄臣， modo直臣典范
  era: 南宋理宗朝
  dates_known: true
- name_zh: 汤璹
  score: 6
  worth_why: 直声闻时，疏请追召朱熹还讲职；临安大火制词持大体不阿曲有清风峻节之誉；择壻得状元蒋重珍；然传文较简做事流偏薄
  era: 南宋孝宗至宁宗朝
