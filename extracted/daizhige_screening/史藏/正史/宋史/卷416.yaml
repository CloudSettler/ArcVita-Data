candidates:
- name_zh: 余玠
  score: 10
  worth_why: 建招贤馆纳冉氏兄弟，徙城钓鱼山筑山城防御体系十余城，夜斩「王夜叉」王夔整军纪，手挈全蜀还本朝，山城之策奠定钓鱼城抗蒙根基
  era: 南宋末
  dates_known: true
- name_zh: 吴渊
  score: 8
  worth_why: 平乱捕盗、荒政全活者累百万计、创三大砦二十二小砦屯田守边，拜参知政事；然政尚严酷兴罗织之狱有「蜈蚣」之谣，为后世双面教训
  era: 南宋末
  dates_known: true
rejections:
- name_zh: 冉琎
  why_not: 献徙城之计后并入余玠主线，无独立完整做事流
- name_zh: 冉璞
  why_not: 同上，功归钓鱼城筑城事由余玠承之
