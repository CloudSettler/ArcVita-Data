- name_zh: 李燔
  score: 8
  worth_why: 从朱熹学以弘名斋；单骑往谕平洞寇，言寇皆吾民激之使然；力争会子抑藏之弊令即弛禁；创社仓贷佃农；讲学白鹿书院学者云集，学禁中率同门会葬不畏党禁
  era: 南宋
