- name_zh: 黄干
  score: 9
  worth_why: 朱熹衣钵传人，雪夜不衣二月求师；知汉阳行荒政、知安庆不俟朝命即日筑城备战，后金人破诸关独安庆无虞，民谓生汝者黄父；力言边防对策不用，果如其言；晚岁归里讲学编礼
  era: 南宋
