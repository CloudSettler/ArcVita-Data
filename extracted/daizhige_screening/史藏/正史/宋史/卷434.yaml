- name_zh: 蔡元定
  score: 9
  worth_why: 伪学之禁遭贬道州，杖履三千里不挫其志，执手笑相别；朱熹惊叹此吾老友也，共订四书启蒙，教书不辍，成后世气节典范
  era: 南宋
  dates_known: true
- name_zh: 刘子翚
  score: 8
  worth_why: 承父靖康殉国之痛，守兴化退寇，辞官归武夷十七年讲学，以《易》不远复三言授朱熹，开一代儒宗
  era: 南宋
  dates_known: true
- name_zh: 陆九龄
  score: 8
  worth_why: 文事武备一说最为精彩，独尊程学于禁学之世，主义社御茶寇调度有法，治家如朝廷，惜早卒
  era: 南宋
  dates_known: true
- name_zh: 蔡沈
  score: 7
  worth_why: 受父师双托数十年成《尚书传》，徒步护丧千里、躬耕不仕拒荐举，成吾书者沉也的兑现
  era: 南宋
  dates_known: true
