- name_zh: 柳开
  score: 9
  worth_why: 少年挥剑逐盗；倡韩柳古文开宋文风气之先；识破契丹无约请和之谋；招抚粟氏五百口定边；为民抗命罢运粮；上疏言边防与官制改革，做事流完整且有多个名场面
  era: 五代末至宋真宗初
  dates_known: true
- name_zh: 宋准
