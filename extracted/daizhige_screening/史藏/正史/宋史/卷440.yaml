  worth_why: 覆试复擢甲科；奉使契丹称旨；修诸道图经；为李穆辩白使其复官，时论称之，晋宋二忠于一身
  era: 北宋初
  dates_known: true
- name_zh: 高𬱖
  score: 6
  worth_why: 在魏三十年无一人言其非；计口受费余皆不纳；老马以糜饲之、待仆如初的长者典范，但其事主要是德行记录而非做事流
  era: 五代至宋初
  dates_known: false
- name_zh: 李度
  score: 6
