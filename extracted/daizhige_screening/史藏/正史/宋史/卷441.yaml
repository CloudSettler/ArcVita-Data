verdict: has_candidates
candidates:
- name_zh: 徐铉
  score: 9
  worth_why: 历仕吴南唐入宋三朝；金陵围城时自请赴宋营缓兵，忠直不阿；校勘《说文》奠定文字学功业；奉诏军中书诏援笔立就
  era: 五代末至宋初
  dates_known: true
- name_zh: 吴淑
  score: 7
  worth_why: 参修《太平御览》《文苑英华》三大书；上言闰年图归职方掌管，影响宋代地图制度；撰《事类赋》三十卷；乱后收养宗族孤女显其义
  era: 宋初
  dates_known: true
- name_zh: 许洞
  score: 7
  worth_why: 弃武习文复兼韬略，撰兵书《虎钤经》二十卷； 题《酒歌》于酒家免债的名士轶事；狂狷得罪权贵而坎壈一生
  era: 北宋咸平景德间
  dates_known: true
- name_zh: 黄夷简
  score: 6
  worth_why: 由吴越归宋掌名表得体；但讹诈驸马索钱焚诗遭士林鄙薄，可作反面教训
  era: 吴越末至宋真宗朝
  dates_known: true
rejections:
- name_zh: 陈充
  why_not: 仕宦平流直叙，仅著论反牛僧孺一条，做事流简略
- name_zh: 舒雅
  why_not: 与吴淑齐名而事迹笼统，优游山水无关键决策
- name_zh: 卢稹
  why_not: 早卒年仅二十七，著书未显于世，周期不完整
- name_zh: 谢炎
  why_not: 传文仅数行，慕韩柳为文而已，无可考名场面
