  worth_why: 靖康死节全流程：面斥粘罕、屡献破敌策不果、暗中Layout数万义军欲攻金营、谋杀范琼起兵事泄骂贼引颈受刃，做事流完整且有逆转名场面
  era: 北宋末
  dates_known: true
- name_zh: 赵士嶐
  score: 9
  worth_why: 弃科举从军，九江保卫战募死士夜击退贼数十里，守城百余日食尽拒伪职骂贼仰药死，遗书诸子雪耻，忠义范式完整
  era: 两宋之交
  dates_known: true
- name_zh: 景思立
  score: 8
  worth_why: 从治平砦小官到定河州名将，踏白城轻敌冒进致败，力尽欲自刭谢朝廷再战而死，帝以轻敌不赠官，成败教训俱备
  era: 北宋神宗朝
  dates_known: true
- name_zh: 高敏
  score: 7
  worth_why: 破白豹金汤、声东击西预警夏人三十万入寇、开通路且战且前中流矢死，边将实话与先见之明可鉴
  era: 北宋中后期
  dates_known: true
- name_zh: 蒋兴祖
  score: 7
  worth_why: 露宿堤上四十日保阳武堤不坏，金兵至拒绝走避曰吾世受国恩，死守城池力战死，治绩与气节兼备
  era: 北宋末
  dates_known: true
- name_zh: 王奇
  score: 7
  worth_why: 武举出身平懿洽州降舒光贵缚元猛，轻出致败后骂大丈夫当尽节战死，胜败两面皆有做事细节
  era: 北宋中后期
  dates_known: true
- name_zh: 郭浒
  score: 7
  worth_why: 渭帅以下皆叛降独拒，系狱胁降不屈呼大丈夫今得死所，忠烈教训突出
  era: 南宋初建炎
  dates_known: true
