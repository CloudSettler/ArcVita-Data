candidates:
- name_zh: 曾孝序
  score: 9
  worth_why: 直抗蔡京聚敛之政，民为邦本名言传世；缮城积谷抗金；年七十九骂贼被害，忠直与勇毅兼备
  era: 北宋末
  dates_known: true
- name_zh: 孙昭远
  score: 9
  worth_why: 靖康建炎间收溃卒、合诸道兵十万入援，二十八疏劾逗留帅臣；守洛阳骂叛兵遇害，做事流完整
  era: 北宋末南宋初
  dates_known: true
- name_zh: 高永年
  score: 8
  worth_why: 取青唐复湟鄯之役实际谋主，作《元符陇右录》主战；却因信任降羌被执杀，成功而以谋身死，教训深刻
  era: 北宋末
  dates_known: true
- name_zh: 薛庆
  score: 8
  worth_why: 群盗起家受抚守高邮，能以少击众、分牛于民；孤骑百余驰援扬州而郭仲威置酒不至，被获杀，忠勇与遇人不淑成对照
  era: 南宋初
  dates_known: true
- name_zh: 项德
  score: 8
  worth_why: 一郡卒率败亡百人据城隍祠，二月讫五月大小百余战敌号项鹞子，出为选锋入为殿后，战死黄姑岭，民事迹极有场面
  era: 北宋末
  dates_known: true
- name_zh: 宋昌祚
  score: 7
  worth_why: 权领和州军务坚守数日，军士胡广发弩中兀术左臂，城破阖门死节，对抗金主力的硬仗场面
  era: 南宋初
  dates_known: true
- name_zh: 李政
  score: 7
  worth_why: 守冀州御金有法，夜捣敌砦财物尽散士卒，号令明赏罚信，治军方法论可鉴
  era: 北宋末
  dates_known: true
- name_zh: 鞠嗣复
  score: 7
  worth_why: 方腊胁降不惧，修城立门有备；贼感其善政不忍杀，善政得报的罕见样本
  era: 北宋末
  dates_known: false
- name_zh: 王士言
  score: 7
  worth_why: 西北立战功解嘉兴之围，又防秋泽州守至城陷巷战死，南北两线尽瘁
  era: 北宋末
  dates_known: false
- name_zh: 宋旅
  score: 7
  worth_why: 遣妻子归闽独与民据守剡县，冒矢石力战殉城，孤县抗方腊的气节样本
  era: 北宋末
  dates_known: false
rejections:
- name_zh: 鞠嗣复以外宋旅 following 各死节传主如丁仲修、赵伯振、孙晖、李靓、杨照、丁元、祝公明
  why_not: 事迹仅一段战死记录，无完整做事周期，作忠义坐标可缓录
