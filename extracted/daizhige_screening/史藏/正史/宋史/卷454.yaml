candidates:
- name_zh: 赵时赏
  score: 8
  worth_why: 文天祥麾下参议军事，数以偏师当一面战比有胜；空坑兵败被执，斥同列「军行如春游」，被执时以「小小签厅官」掩护僚属脱身，己不屈而死；有完整做事流与名场面
  era: 南宋末
  dates_known: true
- name_zh: 邹㵯
  score: 8
  worth_why: 从文天祥勤王，聚兵数万，复兴国、永丰二县，累进兵部侍郎；永丰败后再战脱身，天祥被执后自杀；做事流完整，气节可歌
  era: 南宋末
  dates_known: true
- name_zh: 陈羍
  score: 8
  worth_why: 从谢枋得起兵，斩乡人安仁令李景并拒二万家赀赎罪，后有「普天之下莫非王土」名言；两度起兵败而自刭死；著有《鹤心集》
  era: 南宋末
  dates_known: true
- name_zh: 刘子荐
  score: 8
  worth_why: 平反冤狱救死囚八人事闻天下；静江保卫战书笏「我头可断膝不可屈」，瘗袍死守；做事流完整且两句名场面
  era: 南宋末
  dates_known: true
- name_zh: 黄申
  score: 7
  worth_why: 县令率僚署降状时独抗不往、阳死拒降，惠爱在民得免，最终隐巴山以终；非典型死节而有独特决断
  era: 南宋末
  dates_known: true
- name_zh: 钟季玉
  score: 7
  worth_why: 为政有能，半年减和籴三分之一；穷治大胥贿赂不阿前使；北兵至不屈死；做事流较完整
  era: 南宋末
  dates_known: true
- name_zh: 耿世安
  score: 7
  worth_why: 众犹豫时径迎敌于渔沟，三百骑入阵自午至酉鏖战，身被七创犹追杀溃兵；楚汉式孤胆名场面
  era: 南宋末
  dates_known: true
- name_zh: 丁黼
  score: 7
  worth_why: 成都制置使，先遣妻子南归自誓死守，夜出城迎战死于石笋街；为政宽大蜀人思之
  era: 南宋末
  dates_known: true
- name_zh: 米立
  score: 7
  worth_why: 被执时对黄万石答「三世食赵氏禄，赵亡何以生为」「生擒之人与投拜者不同」，拒降遇害；对话名场面突出
  era: 南宋末
  dates_known: true
- name_zh: 赵希洎
  score: 7
  worth_why: 忤贾似道外任；郡守劝内款不能屈；家人馈食则碎器覆地，据榻绝食而死；死节细节震撼
  era: 南宋末
  dates_known: true
- name_zh: 高应松
  score: 6
  worth_why: 北兵入城时从官仅留九人其一，随瀛国公至燕绝粒七日而卒；事迹较简但气节可记
  era: 南宋末
  dates_known: true
- name_zh: 侯畐
  score: 6
  worth_why: 海州城下鏖战死，阖室遇害；太学生三十一人请旌忠谥节毅；有《霜厓集》；但做事周期偏短
  era: 南宋末
  dates_known: true
- name_zh: 张山翁
  score: 6
  worth_why: 书谯让张晏然纳款，被执不屈得贷；后聚徒教授终，有著述多种；结局非死节使故事更完整
  era: 南宋末
  dates_known: true
- name_zh: 萧雷龙
  score: 6
  worth_why: 起兵抗元败走闽境被杀；仇家后惊于「萧知府兵」幻影而死；带传奇色彩但做事细节少
  era: 南宋末
  dates_known: true
