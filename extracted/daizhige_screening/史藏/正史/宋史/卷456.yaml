candidates:
- name_zh: 李璘
  score: 8
  worth_why: 手刃杀父仇人陈友而不遁，自言复父仇，太祖壮而释之；宋初孝义典型个案
  era: 五代末至宋初
  dates_known: true
- name_zh: 甄婆儿
  score: 7
  worth_why: 十岁失母，长成后以斧复仇，太宗嘉其复母仇特贷；少年忍恨十余年成一击
  era: 北宋雍熙年间
  dates_known: true
- name_zh: 刘孝忠
  score: 7
  worth_why: 割股断乳、燃掌代母受痛；佣工得钱葬母被富家收养，孝行事流完整
  era: 北汉至宋初
  dates_known: true
- name_zh: 齐得一
  score: 8
  worth_why: 家遭酷吏王万敢屠戮十七口，诣阙上诉伸冤使万敢削官；后布衣蔬食不应征辟，气节与诉讼做事流俱在
  era: 五代末至宋初
  dates_known: true
- name_zh: 胡仲尧
  score: 8
  worth_why: 华林书舍聚书万卷延四方士，旱年发廪减市直赈饥、私财造桥；义门兴学做事流完整
  era: 北宋
  dates_known: true
- name_zh: 陈兢
  score: 8
  worth_why: 江州义门陈氏十三世同居七百口，建书楼立家法；从弟陈旭岁受贷粟仅半、见利不忘义，太宗为之叹息
  era: 北宋
  dates_known: true
- name_zh: 易延庆
  score: 7
  worth_why: 庐墓手植松柏、紫芝玉芝之感，恳辞旌表；为葬母擅离职守坐免官亦不悔
  era: 五代末至北宋
  dates_known: true
- name_zh: 郭琮
  score: 6
  worth_why: 绝酒荤三十年祈母寿，母享百岁；孝行事可感但周期较简
  era: 北宋至道年间
  dates_known: true
