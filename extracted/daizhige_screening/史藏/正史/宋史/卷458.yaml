source: 史藏/正史/宋史/卷458.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 王樵
  score: 9
  worth_why: 举家被掠后千里入契丹寻父母不获，刻木招魂服丧六年，自号赘世翁，屡游塞下图灭辽复仇不用，筑茧室自藏而死，做事流完整且极有戏剧性
  era: 北宋初
  dates_known: true
- name_zh: 姜潜
  score: 8
  worth_why: 知陈留县时青苗令下单榜三日民无应者即撤榜'民不愿矣'，钱独得不散，是新政反对中的名场面，敢为与进退俱可考
  era: 北宋熙宁间
  dates_known: true
- name_zh: 俞汝尚
  score: 8
  worth_why: 拒绝王安石借御史之位弹击故老的算计，力辞得免，'是乃所以为其地也'；与妻相约辞世先后十日而终，守节与从容皆可为范
  era: 北宋熙宁间
  dates_known: true
- name_zh: 陈烈
  score: 7
  worth_why: 屡诏不起自谓'吾学未成'，遭妻讼而司马光率同列力保其节行，士节与孝行典型，期可考
  era: 北宋仁宗至哲宗间
  dates_known: true
- name_zh: 连庶
  score: 7
  worth_why: 兴学开濒淮田千顷致县大治，谏存淮南王旧垒'以古之物传于今'，二宋皆依之而不可其志退居二十年
  era: 北宋仁宗间
  dates_known: true
- name_zh: 张愈
  score: 7
  worth_why: 上书言边事请使契丹令外夷相攻其论甚壮，愿以官授父而隐，六召不应浮游湘沅罗浮九疑，隐逸与壮论兼有
  era: 北宋仁宗间
  dates_known: true
- name_zh: 章詧
  score: 6
  worth_why: 精易与太玄著发隐三篇，以数寓道之说教范百禄，蜀守数荐不就，学有实绩但缺关键抉择场面
  era: 北宋仁宗至神宗间
  dates_known: true
- name_zh: 代渊
  score: 6
  worth_why: 举进士甲科得清水主簿叹'禄不及亲'即还家教授，著周易旨要，择日而终其事奇
  era: 北宋仁宗间
  dates_known: true
- name_zh: 刘易
  score: 6
  worth_why: 喜谈兵著春秋论为韩琦所敬，书石涤去再书之逸事佳，但做事周期偏短
  era: 北宋仁宗至英宗间
  dates_known: true
- name_zh: 宋祁
  score: 0
  worth_why: 无
  era: 无
  dates_known: false
rejections:
- name_zh: 黄晞
  why_not: 聚书著论出走匿韩琦之聘，受命一夕卒，做事流太简
- name_zh: 周启明
  why_not: 四举第一而报罢后教授不复仕，因灾异访直言科废事仅一行，事迹简略
- name_zh: 孙侔
  why_not: 终身不仕事母纯孝，多次辞官重复无事件递进
- name_zh: 阳孝本
  why_not: 传文残缺仅存姓名起首
