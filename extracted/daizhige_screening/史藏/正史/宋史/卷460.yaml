category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 陈堂前
  score: 8
  worth_why: 早年守寡撑持家门，抚育诸甥、收养宗族三四十人、赎回质女，五世同居，令名儒教子，乾道九年受朝廷旌表；完整的治家做事流与结果，可为家道典范
  era: 南宋
  dates_known: true
- name_zh: 谭氏
  score: 6
  worth_why: 绍兴五年英州饥盗起，骂贼不屈而死，节烈有名场面
  era: 南宋
  dates_known: true
- name_zh: 赵氏
  score: 6
  worth_why: 王则之乱中设计脱归，宁自缢舆中不受贼辱，有智谋与决断
  era: 北宋
  dates_known: true
- name_zh: 刘氏
  score: 7
  worth_why: 乱离中留北二十五年纺织自给，其子倾家结侠迎母归宋，两代人完整的坚忍与孝义做事流
  era: 两宋之际
  dates_known: true
rejections:
- name_zh: 朱娥
  why_not: 幼童护祖救母而死，事迹单一无做事周期，仅作旌表
- name_zh: 张氏
  why_not: 江夏民妇抗暴而死，义烈可感但事件即终点，无做事流
- name_zh: 彭列女
  why_not: 斫虎救父一事，篇仅数十字
- name_zh: 郝节娥
  why_not: 抗娼投江殉节，只陈述义烈事，缺完整做事流
- name_zh: 朱氏
  why_not: 卖簪珥养夫、自缢明志，事迹简略
- name_zh: 包绂妻崔氏
  why_not: 守志拒嫁一节可感，但无成事周期
- name_zh: 丁氏
  why_not: 山中拒金兵受辱被杀，单一义烈事件
- name_zh: 项氏
  why_not: 传文一句，自刺而已
- name_zh: 王氏二妇
  why_not: 投江而死数句，无事迹展开
- name_zh: 徐氏
  why_not: 骂贼死节，仅一段
- name_zh: 荣氏
  why_not: 扶姑护女遇害，事迹简略
- name_zh: 何氏
  why_not: 绐贼投河殉夫，一事一曲，无周期
- name_zh: 董氏
  why_not: 同卷附数盗乱中妇人死节杂录，皆一传一句式
- name_zh: 师氏
  why_not: 言官之女骂贼死，简略
- name_zh: 张氏（罗江）
  why_not: 冤狱故事生动曲折，但主角之死是事件终点，且非做事流；可作话头非人物时间轴之选
