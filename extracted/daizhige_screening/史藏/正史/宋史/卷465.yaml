candidates:
- name_zh: 孟忠厚
  score: 7
  worth_why: 外戚中自律避权典型；明受之变乞裁本家恩泽、拒秦桧拉拢遭排挤，昭示远权势全始终之道
  era: 两宋之际
  dates_known: true
- name_zh: 韦璞
  score: 7
  worth_why: 金国告哀使面对强金坚持凶服不用乐，自朝至夜不折节气；恬退十年不迁
  era: 南宋
  dates_known: true
- name_zh: 吴琚
  score: 7
  worth_why: 劝太后速彻帘还政，避免垂帘坐大；使金以信义著，金人谓南使惟琚言可信
  era: 南宋孝宗宁宗时期
  dates_known: true
- name_zh: 李道
  score: 8
  worth_why: 起于宗泽军，聚众抗金，拒刘豫诱降执使其使，从岳飞收复襄阳，平杨再兴蛮乱，做事流完整
  era: 两宋之际
  dates_known: true
- name_zh: 邢焕
  score: 7
  worth_why: 康王岳父屡荐宗泽马伸、弹劾黄潜善汪伯彦误国；苗刘之变知难而退，陈恢复川陕方略数百言
  era: 南宋初
  dates_known: true
