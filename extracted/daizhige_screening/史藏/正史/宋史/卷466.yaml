candidates:
- name_zh: 窦神宝
  score: 7
  worth_why: 为数不多的能战宦官，从征太原中流矢、破三十六砦、灵武被围岁余粮绝犹夜间运粮存孤城，完整军事做事流；然性吝啬畜货巨万有成有守
  era: 北宋初
  dates_known: true
- name_zh: 王继恩
  score: 8
  worth_why: 平定李顺蜀乱之统帅、定策立真宗，权倾一时而结党欺罔终贬死，功高致祸宦官干政之典型教训；太宗拒授宣徽使为名场面
  era: 北宋初
  dates_known: true
拒绝对象:
