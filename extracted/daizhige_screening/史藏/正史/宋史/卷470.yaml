source: 史藏/正史/宋史/卷470.md
category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 王黼
  score: 8
  worth_why: 由校书郎两年超擢至宰相的钻营全流程；力主联金灭辽、置经抚房括天下丁夫敛钱六千二百万缗、买空城奏凯；又阴画夺宗之撼东宫策；纵因方腊事文过饰非；靖康时贬职遭戕；其行事与结局可作佞幸亡国的全景教训
  era: 北宋末
  dates_known: true
- name_zh: 朱勔
  score: 8
  worth_why: 花石纲始作俑者；从贱微到防御使的缘起完整；设应奉局竭官帑民财、太湖石神运昭功石役夫数千拆门凿城；东南郡守多出其门；直接催化方腊起义；做事流与名场面俱全
  era: 北宋末
  dates_known: true
- name_zh: 赵普
  score: 7
  worth_why: 虽非本传主角；但在此卷两次力请诛侯莫陈利用；固请曰法可惜此何足惜；讨贼复用关键决定；作为半社稷之臣的执法与再相线索可考
  era: 北宋初
  dates_known: true
rejections:
- name_zh: 弭德超
  why_not: 事迹仅构陷曹彬与夺官配隶两折；点缀曹彬故事；无独立完整做事流
- name_zh: 侯莫陈利用
  why_not: 以幻术得幸复僭横；主要作赵普执法立场的陪衬；周短折少
- name_zh: 郑昌嗣
  why_not: 附于赵赞传；仅上元节宫中宴饮事发赐死一段；无周期
- name_zh: 童贯
  why_not: 本卷仅侧见其督师平方腊与传手诏罢应奉局；非其本传主叙事
- name_zh: 寇准
  why_not: 仅出一句四凶之对；无做事文本
