candidates:
- name_zh: 蔡确
  score: 8
  worth_why: 善观人主意罗织政敌夺位，元丰拜相专权，车盖亭诗案遭贬身死，后蔡京追封清源郡王贵震当世，高宗削夺滥恩天下快之，做事故事周期完整且警示深刻
  era: 北宋神宗哲宗时
  dates_known: true
- name_zh: 邢恕
  score: 7
  worth_why: 出入程颢司马光门而反复投机，谋废立造宣仁后废立诬案，同文馆之狱兴大狱，东北筑萧关造船攻夏皆迂诞败事，反复小人典型事例完整可为教训
  era: 北宋神宗至徽宗时
  dates_known: true
- name_zh: 吴处厚
  score: 6
  worth_why: 上言表程婴公孙杵臼忠义得官，因蔡确不引荐旧怨笺释车盖亭诗致确南窜，恩怨驱动的小人物做事弧线可鉴
  era: 北宋仁宗至哲宗时
  dates_known: true
rejections:
- name_zh: 蔡渭（蔡懋）
  why_not: 仅以父荫与阑诉得官，无独立做事周期
- name_zh: 王珪
  why_not: 传中仅作被算计的配角拱手而已，无独立完整事迹
