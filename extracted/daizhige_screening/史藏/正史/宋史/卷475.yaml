candidates:
- name_zh: 张邦昌
  score: 8
  worth_why: 靖康之变被迫僭立伪楚皇帝、凡四十二日，礼不御正殿不称陛下；金退后主动迎元祐皇后垂帘、献受命宝请立康王；终因宫闱事赐死潭州。完整做事周期与历史教训，北宋末关键节点
  era: 北宋末南宋初
  dates_known: true
- name_zh: 刘豫
  score: 8
  worth_why: 降金被册立伪齐皇帝，改元阜昌迁都汴京，连年南侵屡败；招降纳叛、大索宗室、赋敛烦苛民不聊生；终被金废为蜀王。反面典型，忠义群像（翟兴、凌唐佐、洪皓、尹惇等）恰成对照
  era: 北宋末南宋初
  dates_known: true
