candidates:
- name_zh: 李全
  score: 9
  worth_why: 从山东红袄军起家到纵横淮楚的完整做事流；涡口化陂湖大捷、说降张林举十二州归宋、东平之战、吞并忠义诸军等名场面连绵；枭雄弄权终成叛臣，教训典型
  era: 南宋嘉定年间
  dates_known: true
- name_zh: 杨安儿
  score: 7
  worth_why: 山东起事称雄一方，兵败即墨为舟人所杀，其妹杨氏（四娘子）继统部众；做事周期有始有终
  era: 金末
  dates_known: false
- name_zh: 杨妙真
  score: 8
  worth_why: 狡悍善骑射的女帅，继杨安儿之余众嫁李全，李全败后其势力实赖杨氏维系；罕见的女叛军统帅叙事
  era: 金末宋初
  dates_known: false
- name_zh: 张林
  score: 7
  worth_why: 金青州守将感应时局以十二州版籍归宋、表辞壮阔，后因与李福争利被迫北归大元；降叛之间的典型决策链
  era: 金末
  dates_known: false
- name_zh: 贾涉
  score: 7
  worth_why: 制置使招纳忠义军又图分散北军之权，与李全斗智屡遭诳绐，忧愤而卒；驭边失策的教训样本
  era: 南宋嘉定年间
  dates_known: false
- name_zh: 季先
  score: 6
  worth_why: 豪杰归宋的沟通枢纽，机察谕群豪有功，终为李全谮构而困死；事迹可考但周期偏短
  era: 南宋嘉定年间
  dates_known: false
- name_zh: 石珪
  score: 6
  worth_why: 夺舟度淮大掠、拒涉命迎为主帅，终杀裴渊携众归大元；反复枭雄线索但因归蒙而叙事中断
  era: 金末宋初
  dates_known: false
- name_zh: 彭义斌
  score: 6
  worth_why: 归李全后自成一路、后仍归宋，为忠义军中较有气节者；本卷仅提及，须他卷补全方录
  era: 金末宋初
  dates_known: false
