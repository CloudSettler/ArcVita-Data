source: 史藏/正史/宋史/卷477.md
category: 史藏/正史/宋史
person:
  qid: guji-李全
  name_zh: 李全
  names:
    zh: 李全
    en: Li Quan
  lifespan:
    birth:
      is_circa: true
      raw: 生年不详
    death:
      is_circa: true
      raw: 卒年不详（绍定年间败亡前夕）
  era: 南宋末（宋金蒙交替之际）
  reign_ref: 宋理宗宝庆、绍定年间
  archetype: 乱世枭雄·叛臣
  dilemmas:
  - 忠与叛：名义上受宋节钺，实则岁贡蒙古、外恭顺以就钱粮
  - 生存与信义：被围青州一年粮尽，焚香自经以服众而后北降蒙古
  lesson: 骑墙离岸的枭雄之术可逞一时，但乍逆乍顺终失所有靠山；借叛养兵、以叛胁饷是自取灭亡之路
  summary_first_person: 我李全以山东忠义军起家，金末乱局中周旋于宋、金、蒙古三国之间：受宋钱粮而怀二心，被围青州粮尽则焚香佯死降蒙古，得授山东行省；归来后造舟习水战、销宋兵甲、挟宣差恫喝朝廷索饷，皆我为大事做铺垫，然机诈太甚，反侧无常，终不能成大事。
  source_urls:
  - 宋史·卷四百七十七·叛臣下·李全下
endeavors:
- id: guji-李全-endeavor-1
  name_zh: 周旋三国、割据山东淮南
  phases:
  - key: brewing
    name_zh: 受宋节钺而怀二心
    labels:
      zh:
      - 忠义军
      - 山阳制置
    start_date: 1227
    highlight_event_id: guji-李全-event-yuezhi
  - key: breakthrough
    name_zh: 青州被围降蒙古
    labels:
      zh:
      - 焚香自经
      - 山东行省
    start_date: 1227
    highlight_event_id: guji-李全-event-xiangmeng
  - key: climax
    name_zh: 造舟备战、胁宋索饷
    labels:
      zh:
      - 习水战
      - 大治舭达船
      - 恫疑虚喝
    start_date: 1228
    highlight_event_id: guji-李全-event-zaozhou
  - key: closure
    name_zh: 破朝廷防线、图扬州渡江
    labels:
      zh:
      - 据盐城
      - 谋渡江
    start_date: 1229
    highlight_event_id: guji-李全-event-juyancheng
  decisions:
  - date: 1227-04
    title_zh: 焚香南拜欲自经，借众心降蒙古
    rationale: 围城年余粮尽，以假自尽压服异议，率残众北降大元，得授山东行省
  - date: 1227-10
    title_zh: 力告大将断指求南归
    rationale: 舍不得淮南基业与宋朝钱粮，断一指示忠以获准南归，受山东淮南行省
  - date: 1228
    title_zh: 外恭顺于宋以就钱粮
    rationale: 山东未定且岁贡蒙古不减，借宋朝粮饷养兵，纵游说复建山阳制置司
  - date: 1229-07
    title_zh: 挟伪大元宣差恫疑虚喝
    rationale: 欲朝廷不为备且不绝钱粮，虽反而难遽绝饷；借李宋二宣差虚张蒙古声势
- id: guji-李全-endeavor-2
  name_zh: 清洗楚州、兼并诸军
  phases:
  - key: brewing
    name_zh: 坐观忠义诸帅相残
    labels:
      zh:
      - 庆福福相猜
    start_date: 1227
    highlight_event_id: guji-李全-event-sha-qingfu
  - key: breakthrough
    name_zh: 诱诸将以自赎
    labels:
      zh:
      - 国安用杀林德
    start_date: 1227-10
    highlight_event_id: guji-李全-event-shoujiang
  - key: climax
    name_zh: 诛时青并其军
    labels:
      zh:
      - 城南楼饮
      - 尽杀青妻
    start_date: 1227-10
    highlight_event_id: guji-李全-event-sha-shiqing
  - key: closure
    name_zh: 众将离心
    labels:
      zh:
      - 五将谋献福杨首
    start_date: 1227-06
  decisions:
  - date: 1227-10
    title_zh: 斩郭统制、收田成瑶等八人下狱
    rationale: 非朝廷杀我妻子吾惟问汝，以报子仇立威并清洗异己
  - date: 1227-10
    title_zh: 楼上杀时青驰骑灭其家
    rationale: 恶其反复，缴檄表忠反生嫌隙，遂并其军擢胡义为将
events:
- id: guji-李全-event-birth
  title_zh: 出生
  description: 生年史无明文
  core_entities:
  - guji-李全
- id: guji-李全-event-yuezhen
  year_of: 1227
  date: 1227
  title_zh: 与金合纵约以盱眙，又受宋饷不辍
  description: 宋得少宽北顾之忧遣饷不绝，全又与金合纵约以盱眙与之，金遣靳经历聘全皆不遂
  core_entities:
  - guji-李全
- id: guji-李全-event-xiangmeng
  year_of: 1227
  date: 1227-04
  title_zh: 青州粮尽焚香佯自经，降蒙古授山东行省
  description: 全在围一年食牛马及人且尽，焚香南向再拜欲自经而使郑衍德田四救之，遂约降大元，大元兵入青州承制授全山东行省
  core_entities:
  - guji-李全
  - 郑衍德
- id: guji-李全-event-duanzhi
  year_of: 1227
  date: 1227-10
  title_zh: 断一指求南归，受山东淮南行省
  description: 力告大元大将求南归不许，断一指示归南必畔许之；承制授山东淮南行省得专制山东而岁献金币
  core_entities:
  - guji-李全
- id: guji-李全-event-sha-qingfu
  year_of: 1227
  date: 1227
  title_zh: 陈楚州庆福被杀、夏全之乱，全坐收其乱
  description: 福疑庆福跃起拔刀杀之，夏全追逐刘卓焚掠楚州；全借乱收渔人之利
  core_entities:
  - guji-李全
  - 刘庆福
  - 夏全
- id: guji-李全-event-shoujiang
  year_of: 1227
  date: 1227-10
  title_zh: 至楚州服大元衣冠，收田成瑶等八人下狱
  description: 全与大元张宣差并通事数人至楚州服大元衣冠文移纪甲子而无号；推杀其子者郭统制斩之又收田成瑶等八人下狱云非朝廷杀我妻子吾惟问汝
  core_entities:
  - guji-李全
  - 郭统制
- id: guji-李全-event-sha-shiqing
  year_of: 1227
  date: 1227-10
  title_zh: 与时青城南楼饮杀之并尽杀其妻
  description: 青缴所授檄于全曰我素推尊相公岂肯为此，全亦恶青反复，与登城南楼饮杀青，驰骑往绐青妻言青病，青妻至尽杀之并并青军
  core_entities:
  - guji-李全
  - 时青
- id: guji-李全-event-zaozhou
  year_of: 1228
  date: 1228
  title_zh: 大造舭达船习水战
  description: 全知东南利舟师谋习水战，米商至悉并舟籴之留其柁工一以教十，遣人泛江湖市桐油煔筏厚募南匠大治舭达船自淮及海相望；后至发冢取煔板炼铁钱为钉鞠熬人脂捣油灰
  core_entities:
  - guji-李全
- id: guji-李全-event-huojuku
  year_of: 1229
  date: 1229-02
  title_zh: 遣穆椿纵火焚御前军器库
  description: 御前军器库火得纵火者楚州军穆椿也，全欲销宋兵备故使椿行，先朝兵甲尽丧；椿临刑笑曰事济矣
  core_entities:
  - guji-李全
  - 穆椿
- id: guji-李全-event-juyancheng
  year_of: 1229
  date: 1229-08
  title_zh: 以捕盗为名水陆数万捣盐城据之
  description: 会全籴麦舟过盐城县朝宗嗾尉兵夺之，全怒以捕盗为名水陆数万径捣盐城，戍将陈益楼强皆遁，全入城据之公私盐货皆没于全；又当廷言朝廷待我如小儿啼则与果不受罢兵之命
  core_entities:
  - guji-李全
  - 翟朝宗
- id: guji-李全-event-daozhou-mou
  year_of: 1229
  date: 1229
  title_zh: 谋先据扬州以渡江分兵徇通泰
  description: 全欲先据扬州以渡江分兵徇通泰以趋海；诸将言通泰盐场在焉莫若先取为家计且使朝廷失盐利
  core_entities:
  - guji-李全
- id: guji-李全-event-death
  title_zh: 死亡
  description: 本卷未及其死事，卒年不载于此传节
  core_entities:
  - guji-李全
