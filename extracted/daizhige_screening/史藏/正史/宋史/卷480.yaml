  birth_date: '929'
  death_date: '988'
  era: 五代十国至北宋初
  reign_ref: 吴越国王；宋建隆元年授天下兵马大元帅
  archetype: 识时务的末代国主
  dilemmas:
  - 保全宗族还是严惩外戚——舅吴延福有异图，左右劝诛，俶念先夫人同气而黜之全母族
  - 助宋灭邻国还是留唇齿之盟——李煜贻书『今日无我，明日岂有君』，俶不答并以书来上
  - 恪守王位还是纳土归朝——虑神道害盈，请罢国王号并献十三州版籍
  lesson: 谢幕者的智慧——知盈虚、识大势，纳土归宋使一方百姓免于兵祸，宗族得全
  summary_first_person: 我承吴越百年基业，佐宋平江南而不惑于唇齿之论，终以十三州版籍献于阙下，举宗效顺，垂名简编。
