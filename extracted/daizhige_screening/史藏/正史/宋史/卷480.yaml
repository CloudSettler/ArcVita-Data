    title_zh: 黜吴延福而不诛，保全母族
    rationale: 『先夫人同气，安忍置于法』，鸣咽流涕，终全母族
  - date: 974-12
    title_zh: 弃李煜唇齿之辩，以书奏宋
    rationale: 识天下大势归宋，不为小义惑大计
  - date: 978-05
    title_zh: 纳土献十三州于宋
    rationale: 『盖虞神道之害盈』，虑祖宗基业百年而独守一隅终致祸
events:
- id: guji-钱俶-event-birth
  type: birth
  date: '929'
  year_of: 929
  place: 杭州临安
  description: 生于吴越王室，元瓘第九子
- id: guji-钱俶-event-1
  type: endeavor
  date: '947'
  year_of: 947
  title_zh: 台州刺史任上急归国，值胡进思之变而得立为吴越国王
  detail: 僧德诏言『此地非君为治之所，当速归』，俶从其言求归国，未几进思废倧迎立之
- id: guji-钱俶-event-2
  type: endeavor
  date: '975'
  year_of: 975
  title_zh: 佐宋讨江南，拔常州、随王师平润州进围金陵，江南平
  detail: 宋开宝七年冬奉诏为升州东面招抚制置使；李煜贻书『今日无我，明日岂有君』，俶不答，以书来上
- id: guji-钱俶-event-3
  type: endeavor
  date: 978-05
  year_of: 978
  title_zh: 上表献吴越十三州版籍于宋，纳土归朝
  detail: 太宗优诏许之，徙封淮海国王，赐礼贤宅，举宗效顺，前代所无
- id: guji-钱俶-event-4
  type: endeavor
  date: 958-05
  year_of: 958
  title_zh: 杭州大火，设酒祝仓廪而火止
  detail: 显德五年夏四月府舍悉焚，将延仓庾，俶命酒祝曰『食为民天』，火遂止
- id: guji-钱俶-event-death
  type: death
  date: '988'
  year_of: 988
  detail: 传文本卷未详载其卒，据史约卒于端拱元年
