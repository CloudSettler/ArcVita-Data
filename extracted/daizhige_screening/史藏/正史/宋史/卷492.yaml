candidates:
- name_zh: 潘罗支
  score: 8
  worth_why: 六谷都首领联宋抗李继迁，伪降后集诸部合击使其大败中流矢而死，后为二族所戕；忠顺事宋屡请会兵，做事流完整且为宋夏 关系关键节点
  era: 北宋初
  dates_known: true
- name_zh: 厮铎督
  score: 7
  worth_why: 潘罗支遇害后继掌六谷诸部，刚决平恕、威名甚著，屡与赵德明作战并贡马请官，维系凉州对宋朝贡格局
  era: 北宋真宗时
  dates_known: true
- name_zh: 折逋游龙钵
  score: 6
  worth_why: 四世受朝命为酋而首次亲至汴京献马二千匹，详述凉州地理户口，是凉州吐蕃内附的重要见证者
  era: 北宋初
  dates_known: true
- name_zh: 申师厚
  score: 5
  worth_why: 后周首任河西节度，孤身入凉州奏授蕃部官职，后为所迫擅还朝坐贬，有完整起落可为教训
  era: 五代末
  dates_known: true
- name_zh: 李继迁
  score: 7
  worth_why: 本卷虽为配角，其攻西凉陷丁惟清、旋为潘罗支所败中箭而死，是宋夏兴衰的关键转折事例
  era: 北宋初
  dates_known: true
