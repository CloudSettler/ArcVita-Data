category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 曹克明
  score: 8
  worth_why: 大中祥符间为宜融都巡检安抚使，率军破抚水州蛮于黄泥岭、设伏博贺村，招抚归顺后改州县为安化，平定边患有完整用兵周期
  era: 北宋真宗朝
  dates_known: true
- name_zh: 蒙承贵
  score: 7
  worth_why: 抚水州蛮酋，败后面缚自首、歃血立誓归顺，请改州县名以固归化，抚水州由叛而安的关键决策者
  era: 北宋真宗朝
  dates_known: true
- name_zh: 罗世念
  score: 7
  worth_why: 熙宁间因官吏侵剥举兵攻德谨寨、杀将官费万，后率四千五百人出降受官，叛降两段完整，教训深刻
  era: 北宋神宗朝
  dates_known: true
- name_zh: 明橐
  score: 6
  worth_why: 监察御史历陈观、平二州糜费之弊，力主罢废新拓边州，属-productive 治边制度建言，但未见结果落地
  era: 南宋高宗朝
  dates_known: true
rejections:
- name_zh: 蒙令地
  why_not: 仅为受招安抚水酋长名号，无做事事迹
- name_zh: 刘惟忠
  why_not: 虽有诬杀莫公佞取观州之事，但旋即中伤身死，周期残缺教训嫌轻
- name_zh: 莫公佞
  why_not: 遭诬杀无自主做事流
- name_zh: 蒙光有
  why_not: 啸聚为寇被击却，仅一句带过
