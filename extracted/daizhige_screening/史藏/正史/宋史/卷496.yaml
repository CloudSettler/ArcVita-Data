category: 史藏/正史/宋史
verdict: has_candidates
candidates:
- name_zh: 龙汉𤩊
  score: 6
  worth_why: 西南牂牁诸蛮之王，朝贡三十余年持续不绝，遣使献方物名马获封归化王，其使入朝回答地理风俗并演水曲歌舞为宋代民族交往名场面
  era: 北宋初
  dates_known: true
- name_zh: 寇瑊
  score: 8
  worth_why: 晏州斗望之乱时集船张旗招安诸夷结盟誓，力主发兵讨伐并与王怀信合谋平乱，战后被诏抚谕夷人，兼有招抚与征讨完整做事周期
  era: 北宋真宗朝
  dates_known: true
- name_zh: 王怀信
  score: 7
  worth_why: 嘉眉戎泸水陆都巡检使，率兵分路入夷境连破四砦、泾滩大捷、晏江口弩射破万余夷众，武力平乱完整战役链
  era: 北宋真宗朝
  dates_known: true
- name_zh: 侍其旭
  score: 6
  worth_why: 泸州江安夷乱首任招抚使，招而复叛、追斩擒首，太宗降诏戒其违招安之实令笃恩信，是剿抚两难决策的典型教训案例
  era: 北宋真宗朝
  dates_known: true
- name_zh: 斗望
  score: 6
  worth_why: 晏州多刚县夷人首领，劫淯井监杀官大掠引发大征讨，抗官军两年终至首服纳铜鼓盟誓永不寇边，作乱到投降的完整弧线可作教训
  era: 北宋真宗朝
  dates_known: true
- name_zh: 孙正辞
  score: 5
  worth_why: 文思副使为都巡检使分三路以兵威胁降夷人致其安集，得诏嘉奖，其料简白艻子兵为乡导之经验为后人沿用
  era: 北宋真宗朝
  dates_known: true
rejections:
- name_zh: 龙彦瑫
  why_not: 仅受封朝贡记录，卒后子嗣袭职，无做事周期
- name_zh: 龙汉璇
  why_not: 遣使上印朝贡数事而已，事迹单薄
- name_zh: 康训
  why_not: 修泾滩路遇伏战死一句带过，无完整经历
- name_zh: 董仲元
  why_not: 仅善抚蛮夷袭保州刺史一句，无事迹展开
