verdict: has_candidates
candidates:
- name_zh: 朱温
  score: 9
  worth_why: 黄巢降将起家，数十年兼并中原代唐建梁，权谋枭雄的完整兴衰弧线，终因荒淫被弑
  era: 唐末至五代后梁
  dates_known: true
- name_zh: 李存勖
  score: 9
  worth_why: 受三矢遗命灭梁雪耻，却宠伶宦身死族灭；忧劳兴国逸豫亡身的活标本，伶官传序正主
  era: 五代后唐
  dates_known: true
- name_zh: 柴荣
  score: 9
  worth_why: 高平之战整军、均田赋、三征南唐北伐幽燕，十年开拓天下之志英年早逝，为宋统一奠基
  era: 五代后周
  dates_known: true
- name_zh: 冯道
  score: 9
  worth_why: 事四朝十帝自号长乐老，乱世刻经济民与无廉耻之讥并陈，千年争议第一人，超大两难素材
  era: 唐末至五代
  dates_known: true
- name_zh: 李克用
  score: 8
  worth_why: 独眼龙率鸦儿军破黄巢，上源驿之变结梁世仇，临终授三矢成兴唐遗命
  era: 唐末
  dates_known: true
- name_zh: 石敬瑭
  score: 8
  worth_why: 割燕云十六州、称儿皇帝借契丹灭唐，贻祸四百年，巨型反面教材
  era: 五代后晋
  dates_known: true
- name_zh: 王彦章
  score: 8
  worth_why: 豹死留皮人死留名，一条铁枪破德胜力战死节，死节传压卷人物
  era: 唐末至五代后梁
  dates_known: true
- name_zh: 敬翔
  score: 8
  worth_why: 朱温三十年谋主，运筹灭秦宗权克兖郓，梁亡曰吾与梁休戚一体，绝食殉国
  era: 唐末至五代后梁
  dates_known: true
- name_zh: 张承业
  score: 8
  worth_why: 宦官监军理财成晋霸业，力拒晋王勿僭帝号，抱愤而卒，乱世义士
  era: 唐末至五代
  dates_known: true
- name_zh: 钱镠
  score: 8
  worth_why: 保境安民修海塘射潮，吴越传国善终，五代地方治理最成功样本
  era: 唐末至五代吴越
  dates_known: true
- name_zh: 杨行密
  score: 8
  worth_why: 白手起家定江淮败孙儒，御军得士开吴国基业，乱世自立的完整创业流
  era: 唐末至五代吴
  dates_known: true
- name_zh: 周德威
  score: 7
  worth_why: 柏乡夹寨破梁名将，谏庄宗勿轻进不纳，胡柳陂父子俱殁
  era: 唐末至五代
  dates_known: true
- name_zh: 李嗣源
  score: 7
  worth_why: 目不知书而为君却致明宗之治，养子承统的伦理与治术双重样本
  era: 五代后唐
  dates_known: true
- name_zh: 王朴
  score: 7
  worth_why: 献平边策定先南后北统一方略，创律历修礼乐，周世宗蓝图总设计师
  era: 五代后周
  dates_known: true
- name_zh: 刘仁赡
  score: 7
  worth_why: 孤城寿州死守拒周师尽岁，城破身死，忠节震撼敌国
  era: 五代南唐
  dates_known: true
