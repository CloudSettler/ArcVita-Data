category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 吴缜
  score: 8
  worth_why: 以一人之力遍检新唐书四百余事之误，创二十门类例，著新唐书纠谬；虽初被欧阳修以年少轻佻拒之修史之列而鞅鞅，仍以本史自相质正成一家之书，进呈御览；其自序举修书八失深中史学之病
  era: 北宋
  dates_known: true
rejections:
- name_zh: 欧阳修
  why_not: 文中仅作修书背景与被纠对象，无独立做事流
- name_zh: 宋祁
  why_not: 同上，仅载其主修列传与他人商略不同
- name_zh: 李林甫
  why_not: 仅于吴皇后传事例中一带而过
- name_zh: 唐肃宗
  why_not: 作为吴皇后传事例出现，无做事周期可考
- name_zh: 章敬吴皇后
  why_not: 传文见于纠谬引例，事迹简略且真伪被质疑
- name_zh: 高力士
  why_not: 仅传内只言片语
- name_zh: 纪昀
  why_not: 仅为提要总纂署名，无事迹
- name_zh: 朱宣
  why_not: 仅作纪传不符之例证一提
- name_zh: 辛云京
  why_not: 仅作史臣书事关例证一提
- name_zh: 李德裕
  why_not: 仅作增修父吉甫美事之例一提
