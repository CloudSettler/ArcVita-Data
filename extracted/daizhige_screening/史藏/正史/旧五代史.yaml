source: 史藏/正史/旧五代史.md
category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 朱温
  score: 10
  worth_why: 里中不事生业而投黄巢军，斩监军举同州降唐，赐名全忠，平秦宗权、定汴宋，终代唐建梁；上源驿夜袭、弑昭宗、白马驿之祸皆名场面；末年暴虐为亲子所弑，成于枭雄死于家祸，做事流与教训俱全
  era: 唐末至后梁
  dates_known: true
- name_zh: 李存勖
  score: 10
  worth_why: 少年继晋王位，柏乡夹寨连破梁军，收魏博、擒刘仁恭，十年百战灭梁建后唐，又遣兵平前蜀；三年溺于伶宦宠佞，兴教门之变中流矢而亡，身死国灭；兴亡对照教科书级
  era: 唐末至后唐
  dates_known: true
- name_zh: 柴荣
  score: 9
  worth_why: 高平之战亲冒矢石大破北汉，乘胜整军强兵；三征南唐尽得江北，北伐幽燕连取三关；立十年开拓天下十年养百姓十年致太平之志，早逝而全为北宋统一奠基
  era: 五代后周
  dates_known: true
- name_zh: 李克用
  score: 9
  worth_why: 独眼沙陀枭雄，上源驿伏火中逾垣脱身，复与梁晋百年争霸开其端；讨黄巢勤王室，朱温篡唐后独用天祐年号拒为梁臣；临终以三恨托付庄宗
  era: 唐末至五代初
  dates_known: true
- name_zh: 石敬瑭
  score: 9
  worth_why: 河东举兵借契丹之力灭后唐建晋，割燕云十六州、称儿皇帝、岁输帛三十万；一举改写此后四百年南北格局，千古反面教员级决策样本
  era: 五代后晋
  dates_known: true
- name_zh: 郭威
  score: 9
  worth_why: 少孤从军，佐汉高祖定天下；隐帝诛戮大臣遂邺都起兵，澶州将士黄旗加身建后周；首倡节俭、放免苛敛，兵变模式为陈桥兵变之先声
  era: 五代后周
  dates_known: true
- name_zh: 李嗣源
  score: 8
  worth_why: 目不知书的骑将出身，因军心拥立而登帝位；诛敛臣孔谦、减赋放宫人、夜焚香为民祝天早生圣人；乱世中难得的治世小康样本
  era: 唐末至后唐
  dates_known: true
- name_zh: 冯道
  score: 8
  worth_why: 历唐晋汉周四朝十帝而不倒，主持校刻九经，开儒典雕印先河；晚年谏阻世宗亲征、临危不失分寸；长乐老自毁誉千年，大争议样本
  era: 唐末至后周
  dates_known: true
- name_zh: 王彦章
  score: 8
  worth_why: 号王铁枪，受命危难之际奇袭德胜南城一日拔三寨；兵权遭段凝赵岩排夺，孤军败于杨刘，被擒不降、豹死留皮人死留名
  era: 唐末至后梁
  dates_known: true
- name_zh: 钱镠
  score: 8
  worth_why: 起于草莽枭雄终保两浙，奉中原正朔、保境安民、兴修水利，使吴越五代免于兵祸；治世而非争天下的另一条完整做事流
  era: 唐末至吴越
  dates_known: true
- name_zh: 李存孝
  score: 7
  worth_why: 义儿军第一骁将，披重铠横槊每战身先，累城拔寨勇冠诸军；受谗离叛守邢州终致车裂，勇冠三军而败于猜忌的典型
  era: 唐末
  dates_known: true
- name_zh: 周德威
  score: 7
  worth_why: 晋军第一智将，柏乡诱敌、夹寨夜袭、北取燕蓟多建奇功；胡柳陂因主上轻进战殁，老将之谋与少主之躁的对照
  era: 唐末至后梁年间
  dates_known: true
- name_zh: 敬翔
  score: 7
  worth_why: 梁之谋主，佐朱温三十年机务，未尝一日离左右；汴京陷落之夜不仕新朝自尽，谋臣建业与尽节的完整弧线
  era: 唐末至后梁
  dates_known: true
- name_zh: 郭崇韬
  score: 7
  worth_why: 灭梁之役运筹决胜，伐蜀三月而定全川；功盖一时反遭宦官谗构见杀于蜀，功高震主的典型教训
  era: 唐末至后唐
  dates_known: true
- name_zh: 王朴
  score: 7
  worth_why: 献平边策定先易后难先南后北之略，北宋统一路线由此而来；又修钦天历、营东京格局；枢要之臣暴卒于任，志业中折
  era: 五代后周
  dates_known: true
rejections:
- name_zh: 朱友贞
  why_not: 末帝在位十六年唯守汴城猜忌功臣，本纪多系年号诏令，无独立做事流，仅作时间坐标
- name_zh: 李从珂
  why_not: 以兵变得位又以兵败焚身，全程为反面失政，事迹多系于他人主线之下
- name_zh: 刘承祐
  why_not: 隐帝年少擅诛权臣酿郭威之变，纪文简短无可立阶段
- name_zh: 柴宗训
  why_not: 恭帝冲龄禅位，本纪仅数行，无可抽之事
- name_zh: 刘守光
  why_not: 僣伪残暴父子相囚相残，弧线短促且多见于晋史侧面，教训单薄
- name_zh: 王衍
  why_not: 前蜀后主荒于政事国亡被戮，僣伪传文简略无完整做事流
- name_zh: 朱黯、朱茂琳、朱信、朱诚
  why_not: 纪首追尊仅列世系庙号葬地，无任何生平行事
