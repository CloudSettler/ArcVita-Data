source: 史藏/正史/旧晋书九家辑本.md
category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 陶侃
  score: 9
  worth_why: 出身孤贫终都督八州；运甓习劳、竹头木屑、惜分阴之训；平王敦苏峻之乱，功高善终
  era: 两晋之际
  dates_known: true
- name_zh: 谢安
  score: 9
  worth_why: 东山再起；围棋赌墅从容定淝水之战，以少胜多名场面；风流宰相庇护晋室
  era: 东晋
  dates_known: true
- name_zh: 陶潜
  score: 9
  worth_why: 不为五斗米折腰挂印归隐；桃花源记、归去来兮辞成田园诗宗
  era: 东晋末
  dates_known: true
- name_zh: 王导
  score: 9
  worth_why: 衣冠南渡后调和侨姓吴姓助晋室立国江左，王与马共天下；历王敦苏峻之乱而维持大局
  era: 两晋之际
  dates_known: true
- name_zh: 祖逖
  score: 9
  worth_why: 闻鸡起舞；中流击楫北伐，朝廷不予铠仗令自招募，竟收复黄河以南；忧愤而卒见事业悲壮
  era: 两晋之际
  dates_known: true
- name_zh: 周处
  score: 9
  worth_why: 少为乡患，除三害后改过自新终至殉国战死；著风土记为端午寒食最早记载者
  era: 西晋
  dates_known: true
- name_zh: 石勒
  score: 8
  worth_why: 从奴隶到开国称帝的完整崛起周期；设君子营礼士，令人读史而自评不及刘邦，有教益
  era: 两晋之际
  dates_known: true
- name_zh: 苻坚
  score: 8
  worth_why: 重用王猛抑豪强兴儒学统一北方；淝水一败风声鹤唳草木皆兵，盛极而败成千古镜鉴
  era: 东晋十六国
  dates_known: true
- name_zh: 王羲之
  score: 8
  worth_why: 书圣；兰亭修禊成天下第一行书名场面；东床快婿、入木三分诸典皆出其传
  era: 东晋
  dates_known: true
- name_zh: 嵇康
  score: 8
  worth_why: 竹林七贤领袖；与山巨源绝交书明不仕之志；刑前弹广陵散成绝响，士人风骨坐标
  era: 魏晋之际
  dates_known: true
- name_zh: 杜预
  score: 8
  worth_why: 灭吴统帅，势如破竹之策出其口；注左传成一代经师；唯一兼入文庙武庙者
  era: 西晋
  dates_known: true
- name_zh: 羊祜
  score: 8
  worth_why: 镇襄阳修德怀柔，缓进十年为平吴蓄势；临终举杜预自代；堕泪碑见民心之归
  era: 西晋
  dates_known: true
- name_zh: 刘琨
  score: 8
  worth_why: 与祖逖共闻鸡起舞；孤守晋阳枕戈待旦，一曲胡笳退敌；结好段匹磾反遭杀害，用人失察成教训
  era: 西晋末
  dates_known: true
- name_zh: 皇甫谧
  score: 7
  worth_why: 中年罹风疾发愤自学，撰针灸甲乙经奠针灸之学；屡拒征召以著述全其志
  era: 西晋
  dates_known: true
- name_zh: 裴秀
  score: 7
  worth_why: 创制图六体，主修禹贡地域图，为中国传统地图学奠基
  era: 西晋
  dates_known: true
rejections:
