  why_not: 何不食肉糜仅成昏聩坐标，无做事周期，君主低优先
- name_zh: 司马炎
  why_not: 平吴统一全赖羊祜杜预之策，本人决策着墨少，作时间坐标即可
- name_zh: 石崇
  why_not: 与王恺斗富及绿珠坠楼皆骄奢故事，无事业周期，仅作奢靡反面注脚
- name_zh: 王衍
  why_not: 清谈误国之评虽著，但临难推责、行迹零散，做事流不完整，暂缓
- name_zh: 卫玠
  why_not: 看杀卫玠为美容谈资，无可考做事流
- name_zh: 贾后及武元杨皇后等后妃诸人
  why_not: 宫闱事迹无独立做事流，仅作后族干政背景
- name_zh: 孙登董京朱冲等隐逸诸人
  why_not: 传文简略仅数十字，无可考做事周期
- name_zh: 戴洋淳于智韩友等蓺术诸家
  why_not: 占验方术事迹难征，无可据时间线
- name_zh: 汝南王亮楚王玮成都王颖等八王
  why_not: 内乱中旋起旋灭，无建设性完整周期，仅作乱局坐标
