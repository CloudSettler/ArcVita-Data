candidates:
- name_zh: 朱元璋
  score: 10
  worth_why: 孤僧游丐至开国之君，做事流完整至极；渡江断舟缆破釜沉舟、龙湾诱破陈友谅、克城以武戡乱以仁、五百降卒卫队解甲酣寝安众心；逆袭与治术双重典范
  era: 元末明初
  dates_known: true
- name_zh: 徐达
  score: 9
  worth_why: 南略定远、拔太平、克镇江、围常州、数败士诚，后成开国第一名将；持重不矜，善始善终
  era: 元末明初
  dates_known: true
- name_zh: 刘基
  score: 8
  worth_why: 与宋濂章溢叶琛同征至应天，运筹帷幄料事如神，开国谋略之首，代表作《诚意伯文集》
  era: 元末明初
  dates_known: true
- name_zh: 常遇春
  score: 8
  worth_why: 牛渚先登破采石，龙湾伏击有功，勇冠三军称常十万；早逝英年留下遗憾弧线
  era: 元末明初
  dates_known: true
- name_zh: 陈友谅
  score: 7
  worth_why: 弑徐寿辉称帝、约士诚合攻应天，龙湾中绐大败成天下转折；枭雄速亡的典型教训
  era: 元末
  dates_known: true
- name_zh: 张士诚
  score: 7
  worth_why: 高邮称诚王、高邮之战牵动元廷，士诚不出兵坐观友谅败亡；保守短视终致覆灭的对照教训
  era: 元末
  dates_known: true
- name_zh: 刘福通
  score: 7
  worth_why: 奉韩山童起颍州、破汴梁迎韩林儿、分道北伐破山东寇秦晋掠幽蓟；客观为朱元璋屏障江表，兴衰俱可考
  era: 元末
  dates_known: true
- name_zh: 脱脱
  score: 7
  worth_why: 高邮大破士诚军声大振，会中谗遽解兵柄致江淮乱益炽；功高见谗的悲剧样本，兼有修三史之业
  era: 元末
  dates_known: true
- name_zh: 察罕帖木儿
  score: 7
  worth_why: 复汴梁、平山东降田丰，元末中兴名将，军声盛至朱元璋遣使通好；未竟全功而殁
  era: 元末
  dates_known: true
- name_zh: 李善长
  score: 7
  worth_why: 定远道遇与语大悦，文臣之首比肩萧何，定开国规制；终以党案族诛，功臣政治的警示样本
  era: 元末明初
  dates_known: true
- name_zh: 郭子兴
  score: 6
  worth_why: 濠州首义，识拔元璋于亲兵并妻以马氏；困于内讧被执获救，格局所限终遭架空的早段坐标人物
  era: 元末
  dates_known: true
- name_zh: 胡大海
  score: 6
  worth_why: 克徽州诸暨处州，经略浙东功臣，与破婺州；信州捣友谅之背有牵制之功
  era: 元末
  dates_known: true
- name_zh: 汤和
  score: 6
  worth_why: 与太祖同起濠州，守常州数败士诚兵；与徐达费聚同列核心班底，后善终交权的处世参考
  era: 元末明初
  dates_known: true
- name_zh: 廖永安
  score: 5
  worth_why: 巢湖水军千艘来附解渡江无舟之困，峪溪口破海牙；渡江工程的关键推手，事迹尚简宜缓录
  era: 元末
  dates_known: true
