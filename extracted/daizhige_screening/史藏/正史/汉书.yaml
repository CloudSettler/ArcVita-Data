candidates:
- name_zh: 陈胜
  score: 9
  worth_why: 大泽乡首倡举义，王侯将相宁有种乎；从佣耕者到张楚王的完整起落弧线，燕雀鸿鹄之志流芳两千载
  era: 秦末
  dates_known: true
- name_zh: 张骞
  score: 10
  worth_why: 凿空西域通丝绸之路；两度被匈奴羁押持汉节不失，功封博望侯，以节不改而事竟成
  era: 西汉武帝时
  dates_known: true
- name_zh: 霍光
  score: 9
  worth_why: 受武帝遗诏辅政近二十年，行废立（废昌邑立宣帝）而身不危，麒麟阁功臣之首，权臣辅政的完整模板与警示
  era: 西汉武帝至宣帝时
  dates_known: true
- name_zh: 贾谊
  score: 9
  worth_why: 过秦论、治安策立政论标杆，众建诸侯而少其力为削藩总纲；少年得志遭谗早夭的才子弧线
  era: 西汉文帝时
  dates_known: true
- name_zh: 晁错
  score: 8
  worth_why: 力主削藩酿七国之乱，朝服被斩于东市；改革者以身殉策的典型决策样本
  era: 西汉文帝景帝时
  dates_known: true
- name_zh: 赵充国
  score: 9
  worth_why: 百闻不如一见；年逾七十自请平羌，力排众议罢兵屯田不战而定，算无遗策的老将典范
  era: 西汉武帝至宣帝时
  dates_known: true
- name_zh: 陈汤
  score: 9
  worth_why: 矫制发兵千里斩郅支单于，明犯强汉者虽远必诛；功过一身毁誉参半的传奇决策
  era: 西汉元帝时
  dates_known: true
- name_zh: 王莽
  score: 9
  worth_why: 由天下归心到篡汉建新，托古改制全面失败身死国灭；乌托邦式改革最大警示样本
  era: 西汉末至新朝
  dates_known: true
- name_zh: 汉宣帝
  score: 8
  worth_why: 巫蛊之祸狱中遗孤，民间长大知疾苦，及位霸王道杂之成中兴，置西域都护定西陲；君主但弧线与治绩突出
  era: 西汉
  dates_known: true
- name_zh: 赵佗
  score: 8
  worth_why: 以偏师并岭南建南越，和辑百越，屡对汉使不卑不亢保国近百年，寿逾百岁的割据者
  era: 秦末汉初
  dates_known: true
- name_zh: 曹参
  score: 8
  worth_why: 萧规曹随清静无为，以黄老治国成文景之治先声；功人功狗之论亦成名言
  era: 秦末汉初
  dates_known: true
- name_zh: 陆贾
  score: 8
  worth_why: 马上得天下宁可以马上治之；两使南越说降赵佗，著新语十二篇定汉初国策
  era: 秦末汉初
  dates_known: true
- name_zh: 司马相如
  score: 8
  worth_why: 赋圣，子虚上林立汉赋体制；又持节通西南夷有实政，凤求凰留千古情话
  era: 西汉
  dates_known: true
- name_zh: 刘安
  score: 8
  worth_why: 集宾客编淮南子成黄老大成，学术一流而政治谋反败亡；著书与夺位的分裂人生
  era: 西汉
  dates_known: true
- name_zh: 主父偃
  score: 8
  worth_why: 一策推恩令令诸侯自分而不觉；生不五鼎食死即五鼎烹，一岁四迁终至族灭
  era: 西汉武帝时
  dates_known: true
