source: 史藏/正史/清史稿.md
category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 努尔哈齐（清太祖）
  score: 10
  worth_why: 以父祖遗甲十三副起兵复仇，自图伦城之战至灭乌拉，四十年统一建州海西诸部；古勒山以少胜多破九部三万联军；始制国书、开矿置冶、定兵制立法制，缘起到开国做事流完整，帝王创业范本
  era: 明末后金开国
  dates_known: true
- name_zh: 皇太极（清太宗）
  score: 9
  worth_why: 本篇记其生年坐标；凭太宗本纪，两征朝鲜、反间计除袁崇焕、松锦决战收洪承畴、改金为清，承上启下定鼎之基
  era: 后金至清初
  dates_known: true
- name_zh: 额亦都
  score: 8
  worth_why: 以徒众九人相从起兵，夜获刺客劝纵之显器量；古勒山以百人挑战挫敌前锋；一生为诸大战主帅先锋，开国五大臣之首，而诸子多殁于阵，功与代价并存
  era: 明末建州
  dates_known: true
- name_zh: 费英东
  score: 7
  worth_why: 随父索尔果率部来归，戍哈达、征渥集屡任主帅，直臣敢谏，为太祖股肱
  era: 明末建州
  dates_known: true
- name_zh: 褚英
  score: 6
  worth_why: 少年统兵，伐安褚拉库、徙斐悠城户破乌拉遮击；被授政而暴伉失众，焚表告天自缢死，接班人失败的完整教训
  era: 明末建州
  dates_known: true
- name_zh: 舒尔哈齐
  score: 5
  worth_why: 与兄同陷古勒之难共起兵，屡统大军征伐；后与兄分权被禁而死，共患难易共富贵难之教训
  era: 明末建州
  dates_known: true
- name_zh: 多尔衮
  score: 9
  worth_why: 统兵入关定鼎燕京，摄政七年草创清朝制度，身后削爵夺封，权臣功覆之双重样本
  era: 明末清初
  dates_known: true
- name_zh: 康熙帝
  score: 10
  worth_why: 少年智擒鳌拜，平三藩、收台湾、雅克萨拒沙俄定界、三征噶尔丹，治河治漕兴文教，成事之密与做事流之长冠绝清代
  era: 清前期
  dates_known: true
- name_zh: 雍正帝
  score: 9
  worth_why: 摊丁入亩、火耗归公、设军机处、改土归流、整饬吏治，以制度建设成事之典范
  era: 清前期
  dates_known: true
- name_zh: 乾隆帝
  score: 8
  worth_why: 十全武功定型疆域，修四库全书而寓禁毁，盛世由盛转衰之转捩坐标
  era: 清盛期
  dates_known: true
- name_zh: 郑成功
  score: 9
  worth_why: 拒父降清孤军抗清，驱逐荷兰收复台湾，开台立制，成败皆成大功之传奇
  era: 明末清初
  dates_known: true
- name_zh: 于成龙
  score: 8
  worth_why: 三居要职皆自践行廉能，兴除积弊，天下第一廉吏之做事范本
  era: 清前期
  dates_known: true
- name_zh: 曾国藩
  score: 10
  worth_why: 书生练湘军成天下劲旅，结硬寨打呆仗平大乱，天津教案之忍辱与洋务之首发，克己传家之范
  era: 清晚期
  dates_known: true
- name_zh: 左宗棠
  score: 10
  worth_why: 幕僚起家率楚军平东南，晚年舆榇出关收复新疆，创福州船政，晚清成事最完满之名臣
  era: 清晚期
  dates_known: true
- name_zh: 李鸿章
  score: 9
  worth_why: 淮军起家、办洋务、建北洋海军，历马关辛丑之辱，做事与受挫并录，后人启发极深
  era: 清晚期
  dates_known: true
rejections:
