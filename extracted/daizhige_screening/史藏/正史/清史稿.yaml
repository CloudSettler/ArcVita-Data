- name_zh: 李永芳
  why_not: 本篇仅抚顺迎见一笔，降附后事迹在他卷，做事流不足
- name_zh: 安费扬古
  why_not: 十二骑夺所掠、备御甚谨等皆附传战功罗列，待本传再录
