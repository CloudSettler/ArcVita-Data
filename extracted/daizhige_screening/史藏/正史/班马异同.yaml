source: 史藏/正史/班马异同.md
category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 项梁
  score: 8
  worth_why: 阴以兵法部勒宾客、会稽斩守起兵，收陈婴英布立楚怀王以收人心，起事流完整；定陶再破秦军而骄、不听宋义之谏兵败身死，兼为骄兵必败之镜鉴
  era: 秦末
  dates_known: true
- name_zh: 章邯
  score: 8
  worth_why: 秦末柱石之将，败项梁、围钜鹿、周旋漳南；遭赵高猜逼、陈余遗书剖白起蒙恬功高必诛之理，殷墟结盟降楚立雍王——名将困于庙堂而转身的完整周期，深可为鉴
  era: 秦末
  dates_known: true
- name_zh: 范增
  score: 7
  worth_why: 年七十素居好奇计，出山首倡求楚后立怀王以顺民望，鸿门怒劝击杀沛公；后尚有中反间去楚、疽发背死之局（他卷），谋臣始末足成教训
  era: 秦末
  dates_known: true
- name_zh: 宋义
  score: 6
  worth_why: 论武信君军必败而先见败徴，位至卿子冠军；安阳留四十六日拥兵不进、饮酒高会不恤冻饥之士，帐中授首——知兵而不恤士卒之覆辙
  era: 秦末
  dates_known: true
- name_zh: 陈婴
  score: 6
  worth_why: 东阳令史被强立为长，母诫暴得大名不祥，遂举二万人属项梁；成语异军苍头特起之诞生点，明哲不自取之处世范
  era: 秦末
  dates_known: true
- name_zh: 陈余
  score: 6
  worth_why: 遗章邯书历数白起蒙恬功多不赏终以法诛，剖析内外俱孤之危，促成殷墟之盟；后与张耳刎颈交反目、井陉败亡（他卷），交友谋身之鉴
  era: 秦末
  dates_known: true
- name_zh: 倪思
  score: 6
  worth_why: 编班马异同，以史记大书、汉书细字互勘增删移易，创两书对勘之新例，提要称于史学颇有有功；仕历宝文阁学士谥文节，成书即其名场面
  era: 南宋
  dates_known: true
rejections:
- name_zh: 陈胜
  why_not: 提要明言英布陈涉诸传轶而未録，卷内仅作大泽起事与首事自立之背景带过，无其做事流文据，宜另取陈涉世家
- name_zh: 楚怀王熊心
  why_not: 民间牧羊被立为共主，形同项氏傀儡，君主低优先，仅可作时间坐标
- name_zh: 田荣
  why_not: 索杀田假、挟不援楚一节致项梁败死，然诸田内讧主线在田儋传，本卷仅东阿片段，周期不全
- name_zh: 秦嘉
  why_not: 立景驹拒项梁旋败死胡陵，插曲无完整做事周期
- name_zh: 司马欣
  why_not: 留司马门三日不得见赵高、驰还劝章邯自计一节虽要，终为章邯线之配角
- name_zh: 王离
  why_not: 长城军统帅仅见围钜鹿被虏，无独立做事流
- name_zh: 李由
  why_not: 三川守雍丘战殁，附见李斯传，无独立周期
- name_zh: 召平
  why_not: 矫陈王命拜项梁上柱国一节即逝，无周期
