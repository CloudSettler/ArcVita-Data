verdict: has_candidates
candidates:
- name_zh: 项梁
  score: 8
  worth_why: 会稽斩守举义、以兵法部勒宾客成八千精兵、立楚怀王收楚地人心、东阿大破秦军；定陶胜而骄拒宋义之谏夜遭掩击身死，起兵—扩张—骄败做事流完整，骄兵必败之训深刻
  era: 秦末
  dates_known: true
- name_zh: 章邯
  score: 8
  worth_why: 以骊山徒连破陈胜、定陶阵斩项梁、围巨鹿为秦柱石；司马门三日赵高不见、功高见疑，进退两难遂盟殷墟降楚为雍王，名将末路的完整弧线与功臣危局之训兼具
  era: 秦末
  dates_known: true
- name_zh: 宋义
  score: 6
  worth_why: 兵未战先断项梁必败号知兵，论先斗秦赵承其敝亦有谋；然安阳留四十六日不进、送子相齐置酒高会，晨帐中被项羽斩首，坐而运筹者临事畏葸之鉴
  era: 秦末
  dates_known: true
- name_zh: 陈婴
  score: 6
  worth_why: 东阳少年聚二万人强立为王，从母训暴得大名不祥而让兵属项梁，异军苍头特起之典源；终得封侯善终，知止不殆的处世样本
  era: 秦末
  dates_known: true
- name_zh: 陈胜
  score: 6
  worth_why: 首事反秦大泽起义建张楚，本卷仅作背景数语；鸿鹄之志与速兴速亡的完整做事流在陈涉世家，宜据彼篇另录
  era: 秦末
  dates_known: true
- name_zh: 陈余
  score: 5
  worth_why: 遗章邯书历数白起蒙恬功多见诛、劝其倒戈共攻秦分王其地，一纸书成章邯降楚关键推手；本卷仅见此书策，全做事流须参张耳陈余列传
  era: 秦末
  dates_known: true
