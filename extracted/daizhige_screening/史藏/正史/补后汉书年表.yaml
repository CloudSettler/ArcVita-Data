category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 班固
  score: 9
  worth_why: 以私修国史系狱，获释后受诏为兰台令史，续成《汉书》八表十志，创断代史正体；随窦宪北伐作《燕然山铭》勒石纪功；窦宪败后牵连死狱中，功业起落与史笔遗泽皆足为后世镜鉴
  era: 东汉
  dates_known: true
- name_zh: 熊方
  score: 8
  worth_why: 深悼范书阙表、东京典故散缀纪传不能绳贯，遂以一己之力搜讨载籍补《后汉书年表》十卷，义例仿班固而通变，两上进表求成一家之学，四库馆臣称其经纬周密、叙次井然；自题其堂曰补史，补阙续学的治史精神可为范式
  era: 南宋高宗时
  dates_known: true
- name_zh: 范晔
  score: 8
  worth_why: 独力撰成《后汉书》列于前四史，而表志未竟成千古之憾；恃才傲物卷入拥立密谋被诛，狱中与诸甥侄书自评其文，才华与命运相妨的教训深刻
  era: 南朝宋
  dates_known: true
- name_zh: 纪昀
  score: 8
  worth_why: 总纂《四库全书》逾十年，主撰提要定群书门径，主持中国史上最大丛书编纂工程；宦海浮沉仍以著述立身，组织大型学术工程的做事流完整可考
  era: 清乾隆时
  dates_known: true
- name_zh: 班昭
  score: 7
  worth_why: 奉诏入东观藏书阁踵成兄业，续完《汉书》，世称曹大家；中国第一位女史学家，女子治学参政可为典范
  era: 东汉
  dates_known: true
- name_zh: 刘知几
  score: 7
  worth_why: 当廷历数监修国史之弊，直言作史三不可五不可，著《史通》开史学批评之宗；秉笔直书不畏权门的史官风骨可法
  era: 唐
  dates_known: true
- name_zh: 刘昭
  score: 6
  worth_why: 于萧梁之际为范书补注旧志，使《后汉书》诸志得存于世，补志之功不朽；然本篇仅一句带过，事迹简略
  era: 南朝梁
  dates_known: true
- name_zh: 束皙
  score: 5
  worth_why: 追补白华、华黍等亡诗使小雅复全，以补亡续学著称，与熊方补表同调；然本篇仅一句提及，事迹简略
  era: 西晋
  dates_known: true
