category: 史藏/正史
verdict: has_candidates
candidates:
- name_zh: 伊尹
  score: 8
  worth_why: 辅汤伐夏建商；放太甲于桐宫三年，俟其悔过乃迎之复位——摄政而不篡、还政于君的完整做事流，兼具名场面与典范意义
  era: 商初（约前16世纪）
  dates_known: true
- name_zh: 太甲
  score: 7
  worth_why: 被放桐宫三年，悔过自责终成明君；放逐—反省—复位弧线完整，是改过迁善的经典教训
  era: 商初（约前16世纪）
  dates_known: true
- name_zh: 纪昀
  score: 7
  worth_why: 四库全书总纂官，主持编纂成书，本篇提要即恭校署名于其手；凭目录与史学知识可立完整做事流
  era: 清乾隆间（1724-1805）
  dates_known: true
- name_zh: 盘庚
  score: 7
  worth_why: 徙都河南（殷），力排众议迁都以改命，商代中兴的关键决策点；世表注虽仅三字而事件可考
  era: 商代中期（约前13世纪）
  dates_known: true
- name_zh: 汪越
  score: 6
  worth_why: 撰读史记十表十卷，成书后致书友人遍求商榷印证、与徐克范同时补订——治学求证、同人互校的做事流可法
  era: 清康熙间（康熙乙酉举人）
  dates_known: true
- name_zh: 徐克范
  score: 5
  worth_why: 应汪越之请细加推勘、订讹砭漏并补义成书，为同代商榷修订之范例；事迹仅存于本书后记，稍简
  era: 清康熙间
  dates_known: true
