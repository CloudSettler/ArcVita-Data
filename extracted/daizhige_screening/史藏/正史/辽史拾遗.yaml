verdict: has_candidates
candidates:
- name_zh: 耶律阿保机
  score: 9
  worth_why: 完整做事流俱全：缘起于八部大人三年一代旧制、决意仿中国之主不代立、筑汉城仿幽州制安置汉人、盐池设伏尽杀诸部大人并八部为一国、建元神册称帝；名场面密集，如与李克用云中握手约为兄弟、拔朔州擒李嗣本勒石纪功青冢南；时代坐标兼可与朱梁李晋逐鹿互证
  era: 五代契丹
  dates_known: true
- name_zh: 厉鹗
  score: 7
  worth_why: 缘于辽朝书禁最严一朝图籍澌灭无征，遂摘录旧文为纲、防考他书三百余种，补刘守光诸人之传及礼乐志幡胜防帐金冠赋税名目之阙，厘正国语解次第，自比裴松之三国注；钩稽散佚钩沉月日，学者做事流完整可为范
  era: 清康熙乾隆间
  dates_known: true
- name_zh: 李存勖
  score: 7
  worth_why: 凭史学知识，其嗣晋王破梁救潞、擒刘守光灭燕、灭后梁称帝而终伶人亡国，兴衰全周期；本篇载其吊丧结好契丹约为父子、贿金缯求骑军救潞、单骑抵幽州城下擒守光之始末，是灭燕一役的完整决策线
  era: 五代后唐
  dates_known: true
- name_zh: 刘仁恭
  score: 6
  worth_why: 霜降辄遣人焚塞下野草致契丹马多饥死、复以良马赂之买牧地，是中原防契丹的名场面；敛境内钱瘗于山岭、令民用堇泥为钱、禁茶自采草木为茶，为经济自毁教训；做事周期可作反鉴，惟事迹散附他人，缓
  era: 唐末五代
  dates_known: true
- name_zh: 刘守光
  score: 5
  worth_why: 囚父自称节度使、僭号称大燕改元应天、乞援契丹无信不获、城破单骑逃亡至乞食田父张师造家而败露被擒，败亡叙事完整可作骄狂之戒，然多为父兄与他叙事之附庸，缓
  era: 唐末五代
  dates_known: true
rejections:
- name_zh: 卢文进
  why_not: 本篇止载杀李存矩来降一节，其引契丹攻幽州及后归南唐诸事散见他书，独立做事周期本篇不备
- name_zh: 李克用
  why_not: 本篇仅云中会盟约为兄弟及卒后告哀数笔，其主脉在唐末五代史而非辽事，宜俟五代文献再录
- name_zh: 述律平
  why_not: 本篇仅献盐池犒宴伏兵之策一见，谋略虽奇，无独立完整做事流
- name_zh: 刘守文
  why_not: 兄弟相攻之配角，借兵被擒身死，事迹简略无自成周期
- name_zh: 赵志忠
  why_not: 传文仅数十字，仅述其仕北脱身归宋能述北中世次，无做事周期
- name_zh: 纪昀
  why_not: 提要署名之四库馆臣，本篇无事迹可考
- name_zh: 周德威
  why_not: 仅拒契丹于居庸关一句带过，无做事流
