candidates:
- name_zh: 耶律阿保机
  score: 9
  worth_why: 统一契丹八部建辽、制契丹文字、蕃汉分治开南北面官制先河、东灭渤海；开国建制俱全，本卷君名条明载（阿保机字安巴坚）
  era: 唐末五代（契丹）
  dates_known: true
- name_zh: 完颜阿骨打
  score: 9
  worth_why: 以二千五百人起兵破辽、建金称帝、创勃极烈与猛安谋克之制；灭辽奠基做事流完整，本部金史语解君名卷首当载
  era: 辽末金初
  dates_known: true
- name_zh: 忽必烈
  score: 9
  worth_why: 行汉法、建大元定都大都、灭宋一统、创行省制；本部元史语解帝名卷首当载
  era: 大蒙古国至元
  dates_known: true
- name_zh: 耶律楚材
  score: 8
  worth_why: 谏止屠城、定中原赋税户籍、以儒存文脉；一言救百万生民，蒙古汉化关键推手
  era: 蒙古国时期
  dates_known: true
- name_zh: 萧绰
  score: 8
  worth_why: 承天摄政近三十年、岐沟关破宋、澶渊之盟定百年和局；辽之极盛期女主典型
  era: 辽（北宋初）
  dates_known: true
- name_zh: 耶律大石
  score: 8
  worth_why: 辽亡西走万里建西辽、卡特万之战以少胜破十万联军；再造帝国的完整做事流
  era: 辽末·西辽
  dates_known: true
- name_zh: 郭守敬
  score: 8
  worth_why: 授时历测天制历、岁实之精密同于今公历、开凿通惠河、创简仪高表；元史有传的技术大家
  era: 元初
  dates_known: true
- name_zh: 述律平
  score: 7
  worth_why: 辅阿保机定业、称制立君、断腕殉葬名动塞北；晚年争立致内争，功过俱可为训
  era: 辽初
  dates_known: true
- name_zh: 丘处机
  score: 7
  worth_why: 雪山论道一言止杀、保全中原教众、兴全真一脉；元史人名卷当载
  era: 金末元初
  dates_known: true
- name_zh: 耶律德光
  score: 7
  worth_why: 受献燕云十六州改写三百年南北格局、灭后晋入汴建国号大辽；北返病殁，得失俱足为鉴；本卷太宗小字条可据
  era: 五代
  dates_known: true
- name_zh: 李元昊
  score: 7
  worth_why: 建西夏、创西夏文字、好水川等役破宋后以庆历和议收局；本卷提要且存其兀卒误译为吾祖之鉴
  era: 北宋（西夏）
  dates_known: true
- name_zh: 脱脱
  score: 7
  worth_why: 逐伯颜行更化、都总裁宋辽金三史、治河用贾鲁；终为谗构鸩死贬途，功败垂成之训；本卷提要明载托克托修三史
  era: 元末
  dates_known: true
- name_zh: 纪昀
  score: 6
  worth_why: 总纂四库全书暨本国语解、以两合三合字音考订三朝译名；文治编纂型做事流之典型，本卷署名可据
  era: 清乾隆
  dates_known: true
