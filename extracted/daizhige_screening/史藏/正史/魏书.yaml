- name_zh: 元宏（拓跋宏，孝文帝）
  score: 10
  worth_why: 迁都洛阳、禁胡服断北语改汉姓定姓族，均田制三长制落地，中国史上最彻底的自上而下改革，影响隋唐三百年
  era: 北魏孝文帝朝
  dates_known: true
- name_zh: 拓跋焘（太武帝）
  score: 9
  worth_why: 统一北方灭夏灭北凉、北破柔然南抵瓜步；又以国史之狱与灭佛留下千古警示
  era: 北魏太武帝朝
  dates_known: true
- name_zh: 拓跋珪（道武帝）
  score: 9
  worth_why: 收离散部落重建代魏、参合陂大破后燕、离散诸部编户定居、定都平城；晚年暴戾为子所弑
  era: 北魏开国
  dates_known: true
- name_zh: 冯太后（文明太后）
  score: 9
  worth_why: 二度临朝定太和改制三支柱——俸禄制、均田制、三长制，均田制为隋唐田制之源
  era: 北魏文成至孝文之世
  dates_known: true
- name_zh: 崔浩
  score: 9
