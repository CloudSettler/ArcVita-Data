category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 赵良嗣
  score: 9
  worth_why: 原名马植，由辽投宋献联金灭辽之策，延庆殿廷对言先动则制人后动则制於人，促成海上之盟；终以谋国而祸国身贬死，为战略误判与乱世人才去就的双重教材
  era: 北宋末
  dates_known: true
- name_zh: 童贯
  score: 8
  worth_why: 以宦官拜太师总边事二十年，收复河湟、平方腊而北伐燕云溃败；力主海上通金措置使团，集宦官典兵与兴兵误国教训于一身
  era: 北宋末
  dates_known: true
- name_zh: 蔡京
  score: 8
  worth_why: 四度为相，行香茶盐矾与和籴均籴以聚敛备战；力主收留赵良嗣开启北事；书法大家与祸国权臣一身，权相兴利误国的争议样本
  era: 北宋末
  dates_known: true
- name_zh: 邓洵武
  score: 7
  worth_why: 知枢密院屡折伐燕之议，进伐燕利害二十七条，引赵普谏疏与诸路兵食旁通册预警；先见之言不纳，谏臣知几不行的镜鉴
  era: 北宋末
  dates_known: true
- name_zh: 王黼
  score: 7
  worth_why: 复倡兼弱攻昧之说以动上心，重启伐燕终致靖康之祸；轻佻相臣误国的直接推手
  era: 北宋末
  dates_known: true
- name_zh: 完颜阿骨打
  score: 7
  worth_why: 女真起兵灭辽建金的开创之主，护步答冈诸役与猛安谋克制度为成事样本；本卷仅露端倪，全书宋金交涉的主要对手方
  era: 辽末金初
  dates_known: true
- name_zh: 郑居中
  score: 6
  worth_why: 廷折蔡京，直斥使百万生民肝脑涂地公实使之；引景德庆历守盟故事主保境息民，诤臣名场面可观而做事周期较简
  era: 北宋末
  dates_known: true
- name_zh: 马政
  score: 5
  worth_why: 首批泛海使金议事使臣，海上之盟的执行人物；事迹简略可缓录
  era: 北宋末
  dates_known: true
- name_zh: 董才
  score: 5
  worth_why: 辽末巨寇董庞儿，自号扶宋破虏大将军降宋赐名赵诩；乱世边民流徙投机样本，事迹偏简
  era: 辽末
  dates_known: false
rejections:
