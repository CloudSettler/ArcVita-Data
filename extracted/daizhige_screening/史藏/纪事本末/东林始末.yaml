source: 史藏/纪事本末/东林始末.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 顾宪成
  score: 10
  worth_why: 文选郎中任上力主廷推王家屏等，抗旨被削籍；归里讲学于东林书院，天下趋之，受黜者身去而名益高；与王锡爵庙堂天下是非之对答传为名言；东林与浙党之对立由此发端，垂五十年，做事流完整且有名场面
  era: 明万历
  dates_known: true
- name_zh: 孙鑨
  score: 8
  worth_why: 万历二十一年京察力保虞淳熙、杨于庭，抗阁臣压服；专权结党之辨义正辞严；宁夺俸去位不改其守，堪为持正去官之典型
  era: 明万历
  dates_known: true
- name_zh: 郭正域
  score: 8
  worth_why: 楚宗案中力主必勘，断言王假则华越当别论、王真则华越罪不胜诛，识虑周至；遭沈一贯党羽围攻，妖书案几罹不测，终罢去；直臣遭构陷之完整样本
  era: 明万历
  dates_known: true
- name_zh: 高攀龙
  score: 7
  worth_why: 以行人身份申救得罪诸臣，直陈辅臣不附己、近时不利用正人之弊，谪揭阳典史不屈；后成东林领袖，本篇已见其骨鲠开端
  era: 明万历
  dates_known: true
- name_zh: 孙丕扬
  score: 7
  worth_why: 都御史任上力持公道，上丁此吕访单、辨蒋时馨案，与沈思孝交恶仍不挠；乞休疏二十上以去就相争；本篇见其持正与困局
  era: 明万历
  dates_known: true
- name_zh: 沈一贯
  score: 7
  worth_why: 浙党之首辅专权典型：操纵廷推、借妖书楚宗构陷郭正域、京察庇私人；受黜者身去名高而彼持权求胜，终八十疏乃罢；权臣误国之教训标本
  era: 明万历
  dates_known: true
- name_zh: 赵南星
  score: 6
  worth_why: 考功郎中主察秉公，为留虞淳熙等被镌三秩调外；东林三领袖之一，本篇见其清议受挫之起点
  era: 明万历
  dates_known: true
- name_zh: 赵用贤
  score: 6
  worth_why: 检讨任上谏张居正夺情削籍，负气节；后因绝婚小节被讼罢官；气节之士困于细故构陷之例
  era: 明万历
  dates_known: true
- name_zh: 温纯
  score: 6
  worth_why: 左都御史力持京察公道，劾于永清、姚文蔚刺及沈一贯，屡争不报终致仕去而京察始奏；台纲之争的关键一人
  era: 明万历
  dates_known: true
- name_zh: 沈鲤
  score: 5
  worth_why: 列天戒民穷十事书牌每入阁拜祝，妖书案赖上知其心得免；居位四载清慎，然本篇事迹简略
  era: 明万历
  dates_known: true
- name_zh: 王家屏
  score: 5
  worth_why: 以谏册储罢归，犹居廷推首名；国本之争中直臣阁臣之坐标，本篇仅见片段
  era: 明万历
  dates_known: true
