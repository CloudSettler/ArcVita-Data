candidates:
- name_zh: 赵起
  score: 8
  worth_why: 以埠役起家结金钱会，铸义记钱聚众数千，借团练之名坐大，破温州郡城夺印；兴起到覆亡的完整造事周期，是民间结社坐大与官府失察的名案例
  era: 清咸丰年间
  dates_known: true
- name_zh: 孙锵鸣
  score: 8
  worth_why: 翰林在籍督办团练，最早洞察乱萌，屡争道府主张剿贼、力斥借贼为练是官驱民从贼；预测皆验，为士人担当与言不见用的典型
  era: 清咸丰年间
  dates_known: true
- name_zh: 陈安澜
  score: 7
  worth_why: 受牒办团被会党仇视焚家，倾赀募台州船夹攻钱仓几获赵起；民间自保与自救之典范
  era: 清咸丰年间
  dates_known: true
- name_zh: 周兆荣
  score: 6
  worth_why: 金钱会源头人物，以妖术敛钱创铜钱壮，其被剿败走直接促成赵起起事；事迹偏简为缘起配角
  era: 清咸丰年间
  dates_known: true
rejections:
- name_zh: 朱秀三等七结义者
  why_not: 仅名列结盟，无独立做事周期
- name_zh: 翟惟本
  why_not: 失职昏官，其事为赵起成败之注脚，教训已含于赵起与孙锵鸣条目中
- name_zh: 志勋、黄惟诰
  why_not: 同为玩寇失城官僚，无完整做事流</arg_value>
