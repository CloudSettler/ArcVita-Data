source: 史藏/纪事本末/元史纪事本末.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 郭守敬
  score: 10
  worth_why: 授时历为推步之法千年之冠，简仪高表四海测验，做事流自水利起点至成历完满
  era: 元世祖朝
  dates_known: true
- name_zh: 伯颜
  score: 9
  worth_why: 领平宋大军顺江而下、驻建康不掠一物；又多载衣裘入乃颜境侦变、分三道脱身报状，智勇成事
  era: 元世祖朝
  dates_known: true
- name_zh: 贾鲁
  score: 9
  worth_why: 受命挽黄河复故道，工程与石人一只眼之谣并起，功成而乱起，成败两训兼具
  era: 元末至正间
  dates_known: true
- name_zh: 脱脱
  score: 9
  worth_why: 主修辽金宋三史、行更化之政、两征徐州，功高遭谗而死，成事与教训俱全
  era: 元末至正间
  dates_known: true
- name_zh: 忽必烈
  score: 8
  worth_why: 建元行汉法、灭宋、平乃颜与海都之叛，君主中做事突出，可作元代枢纽坐标
  era: 元世祖朝
  dates_known: true
- name_zh: 刘福通
  score: 8
  worth_why: 首举红巾立韩林儿，三路北伐撼动元祚，虽败而天下因之瓦解
  era: 元末至正间
  dates_known: true
- name_zh: 王保保
  score: 8
  worth_why: 转战中原保元社稷，顺帝北迁后屡用兵图兴复，太祖称王保保真男子
  era: 元末明初
  dates_known: true
- name_zh: 董士选
  score: 8
  worth_why: 自请往平赣州刘六十，法置乱源不数日就擒，事平不伐唯请黜赃吏，为将相立身典范
  era: 元世祖朝
  dates_known: true
- name_zh: 高兴
  score: 8
  worth_why: 命人挟束薪六日诱尽矢石，爇薪焚山斩二万破陈吊眼，后偕史弼远征爪哇，将略成事
  era: 元世祖朝
  dates_known: true
- name_zh: 特里克
  score: 8
  worth_why: 单使直造海都境，厉声斥宴间阴谋，得皮服三袭而归，献坚垒勿追之策，使节行事之楷模
  era: 元世祖朝
  dates_known: false
- name_zh: 朱清、张瑄
  score: 8
  worth_why: 创行海道运粮，元代漕运大局由二人之手定，制度生成之典型
  era: 元世祖朝
  dates_known: true
- name_zh: 许衡
  score: 8
  worth_why: 佐定历法律令、主持国子学，科举学校之制多出其议，汉法推行之枢
  era: 元世祖朝
  dates_known: true
- name_zh: 阿合马
  score: 7
  worth_why: 理财专权敛财激变，死于王著之刺，权奸覆国之训
  era: 元世祖朝
  dates_known: true
- name_zh: 托尔楚
  score: 7
  worth_why: 弃妻子以十二骑驰建州，两中流矢转斗而前射杀渠酋，保懿州全城，民泣称非宣慰公吾属无遗种
  era: 元世祖朝
  dates_known: false
- name_zh: 阿实克布哈
  score: 7
  worth_why: 献先抚安诸王乃行天讨之策，使乃颜势孤，后为武宗朝名相
  era: 元世祖朝
  dates_known: true
rejections:
- name_zh: 陈桂龙
  why_not: 叛降无常聚众据险，无完整做事周期
- name_zh: 陈吊眼
  why_not: 拥众据砦旋遭剿灭，事迹单线无阶段可言
- name_zh: 黄华
  why_not: 降而复叛败走自焚，仅作乱事背景
- name_zh: 钟明亮
  why_not: 屡降复叛反复无常，事迹零碎
- name_zh: 乃颜
  why_not: 称叛半年即败被执，仅作至元二十四年之时间坐标
- name_zh: 海都
  why_not: 犯边数十年纯为北边之患，无建设性做事流
