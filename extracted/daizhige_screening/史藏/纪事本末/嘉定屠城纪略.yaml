source: 史藏/纪事本末/嘉定屠城纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 黄淳耀
  score: 9
  worth_why: 倡守嘉定、画地分守、立挨门出丁法按三等派丁稽勤惰，城破与弟渊耀殉节；制度创造与气节名场面兼备，做事周期完整
  era: 明末清初
  dates_known: true
- name_zh: 侯峒曾
  score: 9
  worth_why: 受子与淳耀之促入城主大局，大事专属峒曾淳耀处分、亲主东门，揭旗嘉定恢剿义师之精神领袖，城破投水殉国
  era: 明末清初
  dates_known: true
- name_zh: 李成栋
  score: 8
  worth_why: 屠嘉定主凶——吴淞船营被乡兵夜焚、四十骑求援罗店被围溃归、纵兵大掠破镇磔唐景耀；由降将而屠城，强梁遭反噬的沉痛镜鉴
  era: 明末清初
  dates_known: true
- name_zh: 钱谦益
  score: 7
  worth_why: 南都破后率先降附、密遣周荃说豫王传檄定吴中、欲树德东南以自解于吴人士；东林魁首失节之污点与其后半生暗通复明，足为士节镜鉴
  era: 明末清初
  dates_known: true
- name_zh: 唐景耀
  score: 6
  worth_why: 面数降将吴宏宇罪、令归告李成栋速反正免大戮，复立马桥南大书白牌谕成栋降，被执磔于市；小人物壮烈一幕
  era: 明末清初
  dates_known: true
- name_zh: 吴志葵
  score: 5
  worth_why: 反面典型——葛麟早断其庸奴夸诞必误国事；以伪牌虚声令嘉定乡兵夜焚清船，已而兵终不至，致城众望穿见弃号哭而走，误城之教训
  era: 明末清初
  dates_known: true
- name_zh: 葛麟
  score: 5
  worth_why: 迂道访友、忧淳耀纯儒不谙世故、面断志葵庸奴必误国并诫以天下事尚可为勿卤莽，后事验如其言若明镜蓍察；识人之明
  era: 明末清初
  dates_known: false
rejections:
- name_zh: 须明征
  why_not: 讹言扇动、称署守备劫取官银招摇街市、终被城中民众斩首刳肠；反复无行、无完整做事流
- name_zh: 张维熙
  why_not: 清署新令，两度闻警仓卒遁走，无守土作为
- name_zh: 周荃
  why_not: 口辩降客单骑安抚吴中，事败即潜归豫王，仅传语过场
- name_zh: 黄家鼒
  why_not: 佐荃安抚旋被杨文骢执戮于市，无事迹可录
- name_zh: 杨文骢
  why_not: 文中仅执杀家鼒、载库银而去一节，做事流不完整，宜另据本传评估
- name_zh: 钱默
  why_not: 纨绔旧令尽发公帑、重贿求卫送出境而遁，纯反面过场
- name_zh: 吴宏宇
  why_not: 降清为清兵前导、衔恨构陷唐景耀，无做事周期
