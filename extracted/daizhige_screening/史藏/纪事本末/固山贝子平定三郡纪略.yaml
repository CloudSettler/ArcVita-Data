source: 史藏/纪事本末/固山贝子平定三郡纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 福喇塔
  score: 8
  worth_why: 康熙十三年耿逆闽变，贝子受封宁海将军渡钱塘驰救温台，斩贼将吴长春、朱飞熊，连复数县；绿嶂宝胜寺设伏大溃贼军，屯君子峰炮击温城；夜袭反击斩首二万余，将军桥扼归路贼尽堕水；见尸填大河坠泪收骸、申禁妄杀以体好生之心，风雨中亲牵马与士卒同劳，终尽瘁军中谥惠献——缘起、征战、决策、结局俱全，宗室统兵典范
  era: 清康熙年间三藩之乱
  dates_known: true
- name_zh: 陈丹赤
  score: 6
  worth_why: 温处巡道，警讯初至即设挨排器械严城守；大观亭兵变中抗声识破伏杀、直斥非战则守，骂贼殉节而刺客当场暴毙，忠烈名场面足为后训；惜事迹止于殉难，无后续做事周期
  era: 清康熙十三年
  dates_known: true
rejections:
- name_zh: 马琾
  why_not: 永嘉知县骂贼殉节并入大观亭之变，个人无独立做事周期，托孤事亦仅一句
- name_zh: 曾养性
  why_not: 叛军都督聚众十万、铸裕民通宝造炮制火箭、悬示勒饷、屡战屡败终坠马浮水遁城，过程虽详但是反面人物，败绩无足为训
- name_zh: 康亲王杰书
  why_not: 仅奉命讨逆分路征剿、咨会两见，本篇功业细节皆归福喇塔，无独立事迹可纪
- name_zh: 姚启圣
  why_not: 传中仅随军点名一见，其平闽平台事不在本篇，无做事周期
- name_zh: 祖宏勋
  why_not: 温镇通敌内应致郡城陷落，事出串谋而无谋略决策可纪，仅作奸细教训
- name_zh: 夏声
  why_not: 生员向导劝民收割通商贸易，功劳附见于贝子事内，自身无完整做事流
- name_zh: 割稻高
  why_not: 结盟通贼刺杀二忠臣后暴毙，仅一幕反噬，无做事周期
