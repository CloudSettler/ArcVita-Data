source: 史藏/纪事本末/平台纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 朱一贵
  score: 7
  worth_why: 饲鸭佣工假托明朝后裔结盟起事，旬月间席卷全台、据府城称永和王复败亡，造反兴衰周期完整；承平日久、吏治失修酿变的镜鉴，鸭母王传说为名场面
  era: 清康熙年间
  dates_known: true
- name_zh: 蓝鼎元
  score: 8
  worth_why: 东征逾载赞画行间，中夜磨盾草檄、招降绥靖番黎；事后愤野史失实，据事直书成平台纪略，以闽人言闽事求实存信，史家求真风骨与治台经纶见识俱佳
  era: 清康熙雍正间
  dates_known: true
- name_zh: 蓝廷珍
  score: 8
  worth_why: 自厦门请缨渡台，会师鹿耳门复府城，穷追擒获朱一贵，复穷搜诸山绥靖番黎，旬日定乱，完整平乱做事流；事后治台建言开台经营之策为代表作
  era: 清康熙雍正间
  dates_known: true
- name_zh: 施世骠
  score: 7
  worth_why: 水师提督闻警即发，跨海会攻鹿耳门，克复府城而定全台，事定旋卒于军，与蓝廷珍并称平台功首，靖海世家之后的做事周期完整
  era: 清康熙年间
  dates_known: true
- name_zh: 许云
  score: 6
  worth_why: 春牛埔血战至矢穷炮尽，左手被斫断犹步行手刃数十贼，遗言生不能杀尽逆奴死必来歼灭汝等，殉国名场面，可为武人死节之范
  era: 清康熙年间
  dates_known: true
rejections:
- name_zh: 欧阳凯
  why_not: 总兵位高而仅一战被刺殉难一节点，无完整做事流
- name_zh: 周应龙
  why_not: 逗留失机、纵番杀良激变、弃军遁逃的反面教材，然传文仅数段败绩，周期残缺
- name_zh: 游崇功
  why_not: 今日遑知有家哉一句名言动人心，事迹终究单薄
- name_zh: 李茂吉
  why_not: 骂贼断缚死节片段，仅存气节瞬间无做事周期
- name_zh: 高永寿
  why_not: 报警不信的插曲人物，事后遍寻贼营不可得，事涉怪异难为征信
- name_zh: 杜君英
  why_not: 客民起事与朱一贵合流，叙事散附他人传内，独立做事流不足
- name_zh: 游崇功
  why_not: 重复项剔除占位
