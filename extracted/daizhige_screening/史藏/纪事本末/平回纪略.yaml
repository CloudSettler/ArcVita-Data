source: 史藏/纪事本末/平回纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 阿桂
  score: 8
  worth_why: 乾隆名臣名将，两次受命统师平回：建营龙尾山、围木城断水道、调金川土练克华林山、引涧别流困石峰堡；平生兼定金川、屯田新疆、治河诸大功，做事流完整且料敌制胜名场面密集
  era: 清乾隆年间
  dates_known: true
- name_zh: 王廷赞
  score: 7
  worth_why: 兰州被围时古稀方伯慷慨誓师，登城御贼、防奸断火、开仓赈恤并攀城采买粮三千石；以马明新示城退敌，危城守御与民信之道堪称危机治理范本
  era: 清乾隆四十六年
  dates_known: true
- name_zh: 马明新
  score: 7
  worth_why: 倡立新教自称掌教，以教权聚众竟致子杀父弟杀兄；身陷囹圄而身后连起辛丑甲辰两役，教门延续百年，宗教动员的兴始与祸乱教训俱全
  era: 清乾隆年间
  dates_known: true
- name_zh: 苏四十三
  score: 7
  worth_why: 佯服罪夜杀总戎、雪夜克河州、直逼兰州、据华林山死守四阅月，清代西北回民第一次大规模起事，起落完整，佯降袭杀与圣人之号两幕极具名场面潜力
  era: 清乾隆四十六年
  dates_known: true
- name_zh: 田五
  score: 6
  worth_why: 托为马明新复雠再起，预筑石峰堡积粮二载为巢，攻城劫仓、中枪死而余众犹困大营；起事组织与覆灭教训可考
  era: 清乾隆四十九年
  dates_known: true
- name_zh: 杨公
  score: 6
  worth_why: 伏羌知县预捕内应、笼络回绅马云龙立约散财寸步不离、编汉九回一守城，兵临而不失，危机攻心之术可法；惜传文无名，生卒难考
  era: 清乾隆四十九年
  dates_known: false
rejections:
- name_zh: 韩二
  why_not: 仅随苏四十三转战旋即战死，无独立做事周期
- name_zh: 韩一的把拉
  why_not: 头目之名数见，唯记遇害一事，事迹简略
- name_zh: 图都督
  why_not: 救援截杀与中伏陷没皆一笔带过，无做事主线
- name_zh: 马云龙
  why_not: 系被杨公笼络防范之对象，本人无自主事迹
- name_zh: 勒尔谨
  why_not: 总制仅记进剿防堵数语，行事简略无完整周期
- name_zh: 福康安
  why_not: 文中仅奉命办善后一句，无可立轴之事
- name_zh: 周牧
  why_not: 河州城陷自刎一句即殁，无可考做事经历
