candidates:
- name_zh: 阿桂
  score: 9
  worth_why: 两度任定西将军主持平定两金川全局，木果木败后重整军心、分路合围勒乌围噶拉依，五年用兵奏全功，兼主持设镇安屯善后，做事流完整且晚遭和珅倾轧不倒，庙堂阅历可鉴
  era: 清乾隆年间
  dates_known: true
- name_zh: 福康安
  score: 8
  worth_why: 初出茅庐即赴金川前线率千人助战夺甲索，后以海兰察协击屡克险隘河桥，功封世爵绘像紫光阁，其用兵风格以迂直出新意
  era: 清乾隆年间
  dates_known: true
- name_zh: 温福
  score: 7
  worth_why: 以定边将军克布朗郭宗底木达俘泽旺，惜移营木果木大营被贼翻蹑劫营遇害，小金川得而复失，是重路轻骑新式匿失利、势在一隅冒进酿败之经典教训案例
  era: 清乾隆年间
  dates_known: true
- name_zh: 岳钟琪
  score: 8
  worth_why: 一等公；先被劾坐狱年余后起复，于大金川番营屯洞、传闻其携栈道旧事再出，与孙施轻骑深入番地嚇番效命，老将矍铄之姿态可入时间轴
  era: 清雍正乾隆年间
  dates_known: true
- name_zh: 索诺木
  score: 5
  worth_why: 促浸土司之子，鸱张蚕食负险抗抚，兼僧格桑颉颃清军五年终致兵败泥首出寨捧印生俘，虽为败闽样不属正然可作资助警示对照人物值得缓录
  era: 清乾隆年间
  dates_known: true
