source: 史藏/纪事本末/弘光朝伪东宫伪后及党祸纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 史可法
  score: 10
  worth_why: 拥立之争中持正遗书阻立福王；被挤出朝仍督师扬州，开诚感化高杰使其誓愿效死；扬州城破殉国，梅花岭衣冠冢为千古名场面；忠烈气节与四镇分封之失教训兼备，做事周期完整
  era: 明末南明弘光
  dates_known: true
- name_zh: 李自成
  score: 8
  worth_why: 驿卒起事至闯王进京、逼死崇祯、建国大顺、一片石败退、九宫山结局，农民战争全周期名场面；本文载其陷河南府擒福王、遣兵南下宿迁、败走西安诸事，可作录入切入点
  era: 明末
  dates_known: true
- name_zh: 朱由检
  score: 8
  worth_why: 少年即位定逆案、焚三朝要典、锢魏党终身；宵衣旰食十七年而李自成破京自缢煤山，君王死社稷之名场面；勤政而亡国的深刻教训，属有突出做事之君主
  era: 明末
  dates_known: true
- name_zh: 魏忠贤
  score: 8
  worth_why: 市井无赖至九千岁；兴大狱使东林骈死牢户、颁三朝要典构陷清流；崇祯立而自缢阜城——权阉祸国完整周期，顶级反面教材
  era: 明末天启
  dates_known: true
- name_zh: 左懋第
  score: 8
  worth_why: 奉使燕京不辱使命、拒降骂贼从容就义，世称明末文天祥；使节死节名场面，本文明书不屈死，弧线完整
  era: 南明弘光
  dates_known: true
- name_zh: 马士英
  score: 7
  worth_why: 谪戍起复、一纸遗书定策拥立、挟功为首辅、结四镇通中官、出史可法于外、荐阮大铖起党狱；南渡首辅误国全周期，反面教训完整
  era: 南明弘光
  dates_known: true
- name_zh: 阮大铖
  score: 7
  worth_why: 逆案废锢混迹声伎、以伶人为谍窃听名士高会、留都防乱公揭逼其匿身牛首、借拥立骤贵、伏地哭以三案挑激帝怒、兴大狱杀清流；小人报复循环完整，奸人标本
  era: 南明弘光
  dates_known: true
- name_zh: 刘宗周
  score: 7
  worth_why: 自称草莽孤臣请帝亲征、言四镇不宜封、疏劾中外诸臣皆可诛而遭四镇合围攻讦；蕺山学派宗师、黄宗羲之师，杭州破后绝食殉国，谏诤气节之鉴
  era: 明末南明
  dates_known: true
- name_zh: 黄得功
  score: 7
  worth_why: 四镇中独忠勇奉朝命；护驾荻港、部下哗变、中箭自刎死节；与其他三镇骄悍对照，悍将死节之训
  era: 南明弘光
  dates_known: false
- name_zh: 顾宪成
  score: 7
  worth_why: 罢官讲学东林、名流翕附、清议起而晚明党祸始；书院议政与党争源头，制度性教训；家事国事天下事名联传世
  era: 明中后期
  dates_known: true
- name_zh: 高杰
  score: 6
  worth_why: 闯将降明、骄悍困史可法于扬州、被至诚感化誓愿为可法死、谋北伐、睢州被许定国诱杀；浪子回头悲剧名场面
  era: 南明弘光
  dates_known: false
- name_zh: 左良玉
  score: 6
  worth_why: 荆襄拥兵数十万、避李自成东下、清君侧内讧讨马士英、病死舟中而子降清；藩镇尾大不掉之鉴
  era: 明末南明
  dates_known: true
- name_zh: 钱谦益
  score: 6
  worth_why: 东林魁首文坛宗主，本文载其奏辨大悲案；南京城头迎降、水太凉之讥、晚年暗中通南明；士节得失之训，前后反差完整
  era: 明末清初
  dates_known: true
- name_zh: 袁继咸
  score: 6
  worth_why: 疏言三朝要典不宜存、遭构陷庇护三案之讥；被马士英下狱、左良玉东下劫其军、押北不屈死节；本文存其定策侧影，全周期可据他书补全
  era: 南明弘光
  dates_known: true
- name_zh: 侯方域
  score: 5
  worth_why: 复社四公子、署留都防乱公揭讨阮大铖、避仇奔走、晚应清闱失节；桃花扇原型，才子无守之训
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 朱由崧
  why_not: 弘光帝为君主低优先，优柔宽厚仅作时间坐标；误国教训已由马士英、阮大铖条目承载
- name_zh: 朱翊钧
  why_not: 万历帝为君主低优先，国本之争仅以其态度为坐标，本文无突出做事可录
- name_zh: 朱常洵
  why_not: 传中仅录遇害与葬仪赐恤，无做事周期
- name_zh: 朱常淓
  why_not: 仅避贼南奔、后于杭州被执以降二事，事迹单薄
- name_zh: 郑贵妃
  why_not: 国本之争宫闱背景人物，无独立做事流
- name_zh: 沈一贯
  why_not: 本文仅擅权调护数句，妖书案京察全周期在本文之外
- name_zh: 高攀龙、邹元标、赵南星、孙丕扬
  why_not: 仅列名东林诸贤，本文无具体做事可提取
- name_zh: 姜曰广
  why_not: 定策持正、遭四镇合疏攻讦去位，事迹散碎不成周期，身后殉国须另据他书
- name_zh: 周镳
  why_not: 复社盟主主持清议、被构下狱瘐死，弧线简短，可附于阮大铖党祸条目观察
- name_zh: 吕大器
  why_not: 疏劾士英、被逮不至，仅存断片
- name_zh: 许定国
  why_not: 仅诱杀高杰、叛降一事，无做事周期
- name_zh: 陈洪范
  why_not: 阴输款为间、后执潞王以降，事迹零碎无建树
- name_zh: 陈子龙、夏允彝、祁彪佳、杨廷枢
  why_not: 本文仅列名清流，其抗清殉节全周期须俟专传另录
- name_zh: 张慎言、徐石麟、郭维经
  why_not: 争阮大铖之出而相继引去，事迹简略
- name_zh: 张孙振、杨维垣、袁宏勋
  why_not: 阮党爪牙，仅见起狱助恶，无独立做事流
