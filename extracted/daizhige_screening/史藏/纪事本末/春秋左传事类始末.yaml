source: 史藏/纪事本末/春秋左传事类始末.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 子产
  score: 9
  worth_why: 为政一篇俱全，作封洫定田界，作丘赋，铸刑书开成文法先河，不毁乡校纳民言，坏晋馆垣争朝礼，临终告子皮为政必俭；孔子叹为古之遗爱
  era: 春秋郑国
  dates_known: true
- name_zh: 郑庄公
  score: 8
  worth_why: 多行不义必自毙与掘地见母两成语诞生点，繻葛之战射王中肩震动天下，假王命伐宋、入许退敌，开春秋小霸之局，做事流完整
  era: 春秋郑国
  dates_known: true
- name_zh: 晏婴
  score: 8
  worth_why: 事灵庄景三公而齐安；崔杼弑君之难不改其节，踊贵屦贱之谏省刑，预知姜弱妫昌、三家将篡，辞封自廉；谏臣与智者双重典范
  era: 春秋齐国
  dates_known: true
- name_zh: 伍子胥
  score: 9
  worth_why: 亡命奔吴，相吴破楚入郢，力谏防越不从，被赐死悬目东门；复仇与忠谏双弧线，从兴吴到死谏全程可考，模范与教训兼具
  era: 春秋末吴国
  dates_known: true
- name_zh: 季札
  score: 8
  worth_why: 三让国而不居，请观周乐逐国论政洞见兴衰，挂剑徐君以践心诺；让国、识政、守信三段皆可成篇
  era: 春秋吴国
  dates_known: true
- name_zh: 范蠡
  score: 8
  worth_why: 佐越谋吴二十余年，功成泛舟五湖，三致千金为陶朱公；从谋国到谋身到治产，进退取舍的完整弧线，功成身退之典范
  era: 春秋末越国
  dates_known: true
- name_zh: 申公巫臣
  score: 7
  worth_why: 由楚奔晋，复通吴于上国，教吴车战射御，使楚首尾受敌；一着定吴楚大势，春秋地缘战略的诞生点
  era: 春秋楚晋
  dates_known: true
- name_zh: 先轸
  score: 7
  worth_why: 城濮之战晋中军主谋，殽之战全歼秦师虏三帅，后唾襄公面自悔，免胄冲狄阵亡以死谢罪；谋战与气节的连环名场面
  era: 春秋晋国
  dates_known: true
- name_zh: 赵盾
  score: 7
  worth_why: 晋国执政修令定典，立灵公又遭其虐，桃园之变后被董狐直书弑其君，不越境不讨贼而蒙恶名；权臣与史笔之争的标本
  era: 春秋晋国
  dates_known: true
- name_zh: 魏绛
  score: 7
  worth_why: 魏绛和戎，晋悼公八年之间九合诸侯而戎狄亲服，戮扬干之仆以严军法，复受金石之礼；和戎抚远的第一案
  era: 春秋晋国
  dates_known: true
- name_zh: 向戌
  score: 7
  worth_why: 弭兵之会约晋楚之从交相见，诸侯罢兵十余年，会成之后自去其邑以避责；春秋中期最大和平方案的操盘者，功成不居
  era: 春秋宋国
  dates_known: true
- name_zh: 申包胥
  score: 7
  worth_why: 吴师破郢，哭秦庭七日七夜勺饮不入口，借秦师以复楚，事定不就赏而逃；一人哭出一场复国，忠烈名场面
  era: 春秋楚国
  dates_known: true
- name_zh: 士会
  score: 7
  worth_why: 处秦为秦谋，归晋为晋谋，平王室之乱定周室，为政而荐郤缺自代，请老善终；能出能处的社稷之臣
  era: 春秋晋国
  dates_known: true
- name_zh: 祁奚
  score: 6
  worth_why: 请老荐仇解狐，再荐子祁午与羊舌赤，外举不避仇内举不避亲；举贤标准垂范后世，做事流短而立意极高
  era: 春秋晋国
  dates_known: true
- name_zh: 石碏
  score: 6
  worth_why: 州吁弑立，石碏设谋于陈诛州吁并杀亲子石厚以定卫国；大义灭亲之成语诞生点，忠义与教训并见
  era: 春秋卫国
  dates_known: true
rejections:
- name_zh: 羽父
  why_not: 弑隐公之贼，传中仅此一节，无完整做事流
- name_zh: 鬻拳
  why_not: 兵谏自刖、死以殉葬，忠烈可感而行事单薄
- name_zh: 竖牛
  why_not: 乱叔孙氏之家竖，事迹零碎难考
- name_zh: 骊姬
  why_not: 骊姬之乱虽系晋国大变，本人行事仅谮杀申生数节，宜作重耳申生之背景，不独立传
- name_zh: 急与寿
  why_not: 兄弟争死仅殉节一事，无可考做事周期
- name_zh: 郑伯有
  why_not: 侈愎自用取死，负面且零碎，宜作子产执政之衬托
- name_zh: 陈敬仲
  why_not: 辞工正一节见远虑，然田氏代齐乃五世之后，本人做事流太薄，宜缓
- name_zh: 声伯
  why_not: 梦涉洹为占兆琐闻，无行事可录
