candidates:
- name_zh: 金声桓
  score: 9
  worth_why: 降清后不费一矢传檄定江西十三府，求封不遂而阴蓄反志，借剃发令刺杀王体忠夺军，戊子正月反正称豫国公——降而复反的完整做事周期与覆亡教训俱备
  era: 明清之际
  dates_known: true
- name_zh: 王得仁
