  era: 明末
  dates_known: true
- name_zh: 袁继咸
  score: 5
  worth_why: 江楚督师被左军劫持，为九江之变关键受害者，其后死节；本篇仅见被劫一线，做事流不完整宜缓
  era: 明末
  dates_known: true
- name_zh: 万元吉
  score: 5
  worth_why: 赣州督师殉国，且曾密间金声桓劝反，为后文反正埋因；事迹在本篇简略
  era: 明末
  dates_known: true
- name_zh: 姜曰广
  score: 5
  worth_why: 宏光阁臣被迎与共事以资号召，附于反正始末；个人做事流单薄
  era: 明清之际
  dates_known: true
