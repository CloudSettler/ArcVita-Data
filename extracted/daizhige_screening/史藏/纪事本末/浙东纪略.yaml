source: 史藏/纪事本末/浙东纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 刘宗周
  score: 9
  worth_why: 蕺山大儒兼左都御史；北兵临境先绝食，被救后暂缓，北使以书币聘则口授答书自称大明孤臣，作绝命词，遗命三年后葬以先帝梓宫未落土，幅巾葛袍北首而卧以对君；绝食-拒聘-绝命-遗命一节有缘起有抉择有终局，殉节典范兼学术宗师，名场面极足
  era: 明末清初
  dates_known: true
- name_zh: 祁彪佳
  score: 8
  worth_why: 苏松巡抚养病里居，北兵以书来聘，从容处分家政、作绝命词别宗亲，欢然饮燕无异平时，肃衣冠投寓园放生池；却聘-绝命-殉节做事流完整，且其生平治吴有政声，气节与从容兼得，可为模范
  era: 明末清初
  dates_known: true
- name_zh: 熊汝霖
  score: 7
  worth_why: 浙东起兵首谋，密约孙嘉绩、结定海总兵王之仁，走甬东面请之期会举事，为江上抗清开了局面；缘起-联结-发动阶段清晰，史实上更迎鲁监国终殉于军，做事流完整
  era: 明末清初
  dates_known: true
- name_zh: 钱肃乐
  score: 7
  worth_why: 宁波刑部员外郎率乡绅士民起兵，迎王之仁于演武场拜为大帅，迫谢三宾捐万金为首倡；一介郎中倡义一郡，起兵-立帅-筹饷结构完整，后转战闽浙忧愤而卒，可录
  era: 明末清初
  dates_known: true
- name_zh: 郑遵谦
  score: 6
  worth_why: 绍兴义士暗结壮士数百，入府署斩北太守张愫、山阴知县彭万里，自号都统制大将军，令绅衿捐助撤桥梁；起事果断有波折，事迹偏简略
  era: 明末清初
  dates_known: true
- name_zh: 于颍
  score: 6
  worth_why: 宁绍分守议画江自守，见人心离涣乃解印遁迹河曲，义兵起后复出，碎安民榜羁北使，按地分汛部署沿江防务，分遣刘穆、郑惟翰、许耀祖诸营扼富阳海宁鳖子门；先退后进再成建置，组织之才可取
  era: 明末清初
  dates_known: false
- name_zh: 孙嘉绩
  score: 6
  worth_why: 与熊汝霖密谋举义，约期未践因余姚民变而起，率士民斩北知县黄元如兵遂起；首义关键节点人物，行事略简
  era: 明末清初
  dates_known: true
- name_zh: 王毓蓍
  score: 5
  worth_why: 会稽庠生作愤时致命篇骂群奸误国，遗书刘宗周望其早自决毋为王炎午所吊，正襟饮别、贴篇祠壁、肃衣冠赴水柳桥；文章与死节并举，名场面足而做事流短
  era: 明末清初
  dates_known: true
- name_zh: 周卜年
  score: 5
  worth_why: 安仓儒生碎所佩玉雷圈包之书宁为玉碎毋为瓦全置府案，作绝命五歌，处分妻孥遗属毕蹈海而死；玉碎宣言传世，殉节场面撼人，终属一时之节
  era: 明末清初
  dates_known: false
- name_zh: 王之仁
  score: 5
  worth_why: 定海总兵心有机权，受熊汝霖遗书相订举事，宁波迎之于演武场拜为大帅，为江上之军帅首；本传所载仅此，后续成败需他书补
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 潞王朱常淓
  why_not: 君主仅作时间坐标，监国旬日事无可述
- name_zh: 马士英
  why_not: 传中惟出逃线索，弘光既亡即挟太后走杭，无完整做事流
- name_zh: 方国安
  why_not: 捶碎北牌旋战败遁去，杭民闭城不容，事迹断续无成事
- name_zh: 黄道周
  why_not: 传中仅数行连章劝监国、扈唐藩入闽，其大节不在本书范围
- name_zh: 潘集
  why_not: 年十九自署大明义士哭奠王毓蓍后怀石投水，惟殉节一事无做事流
- name_zh: 倪父征
  why_not: 训蒙卖药坐缸自掩而死，节烈可感而无可考做事周期
- name_zh: 谢三宾
  why_not: 仅被迫捐万金一事，无自立之行事
- name_zh: 徐芳烈
  why_not: 作者自述会哭明伦堂措饷召募，事迹散附诸事无主轴
