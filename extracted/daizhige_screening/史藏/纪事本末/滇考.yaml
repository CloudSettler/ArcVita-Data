source: 史藏/纪事本末/滇考.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 庄蹻
  score: 9
  worth_why: 楚将伐夜郎引兵定滇池，归路为秦所断，遂变服从俗王滇，子孙世王数百年；庄蹻王滇为云南信史之始，入乡随俗治边之祖
  era: 战国末期楚顷襄王时
  dates_known: true
- name_zh: 赛典赤赡思丁
  score: 8
  worth_why: 序中治滇第一模范，首建云南行省，兴儒学修水利抚诸夷，治滇数年政成而卒，万民哭送；制度文教水利俱全
  era: 元世祖时
  dates_known: true
- name_zh: 唐蒙
  score: 7
  worth_why: 因一勺蜀蒟酱勘明牂牁水道，上策通夜郎，厚赐多同约置吏，建犍为郡开西南夷第一功；诛逃卒致巴蜀惊恐，急功之戒亦备
  era: 西汉武帝时
  dates_known: true
- name_zh: 司马相如
  score: 7
  worth_why: 奉使责唐蒙安谕巴蜀，建节使西夷，卭莋君长皆请臣置都尉十余县除边关；谕蜀之文缘此行而生，通边与安民并举
  era: 西汉武帝时
  dates_known: true
- name_zh: 陈立
  score: 7
  worth_why: 为牂牁太守谕夜郎王兴不从即斩之，四十余日定朝廷议兵数年不决之局；边吏临机决断之楷模，序中标为转乱为治者
  era: 西汉成帝时
  dates_known: true
- name_zh: 毋波
  score: 6
  worth_why: 勾町侯率邑长人民击反者，斩捕五万余级，由侯晋王；夷酋助汉转乱为治之典型，河平中勾町夜郎相攻事件亦系于此
  era: 西汉昭帝时
  dates_known: true
- name_zh: 多同
  score: 6
  worth_why: 夜郎侯，受唐蒙约为置吏使其子为令，后入朝受王印，终为汉所诛；竹王传说之源，附汉得失之镜
  era: 西汉武帝时
  dates_known: true
- name_zh: 滇王常羌
  score: 6
  worth_why: 留汉使为求身毒道四岁，一问汉孰与我大，为自大典故语源；兵临举国降请置吏，受金印复长其民，善终与夜郎之诛对照
  era: 西汉武帝时
  dates_known: true
- name_zh: 韦仁寿
  score: 6
  worth_why: 序中转乱为治模范，唐初以仁信抚定南宁州，立州县与诸夷歃血为盟，代还之日酋豪泣留，不战服夷之模
  era: 唐高祖时
  dates_known: true
- name_zh: 张虔陀
  score: 6
  worth_why: 序中乱源之首，唐云南太守凌辱南诏，激阁罗凤叛唐附吐蕃，天宝丧师；一吏不肖致西南全变，反面前车之鉴
  era: 唐玄宗时
  dates_known: true
- name_zh: 王褒
  score: 5
  worth_why: 持节求金马碧鸡之神，道阻醮祭成颂，还未至道病卒；金马碧鸡典故与移文俱传，做事周期简略
  era: 西汉宣帝时
  dates_known: true
- name_zh: 刘深
  score: 5
  worth_why: 序中乱源之一，元初倡征八百媳妇，苛敛启宋隆济蛇节之乱，兵败被诛；穷兵黩武之戒，本卷未详
  era: 元成宗时
  dates_known: true
- name_zh: 冯苏
  score: 5
  worth_why: 顺治戊戌进士，康熙元年仕永昌推官，仕而好学，采辑沿革治乱成滇考三十七篇首尾完具；撰书缘起自述完整可为做事流
  era: 清康熙时
  dates_known: true
rejections:
- name_zh: 张骞
  why_not: 本篇仅一句引其使大夏归言求身毒道，凿空主事迹不在本文献，宜由史记大宛列传另录
- name_zh: 郭昌
  why_not: 惟击且兰及再击昆明无功而罢，无完整做事周期
- name_zh: 吕破胡
  why_not: 两度击叛一胜一败，顿兵不敢进，事迹简略
- name_zh: 霍光
  why_not: 仅白帝遣将一句，做事不载本篇
- name_zh: 王恢
  why_not: 仅借兵威遣唐蒙风指南越一事
- name_zh: 王然于
  why_not: 奉使传谕求道皆附见他人事中，无独立完整做事流
- name_zh: 卫广
  why_not: 仅随郭昌击且兰并见一句
- name_zh: 福邦宏德至德
  why_not: 阿育王三子金马碧鸡之说，神话传说，时代人物皆不可考
- name_zh: 郑纯
  why_not: 序中列为治滇廉洁模范，本卷未载其事迹，宜俟滇考后篇详文再评
- name_zh: 张翕
  why_not: 序中仅列名无事迹，宜俟后篇
- name_zh: 杨竦
  why_not: 序中仅列名无事迹，宜俟后篇
- name_zh: 常頞
  why_not: 仅一句通五尺道置吏，无做事首尾
