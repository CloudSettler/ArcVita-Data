source: 史藏/纪事本末/炎徼纪闻.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 岑猛
  score: 7
  worth_why: 田州土官兴衰全程可考：兄弑父、己被挟持流徙思恩、贿刘瑾矫诏复官、抚辑遗民兵威复振、凌轹旁郡睚眦必报、八万官军压境而束手乞怜、终被岳父岑璋甘言诱鸩；华林之役民谣传世，恃强贿权奸终致族灭，土司政治自毁之标本，足为教训
  era: 明中期（弘治至嘉靖，广西两江土司）
  dates_known: true
- name_zh: 卢苏
  score: 6
  worth_why: 纠王受挟邦彦复叛震动两江、受王守仁抚定受杖而服、复岑氏后以布伯专权、伏甲寝中执杀罗玉戴庆并弑邦相、劫土目立岑芝击破邻州联军；降与叛、立与弑首尾完整，改土归流背景下土目坐大之典型
  era: 明嘉靖年间（广西思恩、田州）
  dates_known: true
- name_zh: 岑浚
  score: 5
  worth_why: 豪行两江、胁猛分地、拒督府檄、入田州杀李蛮、陷田州僫立族子，终致湖兵万人征讨败死族诛、思恩改设流官；做事有首尾且牵动改土归流制度变迁，惟记叙简略
  era: 明弘治年间（广西思恩）
  dates_known: true
rejections:
- name_zh: 姚镆
  why_not: 主征岑猛虽胜而处置失当酿思田之乱，文中仅存政争梗概与落职结局，做事流残缺，教训价值不足单独成轴
- name_zh: 沈希仪
  why_not: 本篇仅见击斩邦彦一语，事迹未展开，宜俟明史沈希仪传另录
- name_zh: 岑璋
  why_not: 仅甘言诱鸩其婿一事，无完整周期，正文自注诸在璋传
- name_zh: 张佑
  why_not: 鞭挞邦相、匿养岑芝、毒发而死，事碎不成做事轴
- name_zh: 岑邦相
  why_not: 少年傀儡判官，立废生死皆由卢苏张佑操盘，无自主做事周期
- name_zh: 岑芝
  why_not: 髫龀被匿被立皆由他人拥戴，无自主事迹
- name_zh: 王受
  why_not: 与卢苏并举附从起事，无独立事迹线索
- name_zh: 莫登庸
  why_not: 仅流言中提及反叛传闻，本篇无任何事迹
