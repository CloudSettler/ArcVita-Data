source: 史藏/纪事本末/粤匪犯湖南纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 洪秀全
  score: 9
  worth_why: 创拜上帝教，造天条书、历书、仪制书，定军令制度、七日听讲教习用兵，金田起兵后纵横两湖江南十四年；成于宗教动员与严明纪律，败于内讧与深居，成败两端皆足为鉴。文中记其广东人、己卯生、自号太平天德王、行坐绿呢轿、所居妇女围之诸形迹
  era: 清末太平天国
  dates_known: true
- name_zh: 萧朝贵
  score: 7
  worth_why: 太平军前军主帅，率左营二军三千余人自郴州奔袭五六百里直抵长沙城下，昼夜攻扑南城，城外接仗中炮身死；长沙之役的发起者与牺牲者，太平天国早期名将之死，攻守转折的关键节点
  era: 清末太平天国
  dates_known: true
- name_zh: 江忠源
  score: 7
  worth_why: 书生领兵之先驱，率楚勇四百逼近贼垒扎营，力战负伤，文称可谓勇夫；其后蓑衣渡挫敌、死守庐州殉城，开湘军先声，做事流完整堪为典范
  era: 清末
  dates_known: true
- name_zh: 向荣
  score: 7
  worth_why: 自广西尾追太平军千里入湘，长沙危急时驰援，移吴三桂红衣炮三座轰击南城贼垒解攻城之急，又追击至兰溪连战三日；评者谓其奋勇直前惟少谋略，一生两建江南大营，将略得失可为镜鉴
  era: 清末
  dates_known: true
rejections:
- name_zh: 石达开
  why_not: 篇中仅于诸王名号一见，无事迹无做事流；如拟录入宜另据专传
- name_zh: 杨秀清
  why_not: 篇中仅称其狡狯一句，无做事周期
- name_zh: 赛尚阿
  why_not: 仅记其逮治及坐失道州锁围之机，事迹简略不足以成篇
- name_zh: 和春
  why_not: 统兵一万五千相去百十里不敢近、惮战不尽力，数语而已
- name_zh: 鲍起豹
  why_not: 仅焚近城民居一令，余无事迹
- name_zh: 余万清
  why_not: 敛兵先逃一句，无做事流
- name_zh: 王家琳
  why_not: 重兵堵安仁听贼过而不顾一句带过
- name_zh: 黄冕
  why_not: 领帑铸炮侵吞无算，属劣迹碎片非成事周期
- name_zh: 邓绍良
  why_not: 仅矫捷善战一语品评，惜职太卑，无事迹展开
- name_zh: 程矞采
  why_not: 仅风闻退省一处提及，事迹全无
