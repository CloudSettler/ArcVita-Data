source: 史藏/纪事本末/粤逆纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 洪秀全
  score: 8
  worth_why: 定都金陵、营建天王府、创圣库与男女馆诸制度，太平事业内兴外亡为清代第一等大事；本篇虽存残迹，结合史识其做事流完整可录
  era: 晚清太平天国
  dates_known: true
- name_zh: 陆建瀛
  score: 7
  worth_why: 钦差逡巡畏缩、遇贼遁还秘不发丧、谕民毋徙，致百万生灵罹劫，完整反面做事周期，警世典型
  era: 晚清道咸
  dates_known: true
- name_zh: 杨秀清
  score: 6
  worth_why: 令旗人拜降而尽杀之、自署禾乃师赎病主、营建东王府，权术与酷虐之鉴；生卒年不详
  era: 晚清太平天国
  dates_known: false
- name_zh: 沈鼐
  score: 5
  worth_why: 城危持刀大呼速杀贼、手刃数贼遇害，殉城名场面，事迹单薄
  era: 晚清咸丰
  dates_known: false
- name_zh: 祥厚
  score: 5
  worth_why: 率旗兵巷战自寅至申、几无孑遗而战死，殉城典型然记载简略
  era: 晚清咸丰
  dates_known: false
rejections:
- name_zh: 杨文定
  why_not: 仅移节江宁、遽返姑苏等散记，无做事周期
- name_zh: 祁宿藻
  why_not: 倡行保卫而卒于官署，无事迹展开
- name_zh: 福珠隆阿
  why_not: 仅闻贼恐、弃火药枪炮入城，无独立做事流
- name_zh: 张攀龙
  why_not: 仅飞骑告急一事
- name_zh: 韦昌辉
  why_not: 仅有踞宅谕老民等零星记载
- name_zh: 石达开
  why_not: 仅踞宅建翼王府，无事迹
