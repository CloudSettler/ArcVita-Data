  decisions:
  - date: 1853-03-25
    title_zh: 男女分馆、掳掠尽归圣库
    rationale: 收城中人口资财于一统，以严法锻造圣兵，然苛虐失尽人心
  - date: 1853-04
    title_zh: 拆民居拓建天王府
    rationale: 以天京为基业、以宫室崇天王之尊，然涂黄铸金、奢僭无度启速亡之机
