  birth_date: 1814-01-01
  death_date: 1864-06-01
  era: 晚清·太平天国
  reign_ref: 太平天国天王（1851-1864在位）
  archetype:
  - 教门起事之主
  - 草莽开国者
  - 乌托邦制度设计者
  dilemmas:
  - 欲以拜上帝教动员万众，则必行男女分馆、鞭挞立威之苛法以成一军
  - 欲以天国公产聚敛圣库，而诸王穷奢极欲，制度自坏其义
  lesson: 事业可起于理想，然制度与人心一旦崩坏，所筑之城反成埋葬之处
  summary_first_person: 我洪秀全，广东花县人，屡试不第，创拜上帝教以聚众；壬子冬遣军南下，破武昌、下安庆；癸丑二月借地道云梯陷金陵，据督宪署为天王府，遍涂黄色、筑城掘濠，立圣库、设诸衙，勒民拜降、编男女二馆，在金陵享国十有一年；甲子年城中粮尽，我病殁于天王府，未几城亦陷
  source_urls:
  - 南京图书馆藏《粤逆纪略》抄本
