  why_not: 画八卦虽为文明肇端，传文纯出传说，无可考行事年代
- name_zh: 女娲
  why_not: 炼石补天抟土造人属神话，无可考做事周期
- name_zh: 少皥
  why_not: 传文多系谱系名号，事迹简略
- name_zh: 颛顼
  why_not: 除绝地天通一事外，传文以世系为主，无完整做事流
- name_zh: 帝喾
  why_not: 传文仅世系数行，无可录事迹
- name_zh: 夏桀
  why_not: 亡国之君仅作汤之事流的对衬坐标，无独立做事周期
- name_zh: 商纣王
  why_not: 恶行事散见武王克殷篇，无独立做事周期可立
- name_zh: 太甲
  why_not: 悔过自新可采，然行事全附于伊尹一事之下，无独立做事流
- name_zh: 周厉王
  why_not: 弭谤有教训价值，然君主低优先且行事不成周期
- name_zh: 卫懿公
  why_not: 好鹤亡国仅一梗之教训，做事流单薄
- name_zh: 比干
  why_not: 死谏一事而已，无做事周期
