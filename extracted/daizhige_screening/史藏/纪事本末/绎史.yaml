source: 史藏/纪事本末/绎史.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 吕尚
  score: 10
  worth_why: 年老困顿渭水垂钓遇文王；牧野鹰扬克殷；受封营丘治齐，因俗简礼、通鱼盐之利，齐由此为东方大国；大器晚成典范
  era: 商末周初
  dates_known: true
- name_zh: 伊尹
  score: 10
  worth_why: 负鼎俎以滋味说汤，佐汤灭夏；放太甲于桐宫三年，俟其悔过复政而还政，古今摄政首例不失其忠；后世尊为元圣
  era: 商初
  dates_known: true
- name_zh: 周文王
  score: 10
  worth_why: 羑里演易开周易之源；断虞芮之讼，伐犬戎密须耆邘崇，作丰邑；三分天下有其二犹服事殷；礼贤下士与隐忍蓄势之典范
  era: 商末
  dates_known: true
- name_zh: 范蠡
  score: 10
  worth_why: 佐勾践忍辱图吴二十余年；功成泛舟五湖，化名三致千金为陶朱公；进退取舍之智，功成身退第一典范
  era: 春秋末
  dates_known: true
- name_zh: 苏秦
  score: 10
  worth_why: 锥刺股发愤；游说六国合纵，身佩六国相印，强秦十五年不敢出函谷；阴助齐以疲齐，事败车裂；布衣至卿相的完整做事流
  era: 战国
  dates_known: true
- name_zh: 陈胜
  score: 9
  worth_why: 燕雀安知鸿鹄之志；大泽乡揭竿首事反秦，建张楚，斩木为兵天下响应；旋起旋灭，骄躁失众之深刻教训
  era: 秦末
  dates_known: true
- name_zh: 伍子胥
  score: 9
  worth_why: 亡命奔吴，荐专诸孙武，破楚入郢掘墓鞭尸；力谏夫差防越，赐属镂自刭，悬目东门终见越兵入吴；复仇与忠谏的双重悲剧
  era: 春秋末
  dates_known: true
- name_zh: 张仪
  score: 9
  worth_why: 以连横破合纵；欺楚绝齐致楚丹阳蓝田之败，取汉中；遍说韩赵魏燕齐以横拆纵，与苏秦并为纵横双璧
  era: 战国
  dates_known: true
- name_zh: 吕不韦
  score: 9
  worth_why: 邯郸见子楚谓奇货可居，营运立两代秦王；为相灭东周置三川郡；集门客著吕氏春秋，悬市一字千金；终免相饮鸩
  era: 战国末
  dates_known: true
- name_zh: 李牧
  score: 9
  worth_why: 守雁门厚蓄士卒，一战大破匈奴十余万骑，十余年胡不敢近赵边；肥之战番吾之战两却秦军；秦行反间冤死而赵亡
  era: 战国末
  dates_known: true
- name_zh: 魏无忌
  score: 9
  worth_why: 信陵君窃符救赵却秦存邯郸；晚年将五国之师破蒙骜，逐秦军至函谷关；因王疑忌谢病不朝，酒色以终
  era: 战国末
  dates_known: true
- name_zh: 田单
  score: 9
  worth_why: 安平之走断轴先遁识乱机；守即墨行反间去乐毅；火牛阵一举破燕，收复齐七十余城；孤城复国的经典战例
  era: 战国
  dates_known: true
- name_zh: 郑庄公
  score: 9
  worth_why: 克段于鄢，多行不义必自毙；掘地见母，黄泉之誓终其乐融融；繻葛之战射周桓王中肩，天子威信扫地，春秋争霸自此启
  era: 春秋初
  dates_known: true
- name_zh: 黄帝
  score: 9
  worth_why: 阪泉胜炎帝、涿鹿擒蚩尤而天下定；画野分州垂衣裳而治，兴宫室舟车衣冠，人文初祖；惟属传说时代，无信史纪年
  era: 上古传说时代
  dates_known: false
- name_zh: 少康
  score: 8
  worth_why: 寒浞篡夏，少康奔虞为庖正，有田一成有众一旅；使女艾行谍、季杼诱敌，灭浇殪豷，复禹之绩，史称少康中兴；复国谋略完整
  era: 夏代
  dates_known: true
rejections:
