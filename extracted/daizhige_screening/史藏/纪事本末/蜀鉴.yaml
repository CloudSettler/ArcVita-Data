candidates:
- name_zh: 吕蒙
  score: 8
  worth_why: 得书秘之、夜授方略智取零陵诱降郝普，再袭江陵擒关羽，孙权遂定荆州；战术欺骗与奇袭名场面俱全，做事流完整
  era: 东汉末建安年间
  dates_known: true
- name_zh: 赵云
  score: 8
  worth_why: 汉水遇曹军猝突其阵，还营大开门偃旗息鼓设空营计，雷鼓劲弩破敌，一身是胆名场面；又随军溯江定江阳犍为，攻守兼备
  era: 东汉末建安年间
  dates_known: true
- name_zh: 法正
  score: 8
  worth_why: 阴劝昭烈取益州、与刘璋书攻心劝降、说取汉中、定军山一言可击遂斩夏侯渊，奇谋佐命自迎立至功成周期完整
  era: 东汉末建安年间
  dates_known: true
- name_zh: 张鲁
  score: 7
  worth_why: 五斗米道三世传人，掩杀苏固、并张修之众割据汉中，与刘璋抗衡，阳平关抗曹后降，政教合一割据自保之典型
  era: 东汉末
  dates_known: true
- name_zh: 黄忠
  score: 6
  worth_why: 定军山登高鼓噪阵斩夏侯渊，老将成名之战；本卷事迹单一，宜并入昭烈取汉中案
  era: 东汉末建安年间
  dates_known: true
- name_zh: 马超
  score: 5
  worth_why: 密书请降、引兵屯城北震怖成都促刘璋出降；然潼关大战等主要事业不在此卷，暂缓
  era: 东汉末三国初
  dates_known: true
