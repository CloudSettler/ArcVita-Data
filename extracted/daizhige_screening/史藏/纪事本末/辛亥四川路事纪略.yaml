- name_zh: 盛宣怀
  score: 9
  worth_why: 中国近代实业总设计师，轮船招商局、电报局、汉冶萍、中国通商银行、北洋大学堂皆经其手创办；本文所载宣统三年邮传部大臣任内力主干路国有、签押四国借款合同，直接引爆四川保路运动与武昌起义，实业先驱与亡清导火索一身二任，做事周期完整，成败教训俱备
  era: 清末洋务运动至辛亥
  dates_known: true
- name_zh: 端方
  score: 7
  worth_why: 清末旗人改革派督抚，出洋考察宪政五大臣之一，办新式学堂、建江南藏书楼并倡设博物馆；本文五月电文中与盛宣怀并为路事两大臣，同年奉命率军入川督路，行至资州为哗变新军所杀，改革者沦为政策替罪羊的典型教训，生卒年可考
  era: 清末
