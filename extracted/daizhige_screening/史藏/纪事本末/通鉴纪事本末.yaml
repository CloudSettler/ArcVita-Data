candidates:
- name_zh: 袁枢
  score: 9
  worth_why: 自出新意，因司马光通鉴区别门目以类排纂，每事各详起讫自为标题，于纪传编年二体之外别创纪事本末一体，前古所未有；孝宗读而嘉叹曰治道尽在是矣，诏严州摹印十部；做事流完整：病纪传一事复见、编年首尾难稽之弊，缀集成书，朝廷摹印，朱子称其义例精密，后世陈邦瞻谷应泰递相沿仿
  era: 南宋
  dates_known: true
- name_zh: 智伯
  score: 8
  worth_why: 三家分晋之核心人物与千古反面教材；贤于人者五而甚不仁，蓝台戏康子而侮段规，恃强索地三家，水灌晋阳叹吾乃今知水可以亡人国，终因骄而轻敌被韩魏反戈、晋阳城下族灭；司马光才德论即以其亡立论，才者德之资德者才之帅，才胜德者亡
  era: 春秋末
  dates_known: true
- name_zh: 赵襄子
  score: 8
  worth_why: 晋阳被围城不浸者三版而民无叛意，验证尹铎保障之政与简子深谋；夜杀守堤吏决水灌智伯军，韩魏翼击、襄子犯前，遂灭智氏定三家分晋之局；漆智伯之头为饮器引出豫让报恩名场面；后封代成君兴伯鲁之祀，兴灭继绝有器量
  era: 春秋末
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 本篇所宗资治通鉴之作者；开篇臣光曰论天子之职莫大于礼、礼莫大于分、分莫大于名，又以智伯之亡立才德之辨，皆千古政论名文；十九年编年巨著为袁枢改铸之底本，一书一体相辅而行
  era: 北宋
  dates_known: true
- name_zh: 赵简子
  score: 7
  worth_why: 书训戒之辞于二简试二子三年，无恤诵习甚习而伯鲁失简，遂立无恤，识人之智；命尹铎治晋阳必以为保障，临终嘱晋国有难必以为归，数年后晋阳果存赵氏，谋划跨越生死堪称典范
  era: 春秋末
  dates_known: true
- name_zh: 张孟谈
  score: 7
  worth_why: 晋阳危在旦夕之际潜出城见韩魏二子，以唇亡齿寒晓以利害，一句谋出二主之口入臣之耳何伤也坚定其谋，遂约反戈定三家分晋之局；成语唇亡齿寒之经典用例
  era: 春秋末
  dates_known: true
- name_zh: 尹铎
  score: 6
  worth_why: 赴晋阳请曰以为茧丝乎抑为保障乎，损其户数以宽民收心，终使晋阳民必和而城不可拔，治政固本之范本；一问一答见治道根本
  era: 春秋末
  dates_known: true
- name_zh: 魏桓子
  score: 6
  worth_why: 听任章将欲败之必姑辅之、将欲取之必姑与之之策，忍无故索地之辱割万家之邑以骄智伯；水灌晋阳时闻智伯言水可亡国而肘康子履其跗，暗怀汾水可灌安邑之惧，忍辱待变终灭智氏
  era: 春秋末
  dates_known: true
- name_zh: 陈邦瞻
  score: 6
  worth_why: 沿仿袁枢纪事本末体编成宋史纪事本末元史纪事本末，为纪事本末体第一代传人，著述做事流完整，张溥论正其书
  era: 明末
  dates_known: true
- name_zh: 谷应泰
  score: 6
  worth_why: 编明史纪事本末八十卷，成书早于官修明史，为本朝此体之冠；沿仿袁枢门目之法而自成一朝始末
  era: 清初
  dates_known: true
