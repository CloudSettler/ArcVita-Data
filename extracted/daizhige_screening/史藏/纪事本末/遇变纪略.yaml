verdict: has_candidates
candidates:
- name_zh: 李自成
  score: 10
  worth_why: 从起事到西安建国大顺、破北京逼死崇祯、劝进登极、山海关大败弃京西走，兴亡全程俱在本篇；拷掠百官追赃、考选授官皆名场面，败因剖析完整
  era: 明末
  dates_known: true
- name_zh: 吴三桂
  score: 9
  worth_why: 拒李自成招降、请清兵入关为改写天下格局之关键决策；父襄被斩悬首后誓灭大顺，沙河驿连战，冲冠一怒之诞生点
  era: 明末清初
  dates_known: true
- name_zh: 孙传庭
  score: 8
  worth_why: 潼关全军覆没殉国，传庭死而明亡；合观黑水峪擒高迎祥、柿园与郏县再起再败，完整悲壮做事流兼催战误国之教训
  era: 明末
  dates_known: true
- name_zh: 崇祯帝
  score: 6
  worth_why: 君主本低优先；然拒南迁、不许太子南下、煤山自缢留血诏，刚愎误国可作后世大警示，甲申之变之中心坐标
  era: 明末
  dates_known: true
- name_zh: 李建泰
  score: 5
  worth_why: 自请督师办贼而甫至保定即降，志大才疏之典型；兼见南迁之请被驳与降贼结局
  era: 明末
  dates_known: true
- name_zh: 蔡懋德
  score: 5
  worth_why: 固守太原月余，外援不至，力竭城陷殉难，可为守土殉节之范式
  era: 明末
  dates_known: true
