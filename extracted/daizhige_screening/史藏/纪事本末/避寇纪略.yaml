source: 史藏/纪事本末/避寇纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 程畹
  score: 7
  worth_why: 仪征蒙馆塾师，自壬寅夷乱夜走妙山，至癸丑、丙辰两度城陷皆有亲历；避难做事流完整——初自分引决、缳已结，终择携家出走；妹病姑老必同行，言止则均止不然行，见担当；村居授徒、佣书养亲，末以成书纪存为结果；所记贼退后乱民冒贼焚掠、百年家藏尽毁并系诗为证，可与广陵诸记互证，为平民战乱实录之标本
  era: 晚清（道光—咸丰）
  dates_known: true
- name_zh: 黄得胜
  score: 6
  worth_why: 楚人陷贼之年少头目，按行仪征禁焚掠、不率者杀无赦，邑人德之，驭众解纷；琦善围扬州时密招之，请杀贼自效，事泄见杀，邑人失助愈恐——治邑有法、反正殉身的完整小弧线，兼具人性温度与悲剧名场面；惟事迹限一城年余，生卒仅可约推
  era: 太平天国据仪征时期（咸丰三年）
  dates_known: true
- name_zh: 陆建瀛
  score: 6
  worth_why: 两江总督之反面完整教训——改盐漕旧章、暴戾恣睢，致两江两湖失业者数百万，一旦借寇兵赍盗粮；贼东下被迫迎剿，九江弃军一昼夜逃回江宁，城陷不知所终；失政酿祸与溃逃覆身两环俱可系年，警示价值鲜明
  era: 晚清咸丰
  dates_known: true
- name_zh: 毛三元
  score: 5
  worth_why: 川籍老将得士民心，士力战、民送粮，守三汊河八战皆捷；持重不浪战，枪炮度可中贼乃发，稳击死守，卒使瓜扬之贼无如之何而遁——稳守战术之范例；惜传中仅数行，生卒无考
  era: 晚清咸丰
  dates_known: true
rejections:
- name_zh: 洪秀全
  why_not: 本篇仅作乱源叙及，自广西假教萌芽至壬子破武昌、癸丑下江宁数行带过，非其本传，宜俟太平天国专籍录入
- name_zh: 杨秀清
  why_not: 与洪秀全并提一句，无行事
- name_zh: 曾国藩
  why_not: 仅一句点出起义湘南、平贼者并世而生，宜俟专籍录入
- name_zh: 向荣
  why_not: 两见皆提其名（率张国梁来援、围江宁三大帅之一），本篇无其做事细节
- name_zh: 张国梁
  why_not: 附见于向荣援军一句，无事迹
- name_zh: 吉尔杭阿
  why_not: 围镇江背景一见，无做事流
- name_zh: 赛尚阿
  why_not: 钦差不能御贼一句带过
- name_zh: 牛鉴
  why_not: 壬寅夷乱江督背景一句
- name_zh: 郑祖琛
  why_not: 佞佛纵盗一句，可作乱源注脚，无做事周期
- name_zh: 祥厚
  why_not: 江宁城陷死节一句，同句刘同缨死最烈，皆无做事过程
- name_zh: 哲某
  why_not: 新任副都统亲督兵迎剿、陷淖战死仪征，仅数行且名字不全、前后无考
- name_zh: 世焜
  why_not: 扬州知府死之一句
- name_zh: 吴文镕
  why_not: 湖督殉难一句，同句之临清守张寄琴亦仅及死节
- name_zh: 陈起财
  why_not: 患难相助之义民，有德行而无独立做事流
- name_zh: 王氏翁媪
  why_not: 流离中延留老幼、泣别远送三里，感人而无可考做事周期
