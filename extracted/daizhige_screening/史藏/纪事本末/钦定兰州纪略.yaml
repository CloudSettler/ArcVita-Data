source: 史藏/纪事本末/钦定兰州纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 阿桂
  score: 8
  worth_why: 出将入相的乾隆名臣——此役临危受命赴兰州，途中断然撤回京兵、申明军律、设卡札营、分路猛攻华林山扭转战局；更历平准定回、两征金川、伊犁屯田，位居枢要而清谨自持，与和珅适成对照
  era: 清乾隆朝
  dates_known: true
- name_zh: 和珅
  score: 8
  worth_why: 权臣巨贪第一标本——由侍卫骤登枢要二十余年；此役奉命督师兰州，饬禁守城虚张声势、搜捕杀贼而究无功先调后撤；终以二十条大罪赐死抄家，和珅跌倒嘉庆吃饱，警示意义极强
  era: 清乾隆嘉庆间
  dates_known: true
- name_zh: 苏四十三
  score: 7
  worth_why: 教争酿变首案之主——因争立新教戕官起事，陷河州、逼省城、索教主不获，退据华林山扼险死守至无一人漏网；缘起、相持、结局俱可考，为清代西北民变与教争治理之镜
  era: 清乾隆四十六年（1781）
  dates_known: true
- name_zh: 海兰察
  score: 7
  worth_why: 索伦前锋名将——此役率马兵由龙尾山绕扑华林山西南贼卡，三战破之；更历两定金川、平台湾林爽文、远征廓尔喀，图形紫光阁，一生行阵可成完整做事流
  era: 清乾隆朝
  dates_known: true
- name_zh: 毕沅
  score: 7
  worth_why: 学者型督抚——此役以西安巡抚闻兰州被围即悉心调度协济，赏一品顶带；抚陕治水赈灾，幕府主持编纂续资治通鉴二百二十卷、关中胜迹图志，政事著述两流俱备
  era: 清乾隆朝
  dates_known: true
- name_zh: 王廷赞
  score: 6
  worth_why: 功罪一身之炯戒——以文臣悉力保守省城，当机于城上诛马明心以绝贼望，获一品顶带褒奖；旋因甘肃冒赈贪墨巨案与王亶望同罪赐死，恰成此役之外更大的教训
  era: 清乾隆朝
  dates_known: true
- name_zh: 马明心
  score: 6
  worth_why: 新教门宦始传人——其教行于撒拉尔致新旧相仇，被系兰州城头正法，直接点燃苏四十三之变；身后哲赫忍耶绵衍西北至今，宗教史意义独特
  era: 清乾隆朝
  dates_known: true
- name_zh: 乾隆帝
  score: 6
  worth_why: 缓录——君主低优先；本篇但见批答调兵、赏罚驭将一面，然其十全武功、四库全书规模空前，宜俟系统史料另立时间轴
  era: 清乾隆朝
  dates_known: true
rejections:
- name_zh: 勒尔谨
  why_not: 陕甘总督措置乖方、诳奏误机，积薪厝火酿变，篇中仅见被谴一面，无完整做事流
- name_zh: 伍弥泰、仁和、图钦保、德宁、马彪、拉旺多尔济、明亮、舒亮、额森特
  why_not: 诸将镇臣但见奉调赴援、分路进兵、手刃数贼数语，无独立周期
- name_zh: 福崧
  why_not: 藩司随征随报、奏雨志慰而已，事迹简略
- name_zh: 杨士玑、新柱
  why_not: 查拏遇戕之知府副将，仅以死事见录，无做事周期
- name_zh: 纪昀、陆锡熊、孙士毅、陆费墀
  why_not: 四库总纂总校署名而已，与本役事迹无涉
