candidates:
- name_zh: 王伦
  score: 7
  worth_why: 做事流完整可考：借白莲教聚众敛财为缘起，八月廿八夜破寿张为爆发，转掠阳谷堂邑、围攻临清为高潮，穷迫自焚、党众尽俘为结局；乾隆朝由盛转衰的第一声警号，妖言铤而走险终致枭示之教训典型
  era: 清乾隆
  dates_known: true
- name_zh: 舒赫德
  score: 6
  worth_why: 奉诏统八旗劲旅，沿途密调天津沧州青州之兵，星驰山东四面合剿，四十余日速定临清之变，事毕即赴南河督工合龙；钦差统筹、先剿后河的调度决断链完整可循
  era: 清乾隆
  dates_known: true
- name_zh: 徐绩
  score: 5
  worth_why: 山东巡抚首报贼变、昼夜驰驱督剿、于东昌擒获奸细供出首魁、献贼窜无定须四面合攻断其去路之策；做事流可循但主导性弱，多承旨而行
  era: 清乾隆
  dates_known: true
