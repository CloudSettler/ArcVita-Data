verdict: has_candidates
candidates:
- name_zh: 福康安
  score: 9
  worth_why: 渡海统劲旅旬日解诸罗之围，继克大里杙生擒林爽文、复擒庄大田，三月平定全台；示兵威于生番、预防水陆窜路，迟速之际关键决策与用兵名场面俱全，做事流完整可为典范
  era: 清乾隆
  dates_known: true
- name_zh: 施琅
  score: 9
  worth_why: 提要明载俘郑克塽而郡县其地；澎湖一战定台、力排弃台之议主张设官置戍，遂为海上金城，缘起决战留台设制结果俱全，清初经略台湾第一关键人
  era: 明末清初
  dates_known: true
- name_zh: 海兰察
  score: 8
  worth_why: 率百巴图鲁攻坚陷锐，风港越箐穿林先登杀贼，解围擒渠皆其锋刃；自索伦从卒积功至名将，紫光阁功臣，做事流完整
  era: 清乾隆
  dates_known: true
- name_zh: 林爽文
  score: 6
  worth_why: 天地会起事、僭号顺天、陷彰化围诸罗一年三月而败，成事流完整；其兴由官吏贪黩、其亡由内讧割据，为官逼民反与变乱扑灭之双重教训
  era: 清乾隆
  dates_known: true
- name_zh: 李侍尧
  score: 6
  worth_why: 入觐之际受命代常青总督，悉心董理军储毋悮行阵，文中自评不以李侍尧易常青则军储必悮，以后勤调度定战局，节点清晰
  era: 清乾隆
  dates_known: true
- name_zh: 乾隆帝
  score: 6
  worth_why: 君主本低优先，然本文实为御制纪事，迟速论与四知书屋记为明慎用兵知几而作之政论名篇，预饬周防屡申饬谕可作关键决策节点，若录以此为主线
  era: 清乾隆
  dates_known: true
- name_zh: 常青
  score: 5
  worth_why: 初九到郡整顿兵威屡挫贼锋郡城得全，然只能固守不能进取终被代换，守成名场面可用而周期残缺，居中教训
  era: 清乾隆
  dates_known: true
- name_zh: 庄大田
  score: 5
  worth_why: 南路响应与林爽文狼狈为奸，困守柴城临海而伏，水陆合围中被生擒，与林爽文并案可为呼应，单独事迹较简
  era: 清乾隆
  dates_known: false
