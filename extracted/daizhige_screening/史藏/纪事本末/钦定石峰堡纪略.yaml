source: 史藏/纪事本末/钦定石峰堡纪略.md
category: 史藏/纪事本末
verdict: has_candidates
candidates:
- name_zh: 福康安
  score: 8
  worth_why: 临危受命代陕甘总督，先于底店挫贼锋夺山梁，继围石峰堡濬壕断水，子夜设伏截杀、黎明直捣巢穴生擒首逆，又督善后绥靖西陲——缘起、阶段、关键决定、结果俱全
  era: 清乾隆朝
  dates_known: true
- name_zh: 阿桂
  score: 7
  worth_why: 老成宿将率健锐火器营劲旅继进，四面设卡层密环围合剿破堡；乾隆朝屡典军务之统帅，做事周期可考
  era: 清乾隆朝
  dates_known: true
- name_zh: 海兰察
  score: 7
  worth_why: 巴图鲁侍卫统领，先筹勘进兵路径诱贼截杀，底店追歼，石峰堡夜战率兵自外层层围裹痛加殱戮，武勇全程可考
  era: 清乾隆朝
  dates_known: true
- name_zh: 乾隆帝
  score: 6
  worth_why: 君主低优先作时间坐标；但其先期料定贼必翻山遁走、调重臣宿将、断水困兽之策贯穿全局，庙算先制胜可成名场面
  era: 清乾隆四十九年
  dates_known: true
- name_zh: 李侍尧
  score: 6
  worth_why: 反面教训典型：姑息养痈酿巨乱，贼起后逗遛靖远不亲督剿，两次纵贼翻山逃窜，终革职戴罪军前效力——失职误事的完整反面链条
  era: 清乾隆朝
  dates_known: true
- name_zh: 张文庆
  score: 5
  worth_why: 石峰堡首逆，蓄谋数年据险固守，断水后犹夜突夺路至兵败被擒，困兽之斗的反面周期；事迹偏简
  era: 清乾隆四十九年
  dates_known: true
- name_zh: 田五
  score: 5
  worth_why: 新教起事首倡，约五月初五起事被人告发而提前于小山举事、攻破西安土堡，旋中枪创自刎——全役缘起所在但起事旋灭
  era: 清乾隆四十九年
  dates_known: true
- name_zh: 马明心
  score: 5
  worth_why: 新教教主，被讦拘系囹圄，引发苏四十三杀官救师之乱，牵动数年回乱之源；本文仅追述其缘起
  era: 清乾隆朝
  dates_known: true
