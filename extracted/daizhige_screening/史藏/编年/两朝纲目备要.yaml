source: 史藏/编年/两朝纲目备要.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 虞允文
  score: 9
  worth_why: 采石之战以文臣督师破金主完颜亮为千古名场面；卷一详载其数番奏对力请早建储贰，引唐太宗问储、吕端故事，终定策立光宗，缘起阶段决策结果俱全
  era: 南宋孝宗朝
  dates_known: true
- name_zh: 韩侂胄
  score: 9
  worth_why: 外戚定策柄国、兴庆元党禁、孟浪挑金开禧北伐、兵败被诛函首安边，权相兴衰全周期，御题诗直评其事，教训典型
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 史弥远
  score: 8
  worth_why: 诛侂胄而擅权二十余年，专用佥壬、废济王立理宗，提要明言其奸恶几与侂胄无异，权臣覆辙之鉴
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 赵汝愚
  score: 8
  worth_why: 绍熙内禅定策迎立宁宗、百日右相而遭侂胄排挤贬死，其祸直接引发庆元党禁，忠臣功成身危之教训
  era: 南宋光宗宁宗之际
  dates_known: true
- name_zh: 朱熹
  score: 8
  worth_why: 庆元伪学之禁主角，党禁至身殁而道学终胜；书院学规社仓制度传世，凭本书庆元至嘉泰各卷及史学知识可录
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 真德秀
  score: 8
  worth_why: 御题诗专引其论和议名疏——为国当示人以难犯之意、以通和为权宜修德为实务、搜讨军实申儆边防，安危大计一言系兴衰
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 安丙
  score: 7
  worth_why: 定计诛叛臣吴曦收拾蜀局，旋杀参议官杨巨源掩功，提要讥其媢忌，功过交织成事周期完整
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 吴曦
  score: 7
  worth_why: 世将据蜀叛宋降金僭号蜀王，旋即覆灭诛夷，叛乱兴亡之典型教训
  era: 南宋宁宗朝开禧间
  dates_known: true
- name_zh: 杨巨源
  score: 7
  worth_why: 结李好义倡义诛曦，首功反为安丙辈掩没，坐擅杀冤死，忠而见疑之悲剧
  era: 南宋宁宗朝开禧间
  dates_known: true
- name_zh: 杨皇后
  score: 7
  worth_why: 内廷密旨促诛韩侂胄之关键决策者，后又与史弥远定废立之谋，深宫弄权定二朝走向
  era: 南宋宁宗朝
  dates_known: true
- name_zh: 李好义
  score: 6
  worth_why: 率忠义夺关诛曦之主力，旋遭毒杀，忠义速祸之训
  era: 南宋宁宗朝开禧间
  dates_known: true
- name_zh: 辛弃疾
  score: 6
  worth_why: 嘉泰开禧间再起知绍兴府进枢密都承旨，赍志以殁，北伐局中老臣晚境（凭目录时段与史学知识，本书开禧卷当载）
  era: 南宋宁宗朝
  dates_known: true
rejections:
- name_zh: 光宗
  why_not: 君主仅作编年坐标，过宫内禅诸事皆由臣下推动，自身无做事周期
- name_zh: 宁宗
  why_not: 庸弱之君，权柄先后在侂胄弥远，仅作时间坐标
- name_zh: 孝宗
  why_not: 卷一仅追叙立储背景，属他人定策之注脚
- name_zh: 理宗
  why_not: 书终于其即位前夕，仅嘉定末入继一节，事归史弥远
- name_zh: 济王赵竑
  why_not: 废立事件之受害者，本人无独立做事周期
- name_zh: 钱端礼
  why_not: 仅嫡孙名分议礼一节，事迹单薄
- name_zh: 王淮
  why_not: 传中仅以邪僻议礼被黜一条，无完整做事流
- name_zh: 陈俊卿
  why_not: 仅谏止皇孙出居一事，语焉不详
- name_zh: 夏震
  why_not: 捕诛侂胄之执行武弁，无自决之事可录
