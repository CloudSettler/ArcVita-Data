category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 王安石
  score: 10
  worth_why: 熙宁变法行青苗免役保甲诸新法；本序直指其出新意改旧法而国脉病、学术荒，为制度兴废与改革教训的枢纽人物
  era: 北宋神宗朝
  dates_known: true
- name_zh: 司马光
  score: 10
  worth_why: 十九年成资治通鉴为史学巨典；元祐更化尽罢新法；序称其稽古録为本朝史籍之纲，事业与褒贬俱足垂范
  era: 北宋仁宗至哲宗朝
  dates_known: true
- name_zh: 赵普
  score: 9
  worth_why: 佐艺祖建隆定策；杯酒释兵权、先南后北之略皆出其手；两度拜相，半部论语治天下，佐命元勋做事流完整
  era: 北宋太祖太宗朝
  dates_known: true
- name_zh: 寇准
  score: 9
  worth_why: 澶渊之役力主亲征定盟安天下；孤注一掷典出于此；直声震天下而再贬雷州，成败教训兼备
  era: 北宋真宗朝
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 戍边御夏、庆历新政陈十事、先忧后乐垂范千古；政治改革与人格典范俱全
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 平后蜀下江南不妄杀一人，江南归朝一无所取；岐沟之败自劾贬官，名将功过两截可为镜鉴
  era: 北宋太祖太宗朝
  dates_known: true
- name_zh: 韩琦
  score: 8
  worth_why: 与范仲淹并称韩范定西夏边事；历仁英神三朝辅政、定策立储、嘉祐治平之政有与焉
  era: 北宋仁宗英宗神宗朝
  dates_known: true
- name_zh: 杨业
  score: 7
  worth_why: 雁门大破辽军号杨无敌；雍熙北伐孤军力战陈家谷被执不食而死，忠烈与监军掣肘之教训并著
  era: 北宋太宗朝
  dates_known: true
- name_zh: 富弼
  score: 7
  worth_why: 奉使契丹折冲樽俎却增币之请；与庆历新政、至和执政相终始，外交与辅政两有可称
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 狄青
  score: 7
  worth_why: 由行伍至枢密使，夜渡昆仑关一举平侬智高；终遭猜忌出镇陈州而死，武人命运之痛史
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 欧阳修
  score: 7
  worth_why: 庆历党议、濮议之争的论辩主角；私修新五代史、与修新唐书，文章学术与台谏生涯俱有完整周期
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 苏轼
  score: 7
  worth_why: 乌台诗案九死一生；历新旧党争贬窜岭海而文章光焰万丈，命运起伏与人格韧性可为楷式
  era: 北宋神宗哲宗朝
  dates_known: true
- name_zh: 蔡京
  score: 7
  worth_why: 序称章吕鼓其波二蔡炽其焰；崇宁丰亨豫大兴学理财而速祸，奸臣乱政之头号反面教材
  era: 北宋徽宗朝
  dates_known: true
- name_zh: 童贯
  score: 7
  worth_why: 以宦官握兵二十年、经略西北；宣和联金灭辽启靖康之祸，序谓黼贯而极，亡国之责的首要样本
  era: 北宋徽宗朝
  dates_known: true
- name_zh: 陈均
  score: 7
  worth_why: 本编作者；患续通鉴长编浩如烟海，十余年删繁撮要私修九朝编年备要，纲本李氏目参诸书，真德秀林岊郑性之亟称之，积学成书的完整做事流
  era: 南宋宁宗理宗间
  dates_known: true
