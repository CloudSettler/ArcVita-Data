source: 史藏/编年/今本竹书纪年疏证.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 王国维
  score: 9
  worth_why: 著者本人，序中自述完整治学做事流：疑今本竹书纪年为后人搜辑，取惠栋、孙志祖疏证伪书之法，一一求其所出，证其袭他书者十之九九，遂成古本辑校与此疏证；另有甲骨卜辞先公先王考、殷周制度论、人间词话三境界说，皆学术名场面；生卒1877-1927可考，方法泽被后世
  era: 清末民初
  dates_known: true
- name_zh: 黄帝轩辕氏
  score: 7
  worth_why: 制冕服、以云纪官、命应龙攻蚩尤、洛水得河图龟书，为衣冠、官制与文明起源诸传说母题之诞生点；垂衣裳而天下治；惟本篇疏证已明言诸事皆袭宋书符瑞志等他书，年代纯系传说
  era: 上古传说时代
  dates_known: false
- name_zh: 帝尧陶唐氏
  score: 7
  worth_why: 命羲和历象日月星辰、初巡狩四岳、初治兵、命共工治河，历法与巡狩诸制度之诞生点；禅让典范见他书；本篇仅有编年骨架，元年丙子亦后世推排，年代不可确考
  era: 上古传说时代
  dates_known: false
