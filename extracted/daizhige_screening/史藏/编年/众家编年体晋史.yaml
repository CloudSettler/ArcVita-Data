source: 史藏/编年/众家编年体晋史.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 谢安
  score: 9
  worth_why: 淝水以八万之众破前秦倾国之师，围棋赌墅镇军心，风声鹤唳草木皆兵皆出于此役；东山再起、处变不惊，做事流完整且堪为后世典范
  era: 东晋
  dates_known: true
- name_zh: 祖逖
  score: 9
  worth_why: 闻鸡起舞、中流击楫两大名典之源；率部曲渡江，自募兵甲北伐收复豫州，志业中殂而功不竟，模范与遗憾兼具
  era: 东晋
  dates_known: true
- name_zh: 刘裕
  score: 9
  worth_why: 寒门以军功起家，平孙恩、卢循、桓玄，却月阵大破北魏铁骑，终代晋建宋；气吞万里如虎，寒人秉政之始
  era: 东晋
  dates_known: true
- name_zh: 王导
  score: 8
  worth_why: 衣冠南渡之总设计师，联络南北士族以立江左之局，历佐三帝而晋室不倾，时人比之管夷吾
  era: 东晋
  dates_known: true
- name_zh: 桓温
  score: 8
  worth_why: 平成汉、三度北伐收复洛阳，枋头败后行废立以固权；木犹如此人何以堪之叹，功业与野心交织的完整案例
  era: 东晋
  dates_known: true
- name_zh: 羊祜
  score: 8
  worth_why: 镇襄阳十年缮甲屯田、以怀柔收吴人之心，遗策平吴；死后百姓感泣立堕泪碑，德政与战略并举的典范
  era: 西晋
  dates_known: true
- name_zh: 杜预
  score: 8
  worth_why: 灭吴之役统帅，取江陵、径捣建业成大功；又注春秋左氏经传集解，文武兼资，时称杜武库
  era: 西晋
  dates_known: true
- name_zh: 周处
  score: 8
  worth_why: 少为乡里三害之首，斩蛟射虎幡然改过，终成名将战死西陲；改过迁善、忠烈死职之万世范例
  era: 西晋
  dates_known: true
- name_zh: 曹髦
  score: 8
  worth_why: 司马昭之心路人皆知一语即出其口；率僮仆数百亲讨权臣，身死志不夺，以血昭示权臣代主之变，教训深刻
  era: 曹魏
  dates_known: true
- name_zh: 陆机
  score: 8
  worth_why: 与弟云并称二陆入洛，文赋开文论先河；成都王帐下兵败遭谗，华亭鹤唳之叹千古悲音，才士误仕之镜
  era: 西晋
  dates_known: true
- name_zh: 裴松之
  score: 8
  worth_why: 奉诏注三国志，立补阙备异惩妄论辩四体，引书百余种，使三国史事赖以得传；史注之典范
  era: 东晋末
  dates_known: true
- name_zh: 孙盛
  score: 8
  worth_why: 著晋阳秋词直理正；桓温枋头之败欲令改削，盛不为屈，别录本以传后世，董狐直笔之风
  era: 东晋
  dates_known: true
- name_zh: 袁绍
  score: 8
  worth_why: 诛宦官、倡义讨董、界桥破公孙瓒据有四州；官渡拒许攸张郃之谏而覆灭，多谋少决之反面教材
  era: 东汉末
  dates_known: true
- name_zh: 习凿齿
  score: 7
  worth_why: 撰汉晋春秋以晋承汉，晋宜越魏继汉之论翻正统公案；临终上疏犹进忠言，史家立言之典型
  era: 东晋
  dates_known: true
- name_zh: 王濬
  score: 7
  worth_why: 于益州大造楼船七年，熔铁锁顺流直取建业受孙皓之降；王濬楼船下益州由此名垂，坚持既定战略之范例
  era: 西晋
  dates_known: true
rejections:
- name_zh: 汉桓帝
  why_not: 如厕问计、啮臂为盟诛梁冀堪称奇局，然君主低优先，且事详后汉书，可俟后录
- name_zh: 汉质帝
  why_not: 幼帝仅跋扈将军一语即遭鸩杀，无做事周期
- name_zh: 汉明帝
  why_not: 本卷仅存谒孔庙礼节与苛察鞭郎数条，不足以成轴
- name_zh: 汉章帝
  why_not: 仅幸鲁祀阙里论难一条，礼制记录而已
- name_zh: 汉献帝
  why_not: 都许后守位而已，君主坐标且无主动做事
- name_zh: 梁冀
  why_not: 跋扈覆亡可为教训，然本辑佚零散无完整做事流，宜从后汉书全传另录
- name_zh: 单超
  why_not: 五侯因谋诛梁冀得封，其后贪横无善终，事附桓帝不足独立成轴
- name_zh: 周瑜
  why_not: 别周鲁通诸葛论仅借为论辩靶的，行事另详三国志本传
- name_zh: 鲁肃
  why_not: 同上周论所贬，本卷无其实事可采
- name_zh: 王朗
  why_not: 不屈于孙策见气节，然仅一节，全传在三国志
- name_zh: 许攸
  why_not: 仅官渡献袭许一谏，怒而背绍无完整做事流
- name_zh: 张郃
  why_not: 仅绝粮一谏，宜从三国志全传另录
- name_zh: 审配
  why_not: 仅存遗袁谭书一篇，行事未具
- name_zh: 关靖
  why_not: 仅策马赴难同死一句，节烈可取而事迹太略
- name_zh: 钟离意
  why_not: 治孔庙得璧一奇闻而已，无做事流
- name_zh: 干宝
  why_not: 晋纪总论有史论传世，然本辑佚仅存目，宜据晋书本传另录
- name_zh: 徐广
  why_not: 目录存名，本辑佚中行事未详
- name_zh: 王韶之
  why_not: 目录存名，本辑佚中行事未详
