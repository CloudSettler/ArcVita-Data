source: 史藏/编年/元史续编.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 文天祥
  score: 10
  worth_why: 起兵勤王、使营抗辩被执、镇江亡走真州、与苗再成谋复宋、囚三年就义柴市；人生自古谁无死为千古名场面；本卷详载其亡走与再成会师之谋
  era: 南宋末
  dates_known: true
- name_zh: 朱元璋
  score: 10
  worth_why: 由濠州行伍至鄱阳湖决战、平江围城、北伐克大都建明定鼎；本书即大书至正二十八年八月明兵入都，成事周期极完整
  era: 元末
  dates_known: true
- name_zh: 伯颜
  score: 9
  worth_why: 传文作巴延；率长胜之师平宋，皋亭受降、入临安市不易肆，评者许其过曹彬；迁宋三宫以礼、辞见宋主知礼，攻灭周期完整
  era: 元初（世祖朝）
  dates_known: true
- name_zh: 脱脱
  score: 9
  worth_why: 传文作托克托；大义灭亲逐叔父伯颜夺柄、主修宋辽金三史、治河变钞、二次为相师老高邮终遭谗鸩；提要特举其灭亲之论，兴衰一线教训深刻
  era: 元中后期（顺帝朝）
  dates_known: true
- name_zh: 郭守敬
  score: 9
  worth_why: 授时历与四海测验为世界级科学工程，通惠河通漕大都；均在本书至元、成宗编年内有明确纪年
  era: 元初（世祖朝）
  dates_known: true
- name_zh: 张世杰
  score: 8
  worth_why: 挟二王出亡、焦山之战、崖山一字阵死战，焚香祝天大风覆舟而亡；本书评其未决性命于义利之间，忠烈与争议并存
  era: 宋末元初
  dates_known: true
- name_zh: 陈友谅
  score: 8
  worth_why: 弑徐寿辉自立、造巨舰争天下，鄱阳湖六十万大军中流矢死；枭雄兴亡完整，水战火攻名场面
  era: 元末
  dates_known: true
- name_zh: 张士诚
  score: 8
  worth_why: 十八人起高邮，败脱脱大军致其被谗罢兵；据吴称王终困平江自缢；本书详纪高邮起事与脱脱兵败之连锁
  era: 元末
  dates_known: true
- name_zh: 王保保
  score: 8
  worth_why: 或作扩廓帖木儿；乱军中擎元撑危局，太原奇袭、岭北破徐达，明太祖叹为天下奇男子；北元支柱周期完整
  era: 元末
  dates_known: true
- name_zh: 察罕帖木儿
  score: 8
  worth_why: 以乡兵起家，收复关陕齐鲁、几平红巾，益都围城为降将田丰所刺；中兴骤兴骤陨，周期完整
  era: 元末
  dates_known: true
- name_zh: 李芾
  score: 8
  worth_why: 死守潭州，除夕城陷，召沈忠遍杀家人引颈受刃，幕僚军民举家殉城、缢者相望；本卷详载，惨烈忠义名场面
  era: 南宋末
  dates_known: true
- name_zh: 陆秀夫
  score: 7
  worth_why: 流亡海上朝仪不辍，终负帝蹈海殉国；本卷已见其辅二王兴复诸事
  era: 南宋末
  dates_known: true
- name_zh: 李庭芝
  score: 7
  worth_why: 淮东柱石守扬州，然误信流言疑文天祥说降，失苗再成会师之机；两宫被邀、泰州被执，成败教训兼备
  era: 南宋末
  dates_known: true
- name_zh: 刘福通
  score: 7
  worth_why: 白莲教首义立韩林儿建龙凤政权，三路北伐撼动中原，终败安丰；元末大变局推手，周期可考
  era: 元末
  dates_known: true
- name_zh: 燕铁木儿
  score: 7
  worth_why: 两都之战以少胜多定文宗之立，迎明宗而明宗暴崩，权倾朝野；本书详纪天历之际宫廷变局
  era: 元中期（文宗朝）
  dates_known: true
rejections:
- name_zh: 陈宜中
  why_not: 迁都之请不果即遁温州，清澳之逃、占城之往，遇事辄逃，无成事周期，仅作反面注脚
- name_zh: 夏贵
  why_not: 淮西老将降元，传中仅降附数语
- name_zh: 贾余庆
  why_not: 充祈请使附逆，事迹一二句，无独立做事流（谢堂、刘岊同）
- name_zh: 苗再成
  why_not: 再成之谋一段精彩，然传文数行、终局阙如，评分5-6缓录
- name_zh: 沈忠
  why_not: 受李芾之命杀其全家后自刭，依附李芾一事而已
- name_zh: 尹谷
  why_not: 为二子行冠礼后举家自焚，殉节一句，无做事周期（徐应镳率子赴井同）
- name_zh: 拜住
  why_not: 至治新政未几即殁于南坡之变，做事流过短，可缓录
- name_zh: 阿合马
  why_not: 柄国敛财，史笔止于遇刺伏诛，作权奸教训注脚（桑哥同）
- name_zh: 谢太后
  why_not: 宋室主降仅作事件坐标，无独立做事
- name_zh: 赵昰、赵昺
  why_not: 宋末二主为流亡符号，君主低优先，仅作年代坐标
- name_zh: 元英宗、文宗、明宗、顺帝等
  why_not: 天下共主低优先，南坡之变、天历阴谋等皆作背景，无独立做事流
- name_zh: 董文炳
  why_not: 追二王、入临安安辑，皆附伯颜传中数语，无独立名场面
