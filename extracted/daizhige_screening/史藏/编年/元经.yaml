source: 史藏/编年/元经.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 贾后
  score: 8
  worth_why: 由皇后专权起步，诛杨骏、废弑太后、杀汝南王亮与卫瓘、借楚王玮之手复归罪杀之，权术链条完整，直接引燃八王之乱，是祸国权后祸晋始阶的完整教训样本
  era: 西晋
  dates_known: true
- name_zh: 王通
  score: 8
  worth_why: 献太平十二策不见用，弃仕归河汾讲学，著续六经成元经，门下传为魏征房玄龄李靖诸师，儒门教学立言做事流完整；虽本书依托有疑，其河汾讲学本体可考
  era: 隋末
  dates_known: true
- name_zh: 薛收
  score: 7
  worth_why: 舍王世充归唐，入秦王府文学馆为十八学士，任记室主军国文翰，深得李世民倚重而早卒，弃暗投明与英年之憾并见
  era: 隋末唐初
  dates_known: true
- name_zh: 阮逸
  score: 6
  worth_why: 生平喜作伪书，伪造元经与关朗易传流传数百年几惑尽历代学者，又通雅乐与胡瑗同校钟律；作伪与制乐并存，是学术造假流传之久远的警示标本
  era: 北宋
  dates_known: true
- name_zh: 和峤
  score: 5
  worth_why: 见太子不慧直言恐不了陛下家事，武帝问则答圣质如初，惠帝立后果天下乱，世称先见，外交辞令名场面
  era: 西晋
  dates_known: true
- name_zh: 杨骏
  score: 5
  worth_why: 受遗诏总百官辅政而不学伊霍之忠，遣屯兵四出以示威，一年之间为贾后所诛夷三族，外戚专权速亡之典型
  era: 西晋
  dates_known: true
rejections:
- name_zh: 石鉴
  why_not: 传中仅拒杨骏之命护汝南王亮一善举，无完整做事周期
- name_zh: 司马泰
  why_not: 仅有节俭恭谨品行赞语，无做事流
- name_zh: 卫瓘
  why_not: 传文仅见与汝南王亮同被贾后所杀
- name_zh: 楚王玮
  why_not: 充贾后爪牙杀亮瓘后归罪被诛，无独立做事流
- name_zh: 汝南王亮
  why_not: 仅附于被杀事件，无做事事迹
- name_zh: 胡瑗
  why_not: 仅见与阮逸同校钟律一句
- name_zh: 晋惠帝
  why_not: 君主仅作纪年坐标，传中指其不慧无做事
- name_zh: 晋武帝
  why_not: 开篇即崩，仅作时间起点
- name_zh: 张泓
  why_not: 仅代草太子答书一事，人物过简
