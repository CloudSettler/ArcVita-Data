source: 史藏/编年/前汉纪.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 陈胜
  score: 9
  worth_why: 佣耕即怀鸿鹄之志，燕雀安知鸿鹄一语传世；大泽乡揭竿首事反秦，鱼腹丹书篝火狐鸣皆出此役；由佣耕至称王张楚至败亡周期完整，本卷直书斩故人、任朱房胡武苛察、诸将不亲附、此其所以亡，教训现成
  era: 秦末
  dates_known: true
- name_zh: 张骞
  score: 10
  worth_why: 凿空西域通丝绸之路，两度出使被留十余年持节不失；以功封博望侯；外交开拓与大探险兼于一身，做事流完整
  era: 西汉武帝时
  dates_known: true
- name_zh: 霍光
  score: 9
  worth_why: 受武帝遗诏辅政二十年，挫上官桀燕王旦之谋，废昌邑王立宣帝而定昭宣中兴；生前善终身后族灭，权臣可法可戒的双重样本
  era: 西汉武昭宣之际
  dates_known: true
- name_zh: 王莽
  score: 9
  worth_why: 由谦恭外戚至篡汉建新，托古改制全面失败至覆亡；王田私属、五均六筦等新政为变法失败完整样本，警示价值极高
  era: 西汉末至新朝
  dates_known: true
- name_zh: 陈汤
  score: 9
  worth_why: 矫制发西域诸国兵远袭康居斩郅支单于，明犯强汉者虽远必诛传诵两千年；矫制之罪与不世之功的决策张力为经典案例
  era: 西汉元帝时
  dates_known: true
- name_zh: 赵充国
  score: 9
  worth_why: 年逾七十请缨平羌，力排众议坚持罢骑屯田，不战而屈人之兵的典范；屯田之策为制度决策名场面
  era: 西汉宣帝时
  dates_known: true
- name_zh: 贾谊
  score: 9
  worth_why: 弱冠献治安策，过秦论仁义不施而攻守之势异也传诵千古；少年得志至长沙宣室而抑郁早逝，政论遗产与才命之叹兼备
  era: 西汉文帝时
  dates_known: true
- name_zh: 曹参
  score: 8
  worth_why: 攻城野战之功居功臣第二；代萧何为相举事无所变更，萧规曹随成语之源，清静无为与民休息的治世范例
  era: 秦末汉初
  dates_known: true
- name_zh: 晁错
  score: 8
  worth_why: 力主削藩点燃七国之乱，衣朝衣斩于东市；以一身之死成削藩大局，改革者担当与悲剧俱全
  era: 西汉文景时
  dates_known: true
- name_zh: 陆贾
  score: 8
  worth_why: 马上得天下宁可以马上治之一语定汉初国策；两使南越说尉佗去帝制称臣奉汉；著新语十二篇开汉家儒术之先声
  era: 秦末汉初
  dates_known: true
- name_zh: 刘向
  score: 8
  worth_why: 奉诏校书天禄阁二十余年，撰别录开中国目录学之祖；说苑新序列女传传世；屡上封事极谏外戚宦官之祸
  era: 西汉元成之世
  dates_known: true
- name_zh: 司马相如
  score: 8
  worth_why: 子虚上林为汉赋典范确立赋谏一体范式；奉使略定西南夷抚邛筰；琴挑文君为传世名场面
  era: 西汉景武之世
  dates_known: true
- name_zh: 田横
  score: 8
  worth_why: 齐亡不入汉，应召赴洛阳自刎于途；海中五百客闻讯皆自尽，田横五百士为气节之绝唱，刘辰翁后犹为题材不衰
  era: 秦末汉初
  dates_known: true
- name_zh: 桑弘羊
  score: 8
  worth_why: 算缗告缗盐铁均输平准，为武帝北击匈奴理财支柱；盐铁会议舌战贤良文学为经济思想名场面；终以身殉于权力之争
  era: 西汉武帝时
  dates_known: true
- name_zh: 金日磾
  score: 8
  worth_why: 匈奴休屠王太子没入官为养马奴，以笃慎累迁至受遗辅政；马何罗行刺当日以身当之擒逆；异族质子至顾命大臣，处世与忠诚之范
  era: 西汉武帝时
  dates_known: true
rejections:
- name_zh: 吴广
  why_not: 起事中道为部将田臧矫陈王命所杀，无独立完整做事周期，事功附于陈胜
- name_zh: 周文
  why_not: 西进号称百万旋败于章邯，传文数行而已
- name_zh: 武臣
  why_not: 旋起旋灭，教训与陈胜重叠，无独立可书之关键决策
- name_zh: 韩广
  why_not: 立燕王事简，仅足作时间坐标
- name_zh: 雍齿
  why_not: 叛丰降魏数行事，后仅以封侯附见
- name_zh: 庄贾
  why_not: 杀主降秦一逆事而已，无事业可言
