source: 史藏/编年/唐创业起居注.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 李渊
  score: 10
  worth_why: 做事流最完整——起自太原道安抚大使、习突厥骑射以驭之、雀鼠谷以二阵疑兵大破历山飞、遭驿系之厄隐忍待时、借刘武周窃号而预部分兵粮、设计除王威高君雅、空城疑敌退突厥数万骑、手疏与突厥和亲借兵；缘起经营决断结局俱全，且此书独证举事由高祖本谋，可纠正本纪归功秦王之说
  era: 隋末唐初
  dates_known: true
- name_zh: 李世民
  score: 7
  worth_why: 于晋阳密招豪友、倾财赈施卑身下士，收士庶之心；此书存其从起兵首义之早期实录，后为统一战争主将，其做事周期自此发端，与本纪叙事可互勘
  era: 隋末唐初
  dates_known: true
- name_zh: 刘文静
  score: 6
  worth_why: 起兵核心谋主，导司马刘正防告发王威高君雅私通突厥以清内障；后奉使突厥成和亲借兵之策，终以谮死，功臣倾覆之教训典型
  era: 隋末唐初
  dates_known: true
- name_zh: 李建成
  score: 6
  worth_why: 于河东潜结英俊、倾财赈施，预建义之谋；建义后统左军有同起之功，其后储位覆亡足为教训
  era: 隋末唐初
  dates_known: true
- name_zh: 温大雅
  score: 6
  worth_why: 兵兴时为记室参军主文檄，亲历记三百五十七日之事，所得于见闻独为真确；以史笔存信史、证举事本谋，为史官立言之模范
  era: 隋末唐初
  dates_known: true
- name_zh: 裴寂
  score: 5
  worth_why: 晋阳宫监检校仓粮、委以守备诸门，以宫粮甲仗资起义；由宫监而开国宰相终遭贬斥，宦海起伏可为一鉴；本卷事迹尚简
  era: 隋末唐初
  dates_known: true
- name_zh: 刘武周
  score: 5
  worth_why: 杀太守据马邑自称定杨天子，破楼烦进据汾源宫，直接扣动晋阳起兵之时机；后为唐初劲敌终败亡，可作割据兴亡之例；本卷仅存其起局
  era: 隋末
  dates_known: true
rejections:
- name_zh: 王仁恭
  why_not: 兵少违高祖指踪为突厥所败被斩，仅作李渊用兵之反衬
- name_zh: 王威
  why_not: 隋廷耳目，密伺高祖事败被系，无独立做事周期
- name_zh: 高君雅
  why_not: 同为副留守，违旨失利而还，卒成被除之局
- name_zh: 王漫天
  why_not: 即历山飞，群盗一役为高祖智谋所破，仅作名场面之陪衬
- name_zh: 梁师都
  why_not: 仅一句杀郡官称帝，无事迹展开
- name_zh: 刘龙
  why_not: 晋阳富人告密数十字，事件配角
- name_zh: 王康达
  why_not: 伏击突厥战死汾河，单一事件配角
- name_zh: 长孙顺德
  why_not: 领兵伏宫城东门待变，此卷中无独立做事
- name_zh: 赵文恪
  why_not: 与长孙顺德同领伏兵，无独立事迹
- name_zh: 始毕可汗
  why_not: 兵临与退遁皆作李渊方略之注脚，自无做事周期
- name_zh: 隋炀帝
  why_not: 远在江都仅作时局背景与驿系高祖之一环，本卷无其做事流
- name_zh: 杨侑
  why_not: 隋少帝逊位旧邸一句而已，仅时间坐标
