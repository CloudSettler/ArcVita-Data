candidates:
- name_zh: 范蠡
  score: 9
  worth_why: 助越灭吴后辞禄泛五湖，功成身退之千古典范；转经商三致千金为商圣；与文种对照成鸟尽弓藏之诫
  era: 春秋末
  dates_known: true
- name_zh: 荀瑶
  score: 8
  worth_why: 智伯专晋国政，伐郑袭卫灭夙繇屡胜，然戏韩虎侮段规辱无恤，骄横招祸终致身死族灭，才胜德之典型教训，牵出豫让报仇与三家分晋
  era: 春秋末战国初
  dates_known: true
- name_zh: 赵无恤
  score: 8
  worth_why: 赵襄子灭代拓地，忍荀瑶之辱蓄志报之，后据晋阳反灭智伯与韩魏三分晋室，忍辱成事之典范
  era: 春秋末战国初
  dates_known: true
- name_zh: 陈恒
  score: 7
  worth_why: 田成子杀阚止弑简公专国权，诛鲍晏强族割安平至琅琊为封邑，开田氏代齐之局；孔子沐浴请讨为名场面
  era: 春秋末
  dates_known: true
- name_zh: 叶公沈诸梁
  score: 7
  worth_why: 白公之乱中率方城外人讨公孙胜迎楚惠王复位，危难存楚；叶公好龙之讥与其真担当成耐人寻味反差
  era: 春秋末
  dates_known: true
- name_zh: 端木赐
  score: 6
  worth_why: 子贡使齐为介齐归鲁侵地；儒商鼻祖端木遗风，存鲁乱齐之外交纵横
  era: 春秋末
  dates_known: true
- name_zh: 赵鞅
  score: 6
  worth_why: 赵简子帅师伐卫围卫为晋卿之首；铸刑鼎平范中行之乱经略晋阳，为三家分晋奠基
  era: 春秋末
  dates_known: true
- name_zh: 白公胜
  score: 5
  worth_why: 杀令尹司马执楚子旋败死，复仇失控身败名裂之警示
  era: 春秋末
  dates_known: true
- name_zh: 文种
  score: 5
  worth_why: 佐勾践霸越却终被赐死，飞鸟尽良弓藏之实证教训
  era: 春秋末
  dates_known: true
