source: 史藏/编年/大事记续编.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 霍光
  score: 9
  worth_why: 受武帝托孤辅政二十年，主持盐铁会议，废昌邑立宣帝开权臣废立之先例，身后霍氏族灭足为权臣镜鉴
  era: 西汉
  dates_known: true
- name_zh: 王莽
  score: 9
  worth_why: 外戚篡汉建新，行王田币制等全面改制而身死国灭，是大改制失败的第一标本
  era: 西汉末至新莽
  dates_known: true
- name_zh: 马援
  score: 9
  worth_why: 马革裹尸老当益壮聚米为山，平陇定越击羌御乌桓，晚年薏苡明珠之谤见谗，功臣样本兼教训
  era: 东汉初
  dates_known: true
- name_zh: 张仲景
  score: 9
  worth_why: 宗族死于伤寒而发愤著伤寒杂病论，开辨证论治之宗，坐堂行医，后世尊为医圣
  era: 东汉末
  dates_known: true
- name_zh: 王猛
  score: 10
  worth_why: 扪虱而谈天下事，佐苻坚治秦关中大治，临终戒勿伐晋而坚不听，终有淝水之败，决策样本极完整
  era: 十六国前秦
  dates_known: true
- name_zh: 祖逖
  score: 9
  worth_why: 闻鸡起舞中流击楫，北渡收复黄河以南而忧愤病卒，功败垂成的北伐志士典范
  era: 西晋末至东晋初
  dates_known: true
- name_zh: 谢安
  score: 10
  worth_why: 东山再起围棋赌墅，淝水之战以八万破前秦大军，保全江左，风流宰相名场面极多
  era: 东晋
  dates_known: true
- name_zh: 刘裕
  score: 9
  worth_why: 寒门起兵，两度北伐灭南燕后秦，却月阵破精骑，代晋建宋启南朝，气吞万里如虎
  era: 东晋末至南朝宋
  dates_known: true
- name_zh: 李世民
  score: 10
  worth_why: 虎牢一战擒两王，玄武门定鼎，贞观之治四夷宾服称天可汗，兼创业与守成之全周期
  era: 隋末唐初
  dates_known: true
- name_zh: 魏征
  score: 10
  worth_why: 谏太宗十思疏犯颜直谏二百余事，兼听则明偏信则暗，以人为镜之喻传千古，谏臣第一典范
  era: 隋末唐初
  dates_known: true
- name_zh: 玄奘
  score: 10
  worth_why: 孤身西行五万里历时十七年取经，归国译经千卷创唯识宗，求法者之极致
  era: 唐
  dates_known: true
- name_zh: 郭子仪
  score: 10
  worth_why: 平安史复两京，单骑退回纥再造大唐，功盖天下而主不疑权倾朝野而朝不忌，人臣处功名之极则
  era: 唐
  dates_known: true
- name_zh: 杜甫
  score: 10
  worth_why: 陷贼走凤翔贬官弃官漂泊西南，成三吏三别以诗证史，诗圣之路是乱世文人完整样本
  era: 唐
  dates_known: true
- name_zh: 韩愈
  score: 10
  worth_why: 谏迎佛骨一封朝奏夕贬潮州，驱鳄兴学，倡古文运动文起八代之衰，道统担当典范
  era: 唐
  dates_known: true
- name_zh: 柴荣
  score: 9
  worth_why: 高平之战整军经武，均定田赋废佛兴学，三征南唐北伐幽燕，立十年开拓天下之志而中道崩殂
  era: 五代后周
  dates_known: true
rejections:
