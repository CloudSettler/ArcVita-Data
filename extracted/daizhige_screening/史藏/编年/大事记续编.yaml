  why_not: 仅以一疏讼戾太子冤骤迁丞相一事可述，无完整做事周期
- name_zh: 赵过
  why_not: 仅教民代田一节可考，生平行事不详，宜缓录
- name_zh: 李广利
  why_not: 远征大宛师老财匮终兵败降匈奴，与卫霍李广等武人重合，反面价值有限
