source: 史藏/编年/大唐创业起居注.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 李渊
  score: 10
  worth_why: 晋阳起兵的完整做事流主脑——奉使太原自喜天授、仿突厥习骑射破敌于马邑、雀鼠谷设伪阵大阵诱敌以智破历山飞、定策「唐固吾国，太原即其地，天与不取祸将及」、借备刘武周之名兴国寺募兵、设计收系王威高君雅翦除内患；缘起、阶段、关键决断、结果俱全，隐忍与雄断并见，为开唐三百年基业的决定性起点，且「此后余年，实为天假」等名场面皆出于此
  era: 隋末唐初
  dates_known: true
- name_zh: 李世民
  score: 8
  worth_why: 本卷中已见锋芒——泣谏其父勿同受孥戮、请同汉祖观时变、于晋阳密招豪友倾财下士、总领兴国寺伏兵；「芒砀山泽是处容人」之对已具日后行事风格，做事流虽在本卷仅开端，而后续极完整
  era: 隋末唐初
  dates_known: true
- name_zh: 刘文静
  score: 7
  worth_why: 晋阳县令，甲子之晨首告王威高君雅私通突厥，助李渊一举翦除炀帝眼线，又与裴寂分守诸门御突厥，起兵关键推手
  era: 隋末唐初
  dates_known: true
- name_zh: 刘武周
  score: 6
  worth_why: 杀马邑太守王仁恭、据郡自称天子国号定杨，其骤起直接促成李渊借讨伐备边之名募兵，为晋阳起兵导火索，后更成唐初劲敌
  era: 隋末
  dates_known: true
- name_zh: 裴寂
  score: 6
  worth_why: 晋阳宫监，受命检校仓粮赈给军户，突厥逼城时分守诸门，晋阳元从重臣，与刘文静并为起兵内外枢纽
  era: 隋末唐初
  dates_known: true
- name_zh: 李建成
  score: 6
  worth_why: 于河东潜结英俊，起兵前奉密使催追南下会师，本卷着墨虽少，然为建唐元从与后续大军主将
  era: 隋末唐初
  dates_known: true
rejections:
- name_zh: 王威、高君雅
  why_not: 炀帝所遣副留守，职在监视猜忌李渊，旋即被收系，仅作起兵之引线，无独立做事周期
- name_zh: 王仁恭
  why_not: 马邑备胡全赖李渊指踪，本人怯而无谋，终为刘武周所杀，只堪作李渊传注脚
- name_zh: 梁师都
  why_not: 杀郡官称天子仅一句带过，无做事流可考
- name_zh: 王康达
  why_not: 设伏抄马失利坠汾而死，仅一败役
- name_zh: 刘龙
  why_not: 晋阳富户，通风报信一事而已
- name_zh: 长孙顺德、赵文恪
  why_not: 奉命伏兵五百于晋阳宫门，无独立事迹
