candidates:
- name_zh: 赵匡胤（宋太祖）
  score: 10
  worth_why: 掌禁军六年恩威素著，陈桥兵变黄袍加身，约束大军入城秋毫无犯，受禅建宋终结五代武人擅立之局；从缘起、定策、约法到受禅建号做事流完整，黄袍加身为千年名场面，得天下以仁可为后世模范
  era: 五代末至北宋初
  dates_known: true
- name_zh: 赵普
  score: 8
  worth_why: 陈桥之变中夜定约束、晓譬诸将，倡言兴王易姓虽云天命实系人心；宋初大政多出其手，后为杯酒释兵权主谋；半部论语治天下之典
  era: 北宋初
  dates_known: true
- name_zh: 赵光义（宋太宗）
  score: 7
  worth_why: 陈桥拥立中与赵普同参机密；后继统灭北汉收吴越完成统一，高梁河之败为重大转折；烛影斧声之谜聚讼千年
  era: 北宋初
  dates_known: true
- name_zh: 石守信
  score: 5
  worth_why: 禁军宿将，陈桥之变中为内应心腹，后为杯酒释兵权典型，功高善终可为自处之鉴；本卷事迹简略宜缓录
  era: 北宋初
  dates_known: true
