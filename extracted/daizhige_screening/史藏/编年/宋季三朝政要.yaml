candidates:
- name_zh: 真德秀
  score: 9
  worth_why: 殿上连奏收人心四策，以舜处象讽谏理宗，直指济王之冤；遭史弥远忌而四辞内制、终降三官，为直臣楷模，做事流完整
  era: 南宋理宗朝
  dates_known: true
- name_zh: 魏了翁
  score: 8
  worth_why: 与真德秀并称直臣，力言济王不当废；贬靖州六年闭户读书自如，逆境修身之模范
  era: 南宋理宗朝
  dates_known: true
- name_zh: 赵葵
  score: 7
  worth_why: 倡守河据关、亲率五万兵取泗取汴，督战洛阳终致端平入洛之败（本书误系于宝庆），兵败班师后又历帅阃，完整含教训的做事周期
  era: 南宋宁宗至理宗朝
  dates_known: true
- name_zh: 杜杲
  score: 6
  worth_why: 举朝言战独一人力陈出师之害，深沟高垒之守论先见应验；史传以安丰、庐州却蒙古军为南宋守城名将
  era: 南宋理宗朝
  dates_known: true
- name_zh: 胡梦昱
  score: 6
  worth_why: 应诏上书百余言讦直无忌，援申生、戾太子事为济王鸣冤，贬象州死于瘴乡，十年后昭雪赠谥刚简，可作直道之教
  era: 南宋理宗朝
  dates_known: true
- name_zh: 洪咨夔
  score: 6
  worth_why: 台谏弹去史弥远党羽王定，朝野惊叹，直声震主；虽薨于位而风骨足式
  era: 南宋理宗朝
  dates_known: true
- name_zh: 史弥远
  score: 6
  worth_why: 废立济王、改书害命、罗织真魏、蓄梁成大为鹰犬，权相误国路线图完整，为反面教训典型
  era: 南宋宁宗至理宗朝
  dates_known: true
- name_zh: 全子才
  score: 5
  worth_why: 万余人先入汴京、杀崔立受降，旋因粮绝洛阳溃退，主政河南一事始终俱备，然败绩为主
  era: 南宋理宗朝
  dates_known: true
- name_zh: 济王赵竑
  score: 5
  worth_why: 被拥立时黄袍加身号泣不从、约众勿伤太后官家，终被逼缢死，悲剧弧线完整，可作人伦之变的鉴戒
  era: 南宋理宗朝
  dates_known: true
- name_zh: 梁成大
  score: 5
  worth_why: 茶肆毁真德秀得擢察院，贻书谓真小人伪君子，时人目为梁成犬，士人失节之反面教材
  era: 南宋理宗朝
  dates_known: true
- name_zh: 李全
  score: 5
  worth_why: 本段见其约起兵失期而叛归北；史传由抗金义军首领终叛宋败死扬州，由忠而叛的完整教训弧线
  era: 南宋宁宗至理宗朝
  dates_known: true
