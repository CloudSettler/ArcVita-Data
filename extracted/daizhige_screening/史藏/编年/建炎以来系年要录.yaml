source: 史藏/编年/建炎以来系年要录.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 岳飞
  score: 10
  worth_why: 四度出师、郾城颍昌大捷、朱仙镇饮马；冻死不拆屋饿死不掳掠治军；十二金牌班师、莫须有下狱、风波亭冤死；精忠模范与千古教训兼备，做事流完整
  era: 南宋初（建炎绍兴间）
  dates_known: true
- name_zh: 虞允文
  score: 9
  worth_why: 采石之战以书生督师破完颜亮大军，缓急定策力挽江左；一捷而扭转全局的名场面
  era: 南宋（绍兴末）
  dates_known: true
- name_zh: 韩世忠
  score: 9
  worth_why: 苗刘之变勤王定难；黄天荡困兀术四十八日、梁红玉击鼓战金山；大仪镇大捷；功高而闭口不言兵，进退有节
  era: 南宋初
  dates_known: true
- name_zh: 宗泽
  score: 8
  worth_why: 东京留守联结两河义军，屡疏请高宗还都北伐；临终三呼过河，未竟之志典型
  era: 两宋之际
  dates_known: true
- name_zh: 李纲
  score: 8
  worth_why: 靖康守汴挫金兵；建炎首相而七十七日罢，主战柱石，起落皆可为镜
  era: 两宋之际
  dates_known: true
- name_zh: 吴玠
  score: 8
  worth_why: 和尚原大破兀术、仙人关再捷，保蜀口，以少胜多名场面；弟吴璘继之
  era: 南宋初
  dates_known: true
- name_zh: 刘锜
  score: 8
  worth_why: 顺昌之战以偏师破兀术铁浮屠之众；名将终遭闲置，成败教训并存
  era: 南宋初
  dates_known: true
- name_zh: 耶律大石
  score: 8
  worth_why: 辽亡后率残部西走，建西辽称菊儿汗，卡特万破塞尔柱联军；万里复国的完整做事流，本册卷一已见其名
  era: 辽末至西辽
  dates_known: true
- name_zh: 洪皓
  score: 8
  worth_why: 使金被留十五年不降，冷山教书、密传敌情，归宋称宋之苏武；使节气节模范
  era: 南宋初
  dates_known: true
- name_zh: 秦桧
  score: 8
  worth_why: 专主和议十九年、构陷岳飞、大兴狱案；权奸祸国的完整标本，宜作反面教材录之
  era: 南宋初
  dates_known: true
- name_zh: 辛弃疾
  score: 8
  worth_why: 从耿京起义、奉表南归，五万众营中缚叛将张安国；本册册末仅及其南归一节，主体事迹在孝宗朝，宜连录
  era: 南宋（绍兴末至孝宗朝）
  dates_known: true
- name_zh: 完颜亮
  score: 7
  worth_why: 篡立迁都燕京、举国六十万南侵，采石败而瓜洲被弑；穷兵黩武之反面教训
  era: 金（皇统至正隆）
  dates_known: true
- name_zh: 完颜宗弼
  score: 7
  worth_why: 搜山检海追高宗；黄天荡、富平、和尚原、顺昌屡败屡战，终主绍兴和议；敌方主线，可与诸将对读
  era: 金（天会至皇统）
  dates_known: true
- name_zh: 张浚
  score: 7
  worth_why: 苗刘之变定策复辟；经略川陕、富平之败、起用吴玠保蜀；误杀曲端为深刻教训
  era: 南宋初
  dates_known: true
- name_zh: 赵鼎
  score: 7
  worth_why: 两度为相支撑半壁；忤秦桧被贬吉阳军，绝食而卒；贤相气节与党祸教训
  era: 南宋初
  dates_known: true
rejections:
- name_zh: 宋高宗赵构
  why_not: 一朝共主，本册以其纪年作时间坐标；无商鞅变法级突出做事，其功过可附于和议诸人事中
- name_zh: 童贯
  why_not: 主要事业在徽宗朝，卷首仅追叙海上之盟缘起，册内无完整做事周期
- name_zh: 蔡京
  why_not: 权相事业在册前，册内仅靖康末贬死余波
- name_zh: 郭药师
  why_not: 降辽降宋复降金，反复无常，无完整正做事流，仅作教训注脚
- name_zh: 马政、马扩、呼延庆
  why_not: 皆为海上之盟使节，事迹附丽于朝廷决策，无独立完整做事流
- name_zh: 梁红玉
  why_not: 击鼓战金山附于韩世忠黄天荡事，宜在韩传内呈现，无独立周期
- name_zh: 张俊、刘光世
  why_not: 虽列中兴四将，册内少对等名场面；张俊构陷岳飞可作岳案之注
- name_zh: 张邦昌、刘豫
  why_not: 伪楚伪齐傀儡，无独立做事流，仅作时局坐标
- name_zh: 耿京、张安国
  why_not: 事线短促，附于辛弃疾南归一节即可
- name_zh: 曲端
  why_not: 骁将冤死于张浚，周期残缺，宜附于张浚传教训
