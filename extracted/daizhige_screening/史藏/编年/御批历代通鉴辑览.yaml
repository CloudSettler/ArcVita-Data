source: 史藏/编年/御批历代通鉴辑览.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 朱元璋
  score: 10
  worth_why: 布衣行乞至开国天子，鄱阳湖灭陈友谅、北伐驱逐胡元、立洪武祖制；本书凡例明言顺帝十五年明祖起兵后别书元以示异，正以之为断限枢纽
  era: 元末明初
  dates_known: true
- name_zh: 狄仁杰
  score: 9
  worth_why: 大理寺丞岁断狱一万七千无冤语；死生之际谏武则天复立庐陵王、荐张柬之，唐祚赖以复续；本书凡例以其入周事用特笔变文，发千古未发之隐
  era: 唐武周之际
  dates_known: true
- name_zh: 文天祥
  score: 9
  worth_why: 散家财起兵勤王、出使被拘脱归、狱中正气歌、柴市死节；本书谕旨以宋末文天祥陆秀夫为准绳裁量明末殉节诸臣
  era: 南宋末
  dates_known: true
- name_zh: 朱熹
  score: 9
  worth_why: 集理学之大成；资治通鉴纲目立正统书法，为本书纲目体例直承之祖；鹅湖之会、白鹿洞学规、庆元党禁皆名场面
  era: 南宋
  dates_known: true
- name_zh: 司马光
  score: 9
  worth_why: 十九年勒成资治通鉴，举要之例为历代通鉴纂要所本；力反新法至元祐更化，成毁皆系一身，做事流完整
  era: 北宋
  dates_known: true
- name_zh: 李自成
  score: 8
  worth_why: 驿卒起事至建大顺、陷京师致明亡，旋败于山海关速亡；本书甲申不遽书明亡、福王被执始书，全案系于其进退
  era: 明末清初
  dates_known: true
- name_zh: 李定国
  score: 8
  worth_why: 由献贼义子转为南明柱石，桂林衡州两蹶名王，磨盘山血战，抱病死于边地；本书谕旨特及其名，其各为其主始终不屈堪比宋末双忠
  era: 明末清初
  dates_known: true
- name_zh: 唐太宗
  score: 8
  worth_why: 君主中突出做事者故破例入录；晋阳起兵、玄武门之变、渭水退突厥、贞观之治、天可汗与律令科举之制；本书御制诗以国是太宗创许其立国规模
  era: 唐初
  dates_known: true
- name_zh: 乾隆帝
  score: 7
  worth_why: 敕纂通鉴辑览一百十六卷，亲定甲申大书崇祯十七年、福王被执始书明亡、附纪唐桂二王诸大义，天下者天下之天下非一家之天下为其纲领；君主低优先，故取其编书一事录之
  era: 清中期
  dates_known: true
- name_zh: 褚遂良
  score: 7
  worth_why: 顾命托孤之臣，还笏叩首死争废立，贬潭州而不悔；本书冠以御制诗嘉其忠悃；又为初唐书家，楷法立则
  era: 唐初
  dates_known: true
- name_zh: 陆秀夫
  score: 7
  worth_why: 海上行朝佐命，厓山负幼帝蹈海殉国；本书以为明末仗节死义诸臣之比，名场面鲜明
  era: 南宋末
  dates_known: true
- name_zh: 贾充
  score: 6
  worth_why: 主谋弑高贵乡公而终为西晋佐命；本书凡例于其书死用变文示贬，名教罪人，足为事人之大戒
  era: 魏末西晋
  dates_known: true
- name_zh: 福王朱由崧
  score: 6
  worth_why: 江山半壁可凭而日即慆淫，芜湖被执；乾隆谓非开创者欲穷兵威而实守成者自失神器，守成之主之炯戒，本书特予附纪
  era: 南明
  dates_known: true
- name_zh: 褚渊
  score: 5
  worth_why: 宋室顾托而倒向萧道成助其受禅，时讥宁为袁粲死不作褚渊生；本书与贾充同用变文贬之，教训型可缓录
  era: 南朝宋齐之际
  dates_known: true
