source: 史藏/编年/皇清开国方略.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 努尔哈赤
  score: 9
  worth_why: 以遗甲十三副起兵，三十余年统一女真各部；七大恨告天誓师伐明；萨尔浒以少胜多破明四路大军；克辽沈定鼎盛京，建元天命创后金基业；亲自冲锋中箭扶创再战，有大度释仇、生胜于杀的决策风范，做事流完整兼名场面
  era: 明末清初
  dates_known: true
- name_zh: 皇太极
  score: 8
  worth_why: 继太祖之业躬擐甲胄临阵决战；收服察哈尔获历代传国玉玺，建国号大清改元崇德；定盛京规模、创制显庸，由汗国转型为帝制王朝，是清入关定鼎的关键承接者
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 乾隆帝
  why_not: 君主低优先；本篇仅见其读实录、发凡起例编纂开国方略并作序联句，属守成修书，非突出做事流
- name_zh: 多尔衮
  why_not: 文中仅一句收服察哈尔获传国玉玺，无完整做事周期
- name_zh: 尼堪外兰
  why_not: 仅作构衅致二祖之死的背景人物，无事迹流
- name_zh: 布占泰
  why_not: 乌拉贝勒被擒获释一细节而已，无做事周期
- name_zh: 林丹汗
  why_not: 仅作为玺归、部众收服的对象出现，非主动做事者
- name_zh: 黄道周
  why_not: 仅被引用其著博物典汇以证信，无事迹
- name_zh: 肇祖
  why_not: 传文仅居赫图阿拉、恢复祖业数句，世系坐标为主
- name_zh: 景祖
  why_not: 仅有征灭硕色纳嘉呼二族一事，世系罗列为主
- name_zh: 显祖
  why_not: 仅传遗甲十三副，无独立做事流
- name_zh: 明神宗
  why_not: 君主仅作纪年坐标，称尊号时提及明政日弛而已
- name_zh: 洛科
  why_not: 仅射中太祖一箭的细节人物
