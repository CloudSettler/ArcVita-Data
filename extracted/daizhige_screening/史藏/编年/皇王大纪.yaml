candidates:
- name_zh: 周文王
  score: 9
  worth_why: 羑里演周易开易学之源；渭水访吕尚定剪商大计；三分天下有其二迁丰作武王克商之基
  era: 商末周初
  dates_known: true
- name_zh: 吕尚
  score: 9
  worth_why: 直钩垂钓遇文王；牧野督师灭商；受封于齐因俗简礼兴渔盐开东方大国；兵家权谋之祖
  era: 商末周初
  dates_known: true
- name_zh: 范蠡
  score: 9
  worth_why: 辅勾践二十年忍辱图强终灭吴；功成身退泛舟五湖；三迁致富号陶朱公成商圣典范
  era: 春秋末
  dates_known: true
- name_zh: 伊尹
  score: 8
  worth_why: 以滋味说汤由庖人进为宰相；汤崩放太甲于桐宫三年俟其悔过而还政；开贤相摄政还政先例
  era: 商初
  dates_known: true
- name_zh: 伍子胥
  score: 8
  worth_why: 亡命昭关一夜白头；辅阖闾破楚入郢鞭平王尸；谏夫差勿纵越赐属镂自刭悬目东门为千古教训
  era: 春秋末
  dates_known: true
- name_zh: 黄帝
  score: 8
  worth_why: 阪泉涿鹿之战擒蚩尤定中原；教民耕稼作衣冠建官制垂衣裳而天下治；人文共祖且有完整做事流
  era: 上古传说时代
  dates_known: false
- name_zh: 苏秦
  score: 8
  worth_why: 锥刺股发愤揣摩；游说六国合纵身佩六国相印；以死间齐弱齐存燕布局绝伦
  era: 战国
  dates_known: true
- name_zh: 张仪
  score: 8
  worth_why: 以连横破六国合纵；许楚怀王六百里而戏之离齐楚之交；舌辩之才纵横双璧
  era: 战国
  dates_known: true
- name_zh: 田单
  score: 8
  worth_why: 由临淄市掾走保即墨；施反间火牛阵一战连复七十余城；孤城翻盘复齐名场面
  era: 战国
  dates_known: true
- name_zh: 信陵君
  score: 8
  worth_why: 礼贤下士食客三千；窃符救赵破秦解邯郸之围；两却秦师存魏而遭忌见废为教训
  era: 战国
  dates_known: true
- name_zh: 吕不韦
  score: 8
  worth_why: 奇货可居由巨商谋立两世秦王；一字千金编吕氏春秋集百家之成；终贬蜀饮鸩为商人从政之教训
  era: 战国末
  dates_known: true
- name_zh: 范雎
  score: 8
  worth_why: 遭冤辱几死化名入秦；面陈远交近攻定秦并六国方略；绌穰侯强王权恩仇必报后荐蔡泽而退
  era: 战国
  dates_known: true
- name_zh: 子产
  score: 7
  worth_why: 铸刑书颁成文法开千古先河；不毁乡校听民议开言路；周旋晋楚使郑不辱
  era: 春秋
  dates_known: true
- name_zh: 老子
  score: 7
  worth_why: 周守藏室之史阅尽兴衰；见周衰出函谷著五千言道德经；道法自然为诸子之源惜生卒难考
  era: 春秋
  dates_known: false
- name_zh: 胡宏
  score: 6
  worth_why: 师杨时侯仲良承父安国之学；上书数千言忤秦桧久抑不调；桧死召用辞疾不赴成皇王大纪八十卷
  era: 南宋
  dates_known: true
