source: 史藏/编年/竹书纪年.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 帝舜
  score: 8
  worth_why: 从庶民登庸至禅让天子的完整周期；涂廪浚井两度脱险显机变，命皋陶作刑开刑法之始，歌《卿云》荐禹，精华已竭褰裳去之，孝行与让贤双重典范，旦复旦句为复旦得名之源
  era: 上古五帝时期
  dates_known: false
- name_zh: 帝尧
  score: 8
  worth_why: 命羲和历象、初建巡狩、初治兵皆制度之始；用鲧治水复黜之显用人决断；嫁二女试舜、历河洛受图而后禅让，选贤让位流程完整，为禅让制范本
  era: 上古五帝时期
  dates_known: false
- name_zh: 帝启
  score: 7
  worth_why: 禹崩天下归启，开家天下之局；钧台大飨诸侯立威，伐有扈大战于甘定鼎，放武观平叛固权，是禅让转世袭的关键决策人
  era: 夏初
  dates_known: true
- name_zh: 少康
  score: 7
  worth_why: 本书夏纪后文所载少康中兴：流亡奔虞、娶二姚、使女艾谍浇、季杼诱豷，灭过戈复禹之绩，由遗孤到复国的完整做事流
  era: 夏代中期
  dates_known: true
- name_zh: 黄帝
  score: 6
  worth_why: 命应龙战蚩尤、初制冕服、以云纪官、洛水得龙图龟书，文明开创周期完整，惜年代全属传说纪年，缓录以备文明始祖坐标
  era: 上古传说时代
  dates_known: false
