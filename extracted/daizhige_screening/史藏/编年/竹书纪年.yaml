- name_zh: 帝太康
  why_not: 失国仅一句，无做事流，失国教训可并入羿与少康叙事
- name_zh: 帝仲康
  why_not: 仲康日食为珍贵年代坐标，本人除命胤侯征羲和外无事迹
- name_zh: 帝相
  why_not: 流亡寄居之君，纯为纪年坐标
- name_zh: 羿
  why_not: 入居斟寻、终为寒浞所杀仅两见，恃射失国可作太康失国背景，不足以独立成轴
