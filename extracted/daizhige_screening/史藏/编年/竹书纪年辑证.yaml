category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 夏启
  score: 7
  worth_why: 禅让转世袭的制度转折点，启杀益为王位世袭开创之始，与孟子益避启说互为异闻；继有征西河平武观之乱、作舞九韶，杀益—平叛—制礼作乐的做事周期完整，且在位年数与享年可考，是夏代史第一等人物
  era: 夏初
  dates_known: true
- name_zh: 帝相
  score: 6
  worth_why: 元年征淮夷畎夷、二年征风夷黄夷、七年于夷来宾，夏初经略东夷诸役逐年可系年，可与甲骨文盂方、隹尸互证，但仅记征伐无起承转合，宜缓录补史
  era: 夏代
  dates_known: true
rejections:
- name_zh: 禹
  why_not: 已在库，勿重复录入
- name_zh: 益
  why_not: 仅见益干启位启杀之一句及后世旁证，本人行事无独立做事流，只作启之衬托
- name_zh: 太康
  why_not: 传文仅太康居斟寻居地一条，失国事不见于此篇
- name_zh: 后羿
  why_not: 仅羿亦居之一句，无任何事迹展开
- name_zh: 桀
  why_not: 仅桀又居之一句，无做事周期
- name_zh: 武观
  why_not: 仅附见西河叛一事，出自信引逸周书，史料单薄
- name_zh: 彭伯寿
  why_not: 仅帅师征西河一句，人物不可考
- name_zh: 臣瓒
  why_not: 汉代注家，属文献传承人物而非纪年中的做事者
