source: 史藏/编年/竹书统笺.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 少康
  score: 9
  worth_why: 竹书明载其复国全程——乙酉奔有虞蓄力、甲辰使汝艾伐过杀浇、伯杼防戈、伯靡杀寒浞、乙巳自纶归于夏邑，是为「少康中兴」；从流亡到复国的完整做事流，堪称忍辱蓄力、以弱复国的典范
  era: 夏代中期
  dates_known: true
- name_zh: 伊尹
  score: 9
  worth_why: 辅汤灭夏、摄政放太甲于桐；竹书「太甲潜出自桐杀伊尹」一节更牵出战国田和迁康公、三晋徙桓公假「放君」名之公案，名场面与君臣命题兼备
  era: 商初
  dates_known: true
- name_zh: 伍子胥
  score: 9
  worth_why: 亡楚奔吴、兴吴破楚入郢复仇、力谏夫差拒越、属镂自刭悬目东门，终见吴亡验证其言；成事与悲剧兼有，成语名场面极多
  era: 春秋末
  dates_known: true
- name_zh: 范蠡
  score: 9
  worth_why: 助勾践十年生聚终灭强吴，功成泛舟五湖、三徙成名、货殖千金；「功成身退」「飞鸟尽良弓藏」之原型
  era: 春秋末
  dates_known: true
- name_zh: 尧
  score: 8
  worth_why: 历象日月授时、咨四岳举舜终行禅让，开天下传贤之范式；竹书系「元丙子在位百年」，名场面为禅让制度之源头
  era: 上古（唐尧）
  dates_known: true
- name_zh: 舜
  score: 8
  worth_why: 侧微登庸、举八元八恺、流四凶、摄政受禅，孝德与用人双重典范，做事流起于耕历山终于践帝位
  era: 上古（虞舜）
  dates_known: true
- name_zh: 子产
  score: 8
  worth_why: 铸刑书开成文法先声、不毁乡校纳民之议，周旋晋楚之间存郑；制度创新名场面典型
  era: 春秋中期（郑国）
  dates_known: true
- name_zh: 武丁
  score: 8
  worth_why: 三年不言、梦得傅说举为相、三年克鬼方，商道复兴成「武丁中兴」；竹书在位五十九年可系年
  era: 商代中期
  dates_known: true
- name_zh: 周文王
  score: 8
  worth_why: 羑里演易、断虞芮之讼、三分天下有其二，为克商奠基；逆境蓄势与君臣遇合的范本
  era: 商末（西伯）
  dates_known: true
- name_zh: 张仪
  score: 8
  worth_why: 连横破纵、欺楚绝齐、以横制纵左右战国大局，纵横家头号操盘手，做事流与谋略名场面俱全
  era: 战国中期（秦惠文王时）
  dates_known: true
- name_zh: 启
  score: 7
  worth_why: 竹书明文「益干启位启杀之」，又甘誓伐有扈；以兵定世袭、开家天下，制度转折点的主人
  era: 夏初
  dates_known: true
- name_zh: 盘庚
  score: 7
  worth_why: 力排众议迁殷定都，商代由衰转兴的枢纽；迁都是重大战略决策样本
  era: 商代中晚期
  dates_known: true
- name_zh: 傅说
  score: 7
  worth_why: 起于版筑之间，武丁梦举为相，著《说命》三篇；布衣拜相、君臣相得的经典原型
  era: 商武丁时
  dates_known: true
- name_zh: 周宣王
  score: 7
  worth_why: 前期中兴任贤南征北伐，后期千亩败于姜戎、料民太原，盛而复衰的完整教训
  era: 西周晚期
  dates_known: true
- name_zh: 徐文靖
  score: 6
  worth_why: 八十二岁始笺注竹书、三寒暑而成，考正地理订正世系较孙氏为密；皓首穷经样本，然影响限于考据，宜缓录
  era: 清乾隆间
  dates_known: true
rejections:
- name_zh: 伯靡
  why_not: 仅与少康合谋杀寒浞一节，附于中兴案即可
- name_zh: 帝杼
  why_not: 佐兄防戈之外均为在位纪年坐标
- name_zh: 汝艾
  why_not: 仅奉少康之命伐过杀浇，无独立行事
- name_zh: 太甲
  why_not: 放桐悔过与潜出杀尹两说皆依附伊尹公案，独立做事流不立
- name_zh: 寒浞
  why_not: 篡夏终被诛，竹书仅系年，反面材料零散不足立传
- name_zh: 季历
  why_not: 仅「文丁杀季历」孤立一节，缘起与结局皆无可考
- name_zh: 帝辛
  why_not: 在位五十二年纯作纪年坐标，亡国教训泛化而无新史料
- name_zh: 周厉王
  why_not: 目录仅「奔彘十四年」一句，弭谤之详在国语，且君主低优先，教训可附于共和宣王诸条
- name_zh: 大挠
  why_not: 仅「作甲子」一句，无从系年立传
- name_zh: 共伯和
  why_not: 仅「摄行天子事」一语，虽为共和纪年之源，行事太略
- name_zh: 束皙
  why_not: 校释竹书迁尚书郎属文献整理附传，和峤荀勖卫恒诸人同此
- name_zh: 沈约
  why_not: 附注好言符瑞多臆说，其文反待徐氏笺正
- name_zh: 孙之騄
  why_not: 考定竹书疏舛甚多，仅作对照坐标
- name_zh: 魏襄王
  why_not: 汲冢墓主（或云安厘王），仅存葬年，非传主
- name_zh: 黄帝
  why_not: 前编诸帝仅系在位年数，传说时代无做事细节（颛顼喾挚同此）
