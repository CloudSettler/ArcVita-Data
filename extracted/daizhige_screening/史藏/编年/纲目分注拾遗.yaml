candidates:
- name_zh: 芮长恤
  score: 7
  worth_why: 读朱子纲目疑分注文繁事杂、删削失本事，遂取温公通鉴逐条质对较其同异；考究本原断定分注属笔于赵师渊而非朱子，立纠师渊非纠朱子之宗旨；自汉王元年乙未至显德六年己未录逸事四百六十余条，列原文某句某字之下缀考辨于后，成书四卷，四库提要许为纲目之功臣；引据旧文不逞臆私谈，是非者天下之公、大儒廓然无我，可为考据存真之范
  era: 清康熙乾隆间
  dates_known: true
- name_zh: 赵师渊
  score: 6
  worth_why: 受朱子指授独任通鉴纲目分注，秉纲欲谨严而无脱落、目欲详备而不繁冗之要领，依大纲附条件笔则笔削则削，包举群言博稽约取，上下千数百年分画秩然如网在纲；功成而刊板不署其名，致数百年被误认为朱子所作，后赖讷斋集中考亭往来书牍始白本末；做事流完整，功成名隐之局足为名实之鉴
  era: 南宋
  dates_known: true
