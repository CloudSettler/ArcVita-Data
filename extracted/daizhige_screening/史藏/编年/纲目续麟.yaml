source: 史藏/编年/纲目续麟.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 张自勋
  score: 7
  worth_why: 明末学者，以春秋之义通校朱子《纲目》，成校正凡例一卷、附录一卷、续麟二十卷、彚览三卷，增删正纲三千六百余字；考定纲目实为晚年未定之本、正纲多出赵师渊手，破刘友益穿凿附会之説；主张义明而例自具，敢驳大儒而凿凿有据，是治学不迷信权威、求真辨伪的完整做事流
  era: 明末（崇祯间）
  dates_known: true
- name_zh: 朱熹
  score: 7
  worth_why: 拟《通鉴纲目》上承春秋笔法以立正统义例，中年属稿、晚年犹手书十二篇论纲目而未及修补，遂成「晚年絶笔抑中年未定」与门人赵师渊代笔的史学公案；缘起、阶段、关键文件、聚讼结果俱全，然本篇仅存论辩线索、传世本多出他人之手
  era: 南宋
  dates_known: true
rejections:
- name_zh: 赵师渊
  why_not: 仅一句「正纲多出其手」，代笔细节全无，无做事周期
- name_zh: 刘友益
  why_not: 全篇仅以其书法凡例之误为批驳靶子，无独立事迹
- name_zh: 尹起莘
  why_not: 仅引《发明》一句
- name_zh: 方孝孺
  why_not: 仅引其正统之论一句
- name_zh: 李方子
  why_not: 仅以序跋篇目被提及（王柏、徐昭文同此）
- name_zh: 纪昀
  why_not: 与陆锡熊、孙士毅、陆费墀同为四库提要署名官职，无事迹
- name_zh: 王莽
  why_not: 仅作篡贼书法例证一句，且其事他书更备
- name_zh: 武则天
  why_not: 仅作簒贼与王莽并称之例证一句
- name_zh: 唐太宗
  why_not: 仅贞观元年征刘子翼不至一条例证，无做事流
- name_zh: 郑众
  why_not: 仅作宦者封爵例证一句
- name_zh: 刘子翼
  why_not: 仅「复召拜功曹终著作郎」一句，事迹单薄
- name_zh: 姚苌
  why_not: 仅作国号称谓分注例证一句
