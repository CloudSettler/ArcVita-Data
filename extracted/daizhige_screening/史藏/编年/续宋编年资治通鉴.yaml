category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 岳飞
  score: 10
  worth_why: 精忠报国、郾城大捷直捣朱仙镇；十二道金牌班师与风波亭冤狱，“莫须有”三字名场面；忠奸教训俱全
  era: 南宋高宗朝
  dates_known: true
- name_zh: 李纲
  score: 9
  worth_why: 靖康东京保卫战、建炎十议、相七十五日而罢；“李纲入来方成朝廷”，主战派旗帜，起落见宋廷和战之根
  era: 两宋之际
  dates_known: true
- name_zh: 宗泽
  score: 9
  worth_why: 留守东京，造战车千二百乘、立二十四壁、结两河山水寨，临终三呼过河；收编义军整军经武的完整做事流
  era: 两宋之际
  dates_known: true
- name_zh: 韩世忠
  score: 9
  worth_why: 黄天荡以八千困兀术十万、大仪镇之捷；本卷已见其分讨群盗之起，武将生涯完整
  era: 南宋初
  dates_known: true
- name_zh: 虞允文
  score: 9
  worth_why: 采石之战书生督师破金主完颜亮，儒臣却敌的典范名场面
  era: 南宋高孝之际
  dates_known: true
- name_zh: 张浚
  score: 9
  worth_why: 经略川陕、富平之败而不坠、保全蜀口举吴玠；力主恢复终不合议；本书提要点名其为褒贬至公之关键人物
  era: 南宋初
  dates_known: true
- name_zh: 辛弃疾
  score: 9
  worth_why: 五十骑劫金营擒叛徒张安国、创飞虎军、美芹十论献北伐策；词人事功两全
  era: 南宋孝宗宁宗朝
  dates_known: true
- name_zh: 吴玠
  score: 8
  worth_why: 和尚原、仙人关大破金军，保全蜀口屏蔽东南，与张浚经营川陕相始终
  era: 南宋初
  dates_known: true
- name_zh: 刘锜
  score: 8
  worth_why: 顺昌之战以逸待劳大破金兀术铁浮屠，八字军旧部的翻身之役
  era: 南宋初
  dates_known: true
- name_zh: 赵鼎
  score: 8
  worth_why: 中兴贤相，两度拜相定都计、荐岳飞；终拒和议绝食死，气节与为政俱全
  era: 南宋高宗朝
  dates_known: true
- name_zh: 朱熹
  score: 8
  worth_why: 白鹿洞学规、社仓法、经界施行；理学集大成，讲学著述即其事功
  era: 南宋孝宗宁宗朝
  dates_known: true
- name_zh: 胡铨
  score: 7
  worth_why: 戊午上高宗封事乞斩秦桧、义不与桧共戴天，一疏震天下的名场面
  era: 南宋高宗朝
  dates_known: true
- name_zh: 赵汝愚
  score: 7
  worth_why: 绍熙内禅定策立宁宗，从容平危局；旋遭韩侂胄倾陷贬死，庆元党禁之枢纽
  era: 南宋光宁之际
  dates_known: true
- name_zh: 秦桧
  score: 7
  worth_why: 负面教训典型：专权误国、陷岳飞、主和议路线；本书提要特举其罪为褒贬之例
  era: 南宋高宗朝
  dates_known: true
- name_zh: 韩侂胄
  score: 6
  worth_why: 开禧北伐仓促败绩、函首安边；权臣误国与轻启战端之教训
  era: 南宋宁宗朝
  dates_known: true
rejections:
- name_zh: 宋高宗
  why_not: 君主低优先，本卷仅作建炎纪年坐标，定都和议诸大事多由将相承担
- name_zh: 张邦昌
  why_not: 伪楚僭立旋即赐死，无完整做事周期，仅作僣叛议罪之例
- name_zh: 黄潜善
  why_not: 传中仅见排挤李纲、倡和误国之零碎事迹，无做事流
- name_zh: 汪伯彦
  why_not: 与黄潜善同为误国附从，事迹简略无独立做事周期
- name_zh: 张叔夜
  why_not: 孤军入卫、不食死节可敬，然除死节外无完整做事周期，暂缓
- name_zh: 郝仲连
  why_not: 死守河中府数句而亡，事迹过简
- name_zh: 耿南仲
  why_not: 仅存主和误渊圣一事，为反面注脚非可录人物
- name_zh: 元祐皇后孟氏
  why_not: 尊位复立多为礼制坐标，无独立做事周期
