category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 赵普
  score: 9
  worth_why: 雪夜定策先南后北方略；杯酒释兵权总设计师；半部论语治天下，宋初强干弱枝制度奠基人，三次拜相起落亦足为镜
  era: 北宋初
  dates_known: true
- name_zh: 寇准
  score: 9
  worth_why: 澶渊之盟力排南迁之议，促真宗亲征督战，以岁币换百年和平；敢直谏、两度罢相复起，直臣命运之典型
  era: 北宋真宗朝
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 先天下之忧而忧；戍边御西夏，军中有一范之誉；庆历新政开改革先声，兴学育才，士大夫楷模
  era: 北宋中期
  dates_known: true
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法行青苗、募役、保甲、免役诸法，为帝制时代最系统的制度再造；三不足精神；变法成败功过为千年争论焦点
  era: 北宋中期
  dates_known: true
- name_zh: 赵匡胤
  score: 8
  worth_why: 君主中少有的制度做事型：陈桥兵变兵不血刃受禅，收兵权、置封桩库、先南后北，终结五十年八朝十二帝乱局
  era: 北宋初
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 平南唐约众不妄杀，仁将第一；然岐沟关之败贬官，功高兵骄之戒与仁厚之风两面俱全
  era: 北宋初
  dates_known: true
- name_zh: 杨业
  score: 8
  worth_why: 雁门大捷号杨无敌；雍熙北伐孤军无援，陈家谷力战被俘绝食死，忠烈千古，杨家将传说的史实源头
  era: 北宋初
  dates_known: true
- name_zh: 狄青
  score: 8
  worth_why: 面涅将军自卒伍至枢密使；昆仑关夜袭平侬智高；终遭文臣猜忌郁郁而终，宋代武人困境标本
  era: 北宋中期
  dates_known: true
- name_zh: 沈括
  score: 8
  worth_why: 使辽据理力争地界；梦溪笔谈存毕昇活字、磁针司南等科学记录；然永乐城之败亦见书生用兵之失
  era: 北宋中期
  dates_known: true
- name_zh: 韩琦
  score: 8
  worth_why: 与范仲淹并称韩范同御西夏；相三朝策立英宗神宗，处定策危局不惊；庆历新政与地方兴教并著
  era: 北宋中期
  dates_known: true
- name_zh: 苏轼
  score: 8
  worth_why: 乌台诗案九死一生；疏浚西湖筑苏堤为民生工程典范；黄州惠州儋州贬途成千古文章，文人从政的完整样本
  era: 北宋中期
  dates_known: true
- name_zh: 杨延昭
  score: 7
  worth_why: 遂城之捷借严冰成铁遂城，羊山设伏斩辽骁将；守边二十余年辽人畏惮，杨家将史实根基
  era: 北宋真宗朝
  dates_known: true
- name_zh: 曹玮
  score: 7
  worth_why: 三都谷破吐蕃，治边数十年恩威兼施；沉勇多谋有父风，将门传承的正面样本
  era: 北宋真宗朝
  dates_known: true
- name_zh: 张咏
  score: 7
  worth_why: 两度治蜀恩威并用，蜀民畏而爱之；为交子行用立规，世界最早纸币管理实践；自恨不第状元不至宰相
  era: 北宋初
  dates_known: true
- name_zh: 李纲
  score: 7
  worth_why: 靖康之役力主守汴，登城督战击退金军；朝令夕改中孤忠不悔，危局决策与朝政掣肘之对照
  era: 北宋末靖康之际
  dates_known: true
rejections:
- name_zh: 赵光义
  why_not: 君主低优先；灭北汉成统一之功，然高梁河、雍熙北伐两度大败，军事主导权实系于诸将，宜作时间坐标
- name_zh: 赵恒
  why_not: 君主低优先；澶渊决策之功归于寇准，晚年天书东封劳民伤财，宜作背景人物
- name_zh: 李煜
  why_not: 亡国之君，书中仅记其城降纳土始末，词坛成就非本书记事范围，做事周期残缺
- name_zh: 钱俶
  why_not: 纳土归宋为义举可采，然事迹以谢幕为主，独立做事流单薄，暂缓
- name_zh: 王旦
  why_not: 守成贤相而乏名场面，晚年附和天书自愧，宜待专传补足再录
