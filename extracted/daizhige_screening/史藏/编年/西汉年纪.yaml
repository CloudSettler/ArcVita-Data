source: 史藏/编年/西汉年纪.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 张骞
  score: 10
  worth_why: 凿空西域开丝绸之路；两度被匈奴扣留持节不失，十三年而使命不废
  era: 西汉武帝朝
  dates_known: true
- name_zh: 霍光
  score: 9
  worth_why: 受武帝托孤，辅昭帝、废昌邑、立宣帝定汉室；麒麟阁功臣之首
  era: 西汉武帝至宣帝朝
  dates_known: true
- name_zh: 陈汤
  score: 9
  worth_why: 矫制发兵千里斩郅支单于；留名言明犯强汉者虽远必诛
  era: 西汉元帝朝
  dates_known: true
- name_zh: 贾谊
  score: 9
  worth_why: 弱冠献策遭谗贬长沙；过秦论治安策为政论典范，屈贾悲剧足为后世训
  era: 西汉文帝朝
  dates_known: true
- name_zh: 晁错
  score: 8
  worth_why: 号智囊力主削藩致七国之乱；衣朝衣斩于东市，尽忠而死于疑
  era: 西汉文帝至景帝朝
  dates_known: true
- name_zh: 陆贾
  score: 8
  worth_why: 马上得天下不可马上治之；两使南越说赵佗称臣，著新语定汉初国策
  era: 秦末至西汉高祖至文帝朝
  dates_known: true
- name_zh: 叔孙通
  score: 8
  worth_why: 脱秦归汉定朝仪，高帝叹吾乃今日知为皇帝之贵；汉家儒宗
  era: 秦末至西汉高祖至惠帝朝
  dates_known: true
- name_zh: 赵充国
  score: 8
  worth_why: 年逾七十请缨平羌；罢兵屯田不战而定，百闻不如一见
  era: 西汉武帝至宣帝朝
  dates_known: true
- name_zh: 桑弘羊
  score: 8
  worth_why: 盐铁均输平准为武帝理财开边；昭帝朝盐铁论战主角，终以身殉政争
  era: 西汉武帝至昭帝朝
  dates_known: true
- name_zh: 王莽
  score: 8
  worth_why: 由谦恭下士至篡汉建新；改制全面崩坏身死国灭，伪善与复古乌托邦之总鉴
  era: 西汉末至新朝
  dates_known: true
- name_zh: 主父偃
  score: 7
  worth_why: 献推恩令不兵而弱诸侯；生不五鼎食死即五鼎烹，一年四迁而族灭
  era: 西汉武帝朝
  dates_known: true
- name_zh: 赵佗
  score: 7
  worth_why: 秦尉据岭南击并桂林象郡自立武王，即本书所载；和辑百越立国寿逾百岁
  era: 秦末至西汉武帝朝
  dates_known: true
- name_zh: 刘向
  score: 7
  worth_why: 奉诏校中秘群书成别录开目录学之祖；说苑新序列女传传世
  era: 西汉宣帝至成帝朝
  dates_known: true
- name_zh: 司马相如
  score: 7
  worth_why: 子虚上林定汉赋体制，武帝读赋而召；奉使西南抚定巴蜀
  era: 西汉景帝至武帝朝
  dates_known: true
- name_zh: 郦食其
  score: 7
  worth_why: 高阳酒徒说下陈留；说齐下七十余城因韩信袭齐遭烹，一言之功与一死之憾
  era: 秦末至西汉高祖朝
  dates_known: true
rejections:
- name_zh: 汉惠帝
  why_not: 仁弱垂拱，仅作时间坐标
- name_zh: 汉昭帝
  why_not: 冲龄嗣位政由霍光，无独立做事流
- name_zh: 汉宣帝
  why_not: 君主低优先；狱囚中兴虽奇，功多归霍光魏相辈，非变法级自为做事
- name_zh: 汉元帝
  why_not: 君主仅作坐标，威柄下移于石显
- name_zh: 汉成帝
  why_not: 君主仅作坐标，权移王氏外戚
- name_zh: 汉哀帝
  why_not: 君主仅作坐标，嬖幸董贤无做事
- name_zh: 汉平帝
  why_not: 冲龄遇弑，无做事可录
- name_zh: 项庄
  why_not: 鸿门宴舞剑陪衬，无独立事迹
- name_zh: 子婴
  why_not: 素车白马出降受缚，无主动做事周期
- name_zh: 项伯
  why_not: 鸿门翼蔽属插曲，后降汉封侯无大事功
- name_zh: 荀子
  why_not: 仅家语序考异注中顺带提及，属战国人物非西汉
- name_zh: 韩王信
  why_not: 本卷唯献用东归之锋一策，后叛降匈奴，教训单薄
- name_zh: 陈余
  why_not: 与张耳一体共传，独立做事流不完整，仅作韩信背水一战之对位者，缓
- name_zh: 田荣
  why_not: 此处仅授彭越将军印一笔带过，做事详见齐地记载
- name_zh: 樊哙
  why_not: 闯帐谏宫有名场面，然文本仅节其一谏，本传做事流较短，暂缓
- name_zh: 王昭君
  why_not: 昭君出塞为名场面，然个人主动作为少，和亲乃朝廷决策，缓录
