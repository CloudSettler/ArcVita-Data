category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 范蠡
  score: 10
  worth_why: 助勾践忍辱二十余年终灭吴；功成泛舟五湖，三致千金再散之，进退取舍之千古典范
  era: 春秋末
  dates_known: true
- name_zh: 帝尧
  score: 9
  worth_why: 禅让开天下为公之先；命羲和历象日月星辰敬授人时，开中国观象授时之始
  era: 上古唐虞
  dates_known: true
- name_zh: 虞舜
  score: 9
  worth_why: 耕历山以孝闻；举八元八恺、流四凶；受尧禅而有天下，德化治理的原型
  era: 上古唐虞
  dates_known: true
- name_zh: 伊尹
  score: 9
  worth_why: 以庖人进身佐汤灭夏；放太甲于桐宫三年复其位，"治亦进乱亦进"的元圣
  era: 商初
  dates_known: true
- name_zh: 周文王
  score: 9
  worth_why: 羑里演易；阴行善政三分天下有其二；戡黎伐崇为克商奠基
  era: 商末周初
  dates_known: true
- name_zh: 吕尚（姜太公）
  score: 9
  worth_why: 渭滨垂钓遇文王；牧野鹰扬建首功；封齐兴渔盐之利开东方大国
  era: 商末周初
  dates_known: true
- name_zh: 伍子胥
  score: 9
  worth_why: 弃小义雪大耻，历郑吴终破楚鞭尸；兴吴霸越之谋屡谏不听，属镂赐死前悬目国门
  era: 春秋末
  dates_known: true
- name_zh: 子产
  score: 9
  worth_why: 不毁乡校、铸刑书、坏晋馆垣；治国"不欺"，孔子称古之遗爱，春秋第一贤相
  era: 春秋
  dates_known: true
- name_zh: 傅说
  score: 8
  worth_why: 举于版筑之间；"若药弗瞑眩厥疾弗瘳"，君臣相得致殷中兴的名相
  era: 商（武丁时）
  dates_known: true
- name_zh: 盘庚
  score: 8
  worth_why: 逆万民之怨迂都于殷，反复告谕终定商祚五百年基业
  era: 商（中期）
  dates_known: true
- name_zh: 少康
  score: 8
  worth_why: 有田一成有众一旅，布德兆谋灭寒浞复禹之绩，中国最早的中兴之主
  era: 夏（中期）
  dates_known: true
- name_zh: 晏婴
  score: 8
  worth_why: 二桃杀三士；踊贵屐贱谏刑滥；使楚不辱；崔杼之盟临难不苟
  era: 春秋
  dates_known: true
- name_zh: 司马穰苴
  score: 8
  worth_why: 斩监军庄贾立军威，"将在军君命有所不受"之先例；著《司马法》传世
  era: 春秋（齐景公时）
  dates_known: true
- name_zh: 申包胥
  score: 8
  worth_why: 秦庭倚墙而哭七日七夜勺饮不入口，终得秦师复楚；功成不受赏
  era: 春秋末
  dates_known: true
- name_zh: 伯夷、叔齐
  score: 7
  worth_why: 兄弟让国；扣马谏武王；不食周粟饿死首阳，千古气节符号
  era: 商末周初
  dates_known: false
rejections:
