- name_zh: 王彦升
  why_not: 专杀韩通一门，仅以终身不授节钺作结，事迹单薄
- name_zh: 范质
  why_not: 执王溥手几出血与被迫先拜虽有戏剧性，然全程被动无主导做事
- name_zh: 陶谷
  why_not: 袖出预拟禅诏一幕，投机剪影而已
- name_zh: 陈抟
  why_not: 仅一句天下自此定矣之谶语，无事迹可考
- name_zh: 苗训
  why_not: 仅以日下复有一日言天命，符号人物
- name_zh: 石守信
  why_not: 本卷仅见论功进爵；杯酒释兵权中属被动承受者，主体是赵匡胤
- name_zh: 张永德
  why_not: 仅因木牌谶语被撤换殿前都点检，无自身做事
- name_zh: 万斯同
