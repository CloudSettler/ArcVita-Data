source: 史藏/编年/资治通鉴后编.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 赵匡胤
  score: 10
  worth_why: 陈桥兵变黄袍加身却先约法三章、秋毫无入市不易肆；掌军政六年以恩威服众；受禅建宋以不嗜杀人一天下；后有杯酒释兵权削藩强干之祖制，做事流完整
  era: 五代末至北宋初
  dates_known: true
- name_zh: 赵普
  score: 8
  worth_why: 陈桥之变中与匡义叱止诸将、定约束安人心，兴王易姓实系人心之论为定策关键；由节镇书记至佐命枢臣；后有半部论语治天下与宋初制度设计
  era: 北宋初
  dates_known: true
- name_zh: 杜太后
  score: 7
  worth_why: 闻陈桥之变而曰吾儿素有大志今果然；册后之日愀然言为君难、苟或失驭求为匹夫不可得，母仪之教传世
  era: 北宋初
  dates_known: true
- name_zh: 寇准
  score: 9
  worth_why: 澶渊之盟中力排南迁之议请帝亲征，系宋辽百年和平之关键决策，名相做事流完整
  era: 北宋中期
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 庆历新政主持者；先天下之忧而忧后天下之乐而乐；戍边御西夏与兴学育才皆为后世之范
  era: 北宋中期
  dates_known: true
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法总设计；天变不足畏人言不足恤之宣言与青苗免役诸法，为改革成败与争议之最好教材
  era: 北宋中期
  dates_known: true
- name_zh: 司马光
  score: 9
  worth_why: 十九年成资治通鉴二百九十四卷，正是本书续补之对象；反对新法之执守与元祐更化，史家做事周期最完整
  era: 北宋中期
  dates_known: true
- name_zh: 岳飞
  score: 10
  worth_why: 精忠报国与连结河朔之战略；郾城颍昌大捷；莫须有冤狱为千古教训，名场面密度极高
  era: 南宋初
  dates_known: true
- name_zh: 文天祥
  score: 10
  worth_why: 起兵勤王、使元营被拘脱亡、擎岭海一隅至兵败被执；过零丁洋与正气歌；柴市就义成仁
  era: 南宋末
  dates_known: true
- name_zh: 王坚
  score: 8
  worth_why: 钓鱼城守御、蒙哥殒于城下而欧亚局势为之一变；提要特笔称采四川总志订其守合州之误，本书正面收录
  era: 南宋末
  dates_known: true
- name_zh: 忽必烈
  score: 9
  worth_why: 藩邸延纳汉臣、行汉法建大元、灭宋混一；非仅君主时间坐标而有明确完整做事周期
  era: 元代
  dates_known: true
- name_zh: 耶律楚材
  score: 8
  worth_why: 以止杀与编籍户保全中原人口、以儒术立朝制；改屠城旧制为文明存续之关键决定
  era: 蒙古汗国
  dates_known: true
- name_zh: 完颜阿骨打
  score: 8
  worth_why: 以二千五百人起兵破辽、创猛安谋克与金之国制，以小博大的完整创业流
  era: 辽末金初
  dates_known: true
- name_zh: 朱元璋
  score: 9
  worth_why: 布衣起兵至灭张士诚陈友谅、肇建大明；本书纪事终于至正二十七年恰收其创业全程
  era: 元末
  dates_known: true
- name_zh: 徐干学
  score: 6
  worth_why: 嫌陈桱王宗沐薛应旂诸续通鉴疏谬、与万斯同阎若璩胡渭排比正史成后编一百八十四卷；依司马光例作考异折衷、订误补遗舆地精核；草创甫毕欲进于朝未果而没，做事流完整但属文献编纂
  era: 清初
  dates_known: true
rejections:
