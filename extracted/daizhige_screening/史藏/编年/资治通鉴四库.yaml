  worth_why: 受武帝顾命辅政二十年，废昌邑王立宣帝而行废立终不篡位；昭宣中兴的实际掌舵人；身后家族覆灭成权臣权力教训
  era: 西汉
  dates_known: true
- name_zh: 周瑜
  score: 9
  worth_why: 力排众降议、赤壁火攻以弱胜强的总指挥；曲有误周郎顾的儒将风度；取蜀之策未行而卒，功业中断成千古惋惜
  era: 东汉末
  dates_known: true
- name_zh: 祖逖
  score: 9
  worth_why: 闻鸡起舞、中流击楫两大成语诞生点；率部曲渡江北伐收复黄河以南；储粮备械之际忧愤而卒，功败垂成给后人启示
  era: 东晋
  dates_known: true
- name_zh: 王猛
  score: 9
  worth_why: 扪虱而谈定君臣之遇；治关中、灭前燕，十年助苻坚统一北方；临终戒勿图晋，苻坚违之遂有淝水之覆，劝谏与验证俱全
  era: 十六国·前秦
  dates_known: true
- name_zh: 谢安
  score: 9
  worth_why: 东山再起典故本人；淝水之战以八万破前秦号称百万之众，围棋赌墅、小儿辈大破贼成千古名场面；处变不惊的统帅范本
  era: 东晋
  dates_known: true
- name_zh: 刘裕
  score: 9
  worth_why: 从寒门卖履到代晋建宋；两度北伐灭南燕后秦，却月阵以步骑破北魏铁骑；气吞万里如虎，寒人掌机要开启南朝格局
  era: 东晋—南朝宋
  dates_known: true
- name_zh: 北魏孝文帝拓跋宏
  score: 9
  worth_why: 借南伐之名逼定迁都洛阳的决断经典；禁胡服胡语、改汉姓通婚姻的全面汉化改革；以一代人完成民族融合的百年工程
  era: 北魏
  dates_known: true
- name_zh: 隋文帝杨坚
  score: 9
  worth_why: 代周平陈，终结近三百年分裂；创三省六部制与开皇律，开皇之治仓廪实；晚年废储易位埋下隋亡伏笔，功业与教训兼备
  era: 隋
  dates_known: true
- name_zh: 李靖
  score: 9
  worth_why: 平萧铣、阴山夜袭一举灭东突厥擒颉利；六十四岁请缨远征吐谷浑；出将入相、知机而退并著兵法，武庙十哲级人物
  era: 唐
  dates_known: true
- name_zh: 魏征
  score: 9
  worth_why: 东宫旧臣转身贞观第一诤臣；谏太宗十思疏、十渐不克终疏句句传世；太宗以人为镜之典由此而来，纳谏制度化的标本
  era: 唐
  dates_known: true
- name_zh: 李世民
  score: 10
  worth_why: 玄武门之变定鼎、贞观之治成后世帝王范本；通鉴载其纳谏用人与治国对话最密；以史为镜名言与晚年渐骄并存，范与戒兼具
  era: 唐
  dates_known: true
- name_zh: 郭子仪
  score: 9
  worth_why: 安史乱起受任于败军，收复两京再造唐室；单骑免胄说退回纥的名场面；权倾天下而朝不忌、功盖一代而主不疑的处世典范
  era: 唐·中晚唐
  dates_known: true
- name_zh: 柴荣
  score: 9
  worth_why: 高平之战整肃禁军，西取秦凤、南平江北伐幽燕；立十年开拓天下十年养百姓十年致太平之志，在位五年半已冠绝五代；其军政改革为赵宋奠基，通鉴纪事终于其世
  era: 五代·后周
  dates_known: true
- name_zh: 司马光
  score: 10
  worth_why: 十九年主持编成《资治通鉴》294卷，附目录考异共354卷，起战国讫五代凡1362年；进书表自言日力不足继之以夜、精力尽于此书；开篇臣光曰论礼分名为全书总纲
  era: 北宋
  dates_known: true
- name_zh: 胡三省
  score: 8
  worth_why: 潜心注《通鉴》三十年，兵乱中稿三失；乙酉岁手抄定注，己丑寇作藏书于窖中得免；后世读通鉴者奉为圭臬，不啻左传之有杜预，乱世守书成典
  era: 宋末元初
  dates_known: true
rejections:
