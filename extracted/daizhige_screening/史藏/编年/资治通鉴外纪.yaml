source: 史藏/编年/资治通鉴外纪.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 黄帝
  score: 9
  worth_why: 修德振兵治五气艺五种；阪泉三战败炎帝；涿鹿破蚩尤作指南车示四方、禽戮蚩尤；诸侯宾从定天下，做事流完整且为文明制度之祖
  era: 上古传说时代
  dates_known: true
- name_zh: 神农氏
  score: 9
  worth_why: 尝百草一日遇七十毒、察水泉甘苦令民知所避就；教民播种五谷作耒耜垦草莽；日中为市聚货帛、削桐为琴绳丝为弦；药农商贸文明奠基
  era: 上古传说时代
  dates_known: true
- name_zh: 伏羲
  score: 8
  worth_why: 仰观俯察造八卦作爻象；作网罟以佃以渔赡民用；制嫁娶以俪皮为礼、定君臣父子夫妇之义、以龙纪官有甲历；由茹毛饮血到人文初开的完整做事流
  era: 上古传说时代
  dates_known: true
- name_zh: 女娲
  score: 7
  worth_why: 天倾地裂之际炼五色石补苍天、断鳌足立四极、杀黑龙济冀州、积芦灰止淫水；救世工程与承包牺制度之名场面
  era: 上古传说时代
  dates_known: true
- name_zh: 燧人氏
  score: 7
  worth_why: 钻木取火炮生为熟，去腥臊臭恶免腹胃之疾；执斗机运转指天施政教；火食革命改变民生与政教
  era: 上古传说时代
  dates_known: true
- name_zh: 有巢氏
  score: 6
  worth_why: 教民构木为巢以避禽兽虫蛇之害，安居工程之起点；惟事迹简略
  era: 上古传说时代
  dates_known: false
- name_zh: 共工
  score: 5
  worth_why: 任知刑以强伯九域；欲壅防百川堕高堙庳而害天下，与颛顼争帝怒触不周山致地东南倾；治水逆势而败、诸侯不王之教训，事迹偏简
  era: 上古传说时代
  dates_known: false
rejections:
