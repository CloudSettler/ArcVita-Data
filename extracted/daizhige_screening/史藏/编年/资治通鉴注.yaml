source: 史藏/编年/资治通鉴注.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 智伯（智瑶）
  score: 9
  worth_why: 才高德寡恃力凌人；索地结怨、水灌晋阳反遭韩赵魏反杀身死族灭；司马光才德论的开篇警示样板
  era: 春秋末战国初
  dates_known: true
- name_zh: 李悝（李克）
  score: 8
  worth_why: 尽地力之教、行平籴法、著法经；变法之祖，启商鞅吴起之先；选相五视名论
  era: 战国初
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 开篇名分论定全书纲骨；十九年成《资治通鉴》二百九十四卷，史学典范
  era: 北宋
  dates_known: true
- name_zh: 赵襄子（赵毋恤）
  score: 7
  worth_why: 忍辱予地退保晋阳、决策策反韩魏决水翻盘灭智伯；漆智伯头为饮器，引出豫让千古忠义
  era: 春秋末战国初
  dates_known: true
- name_zh: 赵简子（赵鞅）
  score: 7
  worth_why: 置简训子择立无恤；命尹铎经营晋阳以备后图，身后布局兑现为晋阳战胜局
  era: 春秋末
  dates_known: true
- name_zh: 季札
  score: 6
  worth_why: 三让吴国终逃之；观乐知政、挂剑酬心，让国高义与中原文化交融的典范
  era: 春秋末
  dates_known: true
- name_zh: 田子方
  score: 5
  worth_why: 君明则乐官论、贫贱者骄人语；士人自处与骄人之辨的名场面，惟做事流简略
  era: 战国初
  dates_known: true
- name_zh: 智果
  score: 5
  worth_why: 谏立瑶不听，预知智氏必灭改族辅氏；先见之明与存身之智的小型完整事例
  era: 春秋末
  dates_known: true
