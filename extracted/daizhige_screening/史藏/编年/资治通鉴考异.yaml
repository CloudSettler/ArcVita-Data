source: 史藏/编年/资治通鉴考异.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 司马光
  score: 9
  worth_why: 主持编纂资治通鉴，历十九年成书，采正史外二百二十二家之书旁搜博引；另撰考异三十卷抉摘幽隐、参考异同而折衷归一，四库提要誉为千古史法之精密实未有过于是者；又定通鉴释例三十六例为修书凡例，李焘续长编、李心传系年要录皆承其法，影响后世编年史学深远；生平兼为政治家，反对王安石新法、元祐更化尽罢新法，缘起、阶段、关键决策、结果俱全，兼可为严谨治学与政治转折之范本
  era: 北宋
  dates_known: true
rejections:
- name_zh: 鲁仲连
  why_not: 文中仅存义不帝秦一事，且被考辨为游谈者夸大之例，温公明言不取
- name_zh: 苏秦
  why_not: 仅合纵十五年秦不敢窥函谷之说被指自相违戾而弃用，事不足信
- name_zh: 商山四皓
  why_not: 仅太子羽翼一段，温公考辨谓辩士夸大四叟之词，今皆不取
- name_zh: 崔浩
  why_not: 仅五星聚东井历术问答片段，做事流残缺
- name_zh: 高允
  why_not: 仅于历术问答中评崔浩一言，事迹过于简略
- name_zh: 郦食其
  why_not: 仅敖仓与说齐一事之史料分合考辨，无完整做事周期
- name_zh: 樊哙
  why_not: 仅击斩陈豨归属之纪传歧异一则，事迹零碎
- name_zh: 范祖禹
  why_not: 仅以修书帖受信人身份出现，本文献无其做事内容
- name_zh: 胡三省
  why_not: 仅音注散入通鉴之评述，无完整做事流
