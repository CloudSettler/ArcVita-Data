verdict: has_candidates
candidates:
- name_zh: 王应麟
  score: 8
  worth_why: 淳祐元年进士，宝祐中复中博学宏辞科，官至礼部尚书兼给事中；宋亡后闭门著述二十余年，成通鉴地理通释、玉海、困学纪闻、诗考诸书，书中避宋讳、用陶潜但书甲子之义，寓故国之思；旧题三字经亦出其手，为宋末学术结穴与遗民气节典型
  era: 南宋末至元初
  dates_known: true
rejections:
- name_zh: 神农
  why_not: 传说帝王，仅述其甄度四海分立九州，年代渺茫无做事周期
- name_zh: 黄帝
  why_not: 仅引其画野分州、推分星次之说，皆后世追述，无完整做事流
- name_zh: 颛顼
  why_not: 仅记建万国制九州一句，事迹简略
- name_zh: 帝喾
  why_not: 仅受颛帝九州一语，无事迹
- name_zh: 舜
  why_not: 本篇仅涉其肇十二州、分幽并营之事，无独立做事流
- name_zh: 邹衍
  why_not: 仅引其赤县神州大小九州之说一语，以见存而不论之旨
- name_zh: 王朴
  why_not: 自序仅与乐毅并提崇论闳议之名，文中无其事迹
- name_zh: 陶潜
  why_not: 仅取其但书甲子之义为著述体例之比，非本篇主角
- name_zh: 郑玄
  why_not: 注家引说以备一说，无做事周期
- name_zh: 苏轼
  why_not: 仅引其论禹治水先后序次数语
- name_zh: 皇甫谧
  why_not: 仅因误考商丘地名被举一例
- name_zh: 周瑜
