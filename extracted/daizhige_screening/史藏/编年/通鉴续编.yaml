source: 史藏/编年/通鉴续编.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 赵匡胤
  score: 10
  worth_why: 陈桥兵变黄袍加身，杯酒释兵权收藩镇兵柄，定先南后北统一方略；烛影斧声为千古史案，本书宋史之主角
  era: 五代末至北宋初
  dates_known: true
- name_zh: 岳飞
  score: 10
  worth_why: 郾城颍昌大捷，撼山易撼岳家军难；莫须有冤狱与精忠报国之训，忠奸之辨垂范千古
  era: 南宋初
  dates_known: true
- name_zh: 文天祥
  score: 9
  worth_why: 起兵勤王奉使不屈，过零丁洋正气歌，就义燕市；提要所讥黄冠故乡之语亦关其身后是非
  era: 南宋末
  dates_known: true
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法行青苗免役保甲，与司马光新旧之争左右北宋国运，改革家完整做事周期
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 9
  worth_why: 十九年成资治通鉴，为本书体例直接源头；元祐更化尽废新法，成败两鉴
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 先天下之忧而忧，庆历新政，戍边御西夏；提要举其桐庐郡诗为陈桱误题之证
  era: 北宋
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 平南唐禁暴不妄杀，御制诗称能用曹彬禁暴；歧沟关之败兼为名将之训
  era: 北宋初
  dates_known: true
- name_zh: 赵光义
  score: 8
  worth_why: 灭北汉结束五代分裂，高梁河之败启宋辽百年兵争；提要言太平兴国四年后始大书统系
  era: 北宋初
  dates_known: true
- name_zh: 徐铉
  score: 7
  worth_why: 屡使宋廷乞缓师，卧榻之侧论辩不辱命；入宋校定说文解字
  era: 五代末至北宋初
  dates_known: true
- name_zh: 包拯
  score: 7
  worth_why: 直言敢谏，权知开封贵戚宦官为之敛手，清官范式
  era: 北宋
  dates_known: true
- name_zh: 陈桱
  score: 7
  worth_why: 三世传史学撰通鉴续编二十四卷，迅霆击案而笔不为改，直笔可敬；然持论偏宋挟私滥载，亦足为史家之戒
  era: 元末
  dates_known: true
- name_zh: 宋徽宗
  score: 7
  worth_why: 联金灭辽玩物丧国终致靖康之变，谕中言徽钦称臣于金宗社为墟，亡国之鉴
  era: 北宋末
  dates_known: true
- name_zh: 伏羲
  score: 5
  worth_why: 作网罟教佃渔，养牺牲充庖厨，渔猎畜牧之始；事属传说
  era: 上古传说
  dates_known: false
- name_zh: 燧人氏
  score: 5
  worth_why: 钻木取火教民烹饪，日中之市兴交易之道
  era: 上古传说
  dates_known: false
- name_zh: 仓颉
  score: 5
  worth_why: 创文字而天雨粟鬼夜哭，文明诞生意象；事属传说
  era: 上古传说
  dates_known: false
rejections:
- name_zh: 盘古氏
  why_not: 开天辟地纯属神话，无做事流亦无年代可考
- name_zh: 天皇氏
  why_not: 仅传始制干支，世系年代皆渺茫
- name_zh: 地皇氏
  why_not: 仅传定三辰分昼夜，无做事周期
- name_zh: 人皇氏
  why_not: 仅传分九州号居方氏，传说无年代
- name_zh: 钜灵氏
  why_not: 循蜚因提诸氏皆怪妄不经，无事迹无年代，四库提要已讥其纪羲轩多采怪妄
- name_zh: 有巢氏
  why_not: 传文仅数行，构木为巢一事而时代不可考
- name_zh: 祝融氏
  why_not: 传文数行，仅以火施化作乐歌之说
- name_zh: 轩辕氏
  why_not: 禅通纪所载仅制乘车一事，与黄帝世系相混难辨
- name_zh: 女皇氏
  why_not: 禅通纪仅列其名，传文无事迹
- name_zh: 炎帝神农氏
  why_not: 本卷仅列名无事迹，无可考做事流
