  why_not: 自请督师后家破惊悸、逗留攻定兴、终降贼，仅成闹剧数行，教训单薄
- name_zh: 陈演
  why_not: 传中一无筹画、惟以贿闻，仅罢相数行，无做事周期
- name_zh: 蒋德璟
  why_not: 因拟旨罢官一事为主，事简无完整做事流
- name_zh: 杜勋
  why_not: 监军太监蟒玉郊迎降贼，数行而已
- name_zh: 姜瓖
  why_not: 开门迎降一句带过，无做事周期
- name_zh: 范景文
  why_not: 入阁数行即都城陷，殉难仅一句，事迹过简
- name_zh: 邱从周
  why_not: 醉骂李自成被斩，数十字片段
- name_zh: 牛金星
  why_not: 附随李自成授官一行，无独立做事流
- name_zh: 刘宗敏
  why_not: 附随李自成受封一行，无独立做事流
