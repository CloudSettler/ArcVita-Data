source: 史藏/编年/通鉴辑览明季编年.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 李自成
  score: 9
  worth_why: 驿卒举义、西安建国大顺改元永昌、破京师迫崇祯殉国，甲申之变为千古名场面；传檄天下直指时弊，旋败于山海关，兴亡教训俱全
  era: 明末清初
  dates_known: true
- name_zh: 秦良玉
  score: 9
  worth_why: 白杆兵统帅、兄子皆死王事；驰援夔州败归后誓不事贼、分兵守境，张献忠招土司独不敢至石砫；正史唯一以战功入将相列传的女将，忠义模范
  era: 明末
  dates_known: true
- name_zh: 史可法
  score: 9
  worth_why: 弘光朝督师扬州、城破殉国，扬州十日名场面；南明中流砥柱，气节与悲剧兼具，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 郑成功
  score: 9
  worth_why: 东南抗清中坚、北伐金陵，终驱逐荷兰收复台湾；做事流极完整，民族英雄级人物，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 李定国
  score: 8
  worth_why: 张献忠义子转扶永历、两蹶名王孔有德与尼堪、磨盘山血战；自流寇转孤忠，至死不渝，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 吴三桂
  score: 8
  worth_why: 宁远移镇之议、引清兵入关、封平西王、缢杀永历、三藩起兵称帝；一生反复无常，教训深刻，本卷已有移镇伏笔
  era: 明末清初
  dates_known: true
- name_zh: 张献忠
  score: 7
  worth_why: 入川建大西、江口沉银经考古实证；流寇兴衰完整，屠蜀之祸为反面教训，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 张煌言
  score: 7
  worth_why: 二十载海上抗清、联郑成功入长江、被俘不屈就义；孤忠典范，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 周遇吉
  score: 7
  worth_why: 宁武关以孤城抗大顺主力，炮歼万人、巷战手杀数十人，矢集如猬毛骂贼死；自成几欲退兵，一战定全局走向，全家死节
  era: 明末
  dates_known: true
- name_zh: 黄道周
  score: 7
  worth_why: 隆武朝以孤军出仙霞、婺源被俘、绝食死节；名臣书法大家，气节名场面，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 夏完淳
  score: 6
  worth_why: 十四岁从军抗清、十七岁被俘就义，狱中上母书传世；少年气节典范，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 瞿式耜
  score: 6
  worth_why: 力保永历、死守桂林、城破端坐殉国；南明后期擎天之柱，见本辑下卷
  era: 明末清初
  dates_known: true
- name_zh: 崇祯帝
  score: 6
  worth_why: 君主本低优先，但国君死社稷殉国煤山、屡下罪己诏、南迁之议悬而未决，勤政十七年而亡国的教训型名场面；缓录作坐标兼教训
  era: 明末
  dates_known: true
rejections:
