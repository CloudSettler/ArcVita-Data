candidates:
- name_zh: 胡三省
  score: 9
  worth_why: 毕生为资治通鉴作音注，复撰通鉴释文辩误十二卷，逐条刊正史炤讹谬；提出“晋唐疆理不可相释”等千古著书准则；每条先举误再辨正，考据方法自成体系，为读史者启发之助；宋亡之际著述不辍，以书传世
  era: 南宋末至元初
  dates_known: true
rejections:
- name_zh: 史炤
  why_not: 通鉴释文浅陋特甚、讹谬迭出，文中仅见其误未见可取之做事流
- name_zh: 司马康
  why_not: 海陵释文实为伪托公休之名欺世，非其本人所作，无做事可录
- name_zh: 司马伋
  why_not: 仅编通鉴前例且屡为妄人所误，事迹单薄
- name_zh: 冯时行
  why_not: 文中仅一句为史炤释文作序，无事迹
- name_zh: 纪昀
  why_not: 四库提要总纂官职衔而已，本卷无其做事过程
- name_zh: 智伯
  why_not: 仅作臯狼地望考据之引例，一句带过
- name_zh: 赵括
  why_not: 仅因母字毋字之辨被引，无做事周期
- name_zh: 淖齿
  why_not: 仅作数读音之例证，无事迹展开
