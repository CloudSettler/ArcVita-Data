source: 史藏/编年/郑史编年辑录.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 郑庄公
  score: 9
  worth_why: 克段于鄢一条俱全：缘起母弟之宠、请封于京、祭仲谏而庄公曰多行不义必自毙姑待之、 二百乘伐京克段、终有掘地见母黄泉悔誓名场面；左传开篇名文，兼有失教之讥与孝义之复，谋略与教训并存
  era: 春秋初期
  dates_known: true
- name_zh: 郑桓公
  score: 8
  worth_why: 见王室将卑而问迁国于史伯，定东寄孥与贿之策，虢郐献十邑竟为国续命于西周覆亡前夕；寄孥取邑、迁民洛东皆可考，惜未及收成即死于骊山之难
  era: 西周末
  dates_known: true
- name_zh: 史伯
  score: 7
  worth_why: 一篇问答为本周思想核心：和实生物同则不继乃中国和同之辨源头；纵论天下预言晋秦齐楚将兴，篇末证以平王之末秦晋齐楚代兴，谶尽验
  era: 西周末
  dates_known: true
- name_zh: 颍考叔
  score: 6
  worth_why: 献公赐食舍肉巧启孝思，献阙地及泉隧而相见之策，成就黄泉相见母子和好名场面；君子称纯孝，孝子不匮永锡尔类，可为孝范
  era: 春秋初期
  dates_known: true
- name_zh: 郑武公
  score: 5
  worth_why: 承父遗策东徙其民、受十邑而竟国之，两代接力终成一国；娶申为政治联姻，疾中力排武姜立段之请，庄公之基实定于其手，然事迹简略
  era: 两周之际
  dates_known: true
rejections:
- name_zh: 共叔段
  why_not: 骄宠缮甲终败奔共，事皆系于庄公克段一事之内，无独立后续周期，其教训已由庄公条与左传书法承载
- name_zh: 武姜
  why_not: 爱恶二子、请封请立、为内应，仅为庄公故事关键配角，无独立做事流
- name_zh: 祭仲
  why_not: 本篇仅祭仲相三字，无事迹可抽
- name_zh: 公子吕
  why_not: 即子封，两度进言可矣而已，配角无独立周期
- name_zh: 周幽王
  why_not: 已在库，此处仅为骊山之难时间坐标
- name_zh: 周宣王
  why_not: 仅作纪年坐标，无做事记录
- name_zh: 褒姒
  why_not: 于史伯预言中追叙褒人龙漦故事带出，无自主事迹
- name_zh: 虢石父
  why_not: 谗谄巧从一句带过，无事迹
