source: 史藏/编年/靖康要录.md
category: 史藏/编年
verdict: has_candidates
candidates:
- name_zh: 李纲
  score: 9
  worth_why: 以忠直之资不主割地议和忤时宰；汴京被围主持防务成东京保卫战名场面；遭百寮同疏丑诋贬逐，和战之争功败垂成，做事流完整且忠奸对照教训深刻
  era: 北宋末南宋初
  dates_known: true
- name_zh: 种师道
  score: 7
  worth_why: 老将持重主坚守，请乘金军半渡击之而谋不用，靖康勤王入援汴京忧愤而卒，主战柱石赍志以殁堪为镜鉴
  era: 北宋末
  dates_known: true
- name_zh: 陈东
  score: 7
  worth_why: 太学生伏阙上书请诛六贼、复用李纲，士民干政之名场面；屡以直言得罪，终建炎间被斩，为直言之士完整教训
  era: 北宋末南宋初
  dates_known: true
- name_zh: 赵桓
  score: 7
  worth_why: 靖康之耻当事人；即位改元下诏求直言，既而和战不定、贬李纲信耿南仲，终致二圣北狩；生卒历历可考，为优柔误国之至训。君主虽低优先，其败亡叙事警示价值极高
  era: 北宋末
  dates_known: true
- name_zh: 耿南仲
  score: 6
  worth_why: 以东宫旧学入相，挤李纲出师、减放兵马令诸将不受节制，幸其败以快私心，贬纲之奏假百寮同疏示公论；妒贤误国标本
  era: 北宋末
  dates_known: true
- name_zh: 郭药师
  score: 6
  worth_why: 叛命降金导金军南下，燕山防线因此崩溃；由辽而宋而金的反复降将标本，降叛无常之教训
  era: 北宋末
  dates_known: true
- name_zh: 吴敏
  score: 5
  worth_why: 内禅之议预闻决策，日晡议定擢门下侍郎草传位诏，靖康初预政；从龙定策一事可考，事迹稍简略
  era: 北宋末南宋初
  dates_known: true
rejections:
- name_zh: 梁方平
  why_not: 仅受命将七千守濬州旋溃，无完整做事周期
- name_zh: 何灌
  why_not: 仅受命将二万守河津，文中无事迹后续
- name_zh: 张叔夜
  why_not: 本卷仅以东宫记室一现，其靖康死节事不在本书时限
- name_zh: 蔡京
  why_not: 仅于册立太子礼率百官称贺一现，本录无其做事周期
- name_zh: 秦桧
  why_not: 本录虽存其靖康间事且词意左袂不足尽据，其专权误国主流在绍兴年间，非本书时限所能成完整做事流
- name_zh: 白时中
  why_not: 仅以尚书充东宫宾客一现，无事迹可谱
