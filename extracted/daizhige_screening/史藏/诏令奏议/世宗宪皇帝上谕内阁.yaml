source: 史藏/诏令奏议/世宗宪皇帝上谕内阁.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 雍正帝
  score: 8
  worth_why: 御极十三年励精图治，朱批上谕数百万言，训饬吏治士习、仓储水利、军伍保甲诸大政；摊丁入亩、火耗归公、密折制度等改革做事流完整，本卷即其诏令汇编，开篇即康熙六十一年即位诏，制度名场面多
  era: 清康熙末至雍正朝
  dates_known: true
- name_zh: 怡亲王允祥
  score: 7
  worth_why: 雍正最倚重之弟，总理部务、理财治水，本篇领衔奏请汇编刊布上谕，忠勤辅政可为贤王模范
  era: 清康熙雍正年间
  dates_known: true
- name_zh: 张廷玉
  score: 7
  worth_why: 康雍乾三朝枢臣，参与创制军机处章程，清代汉臣唯一配享太庙；此处署名奏请刊布上谕，做事周期可考
  era: 清康雍乾三朝
  dates_known: true
- name_zh: 纪昀
  score: 7
  worth_why: 钦定四库全书总纂官，主持纂修而成本文献所在丛书，另有阅微草堂笔记传世，缘起、阶段、结果俱全
  era: 清乾隆年间
  dates_known: true
rejections:
- name_zh: 乾隆帝
  why_not: 本文内仅为命续刻雍正八年至十三年上谕的指令者，其主要做事周期不在此文献
- name_zh: 康熙帝
  why_not: 仅以大行皇帝身份在即位诏中被追述，无做事流可录
- name_zh: 康五瑞
  why_not: 仅一次条奏请刊上谕，事迹单薄不成做事周期
- name_zh: 朱轼
  why_not: 仅列名会奏附议，本文内无独立做事周期
- name_zh: 蒋廷锡
  why_not: 仅联名奏请，本文献内无个人做事流
- name_zh: 鄂尔奇等九卿科道诸臣
  why_not: 会奏仅列名画诺，属群体性附议，无个人关键决定与结果
