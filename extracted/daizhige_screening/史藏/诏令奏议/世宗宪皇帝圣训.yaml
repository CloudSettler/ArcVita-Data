category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 清世宗雍正帝胤禛
  score: 9
  worth_why: 本书传主；励精图治十三年，清理亏空、火耗归公、摊丁入亩、改土归流、设军机处，承康乾盛世之枢纽；圣训三十六卷三十门九百十六则备载其宵衣旰食，如却万寿道场、改幸学为诣、谦却受俘与贺瑞、亲诣祭奠并敕修阙里圣庙，做事周期、关键决定与勤政典范俱全
  era: 清代雍正
  dates_known: true
- name_zh: 清圣祖康熙帝玄烨
  score: 8
  worth_why: 圣训中屡颂其六十余年至治神功；史实有除鳌拜、平三藩、收台湾、亲征噶尔丹、治河修典，治绩突出可破君主低优先之例
  era: 清代康熙
  dates_known: true
- name_zh: 清高宗乾隆帝弘历
  score: 7
  worth_why: 御极后追述亲聆纶音二十余载，恭编皇考圣训实录并亲制序文；另有十全武功、编纂四库全书等完整治绩，惟君主作坐标酌降
  era: 清代乾隆
  dates_known: true
- name_zh: 纪昀
  score: 7
  worth_why: 四库全书总纂官，主持中国史上最大丛书编纂，辑佚删定、总撰提要，做事流完整且关乎文献存续，堪为文化工程典范
  era: 清代乾隆嘉庆
  dates_known: true
rejections:
