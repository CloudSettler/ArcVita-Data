source: 史藏/诏令奏议/世宗宪皇帝硃批谕旨.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 雍正帝
  score: 9
  worth_why: 自述藩邸未谙政事而受圣祖付托，遂定内外臣工皆得具折奏事之制；昼接廷臣、灯下批折至二更三鼓，六载如一日，手批万余件后择十分之二三刊为硃批谕旨——缘起、勤政、制度创设、成书颁行诸阶段俱全；因人而施、量材而教之驭吏法兼可为范与戒，系密折制度之定型者
  era: 清雍正朝
  dates_known: true
- name_zh: 鄂尔泰
  score: 8
  worth_why: 雍正朝第一名臣，本集当存其专卷奏折硃批；主政云贵改土归流、经营西南，与李卫、田文镜并称模范督抚，做事流完整
  era: 清康雍乾朝
  dates_known: true
- name_zh: 李卫
  score: 8
  worth_why: 一任封疆理盐政、修海塘、缉盗贼，出身捐纳而骤至总督，本集有其一时期奏折可据，做事流完整且具传奇性
  era: 清雍正朝
  dates_known: true
- name_zh: 田文镜
  score: 8
  worth_why: 抚豫厉行摊丁入亩、清查亏空、参劾属吏，雷厉风行而毁誉集于一身，可为模范亦可为教训，本集存其奏折
  era: 清雍正朝
  dates_known: true
- name_zh: 岳钟琪
  score: 7
  worth_why: 雍正朝西陲用兵统帅，奏报曾静投书一案为名场面；功高位重而险遭不测，本集存其奏折硃批
  era: 清雍正朝
  dates_known: true
- name_zh: 齐苏勒
  score: 6
  worth_why: 河道总督，文内一见其奏闻事权；其治河改修海口诸役有完整做事周期，本集当存其河工诸折
  era: 清康熙雍正朝
  dates_known: false
- name_zh: 范时绎
  score: 5
  worth_why: 署理两江期间盘查两司库项、勒限归补亏空、奏报禾苗雨泽、举发淮关监督庆元夜馈道员潘尚智万余金一案，做事链可考而性质平常，可作密折制度下督抚之典型样本
  era: 清雍正朝
  dates_known: false
rejections:
- name_zh: 庆元
  why_not: 淮关监督，仅见其夜馈银两案由，属案中人非做事者
- name_zh: 潘尚智
  why_not: 淮徐道亏空被追，仅见案由无做事周期
- name_zh: 张楷
  why_not: 江苏巡抚，仅见被硃批斥为甚不妥协拟黜任，无做事流
- name_zh: 漆绍文
  why_not: 布政使，仅见册报库银名衔
- name_zh: 魏廷珍
  why_not: 仅见移咨名衔一见
- name_zh: 李世仁
  why_not: 仅见前任布政使名衔
- name_zh: 范仲淹
  why_not: 仅被范时绎引为二十一世祖以谢恩，本集无其事迹；其本人宜据宋史另行立档
- name_zh: 圣祖仁皇帝
  why_not: 康熙帝仅作付托背景一提，其功业当以实录圣训另立档
- name_zh: 乾隆帝
  why_not: 仅见御制后序与恭校年月名目，本集无其做事内容
- name_zh: 纪昀
  why_not: 仅以总纂官署名提要，本集无其做事周期；其四库全书之功宜于四库文献另立档
- name_zh: 陆锡熊
  why_not: 总纂官署名一见，无做事内容
- name_zh: 孙士毅
  why_not: 总纂官署名一见，无做事内容
- name_zh: 陆费墀
  why_not: 总校官署名一见，无做事内容
