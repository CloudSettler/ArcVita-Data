category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 顺治帝
  score: 7
  worth_why: 六岁冲龄定鼎燕京，亲政后孜孜图治，整顿吏治、惩贪饬臣、兴文教、重孝治；御注孝经、御制内则衍义与人臣儆心录；冲龄即位—亲政改制—盛年早逝，做事周期完整，本圣训即其治道言行的直接载体
  era: 清初
  dates_known: true
- name_zh: 范文程
  score: 7
  worth_why: 清开国文臣之首，历仕太祖太宗世祖圣祖四朝，赞画入关定鼎与制度规画；篇中与顺治问对历代贤君得失、论勤政之道，为君臣论治的实记录
  era: 明末清初
  dates_known: true
- name_zh: 陈名夏
  score: 6
  worth_why: 由明状元入清为大学士，篇中与顺治论得人则治、论唐宋家法与用人之道，谋臣角色鲜明；后因结党倡言复明衣冠被赐死，可为教训型人物
  era: 明末清初
  dates_known: true
- name_zh: 明太祖
  score: 8
  worth_why: 篇中顺治明言历代贤君莫如明太祖，所定制度章程规画周详历代莫及；布衣起兵、驱逐胡元、定大明律与官制，缘起—创业—建制—守成俱全，制度奠基级人物
  era: 元末明初
  dates_known: true
- name_zh: 唐太宗
  score: 7
  worth_why: 篇中引贞观政治可比隆三代、惟能用人故耳；又有家法不正致女主擅国之评；玄武门定局—贞观之治—纳谏用人名场面多，功过可鉴
  era: 唐
  dates_known: true
