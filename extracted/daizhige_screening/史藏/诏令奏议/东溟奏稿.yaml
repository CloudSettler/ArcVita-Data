candidates:
- name_zh: 姚莹
  score: 9
  worth_why: 台湾道任内先事预防、联庄收养游民，筹剿南北中三路谋逆，统筹道库经费、亲驻彰化镇定、审谳定案，做事流完整；其后鸦片战争守台御英更成名场面，为近代能吏典范
  era: 清道光
  dates_known: true
- name_zh: 达洪阿
  score: 8
  worth_why: 台湾总兵，与姚莹配合先事防剿，自练精兵、亲赴店仔口捣匪巢入山搜捕，后共守台湾御英，立功反遭构陷，事功与教训并存
  era: 清道光
  dates_known: true
- name_zh: 施琅
  score: 9
  worth_why: 郑氏故将归清，平台湾后自海道驰奏七日达京师封靖海侯，平台周期完整，与姚启圣功封之争亦足为镜鉴
  era: 明末清初
  dates_known: true
- name_zh: 姚启圣
  score: 8
  worth_why: 经营台湾二十年，招降黄梧施琅遣兵平台，功成未封、恚愤疽发背而卒，全祖望作第二碑鸣不平，功名之际足为后世教训
  era: 清初
  dates_known: true
- name_zh: 王得禄
  score: 6
  worth_why: 在籍提督召集庄丁协同守御、遣线勇拿获逆匪，早岁海上起家官至提督，惟本稿事迹简略可缓录
  era: 清嘉道年间
  dates_known: true
