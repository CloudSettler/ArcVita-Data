category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 逯中立
  score: 9
  worth_why: 万历朝给事中，六疏直谏——论公用舍、罢太和山织造、论东倭封贡、修史用人、拔淹滞停例金；一忤旨停俸、一见忌辅臣、一被贬外授，矫矫不阿无愧封驳之职，是言官风骨的完整做事周期
  era: 明万历朝
  dates_known: true
- name_zh: 王锡爵
  score: 7
  worth_why: 万历朝首辅，援私党刘虞夔充史局总裁遭言路群攻；以主上亲笔自解致六十余言官废黜，直臣沈鲤、邹元标不得立朝，是万历党争与辅臣用舍公私之争的关键人物
  era: 明万历朝
  dates_known: true
- name_zh: 石星
  score: 7
  worth_why: 兵部尚书力主倭封贡和议，倚沈惟敬密计、催表文了事而疏于战备，酿东事之祸；后坐议和误国下狱瘐死，是权臣侥幸误国的典型教训
  era: 明万历朝鲜之役
  dates_known: true
- name_zh: 沈惟敬
  score: 6
  worth_why: 以市井身份充对日议和密使，封贡开市层层加码私许倭人，欺罔败露终遭弃市；市井权术误国的反面标本
  era: 明万历朝鲜之役
  dates_known: true
- name_zh: 宋应昌
  score: 6
  worth_why: 援朝东征经略，封贡之议的首倡者，与倭议和迁延战守，事败遭罢斥，和战抉择的镜鉴
  era: 明万历朝鲜之役
  dates_known: true
- name_zh: 顾养谦
  score: 6
  worth_why: 总督辽东力成封贡之局，逯中立斥其冥冥决事、以欵自愚；当事主和者的完整争议周期
  era: 明万历朝鲜之役
  dates_known: true
- name_zh: 高攀龙
  score: 5
  worth_why: 一疏惓惓为国惜才获本书记载，后为东林领袖殉节；本书仅一见，宜缓录待补
  era: 明万历至天启
  dates_known: true
- name_zh: 邹元标
  score: 5
  worth_why: 慷慨大节海内属目而不能一日立朝，直臣沉浮的缩影；本书仅数语，宜缓录
  era: 明万历朝
  dates_known: true
