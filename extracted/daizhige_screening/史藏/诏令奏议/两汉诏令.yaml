source: 史藏/诏令奏议/两汉诏令.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 汉宣帝
  score: 9
  worth_why: 巫蛊遗孤由狱中民间至中兴之主；霍光身后收权亲政；石渠阁定五经；霸王道杂之与循吏政治；民间知疾苦与故剑情深皆为名场面
  era: 西汉中期
  dates_known: true
- name_zh: 霍光
  score: 8
  worth_why: 受武帝顾命辅政二十年政事一决于光；主盐铁会议；废昌邑立宣帝开权臣废立之例；身后霍氏族灭为权臣不学无术之戒
  era: 西汉武昭宣之际
  dates_known: true
- name_zh: 司马相如
  score: 8
  worth_why: 汉赋宗师子虚上林为代表作；武帝每为报书赐诏令其视草见本编序；持节通西南夷定约法有实功；临终遗札言封禅；文君当垆名场面
  era: 西汉景武之际
  dates_known: true
- name_zh: 王莽
  score: 8
  worth_why: 平帝卷锡莽诸诏可考其由谦恭下士至安汉公称帝之完整周期；托古改制币制五变终致绿林赤眉之乱；僭窃与改革双重教训
  era: 西汉末至新莽
  dates_known: true
- name_zh: 汉明帝
  score: 7
  worth_why: 明章之治；永平梦金人求法建白马寺为佛教东传节点；命王景治河千载无患；严苛驭下与兴学并存
  era: 东汉前期
  dates_known: true
- name_zh: 汉昭帝
  score: 6
  worth_why: 十四岁识破燕王旦伪书保全霍光；信任辅政成昭宣之基；盐铁会议开贤良文学议政先声
  era: 西汉中期
  dates_known: true
- name_zh: 汉章帝
  score: 6
  worth_why: 白虎观会议正五经同异定汉儒经学；息兵宽刑成明章之治；章草之名由其传
  era: 东汉前期
  dates_known: true
- name_zh: 汉和帝
  score: 6
  worth_why: 十三岁联郑众诛窦宪夺回朝纲；永元之隆东汉极盛；开宦官参政先河为双刃教训
  era: 东汉中期
  dates_known: true
- name_zh: 班彪
  score: 6
  worth_why: 作王命论折隗嚣分裂之议并为本编序所及；续史记为后传开班固汉书之基，史学承前启后
  era: 两汉之际
  dates_known: true
- name_zh: 蔡邕
  score: 6
  worth_why: 熹平石经正定六经文字立经学标准；独断记汉制为本编多引；才兼文史音律而卷入董卓狱死为才士之戒
  era: 东汉末
  dates_known: true
- name_zh: 吴芮
  score: 5
  worth_why: 封王诏明载其率越人佐诸侯诛暴秦有大功；汉初异姓王唯一善终，忠谨保身之范
  era: 秦末汉初
  dates_known: true
- name_zh: 汉元帝
  score: 5
  worth_why: 决昭君出塞成和亲名场面；宣帝叹乱我家者太子也；柔仁好儒权落石显为儒主失柄之戒
  era: 西汉中后期
  dates_known: true
- name_zh: 汉桓帝
  score: 5
  worth_why: 由蠡吾侯联宦官诛跋扈将军梁冀亲政；却开党锢之祸由治转乱，权臣覆灭与佞幸乱政双面警示
  era: 东汉中后期
  dates_known: true
rejections:
- name_zh: 汉惠帝
  why_not: 仁弱拱手，萧规曹随事在曹参，人彘之后不复听政，无自身做事周期
- name_zh: 汉成帝
  why_not: 沉湎委政王氏，燕啄皇孙国嗣遂绝，自身无关键决策
- name_zh: 汉哀帝
  why_not: 限田之议旋寝，嬖董贤至欲禅让，断袖为戒而做事流不完整
- name_zh: 汉平帝
  why_not: 幼冲践祚政由王莽，卷中事迹皆他人之笔
- name_zh: 汉献帝
  why_not: 终身傀儡，其时代名场面尽在董卓曹操而不在帝
- name_zh: 汉灵帝
  why_not: 卖官鬻爵激黄巾，纯为乱源且教训与桓帝条重叠
- name_zh: 汉殇帝
  why_not: 恸逾岁夭折无可录事迹
- name_zh: 汉安帝
  why_not: 幼冲嗣位权归邓氏，亲政后灾异政乱无完整做事流
- name_zh: 汉顺帝
  why_not: 以宦官立而宠梁氏，跋扈将军坐大，自身无成
- name_zh: 汉质帝
  why_not: 聪慧一句跋扈将军见鸩，才露而折无可考做事周期
- name_zh: 韩王信
  why_not: 赐书招抚而不返，降匈奴反复身死，教训单薄
- name_zh: 义帝
  why_not: 皆名义共主，放杀事为项羽罪证而非己事
- name_zh: 亡诸
  why_not: 仅封王一诏，事迹简略
- name_zh: 张安世
  why_not: 序中仅一见给事尚书事，完整事迹须他书辅证
- name_zh: 林虙
  why_not: 皆编纂者序跋与四库馆臣，非本库传主之选
- name_zh: 楼昉
  why_not: 编纂者，非传主之选
- name_zh: 洪咨夔
  why_not: 总论作者，编纂之功不以传主录入
- name_zh: 董卓
  why_not: 废立焚掠纯破坏，以乱始以乱终，权臣之戒已由霍光王莽条覆盖
