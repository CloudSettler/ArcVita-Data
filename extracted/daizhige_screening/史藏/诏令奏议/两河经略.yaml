candidates:
- name_zh: 潘季驯
  score: 10
  worth_why: 四任总河先后二十七年；创「束水攻沙」方略——以堤束水、以水刷沙、导河归海；万曆初河决高家堰力排浚海口之议，主张塞决固堤复黄河故道，条上六事诏如议行；晚辑河防一览成治河经典；其治黄思路影响后世数百年，做事流完整且有方法论名场面
  era: 明嘉靖至万历
  dates_known: true
- name_zh: 陈瑄
  score: 6
  worth_why: 永乐间平江伯筑高家堰捍淮、堤管家诸湖通淮为运道、严闸启闭官民船由五坝车盘，奠定漕运基础；文中作为潘季驯所修复之故业被追述，仅百余字故列缓
  era: 明永乐
  dates_known: true
