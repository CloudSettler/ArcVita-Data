verdict: has_candidates
candidates:
- name_zh: 沈括
  score: 9
  worth_why: 熙宁八年使辽争地界的名场面主角；本篇自奏自录，完整呈现其做事流——先钩稽档牍图籍考定界至（分水岭本末），再条陈对策、斟酌诏辞字句防辽人借文生事，最终充国信使赴北廷折难不辱使命；兼具外交谈判与档案考据双重示范，可为后人凭据办事、缜密措辞之典范
  era: 北宋
  dates_known: true
rejections:
- name_zh: 萧禧
  why_not: 辽方使臣，仅恃强索地为交涉对手，无正面完整做事周期
- name_zh: 刘忱
  why_not: 仅见于累行问难的文牍记载，无独立做事流
- name_zh: 梁颍
  why_not: 只留一条对答引文，事迹简略
- name_zh: 李承之
  why_not: 仅具河东察访使衔名，未载行事
- name_zh: 萧素
  why_not: 仅一笔提及昔年留滞事，无事迹可采
- name_zh: 耶律荣
  why_not: 仅因执到文字一处被提及，无做事流
