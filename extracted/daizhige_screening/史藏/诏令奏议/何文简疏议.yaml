candidates:
- name_zh: 何孟春
  score: 8
  worth_why: 十卷奏议贯穿弘治至嘉靖，救言官庞泮、请停万岁山工役、出理陕西马政厘弊五事、谏武宗幸宣府、巡抚云南、嘉靖初争大礼泣谏削籍；左顺门哭谏为明代气节名场面，可为直谏之臣典范
  era: 明弘治至嘉靖
  dates_known: true
- name_zh: 明孝宗
  score: 6
  worth_why: 建言疏称其践位以来省览章疏、广开敢言之风、有弗咈之美；弘治纳谏为其做事亮点，惟本集多作受谏坐标，细节待他书
  era: 明弘治
  dates_known: true
