source: 史藏/诏令奏议/元代奏议集录.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 耶律楚材
  score: 9
  worth_why: 奏定税法立十路课税所、谏止屠城救百万生民、便宜十八事与陈时务十策，由军功幕僚转型为立制度安中原的第一功臣，做事流完整且皆为名场面
  era: 蒙古汗国成吉思汗、太宗窝阔台时期
  dates_known: true
- name_zh: 郭守敬
  score: 9
  worth_why: 论历之本在于测验，主持授时历为古代历法巅峰；开大都运粮河通惠河、兴京畿水利，工程师做事流完整，代表作级成果
  era: 元世祖忽必烈至元成宗时期
  dates_known: true
- name_zh: 许衡
  score: 9
  worth_why: 立国规摹、中书大要设计元朝汉法体制，倡农桑学校兴国学，主持更历（授时历），三辞相位守节，儒宗治世做事流完整
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 丘处机
  score: 9
  worth_why: 万里西行赴大雪山见成吉思汗，论为治之方敬天爱民，一言止杀、全真大盛，缘起远行论道收束皆有可考节点
  era: 金末元初
  dates_known: true
- name_zh: 伯颜
  score: 8
  worth_why: 平宋统帅，请乘胜取宋定渡江方略，取临安不嗜杀，穿凿南北河渠利通贡，军政大事有始有终
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 刘秉忠
  score: 8
  worth_why: 陈时事所宜疏定国本，荐邢州牧守开汉法治州样板，议朝仪制国号建大都城，元朝典制的总设计师
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 郝经
  score: 8
  worth_why: 使宋被拘真州十六年，苏武式气节名场面；河东罪言、班师议、立政议皆切中时弊，著续后汉书有代表作
  era: 元世祖中统、至元时期
  dates_known: true
- name_zh: 史天泽
  score: 8
  worth_why: 出将入相五十年，治国安民疏、奏民债军籍事安民理政，功高主动请解兵权，征宋分省之议见远识
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 姚枢
  score: 8
  worth_why: 论治道八目三十条为忽必烈藩邸首谋，屯田备宋定平宋方略，料李璮叛谋于未发，征宋宜止杀安民留仁政之名
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 赛典赤赡思丁
  score: 8
  worth_why: 首任云南平章，建行省置州县令长，兴学修水利抚诸部，把云南纳入内地治理体系，治滇做事流完整
  era: 元世祖忽必烈至元时期
  dates_known: true
- name_zh: 张弘范
  score: 7
  worth_why: 崖山海战统帅灭宋的标志性名场面，荒年免租税见治民之心；本集仅存一条奏议，做事流需据本传补全
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 郭侃
  score: 7
  worth_why: 随旭烈兀西征破百余城，上立政、平宋屯田策，东西两线战功奇特，可为军事做事流样本
  era: 蒙古宪宗至元世祖时期
  dates_known: true
- name_zh: 张文谦
  score: 7
  worth_why: 请择官治邢州成乱世治理样板，谏杀掠、财赋关白中书定财政体制，且为郭守敬历法事业的重要推手
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 崔斌
  score: 7
  worth_why: 当廷劾阿合马奸贪，随驾太子助言成一堂对垒名场面，终为阿合马所害，直臣抗争的教训样本
  era: 元世祖忽必烈时期
  dates_known: true
- name_zh: 程钜夫
  score: 7
  worth_why: 吏治五事与民间利病切中江南积弊，首倡通南北之选，奉诏访贤荐赵孟頫，开南人入仕之门
  era: 元世祖至元成宗时期
  dates_known: true
rejections:
- name_zh: 耶律阿海
  why_not: 仅存谏杀掠一条，做事周期残缺
- name_zh: 石抹明安
  why_not: 仅议攻金、谏屠城二条，事迹简略不足独立成轴
- name_zh: 郭宝玉
  why_not: 仅陈攻金策一条，缺乏缘起与结果
- name_zh: 粘合重山
  why_not: 仅谏饮宴一条，无可考做事流
- name_zh: 魏初
  why_not: 条目虽多但多为零散仪制建言，缺少标志性结果与阶段
- name_zh: 完泽
  why_not: 仅奏赏赐课税杂事，为宰辅时间坐标非做事主体
- name_zh: 耶律铸
  why_not: 仅节浮费、议采室女二条，事迹简略
- name_zh: 高鸣
  why_not: 议三省、死囚论报二条，建言孤立无完整周期
