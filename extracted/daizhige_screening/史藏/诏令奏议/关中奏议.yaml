candidates:
- name_zh: 杨一清
  score: 10
  worth_why: 督理陕西马政：亲历两监六苑、踏勘草场查出侵占、点视牧军马匹、黜罢不职官吏、规划兴复，做事周期完整且关键决策清晰；其人另有总制延绥宁夏甘肃三边、计除刘瑾、再起提督三边等大事，官至华盖殿大学士谥文襄，名场面与教训兼备
  era: 明中期成化至嘉靖
  dates_known: true
- name_zh: 马文升
  score: 5
  worth_why: 弘治朝兵部尚书，于本篇覆疏定夺黜罢苑马寺官员事；其生平兴复马政、经略边务多有可采，然本篇仅以署名覆疏出现，事迹须借其本传补足，宜缓录
  era: 明中期
  dates_known: true
rejections:
- name_zh: 李克恭
  why_not: 陕西苑马寺卿，仅因马政废弛贪声大着被劾罢，无一完整做事周期
- name_zh: 李谦
  why_not: 灵武监监正，仅负欠人债需索钱物数行带过
- name_zh: 卫昌
  why_not: 广宁苑圉长，愚闇懦弱一语评语而已
- name_zh: 徐文英
  why_not: 苑马寺少卿，仅置之不理一句，无事迹展开
- name_zh: 车霆
  why_not: 仅被访委分理马政一句，无做事过程
- name_zh: 纪昀
  why_not: 四库全书总纂官，仅校书署名，非传主
