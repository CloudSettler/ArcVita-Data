source: 史藏/诏令奏议/刑科婚姻类提要.md
category: 史藏/诏令奏议
verdict: no_value
skip_reason: 本文献为清代内阁刑科婚姻类刑案题本提要，通篇系民间奸情、谋命琐案的司法审转文书：案犯皆单案平民，无完整做事周期，亦无成语、制度、发明、名场面生发点；题署官员（果亲王允礼、嵇曾筠、高其倬、程元章、直督李氏等）在本档内仅例行核拟题报，其历史大事不在此文献展开；乾隆帝即位恩赦诏（赦非善政论）属例行政策宣示，君主按例低优先。全档无一人达7分录入线。
rejections:
- name_zh: 傅教化
  why_not: 强奸致谢氏毙命案犯，仅单案罪案情节，无做事流无传世价值
- name_zh: 孔为先
  why_not: 与谢氏通奸并教唆邱集玉伪证案犯，事迹限于单案
- name_zh: 恒一
  why_not: 应赴僧，谋毙顾阿长首犯，单案罪人，教益价值未出普通凶案
- name_zh: 吴守忠
  why_not: 谋杀案加功从犯，缚人溺毙仅罪案过程
- name_zh: 袁福臣
  why_not: 夤夜图奸、夺棍殴毙袁朝忠案犯，仅罪案经过
- name_zh: 周四
  why_not: 弟奸兄妻、砍伤查察地邻案犯，单案无做事周期
- name_zh: 邱氏
  why_not: 同案奸妇，事迹单一
- name_zh: 吕佩固
  why_not: 购砒藏馒毒杀韦允迁案犯，单案罪案
- name_zh: 韦胡氏
  why_not: 同案从犯，事迹单一
- name_zh: 沈凈理
  why_not: 道士调戏俞氏致其自缢案犯，单案
- name_zh: 俞氏
  why_not: 因调戏羞忿自缢获旌表，节烈个案无做事流，仅作旌表制度例证
- name_zh: 允礼
  why_not: 果亲王以总理刑部衔领衔会审，本档内仅题署之名；其理藩护教、扈送达赖等主要事迹不在此文献，无做事流
- name_zh: 嵇曾筠
  why_not: 文华殿大学士总理浙江海塘，本档仅例行核拟毒杀案；其治河大功不在此文献内，事迹简略，宜另据清史稿等专传评估
- name_zh: 高其倬
  why_not: 苏抚会审通奸案，例行题报无做事流
- name_zh: 乾隆帝
  why_not: 即位初恩赦诏并申明再犯加倍治罪，系例行恩典宣示，君主低优先，未达秦始皇商鞅变法级做事门槛
