candidates:
- name_zh: 刘铭传
  score: 10
  worth_why: 淮军名将、首任台湾巡抚——抗法保台（淡水大捷）、促成台湾建省、修筑早期铁路、架设电报、开山抚番、整顿财政，是晚清自强运动最完整的省级实践；晚年因积劳与阻力求去，兼可为教训；本档案即其抚台前后公文总汇，做事流极全
  era: 晚清（1836-1896）
  dates_known: true
- name_zh: 李鸿章
  score: 8
  worth_why: 洋务运动主帅；本档侧见其奏办矿务税则、督率定远等舰成军；做事流极完整（练军、办洋务、外交），本档案中虽属配角仍足为时间坐标
  era: 晚清（1823-1901）
  dates_known: true
- name_zh: 丁日昌
  score: 7
  worth_why: 洋务先驱；本档见其渡台妥筹生番剿抚、拟定抚番善后章程二十一条，为开山抚番制度化先声，治理近代化的先行者
  era: 晚清（1823-1882）
  dates_known: true
- name_zh: 刘永福
  score: 7
  worth_why: 黑旗军援越抗法名将；本档仅见其署理碣石镇总兵一条，然其抗法、保台、台湾民主国一线做事流完整，成败教训兼具，宜另行补源录入
  era: 晚清（1837-1917）
  dates_known: true
- name_zh: 林朝栋
  score: 6
  worth_why: 台中雾峰林家代表，奉札招募土勇参与抗法布防与开山抚垦，后统栋军经营中路，是地方士绅办事周期的典型样本
  era: 晚清（1848-1904）
  dates_known: true
- name_zh: 沈葆桢
  score: 6
  worth_why: 福州船政创办人、开山抚番与台湾防务奠基者；本档仅追溯其省台兼顾旧议，事迹需另据史料补全，故列缓
  era: 晚清（1820-1879）
  dates_known: true
- name_zh: 岑毓英
  score: 5
  worth_why: 曾渡台筹办开山抚番并整顿屯务；主要事功在滇黔，本档仅一见，事迹简略故缓录
