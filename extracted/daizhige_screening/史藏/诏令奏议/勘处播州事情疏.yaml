  why_not: 教唆谋立衙门之佞幸属吏，无独立完整做事流
- name_zh: 何清
  why_not: 加收侵欺粮米之蠹吏，仅见财务贪占
- name_zh: 张洪
  why_not: 侵欺马价铺陈银两、占人奴仆，琐事无周期
- name_zh: 张深
  why_not: 倚势强夺驿夫之女，恶行简略
- name_zh: 刘大荣
  why_not: 侵欺税粮折银六百余两，仅一案犯
- name_zh: 张瓒
  why_not: 虽奉勑征剿大坝山，然本疏见其听嘱朦胧具奏、滥设衙门，正面做事流残缺
- name_zh: 谢士元
  why_not: 仅列名待勘，无事迹细节
