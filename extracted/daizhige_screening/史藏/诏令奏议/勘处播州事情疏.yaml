source: 史藏/诏令奏议/勘处播州事情疏.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 何乔新
  score: 9
  worth_why: 奉旨勘处播州杨氏大案，会同镇抚太监与抚按诸官亲诣审勘杨辉父子贪暴、擅立衙门、谋害亲族诸罪，依律议拟先行发落；此疏即其完整审勘周期之作，前后勘问数十起侵欺谋害情节，堪称明代铁面执法名场面
  era: 明代成化年间
  dates_known: true
- name_zh: 杨辉
  score: 7
  worth_why: 负面教训典型：私阉土民苗人充火者、侵吞黑铅五百余担售银入己、偏宠庶子欲废嫡立嗣、怂恿冒奏请兵征剿以裂土开衙门授子侄官职；其溺爱与专擅直接酿成播州兄弟阋墙、朝廷钦勘之局，为明代土官乱政标本
  era: 明代景泰至成化年间
  dates_known: false
- name_zh: 杨爱
  score: 6
  worth_why: 幼年承袭宣慰使，八岁失母，赖火者长寿极力保护方免田氏谋害；后被分割地土记恨在心，终与庶兄互奏兴大狱；生年可考，播州杨氏承前启后之主，然本疏中多为受审一方，做事流尚简，缓录
  era: 明代天顺至成化年间
  dates_known: true
- name_zh: 杨友
  score: 5
  worth_why: 谋袭宣慰使、冒报首级升宣抚、通奸欺父酿祸，后挟雠妄奏互讦；生年可考，恶行弧线完整但皆为负面，仅可作警示案例，缓录
  era: 明代天顺至成化年间
  dates_known: true
rejections:
