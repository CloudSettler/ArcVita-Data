category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 包拯
  score: 9
  worth_why: 做事流完整可考——天圣五年进士后拂衣去养亲十年再出仕，历御史中丞、知开封府、终枢密副使；名场面密集——再弹张尧佐、弹王逵七章、劾张方平宋祁而代为三司使；门类分明的奏议集展现整顿吏治、赈济江淮、议边理财的完整治理周期；秀幹终成栋精钢不作钩，清官典范与孝亲持家之训足为后世楷模
  era: 北宋仁宗朝
  dates_known: true
- name_zh: 张田
  score: 5
  worth_why: 包拯门人，编定师门谏草三十门百七十一篇成十卷，使包公事业得以传世；进边说七篇获仁宗赐勅；嘉祐中知庐州甚著清誉，称得上不愧其师；事迹简略但做事流可辨，可缓录
  era: 北宋嘉祐年间
  dates_known: true
rejections:
- name_zh: 宋仁宗
  why_not: 君主低优先，本集仅见其开天章阁诏问与受奏，主要作时间坐标，无变法级突出做事呈现
- name_zh: 张方平
  why_not: 仅因被劾罢三司使一事见于提要，无完整做事周期
- name_zh: 宋祁
  why_not: 仅因被劾罢三司使由拯代任一事被提及，无独立做事流
- name_zh: 欧阳修
  why_not: 仅以蹊田夺牛一奏被提及，本集非其事业主体载体
- name_zh: 宋庠
  why_not: 目录中仅见弹劾篇名，无其本人做事内容
- name_zh: 晏殊
  why_not: 仅见于罢相后上奏一篇之标题，无做事流
- name_zh: 范祥
  why_not: 仅见包拯举荐其为陕西转运副使两篇，本人事迹未在本集展开
