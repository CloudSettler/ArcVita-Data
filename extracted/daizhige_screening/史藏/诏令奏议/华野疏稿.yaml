source: 史藏/诏令奏议/华野疏稿.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 郭琇
  score: 9
  worth_why: 由吴江知县行取入台，露章弹劾大学士明珠、尚书王鸿绪等权贵，直声震朝野，二年之内由佥都御史洊擢左都御史，后任湖广总督，终因红苗隐匿事自取罪戾削籍归里；敢言擢用与贻误封疆罢斥首尾完整，既是鲠直言官典范，又是居功忘慎的警示样本
  era: 清康熙年间
  dates_known: true
- name_zh: 靳辅
  score: 7
  worth_why: 长期总督河道，筑堤挑浚、经画河防，与幕宾陈潢共治黄淮，然屯田夺民、阻挠下河成议，糜费数百万两而河患如故，终遭郭琇特参；治水大工程与河臣政争交织，功罪两面皆可考，为康熙朝河务关键人物
  era: 清康熙年间
  dates_known: true
- name_zh: 明珠
  score: 7
  worth_why: 康熙朝柄政大学士，平定三藩时赞理军务有劳，后植党营私、市恩通赂、势焰熏灼，被郭琇胪列罪款严劾罢斥，晚年仅授内大臣二十余年不复委任；权相由盛而衰的完整轨迹，为结党纳贿之戒
  era: 清康熙年间
  dates_known: true
- name_zh: 王鸿绪
  score: 6
  worth_why: 以文学优长宣力史馆、总裁明史，又因交结纳贿与高士奇等同被郭琇参劾罢退；功过并存，然本篇仅存被劾欵迹，其修史做事周期需另行补考
  era: 清康熙年间
  dates_known: true
rejections:
- name_zh: 陈潢
  why_not: 附于靳辅案被参罪臣，本篇无其独立治水做事周期，仅作河臣幕宾出现
- name_zh: 余国柱
  why_not: 明珠死党，传为囊橐卖官，无独立事迹展开，依附明珠案而已
- name_zh: 高士奇
  why_not: 与王鸿绪并提被劾交结纳贿，无做事流可考
- name_zh: 徐干学
  why_not: 仅列名党援于谕旨中，无任何事迹叙述
- name_zh: 康熙帝
  why_not: 君主仅作赏罚坐标与谕旨发布者，非本篇做事主体
- name_zh: 乾隆帝
  why_not: 降旨阐明郭琇进退之由，属史裁裁断，非可录做事流
- name_zh: 纪昀
  why_not: 四库总纂官衔名，无事迹
