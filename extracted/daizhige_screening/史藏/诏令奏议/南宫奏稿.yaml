  why_not: 天下共主低优先，本篇仅作礼制改制之时间坐标
- name_zh: 严嵩
  why_not: 本篇仅一句言其构陷夏言，无做事流可考
- name_zh: 曾铣
  why_not: 仅因交关牵连夏言致死被提及，无事迹展开
- name_zh: 王恕
