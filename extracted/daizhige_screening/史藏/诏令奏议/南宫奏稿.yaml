candidates:
- name_zh: 夏言
  score: 8
  worth_why: 以才敏受知世宗，由给事中骤至礼部尚书、武英殿大学士，主持南北郊分祀、更定文庙祀典、议大禘、立先蚕坛等嘉靖礼制改制，奏疏明达可采；后志骄气溢、傲愎自专，为严嵩构陷，坐曾铣事弃市，权臣骤起骤落为后世之鉴
  era: 明嘉靖
  dates_known: true
rejections:
