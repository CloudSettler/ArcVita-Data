category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 庄纶裔
  score: 7
  worth_why: 档主本人，阳湖后劲、莱阳知县，做事流完整可考——六年猛治讼棍，每期讼词由百余纸减至二三十纸；庚子年办邮政局差讹索民财案，讯明擅拿私放、追革惩儆；同年劝禁习拳，以绅士为枢纽使一邑免于拳祸，另有日俄战事运牛中立案等；兼有求治太急之自省，为清末州县循吏治理样本，足资官箴
  era: 清光绪年间
  dates_known: true
- name_zh: 袁世凯
  score: 9
  worth_why: 文中抚宪袁即庚子年山东巡抚，档存其饬令剿办拳匪、保护洋商教士之谕与批办邮政讹诈案札，为其督鲁治拳保境关键决策的第一手佐证；其人小站练兵、督鲁新政、促成清帝退位、终至称帝败亡，做事流完整、名场面多、教训深刻，现库尚缺此人
  era: 清末民国初
  dates_known: true
rejections:
- name_zh: 吴筠孙
  why_not: 仅作序褒扬庄氏并以乡先哲相勖，本人做事流不在此档
- name_zh: 赵实丰
  why_not: 邮政局司事讹索民财一案即被斥革，反面配角无完整做事周期
- name_zh: 姜瑞海
  why_not: 邮局差役，同案从犯，事迹不出一案
- name_zh: 唐宾庆
  why_not: 教民冒充官职诈财案人物，本档仅存案起，始末无考
- name_zh: 刘令
  why_not: 前任县令仅因审案未确被提及，无独立事迹
- name_zh: 抚宪杨
  why_not: 疑为继任鲁抚杨士骧，然档中仅受禀进呈公牍，纯为受文时间坐标
- name_zh: 恽敬
  why_not: 序中仅引恽子居策瑞金为比况，其做事流须另取本人文献，不入本档候选
