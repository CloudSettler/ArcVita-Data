source: 史藏/诏令奏议/历代名臣奏议.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 魏征
  score: 10
  worth_why: 谏太宗十思疏、居安思危、载舟覆舟；以诤臣成贞观之治，历代奏议典范之最
  era: 唐
  dates_known: true
- name_zh: 姜太公（吕尚）
  score: 9
  worth_why: 渭水垂钓遇文王、佐武王牧野灭商、封齐建国；本卷开篇即载丹书敬胜怠者吉之戒；兵家权谋之祖
  era: 商末周初
  dates_known: true
- name_zh: 马援
  score: 9
  worth_why: 老当益壮、马革裹尸；本卷载其评公孙述井底蛙而妄自尊大、择光武谓帝王自有真，为择主决策名场；平陇定越、死后蒙冤可为教训
  era: 东汉初
  dates_known: true
- name_zh: 贾谊
  score: 9
  worth_why: 治安策主众建诸侯而少其力、过秦论警世；弱冠建言而志不得伸，少年政论家典范与遗憾
  era: 西汉文帝朝
  dates_known: true
- name_zh: 晁错
  score: 9
  worth_why: 削藩策与论贵粟疏；忠谋切身、衣朝衣斩于东市，为改革者最沉痛之教训
  era: 西汉文景之世
  dates_known: true
- name_zh: 陆贽
  score: 9
  worth_why: 奉天之难草诏定人心、论两税之弊；唐代奏议第一大家，救时宰相
  era: 中唐
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 庆历新政、先天下之忧而忧后天下之乐而乐；戍边御夏、兴学养士，士大夫楷模
  era: 北宋
  dates_known: true
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法、本朝百年无事札子；变法成败与争议俱在，改革史双重标本
  era: 北宋
  dates_known: true
- name_zh: 岳飞
  score: 9
  worth_why: 郾城大捷、连结河朔、直捣黄龙之志；莫须有冤狱，忠勇与悲剧并具
  era: 南宋初
  dates_known: true
- name_zh: 文天祥
  score: 9
  worth_why: 起兵勤王、出使被执不屈、柴市成仁；正气歌与留取丹心照汗青，末世气节之极
  era: 南宋末
  dates_known: true
- name_zh: 晏婴
  score: 8
  worth_why: 二桃杀三士、踊贵屦贱谏刑、使楚不辱；提要明言书中收晏婴之谏，辞令谋略俱佳
  era: 春秋齐国
  dates_known: true
- name_zh: 欧阳修
  score: 8
  worth_why: 朋党论辩君子有朋、谏垣论列新政；以文章气节主导嘉祐士风
  era: 北宋
  dates_known: true
- name_zh: 耶律楚材
  score: 8
  worth_why: 谏止屠城、立税法存中原、以儒学化骄悍之主；文明存续之功
  era: 蒙元太宗朝
  dates_known: true
- name_zh: 邓禹
  score: 7
  worth_why: 仗策军门进图天下之策、云台首功；本卷载其对光武言古之兴者在德薄厚；西征之败可为教训
  era: 东汉初
  dates_known: true
- name_zh: 钟繇
  score: 7
  worth_why: 楷书之祖，书史开创之功；镇抚关中送马助官渡；本卷存其三不欺之对
  era: 汉魏之际
  dates_known: true
rejections:
- name_zh: 匡衡
  why_not: 本卷仅存戒妃匹一疏；凿壁偷光至拜相有名，然行事见识平平、晚节阿附坐免，暂缓
- name_zh: 华歆
  why_not: 本卷仅三不欺议论一节；割席断交、止战疏诸事别见他书，暂缓
- name_zh: 于谨
  why_not: 三老答问见其老成持重，本卷不载其战功始末，暂缓
- name_zh: 楚惠王
  why_not: 吞蛭示仁一事而已，无做事周期
- name_zh: 魏武侯
  why_not: 仅见问对纳吴起二谏，自身无成事之迹
- name_zh: 费诗
  why_not: 谏先主称尊号一事刚直可取，然一生行事单薄
- name_zh: 贺邵
  why_not: 直谏之节可悯，传文太略
- name_zh: 王坦之
  why_not: 仅存一表，行事周期不全
- name_zh: 爰延
  why_not: 一问一答，仕履简略
- name_zh: 盖勋
  why_not: 谏讲武一言，事迹简略
- name_zh: 长孙平
  why_not: 一谏而已，事迹简略
- name_zh: 鲍叔
  why_not: 知人荐贤可附管仲条内呈现，独立做事流单薄
- name_zh: 师旷
  why_not: 提要明言诸言皆一时答问之语，非奏议行事
- name_zh: 宫之奇
  why_not: 谏假道虽涉唇亡齿寒名论，传文极短
- name_zh: 申公巫臣
  why_not: 本卷仅借述楚庄王忧勤之语，其通吴制楚事不载
- name_zh: 公孙述
  why_not: 割据僭号，徒为马援择主之反衬，作时间坐标
- name_zh: 隋文帝
  why_not: 天下共主低优先，本卷仅存纳谏一事，作时间坐标
- name_zh: 周武帝
  why_not: 天下共主低优先，仅存养老问治一事
- name_zh: 周文王
  why_not: 天下共主低优先，本卷仅答问之语；演易翦商诸事可另据本纪录入
