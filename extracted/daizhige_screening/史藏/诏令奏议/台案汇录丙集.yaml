source: 史藏/诏令奏议/台案汇录丙集.md
category: 史藏/诏令奏议
verdict: no_value
skip_reason: 台案汇录丙集全卷为清代台湾钱粮奏销、蠲免、豁免、报销等例行财政公文，人物仅以署名官职出现，无一人具备缘起、阶段、决定、结果的完整做事周期，亦无成语战役发明级名场面，宜作年代坐标史料而非人物传记来源
rejections:
- name_zh: 乾隆帝
  why_not: 台湾丁银由四钱七分减为二钱、永着为例，及屡次蠲免积欠，皆属例行惠政，君主仅作时间坐标，非商鞅变法级突出做事
- name_zh: 施琅
  why_not: 仅一句追述其昔年倚势霸占澎湖渔行规礼每年一千二百两，属陋规源头之负面侧记，其靖台渡海做事流须另据清史稿施琅传录入
- name_zh: 郝玉麟
  why_not: 禁革澎湖渔行陋规系奉上谕宣旨施行并酌拨公用银五百两，自始至终奉旨行事，无独立决策周期
- name_zh: 觉罗柏修
  why_not: 奏革台湾供粟每石摊派盖仓修仓银之陋规并陈仓储定规之策，仅得该部议奏朱批而无施行结果，做事流不完整
- name_zh: 王郡
  why_not: 仅以水师提督衙门哨巡操赏公用无着咨请拨补银两，例行请款公事
- name_zh: 许良彬
  why_not: 仅一句述其到任后将澎湖渔例规礼奏请归公，无做事周期可言
- name_zh: 陈大受
  why_not: 仅见福建巡抚任内兵马钱粮奏销查核之署名，例行报销公文
- name_zh: 福建巡抚卢
  why_not: 仅转呈台郡士民叩谢丁银减则之揭帖代题以达舆情，例行情节
- name_zh: 汪志伊
  why_not: 仅嘉庆年间台属地丁钱粮奏销题本署名，无事迹
- name_zh: 阿林保
  why_not: 仅台澎各营官庄租息及盐埕饷银奏销题本署名，无事迹
