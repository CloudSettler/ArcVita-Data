candidates:
- name_zh: 施琅
  score: 9
  worth_why: 本卷以其题疏为台湾经制之源——议设府县佐杂、于闽省选员调补、官兵抽调驻防、三年俸满升转皆由其奏而立；史载澎湖受降、上疏力请留台设治，平台一役与弃留之争皆名场面，做事流完整
  era: 清初
  dates_known: true
- name_zh: 王郡
  score: 7
  worth_why: 台湾总兵任内奏改武职二年俸满候升，痛陈台兵无搬眷之例、参将以下无丁忧、父母事故难归之实情，部议允行；历官福建水师提督、陆路提督，并平台湾吴福生之乱，做事流完整
  era: 清雍正乾隆间
  dates_known: true
- name_zh: 郝玉麟
  score: 6
  worth_why: 雍正十年奏请台地文武升转年限画一，府厅县二年俸满、协办半年即回内地候升，得朱批允行，为海疆吏治制度化关键一环
  era: 清雍正间
  dates_known: true
- name_zh: 方维甸
  score: 6
  worth_why: 本集目录存其台地奏议；史上巡台奏请噶玛兰收入版图、设厅置官，宜兰纳入王朝治理自此始，制度创设名场面
  era: 清嘉庆间
  dates_known: true
- name_zh: 诺穆布
  score: 5
  worth_why: 巡台御史任内奏请台湾武职援文员例一体升转，直指班兵升途偏枯，乾隆三年下部议行
  era: 清乾隆初
  dates_known: true
- name_zh: 黄国材
  score: 5
  worth_why: 雍正元年奏请调台文官免引见、不论有无参罚俱准调补，破海外选官滞碍；折中对台员远隔重洋、内顾之忧的观察颇具史料价值
  era: 清雍正初
  dates_known: true
- name_zh: 赵慎畛
  score: 5
  worth_why: 本集目录存其台地奏议；任闽浙总督整饬台湾营伍吏治，道光初治台名疆吏，宜据全奏与本传细考其做事流
  era: 清嘉庆道光间
  dates_known: true
- name_zh: 孙尔准
  score: 5
  worth_why: 本集目录存其台地奏议；任闽浙总督当台湾分类械斗频仍之世，奏议城汛营务，卒于任上，可据本传补足其治台周期
  era: 清道光间
  dates_known: true
