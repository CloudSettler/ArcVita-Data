candidates:
- name_zh: 福康安
  score: 9
  worth_why: 名场面为渡海平定林爽文之乱、解嘉义之围、生擒首逆；随后于乾隆五十三年仿四川屯练之例创设台湾番屯制度——挑熟番屯丁四千名分十二屯、择番社素所信服之目如潘明慈之类充屯弁、拨界外埔地八千八百余甲以地代饷并免其纳赋、清查已垦埔地立石定界，缘起（熟番随官军打仗杀贼出力）、关键决策（以屯代戍、以地代饷、恩威并用）、推行（屯租屯饷清册接续有据）、结果（章程核准报部存案）做事流完整，抚绥与防奸之策可为后人借镜；生于乾隆十九年卒于嘉庆元年，追封嘉勇郡王，年代可考
  era: 乾隆年间（清中期）
  dates_known: true
- name_zh: 觉罗伍拉纳
  score: 5
  worth_why: 闽浙总督任内于乾隆五十五年奏报带领台湾生番头目进京起程，可作番屯善后之时间坐标；史载其任内贪纵、后坐罪伏法，惟其败亡不载于本集，做事流仅存一折，暂缓
  era: 乾隆年间（清中期）
  dates_known: true
