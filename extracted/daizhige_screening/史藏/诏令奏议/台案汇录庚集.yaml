source: 史藏/诏令奏议/台案汇录庚集.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 福康安
  score: 9
  worth_why: 受命佩钦差关防渡海督办台湾军务，攻克斗六门、擒林爽文、捕庄大田，事毕清查台湾筹办善后，赏紫缰——受任、攻坚、擒渠、善后、受赏全链完整，为乾隆平台之役收官者
  era: 清乾隆年间
  dates_known: true
- name_zh: 柴大纪
  score: 8
  worth_why: 死守诸罗孤城数月，封一等义勇伯、赐巴图鲁名号，县城因之义感改名嘉义；旋遭李侍尧等参劾，革职交福康安严审，由极致殊荣到弃世，宠辱一线，警示意义极强
  era: 清乾隆年间
  dates_known: true
- name_zh: 林爽文
  score: 7
  worth_why: 天地会起事、席卷台湾南北、历时年余、终被福康安擒获凌迟处死，完整成败周期，清代台湾最大民变，教训典型
  era: 清乾隆年间
  dates_known: true
rejections:
- name_zh: 常青
  why_not: 督师久无进展旋被更换，撤花翎革职，移会中只见荣枯片段，做事流不完整
- name_zh: 黄仕简
  why_not: 心存观望、办理迟延，仅见申饬、革职、监禁、宽免勾决等结局节点，无完整做事周期
- name_zh: 任承恩
  why_not: 鹿港登岸后无进兵确信，革职监禁，事迹不足以成轴
- name_zh: 郝壮猷
  why_not: 凤山既得复失即正法，篇幅短无周期
- name_zh: 蓝元枚
  why_not: 调补水师提督旋即病故军营，仅作时间坐标
- name_zh: 李侍尧
  why_not: 转运粮饷奏报琐务且交部严加议处，后勤配角事迹简略，缓录
- name_zh: 庄大田
  why_not: 仅见被擒结局与家属缘坐，起事经过本文未详
- name_zh: 蔡攀龙
  why_not: 嘉奖升补片段，缺完整做事流
- name_zh: 普吉保
  why_not: 收复笨港一役议叙外余事不足成轴
- name_zh: 徐嗣曾
  why_not: 仅见查办参奏柴大纪诸款，查案角色无独立做事周期
- name_zh: 许世亨
  why_not: 仅题报起程统黔兵，未见后续事迹
- name_zh: 鄂辉
  why_not: 仅议叙劳绩一节点，事迹单薄
- name_zh: 舒亮
  why_not: 仅议叙劳绩一节点，事迹单薄
