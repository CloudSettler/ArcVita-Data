source: 史藏/诏令奏议/台案汇录甲集.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 福康安
  score: 8
  worth_why: 平定台湾林爽文之乱后奏设屯丁屯所，计丁授地、以番治番，为清代台湾番屯制度奠基；乾隆朝名将，制度诞生点明确，做事流完整
  era: 清乾隆
  dates_known: true
- name_zh: 杨廷理
  score: 6
  worth_why: 以台湾知府奉委清查屯地、造册拟章，本卷核心承办者；其后三任台郡守、首倡开垦蛤仔难（宜兰），治台事功前后连贯
  era: 清乾隆至嘉庆
  dates_known: true
- name_zh: 伍拉纳
  score: 5
  worth_why: 闽浙总督任内主持筹议台湾屯所分拨埔地，奏章条陈周密；后以福建库帑亏空、吏治废弛伏诛，可作吏治警示，惟本卷仅见其一面
  era: 清乾隆
  dates_known: true
rejections:
- name_zh: 潘明慈
  why_not: 熟番头目补授屯千总，仅见授职与分辖名单，无独立做事周期
- name_zh: 斗生
  why_not: 与潘明慈同为番目补官，仅名单记载
- name_zh: 徐梦麟
  why_not: 泉州知府奉委清丈屯地，系承办属吏，事迹散见公文，不成完整做事流
- name_zh: 黄嘉训
  why_not: 理番同知仅奉委查办一笔带过
- name_zh: 富纲
  why_not: 仅追述其奏请清丈一句，无做事周期
- name_zh: 翁云宽
  why_not: 仅因其名下入官埔地被拨给屯丁而提及，无生平事迹
- name_zh: 杨光勋
  why_not: 同为叛产抄没来源人物，无事迹可录
