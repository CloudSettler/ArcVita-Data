category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 林爽文
  score: 7
  worth_why: 册中乾隆五十二至五十四年连篇奏报皆系此役；天地会起事，攻彰化称盟主建号顺天，南北呼应围诸罗半年，兵败被俘凌迟。乾隆间台湾最大民变，做事流完整，可为官逼民反与治台得失之鉴
  era: 清乾隆年间
  dates_known: true
- name_zh: 福康安
  score: 6
  worth_why: 受命渡台统帅诸军，解嘉义之围，破大里杙擒林爽文，南平庄大田，奏请台湾屯田募伍整顿善后；月余定乱，为其一生军功之代表段落
  era: 清乾隆年间
  dates_known: true
- name_zh: 柴大纪
  score: 6
  worth_why: 孤守诸罗半年，粮尽援绝民不降，乾隆改诸罗县为嘉义县以旌其守，封一等义勇伯；事平后反遭劾论斩，功高遭忌、庙堂倾轧之典型教训
  era: 清乾隆年间
  dates_known: true
- name_zh: 蔡牵
  score: 6
  worth_why: 起于闽粤洋面纵横十余年，两犯台湾，占鹿耳门凤山称镇海王，清廷大举海防数年，终败自沉其舟；册中嘉庆八年至十年特交奏报可证，海上势力兴亡做事流完整
  era: 清嘉庆年间
  dates_known: true
rejections:
- name_zh: 庄大田
  why_not: 南路会首，事迹附丽于林爽文事件，无独立完整做事周期
- name_zh: 陈周全
  why_not: 乾隆六十年三月起事旋败，册中仅零星题奏，事迹简略
- name_zh: 黄教
  why_not: 乾隆三十三年冈山起事数月即平，册载简略，无成流之做事周期
- name_zh: 李长庚
  why_not: 剿蔡牵全程详载他档，本册仅零星缉捕奏报，不足以成事流
- name_zh: 乾隆帝
  why_not: 君主低优先，于本册仅为批谕与人事调度之时间坐标，无特出做事
