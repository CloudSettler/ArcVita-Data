candidates:
- name_zh: 刘基
  score: 9
  worth_why: 弃方国珍句践自守之业、决计趋金陵；陈时务十八款；拒拜小明王定天命之议；先伐陈友谅后取张士诚定征伐次序；彭蠡湖密移军湖口决胜负；三评相才断杨宪汪广洋胡惟庸皆验；太祖称吾之子房；著郁离子
  era: 元末明初
  dates_known: true
- name_zh: 解缙
  score: 7
  worth_why: 大庖西上封事万言直谏为谏诤名篇；后主纂永乐大典成一代文治巨典；起落完整可为后人镜鉴
  era: 明初
  dates_known: true
- name_zh: 陶安
  score: 7
  worth_why: 渡江迎附断龙姿凤质之识；首献取金陵据形胜以临四方之策，为明开国战略基点；任翰林掌制诰
  era: 元末明初
  dates_known: true
- name_zh: 王祎
  score: 6
  worth_why: 法天顺人疏论君德忠厚寛大、祈天永命之道；通儒能文，后使云南殉节，本录仅存一疏故缓
  era: 元末明初
  dates_known: true
- name_zh: 桂彦良
  score: 6
  worth_why: 上太平治要十二策系统献策，法天广地利顺人心开经筵驭戎狄诸目可考其治术；有江南大儒之称
  era: 明初
  dates_known: true
