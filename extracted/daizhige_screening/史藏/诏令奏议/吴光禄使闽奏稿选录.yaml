source: 史藏/诏令奏议/吴光禄使闽奏稿选录.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 吴赞诚
  score: 7
  worth_why: 本折集主人；光绪三年力疾奉旨接办台防兼理船政，亲勘台湾后山，于大猫狸等急溪首创生番藤编悬桥数十丈渡溪，开恒春至卑南路，剿抚后山番社、布局抚垦、裁并营勇，为官方详勘台东之始；后病重迭折辞任，力疾从公至卒，做事流完整且堪称殉职典范
  era: 晚清光绪
  dates_known: true
- name_zh: 丁日昌
  score: 7
  worth_why: 抚台期间全力经营台防，奏明变通后山办理，调吴光亮移驻璞石阁中控驭，开台东抚垦之局；近代洋务与海防骨干，其海防条陈为海权先声；本折见其病中仍一手经理之态
  era: 晚清同治光绪
  dates_known: true
- name_zh: 李鸿章
  score: 8
  worth_why: 洋务与海防总枢纽；本折见其购置炮铁船、核定教习炮勇去留、归并龙骧虎威等船一处操练之决策，购舰练军章程一以贯之，可成海军建军完整做事流
  era: 晚清
  dates_known: true
- name_zh: 李凤苞
  score: 6
  worth_why: 出洋监督率船政学生赴欧，抵法即校定千七百匹马力巡海快船图式赶寄仿制，开近代舰船定制外购之先；后购定远镇远诸舰
  era: 晚清光绪
  dates_known: true
rejections:
- name_zh: 吴光亮
  why_not: 统军进驻后山仅附见诸折，无完整做事周期与独立名场面
- name_zh: 周有基
  why_not: 开路凿石仅零散附见，事迹简略不成做事流
- name_zh: 吴仲翔
  why_not: 船政提调代拆代行，无独立事业可考
- name_zh: 何璟
  why_not: 闽督仅会商列衔，无做事可录
- name_zh: 袁闻柝
  why_not: 缘溪开路数语附见，不足以立传
