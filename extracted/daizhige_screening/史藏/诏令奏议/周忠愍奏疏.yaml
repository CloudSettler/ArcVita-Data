source: 史藏/诏令奏议/周忠愍奏疏.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 周起元
  score: 8
  worth_why: 万历辛丑进士，官至右佥都御史巡抚江南；有完整做事周期——擢湖广道御史巡漕上西台奏疏十一首、巡抚江南上抚吴奏疏十九首，建言抗疏有关国计民生（漕运转运、灾年改折、纠铨臣擅权、谏矿税蔽明）；天启间忤魏忠贤阉党被逮遇害，追赠兵部侍郎谥忠愍再谥忠惠，民间建祠崇祀，是东林气节之典范与阉党之祸的见证
  era: 晚明万历至天启
  dates_known: true
rejections:
- name_zh: 徐兆魁
  why_not: 仅作为被弹劾的对手出现，攻东林倡伪学之诋，无独立做事周期
- name_zh: 赵焕
  why_not: 仅作为植党擅权被纠劾的吏部尚书提及，事迹零星不成做事流
- name_zh: 罗汝芳
  why_not: 仅被引为受诋之儒以证名教，本文献无其做事细节
- name_zh: 杨起元
  why_not: 仅于请谥册引文中提及师承罗汝芳，无做事周期
