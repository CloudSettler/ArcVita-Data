- name_zh: 唐太宗
  score: 10
  worth_why: 武德九年即位册文存于本卷；玄武门定鼎、贞观之治、灭东突厥受尊天可汗，君主中做事流最完整，制度文章为唐三百年代价
  era: 初唐
  dates_known: true
- name_zh: 唐宪宗
  score: 8
  worth_why: 元和中兴、任裴度平淮西淄青削藩；卷内即位册文并涉其朝改制故事
  era: 中唐
  dates_known: true
- name_zh: 裴度
  score: 8
  worth_why: 督师平淮西擒吴元济；提要特载其请改令狐楚所草制语、宪宗从之，君臣改文始末可考；又为文宗即位奉册正使
  era: 中唐
  dates_known: true
- name_zh: 李光弼
  score: 8
  worth_why: 安史之乱中兴第一名将，太原固守、河阳之战与郭子仪齐名；提要存兵马副元帅制目
  era: 盛唐
  dates_known: true
- name_zh: 颜真卿
  score: 8
  worth_why: 平原首义抗安史叛军、祭侄文稿千古书翰、李希烈军中骂贼殉国；提要存赠司徒诏目
  era: 盛唐
  dates_known: true
- name_zh: 张说
  score: 7
  worth_why: 开元名相、促成封禅泰山、一代文宗大手笔；提要存赠太师诏目
  era: 盛唐
  dates_known: true
- name_zh: 杜佑
  score: 7
  worth_why: 三十年成通典开创典制体通史、长于理财；卷内为宪宗即位奉册正使
  era: 中唐
  dates_known: true
- name_zh: 宋敏求
  score: 7
  worth_why: 本集编者，续父遗稿定为三十类一百三十卷、熙宁三年自序；又封还李定词头忤权解职，编书与直臣两段做事流俱见篇中
  era: 北宋
  dates_known: true
- name_zh: 唐宣宗
  score: 7
  worth_why: 大中之治号小太宗、收河湟；卷内会昌六年册文载以皇太叔入承大统之变局
  era: 晚唐
  dates_known: true
- name_zh: 唐文宗
  score: 6
  worth_why: 即位册文自述躬率义勇清弑逆；后谋诛宦官酿甘露之变、受制家奴幽愤而终，深可警世
  era: 晚唐
  dates_known: true
- name_zh: 唐肃宗
  score: 6
  worth_why: 天宝十五载当乱受命即位、收复两京；卷内即位册文为安史之乱转折坐标，亦开宦官典兵之弊
  era: 盛唐
  dates_known: true
- name_zh: 唐德宗
  score: 6
  worth_why: 削藩激泾原兵变、出逃奉天下罪己诏转姑息；卷内即位册文为建中削藩起点，教训典型
  era: 中唐
  dates_known: true
- name_zh: 李绛
  score: 6
