  era: 中唐
  dates_known: true
- name_zh: 牛僧孺
  score: 5
  worth_why: 牛李党争牛党领袖、三度拜相；卷内为敬宗即位奉册者，党争教训可采
  era: 中唐
  dates_known: true
- name_zh: 令狐楚
  score: 5
