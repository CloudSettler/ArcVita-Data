category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 商辂
  score: 9
  worth_why: 明代首例三元及第；景泰朝参赞军务、清理塞上军田、招辑流民，成化朝复起官至内阁首辅；所上招抚流移、边务屯田、减省官员诸疏各有缘起、对策、施行步骤与预期结果，政策周期完整；率阁臣弹劾汪直致西厂罢革，终以直道不容致仕归里，堪称直臣典范
  era: 明代宗景泰至明宪宗成化年间
  dates_known: true
rejections:
- name_zh: 汪直
  why_not: 仅于提要中作为被弹劾对象提及，本卷无其做事流细节，宜另行据明史汪直传评估
- name_zh: 林聪
  why_not: 用贤疏中仅数句考语褒扬其学识操持，事迹未展开
- name_zh: 方瑛
  why_not: 减省官员疏中顺带提及统兵镇守贵州，无独立做事周期
- name_zh: 陈豫
  why_not: 仅提及奉命镇守临清筑城设卫，随即议撤，流于官职记载
