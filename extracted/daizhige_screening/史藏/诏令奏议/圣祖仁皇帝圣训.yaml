- name_zh: 康熙帝
  score: 10
  worth_why: 圣训六十卷三十二类一千九百余则皆其六十一年施政原声——少年定计擒鳌拜、平三藩、收台湾设府、三征噶尔丹、尼布楚定界、治河治漕、蠲免天下钱粮、开博学鸿词纂修字典明史，缘起阶段关键决策与结果俱全，武功文教名场面兼备，属君主中秦始皇级之例外，必录
  era: 清代康熙朝
  dates_known: true
- name_zh: 施琅
  score: 8
  worth_why: 武功诸卷所涉之康熙二十二年专征澎湖克台湾，力主留台设郡而不弃，一役定东南海疆，为广幅员之关键决策点，做事流与名场面俱足
  era: 清初
  dates_known: true
- name_zh: 靳辅
