  why_not: 仅修清宁宫越级升职遭谏一事，事迹单薄
- name_zh: 华昶
  why_not: 仅劾程敏政卖题一举，无完整周期
- name_zh: 魏玒
  why_not: 仅因问狱下镇抚司被打、病困待释一事，非做事主体
- name_zh: 徐经
  why_not: 仅科场案中被鞫输服一句
- name_zh: 孙桢
