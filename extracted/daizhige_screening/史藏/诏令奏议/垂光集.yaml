verdict: has_candidates
candidates:
- name_zh: 周玺
  score: 8
  worth_why: 弘治丙辰进士，官礼科都给事中，历上论贡举、罢兴作、释无辜、重名器、惩欺罔等疏，直陈时弊；正德朝劾刘瑾，二疏直气坌涌，先致家书明许国忘家之志，竟被构毙于廷杖；瑾败后昭雪复官，可谓食其禄不避其难的言官典范
  era: 明弘治正德间
  dates_known: true
- name_zh: 刘瑾
  score: 6
  worth_why: 权阉乱政之教训典型；本集载其构陷周玺致杖毙、瑾败后冤狱得雪之结局，其专权败亡全周期须参明史本传补足
  era: 明正德间
  dates_known: true
- name_zh: 程敏政
  score: 5
  worth_why: 弘治十二年会试卖题案主角，被华昶劾奏、鞫问输服后恃狡阴结权贵自辩，牵连言官下狱，为科场名案；本集仅存一疏视角，做事流简略
  era: 明弘治间
  dates_known: true
rejections:
