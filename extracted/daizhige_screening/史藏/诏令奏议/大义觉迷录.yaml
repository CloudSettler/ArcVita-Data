category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 吕留良
  score: 8
  worth_why: 拒仕新朝、评选时文传布华夷之辨，身后酿成清代文字狱之巅——剖棺戮尸、子孙流放；思想由吕传严鸿逵、曾静层层发酵，是「著述之祸」与思想传承链的完整标本
  era: 明末清初
  dates_known: true
- name_zh: 雍正帝
  score: 8
  worth_why: 不以刀斧而以辩书：亲撰上谕逐条驳华夷之辨，赦曾静而令其持《大义觉迷录》赴江浙宣讲，颁书天下学宫——帝王与逆犯公开论理并制度化的罕例；乾隆即位即收书杀曾静，构成父子政策反转的深刻教训
  era: 清代
  dates_known: true
- name_zh: 曾静
  score: 7
  worth_why: 做事周期极完整且教训满分：读吕留良遗书而生反志，遣徒张熙策反岳钟琪，案发入京亲聆天音而幡然归化，奉旨宣讲逆书转为宣传工具，乾隆朝终被凌迟——一念之起至身死族灭的全链警示
  era: 清雍正朝
  dates_known: true
- name_zh: 岳钟琪
  score: 7
  worth_why: 岳飞后裔而仕清，被投书策反即密奏告发以自明，平青海、督川陕、坐罪下狱、复起用兵金川，忠疑之间的沉浮是清代汉臣处境的完整样本
  era: 清雍正乾隆朝
  dates_known: true
