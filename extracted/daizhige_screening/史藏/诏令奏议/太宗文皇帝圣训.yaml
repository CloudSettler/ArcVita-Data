  worth_why: 收服朝鲜统一蒙古、改国号大清，做事流完整；敕纂辽宋金元四史以资治道、停译野史；力主以力服人不如令人中心悦服，收蒙古诸部人心；斥空言取誉、养穷困恤民、训诸王骑射勤政，谟训垂为制度
  era: 明末清初（后金至清）
  dates_known: true
- name_zh: 努尔哈赤
