candidates:
- name_zh: 努尔哈赤
  score: 10
  worth_why: 以十三遗甲起兵开基；癸巳年古勒山之战以逸待劳、诱敌险隘，大破叶赫哈达乌喇辉发科尔沁等九姓联军；癸丑年亲征乌喇大破布占泰三万之众灭其国；天命三年颁训练兵法之书，倡「不劳兵力而克敌」之智巧谋略并定牛录云梯攻城之制；建元天命征明取抚顺清河开原铁岭，迁都辽阳安葬二祖——起兵、统一、建制、伐明、迁都的完整做事流俱全，篇中二十六门训谕兼见其治道、用人、军略，以少胜多可为后世法
  era: 明末后金开国（天命年间）
  dates_known: true
- name_zh: 康熙帝
  score: 7
  worth_why: 康熙二十五年恭编太祖圣训，分二十六门九十二则勒为家法，本篇存其编辑决策与御制序；其生平除鳌拜、平三藩、收台湾、三征噶尔丹之做事流史有明载，属做事流较完整之君主
  era: 清初康熙年间
  dates_known: true
