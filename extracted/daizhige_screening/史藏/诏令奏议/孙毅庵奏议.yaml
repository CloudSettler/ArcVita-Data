source: 史藏/诏令奏议/孙毅庵奏议.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 孙懋
  score: 8
  worth_why: 正德朝谏官典型，做事流完整——屡疏直陈劾太监于喜、史宣，疏保杨廷和终丧以崇纲常，请急定平宸濠功赏、请还京、陈边警至千余言；劾权幸江彬时人皆为懋危而其奋不顾身，言不见用则自劾乞罢，四库提要称其遗直，足为言官楷模
  era: 明正德年间
  dates_known: true
rejections:
- name_zh: 明武宗朱厚照
  why_not: 君主仅作时间坐标，本集只见其嬖幸用事、章疏留中，无变法级突出做事
- name_zh: 杨廷和
  why_not: 本集仅涉夺情起复一疏，其辅政迎立等完整做事周期不见于本文
- name_zh: 江彬
  why_not: 仅作为被劾对象出现，其得宠乱政始末未详载
- name_zh: 于喜
  why_not: 镇守太监，仅见烧荒失事与报复构陷张经一事，无完整做事周期
- name_zh: 史宣
  why_not: 织造太监，仅见沿途索贿凌辱官吏劣迹，属被纠劾之恶而无做事流
- name_zh: 崔珤
  why_not: 市舶太监，仅见纵恶构陷知府一事
- name_zh: 张经
  why_not: 正德朝御史，仅见劾太监反被诬一事，与嘉靖抗倭之张经恐非一人
- name_zh: 翟唐
  why_not: 宁波知府，仅见勘问不法被构一事
- name_zh: 王恕
  why_not: 仅作宪庙朝劾王敬旧例一笔带过，非本文献主体
- name_zh: 朱勔
  why_not: 宋人，仅借花石纲致靖康之祸作引喻，非文献主体
