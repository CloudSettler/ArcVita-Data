source: 史藏/诏令奏议/安南奏议.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 张经
  score: 8
  worth_why: 即本奏议中提督两广之蔡经（初冒蔡姓，安南论功后复张姓）；先主持征讨安南三十万水陆兵粮之统筹调度，后总督东南抗倭，王江泾大捷为东南战功第一，旋遭赵文华构陷冤死，做事流完整且教训深刻
  era: 明正德至嘉靖
  dates_known: true
- name_zh: 毛伯温
  score: 8
  worth_why: 嘉靖南征安南统帅，主导兵粮筹划与抚剿并用，终不烦大战而莫登庸出关请降、安南改置都统司，不战而屈人之兵；有王阳明赠诗大将南征胆气豪传世
  era: 明正德至嘉靖
  dates_known: true
- name_zh: 莫登庸
  score: 7
  worth_why: 黎氏宿将篡位建莫朝，伪造书印、僭拟名号，明大军压境时通使乞降、自缚出关请罪，受封都统使以屈存国祚；篡逆不义与识势保命两面皆可垂鉴
  era: 明正德至嘉靖（安南）
  dates_known: true
- name_zh: 翁万达
  score: 7
  worth_why: 本奏议会议列名要员，此为其起家做事节点；后总督宣大，修边墙、缮城堡、练士卒，俺答不敢南犯，嘉靖边功名臣、岭南第一名臣
  era: 明嘉靖
  dates_known: true
- name_zh: 沈希仪
  score: 7
  worth_why: 明史称其用兵能先算多奇中，本议中主动密遣百户骆玉潜探交趾虚实险易；一生镇粤西征瑶、奇正相生，后复参与御倭
  era: 明正德至嘉靖
  dates_known: true
