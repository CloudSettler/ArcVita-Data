verdict: has_candidates
candidates:
- name_zh: 刘安世
  score: 9
  worth_why: 号殿上虎尽言不讳；师司马光得诚字功夫以不妄语为求诚之始；弹蔡确章惇各十一二上论胡宗愈至二十一疏；贬新英诸州瘴疠十余年全躯而归；苏轼称真铁汉
  era: 北宋哲宗至徽宗朝
  dates_known: true
- name_zh: 司马光
  score: 9
  worth_why: 撰资治通鉴十九年成不朽巨著；元祐更化尽废新法；以诚字授刘安世为尽心行己之要；砸缸成语家喻户晓
  era: 北宋仁宗至哲宗朝
  dates_known: true
- name_zh: 苏轼
  score: 9
  worth_why: 诗词文赋为宋代之巅；乌台诗案九死一生；知杭州筑苏堤治西湖；本文记其评刘安世为真铁汉
  era: 北宋仁宗至徽宗朝
  dates_known: true
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法行青苗免役市易诸新法；以三不足之说力排众议；变法成败俱为后世至大之鉴
  era: 北宋仁宗至哲宗朝
  dates_known: true
- name_zh: 朱熹
  score: 9
  worth_why: 集理学之大成建白鹿洞书院；创社仓法救荒；编名臣言行录采王安石吕惠卿而不录安世；庆元党禁中气节不堕
  era: 南宋高宗至宁宗朝
  dates_known: true
- name_zh: 章惇
  score: 7
  worth_why: 绍圣绍述尽复新法；穷贬元祐党人至死不休；本文中刘安世弹章十一二上之对象；其强横亦成反面之鉴
  era: 北宋哲宗朝
  dates_known: true
- name_zh: 蔡京
  score: 7
  worth_why: 书法自成一家；四度为相立元祐党人碑兴花石纲；崇宁兴学行三舍法；靖康之祸源头之一教训深刻
  era: 北宋徽宗朝
  dates_known: true
- name_zh: 蔡确
  score: 6
  worth_why: 车盖亭诗案遭贬新州身死；新旧党争标志性事件；本文中刘安世十二上弹章务欲置之死地之对象
  era: 北宋神宗哲宗朝
  dates_known: true
