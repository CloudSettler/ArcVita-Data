source: 史藏/诏令奏议/岭海焚余.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 金堡
  score: 9
  worth_why: 南明直臣典范；起兵余杭复城擒伪、千里赴阙极谏请亲征，中兴大计疏与时政八失疏成体系，弹劾不避权贵几遭死地；国亡后祝发为僧抗志以终。缘起、决策、抗争、守节全周期可考，兼李成栋叹朝廷尚有此人一段名场面
  era: 明末南明（崇祯至永历间）
  dates_known: true
- name_zh: 郑遵谦
  score: 8
  worth_why: 浙东首义关键人物；斩彭万里张愫、缚降官、毁家纾难五百金赡军，发兵扼江力拒清师、先保江东后拥鲁藩，为全浙屏障；功高而遭忌需讼功自明，做事流较完整且有忠而见谤之教训
  era: 明末清初（弘光至鲁监国间）
  dates_known: false
- name_zh: 姚志卓
  score: 6
  worth_why: 与金堡起兵余杭复城擒伪，孤军无援犹潜师富阳合兵再进，有众七千屯临安勇而知义，可作义军时间轴补充
  era: 明末清初
  dates_known: false
- name_zh: 金有镒
  score: 5
  worth_why: 杀妻子而兴师、战虏三捷威名颇著，事迹仅一句故暂缓
  era: 明末清初
  dates_known: false
