category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 左宗棠
  score: 10
  worth_why: 奉旨接办闽浙军务即裁汰冗营、参劾贻误之将、奏调良将渡台平乱，做事流环环相扣；中法战争晚年挂帅督办福建军务，派营渡台援应，沪尾既捷力筹规复基隆，密陈要盟宜慎、防兵难撤，并请拓增船炮大厂以图久远，海防与洋务决策俱全；另有平定陕甘、规复新疆、创办福州船政局诸大成事儿，功成而卒于督师任上，堪称成事儿典范
  era: 晚清
  dates_known: true
- name_zh: 林文察
  score: 6
  worth_why: 籍隶台湾内山、素称能战，奉调渡台号召旧部统军平台乱，其后战殁于漳州之役；本牍仅见荐调之议，做事流未全，暂缓
  era: 晚清
  dates_known: true
rejections:
- name_zh: 吴鸿源
  why_not: 顿兵南靖庄数月致粤勇哗溃、革职拿问，仅败绩一事，实为左宗棠整军之注脚
- name_zh: 耆龄
  why_not: 仅奉旨移交闽浙防务，无独立做事周期
- name_zh: 曾玉明
  why_not: 传中仅言未能得力一语，事迹简略
- name_zh: 徐宗干
  why_not: 仅会衔具奏，无独立做事流
