category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 张勇
  score: 8
  worth_why: 兵间四十余年，起偏裨至靖逆侯；顺治间平河西回乱、生擒丁国栋，御昂汉蒙古于金塔寺，康熙间力抗王辅臣之乱，箭创病足犹肩舆督师十年，卒于甘州军营犹上遗疏防麦力干，做事周期完整，且识拔王进宝赵良栋可为知人善任之范
  era: 清初顺治康熙间
  dates_known: true
- name_zh: 赵良栋
  score: 7
  worth_why: 由张勇麾下偏裨起为名将，三藩之乱中平宁夏、进取四川，将略做事流可考
  era: 清初
  dates_known: true
- name_zh: 王进宝
  score: 7
  worth_why: 同出张勇偏裨，河西平乱保陇有功，与赵良栋并称名将，周期可考
  era: 清初
  dates_known: true
- name_zh: 孟乔芳
  score: 6
  worth_why: 川陕总督抚定陇右、分兵讨叛，力荐张勇实授总镇；本集仅存其题疏，事迹偏简宜缓录
  era: 清初
  dates_known: true
rejections:
- name_zh: 米喇印
  why_not: 回乱首逆仅存起兵于巩昌城下授首一节，无完整做事周期
- name_zh: 丁国栋
  why_not: 负隅肃州旋即被擒诛，只作张勇破贼之事件坐标
- name_zh: 王辅臣
  why_not: 仅见于提要一句，其乱始末须别据专传方可录
- name_zh: 姜瓖
  why_not: 大同叛变仅一笔带过，无可录事迹
- name_zh: 张云翼
  why_not: 仅以辑集其父遗疏之编者身份出现，无独立做事流
