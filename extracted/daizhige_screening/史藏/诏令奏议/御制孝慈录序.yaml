  why_not: 仅居冯太后丧五日不食哀毁过礼一事
- name_zh: 晋武帝
  why_not: 仅居太后丧遵古礼及议皇太子释服两条引文
- name_zh: 翟方进
  why_not: 仅丧母三十六日除服视事一条，事简无周期
