  why_not: 仅欲短丧遭孟子非之一语
- name_zh: 宋太祖
  why_not: 仅丧母以日易月二十七日释服一条
- name_zh: 鲁昭公
  why_not: 仅为母夫人服三年一条，做事流不可考
