candidates:
- name_zh: 朱元璋
  score: 9
  worth_why: 洪武七年贵妃薨，命翰林稽古典定丧仪；斥迂儒父在为母期年、庶母无服之旧说，敕遍考古今论母丧服四十二家，终立定制子为父母斩衰三年、庶母齐衰杖期，颁《孝慈录》，为朝廷统一颁布丧服制度之诞生点；缘起、争议、决策、颁行俱全，见其不泥古而审势宜民、以孝治天下之施政风格
  era: 明洪武
  dates_known: true
