source: 史藏/诏令奏议/御选明臣奏议.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 于谦
  score: 10
  worth_why: 土木之变后力排南迁、立景帝、北京保卫战力挽狂澜；夺门之变后蒙冤弃市，《石灰吟》留千古；救时名相兼忠烈教训双重样本
  era: 明正统至景泰
  dates_known: true
- name_zh: 杨涟
  score: 9
  worth_why: 上疏劾魏忠贤二十四大罪，诏狱酷刑不屈、血书明志而死；东林气节标杆与阉祸之鉴
  era: 明万历至天启
  dates_known: true
- name_zh: 左光斗
  score: 9
  worth_why: 兴畿辅屯田、劾魏忠贤致诏狱遇害；史可法探监见其面额焦烂一段为千古名场面
  era: 明万历至天启
  dates_known: true
- name_zh: 熊廷弼
  score: 9
  worth_why: 三度经略辽东、定守而后战；与王化贞经抚不和致广宁失陷、传首九边，才略与体制冲突的典型教训
  era: 明万历至天启
  dates_known: true
- name_zh: 杨廷和
  score: 9
  worth_why: 武宗暴崩无嗣，总政四十日除江彬、草遗诏、拥立世宗并裁汰冗兵冗员；大礼议冲撞帝意削籍，权臣善始难善终
  era: 明正德至嘉靖
  dates_known: true
- name_zh: 杨一清
  score: 8
  worth_why: 夜说张永计除刘瑾为决策典范；总制三边、花马池筑边墙；晚年再起再罢忧愤卒，边才冠绝一时
  era: 明成化至嘉靖
  dates_known: true
- name_zh: 李东阳
  score: 8
  worth_why: 刘瑾乱政时独留内阁，忍骂名周旋保全善类、密遏暴政；伴食宰执的隐忍路线兼茶陵派宗主
  era: 明弘治至正德
  dates_known: true
- name_zh: 杨士奇
  score: 8
  worth_why: 历仕五朝、三杨之首，辅成仁宣之治；晚年纵子作恶忧愤病卒，贤相晚节之憾可资教训
  era: 明永乐至正统
  dates_known: true
- name_zh: 解缙
  score: 8
  worth_why: 大庖西室封事万言直谏震动朝野；主纂《永乐大典》；议储获罪醉埋雪中而死，才高寡谋的极端样本
  era: 明洪武至永乐
  dates_known: true
- name_zh: 王恕
  score: 8
  worth_why: 成化弘治间应诏陈言数十上，弹中官权贵无所避，时谚两京十二部独有一王恕；直言谏臣标杆
  era: 明成化至弘治
  dates_known: true
- name_zh: 刘大夏
  score: 8
  worth_why: 治河练兵政绩卓著、藏郑和档案传说、拒武宗索内库银以祖制力争；刘瑾当道戍边而父老遮道泣送，操守完人
  era: 明正统至正德
  dates_known: true
- name_zh: 蒋钦
  score: 8
  worth_why: 三劾刘瑾、再疏再系，梦中先人劝止犹不肯止，瘐死狱中；士大夫殉直的极致样本
  era: 明正德
  dates_known: true
- name_zh: 叶伯巨
  score: 8
  worth_why: 洪武万言书预警诸王之祸，下狱瘐死；靖难兵起其言尽验，先见者悲剧的顶级教训案例
  era: 明洪武
  dates_known: true
- name_zh: 商辂
  score: 7
  worth_why: 明代唯一三元及第；率阁部奏罢西厂与汪直较量，厂复设后毅然求去，抗争有始有终
  era: 明正统至成化
  dates_known: true
- name_zh: 余子俊
  score: 7
  worth_why: 力主延绥筑边墙千余里、以墙养军，明边防工程体系的关键奠基人，务实边臣样本
  era: 明成化
  dates_known: true
rejections:
- name_zh: 王守仁
  why_not: 即王阳明，已在库勿重复
- name_zh: 刘球
  why_not: 忤王振遭肢解虽烈，仅一疏一死、做事周期过短
- name_zh: 韩文
  why_not: 首倡九卿劾刘瑾一事可采，整体做事流偏短，名额所限暂缓
- name_zh: 王琼
  why_not: 才具可观且力荐王阳明，然结纳钱宁江彬品谊存疑、叙事零散，暂缓
- name_zh: 马文升
  why_not: 五朝军政奏疏堆叠，政绩广而平、缺贯穿主线，暂缓
- name_zh: 胡世宁
  why_not: 论宁王必反下狱有风骨，但核心决策点少且与王阳明案交叠，暂缓
- name_zh: 邱濬
  why_not: 立言重于立事，奏议为学问铺陈、缺行动周期
- name_zh: 叶盛
  why_not: 两广军政与谏疏事迹分散，无聚焦的完整做事流
- name_zh: 黄巩
  why_not: 谏南巡杖阙几死气节可嘉，事迹仅一节
- name_zh: 林俊
  why_not: 谏宁府琉璃瓦等诸疏平实，缺高峰名场面，暂缓
- name_zh: 桂彦良
  why_not: 传仅太平十二策一疏，无做事周期
- name_zh: 冯坚
  why_not: 仅言九事一疏，事迹简略
- name_zh: 邹楫
  why_not: 仅灾修时政一疏，无完整周期
- name_zh: 范济
  why_not: 仅陈八事一疏，事迹简略
- name_zh: 罗伦
  why_not: 仅扶植纲常一谏遭贬，单点事迹
- name_zh: 杨守陈
  why_not: 疏议平淡，缺关键决策与结果
