  worth_why: 《甘棠集》作者，晚唐骈文表状一代名手；本卷P.4093所存贺谢进献诸状即其幕府代笔之作，亦是此书今存敦煌之孤本。据史传可考其少孤贫依人、以文干谒起家，累迁翰林学士承旨、同平章事，位极宰辅而终于黄巢陷长安之难——才高位危、文人典藩的命运足为后世镜鉴。然本卷皆贺谢套语，无其本人做事流细节，故列缓录
  era: 晚唐（咸通至中和间）
  dates_known: true
