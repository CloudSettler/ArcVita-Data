candidates:
- name_zh: 靳辅
  score: 9
  worth_why: 康熙十六年自安徽巡抚擢河道总督，当河患方棘、高堰横溃之际到任，遍历河干广谘博询，提出治河必审全局、彻首尾而合治之的总方略，条具八疏；以筑堤崖、疏下流、塞决口有先后而无缓急为纲领，挑清江浦至海口、开引河、筑遥堤缕堤、修高堰、置减水坝，创开中河皂河，在事十年俱着成绩，治河方略至今犹为范式，做事流完整且模范性极强
  era: 清康熙
  dates_known: true
