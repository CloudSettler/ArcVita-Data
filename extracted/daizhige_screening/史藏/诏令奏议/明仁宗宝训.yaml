category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 朱高炽（明仁宗）
  score: 8
  worth_why: 靖难时以世子居守北平，每四鼓而起二鼓乃息，昼夜督治守御，以孤城挫李景隆数十万围兵，是靖难成事之本；后监国理政近二十年，退谗不较、谒陵追本；即位虽仅十月，却宽刑省狱、赦建文诸臣、罢下西洋采办、增诸王禄米以睦亲、免贺抑繁文，仁宣之治由此开篇，堪称在位短而治绩厚的成事范本
  era: 明初洪熙
  dates_known: true
- name_zh: 杨士奇
  score: 7
  worth_why: 起自寒士而历仕四朝，长期执掌内阁；文中凤阳谒陵论‘国家帝业所自’、吕震进谗时劝太子不计前嫌诸节皆见其谋略；后主修两朝实录、荐拔贤才，辅成仁宣之治，成事周期完整可考
  era: 明初
  dates_known: true
- name_zh: 夏原吉
  score: 7
  worth_why: 户部尚书主天下财赋逾二十年，治水苏松、支撑迁都与下西洋之费，是永乐盛世的大管家；永乐末因谏北征系狱，仁宗释之倚为宽政之首，文中增诸王禄米即其手定，谏而系狱、复起佐治，起伏皆成事关键节点
  era: 明初
  dates_known: true
- name_zh: 朱瞻基（明宣宗）
  score: 6
  worth_why: 仁宣之治另一主角，平朱高煦之乱、定内阁票拟之制；然本宝训中仅见其受‘中正’宝押、开讲筵受教诸事，做事流须另据宣宗实录补全，故暂缓
  era: 明初
  dates_known: true
rejections:
- name_zh: 朱棣（明成祖）
  why_not: 文中仅以皇考身份被追述（靖难、北征、崩逝背景），无独立做事流；其功业宜据成祖实录或本纪专条录入
- name_zh: 朱元璋（明太祖）
  why_not: 仅见于谒陵抚石农器、祖训成书等追忆背景，本文献不载其成事周期
- name_zh: 吕震
  why_not: 所见仅为请贺、议丧服及进谗等礼官琐事，无完整做事周期
- name_zh: 朱高煦
  why_not: 与赵王朱高燧均仅于加禄名单中列名，事迹不载
- name_zh: 吕本
  why_not: 与陈治本、朱锦、吕胤昌同为卷首校阅衔名，无事迹可录
