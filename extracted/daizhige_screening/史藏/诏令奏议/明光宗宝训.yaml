verdict: has_candidates
candidates:
- name_zh: 朱翊钧（明神宗万历）
  score: 8
  worth_why: 万历中兴、清算张居正、三大征，后二十余年怠政，勤怠对照成明衰转折的完整做事流与教训；本文献即其身后宝训，盛赞其四十八年之治
  era: 明代嘉靖—万历
  dates_known: true
- name_zh: 朱常洛（明光宗泰昌）
  score: 7
  worth_why: 争国本中隐忍近二十年；梃击案中力主宽宥、不株连无辜，本文献存其原谕并称阴德；即位一月锐意罢矿税、发内帑、补阁臣而暴卒，短促而有故事弧
  era: 明代万历—泰昌
  dates_known: true
rejections:
- name_zh: 王氏（孝靖皇后）
  why_not: 传世事迹为幽禁受难与身后追尊，属宫廷悲剧经历而非完整做事周期
- name_zh: 张差
  why_not: 梃击案偶发人物，仅持梃入宫一事，无自主做事流
- name_zh: 庞保、刘成
  why_not: 涉案内官，仅因梃击案牵连见于残文，事迹简略无做事周期
