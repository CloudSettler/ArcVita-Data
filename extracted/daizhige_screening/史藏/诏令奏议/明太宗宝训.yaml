candidates:
- name_zh: 朱棣
  score: 10
  worth_why: 靖难起兵—直趋金陵—登基—迁都北京—修永乐大典—遣郑和下西洋—五征漠北，做事流完整且多条俱全；本宝训即其言行总集，圣学敬天法祖节俭诸条可见其决策风格；永乐一朝为秦皇汉武级做事密度
  era: 明初永乐年间
  dates_known: true
- name_zh: 朱元璋
  score: 9
  worth_why: 布衣开国，鄱阳湖之战定鼎，废丞相立祖制定法；本篇屡引其成宪旧章为治国坐标，缘起阶段建立周期完整，兼为治乱镜鉴
  era: 元末明初洪武年间
  dates_known: true
- name_zh: 朱瞻基
  score: 7
  worth_why: 撰序之宣德帝，自述幼承祖训、服膺家法；史载其平朱高煦叛乱、开创仁宣之治，自承上启下的守成做事流可考
  era: 明前期宣德年间
  dates_known: true
- name_zh: 解缙
  score: 7
  worth_why: 主持纂修永乐大典为文化盛事名场面；文中与帝论学论太祖宸翰见其近臣本色；少年得志、直谏贬谪、复起主持大典、终瘐死雪中，起伏完整可为镜鉴
  era: 明初
  dates_known: true
- name_zh: 夏原吉
  score: 7
  worth_why: 治水江南、执掌户部支撑北征下西洋财政；文中论宝钞改制见其理财角色；谏止北征下狱、临终犹问民粮，理财名臣典范
  era: 明初
  dates_known: true
- name_zh: 方孝孺
  score: 6
  worth_why: 拒草即位诏、遭诛十族，气节名场面与惨烈教训兼备；本篇仅叙其监修实录获罪一节，完整做事流需辅以正史本传
  era: 明初建文年间
  dates_known: true
- name_zh: 朱允炆
  score: 5
  worth_why: 骤改祖制、削藩失策、四年失国的完整教训样本；文中屡引为反面坐标；但焚宫后下落成谜，卒年难考，事迹存世有限
  era: 明初建文年间
  dates_known: true
