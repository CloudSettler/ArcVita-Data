verdict: has_candidates
candidates:
- name_zh: 明孝宗
  score: 8
  worth_why: 弘治中兴之主；敬天修省、灾异求言、昧爽临朝、节省供用，法祖而不泥；诏修大明会典成一代典制；一后无嫔、勤政克己，为帝王修身之模范
  era: 明成化弘治年间
  dates_known: true
- name_zh: 刘健
  score: 6
  worth_why: 弘治朝内阁首辅，与李东阳谢迁协力辅成中兴；正德初率廷臣抗谏刘瑾被逐归里，有始有终
  era: 明成化弘治正德年间
  dates_known: true
- name_zh: 马文升
  score: 6
  worth_why: 历仕五朝之弘治名臣；整饬边务马政、佐成中兴，晚遭刘瑾侧目去职，功过俱可鉴
  era: 明成化弘治年间
  dates_known: true
- name_zh: 倪岳
  score: 5
  worth_why: 弘治贤臣，官至礼部吏部尚书，奏议务实明礼制；惟本册所载仅一二疏，事迹待据明史补足
  era: 明成化弘治年间
  dates_known: true
rejections:
- name_zh: 刘吉
  why_not: 册中仅灾异修省一疏，其附权幸、纸糊三阁老诸迹本册无做事流可稽
- name_zh: 许天锡
  why_not: 仅斋戒禁约一奏，无完整做事周期
- name_zh: 夏昂
  why_not: 仅请书帝王嘉言箴铭一疏，事迹简略
- name_zh: 王纶
  why_not: 仅援祖训谏保身勤政一奏，无做事流
- name_zh: 周纮
  why_not: 仅一疏请法祖延见臣僚，事迹单薄
- name_zh: 陈宽
  why_not: 内监传旨人物，仅一现，无可考事迹
