source: 史藏/诏令奏议/明宣宗宝训.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 明宣宗朱瞻基
  score: 8
  worth_why: 仁宣之治之主；亲巡边塞大破虏寇，驻跸铁将军店有实战名场面；主俭葬献陵、申郊坛户免杂役、雨雪中郊祀不辍，恤民敬天皆有实政；又留促织天子之讥，正反两面皆可成课
  era: 明代仁宣年间
  dates_known: true
- name_zh: 夏原吉
  score: 8
  worth_why: 疏浚苏松、治吴淞水利；总理财赋支应永乐三大役而不匮；谏北征系狱复起，与蹇义并称贤辅佐成仁宣之治；文中屡受宣宗谘政
  era: 明初
  dates_known: true
- name_zh: 杨士奇
  score: 8
  worth_why: 四朝辅政近五十年；处汉王夺嫡之危保全储位；主修成祖实录；荐贤不避布衣；文中受赐御制诗、共议太后谒陵，君臣问对俱见
  era: 明初
  dates_known: true
- name_zh: 诚孝张皇后
  score: 7
  worth_why: 仁宣正统三朝母仪，谏宣宗保安百姓使不饥寒；史载遏王振于未萌、不预政而政自安，女中尧舜之目，女性执政者稀见样本
  era: 明初
  dates_known: false
- name_zh: 杨荣
  score: 7
  worth_why: 成祖五次北征谋主，军中机务多出其手；谋边事、决大议以敏断称；与士奇同居内阁受宣宗顾问
  era: 明初
  dates_known: true
- name_zh: 蹇义
  score: 7
  worth_why: 掌吏部三十余年，铨选不徇私议；参与定洪武以来制度更张；与夏原吉齐名，文中与三杨同受密谕议礼
  era: 明初
  dates_known: true
- name_zh: 黄福
  score: 7
  worth_why: 治交阯十八年，编户籍定赋税兴学校，去职时吏民泣送，治边理政之典范；文中以工部尚书总营献陵
  era: 明初
  dates_known: true
- name_zh: 明仁宗朱高炽
  score: 6
  worth_why: 监国有素、即位宽政蠲赋起用建文诸臣，为仁宣之治奠基；然在位十月而崩，做事周期短，君主宜缓录
  era: 明初洪熙年间
  dates_known: true
rejections:
- name_zh: 吕震
  why_not: 奏请短丧迎合上意，史评近佞，仅附见于丧礼事，无独立做事周期
- name_zh: 郑王瞻埈
  why_not: 宗室仅为代谒孝陵一行，无事迹可考
- name_zh: 王通
  why_not: 本篇仅以成山侯总营献陵，其征安南功过事不载于此，宜缓
- name_zh: 吕本、陈治本、朱锦、吕彳胤丿昌等
  why_not: 仅卷首校阅衔名，无事迹
- name_zh: 伯夷、姜太公
  why_not: 仅为宣宗御前讲孟子之引例议论，非本文献主体人物
- name_zh: 孔子、尧舜禹汤文武
  why_not: 已在库，且于文中仅作典谟引据
