  worth_why: 慈懿合葬之争中恳请两宫、安抚群臣跪伏文华门之哭谏，是事亲与理政兼具的名场面；考订朱子通鉴纲目、尽去考异考证并亲制序，命儒臣接通鉴编宋元二史，是明代史学一关键决定；天变修省、开经筵、停采办以恤民；即位初为于谦昭雪、复景泰帝号，在位又有抚治荆襄流民、成化犁庭，帝王做事流可考
  era: 明成化
