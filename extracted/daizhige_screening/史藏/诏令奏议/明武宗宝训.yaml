category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 明武宗
  score: 7
  worth_why: 本卷宝训主角；应州之役亲冒矢石却敌、自封威武大将军，用张永奏诛刘瑾除八虎之害；然豹房嬉游、南巡扰民，功过交织为帝王功过并存之典型镜鉴；生卒在位年俱可考
  era: 明中期正德朝
  dates_known: true
- name_zh: 韩文
  score: 6
  worth_why: 户部尚书倡革皇庄以存恤畿民；史载其率九卿疏劾刘瑾八虎，遭杖谪不屈后昭雪，直臣遇权阉之完整教训弧线；生卒年可考
  era: 明弘治正德间
  dates_known: true
- name_zh: 张永
  score: 6
  worth_why: 本卷明载其奉命出师平定叛乱、奏除奸贼；与杨一清定计，还奏刘瑾逆谋致其凌迟，为宦官干政史上少见的拨乱关键节点，决策链完整可考
  era: 明正德间
  dates_known: true
- name_zh: 杨廷和
  score: 6
  worth_why: 武宗南巡时代总朝政，武宗崩后草遗诏定策迎立世宗并厘革正德弊政；本卷仅见其经筵官衔，行事可借正史补全
  era: 明正德嘉靖间
  dates_known: true
- name_zh: 刘健
  score: 5
  worth_why: 力请遵先帝旧例开日讲经筵以成圣学；刘瑾擅政时与谢迁同日致仕抗争，阁臣气节之范
  era: 明弘治正德间
  dates_known: true
- name_zh: 李东阳
  score: 5
  worth_why: 与刘健同请开讲学；刘瑾乱政中独留阁中斡旋，多所调护保全善类，忍辱济事之例；茶陵派领袖
  era: 明成化正德间
  dates_known: true
- name_zh: 周玺
  score: 5
  worth_why: 以灾异屡疏请亲贤远奸、黜奸贪之蠹国；后为刘瑾构陷杖死，直臣惨祸之鉴
  era: 明正德初
  dates_known: true
rejections:
- name_zh: 王璟
  why_not: 仅存请革皇庄一疏，后续处置归韩文覆议，无完整做事周期
- name_zh: 王华
  why_not: 仅为经筵讲读官列名，无行事可采
- name_zh: 蔡震
  why_not: 护丧奉敕属仪式性差遣，无做事流
- name_zh: 张昇
  why_not: 常规灾异修省建言，与诸臣联名无独立事迹
- name_zh: 夏绶等内官
  why_not: 乞加苇场税、请履亩核税扰民，仅存一瞥无做事流
- name_zh: 谢迁
  why_not: 与刘健同请经筵、同日去位，事迹重合不另立
- name_zh: 明世宗
  why_not: 序文仅自述受遗诏纂集宝训，君主低优先，本卷无可采行事
