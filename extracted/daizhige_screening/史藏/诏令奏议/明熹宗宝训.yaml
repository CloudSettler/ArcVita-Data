- name_zh: 范景文
  score: 7
  worth_why: 天启五年任吏部文选司郎中，疏言仕路溷浊，自约并约束同僚一行嘱托即不能为之讳，帝允此后升除一循资望、故违请托指名参奏，拒请托立成规条；其人后官至大学士，甲申之变自缢殉国，清名与殉节首尾可成一轴，本文所载正是其清节起点
  era: 明末
  dates_known: true
- name_zh: 周嘉谟
  score: 6
  worth_why: 天启初以吏部尚书奏创考语六款五等之法，守才心政年貌开列五等注考，又申饬大臣不得封印杜门求去，吏治制度有名可据；惟本篇仅存提案与申饬，未见推行结果，事迹简略故缓
  era: 明万历至天启
  dates_known: true
- name_zh: 刘一燝
  score: 5
  worth_why: 以大学士奉特命诣天寿山相度泰昌帝陵，自东山口历九龙池周阅至皇山二岭，具图说以进，陵工遂兴；其泰昌天启之际定策移宫、抗魏党而去等关键行事皆不在本篇，事迹简略故缓
  era: 明万历至崇祯
  dates_known: true
