candidates:
- name_zh: 张居正
  score: 10
  worth_why: 万历初政实际主政者；考成法、清丈田亩、一条鞭法，本卷弭盗、治河诸条皆其辅政期整饬之政；身后削夺抄家，救时权臣善始不善终的顶级教训
  era: 明嘉靖至万历初
  dates_known: true
- name_zh: 李贽
  score: 9
  worth_why: 本卷明载其结局：张问达疏劾，旨令严拏治罪、已刊未刊书籍尽搜烧毁，逮至惧罪不食死；著焚书藏书惊世骇俗，思想者以身殉道之名场面与警世教训俱全
  era: 明嘉靖至万历
  dates_known: true
- name_zh: 努尔哈赤
  score: 9
  worth_why: 卷末所斥奴酋即其人：十三副遗甲起兵、统一女真、建国称汗、陷抚顺清河、萨尔浒破明四路大军；由边地酋长到开国之主做事流极完整，明廷悬赏千两购其首级足证分量
  era: 明嘉靖至天启
  dates_known: true
- name_zh: 潘季驯
  score: 8
  worth_why: 四任总河，束水攻沙之策为治黄理论奠基；本卷治河篇载万历六年总河都御史潘某奏请河官专任久任、工完稽核方许离任，正其任内主张，工程家典范
  era: 明嘉靖至万历
  dates_known: true
- name_zh: 戚继光
  score: 8
  worth_why: 传文虽未直书其名，然其练兵蓟镇、著纪效新书正处本卷所载万历初年兵政弭盗背景下；南平倭患北御虏骑、治军制度创新的一代名将
  era: 明嘉靖至万历
  dates_known: true
- name_zh: 谭纶
  score: 7
  worth_why: 与戚继光配合练兵蓟辽，官至兵部尚书；本卷弭盗篇有其与张瀚合奏事；台州大捷主帅、知兵文臣，做事流可考
  era: 明嘉靖至万历
  dates_known: true
- name_zh: 明神宗朱翊钧
  score: 6
  worth_why: 本卷主人公；前十年垂拱任张居正改革，亲政后清算旧相、行万历三大征，又数十年怠政；君主主要作时间坐标，然其由勤而惰致明由盛转衰，反面教训突出
  era: 明隆庆至万历
  dates_known: true
- name_zh: 杜松
  score: 6
  worth_why: 本卷谕旨点名令其带家丁星驰出关拒奴酋；萨尔浒之战冒进轻敌全军覆殁身死，有勇寡谋之鉴；做事流短促而教训鲜明
  era: 明万历
  dates_known: true
- name_zh: 邢玠
  score: 6
  worth_why: 本卷禁左道篇有其报妖民金得时左道惑众之奏；史称其经略朝鲜御倭、总督川贵，做事流较完整但名场面一般
  era: 明嘉靖至万历
  dates_known: true
