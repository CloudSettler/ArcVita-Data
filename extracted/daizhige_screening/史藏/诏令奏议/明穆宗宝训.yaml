category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 张居正
  score: 9
  worth_why: 本篇载其隆庆初以阁臣身份同知经筵、充世宗实录总裁官；后当国十年行考成法、一条鞭法、清丈田亩，起衰振隳，是明代做事流最完整的改革家，名场面与教训兼备
  era: 明中后期（嘉靖至万历间）
  dates_known: true
- name_zh: 高拱
  score: 8
  worth_why: 本篇详载其掌吏部时力辨世宗服丹暴亡之诬，为王金等方士狱翻案宣付史馆；其促成俺答封贡息北边烽火、整顿吏治荐用将才，做事流完整，罢黜出局亦是教训
  era: 明中后期
  dates_known: true
- name_zh: 徐阶
  score: 7
  worth_why: 本篇载其以首辅知经筵；隐忍严嵩之下二十余年终倒严柄，嘉靖末草遗诏匡玄修之失、平反冤狱，为隆庆新政开路，功成而退
  era: 明中后期
  dates_known: true
- name_zh: 明穆宗朱载坖
  score: 6
  worth_why: 本篇即其宝训，在位六年恭默垂拱，朝成隆庆开关、俺答封贡两大事；然谋画多出阁臣，本人做事流简，君主低优先，宜缓录作时间坐标
  era: 明中后期
  dates_known: true
rejections:
- name_zh: 明世宗朱厚熜
  why_not: 君主仅作时间坐标；本篇只见身后议谥、纂修实录及王金案诉讼，无自身可录做事周期，斋醮怠政亦非商鞅变法级
- name_zh: 明神宗朱翊钧
