verdict: has_candidates
candidates:
- name_zh: 明英宗
  score: 6
  worth_why: 一生大起大落成完整周期：冲龄即位、宠信王振致土木堡之变被俘、南宫幽禁七年、夺门复辟，临终废宫妃殉葬、复胡皇后名号为冤者平反；本篇可见其敬天修省、灾异赈恤、应天以实不以文之语；亲小人致祸之教训与废人殉之善政兼备，惟君主低优先、宝训多为祭祀敬天之文
  era: 明代正统、天顺年间
  dates_known: true
rejections:
- name_zh: 胡濙
  why_not: 传中仅为奏请日食救护、议祭礼之礼部尚书，无独立做事流；其名事不在本篇
- name_zh: 王骥
  why_not: 仅一见甘肃备边敕文，麓川征役不在本篇，无做事周期可循
- name_zh: 孝恭孙皇后
  why_not: 仅为上尊号对象，虽敕文追述其赞助复辟之功，本篇无其自主做事过程
- name_zh: 恭让胡皇后
  why_not: 仅叙让位闲居与身后复谥修陵，系被废平反者而非做事者，传文单薄
- name_zh: 朱勇
  why_not: 仅灾异后联名自讼一章，无完整做事流
- name_zh: 郭琎
  why_not: 仅与朱勇联名上章自讼，无独立事迹
- name_zh: 李隆
  why_not: 仅为南京守备受敕修省应变，无独立事迹
- name_zh: 黄福
  why_not: 仅与群臣同受敕一道，无独立事迹
- name_zh: 徐琦
  why_not: 仅漕运灾损除豁受敕一事，简略无周期
