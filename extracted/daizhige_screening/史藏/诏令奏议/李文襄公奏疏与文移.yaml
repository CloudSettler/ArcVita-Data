category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 李之芳
  score: 9
  worth_why: 三藩之乱中以浙江总督独当闽面：康熙十二年莅任即修战船、增兵备海；耿精忠举兵后飞报闽变、调度金衢温处各路堵御，衢州保卫战连年报捷，恢复寿昌、义乌、汤溪、东阳、嵊县诸暨、开化、温州等地，兼行招抚保甲、严禁抢掠、赈济难民，以文臣统兵安定一方。本集奏疏文移即其完整做事周期实录，缘起、决策、攻坚、收束俱全，是清初治军安民典范
  era: 清初康熙朝
  dates_known: true
rejections:
- name_zh: 耿精忠
  why_not: 本集仅从讨伐方视角见其遣奸细、煽土寇、兵败乞降事，无独立做事流文本；如录宜俟三藩之乱专传
- name_zh: 康亲王杰书
  why_not: 奏疏中仅作统帅坐标（奉命大将军），无独立关键决策叙事
- name_zh: 海澄公提督
  why_not: 本集仅数通咨文调兵赴援瑞安温州，人名事迹不详，缺生卒与完整周期
