- name_zh: 杨廷和
  score: 10
  worth_why: 做事流极完整——入阁十八年，正德朝累疏谏游逸、请还宫、停斋醮织造；拒拟威武大将军敕，力挫钱宁江彬传旨要挟；武宗猝崩顷刻定策，擒戮江彬、迎立世宗，手扶日月成四十六年之烈；大礼议力争不进而去位，为社稷之臣典范
  era: 明成化至嘉靖
  dates_known: true
