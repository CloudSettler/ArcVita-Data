candidates:
- name_zh: 洪承畴
  score: 9
  worth_why: 松山兵败被俘后降清，转而为清定江南、经略湖广江西广西云贵五省；本册自顺治二年至十七年揭题奏册俱全，完整呈现其荐官任人、酌免钱粮、议设经制兵马、筹饷安驿、剿抚并用收云贵之全做事周期；后世入贰臣传，功过并存，堪为治事之才与气节之训的双重镜鉴
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 冯铨
  why_not: 本册仅编例提及顺治元年与洪承畴合上甄别人才启本一件，无做事流可考
- name_zh: 信郡王
  why_not: 仅恭报贵阳歇马起行一处涉及，无独立做事周期记载
- name_zh: 吴世拱
  why_not: 疑为编校者署名纪年，非文献所记做事人物
