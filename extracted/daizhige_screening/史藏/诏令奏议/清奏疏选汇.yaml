  era: 同治光绪朝
  dates_known: true
- name_zh: 邓承修
  score: 6
  worth_why: 号铁面御史弹劾不避权贵；本篇有援台密派与纠参闽藩诸折；后主持中法勘界力争疆土
  era: 同治光绪朝
  dates_known: true
- name_zh: 陈锦
