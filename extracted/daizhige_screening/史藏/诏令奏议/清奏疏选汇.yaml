  era: 乾隆朝
  dates_known: true
- name_zh: 范承谟
  score: 8
  worth_why: 范文程之子；三藩乱起困守闽省，为耿精忠囚二年不降殉节，谥忠贞；本篇即其乱前条陈闽省利害之谋
  era: 顺治康熙朝
  dates_known: true
- name_zh: 黄爵滋
