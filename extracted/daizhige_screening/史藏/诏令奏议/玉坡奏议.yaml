candidates:
- name_zh: 张原
  score: 9
  worth_why: 正德甲戌进士，释褐五月授吏科给事中，拜官三月即极论时政十二事，疏奏九日谪贵州新添驿丞；谪居魑魅之乡八年其志不挫，嘉靖初召回复职，益慷慨直谏，弹劾太监萧敬、锦衣卫朱宸，停张鹤龄张延龄恩典、论其罪状，疏论张璁桂萼，甲申封事忠愤激烈、抗志委身，终以谏死，遗稿三十余疏炳炳不朽；坎坷不改其守、疾风不仆劲草，为明代谏官典范与行事完整周期
  era: 明正德至嘉靖
  dates_known: true
