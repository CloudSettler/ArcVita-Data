source: 史藏/诏令奏议/玉堂公草.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 高拱
  score: 9
  worth_why: 本草为其手笔，臣拱自署可证。侍裕邸讲读二十年起于潜邸旧僚，隆庆初入阁拜相，考察自陈、辞免加官见其居官谨慎；史载其复起为首辅后行隆庆新政：俺答封贡、隆庆开关、整饬吏治、用潘季驯治河，做事流完整；又因恃才傲物与徐阶张居正冯保相争，万历初骤被逐、抱恨而终，足为后人镜鉴
  era: 明嘉靖隆庆间
  dates_known: true
rejections:
- name_zh: 隆庆帝朱载坖
  why_not: 君主仅作时间坐标，劝进笺贺登极表皆颂辞，无独立做事周期
- name_zh: 孝恪皇后杜氏
  why_not: 尊谥议文册文所颂之后妃，仅录德行虚誉，无事迹可考
- name_zh: 孝懿皇后李氏
  why_not: 追谥册文寥寥数语，早逝无做事可言
- name_zh: 寿妃尚氏
  why_not: 册文为应制虚文，其人传世资料仅此，无做事流
- name_zh: 郑藩献谷者
  why_not: 瑞谷颂中仅作祥瑞进献之由，无姓名事迹
