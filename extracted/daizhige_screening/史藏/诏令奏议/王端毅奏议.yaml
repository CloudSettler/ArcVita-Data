- name_zh: 王恕
  score: 9
  worth_why: 本集十五卷皆其奏议，做事流完整可考：大理寺申明律例平冤抑、巡抚荆襄处置流民定久安之策、巡抚云南参劾镇守太监、总理河道、两任参赞机务、执掌吏部毅然以天下人才为己任；历仕四朝四十五年上疏三千余，刚正清严始终一致，时谚称两京十二部独有一王恕，为弘治中兴柱石、直言敢谏典范；晚年因刊疏稿与邱濬交恶、遭刘文泰构攻去位，足为昧于远名之戒的教训
  era: 明正统至弘治
  dates_known: true
- name_zh: 李东阳
  score: 6
  worth_why: 本集序作者，四朝阁老、茶陵派领袖，序中自述参预修两朝实录、见识选举之典式；其阁务生涯与应对刘瑾专权之事另可成完整做事流，需另据其集与明史补证
  era: 明天顺至正德
  dates_known: true
- name_zh: 邱濬
  score: 5
  worth_why: 本集提要记其与王恕因刊刻留中疏稿争坐位构怨之事，侧面见其狠忮一面；其编大学衍义补之功业须别据明史，故列缓录
  era: 明成化至弘治
  dates_known: true
