- name_zh: 胡世宁
  score: 9
  worth_why: 为推官屡折岐藩之势；为主事上陈言时政十事疏，直指士风、财用、边储、盐政、军职诸弊；任江西副使上疏劾宁王宸濠，几遭构陷不免，宸濠败后复起又纠中官，风节震一世；盐利折银、汰冗选将诸疏多制度创见，忠直与孤危引退交织，成败教训兼备
  era: 明弘治至嘉靖年间
  dates_known: true
- name_zh: 朱宸濠
  score: 5
  worth_why: 蓄势结党、构陷忠良、终至举兵速败，藩王僭逆覆亡之典型教训
  era: 明正德年间
  dates_known: true
