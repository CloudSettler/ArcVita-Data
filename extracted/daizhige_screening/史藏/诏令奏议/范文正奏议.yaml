- name_zh: 范仲淹
  score: 10
  worth_why: 庆历新政答手诏条陈十事（明黜陟、抑侥幸、精贡举），仁宗悉采用；以天下为己任裁削幸滥考核官吏，因谣谤不安其位而去，完整改革做事流缘起施行受挫皆可考；恤灾南方扞寇西陲；先天下之忧而忧，兴学取士为后世改革范本
  era: 北宋
  dates_known: true
- name_zh: 韩琦
  score: 7
  worth_why: 与范仲淹并任帅西兵翊内枢同预庆历新政，韩范并称；后为河东经略安抚使；为奏议作序称道之在人不在天
  era: 北宋
  dates_known: true
- name_zh: 富弼
  score: 7
  worth_why: 与韩范同列中外人望不次拔擢共预庆历新政；条陈十事主要谋划者之一；青州赈济灾民数万；出使契丹折辽主割地之请
  era: 北宋
  dates_known: true
