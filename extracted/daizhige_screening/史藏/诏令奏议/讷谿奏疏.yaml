candidates:
- name_zh: 周怡
  score: 9
  worth_why: 吏科给事中三上疏直言——劾两广督抚罔上欺罔、请因元旦日食发诏求直言、劾户部李如圭受贿与兵部张瓒卖官，忤严嵩廷杖下锦衣狱三年，复出复被逮又二年，隆庆再起仍疏忤中官；平生触犯权幸至再至三，志百折不改，提要称劲直忠亮卓然为一代完人；缘起、阶段、决断、结局俱全，直臣典范与名言场面兼备
  era: 明嘉靖至隆庆间
  dates_known: true
- name_zh: 杨爵
  score: 6
  worth_why: 与周怡刘魁同系锦衣狱的嘉靖直臣，系狱数年不改其志，可为谏臣模范；惟本集仅附见一句，做事流须据本传补考，故列缓录
  era: 明嘉靖间
  dates_known: true
- name_zh: 严嵩
  score: 6
  worth_why: 权相专政、倾陷直臣而终至败亡的教训型人物，史有完整做事流；本集仅见其为背景权臣，事迹须参他传，故列缓录
  era: 明嘉靖间
  dates_known: true
