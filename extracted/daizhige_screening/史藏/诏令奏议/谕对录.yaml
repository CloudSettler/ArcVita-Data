candidates:
- name_zh: 张孚敬
  score: 9
  worth_why: 即张璁，四十七岁方成进士，以大礼议骤登辅位、六年至首辅，晚成典范；当国清勋戚庄田、革天下镇守内臣、整饬吏治言路，做事流完整；谕对录存其与世宗往复论政全貌，张延龄案中持「恩有所当加、法有所当屈」，于外戚杀人、太后求情之间持正斡旋，为恩法两难的名场面；屡疏乞休、进退有节，其改革与争议俱可作后世镜鉴
  era: 明代嘉靖朝
  dates_known: true
rejections:
- name_zh: 张延龄
  why_not: 外戚恃势奢横、杀人获罪，文中仅作罪案对象，无做事周期与可录事迹
- name_zh: 昭圣皇太后
  why_not: 仅为营救兄弟传谕求情，无独立做事流
- name_zh: 张鹤龄
  why_not: 其罪附见延龄兄弟案中，无独立做事流
- name_zh: 明世宗嘉靖帝
  why_not: 君主低优先，本篇仅见其处置懿亲之谕旨，主要作时间坐标，未达秦皇变法级突出做事
