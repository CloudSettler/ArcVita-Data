source: 史藏/诏令奏议/道咸同光四朝奏议选辑.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 丁日昌
  score: 8
  worth_why: 洋务先驱：佐创江南制造局、轮船招商局；上海洋水师章程六条开近代海防蓝图；福建巡抚任内渡台抚番开路、架设电线、兴办矿务。本集代陈丁日昌议覆海防事宜疏、请敕抚臣渡台、亲勘台湾北路后山诸篇，正是其台事与海防政策的完整做事链，可考可录
  era: 晚清同光
  dates_known: true
- name_zh: 沈葆桢
  score: 8
  worth_why: 船政之父：受命创办福州船政局，同治十一年遵议船政万难停止疏即其力驳停造之议的名场面；牡丹社事件后钦差渡台，开山抚番、筑城设防、奏移巡抚驻台，奠定台湾防务格局；后督南洋购舰练兵，病殁于任，做事流缘起到结局俱全
  era: 晚清同治光绪
  dates_known: true
- name_zh: 岑毓英
  score: 7
  worth_why: 以团练起家戡定云南回乱，官至云贵总督；本集光绪六年附片专请调其督办台湾，中法战争又督师滇边筑关守隘，边政军功做事流完整，治边能吏典型
  era: 晚清咸同光
  dates_known: true
- name_zh: 赵慎畛
  score: 6
  worth_why: 闽浙总督任上针对许尚杨良斌之乱，设计清庄联甲、逐籍递解、盐私查缉全套章程，缘起、办法、考核、奖惩俱全，是治台政策完整周期的样本；积劳病卒任上，可为实干能吏之鉴
  era: 清嘉庆道光
  dates_known: true
- name_zh: 程祖洛
  score: 5
  worth_why: 张丙之乱后上台湾善后六策（禁偷渡、行清庄、严连坐、禁搬徙、实力化导、修城筑台），经部议逐一准行，是一个完整的善后政策提案周期
  era: 清道光
  dates_known: true
- name_zh: 曹振镛
  score: 5
  worth_why: 乾隆至道光三朝重臣，主持议覆台湾善后章程，采禁偷渡、清庄、连坐诸策；然居位数十年以多磕头少说话自持，功业平平，可为居高位者之教训
  era: 清乾隆道光
  dates_known: true
- name_zh: 孙尔准
  score: 5
  worth_why: 与赵慎畛会奏台湾清庄缉私章程，后任闽浙总督，赈灾减赋、修筑城垣有政声，治台之策与其督闽岁月相始终
  era: 清嘉庆道光
  dates_known: true
- name_zh: 罗应旒
  score: 4
  worth_why: 海防大讨论中具名上条陈的言官，本集专有筹议罗应旒条陈疏，见其建言曾推动廷议；惜传世事迹太少，生卒难考
  era: 晚清同光
  dates_known: false
- name_zh: 林西泰
  score: 4
  worth_why: 笨港总理，乱中联约各庄不准妄动、三战三捷保其乡独完，民间自治自卫的微型名场面；然仅此一事可考
  era: 清道光
  dates_known: false
rejections:
- name_zh: 许尚
  why_not: 南路起事旋被歼除，仅作清庄政策缘起的背景，无做事周期可录
- name_zh: 杨良斌
  why_not: 同许尚，起事即败，事迹仅一句带过，不足成轴
