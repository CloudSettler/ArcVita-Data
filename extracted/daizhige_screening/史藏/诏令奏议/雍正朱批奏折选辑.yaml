source: 史藏/诏令奏议/雍正朱批奏折选辑.md
category: 史藏/诏令奏议
verdict: has_candidates
candidates:
- name_zh: 雍正帝
  score: 8
  worth_why: 创密折制度令臣工直达天听，亲批朱谕万余件、灯下夜批六载如一日；后刊刻朱批颁示天下。制度创新与勤政自律双重典范，因材施教、因人而施的驭臣批语亦是治理心法教科书
  era: 清雍正朝
  dates_known: true
- name_zh: 年羹尧
  score: 8
  worth_why: 平青海罗卜藏丹津之叛，十五日定大功；从抚远大将军威震西北到贬为杭州城门吏、赐死，骤起骤落链条完整，恃功骄纵的警示教科书
  era: 清康熙末至雍正初
  dates_known: true
- name_zh: 鄂尔泰
  score: 8
  worth_why: 主政云贵推行改土归流，废土司世袭、设流官、兴义学，西南制度重构的操盘手；由督抚到乾隆朝领班军机，兴衰治绩俱全
  era: 清雍正朝
  dates_known: true
- name_zh: 张廷玉
  score: 7
  worth_why: 参与创设军机处并定其规制，章奏直达之制成型多出其手；为官五十年慎密无瑕，清一代汉臣配享太庙唯一人
  era: 清康熙至乾隆初
  dates_known: true
- name_zh: 田文镜
  score: 7
  worth_why: 河南任内清查亏空、推行摊丁入亩、严催垦荒，雍正新政最猛烈的执行者；与李绂互参案名场面，能臣与酷吏一体两面
  era: 清雍正朝
  dates_known: true
- name_zh: 李卫
  score: 7
  worth_why: 捐资入仕而治盐政、缉私枭、修海塘、捕盗安民皆有声；雍正朱批因材施教的活标本，出身粗浅而能事功有成
  era: 清雍正朝
  dates_known: true
- name_zh: 岳钟琪
  score: 7
  worth_why: 随征青海建功，继掌川陕总督西部兵权；首告曾静案自证，后系狱几死，乾隆朝复出再平金川，武将宦海三起三落完整
  era: 清雍正至乾隆初
  dates_known: true
- name_zh: 怡亲王允祥
  score: 6
  worth_why: 总理清查户部亏空、督理畿辅水利营田、赞画西北军需，雍正朝宗室柱石；鞠躬尽瘁而早逝，亲王理政的正面样板
  era: 清雍正朝
  dates_known: true
- name_zh: 隆科多
  score: 6
  worth_why: 以步军统领宣遗诏定策拥立，任吏部整饬铨选；恃定策之功而擅权，终至禁锢而死，君臣权力之界的反面教训
  era: 清康熙末至雍正中
  dates_known: true
- name_zh: 李绂
  score: 6
  worth_why: 历广西巡抚、直隶总督，弹劾田文镜引发雍正朝著名的督抚互参案；清廉直节与理学经学造诣并著，直臣代价的典型样本
  era: 清雍正朝
  dates_known: true
