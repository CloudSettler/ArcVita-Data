candidates:
- name_zh: 王夫之
  score: 9
  worth_why: 刺腕傅毒脱父于张献忠之手；与管嗣裘起义衡山抗清；请终丧免阁试显孝行恬品；陈言疏论邪正消长大臣进退、出位直言不畏祸；明亡后成船山之学开宗立派
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 张献忠
  why_not: 仅作陷衡州购索士绅之背景，文内无完整做事周期
- name_zh: 严起恒
  why_not: 遭雷德复弹劾而乞休，被动受事，文中未见其主动建树始末
- name_zh: 雷德复
  why_not: 一疏参人一褫职，仅作党争反面人物，无做事流
- name_zh: 瞿式耜
  why_not: 仅以荐举阁试提及，无事迹展开
- name_zh: 管嗣裘
  why_not: 仅共举义一句，事败后无下文
- name_zh: 王朝聘
  why_not: 王夫之之父，忧愤而终，属衬托人物
- name_zh: 李自成
  why_not: 仅一句陷承襄荆德，无事迹
- name_zh: 文天祥
  why_not: 疏中引为喻例，非本文所载人物
- name_zh: 李泌
  why_not: 疏中引为喻例，非本文所载人物
