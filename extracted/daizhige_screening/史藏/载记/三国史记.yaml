candidates:
- name_zh: 赫居世居西干
  score: 7
  worth_why: 新罗开国始祖：六村推戴立国、娶阏英并称二圣、筑金城、巡抚六部劝督农桑、卞韩来降东沃沮来贡，乐浪人叹为有道之国而不忍袭，创业周期完整
  era: 朝鲜三国初期（西汉宣帝五凤元年即位，公元前57年）
  dates_known: true
- name_zh: 儒理尼师今
  score: 7
  worth_why: 制兜率歌为歌乐之始；改六部之名并赐李崔孙郑裴薛六姓；设官十七等开新罗官制之端；巡行恤民解衣推食，邻国百姓闻风来归，制度创设型人物
  era: 朝鲜三国初期（公元24至57年在位）
  dates_known: true
- name_zh: 东明
  score: 8
  worth_why: 高句丽始祖朱蒙，离扶余历经追杀渡水建国的完整创业流，与本卷同书高句丽本纪详载其事
  era: 西汉末
  dates_known: true
- name_zh: 温祚
  score: 8
  worth_why: 百济始祖，率十臣自高句丽南下汉山立国，择都定基的完整做事流，与本卷同书百济本纪详载其事
  era: 西汉末
  dates_known: true
- name_zh: 脱解
  score: 6
  worth_why: 本卷已见南解闻其贤妻以长女、委以军国政事；后即位为脱解尼师今，寻得金阏智奠定金氏王统，主要事迹详于后卷
  era: 朝鲜三国初期（公元1世纪）
  dates_known: true
- name_zh: 瓠公
  score: 5
  worth_why: 聘马韩面对辱使劫兵之危侃然对答，以人事修天时和折服强邻得全身而返，辞令名场面可取，惟事迹单薄
  era: 朝鲜三国初期（西汉末）
  dates_known: false
- name_zh: 阏英
  score: 5
  worth_why: 龙现井中所生，有贤行能内辅，与赫居世并称二圣，从王巡抚六部劝督农桑，为开国治国内助，事迹简略
  era: 朝鲜三国初期（公元前1世纪）
  dates_known: true
