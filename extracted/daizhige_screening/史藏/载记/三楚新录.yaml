source: 史藏/载记/三楚新录.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 马殷
  score: 9
  worth_why: 行伍出身宽厚得士死力，主帅卒后独守丧不争位，反为诸军共推为主；建国后登楼破杨行密水师，湘水为之丹，四方慑伏；纳廖光图、遣李勋拔桂管十八城迫刘氏乞盟，缘起、扩张、守成俱全，开国之主做事流完整
  era: 唐末五代·马楚
  dates_known: true
- name_zh: 周行逢
  score: 8
  worth_why: 自犯法农家起，佐王逵夜袭斩门破边镐夺湖南；代逵主政后潜察骤除聚敛之吏、拒女婿求官反赐锄犁，一方翕然号为英主；然猜忌好发阴事、沉何景山于江，功过对照足为后世镜鉴
  era: 五代末·楚地
  dates_known: true
- name_zh: 马希范
  score: 6
  worth_why: 反面教材俱全：中庄宗反间谗杀谋臣高郁，识者知其不克霸；建九龙殿以沉香为龙、自谓一龙，奢僭拟乘舆，淫掠士庶女数百，卒为识者所笑而启楚国之乱
  era: 五代十国·马楚
  dates_known: true
- name_zh: 王逵
  score: 6
  worth_why: 乘边镐安抚无策、民多怨叛，与十数豪杰夜袭城下鼓噪斩门，旬日成事；然车服制度拟王者，秣马厉兵而南征兵败，仅以身免死于路，为副手周行逢所代，是得地难守之典型
  era: 五代末·楚地
  dates_known: true
- name_zh: 边镐
  score: 5
  worth_why: 教训典型：诈为僧弄钹行乞探楚虚实，浃旬尽有湘中；然每出师载佛事自祝请福，三军解体，遇王逵兵至竟宵遁，得地而旋失，非将才而任将之戒
  era: 五代十国·南唐
  dates_known: true
- name_zh: 潘氏
  score: 5
  worth_why: 模范人物：夫贵为侯王而自率婢仆耕织自给，赋税及时输纳，曰官物岂以己为主而自免，令周行逢有惭色；做事流简而家风一课足传
  era: 五代末·楚地
  dates_known: false
rejections:
- name_zh: 高郁
  why_not: 本文仅述其遭反间弃市，谋楚方略未展开
- name_zh: 马希萼
  why_not: 举兵夺位旋纵欲失众被囚，做事流破碎仅作乱源
- name_zh: 马希广
  why_not: 临危披缁念佛城陷被缢，仅存愚昧致败片段
- name_zh: 马希崇
  why_not: 乘衅囚兄旋悔追杀，终举族降吴，反复无常无完整周期
- name_zh: 桑维翰
  why_not: 本文仅载乞万金遭希范轻嘲一事，削半仗亦一笔带过
- name_zh: 徐仲雅
  why_not: 满天太保满地司空之嘲与咏棕枝诗，滑稽轶闻无做事周期
- name_zh: 廖光图
  why_not: 举族来奔献取越之策，事迹简略不成流
- name_zh: 李勋
  why_not: 拔桂管十八城，然传文仅食肉大脔与儿谣应谶轶闻
- name_zh: 丁思觐
  why_not: 一书切谏期大王为天子计，即遭削官，仅谏诤片段
- name_zh: 戴偃
  why_not: 作渔父诗百篇讽奢僭，禁锢饿死，事略不成流
