category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 徐葆光
  score: 8
  worth_why: 康熙五十八年奉使册封琉球，淹留八阅月，先致语国王求示世监图籍，遍游山海、去疑存信，撰中山传信录六卷，厘正自隋书以降千年讹漏；新测琉球距福州仅一千七百里，定针路无过用卯针，绝流至叶壁山之患；世系封疆官秩物产图状并列，为琉球研究第一信史，做事流完整可考
  era: 清康熙
  dates_known: true
- name_zh: 汪楫
  score: 7
  worth_why: 康熙二十二年册封琉球，力主取现成战舰充封舟，一举革除历代造船采木骚动夫役、縻费官帑、奸吏假手之弊，费轻办速；撰中山沿革志二卷杂录五卷，典实远超前人
  era: 清康熙
  dates_known: true
- name_zh: 陈侃
  score: 7
  worth_why: 嘉靖甲午册封琉球，始有使录；访其山川风俗人物之详，驳群书之谬，成纪略质异二卷，末载国语国字，开册封使著述体例之先河
  era: 明嘉靖
  dates_known: true
- name_zh: 徐兢
  score: 6
  worth_why: 宣和间奉使高丽，撰奉使高丽图经，详载高丽制度、海道舟楫，为宋代中外交通要籍；本传信录考封舟尺度犹援引之
  era: 北宋宣和
  dates_known: true
rejections:
- name_zh: 海宝
  why_not: 文中仅见正使衔名，行事细节皆系于副使徐葆光，无独立做事流
- name_zh: 中山王察度
  why_not: 琉球君主，仅作洪武五年始通中朝之时间坐标，天下共主低优先
- name_zh: 张学礼
  why_not: 康熙二年使琉球，使略杂录虽颇详于昔，然做事周期单薄，事迹简略
- name_zh: 萧崇业
  why_not: 万历册使，著述前后相袭，无独创之关键决策
- name_zh: 夏子阳
  why_not: 万历册使，著述前后相袭，无独创之关键决策
- name_zh: 林麟焻
  why_not: 与汪楫共决取现船充封舟，主决策者已录汪楫，独立事迹不足
- name_zh: 谢杰
  why_not: 万历七年册使，仅存日东交市记书名与恤役一条，做事流不可考
- name_zh: 胡靖
  why_not: 崇祯册使从客，其记尤俚诞，不足为信史
- name_zh: 汪士鋐
  why_not: 仅撰序文，系书评而非其本人做事流
- name_zh: 天妃
  why_not: 海神信仰对象，灵应记属祭祀文献，非可考历史人物
