candidates:
- name_zh: 杨行密
  score: 9
  worth_why: 微时力举三百斤起于行伍，创黑云都定淮南基业；诈目疾三年诱杀妻兄朱延寿，忍而后发成千古名局；厚待叛将成及盛暑单衣同食饮无疑忌，雄豪有度量；由孤微至吴王，缘起、关键决定、结果俱全
  era: 唐末五代
  dates_known: true
- name_zh: 李昪
  score: 9
  worth_why: 杨氏孤儿入徐氏为养子，事徐温晨昏侍奉极孝谨以固位，闻黄袍谀言即斥退以全信；绐兄徐知询入朝而夺其柄；终代吴建南唐；开国后志勤俭，宫砌无新树宫衣无组绣；内谋其家外谋其国，完整做事流兼具权谋与治术两面
  era: 五代十国
  dates_known: true
- name_zh: 李煜
  score: 8
  worth_why: 善辞藻工笔札，造念家山振金铃二曲，为词曲史名场面；销金红罗幂壁、绿钿刷隔眼穷奢极欲；天水碧、檀来也诸谶一一应验亡国；才情与败亡对照，堪为后人镜鉴
  era: 五代末宋初
  dates_known: true
- name_zh: 王建
  score: 8
  worth_why: 饼师之子终为前蜀开国之帝；葬父棺三跃而出自负天命；讨尚君长剖马得蛇遂怀大志；通和梁祖复书七十州自可指挥有气度；五改元易钱文，登楼观蚕市而聚敛不已；起家至立国轨迹完整，兼作聚敛之戒
  era: 唐末五代
  dates_known: true
- name_zh: 朱瑾
  score: 7
  worth_why: 吴之名将；以绡巾事觉徐知训之奸，盛暑遍洒厅事水驱其从者，宴间手板击杀之截首提见杨氏；事不济逾城折足自刭，尸暴于市而虫蛆不犯；刚烈决绝有极强场面，惜周期以败亡收束
  era: 唐末五代
  dates_known: true
- name_zh: 徐温
  score: 6
  worth_why: 与张颢同谋弑杨渥，反哭城门诛颢而独揽吴政；经营两代栽养李昪，终致养子代杨氏；权臣布局与失算并存，可为鉴戒
  era: 唐末五代
  dates_known: true
- name_zh: 宋齐丘
  score: 6
  worth_why: 佯狂纵酒自晦以脱徐温之疑；劝李昪即渡江定乱收广陵政柄，一语定乾坤；开国启宴乘醉诟筵伏下祸根；谋士之进退与祸端口皆可鉴
  era: 五代十国
  dates_known: true
