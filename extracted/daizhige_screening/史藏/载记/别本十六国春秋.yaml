source: 史藏/载记/别本十六国春秋.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 刘渊
  score: 9
  worth_why: 做事流完整可考，从洛阳侍子、左部帅到左国城筑坛称汉王、蒲子称帝建汉赵；追尊刘禅立汉三祖五宗以收天下人心，称帝王岂有常哉大禹生于西戎文王生于东夷，为十六国之局的开端人物，兼有名论与关键决策
  era: 西晋末至十六国
  dates_known: true
- name_zh: 刘聪
  score: 8
  worth_why: 长驱陷洛阳、攻长安，俘晋怀帝愍帝，酿永嘉之祸，害王公百姓三万余人筑京观；逼故帝行酒洗爵执盖致群臣涕泣失声，是历史警示名场面；晚年荒酒纵乐军国一决于国相，死后靳准之乱宗庙焚掘，教训典型
  era: 十六国前赵
  dates_known: true
- name_zh: 刘曜
  score: 7
  worth_why: 徙都长安改国号为赵，议罢汉宗庙、营寿陵受乔豫和苞切谏而悦纳，可见纳谏一面；洛西之战临阵饮酒数斗坠马陷冰为石堪所执，至子毗覆灭，酗酒亡国为后世经典教训；白玉皇王皇亡谶纬与长安灾异记载亦可作时间轴坐标
  era: 十六国前赵
  dates_known: true
rejections:
- name_zh: 石勒
  why_not: 本卷无专传，仅见率众来降与洛西拒战数句，做事周期在他卷，宜待其专篇录入
- name_zh: 石虎
  why_not: 仅寇河东败于刘曜枕尸百余里数句，无完整做事流
- name_zh: 王弥
  why_not: 仅起兵青徐遣使来降数句，事迹简略无阶段可分
- name_zh: 靳准
  why_not: 弑刘粲掘陵焚庙自号汉王仅数十字，属乱臣插曲，缺可考做事周期
- name_zh: 刘粲
  why_not: 荒耽酒色军国一决于准，即位数月即被杀，无事业可录
- name_zh: 刘和
  why_not: 立为太子旋为刘聪攻斩，无做事可考
- name_zh: 刘宣
  why_not: 仅劝进推戴之语，无独立做事流
- name_zh: 冒顿
  why_not: 已在库中勿重复，且传中仅为刘渊世系溯源提及
