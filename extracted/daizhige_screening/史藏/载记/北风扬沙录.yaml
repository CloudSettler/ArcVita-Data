verdict: has_candidates
candidates:
- name_zh: 耶律阿保机
  score: 6
  worth_why: 篇中唯一具名人物：乘唐衰兴北方、吞诸番三十六部，恐女真为患而诱迁豪右数千家于辽阳之南著籍，遂生熟女真之分——一桩有缘起、决策、后果的完整政策周期，且羁縻迁徙反留生女真坐大之患，恰成金人崛起远因，具教训价值；然本篇所载仅两句，其统一八部、称帝建辽、创制契丹文字、灭渤海等功业须俟《辽史》补足，故列为缓录
  era: 唐末五代（契丹辽太祖）
  dates_known: true
rejections:
- name_zh: 女真七十二部落酋豪
  why_not: 全篇为部族源流、风俗、兵制、法令之志，诸酋自推豪侠而无一具名，无做事周期可考
- name_zh: 契丹兴宗宗真
  why_not: 仅因避女直之讳提及名号，无任何事迹
