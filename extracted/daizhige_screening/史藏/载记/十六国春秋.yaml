  why_not: 本卷仅为刘渊借势脱身的背景板，其做事流在晋书八王传而非此录
- name_zh: 刘琨
  why_not: 本卷仅板桥一胜与晋阳对峙数行，无完整周期；宜俟晋书本传另录
- name_zh: 王浚
  why_not: 本卷只见遣骑攻邺与乞师插曲，无独立做事流
- name_zh: 司马腾
  why_not: 屡败屡遁仅作战争时间坐标
- name_zh: 王浑
  why_not: 品评进言配角，言散即没
- name_zh: 孔恂
  why_not: 进言蛟龙云雨之警语后无下文，非做事主体
- name_zh: 李熹
  why_not: 荐才一场即退场
- name_zh: 刘豹
  why_not: 世系交代人物，无做事周期
