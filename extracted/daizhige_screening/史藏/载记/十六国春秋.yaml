source: 史藏/载记/十六国春秋.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 刘渊
  score: 10
  worth_why: 做事流完整且本卷即备：为侍子洛阳遭非我族类之疑，任五部都尉收豪杰名儒之心；借司马颖危局请归会葬脱身，离石起兵二旬得众五万；关键定策在弃呼韩邪复业而称汉，以兄亡弟绍追尊汉祖以怀民望，元熙元年称汉王、永凤元年称帝，开十六国之局。名场面：蛟龙得云雨非复池中物、帝王岂有常哉与大禹生西戎文王生东夷之论
  era: 西晋末·汉赵开国
  dates_known: true
- name_zh: 苻坚
  score: 10
  worth_why: 前秦录主角：纳王猛整饬法制，灭前燕前凉取代国统一北方；淝水之战为投鞭断流与草木皆兵等成语诞生点，由极盛而骤崩，兴亡教训链完整
  era: 十六国·前秦
  dates_known: true
- name_zh: 石勒
  score: 9
  worth_why: 后赵录主角：由掠卖为奴至据襄国称赵王，用张宾设君子营、立太学，兼并前赵成一统北方之业，奴隶到帝王的完整做事周期
  era: 十六国·后赵
  dates_known: true
- name_zh: 王猛
  score: 9
  worth_why: 扪虱谈天下而出山，明法峻刑整肃权贵，助坚富国强兵；临终戒勿图晋，死后前秦速衰，是谋臣典范兼预言式教训
  era: 十六国·前秦
  dates_known: true
- name_zh: 慕容垂
  score: 9
  worth_why: 十三岁为将、枋头败桓温，遭猜忌投苻坚忍辱多年，淝水后复国建后燕，人生三段落完整可考
  era: 十六国·后燕
  dates_known: true
- name_zh: 刘聪
  score: 8
  worth_why: 陷洛阳长安俘二帝，酿永嘉之祸的关键执行者；其后荒纵失政致国乱，功业与崩坏对照鲜明
  era: 十六国·汉赵
  dates_known: true
- name_zh: 刘曜
  score: 8
  worth_why: 本卷已见其取泫氏屯留守长子的锋芒；后陷长安灭西晋、迁都长安建前赵称帝，终与石勒决战洛阳兵败身死，兴亡节点齐全
  era: 十六国·前赵
  dates_known: true
- name_zh: 赫连勃勃
  score: 8
  worth_why: 叛后秦建大夏，筑统万城穷极工巧，以残暴立国驭下，制度奇观与暴政警示双面样本
  era: 十六国·夏
  dates_known: true
- name_zh: 慕容恪
  score: 8
  worth_why: 前燕柱石：野王之战擒冉闵、辅幼主而终身不篡，十六国罕见的贤臣完整周期
  era: 十六国·前燕
  dates_known: true
- name_zh: 刘宣
  score: 7
  worth_why: 本卷关键谋主：断言司马氏骨肉相残是天厌晋德授之于我，力促复呼韩邪之业，后为汉国丞相定政柄方向；劝进一节有完整谋议流
  era: 西晋末·汉赵
  dates_known: true
- name_zh: 张轨
  score: 7
  worth_why: 保凉州一隅、兴学校御寇乱，前凉基业自其开创流而来，乱世守土的正面样本
  era: 西晋末·前凉
  dates_known: true
- name_zh: 石虎
  score: 7
  worth_why: 夺位杀嗣、穷奢极役，后赵由盛速乱，暴政反面教训的完整样本
  era: 十六国·后赵
  dates_known: true
- name_zh: 王弥
  score: 6
  worth_why: 起兵青徐自称征东大将军，转战四州，败于洛阳后归渊拜镇东大将军；本卷仅见后半段，做事流需后卷补全，缓录
  era: 西晋末
  dates_known: true
rejections:
