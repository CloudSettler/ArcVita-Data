source: 史藏/载记/十六国春秋别传.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 刘渊
  score: 9
  worth_why: 鄙随陆无武、绛灌无文而文武兼修；趁八王之乱起兵，缓称帝先称汉王，追尊刘禅立汉宗庙收民心，开十六国之局
  era: 西晋末
  dates_known: true
- name_zh: 刘聪
  score: 7
  worth_why: 陷洛阳俘怀帝、破长安俘愍帝，青衣行酒洗爵为名场面；晚年荒暴致祸乱根源，可为反面之训
  era: 十六国前赵
  dates_known: true
- name_zh: 石勒
  score: 10
  worth_why: 从奴隶至开国称帝，设君子营兴学，令人读汉书讲与己听，自比高祖光武；做事流与名场面俱全
  era: 十六国后赵
  dates_known: true
- name_zh: 张轨
  score: 8
  worth_why: 风疾喑语犹力疾理事，破鲜卑保凉州，终身尊晋不称制，前凉数十年基业之祖
  era: 西晋末前凉
  dates_known: true
- name_zh: 苻坚
  score: 10
  worth_why: 用王猛整饬内政，灭燕平凉统一北方；淝水投鞭断流败于草木皆兵，盛极而亡为千古教训
  era: 十六国前秦
  dates_known: true
- name_zh: 王猛
  score: 9
  worth_why: 扪虱而谈天下略，治秦十余年路不拾遗；临终戒勿图晋、防鲜卑羌虏，言中而坚不从
  era: 十六国前秦
  dates_known: true
- name_zh: 慕容恪
  score: 8
  worth_why: 为将擒冉闵平中原，为臣受托摄政辅幼主终不负，史称古之遗爱
  era: 十六国前燕
  dates_known: true
- name_zh: 慕容垂
  score: 8
  worth_why: 忍辱事秦数十年，淝水溃军中独全三万，复建后燕；末路呕血而终，起伏完整
  era: 十六国后燕
  dates_known: true
- name_zh: 姚兴
  score: 7
  worth_why: 崇儒兴学，迎鸠摩罗什译经长安，周旋诸强保关中，文治可观
  era: 十六国后秦
  dates_known: true
- name_zh: 吕光
  score: 7
  worth_why: 万里西征破龟兹，携鸠摩罗什东归，闻苻坚凶问遂据凉州建后凉
  era: 十六国后凉
  dates_known: true
- name_zh: 李暠
  score: 7
  worth_why: 立国敦煌劝课农桑兴儒学，遗令保境安民，后为唐室追尊之祖
  era: 十六国西凉
  dates_known: true
- name_zh: 沮渠蒙逊
  score: 7
  worth_why: 博涉群史有雄略，灭西凉破南凉，北凉达于全盛，兼崇佛法译经
  era: 十六国北凉
  dates_known: true
- name_zh: 赫连勃勃
  score: 7
  worth_why: 筑统万城锥入一寸即杀匠，袭取长安称帝；穷奢骄暴而国祚骤短，可为奢暴之鉴
  era: 十六国夏
  dates_known: true
rejections:
- name_zh: 刘曜
  why_not: 传文止于营寿陵之谏，前段仅及奔丧改号迁都，做事周期欠完整，宜缓录
- name_zh: 刘粲
  why_not: 即位月余为靳准所弑，无做事周期
- name_zh: 靳准
  why_not: 作乱屠刘氏旋即败亡，仅乱臣一笔
