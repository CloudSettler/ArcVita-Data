category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 杨行密
  score: 9
  worth_why: 从应募戍卒起兵庐州，逐秦彦、破孙儒、清口之战拒朱温，奠基吴国江淮霸业；晚年缚子权谋足疾授政，做事流完整，为十国第一等创业之主
  era: 唐末五代初
  dates_known: true
- name_zh: 李昪
  score: 9
  worth_why: 彭城孤儿流入濠州，为杨行密养子转徐温家，从升州戍将经营吴政十余年，禅代建唐称帝；保境安民不烦兵戈，起微贱至立国，兴衰因果俱全
  era: 五代十国
  dates_known: true
- name_zh: 李煜
  score: 9
  worth_why: 词开一代之词宗，问君能有几多愁；偏安误国、肉袒出降、牵机药之殒，既是名场面策源地又是亡国教训的教科书
  era: 五代末宋初
  dates_known: true
- name_zh: 钱镠
  score: 9
  worth_why: 私盐贩起家定两浙，射潮筑塘兴水利，陌上花开可缓缓归矣；保境安民、善事中国使吴越国祚克永，治绩与身退俱可师法
  era: 唐末五代
  dates_known: true
- name_zh: 刘仁赡
  score: 8
  worth_why: 周师压境独守寿州经年，妻儿将陷犹自坚守，城破而病笃不降；欧阳修五代史立传者独数人，忠义名场面之典范
  era: 五代末
  dates_known: true
- name_zh: 徐温
  score: 8
  worth_why: 自私盐队正至吴大丞相，立杨氏傀儡政自己出，内定杨隆演之变、外拓疆土；养子李昪承其业，权臣理政的完整周期
  era: 唐末五代
  dates_known: true
- name_zh: 王审知
  score: 8
  worth_why: 随兄光州起兵入闽，绳床家什怀度闽武宁；开闽圣王招徕海商、兴学四门、劝农薄赋，闽中人文自始盛
  era: 唐末五代
  dates_known: true
- name_zh: 王建
  score: 8
  worth_why: 从无赖屠牛贩盐到前蜀高祖，唐亡后称帝成都；晚年宠信宦官佞幸，子衍嗣位七年而亡，成败两面皆是教材
  era: 唐末五代
  dates_known: true
- name_zh: 孟昶
  score: 7
  worth_why: 颁官箴尔俸尔禄民膏民脂成后世戒石铭；纳花蕊夫人、春联之始、蜀中富庶；然恃险无备十四万人齐解甲，教训深刻
  era: 五代末宋初
  dates_known: true
- name_zh: 高季兴
  score: 7
  worth_why: 僮仆出身历四主镇荆南，截留贡物号为高赖子，朝秦暮楚而小国幸存；乱世弱势生存术的标本，兼作警示
  era: 唐末五代
  dates_known: true
- name_zh: 马殷
  score: 7
  worth_why: 木匠出身为孙儒裨将，入潭州建楚国；听高郁策不征商旅、以茶易马，楚地遂富；后子孙相残而国亡，兴衰两段皆可考
  era: 唐末五代
  dates_known: true
- name_zh: 韦庄
  score: 7
  worth_why: 秦妇吟内库烧为锦绣灰一句写尽黄巢之乱，为长安第一哭；晚年佐王建开国前蜀为宰相，词花间领袖，事与文并传
  era: 唐末五代
  dates_known: true
- name_zh: 钱俶
  score: 7
  worth_why: 纳土归宋不以一姓存亡苦两浙生民，为吴越善终；与先人三世保境相接，成一国息兵安民之终章
  era: 五代末宋初
  dates_known: true
- name_zh: 罗隐
  score: 6
  worth_why: 十上不第而讽刺诗圣手，今朝有酒今朝醉传诵千年；依钱镠为节度判官，谏阻兴兵讨梁，名士幕僚流完整可采
  era: 唐末五代
  dates_known: true
