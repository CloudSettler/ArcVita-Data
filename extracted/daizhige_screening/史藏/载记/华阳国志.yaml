source: 史藏/载记/华阳国志.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 李冰
  score: 10
  worth_why: 卷三蜀志载其壅江作堋、穿二江成都之中，都江堰奠基使天府由成；治水做事流完整，中国工程史第一梯队的名场面
  era: 战国末秦昭王时
  dates_known: true
- name_zh: 巴蔓子
  score: 9
  worth_why: 借楚兵平巴乱许以三城，城不可与，宁自刎以头授楚使，楚巴各以上卿礼葬其头身；忠信两全的千古名场面
  era: 战国周之季世
  dates_known: true
- name_zh: 文翁
  score: 9
  worth_why: 卷三载其立石室精舍讲堂、遣弟子诣京受业还授蜀士，蜀学比于齐鲁；开地方官学先河，教化做事流完整
  era: 西汉景帝末
  dates_known: true
- name_zh: 司马相如
  score: 8
  worth_why: 卷十士女载其以子虚上林开汉大赋体为赋圣；奉使通西南夷抚定巴蜀；琴挑文君凤求凰名场面
  era: 西汉景武之际
  dates_known: true
- name_zh: 扬雄
  score: 8
  worth_why: 卷十士女载其仿易作太玄、撰方言法言，旷代大儒；不阿附王莽，投阁几死而守拙著书，可为后世镜鉴
  era: 西汉末至新莽
  dates_known: true
- name_zh: 陈寿
  score: 8
  worth_why: 卷十一后贤志载其由蜀入晋撰三国志，虽遭黜废仍勒成一家国史；著史做事流完整
  era: 三国末至西晋
  dates_known: true
- name_zh: 李密
  score: 8
  worth_why: 卷十一后贤志载其以陈情表辞晋官尽孝祖母，情辞动天下，后出仕至汉中太守；忠孝两难的抉择范本
  era: 三国末至西晋
  dates_known: true
- name_zh: 张仪
  score: 7
  worth_why: 本卷载其灭蜀执巴王、置三十一县城江州；合前史更有连横破纵、欺楚六百里等名场面
  era: 战国
  dates_known: true
- name_zh: 司马错
  score: 7
  worth_why: 本卷载其与张仪伐蜀灭之，复自巴涪水取楚商于置黔中郡；力主伐蜀收天府实利，战略决策与执行俱佳
  era: 战国秦惠文王至昭襄王时
  dates_known: true
- name_zh: 张鲁
  score: 7
  worth_why: 卷二汉中志载其以五斗米道雄据巴汉近三十年，立义舍置义米宽刑惠政，封府库归曹得封侯保全；政教合一治理样本
  era: 东汉末
  dates_known: true
- name_zh: 李雄
  score: 7
  worth_why: 卷九载其率流民取成都建大成政权，在位约三十年轻徭薄赋兴学官；乱世治蜀样本，亦有立嗣失当之教训
  era: 西晋末至东晋初
  dates_known: true
- name_zh: 洛下闳
  score: 7
  worth_why: 本卷列名之巴郡阆中人，据汉书律历志应诏与唐都等造太初历，改元太初；历法改革名场面
  era: 西汉武帝时
  dates_known: true
- name_zh: 范目
  score: 7
  worth_why: 本卷载其说高祖募賨民为前锋定三秦，三受封三辞侯，世称三秦亡范三侯；巴渝舞定名之缘起人物
  era: 秦末汉初
  dates_known: true
- name_zh: 谯靖
  score: 6
  worth_why: 本卷载其为谏大夫数进忠言，避王莽不事公孙述，笑对药酒逼胁以气节自持，国人作诗颂之（一作谯玄）
  era: 西汉成哀之世至公孙述据蜀时
  dates_known: true
- name_zh: 王堂
  score: 6
  worth_why: 本卷载羌乱扰动巴中，其出为巴郡太守拨乱致治，贡举孝子隐士名儒俊士皆至大位，民为立祠
  era: 东汉安帝时
  dates_known: true
