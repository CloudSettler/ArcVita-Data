source: 史藏/载记/南诏野史.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 阁罗凤
  score: 9
  worth_why: 天宝战争两破唐军、鲜于仲通李宓皆全军覆没，事后立南诏德化碑自明不得已而叛唐、世世事唐之心，北臣吐蕃南并诸部，名场面与完整做事流俱全，奠定南诏极盛版图
  era: 唐天宝至大历间
  dates_known: true
- name_zh: 段思平
  score: 9
  worth_why: 借乌蛮三十七部之力起兵灭大义宁杨干贞建大理国，立国即免岁赋、赦囚徒、宽苛政，从落魄将裔到开国君主做事周期完整，大理国祚三百余年
  era: 五代末至宋初
  dates_known: true
- name_zh: 异牟寻
  score: 8
  worth_why: 采纳清平官郑回之策遣使通唐，点苍山会盟歃血立誓弃吐蕃归唐，又大破吐蕃取铁桥十六城，战略转向的关键决策与歃盟名场面俱备
  era: 唐贞元年间
  dates_known: true
- name_zh: 皮逻阁
  score: 8
  worth_why: 倚唐廷册封之势并吞五诏统一洱海，迁都太和城受封云南王，六诏归一由其手成，南诏真正奠基人，做事流完整
  era: 唐开元年间
  dates_known: true
- name_zh: 细奴逻
  score: 7
  worth_why: 自哀牢随父避难入蒙舍川、躬耕巍山起家，受张乐进求妻女逊国建大蒙国称奇嘉王，南诏开国第一人，本卷存其受禅始末
  era: 唐贞观至永徽间
  dates_known: true
- name_zh: 庄蹻
  score: 7
  worth_why: 楚将循江上略巴蜀黔中以西、以兵威定滇，归路为秦司马错所塞遂以其众王滇，受命、进军、转折、立国俱全，开华夏经略云南之始
  era: 战国楚顷襄王时
  dates_known: false
- name_zh: 史万岁
  score: 7
  worth_why: 隋开皇间以行军总管征南宁夷，西破三十余部，途遇武侯纪功碑，踣碑复树祭拜而去的传奇情节，征战功业与个人命运转折俱有戏剧性
  era: 隋开皇年间
  dates_known: true
- name_zh: 孟获
  score: 6
  worth_why: 本卷仅南征擒获一句，然七擒七纵、反侧心服的名场面他书可补，宜缓录并俟旁证
  era: 三国蜀汉
  dates_known: false
- name_zh: 郑买嗣
  score: 6
  worth_why: 权臣篡蒙氏自立建大长和国，尽灭蒙氏宗族，是南诏亡国与唐末云南变局的关键节点，可作权臣篡弑之鉴
  era: 唐末五代
  dates_known: true
rejections:
- name_zh: 九隆
  why_not: 触木感孕、龙舐其背皆为神话谱系，无年代无做事可考
- name_zh: 蒙苴笃
  why_not: 附会天竺阿育王子孙的谱系传说，只作南诏姓源坐标
- name_zh: 常羌
  why_not: 仅留汉孰与我大一问，本人无做事周期，仅作时间坐标
- name_zh: 雍闿
  why_not: 杀太守降东吴、旋为武侯所诛，逆臣速败无完整做事流
- name_zh: 龙佑那
  why_not: 仅受诸葛亮赐姓张、建号建宁国一事，身世依赖神话谱系
- name_zh: 张乐进求
  why_not: 本卷仅妻女逊国一事，传说铺垫成分重，缺乏独立做事周期
- name_zh: 杨干贞
  why_not: 总纲仅列名，作为段思平起兵的对手存在，无独立事迹
- name_zh: 赵善政
  why_not: 立国仅十月，本卷总纲一句带过
- name_zh: 高升泰
  why_not: 总纲仅列名，立大中国与临终还国于段事皆不载于本卷
- name_zh: 段正淳
  why_not: 总纲列名而已，本卷无其事迹
- name_zh: 凤伽异
  why_not: 仅筑拓东城一句，早卒未嗣位
- name_zh: 蒙世隆
  why_not: 本卷仅重铸天尊柱一句，其事迹详于后卷再议
