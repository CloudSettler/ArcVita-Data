verdict: has_candidates
candidates:
- name_zh: 钱镠
  score: 9
  worth_why: 起于石镜乡兵，三百人伏兵破黄巢前锋、八百里虚声退敌，吞沙誓江夜渡破刘汉宏，数年平定两浙；后保境安民、筑捍海塘、善事中原保全吴越，功成善终；做事流完整且多成语级场面，可为创业之范
  era: 唐末五代
  dates_known: true
- name_zh: 董昌
  score: 6
  worth_why: 自八都乡兵起家官至越州观察使，后僭号大越罗平旋为钱镠讨灭，可为拥兵自恃、僭妄速祸之鉴；本卷仅及其早年与钱镠之遇
  era: 唐末
  dates_known: true
rejections:
- name_zh: 黄巢
  why_not: 本卷仅作反派背景，被钱镠伏兵一击而退，其做事周期见新唐书通鉴，非此录主
- name_zh: 刘汉宏
  why_not: 叛将单线败亡，虽有金刀之谶斩白蛇等语，终局即灭，教训已并入钱镠传
- name_zh: 高骈
  why_not: 卷中仅数语观人之评，其淮南盛衰另见他传
- name_zh: 周宝
  why_not: 仅记其被逐一节
- name_zh: 薛朗
  why_not: 旋起旋灭，无完整做事周期
- name_zh: 杜棱
  why_not: 部将尔，传中仅列将名战功
- name_zh: 阮结
  why_not: 部将尔，传中仅列将名战功
