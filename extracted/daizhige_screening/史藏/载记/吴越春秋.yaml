source: 史藏/载记/吴越春秋.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 伍子胥
  score: 10
  worth_why: 由父兄冤死、亡命奔吴，到兴吴破楚、掘墓鞭尸，再到忠谏被谗、悬目东门，复仇与忠谏双线做事流最完整；过昭关、乞食吴市、鞭尸雪恨等名场面密集，模范与教训兼具
  era: 春秋末
  dates_known: true
- name_zh: 季札
  score: 8
  worth_why: 三让王位、耕于野以示不受，富贵之于我如秋风过耳一语即出本卷；复有观乐知政、挂剑徐君墓守信等名场面，让国与诚信的千古样板
  era: 春秋中期
  dates_known: true
- name_zh: 吴太伯
  score: 8
  worth_why: 三以天下让、断发文身入荆蛮、筑故吴城开创勾吴，从让位到立国的完整创业周期；让国德行的源头样板
  era: 商末
  dates_known: false
- name_zh: 古公亶父
  score: 7
  worth_why: 君子不以养害所养，避狄迁岐，一年成邑二年成都而民五倍其初，为周室崛起奠基的关键迁移决策
  era: 商末
  dates_known: false
- name_zh: 申公巫臣
  score: 7
  worth_why: 楚亡大夫适吴为行人，教吴射御、导之伐楚，一手将吴国拉入中原争霸体系，改变春秋地缘格局的操盘手
  era: 春秋中期
  dates_known: true
- name_zh: 后稷
  score: 6
  worth_why: 尧聘为农师教民山居稼穑，三年余民无饥乏之色，中华农耕源头人物；惜事迹多含感生传说
  era: 上古尧舜时
  dates_known: false
- name_zh: 伍举
  score: 6
  worth_why: 三年不飞不鸣一鸣惊人进谏的原型发言者，又谏章华台，伍氏三世为楚忠臣；一鸣惊人名场面可系于已在库之楚庄王传
  era: 春秋中期
  dates_known: true
- name_zh: 吴王寿梦
  score: 5
  worth_why: 朝周观礼、任巫臣始通中国，吴国崛起的坐标人物；事迹偏编年记事，个人做事流简略
  era: 春秋中期
  dates_known: true
- name_zh: 费无忌
  score: 5
  worth_why: 谗太子建、构陷伍奢致伍氏灭门，直接逼出伍子胥奔吴与吴破楚的连锁反应，谗臣祸国的反面教材；本卷未载其结局
  era: 春秋末
  dates_known: true
