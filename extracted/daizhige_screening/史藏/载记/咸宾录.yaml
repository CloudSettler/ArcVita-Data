source: 史藏/载记/咸宾录.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 箕子
  score: 8
  worth_why: 义不臣周东走朝鲜，教以礼义田蚕，制八条之约，邑无淫盗门不夜扃传四十余世，开化蛮荒的完整做事流
  era: 商末周初
  dates_known: true
- name_zh: 李勣
  score: 8
  worth_why: 历仕瓦岗至唐初三朝宿将，八十岁总统诸军灭高丽，围平壤受降执藏献俘昭陵，九百年高氏由此绝王
  era: 隋末唐初
  dates_known: true
- name_zh: 李世民
  score: 7
  worth_why: 大德观衅后定征服之志，亲征高丽拔辽东攻安市，驻跸山之战大破高延寿十五万援军勒石纪功，未竟全功为贞观之憾
  era: 唐初
  dates_known: true
- name_zh: 盖苏文
  score: 7
  worth_why: 弑建武屠大臣百余人自为莫离支专国柄，拒诏侵新罗挑起唐丽大战，死后诸子内讧终致国灭，权臣祸国的完整反面教材
  era: 唐初
  dates_known: true
- name_zh: 卫满
  score: 7
  worth_why: 燕人避乱东走朝鲜，击破王准自立为王，借外臣保塞之约以兵威财物侵并旁小邑，秽貊真番皆服传三世
  era: 汉初
  dates_known: true
- name_zh: 朱蒙
  score: 7
  worth_why: 感日影生卵善射出走，被追鱼鳖成桥得渡，至纥升骨城遂建高句骊，东亚开国神话的原型样本
  era: 西汉末
  dates_known: true
- name_zh: 毌丘俭
  score: 7
  worth_why: 正始间征高句骊破丸都城，遣王颀穷追千余里至肃慎南刻石纪功，纪功碑近代出土成实证，名将远征的完整样本
  era: 三国魏
  dates_known: true
- name_zh: 王建
  score: 7
  worth_why: 唐末中原多事乘时承高氏之位，并新罗百济定平壤为西京，立事大之策请命中国，高丽六百年基业的缘起
  era: 唐末五代
  dates_known: true
- name_zh: 杨广
  score: 6
  worth_why: 三征高丽倾国远讨，食尽师老转输不给诸军多败绩，穷兵黩武致天下丧乱，警示级的完整败亡周期
  era: 隋
  dates_known: true
- name_zh: 陈大德
  score: 6
  worth_why: 持节答劳实为观衅，厚饷官守遍历山川悉得其纤曲，归报一言催生征服高丽之志，战略侦察的经典案例
  era: 唐初
  dates_known: true
- name_zh: 王徽
  score: 6
  worth_why: 在位三十八年称东夷良主，遣使求医药画工请购典籍开文教之端，受契丹封册双面事大，处两强之间的生存样本
  era: 北宋
  dates_known: true
- name_zh: 王询
  score: 6
  worth_why: 契丹陷六城徙居以避，结女真设奇邀击杀戮契丹殆尽，绝境反转复国入贡的完整弧线
  era: 北宋辽
  dates_known: true
rejections:
- name_zh: 薛仁贵
  why_not: 传中仅以都督总兵镇安东一句，事迹简略宜待专门文献
- name_zh: 高藏
  why_not: 始终受制于权臣与强邻，仅作亡国符号与时间坐标
- name_zh: 涉何
  why_not: 仅见诱杀被戕一节，无做事周期
- name_zh: 杨仆
  why_not: 与荀彘两将不相能久无功，仅余将帅不和之戒，事迹过简
- name_zh: 位宫
  why_not: 勇力便鞍马而屡寇边终败走，教训单薄，宜作毌丘俭传注脚
- name_zh: 尼溪相参
  why_not: 仅一句使人杀右渠来降，无始末
- name_zh: 王禃
  why_not: 元代高丽诸王仅通使受封羁縻，无独立做事流
