source: 史藏/载记/増订南诏野史.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 皮逻阁
  score: 9
  worth_why: 并吞五诏独称南诏，南诏立国的总设计师，唐册云南王；洱海千年格局由此奠定，借势统一的决策链完整
  era: 唐开元间
  dates_known: true
- name_zh: 庄蹻
  score: 8
  worth_why: 奉楚命循江略定滇地，会秦攻黔中道塞归路断，遂以众王滇建滇国；缘起、关键抉择、结果俱全，庄蹻王滇为西南开发第一事
  era: 战国末楚顷襄王时
  dates_known: true
- name_zh: 细奴逻
  score: 7
  worth_why: 张乐进求见其奇相妻以女逊国与之，遂称奇嘉王建大蒙国；南诏开国起点，为全书叙事之枢
  era: 唐贞观初
  dates_known: true
- name_zh: 孟获
  score: 7
  worth_why: 南中耆帅，七擒七纵攻心之典的对手主角，反叛至心服的完整弧线，为后世攻心标本
  era: 三国蜀汉建兴间
  dates_known: true
- name_zh: 史万岁
  score: 7
  worth_why: 隋行军总管西征南宁破三十余部，遇建宁纪功碑见万岁之后胜我者过此之谶，踣碑复树的传奇名场面
  era: 隋开皇间
  dates_known: true
- name_zh: 段思平
  score: 7
  worth_why: 灭大长和一系建大理国，传十二世至元；总纲仅存其名，然立国一系为三十七蛮部与大理格局之始，可凭史补全
  era: 五代末至宋初
  dates_known: true
- name_zh: 张乐进求
  score: 6
  worth_why: 唐封首领大将军，观细奴逻有奇相遂妻以女逊国；识人让贤之禅，可为缓录
  era: 唐贞观间
  dates_known: true
- name_zh: 雍闿
  score: 5
  worth_why: 假鬼术杀建宁太守王昂叛归东吴任永昌守，终为诸葛南征所杀；权谋丧身的教训型样本，事迹略简
  era: 三国蜀汉建兴三年
  dates_known: true
- name_zh: 龙佑那
  score: 5
  worth_why: 受诸葛册封赐姓张，于白崖筑建宁城立铁柱号建宁国；受封型事迹，可缓录作南诏前史坐标
  era: 三国蜀汉建兴三年
  dates_known: true
