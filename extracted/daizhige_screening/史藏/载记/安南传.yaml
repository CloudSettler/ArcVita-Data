candidates:
- name_zh: 陈日烜
  score: 9
  worth_why: 元兵三破其国杀获几十万，弃都走清化而终不降，弟益稷降元独守节，末以代身金人赎罪止战；以弱抗强、久持得存的完整做事流
  era: 宋末元初
  dates_known: true
- name_zh: 黎桓
  score: 8
  worth_why: 主少国疑之际锢璇专权、败宋两路之师，旋以谢罪纳贡换得封号，阳奉阴违岁掠边民；权谋自立的完整周期，可为机变与骄纵之鉴
  era: 北宋初
  dates_known: true
- name_zh: 陈日照
  score: 8
  worth_why: 福州亡命人谢升卿变姓名入安南，应试居首、王女自窓窥悦而得国；拒元使被笞几死、匿海岛复归，终传位子威晃；寒微腾挪成事的传奇样本
  era: 南宋末
  dates_known: true
- name_zh: 黎季牦
  score: 8
  worth_why: 两弑其主、屠戮勋贤、改姓名胡一元、诈称陈甥欺瞒明朝求封，终为裴伯耆诣阙告发；篡逆全过程俱全，警示价值极高
  era: 明初
  dates_known: true
- name_zh: 陈叔明
  score: 7
  worth_why: 弑日熞自立，遣使伪称病故而贡表被曾鲁识破；授政其弟而实自专制，遥制国政的权臣典型
  era: 明初
  dates_known: true
- name_zh: 陈诚
  score: 7
  worth_why: 奉使与安南议还思明侵地，却其重贿沉檀，以尉佗抗汉、陆贾受赂贾祸之史折服日焜；不辱使命、不贪赆遗的外交模范
  era: 明洪武末
  dates_known: true
- name_zh: 丁部领
  score: 6
  worth_why: 起驩州悉逐捕乱者、自称大胜王，旋内附受封进交趾郡王；事迹简略但缘起抉择结果俱全
  era: 五代末至北宋初
  dates_known: true
- name_zh: 裴伯耆
  score: 5
  worth_why: 陈氏覆亡之际弃军遁海岛、附番舶间关赴阙告急，泣陈季牦之恶；孤臣忠义标本而事迹止于告发
  era: 明洪武末
  dates_known: true
- name_zh: 曾鲁
  score: 5
  worth_why: 于贡表副纸识破前王已死叔明擅立之伪，诘使得实；明察细行的小场面，可为僚属尽职之范
  era: 明洪武
  dates_known: true
