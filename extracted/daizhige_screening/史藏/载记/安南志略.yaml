source: 史藏/载记/安南志略.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 马援
  score: 9
  worth_why: 伏波将军平交趾、立铜柱为汉界；浪泊军中飞鸢跕跕之叹见其壮志；劳军语少游事见其襟怀，做事流完整且为后人立志范本
  era: 东汉初
  dates_known: true
- name_zh: 赵佗
  score: 8
  worth_why: 秦南海尉据岭南自立建国，历五帝而国祚近百年；借太子始与媚珠偷换弩机智取安阳王，名场面俱全；创业守成皆可师
  era: 秦末汉初
  dates_known: true
- name_zh: 黎崱
  score: 7
  worth_why: 仕安南至节度使，降元后不忘陈键志不伸名不彰，居汉阳撰安南志略二十卷以纠元史之讹；以著书存故人之志，立言垂世
  era: 宋末元初
  dates_known: false
- name_zh: 李公蕴
  score: 7
  worth_why: 建立李朝，真宗时迁都大罗城（升龙），奠河内千年都城之基；迁都诏为越南传世名文
  era: 北宋初
  dates_known: true
- name_zh: 路博德
  score: 7
  worth_why: 首任伏波将军，灭南越、开九郡，岭南自此郡县化；东坡记推为有功岭南之民、庙食海上
  era: 西汉武帝时
  dates_known: true
- name_zh: 陈兴道
  score: 7
  worth_why: 兴道王隐兵万劫山，白藤江之战三败蒙元大军，越南救国第一名将；本书为其时代之史源
  era: 南宋末元初
  dates_known: true
- name_zh: 徵侧
  score: 6
  worth_why: 女子举兵震动六十余城，虽为马援所平，实开越南二征之统；胜败两面皆足为训
  era: 东汉初
  dates_known: true
- name_zh: 吴权
  score: 6
  worth_why: 五季间爱州人领交阯，白藤江大破南汉，交趾自此脱离千年郡县之局
  era: 五代十国
  dates_known: true
- name_zh: 陈仁王
  score: 6
  worth_why: 弃位隐武林洞成道，号竹林道士，创竹林禅派、有诗集传世；先曾与兴道王共抗元军，帝王转身入道之例
  era: 南宋末元初
  dates_known: true
- name_zh: 丁部领
  score: 5
  worth_why: 五季末平十二使君之乱，起家华闾立丁朝，开交趾自主建国之局；事迹在本书尚简
  era: 五代末宋初
  dates_known: true
rejections:
- name_zh: 陈键
  why_not: 仅见其率黎崱出降、归途为其国邀击殁于军，无完整做事周期，其志仅借黎崱之书以传
- name_zh: 安阳王
  why_not: 神弩一发杀万人、媚珠易弩机等事多神话传说，年代茫昧不可考
- name_zh: 吕嘉
  why_not: 仅一句记其叛杀王及汉使，继为路博德所灭，做事流不具
- name_zh: 郭逵
  why_not: 仅富良江败交阯一句提及，胜而罢兵，本书无其事之全程
- name_zh: 高骈
  why_not: 仅继张伯义张舟增修罗城一句，其平南诏大节不在本书
- name_zh: 沈佺期
  why_not: 仅以流驩州附崇山一诗，诗文流别非做事轴所重
- name_zh: 刘方
  why_not: 仅都隆岭败林邑王一役一句，无做事周期
- name_zh: 冲天王
  why_not: 里巷传说腾空而去，无年代事迹可稽
