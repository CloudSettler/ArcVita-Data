verdict: has_candidates
candidates:
- name_zh: 黄遵宪
  score: 9
  worth_why: 使日参赞创《日本国志》，采书二百余种、费日力八九年成四十卷五十万言；中途调美、谢绝南洋巡察之命闭门续成，做事决策链完整；甲午前先察日本维新之兴，开中国人系统研究日本之先河
  era: 清末光绪
  dates_known: true
- name_zh: 神武天皇
  score: 8
  worth_why: 会族议定东略之策，率师东征讨平长髓彦与八十枭贼，七年而成帝业；迁都大和、置国造县主、立祭祀行赏，建国做事周期完整；惟年代属传说，仅世系相对可考
  era: 上古日本
  dates_known: false
- name_zh: 崇神天皇
  score: 7
  worth_why: 号御肇国天皇；始校户口、课男女调役、造舟船开沟洫、遣使将兵巡察诸国，神话王权转向行政治国的开端；文中系其即位于汉武天汉四年，可作东亚纪年锚点
  era: 上古日本
  dates_known: true
- name_zh: 徐福
  score: 7
  worth_why: 为始皇求仙药率三千童男女东渡，居熊野浦；中日交通源头性人物，衍生日本自称泰伯徐福后之说，徐福东渡为千年名场面
  era: 秦
  dates_known: true
- name_zh: 平清盛
  score: 8
  worth_why: 武家执国柄之始，经略西国开日宋贸易；平氏兴衰即序所谓强臣擅命之第一环，荣枯教训完整
  era: 日本平安末
  dates_known: true
- name_zh: 源赖朝
  score: 9
  worth_why: 起兵灭平氏，开镰仓幕府创武家政权，置守护地头；将军擅权七百年格局由此奠基，太阿下移而玉步未改之始作俑者
  era: 日本镰仓初
  dates_known: true
- name_zh: 北条时宗
  score: 8
  worth_why: 得元国书斩使拒降，集兵御两藩；弘安之役元军覆没，即序文所谓元祖黩武丧师之对手方，以小抗大的防御典范
  era: 日本镰仓中
  dates_known: true
- name_zh: 足利义满
  score: 7
  worth_why: 创室町幕府、平南北朝分裂；受明封日本国王重启通贡，扭转倭寇交恶之局，乱局收束与外交转向兼备
  era: 日本室町初
  dates_known: true
- name_zh: 织田信长
  score: 9
  worth_why: 尾张布武，破今川、灭武田、逐足利，行乐市乐座、以铁炮革新战法；将成霸业而殒于本能寺，功败垂成之千古名场面
  era: 日本战国
  dates_known: true
- name_zh: 丰臣秀吉
  score: 9
  worth_why: 出身微贱继信长遗业，传檄九州奥羽终成一统，太阁检地刀狩令奠定治体；晚年侵朝黩武丧师身死政倾，功业与覆辙一体两面
  era: 日本桃山
  dates_known: true
- name_zh: 德川家康
  score: 9
  worth_why: 忍数世之下终以关原一战定鼎，开江户幕府致太平二百六十余年；隐忍待时与制度建设双典范，八百年霸政就此收束
  era: 日本战国末至江户初
  dates_known: true
- name_zh: 源光国
  score: 7
  worth_why: 水户藩主设史馆修《大日本史》，驳日本为泰伯徐福后之说以立国史正统；数十年修史事业，开后尊王思想之先，文中明引其驳议
  era: 日本江户初
  dates_known: true
- name_zh: 忽必烈
  score: 7
  worth_why: 建元定鼎灭宋一统，然两征日本黩武丧师，误用降将覆军于海风，即序文所谓元祖误用降将黩武丧师；扩张失度之典型教训
  era: 元
  dates_known: true
- name_zh: 薛福成
  score: 6
  worth_why: 出使英法义比四国，谙外国情势；于巴黎为《日本国志》作序定为奇作，促其刊行传世；本文所见仅使节著述一斑
  era: 清末光绪
  dates_known: true
