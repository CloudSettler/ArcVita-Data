source: 史藏/载记/朝鲜史略.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 朱蒙
  score: 8
  worth_why: 感日影卵生、七岁善射遭诸子忌害出逃，鱼鳖成桥渡掩防水脱追兵，遇三贤至卒本建国高句丽，并松壤、荇人、北沃沮，创业流完整兼有名场面
  era: 西汉元帝建昭二年至新莽时
  dates_known: true
- name_zh: 箕子
  score: 8
  worth_why: 商亡率五千人东渡封于朝鲜，设八条之教立法，教民礼义田蚕织作，其民终不相盗、无门户之闭，文明移植的完整做事流
  era: 商末周初
  dates_known: true
- name_zh: 温祚
  score: 7
  worth_why: 择都慰礼城胜兄沸流之湿地咸卤，患靺鞨屡迁都以避，以乙音解娄为右辅委兵事，定疆域创百济，识地识人之鉴
  era: 西汉末
  dates_known: true
- name_zh: 衞满
  score: 7
  worth_why: 燕人因卢绾之乱亡命渡浿水，诱逐箕准据王俭城称王，传至孙右渠不奉汉诏为武帝所灭，流亡夺国至覆灭的兴亡周期
  era: 汉初
  dates_known: true
- name_zh: 赫居世
  score: 7
  worth_why: 卵生为六村共立建新罗，与阏英号二圣劝督农桑，不伐马韩之丧使民敬让，乐浪见其夜户不扃引兵自退
  era: 西汉宣帝五凤元年
  dates_known: true
- name_zh: 无恤
  score: 6
  worth_why: 号大武神王，北伐扶余阵斩带素，征盖马灭乐浪，勾茶畏威来降；然信内谗杀贤子好童，武功与家祸并存为训
  era: 东汉建武年间
  dates_known: true
- name_zh: 好童
  score: 6
  worth_why: 遭嫡母谗构，不肯自辩以免显母之恶贻父之忧，伏剑死，忠孝两难的悲剧名场面
  era: 东汉初
  dates_known: true
- name_zh: 儒理
  score: 5
  worth_why: 存问鳏寡孤独赈老病，邻国归附者众；分六部赐李崔孙郑裴薛姓，置十七品官制，作会苏曲，制度草创者
  era: 两汉之际
  dates_known: true
- name_zh: 昔脱解
  score: 5
  worth_why: 椟中卵生漂海至阿珍浦，身长九尺智识过人，为王婿任大辅委军国政事，终代朴氏为王
  era: 东汉初
  dates_known: true
- name_zh: 解明
  score: 5
  worth_why: 恃强力弯折黄龙国强弓结怨邻国，父命难逃，走马触枪而死年二十一，恃气招祸之戒
  era: 王莽当政时
  dates_known: true
- name_zh: 箕准
  score: 5
  worth_why: 为衞满诱逼浮海南奔，居金马郡号韩王，统国五十四，亡国之君海外另起一支
  era: 汉初
  dates_known: true
- name_zh: 解忧
  score: 5
  worth_why: 号慕本王，暴戾不仁卧则枕人、射杀谏者，终为杜鲁所弑，暴君覆身之鉴
  era: 东汉建武年间
  dates_known: true
- name_zh: 金首露
  score: 4
  worth_why: 龟峯金合开视六金卵化男，众推始生者为主建国驾洛伽倻，神话开国但事迹简略
  era: 东汉建武十九年
  dates_known: true
rejections:
- name_zh: 檀君
  why_not: 神话传说寿逾四千、历箕子千年相隔，无可考做事流，仅宜作纪年坐标
- name_zh: 沸流
  why_not: 择弥邹忽水土咸湿不能居，见弟宫室之盛惭愤而死，仅一事无做事周期
- name_zh: 金蛙
  why_not: 主为朱蒙与柳花故事的背景板，自身无独立做事流
- name_zh: 柳花
  why_not: 河伯女感日影娠卵的传说人物，无独立事迹
- name_zh: 邹勃素
  why_not: 仅过而能改善莫大焉一言，其人不足成篇
- name_zh: 瓠公
  why_not: 聘马韩辩而不辱一节生动，其余零散，量不足录
- name_zh: 乙豆智
  why_not: 将佐仅一见，无独立做事流
- name_zh: 怪由
  why_not: 随征斩带素一笔带过，无独立做事流
- name_zh: 阏英
  why_not: 内辅事迹附于赫居世，不单列
- name_zh: 杜鲁
  why_not: 弑慕本王一笔带过，无做事流
- name_zh: 阏智
  why_not: 金城林间椟中得儿而已，无事迹
- name_zh: 仇都
  why_not: 贪暴被废谢罪改过，仅作邹勃素一语的注脚
