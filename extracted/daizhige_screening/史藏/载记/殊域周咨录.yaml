category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 朱元璋
  score: 9
  worth_why: 淮右布衣起于乱世，误入行伍而终成大业，西平陈友谅、东缚张士诚、南定闽粤、北逐胡元建大明；致高丽玺书论耽罗事宜，以治大国如烹小鲜自警，宽而不急不因小隙构大祸——缘起、征战、开国、驭夷阶段俱全，白手起家的开国做事流范本
  era: 元末明初
  dates_known: true
- name_zh: 严从简
  score: 6
  worth_why: 以行人司行人自任周咨之志，遍考殊域使节勘讨守御始末，重校成《殊域周咨录》以畀僚属便览，存明代朝鲜、日本、安南诸夷外交档案——以著述为做事主线可成时间轴，惜本录仅存其序，生卒不详，宜缓录
  era: 明嘉靖至万历间
  dates_known: false
- name_zh: 王建
  score: 6
  worth_why: 五代唐时代高氏而起，辟地益广，并古新罗、百济而为一，建都松岳以平壤为西京，国祚四百余年未易姓——统一建国线完整，然本录仅一句带过，需另据史料补全阶段
  era: 唐末五代
  dates_known: true
rejections:
