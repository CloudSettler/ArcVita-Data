  why_not: 传中仅见上表贺即位、受封受赐的应答角色，无独立做事周期
- name_zh: 卫满
  why_not: 仅一句燕人卫满据其地，事迹无展开
- name_zh: 箕子
  why_not: 仅周封箕子于此一句，无做事流
- name_zh: 徐师昊
  why_not: 代祀高丽山川的使臣，事迹单一无阶段
- name_zh: 契斯
  why_not: 传玺书赐封的使臣，无事迹展开
- name_zh: 陈理
  why_not: 陈友谅之子，被安置高丽的降侯，无做事
- name_zh: 明升
  why_not: 明玉珍之子，同被安置高丽，无做事
- name_zh: 陈友谅
  why_not: 仅作为太祖西平的对象被提及，本录无其做事线
- name_zh: 明玉珍
  why_not: 仅一句提及其子明升来历，无事迹
- name_zh: 公孙度
  why_not: 仅开府行牧辽东三传而灭一句，无阶段可考
- name_zh: 高琏
  why_not: 仅入据其地称高丽王一句，无做事流
