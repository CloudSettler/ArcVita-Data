category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 孙晟
  score: 9
  worth_why: 淮岸啮虱骗退追骑之名场面；奔南唐预禅代秘计；后使后周被执，反劝寿州坚守，就刑不挠，忠节之模
  era: 五代南唐
  dates_known: true
- name_zh: 韩熙载
  score: 8
  worth_why: 自北奔南献复中原之策，后周取江北而验；自污避相，韩熙载夜宴图千古名场，乱世全身之智与悲
  era: 五代南唐
  dates_known: true
- name_zh: 李煜
  score: 8
  worth_why: 千古词帝，虞美人浪淘沙皆名篇；肉袒出降至违命侯，为君弱而词工的亡国镜鉴；君主故降权
  era: 南唐末
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 受命渡江平江南，围金陵不屠、市不易肆，与卷中曹翰屠江州正成对照，仁师之范；传文仅点渡江节点，事迹凭史补
  era: 北宋初
  dates_known: true
- name_zh: 徐铉
  score: 7
  worth_why: 历三朝文翰领袖；使宋抗辩不辱；徐州拾宿金弗取见廉；归宋校订说文成大徐本
  era: 南唐至宋初
  dates_known: true
- name_zh: 宋齐丘
  score: 7
  worth_why: 烈祖禅代之谋主；好交术士门客八百见权势之盛；功高压主终被幽死，权臣镜鉴
  era: 五代南唐
  dates_known: true
- name_zh: 李昪
  score: 7
  worth_why: 孤儿至开国之君，保境安民轻徭薄赋，临终诫毋轻兵；然君主低优先仅中评
  era: 五代南唐
  dates_known: true
- name_zh: 冯延巳
  score: 6
  worth_why: 吹皱一池春水，词开北宋风气；然相位争议政事无成，做事流弱
  era: 五代南唐
  dates_known: true
- name_zh: 徐锴
  score: 6
  worth_why: 说文系传为文字学代表之作；然传文仅见久抑中书舍人之琐事
  era: 五代南唐
  dates_known: true
- name_zh: 张崇
  score: 6
  worth_why: 渠伊钱捋须钱为暴敛成语之源，酷吏警示之典
  era: 五代南唐
  dates_known: true
