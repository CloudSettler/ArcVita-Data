source: 史藏/载记/江南别录.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 李昪（南唐烈祖）
  score: 9
  worth_why: 孤儿为杨行密、徐温两代所养，被杖逐仍拜迎门外以孝闻；朱瑾之变轻舟渡江镇定内外而得政，以爱民节用为本、增修法度人获乂安，勤政殿视政虽徒隶必引见；受吴禅复姓李、国号唐，曹马之事非朕志不迁让皇；晚年服丹而殂、囓指诫子北方有事——寒微立国、仁俭治国、丹药自毁俱全，创业守成两面镜
  era: 唐末五代十国（杨吴至南唐）
  dates_known: true
- name_zh: 徐温（义祖）
  score: 8
  worth_why: 黑云长剑裨将累功迁右职，众中凛然号徐嗔；用严可求、锺泰章之谋诛张颢专淮南军政；威服李遇、李德诚诸勋旧；亲子知训败事后转托养子烈祖；与后唐庄宗争得敌国之礼；知烈祖终为己害而以恩义不忍废——从裨将到无冕之王的完整周期，权谋与恩义双面样本
  era: 唐末五代（杨吴）
  dates_known: true
- name_zh: 宋齐丘
  score: 7
  worth_why: 羁旅淮南无纸墨行叹道中，得倡妇一饭之助，贵后纳为正室；与烈祖为布衣交动静皆谋；一言断京口隔一水可观知训之变，为烈祖定镇定内外之局——寒士起家到开国谋主的完整起家流
  era: 唐末五代（杨吴至南唐）
  dates_known: true
- name_zh: 朱瑾
  score: 7
  worth_why: 悉心教知训兵而遭夜遣壮士刺杀，手刃数人埋于舍后；约别席上以笏击踣斩知训首，宣言为国去贼、为民去害；宣王以衣障面曰勿累于我，瑾叹误我大事遂自杀——受教反噬、手刃国贼、不见信于君而自尽的烈性悲剧
  era: 唐末五代（杨吴）
  dates_known: true
- name_zh: 杨行密（吴武王）
  score: 7
  worth_why: 亲犯矢石创杨吴基业，黑云长剑劲兵数万为淮南立国之本；疾亟召谋后事不答周隐授刘威之议，卒立幼子启权臣之局；复杏旧名而故老泣下——此卷仅存奠基剪影，宜并他史补全做事流
  era: 唐末（杨吴）
  dates_known: true
- name_zh: 张颢
  score: 6
  worth_why: 与徐温同为衙内列校，不平景王亲吏凌逼，拥长刀百人直进逼宫诛左右并弑景王；背约欲自立为严可求所沮，复欲害徐温反被诛——弑主背盟旋踵身灭，警示周期完整
  era: 唐末五代（杨吴）
  dates_known: true
- name_zh: 元宗（李璟）
  score: 6
  worth_why: 幼为义祖所器，让皇称朕诸子皆不及；烈祖殂固逊诸弟，为徐玠以尊先旨承孝道所强立；改元保大、立皇太弟，建州之役由冯延鲁急进而启——本卷传文至福州之围中断，仅见践位初政，宜缓录待补
  era: 五代十国（南唐）
  dates_known: true
rejections:
- name_zh: 杨渥（景王）
  why_not: 居丧掘地为室作乐、夜然巨烛击球、单马出游，昏虐取祸，仅作被弑时间坐标
- name_zh: 杨隆演（宣王）
  why_not: 傀儡之君，朱瑾之变以衣障面曰此事阿舅自为勿累于我，无自主决断与作为
- name_zh: 杨溥（让皇）
  why_not: 受禅让皇，徒为禅代事件坐标，君主低优先
- name_zh: 徐知训
  why_not: 骄暴不奉法，呼烈祖乞子、造土室偶人咒父、扬言杀德诚并其妻，卒为朱瑾所诛——恶少年反面样本，但全依附他人变局，不足独立成轴
- name_zh: 徐知询
  why_not: 威权同父而暗懦，内为诸弟所构外为徐玠所卖，尽夺其兵——权斗注脚可附徐温、李昪传
- name_zh: 徐知诲
  why_not: 醉刺吕氏及鬼祟索命琐闻，后掌浮屠修造蠹政仅一笔，志怪附会非做事流
- name_zh: 严可求
  why_not: 仅沮张颢自立与共谋诛颢两笔，幕后谋议宜附徐温传，待他史补全
- name_zh: 李夷邺
  why_not: 仅寝宋后监国伪诏一事，疾风劲草一语宜作李昪传附注
- name_zh: 韩熙载
  why_not: 仅谏逾年改元一疏，无做事周期
- name_zh: 冯延巳、冯延鲁
  why_not: 仅兄弟论建州之役一节，事未及果传文即断
- name_zh: 陈觉
  why_not: 矫制进围福州表言朝夕可克，文断无下文，成败未考
- name_zh: 孙晟
  why_not: 自中原来奔烈祖奇之，仅一语，无事迹
- name_zh: 李德诚
  why_not: 秉烛夜出惊疑渡江、惧祸徙州、被诬进毒，惶恐求容之配角
- name_zh: 李存勖（后唐庄宗）
  why_not: 仅敌国之礼通书一节，君主作时间坐标低优先
- name_zh: 周隐、刘威、锺泰章、周宗、李建勋、姚洞天
  why_not: 皆一语配角，无独立做事周期
- name_zh: 宋后、种氏、陈夫人、吕氏
  why_not: 宫闱志怪片段，非事业人物
