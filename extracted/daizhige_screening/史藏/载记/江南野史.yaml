source: 史藏/载记/江南野史.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 李昪
  score: 10
  worth_why: 流民孤儿入徐温之门，试以家事干济过人；延宋齐丘行六条、劝农薄赋禁非徭，保境二十余年治平如砥；受吴禅建南唐复姓李，临终戒嗣主善邻勿兵，吴越遭火不乘危反厚赈——仁厚保境的完整成事周期；僧夜半钟诗与东海鲤鱼飞上天谶语皆名场面
  era: 唐末五代十国
  dates_known: true
- name_zh: 李煜
  score: 9
  worth_why: 千古词帝，春花秋月何时了、问君能有几多愁开一代词风；守成委靡、肉袒出降，艺术家失国的完整教训周期；此书三主体例卷三当为后主传，凭卷目与南唐史录入
  era: 五代十国
  dates_known: true
- name_zh: 李璟
  score: 7
  worth_why: 平张遇贤之乱、灭闽取建汀泉漳拓土至盛；然委政诸弟、亲魏岑查文徽而黜宋齐丘，朋党之祸自此始，南唐由盛转衰的枢纽教训
  era: 五代十国
  dates_known: true
- name_zh: 宋齐丘
  score: 7
  worth_why: 南唐谋主：说六条以率群吏、定民科制、劝课农桑薄赋，立国之策出其手；延宾亭延四方豪杰；晚以直谏嗣主独断被黜，陷朋党而败，善谋国者不善谋身
  era: 唐末五代十国
  dates_known: true
- name_zh: 徐温
  score: 6
  worth_why: 杨吴权臣：于行伍识孤儿李昪携归为养子，试以家务、付以兵政，亲手奠定易代班底；知人善任而嫡子知训骄纵取祸，养子终代吴建唐
  era: 唐末五代十国
  dates_known: true
- name_zh: 朱瑾
  score: 6
  worth_why: 时称愍哥：守郡拒梁、飞刃刺兄以拒降，亡归淮南；因徐知训骄横虐政手刃之，事败大呼于市朝无附者，自刭而死——刚烈锄奸而败的悲壮完整周期
  era: 唐末五代十国
  dates_known: true
rejections:
- name_zh: 杨行密
  why_not: 传中仅作背景铺垫，专据淮南、擒夏韶皆数语带过，无完整做事周期，事迹详于吴史
- name_zh: 张遇贤
  why_not: 赤军子之乱起灭数月，仅一民变名场面，无决策纵深与可鉴之谋
- name_zh: 王延羲与王延政
  why_not: 闽室兄弟相残互称帝，传文简略，仅作南唐拓土之时间坐标
- name_zh: 查文徽与边镐
  why_not: 征闽一役而已，识山道之险、执延政以归，无独立做事周期
- name_zh: 冯延鲁
  why_not: 纵越师舟师登岸致诸军溃，传中仅一败笔归罪，不足成事
- name_zh: 徐知训
  why_not: 骄肆虐政致杀，仅作朱瑾事件之反面背景
- name_zh: 汪台符
  why_not: 一疏陈九患即无后文，事迹单薄
