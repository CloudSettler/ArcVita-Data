candidates:
- name_zh: 李昪
  score: 7
  worth_why: 少孤为徐温养子，执杨氏政事延祚十余年，沈机远略俭素持国，终受禅建南唐改国号唐——孤儿至开国之主完整做事流
  era: 五代十国·南唐
  dates_known: true
- name_zh: 李建勋
  score: 7
  worth_why: 寄诗预警闽师必败而验；功成身退号钟山公不受司徒；预嘱不封树薄葬，后世兵祸掘冢殆遍独其葬所保全
  era: 五代十国·南唐
  dates_known: true
- name_zh: 李璟
  score: 6
  worth_why: 保大雪宴命董源周文矩徐崇嗣等合绘名图传世；然迁都豫章劳民一载而悔，委政陈觉李徵古至几倾——守成之主得失俱可鉴
  era: 五代十国·南唐
  dates_known: true
- name_zh: 宋齐丘
  score: 6
  worth_why: 布衣遇烈祖不二十年极富贵，号称造国之手；终以擅名请摄被徙青阳，绝食而死——权臣震主之典型教训
  era: 五代十国·南唐
  dates_known: true
- name_zh: 申渐高
  score: 6
  worth_why: 魏王与烈祖相互疑毒不饮，独并饮之怀金钟趋归脑溃而终，以身解两主之厄；又以雨怕抽税一讽使市征得蠲
  era: 五代十国·南唐
  dates_known: true
- name_zh: 王慎辞
  score: 5
  worth_why: 依严球所授预习应对，北朝果首问黑云长剑与柴再用，对答无缺使梁太祖罢南征之谋；后遭宋齐丘谮以竹笼沈江
  era: 五代十国·南唐
  dates_known: true
- name_zh: 陈乔
  score: 5
  worth_why: 草摄国敕袖于上前切谏曰陛下既署此敕臣不复见陛下，一语回天，直臣风骨之名场面
  era: 五代十国·南唐
  dates_known: true
- name_zh: 聂氏女
  score: 5
  worth_why: 年十三随母采薪，母为虎搏去，跳上虎背交手割颈毙虎救母，孝勇烈举名场面
  era: 五代十国·南唐
  dates_known: false
