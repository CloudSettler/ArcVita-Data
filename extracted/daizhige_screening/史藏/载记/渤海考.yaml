category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 大祚荣
  score: 9
  worth_why: 高句丽亡后率家属东走度辽水保东牟山；天门岭大破唐将李楷固，楷固仅以身免；幷乞四比羽之众，遣使交突厥，兼受唐册渤海郡王；地方五千里胜兵数万，筑忽汗城开海东盛国二百余年基业——缘起、决胜、外交抉择、建制结果俱全
  era: 唐武后至玄宗年间
  dates_known: true
- name_zh: 大武艺
  score: 8
  worth_why: 开斥土宇，大村置都督编成靺鞨诸部；黑水私通唐廷之谋断然出兵；遣张文休越海攻登州杀刺史韦俊；唐罗两面夹击下借大雪得全并终服黑水；聘日本以夷制夷；因门艺之谏不纳致其奔唐、唐渤交恶——决策链完整，教训深刻
  era: 唐开元年间
  dates_known: true
- name_zh: 大钦茂
  score: 8
  worth_why: 安史之乱中识破平卢徐归道诈盟，扣使不发，归道果叛见诛；再疑王进义之言遣使详问，得肃宗勅书自安；玄宗朝凡二十九朝唐；宝应年间晋封渤海国王；迁都上京定百年格局——乱世中审势自全的典范
  era: 唐玄宗至德宗年间
  dates_known: true
- name_zh: 大仁秀
  score: 7
  worth_why: 以疏属入继大统；南征新罗北略诸部开大境宇，值中衰之后中兴渤海，海东盛国之号成于其世
  era: 唐宪宗至文宗年间
  dates_known: true
- name_zh: 门艺
  score: 6
  worth_why: 谏兄武王勿攻黑水，谓恐与唐腹背受敌；谏不从遂奔唐；后受唐遣率兵伐其本国——忠谏、流亡、兄弟相残，典型道德困境素材
  era: 唐开元年间
  dates_known: true
- name_zh: 柳得恭
  score: 6
  worth_why: 朝鲜实学派史家；以内阁属官撰渤海考，分君臣地理职官仪章物产国书国语属国九考补高丽史阙；力论高丽不修渤海史遂无辞责契丹女真而终为弱国——以史学立论的做事流完整，主要活动年代可考（正祖朝）
  era: 朝鲜朝后期
  dates_known: true
- name_zh: 王志玄
  score: 5
  worth_why: 安史乱中知徐归道潜通史思明之谋，率精兵六千攻破柳城斩归道，自称平卢节度安顿北疆——一事定局，做事流偏简
  era: 唐肃宗年间
  dates_known: true
- name_zh: 张文休
  score: 5
  worth_why: 奉武王命率海贼越海攻登州杀刺史韦俊，东北古政权罕见跨海远袭之名场面；然仅此一事
  era: 唐开元年间
  dates_known: true
- name_zh: 乞四比羽
  score: 5
  worth_why: 拒武后许国公册命不肯附唐，兵败见杀；其众归于祚荣，遂成渤海建国之资——有节点意义但事迹简略
  era: 唐武后年间
  dates_known: true
