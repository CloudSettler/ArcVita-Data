source: 史藏/载记/琉球国志略.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 尚巴志
  score: 7
  worth_why: 元末琉球裂为三山，先后灭北山、并南山复合一国，迁都首里，确立对明朝贡体制；统一战争为琉球国史头号名场面，事业流完整可考
  era: 明初（琉球三山时代）
  dates_known: true
- name_zh: 周煌
  score: 7
  worth_why: 乾隆二十一年奉使册封尚穆，沿途采辑、回京分门比类，撰成《琉球国志略》十六卷；订正前使诸录讹舛、考辨中山旧号恪遵印文，缘起、关键决定、进呈奉旨的做事流俱全
  era: 清乾隆
  dates_known: true
- name_zh: 徐葆光
  score: 7
  worth_why: 康熙五十八年副使使琉球，著《中山传信录》，为历来使录中最赅备者，考订琉球地理、语言、世系，成后世征引权威之作
  era: 清康熙
  dates_known: true
- name_zh: 陈侃
  score: 6
  worth_why: 明嘉靖册封使，首创「使录」体例，首载封舟渡海、黑水沟祭海事，为后此所有使录之源头
  era: 明嘉靖
  dates_known: true
- name_zh: 汪楫
  score: 6
  worth_why: 康熙二十二年册封正使，著《中山沿革志》考琉球世统、《册封疏抄》存使事制度，且留下渡海迅速的使事记录
  era: 清康熙
  dates_known: true
- name_zh: 尚贞
  score: 5
  worth_why: 三藩反侧、海寇陆梁之际笃守臣节，屡使来朝贡献不懈，可作乱世守节之范
  era: 清康熙
  dates_known: true
- name_zh: 尚质
  score: 5
  worth_why: 明清易代之际达时识势，献方物、禀正朔、缴明旧诏敕印，主动归附，关键抉择清楚
  era: 明末清初
  dates_known: true
- name_zh: 张学礼
  score: 5
  worth_why: 顺治首使因海道未通滞闽多年、使人物故甚多而被议处，康熙复命再使完成册封尚质，可作使命搁置与自赎复起之教训
  era: 清顺治至康熙
  dates_known: true
rejections:
- name_zh: 尚敬
  why_not: 仅见两朝受赐御书与册封受赐文书，无自主做事周期，君主仅作时间坐标
- name_zh: 尚穆
  why_not: 仅乾隆受封一事，无事迹细节
- name_zh: 萧崇业
  why_not: 传文仅存使录书名一行，无做事周期
- name_zh: 郭汝霖
  why_not: 传文仅存使录书名一行，无事迹可考
- name_zh: 夏子阳
  why_not: 仅列使录八款目录，本人无事迹叙述
- name_zh: 谢杰
  why_not: 仅有使事补遗分八款等著述条目，做事流简略不成周期
- name_zh: 高澄
  why_not: 仅存「甲午操舟记」书名
- name_zh: 胡靖
  why_not: 仅存崇祯记录书名一行
- name_zh: 林麟焻
  why_not: 仅存竹枝词书名，属随行文人无独立事迹
- name_zh: 海宝
  why_not: 册封正使仅见名衔，无事迹
- name_zh: 马宗毅
  why_not: 王舅献方物禀正朔仅一句带过，无做事周期
