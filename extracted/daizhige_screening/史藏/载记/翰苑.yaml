candidates:
- name_zh: 李牧
  score: 9
  worth_why: 传内见其雁门备胡示怯蓄力、置吏市租养士、选百金之士一举大破匈奴；合史识更有北逐单于破东胡、宜安肥下连却秦军封武安君、终遭郭开之谗自毁长城，做事流完整，兵法名场面与兴亡教训兼具
  era: 战国末期赵国
  dates_known: true
- name_zh: 晁错
  score: 8
  worth_why: 传引其守边备塞劝农力本之策；合史识有言兵事三章、贵粟实边、削藩议招七国之祸、衣朝衣斩东市，上书决策结局俱全，可为改革者镜鉴
  era: 西汉文帝景帝时
  dates_known: true
- name_zh: 刘敬
  score: 7
  worth_why: 传见其首倡和亲结约之谋；另有谏都关中、白登解围后献策、徙豪强实关中，一戍卒因言而成谋国三策，做事流完整可考
  era: 西汉初
  dates_known: true
- name_zh: 张奂
  score: 7
  worth_why: 传见其击破叛胡降于美稷；合史识有羌人馈金马而使金如粟不入怀的清廉名场面、凉州三明之誉、晚年闭门著书，为将立身可法可鉴
  era: 东汉
  dates_known: true
- name_zh: 张楚金
  score: 5
  worth_why: 本书作者，后叙自述显庆五年梦孔子问答、感而著书，成书东传日本仅存孤本；然传内仅见著书缘起，无完整做事周期，宜缓录
  era: 唐高宗显庆时
  dates_known: true
