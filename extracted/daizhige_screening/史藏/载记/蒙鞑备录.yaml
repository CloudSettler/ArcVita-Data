source: 史藏/载记/蒙鞑备录.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 木华黎
  score: 9
  worth_why: 受封太师国王、获赐九斿大旗，代成吉思全权经略中原十余年，东征西讨威震夷夏，征伐大事皆决于己，号称权皇帝、衣服制度全用天子礼，从亲随那可儿到经略汉地统帅的做事流完整可考，是蒙金兴替的关键推手
  era: 金末蒙初
  dates_known: true
- name_zh: 耶律楚材
  score: 8
  worth_why: 契丹人登第后为蒙古所用，文中已见其以燕京内翰掌文书，后成以儒治国、保全汉地的名相，仕蒙三十年的治国做事流完整
  era: 金末蒙初
  dates_known: true
- name_zh: 阿剌海别吉
  score: 6
  worth_why: 即文中成吉思公主必姬夫人，寡居权管国事、领白鞑靼，凡征伐斩杀皆自己出，且有妇女数千人事之，古代罕见的女性监国样本
  era: 蒙古建国初期
  dates_known: false
- name_zh: 刘伯林
  score: 6
  worth_why: 金统兵头目降蒙后同破燕京甚有功，受封王而能退闲于家，其子续任西京留守并尚公主，开降蒙世袭军功家族之先例
  era: 金末蒙初
  dates_known: true
rejections:
- name_zh: 忽杀虎
  why_not: 金帅仅统兵五十万迎击而大败一事，无完整做事周期
- name_zh: 高琪
  why_not: 金方再败之统帅，仅作战败时间坐标
- name_zh: 脱合太师
  why_not: 女真降臣为相，仅存极狡猾之评语，无具体做事可考
- name_zh: 田姓回鹘商人
  why_not: 仅劝诱鞑人治兵入寇一节，事迹单薄无后续
- name_zh: 白四部
  why_not: 仅存公主之夫名号，无事迹可录
- name_zh: 忒没葛贞
  why_not: 三皇弟仅一句善战有功，属世系罗列而非做事流
- name_zh: 孟珙
  why_not: 著者仅以自称珙记录使行见闻，非传主，且本书著者归属尚有争议（或为赵珙）
