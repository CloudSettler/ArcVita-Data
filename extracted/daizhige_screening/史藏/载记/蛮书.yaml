source: 史藏/载记/蛮书.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 韦皋
  score: 8
  worth_why: 镇西川二十一年，贞元七年设计除勿邓两面派大鬼主梦冲、贞元十年遣马益开石门道置行馆复通南诏并促成册命归化、同年与云南军并力破保塞大定献俘阙下、十一年拔罗山置兵固守通邛南驿路；联南诏以断吐蕃右臂的完整做事流，兼通道路、用间、会战多种手段
  era: 中唐德宗贞元年间
  dates_known: true
- name_zh: 樊绰
  score: 7
  worth_why: 南诏兵锋迫境、交趾陷落之际，以安南经略使幕僚身份亲历危局，遍采途程馆驿、山川部落、城镇攻守之要，撰《蛮书》十卷进呈朝廷，末卷自陈愿为破蛮之资；以一部书奠定唐代云南经略情报体系，存世唯一唐人云南志即其名场面
  era: 唐懿宗咸通年间
  dates_known: true
rejections:
- name_zh: 马援
  why_not: 仅一句立铜柱定疆界，且系年元鼎二年与东汉人矛盾，无做事周期
- name_zh: 史万岁
  why_not: 仅载南征经行石门路一句，无事迹细节
- name_zh: 鲜于仲通
  why_not: 仅载天宝中自南溪下兵此路、后遂闭绝一句，丧师败绩无展开
- name_zh: 李谧
  why_not: 仅载龙尾城误陷军二十万众为万人冢，孤例无做事流
- name_zh: 张干陀
  why_not: 仅一句姚州为其附蛮所陷，事迹暧昧不可考
- name_zh: 阁罗凤
  why_not: 君主低优先，本卷仅载其遣将于大雪山中筑城、死者过半遂罢一事，无完整做事周期
- name_zh: 梦冲
  why_not: 勿邓大鬼主内受恩赏外私吐蕃，只作韦皋除之的注脚，行事简略
- name_zh: 苏隗
  why_not: 仅一行奉节度使命杀梦冲，无可录之做事流
