category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 王建
  score: 9
  worth_why: 从剽盗之徒到前蜀开国之君，做事流极完整：武当僧点化从军、随驾五都翼帝过烟焰、负玉玺、绐韦昭度得符节、受田令孜印取成都、称帝改元建制；枕膝而寝赐金券、登城对语皆名场面；序言明言其善恶之迹“可为世之鉴戒”，乱臣窃据型教训人物
  era: 唐末五代
  dates_known: true
- name_zh: 韦庄
  score: 8
  worth_why: 昭宗遇弑后为王建草答王宗绾教，誓雪国耻拒附朱梁；识破梁“以建为兄”乃神尧骄李密之故智；前蜀开国制度号令刑政礼乐皆其所定；花间派词人，有《浣花集》二十卷
  era: 唐末五代
  dates_known: true
- name_zh: 张道古
  score: 7
  worth_why: 唐室谏臣上疏言五危二乱七事屡遭贬斥不改其志；变姓名卖卜温江仍上书直谏；玉垒关留遗言“终不能拳跽与鸡犬同食”，求题墓曰唐左补阙张道古墓；序言点名其谏疏“有益于世教”，气节之模范
  era: 唐末五代
  dates_known: true
rejections:
- name_zh: 张扶
  why_not: 传文仅载进谏宗佶被毒杀一事，无完整做事周期
- name_zh: 王宗佶
  why_not: 恃功求为太子被扑杀，教训简略，周期不完整
- name_zh: 周德权
  why_not: 仅随建入蜀、上表数语，无做事流
- name_zh: 蒲禹卿
  why_not: 序中仅存恸哭一语，无事迹本末
