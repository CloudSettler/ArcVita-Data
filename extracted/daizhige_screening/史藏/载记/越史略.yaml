source: 史藏/载记/越史略.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 赵佗
  score: 9
  worth_why: 由秦龙川令而据南越称王，事汉、称帝、复归藩于陆贾一书，和集百越立国近百年，做事流完整，进退有度堪为立国范本
  era: 秦末汉初
  dates_known: true
- name_zh: 马援
  score: 8
  worth_why: 伏波将军缘海刊道千余里平征侧，立铜柱为界，终身在边地建功，功臣不居之志可为模范
  era: 东汉光武时
  dates_known: true
- name_zh: 士燮
  score: 8
  worth_why: 乱世以谦恭下士保全交州四十余年，注左氏春秋、兴学育人，寿九十而民安其治，守成治郡之典范
  era: 东汉末至三国吴
  dates_known: true
- name_zh: 宗悫
  score: 8
  worth_why: 少年言愿乘长风破万里浪，为成语长风破浪之源；以狮子阵破林邑象兵，胆识与谋略俱全
  era: 南朝宋
  dates_known: true
- name_zh: 黎桓
  score: 8
  worth_why: 自十道将军摄政而代丁氏称帝，却宋师定前黎基业，权臣取国又能拒强敌，做事流完整
  era: 越南前黎朝
  dates_known: true
- name_zh: 李公藴
  score: 8
  worth_why: 迁都升龙开李朝三百年基业，宽刑薄赋、立庙兴学，开国迁都之决策堪称名场面
  era: 越南李朝
  dates_known: true
- name_zh: 丁部领
  score: 7
  worth_why: 平十二使君之乱统一越地，建国称帝首设年号，从部落之乱到一统的开国之流
  era: 越南丁朝
  dates_known: true
- name_zh: 吴权
  score: 7
  worth_why: 白藤江之战破南汉军，自此越地不复受中原郡县，自立称王，为越史转折点
  era: 五代十国
  dates_known: true
- name_zh: 征侧
  score: 7
  worth_why: 雒将之女因郡守执法而起兵，略定六十五城自立为王，妹贰同举，女性举事之孤例，终为马援所灭可为警示
  era: 东汉光武时
  dates_known: true
- name_zh: 杜惠度
  score: 7
  worth_why: 以雉尾炬火攻破卢循船队、却林邑之寇，为政城门夜开道不拾遗，武功文治并见
  era: 东晋末
  dates_known: true
- name_zh: 吕嘉
  score: 6
  worth_why: 三代权相拒汉归附，弑王杀使举国抗命，终致南越覆灭被擒，权臣逆大势的完整教训
  era: 南越国末
  dates_known: true
- name_zh: 陶璜
  score: 6
  worth_why: 攻陷交州为吴立功，降晋后复任刺史三十年，恩威并著，卒时举州号哭如丧父母
  era: 三国吴至晋
  dates_known: true
- name_zh: 贾琮
  score: 6
  worth_why: 单车抚定执刺史之乱州，百姓歌贾父来晚，刺史善政之样本
  era: 东汉末
  dates_known: true
- name_zh: 朱儁
  score: 5
  worth_why: 破乌浒蛮与梁龙数万之众，后为汉末名将，惟本文事迹简略
  era: 东汉末
  dates_known: true
- name_zh: 安阳王
  score: 5
  worth_why: 神弩毁于婿赵始之手的传说，警示枕边之人与国之利器，惟年代不可考属传说
  era: 战国秦之际
  dates_known: false
rejections:
- name_zh: 术阳王建德
  why_not: 权臣拥立之傀儡，旋为汉军所擒，无独立做事周期
- name_zh: 哀王兴
  why_not: 受制于母后与权相遇弑，无可录之事业
- name_zh: 历代守任诸刺史
  why_not: 石戴、周章、魏朗子明等仅列姓名一行，无事迹无做事流
- name_zh: 碓王
  why_not: 结绳为政传十八世纯属传说，无年代事迹可考
- name_zh: 媚珠
  why_not: 传说人物附于安阳王故事，非独立做事者
- name_zh: 卢循
  why_not: 本文仅载其末路败亡，无起于何处的完整做事流，当从晋书取
- name_zh: 檀和之
  why_not: 伐林邑虽为主帅，风采尽在宗悫，事迹附见而无独立价值
- name_zh: 韩千秋
  why_not: 二千人轻进全军覆没，教训单薄不足录
- name_zh: 陶侃
  why_not: 本文仅一句都督除授，其做事流当从晋书取
- name_zh: 阮叔献
  why_not: 拒纳刺史断绝贡献，格局小事迹短，缓录
- name_zh: 陈日煚至陈炜诸王
  why_not: 书末仅录僭谥改元不具事迹，无做事流可抽
- name_zh: 杜宏文、王徽、阮逊、阮放等
  why_not: 或仅名氏或一事一语，无完整做事周期
