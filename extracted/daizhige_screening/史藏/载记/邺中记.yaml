source: 史藏/载记/邺中记.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 石虎
  score: 7
  worth_why: 传主全文俱在：都邺后起殿台行宫四十四所、增饰铜雀三台去地三百七十尺、创凤诏五色纸衔于凤口、凉马台阅黑槊骑五千一箭齐走、华林苑征发十六万人烛夜筑墙冻死数千人犹诿罪起部尚书朱轨——奢暴做事流完整，群臣谏而不从、太史奏天变、金凤坠漳等败兆俱见，兼存冰井台藏冰及石墨可书可燃（最早用煤记录）之制度名物；穷奢虐民致衰亡之反面教材，教训价值极高
  era: 十六国·后赵
  dates_known: true
rejections:
- name_zh: 曹植
  why_not: 传文仅登铜雀台援笔立就一句，无做事周期；宜据三国志魏书诸夏侯曹传或陈思王传另录
- name_zh: 张群
  why_not: 仅见奉石虎命发十六万人筑华林苑，纯执行者无自决
- name_zh: 朱轨
  why_not: 仅见被石虎委罪诛杀以塞天灾一节，无独立做事流
- name_zh: 广陵公陈逵妹
  why_not: 仅以才色发长七尺见纳为夫人，无事迹可考
