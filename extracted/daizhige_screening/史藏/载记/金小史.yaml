source: 史藏/载记/金小史.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 完颜阿骨打
  score: 10
  worth_why: 缘起、阶段、决定、结果俱全的反辽建国全周期：不堪海东青之扰与打女真之夺货，以二千五百人起兵，宁江州、混同江、护步答冈屡以少胜多，破黄龙府东京上京五十余城，建大金改元天辅；剺面仰天哭誓师、女真兵满万不可敌皆成名场面；又与宋定海上之盟约还燕云
  era: 辽末金初
  dates_known: true
- name_zh: 粘罕
  score: 7
  worth_why: 金初方面统帅，袭中京、取西京、迫鸳鸯泺，尽知辽人虚实，为灭辽主谋；后更主导靖康之役，功高而骄终遭诛，做事流完整兼有教训
  era: 金初
  dates_known: true
- name_zh: 杨割
  score: 6
  worth_why: 独斩萧解里献首而私留其众兵甲，受节度使印而终不系辽籍，设官政、市铁为兵器、习战斗，为女真崛起奠基，是阿骨打事业缘起的关键布置者
  era: 辽道宗时
  dates_known: true
- name_zh: 赵良嗣
  score: 6
  worth_why: 宋使赴金约夹攻燕云，海上之盟谈判主谈者，争岁币、辩西京归属，亲见金太祖观兵上京；后复燕失败身被诛，联金复国之谋成而祸随之，可为外交决策之鉴
  era: 北宋末
  dates_known: true
- name_zh: 辽天祚帝
  score: 5
  worth_why: 亡国之君标本：信萧奉先赐死文妃、杀贤晋王致人心离散，大敌当前预藏日行三五百里骏马弃国先遁，识者谓自古人君未有弃民谋身而能享国者，教训价值大但无建设性做事流
  era: 辽末
  dates_known: true
- name_zh: 耶律余睹
  score: 5
  worth_why: 因诬构惧诛叛辽降金，用为乡导先袭中京不测而至，是辽亡的内因注脚；后复叛金身死，反复之臣结局可警后人，传中周期尚欠后半
  era: 辽末金初
  dates_known: true
- name_zh: 杨朴
  score: 5
  worth_why: 辽进士投金，劝阿骨打称帝建号、拟十事求封册、面折辽使册文轻侮之辞，为金开国的制度设计者；然事迹限于建言之议
  era: 辽末金初
  dates_known: false
rejections:
- name_zh: 高永昌
  why_not: 叛辽自称大渤海皇帝，旋为阿骨打所斩，无完整做事周期
- name_zh: 耶律淳
  why_not: 乘辽主之亡自立为天锡帝，寻死，传文数行无做事流
- name_zh: 萧奉先
  why_not: 持政诬构、劝诛晋王仅两事，恶行教训已并入天祚帝亡国之鉴，本人无做事周期
- name_zh: 马政
  why_not: 奉使通金往返传语，其子马扩随行，事迹简略无关键决定
- name_zh: 乌雅束
  why_not: 与阿疏构怨夺城仅数语，不足以立传
- name_zh: 萧挞不也
  why_not: 两番对垒皆败走，传中无自主作为
- name_zh: 耶律章奴
  why_not: 谋废立事泄亡去，仅作辽军内乱之因，一句带过
