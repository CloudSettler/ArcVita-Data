candidates:
- name_zh: 完颜阿骨打
  score: 9
  worth_why: 传三人以至阿骨打；继为都勃极烈统一生女真诸部，以两千五百人誓师来流水起兵反辽，出河店以少胜多，称帝建国号大金，创猛安谋克军制，命希尹制女真文字，起兵建国周期完整，为金朝开基之主
  era: 辽末金初
  dates_known: true
- name_zh: 完颜希尹
  score: 7
  worth_why: 女真本无文字，希尹奉命依汉人楷字兼契丹字创女真大字，一国文字之发明点；又为随军谋主参与灭辽攻宋方略，位至宰相后被赐死，功臣结局可为警示
  era: 金初
  dates_known: true
- name_zh: 完颜宗弼
  score: 7
  worth_why: 兀术搜山检海追宋高宗，黄天荡遇韩世忠，富平破张浚，顺昌郾城对岳家军，主持绍兴和议，是宋金对峙格局成型过程中的关键推手，战役名场面密集
  era: 金
  dates_known: true
- name_zh: 完颜亮
  score: 7
  worth_why: 弑熙宗自立，迁都燕京奠定今日北京为都之始，推行正隆官制；然裁汰太祖子孙、南征败于采石为部下所杀，志大才疏乱政亡身，属典型教训人物
  era: 金
  dates_known: true
- name_zh: 完颜雍
  score: 7
  worth_why: 海陵乱政后于辽阳自立拨乱反正，大定之治近三十年，节用爱民、惜赦慎刑，号称小尧舜，守成治国之模范
  era: 金
  dates_known: true
- name_zh: 完颜晟
  score: 7
  worth_why: 承兄业终灭辽擒天祚，主导靖康之变掳徽钦二帝亡北宋，立伪楚张邦昌经略中原；君主本作时间坐标，然一朝灭两大国、南北格局剧变之做事周期突出
  era: 金初
  dates_known: true
- name_zh: 完颜亶
  score: 6
  worth_why: 废女真旧制改行汉官三省制，颁皇统新制近千条、首除沙袋酷刑，金制汉化关键节点；晚年嗜酒恣杀为完颜亮所弑，可为警示
  era: 金
  dates_known: true
- name_zh: 洪皓
  score: 6
  worth_why: 衔命使金被羁留十五年不变节，冷山教授传汉学，归宋著松漠纪闻存金俗制度史料，人称宋之苏武，守节周期完整
  era: 南宋
  dates_known: true
