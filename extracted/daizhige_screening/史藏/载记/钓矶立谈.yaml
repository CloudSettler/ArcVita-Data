source: 史藏/载记/钓矶立谈.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 李昪
  score: 9
  worth_why: 做事流完整——牧升州招徕儒俊勤恤民隐，纳宋齐丘萧何赞汉中之策徙镇京口，朱瑾杀知训广陵大乱时宵济朝不易位而内外晏如，遂执国柄开霸图；后受禅建唐复姓李氏，力排宋齐丘乘火伐越之议，言救灾睦邻誓不以力营，遗命元宗善和邻好勿袭隋炀帝之迹，终成江表五十年无事之局；知足不辱之戒与保境安民可为后世模范
  era: 唐末五代十国
  dates_known: true
- name_zh: 宋齐丘
  score: 6
  worth_why: 以项羽王沛公汉中、萧何称天汉之美为喻，夜说烈祖速就京口，为霸图奠基之关键一策；后乘钱塘大火劝伐越、晚岁复起于迁谪谋为自固，兴国败国皆与其谋相系
  era: 五代十国
  dates_known: true
- name_zh: 李璟
  score: 6
  worth_why: 初守先训改元保大，号守文良主；会元老去位新进用事，上意荧惑构怨连祸，未及十年国用耗半、蹙国如削肌，是弃保境和邻之训、启衅自削之镜鉴
  era: 五代十国
  dates_known: true
rejections:
- name_zh: 周世宗
  why_not: 本文仅驾前见孟贯一问答，其事功详于正史别传
- name_zh: 徐温
  why_not: 义祖仅作徙治金陵、以京口付烈祖之节点，无独立做事周期
- name_zh: 徐知训
  why_not: 仅作被杀致乱之背景，童昏诟辱数语而已
- name_zh: 朱瑾
  why_not: 杀知训事一笔带过，无本传事迹
- name_zh: 孟贯
  why_not: 仅献诗遭世宗诘诫一节，无事迹流
- name_zh: 杜昌邻
  why_not: 仅领计司抚案恸哭一评，无做事周期
- name_zh: 刘通微
  why_not: 术士占验一则，非成事之人
- name_zh: 黄冠道人
  why_not: 谶谣疯道人，悬鱼行歌后不知所之，无从考实
- name_zh: 沈彬
  why_not: 仅录献画障诗一句
- name_zh: 范志嵩
  why_not: 仅录赋月诗一首
- name_zh: 史温
  why_not: 本书作者追忆成书，自称无闻之叟，无成事行状
