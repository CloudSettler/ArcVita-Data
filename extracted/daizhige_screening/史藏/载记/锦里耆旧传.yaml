source: 史藏/载记/锦里耆旧传.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 王建
  score: 10
  worth_why: 起于行伍，奉命讨陈敬瑄反客为主，围成都、并东川、定彭州，受唐封蜀王，天复七年称帝建前蜀并颁施政赦文劝农选士，匹夫开国全周期俱备
  era: 唐末五代（前蜀高祖）
  dates_known: true
- name_zh: 孟昶
  score: 8
  worth_why: 在位三十余年，前期著官箴颁州县（后世演为戒石铭），相传首制春联；后期奢纵佞政致国弱降宋、至汴七日而卒，兴衰教训俱全；传载宋太祖赐诏可稽（详后卷）
  era: 五代十国（后蜀后主）
  dates_known: true
- name_zh: 孟知祥
  score: 7
  worth_why: 受后唐命镇蜀，拥兵拒命败唐军、并东川而称帝，做事流较完整，称帝旋卒成败参半（或载后卷）
  era: 五代十国（后蜀高祖）
  dates_known: true
- name_zh: 陈敬瑄
  score: 5
  worth_why: 恃田令孜之援拒命，守成都经年城饥民相啖，终开城出降被斩，悍帅败亡之警示
  era: 唐末
  dates_known: true
- name_zh: 杨晟
  score: 5
  worth_why: 据彭州被围三年，粮尽百姓递相啖食，自刎而亡，传评其不识天时致害民庶，守城覆辙可戒
  era: 唐末
  dates_known: true
- name_zh: 王衍
  score: 5
  worth_why: 奢游失政，咸康元年唐兵至成都被王宗弼劫迁西宫终遭诛，纨绔亡国教训典型（详后卷）
  era: 五代十国（前蜀后主）
  dates_known: true
- name_zh: 僧智广
  score: 5
  worth_why: 以竹片为杖拍击痛处疗病立愈，日获钱三五千回用修宝历寺而贫者不取施钱，时号圣僧，方外济世小事业流完整（干宁间活动，生卒无考）
  era: 唐末（干宁间活动）
  dates_known: false
rejections:
- name_zh: 田令孜
  why_not: 传中仅除监军、出降、被贬被缢数事，其权倾朝野之事不在本书，无做事周期
- name_zh: 韦昭度
  why_not: 帅师讨蜀久围无功，被王建设计逼离并授牌印，仅为配角，周期不完整
- name_zh: 顾彦朗
  why_not: 仅除授东川节度与遣军败绩数行
- name_zh: 勾延庆
  why_not: 撰者，提要仅记官职与受刘蔚之托修书缘起，无做事事迹
- name_zh: 唐僖宗、唐昭宗
  why_not: 君主仅作改元迁幸时间坐标，无突出做事
- name_zh: 王宗涤
  why_not: 赦文追赠中一笔带过
- name_zh: 张琳
  why_not: 赦文追赠中一笔带过
- name_zh: 王宗弼
  why_not: 卷一未出场，提要仅记咸康元年劫迁王衍一事
- name_zh: 郑君雄
  why_not: 传文一行即被杀
- name_zh: 常厚
  why_not: 传文一行即没
- name_zh: 田师偘
  why_not: 收阆州渝州仅数行记录
- name_zh: 刘蔚
  why_not: 提要中得传请修之知州，仅一笔
