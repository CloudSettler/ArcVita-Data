source: 史藏/载记/陆氏南唐书.md
category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 李昪
  score: 9
  worth_why: 孤儿乞儿经杨行密徐温两代养育，以政事仆射摄国定乱，休兵劝农、兴太学、招徕北方士人，终受吴禅复姓李氏建南唐；起微至极的完整做事流，临终犹嘱保境安民
  era: 唐末五代·南唐
  dates_known: true
- name_zh: 李煜
  score: 9
  worth_why: 千古词帝，虞美人浪淘沙皆亡国后绝唱；治国以词章代政略，终肉袒出降、封违命侯、遭牵机药；绝代才人与亡国之君一身兼备，启示与警示俱全
  era: 南唐·宋初
  dates_known: true
- name_zh: 刘仁赡
  score: 8
  worth_why: 寿州被周世宗亲军围年余，斩请降之子崇谏，城垂破犹死守，周世宗亦褒其忠节；危城斩子为忠烈名场面
  era: 南唐·后周
  dates_known: true
- name_zh: 韩熙载
  score: 8
  worth_why: 北投吴国历仕三主，屡陈北伐之策不用，晚年纵情声色自污避相，为顾闳中韩熙载夜宴图主角；有识略而不遇其时的典型
  era: 唐末五代·南唐
  dates_known: true
- name_zh: 杨行密
  score: 8
  worth_why: 起于庐州应募，转战定江淮，清口大破朱温之师保江南，轻徭薄赋使江淮复苏，奠基杨吴；草莽成事的完整样本，且其收养直接造就李昪
  era: 唐末五代·杨吴
  dates_known: true
- name_zh: 李璟
  score: 7
  worth_why: 保大间灭闽灭楚拓土最盛，旋为周世宗三征所败，尽失江北十四州去帝号称国主；小楼吹彻玉笙寒之词与丧师失地并载，守成失策之鉴
  era: 五代·南唐
  dates_known: true
- name_zh: 宋齐丘
  score: 7
  worth_why: 布衣献策起家，谋夺升州、劝进受禅诸关键皆有其谋，位至丞相，晚遭猜忌幽饿死于青阳；谋主善始不善终的样本
  era: 唐末五代·南唐
  dates_known: true
- name_zh: 徐温
  score: 7
  worth_why: 自牙将摄政杨吴，徙治金陵握国柄；亲子知训骄败、知询被夺兵柄，独养子知诰承其局卒成南唐；权臣持国与人选抉择的关键样本
  era: 唐末五代·杨吴
  dates_known: true
- name_zh: 林仁肇
  score: 7
  worth_why: 南唐爪牙名将，周师惮之称林虎子；宋人盗绘其像悬馆伪称已降，后主竟鸩杀之自毁长城；反间计亡国的经典教训
  era: 南唐·宋初
  dates_known: true
- name_zh: 孙晟
  score: 7
  worth_why: 使后周被执，拒劝寿州守将降周，临刑正衣冠南望拜曰惟以死报国；使节死节的范本
  era: 南唐·后周
  dates_known: true
- name_zh: 潘佑
  score: 7
  worth_why: 后主朝上疏请诛权臣、复先王之法以振国势，言激被收自缢死，后主悔之；直谏改革者以死殉志的悲剧
  era: 南唐
  dates_known: true
- name_zh: 徐锴
  score: 7
  worth_why: 与兄铉并称二徐，著说文解字系传成文字学要籍，金陵将陷忧愤而卒；以学术传世、以学殉城的士人样本
  era: 南唐·宋初
  dates_known: true
- name_zh: 冯延巳
  score: 7
  worth_why: 词开北宋一代风气，风乍起吹皱一池春水传为名场面；位至宰相而政无大建，词名掩相业的反差样本
  era: 五代·南唐
  dates_known: true
- name_zh: 徐铉
  score: 6
  worth_why: 奉使入宋抗辩，闻卧榻之侧岂容他人鼾睡之答；入宋后校定说文存续文脉；亡国使臣而学术不坠
  era: 南唐·宋初
  dates_known: true
- name_zh: 柴克宏
  score: 6
  worth_why: 常州大破吴越解围，后力疾御周师，每战身先士卒；南唐难得的救火名将
  era: 南唐·后周
  dates_known: true
rejections:
- name_zh: 徐知训
  why_not: 骄淫失众旋为朱瑾所杀，仅作乱臣注脚无做事周期
- name_zh: 徐知询
  why_not: 与兄争权被诱夺兵柄闲废，无独立建树
- name_zh: 耿先生
  why_not: 方士神异之谈，行事难系年考信
