candidates:
- name_zh: 王建
  score: 9
  worth_why: 缘起于松岳城主之子投弓裔麾下，历筑勃御堑城、平靑州诸郡、罗州水战以火攻大破甄萱、擒海贼能昌，终至诸将拥戴兵不血刃受禅，即位建高丽改元天授；做事周期完整且关键决定清晰，'师克在和不在众'、古镜谶文诸名场面俱在；宽仁救恤、谨愼避谗、功高不居可为后世范；生卒年可考，生于唐干符四年即公元877年
  era: 唐末五代·朝鲜半岛后三国
  dates_known: true
rejections:
- name_zh: 弓裔
  why_not: 本卷仅作暴君陪衬，记其骄虐诛杀、伪造观心法及亡命被杀，属王建创业之背景，反面教训可附于王建条，不独立立传
- name_zh: 甄萱
  why_not: 本卷仅记其叛据南州称后百济及罗州水战败遁，做事周期不完整，宜待后百济本纪再酌
- name_zh: 洪儒
  why_not: 仅与裴玄庆等一夜密谋推戴，传文数句无独立做事周期
- name_zh: 裴玄庆
