category: 史藏/载记
verdict: has_candidates
candidates:
- name_zh: 耶律楚材
  score: 8
  worth_why: 传中亲见其自算自印历书颁行、主汉地文书与赋敛；能天文诗琴禅，以文脉佐草昧新朝，以夏变夷做事流完整，元史有传可续
  era: 蒙古汗国初期（金末蒙初）
  dates_known: true
- name_zh: 镇海
  score: 7
  worth_why: 掌回回字文书与宣命之宝，年月前亲书回回字以检制楚材，蒙古汗廷文牍与印信制度的关键执行者，与楚材共握柄而互相检防
  era: 蒙古汗国初期
  dates_known: true
- name_zh: 窝阔台
  score: 7
  worth_why: 传中称兀窟解，继成吉思汗立汉地差发赋敛之制、定科率之法，倚楚材镇海分理文书，君主但有制度级做事可录
  era: 蒙古汗国太宗朝
  dates_known: true
rejections:
- name_zh: 按只角
  why_not: 传中仅一句黑鞑人有谋而能断，无完整做事周期
- name_zh: 粘合重山
  why_not: 仅见随屈术南侵与代职佐理之零星记载
- name_zh: 屈术
  why_not: 仅南侵身死一句，事迹单点
- name_zh: 阔端
  why_not: 仅列名世系无事迹
- name_zh: 阔除
  why_not: 仅列名世系无事迹
- name_zh: 河西〈角〉
  why_not: 仅立为伪太子读汉文一句
- name_zh: 合剌直
  why_not: 仅列名世系无事迹
- name_zh: 王檝
  why_not: 仅自署银青光禄大夫等头衔，非鞑主除授，无做事流
- name_zh: 马录事
  why_not: 仅太子从其读书一句
- name_zh: 彭大雅
  why_not: 本书作者，文中无其自身做事周期，宜另行据宋史传记录入
