category: 子藏/兵家
verdict: has_candidates
candidates:
- name_zh: 何去非
  score: 8
  worth_why: 以对策论兵得官开武学教授之先；著备论二十六篇雄快踔厉被苏轼两度奏荐；其六国论秦论楚汉论自成一家言行事周期完整
  era: 北宋
  dates_known: true
rejections:
- name_zh: 苏轼
  why_not: 传文仅奏荐二篇见其荐贤之举，做事流主体在文献之外，且本卷非其传
- name_zh: 章邯
  why_not: 仅在秦论中被评述用兵之失，无独立做事周期可考于本篇
- name_zh: 鼂错
  why_not: 传文论及晁错处被截断，仅存评语无完整事迹
- name_zh: 张仪
  why_not: 六国论中仅作战略背景人物，无本传做事周期
- name_zh: 苏秦
  why_not: 六国论中仅作合从背景人物，无独立事迹文本
- name_zh: 子婴
  why_not: 仅秦论末引贾谊司马迁语评其才，无事迹
- name_zh: 归有光
  why_not: 卷末跋深讥是论之谬，仅一评语无做事流
- name_zh: 周文
  why_not: 仅章邯击走之一战例，无完整周期
