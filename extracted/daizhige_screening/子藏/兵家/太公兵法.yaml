- name_zh: 姜太公
  score: 8
  worth_why: 太公兵法托名主角；为将受命忘家、当敌忘身；佐文王伐密须伐崇、佐武王牧野之战；传金人三缄其口之戒
  era: 商末周初
  dates_known: true
- name_zh: 周文王
  score: 7
  worth_why: 伐密须、伐崇先宣言为民征讨，令毋杀人毋坏室，因垒而降；善纳太公之言
  era: 商末
  dates_known: true
- name_zh: 周武王
  score: 7
  worth_why: 牧野灭殷；践阼三日问丹书之道；散财发粟、归玉归女、纵马放牛示天下不复用
  era: 商末周初
  dates_known: true
