- name_zh: 刘表
  score: 7
  worth_why: 单马入宜城定荆州，纳蒯越权谋之策，诱斩宗贼五十五人、传檄而定八郡，做事流完整
  era: 东汉末
  dates_known: true
- name_zh: 傅干
  score: 7
  worth_why: 说马腾弃袁归曹、顺道逆德之论，一举破郭援断袁氏之臂，关键外交决策范例
  era: 东汉末
  dates_known: true
- name_zh: 蒋济
  score: 7
  worth_why: 谏勿轻伐辽东，虎狼当路不治狐狸之论，事后果如其言，战略预判典型
  era: 三国魏
  dates_known: true
- name_zh: 傅嘏
  score: 8
  worth_why: 论征吴三策得失、建进军大佃之长计七利，朝廷不从果败于东关，完整体现庙胜之理与教训
  era: 三国魏
  dates_known: true
- name_zh: 王基
  score: 8
  worth_why: 疑邓由诈降驰驿止兵，自比张良销印，后由等果不降，险些酿成郦生之谬，关键决策救大局
  era: 三国魏
  dates_known: true
