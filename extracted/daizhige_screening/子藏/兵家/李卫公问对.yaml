candidates:
- name_zh: 李靖
  score: 10
  worth_why: 唐初第一名将，平萧铣、灭东突厥、远征吐谷浑，奇正之变的军事理论集大成者，功高而能自守
  era: 隋末唐初
  dates_known: true
- name_zh: 李世民
  score: 9
  worth_why: 天策上将，虎牢之战一战擒两王，灭宋老生、薛仁杲、王世充、窦建德，贞观之治皇帝中做事最完整者之一，君主中突出的做事典范
  era: 隋末唐初
  dates_known: true
