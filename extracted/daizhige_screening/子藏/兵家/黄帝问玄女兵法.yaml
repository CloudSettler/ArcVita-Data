candidates:
- name_zh: 黄帝
  score: 4
  worth_why: 与蚩尤九战九不胜后得玄女战法，终克之，为涿鹿之战传说源头；但文本为后世类书辑佚之兵书依托，事迹神话化，无可靠年代
  era: 上古传说
  dates_known: false
- name_zh: 禹
  score: 5
  worth_why: 传说中得黄帝圣藏于会稽、决江口得玉匮经卷，属藏书神话；禹另有治水做事流可录，本篇仅片段
  era: 上古传说
  dates_known: false
- name_zh: 伍肯
  score: 4
  worth_why: 三年攻蚩尤城不下而自请三日破城，立五方之将制四方，果如其言，得封世世不绝；然为兵书依托之伪托人物，无独立史料
  era: 上古传说依托
  dates_known: false
rejections:
