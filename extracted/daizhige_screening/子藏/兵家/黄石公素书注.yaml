category: 子藏/兵家
verdict: no_value
skip_reason: 文献为《素书》文本及宋人注释汇编，主体为格言式处世兵学论，不含可考人物做事周期；黄石公属传说人物，年代不可考；张良已在库且本传未重述其事迹；张商英仅存序言。
rejections:
- name_zh: 黄石公
  why_not: 传说隐士，生卒年与生平皆不可考，圯桥授书为张良事迹的背景，自身无完整做事流
- name_zh: 张商英
  why_not: 文献仅存其一篇序文，无做事周期与关键决策可提取
- name_zh: 张良
  why_not: 已在库中，且本文仅从《素书》视角回溯其用策事例，不构成新增价值；按已有库规则勿重复录入
