candidates:
- name_zh: 邓析
  score: 8
  worth_why: 名辩家与法家先驱，作竹刑被郑国采用，操两可之说设无穷之辞，聚徒讼狱教民狱讼，创名家辩术先河，终被驷歂所杀而其法竟见用，做事流完整且结局富于教训
  era: 春秋末期郑国
  dates_known: true
- name_zh: 子产
  score: 6
  worth_why: 执郑国政历昭公定公之际，与邓析相难而被屈，治理有方堪为法家先声之一，然本传仅作为背景出现，事迹需借左传补足
  era: 春秋末期郑国
  dates_known: true
