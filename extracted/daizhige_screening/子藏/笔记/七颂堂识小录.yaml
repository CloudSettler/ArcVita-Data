- name_zh: 刘体仁
  score: 7
  worth_why: 顺治进士官至吏部郎中，与王士祯汪琬同榜唱和，仿烟云过眼录撰识小录七十四条，赏鉴特精，自成一套书画古器考辨之事流；亦有蓄人代笔而不工的好事口实，可谓雅趣与鉴戒并存
  era: 清初
  dates_known: true
- name_zh: 孙承泽
  score: 6
  worth_why: 北海少宰为清初收藏大家，落水兰亭、绛帖、范寛真迹诸巨迹多出其家，鉴别著述有可考之事流
  era: 明末清初
  dates_known: true
- name_zh: 王士祯
  score: 5
  worth_why: 诗坛领袖居易録记体仁代笔之戏，主持风雅数十年，然本条文献仅见侧影
  era: 清初
  dates_known: true
