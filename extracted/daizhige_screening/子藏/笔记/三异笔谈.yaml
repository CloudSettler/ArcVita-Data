candidates:
- name_zh: 张照
  score: 9
  worth_why: 仕于康雍乾三朝，供奉内廷十八年，通禅学，工书法戏曲，著有天瓶斋诗，坠马折臂而卒，身世传说与命运交织，做事流与名场面俱备
  era: 清康熙至乾隆间
  dates_known: true
- name_zh: 钱金甫
  score: 8
  worth_why: 博学宏词征举入仕，千人石攘臂护叔之战袍佳话，居官不改儒素、足不登要人之堂，性情与轶事生动，其子梦金照方误服而殁可作教训
  era: 清初
  dates_known: false
- name_zh: 钱芳标
  score: 7
  worth_why: 以孝廉官中翰，工艳体词曲，奏销狱镌秩而能豁然作偈辞世，识破前生之说，性格与结局皆有可为时间轴之节点
  era: 清顺治康熙间
  dates_known: false
- name_zh: 王侍御
  score: 7
  worth_why: 由寒门赘婿起家，寄人篱下几番周折，值明清鼎革乱世中保全一家，后三子皆成一二品大员，属由困顿到显达的完整做事流
  era: 明末清初
  dates_known: false
- name_zh: 沈丹彩
  score: 6
  worth_why: 精六壬易学、重瞳颖慧，著述功力于悦与周易象正皆有独诣，属才艺型人物，但事迹偏玄异而欠缺完整功业周期
  era: 清中叶
  dates_known: false
rejections:
