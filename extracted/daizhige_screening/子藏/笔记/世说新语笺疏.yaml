verdict: has_candidates
candidates:
- name_zh: 陈蕃
  score: 8
  worth_why: 登车揽辔有澄清天下之志；下榻礼贤徐孺子成语出处；谋诛宦官事败身死，做事流完整可为教训
  era: 东汉桓灵之际
  dates_known: true
- name_zh: 徐稚
  score: 7
  worth_why: 徐孺下陈蕃之榻典故主角；万里赴吊、悬榻礼遇等名场面；隐士风节可为模范
  era: 东汉中后期
  dates_known: true
- name_zh: 黄宪
  score: 6
  worth_why: 汪汪如万顷之陂喻其器量，颜子复生之誉；然记载多为品评，做事流较简
  era: 东汉中后期
  dates_known: false
- name_zh: 郭泰
  score: 7
  worth_why: 识鉴知天之所废不可支而辞征避祸，郭有道碑为蔡邕唯一无愧之作；党锢中全身做事流完整
  era: 东汉末党锢时代
  dates_known: true
- name_zh: 李膺
  score: 8
  worth_why: 登龙门典故出处；以天下名教是非为己任，率士抗宦官死于党锢，做事流完整且能为后世榜样与教训
  era: 东汉桓灵之际
  dates_known: true
rejections:
