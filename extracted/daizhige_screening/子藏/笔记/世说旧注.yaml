  worth_why: 月下长咏自命先贤风制、被谢瞻戏弄而不觉，痴绝传神之路径可作教训；然此事仅一条轶事，非完整做事流
  era: 东晋
  dates_known: true
- name_zh: 左思
  score: 6
  worth_why: 《三都赋》构思十载、洛阳纸贵之典故源头；此处仅存别传残句，赋序假托名姓.lift 作注一事可谈
  era: 西晋
  dates_known: true
- name_zh: 苏峻
  score: 6
