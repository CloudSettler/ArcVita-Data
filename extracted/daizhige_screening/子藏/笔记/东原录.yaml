source: 子藏/笔记/东原录.md
category: 子藏/笔记
verdict: no_value
skip_reason: 东原录为宋代龚鼎臣考据训诂笔记，所论多为经义考订（尚书错简、易金铉、洪范错简等）与零星杂事，无任何人物具有完整做事周期（缘起、阶段、关键决定、结果），不能构成成事儿时间轴
rejections:
- name_zh: 龚鼎臣
  why_not: 作者本人见于提要仅有官历任免罗列，其著述为考据札记，无可考的名场面与完整做事流；且提要言事迹具宋史本传，本卷无本传内容
- name_zh: 孔子
  why_not: 仅作为删诗书定礼乐的考据对象被零星引述，无做事文本
- name_zh: 董仲舒
  why_not: 仅引凤鸟河图一句话，无做事周期
- name_zh: 皇甫泌
  why_not: 仅提及其治易纪师说一卷之义一条，事迹过简
- name_zh: 王弼
  why_not: 仅作为解子弓为朱张字的注家被引，无做事文本
- name_zh: 孙士毅
  why_not: 仅以四库总纂官身份署名，无做事内容
