source: 子藏/笔记/东阳夜怪录.md
category: 子藏/笔记
verdict: no_value
skip_reason: 志怪小说纪幻，人物皆动物精怪（驼僧安智高、驴卢倚马、牛朱中正、犬敬去文、猫奚锐金、猬苗介立、羊胃藏瓠兄弟）及虚构叙事者成自虚，非真实历史人物，生卒年代不可考，无真实做事流可录
rejections:
- name_zh: 成自虚
  why_not: 虚构叙事者，仅为串场闻异之工具人物无做事周期
- name_zh: 安智高
  why_not: 实为骆驼精怪托名病僧，非真实僧人事迹
- name_zh: 卢倚马
  why_not: 驴精幻形，官衔诗作为寓言虚构
- name_zh: 朱中正
  why_not: 牛精幻形，无可考事迹
- name_zh: 苗介立
  why_not: 猬精幻形，争论为寓言桥段
