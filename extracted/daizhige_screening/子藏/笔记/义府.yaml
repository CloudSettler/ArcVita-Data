source: 子藏/笔记/义府.md
category: 子藏/笔记
verdict: no_value
skip_reason: 《义府》为清代黄生所撰训诂考据札记，通篇为经史子集字词考辨，无人物传叙事迹；所涉尧舜禹汤文武周公等多为解经引证片段，无做事周期文本
rejections:
- name_zh: 黄生
  why_not: 提要仅数十字介绍其为歙县诸生弃举子业一意著述，传文过于简略无完整做事周期
- name_zh: 尧
  why_not: 仅作训诂条目（畴咨厘降等）引证材料，非人物传记无做事内容
- name_zh: 舜
  why_not: 仅见于舜典训诂引文，无做事叙事
- name_zh: 周公旦
  why_not: 已在库且此处仅立政金滕等条目训释非传记
- name_zh: 伯夷
  why_not: 仅吕刑降典一条考证其职掌推测，事迹简略无做事流
- name_zh: 赵明诚
  why_not: 仅金石录书名被引，无事迹文本
- name_zh: 洪适
  why_not: 仅隷释书名被引，无事迹文本
- name_zh: 郦道元
  why_not: 仅水经注书名被引，无事迹文本
- name_zh: 黄庭坚
  why_not: 文中以庭坚误作闻天考证字形，无其行事记载
