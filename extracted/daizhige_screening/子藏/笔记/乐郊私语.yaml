candidates:
- name_zh: 刘基
  score: 8
  worth_why: 善形家言论南龙地脉尽于海盐，预言非周孔不可当，见识不凡；后成开国功臣名场面潜力大
  era: 元末明初
  dates_known: true
- name_zh: 赵孟坚
  score: 8
  worth_why: 宋宗室入元不仕，舟中琴书自适；闭门不纳弟赵孟昂并讥其出仕贰朝，气节名场面，人称名可闻而身不可见
  era: 宋末元初
  dates_known: true
- name_zh: 真谛
  score: 7
  worth_why: 戅騃僧独拒国师发墓淫秽之举，奋木杵退数百人，护古冢完节，事奇可警后世
  era: 元末
  dates_known: false
- name_zh: 杨完者
  score: 7
  worth_why: 苗军统帅大破张士诚水师于嘉兴，然纵兵淫掠致 death 不怨泰州张生不谢寳庆杨之谣，为将不仁之警世教训
  era: 元末
  dates_known: true
- name_zh: 贡师泰
  score: 6
  worth_why: 张氏陷平江时怀印易姓名隐遁海上，气节可取；然做事流事迹简略
  era: 元末
  dates_known: true
