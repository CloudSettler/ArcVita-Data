  worth_why: 登坛拜将破赵平齐垓下会战成做事流全环；请假王约分地成要君决策点；夷三族成不知自全之教训；文另辨蒯通说与自释兵柄之可行
  era: 秦末汉初
  dates_known: true
- name_zh: 贾谊
  score: 8
