source: 子藏/笔记/云谿友议.md
category: 子藏/笔记
verdict: has_candidates
candidates:
- name_zh: 于頔
  score: 8
  worth_why: 襄阳杰一条集中展现其折节延客、赠金赎婢成全崔郊、不夺戎昱爱妓等事，做事流完整且生成名句侯门一入深如海，兼具楷模与争议
  era: 中唐
  dates_known: true
- name_zh: 颜真卿
  score: 8
  worth_why: 鲁公明条记其判杨志坚妻离异案并资助寒儒，扭转江左弃夫之风，是文教治民与移风易俗的关键决策点
  era: 中唐
  dates_known: true
- name_zh: 崔郊
  score: 7
  worth_why: 一诗侯门一入深如海从此萧郎是路人流传千年，其与婢悲欢离合有完整缘起与结果，为成语生成点
  era: 中唐
  dates_known: false
- name_zh: 李筌
  score: 7
  worth_why: 著阃外春秋注阴符经，且预言安禄山为假天子不杀，是兵家与预言者的传奇事迹，类似鬼谷留侯复生
  era: 中唐
  dates_known: false
- name_zh: 白居易
  score: 7
  worth_why: 巫咏难条记其过巫山神女祠见四绝唱而不敢作诗，见其对诗作的敬畏与取舍，可与刘禹锡三年理白帝不敢作诗互证
  era: 中唐
  dates_known: true
- name_zh: 王起
  score: 6
  worth_why: 两主礼闱且三教经典遍览应对武宗试问，被称唐之孔郑，学行事迹可考但做事周期较简
  era: 中唐
  dates_known: true
- name_zh: 薛媛
  score: 6
  worth_why: 真诗解条记其对镜自图写真寄夫，令南楚材幡然悔悟夫妇偕老，是写真诗画的代表作与情感决策点
  era: 中唐
  dates_known: false
- name_zh: 戎昱
  score: 5
  worth_why: 以送妓诗保住爱姬免为于頔所夺，事迹简略但有一首名诗传世
  era: 中唐
  dates_known: false
- name_zh: 郑太穆
  score: 5
  worth_why: 致书于頔傲倪乞济获赐如数，见中唐士人干谒之风，事迹单一
  era: 中唐
  dates_known: false
rejections:
- name_zh: 范摅
  why_not: 作者披载杂事无完整做事周期且生卒未详
- name_zh: 邓仙客
  why_not: 灵丘误条仅记尸解传闻无做事周期
- name_zh: 王轩
  why_not: 苎萝遇传奇志怪无做事周期
- name_zh: 郭凝素
  why_not: 效王轩题石不遇被嘲事迹简略
- name_zh: 繁知一
  why_not: 巫咏难条中仅预题粉壁事单无所成
- name_zh: 刘敬之
  why_not: 讽雍陶薄亲一事单薄无完整周期
