  era: 东汉
  dates_known: true
- name_zh: 许慎
  score: 7
  worth_why: 著《五经异义》胪列今古师说、《说文解字》独尊古文，古学名目自此昭然
  era: 东汉
  dates_known: true
- name_zh: 刘歆
  score: 7
  worth_why: 校书得古文、立古文诸经于学官之争，使古学愈显，汉学今古分派枢纽
  era: 西汉末
  dates_known: true
