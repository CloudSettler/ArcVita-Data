verdict: has_candidates
candidates:
- name_zh: 赵令畤
  score: 7
  worth_why: 宋宗室后裔，元祐中与苏轼交游罚金入元祐党籍，绍兴初袭安定郡王同知大宗正事，撰侯鲭录考辨莺莺传事，经党争起落，做事流与教训兼具
  era: 北宋末南宋初
  dates_known: false
- name_zh: 宋清
  score: 7
  worth_why: 长安卖药人，贫士折券急难倾财救之，岁计所入亦百倍，柳宗元为其作传，市人而为士大夫不能为之事，义商典型
  era: 唐
  dates_known: false
- name_zh: 丁缓
  score: 7
  worth_why: 长安巧工，复原失传的被中香炉，制机环转运四周而炉体常平，可置被褥，古代机械发明代表
  era: 西汉
  dates_known: false
rejections:
