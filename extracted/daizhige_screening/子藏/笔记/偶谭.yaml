source: 子藏/笔记/偶谭.md
category: 子藏/笔记
verdict: no_value
skip_reason: 《偶谭》为明人清言小品集，仅以骈语引诸子典故（老庄孔孟、范蠡渊明、圯上翁商山四皓等），皆为只言片语，无可考的完整做事周期、生卒年代与关键决定，不构成可录入的成事儿时间轴人物
rejections:
- name_zh: 李鼎
  why_not: 作者生平不详，传文仅为格言荟萃，无做人做事完整周期可考
- name_zh: 范蠡
  why_not: 仅「三徙成名」一句调侃，无本传事迹文本
- name_zh: 陶渊明
  why_not: 仅「一朝解绶」一句咏叹，无做事流细节
- name_zh: 张良
  why_not: 库内已有，此处仅「圯上一翁」成语提及，无新增事迹
