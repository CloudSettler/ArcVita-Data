- name_zh: 寇准
  score: 9
  worth_why: 澶渊之盟力主亲征，指麾自若却几乎是澶渊定策第一功臣，又遭钦若谗构罢相，成败转折鲜明
  era: 北宋
  dates_known: true
- name_zh: 元昊
  score: 9
  worth_why: 党项拓跋氏崛起领袖，破甘凉、建制度、称帝建国，屡败宋军，行事流完整且是西夏立国名场面
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 8
  worth_why: 锐意建谋、庆历新政发起人，守延安力阻冒进，先忧后乐的典范人物
  era: 北宋
  dates_known: true
- name_zh: 富弼
  score: 7
  worth_why: 与范仲淹并称进用，庆历主事，后有出使契丹等事迹可考
  era: 北宋
  dates_known: true
- name_zh: 韩琦
  score: 7
  worth_why: 主动献入攻元昊之策，好水川之败为其教训性转折，一生经略西北
  era: 北宋
  dates_known: true
- name_zh: 曹玮
  score: 7
  worth_why: 三都谷大破蕃众一战成名，西北边帅之才，做事点明确
  era: 北宋
  dates_known: true
- name_zh: 夏竦
  score: 6
