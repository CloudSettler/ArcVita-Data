  era: 北宋
  dates_known: true
- name_zh: 尹洙
  score: 6
  worth_why: 直讲献策、作悯忠辨诬二文，文章与兵事皆有活动但结局以罪谴
  era: 北宋
  dates_known: true
- name_zh: 杨亿
  score: 6
  worth_why: 一变文章之体，编西昆酬唱集，扫五代芜鄙文风，文学史节点人物
  era: 北宋
  dates_known: true
- name_zh: 石介
  score: 5
