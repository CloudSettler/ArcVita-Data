  era: 北宋
  dates_known: true
- name_zh: 王曾
  score: 6
  worth_why: 荐人不树私恩，久当朝柄而无私恩，行事有可述且有赞语存世
  era: 北宋
  dates_known: true
- name_zh: 刘平
  score: 5
  worth_why: 轻敌兼程赴援战殁被擒，三川口之败代表人物，可作教训
  era: 北宋
  dates_known: true
- name_zh: 任福
  score: 5
  worth_why: 好水川中伏战殁，贪功轻进的典型教训
  era: 北宋
  dates_known: true
