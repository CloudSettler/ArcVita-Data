source: 子藏/笔记/典论.md
category: 子藏/笔记
person:
  qid: guji-曹丕
  name_zh: 曹丕
  names:
    zh: 曹丕、魏文帝、曹子桓
    en: Cao Pi
  lifespan:
    birth:
      date: '187'
      precision: year
      is_circa: true
      raw: 中平四年生于谯（据史载推）
    death:
      date: 226-06-29
      precision: day
      is_circa: false
      raw: 黄初七年五月丁巳崩
  birth_date: '187'
  death_date: '226'
  era: 汉末三国·曹魏
  reign_ref: 黄初（220—226）
  archetype: bic_writer_statesman
  dilemmas:
  - 文武之道随时而用，乱世习射击剑与著述立言并进
  - 兄长子修死于宛城之难，以次子之身承家业
  - 承汉鼎革之际，取舍于武功征伐与文治德化之间
  lesson: 以著述求不朽——生有七尺之躯，死惟一棺之土，惟立德扬名与文章可传后世
  summary_first_person: '我生于乱世，五岁学射，八岁能骑射，随父征伐，累经离乱。 我好文学，手不释卷，著《典论》论历代帝王与建安七子， 击剑胜邓展，自谓文武兼资。以魏代汉，刻《典论》于太学石碑，
    并以所著与孙权、张昭共赏，期文章不朽于身后。

    '
  source_urls:
  - guji://zizang/biji/dianlun
endeavors:
- id: guji-曹丕-endeavor-1
  name_zh: 撰《典论》并刻石立言
  phases:
  - key: brewing
    name_zh: 乱世问学立志
    labels:
      zh: 承父教·手不释卷
    start_date: '192'
    highlight_event_id: guji-曹丕-event-learn
  - key: breakthrough
    name_zh: 撰典论·论文
    labels:
      zh: 立德扬名·文章经国大业
    start_date: '215'
    highlight_event_id: guji-曹丕-event-dianlun
  - key: climax
    name_zh: 刻石太学
    labels:
      zh: 与太学石经并列
    start_date: '220'
    highlight_event_id: guji-曹丕-event-stone
  - key: closure
    name_zh: 传世影响
    labels:
      zh: 石毁佚存·文心雕龙评其密而不周
    start_date: '226'
  decisions:
  - date: '215'
    title_zh: 集诸儒于肃成门讲论，撰典论诗赋百余篇
    rationale: 疫疠数起士人凋落，深感寿尽名灭，惟著篇籍可求不朽
  - date: '221'
    title_zh: 班《太宗论》于天下，明示不愿征伐
    rationale: 以汉文帝宽仁抚尉佗故事，示以德化民、不欲攻孙权
- id: guji-曹丕-endeavor-2
  name_zh: 修文习武，文武兼资
  phases:
  - key: brewing
    name_zh: 幼学骑射从征
    labels:
      zh: 五岁学射·六岁知射·八岁骑射
    start_date: '192'
    highlight_event_id: guji-曹丕-event-learn
  - key: breakthrough
    name_zh: 击剑胜邓展
    labels:
      zh: 以芋蔗为杖·三中其臂
    start_date: '205'
    highlight_event_id: guji-曹丕-event-fencing
  - key: climax
    name_zh: 猎邺西终日
    labels:
      zh: 手获獐鹿九雉兔三十余
    start_date: '205'
  - key: closure
    name_zh: 自论长短不矜己长
    labels:
      zh: 余亦愿邓将军捐弃故伎更受要道
    start_date: '205'
  decisions:
  - date: '205'
    title_zh: 与邓展论剑并较技，弃故伎论要道
    rationale: 借阳庆授淳于意秘术之典，讽展更受善术，示不自谓己长
events:
- id: guji-曹丕-event-birth
  type: birth
  title_zh: 曹丕生于谯
  date: '187'
  year_of: 187
- id: guji-曹丕-event-learn
  type: endeavor
  title_zh: 随父学射学骑，少好弓马于旅戎之间
  date: 192-08
  year_of: 192
  detail: 董卓乱政，父教余学射，六岁而知射，八岁能骑射，每征伐常从
- id: guji-曹丕-event-fencing
  type: endeavor
  title_zh: 与奋威将军邓展论剑，以芋蔗为杖三中其臂
  date: '205'
  year_of: 205
  detail: 从史阿学王越剑法，酒酣耳热方食芋蔗以为杖，数交截其颡，坐中惊视
- id: guji-曹丕-event-dianlun
  type: endeavor
  title_zh: 撰《典论》，作《论文》论建安七子
  date: '215'
  year_of: 215
  detail: 文人相轻自古而然；文以气为主，文章经国之大业不朽之盛事，融等已逝惟徐干著论成一家言
- id: guji-曹丕-event-stone
  type: endeavor
  title_zh: 《典论》刻石太学，与太学石经并列
  date: '220'
  year_of: 220
  detail: 刻于石凡六碑，后有西征记者见其尚存；素书所有典论诗赋与孙权，纸写一通与张昭
- id: guji-曹丕-event-death
  type: death
  title_zh: 魏文帝崩
  date: 226-06-29
  year_of: 226
