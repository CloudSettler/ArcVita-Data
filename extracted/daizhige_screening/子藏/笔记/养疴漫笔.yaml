source: 子藏/笔记/养疴漫笔.md
category: 子藏/笔记
verdict: has_candidates
candidates:
- name_zh: 陈亮
  score: 8
  worth_why: 访辛弃疾斩马定交、夜盗骏马而逃、事后修书假十万缗济贫而辛竟如数与之，做事流离奇完整，足见豪杰胆识与两人机锋
  era: 南宋孝宗朝
  dates_known: true
- name_zh: 曹彬
  score: 8
  worth_why: 平江南受降李煜，介胄在身拜不及答，料李煜畏死必不自尽，识量安众，灭国之役决策与结果俱全
  era: 北宋初
  dates_known: true
- name_zh: 李煜
  score: 8
  worth_why: 亡国之君典型，咏扇诗揖让月在手、太祖满怀之风何足尚一语成谶，教训深刻
  era: 五代末宋初
  dates_known: true
- name_zh: 苏轼
  score: 7
  worth_why: 知贡举密券失窃、章氏二子窃题得中而李方叔下第，平生漫说古战场一典化成语料，盛德与叹恨并存
  era: 北宋元祐间
  dates_known: true
- name_zh: 汪玉山
  score: 7
  worth_why: 知贡举以三古字为验私友却误中他人，友人冒子得中竞因十年女棺托梦，戏剧性强，做事周期完整
  era: 南宋淳熙间
  dates_known: true
- name_zh: 辛弃疾
  score: 6
  worth_why: 与陈亮定交、纵论南北利害与钱塘形胜，沉雄谋略见于一篇，但本文仅片段
  era: 南宋
  dates_known: true
- name_zh: 翟钦甫
  score: 5
  worth_why: 金人以一首清庵诗反转众人轻侮，即席成文的名场面，但事迹孤立无完整做事流
  era: 金
  dates_known: false
- name_zh: 杨存中
  score: 5
  worth_why: 铸二胜环寓两宫北还之志，伶人可惜二胜环放在脑后谏语成典，执艺事以谏，但主要事迹在别传
  era: 南宋绍兴间
  dates_known: true
rejections:
- name_zh: 王黼
  why_not: 仅为邻僧积饭济其家的背景人物，本人无做事流
- name_zh: 张南轩
  why_not: 记奇疾而卒与敛时通身透明，属异闻非做事周期
- name_zh: 王仁裕远祖母
  why_not: 二百余岁碧眼老妪开箱不返 sooner 志怪，非可考人物
- name_zh: 伶人
  why_not: 无名氏仅一句谏语
- name_zh: 辉僧
  why_not: 仅一动不如一静两句名对，无做事流
- name_zh: 漆匠张某
  why_not: 志怪遇鬼故事，无做事价值
- name_zh: 王钦若
  why_not: 献芝草媚上仅一事，不足以成录
- name_zh: 谈命老者
  why_not: 无名术士与后进问答，非可录人物
