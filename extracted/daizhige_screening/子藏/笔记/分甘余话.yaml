- name_zh: 王士禛
  score: 8
  worth_why: 清初诗坛领袖号渔洋山人，自幼嗜读书手不释卷，仕宦五十年官至刑部尚书，七十归田著《分甘余话》，亦曾以祭告之职典祀南海、入蜀等名场面，做事周期完整可考
  era: 清初
  dates_known: true
- name_zh: 王象晋
  score: 6
  worth_why: 万历中遭党忌谪官，家居十载甘农圃，撰成《群芳谱》由汲古阁刊行；康熙间康熙帝命开馆广续为《佩文斋广群芳谱》一百卷御制作序，家学传承有示范意义
  era: 明末清初
  dates_known: false
