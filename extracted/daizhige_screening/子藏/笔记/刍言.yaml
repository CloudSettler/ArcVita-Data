verdict: no_value
skip_reason: 《刍言》为宋崔敦礼所撰政论随笔集，通篇为说理格言，无具体人物行事叙事；崔敦礼本人传文仅提要及时弟同登绍兴进士、官至诸王宫大小学教授、买田居溧阳，无完整做事周期、名场面或可供后人效法的关键决策，时间仅活动年代约略可考，事迹简略，评分低于录入线
rejections:
- name_zh: 崔敦礼
  why_not: 仅提要数十字节略其登第与官职，无做事流、无关键决定与结果，属语录著述家而非成事人物
- name_zh: 崔敦诗
  why_not: 仅作为其弟同登进士被顺带提及，无独立事迹
