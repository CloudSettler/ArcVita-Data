candidates:
- name_zh: 鲍宣
  score: 7
  worth_why: 道遇书生疾卒、殡殓留银素书；骏马报恩引人识侯、得荐而显；三入司隶再入公，鲍氏骢歌谣传世，做事与善报因果链完整
  era: 西汉末
  dates_known: true
- name_zh: 费长房
  score: 6
  worth_why: 汉代方士传奇，能医魅、敕葛陂君、致千里大雨、缩地脉，事迹生动；但多为神异超能展示，缺少关键抉择与结局转折
  era: 东汉
  dates_known: true
rejections:
