  why_not: 传说铸剑人物，眉间尺复仇故事属神话母题，非可考做事周期
- name_zh: 莫邪
  why_not: 同上，仅作为传说角色出现
- name_zh: 赤鼻
  why_not: 神话复仇情节人物，无历史可考信息
- name_zh: 魏公子无忌
  why_not: 已见于史传体系，此条仅捕鹞轶事一事，无完整做事流
- name_zh: 鲁少千
  why_not: 得仙人符驱魅受钱一事，神异色彩浓，事迹单薄
- name_zh: 公孙达
  why_not: 死后附灵训子一条，无生前做事周期
- name_zh: 栾侯
  why_not: 鬼神角色，除蝗一事依赖祭祀传闻，非人类做事
