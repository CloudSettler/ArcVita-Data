verdict: has_candidates
candidates:
- name_zh: 张巡
  score: 9
  worth_why: 死守睢阳四十七日千二百余阵，食尽煮纸布和茶汁而不去，忠烈名场面极多，安史之乱关键人物
  era: 唐安史之乱
  dates_known: true
- name_zh: 许远
  score: 7
  worth_why: 与张巡共守睢阳死善道，祭纛文祭城隍文为时所称
  era: 唐安史之乱
  dates_known: true
- name_zh: 刘禹锡
  score: 8
  worth_why: 本书即其白帝城讲论实录，论诗文须有来处、押字审慎等治学方法，做事流与代表作可考
  era: 中唐
  dates_known: true
- name_zh: 崔造
  score: 7
  worth_why: 布衣白衣夔至宰相，赵山人预言先贬后拜相，泾原兵变姜公辅进言事件中同制拜相，起伏完整
  era: 唐德宗朝
  dates_known: true
- name_zh: 姜公辅
  score: 8
  worth_why: 泾原之变前上疏防朱泚未被纳，德宗幸奉天后擢为宰相，关键决策略得教训鲜明
  era: 唐德宗朝
  dates_known: true
- name_zh: 李泌
  score: 7
  worth_why: 对德宗解天宝年号之由、肃宗师臣事，谋臣答对名场面可考
  era: 唐德宗朝
  dates_known: true
- name_zh: 宋之问
  score: 7
  worth_why: 因夺外甥刘希夷名句未遂以土袋压杀之，负面目.sample警示文人劣行，反例教训价值高
  era: 初唐
  dates_known: true
- name_zh: 刘希夷
  score: 6
  worth_why: 年年岁岁花相似名句传世而死于此句，传奇色彩足但做事流简
  era: 初唐
  dates_known: true
- name_zh: 雷万春
  score: 6
  worth_why: 城上中弩面不动，敌疑木人，守城军令化身名场面，然生平仅此一节
  era: 唐安史之乱
  dates_known: true
- name_zh: 令狐潮
  score: 5
  worth_why: 雍丘劝降与攻守对话可作张巡事业的对手面，独立做事流不足
  era: 唐安史之乱
  dates_known: true
rejections:
