source: 子藏/笔记/删补文苑楂橘.md
category: 子藏/笔记
person:
  qid: guji-虬髯客
  name_zh: 虬髯客
  names:
    zh: 虬髯客
    en: 截至目前，Curly-Bearded Guest
  era: 隋末唐初
  reign_ref: 隋炀帝—唐太宗贞观
  archetype: 乱世豪侠退位让贤者
  dilemmas:
  - 欲争夺天下与确认真主之间的进退抉择
  - 杀负心人复仇十年 vs 继续逐鹿之业
  lesson: 识势知人，敢断进退——争天下不成则转海外另建功业
  summary_first_person: 我本欲在此界争逐鹿之业，然见李世民神采，知天命有归，遂尽散家财赠李靖夫妇以佐真主，自率家眷远赴海外，终杀扶苏国主而自立为王。
  source_urls:
  - https://zh.wikisource.org/wiki/虬髯客传
endeavors:
- id: guji-虬髯客-endeavor-1
  name_zh: 望气访真主与让贤赠产
  phases:
  - key: brewing
    name_zh: 复仇蓄志游太原
    labels:
      zh:
      - 侠行
      start_date: 约618
    highlight_event_id: guji-虬髯客-event-2
  - key: breakthrough
    name_zh: 汾阳桥会李靖灵石旅舍结义
    labels:
      zh:
      - 风尘三侠
      start_date: 约618
    highlight_event_id: guji-虬髯客-event-3
  - key: climax
    name_zh: 观李世民而心死
    labels:
      zh:
      - 识真主
      start_date: 约618
    highlight_event_id: guji-虬髯客-event-4
  - key: closure
    name_zh: 尽赠家财赴海外建国
    labels:
      zh:
      - 让贤
      start_date: 约619
    highlight_event_id: guji-虬髯客-event-5
  decisions:
  - date: 约618
    title_zh: 闻望气者言太原有奇气，决意亲往访异人
    rationale: 欲于此世界求事建少功业，须先验真主之有无
  - date: 约618
    title_zh: 再见文皇后决意放弃中原逐鹿
    rationale: 道士见李世民而惨然敛棋，此局全输，知天命不在我
  - date: 约619
    title_zh: 悉以文簿匙钥珍货赠李靖夫妇
    rationale: 既有真主，留此何为，以家财佐其成就大业，另图海外
events:
- id: guji-虬髯客-event-birth
  date: 约600
  year_of: 600
  type: birth
  name_zh: 虬髯客生
  detail: 生卒年不可考，据传为隋末奇侠，或云张姓行三
- id: guji-虬髯客-event-death
  date: 约630
  year_of: 630
  type: death
  name_zh: 虬髯客卒
  detail: 贞观中南蛮奏海船千艘入扶苏国杀主自立，此后事迹不详
- id: guji-虬髯客-event-2
  date: 约618
  year_of: 618
  type: endeavor
  name_zh: 驴上来投，革囊取负心人心肝共食
  detail: 灵石旅舍中自言衔恨负心者十年今始得释，显露快意恩仇之烈士本色
- id: guji-虬髯客-event-3
  date: 约618
  year_of: 618
  type: endeavor
  name_zh: 与李靖红拂结为兄妹风尘三侠
  detail: 与张氏论雁行结为兄妹，约汾阳桥相见，同诣刘文静引见李世民
- id: guji-虬髯客-event-4
  date: 约618
  year_of: 618
  type: endeavor
  name_zh: 初见李世民曰真天子也
  detail: 虬髯默居座末见之默然心死，既而谓十得八九；道士见而对弈惨然认输
- id: guji-虬髯客-event-5
  date: 约619
  year_of: 619
  type: endeavor
  name_zh: 尽散家财携妻远去海外
  detail: 虚构一小板门内有婢奴三十余人女乐二十人，二十床文簿匙钥尽赠李靖以佐真主，自与妻戎服乘马数步不见
- id: guji-虬髯客-event-6
  date: 约630
  year_of: 630
  type: endeavor
  name_zh: 南蛮奏其入扶苏国自立为王
  detail: 贞观中有海船千艘甲兵数十万入扶苏国杀其主自立；李靖夫妇沥酒向东南相贺
verdict: has_candidates
