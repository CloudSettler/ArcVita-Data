candidates:
- name_zh: 杨一清
  score: 9
  worth_why: 总制陕西整军经武；平宁夏安化王之变中运筹；改良大将军铳火器并推广行营；改革营阵操法选锋选马；因拒附刘瑾几遭祸后借张永除瑾，功成而屡辞召命勉全晚节
  era: 明代成化至嘉靖间
  dates_known: true
rejections:
- name_zh: 曹雄
  why_not: 首谋平定何锦之乱有功但旋以缔姻刘瑾身死家籍，事迹片段依附杨一清事迹，可作事件坐标不单独录入
- name_zh: 曹谦
  why_not: 有机略善义举而卒党恶被收箠死狱中，主要作曹雄事件旁证，做事流不完整
- name_zh: 仇钺
  why_not: 宁夏之变内应成大功，但本传仅数句借曹雄书引出，无独立完整叙事，可合入杨一清/宁夏之变事件
- name_zh: 何锦
  why_not: 逆乱首恶，作乱起因败亡仅作杨一清论述背景
- name_zh: 才宽
  why_not: 轻出塞中矢阵死，仅作杨一清论兵之反面教训，事迹过简
- name_zh: 安惟学
  why_not: 巡抚任内激变被杀，代瑾党受祸，仅作事件坐标
- name_zh: 杨宏
  why_not: 试铳一节人物，无独立做事周期
- name_zh: 强晟
  why_not: 布衣进言者，仅见杨一清退守之德，无独立事迹
