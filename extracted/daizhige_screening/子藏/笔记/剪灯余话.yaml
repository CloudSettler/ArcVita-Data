candidates:
- name_zh: 李昌祺
  score: 6
  worth_why: 《剪灯余话》作者，仿《剪灯新话》二十篇成书于谪役羁旅之间；仕至广西左布政使，有惩劝世教之志，附生卒可考
  era: 明初
  dates_known: true
- name_zh: 饼师妇
  score: 5
  worth_why: 长安夜行录主角，被宁王强夺誓死不从，拒程姬之疾幸免，托人辩正《饼师妇吟》之诬；贞烈典型，然为小说虚构人物
  era: 唐开元
  dates_known: false
rejections:
- name_zh: 巫马期仁
  why_not: 仅作访古传话线索人物，夜遇冥夫妇代传冤情，本人无做事周期
- name_zh: 秦王妃辅官汤铭、文原吉
  why_not: 传中仅以老成宿德导翊秦王、游历访古，无完整做事流
- name_zh: 宁王
  why_not: 见于冥谈追述，夺人妻一事为负面点缀，非天下共主级突出做事
- name_zh: 桂衡
  why_not: 仅叙及作《柔柔传》，事迹无考
- name_zh: 瞿佑
  why_not: 仅作为《剪灯新话》作者被提及，非本传主体
