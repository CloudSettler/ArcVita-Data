category: 子藏/笔记
verdict: has_candidates
candidates:
- name_zh: 孙光宪
  score: 7
  worth_why: 由唐入荆南幕历仕三朝，劝高继冲献三州归宋得太祖嘉许授黄州刺史；著北梦琐言续通历等，存唐五代佚事有功于史料；劝归一念成事且善终
  era: 唐末五代宋初
  dates_known: true
- name_zh: 李德裕
  score: 8
  worth_why: 牛李党争主角，抑白居易、陷吴湘、诛贬牛党诸事俱全；功业与毁誉并存，是权臣成败的典型教训
  era: 中晚唐
  dates_known: true
- name_zh: 牛僧孺
  score: 7
  worth_why: 少贫力学登第，政事堂不趋宰相自立风骨，历镇扬州建州位至宰相；与李德裕相争四十年的事局俱可考
  era: 中晚唐
  dates_known: true
- name_zh: 皮日休
  score: 6
  worth_why: 献书请以孟子为学科、韩愈配飨太学，为唐宋思想转折先声；郑愚戏貌而一日废二日之对成佳话；黄巢中遇害结局可考
  era: 晚唐
  dates_known: true
- name_zh: 刘三复
  score: 6
  worth_why: 少贫苦学为李德裕草表立身登第，文理贵中不贵速成名言；子刘邺上表雪德裕归葬朱崖，报恩传家一事有始有终
  era: 晚唐
  dates_known: true
- name_zh: 顾师言
  score: 5
  worth_why: 与日本国王子对弈三十三镇神子，胜第三手之典传为围棋名场面，然人事简历简略
  era: 唐宣宗朝
  dates_known: false
rejections:
- name_zh: 唐宣宗
  score: 5
  why_not: 自题乡贡进士留心贡举有轶事但整个人物以君主纪事为主，作时间坐标为宜
- name_zh: 杜悰
  why_not: 号秃角犀，甘食窃位无功无德，唯足为反面注脚无做事周期
- name_zh: 郑神佐之女
  why_not: 庐墓截发迎父遗骸烈孝可嘉，但属个人孝行无事业时间轴
- name_zh: 安重霸
  why_not: 黩货召邓生弈勒索钱财一则笑谈，无完整做事流
- name_zh: 令狐绹
  why_not: 传文仅及预拔文解与倾陷李德裕诸攻讦语，事绩零散难成周期
