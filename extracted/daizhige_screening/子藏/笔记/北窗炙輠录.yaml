candidates:
- name_zh: 王安石
  score: 8
  worth_why: 熙宁变法主持者，本书记其闻程颢之言几欲改法、后因面折而罢，又记治吕惠卿之酷烈，歧路决策点清晰
  era: 北宋
  dates_known: true
- name_zh: 程颢
  score: 7
  worth_why: 与王安石论新法，和气消怒几致改法，伊川称之；典型「以柔济刚」的沟通名场面
  era: 北宋
  dates_known: true
- name_zh: 韩琦
  score: 8
  worth_why: 与范仲淹议西事不合能握手消融；仁宗郊祀暴中风时止哗摄行事，百官无知者，当大事典范
  era: 北宋
  dates_known: true
- name_zh: 范仲淹
  score: 9
  worth_why: 先忧后乐、主持庆历新政、御西夏；本书存其名言「私罪不可有公罪不可无」
  era: 北宋
  dates_known: true
- name_zh: 文彦博
  score: 7
  worth_why: 皇帝暴中风之际临机断事、秘不外宣、摄行郊礼，危机处理极佳标本
  era: 北宋
  dates_known: true
- name_zh: 苏轼
  score: 7
  worth_why: 乌台诗案、贬谪著述、政务文学俱名场面；本书存其戏论扬子云轶事
  era: 北宋
  dates_known: true
- name_zh: 程颐
  score: 7
  worth_why: 洛学宗师，责范纯仁数事而度量不及；自省「吾辈当中分新法之弊」具教训价值
  era: 北宋
  dates_known: true
- name_zh: 吕惠卿
  score: 6
  worth_why: 叛王安石、托人置田事发，牵连死狱，警示可录但事迹依赖外围
  era: 北宋
  dates_known: true
- name_zh: 赵抃
  score: 6
  worth_why: 赴试不肯瞒税，「今已欺官何况仕路」修身起点典型；行事流短
  era: 北宋
  dates_known: true
- name_zh: 胡瑗
  score: 7
  worth_why: 拒习仪而临朝拜舞如素宦，宋初教育大家，教养范式可考
  era: 北宋
  dates_known: true
- name_zh: 范纯仁
  score: 6
  worth_why: 被程颐连责不辩一词、先言之于札子的度量故事极佳；然完整周期须他传
  era: 北宋
  dates_known: true
- name_zh: 史载之
  score: 6
  worth_why: 以二十文紫苑通蔡京肠秘一举成名，医案奇谋 reversals 完整
  era: 北宋
  dates_known: false
- name_zh: 黄师文
  score: 6
  worth_why: 建中汤溃痈、惊痰成块等系列医案，临床奇验可作医者谱系；生平年代模糊
  era: 北宋
  dates_known: false
- name_zh: 张九成
  score: 6
  worth_why: 状元魁天下而千里从学者汇、绍兴和议忤秦桧遭贬，气节可录
  era: 南宋
  dates_known: true
- name_zh: 蔡京
  score: 6
  worth_why: 权相祸国样本，本书记其病与狠戾治狱，可作教训型人物但须他传补全
  era: 北宋
  dates_known: true
