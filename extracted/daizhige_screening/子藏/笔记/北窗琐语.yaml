candidates:
- name_zh: 方国珍（方谷珍）
  score: 8
  worth_why: 元末首举义旗，据台温明三府，反覆降叛终归明，做事流完整且有名场面答太祖语
  era: 元末明初
  dates_known: true
- name_zh: 于谦（于肃愍）
  score: 9
  worth_why: 夺门之变后临刑就义，大明重整旧山河之评，模范与教训兼备
  era: 明代
  dates_known: true
- name_zh: 徐达（中山武宁王）
  score: 7
  worth_why: 明开国第一名将，其妻谢氏被诛事见君臣之险，功高震主之教训
  era: 元末明初
  dates_known: true
- name_zh: 夏原吉（夏元吉）
  score: 7
  worth_why: 平交趾升赏之对，多升不如重赏，为国家建言之准，理财名臣
  era: 明初
  dates_known: true
- name_zh: 陈平
  score: 7
  worth_why: 文帝问决狱钱谷，陈平对以有主者，宰相差事之经典君臣对话
  era: 西汉初
  dates_known: true
- name_zh: 贾似道
  score: 7
  worth_why: 度王田急、贩私盐误国，失淮失蜀失荆襄之讥，权臣误国典型教训
  era: 南宋末
  dates_known: true
- name_zh: 朱元璋（明太祖）
  score: 6
  worth_why: 微行闻诗、诛谢夫人、碎水晶宫漏等事见其用人峻法，君主故低优先
  era: 明初
  dates_known: true
- name_zh: 陶俨（陶时庄）
  score: 6
  worth_why: 守扬州作铜壶翁传，兴复谯楼刻漏，文治 оборот事迹可考
  era: 明嘉靖
  dates_known: true
