candidates:
- name_zh: 樗里子
  score: 8
  worth_why: 号智囊历事三王战功卓著，生前卜葬预言百年后汉宫覆其墓，做事流完整且有传奇名场面
  era: 战国末秦
  dates_known: true
- name_zh: 李秀
  score: 8
  worth_why: 宁州被围父死城困，女承父风婴城固守粮尽炙鼠伺隙出兵破敌，罕见的女性守城做事周期
  era: 西晋末
  dates_known: true
- name_zh: 荀灌
  score: 9
  worth_why: 十三岁率勇士逾城突围夜出且战且前求援破宛城之围，突围求援过程完整堪称名场面
  era: 西晋末
  dates_known: true
- name_zh: 任氏
  score: 7
  worth_why: 崔旴妾散家财募兵击走杨子琳救成都，乱局中一次关键决断即成事，事迹虽短而完整
  era: 唐代宗时
  dates_known: false
- name_zh: 司马光
  score: 7
  worth_why: 独乐园拒茶汤钱反哺园丁创井亭便民，不爱钱之事可作人格典范，然其核心事业在正史此为侧影
  era: 北宋
  dates_known: true
- name_zh: 谢瞻
  score: 7
  worth_why: 兄忧弟权倾朝野以篱隔门庭临终遗书诫弟，保家门之智与谢晦伏诛对照成警世教训
  era: 晋末宋初
  dates_known: true
- name_zh: 毕再遇
  score: 7
  worth_why: 开禧北伐诸将皆败独累有功金人望旗即避，爱马殉主故事传世，做事周期与人格均足录
  era: 南宋开禧间
  dates_known: true
- name_zh: 和洽
  score: 7
  worth_why: 劝曹操人才不可一节取反对以节俭格物，促成唯才是举令，制度建言之各例完整
  era: 东汉末
  dates_known: true
- name_zh: 阮孝绪
  score: 6
  worth_why: 知外弟王晏必败吐酱覆之拒不相见，卒免于罪，出处决断堪称知人明哲之鉴
  era: 南齐
  dates_known: true
