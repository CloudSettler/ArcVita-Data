  worth_why: 明亡后一介市商变家资冒险入城，为先帝后营葬以天子礼，义薄云天又功成不受官帑，成事链完整且为名场面级义举
  era: 明末清初
  dates_known: false
- name_zh: 多尔衮
  score: 8
  worth_why: 摄政定鼎中原、权倾朝野称皇父，从专权到身后削号，权谋周期完整足为后人镜鉴
  era: 清初
  dates_known: true
- name_zh: 博尔济太后
  score: 7
  worth_why: 传说以参汁说降洪承畴、定削藩下嫁之策，帷幄运筹有可考做事节点
  era: 清初
  dates_known: true
