  reign_ref: 成化、正德
  archetype: scholar-official
  dilemmas:
  - - 闲居病退，著述消日是否合于士节
    - 以铅椠自守，效洪迈罗大经成一家之言
  - - 辨驳前辈名书是否失厚道
    - 举容斋之说而论其是非，宁明而不阿
  lesson: 著述不系于遭际，惟其言可传；病闲不废铅椠，考证务求明晳。
  summary_first_person: 我本江宁人而占云南金齿军籍，成化甲辰成进士，官至户部侍郎。闲居四载，久病之余取容斋随笔、鹤林玉落数十家杂说消日，遂效而为一书，先摘容斋数十事论其未安，并广以见闻，题曰南园漫録。
  source_urls:
  - - 子藏/笔记/南园漫录.md
