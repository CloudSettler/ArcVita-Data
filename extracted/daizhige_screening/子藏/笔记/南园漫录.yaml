- name_zh: 张志淳
  score: 7
  worth_why: 闲居病中仿容斋随笔鹤林玉露成南园漫录十卷，辨洪迈之失，考证避讳桂辨永昌金齿诸条详核，可与明史相参
  era: 明成化至正德间
  dates_known: true
- name_zh: 王恕
  score: 7
  worth_why: 吏部尚书惜才护夏鍭而不屈法，署门拒贿以耻感立信，法守与风骨可为后世范
  era: 明成化弘治间
  dates_known: true
- name_zh: 万安
  score: 6
  worth_why: 首开阁老请授勋阶之例，坏法守之端，可为制度败坏之教训
  era: 明成化间
  dates_known: true
- name_zh: 岳飞
  score: 9
  worth_why: 淮西兵柄之争诸说互异，容斋朱子汪藻记载抵牾，见一时是非难定、君子蒙寃之叹
  era: 南宋
  dates_known: true
rejections:
