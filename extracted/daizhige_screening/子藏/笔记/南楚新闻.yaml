candidates:
- name_zh: 杜悰
  score: 6
  worth_why: 诛秦匡谋后骤疾、薨、殓函短而抑尸，枉杀获报之警世教训完整
  era: 晚唐咸通年间
  dates_known: true
- name_zh: 郭七郎
  score: 6
  worth_why: 富家子买官横州刺史，遭寇乱、舟沉母亡，沦为市井捉梢郭使君，兴衰无常之戒
  era: 晚唐乾符年间
  dates_known: true
- name_zh: 崔铉
  score: 6
  worth_why: 童子咏鹰诗万里碧霄终一去，登第久居廊庙三拥节旄，名场面为咏鹰诗
  era: 唐大历至咸通
  dates_known: true
- name_zh: 謇宗儒
  score: 5
  worth_why: 梦孔子更名助战，大破蛮寇由军校至司农卿，事奇但过程简略
  era: 晚唐咸通二年前后
  dates_known: false
- name_zh: 常修
  score: 5
  worth_why: 盐贾之子得关氏为妻督学二十余年而登科，罗隐赠诗相酬，勤学典型
  era: 晚唐咸通六年登科
  dates_known: true
rejections:
