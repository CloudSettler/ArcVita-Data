verdict: has_candidates
candidates:
- name_zh: 吉善行
  score: 7
  worth_why: 羊角山得太上老君显圣传言、献石龟为信、驰驿宣敕平刘黑闼，是武德年间“李唐受命于老子”神权工程的关键执行者，做事流完整并催生庆唐观、神山县等制度结果
  era: 隋末唐初
  dates_known: true
- name_zh: 王远知
  score: 7
  worth_why: 先后预言李渊受命，历事高祖太宗两朝，获朝散大夫与银青光禄大夫，开羽衣赐紫衣之制，山下道教宗师做事链可考
  era: 隋末唐初
  dates_known: true
- name_zh: 唐高祖
  score: 7
  worth_why: 利用霍山神、老君显圣传说构建政权合法性：立庙改县、授官赐物、敕道士隶宗正寺，一套神道设教的运作记录完整
  era: 隋末唐初
  dates_known: true
- name_zh: 唐玄宗
  score: 8
  worth_why: 崇道名场面最多：注《道德经》、设道举、置太清宫、制《霓裳羽衣曲》、田同秀桃林得符改元天宝、骊山降圣阁事件，造神运作与制度建设并茂，是崇道史的分水岭
  era: 唐代
  dates_known: true
- name_zh: 武则天
  score: 6
  worth_why: 欲王诸武因老君显圣传言而止，舍行宫为观，庆山涌出置县，可作政治与祥瑞互动的做事案例，但细节偏短
  era: 唐代
  dates_known: true
- name_zh: 汉宣帝
  score: 6
  worth_why: 李恽抱犊山获天书、张纯上献、检校茂陵、为武帝造观度道士，一段寻根崇道的做事周期可考
  era: 西汉
  dates_known: true
- name_zh: 张敬忠
  score: 6
  worth_why: 奏报蜀州老君应现木文圣像，差官检覆一百三十人联署状同，迎像柱入京供养，官僚系统运作祥瑞的完整案例
  era: 唐代
  dates_known: true
