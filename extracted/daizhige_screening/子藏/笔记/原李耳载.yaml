  score: 7
  worth_why: 明末孝廉，闯贼遣宋献策致书胁仕，婉辞得全；著原李耳载存文献，气节可传
  era: 明末清初
  dates_known: false
- name_zh: 黄洽中
  score: 7
  worth_why: 太原太守欲复粮征本色便民，不听马朝阳忠言致民大扰被劾禠职，志在利民而拘古法，可为施政教训
  era: 明代
  dates_known: false
- name_zh: 马朝阳
  score: 7
  worth_why: 独持异议剖析本色折色利弊，言验如神，历官陕西左布政使， bee 事流完整
  era: 明代
  dates_known: false
- name_zh: 魏允贞
  score: 8
  worth_why: 纠张居正夺情廷杖几毙，抚晋抗中贵税使檄驿勿应付，刚直有名场面
  era: 明万历
  dates_known: true
- name_zh: 赵文炳
  score: 8
  worth_why: 不击税府而密令两关阻其.getColumnIndex通京，俟其自毙，忍辱成事之智谋典型
