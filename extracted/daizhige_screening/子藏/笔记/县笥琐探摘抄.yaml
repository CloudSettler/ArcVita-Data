source: 子藏/笔记/县笥琐探摘抄.md
category: 子藏/笔记
verdict: has_candidates
candidates:
- name_zh: 况钟
  score: 9
  worth_why: 小吏起家荐贤任苏州知府，杖杀势家、除京运米二十余万，荐邹亮不为匿名书所沮，民叩阙乞留八万人并作歌谣，完整治郡做事流与清官典范
  era: 明永乐至正统
  dates_known: true
- name_zh: 王骥
  score: 8
  worth_why: 征麓川有军功， Chung覆舟山阅师创立五伍递进阵法体系，讲兵制约束之法具制度发明价值
  era: 明正统
  dates_known: true
- name_zh: 王直
  score: 8
  worth_why: 吏部持正拒为请托作诗，闻聂大年讥讽不顾，终泣而铭其墓，正面呈现休休有容的容德做事流
  era: 明正统至景泰
  dates_known: true
- name_zh: 解缙
  score: 7
  worth_why: 顷刻数千言名噪一时，东南五才子之首，作《神龟赋》第一答对显才与自持
  era: 明洪武至永乐
  dates_known: true
- name_zh: 王汝玉
  score: 7
  worth_why: 《神龟赋》亲定第一，撰安南贺表得宠，然恃才自矜终下狱死，才高失慎之教训
  era: 明永乐
  dates_known: true
- name_zh: 杨士奇
  score: 7
  worth_why: 荐陈继以一篇文章成翰林博士，爱士荐贤之典范决策
  era: 明永乐至正统
  dates_known: true
- name_zh: 姚善
  score: 7
  worth_why: 三过王宾以诚动隐士，许钱继忠就宾位相见礼贤下士有完整情节
  era: 明建文前后
  dates_known: true
- name_zh: 轩輗
  score: 6
  worth_why: 持己严峻不交一人的清廉特行，可作清官侧影，事迹偏静态
  era: 明英宗
  dates_known: true
- name_zh: 曾棨
  score: 6
  worth_why: 御试《天马歌》先成夺魁之称江西才子，绝笔词见达观，事迹稍简
  era: 明永乐
  dates_known: true
- name_zh: 刘蕡
  score: 6
  worth_why: 封策直言阉宦被黜谪死，言祸之教训，但凭转述非本传
  era: 晚唐
  dates_known: true
rejections:
- name_zh: 王宾
  why_not: 仅作为姚善礼贤对象出现，个人做事流不独立
- name_zh: 钱继忠
  why_not: 仅为守礼一节故事，无完整事业
- name_zh: 邹亮
  why_not: 因况钟荐举而显，无自主做事周期
- name_zh: 聂大年
  why_not: 仅题诗一事与临终托铭，事迹零碎
- name_zh: 陈继
  why_not: 只存被荐得官一节，无做事周期
- name_zh: 刘铉
  why_not: 谈学与才之别无做事事件
