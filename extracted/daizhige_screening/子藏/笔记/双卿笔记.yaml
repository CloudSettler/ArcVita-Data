  name_zh: 华国文
  names:
    zh: 华国文
    en: Hua Guowen
  lifespan:
    birth:
      precision: year
      is_circa: true
      raw: 明代平江吴邑人，生年未详，十五岁已显才名
    death:
      is_circa: true
  era: 明代
  archetype: 才子发奋型——由沉溺闺房之乐到克己向学、科场夺魁
  dilemmas:
  - 情爱与功名之冲突：新婚溺于私爱，小觑功名，触怒严父
  - 孝道与承诺之两难：允父外出就学，则失爱于妻；留家 则重触乎父
  lesson: 溺于私爱必荒学业；过而能改、志坚自励，方成大器
  summary_first_person: 我年少才捷而一度沉溺闺房之乐，被严父责以立身扬名乃足为孝，遂斩断柔情、外出就学，一考夺魁，并恒以妻书自策。
  source_urls:
  - 子藏/笔记/双卿笔记.md
