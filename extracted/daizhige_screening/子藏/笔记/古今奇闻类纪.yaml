category: 子藏/笔记
verdict: has_candidates
candidates:
- name_zh: 徐有贞
  score: 8
  worth_why: 夺门之变主导者，博通天文地理水利，后遭曹石构陷入狱，借天变得免，做事流完整且有南宫复辟名场面
  era: 明代宗、明英宗朝
  dates_known: true
- name_zh: 王越
  score: 7
  worth_why: 廷试试卷被风腾空的奇闻附会其封威宁伯飞腾之兆；出边塞破敌战功可考，三次出塞有大同城红盐池之捷
  era: 明景泰、成化间
  dates_known: true
- name_zh: 黄萧养
  score: 7
  worth_why: 竹床生叶越狱起事的完整兴亡周期，破械入海聚众十余万僭号称王，兵败被擒伏诛，可作教训型人物
  era: 明正统、景泰间
  dates_known: false
- name_zh: 曹吉祥
  score: 6
  worth_why: 与石亨恃功恣横构陷徐有贞兴大狱，后以逆诛，可作权宦覆灭教训；专门事迹仍谢单薄
  era: 明英宗朝
  dates_known: true
- name_zh: 石亨
  score: 6
  worth_why: 恃夺门之功骄横，大兴冤狱，终以逆诛，权臣祸败样本
  era: 明英宗朝
  dates_known: true
rejections:
- name_zh: 董仲ぽ
  why_not: 仅天堕草船一条轶事，无做事周期
- name_zh: 施显卿
  why_not: 仅自序言归老编书，生平事迹简略
- name_zh: 陈鸾
  why_not: 仅天开眼一条传闻，无事迹
- name_zh: 郑哑巴
  why_not: 哑巴见天开能言的奇闻一条，无做事周期
- name_zh: 马轼
  why_not: 仅随军占星一言，无完整事迹
- name_zh: 杨一桂
  why_not: 仅两次奏报灾异，官职罗列而已
- name_zh: 李贤
  why_not: 传文中仅随徐有贞事件出现，无独立做事叙述
