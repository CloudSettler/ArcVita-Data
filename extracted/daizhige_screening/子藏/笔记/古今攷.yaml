- name_zh: 魏了翁
  score: 7
  worth_why: 创《古今攷》为治学半成之作，随《汉书》本纪随文辨证考三代秦汉制度，虽仅二十条未竟而书可考方法与缘起，学问做事流较完整
  era: 南宋
  dates_known: true
- name_zh: 方回
  score: 7
  worth_why: 补辑《续古今攷》以鹤山原书与己附论并列成完整著作；其人品为教训级——献媚贾似道势败先劾、宋亡举城降元得官、老而倡道学谋晚盖，四库馆臣直言人品心术不足道而不以人废书
  era: 宋末元初
  dates_known: true
