candidates:
- name_zh: 李可及
  score: 7
  worth_why: 伶人以巧媚惑主，进《叹百年曲》位至大将军赏赐盈万，终流放岭表、珍玩尽没入官，西门季玄两番预言皆中，完整荣枯周期可作骄宠取祸之 lesson
  era: 晚唐·懿宗朝
  dates_known: true
- name_zh: 西门季玄
  score: 6
  worth_why: 梗直宦官，预见李可及恃宠必败，言语应验，君子谓其有先见之明，惜事迹简略
  era: 晚唐·懿宗朝
  dates_known: false
- name_zh: 同昌公主
  score: 6
  worth_why: 出嫁之盛与身后丧仪是晚唐奢靡极点样本，早夭成奢葬教训，惜本人无主动做事流，宜作李可及时间轴的场景坐标
  era: 晚唐·懿宗朝
  dates_known: true
- name_zh: 唐懿宗
  score: 5
  worth_why: 为女自制挽歌、倾库大葬、宠李可及致朝政之弊，君主低优先，仅作时间坐标
  era: 晚唐
  dates_known: true
rejections:
- name_zh: 米宾
  why_not: 仅禳法献香烛一事，无完整做事周期
- name_zh: 韦氏诸宗
  why_not: 群像陪衬，无个人骨干事迹
