category: 子藏/笔记
verdict: no_value
skip_reason: 文献为明代王济仕横州见闻笔记，记草木风俗物产与山川传说，无人物完整做事流可抽取
rejections:
- name_zh: 王济
  why_not: 全书为风物志杂记，作者本人无关键决定与名场面叙事，仅可作史料背景
- name_zh: 邓指挥
  why_not: 仅招抚山子一事数语，无生平与做事周期
- name_zh: 殷指挥贯
  why_not: 只载建亭种树零星事迹，不能成时间轴
- name_zh: 陈氏女郎
  why_not: 纵鲤遇仙传说属志怪，年代事迹皆不可考
