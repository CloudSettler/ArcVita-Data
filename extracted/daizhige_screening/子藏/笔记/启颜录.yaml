person:
  qid: guji-侯白
  name_zh: 侯白
  names:
    zh: 侯白
    en: Hou Bai
  lifespan:
    birth:
      precision: unknown
      is_circa: true
      raw: 生年不详
    death:
      precision: unknown
      is_circa: true
      raw: 卒于隋世
  era: 隋
  reign_ref: 隋文帝杨坚在位时期
  archetype: 机辩之士
  dilemmas:
  - 以布衣贱服应对外国使者轻慢，如何在保全体面前不失风度又反唇相讥
  - 以谐谑机辩取悦权贵杨素，身处朝堂需在戏言与冒犯之间拿捏分寸
  lesson: 机智与博学可以化被动为主动，以敏捷之才赢得对手敬畏；但谐谑之才难以自立于功业，终属小道，可为佐趣不可为立身之本
  summary_first_person: 我是隋人侯白，以辩捷机敏著称。曾有外国使者来聘，朝廷不知其深浅，密令我扮作贱仆侍奉试探。使者轻慢于我，放气卧问我马价几何，我逐等报其价格，末等说我这样的不直一钱，使者大惊方知我是侯白，惭愧称谢。越公杨素以山东借一得二的笑话戏弄我，我即以关中人问一知二的灞水之对反讥，杨素由此叹服我的辩捷。我的谐谑与机对流传于世，后世遂以此笑谈之名见知于我，虽谈笑取胜一时，终究未能建立经国大业。
  source_urls:
  - 启颜录/辩捷
