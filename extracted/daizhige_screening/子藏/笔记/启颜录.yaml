  description_zh: 侯白去世，卒年不详，事迹见隋末唐初笑谈之传
- id: guji-侯白-event-1
  type: endeavor
  person_qid: guji-侯白
  date: 0581
  year_of: 581
  date_precision: year
  is_circa: true
  location_zh: 隋都
  description_zh: 朝廷不悉外国使者机辩深浅，密令侯白改形貌着弊衣，诈为贱人供承。使者轻之，卧放气而问马价，侯白分等历数马价，末等以形容绝无伎俩、旁卧放气、一钱不直者反唇相讥，使者大惊知其名，惭谢而去
- id: guji-侯白-event-2
  type: endeavor
  person_qid: guji-侯白
  date: 0581
  year_of: 581
  date_precision: year
  is_circa: true
  location_zh: 隋都
  description_zh: 越公杨素戏弄侯白，称山东人多仁义、借一而得两（借弓乃云揭刀去）。侯白应声以关中人问一而知二作答——有人问渭水涨不，报曰灞涨。杨素由此叹服其辩捷
- id: guji-侯白-event-3
  type: endeavor
  person_qid: guji-侯白
  date: 0590
  year_of: 590
  date_precision: year
  is_circa: true
  description_zh: 侯白以机辩谐谑闻名于世，其谈笑之对与所著笑谈之集流播当世，后世以善于滑稽机对者目之，遂以此传名
