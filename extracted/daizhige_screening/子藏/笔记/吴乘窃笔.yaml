candidates:
- name_zh: 郑虎臣
  score: 8
  worth_why: 主动请缨监押杀父仇人贾似道，漳州木棉庵锤杀权奸于厕中，成语级名场面；事见《山房随笔》与《宋鉴》可考
  era: 宋末
  dates_known: false
- name_zh: 陆德原
  score: 7
  worth_why: 元代吴中巨富，任甫里书院山长，暮年散尽家财入道开瑞云观；其与陆道原之混淆考辨 accurately 有完整做事流
  era: 元末
  dates_known: false
- name_zh: 万二
  score: 7
  worth_why: 富甲一郡者读懂朱元璋诗中兆机，散赀托仆、泛舟河湘而免于藉没，乱世保全的智慧典范；或即沈万三
  era: 洪武初
  dates_known: false
- name_zh: 陈郛
  score: 7
  worth_why: 知昆山县，岁饥力蠲赋曰流转沟壑何以字民，历官五十年犹为寒士，清鲠可为官箴教训
  era: 北宋
  dates_known: false
- name_zh: 周大有
  score: 6
  worth_why: 弱冠为都给事中号楼上秀才，后谪戍再起，治水吴中病卒；事迹可考而志书失载
  era: 明初
  dates_known: false
- name_zh: 张鉴
  score: 5
  worth_why: 嘉定县丞才识过人，奉檄诣宝山捕虎，杀虎歌传世；事迹简略
  era: 明正统
  dates_known: false
