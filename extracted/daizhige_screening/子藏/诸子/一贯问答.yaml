candidates:
- name_zh: 方以智
  score: 8
  worth_why: 本篇作者；会通三教、贯摄《易》学与禅学，倡两端用中、一多相即之辨；另著《通雅》《物理小识》开质测实学先声；明亡后抗清流亡、披缁为僧，一生做事流完整，出处取舍可为后世模范
  era: 明末清初
  dates_known: true
