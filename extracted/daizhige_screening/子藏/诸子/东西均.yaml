- name_zh: 方以智
  score: 9
  worth_why: 复社四公子抗阮大铖、永历朝辞相位、明亡后披缁为药地禅师，做事流完整；本篇《东西均》创随泯统三一之学、汇通东西两苦心法，另有《物理小识》《通雅》开科学考据先声；拒不仕清、赴谪途中殉节惶恐滩，气节与学问并为后世楷模
  era: 明末清初
  dates_known: true
