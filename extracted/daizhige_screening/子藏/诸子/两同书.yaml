category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 罗隐
  score: 7
  worth_why: 本名横，十举不中第乃更名隐；朱温篡唐以谏议大夫召之不应，转仕钱镠，由钱塘令历掌书记、判官、盐铁发运副使累迁谏议大夫给事中；著谗书、淮海寓言、两同书；屡败屡试、乱世守节择主、以文章立身，做事流完整且十上不第与著书讥世皆具名场面潜质
  era: 唐末五代
  dates_known: true
- name_zh: 谭峭
  score: 6
  worth_why: 国子司业谭洙之子弃家从道，师嵩山道士得辟谷养气之术，著化书六篇、文笔简劲奥质；授书宋齐邱反被冒名，遂杖靸远引；著书传世与夺书公案皆具名场面潜质，惟方外行踪靡定、生卒可考性弱，事迹简略故缓录
  era: 唐末五代
  dates_known: true
rejections:
- name_zh: 宋齐邱
  why_not: 文中仅见夺谭峭化书冒为己作一节，其南唐谋主行事全然不载
- name_zh: 钱镠
  why_not: 仅作为罗隐仕主一笔带过，起家与保境安民之事不载
- name_zh: 朱温
  why_not: 仅作篡唐征召罗隐的背景一笔，无做事流
