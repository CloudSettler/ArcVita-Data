source: 子藏/诸子/乐庵语录.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 李衡
  score: 8
  worth_why: 号乐庵先生，本书语录主角；宣和庚子以舍选贡入辟雍，辛丑南宫落第，经同舍赵仲修一席点拨——学非记问诵说而是学圣人、行得道千乘之国三句便做好知州——遂书四勿于座右终身自省，自谓平生操心行己、立朝事君皆赵公之言有以发之；缘起、挫折、关键点拨、座右自省、施政致用的做事流完整，且语录中多有诚、一念不动、五常适中等可传名言
  era: 南宋
  dates_known: true
- name_zh: 赵孝孙
  score: 6
  worth_why: 字仲修，洛人，伊川高弟赵颜子之子；李衡落第同试之年以盛年一跌庸何伤勉之，并以学而时习之一问点破学圣人之旨与治郡之道，一席话成就一人，堪称语录全书之眼；然其自身可考事迹仅此一节
  era: 两宋之际
  dates_known: false
rejections:
- name_zh: 龚昱
  why_not: 仅署编者身份，无做事周期可考
- name_zh: 胡靖
  why_not: 传文仅一段死生问答，事迹简略
- name_zh: 扬雄
  why_not: 语录中仅引学行之上也等言为例证，无做事周期
- name_zh: 孔光
  why_not: 仅作不识进退字之例证
- name_zh: 张禹
  why_not: 仅作不识刚正字之例证
- name_zh: 许敬宗
  why_not: 仅作不识忠孝字之例证
- name_zh: 柳宗元
  why_not: 仅作不识节义字之例证
- name_zh: 邵雍
  why_not: 仅引康节一言，无做事流
- name_zh: 韩愈
