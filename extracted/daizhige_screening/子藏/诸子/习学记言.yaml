- name_zh: 叶适
  score: 8
  worth_why: 永嘉事功学派集大成者；淳熙五年进士，历官至宝文阁学士，力主抗金、经划两淮防务，开禧时知建康却敌保江；晚年罢官归水心村著习学记言序目，疑国语非左氏作、考子思生卒、斥汉儒洪范五行灾异之非，以实学事功抗衡洛闽空谈，南宋思想史关键转折点
  era: 南宋
  dates_known: true
