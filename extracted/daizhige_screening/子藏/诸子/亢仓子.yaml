candidates:
- name_zh: 亢仓子
  score: 7
  worth_why: 庚桑楚，老聃弟子，偏得老子之道。居畏垒三年民俗大化，民欲尸而祝之，自警于「日计不足、岁计有余」；鲁定公以上卿之礼致之，问耳视目听之道；为郑君画策以封珪戎弓赴郢，楚自愧不直而返赂善郑，一言存国；又答周灵王水旱之问，倡正刑修德、去私戒盈。著书九篇，唐封洞灵真人。隐居—教化—献策—著书做事链较完整，其全性保真、不以性养物之论足为后世鉴；惟生卒无考，事迹多带传说色彩。
  era: 春秋
  dates_known: false
