- name_zh: 谭嗣同
  score: 10
  worth_why: 甲午之耻后发愤著《仁学》倡冲决网罗、以太通仁之新学；巡抚湖南办时务学堂南学会湘报开风气；戊戌入军机为四卿参新政；事败拒逃，称变法流血请自嗣同始，狱中题壁我自横刀向天笑，从容就义菜市口，缘起著书办事殉道俱全，为后世变法者之精神坐标
  era: 晚清
  dates_known: true
