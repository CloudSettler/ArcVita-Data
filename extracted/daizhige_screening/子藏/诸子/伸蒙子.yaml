source: 子藏/诸子/伸蒙子.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 林慎思
  score: 7
  worth_why: 著书做事流完整，缘起、转念、改作、成书俱全：旧著儒范七篇辞艰理僻不为时人所知，遂斋沐覃思改写，筮得蒙之观而自号伸蒙子，编成三卷近万言，持论醇正远胜唐时天隐无能诸子；可作治学不倦、精益求精之范，书名得于筮兆亦是名场面
  era: 晚唐咸通年间
  dates_known: true
- name_zh: 伊尹
  score: 7
  worth_why: 太甲不肖则放之桐宫，俟其迁善而后返政，臣放君而终成忠名；迁善篇以良马可维、猛虎难拘之喻专论其事，是权变行道的关键决策名场面，兼有辅汤肇商之功，可为后世处难局者鉴
  era: 商初
  dates_known: true
- name_zh: 商山四皓
  score: 7
  worth_why: 避世养望、待危而出：高祖欲废嫡立庶、太子势摇，四老应吕后之请出山辅太子而废议遂止，汉嗣以安；持危篇许其为用邪扶正、辞天爵而正天下，是隐逸入世成事的完整周期，教训与启发兼备
  era: 秦末汉初
  dates_known: true
rejections:
- name_zh: 干禄先生等假托人物
  why_not: 干禄、知道、求己、弘文、如愚、卢乳皆林慎思设为问答的虚拟人名，注家并斥其增改偏旁好奇近妄，非真实历史人物
- name_zh: 唐尧、虞舜
  why_not: 仅作仁政论据与治化标准散见各篇，君主低优先，无独立做事周期
- name_zh: 桀、纣
  why_not: 仅作昏君反面例证用以对举尧舜周文，无做事流
- name_zh: 龙逢、比干
  why_not: 仅一句及于死谏不能放桀纣之问，事迹无展开
- name_zh: 竖刁
  why_not: 仅一句以为齐桓化恶之例，无行事可录
- name_zh: 张仪、苏秦
  why_not: 较功篇仅以仪秦之辨一语带过，六国之亡归因其敝，无做事周期
- name_zh: 孟母
  why_not: 仅孟母正己以化孟轲一句，三迁断机等事本卷无载，缓录俟有详传再入
