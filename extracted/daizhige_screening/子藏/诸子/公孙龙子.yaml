candidates:
- name_zh: 公孙龙
  score: 8
  worth_why: 白马非马之辩为名家逻辑巅峰名场面；平原君席前折服孔子后裔孔穿；疾名实散乱而著守白之论冀时君正名实，缘起、论战、著书传世俱全
  era: 战国
  dates_known: true
- name_zh: 尹文
  score: 5
  worth_why: 见侮不鬬之辩与赏罚是非四缪之论具名辩锋芒，然仅存转述片段问答，无完整做事周期
  era: 战国
  dates_known: false
rejections:
- name_zh: 孔穿
  why_not: 仅录与公孙龙一辩即绌之事，无独立做事周期
- name_zh: 鬼谷子
  why_not: 提要所载为传说人物，苏秦张仪之师或系托名，生卒无考，难为时间轴锚点
- name_zh: 平原君
  why_not: 传文仅作公孙龙客主背景一笔带过，无事迹展开
