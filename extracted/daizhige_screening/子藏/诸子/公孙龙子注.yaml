candidates:
- name_zh: 公孙龙
  score: 9
  worth_why: 疾名实之散乱而创守白之论，白马非马、臧三耳皆名辩史上名场面；立论、授徒、与孔穿两番论难、终被平原君断为辞胜于理终必受诎，做事周期完整；名家兴衰与正名之限足为后世镜鉴
  era: 战国
  dates_known: true
- name_zh: 孔穿
  score: 7
  worth_why: 孔子后裔，应人劝往正名家之辩；以六鹢退飞、素丝缁布之喻解白马之惑，理胜于辞令平原君称善，并劝公孙龙止辩，是儒家正名方法论的一次完整实战
  era: 战国
  dates_known: true
- name_zh: 尹文
  score: 5
  worth_why: 齐王问士一辩直指赏罚是非四缪、虽十黄帝不能理，论辩范本级名场面；然本篇仅存此一事，生平做事流简略，宜缓录
  era: 战国
  dates_known: true
rejections:
