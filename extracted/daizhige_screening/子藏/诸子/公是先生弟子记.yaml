candidates:
- name_zh: 王安石
  score: 9
  worth_why: 熙宁变法青苗免役保甲一套完整做事流；三不足之辩为名场面；新法成败为后世变法镜鉴；本书提要明记刘敞攻其新学与性论
  era: 北宋
  dates_known: true
- name_zh: 欧阳修
  score: 8
  worth_why: 由庆历新政至嘉祐主盟文坛做事流完整；知贡举拔苏轼兄弟；醉翁亭记、朋党论皆名场面；书中以书字示褒一笔提及
  era: 北宋
  dates_known: true
- name_zh: 李牧
  score: 8
  worth_why: 北却匈奴、肥之战破秦军；被谗见杀而赵旋亡，李牧死赵国亡为千古用人教训；书中正以赵王杀良将作山木之讴为戒
  era: 战国末
  dates_known: true
- name_zh: 刘敞
  score: 7
  worth_why: 即公是先生本人；三党交讧中萧然门户之外独持和平之论；开宋代疑经新风，预发程朱之端，澹于声誉的一代醇儒
  era: 北宋
  dates_known: true
- name_zh: 伊尹
  score: 7
  worth_why: 举于畎亩而相汤成一代名相；放太甲于桐宫为关键决定；任天下之忧的宰相典范；书中以其对比受禅之舜禹
  era: 商初
  dates_known: true
- name_zh: 武丁
  score: 7
  worth_why: 殷高宗恭默思道梦得傅说为求贤名场面；武丁中兴有甲骨卜辞可证，做事流完整
  era: 商代
  dates_known: true
- name_zh: 赵过
  score: 6
  worth_why: 任搜粟都尉推行代田法改良农具，汉武帝由黩武转重农国策转向的关键执行者，天下翕然赖之
  era: 西汉武帝时
  dates_known: true
