source: 子藏/诸子/刍言.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 崔敦礼
  score: 6
  worth_why: 家本河北南渡后登绍兴进士，官诸王宫大小学教授；著刍言三卷三百五篇，分言政言行言学，规橅扬雄王通，指切事理抉摘隐微；爱溧阳山水买田筑室居焉，著书做事周期可考
  era: 南宋绍兴年间
  dates_known: true
- name_zh: 李衡
  score: 5
  worth_why: 号乐庵，渊源程氏以论语为本；抗章论事不避权贵，临殁从容笃于任恤，脱然于富贵生死之际；著周易义海撮要，可作躬行实践之范
  era: 南宋
  dates_known: true
rejections:
- name_zh: 龚昱
  why_not: 事迹仅从学六年编录师说与安贫乐道称龚山长，无独立做事流与名场面
- name_zh: 崔敦诗
  why_not: 仅与兄同登绍兴进士一笔带过，无自身做事事迹
- name_zh: 尧、舜、桀、纣
  why_not: 仅作治乱善恶之对比喻证，如避尧洗耳舜投渊等，无具体做事周期
- name_zh: 汤、禹
  why_not: 仅汤之祷、禹之胼胝一语带过，用以论公私之心，无本传叙事
- name_zh: 老子
  why_not: 仅引我无欲而民自朴一句作论据，其书其事本文均未叙
- name_zh: 后羿、造父、奚仲、倕、夷牟、相土
  why_not: 仅作作者不能用、用者不必为之技能喻证，各一句带过无做事流
- name_zh: 伯嚭、赵高、费无极
  why_not: 仅作谗臣习进之例证一句提及，且多为已有库人物或无事迹可采
