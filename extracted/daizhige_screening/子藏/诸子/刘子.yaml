candidates:
- name_zh: 苏秦
  score: 9
  worth_why: 本卷崇学篇注存锥刺股血流至踝之苦学名场面；史载合纵六国身佩相印，终车裂于齐，苦学—发迹—覆灭做事流完整且兼具模范与教训
  era: 战国
  dates_known: true
- name_zh: 刘勰
  score: 8
  worth_why: 提要称其撰《文心雕龙》五十篇，文论不朽名场面；依僧祐定林寺校经、定东林寺经藏、晚岁出家改名慧地，做事周期完整；唯本书作者归属经提要考辨非其人，须待梁书本传细录
  era: 南朝梁
  dates_known: true
- name_zh: 刘昼
  score: 7
  worth_why: 北史儒林传有传：求秀才十年不第，诣晋阳上书切直不见收，乃发愤撰《高才不遇传》《帝道》《金箱璧言》指切时政，怀才不遇而以著述自见，教训型人物，亦《刘子》托名悬案正主
  era: 北齐
  dates_known: true
- name_zh: 养由基
  score: 7
  worth_why: 韬光篇注载楚王令其调弓捻箭慑服山狙之神射；史有百步穿杨、蹲甲贯七札之名场面，终陷吴军伏矢而死，恃技轻敌之戒
  era: 春秋
  dates_known: true
rejections:
