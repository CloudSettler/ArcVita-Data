candidates:
- name_zh: 司马穰苴
  score: 8
  worth_why: 春秋末期齐将田穰苴，受命于晋燕入侵之际，斩监军庄贾立军威、恤士卒收人心，遂却敌复地；传世兵书司马法列入武经七书，国虽大好战必亡、天下虽安忘战必危名训出于此；后遭鲍氏谗害退职忧愤而死，兼可为功高见忌之鉴；司马氏之姓亦因其官而得
  era: 春秋末期齐国（齐景公时）
  dates_known: true
rejections:
- name_zh: 有虞氏
  why_not: 传文仅以其述赏罚制度沿革，无做事周期
- name_zh: 夏后氏
  why_not: 仅作为军礼誓师演变的时代对照，无个人事迹
- name_zh: 殷周诸王
  why_not: 仅用作戎车、旗帜、章服制度变迁的朝代坐标，非可考做事主体
