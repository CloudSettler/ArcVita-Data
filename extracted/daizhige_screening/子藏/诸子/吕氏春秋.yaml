category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 吕不韦
  score: 10
  worth_why: 原序主传：以商贾之身识子楚为奇货可居，千金布局华阳夫人立嗣，终致庄襄王即位，官至相国号仲父；集宾客编吕氏春秋，悬千金于咸阳市门一字千金；后失势迁蜀饮鸩，成事与覆亡轨迹完整，成语两大名场面俱全
  era: 战国末至秦
  dates_known: true
- name_zh: 墨翟
  score: 9
  worth_why: 创墨家倡兼爱非攻，止楚攻宋不战而屈人之兵；摩顶放踵利天下，有钜子组织与守城之实，学与行俱全；提要专论其言取舍有度，墨学为先秦显学之又一半
  era: 春秋战国之际
  dates_known: true
- name_zh: 庄周
  score: 8
  worth_why: 著庄子十余万言，逍遥游齐物论传世；庄周梦蝶、濠梁之辩、曳尾涂中皆为名场面；楚王聘相不受，出处抉择可为范式；提要称漆园之书
  era: 战国中期
  dates_known: true
- name_zh: 班固
  score: 8
  worth_why: 继父业私修汉史被告入狱得释，入兰台续成汉书开断代史体；随窦宪北征燕然勒石记功，后牵连死于狱中，成书与身祸两端皆极
  era: 东汉明章之世
  dates_known: true
- name_zh: 纪昀
  score: 7
  worth_why: 总纂四库全书，考镜源流辨章学术成总目提要，本篇提要即其手笔；宦海浮沉复有阅微草堂笔记，一生做事流完整
  era: 清乾隆间
  dates_known: true
- name_zh: 高诱
  score: 7
  worth_why: 本篇原序作者，东汉注家巨擘；依先师旧训注吕氏春秋十七万余言，兼注淮南子孟子章句；提要列其据书序论语左传驳正注中引证之误，训诂简质开考据范式
  era: 东汉末建安间
  dates_known: true
- name_zh: 刘知几
  score: 7
  worth_why: 著史通立史学方法论，才学识三长说为千古史家圭臬；内外篇体例为后世范式，此处提要亦援其例
  era: 唐
  dates_known: true
- name_zh: 西门豹
  score: 7
  worth_why: 为邺令投巫于河破河伯娶妇之俗，凿十二渠引漳灌田名闻天下；民可以乐成不可与虑始为治世名言；破除迷信兴修水利之典范
  era: 战国初魏文侯时
  dates_known: true
- name_zh: 孟明视
  score: 7
  worth_why: 崤之败后三为秦师主帅三败不馁，焚舟济河终报晋霸西戎；知耻后勇败而不亡的完整做事流，堪为后世励志之鉴
  era: 春秋秦穆公时
  dates_known: false
- name_zh: 甯戚
  score: 6
  worth_why: 饭牛车下扣角而歌见知于齐桓公，一举为大夫佐齐称霸；宁戚饭牛成寒士遇合典型；然史迹简略
  era: 春秋齐桓公时
  dates_known: false
- name_zh: 公孙龙
  score: 6
  worth_why: 名家宗师，白马非马、离坚白之辩为思辨名场面；然本篇仅涉高诱注其籍贯之误
  era: 战国中晚期
  dates_known: true
