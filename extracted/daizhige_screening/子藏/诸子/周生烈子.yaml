verdict: has_candidates
candidates:
- name_zh: 周生烈
  score: 5
  worth_why: 汉末张角败后天下溃乱之际，著周生子十三卷，自序明志以尧舜作干植、仲尼作师诫；谠言正论有「天下所以平者，政平也；政所以平者，心平也」之衡平论、「桀纣是汤武之梯，秦项是大汉之阶」之逆顺辩证，足为名言；其书经北凉沮渠氏献宋、隋唐志著录、清代张澍辑佚，流传有绪。惟传主行事仅魏初徵士、博士侍中数行，生卒年不详，做事流简略，宜缓录
  era: 汉末至曹魏初
  dates_known: true
rejections:
- name_zh: 尧舜
  why_not: 仅于格言中作引证（舜驾五龙、居尧舜之位不行唐虞之政），无事迹文本
- name_zh: 桀纣
  why_not: 仅作败亡例证（桀纣是汤武之梯），无做事内容
- name_zh: 张角
  why_not: 仅作时间坐标，谓其败后天下溃乱，无本人事迹
- name_zh: 沮渠茂虔
  why_not: 仅见献书目一行，属书目记录而非做事周期
- name_zh: 张澍
  why_not: 清代辑佚钞辑者，本文献为其辑本而非其传记，文中无其做事周期
