skip_reason: 器经为战国论道之书，通篇论器、气、德之哲理，无任何人物的做事周期记载；作者孤子仅存署名，生平与年代不可考；文中桀、纣、幽王仅各以一句作反面例证，不构成可考的完整做事流
rejections:
- name_zh: 孤子
  why_not: 仅系署名作者，史无其传，生卒与事迹皆不可考，无做事流可录
- name_zh: 桀
  why_not: 守器篇仅一句例证（林池之欲祸），无事迹展开，时间与做事周期均不可考
- name_zh: 纣
  why_not: 与桀并提一句带过，文中无任何具体作为记载，不满足做事流完整标准
