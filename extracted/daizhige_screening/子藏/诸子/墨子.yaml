- name_zh: 墨子
  score: 10
  worth_why: 创立墨家倡导兼爱非攻；止楚攻宋与公输班九距九攻成千古名场面；善守城善工艺，弟子盈天下与儒并称显学
  era: 春秋末战国初
  dates_known: true
- name_zh: 范蠡
  score: 9
  worth_why: 十年生聚教训助越灭吴；功成身退泛舟五湖三致千金；飞鸟尽良弓藏之先见，成事与善终兼备
  era: 春秋末
  dates_known: true
- name_zh: 伍子胥
  score: 9
  worth_why: 亡楚奔吴兴吴破楚鞭平王尸；死谏夫差遭属镂赐死悬目东门；越灭吴尽应其言，烈性与悲剧俱足
  era: 春秋末
  dates_known: true
- name_zh: 伊尹
  score: 9
  worth_why: 以滋味说汤负鼎为相；佐汤灭夏建商；放太甲于桐宫三年而复辟，王佐第一人
  era: 商初
  dates_known: true
- name_zh: 姜太公
  score: 9
  worth_why: 渭滨直钓遇文王；佐武王牧野灭商定天下；首封于齐通渔盐之利，开国之谋与治世之才兼备
  era: 商末周初
  dates_known: true
- name_zh: 文种
  score: 8
  worth_why: 献七术助句践灭吴成霸；功成不退遭赐剑自刎；与范蠡对照成知进退之最高教训
  era: 春秋末
  dates_known: true
- name_zh: 鲍叔牙
  score: 8
  worth_why: 管鲍之交分金不怨；知人让贤荐管仲为相而身居其下；齐桓九合诸侯功推知人第一
  era: 春秋
  dates_known: true
- name_zh: 舜
  score: 8
  worth_why: 耕历山渔雷泽孝感天下；尧试以二女百揆而禅位；流四凶举贤才天下平，起于布衣的完整成事流
  era: 上古虞代
  dates_known: true
- name_zh: 孙叔敖
  score: 7
  worth_why: 三月治楚使庄公称霸；决期思之水修芍陂兴水利泽被后世；位高清廉三得免患
  era: 春秋
  dates_known: true
- name_zh: 傅说
  score: 7
  worth_why: 版筑之间被武丁举为相；一策而殷中兴；从刑徒到贤相的极端跃升样本
  era: 商武丁时期
  dates_known: true
- name_zh: 智伯瑶
  score: 7
  worth_why: 挟韩魏水灌晋阳几灭赵；骄纵贪得韩魏反戈身死族灭；才胜德者亡的典型，三家分晋由此触发
  era: 春秋末
  dates_known: true
- name_zh: 禽滑釐
  score: 7
  worth_why: 事墨子三年面垢手胼学守城之术；率三百弟子守宋拒楚；墨家兵法第一传人
  era: 战国初
  dates_known: true
- name_zh: 西施
  score: 6
  worth_why: 苧萝浣纱被献吴宫惑夫差；姑苏城破成美人计最著名案例；结局沉江泛湖两说余味不尽
  era: 春秋末
  dates_known: true
- name_zh: 段干木
  score: 6
  worth_why: 隐居不仕而魏文侯过其闾必式；立倦不敢息；贤名所致秦兵不敢东向，不做事而事的样本
  era: 战国初
  dates_known: true
- name_zh: 比干
  score: 6
  worth_why: 强谏纣王三日不去；被剖圣人之心；死谏精神的第一象征，周期短但场面与教训俱烈
  era: 商末
  dates_known: true
