source: 子藏/诸子/墨子闲诂.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 墨子
  score: 10
  worth_why: 创兼爱非攻尚贤节用天志之说自成一家；止楚攻宋解带为城九攻九距；摩顶放踵利天下可为万世模范；善守城器械为墨守成规之源
  era: 春秋战国之际
  dates_known: true
- name_zh: 公输班
  score: 8
  worth_why: 工匠圣手发明锯刨规矩云梯木鸢；为楚造云梯攻宋，与墨子攻守推演九设机变九距之，千古名场面
  era: 春秋末
  dates_known: true
- name_zh: 孙诒让
  score: 8
  worth_why: 积二十余年校勘成墨子闲诂，使中绝二千年之墨学重光；晚著契文举例开甲骨文研究先河
  era: 清末
  dates_known: true
- name_zh: 禽滑釐
  score: 7
  worth_why: 墨家首徒问守城之法于墨子；止楚攻宋时率三百弟子持守器登宋城待楚寇，承学脉有完整师承做事流
  era: 战国初
  dates_known: true
rejections:
