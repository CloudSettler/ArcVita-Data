  why_not: 本篇所染仅一语举名，破楚入郢鞭尸自沉等详须俟左传史记专传再录
- name_zh: 范蠡
  why_not: 仅于所染篇随句践并列一语，兴越灭吴泛舟五湖之详当俟史记专传
- name_zh: 文种
  why_not: 仅与范蠡并提一语带过，无独立做事周期
- name_zh: 伊尹
  why_not: 仅于所染篇列举为汤之染，无事迹可抽
