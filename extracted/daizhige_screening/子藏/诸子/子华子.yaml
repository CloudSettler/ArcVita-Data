verdict: has_candidates
candidates:
- name_zh: 子华子（程本）
  score: 7
  worth_why: 孔子倾盖而顾、赠束帛、叹为天下之贤士；赵简子奉纁币聘以爵执圭，因简子杀窦犊舜华而逡巡不起、去而之齐，馆于晏氏更题其书；晚年返晋不复仕以卒——辞聘全生、不苟于售，聚徒著书开全生贵己、破黄帝铸鼎谲怪之论，可为乱世不仕守道之范
  era: 春秋末（晋人，与孔子、赵简子同时）
  dates_known: true
rejections:
- name_zh: 郯子
  why_not: 仅为子华子论礼之对象，无完整做事周期
- name_zh: 阳城胥渠
  why_not: 问道者，传中无事迹
- name_zh: 公仲承
  why_not: 仅问黄帝铸鼎真伪，无自身事迹
- name_zh: 北宫子
  why_not: 引见传语之配角，无做事流
- name_zh: 晏平仲
  why_not: 传中仅言与子华子有久要之交，无事迹；可另凭《史记》专文再议
- name_zh: 赵简子
  why_not: 传中仅聘子华子、杀窦犊舜华等背景性片段，无自身做事周期；其主导事迹另详于《左传》《史记》时可再议
- name_zh: 孔子
  why_not: 已在库，本传中仅倾盖相逢、赠帛之一节
