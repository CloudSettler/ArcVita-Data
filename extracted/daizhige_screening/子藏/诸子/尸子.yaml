source: 子藏/诸子/尸子.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 尸佼
  score: 7
  worth_why: 秦相商鞅的幕后谋主，谋事画计、立法理民，未尝不与之共规；商君被刑，恐遭并诛，当机亡逃入蜀，避祸全身；退而著《尸子》二十篇六万余言，为杂家要籍，水积成川则吞舟之鱼生焉等名言传世。辅佐变法、危机脱身、著书立说三段做事周期完整，与商鞅之死对照，可为功成不知退之镜鉴
  era: 战国中期
  dates_known: true
- name_zh: 李克
  score: 7
  worth_why: 魏文侯置相之际，就翟黄与魏成子之选提出观士五法，居视其所亲、富视其所与、达视其所举、穷视其所不为、贫视其所不取，为识人用人的经典决策模型；史载其佐魏文侯富国强兵、著法经，开战国变法先河，后世多以为即李悝；本文仅存一则，宜再据史记魏世家、汉书食货志补全做事流
  era: 战国初期
  dates_known: true
- name_zh: 汪继培
  score: 5
  worth_why: 原书散亡十失八，遂以群书治要为上卷、散见诸书者为下卷、误收违错别立存疑，辑佚复建六万余言之尸子，体例谨严，为清人辑佚校勘范例；事属学术校雠，事迹简略，先缓录
  era: 清代嘉庆年间
  dates_known: true
rejections:
- name_zh: 子路
  why_not: 劝学篇仅一句卞之野人经孔子教而为显士，本文无做事周期，宜据史记仲尼弟子列传另录
- name_zh: 子贡
  why_not: 仅一句卫之贾人例证，其存鲁乱齐、儒商先导之功另见他书，非本文可录
- name_zh: 颜涿聚
  why_not: 仅一句大盗受教成名之例证
- name_zh: 颛孙师
  why_not: 仅一句驵人受教例证
- name_zh: 曾子
  why_not: 仅引孝亲惧而无咎一句语
- name_zh: 史鰌
  why_not: 仅引事君亲疏皆得成忠一句语
- name_zh: 蘧伯玉
  why_not: 仅引直己而不直人一句行谊
- name_zh: 司城子罕
  why_not: 仅遇乘封人而下车一事，为贵德贱爵之例证
- name_zh: 百里奚
  why_not: 仅穆公举之一句，无做事周期
- name_zh: 召伯
  why_not: 仅甘棠勿翦之喻，为德政余荫典故
- name_zh: 屈侯附
  why_not: 仅一句观贤之语，且校注疑此为李克语之讹
- name_zh: 商鞅
  why_not: 已在库，本文中仅作为尸佼事迹之背景人物
- name_zh: 孔子
  why_not: 已在库，本文仅引其施教诸语
