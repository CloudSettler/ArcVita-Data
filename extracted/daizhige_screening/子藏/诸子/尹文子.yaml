candidates:
- name_zh: 尹文
  score: 7
  worth_why: 稷下名家宗师，正名定分以治天下；与齐宣王、湣王两代问答，见侮不辱之辩传为名场面；其学自道至名、自名至法，为黄老申韩之间的枢纽
  era: 战国中期齐稷下
  dates_known: true
- name_zh: 慎到
  score: 7
  worth_why: 法家势治学派开山，弃知去己缘不得已；孝子不生慈父之家、忠臣不生圣君之下；势论下启申韩，为韩非法术势三治之一源
  era: 战国中期赵人
  dates_known: true
- name_zh: 公孙龙
  score: 7
  worth_why: 白马非马、坚白之辩名动诸侯；平原君门下以名辩谋偃兵止战；名家代表作完整传世
  era: 战国中晚期赵人
  dates_known: true
- name_zh: 田骈
  score: 6
  worth_why: 稷下先生号天口骈，不宦之论以名限俗；本书存其雉兔分定之喻，做事流偏简
  era: 战国中期齐人
  dates_known: true
- name_zh: 仲长统
  score: 6
  worth_why: 汉末狂生著昌言论天下理乱，屡拒征召后参曹操军事；本书序旧题其黄初末条次撰定尹文子，然四库馆臣疑之，需另补事迹
  era: 东汉末山阳
  dates_known: true
