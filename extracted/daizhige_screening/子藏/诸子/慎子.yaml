category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 慎到
  score: 8
  worth_why: 赵人，稷下学宫上大夫，法家「势」治派宗师；本书「立天子以为天下，非立天下以为天子」「法虽不善，犹愈于无法」「臣事事而君无事」「飞龙乘云，腾蛇游雾」皆为制度理论名句；其势治说后与商鞅法、申不害术合流于韩非，是中国君主制度与法治理论的重要源头；做事流可循「学黄老之术—稷下讲学受上大夫—著十二论—思想传入韩非而传世」完整展开
  era: 战国中期
  dates_known: true
rejections:
- name_zh: 尧
  why_not: 仅作「匹夫不能使邻家、南面而王则令行禁止」的势位例证，无做事周期
- name_zh: 舜
  why_not: 仅「舜放瞽叟」一句引为孝义之喻
- name_zh: 桀
  why_not: 仅作亡国之君反例，无事迹展开
- name_zh: 毛嫱
  why_not: 仅作美色之喻以论色助
- name_zh: 西施
  why_not: 同毛嫱，仅举以为喻
- name_zh: 比干
  why_not: 仅作乱世忠臣例证一句
- name_zh: 伍子胥
  why_not: 仅与比干并提作忠而亡身之例
- name_zh: 禹
  why_not: 逸文中仅「使禹察锱铢之重」一句设喻，无做事可考
