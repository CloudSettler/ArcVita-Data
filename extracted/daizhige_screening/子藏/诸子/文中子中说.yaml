candidates:
- name_zh: 王通
  score: 10
  worth_why: 六世家学九载勤修，续《元经》《续诗》《续书》而讲学河汾；长安论政叹言政不及化、言声不及雅、言文不及理，援琴鼓《荡》门人沾襟；拒杨素《食经》而答以《酒诰》《洪范》；叹封禅之费非古；江都变起泫然知命；门下薛收姚义房杜魏李，贞观将相多出其门，功之远者异代后显，可为在野传道之典范
  era: 隋
  dates_known: true
- name_zh: 李世民
  score: 9
  worth_why: 附录载太宗与房魏论礼乐之事；史实上晋阳起兵、统一天下、虚心纳谏成贞观之治、四夷宾服称天可汗，做事流与名场面俱全
  era: 隋末唐初
  dates_known: true
- name_zh: 李靖
  score: 9
  worth_why: 书中问圣人之道；史载平萧铣、定岭南、夜袭阴山灭东突厥、西破吐谷浑，军功盖世且功成身退，出处问对皆有可观
  era: 隋末唐初
  dates_known: true
- name_zh: 魏征
  score: 9
  worth_why: 书中问圣人忧疑；史载由瓦岗而事唐、犯颜直谏，作《谏太宗十思疏》，成千古君臣相得之典范，教训与模范俱全
  era: 隋末唐初
  dates_known: true
- name_zh: 房玄龄
  score: 8
  worth_why: 书中列名门人与问对；史载随李世民转战四方、收罗人才，为贞观贤相之首，谋功居首、监修国史
  era: 隋末唐初
  dates_known: true
- name_zh: 杨素
  score: 7
  worth_why: 书中请见王通、问御边之策，闻迩者悦远者来之论；史载平陈水战、权倾一朝，然助纣营私终致家覆，功业与教训两面俱全
  era: 隋
  dates_known: true
- name_zh: 杜如晦
  score: 7
  worth_why: 被王通品评为若逢明王其犹天乎；史载房谋杜断、玄武定策，听断如流而早卒，做事流完整而短暂
  era: 隋末唐初
  dates_known: true
- name_zh: 王绩
  score: 6
  worth_why: 王通之弟，附录存其答陈尚书书；史载三仕三隐、以酒遁世，著《醉乡记》《五斗先生传》，为隐逸文人标本，事迹稍简宜缓录
  era: 隋末唐初
  dates_known: true
