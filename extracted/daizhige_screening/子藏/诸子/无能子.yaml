  why_not: 仅作避乱时代背景一笔带过，无做事周期
- name_zh: 老聃
  why_not: 仅引柔弱胜刚强一句，无事迹
- name_zh: 太颠、闳夭
  why_not: 仅作陪衬问答，无独立事迹
- name_zh: 许由、广成子
  why_not: 仅人名提及，无事迹可考
- name_zh: 尧、舜、启
  why_not: 仅作禅让序列例证，纯时间坐标
