category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 吕望
  score: 9
  worth_why: 渭滨垂钓遇西伯，箕踞笑答、非熊非罴之卜是愿者上钩名场面；由隐而仕、兴周灭商、受封于齐，缘起、抉择到封国做事流完整
  era: 商末周初
  dates_known: true
- name_zh: 周文王
  score: 8
  worth_why: 三分天下有其二仍下士访贤，笃志忧民；论有为与无为之德而得吕望，是访贤纳谏的开国之基，亦为君主中少有的做事型坐标人物
  era: 商末
  dates_known: true
- name_zh: 伯夷、叔齐
  score: 7
  worth_why: 叩马谏武王、不食周粟、饿死首阳；采薇首阳成千古气节符号，既是守义之范，也是固执之训
  era: 商末周初
  dates_known: true
- name_zh: 无能子
  score: 6
  worth_why: 避黄巢之乱流寓民舍，一春数十纸写成三十四篇；乱世自晦、冻馁淡如而著书明自然之理，代表作诞生点明确，惟隐名无传、事迹单薄
  era: 唐末
  dates_known: true
rejections:
