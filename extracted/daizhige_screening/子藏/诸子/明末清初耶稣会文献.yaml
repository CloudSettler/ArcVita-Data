candidates:
- name_zh: 利玛窦
  score: 10
  worth_why: 中西文化交流第一人；弃僧服改儒服的本土化关键决策；绘坤舆万国全图、著天主实义交友论、与徐光启合译几何原本；从澳门入肇学到北上定居北京，做事流完整，中西双方皆留名场面，堪称西学东渐枢纽
  era: 明末万历
  dates_known: true
- name_zh: 罗明坚
  score: 9
  worth_why: 首位获准入居中国内地的耶稣会士；1584年撰成西士第一部中文护教文献天主圣教实录，译成唐字，开西学中文著述之先；先于利玛窦抵澳门，在肇庆桂林开教铺路，后归欧求遣使未果，客死萨莱诺，缘起、开拓、著述、落幕俱全
  era: 明末万历
  dates_known: true
- name_zh: 艾儒略
  score: 8
  worth_why: 号称西来孔子；入闽开教卓有成效，著三山论学万物真原职方外纪天主降生言行纪略等，与士大夫论学有代表性对话名场面；做事流较完整
  era: 明末天启崇祯
  dates_known: true
