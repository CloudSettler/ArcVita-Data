source: 子藏/诸子/昭德新编.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 晁逈
  score: 7
  worth_why: 太平兴国五年进士，历右正言、知制诰至翰林学士承旨，绵历两制、逮事三朝而进退以礼；天禧中判西京留司御史台，以太子太保急流勇退；致仕后居昭德坊老而好学，自筮仕至大耋未尝一日废观书弄翰，悟东鲁之书文而雅、西域之书质而备，遂酌中三教著成昭德新编一百六十七则，倡力胜智胜志胜三胜之说与道胜者无穷通、制心息虑不如简缘等理趣；年逾八旬身衰心高，可为老而好学、功成身退之范，卒谥文元，五世孙晁遡搜罗家集得传后世
  era: 北宋
  dates_known: true
rejections:
- name_zh: 羊祜
  why_not: 篇中仅引其起平吴之议与天下不如意恒居十七八之叹，系晁逈说理之引据，无做事周期，宜据晋书别录
- name_zh: 向朗
  why_not: 仅三十余字言其潜心典籍年逾八十犹手自校书，无完整周期
- name_zh: 沈麟士
  why_not: 仅三十余字言其隐居抄写细书至八十余，无完整周期
- name_zh: 高允
  why_not: 仅三十余字言其九十余诲人不倦手常执书，本篇无周期，北魏正史另有传可据以别录
- name_zh: 刘禹锡
  why_not: 仅引其读书三十年百虑无一得之语作引据
- name_zh: 白居易
  why_not: 仅引其安得万里裘诗一句，晁逈自言夙慕其为人而已
- name_zh: 乐广
  why_not: 仅引其名教中自有乐地一语
- name_zh: 权德舆
  why_not: 仅引古兴辞不得如意居大半一句
- name_zh: 独孤及
  why_not: 仅因送李白序才全志全一语被引
- name_zh: 老子
  why_not: 仅引道可道非常道、名与身孰亲之语，无传文
- name_zh: 庄子
  why_not: 仅引齐物理和天倪等语，无传文
- name_zh: 季札
  why_not: 仅作挂剑践信之典，无传文
- name_zh: 子路
  why_not: 仅作无宿诺之典，无传文
- name_zh: 李遵朂
  why_not: 仅撰序追述与晁逈论道交游，本人做事周期未见
- name_zh: 晁遡
  why_not: 仅以五世孙身份搜罗家集得书刊行，无做事周期可录
- name_zh: 李淑
  why_not: 提要中仅一语转述其评晁逈服膺坟典
- name_zh: 王古
  why_not: 提要中仅一语转述其评晁逈名理之妙
- name_zh: 公孙鞅
  why_not: 已在库；文中仅引初见秦孝公先睡后席之典
- name_zh: 魏文侯
  why_not: 已在库；文中仅引端冕听古乐恐卧之典
- name_zh: 孔子
  why_not: 已在库；文中仅引朝闻道夕死可矣之语
- name_zh: 李白
  why_not: 已在库；文中仅借独孤及序提及其名
