candidates:
- name_zh: 高拱
  score: 8
  worth_why: 隆庆朝主政，主持俺答封贡化边患为互市，数十年北边安靖；隆庆六年遭冯保张居正逐出，罢归十三年后发愤著本语，缘起阶段名场面结局俱全，且明史称其练习政体有经济才，本书即其失位后复盘天下事的夫子自道
  era: 明中后期（嘉靖至万历）
  dates_known: true
