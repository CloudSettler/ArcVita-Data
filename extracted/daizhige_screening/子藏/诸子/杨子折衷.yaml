category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 湛若水
  score: 8
  worth_why: 明代甘泉学派宗师，与王阳明一见定交、共倡圣学，世称王湛之学；提出随处体认天理之说；仕至南京礼部尚书、南京国子监祭酒，致仕后仍建书院讲学不辍直至九十五岁而卒，从学白沙、及第入仕、共倡讲学、归老著述的做事流完整；本书即其一生辨学事业的代表作，以慈湖学说为靶作思想折衷
  era: 明代
  dates_known: true
- name_zh: 杨简
  score: 7
  worth_why: 陆九渊高弟、慈湖学派开创者；闻断扇讼而悟本心为心学史名场面；文中自述二十八岁、三十一岁两度觉悟，淳熙十一年任浙西抚属时于宝莲山营造书室有明确年月；知乐平县兴学教化、官至学士、晚年讲学著述，做事流较完整；本书通篇以其慈湖之学为批判对象，生平线索可考
  era: 南宋
  dates_known: true
rejections:
- name_zh: 胡安国
  why_not: 仅引其评佛者句句合字字是然而不同一则问答，无做事周期
- name_zh: 胡宏
  why_not: 仅作为胡康侯问答中的受话者出现，无事迹
- name_zh: 曾晳
  why_not: 仅借浴沂咏归作咏春说理之喻，无事迹脉络
- name_zh: 孟子
  why_not: 仅作为仁人心也性善勿正心等格言引证，文中无做事叙述
- name_zh: 舜
  why_not: 仅作道心安女止等圣训引证，非其本传叙事
