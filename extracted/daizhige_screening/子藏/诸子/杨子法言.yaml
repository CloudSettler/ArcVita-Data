category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 扬雄
  score: 9
  worth_why: 本书即其立言工程之成品——少好赋而中年自悔、童子雕虫篆刻壮夫不为、弃辞赋转攻道术；窃自比于孟子、忧众言淆乱而折诸圣、以法言十三卷卫孔子正道；仿论语著法言、仿周易著太玄、校书天禄阁而撰方言开语学之先；修身以为弓、矫思以为矢、立义以为的，性善恶混自成一家之言；成语雕虫小技、百川学海、金口木舌皆源出此书；在则人、亡则书，为以著述立身传世的完整做事流与立言范式
  era: 西汉末至新莽
  dates_known: true
- name_zh: 孟子
  score: 6
  worth_why: 文中一句立其名场面——杨墨塞路、孟子辞而辟之、廓如也，且为扬雄自比之镜；其周游列国、辟杨墨、著书七篇的完整做事流须另据孟子本书，故此卷暂列缓录
  era: 战国中期
  dates_known: true
rejections:
- name_zh: 孔子
  why_not: 已在库；书中仅作宗主与折圣之据，无新做事情节
- name_zh: 颜渊
  why_not: 仅铸颜渊、箪瓢之乐、颜苦孔卓等德行引据，无独立做事周期
- name_zh: 周公
  why_not: 已在库（周公旦）；仅孔子习周公一语
- name_zh: 屈原
  why_not: 已在库；仅如玉如莹一句品评
- name_zh: 董仲舒
  why_not: 已在库；仅与公仪子并提其才之邵
- name_zh: 尧、舜、周文王
  why_not: 仅尧舜禹汤文武并列一句，作圣王时间坐标，无做事叙述
- name_zh: 汤、禹、周武王
  why_not: 已在库；文中仅圣王并列提及
- name_zh: 贾谊、司马相如
  why_not: 仅赋艺品第一句（升堂入室），其做事流见史汉另考
- name_zh: 景差、唐勒、宋玉、枚乘
  why_not: 仅辞人之赋丽以淫一句并列，无事迹
- name_zh: 公孙龙
  why_not: 仅诡辞数万以为法一句贬语
- name_zh: 公输般
  why_not: 仅投其斧一喻；其营造发明做事流见墨子礼记等另考
- name_zh: 羿、逄蒙、王良
  why_not: 仅分弓舍策喻师承相习，无叙事
- name_zh: 公仪休
  why_not: 仅公仪子才邵一提；却鱼清名见史记另考
- name_zh: 正考甫、尹吉甫、公子奚斯
  why_not: 仅睎慕师承举例，无做事周期
- name_zh: 白圭、猗顿
  why_not: 仅治产之富作对比喻
- name_zh: 乌获
  why_not: 仅千钧之力作比喻
- name_zh: 杨朱、墨翟
  why_not: 仅杨墨塞路一句为孟子辟异端之背景，本人做事流须另据墨子孟子书
