candidates:
- name_zh: 汤鹏
  score: 9
  worth_why: 二十岁成进士入军机得见天下奏章，慨然有肩荷一世之志；为御史旬日三章，倡言弹劾宗室尚书叱辱满司官，谓臣不可奴隶辱吏、此作威福之渐，虽坐言过当罢官而骨鲠之风振一时；鸦片战起，已黜不得言事，犹条上夷务善后三十事，后美使求改关市约，其奏中不可许者数事果验，时人服其精；愤而著浮邱子九十一篇四十馀万言，立意为干分支递演，自成一子，又作明林、七经补疏、止信笔初稿；于万柳堂置酒贺姚莹出狱，义气相尚。得志、直言遭黜、危机建言、著书传世、郁抑早卒，做事周期完整，兼为骨鲠言事之范与才不获施之训
  era: 清道光年间
  dates_known: true
- name_zh: 姚莹
  score: 6
  worth_why: 以台湾道创英夷，旋受诬下狱，事白出狱，台湾之狱为鸦片战后名案；然本集仅两句带过，做事流欠完整，宜缓录待其专传
  era: 清道光年间
  dates_known: true
- name_zh: 魏源
  score: 5
  worth_why: 本集许其始治经、已更悉心时务，所论著为史才；仅一句评语无具体事件，宜待其专传另录
  era: 清道光年间
  dates_known: true
