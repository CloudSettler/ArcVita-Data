source: 子藏/诸子/淮南子.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 刘安
  score: 9
  worth_why: 招致门客数千人编成《淮南子》二十余万字，集先秦黄老之学大成，献书武帝构成完整文化工程；同览亡秦之迹倡无为而治，晚年谋反事泄自尽而死，文化成功与政治败亡双线对照成后世教训；豆腐传说与一人得道鸡犬升天皆系其身，名场面密集
  era: 西汉
  dates_known: true
- name_zh: 老聃
  score: 8
  worth_why: 周守藏室之史，居周久之见周衰，乃著道德经五千言出关而去，起于职守终于传世之作，做事流完整；本卷引天下至柔驰骋天下之至坚以立无为之要旨，其思想为全书底色
  era: 春秋末期
  dates_known: true
- name_zh: 伊尹
  score: 8
  worth_why: 以滋味说汤由庖厨进为一代名相，放太甲于桐宫而天下治，忍负放君恶名终成王道；本卷虽仅以不能化顽劣之例提及，然据全录知其权臣与贤相双重叙事完整
  era: 商初
  dates_known: true
- name_zh: 舜
  score: 7
  worth_why: 耕历山渔河滨，期年而田者让硗埆渔者让湍濑，口不设言而化驰若神，不发号施令而移风易俗，内修其本的活教材；德化与禅让叙事完整
  era: 上古五帝时
  dates_known: false
- name_zh: 师旷
  score: 7
  worth_why: 目盲而精于乐为晋平公太师，援琴撞君以谏政为名场面，师旷之聪成成语；本卷以聪不能听十里外证任一己之能不足以治三亩之宅
  era: 春秋晋国
  dates_known: true
- name_zh: 蘧伯玉
  score: 7
  worth_why: 行年五十而知四十九年非，日省其身寡过知非，修身自省之典范；知非之年成语诞生点，与孔子往来事迹可考
  era: 春秋卫国
  dates_known: true
rejections:
- name_zh: 神农
  why_not: 仅播谷因苗以为教一例及尝百草传说，上古年代不可考，事迹神话化难建可信时间轴
- name_zh: 羿
  why_not: 仅以善射之技一例出现，无独立做事周期记载
- name_zh: 造父
  why_not: 仅以善驭一例提及，无完整做事叙事
- name_zh: 离朱
  why_not: 仅作目力之明的典故符号出现，无事迹流
- name_zh: 夏鲧
  why_not: 仅筑三仞之城致诸侯背叛一句反例，其事可并入已在库之禹条作衬托，无独立价值
- name_zh: 共工
  why_not: 神话人物，怒触不周山与高辛争帝败亡，年代不可考，仅作争而不当之反例
- name_zh: 高辛
  why_not: 天下共主，仅作共工之对手出现，无做事记载，君主低优先
- name_zh: 越王翳
  why_not: 逃山穴被越人熏而出之一例，事迹过于简略
- name_zh: 詹何
  why_not: 仅以钓鱼之术一例出现，无生平做事流
- name_zh: 逢蒙
  why_not: 仅作羿之传人名号出现，事迹无考
- name_zh: 冯夷
  why_not: 神话御者，传说人物年代不可考
- name_zh: 大丙
  why_not: 神话御者，传说人物年代不可考
