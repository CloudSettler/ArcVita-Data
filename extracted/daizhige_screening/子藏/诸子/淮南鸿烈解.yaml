source: 子藏/诸子/淮南鸿烈解.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 刘安
  score: 9
  worth_why: 奉诏作离骚传旦受诏蚤食已上，才思敏捷；聚苏飞伍被等八公及大山小山之徒讲论道德，共著鸿烈即淮南子，言大道兼载古今治乱存亡祸福，书成传世为诸子巨制；然怨雠之族卒谋反，贾谊言验，一尺缯童童民谣讥兄弟不相容，成书之名与谋反之败两面俱全，做事流完整且教训深刻
  era: 西汉文帝至武帝之世
  dates_known: true
- name_zh: 高诱
  score: 7
  worth_why: 少从卢植受淮南句读大义，遭兵灾书废二十余年，建安十年为濮阳令惧斯道陵迟，以朝餔事毕之隙深思先师之训为之注解；八卷借与弁揖因身丧而亡，建安十七年迁河东监复更补足，乱世存续绝学，注成传世，缘起转折结果俱全
  era: 东汉建安年间
  dates_known: true
- name_zh: 刘长
  score: 6
  worth_why: 为母恚死怨辟阳侯不争，椎杀之于文帝前；骄蹇称东帝用黄屋左纛，坐徙蜀严道死于雍，文帝封其四子遂启淮南衡山之反；恃亲骄蹇之教训鲜明，惟本篇传文简略且事近刘安之背景
  era: 西汉高帝至文帝时
  dates_known: true
rejections:
- name_zh: 贾谊
  why_not: 本篇仅一句谏言怨雠之人不可贵，预言虽应验，无其自身做事周期
- name_zh: 纪昀
  why_not: 仅以总纂官署名于四库提要，无做事事迹
- name_zh: 许慎
  why_not: 仅涉注本题名歧误之考辨，无传略无做事流
- name_zh: 伍被
  why_not: 与苏飞左吴等八公仅列名于著书之列，本篇无其谏诤谋画事节
- name_zh: 弁揖
  why_not: 借淮南注八卷而身丧书亡，一节小事不足为做事流
- name_zh: 审食其
  why_not: 仅见为刘长椎杀之由，无自身传略
- name_zh: 离朱
  why_not: 与师旷詹何娟嬛冯夷大丙伊尹造父等同为原道训说理之喻，一鳞半爪非传主
- name_zh: 神农
  why_not: 本篇仅一语因苗以为教，播谷全事未见；鲧禹一则禹已在库
- name_zh: 乾隆帝
  why_not: 仅御制读淮南子一诗咏英俊之辩，无做事流
