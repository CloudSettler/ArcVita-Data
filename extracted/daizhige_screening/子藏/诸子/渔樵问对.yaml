category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 邵雍
  score: 8
  worth_why: 本篇即托名渔樵问答的寓言体著作，借渔者之口阐其先天易学与观物之学——体用相生、以物观物、量力而动。其人事迹可考：少时苦学游历河汾淮济，师从李之才得易学真传；定居洛阳安乐窝，富弼、司马光、吕公著为之置宅园；两度被举遗逸皆力辞不仕，安贫乐道；著《皇极经世》创元会运世推演体系、《伊川击壤集》开宋诗一路；殁后谥康节、从祀孔庙。求道—著述—辞征—传道的做事流完整，其辞官不仕、以学传世的处世之道可为后范
  era: 北宋
  dates_known: true
rejections:
- name_zh: 渔者
  why_not: 全书寓言主角，无姓名无生卒，仅作为邵雍思想的化身发论，无独立做事周期
- name_zh: 樵者
  why_not: 同为寓言设问角色，无名无年代，无事迹可考
- name_zh: 尧、舜、桀、纣
  why_not: 仅作义利之辨的伦理例证一笔带过，本篇无其做事细节；且禹、汤等已在库
- name_zh: 三王、五霸
  why_not: 只用作尚行与尚言之分野的历史标签，无具体行事可录
