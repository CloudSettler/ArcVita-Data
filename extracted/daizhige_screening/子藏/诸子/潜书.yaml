source: 子藏/诸子/潜书.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 孟子
  score: 9
  worth_why: 尊孟宗孟两篇所宗主；受业子思之门人，游说齐梁宋滕倡仁政性善；‘以齐王犹反手’‘养气不动心’‘民贵君轻’皆名场面；道不行则退与万章之徒序书作七篇，做事流完整可为百世师
  era: 战国中期
  dates_known: true
- name_zh: 唐甄
  score: 8
  worth_why: 潜书作者；辨儒篇标举儒者贵功‘能定乱除暴安百姓’，正心诚意须见于事功；中举后宰长子县十月去官，流寓苏州贫困卖文，三十年著潜书；锋芒直指君主专制，足为后人镜鉴
  era: 清初
  dates_known: true
rejections:
- name_zh: 大瓠（沈麟生）
  why_not: 辨儒篇中仅作问难陪衬，传文只叙其逋佛避难病卒，无做事周期
- name_zh: 冉求
  why_not: 文中兵败丧师奔楚系唐甄虚构反证之辞，与史实相反，不可据为做事流
- name_zh: 子贡
  why_not: 文中说吴晋存鲁反为田常所困乃虚构反例，非其本传做事周期
- name_zh: 苏代
  why_not: 仅与陈轸并列提‘奇计莫测’，无做事周期
- name_zh: 陈轸
  why_not: 仅与苏代并列提及，无做事周期
- name_zh: 赵奢
  why_not: 仅与白起乐毅并列称‘神于用兵’，无做事周期
- name_zh: 韩昭侯
  why_not: 仅一句‘明于治国’带过，无做事周期
- name_zh: 尾生
  why_not: 仅作守信之反譬，无做事周期
- name_zh: 宋襄公
  why_not: 仅以泓水之义作对比提点，无完整做事流
- name_zh: 蒋里善人
  why_not: 千金亡赀为治心寓言，非可录入人物
