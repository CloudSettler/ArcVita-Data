source: 子藏/诸子/物不迁论.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 僧肇
  score: 8
  worth_why: 本篇即其成名作《物不迁论》，「江河竞注而不流，野马飘鼓而不动」为中国思想史千年名场面；做事流完整可考——京兆家贫少年佣书抄经、历观庄老而志归般若、师从鸠摩罗什参译《大品》并得「解空第一」之誉、青壮之年连着《般若无知》《不真空》《物不迁》《涅槃无名》四论震处长安、三十一岁英年早逝；文中「功业不可朽故虽在昔而不化」恰成其身谶——人亡而文不朽，模范与教训兼具
  era: 东晋十六国（后秦长安）
  dates_known: true
rejections:
- name_zh: 孔子（仲尼）
  why_not: 已在库；文中仅引「回也见新，交臂非故」与临川之叹作义理佐证，非其本传
- name_zh: 庄生
  why_not: 文中仅借「藏山」一喻立义，无做事周期；如欲录入宜另据《庄子》原文及本传
- name_zh: 梵志
  why_not: 仅「吾犹昔人，非昔人也」譬喻中人物，无独立可考事迹与年代
- name_zh: 如来
  why_not: 义理引证坐标，文中未立其做事周期，非本篇所传之对象
