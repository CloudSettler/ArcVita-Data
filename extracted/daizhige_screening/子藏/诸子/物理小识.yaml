category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 方以智
  score: 9
  worth_why: 本书作者，卷首自述随闻而纪之自天象始即为编书缘起；著物理小识通雅东西均，坐集千古之智、会通中西的百科全书式学者；明亡后披缁为无可大师，康熙十年赴岭南途中于惶恐滩自沉殉节，学问与气节皆成典范
  era: 明末清初
  dates_known: true
- name_zh: 揭暄
  score: 7
  worth_why: 书中大段暄曰注气论光论声论，提出气包虚实、声由气击等说；另有兵经百篇与天文著作璇玑遗述，早年抗清后隐居著述，兵学与宇宙论两流兼擅
  era: 明末清初
  dates_known: true
- name_zh: 方孔炤
  score: 6
  worth_why: 书中潜老夫曰多出其口，方以智之学承其家学；官至湖广巡抚，与农民军周旋，兵败系狱后放归，明亡不仕，著周易时论合编
  era: 明末清初
  dates_known: true
- name_zh: 熊明遇
  score: 6
  worth_why: 即坛石先生，万历已未方孔炤亲炙其精论，为本书象数气论之直接师源；官至兵部尚书，著格致草，会通中西天文历理
  era: 明末清初
  dates_known: true
- name_zh: 方中通
  score: 5
  worth_why: 书中中通曰多条，从波兰教士穆尼阁习西法，著数度衍，为最早掌握对数的中国学者之一，并编成刊行物理小识
  era: 明末清初
  dates_known: true
rejections:
