- name_zh: 黄帝
  why_not: 仅作运气学说源头权威被引，传说人物生卒不可考
- name_zh: 欧阳修
  why_not: 仅过高唐驿闻空中人畜声一则志怪轶闻，非其做事周期
- name_zh: 闵梦得
  why_not: 仅万历戊午蜀中谳魔术案一句带过，无事迹可录
- name_zh: 方中德
  why_not: 仅中德曰一二条短注，事迹简略无完整做事流
- name_zh: 胡安国
  why_not: 仅引象数者天理也一句，无做事流
