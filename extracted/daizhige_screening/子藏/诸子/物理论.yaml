category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 杨泉
  score: 7
  worth_why: 本书作者，著《物理论》成一家之言：以水立天地、以元气释天，论日月星辰、潮汐风雨、地形水土，兼发『人含气而生，精尽而死，无遗魂』之无神论名句与『秉纲目张、执本末从』治术论；缘起（难盖天浑天）—立说（气一元、水为本）—成书—辑佚流传，思想做事流完整，代表作型人物
  era: 三国末至西晋初（吴末入晋，会稽人）
  dates_known: true
rejections:
- name_zh: 扬雄
  why_not: 仅有作盖天遭桓谭难之一句轶事，无完整做事周期
- name_zh: 桓谭
  why_not: 仅一句难扬雄，无事迹可列
- name_zh: 京房
  why_not: 仅引其月星至阴之说一句，无行事
- name_zh: 神农
  why_not: 仅『正节气、立历日』一句，制度发明点过于简略，宜缓录俟专文
- name_zh: 黄帝
  why_not: 仅一句占岁黄气之引，无做事流
- name_zh: 尧
  why_not: 仅『洪水民登木而栖』一句作背景坐标
- name_zh: 禹
  why_not: 仅禹贡州制之引，无新事迹，且已在库
- name_zh: 汉武帝
  why_not: 仅开拓三方立十三州一句，作时间坐标用，且已在库
- name_zh: 汉文帝
  why_not: 除肉刑被评『匹夫之仁』，仅作议论素材，且已在库
- name_zh: 张苍
  why_not: 仅一句除肉刑岁杀万计之评，无周期
- name_zh: 钟繇
  why_not: 仅一句复肉刑岁生二千之评，无周期
- name_zh: 伊尹
