candidates:
- name_zh: 申不害
  score: 9
  worth_why: 法家术治派宗师，与商鞅并称申商；相韩昭侯十五年，内修政教外应诸侯，终其身国治兵强无侵韩者；本书大体篇存其循名责实、君操柄臣任事、示天下无为的整套术治设计，为制度设计与权术之辨的名场面源头；韩非定法篇评其不擅其法不一其宪令故韩不霸，教训鲜明；生卒约前385至前337可考
  era: 战国中期
  dates_known: true
rejections:
