  why_not: 仅作其名正则天下治的举例一笔带过，无做事周期；传说君主只宜作时间坐标
- name_zh: 桀
  why_not: 仅作其名倚而天下乱的反面例证，无独立事迹可采
- name_zh: 黄帝
