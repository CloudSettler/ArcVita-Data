source: 子藏/诸子/素履子.md
category: 子藏/诸子
verdict: no_value
skip_reason: 素履子为唐张弧所撰劝诫类子书，以履道、履德、履忠、履孝、履仁、履义、履智、履信、履礼、履乐十目为纲，历代人物仅作德目例证一笔带过，无一人有缘起、阶段、关键决定、结果俱全的做事周期；作者本人唐书无传，生卒里贯不可考，仅知旧题将仕郎试大理寺评事，时间坐标缺失；书中叙述稍详的烽火戏诸侯主角周幽王已在库，管仲、张良、商鞅、屈原、孔子等主要例证亦均在库，余者皆寥寥数字无可采事迹。
rejections:
- name_zh: 张弧
  why_not: 唐书无传，生卒里贯不可考；行事仅撰本书与晁说之所谓伪作子夏易传二端，无完整做事周期，主要活动年代不可确指
- name_zh: 泰伯
  why_not: 传文仅义让其位、为父采药不返、封于吴数句，无阶段展开与决策细节
- name_zh: 范蠡
  why_not: 仅以鸱夷子之名被提及教民种植治生、乘舟而去一句，缺少整个功名周期
- name_zh: 褒姒
  why_not: 烽火戏诸侯事的主导者是周幽王，已在库；本人无做事流
- name_zh: 比干
  why_not: 仅封比干之墓一语作仁德例证，无事迹叙述
- name_zh: 伍子胥
  why_not: 仅得浣沙女终成守义一句，无完整周期
- name_zh: 苏秦
  why_not: 仅商鞅苏秦智讹而轘四字例证，无任何阶段与年代可考
- name_zh: 皋陶
  why_not: 仅谋九德一语，无可考做事流
