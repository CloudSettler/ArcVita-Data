category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 胡直
  score: 7
  worth_why: 初攻古文词以李白东坡自负，年二十六过普觉寺听欧阳德讲唯仁者能好人一章即折节向学，三十后兼师罗念庵；后讲道螺水、倡道东南，四方从游者屦恒满而不立门户；著衡齐九篇设问答力伸师说，以衡平齐和折衷儒释杨墨申韩与朱陆尊德性道问学之异同，一言订释氏本心未尝非是而特不能尽心之过；由文士转心学、自成一家之言的完整学者做事流
  era: 明嘉靖至万历间
  dates_known: true
- name_zh: 王世贞
  score: 6
  worth_why: 弇州山人，本篇序文作者；明代文坛后七子领袖、弇州山人四部稿与嘉靖以来首辅传作者，本篇仅显其文论识见一端，做事周期宜另据史料补全后录入
  era: 明嘉靖至万历间
  dates_known: true
- name_zh: 王充
  score: 6
  worth_why: 序称其著论衡二十余万言、辟摘诡谲取尚理实、蔡邕秘之以为谈助；东汉疾虚妄的批判思想家，论衡自纪存其完整做事流，本篇仅一语带过故列缓录
  era: 东汉
  dates_known: true
rejections:
- name_zh: 欧阳德
  why_not: 跋文仅记普觉寺讲学一事，系胡直向学之引子，无其自身做事周期
- name_zh: 罗洪先
  why_not: 仅见兼师念庵一句，其广舆图诸事须另据史料方可录
- name_zh: 许孚远
  why_not: 仅存一序，见其折衷圣学立场而无个人做事流
- name_zh: 张位
  why_not: 仅存一序
- name_zh: 曾凤仪
  why_not: 长洲令，仅见手书委序付梓刻书一事
- name_zh: 胡思敬
  why_not: 清末民初刊行者，跋文仅叙学派源流与版本源流
- name_zh: 罗伦
  why_not: 跋文吉郡学派名单列名而已，同列罗侨李中尹台刘文敏王时槐刘元卿聂豹邹元标邹守益罗钦顺等皆同此
- name_zh: 蔡邕
  why_not: 仅秘藏论衡以为谈助一句典故
- name_zh: 朱熹
  why_not: 序中列为学脉源头之朱子，无做事周期，录入当另据宋史行状
- name_zh: 庄子
  why_not: 序中以其齐物论与衡齐对照评骘，非本篇主角
- name_zh: 扬雄
  why_not: 序中与荀子孟子文中子同列学脉名单一语带过
