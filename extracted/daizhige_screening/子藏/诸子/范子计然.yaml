candidates:
- name_zh: 范蠡
  score: 10
  worth_why: 师事计然、佐越王入吴为质，谋划二十余年灭吴兴越；功成身退泛舟五湖，变名为鸱夷子皮、陶朱公，三致千金复分散之，进与退两端皆为完整做事流；飞鸟尽良弓藏、兔死狗烹之诫由此出
  era: 春秋末
  dates_known: true
- name_zh: 计然
  score: 9
  worth_why: 计然之策七、越用其五；明阴阳岁穰循环，主旱则资舟水则资车、贵上极反贱贱下极反贵；定籴价下不过三十上不过八十使农末俱利，开官市平粜；越用其法治牧江南七年而禽吴；阴利七国不肯自显诸侯
  era: 春秋末
  dates_known: true
- name_zh: 文种
  score: 8
  worth_why: 献伐吴九术，以货贿女乐贵籴粟囊等谋弱吴而灭吴；高飞之鸟死于美食、深川之鱼死于芳饵之喻；灭吴后不听范蠡劝退，终被赐属镂剑自尽，为功臣知退与否的对照教材
  era: 春秋末
  dates_known: true
