verdict: has_candidates
candidates:
- name_zh: 荀子
  score: 9
  worth_why: 劝学诸名篇皆出其手，青出于蓝、锲而不舍即其文；三为稷下学宫祭酒、两任兰陵令，游齐适楚遭谗废居著书终老，做事流完整；性恶论、制天命而用之为思想史名场面，门下李斯韩非开儒法转关
  era: 战国末期
  dates_known: true
- name_zh: 田单
  score: 8
  worth_why: 议兵篇点名的世俗所谓善用兵者；乐毅破齐后走保即墨，行反间去乐毅，火牛阵破燕军复七十余城，封安平君，绝境坚守与攻守反转俱全
  era: 战国末期
  dates_known: true
- name_zh: 孟子
  score: 7
  worth_why: 非十二子篇点名之思孟一派；性善论与荀子性恶论对垒为思想史名场面，游说齐梁、倡民贵君轻、退而著书七篇，做事流完整
  era: 战国中期
  dates_known: true
- name_zh: 墨子
  score: 7
  worth_why: 非十二子、天论诸篇点名批判之对象；其人止楚攻宋、摩顶放踵利天下、结巨子之社，做事流与名场面俱全，可与荀子构成论战坐标
  era: 战国前期
  dates_known: true
- name_zh: 韩非
  score: 7
  worth_why: 荀子门下转出之法家集大成，著孤愤五蠹；上书秦王而遭同门之谗下狱死，能自言其术不能自用其身，教训极强（凭史学知识关联补列，书内未直接出现）
  era: 战国末期
  dates_known: true
