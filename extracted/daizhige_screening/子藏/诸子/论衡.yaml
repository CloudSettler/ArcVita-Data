category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 王充
  score: 9
  worth_why: 《论衡》八十五篇疾虚妄的作者本人；家贫无书、游洛阳书肆遍读百家、闭门著书三十载；寒门苦学与独立批判精神的典范；书中自纪篇可自述完整做事流
  era: 东汉
  dates_known: true
- name_zh: 伍员
  score: 9
  worth_why: 即伍子胥；由楚奔吴、荐才佐阖闾、破楚入郢，后谏夫差遭帛喜构陷赐死、悬目国门；忠而被谗的完整悲剧做事流，本篇以其与帛喜同主异遇开篇立论
  era: 春秋末期
  dates_known: true
- name_zh: 吕尚
  score: 9
  worth_why: 即姜太公；渭滨垂钓遇文王、佐武王灭商、受封建齐开国之基；大器晚成与君臣相遇的千古典范、兵家权谋之祖；本篇以太公受封对举伯夷饿死论遇
  era: 商末周初
  dates_known: true
- name_zh: 伊尹
  score: 8
  worth_why: 以滋味说汤、由庖厨进为宰相，佐汤灭夏、放太甲而天下大治；本篇以其遇成汤对举箕子为奴，是遇不遇之辨的首选正面典型
  era: 商初
  dates_known: true
- name_zh: 孟轲
  score: 8
  worth_why: 即孟子；游说齐梁、道不行而退与万章之徒著书七篇成亚圣；本篇以其困于齐梁对举孔子绝粮陈蔡，是大才不遇的标本
  era: 战国
  dates_known: true
rejections:
- name_zh: 许由
  why_not: 篇中仅作让天下而隐山林的对举符号，无做事周期
- name_zh: 伯夷
  why_not: 仅以不食周粟饿死一句对举太公受封，事迹简略无完整做事流
- name_zh: 箕子
  why_not: 一句对举为奴而已，无完整做事周期
- name_zh: 帛喜
  why_not: 反面陪衬一句带过，仅用以反衬伍员之死
- name_zh: 比干
  why_not: 仅剖心谏纣一句，作蔽惑之例证
- name_zh: 邹衍
  why_not: 仅夏不陨霜罪不除一典，事涉怪异且无做事流
- name_zh: 邓通
  why_not: 幸臣以色遇主之例证，无做事可言
- name_zh: 籍孺
  why_not: 同为以色幸之例证一句
- name_zh: 无盐
  why_not: 丑女进身之例证一句，事迹零星
- name_zh: 伯牙
  why_not: 比喻性人物，非史传主体
- name_zh: 伯奇
  why_not: 后母谗子放流一典，仅作累害例证
- name_zh: 子贡
  why_not: 仅说有义而野人不听一句对举，无完整事迹
- name_zh: 周人白首不遇者
  why_not: 寓言人物，用以证仕宦有时不可强求
- name_zh: 窃簪之臣与鸡鸣之客
  why_not: 无名氏典故，仅作奸巧合上之例
