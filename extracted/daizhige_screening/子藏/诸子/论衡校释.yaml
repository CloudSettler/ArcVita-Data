source: 子藏/诸子/论衡校释.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 王充
  score: 10
  worth_why: 寒门苦学，游洛阳书肆阅书一见能诵，师事班彪；归乡闭门著讥俗政务养性论衡，八十五篇疾虚妄，以自然主义击破天人感应迷信，问孔刺孟开一代思想波澜；问孔刺孟之胆识与功成不仕之节，皆为后世模范；年谱俱在，生卒可考
  era: 东汉
  dates_known: true
- name_zh: 桓谭
  score: 7
  worth_why: 当光武帝前极言谶纬非经，帝怒几见诛，出为六安郡丞死于道中；著新论倡形神之说，开后世神灭论先声；论衡屡引为破谶知音，做事流完整
  era: 西汉末至东汉初
  dates_known: true
- name_zh: 蔡邕
  score: 8
  worth_why: 校立熹平石经、制焦尾琴、亡命吴会十二载；入吴得论衡百篇秘玩而学大进，史通谓若未遇伯喈此书将烟烬火灭；旷世逸才终死于董卓之狱，成败教训俱全
  era: 东汉末
  dates_known: true
- name_zh: 王朗
  score: 6
  worth_why: 为会稽太守拒孙策，兵败而降，后入曹魏历司空三公，屡上疏谏止兴修宫室；得论衡全稿携归中原，功在传书
  era: 东汉末至三国魏
  dates_known: true
