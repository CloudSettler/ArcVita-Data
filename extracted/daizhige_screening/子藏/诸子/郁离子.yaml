verdict: has_candidates
candidates:
- name_zh: 刘伯温
  score: 9
  worth_why: 元末仕进受抑，慨然有澄清之志；建言不用遂弃官屏居青田山中发愤著《郁离子》十章十八篇百九十五条，以文明之治矫元季之弊；后身亲用之，以宏谟伟略佐朱元璋定天下封诚意伯——事业具于书、书见于事业，弃官—著书—出山—功成的完整做事流俱全，兼有著述名场面与用舍兴亡之训
  era: 元末明初
  dates_known: true
- name_zh: 春申君
  score: 6
  worth_why: 养枭篇一喻点破其宠荣狗偷鼠窃之徒而望国士之报，卒为李园所杀、门下三千客无一人能报，养士失察始末完整、教训深刻；然本书仅存寓言一段，全貌待《史记》补
  era: 战国末
  dates_known: true
rejections:
