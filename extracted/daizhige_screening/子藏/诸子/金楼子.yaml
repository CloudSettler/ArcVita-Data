category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 萧绎
  score: 8
  worth_why: 梁元帝自号金楼子、病目犹夜读、聚书十四万卷著述等身；侯景之乱传檄平乱后即位江陵；城破前焚书十四万卷叹文武之道今夜尽矣——藏书立言之勤与自毁文明之祸集于一身的巨鉴
  era: 南朝梁
  dates_known: true
- name_zh: 伊尹
  score: 8
  worth_why: 以有莘媵臣负鼎俎、以滋味说汤至于王道；汤五聘而后就、任以国政；后更放太甲于桐宫、终还政——从庖厨到元圣的完整上升流，调和鼎鼐之喻所自出
  era: 商初（约前1600年前后）
  dates_known: true
- name_zh: 帝舜
  score: 7
  worth_why: 瞽瞍顽嚚屡欲杀之、凿井旁行以孝闻；耕历山让畔、一年成聚三年成都；摄政举禹弃契皋陶等、箫韶九成凤凰来仪；禅禹避商均——修身到传贤的完整治道流
  era: 上古五帝之末（传说纪年约前22世纪）
  dates_known: false
- name_zh: 帝尧
  score: 6
  worth_why: 克明俊德协和万邦；命羲和历象日月定四时成岁；用鲧治水九年不成、改咨四岳得舜——用人成败两段决策链；禅舜不传丹朱
  era: 上古五帝（传说纪年约前23世纪）
  dates_known: false
- name_zh: 黄帝
  score: 5
  worth_why: 阪泉三战然后得行其志；置三公与左右大监以治人、兴封禅以土德王——人文初祖的开局叙事，惜本传多感生符瑞
  era: 上古传说（约前27世纪）
  dates_known: false
