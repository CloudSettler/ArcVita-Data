source: 子藏/诸子/长短经.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 赵蕤
  score: 9
  worth_why: 开元四年著成长短经六十四篇并自为之注，总论王霸经权通变之道，上承战国纵横而归本儒理，历代视为经世权谋经典；博学韬钤、夫妇俱有隐操、屡不应辟召，隐居著书自成完整做事周期，堪称经世致用与守身不仕之范
  era: 唐开元间
  dates_known: true
- name_zh: 纪昀
  score: 7
  worth_why: 乾隆间任四库全书总纂官，主持编纂成书并成总目提要，为清代学术之枢纽；文中仅以署名见之，其做事流主要凭史学知识补足
  era: 清乾隆间
  dates_known: true
rejections:
- name_zh: 乾隆帝
  why_not: 君主低优先，文中仅御题诗与提要署年，无独立做事主文
- name_zh: 沈新民
  why_not: 仅卷末跋语数行，提要且疑其书贾伪托，无做事周期
- name_zh: 励守谦
  why_not: 仅以呈献家藏宋本见知，附记其家三世侍直内廷，事迹简略
- name_zh: 王士祯
  why_not: 仅居易录记宋椠一语引据，非本篇传文
- name_zh: 徐干学
  why_not: 仅以传是楼藏印与得书掌故出现，藏弆之事不成做事流
- name_zh: 晁公武
  why_not: 仅书目著录篇卷数引据，无其行事
- name_zh: 孙光宪
  why_not: 仅北梦琐言一条引载其语
- name_zh: 苏秦
  why_not: 文中仅两处引语，以济弱燕与驰辞为例证，无其做事文本
- name_zh: 伊尹
  why_not: 仅引使负土推涂一节为任长例证，非传主文本
- name_zh: 周厉王
  why_not: 仅芮良夫谏专利数句为例证，教训虽著而文本过简
- name_zh: 尧
  why_not: 君主低优先，文中仅作分职任贤之坐标例证
