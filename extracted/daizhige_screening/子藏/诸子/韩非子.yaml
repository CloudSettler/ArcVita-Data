category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 韩非
  score: 9
  worth_why: 法家集大成者，做事流完整：上书秦王陈初见秦、存韩之策，自请入韩说韩王，反遭同门李斯构陷下狱，身死而其书成秦汉治国之典；名场面密集：《难言》极陈进言之难，唇亡齿寒一语即出本篇存韩章，全书更是自相矛盾、守株待兔、滥竽充数等成语宝库；教训深刻：不知而言不智、知而不言不忠的谏臣困境，才冠当世而死于狱中，法术势之学与其身死之训可对照成篇
  era: 战国末年
  dates_known: true
- name_zh: 张孟谈
  score: 7
  worth_why: 晋阳被知伯决水灌城三月、城且拔之际，潜行出城反知伯之约，说动韩魏两家倒戈，合两家之众反攻知伯，身复赵氏之境；以一使潜出挽狂澜，三家分晋由此发端，危机公关与合纵倒戈的经典案例
  era: 春秋末
  dates_known: true
- name_zh: 商纣王
  score: 6
  worth_why: 率天下甲兵百万，左饮淇溪右饮洹溪、淇水竭而洹水不流，却被武王素甲三千一日击破、身死国灭；以乱攻治者亡、以逆攻顺者亡的千古镜鉴，暴君速亡的极端对照样本
  era: 商末
  dates_known: true
- name_zh: 知伯
  score: 6
  worth_why: 率三国之众攻赵襄主于晋阳、决水灌城三月而城且拔，胜局在握却以骄致败；被张孟谈策反韩魏，反遭擒杀，骄兵必败、贪得无厌致三家反噬的典型教训
  era: 春秋末
  dates_known: true
rejections:
