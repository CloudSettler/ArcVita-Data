  why_not: 已在库；本篇存韩第二载其使韩上书事，不重复录入
- name_zh: 周武王
  why_not: 已在库；本篇仅作三千破百万之战例
- name_zh: 秦王政
  why_not: 已在库（即秦始皇），本篇中仅作受书之王与决策背景
- name_zh: 赵襄主
  why_not: 文中仅居守受困、占卜问吉凶，主动之功尽归张孟谈，缺独立做事周期
- name_zh: 穰侯
  why_not: 仅一句用一国之兵而欲成两国之功的评语，无完整做事流
- name_zh: 荆令尹
  why_not: 仅一句话评韩之反复背秦，无事可录
- name_zh: 杜仓
  why_not: 仅提其相秦兴兵之名，无事迹展开
