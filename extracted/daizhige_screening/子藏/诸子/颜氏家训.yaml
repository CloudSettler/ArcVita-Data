source: 子藏/诸子/颜氏家训.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 颜之推
  score: 9
  worth_why: 家训之祖；历仕梁齐周隋四朝，江陵陷后被掳北迁仍著述不辍；九岁丧父由兄鞠养，二十篇以自悔自省训子孙，做事流完整且为千古典范
  era: 南北朝末至隋
  dates_known: true
- name_zh: 薛包
  score: 7
  worth_why: 被父逐仍晨昏定省至里门，分财独取朽败器物，弟子破产后再赈给；建光中公车特征拜侍中，称疾乞归，谦让孝悌之完整事例
  era: 东汉安帝时
  dates_known: true
rejections:
- name_zh: 王僧辩母魏夫人
  why_not: 仅捶挞教子一节佐证严教，无其本人做事周期
- name_zh: 齐琅邪王
  why_not: 骄恣僣拟终致幽薨，为鉴戒轶事，无可考做事流
- name_zh: 房文烈
  why_not: 婢逃不怒寄宅不问数十字小传，无完整周期
- name_zh: 裴子野
  why_not: 仅饥年同粥收养亲故一事，始末年代简略
- name_zh: 刘璡
  why_not: 未着衣帽不应兄呼一节，事例单薄
- name_zh: 王绍三兄弟
  why_not: 友爱争死同殉一事，无独立做事周期
- name_zh: 殷外臣
  why_not: 再娶致子感慕求退一例，事迹过简
- name_zh: 陈蕃
  why_not: 仅引其语佐论，无事迹正文
