source: 子藏/诸子/马王堆帛书战国纵横家书.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 苏秦
  score: 9
  worth_why: 帛书自证其为燕反间于齐：处燕齐之交五年使齐不谋燕、暗恶齐赵之交、劝齐攻宋以疲齐，自言所处境遇重如累卵，终以死间之身殉燕破齐；做事流完整，纵横家第一间谍案，忠信与谋略之双重教材；其生世可证早于张仪，足以改写战国史
  era: 战国中晚期（约前300—前284）
  dates_known: true
- name_zh: 孟尝君田文
  score: 8
  worth_why: 文中薛公相齐伐楚九岁攻秦三年谋残宋，后去齐相魏而主谋五国伐齐、破宗国以报怨；由专权之荣至叛齐之讥，鸡鸣狗盗、狡兔三窟诸典故之主，权臣荣辱兼模与训
  era: 战国中晚期（约前300—前279）
  dates_known: true
- name_zh: 李兑（奉阳君）
  score: 7
  worth_why: 与公子成围主父于沙丘而饿杀赵武灵王，遂专赵政；封奉阳君执齐赵之柄、一度为合纵约长，文中苏秦诸章多受其掣肘；由定策杀主至主盟天下而终失势，权臣专杀之鉴
  era: 战国中晚期（约前307—前285）
  dates_known: true
- name_zh: 齐闵王田地
  score: 7
  worth_why: 立帝、伐秦、残宋而盛极一时，燕赵交恶皆系其身；旋招五国伐齐，国破身死于莒；由极盛至覆亡不过数年，骄兵必败之至鉴
  era: 战国中晚期（前301—前284在位）
  dates_known: true
rejections:
- name_zh: 燕昭王
  why_not: 已在库，本篇诸章受书之燕王即其人，可作苏秦时间轴之主谋坐标
- name_zh: 赵惠文王
  why_not: 已在库，本篇仅作受事君主坐标
- name_zh: 曾参
  why_not: 仅在苏秦说辞中作孝行之比况，非叙事对象
- name_zh: 尾生
  why_not: 仅作守信之喻，有名无事迹
- name_zh: 伯夷
  why_not: 仅作廉节之比，非本篇传主
- name_zh: 韩徐为
  why_not: 赵臣，通篇仅见其与苏秦、奉阳君纠葛之片段，无完整做事周期
- name_zh: 韩珉
  why_not: 齐臣，仅见献策引语，事迹零星
- name_zh: 成阳君
  why_not: 韩臣，仅见随韩魏王朝赵之名姓
- name_zh: 襄安君
  why_not: 燕宗室，仅见东使一节，首尾不详
- name_zh: 公玉丹
  why_not: 齐近臣，仅一句裁断之语
- name_zh: 苏修
  why_not: 在齐之燕人，仅见名姓
- name_zh: 韩山
  why_not: 苏秦传书之使，仅名姓
- name_zh: 盛庆
  why_not: 燕使，仅传书之名
- name_zh: 宋竅
  why_not: 齐使，通篇仅传话递信
- name_zh: 周纳
  why_not: 奉阳君传话人，仅名姓
- name_zh: 田林
  why_not: 薛公使者，仅通传消息
