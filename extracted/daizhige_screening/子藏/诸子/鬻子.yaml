category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 鬻熊
  score: 8
  worth_why: 年九十自荐见文王，「捕兽逐麋已老矣，坐策国事尚少」为大器晚成名场面；为文王师，论「大忘」以蚩尤、夏癸、商辛知恶不改丧身亡国为戒；传《鬻子》为诸子之首；曾孙熊绎受封于楚，肇八百年楚业，兼具老当益壮与过则勿惮改之训
  era: 商末周初
  dates_known: true
- name_zh: 熊绎
  score: 6
  worth_why: 成王时举文武勤劳之后嗣受封于楚，楚国开国之肇基；本篇仅一语记封，事简宜缓，待楚世家类文献补全其筚路蓝缕事
  era: 西周成王时
  dates_known: true
- name_zh: 逢行珪
  score: 5
  worth_why: 唐永徽四年以华州郑县尉校注《鬻子》缮写进呈，使先秦残典存续一线；然仅注书进呈一事，名场面弱
  era: 唐高宗永徽年间
  dates_known: true
rejections:
