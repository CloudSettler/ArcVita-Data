source: 子藏/诸子/鬻子古文龙虎经.md
category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 鬻熊
  score: 8
  worth_why: 九十岁见文王，王嫌其老，对曰使臣捕兽逐麋已老矣、使臣坐策国事尚少也，一语自荐遂为文王之师，著书二十二篇为诸子之首；训「大忘」之戒——知其身之恶而不改，以贼其身乃丧其躯，是老而弥智与改过自省的双重典范；其子熊丽、孙熊绎世传其业，成王时受封于楚，启楚国八百年基业，缘起、关键对答、结果俱全
  era: 商末周初（周文王时）
  dates_known: true
rejections:
- name_zh: 周文王
  why_not: 本文仅以问道者出现，问大忘一事而已，无其完整做事周期，宜由史记周本纪等别籍录入
- name_zh: 逢行珪
  why_not: 唐永徽四年注鬻子并进表而已，仅注书一事，无完整做事周期
- name_zh: 熊绎
  why_not: 仅一句载成王时受封于楚，无事迹细节
- name_zh: 周成王
  why_not: 仅见成王问答之名，本文未载其做事内容
- name_zh: 贾谊
  why_not: 仅因新书引鬻子被提及，本文未载其自身事迹
- name_zh: 周公旦
  why_not: 已在库；本文仅书名偶引鲁周公语
- name_zh: 伊尹
  why_not: 仅列名于汤七大夫名单，无事迹
