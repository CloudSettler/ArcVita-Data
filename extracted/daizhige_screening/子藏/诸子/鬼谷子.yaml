candidates:
- name_zh: 鬼谷子
  score: 7
  worth_why: 纵横家鼻祖，捭阖、反应、内楗、抵巇、飞箝、忤合、揣摩诸术自成体系，为战国谋略学说奠基；据史记授徒苏秦、张仪，弟子一纵一横操纵天下大势，教书育人之果可验于史；深隐鬼谷待时而动，为后世谋士范式。不足：本人隐居无传，生卒不可确考
  era: 战国中期
  dates_known: true
- name_zh: 伊尹
  score: 9
  worth_why: 文中忤合篇特举其五就汤五就桀、终合于汤之例；负鼎俎以滋味说汤，佐汤灭夏建商，放太甲于桐宫摄政三年、终归政，功成天下大治；出身庖厨而至帝师，教训与典范兼备；名场面：说汤、桐宫放君
  era: 商初
  dates_known: true
- name_zh: 吕尚
  score: 9
  worth_why: 文中忤合篇特举其三就文王三入殷、终合于文王之例；渭水垂钓遇文王，辅周灭商、牧野运筹，封于齐开基建国；兵家权谋之祖，六韬托名于其人；大器晚成、择主而事之典型
  era: 商末周初
  dates_known: true
rejections:
- name_zh: 五帝三王
  why_not: 文中仅作泛称古圣王，无个体传文与做事周期
- name_zh: 夏桀
  why_not: 仅作伊尹就汤去桀之反面衬托一笔带过，无传
