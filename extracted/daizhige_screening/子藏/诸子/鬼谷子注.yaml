category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 陶弘景
  score: 8
  worth_why: 三十六岁解官挂朝服于神武门而去，隐居茅山营建道场、开上清一派宗师之局；梁武帝每逢大事遣使入山咨以朝廷得失，时称山中宰相；撰《本草经集注》首创玉石草木等七类分药法整理七百三十种药物，又造浑天象、校理典籍，本篇《鬼谷子》注即出其手；出仕—归隐—著述—参政四段俱全，可为乱世全身成事之范
  era: 南朝宋齐梁之际
  dates_known: true
- name_zh: 鬼谷子
  score: 7
  worth_why: 捭阖、反应诸篇为其立言之本，纵横捭阖一语即出此书，开纵横家方法论之先河；传为苏秦张仪之师，一门之学搅动战国全局；惜本传仅零星见《史记》，生卒不详，做事周期须借本书体系与弟子行迹互证补全
  era: 战国中期约前4世纪
  dates_known: false
rejections:
- name_zh: 苏秦
  why_not: 本篇为术论非传记，文中不载其行事；应另据《战国策》《史记》单独立目
- name_zh: 张仪
  why_not: 同苏秦，本篇不载其事，仅传为鬼谷子弟子
- name_zh: 梁武帝萧衍
  why_not: 君主仅作时间坐标，其咨询山中宰相事附入陶弘景条即可
- name_zh: 圣人泛指
  why_not: 经文屡言圣人乃泛称理想人格，非实指某人，无做事周期可录
