- name_zh: 鹖冠子
  score: 6
  worth_why: 楚人隐居深山以鹖羽为冠，著书十九篇自成一家；博选篇帝者与师处王者与友处、学问篇中流失船一壶千金皆成语名句之源；韩愈柳宗元一褒一贬遂成千年书案。然本传仅寥寥数语，生平缘起不可考，宜缓录
  era: 战国晚期
  dates_known: false
- name_zh: 韩愈
  score: 9
  worth_why: 古文运动领袖，文起八代之衰；其读鹖冠子全文附于卷首，正三十五字乙三减二十二注十二，开校雠辨书之风；另有谏迎佛骨贬潮州兴学驱鳄等完整做事流，库中未收
  era: 中唐
  dates_known: true
