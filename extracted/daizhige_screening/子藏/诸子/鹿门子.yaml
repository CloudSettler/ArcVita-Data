category: 子藏/诸子
verdict: has_candidates
candidates:
- name_zh: 皮日休
  score: 8
  worth_why: 即本文作者醉士；隐于鹿门著隐书六十篇讥切时政，咸通进士官至太常博士；唐末遭黄巢之乱被逼署翰林学士，巢败后下落成谜——乱世士人出处抉择的完整做事流与深刻教训
  era: 唐末
  dates_known: true
- name_zh: 伊尹
  score: 6
  worth_why: 五就汤五就桀、一介不以取予的贤相原型；做事流完整但本文仅论其道近于执，须另据史料补全，宜缓录
  era: 商初
  dates_known: true
- name_zh: 伯夷
  score: 5
  worth_why: 不仕非君、不食周粟之高节典型，让国与饿死首阳可为名场面；本文仅品其道过乎高，事迹简略宜缓
  era: 商末周初
  dates_known: false
rejections:
