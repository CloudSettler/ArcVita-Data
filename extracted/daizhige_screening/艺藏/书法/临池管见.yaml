category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 周星莲
  score: 8
  worth_why: 自述数十年学书完整做事流——初习欧字成印板、改学褚字患流走、临怀仁集圣教与孙过庭书谱总觉无是处、转师今人再上溯宋碑唐楷至二王、终悟颜鲁公最好；由躐等取法乎上而失败到循序渐进得一步进一步之教训可警后学；晚年成书论名作临池管见、同治七年自序付梓，兼有中锋侧锋之辨与擒纵用笔要诀等心得
  era: 清代晚期（道光至同治间）
  dates_known: true
rejections:
- name_zh: 王羲之
  why_not: 仅被推尊右军书因物付物纯任自然一语，无做事周期，宜自其本传录入
- name_zh: 王献之
  why_not: 仅大令之名见于临习书目，无事迹
- name_zh: 颜真卿
  why_not: 仅诗至子美书至鲁公之推许与取法心得，非其本传事迹
- name_zh: 米芾
  why_not: 仅书画兼擅与刷字自评、奴书之讥数语，无做事周期
- name_zh: 苏轼
  why_not: 仅悬帖观摩与天真烂漫是吾师之学书法，非其事业流
- name_zh: 董其昌
  why_not: 仅书画兼擅提名与作书不可信笔一语
- name_zh: 柳公权
  why_not: 仅心正则笔正一语被引
- name_zh: 赵孟頫
  why_not: 仅用笔千古不易一句被引
