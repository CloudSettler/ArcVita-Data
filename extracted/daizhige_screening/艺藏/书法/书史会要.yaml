category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 程邈
  score: 9
  worth_why: 罪吏系云阳狱十年覃思，变篆为隶得三千字上之始皇，释罪拜御史；隶书之祖，官府文书由繁入简的关键改革，缘起、攻坚、成果俱全
  era: 秦
  dates_known: true
- name_zh: 史籀
  score: 8
  worth_why: 周宣王太史损益古文作大篆十五篇，世称籀书；今存石鼓文即其遗绪，文字规范化之先驱
  era: 西周宣王时
  dates_known: true
- name_zh: 王羲之
  score: 10
  worth_why: 兰亭雅集一序冠绝古今，备精诸体变古开新尊为书圣；东床坦腹、写经换鹅皆名场面
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 10
  worth_why: 平原郡首举义抗安禄山，骂李希烈殉国；祭侄稿号天下第二行书，颜体立楷书新典范，忠烈与书格合一
  era: 唐
  dates_known: true
- name_zh: 钟繇
  score: 9
  worth_why: 楷书之祖，铭石之体由隶入楷的关键推手，点画间多异趣为百代宗师
  era: 汉末至曹魏
  dates_known: true
- name_zh: 蔡邕
  score: 9
  worth_why: 奏立熹平石经正定六经文字，观者车乘填塞街陌；创飞白书，九势论笔法传世
  era: 东汉
  dates_known: true
- name_zh: 张芝
  score: 9
  worth_why: 临池学书池水尽墨，家之衣帛必书而后练；省减章草开今草，草圣之誉
  era: 东汉末
  dates_known: true
- name_zh: 张旭
  score: 9
  worth_why: 观公孙大娘舞剑器、担夫争道而悟笔法，嗜醉以头濡墨；草圣，脱帽露顶王公前
  era: 唐盛唐
  dates_known: true
- name_zh: 怀素
  score: 9
  worth_why: 种蕉代纸、盘板皆穿、弃笔成冢；自叙帖狂草绝唱，与张旭并称颠张狂素
  era: 唐
  dates_known: true
- name_zh: 柳公权
  score: 9
  worth_why: 以心正则笔正笔谏穆宗；柳骨严劲与颜筋并称，楷法典型
  era: 中晚唐
  dates_known: true
- name_zh: 赵孟頫
  score: 9
  worth_why: 日书万字意气不衰，力倡复归晋唐；五体皆冠绝，元一代书坛宗主
  era: 元
  dates_known: true
- name_zh: 欧阳询
  score: 8
  worth_why: 见古碑驻马观之三日乃去；欧体险劲森严，结构三十六法为法度典范
  era: 隋末至初唐
  dates_known: true
- name_zh: 王献之
  score: 8
  worth_why: 少有劝父改体之志，外拓开一笔书；与父并称二王，真行草皆变新奇
  era: 东晋
  dates_known: true
- name_zh: 米芾
  score: 8
  worth_why: 刷字八面出锋自成一格；拜石呼兄颠名动朝野，鉴藏与书论兼擅
  era: 北宋
  dates_known: true
- name_zh: 孙过庭
  score: 8
  worth_why: 书谱三千七百言，草法精纯、书论双绝，究执使转用之由
  era: 武周至唐
  dates_known: true
rejections:
- name_zh: 仓颉
  why_not: 四目作书、天雨粟鬼夜哭皆神话层累，无可考年代与做事周期，宜作文字起源背景符号
- name_zh: 伏羲
  why_not: 画卦生文属传说纪元，无可编年事迹
- name_zh: 神农
  why_not: 穗书一名附会稼穑，无事迹可考
- name_zh: 黄帝
  why_not: 云书纪官皆后世书体托名，非其本人做事
- name_zh: 少昊
  why_not: 鸾凤书仅一名目，无做事流
- name_zh: 颛顼
  why_not: 科斗书归属诸说存疑，传文仅一句
- name_zh: 帝喾
  why_not: 仙人书一句带过，无可考周期
- name_zh: 帝尧
  why_not: 龟书三说并存莫衷一是，且属君主低优先
- name_zh: 沮诵
  why_not: 与仓颉同造书契仅数语，同为传说时代
- name_zh: 史佚
  why_not: 虎书禽书鱼书皆瑞应附会，无独立做事
- name_zh: 务光
  why_not: 隐士倒薤书传说，身世年代渺茫
- name_zh: 司马子韦
  why_not: 因荧惑退舍作转宿篆仅一条
- name_zh: 秋胡子妻
  why_not: 玩蚕作蚕书数十字，故事简略
- name_zh: 唐终
  why_not: 梦蛇作蛇书一条，无做事周期
- name_zh: 周媒氏
