category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 刘宏（汉灵帝）
  score: 7
  worth_why: 诏诸儒正五经文字命蔡邕等书刻石立于太学，开官方石经定本之先；置鸿都门学生课试尺牍辞赋工书鸟篆者至千人，为艺术专科建制之始
  era: 东汉末
  dates_known: true
- name_zh: 刘炟（汉章帝）
  score: 6
  worth_why: 贵杜度草迹诏上章表令作草体，章草由此得名，法帖存辰宿列张数十字，一个书体定名的决策原点
  era: 东汉
  dates_known: true
- name_zh: 萧绎（梁元帝）
  score: 6
  worth_why: 江陵城陷聚书画典籍十四万卷付之一炬，叹文武之道今夜穷矣，文化存亡之千古警示，兼工书善画三绝之才
  era: 南朝梁
  dates_known: true
- name_zh: 刘裕（宋武帝）
  score: 5
  worth_why: 素拙于书纳刘穆之策纵笔为大字一字径尺，化短为长扬长避短的决策范例
  era: 南朝宋
  dates_known: true
- name_zh: 萧道成（齐高帝）
  score: 5
  worth_why: 与王僧虔赌书问谁为第一，一问一答构成君臣机锋的成语级名场面
  era: 南朝齐
  dates_known: true
- name_zh: 王僧虔
  score: 5
  worth_why: 臣书臣中第一陛下书帝中第一，善自谋而不失臣体，书艺与处世智慧合一
  era: 南朝宋齐
  dates_known: true
