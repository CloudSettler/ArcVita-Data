source: 艺藏/书法/书录.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 宋徽宗赵佶
  score: 7
  worth_why: 创瘦金体，笔势劲逸意度天成；崇宁置书画学成敕令格式、宣和六年设书艺所，定篆隶真草五体课程、生徒五百人逐月会试，以制度兴书学；靖康亡国留下诸事皆能独不能为君的教训
  era: 北宋
  dates_known: true
- name_zh: 李煜
  score: 7
  worth_why: 得拨镫法五字诀复增导送二字以传笔法；大字如截竹木小字如聚针钉；词宗书家而终亡国，是文艺天才误作君主的经典教训
  era: 五代十国南唐
  dates_known: true
- name_zh: 徐铉
  score: 6
  worth_why: 小篆中兴第一人，自谓晚年得蜾匾法非老笔不能；映日视之中心一缕浓墨笔锋直下的笔诀；由南唐入宋，后世校定说文复兴篆学之祖
  era: 五代入宋
  dates_known: true
- name_zh: 宋高宗赵构
  score: 6
  worth_why: 得王献之洛神赋六行日阅十数过，写六经刻石颁天下州学成南宋石经；因伪齐遣能黄庭坚书者为间而弃黄归王，学书防伪的关键决断
  era: 南宋
  dates_known: true
- name_zh: 王著
  score: 6
  worth_why: 太宗侍书，对御书字由八字递减至一字皆极遒劲；补永师千文缺数百字世宝重之；善大书创散卓笔；史载其主持淳化阁帖为刻帖之祖
  era: 北宋初
  dates_known: true
- name_zh: 宋太宗赵光义
  score: 5
  worth_why: 武定四方之后垂意翰墨，习飞白自言岁月既久遂尽其法；刻御书藏名山道宫佛庙并颁赐群臣，以帝王之力推行书学
  era: 北宋
  dates_known: true
- name_zh: 李建中
  score: 5
  worth_why: 李西台与杨凝式并称一时之绝，字中有笔如禅家句中有眼之典范，行书为世所师法
  era: 北宋初
  dates_known: true
- name_zh: 郭忠恕
  score: 5
  worth_why: 世人但知小篆而楷法尤精，由后周入宋，字学著作传世，宋人求其小楷而不可得
  era: 五代入宋
  dates_known: true
rejections:
- name_zh: 宋太祖
  why_not: 仅载宣和间后人出其真迹诗翰一事，本人做事无从考
- name_zh: 宋仁宗
  why_not: 帝王仅作时间坐标，传文唯赐飞白与模刻旧事，无做事周期
- name_zh: 钱俶
  why_not: 传文仅赞笔法入神品一句，其纳土归宋大事不见于本书
- name_zh: 宋绶
  why_not: 传文残缺仅存其名，唯朝体风行一处引文
- name_zh: 句中正
  why_not: 仅仕蜀入宋召对擢任数句，事迹简略
- name_zh: 孙思皓
  why_not: 仅学欧书本朝无人过一句，无做事周期
- name_zh: 李居简
  why_not: 仅善草书蒙太宗赏识一句
- name_zh: 王嗣宗
  why_not: 仅附谚语言草书之难，无事迹
- name_zh: 徐锴
  why_not: 仅千文刻石一句附于其兄传中
- name_zh: 米友仁
  why_not: 仅书艺所措置管局一职名，无做事流
- name_zh: 杨凝式
  why_not: 仅于李建中条并称一时之绝，无本传
- name_zh: 蔡襄
  why_not: 仅于士人书风流变叙述中一提，非本传主体
