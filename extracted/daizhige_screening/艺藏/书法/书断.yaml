category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 兰亭雅集一觞一咏成天下第一行书；少学卫夫人后渡江北游遍访名山碑版；誓墓去官全其志；入木三分典故源头
  era: 东晋
  dates_known: true
- name_zh: 蔡邕
  score: 9
  worth_why: 奏正六经文字刻熹平石经立于太学、摹写者车马填塞街巷；偶削帚成飞白书开创新体；亡命江海十二年、才高而死于非命可为教训
  era: 东汉
  dates_known: true
- name_zh: 张芝
  score: 9
  worth_why: 临池学书池水尽墨，遂成习字代称；省改章草创今草得草圣之号；有道之征不就，专精一艺终成大器
  era: 东汉
  dates_known: true
- name_zh: 钟繇
  score: 9
  worth_why: 由隶变楷为楷法之祖；苦求蔡邕笔法捶胸呕血、后得笔势勤学不辍传为佳话；戎马与书道双成官至太傅
  era: 三国魏
  dates_known: true
- name_zh: 王献之
  score: 8
  worth_why: 劝父大人宜改旧体，破章草旧格创一笔书；与父并称二王；十八缸水勤学典故流传
  era: 东晋
  dates_known: true
- name_zh: 索靖
  score: 8
  worth_why: 自重其书银钩虿尾；过宫门指铜驼叹会见汝在荆棘中、语验西晋之乱可为鉴戒；作草书状传书理
  era: 西晋
  dates_known: true
- name_zh: 欧阳询
  score: 8
  worth_why: 道见索靖古碑坐卧其旁三日乃去；九成宫醴泉铭为楷法极则；结体三十六法传后世为习字法门
  era: 唐
  dates_known: true
- name_zh: 智永
  score: 8
  worth_why: 闭阁三十年书真草千字文八百本散施江东诸寺；退笔盈簏作退笔冢、求书者踏破门限成铁门限典故
  era: 隋
  dates_known: true
- name_zh: 程邈
  score: 7
  worth_why: 系云阳狱十年覃思篆隶整理三千字奏之，始皇善而用为佐书；徒吏之身以文字自见，开官署急就之体
  era: 秦
  dates_known: true
- name_zh: 史籀
  score: 7
  worth_why: 周宣王太史作大篆十五篇以教学童；石鼓文遗响至今，为篆学之祖、书体制度化第一人
  era: 西周宣王时
  dates_known: true
- name_zh: 卫夫人
  score: 7
  worth_why: 撰笔阵图以兵喻笔、横如千里阵云点如高峰坠石；传衣钵于王羲之，开二王一脉源头
  era: 东晋
  dates_known: true
- name_zh: 张怀瓘
  score: 7
  worth_why: 开元中供奉著书断，立神妙能三品评骘体系；通考三千二百年书体源流，书史体例为后世法
  era: 唐
  dates_known: true
- name_zh: 皇象
  score: 6
  worth_why: 书急就章为章草万世师范、千载传习；兼工篆隶为江左书家之冠
  era: 三国吴
  dates_known: true
- name_zh: 伏胜
  score: 6
  worth_why: 秦焚书时壁藏古文尚书，汉文帝遣晁错往受、九旬口授；存亡续绝护经传世可为模范
  era: 汉初
  dates_known: true
- name_zh: 王次仲
  score: 5
  worth_why: 变苍颉古形为八分楷法、开隶楷之门；三征不至槛车化鸟属传说，且秦汉两说时代存疑
  era: 秦
  dates_known: false
rejections:
- name_zh: 苍颉
  why_not: 上古造字传说人物，四目通神无信史可据，生卒与做事周期俱不可考，只宜作文字起源符号
- name_zh: 沮诵
  why_not: 与苍颉并称造书契，仅存名号无事迹
- name_zh: 窦公
  why_not: 二百八十岁献古乐书属志怪，仅作古文存佚的年代旁证
- name_zh: 不准
  why_not: 盗发魏冢的汲郡人，仅作汲冢竹书出土事件坐标，非人物传主
- name_zh: 甄酆
  why_not: 删定旧文制为六书一句带过，无做事周期
- name_zh: 叔孙通
  why_not: 本篇仅辨滕公冢科斗书一句，其定朝仪等核心事迹不在本篇
- name_zh: 王遵、严延年
  why_not: 仅并工史书一笔，无事迹可采
- name_zh: 卢藏用
  why_not: 仅作书断叙述断限之终点提及，无做事事迹
- name_zh: 张怀环
  why_not: 仅附注兄弟同任翰林待诏一句
