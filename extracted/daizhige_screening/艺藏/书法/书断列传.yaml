source: 艺藏/书法/书断列传.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 十二岁窃读父藏笔说，恳请提前修习，不盈期月书大进，做事流完整；入木三分成语诞生点；三十三书兰亭序、三十七书黄庭经；卫夫人见其书泣言此子必蔽吾名；后世书圣
  era: 东晋
  dates_known: true
- name_zh: 钟繇
  score: 9
  worth_why: 向韦诞求蔡邕笔法不得，搥胸呕血，曹操以五灵丹救之得活；后掘韦诞墓得笔法而书更妙；精思学书卧画被穿过表、如厕终日忘归、见万类皆书象之；真书绝世，秦汉以来一人而已
  era: 汉末曹魏
  dates_known: true
- name_zh: 张芝
  score: 8
  worth_why: 性好书，凡家之衣帛皆先书后练，以痴劲成草圣；解散隶体草法而字皆一笔成；韦诞谓之草圣，崔氏之肉张氏之骨；草书发明点人物
  era: 东汉末
  dates_known: true
- name_zh: 程邈
  score: 8
  worth_why: 县吏得罪始皇幽系云阳狱中，覃思十年增损小篆成隶书三千字，奏之始皇善之用为御史；隶书定型者，囚徒逆袭成事的完整周期
  era: 秦
  dates_known: false
- name_zh: 韦诞
  score: 7
  worth_why: 洛阳许邺三都宫观题署以为永制；凌云台成误先钉榜，以笼盛诞辘轳引上二十五丈题榜，危惧戒子孙无为大字楷法；张芝笔左伯纸韦诞墨并称三绝
  era: 汉末曹魏
  dates_known: true
- name_zh: 史籀
  score: 7
  worth_why: 周宣王太史始变古文作大篆九千字，以史官制之用以教授学童；史籀十五篇著于汉书艺文志，文字规范化教学之起点
  era: 西周宣王时
  dates_known: false
- name_zh: 崔瑗
  score: 6
  worth_why: 师杜度学章草而媚趣过之，冰寒于水；点画精微神变无碍，王隐谓之草贤；章草入神小篆入妙
  era: 东汉
  dates_known: true
- name_zh: 梁鹄
  score: 6
  worth_why: 少好书受法于师宜官，举孝廉入鸿都门迁选部郎；魏武甚爱其书悬帐中又以钉壁，以为胜宜官；大字用笔尽势青出于蓝
  era: 东汉末至曹魏
  dates_known: false
- name_zh: 师宜官
  score: 6
  worth_why: 灵帝征天下工书数百人而八分称最，大则一字径丈小则方寸千言；空至酒家书壁售酒，观者云集酤酒多售则铲灭之，名士气与早期书法市场化场面
  era: 东汉灵帝时
  dates_known: false
- name_zh: 钟会
  score: 5
  worth_why: 有父风，书兼行草尤工隶书，逸致飘然；诈为荀勖书骗取宝剑，荀勖潜画其父钟繇像使兄弟见之恸，书史上著名机智交锋
  era: 曹魏
  dates_known: true
rejections:
