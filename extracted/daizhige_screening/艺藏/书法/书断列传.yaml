- name_zh: 邯郸淳
  why_not: 仅旁见得次仲法数语，无自成做事流
- name_zh: 荀勖
  why_not: 仅潜画钟繇像一事旁出，主体行事不在此篇
- name_zh: 卫夫人
  why_not: 仅一句预言评语，无做事周期
- name_zh: 汲冢书耕人
  why_not: 无名姓耕人偶然得书，属文献发现事件非人物成事
