candidates:
- name_zh: 司马光
  score: 9
  worth_why: 十九年成《资治通鉴》之功自不待言；本篇又载独乐园读书堂万余卷、曝书护书垂诫子孙，爱书之诚与敬可为万世法；积书积德箴言传诵至今
  era: 北宋
  dates_known: true
- name_zh: 毋昭裔
  score: 9
  worth_why: 贫贱时借《文选》遭人难色，发愤誓曰异日贵当镂板遗学者；后显达于蜀遂践诺刻《文选》《初学记》复雕九经诸史，两蜀文字由此大兴；刻书兼积德积金之典范，宋太祖见卷尾毋氏姓名命以板还之，传为佳话
  era: 五代后蜀
  dates_known: true
- name_zh: 毛晋
  score: 9
  worth_why: 汲古阁刻《十三经》《十七史》，雕镂精工字绝鲁亥，四方购者云集；早年好锓书几废家产，母出橐中金助成之；乱世盗贼蜂起赖刻工众多以保家；藏书刊书板本流传数百年令人景仰
  era: 明末清初
  dates_known: true
- name_zh: 张之洞
  score: 8
  worth_why: 《书目答问》附劝人刻书说，谓刻书之人终古不泯，光绪以来海内刻书之风因之大盛；仅粤督任内刻《广雅丛书》百数十种；晚年随波逐流于变法潮流，兴学存古进退失据，足为行事教训
  era: 晚清
  dates_known: true
- name_zh: 黄丕烈
  score: 7
  worth_why: 佞宋秘宋之风代表，百宋一廛聚宋椠百余种；撰士礼居藏书题跋记及续再续记，为题跋体藏书志典范
  era: 清乾嘉
  dates_known: true
- name_zh: 于敏中
  score: 6
  worth_why: 乾隆四十年奉敕编《天禄琳琅书目》，分列宋元明板影宋诸类，于刊刻时地收藏印记一一考证，为官书言板本之始
  era: 清乾隆
  dates_known: true
- name_zh: 尤袤
  score: 6
  worth_why: 《遂初堂书目》一书兼载数本，自成都石经至高丽本凡十数种，创书目著录板本之例，版本学之发端
  era: 南宋
  dates_known: true
- name_zh: 叶德辉
  score: 6
