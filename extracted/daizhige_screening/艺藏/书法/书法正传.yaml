category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 冯武
  score: 7
  worth_why: 少遭鼎革离乱、破巢完卵、焚笔砚、久困村塾，八十一岁应缪曰芑之聘馆于苏州树滋堂，发愤辑成《书法正传》十卷，补注陈绎曾、周伯琦、雪庵三家楷法奥旨；其言「与其不轻传而竟绝其绪，孰若公诸天下后世」；乱世守绝学、暮年成书传世，做事流完整，可为文化传承与晚年成事之范
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 冯班
  why_not: 全书以「钝吟云」散见其书论，《钝吟书要》收作卷十，然无本人生平叙事与做事周期
- name_zh: 缪曰芑
  why_not: 藏书劝学、促成此书之功臣，传中仅数语，无独立做事流
- name_zh: 陈绎曾
  why_not: 仅作为《翰林要诀》作者被采录，无生平事迹
- name_zh: 周伯琦
  why_not: 仅以所传《书法三昧》及说文字源被引，无生平做事
- name_zh: 李溥光
  why_not: 雪庵《永字八法》被采录，本人于此无可考事迹
- name_zh: 李淳
  why_not: 仅记进《大字结构八十四法》一事，无做事周期
- name_zh: 王羲之
  why_not: 全书仅引右军论墨一句，无生平事迹
- name_zh: 鲜于枢
  why_not: 仅存「悬腕书、问之瞑目伸臂曰胆胆胆」一段轶闻，无做事流
- name_zh: 卫夫人
  why_not: 仅引执笔寸法一句，无生平
- name_zh: 孙过庭
  why_not: 仅《书谱》被全录引用，无本传事迹
