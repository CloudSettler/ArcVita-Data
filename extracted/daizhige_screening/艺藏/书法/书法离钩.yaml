source: 艺藏/书法/书法离钩.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；兰亭序天下第一行书；入木三分、东床坦腹、写经换鹅等名场面密集；变古开今定千古笔法
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 祭侄稿天下第二行书；安史之乱独举河北义军抗叛、晚年骂贼死节；忠烈与艺事双全，凡例引为名贤寄趣典范
  era: 唐
  dates_known: true
- name_zh: 许慎
  score: 8
  worth_why: 历二十余年著说文解字，创五百四十部首检字、系统阐明六书，汉字学奠基人
  era: 东汉
  dates_known: true
- name_zh: 蔡邕
  score: 8
  worth_why: 正定六经立熹平石经为天下文本准则；创飞白书；著九势论笔法；因董卓之祸下狱而死可为教训
  era: 东汉
  dates_known: true
- name_zh: 钟繇
  score: 7
  worth_why: 楷书之祖，由隶变楷的关键节点人物；宣示表传世；书中推锺王为汉魏以下最著
  era: 汉末三国
  dates_known: true
- name_zh: 王献之
  score: 7
  worth_why: 与父并称二王；破体创新劝父改体；风神遒迈，书中以王大令与颜鲁公并举
  era: 东晋
  dates_known: true
- name_zh: 杨慎
  score: 6
  worth_why: 状元议大礼谪滇、流放三十五年著书四百余种；本篇录其禹碑伪说恰成寡识之戒，正反皆可取材
  era: 明
  dates_known: true
- name_zh: 张怀瓘
  score: 6
  worth_why: 书断以神妙能三品评骘历代书家、梳理十体源流，书论体系化的关键人
  era: 唐
  dates_known: true
- name_zh: 潘之淙
  score: 6
  worth_why: 本书作者；辑前人书论成十卷，提出深于法而后可离法、超于法而后可进法之进阶论；惜多荟萃旧说少己断
  era: 明
  dates_known: true
- name_zh: 史籀
  score: 5
  worth_why: 相传作大篆十五篇，汉字第一次规范化之举；周宣王太史，主要活动年代可考
  era: 周
  dates_known: true
- name_zh: 史游
  score: 5
  worth_why: 著急就篇为识字课本之祖，相传解散隶体开章草之端
  era: 西汉
  dates_known: true
- name_zh: 郭忠恕
  score: 5
  worth_why: 著汗简佩觿考文字源流，小篆散而八分生之演变论出自其口；兼篆隶名家
  era: 五代宋初
  dates_known: true
- name_zh: 仓颉
  score: 5
  worth_why: 造字传说核心人物，文字诞生点，山鬼夜哭一节极具名场面潜力；惟属上古传说年代不可考
  era: 上古
  dates_known: false
rejections:
