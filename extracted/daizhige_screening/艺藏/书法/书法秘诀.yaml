category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 书圣；兰亭雅集一挥而就成天下第一行书；入木三分、东床坦腹、以书换鹅皆典故名场面；文中官奴帖正是董其昌悟道之标尺
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 祭侄文稿为天下第二行书；多宝塔乃千年习字第一课（本文作者发愤之始）；屋漏痕折钗股喻藏锋出其门；骂贼死节，书如其人
  era: 盛唐
  dates_known: true
- name_zh: 董其昌
  score: 9
  worth_why: 本文核心范本，十七岁因书拙置第二发愤临池，亲观项氏藏帖自愧欲焚笔砚，学书三十年悟起倒收束，集古出己开晚明一代书风，做事流完整
  era: 晚明
  dates_known: true
- name_zh: 苏轼
  score: 9
  worth_why: 乌台诗案后黄州突围词文双绝；石压蛤蟆体自成一格；文中偏锋之疑二十年一朝冰释，为悟道佳话
  era: 北宋
  dates_known: true
- name_zh: 米芾
  score: 8
  worth_why: 集古字破茧自成一家，蜀素帖风樯阵马；米颠拜石见痴性；文中提笔法授陈中丞，蝇头小字位置如大字，场面生动
  era: 北宋
  dates_known: true
- name_zh: 张芝
  score: 8
  worth_why: 草圣，今草之祖；临池学书池水尽墨，临池一词即出此人；文中与索靖并称凤翥龙蟠
  era: 东汉
  dates_known: true
- name_zh: 钟繇
  score: 7
  worth_why: 楷法之祖，宣示表为正书鼻祖名迹；文中评其一点一画皆有篆隶遗意；求蔡邕笔法于韦诞捶胸呕血亦名场面
  era: 汉末魏初
  dates_known: true
- name_zh: 王献之
  score: 7
  worth_why: 劝父宜改体自开门户，与父并称二王；十八缸水苦学佳话；文中董其昌以学大令立基
  era: 东晋
  dates_known: true
- name_zh: 张旭
  score: 7
  worth_why: 观公孙大娘舞剑器而悟笔法（本文明载）；颠张草圣，肚痛帖一挥而就
  era: 盛唐
  dates_known: true
- name_zh: 黄庭坚
  score: 7
  worth_why: 观艄公荡桨群丁拨棹悟笔法，长枪大戟自成山谷体；文中其评东坡草书一则破作者二十年之疑
  era: 北宋
  dates_known: true
- name_zh: 虞世南
  score: 7
  worth_why: 太宗誉为五绝之臣；孔子庙堂碑立唐楷典范；文中永兴抽刀断水自谓于道有悟
  era: 隋末唐初
  dates_known: true
- name_zh: 褚遂良
  score: 7
  worth_why: 雁塔圣教序立唐楷法门；废立武后叩血流面死谏；文中与永兴并推为得遒劲真髓者
  era: 初唐
  dates_known: true
- name_zh: 杨凝式
  score: 6
  worth_why: 韭花帖疏朗开宋人法门；乱世佯疯自保历五朝而全节；文中其乐志论为董其昌转益之阶
  era: 五代
  dates_known: true
- name_zh: 王铎
  score: 6
  worth_why: 一日临帖一日应请索终身不易，治学制度堪为范（本文明载）；终降清为贰臣，成败两面可为镜
  era: 明末清初
  dates_known: true
- name_zh: 文徵明
  score: 6
  worth_why: 屡试不第而不废笔墨，九十犹作蝇头小楷，勤学典范；文中董其昌独服其能画
  era: 明中期
  dates_known: true
