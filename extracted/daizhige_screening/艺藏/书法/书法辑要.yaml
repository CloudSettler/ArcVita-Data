candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 书圣；兰亭序为天下第一行书；乐毅论黄庭经一出遂为不赀之宝；兼真行草臻其极蔚为翰墨之冠；书圣养成完整可考
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 创颜体；大唐中兴颂多宝塔碑为童子习字万世法则；安史之乱抗贼与祭侄稿忠烈名场面；书如其人人书合一
  era: 唐
  dates_known: true
- name_zh: 钟繇
  score: 9
  worth_why: 正书之祖；贺捷表备尽法度；与胡昭同出刘德升之门而以瘦劲独显行书；锺王遗范为后世小楷之源
  era: 三国魏
  dates_known: true
- name_zh: 王献之
  score: 8
  worth_why: 小圣；行草杂糅神会之间其锋不可当；洛神赋十三行存古隶典型；与其父并称二王树立翰墨之极
  era: 东晋
  dates_known: true
- name_zh: 张芝
  score: 8
  worth_why: 草圣；临池学书池水尽墨；章草至伯英造其极；一笔书开今草先河
  era: 东汉
  dates_known: true
- name_zh: 欧阳询
  score: 8
  worth_why: 九成宫醴泉铭与虞恭公碑为中楷法定范本；易方为长以就姿媚；欧体结构法度成为千年习字标准
  era: 唐
  dates_known: true
- name_zh: 柳公权
  score: 8
  worth_why: 柳体；心正则笔正的谏言名场面；颜筋柳骨并称；偏旁清劲为习字第二阶梯
  era: 唐
  dates_known: true
- name_zh: 邓石如
  score: 8
  worth_why: 完白山人；能将南北合一手天下奇；篆隶入神妙开清代碑学先河；布衣书家以勤学成大家
  era: 清
  dates_known: true
- name_zh: 虞世南
  score: 7
  worth_why: 虞永兴；与欧阳询易方为长以就姿媚；孔子庙堂碑端严不刻温厚难犯；唐太宗之书法导师
  era: 唐
  dates_known: true
- name_zh: 蔡襄
  score: 7
  worth_why: 蔡君谟万安桥记闽中有刻；主持建造洛阳桥与书碑合一；宋四家中人品书品俱高
  era: 北宋
  dates_known: true
- name_zh: 史游
  score: 7
  worth_why: 急就章解散隶体纵任奔逸以赴急就；章草之诞生点；蒙学识字课本发明者
  era: 西汉
  dates_known: true
- name_zh: 徐渭
  score: 7
  worth_why: 笔道通言立学书次第先大后小先楷后行先章草后草圣；青藤书画自成一家；生平际遇足为后人教训
  era: 明
  dates_known: true
- name_zh: 褚遂良
  score: 7
  worth_why: 唐楷大家；雁塔圣教序秀逸多姿；谏立武后以笏叩阶血染殿廷的骨鲠名场面
  era: 唐
  dates_known: true
- name_zh: 文伯子
  score: 7
  worth_why: 民国二年宦游秦中与上官不合遂弃官；陕南设馆授教生徒数百使陕南文化为之一变；遗稿书法辑要为学书者指门径；弃官从教著书立说做事流完整
  era: 清末民初
  dates_known: true
- name_zh: 杜度
  score: 6
  worth_why: 建初中善草见称于章帝；上贵其迹诏使草书上事因章奏而得名章草；事迹简略故缓录
  era: 东汉
  dates_known: true
