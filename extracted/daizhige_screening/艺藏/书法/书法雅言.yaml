- name_zh: 项穆
  score: 8
  worth_why: 初名德枝两度易名；承父项元汴家学耳濡目染；日摹兰亭圣教一纸寒暑不辍；弃仕就艺自答墨卿优孟与艺争可必得；著书法雅言十七篇立书统正人心，静坐闻泥丸呼右军传为神会佳话
  era: 明代嘉靖至万历间
  dates_known: true
- name_zh: 王羲之
  score: 8
  worth_why: 书圣；兰亭雅集入木三分东床坦腹皆名场面；本篇尊为书统正鹄称兼乎钟张大统万世不易；然本篇仅尊之为宗主，须辅以晋书等外部史料补全做事流
  era: 东晋
  dates_known: true
- name_zh: 项元汴
  score: 6
  worth_why: 鉴藏书画甲于一时；墨林印记至今为论真迹者之判据；然传文简略无完整做事周期
  era: 明代嘉靖至万历间
  dates_known: true
