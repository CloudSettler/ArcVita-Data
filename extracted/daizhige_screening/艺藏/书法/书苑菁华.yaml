  why_not: 仅藏蔡邕笔法拒不与人、身殁墓遭盗一节，附属于钟繇事无独立做事周期
- name_zh: 宋翼
  why_not: 钟繇弟子被叱后湔心改迹、得笔势论而学名大振，轶事附见主体过小
- name_zh: 张旭
  why_not: 仅原序一笔带过称张颠草圣，本卷无其做事记载
- name_zh: 张芝
  why_not: 仅笔势论序中张伯英求见论稿一事，无做事流
- name_zh: 程邈
