source: 艺藏/书法/书苑菁华.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 书圣；本篇见其完整学书周期——少学卫夫人自谓大能、渡江北游名山遍观李斯曹喜钟繇梁鹄蔡邕石经遂改本师、五十三岁成书遗教子孙；题卫夫人笔阵图后以战阵喻书、意在笔前，笔势论十二章传子敬并秘之
  era: 东晋
  dates_known: true
- name_zh: 钟繇
  score: 9
  worth_why: 楷书之祖；抱犊山学书三年，见蔡邕笔法于韦诞坐上捶胸三日呕血、诞死阴令人盗开其墓遂得之；精思学书三十年，卧画被穿过表；用笔者天也流美者地也；临终授笔法于子
  era: 汉末三国魏
  dates_known: true
- name_zh: 蔡邕
  score: 9
  worth_why: 入嵩山石室得八角垂芒素书、不食三日读诵三年妙达其理；自书五经于太学观者如市（熹平石经之源）；作笔论立书者散也、先散怀抱任情恣性之说，为论书先声
  era: 东汉
  dates_known: true
- name_zh: 卫夫人
  score: 7
  worth_why: 传笔阵图：多骨微肉谓之筋书、多肉微骨谓之墨猪；七条笔阵如千里阵云高峰坠石万岁枯藤；执笔用笔墨纸砚之法井然；为王羲之启蒙之师；惟四库疑篇为唐宋人伪作
  era: 东晋
  dates_known: true
- name_zh: 陈思
  score: 6
  worth_why: 临安书商裒录汉魏以逮唐人论书绪言为一编二十卷凡百六十余篇，编排以资考订，开辑书论之始，佩文斋书画谱多采用之；大辂椎轮造始之功
  era: 南宋
  dates_known: true
rejections:
