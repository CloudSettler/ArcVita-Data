category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；兰亭雅集一挥而就成天下第一行书；东床坦腹、入木三分、写经换鹅诸典故；由师卫夫人到变古开新的做事流完整可考
  era: 东晋
  dates_known: true
- name_zh: 谢安
  score: 9
  worth_why: 东山再起至淝水之战围棋赌墅谈笑退秦；执政保江南；书列晋世名家谱系之首
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 变古法创颜体；安史之乱孤守平原、祭侄文稿沉痛彻骨；晚年单骑宣抚叛镇殉节，书艺与气节并举
  era: 唐
  dates_known: true
- name_zh: 张旭
  score: 8
  worth_why: 草圣；观公孙大娘剑器舞与担夫争道而悟笔法；醉后呼叫狂走以头濡墨，颠草名场面
  era: 唐
  dates_known: true
- name_zh: 怀素
  score: 8
  worth_why: 家贫种蕉万株以叶代纸；观夏云奇峰悟笔意；自叙帖名动公卿，贫僧成圣的完整奋斗流
  era: 唐
  dates_known: true
- name_zh: 柳公权
  score: 8
  worth_why: 笔谏名场面——心正则笔正，穆宗改容；柳骨千年为楷范
  era: 唐
  dates_known: true
- name_zh: 欧阳询
  score: 7
  worth_why: 观索靖古碑三日乃去终成欧体楷法极则；历仕三朝由南入北
  era: 隋末唐初
  dates_known: true
- name_zh: 褚遂良
  score: 7
  worth_why: 谏立武后举笏叩头流血而贬死；书承二王成初唐大家
  era: 唐
  dates_known: true
- name_zh: 贺知章
  score: 7
  worth_why: 金龟换酒识李白于未达；八十六岁乞归鉴湖，回乡偶书传诵千古
  era: 唐
  dates_known: true
- name_zh: 孙过庭
  score: 7
  worth_why: 穷愁著书谱，理论与实践双绝；其论违而不犯和而不同影响千年，中岁而殁可为叹惜
  era: 唐
  dates_known: true
- name_zh: 米芾
  score: 8
  worth_why: 集古字终自成一格；米颠拜石真性不减；书画鉴藏开一代风气，本书多处引其论
  era: 北宋
  dates_known: true
- name_zh: 黄庭坚
  score: 8
  worth_why: 贬涪州黔州而书诗愈进；观船夫荡桨悟笔法；开创江西诗派，逆境成全的样板
  era: 北宋
  dates_known: true
- name_zh: 赵孟頫
  score: 8
  worth_why: 力追晋人复归古法，赵体日书万字风行数百年；以宋宗室仕元，荣谤并存足为镜鉴
  era: 元
  dates_known: true
- name_zh: 文徵明
  score: 8
  worth_why: 屡试不第而大器晚成，勤学一生寿逾九十书画日进；吴门领袖，勤补拙之典范
  era: 明
  dates_known: true
- name_zh: 丰坊
  score: 7
  worth_why: 本书作者；筑万卷楼藏书极富；遭贬后发愤著书诀立笔法诸论，晚年病狂藏书散尽，成毁皆可为鉴
  era: 明
  dates_known: true
