- name_zh: 孙过庭
  score: 9
  worth_why: 志学之年留心翰墨、时逾二纪而成书谱；五乖五合、平正—险绝—复归平正、人书俱老诸论为千年操翰者指南
  era: 初唐武后时
  dates_known: true
- name_zh: 王羲之
  score: 10
  worth_why: 书圣；专博兼通压倒钟张；兰亭集序为行书绝致；末年思虑通审、不激不厉而风规自远
  era: 东晋
  dates_known: true
- name_zh: 王献之
  score: 8
  worth_why: 与父并称二王；自称胜父、拭除父书之轶事足为恃才之诫
  era: 东晋
  dates_known: true
- name_zh: 钟繇
  score: 8
  worth_why: 专工隶书以致绝伦、楷则之祖；为右军所宗之宗匠
  era: 汉末曹魏
  dates_known: true
- name_zh: 张芝
  score: 8
  worth_why: 草圣；临池学书池水尽墨、专精一体之典范
  era: 东汉
  dates_known: true
- name_zh: 谢安
  score: 9
  worth_why: 淝水之战定东晋存亡、东山再起之典范；文中见其鉴裁子敬书之识度
  era: 东晋
  dates_known: true
