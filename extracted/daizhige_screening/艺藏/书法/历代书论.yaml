category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 许慎
  score: 9
  worth_why: 潜心二十余年著成说文解字，首创五百四十部首编排与六书理论，建光元年遣子献书；五经无双许叔重，文字学开山之作，做事流完整
  era: 东汉
  dates_known: true
- name_zh: 蔡邕
  score: 9
  worth_why: 主持熹平石经正定六经文字；笔论九势为书论奠基；焦尾琴传世；因董卓之死叹息获罪下狱，一生缘起、转折、结局俱全
  era: 东汉末
  dates_known: true
- name_zh: 崔瑗
  score: 7
  worth_why: 草书势为现存最早书法理论文章，首肯草书之美；另著座右铭垂范后世；早年为兄报仇亡命遇赦，后仕至济北相
  era: 东汉
  dates_known: true
- name_zh: 卫恒
  score: 7
  worth_why: 四体书势系统梳理古文篆隶草四体源流，集前人书论而成体系；出身书法世家，死于贾后之变，与父卫瓘同遇害，结局可考
  era: 西晋
  dates_known: true
- name_zh: 张芝
  score: 7
  worth_why: 草圣，临池学书池水尽墨；删省点画创立今草；不慕官爵，专精书艺至忘寝食，为后世草书范式
  era: 东汉末
  dates_known: true
- name_zh: 赵壹
  score: 6
  worth_why: 非草书为最早的书法批评名文，直斥草书热潮背经趋俗；刺世疾邪赋直刺时弊；但生平仅光和年间上计闻名等数事，做事周期稍简
  era: 东汉末
  dates_known: true
