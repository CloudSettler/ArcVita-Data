category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 李廷珪
  score: 9
  worth_why: 唐末随父自易水渡江，睹歙中多美松而定居制墨，缘起清晰；墨坚如玉、纹如犀，能削木、误坠沟中数月不坏，蔡襄评为天下第一品；南唐主宠其能赐姓李氏；入宋后犹为太祖赐赵普之物、官藏车载以建相国寺门楼——匠人以一技立传成品牌的完整做事流
  era: 唐末五代南唐
  dates_known: true
- name_zh: 韦诞
  score: 8
  worth_why: 以能书自武都太守留补侍中，洛阳许邺三都宫观题署以为永制；上疏直言御笔墨不堪用，自创合墨法，一点如漆；欲善其事必利其器的践行者；嘉平三年卒年七十五，首尾完整且墨法存于齐民要术
  era: 汉末三国魏
  dates_known: true
- name_zh: 李阳冰
  score: 7
  worth_why: 初师李斯峄山碑，后见仲尼书吴季札墓志而变化开阖，自言斯篆之后直至小生，时称笔虎；其供御巨铤墨至宋犹存，米芾于相国寺亲见、后又亲得之，艺术突破点与实物见证俱备
  era: 唐
  dates_known: true
- name_zh: 张永
  score: 7
  worth_why: 善隶书有巧思，纸墨皆自营造，文帝每得永表启执玩咨嗟自叹供御者不及；诏其更制御纸紧洁光丽耀日夺目，合秘墨美殊前后色如点漆一点竟纸；自将作到奉诏改制，做事流完整且有实物级成果
  era: 南朝宋
  dates_known: true
- name_zh: 陆友
  score: 6
  worth_why: 生于市廛布商之家而独能攻苦向学，善歌诗工八分隶楷博极群物；柯九思虞集服其精识相与荐于文宗，未及任用而二公去职，遂南归自号砚北生，著砚史墨史印史；考辨奚李两族居易歙之分，正千年讹传，考据即名场面
  era: 元
  dates_known: true
- name_zh: 李超
  score: 6
  worth_why: 唐末流离渡江观歙中可居遂造墨成名，为廷珪之业发端；其墨细裁如筯，磨处边际有刃可以裁纸；宜附于李廷珪条目一并录入
  era: 唐末
  dates_known: true
- name_zh: 贾思勰
  score: 6
  worth_why: 齐民要术存韦仲将笔方合墨法，为古墨工艺传世之关键载体；本篇仅一笔带过，若录当以齐民要术另立全案
  era: 北魏
  dates_known: true
- name_zh: 祖敏
  score: 5
  worth_why: 唐之墨官，易水为上、以鹿角胶煎膏和之的祖氏之名闻于天下，为易水奚李张陈制墨之盛的源头；事迹简略宜缓录
  era: 唐
  dates_known: false
