- name_zh: 赵孟坚
  why_not: 仅学唐不如学晋一条评语
- name_zh: 智永
  why_not: 仅砚成臼一语，事迹过于简略
- name_zh: 智果
  why_not: 仅心成颂数句与僧气之讥，无做事流
- name_zh: 丁道护
  why_not: 仅一碑评语，无生平可录
- name_zh: 程邈
  why_not: 仅一句能变书体，无事迹细节
- name_zh: 薄绍之
  why_not: 仅数语评点，无可考做事周期
- name_zh: 李阳冰
  why_not: 仅一句刻石之评，事迹不详
- name_zh: 张怀瓘
  why_not: 仅书论条目引文，传文无做事周期
