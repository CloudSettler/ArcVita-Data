source: 艺藏/书法/墨池琐录.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；兰亭集序为天下第一行书；东床快婿、入木三分之名场面；晚年称病去官、纵情山水，做事流完整
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 祭侄文稿天下第二行书、创颜体一变书风；安史之乱独守平原、骂李希烈殉国，忠烈与书艺两条线互证
  era: 唐
  dates_known: true
- name_zh: 杨慎
  score: 8
  worth_why: 本书作者；议大礼撼门哭谏、两遭廷杖、谪戍滇南三十余年；著述四百余种为明代之冠；滚滚长江东逝水传唱至今，失意而治学之模范
  era: 明
  dates_known: true
- name_zh: 赵孟頫
  score: 8
  worth_why: 本录誉为直以晋人为师、一洗颜柳之病，右军后一人；宋宗室出仕元廷的关键抉择与身后毁誉，正反教训兼具
  era: 元
  dates_known: true
- name_zh: 张旭
  score: 7
  worth_why: 草圣张颠；孤蓬自振、惊砂坐飞悟笔法；以头濡墨、观公孙大娘舞剑器而书技大进，狂草名场面迭出
  era: 盛唐
  dates_known: true
- name_zh: 怀素
  score: 7
  worth_why: 观夏云奇峰而悟笔法、与颜真卿论屋漏痕之对话即本录名场面；绿天庵种蕉代纸；自叙帖为狂草之巅
  era: 唐
  dates_known: true
- name_zh: 米芾
  score: 7
  worth_why: 集古字终成一家、米颠拜石；刷字对答御前；本书评其行不逮言，成败两面俱全
  era: 北宋
  dates_known: true
- name_zh: 钟繇
  score: 7
  worth_why: 楷书之祖、由隶入楷的关键推动者；本录誉其幽深无际、古雅有馀；求笔法捶胸呕血之轶事兼为执念之鉴
  era: 汉末曹魏
  dates_known: true
- name_zh: 欧阳询
  score: 7
  worth_why: 楷法极则；本录楷道三昧三帖中独占化度、九成其二；观索靖碑三日三夜方悟，见贤思齐之范
  era: 唐初
  dates_known: true
- name_zh: 柳公权
  score: 7
  worth_why: 心正则笔正以笔为谏之名场面；颜筋柳骨并称千古；本书贬玄秘塔为恶札，正反视角并存
  era: 晚唐
  dates_known: true
- name_zh: 黄庭坚
  score: 6
  worth_why: 心能转腕、手能转笔诸论为本录所称三昧；观长年荡桨而笔法大进；江西诗派宗主、宋四家之一
  era: 北宋
  dates_known: true
- name_zh: 褚遂良
  score: 6
  worth_why: 雁塔圣教序、初唐四家；还笏叩额死谏立武后之场面；本录评其得王之肉、书之凤皇
  era: 唐
  dates_known: true
- name_zh: 王献之
  score: 6
  worth_why: 创破体书、劝父改体；鸭头丸帖、十八缸水苦学传说，少年成名与父竞秀的完整弧线
  era: 东晋
  dates_known: true
rejections:
