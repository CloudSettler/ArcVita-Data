source: 艺藏/书法/墨池璅录.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 书圣立极；兰亭雅集一觞一咏成天下第一行书；入木三分、以书换鹅、临池学书；文中奉为晋韵之源、右军之极，后世学书绕不开的坐标
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 10
  worth_why: 颜体开宗一变古法；祭侄文稿为天下第二行书；安史之乱首举义兵、终骂贼死节；文中载与怀素论屋漏痕悟笔法名场面，且历代抑颜扬颜之争集中于其身
  era: 唐
  dates_known: true
- name_zh: 苏轼
  score: 9
  worth_why: 乌台诗案后黄州翻身为逆境成事典范；文中载卧笔之评、以色论书之喻、书似西台差少肉诸语，可与全人事功对读
  era: 北宋
  dates_known: true
- name_zh: 杨慎
  score: 9
  worth_why: 状元议大礼遭廷杖谪滇三十余年，著述四百余种冠绝明代；谪戍醉傅胡粉游行成市、酒间乞书醉墨淋漓，即本文作者与底本本事
  era: 明
  dates_known: true
- name_zh: 米芾
  score: 8
  worth_why: 集古字终成一家，刷字如快剑斫阵、强弩射札八面出锋；米颠举止奇逸；文中又载其抑颜柳扬晋之激论
  era: 北宋
  dates_known: true
- name_zh: 赵孟頫
  score: 8
  worth_why: 文中推为右军之后一人，复古直追晋人一洗颜柳之病；日书万字深究六书；以宋宗室仕元之气节之讥足为后人镜鉴
  era: 元
  dates_known: true
- name_zh: 张旭
  score: 8
  worth_why: 草圣；孤蓬自振惊砂坐飞之笔诀，观剑器、闻鼓吹、见担夫争道皆悟笔法；大醉呼号狂走而后落笔
  era: 唐
  dates_known: true
- name_zh: 怀素
  score: 8
  worth_why: 狂草继张旭而起；自道观夏云奇峰、屋漏雨痕、惊蛇入草、坼壁之路一一自然；种蕉代纸秃笔成冢之勤学
  era: 唐
  dates_known: true
- name_zh: 黄庭坚
  score: 8
  worth_why: 心能转腕手能转笔之论；观长年荡桨群丁拔棹悟笔法，屡遭贬谪而书愈老辣；江西诗派开山
  era: 北宋
  dates_known: true
- name_zh: 王献之
  score: 7
  worth_why: 劝父改体别创破体一笔书；文中惜其绾秋蛇为文皇所笑，毁誉并存可与乃父对读
  era: 东晋
  dates_known: true
- name_zh: 欧阳询
  score: 7
  worth_why: 体方而笔圆之评得欧书幽微；化度、九成、庙堂入楷则三选；观索靖碑坐卧三日乃去之勤
  era: 唐
  dates_known: true
- name_zh: 柳公权
  score: 7
  worth_why: 心正则笔正以笔谏君之名场面；文中虽载恶札之讥，而阴符经序犹推柳书第一，毁誉互见
  era: 唐
  dates_known: true
- name_zh: 钟繇
  score: 7
  worth_why: 秦汉以来一人；由隶入楷变古开新为楷书之祖；画间异趣幽深无际
  era: 汉末魏初
  dates_known: true
- name_zh: 张芝
  score: 7
  worth_why: 今草之祖；临池学书池水尽墨，文中所谓能尽书势者学之积也
  era: 东汉
  dates_known: true
- name_zh: 卫夫人
  score: 7
  worth_why: 书圣之师；意在笔前者胜、多力丰筋者胜之论开笔法之学
  era: 东晋
  dates_known: true
