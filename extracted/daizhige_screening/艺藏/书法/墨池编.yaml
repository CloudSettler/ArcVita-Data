source: 艺藏/书法/墨池编.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 许慎
  score: 10
  worth_why: 师事贾逵博访通人，著《说文解字》十四篇，首创五百四十部首分别部居不相杂用，集六书理论大成，安帝建光年间奏上，为字学之祖，做事周期完整且名场面充沛
  era: 东汉
  dates_known: true
- name_zh: 徐铉
  score: 8
  worth_why: 由南唐入宋奉诏校定《说文》成大徐本，补漏落附新字定孙愐音切，务援古以证今，兼工小篆，其校定说文表赖墨池编收录得传
  era: 五代末至北宋初
  dates_known: true
- name_zh: 江式
  score: 8
  worth_why: 世传籀篆之学，上论书表综述文字源流自仓颉至当世，请撰集字书以正俗讹，为北魏文字学总纲之作，此表全赖墨池编得传（篇题误题晋，表内自言皇魏）
  era: 北魏
  dates_known: true
- name_zh: 蔡邕
  score: 7
  worth_why: 采李斯曹喜之法为古今杂形，奏于太学立石碑刊载五经即熹平石经，开经籍刻石之端，鸿都门献篆无出其右
  era: 东汉末
  dates_known: true
- name_zh: 程邈
  score: 7
  worth_why: 得罪系云阳狱，增减大篆去其繁复创隶书，始皇善之出为御史，狱吏改字成书体革命，隶书得名定型的关键人物，微型做事流完整
  era: 秦
  dates_known: true
- name_zh: 李阳冰
  score: 7
  worth_why: 唐大历间篆迹殊绝独冠古今，自谓斯翁之后直至小生，刊定说文修正笔法使篆学中兴，虽排斥许氏自为臆说受讥，成败两面皆可为镜
  era: 唐
  dates_known: true
- name_zh: 朱长文
  score: 7
  worth_why: 撰墨池编分字学笔法杂议品藻等八门搜辑甚博，前代遗文如徐铉江式之表赖以得传，后世书苑菁华不能出其范围，编书之事有缘起阶段与结果
  era: 北宋
  dates_known: true
rejections:
- name_zh: 苍颉
  why_not: 传说时代人物，无信史年代与可考做事流，仅作文字起源符号使用
- name_zh: 贾逵
  why_not: 仅奉诏修理旧文与为许慎师二语，无完整做事周期
- name_zh: 扬雄
  why_not: 本篇仅一句提及采通人之说作训纂篇，事迹简略宜缓，其行事当别据汉书录入
- name_zh: 徐锴
  why_not: 仅以徐锴曰注语散见各条，本人行事无载
- name_zh: 张揖
  why_not: 仅列著埤仓广雅古今字诂名目，无做事流
- name_zh: 吕忱
  why_not: 仅表上字林五卷一句，事迹简略
- name_zh: 曹喜
  why_not: 仅号工篆一句评语，无做事周期
- name_zh: 韦诞
  why_not: 仅台观榜题宝器之铭数语，无完整周期
- name_zh: 卫觊
  why_not: 仅与韦诞并号能篆一句
- name_zh: 邯郸淳
  why_not: 仅三字石经数语且石经归属学界存疑
- name_zh: 甄丰
  why_not: 仅新莽时校定古文一语，附庸事件无独立做事
- name_zh: 胡毋敬
  why_not: 仅作博学篇一句
- name_zh: 左丘明
  why_not: 仅述春秋传皆以古文一句，作文字载体旁证
