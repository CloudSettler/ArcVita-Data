candidates:
- name_zh: 沈继孙
  score: 8
  worth_why: 初试诸方愈多愈败，后受教三衢墨师悟出去药存胶烟之法，得墨黑光如小儿目睛；具礼谢师而守其戒不扬姓名；追忆师言又得僧墨诀，遂并录成《墨法集要》二十有一图，浸油至试墨叙次详核，为近代造墨家所祖；身历手试不妄撰，客称墨之实录，工匠实证精神与代表作俱全
  era: 明初（洪武年间）
  dates_known: true
rejections:
- name_zh: 倪瓒
  why_not: 仅引其赠沈生卖墨诗序数句，以衬托沈氏墨品，无自身做事周期
- name_zh: 李廷珪
  why_not: 仅数句述其始兼用桐油、宣和间黄金可得而李墨不可得，无做事流细节可考
- name_zh: 三衢墨师
  why_not: 无姓名里贯，仅授法拒礼一节，事迹不具可录入之周期
