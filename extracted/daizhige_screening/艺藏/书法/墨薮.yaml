candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；本文多处列其创龙爪书、工草书并录其笔势传；兰亭雅集成天下第一行书；入木三分、东床坦腹、写经换鹅皆名场面；由临池苦学至变古开新至称疾去郡，做事流完整
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 本文评其锋绝剑摧惊飞逸势；创颜体楷书开宗立派；祭侄文稿血泪名场面；安史乱中首举义旗抗叛；终殉节李希烈，书品人品合一之典范
  era: 盛唐
  dates_known: true
- name_zh: 蔡邕
  score: 8
  worth_why: 本文明载飞白书之诞生——待诏时见门下吏垩帚成字而悟；倡刻熹平石经正定六经文字；焦尾琴传世；终牵连董卓案死狱中，成与败皆可为鉴
  era: 东汉末
  dates_known: true
- name_zh: 张芝
  score: 8
  worth_why: 草圣；本文明载一笔书者张芝所制；临池学书池水尽墨；答人匆匆不暇草书，见其书道苦功与草法自觉
  era: 东汉
  dates_known: true
- name_zh: 张旭
  score: 8
  worth_why: 狂草开山；本文录其张长史十二意法；观公孙大娘剑器舞而悟笔法；以头濡墨醒后自视以为神；时称三绝之一
  era: 盛唐
  dates_known: true
- name_zh: 钟繇
  score: 8
  worth_why: 楷书之祖；本文记其谓章程书并变行隶；求蔡邕笔法至捶胸呕血终发韦诞墓得之；苦练木版尽穿，由隶入楷立千年法度
  era: 汉末魏初
  dates_known: true
- name_zh: 程邈
  score: 7
  worth_why: 本文明载于狱中变大篆为隶书，始皇嘉焉拜侍御史；徒隶之书因程邈幽囚得名；由囚徒成书体制度奠基人
  era: 秦
  dates_known: true
- name_zh: 欧阳询
  score: 7
  worth_why: 本文列其正行为中上品；九成宫醴泉铭为楷书极则；观索靖古碑三日不去；结构三十六法垂范后世
  era: 隋唐之际
  dates_known: true
- name_zh: 王献之
  score: 7
  worth_why: 小圣；本文列其行草飞白；劝父改体自创破体书；十八缸水勤学之传；一变古法与父并称二王
  era: 东晋
  dates_known: true
- name_zh: 卫夫人
  score: 7
  worth_why: 本文列其正行于上中品；王羲之启蒙业师；传笔阵图以兵法喻笔势；簪花小楷独步，师道传承之典范
  era: 东晋
  dates_known: true
- name_zh: 柳公权
  score: 7
  worth_why: 提要明载所记止于柳公权事；以心正则笔正笔谏君主成千古名场面；颜筋柳骨自立一家历三朝侍书
  era: 中晚唐
  dates_known: true
- name_zh: 智永
  score: 7
  worth_why: 居永欣寺阁三十年写真草千字文八百本散施诸寺；退笔成冢、铁门限两典皆恒心做事之注脚；王氏笔法传承枢纽
  era: 陈隋之际
  dates_known: true
- name_zh: 孙过庭
  score: 6
  worth_why: 本文评其丹崖绝壑笔势坚劲；书谱文论双绝成书学纲要；然仕途困顿中年而殁，事功半成足为惜
  era: 武周
  dates_known: true
- name_zh: 李阳冰
  score: 6
  worth_why: 本文评为李斯之后一人而已；玉箸篆复兴小篆古法；晚为李白编草堂集而序其诗
  era: 盛唐
  dates_known: true
