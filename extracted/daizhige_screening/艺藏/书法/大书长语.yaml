source: 艺藏/书法/大书长语.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；山谷学字廿年不出、竹叶树皮反覆书之的苦功；兰亭修禊名场面；入木三分开宗立派
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 端人正笔典范；颜体开宗；祭侄稿天下第二行书；断碑只字世以永存；终以身殉节
  era: 唐
  dates_known: true
- name_zh: 柳公权
  score: 8
  worth_why: 心正则笔正、借笔谏君的名场面；柳骨严正自成一家
  era: 唐
  dates_known: true
- name_zh: 韦诞
  score: 7
  worth_why: 凌云台先钉榜去地二十五丈、辘轳引上题竟鬓发顿白的险局；以能书留为侍中终光禄大夫
  era: 三国魏
  dates_known: true
- name_zh: 智永
  score: 7
  worth_why: 独处阁上临右军书三十余年；研成臼、笔成冢的勤学极致
  era: 陈隋之际
  dates_known: true
- name_zh: 锺繇
  score: 7
  worth_why: 初学胡昭书十六年不窥园；画被穿表、如厕竟日忘起；楷书之祖变通入神
  era: 汉末三国魏
  dates_known: true
- name_zh: 虞世南
  score: 7
  worth_why: 机巧由心悟不可力取之论；卧于被中书腹；由隋入唐的五绝名臣
  era: 隋末唐初
  dates_known: true
- name_zh: 费瀛
  score: 6
  worth_why: 本篇作者；以正心、识字、师授、结构诸篇成大书署书理论体系，为明代署书集大成
  era: 明嘉靖间
  dates_known: true
