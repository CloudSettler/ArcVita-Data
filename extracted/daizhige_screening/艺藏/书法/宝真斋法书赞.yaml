  why_not: 君主低优先，文中仅存火灾朱表祷告与祥符符瑞之作，澶渊之事未及，无完整做事流
- name_zh: 宋太宗赵匡义
  why_not: 仅见谢熊白状与新铸开封尹印之考证，属礼制掌故，非做事周期
- name_zh: 范质
  why_not: 仅见卧病不预御召一条考据，无事迹展开
- name_zh: 王溥
  why_not: 仅见浦溥二字互用之辨，无事迹
- name_zh: 魏仁溥
  why_not: 仅见独不召之疑议，无事迹
- name_zh: 米芾
  why_not: 仅见英光堂帖引文一条，无做事流
- name_zh: 欧阳修
