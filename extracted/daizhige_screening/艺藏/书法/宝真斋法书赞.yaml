candidates:
- name_zh: 岳飞
  score: 10
  worth_why: 精忠报国，四度北伐，郾城大捷，因十二道金牌班师，以莫须有冤死，孝宗朝平反；本书提要明言鄂国忠武王传家帖专录其手泽，做事流完整且成典范
  era: 南宋
  dates_known: true
- name_zh: 岳珂
  score: 8
  worth_why: 以家藏晋唐迄南宋墨迹编次作赞，考订人论世，又着九经三传例、桯史、金陀粹编为祖辩诬；由兵燹散佚到裒辑成书，缘起、阶段、结果俱可考
  era: 南宋
  dates_known: true
- name_zh: 唐太宗
  score: 8
  worth_why: 贞观之治、虚心纳谏、玄武门定鼎，属君主中突出做事者；卷首枇杷帖、处分手札恰可作其武功之外文治侧影的时间坐标
  era: 唐初
  dates_known: true
rejections:
