source: 艺藏/书法/宝章待访录.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 书圣；兰亭雅集与兰亭序传世；文中载山阴道士以群鹅乞书黄庭经之换鹅本事，及雪晴帖、来戏帖、官奴帖、稚恭进镇帖等真迹天下竞访；入木三分东床快婿诸名场面俱全
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 10
  worth_why: 文中争坐位帖评世之颜行第一书、乞米帖十余阅、祭叔濠州使君文改抹见性情；史实安史之乱独守平原号召诸郡、晚年赴李希烈之难骂贼死节；忠烈与书品双典范
  era: 中唐
  dates_known: true
- name_zh: 米芾
  score: 8
  worth_why: 本文献作者，元祐丙寅自述缘起——惧闻见久废而编目以俟访图书使；一生访帖鉴定临古，刷字自成一家为宋四家之一；米颠拜石亦是名场面
  era: 北宋
  dates_known: true
- name_zh: 谢安
  score: 8
  worth_why: 文中慰问帖评其字清古在二王之上；史实东山再起、淝水之战围棋赌墅破前秦大军、功高遭忌而善保家门；名相与书家合一
  era: 东晋
  dates_known: true
- name_zh: 褚遂良
  score: 8
  worth_why: 文中载其枯木赋拓本；史实受太宗托孤，还笏叩阶力谏立武后，贬死爱州；骨鲠之臣的典范与悲剧
  era: 唐初
  dates_known: true
- name_zh: 智永
  score: 7
  worth_why: 文中千文三见、归田赋真迹流传；史实居永欣寺阁三十年书千字文八百本分施诸寺，退笔成冢户限为穿遂有铁门限；极致专注的做事样本
  era: 陈隋之际
  dates_known: false
- name_zh: 张旭
  score: 7
  worth_why: 文中详记陆氏四帖访求始末，寻石本追讨被沈文通拆留之帖历二十余年；史实狂草之圣，醉后呼叫狂走以头濡墨，脱帽露顶王公前
  era: 盛唐
  dates_known: false
- name_zh: 怀素
  score: 7
  worth_why: 文中任华草书歌称字法清逸歌辞奇伟、祝融高座帖称此字入神；史实家贫种蕉万株以叶代纸、弃笔成冢，与张旭并称颠张醉素
  era: 中唐
  dates_known: true
- name_zh: 欧阳询
  score: 7
  worth_why: 文中道林寺牌评笔力险劲勾勒而成、另有凿池帖与荀氏汉书节；史实楷书极则九成宫醴泉铭，途见索靖碑坐卧其下三日不去，学书专注典范
  era: 隋唐之际
  dates_known: true
- name_zh: 虞世南
  score: 7
  worth_why: 文中枕卧帖积时帖皆唐摹珍本、载越州寺梁栋藏帖故事；史实唐太宗称其五绝，德行忠直博学文词书翰，直谏之臣兼初唐楷法宗师
  era: 陈隋入唐
  dates_known: true
- name_zh: 桓温
  score: 7
  worth_why: 文中晋人十四帖列有其帖；史实平成汉、三次北伐收复洛阳，晚年废立而未篡身死；木犹如此之叹与流芳遗臭之问是权臣教训
  era: 东晋
  dates_known: true
