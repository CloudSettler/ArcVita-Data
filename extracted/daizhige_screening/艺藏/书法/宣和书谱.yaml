category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 唐太宗李世民
  score: 9
  worth_why: 起太原入长安取天下如运诸掌；贞观之治比迹汤武；以书师虞世南、患戈脚不工而魏征一语点破，置弘文馆选子弟斆学，作笔法指意笔意三说，以临阵料敌之法喻学书，做事与治学两流俱备
  era: 隋末唐初
  dates_known: true
- name_zh: 武则天
  score: 8
  worth_why: 不出重闱而驾驭英雄、人人各为其用，遂移唐祚建周，终为张柬之等复辟，盛衰全程足为训；自我作古造则天文字十九字行于一世；从王方庆家藏二十八人书迹摹拓把玩而笔力益进，功过与书艺两条线皆有名场面
  era: 唐代武周
  dates_known: true
- name_zh: 周世宗柴荣
  score: 8
  worth_why: 高平摧阵挫勍敌、还秦凤之封开疆、江北燕南取之如拾芥，神武之略氤氲发于笔端；在位六年革弊布新，为北宋一统奠基，惜中道而殂，创业未半之典型
  era: 五代后周
  dates_known: true
- name_zh: 唐明皇李隆基
  score: 7
  worth_why: 开元盛世至安史之乱乃盛衰总转折，教训极深；见翰苑书体狃于世习而锐意章草八分摆脱旧学，封禅碑板风骨巨丽，思如泉吐凤笔为海吞鲸
  era: 盛唐
  dates_known: true
- name_zh: 唐肃宗李亨
  score: 7
  worth_why: 以天下元帅提孤军抗衡渔阳卷地之众，日消月化终使海岳一清再造唐室；善将将，御郭子仪李光弼中兴第一之豪杰；遣韦见素迎上皇还京，尽人子之道，弧线完整
  era: 盛唐
  dates_known: true
- name_zh: 晋武帝司马炎
  score: 6
  worth_why: 三世执魏柄至神器始归，用王浚唾手灭吴一统天下；然信贾充之言、舍卫瓘之忠，以忧勤得之以佚乐弃之，遂启两晋东西分裂，教训大于功业
  era: 西晋
  dates_known: true
- name_zh: 朱温
  score: 5
  worth_why: 黄巢馀党乘不利之际初云归顺终乃攘夺，盗窃神器反引白乌白兔为符命，权臣篡逆之教训样本；做事流完整然全为反面
  era: 唐末五代
  dates_known: true
rejections:
- name_zh: 唐代宗李豫
  why_not: 传文仅言守太宗家学、行书益工，无做事周期
- name_zh: 唐德宗李适
  why_not: 传文仅批答章奏、陆贽辅赞一笔带过，事迹简略
- name_zh: 唐宣宗李忱
  why_not: 精于听断而伤于太察，传文无完整做事流，大中之治需他史补证
- name_zh: 唐昭宗李晔
  why_not: 有志兴复而无其成，仅衣襟书笼络钱镠一事，余皆书艺
- name_zh: 梁末帝朱瑱
  why_not: 无他伎仅弄翰墨批勑，国亡身死，无做事流
- name_zh: 萧遘
  why_not: 八叶宰相世系官爵罗列，负大节而无具体行事，仅存二帖
- name_zh: 陆扆
  why_not: 传文残缺，仅存姓名籍贯，无从考做事流
