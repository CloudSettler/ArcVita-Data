verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；本篇奉为极则，云行草必王右军、逸少韵度得其遒迈；兰亭雅集、入木三分、以书换鹅，做事流与名场面俱全
  era: 东晋
  dates_known: true
- name_zh: 钟繇
  score: 8
  worth_why: 本篇云古隶必锺太尉、元常骨力去古未远不失根原；楷书开山，精思学书三十载捶胸呕血求笔法，苦学典范
  era: 汉末三国
  dates_known: true
- name_zh: 欧阳询
  score: 8
  worth_why: 本篇推其得一字法、妙在结构；观索靖碑三日不去，九成宫醴泉铭垂为楷则，勤学与代表作俱佳
  era: 隋唐之际
  dates_known: true
- name_zh: 虞世南
  score: 7
  worth_why: 本篇许其结在肺腑、虞得一笔法，与欧阳询对举；唐太宗称德行忠直博学文词书翰五绝，德艺双修
  era: 隋唐之际
  dates_known: true
- name_zh: 智永
  score: 7
  worth_why: 本篇评其得其圆而体俗；退笔成冢、铁门限、真草千字文八百本散施浙东诸寺，勤学名场面
  era: 陈隋之际
  dates_known: true
- name_zh: 米芾
  score: 7
  worth_why: 本篇以米襄阳与李北海并举因药成病之弊；刷字自成一格，颠名满天下，书画鉴藏全才，得失皆可鉴
  era: 北宋
  dates_known: true
- name_zh: 赵宧光
  score: 7
  worth_why: 本篇作者；著说文长笺遭小学家讥评穿凿，而篆法自见偏长，复成寒山帚谈为书论要籍，由见讥到立言可鉴
  era: 明末
  dates_known: true
- name_zh: 李阳冰
  score: 6
  worth_why: 本篇评阳冰伯琦各自名家惜其骨俗，而去古近可取；玉箸篆中兴篆学，又为李白族叔刊定遗稿
  era: 盛唐
  dates_known: true
- name_zh: 赵孟頫
  score: 6
  worth_why: 本篇评其得其活而骨柔；托古改制开有元一代书风五体皆能，荣与贬并存，教训价值高
  era: 元
  dates_known: true
- name_zh: 李邕
  score: 6
  worth_why: 本篇与米芾并举求正反成病之例；行书入碑首创者，北海如象，文名书名并盛而终罹李林甫之祸
  era: 盛唐
  dates_known: true
rejections:
