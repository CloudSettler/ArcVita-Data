source: 艺藏/书法/广艺舟双楫.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 康有为
  score: 9
  worth_why: 叙目自述完整成书周期：戊己之际旅京忧时，友人以庄生寓言点拨，遂捐弃故我、摊碑摛书；戊子腊月购碑千种于宣武城南南海馆汗漫舫，己丑腊月归西樵山詹如楼，十七日至除夕成二十七篇。尊碑卑唐，集清代碑学之大成，为书学史上名场面；书外更有公车上书、戊戌变法之完整做事流，其兴其败皆可为后人镜鉴
  era: 清末（光绪十四年至十五年间成书）
  dates_known: true
rejections:
- name_zh: 王羲之
  why_not: 全书仅作书风渊源与品评对象，无独立做事周期叙述
- name_zh: 卫夫人
  why_not: 传卫篇仅叙卫氏书学承传源流，系家学谱系而非做事流
- name_zh: 包世臣
  why_not: 叙目仅一句提及泾县包氏扬碑之功，本书内无其事迹过程
- name_zh: 邓石如
  why_not: 仅见于碑品、碑评之品第排名，无做事周期
- name_zh: 郑道昭
  why_not: 备魏等篇例举碑版以资论证，无事迹叙述
- name_zh: 仓颉
  why_not: 原书篇借为文字起于象形之证，传说人物年代不可考
