candidates:
- name_zh: 赵构
  score: 8
  worth_why: 五十年不离笔墨自成一家的书家皇帝；访求法书、鉴定真赝、评书立论，留《翰墨志》一部完整做事流；亦可为舍本营末的教训（偏安耽艺不修武备）
  era: 南宋
  dates_known: true
- name_zh: 米芾
  score: 7
  worth_why: 行草入能品、沉着痛快如乘骏马；洁癖择婿（段拂字去尘遂以女妻之）名场面；其得失可为学书者师古莫效外貌之教训
  era: 北宋
  dates_known: true
- name_zh: 智永
  score: 6
  worth_why: 居永欣寺阁三十年临真草千文八百本散浙东，护持家传《稧帖》终不与唐太宗，完整守成做事流
  era: 南朝至隋
  dates_known: true
- name_zh: 杨凝式
  score: 6
  worth_why: 五代乱世号杨风子、笔札豪放，历后唐汉周而能全其身，知与字法俱高，乱世全身可作范本
  era: 五代
  dates_known: true
