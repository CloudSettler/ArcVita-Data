skip_reason: 此卷为佚名《文笔式》，系唐代诗文作法专论（六志、八阶、属对、句例、论体等），全书为技法条目与示例诗，无任何人物传记内容；文中出现的曾子、伯鱼、虞姬等仅作示例诗句用典，无做事流、无关键决定、无生卒可考，不构成可录入的成事儿时间轴素材
rejections:
- name_zh: 佚名作者
  why_not: 《文笔式》作者佚名，传世仅存文论残篇，无生平传文，无做事周期可考
- name_zh: 曾子
  why_not: 仅见于示例诗「避席谈曾子」一句用典，无传文
- name_zh: 孔鲤
  why_not: 仅以「伯鱼」见于示例诗「趋庭诲伯鱼」用典，无传文
- name_zh: 虞姬
  why_not: 仅见于示例诗「宋腊何须说，虞姬未足谈」，无传文
- name_zh: 孔子
  why_not: 以「鲁司寇」为示例诗题涉及，且已在库，本文无新事迹
