candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 传称十五年中偏攻永字以其八法通一切；兰亭集序、入木三分、东床坦腹皆名场面，学书与人生做事流完整，书圣典范
  era: 东晋
  dates_known: true
- name_zh: 智永
  score: 8
  worth_why: 隋僧发永字八法指趋、承前启后之关键节点；写真草千字文八百本散施浙东诸寺，退笔成冢、铁门限为勤学做事流完整之典范
  era: 陈末至隋
  dates_known: true
- name_zh: 虞世南
  score: 8
  worth_why: 受智永亲授而下传八法，谱系存焉；孔子庙堂碑立唐楷典范；历仕三朝直谏不阿，太宗称德行忠直博学文词书翰五绝
  era: 隋末唐初
  dates_known: true
- name_zh: 钟繇
  score: 7
  worth_why: 楷书之祖，八法传授谱系源头之一，传笔法十二意与求得蔡邕笔论苦学之典；兼曹魏太傅政事流可考
  era: 汉末三国·曹魏
  dates_known: true
- name_zh: 张芝
  score: 7
  worth_why: 草圣，临池学书池水尽墨；省章草波磔而创今草一笔书，为千年草法之突破点
  era: 东汉末
  dates_known: true
- name_zh: 李阳冰
  score: 6
  worth_why: 篆书直承李斯，自许斯翁之后直至小生；传文引其言证八法传授有自；晚岁受李白所托编草堂集
  era: 唐
  dates_known: true
