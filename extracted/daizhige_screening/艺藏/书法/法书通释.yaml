  era: 元
  dates_known: true
- name_zh: 卫夫人
  score: 7
  worth_why: 王羲之启蒙之师，笔阵图传为书学要典；文中引其笔阵与高峰坠石点法；簪花小楷
  era: 东晋
  dates_known: true
- name_zh: 虞世南
  score: 7
