candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 兰亭修禊乘兴作书成天下第一行书；初学卫夫人、后遍师锺张中年变体自成一家；入木三分、东床快婿、写经换鹅诸典故诞生点；文中兰亭、黄庭、乐毅论诸法皆出右军
  era: 东晋
  dates_known: true
- name_zh: 颜真卿
  score: 9
  worth_why: 安史乱起独平原举义抗叛；祭侄文稿悲愤淋漓为天下第二行书；晚年使李希烈骂贼殉节；颜体楷法开宗立派
  era: 唐
  dates_known: true
- name_zh: 锺繇
  score: 8
  worth_why: 变隶为楷、楷法之祖；文中称其每画一波常三过折笔、宣示表为学书正脉；八法秘传谱系之首
  era: 三国魏
  dates_known: true
- name_zh: 张旭
  score: 8
  worth_why: 观公主担夫争道、见公孙大娘舞剑器而悟笔法，醉后呼叫以头濡墨；草圣、唐文三绝之一；文中偏拂法自张长史始
  era: 唐
  dates_known: false
- name_zh: 欧阳询
  score: 8
  worth_why: 欧体楷书立法度之极；观索靖古碑三日坐卧方去；八诀为文中八法重要旁证；由北入南集楷法大成
  era: 隋唐
  dates_known: true
- name_zh: 王献之
  score: 8
  worth_why: 劝父改体、创一笔书破体，与父并称二王；十八缸水勤学典故；文中挑趯之辨举兰亭事字殊字即出右军父子笔法
  era: 东晋
  dates_known: true
- name_zh: 米芾
  score: 7
  worth_why: 米颠拜石、刷字对答名场面；集古字终自成一家；无垂不缩口诀为文中引证
  era: 北宋
  dates_known: true
- name_zh: 智永
  score: 7
  worth_why: 八法传承枢纽，文中言二王之后传之永师；退笔成冢、铁门限典故；写真草千字文八百本散施浙东诸寺
  era: 南朝陈至隋
  dates_known: false
- name_zh: 张芝
  score: 7
  worth_why: 临池学书池水尽墨，草圣之始；文中与崔蔡锺并列为秘八法者；今草开山
  era: 东汉末
  dates_known: false
- name_zh: 蔡邕
  score: 7
  worth_why: 正定六经立熹平石经；创飞白书；焦尾琴典故；文中列为秘八法四家之一
  era: 东汉
  dates_known: true
- name_zh: 赵孟頫
  score: 7
