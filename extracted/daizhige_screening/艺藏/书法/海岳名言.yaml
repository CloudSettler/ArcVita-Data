source: 艺藏/书法/海岳名言.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 米芾
  score: 9
  worth_why: 学书做事流完整——壮岁被人讥为「集古字」，遍取诸家长处总而成之，既老始自成家，人不知以何为祖；又有梦受折纸书、书法大进之转折；召对徽宗品评本朝书家，「臣书刷字」为千古名场面；书论真知灼见（大字如小字、小字如大字，贵形不贵作，作入画、画入俗）可供后人取法；兼有自负癫狂、臆谤古人（斥柳公权为丑怪恶札之祖）之性格教训；年代可考
  era: 北宋
  dates_known: true
rejections:
- name_zh: 米友仁
  why_not: 仅载代父书碑能乱真、大隶题榜有古意、草书有意思数语，无完整做事周期，缓录待其专传
- name_zh: 柳公权
  why_not: 文中仅作批评对象，被斥为丑怪恶札之祖，无其本人做事流
- name_zh: 颜真卿
  why_not: 仅评其真书入俗品、使家僮刻字修改波撇致失真，非做事周期
- name_zh: 欧阳询
  why_not: 仅「道林之寺寒俭无精神」一评语
- name_zh: 徐浩
  why_not: 仅评其为吏楷、肥俗合时君所好，无做事流
- name_zh: 智永
  why_not: 仅临集千文八面具备、砚成臼乃能到右军两语，事迹过简
- name_zh: 苏轼
  why_not: 仅「画字」一评，无做事周期
- name_zh: 王安石
  why_not: 仅半山庄台藏杨凝式书一雅事，事迹简略
- name_zh: 杜甫
  why_not: 仅引其诗评薛稷书，非本传主体
- name_zh: 葛洪
  why_not: 仅「天台之观飞白为大字之冠」一评，且其人是否晋代葛洪亦存疑
