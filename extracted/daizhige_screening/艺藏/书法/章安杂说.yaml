candidates:
- name_zh: 赵之谦
  score: 8
  worth_why: 二十岁前学家庙碑五百字无所得、遍临古帖不得，见山谷大字真迹如有所悟、偶作大字笔势顿异，却未肯学山谷一字，学书做事流完整且有决断；留下拙野之辨、书家最高境古今二人（三岁稚子与绩学大儒）、求仙有内外功即内功读书外功画圈等可传名论；敢言二王传世皆唐人摹勒、千载万世莫敢出口之辨；太平军乱中客居章安、识江湜而随得随录成《章安杂说》，缘起明确；后世印证其为晚清书画印全才
  era: 晚清（道光至光绪）
  dates_known: true
