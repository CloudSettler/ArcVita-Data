candidates:
- name_zh: 卫夫人
  score: 8
  worth_why: 旧题卫夫人（卫铄）撰《笔阵图》，中国书法理论开山名篇；提出七条笔势名场面——横如千里阵云、点如高峰坠石、竖如万岁枯藤等；立执笔用笔法度（筋书墨猪之辨、善鉴者不写善写者不鉴、意前笔后者胜）；做事流完整——缘起（叹近代不师古、缘情弃道）、取材（删润李斯笔妙）、总七条笔阵、结果（贻诸子孙永为模范）；传为书圣王羲之之师，典型师范
    archetype
  era: 东晋（题记永和四年上虞制记，生卒约272-349可考）
  dates_known: true
rejections:
- name_zh: 蔡邕
  why_not: 传内仅记入鸿都观碣十旬不返一语，无做事周期；然其熹平石经、焦尾琴等事可另行取本传录入
- name_zh: 李斯
  why_not: 已在库；文中仅引其见周穆王书七日兴叹之典，无新做事内容
- name_zh: 周穆王
  why_not: 已在库；文中仅以其书迹为典故坐标，非做事主体
