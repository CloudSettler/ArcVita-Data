category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 姜夔
  score: 9
  worth_why: 布衣通才一生可考；上大乐议正颂台乐律虽议不合而罢，自度曲附旁谱传世为词乐孤本；暮年著续书谱二十则议论精到，为姜氏立言之名场面；不遇于时而以艺文立不朽，楷模与教训兼具
  era: 南宋
  dates_known: true
- name_zh: 颜真卿
  score: 8
  worth_why: 平原独抗安禄山合诸镇讨叛做事流完整；祭侄稿成天下第二行书；颜体为书史一变；拒李希烈殉国，忠烈与书艺两成典范
  era: 唐
  dates_known: true
- name_zh: 王羲之
  score: 8
  worth_why: 永和九年兰亭雅集成兰亭序为行书之冠；书圣地位奠定书法范式；誓墓辞官归隐收束完整；本谱奉为诸体源头
  era: 东晋
  dates_known: true
- name_zh: 黄庭坚
  score: 7
  worth_why: 江西诗派开宗；草书自谓得长沙三昧，姜谱明言书法至是又一变；贬谪中成诗书大家启后人
  era: 北宋
  dates_known: true
- name_zh: 米芾
  score: 7
  worth_why: 无垂不缩无往不收八字诀见于本谱引语；集古字终自成一家；颠名与艺并传有启发
  era: 北宋
  dates_known: true
- name_zh: 孙过庭
  score: 7
  worth_why: 书谱文书双绝，为姜夔此谱所续所本；执使转用之法垂范后世；然生平传世简略，做事流不甚完整
  era: 唐
  dates_known: true
- name_zh: 柳公权
  score: 6
  worth_why: 心正则笔正笔谏名场面；颜柳并称书史一变；然事迹以侍书为主做事周期单薄
  era: 唐
  dates_known: true
