category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 书圣；本篇援其墨法（著墨不过三分不得深浸）与纸法（纸刚用软笔、如锥画石印印泥）诸诀，悬针之法且溯源于兰亭年字；本人临池学书、兰亭雅集、诸帖传世，做事流完整
  era: 东晋
  dates_known: true
- name_zh: 陈绎曾
  score: 7
  worth_why: 闻法于汪延年所传金谿陆氏书法，惜其淆缪而校改条理，作目录成翰林要诀；首创以血、骨、筋、肉论笔法的体系，是书法技法理论的里程碑
  era: 元
  dates_known: true
- name_zh: 鲜于枢
  score: 7
  worth_why: 今代善悬腕书第一人，问法瞑目伸臂曰胆胆胆的名场面；元初书坛巨擘，与赵孟頫并称，草书名迹传世
  era: 元
  dates_known: true
- name_zh: 卫夫人
  score: 7
  worth_why: 书圣启蒙之师，真书去笔头一寸二分的执笔诀见引本篇；笔阵图传统与高峰坠石喻点诸说足以成轴，且为东晋书坛女性典范
  era: 东晋
  dates_known: true
- name_zh: 陆希声
  score: 6
  worth_why: 拨镫五字诀的定型与传人，释拨镫如足踏马镫浅则易动；唐末又官至相位，艺统与仕宦两线可考
  era: 唐末
  dates_known: true
- name_zh: 李煜
  score: 5
  worth_why: 于拨镫五字外增导送二字成七字诀；金错刀书与词坛成就使艺术线突出，然君主低优先且本篇所涉甚简
  era: 五代南唐
  dates_known: true
rejections:
