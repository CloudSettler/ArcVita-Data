category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 十二岁窃读父枕中蔡邕笔法，书遂大进，卫夫人泣曰此子必蔽吾书名；山谷临学钟张廿馀年，竹叶树皮山石板木不知数；誓墓称疾终身不仕；右军书成而汉魏西晋之风尽废，书圣之变
  era: 东晋
  dates_known: true
- name_zh: 钟繇
  score: 8
  worth_why: 师胡昭十六年不窥园；见蔡邕笔法于韦诞处苦求不与，痛恨呕血，诞死后令人发墓得法；铭石章程行狎三体皆世所推，真书绝世，秦汉以来一人
  era: 汉末曹魏
  dates_known: true
- name_zh: 张芝
  score: 8
  worth_why: 草圣；临池学书水为之黑，家之衣帛书而后染；省繁饰銛利加之奋逸，出意作今草，一笔书气脉通达
  era: 东汉
  dates_known: true
- name_zh: 蔡邕
  score: 8
  worth_why: 嵩山石室得素书读诵三年遂通笔理，得神人授九势；献帝时雠书东观奏正定经籍，八分书丹太学石经四十六碑，为今古不刊之典
  era: 东汉
  dates_known: true
- name_zh: 程邈
  score: 8
  worth_why: 得罪始皇幽系云阳狱，狱中覃思十年变易大小篆为隶书三千字奏之，由囚徒擢为御史；隶书之祖，趋时便宜
  era: 秦
  dates_known: true
- name_zh: 颜真卿
  score: 8
  worth_why: 列作者十三人；创颜体楷书面貌一新，安史之乱举兵抗贼、晚年骂贼死节，书艺与忠烈并峙可为模范
  era: 唐
  dates_known: true
- name_zh: 李阳冰
  score: 7
  worth_why: 生于中唐独蹈孔轨，潜心改作复兴小篆，评者谓过于秦斯；官至将作监
  era: 唐
  dates_known: true
- name_zh: 张旭
  score: 7
  worth_why: 列作者十三人；张颠狂草一变古法，观担夫争道而悟笔意，唐代三绝之一
  era: 唐
  dates_known: true
- name_zh: 郑枃
  score: 7
  worth_why: 愤古道浸邈、俗尚益乖，悠然独往自托著书；衍极五篇自仓颉迄元代析书法之变，宣抚使齐伯亨采而上之，作衍极堂以藏其书
  era: 元
  dates_known: true
- name_zh: 史籀
  score: 6
  worth_why: 周宣王柱下史，损益古文加之銛利钩杀，为大篆十五篇，篆隶之祖，以名显故谓之籀书
  era: 西周
  dates_known: true
- name_zh: 王次仲
  score: 6
  worth_why: 以古书方广少波势，饰隶为八分，增广隶书趋简便，八分之祖
  era: 秦
  dates_known: true
- name_zh: 蔡襄
  score: 6
  worth_why: 列作者十三人压轴；宋四家之一，楷法端劲可为宋世坐标
  era: 北宋
  dates_known: true
