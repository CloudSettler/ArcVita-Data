source: 艺藏/书法/述书赋.md
category: 艺藏/书法
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 10
  worth_why: 书圣；兰亭雅集成千古名篇；入木三分、东床快婿、写经换鹅；本赋即记蕺山题扇求售之事
  era: 东晋
  dates_known: true
- name_zh: 谢安
  score: 9
  worth_why: 东山再起；淝水之战围棋赌墅破前秦；化解桓温废立之危，江左名相风流
  era: 东晋
  dates_known: true
- name_zh: 王导
  score: 9
  worth_why: 衣冠南渡定江左基业；王与马共天下；时人比之江左夷吾
  era: 东晋
  dates_known: true
- name_zh: 陶侃
  score: 9
  worth_why: 寒门至都督八州；运甓惜阴、竹头木屑皆成语；平苏峻之乱再造王室
  era: 东晋
  dates_known: true
- name_zh: 桓温
  score: 9
  worth_why: 三次北伐收复关中洛阳；既不能流芳亦当遗臭之言；枋头之败终行废立——权臣兴亡完整周期
  era: 东晋
  dates_known: true
- name_zh: 嵇康
  score: 9
  worth_why: 广陵散从此绝矣的刑场名场面；与山巨源绝交书表明士人气节；打铁拒司马氏终致杀身
  era: 曹魏
  dates_known: true
- name_zh: 蔡邕
  score: 9
  worth_why: 熹平石经正定六经文字，观摹者车马填塞街巷；焦尾琴佳话；依违董卓终死狱中——才士依附权奸之诫
  era: 东汉
  dates_known: true
- name_zh: 房玄龄
  score: 9
  worth_why: 房谋杜断成语之源；贞观之治首相，收图籍定律令监修晋书
  era: 唐初
  dates_known: true
- name_zh: 王维
  score: 9
  worth_why: 诗佛；安史乱中陷贼受伪职，凝碧池一诗免罪——劫难与自救完整弧线；辋川诗画双绝
  era: 盛唐
  dates_known: true
- name_zh: 刘琨
  score: 8
  worth_why: 闻鸡起舞成语主角；孤守并州吹笳退敌；误信段匹磾遇害——志大才疏之诫
  era: 西晋末
  dates_known: true
- name_zh: 王献之
  score: 8
  worth_why: 与父并称二王；管中窥豹典出其幼年；辞太极殿榜自重书名；书法开妍媚一路
  era: 东晋
  dates_known: true
- name_zh: 钟会
  score: 8
  worth_why: 灭蜀之役实际统帅；才高自恃拥蜀反叛身死——聪明反被聪明误的完整教训
  era: 曹魏
  dates_known: true
- name_zh: 司马昭
  score: 8
  worth_why: 司马昭之心路人皆知成语主角；遣钟会邓艾灭蜀定一统之基；禅代布局的权臣模板
  era: 曹魏
  dates_known: true
- name_zh: 褚遂良
  score: 8
  worth_why: 顾命大臣还笏叩头死谏立武后；贬死爱州——直臣之楷模及其代价
  era: 唐初
  dates_known: true
- name_zh: 张旭
  score: 8
  worth_why: 草圣；观公孙大娘剑器舞而悟笔法；以头濡墨号颠张，三绝之一
  era: 盛唐
  dates_known: true
rejections:
- name_zh: 史籀
  why_not: 创大篆著篇教学童，然行事近于传说，无完整做事周期可考
- name_zh: 韦诞
  why_not: 凌云台题榜去地二十五丈鬓发皓然虽奇，余唯制墨书艺，做事流单薄，暂缓
- name_zh: 杜操
  why_not: 仅章帝贵其迹得章草之名一事，无余事
- name_zh: 皇象
  why_not: 仅传书名与急就章，事迹简略
- name_zh: 智永
  why_not: 退笔冢铁门限佳话足录，然终身不出永欣寺，做事流过窄，暂缓
- name_zh: 谢灵运
  why_not: 才高八斗开山水诗派，然本赋仅列书名，宜据宋书本传另录，暂缓
- name_zh: 欧阳询
  why_not: 欧体之祖观碑三日可感，宜另据本传补全做事流，暂缓
- name_zh: 虞世南
  why_not: 五绝之臣、孔子庙堂碑，宜据两唐书另录，暂缓
- name_zh: 贺知章
  why_not: 金龟换酒回乡偶书名场面足，但所做为文事，做事流稍简，暂缓
- name_zh: 孙过庭
  why_not: 书谱为书论代表，然其行事记载极少，中年暴卒，周期不完整
- name_zh: 贺邵
  why_not: 直谏孙皓遭酷掠而死，气节可嘉而记载简略
- name_zh: 历代帝王书家（晋成帝、康帝、宋武帝、齐高帝、梁武帝、唐高祖、太宗、武后等）
  why_not: 君主低优先，本赋仅以书迹列名，无独立做事流
- name_zh: 窦臮、窦蒙
  why_not: 撰赋注书即本篇所出，行事仅此一端，不足成时间轴
- name_zh: 钟繇
  why_not: 文中仅借以衬托钟会，宜据魏晋史料专录
- name_zh: 张芝、索靖
  why_not: 仅攀附张索一笔带过，本赋无行事可据
