  worth_why: 本篇作者，明末清初书学宗师；立教学法（先学间架后学用笔，日课十字、百日成书）；提出晋人用理、唐人用法、宋人用意的书史框架；力驳奴书论、倡师法晋唐，答无咎三札倾囊相授
  era: 明末清初
  dates_known: true
