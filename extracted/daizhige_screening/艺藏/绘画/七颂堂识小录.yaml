source: 艺藏/绘画/七颂堂识小录.md
category: 艺藏/绘画
verdict: no_value
skip_reason: 是书为清代刘体仁书画古器赏鉴笔记，凡七十四条皆记器物藏所、题跋真赝与授受源流，人物仅以藏家、画作者或鉴定者身份一笔带过，无一具备缘起、阶段、关键决定、结果的完整做事周期
rejections:
- name_zh: 刘体仁
  why_not: 书之作者，仅记顺治乙未进士、官至吏部郎中及蓄人代笔轶事，无做事流
- name_zh: 范宽
  why_not: 仅记其两幅山水藏所与宣和帝题印真迹，无生平事迹
- name_zh: 黄公望
  why_not: 仅一句富春山图神品今归泰兴季氏，无做事周期
- name_zh: 王冕
  why_not: 仅录梅花一卷自题诗，无事迹可考
- name_zh: 李存勖
  why_not: 仅记太原李晋王像中人物位置缘由，非其做事史
- name_zh: 苏轼
  why_not: 仅涉醉翁亭记草书真赝之辨，且已在库
- name_zh: 孙承泽
  why_not: 仅作藏家坐标反复出现，无独立事迹
- name_zh: 梁清标
  why_not: 仅作藏家坐标出现，无做事流
