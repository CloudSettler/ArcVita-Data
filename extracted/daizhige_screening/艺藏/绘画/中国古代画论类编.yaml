source: 艺藏/绘画/中国古代画论类编.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 张璪
  score: 9
  worth_why: 外师造化、中得心源八字纲领之诞生点，为千年画论枢纽；秃毫手摸绢素当众画松石，毕宏见而搁笔成千古名场面；擅名长安、谪官武陵、荆州庭中挥毫，做事流两篇互证完整
  era: 盛唐至中唐
  dates_known: true
- name_zh: 马援
  score: 7
  worth_why: 画虎不成反类狗成语诞生点，出自诫兄子严敦书；伏波将军马革裹尸、老当益壮可作模范，见后汉书；本文献仅存一句
  era: 东汉初
  dates_known: true
- name_zh: 韩非
  score: 7
  worth_why: 画犬马最难、画鬼魅最易为经典美学命题；法家集大成，著书十余万言而死于秦狱可备教训，见史记本传；本文献仅论画二则
  era: 战国末
  dates_known: true
- name_zh: 吴道子
  score: 7
  worth_why: 画圣；文献评其天纵其能、独步当世、可齐踪于顾陆；吴带当风与地狱变相等名场面见历代名画记；本文献仅一句总评
  era: 盛唐
  dates_known: true
- name_zh: 朱景玄
  score: 7
  worth_why: 首创神妙能逸四品格，逸品开画史先河；因不满李嗣真画品录空录人名而定品，录一百二十四人，首部断代画史做事流完整
  era: 中晚唐
  dates_known: true
- name_zh: 裴孝源
  score: 7
  worth_why: 编成中国现存最早绘画著录贞观公私画录，收二百九十八卷、四十七所屋壁；序中自述搜罗魏晋以来遗迹并定品第先后，做事流完整可考
  era: 初唐
  dates_known: true
- name_zh: 颜之推
  score: 7
  worth_why: 以顾士端、刘岳为例警示画艺供使令为猥役取辱，劝子弟勿以末技妨素业，教训价值高；身历四朝撰颜氏家训，生平做事流可考
  era: 南朝梁至隋
  dates_known: true
- name_zh: 曹植
  score: 6
  worth_why: 画赞序立存乎鉴戒者图画也之功能论，记明帝马后观虞舜陶唐像逸闻；七步成诗等名场面另见三国志；本文献仅序一篇
  era: 汉魏之际
  dates_known: true
- name_zh: 陆机
  score: 6
  worth_why: 宣物莫大于言、存形莫善于画为名句，丹青比雅颂；文赋与华亭鹤唳之叹另见晋书；本文献仅两句
  era: 西晋
  dates_known: true
- name_zh: 白居易
  score: 6
  worth_why: 画记提出画无常工以似为工、学无常师以真为师；讽喻诗与杭州筑堤另见两唐书；本文献仅短评
  era: 中唐
  dates_known: true
- name_zh: 刘安
  score: 6
  worth_why: 谨毛而失貌、君形者亡焉为传神论源头；率门客撰淮南子而终以谋反自尽，模范与教训兼备，见汉书；本文献仅论画三则
  era: 西汉
  dates_known: true
- name_zh: 王羲之
  score: 6
  worth_why: 十六岁从叔父王廙受书画之教，为其艺事缘起点；书圣兰亭修禊等名场面另见晋书；本文献仅借王廙序侧记
  era: 东晋
  dates_known: true
- name_zh: 王延寿
  score: 5
  worth_why: 少年作鲁灵光殿赋，存汉代壁画恶以诫世、善以示后之貌；溺湘早逝，事迹简略
  era: 东汉
  dates_known: true
rejections:
- name_zh: 符载
  why_not: 仅以座客身份撰序记张璪作画，无自身做事周期
- name_zh: 毕宏
  why_not: 除擅名二字仅有搁笔一事，且系张璪名场面之衬托
- name_zh: 阎立本
  why_not: 仅二阎、师祖张僧繇可谓青出于蓝一句带过，步辇图等主事迹不在本文献
- name_zh: 陆探微
  why_not: 仅被推画人物居第一，无生平做事流
- name_zh: 顾恺之
  why_not: 仅与陆探微并称顾陆作比较，无本传内容
- name_zh: 周昉
  why_not: 仅一句次焉排名，无做事流
- name_zh: 王充
  why_not: 仅一句论壁画不如遗文，论衡成书流不在本文献
- name_zh: 徐干
  why_not: 仅一句借设色论学道，无做事流
- name_zh: 汉王李元昌
  why_not: 仅被裴孝源数句评六法俱全，其夺嫡被诛事不在本文献
- name_zh: 汉明帝与明德马后
  why_not: 仅曹植序中观画逸闻，君主后妃低优先
- name_zh: 顾士端父子、刘岳
  why_not: 颜氏家训中仅作画艺取辱之例证，无独立做事流
