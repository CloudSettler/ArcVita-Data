skip_reason: 本篇为明代张丑所撰书画著录表（四库子部艺术类书画之属），仅存序言数句与零星著录条目；所涉人物皆以作品作者或临摹者身份见于著录，通篇无生平叙事、做事周期或关键决定，无可抽取的成事儿材料
