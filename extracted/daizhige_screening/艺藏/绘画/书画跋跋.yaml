category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 王羲之
  score: 9
  worth_why: 兰亭雅集成就天下第一行书；东床坦腹、写经换鹅诸名场面；本献以右军三帖与季直表对勘辨伪，帖学源头地位无可替代
  era: 东晋
  dates_known: true
- name_zh: 钟繇
  score: 8
  worth_why: 荐季直表被推为神品无上；楷法之祖；仕魏历相国廷尉太尉，坐法失侯复起，做事周期完整
  era: 汉末三国
  dates_known: true
- name_zh: 褚遂良
  score: 8
  worth_why: 哀册文一钩一捺有千钧之力；本献细辨其位置生硬处与米芾学褚渊源；谏立武后遭贬见大臣风骨，楷模兼教训
  era: 初唐
  dates_known: true
- name_zh: 王世贞
  score: 8
  worth_why: 弇州山人四部稿与书画跋为晚明艺林总汇；好古敏求考覈精密，一题或至三四跋；后七子盟主
  era: 明中后期
  dates_known: true
- name_zh: 米芾
  score: 7
  worth_why: 书史以见闻断真伪，本献屡据其说定诸帖真赝；海岳名言、宝晋斋集晋帖，鉴赏与创作双绝
  era: 北宋
  dates_known: true
- name_zh: 孙鑛
  score: 7
  worth_why: 本献主人公，以跋攻跋、重文见义成一家之言；著述等身，奏议二十卷、越绝十卷；万历进士官至南京兵部尚书谥文简
  era: 晚明
  dates_known: true
- name_zh: 虞世南
  score: 7
  worth_why: 汝南公主志铭草为传世名迹；初唐四大家；太宗称五绝之臣，德行与书艺并显
  era: 初唐
  dates_known: true
- name_zh: 怀素
  score: 7
  worth_why: 藏真千文经欧阳修家藏、文征明手补百四十一字，递藏佳话成链；铁腕狂草，缁流而以书名家
  era: 盛唐至中唐
  dates_known: true
- name_zh: 文征明
  score: 6
  worth_why: 补怀素千文百四十一字而自居虎贲之似，晚年笔力不懈堪为勤学范；本献仅此一事，缓录
  era: 明中期
  dates_known: true
