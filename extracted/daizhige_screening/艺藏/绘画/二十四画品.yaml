candidates:
- name_zh: 黄钺
  score: 7
  worth_why: 宦余著述——见两汉以来画品止于像人肖物、山水理趣无专论之缺，遂仿司空图例自创二十四品、专言林壑，自谦前驱而实开山水画品评体系；成书缘起、体例抉择、成稿结果俱全，堪为著述类做事流范本
  era: 清中期（乾隆—道光）
  dates_known: true
- name_zh: 谢赫
  score: 6
  worth_why: 著《古画品录》创六法论，气韵生动一语成为中国画千年纲领，品第诸家、立批评之法，属制度性名场面；惟本文仅一句提及，生卒不详而主要活动年代可考
  era: 南朝齐梁
  dates_known: true
rejections:
