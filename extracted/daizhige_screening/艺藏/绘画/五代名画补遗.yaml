source: 艺藏/绘画/五代名画补遗.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 荆浩
  score: 9
  worth_why: 唐末乱离退隐太行洪谷自号洪谷子；与大愚僧诗画往还成六幅松石名迹；著山水诀投进书府传世；门生关仝承其法开北方山水一派，为五代山水之祖，乱世退而立派的完整成事流
  era: 唐末五代
  dates_known: true
- name_zh: 跋异
  score: 8
  worth_why: 先败于张图受洛下谣言之讥，后福先寺让西壁于李罗汉而竭精贮思成护法善神，反令李氏自缢；昔见败于张将军今取捷于李罗汉，知耻后勇的败忍成完整心性成长流
  era: 五代后梁
  dates_known: true
- name_zh: 张图
  score: 8
  worth_why: 由掌行军资粮簿籍而以丹青自致神妙，泼墨山水不师授自成一格；广爱寺夺壁名场面——不用朽木约搦管挥写折腰报事师从以三鬼，技压跋异专其功，洛阳为造谣言
  era: 五代后梁
  dates_known: true
- name_zh: 关仝
  score: 8
  worth_why: 初师荆浩，刻意力学寝食都废意欲逾浩，终成关家山水，一笔而成上突巍峰下瞰穷谷，四方辐凑争求笔迹；青出于蓝而胜于蓝的典范
  era: 五代后梁
  dates_known: true
- name_zh: 韩求
  score: 8
  worth_why: 与李祝皆有经略才能，值唐祚陵季退藏不仕以丹青自晦；陕郊画摄摩腾竺法兰等二百余堵，天下画流云集莫不鼠伏；终遭李克用济中流溺杀，怀璧其罪、乱世才士自晦亦不免之训
  era: 唐末五代
  dates_known: true
- name_zh: 李祝
  score: 8
  worth_why: 与韩求齐名同传，画九子母罗乂变像宛有步武之态；以画自污避世仍被妒被谗，中流俱醉同溺；才高招忌的警世案例
  era: 唐末五代
  dates_known: true
rejections:
- name_zh: 朱瑶
  why_not: 仅记金真观神笔及壁画颓圯存毁，无做事周期与关键决策
- name_zh: 曹仲元
  why_not: 有弃吴法自立一格一节，然传文简略、生卒无考，成事流不全
- name_zh: 陶守立
  why_not: 落第退处齐山以丹青自娱一段而已，事迹简略无可考成事链条
- name_zh: 王仁寿
  why_not: 有开运四年被契丹掠北、宋祖遣使索还而考终一事可作史事注脚，然其本人无成事流
- name_zh: 胡环
  why_not: 传文纯为画技品评，细入毫芒云云，无行事与年代
- name_zh: 东丹王赞华
  why_not: 文中仅评其画马骨法短长，宗室身份只为时间坐标，无做事周期
- name_zh: 钟隐
  why_not: 卜居结茅养恬、以画自娱，传文简略无成事链条
- name_zh: 郭权辉
  why_not: 构第畜禽鸟以观物取真之法可取，然事迹过简
- name_zh: 陆晃
  why_not: 嗜酒挥洒妍丑互出，复遭谗见疏，无成事流
- name_zh: 竹梦松
  why_not: 数十字仅存画迹与官衔
- name_zh: 李罗汉
  why_not: 跋异传中配角，角技败而自缢可作教训，然无独立传文与可考年代
- name_zh: 李克用
  why_not: 本文仅见其矫令观画、中流溺杀求祝一事，军阀只作时间坐标且行为为反例，无完整做事流
- name_zh: 胡峤
  why_not: 仅提要中提及其广梁朝画目，书佚无事迹可录
