source: 艺藏/绘画/传神秘要.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 蒋骥
  score: 8
  worth_why: 承家学而自量书不及父，转专写真一艺，成传神秘要二十七目，布局取势运笔设色皆抒心得，使丹青口诀升格为可传之学，补古人所未备；传神以远取神、点睛取神诸法可为名场面；亦为勿贵远贱近之戒
  era: 清康熙末至乾隆间
  dates_known: true
- name_zh: 蒋衡
  score: 8
  worth_why: 以楷书手写十三经六十余万字，历十余年功，乾隆五年呈进，特赐国子监学正衔，后其书奉敕刻石立于太学即乾隆石经；十二年磨一经，毅力可范
  era: 清康熙至乾隆间
  dates_known: true
- name_zh: 顾恺之
  score: 8
  worth_why: 传神写照正在阿堵中，以形写神为中国画论之祖；女史箴图、洛神赋图传世，瓦棺寺点睛募百万钱为画史名场面；本篇引为写真宗师，宜另据晋书、世说新语专传录入
  era: 东晋
  dates_known: true
rejections:
- name_zh: 王绎
  why_not: 篇内仅引其写像秘诀与王思善写像诀数语（思善即其字），无其行事周期，宜另考杨竹西小像等事迹后缓录
- name_zh: 陈造
  why_not: 仅引熟视默识、亟运笔墨一句画论，无做事周期
- name_zh: 陶宗仪
  why_not: 仅以辍耕录书名见引，本人行事不载于本篇
- name_zh: 蔡新
  why_not: 仅以家藏本藏书人一笔带过，无事迹
- name_zh: 纪昀
  why_not: 四库提要署名馆臣（与陆锡熊、孙士毅、陆费墀并列），系校上衔名而非叙事人物
- name_zh: 乾隆帝
  why_not: 仅以年号作纪年坐标出现，无做事叙事，君主低优先
