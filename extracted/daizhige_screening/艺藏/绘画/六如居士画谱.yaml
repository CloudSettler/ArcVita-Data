- name_zh: 唐寅
  score: 9
  worth_why: 即辑者六如居士，自序明言弃经生业托之丹青。弘治解元、会试科场案黜落、拒就吏职以卖画自全、佯狂避宁王、筑桃花庵作桃花庵歌，终成明四家之一。做事流完整，失意文人转型的典范与教训俱全
  era: 明中期
  dates_known: true
- name_zh: 黄公望
  score: 9
  worth_why: 即卷二画诀作者黄子久。中年因张闾案系狱，出狱入全真教卖卜云游；七十九岁起笔富春山居图，阅三四载乃成；后人欲焚画殉葬，火中抢出断为两卷。代表作与传奇做事流俱全
  era: 元末
  dates_known: true
- name_zh: 王维
  score: 8
  worth_why: 卷二山水诀托名作者。辋川别业自绘辋川图开文人山水一派；安史陷贼以凝碧池诗免祸；苏轼评诗中有画画中有诗
  era: 唐
  dates_known: true
- name_zh: 郭熙
  score: 8
  worth_why: 画训作者。神宗朝宫殿专其笔，作早春图；子纂林泉高致立三远法；其论注精、严重、恪勤实为以作画论成事，方法论与名作俱全
  era: 北宋
  dates_known: true
- name_zh: 荆浩
  score: 8
  worth_why: 隐太行洪谷携笔摹写，自言采吴道子之笔、项容之墨成一家体；立六要开北方山水画派，山水赋、画说诸篇托于其名。生卒不详而主要活动年代可考
  era: 唐末五代
  dates_known: false
- name_zh: 张彦远
  score: 7
  worth_why: 叙画源流作者。河东鉴藏世家，成历代名画记为画史之祖；丹青之兴比雅颂之述作，论画之教化功能千载传诵
  era: 晚唐
  dates_known: true
- name_zh: 谢赫
  score: 7
  worth_why: 六法三品之六法即其古画品录所立，气韵生动、骨法用笔云云为千余年品画圭臬；生平仅知活动于南齐
  era: 南齐
  dates_known: false
