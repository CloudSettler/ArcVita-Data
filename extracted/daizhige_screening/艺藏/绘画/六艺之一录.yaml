source: 艺藏/绘画/六艺之一录.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 许慎
  score: 9
  worth_why: 二十余年功力撰《说文解字》，首创五百四十部首统摄九千余字，奠部首检字之法；永元十二年遣子献书于朝，后世尊为字圣，五经无双之誉
  era: 东汉
  dates_known: true
- name_zh: 郦道元
  score: 9
  worth_why: 以《水经》为纲、广搜图志兼亲身考迹，注成四十卷《水经注》，记河流千二百余条，为地理叙述文学双绝；官至御史中尉，奉使关中遇害于阴盘驿
  era: 北魏
  dates_known: true
- name_zh: 倪涛
  score: 8
  worth_why: 平生笃志嗜学，年近百岁犹著书不辍；贫不能雇人缮写皆手自抄录，家妇女助成之；终成四百六十卷《六艺之一录》，上下二千年书学总汇
  era: 清康熙至乾隆间
  dates_known: true
- name_zh: 陶弘景
  score: 8
  worth_why: 永明中挂朝服于神武门辞官，隐茅山四十余年号山中宰相；撰《本草经集注》厘正药性、《古今刀剑录》开兵器考录之先，儒道医艺兼综
  era: 南朝齐梁
  dates_known: true
- name_zh: 杜预
  score: 8
  worth_why: 自号左传癖，撰《春秋左氏经传集解》以传附经成一代经学宗师；灭吴之役任西线统帅功成，身不跨马射不穿札而文武两全
  era: 西晋
  dates_known: true
- name_zh: 班固
  score: 8
  worth_why: 续父业私撰国史被告发下狱，明帝览其书稿释而命成之，卒成《汉书》百篇；又奉诏主笔白虎观会议撰《白虎通德论》
  era: 东汉
  dates_known: true
- name_zh: 张彦远
  score: 8
  worth_why: 出身河东收藏世家，撰《历代名画记》为画史之祖、《法书要录》辑存唐以前书论；本编提要即推为唐以前论书惟一详备之书
  era: 唐
  dates_known: true
- name_zh: 扬雄
  score: 7
  worth_why: 仿《论语》作《法言》、仿《易》作《太玄》，撰《方言》开方言训诂之学；校书天禄阁因刘棻案投阁几死，贫而守学终身，与许慎并称博览穷训诂
  era: 西汉末
  dates_known: true
- name_zh: 纪昀
  score: 7
  worth_why: 任四库全书馆总纂官十余年，删定编摩勒成《四库全书总目》二百卷，统论上下两千年学术源流；又著《阅微草堂笔记》
  era: 清乾隆
  dates_known: true
- name_zh: 吕大临
  score: 7
  worth_why: 先学于张载后师二程，撰《考古图》著录商周铜器、辨形制释款识，开中国金石学著录之体例；本卷考癸鼎即引其说
  era: 北宋
  dates_known: true
rejections:
- name_zh: 商瞿
  why_not: 传中仅因商瞿祖丁卣铭重名一提，非其行事；易学授受仅存世系无独立做事周期
- name_zh: 左丘明
  why_not: 仅引其称法度之器曰彝器一语，著述归属后世有争，生平行事难考
- name_zh: 公非
  why_not: 仅因鼎铭推测为周先公世系中人，纯世系符号无事迹
- name_zh: 孔甲
  why_not: 仅借《刀剑录》记铸剑一事，夏世系君主符号，君主低优先
- name_zh: 毕公
  why_not: 仅见周穆王命作册毕册命一语，无做事周期可构
- name_zh: 邢昺
  why_not: 仅以《尔雅疏》一句被引，无行事叙述
- name_zh: 陆锡熊
  why_not: 仅以总纂官列衔，无事迹叙述
- name_zh: 孙士毅
  why_not: 仅以总纂官列衔，其武功与本书无涉
- name_zh: 陆费墀
  why_not: 仅列总校衔名，无事迹叙述
