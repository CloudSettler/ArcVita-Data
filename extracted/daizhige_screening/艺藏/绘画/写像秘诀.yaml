- name_zh: 王绎
  score: 6
  worth_why: 据《辍耕录》辑存其《写像秘诀》，系统化传神写照：首创八格三庭定寸与九宫格收放放大法，主张于叫啸谈话间静观捕真，痛斥正襟危坐泥塑式俗工，是肖像画法的革新点与成书名场面；然本篇仅存画诀，其生平做事流简略，生卒不详，故缓录
  era: 元末
  dates_known: false
