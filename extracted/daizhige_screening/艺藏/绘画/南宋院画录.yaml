source: 艺藏/绘画/南宋院画录.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 李唐
  score: 9
  worth_why: 徽宗竹锁桥边卖酒家试题夺魁；南渡时年近八十复入画院创大斧劈皴为南宋四大家之首；高宗题可比唐李思训；画晋文公复国图寓兴复之志
  era: 北宋末至南宋初
  dates_known: false
- name_zh: 马远
  score: 8
  worth_why: 南宋四大家之一，创马一角构图与折芦描、秃笔淡描技法，独占一卷可见地位之重
  era: 南宋
  dates_known: false
- name_zh: 夏珪
  score: 8
  worth_why: 南宋四大家，师李唐而变其法，泥里拔钉皴；董其昌谓马夏写钱唐山自成一家
  era: 南宋
  dates_known: false
- name_zh: 刘松年
  score: 7
  worth_why: 南宋四大家，清河书画舫推为南宋之冠，小斧劈皴自成面貌
  era: 南宋
  dates_known: false
- name_zh: 梁楷
  score: 7
  worth_why: 减笔画法开一代新风，绘事指蒙列其减笔为独门技法，影响后世写意
  era: 南宋
  dates_known: false
- name_zh: 萧照
  score: 6
  worth_why: 从李唐南渡学艺而名世，南渡初数手之一，可考阶段有限
  era: 南宋初
  dates_known: false
- name_zh: 马麟
  score: 5
  worth_why: 马远之子承家学而自立，事迹记载较简
  era: 南宋
  dates_known: false
- name_zh: 苏汉臣
  score: 5
  worth_why: 御前画院有名者，婴戏画代表，然传中事迹简略
  era: 南宋
  dates_known: false
- name_zh: 李嵩
  score: 5
  worth_why: 御前画院待诏，木工出身转画工的典型，惜本卷无可考做事周期
  era: 南宋
  dates_known: false
- name_zh: 马和之
  score: 5
  worth_why: 御前画院首席之列，创蚂蝗描，儒最高雅；无生卒可考
  era: 南宋
  dates_known: false
rejections:
- name_zh: 厉鹗
  why_not: 作者为康熙乾隆间人，此书为文献辑录而非做事传记
- name_zh: 众多画工如朱锐林椿阎次平等
  why_not: 仅存姓名与零星画目，无完整做事周期与时间可考
- name_zh: 宋髙宗
  why_not: 君主仅作时间坐标与赞助者，无独立做事流
