source: 艺藏/绘画/古画品录.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 谢赫
  score: 8
  worth_why: 创立六法论（气韵生动、骨法用笔等），千载不能易，奠定中国绘画品评体系，做事流完整（著书缘起、品评标准、后世争议）
  era: 南齐
  dates_known: false
- name_zh: 顾恺之
  score: 7
  worth_why: 东晋画坛巨擘，谢赫列于下品引发姚最讥议，千古争议名场面；人称虎头三绝
  era: 东晋
  dates_known: true
- name_zh: 陆探微
  score: 7
  worth_why: 谢赫唯一备该六法者、屈标第一等上上品外无他寄言，六朝画家典范
  era: 南朝宋
  dates_known: false
- name_zh: 戴逵
  score: 6
  worth_why: 善图贤圣百工所范，荀卫之后领袖，子颙继其美成艺术世家
  era: 东晋
  dates_known: true
- name_zh: 张僧繇
  score: 7
  worth_why: 续画品评其画写貌，画龙点睛传说主角，梁代画坛第一人，可考活动年代清楚
  era: 梁代
  dates_known: true
- name_zh: 卫协
  score: 6
  worth_why: 占画之略至协始精，六法兼善旷代绝笔，古画演进关键节点人物
  era: 西晋
  dates_known: false
- name_zh: 曹不兴
  score: 6
  worth_why: 事孙权，落墨误点成蝇传说主角，秘阁孤龙可见风骨，中国佛画之祖
  era: 三国吴
  dates_known: false
- name_zh: 姚最
  score: 6
  worth_why: 续画品但叙时代不分品目以纠谢赫，品评标准之变有可考做事周期
  era: 梁末入陈
  dates_known: false
- name_zh: 庾肩吾
  score: 6
  worth_why: 书品载汉至齐梁八品书家一百二十三人，撰述周期可考，兼考程邈创隶书之论
  era: 南朝梁
  dates_known: true
rejections:
- name_zh: 顾骏之
  why_not: 传文仅评语数句，无完整做事周期
- name_zh: 晋明帝
  why_not: 君主仅作画家一笔带过，事迹简略
