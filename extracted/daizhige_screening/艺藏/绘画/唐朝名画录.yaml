source: 艺藏/绘画/唐朝名画录.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 吴道子
  score: 9
  worth_why: 画圣；嘉陵江三百里一日而毕、一日观三绝、地狱变相令屠沽改业，名场面密集
  era: 唐开元天宝年间
  dates_known: true
- name_zh: 周昉
  score: 8
  worth_why: 章敬寺神像落后笔都人竞观、月余定品；赵家二像优劣定评成传神论名案
  era: 唐代宗至德宗朝
  dates_known: false
- name_zh: 阎立本
  score: 8
  worth_why: 凌烟阁功臣图与秦府十八学士图；玄武池被呼画师之耻绝笔诫子，荣辱两面完整
  era: 唐太宗朝
  dates_known: false
- name_zh: 韩幹
  score: 7
  worth_why: 陛下内厩之马皆吾师也，师造化名言；画马神骏冠绝
  era: 唐天宝中
  dates_known: false
- name_zh: 李思训
  score: 7
  worth_why: 大同殿数月之功与吴道子一日之迹对举；夜闻水声通神山水；大李将军开创金碧山水
  era: 唐开元中
  dates_known: true
- name_zh: 张藻
  score: 7
  worth_why: 双管齐下画生枝枯枝，成语「双管齐下」诞生点
  era: 唐代
  dates_known: false
- name_zh: 韦无忝
  score: 6
  worth_why: 画四足兽独步、展图百兽惊惧；事迹尚简
  era: 唐开元天宝中
  dates_known: false
- name_zh: 薛稷
  score: 6
  worth_why: 位至宰辅兼画鹤一绝、买褚得薛；主要功业在政不在画，画事略
  era: 武后朝
  dates_known: true
- name_zh: 韦偃
  score: 5
  worth_why: 妙品列位然本传仅存目，事迹见其他文献方可判
  era: 唐代
  dates_known: false
- name_zh: 王维
  score: 5
  worth_why: 诗画双绝本为佳例，然此录仅存名无事迹
  era: 唐开元天宝
  dates_known: true
