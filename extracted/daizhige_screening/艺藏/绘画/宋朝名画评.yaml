candidates:
- name_zh: 王瓘
  score: 8
  worth_why: 穷冬观吴道子壁刮磨寻迹自得遗法，干徳开宝间画冠天下，买王得吴之评
  era: 五代末宋初
  dates_known: true
- name_zh: 王霭
  score: 8
  worth_why: 被契丹掠归又放还，微服潜写宋齐丘韩熙载等形貌供宋太祖吊伐之谋，写真成谍报名场面
  era: 五代至宋初
  dates_known: true
- name_zh: 高益
  score: 8
  worth_why: 由货药赠画起家，睨目奋笔画鬼神举石狻猊击疠，太宗临幸问兵法对答得宠待诏
  era: 宋初
  dates_known: true
- name_zh: 武宗元
  score: 8
  worth_why: 玉清昭应宫三千选百人为左部之长，为富商画观音三年成而人已殁焚画垂涕
  era: 北宋真宗朝
  dates_known: true
- name_zh: 王士元
  score: 7
  worth_why: 续唐名画断采诸家长作武王誓师图，遭高文进倾轧定下品不顾而去，见画院是非
  era: 北宋初
  dates_known: false
- name_zh: 赵光辅
  score: 7
  worth_why: 图画院学士无仕进意潜自遁去，五百高僧画 phenotype 各尽其妙
  era: 北宋太宗朝
  dates_known: true
- name_zh: 王齐翰
  score: 6
  worth_why: 十六罗汉历军赏质钱诉讼，太宗按澄其事赐白金，越十六日即位名应运国宝罗汉
  era: 南唐至宋初
  dates_known: false
- name_zh: 孙梦卿
  score: 6
  worth_why: 志摹吴道子号孙脱壁，与王霭对画开宝寺天王像，惜袭短不能自出新意
  era: 五代至宋初
  dates_known: false
