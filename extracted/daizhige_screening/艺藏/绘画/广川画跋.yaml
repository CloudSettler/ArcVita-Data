verdict: has_candidates
candidates:
- name_zh: 董逌
  score: 7
  worth_why: 北宋考据赏鉴大家，以画跋辨武皇望仙图、千角鹿图、地狱变相等数十图，考订精核成《广川画跋》六卷，做事流为一生鉴定学问的完整周期
  era: 北宋宣和年间
  dates_known: true
rejections:
- name_zh: 黄伯思
  why_not: 仅于提要中一句带过，无做事周期文献
- name_zh: 孙道明
  why_not: 仅记为元至正间抄书者，数十字无做事情节
- name_zh: 吴道玄
  why_not: 本卷仅作画跋考据对象，无本人事迹周期可采
- name_zh: 汉武帝
  why_not: 天下君主低优先，且文中仅涉望仙图传说与佞惑之诫，事迹简略
- name_zh: 唐武宗
  why_not: 借图发论之人物，叙述片段无完整做事周期
- name_zh: 李赞华（东丹王突欲）
  why_not: 附注仅记其奔唐赐姓名始末，无做事流
- name_zh: 裴度
  why_not: 仅献开元东封图一事，单事件不足成时间轴
- name_zh: 张孝师
  why_not: 仅为画作归属考辨对象，生平不详
- name_zh: 杨素
  why_not: 分镜图跋中转述归其妾一节，无做事周期
- name_zh: 徐德言（乐昌公主分镜故事）
  why_not: 借故事发议论，非本传，事迹不成体
- name_zh: 张僧繇
  why_not: 仅一句提及画大同寺经变，无文献可立时间轴
- name_zh: 刘原父（刘敞）
  why_not: 仅驳马图一考据小故事，无完整做事流
- name_zh: 张璪
  why_not: 松林图跋中一笔带过画松三绝事，事迹过简
