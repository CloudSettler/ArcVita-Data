  worth_why: 北宋山水画宗师，林泉之志可行可望可游可居，身即山川而取之，三远法与四时山景论为画学史名场面；神宗朝宠遇，宫壁悉出其笔，做事流完整且可考
  era: 北宋
  dates_known: true
- name_zh: 郭思
  score: 7
  worth_why: 丱角侍父游泉石，每闻一说旋即笔记，收拾纂集成《林泉高致》以贻同好，兼登元丰五年进士官至经略安抚使，述父学而自成著述之事功
  era: 北宋
  dates_known: true
- name_zh: 王维
