  why_not: 仅记一幅送兄图与出嫁事，无完整做事周期
- name_zh: 陈李
  why_not: 仅记扇面合笔与身世疑似，事迹不足
- name_zh: 巴延珠
  why_not: 学父写真技法后守贞绣佛以终，事迹简略
- name_zh: 吕文安与冯女郎
  why_not: 画迹不存仅倚声附见两家词集，无可考做事
- name_zh: 朱梅侣
  why_not: 传文一行，仅记楷书墨菊长技
- name_zh: 柴贞仪与柴静仪
  why_not: 仅记适人与藏画两事，无做事流
- name_zh: 朱雨花
  why_not: 仅凭一扇便面见其画技，年未三十事迹无考
- name_zh: 姚夫人
  why_not: 仅借题诗旁证善绘，无自身事迹
