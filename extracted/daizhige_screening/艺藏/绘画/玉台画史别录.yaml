source: 艺藏/绘画/玉台画史别录.md
category: 艺藏/绘画
verdict: has_candidates
candidates:
- name_zh: 张净因
  score: 6
  worth_why: 家贫以画易米又拒长官求见佯称不识字，气节可取；著绿秋书屋诗集，卒年可考
  era: 清乾嘉年间
  dates_known: true
- name_zh: 吴玖
  score: 6
  worth_why: 工诗善画，山水兰竹皆出心悟，有溪山归兴图并夫君题诗佐证
  era: 清嘉庆前后
  dates_known: false
- name_zh: 吴规臣
  score: 7
  worth_why: 画师南田，夫从征喀什噶尔期间两家人恃其丹青为生，兼精医术，孝行称于时，做事流较完整
  era: 清嘉道年间
  dates_known: false
- name_zh: 陈琼圃
  score: 5
  worth_why: 能诗兼六法，夫亡殉节年二十九，自题山水册诗清婉可诵，然生平事迹简略
  era: 清中叶
  dates_known: true
- name_zh: 萨克达氏
  score: 5
  worth_why: 指头画鹰得其神俊，悟花卉草虫落笔不可收拾之理，夫英和题跋可证
  era: 清乾嘉年间
  dates_known: false
- name_zh: 朱柔则
  score: 6
  worth_why: 遥寄故乡山水图促夫归，翻画家山远寄来传为佳话，一画成名的场面感强
  era: 清初
  dates_known: false
- name_zh: 吴映瑜
  score: 5
  worth_why: 工书画，与族兄吴锡麒朝夕评骘擘窠书，六旬犹作楷
  era: 清嘉庆前后
  dates_known: false
rejections:
