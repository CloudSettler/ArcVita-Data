candidates:
- name_zh: 宋徽宗
  score: 9
  worth_why: 以帝王之身兴画学、设画博士、如进士科取士，创宣和体；建五岳观大集天下名手，编宣和睿览集成一代盛事；亡国教训与前功并具
  era: 北宋末
  dates_known: true
- name_zh: 邓椿
  score: 8
  worth_why: 继郭若虚之后耗时写成画继十卷，录二百一十九人，私立轩冕岩穴二门以人品论画格，画史终成一代做事流
  era: 南宋
  dates_known: true
- name_zh: 王诜
  score: 8
  worth_why: 贵戚而屏去声色、筑宝绘堂蓄书画，苏轼为记；山水学李成得破墨三昧，与从臣诗画交游见其做事周期
  era: 北宋
  dates_known: true
- name_zh: 赵令穰
  score: 7
  worth_why: 宗室少年学毕宏韦偃即逼真得名，每出一图必出新意；困于不获远游致景不出五百里，掷笔叹艺之役人，教训可取
  era: 北宋
  dates_known: true
- name_zh: 宋子房
  score: 6
  worth_why: 被荐为画学博士，主持如取乱山藏古寺等神品试题开画学取士之法
  era: 北宋末
  dates_known: false
