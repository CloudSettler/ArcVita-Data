candidates:
- name_zh: 孙位
  score: 7
  worth_why: 逸格一人；应天寺昭觉寺画龙水松石名场面，千金难留一笔的傲骨；僖宗入蜀随驾画师
  era: 唐末
  dates_known: true
- name_zh: 范琼
  score: 7
  worth_why: 会昌法难后与陈皓彭坚历大中至乾符画二百余堵，经两次兵火仍有存者；画事流完整
  era: 唐末
  dates_known: true
- name_zh: 赵公祐
  score: 6
  worth_why: 六法全；宝历至开成画佛像甚多，作品经会昌法难存毁可考
  era: 唐中晚期
  dates_known: true
- name_zh: 张素卿
  score: 7
  worth_why: 孤贫道士成名家；上表改封丈人山事件；青城山画岳渎神像观者恐惧；画事名场面兼备
  era: 唐末五代
  dates_known: true
- name_zh: 赵德齐
  score: 6
  worth_why: 三代家传画业克绍祖业；为王建画生祠仪仗与陵庙，授翰林待诏
  era: 唐末五代
  dates_known: true
- name_zh: 陈皓
  score: 6
  worth_why: 与彭坚幔幕遮蔽隔画天王较艺的典故场面；六法俱妙
  era: 唐中晚期
  dates_known: true
- name_zh: 卢楞伽
  score: 6
  worth_why: 玄宗驻跸入蜀画大圣慈寺行道高僧，颜真卿题字时称二绝；画作存世二百余年
  era: 唐中期
  dates_known: true
