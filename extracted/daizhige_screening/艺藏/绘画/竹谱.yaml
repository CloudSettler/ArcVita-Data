candidates:
- name_zh: 李衎
  score: 9
  worth_why: 画竹成事流完整：早年窥笔法而屡弃，得文同真迹后壹意师之；行役万余里远使交趾深入竹乡考察竹之形色情状，成画竹墨竹竹态竹品十卷谱录；兼有青绿设竹法之创新，身居吏部尚书集贤大学士而余暇成艺，一艺之精信不易矣
  era: 元代
  dates_known: true
- name_zh: 文同
  score: 8
  worth_why: 胸有成竹典故主角，画竹方法论之父，文湖州画竹诀为谱中核心法度，墨竹源头宗师
  era: 北宋
  dates_known: true
