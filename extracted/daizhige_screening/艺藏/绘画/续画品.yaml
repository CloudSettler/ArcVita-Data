verdict: has_candidates
candidates:
- name_zh: 萧绎
  score: 8
  worth_why: 梁元帝王于像人特尽神妙，画芙蓉醮鼎图，兼职文谈众艺之馀遇物援毫造次惊绝；又为江陵焚书之主，做事流完整，可为典范亦可为教训
  era: 南朝梁陈之际
  dates_known: true
- name_zh: 谢赫
  score: 8
  worth_why: 六法论之创立者，写貌人物一览便工，别体细微多自其始，为后世画品制度奠基；虽本传简略，其《古画品录》为绘画批评开山
  era: 南朝齐梁
  dates_known: false
- name_zh: 姚最
  score: 7
  worth_why: 继谢赫《古画品录》而作《续画品》，不分品目但叙时代，提出心师造化，为中国绘画批评承前启后之作，做事流完整
  era: 南朝梁末入陈
  dates_known: false
- name_zh: 张僧繇
  score: 8
  worth_why: 善图塔庙超越群工，俾昼作夜未尝厌怠，奇形异貌殊方夷夏实参其妙，画龙点睛之名场面主人
  era: 南朝梁
  dates_known: true
- name_zh: 萧贲
  score: 6
  worth_why: 尝画团扇上为山川，咫尺之内而瞻万里之遥，方寸之中乃辨千寻之峻，为咫尺千里之山水观先行者；学不为人自娱而已
  era: 南朝齐梁
  dates_known: false
