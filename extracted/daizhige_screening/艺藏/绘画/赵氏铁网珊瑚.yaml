- name_zh: 解缙、董伦、徐一防、郑真等
  why_not: 传文仅崇观题名数语，无事迹文本
- name_zh: 史籀、周宣王
  why_not: 仅作为石鼓文作者与时代坐标被提及，非传主
- name_zh: 纪昀、陆锡熊、孙士毅
  why_not: 仅四库校上具名，无事迹
