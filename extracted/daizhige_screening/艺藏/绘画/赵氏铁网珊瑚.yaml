candidates:
- name_zh: 赵琦美
  score: 7
  worth_why: 得秦四麟、焦竑两本互校增补编成铁网珊瑚十六卷，考订书画真伪流传，属可考的完整整理事业
  era: 明代万历
  dates_known: true
- name_zh: 周伯温造
  score: 6
  worth_why: 作石鼓赋，记元皇年间石鼓置太学辟雍之盛事，可考典藏迁移始末
  era: 元代皇庆
  dates_known: true
- name_zh: 赵则古
  score: 6
  worth_why: 考辨石鼓文年代归属，力排欧阳修、郑樵诸疑议断为周宣王时史籀书，并装潢释文成轴
  era: 明初洪武
  dates_known: true
rejections:
- name_zh: 朱存理
