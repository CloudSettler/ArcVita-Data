- name_zh: 勒方锜
  why_not: 仅评榑洲词二卷优劣，摘句而已
- name_zh: 柳永
  why_not: 仅评其词格铺叙千篇一律，无做事流
- name_zh: 吴毓沈
  why_not: 记访聋叟写词一件小事，不成周期
- name_zh: 李进琯
