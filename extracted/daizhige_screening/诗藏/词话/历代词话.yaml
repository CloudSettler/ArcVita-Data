- name_zh: 白居易
  score: 6
  worth_why: 元白诸诗多协律入歌，乐人高玲珑能歌其数十诗，可见其诗作入乐流传之况；惜传内仅摘句无完整做事流，宜缓录待补正史料
  era: 中唐
  dates_known: true
- name_zh: 李白
  score: 6
  worth_why: 清平调皆绝句而定为歌曲，采莲曲有名句；文献仅涉词乐一面，需正史传补全做事流
  era: 盛唐
  dates_known: true
- name_zh: 李煜
  score: 6
  worth_why: 南唐之主工小词，三台令存世；其亡国前后词为词史转捩点，但本卷仅举一曲名
  era: 五代南唐
  dates_known: true
- name_zh: 刘禹锡
  score: 6
  worth_why: 竹枝词变南调为北曲，纥那曲、江南春见收；作词形式创新有名场面潜力，然本卷无其生平
  era: 中唐
  dates_known: true
