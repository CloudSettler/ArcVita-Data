  worth_why: 金陵中使传宣抚问众稿不称意遂自作表五事见四句中言约意尽众以为不及；一生变法文章剪裁皆名场面素材，然本卷仅摘一联无完整做事周期
  era: 北宋
  dates_known: true
- name_zh: 李清照
  score: 6
  worth_why: 号易安，妇人而四六之工者，祭赵明诚湖州文白日正中坚城自堕一联传诵；生卒年可考，然本卷所记仅一句
  era: 两宋之际
  dates_known: true
- name_zh: 苏轼
  score: 6
  worth_why: 岭外归启七年远谪万里生还衬字皆汉人语，乌台诗案黄州惠州儋州一生行藏可构成完整做事流，然本卷仅摘其启语
  era: 北宋
  dates_known: true
- name_zh: 谢伋
  score: 5
  worth_why: 绍兴十一年序成四六谈麈，论四六工在剪裁切中南宋之弊，家世仕历可考；然其事功简略主要作为批评家传世
  era: 南宋
  dates_known: true
