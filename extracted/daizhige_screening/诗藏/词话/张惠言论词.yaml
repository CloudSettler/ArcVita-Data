candidates:
- name_zh: 张惠言
  score: 8
  worth_why: 常州词派开创者，以比兴说词，评定温庭筠以下诸家，词学批评自成体系，著述传世
  era: 清代嘉庆间
  dates_known: true
- name_zh: 温庭筠
  score: 7
  worth_why: 花间鼻祖，菩萨蛮十四首确立词体范式，感士不遇寄托说为后世诠释起点
  era: 晚唐
  dates_known: true
- name_zh: 韦庄
  score: 7
  worth_why: 乱世奉使入蜀，从冀图还乡到白头誓不归的劝进抉择，菩萨蛮五首自见心史
  era: 唐末五代
  dates_known: true
- name_zh: 辛弃疾
  score: 9
  worth_why: 摸鱼儿怨而终不见罪、菩萨蛮郁孤台恢复之志，词人兼带兵干将，做事流完整
  era: 南宋
  dates_known: true
- name_zh: 苏轼
  score: 9
  worth_why: 黄州贬所作卜算子，拣尽寒枝不肯栖，乌台诗案后置身死生转折而卒成大家
  era: 北宋
  dates_known: true
- name_zh: 姜夔
  score: 7
  worth_why: 暗香疏影为石湖作，暗沮隐遁之志、寄望用世，雅词开宗
  era: 南宋
  dates_known: true
- name_zh: 王沂孙
  score: 6
  worth_why: 咏物诸篇并有君国之忧，宋亡遗民心事可考
  era: 宋末元初
  dates_known: true
