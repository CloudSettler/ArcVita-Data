- name_zh: 刘过
  score: 6
  worth_why: 辛派词人代表；本篇载其游富沙赠词吴盻儿、遭吴仲平持刃刺而误伤妓、系狱后以启上书得释一事，有完整做事转折点与名句存世
  era: 南宋
  dates_known: true
- name_zh: 杨缵
  score: 5
  worth_why: 洞晓律吕自制琴曲二百操，一字之误必顾之，为近世知音之誉；兼载幼年应对史卫王被称远器，然做事业仅限音乐而已
  era: 南宋
  dates_known: false
