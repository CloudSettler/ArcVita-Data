skip_reason: 《海绡说词》为清代陈洵之词学批评著作，通论词史源流与梦窗词笺释，文中仅片段式评点吴文英、周邦彦、姜夔、陈洵等人词艺，皆无可考的完整做事周期、关键决策点与可系年事件，不构成成事儿时间轴人物
rejections:
- name_zh: 陈洵
  why_not: 仅自述三十始学为词并立师友之说，学词经历简略无阶段可考
- name_zh: 吴文英
  why_not: 仅存梦窗词笺评文字，无生平做事流信息
- name_zh: 周邦彦
  why_not: 只作词史评价对象，无事迹叙述
