source: 诗藏/词话/渚山堂词话.md
category: 诗藏/词话
verdict: has_candidates
candidates:
- name_zh: 张孝祥
  score: 6
  worth_why: 张安国帅幕宴席间赋六州歌头，忠愤之气令魏公流涕，词与心境、时局交织，名场面潜力足
  era: 南宋
  dates_known: true
- name_zh: 元好问
  score: 7
  worth_why: 赴试途中遇殉情孤雁，买而葬之累石为识，作摸鱼儿问世间情是何物，遂有雁丘，完整做事流与千古名篇兼具
  era: 金末
  dates_known: true
- name_zh: 文天祥
  score: 7
  worth_why: 拘囚之余和昭仪满江红，孤身分明月之句见其气节，做事流可与他传互证
  era: 宋末
  dates_known: true
- name_zh: 吴潜
  score: 6
  worth_why: 状元出身，豪迈不附权要，抖擞一春尘土债之句类其为人，遭际可作教训
  era: 南宋
  dates_known: true
- name_zh: 刘基
  score: 6
  worth_why: 避难江湖作水龙吟，自伤羁孤而后佐明成大业，不遇乃天老其材，际遇转折有启发
  era: 元末明初
  dates_known: true
rejections:
