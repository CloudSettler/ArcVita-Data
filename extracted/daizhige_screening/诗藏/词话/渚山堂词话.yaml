  why_not: 词话作者，其Begin自序所记多为词学考辨，无完整做事周期
- name_zh: 张商英
  why_not: 仅论其议论反复冒求荣进，事迹片段无完整做事流，且教训层面单薄
- name_zh: 李存勖
  why_not: 仅引如梦令一阕论亡国之音，事迹简略
- name_zh: 黄庭坚
  why_not: 仅记涪州送别一阕青玉案及暮年谶语，无做事周期
- name_zh: 秦观
  why_not: 仅句格比较，无事迹
- name_zh: 岳飞
  why_not: 已在库；本篇仅邵公序赠词一节
- name_zh: 严光
  why_not: 仅钓台题词考订作者，人物本身无事可记
- name_zh: 王昭仪
