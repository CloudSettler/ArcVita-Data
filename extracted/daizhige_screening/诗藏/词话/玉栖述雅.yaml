source: 诗藏/词话/玉栖述雅.md
category: 诗藏/词话
verdict: no_value
skip_reason: 本篇为词话札记，全系闺秀词句点评与摘句，人物皆无做事周期与生平脉络，唯一作者况周颐亦仅见批评自述，无完整成事流可考
rejections:
- name_zh: 况周颐
  why_not: 蕙风词话作者，文中仅见早年七夕词被端木子畴申诫与丙辰重九少作，无完整做事流，主要成就不在本文
- name_zh: 黄德贞
  why_not: 仅录擘莲词一首及正织女七夕之见的点评，无行事脉络
- name_zh: 钱斐文
  why_not: 仅摘词句数联，无生平与做事周期
- name_zh: 关瑛
  why_not: 仅有梦影楼词自序数语及词句摘评，做事流不完整
- name_zh: 顾太清
  why_not: 文中仅录定风波一序一句，无任何行事记载
- name_zh: 吴尚
  why_not: 仅点评写韵楼词句，无生平脉络
- name_zh: 孙致弥
  why_not: 仅述康熙间出使朝鲜手编采风录一事，事迹过简
- name_zh: 朱镇
  why_not: 作者先大母，仅记诗社与幼见数词，无做事周期
