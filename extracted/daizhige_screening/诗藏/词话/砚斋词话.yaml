skip_reason: 文献为清代词话，属文学批评札记，评骘历代词人作品优劣，无完整做事周期可考；所涉苏轼、辛弃疾、姜夔、邓肃等仅摘句评点，无缘起、关键决定与结果的过程记载
rejections:
- name_zh: 邓肃
  why_not: 先正言公虽有诗谏花石纲、拜左正言、罢归西山之迹，仅百余字概述，无阶段与关键决定细节，评5缓
- name_zh: 苏轼
  why_not: 已在库；此处仅词句评点与洞仙歌考辨，无新增做事流
- name_zh: 辛弃疾
  why_not: 已在库；仅论词风两派，无事迹
- name_zh: 姜夔
  why_not: 仅工于度曲之艺术评价，生平做事流缺
- name_zh: 邓廷桢
  why_not: 作者仅自述刊集、谒祠之事，无完整做事周期
