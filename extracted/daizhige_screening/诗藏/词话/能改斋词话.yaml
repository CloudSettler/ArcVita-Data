category: 诗藏/词话
verdict: no_value
skip_reason: 词话为词评杂录，仅辑词作与评点轶事，无完整做事周期可考之人；所涉苏轼、黄庭坚、秦观、柳永等均已被库收录或仅存数句轶闻
rejections:
- name_zh: 吴曾
  why_not: 作者本人传记者录无生平做事流，仅存此词话著述
- name_zh: 秦观
  why_not: 已在库；此处仅载千秋岁一阕与卒地轶闻
- name_zh: 贺铸
  why_not: 仅存青玉案一阕被山谷激赏一事，无完整做事周期
- name_zh: 聂冠卿
  why_not: 仅载多丽词创作一事及蔡襄寄书，事迹孤例
- name_zh: 张志和
  why_not: 仅录渔父词一阕及诸家和词，生卒与做事流不具
