candidates:
- name_zh: 辛弃疾
  score: 9
  worth_why: 风节建竖卓绝一时；每有成功辄为议者所沮；龙腾虎掷之词假之以鸣，悲壮激烈；事功与词章两条做事流俱全
  era: 南宋
  dates_known: true
- name_zh: 陈亮
  score: 8
  worth_why: 与辛弃疾气谊怀抱相合；据地一呼万里摇肢动骨之志；词直有宗留守大呼渡河之意；才相若而际遇蹭蹬可为教训
  era: 南宋
  dates_known: true
- name_zh: 姜夔
  score: 7
  worth_why: 白石老仙幽韵冷香；才子之词自成一家；后世张玉田等瓣香之，影响脉络可考
  era: 南宋
  dates_known: true
- name_zh: 秦观
  score: 7
  worth_why: 得花间尊前遗韵而自出清新；落红万点愁如海令山谷不敢和；其幽趣可为词风转型坐标
  era: 北宋
  dates_known: true
- name_zh: 刘过
  score: 6
  worth_why: 狂逸之中自饶俊致，净化自成一家；沁园春斗酒彘肩为名篇
  era: 南宋
  dates_known: true
- name_zh: 张炎
  score: 6
  worth_why: 清远蕴藉悽怆缠绵；悼王碧山效梦窗转益多师；由宋入元词风承变关键
  era: 宋末元初
  dates_known: true
- name_zh: 刘熙载
  score: 6
  worth_why: 撰艺概词概，论词主品骨，提出北宋南宋体用之辨，理论做事流完整
  era: 清代
  dates_known: true
