source: 诗藏/词话/苕溪渔隐词话.md
category: 诗藏/词话
verdict: has_candidates
candidates:
- name_zh: 李煜
  score: 8
  worth_why: 围城中作词、亡国后写虞美人一江春水向东流，由帝王沦为臣虏的词坛绝唱，做事流与教训俱全
  era: 五代南唐入宋
  dates_known: true
- name_zh: 柳永
  score: 8
  worth_why: 凡有井水处皆能歌柳词，因词流传禁中求官反遭黜落，奉旨填词一生沉浮可作教训
  era: 北宋
  dates_known: true
- name_zh: 侯蒙
  score: 7
  worth_why: 三十一岁乡贡、貌寝被画于纸鸢，作词自嘲终一举登第官至执政，大器晚成典型
  era: 北宋
  dates_known: true
- name_zh: 苏轼
  score: 8
  worth_why: 于此卷多见其知守、题壁、评词事迹，赤壁词寄奴娇等名作诞生点已有多条佐证
  era: 北宋
  dates_known: true
- name_zh: 孙洙
  score: 6
  worth_why: 锁院草制夜作菩萨蛮寄恨，词酒逸事有细节但做事流不完整
  era: 北宋
  dates_known: true
- name_zh: 胡仔
  score: 6
  worth_why: 著苕溪渔隐丛话考辨词话讹误，如辨李煜围城词作年，学术考据有方法论价值
  era: 南宋
  dates_known: true
- name_zh: 钱俶
  score: 5
  worth_why: 纳土归宋献词金凤欲飞遭掣搦得誓不杀钱王之诺，做亡国之君的另类结局
  era: 五代吴越入宋
  dates_known: true
rejections:
