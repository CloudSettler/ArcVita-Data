source: 诗藏/词话/词品.md
category: 诗藏/词话
verdict: no_value
skip_reason: 词品为词学评论著作，仅辑录历代词作并评骘，无完整做事周期可考；所涉李太白、白乐天、辛稼轩等多为风格品评，非事迹叙事
rejections:
- name_zh: 杨慎
  why_not: 书之作者，然传文仅见序言署名与补词二首，无生卒行事叙事，仅嘉靖间在世可考
- name_zh: 李白
  why_not: 已在库；此处仅引忆秦娥、菩萨蛮、清平乐词句评其词祖地位，无做事流
- name_zh: 白居易
  why_not: 已在库；仅引花非花、长相思等词条目，无生平事迹
- name_zh: 徐勉
  why_not: 有今宵且可谈风月一节显其严正，但仅轶事一则，做事流不完整
- name_zh: 刘裕
  why_not: 仅引丁都护歌辞并赞为一代英雄，无行事可考于本文
- name_zh: 陶弘景
  why_not: 已在库或非必有；仅列寒夜怨一首，无事迹
- name_zh: 隋炀帝
  why_not: 君主仅作时间坐标；仅录其词作名目，非变法级做事
- name_zh: 王褒
  why_not: 仅辨其为宇文周时人及录高句丽曲一首，无做事周期
- name_zh: 沈约
  why_not: 仅录六忆辞残篇，无生平行事
- name_zh: 谢芳姿
  why_not: 白团扇歌本事仅数句情爱轶闻，非可录入之做事时间轴
