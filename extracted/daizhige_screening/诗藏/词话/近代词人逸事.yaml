verdict: has_candidates
candidates:
- name_zh: 蒋春霖
  score: 6
  worth_why: 蒋鹿潭为咸同间词坛大家，一生落拓、垂虹桥仰药而死，与黄婉君殉情的悲剧极具名场面与警示潜力，可惜传文为逸事体，做事流仅片段
  era: 清末咸同
  dates_known: false
- name_zh: 郑文焯
  score: 6
  worth_why: 文小坡幕客四十年、著《词源斠律》、营冷红别墅填《冷红词》，鼎革后卖画为生，做事周期较完整可为文人处世之鉴
  era: 清末民国
  dates_known: true
- name_zh: 朱祖谋
  score: 6
  worth_why: 朱强村编选《宋词三百首》为词学宗师，雪夜与况蕙风探论词事场面动人，然本篇所记多为趣闻而非做事流
  era: 清末民国
  dates_known: true
- name_zh: 况周颐
  score: 5
  worth_why: 况蕙风谨严改稿、抱道在躬、识端方知遇之恩终生不忘，可作才士品格之教益，唯事迹零散
  era: 清末民国
  dates_known: true
- name_zh: 王国维
  score: 4
  worth_why: 王静安朴学大师间作小词事仅数行，另有成事儿时间轴大文献可据，本篇不足为据
  era: 清末民国
  dates_known: true
rejections:
