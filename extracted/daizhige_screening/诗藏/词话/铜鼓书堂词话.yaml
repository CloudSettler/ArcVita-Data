candidates:
- name_zh: 文天祥
  score: 9
  worth_why: 元军南下毁家纾难率兵勤王，出使被拘后逃脱再举义旗，兵败被俘不屈死节；留燕期间题双忠庙〈沁园春〉「为子死孝，为臣死忠」，正气凛然可耿日月，人生做事流与气节教训俱全
  era: 南宋末
  dates_known: true
- name_zh: 郑燮
  score: 7
  worth_why: 板桥未遇时谱〈沁园春·书怀〉直写寒士愤懑，后成诗书画三绝、滩县令任内有政声；乞食家世至七品官的奋进周期完整度中等
  era: 清乾隆
  dates_known: true
- name_zh: 张孝祥
  score: 7
  worth_why: 绍兴二十四年状元，历官建康留守，为岳飞鸣冤触忤秦桧；〈念奴娇·过洞庭〉「尽吸西江细斟北斗」为千古名场面，做事流较完整但主体是文学成就
  era: 南宋
  dates_known: true
- name_zh: 陈起
  score: 6
  worth_why: 钱塘书肆刊《江湖集》，因「秋雨梧桐皇子府」句卷入史弥远废立案获罪流配，牵出禁诗十年风波，是宋代出版与言论专案一桩公案，做事周期可考但细节多采自他书
  era: 南宋宝庆
  dates_known: true
