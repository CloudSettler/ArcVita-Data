candidates:
- name_zh: 袁枚
  score: 7
  worth_why: 乾隆三大家之首，倡性灵说数十年，主盟风雅、题壁访友唱和成派，诗话流弊与《续诗品》成就并存，做事流较完整
  era: 清乾隆年间
  dates_known: true
- name_zh: 蒋士铨
  score: 7
  worth_why: 三家中才气最盛，五七言古自成一家，兼善词曲九种曲，宦游南北收奇境入诗，评者推服至矣，有可考创作周期
  era: 清乾隆年间
  dates_known: true
- name_zh: 赵翼
  score: 8
  worth_why: 宦游数千里极险之地皆入诗料成诗中伟观，七律兼放翁初白之胜，更著《廿二史札记》揭古人之隐，学术与诗双重事功
  era: 清乾隆年间
  dates_known: true
- name_zh: 沈德潜
  score: 5
  worth_why: 同时期最早得名，格调说代表人物，然传文评其才力薄、格调入套，做事流简略
  era: 清乾隆年间
  dates_known: true
- name_zh: 张问陶
  score: 5
  worth_why: 诗近袁赵又自出新意，《宝鸡驿题壁十八首》力诋将帅养痈见忠愤，然传文仅一提
  era: 清乾隆年间
  dates_known: true
