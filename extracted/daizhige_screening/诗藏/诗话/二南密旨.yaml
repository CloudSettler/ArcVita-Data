source: 诗藏/诗话/二南密旨.md
category: 诗藏/诗话
verdict: no_value
skip_reason: 文献为诗学理论著作（论六义、物象比兴等），非人物传记，无任何人物做事流、历官事迹或完整人生周期可抽取；撰者贾岛亦无传记性内容，大量诗句引文中人物仅为例证片段（如屈原、陶潜、谢灵运仅一句）
rejections:
- name_zh: 贾岛
  why_not: 仅署名旧题撰者，无生平行事叙述，推敲等名场面不在本传文
- name_zh: 屈原
  why_not: 已在库，且此处仅数语概述离骚缘起，非完整传记
- name_zh: 陶潜、谢灵运、鲍照、钱起、卢纶、李嘉祐、李端、皇甫冉、左思等
  why_not: 仅作为诗例被引用一二句，无任何做事周期与关键决策，评分 1 不录
