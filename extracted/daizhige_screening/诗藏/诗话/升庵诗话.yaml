  worth_why: 明代第一才子；状元及第而以大礼议获罪谪戍滇南三十余年，著述四百余种；谥号文宪；升庵诗话考据广博而好伪撰古书，成一家之学又多可议处，敷 esi 异 与品质 vs 苛求 的良好案例，名场面为
    滚滚长江东逝水 临江仙
  era: 明代正德嘉靖年间
  dates_known: true
- name_zh: 丁福保
  score: 7
