source: 诗藏/诗话/卧雪诗话.md
category: 诗藏/诗话
verdict: no_value
skip_reason: 袁嘉谷《卧雪诗话》为民国诗话类著作，内容以论诗法、评诗作为主，人物均为只言片语的评点，无可考的完整做事周期与名场面，时间线与关键决策缺失，不构成成事儿时间轴素材
rejections:
- name_zh: 袁嘉谷
  why_not: 作者自述著诗话缘起，仅见编纂动机与家宅题榜等琐事，无完整事业阶段
- name_zh: 钱谦益
  why_not: 仅评其诗才及《秋兴》和作，无做事流
- name_zh: 盛昱
  why_not: 只录诗篇佳句与诗集刊刻情况，无事业过程
- name_zh: 袁嘉谷之先兄（雪樵）
  why_not: 仅存送人从军诗二首，人物生平事迹无考
- name_zh: 周荃（楚香）
  why_not: 仅记其从学问诗与诗集佳句，无做事周期
- name_zh: 张月槎
  why_not: 评其骈散文工力与诗集刊刻瑕疵，无完整事迹线
- name_zh: 沈约
  why_not: 提及其首倡声律之说，但文本仅作韵学考辨，无阶段化做事叙述
- name_zh: 异牟寻
  why_not: 仅引南诏五古诗出处，事迹过简
