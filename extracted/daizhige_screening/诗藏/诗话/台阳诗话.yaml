candidates:
- name_zh: 郑成功
  score: 9
  worth_why: 开台第一伟人，抗清复明、驱逐荷兰收台湾，弱冠请缨、赐姓延平，完整做事流且遗恨台湾
  era: 明末清初
  dates_known: true
- name_zh: 王松
  score: 8
  worth_why: 甲申法扰台前预警十年割台之祸，乙未携眷内渡遭盗倾家，拒受官衔、不为日吏所用，以诗酒自守成遗民，著诗话四种
  era: 清末日据台湾
  dates_known: true
- name_zh: 邱逢甲
  score: 6
  worth_why: 乙未抗日士绅领袖、诗名卓著，唯本篇仅提及其出吴子光门下
  era: 清末民国
  dates_known: true
- name_zh: 林占梅
  score: 6
  worth_why: 潜园主人，方伯衔诗人，乙未前后台湾文化界要角，本篇仅存诗句
  era: 清道光至光绪台湾
  dates_known: true
- name_zh: 吴子光
  score: 6
  worth_why: 品学兼优著一肚皮集，吕赓年、邱逢甲皆出其门，唯事迹简略
  era: 清末台湾
  dates_known: false
- name_zh: 林维垣
  score: 5
  worth_why: 乙未让台进退维谷、忧时而卒，有代表性遗民困境
  era: 清末台湾
  dates_known: false
- name_zh: 施士洁
  score: 5
  worth_why: 进士诗人，诗文见气性，唯本篇事迹简略
  era: 清末台湾
  dates_known: true
