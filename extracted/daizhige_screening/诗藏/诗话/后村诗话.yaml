candidates:
- name_zh: 刘克庄
  score: 8
  worth_why: 南宋江湖诗派领袖、晚号后村，历仕理宗朝以龙图阁学士致仕，编《文章正宗》诗歌门与真德秀多有取舍之争，晚年陆续成前后后集续集新集十四卷诗话，持论精核迥出南宋诸家，做事流与年代可考
  era: 南宋
  dates_known: true
- name_zh: 曹植
  score: 8
  worth_why: 卷一详评其夺嫡之危而深自敛退、丁仪被诛辞不连植、黄初贬削中作诗责躬上表求自试，终以恭顺自全，仁且智，处世有垂范之义
  era: 三国魏
  dates_known: true
- name_zh: 杜甫
  score: 8
  worth_why: 诗话称其独步千古、感时伤事句法俱在，与严武府中之变及《八哀诗》忠厚之言可成一段做事流
  era: 唐
  dates_known: true
- name_zh: 陈子昂
  score: 7
  worth_why: 首倡高雅冲澹之音一扫六代纤弱，太白韦柳皆自其出，唐诗变革关键人物
  era: 唐
  dates_known: true
- name_zh: 真德秀
  score: 6
  worth_why: 作《文章正宗》以世教民彝为主、删克庄所取，与刘克庄论诗标准之争为学术公案
  era: 南宋
  dates_known: true
