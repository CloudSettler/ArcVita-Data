source: 诗藏/诗话/吴礼部诗话.md
category: 诗藏/诗话
verdict: no_value
skip_reason: 文献为诗话札记，以诗文笺注考订为主，无完整做事周期的人物传记；所涉陶渊明、朱熹等多为文本评论而非事迹纪事，且陶渊明等主要人物无可考做事流叙事
rejections:
- name_zh: 吴师道
  why_not: 作者仅以考据者身份出现，无生卒与做事流事迹
- name_zh: 陶渊明
  why_not: 仅就《述酒》等诗篇作笺注讨论，非完整传记做事周期，且人物已属评论对象非纪事主体
- name_zh: 朱熹
  why_not: 仅引其《感兴》诗并录诸家解说，无做事流叙事
- name_zh: 仲长统
  why_not: 仅一句评其《述志》诗，无事迹
- name_zh: 汤伯纪
  why_not: 仅以注家身份出现，无生平做事记载
- name_zh: 卫武公
  why_not: 仅引《抑》诗评点数句，无做事周期
- name_zh: 杜常
  why_not: 仅考订其《华清宫》诗作者归属，无生平可考
