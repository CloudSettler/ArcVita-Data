verdict: has_candidates
candidates:
- name_zh: 唐庚
  score: 8
  worth_why: 本文献主角，世称唐子西，工诗善论，贬惠州沿途作诗赋见南迁情状，晚年力请宫祠归老锦江，绝笔〈留别〉诗；五十一岁卒于凤翔，生卒与活动年代可考
  era: 北宋末
  dates_known: true
- name_zh: 苏轼
  score: 9
  worth_why: 文中多处见其炼字改诗功夫（病鹤诗缺字改阁、十字道尽蛟食渴虎），赤壁二赋一洗万古；一生宦游贬谪而文章诗艺达巅峰，做事流完整
  era: 北宋
  dates_known: true
- name_zh: 杜甫
  score: 9
  worth_why: 诗圣，代表曲目极多：〈北征〉〈秦中纪行〉岳阳楼诗气象闳放；经安史之乱漂泊西南而诗益工，典型忧患成就大师
  era: 盛唐
  dates_known: true
- name_zh: 韩愈
  score: 8
  worth_why: 古文运动领袖，文起八代之衰；〈琴操〉得体、〈罗池庙碑〉感人，为文之法被后世奉为圭臬
  era: 中唐
  dates_known: true
- name_zh: 欧阳修
  score: 8
  worth_why: 北宋文宗，〈昼锦堂记〉〈居士集序〉显示为文章法；绵州六一堂典故并有生地可考
  era: 北宋
  dates_known: true
- name_zh: 陶渊明
  score: 8
  worth_why: 晋人造语之尤，〈桃花源记〉语简妙，四时自成岁见天趣；挂冠归隐的完整人生决断
  era: 东晋
  dates_known: true
- name_zh: 王安石
  score: 7
  worth_why: 变法名相兼诗家，五字诗得子美句法；做事流完整但本文献仅露诗艺一面
  era: 北宋
  dates_known: true
- name_zh: 司马光
  score: 8
  worth_why: 著《资治通鉴》十九年成书垂世，苏辙引其作议论商略古人之法，完整著述工程
  era: 北宋
  dates_known: true
- name_zh: 皎然
  score: 6
  worth_why: 唐诗僧，评诗改字掌中预写中字与僧定交，见诗律严谨与识人功夫
  era: 中唐
  dates_known: false
rejections:
- name_zh: 强行父
  why_not: 记述者，仅有追录师说之事，无独立做事周期
- name_zh: 关注
  why_not: 仅同游请托追录，事迹无考
- name_zh: 谢固
  why_not: 仅绵州建六一堂一事，事迹零星
