verdict: no_value
skip_reason: 本书为南宋谢伋所撰诗文评类著作，专论四六骈文之工拙，所载皆为文人启表制诰中的零散佳句赏析，无人物完整做事周期
rejections:
- name_zh: 谢伋
  why_not: 仅知其为谢克家之子、官至太常少卿，著四六谈麈，无完整做事流
- name_zh: 谢克家
  why_not: 散见草制辞官诸事，碎片无周期
- name_zh: 綦崇礼
  why_not: 仅存草制弹文数联，无做事周期
- name_zh: 翟汝文
  why_not: 散见表启佳句，无成事主线
- name_zh: 汪藻
  why_not: 词章片段评点，无做事流
- name_zh: 陈与义
  why_not: 仅草制贴改一事，事迹过简
- name_zh: 李清照
  why_not: 只引祭文一联，无做事内容
