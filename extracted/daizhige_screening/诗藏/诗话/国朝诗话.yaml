category: 诗藏/诗话
verdict: has_candidates
candidates:
- name_zh: 王士禛
  score: 7
  worth_why: 一代诗宗，主持风雅数十年，神韵说宗主；多次奉使典试、扬州榷税有政声，做事流较完整，不过《蜀道集》入蜀诸作正是名场面
  era: 清康熙
  dates_known: true
- name_zh: 孔尚任
  score: 7
  worth_why: 以侯方域、李香君事作《桃花扇》传奇，为戏曲名场面；借兴亡寄托感情，有完整创作周期
  era: 清康熙
  dates_known: true
- name_zh: 吴伟业
  score: 6
  worth_why: 忍死偷生廿载馀的自愧之作，梅村体名场面；出仕清廷与忏悔构成成长与教训
  era: 明末清初
  dates_known: true
- name_zh: 朱彝尊
  score: 6
  worth_why: 与王士禛并称南朱北王，博学鸿词科入翰林，编《明诗综》，才藻学问型做事流可考
  era: 清康熙
  dates_known: true
- name_zh: 陈鹏年
  score: 5
  worth_why: 国朝伟人，历官有廉声多为民命，迭遭倾陷而不改节，教训义强但本篇行事简略
  era: 清康熙
  dates_known: true
- name_zh: 尤侗
  score: 5
  worth_why: 以《读离骚》乐府邀睿鉴赏识入翰林，音律殁后仍留余韵，纪闻价值佳而做事流偏短
  era: 明末清初
  dates_known: true
- name_zh: 钱谦益
  score: 5
  worth_why: 依附权要失节为负例，诗坛领袖与晚节反复对照鲜明，教训义强但本篇未列行事
  era: 明末清初
  dates_known: true
rejections:
- name_zh: 杜濬
  why_not: 本篇仅记索彩立成长歌与咏苏一绝，行事零散
- name_zh: 陈廷敬
  why_not: 仅录《闻笛》一绝，无做事周期
- name_zh: 冒襄
  why_not: 仅述水绘园宾客唱和之盛，事迹未附则
- name_zh: 魏象枢
  why_not: 仅一首《循吏行》，无行事可据
- name_zh: 佟钺妻赵恭人
  why_not: 早寡鞠子成进士，属节孝轶闻非完整周期
