verdict: has_candidates
candidates:
- name_zh: 杨一清
  score: 7
  worth_why: 平定宸濠之乱背后谋臣，武宗亲征后驻跸其第赐诗二十首，荣宠至极；罢政归休而再起定大事
  era: 明·成化至嘉靖
  dates_known: true
- name_zh: 文徵明
  score: 9
  worth_why: 宁王宸濠重金征聘，托病坚拒不就；后宁藩败，凡应辟者崎岖万状，公独晏然，识人之明与守节之清堪为后世典范
  era: 明·弘治至嘉靖
  dates_known: true
- name_zh: 王鏊
  score: 7
  worth_why: 内阁重臣急流勇退，归居吴中为世所重；石田临殁答诗称其勇退出万人中
  era: 明·成化至正德
  dates_known: true
- name_zh: 沈周（石田）
  score: 6
  worth_why: 一代画坛宗师，隐居不仕，诗画双绝；本条仅载临殁绝笔事，做事流欠完整
  era: 明·成化至正德
  dates_known: true
- name_zh: 唐寅
  score: 7
  worth_why: 解元才子而科场遭厄，晚年卖画为生不使人间造孽钱，名场面与人生教训兼备
  era: 明·成化至嘉靖
  dates_known: true
- name_zh: 邵宝
  score: 6
  worth_why: 乞归终养上疏不允，臣分浅而心事深的忠孝两难；仅一诗一节，做事流较短
  era: 明·成化至嘉靖
  dates_known: true
