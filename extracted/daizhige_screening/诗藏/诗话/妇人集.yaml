- name_zh: 长平公主
  score: 7
  worth_why: 甲申之变帝剑亲裁断臂不死，上书顺治帝请为尼后赐婚周世显，亡国公主命运有完整做事流
  era: 明末清初
  dates_known: true
- name_zh: 陈圆圆
  score: 8
  worth_why: 色艺冠绝江南，经武安侯刘宗敏吴三桂层层易主，冲冠一怒为红颜之主角，名场面潜力大
  era: 明末清初
  dates_known: true
- name_zh: 柳如是
  score: 8
  worth_why: 河东君才情照人，钱谦益筑我闻室以居，鸳湖百韵诗互赠，明亡气节事可考
  era: 明末清初
  dates_known: true
- name_zh: 寇白门
  score: 7
  worth_why: 自赎自救的谈判名场面：对朱国公言一月可致万金报之，果如其言，胆识可法
  era: 明末清初
  dates_known: true
- name_zh: 临淮老妓
  score: 7
  worth_why: 甲申京陷贼骑充斥无人敢行，独持匕首间关数千里穿贼垒侦两宫音息，忠义奇事
  era: 明末清初
  dates_known: true
- name_zh: 徐灿
  score: 7
  worth_why: 小词绝佳，南宋以来闺房之秀一人而已，词作可考可系年
  era: 明末清初
  dates_known: true
- name_zh: 叶小鸾
  score: 7
  worth_why: 叶绍袁三女中琼章尤英彻，诗辞绝有思致，午梦堂一门风雅，早逝成文学女神话
  era: 明末
  dates_known: true
- name_zh: 方维仪
  score: 7
  worth_why: 精禅藻工白描大士，著清芬阁集宏赡亚于曹大家，桐城名门女师典型
  era: 明末清初
  dates_known: true
- name_zh: 纪映淮
  score: 6
  worth_why: 栖鸦流水点秋光一句名传，王士祯为之赋秦淮杂诗，可惜其生平仅此
  era: 明末清初
  dates_known: true
- name_zh: 冒褒
  score: 7
  worth_why: 集中屡见，此为编纂线索人物，非传记主角，其事迹当从献流考
  era: 清初
  dates_known: true
