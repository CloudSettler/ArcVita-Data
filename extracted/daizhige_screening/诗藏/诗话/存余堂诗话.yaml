verdict: no_value
skip_reason: 《存余堂诗话》为明代诗话笔记，主要辑录诗评、诗句赏析与考订（如乐府命题、宫词真伪、琢句格法），所涉人物仅有零星轶事片段，无完整做事周期与可考生卒主要活动年代，不构成可录入事迹的时间轴材料
rejections:
- name_zh: 朱承爵
  why_not: 诗话作者，仅见论诗主张，无做事流
- name_zh: 王维、孟浩然
  why_not: 仅一句苦吟轶闻，已有库人物且无做事周期
- name_zh: 李白、王阳明（王伯安）
  why_not: 仅引诗句与一则轶事，无完整做事可考，且李白等事见于他传主传
- name_zh: 张灵
  why_not: 仅有临终诗二首，无做事周期
- name_zh: 黄省曾、朱承爵所记诸评家
  why_not: 皆诗评考订片段，无完整做事时间轴，生卒与活动年代亦不足考
