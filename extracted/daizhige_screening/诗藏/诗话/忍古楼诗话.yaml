candidates:
- name_zh: 易顺鼎
  score: 7
  worth_why: 幼陷贼中得僧格林沁救还的神童传奇；官至兵备道被劾罢官，潦倒以死；与扶乩谶语、题张梦晋画等名场面，一生起落可成一轴线
  era: 清末民国
  dates_known: true
- name_zh: 梁鼎芬
  score: 6
  worth_why: 诗名孤怀远韵，与曾习经并称；遗诗身后由余绍宋搜编成六卷，做事流偏整理而非本人事业
  era: 清末民国
  dates_known: true
- name_zh: 范当世
  score: 6
  worth_why: 以文为诗，气盛言宜；卖文千金被盗、董卿成谶一节有戏剧性；有作诗旨趣之自道
  era: 清末
  dates_known: true
- name_zh: 华焯
  score: 5
  worth_why: 冷俊深刻绝弃凡响自成一家，操行高洁晦迹乡里；但生平线索少，做事周期不完整
  era: 清末民国
  dates_known: false
- name_zh: 杨增荦
  score: 5
  worth_why: 愤朝政欲归隐购废寺而遭土豪阻挠殴伤其子，转折可记；岭南失诗稿亦一事件
  era: 清末民国
  dates_known: false
