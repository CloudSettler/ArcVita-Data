skip_reason: 《怀麓堂诗话》为诗论批评之作，正文皆为论诗法度、评骘古人诗句，无人物完整做事周期可考；所涉李白、杜甫、王维等仅作论据引述，非传记事迹；作者李东阳生平仅见于提要数语，无做事流文本
