candidates:
- name_zh: 李梦阳
  score: 9
  worth_why: 前七子领袖，倡言复古扫除台阁体，上书言事两度下狱，归乡读书射猎，做事流完整，为『文必秦汉诗必盛唐』代表
  era: 明弘治正德间
  dates_known: true
- name_zh: 何景明
  score: 8
  worth_why: 与李梦阳并称何李，弘正间才力互称，亦有宦海沉浮与学政事迹
  era: 明弘治正德间
  dates_known: true
- name_zh: 李攀龙
  score: 7
  worth_why: 后七子领袖，与王世贞交好，慨然续李何未竟之业，评价高但本文事疏
  era: 明嘉靖间
  dates_known: true
- name_zh: 谢榛
  score: 7
  worth_why: 布衣诗人，弱冠任侠后折节读书，诗宗法少陵，五七言律得其十九
  era: 明嘉靖间
  dates_known: false
- name_zh: 高启
  score: 8
  worth_why: 明初诗人之冠，因魏观案腰斩，遭时不吊而诗成悲剧名场面
  era: 元末明初
  dates_known: true
- name_zh: 王廷陈
  score: 6
  worth_why: 传文被截断，桀骜诗人，事不详完，暂缓
  era: 明正德嘉靖间
  dates_known: false
- name_zh: 徐祯卿
  score: 6
  worth_why: 吴中四才子之一，诗本清华而夭折，三十三岁卒，有淡淡做事痕迹
  era: 明弘治正德间
  dates_known: true
- name_zh: 唐顺之
  score: 7
  worth_why: 攻讦何李剽窃之弊，稍振初唐，上书忤旨斥为民，别纪另有作为（抗倭）可补
  era: 明嘉靖间
  dates_known: true
- name_zh: 王世贞
  score: 8
  worth_why: 撰者本人，后七子宗主，本叙见其衡量李何与少陵之源流见识，文学批评做事流完整
  era: 明嘉靖万历间
  dates_known: true
