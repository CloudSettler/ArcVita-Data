- name_zh: 黄遵宪
  score: 7
  worth_why: 诗界革命主将，独辟异境，人称中国诗界之哥仑布；有外交与变法经历，做事周期可考
  era: 清末
  dates_known: true
- name_zh: 李叔同
  score: 6
  worth_why: 才艺横溢而出家为弘一法师，一生两阶段反差极大，名场面（送别、出家）与教训（绚烂之极归于平淡）兼备；此处仅见其早期诗才
  era: 清末民国
  dates_known: true
- name_zh: 戴名世
  score: 6
  worth_why: 修史获罪罹文字狱，一生穷困而志在明史，其论诗之语见风骨；可作文字狱警示案例
  era: 清初
  dates_known: true
