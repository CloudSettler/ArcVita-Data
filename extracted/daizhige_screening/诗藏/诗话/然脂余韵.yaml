candidates:
- name_zh: 汪宜秋
  score: 6
  worth_why: 丰才啬遇贫至绝食，竹溪诸子敛金周济，其谢诗与刘景叔'不得志天下当共养之'之论可成一段风义佳话
  era: 清中期
  dates_known: false
- name_zh: 李因
  score: 6
  worth_why: 葛徵奇妾，崇祯末遇兵难以身障护夫主得免；擅花卉画，'郎君反得蛾眉护，铁骑丛中返故关'具名场面潜力，晚年寄迹茅庵明亡守节
  era: 明末清初
  dates_known: false
- name_zh: 金文沙
  score: 5
  worth_why: 早寡工诗不轻示人，阮元误收其诗于两浙輶轩录而作诗自辩立言有体，兼能画
  era: 清中期
  dates_known: false
- name_zh: 吴琼仙
  score: 5
  worth_why: 与夫徐山民同声耦歌偕游题壁，袁枚过访誉为徐淑之才在秦嘉之上；殁后夫检得其题诗缄寄甘亭请制诔，情事动人但做事流仍简
  era: 清中期
  dates_known: false
