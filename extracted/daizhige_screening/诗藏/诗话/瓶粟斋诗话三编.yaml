candidates:
- name_zh: 卢仝
  score: 5
  worth_why: 隐居洛阳拒不谒权贵，操守可述，韩愈寄诗见敬；然正史无传，事迹赖诗存，做事流残缺
  era: 唐代
  dates_known: false
- name_zh: 王十朋
  score: 5
  worth_why: 愤靖康之难，存复仇之志，奏议以用人为先备寇为急；然诗话仅评其诗，行事简略
  era: 南宋
  dates_known: true
- name_zh: 林景曦
  score: 4
  worth_why: 宋义士遗民诗人，诗风幽秀取法唐贤；然文本仅存诗评，无可考做事周期
  era: 宋末元初
  dates_known: false
- name_zh: 冯良
  score: 4
  worth_why: 捧檄迎督邮耻在厮役，杀马裂冠遁隐十余年，志行坚苦过陶潜而不为人知；然仅附传数句
  era: 东汉
  dates_known: true
