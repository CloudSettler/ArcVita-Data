source: 诗藏/诗话/石洲诗话.md
category: 诗藏/诗话
verdict: no_value
skip_reason: 《石洲诗话》为清代翁方纲的诗论笔记，通篇评骘诗格、考订源流，人物仅作诗学坐标被提及，无做事周期、无关键决策与结果，不可录入成事儿时间轴
rejections:
- name_zh: 翁方纲
  why_not: 仅为诗话作者，文中无其完整做事经历记载
- name_zh: 王维
  why_not: 仅作为被评对象提及诗艺，非做事流记载
- name_zh: 李白
  why_not: 仅评其诗格调与复古路径，非传记性做事周期
- name_zh: 陈子昂
  why_not: 仅论其《感遇》复古之功，事迹简略非做事流
- name_zh: 杜甫
  why_not: 全书以杜诗为评鉴参照，非其传略，无可录事件
- name_zh: 元结
  why_not: 仅评其诗朴拙与《箧中集》旨趣，无完整做事周期
- name_zh: 李峤
  why_not: 仅存明皇闻《汾阴行》掩泣一则故实，非其本人做事周期
