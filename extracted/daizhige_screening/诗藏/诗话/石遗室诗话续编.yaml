candidates:
- name_zh: 陈衍
  score: 7
  worth_why: 同光体诗论宗师，著《诗话》前后数十卷、另有《锺嵘诗品平议》刻本单行，与先室人《萧闲堂札记》商榷古作者疵类，诗学做事流完整，是宋诗派理论成型关键人物
  era: 清末民国
  dates_known: true
- name_zh: 陈柱
  score: 7
  worth_why: 枕胙经子、著书等身，有《待焚诗稿》数千首绝不规仿古人，国难中作《国殇》、《哀闸北》等感愤时事诗篇，创作缘起与成果可考
  era: 民国
  dates_known: false
- name_zh: 冯振
  score: 6
  worth_why: 精小学及子部书，教授江南各大学，《苟子讲记》多切当，诗有雄直气，治学与创作事迹较简
  era: 民国
  dates_known: false
- name_zh: 钟嵘
  score: 6
  worth_why: 著《诗品》标举五言极则、轶事流传不废，然陈衍指其品第颠倒（列曹操下品、刘桢上品）且自不能诗，教训型人物
  era: 南朝齐梁
  dates_known: false
- name_zh: 苏轼
  score: 5
