candidates:
- name_zh: 司马光
  score: 7
  worth_why: 本册为续欧阳修六一诗话之作，品第诸诗精严，论杜甫国破山河在一首尤见诗学见识；其人另有资治通鉴涑水纪闻等完整事业流可考
  era: 北宋
  dates_known: true
- name_zh: 魏野
  score: 7
  worth_why: 处士隐居陕州，因题寺柱诗得名；真宗西祀遣中使召之，闭户逾垣而遁；又上诗劝王旦急流勇退、赠寇准好去上天辞将相；死后诏免子孙科役，可见致仕修身做事流完整
  era: 北宋真宗朝
  dates_known: true
- name_zh: 范镇
  score: 7
  worth_why: 六十三岁致仕后径自入蜀归乡，与乡人乐饮散财济贫，遍游峨眉青城巫峡荆门，期岁作诗二百五篇，功成身退践行彻底，堪为士大夫退隐典范
  era: 北宋
  dates_known: true
- name_zh: 杨朴
  score: 6
  worth_why: 不仕处士，太宗召见赋蓑衣诗除官不受，听归山，年年乞与人间巧一首传世，有处世态度可资启发
  era: 北宋初
  dates_known: true
- name_zh: 刘槩
  score: 6
  worth_why: 举进士为幕僚一任不得志即弃官隐居野原山，穷探幽险不畏虎豹，读书误人四十年一句见其自省，有教训与选择
  era: 北宋
  dates_known: true
- name_zh: 石延年
  score: 6
  worth_why: 曼卿醉鹤舞白驴，章献太后挽歌一联首出切合时宜，又对出月如无恨月长圆敌天若有情天亦老，名场面与才情记载具备
  era: 北宋
  dates_known: true
