candidates:
- name_zh: 赵藩
  score: 7
  worth_why: 训导十年勤于教士成就甚众，从军宦游补永宁道署臬司，坚定有识洞达治体，著有《向湖村舍诗初集》，成都武侯祠攻心联作者，可考完整做事流
  era: 晚清民国
  dates_known: true
- name_zh: 袁世凯
  score: 9
  worth_why: 庚子力主剿拳，联合刘坤一、张之洞东南互保，收回天捧日之功；后小站练兵、辛亥 Poor 逼清帝退位、称帝败亡，做事流完整而教训极深
  era: 晚清民国
  dates_known: true
- name_zh: 马其昶
  score: 7
  worth_why: 桐城派嫡传，宗法方苞姚鼐，宣统三年避乱南归键户潜研群籍，学术坚守有成
  era: 晚清民国
  dates_known: true
- name_zh: 孙景贤
  score: 6
  worth_why: 负笈东瀛肄习法政，民国司法要职有声，庚子避乱家变亦具故事性，惟事迹较简略
  era: 晚清民国
  dates_known: true
- name_zh: 陈三立
  score: 8
  worth_why: 同光体诗坛领袖，维新参与其父陈宝琛（应为陈宝琛同辈陈宝箴）变法局中，散原精舍诗名满天下，做事流可考
  era: 晚清民国
  dates_known: true
- name_zh: 林纾
  score: 7
  worth_why: 不通外文而译述西洋小说百余种开风气，古文家卫道与新文化运动对垒，有完整做事流与争议教训
  era: 晚清民国
  dates_known: true
