candidates:
- name_zh: 沈约
  score: 7
  worth_why: 据《四声切韵》参以己意撰《四声类谱》，声律论奠基人，完成平上去入分韵之创举，做事流可从齐梁声律运动考出
  era: 南朝齐梁
  dates_known: true
- name_zh: 陆法言
  score: 7
  worth_why: 撰《切韵》五卷，韵书之肇始，东冬锺分部立后世二百六韵之制，名场面与代表作出众，隋统一音清浊之关键决策
  era: 隋
  dates_known: true
- name_zh: 顾炎武
  score: 7
  worth_why: 著《音学五书》独出经文、乾嘉古音学开山，与吴棫之争为学术争论名场面，做事流与教训兼备（四声转叶之失可为警）
  era: 明清之际
  dates_known: true
- name_zh: 周颙
  score: 6
  worth_why: 辨平仄著《四声切韵》首开四声之分，开风气的关键节点，然事迹简略
  era: 南朝齐
  dates_known: true
- name_zh: 吴棫
  score: 6
  worth_why: 古韵研究绝学肇始，撰《韵补》引证五十余种逸书而不免博而不精，可为学术教训
  era: 南宋
  dates_known: true
