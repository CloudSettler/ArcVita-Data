candidates:
- name_zh: 张巡
  score: 9
  worth_why: 死守睢阳四十九日三千余战，食尽不降，忠义典范，名场面极强
  era: 唐安史之乱
  dates_known: true
- name_zh: 王维
  score: 8
  worth_why: 凝碧池诗救己一命，陷贼伪朝而得宥，唐朝诗人生死抉择完整做事周期
  era: 盛唐
  dates_known: true
- name_zh: 冯道
  score: 9
  worth_why: 自请北使契丹，舍身纾国难，诗谢殊礼，历事多朝的争议典范
  era: 五代
  dates_known: true
- name_zh: 种放
  score: 7
  worth_why: 隐居终南山，一诗‘胡雏负思信圣主耻干戈’促成罢兵议和，隐士型决策点清晰
  era: 北宋初
  dates_known: true
- name_zh: 魏野
  score: 7
  worth_why: 隐士不邀权贵，赠诗讽寇准辞富贵，诗谶应验寇准被贬，教训意味浓
  era: 北宋
  dates_known: true
- name_zh: 寇准
  score: 8
  worth_why: 一生沉浮与魏野诗谶相映，礼贤简傲之变与晚年贬死形成完整教训叙事
  era: 北宋
  dates_known: true
- name_zh: 刘吉
  score: 7
  worth_why: 手负囊土 fseek治河、荡舟慑服内侍、不忘李煜旧恩，做事流完整人称刘跋河
  era: 北宋初
  dates_known: true
- name_zh: 王旦
  score: 7
  worth_why: 中书近二十年，受魏野诗讽而累表求退，贤相知进退
  era: 北宋
  dates_known: true
