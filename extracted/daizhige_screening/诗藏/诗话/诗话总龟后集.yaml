candidates:
- name_zh: 赵匡胤
  score: 6
  worth_why: 与徐铉殿上斗诗一段疑传：微时醉卧田间偶得未离海底千山黑才到天中万国明之句，气压江南使者；然仅一则轶事无完整做事流
  era: 五代宋初
  dates_known: true
- name_zh: 杨亿
  score: 5
  worth_why: 以谗佯狂去职而真宗眷顾不衰，后与寇准协定大策功虽不终；诗话所记多为片段
  era: 北宋
  dates_known: true
- name_zh: 欧阳修
  score: 5
  worth_why: 嘉祐二年同知贡举锁院五十日与五人唱和百余篇，一时文坛盛事；属花絮非做事周期
  era: 北宋
  dates_known: true
- name_zh: 牛希济
  score: 5
  worth_why: 蜀亡后赋诗不讥旧主，明宗称其不忘君亲赐彩百段；忠义一节可记但事迹简略
  era: 五代
  dates_known: true
