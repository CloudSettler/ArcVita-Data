- name_zh: 李公时勉
  why_not: 仅引其咏剪刀诗以见直节者诗妩媚，无做事周期
- name_zh: 僧元覧
  why_not: 留下大海从鱼跃名句并有涂垩三才子事，但事迹过简不足成时间轴
