- name_zh: 杨慎
  score: 6
  worth_why: 状元才子因大礼议贬谪云南，在绝境中凭记忆著述数百种，此即升庵诗话补遗，谪居成学堪称逆境为学典范
  era: 明代
  dates_known: true
rejections:
