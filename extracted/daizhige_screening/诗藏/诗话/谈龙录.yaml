candidates:
- name_zh: 赵执信
  score: 8
  worth_why: 谈龙录主角；与王士禛神韵说对垒，谈龙一段成诗学公案；窃得律诗秘传又坚持冯班之学；因诗中有人之论遭构陷疏远，晚年著书自明，做事弧线完整且成语名场面俱在
  era: 清康熙年间
  dates_known: true
- name_zh: 王士禛
  score: 7
  worth_why: 主盟诗坛以神龙论诗开神韵一派；唐贤三昧集选政与取舍去留；身居名位日盛而不肯尽授律调，可作正反两面素材
  era: 清康熙年间
  dates_known: true
- name_zh: 洪升
  score: 6
  worth_why: 谈龙之辩的发起者，以雕绘全体论诗与神龙说对峙；长生殿作者，事迹于此录虽简但年代可考
  era: 清康熙年间
  dates_known: true
- name_zh: 阎若璩
  score: 7
  worth_why: 校勘《唐贤三昧集》勘谬三家如御亭、涔阳、京水，考据精核前无古人；受言实难一段见学术交锋名场面
  era: 清康熙年间
  dates_known: true
