candidates:
- name_zh: 梁章钜
  score: 8
  worth_why: 宦历中外四十年，著述等身，论语旁证、三国志旁证、文选旁证兼订正裴注李注缺失，做事周期完整且成果可考
  era: 清代嘉道年间
  dates_known: true
- name_zh: 林瑛佩
  score: 8
  worth_why: 耿变之乱父下狱，藏弟于深山、袖刃自防、日食饷狱、肢疗母疾、终免父难，危局决策与结果俱全，兼工诗
  era: 清初
  dates_known: false
- name_zh: 陈玉瑛
  score: 7
  worth_why: 还婢毁约之仁、退讼者之义、训子成名，治家教子成完整做事流，著有兰居吟草
  era: 清代
  dates_known: false
- name_zh: 徐氏
  score: 6
  worth_why: 长于史学著有二十一史评，惜书与传俱佚，仅存忆姊诗三首见其壮志
  era: 明末清初
  dates_known: false
- name_zh: 林蕙
  score: 5
  worth_why: 著香咳集有名声，然集已佚，事迹仅咏兰二十字
  era: 清代
  dates_known: false
