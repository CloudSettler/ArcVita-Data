- name_zh: 袁枚
  score: 9
  worth_why: 性灵派宗师；二十一岁被荐博学宏词、朝考险遭黜落而尹公力保得馆选；辞官筑随园以诗为业数十年，著《随园诗话》自成一家，做事流完整
  era: 清乾隆
  dates_known: true
- name_zh: 鄂尔泰
  score: 7
  worth_why: 郎中时自叹不遇，后出将入相为七省经略，以武侯自命；改土归流等大事虽传中未详，其心迹转折可作时间轴
  era: 清雍正
  dates_known: true
- name_zh: 尹继善
  score: 7
  worth_why: 三十岁总督江南人称小尹；奖掖后进、力保袁枚中选、与钱香树和韵斗诗至马疲人倦，风雅能吏，雅事链完整
  era: 清乾隆
  dates_known: true
- name_zh: 金圣叹
  score: 6
  worth_why: 批点小说开一代风气，虽人多薄之而诗清绝；生平事迹此书仅一鳞，可缓录
  era: 明末清初
  dates_known: true
