category: 诗藏/诗话
verdict: no_value
skip_reason: 《韵语阳秋》为宋人诗话，通篇评骘诗人句法风格与理道劝戒，仅零星引述轶事，无完整做事周期与可考关键决策，人物不构成成事儿时间轴候选
rejections:
- name_zh: 杜甫
  why_not: 仅举其诗例论诗风，未录做事流所需的缘起阶段与结果
- name_zh: 李白
  why_not: 仅作诗句比较与轶谈，且已在库
- name_zh: 陶潜
  why_not: 只评其平澹诗境，无做事周期史料
- name_zh: 谢灵运
  why_not: 仅记梦得池塘春句之谈，不构成完整做事记录
- name_zh: 葛立方
  why_not: 系本书作者，自序仅言著书缘起，事迹简略不足成轴
- name_zh: 梅尧臣
  why_not: 仅摘其论诗名言与送别诗句，无可考完整做事流
