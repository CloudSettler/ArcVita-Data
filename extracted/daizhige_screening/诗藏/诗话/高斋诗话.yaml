candidates:
- name_zh: 苏轼
  score: 7
  worth_why: 传中见其荐秦观于王安石书信、化用老杜诗意作诗，做事流可与其他文献合补，名句与荐才事迹俱可考
  era: 北宋
  dates_known: true
- name_zh: 王安石
  score: 7
  worth_why: 桃源行用事之失、论秦少游诗清新婉丽如鲍谢、辨玚花字义，见其诗歌创作与奖掖后进之事，然本篇仅诗话轶闻片段
  era: 北宋
  dates_known: true
- name_zh: 秦观
  score: 6
  worth_why: 得苏轼荐引、王安石手不释卷之评，见其早年交游与成名之径，然本篇所记零散
  era: 北宋
  dates_known: true
- name_zh: 曾慥
  score: 6
  worth_why: 编《乐府雅词》《宋百家诗选》并有多种著述，编书事业可考，然生卒不详、传文简略
  era: 南宋
  dates_known: false
- name_zh: 章惇
  score: 6
  worth_why: 与刘子先故旧诗往复，得诗大喜即召为宰属迁户部侍郎，一诗进身之决策与结果完整成链，但属小事
  era: 北宋
  dates_known: true
- name_zh: 王禹偁
  score: 5
  worth_why: 读丁谓诗断言其人必不忠且后果如其言，识人之明可为教训，然仅一则轶事
  era: 北宋
  dates_known: true
